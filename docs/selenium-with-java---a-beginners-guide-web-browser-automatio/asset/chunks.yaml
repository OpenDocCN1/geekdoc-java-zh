    \ address or website name. Please contact us at `business@bpbonline.com` with\
    \ a link to the material.\n\nIf you are interested in becoming an author\n\nIf\
    \ there is a topic that you have expertise in, and you are interested in either\
    \ writing or contributing to a book, please visit We have worked with thousands\
    \ of developers and tech professionals, just like you, to help them share their\
    \ insights with the global tech community. You can make a general application,\
    \ apply for a specific hot topic that we are recruiting an author for, or submit\
    \ your own idea.\n\nReviews\n\nPlease leave a review. Once you have read and used\
    \ this book, why not leave a review on the site that you purchased it from? Potential\
    \ readers can then see and use your unbiased opinion to make decisions. We at\
    \ BPB can understand what you think about our products, and authors can see your\
    \ feedback on their book. Thank you!\n\n# Table of Contents\n\n## 1. Introduction\
    \ to Selenium\n- What is Selenium?\n- Why Selenium is popular\n- Components of\
    \ Selenium\n- People behind Selenium\n\n## 2. Preparing System and Application\
    \ Under Test\n- Setting eclipse\n- Create new Java project\n- Adding Selenium\
    \ jars\n- Set browser drivers\n- walkthrough of BPB application\n\n## 3. WebDriver,\
    \ WebElement, and By\n- WebDriver and its purpose\n- Set browser drivers\n- WebElement\
    \ interface\n- Generic structure of WebElement\n- About By\n- By class\n\n## 4.\
    \ Concept of Synchronization\n- Understanding synchronization and its importance\n\
    - Implementing implicit wait\n- Implementing explicit wait\n\n## 5. Working with\
    \ Elements—Form, Table, and Dropdown\n- Working with form elements\n- Working\
    \ with Tables\n- Working with dropdown\n\n## 6. Working with WebElement—Alert,\
    \ Frame, and Window\n- Working with alerts\n- Working with Frame\n- Working with\
    \ window\n\n## 7. Extra Concepts— Actions, Screenshot, WebDriverManager\n- Actions\n\
    - Screenshot\n- WebDriverManager\n\n## 8. What is TestNG\n- Introduction\n- Assertions\
    \ in TestNG\n- Result and reporting in TestNG\n- Passing data in TestNG\n\n##\
    \ 9. Concept of Page Object Model\n- Page object model\n- Implementing page model\n\
    - Page factory\n\n## 10. Data Driving Test\n- Managing data using CSV\n- Managing\
    \ data using Excel\n- Reading data from file\n\n## 11. Introducing Maven\n- Need\
    \ for build management\n- Installing Maven in Eclipse\n- Creating a Maven project\n\
    - What is Maven repository?\n\n## 12. Selenium Grid\n- What is Selenium Grid?\n\
    - Components of Selenium Grid\n- Executing tests in local environment using Selenium\
    \ Grid\n\n# CHAPTER 1: Introduction to Selenium\n\nSelenium automates the browser;\
    \ that is it. What we do with that is entirely to you. One finds this information\
    \ as soon as you open the main page of the selenium website, hosted at the URL—http://www.selenium.dev\
    \ . Currently, the Selenium project consists of three main components—`Selenium\
    \ IDE`, `WebDriver`, and `Selenium Grid`. In this book, we will be looking at\
    \ `webdriver` and `selenium grid` usage using `Java` as a programming language.\n\
    \nStructure\n\nIn this chapter, we will discuss the following topics:\n- What\
    \ is Selenium\n- Selenium is popular\n- Components of Selenium\n- People behind\
    \ the Selenium project\n\nObjectives\n\nAfter studying this unit, you will be\
    \ able to understand:\n- Understand the popularity of Selenium.\n- Have a brief\
    \ idea about Selenium as a tool to automate the Web browser.\n- Know the different\
    \ components of Selenium and where they are used.\n- What is Selenium?\n\nSelenium\
    \ took birth in the year 2004, the idea of it. It was at that time known as `TestRunner`\
    \ and created by `Jason Huggins` while working in the organization ThoughtWorks.\
    \ The tool was created to overcome the challenges faced by the existing set of\
    \ solutions available than the market, and since then, a significant number of\
    \ people, organizations have contributed to this open-source project to make it\
    \ what is today. Simon Stewart showcased at the GTAC conference the `WebDriver`\
    \ version of talking to the browsers, considered more refined than the `JavaScript`\
    \ proxy server version adopted by Selenium, eventually leading these two concepts\
    \ to get married. Selenium married WebDriver became the Selenium WebDriver, which\
    \ we all use as of now. The current stable release available at the time of the\
    \ book being written is `3.141.59`.\n\nWhy Selenium is popular\n\nSelenium popularity\
    \ is primarily due to the fact three important features it has:\n- It supports\
    \ multiple programming languages\n- It supports test execution in multiple operating\
    \ systems\n- It supports test execution on multiple browsers\n\nThis kind of rich\
    \ feature set was rare and is still rare in many of the available commercial,\
    \ free and open-source test automation solutions for Web applications. Another\
    \ reason was the flexibility which the open-source tool provides. They inherently\
    \ come up with the power of adjusting as per the requirements of your project\
    \ instead of making you adjust within the tight boundaries of the tool. Also,\
    \ the cost associated with procuring Selenium was nil. The tool was free to avail.\
    \ Most important factor for Selenium to become widely popular was the strong user\
    \ community behind it, which is still very active and can be found\n\nComponents\
    \ of Selenium\n\nSelenium currently has three major components which are meant\
    \ to solve three important criteria as follows:\n- `Selenium IDE`\n- `WebDriver`\n\
    - `Selenium Grid`\n\nThe following table explains the use of every component:\n\
    (Table content repetitive in source)\n\nTable 1.1: Use of Selenium components\n\
    Components of Selenium\nPeople behind Selenium\n(Table content repetitive in source)\n\
    \nConclusion\n\nIn this chapter, we have been introduced to Selenium as a tool\
    \ to automate the browser. We saw the different components associated with it\
    \ and the different people. We also understood the reason behind its popularity.\
    \ In the upcoming chapter, we will discussing Selenium API.\n\nQuestions\n\n-\
    \ Is Selenium one tool or multiple tools combined under one?\n- What is the current\
    \ stable version of Selenium?\n- What was Selenium known as when Jason Huggins\
    \ created it while working ThoughtWorks?\n- Selenium IDE works on both Chrome\
    \ and Firefox. True or False?\n- Why is Selenium popular?\n\n# CHAPTER 2 Preparing\
    \ System and Application Under Test\n\nIn this chapter, we will set up the IDE\
    \ eclipse on our systems. We will be taking only the Windows system. After setting\
    \ the eclipse as integrated development environment, we will set the jar files\
    \ in the project so that when we write programs using Java as language, our environment\
    \ is able to decipher them. Before we run the tests in the browsers, we also need\
    \ to set drivers for the respective browser, so in this chapter we learn that.\
    \ In the upcoming chapters, we will also see how we can create a Maven project\
    \ and use it to have dependencies managed at run. But for the time being, we will\
    \ be taking the preceding approach. In this chapter, we will also see the application\
    \ we would using to explore Selenium. We will look at some the scenarios provided.\
    \ Besides this, we will also explore a few other applications, which scenarios\
    \ we will using to understand the concepts of Selenium.\n\nStructure\n\nIn this\
    \ chapter, we will discuss the following:\n- Setting right eclipse version on\
    \ system\n- Creating Java project\n- Setting Selenium jars\n- Setting browser\
    \ drivers\n- Walkthrough of BPB application\n- Knowing other applications for\
    \ practice\n\nObjectives\n\nAfter studying this unit, you should be able to:\n\
    - Set up eclipse\n- Create Java project\n- How to add Selenium jars\n- How to\
    \ set the browsers drivers\n- Walkthrough of BPB application\n- Understanding\
    \ other applications\n\nSetting eclipse\n\nBefore we download and set up eclipse\
    \ on the system, we need to ensure we have Java installed. The version of Java\
    \ JDK we require is Java JDK 8 version. To install it, we will need to visit the\
    \ According to the OS we have, we will download the respective file Once downloaded,\
    \ we will install and set up the Java JDK on our system. Please note it is important\
    \ that we need to have Java available on our system before we proceed toward installing\
    \ eclipse. Eclipse is a famous IDE (integrated development environment), which\
    \ is used to create projects using various programming languages. It supports\
    \ Java, Python, Ruby, Ada, C++, Natural, and many more. It is an open-source IDE\
    \ for professional developers, backed by a strong community. More details about\
    \ it can be found\n\nWe will be downloading the Eclipse Photon version to set\
    \ up Selenium 3.141.59 jars. For this, please visit this Download the Eclipse\
    \ IDE for Java Developers, depending upon the OS version you are using.\n\n![](image-aj8007w1.jpg)\n\
    Figure 2.1: Eclipse version\n\nFor example, if you are using Windows 64 bit, download\
    \ that option. Once the .exe file is available, install eclipse on your system.\
    \ After eclipse is installed on your system, you should be able to see an icon\
    \ of it on the desktop, double click on it to launch eclipse. It opens up a pop-up\
    \ to ask you a place for place where you will be storing the eclipse projects.\
    \ ![](image-2ra3xtx5.jpg)\nFigure 2.2: Creating workspace\n\nOnce you set up the\
    \ path to your workspace and click on the Launch button, it will take you to the\
    \ welcome screen, which we will be closing to move forward to create our new Java\
    \ project. ![](image-99pcxeq4.jpg)\nFigure 2.3: Eclipse welcome screen\n\nCreate\
    \ new project\n\nTo create a new Java project in eclipse, we will click on the\
    \ File menu, select and then Java ![](image-9sdw8sc.jpg)\nFigure 2.4: Create new\
    \ project\n\nWe provide the name of the project and select the JRE version. Please\
    \ note it is possible to have more than one version available on the system. ![](image-j228yve.jpg)\n\
    Figure 2.5: Project details\n\nClick on Next, and then click the Finish button.\
    \ This will take you to screen where you will see Work in Package Explorer window\
    \ on the left side, one can expand. The next part is to create a new package and\
    \ create helloWorld.java program to check all settings. For this, right-click\
    \ on src folder, and create a new package. Name it Then right-click on the package\
    \ and select new class, fill in the details. ![](image-um1u6wi.jpg)\nFigure 2.6:\
    \ Hello World java creation\n\nClick on the right side of the package window,\
    \ where helloWorld.java file is opened. A code snippet will be generated. we will\
    \ write a code inside the main method to print hello world on the console. The\
    \ final code would look as follows:\n\n```java\npackage Hello;\npublic class helloWorld\
    \ {\n    public static void main(String[] args) {\n        // TODO Auto-generated\
    \ method\n        System.out.println(\"Hello World\");\n    }\n}\n```\n\nThe output\
    \ of this program is—we see Hello World printed on the console.\n\nAdding Selenium\
    \ jars\n\nThe next step in our project is now to add Selenium jar files. We will\
    \ go to the scroll down to Selenium client and WebDriver bindings. The current\
    \ beta release available is version 3.141.59, which we will download![](image-0ecgnikt.jpg)\n\
    Figure 2.7: Selenium client libraries\n\nOnce we download the ZIP file in our\
    \ system, we will extract jars. These jar files now have to be added to Java project\
    \ in eclipse. For this, we will perform the following steps: Right-click the Java\
    \ project and select ![](image-tuxqs6vc.jpg)\nFigure 2.8: Project properties\n\
    \nNext is select Java Build Path | Libraries | Add External then traverse to the\
    \ path in the system, where you have extracted Selenium jars ![](image-kyfypht1.jpg)\n\
    Figure 2.9: Adding Selenium jars\n\nSelect the two jars available outside, then\
    \ go inside lib folder and add all the jars available in that to the project.\
    \ ![](image-jh6ig1q.jpg)\nFigure 2.10: Selenium jars\n\nOnce all jars are added,\
    \ our project is now ready to accept the Java programs written with Selenium commands.\
    \ Before we write any Selenium commands to drive the browsers, we should be ready\
    \ with the respective drivers for our three browsers: Internet Explorer, Firefox,\
    \ and Chrome, to drive them with commands of our choice.\n\nSet browser drivers\n\
    \nSelenium 3.0 onwards as W3C added it into the regulations to be adopted by the\
    \ browsers to be compatible with Selenium, the onus of providing the drivers so\
    \ that Selenium can talk to you fell on the browsers corporations. So now, chrome\
    \ has to provide a Chrome driver, Internet Explorer has to provide an Internet\
    \ Explorer driver, and Firefox provides geckdriver, which in the Selenium 2.0\
    \ series were maintained and provided by the good people at Selenium. In an ideal\
    \ situation, one should have the latest browser version available on the system\
    \ and then download the compatible driver available with it. Or with respect to\
    \ the browser version available on your system, you can check which driver version\
    \ will be suitable and download that accordingly. So, first of all, create a folder\
    \ in your system on which you have reading and writing rights. In that folder,\
    \ we will be downloading the three different driver executables from the respective\
    \ websites hosting them.\n\nTable 2.1: Browser drivers\n\nOnce these executables\
    \ are downloaded, extract them from their files, and you will find the respective\
    \ .exe files, add them to some folder location and so on. Add this folder to the\
    \ project workspace: ![](image-0ax8yiww.jpg)\nFigure 2.11: Browser drivers\n\n\
    We are now ready to run our simple tests on the system.\n\nWalkthrough of BPB\
    \ application\n\nThroughout the course, we will be using an application to practice\
    \ our concepts. Let us first begin with understanding the workflow of the application.\
    \ The URL of the application is http://practice.bpbonline.com/![](image-t1isamt2.jpg)\n\
    Figure 2.12: BPP practice application\n\nIt is a sample eCommerce application\
    \ with basic workflows, which are as follows:\n- Register user\n- Login logout\n\
    - Search product\n- Buy product\n- Change profile\n- View orders\n\nOur first\
    \ step as we explore the application is to create a new user. To create a new\
    \ user, we will have to use the register user scenario. Let us see the steps using\
    \ which we can do it.\n\nRegister user\n\nTo register the user, we will have to\
    \ perform the following steps: Launch the application using the Click on the My\
    \ Account link, as highlighted in the following image: ![](image-sbd1upw4.jpg)\n\
    Figure 2.13: My Account link\n\nThe page will open is the sign-in page. On this,\
    \ the next step is to click on Continue in the User section to go to the register\
    \ user page. The following image shows it.![](image-yt03frin.jpg)\nFigure 2.14:\
    \ Click continue\n\nOnce we are on the register user page, we need to fill in\
    \ all the mandatory details. Please that the e-mail address and password provide\
    \ here are the same we will use to login as user credentials once we are registered.\
    \ We also need to note here that a dummy-mail address is preferred.![](image-l7zeehe1.jpg)\n\
    Figure 2.15: Register user page\n\nIf the user is registered successfully, we\
    \ should see the following screen: ![](image-fmlt6qd.jpg)\nFigure 2.16: Account\
    \ creation message\n\nPlease note that once the account is created, we should\
    \ be able to use the e-mail address and password combination to login into the\
    \ application. The next step after registering the user is to login into the application,\
    \ using the following steps: Open the application using Click on the My Account\
    \ link as shown in the image: ![](image-j9kxe2n.jpg)\nFigure 2.17: My Account\
    \ link\n\nOn the sign in page, provide the username, and credentials, and click\
    \ the Sign In button: ![](image-we2r9nl.jpg)\nFigure 2.18: Account login\n\nIf\
    \ logged in successfully, we should be able to see the Account Information page,\
    \ where we can see links that allow us to change profile information, view orders,\
    \ modify the password, and so on. The following image shows this:![](image-d4qx14o.jpg)\n\
    Figure 2.19: Account Information page\n\nOur next step is now log off from the\
    \ application to go back to the main page. To perform the log-off operation, we\
    \ will first click on the Log Off link.![](image-0l5hblzx.jpg)\nFigure 2.20: Log\
    \ Off link\n\nThe next step is to click on Continue to proceed with the log-off\
    \ process.![](image-o0zsay.jpg)\nFigure 2.21: Finalizing Log Off\n\nThus, we are\
    \ able to login and log off from the application successfully. In this book, to\
    \ understand the various concepts around Selenium, this would be the default scenario\
    \ we will use. We need to note here that there are other scenarios available in\
    \ the application, such as change profile information, buy the product, view the\
    \ cart, and so more, and it is left to the reader to explore them and note down\
    \ their steps. As where in the book, if we require other scenarios, those are\
    \ then defined in those chapters.\n\nOther applications\n\nIn this book, the default\
    \ application we use is the BPB practice application. But sometimes, to explore\
    \ and understand some concepts, we may use the following applications: Internet\
    \ Herokuapp, the URL of the application is This application is maintained by Selenium\
    \ and provides us with various small examples to explore the working of different\
    \ types of HTML elements. It is a great application to practice, and use to understand\
    \ how Selenium handles various Web elements.![](image-8o55kt9v.jpg)\nFigure 2.22:\
    \ Internet Heroku app\n\nThe other application URLs that we can use to practice\
    \ concepts are any eCommerce website, a website that displays information about\
    \ movies, books, and home decor. In this book, as where we use some other applications\
    \ to understand the scenario, the URL and the flow are explained. Thus, we had\
    \ a look at the applications that we can use to be under test to explore how we\
    \ can automate the scenarios of them using Selenium.\n\nConclusion\n\nIn this\
    \ chapter, we have seen how we can set our system to set up Java, Eclipse and\
    \ use it to set up a project. We then verified if the project actually worked.\
    \ Once confirmed on that front, we downloaded and set up Selenium jars. To ensure\
    \ our project could use the Selenium jars and manipulate the browsers, we downloaded\
    \ and set up the browser drivers, which will act as a communication bridge and\
    \ allow Selenium to communicate with the browser. We also saw a walkthrough of\
    \ the practice BPB application. We saw two scenarios of registered users and login\
    \ logout in detail. We also discussed some other applications which we can use\
    \ to understand and implement scenarios as we learn Selenium. In the upcoming\
    \ chapter, we will talk about the three important pillars of Selenium implementation.\
    \ The WebDriver, which is an interface to talk to the browser. The WebElement\
    \ that provides a method to handle the HTML elements on the page, and the By class\
    \ that helps in creating a locator to identify the element on the page.\n\nQuestions\n\
    \n- What eclipse version have we used here?\n- What Java version have we installed\
    \ in this chapter?\n- What is Photon with respect to Eclipse?\n- What is the name\
    \ of the driver for Firefox?\n- From where can one download the driver for Internet\
    \ Explorer?\n\n# CHAPTER 3 WebDriver, WebElement, and By\n\nSelenium, the popular\
    \ browser automating tool, has three main components: the Selenium IDE, WebDriver,\
    \ and the Grid. In this chapter, we will understand about the three main important\
    \ components of the WebDriver, which are the WebDriver interface, WebElement interface,\
    \ and By class. Any script we write to automate the browser will use the methods\
    \ available in these. The WebDriver interface provides us with various methods\
    \ to automate the browser and fetch information associated with the page. The\
    \ WebElement refers to the HTML element on the page. Finally, the By class helps\
    \ us create locator strategies to locate an element on the page.\n\nStructure\n\
    \nIn this chapter, we will discuss the following topics:\n- WebDriver and its\
    \ purpose\n- Methods of WebDriver\n- WebDriver of three browsers [IE, FF, Chrome]\n\
    - Exceptions related to WebDriver\n- WebElement interface\n- Methods of WebElement\n\
    - Exceptions with WebElement\n- About By class\n- Methods in By class\n- Understanding\
    \ locators\n\nObjectives\n\nAfter studying this unit, you will be able to:\n-\
    \ Learn what is WebDriver, and use its methods to automate the browser.\n- Understand\
    \ what is WebElement, and use its methods to work with elements on the page.\n\
    - Understand the By class used for locator creation and different types of locator\
    \ strategies.\n- Set up browser drivers in the project\n\nWebDriver and its purpose\n\
    \nWebDriver is the main interface that prepares the rules for the browser to follow\
    \ so that it gets enabled for testing. The functionalities this interface focuses\
    \ on: Controlling the browser-related actions such as the opening of a browser,\
    \ the closing of the browser, managing window size, timeout events, and more.\
    \ In the next section, we will discuss methods in detail.\n\nSelecting the Web\
    \ elements\n\nThe WebDriver interface provides two methods to look for the element\
    \ or list of elements. These methods are `findElement` and `findElements` which\
    \ provide us with an element, respectively. Once the element is identified, we\
    \ can proceed with the action on it.\n\nWeb page information\n\nThe WebDriver\
    \ interface provides us method which helps in fetching the current title of the\
    \ page, the current URL, and the content available on the page. The information\
    \ provided by these methods can also be used for validation. In the next section,\
    \ we will first understand how to set WebDrivers for different browsers. After\
    \ that, we will look at the list of methods available with the WebDriver interface\
    \ and their explanations.\n\nSet browser drivers\n\nSelenium 3.0 onwards as W3C\
    \ added it into the regulations to be adopted by the browsers to be compatible\
    \ with Selenium, the onus of providing the drivers so that Selenium can talk to\
    \ you fell on the browsers. So now, chrome has to provide a Chrome driver, Internet\
    \ Explorer has to provide an Internet Explorer driver, and Firefox provides `chromedriver`,\
    \ which in the Selenium 2.0 series were maintained and provided by the good people\
    \ at Selenium. In an ideal situation, one should have the latest browser version\
    \ available on the system and then download the compatible driver available with\
    \ it. Or with respect to the browser version available on your system, you can\
    \ check which driver version will be suitable and download that accordingly. So,\
    \ first of all, create a folder in your system on which you have reading and writing\
    \ rights. In that folder, we will be downloading the three different driver executables\
    \ from the respective websites hosting them.\n\nTable 3.1: Three different driver\
    \ executables\n\nOnce these executables are downloaded, extract them from their\
    \ files, and you will find the respective `.exe` files, add them to some folder\
    \ location like for us; is `driveres` in the project folder. The following image\
    \ shows the driver executables available in the project:\n\n![](image-qbli2prr.jpg)\n\
    Figure 3.1: Driver executables for browsers\n\nLet us see the usage of these WebDriver\
    \ executables to launch browsers Chrome, Firefox, and Internet Explorer, respectively.\
    \ Script to launch Chrome Browser with Application URL:\n\n![](image-dubstfqu.jpg)\n\
    \nAs we can see in the preceding script, the command: `System.setProperty(\"webdriver.driver.chrome\"\
    , \"driveres\\\\chromedriver.exe\")` provides the information where `chromedriver.exe`\
    \ file is available in the system location.\n\nThe next `driver = new ChromeDriver();`\
    \ create an instance of the We should note here for this statement to work; it\
    \ is important that we have imported the correct libraries in the code file:\n\
    \n```java\nimport org.openqa.selenium.*;\nimport org.openqa.selenium.chrome.*;\n\
    ```\n\nThe next step is to use the `get()` method to launch the Chrome browser\
    \ using the URL for the application under. After that, we wait for 5 seconds using\
    \ `Thread.sleep(5000)` command. And then we use the `driver.close()` command to\
    \ close the browser which is opened.\n\nIn the same manner, if we want to launch\
    \ the Firefox browser, we will be importing the library for `chromedriver`, and\
    \ providing the path to `chromedriver` executable file. The script is as follows:\n\
    \n![](image-tucb2a56.jpg)\n\nThe script preceding launches Firefox browser with\
    \ the application URL and then closes it. We need to note that it uses `chromedriver`\
    \ executable file, which is already available in the `driveres` folder of the\
    \ project.\n\nNow for launching Internet Explorer, we will be using the Internet\
    \ Explorer driver executable and will import the respective library to work with\
    \ Internet Explorer browser.\n\n![](image-q8x6dqm8.jpg)\n\nThe script preceding\
    \ launches the Internet Explorer browser with the application URL, and then closes\
    \ it. We need to note that it uses `iedriver.exe` file, which is already available\
    \ in the `driveres` folder of the project. In the next section, we will list out\
    \ the various methods of `WebDriver`, and see a few snippets to understand the\
    \ working of these.\n\nMethods of WebDriver\n\nThe methods associated with `WebDriver`\
    \ are written for the browser object. The interface functions are provided for\
    \ the browser object. Classes such as `ChromeDriver`, `FirefoxDriver`, and other\
    \ browser classes implement the `WebDriver` interface, and thus, when we create\
    \ an instance of the respective browser driver, we are able to access the methods.\
    \ Let us have a look at the methods listed in the following table:\n(Table content\
    \ repetitive in source)\nTable 3.2: Methods of WebDriver\n\nControlling the browser\n\
    \nThe methods which we will be looking in for the browser control are and we will\
    \ take them as examples. As we know the `get()` method allows the opening of the\
    \ browser with the given URL. The `close()` method closes the current browser\
    \ instance opened. The `quit()` method closes all the windows which are opened\
    \ using the current driver, and then `navigate()` method allows us to go to another\
    \ URL. The `manage()` methods have other sub-methods; we will see the usage of\
    \ it to maximize the browser, for example. Let us have a look at the code snippet\
    \ where we try these. Please note that the difference between `close()` and `quit`\
    \ is handled in the chapter Concepts, where we discuss about `switchTo()` method\
    \ of the browser in detail to handle a popup, a frame, or a new window. For now,\
    \ we will look at some of the methods for browser manipulation:\n\n![](image-gtd1ybg5.jpg)\n\
    \nIn this code, we see the `get()` method to launch the browser with the URL;\
    \ the code will maximize the browser window. The next command will navigate to\
    \ the Selenium main website, and finally, `driver.close()` will close the browser.\
    \ In the next section, we will modify the preceding script to add some methods\
    \ which can help print page related information like title, and page content.\n\
    \nWeb page information methods\n\nThe Web page information method are and will\
    \ give page related information which we can use to find out if we are on the\
    \ correct page which we want to continue actions. These methods also allow us\
    \ to perform text-based validation, where we search for text on the page content.\
    \ Let us look at the following code snippet:\n\n![](image-ajaud9yo.jpg)\n\nIn\
    \ the preceding code, we open the application URL and then print the title of\
    \ the page. We then search if the page contains a text—Welcome to BPB PUBLICATIONS\
    \ or not. Finally, we wanted to find if the navigated URL contains the word Selenium\
    \ or not. The output of the preceding code is as follows:\n\nBPB PUBLICATIONS\n\
    Page is loaded\nPage is now changed to Selenium website\n\nIn the next section,\
    \ we will see the usage of and find elements method.\n\nFinding elements methods\n\
    \nLet us say we want to identify the link `My Account` on the web page of our\
    \ BPB application. To perform this action, we will need to use the `findElement()`\
    \ method available with the `WebDriver`. But we also need to know that this method\
    \ takes an input argument. The input argument this method takes is a `By` object,\
    \ which basically provides information about what locator strategy and data we\
    \ can use to identify the element. We also need to understand that the return\
    \ value of this method is an object of the `WebElement` type, on which we can\
    \ perform an action like `click`, to basically automate clicking on `My Account`\
    \ link; let us see the code snippet as follows:\n\n![](image-737b2zu8.jpg)\n\n\
    In the preceding code, we have found the `My Account` link using the link text\
    \ locator strategy, where we have passed the text of the link as `My`. In the\
    \ next section, we will use the `findElements` method to find all the links on\
    \ the home page and print the text associated with them on the screen. The code\
    \ snippet is as follows:\n\n![](image-voy2jj6p.jpg)\n\nIn the preceding code snippet,\
    \ we have used an `xpath` locator strategy to find all links on the Web page.\
    \ The method we used for which returns to us a list of all Web elements. Once\
    \ found, we used a method called `getText()` which is available with `WebElement`,\
    \ to print the text associated with the method.\n\nWebElement interface\n\nA Web\
    \ element is an HTML element, which is used to create and help function a page.\
    \ These are also known as HTML elements. An HTML element is created using HTML\
    \ tags, which are predefined. They can be a link, a table, a form, a button, a\
    \ text box, an image, and so on. Depending on version of the HTML we are using,\
    \ a list of new elements become to us, which are now as well supported by the\
    \ browsers. The latest version provided by the HTML 5 version.\n\nGeneric structure\
    \ of WebElement\n\nA HTML element is generally represented as follows:\n`<TAG\
    \ PROP=VAL PROP=VAL .. TAG>`\n\nSo at first, the HTML tag starts, it is then followed\
    \ by a group of property-value pairs, and then the HTML tag closes. The HTML tags\
    \ are already predefined in the W3C page, as discussed earlier. With the help\
    \ of these Web elements, the pages are designed, and they function to achieve\
    \ objective. The properties used to declare element displays them on the page\
    \ and are later used by automation tools to identify them uniquely on the page.\n\
    \nMethods of Web Elements\n\nEach Web element has different functions associated\
    \ with them. Some are used for presentation purposes; some are used to group together\
    \ information. Elements like links, images are used for referencing other pages.\
    \ Others like span and div help create overlays. Selenium library for Web elements\
    \ interface defines different methods, which we can use on the Web elements to\
    \ help us achieve business scenarios in action.\n\n refer to the link: https://www.selenium.dev/docs/api/java/org/openqa/selenium/WebElement.html\n\
    \nIn the following table, we are going to see the names of the various methods\
    \ declared, along with the purpose they we use them in the scripts. For the approach\
    \ to use them and their return values, please refer to the link shared in the\
    \ preceding note. Let us see them in the following table:\n\nunderstand the working\
    \ of the WebElement methods, we will first see the methods which perform some\
    \ action on the Web elements on the page like `click`, `clear`. Then we will see\
    \ the methods which have to `get` word before them, which fetch information associated\
    \ with the Web elements on the page. After that, we will see the methods and provides\
    \ information about the state of the method. The `findElement()` and `findElements()`\
    \ method work the same as described preceding for the Web page. And we will see\
    \ their usage when we discuss the handling of dropdown and Web table elements\
    \ in the upcoming chapters.\n\nAction methods on WebElement\n\nTo understand the\
    \ action methods like `clear()` for `WebElement`, we will use the BPB application.\
    \ Here, after opening the page, we will first clear the search text box, then\
    \ type a search text on it, and click on the search icon. The following image\
    \ shows us the highlighted part:\n\n![](image-vz77z0bw.jpg)\nFigure 3.2: Home\
    \ Page with search box\n\nThe code snippet is as follows:\n\n![](image-4jmr5hd0.jpg)\n\
    \nIn this code, we first find how to identify the search text box, which we do\
    \ use the `name` locator strategy, and then, we clear its content, if any, and\
    \ then use the `sendKeys()` method to type text on it. Here, we need to note that\
    \ the `sendKeys()` method doesn’t by default clear the contents of the textbox,\
    \ and if something is written before, it will start typing from after it. We then\
    \ identify the quick find icon using locator strategy and on it perform the click\
    \ action. In the next, we will see some of the methods that help us fetch information\
    \ about the Web elements.\n\nFetching information methods on WebElements\n\nTo\
    \ understand the working of the `get` methods like `getTitle()`, `getUrl()`, `getText()`,\
    \ `getText()`, `isDisplayed()`, `isEnabled()`, `isSelected()`, `getAttribute()`,\
    \ `getSize()`, `getLocation()`, `getRect()`, `getEnabledSize()`, `getEnabledLocation()`,\
    \ `getCssValue()`, `getTagName()`, `findElement()`, and `findElements()`, we will\
    \ be looking at the list of methods available with the `WebDriver`.\n\nTable 3.3:\
    \ Various methods and their purpose"
