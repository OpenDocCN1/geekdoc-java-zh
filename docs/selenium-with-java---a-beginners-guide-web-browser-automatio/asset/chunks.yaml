    are a lot of people behind Selenium; rather, it is a fine example of a tool that
    has been driven and maintained by a community rather than made popular by them.
    What started as a work project in 2004 in the organization ThoughtWorks by Jason
    Huggins was made open source to the world. A good history about its usage, adaptation,
    and different avatars it took is available here Selenium IDE was first created
    by Shinya Kasatani in Japan, this was later picked up by Mike Williams from ThoughtWorks,
    and now this project is supported by the organization Applitools, Dave Haeffner,
    and the team takes care of it. Google started using Selenium grid internally and
    revealed this at the GTAC conference; this was done by Jennifer Bevan, who eventually
    became one of the contributors to the Selenium project. Haw-Bin Chai is the person
    behind the concept of locators UI-Elements used in Selenium. And we all now know
    about Simon Stewart, the one who came up with WebDriver, and is now the current
    founding father of Selenium as we know it. Conclusion In this chapter, we have
