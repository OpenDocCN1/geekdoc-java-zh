    by giving others. My children Neeal and Maisha who remind me to be a child at
    heart always. My sister Dr Mahak for her endless patience, and our conversations
    about life, environments, politics, humour and of course relatives. I would like
    to thank Manish Jain, for giving me the opportunity with BPB Publications, and
    help me achieve my dream of becoming a writer. The editor and technical team at
    BPB Publications for their continuous support. Finally my immense thanks to the
    various form Almighty takes, and allows me to experience its endless wisdom, as
    I live.Preface Selenium automates the browser, what we do with that power is up
    to us. This is the message which we get the first time we visit the official website
    of Selenium. It is the most popular open source solution to automate the web browser,
    and is freely available to anyone and everyone to use. People who are into web
    application testing, have been using Selenium for many years now. It helps automate
    mundane tasks, achieve efficiency, and accuracy which in the end improves the
    test process. Selenium power lies in the fact that it can be implemented using
    any programming language, can automate any web browser which is W3C compliant,
    and can run on any operating system. Selenium project and WebDriver merged to
    make Selenium WebDriver, which is now a W3C standard. This means any web browser
    which is W3C compliant can be automated using Selenium. Various versions of Selenium
    are used across projects both small and big. The version of Selenium which we
    have used in this book is 3.141.59\. The implementation of Selenium in this book
    is done using Java as a programming language. In this book we have tried to cover
    the basic classes and interfaces of Selenium which help us automate the browser
    and browser elements. We have covered the importance of data and object management
    outside the test scripts, and also covered the implementation of the same. We
    talk about the popular unit test framework TestNG, and understand its various
    dimensions which we can use in the our test automation projects. We in the end
    learn about how we can set our tests for execution in parallel using Selenium
    Grid for different test environments. Over the 12 chapters in this book, you will
    learn the following: Chapter 1 – Learn about what is Selenium. Get introduced
    to the three projects under Selenium. The Selenium IDE, Selenium WebDriver and
    Selenium Grid. Chapter 2 – Learn about how we set up our system environment to
    write test scripts, and automate browser using Selenium. Learn about the different
    applications and scenarios we will be automating to understand Selenium. Chapter
    3 – Learn about the three pillars of Selenium Java client library, WebDriver which
    automates the web browser. WebElement, which handles automation of html elements
    on page. And the By class which help us create locators to locate web element
    on page. Chapter 4 – Understand the importance of synchronization, and how to
    implement in the test scripts. Chapter 5 – Understand how to handle and automate
    different html elements like form elements, table, drop down Chapter 6 - Understand
    how to handle and automate web elements like frame, alerts and window. Chapter
    7 – Learn about some advance concepts like handling of keyboard and mouse events
    using action class. Capturing screenshot. And manage browser drivers using webdrivermanager
    class. Chapter 8 - Learn about what is TestNG, understand its various features
    which help in test automation projects. Chapter 9 – Learn the importance of object
    management outside the test scripts. And understand how to implement it using
    the design pattern page object model. Chapter 10 – Learn about the importance
    of managing data outside the test scripts. Also learn about implementing reading
    of data from external data files like csv, and excel. Chapter 11 – Get introduced
    to a project life cycle management tool Maven. Understand its importance in managing
    project which uses open source solutions. Chapter 12 – Learn about Selenium Grid,
    the component of Selenium which allows test suite execution to happen in parallel
    across different environments.Code Bundle and Coloured Images Please follow the
