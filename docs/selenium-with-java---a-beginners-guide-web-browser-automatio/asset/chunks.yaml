    thing to do is take care of the synchronization between these two independent
    processes. There are two independent processes that take place as we use a tool
    to drive the browser and perform actions on the Web application. The tool Selenium
    used here will execute the command to drive the Web browser and perform an action
    on the Web application, and the Web application will execute those actions as
    per its processing speed. If we do not synchronize these two processes, our script
    will fail, and we will not be able to effectively and with reliability execute
    our scripts to test the application. The reason for this would be that from the
    script, Selenium would try to identify the element on the Web page, but for various
    reasons listed in the unhappy situation, the object or the page itself may not
    be loaded and may cause inconsistent behavior with our scripts written to test
    the application. In the following section, we will learn how we can implement
    synchronization in the script to ensure the two independent processes are aware
    of each other’s existence. Types of synchronization We have learned so far the
    importance of synchronization. In this section, we will learn how we implement
    it in the test scripts and what the approaches are for it. There are two approaches
    as follows:  Implicit wait Explicit wait Implicit wait is also known as global
    wait. It is generally implemented immediately after the WebDriver object is initialized.
    Once implemented, this wait holds true for every statement in the script. Explicit
    wait is known as a local wait. It is used in places in the script which may require
    more wait time. Generally, when we are using the explicit wait, we set the implicit
    wait to zero, else they may both interfere with each other. When we use explicit
    wait, we need to have a condition in which we will be waiting to be completed,
    or the wait will timeout in the specified number of seconds. To create a condition
    for the explicit wait, there is a class available in Selenium known as the The
    class has a large number of implemented methods, which we can use to form a condition.
    We will know more about it in the section for explicit wait. In the next section,
    we will see the implementation. Scenario To implement the implicit and explicit
    wait in action, we will pick up a scenario of login from the application using
    valid user information. Let us first understand the following steps for it. Login  Open
    the application using the Click on My Account link. Provide and Click on Sign
    in button. Click on Log off link Click on Continue button As per the preceding
    steps, we launch the application on a browser and click on the My Account link
    (as shown in the following figure). ![](image-4marn9mp.jpg) Figure 4.3: Home page
    of application We then provide a valid username and password information and then
    click on the Sign In button as shown in the following figure. ![](image-egcpsyth.jpg) Figure
    4.4: Login to the application If the information is correct, we will see the My
    Account Information page as shown in the following figure: ![](image-btsimvtk.jpg) Figure
    4.5: Page after Login Here, we then click on Log Off and continue button to come
    back to the home page: ![](image-vpxe0t98.jpg) Figure 4.6: Logout page of the
    application In the preceding scenario, we need to notice the changes of the page
    in the application as we perform an action on different elements. For example,
    if we click on the My Account link, we go to the page where we need to fill in
    the information for username and password. And when we click the sign in button,
    we go to the My Account Information page, where we see the log-off link. We click
    on the log-off link and see the continue button, and after clicking it, we are
    back to the home page. In each step, our script will have to be made smart to
    wait for an element to appear. If the element does not appear within a given time
    period; then, throw an exception of Time Out and end the execution. The first
    type of wait which we will see is implicit wait, which is introduced in the script
    and acts for every statement in the script. It is also known as a global wait.
    After that, we will see an explicit wait, which is known as local wait and is
    introduced at the script in a place, which requires more time to wait than the
    global time set. And as explained earlier, we do not use these waits together
    as they might interfere with each other. So, when we are using explicit wait,
    we set the implicit wait time to zero. Implementing implicit wait To implement
    the implicit wait, we use the following command: //add implicit wait driver.manage().timeouts().implicitlyWait(10,
    TimeUnit.SECONDS); Here, the driver is an instance of the ChromeDriver and uses
    its method manage. The manage method has timeouts, where we chose the option of
    The arguments that we pass to this method are the time unit which we want to use
    and the quantity of that unit. So here, we choose to implicitly wait for the 10
    seconds. This command which is used will work for every statement written in the
    script. It will wait for an element to be available for the most 10 seconds; if
    within 10 seconds, the element has appeared, it will perform the action and move
    on to the next statement in the script. If for some reason, the element is not
    available and 10 seconds have passed, this situation then leads to an exception
    of Let us see the following login script using implicit wait: ![](image-mvcg2tik.jpg) ![](image-w8npn2vm.jpg) Implementing
    explicit wait We implement explicit wait or local wait in situations where a certain
    section of our script requires more time than the global timeout set. In these
    situations, it is not advisable to increase the entire global timeout because
    if for some reason the script starts failing, for every step, we will be waiting
    as per the duration set in the global timeout. We need to understand that there
    exists a thin line between synchronization and the speed of the script. And it
    takes a little time and a few executions to set up the balance of them. To implement
    explicit wait, we will be using Selenium’s WebDriverWait interface and the ExpectedConditions
    interface. Before we move further, let us first talk about these two entities. The
    WebdriverWait interface provides us with a method until(). This method takes an
    argument of type Expected conditions are a class of Selenium WebDriver, which
    provides us with a large number of methods to detect an event happening. For example,
    and so on and so forth.  Tip: More such information for ExpectedConditions methods
    are available in  The WebDriverWait interface takes an instance of the driver,
    a timeout, and an object of as it gets implemented. Let us take a scenario where
    we want to implement a local wait or the explicit wait. We will take the login
    scenario and put a WebDriverWait for the appearance of Log Off link as shown in
    the following script. Only if the Log Off link appears, we will go ahead and proceed
    with logout. ![](image-ihv4hczh.jpg) In the preceding code, we should also notice
    that before using we set the implicit wait to 0, and after explicit wait usage
    is over, we set it back to 10 seconds. We need to note here is that we do not
    use both implicit and explicit wait at the same time in the code. If we are implementing
    explicit wait, we make the implicit wait to 0. The reason for this is that these
    waits can interfere with each other and can cause run time execution issues in
    our code. Encountering exceptions As we use the wait commands of two kinds with
    Selenium, we can encounter the following exceptions: No Such Element and the The
    NoSuchElementFound exception is seen when the script waits for an element to appear
    on the page with the given locator technique but is unable to find it within the
    given time duration. The TimeOutException is generated when the script is unable
    to find the element, with the given locator, it causes NoSuchElementFound exception,
    which further calls the as we are unable to find the element in the given duration.
    So, the expected conditions method presenceOfElementLocatedBy (as shown in the
    following code) throws the NoSuchElementFound exception, which further causes
    the timeout exception to come. To see this, we can deliberately try and find a
    link using the link text JUNK. Since junk does not exist, after 10 seconds of
    waiting using we will see the which internally is generated because this element
    does not exist. ![](image-3p2yg6a2.jpg) Exception raised as shown in the following
    script: Exception in thread "main" org.openqa.selenium.TimeoutException: Expected
    condition failed: waiting for presence of element located by: By.linkText: Junk
    (tried for 10 second(s) with 500 milliseconds interval)atatatCaused by: org.openqa.selenium.NoSuchElementException:
    no such element: Unable to locate element:(Session info: Conclusion Hence, we
    have learned in this chapter about the need for waits in our automation scripts,
    the types of waits in Selenium, and how we can implement it. In the upcoming chapter,
    we will discuss about working with different types of HTML elements like form
    elements, Web tables, and dropdown elements. Questions  Why do we need synchronization
    in our automation scripts? Explain the meaning of implicit wait and how is it
    implemented? What is ExpectedConditions class in Selenium? Which exception comes
    when WebDriverWait fails?CHAPTER 5 Working with WebElements—Form, Table, and Dropdown In
    the earlier chapters, we discussed about the Selenium libraries, the methods available
    with them to handle browser, Web element, and create locators. We also discussed
    about how we can use the concept of waits to ensure reliability with our scripts,
    at the same time, taking care of the speed of the execution. In this chapter,
    we will discuss about working with different HTML elements, the type of action
    we perform on them during automation, and how Selenium allows us to work on them.
    We will discuss the form HTML elements, the Web table element, and the dropdown
    in Part 1\. Structure The chapter is divided into the following sections:  Working
    with form elements such as textbox, radio button, checkbox, and so on Working
    with the Web Table element Working with the Dropdown element Objectives After
    studying this chapter, you will be able to perform the following:  Automate the
    handling of the form HTML elements Understand and work with the Web table elements Understand
    and work with the dropdown elements Working with form elements Form is an HTML
    tag, which contains different types of HTML elements. The form element is used
    in HTML websites to capture user input. The information is generally sent to the
    server for further work. The form element in HTML is represented as, and it acts
    as a container for different elements such as text boxes, radio buttons, submit
    buttons, checkboxes, and so on. All these different elements are represented with
    the HTML tag The different types of input elements are available as follows: follows:follows:
    follows: follows: follows: follows:follows: follows: follows: follows:follows:
    follows: follows:follows: follows: follows: follows:follows: follows: follows: Table
    5.1: Different types of input elements In our practice application, the scenario
    of change profile information is where we will see most of the input elements
    from table Let us explore that section. For the change profile scenario, we will
    have to perform the following steps:  Open the application using URL: Click on
    the My Account link as shown in figure ![](image-cmvgwa4w.jpg) Figure 5.1: My
    Account link On the Sign In page, provide the login details: username is bpb@bpb.com
    and password is Click on the Sign In button as shown in Figure ![](image-dbk448ii.jpg) Figure
    5.2: Sign In page In the preceding figure, we see the following input elements:
    text and password. After signing in, you reach the My Account Information page.
    Here, we need to click on the link which says, View or change my account ![](image-o2e5r9dk.jpg) Figure
    5.3: My Account Information page This will take us to the Change Profile page.
    On this page, we see the input element text and radio. ![](image-l85yx3cf.jpg) Figure
    5.4: Change Profile page We can edit any information in the profile section; let
    us say we want to modify the Telephone Number and If the Male radio button is
    selected, we go ahead and click on Female radio button or vice versa. We will
    then clear the contents of the field and then type in the telephone number, and
    click on the Continue button for the change profile action to complete. ![](image-uoxa0e2y.jpg) Figure
    5.5: My Account Information page We can now click on the Log Off link and continue
    to log off from the account, and go back to the home page: ![](image-sgl2hd21.jpg) Figure
    5.6: Log off link  Please note that in all these steps, we are not adding any
    validations. Selenium library does not, by default, have any validation support,
    as that is not a browser action. To add validation to the preceding scenario and
    make it into a test case, we will have to use a unit testing framework. We can
