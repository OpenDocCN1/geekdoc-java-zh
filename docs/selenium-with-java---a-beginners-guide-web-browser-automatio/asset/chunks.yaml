    or the test process may undergo changes, it is very much likely that the data
    used in test scripts also undergo changes. So, it is imperative that we manage
    data used in test scripts external to our test logic. Also, we may have some environment
    configuration data such as application URL, some file paths for reports, logs,
    and so on, which should also be managed externally. In this chapter, we will see
