    ![](image-azfk4kew.jpg) www.bpbonline.com\n\nDedicated to Neeal and Maisha & Dr\
    \ Neelaksh and Dr Manju My kids who continue to make me see the wonders of life.\
    \ And my parents because of them I am.\n\n# About the Author\n\nPallavi Sharma\
    \ is a multiskilled professional who dons many hats. She started her career as\
    \ a Research Scholar under Dr Naren Ramakrishnan at Virginia Tech where she worked\
    \ on Data mining project for bioinformatics. At Crestech Software Systems she\
    \ was part of the Centre of Excellence Team under the CEO, which was responsible\
    \ for providing cutting edge solutions to the delivery team. She has worked on\
    \ tools like `Selenium`, `Watir`, `RFT`, `JMeter`, `LoadRunner`, `Rational Robot`\
    \ and similar tools.\n\nShe managed the team of developers, testers, support function,\
    \ presales, marketing and technical writing for the inhouse product `OpKey`. She\
    \ also managed the company patent and trademark division.\n\nIn 2014 she founded\
    \ 5 Elements Learning, where she coach people on `Selenium`, `Appium`, `Cucumber`\
    \ ecosystem, which includes tech stack for test automation project. She coach\
    \ using programming languages like `Java`, `Python`, `CSharp` and `Ruby`. She\
    \ has taught more than 1000 people from across the globe. She is also an instructor\
    \ at `Udemy`, with more than 20K followers, and have many paid and free courses\
    \ hosted for testers.\n\nShe continues to be an active participant for various\
    \ global conferences like `Selenium Summit`, `APISummit Delhi Software Testing\
    \ Conference`, `Selenium India Conference`, `Global Testing Retreats`. She has\
    \ participated as Jury, Organizing Committee Member, and as Speaker. She grateful\
    \ to be mentored and taught by Michael Bolton and Maaret Pyhäjärvi on the concepts\
    \ of Exploratory Testing.\n\nShe is a Steering Committee member with Agile Testing\
    \ Alliance, since 2021, and a long time advisory board member. Her work involves\
    \ designing programs on various global certifications on automation, organizing\
    \ conferences, and handle the social media presence of Agile Testing Alliance,\
    \ with a team.\n\nShe is a published author with BPB publications. Her first book,\
    \ `Selenium with Python A beginner's book` is among the top 10 books on amazon\
    \ for the category. Her second book `Selenium 4 – A Quick and Practical Guide`\
    \ is available on LeanPub.\n\nShe believes in certifying her learnings, and holds\
    \ various certifications like `ISTQB`, `CP-SAT`, `CP-WST`, `CP-DOF`, `Cucumber\
    \ School Completion`, `SpecFlow` among others.\n\nShe is an an avid reader, traveller,\
    \ and a writer at heart. She enjoys fiction, non fiction books, and writing poetry,\
    \ short stories on her life experiences. She shares her work on `Medium`, and\
    \ could be found at - She is a firm believer in larger good, and likes to live\
    \ by example. Organization like `eVidyaloka`, `People for Animal`, `WildLife SOS`,\
    \ and `Jabarkhet forest reserve` is where she dedicates her resources.\n\n# About\
    \ the Reviewer\n\nJaya Saini has 6.5 years of experience in Automation testing\
    \ and API testing using tools like `Selenium`, `TestNg`, `Robot Framework`, `Postman`,\
    \ with programming languages like `Java`, `JavaScript` `Python`, and more. Jaya\
    \ Saini pursued B.Tech in Computer science and engineering from Rajasthan Technical\
    \ University, Alwar. She has worked with companies like `Sopra Banking` and `Thinksys\
    \ software`. She is currently working as Automation acting Test lead in Thinksys\
    \ software, Noida.\n\n# Acknowledgement\n\nThere are a few people I want to thank\
    \ for the continued and ongoing support they have given me during the writing\
    \ of this book. First and foremost, I would like to thank the creator of `Selenium`\
    \ `Jason Huggins`, and creator of `Selenium Webdriver` `Simon Stewart` for their\
    \ creation. The people behind the `Selenium` project and community, who continue\
    \ to work for the project and make it available for the world.\n\nI would like\
    \ to thank my husband Ravinder for his unconditional love, and silly jokes. My\
    \ parents for setting example to live life by giving others. My children Neeal\
    \ and Maisha who remind me to be a child at heart always. My sister Dr Mahak for\
    \ her endless patience, and our conversations about life, environments, politics,\
    \ humour and of course relatives.\n\nI would like to thank Manish Jain, for giving\
    \ me the opportunity with BPB Publications, and help me achieve my dream of becoming\
    \ a writer. The editor and technical team at BPB Publications for their continuous\
    \ support. Finally my immense thanks to the various takes, and allows me to experience\
    \ its endless wisdom, as live.\n\n# Preface\n\nSelenium automates the browser,\
    \ what we do with that power is to us. This is the message which we get the first\
    \ time we visit the official website of Selenium. It is the most popular open\
    \ source solution to automate the web browser, and is freely available to anyone\
    \ and use. People are into web application, have been using Selenium for years\
    \ now. It helps automate mundane tasks, achieve efficiency, and accuracy which\
    \ in the end improves the test process. Selenium power lies in the fact it can\
    \ be implemented using any programming language, can automate any web browser\
    \ which is W3C compliant, and can run on any operating system. Selenium project\
    \ and WebDriver merged to make Selenium WebDriver, which is now W3C standard.\
    \ Various versions of Selenium are used across projects both small and big. The\
    \ implementation of Selenium in this book is done using Java as a programming\
    \ language. In book we have tried to cover the basic classes and interfaces of\
    \ Selenium which help us automate the browser and elements. We have covered the\
    \ importance of data and object management outside the test scripts, and also\
    \ covered implementation of the same. We talk about the popular unit framework\
    \ `TestNG`, and understand its various dimensions which we can use in our test\
    \ automation projects. In the end learn about how we can set tests for execution\
    \ in parallel using `Grid` for different environments.\n\nOver 12 chapters in\
    \ this book, you will learn the following:\n\n- **Chapter 1** – Learn about what\
    \ is Selenium. Get introduced to the three projects under Selenium. `Selenium\
    \ IDE`, `WebDriver` and `Selenium Grid`.\n- **Chapter 2** – Learn about how we\
    \ set up our environment to write test scripts using Selenium. Learn about the\
    \ different applications and scenarios we will be automating to understand Selenium.\n\
    - **Chapter 3** – Learn about the three pillars of Selenium `Java` client library,\
    \ `WebDriver` which automates the web browser, `WebElement`, which handles automation\
    \ of html elements on page. By class.\n- **Chapter 4** – Understand the importance\
    \ of synchronization, and how to implement in the test scripts.\n- **Chapter 5**\
    \ – Understand how to handle different html elements like form elements, table,\
    \ drop down\n- **Chapter 6** – Understand how to handle web elements like frame,\
    \ alerts and window.\n- **Chapter 7** – Learn about some advance concepts like\
    \ handling of keyboard and mouse events using `action` class. Capturing screenshot.\
    \ And manage browser drivers using `webdrivermanager` class.\n- **Chapter 8**\
    \ – Learn what is `TestNG`, understand its various features which help in test\
    \ automation projects.\n- **Chapter 9** – Learn the importance of object management\
    \ outside test scripts. And understand how to implement it using the page object\
    \ model.\n- **Chapter 10** – Learn about importance of managing data outside test\
    \ scripts. Also learn about implementing reading of data from external files like\
    \ `csv`, and `excel`.\n- **Chapter 11** – Get introduced to project life cycle\
    \ management tool `Maven`. Understand its importance in managing project which\
    \ uses open source solutions.\n- **Chapter 12** – Learn about Selenium Grid, the\
    \ component of Selenium which allows suite execution to happen in parallel across\
    \ different environments.\n\nCode Bundle and Coloured Images\n\nPlease follow\
    \ the link to download the Code Bundle and Coloured Images of the book: `https://rebrand.ly/9dd688`\
    \ The code bundle for the book is also hosted on GitHub at In case there's an\
    \ update to the code, it will be updated on the existing GitHub repository. We\
    \ have code bundles from our rich catalogue of books and videos available at Check\
    \ them out!\n\nErrata\n\nWe take immense pride in our work at BPB Publications\
    \ and follow best practices to ensure the accuracy of our content to provide with\
    \ an indulging reading experience to our subscribers. Our readers are our mirrors,\
    \ and we use their inputs to reflect and improve upon human errors, if any, that\
