    ## 第 6 章：操作 WebElement—警报框（Alert）、框架（Frame）、IFrame 和窗口（Window）


    在前一章中，我们学习了对不同类型 HTML 元素的处理，例如输入元素、Web 表格和下拉列表元素。在本章中，我们将学习如何自动化处理 JavaScript
    警报框（也称为弹出窗口）、`Frame` 元素、`IFrame` 元素、HTML 窗口以及 `action` 类，后者用于处理高级的鼠标和键盘操作。


    ### 结构

    本章分为以下部分：

    - 操作 JavaScript 警报框

    - 操作 Frame 和 IFrame 元素

    - 操作 HTML 窗口

    - 操作 action 类


    ### 目标

    阅读本章后，你将能够：

    - 使用 Selenium 中的 `Alert` 类处理弹出窗口。

    - 与 `IFrame` 元素工作。

    - 自动化打开新窗口的场景。


    ### 操作 JavaScript 警报框

    JavaScript 警报框或弹出窗口出现在各种应用程序中。这些弹出窗口可以提供信息或请求用户操作。在处理弹出窗口之前，我们无法在应用程序上进行任何操作。JavaScript
    警报框有三种：

    - Alert 框（Alert box）

    - 确认框（Confirm box）

    - 提示框（Prompt box）


    Alert 框用于向用户提供信息，用户通常通过点击 `OK` 按钮来处理![](img/image-9c1v239.jpg) 图 6.1：Alert 框


    确认框用于用户验证或拒绝某操作。它通常有一个 `OK` 或 `Cancel` 按钮。用户可以通过点击来处理它![](img/image-zgblry3o.jpg)
    图 6.2：确认框


    最后，提示框用于我们需要用户提供某些信息的情况。用户必须输入内容，然后点击 `OK` 或 `Cancel` 按钮![](img/image-f5u7b.jpg)
    图 6.3：提示框


    为了处理这些警报，Selenium 中有一个名为 `Alert` 的单独接口。详情位于：`https://www.selenium.dev/selenium/docs/api/java/org/openqa/selenium/Alert.html`


    `Alert` 接口有四个方法，如下表所示：表 6.1：接口的方法


    为了理解警报的处理，我们将从 internet Heroku 应用程序查看它们的工作。在该网站上找到所有的警报。为了处理第一种 Alert 框，我们将执行以下操作：

    1. 使用 URL 打开应用程序：`https://the-internet.herokuapp.com/javascript_alerts`

