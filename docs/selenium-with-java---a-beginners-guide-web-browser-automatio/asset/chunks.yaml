- fmt: "\nThis table on the Web page will appear as follows: ![](image-1m9fo6xn.jpg)\
    \ Figure 5.7: Output \n\nWe find the Web Tables generally used in HTML pages to\
    \ represent information in a tabular manner, which appears neat and organized.\
    \ The Web Table can contain static information, or at the time of page rendering,\
    \ it can pick up dynamic information. This depends on the Web application. In\
    \ this chapter, we will see how we can iterate a Web table, and fetch information\
    \ from each cell, and print that on the console. This is one of the examples to\
    \ work with Web tables; there could very well be others. The idea is to understand\
    \ how to handle them and then implement this depending on the requirement we have\
    \ for automation. \n\nFor this, we will look at the home page of the application.\
    \ We see the product listed as the following image shows: ![](image-jhgp0fcf.jpg)\
    \ Figure 5.8: The home page of the application \n\nIf we look at this using the\
    \ chrome inspect, we will see the table element which contains this information.\
    \ ![](image-6lki5rkd.jpg) Figure 5.9: The Chrome inspects \n\nLet us look at the\
    \ information contained in one table cell of this product table: ![](image-xwsmu3ej.jpg)\
    \ Figure 5.10: HTML content of a table cell \n\nAs we see in figure the table\
    \ cell contains two anchor tags and a text that shows the price of the product.\
    \ One anchor tag displays the image of the product, and the other takes us to\
    \ the product page. In the script, which we will write, we will iterate through\
    \ this table and print the contents of the table. The steps which we will do in\
    \ our script are as follows: \n\n1. Open the Web application using the URL.\n\
    2. Identify the table element using the HTML tag property as there is only one\
    \ table on the page, and that does not contain any attribute which we can use\
    \ to identify it. ![](image-tmx0vr5r.jpg) Figure 5.11: The table element \n3.\
    \ Once we have the table element, we will find out how many tables row it contains\
    \ by using the `findElements` method and look for the tag, and then, we will take\
    \ each row and find out how many table data tags it contains, using the `findElements`\
    \ method only.\n4. Once we have found the table cell, we will print its text contents\
    \ on the console. \n\nHere, it is a good idea to note that the Web Table of the\
    \ HTML page works as a two-dimensional array, and like it, we have rows and columns,\
    \ and we need two loops to iterate through it. \n\nLet us look at the following\
    \ code now: ![](image-hawmi4fq.jpg) ![](image-l593ojaq.jpg) \n\nThe output of\
    \ the preceding program prints information on the console, which is as follows:\
    \ ![](image-i0cvhy3r.jpg) Figure 5.12: Output of the program \n\nSo, here we have\
    \ seen how we can handle a Web Table and fetch contents present in the table cell.\
    \ In the last section of this chapter, we will talk about the dropdown element.\n\
    \n## Working with dropdown\n\nThe dropdown element is represented using the `<select>`\
    \ tag. It is also a container tag and it contains `<option>` as the child tag.\
    \ An example of the dropdown is shown as follows: Figure 5.13: Dropdown example\
    \ \n\nWhen the preceding HTML renders on the Web page, it is displayed as follows:\
    \ Figure 5.14: Dropdown HTML view \n\nTo know more about the dropdown element,\
    \ refer to the. The dropdown element in Selenium is not handled using the `WebElement`\
    \ interface. Rather the dropdown element has its own separate class known as the\
    \ `Select` class. Its details are available here: `https://www.selenium.dev/selenium/docs/api/java/org/openqa/selenium/support/ui/Select.html`\n\
    \nThe reason for a separate class is that there are some very specific actions\
    \ associated with the dropdown element, which are not available with the other\
    \ Web elements. To understand these actions, we need to first understand the dropdown\
    \ element HTML information. Let us look at the preceding dropdown HTML again:\
    \ Figure 5.15: HTML content of dropdown \n\nAs we see in this HTML code, the `<select>`\
    \ tag is a parent tag inside which the child tag of `<option>` is available. The\
    \ `<option>` tag contains a field called `value` and a text is associated with\
    \ it. This is the text which we see on the Web page. For example, `<option _=\"\
    \" span=\"\">value=\"japan\">JAP</option>` code displays `JAP` on the Web page.\
    \ But at the backend, this is the information associated with it. Keeping this\
    \ in mind, we will not look at the different methods available to us with `Select`\
    \ class and look at some of them at the code level.\n\nTable 5.2: Different methods\
    \ available to us with select class\n\n## CHAPTER 6: Working with WebElement—Alert,\
    \ Frame, IFrame, and Window\n\nIn the previous chapter, we saw handling of the\
    \ different types of the HTML elements, such as the input elements, the Web table,\
    \ and the dropdown element. In this chapter, we will learn how to automate the\
    \ handling of JavaScript alerts, also known as popups, the `Frame` element, the\
    \ `IFrame` element, the HTML window, and the `action` class, which is used to\
    \ handle advance mouse and keyboard actions.\n\n### Structure\nThe chapter is\
    \ divided into the following:\n- Working with JavaScript alerts\n- Working with\
    \ Frame and IFrame element\n- Working with HTML window\n- Working with action\
    \ class\n\n### Objectives\nAfter reading this chapter, you will be able to:\n\
    - Use the `Alert` class in Selenium to handle popups.\n- Work with the `IFrame`\
    \ element, and handle objects which are inside an `IFrame`.\n- Automate scenarios\
    \ when a new window opens.\n\n### Working with JavaScript alerts\nThe JavaScript\
    \ alerts or popups are found in various application scenarios. These popups can\
    \ provide information or request a user action. Until we handle the popup, we\
    \ cannot proceed with any action on our application. There are three kinds of\
    \ JavaScript alerts as follows:\n- Alert box\n- Confirm box\n- Prompt box\n\n\
    An alert box is used to provide information to the user, and the user generally\
    \ handles it by closing or clicking on the `OK` button. ![](image-9c1v239.jpg)\
    \ Figure 6.1: Alert box\n\nThe confirm box is used for the user to verify an action\
    \ or deny it. It generally has an `OK` or a `Cancel` button. And the user can\
    \ handle it by clicking either. ![](image-zgblry3o.jpg) Figure 6.2: Confirm box\n\
    \nFinally, a prompt box is used in the situation when we want some information\
    \ provided by the user. The user has to input something and then can click on\
    \ `OK` or the `Cancel` button. ![](image-f5u7b.jpg) Figure 6.3: Prompt box\n\n\
    To handle these alerts, there is a separate interface called `Alert` in the Selenium\
    \ bindings. The details are available at: `https://www.selenium.dev/selenium/docs/api/java/org/openqa/selenium/Alert.html`\n\
    \nThe `Alert` interface has four methods, as shown in the following table: Table\
    \ 6.1: Methods of alert interface\n\nTo understand the handling of the alert,\
    \ we will take help from the internet Heroku application and see them working.\
    \ The website is on this, we will find all types of alerts available. To handle\
    \ the first type alert box, we will perform the following actions:\n1. Launch\
    \ the application on Chrome using the URL: `https://the-internet.herokuapp.com/javascript_alerts`\n\
    2. Click on the button shown in the figure: ![](image-dvzy1ft8.jpg) Figure 6.4:\
    \ Confirm box of pop up\n3. Handle the alert which pops up: ![](image-jo6mem3t.jpg)\
    \ Figure 6.5: the first type Alert box\n4. If the alert is handled, we will get\
    \ a success message on the Web page: ![](image-ouu5d4ds.jpg) Figure 6.6: Result\
    \ message on the page\n5. Let us see the following code for the preceding set\
    \ of steps to work with the alert box type of popup. ![](image-utrezm6l.jpg) ![](image-cyksbae0.jpg)\n\
    \nLet us now work with the Confirm box type of popup. The following steps will\
    \ be done for the Confirm box:\n1. Launch the Web application on Chrome using\
    \ the URL: `https://the-internet.herokuapp.com/javascript_alerts`\n2. Click on\
    \ the second button: ![](image-wcu1gc84.jpg) Figure 6.7: Confirm box type of pop\
    \ up\n3. On this, let us dismiss the alert by clicking the `Cancel` button: ![](image-1ydzm2j1.jpg)\
    \ Figure 6.8: Dismiss the Alert box\n4. Our Web page will show the following message\
    \ if the alert was dismissed: ![](image-ab9y8hce.jpg) Figure 6.9: Message obtained\
    \ on dismissing the Alert box\n5. Let us see the script to implement the preceding\
    \ set of statements as code: ![](image-uceks6sm.jpg)\n\nIn the final type of alert\
    \ handling, we will work with the Prompt Box. For this, we will perform the following\
    \ steps:\n1. Launch the Web application using the URL: `https://the-internet.herokuapp.com/javascript_alerts`\n\
    2. Click on the third button: ![](image-qjdripip.jpg) Figure 6.10: Final type\
    \ of alert handling\n3. We will here fetch the text associated with the alert,\
    \ and send the text `Hello how are you` to it: ![](image-97fsrmr9.jpg) Figure\
    \ 6.11: Fetching the text associated with alert\n4. We finally accept the alert,\
    \ and see the message sent to the prompt box on the page once the alert is closed:\
    \ ![](image-3agnne5v.jpg) Figure 6.12: Result obtained\n5. Let us write the code\
    \ to handle the preceding steps: ![](image-lr13bmoj.jpg)\n\n### Working with Frame\
    \ and IFrame element\nThe frame object allows us to divide the HTML into multiple\
    \ sections, where each section can have a Web page within itself. The frame tag\
    \ is no longer supported by HTML 5; instead, we will use the `IFrame` tag. An\
    \ `IFrame` tag is called an inline frame, and allows us to embed another HTML\
    \ page in the current document. An example from the HTML is as follows: ![](image-ojhsdyrt.jpg)\
    \ In the browser, the Web page will look as follows: ![](image-t3rn8sm.jpg) Figure\
    \ 6.13: Web page showing IFrame\n\nIf we have an HTML page which contains an `IFrame`,\
    \ we will first have to switch our focus using the `driver.switchTo()` command\
    \ to the `IFrame`. Once our driver is pointing to the `IFrame`, we can now access\
    \ and work with the Web elements inside. To show this, we will take an example\
    \ of the `IFrame` available at the internet Heroku. The URL of the application\
    \ is: `https://the-internet.herokuapp.com/iframe`\n\n1. Open the application using\
    \ the URL: `https://the-internet.herokuapp.com/iframe`\n2. Once the page is launched,\
    \ fetch the contents displayed in the WYSIWYG editor on the page: ![](image-xaxnrme4.jpg)\
    \ Figure 6.14: IFrame with WYSIWYG editor\n3. When we try and inspect the WYSIWYG\
    \ editor on the page to see the backend HTML, we find that this is inside `IFrame`\
    \ tag, which looks as follows: ![](image-k218vga1.jpg) Figure 6.15: HTML associated\
    \ with IFrame page\n4. So, to fetch the contents from the editor, we will first\
    \ have to switch the focus to the `IFrame`, and only then the driver object will\
    \ be able to access the Web elements present on the page is inside the IFrame.\
    \ The code will look as follows: ![](image-ixu1ex8i.jpg)\n5. In the preceding\
    \ code, we will see that we used the `iframe` id property to identify it. We then\
    \ used `driver.switchTo` command to shift our focus on the Web page available\
    \ inside the `IFrame`. Once the driver points to it, we can then access the `<p>`\
    \ HTML element and display it on the console. Once our work is done, we switch\
    \ the focus back to the main HTML page using the method: `driver.switchTo().defaultContent()`.\n\
    \n### Working with HTML window\nMany times, we come across applications, which\
    \ on launching open a new page, like an eCommerce website opens an advertisement\
    \ page on a new window or a new tab. To handle this situation using automation,\
    \ we will again have to use the `driver.switchTo()` function. This function allows\
    \ to switch the focus of the `WebDriver` object to the new window or tab. We can\
    \ then work on the page of the new window and then close it and come back to the\
    \ main website.\n\nTo work with the windows, we need to understand that every\
    \ window is associated with a unique window handle. This window handle is used\
    \ to identify it and associate the driver object with it. To work with all windows\
    \ opened with the same driver instance, we can store them in a collection called\
    \ a `set`. A set is a collection in Java that allows to store unique data values.\
    \ We then use an `Iterator` to iterate through all values in the set. Let us see\
    \ an application that allows us to open a new window. The scenario we will automate\
    \ is as follows:\n\n1. Open the application using the URL: `https://the-internet.herokuapp.com/windows`\n\
    2. After that, we click on the link as shown in the following image: ![](image-59ykb9yh.jpg)\
    \ Figure 6.16: Link to be clicked\n3. When we click on `Click` it will open a\
    \ new tab with a new page which looks as follows: ![](image-hfquhw40.jpg) Figure\
    \ 6.17: New Window launched\n4. We will verify if the new page contains the text\
    \ `New`\n5. We will now close the window and go back to the main parent window\
    \ and close it also. The code for the preceding steps is as follows: ![](image-8jqfsn66.jpg)\n\
    \nWe can see in the code that once we have fetched in a `set` all the window handles,\
    \ we are using the `for each` loop to print the window handles on the console.\
    \ After that, we convert the `set` to an `Object Array`. Here, we need to realize\
    \ that the first element in the array will be the window handle.\n\n### Working\
    \ with action class\nThe `action` class is used to handle advanced mouse and keyboard\
    \ actions such as drag and drop, mouse over, key up and key down. To perform these\
    \ actions, we should use the `Actions` interface. The interface is available in\
