    Link to be clicked When we click on Click it will open a new tab with a new page
    which looks as follows: ![](image-hfquhw40.jpg) Figure 6.17: New Window launched We
    will verify if the new page contains the text New We will now close the window
    and go back to the main parent window and close it also. The code for the preceding
    steps is as follows: ![](image-8jqfsn66.jpg) We can see in the code that once
    we have fetched in a set all the window handles, we are using the for each loop
    to print the window handles on the console. After that, we convert the set to
    an Object Array. Here, we need to realize that the first element in the array
    will be the handle of the parent window. The next element in the array will be
    the next window which is launched, and so on. Since for our scenario, there are
    only two windows, at 0 index we have the handle of the parent window, and at index
    1 we have the handle of the child window. We then use the driver.switchTo().window
    command to switch to the child window by passing the second index of the array.
    We then find if it contains a required text and closes it. We then switch to the
    parent window using the first element of the array and close it too. Thus, in
    the preceding code, we have seen how we can work with windows in Selenium. Conclusion In
