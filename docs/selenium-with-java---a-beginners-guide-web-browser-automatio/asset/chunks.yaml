    with HTML window Many times, we come across applications, which on launching open
    a new page, like an eCommerce website opens an advertisement page on a new window
    or a new tab. To handle this situation using automation, we will again have to
    use the driver swtichTo function. This function allows to switch the focus of
    the WebDriver object to the new window or tab. We can then work on the page of
    the new window and then close it and come back to the main website. To work with
    the windows, we need to understand that every window is associated with a unique
    window handle. This window handle is used to identify it and associate the driver
    object with it. To work with all windows opened with the same driver instance,
    we can store them in a collection called a set. A set is a collection in Java
    that allows to store unique data values. We then use an Iterator to iterate through
    all values in the set. Let us see an application that allows us to open a new
    window. The scenario which we will automate is as follows:  Open the application
    using the URL: https://the-internet.herokuapp.com/windows After that, we click
