    # 前言


    Selenium 将浏览器自动化，而我们如何利用这种力量取决于自己。这是我们第一次访问 Selenium 官方网站时收到的信息。它是 Web 浏览器自动化最流行的开源解决方案，任何人都可以免费获取和使用。Web
    应用领域已经使用 Selenium 多年。它帮助自动化枯燥的任务，提高效率和准确性，最终改进测试流程。Selenium 的力量在于它可以使用任何编程语言实现，可以自动化任何符合
    W3C 标准的 浏览器，并可以在任何操作系统上运行。Selenium 项目和 WebDriver 合并成了 Selenium WebDriver，它现在是
    W3C 标准。各种版本的 Selenium 被用于各种大小的项目。书中的 Selenium 实现是使用 Java 作为编程语言完成的。在书中，我们尝试涵盖
    Selenium 的基本类和接口，这些能帮助我们自动化浏览器和元素。我们涵盖了测试脚本之外的数据和对象管理的重要性，并涵盖了其实现。我们讨论了流行的单元测试框架
    `TestNG`，并理解了我们可以在测试自动化项目中使用它的各个维度。最后学习了如何使用 `Grid` 为不同环境设置并行执行的测试。


    在本书的 12 章中，你将学习到以下内容：


    -   **第 1 章** – 学习什么是 Selenium。介绍 Selenium 下的三个项目：`Selenium IDE`、`WebDriver` 和
    `Selenium Grid`。

    -   **第 2 章** – 学习如何搭建环境以使用 Selenium 编写测试脚本。学习我们将自动化的不同应用和场景，以理解 Selenium。

    -   **第 3 章** – 学习 Selenium 的三大支柱：`Java` 客户端库、自动化 浏览器的 `WebDriver` 以及处理页面 HTML
    元素自动化的 `WebElement`。按类划分。

    -   **第 4 章** – 理解同步的重要性，以及如何在测试脚本中实现。

    -   **第 5 章** – 理解如何处理不同的 HTML 元素，如表单元素、表格、下拉列表。

    -   **第 6 章** – 理解如何处理 Web 元素，如框架（frame）、警框（alerts）和窗口（window）。

    -   **第 7 章** – 学习一些高级概念，如使用 `action` 处理键盘和鼠标事件。捕捉截图。

    -   **第 8 章** – 学习什么是 `TestNG`，理解我们可以在测试自动化项目中使用它的各种特性。

    -   **第 9 章** – 学习如何使用页面对象模型（Page Object Model）实现。

    -   **第 10 章** – 学习测试脚本之外的数据管理的重要性，并学习如何从外部文件（如 `csv` 和 `excel`）读取数据。

    -   **第 11 章** – 介绍项目管理工具 `Maven`，理解它在项目管理中的重要性。

    -   **第 12 章** – 学习 Selenium Grid，它允许我们在不同环境中并行执行测试。


