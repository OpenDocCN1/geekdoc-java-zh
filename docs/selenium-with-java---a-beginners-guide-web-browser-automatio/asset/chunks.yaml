    8 What is TestNG TestNG stands for Testing Next Generation . It is one of the
    most widely used testing frameworks, specifically in test automation projects
    made using Java as a programming language. The other test framework many uses
    is JUnit, but TestNG is more compatible for test projects. The main website for
    TestNG is https://testng.org/doc/ . In this chapter, we will explore the basics
    of TestNG and see some of its functionalities with respect to being used in test
    automation projects with Selenium. Structure In this chapter, the following topics
    will be covered:  Designing a TestNG test Adding assertions to TestNG test Reports
    in TestNG Objectives The objective of this chapter is to understand the feature
    and functionalities of TestNG as a test framework to be used in designing test
    automation projects using Selenium. TestNG is one of the most widely used units
    test frameworks besides JUnit. Although JUnit is mainly used by developers as
    they design their code, TestNG has features that are more apt for the testers
    to use as they design their code for automation. We will see what a TestNG suite
    looks like, discuss about various annotations available with TestNG, understand
    how we can execute a suite file, and discuss the different modes available for
    execution. Finally, we will explore reports which are made available by default
    with TestNG. Introduction TestNG is a testing framework that is used for a broad
    range of test activities, from unit testing to integration testing. It has various
    features and a wide range of annotations, which are useful to design a test suite.
    Any test suite designed in TestNG has an XML file that contains information about
    the tests, execution criteria and can also contain test configuration parameters
    information to be used by the test during execution. Let us see now how can we
    install TestNG in the eclipse environment. Installation In this section, we will
