  trans: "\n\n从代码的 HTML 部分，我们可以获取以下定位器信息。`id` 定位是 HTML 元素的一个属性。例如，如果我们查看前面的代码，可以看到一个登录按钮的\
    \ HTML，其中 HTML 元素有一个 `id` 属性。因此，为了识别页面上的此按钮，我们可以轻松地使用 `id` 属性并像如下创建定位器命令——\n\n\
    `name` 定位信息也是从 HTML 元素获取的。`Name` 是与 HTML 元素相关的属性。例如，在前面的 HTML 代码段中，我们看到了邮箱文本框和一个密码文本框；对于这两种识别，我们都可以使用\
    \ `name` 定位。\n- 邮箱：`driver.findElement(By.name(\"email_address\"))`\n- 密码：`driver.findElement(By.name(\"\
    password\"))`\n\n`xpath` 信息源于到达目标 HTML 元素所经过的遍历路径。它主要用于 XML 文档，但我们可以将 HTML 页面视为\
    \ XML 页面，然后创建到达所选元素的路径。`xpath` 有两种类型：\n- 绝对 XPath (Absolute Xpath)\n- 相对 XPath\
    \ (Relative Xpath)\n\n创建绝对 `xpath` 的语法始终从根节点 `HTML` 开始，而相对路径，它是从节点本身或任何具有强识别性的父节点开始。我们称这些节点为地标节点（landmark\
    \ nodes），它们拥有 `ID` 属性或 `NAME` 属性。对于这些节点，我们可以创建到达我们想要处理的节点的路径。\n\n例如，邮箱文本框的相对 `xpath`\
    \ 可以：\n- 邮箱框- `//input[@name='email_address']`\n- 或者如果我们相对于包含邮箱地址的表单节点创建，它将是：相对于\
    \ form 表单节点- `//form/table/tr[1]/td[2]/input`\n\n创建 `xpath` 的语法是——\n绝对 `xpath`\
    \ 始终从 `html` 节点开始——`/html/tag1/tag2/tag3…`\n\n`XPaths` 也可以使用关键字创建。我们可以使用任何属性甚至文本来创建此\
    \ `xpath`。例如，对于登录按钮，`xpath` 可以如下创建：`Xpath=//*[contains(text,'Sign In')]`。创建的 `xpath`\
    \ 定位信息为——`//button[text='Sign In']`\n\n`CSS` 代表级联样式表（Cascading Style Sheets），它们用于帮助\
    \ Web 页面元素的样式化。不是为每个单独元素创建样式，而是创建 `CSS` 文件，其中为某种标签类型定义样式。我们可以使用 `CSS` 来识别页面上的对象。创建\
    \ `CSS` 的语法如下：`css=#id` 或 `css=htmltag[prop=value]`\n\n文档对象模型（DOM）是任何 HTML Web\
    \ 页面的基础。它基本上说的是 HTML `DOM` 以树形结构的形式存在，每个节点与其他节点之间都存在层级关系。通常，HTML `DOM` 表示如下：\n\
    ![](img/image-5yrg7stu.jpg)\n图 3.4：HTML DOM\n\n要使用 `DOM` 信息来识别感兴趣的对象，我们利用了所有 HTML\
    \ 标签类型都以数组形式分配的特性。为了识别特定 HTML 标签类型的特定对象，可以使用其在创建定位器信息的路径中的位置。\n\n总而言之，我们需要理解对于任何\
    \ HTML 元素，我们拥有的相同的 HTML 代码段。通过使用 HTML、XML、`xpath`、`css` 和 `DOM` 等各种 Web 技术，我们可以为对象创建定位器，供\
    \ Selenium 消费，并帮助我们在执行操作的 Web 页面上唯一地识别该对象。\n\n### `By` 类的异常\n\n当我们使用 `By` 类配合不正确的定位器时，可以看到以下异常：\n\
    - 当使用 `xpath` 选择器策略查找元素时抛出此异常，使用的 `xpath` 语法是错误的。\n- 当元素找不到所使用的属性时，发现此异常。\n- 当我们尝试处理的元素被禁用，即使它存在于\
    \ `DOM` 中，也会发现此异常。\n\n### 结论\n在本章中，我们讨论了 `WebDriver` 和 `WebElement` 的接口，以及 `By`\
    \ 类。在 `WebDriver` 的帮助下，我们能够驱动我们浏览器并与其交互。`WebElement` 实际上是创建 Web 页面的 HTML 元素。每个\
    \ Web 元素使用其 HTML 属性和值定义，这些值也被用于在编写自动化脚本时识别它们的策略。Selenium Web 元素接口提供了多种函数对 Web\
    \ 元素执行操作，帮助我们实现目标。`By` 类拥有一些方法，使用对象的 HTML 属性并利用它们识别对象。我们看到该类是关重要的，因为它有助于识别 Web\
    \ 页面上的对象。在识别出的对象上将执行操作。它还有方法来识别单个对象或匹配相同信息的对象列表。我们将对这些对象执行操作以实现我们的自动化目的。\n\n`WebElement`、`WebDriver`\
    \ 和 `By` 类构成了 Selenium `WebDriver` 脚本设计的基础。在后续章节中，我们将根据对 `WebDriver`、`WebElement`\
    \ 和 `By` 类的学习，在 Selenium 中实现我们的第一个脚本。在接下来的章节，我们将讨论同步（Synchronization）的概念，理解其重要性以及它是如何实现的。\n\
    \n### 问题\n- 我们在这里使用了什么版本的 Eclipse？\n- 我们在这一章中安装了什么版本的 Java？\n- 相对于 Eclipse，Photon\
    \ 是什么？\n- Firefox 驱动程序的名称是什么？\n- 可以从哪里下载 Internet Explorer 的驱动程序？\n- Web 元素的通用结构是什么？\n\
    - 列举一些用于创建元素的 HTML 标签？\n- 为什么我们会得到 `NoSuchElementException`？\n- `findElement()`\
    \ 和 `findElements()` 之间有什么区别？\n- 我们使用什么方法在文本框上输入？\n- 如果提供的 `xpath` 语法错误，会产生什么类型的异常？\n\
    - 你如何通过其类在运行时获取对象？\n\n# 第 4 章：同步概念\n\n在上一章中，我们最终实现了关于 Selenium 三大支柱的学习，并自动化了带有\
    \ URL 的浏览器启动——Chrome、Firefox 和 Internet Explorer。当我们学习 Selenium 的支柱时，理解测试自动化的主要支柱之一是非常重要的，那就是同步。在本章中，我们将理解它的概念和重要性。\n\
    \n### 结构\n本章分为：\n- 什么是同步以及为什么它很重要\n- 同步的类型\n- 如何实现隐式等待 (implicit wait)\n- 如何实现显式等待\
    \ (explicit wait)\n- 可能出现同步的问题\n\n### 目标\n学习本章后，你应该能够识别脚本中需要等待的地方并添加隐式或显式等待。你能够识别脚本是否由于同步问题失败并修复它。\n\
    \n### 理解同步及其重要性\n同步意味着同时进行两项或更多活动。在没有工具帮助的情况下执行场景时，我们可以根据 Web 应用的速度同步我们的操作。然而，当我们在无人模式（unattended\
    \ mode）下执行相同的操作时，脚本本身缺乏任何能力来判断是等待操作完成还是继续。在我们在脚本中引入同步的概念时，脚本可能会与 Web 应用的速度不同步导致错误。通过一个例子，假设我们使用\
    \ URL 启动应用，如下所示：\n![](img/image-x2rnap4.jpg)\n图 4.1：启动应用示例\n\n现在我们在 `My Account`\
    \ 链接上执行操作；下一步是输入邮箱地址，如下：\n![](img/image-7hy5a2w.jpg)\n图 4.2：我的账户页面\n\n可能存在以下情况：\n\
    - **理想情况 (Happy)**：点击 `My Account` 链接后，页面按时加载，我们可以在字段输入。\n- **其他情况 (Other)**：在无人模式下，人类执行操作时，可以使用能力判断：\n\
    \    - 页面没有按时加载执行操作。\n    - 页面加载了，但字段不存在。\n    - 页面没有加载，由于客户端或服务器问题导致错误。\n   \
    \ - 页面没有加载。\n\n当人类在执行先前的步骤时遇到不理想的情况，将采取适当的操作并判断是应该等待页面加载，还是由于网站未工作而报告问题。在脚本中，我们需要构建隐式等待或显式等待。我们还能够识别脚本中需要同步的地方。\n\
    \n### 同步的类型\n到目前为止，我们学习了同步的重要性。在本节中，我们将学习如何在脚本中实现它，以及它的方法。方法两种方法：\n- 隐式等待 (Implicit\
    \ wait)\n- 显式等待 (Explicit wait)\n\n隐式等待也称为全局等待。它通常在 `WebDriver` 对象初始化后立即实现。一旦实现，此等待适用于脚本中的每个语句。\n\
    \n显式等待被称为局部等待。它用于脚本中可能需要更多时间的地方。通常，当我们使用显式等待时，会将隐式等待设置为零，因为它们可能会相互干扰。当我们使用显式等待时，我们需要一个条件来等待完成或超时指定的秒数。为了创建显式等待条件，Selenium\
    \ 中有一个类名为 `ExpectedConditions`。我们将在下一节介绍更多。\n\n### 场景\n为了在操作中实现隐性和显式等待，我们将选择使用有效用户信息登录应用的场景。让我们首先理解以下步骤：\n\
    - 使用 URL 打开应用\n- 点击 `My Account` 链接\n- 点击 Sign In 按钮\n- 点击 Log Off 链接\n- 点击 Continue\
    \ 按钮\n\n按照前面的步骤，我们在浏览器中启动应用如下：\n![](img/image-4marn9.jpg)\n图 4.3：应用主页\n\n然后我们提供有效的用户名和密码，然后点击\
    \ Sign In 按钮如下：\n![](img/image-egcpsy.jpg)\n图 4.4：登录应用\n\n如果信息正确，我们将看到 `My Account`\
    \ 页面如下：\n![](img/image-btsim.jpg)\n图 4.5：登录后的页面\n\n在这里，我们然后点击 Log Off 和 continue\
    \ 按钮返回主页：\n![](img/image-vpxe0t98.jpg)\n图 4.6：应用退出页面\n\n在前面的场景中，我们需要在对不同元素执行操作时注意到页面的变化。例如，如果我们点击\
    \ `My Account` 链接，我们将进入需要填写用户名密码信息的页面。当我们点击 `sign in` 按钮时，我们进入 `My Account` 页面，在那里我们看到\
    \ `Log Off` 链接。我们点击 `Log Off` 链接看到 continue 按钮，点击后回到主页。在每一步中，我们的脚本都必须设置为等待元素。如果元素在规定时间内出现，则抛出\
    \ `Timeout` 异常并结束执行。我们看到的第一种等待是隐式等待，它被引入脚本并作用于脚本中的每个语句。它被称为全局等待。之后，我们将看到显式等待，它被称为局部等待，并引入脚本中比全局设置需要更多等待的地方。正如前面解释，我们不一起使用这些等待，因为它们可能会相互干扰。当使用显式等待时，我们将隐式等待设置为零。\n\
    \n为了实现隐式等待，我们使用以下命令：\n```\ndriver.manage().timeouts().implicitlyWait(10, TimeUnit.SECONDS);\n\
    ```\n在这里，`driver` 是 `ChromeDriver` 的实例并使用其 `manage` 方法。`manage` 方法有 `timeouts`，我们传递给此方法的参数是我们想要隐式等待的时间量。此命令适用于脚本中的每个语句。如果由于某些原因，元素不可用且过了\
    \ 10 秒，会导致 `NoSuchElementException` 异常。让我们看到使用隐式等待的脚本：\n![](img/image-mvcg2tik.jpg)\n\
    ![](img/image-w8np2vm.jpg)\n\n### 实现显式等待\n在脚本需要比全局设置更多时间的情况下，实现显式等待或局部等待。在这种情况下，建议增加整个全局超时，因为由于某些原因脚本失败，我们将根据设置的持续等待。我们需要理解同步与脚本速度之间的关系。为了实现显式等待，我们将使用\
    \ Selenium 的 `WebDriverWait` 接口和 `ExpectedConditions` 接口。在继续之前，我们先讨论这两个实体。`WebDriverWait`\
    \ 接口提供了一个 `until()` 方法，该方法接受类型为 `ExpectedConditions` 的参数。Selenium `WebDriver`\
    \ 类提供了大量方法来检测事件，等等。`ExpectedConditions` 方法是可用的……\n\n提示：`WebDriverWait` 接口需要 `driver`\
    \ 实例、超时时间。让我们通过一个场景来实施局部等待，即 `Log Off` 链接，如下所示：\n![](img/image-ihv4czh.jpg)\n\
    当 `Log Off` 链接出现时，我们将继续并退出。我们需要注意，在前面的代码中，我们将隐式等待设置为 0，并在显式等待将其设置为 10 秒。代码的原因是这些等待可能会相互干扰并导致运行时执行问题。\n\
    \n### 遇到异常\n我们遇到：\n- `NoSuchElementException`：当脚本等待页面上的元素出现，但在给定的持续时间内无法找到它。\n\
    - `TimeoutException`：当脚本在给定的持续时间内无法找到元素时生成。`presenceOfLocatedBy` 也抛出 `NoSuchElementException`。\n\
    \n为了看到这一点，我们可以使用 `By.linkText: Junk`。由于 junk 不存在，等待 10 秒后，内部生成：\n```\nException\
    \ in thread \"main\" org.openqa.selenium.TimeoutException: Expected condition\
    \ failed: waiting for element located by: By.linkText: Junk (tried for 10 seconds\
    \ with 500 milliseconds interval)\ncaused by: org.openqa.selenium.NoSuchElementException:\
    \ no such element: (Session info:\n```\n![](img/image-3p2yg6a.jpg)\n\n在本章中，我们学习了自动化脚本中等待的需求、Selenium\
    \ 中的等待类型以及如何实现。在接下来的章节中，我们将讨论处理表单元素、表格和下拉元素。\n\n# 第 5 章：处理 WebElements——表单、表格和下拉列表\n\
    \n在前面的章节中，我们讨论了用于处理浏览器、Web 元素和创建定位器的 Selenium 库。我们也讨论了如何使用概念。`WebElement` 实际上是创建\
    \ Web 页面的 HTML 元素。每个 Web 元素使用其 HTML 属性和值定义，这些值也被用于在编写自动化脚本时识别它们的策略。Selenium Web\
    \ 元素接口提供了多种函数对 Web 元素执行操作，帮助我们实现目标。`By` 类拥有一些方法，使用对象的 HTML 属性并利用它们识别对象。我们看到该类是关重要的，因为它有助于识别\
    \ Web 页面上的对象。在识别出的对象上将执行操作。它还有方法来识别单个对象或匹配相同信息的对象列表。我们将对这些对象执行操作以实现我们的自动化目的。\n\
    \n`WebElement`、`WebDriver` 和 `By` 类构成了 Selenium `WebDriver` 脚本设计的基础。在后续章节中，我们将根据对\
    \ `WebDriver`、`WebElement` 和 `By` 类的学习，在 Selenium 中实现我们的第一个脚本。在后续章节，我们将讨论同步的概念，理解其重要性以及它是如何实现的。\n\
    \n### 结构\n本章分为：\n- 处理表单元素，如文本框、单选框、复选框等\n- 处理表格元素\n- 处理下拉元素\n\n### 目标\n学习本章后，你能够：\n\
    - 自动化处理表单 HTML 元素\n- 理解并处理表格元素\n- 理解并处理下拉元素\n\n### 处理表单元素\n`Form` 是 HTML 标签，包含了不同\
    \ HTML 元素。`form` 元素用于 HTML 网站捕获用户输入。信息通常发送到服务器进行进一步工作。HTML 中的 `form` 元素表示为，它作为文本框、单选框、提交按钮、复选框等不同元素的容器。所有这些不同的元素都用\
    \ HTML 标签表示。不同类型的输入元素如下：\n（注意：原文中列出了列表但是重复的）\n表 5.1：不同类型的输入元素\n\n在我们的练习应用中，更改个人信息的场景是我们看到表格中大多数输入元素的地方。让我们探索该部分。对于更改配置场景，我们必须执行以下步骤：\n\
    - 使用 URL 打开应用\n- 点击 `My Account` 链接，如图所示：\n![](img/image-cmagwa4w.jpg)\n图 5.1：My\
    \ Account 链接\n- 在登录页面，提供登录详情：用户名是 `bpb@bpb.com`，密码是\n- 点击 Sign In 按钮如下：\n![](img/image-dbk44ii.jpg)\n\
    图 5.2：登录页面\n在图中，我们看到了输入元素：`text` 和 `password`。\n- 登录后，你到达 `Account Information`\
    \ 页面。在这里，我们需要点击说 `View or change my account` 的链接：\n![](img/image-o2e5r9dk.jpg)\n\
    图 5.3：账户信息页面\n- 这将带我们进入 `Change Profile` 页面。在该页面，我们看到输入元素 `text` 和 `radio`。\n\
    ![](img/image-l85yx3cf.jpg)\n图 5.4：更改页面\n我们可以编辑个人部分的任何信息；假设我们要修改 `Telephone Number`，如果选中了\
    \ `Male` 单选框，我们向前点击 `Female` 单选框，反之亦然。我们将清除字段内容，然后输入电话号码，并点击 `Continue` 按钮使更改配置操作完成。\n\
    ![](img/image-uoxa0e2y.jpg)\n图 5.5：账户信息页面\n- 我们现在可以点击 `Log Off` 链接并继续从账户注销，返回主页：\n\
    ![](img/image-sgl2hd21.jpg)\n图 5.6：退出链接\n\n在本章中，我们学习了自动化脚本中等待的需求、Selenium 中的等待类型以及如何实现。请注意，在所有这些步骤中，我们没有添加任何验证。Selenium\
    \ 库默认不支持任何验证，因为那不是浏览器操作。为了将先前的场景添加验证并转换为测试用例，我们需要使用单元测试框架。我们可以选择 JUnit 或 TestNG。在接下来的章节中，我们将探索\
    \ TestNG 作为在使用 Java 作为编程语言使用 Selenium 创建测试自动化脚本时使用的单元测试框架。\n\n### 问题\n- 为什么我们的自动化脚本中需要同步？\n\
    - 解释隐式等待的含义以及如何实现？\n- Selenium 中的 `ExpectedConditions` 类是什么？\n- 当 `WebDriverWait`\
    \ 失败时产生什么异常？\n\n"
