    is the name of the driver for Firefox? From where can one download the driver
    for Internet Explorer?CHAPTER 3 WebDriver, WebElement, and By Selenium, the popular
    browser automating tool, has three main components: the Selenium IDE, WebDriver,
    and the Grid. In this chapter, we will understand about the three main important
    components of the WebDriver, which are the WebDriver interface, WebElement interface,
    and the By class. Any script which we write to automate the browser will use the
    methods available in these entities. The WebDriver interface provides us with
    various methods to automate the browser and fetch information associated with
    the Web page. The WebElement refers to the HTML element on the page. This interface
    provides us with various methods which help us to automate actions to handle different
    types of HTML elements. And finally, the By class helps us create locator strategies
    to locate an element on the Web page on which action can be performed. Structure In
    this chapter, we will discuss the following topics:  WebDriver and its purpose  Methods
    of WebDriver WebDriver of three browsers [IE, FF, Chrome] Exceptions related to
    WebDriver WebElement interface  Methods of WebElement Exceptions with WebElement About
    By class  Methods in By class Understanding locators Exceptions related to By
    class Objectives After studying this unit, you will be able to:  Learn what is
    a WebDriver, and use its methods to automate the browser. Understand what is WebElement,
    and use its methods to work with Web elements on the Web page. Understand the
    By class used for locator creation and the different types of locator strategies. Set
    up browser drivers in the project. Understand the exceptions we may encounter
    while using WebDriver, WebElement, and By. WebDriver and its purpose WebDriver
    is the main interface that prepares a contract to establish the rules for the
    browser to follow so that it gets enabled for testing. The functionalities this
    interface focusses on are:  Controlling the browser The WebDriver interface provides
    us with methods, which help us in controlling browser-related actions, such as
    the opening of a browser, the closing of the browser, managing browser window
    size, timeout events, and more. As we will see in the next section, where we discuss
    methods in more detail, we will see more about this. Selecting the Web elements The
    WebDriver interface provides two methods to look for the element or a list of
    elements of interest. These methods are findElement and which provide us with
    an element or a list of elements, respectively. Once the Web element is identified,
    we can proceed with the action on it. Web page information The WebDriver interface
    provides us method which helps in fetching the current title of the page, the
    current URL, and the content available on the page. The information provided by
    these methods provides information related to the Web page and can also be used
    for validation. In the next section, we will first understand how to set WebDrivers
    for different browsers. After that, we will look at the list of methods available
    with the WebDriver interface and their explanations. We will also see some implementation
    examples to understand the working of the methods. Set browser drivers Selenium
