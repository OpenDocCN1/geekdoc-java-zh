- fmt: "\nFrom the HTML part of the code, we can get the following locator information.\
    \ The `id` locator is an attribute for an HTML element. For example, if we look\
    \ at the preceding code, we see a sign-in button HTML, in which the HTML element\
    \ has an `id` attribute. So to identify this button on the page, we can easily\
    \ use the `id` attribute and create a locator command as in -\n\nThe `name` locator\
    \ information is also fetched from the HTML element. `Name` is an attribute associated\
    \ with the HTML elements. For example, in the preceding HTML snippet, we see an\
    \ email text box and a password textbox; for both identification, we can use the\
    \ `name` locator.\n- Email: `driver.findElement(By.name(\"email_address\"))`\n\
    - Password: `driver.findElement(By.name(\"password\"))`\n\nThe `xpath` information\
    \ is derived from the path it takes to traverse to reach the HTML element of interest.\
    \ It is mainly used for XML documents, but we can take the HTML page as an XML\
    \ page and then create the path to reach the element of choice. The `xpath` could\
    \ be of two types:\n- Absolute Xpath\n- Relative Xpath\n\nThe syntax of creating\
    \ absolute `xpath` is always from the root node `HTML`, and for the relative path,\
    \ it is from the node itself or any of the parents nodes which has a strong identification.\
    \ We call those nodes landmark nodes, which have either an `ID` attribute or the\
    \ `NAME` attribute. As with respect to those nodes, we can create the path to\
    \ reach the node we want to work upon.\n\nFor example, the relative `xpath` for\
    \ the email text box could be:\n- Email box- `//input[@name='email_address']`\n\
    - Or if we create with respect to the form node, which is containing the email\
    \ address it will be: WRT form node- `//form/table/tr[1]/td[2]/input`\n\nThe syntax\
    \ of creating an `xpath` is -\nAnd for absolute `xpath` is always from the `html`\
    \ node - `/html/tag1/tag2/tag3…`\n\n`XPaths` can also be created using a keyword.\
    \ We can use any attribute or even text to create this `xpath`. For example, let\
    \ us for the sign-in button, the `xpath` can be created as follows: `Xpath=//*[contains(text,'Sign\
    \ In')]`. The `xpath` locator information created would be - `//button[text='Sign\
    \ In']`\n\nThe `CSS` stands for the Cascading Style These are used to help style\
    \ the elements of the Web page. Instead of creating a style for every individual\
    \ element, the `CSS` files are created, where for a tag type, a style is defined.\
    \ We can use `CSS` to identify the object on the page. The syntax for creating\
    \ a `CSS` is as follows: `css=#id` or `css=htmltag[prop=value]`\n\nThe document\
    \ object model is what any HTML Web page is based. It basically talks about the\
    \ HTML `DOM` being in the form of a tree-like structure where every node is in\
    \ a hierarchical relationship with the other node. Generally, an HTML `DOM` is\
    \ represented as follows:\n![](image-5yrg7stu.jpg)\nFigure 3.4: A HTML DOM\n\n\
    To use the `DOM` information to identify the object of interest, we use the fact\
    \ that all types of HTML tag types are allocated in the form of an array. And\
    \ to identify a particular object of a certain HTML tag type, we can then use\
    \ its position in the path to creating the locator information.\n\nSo over and\
    \ all, we need to understand that it is the same HTML code snippet that we have\
    \ available for any HTML element. And by using the various Web technologies of\
    \ HTML, XML, `xpath`, `css`, and `DOM`, we can create locators for the object\
    \ for Selenium to consume and help us identify the object uniquely on the Web\
    \ page on which action can take place.\n\n### Exception with the `By` class\n\n\
    The exception which we can see when we use bad locators with the `By` class are\
    \ as follows:\n- This exception is thrown when an `xpath` selector strategy is\
    \ used to find an element, the `xpath` used is syntactically wrong.\n- This exception\
    \ is found when the attribute used could not be found for the element.\n- This\
    \ exception is found when the element we are trying to work with is disabled,\
    \ even though it is present in the `DOM`.\n\n### Conclusion\nIn this chapter,\
    \ we discussed the interfaces of `WebDriver` and `WebElement`, and also the `By`\
    \ class. With the help of `WebDriver`, we are able to drive the browser of our\
    \ choice and interact with it. `WebElement` that are effectively the HTML elements\
    \ using which the Web pages are created. Each Web element is defined using its\
    \ HTML properties and values, which are also used in locator strategies to identify\
    \ them while writing automation scripts. Various functions are available in Selenium\
    \ Web element interface to act on the Web elements, which help us achieve our\
    \ objective. The `By` class has methods that use the objects' HTML properties\
    \ and using them identifies the objects. We saw how the class is crucial as it\
    \ helps to identify the objects on the Web page. On the identified objects, the\
    \ actions will be performed. It also has methods to identify either one object\
    \ or a list of objects which matches the same information. We will perform actions\
    \ on these objects to achieve the purpose of our automation.\n\nThe `WebElement`,\
    \ `WebDriver`, and `By` class create the foundation of the script designing in\
    \ Selenium `WebDriver`. In the upcoming chapter, we will discuss about the implementation\
    \ of our first script in Selenium using the learnings from `WebDriver`, `WebElement`,\
    \ and the `By` class. In the upcoming chapter, we will talk about the concept\
    \ of synchronization, understand its importance, and how it is implemented.\n\n\
    ### Questions\n- What eclipse version have we used here?\n- What Java version\
    \ have we installed in this chapter?\n- What is Photon with respect to Eclipse?\n\
    - What is the name of the driver for Firefox?\n- From where can one download the\
    \ driver for Internet Explorer?\n- What is the generic structure of a Web element?\n\
    - Name some HTML tags used to create an element?\n- Why do we get `NoSuchElementException`?\n\
    - What is the difference between `findElement()` and `findElements()`?\n- Which\
    \ method do we use to type on textbox?\n- What type of exception is generated\
    \ if the `xpath` provided has wrong syntax?\n- How will you fetch at run an object\
    \ using its class?\n\n# CHAPTER 4: Concept of Synchronization\n\nIn the previous\
    \ chapter, we were able to finally implement our learnings about the three pillars\
    \ from Selenium and automate the launching of the browser with the URL—Chrome,\
    \ Firefox, and Internet Explorer. As we learn about pillars of Selenium, it is\
    \ important to understand one of the main pillars of test automation, which is\
    \ synchronization. In this chapter, we will understand the concept and importance.\n\
    \n### Structure\nThe chapter is divided into:\n- What is synchronization, and\
    \ why is it important\n- Types of synchronization\n- How to implement implicit\
    \ wait\n- How to implement explicit wait\n- How to detect scripts that may have\
    \ issues\n\n### Objectives\nAfter studying this chapter, you should be able to\
    \ identify where waits are required in the script and accordingly add implicit\
    \ wait or explicit wait. You should also be able to identify if the script is\
    \ failing because of a synchronization issue and fix it. We will also be able\
    \ to decide where we can use synchronization in the script.\n\n### Understanding\
    \ synchronization and its importance\nSynchronization of synchronization means\
    \ activity of two or more things at the same time. When we are executing scenario\
    \ ourselves without the help of any tool, we can synchronize our actions as per\
    \ the speed of the Web application, as we can see and understand using our cognitive\
    \ abilities whether should wait for action to complete or proceed.\n\nHowever,\
    \ when we replace the same set of actions with unattended mode, which means when\
    \ we write a script to perform the same actions, the script itself lacks any cognitive\
    \ abilities to judge whether to wait for the action to complete or proceed with\
    \ the next step. In the case where we do not introduce the concept of synchronization\
    \ in our scripts, we are causing an error in the script where the tool driving\
    \ the script may fall out of sync with the speed of the Web application. By taking\
    \ an example here, let us say we launched our application using the URL on chrome\
    \ as shown in the following figure:\n![](image-x2rnap4.jpg)\nFigure 4.1: Example\
    \ of launching an application\n\nNow, we perform a click operation on `My Account`\
    \ link; then the next step for us is to type the email address as shown in:\n\
    ![](image-7hy5a2w.jpg)\nFigure 4.2: My Account page of the application\n\nThere\
    \ could exist a few situations explained as follows:\n- **Happy**: After we click\
    \ on `My Account` link, the page gets loaded in time, and we are able to type\
    \ on the email address text field.\n- **Other**: In attended mode, where a human\
    \ is performing the action, can judge using cognitive abilities and take appropriate\
    \ action:\n    - The page is not loaded in time, and we run out of time to perform\
    \ the action.\n    - The page does get loaded, but the text field is not there.\n\
    \    - The page does not loaded, and there is an error that could be caused because\
    \ of client-side or server-side issue.\n    - The page is not loaded as internet\
    \ stopped working.\n\nA human tester, when performing the preceding steps in person,\
    \ encounters an unhappy situation, will be able to take appropriate action and\
    \ make a decision whether what is encountered should be logged as a defect, or\
    \ should wait more for the page to load, or report issue to administrator as website\
    \ did not work because of internet issues. But when a script takes the place of\
    \ the human tester, we have to build certain cognitive abilities into it so that\
    \ it can act appropriately in the preceding situations as we would expect someone\
    \ with cognitive abilities to do. Also, one of the approaches that should be enforced\
    \ here is that the first foremost thing to do is take care of the synchronization\
    \ between these two independent processes.\n\nThere are two independent processes\
    \ that take place as we use a tool to drive the browser and perform actions on\
    \ the Web application. The tool Selenium used here will execute the command to\
    \ drive the Web browser and perform an action on the Web application, and the\
    \ Web application will execute those actions as per its processing speed. If we\
    \ do not synchronize these two processes, our script will fail, and we will not\
    \ be able to effectively and with reliability execute our scripts to test the\
    \ application. The reason for this would be that from the script, Selenium would\
    \ try to identify the element on the Web page, but for various reasons listed\
    \ in the unhappy situation, the object or the page itself may not be loaded and\
    \ may cause inconsistent behavior with our scripts written to test the application.\
    \ In the following section, we will learn how we can implement synchronization\
    \ in the script to ensure the two independent processes are aware of each other’s\
    \ existence.\n\n### Types of synchronization\nWe have learned so far the importance\
    \ of synchronization. In this section, we will learn how we implement it in the\
    \ test scripts and what the approaches are for it. There are two approaches as\
    \ follows: own- `Implicit wait`\n- `Explicit wait`\n\n`Implicit wait` is also\
    \ known as global wait. It is generally implemented immediately after the `WebDriver`\
    \ object is initialized. Once implemented, this wait holds true for every statement\
    \ in the script.\n\n`Explicit wait` is known as a local wait. It is used in places\
    \ in the script which may require more time. Generally, when we are using explicit\
    \ wait, we set the implicit wait to zero as they may interfere with each other.\
    \ When we use explicit wait, we need to have a condition in which we will be waiting\
    \ to be completed, or timeout in the specified number of seconds. To create a\
    \ condition for the explicit wait, there is a class available in Selenium known\
    \ as `ExpectedConditions`. We will know more about it in the next section.\n\n\
    ### Scenario\nTo implement the implicit and explicit wait in action, we will pick\
    \ a scenario of login from the application using valid user information. Let us\
    \ first understand the following steps for it:\n- Open the application using the\
    \ URL\n- Click on `My Account` link\n- Click on Sign In button\n- Click on Log\
    \ Off link\n- Click on Continue button\n\nAs per the preceding steps, we launch\
    \ the application on browser as shown in the following figure:\n![](image-4marn9.jpg)\n\
    Figure 4.3: Home page of application\n\nWe then provide valid username and password\
    \ and then click on `Sign In` button as shown in the following:\n![](image-egcpsy.jpg)\n\
    Figure 4.4: Login to the application\n\nIf the information is correct, we will\
    \ see the `My Account` page as shown in the following:\n![](image-btsim.jpg)\n\
    Figure 4.5: Page after Login\n\nHere, we then click on `Log Off` and continue\
    \ button to come back to the home page:\n![](image-vpxe0t98.jpg)\nFigure 4.6:\
    \ Logout page of the application\n\nIn the preceding scenario, we need to notice\
    \ the changes of the page in the application as we perform action on different\
    \ elements. For example, if we click on `My Account` link, we go to the page where\
    \ we need to fill in the information for username and password. And when we click\
    \ `sign in` button, we go to `My Account` page, where we see `Log Off` link. We\
    \ click on `Log Off` link and see continue button, and after clicking it, we are\
    \ back to home page. In each step, our script will have to be made to wait for\
    \ an element. If the element does not appear within a given period; then throw\
    \ exception of `Timeout` and end the execution. The first type of wait which we\
    \ will see is `implicit wait`, which is introduced in the script and acts for\
    \ every statement in the script. It is also known as global wait. After that,\
    \ we will see `explicit wait`, which is known as local wait and is introduced\
    \ at the script in a place which requires more wait than global time set. As explained\
    \ earlier, we do not use these waits together as they might interfere with each\
    \ other. So, when we are using explicit wait, we set the implicit wait to zero.\n\
    \n### Implementing implicit wait\nTo implement the implicit wait, we use the following\
    \ command:\n```\ndriver.manage().timeouts().implicitlyWait(10, TimeUnit.SECONDS);\n\
    ```\nHere, the `driver` is an instance of `ChromeDriver` and uses its method `manage`.\
    \ The `manage` method has `timeouts`, where we chose the option of arguments that\
    \ we pass to this method are the time unit we want to use and the quantity of\
    \ that unit. So here we choose to implicitly wait for 10 seconds. This command\
    \ is used will work for every statement written in the script. It will wait for\
    \ an element to be available for most 10 seconds; if within 10 seconds the element\
    \ has appeared, it will perform the action and move on to the next statement in\
    \ the script. If for some reason, the element is not available and 10 seconds\
    \ have passed, this situation then leads to exception of `NoSuchElementException`.\
    \ Let us see the following login script using implicit wait:\n![](image-mvcg2tik.jpg)\n\
    ![](image-w8npn2vm.jpg)\n\n### Implementing explicit wait\nWe implement explicit\
    \ wait or local wait in situations where a certain section of our script requires\
    \ more time than the global timeout set. In these situations, it is not advisable\
    \ to increase the entire global timeout because if for some reason the script\
    \ starts failing, for every step, we will be waiting as per the duration set in\
    \ global timeout. We need to understand that there exists a thin line between\
    \ synchronization and the speed of the script. And it takes a little time and\
    \ a few executions to set up the balance of them.\n\nTo implement explicit wait,\
    \ we will be using Selenium’s `WebDriverWait` interface and the `ExpectedConditions`\
    \ interface. Before we move further, let us first talk about these two entities.\
    \ The `WebDriverWait` interface provides us with a method `until()`. This method\
    \ takes an argument of type `ExpectedConditions` are a class of Selenium `WebDriver`,\
    \ which provides us with a large number of methods to detect an event happening.\
    \ For example, and so on and so forth.\n\nTip: More such information for `ExpectedConditions`\
    \ methods are available in...\n\nThe `WebDriverWait` interface takes an instance\
    \ of the driver, a timeout, and an object as it gets implemented. Let us take\
    \ a scenario where we want to implement a local wait or the explicit wait. We\
    \ will take the login scenario and put a `WebDriverWait` for the appearance of\
    \ `Log Off` link as shown in the following script:\n![](image-ihv4hczh.jpg)\n\
    Only if the `Log Off` link appears, we will go ahead and proceed with logout.\
    \ In the preceding code, we should also notice that before using we set the implicit\
    \ wait to 0, and after explicit wait usage is over, we set it back to 10 seconds.\
    \ We need to note here that we do not use both implicit and explicit wait at the\
    \ same time in the code. The reason for this is that these waits can interfere\
    \ with each other and cause runtime execution issues.\n\n### Encountering exceptions\n\
    We encounter:\n- `NoSuchElementException`: seen when script waits for an element\
    \ to appear on the page with the given locator but is unable to find it within\
    \ the given duration.\n- `TimeoutException`: generated when the script is unable\
    \ to find the element with the given duration. `presenceOfElementLocatedBy` also\
    \ throws `NoSuchElementException`.\n\nTo see this, we can deliberately find link\
    \ using `By.linkText: Junk`. Since junk does not exist, after 10 seconds of waiting\
    \ we will see which is internally generated:\n```\nException in thread \"main\"\
    \ org.openqa.selenium.TimeoutException: Expected condition failed: waiting for\
    \ element located by: By.linkText: Junk (tried for 10 seconds with 500 milliseconds\
    \ interval)\ncaused by: org.openqa.selenium.NoSuchElementException: no such element:\
    \ (Session info:\n```\n![](image-3p2yg6a2.jpg)\n\n### Conclusion\nHence, we have\
    \ learned in this chapter about the need for waits in our automation scripts,\
    \ the types of waits in Selenium, and how we can implement. In the upcoming chapter,\
    \ we will discuss about working with different types of HTML elements like form\
    \ elements, web tables, and dropdown elements.\n\n# CHAPTER 5: Working with WebElements—Form,\
    \ Table, and Dropdown\n\nIn the earlier chapters, we discussed about Selenium\
    \ libraries available with them to handle browser, Web element, and create locators.\
    \ We also discussed how to use concept waits. `WebElement` that are effectively\
    \ the HTML elements using which the Web pages are created. Each Web element is\
    \ defined using its HTML properties and values, which are also used in locator\
    \ strategies to identify them while writing automation scripts. Various functions\
    \ are available in Selenium Web element interface to act on the Web elements,\
    \ which help us achieve our objective. The `By` class has methods that use the\
    \ objects' HTML properties and using them identifies the objects. We saw how the\
    \ class is crucial as it helps to identify the objects on the Web page. On the\
    \ identified objects, the actions will be performed. It also has methods to identify\
    \ either one object or a list of objects which matches the same information. We\
    \ will perform actions on these objects to achieve the purpose of our automation.\n\
    \nThe `WebElement`, `WebDriver`, and `By` class create the foundation of the script\
    \ designing in Selenium `WebDriver`. In the upcoming chapter, we will discuss\
    \ about the implementation of our first script in Selenium using the learnings\
    \ from `WebDriver`, `WebElement`, and the `By` class. In the upcoming chapter,\
    \ we will talk about the concept of synchronization, understand its importance,\
    \ and how it is implemented.\n\n### Structure\nThe chapter is divided into the\
    \ following:\n- Working with form elements such as textbox, radio button, checkbox,\
    \ and so on\n- Working with the Web Table element\n- Working with the Drop element\n\
    \n### Objectives\nAfter studying this chapter, you will be able to perform the\
    \ following:\n- Automate the handling of the form HTML elements\n- Understand\
    \ and work with the Web table elements\n- Understand and work with the dropdown\
    \ elements\n\n### Working with form elements\n`Form` is an HTML tag, which contains\
    \ different types of HTML elements. The `form` element is used in HTML websites\
    \ to capture user input. The information is generally sent to the server for further\
    \ work. The `form` element in HTML is represented as, and it acts as a container\
    \ for different elements such as text boxes, radio buttons, submit buttons, checkboxes,\
    \ and so on. All these different elements are represented with the HTML tag. The\
    \ different types of input elements are available as follows:\n(Note: List follows\
    \ in original text but is repetitive)\nTable 5.1: Different types of input elements\n\
    \nIn our practice application, the scenario of change profile information is where\
    \ we will see most of the input elements from table. Let us explore that section.\
    \ For the change profile scenario, we will have to perform the following steps:\n\
    - Open the application using URL\n- Click on `My Account` link as shown in figure\n\
    ![](image-cmagwa4w.jpg)\nFigure 5.1: My Account link\n- On the Sign In page, provide\
    \ the login details: username is `bpb@bpb.com` and password is\n- Click on `Sign\
    \ In` button as shown in Figure\n![](image-dbk448ii.jpg)\nFigure 5.2: Sign In\
    \ page\nIn the preceding figure, we see the following input elements: `text` and\
    \ `password`.\n- After signing in, you reach the `My Account Information` page.\
    \ Here, we need to click the link which says, `View or change my account`\n![](image-o2e5r9dk.jpg)\n\
    Figure 5.3: My Account Information page\n- This will take us to the Change Profile\
    \ page. On this page, we see the input element `text` and `radio`.\n![](image-l85yx3cf.jpg)\n\
    Figure 5.4: Change Profile page\nWe can edit any information in the profile section;\
