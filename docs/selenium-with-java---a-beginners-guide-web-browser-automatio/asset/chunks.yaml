    1 Introduction to Selenium Selenium automates the browser; that is it. What you
    do with that is entirely up to you. One finds this information highlighted as
    soon as you open the main page of the selenium website, hosted at the URL— http://www.selenium.dev
    . Currently, the Selenium project consists of three main components—Selenium IDE,
    Selenium WebDriver, and Selenium Grid. In this book, we will be looking at selenium
    WebDriver and selenium grid usage using Java as a programming language. Structure In
    this chapter, we will discuss the following topics:  What is Selenium Selenium
    main components  Selenium IDE Selenium WebDriver Selenium Grid Why Selenium is
    popular People behind the Selenium project Objectives After studying this unit,
    you will be able to understand:  Understand the popularity of Selenium. Have a
    brief idea about Selenium as a tool to automate the Web browser. Know the different
    components of Selenium and where they are used. What is Selenium? Selenium took
    birth in the year 2004, the idea of it. It was at that time known as JavaScriptTestRunner
    and created by Jason Huggins while working in the organization ThoughtWorks. The
    tool was created to overcome the challenges faced by the existing set of solutions
    available than in the market, and since then, a significant number of people,
    organizations have contributed to this open-source project to make it what it
    is today. Simon Stewart showcased at the GTAC conference the WebDriver version
    of talking to the browsers, considered more refined than the JavaScript proxy
    server version adopted by Selenium, eventually leading these two concepts to get
    married. Selenium married WebDriver and became the Selenium WebDriver, which we
    all use as of now. The current stable release available at the time of the book
    being written is 3.141.59\. Why Selenium is popular Selenium popularity is primarily
    due to the fact the three important features it has:  It supports multiple programming
    languages It supports test execution in multiple operating systems It supports
    test execution on multiple browsers This kind of rich feature set was rare and
    is still rare in many of the available commercial, free and open-source test automation
    solutions for Web applications. Another reason was the flexibility which the open-source
    tool provides. They inherently come up with the power of adjusting as per the
    requirements of your project instead of making you adjust within the tight boundaries
    of the tool. Also, the cost associated with procuring Selenium was nil. The tool
    was free to avail. One most important factor for Selenium to become widely popular
    was the strong user community behind it, which is still very active and can be
    found Components of Selenium Selenium currently has three major components which
    are meant to solve three important criteria as follows:  Selenium IDE Selenium
    WebDriver Selenium Grid The following table explains the use of every component: component:component:
