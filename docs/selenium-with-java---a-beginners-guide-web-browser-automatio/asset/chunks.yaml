    information to the result file? What are the two ways to pass data to a TestNG
    test?CHAPTER 9 Concept of Page Object Model Test automation of Web applications
    is a complex process, and when we try to automate the process of testing a Web
    application using open-source technologies like Selenium, we need to create infrastructure
    at the code level to handle many artifacts which we need in our code. The object
    of the Web application, on which we will perform events to achieve the end result,
    is one of the main artifacts. Handling the information related to objects and
    managing it outside the test scripts is crucial for the success of our test automation
    effort. In this chapter, we will learn about how using a design pattern; we can
    handle object information and how Selenium class can be of help as well. Structure The
    chapter is divided into the following sections:  Design pattern—page object model Code
    example for page object model Handling objects using page factory class of Selenium Code
    example for page factory Objectives The objective of this chapter is to understand
    the need for implementing a page object model at our code level. Specifically,
    when we are working with open-source technologies like Selenium, which by default
    does not come up with any mechanism to handle and manage the object information
    which we use in the test scripts. Many commercial tools such as UFT, test complete,
    and so on come with a feature set called an object repository which helps manage
    object information from the web application that we use in the test script. But
    as we have learned, Selenium is only a tool to drive the Web browser and does
    not come up with these thrills and frills. We need to use good coding practices,
    design patterns to handle these artifacts for our code. In this chapter, we will
    explore it. Page object model Martin Fowler first described this term under the
    name window driver, but it has been popularized as a page object by the Selenium
    tool and is generally used under this name. Will sincerely recommend reading about
    page object in detail from the following two links—Martin And another is from
    the Selenium website To understand page object, let us first understand the two
    basic contents of a Web page. We say a Web page consists of two important entities:  The
    business logic of the page. And the objects available on the page that help us
    implement the business logic. As the application develops over time, we will find
    that the business logic does not undergo as much change as the page object information
    might. As we design code, we need to write it in such a manner that we separate
    the object information from the business logic of the page. We will also notice
    that as we generate test automation code, we will come across scenarios that occur
    in more than one test. For example, in our Web application, the login logout scenario
    will occur in login logout action, the change profile action, change password
    action, buy product action, and many more. We can achieve the preceding using
    two ways; one is by designing ourselves POM at the code level, which will be explained
    first. And the second approach is to use page factory, which is a class defined
    by Selenium to help us implement POM. This will be explained after. Implementing
    page object model Let us take an example to understand the implementation of the
    page object model for our demo site application login logout scenario. To understand
    the concept, let us take a page—sign in, which we see after we click on the My
    Account link from the main page or our application ![](image-6eicoeu6.jpg) Figure
    9.1: Sign in page If we look at the preceding page, we see a few objects on the
    page, and there is a business objective associated with the page. The following
    describes the business objective of the page:  Allow a user with a valid credential
    to login into the application by providing a username and password. Do not allow
    a user with invalid details to login to the application. Allow a user who has
    forgotten password to retrieve its credential by clicking on the Password forgotten,
    Click here link. Allow a new user to register to the application by clicking on
    the Continue button, which takes to the register user page. If we look at the
    objects which are available on this page, which help us achieve the business objectives
    are as follows:  Email Textbox Textbox Sign Button Password Link Button As the
    application develops, we should be aware that there is a possibility that object
    information will get changed, where the HTML properties can change, new objects
    can be added, old ones removed. For example, it is possible that the Password
    forgotten is changed into a button, or the Continue button is changed into a link,
    and so on. But the business objective of this page is less likely to undergo change. The
    concept of page object model says that we separate the object information from
    the business logic of the page. And maintain objects of the page separately from
    our test script code. This helps us in introducing modularity at the code level
    because it is possible as we develop and design test scripts, the same objects
