  md: '# 4.5 Bindings


    NOTE: The property classes have methods getValue and setValue in addition to the
    get and set methods. In the StringProperty class, get is identical to getValue,
    and set to setValue. But for primitive types, they are different. For example,
    in an IntegerProperty, getValue returns an Integer, and get returns an int. Generally,
    use get and set unless you write generic code that needs to work with properties
    of any type.


    There are two kinds of listeners that can be attached to a property. AChangeListener
    is notified when the property value may has changed, and an Invalidationlistener
    is called when the property value is evaluated lazily. You will see this in the
    next section, some properties are computed from others, and the computation is
    only done when necessary. The ChangeNotifier callback tells you the old and new
    value, which means it is to compute the new value. The Invalidationlistener doesn''t
    compute the new value, but it means you get a callback when the value hasn''t
    actually changed.

    In most situations, that difference is immaterial. It doesn''t matter much whether
    you get the new value as a callback parameter or from the property. And usually,
    it is not worth worrying about computed properties that happen to stay unchanged
    though one of their inputs changed. In the preceding section, I used an Invalidationlistener
    because it made the code simpler.


    > CAUTION: It is a bit tricky to use the ChangeNotifier interface for numeric
    properties. One would like to call


    ```

    slider.valueProperty().addlistener((property, oldValue, newValue)

    -> message.setFont(new Font(newValue));

    ```


    But that does not work. Double implements Property<Number> and not Property<Double>.
    Therefore, the type for oldValue and newValue is Number and not Double, so you
    have to manually unbox:


    ```

    slider.valueProperty().addlistener((property, oldValue, newValue)

    -> message.setFont(new Font(newValue.doubleValue()));

    ```


