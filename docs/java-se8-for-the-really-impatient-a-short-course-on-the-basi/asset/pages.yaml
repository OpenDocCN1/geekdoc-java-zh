    We just discussed name clashes between two interfaces. Now consider a class that
    extends a superclass and implements an interface, inheriting the same method from
    both. For example, suppose that Person is a class and Student is defined as


    ```

    class Student extends Person implements Named { ... }

    ```


    In that case, only the superclass method matters, and any default method from
    the interface is simply ignored. In our example, Student inherits the getName
    method from Person, and it doesn''t make any difference whether the Named interface
    provides a default for getName or not. This \u2013class wins rule ensures compatibility
    with Java 7. If you add default methods to an interface, it has no effect on code
    that worked before there were default methods.


    > CAUTION: You can never make a default method that redefines one of the methods
    in the Object class. For example, you can''t define a default method for toString
    or equals, even though that might be attractive for interfaces as List. As a consequence
    of the \u201ccclasses win\ rule, such a method could never win against Object.toString
    or Object.equals.


