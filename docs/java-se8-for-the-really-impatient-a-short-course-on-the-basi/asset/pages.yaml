  md: "# 8.5.2 Streams of Directory Entries\n\nThe static Files.list method returns\
    \ a Stream<Path> that reads the entries of a directory. The directory is read\
    \ lazily, making it possible to efficiently process directories with huge numbers\
    \ of entries.\n\nSince reading a directory involves a system resource that needs\
    \ to be closed, we should use a try block:\n\n```\ntry (Stream<Path> entries =\
    \ Files.list(pathDirectory)) {\n  ...\n}\n```\n\n> NOTE: Under the hood, the stream\
    \ uses a DirectoryStream, a construct introduced in Java 7 for efficient traversal\
    \ of huge directories. That interface has nothing to do with Java 8 streams; it\
    \ extends Iterable so that it can be used in an enhanced for loop.\n\n```\ntry\
    \ (DirectoryStream stream = Files.newDirectoryStream(pathDirectory)) {\n  for\
    \ (Path entry : stream) {\n    ...\n  }\n}\n```\n\nIn Java 8, just use Files.list.\n\
    \nThe list method does not enter subdirectories. To process all descendants of\
    \ a directory, use the Files.walk method instead.\n\n```\ntry (Stream<Path> entries\
    \ = Files.walk(pathRoot)) {\n  // Contains all descendants, visited in depth-first\
    \ order\n}\n```\n\nYou can limit the depth of the tree you want to visit by calling\
    \ Files.walk(pathRoot, depth). Both walk methods have a varargs parameter of FileVisitOption...,\
    \ but there is currently only one option you can supply: FOLLOW_LINKS to follow\
    \ symbolic links.\n\n> NOTE: If you filter the paths with walk and your filter\
    \ criterion involves the file attributes stored with a directory, such as size,\
    \ creation time, or type (file, directory, symbolic link), use the find method\
    \ instead of walk. Call that method with a predicate function that accepts a path\
    \ and a BasicFileAttributes object. The only advantage is efficiency. Since the\
    \ directory is being read anyway, the attributes are readily available."
