    # 2.2.2 Bulk Operations


    Java 8 provides bulk operations on concurrent hash maps that can safely execute
    while other threads operate on the map. The bulk operations traverse the map and
    operate on the elements as they go along. No effort is made to freeze a snapshot
    of the map in time. Unless you happen to know that the map is not being modified
    while a bulk operation runs, you should treat its result as an approximation of
    the map''s state.


    There are three kinds of operations:


    +   - search applies a function to each key and/or value, until the function yields
    a non-null result. Then the search terminates and the function''s result is returned.

    - reduce combines all keys and/or values, using a provided accumulation function.

    - forEach applies a function to all keys and/or values.


    Each operation has four versions:


    +   - operationKeys: operates on keys.

    - operationValues: operates on values.

    - operation: operates on keys and values.

    - operationEntries: operates on Map.Entry objects.


    With each of the operations, you need to specify a parallelism threshold. If the
    map contains more elements than the threshold, the bulk operation is parallelized.
    If you want the bulk operation in a single thread, use a threshold of Long.MAX_VALUE.
    If you want the maximum number of threads to be made available for the bulk operation,
    use a threshold of 1.


