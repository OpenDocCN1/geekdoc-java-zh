  md: "# 9.3 Implementing the equals, hashCode, and compareTo Methods\n\n# 9.3.2 Computing\
    \ Hash Codes\n\nConsider computing a hash code for the preceding class. The Objects.hashCode\
    \ method returns a code of # for null argument, so you can implement the body\
    \ of your hashCode method like this:\n\n```\nreturn 31 * Objects.hashCode(first)\
    \ + Objects.hashCode(last);\n```\n\nBut it gets better than that. The varargs\
    \ method Objects.hash, introduced in Java 7, lets you specify any sequence of\
    \ values, and their hash codes get combined:\n\n```\nreturn Objects.hash(first,\
    \ last);\n```\n\n> NOTE: Objects.hash simply calls Arrays.hash, which existed\
    \ since Java 5. But it isn't a varargs method, making it less convenient.\n\n\
    > NOTE: There has always been a null-safe way of calling toString as String.valueOf(obj).\
    \ If obj is null, the string \"null\" is returned. If you don't that, you can\
    \ use Object.toString and supply the value to be used for null, for example Object.toString(obj,\
    \ \"\").\n\n# 9.3.3 Comparing Numeric Types\n\nWhen you compare integers in a\
    \ comparator, it is tempting to return the difference between them since you are\
    \ allowed to return any negative or positive number—only the sign matters. For\
    \ example, you are implementing a Point class:\n\n```\npublic int compareTo(Point\
    \ other) {\n    int diff = x - other.x; // Risk of overflow\n    if (diff != 0)\
