    Java 8 is a big release with important language and library enhancements. But
    there are also numerous smaller changes throughout the library that are quite
    useful. I pored over all Java 1.8 notes in the API documentation and grouped the
    changes into categories for easy reference. In this chapter, you will find what
    is new for strings, numbers, math, collections, files, annotations, regular expressions,
    and JDBC.


    The key points of this chapter are:


    +   - Joining strings with a delimiter is finally easy: String.join("", a, b,
    c) instead of a + " + " + b + " + " + c.

    - Integer types now support unsigned arithmetic.

    - The Math class has methods to detect integer overflow.

    - Use Math.floorMod(x, n) instead of % n if x might be negative.

    - There are new mutators in Collection (removeIf) and List (replaceAll, sort).

    - Files.lines lazily reads a stream of lines.

    - Files.list lazily lists the entries of a directory, and Files.walk traverses
    them recursively.

    - There is finally official support for Base64 encoding.

    - Annotations can now be repeated and applied to type uses.'
