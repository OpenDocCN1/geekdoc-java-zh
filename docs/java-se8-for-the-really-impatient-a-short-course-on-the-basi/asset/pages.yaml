  md: 'In a corporate environment, you can effectively secure Java RIAs, provided
    you have control over the applications and the client machines. You will need
    to tightly manage the application packaging and be ready to update client VMs
    when security updates become available.


    > NOTE: To more tightly manage corporate RIAs, you can provide deployment rulesets
    on end-user machines. The process—not for the faint of heart—is explained at http://docs.oracle.com/java/7/docs/technotes/guides/jweb/deployment_rules.html.


    # 9.5 Miscellaneous Changes


    As in the preceding chapter, this section describes a number of smaller features
    that you may find interesting or useful.


    # 9.5.1 Converting Strings to Numbers


    Prior to JDK 1.7, what was the result of the following code segment?


    ```

    double x = Double.parseDouble("1.0");

    int n = Integer.parseInt("1");

    ```


    Pat yourself on the back if you know the answer: +1.0 has always been a valid
    floating-point number, but until Java 7, +1 was not a valid integer.


    This has now been fixed for all the various methods that construct int, long,
    short, byte, and Big values from strings. There are more than you might think.
    In addition to parse(Long | Short | Byte), there are decode methods that work
    with hexadecimal and octal inputs, valueOf methods that yield wrapper objects.
    The BigInteger(String) constructor is also updated.


    # 9.5.2 The Global Logger


    In order to encourage the use of logging even in simple cases, the Logger class
    has a global logger instance. It was meant to be as easy as possible to use, so
    that you could always add trace statements to Logger.global.finest("x=" + x);
    instead of System.out.println("x=" + x\).


    Unfortunately, that instance variable has to be initialized somewhere, and if
    other logging happens in the static initialization code, it was possible to cause
    deadlocks. Therefore, Logger.global was deprecated in Java 6. Instead, you were
    supposed to call Logger.getLogger(Logger.global, GLOBAL_LOGGER_NAME), which wasn''t
    anyone''s idea of quick and easy logging.


    In Java 7, you can call Logger.global() instead, which isn''t too bad.'
