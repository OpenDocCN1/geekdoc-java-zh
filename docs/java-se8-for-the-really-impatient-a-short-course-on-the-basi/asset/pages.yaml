  md: '# But the call


    ''Hello''.compareTo(''World'')


    also works, even though in JavaScript there is no compareTo method. (You just
    use the <operator>).


    In this case, the JavaScript string is converted to a Java string. In general,
    a JavaScript string is converted to a Java string whenever it is passed to a Java
    method.


    Also note that any JavaScript object is converted to a string when it is passed
    to a Java method with a String parameter. Consider


    ```

    var path = java.nio.file.Paths.get(/home/)

    // A JavaScript RegExp is converted to a Java String!

    ```


    /home/ is a regular expression. The Paths.get method wants a String, and it gets
    one, even though it makes no sense in this situation. One shouldn''t blame Nashborn
    for this. It follows the general JavaScript behavior to turn anything into a string
    when a string is expected. The conversion happens for numbers and Boolean values.
    For example, ''Hello''.slice(''-2'') is perfectly valid. The string ''-2'' is
    silently converted to the number -2. It is features such as this one that make
    programming in a dynamically typed language an exciting adventure.


    # 7.6 Numbers


    JavaScript has no support for integers. Its Number type is the same as the Java
    double type. When a number is passed to Java code that expects an int or long,
    any fractional part is silently removed. For example, ''Hello''.slice(-2.99) is
    the same as ''Hello''.slice(-2).


    For efficiency, Nashborn keeps computations as integers, but that difference is
    generally transparent. Here is one situation when it is not:


    ```

    var price = 10

    java.lang.String.format(''Price: %.2f'', price)

    // Error: f format not valid for java.lang.Integer

    ```


    The value of price happens to be an integer, and it is assigned to an Object since
    the format method has an Object... varargs parameter. Therefore, Nashborn produces
    a java.lang.Integer. That causes the format method to fail, since the f is intended
    for floating-point numbers. In this case, you can force conversion to java.lang.Double
    by calling the Number function:


    ```

    java.lang.String.format(''Unit price: %.2f'', Number(price))

    ```'
