  md: '# 7.13 Nashorn and JavaFX


    > NOTE: If you need to override the init or stop lifecycle methods of the Application
    class in addition to start, include the methods that you need in your script,
    at the top level. With the -fx option, then you get a subclass of Application
    with script methods.


    Let us look at event handling. As you have seen in Chapter 4, most FX events are
    handled by listeners to FX properties. Here, the JavaScript story isn''t so pretty.
    Recall that an FX property has two listener interfaces, InvalidationListener and
    ChangeListener, both added with the addlistener method. In Java, you can call
    addlistener with a lambda expression, and the compiler is able to figure out the
    parameter types of the two listeners to add. But in JavaScript, function parameters
    have no types. Suppose we have a slider to control the font size. We would like
    to add a listener that updates the size when the slider changes:


    ```

    slider.valueProperty().addlistener(function(property)

    message.font = new Font(slider.value))

    // Error—Nashorn doesn''t determine which listener type to add

    ```


    That doesn''t work. Nashorn doesn''t know whether you want to add an InvalidationListener
    or a ChangeListener, and it doesn''t know that you don''t actually care.


    To fix this, you need to make the choice:


    ```

    slider.valueProperty().addlistener(

    new javafx.beans.InvalidationListener(function(property))

    message.font = new Font(slider.value))

    ```


    That''s more heavyweight than the Java equivalent—not something one wants to see
    in a lightweight scripting language. There is nobody to blame for this, really.
    The JavaFX designers made the decision to overload the addlistener method, which
    was perfectly reasonable in the context of Java 7 and mostly works with Java 8
    lambda expressions. Compatibility with scripting languages was perhaps not their
    major concern, particularly since they had just abandoned another language.


    But it should be a cautionary tale. When you design a Java API, remember Atwood''s
    law: "Any application that can be written in JavaScript will eventually be written
    in JavaScript." Design your API so that it can be accessed nicely from JavaScript.


    And there is another sad aspect about JavaFX in Nashorn. Recall how in the old
    days of Java Script, it was easy to describe the layout of a scene like this:'
