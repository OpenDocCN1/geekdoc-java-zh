  md: '# # Chapter 7


    For many years, Java bundled Rhino JavaScript interpreter, an open source JavaScript
    interpreter written in Java. It is called Rhino because a well-regarded JavaScript
    book has the image of a rhinoceros on its cover. Rhino works just fine, but it
    isn''t particularly fast. Oracle''s engineers realized that they could build a
    much more efficient JavaScript interpreter using the new JVM instructions designed
    for dynamic languages. Thus, the Nashorn project was born. Nashorn is the German
    word for rhinoceros—literally, nose-horn. (You get extra karma for pronouncing
    it nas-horn, not na-shorn.) Nashorn is very fast, and it lets you integrate Java
    with JavaScript on a highly performant virtual machine. It is also incredibly
    compliant with the ECMAScript standard for JavaScript. If you are thinking of
    giving your users the ability to script your application, or if you are intrigued
    by the use of reactive programming environments such as node.js, check out Nashorn
    in Java 8. Not only do you get the benefits of a reasonably well-defined scripting
    language (i.e., JavaScript), but you have the full power of the JVM behind it.


    The key points of this chapter are:


    +   - Nashorn is the successor to the Rhino JavaScript interpreter, with greater
    performance and fidelity to the JavaScript standard.

    - Nashorn is a pleasant environment for experimenting with the Java API.

    - You can run JavaScript through the jjs interpreter, or from Java via the scripting
    API.'
