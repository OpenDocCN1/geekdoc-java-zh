  md: "# 1.7 Default Methods\n\nWhat happens if the exact same method is defined as\
    \ a default method in an interface and then again as a method of a superclass\
    \ or another interface? Languages such as Scala and C++ have complex rules for\
    \ resolving such ambiguities. Fortunately, the rules in Java are much simpler.\
    \ Here they are:\n\n+   1. Superclasses win. If a superclass provides a concrete\
    \ method, default methods with the same name and parameter types are simply ignored.\n\
    \n+   2. Interfaces clash. If a superinterface provides a default method, and\
    \ another interface supplies a method with the same name and parameter types (default\
    \ or not), then you must resolve the conflict by overriding it.\n\nLet's look\
    \ at the second rule. Consider another interface with a getName:\n\n```\ninterface\
    \ Named {\n    default String getName() { return getClass().getName() + \"_\"\
    \ + hashCode(); }\n}\n```\n\nWhat happens if you form a class that implements\
    \ both of them?\n\n```\nclass Student implements Person, Named {\n    ...\n}\n\
    ```\n\nThe class inherits two inconsistent getName methods provided by the Person\
    \ and Named interfaces. Rather than choosing one over the other, the Java compiler\
    \ reports an error and leaves it to the programmer to resolve the ambiguity. Simply\
    \ provide a getName method in the Student class. In that method, you can choose\
    \ one of the two conflicting methods, like this:\n\n```\nclass Student implements\
    \ Person, Named {\n    public String getName() { return Person.super.getName();\
    \ }\n    ...\n}\n```\n\nNow that the Named interface does not provide a default\
    \ implementation for getName:\n\n```\ninterface Named {\n    String getName();\n\
    }\n```\n\nCan the Student class inherit the default method from the Person interface?\
    \ This might be reasonable, but the Java designers decided in favor of uniformity.\
    \ It doesn't matter how two interfaces conflict. If at least one interface provides\
    \ an implementation, the compiler reports an error, and the programmer must resolve\
    \ the ambiguity."
