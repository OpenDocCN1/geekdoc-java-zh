    # 4.8 CSS


    JavaFX lets you change the visual appearance of the user interface with CSS, which
    is usually more convenient than supplying FXML attributes or calling Java methods.


    You can load a CSS style sheet programmatically and have it applied to a scene
    graph:


    ```

    Scene scene = new Scene(pane);

    scene.getStylesheets().add("scene.css");

    ```


    In the style sheet, you can reference any controls that have an ID. For example,
    here is how you can control the appearance of a GridPane. In the code, set the
    ID:


    ```

    GridPane pane = new GridPane();

    pane.setId("pane");

    ```


    Don''t set any padding or spacing in the code. Instead, use CSS:


    ```

    #pane {

    -fx-padding: 0.5Sem;

    -fx-hgap: 0.5Sem;

    -fx-vgap: 0.5Sem;

    -fx-background-image: url("metal.jpg")

    }

    ```


    Unfortunately, you can''t use the familiar CSS but need to know FX-specific attributes
    that start with -fx-. The attribute names are formed by changing the property
    name to lowercase and using hyphens instead of camel case. For example, the textAlign
    property turns into -fx-alignment. You can find all supported attributes in the
    JavaFX CSS reference at http://docs.oracle.com/javafx2/api/javafx/scene/doc-files/cssref.html.


    Using CSS is nicer than cluttering the code with layout minutiae. Moreover, you
    can easily use resolution-independent units. Of course CSS can be used both for
    good and for evil (see Figure 4-11), and I hope you will resist the temptation
    to use individual background textures to your login dialogs.


    Instead of styling individual HBox IDs, you use style classes. Add the class to
    the node object:


    ```

    HBox buttons = new HBox();

    buttons.setStyleClass().add("buttonrow");

    ```


