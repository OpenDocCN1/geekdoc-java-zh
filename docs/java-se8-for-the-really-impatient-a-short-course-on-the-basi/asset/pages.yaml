  md: '# 8.4 Collections


    Table 8–1 Methods Added to Collection Classes and Interface in Java 8


    | Class/Interface | New Methods |

    |---|---|

    | Iterable | forEach |

    | Collection | removeItem |

    | List | replaceAll, sort |

    | Map | forEach, replace, replaceAll, remove(key, value) (removes only if key
    mapped to value), putIfAbsent, compute computeIf(Absent | Present), merge |

    | Iterator | forEachRemaining |

    | BitSet | stream |


    The Map interface has a number of methods that are particularly important for
    maps accessed concurrently. See Chapter 6 for more information on these methods.


    The Iterator interface has a forEach method that exhausts the iterator by feeding
    the remaining iterator elements to a function.


    Finally, the BitSet class has a method that yields all members of the set as a
    stream of int values.


    # 8.4.2 Comparators


    The Comparator interface has a number of useful new methods, taking advantage
    of the fact that interfaces can now have concrete methods.

    The static comparing method takes a "key extractor" function that maps a type
    T to a comparable type (such as String). The function is applied to the objects
    to be compared, and the comparison is then made on the returned keys. For example,
    suppose you have an array of Person objects. Sort them by name:

    Arrays.sort(people, Comparator.comparing(Person::getName));


    You can chain comparators with the thenComparing method for breaking ties. For
    example:

    Arrays.sort(people,

    Comparator.comparing(Person::getLastName),

    thenComparing(Person::getFirstName));


    If two people have the same last name, then the second comparator is used.'
