  md: '# # Chapter 9


    When Java 7 was released, most reviewers focused on the new language features:
    strings in switch statements, binary literals, underscores in literals, improved
    type inference, and so on. In this chapter, I will write about some of the library
    changes that haven''t been discussed so much and I have found far more useful
    in daily work than switching on strings or binary literals. I cover one language
    change that is very useful in daily work—the try-with-resources statement.

    The key points of this chapter are:


    +   - Use the try-with-resources statement with any object that implements AutoCloseable.

    - Use the try-with-resources statement rethrows the primary exception if closing
    a resource throws another exception.

    - You can catch unrelated exceptions with a single catch clause.

    - The exceptions for reflective operations now have a common superclass ReflectiveOperationException.

    - Use the Path interface instead of the File class.

    - You can read and write all characters, or lines, of a text file with a single
    command.

    - The Files class has static methods for copying, moving, and deleting files,
    for creating files and directories.

    - Use Objects.equals for null-safe equality testing.'
