    # 4.6 Layout


    When a graphical user interface contains multiple controls, they need to be ar-
    on the screen in a functional and attractive way. One way to obtain a layout is
    with a design tool. The tool''s user, often a graphics designer, drags im-ages
    of the controls onto a design view and arranges, resizes, and configures them.
    However, this approach can be problematic when the sizes of the elements change,
    for example, because labels have different lengths in international versions of
    a program.


    Alternatively, the layout can be achieved programmatically, by writing code in
    a setup method that adds the user interface controls to specific positions. That
    is what was done in Swing, using layout manager objects.


    Another approach is to specify the layout in a declarative language. For example,
    web pages are laid out with HTML and CSS. Similarly, Android has an XML language
    for specifying layouts.


    JavaFX supports all three approaches. The JavaFX SceneBuilder is a visual GUI
    builder. You can download it from www.oracle.com/technetwork/java/javafx/overview.
    Figure 4-6 shows a screenshot.


    We won''t discuss the SceneBuilder program further. When you understand the concepts
    of this speech, you will find straightforward to use.


    Programmatic layout is very similar to Swing. However, instead of man-agers that
    are added to arbitrary panels, one uses panes—containers with a layout policy.
    For example, a BorderPane has five areas: North, West, South, East, and here we
    place a button into each:


    ```

    BorderPane pane = new BorderPane();

    pane.setTop(new Button("Top"));

    pane.setLeft(new Button("Left"));

    pane.setCenter(new Button("Center"));

    pane.setRight(new Button("Right"));

    pane.setBottom(new Button("Bottom"));

    stage.setScene(new Scene(pane));

    ```


    Figure 4–7 shows the result.'
