  md: '# # Chapter 6


    Concurrent programming is hard, and it is harder without the right tools. Early
    Java releases had minimal support for concurrency, and programmers busily created
    code with deadlocks and race conditions. The robust java.util.concurrent package
    didn''t appear until Java 5. That package gives us threadsafe collections and
    thread programs without using locks or starting threads. Unfortunately, java.util.concurrent
    is a mix of useful utilities for the application programmer and power tools for
    library authors, without much effort to separate the two. In this chapter, we
    focus squarely on the needs of the application programmer.


    The key points of this chapter are:


    +   - Updating atomic variables has become simpler with the updateAndGet/accumulateGet
    methods.

    - LongAccumulator/DoubleAccumulator are more efficient than AtomicLong/AtomicDouble
    under high contention.

    - Updating entries in a ConcurrentHashMap has become simpler with the compute
    and merge methods.

    - ConcurrentHashMap now has bulk operations search, reduce, forEach, with variants
    operating on keys, values, keys and values, and entries.'
  merge: -1
