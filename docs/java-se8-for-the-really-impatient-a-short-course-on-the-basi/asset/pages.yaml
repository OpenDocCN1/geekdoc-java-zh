  md: '# Chapter 4 JavaFX


    ![](img/ddf393433cea9fb15be8c839ccf979c4_109_0.png)


    Figure 4–12 Buttons that grow, fade, and turn


    demos on the Web with swirling bubbles moving aimlessly, how to jumping nervously,
    and so on. I thought you''d enjoy some useful tips on how to bring these animations
    to the world of business applications. Figure 4–12 shows an application where
    the Yes button increases in size while the No button fades into the background
    and the Maybe button rotates.


    JavaFX defines a number of transitions, that over a period of time, vary a property
    of a node. Here is how you grow a node by 50% in both x and y directions over
    three seconds:


    ```

    ScaleTransition st = new ScaleTransition(Duration.millis(3000));

    st.setByX(1.5);

    st.setByY(1.5);

    st.setNode(yesButton);

    st.play();

    ```


    The node can be any node in a scene graph, such as a circle in an animation of
    soap bubbles or the ever more enticing Yes button in our example.


    As set up, the transition will end when its goal is met. You can cycle it indefinitely
    like this:


    ```

    st.setCycleCount(Animation.INDEFINITE);

    st.setAutoReverse(true);

    ```


    Now the node will get bigger, smaller, then bigger again, and so on.

    The FadeTransition changes the opacity of a node. Here is how the No button fades
    into the background:


    ```

    FadeTransition ft = new FadeTransition(Duration.millis(3000));

    ft.setFromValue(1.0);

    ft.setToValue(0);

    st.setNode(noButton);

    ft.play();

    ```


    All JavaFX nodes can be rotated around their center. The RotateTransition changes
    the node’s rotate property. The following code animates the rotation of the Maybe
    button:'
