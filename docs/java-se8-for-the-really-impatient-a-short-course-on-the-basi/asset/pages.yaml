  md: '# Preface


    This book gives a concise introduction to the many new features of Java 8 (and
    a few features of Java 7 that haven''t received much attention) for programmers
    who are already familiar with Java.


    This book is written in the "impatient" style that I first tried out in a book
    called Scala for the Impatient. In that book, I wanted to quickly cut to the chase
    without lecturing the reader about the superiority of one paradigm over another.
    I presented information in small chunks organized to help you quickly retrieve
    it when needed. The approach was a big success in the Scala community, and I am
    employing it again in this book.


    With Java, the Java programming language and library receive a major refresh.
    Lambda expressions make it possible to write "snippets of computations" in a concise
    way, so that you can pass them to other code. The recipient can choose to execute
    your computation when appropriate and as often as appropriate. This has a profound
    impact on building libraries.


    In particular, working with collections has completely changed. Instead of specifying
    how to compute a result ("traverse from the beginning to the end, and if an element
    matches a condition, compute a value from it, and add that to a sum") specify
    what you want ("give me the sum of all elements that match a condition"). The
    library is then able to reorder the computation—for example, to take advantage
    of parallelism. Or, if you just want to have the first hundred matches, it can
    stop the computation without you having to maintain a counter.'
