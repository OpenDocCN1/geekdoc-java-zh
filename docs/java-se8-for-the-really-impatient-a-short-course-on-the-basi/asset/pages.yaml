    # 4.1 A Brief History of Java GUI Programming


    When Java was born, in its infancy and personal computers the Internet was on
    every desktop. Business applications were implemented with "fat clients"programs
    with lots of buttons and sliders and text fields that communicated with a server.
    This was considered a lot nicer than the "dumb terminal" applications from an
    earlier era. Java 1.0 included the AWT, a toolkit for graphical user interfaces,
    that had the distinction of being cross-platform. The idea was to serve the fat
    clients over the nascent Web, eliminating the cost of managing and updating the
    applications on every desktop.


    The AWT had a noble idea: provide a common programming interface for the native
    buttons, sliders, text fields, and so on of various operating systems. But it
    didn''t work very well. There were subtle differences in the functionality of
    the user interface widgets in each operating system, and what should have been
    "once, run anywhere" turned into "many times, debug everywhere." Next come Swing.
    The central idea behind Swing was not to use the native widgets, but to paint
    its own way. That the user interface would look and feel the same on every platform.
    Or, if users preferred, they could ask for the native look and feel of their platform,
    and the Swing widgets would be painted to match the native ones. Of course, all
    that painting was slow, and users complained. After a while, computers got faster,
    and users complained that Swing was ugly—indeed fallen behind the native widgets
    that had been spruced up with animations and fancy effects. More obviously, Flash
    was increasingly used to create user interfaces with even flashier effects that
    didn''t use the native controls at all.


    In 2007, Sun Microsystems introduced a new technology, called JavaFX, a competitor
    to Flash. It ran on the Java VM but had its own programming language, called JavaFX
    Script. The language was optimized for programming animations and fancy effects.
    Programmers complained about the need to learn a new language, and they stayed
    away in droves. In 2011, Oracle released a new version, JavaFX2.0, that had a
    Java API and no longer needed a separate programming language. As of Java 7 update
    JavaFX 2.2 has been bundled with the JDK and JRE. Since it wouldn''t be a true
    part of JavaFX if it didn''t have crazy jumps in version, the version accompanying
    Java 8 is called JavaFX.


    Of course, Flash is now a bad memory, and most user interfaces live in a browser
    or a mobile device. Still, there are situations where a "fat client" on a desktop
    makes users more productive. Also, Java now runs on ARM processors, and'
