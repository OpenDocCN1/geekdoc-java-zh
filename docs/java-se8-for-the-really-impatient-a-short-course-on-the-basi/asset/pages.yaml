  md: 'The call path.exists() method checks whether the given file or directory exists,

    of of course it might cease to exist by the time the method has returned.

    There are convenience methods for creating a temporary file or directory in

    system-specific location.


    ```

    Path newInput = Files.createTempFile(dir, prefix, suffix);

    Path newInput = Files.createTempFile(prefix, suffix);

    Path newInput = Files.createTempDirectory(dir, prefix);

    Path newInput = Files.createTempDirectory(prefix);

    ```


    Here, dir is a Path, and prefix/suffix are strings which may be null. For

    example, the call Files.createTempFile(null, ".txt") might return a path such
    as

    /tmp/12340552364837194.txt.


    > NOTE: To read files from a directory, use the Files.list and Files.walk

    methods described in Chapter 8.


    # 9.2.4 Copying. Moving, and Deleting Files


    To copy a file from one location to another, simply call


    ```

    Files.copy(fromPath, toPath);

    ```


    To move a file (that is, copy and delete the original), call


    ```

    Files.move(fromPath, toPath);

    ```


    You can also use this command to move an empty directory.


    The copy or move will fail if the target exists. If you want to overwrite an existing

    target, use the REPLACE_EXISTING option. If you want to copy all file attributes,

    you use the COPY_ATTRIBUTES option. You can supply both like this:


    ```

    Files.copy(fromPath, toPath, StandardCopyOption.REPLACE_EXISTING,

    StandardCopyOption.COPY_ATTRIBUTES);

    ```


    You can specify that a move should be atomic. You are assured that either

    tmove completed successfully, or the source continues to be present.

    ATOMIC_MOVE option:


    ```

    Files.move(fromPath, toPath, StandardCopyOption.ATOMIC_MOVE);

    ```


    Finally, to delete a file, simply call


    ```

    Files.delete(path);

    ```


    This method throws an exception if the file doesn''t exist, so instead you may

    want to use


    ```

    boolean deleted = Files.deleteIfExists(path);

    ```'
