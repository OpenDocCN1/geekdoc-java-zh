  md: '# 8.6 Annotations


    > NOTE: What I described relates to processing runtime annotations with the reflection
    API. If you process source-level annotations, you use the jav.lang.model and java.annotation.processing
    APIs. In those APIs, there is no support for "looking through" a container. You
    will need to process both the individual annotation (if it is supplied) and the
    container (if the same annotation is supplied more than once).


    # 8.6.2 Type Use Annotations


    Prior to Java 8, an annotation was applied to a declaration. A declaration is
    a part of code that introduces a new name. Here are a couple of examples, with
    the declared name in bold:


    ```

    @Entity public class Person { ... }


    @SuppressWarnings("unchecked") List<Person> people = query.getResultList();();

    ```


    In Java 8, you can annotate any type used. This can be useful in combination with
    tools that check for common programming errors. One common error is throwing a
    NullPointerException because the programmer didn''t anticipate that a return might
    be null. Now suppose you annotated variables that you never want to be null as
    @NotNull. A tool can check that the following is correct:


    ```

    private NullList<String> names = new ArrayList<>()();

    ```


    ```

    names.add("Fred"); // No possibility of a NullPointerException

    ```


    Of course, the tool should detect any statement that might cause names to become
    null:

    names = null; // Null checker flags this as an error

    names = readNames(); // OK if readNames() returns a @NotNull String


    It sounds tedious to put such annotations everywhere, but in practice, some of
    the drudgery is avoided by simple heuristics. The null checker in the Checker
    Framework (http://types.cs.washington.edu/checker-framework) assumes that nonlocal
    variables are implicitly @NotNull, but local variables are null unless the code
    shows otherwise. If a method might return a null, it needs to be annotated as
    @NotNull. That may not be any worse than documenting the nullness behavior. (The
    Java API documentation has over 5,000 occurrences of "NullPointerException.")


    In the preceding example, the names variable was declared as @NotNull. That annotation
    was possible before Java 8. But how can one express that the list elements should
    be non-null? Logically, that would be


    ```

    private List<@NotNull String> names;

    ```'
