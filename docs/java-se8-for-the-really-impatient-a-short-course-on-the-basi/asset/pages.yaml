    Generally, the methods on primitive type streams are analogous to those on object
    streams. Here are the most notable differences:


    +   - TheArray methods return primitive type arrays.


    +   - Methods that yield an optional result return OptionalInt, OptionalLong,
    or OptionalDouble. These classes are analogous to the Optional class, but they
    have methods getInt, getLong, and getDouble instead of the get method.


    +   - There are methods sum, average, max, and min that return the sum, average,
    and minimum. These methods are not defined for object streams.


    +   - The summaryStatistics method yields an object of type IntSummaryStatistics,
    LongSummaryStatistics, or DoubleSummaryStatistics that can simultaneously return
    the sum, average, maximum, and minimum of the stream.


    > NOTE: The Random class has methods ints, longs, and doubles that return primitive
    types of random numbers.


    # 2.13 Parallel Streams


    Streams make it easy to parallelize bulk operations. The process is mostly automatic,
    but you need to follow a few rules. First of all, you must have a parallel stream.
    By default, stream operations create sequential streams, except for Collection.parallelStream().
    The parallel method converts any sequential stream into a parallel one. For example:


    ```

    Stream<String> parallelWords = Stream.of(toArray).parallel();

    ```


    As long as the stream is in parallel mode all lazy intermediate stream operations
    will be parallelized.


    When stream operations run in parallel, the intent is that the same result is
    returned as if they had run serially. It is important that the operations are
    stateless and can be executed in an arbitrary order.


    Here is an example of something you cannot do. Suppose you want to count all short
    words in a stream of strings:'
