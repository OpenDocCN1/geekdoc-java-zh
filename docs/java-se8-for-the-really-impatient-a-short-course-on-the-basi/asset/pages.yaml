  md: "# 1.7 Default Methods\n\nMany programming languages integrate function expressions\
    \ with their collections library. This often leads to code that is shorter and\
    \ easier to understand than the loop equivalent. For example, consider a loop\n\
    \n```\nfor (int i = 0; i < list.size(); i++) {\n    System.out.println(list.get(i));\n\
    ```\n\nThere is a better way. The library designers can supply a foreach method\
    \ that applies a function to each element. Then you can simply call\n\n```\nlist.forEach(System.out.println);\n\
    ```\n\nThat's fine if the collections library has been designed many years ago,\
    \ but there is a problem. The Java collections library has been designed many\
    \ years ago, and so forth, as for, the Collection interface gets new methods,\
    \ then every program that defines its own class implementing Collection will break\
    \ until it, too implements that method. That is simply unacceptable in Java.\n\
    \nThe Java designers decided to solve this problem once and for all by allowing\
    \ interface methods with concrete implementations (called default methods). These\
    \ methods can be safely added to existing interfaces. In this section, we'll look\
    \ into default methods in detail.\n\n> In In Java 8, the foreach method has been\
    \ added to the Iterable interface, a superinterface of Collection, using the mechanism\
    \ that I will describe in this section.\n\nConsider this interface:\n\n```\ninterface\
    \ Person {\n    long getID();\n    default String getName() { return \"John Q.\
    \ Public\"; }\n}\n```\n\nThe interface has two methods: getId, which is an abstract\
    \ method, and the default method getName. A concrete class that implements the\
    \ Person interface must, of course, provide an implementation of getId, but it\
    \ can choose to keep the implementation of getName or to override it.\n\nDefault\
    \ methods put an end to the classic pattern of providing an interface and an abstract\
    \ class that implements most or all of its methods, such as Collection/AbstractCollection\
    \ or WindowListener/WindowAdapter. Now you can just implement the methods in the\
    \ interface."
