  md: '# Chapter 7 The Nashorn JavaScript Engine


    # 7.9 Lambdas


    JavaScript has anonymous functions, such as


    ```

    var square = function(x) { return x * x }

    // The right-hand side is an anonymous function

    var result = square(2)

    // The (operator) invokes the function

    ```


    Syntactically, an anonymous function is very similar to a Java lambda expression.
    Instead of an arrow after the parameter list, you have the keyword function.


    You can use an anonymous function as a functional interface argument of a Java
    method, just like you could use a lambda expression in Java. For example,


    ```

    java.util.Arrays.sort(words,

    function(a, b) { return java.lang.Integer.compare(a.length, b.length) }

    // Sorts the array by increasing length

    ```


    Nashorn shorthand for functions whose body is a single expression. For such functions,
    you can omit the braces and the return keyword:


    ```

    java.util.Arrays.sort(words,

    function(a, b) java.lang.Integer.compare(a.length, b.length))

    ```


    Again, note the similarity with a Java lambda expression (a, b) -> Integer.compare(a.length,
    b.length).


    > NOTE: That shorthand notation (called an "expression closure") is not part of
    the official JavaScript language standard (ECMAScript 5.1), but it is also supported
    by the Mozilla JavaScript implementation.


