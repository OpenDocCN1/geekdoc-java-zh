    \n| Method Name | Arguments |\n|---|---|n| convert | An ObservableValue that is\
    \ converted to a string binding |\n| concat | A sequence of objects whose toString\
    \ values are concatenated. If any of the objects is an ObservableValue that changes,\
    \ the concatenation changes too. |\n| format | An optional locale, a MessageFormat\
    \ string, and a sequence of objects that are formatted. If any of the objects\
    \ is an ObservableValue that changes, the formatted string changes too. |\n| valueAt\
    \ (double | float | integer | long)valueAt stringValue | An ObservableList and\
    \ an index, or ObservableMap and a key |\n| create(Boolean | Double | Float |\
    \ Long | String)Binding | A Callable and a list of dependencies |\n| select select(Boolean\
    \ | Double | Float | Integer | String) | An Object or ObservableValue and a sequence\
    \ of public property names, yielding the property obj.p1,p2,...,pn |\n| when |\
    \ Yields a builder for a conditional operator. The binding when(b),then(d1).otherwise(d2)\
    \ d1 or d2, depends on whether the ObservableValue b is true or not. Here, d1\
    \ or d2 can be regular or observable values. The conditional value is recomputed\
    \ whenever an observable value changes. |\n\nBuilding up a computed property with\
    \ the methods of the Bindings class can get quite baroque. There is another approach\
    \ for producing computed bindings that you may find easier. Simply put the expression\
    \ that you want to have computed into a lambda, and supply a list of dependent\
    \ properties. When any of the properties changes, the lambda is recomputed. For\
    \ example,\n\n```\nlarger.disableProperty().bind(\n  createBooleanBinding(\n \
    \   () -> gauge.getWidth() >= 100, // This expression is computed...\n    gauge.getWidthProperty(gauge.getWidth()));\
