    # 5.6 Formatting and Parsing


    The DateTimeFormatter class provides three kinds of formatters to print a date/time
    value:


    +   * Predefined standard formatters (see Table 5–6)

    * Locale-specific formatters

    * Formatters with custom patterns


    To use one of the standard formatters, simply call its format method:


    ```

    String formatted = DateTimeFormatter.ISO_DATE_TIME.format(apollo11launch);

    // 1969-07-16T09:32:00-05:00[America/New_York]

    ```


    The standard formatters are mostly intended for machine-readable time-amps. To
    present dates and times to human readers, use a locale-specific formatter. There
    are four styles, SHORT, MEDIUM, LONG, and FULL, for both date and time—see Table
    5–7.


    The static methods oflocalizedDate, localizedTime, and oflocalizedDateTime create
    a formatter.


    DateTimeFormatter formatter = DateTimeFormatter.ofLocalizedDate(FormatStyle.LONG);


    ```

    String formatted = formatter.format(apollo11launch);

    // July 16, 1969 9:32:00 AM

    ```


    These methods use the default locale. To change to a different locale, simply
    use the withLocale method.'
