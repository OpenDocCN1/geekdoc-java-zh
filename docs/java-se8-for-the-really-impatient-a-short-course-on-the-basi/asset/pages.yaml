    # 9.3 Implementing the equals, hashCode, and compareTo Methods\n\nJava 7 introduces\
    \ several methods that make it more convenient to deal with null values in the\
    \ ubiquitous equals and hashCode, and with numeric comparisons in compareTo.\n\
    \n# 9.3.1 Null-safe Equality Testing\n\nSuppose you have to implement the equals\
    \ method for this class:\n\n```\npublic class Person {\n    private String first;\n\
    \    private String last;\n    ...\n}\n\npublic boolean equals(Object otherObject)\
    \ {\n    if (this == otherObject) return true;\n    if (otherObject == null) return\
    \ false;\n    if (getClass() != otherObject.getClass()) return false;\n    Person\
    \ other = (Person) otherObject;\n    ...\n}\n```\n\nFirst, there is the drudgery\
    \ of casting the parameter to a Person:\n\nUnfortunately, that drudgery isn't\
    \ simplified yet. But now it gets better. Instead of worrying that first or last\
    \ might be null, just call\n\n```\nreturn Objects.equals(first, other.first) &&\
    \ Objects.equals(last, other.last);\n```\n\nThe call Objects.equals(a, b) returns\
    \ true if both a and b are null, false if only a is null, and a.equals(b) otherwise.\n\
    \n> NOTE: In general, it is a good idea to call Objects.equals(a, b) when you\
    \ would have called a.equals(b) before."
