    constructor is only called when a new counter is actually needed.


    You need to do something special when a key is added for the first time. The merge
    method makes this particularly convenient. It has a parameter for the initial
    value that is used when the key is not present otherwise. Otherwise, the function
    you supplied is called, combining the existing value and the initial value. Unlike
    compute, the function does not process the key.


    ```

    map.merge(word, 1L, (existingValue, newValue) -> existingValue + newValue);

    or, more simply,

    ```


    ```

    map.merge(word, 1L, Long::sum);

    ```


    It doesn''t get more concise than that. See Exercise 5 for another compelling
