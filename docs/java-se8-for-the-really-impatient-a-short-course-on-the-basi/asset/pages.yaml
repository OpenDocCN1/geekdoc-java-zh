  md: 'That''s pretty ugly, and it is no longer necessary in Java 8.


    As an annotation user, that is all you need to know. If your framework provider
    has enabled repeated annotations, you can just use them.


    For a framework implementor, the story is not quite as simple. After all, the
    AnnotatedElement interface has a method


    ```

    public <T extends Annotation> T getAnnotation(Class<T> annotationClass)

    ```


    that gets the annotation of type T, if of present. What method do it if multiple
    annotations of the same type are present? Return the first one only? That could
    have all sorts of undesirable behavior with legacy code.


    To solve this problem, the inventor of a repeatable annotation must


    +   1. Annotate the annotation as @Repeatable


    +   2. Provide a container annotation


    For example, for a simple unit testing framework, we might define a repeatable
    @TestCase annotation, to be used like this:


    ```

    @TestCase(params="4", expected="24")n@TestCase(params="0", expected="1")npublic
    static long factorial(int n) { ... }

    ```


    Here is how the annotation can be defined:


    ```

    @Repeatable(TestCases.class)

    @Interface TestCases {

    String params();

    String expected();

    }

    ```


    When the user supplies two or more @TestCase annotations, they are automatically
    wrapped into a @TestCases annotation.


    When annotation processing code calls element.getAnnotation(TestCase.class) on
    the element representing the factorial method, null is returned. This is because
    the element is actually annotated with the container annotation TestCases.


    When implementing an annotation processor for your repeatable annotation, you
    will find it simpler to use the getAnnotationsByType method. The call element.getAnnotationsByType(TestCase.class)
    "looks through" any TestCases container and gives you an array of TestCase annotations.'
