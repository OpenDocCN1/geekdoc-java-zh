  md: '# 8.3 New Mathematical Functions


    The Integer and Long classes have methods compareunsigned, divideunsigned, and
    remainderunsigned to work with unsigned values. You don''t need special methods
    for addition, subtraction, and multiplication. The + and - operators already handle
    unsigned values. Integer multiplication would overflow with unsigned integers
    larger than Integer.MAX_VALUE, so you should call unsigned and multiply them as
    long values.


    > NOTE: In order to work with unsigned numbers, you need to have a clear understanding
    of base-two arithmetic and the binary representation of negative numbers. In C
    and C++, mixing signed and unsigned types is a common cause of subtle errors.
    Java has wisely decided to stay away from this area, and has managed to live with
    only signed numbers for many years. The primary reason to use unsigned numbers
    is if you work with file formats or network protocols that require them.


    The Float and Double classes have static methods isfinite. The call Double.isfinite
    returns true if x is not infinity, negative infinity, or a NaN (not a number).
    In the past, you had to call the instance isfinite and isn to get the same result.


    Finally, the BigInteger class has methods (long | int | short | byte)ValueExact
    that return the value as a long, int, short, or byte, throwing an ArithmeticException
    if the value is not within the target range.


    # 8.3 New Mathematical Functions


    The Math class provides methods for "exact" arithmetic that throw an exception
    when a result overflows. For example, 10000 * 10000 quietly gives the wrong result
    141065408, while multiplyExact(100000, 100000) throws an exception. The provided
    methods are (add | multiply | increment | negate)Exact, with int and long parameters.
    The toExact converts a long to the equivalent int.


    The floorMod and floorDiv methods allow to solve a long-standing problem with
    integer remainders. The expression in % 2. Everyone knows that this is 0 if n
    is even and 1 if n is odd. Except, of course, when n is negative. Then it is -1.
    Why? When the first computers were built, some had to make rules for integer division
    and remainder operands. Mathematicians had known the optimal (or "Euclidean")
    rule for a few hundred years: always leave the remainder ≥ 0. But rather than
    a math textbook, those pioneers came up with rules that seemed reasonable but
    actually inconvenient.'
