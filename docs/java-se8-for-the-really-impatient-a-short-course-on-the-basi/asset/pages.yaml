  md: '# 5.5 Zoned Time


    > NOTE: LocalTime doesn''t concern itself with AM/PM. That silliness is left to
    a formatter—see Section 5.6, "Formatting and Parsing," on page 112.


    There is a LocalDateTime class, representing a date and time. That class is suitable
    for storing points of time in a fixed time zone, for example, by a schedule of
    classes or events. However, if you need to make calculations that span the daylight
    savings time, or if you need to deal with users in different time zones, you should
    use the ZonedDateTime class that we discuss next.


    # 5.5 Zoned Time


    Time zones, perhaps because they are an entirely human creation, are even messier
    than the complications caused by the earth''s irregular rotation. In a rational
    world, we''d all follow the clock in Greenwich, and some of us would eat lunch
    at 02:00, others at 22:00. Our stomachs would figure it out. This is actually
    done in China, spans four time zones. Elsewhere, we have time zones with irregular
    and shifting boundaries, and to make matters worse, the daylight savings time.


    As capricious as the time zones may appear to the enlightened, they are a fact
    of life. When you implement a calendar application, it needs to work for people
    who fly from one country to another. When you have a conference call at 10:00
    in New York but happen to be in Berlin, you to be alerted at the correct local
    time.


    The Internet Assigned Numbers Authority (IANA) keeps a database of all known time
    zones around the world (https://www.iana.org/time-zones), which is updated several
    times per year. The bulk of the updates deals with the changing rules for daylight
    savings time. Java uses the IANA database.


    Each time zone has an ID, such as America/New_York or Europe/Berlin. To find out
    all time zones, call ZoneId.getAllIds(). In this of writing, there were almost
    600 IDs.


    Given a time zone ID, the static method ZoneId.of() yields a ZoneId object. You
    can use that to turn a LocalDateTime into a ZonedDateTime object by calling local.atZone(zoneId),
    or you can construct a ZonedonedDateTime by calling the static method ZonedonedDateTime.of(year,
    month, day, hour, minute, second, nano, zoneId). For example,


    ```

    ZonedDateTime apolloll1launch = ZonedDateTime.of("America/New_York", 1969, 7,
    16, 32, 0, 0, ZoneId.of("America/New_York"));

    // 1969-09-17T09:32:00[America/New_York]

    ```


    This is a specific instant in time. Call apolloll1launch.toInstant to get the
    Instant. Conversely, if you have an instant in time, call instant.atZone(ZoneId.of("UTC"))'
