  md: "# 8.6 Annotations\n\nAnnotations are tags inserted into the source code that\
    \ some tools can process. In Java SE, annotations are used for simple purposes,\
    \ such as marking deprecated features or suppressing warnings. Annotations have\
    \ a much more important role in Java EE where they are used to configure just\
    \ any aspect of an application, replacing painful boilerplate code and XML customization\
    \ that was the bane of older Java EE.\n\nJava 8 has two enhancements to annotation\
    \ processing: repeated annotations and type use annotations. Moreover, reflection\
    \ has been enhanced to report method parameter names. This has the potential to\
    \ simplify annotations on method parameters.\n\n# 8.6.1 Repeated Annotations\n\
    \nWhen annotations were first created, they were envisioned to mark methods and\
    \ fields for processing, for example:\n\n```\n@PostConstruct public void fetchData()\
    \ { ... } // Call after construction\n@Resource(\"jdbc:derby:sample\") private\
    \ Connection conn;\n// Inject resource here\n```\n\nIn this context, it made no\
    \ sense to apply the same annotation twice. You can't inject a field in two ways.\
    \ Of course, different annotations on the same element are fine and quite common:\n\
    \n```\n@Stateless @Path(\"/service\") public class Service { ... }\n```\n\nSoon,\
    \ more and more uses for annotations emerged, leading to situations where one\
    \ would have liked to repeat the same annotation. For example, to denote a composite\
    \ key in a database, you need to specify multiple columns:\n\n```\n@Entity\n@PrimaryKeyJoinColumn(name=\"\
    ID\")\n@PrimaryKeyJoinColumn(name=\"REGION\")\npublic class Item { ... }\n```\n\
    \nSince that wasn't possible, the annotations were packed into a container annotation,\
    \ like this:\n\n```\n@Entity\n@PrimaryKeyJoinColumns({\n  @PrimaryKeyJoinColumn(name=\"\
    ID\")\n  @PrimaryKeyJoinColumn(name=\"REGION\"\n})\npublic class Item { ... }\n\
    ```"
  merge: -1
