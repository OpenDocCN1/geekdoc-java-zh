    Runnable sleeper = () -> { System.out.println("Zzz"); Thread.sleep(1000); };

    // Error: Thread.sleep can throw a checked InterruptedException

    ```


    Since the Runnable.run cannot throw any exception, this assignment is illegal.

    To fix the error, you have two choices. You can catch the exception in the body
    of the

    lambda expression. Or assign the lambda to an interface whose single abstract

    method can throw the exception. For example, the call method of the Callable

    interface can throw any exception. Therefore, you can assign the lambda to a

    Callable<void> (if you add a statement return null).


    # 1.4 Method References


    Sometimes, there is already a method that carries exactly the action that you''d

    like to pass to some other code. For example, suppose you simply want to

    print the event whenever a button is clicked. Of course, you could call

    button.setOnAction(event -> System.out.println(event));


    It would be nicer if you could pass the println method to the setOnClick

    method. Here is how you do that:


    ```

    button.setOnAction(System.out::println);

    ```


    The expression System.out::println is a method reference that is equivalent to
    a

    lambda expression x -> System.out.println(x).


    As another example, suppose you want to sort strings regardless of letter case.

    You can pass this through method expression:


    ```

    Arrays.sort(strings, String::compareToIgnoreCase);

    ```


    As you can see from these examples, the :: separates the method name

    of the name of an object or class. There are three principal cases:


    +   - object::method

    - Class::staticMethod

    - Class::instanceMethod


    In the first two cases, the method reference is equivalent to a lambda expression

    s supplies the parameters of the method. As already mentioned,

    System.out::println is equivalent to x -> System.out.println(x). Similarly, Math::pow
    is

    eivalent to (x, y) -> Math.pow(x, y).


    In the third case, the first parameter becomes the target of the method for.

    ample, String::compareToIgnoreCase is the same as (x, y) -> x.compareToIgnoreCase(y).'
