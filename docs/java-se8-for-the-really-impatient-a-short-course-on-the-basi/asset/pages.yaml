  md: '# The Time Line 103


    two instants with the equals and compareTo methods in the usual way, so you can
    use instants as timestamps.


    To find out the difference between two instants, use the static method Duration.between.
    For example, here is how you can measure the running time of an algorithm:


    ```

    Instant start = Instant.now();

    runAlgorithm();

    Instant end = Instant.now();

    Duration timeElapsed = Duration.between(start, end);

    Long millis = timeElapsed.millis();

    ```


    A Duration is the amount of time between two instants. You can get the length
    of a Duration in conventional units by calling toNano, toSeconds, toMinutes, toHours,
    or toDays.


    Durations require more than a long value for their internal storage. The number
    of seconds is stored in a long, and the number of nanoseconds in an additional
    int. If you want to make computations in nanosecond accuracy, and you actually
    need the entire range of a Duration, then you can use one of the methods in Table
    5–1. Otherwise, you can just call toNano and do your calculations with long values.


    > NOTE: It takes almost 300 years of nanoseconds to overflow a long.


    # Table 5–1 Arithmetic Operations for Time Instants and Durations


    | Method | Description |

    | plus, minus | Adds a duration to, or subtracts a duration from, this Instant
    or Duration |

    | plusNanos, plusSeconds, plusMinutes, plusHours | Adds a number of the given
    time units to this Instant or Duration |

    | minusNanos, minusMillisis, minusMinutes, minusHours, minusDays | Subtracts a
    number of the given time units from this Instant or Duration |

    | multipliedBy, dividedBy, negated | Returns a duration that is obtained by multiplying
    or dividing this Duration by a given long, or by –1. Note that you can scale only
    durations, not instants |

    | isZero, isNegative | Checks whether this Duration is zero or negative |'
