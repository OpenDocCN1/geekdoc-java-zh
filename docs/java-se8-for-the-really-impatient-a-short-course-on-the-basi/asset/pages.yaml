  md: '# Chapter 8 Miscellaneous Goodies


    Consider this problem. You compute the position of the hour hand of a clock. An
    adjustment is applied, and you want to normalize to a number between 0 and 11.
    That is easy: (position + adjustment) % 12. But what if adjustment is negative?
    Then you might get a negative number. So you have to introduce a branch, or use
    ((position + adjustment) % 12) % 12. Either way, it is a hassle.


    The new floorMod method makes it easier: floorMod(position + adjustment, 12) yields
    a value between 0 and 11.


    > NOTE: Unfortunately, floorMod gives negative results for negative divisors,
    but that situation doesn''t often occur in practice.


    The nextDown method, defined for both double and float parameters, gives the next
    smaller floating-point number for a given number. For example, if you promise
    to produce a number < b, but you happen to have computed exactly b, then you can
    return Math.nextDown(b). (The corresponding Math.nextUp method exists since Java
    6.)


    > NOTE: All methods described in this section also exist in the StrictMath class.


    # 8.4 Collections


    The change for the collections library is, of course, support for streams you
    have seen in Chapter 2. There are some smaller changes as well.


    # 8.4.1 Methods Added to Collection Classes


    Table 8–1 shows miscellaneous methods added to collection classes and interfaces
    in Java 8, other than the stream, parallelStream, and splitter methods.


    You may wonder how the Stream interface has so many methods that accept lambda
    expressions but just one method, remove(), was added to the Collection interface.
    If you review the Stream methods, you will find that most of them return a single
    value or a stream of transformed values that are not present in the original stream.
    The exceptions are the filter and distinct methods. The remove method can be thought
    of as the opposite of filter, removing rather than producing all matches and carrying
    out the removal in place. The distinct method would be costly to provide on arbitrary
    collections.


    The List interface has a replaceAll method, which is an in-place equivalent of
    map, and a sort method that is obviously useful.'
