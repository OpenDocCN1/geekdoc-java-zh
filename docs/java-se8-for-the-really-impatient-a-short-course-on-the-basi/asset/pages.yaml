    loader.setController(...);

    Parent root = (Parent) loader.load(getClass().getResource(...));

    // Error-static method

    ```


    When the FXML file is loaded, the scene graph is constructed, and references to
    the named controller objects are injected into the annotated fields of the controller
    object. Then its initialize method is called.


