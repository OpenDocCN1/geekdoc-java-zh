  md: '# Chapter 2


    Streams are the key abstraction in Java 8 for processing collections of values
    and specifying what you want to have done, leaving the scheduling of operations
    to the implementation. For example, if you want to compute the average of the
    values of a certain method, you specify that you want to call the method on each
    element and get the average of the values. You leave it to the stream library
    to parallelize the operation, using multiple threads for computing sums and counts
    of each segment and combining the results.


    The key points of this chapter:


    +   - Iterators imply a specific traversal strategy and prohibit efficient concurrent
    execution.


    +   - You can create streams from collections, arrays, generators, or iterators.


    +   - Use filter to select elements and map to transform elements.


    +   - Other operations for transforming streams include limit, distinct, and sorted.


    +   - To obtain a result from a stream, use a reduction operator such as count,
    max, min, findFirst, or findAny. Some of these methods return an Optional value.


    +   - The Optional type is intended as a safe alternative to working with null
    values. To use it safely, take advantage of the ifPresent or orElse methods.'
