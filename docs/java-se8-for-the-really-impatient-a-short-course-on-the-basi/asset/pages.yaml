    # 8.7 Miscellaneous Minor Changes


    We end this chapter with miscellaneous minor changes that you might find useful.
    This section covers the new features of the Objects, Logger, and Locale classes,
    as well as changes to regular expressions and JDBC.


    # 8.7.1 Null Checks


    The Objects class has static predicate methods isNull and nonNull that can be
    useful for streams. For example,


    ```

    stream.anyMatch(Object::isNull)

    ```


    checks whether a stream contains a null, and stream.filter(Object::nonNull) gets
    rid of all of them.


    # 8.7.2 Lazy Messages


    The log, logp, severe, warning, info, config, fine, finer, and finest methods
    of the java.util.Logger class now support lazily constructed messages. For example,
    consider the call


    ```

    logger.finest("x": " + x + ", y: " + y);

    ```


    The message string is formatted even when the logging level is such that it would
    never be used. Instead, use


    ```

    logger.finest(() -> "x": " + x + ", y: " + y);

    ```


    Now the lambda expression is only evaluated at the FINEST logging level, when
    the cost of the additional lambda invocation is presumably the least of one''s
    problems.'
