  md: '# 9.2 Working with Files


    Catching multiple exceptions doesn''t just make your code look simpler but is
    also more efficient. The generated bytecodes contain a single block for the shared
    catch clause.


    > NOTE: When you catch multiple exceptions, the exception variable is implicitly
    final. For example, you cannot assign a new value to ex in the body of the catch
    clause (FileNotFoundException | UnknownHostException ex) { ... };


    # 9.1.4 Easier Exception Handling for Reflective Methods


    In the past, when you called a reflective method, you had to catch multiple unrelated
    checked exceptions. For example, suppose you construct a class and invoke your
    main method:


    ```

    Class.forName(className).getMethod("main").invoke(null, new String[]{});

    ```


    This statement can cause FileNotFoundException, NoSuchMethodException, IllegalAccessException,
    or InvocationTargetException.


    Of course, you can use the feature described in the preceding section and combine
    them in a single clause:


    ```

    catch (FileNotFoundException | NoSuchMethodException | IllegalAccessException
    | InvocationTargetException ex) { ... }

    ```


    However, that is still very tedious. Plainly, it is bad design not to provide
    a common superclass for related exceptions. That design flaw has been remedied
    in Java 7. A new superclass ReflectionException has been introduced so that you
    can catch all of these exceptions in a single handler:


    ```

    catch (ReflectionException ex) { ... }

    ```


    # 9.2 Working with Files


    The try-with-resources statement is my favorite feature in Java 7, but the file
    handling operations used to be tedious, such as reading a file into a string,
    or copying a file to another, are now as easy as they should have been all along.
    These are part of the "NIO2" effort, which refreshes the NIO (''new IO'') library
    introduced in 2002 with Java 1.4. (It is never a good idea to include "new" in
    a product name—what is new today invariably become old, and the name will look
    silly:)


    Before you can learn how to carry out these file operations, you have to learn
    about the Path interface that replaces the File class. Next, you will see how
    to read and write files. Finally, we will turn to file and directory operations.'
