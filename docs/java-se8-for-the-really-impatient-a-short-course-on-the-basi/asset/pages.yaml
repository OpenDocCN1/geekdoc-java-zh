  md: '# Table 6–2 Combining Multiple Composition Objects


    | Method | Parameters | Description |

    |---|---|--|

    | thenCombine | CompletableFuture<U>, (T, U) -> V | Execute both and combine the
    results with the given function. |

    | thenAcceptBoth | CompletableFuture<U>, (T, U) -> void | Like thenCombine, but
