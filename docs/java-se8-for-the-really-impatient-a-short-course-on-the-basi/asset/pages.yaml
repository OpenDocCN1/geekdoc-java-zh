  md: '# 9.4 Security Requirements


    exploiting Java implementation bugs. In this regard, the early researchers who
    warned of a large attack surface in the Java security model were entirely justified.
    It took Oracle until 2013 to credibly respond to attacks. Management of client
    VMs is still a work in progress.


    As of today, Oracle signals that it is no longer focused on securing users'' Java
    applets and Web Start (collectively called rich internet applications, or RIAs).
    Oracle continues to close Java vulnerabilities, and develops tools that are suitable
    for corporate deployment, so that legacy RIAs can be deployed safely. From a commercial
    standpoint, this makes sense. Home users are expected to migrate away from PCs
    to tablets and smartphones. These devices don''t support a Java VM in the browser.
    And business users are a plausible target for maintaining legacy applications.


    With successive Java 7 releases, Oracle has tightened the security rules. As of
    January 2014, RIAs running outside the sandbox must be signed by a commercial
    certificate authority. Another requirement is designed to thwart ”repurposing
    attacks.\ Currently, it is possible to grab a legitimately signed JAR file from
    a hacker site, exploiting some vulnerability in third-party app. As of January
    2014, all JARs must have a manifest entry


    Permissions: sandbox


    or


    Permissions: all-permissions


    Since the manifest entry is inside the JAR file, it is signed and cannot be modified
    afterwards. The Java client will not permit sandbox execution of an all-permission
    client, which prevents ”drive-by” attacks where an applet runs without any user
    consent. Of course, it is still possible to attack users who are habituated to
    agree to any security dialogs. To make that harder, another, as yet optional,
    manifest entry has been added:


    ```

    Codebase: https://www.mycompany.com/www.mycompany.com:8080

    only allows the application to be loaded from one of the given URLs.

    ```


    > NOTE: It has always been possible to call applets from JavaScript—another dubious
    decision from the point of view of the security minded. If you are using that
    feature in your application, you can minimize the repurposing risk by adding an
    entry Caller-Allowable-Codebase: https://www.mycompany.com to the manifest before
    signing signing.


    Overall, the developments are very sad. Java had held great promise as a universal
    execution platform for remote code. If Java had offered a more compelling sandbox,
    if nonsandbox code been more aggressively controlled, if there had'
