  md: 'If have just seen one form of lambda expressions in Java: parameters, the ->
    arrow, and an expression. If the code carries out a computation that doesn''t
    fit in a single expression, write it exactly like you would have written a method:
    enclosed in {} and with explicit return statements. For example,


    ```

    (String first, String second) -> {

    if (first.length() < second.length()) return -1;

    else if (first.length() > second.length()) return 1;

    else return 0;

    }

    ```


    If a lambda expression has no parameters, you still supply empty parentheses,
    just as with a parameterless method:


    ```

    () -> {for (int i = 0; i < 1000; i++) work();};

    ```


    If the parameter type of a lambda expression can be inferred, you can omit them.
    For example,


    ```

    Comparator<String> comp

    = (first, second) // Same as (String first, String second)

    -> Integer.compare(first.length(), second.length());

    ```


    Here, the compiler can deduce that first and second must be strings because the
    lambda expression is assigned to a string comparator. (We will have a closer look
    at this assignment in the next section.)


    If a method has a single parameter with inferred type, you can even omit the parentheses:


    ```

    EventHandler<ActionEvent> listener = event ->

    System.out.println("Thanks for clicking!");

    // Instead of (event) -> or (ActionEvent event) ->

    ```


    > NOTE: You can add annotations or the final modifier to lambda parameters in
    the same way as for method parameters:


    ```

    (final String name) -> ...

    (@NonNull String name) -> ...

    ```


    You never specify the result type of a lambda expression. It is always inferred
    from context. For example, the expression


    ```

    (String first, String second) -> Integer.compare(first.length(), second.length())

    ```


    can be used in a context where a result of type int is expected.'
