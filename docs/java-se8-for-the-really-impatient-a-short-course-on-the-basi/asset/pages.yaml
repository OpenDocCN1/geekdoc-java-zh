  md: '# Chapter 5 The New Date and Time API


    get the ZonedDateTime at the Greenwich Royal Observatory, or use another ZonedId
    to get it elsewhere on the planet.


    > NOTE: UTC stands for "coordinated universal time," and the acronym is a compromise
    between the aforementioned English and the French "temps universel coordiné,"
    having the distinction of being incorrect in either language. UTC is time at the
    Greenwich Royal Observatory, without daylight savings time.


    Many of the methods of ZonedDateTime are the same as those of LocalDateTime (see
    Table 5–5). Most are straightforward, but daylight savings time introduces some
    complications.


    When daylight savings time starts, clocks advance by an hour. What happens when
    you construct a time that falls into the skipped hour? For example, in 2013, Central
    Europe switched to daylight savings time on March 31 at 2:00. If you try to construct
    nonexistent time March 31 2:30, you actually get 3:30.


    ```

    ZonedDateTime skipped = ZonedDateTime.of(

    LocalDate.of(2013, 3, 31),

    LocalTime.of(2, 30),

    ZoneId.of("Europe/Berlin");

    // Constructs March 31 3:30

    ```


    Conversely, when daylight time ends, clocks are set back by an hour, and there
    are two instances with the same local time! When you construct a time within that
    span, you the earlier of the two.


    ```

    ZonedDateTime ambiguous = ZonedDateTime.of(

    LocalDate.of(2013, 10, 27), // End of daylight savings time

    LocalTime.of(2, 30),

    ZoneId.of("Europe/Berlin");

    // 2013-10-27T02:30:00 [Europe/Berlin]

    ZonedDateTime hourLater = ambiguous.plusHours(1);

    // 2013-10-27T03:01:00 [Europe/Berlin]

    ```


    An hour later, the time has the same hours and minutes, but the offset has changed.


    You also need to pay attention when adjusting a date across daylight savings time
    boundaries. For example, if you set a meeting for next week, not add a duration
    of seven days:


    ```

    ZonedDateTime nextMeeting = meeting.plus(Duration.Days(7));

    // Caution! Won''t work with daylight savings time

    ```'
