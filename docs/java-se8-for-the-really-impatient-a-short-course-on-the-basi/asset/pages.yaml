    # 5.1 The Time Line


    Historically, the fundamental time unit, the second, was derived from Earth''s
    rotation around its axis. There are 24 hours or 24 x 60 x 60 = 86400 seconds in
    a full revolution, so it seems just a question of astronomical measurements to
    precisely define a second. Unfortunately, Earth wobbles slightly, and a more precise
    definition was needed. In 1967, a new precise definition of the second, matching
    the historical definition, was derived from an intrinsic property of atoms of
    caesium-133. Since then, a network of atomic clocks keeps the official time.


    Ever so often, the official time keepers synchronize the absolute time with the
    rotation of Earth. At first, the official seconds were slightly adjusted, but
    starting in 1972, "leap seconds" were occasionally inserted. (In theory, a second
    might need to be removed once in a while, but that has not yet happened.) There
    is talk of changing the system again. Clearly, leap seconds are a pain, and many
    computer systems use instead "smoothing" where time is artificially slowed down
    or sped up just before the leap second, keeping 86400 seconds per day. This works
    because the local time on a computer isn''t all precise, and computers are used
    to synchronize themselves with an external time service.


    The Date and Time API specification requires that Java uses a time scale that


    +   - Has 86,400 seconds per day

    - Exactly matches the official time at noon each day

    - Closely matches it elsewhere, in a precisely defined way


    That gives Java the flexibility to adjust to future changes in the official time.

    In Java, an Instant represents a point on the time line. An origin, called arbitrarily
    set at midnight of January 1, 1970 at the prime meridian that passes through the
    Greenwich Royal Observatory in London. This is the same convention used in Unix/POSIX
    time. Starting from that origin, time is measured in 86,400 seconds per day, forwards
    and backwards, in nanosecond precision. The Instant values go back as far as a
    billion years (Instant.MIN). That is not enough to express the age of the universe
    (around 13.5 billion years), but it should be enough for all practical purposes.
    After all, a billion years ago, the earth was covered in ice and populated by
    microscopic ancestors of today''s planets and animals. The largest value, Instant.MAX,
    is December 31 of the year 1,000,000,000. The static method call Instant.now()
    gives the current instant. You can compare'
