    # 3.9 Lambdas and Generics


    Generally, lambdas work well with generic types. You have seen a number of examples
    where we wrote generic mechanisms, as the unchecked method of the preceding section.
    There are just a couple of issues to keep in mind.


    One of the unhappy consequences of type erasure is that you cannot construct a
    generic array at runtime. For example, the toArray() method of Collection<T> and
    Stream<T> cannot call T[] result = new T[n]. Therefore, these methods return Object[]
    arrays. A solution is to provide a second method that accepts an array that is
    either filled or passed to create a new one via reflection. For example, Collection<T>
    has a method toArray(T[]). With lambdas, you have a new option, to pass the constructor.
    That is how you do with streams:


    ```

    String[] result = words.toArray(String[]::new);

    ```


    When you implement such a method, the constructor expression is an Function<T>,
    since the size of the array is passed to the constructor. In your code, you call
    T[] result = constr.apply(n).


    In this regard, lambdas help you overcome a limitation of generic types. Unfortunately,
    in another situation lambdas suffer from a different limitation. To understand
    the problem, recall the concept of type variance.


