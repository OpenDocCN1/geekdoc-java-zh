  md: 'It is this kind of annotation that was not possible before Java 8 but has now
    become legal.


    > NOTE: These annotations are not part of standard Java. There are currently no
    standard annotations that are meaningful for type use. All examples in this section
    come from the Checker Framework or from the author''s imagination.


    Type use annotations can appear in the following places:


    +   - With generic type arguments: List<NonNull String>, Comparator.<NonNull String>
    reverseOrder().

    - In any position of an array: @NonNull String[] [] words (words[i][j] is not
    null), String @NonNull [][] words (words is not null), String @NonNull [] words
    (words[i] is not null).

    - With superclasses and implemented interfaces: Class Image implements @Rectangular
    Shape.

    - With constructor invocations: new @Path String("/usr/bin").

    - With casts and instanceof check: (@Path String) input, if (instanceof @Path
    String). (The annotations are only use for external tools. They have no effect
    on the behavior of a cast or an instanceof check).

    - With exception specifications: public Person read() throws @Localized IOException.

    - With wildcards and type bounds: List<@ReadOnly extends Person>, List<? extends
    @ReadOnly> Person.

    - With method and constructor references: @Immutable::getName.


    There are a few types that cannot be annotated:

    @NonNull String.class // Illegal—cannot annotate class literal

    import java.lang.@NonNull String; // Illegal—cannot annotate import


    It is also possible to annotate an annotation. For example, given @NonNull String
    name, you cannot annotate @NonNull. (You can supply a separate annotation, but
    it would apply to the name declaration.)


    The practical use of these annotations hinges on the viability of the tools. If
    you are interested in exploring the potential of extended type checking, a good
    place to start is the Checker Framework tutorial at http://types.cs.washington.edu/checker-framework/tutorial.


    # 8.6.3 Method Parameter Reflection


    The names of parameters are now available through reflection. That is promising
    because it can reduce annotation boilerplate. Consider a typical JAX-RS method'
