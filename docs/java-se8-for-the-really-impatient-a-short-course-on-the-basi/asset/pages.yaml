    # 7.13 Nashorn and JavaFX


    Nashorn provides a convenient way of launching JavaFX applications. Simply provide
    the instructions that you would normally put into the start method of the Application
    subclass. Use $STAGE for the Stage parameter. You don''t even have to call show
    on the Stage object—that is done for. For example, here is the "Hello" program
    from Chapter 4 in JavaScript:


    ```

    var message = new javafx.scene.control.Label(''Hello, JavaFX!'');

    message.font = new javafx.scene.text.Font(100);

    $STAGE.scene = new javafx.scene.Scene(message);

    $STAGE.title = "Hello";

    ```


    Run the script with the -fx option, like this:

    jjs -fx myJavaFXApp.js


    That is all there is to it. A label with a message “Hello, JavaFX!” is displayed
    in a 100-point font in a window title “Hello”—see Figure 7–1.

    All the boilerplate is gone, and you have the convenient property notation, that
    is,

    message.font = new Font(100)

    instead of

    message.setFont(new Font(100))


    ![](img/ddf393433cea9fb15be8c839ccf979c4_169_0.png)


    Figure 7–1 The Hello JavaFX application in JavaScript'
