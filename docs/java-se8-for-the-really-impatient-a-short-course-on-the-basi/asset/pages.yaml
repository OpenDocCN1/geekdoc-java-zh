    \ any more. Instead, you provide a lambda expression for updating the variable,\
    \ and the update is done for you. In our example, we can call\n\n```\nlargest.updateAndGet(x\
    \ -> Math.max(x, observed));\n```\n\nor\n\n```\nlargest.accumulateAndGet(observed,\
    \ Math::max);\n```\n\nThe accumulateAndGet method takes a binary operator that\
    \ is used to combine the atomic value and the supplied argument.\n\nThere are\
    \ also methods getAndUpdate and getAndAccumulate that return the old value.\n\n\
    > NOTE: These methods are also provided for the classes AtomicInteger, AtomicIntegerArray,\
    \ AtomicIntegerFieldUpdater, AtomicLongArray, AtomicLongFieldUpdater, AtomicReference,\
    \ AtomicReferenceArray, and AtomicReferenceUpdater.\n\nWhen you have a very large\
    \ number of threads accessing the same atomic values, performance suffers because\
    \ the optimistic updates require too many retries. Java 8 provides classes LongAdder\
    \ and LongAccumulator to solve this problem. A LongAdder is composed of multiple\
    \ variables whose collective sum is the current value. Multiple threads can update\
    \ different summands, and new summands are automatically provided when the number\
    \ of threads increases. This is efficient in the common situation where the value\
    \ of the sum is not needed until after all work has been done. The performance\
    \ improvement is substantial—Exercise 3.\n\nIf you anticipate high contention,\
    \ you should simply use a LongAdder instead of an AtomicLong. The method names\
    \ are slightly different. Call increment to increment a counter or add to a quantity,\
    \ and sum to retrieve the total.\n\n```\nfinal LongAdder adder = new LongAdder();nfor\
    \ (...) {\n  pool.submit(() -> {\n    while (...) {\n      ...\n      if (...)\
    \ adder.increment();\n    }\n  });\n```\n\n```\nlong total = adder.sum();\n```"
