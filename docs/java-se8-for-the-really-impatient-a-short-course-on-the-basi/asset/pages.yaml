  md: '# # Chapter 1


    Java was designed in the 1990s as an object-oriented programming language, when
    object-oriented programming was the principal paradigm for software development.
    Long before there was object-oriented programming, there were functional programming
    languages such as Lisp and Scheme, but their benefits were not much appreciated
    outside academic circles. Recently, functional programming has risen in importance
    because it is well suited for concurrent and event-driven (or “reactive”) programming.
    That doesn’t mean that objects are bad. Instead, the winning strategy is to blend
    object-oriented and functional programming. This makes sense even if if you are
    not interested in concurrency. For example, collection libraries can be given
    powerful APIs if the language has a convenient syntax for function expressions.


    The principal enhancement in Java 8 is the addition of functional programming
    constructs to its object-oriented roots. In this chapter, the next chapter shows
    you how to put that syntax to use with Java collections, and in Chapter 3 you
    will learn how to build your own functional libraries.


    The key points of this chapter are:


    +   - A lambda expression is a block of code with parameters.


    +   - Use a lambda expression whenever you want a block of code executed at a
    later point in time.


    +   - Lambda expressions can be converted to functional interfaces.'
