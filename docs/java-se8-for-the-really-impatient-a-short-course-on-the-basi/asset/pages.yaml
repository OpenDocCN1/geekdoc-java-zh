  md: '> NOTE: Of course, the increment method does not return the old value.

    Doing that would undo the efficiency gain of splitting the sum into multiple summands.


    The LongAccumulator generalizes this idea to an arbitrary accumulation operation.

    in the constructor, you provide the operation, as well as its neutral element.

    to incorporate new values, call accumulate. Call get to obtain the current value.

    The following has the same effect as a LongAdder:


    ```

    LongAccumulator adder = new LongAccumulator(Long::sum, 0);

    // In some thread...

    adder.accumulate(value);

    ```


    Internally, the accumulator has variables a1, a2, ..., an. Each variable is initialized

    with the neutral element (0 in our example).


    When accumulate is called with value v, then one of them is atomically updated
    as

    ai = ai op v, where op is the accumulation operation written in infix form. In
    our

    example, call to accumulate computes ai = ai + v for some i.


    The result of get is a1 op a2 op ... op an. In our example, that is the sum of
    the

    accumulators, a1 + a2 + ... + an.


    If you choose a different operation, you can compute maximum or minimum

    (see Exercise 4). In general, the operation must be associative and commutative.

    That means the final result must be independent of the order in which the

    intermediate values were combined.


    There are also DoubleAdder and DoubleAccumulator that work in the same way, except

    with double values.


    > NOTE: Another addition to Java 8 is the StampedLock class that can be used

    to implement optimistic reads. I don''t recommend that application program-\mers
    use locks, but here is how it is done. You call tryOptimisticRead, upon

    which you get a "stamp." Read your values and check whether the stamp

    is still valid (i.e., no other thread has obtained a write lock). If so, you can
    use

    the values. If not, get a read lock (which blocks any writers). Here is an

    example.'
