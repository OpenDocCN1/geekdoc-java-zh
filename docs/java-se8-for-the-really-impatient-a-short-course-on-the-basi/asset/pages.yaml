    > CAUTION: In JavaFX, dimensions are specified in pixels. In our example, we use
    ten pixels for the box spacing and padding. This is not really appropriate nowadays,
    when pixel densities can vary widely. One way to overcome this is to compute dimensions
    in rem, as you do in CSS3. (A rem or "root em" is the height of the default font
    of the document).


    ```

