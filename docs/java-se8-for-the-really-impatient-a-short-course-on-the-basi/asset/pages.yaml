    as Swing had the GridImageLayout as “mother of all layout managers,” JavaFX has
    the GridPane. Think of a GridPane as an equivalent of an HTML table. You can set
    the horizontal and vertical alignment of all cells. If desired, cells can span
    multiple rows and columns. Consider the login dialog in Figure 4–9.


