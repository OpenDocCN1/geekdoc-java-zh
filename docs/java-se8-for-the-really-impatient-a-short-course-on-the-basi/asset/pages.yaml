  md: '# # Chapter 5


    Time flies like an arrow, and we can easily set a starting point and count forward
    and backwards in seconds. So why is it so hard to deal with time? The problem
    is humans. All would be easy if we could just tell each other: “Meet me at 1371409200,
    and don’t be late!” But we want time to relate to daylight and the seasons. That''s
    where things get complicated. Java 1.0 had a Date class that was, and most of
    its methods deprecated in Java 1.1 when a Calendar class was introduced. Its API
    wasn’t stellar, its instances were mutable, and it didn’t deal with issues such
    as leap seconds. The third time is a charm, and the java.time API introduced in
    Java 8 remedied the flaws of the past and should serve us for quite time. In this
    chapter, you will learn what makes time computations so vexing, and how the new
    Date and Time API solves these issues.


    +   The key points of this chapter are:

    - All java.time objects are immutable.

    - An Instant is a point on the time line (similar to a Date).

    - In Java time, each day has exactly 86,400 seconds (i.e., no leap seconds).

    - A Duration is the difference between two instants.

    - LocalDateTime has no time zone information.

    - TemporalAdjuster methods handle common calendar computations, such as finding
    the first Tuesday of a month.'
