    Why not write these scripts in Java? Java is verbose. If you call external commands
    via runtime.exec, you need to manage standard input/output/error streams. The
    Nashorn designers want you to consider JavaScript as an alternative. The syntax
    is comparatively lightweight, and Nashorn offers some conveniences that are specifically
    geared towards shell programmers.


    # 7.12.1 Executing Shell Commands


    To use the scripting extensions in Nashorn, run


    ```

    jjs -scripting

    ```


    or


    ```

    jrscript

    ```


    Now you can execute shell commands by including them in backquotes,

    example


    ```

    `ls -al`

    ```


    The standard output and standard error streams of the last command are cap-

    tured in $OUT and $ERR. The exit code of the command is in $EXIT.(By convention,

    an exit code of zero means success, and non-zero codes describe error conditions.)


    You can also capture the standard output by assigning the result of the

    backquoted command to a variable:


    ```

    var output = `ls -al`

    ```


    If you want to supply standard input for a command, use


    ```

    $EXEC(command, input)

    ```


    For example, this command passes the output of `ls -al to grep -v class:


    ```

    $EXEC(''grep -v class'', ''ls -al'')

    ```


    It''s not quite as pretty as a pipe, but you can easily implement a pipe if you

    need it—see Exercise 6.'
