  md: "# 2.6 Simple Reductions\n\nNow that you have seen how to create and transform\
    \ streams, we will finally get to the most important point—getting answers from\
    \ the stream data. The methods that we cover in this section are called reductions.\
    \ They reduce the stream to a value that can be used in your program. Reductions\
    \ are terminal operations. After a terminal operation has been applied, the stream\
    \ ceases to be usable.\n\nYou have already seen a simple reduction: the count\
    \ method that returns the number of elements of the stream.\n\nOther reductions\
    \ are max and min that return the largest or smallest value. There is a twist—these\
    \ methods return an Optional<T> value that wraps the answer or indicates that\
    \ there is none (because the stream happened to be empty). In the old days, it\
    \ was common to return null in such a situation. But that can lead to null pointer\
    \ exceptions when an unusual situation arises in an incomplete processed stream.\
    \ In Java 8, the Optional type is the preferred way of indicating a missing value.\
    \ We discuss the Optional in detail in the next section. Here is how you can get\
    \ the maximum of a stream:\n\n```\nOptional<String> largest = words.max(String::compareToIgnoreCase);\n\
    if (largest.isPresent()) {\n    System.out.println(\"largest: \" + largest.get());\n\
    }\n```\n\nThe find returns the first value in a nonempty collection. It is often\
    \ useful when combined with filter. For example, we find the first word that starts\
    \ with the letter Q, if it exists:\n\n```\nOptional<String> startsWithQ\n= words.parallel().filter(s\
    \ -> s.startsWith(\"Q\")).findFirst();\n```\n\nIf you are okay with any match,\
    \ not just the first one, then use the findAny method. This is effective when\
    \ you parallelize the stream since the first match in any of the examined streams\
    \ will complete the computation.\n\n```\nOptional<String> startsWithQ\n= words.parallel().filter(s\
    \ -> s.startsWith(\"Q\")).findAny();\n```\n\nIf you just want to know there is\
    \ a match, use anyMatch. That method takes a predicate argument, so you won't\
    \ need to use filter.\n\n```\nboolean aMatchStartsWithQ\n= words.parallel().anyMatch(s\
    \ -> s.startsWith(\"Q\"));\n```\n\nThere are also methods allMatch and noneMatch\
    \ that return true if all or no elements match a predicate. These methods always\
    \ examine the entire stream, but they still benefit from being run in parallel."
