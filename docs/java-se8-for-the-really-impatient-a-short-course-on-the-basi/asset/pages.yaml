  md: '# 6.4 Completable Futures


    Table 6–1 Adding an Action to a CompletableFuture<T> Object


    | Method | Parameter | Description |

    | --- | --- | --- |

    | thenApply | T -> U | Apply a function to the result. |

    | thenCompose | T -> CompletableFuture<U> | Invoke the function on the result
    and execute the returned future. |

    | handle | (T, Throwableable) -> U | Process the result or error. |

    | thenAccept | T -> void | Like thenApply, but with void result. |

    | whenComplete | (T, Throwableable) -> void | Like handle, but with void result.
    |

    | thenRun | Runnable | Execute the result with void result. |


    it is more elegant to have method return future:


    ```

    public CompletableFuture<String> readPage(URL url)

    ```


    Now, suppose we have another method that gets the URL from user input, perhapshaps
    from a dialog that won''t reveal the answer until the user has clicked the OK
    button. That, too, is in the future:


    ```

    public CompletableFuture<URL> getURL(String prompt)

    ```


    Here we have two functions T -> CompletableFuture<U> and U -> CompletableFuture<V>.
    Clearly, we compose to a function T -> CompletableFuture<V> by calling the second
    function when the first one has completed. That is exactly what compose does.

    The third method in Table 6–1 focuses on a different aspect that I have ignored
    so far: failure. When an exception is thrown in a CompletableFuture, it is captured
    and wrapped in an unchecked ExecutionException when the method is called. But
    perhaps it is never called. In order to handle an exception, use the handle method.
    The supplied function is called with the result (or null if none) and gets to
    make sense of the situation.

    The remaining methods have void result and are usually used at the end of a processing
    pipeline.

    Now let us use methods to combine multiple futures (see Table 6–2).

    The first three methods run a CompletableFuture<T> and a CompletableFuture<U>
    action in parallel and combine the results.

    The next three methods run two CompletableFuture<T> actions in parallel. As soon
    as one of them finishes, its result is passed, and the other result is ignored.

    Finally, the static allOf and anyOf methods take a variable number of completable
    futures and yield a CompletableFuture<Void> that completes when all of them, or
    any one of them, completes. No results are propagated.'
