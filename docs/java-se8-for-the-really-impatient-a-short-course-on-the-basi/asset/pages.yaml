  md: '# 4.9 Animations and Special Effects


    ```

    RotateTransition rt = new RotateTransition(Duration.millis(3000));

    rt.setByAngle(180);

    rt.setCycleCount(Animation.INDEFINITE);

    rt.setAutoReverse(true);

    rt.setNode(maybeButton);

    rt.play();

    ```


    You can compose transitions with the ParallelTransition and SequentialTransition
    combinators, performing them in parallel or one after the other. If you need to
    animate multiple nodes, you can place them into a Group node and animate that.
    When you need to create this kind of behavior, the Java classes are a joy to work
    with.


    Special effects are also very easy to do. If you need a drop shadow for a spiffy
    caption, make a DropShadow effect and set it as the effect property of a node.

    Figure 4–13 shows the result with a Text node. Here is the code:


    ```

    DropShadow boxShadow = new DropShadow();

    dropShadow.setRadius(5.0);

    dropShadow.setOffsetX(3.0);

    dropShadow.setOffsetY(3.0);

    dropShadow.setColor(Color.GRAY);

    ```


    ```

    Text text = new Text();

