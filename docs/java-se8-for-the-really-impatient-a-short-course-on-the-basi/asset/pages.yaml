    \ Handling Changes\n\nI start this chapter with the Java 7 features for exception\
    \ handling, since they have a major impact on writing reliable programs. I briefly\
    \ review the try-with-resources statement before moving on to more subtle changes.\n\
    \n# 9.1.1 The try-with-resources Statement\n\nJava 7 provides a useful shortcut\
    \ to the code pattern\n\n```\nopen a resource\ntry {\n    work with the resource\n\
    nfinally {\n    close the resource\n}\n```\n\nprovided the resource belongs to\
    \ a class that implements the AutoCloseable interface. That interface has a single\
    \ method\n\nvoid close() throws Exception\n\n> NOTE: There is also a Closeable\
    \ interface. It is a subinterface of AutoCloseable, also with a single close method,\
    \ but that method is declared to throw an IOException.\n\nIn its simplest variant,\
    \ the try-with-resources statement has the form\n\n```\ntry (Resource res = ...)\
    \ {\n    work with res\n}\n```"
