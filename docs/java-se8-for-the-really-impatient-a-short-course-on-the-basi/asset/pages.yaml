    \ with the same hash code in the same 'bucket.' Some applications use poor hash\
    \ functions, and as a result all entries end up in a small number of buckets,\
    \ severely degrading performance. Even generally reasonable hash functions, such\
    \ as that of the String class, can be problematic. For example, an attacker can\
    \ slow down a program by crafting a large number of strings that hash to the same\
    \ value. As of Java 8, the concurrent manages the buckets as trees, not lists,\
