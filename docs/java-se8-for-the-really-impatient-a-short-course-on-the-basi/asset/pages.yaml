    # 9.5.5 URLClassLoader


    Suppose you want to write a Java program that automates execution of JUnit tests.
    To load the JUnit core class, you need a class loader that reads the JUnit JAR
    files:


    ```

    URL[] urls = {

    new URL("file:junit-4.11.jar"),

    new URL("file:hamcrest-core-1.3.jar")

    };

    URLClassLoader loader = new URLClassLoader(urls);

    Class<?> class = loader.loadClass("org.junit.runner.JUnitCore");

    ```


    Before Java 7, code as this could lead to resource leaks. Java 7 simply adds a
    close method to close the classloader. URLClassLoader implements AutoCloseable,
    so you can use a try-with-resources statement:


    ```

    try (URLClassLoader loader = new URLClassLoader(urls)) {

    Class<?> class = loader.loadClass("org.junit.runner.JUnitCore");

    }

    ```


    > CAUTION: Don''t use any classes after the classloader has been closed. If you
    do, and those classes need to load other classes to do their work, they will fail.


    # 9.5.6 BitSet


    A BitSet is a set of integers that is implemented as a sequence of bits. The ith
    bit is set if the set contains the integer i. That makes for very efficient set
    operations. Union/intersection/complement are simple bitwise or/and/not.


    Java 7 adds methods to construct bitsets.


    ```

    byte[] bytes = {(byte)0b00101100, (byte)0b00010000};

    BitSet bitSet = BitSet.valueOf(bytes);

    // {2, 3, 5, 7, 11, 13}

    long[] longs = {0x10001016L, 0x1L, 0x1L, 0x1L};

    BitSet powersOfTwo = BitSet.valueOf(longs);

    // {1, 2, 4, 8, 16, 32, 64, 128, 256}

    ```'
