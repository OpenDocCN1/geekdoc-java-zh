  md: '# 9.2 Working with Files


    yields ..fred/myprog, assuming we have a file system that uses .. to denote the
    parent directory.


    The normalize method removes any redundant . and .. components (or whatever the
    file system may deem redundant). For example, normalizing the path /home/cay/../fred/myprog
    yields /home/myprog.


    The toAbsolutePath method yields the absolute path of a given path. If the path
    is not already absolute, it is resolved against the "user directory”—that is,
    the directory from which the JVM was invoked. For example, if you launched a program
    from /home/cay/myprog, then Paths.get("config").toAbsolutePath() returns /home/cay/myprog.


    The Path interface has many useful methods for taking paths and combining them
    with other paths. This code sample shows some of the most useful ones:


    ```

    Path p = Paths.get("/home", "cay", "myprog.properties");

    Path parent = p.getParent(); // The path /home/cay

    Path file = p.getFileName(); // The last element, myprog.properties

    Path root = p.getRoot(); // The initial segment (null for a relative path)

    ```


    > NOTE: Occasionally, you may need to interoperate with legacy APIs that use the
    File class instead of the Path interface. The Path interface has a toToFile method,
    and the File class has a toPath method.


    # 9.2 Reading and Writing Files


    The Files class makes quick work of common file operations. For example, you can
    easily read the entire contents of a file:


    ```

    byte[] bytes = Files.readAllBytes(path);

    ```


    If you want to read the file as a string, call readAllBytes followed by


    ```

    String content = new String(bytes, StandardCharsets.UTF_8);

    ```


    But if you want the file as a sequence of lines, call


    ```

    List<String> lines = Files.readAllLines(path);

    ```


    Conversely, if you want to write a string, call


    ```

    Files.write(path, content.getBytes(StandardCharsets.UTF_8));

    ```


    You can also write a collection of lines with


    ```

    Files.write(path, lines);

    ```


    To append to a given file, use


    ```

    Files.write(path, lines, StandardOpenOption.APPEND);

    ```'
