    # 9.4 Security Requirements


    When Java 1.0 was introduced in 1995 to an astounded world, the feature that caught
    everyone''s imagination was applets: remotely served code that runs inside the
    user''s web browser. The designers of Java knew perfectly well that executing
    remote code is a security risk, so they designed a "sandbox" model that stopped
    any damaging instructions in their tracks.


    Soon thereafter, academic researchers found some implementation flaws that were
    promptly fixed, and other academic researchers groaned in over the fact that the
    Java security model was complex and there was little assurance that its darker
    corners are safe from assault. At the time, I didn''t take that very seriously
    because the vast majority of Java applet consumers used Microsoft Windows, which
    was far less secure and far more complex.


    Applets were limited to visual effects and network connections to the originating
    host, which many application writers found limiting. They wanted local device
    access for storage, printing, and so. In 2001, Java Web started an extension of
    the sandbox that was quite powerful, comparable to HTML 5 extensions for local
    device access. Unfortunately, Java Web was poorly understood, not integrated with
    applets, and not maintained with vigor.


    Instead, many application developers simply signed their web-delivered programs,
    which gave them full permission to do anything on the user''s machine. Signing
    certificates from commercial entities are within reach of anyone willing to endure
    some cost and pain. It was also possible to apply a meaningless signed certificate,
    or have users agree to run an applet without a certificate. Warnings were toned
    down from one release to the next until they became background noise. This was
    very bad.


    Meanwhile, Microsoft, with an enormous engineering effort, got better at closing
    Windows loopholes, and it became worthwhile for hackers to look at Java vulnerabilities.
    When Oracle purchased Sun in 2010, they inherited a very limited infrastructure
    for dealing with such attacks and no reliable means of updating client virtual
    machines. Hackers became increasingly successful in'
