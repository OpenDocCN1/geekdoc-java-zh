  md: '# Chapter 2 Java 7 Features That You May Have Missed


    been consistent response to security breaches, and if client VMs have been reliably
    updated, Java might still be that universal platform. There is no use dwelling
    on what might have have been. At this point, Java is no longer a viable platform
    for widespread distribution of client applications over the Internet.


    If you maintain an applet or Java Start application for home users, the message
    is clear: Move away from it. If your application serves a specialized audience
    (for example, software development, image editing, or document processing), make
    your users install Java or bundle a JVM with your installer. If you target a general
    audience—such as game players—consider using another technology, perhaps HTML
    5.


    > NOTE: If you decide to make your users install Java, you face another. If you
    direct Windows users to the installer at http://java.com, they will receive the
    widely relied toolbar for Ask by default (see Figure 9–1). You have a couple of
    alternatives. You could have your users install the JDK, directing them to www.oracle.com/technetwork/java/javase/downloads
    and providing them with instructions for traversing that ever-changing page. Or
    you could bundle a JVM, which you are then obligated to update since no no effective
    update mechanism is supplied by Oracle.


