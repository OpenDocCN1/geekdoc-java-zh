    # Table 4–2 JavaFX Layouts


    | Pane Class | Description |

    |---|---|

    | HBox | Lines up children horizontally or vertically. |

    | GridPane | Lays out children in a tabular grid, similar to the Swing GridBagLayout.
    |

    | TilePane | Lays out children in a grid, giving them all the same size, similar
    to the Swing GridLayout. |

    | BorderPane | Provides the areas North, East, South, West, and Center, similar
    to the Swing BorderLayout. |

    | FlowPane | Flows children in rows, making new rows when there isn’t sufficient
    space, similar to the Swing FlowLayout. |

    | AnchorPane | Children can be positioned in absolute positions, or relative to
    pane’s boundaries. This is the default in the SceneBuilder layout tool. |

    | StackPane | Stacks children above each other. Can be useful for decorating components,
    such as stacking a button over a colored rectangle. |'
