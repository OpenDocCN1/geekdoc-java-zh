    > NOTE: By default, all methods of the Files class that read or write characters
    use the UTF-8 encoding. In the (hopefully unlikely) case that you need a different
    encoding, you can supply a Charset argument. Contrast with the String constructor
    and getBytes method which use the platform default. Commonly desktop operating
    systems still use archaic 8-bit encodings that are incompatible with UTF-8, so
    we must specify the encoding whenever converting between strings and bytes.


    When you work with text files of moderate length, it is usually simplest to process
    the contents as a single string or list of strings. If your files are large or
    binary, you can still use the familiar streams or readers/writers:


    ```

    InputStream in = Files.newInputStream(path);

    OutputStream out = Files.newOutputStream(path);

    Reader reader = Files.newBufferedReader(path);

    Writer writer = Files.newBufferedWriter(path);

    ```


    These convenience methods save you from having to deal with FileInputStream, BufferedReader,
    or BufferedWriter.


    Occasionally, you may have an InputStream (for example, from a URL) and you want
    to save its contents to a file.


    ```

    Files.copy(in, path);

    Conversely,

    Files.copy(path, out);

    ```


    copies a file to an output stream.


    # 9.2.3 Creating Files and Directories


    To create a new directory, call


    ```

    Files.createDirectory(path);

    ```


    All but the last component in the path must already exist. To create intermediate
    directories as well, use


    ```

    Files.createDirectories(path);

    ```


    You can create an empty file with


    ```

    Files.createFile(path);

    ```


    The call throws an exception if the file already exists. The check for existence
