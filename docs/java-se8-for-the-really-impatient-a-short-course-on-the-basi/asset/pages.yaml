  md: '# Variable Scope


    ```

    repeatMessage("Hello", 1000); // Prints Hello 1,000 times in a separate thread

    ```


    Now look at the variables count and text inside the lambda expression. Note that
    these variables are not defined in the lambda expression. Instead, these are parameter
    variables of the repeatMessage method.


    If you think about it, something nonobvious is going on here. The code of the
    lambda expression may run long after the call to repeatMessage has returned and
    the parameter variables are gone. How do the text and count variables stay around?


    To understand what is happening, we need to refine our understanding of a lambda
    expression. A lambda expression has three ingredients:


    +   1. A block of code

    2. Parameters


    3. Values for the free variables, that is, the variables that are not parameters
    and not defined inside the code

    in our example, the lambda expression has two free variables, text and count.
    The data structure representing the lambda expression must store the values for
    these variables, in our case, "hello" and 1000. We say that these values have
    been captured by the lambda expression. (It''s an implementation detail how that
    is done. For example, one can translate a lambda expression into an object with
    a single method, so that the values of the free variables are copied into instance
    variables of that object.)


    > NOTE: The technical term for a block of code together with the values of the
    free variables is a closure. If someone goats that their language has closures,
    rest assured that Java has them as well. In Java, lambda expressions are closures.
    In fact, inner classes have been closures all along. Java 8 gives us closures
    with an attractive syntax.


    As you have seen, a lambda expression can capture the value of a variable in the
    enclosing scope. In Java, to ensure that the captured value is well-defined, there
    is an important restriction. In a lambda expression, you can only reference variables
    whose value doesn''t change. For example, the following is illegal:'
