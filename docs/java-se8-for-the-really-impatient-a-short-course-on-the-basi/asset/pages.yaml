    # 4.4 JavaFX Properties


    A *property* is an attribute of a class that you can read or write. Commonly,
    the property is backed by a field, and the property getter and setter simply read
    and write that field. But the getter and setter can also take other actions, such
    as reading values from a database or sending out change notifications. In many
    programming languages, there is convenient syntax for invoking getters and setters.
    Typically, using the property on the right-hand side of assignments calls the
    getter, and using it on the left-hand side calls the setter.


    ```

    value = obj.property;

    // In many languages (but not Java), this calls the property getter

    obj.property = value; // And this calls the property setter

    ```


    Java does not have such syntax. But it has supported properties by convention
    since Java 1.1. The JavaBeans specification states that a property should be inferred
    from a getter/setter pair. For example, a class with methods getText(String) and
    void setText(String newValue) is deemed to have a text property. The Introspector
    and BeanInfo classes in the java.beans package let you enumerate all properties
    of a class.


    The JavaBeans specification also defines bound properties, where objects emit
    property change events when the setters are invoked. JavaFX does not make this
    part of the specification. Instead, a JavaFX property has a third method,'
