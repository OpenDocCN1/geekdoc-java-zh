    The namespace attribute to introduce the FXML namespace.


    > NOTE: If your controller doesn''t have a default constructor (perhaps, it is
    being initialized with a reference to a business service), you can set it programmatically:


    ```

    FXMLoader loader = new FXMLLoader(getClass().getResource(...));

    loader.setController(new Controller(service));

    Parent root = (Parent) loader.load();

    ```


    > CAUTION: If you set the controller programmatically, really use the code from
    the preceding node. The following code will compile, but it will invoke the static
    FMLoader.load method, ignoring the constructed loader:


    ```

