    # 6.2.3 Set Views


    Suppose you want a large, threadsafe set instead of a map. There is no

    ConcurrentHashMap class, and you know better than trying to create your own. For

    course, you can use a ConcurrentHashMap with bogus values, but then you get a
    map,

    not a set, and you can''t apply operations of the Set interface.


    The static new method yields a Set<K> that is actually a wrapper around

    ConcurrentHashMap<K, Boolean>. (All values are Boolean.TRUE, but you don''t actually

    care since you just use it as a set).


    ```

    Set<String> words = ConcurrentHashMap.<String>newKeySet();

    ```


    Of course, if you have an existing map, the key method yields the set of keys.

    That set is mutable. If you remove the elements, the keys (and their values)

    removed from the map. But it doesn''t make sense to add elements to the key

    set, because there would be no corresponding values to add. Java 8 adds a second

    keySet method to ConcurrentHashMap, with a default value, to be used when adding

    elements to the set:


    ```

    Set<String> words = map.keySet(L);

    words.add("Java");

    ```


    # 6.3 Parallel Array Operations


    The Arrays class has a number of parallelized operations. The static

    Arrays.parallelSort method can sort an array of primitive values or objects. For

    example,'
