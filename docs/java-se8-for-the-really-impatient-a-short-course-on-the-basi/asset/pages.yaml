  md: '# Chapter 8 Miscellaneous Goodies


    +   - Convenient support for null parameter checks can be found in the Objects
    class.


    # 8.1 Strings


    A common task is to combine several strings, separating them with a delimiter
    such as "," or //. This has now been added to Java 8. The strings can come from
    an array or an Iterable<T> extends CharSequence>:


    ```

    String joined = String.join(", "usr", "local", "bin"); // "usr/local/bin"

    System.out.println(joined);

    String ids = String.join(",", ZoneId.getAvailableZoneIds());

    System.out.println(ids);

    ```


    ```

    // All time identifiers, separated by commas

    ```


    Think of join as the opposite of the String.split instance method. This is the
    only method added to the String class in Java 8.


    > NOTE: as already mentioned in Chapter 2, the CharSequence interface provides
    a useful instance method codePoints that returns a stream of Unicode values, and
    a less useful method chars that returns a stream of UTF-16 units.


    # 8.2 Number Classes


    Since Java 5, each of the seven numeric primitive type wrappers (i.e., not Boolean)
    has a static SIZE field that gives the size of the type in bits. You will be glad
    to know that there is now a BYTES field that reports the size in bytes, for those
    who cannot divide by eight.


    All primitive type wrappers now have static hashCode methods that return the same
    hash as the instance method, but without the need for boxing.

    The five types Short, Integer, Float, and Double now have static methods sum,
    max, and min, which can be useful as reduction functions in stream operations.
    The Boolean class has static methods logicalAnd, logicalOr, and logicalXor for
    the same purpose.


    Integer types now support unsigned arithmetic. For example, instead of having
    a Byte represent the range from -128 to 127, you can call the static method Byte.toUnsignedInt(b)
    and get a value between 0 and 255. In general, with unsigned numbers, you lose
    the negative values and get twice the range of positive values.

    The Byte and Short classes have methods toUnsignedInt, and Byte, and Integer have
    methods toUnsignedLong.'
