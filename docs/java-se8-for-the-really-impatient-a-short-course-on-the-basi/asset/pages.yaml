  md: '# Chapter 1 Lambda Expressions


    strength of Java is in its simplicity and consistency. A language can become an
    unmaintainable mess if it includes every feature that yields marginally more concise
    However, in those other languages it''t just easier to spawn a thread or to register
    a button handler; large swaths of their APIs are simpler, more consistent, and
    more powerful. In Java, one could have written similar APIs that take objects
    of classes implementing a particular function, but such APIs would be unpleasant
    to use.


    For some time, the question was not whether to augment Java for functional programming,
    but how to do it. It took several years of experimentation before a design emerged
    that was a good fit for Java. In the next section, you will see how you can work
    with blocks of code in Java 8.


    # 1.2 The Syntax of Lambda Expressions


    Consider again sorting example from the preceding section. We pass code that checks
    whether one string is shorter than another. We compute


    ```

    Integer.compare(first.length(), second.length())

    ```


    What are first and second? They are both strings. Java is a strongly typed language,
    and we must specify that as well:


    ```

    (String first, String second)

    -> Integer.compare(first.length(), second.length())

    ```


    You have just seen your first lambda expression. Such an expression is simply
    a block of code, together with the specification of any variables that must be
    passed to the code.


    Why the name? Many years ago, before there were any computers, the logician Alonzo
    Church wanted to finalize what it means for a mathematical function to be effectively
    computable. (Curiously, there are functions that are known to exist, but nobody
    knows how to compute their values.) He used the Greek letter (λ) to mark parameters.
    Had he known about the Java API, he would have written


    ```

    λ.second.Integer.compare(first.length(), second.length())

    ```


    > NOTE: Why the letter λ? Did Church run out of other letters of the alphabet?
    Actually, the venerable Principia Mathematica used the ^ accent to denote free
    variables, which inspired Church to use an uppercase lambda Λ for parameters.
    But since then, he switched to the lowercase version. Since ever, an expression
    with parameter variables has been called a lambda expression.'
  merge: -1
