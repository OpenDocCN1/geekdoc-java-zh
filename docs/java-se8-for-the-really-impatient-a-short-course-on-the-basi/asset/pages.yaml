    Supply the class object of the superclass or interface and a JavaScript object
    with the methods that you want to override or implement.


    For example, here is an iterator that produces an infinite sequence of random
    numbers. We override two methods, next and hasNext. For each method, we provide
    an implementation as an anonymous JavaScript function:'
