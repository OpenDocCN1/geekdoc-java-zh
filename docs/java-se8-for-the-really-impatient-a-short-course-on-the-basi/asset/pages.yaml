  md: '# 3.10 Monadic Operations


    When you work with generic types, and with functions that yield values from these
    types, it is useful to supply methods that let you compose these functions—that
    is, carry out one after another. In this section, you will see a design pattern
    for providing such compositions.


    Consider a generic type G<T> with one type parameter, such as List<T> (zero or
    more values of type T), Optional<T> (zero or one values of type T), or Future<T>
    (a value of type T that will be available in the future).


    Also consider a function T -> U, or Function<T, U> object.


    It often makes sense to apply this function to a G<T> (that is, a List<T>, Optional<T>,
    Future<T>, and so on). This works exactly depends on the nature of the generic
    type G. For example, applying f to a List with elements e1,...,en creates a List
    with elements f(e1)...f(en).


    Applying f to an Optional<T> containing v means creating an Optional<U>—but if
    it is an empty Optional<T> without a value, the result is an empty Optional<U>.


    Applying f to a Future<T> simply means to apply it when it is available.


    By tradition, this operation is usually called map. There is a map method for
    Stream and Optional. The CompletableFuture class that we will discuss in Chapter
    6 has an operation that does what map should do, but it is called apply. There
    is no map for a plain Future<V>, but it is not hard to supply one (see Exercise
    21).


    So, far that is a fairly straightforward idea. It gets more complex when you look
