  md: '# 4.6 Layout


    Note the following:


    +   - The labels "User name:" and "Password:" are right aligned

    - The buttons are in an HBox that spans two rows.


    When you add a child to a GridPane, specify its column and row index (in that
    order; think x- and y-coordinates).


    ```

    pane.add(usernameLabel, 0, 0);

    pane.add(username, 1, 0);

    pane.add(passwordLabel, 0, 1);

    pane.add(password, 1, 1);

    ```


    If a child spans multiple columns or rows, specify the spans after the positions.
    For example, the button spans two columns and one row:


    ```

    pane.add(buttons, 0, 2, 2, 1);

    ```


    If you want a child to span all remaining rows or columns, you can use GridPane.REMAINING.


    To set the horizontal alignment of a child, use the static setAlignment method,
    and pass the child reference and a constant LEFT, CENTER, or RIGHT from the HPos
    enumeration.


    ```

    GridPane.setAlignment(usernameLabel, HPos.RIGHT);

    ```


    Similarly, for vertical alignment, call setAlignment and use TOP, CENTER, or BOTTOM
    from the VPos enumeration.


    > NOTE: These static calls look rather in in Java code, but they make sense in
    the FXML markup language—see the next section.


    > CAUTION: Do not center the HBox with the buttons inside the grid. That box has
    expanded to the full horizontal size, and centering will not change its position.
    Instead, tell the HBox to center its contents:


    ```

    buttons.setAlignment(Pos.CENTER);

    ```


    You will also want to provide some spacing around the rows and columns and some
    padding around the table:


    ```

    pane.setGap(0.8 * em);

    pane.setVGap(0.8 * em);

    pane.setPadding(new Insets(0.8 * em));

    ```'
