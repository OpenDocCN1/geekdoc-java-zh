    \    s -> if (s.length() < 12) shortwords[s.length]++);\n);// Error—race condition!\n\
    ```\n\nSystem.out.println(Arrays.toString(shortwords));\n\nThis is very, very\
    \ bad code. The function passed to foreach runs concurrently in multiple threads,\
    \ updating a shared array. That's a classic race condition. If you run this parallel\
    \ multiple times, you are likely to get a different sequence of counts in each\
    \ run, each of them wrong.\n\nIt is your responsibility to ensure that any functions\
    \ that you pass to parallel stream operations are threadsafe. In our example,\
    \ you could use an array of AtomicInteger objects for the counters (see Exercise\
    \ 12). Or you could simply use the facilities of the streams library and group\
    \ strings by length (see Exercise 13).\n\nBy default, streams that arise from\
    \ ordered collections (arrays and lists), from ranges, generators, and iterators,\
    \ or from calling sorted(), are ordered. They accumulate in the order of the original\
    \ elements, and are entirely predictable. If you run the same operations twice,\
    \ you will get exactly the same results.\n\nOrdering does not preclude parallelization.\
    \ For example, when computing stream.map(fun), the stream is partitioned into\
    \ n segments, each of which is concurrently processed. Then the results are reassembled\
    \ in order.\n\nSome operations can be more effectively parallelized when the ordering\
    \ requirement is dropped. By calling the unordered method, you indicate that you\
    \ are not interested in ordering. One operation that can benefit from this is\
    \ stream.distinct(). On an ordered stream, distinct retains the first of all equal\
    \ elements. That impedes parallelization—the thread processing a segment can't\
    \ know which elements to discard until the preceding segment has been processed.\
    \ If it is acceptable to retain any of the unique elements, all segments can be\
    \ processed concurrently (using a shared set to track duplicates).\n\nYou can\
    \ speed up the limit method by dropping ordering. If you just want any n elements\
    \ from a stream and you don't care which ones you get, call\n\n```\nStream<T>\
    \ sample = stream.parallel().unordered().limit(n);\n```\n\nAs discussed in Section\
    \ 2.10, \"Collecting into Maps,\" on page 34, merging maps is expensive. For that\
    \ reason, the Collectors.groupingByConcurrent method uses a shared concurrent\
