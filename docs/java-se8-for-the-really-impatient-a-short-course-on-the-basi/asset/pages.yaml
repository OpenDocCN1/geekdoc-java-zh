  md: '# 2.7 The Optional Type


    Optional<T> object is either a wrapper for an object of type T or for no object.
    It is intended a safer alternative than a reference of type T that refers to an
    object or null. But it is only safer if you use it right.


    The get method gets the wrapped element if it exists, or throws a NoSuchElementException
    if it doesn''t. Therefore,


    ```

    Optional<T> optionalValue = ...;

    optionalValue.get().someMethod();

    ```


    is no safer than


    ```

    T value = ...;

    value.someMethod();

    ```


    As you saw in the preceding section, the isPresent method reports whether an Optional<>
    object has a value. But


    ```

    if (optionalValue.isPresent()) optionalValue.get().someMethod();

    ```


    is no easier than


    ```

    if (value == null) value.someMethod();

    ```


    In the next section, you will see how you should really work with Optional values


    # 2.7.1 Working with Optional Values


    The key to using Optional effectively is to use a method that either consumes
    the correct value or produces an alternative.


    There is a second form of the isPresent method that accepts a function. If the
    optional value exists, it is passed to that function. Otherwise, nothing happens
    Instead of using an if statement, you call


    ```

    optionalValue.ifPresent(() -> process v);

    ```


    For example, if you want to add the value to a set if it is present, call


    ```

    optionalValue.ifPresent(() -> results.add(v));

    ```


    or simply


    ```

    optionalValue.ifPresent(results::add);

    ```


    When calling this version of ifPresent, no value is returned. If you want to prozess
    the result, use map instead:


    ```

    Optional<Boolean> added = optionalValue.map(results::add);

    ```


    Now added has one of three values: true or false wrapped into an Optional, if
    optionalValue was present, or an empty optional otherwise.'
