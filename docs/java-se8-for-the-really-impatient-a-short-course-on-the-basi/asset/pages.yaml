  md: 'There are a few variations of these methods. You can specify a comparator to
    be used for the keys that the comparing and thenComparing methods extract. For
    example, here we sort people by the length of their names:


    ```

    Arrays.sort(people, Comparator.comparing(Person::getName),

    (s, t) -> Integer.compare(s.length(), t.length()));

    ```


    Moreover, both the comparing and thenComparing methods have variants that avoid
    boxing of int, long, or double values. An easier way of producing the preceding
    operation would be


    ```

    Arrays.sort(people, Comparator.comparingInt(p -> p.getName()));

    ```


    If your key function can return null, you will like the nullFirst and nullLast
    adapters. These static methods take an existing comparator and modify it so it
    doesn''t throw an exception when encountering null values but ranks them as smaller
    or larger than regular values. For example, suppose getMiddleName returns null
    when a person has no middle name. Then you can use Comparator.comparing(Person::getMiddleName,
    Comparator.nullFirst(...));


    The nullFirst method makes a comparator—in this case, one that compares two strings.
    The naturalOrder method makes a comparator for any class implementing Comparable.
    A Comparator.naturalOrder() is what we need. Here is the complete call for sorting
    by potentially null middle names. I use a static import of java.util.Comparator.*,
    to make the expression more legible. Note that the type of naturalOrder is inferred.


    ```

    Arrays.sort(people, Comparator.comparing(Person::getMiddleName,

    nullFirst(naturalOrder())));

    ```


    The static reverseOrder method gives the reverse of the natural order. To reverse
    any comparator, use the reversed instance method. For example, naturalOrder().reversed()
    is the same as reverseOrder().


    # 8.4.3 The Collections Class


    Java 6 introduced NavigableSet and NavigableMap classes that take advantage of
    the ordering of the elements or keys, providing efficient methods to locate, for
    any value v, the smallest element ≥ v or the largest element < v. Now the Collections
    class supports these classes as it does other collections, with methods (unmodifiable|synchronized|checked|empty)Navigable(Set|Map).


    A CheckedQueue, that has apparently been overlooked all these years, has also
    been added. As a reminder, the checked wrappers have a Class parameter and throw
    a ClassCastException when you insert an element of the wrong type. These classes
    are intended for debugging aids. Suppose you declare a Queue<Path>, and somewhere
    in your code there is a ClassCastException trying to cast a String to a Path.'
