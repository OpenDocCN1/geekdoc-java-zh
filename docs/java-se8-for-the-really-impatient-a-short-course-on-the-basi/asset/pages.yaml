    \ x is large and other.x is negative, the difference overflow. That makes compare\
    \ rather tedious (see Exercise 8).\n\nAs of Java 7, use the static Integer.compare\
    \ method:\n\n```\npublic int compareTo(Point other) {\n    int diff = Integer.compare(x,\
    \ other.x); // No risk of overflow\n    if (diff != 0) return diff;\n    return\
    \ Integer.compare(y, other.y);\n}\n```\n\n*"
