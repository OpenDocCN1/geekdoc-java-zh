  md: "# Chapter 8 Miscellaneous Goodies\n\n# # 8.5.3 Base64 Encoding\n\nThe Base64\
    \ encoding encodes a sequence of bytes into a (longer) sequence of printable ASCII\
    \ characters. It is used for binary data in email messages and \"basic\" HTTP\
    \ authentication. For many years, the JDK had a nonpublic (and therefore unusable)\
    \ class java.util.prefs.Base64 and an undocumented class sun.misc.Base64Encoder.\
    \ Finally, Java 8 provides a standard encoder and decoder. The Base64 encoding\
    \ uses 64 characters to encode six bits of information:\n\n+   - 26 uppercase\
    \ letters A … Z\n- 26 lowercase letters a … z\n- 10 digits † 9\n- 2 symbols, +\
    \ and / (basic) - and _ (URL- and filename-safe variant)\n\nNormally, an encoded\
    \ string has no line breaks, but the MIME standard used for email requires a \"\
    \\r\\n\" line break every 76 characters.\n\nFor encoding, request a Base64.Encoder\
    \ with one of the static methods getEncoder, getEncoder, or getMimeEncoder of\
    \ the Base64 class.\n\nThat class has methods to encode an array of bytes or a\
    \ NIO ByteBuffer. For example:\n\n```\nBase64.Encoder encoder = Base64.getEncoder();\n\
    String original = username + \":\" + password;\nString encoded = encoder.encodeToString(original.getBytes(StandardCharsets.UTF_8));\n\
    ```\n\nAlternatively, you can \"wrap\" an output stream, so that all data you\
    \ send to it is automatically encoded.\n\n```\nPath originalPath = ..., encodedPath\
    \ = ...;\nBase64.Encoder encoder = Base64.getMimeEncoder();\ntry (OutputStream\
    \ output = Files.newOutputStream(encodedPath)) {\n  Files.copy(originalPath, encoder.wrap(output));\n\
    }\n```\n\nTo decode, reverse these operations:\n\n```\nPath encodedPath = ...,\
    \ decodedPath = ...;\nBase64.Decoder decoder = Base64.getMimeDecoder();\ntry (InputStream\
    \ input = Files.newInputStream(encodedPath)) {\n  Files.copy(decoder.wrap(input),\
    \ decodedPath);\n}\n```"
