  md: '# 7.12.2 String Interpolation


    Expressions ${...} are evaluated within doubly quoted and backquoted strings.
    This is called "string interpolation." For example,


    ```

    var cmd = "javac -classpath ${classpath} ${mainclass}.java"

    EXEC(cmd);

    ```


    or simply


    ```

    `javac -classpath ${classpath} ${mainclass} mainclass`

    ```


    injects the contents of the variables classpath and mainclass into the command.

    You can use arbitrary expressions inside the ${...}"


    ```

    var message = "The current time is ${java.time.Instant.now()}"

    // Sets message to a string such as The current time is 2013-10-12T21:48:58.5452

    ```


    As with the shell bash, string interpolation does not work inside simply quoted
    strings.


    ```

    var message = ''The current time is ${java.time.Instant.now()}''

    // Sets message to The current time is ${java.time.Instant.now()}

    ```


    Strings are also interpolated in "here documents"—inline documents in a script.
    These inline documents are useful when a command reads multiple lines from standard
    input and the script author doesn''t want to put the input in a separate file.
    As an example, here is how you can feed commands to the GlassFish administration
    tool:


    ```

    name=''myapp''

    dir=''/opt/apps/myapp''

    EXEC("admin", <<END)

    start-domain

    start-database

    deploy ${name} ${dir}

    exit

    END

    ```


    The <<END construct means "Insert the string that starts on the next line and
    is terminated by the line END." (Instead of END, you can use any identifier that
    doesn''t appear inside the string.)


    Note that the name and location of the application are interpolated.


    String interpolation and here documents are only available in scripting mode.'
