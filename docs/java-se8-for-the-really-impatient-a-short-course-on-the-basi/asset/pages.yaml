  md: '# 1.3 Functional Interfaces


    In fact, a conversion to a functional interface is the only thing that you can
    do with a lambda expression in Java. In other programming languages that support
    function literals, you can declare function types as (String, String) -> int,
    declare variables of those types, and you use the variables to save function expressions.
    However, the Java designers decided to stick with the familiar concept of interfaces
    instead of adding function types to the language.


    > NOTE: You can''t even assign a lambda expression to a variable of type Object--Object
    is not a functional interface.


    The Java API defines a number of very generic functional interfaces in the java.util.function
    package. (We will have a closer look at these interfaces in Chapters 2 and 3.)
    One of them, BiFunction<T, U, R>, describes functions with parameter types T and
    U and return type R. You can save our string comparison lambda in a variable of
    that type:


    ```

    BiFunction<String, String, Integer> comp = (first, second) -> Integer.compare(first.length(),
    second.length());

    ```


    However, that does not help you with sorting. So there Arrays.sort method that
    works with a Function. If you have used a functional programming language before,
    you may find this curious. But for Java programmers, it''s pretty natural. An
    interface as Comparator has a specific purpose, not just a method with parameter
    and return types. Java 8 retains this flavor. When you want to do something with
    lambda expressions, you still want to keep the purpose of the expression in mind,
    and have a specific functional interface for it.


    The interfaces in java.util.function are used in several Java 8 APIs, and you
    will likely see them elsewhere in the future. But keep in mind that you can convert
    a lambda expression into a functional interface that is of whatever API you use
    today.


    > NOTE: You can tag any functional interface with the @FunctionalInterface annotation.
    This has two advantages: The compiler checks that the annotated entity is an interface
    with a single abstract method. And the javadoc includes a statement that your
    interface is a functional interface.


    It is not required to use the annotation. Any interface with a single abstract
    method is, by definition, a functional interface. But using the @FunctionalInterface
    annotation is a good idea.


    Finally, note that checked exceptions matter when a lambda is converted to an
    instance of a functional interface. If the body of a lambda expression may throw'
