  md: '# 7.12.3 Script Inputs


    You can supply command-line arguments to a script. Since it is possible to include
    multiple script files on the jjs command line, you need to separate the script
    files and arguments with a -- -


    ```

    jjs script1.js script2.js -- arg1 arg2 arg3

    ```


    > NOTE: That is a little ugly. If you have only one script file, you can instead
    run jscript -f script.js arg1 arg2 arg3


    > TIP: The first line of a script can be a "shebang", the symbols #! followed
    by the location of the script interpreter. For example,


    #!/opt/java/bin/jjs

    or

    #!/opt/java/bin/script -f


    Then you can make the script file executable and simply run it as path/script.js.

    When a script starts with a shebang, scripting mode is automatically activated.


    > CAUTION: If your script has arguments, and you use jjs in the shebang, script
    users will need to supply the --:path/script.js -- arg1 arg2 arg3. Users will
    not love you for that. Use jscript instead.


    In the script file, you receive the command-line arguments in the array:

    var deployCommand = "deploy ${arguments[0]} ${arguments[1]}"


    With jjs (but not jscript), you can use $ARG instead of arguments. If you use
    variable with string interpolation, you need two dollar signs:


    ```

    var deployCommand = "deploy ${ARG[0]} ${ARG[1]}"

    ```


    In your script, you can obtain the shell''s environment variables through the
    ENV object:


    ```

    var javaHome = $ENV.JAVA_HOME

    ```


    In scripting mode, you can prompt the user for input with the readline function:

    var username = readline(''Username: '')'
