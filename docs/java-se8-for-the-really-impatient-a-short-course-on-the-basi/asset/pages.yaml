  md: '# Chapter 1 Lambda Expressions


    > NOTE: It is illegal for a lambda expression to return a value in some branches
    but not in others. For example, (int x) -> { if (x >= 0) return 1; } is invalid.


    # 1.3 Functional Interfaces


    As we discussed, there are many existing interfaces in Java that encapsulate blocks
    of code, such as Runnable or Comparator. Lambdas are backwards compatible with
    these interfaces.


    You can supply a lambda expression whenever an object of an interface with a single
    abstract method is expected. Such an interface is called a functional interface.


    > NOTE: You may wonder why a functional interface must have a single abstract
    method. Aren''t all methods in an interface abstract? Actually, it has always
    been possible for an interface to redeclare methods from the Object class such
    as toString() or clone, and these declarations do not make the methods abstract.
    (Some interfaces in the Java API redeclare Object methods in order to attach javafx.
    Check the Comparator API for an example.) More importantly, as you will see in
    Section 1.7, "Default Methods," on page 14, in Java 8, interfaces can declare
    nonabstract methods.


    To demonstrate the conversion to a functional interface, consider the Arrays.sort
    method. Its second parameter requires an instance of Comparator, or an interface
    with a single method. Simply supply a lambda:


    ```

    Arrays.sort(words, (first, second) -> Integer.compare(first.length(), second.length()));

    ```


    Behind the scenes, the Arrays.sort method receives an object of some class that
    implements Comparator<String>. Invoking the compare method on that object executes
    the body of the lambda expression. The management of these objects and classes
    is completely implementation dependent, and it can be much more efficient than
    using traditional inner classes. It is best to think of a lambda expression as
    a function, not an object, and to accept that it can be passed to a functional
    interface.


    This conversion to interfaces is what makes lambda expressions so compelling.
    The syntax is short and simple. Here is another example:


    That''s a lot easier to read than the alternative with inner classes.'
