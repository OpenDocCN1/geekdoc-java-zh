  md: '# 6.4 Completable Futures


    The java.util.concurrent library provides a Future<T> interface to denote a value
    of type T that will be available at some point in the future. However, up to now,
    futures were rather that limited. In the following sections, you will see how
    completable futures make it possible to compose asynchronous operations.


    # 6.4.1 Futures


    Here is a quick refresher on futures. Consider a method


    ```

    public void Future<String> readPage(URL url)

    ```


    The method reads a web page in a separate thread, which is going to take a while.
    When you call


    ```

    Future<String> contents = readPage(url);

    ```


    the method returns right away, and you hold in your hands a Future<String>. Now
    we want to extract all URLs from the page in order to build a web crawler. We
    have a class Parser with a method


    ```

    public static List<URL> getLinks(String page)

    ```


    How can we apply this method to the future object? Unfortunately, there is only
    one way. First, call the get method on the future to get its value when it becomes
    available. Then, process the result:


    ```

    String page = contents.get();

    List<URL> links = Parser.getLinks(page);

    ```


    But the call to get is a blocking call. We are all no better off than with a method
    public String readPage(URL url) that blocks until the result is available.


    Now in fairness, there has been some support for futures in java.util.concurrent,
    but an essential piece was missing. There was no easy way of saying: "When the
    result becomes available, here is how to process it." This is the crucial feature
    that the new CompletableFuture<T> class provides.


    # 6.4.2 Composing Futures


    Let''s change the readPage method so it returns a CompletableFuture<String>. Unlike
    a plain Future, a CompletableFuture has a method thenApply to which you can pass
    the post-processing function.


    ```

    CompletableFuture<String> contents = readPage(url);

    CompletableFuture<List<String>> links = contents.thenApply(Parser::getLinks);

    ```'
  merge: -1
  pgno: 147
- img_proc: true
  md: '# 6.4 Completable Futures 131


    the thenApply method doesn''t block either. It returns another future. When the
    first future has completed, its result is fed to the getLinks method, and the
    return value of that method becomes the final result.


    This composability is the key aspect of the CompletableFuture class. Composing
    futures solves a serious problem in programming asynchronous applications. The
    traditional approach for dealing with nonblocking calls is to use event handlers.
    The programmer registers a handler for the next action after completion. Of course,
    if the next action is also asynchronous, then the next action after that is in
    a different event handler. Even though the programmer thinks in terms of “first
    do step 1, step 2, step 3”, the program logic becomes dispersed in different places.
    It gets worse when one has to add error handling. Suppose step 2 is “the user
    logs in”; then we may need to repeat that step since the user may mistake the
    credentials. Trying to implement such a control flow in a set of event handlers,
    or to understand once it has been implemented, is challenging.


    With completable futures, you specify what you want to have, and in which order.
    It won''t happen right away, of course, but what is important that all the code
    is in one place.


    # 6.4.3 The Composition Pipeline


    In Chapter 2, you saw how a stream pipeline starts with stream creation, goes
    through one or more transformations, and finishes with a terminal operation. The
    same is true for a pipeline of futures.


    Start out by generating a CompletableFuture, usually with the static method supplyAsync.
    That method requires a Supplier<T>, that is, a function with no parameters yielding
    a T. The function is called on a separate thread. In our example, we can start
    the pipeline with


    ```

    CompletableFuture<String> contents

    = CompletableFuture.supplyAsync(() -> blockingReadPage(url));

    ```


    There is also a static async method that takes a Runnable, yielding a CompletableFuture<Void>.
    This is useful if you simply want to schedule one action after another, without
    passing data between them.


    > NOTE: All methods ending in Async have two variants. One of them runs the provided
    action on the common ForkJoinPool. The other has a parameter type java.util.concurrent.Executor,
    and it uses the given executor to run the action.'
