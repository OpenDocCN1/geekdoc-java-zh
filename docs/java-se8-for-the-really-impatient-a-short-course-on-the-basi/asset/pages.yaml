  md: '# 9.2.1 Paths


    A Path is a sequence of directory names, optionally followed by a file name. The
    first component of a path may be a root component, as / or C:\. The permissible
    root components depend on the file system. A path that starts with a root component
    is absolute. Otherwise, it is relative. For example, we construct an absolute
    and a relative path. For the absolute path, we assume a computer running a Unix-like
    file system.


    ```

    Path absolute = Paths.get("/", "home", "cay");

    Path relative = Paths.get("myprog", "conf", "user.properties");

    ```


    The static Paths.get method receives one or more strings, which joins them with
    the path separator of the default file system (/ for a Unix-like file system,
    \ for Windows). It parses the result, throwing an InvalidException if the result
    is not a valid path in the given file system. The result is a Path object.


    You can also provide a string with separators to the Paths.get method:


    ```

    Path home = Paths.get("/home/cay");

    ```


    > NOTE: Like a File object, a Path object does not have to correspond to a file
    that actually exists. It is merely an abstract sequence of names. To create a
    file, first make a path, then call a method to create the corresponding file.


    It is very common to combine or resolve paths. The p.resolve(q) returns a path
    according to these rules:


    +   - If q is absolute, the result is q.

    - Otherwise, the result is "p then q" according to the rules of the file system.


    For example, suppose your application needs to find its configuration file relative
    to the home directory. Here is how you can combine the paths:


    ```

    Path configFile = homeDirectory.resolve("myprog/conf/user.properties");

    // Same as homeDirectory.resolve(Paths.get("myprog/conf/user.properties"));

    ```


    There is a convenience method resolveSibling that resolves against a path''s parent,
    yielding a sibling path. For example, if workPath is /home/cay/myprog/work, the
    call


    ```

    Path tempPath = workPath.resolveSibling("temp");

    ```


    yields /home/cay/myprog/temp.

    The opposite of resolve is relativize. The call p.relativize(q) yields the path
    q which, when resolved with p, yields r.


    ```

    Paths.get("/home/cay").relativize(Paths.get("/home/fred/myprog"))

    ```'
