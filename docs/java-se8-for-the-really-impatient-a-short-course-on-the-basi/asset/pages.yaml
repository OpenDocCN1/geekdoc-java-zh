  md: '# Chapter 4


    JavaFX is the recommended user interface toolkit for writing rich client applications
    with Java. JavaFX is now bundled with all supported versions of Oracle''s Java
    platform. In this chapter, you will learn the basics of JavaFX development. If
    you don''t, skim over the chapter anyway so you can develop rich user interface
    platforms, you will see how to transition from Swing to JavaFX. If you don''t,
    skim over the chapter anyway so you can understand the sample applications we
    use elsewhere when it is convenient to illustrate a concept with a graphical program.


    The key points of this chapter are:


    +   - A scene graph is made of nodes which may contain other nodes.

    - A scene is displayed on a stage (top-level window, the surface of an applet,
    or the full screen).

    - Some controls (such as buttons) emit events, but most JavaFX events come from
    property changes.

    - JavaFX properties emit change and invalidation events.

    - When you bind a property to another, it is updated when the other one changes.

    - JavaFX uses layout panes that work similar to layout managers in Swing.

    - You can specify layout with the FXML markup language.

    - You can use CSS to change the visual appearance of your application.'
