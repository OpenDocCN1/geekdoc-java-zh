  md: '2. Stream operations don’t mutate your source. Instead, they return new streams
    that hold the result.


    3. Stream operations are lazy when possible. This means they are not executed
    until their is needed. For example, if you only ask for the first five words instead
    of counting them all, then the filter method will stop filtering after the fifth
    match. As a consequence, you can even have infinite streams!


    In this chapter, you will learn all about streams. Many people find stream expressions
    difficult to read the long equivalents. Moreover, they can be easily parallelized.
    Here is how you count words in parallel:


    ```

    long count = words.parallelStream().filter(w -> w.length() > 12).count();

    ```


    Simply changing iteration toStream allows the stream library to do the filtering
    and counting in parallel. We describe what needs to be done: get the words and
    count them. We don’t specify in which order, or in which thread, this should happen.
    In contrast, the loop at the beginning of this section specifies exactly how the
    computation should work, and therefore forges any chances of optimization.


    When you work with streams, you set up a pipeline of operations in three stages.


    +   1. You create a stream.


    +   2. You specify intermediate operations for transforming the initial stream
    into others, in one or more steps.


    +   3. You apply a terminal operation to produce a result. This operation forces
    the execution of the lazy operations that precede it. Afterwards, the stream can
    no longer be used.


    In our example, the stream was created with the stream or parallelStream method.
    The filter method transformed it, and count was the terminal operation.


    > NOTE: Stream operations are not executed on the elements in the order in which
    they are invoked on streams. In our example, nothing happens until count is called.
    When the count asks for the first element, then the filter method starts requesting
    elements, until it finds one that has length > 12.


    In the next section, you will see how to create a stream. The subsequent sections
    deal with stream transformations. They are followed by five sections on terminal
    operations.'
