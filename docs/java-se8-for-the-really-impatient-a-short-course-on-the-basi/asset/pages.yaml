    \ with input or output, there is an awkward problem with\nclosing the resource\
    \ after an exception. Suppose an IOException occurs and then,\nclosing the resource,\
    \ the call to close throws another exception.\n\nWhich exception will actually\
    \ be caught? In Java, an exception thrown in a finally\nblock discards the previous\
    \ exception. This sounds inconvenient, and it is.\nAfter all, the user is likely\
    \ to be much more interested in the original exception.\n\nThe try-with-resources\
    \ statement reverses this behavior. When an exception is\nthrown in a close method\
    \ of one of the AutoCloseable objects, the original exception\ngets rethrown,\
    \ and the exceptions from calling close are caught and attached as\n\"suppressed\"\
    \ exceptions. This is a very useful mechanism that would be tedious\nto implement\
