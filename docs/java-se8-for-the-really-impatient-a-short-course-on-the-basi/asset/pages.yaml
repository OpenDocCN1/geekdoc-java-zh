  md: "# Chapter 6 Concurrency Enhancements\n\n+   - A set view lets you use a ConcurrentHashMap\
    \ as a Set.\n- The Arrays class has methods for parallel sorting, filling, and\
    \ prefix operations.\n- Completable futures let you compose asynchronous operations.\n\
    \n#  6.1 Atomic Values\n\nSince Java 5, the java.util.concurrent.atomic package\
    \ provided classes for lock-free mutation of variables. For example, you can safely\
    \ generate a sequence of variables like this:\n\n```\npublic static AtomicLong\
    \ nextNumber = new AtomicLong();\n// In some thread...\nlong id = nextNumber.incrementAndGet();\n\
    ```\n\nThe incrementAndGet method atomically increments the AtomicLong and returns\
    \ the post-increment value. That is, the operations of getting the value, adding\
    \ 1, setting it, and producing the new value are atomic, and the new value cannot\
    \ be interrupted. It is guaranteed that the correct value is computed and returned,\
    \ even if multiple threads access the same instance.\n\nThere are methods for\
    \ atomically setting, adding, and subtracting values, but if you want to make\
    \ a more complex update, you have to use the compareAndSet method. For example,\
    \ suppose you want to keep track of the largest value that is observed by different\
    \ threads. The following won't work:\n\n```\npublic static AtomicLong largest\
    \ = new AtomicLong();\n// In some thread...\nlargest.set(Math.max(largest.get(),\
    \ observed)); // Error--race condition!\n```\n\nThis update is not atomic. Instead,\
    \ compute the new value and use compareAndSet in a loop:\n\n```\ndo {\n  oldValue\
    \ = largest.get();\n  newValue = Math.max(oldValue, observed);\n} while (!largest.compareAndSet(oldValue,\
    \ newValue));\n```\n\nIf another thread is also updating largest, it is possible\
    \ that it has beat this thread to. Then compareAndSet will return false without\
    \ setting the new value. In that case, the loop tries again, reading the updated\
    \ value and trying to change it. Eventually, it will succeed replacing the existing\
    \ value with the new one. This sounds tedious, but the compareAndSet method maps\
    \ to a processor operation that is faster than using a lock."
