  md: '# # Chapter 3


    In the first two chapters, you saw the basic syntax and semantics of lambda expressions
    as well as the stream API that makes extensive use of them. In this chapter, you
    will learn how to create your own libraries that make use of lambda expressions
    and functional interfaces.


    The key points of this chapter are:


    +   - The main reason for using a lambda expression is to defer the execution
    of the code until an appropriate time.

    - When a lambda expression is executed, make sure to provide any data as inputs.

    - Choose one of the existing functional interfaces if you can.

    - It is often useful to write methods that return an instance of a functional
    interface.

    - When you work with transformations, consider how you can compose them.

    - To compose transformations lazily, you need to keep a list of all pending transformations
    and apply them in the end.

    - If you need to apply a lambda many times, you often have a chance to split up
    the work into subtasks that execute concurrently.

    - Think what should happen when you work with a lambda expression that throws
    an exception.'
