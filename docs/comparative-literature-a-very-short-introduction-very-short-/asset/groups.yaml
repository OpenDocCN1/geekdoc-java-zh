    This is not to say that comparative literature was exclusively the province of
    White Anglo-Saxon Protestants. By the 1870s, comparative studies were beginning
    to emerge on the far eastern edge of Europe. In 1872—the same year in which George
    Smith published his version of Gilgamesh—the University of Moscow opened a Department
    of World Literature; in 1875, St Petersburg followed by the name a Neo-Philosophical
    Society. The presiding spirit behind this international initiative was a literary
    historian by the name of Aleksandr Vesovsky (1838–1906), who went on to become
    arguably the single most important figure in the development of comparative literature
    in Russia. Vesovsky pioneered the study of international patterns of literature
    as a way of understanding modes of development. Interested in particular in folklore
    and fairyt, Vesovsky used comparative methods to explore the relationship between
    East (Russia) and West (Europe). His study of the Western Influence in Russian
    Literature first appeared in 1881; by 1916 it had gone through an impressive five
    editions, indicating its wide reception.


    Vesovsky''s view of comparative literature as the study of sources and influences
    derives its importance from the historical context of late 19th-century Russia.
    For Vesovsky, as for many of his contemporaries and compatriots—the generation
    of the so-called Silver Age—Russia was a culturally backward continent that could
    only develop by looking to the West. The'
  - '[PAGE 37]


    progress of Russian culture could be taught, he believed, by comparing it to that
    of Western Europe. Ultimately, this would be to Russian advantage, since the receptivity
    of Russian culture ensured that it became even richer and stronger. By incorporating
    international influences, the national culture emerged as a fuller version of
    itself. Here elsewhere—the argument re-emerges in Oswald de Andrade''s Manifesto
    Antropológico (1928), for instance, which proposes that Brazil should ''cannibalize''
    Russian in order to absorb its cultural nutrients—comparative literature functions
    are in exercise in nation building.


    It is worth paying a moment to reflect on what this implies. If literature as
    it was practiced in 19th-century Europe emerged as continuation of international
    literature by other means, this took two primary principles: empire building and
    nation building. The former model applied to the nations that were politically
    and militarily dominant, above all England and France; the latter, to those who
    were struggling to articulate their identity on the international stage—one might
    think of Russia or Denmark. Germany, from which so much of the impetus for comparative
    literature emerged, occupies a pivotal position between the two models, although
    it emerged as a nation in 1871, it had a leading position. In literature as politics,
    the nations were aggressively expanding their sphere of influence—often in the
    form of large, multilingual empires—while the emerging nations were engaged in
    defensive attempts to establish the importance of their own cultures through comparing
    them to others. Literature, to return to economic metaphors of currency and define
    Weltliteratur, a version of culture to be acquired through invested exchange.


    One of the more interesting consequences of this is that it is often cultures
    perceived as ''marginal'' that are more comparative, for the reason that they
    have more to gain from international cooperation. Russian Symbolism at the end
    of the 19th century is a case in point, drawing as it does to Schopenhauer and
    Nietzsche in Germany, Mallarmé and Verlaine in France, Pater and Wilde in England,
    and Ibsen in Scandinavia. Writing in the 1889 edition of The Western Influence
    in Russian Literature noted that ''respect [...] for European culture has gradually
    arisen'', and that the field of comparative literature has developed commensurately
    from ''isolated workers'' to ''friendly collective labour''. By the early 20th
    century, then, it is no surprise that poet Mandel could diagnose a ''yearning
    for world culture'' as a constituent of his generation''s prosperity. For comparative
    virtues from cultural necessity: the great advantage of coming from the perceived
    marginals of international culture—an advantage that obtains to this day—is that
    it makes possible the synthesis of existing trends. Looked at this perspective,
    comparison is the privilege of posterity.


    # # Discipline and publish


    The years 1870–80 saw the emergence of comparative literature as a discipline
    not only in Russia, but also elsewhere in Europe. In Denmark, the literary critic
    Georg Brandses sought to overcome the Scandinavian cringe towards continental
    Europe by developing a comparative method that was both adapted and alienated
    foreign literature. Brandes'' image of the telescope—one end manages the readers—nearly
    captures the ambivalence of his relationship to the dominant European traditions:
    on the one hand, he admired writers of the century such as Anatole France or Friedrich
    Nietzsche, publishing profinely; on the other hand, he dreamed of establishing
    Danish literature figures as their equal. His celebration of the ''Men of the
    Modern Breakthrough''—the phrase that has come to define the Danish modernists
    of the late 19th century—can be understood in this light, as an attempt to harness
    comparative literature to the defence of minority languages. For a critic as ambitious
    as Brandes, to bring the Nordic and continental traditions was a natural aspiration;
    like many of the leading theories of comparison, however, it was not without natural
    self-interest.'
