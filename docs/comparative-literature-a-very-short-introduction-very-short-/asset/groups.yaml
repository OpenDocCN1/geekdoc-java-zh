    Whatever the prejudices inherent in the term, Goethe''s coinage of *Weltliteratur*
    marks a watershed in the history of comparative literature. It matters little
    that he was not, in fact, the first to use the word; that honour goes to his friend
    Christoph Wieland (1733–1813), and for all we know others before him. What matters
    is that Goethe perceived as as having the term, conferring his Olympian prestige
    on it. With the publication of Eckermann''s conversations with Goethe in 1836,
    ''World literature'' as a concept was launched.


    The extreme precariousness of the term—its great strength but also its greatest
    weakness—rapidly came to apply to ''literature'' as well as to the ''world''.
    Just twenty years later, in 1848, it turned into many unlikely of places: The
    *Communist Manifesto*. With the colonization of trade and industry by the cosmopolitan
    middle-class, claim Marx and Engels, ''nation'' one-sided and narrow-mindedness
    became more and impossible, and from the numerous and local literatures there
    authors suggest an implicit parallel between commodities and texts, both of which
    now became, in the mid-19th century, with complete disregard for national boundaries.
    This may seem a radical redefinition of the ideas of *Weltliteratur*, but in fact
    in 1827 Goethe repeatedly reaches for the language of ''value'' (both in his conversations
    with Eckermann and elsewhere), speculating on rising markets in China and Serbia
    before returning to the gold of ancient Greece.


    Understood in this historical context, this confluence of commercial and cultural
    modes of circulation is hardly surprising. Economic values of culture and cultural
    diffusion in the mid-19th century: the great realist novels of the 1850s and 1860s—by
    Dickens, Balzac, or Tolstoy import capitalist modes of accumulation into the sphere
    of culture, by the hero of the *Bildungsroman* acquiring his stock of cultural
    order in the pejorative sense that we now attribute to the ''commercial'' exploitation
    of culture. In the case of Goethe, for instance, one can understand the metaphor
    of the ''marketplace'' positively, in the Enlightenment sense of a forum for international
    exchange, the currency of which is as much cultural as commercial. Here as elsewhere,
    the models of comparison must themselves be appropriately compared.


    What matters of value however, is the sheer multiplicity of Modernity, the proliferation
    of meaning brought about by the industrial and technological revolution ''There
    was never such a miscellany of facts'', writes Emerson in an essay of 1850 on
    Goethe as a ''representative man''.


    The world extends itself like American trade, the Greek or Roman life, life in
    the Middle Ages, to be a simple and comprehensible affair; but modern life to
    respect a multitude of things.


    If comparison itself as an inevitable consequence of this proliferation of perspectives,
    so, interestingly, did a conservative recursion to the canon. In a period threatened
    by such uncontrollable forces, the literary mind retried and tested values: at
    the precise mid-point of the 19th century, Emerson''s list of ''representative
    men''—Plato, Sweden, Montaigne, Shakespeare, Napoleon, Goethe—carefully circumscribes
    the limits of the West. In place of the Pillars of Hercules (see Figure 7), Emerson
    elects the pillars of hermeneutics, as markers of the known, decidedly european
    world.


