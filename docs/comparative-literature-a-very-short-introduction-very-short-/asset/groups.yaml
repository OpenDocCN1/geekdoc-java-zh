    # 比较文学：极简介绍


    本·哈钦奇森 (Ben Hutchinson)


    出版社：牛津大学出版社

    ISBN-13: 9780198807278

    DOI: 10.1093/actrade/9780198807278.003.0001


    印刷出版日期：2018年3月

    在线出版日期：2018年3月


    第113页


    ## 5. 比较文学的未来


    本·哈钦奇森


    > https://doi.org/10.1093/actrade/9780198807278.003.0005 <https://doi.org/10.1093/actrade/9780198807278.003.005>


    **印刷版出版：** 2018年3月22日


    **在线出版：** 2018年3月22日


    ### 摘要


    比较文学在文学研究中既是核心的，又是边缘的：核心是因为它借鉴了人文科学的几乎每一个学科；边缘是因为它没有依托于任何单一传统，因此被所有传统所忽视。尽管比较文学面临着各种挣扎与现状，它在人文科学的未来正扮演着日益重要的核心角色。“比较文学的未来”指出，在这个专家当位的时代，通才者在塑造和支持精神生活方面发挥着至关重要的作用。国际化、跨学科的知识形式仍然是现代性的本质。现在比以往任何时候都，比较文学的审美教育都是不可或缺的。


    ## 政治教育


    1872年，27岁的年轻教授出版了他的第一本书。这在书现在可能被视为一部开创性著作，但在出版当时，尼采的《悲剧的诞生》遭遇了死一般的沉默。唯一做出回应的批评家是他的老同学乌尔里希·冯·利马维茨-梅尔多夫（Ulrich
    von Limawitz-Moellendorf）；在一次猛烈的攻击中，他将尼采过时的批评方法驳斥为“未来的语言学”（Zukunftsphilologie）。尽管这个词听起来很有吸引力，但其本意并非赞美。


    比较文学是侮辱吗？尽管面临种种挣扎和当前的辩论，比较文学在人文科学中扮演着日益日益核心的角色。在一个由全球化及其异见定义的世界里，一个由日益增强的跨学科性的学术界是不可的。选择不在于是否比较，而是比较什么以及如何比较：书籍、电影、语言、文化、历史。“未来的语言学”已成为当下的语言学”，其范围广泛扩展到了当代文化。


    在最顶尖的文学学者中，比较文学是不争议的。但它也是最焦虑的群体之一。学科现状报告——例如美国比较文学协会（ACLA）的十年报告——揭示了人们对新兴发展方向的不安。无疑，比较文学长期以来处于一种危机状态，无论关于死亡与不朽的修辞如何，其自我构想已得到承认。出生与死亡的隐喻（例如悲剧的生灭），或遗忘与重生的隐喻，几个世纪以来一直在复活比较文学，或者说通过复活过去来赋予现在以活力。近年来，作品的“后世”概念（沃尔特·本雅明变体中的
    *Fortleben*）变得越来越流行，成为捕捉创造性影响形式的一种方式：例如莎士比亚的“后世”形成了一个整个比较文学流派来捕捉自身。更广泛地说，这些隐喻指向了该学科对连续性与变化的痴迷，这种痴迷反映了其对于在人文科学中不断变化的地位的持久不安全感。通过将自己的命运与既有人物和学科联系起来，比较文学希望确保自己的生存。


    这种影子地位暗示了一个悖论性的结论：比较文学在文学研究中既是核心的，又是边缘的，或者说在某种看似悖论的情况下，恰恰是因为它是核心。它借鉴了人文科学的几乎每一个学科，在历史、政治、语言和文学的文恩图中将自己定位在中心；因为它没有依托于任何单一传统，因此面临着被所有传统忽视的风险。换句话说，比较文学的脆弱性既是它的力量，也是它的弱点。它对趋势的转变敏感，但也受制于这些趋势。例如，被理论术语敌意接管的风险是一个持续的威胁。第二轮融化无疑对任何人都没有好处。


    比这更紧迫的是比较的实践，以及它如何将我们推向理解的“文学”的边缘。它同时也走向了跨学科性。“跨艺术”研究变得更加突出：小说与电影、雕塑与人像之间的比较，越来越多地出现在课程和会议中。与此同时，“跨国”已成为一个关键领域，并发现自己处于历史和法律等邻近学科中。比较文学再次发现自己处于人文科学的人群之中。


