    - Italy from 1450 to 1600

    - Spain from 1600 to 1670

    - France from 1660 to 1750

    - England from 1720 to 1820

    - Germany from 1820 to 1870


    By the end of the nineteenth century, argues Bruniet in a manner that addressed
