    “比较文学”这个术语本身在许多方面都是一种搜索范畴。也许近年来最大的教训是，这个词组的两个部分都是暂时的。我们已经看到“比较性”一词如何随着政治和语言特征的改变而改变其重点；然而，“文学”这个名词也远非传统学术中稳定的能指。随着
