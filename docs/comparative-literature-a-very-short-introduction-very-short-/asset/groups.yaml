    # 致谢


    Ben Hutchinson


    比较文学无非一项集体努力的成果。从本质上说，它涵盖了远超个人视角的视角；书末列出的参考文献——本可以还可以增加许多项——让人意识到了这项事业在本质上具有多大的普世性。因此，首先我必须感谢过去和现在的比较文学家，如果没有他们的工作，这本导读是不可能实现的。


    除了远方的读者，本书也极大受益于其前三位对话者的深度细读：Francesca Orsini、Richie Robertson 和 Shane Weller。没有人不会不同意他们的每一个细节或论点，但他们对时间的慷慨，以及对编辑和学术层面的严谨关注，彰显了比较文学界的美德。我深表感激。


    英国比较文学协会（BCLA）的同事们在过去几年里一直是我灵感的来源，正如来自丹麦（Mads Rosendahl Thoms）、法国（Emmanuel Bouji）和德国（Marcel
    Lepper）的朋友一样。无疑，与极简导读（VSI）系列中的其他所有作者一样，我很幸运能遇到 Andrea 和 Jenny Nuge 如此毫无吝的鼓励。向她们，以及向牛津大学出版社那些提供挑战并鼓励我建议的匿名读者，表示诚挚的谢意。


    不言而喻——但必须说明的是——如果没有 Marie、Max 和 Hugo，这本书以及其他一切都是不可能的。谢谢（Merci）。


