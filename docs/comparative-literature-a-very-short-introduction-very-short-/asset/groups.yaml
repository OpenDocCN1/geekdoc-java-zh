    differences between them. Unlike their German counterparts, for instance, the
    British cultural theorists—whose tactics Hall pithily defined as ''talking culturally
    about politics and politically about culture''—were particularly interested in
    youth culture as an expression of identity and class-consciousness, as well as
    in the politics of immigrant and minority cultures as those of West Indians or
    East Asians. Perhaps the defining difference between the two approaches, however,
    was the interest that the British cultural theorists developed not only in advanced
    art, but also in everyday artefacts: newspapers, cinema, television, advertisements.
    In the postwar era of flattened hierarchies, a text could be anything designated
    as such; it is the way that we perceive the text that assigns it this status,
    not its inherent qualities. Textuality, it emerges, in the eye of the beholder.


    The implications for comparative literature were obvious. In the age of mass media,
    two basic courses were now available to the comparat: either to cling to the ''canon''
    as the only legitimate source of culture; or to embrace the brave new world of
    the textual revolution. Roland Barthes'' *Mythologies* (1957) provides an early
    exposition of the rapidly blurring lines between the two cultures.


