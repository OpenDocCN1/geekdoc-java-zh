    ## 框 2 精读


    细读（close reading）与20世纪20年代帮助建立英国文学作为一门学科的“实用性批判”以及随后20世纪40年代的美国“新批评”密切相关，它关注句法、句式结构、语义歧义，以及特定词汇的语境共鸣。比较性细读将此类技术应用于多个文化传统的作品，考察文本细节的微观分析如何开启语境意义的微观分析。


    例如，人们可以通过细读的棱镜，通过鲁珀特·布鲁克（Rupert Brooke）、奥古斯特·斯特拉姆（August Stramm）和纪尧·阿波里奈（Guillaume
    Apollinaire）的诗来审视第一次世界大战。布鲁克的十四诗《士兵》（The Soldier）将“英语”作为其核心价值——在十四行中出现了不少于六次；即使在死亡中也应该有“异国土地的角落
    / 永远属于英国”。考虑到这种情感，外国文学显得尤为重要。然而，布鲁克非常传统的十四歌结构与斯特拉姆诗歌中表现主义的“流”形成了剧烈对比。一首以此命名的诗歌以新词和扭曲的句法开头——“日子入葬
    / 世界墓地”（Tage sagen/Weliten graben*）——随后通过一系列单词行，最后以“痛苦痛苦 / 铺设 / 停滞”（Wehe Wehe/Wehen/Nichall）的节奏高潮结束。这种诗歌只能通过细读，将其视为对战壕恐怖的拟声性回应。阿波里奈的《耳朵里的棉花》（Cotton
    in Your Ears）最后更进了一步，通过排版重现了炮弹爆炸的场景，诗中的文字粉碎了页面（见图3）。简而言之，句法体现了情感——这就是细读的赌注。虽然这种方法显然也适用于单一语言的文本，但只有通过跨多种语言的比较，才能正确地实现对战争不同反应的综合感——在英国是感性的，在德国是虚无主义的，在法国是破碎的。


    ## 爆炸药即将爆炸！


    ![](img/25120aad273470726fe1ab8dbadae03d_19_0.png)


    3. 战争的破碎体验：阿波里奈的字形诗《耳朵里的棉花》（1916）。


    这种对文学的细致、哲学化的方法在19世纪和20世纪的大部分时间里或多不受争议，因为它最终源于圣经诠释的威望。起初有道；随其后是其诠释。根据定义，权威归属于作者；而批评家归属于文本。最正统的比较模型与这一权威问题紧密相连，清理出一个“原始”文本，并仅在确认了直接影响时才允许。“对于那些选择解释欧洲文学运动的人来说，没有比尽可能显式（explicit
    as possible）地研究这几个世纪以来的国际关系是什么样更紧迫的任务了”：1898年法国批评家约瑟夫·泰恩（Joseph Taine）的这一号号召体现了占据主导地位的法德哲学来源追寻模型，将其仅仅视为比较文学的唯一关注点。


    第28页


    我们离今天很遥远。理论、技术，尤其是文化的变化深刻地改变了我们的阅读方式。20世纪70年代和80年代的理论战争侵蚀了既定权威（见第4章）；即使罗兰·巴特（Roland
    Barthes）对“作者之死”的主张被夸大了，但毫无疑问，批评家通过让文本的意义取决于大师理论家，在谋求首要地位。与此同时，技术的发展使得


    第29页


    通过关键词搜索和互联网数据库比较大量文本成为可能。而且毫无疑问，战后尊畏之心的消失——那种基于阶级的、对权威不加质疑的接受——改变了我们的阅读方式。我们现在都是作者了。


    对于比较文学来说，这些变化导致了“远距离阅读”（distant reading）的出现。该术语由弗兰科·莫雷蒂（Franco Moretti）于2000年创造，最初是指描述在处理多国世界文学语料库时，依赖二手报告进行学习的不可避免性：这种方法在“不进行任何单一文本阅读”的情况下被追求，其力量“与文本的距离成正比”。很快，它演变成一个更广泛的涵盖性术语，指通过图表、地图和树状图进行的数字化、数据驱动的方法——引用莫雷蒂2005年著作的书名——通过词汇、思想和文本进行。既定的细读模型让位给进化的远距离阅读模型，该模型可以追踪例如英国、日本、意大利、西班牙和尼日利亚小说的兴起。大数据产生了大图——小说的“兴起”与“衰落”成为了素材。


    从比较文学的角度来看，莫雷蒂的模型有很多值得投入。首先，它解决了整个叙事问题；人们不再需要处理“原始”文本。在一个世界文学概念不断扩张的时代，这不是什么小优势。它还尽可能地奠定了批评家与其研究的许多文本之间的创造性距离——地理、文化、语言上的；接近不再是比较所追求的。也许最重要的是，远距离阅读使得大规模文学研究成为可能并使其合法化，而这在以前是不可能的，至少对任何单一学者来说是不可能的。


    - 从远处看，文学的兴衰和时尚重新成为焦点——人们只需考虑“比较文学”一词从1800年到2000年的兴起即可（见图4）。


    ![](img/25120aad273470726fe1ab8dbadae03d_20_0.png)


    - 4. 1800年至2000年间英语中“比较文学”的引用。


    谷歌书籍语料库在无形中完成（首先必须有人对其进行选择和分类），这种图表提供了一种生动的——更重要的是，可验证的——比较文学作为一门学科的崛起。莫雷蒂将这些研究与工具的发明相结合，人们可以理解为什么；此类图表可用于任何数量的比较组合，提供观察趋势和模式的远距离视角。即使考虑到统计偏差和扭曲，这也是值得拥有的信息。


    那么，为什么许多批评家觉得在从阶级阅读到远距离阅读的转变中丢失了什么呢？答案也许不在远距离阅读本身所代表的细节上。说远距离阅读对文本细节的关注太容易了；如果说的话，计算机搜索和数据库有助于对特定文本和习语的研究。解释统计和数据成为比较研究者日益重要的一项技能——没有理由认为，像威廉·埃默森（William
    Emerson）或莱·斯皮策（Le Spitzer）这样的创造性读者，如果他们还活着）就不会避免这种倾向。


