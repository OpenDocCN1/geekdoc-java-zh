    This is not to say that comparative literature was exclusively the province of
    White Anglo-Saxon Protestants. By the 1870s, comparative studies were beginning
    to emerge on the far eastern edge of Europe. In 1872—the same year in which George
    Smith published his version of Gilgamesh—the University of Moscow opened a Department
    of World Literature; in 1875, St Petersburg followed by the name a Neo-Philosophical
    Society. The presiding spirit behind this international initiative was a literary
    historian by the name of Aleksandr Vesovsky (1838–1906), who went on to become
    arguably the single most important figure in the development of comparative literature
    in Russia. Vesovsky pioneered the study of international patterns of literature
    as a way of understanding modes of development. Interested in particular in folklore
    and fairyt, Vesovsky used comparative methods to explore the relationship between
    East (Russia) and West (Europe). His study of the Western Influence in Russian
    Literature first appeared in 1881; by 1916 it had gone through an impressive five
    editions, indicating its wide reception.


    Vesovsky''s view of comparative literature as the study of sources and influences
    derives its importance from the historical context of late 19th-century Russia.
    For Vesovsky, as for many of his contemporaries and compatriots—the generation
    of the so-called Silver Age—Russia was a culturally backward continent that could
    only develop by looking to the West. The progress of Russian culture could be
    taught, he believed, by comparing it to that of Western Europe. Ultimately, this
    would be to Russian advantage, since the receptivity of Russian culture ensured
    that it became even richer and stronger. By incorporating international influences,
    the national culture emerged as a fuller version of itself. Here elsewhere—the
    argument re-emerges in Oswald de Andrade''s Manifesto Antropológico (1928), for
    instance, which proposes that Brazil should ''cannibalize'' in order to absorb
    its nutrients—It is worth paying a moment to reflect on what this implies. If
    comparison itself as an inevitable consequence of this proliferation of perspectives,
    so, interestingly, did a conservative recursion to the canon. In a period threatened
    by such uncontrollable forces, the literary mind retried and tested values.

