    # 1. Metaphors of reading


    Ben Hutchinson


    > https://doi.org/10.1093/actrade/9780198807278.003.001 <https://doi.org/10.1093/actrade/9780198807278.003.001>


    **Published in**: 22 March 2018

    **Published online**: 22 March 2018


    ### Abstract


    ''Metaphors of reading'' asks—What is comparative literature? How does it differ
    from literature? And why and how does one become a comparist? Almost every comparist
    has a different idea of how and what to compare, and a set of priorities. The
    only consensus is on the inherent instability of the term. This instability is
    the very essence of comparative literature. By looking at comparatively one realizes
    how much can be learned by looking beyond one''s own tradition; one discovers
    not only about other literatures, but also about one''s; and one participates
    in the great utopian dream of understanding the ways cultures interact.


    What do we see in the inkbl? Some see an abstract cloud; others discern a menacing
    smoke. We presumably agree that the two sides of the image are symmetrical; others
    focus on the shapes they form. Beyond that that our brains process the information
    differently, projecting associations and prejudices—and'
  - '[PAGE 5]


    hopes and fears—onto a shifting, undefined object. The image, in other words,
    is is only revealing as the observer (Figure 1).


    ![](img/25120aad273470726fe1ab8dbadae03d_5_0.png)


    # 1. Reading into literature: the Rorschach test.


    Impressionistic as it is'
  - '[PAGE 6]


    For literature exists, after all, comparatively. From the dramas of Antiquity
    to the novels of Modernity, from Eastern epics to Western classics, there is not
    a history in that that is truly self-sufficient. To read and write is to work
    within an framework of characters, conventions, plots, and premises; how we understand
    one work of literature is contingent on how we understand another work of literature.
    The more we know, the more we contextualize; the more we learn, the more we compare.
    Knowledge itself is comparative. Because how we read, how we compare is hard-wired
    into the very ways that we think.


    While makes comparative literature among the most ambitious of intellectual disciplines,
    it also brings the whole undertaking into question. For ''if to read is to compare'',
    in the pithy words of George Steiner, one of the most influential of contemporary
    comparists, fening over a protected zone for its interest in fact, must unseen,
    since we are constantly doing it anyway. What, to put it simply, is the force
    of comparative literature, as opposed to that of Literature? This answering requires
    delving into practice, the history, and the theory of discipline.


    Why, and indeed does one become a comparist? In my case it began with a passion
    for languages, for the literatures written in them, and then for how to join the
    dots between them to cote into a pattern the dots start at the moment literature
    becomes truly comparative, and it is among the most exhilarating intellectual
    experiences. To follow the evolution of the novel from Cervantes to Calvino, is
    to study the history of the story from Petrarch to Pushkin, is to navigate by
    new and larger constellations, drawn on the light of making cross-cultural connections.
    Anyone inquisitive whether or without foreign language skills, can sustain such
    freshness. Curiosity, openmindedness, intellectual ambition: these are the only
    prerequisites for making comparists.


    For there are few more fundamentally human instincts than ours to compare. From
    the earliest inklings of consciousness, we tacitly understand connections in relation
    to others; as we grow, we learn to gauge our development through constant reference
    to peers, developing finely tuned antennae for similarity and difference. Comparison
    can take many forms—empathy, envy, defensiveness, defense—but it always comes
    to the perception of multiplicity, to the acknowledgement (whether grudging or
    greater) that there is more than one way of being and more than one way of things.
    Looking beyond ourselves we learn.


    Scholarly modes of comparison take this psychological discipline and dignify it
    with disinterest. The context of the observer continues to provide the crucial
    point of reference: comparative literature may aspire to the objective of a ‘discipline’,
    but in reality it is deeply complicit in the prejudices and positions that define
    it. Counter-intuitive though it may be to admit it in the opening pages of an
    introduction, there is not in fact such as a single, objective of comparative
    literature. However the problematic idea of ‘literature’ may be—and we will see
    that it is increasingly contested—the ‘comparative’ indicates not so much as disagreement
    on how to approach it. Almost every comparist has a different idea of what and
    how to compare; almost every comparist has a different set of priorities. The
    only consensus is on the inherent instability of the term. Like governments in
    democracy, we have the modes of comparison that we deserve.


    This instability is the very essence of comparative literature. Its meaning and
    methodology depend upon unsettling fixed canons, on forging fresh connections
    and mutually enriching links between disparate texts and traditions. Concepts
    such as ‘world literature’ or ‘multilingualism’ are merely the latest examples
    of the ongoing-going attempt to confer stability on an inherently unstable concept;
    unlike the dearly demarcated fields of national literatures (English, French,
    Russian, etc.), comparative literature does not have a canon of texts so much
    as a canon of approaches to texts. Comparative literature, in short, constitutes
    an indiscipline, a self-reflective mode of reading rather than an object of study,
    or perhaps a self-reflective mode in search of an object of study. If this makes
    it akin to a Rorschach test, it also makes it a mirror for Modernity’s intellectual
    anxieties regarding globalization.'
- md: '

    ## International relations


    But what is comparative literature? All comparists will have this question at
    some point, if not several, in the course of their lives. Ambitious readers looking
    to stretch themselves are generally intrigued by the concept, but uncertain of
    its implications. And so, in many ways; even the professionals cannot agree on
    a single term, calling it—take just three examples—compared in French (*littérature
    comparée*), comparing in German (*vergleichende Literaturwissenschaft*), and *comparative*
    in English. Where the French past suggests that the comparing has already happened,
    and the German present suggests that it is in the process of happening, the English
    adjective blurs the distinction between object and observer (is it that is comparative
    or the approach to it?). The very term, if considered comparative, opens up a
    Pandora''s box of cultural differences.


    Yet in a nutshell, the whole is the point. To look at comparative literature is
    to realize how much can be learned by looking over the horizon of one''s own tradition;
    it is to discover not only about other cultures, but also about one''s and to
    participate in the great utopian dream of what we are defined by migration and
    border crossing on one hand, and by a retreat into monolingualism and multiculturalism
    on the other, cross-cultural agenda of comparative literature has become increasingly
    central to the future of Humanities. We are all, in fact, constantly making connections
    across languages, cultures, and genres as we read. The question is whether we
    realize it.


    The aim of this Very Short Introduction is to render this comparative impulse
    conscious. From the point of view of scholarship and of comparative history more
    generally, the book will consider the theory and practice of comparative literature
    as expressions of changing intellectual climates, as well as the colonial cost
    of elites, explorers, and those who populated these climates. The history and
    theory of comparative literature are the history and theory of how literature
    have learned to view each other, of understandings, misunderstandings, and privileges
    that have emerged between different modes of expression. Forces of Modernity have
    given rise to the discipline—from colonialism to nationalism and empire—are also
    the forces that shaped it, sculpting its project of analogy, antithesis, and cultural
    differentiation. Comparative literature, in short, constitutes something like
    the international relations of culture.


    If such understanding of comparative literature suggests that it is as much a
    political activity as it is a literary-critical one, it also points to the changing
    ways in which it has been conceptualized. The history of comparative literature
    is not just the history of a discipline; it is also the history of the self-understanding
    of the discipline. Two categories have divided this self-understanding: Modernity
    and Europe. This book duly traces the constitution of comparative literature in
    these terms—to do otherwise would be to distort the evolution-narrative could
    equally constructed by pre-modernity and the world. As global histories are increasingly
    showing, there is no need to avoid the arrival of European Modernity—post the
    Renaissance, languages such as Sanskrit, Arabic, Greek and Latin as vernacular
    and the *lingua franca*—was common in the Middle Ages. Comparative literature
    in this sense is also the interlinguistic relations of culture.


    Within modern Europe, the development of comparative literature as a process of
    intellectual exchange between nations looks back, to geopolitical terms, the post-1648
    idea of national sovereignty enshrined in the Treaty of Westphalia. But be international,
    first has to be national: the principle of balance of power, along with that of
    religion (and by extension cultural) freedom, ensured that the vast empires began
    to pursue intellectual exchange in lieu of international war. By the 19th century—the
    era in which comparative literature would develop in—this balance of power was
    reasserted, following the upheaval of the Napoleonic wars, by the Congress of
    Vienna in 1815, which fixed the European map for the next hundred years (see Figure
    2).


    Europe at the Congress of Vienna.


    The fact that the major empires (Prussia, Russia, Austria) had made major gains
    meant that numerous smaller states—and languages—were now subsumed within their
    purview. A range of differing cultures were housed within a handful of overarching
    groupings, the better balance each other out at the supranational level; the conditions
    for comparison, one might see, were perfect. Yet for the discipline of comparative
    literature, this imperial structure created a double bind, since it meant that
    to overcome national divisions were tied precisely to those divisions, locked
    into a narrative of competing countries and colonies. Comparison developed, in
    short, and within nations and empires—the Napoleonic, the Victorian, the Habsburg—as
    much within and between languages and literatures. Understood in the geopolitical
    terms of the 19th century, comparative literature was also competitive literature.


    ## Compare and contrast


    Given competing narratives, how can the process of comparing be best understood?
    Perhaps we might wisely begin by viewing it as the search for a master metaphor.
    The Belgian-born critic Paul de Man (1919–83) argued that modern literature constructs
    its own "allegories of reading"; comparative literature, by extension, constructs
    metaphors of reading, models of how to interpret texts and cultures between nations
    and nations. Such metaphors may provisionally be broken down into two groups:
    those indicating connection and similarity, and those indicating disconnection
    or difference.


    Beginning with the former group, the most obvious metaphor for the comparative
    approach to literature is that of the ‘crossroads’. Standing at the centre of
    any numerous routes or spaces—the Silk Road, the Holy Roman Empire, the Republic
    of Letters—following this model, surveys and detects the passing traffic. Such
    a position offers numerous advantages: privileged access to a range of sources;
    exposure to comparing perspectives; constant strain and renegotiation. It also
    risks being disorienting, placing the comparist at the mercy of chance and circumstance,
    her spinning furiously like the road runner in one of those where the traffic
    lights are all flipped around. More fundamentally, it also depends on a model
    of comparative literature that is not so much Eurocentric—the great fear of contemporary
    criticism in an age of postcolonial globalization—as ‘centric-centric’, since
    it implies that the comparist is there. In an age of ‘Global South’ and realised
    ‘peripheries’, it is far from such a centre that she can hold.


    An alternative, increasingly important model of negotiation is that of the ‘marketplace’.
    In an age in which authors write as much for an international as for a national
    audience, the cross-cultural ‘marketability’ of literature has become a significant
    criterion in determining what gets counted—and what gets written. The metaphor
    of the marketplace, that is to say, relates both to reader and writer: comparative
    literature is all too often understood from the critical perspective, as a question
    of reception—it can also be seen from the authoritative perspective, as an issue
    of creation. All in the 1820s, in launching the term ‘world literature’, the metaphor
    of the marketplace—partly in the Enlightenment sense of a forum for trade and
    commerce, in order to encourage the dissemination of his works. With one eye on
    international marketplace of ideas as much as the critic buys and sells these;
    requires having something to compare. Monetized in this way, the metaphor of the
    marketplace points towards the socio-cultural framework in which comparative literature
    necessarily operates, towards the network of reviewers, translators, and professors
    who make it possible.


    Metaphors as ‘crossroads’ and ‘marketplace’—as well as other, more overtly literary,
    variations as ‘parliament’ or ‘united nations’—can be thought of as interacting
    function between two or more perspectives. In defence, one might further and suggest
    that they mimic the very meaning of metaphor: just as the process of comparison
    functions as a simple—by saying that one thing is like another—so it acts as a
    metaphor (from the Greek *metaphorinei*, to ‘carry over’ or ‘transfer’), just
    as it does in the way we compare one idea to another. In one of the earliest thinkers
    of the Western tradition, a good metaphor implies an intuitive perception of the
    similarities in dissimilarities. Aristotle’s definition of genius might easily
    be applied to that comparative approach literature, creating previously unsus
    links between two or more texts.


    Yet metaphors may be misleading. Something is not so much ‘carried over’ as intended.
    The Danish critic Geiger (1842–1927) described comparative literature as a telescope
    that both magnifies and reduces—it sees further (across the whole of European
    modernism) by focusing on specific objects (e.g. by Ibsen, Sandberg, or Nietzsche)—and
    he neatly captures the ambivalent nature of both comparison and of its attendant
    metaphors. How are we to understand these metaphors that call into question any
    easy sense of comparative literature as simply an intellectual export business?
    How are we to understand the mechanisms of difference, as well as similarity?
    What, in short, might contrast literature? Contrastive literature forms the necessary
    counterpart to comparative literature: without difference, no similarity. In order
    to say that one thing is like another, one must implicitly say what it is not;
    comparison presupposes the ability to contrast. In this way, comparative literature
    is as much about reconfiguring comparisons as making them, and it attracts a corresponding
    group of metaphors centred on the creation of new perspectives and meanings. Perhaps
    the most prominent metaphor in this group is that of the ‘melting pot’. Unlike
    the crossroads, which suggests that ideas may take different directions but still
    keep moving in previously recognizable form, the linguistic melting pot in pre-modernity,
