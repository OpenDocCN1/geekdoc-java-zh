    一份《法语世界文学》（2007年）由来自加拿大、突尼斯的、塞内加尔、刚果和法国的顶级作家共同签署，宣布了法语文学的终结以及“世界文学”（littérature-monde）作为一场“哥白尼革命”的诞生。基于此类形而上学的宣告，很难看出这些隐喻还有何去处。


    这种通胀逻辑正是为什么近年来最具影响力的模型不再将世界文学视为稳定的经典作品规范，而是视为一种“创作与阅读的模式”。从《吉尔伽美什》到后现代主义，达姆罗斯奇（Damrosch）的《什么是世界文学？》（2003）追溯了文学本身的创作、翻译和生产过程。对于达姆罗斯奇来说，赋予“世界”地位的行为，是那些将流通过程构建到自身反思结构中的行为。对于达姆罗斯奇来说，从语言和文化原点出发走向更广阔的世界：“首先”，是通过作为文学被阅读；其次，是通过语言和文化原点流向到更广阔的世界。如果全球思想史告诉我们，一个思想的普遍性可以取决于它在遥远语境中的被采纳程度，那么全球史也有类似的衡量标准。事实上，一部作品的进入或退出世界文学，取决于它在某一时期如何被阅读；用赛德（Said）的话说，最具有“世界性”的作品是那些在翻译中收获最多的作品。从这个意义上说，比较文学与其说是一种规范，不如说是一种货币。


    商业语言将我们带回了特歌最初的“世界文学”概念，以及过去十年中出现的对该术语的主要批判。在1827年，特歌将世界文学描述为“所有国家提供其产品的市场”，他认为这部分最诚实的想法是将其作为一种鼓励其作品获得国际认可的方式。换句话说，世界文学既是一个资本主义概念，既关乎收集书籍，也关乎获取书籍。对该术语讨论最广泛的批判性参与——艾米莉·阿普（Emily
    Ap³）的《反对世界文学的征用后记》（2013）——便以此为起点。该书认为，普遍化的比较模型忽视了法国哲学家布朗肖（Blanchot）所说的“不可译性”的问题（例如，正如卡辛（Cassin）在004年的《不可译性词典》中所示，包括
    *Heimat*（故乡）和 *praxis*（实践）等术语）。这些抵抗翻译的术语揭示了国际标准化的种族主义逻辑；跨越边界以创造伟大的比较，恰恰是我们没有做的。人们可以接触所有语言，这意味着外语文本不仅被翻译成某门语言，还被翻译成主要市场熟悉的方言——伴随着所有可能的误解和同质化风险。在这里和其他地方一样，翻译仍然是比较文学中不为人知的肮脏秘密。


    ## 翻译研究


    翻译问题是比较文学的核心。毕竟，即使是最有天赋的语言学家，他们能阅读的语言数量也是有限的；俗话说，通通语言的理论家罗曼·雅各布森（Roman Jakobson）会十七种语言，但全都是俄语的。然而，无论我们如何强调要读原著，对于比较研究者来说，翻译都是一种必不可的恶。然而，它当然也是一种向善的力量，开启了关于各国文学之间关系的广泛实务和概念考量。改编奥斯卡·王尔德（Oscar
    Wilde）是最诚实的形式，但也是最接近的阅读形式。至于比较文学，它既作为对我们所读之物的批判。


    翻译研究在20世纪70年代兴起。虽然翻译问题同样存在于西塞罗（Cicero）、霍拉斯（Horace）、圣杰罗姆和路德（Luther）时代，但在文学研究领域很少受到关注。比较文学的理论的、语言的转向让作品如何跨越语言的问题无人问津；在语言学领域之外，讨论几乎没有跳出“翻译只是对原著的劣质模仿”这一观点。从20世纪70年代中期开始，乔治·斯坦泰纳（George
    Steiner）和伊塔马尔·埃文-齐索哈尔（Itamar Even-Zohar）等学者开始向内提出切中要害的问题。关于翻译的状态和前提，为什么某些文化翻译得更多？为什么某些文本更容易被“翻译”？这告诉了我们什么？翻译的地位在几个世纪以来发生了怎样的变化？在翻译中丢失了什么——同样重要的是，又发现了什么？作为对这些问题的初步答案，翻译的出现并不是一个透明的窗户，而是一个特定的文化特定的过程。


    该学科一个显见的起点是对翻译最常见的隐喻的尊重，以及它们随时间变化的方式。也许在这种背景下，持久的隐喻是其源文本的忠实度/完整性。翻译传统要么取决于对源文本有多“忠实”，要么取决于有多“自由”。前者反演变为两种主要的翻译模型，即“本土化”（domestication）和“异质化”（foreignization）。前者认为源文本应该尽可能流畅地翻译成目标语言，就像是在该语言中写过的一样（如霍拉斯对希腊语的处理）；后者则认为译者的角色是通过尽可能再现原文本的句法和意义，使其自己的语言变得“异质”（如荷尔德对希腊语的处理）。存在三种方式——最具影响力的是1923年的波德莱尔（Baudelaire）评论，认为翻译可以触及隐藏在原文本行间的原始文本——但翻译的历史和翻译理论，本质上构成了这两个极端之间持续的震荡。这不仅是因为它们是文化特定的，取决于对地位变化的看法，以及最重要的——翻译人物。


    | 框 9 | 《译后》 |


    乔治·斯坦泰纳在1975年出版的《译后》（*After Babel*）将“语言与翻译的方面”置于文学研究的核心。斯坦泰纳学识渊博、精通多语，并在捍卫高级文化时坚定不妥协，许多人认为他是上世纪中期欧洲比较文学家奥尔巴赫（Auerbach）和施皮策（Spitzer）的自然继承者。他超越了他们，认为所有表现形式都可以被视为翻译的过程——即使是同语言内部——因为语言的使用在不断变化。从莎士比亚独白到现代诗，从神圣文本到世俗文本，斯坦泰纳认为翻译既是对意义交流的行动，也是对其的反思。在相似性和差异这对双子的驱动下，翻译的机制就是比较的机制。《译后》结合了语言学、文学、哲学和思想史，是斯坦泰纳比较文学最具影响力的贡献。


    在1993年的比较文学导论中，苏珊·伯内特（Susan Barnett）认为关注翻译将从更真正的全球视角重新校准这一学科，远离传统的主要的与次要文学的区分，转向更平等的强调国际互动。她的主要依据是伊塔马尔·埃文-齐索哈尔的'
