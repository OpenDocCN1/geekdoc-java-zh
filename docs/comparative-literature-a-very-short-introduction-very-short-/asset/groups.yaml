    classics provides one of the most enduring models of comparative literature across
    the centuries, and can stand for the prominence of reception studies more generally.


    Despite its fashionable status in the Anglophone world, classical reception studies
    are as old as Antiquity. Might literature amounts to an extended study of the
    classics; as Horace in his Epistles, ''When Greece conquered his fierce victor
