    ## Cultural studies


    As literature was beginning to take hold in Paris in the 1950s and 1960s, on other
    hand the Channel of a different kind of intellectual movement was developing.
    With the increasingly mixed, postcolonial society of the postwar era came an broadly,
    postmodern sense of culture. Previously taken to indicate the elite achievements
