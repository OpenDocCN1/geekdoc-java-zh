    # 后殖民主义


    这种基调在后殖民理论的背景下比任何地方都显得明显。后殖民主义可能是过去几年出现的最影响力的理论，它发展于二战后主要欧洲帝国的解体之后。在亚洲的英国人和位于非洲的法国人提供了两个最明显的例子，即这些撤退的强国留下了充满争议的法律遗产，而在世界其他地区——在拉丁美洲、加勒比地区——这种影响被感知并引发了斗争。对于许多前殖民地来说，独立仅仅是一个开始。


    后殖民主义对比较文学的影响是复杂且充满争议的，但正如政治中的文化一样，其所涉及的核心问题是权力。谁控制着文化的生产和解释？谁决定了主导的表达模式？后殖民主义的经典问题是自主性，是在道德、文化以及政治意义上的自主。从政治上说，一个国家可以在一夜之间获得独立；从知识上说，这可能需要几代人的时间。帝国强权的撤离留下了当地记忆与殖民记忆的不安混合，是反抗与顺从的混合——当然，由于必须使用帝国语言进行写作这一简单事实，使得这种情况变得更加复杂。坦诚地说，有些印度作家用英语或法语写作（他们仍然这样做，而不愿使用自己的母语进行写作，这是一个令人尴尬的真相，复杂化了英语文学和法语文学的衡量标准）。正如一位“殖民地”作家所断言，媒介不可避免地干扰了信息，强加了并不总是适用于传达当地经验的思维和表达模式。结果是一个幻影物，在灵魂上既不是本土的，也不是外来的。


    从比较文学的角度来看，存在着一个无休止斗争的幻影物。后殖民文化的“中间性”，它那地方性的、政治化的本质，是本土与外国影响的混合，是局部语境与普遍共鸣之间不断变化的结合：这一切正是比较的精髓。与更广泛的文学理论一样，应用的后殖民主义本质上是比较性的，这解释了为什么它会发展成为这一现代学科中强大的武器——并成为一种，用历史学家迪佩什·查克拉巴蒂（Dipesh
    Chakrabarty）的话来说，的“地方化欧洲”的方法。并不意外，它许多广为人知的概念都反映了这一点，体现了人们可能会所说的后殖民主义那种“始终处于比较之中”的本质。


    文化研究无疑意义重大：它结合了美学和社会学，以及对紧迫当代问题的关注，代表了一项真正的比较性事业，在它对混合媒体和崩塌等级的趣味科学中，它是先锋意义上的跨学科研究。它也给批评家施加了责任，批评家不仅要分析现有的文本——无论是文字的如文学，还是视觉的如肤色——还要识别并将其政治化。借用马克思的话：文学评论家解释了世界；而对于文化批评家来说，权力在于看穿它。


    后殖民批评家不再受限于一套已经建立的经典著作，可以自由地比较任何吸引她注意的事物；正是分析和比较的行为本身，将具有“文本”地位的人造划分开来。广告中呈现的微妙感和复杂程度与诗歌是平等的，或者与此无关；是批评家将注意力引向了它。文化研究的出现同时也提高并降低了比较文学的门槛：降低是因为现在一切事物都成为比较的对象，而不仅仅是“文学”文本；提高是因为选择进行比较不可避免地意味着一种政治立场。在这里，比较不仅是一项意识形态事业，也是一项审美事业。


    20世纪60年代席卷非洲的独立浪潮——1960年，十七个撒哈拉以南国家从法国、英国和比利时手中收回了主权——是战后新世界秩序可能的。然而，从意识形态上说，反殖民情绪的土壤在战前就已经建立，而且现在比在帝国首都巴黎还要有力。20世纪30初，在法国精英阶的核心，三个来自殖民地的黑人学生——来自马提尼克的艾梅·塞萨（Aimé
    César）、来自法属圭亚的莱昂·贡兰·达马斯（Léon-Gontran Damas）和奥奥德·辛戈尔（Leopold Senghor）创造了“黑色主义”（nèritude）概念。作为一种挑衅，作为一种将他们所谓的“低等”种族地位转化为力量的方式，这是一个神来之笔。作为殖民主义向后殖民主义过渡的定义概念，这三个创始人的职业生涯代表了他们的国家：塞萨和达马斯在法国议会代表他们的国家；塞内加尔成为了塞内加尔的创始总统。他们从未如此成功地掌握权力。


    在美学追求上，黑色主义代表了对非洲价值观的认可，反对受压迫的欧洲价值观。问题在于，在一个控制的时代，本土与帝国美学不可避免地纠缠在一起，这说起来做起来难。塞萨和辛戈尔等理论家努力建立他们认为的具有分析性的非洲艺术——与20世纪初欧洲艺术中那种时尚的模仿相对——但他们采取这种方式，既受到了欧洲思想的影响，也受到了非洲思想的影响。尼采的头脑，在《悲剧的诞生》（1872年）中被详尽阐述，存在于“尼俄俄斯式”与“阿波罗式”之间——艺术是原始的、宁静和冷静的——仅仅举一个例子，它是重要的：非洲艺术将形成阿波罗式欧洲的起源、尼俄俄斯式的对应物。然而在实践中，他们完全理解了，这种影响美学的……的。


    除了非洲之外，另一个发展出后殖民文学模型的大洲是亚洲。如果将这种持续简化为少数概念不可避免地具有误导性——毕竟，印度有二十二种官方语言——从后现代理论中出现的单一有影响力的概念批判了这种还原主义。爱德华·萨德（Edward
    Said）于1978年出版的《东方主义》（见框8）展示了欧洲文学如何将少数陈词滥调强加于——成为所谓的——“东方”之上。东方作为西方的形象出现：异国风情的、女性化的、顺从的。它只存在于观察者的脑海中，观察者基于传说和神话的所谓知识赋予了对它的权力。它是“他者”的化身。


    | 框8 | 东方主义 |


    欧洲罗马化了亚洲，但对于爱德华·萨德的批评者来说，要看到西方对东方的观念甚至渗透到了文学的风格和哲学假设中。萨德在书的开头声称，沙托布朗和内尔瓦尔等作家的笔下的东方，本质上是欧洲的发明；对（中东）文化的幻想也许是无可争辩的，但这种幻想仍然是基督教文化作为观察者的异国风情。以米歇尔·福柯的方式，萨德在东方幻想中发现了知识即权力的断言。通过声称拥有东方的知识，欧洲人隐含地主张对它的权力；通过将其同质化，他们否定了其自主性。作为比较文学的问题，《东方主义》批判了建立在权力不平衡之上的比较思想。


    萨德的开创性方法很快被应用到东方之外的所有殖民互动领域。它并不是没有批评者（特别是考虑到萨德将“东方主义”这一先前的描述性词变为贬义词的方式）；有些人认为他的“东方主义”概念是单一化且自相矛盾的，另一些人则批评他对西方文本的解读不且不准确。尽管如此，这一概念产生了巨大的影响，它既被向后延伸——如斯里尼瓦萨·拉马瓦达丹（Srinivasa
