    ## 5. The futures of comparative literature


    Ben Hutchinson


    > https://doi.org/10.1093/actrade/9780198807278.003.0005 <https://doi.org/10.1093/actrade/9780198807278.003.005>


    **Published in print:** Mar 22 2018


    **Published online:** Mar 22 2018


    ### Abstract


    Comparative literature is both central and marginal to literary studies: central
    because it draws on almost every discipline in the Humanities; marginal because
    it is not tied to any single tradition, being ignored by all of them. For all
    its struggles and presents, comparative literature has an increasingly central
    role to play in the Humanities future. ‘The futures of comparative literature’
    explains that in this age of specialists, generalists continue to play a vital
    role in shaping and supporting the life of the mind. International, interdisciplinary
    forms of knowledge remain the very essence of modernity. Now more than ever, the
    aesthetic education of comparative literature is indispensable.


    ## Political education


    In 1872, at the age of 27, a young professor published his first book. It may
    now be viewed as a seminal work, but at the time of its publication Nietzsche''s
    *The Birth of Tragedy* was met with deafening silence. The only critic who responded
    was his old school friend Ulrich von Limawitz-Moellendorf; in a violent attack,
    he dismissed Nietzsche''s anachronistic approach to criticism as "philology of
    the future" (Zukunftsphilologie). However seductive the term, it was not intended
    as a compliment.


    Comparative literature the insult? For all its struggles and present debates,
    comparative literature has an increasingly central role to play in the Humanities.
    In a world defined by globalization and its dissents, an academy defined by ever-greater
    interdisciplinarity is inescapable. The choice is not whether to compare, but
    what and how to compare: books, films, languages, cultures, histories. The philology
    of the future has become the philology of the present, ranging more widely across
    contemporary culture.


    Comparative literature is undisputed among the most scholars of literature. It
    is, also, among the most anxious. State-of-the-discipline reports—such as the
    tenennial by the American Comparative Literature Association (ACLA)—reveal a sense
    of uneasy about the emerging direction of travel. To be sure, comparative literature
    has long existed in a state of crisis, and of its self-conception has been acknowledged
    however the rhetoric of mortality and immortality. Metaphors of birth and death
    (of tragedy, for instance), or oblivion and rebirth, have resurrected comparative
    literature for centuries, or as it is by resuscating the past and revitalizing
    the present. In recent years, the notion of the ''afterlife'' of a work (*Fortleben*
    in Walter Benjamin''s variation of it) has become increasingly popular as a way
    of capturing creative forms of influence: Shakespeare''s afterlives, for instance,
    a whole school of comparative literature to capture themselves. More broadly,
    such metaphors point to the discipline''s obsession with continuity and change,
    an obsession that reflects its own enduring insecurities regarding its changing
    status within the Humanities. By tying its fate to that of established figures
    and disciplines, comparative literature hopes to ensure its survival.


    This shadow status suggests a paradoxical conclusion: that comparative literature
    is both central and marginal to literature studies, or in what is only seemingly
    a paradox, precisely because it is central. It draws on almost every discipline
    in the Humanities, canonically positioning itself in the middle of the Venn diagram
    of history, politics, languages, and literature; because it is not tied to any
    single tradition, and thus risks being ignored by all of them. The vulnerability
    of comparative literature, in other words, is both its strength and its weakness.
    Sensitive as it is to shifting trends, it is also at the mercy of such trends.
    The risk of a hostile takeover by theoretical jargon, for instance, is a constant
    threat. A second round of the thaw would surely be in no one''s interest.


    More pressing than this is the practice of comparison, and what it pushes us to
    the edges of what we understand as ''literature''. One of also towards interdisciplinarity.
    ''Inter-art'' studies have become more prominent: comparison between fiction and
    films, sculptures and figures, figure increasingly on curricula and conferences.
    ''Transnational'', meanwhile, has emerged as a key field finding itself in neighbouring
    disciplines such as history and law. Comparative literature, once again finds
    itself in the crowds of humanities.


    What do disciplines tell us about the future of the discipline? All by, they suggest
    that both the method of comparison and the object of literature are becoming ever
    broader in their definitions. There are dangers, and opportunities, in such expansionism.
    Comparing media and forms of art can be an extremely fruitful way of opening up
    new perspectives—poetry and painting, for instance, or Liszt and literature—but
    it is not always clear that the particularities of the respective arts are maintained.
    What is the good of the Arts if they are interchangeable?, Margaret Sch sister
    Helen''s attempt to translate music into painting in E.M. Foster''s *End* (1910),
