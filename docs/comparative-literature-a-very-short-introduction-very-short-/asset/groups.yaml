    相似性，而且由于我们对文本的预期是由同类型的先前文本预先决定的。文学的批判性和商业性构建都不断将自己定位在此类现有的区别中，根据具体情况顺从或对抗这些区别。说一本书“像”另一本书，是基于体裁范畴进行的一种比较。


    在某一体裁内工作，意味着与一整套先例、偏见和假设打交道；一个人如果不了解其惯例就无法创作文本——尤其是当意图是打破这些惯例时。根据接受理论理论家汉斯·姚斯（Hans
    Jauss）的观点，我们在“期待视野”内这样做，如果没有它，与文学进行有意义的互动几乎是不可能的。


    对于比较研究者来说，由于其广阔的视野，这产生了一个有趣的困境。像斯坦纳（Steiner）在他早期的著作之一（1961年）中宣布“悲剧的死亡”，需要极其广泛的参考范围——但同时也要求这种范围与其体裁基础进行对比（在这种情况下，主要源自古希腊）。只有当故事之间在风格或主题上具有相似性时，比较才是可能的，正如威廉·琼斯爵（Sir
    William Jones, 1746-1904）作为首批将“抒情”视为通用范畴的人之一，可以通过将欧洲标准强加于波斯诗做到这一点（他将阿拉伯语翻译成拉丁语）。


    换句话说，体裁在不同的时代和地点意味着不同的；通过体裁或模式的棱镜进行比较文学研究等同于一种平衡行为，在受到事实边界限制的同时扩张期待视野。一个给定的文学体裁（如喜剧或悲剧）可能包含任何数量的不同风格（如高雅或低俗，或粗俗），对这些风格的比较反过来会对社会和文化地位产生主题性的见解。


    更广义地说，努力被用作限制或聚焦某一领域的方法，这些方式可能寻求相似性。这非常特别，因为它们有特定的形式和情感关联；第一种是斯堪的纳维亚的Stringberg，第二种是狂飙运动（Sturm
    und Drang）。比较文学所需要的正如它所否定的那样。


    同时，风格惯例可以增强也可以阻碍比较。此类惯例可能运作于时期（浪漫主义抒情诗、小说）层面或修辞层面（自由间接语的反复出现）——但它更多指的是写作方式，而非文本本身；因此，它们提供了一个基于美学而非政治基础的比较文学模型。


    ## 作家 vs 读者


    但最终，谁是最好的比较家呢？比较文学在很大程度上发展成为文学批评家的领地；作为一种实践，它同样也是作者的特权。比较不仅发生在事件之后，发生在读者的脑海中，也发生在文本创作的过程中，发生在作家的脑海中。比较文学既是创作性的实践，也是文学性的：作家们往往会预判并邀请对他们的作品进行比较——这并不是说风格选择不能具有意识形态的——但为了让比较不仅仅是这样，并产生一个大于部分之和的论点——它需要一种有机的而非人为的关系来理解为什么某人要写某东西，首先要理解他是如何写的。


    艾略特的《荒原》（1922年）构成了一个明显的例子——即读者被迫采取一种宽广的、多语言的视角。通过对他们的前提进行比较研究：例如，孟斯鸠的《波斯情信》（1721年）和歌德的《东方情调集》（1819年），采取了有意识的“亚洲”视角，以对当代欧洲产生批判（即使是这两个例子也必须进行比较和对比，因为孟斯鸠是使用波斯语按照其自身的来翻译伊斯兰文化）。


    如果文学本质上是比较性的，因为它作为一个压缩器，融合了具有冲突性质的过去、现在和未来，以及往往是冲突的文化视角。当然，它并不总是以同样的程度做到这一点，某些风格和时代比其他的更具比较性。例如，我们引用艾略特和庞德作为现代主义的例子——作为全球现代主义日益增长的不安——无疑在英美世界，现代主义风格是突出战后多年国际主义的一种方式。被战壕破坏而精疲力竭的欧洲大脑向外寻求灵感：对艾略特来说是印度，对庞德来说是中国。他们的诗歌及其随后的声誉和影响，如果没有这种跨文化的中介是不可想象的。


    然而，这种技术很少被处理。例如，第一部现代小说俏皮地强调了（或伪装了）《堂吉诃德》（1605–15）。塞万提斯声称，它是由历史学家西德·本内格利（Cide
    Benengeli，见5）从一个阿拉伯版本翻译而来的。当然，并没有这个人——这个名字的意思类似于“哈米德爵士”——但塞万提斯利用他将小说插入到关于西班牙三种“文化”的当代讨论中。犹太人在1492年被排除，摩尔人随后于1609年——也就是说在《堂吉诃德》两卷之间的年份——留下了基督徒和从犹太教和伊斯兰教被迫皈依的“新”基督徒。塞万提斯的手法使人们关注黄金时代西班牙多元、跨宗教的传统，将他的小说与国家法令对立起来。


    通过这种理解，“做”比较文学具有了新的意义。在最基本的意义上，它简单意味着写作，将自己置于一个现有的参考和关系框架之中。这是因为许多读者也是批评家；例如艾略特，以及——正如埃兹拉·庞德所说，“所有时代都是同时的——这在文学上尤其如此”——没有诗人具有完整的意义——你必须为了对比和比较而设定他，并在创作过程中，比较在赋予意义方面起着主要作用，因为新词和新思想源于旧词。


    对这类内容的经典研究是奥尔巴赫的《模仿》（Mimesis），它跨越古典、中世纪和现代文学，奥尔巴赫揭示了风格在欧洲写作发展过程中是如何变化的（第三章）。相似性，而且由于我们对文本的预期是由同类型的先前文本预先决定的。文学的批判性和商业性构建都不断将自己定位在此类现有的区别中，根据具体情况顺从或对抗这些区别。说一本书“像”另一本书，是基于体裁范畴进行的一种比较。

