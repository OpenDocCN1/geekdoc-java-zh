    # International relations


    But what is comparative literature? All comparists will have this question at
    some point, if not several, in the course of their lives. Ambitious readers looking
    to stretch themselves are generally intrigued by the concept, but uncertain of
    its implications. And so, in many ways; even the professionals cannot agree on
    a single term, calling it—take just three examples—compared in French (*littérature
    comparée*), comparing in German (*vergleichende Literaturwissenschaft*), and *comparative
    in English*. Where the French past suggests that the comparing has already happened,
    and the German present suggests that it is in the process of happening, the English
    adjective blurs the distinction between object and observer (is it that is comparative
    or the approach to it?). The very term, if considered comparative, opens up a
    Pandora''s box of cultural differences.


    Yet in a nutshell, the whole is point. To look at comparative literature is to
    realize how much can be learned by looking over the horizon of one''s own tradition;
    it is to discover not only about other cultures, but also about one''s and to
    participate in the great utopian dream of what we are defined by migration and
    border crossing on one hand, and by a retreat into monolingualism and multiculturalism
    on the other, cross-cultural agenda of comparative literature has become increasingly
    central to the future of Humanities. We are all, in fact, constantly making connections
    across languages, cultures, and genres as we read. The question is whether we
    realize it.


    The aim of this Very Short Introduction is to render this comparative impulse
    conscious. From the point of view of scholarship and of comparative history more
    generally, the book will consider the theory and practice of comparative literature
    as expressions of changing intellectual climates, as well as the colonial cost
    of elites, explorers, and those who populated these climates. The history and
    theory of comparative literature are the history and theory of how literature
    have learned to view each other, of understandings, misunderstandings, and privileges
    that have emerged between different modes of expression. Forces of Modernity have
    given rise to the discipline—from colonialism to nationalism and empire—are also
    the forces that shaped it, sculpting its project of analogy, antithesis, and cultural
    differentiation. Comparative literature, in short, constitutes something like
    the international relations of culture.


    If such understanding of comparative literature suggests that it is as much a
    political activity as it is a literary-critical one, it also points to the changing
    ways in which it has been conceptualized. The history of comparative literature
    is not just the history of a discipline; it is also the history of the self-understanding
    of the discipline. Two categories have divided this self-understanding: Modernity
    and Europe. This book duly traces the constitution of comparative literature in
    these terms—to do otherwise would be to distort the evolution-narrative could
    equally constructed by pre-modernity and the world. As global histories are increasingly
    showing, there is no need to avoid the arrival of European Modernity—post the
    Renaissance, languages such as Sanskrit, Arabic, Greek and Latin as vernacular
    and the *lingua franca*—was common in the Middle Ages. Comparative literature
    in this sense is also the interlinguistic relations of culture.


    Within modern Europe, the development of comparative literature as a process of
    intellectual exchange between nations looks back, to geopolitical terms, the post-1648
    idea of national sovereignty enshrined in the Treaty of Westphalia. But be international,
    first has to be national: the principle of balance of power, along with that of
    religion (and by extension cultural) freedom, ensured that the vast empires began
    to pursue intellectual exchange in lieu of international war. By the 19th century—the
    era in which comparative literature would develop in—this balance of power was
    reasserted, following the upheaval of the Napoleonic wars, by the Congress of
    Vienna in 1815, which fixed the European map for the next hundred years (see Figure
    2).'
