    使得文学世界可以被视为“同时被实现又被毁灭”。奥尔巴赫（Auerbach）自身的流亡经历在他对他性的描述中引起共鸣，参考斯皮策泽（Spitzer）的哲学圈——即“比较文学圈”，他可能会认为：批评家最宝贵的资产是其自身的文化——只有当他远离这种文化时，才能对其产生真正的洞察。到第二次世界大战结束时，这种同样的逻辑似乎也适用于欧洲。


    ## “比较文学”走向全球


    在斯皮策泽和奥尔巴赫等先驱人物的脚步下，比较文学学科在20世纪50年代作为一种跨大西洋艺术开始加速发展。如果说希特勒通过将犹太科学家赶出欧洲来帮助美国开发原子弹，那么他自己则是通过文学批评来维持生存。欧洲移民将他们的专业带到了东方，他们的影响延续到了下一代领军科学家，如乔治·斯坦泰纳（George
    Steiner）或扬·斯塔罗宾斯基（Jan Starobinski），他们至少部分接受过美国培训的欧洲人。比较文学已经超越了它的大陆起源。


    在美国，对被称为“比较文学”的发展最具影响力的人或许是韦里克（Weikle, 1903–95）。韦里克是耶尔大学的一名捷克移民，他撰写了大量文学研究，包括《文学理论》（1949年与沃伦·奥斯汀合著）和八卷本的《现代批评史》。他的学说是所有选择中最广阔的；他批评了主要关注来源和影响的狭隘法国视角，韦里克将“比较”理解为指示“超越任何单一国家文学的限制”。他在一篇题为《比较文学的危机》（1959）的文章中认为，理想情况下，人们应该完全消除学科，将“文学教授”仅仅视为哲学教授之一。韦里克对该学科的包容性理解帮助了某些人所谓的“美国学派”比较文学，这是一种倾向于理论的学科版本，至今依然蓬勃发展。


    这并不是说他一定赞同此类理论发展。韦里克后来开始批评解构主义和后结构主义的“新虚无主义”，担心其语言上的自我迷恋会令学生离开，并剥夺文学的基本人性共鸣。这种对修辞技术的强调要么引起学生的反感，要么吸引了他们——总有一些研究生会被吸引——毫无疑问，美国的比较文学变得越来越理论化，像“耶尔学派”批评家杰弗弗里·哈特曼（Geoffrey
    Hartman）和曼·德（Man de）这样的人物，在1975年的一项课程提议中提倡批评方法，已日益转向文学作为一种关于语言的语言，或一种元语言学科。鉴于韦里克从未学过这种元语言，讽刺的是，他的许多母语者在加州大学拥有以他命名的声誉系列讲座。


    在美国之外，该学科在战后时期在全球范围内立足。广义上，比较文学在20世纪下半叶的演变，是对上半世纪民族主义狂热的持续反应。犹太文学学者在逃亡时带走了他们的“欧洲思想”，但也带走了一种无家可归的感觉，借卢卡奇（Lukács）的话说，是一种“超越性的流离失所”。比较视角出现成为一种将政治必然转化为文化美德的手段，一种在文化间隙中建立永久流亡状态的方式。因此，走私者和间谍并不应该是比较文学家的首选隐喻——斯坦泰纳在自传中写道，“我一生都试图做一个双重或三重间谍，‘试图暗示一种伟大语言与文学中另一种的必要存在’”。同样惊讶的是，该学科许多最具原创的发展源于全球边缘。


    比较文学作为一个全球性学科的重新定位——以及随之而来的“中心”与“边缘”语言的重新评估——在20世纪60年代开始认真落实。印度、中国和非洲版本的学科早已存在，并有它们自己的局部重点和语调（例如，第一个比较文学系是1956年在印度开办的），但在由西方语言主导的文学市场中，他们难以获得关注。然而，到2世纪60年代社会动荡时期，既有的结构和权威在文化和政治上都日益受到攻击。黑人批评家弗朗茨·法农（Franz
    Fanon）于1961年出版《大地上的苦者》后，后殖民主义的长征动摇了西方的知识机构，随后的运动共同拥有在国际团结中反对国家结构的兴起的情感。在整个20世纪70年代和80年代塑造比较文学研究的文学——尤其是“法国”——理论，源于这种全球化的思维精神。人们经常注意到，这一时期的许多领袖——拥有解构主义学说的雅克·德里达（Jacques
