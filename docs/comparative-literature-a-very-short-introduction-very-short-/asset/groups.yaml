    ## ‘Comp lit’ goes global


    In the footsteps of pioneering figures like Spitzer and Auerbach, the discipline
    of comparative literature began gaining pace in the 1950s as a transatlantic art.
    If Hitler helped develop the nuclear bomb in America by driving Jewish scientists
    from Europe, he sustained himself with literary criticism. Europe émigrés brought
    their expertise to the East countries, and their influence continued into the
    next generation of leading scientists as George Steiner or Jan Starobinski, Europeans
    (with at least partly) American training. Comparative literature had outgrown
    its continental origins.


    Perhaps the most influential in the development of what came to be known as ‘comp
    lit’, in the USA, was Weikle (1903–95). A Czech émigré at Yale, Welek wrote numerous
    literary studies, including Theory of Literature (co-authored with Warren Austin
    in 1949) and the eight-volume A History of Modern Criticism. His doctrine was
    the broadest of choices; criticizing the narrower, largely French focus on sources
