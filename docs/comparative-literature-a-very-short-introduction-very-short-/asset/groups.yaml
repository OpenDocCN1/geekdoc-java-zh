    One in which to do this is by becoming itself, in the terms of the German poet
    Friedrich Schiller (1759–1805), as a process of ''aesthetic education''. Letters
    written in the early 1790s in the wake of the French Revolution—around the same
    time, that is to say, that ''comparative philology'' was coming fashion—Schiller
    argued that the ideal aesthetic state is one characterized by the Kantian notion
    of disinterested (defined as the process of engaging with the world selflessly,
    without vested interest). In such a state, reason and emotion, sense and sensibility
    learns to balance intellectual demands through an aspiring to ''ideal of equality''.
    The aesthetic ''play'' of the imagination, freely embraced, creates a safe space
    for human—and for humanist—self-realization.


    That such a state can lead to a process of political and even moral education,
    for Schiller, in the nature of the (truly) aesthetic. It is what makes it a possible
    model for the future of comparative literature. Conceived as an aesthetic project
    but born into political realities, comparative literature has struggled to achieve
