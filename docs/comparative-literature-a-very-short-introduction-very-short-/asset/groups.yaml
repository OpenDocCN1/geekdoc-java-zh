    # Comparative Literature: A Very Short Introduction


    Ben Hutchinson


    Publisher: Oxford University Press

    Print ISBN-13: 9780198807278

    DOI: 10.1093/actrade/9780198807278.001.0004


    Print Publication Date: Mar 2018

    Published online: Mar 2018


    # 4. Disciplines and debates


    Ben Hutchinson


    > https://doi.org/10.1093/actrade/9780198807278.003.0004 <https://doi.org/10.1093/9780198807278.003.0004->


    **Published in: March 2018

    **Published online: 22 March 2018**


    # Abstract


    Since the 1960s, comparative literature has splintered into a range of competing
    disciplines. In order to most accurately gauge its place in the Humanities today,
    ‘Disciplines and debates’ considers the various incarnations of comparative literature
    in neighbouring disciplines, including literary theory, cultural studies, postcolonialism,
    world literature, translation and reception studies. It looks at each area, explaining
    how the growth of literary theory and cultural studies, in particular, helps us
    understand the growth of comparative literature. Since the turn of the millennium,
    the role of world literature as a model of comparison has come to the fore where
    translation remains the prerequisite for and the very practice of comparative
    literature.


    Writing in 1993, the British scholar Susan Bassnett claimed that comparative literature
    was in decline; ten years later, the Indian critic Gayatri Chakraborty Spivak
    went one step further and declared the ‘Death of a Discipline’. Barely a decade
    on, such obituaries have been proven emphatically wrong. Arguably more than any
    other discipline in the Humanities,'
- md: '

    Comparative literature has experienced a surge of interest in recent years, driven
    by its strategic position between languages, literary criticism, and cultural
    studies. Indeed, it is in many ways defined by this position, by its porous relationship
    to neighbouring areas of scholarship; equal parts parsley and chameleon, comparative
    literature draws sustenance from fields of inquiry just as on others. This makes
    it particularly vulnerable to changes in intellectual fashion—itself an important,
    if underexplored subject—also makes it a placeholder for debates about the changing
    status and purpose of literature in the 21st century.


    The very term ''comparative literature'' is in many ways a category of search.
    Perhaps the greatest lesson of recent years is that both parts of it are provisional.
    We have seen how the ''comparative'' alters its emphasis with changing political
    and linguistic characteristics; yet the noun ''literature'', too, is far from
    the stable signifier of traditional scholarship. With the rise of literary theory
    in the 1970s, and cultural studies in the 1980s, the idea of the ''text'' began
    to be contested. As the barriers between ''high'' and ''popular'' became increasingly
    blurred, as the concept of the ''canon'' became increasingly problematic, the
    unquestioned legitimacy of literature as the ultimate form of verbal art came
    under fire. Comparative literature, inherently contingent, was displaced. Now
    more than ever, it asserted itself as an index.


    Another way of saying this is to note that the 1960s literature has splintered
    into a range of competing disciplines. Perhaps the most acute way to gauge its
    influence within the Humanities is today to consider its various incarnations
    in neighbouring disciplines, literary theory, cultural studies, postcolonialism,
    world literature, translation studies, and reception studies. Understood as a
    composite of these and other related fields, comparative literature always presupposes
    a point of comparison; in this sense, comparative practices are always comparative
    prejudices (even, following the argument of the philosopher Hans-Georg Gadamer,
    not necessarily negative, they make judgements possible in the first place). Given
    this emphasis that it places the critic on as well as the creator, the indiscipline
    of comparative literature emerges from these debates as a mode of inquiry in which
    the observer''s predilections—and presuppitions—are as important as the object
    under observation. Comparative literature is also, in short, comparists'' literature.


    ## Literary theory


    The heart of contemporary conceptions of comparative literature is a paradox.
    In order to justify itself, it has become more theoretical; yet for this reason
    the object of this theory—literature—has become more marginalized. Theoretical
    discussions of the subject have proliferated, to such extent that they seem to
    push out the actual work of comparing one with other; within the academy, comparison
    is often more conceptualized than carried out, more than practiced. It is impossible
    to understand the growth of comparative literature, in short, without understanding
    the growth of literary theory.


    The astonishing success of literary theory across a broad range of the Humanities—as
    exemplified by influential schools such as structuralism, poststructuralism, feminism,
    and postcolonialism—has depended on necessarily comparative premises. Literary
    theory emerged, that is, out of comparative literature: its ironic energy derives,
    from other sources, from a rejection of national traditions, from an attempt to
    rethink theoretical models of writing. Unlike practice, travels freely between
    countries; in the international marketplace of ideas, theoretical models are easy
    to transfer, since they are ''theory'', universally applicable. That this a natural
    tendency for ambitious comparists to theorize about their subject is hardly a
    surprise. Writing about comparing has always been as central to the discipline
    as comparing writing,


    What has changed in the last fifty years is that literature has emerged as a discipline
    in its own. If comparative literature was a key battlefield for the ‘theory wars’
    of the 1970s and 1980s (see Box 7), its landscape bears scars, perhaps the most
    significant of which is that the very concept of ‘literature’ became problematic.
    In his seminar General Linguistics (first published in 1916), the Swiss Ferdinand
    de Saussure proposed a basic distinction between language (langue) and speech
    as an individual intervention (parole). In calling attention to the social and
    linguistic codes in how we understand ‘works’ of literature—to what one might
    term the relationship between text and context—Saussure''s distinction effectively
    marked the starting point of modern literary theory.


    ### Box 7 Theory wars


    Modern literary theory—the roots of which go back to Saussure’s linguistics at
    the start of the 20th century, and to the Romantics a century before—took off
