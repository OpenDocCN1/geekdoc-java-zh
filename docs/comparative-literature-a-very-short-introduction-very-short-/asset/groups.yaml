    “比较文学”的定义。在1903年的一篇文章中，盖尔（Gayle）主张一种很大程度上历史性的、顺序性的比较理解：“首先是每种文学的历史；文学之间的历史关系。随后是作为一个整体的综合。”如果说这种模型仍然认出19世纪的特征——强调人类学的重要性，并得出结论比较文学等同于“文学文献学”——那么它在构建文学史发展过程的方式上也具有显而易见的欧洲特征。在新世纪的黎明时期，也就是说，无论好坏，欧洲仍然是比较的中心。


    ## “欧洲精神”的危机


    随着19世纪在第一次世界大战爆发前的几年走向终结，一种殖民主义的比较模式——知识分子像辐条一样从欧洲向外辐射——达到了顶点。20世纪初的几十年，现代主义重新关注了文学和文学批评中的国际主义。尽管受到了埃兹拉·庞德（Ezra
    Pound）和T.S. 艾奥特（T.S. Eliot）的熏陶，现代主义在许多方面仍然是最后一场伟大的欧洲运动，随着高雅文化的摇摆。从俄罗斯形式主义到意大利未来主义者，从法国超现实主义到德国先卫派，他们在整个欧洲范围内交流与合作。不可避免地，比较文学开始指的是


    然而，尽管现代主义时代充满了国际主义，但令人震惊的是，“比较”一词在那个时代实际上使用的极少。该学科的人类学研究在这一时期努力寻找明确的比较方面，其简单的原因是这些方面太太少了。可以推测，这部分是因为两次世界大战的“黑洞”吞噬了更深思熟虑的国际交流时尚。但这很大也归于比较冲动在这一时期表现为许多替代方案：先卫的、国际的、欧洲的。其中包含了“危机”的概念。


    如果说1914-1945年代表了现代欧洲最黑暗的时期，它们也标志着其最持久的概念化时期。这实际上并非一个悖论：弥漫这一时期的危机产生了一种增强的紧迫感，急于拯救欧洲免受自身的毁灭。在维护共同文化遗产的最后尝试中——尽管；或许正因为——对于中心的证据，“欧洲”被反复动员，作为国家间比较的共同基础。这些思想出现最清晰的时期是第一次世界大战后的后的几年。在这种危机的影响下，欧洲作为一个范畴的思想具有了重复的地位，通过罗曼·罗兰（Roman
    Rohlan）、斯特凡·茨威格（Stefan Zweig）和本尼迪克·克罗齐（Benedicto Croce）的地位，坚持了其作为比较与和解之文化前提的相关性。这一时期达到了顶峰，即理查德·库登豪塞尔-卡勒尔基（Richard
    Coudenhauser-Kalergi）在他1923年的宣言中试图建立的“泛欧主义”（Panuropa）。


    多产的库登豪塞尔-卡勒尔基（1894–1972）在许多方面都是欧洲联盟之父。在致力于欧洲统一的一生，他为各大陆之间更大的政治和文化合作而不懈努力，倡导建立“欧洲合众国”。他是一位奥匈利外交官和一位日本继承人的儿子，他自己的跨文化背景使他产生了加强整合的需求：“未来将由混合种族组成，”他在1925年带有某种误解地写道，“今天的种族和阶级将随着空间、时间和偏见的消失而逐渐消失。”在此地和其他地方，库登豪塞尔-卡勒尔基的泛欧洲愿景为正转向欧洲的法西斯主义毒药提供了解毒药。


    这类精通多种语言的人物在令人眼晕的语言系列中自如切换，体现了20世纪初文学比较方法背后的国际精神。这些人物的文化和知识野心有时令人惊叹，但它们面临着加剧“欧洲作为世界中心”这一长期观念的风险。“欧洲可能只是‘亚洲中心的一小部分突出’，”法国诗人保罗·瓦莱（Paul
    Valéry，1871–1945）在1919年的一篇有影响的文章中写道，但它也是“巨大躯体的大脑”。瓦莱的《精神危机》（Crisis of the Mind）可能是这一时期欧洲精神最单一且持久的文件。文章最初以英文出版，开头承认了现代性的死亡——我们现在告诉你们，我们是凡胎之躯——随后用寓言性的哀调探讨了欧洲文化的危机。诗人暗示，当代文化的共同事业就是其本身。


    从比较文学的角度来看，瓦莱的文章勾勒了人们可以称为“墓地模型”的比较。像一个“知识分子哈姆莱特”，现代欧洲精英立足于记忆的巨人们之上：列奥纳德·达·芬奇、康德、黑格尔——他们都以墓碑般的沉重感压抑着。瓦莱声称，法国、英国和俄罗斯的名字对于未来的耳朵来说，正如莱茵河和巴比伦之于我们，是遥远过去的幽灵回声。支撑欧洲精神的三个持久遗产——罗马的、基督教的和希腊的——驱动了这个大陆数千年，但它们也在消失，以至于欧洲看起来像正在解体。军事危机可能已经过去，但经济决定现在——而谁的知识危机将决定未来？20世纪20年代和30年代文化所面临的风险，无非欧洲文化本身的存在。当然，批评家们并不总是就如何服务这种文化达成一致。广义上，这一时期的比较文学方法可以分为左翼和右翼方法论，以及对欧洲文学遗产的进步和保守愿景。左翼愿景主要源于东欧，其社会主义代理人担心美学与政治之间的精确关系。一方面是俄罗斯和捷克形式主义思想家，另一方面是如乔治·卢卡奇（George
    Lukács）或米哈尔·巴赫金（Mikhail Bakhtin）等体裁理论家，他们他们以不同的方式延续了政治文学的。


    卢卡奇与贝尔托特·布莱希（Bertolt Recht）之间的争论将欧洲传统推向了。在另一种名称的比较文学愿景中，30年代的卢卡奇和布莱希揭示了前马克思主义文学——从希腊到文艺复兴，从莎士比亚到罗马人——对于现代时代仍然具有持续的影响。以艺术的“社会使命”为目标——并引用了极其广泛的参考范围，从英语到能剧——这两位知识分子进行了一场古代与现代的马克思主义争论：在红角是参与文学的新美学；在蓝角是资产阶级人文主义。这是具有意识形态冲击的比较文学。


    并不是只有左翼批评家在主张摆动；许多现代主义者持有保守观点，比较学者也是如此。奥斯瓦德·斯宾格勒（Oswald Spengler）的《文明的衰落》（1918-22）为战后许多思想奠定了基调。斯宾格勒对历史、文化和宗教的广博方法并不臭名昭著；不仅是他的语气，他的方法论也影响了T.S.
    艾奥特和哥特弗里德·本（Gottfried Ben）等人物。然而，也有同样微妙、受限的流派试图“保护”欧洲遗产——正是在这一点上，黄金一代比较学者来到了。


