    无论该术语本身固有的偏见如何，歌德创造的*Weltliteratur*（世界文学）标志着比较文学史上的一个分水岭。事实上，他并不是第一个使用这个词的人这并不重要；这一荣誉属于他的朋友克里斯托夫·维兰德（1733–1813），而且据所知，在他之前可能还有其他人。重要的是，歌德感知到了这一术语的价值，并赋予了它奥林匹式的威望。随着1836年埃克尔曼与歌德对话录的出版，“世界文学”这一概念应运而生。


    这一术语极度的不稳定性——其既是巨大的力量，也是其最大的弱点——迅速不仅适用于“文学”，也扩展了“世界”本身。仅仅二十年后的1848年，它出现在许多意想不到的地方：如《共产党宣言》。正如马克思和恩格斯所言，随着世界主义中产阶级对贸易工业的殖民化，“国家”的单面性和狭隘变得越来越不可能，而且在众多地方性文学中，作者们暗示商品与文本之间存在着内在的平行关系，两者在19世纪中期都完全无视了国界。这似乎是对*Weltliteratur*理念的某种激进重新定义，但事实上，在1827年，歌德就反复运用“价值”的语言（无论是在与埃克尔曼的对话中还是其他地方），对中国和塞尔维亚增长的市场进行推测，随后又回到古希腊的黄金。


    从这一历史背景来看，这种商业与文化循环模式的汇合并不令人意外。19世纪中期的文化价值与文化扩散：19世纪50年代和60年代伟大的现实主义小说——如狄更斯、巴尔扎或托尔斯泰的作品——将资本主义的积累模式引入了文化领域，通过教养小说（*Bildungsroman*）中的主角获得了我们现在归于对文化“商业化”剥削的贬义意义上的文化秩序储备。以歌德为例，人们可以从积极的意义理解“市场”这一比喻，即启蒙运动意义上的一个国际交流论坛，其货币既是文化的，也是商业的。在这里和在其他地方一样，比较模型本身也必须经过适当的比较。


    然而，具有价值的在于现代性的极度多样性，由工业技术革命带来的意义的激增。爱默森在1850年一篇关于歌德作为“代表性人物”的文章中写道：“从未有过如此杂乱的事实”。


    世界的延伸变得像美国贸易、希腊或罗马生活、中世纪生活那样，成为一件简单且易理解的事；但现代生活却尊重许多事物。


    如果比较本身是这种视角激增的必然结果，那么有趣的是，对经典的保守式回归也是如此。在一个受到这种不可控力量威胁的时期，文学思想重新尝试并测试了价值观：在19世纪正中间，爱默森的“代表性人物”名单——柏拉图、斯宾诺、蒙田、莎士比亚、拿破仑、歌德——仔细地划定了西方的边界。爱默森没有选择赫拉克勒斯之柱（见图7），而是选择了诠释学的支柱，作为已知的、明确的欧洲世界的标记物。


