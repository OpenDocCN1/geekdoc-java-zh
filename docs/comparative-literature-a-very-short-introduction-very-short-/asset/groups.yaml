    The status of comparative literature in its early years—somewhere between archaeology,
    philology, literary scholarship, and cultural history—emerges vividly from the
    unlikely story of Smith''s Gilgamesh. On the one hand, the intellectual achievement
    is astonishing, the comparison of stylistic and thematic details insightful, necessarily
    speculative: Smith distinguishes, for instance, the ''inland'' version of the
    Flood as given by the Bible and the ''maritime'' version related by the tablets,
    and compares the hero of the epic to that great Greek hero, Heracles. Beyond the
    intellectual achievement, on the other hand, the Victorian reception of Gilgamesh
    demonstrates the cognitive biases of the age, predisposed to view everything—even
    cultural artefacts from a distant time and place—through the classical, Christian
    prism of the British Empire. By 1872, in other words, comparative literature had
    become part of the broader project of cultural colonialism.


    How had it got to this point? To answer this question, we need to go back to the
    roots of the discipline in the years around 1800. For the story of Gilgamesh suggests
    to us that comparative literature was born out of the spirit of comparative philology.
    Philology—the study of language in its historical contexts and see Box 4—boiled
    in the early 19th century, as colonialism opened new continents for fieldwork.
    Comparisons between modern and ancient Oriental languages became inevitable. Based
    on their experiences in British India, early Orientalists such as Jones argued
    European and ‘Asiatic’ shared common roots in an original language that became
    known as ‘Proto-Indo-European’. Unsurprisingly, Jones and his followers also attempted
    analogies between Asian languages—European, Arabic, Sanskrit—and the European
    languages of Latin and Greek. The colony of India was not to Britain the colour
    of language from Rome, or opening up a new front for comparative linguistics.


    ## Box 4 Philology


    The study of language in its textual development, philology drove the development
    of the Humanities as we know today. First mentioned by Plato, ancient philology
    comprised four elements: language theory, rhetoric, textual criticism, and grammar.
    Over the century it evolved into means of reconstructing historical contexts out
    of literary texts—extrapolating ancient ways of living, for instance, by reading
    Homer and Herodotus—and helped define the period of European history into ancient,
    middle, and modern. As practised throughout the early modern era, philology represented
    a kind of (immediately enduring) comparative literature before the fact: less
    discipline than a set of critical practices, it relied on comparison as its principal
    technique, whether applied to Classical, Biblical, or Oriental texts. As James
    Turner noted in his study Philology: The Forgotten Origins of the Modern Humanities
    (2014), the most numerous, obstinate, practitioners of the comparative method
    in the West have been philosophers.


    This classical field became because subsequent theorists of European Romanticism
    such as Friedrich Schlegel (1772–1829)—the man who introduced the concept of the
    ‘Romantic’ as a way of describing postclassical literature—to dream of finding
    ‘the spirit of all languages, all poetry of the human spirit’ ‘comparative grammar’.
    Writing in 1820, Wilhelm von Humboldt said each of these early comparists as being
    ‘to establish on a better basis the study of languages which heretofore has been
    highly superficial, unsophical, and unshadowed’; the study of languages quickly
    shaded over into the study of cultures more broadly defined, particularly as these
    pioneering figures often undertook fieldwork in distant countries. A distinction
    began to emerge between what one might call ‘explorers’—on one hand and ‘airchair
    philosophers’ on the other; travellers and theorists.


    It is not surprising, that notions of ‘West’ and ‘East’ have haunted comparative
    literature since its inception. The Enlightenment belief in progress of humankind—Western
    culture as the centre of the Republic of Letters. Following the French Revolution,
    the concept of ‘Europe’ survived a wave of pathos, following in journal titles—Europe
    (1803), Archives littéraires de l’Europe (1804)—and any number of manifesting
    intents, to cite one well-known track of time, the common history of Christendom
    or Europe (1802). Figures such as Madame de Stël worked to encourage international—exchange
    within Europe, particularly all the important Franco-German, also introducing
    notably modern reflections on the role of women or on the North-South division
    of country (for de Sta, for instance, Southern functioned as a kind of interest
    Oriental). The real Orient, remained a largely acknowledged presence at the edges
    of Christendom.


    The rise of philology changed the nature of this comparison. Napoleon’s ‘savants’
    returned to the occupation of Egypt (1798–1801) with new interest in Franco-Arabic
    intellectual relations; shortly thereafter the term ‘comparative literature’ even
    appeared, for the first time in Europe, when François-Joseph-Michel Noël and Guislain-François-Marie-Joseph
    de La Place publiés leurs leçons de littérature et de morale (1816) as a ‘cours
    de littérature comparée’. On the other side of the Rhine, meanwhile, enthusiasm
    for Schlegel''s ideal of comparative grammar—as proved in his influential study
    on The Language and Wisdom of the Indians (1808)—led to ever more heroic attempts
    at languages. Figures such as Bopp, with his study of Sanskrit, Lithuanian, Gothic—by
    1842, a Philosophical Society had been founded in London.


    The most important figure in the development of comparative literature was Johann
    Gottfried Herder (1744–1803). In his Essay on the Origin of Language (1772) and
    his Reflections on the Philosophy of Mankind (1784), he argued that literature
    is an expression of a nation, what he terms the Volksgeist. In his Letters for
    the Advancement of Humanity (1797), he produced one of the earliest critics of
    the idea, criticizing the quarrel of the ancients and moderns—who claimed the
    Classics remained unpassed and those who championed contemporary culture.


    The Sorites of comparative literature, then, is one period or tradition shades
    into another at a point that be very difficult to identify, despite ostensibly
    differences of emphasis and idiom. Finding such a point—When does medieval literature
    end and that of the Renaissance begin? is the crossover point between Eastern
    and Western forms of poetry?—is the task of the comparist.

