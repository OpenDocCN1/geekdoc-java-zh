    Comparing contrasts in this manner suggests a broader lesson for the discipline
    in the West, namely that it has been predetermined by the use of nations as its
    building block. In response to the modern, Westphalian conception of the nation-state—to
    the ideal of national sovereignty enshrined in 1648 and over the course of the
    19th century—comparative literature asserted itself as international. In doing
