    近年来，比较文学的关注度激增，这得益于它在语言、文学批评和文化研究之间的战略地位。事实上，在许多方面，正是这种地位定义了它，即它与邻近学术领域之间存在着渗透性的关系；比较文学既像欧芹又像变色龙，它从各个研究领域汲取养，正如从其他领域汲取一样。这使得它特别容易受到知识界潮流的影响——尽管这种潮流本身就是一个重要但尚未被充分探讨的主题——同时也使其成为关于
