    # Close vs distant reading


    How, does this ambivalence play itself out? How does comparative literature construct
    and deconstruct its critical questions? The traditional basis of the discipline
    is the interpretation and juxtaposition of more than one literature in its original
    language. Having acquired the necessary linguistic skills, and having decided
    on their topic—a decision that is subject, inevitably, to changing fashions and
    power structures—the comparative sets out to cross-refer any of mutually intelligible
    texts, generally some form of common framework (a period, a region, motif, etc.).
    With slow philosophical rigor, she combs through one text for echoes of another;
    syntax, structure, idiom—all these may offer cues for comparison. Culturally curious
    and textually promiscu, she is on the lookout for ways in which one work echoes,
    or contradicts another, complements, extending its effect beyond its erstwhile
    confines. Similarity is good, but difference is better, in as much as it may point
    up hitherto unsuspected aspect of the texts in question. Attention to detail,
    above all, is a way of opening broader arguments at time, manner, and place.


    All of this is a way of saying that the traditional basis of comparative literature
    is close reading (see Box 2).'
