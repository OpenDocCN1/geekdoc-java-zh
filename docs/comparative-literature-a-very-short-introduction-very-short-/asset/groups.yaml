    对于德国犹太文化批评家而言，文学的比较模式开始具有决定性的、生存的意义。


    这些批评家首先在比喻意义上被放逐，随后在现实中流亡，他们通过审视欧洲文化的长期视角来慰藉自己。


    1918年战斗结束后，一群雄心勃勃的德语语学者开始关注海外。在战后和解的精神下，罗曼语言（Romanistik）学者——这一学科被他们视为具有比较性，跨越法语、西班牙语等罗曼语族，并具有欧洲精神，强调“罗马”或“拉丁”等宏观范畴，以此反抗他们所认为的国家传统的狭隘化。如果说这些批评家的工作代表了欧洲比较文学模式的最后辉煌，那么它已经进入了一种自愿的知识分子流亡状态。在他们之前还有许多重要人物，其中包括匈牙利学者米哈哈伊·巴比茨（Mihály
    Babits）和阿格内斯·斯特斯（Ágnes Szthth），他们在1918年奥匈帝国崩溃的背景下撰写了《欧洲文学（1935年）》和《世界文学（1941年）》的历史；此外还有一些赫赫鼎鼎的名字：恩斯特·库里乌（Ernst
    Curius，1886–1956）、里奥·施皮策（Leo Spitzer，1887–1960）和埃里希·奥尔巴赫（Erich Auerbach，1882–1957）。


    这些批评家通常被归为比较文学的“黄金时代”，但实际上他们在才华和气质上存在不可否认的差异。库里乌是一个极度保守的人物，他是三人中职业最为传统的：第一次世界大战开始后他在波恩获得职位，并在整个二战期间一直留在那里。有时由于这种原因（他与纳粹政权的某种默契），实际上将自己的名字尽可能广泛地投入欧洲文化的人文历史中，促进法德理解，并特别关注他所认为被忽视的史前时期。在第三帝国那些年里，库里乌一直致力于一部在1948年成为该学科持久杰作之一的著作：《文学与拉丁时代》。


    库里乌研究的重要性不仅可以从其广度来衡量，还可以从其历史深度来衡量。从古代到现代，从歌德到歌德，库里乌追踪了文学史的“欧洲化”，特别将中世纪文学视为一个关键时期，因为它作为通用语，促成了现代欧洲文化的兴起。在这种方法中，存在那个时代的典型特征：国际交流中的后裔实例，而20世纪40年代最好的作品的特征是回归那个“早已具有比较性”的中世纪。在1944年的一封信中，库里乌用令人难忘的务实术语概述了这一时期的吸引力：“人们似乎还没有意识到国家、民族文学和民族学之间的现代分工是多么荒谬。如果有一个只写过德国事件、并可能使用德语语料的中世纪历史学家，人们会怎么想呢？”


    库里乌的比较文学历史方法可以与施皮策所遵循的文献语言学方法形成对比。这位维也纳精神的最关键人物是一位具有最优秀欧洲传统的精通多语言的学者。施皮策自如地在多种语言间切换，是一位比较性的比较者，将语言学分析与心理分析相结合以增强效果。在他多产的著作中，对风格学的反复关注是一个核心，而在施皮策的手中，风格学揭示了某种类似于语言实体的东西。


    在他关于风格的论文发表时（与奥尔巴赫开始使用“精神史”Geistesgeschichte概念的同年），施皮策已经搬到了……（此处原文缺失）。


    然而，令人震惊的是，考虑到当时的情况，这种遗漏说明了一切。这在部分归功于流亡的魅力。奥尔巴赫承认，到此时跨越欧洲的趋势已开始取得进展。在1933年这个命运之年，施皮策离开德国前往伊斯坦布尔任职；三年后，他离开欧洲在约翰霍普金大学担任教授。


    这一点在1952年一篇题为《世界文学的语言学》的文章中尤为明显。奥尔巴赫承认到此时跨越欧洲的趋势已开始取得进展，但他敏锐地指出了“世界文学”（Weltliteratur）在战后这些年发展过程中存在的问题：随着两种主导文化模式——欧美模式和俄国布尔什维模式的迅速扩张，语言和文学的差异面临着被平庸和标准化的风险。


    然而，考虑到当时的情况，这种遗漏说明了一切。这在部分归功于流亡的魅力。奥尔巴赫承认，到此时跨越欧洲的趋势已开始取得进展。在1933年这个命运之年，施皮策离开德国前往伊斯坦布尔任职；三年后，他离开欧洲在约翰霍普金大学担任教授。


    然而，考虑到当时的情况，这种遗漏说明了一切。


    这也是他极其广泛的作品的功能，尤其是他的杰作《模仿：西方文学中的现实描写》（Mimesis: The Representation of Reality in
    Western Literature，1946年）。该书在伊斯坦布尔期间创作——奥尔巴赫于1947年搬往美国——《模仿》为世纪后半叶的比较文学设定了模板。以第一章为例，他对比了曾经的奶妈欧律刻亚（Eurycleia）通过伤痕认出归来的英雄奥德赛（见图8）的时刻，与《创世记》中亚伯拉罕献祭以撒克的时刻，随后对《奥德赛》和《旧约》进行了更广泛的讨论。在建立了这种比较技术后，奥尔巴赫将其贯穿了古典、中世纪和现代时期。

