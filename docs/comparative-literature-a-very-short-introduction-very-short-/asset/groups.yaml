    Guillén）与伊特维-扎哈对文学多系统的论述。相比之下，从千禧以来，二元对讨论已经转向，翻译变成了更具政治化的理解的一部分，即弗兰科·莫雷蒂（Franco
    Moretti）所说的“世界文学系统”，然后是代码模型和远程跨界模型。比较文学的重点并不在于在翻译中丢失了什么，也不在于芭芭拉·卡辛（Barbara Cassin）字典中那些在另一种语言中无法重构的“不可译”术语。莉迪亚（Lydia）所谓的“翻译实践”——例如西方的“自我”与儒家的“己”等词汇的语境共鸣——已成为将注意力从直接的等值主张转向微妙交换形式的一种。如果翻译的认识论意味着“搬运”，那么恰恰是无法被搬运的东西开始主张比较研究的重要性。这种发展仅仅是普遍主义者与民族主义者之间古老战斗中最新——也绝不是最后——的冲突，它强调了翻译仍然是比较文学的前提，甚至是其核心实践本身。


    ## 接受研究


    如果翻译意味着一种移动的搬运，那么“接受”描述的是另一种。翻译意味着语言之间的意义，它处于横轴上；而接受则是通过语言追溯意义，处于纵轴上。当然，翻译本身就是一种接受的形式——尤其是因为主要作品不断被重新翻译——但它的比较动力在很大程度上是地理性的，跨越语言和文化；原则上，根据定义，接受是从历史角度运作的——关注读者和文化如何处理翻译。显然，任何事物都可以被后世文化“接受”——某些理论事实派，例如沃尔夫冈·伊瑟（Wolfgang
    Iser）和汉斯·罗伯特·詹姆斯（Hans Robert James）的“读者反应理论”，使接受成为文学创作的基础——但传承最长的地方接受程度最高。因此，对希腊、罗马和阿拉伯古典的接受提供了几个世纪最持久的比较文学模型之一，并可以代表更广泛的接受研究的卓越地位。


    尽管在英语世界非常流行，但古典接受研究与古代文明一样古老。文学可能等于对古典的延伸研究；正如霍拉斯在《书信》中所说：“当希腊征服了它凶猛的胜利者并将艺术引入各国时”。或许如此，希腊人自己也回溯了波斯文化，正如爱德华（Edward）在他对埃斯琉《波斯人》富有影响力的解读中所说，“波斯人是东方主义最早的文献之一”。在某些方面，整个古典研究都是关于接受的，因为它是在跨文化地回望。然而，古典接受研究的特殊贡献在于关注古典在后世社会中被重新激活的方式——从而引出由语境改变而产生的意义变化——并反思这在文化和理论上的意义。这种并置产生了一种全新的、原创的视角，不仅针对早期和后期文本，还针对这些文本与其相应时期之间的关系。


    这种方法对比较文学而言的丰富性是不言自喻的。比较来说，接受比给予更好，因为后者的语境因前者的残存存在而变得丰富。在古人与现代人的争论中，接受批评家通过后者来阅读前者，窥析后期文本是如何借鉴其前作的。事实上，在乔纳森·斯威特（Jonathan
    Swift）对这场辩论的讽刺版本——即1704年作为《管肠的故事》一部分出版的所谓“书战”中——是书籍本身活了过来并争夺优越地位（见图10）。


    10. 书战，选自《管肠的故事》（1704）的原木刻。


    斯威特在辩论中避免得出结论只是审慎的做法。因为现代文本可能并不优于古代文本，它不可避免地受到它的影响——同时也受到其之前被接受的所有方式的影响。关注维多利亚时期对古典神话的接受可能向我们展示19世纪的男性气概是如何通过引用荷马英雄构建的，但它也可能追溯地改变我们对早期接受荷马的看法。对“东方”史诗（如《天夜谭》，1704年由安托万·加尔的法语译本首次引入欧洲传统，或波斯诗《史诗》，因其插图手稿的历史闻名）的接受，告诉我们关于东方地位变化的信息与文本一样多。在这种情况下，接受是使用乔治·布兰斯（Georges
    Brandes）的望远镜。


    接受研究的另一种常见方法是考虑悲剧或喜剧等体裁，或时代错乱或净化等修辞模式。无疑，这并不被视为一种被动的状态。相反，尼采的《悲剧的诞生》对叔本华的抨击就是一个例子。简而言之，接受这一概念本身在不同时间以不同方式被接受。那么，它为什么在21世纪脱颖而出？部分答案是简单的权宜。面对证明其存在的日益激烈的斗争，古典转向接受研究，作为一种维护其持续相关性和自我意识的方式。更广泛地说，接受研究已成为普通历史转向的一部分——书籍史、思想史——这些研究优先考虑语境而非语义内容。这种历史转向带来了比较视角的光彩，不仅将接受视为比较的形式，而且将比较视为接受的一部分。研究古典接受（或任何形式的接受）本质上是跨学科的，这表明了比较文学作为跨学科指南针的潜力。

