    # Acknowledgements


    Ben Hutchinson


    Comparative literature is nothing but a collective endeavour. By its very nature,
    it encompasses perspectives that go well beyond one''s; the sources listed at
    the end of the book—to which many could have been added—a sense of just how ecumenical
    the whole enterprise necessarily is. In the first instance, then, my thanks must
    go to comparists past and present, whose work such an introduction would have
    been impossible.


    Alongside distant readers, the book has benefited imurably from the close readings
    of its first three interlocutors: Francesca Orsini, Richie Robertson, and Shane
    Weller. Nobody would not agree with every last ease or argument, but their generosity
    with their time, and their careful attention to both editorial and intellectual,
    exemplify the virtues of the comparative community. I am indebted to them dearly.


    Colleagues in the British Comparative Literature Association (BCLA) have been
    a recurring source of stimulation over the last few years, as friends in Denmark
    (Mads Rosendahl Thoms), France (Emmanuel Bouji), and Germany (Marcel Lepper).
    Like every other author in the VSI series, no doubt, I am fortunate to have found
    Andrea and Jenny Nuge so unfairly encouraging. To them, and to the anonymous readers
    at OUP whose suggestions challenged and cheered me, much thanks.


    It goes without saying—and must thus be said—that this book, like everything else,
    would not have been possible without Marie, Max, and Hugo. Merci.


