    比较文学在许多文化起源时便产生——同时也被这些文化重新发现——这种倾向，在胡戈·梅尔策尔（Hugo Meltzl，1846–1908）的作品中比任何时候都要明显。梅尔策尔的名字——他被称为胡戈·梅尔策尔或来自洛姆尼茨的胡戈·梅尔策尔——暗示了与他联系的“多语言原则”。在现今德国的匈牙利地区，梅尔策尔在奥匈帝国境内一直说德语——特别是在一个地区，布拉姆·斯托克的《德库拉》深刻地唤起了可能被称为特兰西瓦尼亚“内部东方”的地方。在海德堡接受过训练后，梅尔策尔在1872年26岁时回到特兰西瓦尼亚担任德语教授。五年后的1877年，他创办了世界上第一份比较文学期刊。


    这份期刊的故事告诉我们比较文学在这一学科这些关键创年的地位。通过与一位年长的同事、比较哲学教授萨缪埃尔·布劳斯（Samuel Brauss）合作，梅尔策尔构思了一份真正具有国际视野的出版物。其标题《世界比较文学学报》（Acta
    Comparationis Literarum Universarum）最初以三种语言（匈牙利语、德语和法语）出版，后来确定了拉丁语这一跨国方案；贡献者被宣布来自超过十种官方语言。也许这种做法并没有完全符合理论，超过三分之二的文章是用匈牙利语或德语出版的。同样不可避免的是，这种雄心勃勃的企业的成功受到了怀疑，印刷量从未超过一百份。正是在许多方面，这份期刊维持了那么久，在运行了十一年后于1888年由于竞争对手的影响而停刊。


    然而，从学科的角度来看，《世界比较文学学报》的创立与终结讲述了一个生动的故事。梅尔策尔在1877年的头几期中发表了期刊宣言，主比较文学——在19世纪理解为“哲学、美学、民族学和人类学”——将成为一个完全建立的学术学科。他将其与文学史进行对比，认为后者已变得仅仅是文学史，而他的“比较原则”另一方面有两个主要平面。


    梅尔策尔宣布，这一新学科应该由“多语言原则”驱动（见框5）。摒弃比较文学中“模糊的、世界化主义的理论”，多语言原则代表了文本之间的直接交流，希望像匈牙利、葡萄牙、德国和冰岛这样迥然不同的国家能用自己的语言相互对话。如果这种雄心似乎无可救药地不切实际，是一种博尔赫斯式的普遍交流之梦，但它的设计初衷是为了保护较少数的语言，并确保更多的文学传统能够保持声音。简而言之，该期刊的目标是建立“一个关于比较文学各种问题的小型多语言议会”。


    ## 框 5 “多语言原则”


    在他在1877年的宣言中，梅尔策尔将多语言原则与翻译原则进行了对比：后者局限于文学的间接交流，而前者坚持强调文学与文学之间的直接交流。梅尔策尔勾勒了两种基本的比较模式，这对于随后一个世纪里比较文学的发展将具有基础意义。如果说翻译涉及中介，那么多语言原则则寻求对外国文化的非中介获取；这种雄心的不切实际性——有多少伟人能读超过几种语言？——仅通过梅尔策尔的妥协得到了部分缓解，即在实践中，他的期刊似乎面向十种语言，即那些已获得“古典主义”的语言。根据19世纪末的观点，所有语言都是欧洲语言：梅尔策尔宣布，当亚洲文学最终接受“我们的”字母表时，它将值得被纳入。


    然而，这一学科的现实在怀疑地戳穿了梅尔策尔的情怀时显显破碎。1887年，德国学者马克斯·科赫（Max Koch）在柏林宣布了一份新期刊，其标题是熟悉的《比较文学史杂志》（Zeitschrift
    für vergleichende Literaturgeschichte）。《世界比较文学学报》的德语版《比较文学史杂志》这并非巧合；科赫正在侵占梅尔策尔的领地。除了通常的小规模学术竞争之外，这两份期刊之间的斗争至关重要，因为它们说明了比较文学发展过程中的权力结构：从德语世界的边缘，梅尔策尔试图将注意力转向更国际化的、多语言的比较模式；但帝国反击了，从柏林市这一特权视角出发，“德国文学及其历史自我理解的进步”从今将成为比较关注的中心。从反叛到压制，比较文学在边缘与中心之间之字形前进。


    在第一部宣言之后，关于该学科的比较文学完整著作并没有多久就问世了。再次传记细节强化了位于都柏林的律师马考考莱·波塞特（Macaulay Posett，1855–1927）的感觉，他在1886年出版了他的故事，正如当时新西兰所出现的内容一样。作者在序言中呼吁在“英国、美国和澳大利亚的领先大学”设立比较文学教授席，这既是在寻求英语世界内的教学和政治背景，如果该学科尚未确立，其潜力范围确实是广阔的。总之，他的话是“充满希望的”。


    波塞特认为，这种诗歌（此处指文学传统）的历史可以追溯到丹丁的《俗语辞说》（De Vulgar Eloquentia，约1302年），作为拉丁语中俗语讽刺重要性的例子。丹丁随后决定用当代意大利语创作《喜剧曲》，标志着“现代比较科学”的开端；随后欧洲大陆国家之间文化竞争的兴起，而随着新大陆的发现加剧了这种感觉。这些发展在波塞特的目的论方式在维多利亚时代达到了顶点；现代学术界关键地意识到了比较的需求，“我们可以随意地考虑我们这个世纪的伟大光荣。”


