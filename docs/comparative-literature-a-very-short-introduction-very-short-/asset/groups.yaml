    源自语言传统的文本——他那令人震惊的敏锐方法论对比较文学产生了两个重远影响。首先，“差异”（*différence*）的概念意味着对语言本身的比较方法：意义仅在一种事物与另一个事物之间的间隙和“差异”中产生（例如，在差异与差异之间）。其次，解构项目可以——并已扩展到国家之间的关系，使得西方文学的“正典”本身可以被拾起并重新审视。在一个反权威的时代，德里达对语言意识形态前提的攻击影响深远。


    其后果之一是受理论影响的女性主义的兴起。“女性写作”（*écriture féminine*）这一领域非常适合进行解构，其前提在很大程度上受父权预设的支配。在20
    世纪70 年代，诸如海伦娜·西苏（Helene Cixous）和朱莉娅·克里斯蒂瓦（Julia Kristeva）等人引用了《阁楼上的疯女人》（*the madwoman
    in the attic*）——这是珊拉·吉尔伯特（Sandra Gilbert）和苏珊·古巴（Susan Gubar）对维多利亚文学的一部有影响力的重构著作——探讨了女性作家如何挣争从男性的语言和作者身份前提中夺回自己的声音。西苏
    1975 年那篇具有影响力的文章是女性主义重新界定文学方法的号召，作为重新重组主要与次要（理解为男性与女性化）层级的基础——这种比较也是如此，且毫不不差，是在比较文学的性别；《阁楼上的疯女人》让位了《地下室里的比较者》，为文学的特定性别化阅读奠定了基础。


    理论的兴起标志着对文学修辞技巧的重新关注，以及对文学作为文化建构这一概念本身的重新关注。这里没有所谓的“理论”，只有理论的激增，每种理论都遵循一种特定的方法——从结构主义到解构主义，从精神分析到女性主义——而不是一个给定的主题（即第
    2 章讨论的术语）。但比较文学的根本原因显然是对于“比较”和“文学性”概念的自我意识不断增强。如果比较文学仍然是一门高度理论化的学科，那正是由于这种质疑其自身承诺的基本倾向。


    ## 文化研究


    另一方面，当文学在 20 世纪 50 年代和 60 年代开始巴黎流行时，另一种知识运动正在发展。随着战后时代日益混合的后殖民社会，出现了一种广泛的后现代主义文化感。此前被认为指示人类思想精英成就的术语“文化”，现在开始涵盖更广泛的参考范围，从少数文化到大众消费主义。当文学理论介入极其复杂的艺术作品时——例如，德里达的《弥散》（*Dissemination*,
    1972）讨论了马拉梅的《骰子》或菲利普的《数字》等——这门新科学将是一门更广泛的课程，在兴趣上是兼收的，在努力上是实证的。在战后民主化的精神下，受教育程度低和被忽视的人在习俗和习惯上获得了平等的合法性，精英和大众被视为社会结构的一部分。通过全景视角，一门新学科诞生了：文化研究。


    对文化的研究，不仅限于英语世界，至少可以追溯到 19 世纪主要的保守派思想家如马修修·阿诺尔德（Matthew Arnold）和 20 世纪初的 T.S.
    艾略特（T.S. Eliot），前者《文化与无政府》（*Culture and Anarchy*）于 1948 年出版，后者为《文化定义的说明》（*Notes
    Towards the Definition of Culture*）。然而，对于许多被视为传统“高雅”艺术的内容，文化研究将这一想法颠倒了。通过理查德·霍加特（Richard
    Hoggart）和斯图特·霍尔（Stuart Hall）等先驱人物的发展——他们都与伯明翰学派有关——文化研究既是社会学理论，也是美学理论。《素养的》（*The
    Uses of Literacy*, 1957）被雷蒙德·霍加特（Raymond Hoggards）和 E.P. 汤普森（E.P.Thompson）等等志同道合的思想者呼应和扩展，主张世界级文化的持续活力，部分是作为抵抗他们法兰克福学派德国同事所说的（很大程度上是美国的“文化工业”日益增长的霸权的手段。霍尔是一个因在牙买加作为殖民者的成长经历而形成的“文化比较者”，他讨论亨利·詹姆斯作为“离散”小说家以及种族、阶级或当代电影的政治同样游刃有余。这一代战后批评家既出现在校园，也出现在好莱坞的山丘。


    如果伯明翰学派和法兰克福学派都倾向于左翼，即对主流正统和结构进行马克思主义分析，但他们之间存在重要的差异。例如，与他们的德国同行不同，英国文化理论家——霍尔简洁地将其策略定义为“从文化角度谈论政治，从政治角度谈论文化”——对作为身份和阶级意识表达的青年文化特别感兴趣，同时也对来自西印度人或东亚人等移民和少数文化的政治感兴趣。然而，这两种方法之间决定性的区别在于，英国文化理论家不仅对高级艺术感兴趣，而且对日常器物感兴趣：报纸、电影、电视、广告。在战后阶级扁平化的时代，文本可以可以是任何被指定为文本的东西；是我们感知文本的方式赋予了它这种地位，而不是其内在品质。文本性，似乎是产生于观察者的眼中。


    这对比较文学的影响是显而易见的。在大众媒体时代，比较者现在有两种基本路线可选：要么紧抓住“正典”作为文化的唯一合法来源；要么拥抱文本革命的奇异新世界。罗兰·巴特的《神话》（*Mythologies*,
    1957）为这两种文化之间日益模糊的界限提供了早期解释。


    这本书作为对“符号学”（*semiology*）或符号科学的研究，在许多方面都是 20 世纪 50 年代发展的媒体研究的入门读，暗示了“理论”和“文化”是如何作为相互影响的概念出现的。现代性像古代一样，有其神话，而巴特的敏锐眼光在最出意料的地方发现了被用来服务资本主义的：摔跤、肥皂广告。在其中一文中，他解读了《巴黎比画》（*Paris
    Match*）封面上一个穿制服礼礼黑男孩照片（见图 9），将其解读为一系列能指的集合，旨在展示“法国是一个伟大的帝国”，能够唤起不论种族或肤色的公民的忠诚。


    ![img/25120aad273470726fe1ab8dbadae03d_52_0.png](一种光光杂志上事实、观点、决策的比较顺序：殖民主义。转录自罗兰·巴特，《神话》（1957年）。


    巴特借此暗示，我们都是现代时代伟大洗脑运动的共犯，被高层商界和贪婪的政府所蒙骗。他以极大的机智揭露了意识形态操纵时代的文化运作，敏锐地识别了语言符号传达出比其含义更多信息的方式。


    然而，巴特这项具有开创意义的研究还表明，文化的作用正变得日益政治化。巴特采用了一种在未来五十年中变得常见的路径，即高文化挪用低文化的路径。通过严肃地对待媒体，同时揭露其操纵机制，批评家能够不仅证明他生活在那个时代，而且证明他对其诡术了如指掌。巴特借此暗示了他自己的、元历史的叙事：神圣的是批评家，拥有
    X 光视角的知识分子超人，能看穿当代文化的意识形态结构；邪恶的是资产阶级，法国知识分子群体中反复出现的反派，与消费主义的虚假意识结合在一起。因此，这种方法——被沃尔特·本雅明或西奥多尔·阿多诺等早期思想家所预见——实际上是用一种神话取代了另一种神话，即一个面对压倒性力量却毫不畏惧的批评英雄。


