    7. 弗朗西斯·培根《新工具论》（1620）扉页描绘的赫拉克勒斯之柱。


    这并不是说比较文学是白人盎格鲁士新教徒的专利。到19世纪70年代，比较研究开始出现在欧洲的最东端。1872年——即乔治·史密斯出版《吉尔伽美什》的同年——莫斯科大学开设了世界文学系；1875年，圣彼得堡随后成立了“新哲学学会”。这一国际倡议背后的灵魂是一位名叫亚历山大·韦索夫斯基（1838–1906）的文学历史学家，他后来成为俄罗斯比较文学发展史上最重要的人物。韦索夫斯基开创了对国际文学模式的研究，以此作为理解发展模式的一种。他特别对民俗和童话感兴趣，利用比较方法探索了东方（俄罗斯）与西方（欧洲）的关系。他的《俄罗斯文学中的西方影响》研究首次于1881年出版；到1916年，它已经经历了令人印象的五个版本，表明了其广泛的受欢迎。


    韦索夫斯基将比较文学视为对来源和影响的研究，其重要性源于19世纪末俄罗斯的历史背景。对于韦索夫斯基来说，对于他的许多同时代人和同胞——所谓的“银时代”的一代人——俄罗斯是一个文化落后的大陆，只能通过看向西方来发展。他认为，通过与西欧的比较可以教授俄罗斯文化的进步。最终，这对俄罗斯是有利的，因为俄罗斯文化的接受性确保了它变得更加丰富、更加强大。通过吸收国际影响，民族文化呈现出更完整的自我。

