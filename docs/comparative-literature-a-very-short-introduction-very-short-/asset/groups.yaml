    无论国家历史或语言地位如何，比较文学作为一种跨国界的写作研究而发展起来，但它尚未构想出一个没有边界的世界。显而易见的是，这种目标永远无法完全实现，因为教育具有开放性的本质，而从其词源意义上来说（e-ducare），它被视为一个“引导人们出去”的过程。


    这也是资本主义的本质。比较文学如果不是市场驱动的，那就无一物了；关于比较自由运作的这种天真想法，很快就会建立在冷硬的商业交流之上。一系列社会因素决定了具有国际视野的读者——他们的受教育程度、经验、文学翻译的资助与营销——但批判理论显然在名单上很靠后。现实是，文化差异更多是被感知而非被理解；出版者正如他们必须做的那样，会发生碰撞。尽管学术界对“他者”充满了痴迷，但许多读者在寻找更多相似的内容，寻找对从地球一端到另一端文学中发现的所谓普遍存在的确认。从这个意义上说，商业现实是不可比拟的。


    然而，正是因为如此，比较文学的概念才是必要的。它的任务是与比较偏见合作，同时也反对这些偏见：向一种文化提出提问并传递给另一种文化；并确保糟糕写作的诚意。这种评估难道不是由那些要评估世界文学优劣的人来完成的？如果国际奖项是根据政治因素决定的，那么比较性信息就是至关重要的。在书籍的生态系统中，比较文学发挥着一种务实且专业的角色。


    当然，这种务实主义还延伸到了日益重要的“数字人文”领域。由于本质上是跨学科的，对人类传统的数字化方法——无论是在线编辑形式还是书目图表——都是以计算机方法为主，推向越来越巨大的数据。在一个需要更多信息综合的世界里，比较仍然是不可或缺的工具。事实上，在许多方面，令人惊讶的是21世纪的信息处理方式如何呼应了数字人类的方式：拥有电脑的哲学家，拥有键盘的数字文化。哲学的未来也是过去的未来；欧内斯特·雷曼关于“比较是批评最大的兴趣”的说法，在1848年和今天依然属真。


    过去与现在思维的差异，在于我们所拥有的海量信息。1935年，保罗·瓦勒勒在试图对现代思维进行评估时，他可以说“所有知识必然是必要的比较性知识”；在世纪后的今天，这仅仅说明了这种观点有多么正确。在互联网时代，比较者不仅知道要比较什么，还知道该如何比较。如果“比较列表”（comp
    list）不会变成“比较列表”，即文本和作者仅仅通过比较杂乱无章地堆积在一起，那么人类的判断仍然是不可或缺的。随着海量信息的即时可用，当代比较文学与其说是建立联系，不如说是首先知道位置在哪里；布兰斯关于比较者望远镜的意象现在可能被重新构想为一个万花筒，向内观察。


