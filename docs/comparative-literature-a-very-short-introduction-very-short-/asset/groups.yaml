    ## Reception studies


    If translation means one of moving carrying over, ''reception'' describes another.
    Translation means meaning between languages, as it is on a horizontal axis; reception
    traces meaning through languages, on a vertical axis. Translation is of course
    itself a form of reception—not least because the major works are constantly being
    retranslated—but its comparative thrust is largely geographical, across languages
    and cultures; reception, in principle, by definition, works historically—drawing
    attention to what readers and cultures do with translations. Clearly, anything
    can be ''received'' by a later culture—certain theoretical de-facto schools, such
