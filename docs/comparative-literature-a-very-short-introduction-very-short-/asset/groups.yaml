    Bhabha）提出了这一最初的“杂糅性”（hybridity）概念，这种状态是指殖民主体模仿主权，从而获得了一种对殖民者与被殖民者之间不断变化的权力平衡的跨洲视角。此外，“自我异质恋癖”（autoeoticism）——即故意利用帝国的歪曲描述来将其反转，如爱尔兰人对他们独特性奇性的夸大——已成为一种促进后殖民状态生产力的尝试。简之，比较已经发展成了一种混合体。


    如果比较文学处理民族主义的感伤，值得注意的是，后殖民主义很大程度上是由民族主义修辞驱动的。它通常不是20世纪毁坏欧洲的那种粗俗的极右翼类型，而是更像席勒关于“弯翼”的形象（被伊克巴尔呼应），这种翅膀在独立中向所谓的优越力量发起反击。例如，格里桑和巴巴哈都强调了这些主题中国家写作的主体性：格里桑将国家文学定义为“每个群体命名自己的权利”；巴巴哈声称，“越来越多地，“国家”文化是从被剥夺权利的市场视角产生的。换句话说，后殖民主义的国际模型是建立在国家自我主张的基础上。正如我们所看到的，这就是比较文学的历史。


    ## 世界文学


    如果自千禧年以来有一种强有力的比较模型，那就是世界文学。这个术语并不新鲜，正如我们在上一章中看到的：从维尔兰德（Wieland）和歌德（Goethe）到布兰特（Brandt），它在整个19世纪作为比较文学的事实研究而共鸣。然而，在此期间，它的视野显然是欧洲中心主义的，削弱了由帝国所控制的准殖民主义世界观。直到20世纪的到来，世界文学才转向全球化。


    这种努力的具有启发性的案例可以在世纪末的关于孟加拉语世界文学的辩论中找到。1901年，诗人兼多才学者拉宾德拉纳特·泰戈尔（Rabindranath Tagore，1861–1941）受邀向加尔答的国立教育委员会发表演讲。泰戈尔坚持不讨论殖民文学，而是讨论世界文学；他认为，孟加拉语词汇“Vishwa
    Sahitya”在涵盖印度次大陆的多样性方面大得多，部分原因在于它并不对应外国的欧洲比较文学概念。泰戈尔拒绝他认为的西方对“国家”这种成问题的强调，转而强调文学的动态的、相互依赖的本质，他将文学视为由不同人之手创作的作品，但是“人类普遍创造力的一部分”。泰戈尔告诫说，我们大多数人像一个“乡巴佬”一样思考文学，将土地一块一块地分割分块。这种地方主义与他的“Vishwa
    Sahitya”概念背道而驰，后者被理解为通过语言艺术表现出来的“普遍精神”。


    近一个世纪后，另一位孟加拉思想家提出了世界文学的另一种形式。在她的《学科的死亡》（1993年）威尔斯利讲座中，盖雅特里·查博尔迪·斯皮瓦克（Gayatri
    Chakraborty Spivak）——她的“底层”（subaltern）概念帮助开启了80年代关于如何为少数文化发声的辩论——概述了一种可以称为后殖民形式的世界文学：“平面性”（planarity）。英语文学、法语文学等标准模型在后殖民时代已无法生存，斯皮瓦克现在的这种方法是一种考虑了比较文学的非西方传统的比较版本，它允许“全球南方——第三世界”通过自己的语言进行自我寻求，而不是通过一个中心化的大都市。斯皮瓦克对“世界”相对于“比较”的诗意概念持反对意见：全球化暗示着控制和标准化；而另一方面则是我们所居住的，即是“借用”（loan）。她没有引用泰戈尔的生态比喻：对于全球变暖和气候变化的时代，这些变化都是以超越地理差异的方式相互联系的。世界文学必须成为行星文学。


    这两位孟加拉思想家的例子——以及其他其他人，如作家兼评论家布达德德夫哈·博斯（Buddhadevha Bose）或印度的迪佩什·查博尔基（Dipesh Chakraborty）——声称世界文学通过扩展到其欧洲起源之外而复兴了。对“历史主义”发展方法的批判——即欧洲的资本主义现代性产生并不可避免地扩张——甚至延伸到时间的概念，即受缚于格林尼治时间，而非全球子午线。然而，比较文学的演变可以从这些角度受到批评（尽管我们没有人的扩张意图可能如此。同样，来自他处的视角也包含来自欧洲的视角）。


    没有理由认为真正的洲际世界文学模型是不可能的。事实上，作为欧洲的一个引人注目的对比，由于是由许多语言和亚文化的集合，我们可以勾勒出适用于所有大陆的比较文学。在后殖民时代，每个大陆都需要源自欧洲的模型。战后时期最具影响力的世界文学模型是多产的法国学者勒内·埃蒂安（Rene
    Etienne，1909–2002），他将其称为“普遍文学”（littérature universelle），不倦地证明亚洲和欧洲文学如何探索主题和风格问题。埃蒂安的口号——如萨特的人文主义（1963年）——不仅建立了法国的后殖民学科，也扭曲了刻画“世界”的局限视野。在蒙特斯鸠和伏尔泰等著名先驱遗产的基础上，埃蒂安展示了巴黎人如何向波斯人学习。


    近期，这种世界文学全球化的概念在社会学术语中被复兴了。帕斯卡·卡萨诺瓦（Pascale Casanova）在《文学世界共和国》（1999年）中的影响力的她提出的不是世界文学，而是“世界文学空间”作为世界文学的关键。历史和政治虽然在历史上被观察到，但并非同一事物；一个国家的自豪感——她以德国文学为例，它在文化上反击拿破仑霸权——是在政治上无法做到的地方。在卡萨诺瓦的社会学术语中，国家文学和国家作家为了国际合法性而相互竞争。

