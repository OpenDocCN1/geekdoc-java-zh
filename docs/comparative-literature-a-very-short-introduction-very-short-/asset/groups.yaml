    what internationally minded readers—levels of education, experiences, the funding
    and marketing of literary translation—but critical theories are surely long way
    down the list. The reality is that cultural differences are more perceived than
    understood; publishers, as they must, collide and preceptions. For all academic
    obsession with the ‘Other’, many readers are looking for more of the same, confirmation
    of the supposedly universal beings found in literature from one end of the globe
    to the other. Commercial realities, in this sense, are beyond compare.


    It is precisely for this reason, however, that the concept of comparative literature
    is necessary. Its task is to work with, but also against, comparative preconceptions:
    to questions from one culture and pass to another; and to ensure the good faith
    of bad writing. This kind of evaluation gets some who is to assess the best and
    worst of world literature if not comparists? If international prizes are to be
    decided on political grounds, then comparative information is essential. In the
    ecology of books, comparative literature has a pragmatic, and as a professional
    role to play


    Such pragmatism extends, of course, to the increasingly important sphere of ‘Digital
    Humanities’. By nature interdisciplinary, digitized approaches to the Human tradition—whether
    in the form of online editors or bibliographical diagrams, computer approaches
    to the maximum, pushing ever-bigger data. In a world in which more information
    requires synthesizing, comparison remains the indispensable tool. Indeed, the
    striking thing, in many ways, is just how the 21st-century approach to information
    echoes that of the digital humans: philosophers with computers, digital cultures
    with their keyboards. The future of philosophy is also that of the past; Ernest
    Reman’s claim that ‘comparison is the greatest interest of criticism’ remains
    as true as it was in 1848.


    The difference between then and now, of the mind, is the sheer amount of information
    at our disposal. In 1935 Paul Valéry, when attempting an assessment of the modern
    mind, could that say ‘all knowledge is necessarily necessary comparative knowledge’;
    it barely stating how much this is true at the century later. In the age of the
    Internet, the comparist is not merely knowing what to compare, but also what to
    compare. If ‘comp list’ is not to turn into ‘comp list’, with texts and authors
    simply piled up nausam by a comparison, then human judgment remains indispensable.
    With vast amounts of information instantly available, contemporary comparative
    literature is not much about relating as knowing where in the first place; Brandes’
    image of the comparist’s telescope might now be reconfigured as a kaleidoscope,
    looking in in every possible direction. Flooded with data, the perspective is
    an all-time premium.


    Yet such an overload is overcharacteristic, not just of our ours, of multimedia
    era, but also of modernity as the free era of the 1800s. The increasing prominence
    of comparison as an intellectual model began, in the Post-Revolutionary proliferation
    of literature in the 19th century; the more people knew about other cultures,
    the more they compared. They still imposed—their own prejudices on this knowledge
    tell as much about human nature as about comparative literature, but it does not
    diminishing the importance of comparison to the modern age. How, can one understand
    one’s era as modern, unless is it by implicitly comparing it with the past? Modernity,
    Antiquity is a comparative concept.


    It may be, in short, comparative literature needs to understand itself more comparatively.
    Cognate approaches to other disciplines—comparative history, comparative law,
    comparative politics—are often considerably firmer in their grasp of their own
    methodology, triangulating themselves more rigorously within the sphere of global
    relations. Pursed as close'
  - '[PAGE 66]


    or distant reading, creative practice or as critical theory, comparative literature
    can surely learn from the global history approach to the universalization of ideas,
    or from the social sciences approach to the ways in which information circulates—with
    the aim of abjuring its Humanist method, but expanding of it. If comparison, literary
    studies must consider what it can learn from looking literature.


    For remains most surprising is just how much comparative literature in the 21st
    century hides in plain sight. Its practice is everywhere, the very basis for how
    we gather knowledge; practitioners, often struggle to attain the visibility of
    critics based within one language, torn as they are competing traditions. Many
    of the most comparists are not even known under this name, but figure rather as
    literary theorists, cultural critics, or eccentric polymaths. It is in the interests
    of comparative literature that this such change, and that the exponents gain prominence
    as comparists in the public, as well as in the professional, sphere. As the most
    demanding of literary disciplines, comparative literature should attract the brightest,
    most ambitious students; but aspiring comparists need role models, and are not
    always present in literary debate, as is by national traditions heavily invested
    in their own primacy. It is striking, if perhaps unprising, how many leading comparists
    grew up in multilingual environments (comparative literature is in this sense
    among the most personal, and of intellectual activities). With the right models,
    however, anyone can aspire to a multipolar perspective. From the profoundly monocultural
    world of the British education system, for one I was inspired by the likes of
    George Steiner or Edward Said to discover other traditions, and to explore the
    essential interconnectedness of all cultures; the initial difficulty, the challenge
    to raise my sights beyond comfort zone, was part of the appeal. Such exemplars
    are sorely required in present times. Cosmopolitanism, especially in the Anglo-Saxon
    world, need all the support it can get.


    Comparing literatures is a complex process, fraught with theoretical, practical,
    and political dimensions. Their ambition, however, is a simple one to understand
    the ways in which literature interacts. As the discipline moves ever further away
    from its European origins, the future of comparative literature depends on retaining
    this coherence despite its worldwide reach, articulating its place at the center
    of the Humanities, and on making intellectual virtues out of institutional necessities.
    comparative literature is to become the philology of the future, it must build
    on the achievements of the past, while working within the structures of the present.
    From politics to philosophy; from history to linguistics, comparists have always
    drawn on the broadest possible range of approaches to culture; in general, generalists
    de continue to play a vital role in shaping and supporting the life of the mind.
    International, interdisciplinary forms of knowledge remain, in short, the very


    essence of modernity. Now more than ever, the aesthetic education of comparative
    literature is indispensable.


