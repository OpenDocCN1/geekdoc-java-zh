  mdcn: '

    将这种谬误的反复出现视为国家和国际因素的体现，这些因素根据其自身的准则和语境证据，提供了对某一时期自我理解的洞察。若要对浪漫主义作为一个时期范畴给予充分公正（以本节的主要示例为例），事实上必须成为一名比较者，因为它在法国和意大利的主要作品直到19世纪20年代和30年代才出现——这在它于英国和德国首次盛行之后整整了一代人的时间——而且在某种程度上构成了对英国和德国先例的回应。


    当人们将时期划分引入个人作品集时，会出现另一个相关问题。我们谈论“早期”或“晚期”莎士比亚，并不是声称这些类别本身就是批判性的建构：直到爱德华·多登（Edward
    Dowden）在19世纪70年代的研究，我们现在才开始将最后几部剧——“传奇剧”《暴风雨》、《冬天的故事》和《辛德林》确立为一个独立的群体。然而，多登对莎士比亚晚期风格为“庄重而欢快”的观点，仅局限于一种可能的晚期模式；同样合理的或许是西奥多·阿多诺（Theodor
    Adorno）在贝多芬晚期作品中（仅举例）提出的摩擦法（rubative method）。换句话说，对晚期风格的充分理解只能通过比较其在不同艺术文化模式中的多种表现来产生。


    这种时期划分的方法暗示了比较研究日益广阔的视野。几十年来，比较文学的务实需求日益趋向于反向操作，聚焦于某一特定点：维吉尼亚·伍尔夫（Virginia Woolf）曾著名的声称：“在1910年12月左右，人类发生了变化”；这种重大变化的原因和表现是比较者的任务。这种视角可以取得丰硕的结果（以这种方式处理的其他年份包括1913年、1922年和1926年），但它也面临着变得盲目的风险，将评论家限制在比较年份的人为约束中。尽管某些划分仍然是不可或缺的，仅仅是为了调节预期。泰德·安德伍德（Ted
    Underwood）在最近对消失时代的深入考量中写道，“文学培养读者的力量，是隐含地将它们与现在对比，并相互对比”。比较文学在设定这些时代方面的力量不仅是针对彼此的，而且是针对它们在不同国家传统中表现出的相互替代版本。


    那么，这换句话说意味着我所称为“地理”轴线——跨越地区和语言——与历史方法同样重要。事实上，由于它的主张更为深入，因为可以设想一种仅跨越不同文化的比较方法（例如，比较阿拉伯、印度和欧洲的现代主义），而不考虑它们的历史变迁；而比较文学实际上并不可能仅仅是历史性的（因为这会属于简单语言传统的范畴）。在其他其他顺序上，比较必须在向回看之前先向横跨越看。


    诚然，“区域”的概念并不比“时期”那么争议。比较文学最大的优势之一——事实上，这在许多方面是它的宣言——在于，它能够通过广泛的跨文化方法动摇人们对文化区域的预设。当视角转变，比较就变成了“跨国”区域，例如拉丁美洲或印度等地区的情况表明，这些地区的历史和文学与欧洲一样丰富。我们还必须证明，正如引用自一个有影响力的标题所言，“大陆神话”继续提供我们的元地理范畴：为了修辞论证，比较者认为有必要将区域等同于同质的文化传统，称为“欧洲”、“西方”、“东方”或“非洲”。


    当然，我们对这些类别的内涵有一个粗略的了解，但比较者陷入了双重困境：既需要使用它们，又需要拆解它们。因此，“欧洲人”或“东方主义者”与他们工作的区域术语之间存在着矛盾的关系，因为这在地理上是合理的，在文化上又是值得怀疑的。换句话说，对特定传统的声张也是对这一传统的批评主。


    显而易见，此类主张只能存在于特定的政治参数之内。以战后欧洲为例，东、西两大极发展出了它们自身的吸引力，并决定了比较的主要轴线。法德两国对比较文学的主导地位在整个世纪中让位给了英美霸权；这反映了文化和政治结构的更广泛的现实——尤其是全球英语日益的普及——这当然不是巧合。沃尔特·科恩（Walter
    Cohen）在其精辟论述的《欧洲文学史》（2017）中指出，自文艺复兴以来，西欧一直是其成功的受害者，形式和内容——方语对拉丁语的胜利，叙事性小说日益占据统治地位——以牺牲全球选择为代价放弃了当地偏好。在这种背景下，比较文学面临着一种反向殖民危机的风险。


    在东欧，比较文学日益集中在苏联。这种集中的化政策——有许多作品被翻译成俄语，但几乎没有超过保加利亚语或波兰语等“小”语言的使用——在一个本质上是多语言的地区显得尤为显著。正如卡莱尔·艾默森（Carlyle
    Emerson）和盖·托多洛夫（Gary Todorov）所指出的，多元欧洲产生了文学小说的许多领先者。“斯拉夫”文化——为了与该地区的任何国家传统竞争——是一种同情的产生，由俄罗斯主导，但指向法国和德国的西方威望。“中欧思想的肥沃土壤本应被用于单一的、国家资助的议程，”这表明了比较文学在很大程度上取决于权威的礼俗。


    除了东方和西方，欧洲内部这种比较文学的区域状况可以很容易扩展到南北。在这里，北欧的比较模式将斯堪的纳维亚比作一个独立的整体，这意味着其历史一直致力于将丹麦、瑞典和挪威文学进行相互比较。希腊罗马遗产意味着地中海被视为世界的“中心”；现代历史学家坚持认为，费尔南·布劳德尔（Fernand
    Braudel）在撰写其巨著《菲利普二世时代的地中海世界》（1948）时是德国的囚犯，这仅仅强化了这种认知。

