    \ between them. As, the contrasts are as important as the comparisons, the disconnections\
    \ are instructive as the connections.\n\n# Comparative literature in the 21st\
    \ century\n\nBut\n\nWhat we might justify take the adjective 'comparative' to\
    \ convey, that the idea of comparison—in conjunction with the idea of literature—is\
    \ as important as the practice. The animating impulse of comparative literature\
    \ is not just the urge to take a broad perspective across different forums and\
    \ languages of literary expression; it is also the—politically, ethically, and\
    \ aesthetically charged—notion that is a worthwhile undertaking in the first place.\
    \ Comparative literature cannot get by in words, without a pinch of pathos, since\
    \ it is the utopian dream of being in 'no place' (a-topos)—and thus in every place—that\
    \ drives.\n\nMore provocatively, comparative literature is also a question of\
    \ themes and techniques. Often undertaken through the pressure of overarching\
    \ categories—such as sources, influences, motifs, genres, and myths—comparative\
    \ literature constructs its arguments through a wide range of possible examples\
    \ and counter-examples. The only orthodoxy is diversity, the attempt to incorporate\
    \ other perspectives than one's own. This is not only of the critical perspective\
    \ of the reader, but also the creative perspective of the writer. For comparative\
    \ literature is a technique as well as a theory: from Cervantes' claim Don Quixote,\
    \ the first modern novel with an Arabic, to the postmodern practice of constituting\
    \ texts through other texts, modern literature could not exist without recourse\
    \ to the comparative method. Method is, that is, not just after the event, in\
    \ the mind of the reader, but also already during the process of composition,\
    \ in the mind of the writer. What we call intertextuality—T.S. Eliot incorporating\
    \ Sanskrit into The Waste Land, Shakespeare echoing Montaigne—is simply another\
    \ form of comparison, whereby meaning emerges out of the interaction between texts.\n\
    \nThe relationship between intertextuality provides one example of how comparative\
    \ literature is defined by its strategic position between languages, literature,\
    \ and culture. Literary theory, cultural studies, postmodernism, world literature,\
    \ translation studies, and reception studies: comparative literature in the 21st\
    \ century draws on all these disciplines and more. Out of these points of intersection\
    \ emerge a number of recurring debates—the changing notions of 'high' and 'popular'\
    \ culture; the shifting hierarchy of 'original' and translated texts; concepts\
    \ and criticisms of the 'canon'; status and composition of the 'text'—debates\
    \ that comparative literature is among the most dynamic of intellectual fields.\
    \ Irrigated by any number of sources, it overflows with ideas as to conceive the\
    \ role and purpose of the verbal arts in an ever more visual world.\n\nFor this\
    \ indeed, is perhaps the principal function of comparative literature in the 21st\
    \ century. Comparatively speaking—a disciplinary necessity—the subject has emerged\
    \ in surprisingly good health from the recent squeeze on the Humanities across\
