    and empirical in its endeavours. In the spirit of postwar democratization, the
    undereducated as well the overlooked were afforded equal legitimacy in their customs
    and habits, the mandar and the masses were viewed as part of the social fabric.
    With a panoramic perspective, a new discipline became: cultural studies.


