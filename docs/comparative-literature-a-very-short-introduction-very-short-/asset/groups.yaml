    **摘要**


    “实践与原则”探讨了“做”比较文学意味着什么。可以识别出若干基本原则构成了比较文学学科实践的要素，并可以被视为一组概念对：课题与方法；时期与地区；细读与泛读；经典与反经典；体裁与风格；以及创作者与读者。在考虑比较文学的实践和原则时，从创作者和评论者的双重视角来考虑它们是重要的。这种双重视角正成为该学科的焦点。没有作者，读者无法比较；没有阅读，作者无法比较。


