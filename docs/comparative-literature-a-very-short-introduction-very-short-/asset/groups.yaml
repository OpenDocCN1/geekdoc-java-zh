    这种寻求不仅存在于东方与西方之间，也存在于古代与现代之间，它预示了19世纪比较的关键。对于1800年左右写作的欧洲评论家来说，比较的行为显著地跨越了时空。这种双重强调的主要原因——这些原因分别是政治的、历史的和文化的——告诉了我们比较文学在其早期的地位和目标。从哲学角度上说，19世纪见证了人类语言学的兴起，由于其早期作为一种跨学科研究的思想，这门新科学迅速影响了更广泛的欧洲比较观念。事实上，这是德国成为19世纪语言的主要原因之一；如果说德国在19世纪初不是一个民族强国，它也是一个特定的文化体。


    然而，这一时期的知识突破——这一使比较文学作为一种独立的阐释方法而成为可能的突破——既具有文化意义，也具有哲学意义：即从现代批评家的神圣形象的转变。也就是说，圣经应该像对待任何其他主题一样，通过夸张和历史演变来批判性地阅读；“耶稣传”——援用弗里德里希·施劳斯1835年极具争议的书名——变得像任何其他事件一样具有历史性。1848年写作时，法国评论家埃尔内斯特（1823-1892）声称，德国开启了“现代性精神”，其批评方法使他放弃了教会职业，这条路径预示了19世纪人文科学日益增长重要性。此时人文科学的核心——以及比较研究转向古代语言和文化的核心——是出于对“起源”的追寻。


    在达尔文之前的19世纪，“起源”本质上是一个政治关注点。帝国的野心和竞争驱动着欧洲列强在古代语境中寻求合法性：对文化前身的的识别——对于德国人来说是希腊，对于希腊人来说是罗马——既是选择性亲和的某种标志，也是一种高度应用的偏见。比较文学无非是竞争性文学，是一种试图通过流行来彰显优越性的模糊且充满争议的尝试。这种竞争发生在欧洲内部——主导国家在一种文化扩张中进行竞争——但回到我们的起点，它也发生在欧洲之外，“比较”被用作一根大子，用来驱打文明之外未开化的野蛮人。马考莱勋爵在1835年著名的名言“一个优秀的欧洲图书馆的一架书就比整个印度和阿拉伯的本土文学更有价值”说明了这种偏见，并指向了比较方法在这些早期出现时的局限性。在少数体面的例外之外，将欧洲文化理解为更广泛的全球文化的尝试，都是由不可置疑的优越性假设所决定的——从长远来看也被这种假设所破坏了。无论好坏，超越这一假设的斗争将定义这一学科。


    ## 通向世界文学


    然而，有许多替代方法表述这种偏见假设，它们的并列指向了随着19世纪的推进而出现的更广义的比较文学。两段陈述——一个鲜为人知，另一个可能因为过于著名而显得过头——展示了方向。在他1825年的《反思的辅助》集中，国际上最著名的英国浪漫主义者塞缪尔·泰勒·柯勒律以以下术语写了一个长长的脚注：


    假设思维机能包含内在的形式，即反思的方式，这些方式并不取决于被反思的对象，而是由理解力本身的结构和机制预先决定的。在这些形式的某些形式下，相似性和差异必须被提交以便是可理解的，并且先验地是可以比较的。


    柯勒律的这段随口评论构成了这个人与19世纪不加思考的偏见的对应物。是的，他承认，我们比较的方式是由感知器官的“内在形式”预先决定的——但这与其说是一种文化偏见，不如说是一种哲学上的指责：我们无法比较我们无法想象的东西。由于“相似性和差异”只能从一个特定的、有限的观点进行判断，那么意识到这一点比盲从于它要好。正如迪蒂·哈里（Ditty
    Harry）所说，人知道自己的局限性。


    柯勒律的哲学表述为比较文学史上可能影响影响力的陈述提供了新的切入点。1827年，德国诗人歌德分享了他对诗歌日益国际化特性的看法；这些由他的对话伙伴约翰·埃克尔曼记录给后世，并标志着“世界文学”（Weltliteratur）的诞生。


    我更关注的是……诗歌是人类共同的财产，它揭示了一切，有时体现在成百上千的人身上。……民族文学现在反而是一个异常现象；世界文学的时代已经到来，每个人都必须努力加速它的到来。


    在歌德研究我们声称的相反的“内在形式”两年后，他提出了相反的概念。在现代无关紧要的市场中，“民族”的或地方的文学模式变得越来越无关紧要；我们现在必须追求的是世界文学。歌德举例说，中国小说对我们来说就像他们的德国或法国同胞一样有很多要说的；重要的不是事情本身，而是他处理的方式。诗人不应该在记录事件上与历史学竞争——这是亚里士多德坚持想象力作家优于历史学家的遥远回响，因为前者不是描述事情是怎样的，而是它们可能是如何——而是应该“通过精湛的处理使简单的主题变得出花来”。对于歌德来说，比较对于风格是关重要的，而非内容。


    然而，诗人对他自己的号召的巨大投入很有趣，正如这一宣言本身。尽管歌德对扫射性的通用世界文学感做出了宏大姿态，但他并没有意识到偏见的问题：


    当我们重视最精妙的东西时，我们不能把自己束缚在某些特定事物上，并将其视为模型。我们不能将这种价值赋予中国人、塞尔维亚人或卡尔德隆，或尼伯龙族；但是，如果我们真的想要一个模式，我们必须始终回到古希腊人那里，他们的作品不断代表了人类的美。


    当歌德写到“反思的方式”时，他在反思反思的模型：鉴于不存在任何经验视角，我们该如何精细地评价文学？恰好，歌德的话说明了这个问题，因为他的转折——他声称我们不应该赋予任何特定的外国传统价值，相反地，我们应该赋予希腊人价值——揭露了他作为一个19世纪早期典型的希腊语德国人的观点。


    尽管具有普遍主义的雄心，歌德的世界文学模型是非常欧洲中心的。在这一点上，他在19世纪的前几十年并不孤单。歌德断言“正在产生一种通用的世界文学，其中为德国人留了一个体面的角色，”像菲拉拉特·查斯（1798–1843）这样的法国法国评论家在1833年的研究《外国文学比较》中也可以声称，“我将主要关注法国，……最敏感的国家。”极具深意的是，查斯通过将法国置于欧洲霸权的更广泛背景下，证明了他关于法国作为最敏感（因此最具有“比较性”）的国家的主张：“欧洲对于世界其他地方是什么，法国对于欧洲就是什么；一切在法国回响，一切在她身上结束。”查斯可以认为这既是爱国主义的也是世界主义的；民族主义被批准为


