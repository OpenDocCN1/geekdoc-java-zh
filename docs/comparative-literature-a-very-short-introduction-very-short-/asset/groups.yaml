    in these seminal years of the discipline. Working with an older colleague, the
    professor of comparative philosophy Samuel Brauss, Meltzl conceived the idea of
    a truly cosmopolitan publication. The title—Acta Comparationis Literarum Universarum—was
    originally given in three languages (Hungarian, German, and French) before settling
    into the transnational solution of Latin; contributors, declared, to be in more
    than ten official languages. Perhaps the practice did not quite live up to the
    theory, with over two-thirds of the essays published in either Hungarian or German.
    Equally inevitably, doubt, the success limited to such an ambitious enterprise,
    with no more than a hundred copies ever printed. It was in many ways that the
    journal lasted as long as it did, running for eleven years before shutting down,
    due to rival publications, in 1888.


    From the disciplinary perspective, however, the founding and the closing of Acta
    Comparationis tell an eloquent story. Meltzl’s manifesto for the journal, published
    in the first issues of 1877, for comparative literature—understood in the 19th
