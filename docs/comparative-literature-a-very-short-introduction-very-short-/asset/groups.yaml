    ## Cide-Hamete Benengeli


    It is no coincidence, then, Jorge Luis Borges has chosen Cervantes'' masterpiece
    as the pretext, in both senses of the term, for his astonishing meditation on
    the nature of translation. The short story ''Pierre Menard, Author of the Quixote''
    (1939) is both satirical and sensual. Menard''s inspired idea is to translate
    Cervantes word for word from Spanish into Spanish; with a straight face, Borges
    notes how revelatory it is to compare Menard''s Don Quixote with that of Cervantes.
    When the latter, writing in the early 17th century, adduces ''truth, whose mother
    is history'', the former, in the 20th century, proposes the exact same sentence;
    the idea is hailed as ''astounding''. Menard thus becomes the author, not the
    translator, of Don Quixote. As a commentary on translation, reception, and on
    the contextual bias of comparative literature, the Argentinian author''s story
    of a fictional Frenchman rewriting the Spanish classic is a stroke of genius.
    It is also, however, itself a work of comparative literature, conflating creative
    vision with creative vision.


    Borges'' story points to the increasing self-awareness that attends modern forms
    of comparison. Educated authors cannot be aware of their modern, postmodern, ''condition'';
    to write in the contemporary era is to situate oneself within the history not
    only of literature, but also of comparative approaches to literature. Postcolonial
    writing provides important examples of this: contemporary authors such as Amitav
    Ghosh or Nggĩ wa Thiong''o write in full knowledge of the leading theories of
    their condition, as they are to see the imperial legacy (so much, indeed, that
    Nggĩ now writes, again, in his ‘local’ language Gikuyu). Just as writing in the
    21st century is born ‘digital’, so some texts are born ‘hybrid’ or translated.
    Decolonising the Mind, to cite the title of Nggĩ’s seminal study of 1986, if not
    a self-conscious process; comparing the minds of Europe and Africa—and not least,
    of the many different people within Africa—is heavily theorized from the start.


    In comparative literature from the point of view of the writer, then, it may be
    useful to distinguish between degrees of self-consciousness. For there is an important
    difference between consciously encouraging the reader to compare and contrast
    (the modernist, postmodernist, or postcolonial model) and unconsciously rearing
    oneself into situations that can be read comparatively (one might call this realist
    model, but it also applies to broad swathe of literary history more). In the former,
    the writer invites the comparison; in the latter, it is the reader who imposes
    it, albeit onto receptive ground. Intertextuality may be the strongest mode of
    authorial comparison, but it is not the only mode.


    All this is a way of saying that writers are also readers, first and foremost
    of one. The more internationally minded among them—modernists, postcolonialists—are
    the most obviously comparative, but all writers to compare and contrast themselves,
    implicitly or explicitly, with other forms of literature. Anxiety of influence,
    in Harold Bloom’s famous phrase, is also the anxiety of comparison, the never-ending
    attempt to disambiguate one’s work from that of others, without whom could not
    exist in the first place. Literature, whether consciously comparative or not,
    is a dance of similarity and difference, and it is writers, not readers, who set
    the tune.


    When considering the practices and principles of comparative literature, then,
    we would do well to consider them from the perspective of both creators and critics.
    The increasing prominence of hybrid forms such as adaptation and ‘inter-art’ studies—where
    the emphasis is on the ways which creation is inherently comparison—suggests,
    indeed, that this double perspective is emerging as a focal point for the discipline.
    Readers cannot compare without writers, and writers cannot compare without reading.
    On such principles rest the many practices of comparative literature.


