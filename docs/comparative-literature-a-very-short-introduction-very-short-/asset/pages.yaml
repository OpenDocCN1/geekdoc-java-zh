  md: 'To study the history of the subject, however—and particular the close relationship
    in the 20th century between the Jewish diaspora and the emerging academic discipline—is
    to realize that comparative literature is not so much as policing borders as crossing
    them. Comparatists choose to distinguish themselves from their native cultures,
    to guard their ''home'' literatures in favour of a void homelessness, the better
    to gain purchase on tropes and texts that transcend any single idiom. They choose
    not to belong to any particular tradition—indeed, this ''unbelonging'' is arguably
    their defining characteristic. Intellectual emigrés, comparists makes links between
    cultures, but in doing so, arguably, reinforce the distinctions between them.
    As, the contrasts are as important as the comparisons, the disconnections are
    instructive as the connections.


    # Comparative literature in the 21st century


    But


    What we might justify take the adjective ''comparative'' to convey, that the idea
    of comparison—in conjunction with the idea of literature—is as important as the
    practice. The animating impulse of comparative literature is not just the urge
    to take a broad perspective across different forums and languages of literary
    expression; it is also the—politically, ethically, and aesthetically charged—notion
    that is a worthwhile undertaking in the first place. Comparative literature cannot
    get by in words, without a pinch of pathos, since it is the utopian dream of being
    in ''no place'' (a-topos)—and thus in every place—that drives.


    More provocially, comparative literature is also a question of themes and techniques.
    Often Undert through the pressure of overarching categories—such as sources, influences,
    motifs, genres, and myths—comparative literature constructs its arguments through
    a wide range of possible examples and counter-examples. The only orthodoxy is
    diversity, the attempt to incorporate other perspectives than one''s own. This
    is not only of the critical perspective of the reader, but also the creative perspective
    of the writer. For comparative literature is a technique as well as a theory:
    from Cervantes'' claim Don Quixote, the first modern novel with an Arabic, to
    the postmodern practice of constituting texts through other texts, modern literature
    could not exist without recourse to the comparative method. Method is, that is,
    not just after the event, in the mind of the reader, but also already during the
    process of composition, in the mind of the writer. What we make call intertextuality—T.S.
    Eliot incorporating Sanskrit into The West Land, Shakespeare echoing Montaigne—is
    simply another form of comparison, whereby meaning emerges out of the interaction
    between texts.


    The relationship between intertextuality provides one example of how comparative
    literature is defined by its strategic position between languages, literature,
    and culture. Literary theory, cultural studies, postmodernism, world literature,
    translation studies, and reception studies: comparative literature in the 21st
    century draws on all these disciplines and more. Out of these points of intersection
    emerge a number of recurring debates—the changing notions of ''high'' and ''popular''
    culture; the shifting hierarchy of ''original'' and translated texts; concepts
    and criticisms of the ''canon''; status and'
