    # 6 Intertextuality


    First introduced by the Bulgarian-French critic Julia Kristeva in 1966, the term
    ‘intertextuality’ has an astonishingly successful career across the Humanities.
    All, the original idea suggests, are constructed through ‘the absorption and transformation’
    of other texts; every piece of writing is a ‘mosaic of quotations’. Although this
    was almost literally true of modernist works such as The Waste Land or Finnegans
    Wuke—with their mixture of allusion, quotation, passion, and translation—in the
    more diffuse, metaphorical term encompassing any kind of reference by one text
    to another. As a model for comparative literature, intertextuality offers a broader
    canvas towards ‘influence’, it highlights not only the relationship of one work
    to another, but also the ways in which we make sense of this relationship through
    pre-existing frameworks. Meaning itself, in short, is to be found in the spaces
    ‘between’ texts.


    It is still writing. The theories and debates that defied comparative literature
    as the 20th century drew to a close—translation studies, cultural studies, cosmopolitanism,
    feminism, Orientalism—remain with us, albeit in altered form. Comparative literature
    has long since became a global enterprise (albeit one that has increasingly sought
    to question the very idea of globalization), and its present state reflects its—constantly
    contested—position as a literary United Nations. However problematic the historical
    emphasis on Europe remains, it has driven the discipline’s development as lubricant,
    informant, and secret agent of international relations. If comparative literature
    has become more politicized over the course of its history, it is only by understanding
    that history that is its present state—can be fully appreciated.


