    Evan-Zohar argued that the shifting status of translation within this polysystem
    reflects the shifting status of the target language. Put briefly, this means that
    whenever a culture considers itself ''young'', ''periphery'', or in ''crisis'',
    it seeks to reinforce its sense of self by translating works from elsewhere; as
    national self-defense develops, this essential need for validation fades away.
    Increased translation, in short, increases necessarily.


    What critics might make of this model—how it does square, for instance, with the
    fact that major cultures such as France and Germany translate—what is striking
    is how quickly such theory dates. It is not only that translation reflects changing
    cultural identities, in other words, but also translation theory. In the theoretical
    fever of the 1970s, the language of structuralist ''systems'' was in air, with
    Claudio Guillén & Evan-Zohar''s note on the literary polysystem. From the turn
    of the millennium, by contrast, binary discussion has moved on, with translation
    becoming part of a more politicized understanding of what Franco Moretti calls
    a ''world literary system'', then models of code and distant border crossing.
    The focus of comparative literature has not so much on what gets lost in translation,
    or on the ''untranslatable'' terms of Barbara Cassin''s dictionary that resist
    reconceptualization in another language. What Lydia calls ''translational practice''—the
    contextual resonance of words such as the Western ''self'' on the one and the
    Confucian ji on the other—has emerged as a way of shifting attention from straightforward
    claims of equivalence and towards subtle forms of exchange. If the epistemology
    of translation implies ''carrying over'', it is precisely that resists being carried
    over that is starting to claim the importance of comparatis. Such a development
    is merely the latest—and certainly not last—skirmish in the age-old battle between
    universalists and nationalists underlines the extent to which translation remains
    the prerequisite for, the very practice of, comparative literature.


    # Reception studies


    If translation means one of moving carrying over, ''reception'' describes another.
    Translation means meaning between languages, as it is on a horizontal axis; reception
    traces meaning through languages, on a vertical axis. Translation is of

    curse itself a form of reception—not least because the major works are constantly
    being retranslated—but its comparative

    thrust is largely geographical, across languages and cultures; reception, in principle,
    by definition, works historically—drawing attention to

    what readers and cultures do with translations. Clearly, anything, can be ''received''
    by a later culture—certain

    theoretical de-facto schools, such as the ''reader response theory'' of Wolfgang
    Iser and Hans Robert James, made the reception the

    very basic for literary making—but the reception is greatest where the lineage
    is longest. As such, the reception of Greek,

    Roman, and Arabic classics provides one of the most enduring models of comparative
    literature across the centuries, and can

