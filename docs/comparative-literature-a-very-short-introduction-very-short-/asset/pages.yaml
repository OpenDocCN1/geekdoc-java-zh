  md: 'The richness of this approach for comparative literature is self-evident. Comparatively
    speaking, it is better to receive than to give, since the latter context is enriched
    by the vestigial presence of the former. In the quarrel of the ancients and moderns,
    reception critics read the former through the latter, teasing the ways in which
    a later text draws on its predecessor. Indeed, in Jonathan Swift’s satirical version
    of the debate—the-called ‘Battle of the Books’, published as part of *A Tale of
    a Tub* in 1704—it is the books themselves that come to life and fight for supremacy
    (see Figure 10).


    ![](img/25120aad273470726fe1ab8dbadae03d_60_0.png)


    10. The Battle of the Books, original woodcut from *A Tale of a Tub* (1704).


    p. 180


    Swift avoids reaching a conclusion in the debate is only prudent. For the modern
    text may not be superior to the ancient one, it cannot help but be informed by
    it—as well, potentially, as by all the ways in which it has previously been received.
    Focusing on the reception of classical myth in the Victorian period might show
    us how the 19th-century ideal of masculinity was constructed through reference
    to Homeric heroes, but it may also retrospectively alter our view of how Homer
    was received in earlier times. The reception of ‘Oriental’ epics such as the *Arabian
    Nights* (first made available to a'
