  md: 'The realignment of comparative literature as a global discipline—with its attendant
    reassessment of the language of ‘centre’ and ‘peripheries’’—began to hold earnest
    in the 1960s. Indian, Chinese, and African versions of the discipline had long
    existed, with their own local emphases and inflections (the first department of
    comparative literature was opened in India in 1956, for instance), but they struggled
    to gain attention in a literature marketplace dominated by Western languages.
    By the time of the social upheavals of the 1960s, however, established structures
    and authorities were increasingly under fire, culturally as well as politically.
    The long march of postcolonialism shook the intellectual institutions of the West
    after the Black critic Franz Fanon published The Wretched of Earth in 1961, and
    the subsequent movements shared the sense of rising up in international solidarity
    against national structures. The literary—and in particular, ‘French’—theory that
    could shape comparative literary studies throughout the 1970s and 1980s developed
    out of this spirit of globalized thinking. It has often been noted that many of
    the leaders of this period—Jacques Derrida with his doctrine of deconstruction,
