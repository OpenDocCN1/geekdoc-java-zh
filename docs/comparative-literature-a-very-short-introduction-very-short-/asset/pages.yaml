  md: '# Box 2 Close reading


    Associated with the ''Practical Criticism'' that helped establish English literature
    as a discipline in the 1920s, and with the subsequent ''New Criticism'' of the
    American 1940s, close reading focuses on syntax, sentence structure, semantic
    ambiguity, as well as the contextual resonance of specific words. Comparative
    close reading applies such techniques to work more than one tradition, examining
    the ways in which the micro-analysis of textual detail can open up the micro-analysis
    of contextual significance.


    One might, for example, examine World War One through the prism of close reading,
    poems by Rupert Brooke, August Stramm, and Guillaume Apollinaire. Brooke''s sonnet
    ''The Soldier'' foregrounds English—mentioned no less than six times in fourteen—as
    his salient value; even in death there should be ''some corner of a foreign field
    / That is for ever England''. Given such sentiments, with foreign literature seems
    especially important. Yet Brooke''s very traditional sonnet structure contrasts
    violently with the expressionistic ''stream'' of Stramm''s poetry. A poem of this
    title begins with neologisms and distorted syntax—''Days encoffining / Worlds
    cemetery'' (Tage sagen/Weliten graben*)—before proceeding through a series of
    one-word lines to conclude with the rhythmic crescendo of ''pains pains / paving
    / stall'' (Wehe Wehe/Wehen/Nichall). Such poetry can only be read closely, as
    an onomatopoe response to the horror of the trenches. Apollinaire''s ''Cotton
    in Your Ears'', finally, takes this step further, recreating an explosion of artillery
    shells typographically, with the words of the poem shattering the page (see Figure
    3). Syntax, in short, enacts sentiment—such is the wager of close reading. While
    this approach obviously also be taken to texts within a single language, it is
    only by comparing across several languages that a composite sense of differing
    responses to the war—sentimental in England, nihilistic in Germany, shattered
    in France—can be properly achieved.'
