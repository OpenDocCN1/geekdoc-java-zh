    ### Abstract


    ''Metaphors of reading'' asks—What is comparative literature? How does it differ
    from literature? And why and how does one become a comparist? Almost every comparist
    has a different idea of how and what to compare, and a set of priorities. The
    only consensus is on the inherent instability of the term. This instability is
    the very essence of comparative literature. By looking at comparatively one realizes
    how much can be learned by looking beyond one''s own tradition; one discovers
    not only about other literatures, but also about one''s; and one participates
    in the great utopian dream of understanding the ways cultures interact.


    What do we see in the inkbl? Some see an abstract cloud; others discern a menacing
    smoke. We presumably agree that the two sides of the image are symmetrical; others
    focus on the shapes they form. Beyond that that our brains process the information
    differently, projecting associations and prejudices—and'
