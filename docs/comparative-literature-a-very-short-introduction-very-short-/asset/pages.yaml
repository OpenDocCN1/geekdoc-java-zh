    **Abstract**


    ‘Practice and principles’ asks what it means to ‘do’ comparative literature. A
    number of basic principles can be identified as constitutive of comparative literature’
    disciplinary practice and can be considered a conceptual pair: topics versus methods;
    periods versus regions; close versus reading; the canon versus counter-; genres
    versus styles; and writers readers. When considering the practices and principles
    of comparative literature, it is important to consider them from the perspective
    of both creators and critics. This double perspective is emerging as a focal point
    for the discipline. Readers cannot compare without writers, and writers cannot
    compare without reading.


    What does it mean to ‘do’ comparative literature? If you have taken the time to
    pick up this book, you are presumably interested in reading as widely as possible.
    You may not be familiar, however, with all the ways in which this interest can
    be deepened through scrutiny and reflection. The newcomer to comparative literature
    could certainly be forgiven for feeling'
