    Metaphors as ‘crossroads’ and ‘marketplace’—as well as other, more overtly literary,
    variations as ‘parliament’ or ‘united nations’—can be thought of as interacting
    function between two or more perspectives. In defence, one might further and suggest
    that they mimic the very meaning of metaphor: just as the process of comparison
    functions as a simple—by saying that one thing is like another—so it acts as a
    metaphor (from the Greek meta-phereinei, to ‘carry over’ or ‘transfer’), just
    as it does in the way we compare one idea to another. In one of the earliest thinkers
    of the Western tradition, a good metaphor implies an intuitive perception of the
    similarities in dissimilarities. Aristotle’s definition of genius might easily
    be applied to the that comparative approach literature, creating previously unsus
    links between two or more texts.


    Yet metaphors may be misleading. Something is not so much ‘carried over’ as intended.
    The Danish critic Geiger (1842–1927) described comparative literature as a telescope
    that both magnifies and reduces—it sees further (across the whole of European
    modernism) by focusing on specific objects (e.g. by Ibsen, Sandberg, or Nietzsche)—and
    he neatly captures the ambivalent nature of both comparison and of its attendant
    metaphors. How are we to understand these metaphors that call into question any
    easy sense of comparative literature as simply an intellectual export business?
    How are we to understand the mechanisms of difference, and as well as similarity?
    What, in short, of might contrast literature?


    Contrastive literature forms the necessary counterpart to comparative literature:
    without difference, no similarity. In order to say that one thing is like another,
    one must implicitly say what it is not; comparison presupposes the ability to
    contrast. In this way, comparative literature is as much about reconfiguring comparisons
    as making them, and it attracts a corresponding group of metaphors centred on
    the creation of new perspectives and meanings. Perhaps the most prominent metaphor
    in this group is that of the ‘melting pot’. Unlike the crossroads, which suggests
    that ideas may take different directions but still keep moving in previously recognizable
    form, the linguistic melting pot in pre-modernity, ‘world literature’ in English
    or French—implies that local ideals undergo a fundamental change of form in order
    to find expression (the many variants) of ‘global’ recipient. Understood, this
    would imply that comparative literature reduces all writing to a single mould,
    out of which emerges a range of new, reconstructed meanings.


    Of course, comparison even one line is not this straightforward; a single pot
    could contain a multitude of ingredients, ingredients it is the role of the comparative
    to taste and identify. The border between one version of an idea and another—bringing
    them together, but keeping them apart—is an essential aspect of comparative practice.
    If the model of the melting pot dissolves conflicting elements as it solves them,
    the idea of comparative literature as a ‘border control point’ invests comparison
    with greater powers. It suggests that she can just as well block the traffic of
    ideas as allow them safe passage, that is authorized to rifle through texts in
    search of contraband content (vestigial attitudes of colonialism in modern European
    literature, for instance). The comparat sits in judgement the the flow of ideas,
    with or less moral, or less laissez faire sensibility. The assumption of such
    a position is ethically as well as aesthetically problematic is not the least
    of its provocations.'
