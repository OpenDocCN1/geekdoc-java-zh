  md: 'European tradition in Antoine Gall''s French translation of 1704, or of the
    Persian poem Shahnameh (famous in particular for its history of illustrated manuscripts),
    tells us as much about the changing status of the Orient as it does the texts
    themselves. Reception, in this case, is using Georges Brandes'' telescope to look
    not only at the stars, but also at the telescope itself.


    Another common approach to reception studies is a consideration of the genre distinctions
    such as tragedy or comedy, or of rhetorical modes such as anachronism or katarsis
    (a trip to the underworld). Such distinctions allow critics to trace how later
    works have developed or drifted from their classical source while remaining within
    a shared frame of reference; Nietzsche''s The Birth of Tragedy, waging Wagner
    against Schopenhauer, is a case in point. To be sure, this is not taken to be
    that reception is a passive state of affairs in which meaning is simply dictated
    by the past. On the contrary, new reception is created by juxtitions: writing
    against the backdrop of the French-Russian war of 1871; Nietzsche retrieves tragedy
    as a classical element of European Modernity. Creative reception of this sort
    even work its way back to where it started: Edward Fitzgerald''s Omar Khayyam
    first (1859) essentially renders the medieval Persian poem Khayyam not just for
    modern European, but also for modern Persian readers. In this fashion, reception
    becomes ''tracking characters in changing contexts—Orpheus in modern poetry, Odysseus
    in modern cinema—or processes of cultural transfer across contexts—invented''.


    This very idea of ''tradition'' has, in its own tradition. One of the key contributions
    of comparative literature understanding has been to reflect on the ways in which
    classical tradition is created, curated, and controlled, on how it is supported
    by a prevailing ideology. The idea of the ''canon'', it becomes even clearer,
    is not ideologically neutral; certain texts, authors, or cultures—the ''tyranny
    of genre'' 19th-century Germany, the Roman observation of Mussolini''s Italy—are
    foreground at certain times. More generally, intellectual history suggests that
    there are two main models for understanding tradition: either as an ''chain''
    of influence, in which every iteration of a motif or myth adds to its cumulative
    depth (as in our understanding of the ''tragic'', for instance), or as a series
    of discrete, elective moments, in which one writer or period selectively evokes
    another, often very distant period (Keats''s ''wild surmise'' on first reading
    Chapman''s translation of Homer). The very idea of reception, in short, has been
    received in different ways at different times.


    Why, then, has it risen to prominence in the 21st century? Part of the answer
    is simple expiency. Facing an ever-greater struggle to justify its existence,
    Classics have turned to reception studies as a way of asserting its continuing
    relevance and self-awareness: Antiquity as to Modern. More broadly, the study
    of reception has emerged as a part of general turn to forms of history—book history,
    intellectual history—that prioritize context over semantic content. This historical
    turn brought with it the brightness of the comparative perspective, predicated
    not on seeing reception as a form of comparison, but also on viewing comparison
    as part of reception. Studying the ways of culture is that classical reception—or
    indeed reception of any kind—is inherently interdisciplinary suggests its potential
    for the interdisciplinary compass of comparative literature, flickering uncertain
    between ancient and modern, East and West, North and South. One thing is sure:
    future debates will add further coordinates. If comparative literature is a compass,
    it requires constant recalibration.'
