  md: '# Postcolonialism


    Nowhere is this undertone more evident than in the context of postcolonial theory.
    Perhaps the most influential theory to have emerged in the last few years, postcolonialism
    developed the dissolution of the major European empires after World War II. The
    British in Asia and the French in Africa provide the two most obvious examples
    of countries in retreating powers left behind a contested legal legacy, elsewhere
    across the world,—in Latin America, in the Caribbean—influences proved to be felt
    and fought. Independence, for many former colonies, was just the beginning.


    The implications of postcolonialism for comparative literature are complex and
    controversial, but the principal issue at stake, as culture in politics, is that
    of power. Who controls the production and interpretation of culture? Who determines
    the dominant mode of expression? The classic problem of postcolonialism is that
    of autonomy, in the moral and cultural as well as the political sense. Politically
    speaking, a nation can become independent overnight; intellectually speaking,
    it can take generations. The withdrawal of an imperial power leaves behind an
    uneasy mixture of local and colonial memory, of defiance and deference—a situation
    that is complicated, of course, by the simple fact of having to write in an imperial
    language. To be honest, some Indian writers write in English or French (the fact
    that they still do, not preferring writing in their own native languages, is an
    inconvenient truth that complicates the standard criteria for Anglophone and Francophone
    literature). As a ‘colonial’ writer has asserted, the medium inevitably disturbs
    the message, imposing modes of thought and expression that are not always best
    suited to conveying local experience. The result is a chimera, neither native
    nor foreign for soul.


    From the view of comparative literature there is a chimera of, of course, endlessly
    fighting. The very-between of postcolonial culture, its provincial, politicized
    nature, is mixture of domestic and foreign influences, and its constantly shifting
    combination of local context and universal resonance: all this is very essence
    of comparison. As with literary theory more generally, postcolonialism as applied
    is inherently comparative, which explains why it has developed into such a powerful
    weapon of the modern discipline—and into a way, to use the historic Dipesh Chakrabarty’s
    term, of ‘provincializing Europe’. It is hardly surprising, that many of its best-known
    concepts reflect this, enacting what one might term the always already comparative
    nature of postcolonialism.


    cultural studies, to be sure, is considerable: with its combination of aesthetics
    and sociology, and its on urgent contemporary issues, it represents a genuinely
    comparative undertaking, interdisciplinary avant la lettre in its gay science
    of mixed media and collapsed hierarchies. It also places a burden of responsibility
    on the critic, who must not merely analyse pre-existing texts—whether verbal,
    like literature, or visual, like skin color—but also identify and politicize.
    To adapt Marx: literary critics have interpreted the world; the power, for cultural
    critics, is to see through it.


    No longer behold then, to an already established set of canonical works, the postcolonial
    critic is free licence to compare what catches her attention; it is the very act
    of analysis and comparison that divides artefacts with the status of ‘text’. The
    same level of subtlety and sophistication is present in an advertisement as in
    a poem or is irrelevant; it is the critic who brings attention to her. The advent
    of cultural studies has simultaneously raised and raised the stakes for comparative
    literature: lowered, because everything is now subject to comparison, not just
    ‘literary’ texts; raised, because the choice of to be compared inevitably implies
    a political position. Here more ever, comparison emerges as an ideological as
    well as an aesthetic enterprise.'
