  md: 'For literature exists, after all, comparatively. From the dramas of Antiquity
    to the novels of Modernity, from Eastern epics to Western classics, there is not
    a history in that that is truly self-sufficient. To read and write is to work
    within an framework of characters, conventions, plots, and premises; how we understand
    one work of literature is contingent on how we understand another work of literature.
    The more we know, the more we contextualize; the more we learn, the more we compare.
    Knowledge itself is comparative. Because how we read, how we compare is hard-wired
    into the very ways that we think.


    While makes comparative literature among the most ambitious of intellectual disciplines,
    it also brings the whole undertaking into question. For ''if to read is to compare'',
    in the pithy words of George Steiner, one of the most influential of contemporary
    comparists, fening over a protected zone for its interest in fact, must unseen,
    since we are constantly doing it anyway. What, to put it simply, is the force
    of comparative literature, as opposed to that of Literature? This answering requires
    delving into practice, the history, and the theory of discipline.


    Why, and indeed does one become a comparist? In my case it began with a passion
    for languages, for the literatures written in them, and then for how to join the
    dots between them to cote into a pattern the dots start at the moment literature
    becomes truly comparative, and it is among the most exhilarating intellectual
    experiences. To follow the evolution of the novel from Cervantes to Calvino, is
    to study the history of the story from Petrarch to Pushkin, is to navigate by
    new and larger constellations, drawn on the light of making cross-cultural connections.
    Anyone inquisitive whether or without foreign language skills, can sustain such
    freshness. Curiosity, openmindedness, intellectual ambition: these are the only
    prerequisites for making comparists.


    For there are few more fundamentally human instincts than ours to compare. From
    the earliest inklings of consciousness, we tacitly understand connections in relation
    to others; as we grow, we learn to gauge our development through constant reference
    to peers, developing finely tuned antennae for similarity and difference. Comparison
    can take many forms—empathy, envy, defensiveness, defense—but it always comes
    to the perception of multiplicity, to the acknowledgement (whether grudging or
    greater) that there is more than one way of being and more than one way of things.
    Looking beyond ourselves we learn.


    Scholarly modes of comparison take this psychological discipline and dignify it
    with disinterest. The context of the observer continues to provide the crucial
    point of reference: comparative literature may aspire to the objective of a ‘discipline’,
    but in reality it is deeply complicit in the prejudices and positions that define
    it. Counter-intuitive though it may be to admit it in the opening pages of an
    introduction, there is not in fact such as a single, objective of comparative
    literature. However the problematic idea of ‘literature’ may be—and we will see
    that it is increasingly contested—the ‘comparative’ indicates not so much as disagreement
    on how to approach it. Almost every comparist has a different idea of what and
    how to compare; almost every comparist has a different set of priorities. The
    only consensus is on the inherent instability of the term. Like governments in
    democracy, we have the modes of comparison that we deserve.


    This instability is the very essence of comparative literature. Its meaning and
    methodology depend upon unsettling fixed canons, on forging fresh connections
    and mutually enriching links between disparate texts and traditions. Concepts
    such as ‘world literature’ or ‘multilingualism’ are merely the latest examples
    of the ongoing-going attempt to confer stability on an inherently unstable concept;
    unlike the dearly demarcated fields of national literatures (English, French,
    Russian, etc.), comparative literature does not have a canon of texts so much
    as a canon of approaches to texts. Comparative literature, in short, constitutes
    an indiscipline, a self-reflective mode of reading rather than an object of study,
    or perhaps a self-reflective mode in search of an object of study. If this makes
    it akin to a Rorschach test, it also makes it a mirror for Modernity’s intellectual
    anxieties regarding globalization.'
