    Europe at the Congress of Vienna.


    The fact that the major empires (Prussia, Russia, Austria) had made major gains
    meant that numerous smaller states—and languages—were now subsumed within their
    purview. A range of differing cultures were housed within a handful of overarching
    groupings, the better balance each other out at the supranational level; the conditions
    for comparison, one might see, were perfect. Yet for the discipline of comparative
    literature, this imperial structure created a double bind, since it meant that
    to overcome national divisions were tied precisely to those divisions, locked
    into a narrative of competing countries and colonies. Comparison developed, in
    short, and within nations and empires—the Napoleonic, the Victorian, the Habsburg—as
    much within and between languages and literatures. Understood in the geopolitical
    terms of the 19th century, comparative literature was also competitive literature.


    # # Compare and contrast


    Given competing narratives, how can the process of comparing be best understood?
    Perhaps we might wisely begin by viewing it as the search for a master metaphor.
    The Belgian-born critic Paul de Man (1919–83) argued that modern literature constructs
    its own "allegories of reading"; comparative literature, by extension, constructs
    metaphors of reading, models of how to interpret texts and cultures between nations
    and nations. Such metaphors may provisionally be broken down into two groups:
    those indicating connection and similarity, and those indicating disconnection
    or difference.


    Beginning with the former group, the most obvious metaphor for the comparative
    approach to literature is that of the ‘crossroads’. Standing at the centre of
    any numering routes or spaces—the Silk Road, the Holy Roman Empire, the Republic
    of Letters—following this model, surveys and detects the passing traffic. Such
    a position offers numerous advantages: privileged access to a range of sources;
    exposure to comparing perspectives; constant strain and renegotiation. It also
    risks being disorienting, placing the comparist at the mercy of chance and circumstance,
    her spinning furiously like the road runner in one of those where the traffic
    lights are all flipped around More fundamentally, it also depends on a model of
    comparative literature that is not so much Eurocentric—the great fear of contemporary
    criticism in an age of postcolonial globalization—as ‘centric-centric’, since
    it implies that the comparist is there. In an age of ‘Global South’ and realised
    ‘peripheries’, it is far from such a centre that she can hold.


    An alternative, increasingly important model of negotiation is that of the ‘marketplace’.
    In an age in which authors write as much for an international as for a national
    audience, the cross-cultural ‘marketability’ of literature has become a significant
    criterion in determining what gets counted—and what gets written. The metaphor
    of the marketplace, that is to'
