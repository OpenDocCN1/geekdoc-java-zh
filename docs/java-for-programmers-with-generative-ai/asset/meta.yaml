  - 第 6 章, 数组和 ArrayList ——开始我们对数据结构的早期覆盖。我们介绍了存储值列表和表格的数组。你将定义并初始化数组并访问其元素。我们讨论了将数组传递给方法、排序和搜索数组以及处理多维数组。我们介绍了
    `Arrays` 类，它包含了常用数组操作的方法。第 6.20 节 的对象自然案例研究讨论了创建和操作 Java 集合框架的 `ArrayList<E>`
    类。Java API 提供了许多预定义的集合（即数据结构），在内存中存储一组相关对象。这些类提供了高效、经过验证的方法，可以组织、存储和检索数据，而无需了解数据是如何存储的。这缩短了程序开发时间并有助于创建更健壮的应用程序。包含
    28 个 genAI 提示练习。
