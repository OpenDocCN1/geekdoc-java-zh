    \    @EMAIL VARCHAR (200)OUT     -- 用于收集邮箱的输出参数\n)\nAS\nBEGIN\nSELECT @NAME= Firstname+'\
    \ '+Lastname,\n    @EMAIL=EMAIL FROM EMPLOYEE WHERE ID=@ID\nEND\n```\n\n### 数据库面试题-31.规范化的缺点是什么？\n\
    **答案：** 数据库越规范化，需要的表就越多，连接（joins）就越多，获取所需记录花费的时间越长。\n\n### 数据库面试题-32. 编写 SQL 查询获取所有以“Shyam”开头的银行账户详情\n\
    **答案：** `Select * from account where name LIKE '%Shyam%';`\n\n### 数据库面试题-33. 编写\
    \ SQL 查询获取余额最高的前 3 个账户\n**答案：** \n- SYBASE: `select top 3 * from account order\
    \ by balance desc;`\n- MYSQL: `select * from employee order by salary desc limit\
    \ 1,3`\n- Oracle: `select * from employee order by salary where rownum < 3`\n\n\
    ### 数据库面试题-34. 编写 SQL 查询获取余额最低的 3 个账户\n**答案：** \n- SYBASE: `select top 3 * from\
    \ account order by balance asc;`\n- MYSQL: `select * from employee order by salary\
    \ asc limit 1,3`\n- Oracle: `select * from account order by balance asc where\
    \ rownum<3;`\n\n### 数据库面试题-35. 编写 SQL 查询更新所有账户余额以增加 6%的利息\n**答案：** `UPDATE account\
    \ SET BALANCE = BALANCE * 1.06;`\n\n### 数据库面试题-36. 编写 SQL 查询查找整个银行的总余额\n**答案：**\
    \ `SELECT SUM(balance) AS total FROM account;`\n\n### 数据库面试题-37. 编写 SQL 查询查找余额为\
    \ 100000 的客户数量。\n**答案：** `SELECT COUNT(balance) AS \"Number of customers\" FROM\
    \ account WHERE balance = 100000;`\n\n### 数据库面试题-38. 编写 SQL 查询返回前 100 条账户记录。\n\
    **答案：** `select top 100 * from account;`\n\n### 数据库面试题-39. 编写 SQL 查询返回余额在 100000\
