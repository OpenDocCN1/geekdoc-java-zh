  trans: "\n\n![](img/cover00037.jpeg)\n\n# 程序员面试指南\n## 70 道数据库问题与解答\n\n- 引言\n- 结论\n\
    - 关于作者\n\n本书献给所有数据库程序员。\n\n版权所有 © 2015-2035 Chinmoy Mukherjee\n\n保留所有权利。未经出版者或作者书面许可，不得以任何形式或通过任何电子或机械手段（包括信息存储和检索系统）复制本书的任何文本，但评论员在批判性文章或评论中引用简短段落除外。\n\
    \n# 引言\n\n我们为读者准备了 70 道有趣的数据库面试问题和答案，以便他们练习并攻克任何数据库面试。鼓励读者在查看答案之前尝试自己解决这些问题。\n\
    \n### 数据库面试题 1. “索引（index）”有什么用？\n\n答案：索引是物理磁盘中数据库记录的查找表。索引使记录搜索更快，它类似于书籍的索引。下图直观地解释了索引的概念。\n\
    \n![](img/image00036.jpeg)\n\n### 数据库面试题 2. 什么时候不应该使用索引？\n\n答案：在以下情况下不应使用索引：\n\
    \n- 如果记录数量较少\n- 如果记录每天需要进行更新/插入/删除\n- 如果列值经常为空（null）\n\n### 数据库面试题 3. tempdb 是什么？\n\
    \n答案：`tempdb` 是临时数据库，供所有用户/进程使用以维护临时表等。当数据库服务器重启时，`tempdb` 的内容会被清除。\n\n### 数据库面试题\
    \ 4. 你如何找到数据库中存在的所有存储过程？\n\n答案：\n```sql\nSELECT object_name, object_type\nFROM\
    \ user_objects\nWHERE object_type = 'PROCEDURE'\n```\n\n### 数据库面试题 5. TRUNCATE\
    \ 和 DELETE 有什么区别？\n\n答案：`TRUNCATE` 删除表中的所有行。该操作无法回滚，且 `TRUNCATE` 不会触发触发器。\n\n\
    ### 数据库面试题 6. IN 和 EXISTS 有什么区别？\n\n答案：`EXISTS` 检查是否存在此类记录。例如：\n```sql\nSELECT\
    \ * FROM Orders o WHERE EXISTS (\n    SELECT * FROM Products p where p.ProductNumber\
    \ = o.ProductNumber)\n```\n`IN` 用于在多个记录中查找某个记录是否存在。例如：\n```sql\nSELECT * FROM\
    \ Orders WHERE ProductNumber IN (1, 10, 100)\n```\n\n### 数据库面试题 7. 哪些数据库参数可以进行性能优化？\n\
    \n答案：缓冲池（Buffer pool）、日志级别（Log level）等。\n\n### 数据库面试题 8. bcp 是什么？\n\n答案：Sybase\
    \ 中的 `bcp` 帮助将表拷贝到平面文件中反之亦然。\n\n### 数据库面试题 9. 假设你登录了数据库 DB1。在 DB1 中运行什么查询来从另一个数据库\
    \ DB2 中的表 table1 获取数据？\n\n答案：我们可以使用 `select * from DB2..table1` 或使用 `DB2;select\
    \ * from table1`。\n\n### 数据库面试题 10. 哪些主要的开源数据库？\n\n答案：PostgreSQL, MySQL 等。\n\n\
    ### 数据库面试题 11. 什么是视图（View）？\n\n答案：视图是存储在内存中的 SQL 语句表示，以便方便地作为示例重用例如：\n```sql\n\
    CREATE VIEW [MyProductList] AS\nSELECT ProductID,ProductName\nFROM Products\n\
    WHERE Discontinued=No\nSELECT * FROM [MyProductList]\n```\n\n### 数据库面试题 12. 有一个表“Employee”，包含两列——Emp_Name\
    \ 和 Office_Locations。编写一个查询显示所有办公地点以及每个地点的员工人数。\n\n答案：\n```sql\nSelect Office_Locations,\
    \ COUNT(Emp_Name) FROM Employee GROUP BY Office_Locations;\n```\n\n### 数据库面试题\
    \ 13. 编写一个查询获取既是经理的员工。\n\n答案：\n```sql\nSelect name from employees where id in\
    \ (select manager from employees)\n```\n或者\n```sql\nSelect e1.name from employees\
    \ e1 inner join employees e2 ON e1.id = e2.manager\n```\n\n### 数据库面试题 14. 如何获取数据库名称？\n\
    \n答案：\n```sql\nselect db_name();\n```\n\n### 数据库面试题 15. 如何获取数据库版本？\n\n答案：\n```sql\n\
    select @@version\n```\n\n### 数据库面试题 16. 如果表被截断（truncated），它可以回滚吗？\n\n答案：不能。\n\n\
    ### 数据库面试题 17. 什么是聚集索引（clustered index）？一个表可以有多少个聚集索引？\n\n答案：聚集索引根据索引对磁盘上的记录进行物理排序。因此，每个表只有一个聚集索引是可能的。\n\
    \n### 数据库面试题 18. “MINUS”有什么用？\n\n答案：`MINUS` 只从第一个结果集中返回不在第二个结果集中的结果。\n\n### 数据库面试题\
    \ 19. 编写一个查询获取所有作为经理的员工。\n\n答案：\n```sql\nselect distinct e.name from employees\
    \ e inner join employees m on e.id = m.manager\n```\n\n### 数据库面试题 20. 编写一个查询获取所有员工。\n\
    \n答案：\n（注：此处原文未提供完整代码，已按要求保留翻译结构）\n\n"
- fmt: "\n```sql\nCREATE PROCEDURE GetEmployeenameEmailInOutputVariable\n(\n    @ID\
    \ INT,                   --Input parameter\n    @NAME VARCHAR (200) OUT,    --\
    \ Output parameter to collect name\n    @EMAIL VARCHAR (200)OUT     -- Output\
    \ Parameter to collectemail\n)\nAS\nBEGIN\nSELECT @NAME= Firstname+' '+Lastname,\n\
    \    @EMAIL=EMAIL FROM EMPLOYEE WHERE ID=@ID\nEND\n```\n\n### Database Interview\
    \ Question-31. What are the disadvantages of normalization?\n**Answer:** More\
    \ one normalizes database, more tables, more joins are required and takes lot\
    \ of time to retrieve required records\n\n### Database Interview Question-32.\
    \ Write SQL query to fetch all bank account details whose name starts with “Shyam”\n\
    **Answer:** `Select * from account where name LIKE '%Shyam%';`\n\n### Database\
    \ Interview Question-33. Write SQL query to fetch top 3 accounts having highest\
    \ balance\n**Answer:** \n- SYBASE: `select top 3 * from account order by balance\
    \ desc;`\n- MYSQL: `select * from employee order by salary desc limit 1,3`\n-\
    \ Oracle: `select * from employee order by salary where rownum < 3`\n\n### Database\
    \ Interview Question-34. Write SQL query to fetch bottom 3 accounts having lowest\
    \ balance\n**Answer:** \n- SYBASE: `select top 3 * from account order by balance\
    \ asc;`\n- MYSQL: `select * from employee order by salary asc limit 1,3`\n- Oracle:\
    \ `select * from account order by balance asc where rownum<3;`\n\n### Database\
    \ Interview Question-35. Write SQL query to update balance of all account with\
    \ 6% interest\n**Answer:** `UPDATE account SET BALANCE = BALANCE * 1.06;`\n\n\
    ### Database Interview Question-36. Write SQL query to find out total balances\
    \ maintained in whole bank\n**Answer:** `SELECT SUM(balance) AS total FROM account;`\n\
    \n### Database Interview Question-37. Write SQL query to find out number of customers\
    \ having balance 100000.\n**Answer:** `SELECT COUNT(balance) AS \"Number of customers\"\
    \ FROM account WHERE balance = 100000;`\n\n### Database Interview Question-38.\
    \ Write a SQL query to return first 100 account records.\n**Answer:** `select\
    \ top 100 * from account;`\n\n### Database Interview Question-39. Write SQL query\
    \ to return count of customers having balance between 100000 to 200000 group by\
    \ balance\n**Answer:** `select balance, COUNT(*) from account where balance >\
    \ 100000 AND balance < 200000 GROUP BY balance`\n\n### Database Interview Question-40.\
    \ In SQL which runs faster “sub queries” or join?\n**Answer:** `Join`\n\n### Database\
    \ Interview Question-41. Which of the following SQL clauses is used to sort a\
    \ result set?\n1. `SORT`\n2. `ORDER BY`\n3. `ARRANGE`\n4. `SORTED BY`\n**Answer:**\
    \ B\n\n### Database Interview Question-42. The FROM SQL keyword is used to\nA.\
