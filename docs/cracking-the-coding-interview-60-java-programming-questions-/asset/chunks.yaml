    \ balance > 100000 AND balance < 200000 GROUP BY balance`\n\n### 数据库面试题-40. 在\
    \ SQL 中，“子查询”还是“连接（join）”运行得更快？\n**答案：** `Join`\n\n### 数据库面试题-41. 以下哪一个 SQL 子句用于对结果排序？\n\
    1. `SORT`\n2. `ORDER BY`\n3. `ARRANGE`\n4. `SORTED BY`\n**答案：** B\n\n### 数据库面试题-42.\
    \ FROM SQL 关键字用于：\nA. 指定我们正在修改的表。\nB. 指定我们要插入数据的表。\nC. 指定我们从中选择或删除的表。\n**答案：**\
    \ C\n\n### 数据库面试题-43. ACID 代表什么？\nA. Access（访问）.Constraint（约束）.Index（索引）.Data（数据）。\n\
    B. Atomicity（原子性）.Consistency（一致性）.Isolation（隔离性）.Durability（持久性）。\nC. Access（访问）.Consistency（一致性）.Isolation（隔离性）.Data（数据）。\n\
    **答案：** B\n\n### 数据库面试题-44. 以下哪一个 SQL 语句删除了 SalesData 表中的所有行？\nA. `DELETE * FROM\
    \ SalesData`\nB. `DELETE FROM SalesData`\nC. `DELETE SalesData`\nD. `DELETE ALL\
    \ SalesData`\n**答案：** B\n\n### 数据库面试题-45. 以下哪一个 SQL 子句用于从 2 或多个表中选择数据？\nA. `HAVING`\n\
    B. `WHERE`\nC. `JOIN`\n**答案：** JOIN\n\n### 数据库面试题-46. INNER JOIN 子句……\nA. 返回连接字段上具有匹配值的所有行。\n\
    B. 返回两个表中的所有行。\nC. 仅返回第一个表中在连接字段上与第二个表值不匹配的行。\n**答案：** A\n\n### 数据库面试题-47. TRUNCATE\
    \ TABLE……\nA. 检查表是否指定了主键\nB. 从表中删除所有行\nC. 删除该表\n**答案：** B\n\n### 数据库面试题-48. 表列也称为：\n\
    1. `Attributes`（属性）\n2. `Fields`（字段）\n3. `Records`（记录）\n**答案：** B\n\n### 数据库面试题-49.\
    \ UNION SQL 子句可以与……配合使用\n1. 仅 `SELECT` 子句\n2. 仅 `UPDATE` 子句\n3. `DELETE` 和 `UPDATE`\
    \ 子句\n4. 以上三者均不是\n**答案：** A\n\n### 数据库面试题-50. HAVING 子句只能与……\n1. `JOIN` 子句。\n\
    2. `INSERT` 子句\n3. `SELECT` 子句\n4. `DELETE` 子句。\n**答案：** C\n\n### 数据库面试题-51. 哪个\
    \ SQL 关键字用于仅检索唯一值？\n1. `DISTINCT`\n2. `DISTINCTIVE`\n3. `DIFFERENT`\n4. `UNIQUE`\n\
