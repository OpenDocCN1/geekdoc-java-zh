    `IT`, `Admin`, `Facility`, `Legal`) and corresponding bank account details.


    ### Database Interview Questions


    - **Database Interview Question-65**: Write SQL query to retrieve all employees
    having bank balance more than 10000.

    - **Database Interview Question-66**: Write SQL query to increase balance of all
    female employees by 5000.

    - **Database Interview Question-67**: Write SQL query to find out count of all
    male employees having balance between 5000 to 1000.

    - **Database Interview Question-68**: Increase balance of each of the above employees
    by 1000.

