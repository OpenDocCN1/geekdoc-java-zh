    annotation is used to mark a method as after returning advice.


    **After throwing advice** : Advice to be executed if a method exits by throwing
    an exception. @AfterThrowing annotation marks a method as after throwing advice.


    **After (finally) advice** : An advice that gets executed after the join point
    finishes executing, whether normally or by throwing an exception. @After annotation
