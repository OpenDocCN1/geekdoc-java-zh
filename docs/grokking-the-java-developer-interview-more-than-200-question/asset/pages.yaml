  md: '# we try to use a class, then classloader loads it into memory.


    There are 3 types of built-in class loaders in java:


    +   1. Bootstrap class loader : it loads JDK class files from jre/lib/rt.jar and
    other core classes. It is the parent of all class loaders, it is also called Primordial
    classloader.

    2. Extensions class loader : it loads classes from JDK extensions directory, it
    delegates class loading request to its parent, Bootstrap and if the loading of
    class is unsuccessful, it loads classes from jre/lib/ext directory or any other
    directory pointed by java.ext.dirs system property.

    3. System class loader : It loads application specific classes from the CLASPATH.
    We can set classpath while invoking the program using -cp or classpath line options.
    It is a child of Extension ClassLoader.


    Java class loader is based on three principles:


    +   1. Delegation principle: It forwards the request for class loading to its
    parent class loader. It only loads the class if the parent does not find or load
    the class.

    2. Visibility principle: According to Visibility principle, the child ClassLoader
    can see all the classes loaded by parent ClassLoader. But the parent class loader
    cannot see classes loaded by the child loader.

    3. Uniqueness principle: According to this principle, a class loaded by Parent
    should not be loaded by Child ClassLoader again. It is achieved by delegation
    principle.'
