  md: 'Classes may get collected (unloaded) if the JVM finds they are no longer needed
    and space may be needed for other classes. The permanent generation is included
    in a full garbage collection. And Perm Gen was available till Java 7, it is removed
    from Java 8 onwards and JVM uses native memory for the representation of class
    metadata which is called MetaSpace.


    There is a flag MaxMetaspaceSize, to limit the amount of memory used for class
    metadata. If we do not specify the value for this, the Metaspace re-sizes at runtime
    as per the demand of the running application.


    **How Garbage collection works: When new objects are first created, they are stored
    in the eden space of Young Generation and at that time both Survivor spaces are
    empty. When the eden space is filled, a minor garbage collection is triggered.
    All the unused or un-referenced objects are cleared from the eden space and the
    used objects are moved to first Survivor space S0.**


    At the next minor garbage collection, same process happens, un-referenced objects
    are cleared from the eden space but this time, the surviving objects are moved
    to Survivor space S1. In addition, the objects that were in S0 will also be matured
    and they also get moved to S1. Once all surviving objects are moved to S1, both
    eden and S0 are cleared.


    At the next minor GC, the same process repeats. When surviving objects reached
    a certain threshold, they get promoted from Young generation to Old generation.
    These minor GC will continue to occur and objects will continue to be promoted
    to the Old generation.'
