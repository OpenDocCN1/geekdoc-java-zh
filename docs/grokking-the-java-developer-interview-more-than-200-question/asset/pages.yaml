  md: "While variable hiding looks like overriding a variable (similar to method overriding),\
    \ it is not. Overriding is applicable only to methods while hiding is applicable\
    \ to variables.\n\nIn the case of method overriding, overridden methods completely\
    \ replace the inherited methods, so when we try to access the method from a parent's\
    \ reference by holding a child's object, the method from the child class gets\
    \ called.\n\nBut in variable hiding, the child class hides the inherited variables\
    \ instead of replacing them, so when we try to access the variable from the parent's\
    \ reference by holding the child's object, it will be accessed from the parent\
    \ class.\n\nWhen an instance variable in a subclass has the same as an instance\
    \ variable in a super class, then the instance variable is chosen from the reference\
    \ type.\n\n```\npackage com.test;\n\nclass ParentClass {\n    String x = \"Parent's\
    \ x\";\n\n    public void print() {\n        System.out.println(x);\n    }\n}\n\
    \nclass ChildClass extends ParentClass {\n    String x = \"Child's x\";\n\n  \
    \  public void print() {\n        System.out.println(x);\n    }\n}\n```"
