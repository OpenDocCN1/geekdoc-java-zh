    # Question 81: Tell something about synchronized keyword Answer: synchronized
    keyword in java is used to control the access of multiple threads to any shared
    resource, so that any consistency problem can be avoided.


    We can make the entire method as synchronized or just the part where the shared
    resource is getting used, to do this synchronized blocks are used.


    Synchronized method/block can only have one thread executing inside it, all the
    other threads trying to enter into the synchronized method/block will get blocked
    until the thread inside finishes its execution. When the thread exits the synchronized
    method/block then Java guarantees changes to the state of the object is visible
    to all the threads. This eliminates the memory inconsistency.


