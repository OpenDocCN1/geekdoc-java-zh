  md: 'points while choosing between the two:

    - When you want to provide default implementation to some of the common methods
    that can be used directly by the sub-classes then you can use abstract class because
    it can have concrete methods also, this is not the case with Interface because
    the child classes that are implementing this interface will have to provide implementation
    for all the methods that are declared in the interface

    - If your contract keeps on changing then Interface will create problems because
    you will have to provide implementation of those new methods in all the implementing
    classes, whereas with abstract class you can provide default implementation to
    the new methods and only change those implementing classes that are actually going
    to use these new methods


    Most of the times, interfaces are a good choice. It is also one of the best practices,
    when you code in terms of interfaces.


