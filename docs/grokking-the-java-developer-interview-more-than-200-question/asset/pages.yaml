- img_proc: true
  md: 'Answer: The differences are:

    BeanFactory is the most basic version of IOC containers which should be preferred
    whereas memory consumption is critical whereas ApplicationContext extends BeanFactory,
    so you get all the benefits of BeanFactory plus some advanced features for enterprise
    applications


    +   - BeanFactory instantiates beans on-demand i.e. when the methodgetBean(beanName)
    is called, it is also called Lazy initializer whereas ApplicationContext instantiates
    beans at the time of creating the container where bean bean scope is Singleton,
    so it is an Eager initializer


    +   - BeanFactory only supports 2 bean scopes, singleton and prototype whereas
    ApplicationContext supports all bean scopes


    +   - ApplicationContext automatically registers BeanPostProcessor and BeanPostProcessor
    at startup, whereas BeanFactory does not register these interfaces automatically


    +   - Annotation based dependency injection is not supported by BeanFactory whereas
    ApplicationContext supports it


    +   - If you are using plain BeanFactory, features like transactions and AOP will
    not take effect (not without some extra steps), even if nothing is wrong with
    the configuration whereas in ApplicationContext, it will work


    +   - ApplicationContext provides additional features like MessageSource access
    (i18n or Internationalization) and Event Publication


    Use an ApplicationContext unless you have a really good reason for not doing so.


