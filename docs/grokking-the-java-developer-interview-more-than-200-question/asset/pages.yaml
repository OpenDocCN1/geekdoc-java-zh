  md: '# Question 21: Difference between throw and throws keyword. And discuss Exception
    Propagation Answer:


    +   - **throw** is a keyword which is used to explicitly throw an exception in
    the program, inside a function or inside a block of code, whereas **throws** is
    a keyword which is used with the method signature to declare an exception which
    might get thrown by the method while executing the code

    - throw keyword is followed by an instance of an Exception class whereas throws
    is followed by Exception class names

    - You can throw one exception at a time but can declare multiple exceptions using
    throws keyword

    - Using throw keyword, only unchecked exceptions are propagated, whereas using
    throws keyword both checked and unchecked exceptions can be propagated.


    # Exception propagation :


    An exception is first thrown from the top of the stack and if it is not caught,
    it drops the call stack to the previous method, If not caught there, the exception
    again drops down to the previous method, and so on until they are caught or until
    they reach the very bottom of the call stack. This is called exception propagation.'
  merge: -1
  pgno: 37
- img_proc: true
  md: "+   - When method m1() calls method m2() which calls method m3(), a stack is\
    \ formed which gets unfold from the top, so if method m3() throws an exception\
    \ and it is not handled there, it will drop down the call stack to method m2(),\
    \ if it is not handled there, it will drop down the call stack to method m1(),\
    \ this happens until we reach the bottom of the stack or until the exception is\
    \ caught. This is called Exception Propagation in java.\n\nExample: unchecked\
    \ exception is thrown and it can be seen from the call stack that it is propagated\n\
