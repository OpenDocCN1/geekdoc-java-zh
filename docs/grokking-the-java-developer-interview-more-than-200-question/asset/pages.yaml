    +   - Keys should be unique in HashMap, if you try to insert the duplicate key,
    then it will override the corresponding key’s value

    - HashMap may have one null key and multiple null values

    - HashMap does not guarantee the insertion order, (if you want to maintain the
    insertion order, use LinkedHashMap class)

    - HashMap is not synchronized

    - HashMap uses an inner class Node<K, V> for storing map entries

    - HashMap has a default initial capacity of 16, which means it has 16 buckets
    or bins to store map entries, each bucket is a singly linked list. The default
    load factor in HashMap is 0.75

    - Load factor is that threshold value when crossed will double the hashmap’s capacity
    i.e. when you add 13th element in hashmap, the capacity will increase from 16
    to 32


