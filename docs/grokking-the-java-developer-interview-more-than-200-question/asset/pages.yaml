  md: 'Keep Alive Time and TimeUnit: When the number of threads are greater than the
    core size, this is the maximum time that excess idle threads will wait for new
    tasks before terminating. It is used to avoid the overhead of creating a new thread.


    Let''s understand this with an example: You have defined the core pool size as
    5 and maximum pool size as 15 and all the 15 threads are getting used at the moment.
    Now when the threads are getting finished with their work, the excess 10 threads
    (15-5) become idle and eventually die. To avoid these 10 threads being killed
    too quickly, we can specify the keep alive time for these by using the keepAlive
    parameter in the ThreadPoolExecutor constructor. If you have given its value as
    1 and unit as TimeUnit.MINUTE, each thread will wait for 1 minute after it had
    finished executing a task. Basically, it is waiting for a new task to be assigned.
    If it is not given any task, it would let itself complete. And in the end, the
    executor will be left with the core threads (5).


    BlockingQueue: The queue to use for holding tasks before they are executed. This
    queue will hold only the Runnable tasks submitted by the executor, you can use
    a ArrayBlockingQueue or LinkedBlockingQueue<Runnable> queue = new ArrayBlockingQueue<>(100);


    ThreadFactory: The factory to use when the executor creates a new thread. Using
    thread factories removes hardwiring of calls to new Thread , enabling applications
    to use special thread subclasses, priorities, etc.'
