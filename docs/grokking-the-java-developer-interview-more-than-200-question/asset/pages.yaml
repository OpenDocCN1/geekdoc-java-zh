  md: '# Preface


    Grokking The Java Developer Interview helps you to crack a Java, Spring & Hibernate
    interview.


    This book covers enough details of a Java/Spring topic that will surely help the
    absolute beginners and if you are already familiar with Java & Spring, then this
    book will help you to brush-up on the concepts.


    The book has more than 200 questions that are frequently asked during an interview
    for Java, Spring, SpringBoot & Hibernate profile. Some of the important topics
    like Multithreading, Collection framework, Singleton Pattern, SpringBoot Annotations
    and many more are covered in detail. Most of these topics are explained with code
    examples that will help you to quickly grasp the concept.


    # Who is this book for?


    This book is for you if you are either preparing for an interview, planning to
    move into this field in future, brushing up your Java & Spring skills or just
    want to get an in-depth overview of the field. This book provides the most important
    and frequently asked questions along with their solutions.


    # Who is this book NOT for?


    This book is not for you if you are looking for an in-depth study of Java or Spring.
    The objective of this book is not to discuss the ongoing research or challenges
    in this industry or serve as a substitute for a course book.


    If you follow this book diligently, you would be better equipped to face any Java
    interview. Whether you are a beginner or an intermediate level expert in Java,
    this book has enough juice for you.'
