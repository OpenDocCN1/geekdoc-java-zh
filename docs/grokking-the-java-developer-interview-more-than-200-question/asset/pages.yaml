  md: '# Some points about ArrayList class:


    +   - ArrayList class maintains insertion order

    - ArrayList class can contain duplicate elements

    - ArrayList class allows random access to its elements as it works on index basis

    - ArrayList class is not synchronized

    - You can add any number of null elements in the ArrayList class


    Time complexity of ArrayList''s get(), add(), remove() operations: get(): constant
    time


    **add():** here the new element can be added at the first, middle or last positions,
    if you are using add(element), then it will append element at the last position
    and will take O(1), provided that the arrayList not full otherwise it will create
    a new ArrayList of one and a half times the size of previous ArrayList elements
    to copy all ArrayList elements to this new ArrayList, making it O(n).


    If the element is added in the middle or at any specific index, let''s say index
    2, then a space needs to be made to insert this new element by shifting all the
    elements one position to its right, making it O(n).


    add() operation runs in amortized constant time.


    **remove():** it is also same as add(), if you want to remove element from a specific
    index, then all elements to its right needs to be shifted one position to their
    left, making it O(n) but if element needs to be removed from the last, then it
    will take O(1).


