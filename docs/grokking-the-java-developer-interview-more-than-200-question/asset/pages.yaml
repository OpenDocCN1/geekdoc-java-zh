  md: '# Question 1: What are the 4 pillars of OOPS?


    Answer: 4 pillars of OOPS are:


    +   1. Abstraction

    2. Encapsulation

    3. Inheritance

    4. Polymorphism


    Let’s take a look at them:


    +   1. Abstraction : Abstraction is a process of hiding the implementation details
    and showing only functionality to the user.


    Real world examples:


    +   - TV remote: To start the TV, you have to press the power button, you don’t
    have to know about the internal circuit operations like how infrared waves are
    passing.

    - Car gears: We know what happens when we change the gear. But we’t know how changing
    gear works under the hood, that information is irrelevant to us, so it is abstracted.


    In java, Abstraction can be achieved in two ways:


    +   - Abstract classes

    - Interfaces


    +   2. Encapsulation : Encapsulation is a process of Binding data and methods
    within a class . Think of it like showing the essential details of a class by
    using the access control modifiers (public, private, protected ). So, we can say
    that Encapsulation leads to the desired level of Abstraction.'
  merge: -1
