  md: 'happens:


    +   - Key''s hashCode() method is called

    - HashMap has an internal hash function which takes the key''s hashCode and it
    calculates the bucket index

    - If there is no element present at that bucket index, our <key, value> pair along
    with hash is stored at that bucket

    - But if there is an element present at the bucket index, then key''s hashCode
    is used to check whether this key is already present with the same hashCode or
    not.


    If there is key with same hashCode, then equals method is used on the key. If
    equals returns true, then the key''s previous value is replaced with the new value
    otherwise a new entry is appended to the linked list.


    get() method internal working: When you call map.get(key), the below things happen:

    - Key''s hashCode() method is called

    - Hash function uses this hashCode to calculate the index, just like put method

    - Now the key of element stored in bucket is compared with the passed key using
    equals() method, if both are equals, value is returned otherwise the next element
    is checked if it exists.


