    \ methods (methods with body).\n\nSome points to remember:\n\n+   - An abstract\
    \ class cannot be instantiated, which means you are not allowed to create an object\
    \ of the abstract class. This also means, an abstract class has no use unless\
    \ it is extended by some other class\n- If there is any abstract method in a class\
