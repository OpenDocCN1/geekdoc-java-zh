  md: 'Declaring both methods as private is necessary (public methods will not work),
    so other than the JVM nothing else see them. This also proves that neither method
    is not inherited nor overridden. The JVM automatically checks these methods and
    calls them during the serialization-deserialization process. The JVM can call
    these private methods, but other objects cannot. Thus, the integrity of the class
    is maintained and the serialization protocol can continue to work as normal.


    For example, you can have encryption and decryption logic in these methods.


    # Question 60: What is Externalizable Interface?


    Answer: The default serialization process is very slow as it is fully recursive,
    whenever we try to serialize one object, the serialization process tries to serialize
    all the fields of our class (except static and transient variables). So, if we
    have a class with lots of variables present and we do not want to serialize all
    of them, we have to make all of those variables as transient, all these fields
    will always be assigned default values. This makes the entire process very slow.


    Externalizable interface is used when we want to implement custom logic to serialize/deserialize
    an object. Externalizable interface extends the Serializable interface, and has
    two methods, writeExternal() and readExternal() which are used for serialization
    and de-serialization. This this way, we can change the JVM''s default serialization
    behavior because while using Externalizable, we decide what to store in stream.


