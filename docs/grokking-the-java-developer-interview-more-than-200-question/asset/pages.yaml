    Answer: **Shallow Copy**: When we use the default implementation of clone() method,
    a shallow copy of object is returned, meaning if the object that we are trying
    to clone contains both primitive variables and non-primitive or reference type
    variable, then only the object''s reference is copied not the entire object itself.


    Consider this with the example: Employee object is having Company object as a
    reference, now when we perform cloning on Employee object, then for primitive
    type variables, cloning will be done i.e. new instances will be created and copied
    to the cloned object but for nonprimitive i.e. Company object, only the object''s
    reference will be copied to the cloned object. It simply means Company object
    will be same in both original and cloned object, changing the value in one will
    change the value in other and vice-versa.


