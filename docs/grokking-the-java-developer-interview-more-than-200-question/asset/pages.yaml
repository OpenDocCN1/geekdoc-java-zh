    Question 47: What is an Inner Class in Java, how it can be instantiated and what
    are the types of Inner Classes?


    Answer: In Java, when you define one non-static class within another class, it
    is called Inner Class/Nested Class. Inner class enables you to logically group
    classes that are only used in one place, thus, this increases the use of encapsulation
    and creates more readable and maintainable code.


    Java inner class is associated with the object of the class and they can access
    all the variables and methods of the outer class. Since inner classes are associated
    with the instance, we can''t have any static variables in them.


    The object of java inner class is part of the outer class object and to create
    an instance of the inner class, we first need to create an instance of outer class.


    Java Inner classes can be instantiated like below: OuterClass outerObject = new
