    # FixedThreadPoolExecutor :


    As its name suggests, this is an executor with a fixed number of threads. The
    tasks submitted to this executor are executed by the specified number of threads
    and if there are more tasks than the number of threads, those tasks will be added
    in a queue (e.g. LinkedBlockingQueue).


    How to create a FixedThreadPoolExecutor: ExecutorService executor = Executors.newFixedThreadPool(5);


    Here, we have created a thread pool of 5 threads, that means at any given time,
    5 tasks can be managed by this executor. If there are more active tasks, they
    will be added to a queue until one of the 5 threads becomes free.


    An important advantage of the fixed thread pool is applications using degrade
    gracefully. To understand this, consider a web server application where each HTTP
    request is handled by a separate thread. If the application simply creates a new
    thread for every new HTTP request, and the system receives more requests than
    it can handle immediately, the application will suddenly stop responding to all
    requests when the overhead of all those threads exceed the capacity of the system.
    With a limit on the number of threads that can be created, the application will
    not be servicing HTTP requests as quickly as they come in, but it will be servicing
    them as quickly as the system can sustain.


