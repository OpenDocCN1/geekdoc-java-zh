    # Question 56: What is Serialization and Deserialization?


    Answer: Serialization is a mechanism to convert the state of an object into a
    byte stream while De-serialization is the reverse process where the byte stream
    is used to recreate the actual object in memory. The byte stream created is platform
    independent that means objects serialized on one platform can be deserialized
    on another platform.


    To make a Java Object serializable, the class must implement Serializable interface.
    Serializable is a Marker interface. ObjectOutputStream and ObjectInputStream classes
    are used for Serialization and Deserialization in java.'
