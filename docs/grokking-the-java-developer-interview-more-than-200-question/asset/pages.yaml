  md: '# Question 92: What is Cyclic Barrier?


    Answer: CyclicBarrier is used to make multiple threads wait for each other to
    reach a common barrier point. It is used mainly when multiple threads perform
    some calculation and the result of these threads needs to be combined to form
    the final output.


    All the threads that wait for each other reach the barrier are called parties,
    CyclicBarrier is created with a number of parties to wait for, and the threads
    wait for each other at the barrier by calling cyclicBarrier.await() method which
    is a blocking method and it blocks until all threads have called await().


    The barrier is called Cyclic because it can be re-used after the waiting threads
    are released, by calling cyclicBarrier.reset() method which resets the barrier
    to the initial state.


    A CyclicBarrier supports an optional Runnable command that is run once per barrier
    point, after the last thread in the party arrives, but before any threads are
    released. This barrier action is useful for updating shared-state before any of
    the parties continue.


    ```

    public CyclicBarrier(int parties, Runnable barrierAction

    ```


    The CyclicBarrier uses an all-or-none model for failed synchronization attempts:
    If a thread leaves a barrier point prematurely because of interruption, failure,
    or timeout, all other threads waiting at that barrier point will also leave abnormally
    via BrokenBarrierException (or InterruptedException if they too were interrupted
    at the same time).'
