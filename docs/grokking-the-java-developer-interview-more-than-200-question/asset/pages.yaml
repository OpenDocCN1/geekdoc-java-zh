  md: is known as SerialVersionUID. It is used to verify the sender and receiver of
    the serialized object. The sender and receiver must have the same SerialVersionUID,
    otherwise, InvalidClassException will be thrown when you deserialize the object.
    A Serializable class can declare its own UID explicitly by declaring a field.
    It must be static, final and of type long. Remember, there is an exception for
    SerialVersionUID that although it is static, it gets serialized too, so that at
    the object deserialization the sender and receiver can be verified.
