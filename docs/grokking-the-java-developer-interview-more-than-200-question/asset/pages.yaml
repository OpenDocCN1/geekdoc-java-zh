  md: "Example:\nJava Bean, where all data members are made private and you define\
    \ certain public methods to the outside world to access them.\n\n+   3. **Inheritance**:\
    \ Using inheritance means defining a parent-child relationship between classes,\
    \ by doing so, you can reuse the code that is already defined in the parent class.\
    \ Code reusability is the biggest advantage of Inheritance.\n\nJava does not allow\
    \ multiple inheritance through classes but it allows it through interfaces.\n\n\
    +   4. **Polymorphism**: Poly means many and Morph forms. Polymorphism is the\
    \ process in which an object or function takes different forms. There are 2 types\
    \ of Polymorphism :\n    - Compile Time Polymorphism (Method Overloading)\n  \
    \  - Run Time Polymorphism (Method Overriding)\n\nIn Method overloading, two or\
    \ more methods in one class have the same name but different arguments. It is\
    \ called as *Compile time polymorphism* because it is decided at compile time\
    \ which overloaded method will be called.\n\nOverriding means when we have two\
    \ methods with same name and same parameters in parent and child class. Through\
    \ overriding, child class can provide specific implementation for the method which\
    \ is already defined in the parent class.\n\n# **Question 2: What is an abstract\
    \ class?**"
