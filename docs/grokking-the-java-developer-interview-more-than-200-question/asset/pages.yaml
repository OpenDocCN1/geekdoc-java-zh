    **AOP Proxy** : an object created by the AOP framework in order to implement the
    aspect contracts (advise method executions and so on). In the Spring Framework,
    an AOP proxy will be a JDK dynamic proxy or a CGLIB proxy.


    **Weaving** : It is the process of linking aspects with other objects to create
