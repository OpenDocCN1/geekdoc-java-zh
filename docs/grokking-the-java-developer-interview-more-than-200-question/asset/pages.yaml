  md: "condition, like shown below:\n\n```\npublic class A {\n    private A() { }\n\
    \n    private static A instance;\n\n    public static A getInstance() {\n    \
    \    if(instance == null) {\n            synchronized (A.class) {\n          \
    \      if(instance == null) {\n                    instance = new A();\n     \
    \           }\n            }\n        }\n        return instance;\n    }\n}\n\
    ```\n\n**The reason of second if condition inside the synchronized block** : suppose\
    \ there are 2 threads and both called the getInstance() method at the same time,\
    \ now they will both be inside the first if condition as instance is null at this\
    \ time, and the first thread which acquires the lock will create the object and\
    \ as soon as it exits the synchronized block, other thread which was waiting,\
    \ will acquire the lock and it will also create another object thus breaking the\
    \ singleton pattern. This is why it is called \"double-checked locking\"."
