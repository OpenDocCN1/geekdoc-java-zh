    # Core and Max Pool sizes: A ThreadPoolExecutor will automatically adjust the
    pool size according to the bounds set by corePoolSize and maximumPoolSize When
    a new task is submitted to the executor then:


    +   - If the number of threads running are less than the corePoolSize, a new thread
    is created to handle the request

    - If the number of threads running are more than corePoolSize but less than maximumPoolSize
    then a new thread will be created only if the queue is full


    Let''s understand this with an example: You have defined the core pool size as
    5, maximum pool size as 10 and the queue capacity as 100. Now as tasks are coming
    in, new threads will be created up to 5, then new tasks will be added to queue
    until it reaches 100. Now when the queue is full and if new tasks are coming in,
    threads will be created up to the maximumPoolSize i.e. 10. Once all the threads
    are in use and the queue is also full, the new tasks will be rejected. As the
    queue reduces, so does the number of active threads.'
