  md: 'was used to improve the performance of JVM. In this method, the heap space
    is divided into smaller parts or generations. These are, **Young Generation ,
    Old or Tenured Generation** and **Permanent Generation**.


    The **Young Generation** is where all new objects are allocated and aged. The
    young generation is further divided into 3 parts: Eden Space, Survivor space S0
    and Survivor space S1. When the young generation fills up, this causes a **minor
    garbage collection** . Some surviving objects are aged and eventually move to
    the old generation. All minor garbage collections are "Stop the World" events.
    This means that all application threads are stopped until the operation completes.
    Minor garbage collections are always Stop the World events.


    The **Old Generation** is used to store long surviving objects. Typically, a threshold
    is set for young generation object and when that age is met, the object moves
    to the old generation. Eventually the old generation needs to be collected. This
    event is called a **major garbage collection** . Major garbage collection are
    also Stop the World events. Often a major collection is much slower because it
    involves all live objects. So, for Responsive applications, major garbage collections
    should be minimized. Also note that the length of the Stop World event for a major
    garbage collection is affected by the kind of garbage collector that is used for
    the old generation space.


    The **Permanent generation** contains metadata required by the JVM to describe
    the classes and methods used in the application. The permanent generation is populated
    by the JVM at runtime based on classes in use by the application. In addition,
    Java SE library classes and methods may be stored here.'
