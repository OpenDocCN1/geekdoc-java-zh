    implements List<E>, Deque<E>, Cloneable,\njava.io.Serializable {\n  transient\
    \ int size = 0;\n/**\n  * Pointer to first node.\n  * Invariant: (first == null\
    \ && last == null) ||\n  * (first.prev == null && first.item != null) *\n  transient\
    \ Node<E> first;\n/**\n  * Pointer to last node.\n  * Invariant: (first == null\
    \ && last == null) ||\n  * (last.next == null && last.item != null) *\n  transient\
