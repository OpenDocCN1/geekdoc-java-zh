    in a synchronized block/method then no other thread can enter this block/method


    +   - wait() method is used for inter-thread communication while sleep() method
    is used to introduce a pause on execution


    +   - waiting thread can be woken by calling notify() or notifyAll(), while sleeping
    thread will wake up when the specified sleep time is over or the sleeping thread
    gets interrupted


    +   - wait() method is non-static, it gets called on an object which synchronization
    block is locked while sleep() is a static method, we call this method like Thread.sleep(),
    that means it always affects the currently executing thread


    +   - wait() is normally called when a condition is fulfilled like the buffer
    size of queue is full then producer thread will wait, whereas sleep() method can
    be called without a condition


