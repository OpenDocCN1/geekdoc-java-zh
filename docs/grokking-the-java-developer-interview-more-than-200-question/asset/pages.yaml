- img_proc: true
  md: 'are:


    +   - Abstract class can have both abstract and concrete methods but interface
    can only have abstract methods (Java 8 onwards, it can have default and static
    methods as well)


    +   - Abstract class methods can have access modifiers other than public but interface
    methods are implicitly public and abstract


    +   - Abstract class can have final, non-final, static and non-static variables
    but interface variables are only static and final


    +   - A subclass can extend only one abstract class but it can implement multiple
    interfaces


    +   - An Abstract class can extend one other class and can implement multiple
    interfaces but an interface can only extend other interfaces


    In this question, the interviewer may try to confuse you by saying that from Java
    8 onwards, you can have static and default methods in an Interface so now what
    is the difference between abstract class and interface and the answer you should
    tell is – We can still extend only one class but can implement multiple interfaces.


