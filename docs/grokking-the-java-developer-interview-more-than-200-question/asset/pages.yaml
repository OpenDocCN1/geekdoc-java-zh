  md: '# Question 114: What is the difference between a Monolith and Micro-service
    architecture?


    Answer: In monolithic architecture, applications are built as one large system,
    whereas in micro-service architecture we divide the application into modular components
    which are independent of each other.


    Monolithic architecture has some advantages:


    +   - Development is quite simple

    - Testing a monolith is also simple, just start the application and do the end-to-end
    testing, Selenium can be used to do the automation testing

    - These applications are easier to deploy, as only one single jar/war needs to
    be deployed

    - Scaling is simple when the application size is small, we just have to deploy
    one more instance of our monolith and distribute the traffic using a load balancer

    - Network latency is very low/none because of one single codebase


    However, there are various disadvantages of monolith architecture as well:'
