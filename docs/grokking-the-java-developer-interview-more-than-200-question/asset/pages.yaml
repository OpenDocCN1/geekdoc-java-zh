    # Question 4: What is an Interface?


    Answer:


    +   - An interface in Java is a blueprint of a class. It has static constants
    and abstract methods.

    - Interface specify what a class must do but not how to do

    - An interface is like defining a contract that is fulfilled by implementing classes

    - An interface is used to achieve full abstraction.

    - All methods in an interface are public and abstract by default and all variables
    declared in an interface are constants i.e. public, static and final

    - A class which implements an interface will have to provide implementation of
    all the methods that are defined in the interface

    - A class can implement more than one interface, this is how Java allows multiple
    inheritance.

    - Since Java 8, we can have default and static methods in an interface


    # Question 5: Difference between abstract class and interface Answer: The differences'
  merge: -1
