  md: 'Answer: Collections.synchronizedMap(map); Question 107: What is Concurrent
    HashMap?


    Answer: ConcurrentHashMap class provides concurrent access to the map, this class
    is very similar to HashTable, except that ConcurrentHashMap provides better concurrency
    than HashTable or even synchronizedMap.


    Some points to remember:


    +   - ConcurrentHashMap is internally divided into segments, by default size is
    16 that means, at max 16 threads work at a time

    - Unlike HashTable, the entire map is not locked while reading/writing from the
    map

    - In ConcurrentHashMap, concurrent threads can read the value without locking

    - For adding or updating the map, the lock is obtained on segment level, that
    means each thread can work on each segment during high concurrency

    - Currency level defines a number, which is an estimated number of threads concurrently
    accessing the map

    - ConcurrentHashMap does not allow null keys or null values

    - put() method acquires lock on the segment

    - get() method returns the most recently updated value

    - iterators returned by ConcurrentHashMap are fail-safe and never throw ConcurrentModificationException


