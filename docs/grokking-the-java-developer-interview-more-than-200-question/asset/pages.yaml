  md: 'So, it saves the overhead of creating a new thread for each task. If you are
    thinking about what is the problem with creating a new thread every time we want
    to execute a task, then you should know that creating a thread is an expensive
    operation. Thread objects use a significant amount of memory, and in a large-scale
    application, allocating and deallocating many thread objects creates a significant
    memory management overhead without any throttling will lead to the creation of
    large number of threads. These threads will cause wastage of resources.


    There are 2 main interfaces that you must know, one is Executor and the other
    is ExecutorService.


    Executor interface contains execute(Runnable task) method through which you can
    execute only Runnables. Also, the return type of execute() method is void, since
    you are passing a Runnable to it and it does not return any result back.


    ExecutorService interface contains the submit() method which can take both Runnable
    and Callable, and its return type is Future object. ExecutorService extends the
    Executor Interface, so it also has the execute() method.


    Now, we have an idea of what is an Executor Framework, let''s look at different
    types of Executors:


    # SingleThreadExecutor :


    This executor has only one thread and is used to execute tasks in a sequential
    manner. If the thread dies due to an exception while executing the task, a new
    thread is created to replace the old thread and the subsequent tasks are executed
    in the new thread.


    How to create a SingleThreadExecutor: ExecutorService executor = Executors.newSingleThreadExecutor();'
