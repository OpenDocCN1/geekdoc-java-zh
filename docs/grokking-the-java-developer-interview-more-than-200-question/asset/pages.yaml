    # Question 101: What is LinkedList?


    Answer: Java LinkedList class is an implementation of linked

    dist structure and it uses a doubly linked list to store

    the elements. In Java LinkedList, elements are not stored in

    contiguous locations, they are stored at any available space

    memory and they are linked with each other using

    pointers and addresses.


    As Java LinkedList internally uses doubly linked list, so

    LinkedList class represents its elements as Nodes. A Node is

    divided into 3 parts: Previous, Data, Next Where Previous

    points to the previous Node in the list, Next points to the

    next Node in the list and Data is the actual data.


    Some points about LinkedList class:


    +   - LinkedList class maintains insertion order

    - LinkedList class can contain duplicate elements

    - LinkedList class is not synchronized

    - LinkedList class can be used as list, stack or queue

    - You can add any number of null elements in LinkedList'
