    key unit of modularity is Aspect. Using AOP, you can add extra functionality before
    or after a method execution.


    **AOP terminology : Aspect ** : Aspect is a class that implements the application
    concerns across multiple classes, such as transaction management and logging.
    Aspects can be a normal class configured through Spring XML configuration or we
    can use @Aspect annotation.


    **Join Point ** : a point during the execution of a program, such as the execution
    of a method or the handling of an exception. In Spring AOP, a join point always
    represents a method execution.


    **Advice ** : advices are actions that are taken for a particular join point.
    There are different types of advices, like, before, after and around advice.


    **Pointcut ** : pointcut is an expression that is matched with join points to
    determine whether advice needs to be applied'
