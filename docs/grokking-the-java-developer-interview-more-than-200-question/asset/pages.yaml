    # Question 88: What is Executor Framework in Java, its different types and how
    to create these executors?


    Answer: Executor Framework is an abstraction to managing multiple threads by yourself.
    So, it decouples the execution of a task and the actual task itself. Now, we just
    have to focus on the task that means, only implement the Runnables and submit
    them to executor. Then these runnables will be managed by the executor framework.
    It is available from Java 1.5 onwards.


    Also, we don''t have to create new threads every time. With executor framework,
    we use Thread pools. Think of Thread Pool as a user-defined number of threads
    which are called worker threads, these are kept alive and reused. The tasks that
    are submitted to the executor will be executed by worker threads. If there are
    more tasks than the threads in the pool, they can be added in a Queue and as soon
    as one of thread is finished with a task, it can pick the next one from this Queue
    or else, it will be added back in the pool waiting for a task to be assigned.'
