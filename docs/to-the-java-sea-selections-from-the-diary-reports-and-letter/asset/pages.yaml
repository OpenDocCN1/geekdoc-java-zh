  md: 'soon I will call you. So far I haven''t taken too well to rest and relaxation—it
    is pretty hard to unwind after months of strain and I shan''t be able to do it
    well until I know more of my prospects. I have high hopes.


    I have seen Muriel Deavais several times and enjoyed it thoroughly. It was fun
    to get some personal contact with Louie. Sunday night I had supper with several
    officers and we all enjoyed it. Muriel is well. Malcolm is well and doing an excellent
    job. It is fortunate that we built up a good naval reserve.


    The Christmas letters finally arrived today! It is wonderful to have so many people
    write—I wish to reply to each. As you know, the situation does it hard to write
    and I shan''t try to do it.


    What I shall do, is uncertain; there are many readjustments now being made for
    four of our minor skippers have turned over to their execs and are now waiting.
    I hope to get a new and better command—I have a good record, lots of valuable
    combat experience and I am going to make every effort to commission a new ship.
    That of course would involve very interesting possibilities—I might even renew
    old acquaintances! So—Darling—don''t be surprised by anything.


    My head is so stuffed with experiences and stories that I haven''t tried to write
    them down. My hope is I shall have the chance to put them into orderly form; if
