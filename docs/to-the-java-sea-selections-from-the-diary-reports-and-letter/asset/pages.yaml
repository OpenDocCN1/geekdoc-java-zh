  md: 'inside the basin being taken by the Dutch destroyer Bankert. The next day during
    a bombing raid, a stick of bombs fell alongside the Bankert and broke her back.
    At the same time, within a few minutes, a similar stick of bombs fell near me,
    but they were all duds and landed in the water with a big plop, but no damage.


    Our anti-aircraft [guns] could not reach more than 10,000 feet. The Japanese were
    bombing from 12,000 to 15,000 feet and it was futile for us to shoot at them.
    The shore batteries were not effective. I know of no situation more nerve-wracking
    than be a target for bombing and not able to fight back. We would wait until we
    heard the whilst and then lie flat on the deck; I dispersed my officers so that
    we were hit, all the officers would not be killed by one bomb.


    We finally got away from the Holland Pier and went into the stream. The damage
    to the dock at Surabaya was extensive and our fueling [situation?] was getting
    worse.


    Finally, the Houston, Paul Jones, and Ald came from south of Java and joined us.
    The Java was seaworthy and we went out and made a sweep to the end of Modoera
    [Madura] Island and back into port. On the 26th, we were joined by the Exeter,
    Perth, and the British destroyers Jupiter, Electra and Encounter.


    There was no time for a real conference, the senior Dutch officers, vision commander
    officers of the cruisers got together for a few minutes before we went out, and
    a rough plan of action was laid out which encircled sweeping towards Modoera,
    if we found the Java we were encircle them, attack, and return to Soerabaya or
    continue on Batavia. When we left Soerabaya for the battle of the Java Sea, the
    plan was then to return to Batavia.


    At this time, the Pear had been sunk in Darwin by dive bombing, and the Langley
    was sunk south of Java by the same group, apparently, moved to the westward. The
    Langley was sunk by bringing fighters into Tjilatjap on the south coast of Java.


