    # PERSONAL DIARY

    Saturday, 14 September 1940


    Singapore

    We arrived in Belawan Thursday morning [12 September]. The Le Nauzes, Howes, Dean
    Smith and I drove up to Blastagi, a lovely resort about 4000–4500 feet up in the
    mountains. The air was fresh and cool—the first good air I had breathed in weeks.
    The hotel was attractive and the food excellent. It seems to be a splendid place
    to spend leave and get away from the heat. After lunch we went on to Toba Lake
    and then back Medan, where we stopped for tea and on to Belawan Deli. The road
    up the mountains was beautiful; thru fields of rice, tea, some cane and some rubber.
    The towns are clean and attractive-appearing.


    # Sunday, 15 September 1940


    Singapore

    We arrived here about nine yesterday morning. The British are calling in all currency,
    apparently to check the Nazi use of British pounds in occupied territory, everyone
    with ten pounds to surrender it.


    A Chinese from the Seychelles had his life savings, including a few gold sovereigns,
    which had to be turned over. He will be paid off in Straits [Settlements] dollars
    I suppose.


    After getting ashore on Consul General Patton² and picked up four letters from
    Isabel and one from Will.


    I was glad to hear from home that things are going well! I am so proud of my family
    for the way they react and cooperate.


