  md: '# COVER


    The destroyer USS John D. Edwards (DD 216), commanded by Henry E. Eccles, at the
    battle of Badoeng (or Badung) Strait on the night of 19/20 February 1942. The
    engagement was yet another futile attempt by the American-British-Dutch-Australian
    force, including what had been the U.S. Asiatic Fleet, to defend the Netherlands
    East Indies from the Japanese advance in the months after Pearl Harbor. How Eccles
    led his twenty-one-year-old ship, one of ten Allied destroyers and cruisers, relentlessly
    attacks a Japanese landing force (as related in chapter 6), to be rebuffed by
    only four Japanese destroyers—more modern, better equipped, more effectively organized,
    and trained for night surface combat. Commander Eccles, who later made major contributions
    to the Navy and the Naval War College, had traveled halfway around the world to
    find himself caught up in a running Allied defeat, one that he and his crew, though
    brave and determined, were fortunate to survive.


    An original painting by Ann G. Bayer, based on the diary entries, letters, and
    reports collected in this book. The artist''s work—mostly depicting striking battle-noted,
    Allied scenes and structures—has been exhibited in the Newport, Rhode Island,
    area. (She gracefully acknowledges the inspiration of Dennis Adams'' stirring
    painting HMAS Perth in the battle of Sunda Strait, which hangs in the Australian
    War Memorial.)


    Inset and title page: Henry E. Eccles as a captain, 1944–45.'
