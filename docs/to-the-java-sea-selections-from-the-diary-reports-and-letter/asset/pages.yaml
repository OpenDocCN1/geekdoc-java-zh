    We left Tutu at five yesterday afternoon and had a beautiful cool trip up to Zambanga.
    I suppose it will be hot today but even then it won''t be as bad as Cavite.


    At the moment there is little to write about. I hope to play golf this afternoon
    and probably will also look the shops over again.


    I am beginning to be encouraged about the strike situation—it is so much better
    to have had the coal strike settled without bloodshed of a major nature, even
    though certain amount of delay was involved. Possibly some delay practical, sensible,
    fair method of handling labour will be evolved to be permanent. Our capacity for
    adjusting our strains is of vital importance and the whole picture must be viewed
    before we reach conclusions. In any event it looks better—


    And now to close—give my love to Nan [Nancy Room, a niece] and tell Dad I''m well
    before leaving Zamboanga. ...


    # LETTER TO MRS. ECCLES, THURSDAY, 8 MAY 1941


    Tutu Bay


    Darling,

    Life has bright a bit but it is still overcast because apparently we shall have
    no mail while south. However by the end of next week we shall be back at Cavite
    and there we shall have mail and boat!


    We finally decided that it was better to take a chance on sharks rather than the
    men die of bored so now we are swimming twice a day and it is greatly enjoyed.
    We keep a couple of riflemen on deck and also a patrol boat so there isn''t much
    cause for concern. I haven''t been swimming since Singapore last September and
    even though the water is very warm, 82 degrees to 84 degrees, it is nice to get
    in and the exercise is very relaxing. We went one big hiking trip ashore to Crater
    Lake, which overlooks the bay. Five officers and fifty men went and now at six
    o''clock they returned, dripping wet, sun burned and tired very enthusiastic.
    They were well armed in case they ran into any Hill Moros that might get tough
    but they reported that the natives were friendly. However the villagers did want
    them to be guard in the hills. Last Saturday there was a big raid near the town
    of Jolo—Harry Slocum told me twenty one were killed.


    This all sound fantastic and foolish but it is much better to take a chance with
    trouble than is to let the crew go stale and with endless repetition of drills,
    no liberty, heat and confinement to a small crowded ship.


    Last night Dick Helms and I had dinner over the Whipple then played played till
    1 a.m. I had rather bad cuts managed to break exactly by playing


