  md: '# NEW YORK TO CAPE TOWN 11


    [Sunday, 14 July 1940, continued]

    Today we cross the equator but everyone has been before so re there will be no
    special occasion made of it. The lazy days by and now we are a little more than
    half way to Cape Town. I have been reading Shakespeare with interest: Coriolanus’
    is particularly applicable to political conditions in the United States.


    The wind has died down, so that the forward deck is clear of spray. This makes
    a very fine place to walk and I enjoy it.


    Today is Bastille Day—the liberties of the French people have gone up in smoke
    and flame, just as they were obtained.


    [Evening, continued]


    I miss you in the evenings, the sun goes down in so many different ways and the
    stars come out and I wish we could lean on the rail and enjoy it together. It
    is then that I feel most lonely.


    [Friday, 19 July 1940, continued]


    This week has gone by very quickly. The weather has been fine and is now much
    cooler. The routine of living has been 7:50 wake up–8:15 breakfast with conversation
    9:00–9:30 10:30 walk–10:30–12:00 reading, shipboard or laundry work–12:00 lunch–12:45
    to 3:00 bathing, reading, snoozing etc.—3:00 to 3:30 or 3:45 swimming—this includes
    a terrific roughhouse in the tank with Tommy Cleveland, instigating battles and
    relay races. At 4:30 we, except for missionaries, usually have a scotch and soda
    with the Captain and Chief Engineer, 5:00 supper dangled to 6:00 by table talk.
    Later shipboard—evening around, listen to short radio news etc. For the last two
    nights we have played “Up Jenkins.”¹ to everyone’s delight.


    Captain Sullivan is an expert photographer with three cameras and a complete library.
    He develops and prints all the pictures, samples of which I enclose.


    It is a nice place, quiet, domestic life, with laundry helps going around, beautiful
    weather and intelligent conversation. I have read all the books Skip me a few
