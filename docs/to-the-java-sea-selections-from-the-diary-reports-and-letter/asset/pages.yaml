    On Saturday [27 July] I called the Consulate, and enjoyed seeing Vice Consul Richards
    and Consul Denby.¹ In the afternoon I played golf with Mr. Dan Ward, a local attorney,
    at the Royal Cape Golf Course. Mr. Ward, a friend of Mr. Nuland, was most kind
    and a good companion. Unfortunately it rained, a fine drizzle with a strong wind.
    Saturday night I had supper with the Richards and a group of American refugees
    from Cairo, who had arrived on the President Garfield?² two Foreign Service men
    with their wives and the rest—oil widows from Egypt, etc.


    On Sunday [28 July] I wrote letters to go on the Garfield and then went out to
    the Wards for lunch. After lunch we drove up country—arriving at Stellenbosch
    just after a fine riot. On Saturday I watched the fights on Adderley Street as
    the [Afrikaner] Nationalists interfered with the “No Pause”³ and on Monday night
    I could hear the shouts of the crowd coming from the recruiting meeting. They
    smashed windows in a newspaper office and made quite a racket.


