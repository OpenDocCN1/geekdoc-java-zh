    The outgoing Clipper was quite confused—at first it was scheduled to go out Monday,
    on Saturday it was changed to Sunday, then back again to Monday etc.; finally
    I believe it went out today but in the meantime people were frantically trying
    to catch up on letters.


    Saturday I had a good game of golf and a quiet evening sleeping at the club. Sunday
    morning was a golf tournament against the golf club. I played my best golf for
    months and was one of the few to win for the Navy. I got an 87 with two out of
    bounds and three shots to get out of one trap. In the afternoon I played again
    and on Monday morning was pleasantly surprised to find myself feeling very well
    indeed—not tired. The two weeks of overhaul gave me a chance to get into pretty
    good shape. Now I''m sleeping. Good night Darling.


    > [Frid, 24 October 1941, 11:30 AM, continued]


    How time has flown! Yesterday started at 0645 and continued past midnight during
    all which I was on the bridge except for about two hours. Then again at 0530 this
    morning we came [in] to anchor. I had to do quite a bit of broken field running
    as I thru the thru the mine field this morning, for lots of ships and towed barges
    were coming out so there were no dull moments. However, Darling, I am really tired.
    In after lunch I shall try for a nap then tackle my paper work in the afternoon,
    for the brain isnt too bright and some of the work is involved. There are so many
    times I can write and then when I get the time to write I may be very tired or
    lack the feeling of detachment necessary for good expression.


    Thursday afternoon Swede, Giles, Buzzetti and I took the wherry and went ashore
    on a tiny island in the bay which we anchored, and I stroled along the beach looking
    at pretty shells and coral the thought hit me hard, of how often we have shared
    the fun of strange shells, and sand and color and water and how wonderful it is
    for me to be able to love you and to find the small excitement that are waiting
    for those who are in tune with other and life. The States have given us wishes
    so much—and I know that “Star Bright,” etc., will always be ours, for our wishes
    for love together and forever are true. And we are always my Isy. And now for
    lunch—snap out of it H.E.!'
