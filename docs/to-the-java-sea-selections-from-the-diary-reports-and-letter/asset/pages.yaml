    7 December 1941–18 February 1942


    1942 DICTATION [CONTINUED]


    Satur night [6 December], we got word to get out of Balikpapan the following night,
    and in accordance with that order, Sunday afternoon we fueled to capacity and
    left Balikpapan about 9:30. Allowing the difference in time between Balikpapan
    and Pearl Harbor we actually left Balikpapan about 5 or 6 hours before Pearl Harbor
    was attacked.


    At that time all of us felt that war was a matter of hours or days. So it was
    no great surprise to us at about 3:00 o''clock in the morning to get the signal
    "Japan has commenced hostilities, govern yourselves accordingly."


    The 57th Division left the Black Hawk and proceeded at high speed to Singapore
    where [we] were supposed to act as anti-submarine screen for the Prince of Wales
    and the Repulse. We had a rather eventful trip to Singapore, stopping several
    times to warn merchant or to investigate merchant. One of the interesting aspects
    of the trip was the fact that every mast that came over the horizon looked like
    an enemy army.


    We had no idea what the disposition of the Japanese fleet was and the nerves of
    men were on edge in an anticipatory sense.


