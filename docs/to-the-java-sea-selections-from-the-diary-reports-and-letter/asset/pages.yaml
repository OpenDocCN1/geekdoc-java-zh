    # PERSONAL DIARY


    Monday, 23 September 1940 [continued]

    Bangkok is famous for its mosquitoes but I escaped relatively lightly. The houses
    of the wealthy are splendid but the city does not appeal to me as a residence.


    Flying over the rice fields this morning gave me a strange feeling. They look
    like, and are actually, swamps, and the idea of people living and building villages
    in that sort of country is quite new. The “Teaming East”—how appropriate that
    term is. I can begin to appreciate the difficulty of understanding the Orient
    and what a problem it is. I can also better appreciate and have more respect for
    the term “God’s Country!”


    Aboard Corsair we now have the Thai mission to Rangoon: they were extremely agreeable
    and seemed to enjoy the trip.


    They got a fine send-off when they boarded the ship, thousands of Thais coming
    down the river [from which the flying boat took off] waving flags and shouting.


