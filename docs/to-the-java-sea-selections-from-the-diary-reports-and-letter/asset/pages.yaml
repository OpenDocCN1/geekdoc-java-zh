    # LETTERS TO MRS. ECCLES, FRIDAY, 5 JULY 1940


    ... The last two days have been delightful. The swimming pool completed and filled
    and so all worked up a fine appetite in. The food is excellent and yesterday it
    was more than. Today was even better—a bit smoother hence swimming and we added
    more sun bathing and medicine ball work. You would love this trip Darling, it
    is beautiful—the people are nice quick witty and restless. Little Miss Hollay
    is delightful—full of fun and very quiet. She is from Spotsylvania, Virginia,
    full of ancestors and anecdotes—”bright eyes, blonde hair, not quite feet tall
    and very kind of the children she has taught in her mission schools. She must
    be tough too—the Belgian Congo is no place for misses! Mrs. Cleveland is quite
    and motherly—wide eyes with purpose and character, more serious in manner than
    Miss Hollay but full of apparition. Miss Lerbak is a Danish missionary of about
    forty five who reminds me of Ernie Moon [unidentified].


    Our situation is very different from what we have before. It seemed futile to
    do other than take our separation as a matter of course. For years the way we
