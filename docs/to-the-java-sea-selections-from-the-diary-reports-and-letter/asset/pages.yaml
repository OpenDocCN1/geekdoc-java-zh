  md: '# NAVAL WAR COLLEGE HISTORICAL MONOGRAPH SERIES


    +   1. The Writings of Stephen B. Luce, edited by John D. Hayes and John B. Hattendorf
    (1975).


    +   2. Charleston Blockade: The Journals of John B. Marchand, U.S. Navy, 1861–1862,
    edited by Craig L. Symonds (1976).


    +   3. Professors of War: The Naval War College and the Development of the Naval
    Profession, Ronald Spector (1977).


    +   4. The Blue Sword: The Naval War College and the American Mission, 1919–1941,
    Michael Vlahos (1980).


    +   5. On His Majesty’s Service: Observations of the British Home Fleet from the
    Diary, Reports, and Letters of Joseph H. Wellings, Assistant U.S. Naval Attaché,
    London, 1940–41, edited by John B. Hattendorf (1983).


    +   6. Angel on the Yardarm: The Beginnings of Fleet Radar Defense and the Kamikaze
    Threat, John Monsarrat (1985).


    +   7. A Bibliography of the Works of Alfred Thayer Mahan, compiled by John B.
    Hattendorf and Lynn C. Hattendorf (1986).


    +   8. The Fraternity of the Blue Uniform: Admiral Richard G. Colbert, U.S. Navy
    and Allied Naval Cooperation, Joel J. Sokolsky (1991).


    +   9. The Influence of History on Mahan: The Proceedings of a Conference Marking
    the Centenary of Alfred Thayer Mahan’s Influence of Sea Power upon History, 1660–1783,
    edited by John B. Hattendorf (1991).


    +   10. Mahan Is Not Enough: The Proceedings of a Conference on the Works of Sir
    James Corbett and Admiral Sir Herbert Richmond, edited by James Goldrick and John
    B. Hattendorf (1993).


    +   11. Ubi Sumus: The State of Naval and Maritime History, edited by John B.
    Hattendorf (1994).'
