  md: '# TO THE JAVA SEA


    There is a very interesting segregation of groups, with some blending in between,
    and so far I think I have met about every group in Manila—I see people in two
    or three groups, others in only one. Some very "socialite," others good golfing
    companions, and one in particular, an Irishman from Dublin Kevin Mallon, who is
    the representative of International Business Machines, fine golfer, attractive
    personality, fine mind with a taste for good thoughtful reading. Then there is
    Tim Heppel, for 40 years or more, in charge of sales for the San Miguel Brewery.
    Tim is in the bar from three to seven every afternoon, usually tight, but knows
    everyone in Manila or whoever was, and is universally liked. The most colorful
    group here is the Army; they imagination and style and have practically no conversation,
    male or female. Yet they are very cordial and nice, but so many of the older men
    seem bewildered by all the new things that are going on and some to resent very
    much the upsetting of their peaceful routine of certainty and ease.


    The days are warm and the nights cool—everything is very dry—the rains won''t
    start for six weeks or more.


    There is my general stage: the personalities which occupy it, as you see, varied.


    Sunday''s concert started with the Haydn 100th Symphony—well played but to my
    ear not nearly as fantastic as the 99th, which we have.


    Next was a repetition of the Brahms "Love Song," waltzes for orchestra and chorus.
    These were originally written for the piano and chorus then transcribed for orchestra
    but had not been given that since 1870 because the cause was lost. Herbert Zipper
    orchestrated two of the twelve while in the concentration camp at Dachau (see
    note 19). They are perfectly lovely and the chorus sang beautifully, much better
    than the concert three weeks ago. After the intermission there was the "After
    Christmas Suite" written by the son of Judge Hausmann, the wealthiest mine owner
    in the islands. The son was born happily crippled and very backward, he didn''t
    learn to walk until he was twelve! It was light and very attractive with some
    really fine parts. The finale was the "Weiner Blut" waltz of Johann Strauss [the
    Younger]. I have never heard a Strauss waltz played beautifully and it was a revelation
    and a wonderful conclusion to a fine concert. The feeling that went into the playing
    of the Strauss was indescribable—it was alive and lively with inspiration and
    beauty—but pathos was the dominant thing and the expressions on the faces and
    tears in the eyes of the Viennese among whom I sat were moving.


    The trend of affairs is very discouraging; with Bulgaria Nazi it is only a question
    of time before Yugoslavia goes the same way. The chief difficulty in understanding


