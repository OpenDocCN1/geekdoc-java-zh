    pectations were fulfilled. It was quite a rat race at the entrance to the Strait
    the problem that faced us was if we went through the Strait with the cruisers,
    we made a concerted target for bombing attack and in the strait we had room to
    dodge because of its narrowness. Most of the destroyers milled outside waiting
    for the destroyers [cruisers?] to get through.


    The Japanese bombing at that time was not particularly accurate, although they
    did strangle the Hobart. As the spray cleared out of the water and smoke, her
    headlight started blinking and we intercepted the following dispatch [in response
    to a query from Exeter]: "Thank you very much. No damage. Just shaken a bit."
    I later had an opportunity to congratulate the Captain of the Hobart, over a drink,
    on his dispatch


    We all got through the Strait safely, passing the Van Ghent which was on fire
    and blowing up, as we went through.


    That night we changed course three times without signal several near collisions
    avoided. We had very little idea what we were going to do but finally we came
    to anchor off Tanj Priok, Batavia [the western part of Batavia harbor], just about
    down. It was quite foggy and we did not know exactly where we were.


    We got underway shortly thereafter and returned to Oosthaven, passing many ships
    bound from Oosthaven to Batavia. Oosthaven had been evacuated and was being destroyed.
    The town and warehouses were in flames and only few ships were left there.


    We went down to Ratai Bay in the afternoon and fueled from the remaining tanker.
    People were naturally discouraged. We fueled all it, a very slow job. The Java
    had to fuel first and then the American destroyers.


    The Barker and Bulmer had been ordered to Tjilatjap for repairs, and left four
    American destroyers—Steeward, Edwards, and Willey—with the Dutch. The Dutch cruisers,
