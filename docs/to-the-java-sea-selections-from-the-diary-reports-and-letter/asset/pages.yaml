    # LETTER TO MRS. ECCLES, SUNDAY, 22 FEBRUARY 1942


    Dear Darling,

    A Just brief to note you and Skip, the other night we had our first engagement-
    and we came in fine shape. Destroyer Squadron 29 already made a record that no
    outfit ever equalled and I am proud to command a ship in.


    The odds are great but no matter the outcome we have set an example for the rest
    of the Navy.


    We had too much love and ever ever feel cheated and the spirit can never be denied
    the ultimate victory. I love you both.


    # LETTER TO MRS. ECCLES, MONDAY, 23 FEBRUARY 1942


    ... This is a very peculiar situation and my feelings have been quite confused.
