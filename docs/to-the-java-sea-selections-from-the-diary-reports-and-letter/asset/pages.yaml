    # LETTER TO MRS. ECCLES, THURSDAY, 15 AUGUST 1940


    Marine Hotel, Durban


    The ship was delayed until this evening and so I have an extra day in port. ...nI
    have finally broken down and bought my heart''s desire: the "carry-all" or "hold-all"
    for which I have earned when travelling and now all the odds and ends will be
    rolled up in it! It may mean Henry Dreyer presented me with a beautiful kaross
    for you and since I had no other way of carrying it that I had to buy the hold-all.
    The kaross is a beauty, all black and tawny and gold and very light and warm.


    What is a Kaross? It is a light fur throw-over robe and ours are made of eight
    jackal skins. And it is all packed in mothballs with my light overcoat and cold
    weather affairs in the hold-all.


    Good bye for a Darling. We shall have such good times when we meet this fall.
    My love to all the family.


    # PERSONAL DIARY


    SS Swartenhondt, Monday, 19 August 1940

    A week ago Sunday [11 August] I had lunch in Pretoria with Henry Dreyer, Mr. and
    Mrs. Jerry Nolan, and Mrs. E. R. Smith, Henry Kirkpatrick and Mr. Maier: Nolan
    is a former Vacuum [Oil] now coordinating and directing all oil supply for the
    government. Mr. Smith is Secretary for Commerce for the Union. The club was delightful
    and had a view which very well could be considered for Northern California.

    At 2:20 we had the lunch table-dashed Pretoria after getting missed once or twice
    and headed for Johannesburg [about thirty miles south] arriving at the station
    being guarded by a partially kidnapped nephew at 3:35—my train left at 3:40 [for
    Durban, today a fifteen-hour trip], and after a while I was able to get a seat
    in a compartment with Captain A. T. Fard of the Gold Coast Regiment of the African
    Frontier. He is now a fellow passenger on this ship—returning from leave to join
    his regiment in Kenya.


    63 The Union of Africa, which extended from 1910 as a dominion of the British
    Empire until 1961,

    In 1900 the British Colonial Office originally raised forces in each of the British
    West African colonies for local garrison duty and combat in the war. The force,
    led exclusively by officers, became "Royal" in 1928, and in 1939 was turned over
    to the War Office, as it had been for World War I. The Gold Coast Regiment was
    disbanded in the eponymous colony, later the Republic of Ghana the force in 1960;
    the colonies having achieved or being on the verge of independence merged their
    forces into national armies. A. E. Hayward and F. A. S. Clark, The History of
    the West African Frontier Force (Alders, U.: Gale and Holden, 1964).


    65 The West African Frontier Force had participating since in the East African
    campaign, driving the Italians out of Kenya, Sudan, Somalia, Eritrea, and Ethiopia.
    Formal Italian resistance would end in November 1941), to be succeeded by guerrilla
    fighting in Ethiopia until September 1963.'
