  md: '# TO THE JAVA SEA


    Today I mailed you a batch of Christmas cards that came to me—they will probably
    reach you early in March.


    Last night I saw Philadelphia Story and really loved it—it is such a delicious
    play and the movies dia a splendid job. I am sorry that you saw it under such
    adverse circumstances—if we could have been together I would have gotten the old
    kid from it.


    I feel rather well tonight because at the [Army and Navy] Club I got word that
    a rather unconventional suggestion of mine [presumably at the Bureau of Engineering]
    in regard to the best approach to a difficult submarine engine had produced excellent
    results and incidentally quite a bit to restore the faith and confidence of some
    rather beaten-down young officers. In reality it was quite simple—just tell the
    exact facts as well as you are able to determine them—and tell to the right people,
    i.e., the people who are in the best position to correct them—and then trust in
    their judgement and sense of fairness to give you prompt and decisive action.
    It does not seem very complicated but actually, Sweet, it is remarkable how years
    of peacetime methods and routine have obscured the minds of many people all to
    the real issues which are at stake. The resulting action was prompt and boy! was
    was decisive!


    And now the men that must actually do the fighting feel that they are understood
    and receiving the maximum of cooperation from the Navy Department. Of course some
    people find out that I had a finger in the affair they will be mad at H.E.E. But
    frankly I don''t care because the people whose opinion I really value are on my
    side and we can call up one more victory for the combination of Eccles and Dana
    [see note 2] versus the obstructionists!


    And so I shall turn in—my cold is all gone, I have a clear conscience and best
    of all—I love you—


    P.S. 1 I like the New Year.


    P.S. 2 I also bought stocks and shabby sailor skivv!


