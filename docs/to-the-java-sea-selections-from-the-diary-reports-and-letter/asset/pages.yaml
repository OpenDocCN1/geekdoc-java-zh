    # PERSONAL DIARY

    Sunday, 6 October 1940

    Soengei Gerong, Sumatra


    I left Singapore at 7 this morning on a K.L.M. plane and now well settled in a
    guest house at the refinery of a subsidiary of the Standard Vacuum Co.


    My trip back from Bahrain was tiring and I very glad indeed to get a full night''s
    rest on my return to Singapore. A very interesting Jew from Palestine—Ben Nahum—aboard
    the plane on his way to New York to get some city business and help his wife a
    baby. He is from Haifa and tasks most interestingly on affairs in Palestine. The
    advantages of complete ownership of an [oil] field or group of fields are manifest
    in that it allows for very efficient pressure maintenance and complete control
    of flow. The casing gasoline is extracted at the field, and separated [from] the
    gas being pumped back into the wells for pressure maintenance, and the gasoline
    reblended with the discharge oil on the pipe-line pumps to reduce viscosity and
    paraffin deposition on the pipe lines.


    Calcutta appeared even more dismal and depressing than before. There seems to
    be no vitality, hope interest in the faces of the people.


    It appears a decayed and hopeless mass, over-crowded [and?] worthless.


    The jungle is very thick and there are jaguar, monkeys, and wild pigs—there are
    also a few elephants in the general vicinity. I saw nothing but monkeys however
    one cobra on the road.


    As in Bahrain the British explored this territory [apparently the Pendopo field],
    decided it was unproductive, and gave up the concession. And now they are a bit
    out to say the least, that we have been able to develop it so well.'
