  md: 'I was pretty tired when we finally got here, but three cotch and soda, dinner
    and a hot bath made me sleep beautifully. I have found that lying in a tub of
    water with a scotch and soda within is one of life''s real luxuries!


    Mr. Henry Dreyer called early this morning and we drove around a while and then
    in the afternoon we went to the races where we saw the Gold Cup Run. It was a
    fine day except that naturally we lost all our bets—so now can go another ten
    years before going to the races.


    I have been greatly impressed by the quality of the men in uniform that I have
    met and seen here.


    Wednesday, 7 August 1940, 8:30 PM

    Gollel, Swindon


    Henry Dreyer and I and Charlie Brown reached here at 6:30 this evening.

    Henry and I had a drink and a decent dinner after a short walk are ready for bed
    and an early start in the morning. We expect to enter the Kruger National Park
    via the Mozambique border and continue on to the camp at Skukusa. We plan to spend
    three days in the reserve and then go out via Pretoria and Johannesburg.


    Today''s travel over the treacherous Zulu country of Natal; passed many of the
    places over which the Voortkkers fought their war and where Chalka, Dinga and
    Mozelkase the Zulu chiefs had murdered and been murdered. The native huts changed
    character—now they seem to be almost all straw, or woven grass built on a light
    spraying frame. Henry Dreyer says that it is buffalo grass.

    The natives wear less and less in the way of clothing as we get deeper into the
    interior. I love the copper brown of the women''s skins! Their carry is wonderful—if
    only our women stood erect and not slouch! The sense of balance is wonderful to
    permit them to carry a variety of objects from melons, 5-gallon tins of water,
    earthenware jars and even light logs on their heads. The cattle are interesting
    with very long horns, but they seem to be of every variety and mixture. Henry
    says we will see some of the Boer Afrikaner cattle on the high vel [veld, open
    rural lands].


