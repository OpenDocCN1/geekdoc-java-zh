    extremely interesting people and I wish that my mind were orderly enough to comment
    on them—but I''ll try to remember. Don''t forget to keep some cash on hand and
    don''t get involved in too much important work. Have you been to Betty, or Heavy
    and Mary? Later in the spring they would enjoy a visit from you, I am sure, and
    it would help get your mind off the problems of the house and Tink [Tinker Lodge;
    see chapter 4], etc.


    Now I must close—give my love to all the family. Tell Skip that I was very pleased
    with his December report.


    Forgive me all the naughty things I''ve done to you? I love you.


    [Friday, 27 March 1942, 6 PM, continued]


    A fine golf game. All relaxed—morale high. Good luck!'
