    practically the entire economy of the Indies. The items requested were petroleum
    products, scrap iron, bauxite, molybdenum, copra, manganese, tin, rubber, and
    quinine. The first request for petroleum amounted to 1,000,000 metric tons. The
    rubber and copra requests were larger than the normal consumption of Japan, and
