    Isy,

    This has been a long, tiring and unsatisfactory day because so many things went
    wrong. My communication officer is love, and my girl sheved off the Chaumont this
    morning and he was in a terrific fog which resulted in bad omissions—love is sweet
    but it got me very much down today! I particularly wanted things to go smoothly
    because Swede was aboard—but love thrived!


    LETTER TO MRS. ECCLES, THURSDAY, 13 MARCH 1941, 3:30 PM


    Manila

    We have just moored in Manila and the Clipper should close in a few hours. Wednesday
    and today were very good in all respects except that I was too tired to write
    last night. There are so many things that run thru my mind at odd times that I
