  md: '# TO THE JAVA SEA


    Actually my major job is to keep in good shape as possible—to study a bit professionally,
    and to keep general supervision of the yard work. But I have no specific jobs
    to attend. I sent my phonograph up to the Club and have a comfortable room. The
    Club is very dead now that the Army have left. I see Sam Berger frequently...


    Thanks for sending me Lippmann''s comments. It is the clearest and best statement
    of the present situation I have seen. Although I have moments of concern and doubt
    as to what will eventually happen to the country, the moments do not last long—my
    faith is much stronger—I feel that so many people are now doubtful and uncertain
    because a few years ago they did not realize what was actually happening. Furthermore
    I feel more confidence in my own judgment that I do in theirs, because at that
    same time I realize what was happening and certain that in general affairs would
    take the course they actually have. Of course you remember how many times I commented
    on the fact that the people weren''t really “scared”—and when they got the scar
    would begin to fly—well that time has come—some are scared of shadows, some of
    Hitler, some of Roosevelt and some of labor. But I feel that the majority will
    buckle down to work and produce splendid results. We probably will have to fight
    to maintain ourselves if I think we are worth maintaining and that we fight we
    shall win and in the long run shall have a better country and very possibly a
    better world. The very rich will be practically eliminated and in spite of the
    screams of them, do any harm. The labor will go too far and will get kicked in
    the teeth—and certainly that it will be splendid.


    I think that sexual intercourse will continue to be the relaxation of men and
    women—and I certainly shan''t object to that!!! (Even though I am out of practice.)
    And furthermore I think the younger generation is O.K., that men and women are
    honest, capable and willing to work will get along and that people with faith,
    intelligence and have love in their hearts and a perception of the beauties of
    life will be able to achieve, real lives and be rewarded by knowing that they
    are not isolated individuals in a world of complete sin and evil will find many
    others of like faith and belief.


    Sweetheart—if I did not believe what I have been writing I could not have continued
    in the midst of the chipping hammers and rivet guns that are pounding a steel
    bulkhead next to my.


