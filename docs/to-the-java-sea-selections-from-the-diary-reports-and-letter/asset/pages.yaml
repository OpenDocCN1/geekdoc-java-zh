  md: '# MEMORANDUM ON JAVA SEA CAMPAIGN (JUNE 1960) 269


    NOTES 1 Vice Adm. Charles A. Lockwood (1890–1967, USNA class of 1912) was at the
    time of these events chief of staff to Commander, Submarine Force, U.S. Fleet,
    until 1 February 1941; then naval attach to London, until May 1942; then as regional
    Commander, Submarines, Southwest Pacific, with headquarters at Perth, Australia.
    In February 1943 he became Commander, Submarines Pacific Fleet (out October–March).
    In that position, he oversaw the tests, confirming the defects of torpedoes that
    were widely reported by the fleet, and ultimately secured their correction; and
    in 1947 he published several best-selling books and the 1959 classic On the Beach.
    By prior arrangement, his grave at the Golden Gate National Cemetery lies alongside
    not that of his wife but also those of Admirals Chester Nimitz, Raymond Spruance,
    and Richmond Kelly Turner.


    2 The Bureau of Ordnance, founded in 1862, was responsible for naval weapons;
    it was disestablished in 1959, reorganized into what eventually known as the Naval
    Sea Systems Command. The Torpedo Station was built in 1869 on Goat Island, in
    the harbor of Newport, Rhode Island, previously occupied by a fort and then by
    the eponymous pastures. The weapon in question—the Mark 14 torpedo with the Mark
    6 magnetic influence fuse—was introduced in 1926; the testing that had revealed
    the deficiencies and series production were both limited because of the war. Precision.
    In June 1943 the torpedo fully acknowledged in depth settings and the fuse—defects
    that had produced a 70 percent failure. The station was closed in 1951, its functions
    moved to the naval station on Aquidneck Island, which became the Naval Underwater
    Warfare Center Newport. Goat Island is now connected to the city of Newport by
    a bridge and is the site of a large hotel, a marina, a restaurant, and an event
    facility.'
