    Many things gripe me about this war. Among them the fact that most of the shells
    fired at us and bombs dropped on us and the ships that fire them are built from
    materials supplied by the United States. The lubricating oil keeps its ships and
    planes coming from the U.S. Most of the fuel was ours. Many of the airplane engines
    are copies of the ones we sold them and others were bought directly from us.


    But most gripping of all is the fact that the ideas on strategy and naval tactics
    that are being used by the Japanese were the ones which until recently were ours.
    And they are good;[2] but we have shown them to the winds and borrowed others
    from God knows where—and they are not so.


    A senior officer remarked to me that if I did things I might get into trouble!
    Jumping Jehosap—what we call what we have been thru the last month! The supremacy
    of the Fat Head is ghostly to watch! How can a man let his mind orient itself
    that in times we like being comprehension! And yet it is a fact.


    Well, we deserve it—we rewarded minds—we built a front—advertising and publicity—and
    our news reports drip with complacency, self-satisfaction and tommy rot! With
    a liberal mixture of just plain hysteria frown I felt vomiting when I read the
    reports from Batavia and London as to the situation in Java. I know, for I fought
    there. It has been that way all along—terrific dear old public not be alarmed.
    They would have better by a damned sight be alarmed—get rid of the smooties and
    routine boys, dig in and fight.


