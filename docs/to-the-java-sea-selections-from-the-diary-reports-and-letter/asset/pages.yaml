- img_proc: true
  md: 'On 15 January 1945, Eccles, now a captain, received a letter from the Dutch
    naval attaché (who addressed him as "Commander") enclosing the Order of the

    Bronze Lion (Bronzen Leeuw), which had been created the year before to replace
