  md: '# EDITORIAL PRINCIPLES


    In general, the concept of editing this book is that of one of the editors'' earlier
    works: On His Majesty''s Service: Observations of the British Home Fleet from
    the Diary, Reports, and Letters of Joseph H. Wellings, Assistant US Naval Attaché,
    London, 1940–41, Naval War College Historical Monograph 5 (Newport, RI: Naval
    War College Press, 1983; repr. 1993). The initial research and transcription work
    for this book started shortly after that book appeared, 1985–86. At least in the
    primary editor''s mind, it was, and is, meant to complement the earlier work,
    which collected writings from the same period but documents a different theater
    of warfare: Lieutenant Commander Wells''s experiences with the British Home Fleet
    in 1940–41, culminating in the sinking of the German battleship Bismarck. Both
    volumes interweave entries from personal diaries and selections from private letters
    to the officers'' wives with formal, official reports to seniors—an editorial
    attempt to present a rounded record of the experiences of American naval officers
    in different circumstances and of their reactions to them. Wells was the younger
    man, born in 1903 and midshipman in the Naval Academy class of 1925, while Eccles
    was born in 1898 and graduated with the Academy class of 1922. Together, the selections
    from the documents these two left behind are complementary bases for better understanding
    the professional, cultural, and social outlooks of American naval officers of
    their time, the very moment at which the United States entered World War II.


    In general, the editors have retained the carefree or hurried letter''s mode,
    preserving its careful punctuation. In the interests of clarity, however, the
    spelling has been regularized; punctuation has been silently adjusted where the
    original is confusing; and, especially, Eccles''s proclivity toward capitalization
    has been silently reined. Elliptical expressions and abbreviations have been expanded
    when necessary for intelligibility—silently where only particles or function words
    are involved or words have apparently been omitted, but in brackets when substantial
    insertions are required for clarity of meaning. Rendering of'
