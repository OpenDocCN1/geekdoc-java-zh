  md: 'A short review of the trip: We had a fine voyage with no rough weather and
    only a few unpleasant days. The passengers were congenial and while there was
    no excitement, time passed quickly and in an interesting way. I read a good deal,
    got moderate exercise and quite a bit of lazy sun bathing. We arrived in Cape
    Town Friday and I was met by Walden''s [see note 34] friends, who have been most
    kind since then. I have a car and a driver at my disposal and have met some interesting
    and attractive people. Friday afternoon and Saturday morning was planning the
    rest of my journey and tomorrow I hope to make immediate decisions. The general
    plan is that I drive up to Durban [about a thousand miles, see map], cut back
    to Johannesburg [about 350 miles] and Pretoria [forty-five miles], on the Kruger
    National Park (Game Preserve) and then back to the coast either Durban or Lourenço
    Marques'' as suits the Bombay [Mumbai] steamer. At Bombay I shall make further
    plans.


    It appears that sailings to Bombay are irregular and infrequent I have to wait
    until August 15th or even later; on the other hand when I reach Durban I will
    find a steamer to ready to, in which case I probably skip part of my African visit.
    That would be unfortunate for I probably will never again have such an opportunity.


    Yesterday I played golf in the rain, then to an informal supper at the Vice Consul''s
    home. I am lunching today with a local attorney, Mr Ward—tomorrow I am lunching
    with Comdor. Richards at the Naval Station at Simonstown.¹⁴ I shall remain in
    Cape Town until Wednesday.


    Cape Town is a delightful city. It carries a cold Hololu. The clouds hang over
    the mountains, the foliage is much the same and the houses have the same color.
    It is very neat and clean. This hotel is a gem-perfect English "preserve", full
    of specimens that you would delight in—some smile nicely, all of them you would
    enjoy; I shall give more details in other letters.


    I miss you horribly—there is so much would take life if you were here to enjoy
    it with me, so much together. Skip would enjoy it too.—However we will have our
    fun in the East in the fall. I shall miss you and more—take care of yourself,
    Darling—giving Skippy a hug and the enclosed stamps. (I hurry to get the letter
    off!)


