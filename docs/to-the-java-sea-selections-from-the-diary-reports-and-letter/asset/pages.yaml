  md: '# LETTER TO MRS. ECCLES, TUESDAY, 6 JANUARY 1942


    Darling Isy,

    There seems to be a chance of mail starting off tomorrow and reaching at some
    indefinite time in the future. With luck you may have received a letter mailed
    about two weeks ago—I hope so in any event.


    Today I became a commander—no insignia of rank save an old brass hat [note 16]
    for Elmer Helenkamp[chapter 3, note 30] left for me when he went back to the State
    about three months ago. So it goes, rank seems to mean very little now with so
    much to be done. Of course I have thought how concerned you must have been with
    all the true and false reports coming out during the last month—but there hasn''t
    been any possible way that I could get word to you.


    The fall of Manila was no particular surprise. It was strange how many people,
    military, naval and civilian never visualized such a possibility. I feel very
    badly about all the people that I know. I feel quite sure that it is the first
    American city ever to be captured in our history. Certainly it should be jolt
    to whoever shares of complacency, self-satisfaction and un that may exist at home.
    And in totalitarian warfare the capture of a large city has implications that
    may be very tragic indeed.


    Today was a promotion day—two other officers on the ship were also promoted and
    of count hundreds of others thru to the Navy. My blue uniform with its shiny LtCom
    stripes [note 16] is carefully put away in my locker. I wore LtCom sport [full-dress;
    service?] twice once—once at the Presidential Reception and once to have my picture
    taken! Thank goodness I did not waste any money on uniforms!


    Sweetheart it is hard to write intelligently—see I small part of a tremendous
    war and problems. We have received no mail in a month—no papers and very little
    reliable news—so it is largely work with us in so far as judging the whole situation.
    And of course, I have no idea as to home affairs, how you have been and all you
    have been doing.


    I hope you and Skip and the others have been well—that''s all I can do. I know
    you have the faith and courage to do your part—I hope I can do mine well. Thank
    goodness I have been well—of course times I am very tired—at other times concerned
    but that is natural in war.


    And goodnight sweetheart. Forgive me all the naughty things I''ve done to you?
    I love you.


    We have plenty of funny things happening—but unfortunately I can''t give you enough
    background for the humorous side for you to appreciate them.'
