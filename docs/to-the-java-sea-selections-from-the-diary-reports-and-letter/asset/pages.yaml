    The newspaper comments and the statements of various officials are as full of
    guff as ever. Reassurances to which which are obviously critical to be published
    just before the collapse. The truth when bitter is sugar coated to the point of
    nausea and the reaction in the long run is the same. One very obvious fault with
    the allied situation in the N.E.L., Malaya, Burma and other places has been the
    fact that the native populations have not really cared who won the war they know
    that are subject people and will remain, exploiting this to the utmost.


    People are going to get what they deserve if they are soft; they will be defeated.
    If they are tough and resolute and have the resources and intelligent aggressive
    leadership, they will survive and win. They must be willing to sacrifice themselves.
    The nation must not waste energy trying to defend things, for today there is no
    such thing as successful defense. That is one of the great troubles with the American
    point of view: for years "defense" have had best "defense" and realize that in
    offense lies their only hope. Of course certain strategic points must be strong
    in order to secure communications, others must be strong to protect supplies and
    others to furnish bases from which to launch an offense. It is perfect nonsense
    to talk production figures—the significant figures lie only in how many trained
    units that production can be launched against the enemy.


    These four-pipers have acquired several nicknames—“The Suicide Squadron” is one.
    The Dutch sailors called them "Devil Tempers" they are a proud lord and have fooled
    a many people. One had started a rumor that the U.S.A. had stopping building destroyers
    and was going to build old ones instead!


    And now to build Sweetheart—rest may again be scarce before long—good night Dear.
