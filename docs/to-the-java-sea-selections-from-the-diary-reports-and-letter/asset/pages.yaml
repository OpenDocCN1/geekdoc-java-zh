  md: '# JOINING THE ASIATIC FLEET 99


    Wooding is a grand person for conversation and his education and intellectual
    background are very fine. Music and philosophy are his chief interests, and with
    him has a fine command of great appreciation for the English language, tolerance
    for people, and intolerance for cheapness. The story of the classics, which is
    so emphasized in English schools, gives men of this type a background of Greek
    literature and philosophy which is not dry but. I wish I knew more about them;
    but I do enjoy listening to his discussions. He looks rather akin, and is not
    immediately attractive but improves tremendously by knowing.


    I must guard against becoming too involved in abstractions, but I have enough
    work to prevent that. Actually the conversations show the superficiality of my
    own education, but I know that there are other aspects of my life that I know
    and point of view that scholars not usually have. And my opinions being modified
    by the discussions are not being thrown down completely. Actually, I have learned
    a good deal and am getting a better understanding of certain phases of criticism
    heretofore have been obscure.


    I have been reading Del with great interest ever since it arrived last. The course
    of an old coal destroyer of 25-30 years ago was quite a different ship from this
    one, the Edwards, and of course the present enlisted is very different from the
    men of those times, but nevertheless I feel that the characters are overdrawn
    and the picture itself so dramatized. Ordinary common sense does not see the enter;
    the Navy is a much more of fact out than than would indicate-it has high dramatic
    moments, ground ones, not the way the book indicates. There are enough technical
    errors and over-exaggerations to show that the author has had relatively little
    real knowledge of the Navy. For example no navy speaks of his ship or writes of
    it "Delilah" or "Edwards." Yachtmen may use the same name but it is not used with
    us.


    I have heard and seen much to confirm Goodrich''s [author of Delilah] opinion
    of the Tagalog but I don''t pretend to have reached a final conclusion. His description
    of the country itself is good.


    [3 PM, continued]


    We are at sea now rambling around slowly calibrating our radio and gun directors
    [see chapter 5, note 19] and until 6:30 nothing will happen—from then until midnight
    we be working—I will write to Skip and possibly Will.


