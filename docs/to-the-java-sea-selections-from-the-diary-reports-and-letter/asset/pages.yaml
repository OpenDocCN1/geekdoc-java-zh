    Dear Isy,

    I have made several attempts to write to this week but I have been either tired

    or the ship has been rolling or some interference came in. It is hard to say anything

    when I know there will be two weeks of mail waiting when we get to port

    torrow evening and there is so much that I am waiting to hear about.


    It has been a busy week and I haven''t had much sleep but it has been interesting.

    The organization has shifted about a bit and some things need smoothing out.


    I keep well, and really have made my life in an acceptable groove. It seems years

    that morning when Skip brought the paper into our bedroom and told us that Hol-

    land Belgium had been invaded. And still, we cannot see more than the general

    pattern of fate; what we anticipated has been largely true—we saw it much more

    clearly than most people. More than anything, the faith that we have been

    nour strength. Rather than wavering, faith has become stronger because we have

    been able to feel it more actively. Can you or anyone else differentiate between
    faith

    or define either? I can''t. But can we and do them and know what

    will always bring to us. Good night my Isy.


