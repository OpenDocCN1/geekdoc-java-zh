  md: '# TO THE JAVA SEA


    [11:15 PM, continued]


    We have just anchored and secured everything for the rest of the night and I am
    quite tired with another long day coming tomorrow. During a good part of the runs
    tonight I was thinking of you. It is a strange feeling to be staring ahead into
    a dark windy watching the dim shape of an unlit ship just a few hundred yards
    ahead with the clearest thing being boiling white wake—and to be thinking of the
    ship with only the automatic part of the mind with all conscious thoughts on a
    lovely woman half away around the world! And now to sleep Sweetheart—I love you.


    [Wednesday, 19 March 1941, 2:45 PM, continued]


    In a short time we will get underway for another afternoon and night of work.
    The mornings have been hazy for the first time in months, I suppose it is part
    of the seasonal change—with the rains starting another month—unfortunately my
    nice aircraft raincoat disappeared and I will have to get another one.


    I loved your clipping about the Brownie Camera Man—How joyful you must have been
    to have your opinion so wonderfully confirmed—your job is now to take lots of
    fine Brownie snapshots of yourself and Skip and the rest of the family and send
    them to me. For what good is a wonderful Brownie if it never takes pictures? And
    I shall continue my efforts with my one camera—then we can really prove the case!
    But Darling I do want some competition!


    I have been catching up on my correspondence, writing a sort of circular letter
    to the Howes, Dean-Smith and Alloy Brown. The distribution of my mail is now complete
    and circles the globe! Which reminds me that the Clipper gets in today and may-the
    mail will come in to Olong tonight or tomorrow. In any event I have hopes. I can
    an an excellent nonsense nursery master, Mayhem in B-Flat, by Elliot Paul [Random
    House, 1940]. It should be read carefully for there are some subtle puns and allusions
    of others not so subtle...


    [Thursday, 20 March 1941, 2 PM, continued]


    We are getting underway in a few minutes—last night was tiring and not too satisfactory.
    We did not finish 1 a.m. but tonight should be short—we will be in Manila tomorrow
    and there is lots of work over the weekend, and another week coming up will be
