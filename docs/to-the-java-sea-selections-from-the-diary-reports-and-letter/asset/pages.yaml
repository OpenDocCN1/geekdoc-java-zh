    out this letter will probably be quite fat before it leaves. Just before I took
    a “two minutes,” or as mother used to say, “forty winks.”


    # LETTER TO MRS. ECCLES, WEDNESDAY, 30 JULY 1941, 10 PM


    At anchor


    My Darling,


    Yesterday we went this morning till 6:30 a.m. to 11 p.m. with an hour''s break
    at 5 p.m., then just just a short time ago. Tomorrow will be another day and night
    affair. From time to time I get quite tired but usually I sleep. However, I don''t
    accomplish all the details I should, but that is impossible.


    I haven''t the vaguest idea of what is going to happen: a few days ago I was convinced
    that the fighting would start within twenty-four hours—now I think that there
    will be another period of comparative quiet before the next alert. But I do know
    that it can break loose any minute but I don''t think it will just yet. The whole
    situation is so complex, there are so many forces pulling in directions that I
    don''t know what to expect. I shall sit tight, expect nothing and prepare for
    everything. But Darling it is exhausting and I don''t enjoy it.


