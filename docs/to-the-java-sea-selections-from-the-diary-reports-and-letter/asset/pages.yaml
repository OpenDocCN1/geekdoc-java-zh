  md: '# INTRODUCTION: HENRY ECCLES AND THE NAVAL WAR COLLEGE


    From the late 1940s into the mid-1980s, Rear Adm. Henry E. Eccles, USN, was one
    of the most widely known and highly respected figures associated with the Naval
    War College, in Newport, Rhode Island. Above all, he was known around the world
    as a military intellectual and as an expert, and author of books, on naval logistics,
    strategy, and military theory; as well as broadly framed civil-military issues.
    For those who knew him at Naval War College in his role as an adviser, the confidant
    of many Naval War College presidents, and as a professional consultant and teacher
    of electives on principles of logistics, international relations, and military
    theory, he was an energetic source of stimulating thought. To the benefit of all,
    he always accompanied his constant reminders to think carefully and to write wisely
    with precision with a demand for clear definitions of abstract terms and ideas.


    As the admiration and appreciation with which he was held in Newport, he is one
    of the rare faculty members to have his portrait painted for the College’s permanent
    art collection. Additionally, the Naval War College published a special issue
    in 1977 to mark the twenty-fifth anniversary of his retirement from active duty;
    and in June 1985 the Naval War College Library was named in his honor, recognizing
    his immense contribution to naval thinking. As Adm. Burke said of him, "Few men
    were so steadfast influential and gained so much admiration and affection from
    their associates."


    Typically, Henry Eccles’s last words to the War College community contained a
    challenge. Pointing out that the library was being named for him considered the
    heart and focus of a vision of greatness for future naval leaders, he said:


    It is not sufficient merely to have this vision of greatness and these ideas contained
    in books and on shelves and in catalog indexes.


    Two forces have been neglected by the staff of the Naval War College must be brought
    to life: One, the discipline of a coherent military theory, the other, an active
    institutional memory. Together these provide the generative power to develop and
    compare ideas and reformulate them in living terms to the ever changing situations
    brought about by political and scientific growth and facts!


    ![](img/271a4dd38c17a5bcd4a1efde5be2dc47_18_0.png)'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# TO THE JAVA SEA


    Immediately after returning to the United States from the events described in
    this volume, Eccles was assigned in the summer of 1942 to the Base Development
    Section of the Office of the Vice Chief of Naval Operations in Washington, DC.
    Here he was given responsibility for the detailed coordination of all U.S. advanced
    bases; he developed the initial ideas that grew into what became known as the
    Functional "Component System of Advanced Base Planning." At the same time, he
    conceived and initiated the "Goldrush Program" to develop the use of the tank
    landing ship (LST) for general logistics support purposes.


    Henry Eccles''s first brief appearance at the Naval War College as a student in
    July–December 1943, when, as a commander, he attended his abbreviated wartime
    Command Course. Promoted to captain shortly after his graduation, he was ordered
    to Hawaii, where he became Director, Advanced Base Section, Service Force, U.S.
    Pacific Fleet. In this post he led the effort that established advanced bases
    as U.S. forces leapfrogged across the Central Pacific islands, dealing with all
    the planning, construction, support, and training issues involved. For his achievements
    with advanced bases, Adm. Raymond Spruce presented the Legion of Merit. At the
    end of the year, Eccles was assigned (in 1946) to the Joint Operations Review
    Board the Army-Navy Staff College (later in 1946 to become the basis of the Naval
    War College) to evaluate joint operations during World II and to revise joint
    doctrine. Eccles was, in hindsight, to see this nine-month assignment under Vice
    Adm. Harry W. Hill as what started his "second career" in the Navy–thinking about
    broad aspects of naval warfare and theory. In addition, it brought Eccles back
    to Newport to lecture at the Naval War College about logistics– North Carolina–class
    battleship USS Washington (BB 56) at New York, where it was preparing for decommissioning.
    Upon completion of his assignment in Washington, Eccles took up Admiral Spruance''s
    invitation to Newport to join the faculty in April 1947 as chairman of the newly
    established Logistics Department, a position he held until 1951. During this period,
    he also lectured on logistics at the National War College, the Industrial College
    of the Armed Forces, the Command and General Staff College, and Air University.


    Henry Eccles''s connection with the College was briefly interrupted in 1951–52,
    when he was ordered as Assistant Chief of Staff for Logistics to the Commander
    in Chief, U.S. Naval Forces Eastern Atlantic and Mediterranean in London, and,
    in a dual capacity under Adm. Robert B. Carney, at the recently established headquarters
    for Commander in Chief, Allied Forces, Southern Europe, at Naples, Italy. In September
    1951, he was detached from his national duties and served thereafter only in the
    NATO role, creating and leading a staff division. Throughout these years, Eccles
    and his wife retained their Newport home, overlooking Battery Park'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'and the harbor, which they had purchased in 1947. They were we to live there,
    at 101 Washington Street, until their departure from Newport in 1985.


    With his retirement from active duty and promotion to rear admiral on the retired
    list on 30 June 1952, Eccles returned to his home in Newport, where he began an
    informal connection with the Naval War College. From 1952 until 1970, he was a
    consultant to the George Washington University Logistics Research Project and
    lectured frequently at the Naval College and the Industrial College of the Armed
    Forces. In 1958, he undertook a series of lectures and special writing for the
    sponsorship of the Ohio State University. At home in Newport, he developed close
    personal ties with many students, staff, and faculty members at Newport through
    shared interest in devotion to the purpose and objectives of the Naval War College
    and his regular participation in College activities. In 1954, Henry wrote, "If
    in my 30 years of service I accomplished anything worthwhile, it was my work in
    logistics and education at both the Naval College and elsewhere. For years I fought
    an unpopular and spectacular fight to bring home the basic facts of war to the
    Navy. Nothing else I was of comparable significance.\^{10}


    In the thirty retirement years that followed, Henry Eccles did in achieve things
    of considerable significance, with his additional books, articles, and teaching.
    Constantly writing and reflecting on military theory and current events, he produced,
    on a daily basis, short reflective papers that he would deliver personally to
    people from whom he wanted constructive criticism. Professor Lyman M. Kirkpatrick
    Jr., a former senior official at the Central Intelligence Agency and later Time-
    professor of political science at Brown University, would later recall that when
    he was visiting Chester W. Nimitz of National Security Affairs and International
    Relations at the Naval War College in the academic year 1971-72, "One of the real
    pleasures was that of the visits from Henry Eccles. I remember the ''bareroom''
    doors of Luce Hall being pushed in; Henry taking a quick look to see if we had
    visitors; coming in and dropping a paper on the desk with an almost standard ordering
    question: ''What do you think of this?''^{11}"


    To the cogncenti who received these misses on a regular basis, they became humorously
    known—out of the admiral''s exhaust—as "ecclesiana," but they required serious
    thought and cogent answers. For regular recipients, they were sometimes accompanied
    by lengthy notes scrolled on the pages of a yellow legal pad; many of these were
    useful in their own right and were filed for future reference as thoughtful reflections
    on military theory and issues of the day. Today they form a large section of his
    papers, filed thematically, in the Naval War Historical Collection.\^{12}'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Earlier Life and Education


    Henry Eccles''s reputation as an influential military and naval intellectual had
    much to with do with his earlier life, education, and upbringing.¹13) These formed
    the habits of mind that characterized his later thinking and are illustrated in
    the diary and letters-presented here. Eccles was born in Bayside, New York, on
    31 December 1898 to the Reverend George Warrington Ecclesles, an Episcopal priest
    and the rector of All Saints Church, Bayside, and his wife, Lydia Lawrence Eccles.
    The parents named the newborn son Henry for their maternal grandfather, Henry
    Effingham Lawrence of Bayside and Morgan City (formerly Brashear, a family name)
    in Louisiana. The young Henry was homeschooled until 1910. Some of his earliest
    education was obtained through the extensive time he spent with his deaf and dumb
    uncle, Townsend Lawrence, a widely read man whom he communicated by sign language.
    During his early years, Henry''s parents often traveled by passenger ship to Europe.
    Between 1904 and 1911, Henry made five trips to Europe with his parents, visiting
    England, France, Belgium, the Netherlands, Germany, and Switzerland, leaving him
    with clear memories of European cultural life before the Great War and a lifelong
    interest in art and music. Throughout his life, Henry also retained vivid memories
    of those ten transatlantic passages credited to his passionate interest in becoming
    a sailor.¹¹⁴


    In 1910, at the age of about eleven, he entered Trinity School in New York City.
    Associated originally with Trinity Church, Wall Street, the school had founded
    it an Anglican charity school. Surviving the American Revolution, it had eventually
    become a nondominational school model modeled on the finest schools in England,
    such as Eton, Harrow, Westminster, and Winchester. Located on West Ninety-First
    Street in the affluent West Side, the school stood side by side with the town
    houses of many wealthy New Yorkers.


    Following Henry''s graduation from Trinity School in 1916, influential friends
    and family members worked hard to obtain an appointment for him to the U.S. Naval
    Academy, in Annapolis, Maryland, but this took a great deal of time to arrange.
