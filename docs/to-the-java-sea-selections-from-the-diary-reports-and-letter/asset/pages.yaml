    It has been a fantastic but grimly real ten days, full of hard nerve-wracking
    work and hazard—high speed steaming day and night, with very little information
    at hand upon which to gauge the situation. As [is] to be expected, the men have
    re-ordered splendidly—their spirit is wonderful and I am proud to command them.
    Some day I will be able to tell a story but censorship prevents that now.


    Today was quiet and we were able to catch up on [a] lot of work and also to relax
    a bit. I am well and expect to continue—I can take the strain and remain cheerful
    and my physique can take it too. My basic opinions have never changed. My predictions
    have come true and also some of my fears. I have a clear conscience when I was
    in a position to exercise control over certain policies I did an honest and realistic
    job in preparing for what has happened.


    Please keep a file of Life and Times—they will be invaluable later on. Details
    of what has happened, you will probably learn before I do the news we get is irregular
    and fragmentary. Please mail me few cartons of Chesterfield to time. My address
    from now is LiCom H.E.E., U.S. John D. Edwards C/O Postmaster San Francisco. Remember
    Is—no news is good news. Unfortunately I don''t think shall receive any mail from
    home till February first at the earliest.


    I shall try to keep a War Diary to be forwarded to the Navy Department sections
    as are finished and in that I shall express and tell of many things I can''t put
    into a letter. I will try to send you money by mail order from time to time I
