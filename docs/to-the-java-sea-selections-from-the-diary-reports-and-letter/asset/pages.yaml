    The Port Elizabeth Club is very beautiful and tough. I played rather badly but
    had a few holes and a thoroughly enjoyable game. Mr. Green is a fine golfer and
    very good sport. I left Port Elizabeth at about twelve and reached this attractive
    city of East London at half past five. I am staying at the Beach Hotel, with all
    the luxury of a private bath. I must admit I am very soft, I am well fed with
    old plumbing, especially when it is scarce. The drive today was quite different,
    being rough and dirty and passing for the most part barrier country. We saw large
    numbers of native huts, circular small affairs of sticks plastered with mud and
    with conical or round thatched roofs. The natives themselves are a coppery brown
    and all contrasting red or purple turbans. Everything is carried on the head and
    it is marvelous to see what awkward-looking loads seem to go merrily along.


