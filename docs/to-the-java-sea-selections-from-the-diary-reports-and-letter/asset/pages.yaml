    examination; Henry was chosen in his place. Because of all the time he took, it
    was to be August 1918 before he could arrive at the Naval Academy and join the
    class of 1922.


    In the meantime, in the summer of 1916, Henry attended a junior military training
    camp at Fort Terry on Plum Island, off Orient Point at the entrance to Long Sound,^{15}$
    before entering Columbia College to study mechanical engineering during the academic
    year 1917–18. In May and July 1918, between the completion of his year at Columbia
    and his reporting to Annapolis, Henry signed on as a crew member in a United Fruit
    Company ship, SS Sixola, for a voyage to the Caribbean.


    Upon graduation from the Naval Academy in 1922, Henry Eccles''s first assignment
    was as signal officer in the recently commissioned Colorado-class battleship USS
    Maryland (BB 46), the flagship of Adm. Hilary P. Jones, Commander in U.S. Atlantic
    Fleet. The flagship had been present in Annapolis for the graduation of the class
    of 1922. Between 18 August and 25 September 1922, Maryland carried Secretary of
    State Charles Evans Hughes to Rio de Janeiro to the exposition marking the centenary
    of Brazil''s independence in 1822. In February and March 1923 the ship participated
    in Fleet Battle I, an exercise to test the defenses of the Panama Canal Zone,
    battleships playing the roles of aircraft carriers. In June 1923 Maryland passed
    through the channel and the Pacific.$^{16}$ In 1924, Eccles was assigned to the
    battleship USS New York (BB 34)$^{17}$ as assistant first lieutenant; the ship
    crossed the Atlantic with the battle fleet and made port visits to Torbay, Brest,
    Flushing, West-port, Gibraltar, and Ponta Delgado in the Azores. Upon completion
    of the cruise and promotion to lieutenant (junior grade), he received orders to
    the school ship USS Chewink (AM 39) at New London, Connecticut, where he was to
    begin submarine training in January 1925.$^{18}$ Upon completion of submarine
    training he was assigned as navigator and communications officer to the S-28,
    based in San Diego.


    After nearly two years he was transferred to S-25,$^{19}$ another San Diego-based
    submarine, as engineer officer.


    Upon completion of his tour of duty in S-25 in 1928, with six years of service
    afloat, had a six-month course in diesel engines at the Naval Postgraduate School
    at Annapolis, Maryland, and then returned to New York City and Columbia University,
    where in 1930 received his master of science degree in mechanical engineering,
    with his specialty in diesel engines. He was also promoted to lieutenant, and
    with these qualifications he served as commanding officer of the submarine O-1,$^{20}$
    O-1 was decommissioned in June 1931, and Eccles became executive officer in the
    submarine R-13, the training ship at the submarine school, "fleeting up" to command
    the boat in 1932–33.$^{21}$ In 1933 he was given shore duty and appointed engineer
    and repair'
