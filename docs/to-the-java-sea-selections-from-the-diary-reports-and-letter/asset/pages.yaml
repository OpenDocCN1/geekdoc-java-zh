    # LETTER TO MRS. ECCLES, 19 JANUARY 1942

    [FRIDAY, 23 JANUARY, CONTINUED]


    This has been a beautiful day—rain squalls in the morning, just enough for coolness
    and good breeze this afternoon. We, as usual, have not nearly enough information
    to know what really is going on and until something important comes up for us
    it is nerve racking to wonder and speculate. I thought for a moment we had something
    today but it turned out to be a school of fish rather than a submarine. However
    as a drill it was excellent.


    The days are long but night when I get the chance I sleep well. A month I last
    set ashore and I judge that some time will pass before I do again. We are now
    beginning to wander about some mail—eventually we should have some. By the way
    any cigarettes or tobacco you may have sent out here because in vacuum tins to
    avoid mildew.


    This afternoon I was wondering how in times such little things worry people—and
    what real problems of sorts come up and stay with us during war! And in contrast
    how wonderful it is to be able to appreciate the great things of normal life.
    By the time this comes to Pussy Willows [i.e., woodland barbers of spring] will
    probably have come gone. I had always liked them, but you taught me so much about
    how they can make you feel and so many things that bring vitality and joy. Those
    things must never be neglected or forgotten. They should be cultivated and appreciated
    always and in so far as is possible passed on others—not by words, for that is
    impossible but constant living association, as you have given joy to me. My good
    night dear. I love you.


    [Saturday, 24 January 1942, 10 PM, continued]

    How much better I feel tonight! News came in of our outfit caught the Japs last
    night—I wish had been there but I hope all the officers and men get medals. It
    proves to rather skeptical world that the Asiatic Fleet knows how to fight—and
    in the fight only four of our men were hurt!

    I can''t think of anything else so good night.


