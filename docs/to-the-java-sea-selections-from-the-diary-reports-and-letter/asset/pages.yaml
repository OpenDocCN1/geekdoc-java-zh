  md: '# TO THE JAVA SEA


    Simpang Club³ in Soabaya for dinner. Just at that time, Page Smith, skipper of
    the Stewart,¹ came aboard and told that his ship had been turned over drydock.
    She had been put on keel blocks cockeyed and when the dock was pumped out, heeled
    over 54 degrees. It was therefore necessary to destroy her because she could not
    be repaired except by major overhaul in a fully operating yard.


    We came then to a very difficult period. I (i.e., Edwards) was the only one of
    our destroyers that had more than one torpedo left—I had five.


    Java had been badly damaged, the Troop had to leave at once for new control and
    showed off for Australia. The Edwards was in good shape, the Stewart was wrecked,
    the Pillsbury and Parrot had one torpedo a piece. We had inflicted apparently
    severe damage on the enemy forces, the Piet Hein had been. Subsequent attacks
    by submarines and planes further damaged enemy, but the landing had been made,
    and as far as I knew, the Japanese thereafter made complete control of the island
    of Bali.


    There were remarkable incidents which happened. A Chief Petty Officer on the galley
    deck house of the Parrot had been thrown by the heel of the ship when her rudder
    jammed or at some other time, and was missing, when the ship got into port. It
    was reported as missing, but four or five days later, after the Parrot left port,
    then turned up, rather tired, but perfectly well. We [had] floated around during
    the engagement, and finally managed to get himself ashore on the island of Bali,
    which was then occupied by the Japanese, he had into the jungle for several days
    and finally made contact with a few Dutch soldiers. They worked their way to the
    western part of Bali and one night had a native to carry them across the Strait
    to Java and Banjoewangi, Java, made their way to Soabaya.


    There was a remarkable story about the Piet Hein. She sank very quickly and the
