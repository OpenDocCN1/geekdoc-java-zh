    [Thursday, 27 November 1941, continued]

    I wonder whether you are all celebrating Thanksgiving today. I assume that you
    are. As I wrote last week, it is almost impossible to get any feeling of atmosphere
    in the tropics. Many things seem unreal to me now. The details of my last year
    are fading out and I feel very glad that I kept a diary. Yet at the same time
    the feeling of life at home with you and the atmosphere of that becomes intensified
    and that is actually what is so deeply ingrained in me that it can''t fade.


    [Saturday, 29 November 1941, 2 PM, continued]

    The days have been long and tiring my eyes frequently feel fogged using binoculars
    for long periods. Censorship has gone into effect so far as we are concerned that
    there is little about to write and furthermore, we know nothing about where we
    are going to end and for home. However, I really don''t care. From what I can
    learn of conditions in the Atlantic, the people there are in for a tough cold
    winter with plenty of concern on the parts of the wives who hope to see their
    husbands now and then. There must be many wrenches with occasional visits and
    partakes place. From the news reports, which are our only sources of information,
    it would appear that opinion at home is pretty solid for no compromise for Japan
    and these source reports indicate great strength on our out. Even though Japan
    may be very worried, I don''t see how she can back down and every day''s counts
    in our favor unless Russia should cave in. Again we have so few real facts upon
    to base our guesses.


