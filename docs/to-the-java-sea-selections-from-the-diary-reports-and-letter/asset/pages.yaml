    # LETTER TO WILLET, SUNDAY, 29 JUNE 1941


    Dearest Will [HEE''s brother; see chapter 1, note 4],


    A year ago I left New York and I think that I have never had a day like that again.
    Needless to say, this year has brought tremendous changes and what is yet in store
    is impossible to predict. Actually when I left New York I thought that my chances
    for reaching Manila were about 50-50 and I guessed that she was a fairly good
    guess. The officer next to cover a large part of the ground I did had been missing
    in Iraq for the last three weeks according to a news despatch from the Navy Department
    and I suppose he is all washed up.


    About a week ago I started a rather long letter to you by moving back from the
    Club to ship most of it was. The last few days have been hectic and uncomfortable
    as we had to get out of harbor & anchor out while a typhoon played out to the
    eastward of us. We got not really bad winds—just nasty, wet and gust up to 50
    or knots at times. Last night we came back to our normal berth in the midst of
    a bad squall and I had made an error in judgement ballasting the ship to compensate
    for lack of oil in our bottoms [fuel tanks] she had a very bad trim [i.e., either
    bow down or stern down] and was hard as the devil to handle. The result was about
    three hour session in the rain and dark trying to stop her in a cove anchorage
    so not to be too close to the other ships. I was tired and disgusted when I got
    thru and it was mostly my own fault. Wed[nesday] Thur[sday] and Friday were all
    complicated days where one thing would be arranged and planned and then thoroughly
    screwed up by circumstances. You have the same kind of days!


    Mee'
