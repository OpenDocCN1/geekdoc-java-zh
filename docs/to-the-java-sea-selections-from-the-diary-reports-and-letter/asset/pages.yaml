    Friday, 2 August 1940


    Mussel Bay


    I awoke at 7:15 chilling and answering the insistent knocking of the maid with
    tea at the Marine Hotel—last night I wisely had a hot water bottle put in my bed
    otherwise I would not have attacked the damp cold sheets!


    Yesterday my driver, Charlie Brown, and I left Cape Town at 11 a.m. and had a
    most interesting drive to Mussel Bay on the coast about two hundred and fifty
    miles of Cape Town. In the places drive was beautiful.


    Here Dr. Decker, the Soc Vac manager, met me and after dinner I went to his house
    for the evening. He is fat and round—his wife tell. They were very cordial indeed
    and I was able to see their home.


    To go back...[30 July] I had lunch at the Civil Service Club with M. H. L. Nolan
    of Texaco,[and] Sam Wallace of Tex.—enroute to Cape N.Y. via Rio Janeiro. Mr.
    Dan Ward, and Mr. Henry Webster, Director of S.A. Shell,45 were there. It was
    most enjoyable and afterwards Wallace and I drove out to the Rhodes Memorial*46
    and then on to Groot Constant, an old Dutch estate.


    On Wednesday [31 July] I made the rounds of the various offices in Cape Town to
    finish up the details of my trip and get some orders and ends. Wednesday evening
    the Richards and Waters came to after dinner we sat in the lounge by the fire
    and talked about eleven, driving out one old codger, who snorted plainly as he
    retreated to some "better ale." It was fine but I am afraid I talked too much
    again. Richards is very young and attractive and seems to be having a very good
    time.


