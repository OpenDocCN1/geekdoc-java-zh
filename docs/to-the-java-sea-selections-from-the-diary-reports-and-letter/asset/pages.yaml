    10 September 1940


    Tonight we arrive at Sabang, an island off the north west coast of Sumatra; we
    shall ship cop and continue onto Belawan Deli [map]. We were there for two days
    and I hope to go up to Tinggi (or Berastagi, see map) in the mountains about five
