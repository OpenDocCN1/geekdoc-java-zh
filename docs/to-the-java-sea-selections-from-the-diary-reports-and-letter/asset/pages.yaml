    For the next few days we steamed south of Java. Once we ran up at high speed to
    Prigge Bay⁸ and spent the night fueling from a small Dutch tanker and finally
    rendezvoused again with Admiral Doorman''s force.


    One of the great difficulties which we had was the fact that we had no really
    good means of communication with the Dutch.


    They steamed at high speed during the night, changing course without signal, and
    our fuel burned up rapidly by the time we were steaming from eighteen to twenty
    knots. It seems strange to us because our gear was not effective over fifteen
    knots⁸ and we had no immediate objective, but the engineering plants of the De
    Ruyter and Java⁹ were such that shifts to the cruising combination¹⁰ were very
    difficult.


    We finally broke up again. Admiral Doorman went through the west, the Bali Strait
    into Soerabaja and fueled and left almost immediately to rendezvous with him near
    Batavia.


    # LETTER TO MR. ECCLES, 3 DECEMBER 1941

    [MONDAY, 16 FEBRUARY, 10 PM, CONTINUED]


    My Sweetheart, this has been a terrific week, sleep comes only at long intervals
    and short periods. The nights are dark and rainy and we have spent much dodging
    rocks in narrow straits or entering dimly lit dark harbors or at sea. The days
    have been full of wondering what would happen next or else concentrating on accomplishing
    something as quickly as possible. One day was quite different—that spent dodging
    bombs, which is a technique of all of ours. The interest in the last item does
    not lag—which is not strange! The Japanese planes seem to be excellent and very
    well handled. This definitely is no war for amateurs!


    I have a suggestion for Skip—when the war is over, and he has a chance for some
    more reading, and the actual history of the war is available he might find interesting
    to study the way in which the fundamental principles of war are being applied
    in this particular campaign. The principles of which I speak are the use of the
    initiative, inner lines,¹¹ of command, concentration [of]¹² forces, coordination
    of forces and economy of forces.


