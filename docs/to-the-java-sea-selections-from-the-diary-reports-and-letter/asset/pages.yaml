    part of the building where I met Mr. Kaye, a director from New York, and "Shorty"
    the enormous manager of the Soengei Group and associated properties, and several
    others. A few drinks and then on to three hours in bed and a cup of coffee [at]
    the famous club of Batavia.


    This was first opened in 1815 and has never been closed since opening, for the
    key was thrown into the canal. At any hour day or night for one hundred and twenty
    five years, a man has been able to get food and drink! It is as beautiful, as
    indeed is the whole town.


    After a few weeks in Manila the contrast between cities like Batavia, Singapore
    and Medan, make me feel very disappointed by the bungling that has produced the
    present situation in the Philippines. Lost opportunities and bad administration
    have spoiled what have been a fine country. It simply proves that one cannot violate
    fundamental principles with impunity.


    I returned to the hotel about twelve and had a short sinful. At 3:00 I was called
    and at 4:20 we took off for Manila in a Douglas DC3. We reached Manila by 4:30
    p.m., 10 October, after a hard trip to 10,000 to 12,000 feet. I leaned out with
    a nasty headache.


    After a bath and a drink I wandered down stairs at the Army-Navy Club and there
    saw Commander Tully Shelby, the first person I had met in three and one half months
    that I ever seen before in my life. The feeling of relief was wonderful—again
    I with my own people and I had no ships or planes


