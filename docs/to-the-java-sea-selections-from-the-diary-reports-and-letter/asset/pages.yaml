    had arranged to play golf but should have cancelled the date—however, I slept
    quite well last night but still have some of the knot-hole feeling. So today I''ll
    take things easy and be rested for a hard week at sea coming upon.


    Delilah is interesting but I feel that it is overdramatizing the life. It is hard
    for us in the Navy to see ourselves as others see us but I feel that I am a more-of-fact
    presentation comes much nearer to the truth—the charm and pull of the life lies
    as much in simple every day contacts and work as in the excitement and thrill
    of danger and in the personal conflicts sometimes arises.


    I had an extremely interesting talk with Billy Giles,⁹ on Friday—the picture is
    very interesting—he is an extremely able officer in most points but has the same
    failing that I frequently show, that is, overemphasis on minor points with the
    restless agonizing of some people whom I am trying to persuade my point of view.
    He is thru a badly mixed period in which he does not know where he stands—he is
    contemptuous of any form of bout licking and carries it to an extreme that he
    hurts his reputation. Apparently present is the first time he has ever felt uncertainty
    and doubt as to things as national policy, patriotism, world affairs—and is so
    troubled by things such as the Lend-Lease Bill, etc. On top of that dislikes the
    English very much, having lots of Irish in him.


    So we discussed it for more than an hour—I tried to point out that uncertainty
    and come to all intelligent and informed people but that he had missed earlier
    in life because he hadn''t troubled to think much very—but now it had caught up
    with him in a perfectly normal manner. Bill told me he could talk freely to me
    but that most people would accuse him of heresy.


    It is extremely interesting for he is too fine an officer to be allowed to stay
    mixed up.


    A long interruption, so I must get ready for lunch.


    LETTER TO MRS. ECCLES, TUESDAY, 18 MARCH 1941, 10 AM Olongapo, P.I.


    Darling Isy,

    We are clear of Manila for another week preparing for shooting battle practice.
    This keeps us working till late and so we are taking things easy at anchor this
    morning and will get underway after lunch.


    Sunday was a nice quiet day, I played golf Saturday and then went to the movies
    with Charlie Weeks, but Sunday I loafed in the morning, went ashore and read at
    the Club and then later in the afternoon went out to see Wooding and Morrison.
    We had a lighter supper and I left shortly after nine. It was interesting and
    stimulating.


