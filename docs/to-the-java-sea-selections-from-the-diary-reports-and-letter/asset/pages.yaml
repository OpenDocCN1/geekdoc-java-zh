    February–July 1941


    LETTER TO MRS. ECCLES, SATURDAY, 1 FEBRUARY 1941, 9 PM


    I woke up feeling like the devil, primarily because of some stuff the doctor gave
    me last night—but apparently it was effective for 10 a.m. I have been feeling
    steadily therein and when the Doc came in he said I could get up any time—however
    I stayed in bed all day, slept like a log for three hours this afternoon and really
    feel human again. Tomorrow I may be up while to get my legs in. This morning mail
    came on the President Cleveland¹—note from Heavy made 30 Oct! Herb''s Rudy Vallee
    record which is very funny indeed and thank him, and a month''s collection of
    magazines and a dozen or so marks—also Willet''s collection of remarks on social
    objectives! So, Darling, it''s so nice to feel well that I don''t care.

    Sweetheart, I am gone ashore for a few hours and it takes easy—I feel well a bit
    rocky. Good bye for a while. I love you.


    [Sunday, 2 February 1941, 1 PM, continued]


    And now for a little news about myself. We have had a rather unsettling week,
    getting in late yesterday afternoon. My cold has been improving steadily but slowly—I
    have lets more pop now but still feels it. We are going alongside the Black Hawk,
    our tender, ''for two weeks'' overhaul.


