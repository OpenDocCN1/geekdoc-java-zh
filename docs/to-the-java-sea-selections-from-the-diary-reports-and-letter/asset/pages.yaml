    as follows: The army has a ratio of about seven to three Hollanders. This represents
    an increase in the percentage of Hollanders. The Indies said that they will resist
    and fight, because the Indies represent the last place where a Hollander can call
    his own. The Netherlands officials feel that the recent bargains by the United
    States against Japan have forced Japan to turn to the N.E.I. [Netherlands East
    Indies] for supplies. These officials cannot understand the fact that while forcing
    Japan in this manner, the United States has recently cancelled contracts of long
