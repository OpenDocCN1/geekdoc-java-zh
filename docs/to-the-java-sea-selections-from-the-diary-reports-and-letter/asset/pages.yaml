    At about one hour after we reached the scene, we got word that our fighter protection
    had been cancelled and that we were to clear the area before daylight. [It was
    a] rather interesting commentary on the lack of coordination, in the first place,
    the British did not tell us that all the survivors had been rescued and that our
    trip would be useless; in the second place, that fighter protection was [i.e.,
    had been] cancelled at about 6:00 or 7:00 o''clock in the evening—Captain Freighter
    had by accident at 11:00 clock took him about one hour to get the word off us,
    [that] we had no fighter protection the next morning; the people who called the
    fighter protection apparently made no effort to inform the ships who were supposed
    to get fighter protection.


    # LETTER TO MRS. ECCLES, 3 DECEMBER 1941

    [THURSDAY, 11 DECEMBER, 2 PM, CONTINUED]


    I was up last night for the fourth night in a row—it seems incredible that so
    could happen in so short a time. It looks as if I might get a full night''s sleep
    tonight and we all need badly. The news is confusing and what we do get fragmentary
    and largely unconfirmed. By the time reaches enough of it will be clear for you
    to understand our feelings. Last night did not pan out as expected, but it was
    far from boring. I can write only a very small fraction of what has been going
    on and can give you on facts, only small sidelights. The manner in which red tape
    and tape procedure vanishes into thin air in war fully confirms my contempt for
    it during peace time. To Skip it and emphasize the necessity for thinking along
    real lines of action rather than letting one''s mind be clogged with trivialities
    regarding to one''s work.


    My officers and men are splendid and there is the sort of unity and enthusiasm
    and courage that is most inspiring. It is a tremendous privilege and responsibility
    to be their captain and I hope that I shall discharge responsibility as a real
    captain.


    I have no idea when I will hear again from you or when you will get this. In many
    cases as possible I will mail you post cards [to ensure that at least one arrives?].
    I haven''t energy to write very much, but when I have had some sleep I have the
    chance to add to this ....


    # 1942 DICTATION [CONTINUED]


    We formed [probably 11 December] and headed at high speed. Shortly after daylight
    a torpedo was fired at us from the starboard hand. The torpedo was sighted, I
    was on the port side of the bridge asleep. I immediately went to the starboard
    side and saw the wake astern and a moment later saw another torpedo approaching
    on what appeared to be a collision course. We turned left [to parallel its course]
    and the torpedo missed either close ahead or underneath the bow, [its running
    depth] possibly having been set for a cruiser target.'
