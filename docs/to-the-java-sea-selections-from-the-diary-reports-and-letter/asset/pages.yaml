    miles wide, protected by railways; see map] We made a fast trip and drove the
    Paul Jones and Barker who were with the Trinity and for the next month we acted
    as nursemaid to the Trinity, keeping the steam at all throttles ready to leave
    our anchor at 5 minutes. We saw Australian patrols from time to time, but saw
    no evidence of enemy activity. After about 10 days in Warowada we went to Koepang
    [Kupang] with the Trinity, picking up the Black Hawk on the away, with other escort
    vessels.


    It was commented on our auxiliary service that our maximum speed in formation
    was made nine knots. Of course the Navy had been howling for fast auxiliary ships,
    and one of the great handicaps we had in the campaign was the fact that practically
    all of our auxiliary ships were very slow.


