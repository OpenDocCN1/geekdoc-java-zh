    Manila under the present circumstances of separation from our families is not
    a particularly attractive place. Isabel was supposed to sail from San Francisco
    on 22 October but the evacuation order was published just in time to prevent her
    sailing and by 15 December practically the Navy families out here had returned
    [home]. The lonely life is hard and will be harder, I as time goes on.


    I took command of this destroyer after 20 October and since that time I have enjoyed
    the duty as such. I have gotten the feel of the ship pretty well and it has been
    lots of fun to handle her. When we are at sea, things are fine for we slip into
    the routine of hard work with very little time to think about eventualities. The
    weeks over lying in Manila Bay are tough. Fortunately I have made some interesting
    friendships ashore—like the Bergers, Tom and Caroline Wolff, and Guy and Barbara
    Agnew—and with them manage to have some very enjoyable times.


    The Bergers are a very interesting Jewish family; from New York, Mrs. Berger from
    Melbourne.


    Caroline Wolff is a sister of “Doctor Mary” Crawford and is a very successful
    and prominent businesswoman with varied interests through the Philippines. They
    have a beautiful home next to the Manila Polo Club and every Friday night they
    have open house for bowling and a buffet supper. I go there frequently and always
    have a quiet and enjoyable time.


    Barbara Agnew''s grandmother is a great and old friend of Aunt Anna Peterson;
