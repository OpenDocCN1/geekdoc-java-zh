    a many managed to survive. When the Parrot came out the strait, several hours
    later in the first phase of the engagement, a shell cut the after falls to her
    whale boat which had been swung out. The crew immediately cut the forward falls
    and dropped the boat. It landed right up and floated around. When dawn thirteen
    men were floating around, spotted the boat and climbed aboard. One of the other
    destroyers had destroyed their gasoline drums before going into action, as luck
    would have it, one of those floated by. There was no gas in the boat, but they
    picked up the gas drum, fueled the boat, picked up about twenty more survivors
    from the Piet Hein and made way to Java. Fact is frequently stronger than the
    wildest reaches of fiction.


    I shall never forget that first night ashore at the Simpang Chapel. Frogy Pound
    and I went up, with several old friends: Bud Ward of the Seagrad, Moon Chapell,
    who had just transferred from an S-boat after a very spectacular and successful
    career as a commanding officer and was taking over one of the big boats. We sat
    around and congratulated ourselves on being alive because we all felt that we
    could not get through an engagement of that sort with cruisers and destroyers
    at those close ranges and any normal expectancy of coming out. The American destroyers
    had gone away merry twice, once at Balikap and once in Badoeng and Lombok Straits.


    Admir Doorman was at Simpang Chapel and the Pounds and I went over and talked
    to him a while, discussing various aspects of the engagement and comparing notes.
    We met there Mr. Doorman.


    We went into dinner and about 10:00 o''clock ... our usual devious back to the
    ship having to wait for about an hour to an hour and to get a taxi back.


    We had a conference the next day, checking on details and started stripping the
    Stewart. It was difficult work by that time the Japanese were beginning to raid
    Soerabaja each day and we only had two boats to do the hauling. It is obvious
    to us that the Stewart was of no further value and must be destroyed.


