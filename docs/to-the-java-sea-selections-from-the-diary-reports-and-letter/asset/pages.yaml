  md: 'However, COMSOWPAC wished to verify that situation and sent an officer down
    to inspect it. It developed that the Dutch were interested only in saving the
    dry dock.


    At this time, with the Japanese securely landed in Bali and consolidated in the
    Palembang area, it was quite obvious that the straits to the east and west of
    Java would soon be closely patrolled by the Japanese.


    The fuel situation was difficult. The bombings had damaged the fuel installations.
    At every sound of the siren, all the native workmen ran into the dugouts, shut[ting]
    the pumps down. The only time we could fuel was at night. Most of the Navy Yard
    workmen had gone into the hills and it was extremely difficult to get stores and
    supplies.


    The conference of Tuesday, February 22nd [apparently not the one mentioned above,
    "the next day"], showed that the situation was very critical. We then got our
    orders to defend java to the last. The one destroyer [i.e., either Parrott or
    Pillsbury] put a torpedo aboard the Edwards, giving us six, and then both the
    Parrott and Pillsbury off to go [to the coast to get more torpedoes. Our organization
    was very uncertain. Communications with Badoeng [Bandung], the headquarters, were
    extremely difficult and Commander Binford had a very hard time contacting Admiral
    Glasgow''s staff.


    A decision was made not to destroy the Stewart, but we did place demolition charges
    and had a crew of four men under a young ensign and Chief Electric Mate Brodie
    on short notice. We got off all ammunition and supplies food we could. We gave
    a truck loading with depth charges and aircraft shells, partially to the crew
    of a British Army Forces AA [aircraft] gun who were stationed on Holland Pier.
    They needed badly for few & a others were remnants of a battalion badly cut up
    in a train wreck. The outfit had been evacuated from Singapore—they moved from
    Holland Pier just before we finally sailed—I don''t know what happened to them
    after that.... They seemed a fine lot, but had come out of Singapore and were
    pretty beaten down. I was moored in the Holland Basin. The day''s heavy bombing
    resulted in considerable damage to the Holland Pier.


    In the middle of the week I went outside of the bay, but was recalled as I went
    out the channel and then returned at the end of the Holland Pier, my place


