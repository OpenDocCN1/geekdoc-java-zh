  md: '# TO THE JAVA SEA


    The Government administration building was formerly the palace of the Sultan Zanzibar.
    He now has a beautiful place near it. The central court was large, and high above
    it the roof supported by tall pillars and wide verandahs. All the doors were beautifully
    carved and the outer ones studded with brass. The view from the roof was lovely,
    the white walls, tile roofs and palm trees, and beyond the sea with coral reefs
    and breakers. The smell of cloves was strong in parts—otherwise the smell of a
    tropic city predominated.


    The sun was hot and glaring from the white walls. The streets narrow and crooked,
    the various shops full of strange things, the cries of people—ringing bicycle
    bells. The cathedral on the site of the old slave market was interesting and in
    the Museum we saw many relics of the old life. A polyglot population—bright colors
    in the clothing of African, Arab and Indian—women in black purdah costumes heavily
    veiled and the hot sun beating down—great poverty that this is to be expected—the
    chattering of children—the schools where in Tangier''s were learned by repetition
    aloud.


    We returned to the ship for lunch, hot and tired and later ashore for a swim.
    [The village of] Chukwani was seven miles south of the city and in a beautiful
    old palace we found a bathing club. The beach was pleasant and the smooth water
    and warm. For two hours we loafed and swam. It was delightful and completely relaxing.
    After dressing, Jerry Howe, who joined us, showed us the old baths the Sultan''s
    palace. All the marble had been stripped from the walls and floors when a new
    Sultan built a new palace about eighty years ago, but it was still beautiful.


    The sketch gives a rough idea of the general arrangement. The dome had ventilation
    ducts cut in it and was definitely of Persian design. There were many passages
