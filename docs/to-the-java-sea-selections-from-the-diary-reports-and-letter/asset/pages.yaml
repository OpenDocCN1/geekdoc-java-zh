    Dean Smith grows a fine-all man with great appreciation of life based on a sensitive
    nature, a fine education and wide experience. His manner of speaking and superficial
    appearance are very deceptive if an American should judge solely by them.


    Thelma Cornwall turned out to be a strange personality. Her eyes, bright blue
    with flecks of red in the iris, were seldom in repose. She bickers incessantly
    with Jerry Howe and while for a time it was amusing, it became very boring it
    mirrored too accurately the restless, continuous, stubborn quality of her nature.
    She has a keen intelligence, and on top of it a hardness. The true nature is obscure
    but the background explains many things. Her father, a reckless and hard tough
    American—a large family always in trouble. Jerry in his official capacity in Kenya
    once sentenced her brother to six months for theft! But they had a genuine liking
    and respect for each other. A bright glittering personality, living in tension,
    never to relax, never to find peace.'
