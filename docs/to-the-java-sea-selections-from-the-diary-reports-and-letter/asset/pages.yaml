    is on a matter of built, the small brass scraper inside my port is full of rain
    water and the sky has that swept and scrubbed appearance that comes after a rain,
    yet I have no idea when it rained. Was dog tired last night and at nine o''clock
    with a bad headache—I slept very well and now feel refreshed and cheerful.


    Yesterday we threw our full power run smoothly and got back to the anchorage by
