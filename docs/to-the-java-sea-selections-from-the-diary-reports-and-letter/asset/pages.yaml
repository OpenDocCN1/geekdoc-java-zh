  md: '# LETTER TO MRS. ECCLES, THURSDAY, 3 APRIL 1941 [?]


    Darling Isy,


    Yesterday the four skippers in the division left in the morning and had a very
    pleasant day of golf at the Manila Country Club. We played 36 holes and had long
    rest for a quiet lunch. I had dinner with Charlie Weeks at the Army-Navy Club
    and later saw the movie Virginia. It was amusing, dripping with sweet sentimentality,
    but it did have very beautiful scenes of Virginia countryside. All in all it was
    a grand day—very relaxing and satisfactory. I shot a 94 and an 86 so my game has
    lost the awful slump it was in. Incidentally I was on the beer and sherry wagon
    for an indefinite state—last night I varied it by having excellent buttermilk!
    It was hot on the golf course and the back of my neck is very red and slightly
    sore—sunburn does not stick out here, it seems to sweat out quite quickly.


    [7:30 PM, continued]


    Late afternoon I went ashore for a fast two mile walk with Charlie Weeks and Bill
    Larson, stopped for a beer at the Club and returned to the ship. I saw Swede at
    the Club and he told me that he had expected Miriam to have sailed for Havana
    on the America(9) for a visit with the D''Onaha but that he had just received
    a radio[gram] from Danning to the effect that she had bought a house in Corado[near
    San Diego, California] and was staying there. So he is naturally a little confused!


    There is all kind of dope wandering around Manila now—no one knows anything lots
    of people are making guesses. One guess is that those destroyers will be turned
    over to the British during the next three months and the officers and sent back
    to the United States to get new ships in commission. I can''t imagine anything
    better than being ordered to Bath[Maine, site of a major shipyard], Boston, or
    New York to take a new destroyer.


    For that matter would be to go to the West Coast for the same duty! However it
    is merely scuttlebutt however logical if it might be! I suppose I am foolish to
    even think about it but I can''t help it. Incidentally, possibilities of that
    sort are the reason why we should keep a reserve on hand.


    [Friday, 4 April 1941 (?), 5:30 PM, continued]


    Darling, in a few minutes I am going ashore to bowl and have at the Wolffs. Last
    night I turned in early and slept beautifully today I had a satisfactory and fairly
    busy time. The Clipper gets in Monday so I shan''t have any news from you


