    the U.S. destroyers take position on [the] [quarter] [of] Tromp at twelve points
    at safe distance, two destroyers to starboard, to port. On passing through the
    narrows of Bali-Strait destroyers will proceed ahead of Tromp. After passing point
    speed will be increased to 25 knots.


    4. An attack on enemy forces at Pantai Barat depends on reconnaissancemessages
