    The last two days would be hard to describe—but I have learned a lot the hard
    way—However, we are all well and doing nicely. Some things I have been curious
    about, I have learned and hope that I profit thereby.


    We added more to our travels and the future is obscure. However darling, my morale
    is O.K.


    Give my love to Skip—and the others. Good night darling. I love you.


