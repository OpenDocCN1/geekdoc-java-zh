    # PERSONAL DIARY

    Tuesday, 2 July 1940


    On Monday I rearranged my baggage and got settled in my room and this morning
    I slept then read all morning. In the afternoon I read a little, played a little
    shuffle board and loaded luxiously in the sun. It is wonderful not to have anything
    to worry about—there is nothing about which I can do anything. Restless nerves
    have calmed down.


    In the evening I sat for a while in the Captain''s Cabin and talked with Captain
    Sullivan and Mrs. Van Kraayenburg. I talked with Mr. Söhnge on geology, etc.,
    and then listened to the Bal-Galento brawl! as a parting gesture toward current
    U.S. officers.


    > "Captain Sullivan took a real Candid Camera shot from a distance.\n(HIE)


    # Wednesday, 3 July 1940


    Today was a perfect one—clear sky and just enough breeze to occasion myself. In
    the morning we sighted a British merchant convoy of thirteen ships escorted by
    two auxiliary cruisers [heading for England]. Captain Sullivan changed to starboard
    [i.e., the right] to clear them and finally passed at a distance of seven miles.
    I have done some technical reading and done sort of thing seriously—life is too
    relaxing. The Relax. Cleveland discovered African mission life in a most interesting
    manner and showed me photographs of the mission station in the Belgian Congo which
    he founded in 1924. I have always had an abstract sort of respect for missionaries
    but the contacts with the Clevelands and Miss Holliday gave me my first personal
    knowledge of them and it is most pleasant. It requires fortitude of mind, body
    and spirit to do that work...


