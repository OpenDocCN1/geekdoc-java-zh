    ... 1. Japanese landing on coast of Bali is probable. A force of Dutch cruisers
    and destroyers will raid the enemy in the night of 19th or 20th Feb. one or two
    hours before taskforce Tromp.


    2. With the Task-group proceed through Bali-Strait and hence through Badoeng along
    and north-coast Bali where he will be found, depending on reconnaissance messages.


    3. All ships leave Sourabaya at 14.00 Java-time and proceed through eastern entrance
    to Strait Madoera. Near light vessel entrance at 16.00 Java-time formation will
    be formed. U.S. destroyers form anti-submarine screen Speed 22 knots. The craft
    will proceed through Madoera-Strait, pass Cape Patjinan at 1 mile distance and
    further proceed through Meinderts Reef (Meindert''s-rock), which through Bali-Strait
    to a point 3 miles South of Tafelhoek, which point must be reached at February
    20—01.00 Java-time sharp. After passing Cape Patjinan at signal night-formation
