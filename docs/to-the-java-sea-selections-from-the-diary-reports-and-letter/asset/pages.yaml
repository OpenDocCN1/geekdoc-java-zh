  md: '# FOREWORD


    The Naval War College has maintained extensive materials for historical research:
    archives, historical manuscripts, oral histories, rare books, and the collection
    of the College’s museum. Students and scholars of naval history long have availed
    themselves of this unique resource. It is unique, in part, because it resides
    within an institution that is historic in itself, and in a location—Newport, Rhode
    Island, and Narragansett Bay—that has been the scene of many events and developments
    vital to the history of the U.S. Navy. On both subjects the materials of the College’s
    Naval Historical Collection and museum, now within within the John B. Hattendorf
    Center for Maritime Historical Research, are unmatched.


    It was to make these resources known more widely and encourage their use that
    in 1975 the Naval War College formally established a program for the publication
    of book-length works on the history of naval warfare that make significant use
    of them—the Naval War Historical Monographs. The first volume in this series,
    which is now managed by the Hattendorf Center in collaboration with the Naval
    War College Press, was The Writings of Stephen B. Luce, published in 1975. Over
    time the series has attracted authors from both outside and within the College,
    who have produced works in a variety of categories: standard historical studies
    (notably a widely cited analysis of the Navy’s interwar exercise program), bibliographies,
    conference proceedings (some in support of the U.S. Naval Academy), and, especially,
    annotated journals, diaries, and papers.


    The present Historical Monograph is the twenty-eighth in the series and the ninth
    from Professor Hattendorf. In To the Java Sea (working with Pelham Boyer, former
    managing editor of the Naval War College Press), the College’s Ernest J. King
    Professor Emeritus of Maritime History has brought to light on a remarkable naval
    officer with close connections to the Naval War College and to Newport. Henry
    E. Eccles—for whom the College’s library, within its modern Learning Commons,
    is named—was, as a rear admiral, retired, the school’s best-known faculty member
    in his time, from 1948 (when Admiral Raymond Spruance'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'brought him here to head the Logistics Department) until the mid-1980s. He
    was an adviser to numerous Presidents of the College in those years. His books
    and articles on logistics, strategy, and military-naval philosophy were read widely.
    His papers and correspondence, from which this volume is drawn, compose one of
    the College’s most extensive and useful collections.


    First, then, the volume honors a great teacher and scholar. Even more, it allows
    us to see, through the eyes of a highly observant and thoughtful participant,
    a most dramatic and important episode: the outbreak of the Pacific War in the
    Far East. A much younger Henry Eccles was was there, in the thick of it. What
    he saw, whom he met, where he traveled (especially how he got there), the Navy
    and ships in which he served, how he reacted to combat, and the grim resolution
    with which these events (devastating for United States) left him—all these are
    fascinating and available to us by his many letters and journal entries. We are
    sure this book will leave those readers interested in any aspect of the time,
    place, and events it covers with a better understanding and fuller appreciation
    of what the ideals of naval professionalism—honor, courage, and commitment—mean
    in practice, in both peace and war.


    MARGARET D. KLEIN

    Rear Admiral, U.S. Navy (Retired)

    Dean, College of Leadership and Ethics'
