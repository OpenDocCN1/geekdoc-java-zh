  md: 'The responsibility of command of a ship in war is very great—there is no one
    else to turn except for advice and each situation develops there is constant mental
    evaluation and speculation as to the decisions that may have to be. And so far
    the war started there has been not a moment of relaxation. True we have had a
    few hours liberty than now, and that is not satisfactory.


    But we have covered a lot of area. One of my great objectives is the names of
    places—just take an atlas and look over this area and see what a job it is to
    pronounce the names! And then they sometimes have to be spelled out in a signal
    it is wrong! Wish me luck darling! I love you.


    Now we met got underway to shift-birth—and it is very dark. Incidentally, you
    might be interested to know that the stress of war has intensified rather than
    diminished my regard for you.


