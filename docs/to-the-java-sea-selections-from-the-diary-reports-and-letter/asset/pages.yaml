    Friday, 23 August 1940 [continued]


    We arrived in Beira Tuesday afternoon Smith and I played golf against Howe and
    Brown, playing a ''greensome'' [three-some?] where each player drives and thereafter
    a two-ball fortune. I was hitting the ball and we managed to win at the 17th.
    We were very companionable—Howe full of fun and his we set the pace. The Henry
    S. Grove was in port and I had an enjoyable visit with Captain Sullivan and the
    other officers.


    We had aviation gear for the British defense force in Kenya and Captain Sullivan
    was going direct to Skukusa to get rid of it. Thelma for Kraayenburg and her husband
    had split up and she is homeless. Quite a long way to find out a thing like that,
    Michigan to Johannes-burg! I suppose she will take the Grove back—not much to
    do so and G.J.S. [Captain Sullivan] arrange and finance it, just a hunch. Pearl
    Wegerle, I believe, and it was not surprised.


