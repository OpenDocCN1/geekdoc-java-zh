  md: '# TO THE JAVA SEA


    During the early stage of morning twilight we saw what apparently were lights
    from Japanese ships close to the north shore of Bali.,


    We had no further information as to what the De Ruyter had gone through that whole
    engagement without firing a shot. She apparently had been designated to fire to
    starboard and the Java to fire on ships encountered on the port hand. The De Ruyter
    having sighted any ships on the starboard board, did not fire at all and the brunt
    of that battle had been carried by the Java, Piet Hein, Ford and Pope, a rather
    strange set up.


    Before coming to Soerabaya, just after daylight we sighted 93 Lightship, which
    is a pagoda-like structure. It was initially reported as Japanese battleship²⁷
    and it was most embarrassing to get report.


    As we started up the eastern channel to Soerabaya, the Japs came over for a bombing
    raid. Previous to that time we had passed the Dutch destroyer Bankert²⁷ coming
    in. She was to have been in the battle but had engineering trouble and was unable
    to join up. The Bankert started


    up the channel, but when we saw the Java planes coming over she turned and lay
    off. The American ships narrowed and proceeded. No bombs were dropped on us. It
    was a slow trip up the bay and as we entered the channel periscopes of American
    submarines which were lying on the bottom of the harbor (for concealment) began
    to show and one or two popped their towers out. As I went by one battered submarine,
    I recognized it as the Seadragon and Lieutenant Ward,²⁸ an old friend, who stuck
    out the bridge and waved a greeting to us.


