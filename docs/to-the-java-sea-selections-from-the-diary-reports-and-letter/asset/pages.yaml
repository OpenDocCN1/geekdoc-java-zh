  md: '# DURBAN TO MANILA 43


    # PERSONAL DIARY

    Wednesday, 4 September 1940


    Sunday we reached the town of Victoria on Mahé in the Seychelles. The Howes, Dean
    Smith and I went for a walk and lunch. The Botanical Gardens were very beautiful
    and we saw all sorts of strange trees and flowers including the Coco de Mer, which
    bears double, triple and even quadruple coconuts but will grow nowhere but in
    the Seychelles.


    The town itself was very small and the population mixed; predominantly French
    but apparently with a considerable dash of color. On the mainland all Seychelles
    [i.e., Seychelleslois] are under suspicion of color. We were followed at first
    by a horde of small colored boys, explaining in soft, liquid, partial English
    that could show us everything in town.


    Near the dock was the club, with tennis courts and a bowling green, with half
    the English population of the island on the veranda. At the hotel we found the
    town drunk, completely out at 11 a.m.


    I bought some stamps for Skip and mailed a note to Doc Magdeburger, then we walked
    thru to the town.


    We sailed at five after leaving a few passengers including Dr. Lanier and his
    bride and a 19 year old girl who was being returned from the Netherlands East.
    When we saw the bride was all dressed up and regarding her future home with a
    very emotional display.


    Since then life has been uneven; the news of the new attack by Hitler''s force
    on England has been very scary and everyone is apprehensive. There is no way of
    judging the situation except to recognize its gravity.¹


    Tuesday was Isabel''s birthday and I felt very lonely and homesick. I could not
    think of anything else; all the years rolled back in front of me—especially the
    early September of 1924 when I spent it with her on my first visit to Thompson''s
    Point.¹ I remembered the first birthday party by Colonel McCormick''s and all
    the people who were there. Most keenly of all I remembered the picnic on the rocks
    on the Island [unidentified] and the beauty of first being together, alone ourselves.


    Sunday, 8 September 1940


    Since leaving the Seychelles life has resolved itself into a quiet routine, getting
    up late and tired after a hot night, quiet morning reading, ping-pong, walking,
    a drink before lunch—while we played deck tennis in the morning but now the sun
    is hot—sometimes we do


