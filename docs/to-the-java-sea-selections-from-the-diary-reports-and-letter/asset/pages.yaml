    # 1942 DICTATION [CONTINUED]


    Tjilatjap was a rat trap. It had a long twisting entrance, very narrow, there
    was no turning room inside the harbor worth mentioning. Many ships were moored
    in toys and all of us ran around seven times in a mud band, trying to turn the
    ships to make the very small dock near the entrance to the harbor where we lay
    to provision. The Pecos came in and we fueled from her day. The current was strong
    in the harbor. It was squally and it was a very tiring day superimposed on the
    strain of the previous days. However, we got word that we were expecting a Japanese
    air attack the next morning.


    As soon it got to light, we the last of our "walkie-walkie" beef [presum-ably
    slaughtered on the pier] I aboard, still warm, and shoved off, heading south after
    we cleared the channel and mine field.


    Our orders were very indefinite, there was poor liaison in Tjilatjap, only one
    navy officer ashore and being completely overloaded; commun-tions were bad. We
    had no idea what to expect, but by telephone had been giv-en three rendezvous.
    We knew the Houston was alright because she was also in Tjilatjap.'
