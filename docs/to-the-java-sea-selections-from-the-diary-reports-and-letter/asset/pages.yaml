    Yesterday I opened my package and found The House I Knew® from Mary Gibson [a
    Flushing, NY, neighbor] via you—thank her for me. The word is that most of our
    Christmas mail arrived just in time to be burned in the bombing of Cavite—but
    of course that will not include it all and a good part is aboard ships which never
    reached Manila. So in due time that will probably catch up with us.


    I hope Skip had so fun Christmas. The fact of war should not take away the grand
    sport of Christmas vacation at his age. I wonder if he has shown any liking for
    the so called weaker sex? Vacation days sometimes bring out it!


    Now, Sweetheart, there are things to do—More later, but for the moment God bless
    and you.


    [Saturday, 27 December 1941, morning, continued]


    So far quiet—an interesting commentary is that none of the many things we have
    done [since hostilities began] is to be found in any of the books and drills and
    exercises we have labored [through?] during the last twenty years. Thank goodness!
    I haven''t spent too much time on them in the part! Of course the war may soon
    enter a phase where much of that will come—but it is hard to tell.


    We have to do all our own laundry—the variety of uniforms—tropical helmets, tin
    hats, white caps, khaki khaki or white shorts, dungarees, and various combinations
    with various rain coats, ponchos, slickers, etc.—the tropical rains fall, because
    they cool the ship off and also we can catch lots of fresh water to use for scrubbing
    and cleaning! I have laundry scattered all over the Orient—it seems that after
    a few clothes leave the ship get under some place else and so far I haven''t caught
    up with any of my presumably clean clothes! And to think that I was once a ship
    designer!


    I hope you are to hear lots of good music this year—listen for me darling. I shall
    be reaching out for you—for I love you.


    [Sunday, 28 December 1941, morning, continued]


    Hot and quiet—The fact that I had a year or more to get to the heat is a great
    help—otherwise I should be limp. As I remember this is Bud''s [Isabel''s brother
    Frank McCord''s] birthday—and in three days it comes. It would be nice to take
    this war in a chipper and casual way, but just it can''t be done. Many of the
