  md: 'Actually we engaged three times and we changed between a Dutch ship and a Jap
    cruiser which took fourth spectacular duel several miles astern ended as a ripple
    of flame swept the Jap.


    An hour or so before our fight we saw in the distance flashes as two other forces
    engaged. In the morning we were far away and I don''t have any idea what was left
    on the coasts of Bali and the bottom of the Straits.


    It was spectacular, grim, tough, fighting and only a miracle prevented us from
    being badly hit and probably sunk, for in that situation a crippled ship on our
    side had no chance to escape. It seemed distant, hazy and unreal. I remember being
    fascinated watching shells coming at me, and once I danced involuntarily for I
    couldn''t see how they did. Twice I was dazed by the flash of my guns and once
    the [shock] of Edwards'' own gunfire was so great that I was sure the ship had
    been hit.


    How would I have enjoyed some of the non-producers and soft-job men on my bridge
    with me. How wonderful it would have been to have the men who prevented us from
    fortifying Guam and properly protecting the Philippines, to enjoy the thrill of
    battle!


    Our rattled Asiatic Fleet has the Jap japs hard and well and when I think of what
    some of our destroyers could have done makes it almost weep. There is only one
    way to win a war and that is to hit the enemy. a strange sensation to be the sacrificial
    lamb—however these lambs of ours prove their ability to fight when given the chance.


    We had practically no overhaul—stores and provisions to get. Oil difficult to
    get. No liberty for officers and men except for a few hours at a time and then
    in places replacing venereal disease. We have a pharmacist aboard, fortunately
    he is good. We last saw our on 24 December. Sometimes we got paid. That really
    doesn''t make much difference. We must scrub our clothes every time we send laundry
    [ashore] the ship sails before we get it back. We get very little encouragement
    from our seniors. Most of them are far away or safe in the mountains [i.e., the
    provisional ABCD headquarters at Bandung] far from the bombing and fighting. The
    only news we get in four categories: Japanese propaganda, which is made up of
    filthy lies; news of desolate lasts and "situation serious" from the British production
    figures[]; and conference reports from the U.S.[[:] and horribly estimated reports
    of enemy losses from the Dutch.


    # 1942 DICTION [CONTINUED]


    After our last engagement, the action ceased and we were pretty well scattered,
    we managed to reform, using voice radio, and found us encircling Bali, heading
    for Soerabaja. The Parrot had a very narrow escape from running around with her
    jammed left rudder, but had recovered steering control and steamed on. The Tromp
    was well astern of us making high speed.'
