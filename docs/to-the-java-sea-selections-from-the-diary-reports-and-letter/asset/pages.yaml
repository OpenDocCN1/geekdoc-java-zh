  md: 'submarines, naval training. He was now being sent to command a year-old destroyer,
    homeported abroad in Asian waters at a time of growing international tension.
    War was already raging in Europe and in Asia; he was vividly aware that he lived
    in historic times and that he was highly likely to be "at the point of the spear"
    when he engulfed the United States. The contents document Lt. Cdr. Henry R. Eccles''s
    trip by passenger ships from New York to Manila, doing some intelligence for the
    Office of Naval Intelligence along the way, and his assumption of command of John
    D. Edwards in the Asiatic Fleet, under Adm. Thomas C. Hart. The volume ends with
    Eccles''s participation, now a commander, in the short-lived Allied force in Southeast
    Asia—the American-British-Dutch-Australian, or ABDA Command—and his subsequent
    experiences in the battles of Badeng Strait and the Java Sea in February 1942,
    engagements in which Henry Eccles earned him his decorations.


    Henry Eccles, unlike the writers of many such published collections, never foresaw
    that his letters and diaries might be read by a wider public. These were private
    communications, those of a loving husband and father conflicting in his and sharing
    his experiences with her. At the same time, as a middle-grade naval officer, he
    was making the formal reports required by his seniors and his profession. For
    readers of this work, the combination is fortunate. Placed, in by side, the personal
    and official documents provide a window into the mind, heart, and soul of a sensitive
    and perceptive naval officer carrying out his daily shipboard routines of command,
    in port and at sea, and being tested to the utmost in combat. Such matters find
    expression within these documents in the context of a world that contrasts with
    our own, earlier naval technology and different social values. At the same time,
    from the documents emerge enduring values of personal duty, honor, and commitment,
    values relevant to serving officers in any period of time.


    In several respects the documents express unguarded attitudes and candid opinions
    that, if written by an American naval officer today, might be considered unacceptable,
    particularly surprising in a man of Commander Eccles''s upbringing, education,
    and sensitivity. His candid impressions about the nations and nationalities that
    he encountered are here entirely intact, without apology, as they accurately reflect
    the world as seen through the eyes of a man of Henry Eccles''s environment in
    the years between 1940 and 1942.


    These documents have much to tell us about the world of his time, and their very
    unguardedness is surely a guarantee of their authenticity. Those observations
    and all they imply about the subjects and the observer as a representative of
    the U.S. Navy embody a large part of the importance of these papers. They provide
    us insight into the specific personal experience that formed an important basis
    for Henry Eccles''s last abstract thinking about strategy, logistics, military'
