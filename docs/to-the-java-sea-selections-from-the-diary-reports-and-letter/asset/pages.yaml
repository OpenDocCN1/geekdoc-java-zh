    [Sunday, 7 July 1940, continued]


    The morning news indicates that the attack on England is about to begin. The decision
    on that phase of the war possibly the war itself will have reached before this
    letter reaches you. Somehow it does not seem right to be sailing peacefully while
    the world is torn by this war. I feel so out of things.


    I find that I have dates all mixed up but I have verified this. The trade winds
    have freshened, the ship has more motion and the port [left, facing forward] is
    very wide. I am very lazy but trying hard for exercise and have acquired a nice
    sun with little burn. The swimming pool has been fine; Sohnge, Tommy Cleveland
    and I go together and usually Mr. Simmons the Chief Engineer joins us.


    Söhnge pronounced "Zern-ger" is a huge blonde of German missionaries who has taken
    his master''s at Harvard and is on his way back to work with the Geological Survey.
    He is most attractive, fine sense of humor and very keen on discussion of any
    sort.


    ![](img/271a4dd38c17a5bcd4a1efde5be2dc47_38_0.png)


    We have a great time at meals and usually have a good session after dinner. Because
    of union rules for freighters we have dinner at 5 p.m. by nine o''clock we are
    all hungry. We have about an hour of crackers, cheese, fruit and talk. My bunk
    is cramped and I don''t sleep really well.


    Captain Sullivan is very nice and spend quite a bit of time with him. He was in
    the Navy for some years and we have much in common. On Sunday Mr. Cleveland held
    a short service on deck.


    I wish you were along with me. It would be so fun—you would fit into life so well
