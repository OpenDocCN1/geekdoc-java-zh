  md: 'we found the best estimate as to the number of torpedo planes attacking gave
    us in the neighborhood of fifty to sixty. The low estimate, I heard one man say
    he counted 47 and another an estimate as high as 65. These had been preceded by
    a bombing attack which had hit one of the ships, but did not seriously damage
    it.


    The sinking of the Prince of Wales and Repulse is one of the few instances where
    the Japanese made no attempt to interfere with the rescue of survivors. They did
    not bomb the destroyers conducting the rescue work, nor did they machinegun the
    survivors in the water.


    The British destroyer [HMS Express] which went alongside the Prince of Wales took
    off 67 wounded men over a gangway, and took off a great many others, filling up
    to 900.


    As the Prince of Wales turned before sinking, his bilge keel locked with the bilge
    keel on the destroyer and for a moment it was thought that the destroyer would
    be turned over. However, the destroyer''s bilge ripped away and the Prince of
    Wales went down without any further damage to the destroyer.


    One of the most discouraging things that we noticed when we went to Singapore
    was the age and obsolete character of the naval planes which were at the seaplane
    base. There were a great many Buffaloes in the air. We did not see any Spitfires
    or Hurricanes, nor any British bombing planes in Singapore.


    The news was discouraging. The Japanese had apparently been able to consolidate
    their landings without much trouble.


