    LETTER TO MRS. ECCLES, TUESDAY, 25 NOVEMBER 1941, 4 PM At sea


    Darling,

    We are on somewhere we don''t know yet where we are going and the guesses are
    fast and furious. It was quite unexpected and lots of things such laundry and
    unpaid bills were left in port. Unfortunately my new photographs were ashore framed
    and I had no chance to get them. However, Bob Dennison will pick them up at the
    end of the week and mail them, so eventually they will arrive. I am quite sure
    that unless the Pacific problem is reached we won''t get back for a long time
    if ever. When this letter will start to you or when we receive is purely matters
    of conjecture.


    I made a rather hurried decision last night; I asked Bob to ship my phonograph
    records to Will. I am sending them because it will take some months to arrive
    and I have no idea as to where you will be first. First he is going to sell them
    for one hundred fifty dollars. Of course that is taking a lot I feel it is the
    right thing to do for by the time we are in position to enjoy their better photographs
    will be available and in some cases better recordings and the trouble and wear
    of shipping will be avoided. If they are sold I can put the money in your music
    fund and with what I can add, we shall all be set. I feel bad about the decision—you
    know the feeling, Darling, where there is little time to make up your mind and
    after it is all done you feel that you have made the wrong.


