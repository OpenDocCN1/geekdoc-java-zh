  md: '# Saturday, 10 August 1940

    Middelburg [Middelburg], Trans-vaal


    We left camp at 6:50 but saw very little game--we went down to Lower Sabi where
    lions are supposedly most plentiful.

    We had breakfast at Lower Sabi and then started for Pretorious Kop."


    Our luck changed and we saw all manner of game giraffes, zebra, impala, kudu,
    water buck, wild hog, and finally a group of four cheetah--a unusual thing. As
    we approached Pretorious Kop we saw many wildebeests.


    As we were enjoying our lunch telegram delivered saying that I must reach Durban
    before Monday for the ship, the SS Zwartenhdt was due to sail on Tuesday. We left
    on and stopped several hours later at Nelspruite where we encountered the country
    [Oil] and checked with him. Then we continued towards Middleburg. From Nelspruite
    changed character as we went up the valley on the Eland River. It is fine farmcountry,
    and citrus thrives, and it is really beautiful. Reforesting is going especially
    on the high plateaus. As the usual roads were horrible, narrow and rough and dusty.
    New roads are being built and when motoring will be much pleasant.


    We saw most of the animals in the evening or early morning when the light was
    bad--pictures had to be taken from the car. The wonderful protective coloration
    makes photography difficult, especially for an inexperienced person.


