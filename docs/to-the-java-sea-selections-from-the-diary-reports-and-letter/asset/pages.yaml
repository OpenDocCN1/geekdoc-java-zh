    charge (i.e., from the junior "conning officer," who started the\approach) and
    think fast to prevent a smashing of various metal gadgets, propel-ners, etc. So
    my darling, being a bit of sleep I feel very tight and wound up—I

    tried to take a nap but couldn relax so I go ashore in about an hour to get a
    few

    bees and I hope I have sense enough to get the ten clock boat back to the ship.

    I feel however, because things went with precision and dash.


    I was so glad to finally get a letter from you even though it was almost three

    weeks old—another Clipper is in Sunday afternoon and it is not further

    delayed…


    [Saturday, 1 November 1941, 9 AM, continued]'
