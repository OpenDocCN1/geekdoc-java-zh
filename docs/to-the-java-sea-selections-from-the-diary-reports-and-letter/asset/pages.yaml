    Sweetheart,

    This has been another quiet day—the only real news being the appointment of Ernie
    King as C in C U.S. Fleet. I think it is a splendid shift and I know that we will
    have a well thought out and aggressive campaign.


    In thoughts of you and home and trying to figure out how to run the war and what
