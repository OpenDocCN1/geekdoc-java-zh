    # LETTER TO MRS. ECCLES, 3 DECEMBER 1941 [WEDNESDAY, 18 FEBRUARY, CONTINUED]


    Last evening I decided I had been worrying about this fool war too much so I

    "knocked off" as the Old Naval Academy goes and turns for the first

    decent night''s sleep in two weeks—which meant that I turned in at 10 and got
    up

    at 7:50 with only three interruptions during the night. Today I have felt fine.

    Cheerful and in all respects. However, the ship was barging around at a great

    rate—pitch black—rain squalls, passing ships and islands—but I was too tired to

    care.


    You can tell me from my letters that the strain has been getting me down but I
    feel

    sure I shall be better by trusting to luck and not caring what happens next.

    The mornings are the worst times because you know where your morale and re- are
    in the wee small hours and dawn!


    The last three nights really been bad and I suppose there are lots more to

    come. But I do feel better and want my Isy to know it! I love you.


    ["Later," continued]


    We may get some mail off tomorrow. I wonder how many of my letters have reached
    reached you! My last news of you was just three months ago. And during that time
    all I have been able to speculate as what you are doing.


    As for the war—I have acquired some very fixed ideas as to its conduct” and some
    very fixed ideas as to the military organization the United States should have.

    But darling that all for the future—this is today. Good luck to you.


