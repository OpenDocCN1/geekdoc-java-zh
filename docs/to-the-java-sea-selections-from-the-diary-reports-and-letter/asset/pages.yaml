    [Tuesday, 13 January 1942, 9:30 AM, continued]


    During:


    This feels like another wet day. Yesterday afternoon rain cooled things off a
    lot but we have very little left of our original awnings and the sun beats down
    hard. It makes it difficult for all hands the men remain cheerful.


    The press reports mixed—there is too much propaganda, most of it nonsense. It
    is really very discouraging to be here where the war actually is and read reports
    of conferences, reassurances and future plans for astronomical production I would
    much rather the press contained nothing except official reports giving only facts
    that are suitable for release. However, I am glad to note that Duff Cooper-57
    has been fired. You will remember that Lady Diana is the dame who thought of Paris
    hits in the Spring of 1940.


    The reports of trouble between Hitler and his generals,58 if true are very encouraging.
    But don''t put too much by September. To return to Cooper—His point of view before
    the war was sound, but it strikes me that he was one of those likable, pleasant,
    correct and ineffective personalities that grips my soul. I suppose I should have
    more patience and optimism—I could be patient it were not for the clap-trap statements
    and conferences.


    As for thinking of things other than the war, I wish I could but that does not
    seem possible.


    [Wednesday, 14 January 1942, 11:30 AM, continued]


    Still quiet—all morning it has scorching but now a breeze is cooling off the air—the
    decks and sides of the ship are like stove. I don''t believe that after the war
    I shall have ever any great desire to see the tropics again. My blood would be
    so thin now that I hate to think of it. Every time the temperature drops below
    85 I feel chilly! And darling, the painful part is that I have always wanted to
    be a hardy New Englander you like!


