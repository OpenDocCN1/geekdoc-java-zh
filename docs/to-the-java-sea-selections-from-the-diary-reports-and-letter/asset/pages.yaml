    Yesterday was such a beautiful day—breezy and bright with nice clouds shooting
    around and squalls in the distance but not coming close enough to us. There was
    quite a long conference aboard the Paul Jones and the squadron commander gave
    us a bit of dope. In the evening Giles and I went over to the Whipple for the
