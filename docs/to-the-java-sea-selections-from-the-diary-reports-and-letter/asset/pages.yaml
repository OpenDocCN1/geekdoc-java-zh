  md: 'the situation, I believe, lies in the fact that people still put credence in
    words, plus the fact that newspapers are playing up headlines and talking about
    increases and decreases in tension. The Far Eastern situation. The actual facts
    behind the news are extremely difficult to obtain, and practically nothing is
    known of what is actually told to the representatives of foreign governments.


    One of the most successful weapons Hitler has used is that of creating confusion
    and division in the countries that he is attacking. There is no question but that
    he has conducted some very successful propaganda in the United States. There is
    also no question that many of the people who have conformed to their desire to
    keep the United States neutral have done it out of patriotism or sincere honesty.
    Actually, Darling, the confusion in our country now can be accurately traced to
    our failure to establish a definite national policy. The navy for a generation
    has begged for that, but it was never formulated. I suppose that we recognize
    that and are willing to pay for our way of life—we we paying that it is all right.
    I really do do it to the people who believe that we can continue such a way of
    life without paying for it. Walter Lippmann’s analyses, written about a year ago,
    sum up the situation better than anything I know but even when he did not express
    what I feel to be the real issue and conclusion.’[32]’


    Again, words confuse; take the phrase "short of war"—they are, I, believe, utter
    nonsense. If I am still convinced that we [we, Americans] are going to have to
    fight and I don''t think it makes so much difference whether we do it now or ten
    years from now. Being convinced of that I have no doubts and I have no worries.
    But apparently the people in the United States are full of doubt and worry. Once
    your mind is made up, a kind of peace of mind comes that most valuable—it brings
    relaxation and strength and confidence. If we face the worst, squarely, then nothing
    can hurt us, and the determination to see it thru faith and a quality of cheerfulness
    that those who are in doubt never achieve.


    All your mistakes and errors in judgment will be on the right side. Then the important
    things are in their places and there is nothing to fear.


    39 Bulgaria, under threat of invasion, joined the Axis on 1 March.


    40 Walter Lippmann (1889–1974) was an American Pulitzer Prize-winning author and
