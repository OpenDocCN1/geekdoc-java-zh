    [Saturday, 11 October 1941, 9 AM, continued]


    Of course you will have to make a complete reconsideration of financial things.
    As I see the future we should have a first home to go to, from mortgages, and
    in good condition so that it is comfortably habitable without a major cash cost.
    And that house should be in such a location that we can settle with a reasonable
    expectation of perpetuity. Then there should be a fund invested in the highest-grade
    U.S. govt bonds as a permanent backup and foundation. Depending on circumstances
    we should maintain savings accounting one thousand to two thousand dollars [in
    $16,000–$32,000] and a checking surplus of at least five hundred dollars and probably
    thousands dollars for emergency use. Do not be too concerned about inflation—a
    good home is the best hedge against—Remember, one of the great advantages of a
    naval station is a financial safeguard. From purely investment point of view the
    best hedge is a group of common stocks representing strong firms with progressive
    policies and good research facilities. General Motors, DuPont, General Electric,
    Air Reduction National Carbon and affiliates are representative. Therefore a portion
    of the total should be in this category. Preferred stocks should also be held.


    As a rough guess I would think that the best apportionment of funds for us would
    run—as I gave in the table below [see the table]—the percentages of coarse approximate.
    With that as a general guide of a situation to be achieved you won''t go far wrong.
    No matter what you won''t be perfect—the home is in primary. Government savings
    bonds can now be purchased very advantageously and the U.S. govt is not going
    broke. Do not dispose of anything you hold unless there is a definite and specific
    reason—we have had luck in shifting and there has been a lot of worry. Good advisors
    are rare and most of them have an axe to grind and are persuasive


    And now Sweetheart I am pretty well written—Don''t worry about finances—if doubt
    follow your basic instincts rather than others...


