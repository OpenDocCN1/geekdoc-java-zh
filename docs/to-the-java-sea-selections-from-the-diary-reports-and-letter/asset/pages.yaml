    Have you ever watched a lizard catching flies and mosquitoes? It is wonderful
    how they stand for minutes—then a quick skittering as they move a little and then
    another period of frozen waiting—suddenly an invisible tongue shoots out between
    an unbelievable distance and pop! There another bug found the hatch. At the Club
    last night, one watched a wasp or hornet for the longest time, but evidently it
    was too big and besides, the lizard''s belly was so full it swelled out…


    I am writing about ship—it is raining steadily, the hammers and scrapers keep
    up a steady noise as the men work under huge tarpaulins spread over the sides
    of the ship.


    A typhoon is reported between here and Guam so I suppose the Clippers both incoming
    and outgoing will be delayed. The typhoon that passed last week hit Hong Kong
    hard.


    # LETTER TO MRS. ECCLES, THURSDAY, 3 JULY 1941, 7:15 PM


    All the days of the typhoon have been throwing rain and wind at making everything
    wet and uncomfortable. I ate too much, for the cook had made a delicious soup—in
    away at 3:30 I still felt very stuffed and so decided to ignore the rain and take
    a walk. Charlie Weeks joined me and for three quarters of an hour we temped thru
    the mud, rain and wind and finally returned to the cottage very nicely relaxed
    and feeling much better. After a bath we stretched out on settees and read. I
    laughed and chuckled at the adventures of Mr. and Mrs. Cugat while the rain whipped
    and at times the cottage shook as a heavy gust hit. The problem of course is to
    keep our clothes and shoes dry—each closet has a big electric light in which it
    helps a great deal but there is still soggy damp feeling everything.


