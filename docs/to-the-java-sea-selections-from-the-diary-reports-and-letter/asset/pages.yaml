    # LETTER TO MRS. ECCLES, MONDAY, 22 SEPTEMBER 1941


    Darling Isy:

    I am subject to rather mixed feelings just now. I have another sore throat and
    it makes me cross and mad and under unpleasant and miserably and persnick-a bit
    of dope has been drifting back from the commander in chief [of the Asiatic Fleet]
    and it now seems that CinC has recommended that the tour of duty to be cut to
    21 months. Scuttlebutt from Washington is that this will be done and if that is
    true I shall tell here about April first or just nine months before I expected.
    I shan''t believe it until I see it officially. Where I might go for duty is,
    of uncertain, but under any conditions I should get a little leave in the United
    States before going again. By my pet, we both should have enough cash to make
    fast trips so as to have the maximum time together. Last night I couldn''t sleep
    because of thinking of it. I shan''t make any guesses and I shall try to be of
    fact, but Sweetheart I am having a hard time thinking of anything.


    Tomorrow will be a hard 24-hour day and the rest of the week will be strenuous
    until tonight I will turn early with the hope of feeling better tomorrow.


    > [Wednesday, 24 September 1941, continued]

    Tuesday was a bad day of most which I spent in my bunk and most of the night I
    spent on the bridge. My throat is still sore, but it is better than it was yesterday
    morning and I hope that it will be clear by tomorrow. It is very discouraging
    to have these respiratory troubles hitting me. They make me angry. I hope Skip''s
    condition [asthma] has improved permanently. You have mentioned his wheezes so
    that he is feeling is much better. When this clears up I will be able to write
    much better—we have anchored for few hours and I am turning in.


    > [8 PM, continued]

    I have had a quiet day—the seaside is cool and breezy, but my room is hot. My
    throat is feeling better, but I haven''t much strength or pep. Tomorrow and Friday
    will be busy and not too interesting. Now I am dull and dopey—forgive me please
    Darling. I love you.


    > [Thursday, 25 September 1941, 5 PM, continued]

    What a relief it is to be able to swallow without pain and to walk on legs that
    are not rubber! I slept well last night and have actually been able to feel the
    bugs leaving me all day! Naturally my morale has improved.'
