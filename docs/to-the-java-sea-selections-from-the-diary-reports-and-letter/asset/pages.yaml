    And now good my sweet. I love you.


    [Thursday, 12 February 1942, 11 AM, continued]


    Not much dope darling–I hate to guess at things when I really know so little.
    I need every bit of spirited strength and courage possible. I pray for it and
    I feel a real response. I know you are doing the same. Mail may leave today and
