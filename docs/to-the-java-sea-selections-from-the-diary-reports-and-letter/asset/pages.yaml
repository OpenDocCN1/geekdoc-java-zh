    Promoted to lieutenant commander in 1938, Eccles was assigned to the Design and
    Construction Division in the Navy Department''s Bureau of Engineering in Washington,
    DC. In this assignment he was responsible for coordinating all diesel-engine-driven
    vessels in the Navy, which at that time were submarines, submarine tenders, and
    tugboats. He worked with Lt. Cdr. Marshall M. "Heavy" developing what the two
