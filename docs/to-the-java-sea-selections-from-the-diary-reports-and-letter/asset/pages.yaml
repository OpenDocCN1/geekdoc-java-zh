  md: '# APPENDIX A: MEMORANDUM ON JAVA SEA CAMPAIGN (JUNE 1960)


    Even after the lapse of eighteen years, the memory of certain features of the
    Java Sea campaign is still strong. The first thing that to me is significant is
    that Admiral Hart [chapter 2, note 69] had taken all precautions well in advance
    of the Japanese attack on December 7, 1941. His destroyers and submarines had
    been sent to their war stations. We were dispersed and all the commanding officers
    had a sense of imminence of hostilities. Insofar as the actual fighting in the
    Battle of the Java Sea was concerned, one critical feature was the American destroyers''
    torpedo attack, which was totally ineffective. Admiral Hart apparently considered
    that his chief weapon in the defense of the Philippines would be his submarines.
    The Submarine Forces, Asiatic Fleet, had been greatly strengthened by the arrival
    of modern submarines. There was a large supply of torpedoes on hand and the submarine
    commanding officers and second officers had been undergoing extensive torpedo
    attack training. As an old submariner I knew of most of these commanding officers,
    and the division commanders were close friends. For the previous year of the destroyers
    in destroyer tactics had been sacrificed in order that we might run as targets
    for the submarines. In retrospect, this seems very wise because the destroy-ers''
    torpedoes were old, slow and had a small bursting charge. The course of events
    proved, however Admiral Hart''s wisdom in this matter did not pay off because
    the submarine torpedoes were very defective. When at great competent submarine
    captains put their ships in firing position and fired accurately; they got no
    explosions and the effort was wasted. This, of course, has been extensively detailed
    within the writings of Admiral Lockwood and others relative to the Bureau of Ordnance
    and the Torpedo Station, Newport, Rhode Island.


    The next feature of the torpedo situation was the differences in concepts of torpedo
    attack which apparently existed among destroyer division commanders. During the
    previous year, much of which had been under the leadership of William Lalor [chapter
    3, note 6], in DesDiv 57, and I all of my officers had become convinced that the
    use of "curved fire ahead" as opposed to "broadside fire"'
  merge: -1
  pgno: 296
- img_proc: true
  md: 'was almost mandatory, if one expected home [a] destroyer torpedo attack to
    effective close range. DesDiv 57 always used "curved fire head" for daylight-tacks
    and frequently used it for night attacks. Note: If torpedoes were set for curved
    fire ahead one could use broadside fire—but if set for broadside one could not
    fire ahead. We had practiced occasion with "broadside fire" but found that it
    was cumbersome. On the other hand some divisions favored "broadside fire" regularly.


    Commander Crouch [chapter 4, note 24] had relieved Lalor short-ly before the opening
    of the war, and apparently he concurred with these ideas. An old submariner had
    plenty of experience with torpedoes, but relatively little experience with destroyer
    tactics and therefore I welcomed every opportunity for exercises at destroyer
    tactics. I feel sure that we had more time for destroyer exercises, I would have
    had this experience. In all destroyer attacks I had been the N. 2 and had not
    been concerned with issuing the order for the attack or the instructions on torpedo
    settings. I took it for granted that torpedoes would normally be for "curved fire
    head."


    In the Battle of the Java Sea, we were faced with a new situation...


    At the beginning of the campaign, I made it to keep my key fully-formed to the
    status of the war, both in our ABDA [chapter 5, note 63] forces and in the overall
    world situation.


    As disaster overcame our own forces, it became more difficult to tell me exactly
    what had happened. Morale began to be seriously-affected by the Japanese successes
    in Malaysia and the impunity with Japanese air operating over us. A severe blow
    was suffered when the Secretary of the Navy announced that Germany was the prime
    enemy and the Japanese were secondary [chapter 5, note 63]. I noticed a group
    of men around the bulletin board one morning looking very unhappy and I dropped
    down to look at the board and there was the morning press posted with the Secretary''s
    statement. At that time we were under very heavy Japanese pressure. It was a difficult
    problem for a commanding officer to deal with.


    This situation was further complicated by the fact that our officers and men were
    well-trained in fleet tactics and maneuvers and they knew the capabilities of
    our ships. The handling of our ships at sea by the Dutch commander indicated to
    them that he did not have the tactical preparation and competence to check which
    they had been accustomed. For example, as anti-submarine screens, we were forced
    to cruise at 18–22 knots, speeds at which our sonar gear was totally ineffective
    due to noise interference, but fast enough to be free from submarine threat. This
    lack of confidence was further accentuated when Admiral Hart was relieved of command
    about the middle of February.'
