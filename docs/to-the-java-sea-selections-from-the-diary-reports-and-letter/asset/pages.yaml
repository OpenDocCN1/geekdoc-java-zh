    # LETTER TO MRS. ECCLES, SATURDAY, 7 MARCH 1942


    My Darling Is,


    It looks as if there is a chance to get a quick note off to you this must be.

    Last Sunday I estimated that I had about 10% to 20% chance of getting out of the
    N.E.I. alive—well Sweetheart—here I am the Grace of God—we probably don''t deserve
    it, but here we are safe and sound, and better still I have 24 hours of complex
    relaxation to take the tension off.


    From 4 February to 1 March I was in two major air attacks on the front, to six
    attacks on the base from which we were trying to operate, one major surface engagement,
    one major day and night surface engagement and one minor surface engagement—all
    of which amounts to the fact that all of the surface fighting that has gone on
    I have missed only one fight and the ship has had more engagements with the enemy
    than any other ship of the Navy and that we in one period have seen more fighting
    than in the Navy since the Civil War. So I am proud of my ship—it has actually
    been very wearing—of course I have lost weight and I am tired, but my morale is
    high and I am not worried. I have been awarded the Navy Cross. I don''t think
    I deserve it for many times I have been too scared. In the future you may receive
    a bunch of blue letters when I was very sunk—ignore them as they are indicative
