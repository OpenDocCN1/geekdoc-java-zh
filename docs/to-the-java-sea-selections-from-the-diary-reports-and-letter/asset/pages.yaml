  md: 'Incidentally, some light reading be good for you too and I have a further recommendation:
    The Countess to Boot by Jack Iams¹¹⁴⁶ is delightful and will give you many good
    laughs.


    This letter is very long and rambling but it has been written at odd times and
    varying in moods.


    The ship''s party last night was a great success and I had lots of fun. It was
    held at a road house outside of Olongapo and as usual it was raining from time
    to time thru the evening. There were about thirty taxi dancers [whom paid, by
    the dance, to dance with them] and we provided many cases of beer and yards of
    dance tickets in addition to a good dinner. I intended to come home early, but
    it was too much fun to leave. Finally about midnight I came back to the cottage
    of beer and very, very sweaty. There were three fights, none serious, but there
    was quite a bit of blood and mud splattered around. No one was badly hurt and
    no one got into trouble and all seemed to expect and enjoy the fights.¹⁷ The men
    brought their girls up to dance with and I found them remarkably good dancers
    and very cheerful. One slender party girl with a big patch of tape over one eye
    (where she had apparently been socked) and dark glasses, was recommended as the
    best dancer on the floor; she was as light as a feather—who had acquired quite
    a bit of prestige and the nickname of “Shanghai Lil” from one season''s work in
    a dive at Shanghai was most enthusiastic about me and was on my tail of the evening.
    We tried to make some square dances while everyone was enthusiastic, the confusion
    was too great for them to be properly called. “Shanghai Lil” was no bother, however,
    and I danced with one lot of rag tag and bob tailed ballerinas—and watched some
    high-grade sailor jittering. Enlisted men poured out their eyes and opinions over
    their beer to me and once they said “For He''s a Jolly Fellow” at me while I was
    dancing with one girl. One told me he always listened by the headroom ventilator
    when I played my good music and he was very anxious to hear Stravinsky''s “Fire
    Bird.” Another told me how much good the five days bread and water¹⁸ that I had
    given him, had really done. Another said how he had to be on a ship where the
    men felt they could really talk to the Captain and get some out of it. In all
    it was a crew of fine youngsters thoroughly relaxing with each other and a group
    of rowdy fussy, brown, and mostly unruly;;


