    # LETTER TO MRS. ECCLES, SUNDAY, 24 AUGUST 1941


    Darling Isy:

    This has been a bum week and thru most of it I have felt somewhat under the

    weather. Mail that we expected did not arrive.


    Yesterday morning we anchored in a place where we could grant liberty—the

    first in weeks and yet during that time we haven''t been out of sight of land
    for

    more than a few hours. I went ashore to play golf but at the end of nine holes
    had to

    stop—I was just plain pooped out beside my throat was sore. I got back to the

    ship after dinner had my throat treated and turned in. I got a good sleep and

    feel better this morning, but not so hot I shall stay abroad. It is disappointing

    to in this shape but there is no use being foolish. I suppose that in another
    month

    or so there will be another chance to get ashore.


    I passed my annual physical exam early week so apparently there is nothing

    wrong with me. I am fed up on my constant colds—I suppose they will continue

    as long as I am out here.


