  md: 'The initial reconnaissance showed that we would be outnumbered about two one,
    but when we got about 100 miles from Balikpapan, at 7:00 o''clock of the evening,
    the late afternoon reconnaissance reports came which showed that the Japanese
    were obviously expecting us and had a very much larger force, consisting of four
    or five cruisers, ten destroyers, and two mine layers, which in a disposition
    made it obvious we could not reach the transports without fighting our way through
    the entire concentration. About a half hour after receipt of this report Captain
    Robinson very wisely reversed course and we returned to a point south of the Kangean
    Islands [see map]. joined with the Houston, Dutch and American, at Gil Raja [Giliraja
    Island, see map], Madoera [Madura, see note 13] Strait, and there fueled and formed
    Combined Striking Force under the command of Rear Admiral Doorman of the Netherlands
    Navy.


    The following morning, while we were attending a conference on the De Ruyter,
    the Japanese bombers, returning from an initial attack on Soabaya, sighted our
    concentration. We got underway that night and the following day, February 4th,
    we were steaming in a large square south of the Kangean Islands waiting for Japanese
    forces from Balikpapan to commit themselves to an attack on Banjarmasin [Banjarasin-see
    map] area or Makassar, the plan being to wait until they had committed themselves
