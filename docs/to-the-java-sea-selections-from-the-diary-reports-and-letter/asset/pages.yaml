  md: 'DURBAN TO MANILA 61


    # PERSONAL DIARY

    [Probably Sunday or Monday, 29 or 30 September 1940]


    The Bahrain Petroleum Company has a beautiful camp here, all the offices, homes
    and community buildings being air conditioned.


    It is very interesting to see the Arabs with their colorful costumes against the
    desert setting—this is real desert too! The women, heavily veiled, cover[ing]
    their heads as strangers, the funny palm-leaves hides the brown houses, made of
    stone and plaster, the camels and donkeys, the date palms, the crooked streets
    and the noise of the beggars and in the evening of men sitting around the coffee
    shops. It makes a picture that I shan''t forget yet I would not want it for long
    or too often. The native boat builders are very skilful and the dhow are well
    made with good lines, the teak [see note 44] comes from India and the nails are
    locally handled wrought. The big d goes all the way to Zanzibar and Dar-es-Salam
    with the monsoon. The pearl business is not prosperous because of the war and
    competition of cultured pearls but this is the source of supply of the natural
    pearls. I have often heard of the illusions of distance that is in the desert
    but I never realized how true that is. A building will appear to be about half
    far as it actually is.


    My plan is a late day but I expect to go out early in the morning then for Singapore
    and Manila—I am fed up with travelling, loafing and strangers and I want to get
    back to work on my own job with my people.


    Mass of almost sub-human type.


    I had a very interesting visit with Mr. Grant at Bangkok but it was quite late
    when he went home and saw me.


    Wednesday, 9 October 1940


    Soengei Gerong [Netherlands East Indies]

    Monday afternoon [7 October], I drove up to Pendopo with Mr. McCobb [para. 4,
    below] to visit the oil fields. The camps are well laid out, the quarters comfortable
    and the staff is composed of high-type men. We stopped at a very attractive little
    club house and golf course for a drink before going into camp. We had dinner with
    Mr. Field the superintendent and a few others. After a quiet evening we turned
    early. Tuesday morning after a cool sleep under a blanket, we made an early start
    and toured the fields.


