    # PERSONAL DIARY


    [Apparently Thursday or Friday, 29 or 30 August 1940]

    Early Tuesday morning [27 August] we were called for Mombasa about five thirty
    in the afternoon. The harbor is beautiful. Mombasa is on an island; we entered
    by the new south channel called Kilindi$^{12}$ and then swung around the island
    to the docks on the south west end, passing on our way the new forts built around
    the ruins of the old Portuguese encampments. The golf course paralleled the old
    and in it we spotted an aircraft, machine gun posts and on duty. Mombasa is 120
    miles south of the Italian base of Kismay in [Somaliland, modern Somalia] and
    every thing is ready for any eventuality. At night as we were introduced to the
    blackout. It is not a pleasant thing. It is a shame that has been taken from the
    professionals and inflicted on civilian population. Until you are in such a blackout
    it does not seem real.


    We went ashore for a farewell dinner: Jerry and Madge Howe, Dean Smith and I,
    Algy Brown, Molly Trompeter and Dorothy Skidmore. Thelma Cornwall being at home
    [i.e., Kenya for her] was the only absence of the group that had such fun all
    the way to the coast. The food was good, the drinks plentiful, the Manor Hotel
    article, and all in things resolved themselves into a thoroughly delightful evening.


    Wednesday morning [28 August], Mr. Dancum of Vacuum came aboard to see me and
    I last attempt to arrange passage from Mombasa to India but to no avail. I went
    over a farewell call on the Henry Grove, said good bye, and left a letter for
    Isi to be mailed in the U.S. I then went out to Port Reitz [immediately to the
    west] to visit the Cornalls and was glad to see Eric. They have lovely


