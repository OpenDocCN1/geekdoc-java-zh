    This afternoon I am playing golf with Bob Denison, Johnny Pratt74 and Frank Budget
    [unidentified] and expect to be back aboard. Tomorrow I am having lunch with the
    Agnes and Monday we are underway early.


    During the next month, our operations will be such that I may miss getting a letter
    off the Clipper–if that happens don''t be disturbed, it will merely mean that
    we are at sea wandering around the local posts.


    It is hot again and my prickly heat is heating to break out a bit. I''ll take
    salt tablets and use special soap with the hope that it will be reduced. However
    it does appear in our most inconvenient spots! Naked people suffering from bad
    prickly heat present a most peculiar and unattractive picture!


    And on that theme I pause...


