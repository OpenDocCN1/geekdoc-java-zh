    # LETTER TO MRS. ECCLES, 23 FEBRUARY 1942 (CONTINUED)


    Next day—I forget what happened on that particular raid—we had one morning where
    no apparent damage was done and last night we went out on raid ourselves but nothing
    turned up except that I had no sleep. Existence is the term, life—at times I feel
    exhausted I think nothing can lift my spirits—but a bit of sleep helps...


    (U.S. Navy War College Museum Photograph Archive)


    ![](img/271a4dd38c17a5bcd4a1efde5be2dc47_273_0.png)


    # 1942 DICTATION [CONTINUED]


    The fact that our maximum speed by that time had been reduced by wear and tear
    to about 28 knots and the fleet was maneuvering from 22 to 26 knots made it extremely
    difficult for us to regain any kind of position when the fleet maneuvered. I tried
    to keep station on the disengaged flank enough to be ready for torpedo attack
    and not too close to be hit by [rounds that passed over their targets]. I kept
    the splashes from the enemy over 500 yards on our starboard hand...


    We finally went to attack. We went between the smoke screens and attacked the
    seven enemy cruisers. We opened fire with their broadside batteries. Owing to
    the fact that there were only four of us and the fact that we were on a position
    rather sharp to their bow [almost dead ahead of them], we fired at long range.
    It was not a good torpedo attack, but under the circumstances I could have expected
    to do much more [w]hile the enemy secondary batteries were close]; We suffered
    no damage. For some remained between the two battleelines and merely tried to
