    # LETTER TO MRS. ECCLES, FRIDAY, 27 SEPTEMBER 1940

    Awali, Bahrain Island, Persian Gulf


    ... The main island is about nine or ten miles wide and about thirty miles long.[*]
    The old Arab city of Manama is at the northern end and scattered over the main
    island are numerous villages.


    The hot season is drawing to a close, and now the day temperature is high and
    the sun very bright, the humidity is low and the evenings very pleasant. All the
    houses and offices of the Bahrain Petroleum Company are air conditioned. That
    makes life comfortable. The whole town or camp of Awali is run on American customs
    and habits so I feel at home for the first time in months.


    The people of the islands are an old stock, predominantly Arab, with mixtures
    of Persian, African slaves and some Indian. It is strictly Mohammed and most of
    the women are heavily veiled. Scattered about one section of the island are thousands
    of burial mounds the age of which nobody knows.* Some think they are thirty years
    old but very have been found in them.


