    Olangapo


    Dearest Lamb,

    The Clipper men is leaving the ship in a short time so this is brief and hurried.

    I had held off writing the last few days for more news by Monday''s Clipper

    but we missed the mail by a few hours.


    Saturday played golf and Sunday I had the Agnes for dinner at the Club and

    then went to an amusing movie. We carried on later at jai alai and it was very
    late

    when I got back to the ship. My first visit to jai alai since December and

    we saw lots of people we knew. It was a rather "willing" affair and I enjoyed

    it. Sunday morning I slept then slept Sunday afternoon and by evening

    was thoroughly refreshed and completely relaxed than I have been for some

    time. Incidentally my Dove, Milk of Magnesia tablets are fine—practically no taste

    but very effective!


    Monday we were underway at three and were busy until seven thirty

    this morning when we anchored here after a very satisfactory though tiring day.

    Early morning we had an interesting and spectacular maneuver testing

    alertness and efficiency of the forts on the Island of Corregidor at the entrance

    Manila Bay. The Edwards acted as a decoy and performed to the satisfaction of
    the

    division commander so I feel pleased.


    This morning after anchoring I unaccountably found myself on my bunk andnslept
    for a few hours then again for an hour this afternoon then very casual

