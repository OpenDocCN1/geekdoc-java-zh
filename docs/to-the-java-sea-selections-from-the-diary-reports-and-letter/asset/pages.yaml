  md: '# 1942 DICTATION [CONTINUED]


    Late in the afternoon [28 February] we showed off, Commander Binford having shifted
    his ship several days before the Stewart to the Edwards. We left word with the
    demolition party [left behind to destroy the wreck of Stewart] to take their orders
    from Commander Murphy, Navy Liaison Officer in Soerabaya.


    We did not have time to make any attempt to pick up the sick and wounded who were
    in the local Dutch hospital. Transportation was almost impossible from Soerabaya
    to the docks and our boat transportation was limited. As we cleared the lightship,
    we got word that a Dutch ship had been sunk that day in Bali Strait by cruiser
    and destroyer fighter.


    It was a bright, clear night with a full moon. We ran down the coast of Java,
    close to the beach at 20 to 22 knots and headed through Bali Strait.


    It was rather nerve-wracking work entering that narrow one-mile-wide strait, as
    we expected the Japanese to be in it. We were guarding the north entrance or the
    south entrance. I would have thought that they would have been around the north
    entrance. It turned out they were down to the south in the wider part of the Strait.
    Our previous passages through Bali Strait had given us confidence in our ability
    to navigate at high speed and the visibility was good enough that we could see
    the beach clearly. We went through the narrows at 22 knots and as soon as we cleared
    them jumped up to 25, hugged the coast of Java and headed towards the southern
    entrance to the Strait...


    [After sighting and engaging Japanese ships] I came to the right, God only knows
    how close we were to the beach; Giles, who was plotting [the ship''s position
    and track at the pilothouse chart table], called out to give a full left rudder.
    Commander Binford heard him and gave the order to the wheel, we came hard left,
    headed for the enemy, and the plot [indicated] that we were already on the reef,
    or how close to it was no telling.


