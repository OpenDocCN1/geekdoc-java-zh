  md: '# TO THE JAVA SEA


    The after-battle reaction is pretty strong. I fed up with censorship regulations
    and the restrictions that have been imposed on my writing by it [sic]. After all
    they can''t do more than court-martial me and that is a small thing in comparison
    to what has been done.


    Of the major engagements and sorties against the enemy I have missed only one
    [Balikpapan, on 24 January], and I have sat in the plans of four or five which
    never came off. Twice I have been in a formation which, without any protection
    from the air, has been bombed continuously for waves of Japanese planes. I have
    watched ships hit from the air and planes brought down. The other day one plane
    dropped a couple of [bombs] which landed about two hundred yards from the ship.
    The plane was so high we could not see it.


    The Battle of Badoeng Strait—or Bali Strait was the most spectacular and terrific
    of my life. For almost an hour we fought our way through vastly enemy forces and
    inflicted much greater damage than we received. Twice I was dazed and blinded
    by the shock of our one gun firing past the bridge and once once the quartermaster
    handled the ship both the exec[utive officer] and I were unable to see. At that
    time three ships—probably two cruisers and a destroyer—were fired at us relatively
    close, the tracers on the shells and pompoms making brilliant arcs as they came
    at us and the water splashing all around us as the salvos. I watched one of our
    shells start toward one ship—and I said to myself, “It looks good”—and then it
    burst on the enemy in a sheet of flame—a large fire burning and showed the two
    stacks of a destroyer or cruiser in a short time the pink flare of a torpedo explosion
    I had fired two or three torpedoes at him shortly before and all firing ceased
    from him, his headlight went out, the flames from our hit went out and there was
    nothing but black where he had been.


    There was a lull and shortly after a ship much closer than the others put a ships
    started shooting. I called out to get the ship with the light and we we around
    zigzagging at 28 knots to avoid the fire. A shell from somewhere seemed to lift
    the light up in the air and it went out. One of our destroyer skippers said he
    headed up on the other side and sunk the ship with the light, which for I was
    very grateful. A little later all firing ceased and we sped on. We took stock
    of the situation, found no serious damage and only one man with a broken leg.
    The Japs suffered heavily. The rest of our outfit came thru O.K. and at dawn we
    joined up and went on our way.


