    [Tuesday, 13 August 1940, continued]


    My bills are paid, my luggage neatly packed and in about an hour I shall start
    for the dock. We sail at noon, touch at several East African ports, square away
    for Singapore which we should reach before this letter gets to you. After reaching
    Singapore, if conditions are favorable I shall cut back to India and return to
    the Far East; however it is impossible to predict what I shall do or what my route
    will be. I feel that I shall reach Manila by November 1st at the latest and I
    hope that you can arrange to get there by November 15th. Try in any event.


    I was dead tired when I wrote to you last night but now I feel eager to get on
    with my journey. I wish tell you all the funny details of my life—your mending
    set has been used for buttons and darn, the clothes with their dear familiar marks
    have been used affectionately and I wish so much that we could have been together
    so that you could enjoyed looking at the gorgeous scenery, the strange foliage
    and beautiful birds, the funny little hotels in the country with their strange
    johnnies [bathroom facilities] and customs. It has a great experience but it would
    have been so much richer had you been along.


