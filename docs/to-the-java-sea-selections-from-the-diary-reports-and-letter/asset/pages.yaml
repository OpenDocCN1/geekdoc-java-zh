    The incident highlighted certain aspects of the situation. In of us were very
    tired, having been going continuously since Sunday night, and the lessons we learned
    then stood in good stead, for thereafter the executive [officer] and I made sure
    to get as much as possible, alternating with each other on the bridge during the
    day and night, expecting certain hours when we stayed up on the bridge. But it
    showed the futility of expecting people to keep the proper mental alertness and
    quick reaction without sleep.


    One of the very interesting aspects of our trip was back that about two hours
    the submarine attack we sighted a string of sampans being towed by a small tug;
    the sampans were headed for Singapore and were flying a Japanese flag. I did not
    open fire on them with our machine guns as we pulled alongside because I did not
    understand what was going on. The ships were flying with Japanese, the Japanese
    flag flying, and the division commander finally ordered the Edsall to drop off
    and investigate. It turned out later that the British had collecting the Japanese
    from outlying areas. They did not have enough transportation them so, in the circumstances,
    they merely ordered the Japanese to pack up and make their own way to Singapore.
    But it was a great shock to see the Japanese flag flying from the group of sampans
    filled with men, women, and children. The Edsall brought them in and turned them
    over to a patrol boat. I would say it was the first capture of enemy at sea by
    the American navy.


    # LETTER TO MRS. ECCLES, 3 DECEMBER 1941 [FRIDAY, 12 DECEMBER, 4:30 PM, CONTINUED]


    My Dearest:


    This seems to be a breathing spell and we are taking all of it to clarify things,
    rest clean and generally resurvey the situation.


    The news reports have been staggering and I know how worried and concerned you
    must be. I will make every effort to get word to you of my being O.K. before this
    letter reached you.


    Our uniform is now really something to see—no more civilian clothes. We now wear
    shorts, and carry pistols, steel helmets and gas masks, whenever we go ashore
    for protection in case of air raid or parachute troops dropped.


    # 1942 DICTATION [CONTINUED]


    When we arrived in Singapore, we found the place in a state of great dejection.
    The British were stupef at the terrific loss they had received and some of the
    most fantastic and wild stories were going around as to the type of attack they
    had suffered.


    One rumor that spread, which is an instance of the wilderness of people''s imagination,
    was that the Japanese planes had attacked in a wave of 1,000 planes, dropped their
    bombs first on one of the ships, then on the other and in each case the ships
    had simply disintegrated. When we turned to checking up with the survivors


