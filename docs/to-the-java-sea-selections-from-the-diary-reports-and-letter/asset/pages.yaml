  md: '# APPENDIX B: MEDALS AND ORDERS


    As HEE informed his wife from Australia, the U.S. Navy conferred decorations on
    both him and his former executive officer. W. J. Giles, whom HEE recommended for
    medals for each of the two acts of heroism in his letters and reports, received
    one for both:


    The President of the United States takes pleasure in presenting the Silver Star
    to Commander-William Jefferson Giles, Jr. (NSN: R-0-70120), United States Navy,
    for meritorious service as Executive Officer and Navigator of the U.S.S. John
    D. Edwards (DD-216), in the battles of Badoeng Strait on 19-20 February, and the
    Java Sea on 27 February 1942, and in the engagement in Bali Straits on 1 March
    1942. In the Battle of Badoeng Strait he fought under heavy enemy cross fire and
    chased salvos with exceptional skill and coolness so successfully that the ship
    escaped damage. During the night engagement in Bali Strait on 1 March 1942, he
    demonstrated skill and courage in navigating the ships of Destroyer Division showing
    high speed through the treacherous waters of Bali Strait, skirting reefs in the
    midst of a sharp engagement with enemy weapons. His steady navy, sound judgment
    and courage following an exhausting weave of almost constant action against overwhelming
    enemy forces in keeping with the highest traditions of the United States Naval
    Service.


    HEE received the Silver Star, specifically for his service in the Java Sea battle:


    The President of the United States takes pleasure in presenting the Silver Star
    to Commander Henry Effling Eccles, United States Navy, for conspicuous gallantry
    and intrepidity as Commanding Officer of the destroyer U.S.S. John D. Edwards
    (DD-216), in the Battle of the Java Sea, 27 February 1942, and in offensive attack
    against the Japanese fire Line of heavy and light cruisers. Courageous and aggressive
    in the face of severe enemy fire, Commander Eccles fought with boldness throughout
    hazardous engagements, going in unsupported, as a unit of a Destroyer Division,
    to deliver a successful attack in two stages against the Japanese cruisers, forcing
    them to break off the attack and enabling the Allied ships to regain their battle
    formation. Eccles'' leadership and the valiant fighting spirit of the officers
    and men under his command made great credit upon the United States Naval Service.


    Eccles also received, as mentioned to his wife, the Navy Cross—a superior decoration,
    second only to the Medal of Honor—for his actions in the Badoeng Strait:


    The President of the United States takes pleasure in presenting the Navy Cross
    to Commander Henry Effling Eccles, United States Navy, for extraordinary heroism
    and distinguished service in the line of his profession as Commanding Officer
    of the destroyer U.S.S.'
  merge: -1
  pgno: 300
- img_proc: true
  md: 'John D. Edwards (DD-216), in action against japanese naval forces at Badoeng
    Straits off the island of Bali, Netherlands East Indies, on the night of 19–20
    February 1942. Commander Eccles endured a well-directed and gallant attack by
    gun and torpedo fire against a vastly superior of enemy vessels. The ship he commanded
    was illuminated by the enemy and under heavy fire, it scored several hits which
    damaged the enemy ships and silenced them. Eccles'' inspiring leadership and the
    valiant devotion to duty contributed much to the outstanding success of this mission
    and reflect great credit upon the United States Naval Service.


    Most remarkably, HEE, was one of ten U.S. naval officers who received—three of
    them posthumously, two in absence or on another occasion—orders and medals from
    Queen Wilhelmina of the Netherlands (exile). The queen conferred these decorations
    personally, on 7 August 1942 at the residence of the Dutch ambassador, A. London,
    in Washington, DC, expressing her gratitude for their distinguished services in
    the defense of the Netherlands East Indies (and, according to local press coverage,
    tasting in orange juice).


    Adm. Thomas C. Hart, former commander in chief of the Asiatic Fleet (by now retired),
    and Rear Adm. William A. Glasgow, who had commanded the ABDA naval forces, received
    the Order of Orange-Nassau (Order van Oranje-Nassau) with Swords, a military order
    created in 1892 to recognize service to the Netherlands by foreigners and Dutch
    citizens.


    Cdr. Thomas Binford, who had commanded Destroyer 58, and Lt. Cdr. Edward N. Parker,
    who had commanded USS Parrott at Balikapan and Destroyer 59 in the Badoeng Strait
    area, were awarded the highest and oldest honor for bravery, military or civilian—the
    Militaire Willems-Orde, 4th Class. (Parker had no Navy Cross at Balikapan and
    a gold star in lieu of, for the Badoeng Strait; he would receive a third as a
    destroyer commander at the November 1942 battle of Savo Island).


    The Bronze Cross with Honorable Citation (Bronzen Kruis met Ervolle) was conferred
    on Lt. Cdr. Harold Paul Smith, who had commanded the USS Star, and on HEE. It
    was awarded in absence to Lt. John N. Hughes (1909–89), USNA class of 1931, retired
    as a rear admiral), commanding officer of Parrott (having retired Lieutenant Commander
    Parker since for the Badoeng Strait engagement). It was also conferred posthumously
    on the commanding officers of the destroyers Pillsbury, John D. Ford, and Pope.


    Eccles'' citation, as read by the queen:

    It gives me pleasure to tell you that I have signed a decree conferring decorations
    upon the United States Navy. These decorations have been bestowed in recognition
    of valuable deeds and most distinguished services in the Battles for the Indies.
    You, Commander Eccles, of destroyer ''Edwards'', have shown especially meritorious
    conduct in action with the enemy during a night engagement on February 19–20,
    1942, with a vastly superior Japanese Naval Force in Lombok Strait. Although under
    heavy fire from the enemy, you have pressed the attack which resulted in severe
    damage to the enemy, while receiving no damage to your ship. In recognition of
    your high efficiency in combat you have been granted: "The Bronze Lion" [the authorizing
    decree, dated 5 August, gives "Bronze Cross"].'
  merge: -1
