  md: '# II Durban to Manila


    16 August–November 1940


    PERSONAL DIARY

    (Undated, presumably 20–22 August 1940)


    This ship [SS Swartenhondt] gives every great appearance of having been designed
    by a man who had never been to sea. It was built in Amsterdam in 1924—but has
    no deck space—is badly cut up. The cabins have no real lockers—no bunk lights
    and very little room. The baths are inadequate—there is no separation of men and
    women’s bathrooms. The johnnies are peculiar contraptions with no seats—there
    being four for 60 passengers and no urinals! The ship is a coal burner—clean enough
    but damned uncomfortable. A modern submarine has better and more facilities and
    comforts!

    Aboard Mr. Brown’—English—in the colonial legal service on his way from the Gold
    Coast of West Africa to Solicitor General of Kenya. Bachelor about 40 years—very
    attractive, fine education—set ideas. Mr. and Mrs. Howe—Irish, full of hun. He
    also in the colonial legal service—on his way back to Singapore to take up again
    after a leave in England curtailed by Blitz [see chapter 1, note 16]. People Captain
    Faward, Senior—simple and witty—with a great detailed knowledge of Africa. Dr.
    Dean Smith—young and brisk—on his way back to his hospital in Hong Kong. Mrs.
    Cornwall—going back to Kenya—35 or so, pretty, challenging disposition, ready
    laugh, brittle conversation, straight right hand—but nice uncertain. Looks like
    Adele Monroe—25–26 years, looking for the African war–d—to be near her husband
    who left Colonial service in West Africa to join up as a platoon sergeant. Aloof
    and preoccupied at times.

    They all have self-contained British quality—not easy to grasp—all are very friendly
    and cordial. Then the other passengers doing various things—Dutch and British.
    A frail tiny girl going to Kenya to marry a man in the Army. One


