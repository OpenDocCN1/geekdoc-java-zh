    purport to be the details of the Battle of Java Sea but don''t seem to be very
    accurate. When one remembers that it took almost twenty years to find out what
    actually happened at Jutland, it is not reasonable to expect all the answers on
    Java to be clear so early.


    As is to be expected in a war of this intensity, I have lost some very good friends.
    The Pilsbury and Edsall have been announced missing by the Navy Department—how
    many, if any, were rescued is impossible to say, but I don''t believe many got
