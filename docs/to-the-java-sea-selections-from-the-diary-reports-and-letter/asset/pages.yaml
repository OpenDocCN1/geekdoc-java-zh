    We had 20 minutes to strip the ship'' as we went through the minefield and the
    men "turned to" with a will getting rid of extraneous gear. I managed to save
    the loudspeaker of our movie machine as it was being thrown over the side, be-cause
    I felt that the use of phonograph records would do so much to help the men pass
    later in the war. We made go many mistakes in stripping the ship so hurriedly,
    although we had made many preparations for it beforehand. We dumped all our gasoline.
    We got rid of most of paint.


    On the way shortly after dusk we sighted several British destroyers return-at
    high speed. It turned out later that they had all the survivors of the Prince
    of Wales and the Repulse abound. In one case, the Jupiter I believe had picked
    up 900 men. It was unfortunate from certain aspects that we did not know they
    had survivors aboard. We merely exchanged calls and proceeded up [the] cost.


    The last time we sighted a destroyer we reversed course to continue communications
    [with it] flashing light and it was dark when we were with the signals. When again
    reversed course and the last ship in the column, the Edsall, missed the turn or
    fell back and after we made our turn, we sighted the Edsall. It was a rather tense
    moment because we thought the Edsall was immediate-ately stern of us[:] that she
    was opposite course about 1,000 yards on our starboard beam [chapter 3, note 133],
    and for a moment looked like an enemy ship. However, the radio we straightened
    the matter and we continued.


    In the meantime, we got word that the Repulse and the Prince of Wales were sunk,
    and [that] we were to continue our search for survivors. At midnight we knew we
    were on the scene because we could need fuel oil. Shortly, we ran into quantities
    of fuel oil on the surface and began to see a good deal of wreckage.


    Before leaving Singapore, we had a British liaison officer, you lieutenant commander,
    and a group of signalmen and radiomen pout together with flags and [signal] books,
    and most of the time we spent on the trip north was talk-ing with them and ironing
    our communication systems. It appeared that there would be very little difficulty
    communicating, because all the British officers and men on liaison duty seemed
    very capable.


    It was a moonlight night, flat calm, and the wreckage, burnt boats, life jack-ets,
    rafts, things of sort, gave us our first introduction to war.


