    [10 PM, continued]


    It turned out to be a rather dull day; we had this Hound of the Baskervilles''
    at the movies which was nice and blood curdling, then a few games of Acey Ducey
    and now to bed.


    [Tuesday, 22 July 1941, 10 PM, continued]


    Perciefield came aboard today and we ran target for his submarines—it was quite
    rough and we bounced around a good deal. There is nothing quite so woebicone as
    a sick Filipino mess! Tomorrow we operate or less independently. Things seem very
    complicated. The more I try to study on what I am supposed to know, the more I
    became amazed at the amount I don''t know and every day new masses of information
    or restrictions come in! The longer we stay in a period of peace and emergency
    the worse it will be. If we went to war it would be greatly simplified! We may
    have to do it in every event just to stop the flow of papers. Rather a dismal
    commentary born of a state of confusion. I was thinking that it would be fun to
    see Jerry and Madge.


    [Wednesday, 23 July 1941, 5:30 PM, continued]


    We are taking fuel now, shortly we shall get underway and return to the anchorage
