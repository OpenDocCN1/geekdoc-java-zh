    # LETTER TO MRS. ECCLES, MONDAY, 12 AUGUST 1940


    Probably before this arrives you will have heard by cable of my arrival in Singa
    pore. I am sailing tomorrow and eventually will reach the East. After I get my
    movements will still be uncertain, depending on the transportation situation and
    on the international system. And I shan''t make any predictions about either.


    Things have been happening so fast that I can keep track of what I have written
    this morning I returned from my trip to the Game Reserve. It was wonderful and
    I missed you badly, for you would have loved being up there. The long rides over
    dusty rough roads would not have appealed to you. We saw no lions, but I heard
    one growing and snarling around twenty-five feet from my cabin after midnight
    on Friday! However we saw many varieties of antelope and giraffe, zebeest, monkey
    and cheeetahs. In addition there were all of beautiful strange birds that defy
    description.


    Saturday noon—just as we were planning to spend another day in the Re serve I
    got a "telegram" telling me to return at Durban in order to get my steamer, by
    rail and by I finally reached here morning. I had my ticket and everything ready
    and I noon sail at the K.p.m. ship Swartenhorst. It is a rather small Dutch ship
    carrying about 40 passengers and what I saw of in the ticket office I should judge
    to be a very gay lot. It will be an interesting voyage even if the company does
    not appear so hot. We sail at several African ports before crossing the Indian
    Ocean and I will get letters off to you—I hope they don''t get up long too.


    I have kept very well, I feel soft from lack of exercise, but I sleep and well
    decently adjusted even if of this life of travel, hotels, etc. I am lonely—I miss
    you and Skip. I hate to think of how much time must go before you and I meet in
    Manila. Now I am tired, I feel that the last two weeks have gone by quite quickly
    that the next two weeks will never go by. I am hungry for


