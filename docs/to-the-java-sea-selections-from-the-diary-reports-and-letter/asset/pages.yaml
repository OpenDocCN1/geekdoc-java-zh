  md: '# TO THE JAVA SEA


    This is a most peculiar vessel, having been built in Holland in 1924 for coastwise
    work in the Dutch East Indies. The cabins are very small and cramped and are designed
    to be used for a day or so because they have no storage space worth mentioning.
    The bathrooms are ridiculous—their being two first-class passengers with a total
    equipment of two johnnies (with no seats!), two wash basins, and one bathtub and
    two Indian baths. The latter consists of a big can of water with a dipper. The
    technique being to pour the water over oneself with the dipper. The deck space
    is very cramped.


    However the ship is clean (except when taking coal aboard) and the passengers
    interesting and congenial, consisting almost entirely of English and Dutch people.
    The latter are perfect examples of the paintings of Jan Steen and Teniers.’ Typical
    faces that appeared in 16th and 17th century village inns!


    My roommate is Captain A. T. F. Tavais of the West African Frontier Corps [sic,
    see chapter 1, notes, 64, 65] returning from leave to join his regiment. Mr. &
    Mrs. Howe—he a legal member of the Colonial Service returning to Singapore. Mr.
    Brown going to Kenya to be Solicitor General of that colony. The Howes are Irish,
    full of tun. Brown, a bachelor of about 40, and a hard mouth—35 very pretty with
    light blue eyes and a hard mouth—returning to Kenya to her husband. Her parents
    were American—she was brought up in Africa on farms where leopards, were they
    dearly prone. Quick-witted, very brittle conversation. Dr. Dean Smith—young English
    doctor returning to his hospital in Hong Kong. Very agreeable and nice. Mr. Skidmore,
    one of the friend of the Howes—who is moving from West Africa to be her husband,
    a platoon sergeant with the Army in Kenya. She is very pretty, dark, and about
    28–25 yr old daughter. Hubbard by colonial official in West Africa—picture show
    him be very handsome fine-looking lad. A Mrs. Trompeter—English widow—husband
    is Dutch. She is now trying to get into the war zone to drive an ambulance or
