    And now to bed my darling—forgive me all the naughty thoughts? I love you.


    [Tuesday, 3 February 1942, morning, continued]


    Darling Isy, the moment there is one of those lulls where we don''t know what
    we are going to do or when—so I am trying to keep busy rather than gapping at
    bulletin boards the press news emphasizes that the British now realize the importance
    of Singapore and Rangoon to the war effort.


    It is a most unsatisfactory from many points of view. Our closest contact with
    the enemy was when two torpedoes passed under or close the ship during the first
    week of the war. Since then we have been close several times, but more often we
    have cruised or sat and watched and waited. The course of events indicates that
    soon we will be in some sort of real action. It is difficult to be all set for
    something and then not have it and we [i.e., the ships officers''] must be watchful
    of the effect on ourselves and the men.


    But darling, it does make so very difficult to write I think constantly of you
    and home with no mail having been received for two months I haven''t any idea
    as to what has been going on at. Night before last I dreamt that just as I got
    home after the war and was greeting you with the mail finally arrived.


    [8 PM, continued]


    The interruptions consisted of a conference, an air alarm, two shifts of anchorage
    and lot of general milling around. It is always interesting on sighting planes
    to doubt whether they are enemy or friendly.


    However, Isy, I have decided that I am not a very good time writer—this business
    of strange ports, foreign aliens and general uncertainty is definitely not fun.
    When we get into port we can''t relax and in most cases we are not anywhere anyway.
    So you must forgive me for my monotonous letters.


    The English always fight a very literary war with much emphasis on the gallantry
    of the defense, etc. There are many appreciative and encouraging comments.


    Well my old comparison about our country being like a group of men in a boat drifting
