    At the conclusion of the attack on the Marblehead, which normally drew about 16’
    forward, was drawing 28’ forward and steaming at high speed in circles. The Houston
    was hit once, her No. 3 turret was wiped out and the ship was saved only by one
    of the men, before dying, flooding the magazines. The Houston left formation,
    and disappeared at high speed with a very bad fire. The Trom and De Ruyter objects
    of the attack after the Houston and Marblehead were hit.


    Marblehead knocked down one plane which dove into the sea out of control attempting
    to land on [i.e., crash into] the Marblehead. I would judge that she hit the water
