    Camp John Hay, Baguio, P.I.


    My Darling,


    I know it is Saturday but I can''t remember nor for the date—(Incidentally

    this new paper is lousy!) Don Kneedles drove me up yesterday afternoon—his

    mother was very nice to us on our last trip—he has a charming wife and two

    beautiful and well trained kids about 4-6 years. His brother''s wife knew Juan
    Buckley in Chicago—and looks something like her.


    We arrived at 9 p.m. but I was very tired having slept at all Thursday

    night—so I couldn''t eat—so I tumbled into bed and though I woke frequently

    di did not stay awake long and morning at 8:00 I was beautifully refreshed.

    This week Manila has been sweltering, running from 90-95 every yesterday, it jumped
    up to 101. So to be in the 70-75 degree of Bagio is a wonderful relief and I am
    glad I have a whole week of it! I need it.

    My morale and nerves do not pretty well when I am busy, but the last week at sea

    very dull, my nerves get edgy and all in I felt very low and disgusted with myself.

    When I moved to the Club was much more comfortable—it was quite hot—

    knowing that I was coming here I didn''t really relax. The ship is doing well,

    t overhaul is well organized and the only reason I am only staying a week is that
    I\want to give the other officers a chance to come up for what they need just
    as much as I do. However, if things are stable I will try to get another week
    before July 1st.


    This will be an expensive month but it is the best investment I know—I should
    have a couple of small insurance dividends that I can send you but I don''t-believe
    I can for any of my own money till July because my Club will be big.


    This morning I played golf and enjoyed it greatly—after lunch I dove a bit and

    evening I [go] to the steak fry at the Club.


    Barbara Agnes has visiting the British consul general in Bagio for the last

    month but returned to Manila on the morning train so I missed her.

    It rains nearly every afternoon and now has clouded over and the sea

    blowing in a very threatening manner. The mornings are glorious! Charlie

    Weeks came up on the morning train so tomorrow we shall start our serious? ()
    golf.


    The little Igorote caddies are so nice—cheerful and smiling. This wholeindependence
