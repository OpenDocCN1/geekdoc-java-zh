  md: '28 TO THE JAVA SEA


    # 1942 DICTATION [CONTINUED]


    The Edwards was the last ship to get out of the basin and we had quite a catch-up
    with the other ships. Going out the east entrance was a difficult proposition
    because the water is so shallow, being between twelve to fourteen feet in many
    cases, and steering is extremely difficult.


    (20 Feb. 1942) We had to rendezvous a three miles south of Tafel Hoek at 01:30
    and were forced to maintain a speed of 28 knots to catch up with the Tromp, which
    was leading the column, and our other destroyers.


    The plan was to have a three wave attack, the first attack consisting of the Deuyter,
    Java, Piet Hein, and the American destroyers Ford and Pope, all under the command
    of Admiral Doorman, coming from Tjilatjap and striking the Japanese-further south
    at their landing point which was about opposite the island of Noesa Besar [Nusa
    Penida] off the coast of Bali.


    Our force was the second wave of this attack. We were to go through Madoera Strait,
    down Bali Strait, pass through the initial point at Tafel Hoek at 1:30 and then
    attack through Badeng Strait, circle Bali, and return to Soerabaja.


    Following us, there was supposed to be Dutch motor torpedo boats to make the third
    attack. We passed them in the strait as we came down the strait.


    About seven miles after the narrow part of the Bali Strait we were able to see
    the flashes of gunfire on the low south part of Bali. That was the Tjilatjap force
    striking. It was our first glimpse of surface engagement.


    We were all fine. I had explained the situation to the officers and emphasized
    that they were to be guided by general principles and not to expect any specific
    orders from the commanding officer. The experience of the 59th Division at Balikapan
    had shown that if one officer attempted to run the whole show in a night melee
    many opportunities to damage the enemy may be. I told the officers that something
    very unusual happened, gun fire was not to be opened until the torpedoes had been
    fired.


    We were not sure of the composition of the Japanese forces. We expected to see
    a large number of transports and I think a group of three or four cruisers and
    seven [?] destroyers.


    As we came down the Strait, the intensity of gun fire on the opposite side increased
    and several apparently caught fire. The first of these, we learned later, was
    the Destroyer, Piet Hein, which had gone into the fight with guns blazing before
    she had fired her torpedoes and very promptly got blown out of the water. The
    engagement continued with considerable intensity for some time and then broke
    off, and shortly after that we heard over our voice radio CDD


    3 Piet Hein, an Admirals-class destroyer commissioned in 1929, operated entirely
    in the NEI.


    4 There were four Japanese destroyers and two transports present.'
