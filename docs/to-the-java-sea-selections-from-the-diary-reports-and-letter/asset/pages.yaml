  md: '# ABOUT THE EDITORS


    John B. Hattendorf, DPhil, DLitt, LHD, FSNR, FRHists, is the emeritus Ernest J.
    King Professor of Maritime History at the U.S. Naval War College, Newport, Rhode
    Island. The E. J. King chair from August through September 2016. He was additionally
    chairman of the Maritime History Department and director of the Naval War College
    Museum from January 2003 until September 2016. Currently he is Senior Advisor
    of the Hattendorf Center for Maritime Historical Research, established in 2017
    by the Naval War College and so named to honor his more than fifty years of service
    to the College, the U.S. Navy, and the discipline of naval history. Dr. Hattendorf
    holds degrees in history from Kenyon College (1964), Brown University (1971),
    and the University of Oxford, where he completed his DPhil at Pembroke College
    in 1979. Oxford awarded him his higher doctorate, the Doctor of Letters degree
    (DLitt). On his retirement after thirty-nine years as a civilian professor, the
    Chief of Naval Operations presented him with the Naval Distinguished Civilian
    Service Award.


    Pelham G. Boyer, currently a volunteer research assistant to the Naval War College''s
    Hattendorf Historical Center, was managing editor of the Naval War College Press
    from 1991 to 2015, receiving upon his retirement a letter of commendation from
    the Secretary of the Navy. Commissioned in 1972 by the Naval Reserve Officers
    Training Corps at Cornell University, Ithaca, New York, where he earned a BA in
    American history; he became a surface warfare officer, serving at sea in a destroyer
    escort (later frigate), destroyer, destroyer squadron staff, and an oiler and
    on exchange duty as Refit Project Officer for the overhauls of two Canadian destroyers
    at Ship Repair Unit Atlantic, Halifax, Nova Scotia. He holds an MA (1983) in national
    security affairs (intelligence) from the Naval Postgraduate School in Monterey,
    California.'
