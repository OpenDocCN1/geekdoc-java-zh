    The way men react to this situation is wonderful. They are the finest on earth
    and it is thrilling to have them. I am making a practice of having a daily formal
    talk on the news with the men. That is for the purpose of making sure that facts
    and rumors are not confused and facts are not misinterpreted. Also when we go
    to sea, after leaving port, I tell them as much as possible about what we are
    to do and what to expect. They appreciate it too. I know that I will have their
    intelligent cooperation in all ways. They are grand and fully justify every bit
    of the faith I have always had.


    # 1942 DICTATION [CONTINUED]


    We spent the next few days perfecting our liaison with the British, bringing reinforcements
    to Singapore. However, on Sunday morning we got orders to sail immediately for
    Soerabaja¹ to join our forces, and now sheowed off and headed at high speed for
    Soerabaja.


    Previous to reaching Balikapan, I had a log in the Makassar Straits and damaged
    one propeller.¹ Therefore, on reaching Soerabaja I went alongside the Black Hawk
    immediately and for the next 48 hours we changed propellers.


    One interesting aspect while the ship was listed over [i.e., held, to lift the
    affected shaft out of the water] the log room [engineering department office]
    was flooded with fuel from a leaky manhole plate and most of the [machine operating]
    records of the ship were ruined. That saved us a lot of paperwork. Soerabaja was
    in a state of uncertainty, there was no coordinated system set. It was built down
    if the tenders would stay there.


    During the next week or days, a great many of the ships came in, drifting from
    various parts of the N.E.I. [Patrol Wing, reconnaissance airplanes] TEN came in
    and set up headquarters, but no smooth working organization was set up.


    No attacks were made on Soerabaja at the time and things were hot and quiet.


