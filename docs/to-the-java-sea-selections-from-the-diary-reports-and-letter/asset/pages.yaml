    # The Diary, Reports, and Letters of Henry E. Eccles, 1940–1942


    The three-year span between 1940 and 1942 was critical in Henry Eccles''s life
    and career. These years mark not only the beginnings of the direct involvement
    of the United States in World War II but also Eccles''s first warship command,
    the command that earned him high professional recognition–the Navy Cross and the
    Silver Star. The diary, reports, and letters assembled allow the modern reader
    an unusual opportunity to enter a very different world and a very different time
    in naval history. Here we meet a lieutenant commander in his early thirties, married,
    with a high-school-age son. Up to this point in his career, Henry Eccles specialized
    in mechanical engineering,'
