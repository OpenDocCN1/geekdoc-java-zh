    # LETTER TO MRS. ECCLES, THURSDAY, 6 MARCH 1941, 10 PM

    Nasugbu Bay, P.I. [see map]


    Dearestest,

    I have been rereading what I wrote earlier in the week. It is seriously written
    but it is what I would say I was sitting next to you talking. The point that means
    the most to me is that we have made up my mind to the future course of events
    I can really relax, and enjoy the pleasant things of life as I can find them—laugh
    a lot, and am cheerful. Of course I have periods of depression but they are only
    because I miss you ....


    The last two days have been very full and very interesting. Today we got in a
    lot of ship handling giving the younger officers experience and they did very
    well too. Tomorrow we go into Manila in the afternoon—I am having dinner with
    Wilfred Wooding, and the Agnews and Geoffrey Morrison¹; so I am looking forward
    to an interesting time. Wilfred started an interesting discussion last week on
    his philosophy of life and quoted some interesting pessimistic passages to Oswald
    Spengler—— one of the many philosophers whose works I have never read. I gave
    him Candle in the Dark² with a brief summary of my opinion of that. It seemed
    to think he would like it.


    # LETTER TO MRS. ECCLES, SUNDAY, 9 MARCH 1941, 8 AM

    Manila


    Sweetheart,

    I have just finished a nice breakfast and am looking forward to a nice lazy day.
    I found that we have gotten some poor poop on the Clipper and that it does not
    get in until tomorrow. I shall not hear from you until Tuesday, or Wednesday at
    Olongapo.


    Friday night was fun—just the five of us—a powerful phonograph in a big living
    room with a pleasant breeze sweeping through. Most of the music we Handel and
    Bach: we tried to keep up with the "Hallelujah Chorus" [from Handel''s Messiah]³
    ourselves but did not quite make the grade. We sang hymns during dinner and generally
    had a grand time. The arguments were discursive and developed many interesting
    points. In many ways it was a toned down version of the parties at 5 Bull Place⁴
    with the Stries, Taylors, Howards, Seward, etc. Actually,


