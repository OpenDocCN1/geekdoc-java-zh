    eleven had held up some cars on the same road for fifteen minutes. This morning
    I got a wire to the effect that my future transportation was quite involved and
    so I must reach Durban by Tuesday morning.


    Henry Dreyer is a fascinating person of 57. He is about 6 ft. 5" tall and weighs
    about 260 lbs. He is of Danish and Dutch descent and his family have lived in
    South Africa for many generations. He has lived an outdoor life and like so many
    of that type is essentially a simple-minded man of no subtlety, but better than
    he has a rugged integrity of character that has attracted people in all walks
    of life. He is fine-looking and acting. His hunting stories have been most interesting
