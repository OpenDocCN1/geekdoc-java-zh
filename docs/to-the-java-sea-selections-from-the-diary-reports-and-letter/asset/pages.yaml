  md: 'The fact that it hurts so much to be far apart is not nearly so bad as it is
    with some people who are living in the same house, the same room, and still can''t
    ever really talk to each other and understand. We are strained toward each other
    with thousands of miles separating our bodies, yearning for the physical presence
    that brings joy and comfort and fun there is nothing that really separates our
    true selves and we have happiness in the faith and knowledge of our love and its-intimate
    and enduring quality.


    ![](img/271a4dd38c17a5bcd4a1efde5be2dc47_247_0.png)


    On the other hand they can and probably do bring their bodies together without
    love, faith and the constant knowledge that it is all a tragic shame. Or else
    in an automatic barely manner that never stops to think or care whether it is
    sham or real. We are cherishing a precious living thing of beauty—they have a
    handful of dead damp ashes.


    The Dutch cruiser HNLMS Tromp (Destroyer Division 59 cruise book)


    # LETTER TO MRS. ECCLES, MONDAY, 9 FEBRUARY 1942, 9 PM


    My Dearest, Days of uncertainty and nights of quiet have been our routine. The
    weather has been beautiful—it seems so ironic to contrast the beauties of nature
    which are so evident here, with the nerve strain and other aspects of war. Possibly
    I have made a mistake in looking for and enjoying the beautiful things—they give
    me awful twinges when I think of the contrasts with the worst of war. Thank God
    that your beauty has the thing I have know and loved best.


    Marblehead''s damage, looking forward. (Destroyer Division 59 cruise book)


    I sometimes feel very detached from the immediate present, search-ing for answers—and
    they don''t come easily. Steadfast faith and devotion to duty are the only answers
    that are clear and they are the only things that can do me or any of us here or
    at home any good. The other answers are obscure. You know, of course, I can''t
    hide any of my feelings from you—words have never and can never take the place
    of the understanding that we have, nor can they or their omission cloud our


