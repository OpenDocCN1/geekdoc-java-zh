  md: 'another week. It is hard to write when I am waiting for word from you and when
    nothing much is happening here.


    [Saturday, 5 April 1941 (?), 10 AM, continued]

    We are alongside the tanker Pecos¹ and have finished fueling but we are waiting
    until the Whipple finishes his inspection before returning alongside [the pier].


    Last night was Van Zandt and Weeden (skipper of the Tarpon)² went with me to the
    Wolffs and we stayed till midnight bowling. Both Tom and Carol enjoyed the Sandburg
    records³ very much (I lent them a week ago) and they have ordered an album of
    them. Now have heard Carl Sandburg singing of the songs. We just got word to get
    away at once so I''ll finish later—


    ![](img/271a4dd38c17a5bcd4a1efde5be2dc47_134_0.png)


    [11 AM, continued]


    We are alongside the Whipple and there is nothing more to do until till Monday
    morning.


    Handling ship in the harbor, making landings, is tiring. I seldom do myself because
    I want the inexperienced officers to get the training and it is very hard to relax
    when everyone else is in close quarters, and when a green youngster is, it is
    nerve wracking. This meeting put a dent in the side but no serious damage was
    done—they don''t get good out of landings if I coach them, or so I am. However,
    before I leave the ship I will have some good ship handlers even though it adds
    a few more gray hairs!


    My disposition remains good, I have blown up only once in the last months and
    that was very short and snappy. But the hot flush of rage that sometimes swept
    over me in the Bureau of Engineering hasn''t occurred on the ship. That is due
    to the fact that I am really on so much of the time and therefore I don''t have
    to consult many superiors but barely satisfy the division commander and squadron
    commander. The thing that really wore me the most in [Washington] was trotting
    around trying to resolve conflicting points of view and trying to get decisions.
    Bill Lor is good for work because he is positive and making up his mind and does
    not hesitate saying no or badly done. Everything is frank and open and completely
    objective, no jockeying for prestige or possible inferior motives. We know where
    we stand.


