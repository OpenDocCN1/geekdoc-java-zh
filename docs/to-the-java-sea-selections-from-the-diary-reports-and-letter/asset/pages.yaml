    once to the Navy Yard and the rest of us went into Holland Basin and started fueling.


    LETTER TO MRS. ECCLES, 23 FEBRUARY 1942 [CONTINUED]


    It is 1010 a.m.—we had two alarms this morning but the bombers will really come
    in during the next hour. Seven miles upstream a large merchant ship is still burning
    furiously after being hit at the deck near us. It lasted all night.


    It is not a question of keeping the japs out—it is merely a question of how much
    we can do before we are wiped out. Without a doubt, we have delayed them greatly.
    What the United States says is to hit the japs elsewhere, I have no idea but sincerely
    feel that we have done our duty and met our share.


