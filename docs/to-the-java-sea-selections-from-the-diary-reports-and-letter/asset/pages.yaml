    On the way down the Strait we passed a few Dutch torpedo boats circling around
    waiting for us to go. We exchanged position with the Tromp and the see station
    for four or five miles away of us. We passed through our initial point of Tafel
    Hoek and headed up Badoeng Strait. From time to time we could see lights and searchlights
    of Japanese forces, the searchlights sweeping the area between Noesa Bering and
    Bali.


    ![](img/271a4dd38c17a5bcd4a1efde5be2dc47_258_0.png)


    We went up to the point where the Japanese were landing and, although we could
    see several fires close to the beach, possibly burning ships, they were of small
    intensity and did not show us any other ships.


    Finally we sighted two ships on the port bow the Stewart and Parrot fired torpedoes.
    The Edwards was the third in the column, I held fire because I could not see the
    target clearly enough to make accurate shooting possible. Shortly after the two
    leading ships fired their torpedo, guns battles started and from the flashes of
    searchlight beams we were able to distinguish several Japanese ships, apparently
    light cruisers or heavy destroyers. We fired torpedoes, incidentally having several
    fires from our batteries, which, I believe, were due to old primers.


    The gun fire was intense. The Japanese ships had searchlights on the Stewart and
    Parrot and I was able to see several straddles on each of those ships. However,
    most Japanese salvos seemed to be 100 to 200 yards either over or off our. The
    Edwards suffered little but no damage.


