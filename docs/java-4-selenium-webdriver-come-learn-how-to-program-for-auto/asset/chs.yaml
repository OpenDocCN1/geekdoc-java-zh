  \ 行使用 `private` 访问修饰符声明 `totalDays()`。这意味着只有 `English` 类内部的成员可以访问该方法。第 26 行和第 27\
  \ 行尝试调用 `totalDays()` 但无法，因为它们位于不同的类 `TwoEnglishCourses` 中。结果错误信息显示“method totalDays()\
  \ from Type English is not visible.”\n\n![](img/00018.jpeg)\n### 图 2.15 – 私有和公共变量\n\
  第 3 行将实例变量 `students` 声明为 `private`，而第 4 行将实例变量 `weeks` 和 `days` 声明为 `public`。注意第\
  \ 19–25 行，私有变量 `students` 发生了两个错误（“第 19 和 23 行”）。此外，第 27 和第 28 行存在一个错误，显示“English.students\
  \ is not visible”。私有变量仅对 `English` 类可见，对 `TwoEnglishCourses` 不可见。然而，公有变量对两个类都可见。以下是每个修饰符的访问级别：\n\
  \n| | public | protected | no modifier | private |\n| --- | --- | --- | --- | ---\
  \ |\n| Class | Yes | Yes | Yes | |\n| Package | Yes | Yes | No | |\n| Subclass |\
  \ Yes | No | No | |\n| World | Yes | No | No | No |\n\n### 图 2.16 – 访问修饰符\n\n`static`\
  \ 关键字可以应用于变量、方法、块和嵌套类。通常，类的成员是通过类的对象通过点运算符来访问的。当一个成员被声明为 `static` 时，可以在创建对象之前访问该成员。但是，访问静态成员时，最好用类名和点运算符跟在静态成员，而不是对象名和点运算符。如果使用对象名和点运算符引导静态成员，则会出现警告信息。以下是静态变量的语法和示例：\n\
  \n`ClassName.variableName`\n\n```java\nclass StaticAddNumbers {\n    static int\
  \ a;\n    int b;\n\n    int addNumbers () {\n        return a + b;\n    }\n}\n\n\
  class StaticExample {\n    public static void main(String[] args) {\n        StaticAddNumbers\
  \ objAdd = new StaticAddNumbers ();\n        objAdd.b = 50;\n        StaticAddNumbers.a\
  \ = 25;\n        System.out.println(\"The value of 'objAdd.b' is \" + objAdd.b);\n\
  \        System.out.println(\"The value of 'a' is \" + StaticAddNumbers.a);\n  \
  \      System.out.println(\"The total of 'a + b' is \" + objAdd.addNumbers() + \"\
  \\n\");\n        StaticAddNumbers.a = 30;\n        System.out.println(\"The value\
  \ of 'a' changed to \" + StaticAddNumbers.a + \" but the value of 'objAdd.b' remains\
  \ \" + objAdd.b);\n    }\n}\n```\n\n![](img/00019.jpeg)\n### 图 2.17 – 静态变量\n输出：\n\
  The value of 'objAdd.b' is 50\nThe value of 'a' is 25\nThe total of 'a + b' is 75\n\
  The value of 'a' changed to 30 but the value of 'objAdd.b' remains 50\n\n\n\n\n\
  第三章将讨论关于数组和字符串的内容：\n\n- 一维数组\n- 多维数组\n- For-Each 循环\n- 字符串\n\n# 一维数组\n\n一维数组是最常用的数组类型。它存储了一个相关值的列表，例如特定月份的每日气温。作为回报，这些值列表可以得出每月平均温度。存储在数组中的所有信息都可以通过索引轻松访问。以下是定义一维数组的两种语法：\n\
  \n## 语法\n\n```\narrType arrName[] = new arrType[arrSize];\n```\n或\n\n```\narrType\
  \ arrName[];\narrName = new arrType[arrSize];\n```\n\n| 参数 |  |\n| :--- | :--- |\n\
  | `arrType` | 决定数组中每个值的数据类型 |\n| `arrName` | 数组名称 |\n| `new` | 为数组分配内存 |\n| `arrSize`\
  \ | 数组中的值数量 |\n\n### 图 3.1 – 一维数组语法细节\n\n以下是一个一维数组的示例：\n\n```java\npublic class\
  \ OneDimensionalArray {\n    public static void main(String[] args) {\n        int\
  \ [] tempMay = new int [3];\n        tempMay[0] = 105;\n        tempMay[1] = 102;\n\
  \        tempMay[2] = 98;\n        System.out.println(\"The highest temperature\
  \ in May was \" + tempMay[0] + \" degrees\");\n        System.out.println(\"The\
  \ 2nd highest temperature in May was \" + tempMay[1] + \" degrees\");\n        System.out.println(\"\
  The 3rd highest temperature in May was \" + tempMay[2] + \" degrees\");\n    }\n\
  }\n```\n\n![](img/00020.jpeg)\n\n### 图 3.2 – 一维数组示例\n\n程序输出：\n```\nThe highest temperature\
  \ in May was 105 degrees\nThe 2nd highest temperature in May was 102 degrees\nThe\
  \ 3rd highest temperature in May was 98 degrees\n```\n\n- 第 5 行使用关键字 `new` 初始化数组\
  \ `tempMay`。方括号 `[3]` 中的数字 3 表示数组包含 3 个元素。\n- 第 7–9 行为数组的每个元素赋值。第一个值存储在索引位置 0 。零总是数组的起始位置。在本示例中，最后一个索引位置是\
  \ 2。元素 0–2 总共持有 3 个元素。\n\n数组可以在不使用 `new` 关键字的情况下在一行赋值。以下是给数组赋值的另一种方法：\n\n```java\n\
  public class OneDimensionalArray {\n    public static void main(String[] args) {\n\
  \        int[] tempMay = {105, 102, 98};\n        System.out.println(\"The highest\
  \ temperature in May was \" + tempMay[0] + \" degrees\");\n        System.out.println(\"\
  The 2nd highest temperature in May was \" + tempMay[1] + \" degrees\");\n      \
  \  System.out.println(\"The 3rd highest temperature in May was \" + tempMay[2] +\
  \ \" degrees\");\n    }\n}\n```\n\n![](img/00021.jpeg)\n\n### 图 3.3 – 另一种一维数组示例\n\
