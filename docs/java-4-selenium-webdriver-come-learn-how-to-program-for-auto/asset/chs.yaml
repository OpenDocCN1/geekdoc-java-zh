  * 第 8 行使用导入的类 `PackageTest` 创建一个对象 `objPackage`\n* 第 10 行调用方法 `printTest();`，该方法位于\
  \ `PackageTest` 类中。查看[图 5.2 - 包语句]查看该方法的详细信息。\n\n注意：可以使用包名加星号来导入特定包中的所有类：`import\
  \ packagename.*;`\n\n# Java 类库\n\nJava 类库被称为 Java 应用程序接口 (API)，它为程序员提供了一系列预写的类。每个预写类都通过提供实用的函数来支持程序的逻辑。其中名为\
  \ `java.lang` 的包会自动导入到所有程序中。因此，当使用 `print()` 和 `println()` 方法显示信息时，会自动使用 `System`\
  \ 等类。根据 [Oracle](https://docs.oracle.com/javase/7/docs/api/)，以下显示了许多 Java 类库中的四个：\n\
  \n* `java.lang` – 提供对 Java 编程语言设计的类。\n* `java.io` – 通过数据流、序列化和文件系统提供系统输入输出。\n* `java.math`\
  \ – 提供执行任意精度整数算术 (`BigInteger`）和任意精度小数算术 (`BigDecimal`）的类。\n* `java.sql` – 提供使用\
  \ JavaTM 编程语言访问和处理存储在数据源（通常是关系型数据库）中的数据的 API。\n\n注意：包 `java.lang` 包含一个 `math` 类，它与包\
  \ `java.math` 不同。`java.lang` 中的 `math` 类包含执行基本数值操作的方法。\n\n第 5 章描述了 Java 中的包。每个包包含一组相关的类。通过包名访问这些类。为了让一个类利用另一个类的成员，必须在程序中放置导入语句。第\
  \ 6 章将介绍接口，接口是一组相关的方法。\n\n# 第 6 章\n\n## 接口\n\n接口是相关方法的集合。接口可以类类，包含变量和方法。但默认情况下，接口的变量被声明为\
