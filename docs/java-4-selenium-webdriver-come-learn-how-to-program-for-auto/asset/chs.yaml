  \ {\n            for (column = 0; column < 3; column++) {\n                testDimension[row][column]\
  \ = row * 3 + 1;\n                System.out.print(testDimension[row][column] +\
  \ \" \");\n            }\n            System.out.println();\n        }\n    }\n\
  }\n```\n\n![](img/00023.jpeg)\n\n### 图 3.5 – 二维示例\n\n程序输出：\n```\n1 2 3\n4 5 6\n\
  ```\n\n- 第 7 行使用关键字 `new` 初始化二维数组 `testDimension`。两个括号表示有两个维度，类似于行和列。\n- 注意输出总共有两行三列。第\
  \ 9 行表示行的计数，第 1 行表示列的计数。\n- 第 13 行计算通过 6 的值。\n- 第 14 行打印出通过 6 的值。\n\n与一维数组类似，二维数组可以在不使用\
  \ `new` 关键字的情况下声明并初始化。以下是一个没有使用初始化关键字 `new` 的二维数组示例。\n\n```java\npublic class TwoDimensionalArray\
