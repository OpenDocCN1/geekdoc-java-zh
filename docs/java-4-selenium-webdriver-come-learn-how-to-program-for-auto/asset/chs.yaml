  *   第 22 行和第 25 行创建了对象 `objBinding` 和 `objBindingExtend`\n*   第 23 行和第 26 行是动态绑定发生的地方。两次调用都是针对同一个方法名\
  \ `printClassName()`，但在不同的类（父类和子类）中。对象 `objBinding` 和 `objBindingExtend`\n\n## 抽象\n\
  \n抽象适用于类。关键字 `abstract` 用于定义不完整的类。抽象类不能被实例化。`abstract` 的目的是为子类提供一个模板。\n\n`abstract`\
  \ 关键字用于定义没有体的方法。以下是抽象类的语法：\n\n```java\nabstract class ClassName {\n    abstract\
  \ void methodName();\n}\n```\n\n## Final\n\n`final` 关键字用于防止修改。当应用于变量时，它会变成一个常量。当应用于方法时，它不能被重写。当应用于类时，它会防止继承。\n\
  \n## 继承\n\n继承是一种一个类获取另一个类的属性和行为的机制。它允许代码重用和方法重写。\n\n## 包\n\n包是相关类的集合。它像文件夹一样，用于组织代码并防止命名冲突。在\
  \ Java 中，你可以在源文件的顶部使用 `package` 语句来定义包。\n\n```java\npackage packagename;\n```\n\n\
