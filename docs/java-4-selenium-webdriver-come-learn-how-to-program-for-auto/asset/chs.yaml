  \n# For-Each 循环（增强 for 循环）\n\nfor-each 循环（被称为增强 for 循环）旨在用于遍历对象集合（如数组）。这种控制结构提供的功能与\
  \ `for` 循环相同（参见第 4 章 - (Part 1) Java 4 Selenium WebDriver 中的控制结构），它们都执行执行特定次数迭代的代码块。然而，for-each\
  \ 循环在遍历集合中的每个元素时执行代码块。以下是 for-each 循环的语法：\n\n## 语法\n```java\nfor (collType itrVariable:\
  \ collection)\n{\n  statement(s)\n}\n```\n\n### 语法细节\n\n| 参数 | 说明 |\n| :--- | :---\
  \ |\n| collType | 指代集合的数据类型 |\n| itrVariable | 指迭代变量的名称，它在每次迭代后接收每个元素 |\n| collection\
  \ | 要进行遍历或循环的集合（如数组） |\n| statement(s) | 将执行的代码块 |\n| { … } | 开始和结束的大括号 |\n\n###\
  \ 图 3.9 – For-Each 循环语法细节\n\nfor-each 循环中的所有元素都被检索并存储在 `itrVariable` 中。循环不断重复，直到所有元素按索引顺序被读取。重要的是，`colltype`\
  \ 必须与对象的类型相同。在数组的情况下，`collType` 必须与 `arrType` 的类型相同。以下是 for-each 循环的示例：\n\n```java\n\
  public class ForEachLoop\n{\n public static void main(String[] args)\n    {\n  \
  \   double[] costPerItem = {12.34, 56.78, 99.99};\n     double totalCost = 0;\n\
  \     for (double i: costPerItem)\n     {\n      System.out.println(\"The cost is\
  \ \" + i);\n      totalCost = totalCost + i;\n     }\n     System.out.println(\"\
  \\n\" + \"The total cost of all items is \" + totalCost);\n  }\n}\n```\n\n![](img/00027.jpeg)\n\
  ### 图 3.10 – For Each 循环示例\n\n程序输出：\n```\nThe cost is 12.34\nThe cost is 56.78\n\
  The cost is 99.99\nThe total cost of all items is 169.11\n```\n\n*   第 5 行和第 6 行初始化并为数组\
  \ `costPerItem` 和 `totalCost` 赋值\n*   第 8 行检索数组 `costPerItem` 中的每个元素 (12.34, 56.78,\
  \ 99.99)\n*   第 10 行打印每个元素\n*   第 11 行计算所有元素的总和\n\n注意：第 8 – 11 行可以读为：“对于 `costPerItem`\
  \ 数组中的每个 double 类型数据，打印每个元素并计算所有元素的总和”。\n\n## 二维数组迭代\n\n二维数组的迭代操作与单维数组类似。二维数组的迭代变量必须引用单维数组。它必须引用单维数组是因为二维数组被视为“数组的数组”。因此，每次二维数组迭代都会检索下一个数组。以下是二维数组迭代的示例：\n\
  \n```java\npublic class ForEachLoop\n{\n public static void main(String[] args)\n\
  \    {\n     int totalCost = 0;\n     int[][] costPerItem =\n     {\n      {5, 10},\n\
  \      {5, 20},\n      {5, 30}\n     }; for (int i[]: costPerItem)\n     {\n   \
  \   for (int j: i)\n      {\n         System.out.println(\"The cost is \" + j);\n\
  \         totalCost = totalCost + j;\n      }\n     }\n     System.out.println(\"\
  \\n\" + \"The total cost of all items is \" + totalCost);\n  }\n}\n```\n\n![](img/00028.jpeg)\n\
  ### 图 3.11 – 二维数组迭代\n\n程序输出：\n```\nThe cost is 5\nThe cost is 10\nThe cost is 15\n\
  The cost is 25\nThe cost is 30\nThe total cost of all items is 105\n```\n\n*   第\
  \ 5 行初始化 `totalCost` 并赋值为零“0”\n*   第 6 – 11 行初始化并为二维数组 `costPerItem` 赋值\n*   第 13\
  \ 行 `for (int i[]: costPerItem)` 引用单维数组，每次迭代从头到尾检索 `costPerItem` 中的下一个数组（“从索引 0\
  \ 到索引 5”）\n*   第 15 行 `for (int j: i)` 循环每个元素\n\n## 数组搜索\n\n数组可以被检索以获取特定值。有时需要从集合中获取某个值。以下示例展示了如何从数组中检索特定值：\n\
  \n```java\npublic class ForEachLoop\n{\n public static void main(String[] args)\n\
  \    {\n     int specificCost = 20;\n     int[][] costPerItem =\n     {\n      {5,\
  \ 10},\n      {5, 20},\n      {5, 30}\n     }; for (int i[]: costPerItem)\n    \
  \ {\n      for (int j: i)\n      {\n         if (j == specificCost)\n         {\n\
  \          System.out.println(\"The specific cost of \" + specificCost + \" was\
  \ located in the collection of values\");\n         }\n      }\n     }\n  }\n}\n\
  ```\n\n![](img/00029.jpeg)\n### 图 3.12 – 搜索二维数组\n\n程序输出：\n```\nThe specific cost\
  \ of 20 was located in the collection of values\n```\n\n*   第 5 行为变量 `specificCost`\
  \ 赋值 20\n*   第 6 – 11 行初始化并为二维数组 `costPerItem` 赋值\n*   第 13 行 `for (int i[]: costPerItem)`\
  \ 引用单维数组，每次迭代从头到尾检索 `costPerItem` 中的下一个数组（“从索引 0 到索引 5”）\n*   第 15 行 `for (int j:\
  \ i)` 循环每个元素\n*   第 17 行通过变量 `specificCost` 搜索二维数组中的特定元素“20”\n\n# Strings\n\n字符串是一种不可变字符序列的数据类型。这种数据类型被视为对象，因此在\
  \ (Part 1) Java 4 Selenium WebDriver 中与其他数据类型一起并没有讨论。创建字符串有两种方法：\n\n1.  字符串字面量\n\
  2.  使用 `new` 关键字创建字符串\n\n以下是字符串字面量的示例：\n\n```java\npublic class StringObject\n{\n\
  \ public static void main(String[] args)\n    {\n     String firstName = \"Rex\"\
  ;\n     String lastName = \"Jones\";\n     System.out.println(\"Strings are placed\
  \ within quotation marks\");\n     System.out.print(\"The first name is \" + firstName\
  \ + \" and last name is \" + lastName + \".\");\n     System.out.println(\" Both\
  \ names were declared and initialized as strings. A sequence of characters\");\n\
  \  }\n}\n```\n\n![](img/00030.jpeg)\n### 图 3.13 – 字符串示例\n\n程序输出：\n```\nStrings are\
  \ placed within quotation marks\nThe first name is Rex and last name is Jones. Both\
  \ names were declared and initialized as strings. A sequence of characters\n```\n\
  \n*   第 5 行和第 6 行声明并初始化字符串数据类型\n*   第 8 – 10 行在 `println` 方法中显示字符串字面量\n\n\n\n\n\
  字符串像其他对象一样，可以使用关键字 `new` 调用 `String` 构造函数来创建。以下是使用 `new` 关键字创建 `String` 的示例：\n\n\
  ```java\nString name = new String (\"Rex Jones\");\n```\n\n## 字符串操作\n\n在 Java 中，有一个\
  \ `String` 类，其中包含许多用于操作的方法。以下是 Eclipse 中几个 `String` 方法的截图：\n\n![](img/00031.jpeg)\n\
  ### 图 3.14 – 字符串方法\n\n* 第 7 行在变量 `name` 之后输入一个点后，会显示方法列表\n* 当高亮特定方法 `equals` 时，会显示该方法的描述\n\
  \n以下是常用的 `String` 方法、其数据类型和描述：\n\n1. `charAt (int index)`: `char` - 返回指定索引处的字符\n\
  2. `compareTo (str)`: `int` - 如果调用字符串小于 `str`，则返回负数；如果调用字符串大于 `str`，则返回正数；如果字符串相等，则返回零\n\
  3. `concat (String str)`: `String` - 将给定的字符串连接到字符串的末尾\n4. `equals (Object anObject)`:\
  \ `boolean` – 将字符串与特定对象进行比较\n5. `equalsIgnoreCase (String string)`: `boolean` -\
  \ 比较字符串并忽略大小写\n6. `indexOf (String str)`: `int` - 返回指定子字符串首次出现的索引\n7. `lastindexOf\
  \ (String str)`: `int` - 返回字符串最后一次出现的索引\n8. `length()`: `int` - 返回字符串的长度\n9. `replace\
  \ (char oldChar, char newChar)`: `String` - 在更改所有旧字符串出现的地方后返回新字符串\n10. `split (String\
  \ regex)`: `String[]` - 分割字符串并返回匹配给定正则表达式的字符串数组\n11. `toLowerCase()`: `String` -\
  \ 将 `String` 中的所有字符转换为小写\n12. `toUpperCase()`: `String` - 将 `String` 中的所有字符转换为大写\n\
  13. `trim()`: `String` - 返回字符串的副本，并删除了原始字符串开头和结尾的空白字符\n\n字符串数据类型不能与不同的数据类型结合进行乘法、减法或除法等操作。例如，值为“534000.00”的字符串看起来是一个数值，但除非使用类型包装类\
  \ 转换字符串，否则字符串不允许数学运算。值“534000.00”类似于 `double` 数据类型。然而，如果与 double 数据类型结合，将会发生错误。以下示例显示了当字符串数据类型与减法运算符结合时产生的错误：\n\
  \n```java\npublic class StringObject {\n    public static void main(String[] args)\
  \ {\n        String grossIncome = \"534000.00\";\n        double gross = 534000.00;\n\
  \        double taxes = 225000.00;\n        double netIncome;\n        netIncome\
  \ = grossIncome - taxes;\n        netIncome = gross - taxes;\n        System.out.println(\"\
  The net income is \" + netIncome);\n    }\n}\n```\n\n![](img/00032.jpeg)\n### 图\
  \ 3.15 – 因数学运算导致的字符串错误\n\n* 第 5 行声明并初始化了字符串值“534000.00”\n* 第 10 行显示错误，因为字符串不允许数学运算。然而，注意第\
  \ 11 行没有显示错误，因为变量 `gross` 和 `taxes` 都被声明为 double 数据类型“第 6 和第 7 行”\n\n## 类型包装类\n\n\
  类型包装类用于将字符串转换为原始类型（`byte`、`double`、`float`、`integer`、`long`、`short`）。因此，之前显示字符串值“534000.00”错误的示例可以转换为数字。类型包装类用于封装原始类型。以下是当指定字符串为“534000”时返回\
  \ `double` 的示例：\n\n```java\npublic class StringObject {\n    public static void\
  \ main(String[] args) {\n        String grossIncome = \"534000.00\";\n        double\
  \ taxes = 225000.00;\n        double netIncome;\n        netIncome = Double.parseDouble(grossIncome)\
  \ - taxes;\n        System.out.println(\"The net income is \" + netIncome);\n  \
  \  }\n}\n```\n\n![](img/00033.jpeg)\n### 图 3.16 – 读取字符串值后返回 Double\n\n程序输出：The net\
  \ income is 309000.00\n* 第 5 行声明并初始化了字符串值“534000.00”\n* 第 9 行解析（也称为读取）字符串 `grossIncome`\
  \ 然后返回一个 double 数据类型。之后，从 `grossIncome`“534000”中减去变量 `taxes`“225000”，并将值赋值给 `netIncome`\n\
  \n以下是转换字符串数据类型的包装类列表：\n\n| 包装类 | 方法 |\n| :--- | :--- |\n| Double | `Double.parseDouble(string)`\
  \ |\n| Float | `Float.parseFloat(string)` |\n| Long | `Long.parseLong(string)` |\n\
  | Integer | `Integer.parseInt(string)` |\n| Short | `Short.parseShort(string)` |\n\
  | Byte | `Byte.parseByte(string)` |\n\n### 图 3.17 – 包装类\n\n类型包装类用于将字符串转换为原始类型（`byte`、`double`、`float`、`integer`、`long`、`short`）。因此，之前显示字符串值“534000.00”错误的示例可以转换为数字。类型包装类用于封装原始类型。以下是当指定字符串为“534000”时返回\
  \ `double` 的示例（见上文）。\n\n第 3 章解释了数组和字符串，它们是对象。数组是具有相同值的集合。继承允许代码和对象的用。\n\n## 继承\n\
  \n继承是面向对象编程中的一个重要基础。它允许向现有类添加功能，从而避免了重复编写相同的代码。子类继承父类的所有成员。被继承的类被称为子类。另一种看待父类和子类的方法是将父类看作父亲，将子类看作孩子。\n\
  \n为了让子类继承父类，必须在类声明中使用 `extends` 关键字。`extends` 意味着子类将扩展父类。子类不允许继承多个父类。然而，子类允许成为另一个子类的父类。作为结果，额外的子类继承了每个父类的成员。以下是子类继承父类的语法：\n\
  \n```java\nclass SubClassName extends SuperClassName {\n    // 类体\n}\n```\n\n以下是子类继承父类的示例：\n\
  \n```java\nclass School {\n    int numTeachers;\n    int numStudents;\n    void\
  \ showNumberOfPeople() {\n        System.out.println(\"There are \" + numTeachers\
  \ + \" teachers and \" + numStudents + \" students\");\n    }\n}\n\nclass ElementarySchool\
  \ extends School {\n    String principalName;\n    int totalTeacherStudents() {\n\
  \        return numTeachers + numStudents;\n    }\n    void displayPrincipal() {\n\
  \    }\n}\n```\n\n\n\n\n```java\nSystem.out.println(\"The principal name is \" +\
  \ principalName);\n    }\n}\n\nclass SchoolDistrict {\n    public static void main(String[]\
  \ args) {\n        ElementarySchool BishopHeights = new ElementarySchool();\n  \
  \      ElementarySchool AltaMesa = new ElementarySchool();\n        BishopHeights.numTeachers\
  \ = 10;\n        BishopHeights.numStudents = 130;\n        BishopHeights.principalName\
  \ = \"Joe Doe\";\n        System.out.println(\"My elementary school is Bishop Heights\
  \ \\n\");\n        BishopHeights.displayPrincipal();\n        BishopHeights.showNumberOfPeople();\n\
  \        System.out.println(\"Therefore the total of teachers and students is \"\
  \ + BishopHeights.totalTeacherStudents());\n    }\n}\n```\n\n![](img/00034.jpeg)\n\
  \n### 图 4.1 – 子类继承父类的示例\n\n程序输出：\n```\nMy elementary school is Bishop Heights\n\
  The principal name is Joe Doe\nThere are 10 teachers and 130 students\nTherefore\
  \ the total of teachers and students is 140\n```\n\n*   第 1 行显示了父类 `School`\n* \
  \  第 11 行使用关键字 `extends` 创建了子类 `ElementarySchool`，该子类继承了父类 `School`\n*   第 17 行利用了父类的变量\
  \ `numTeachers` 和 `numStudents`\n*   第 29 行和 30 行显示了两个对象 `BishopHeights` 和 `AltaMesa`\n\
  *   第 32 行和 33 行将值 `10` 和 `130` 赋值给从父类 `School` 继承的变量 `numTeachers` 和 `numStudents`\n\
  *   第 34 行将值 `Joe Doe` 赋值给变量 `principalName`，该它是子类 `Elementary School` 的成员\n\n子类\
  \ `ElementarySchool` 是父类 `School` 的一种类型。更多的子类（如 `HighSchool`、`University` 等）也可以继承父类\
  \ `School`。`ElementarySchool` 类继承了 `School` 类的所有成员，然后添加了一个变量 `principalName` 以及两个方法\
  \ `totalTeacherStudents` 和 `displayPrincipal`。注意看第 30 行创建了一个未被使用的对象。这表明可以创建更多的 `Elementary\
  \ School` 对象来访问父类 `School` 的成员。\n\n注意：来自父类的对象并不了解子类的信息。因此，父类无法访问子类。\n\n### 父类对象\n\
  父类 `Object` 是所有类的最高父类。换句话说，在 `Object` 父类之上没有父类。默认情况下，`Object` 父类包含了所有子类继承的方法。以下截图显示了在创建新类时\
  \ `java.lang.Object` 默认作为父类：![](img/0035.jpeg) 图 4.2 – Eclipse 类创建\n\n### 继承成员\n\
  从父类继承的私有成员在子类中仍然是私有的。因此，子类无法访问私有成员。变量和方法只能由所属类内部的代码访问。尽管如此，可以使用访问器方法（accessor methods）访问私有成员。\n\
  \n### 父类和子类构造函数\n父类和子类包含各自类的构造函数。因此，构造函数是相互独立的。父类无法访问子类的构造函数，但子类可以访问父类的构造函数。子类通过使用关键字\
  \ `super` 调用父类的构造函数。以下是子类调用父类构造函数的语法：`super(parameter-list)`。以下是子类继承父类的示例：\n\n```java\n\
  class School {\n    private int numTeachers, numStudents;\n    School(int t, int\
  \ s) {\n        numTeachers = t;\n        numStudents = s;\n    }\n    int getTeachers()\
  \ { return numTeachers; }\n    int getStudents() { return numStudents; }\n    void\
