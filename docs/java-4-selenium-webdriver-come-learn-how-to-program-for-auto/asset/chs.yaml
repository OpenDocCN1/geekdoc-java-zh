  2. 30 天内掌握 QTP/UFT 的 3 个技巧\n[`tinyurl.com/3-Tips-For-QTP-UFT`](http://tinyurl.com/3-Tips-For-QTP-UFT)\n\
  3. 免费网络研讨会、视频和直播培训\n[`tinyurl.com/Free-QTP-UFT-Selenium`](http://tinyurl.com/Free-QTP-UFT-Selenium)\n\
  \n\n\n# 前言\n\n根据 [TIOBE](http://www.tiobe.com/tiobe_index)，`Java` 是编程社区中最流行的编程语言。因此，`Java`\
  \ 是学习自动化应用领域中一门很棒的语言。要在自动化项目中高效工作，掌握一套核心的 `Java` 知识是必要的。第二部分——`Java 4 Selenium WebDriver`\
  \ 提供了核心的 `Java` 知识以及涉及继承、包等许多概念。\n\n## 目标读者\n\n目标读者群是具备变量、数据类型、操作符、分支和循环知识的程序员。如果个人需要建立\
  \ `Java` 基础，建议阅读第一部分——`Java 4 Selenium WebDriver`。\n\n## 目的\n\n本书的目的不是用成百上页关于 `Java`\
  \ 的内容（即信息过载）让你感到压力。相反，它将提供简洁且具有直接定义、示例和图表的价值信息。在读完第二部分——`Java 4 Selenium WebDriver`\
  \ 后，你将对 `Java` 和面向对象编程有深入理解。\n\n# 关于作者\n\n![](img/00002.jpeg)\n\nRex Jones II 是一位\
  \ QA/软件测试人员，热于分享测试知识。自 2005 年 2 月以来，他一直在观看网络研讨会、参加会议并测试应用程序。Jones 先生于 1999 年 6 月毕业于德瑞大学（DeVry\
  \ University），获得计算机信息系统（CIS）科学学士学位。\n\n目前，Rex 是达拉斯/沃特沃斯水星用户组（DFWMUG）的高级顾问和前董事，以及达拉斯/沃特沃斯质量保证协会（DFWQAA）的成员。除了用户组成员身份外，他还是一名认证软件测试工程师（CSTE），并持有测试管理方法（TMap）认证。\n\
