  \n## 致谢\n\n我想感谢我的妻子 Tiffany、孩子们 Olivia Rexe’ 和 Rex III、编辑 Samantha Mann、我的家人、朋友以及许多提供鼓励的人。撰写这本书花费了大量时间，你们的支持帮助了这本书的向前发展。\n\
  \n感谢，\n\n![](img/00003.jpeg)\n\nRex Allen Jones II\n\n# 第一章\n\n## 面向对象编程\n\n面向对象编程（OOP）是编程领域中最流行的范式。它是一种以对象为中心的编程方法。因此，识别对象是\
  \ OOP 中核心的原则之一。根据 [dictionary.com](http://www.dictionary.com/browse/object?s=t)，对象是任何可见或可触及的事物。因此，对象可以是人、地点或事物，其在编程中的识别方式就像现实世界中一样。所有对象都有两个特征：状态和行为。状态标识对象，而行为代表对象的操作。\n\
  \n第一章通过提供对本书“第二部分 – Java 4 Selenium WebDriver”的概述，强调了面向对象编程（OOP）：\n\n* 类、对象和方法\n\
  * 数组和字符串\n* 继承\n* 包\n* 接口\n* 错误、异常与调试\n* 利用输入和输出\n\n## 类、对象和方法\n\nJava 是一种面向对象编程（OOP）语言，包含类、对象和方法（参见第二章中的类、对象和方法）。类是创建对象的蓝图，方法为对象执行任务。类包含数据以及操作这些数据的代码。对象是\
  \ OOP 的基础，而方法执行操作。方法的责任是指示程序执行什么操作以及如何执行该操作。\n\n## 数组和字符串\n\n在 Java 中，数组和字符串都是对象（参见第三章中的数组和字符串）。数组是一组具有相同数据类型、相同名称和固定数量值的相关变量。数组中的所有项都通过从零开始的索引访问。另一方面，字符串是一组不可更改的字符。字符串提供了许多方法，方便对对象进行操作。\n\
  \n## 继承\n\n继承是一种层次概念，允许代码和对象的重用（参见第四章中的继承）。每个类允许其他类继承其代码。因此，类之间的关系是父类和子类。父类是父亲类，子类是子类。这些类在保持独特特征的同时，保留某些共同的数据。\n\
  \n## 包\n\n包是相关类的集合（参见第五章中的包\n\n# 利用输入和输出\n\nJava 输入/输出（I/O）是一个包含许多类、接口和方法的庞大系统（参见第八章中的利用输入和输出）。信息从输入源读取并写入输出。程序通过流执行输入输出，流代表数据。Java\
  \ 中的文件被存储和组织。大多数文件采用树形结构。树的顶部是根节点，它包含文件夹和文件。所有文件夹和文件在树中都有独特的路径。\n\n# 第二章\n\n面向对象编程（OOP）是一种以对象为核心进行构建的编程语言。类、对象和方法是\
  \ OOP 中相互关联的基础。对象（part0000_split_018.html__Objects）是任何可见或可感知的事物。然而，类（part0000_split_017.html__Classes）是对象的模板，而方法（part0000_split_019.html__Methods）提供了从程序各个组件与类（part0000_split_017.html__Classes）交互的可能。\n\
  \n\n\n\n\n数据以及操作该数据的代码（称为语句）是对象的两个合并的概念。因此，这两个合并的概念允许了一种名为“信息隐藏”的概念，通过这种方式可以隐藏数据。因此，默认情况下，对象的数据只能通过持有该对象的方法访问。受限制的访问防止了其他程序组件的干扰并导致错误。如果另一个组件想要更改对象的数据，该组件必须调用一个公开访问的方法。以下是四种类型的方法：\n\
  \n1. `Instance`（实例） – 可由对象访问的方法\n2. `Class`（类） – 类中所有对象共享的方法\n3. `Main`（主） – 用于运行应用程序的特殊方法。Selenium\
  \ WebDriver 不需要这种类型的方法。\n4. `Constructor`（构造函数） – 用于初始化特定类对象的特殊方法\n\n方法和变量被标记为类的成员，因为它们构成了该类。对这两个成员的访问由四种修饰符控制：\n\
  \n1. `public`（公共） – 允许访问定义在其 `class` 外部代码的修饰符\n2. `private`（私有） – 允许访问其 `class`\
  \ 内部其他成员的修饰符\n3. `no modifier`（无修饰符） – 允许访问其 `package` 内部所有 `classes` 的修饰符\n4. `protected`（保护）\
  \ – 允许在其 `package` 内部以及所有 `subclasses` 中访问的修饰符\n\n通常，类的成员通过其类内部的对象进行访问。然而，关键字 `static`\
  \ 允许在类中创建任何对象之前访问成员。当关键字放置在成员前面时，方法和变量被声明为 `static`。\n\n第二章将解释关于类、对象和方法的以下内容：\n\n\
  * `Classes`（类）\n* `Objects`（对象）\n* `Methods`（方法）\n* `This Keyword`（this 关键字）\n*\
  \ `Annotations`（注解）\n* `Access Modifiers`（访问修饰符）\n* `Static Keyword`（static 关键字）\n\
  \n## Classes\n\n类定义了数据以及操作数据的代码。数据由变量表示，代码由方法表示。变量和方法都是类的成员。因此，类是一个定义对象结构的模板。因此，类的结构必须是精确的。由一个逻辑实体构成的类才是完整的。用逻辑连接的信息来定义类是非常重要的。例如，一个包含英语课程信息的类不应该包含关于学校学区限速的无关信息。\n\
  \n大多数现实世界的类包含一个实例变量和一个操作该实例变量的方法。记住第一本书《(Part 1) 绝对初学者：Java 4 Selenium WebDriver》：实例变量声明在类内部、方法外部。因此，实例变量的值对于每个对象来说都是唯一的。这种类型的变量可以在初始化之前或之后使用，并且对类中的所有方法可见。以下是定义类的语法：\n\
  \n### Syntax\n\n```\nclass ClassName\n{\n    // Declare Instance Variable\n    variableType\
  \ variableName1;\n    variableType variableName2;\n    variableType variableNameN;\n\
  \n    // Declare Methods\n    methodType methodName1 ()\n    {\n        // Body\
  \ of the Method\n    }\n    methodType methodName2 ()\n    {\n        // Body of\
  \ the Method\n    }\n    methodType methodNameN ()\n    {\n        // Body of the\
  \ Method\n    }\n}\n```\n\n## Objects\n\n面向对象编程 (OOP) 构建在对象之上。关键字 `static` 允许在类中创建任何对象之前访问成员。当关键字放置在成员前面时，方法和变量被声明为\
  \ `static`。\n\n方法和变量被标记为类的成员，因为它们构成了该类。对这两个成员的访问由四种修饰符控制：\n\n1. `public`（公共） – 允许访问定义在其\
  \ `class` 外部代码的修饰符\n2. `private`（私有） – 允许访问其 `class` 内部其他成员的修饰符\n3. `no modifier`（无修饰符）\
  \ – 允许访问其 `package` 内部所有 `classes` 的修饰符\n4. `protected`（保护） – 允许在其 `package` 内部以及所有\
  \ `subclasses` 中访问的修饰符\n\n通常，类的成员通过其类内部的对象进行访问。然而，关键字 `static` 允许在类中创建任何对象之前访问成员。当关键字放置在成员前面时，方法和变量被声明为\
  \ `static`。\n\n### Creating and Access Objects（创建和访问对象）\n\n以下是一个名为 `English` 的仅包含数据的类示例：\n\
  \n```\nclass English\n{\n    int students;\n    int weeks;\n    int days;\n}\n```\n\
  \n图 2.1 – Data Only（仅数据）\n\n以下是创建并访问对象的示例：\n\n```\nclass English\n{\n    int students;\n\
  \    int weeks;\n    int days;\n}\n\nclass OneEnglish\n{\n    public static void\
  \ main (String args[])\n    {\n        English ENG101 = new English ();\n      \
  \  int totalDays;\n        ENG101.students = 10;\n        ENG101.weeks = 4;\n  \
  \      ENG101.days = 3;\n        totalDays = ENG101.weeks * ENG101.days;\n     \
  \   System.out.println(\"The English 101 course is a total of \" + totalDays + \"\
  \ days\");\n    }\n}\n```\n\n图 2.2 – Create New Object and Access Variables（创建新对象并访问变量）\n\
  \n程序输出：\nThe English 101 course is a total of 12 days\n\n第 12 行通过两个步骤创建一个新对象（`English\
  \ ENG101 = new English ();`）。根据《Java A Beginner’s Guide 第 2014），这两个步骤可以重写如下，以显示每个步骤：\n\
  \n1. `English ENG101;` – 赋值左侧声明了一个类型为 `English` 的变量 `ENG101`。\n2. `ENG101 = new\
  \ English ();` – 赋值右侧创建了对象的副本，并赋予 `ENG101` 该对象的引用。\n\n使用点运算符 `.` 的语法为：\n\n```\n\
  objectName.MemberName\n```\n\n点运算符连接对象与成员（实例变量或方法）。在这个示例中，对象名（`ENG101`）位于左侧，实例变量（`students`,\
  \ `weeks`, `days`）位于右侧。对象持有类定义的实例变量副本。因此，如果存在多个对象，每个对象的值可以与其他不同。以下示例说明了两个对象（`ENG101`\
  \ 和 `ENG202`）的创建：\n\n```\nclass English\n{\n    int students;\n    int weeks;\n\
  \    int days;\n}\n\nclass TwoEnglishCourses\n{\n    public static void main (String\
  \ args[])\n    {\n        English ENG101 = new English ();\n        English ENG202\
  \ = new English ();\n        int totalDays101;\n        int totalDays202;\n\n  \
  \      ENG101.students = 10;\n        ENG101.weeks = 4;\n        ENG101.days = 3;\n\
  \n        ENG202.students = 12;\n        ENG202.weeks = 6;\n        ENG202.days\
  \ = 3;\n\n        totalDays101 = ENG101.weeks * ENG101.days;\n        totalDays202\
  \ = ENG202.weeks * ENG202.days;\n    }\n}\n```\n\n\n\n\n```java\nSystem.out.println(\"\
  The English 101 course has \" + ENG101.students + \" students and the course last\
  \ \" + totalDays101 + \" days\");\ntotalDays202 = ENG202.weeks * ENG202.days;\n\
  System.out.println(\"The English 202 course has \" + ENG202.students + \" students\
  \ and the course last \" + totalDays202 + \" days\");\n}\n```\n\n![](img/00006.jpeg)\n\
  \n### 图 2.3 – 创建了两个对象\n\n**程序输出：**\nEnglish 101 课程有 10 个学生，持续 12 天\nEnglish 202\
  \ 课程有 12 个学生，持续 18 天\n\n第 12 行和第 13 行创建了两个对象（`ENG101` 和 `ENG202`），然后在第 18 行至第 24\
  \ 行为这两个对象赋值。请记住，如果存在多个对象，每个对象可以持有与另一个对象不同的值。在这个示例中，变量 `students` 和 `weeks` 被赋予了不同的值，但变量\
  \ `days`get 两个对象都包含相同的值 `3`。\n\n**注意：** 变量的命名约定是 `lowerCamelCase`（小驼峰命名法），即变量名除第一个单词外，每个单词的首字母大写。然而，`ENG101`\
  \ 和 `ENG202` 是例外，它们包含全大写字母，因为学校课程在数字名前通常包含全大写字母。\n\n## 方法 (Methods)\n\n方法是一个用大括号包围的代码块，用于执行特定的操作/任务。其目的是操作并访问由类定义的数据。换句话说，方法对数据执行操作。最好的做法是所有方法都执行单一任务。例如，一个良好的方法只会执行加数字的单一任务，而不是既加数字又将数据保存到文件中。如果一个方法执行了多个任务，程序可能会变得难以阅读和理解。\n\
  \n方法由头（header）和体（body）组成。方法头包括方法类型和方法名。方法名的命名约定与变量名相似，采用 `lowerCamelCase` 风格。除第一个单词外，每个单词的首字母大写。方法名后面必须跟有一对括号，这将变量与方法区分开来。以下是方法的语法：\n\
  \n## 语法\n\n```\nmethodType methodName (parameter-list)\n{\n    // 方法体\n}\n```\n\n\
  `methodType`（称为返回类型）决定了方法返回的数据类型。如果不返回任何值，程序员将被强制使用 `void` 关键字作为 `methodType`。`methodName`\
  \ 可以是除 Java 关键字外的任何名称。命名方法的一种良好技巧是使用“动词+名词”的组合，例如 `getOrder` 或 `addNumbers`。方法体是执行代码以完成任务的地方。参数列表是接收传递方法的\
  \ `arguments` 的变量。如果方法没有 `parameters`，则参数列表必须为空。\n\n**注意：** 方法签名（method signature）是\
  \ `methodName` 和参数列表。\n\n## 方法返回 (Method Returns)\n\n方法返回是指从方法返回值或将控制权移出方法的概念。这两个概念都通过使用\
  \ `return` 关键字来实现。无论 `return` 关键字位于何处，执行都会终止并跳过方法内的后续语句。以下是两种方法返回类型：\n\n1. 返回值的方法\n\
  2. 不能返回值的方法\n\n根据 `ORACLE` 的说明，方法在以下情况下返回到调用它的代码：\n* 完成方法中的所有语句\n* 达到 `return` 语句或\n\
  * 抛出异常\n\n以先发生者为准。\n\n**注意：** 通常，`return` 关键字（也称为返回语句）不用于不能返回值的方法。不使用是因为方法中的所有代码在执行\
  \ `return` 关键字之前已经完成。然而，如果使用了 `return` 关键字，它将在方法的末尾实现，以转移控制权。\n\n### 返回值 (Return\
  \ A Value)\n\n大多数方法都会返回一个值，用于指定计算的结果或结果（通过、失败等）。返回值必须与方法类型的数据类型相同。例如，如果方法类型是 `int`\
  \ 数据类型，那么返回类型必须是 `int` 数据类型。以下是方法返回的语法和示例：\n\n**语法**\n\n```\nreturn value;\n```\n\
  \n```java\nclass English\n{\n    int students, weeks, days;\n    int totalDays ()\n\
  \    {\n        return weeks * days;\n    }\n}\n\nclass TwoEnglishCourses\n{\n \
  \   public static void main (String args[])\n    {\n        English ENG101 = new\
  \ English ();\n        English ENG202 = new English ();\n        ENG101.students\
  \ = 10;\n        ENG101.weeks = 4;\n        ENG101.days = 3;\n        ENG202.students\
  \ = 12;\n        ENG202.weeks = 6;\n        ENG202.days = 3;\n        System.out.println(\"\
  The English 101 course has \" + ENG101.students + \" students and the course last\
  \ \" + totalDays101 + \" days\");\n        System.out.println(\"The English 202\
  \ course has \" + ENG202.students + \" students and the course last \" + totalDays202\
  \ + \" days\");\n    }\n}\n```\n\n### 图 2.4 – 返回一个值\n\n**程序输出：**\nEnglish 101 课程有\
  \ 10 个学生，持续 12 天\nEnglish 202 课程有 12 个学生，持续 18 天\n\n`.` 运算符将 `ENG101` 和 `ENG202`\
  \ 连接到成员 `totalDays()`。`totalDays()` 位于点运算符的右侧。\n\n### 无返回值 (Return No Value)\n\n\
  不能返回值的方法是 `void` 方法。关键字 `void` 被用作方法类型，而不是 `int`。\n\n```java\nclass English\n{\n\
  \    int students, weeks, days;\n    void totalDays ()\n    {\n        // 没有返回语句\n\
  \    }\n}\n\nclass TwoEnglishCourses\n{\n    public static void main (String args[])\n\
  \    {\n        English ENG101 = new English ();\n        English ENG202 = new English\
  \ ();\n        ENG101.students = 10;\n        ENG101.weeks = 4;\n        ENG101.days\
  \ = 3;\n        ENG202.students = 12;\n        ENG202.weeks = 6;\n        ENG202.days\
  \ = 3;\n        System.out.println(\"How many students are in the English 101 course?\
  \ \" + ENG101.students);\n        System.out.println(\"The course is \" + ENG101.days\
  \ + \" days for \" + ENG101.weeks + \" weeks.\");\n        System.out.print(\"Therefore\
  \ the course last the following total number of days:\");\n        ENG101.totalDays();\n\
  \        System.out.println(\"\\n\");\n        System.out.println(\"How many students\
  \ are in the English 202 course? \" + ENG202.students);\n    }\n}\n```\n\n\n\n\n\
  \n```java\nSystem.out.println(\"The course is \" + ENG202.days + \" days for \"\
  \ + ENG202.weeks + \" weeks.\");\nSystem.out.print(\"Therefore the course last the\
  \ following total number of days:\");\nENG202.totalDays();\n}\n```\n\n![](img/00008.jpeg)\n\
  ### 图 2.5 – 空方法 (Void Method)\n\n程序输出：\nEnglish 101 课程有多少个学生? 10\n该课程为 4 周，每周 3\
  \ 天。\n因此，该课程的总天数为：12\nEnglish 202 课程有多少个学生? 12\n该课程为 6 周，每周 3 天。\n因此，该课程的总天数为：18\n\
  \n第 5 行显示了关键字 `void`，它表示该方法将不返回任何值。尽管如此，`void` 方法仅执行计算总天数的任务。第 7 行在乘以周数和天数后打印总天数。当\
  \ `void` 方法实现带有值的 `return` 关键字时，将会显示以下错误：\n\n```java\nclass English\n{\n    int\
  \ students, weeks, days;\n    // 一个 void 方法不能返回一个值\n    void totalDays ()\n    {\n\
  \        return weeks * days\n\n    }\n}\n```\n\n![](img/00009.jpeg)\n### 图 2.6\
  \ – 空方法错误\n\n## 向参数传递参数 (Pass Arguments To Parameters)\n\n参数（Arguments）是传递给方法的值，而形式（Parameters）接收这些值。换句话说，形式接收参数。形式变量在方法的括号内声明，并像局部变量一样运行。局部变量和形式变量仅对声明的方法可见。重要的是，可以将一个或多个参数传递给单独的形式。以下是一个向两个形式传递两个参数的示例：\n\
  \n```java\nclass English\n{\n    int totalDays (int wk, int d)\n    {\n        return\
  \ wk * d;\n    }\n}\n\nclass TwoEnglishCourses\n{\n    public static void main (String\
  \ args[])\n    {\n        English ENG101 = new English ();\n        English ENG202\
  \ = new English ();\n        System.out.println(\"The English 101 course is a total\
  \ of \" + ENG101.totalDays (4, 3) + \" days\");\n        System.out.println(\"The\
  \ English 202 course is a total of \" + ENG202.totalDays (6, 3) + \" days\");\n\
  \    }\n}\n```\n\n![](img/00010.jpeg)\n### 图 2.7 – 向参数传递参数\n\n程序输出：\nEnglish 101\
  \ 课程总共 12 天\nEnglish 202 课程总共 18 天\n\n*   第 3 行为方法 `totalDays ()` 定义了两个形式 `wk, d`。方法可以通过逗号分隔每个形式来拥有多个形式\n\
  *   第 16 行和第 17 行表示将对象 `ENG101` 的参数 `4, 3` 和对象 `ENG202` 的参数 `6, 3` 传递给形式 `wk, d`\n\
  \n注意：对象可以传递给方法，并从方法中返回。\n\n## 方法类型 (Method Types)\n\n以下是四种类型的方法：\n1. 实例方法 (Instance\
  \ Methods)\n2. 类方法 (Class Methods)\n3. 主方法 (Main Method)\n4. 构造方法 (Constructors)\n\
  \n### 实例方法 (Instance Methods)\n\n实例方法由对象调用（称为被调用）。因此，实例方法类似于实例变量，成员可以通过初始化的对象进行访问。然而，实例变量既可以通过对象访问，也可以不通过对象访问。以下是一个实例方法的示例：\n\
  \n```java\npublic class Lion\n{\n    void sound ()\n    {\n        System.out.println(\"\
  ROAR\");\n    }\n    public static void main (String args[])\n    {\n        Lion\
  \ maleLion = new Lion ();\n        maleLion.sound ();\n    }\n}\n```\n\n![](img/00011.jpeg)\n\
  ### 图 2.8 – 实例方法\n程序输出：\nROAR\n*   第 3 – 6 行开始实例方法 `sound`\n*   第 10 行使用关键字 `new`\
  \ 创建一个对象 `maleLion`\n*   第 11 行通过初始化的对象 `maleLion` 调用了实例方法 `sound`\n\n### 类方法 (Class\
  \ Methods)\n\n类方法（称为静态方法）与类变量类似，它们使用 `static` 关键字声明。`static` 关键字意味着该成员属于类，并在所有对象之间共享。可以通过对象名或类名访问类方法。然而，当通过对象访问方法时会出现警告。因此，访问类方法的首选方式是通过类名访问。以下是一个类方法的示例：\n\
  \n```java\nclass StaticAddNumbers\n{\n    static int a, b;\n    static int addNumbers\
  \ ()\n    {\n        return a + b;\n    }\n}\n\nclass StaticExample\n{\n    public\
  \ static void main(String[] args)\n    {\n        StaticAddNumbers objAdd = new\
  \ StaticAddNumbers ();\n        objAdd.a = 20;\n        StaticAddNumbers.b = 30;\n\
  \        System.out.println(\"The addition of variables 'a + b' is \" + objAdd.addNumbers()\
  \ + \" and accessed by an object\");\n        System.out.println(\"The addition\
  \ of variables 'a + b' is \" + StaticAddNumbers.addNumbers() + \" and accessed by\
  \ a class name\");\n    }\n}\n```\n\n![](img/00012.jpeg)\n### 图 2.9 – 类方法\n程序输出：\n\
  The addition of variables 'a + b' is 50 并通过对象访问\nThe addition of variables 'a +\
  \ b' is 50 并通过类名访问\n\n*   第 3 行声明了两个类变量 `a, b`\n*   第 5 – 7 行定义了类方法 `addNumbers`\n\
  *   第 17 行将 20 赋值给类变量 `a`。注意第 17 行旁的警告，提示：“StaticAddNumbers.a 应以静态方式访问”。此警告意味着类变量（称为静态变量）最好通过类名访问。第\
  \ 18 行没有警告，因为类名位于变量名 `b` 之前\n*   第 20 行类似于第 18 行。通过对象而非类名访问静态方法时会出现警告（例如第 21 行）\n\
  \n注意：类方法只能访问类变量并只能调用其他类方法。\n\n### 主方法 (Main Method)\n\n如果某个特定类启动程序，则主方法是唯一的且必不可少的。该方法是必要的，因为它执行程序。以下是主方法的语法：\n\
  \n```java\npublic static void main(String[] args)\n{\n // 方法体\n}\n```\n\n主方法有几个示例，但以下解释了每个组件：\n\
  *   `public` - 该方法可以被所有类访问\n*   `static` – 该方法在所有对象之间共享\n*   `void` – 该方法不返回任何值\n\
  *   `String[] args` – 该方法接收字符串参数并将其传递给程序\n\n### 构造方法 (Constructors)\n\n构造方法是一种与类名相同的特殊方法。如果没有定义构造方法，则会自动创建一个空构造。因此，所有类都包含一个构造方法，用于初始化特定类的对象。每当创建新对象时，都会调用构造方法。默认情况下，数值类型的实例变量初始化为零，引用类型初始化为\
  \ null，布尔类型初始化为 false。\n\n\n\n\n\n构造函数具有为实例变量设置初始值的能力。回想实例变量可以使用点运算符进行访问和赋值。在图 2.4\
  \ – 返回值中，以下实例变量被赋予了值：\n\n`ENG101.students = 10;`\n`ENG101.weeks = 4;`\n`ENG101.days\
  \ = 3;`\n`ENG202.students = 12;`\n`ENG202.weeks = 6;`\n`ENG202.days = 3;`\n\n构造函数包含参数，在创建对象时时会接收参数。下面的示例演示了如何向构造函数传递参数：\n\
  \n```\nclass English\n{\n    int students, weeks, days;\n\n    English (int s, int\
  \ w, int d) {\n        students = s;\n        weeks = w;\n        days = d;\n  \
  \  }\n\n    int totalDays () {\n        return weeks * days;\n    }\n}\n\nclass\
  \ TwoEnglishCourses\n{\n    public static void main (String args[]) {\n        English\
  \ ENG101 = new English (10, 4, 3);\n        English ENG202 = new English (12, 6,\
  \ 3);\n        System.out.println(\"The English 101 course has \" + ENG101.students\
  \ + \" students and the course last \" + ENG101.totalDays () + \" days\");\n   \
  \     System.out.println(\"The English 202 course has \" + ENG202.students + \"\
  \ students and the course last \" + ENG202.totalDays () + \" days\");\n    }\n}\n\
  ```\n\n##### ![](img/00013.jpeg)\n### 图 2.10 – 参数化构造函数\n\n程序输出：\nThe English 101\
  \ course has 10 students and the course last 12 days\nThe English 202 course has\
  \ 12 students and the course last 18 days\n\n第 5-10 行创建一个构造函数，在第 5 行定义了三个参数 `s,\
  \ w, d`。每个参数都用于初始化第 7 到 9 行的实例变量 `students, weeks, days`。在执行第 22 行和 23 行后，ENG101\
  \ 的值 `10, 4, 3` 和 ENG202 的值 `12, 6, 3` 被赋值给参数 `s, w, d`。结果是当使用 `new` 关键字创建每个对象 `ENG101\
  \ 和 ENG202` 时，这些值被传递给 `English()` 构造函数。\n\n注意：构造函数没有使用如 `int` 或 void 等方法类型。注意第 5\
  \ 行以 `English` 开头然后定义参数。Java 允许类包含多个构造函数。如果构造函数包含不同的参数列表，则该功能被称为构造函数重载。\n\n## 访问器方法\n\
  \n访问方法是用于获取和设置私有变量的方法。私有变量只能由其类内部的代码访问。因此，访问方法是两个称为 getter（获取器）和 setter（Setter）的方法，定义在与私有变量相同的类中。\n\
  \n这两个方法在定义时方法名前带有以 `get` 和 `set` 开头的前缀。例如，`getDays()` 和 `setDays()` 被视为获取天数然后设置天数的访问器方法。以下是两种访问器方法的示例：\n\
  \n```\nclass English\n{\n    private int students, weeks, days;\n\n    English (int\
  \ s, int w, int d) {\n        students = s;\n        weeks = w;\n        days =\
  \ d;\n    }\n\n    int getStudents () {\n        return students;\n    }\n\n   \
  \ int getWeeks() {\n        return weeks;\n    }\n\n    int getDays() {\n      \
  \  return days;\n    }\n\n    void setStudents (int s) {\n        students = s;\n\
  \    }\n\n    void setWeeks(int w) {\n        weeks = w;\n    }\n\n    void setDays(int\
  \ d) {\n        days = d;\n    }\n\n    int totalDays () {\n        return weeks\
  \ * days;\n    }\n}\n```\n\n##### ![](img/00014.jpeg)\n### 图 2.11 – 访问器方法\n* 第 3\
  \ 行将所有实例变量 `students, weeks 和 days` 声明为 private\n* 第 5-10 行是构造函数 方法\n* 第 12-25 行是\
  \ get 访问器方法。每个方法只返回人数、周数和天数\n* 第 27-40 行是 set 访问方法。每个方法设置/修改人数和天数\n\n## this 关键字\n\
  \n`this` 单词是一个关键字，在实例方法和/或构造函数 内部作为引用操作。它引用当前对象或正在调用的成员。当局部变量和实例变量同名时，`this` 关键字是可选的，但非常有用。接面的示例展示了当局部变量和实例变量同名时如何使用\
  \ `this` 关键字：\n\n```java\npublic class ThisKeyword\n{\n    int testVariable = 34;\n\
  \n    void hideInstanceVariable () {\n        int testVariable = 15;\n        System.out.println(\"\
  What is the value of the local variable NOT using 'this'? \" + testVariable);\n\
  \        System.out.println(\"What is the value of the instance variable using 'this'?\
  \ \" + this.testVariable);\n    }\n\n    public static void main(String[] args)\
  \ {\n        ThisKeyword objHide = new ThisKeyword ();\n        objHide.hideInstanceVariable\
  \ ();\n    }\n}\n```\n\n##### ![](img/00015.jpeg)\n### 图 2.12 – this 关键字\n\n程序输出：\n\
  What is the value of the local variable NOT using 'this'? 15\nWhat is the value\
  \ of the instance variable using 'this'? 34\n\n* 第 3 行声明并初始化实例变量 `testVariable`\
  \ 为 34\n* 第 7 行声明并初始化局部变量 `testVariable` 为 15\n* 第 9 行打印不使用 'this' 关键字的局部变量值\n*\
  \ 第 10 行打印使用 'this' 关键字的实例变量值\n\n## 注解\n\n根据 [dictionary.com](http://dictionary.reference.com/browse/annotation?s=t)\
  \ 的定义，注解的意思是“关键或解释性的注释”。回想第 1 部分 – Java 4 Selenium WebDriver，注释是帮助程序员理解程序的注释。注解与注释相似，它们都提供信息。然而，注释会被编译器忽略，而注解为编译器提供数据。注解以\
  \ `@` 符号开头，并指定方法的目的。某些注解可以自定义以替换注释和预定义注解（如 `@Override`）。以下是 Selenium WebDriver 中使用的\
  \ JUnit 注解示例：\n\n1. `@Before` 在每个测试前分配资源\n2. `@Test` 执行测试脚本\n3. `@After` 在每个测试后释放已分配的\n\
  \n注意：JUnit 注解的细节将在“Selenium WebDriver”书籍中使用并解释。\n\n## 访问修饰符\n\n访问修饰符是面向对象编程中非常有用的特性。它们对每个类和类成员（变量和方法）施加访问限制非常有用。在\
  \ Java 中有四种访问修饰符：\n\n1. `public` – 表示成员可以被所有类 访问\n\n\n\n\n2. `protected` 表示该成员可以被其所属\
  \ `package` 内的所有 `classes` 和 `subclasses` 访问（参见“第 4 章 继承”）（参见“第 5 章 包”）。\n\n3. `no\
  \ modifier`（无修饰符）—— 表示该成员可以被其所属 `package` 内的所有 `classes` 访问。\n\n4. `private` ——\
  \ 表示成员可以在其所属 `class` 内访问。\n\n访问修饰符位于类、变量和方法的声明之前。类只能使用 `public` 修饰符或无修饰符。因此，如果类使用了\
  \ `private` 或 `protected` 访问修饰符就会报错。以下是一个使用 `public` 修饰符的类、方法和变量的示例：\n\n```java\n\
  public class English {\n    public int students, weeks, days;\n\n    public int\
  \ totalDays () {\n        return weeks * days;\n    }\n}\n\nclass TwoEnglishCourses\
  \ {\n    public static void main (String args[]) {\n        English ENG101 = new\
  \ English ();\n        English ENG202 = new English ();\n        ENG101.students\
  \ = 10;\n        ENG101.weeks = 4;\n        ENG101.days = 3;\n        ENG202.students\
  \ = 12;\n        ENG202.weeks = 6;\n        ENG202.days = 3;\n        System.out.println(\"\
  The English 101 course has \" + ENG101.students + \" students and the course last\
  \ \" + ENG101.totalDays () + \" days\");\n        System.out.println(\"The English\
  \ 202 course has \" + ENG202.students + \" students and the course last \" + ENG202.totalDays\
  \ () + \" days\");\n    }\n}\n```\n\n![](img/00016.jpeg)\n### 图 2.13 – 公有类、变量和方法\n\
  \n类（第 1 行）、所有变量（第 3 行）以及方法（第 5-8 行）都使用 `public` 访问修饰符声明。因此，没有错误，`English` 类中的成员可以被\
  \ `TwoEnglishCourses` 类代码访问。\n\n以下是一个 `private` 方法的示例：\n\n```java\npublic class\
  \ English {\n    public int students, weeks, days;\n\n    private int totalDays\
