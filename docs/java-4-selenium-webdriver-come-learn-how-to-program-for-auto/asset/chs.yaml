  \ 接口实现\n* 接口变量\n* 多重继承\n* 默认接口方法\n\n## 接口实现\n\n接口使用 `implements` 关键字来实现，由一个或多个类提供方法的实现。如果一个类没有通过提供方法体来实现方法，则该类必须声明为\
  \ `abstract`。每个类可以以不同的方式实现同一个接口，同时支持相同的方法。重要的是一个类可以实现多个接口。以下是类实现接口的语法：\n\n```\n\
  class ClassName extends SuperClassName implements interfaceName\n{\n    // 类体\n\
  }\n```\n\n以下是实现接口类的示例。\n\n```java\npackage InterfaceTesting;\n\npublic class InterfaceExamples\
  \ implements InterfaceTest\n{\n```\n\n\n\n\n\n```java\npublic void methodOne() {\n\
