  \n### 图 3.4 – 数组名称、值和索引\n\n# 多维数组\n\n多维数组被视为数组的数组。因此，必须使用两个或多个括号来声明多维数组。常见的多维数组类型是二维数组。每个维度都包含自己的一组括号。带有行和列的电子表格是想象二维数组的好方法。第一对括号是行，第二对括号是列。以下是二维数组的语法和示例：\n\
  \n```\narrType arrName[][] = new arrType[arrSize1][arrSize2];\npublic class TwoDimensionalArray\
