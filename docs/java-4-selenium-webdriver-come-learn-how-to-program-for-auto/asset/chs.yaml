  \ methodThree\");\n    }\n    default public void methodFour() {\n        System.out.println(\"\
  This is the body which implements methodFour\");\n    }\n}\n```\n\n![](img/00048.jpeg)\n\
  ### 图 6.7 – 默认方法示例\n\n第 6 章解释了接口，它是相关方法的集合。通常，接口方法不包含方法体。因此接口方法定义执行任务而不是如何执行任务。然而，默认方法允许接口方法提供方法体，这是\
  \ JDK 8 发布时的变化。第 7 章将讨论错误、异常和调试。\n\n# 第 7 章\n\n## 错误、异常和调试\n\n所有程序都会包含某种错误。错误是程序中的意外问题。它可能是意想不到的问题，例如拼错关键字。在\
  \ Java 中，错误被分为三类：\n\n1. 语法 – 阻止代码执行\n2. 运行时 – 在程序运行时产生错误\n3. 逻辑 – 由于代码逻辑缺陷而不产生错误消息\n\
  \n\n\n\n`逻辑错误`很难定位，因为系统不会生成错误信息。通常，逻辑错误会一直隐藏，直到程序员对程序进行调试。虽然错误是不可避免的问题，但某些问题可以在运行时处理。在运行时处理的问题被称为`异常`。程序员创建一个名为“异常处理器”的代码块，以规范的方式处理异常。处理异常的好处是程序在捕获到异常后仍然可以继续运行。\n\
  \n`调试`是一个允许程序员观察并纠正错误的过程。可以使用 `System.out.print`、`System.out.println` 或调试器找到程序中的问题。调试器是一个遵循代码逻辑的工具。大多数程序员倾向于使用调试器而不是多个打印语句来调查问题。如果使用了打印语句，程序员必须在解决问题前添加这些打印语句，并在解决问题后将它们移除。\n\
  \n第七章将解释关于错误、异常和调试的以下内容：\n\n* 错误类型\n* Throwable 异常父类\n* Java 内置异常\n* 异常\n* 处理异常的原则\n\
  * Try/Catch 块\n* Finally 块\n* Catch 获 Throwable 异常\n* Throwable 定义的方法\n* Throw vs\
  \ Throws\n* 调试\n\n# 错误类型\n\n在编程中，错误是由于程序员代码中的错误而导致的问题。错误出现在程序执行之前、程序执行期间，有时隐藏在程序内部。位于程序执行执行前的错误被称为`语法错误`。在程序执行期间发现的错误被称为`运行时错误`。隐藏在程序中最难发现的错误被称为`逻辑错误`。尽管如此，所有错误都必须解决才能获得成功的程序。\n\
  \n## 语法错误\n\n语法错误（称为编译错误）会停止程序执行。回想第一本书“第一部分 – Java 4 Selenium WebDriver”，语法是一组规定单词和符号结构化组合的规则。如果结构不正确，就会发生错误以防止语句编译。结果是由于程序员代码中的不准确之处导致错误无法通过编译。\n\
  \n语法错误是最容易定位和解决的错误。集成开发环境（IDE）如 `Eclipse` 会指出这些错误。错误通过代码下方的红色横线和/或行号左侧的红色 `X` 显示。此外，在悬停于红色\
  \ `X` 上时，工具提示会显示显示错误的消息。根据《Beginning Java® Programming》(2015)，语法错误包括以下示例（第 172 页）：\n\
  \n* 类名、变量名或方法名拼错\n* 关键字拼错\n* 缺少分号\n* 方法缺少返回类型\n* 括号和括号位置错误或不匹配\n* 未声明或未初始变量\n* 循环、方法或其他结构的格式错误\n\
  \n以下代码程序中存在语法错误：\n\n```java\npublic  class SyntaxError\n\n{\n\n public  static \
  \ void main(String[] args)\n\n             {\n\n int x, y, total;\n\n          \
  \                x = 10;\n                          y = 6,\n\n                 \
  \         Total = x + y;\n                          System.out.println(\"The total\
  \ of 10 + 6 is \" + total);\n\n             }\n}\n```\n\n![](img/00049.jpeg)\n###\
  \ 图 7.1 – 语法错误示例\n\n* 第 10 行由于逗号而非分号显示错误\n* 第 11 行由于 `Total` 未定义而显示错误。首字母是小写 `t`\
  \ 而非大写 `T`。\n\n\n\n\n```java\npublic class LogicalErrors {\n    public static void\
  \ main(String[] args) {\n        int total1 = (9 + (8 * 7)) / 6;\n        int total2\
  \ = (9 + 8) * (7 / 6);\n        int total3 = 9 + 8 * 7 / 6;\n        int total4\
  \ = (9 + 8) * 7 / 6;\n\n        System.out.println(\"What is the result of total1:\
  \ \" + total1);\n        System.out.println(\"What is the result of total2: \" +\
  \ total2);\n        System.out.println(\"What is the result of total3: \" + total3);\n\
  \        System.out.println(\"What is the result of total4: \" + total4);\n    }\n\
  }\n```\n\n![](img/00054.jpeg)\n### 图 7.6 – 运算符优先级逻辑错误示例\n\n**程序输出：\n```\nWhat is\
  \ the result of total1: 10\nWhat is the result of total2: 17\nWhat is the result\
  \ of total3: 18\nWhat is the result of total4: 19\n```\n\n第 7 – 10 行使用不同的运算符优先级初始化了变量\
  \ `total1`、`total2`、`total3`、`total4`。尽管数值 `9, 8, 7, 6` 相同，但每个变量都产生了不同的值。以下是一个分号位置错误的示例：\n\
  \n```java\npublic class LogicalErrors2 {\n    public static void main(String[] args)\
  \ {\n        int i;\n        for (i = 0; i < 5; i++);\n        {\n            System.out.println(\"\
  The loop control variable is \" + i);\n        }\n    }\n}\n```\n\n![](img/00055.jpeg)\n\
  ### 图 7.7 – 分号位置错误逻辑错误示例\n\n**程序输出：**\n```\nThe loop control variable is 5\n```\n\
  \n第 9 行在 `for` 循环末尾错误地放置了分号。因此，程序输出 5 而不是 0, 1, 2, 3, 4。\n\n# Throwable 异常父类\n\n\
  异常是一个 Java 类，其中 `java.lang.Throwable` 是其父类。因此，Throwable 异常代表所有异常类。当程序中抛出异常时，会生成特定异常类的对象。派自\
  \ `Throwable` 父类有两个主要的子类：\n\n1. `Error` – 包含在 Java 虚拟机 (`JVM`) 中发生的严重异常。`JVM` 是机器内部的机器，用于解决问题并帮助程序保持安全。`Error`\
  \ 子类不由程序员管理。\n2. `Exception` – 包含程序中发生的异常。`Exception` 子类由程序员管理。\n\n本书“第 2 部分 – Java\
  \ 4 Selenium WebDriver”将解释 `Exception` 子类。源自 `Error` 子类的异常是程序员无法控制的。以下来自 [Program\
  \ Creek](http://www.programcreek.com/wp-content/uploads/2009/02/Exception-Diagram.jpeg)\
  \ 的一张图，显示了 Java 类的层次结构：\n\n![](img/00056.jpeg)\n### 图 7.8 – Java 异常层次结构\n\n# Java\
  \ 内置异常\n\n在 Java 中，`java.lang` 标准包中定义了大量的异常类。因此，由于 `java.lang` 被隐式导入每个程序中，某些异常是自动可用的。大多数异常源自标准类型\
  \ `RuntimeException`。`RuntimeException` 包含编译器不检查的异常。所有其他异常都由编译器检查，并且必须包含在方法的 `throws`\
  \ 列表中。以下是 `java.lang` 中未检查（unchecked）和已检查（checked）异常的列表：\n\n| 未检查异常 | 说明 |\n| :---\
  \ | :--- |\n| `ArithmeticException` | 算术错误，例如除以零。 |\n| `ArrayIndexOutOfBoundsException`\
  \ | 数组索引越界。 |\n| `ArrayStoreException` | 向不兼容的类型的数组元素赋值。 |\n| `ClassCastException`\
  \ | 无效的类型转换。 |\n| `EnumConstantException` | 尝试使用未定义的枚举值。 |\n| `IllegalArgumentException`\
  \ | 调用方法时使用了非法参数。 |\n| `IllegalMonitorStateException` | 非法监视器操作，例如在未锁定的线程上等待。 |\n\
  | `IllegalStateException` | 环境或应用程序处于错误状态。 |\n| `IllegalThreadStateException` |\
  \ 请求的操作与当前线程状态不兼容。 |\n| `IndexOutOfBoundsException` | 某种类型的索引越界。 |\n| `NegativeArraySizeException`\
  \ | 使用负尺寸创建数组。 |\n| `NullPointerException` | 对空引用的无效使用。 |\n| `NumberFormatException`\
  \ | 字符串到数值格式的无效转换。 |\n| `SecurityException` | 尝试违反安全性。 |\n| `StringIndexOutOfBoundsException`\
  \ | 尝试访问字符串范围外的索引。 |\n| `TypeNotPresent` | 未找到类型。 |\n| `UnsupportedOperationException`\
  \ | 遇到不支持的操作。 |\n\n### 图 7.9 – Java 未检查异常\n\n| 已检查异常 | 说明 |\n| :--- | :--- |\n|\
  \ `ClassNotFoundException` | 未找到类。 |\n| `CloneNotSupportedException` | 尝试克隆一个没有实现\
  \ `Cloneable` 接口的对象。 |\n| `IllegalAccessException` | 拒绝对类的访问。 |\n| `InstantiationException`\
  \ | 尝试创建抽象类或接口的对象。 |\n| `InterruptedException` | 一个线程被另一个线程中断。 |\n| `NoSuchFieldException`\
  \ | 请求的字段不存在。 |\n| `NoSuchMethodException` | 请求的方法不存在。 |\n| `ReflectiveOperationException`\
  \ | 反射相关异常的超类。 |\n\n### 图 7.10 – Java 已检查异常\n\n注意：除了 `java.lang` 之外，以下包包含异常：\n\n\
  | `java.awt` | `java.net` |\n| :--- | :--- |\n| `java.awt.color` | `java.rmi` |\n\
  | `java.awt.datatransfer` | `java.security` |\n| `java.beans` | `java.text` |\n\n\
  ### 图 7.11 – 包含异常的包\n\n# 常见异常\n\n常见异常是程序中频繁异常。这类异常发生在新程序员和经验程序员身上。以下是按字母顺序排列的常见异常：\n\
  \n* `ArrayIndexOutOfBoundsException`\n* `ClassCastException`\n* `IllegalArgumentException`\n\
  * `IllegalStateException`\n* `NullPointerException`\n* `NumberFormatException`\n\
  * `OutOfMemoryError`\n* `StackOverflowError`\n\n数组从索引 0 开始存储第一个值。因此，最后一个索引位置是数组大小减\
  \ 1。当程序尝试访问数组边界外的索引时，会抛出 `ArrayIndexOutOfBoundsException`。以下是 `ArrayIndexOutOfBoundsException`：\n\
  \n```java\npublic class CommonException {\n    public static void main(String[]\
  \ args) {\n        String[] continents = new String[7];\n        continents[0] =\
  \ \"Africa\";\n        continents[1] = \"Antarctica\";\n        continents[2] =\
  \ \"Asia\";\n        continents[3] = \"Australia\";\n        continents[4] = \"\
  Europe\";\n        continents[5] = \"North America\";\n        continents[6] = \"\
  South America\";\n        continents[7] = \"America\";\n\n        System.out.println(\"\
  There are \" + continents.length + \" countries\");\n    }\n}\n```\n\n![](img/00057.jpeg)\n\
  ### 图 7.12 – ArrayIndexOutOfBoundsException / 常见异常示例\n\n* 第 8 行创建了一个包含 7 个元素的数组\
  \ `String[] continents = new String[7];`\n* 第 17 行的 `continents[7] = \"America\"\
  ;` 超出了数组 `continents` 的边界\n* 第 19 行没有执行，因为错误导致程序停止\n\n**程序输出：**\n```\nException\
  \ in thread \"main\" java.lang.ArrayIndexOutOfBoundsException: 7\n    at ExceptionHandling.CommonException.main(CommonException.java:17)\n\
  ```\n\n\n\n\n\n根据程序输出，越界索引为“7”，位于第 17 行。第一行表示发生了异常，然后显示了异常类型 `java.lang.ArrayIndexOutOfBoundsException`。数字\
  \ 7 指定了导致异常的索引。第二行显示了异常所在的位置 `at ExceptionHandling.CommonException.main(CommonException.java:17)`。以下是第二行的翻译：\n\
  \n在包名 `ExceptionHandling`、类名 `CommonException`、方法名 `main` 的第 17 行发生了一个异常。\n\n# 异常处理原理\n\
  \n众周知，异常是在运行时（程序执行期间）发生的问题。Java 允许异常处理器处理异常，这具有许多优点。请记住图 7.4 中的运行时错误示例，由于由于除以零导致执行停止。处理异常的好处是程序在响应错误后将继续执行。因此，错误不会停止程序的执行，而是异常处理器允许程序继续运行。在\
  \ Java 中，有五个相互关联的关键字可以促进异常处理的管理。以下是每个关键字的描述：\n\n1. try – 监控可能发生异常的代码\n2. catch –\
  \ 当发生错误时处理异常\n3. throw – 手动抛出自定义异常\n4. throws – 抛出方法中发生的异常\n5. finally – 在退出 try\
  \ 块后自动执行代码\n\n如果异常处理器没有捕获异常，则 Java 虚拟机 (JVM) 会捕获所有异常。[JVM]](#part0000_split_062.html_JVM)\
  \ 会显示错误信息，这对于调试 是有利的，但对于处理异常不利。由于会导致程序终止，它对于处理异常是不好的。\n\n# Try / Catch 块\n\ntry\
  \ / catch 块允许尝试执行代码以验证是否发生异常。如果发生异常，则捕获该异常以指定应该发生什么。“try 和 catch” 两个关键字在处理异常时共同工作。try\
  \ 用于包含可能引起异常的代码，而 catch 用于管理异常。这两个关键字“try 和 catch”都是处理异常的核心。会提供一个 try 块以及一个或多个 catch\
  \ 块。需要注意的是，如果没有发生异常，则 try 块和所有 catch 块都会被跳过。以下是处理异常的 try / catch 块语法：\n\n## 语法\n\
  \n```java\ntry\n{\n    // 由 try 块监控的代码\n}\ncatch (ExceptionType1 excObject)\n{\n\
  \    //  ExceptionType1 的异常处理器\n}\ncatch (ExceptionType2 excObject)\n{\n    // \
  \ ExceptionType2 的异常处理器\n}\n```\n\n以下是 try 和 catch 块的语法细节：\n\n| 参数 | 描述 |\n| :---\
  \ | :--- |\n| try | 监控代码块以检查异常 |\n| catch | 处理并应对异常 |\n| ExceptionType1 ExceptionType2\
  \ | 异常类型，必须是继承自 Throwable 类的类名 |\n| excObject | 接收处理器捕获的异常值。 |\n\n### 图 7.13 – 语法细节\n\
  \n以下是一个 try 和 catch 异常处理器的示例：\n\n```java\npublic class TryCatchBlock\n{\n    public\
  \ static void main(String[] args)\n    {\n        String[] continents = new String[7];\n\
  \        try\n        {\n            System.out.println(\"An exception has not been\
  \ thrown\");\n            continents[0] = \"Africa\";\n            continents[1]\
  \ = \"Antarctica\";\n            continents[2] = \"Asia\";\n            continents[3]\
  \ = \"Australia\";\n            continents[4] = \"Europe\";\n            continents[5]\
  \ = \"North America\";\n            continents[6] = \"South America\";\n       \
  \     continents[7] = \"America\";\n            System.out.println(\"There are \"\
  \ + continents.length + \" continents\");\n        }\n        catch (ArrayIndexOutOfBoundsException\
  \ exc)\n        {\n            System.out.println(\"Exception!!! - Array Out of\
  \ Bounds. Not a valid continent\");\n        }\n        System.out.println(\"This\
  \ line executes automatically whether an exception occurs or not\");\n    }\n}\n\
  ```\n\n![](img/00058.jpeg)\n\n### 图 7.14 – Try 和 Catch 示例\n\n**程序输出：**\nAn exception\
  \ has not been thrown\nException!!! - Array Out of Bounds. Not a valid continent\n\
  This line executes automatically whether an exception occurs or not\n\n* 第 8 行开始使用\
  \ try 块处理代码\n* 第 19 行在定义位置 7（位于数组之外）时强制触发异常。因此，try 块终止，程序将控制权转移到 catch 块\n* 由于第\
  \ 19 行发生异常，第 21 行不执行\n* 第 23 行通过在 catch 块中列出异常 `ArrayIndexOutOfBoundsException`\
  \ 开始异常处理过程\n* 第 25 行在捕获异常后在 catch 块内执行\n* 第 27 行在 catch 块之后执行。此行无论是否发生异常都会自动执行。\n\
  \nJava 中的一种常见做法是将多个 catch 块与 try 块相关联。每个 catch 块必须包含一个唯一的异常类型，例如算术异常、数组越界异常等。异常类型决定了在创建多个\
  \ catch 块后执行哪个 catch 块。因此，如果执行了算术异常，数组越界异常类型将被跳过。以下是带有多个 catch 块的 try 块示例：\n\n```java\n\
  public class MultipleCatchBlocks\n{\n    public static void main(String[] args)\n\
  \    {\n        int oddNumbers[] = {1, 33, 55, 77, 111};\n        int evenNumbers[]\
  \ = {0, 2, 4, 8};\n        for (int i = 0; i < oddNumbers.length; i++)\n       \
  \ {\n            try\n            {\n                System.out.println(\"What is\
  \ \" + oddNumbers[i] + \"/\" + evenNumbers[i] + \"? \" + \"\" + oddNumbers[i]/evenNumbers[i]);\n\
  \            }\n            catch (ArithmeticException except)\n            {\n\
  \                System.out.println(\"Exception!!! - Cannot divide by zero\");\n\
  \            }\n            catch (ArrayIndexOutOfBoundsException except)\n    \
  \        {\n                System.out.println(\"Exception!!! - Cannot locate the\
  \ index\");\n            }\n            System.out.println(\"This line executes\
  \ automatically whether an exception occurs or not\");\n        }\n    }\n}\n```\n\
  \n![](img/00059.jpeg)\n\n### 图 7.15 – 多重 Catch 块\n\n**程序输出：**\nException!!! - Cannot\
  \ divide by zero\nWhat is 33/2? 16\nWhat is 55/4? 13\nWhat is 77/6? 12\nWhat is\
  \ 99/8? 12\n\n* 第 17 行显示了第一个 catch 块，它包含算术异常。catch 块根据它们与 try 块关联的顺序进行评估。因此，由于它在程序中先出现，首先被评估。\n\
  * 当代码到达数组 `evenNumbers[]` 中的零“0”时，执行第 19 行。\n* 第 21 行显示第二个 catch 块，它包含数组索引越界异常。\n\
  \n\n\n\n\n*   当代码在数组 `evenNumbers[]` 中搜索不存在的索引时，执行第 23 行。当找到此异常类型的匹配项时，其他 catch\
  \ 块将被忽略。\n\n# Finally 块\n\n`finally` 块是 `try` / `catch` 块的扩展。该块确保无论是否发生异常，某些操作（如向文件写入数据）都会执行。Java\
  \ 允许相同的操作放在 `try` 块和 `catch` 块中。另一方面，在两个块（`try block and catch block`）中放置相同的代码会导致代码重复。\n\
  \n例如，如果没有发生异常且需要将数据写入文件会发生什么。在这种情况下，`try` 块执行代码，而 `catch` 块被跳过。然而，如果发生异常，`catch`\
  \ 块执行代码，而 `try` 块被跳过。因此，程序员必须将代码置于 `try` 和 `catch` 块中，以确保数据被写入文件。在编程中，重复代码是难以阅读和维护。`finally`\
  \ 块不是必须的，但当抛出异常和未抛出异常时，它无疑会将数据写入文件。以下是 `try/catch/finally` 块的语法：\n\n## 语法\n\n```java\n\
  try\n{\n // 由 try 块监控的代码\n}\ncatch (ExceptionType1 excObject)\n{\n    // ExceptionType1\
  \ 的异常处理器\n}\ncatch (ExceptionType2 excObject)\n{\n    // ExceptionType2 的异常处理器\n\
  }\nfinally\n{\n // 无论是否发生异常都执行代码\n}\n```\n\n以下是一个使用 `try/catch/finally` 块的示例：\n\n\
  ```java\npublic class FinallyBlock\n{\n public static void main(String[] args)\n\
  {\n int oddNumbers[] = {11, 33, 55, 77, 99, 111};\n int evenNumbers[] = {0, 2, 4,\
  \ 6, 8};\n for (int i = 0; i < oddNumbers.length; i++)\n                       \
  \         {\n try\n                                    {\n                     \
  \           System.out.println(\"What is \" + oddNumbers[i] + \"/\" + evenNumbers[i]\
  \ + \"? \"\n+ \"\" + oddNumbers[i]/evenNumbers[i]);\n                          \
  \          }\n catch (ArithmeticException except)\n                            \
  \        {\n                                System.out.println(\"Exception!!! -\
  \ Cannot divide a number by zero\");\n                                }\n catch\
  \ (ArrayIndexOutOfBoundsException except)\n                                    {\n\
  \                                System.out.println(\"Exception!!! - Cannot locate\
