  }\n```\n\n### 细节\n\n| 参数 | 说明 |\n| :--- | :--- |\n| `accessmodifier` | 可以是 `public`\
  \ 或无访问修饰符。`public` 表示接口可以被任何代码使用。无访问修饰符为默认值，表示接口仅对其包的成员可用。 |\n| `interface` | 用于声明接口的关键字\
