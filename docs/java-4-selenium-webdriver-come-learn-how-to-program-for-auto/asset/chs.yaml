  Perform an Action\nWhat is 99/8? 12\nPerform an Action\nException!!! - locate the\
  \ index\nPerform an Action\n```\n*   第 25 行在 `try/catch` 块结束时开始 `finally` 块\n* \
  \  第 27 行在抛出异常和未抛出异常时都会自动执行\n\n# 捕获 Throwable 异常\n\n`Throwable` 异常可以用于捕获所有异常，因为它是父类。超类\
  \ `Throwable` 匹配其所有子类，包括 `RuntimeException`。为了捕获这两个类的异常，必须在各自的 catch 块中实现该超类和子类。以下是一个使用图\
  \ 7.15 代码编写的 `Throwable` 超类和 `ArithmeticException` 子类的示例：\n\n```java\npublic class\
  \ SuperSubClassException\n{\n public static void main(String[] args)\n{\n int oddNumbers[]\
  \ = {11, 33, 55, 77, 99, 111};\n int evenNumbers[] = {0, 2, 4, 6, 8};\n for (int\
  \ i = 0; i < oddNumbers.length; i++)\n                                {\n try\n\
  \                                    {\n                                System.out.println(\"\
  What is \" + oddNumbers[i] + \"/\" + evenNumbers[i] + \"? \"\n+ \"\" + oddNumbers[i]/evenNumbers[i]);\n\
  \                                    }\n catch (ArithmeticException except)\n  \
  \                                  {\n                                System.out.println(\"\
  Exception!!! - Cannot divide a number by zero\");\n                            \
  \    }\n catch (Throwable except)\n                                    {\n     \
  \                           System.out.println(\"Exception!!! - The Throwable Exception\
  \ caught an error\");\n                            }\n }\n}\n}\n```\n![](img/0061.jpeg)\n\
  \n### 图 7.17 – Throwable 和 ArithmeticException 示例\n\n程序输出:\n```\nException!!! -\
  \ Cannot a number by zero\nWhat is 33/2? 16\nWhat is 55/4? 13\nWhat is 77/6? 12\n\
  What is 99/8? 12\nException!!! - The Throwable Exception caught an error\n```\n\
  *   第 18 行在第一个 catch 块中实现了子类异常 `ArithmeticException`\n*   当代码到达数组 `evenNumbers[]`\
  \ 中的零 `0` 时，执行第 20 行\n*   第 22 行在第二个 catch 块中实现了 `Throwable` 异常\n*   当代码在数组 `evenNumbers[]`\
  \ 中搜索不存在的索引时，执行第 24 行\n\n`Throwable` 超类和子类允许通过放在第一个 catch 块来捕获异常。如果 `Throwable`\
  \ 异常实现在第一个块，则会发生错误。错误信息为“Unreachable catch block for Throwable”。\n\n# Throwable\
  \ 定义的方法\n\n如所述，`Throwable` 是每个异常子类的超类。因此所有异常都支持 `Throwable` 定义的方法。可以使用 `Throwable`\
  \ 异常进行捕获，但它是通用的。在处理异常时，最好使用特定的异常如 `ArithmeticException`。以下是 `Throwable` 定义的方法列表：\n\
  \n| 方法 | 说明 |\n| :--- | :--- |\n| [fillInStackTrace](https://www.cis.upenn.edu/%7Ebcpierce/courses/629/jdkdocs/api/java.lang.Throwable.html#fillInStackTrace%28())\
  \ | 填充完整的执行堆栈 |\n| [getLocalizedMessage](https://www.cis.upenn.edu/%7Ebcpierce/courses/629/jdkdocs/api/java.lang.Throwable.html#getLocalizedMessage%28())\
  \ | 创建 `Throwable` 异常的本地化描述 |\n| [getMessage](https://www.cis.upenn.edu/%7Ebcpierce/courses/629/jdkdocs/api/java.lang.Throwable.html#getMessage%28())\
  \ | 返回 `Throwable` 异常的详细信息 |\n| [printStackTrace](https://www.cis.upenn.edu/%7Ebcpierce/courses/629/jdkdocs/api/java.lang.Throwable.html#printStackTrace%28())\
  \ | 打印堆栈跟踪 |\n| [printStackTrace](https://www.cis.upenn.edu/%7Ebcpierce/courses/629/jdkdocs/api/java.lang.Throwable.html#printStackTrace%28java.io.PrintStream%29)(PrintStream)\
  \ | 向指定的打印流打印堆栈跟踪 |\n| [printStackTrace](https://www.cis.upenn.edu/%7Ebcpierce/courses/629/jdkdocs/api/java.lang.Throwable.html#printStackTrace%28java.io.PrintWriter%29)(PrintWriter)\
  \ | 向指定的打印写入器打印堆栈跟踪 |\n| [toString](https://www.cis.upenn.edu/%7Ebcpierce/courses/629/jdkdocs/api/java.lang.Throwable.html#toString%28())\
  \ | 在被 `println()` 方法调用后返回简短的异常描述 |\n\n### 图 7.18 – Throwable 定义的方法\n\n\n\n\n\n\
  `Throwable` 定义的最常用方法之一是 [`printStackTrace()`](https://www.cis.upenn.edu/%7Ebcpierce/courses/629/jdkdocs/api/java.lang.Throwable.html#printStackTrace%28%29)()\
  \ 方法。该方法会将堆栈跟踪打印到“标准错误”。以下是 `printStackTrace()` 方法示例：\n\n```java\npublic class ThrowableMethod\
  \ {\n    public static void main(String[] args) {\n        int oddNumbers[] = {11,\
  \ 33, 55, 77, 99, 111};\n        int evenNumbers[] = {0, 2, 4, 6, 8};\n        for\
  \ (int i = 0; i < oddNumbers.length; i++) {\n            try {\n               \
  \ System.out.println(\"What is \" + oddNumbers[i] + \"/\" + evenNumbers[i] + \"\
  ? \"\n+ \"\" + oddNumbers[i]/evenNumbers[i]);\n            } catch (ArithmeticException\
  \ exceptName) {\n                System.out.println(\"Exception!!! - Cannot divide\
  \ a number by zero\");\n            } catch (Throwable exceptName) {\n         \
  \       System.out.println(\"Exception!!! - The Throwable Exception caught the following\
  \ error:\" + \"\\n\");\n                exceptName.printStackTrace();\n        \
  \    }\n        }\n    }\n}\n```\n\n### 图 7.19 – 打印跟踪\n**程序输出：**\n```text\nWhat\
  \ is 33/16\nWhat is 55/13\nWhat is 77/6\nWhat is 99/8\nException!!! - The Throwable\
  \ Exception caught the following error:\njava.lang.ArrayIndexOutOfBoundsException:\
  \ 5\nat ThrowableMethod.main(ThrowableMethod.java:4)\n```\n* 第 2 行定义了第二个 `catch`\
  \ 块，使用了一个对象 `exceptName`，该对象将用于显示异常\n* 第 4 行使用异常对象并通过点操作符调用创建了 `printStackTrace()`\
  \ 方法\n\n## Throw vs Throws\n\n`throw` 关键字用于显式地抛出异常。必须创建一个 `Throwable` 异常类的对象来抛出异常。手动抛出异常有两种方法：\n\
  1. 在 `catch` 块中使用参数\n2. 使用 `new` 运算符创建对象\n\n以下是手动抛出异常的语法：\n```java\nthrow excObject\n\
  ```\n\n以下是使用 `new` 运算符抛出异常的示例：\n\n```java\npublic class ThrowTest {\n    int DivideByZero(int\
  \ num1, int num2) {\n        if (num2 == 0) {\n            System.out.println(\"\
  An error has been thrown\");\n            throw new ArithmeticException(\"Exception!!!\
  \ - Cannot divide a number by zero\");\n        } else {\n            return num1/num2;\n\
  \        }\n    }\n    public static void main(String[] args) {\n        try {\n\
  \            ThrowTest objThrow = new ThrowTest ();\n            System.out.println(objThrow.DivideByZero(34,\
  \ 0));\n        } catch (Exception exc) {\n            System.out.println(exc.getMessage());\n\
  \        } finally {\n            System.out.println(\" Perform an action if exception\
  \ thrown or \");\n        }\n    }\n}\n```\n\n### 图 7.20 – Throw 示例\n**程序输出：**\n\
  ```text\nAn error has not been thrown\nException!!! - Cannot divide a number by\
  \ zero\nPerform an action if thrown or not\n```\n* 第 10 行使用关键字 `throw` 和 `new` 创建了一个异常。关键字\
  \ `new` 用于构造一个带有字符串参数的 `ArithmeticException` 实例\n* 第 24 行将值 `34` 和 `0` 传递给从第 5 行开始的\
  \ `DivideByZero` 方法。变量 `num2` 接收到 `0` 导致异常\n* 第 28 行通过调用 `getMessage()` 方法显示第 10\
  \ 行的字符串参数\n\n`throws` 关键字用于显式定义方法可能抛出的异常。因此，如果一个声明的方法使用 `throws` 关键字声明了一个或多个异常，则方法调用处必须处理所有异常。以下是使用\
  \ `throws` 定义异常列表的示例：\n```java\nmethod methodName (parameter-list) throws exc-list\
  \ {\n    // 方法体\n}\n```\n\n以下是使用 `throws` 定义异常的示例：\n\n```java\npublic class ThrowsKeywordTest\
  \ {\n    static void throwMethod () throws NullPointerException {\n        System.out.println(\"\
  An error has not been thrown\");\n        throw new NullPointerException (\"Exception!!!\
  \ - Null Pointer\");\n    }\n    public static void main(String[] args) {\n    \
  \    try {\n            throwMethod ();\n        } catch (NullPointerException exc)\
  \ {\n            System.out.println(\"Exception Type \" + exc);\n        }\n   \
  \ }\n}\n```\n\n### 图 7.21 – Throws 示例\n* 第 5 行使用关键字 `throws` 定义了异常 `NullPointerException`\n\
  * 第 15 行调用了 `throwMethod()`，该方法包含一个异常\n* 第 19 行显示了 NullPointerException\n\n以下描述了\
  \ `throw` 和 `throws` 之间的差异：\n\n| Throw | Throws |\n| :--- | :--- |\n| 可以抛出一个异常 |\
  \ 可以声明多个异常 |\n| 后面跟着实例 | 后面跟着异常类 |\n| 在方法体内部 | 在方法签名中使用 |\n\n## 调试\n\n在开发程序的某个时刻，程序将包含错误和或异常。对于每个程序员来说，关键在于学习如何调试程序。调试是检测并移除程序中意外状况的过程。像\
  \ Eclipse 这样的 IDE 提供了调试工具来辅助调试过程。该工具允许程序员逐行执行代码，以查看每行发生了什么。\n\n## 断点\n\n要开始调试过程，必须在程序中放置断点。断点的目的是暂停程序的执行。结果是，程序运行到断点处，直到调试器接收到后续操作指令。程序可以随时设置或清除多个断点。以下是设置或清除断点的方法列表：\n\
  \n1. 双击目标行号左侧\n2. 将光标移动到目标行号左侧，右键点击鼠标，然后选择切换断点\n3. 将光标移动到目标行并按下快捷键 `Ctrl + Shift\
  \ + B`\n\n设置断点后，行号旁边会出现一个蓝点。接下来，程序员必须打开调试视图，该视图提供了各种视图和编辑器的组合用于调试程序。调试视图可以通过以下方式打开：\n\
  \n1. 按 `11`\n2. 在程序内部右键点击，选择 Debug As，然后选择 Java\n3. 点击 Run 然后选择 Debug As，然后 Java\
  \ Application\n4. 快捷键 `Alt + Shift + D, J`\n\n注意：当 Eclipse 显示“确认切换”对话框时，选择“是”。\n\
  \n### 图 7.23 – 确认视角切换截图\n\n\n\n\n\n以下是调试（Debug）视图的截图：\n\n![C:\\Users\\REXAJO~1\\\
  AppData\\Local\\Temp\\SNAGHTML212f7aa6.PNG](img/00066.jpeg)\n\n图 7.24 – 调试视图截图\n\
  \n## 单步执行程序\n\n单步执行程序是指调试器逐行执行代码。单步执行的过程有助于程序员理解逻辑是如何运行的。功能键 `F5`、`F6`、`F7` 和 `F8`\
  \ 控制程序的单步执行。\n\n- 步入 (`F5`） – 仅执行当前代码行。调试器会在步入的每行代码（包括被调用的方法）处暂停。\n- 步跳 (`F6`） –\
  \ 执行当前方法而不显示每个步骤。调试器将留在主程序中，而子程序在后台执行。\n- 步回 (`F7`） – 在后台执行当前方法的同时，返回到步入的该方法。\n\
  - 恢复 (`F8`） – 继续执行直到遇到下一个断点。\n\n第 7 章讨论了错误、异常和调试。错误是程序中的问题。错误有三种：语法错误、运行时错误和逻辑错误。异常是在运行时发生的错误。然而，异常处理器允许代码块管理异常。因此，异常允许在处理问题后继续执行。调试是一个允许程序员检测并解决所有错误的过程。第\
  \ 8 章介绍了 Java 的输入输出系统。\n\n# 第 8 章：利用输入和输出\n\nJava 的输入/输出（I/O）包 `java.io` 包含了许多类、接口和方法。该包提供了读取/写入数据的输入流和输出流。数据从输入源读取并写入输出目标。输入源和输出目标可以是任何包含信息的实体，如文件、字符串或内存。输入是程序接收的数据，输出是程序发送的数据。程序可以是接收和发送数据的网络浏览器。\n\
  \n第八章是介绍，涵盖了关于 Java 大型输入/输出系统的以下内容：\n\n- 流\n- 文件输入/输出\n\n## 流\n\nJava 程序通过流执行输入和输出。流代表要读取或写入的数据序列。因此，流具有传递数据或对数据进行转换的能力。根据\
  \ [Oracle](https://docs.oracle.com/javase/7/docs/api/java/io/package-summary.html#package_description)，`InputStream`\
  \ 类是所有表示字节输入流的类的抽象超类。`OutputStream` 类是所有表示字节输出流的类的抽象超类。因此，I/O 类是提供或消费信息的抽象。流提供了多种数据格式。\n\
  \n### 字节流\n\n字节流类派自 `InputStream` 和 `OutputStream`。使用字节流的程序提供了功能并管理读取/写入细节。以下是字节流类列表。\n\
  \n| 字节流 | 描述 |\n| :--- | :--- |\n| `BufferedInputStream` | 为另一个输入流添加功能——即能够缓冲输入并支持\
  \ `mark` 和 `reset` 方法 |\n| `BufferedOutputStream` | 实现一个缓冲输出流 |\n| `ByteArrayInputStream`\
  \ | 从字节数组读取的输入流 |\n| `ByteArrayOutputStream` | 写入字节数组的输出流 |\n| `DataInputStream`\
  \ | 包含读取 Java 标准数据类型方法的输入流 |\n| `DataOutputStream` | 包含写入 Java 标准数据类型方法的输出流 |\n\
  | `FileInputStream` | 从文件读取的输入流 |\n| `FileOutputStream` | 写入文件的输出流 |\n| `InputStream`\
  \ | 是所有表示字节输入流的类的超类的抽象类 |\n| `ObjectInputStream` | 用于对象的输入流 |\n| `ObjectOutputStream`\
  \ | 用于对象的输出流 |\n| `OutputStream` | 是所有表示字节输出流的类的超类的抽象类 |\n| `PipedInputStream` |\
  \ 提供写入管道输出流的数据字节 |\n| `PipedOutputStream` | 连接到管道输入流以创建通信管道 |\n| `PrintStream` |\
  \ 包含 `print()` 和 `println()` 的输出流 |\n| `PushbackInputStream` | 允许字节返回到流中的输入流 |\n\
  | `SequenceInputStream` | 表示其他输入流的逻辑连接 |\n\n图 8.1 – 字节流\n\n以下是 `InputStream` 方法列表：\n\
  \n| InputStream 方法 | 描述 |\n| :--- | :--- |\n| `abstract int read()` | 从输入流读取下一个字节数据\
  \ |\n| `boolean markSupported()` | 测试此输入流是否支持 `mark` 和 `reset` 方法 |\n| `int available()`\
  \ | 返回从此输入流中可以读取（或跳过）的字节数估计值，而不会因下一次调用此输入流的方法而阻塞 |\n| `int read (byte[] b)` | 从输入流读取若干字节并将其存储在缓冲区数组\
  \ `b` 中 |\n| `int read (byte[] b, int off, int len)` | 从输入流读取最多 `len` 个字节的数据并存入字节数组\
  \ |\n| `long skip (long n)` | 跳过并丢弃此输入流中的 `n` 个字节数据 |\n| `void close()` | 关闭此输入流并释放与流相关的任何系统资源\
  \ |\n| `void mark (int readLimit)` | 标记输入流的位置 |\n| `void reset()` | 将此流重置为调用 `mark`\
  \ 方法的位置 |\n\n图 8.2 – InputStream 方法\n\n以下是 `OutputStream` 方法列表：\n\n| OutputStream\
  \ 方法 | 描述 |\n| :--- | :--- |\n| `abstract void write(int b)` | 将指定的字节写入输出流 |\n|\
  \ `void close()` | 关闭此输出流并释放与流相关的任何系统资源 |\n| `void flush()` | 刷新此输出流并强制将缓冲的输出字节写入\
  \ |\n| `void write(byte[] b)` | 将字节数组中的所有字节写入输出流 |\n| `void write(byte[] b, int\
  \ off, int len)` | 从字节数组偏移量 `off` 开始将 `len` 个字节写入输出流 |\n\n图 8.3 – OutputStream 方法\n\
  \n## 字符流\n\n字符流类派自 `Reader` 和 `Writer`，它们提供了与 `InputStream` 和 `OutputStream` 的方法。字符流类并行字节流类管理\
  \ I/O。Unicode 字符从字符流类转换。以下是字符流类列表：\n\n| 字符流 | 描述 |\n| :--- | :--- |\n| `BufferedReader`\
  \ | 从字符输入流读取文本，缓冲字符以便高效读取字符、数组和行 |\n| `BufferedWriter` | 向字符输出流写入文本，缓冲字符以便高效写入字符、数组和字符串\
  \ |\n| `CharArrayReader` | 该类实现了一个可以作为字符输入流的缓冲区 |\n| `CharArrayWriter` | 该类实现了一个可以作为\
  \ Writer 的字符缓冲区 |\n| `FileReader` | 读取字符文件的便利类 |\n| `FileWriter` | 写入字符文件的便利类 |\n\
  | `FilterReader` | 读取过滤字符流的抽象类 |\n| `FilterWriter` | 写入过滤字符流的抽象类 |\n| `InputStreamReader`\
  \ | `InputStreamReader` 是字节流到字符流的桥梁：它读取字节并使用指定的字符集将其解码为字符 |\n| `LineNumberReader`\
  \ | 用于行号的缓冲字符输入流 |\n\n\n\n\n\n| 类 |  |\n| :--- | :--- |\n| `OutputStreamWriter`\
  \ | `OutputStreamWriter` 是从字符流到字节流的桥梁：写入它的字符将使用指定的字符集编码为字节 |\n| `PipedReader` |\
  \ 管道字符输入流 |\n| `PipedWriter` | 管道字符输出流。 |\n| `PrintWriter` | 将对象的格式化表示打印到文本输出流。\
  \ |\n| `PushbackReader` | 一种字符流读取器，允许将字符推回流中。 |\n| `Reader` | 用于读取字符流的抽象类 |\n| `StringReader`\
  \ | 源自字符串的字符流。 |\n| `StringWriter` | 将其输出收集在字符串缓冲区中的字符流，该缓冲区可以用于构建字符串 |\n| `Writer`\
  \ | 用于写入字符流的抽象类 |\n\n### 图 8.4 – 字符流\n\n## 缓冲流 (Buffered Streams)\n\n缓冲输入流从称为缓冲区（buffer）的内存区域读取数据。另一方面，缓冲输出流将数据写入缓冲区。在\
  \ Java 中，大多数流都是无缓冲的，这意味着每个读取或写入请求都直接由操作系统（OS）管理。操作系统的管理请求会由于触发了昂贵的操作而降低程序的效率。\n\n\
  缓冲 I/O 流的实现旨在通过在内存中管理一个专用空间来减少开销。该专用空间以高效的方式存储数据。例如，只有当缓冲区为空时才会调用缓冲输入流，并且只有当缓冲区满额时才会调用缓冲输出流。因此，以下四个缓冲区类可以用于封装字节或或字符\
  \ I/O 流：\n\n| 缓冲区类 | 描述 |\n| :--- | :--- |\n| `BufferedInputStream` | 为输出流提供缓冲 |\n\
  | `BufferedOutputStream` | 为输入流提供缓冲 |\n| `BufferedReader` | 从字符输入流读取文本 |\n| `BufferedWriter`\
  \ | 向字符输出流写入文本 |\n\n### 图 8.5 – 缓冲流\n\n## 数据流 (Data Streams)\n\n数据流是 `String` 值、二进制输入以及原始数据类型（如\
  \ `boolean`、`byte`、`char`、`double`、`float`、`int`、`long` 和 `short`）输出的基础。所有数据流都实现了\
  \ `DataInput` 或 `DataOutput` 接口。`DataInput` 接口提供了读取方法，而 `DataOutput` 接口提供了所有 Java\
  \ 原始类型的写入方法。`DataInputStream` 实现了 `DataInput` 接口`DataOutputStream` 实现了 `DataOutput`\
  \ 接口。以下是 `DataInputStream` 和 `DataOutputStream` 的方法列表：\n\n| DataInputStream 方法 |\
  \ 描述 |\n| :--- | :--- |\n| `boolean readBoolean()` | 从文件中读取布尔输入 |\n| `byte readByte()`\
  \ | 从文件中读取字节输入 |\n| `char readChar()` | 从文件中读取字符输入 |\n| `double readDouble()` |\
  \ 从文件中读取双精度浮点数输入 |\n| `float readFile()` | 从文件中读取浮点数输入 |\n| `int readInt()` | 从文件中读取整数输入\
  \ |\n| `long readLong()` | 从文件中读取长整数输入 |\n| `short readShort()` | 从文件中读取短整型输入 |\n\
  \n### 图 8.6 – DataInputStream 方法\n\n| DataOutputStream 方法 | 描述 |\n| :--- | :---\
  \ |\n| `void writeBoolean(boolean v)` | 向文件写入布尔输出 |\n| `void writeByte(int v)` |\
  \ 向文件写入字节输出 |\n| `void writeChar(int v)` | 向文件写入字符输出 |\n| `void writeDouble(double\
  \ v)` | 向文件写入双精度浮点数输出 |\n| `void writeFloat(float v)` | 向文件写入浮点数输出 |\n| `void writeInt(int\
  \ v)` | 向文件写入整数输出 |\n| `void writeLong(long v)` | 向文件写入长整数输出 |\n| `void writeShort(int\
  \ v)` | 向文件写入短整型输出 |\n\n### 图 8.7 – DataOutputStream 方法\n\n## 标准流 (Standard Streams)\n\
  \nJava 提供了标准 I/O 支持，因此程序可以从键盘接收输入并在计算机显示器上输出。`java.lang` 包中名为 `System` 的类包含了三个标准流变量`in`、`out`\
  \ 和 `err`。`System.in` 是一个 `InputStream` 对象，而 `System.out` 和 `System.err` 是 `PrintStream`\
  \ 对象。`PrintStream` 允许将格式化数据写入 `OutputStream`。以下是标准流的描述：\n\n| 标准流 | 描述 |\n| :---\
  \ | :--- |\n| 标准输入 (`System.in`) | 默认情况下，键盘标准输入控制程序接收输入的地方 |\n| 标准输出 (`System.out`)\
  \ | 默认情况下，控制台标准输出控制程序输出的地方 |\n| 标准错误 (`System.err`) | 默认情况下，控制台标准错误用于输出程序提供的错误 |\n\
  \n### 图 8.8 – 标准流\n\n# 文件输入/输出 (File Input/Output)\n\n文件的存储和组织使其能够方便地进行检索和访问。在 Java\
  \ 中，有两个包 `java.io.file` 和 `java.nio.file` 专门用于文件。`java.nio.file` 包是较新的文件系统，标记为 NIO2，意为“新输入输出\
  \ 2”。NIO2 标识了用于访问文件、文件属性和文件系统的接口和类。\n\n## Path (路径)\n\n大多数文件按分级结构（称为树）排列。根节点（例如\
  \ `C:\\`）位于层次结构的顶端，随后是文件夹。所有文件夹都包含包含文件夹和文件的能力。一个路径标识了树中的特定资源（文件或文件夹）。因此，路径 `C:\\\
  javaselenium\\input_output\\test.txt` 标识了位于 `javaselenium` 文件夹下的 `input_output`\
  \ 文件夹中的 `test` 文件。以下是 Java 文件系统的常用 `Path` 接口方法：\n\n### Path 转换\n\n- `toAbsolutePath()`\
  \ 返回绝对路径的 `Path` 对象 |\n- `toRealPath(LinkOption… options)` 返回现有文件的真实路径 |\n- `toUri()`\
  \ 返回此路径的 URI |\n\n### 获取路径信息\n\n- `getFileName()` 返回 `Path` 对象中的文件名或最后一个元素 |\n-\
  \ `getName(int index)` 返回对应于指定索引的 `Path` 元素 |\n- `getNameCount()` 返回路径名称元素的数量\n\
  - `getParent()` 返回父路径或 null |\n- `getRoot()` 返回路径的根\n- `normalize()` 返回去除了冗余名称元素的路径\
  \ |\n- `resolve(Path other)` 对此路径解析指定路径 |\n- `relativize(Path other)` 构建此路径与指定路径之间的相对路径\
  \ |\n- `subPath(int beginIndex, int endIndex)` 返回由起始和结束索引指定的 `Path` 子序列 |\n- `toString`\
  \ 返回路径的字符串表示 |\n\n\n\n\n\n* `isReadable(Path path)`\n    测试该资源是否可读\n\n* `isSameFile(Path\
  \ path, Path path2)`\n    测试两个资源是否指向同一个资源\n\n* `isWritable(Path path)`\n    测试该资源是否可写\n\
  \n### 拷贝方法\n\n* `copy(Path source, Path target, CopyOption… options)`\n    将资源拷贝到指定的\
  \ target\n\n### 创建方法\n\n* `createFile(Path path, FileAttribute<?>... attrs)`\n \
  \   创建一个新的空资源\n\n### 删除方法\n\n* `Delete(Path path)`\n    删除该资源\n    注意：文件夹必须在为空时才能被删除\n\
  \n### 目录方法\n\n* `list()`\n    返回一个字符串数组，包含由此抽象路径指示的目录中的资源和目录名称\n\n* `listFiles()`\n\
  \    返回一个抽象路径数组，指示由此抽象路径指示的目录中的文件\n\n### 移动方法\n* [移动](https://docs.oracle.com/javase/7/docs/api/java/nio/file/Files.html#move%28java.nio.file.Path,%20java.nio.file.Path,%20java.nio.file.CopyOption...%29)\
  \ ([Path](https://docs.oracle.com/javase/7/docs/api/java/nio/file/Path.html)源, [Path](https://docs.oracle.com/javase/7/docs/api/java/nio/file/Path.html)目标,\
  \ [CopyOption](https://docs.oracle.com/javase/7/docs/api/java/nio/file/CopyOption.html)...\
  \ 选项)\n    将资源移动或重命名到目标\n\n### 读取方法\n\n* `readAllBytes(Path path)`\n    从资源中读取所有字节\n\
  \n* `readAllLines(Path path, Charset cs)`\n    从资源中读取所有行\n\n### 空间方法\n\n* `length()`\n\
  \    返回由此抽象路径指示的资源的长度\n\n* `getFreeSpace()`\n    返回由此抽象路径指示的分区中未分配的字节数\n\n* `getTotalSpace()`\n\
  \    返回由此抽象路径指示的分区的大小\n\n* `getUsableSpace()`\n    返回在由此抽象路径指示的分区上该虚拟机可用的字节数\n\n\
  ### 写入方法\n\n* `write(Path path, byte[] bytes, OpenOption… options)`\n    将字节写入资源\n\
  \n* `write(Path path, Iterable<? extends CharSequence> lines Charset cs, OpenOption…\
  \ options)`\n    将文本行写入资源\n\n## 结论\n\nJava 是一种以对象为中心的流行面向对象编程 (OOP) 语言。“第二部分 – Java\
  \ 4 Selenium WebDriver”的目标是提供 Java 的深度概念。Java 的优点之一是代码的可重用性。以下是书中的核心要点：\n\n- 类：类是对象的模板，包含数据以及操作这些数据的代码。\n\
  - 对象：对象是面向对象编程的基础。它包含两个特征：状态和行为。状态标识对象，行为代表对象的操作。\n- 方法：方法是执行特定任务的代码块。\n- 继承：继承是一种层次化概念，允许扩展可重用的代码和对象。\n\
  - 包：包是相关类的集合。\n- 接口：接口是相关方法的集合。\n- 错误：错误是程序中不可避免的问题。\n- 异常：异常是在运行时发生的错误。\n- 调试：调试是检测并移除程序中意外状况的过程。\n\
