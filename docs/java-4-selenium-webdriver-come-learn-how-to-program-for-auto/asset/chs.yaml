  \n没有方法体的接口方法只包含方法的签名。\n\n以下是接口的语法：\n\n## 语法\n\n```\naccessmodifier interface interfaceName\
  \ extends interfaceName1, interfaceN\n{\n    variableType methodName1 (parameter-list);\n\
