    \ ENG101;` – The left side of the assignment declares a variable called `ENG101`\
    \ of type `English`.\n2. `ENG101 = new English ();` – The right side of the assignment\
    \ creates a copy of the object and gives `ENG101` a reference to the object.\n\
    \nThe syntax for utilizing the dot (`.`) operator is:\n\n```\nobjectName.MemberName\n\
    ```\n\nThe dot operator connects an object with a member (instance variable or\
    \ method). In this example, an object name (`ENG101`) is located on the left and\
    \ the instance variables (`students`, `weeks`, `days`) are located on the right.\
    \ An object hold its own instance variable copy defined by the class. Therefore,\
    \ if multiple objects exist, each object can hold a different value than the other.\
    \ The following example illustrate a creation of two objects (`ENG101` and `ENG202`):\n\
    \n```\nclass English\n{\n    int students;\n    int weeks;\n    int days;\n}\n\
    \nclass TwoEnglishCourses\n{\n    public static void main (String args[])\n  \
