    \ to inherit a class or override a class member (method or variable) declared\
    \ as final.\n\nChapter 4 explained inheritance, superclass, and subclass. Inheritance\
    \ is a hierarchical concept which allows reusable code and objects to be extended.\
    \ Superclass is the parent class to subclass whereby subclass inherits the class\
    \ members. Chapter 5 will dive into packages which is a group of related classes.\n\
    \nChapter 5\n\nPackages\n\nA package is a collection of related classes whereby\
    \ the package operates like a folder to organize code. The classes within a package\
    \ are accessed by the package name. Recall from Part 1 – Java 4 Selenium WebDriver,\
    \ that an error occurs if a class makes use of the private access modifier. However,\
    \ a class can be made private and not accessed by code outside of the package\
    \ by using no modifier. A package defines a unique namespace which prevents multiple\
    \ classes of having the same name within a package. In Java, there is no problem\
    \ with  different packages using the same class name.\n\nChapter 5 will explain\
