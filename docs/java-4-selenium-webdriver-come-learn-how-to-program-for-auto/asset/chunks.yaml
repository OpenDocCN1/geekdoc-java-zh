    The following is a screenshot of the Debug perspective:


    ![C:\Users\REXAJO~1\AppData\Local\Temp\SNAGHTML212f7aa6.PNG](images/00066.jpeg)


    Figure 7.24 – Debug Perspective Screenshot


    ## Step Through The Program


    Stepping through the program is when the debugger steps/executes a line of code
    one line at a time. The process of stepping helps the programmer understand how
    the logic works. Function keys `F5`, `F6`, `F7`, and `F8` control execution of
    stepping through the program.


    - Step Into (`F5`) – Executes only the current code line. The debugger pauses
    at every line of code that is stepped into including a called method.

    - Step Over (`F6`) – Executes the current method without displaying every step.
    The debugger stays in the main routine while the subroutines execute in the background.

    - Step Return (`F7`) – Executes the current method in the background while returning
    to the method that was stepped into.

    - Resume (`F8`) – Executes until the next breakpoint


    Chapter 7 discussed errors, exceptions, and debugging. An error is a problem in
    the program. The three types of errors are syntax, runtime, and logical. Exceptions
    are errors that occur at runtime. However, an exception handler allows a block
    of code to manage the exceptions. Therefore the exception allows execution to
    continue after responding to the problem. Debugging is a process that permits
    a programmer to detect and resolve all errors. Chapter 8 is an introduction Java’s
    input/output system.


    ## Chapter 8: Utilizing Input and Output


    Java’s Input/Output (I/O) package `java.io` contains many classes, interfaces,
    and methods. The package provides input and output streams that reads/writes data.
    Data is read from an input source and written to an output destination. An input
    source and output destination is anything that contains information such as a
    file, string, or memory. Input is data received by the program and output is data
    sent from the program. A program can be a web browser which receives and sends
    data.


    Chapter eight is an introduction which covers the following regarding Java’s large
    Input/Output system:


    - [Streams](#part0000_split_075.html__Streams)

    - [File Input/Output](#part0000_split_080.html__File_Input_Output)


    ## Streams


    Programs in Java perform input and output through streams. Streams represent a
    sequence of data that is read or written. Therefore streams have the ability to
    pass data or perform transformations on data. According to [Oracle](https://docs.oracle.com/javase/7/docs/api/java/io/package-summary.html#package_description),
    the `InputStream` class is an abstract superclass of all classes representing
    an input stream of bytes. The `OutputStream` class is an abstract superclass of
    all classes representing an output stream of bytes. Therefore the I/O classes
    is an abstraction that supplies or consumes information. Streams provide a variety
    of data formats.


    ### Byte Streams


    Byte stream classes are derived from an `InputStream` and `OutputStream`. Programs
    using byte streams provide functionality and manage details of reading/writing.
    The following is a list of byte stream classes.


    | Byte Stream | Description |

    | :--- | :--- |

    | `BufferedInputStream` | Adds functionality to another input stream-namely, the
    ability to buffer the input and to support the mark and reset methods |

    | `BufferedOutputStream` | Implements a buffered output stream |

    | `ByteArrayInputStream` | Input stream that reads from a byte array |

    | `ByteArrayOutputStream` | Output stream that writes to a byte array |

    | `DataInputStream` | An input stream that includes methods for reading the Java
    standard data types |

    | `DataOutputStream` | An output stream that includes methods for writing the
    Java standard data types |

    | `FileInputStream` | Input stream that reads from a file |

    | `FileOutputStream` | Output stream that writes to a file |

    | `InputStream` | Abstract class that is the superclass of all classes representing
    an input stream of bytes |

    | `ObjectInputStream` | Input stream for objects |

    | `ObjectOutputStream` | Output stream for objects |

    | `OutputStream` | Abstract class that is the superclass of all classes representing
    an output stream of bytes |

    | `PipedInputStream` | Provides data bytes that are written to the piped output
    stream |

    | `PipedOutputStream` | Connected to a piped input stream to create a communications
    pipe |

    | `PrintStream` | Output stream that contains `print()` and `println()` |

    | `PushbackInputStream` | Input stream that allows bytes to be returned to the
    stream |

    | `SequenceInputStream` | Represents the logical concatenation of other input
    streams. |


    Figure 8.1 – Byte Stream


    The following is a list of `InputStream` methods:


    | InputStream Method | Description |

    | :--- | :--- |

    | `abstract int read()` | Reads the next byte of data from the input stream |

    | `boolean markSupported()` | Tests if this input stream supports the mark and
    reset methods |

    | `int available()` | Returns an estimate of the number of bytes that can be read
    (or skipped over) from this input stream without blocking by the next invocation
    of a method for this input stream |

    | `int read (byte[] b)` | Reads some number of bytes from the input stream and
    stores them into the buffer array `b` |

    | `int read (byte[] b, int off, int len)` | Reads up to `len` bytes of data from
    the input stream into an array of bytes |

    | `long skip (long n)` | Skips over and discards `n` bytes of data from this input
    stream |

    | `void close()` | Closes this input stream and releases any system resources
    associated with the stream |

    | `void mark (int readLimit)` | Marks the current position in this input stream
    |

    | `void reset()` | Repositions this stream to the position at the time the mark
    method was last called on this input stream |


    Figure 8.2 – InputStream Methods


    The following is a list of `OutputStream` methods:


    | OutputStream Methods | Description |

    | :--- | :--- |

    | `abstract void write(int b)` | Writes the specified byte to this output stream
    |

    | `void close()` | Closes this output stream and releases any system resources
    associated with the stream |

    | `void flush()` | Flushes this output stream and forces any buffered output bytes
    to be written out |

    | `void write(byte[] b)` | Writes `b.length` bytes from the specified byte array
    to this output stream |

    | `void write(byte[] b, int off, int len)` | Writes `len` bytes from the specified
    byte array starting at offset `off` to this output stream |


    Figure 8.3 – OutputStream Methods


    ## Character Stream


    Character stream classes are derived from `Reader` and `Writer` which offer similar
    methods as `InputStream` and `OutputStream`. The character stream class manages
    I/O paralleling the byte stream class. Unicode characters are translated from
    character stream classes. The following is a list of character stream classes:


    | Character Stream | Description |

    | :--- | :--- |

    | `BufferedReader` | Reads text from a character-input stream, buffering characters
    so as to provide for the efficient reading of characters, arrays, and lines. |

    | `BufferedWriter` | Writes text to a character-output stream, buffering characters
    so as to provide for the efficient writing of single characters, arrays, and strings.
    |

    | `CharArrayReader` | This class implements a character buffer that can be used
    as a character-input stream. |

    | `CharArrayWriter` | This class implements a character buffer that can be used
    as an Writer. |

    | `FileReader` | Convenience class for reading character files. |

    | `FileWriter` | Convenience class for writing character files. |

    | `FilterReader` | Abstract class for reading filtered character streams |

    | `FilterWriter` | Abstract class for writing filtered character streams |

    | `InputStreamReader` | An `InputStreamReader` is a bridge from byte streams to
    character streams: It reads bytes and decodes them into characters using a specified
    charset |

    | `LineNumberReader` | A buffered character-input stream that keeps track of line
    numbers |

