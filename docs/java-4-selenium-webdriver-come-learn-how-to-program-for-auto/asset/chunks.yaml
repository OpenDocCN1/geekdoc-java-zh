    \ two merged notions of an object. As a result, the two merged notions allow a\
    \ concept called information hiding whereby data can be hidden. Therefore by default\
    \ an object’s data can be accessed only by methods holding the object. The limited\
    \ access prevent other program components from interfering and causing errors.\
    \ If another component wants to change an object’s data then the component must\
    \ call a publicly accessible method. The following are four types of methods:\n\
    \n1. `Instance` – A method that can be accessed by objects\n2. `Class` – A method\
    \ shared between all objects in a class\n3. `Main` – A special method used to\
