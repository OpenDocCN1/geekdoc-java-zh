    \nThe following is an example of a private method:\n\npublic  class English\n\n\
    {\n\n public  int  students, weeks, days;\n\n private  int totalDays ()\n\n             \
    \ {\n\n return  weeks * days;\n\n              }             \n\n}\n\nclass TwoEnglishCourses\n\
    \n{\n\n public  static  void main (String args[])\n\n              {\n\nEnglish\
    \ ENG101 = new English ();\n\nEnglish ENG202 = new English ();\n\n ENG101.students\
    \ = 10;\n\n ENG101.weeks = 4;\n\n ENG101.days = 3;\n\n ENG202.students = 12;\n\
    \n ENG202.weeks = 6;\n\n ENG202.days = 3;\n\n                            System.out.println(\"\
    The English 101 course has \" + ENG101.students + \" students and the course last\
    \ \" + ENG101.totalDays () + \" days\");\n\n                            System.out.println(\"\
    The English 202 course has \" + ENG202.students + \" students and the course last\
    \ \" + ENG202.totalDays () + \" days\");\n\n              }             \n\n}\n\
    \n##### ![](images/00017.jpeg)\n\n##### Figure 2.14 – Private Method\n\nLine 5\
    \ declares the method totalDays () with a private access modifier. That means\
    \ only members within its class “English” can access the method. Lines 26 and\
    \ 27 attempts to call method “totalDays ()” but cannot because they are located\
    \ in a different class “TwoEnglishCourses”. As a result, an error message states\
    \ “The method totalDays ()” from Type English is not visible. The following is\
