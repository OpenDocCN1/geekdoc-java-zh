    ![](img/00008.jpeg)\n### 图 2.5 – 空方法 (Void Method)\n\n程序输出：\nEnglish 101 课程有多少个学生?\
    \ 10\n该课程为 4 周，每周 3 天。\n因此，该课程的总天数为：12\nEnglish 202 课程有多少个学生? 12\n该课程为 6 周，每周\
    \ 3 天。\n因此，该课程的总天数为：18\n\n第 5 行显示了关键字 `void`，它表示该方法将不返回任何值。尽管如此，`void` 方法仅执行计算总天数的任务。第\
    \ 7 行在乘以周数和天数后打印总天数。当 `void` 方法实现带有值的 `return` 关键字时，将会显示以下错误：\n\n```java\nclass\
    \ English\n{\n    int students, weeks, days;\n    // 一个 void 方法不能返回一个值\n    void\
    \ totalDays ()\n    {\n        return weeks * days\n\n    }\n}\n```\n\n![](img/00009.jpeg)\n\
    ### 图 2.6 – 空方法错误\n\n## 向参数传递参数 (Pass Arguments To Parameters)\n\n参数（Arguments）是传递给方法的值，而形式（Parameters）接收这些值。换句话说，形式接收参数。形式变量在方法的括号内声明，并像局部变量一样运行。局部变量和形式变量仅对声明的方法可见。重要的是，可以将一个或多个参数传递给单独的形式。以下是一个向两个形式传递两个参数的示例：\n\
    \n```java\nclass English\n{\n    int totalDays (int wk, int d)\n    {\n      \
    \  return wk * d;\n    }\n}\n\nclass TwoEnglishCourses\n{\n    public static void\
    \ main (String args[])\n    {\n        English ENG101 = new English ();\n    \
    \    English ENG202 = new English ();\n        System.out.println(\"The English\
    \ 101 course is a total of \" + ENG101.totalDays (4, 3) + \" days\");\n      \
    \  System.out.println(\"The English 202 course is a total of \" + ENG202.totalDays\
    \ (6, 3) + \" days\");\n    }\n}\n```\n\n![](img/00010.jpeg)\n### 图 2.7 – 向参数传递参数\n\
    \n程序输出：\nEnglish 101 课程总共 12 天\nEnglish 202 课程总共 18 天\n\n*   第 3 行为方法 `totalDays\
    \ ()` 定义了两个形式 `wk, d`。方法可以通过逗号分隔每个形式来拥有多个形式\n*   第 16 行和第 17 行表示将对象 `ENG101` 的参数\
    \ `4, 3` 和对象 `ENG202` 的参数 `6, 3` 传递给形式 `wk, d`\n\n注意：对象可以传递给方法，并从方法中返回。\n\n##\
    \ 方法类型 (Method Types)\n\n以下是四种类型的方法：\n1. 实例方法 (Instance Methods)\n2. 类方法 (Class\
    \ Methods)\n3. 主方法 (Main Method)\n4. 构造方法 (Constructors)\n\n### 实例方法 (Instance\
    \ Methods)\n\n实例方法由对象调用（称为被调用）。因此，实例方法类似于实例变量，成员可以通过初始化的对象进行访问。然而，实例变量既可以通过对象访问，也可以不通过对象访问。以下是一个实例方法的示例：\n\
    \n```java\npublic class Lion\n{\n    void sound ()\n    {\n        System.out.println(\"\
    ROAR\");\n    }\n    public static void main (String args[])\n    {\n        Lion\
    \ maleLion = new Lion ();\n        maleLion.sound ();\n    }\n}\n```\n\n![](img/00011.jpeg)\n\
    ### 图 2.8 – 实例方法\n程序输出：\nROAR\n*   第 3 – 6 行开始实例方法 `sound`\n*   第 10 行使用关键字 `new`\
    \ 创建一个对象 `maleLion`\n*   第 11 行通过初始化的对象 `maleLion` 调用了实例方法 `sound`\n\n### 类方法\
    \ (Class Methods)\n\n类方法（称为静态方法）与类变量类似，它们使用 `static` 关键字声明。`static` 关键字意味着该成员属于类，并在所有对象之间共享。可以通过对象名或类名访问类方法。然而，当通过对象访问方法时会出现警告。因此，访问类方法的首选方式是通过类名访问。以下是一个类方法的示例：\n\
    \n```java\nclass StaticAddNumbers\n{\n    static int a, b;\n    static int addNumbers\
    \ ()\n    {\n        return a + b;\n    }\n}\n\nclass StaticExample\n{\n    public\
    \ static void main(String[] args)\n    {\n        StaticAddNumbers objAdd = new\
    \ StaticAddNumbers ();\n        objAdd.a = 20;\n        StaticAddNumbers.b = 30;\n\
    \        System.out.println(\"The addition of variables 'a + b' is \" + objAdd.addNumbers()\
    \ + \" and accessed by an object\");\n        System.out.println(\"The addition\
    \ of variables 'a + b' is \" + StaticAddNumbers.addNumbers() + \" and accessed\
    \ by a class name\");\n    }\n}\n```\n\n![](img/00012.jpeg)\n### 图 2.9 – 类方法\n\
    程序输出：\nThe addition of variables 'a + b' is 50 并通过对象访问\nThe addition of variables\
    \ 'a + b' is 50 并通过类名访问\n\n*   第 3 行声明了两个类变量 `a, b`\n*   第 5 – 7 行定义了类方法 `addNumbers`\n\
    *   第 17 行将 20 赋值给类变量 `a`。注意第 17 行旁的警告，提示：“StaticAddNumbers.a 应以静态方式访问”。此警告意味着类变量（称为静态变量）最好通过类名访问。第\
    \ 18 行没有警告，因为类名位于变量名 `b` 之前\n*   第 20 行类似于第 18 行。通过对象而非类名访问静态方法时会出现警告（例如第 21 行）\n\
    \n注意：类方法只能访问类变量并只能调用其他类方法。\n\n### 主方法 (Main Method)\n\n如果某个特定类启动程序，则主方法是唯一的且必不可少的。该方法是必要的，因为它执行程序。以下是主方法的语法：\n\
    \n```java\npublic static void main(String[] args)\n{\n // 方法体\n}\n```\n\n主方法有几个示例，但以下解释了每个组件：\n\
    *   `public` - 该方法可以被所有类访问\n*   `static` – 该方法在所有对象之间共享\n*   `void` – 该方法不返回任何值\n\
    *   `String[] args` – 该方法接收字符串参数并将其传递给程序\n\n### 构造方法 (Constructors)\n\n构造方法是一种与类名相同的特殊方法。如果没有定义构造方法，则会自动创建一个空构造。因此，所有类都包含一个构造方法，用于初始化特定类的对象。每当创建新对象时，都会调用构造方法。默认情况下，数值类型的实例变量初始化为零，引用类型初始化为\
    \ null，布尔类型初始化为 false。\n\n"
- fmt: "\nConstructors have the ability to set the initial value for an instance variable.\
    \ Recall an instance variable can be accessed and assigned a value using the [dot\
    \ operator](#part0000_split_018.html_Dot_Operator). In [Figure 2.4 – Return A\
    \ Value](#part0000_split_020.html_Figure_2_4), the following instance variables\
    \ were assigned values:\n\n`ENG101.students = 10;`\n`ENG101.weeks = 4;`\n`ENG101.days\
    \ = 3;`\n`ENG202.students = 12;`\n`ENG202.weeks = 6;`\n`ENG202.days = 3;`\n\n\
    Constructors contain [parameters](#part0000_split_021.html_parameters) which receive\
    \ [arguments](#part0000_split_021.html_arguments) when an object is created. The\
    \ following example illustrates how to pass [arguments](#part0000_split_021.html_arguments)\
    \ to a constructor:\n\n```\nclass English\n{\n    int students, weeks, days;\n\
    \n    English (int s, int w, int d) {\n        students = s;\n        weeks =\
    \ w;\n        days = d;\n    }\n\n    int totalDays () {\n        return weeks\
    \ * days;\n    }\n}\n\nclass TwoEnglishCourses\n{\n    public static void main\
    \ (String args[]) {\n        English ENG101 = new English (10, 4, 3);\n      \
    \  English ENG202 = new English (12, 6, 3);\n        System.out.println(\"The\
    \ English 101 course has \" + ENG101.students + \" students and the course last\
    \ \" + ENG101.totalDays () + \" days\");\n        System.out.println(\"The English\
    \ 202 course has \" + ENG202.students + \" students and the course last \" + ENG202.totalDays\
    \ () + \" days\");\n    }\n}\n```\n\n##### ![](images/00013.jpeg)\n##### Figure\
    \ 2.10 – Parameterized Constructor\n\nProgram Output:\nThe English 101 course\
    \ has 10 students and the course last 12 days\nThe English 202 course has 12 students\
    \ and the course last 18 days\n\nLine 5 – 10 create a constructor which defines\
    \ three parameters `s, w, d` on line 5. Each parameter is used to initialize the\
    \ instance variables `students, weeks, days` on lines 7 - 9. After lines 22 and\
    \ 23 are executed, the values `10, 4, 3` for ENG101 and values `12, 6, 3` for\
    \ ENG202 are assigned to the parameters `s, w, d`. As a result, the values are\
    \ passed to the `English()` constructor when the keyword `new` creates each object\
    \ `ENG101 and ENG202`.\n\nNote: Constructors are not defined with a method type\
    \ such as `int` or [void](#part0000_split_020.html_Method_void). Notice how line\
    \ 5 begins with `English` then define the parameters. Java allows a class to contain\
    \ multiple constructors. The feature is called constructor overloading if the\
    \ constructors contain a different parameter list.\n\n## Accessor Methods\n\n\
    Accessor methods are methods used to get and set values of private variables.\
    \ Private variables can only be accessed by code within its own class. Therefore\
    \ the accessor methods are two methods known as getters and setters defined in\
    \ the same class as the private variables.\n\nBoth methods are defined with a\
    \ prefix that begins with `get` and `set` before the method name. For example,\
    \ `getDays()` and `setDays()` are regarded as accessor methods to get the number\
    \ of days then set the number of days. The following is an example of both accessor\
    \ methods:\n\n```\nclass English\n{\n    private int students, weeks, days;\n\n\
    \    English (int s, int w, int d) {\n        students = s;\n        weeks = w;\n\
    \        days = d;\n    }\n\n    int getStudents () {\n        return students;\n\
    \    }\n\n    int getWeeks() {\n        return weeks;\n    }\n\n    int getDays()\
    \ {\n        return days;\n    }\n\n    void setStudents (int s) {\n        students\
    \ = s;\n    }\n\n    void setWeeks(int w) {\n        weeks = w;\n    }\n\n   \
    \ void setDays(int d) {\n        days = d;\n    }\n\n    int totalDays () {\n\
    \        return weeks * days;\n    }\n}\n```\n\n##### ![](images/00014.jpeg)\n\
    ##### Figure 2.11 – Accessor Methods\n* Line 3 declares all the instance variables\
    \ `students, weeks, and days` as [private](#part0000_split_026.html_Modifier_private)\n\
    * Lines 5 – 10 is the [constructor](#part0000_split_022.html_Constructors) method\n\
    * Lines 12 – 25 are the get accessor methods. Each method only/return the number\
    \ of students, weeks, and days\n* Lines 27 – 40 are set access methods. Each method\
    \ sets/modifies the number students and days\n\n## This Keyword\n\nThe word `this`\
    \ is a keyword which operates as a reference inside [instance methods](#part0000_split_022.html_Instance_Methods)\
    \ and/or [constructors](#part0000_split_022.html_Constructors). It refers to the\
    \ current object or member of the current object whose method is being called.\
    \ The keyword `this` is optional but useful when a programmer decides to hide\
    \ information. In addition, the keyword `this` prevents uncertainty in a program\
    \ when a local variable and instance variable contain the same name. A warning\
    \ message states “The assignment to variable name has no effect” if both variables\
    \ have the same name. The following example shows how to use keyword `this` when\
    \ the local variable and instance variable contain the same name:\n\n```java\n\
    public class ThisKeyword\n{\n    int testVariable = 34;\n\n    void hideInstanceVariable\
    \ () {\n        int testVariable = 15;\n        System.out.println(\"What is the\
    \ value of the local variable NOT the keyword 'this'? \" + testVariable);\n  \
    \      System.out.println(\"What is the value of the instance variable using the\
    \ keyword 'this'? \" + this.testVariable);\n    }\n\n    public static void main(String[]\
    \ args) {\n        ThisKeyword objHide = new ThisKeyword ();\n        objHide.hideInstanceVariable\
    \ ();\n    }\n}\n```\n\n##### ![](images/00015.jpeg)\n##### Figure 2.12 – This\
    \ Keyword\n\nProgram Output:\nWhat is the value of the local variable NOT using\
    \ the keyword 'this'? 15\nWhat is the value of the instance variable using the\
    \ keyword 'this'? 34\n\n* Line 3 declares and initializes an instance variable\
    \ `testVariable` to a value of 34\n* Line 7 declares and initializes a local variable\
    \ `testVariable` to a value of 15\n* Line 9 print a message which includes the\
    \ local variable `testVariable`\n* Line 10 prints a message which includes the\
    \ instance variable `this.testVariable` using the keyword `this`\n\n## Annotations\n\
    \nAccording to [dictionary.com](http://dictionary.reference.com/browse/annotation?s=t),\
    \ annotation means, “a critical or explanatory note.” Recall from Part 1 – Java\
    \ 4 Selenium WebDriver, comments are notes that help programmers understand the\
    \ program. An annotation is similar to a comment whereby they both provide information.\
    \ However, comments are ignored by the compiler while annotations supply data\
    \ to the compiler. Annotations provide metadata which is data that describes data.\n\
    \nAll annotations start with an at `@` symbol and specify the purpose of a method.\
    \ Some annotations can be customized to replace comments and predefined annotations\
    \ such as `@Override`. The following are examples of three JUnit annotations used\
    \ in Selenium WebDriver:\n\n1. `@Before` – allocate resources and execute one\
    \ time before each test\n2. `@Test` – executes a test script\n3. `@After` – release\
    \ allocated resources and execute one time after each test\n\nNote: Details of\
    \ the JUnit annotations are used and explained in the “Selenium WebDriver” books.\n\
    \n## Access Modifiers\n\nAccess modifiers are helpful features of object-oriented\
    \ programming. They are helpful because of the access limitation it places on\
    \ every class and class members (variables and methods). In Java, there are four\
    \ kinds of access modifiers:\n\n1. `public` – indicates a member can be accessed\
    \ by all [classes](#part0000_split_017.html__Classes)\n"
