    \ + \" students and the course last \" + totalDays101 + \" days\");\ntotalDays202\
    \ = ENG202.weeks * ENG202.days;\nSystem.out.println(\"The English 202 course has\
    \ \" + ENG202.students + \" students and the course last \" + totalDays202 + \"\
    \ days\");\n}\n```\n\n![](img/00006.jpeg)\n\n### 图 2.3 – 创建了两个对象\n\n**程序输出：**\n\
    English 101 课程有 10 个学生，持续 12 天\nEnglish 202 课程有 12 个学生，持续 18 天\n\n第 12 行和第 13\
    \ 行创建了两个对象（`ENG101` 和 `ENG202`），然后在第 18 行至第 24 行为这两个对象赋值。请记住，如果存在多个对象，每个对象可以持有与另一个对象不同的值。在这个示例中，变量\
    \ `students` 和 `weeks` 被赋予了不同的值，但变量 `days`get 两个对象都包含相同的值 `3`。\n\n**注意：** 变量的命名约定是\
    \ `lowerCamelCase`（小驼峰命名法），即变量名除第一个单词外，每个单词的首字母大写。然而，`ENG101` 和 `ENG202` 是例外，它们包含全大写字母，因为学校课程在数字名前通常包含全大写字母。\n\
    \n# 方法 (Methods)\n\n方法是一个用大括号包围的代码块，用于执行特定的操作/任务。其目的是操作并访问由类定义的数据。换句话说，方法对数据执行操作。最好的做法是所有方法都执行单一任务。例如，一个良好的方法只会执行加数字的单一任务，而不是既加数字又将数据保存到文件中。如果一个方法执行了多个任务，程序可能会变得难以阅读和理解。\n\
    \n方法由头（header）和体（body）组成。方法头包括方法类型和方法名。方法名的命名约定与变量名相似，采用 `lowerCamelCase` 风格。除第一个单词外，每个单词的首字母大写。方法名后面必须跟有一对括号，这将变量与方法区分开来。以下是方法的语法：\n\
    \n### 语法\n\n```\nmethodType methodName (parameter-list)\n{\n    // 方法体\n}\n```\n\
    \n`methodType`（称为返回类型）决定了方法返回的数据类型。如果不返回任何值，程序员将被强制使用 `void` 关键字作为 `methodType`。`methodName`\
    \ 可以是除 Java 关键字外的任何名称。命名方法的一种良好技巧是使用“动词+名词”的组合，例如 `getOrder` 或 `addNumbers`。方法体是执行代码以完成任务的地方。参数列表是接收传递方法的\
    \ `arguments` 的变量。如果方法没有 `parameters`，则参数列表必须为空。\n\n**注意：** 方法签名（method signature）是\
    \ `methodName` 和参数列表。\n\n## 方法返回 (Method Returns)\n\n方法返回是指从方法返回值或将控制权移出方法的概念。这两个概念都通过使用\
    \ `return` 关键字来实现。无论 `return` 关键字位于何处，执行都会终止并跳过方法内的后续语句。以下是两种方法返回类型：\n\n1. 返回值的方法\n\
    2. 不能返回值的方法\n\n根据 `ORACLE` 的说明，方法在以下情况下返回到调用它的代码：\n* 完成方法中的所有语句\n* 达到 `return`\
    \ 语句或\n* 抛出异常\n\n以先发生者为准。\n\n**注意：** 通常，`return` 关键字（也称为返回语句）不用于不能返回值的方法。不使用是因为方法中的所有代码在执行\
    \ `return` 关键字之前已经完成。然而，如果使用了 `return` 关键字，它将在方法的末尾实现，以转移控制权。\n\n### 返回值 (Return\
    \ A Value)\n\n大多数方法都会返回一个值，用于指定计算的结果或结果（通过、失败等）。返回值必须与方法类型的数据类型相同。例如，如果方法类型是 `int`\
    \ 数据类型，那么返回类型必须是 `int` 数据类型。以下是方法返回的语法和示例：\n\n**语法**\n\n```\nreturn value;\n```\n\
    \n```java\nclass English\n{\n    int students, weeks, days;\n    int totalDays\
    \ ()\n    {\n        return weeks * days;\n    }\n}\n\nclass TwoEnglishCourses\n\
    {\n    public static void main (String args[])\n    {\n        English ENG101\
    \ = new English ();\n        English ENG202 = new English ();\n        ENG101.students\
    \ = 10;\n        ENG101.weeks = 4;\n        ENG101.days = 3;\n        ENG202.students\
    \ = 12;\n        ENG202.weeks = 6;\n        ENG202.days = 3;\n        System.out.println(\"\
    The English 101 course has \" + ENG101.students + \" students and the course last\
    \ \" + totalDays101 + \" days\");\n        System.out.println(\"The English 202\
    \ course has \" + ENG202.students + \" students and the course last \" + totalDays202\
    \ + \" days\");\n    }\n}\n```\n\n### 图 2.4 – 返回一个值\n\n**程序输出：**\nEnglish 101\
    \ 课程有 10 个学生，持续 12 天\nEnglish 202 课程有 12 个学生，持续 18 天\n\n`.` 运算符将 `ENG101` 和 `ENG202`\
    \ 连接到成员 `totalDays()`。`totalDays()` 位于点运算符的右侧。\n\n#### 无返回值 (Return No Value)\n\
    \n不能返回值的方法是 `void` 方法。关键字 `void` 被用作方法类型，而不是 `int`。\n\n```java\nclass English\n\
    {\n    int students, weeks, days;\n    void totalDays ()\n    {\n        // 没有返回语句\n\
    \    }\n}\n\nclass TwoEnglishCourses\n{\n    public static void main (String args[])\n\
    \    {\n        English ENG101 = new English ();\n        English ENG202 = new\
    \ English ();\n        ENG101.students = 10;\n        ENG101.weeks = 4;\n    \
    \    ENG101.days = 3;\n        ENG202.students = 12;\n        ENG202.weeks = 6;\n\
    \        ENG202.days = 3;\n        System.out.println(\"How many students are\
    \ in the English 101 course? \" + ENG101.students);\n        System.out.println(\"\
    The course is \" + ENG101.days + \" days for \" + ENG101.weeks + \" weeks.\");\n\
    \        System.out.print(\"Therefore the course last the following total number\
    \ of days:\");\n        ENG101.totalDays();\n        System.out.println(\"\\n\"\
    );\n        System.out.println(\"How many students are in the English 202 course?\
    \ \" + ENG202.students);\n    }\n}\n```\n\n"
