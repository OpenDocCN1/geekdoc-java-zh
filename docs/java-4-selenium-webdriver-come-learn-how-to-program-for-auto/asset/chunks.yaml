    \ and Access Variables\n\nProgram Output:\nThe English 101 course is a total of\
    \ 12 days\n\nLine 12 creates a new object (`English ENG101 = new English ();`)\
    \ by combining two steps. According to Java A Beginner’s Guide Sixth Edition (2014),\
