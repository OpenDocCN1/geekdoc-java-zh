  trans: "\n\n*   当代码在数组 `evenNumbers[]` 中搜索不存在的索引时，执行第 23 行。当找到此异常类型的匹配项时，其他 catch\
    \ 块将被忽略。\n\n# Finally 块\n\n`finally` 块是 `try` / `catch` 块的扩展。该块确保无论是否发生异常，某些操作（如向文件写入数据）都会执行。Java\
    \ 允许相同的操作放在 `try` 块和 `catch` 块中。另一方面，在两个块（`try block and catch block`）中放置相同的代码会导致代码重复。\n\
    \n例如，如果没有发生异常且需要将数据写入文件会发生什么。在这种情况下，`try` 块执行代码，而 `catch` 块被跳过。然而，如果发生异常，`catch`\
    \ 块执行代码，而 `try` 块被跳过。因此，程序员必须将代码置于 `try` 和 `catch` 块中，以确保数据被写入文件。在编程中，重复代码是难以阅读和维护。`finally`\
    \ 块不是必须的，但当抛出异常和未抛出异常时，它无疑会将数据写入文件。以下是 `try/catch/finally` 块的语法：\n\n## 语法\n\n\
    ```java\ntry\n{\n // 由 try 块监控的代码\n}\ncatch (ExceptionType1 excObject)\n{\n  \
    \  // ExceptionType1 的异常处理器\n}\ncatch (ExceptionType2 excObject)\n{\n    // ExceptionType2\
    \ 的异常处理器\n}\nfinally\n{\n // 无论是否发生异常都执行代码\n}\n```\n\n以下是一个使用 `try/catch/finally`\
    \ 块的示例：\n\n```java\npublic class FinallyBlock\n{\n public static void main(String[]\
    \ args)\n{\n int oddNumbers[] = {11, 33, 55, 77, 99, 111};\n int evenNumbers[]\
    \ = {0, 2, 4, 6, 8};\n for (int i = 0; i < oddNumbers.length; i++)\n         \
    \                       {\n try\n                                    {\n     \
    \                           System.out.println(\"What is \" + oddNumbers[i] +\
    \ \"/\" + evenNumbers[i] + \"? \"\n+ \"\" + oddNumbers[i]/evenNumbers[i]);\n \
    \                                   }\n catch (ArithmeticException except)\n \
    \                                   {\n                                System.out.println(\"\
    Exception!!! - Cannot divide a number by zero\");\n                          \
    \      }\n catch (ArrayIndexOutOfBoundsException except)\n                   \
    \                 {\n                                System.out.println(\"Exception!!!\
    \ - Cannot locate the index\");\n                                }\n finally\n\
    {\n                                System.out.println(\"  Perform Action\");\n\
    \                            }\n }\n}\n}\n```\n![](img/0060.jpeg)\n\n### 图 7.16\
    \ – Finally 块\n\n程序输出:\n```\nException!!! - Cannot divide a number by zero\nPerform\
    \ an Action\nWhat is 33/2? 16\nPerform an Action\nWhat is 55/4? 13\nPerform an\
    \ Action\nWhat is 77/6? 12\nPerform an Action\nWhat is 99/8? 12\nPerform an Action\n\
    Exception!!! - locate the index\nPerform an Action\n```\n*   第 25 行在 `try/catch`\
    \ 块结束时开始 `finally` 块\n*   第 27 行在抛出异常和未抛出异常时都会自动执行\n\n# 捕获 Throwable 异常\n\n`Throwable`\
    \ 异常可以用于捕获所有异常，因为它是父类。超类 `Throwable` 匹配其所有子类，包括 `RuntimeException`。为了捕获这两个类的异常，必须在各自的\
    \ catch 块中实现该超类和子类。以下是一个使用图 7.15 代码编写的 `Throwable` 超类和 `ArithmeticException` 子类的示例：\n\
    \n```java\npublic class SuperSubClassException\n{\n public static void main(String[]\
    \ args)\n{\n int oddNumbers[] = {11, 33, 55, 77, 99, 111};\n int evenNumbers[]\
    \ = {0, 2, 4, 6, 8};\n for (int i = 0; i < oddNumbers.length; i++)\n         \
    \                       {\n try\n                                    {\n     \
    \                           System.out.println(\"What is \" + oddNumbers[i] +\
    \ \"/\" + evenNumbers[i] + \"? \"\n+ \"\" + oddNumbers[i]/evenNumbers[i]);\n \
    \                                   }\n catch (ArithmeticException except)\n \
    \                                   {\n                                System.out.println(\"\
    Exception!!! - Cannot divide a number by zero\");\n                          \
    \      }\n catch (Throwable except)\n                                    {\n \
    \                               System.out.println(\"Exception!!! - The Throwable\
    \ Exception caught an error\");\n                            }\n }\n}\n}\n```\n\
    ![](img/0061.jpeg)\n\n### 图 7.17 – Throwable 和 ArithmeticException 示例\n\n程序输出:\n\
    ```\nException!!! - Cannot a number by zero\nWhat is 33/2? 16\nWhat is 55/4? 13\n\
    What is 77/6? 12\nWhat is 99/8? 12\nException!!! - The Throwable Exception caught\
    \ an error\n```\n*   第 18 行在第一个 catch 块中实现了子类异常 `ArithmeticException`\n*   当代码到达数组\
    \ `evenNumbers[]` 中的零 `0` 时，执行第 20 行\n*   第 22 行在第二个 catch 块中实现了 `Throwable` 异常\n\
    *   当代码在数组 `evenNumbers[]` 中搜索不存在的索引时，执行第 24 行\n\n`Throwable` 超类和子类允许通过放在第一个 catch\
    \ 块来捕获异常。如果 `Throwable` 异常实现在第一个块，则会发生错误。错误信息为“Unreachable catch block for Throwable”。\n\
    \n# Throwable 定义的方法\n\n如所述，`Throwable` 是每个异常子类的超类。因此所有异常都支持 `Throwable` 定义的方法。可以使用\
    \ `Throwable` 异常进行捕获，但它是通用的。在处理异常时，最好使用特定的异常如 `ArithmeticException`。以下是 `Throwable`\
    \ 定义的方法列表：\n\n| 方法 | 说明 |\n| :--- | :--- |\n| [fillInStackTrace](https://www.cis.upenn.edu/%7Ebcpierce/courses/629/jdkdocs/api/java.lang.Throwable.html#fillInStackTrace%28())\
    \ | 填充完整的执行堆栈 |\n| [getLocalizedMessage](https://www.cis.upenn.edu/%7Ebcpierce/courses/629/jdkdocs/api/java.lang.Throwable.html#getLocalizedMessage%28())\
    \ | 创建 `Throwable` 异常的本地化描述 |\n| [getMessage](https://www.cis.upenn.edu/%7Ebcpierce/courses/629/jdkdocs/api/java.lang.Throwable.html#getMessage%28())\
    \ | 返回 `Throwable` 异常的详细信息 |\n| [printStackTrace](https://www.cis.upenn.edu/%7Ebcpierce/courses/629/jdkdocs/api/java.lang.Throwable.html#printStackTrace%28())\
    \ | 打印堆栈跟踪 |\n| [printStackTrace](https://www.cis.upenn.edu/%7Ebcpierce/courses/629/jdkdocs/api/java.lang.Throwable.html#printStackTrace%28java.io.PrintStream%29)(PrintStream)\
    \ | 向指定的打印流打印堆栈跟踪 |\n| [printStackTrace](https://www.cis.upenn.edu/%7Ebcpierce/courses/629/jdkdocs/api/java.lang.Throwable.html#printStackTrace%28java.io.PrintWriter%29)(PrintWriter)\
    \ | 向指定的打印写入器打印堆栈跟踪 |\n| [toString](https://www.cis.upenn.edu/%7Ebcpierce/courses/629/jdkdocs/api/java.lang.Throwable.html#toString%28())\
    \ | 在被 `println()` 方法调用后返回简短的异常描述 |\n\n### 图 7.18 – Throwable 定义的方法\n\n"
- fmt: "\nOne of the most common methods defined by `Throwable` is the [`printStackTrace()`](https://www.cis.upenn.edu/%7Ebcpierce/courses/629/jdkdocs/api/java.lang.Throwable.html#printStackTrace%28%29)()\
    \ method. This method prints the stack trace “standard error message”. The following\
    \ is an example of `printStackTrace()` method:\n\n```java\npublic class ThrowableMethod\
    \ {\n    public static void main(String[] args) {\n        int oddNumbers[] =\
    \ {11, 33, 55, 77, 99, 111};\n        int evenNumbers[] = {0, 2, 4, 6, 8};\n \
    \       for (int i = 0; i < oddNumbers.length; i++) {\n            try {\n   \
    \             System.out.println(\"What is \" + oddNumbers[i] + \"/\" + evenNumbers[i]\
    \ + \"? \"\n+ \"\" + oddNumbers[i]/evenNumbers[i]);\n            } catch (ArithmeticException\
    \ exceptName) {\n                System.out.println(\"Exception!!! - Cannot divide\
    \ a number by zero\");\n            } catch (Throwable exceptName) {\n       \
    \         System.out.println(\"Exception!!! - The Throwable Exception caught the\
    \ following error:\" + \"\\n\");\n                exceptName.printStackTrace();\n\
    \            }\n        }\n    }\n}\n```\n\n### Figure 7.19 – Print Trace\n**Program\
    \ Output:**\n```text\nWhat is 33/16\nWhat is 55/13\nWhat is 77/6\nWhat is 99/8\n\
    Exception!!! - The Throwable Exception caught the following error:\njava.lang.ArrayIndexOutOfBoundsException:\
    \ 5\nat ThrowableMethod.main(ThrowableMethod.java:4)\n```\n* Line 2 defines the\
    \ second `catch` block with an object `exceptName` that will be used to display\
    \ the exception\n* Line 4 creates the `printStackTrace()` method using the exception\
    \ object followed by the dot operator\n\n## Throw vs Throws\n\nThe keyword `throw`\
    \ is used to explicitly throw an exception. An object of the exception class `Throwable`\
    \ must be created to throw an exception. There are two ways to manually throw\
    \ an exception:\n1. Use a parameter in the `catch` block\n2. Create an object\
    \ using the `new` operator\n\nThe following is the syntax for manually throwing\
    \ an exception:\n```java\nthrow excObject\n```\n\nThe following is an example\
    \ of throwing an exception using the `new` operator:\n```java\npublic class ThrowTest\
    \ {\n    int DivideByZero(int num1, int num2) {\n        if (num2 == 0) {\n  \
    \          System.out.println(\"An error has been thrown\");\n            throw\
    \ new ArithmeticException(\"Exception!!! - Cannot divide a number by zero\");\n\
    \        } else {\n            return num1/num2;\n        }\n    }\n    public\
    \ static void main(String[] args) {\n        try {\n            ThrowTest objThrow\
    \ = new ThrowTest ();\n            System.out.println(objThrow.DivideByZero(34,\
    \ 0));\n        } catch (Exception exc) {\n            System.out.println(exc.getMessage());\n\
    \        } finally {\n            System.out.println(\" Perform an action if exception\
    \ thrown or \");\n        }\n    }\n}\n```\n\n### Figure 7.20 – Throw Example\n\
    **Program Output:**\n```text\nAn error has not been thrown\nException!!! - Cannot\
    \ divide a number by zero\nPerform an action if thrown or not\n```\n* Line 10\
    \ creates an exception using keywords `throw` and `new`. The keyword `new` is\
    \ used to construct an instance of `ArithmeticException` with a String parameter.\n\
    * Line 24 passes the values `34` and `0` to method `DivideByZero` which starts\
    \ at line 5. Variable `num2` receives `0` which causes the exception\n* Line 28\
    \ displays the string parameter from line 10 by calling method `getMessage()`\n\
    \nThe keyword `throws` is used to explicitly define exceptions that a method might\
    \ throw. Therefore, a method call must handle all of the exceptions if a declared\
    \ method has one or more exceptions using the keyword `throws`. The following\
    \ is an example using `throws` to define an exception list:\n```java\nmethod methodName\
    \ (parameter-list) throws exc-list {\n    // Method Body\n}\n```\n\nThe following\
    \ is an example using `throws` to define an exception:\n```java\npublic class\
    \ ThrowsKeywordTest {\n    static void throwMethod () throws NullPointerException\
    \ {\n        System.out.println(\"An error has not been thrown\");\n        throw\
    \ new NullPointerException (\"Exception!!! - Null Pointer\");\n    }\n    public\
    \ static void main(String[] args) {\n        try {\n            throwMethod ();\n\
    \        } catch (NullPointerException exc) {\n            System.out.println(\"\
    Exception Type \" + exc);\n        }\n    }\n}\n```\n\n### Figure 7.21 – Throws\
    \ Example\n* Line 5 defines an exception `NullPointerException` using the keyword\
    \ `throws`.\n* Line 15 calls `throwMethod()` which has an exception\n* Line 19\
    \ displays the NullPointerException\n\nThe following describes the differences\
    \ between `throw` and `throws`:\n\n| Throw | Throws |\n| :--- | :--- |\n| Can\
    \ throw one exception | Can declare multiple exceptions |\n| Followed by an instance\
    \ | Followed by exception class |\n| Used within a method’s body | Used within\
    \ a method’s signature |\n\n## Debugging\n\nAt some point while developing a program,\
    \ the program will consist of errors andor exceptions. The key for every programmer\
    \ is to learn how to debug the program. Debugging is the process of detecting\
    \ and removing unexpected conditions from the program. An IDE such as Eclipse\
    \ provides a debugger tool which facilitate the debugging process. The tool allows\
    \ a programmer to execute their code-by-line to view what is happening on each\
    \ line.\n\n## Breakpoints\n\nTo start the debugging process, a breakpoint must\
    \ be placed in the program. The purpose of breakpoints is to pause execution of\
    \ the program. As a result, the program runs up to the breakpoint until the debugger\
    \ receives additional instructions on what to do next. A program can have several\
    \ breakpoints set or cleared at anytime. The following is a list of ways to set\
    \ or clear a breakpoint:\n\n1. Double-click the left of the desired line number\n\
    2. Move the cursor to the left of the desired line number, right-click the mouse,\
    \ then select Toggle Breakpoint\n3. Move the cursor to the desired line and press\
    \ shortcut keys `Ctrl + Shift + B`\n\nA blue dot is located next to the line number\
    \ after setting the breakpoint. Next, the programmer must open the Debug perspective\
    \ which provides a combination of views and editors to debug a program. The Debug\
    \ perspective can be opened the following ways:\n\n1. Press `11`\n2. Right-click\
    \ inside the program, select Debug As, then Java\n3. Click Run then select Debug\
    \ As, then Java Application\n4. Shortcut keys `Alt + Shift + D, J`\n\nNote: Select\
    \ Yes when Eclipse displays a Confirm Perspective Switch dialogue.\n\n### Figure\
    \ 7.23 – Confirm Perspective Switch Screenshot\n"
