  trans: "\n\n`Throwable` 定义的最常用方法之一是 [`printStackTrace()`](https://www.cis.upenn.edu/%7Ebcpierce/courses/629/jdkdocs/api/java.lang.Throwable.html#printStackTrace%28%29)()\
    \ 方法。该方法会将堆栈跟踪打印到“标准错误”。以下是 `printStackTrace()` 方法示例：\n\n```java\npublic class\
    \ ThrowableMethod {\n    public static void main(String[] args) {\n        int\
    \ oddNumbers[] = {11, 33, 55, 77, 99, 111};\n        int evenNumbers[] = {0, 2,\
    \ 4, 6, 8};\n        for (int i = 0; i < oddNumbers.length; i++) {\n         \
    \   try {\n                System.out.println(\"What is \" + oddNumbers[i] + \"\
    /\" + evenNumbers[i] + \"? \"\n+ \"\" + oddNumbers[i]/evenNumbers[i]);\n     \
    \       } catch (ArithmeticException exceptName) {\n                System.out.println(\"\
    Exception!!! - Cannot divide a number by zero\");\n            } catch (Throwable\
    \ exceptName) {\n                System.out.println(\"Exception!!! - The Throwable\
    \ Exception caught the following error:\" + \"\\n\");\n                exceptName.printStackTrace();\n\
    \            }\n        }\n    }\n}\n```\n\n### 图 7.19 – 打印跟踪\n**程序输出：**\n```text\n\
    What is 33/16\nWhat is 55/13\nWhat is 77/6\nWhat is 99/8\nException!!! - The Throwable\
    \ Exception caught the following error:\njava.lang.ArrayIndexOutOfBoundsException:\
    \ 5\nat ThrowableMethod.main(ThrowableMethod.java:4)\n```\n* 第 2 行定义了第二个 `catch`\
    \ 块，使用了一个对象 `exceptName`，该对象将用于显示异常\n* 第 4 行使用异常对象并通过点操作符调用创建了 `printStackTrace()`\
    \ 方法\n\n## Throw vs Throws\n\n`throw` 关键字用于显式地抛出异常。必须创建一个 `Throwable` 异常类的对象来抛出异常。手动抛出异常有两种方法：\n\
    1. 在 `catch` 块中使用参数\n2. 使用 `new` 运算符创建对象\n\n以下是手动抛出异常的语法：\n```java\nthrow excObject\n\
    ```\n\n以下是使用 `new` 运算符抛出异常的示例：\n\n```java\npublic class ThrowTest {\n    int DivideByZero(int\
    \ num1, int num2) {\n        if (num2 == 0) {\n            System.out.println(\"\
    An error has been thrown\");\n            throw new ArithmeticException(\"Exception!!!\
    \ - Cannot divide a number by zero\");\n        } else {\n            return num1/num2;\n\
    \        }\n    }\n    public static void main(String[] args) {\n        try {\n\
    \            ThrowTest objThrow = new ThrowTest ();\n            System.out.println(objThrow.DivideByZero(34,\
    \ 0));\n        } catch (Exception exc) {\n            System.out.println(exc.getMessage());\n\
    \        } finally {\n            System.out.println(\" Perform an action if exception\
    \ thrown or \");\n        }\n    }\n}\n```\n\n### 图 7.20 – Throw 示例\n**程序输出：**\n\
    ```text\nAn error has not been thrown\nException!!! - Cannot divide a number by\
    \ zero\nPerform an action if thrown or not\n```\n* 第 10 行使用关键字 `throw` 和 `new`\
    \ 创建了一个异常。关键字 `new` 用于构造一个带有字符串参数的 `ArithmeticException` 实例\n* 第 24 行将值 `34` 和\
    \ `0` 传递给从第 5 行开始的 `DivideByZero` 方法。变量 `num2` 接收到 `0` 导致异常\n* 第 28 行通过调用 `getMessage()`\
    \ 方法显示第 10 行的字符串参数\n\n`throws` 关键字用于显式定义方法可能抛出的异常。因此，如果一个声明的方法使用 `throws` 关键字声明了一个或多个异常，则方法调用处必须处理所有异常。以下是使用\
    \ `throws` 定义异常列表的示例：\n```java\nmethod methodName (parameter-list) throws exc-list\
    \ {\n    // 方法体\n}\n```\n\n以下是使用 `throws` 定义异常的示例：\n\n```java\npublic class ThrowsKeywordTest\
    \ {\n    static void throwMethod () throws NullPointerException {\n        System.out.println(\"\
    An error has not been thrown\");\n        throw new NullPointerException (\"Exception!!!\
    \ - Null Pointer\");\n    }\n    public static void main(String[] args) {\n  \
    \      try {\n            throwMethod ();\n        } catch (NullPointerException\
    \ exc) {\n            System.out.println(\"Exception Type \" + exc);\n       \
    \ }\n    }\n}\n```\n\n### 图 7.21 – Throws 示例\n* 第 5 行使用关键字 `throws` 定义了异常 `NullPointerException`\n\
    * 第 15 行调用了 `throwMethod()`，该方法包含一个异常\n* 第 19 行显示了 NullPointerException\n\n以下描述了\
    \ `throw` 和 `throws` 之间的差异：\n\n| Throw | Throws |\n| :--- | :--- |\n| 可以抛出一个异常\
    \ | 可以声明多个异常 |\n| 后面跟着实例 | 后面跟着异常类 |\n| 在方法体内部 | 在方法签名中使用 |\n\n## 调试\n\n在开发程序的某个时刻，程序将包含错误和或异常。对于每个程序员来说，关键在于学习如何调试程序。调试是检测并移除程序中意外状况的过程。像\
    \ Eclipse 这样的 IDE 提供了调试工具来辅助调试过程。该工具允许程序员逐行执行代码，以查看每行发生了什么。\n\n## 断点\n\n要开始调试过程，必须在程序中放置断点。断点的目的是暂停程序的执行。结果是，程序运行到断点处，直到调试器接收到后续操作指令。程序可以随时设置或清除多个断点。以下是设置或清除断点的方法列表：\n\
    \n1. 双击目标行号左侧\n2. 将光标移动到目标行号左侧，右键点击鼠标，然后选择切换断点\n3. 将光标移动到目标行并按下快捷键 `Ctrl + Shift\
    \ + B`\n\n设置断点后，行号旁边会出现一个蓝点。接下来，程序员必须打开调试视图，该视图提供了各种视图和编辑器的组合用于调试程序。调试视图可以通过以下方式打开：\n\
    \n1. 按 `11`\n2. 在程序内部右键点击，选择 Debug As，然后选择 Java\n3. 点击 Run 然后选择 Debug As，然后 Java\
    \ Application\n4. 快捷键 `Alt + Shift + D, J`\n\n注意：当 Eclipse 显示“确认切换”对话框时，选择“是”。\n\
    \n### 图 7.23 – 确认视角切换截图\n\n"
