    \ thrown\");\n\n throw  new  NullPointerException (\"Exception!!! - Null Pointer\"\
    );\n\n              }\n\n public  static  void  main(String[] args)\n\n             \
    \ {\n\n try\n\n                            {\n\n throwMethod ();\n\n             \
    \               }\n\n catch (NullPointerException exc)\n\n                           \
    \ {\n\n                                          System.out.println(\"Exception\
    \ Type \" + exc);\n\n                            }                           \n\
    \n              }\n\n}\n\n##### ![](images/00064.jpeg)\n\n##### Figure 7.21 –\
    \ Throws Exception Example\n\n*   Line 5 defines an exception “NullPointerException”\
    \ using the keyword “throws”. Multiple exceptions can be created by way of a comma-separated\
    \ list of exceptions that the method might throw.\n\n*   Line 15 calls method\
    \ “throwMethod” which has an exception\n\n*   Line 19 displays the NullPointerException\n\
    \nThe following describes the differences between throw and throws:\n\n| Throw\
    \ | Throws |\n\n| Can throw one exception | Can declare multiple exceptions |\n\
    \n| Followed by an instance | Followed by an exception class |\n\n| Used within\
    \ a method’s body | Used within a method’s signature |\n\n##### Figure 7.22 –\
    \ Throw vs Throws\n\n# Debugging\n\nAt some point while developing a program,\
    \ the program will consist of errors and/or exceptions. The key for every programmer\
    \ is to learn how to debug the program. Debugging is the process of detecting\
    \ and removing unexpected conditions from the program. An IDE such as Eclipse\
    \ provides a debugger tool which facilitate the debugging process. The tool allows\
    \ a programmer to execute their code line-by-line to view what is happening on\
    \ each line.\n\n## Breakpoints\n\nTo start the debugging process, a breakpoint\
    \ must be placed in the program. The purpose of breakpoints is to pause execution\
    \ of the program. As a result, the program runs up to the breakpoint until the\
    \ debugger receives additional instructions on what to do next. A program can\
    \ have several breakpoints set or cleared at anytime. The following is a list\
    \ of ways to set or clear a breakpoint:\n\n1.  Double-click the left of the desired\
    \ line number\n\n2.  Move the cursor to the left of the desired line number, right-click\
    \ the mouse, then select Toggle Breakpoint\n\n3.  Move the cursor to the desired\
    \ line and press shortcut keys (Ctrl + Shift + B)\n\nA blue dot is located next\
    \ to the line number after setting the breakpoint. Next, the programmer must open\
    \ the Debug perspective which provides a combination of views and editors to debug\
    \ a program. The Debug perspective can be opened the following ways:\n\n1.  Press\
    \ F11\n\n2.  Right-click inside the program, select Debug As, then Java\n\n3.\
    \  Click Run then select Debug As, then Java Application\n\n4.  Shortcut keys\
    \ (Alt + Shift + D, J)\n\nNote: Select Yes when Eclipse displays a Confirm Perspective\
    \ Switch dialogue.\n\n##### ![](images/00065.jpeg)\n\n##### Figure 7.23 – Confirm\
    \ Perspective Switch Screenshot"
