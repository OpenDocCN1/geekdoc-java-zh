    Chapter 1


    Introduction to Object-Oriented Programming


    Object-Oriented Programming (OOP) is the most popular paradigm in programming.
    It is an approach to programming that centers around objects. As a result, identifying
    objects is one of the most essential principles in OOP. According to [dictionary.com](http://www.dictionary.com/browse/object?s=t),
    an object is anything visible or tangible. Therefore objects can be a person,
    place, or thing whereby it is recognized in programming like the real world. All
    objects have two characteristics: state and behavior. State identifies the object
    and behavior represent the actions of the object.


    Chapter 1 underlines object-oriented programming (OOP) by providing an overview
    of this book “Part 2 – Java 4 Selenium WebDriver”:  


     [Classes, Objects, and Methods](#part0000_split_009.html__Classes__Objects__and)


     [Arrays and Strings](#part0000_split_010.html__Arrays_and_Strings)


     [Inheritance](#part0000_split_011.html__Inheritance)


     [Packages](#part0000_split_012.html__Packages)


     [Interfaces](#part0000_split_013.html__Interfaces)


     [Errors, Exceptions, and Debugging](#part0000_split_014.html__Errors__Exceptions__and)


     [Utilizing Input and Output](#part0000_split_015.html__Utilizing_Input_and)


    # Classes, Objects, and Methods


    Java is an object-oriented programming (OOP) language containing classes, objects,
    and methods (see [Classes, Objects, and Methods in Chapter 2](#part0000_split_016.html_Chapter_2)).
    A class is a blueprint for creating an object and a method execute a job for the
    object. Classes include data and code that operate on the data. Objects serve
    as the foundation for OOP while methods perform actions. A method’s responsibility
    is to instruct the program what action to perform and how to perform the action.


    # Arrays and Strings


    In Java, arrays and strings are objects (see [Arrays and Strings in Chapter 3](#part0000_split_028.html_Chapter_3)).
    An array is a group of related variables with the same data type, same name, and
    fixed number of values. All items in the array are accessed by an index which
    starts at zero. On the other hand, a string is a group of unchangeable characters.
    Many methods are available for strings that facilitate an operation on the object.


    # Inheritance


    Inheritance is a hierarchical concept which allows code and objects to be reused
    (see [Inheritance in Chapter 4](#part0000_split_037.html_Chapter_4)). Each class
    allows other classes to inherit its code. As a result, the relationship between
    the classes are superclass and subclass. Superclass is the parent class and subclass
    is the child class. The classes maintain a certain amount data in common while
    holding unique characteristics.


    # Packages


    A package is a collection of related classes (see [Packages in Chapter 5](#part0000_split_048.html_Chapter_5)).
    The package is comparable to a folder and the classes are similar to files within
    the folder. Each class within the package can be accessed by the package name.
    It is important to know that a package must be imported if a class wants to use
    members from a different class.


    # Interfaces


    An interface is a collection of related methods (see [Interfaces in Chapter 6](#part0000_split_052.html_Chapter_6)).
    Generally, most interfaces do not include the body of a method. Therefore an interface
    method reveals what action to perform but not how to perform the action. This
    concept allows a class to implement the interface method and decide how to perform
    the action. Each class has the ability to implement a different action for the
    same interface method.


    # Errors, Exceptions, and Debugging


    Errors are unavoidable problems in a program. New programmers as well as experienced
    programmers will face errors. [Syntax](#part0000_split_059.html__Syntax_Errors),
    [runtime](#part0000_split_060.html__Runtime_Errors), and [logical](#part0000_split_061.html__Logical_Errors)
    are three types of errors in Java. Syntax errors stop the code from executing
    while runtime errors allow code to execute then generate an error. Logical errors
    are the most difficult errors to detect due to no error message during execution.
    The programmer must know what to expect in order to find and resolve a logical
    error.


    An exception is an error that is occurs at runtime. This type of error can be
    managed by a block of code called an exception handler. Exception handlers allow
    the program to generate an error but continue executing after the error. [Debugging](#part0000_split_071.html__Debugging)
    is a process that allows a programmer to observe then correct an error and/or
    exception. A tool called debugger simplifies the task of resolving errors due
    to [breakpoints](#part0000_split_072.html__Breakpoints) and its [step-by-step](#part0000_split_073.html__Step_Through_The)
    features.


    Note: See [Errors, Exceptions, and Debugging in Chapter 7](#part0000_split_057.html_Chapter_7)
    for more information


    # Utilizing Input and Output


    Java’s Input and Output (I/O) is a very large system consisting of many classes,
    interfaces, and methods (see [Utilizing Input and Output in Chapter 8](#part0000_split_074.html_Chapter_8)).
    Information is read from an input source and written to an output destination.
    The programs perform input and output through streams whereby streams represent
    data. Files in Java are stored and organized for convenience. Most of the files
    are structured in a hierarchy known as a tree. At the top of every tree is the
    root node which contains folders and files. All folders and files have a distinctive
    path within the tree. The files can be created, deleted, moved, copied, and verified
    for existence.


    Chapter 1 provided an overview of the upcoming chapters. The subsequent chapters
    explore classes, objects, methods, arrays, strings, inheritance, packages, interfaces,
    errors, exceptions, debugging, and Java’s input/output system. Chapter 2 will
    thoroughly explain classes, objects, and methods which is the cornerstone of object-oriented
    programming.


    Chapter 2


    Classes, Objects, and Methods


    Object-oriented programming (OOP) is a programming language structured around
    objects. Classes, objects, and methods are interrelated fundamentals within OOP.
    An [object](#part0000_split_018.html__Objects) is anything that can be seen or
    perceived. However, a [class](#part0000_split_017.html__Classes)  is a template
    for [objects](#part0000_split_018.html__Objects)  while a [methods](#part0000_split_019.html__Methods)  provide
    interaction with a [class](#part0000_split_017.html__Classes) from various components
    of the program.'
