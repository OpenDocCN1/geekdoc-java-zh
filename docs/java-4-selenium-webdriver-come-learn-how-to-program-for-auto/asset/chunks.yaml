  trans: "\n\n根据程序输出，越界索引为“7”，位于第 17 行。第一行表示发生了异常，然后显示了异常类型 `java.lang.ArrayIndexOutOfBoundsException`。数字\
    \ 7 指定了导致异常的索引。第二行显示了异常所在的位置 `at ExceptionHandling.CommonException.main(CommonException.java:17)`。以下是第二行的翻译：\n\
    \n在包名 `ExceptionHandling`、类名 `CommonException`、方法名 `main` 的第 17 行发生了一个异常。\n\n\
    # 异常处理原理\n\n众周知，异常是在运行时（程序执行期间）发生的问题。Java 允许异常处理器处理异常，这具有许多优点。请记住图 7.4 中的运行时错误示例，由于由于除以零导致执行停止。处理异常的好处是程序在响应错误后将继续执行。因此，错误不会停止程序的执行，而是异常处理器允许程序继续运行。在\
    \ Java 中，有五个相互关联的关键字可以促进异常处理的管理。以下是每个关键字的描述：\n\n1. try – 监控可能发生异常的代码\n2. catch\
    \ – 当发生错误时处理异常\n3. throw – 手动抛出自定义异常\n4. throws – 抛出方法中发生的异常\n5. finally – 在退出\
    \ try 块后自动执行代码\n\n如果异常处理器没有捕获异常，则 Java 虚拟机 (JVM) 会捕获所有异常。[JVM]](#part0000_split_062.html_JVM)\
    \ 会显示错误信息，这对于调试 是有利的，但对于处理异常不利。由于会导致程序终止，它对于处理异常是不好的。\n\n# Try / Catch 块\n\ntry\
    \ / catch 块允许尝试执行代码以验证是否发生异常。如果发生异常，则捕获该异常以指定应该发生什么。“try 和 catch” 两个关键字在处理异常时共同工作。try\
    \ 用于包含可能引起异常的代码，而 catch 用于管理异常。这两个关键字“try 和 catch”都是处理异常的核心。会提供一个 try 块以及一个或多个\
    \ catch 块。需要注意的是，如果没有发生异常，则 try 块和所有 catch 块都会被跳过。以下是处理异常的 try / catch 块语法：\n\n\
    ### 语法\n\n```java\ntry\n{\n    // 由 try 块监控的代码\n}\ncatch (ExceptionType1 excObject)\n\
    {\n    //  ExceptionType1 的异常处理器\n}\ncatch (ExceptionType2 excObject)\n{\n   \
    \ //  ExceptionType2 的异常处理器\n}\n```\n\n以下是 try 和 catch 块的语法细节：\n\n| 参数 | 描述 |\n\
    | :--- | :--- |\n| try | 监控代码块以检查异常 |\n| catch | 处理并应对异常 |\n| ExceptionType1 ExceptionType2\
    \ | 异常类型，必须是继承自 Throwable 类的类名 |\n| excObject | 接收处理器捕获的异常值。 |\n\n#### 图 7.13\
    \ – 语法细节\n\n以下是一个 try 和 catch 异常处理器的示例：\n\n```java\npublic class TryCatchBlock\n\
    {\n    public static void main(String[] args)\n    {\n        String[] continents\
    \ = new String[7];\n        try\n        {\n            System.out.println(\"\
    An exception has not been thrown\");\n            continents[0] = \"Africa\";\n\
    \            continents[1] = \"Antarctica\";\n            continents[2] = \"Asia\"\
    ;\n            continents[3] = \"Australia\";\n            continents[4] = \"\
    Europe\";\n            continents[5] = \"North America\";\n            continents[6]\
    \ = \"South America\";\n            continents[7] = \"America\";\n           \
    \ System.out.println(\"There are \" + continents.length + \" continents\");\n\
    \        }\n        catch (ArrayIndexOutOfBoundsException exc)\n        {\n  \
    \          System.out.println(\"Exception!!! - Array Out of Bounds. Not a valid\
    \ continent\");\n        }\n        System.out.println(\"This line executes automatically\
    \ whether an exception occurs or not\");\n    }\n}\n```\n\n![](img/00058.jpeg)\n\
    \n#### 图 7.14 – Try 和 Catch 示例\n\n**程序输出：**\nAn exception has not been thrown\n\
    Exception!!! - Array Out of Bounds. Not a valid continent\nThis line executes\
    \ automatically whether an exception occurs or not\n\n* 第 8 行开始使用 try 块处理代码\n\
    * 第 19 行在定义位置 7（位于数组之外）时强制触发异常。因此，try 块终止，程序将控制权转移到 catch 块\n* 由于第 19 行发生异常，第\
    \ 21 行不执行\n* 第 23 行通过在 catch 块中列出异常 `ArrayIndexOutOfBoundsException` 开始异常处理过程\n\
    * 第 25 行在捕获异常后在 catch 块内执行\n* 第 27 行在 catch 块之后执行。此行无论是否发生异常都会自动执行。\n\nJava 中的一种常见做法是将多个\
    \ catch 块与 try 块相关联。每个 catch 块必须包含一个唯一的异常类型，例如算术异常、数组越界异常等。异常类型决定了在创建多个 catch\
    \ 块后执行哪个 catch 块。因此，如果执行了算术异常，数组越界异常类型将被跳过。以下是带有多个 catch 块的 try 块示例：\n\n```java\n\
    public class MultipleCatchBlocks\n{\n    public static void main(String[] args)\n\
    \    {\n        int oddNumbers[] = {1, 33, 55, 77, 111};\n        int evenNumbers[]\
    \ = {0, 2, 4, 8};\n        for (int i = 0; i < oddNumbers.length; i++)\n     \
    \   {\n            try\n            {\n                System.out.println(\"What\
    \ is \" + oddNumbers[i] + \"/\" + evenNumbers[i] + \"? \" + \"\" + oddNumbers[i]/evenNumbers[i]);\n\
    \            }\n            catch (ArithmeticException except)\n            {\n\
    \                System.out.println(\"Exception!!! - Cannot divide by zero\");\n\
    \            }\n            catch (ArrayIndexOutOfBoundsException except)\n  \
    \          {\n                System.out.println(\"Exception!!! - Cannot locate\
    \ the index\");\n            }\n            System.out.println(\"This line executes\
    \ automatically whether an exception occurs or not\");\n        }\n    }\n}\n\
    ```\n\n![](img/00059.jpeg)\n\n#### 图 7.15 – 多重 Catch 块\n\n**程序输出：**\nException!!!\
    \ - Cannot divide by zero\nWhat is 33/2? 16\nWhat is 55/4? 13\nWhat is 77/6? 12\n\
    What is 99/8? 12\n\n* 第 17 行显示了第一个 catch 块，它包含算术异常。catch 块根据它们与 try 块关联的顺序进行评估。因此，由于它在程序中先出现，首先被评估。\n\
    * 当代码到达数组 `evenNumbers[]` 中的零“0”时，执行第 19 行。\n* 第 21 行显示第二个 catch 块，它包含数组索引越界异常。\n\
    \n"
- fmt: "\n* Line 23 is executed when the code searches for an index that is not available\
    \ in array `evenNumbers[]`. The other catch block is ignored when a match is found\
    \ for this exception type.\n\n# Finally Block\n\nThe `finally` block is an extension\
    \ of `try` / `catch` block. This block confirms certain actions such as writing\
    \ data to a file is performed whether an exception occurs or not. Java allows\
    \ the same action to be placed within the `try` block and `catch` block. On the\
    \ other hand, placing the same code in both blocks `try block and catch block`\
    \ creates duplicate code.\n\nFor example, what happens if there is no exception\
    \ and data needs to be written to a file. In this scenario, the `try` block executes\
    \ the code while the `catch` block is bypassed. However, if there is an exception,\
    \ the `catch` block executes the code while the `try` block is bypassed. Therefore,\
    \ a programmer must place code in the `try` and `catch` block for certainty that\
    \ data is written to a file. In programming, it is difficult to read and maintain\
    \ duplicate code. A `finally` block is not required but it will certainly write\
    \ data to the file when an exception is thrown and when it is not thrown. The\
    \ following is the syntax of a `try/catch/finally` block:\n\n## Syntax\n\n```java\n\
    try\n{\n // Code monitored by try block\n}\ncatch (ExceptionType1 excObject)\n\
    {\n    // Exception Handler for ExceptionType1\n}\ncatch (ExceptionType2 excObject)\n\
    {\n    // Exception Handler for ExceptionType2\n}\nfinally\n{\n // Execute code\
    \ if exception occurs or not\n}\n```\n\nThe following is an example using the\
    \ `try/catch/finally` block:\n\n```java\npublic class FinallyBlock\n{\n public\
    \ static void main(String[] args)\n{\n int oddNumbers[] = {11, 33, 55, 77, 99,\
    \ 111};\n int evenNumbers[] = {0, 2, 4, 6, 8};\n for (int i = 0; i < oddNumbers.length;\
    \ i++)\n                                {\n try\n                            \
    \        {\n                                System.out.println(\"What is \" +\
    \ oddNumbers[i] + \"/\" + evenNumbers[i] + \"? \"\n+ \"\" + oddNumbers[i]/evenNumbers[i]);\n\
    \                                    }\n catch (ArithmeticException except)\n\
    \                                    {\n                                System.out.println(\"\
    Exception!!! - Cannot divide a number by zero\");\n                          \
    \      }\n catch (ArrayIndexOutOfBoundsException except)\n                   \
    \                 {\n                                System.out.println(\"Exception!!!\
    \ - Cannot locate the index\");\n                                }\n finally\n\
    {\n                                System.out.println(\"  Perform Action\");\n\
    \                            }\n }\n}\n}\n```\n![](images/0060.jpeg)\n\n### Figure\
    \ 7.16 – Finally Block\n\nProgram Output:\n```\nException!!! - Cannot divide a\
    \ number by zero\nPerform an Action\nWhat is 33/2? 16\nPerform an Action\nWhat\
    \ is 55/4? 13\nPerform an Action\nWhat is 77/6? 12\nPerform an Action\nWhat is\
    \ 99/8? 12\nPerform an Action\nException!!! - locate the index\nPerform an Action\n\
    ```\n* Line 25 starts the `finally` block at the end of the `try/catch` block\n\
    * Line 27 is executed automatically when an exception is thrown and when an exception\
    \ is not thrown\n\n# Catch A Throwable Exception\n\nA `Throwable` exception can\
    \ be utilized to catch all exceptions since it is the parent class. The superclass\
    \ `Throwable` matches all of its subclasses which includes `RuntimeException`.\
    \ In order to catch exceptions for both classes, the superclass and subclass must\
    \ be implemented in their respective catch block.. The following is a `Throwable`\
    \ superclass and `ArithmeticException` subclass example using code from Figure\
    \ 7.15:\n\n```java\npublic class SuperSubClassException\n{\n public static void\
    \ main(String[] args)\n{\n int oddNumbers[] = {11, 33, 55, 77, 99, 111};\n int\
    \ evenNumbers[] = {0, 2, 4, 6, 8};\n for (int i = 0; i < oddNumbers.length; i++)\n\
    \                                {\n try\n                                   \
    \ {\n                                System.out.println(\"What is \" + oddNumbers[i]\
    \ + \"/\" + evenNumbers[i] + \"? \"\n+ \"\" + oddNumbers[i]/evenNumbers[i]);\n\
    \                                    }\n catch (ArithmeticException except)\n\
    \                                    {\n                                System.out.println(\"\
    Exception!!! - Cannot divide a number by zero\");\n                          \
    \      }\n catch (Throwable except)\n                                    {\n \
    \                               System.out.println(\"Exception!!! - The Throwable\
    \ Exception caught an error\");\n                            }\n }\n}\n}\n```\n\
    ![](images/0061.jpeg)\n\n### Figure 7.17 – Throwable and ArithmeticException Example\n\
    \nProgram Output:\n```\nException!!! - Cannot a number by zero\nWhat is 33/2?\
    \ 16\nWhat is 55/4? 13\nWhat is 77/6? 12\nWhat is 99/8? 12\nException!!! - The\
    \ Throwable Exception caught an error\n```\n* Line 18 implements the subclass\
    \ exception `ArithmeticException` inside the first catch block\n* Line 20 is executed\
    \ when the code reaches zero `0` in array `evenNumbers[]`\n* Line 22 implements\
    \ the `Throwable` exception inside the second catch block\n* Line 24 is executed\
    \ when the code searches for an index that is not available in array `evenNumbers[]`\n\
    \nThe `Throwable` superclass and subclass are allowed to catch exceptions by placing\
    \ the subclass in the first catch block. An error occurs if the `Throwable` exception\
    \ is implemented in the first block. The error message states “Unreachable catch\
    \ block for ArithmeticException. It is already handled by the catch block for\
    \ Throwable”.\n\n# Methods Defined By Throwable\n\nAs mentioned, `Throwable` is\
    \ a superclass of every exception subclass. Therefore all exceptions support methods\
    \ defined by `Throwable`. An exception can be caught by a `Throwable` exception\
    \ but it is a generic catch. It is best to use a specific exception as `ArithmeticException`\
    \ when handling exceptions. However, some of the methods defined by `Throwable`\
    \ can help the superclass be more specific when handling exceptions. The following\
    \ is a list of `Throwable` methods:\n\n| Method | Description |\n| :--- | :---\
    \ |\n| [fillInStackTrace](https://www.cis.upenn.edu/%7Ebcpierce/courses/629/jdkdocs/api/java.lang.Throwable.html#fillInStackTrace%28%29())\
    \ | Fills in the completed execution stack trace |\n| [getLocalizedMessage](https://www.cis.upenn.edu/%7Ebcpierce/courses/629/jdkdocs/api/java.lang.Throwable.html#getLocalizedMessage%28%29())\
    \ | Creates a localized description of the `Throwable` exception |\n| [getMessage](https://www.cis.upenn.edu/%7Ebcpierce/courses/629/jdkdocs/api/java.lang.Throwable.html#getMessage%28%29())\
    \ | Returns a detail message of the `Throwable` exception |\n| [printStackTrace](https://www.cis.upenn.edu/%7Ebcpierce/courses/629/jdkdocs/api/java.lang.Throwable.html#printStackTrace%28%29())\
    \ | Prints the stack trace |\n| [printStackTrace](https://www.cis.upenn.edu/%7Ebcpierce/courses/629/jdkdocs/api/java.lang.Throwable.html#printStackTrace%28java.io.PrintStream%29)(PrintStream)\
    \ | Prints the stack trace to the specified print stream |\n| [printStackTrace](https://www.cis.upenn.edu/%7Ebcpierce/courses/629/jdkdocs/api/java.lang.Throwable.html#printStackTrace%28java.io.PrintWriter%29)(PrintWriter)\
    \ | Prints the stack trace to the specified print writer |\n| [toString](https://www.cis.upenn.edu/%7Ebcpierce/courses/629/jdkdocs/api/java.lang.Throwable.html#toString%28%29())\
    \ | Returns a short exception description after being called by `println()` method\
    \ |\n\n### Figure 7.18 – Methods Defined by Throwable\n"
