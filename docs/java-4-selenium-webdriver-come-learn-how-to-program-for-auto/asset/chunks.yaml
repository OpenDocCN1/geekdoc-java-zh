    \ with visibility to all methods within a class. The following is the syntax for\
    \ defining a class:\n\n### Syntax\n\n```\nclass ClassName\n{\n    // Declare Instance\
    \ Variable\n    variableType variableName1;\n    variableType variableName2;\n\
    \    variableType variableNameN;\n\n    // Declare Methods\n    methodType methodName1\
    \ ()\n    {\n        // Body of the Method\n    }\n    methodType methodName2\
    \ ()\n    {\n        // Body of the Method\n    }\n    methodType methodNameN\
    \ ()\n    {\n        // Body of the Method\n    }\n}\n```\n\n# Objects\n\nObject-Oriented\
    \ programming (OOP) is built upon objects. The keyword `static` permits a member\
    \ to be accessed before any object is created within its class. Methods and variables\
    \ are declared `static` when the keyword is placed in front of the member.\n\n\
    Methods and variables are labeled members of a class since they form the class.\
    \ Access to both members are controlled by four modifiers:\n\n1. `public` – A\
    \ modifier that allows access to code defined outside of its `class`\n2. `private`\
    \ – A modifier that allows access to other members within its `class`\n3. `no\
    \ modifier` – A modifier that allows access to all `classes` within its `package`\n\
    4. `protected` – A modifier that allows access within its `package` and to all\
    \ `subclasses`\n\nUsually, members of a class are accessed by objects within its\
    \ own class. However, the keyword `static` permits a member to be accessed before\
    \ any object is created within its class. Methods and variables are declared `static`\
    \ when the keyword is placed in front of the member.\n\n### Creating and Accessing\
    \ Objects\n\nThe following is an example of data only class called `English` which\
    \ stores three-like variables:\n\n```\nclass English\n{\n    int students;\n \
    \   int weeks;\n    int days;\n}\n```\n\nFigure 2.1 – Data Only\n\nThe following\
    \ is an example of how to create and access an object:\n\n```\nclass English\n\
    {\n    int students;\n    int weeks;\n    int days;\n}\n\nclass OneEnglish\n{\n\
    \    public static void main (String args[])\n    {\n        English ENG101 =\
