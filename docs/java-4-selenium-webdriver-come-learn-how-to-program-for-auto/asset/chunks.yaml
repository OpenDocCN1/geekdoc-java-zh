    | :--- | :--- |

    | `OutputStreamWriter` | An `OutputStreamWriter` is a bridge from character streams
    to byte streams: Characters written to it are encoded into bytes using a specified
    charset |

    | `PipedReader` | Piped character-input streams |

    | `PipedWriter` | Piped character-output streams. |

    | `PrintWriter` | Prints formatted representations of objects to a text-output
    stream. |

    | `PushbackReader` | A character-stream reader that allows characters to be pushed
    back into the stream. |

    | `Reader` | Abstract class for reading character streams |

    | `StringReader` | A character stream whose source is a string. |

    | `StringWriter` | A character stream that collects its output in a string buffer,
    which can then be used to construct a string |

    | `Writer` | Abstract class for writing to character streams |


    ##### Figure 8.4 – Character Stream


    ## Buffered Streams


    Buffered input streams read data from a memory area known as a buffer. On the
    other hand, buffered output streams write data to a buffer. In Java, majority
    of the streams are unbuffered meaning each read or write request is managed directly
    by the operating system (OS). A management request by an OS make programs less
    efficient due to a request triggering an expensive operation.


    Buffered I/O streams is implemented to reduce overhead by administering a dedicated
    space in memory. The dedicated space stores data in an efficient manner. For instance,
    the buffered input stream is only called when the buffer is empty and buffered
    output streams are only called when the buffer is full. Therefore, the four following
    buffer classes can be used to wrap around a byte or character I/O stream:


    | Buffer Classes | Description |

    | :--- | :--- |

    | `BufferedInputStream` | Supplies buffering to output streams |

    | `BufferedOutputStream` | Supplies buffering to input streams |

    | `BufferedReader` | Reads text from a character input stream |

    | `BufferedWriter` | Writes text to a character output stream |


    ##### Figure 8.5 – Buffered Streams


    ## Data Streams


    Data streams serve as a foundation for `String` values, binary input, and output
    of primitive data types such as `boolean`, `byte`, `char`, `double`, `float`,
    `int`, `long`, and `short`. A `DataInput` or `DataOutput` interface is implemented
    by all of the data streams. The `DataInput` interface provides methods for reading
    while `DataOutput` interface provides methods for writing all of Java’s primitive
    types. `DataInputStream` implements the `DataInput` interface and `DataOutputStream`
    implements the `DataOutput` interface. The following is a list of methods for
    `DataInputStream` and `DataOutputStream`:


    | DataInputStream Method | Description |

    | :--- | :--- |

    | `boolean readBoolean()` | Reads a boolean input from the file |

    | `byte readByte()` | Reads a byte input from the file |

    | `char readChar()` | Reads a char input from the file |

    | `double readDouble()` | Reads a double input from the file |

    | `float readFile()` | Reads a float input from the file |

    | `int readInt()` | Reads a int input from the file |

    | `long readLong()` | Reads a long input from the file |

    | `short readShort()` | Reads a short input from the file |


    ##### Figure 8.6 – DataInputStream Methods


    | DataOutputStream Method | Description |

    | :--- | :--- |

    | `void writeBoolean(boolean v)` | Writes a boolean output to the file |

    | `void writeByte(int v)` | Writes a byte output to the file |

    | `void writeChar(int v)` | Writes a char output to the file |

    | `void writeDouble(double v)` | Writes a double output to the file |

    | `void writeFloat(float v)` | Writes a float output to the file |

    | `void writeInt(int v)` | Writes a int output to the file |

    | `void writeLong(long v)` | Writes a long output to the file |

    | `void writeShort(int v)` | Writes a short output to the file |


    ##### Figure 8.7 – DataOutputStream Methods


    ## Standard Streams


    Java provides support for standard I/O so a program receives input from a keyboard
    and produce output onto the computer monitor. A class called `System` within the
    `java.lang` package includes three standard stream variables: `in`, `out`, and
    `err`. `System.in` is an `InputStream` object while `System.out` and `System.err`
    are `PrintStream` objects. `PrintStream` allows formatted data to be written to
    an `OutputStream`. The following is a description of the standard streams:


    | Standard Stream | Description |

    | :--- | :--- |

    | Standard Input | (`System.in`) / By default the keyboard Standard Input controls
    where the program receives input |

    | Standard Output | (`System.out`) / By default the console Standard Output controls
    where the program sends output |

    | Standard Error | (`System.err`) / By default the console Standard Error used
    to output an error supplied by the program |


    ##### Figure 8.8 – Standard Streams


    # File Input/Output


    Files are stored and organized so they can be retrieved and accessed in a convenient
    manner. In Java, there are two packages `java.io.file` and `java.nio.file` set
    aside for files. Package `java.nio.file` is the newer file system labeled NIO2
    meaning “New Input/Output 2”. NIO2 identifies interfaces and classes to access
    files, file attributes, and file systems.


    ## Path


    Most files are arranged in a hierarchical (known as tree) structure. The root
    node (i.e., `C:\`) is located at the top of the hierarchy followed by folders
    and files. All folders have the ability to include additional folders and files.
    A unique path identifies a specific resource (file or folder) within a tree. Therefore
    the path `C:\java4selenium\input_output\test.txt` indicates a file named `test`
    is located in a folder named `input_output` within another folder named `java4selenium`.
    The following are common `Path` Interface methods for Java’s file system:


    ### Path Conversion


    - `toAbsolutePath()`: Returns a `Path` object characterizing the absolute path

    - `toRealPath(LinkOption… options)`: Returns the real path of an existing file

    - `toUri()`: Returns a URI to characterize this path


    ### Retrieve Path Information


    - `getFileName()`: Returns the name of the file or last element in the `Path`
    object

    - `getName(int index)`: Returns the `Path` element corresponding to the specified
    index

    - `getNameCount()`: Returns the number of name elements in the path

    - `getParent()`: Returns the parent path or null

    - `getRoot()`: Returns the path’s root

    - `normalize()`: Returns a path with redundant name elements eliminated

    - `resolve(Path other)`: Resolve the specified path against this path

    - `relativize(Path other)`: Constructs a relative path between this path and a
    specified path

    - `subPath(int beginIndex, int endIndex)`: Returns the subsequence of the `Path`
    indicated by starting and ending indices

    - `toString`: Returns the path’s string representation


    ## Files


    Files can be created, deleted, moved, copied, and verified for existence. Both
    packages `java.io.file` and `java.nio.file` include methods which read, write,
    and manipulate files and folders. The following are common methods within both
    packages for Java’s file system:


    ### Check Existence Methods


    - `exists()`: Tests if the resource exist

    - `notExists()`: Tests if the resource located by this path does not exist


    ### Check Status Methods


    - `isDirectory(Path path, LinkOption… options)`: Tests if the resource is a directory

    - `isExecutable(Path path)`: Tests if the resource is executable

    - `isFile()`: Tests if the resource indicated by this abstract pathname is a normal
    resource

