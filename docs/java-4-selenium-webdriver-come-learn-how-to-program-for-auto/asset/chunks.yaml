    \ – A modifier that allows access to code defined outside of its `class`\n2. `private`\
    \ – A modifier that allows access to other members within its `class`\n3. `no\
    \ modifier` – A modifier that allows access to all `classes` within its `package`\n\
    4. `protected` – A modifier that allows access within its `package` and to all\
    \ `subclasses`\n\nUsually, members of a class are accessed by objects within its\
    \ own class. However, the keyword `static` permits a member to be accessed before\
    \ any object is created within its class. Methods and variables are declared `static`\
    \ when the keyword is placed in front of the member.\n\nChapter two will explain\
    \ the following regarding classes, objects, and methods:\n\n* `Classes`\n* `Objects`\n\
    * `Methods`\n* `This Keyword`\n* `Annotations`\n* `Access Modifiers`\n* `Static\
    \ Keyword`\n\n# Classes\n\nClasses define data and code that operates on the data.\
    \ The data is represented by variables while the code is represented by methods.\
    \ Both variables and methods are members of a class. Hence a class is a template\
    \ that defines the structure of an object. Therefore the structure of a class\
    \ must be precise. Classes formed with one logical entity makes the class complete.\
    \ It is important to define classes with information that is logically connected.\
    \ For example, a class that contains information about an English class would\
    \ not contain unrelated information about the school zone speed limit.\n\nMost\
