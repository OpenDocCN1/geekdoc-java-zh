  trans: "\n第三章将讨论关于数组和字符串的内容：\n\n- 一维数组\n- 多维数组\n- For-Each 循环\n- 字符串\n\n# 一维数组\n\
    \n一维数组是最常用的数组类型。它存储了一个相关值的列表，例如特定月份的每日气温。作为回报，这些值列表可以得出每月平均温度。存储在数组中的所有信息都可以通过索引轻松访问。以下是定义一维数组的两种语法：\n\
    \n## 语法\n\n```\narrType arrName[] = new arrType[arrSize];\n```\n或\n\n```\narrType\
    \ arrName[];\narrName = new arrType[arrSize];\n```\n\n| 参数 |  |\n| :--- | :---\
    \ |\n| `arrType` | 决定数组中每个值的数据类型 |\n| `arrName` | 数组名称 |\n| `new` | 为数组分配内存 |\n\
    | `arrSize` | 数组中的值数量 |\n\n### 图 3.1 – 一维数组语法细节\n\n以下是一个一维数组的示例：\n\n```java\n\
    public class OneDimensionalArray {\n    public static void main(String[] args)\
    \ {\n        int [] tempMay = new int [3];\n        tempMay[0] = 105;\n      \
    \  tempMay[1] = 102;\n        tempMay[2] = 98;\n        System.out.println(\"\
    The highest temperature in May was \" + tempMay[0] + \" degrees\");\n        System.out.println(\"\
    The 2nd highest temperature in May was \" + tempMay[1] + \" degrees\");\n    \
    \    System.out.println(\"The 3rd highest temperature in May was \" + tempMay[2]\
    \ + \" degrees\");\n    }\n}\n```\n\n![](img/00020.jpeg)\n\n### 图 3.2 – 一维数组示例\n\
    \n程序输出：\n```\nThe highest temperature in May was 105 degrees\nThe 2nd highest\
    \ temperature in May was 102 degrees\nThe 3rd highest temperature in May was 98\
    \ degrees\n```\n\n- 第 5 行使用关键字 `new` 初始化数组 `tempMay`。方括号 `[3]` 中的数字 3 表示数组包含 3\
    \ 个元素。\n- 第 7–9 行为数组的每个元素赋值。第一个值存储在索引位置 0 。零总是数组的起始位置。在本示例中，最后一个索引位置是 2。元素 0–2\
    \ 总共持有 3 个元素。\n\n数组可以在不使用 `new` 关键字的情况下在一行赋值。以下是给数组赋值的另一种方法：\n\n```java\npublic\
    \ class OneDimensionalArray {\n    public static void main(String[] args) {\n\
    \        int[] tempMay = {105, 102, 98};\n        System.out.println(\"The highest\
    \ temperature in May was \" + tempMay[0] + \" degrees\");\n        System.out.println(\"\
    The 2nd highest temperature in May was \" + tempMay[1] + \" degrees\");\n    \
    \    System.out.println(\"The 3rd highest temperature in May was \" + tempMay[2]\
    \ + \" degrees\");\n    }\n}\n```\n\n![](img/00021.jpeg)\n\n### 图 3.3 – 另一种一维数组示例\n\
    \n程序输出：\n```\nThe highest temperature in May was 105 degrees\nThe 2nd highest\
    \ temperature in May was 102 degrees\nThe 3rd highest temperature in May was 98\
    \ degrees\n```\n\n第 5 行初始化了数组 `tempMay` 并为数组分配了三个值。注意这里没有使用关键字 `new` 来初始化数组。但是，在数组名称和值的同时指定了数据类型\
    \ `int`。方括号表示数组，而大括号内的值数量决定了数组的大小。以下是显示来自 图 3.2 和 图 3.3 数组值的图表：\n\n![](img/00022.jpeg)\n\
    \n### 图 3.4 – 数组名称、值和索引\n\n# 多维数组\n\n多维数组被视为数组的数组。因此，必须使用两个或多个括号来声明多维数组。常见的多维数组类型是二维数组。每个维度都包含自己的一组括号。带有行和列的电子表格是想象二维数组的好方法。第一对括号是行，第二对括号是列。以下是二维数组的语法和示例：\n\
    \n```\narrType arrName[][] = new arrType[arrSize1][arrSize2];\npublic class TwoDimensionalArray\
    \ {\n    public static void main(String[] args) {\n        int row, column;\n\
    \        int testDimension[][] = new int[2][3];\n        for (row = 0; row < 2;\
    \ row++) {\n            for (column = 0; column < 3; column++) {\n           \
    \     testDimension[row][column] = row * 3 + 1;\n                System.out.print(testDimension[row][column]\
    \ + \" \");\n            }\n            System.out.println();\n        }\n   \
    \ }\n}\n```\n\n![](img/00023.jpeg)\n\n### 图 3.5 – 二维示例\n\n程序输出：\n```\n1 2 3\n\
    4 5 6\n```\n\n- 第 7 行使用关键字 `new` 初始化二维数组 `testDimension`。两个括号表示有两个维度，类似于行和列。\n\
    - 注意输出总共有两行三列。第 9 行表示行的计数，第 1 行表示列的计数。\n- 第 13 行计算通过 6 的值。\n- 第 14 行打印出通过 6 的值。\n\
    \n与一维数组类似，二维数组可以在不使用 `new` 关键字的情况下声明并初始化。以下是一个没有使用初始化关键字 `new` 的二维数组示例。\n\n```java\n\
    public class TwoDimensionalArray {\n    public static void main(String[] args)\
    \ {\n        int row, column;\n        int testDimension[][] = {\n           \
    \ {1, 2, 3},\n            {4, 5, 6}\n        };\n        for (row = 0; row < 2;\
    \ row++) {\n            for (column = 0; column < 3; column++) {\n           \
    \     System.out.print(testDimension[row][column] + \" \");\n            }\n \
    \           System.out.println();\n        }\n    }\n}\n```\n\n![](img/00024.jpeg)\n\
    \n### 图 3.6 – 另一种二维数组示例\n\n程序输出：\n```\n1 2 3\n4 5 6\n```\n\n- 第 7–11 行通过将每个维度的列表封装在独立的括号内来初始化数组。注意元素之间用逗号分隔，且每组括号代表一行。之前的示例输出相同的信息。可以通过指定行和列来打印特定的值。以下示例根据定义的行和列打印特定的值。\n\
