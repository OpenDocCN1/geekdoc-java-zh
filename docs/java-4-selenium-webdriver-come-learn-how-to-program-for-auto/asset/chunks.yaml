  trans: "\n\n构造函数具有为实例变量设置初始值的能力。回想实例变量可以使用点运算符进行访问和赋值。在图 2.4 – 返回值中，以下实例变量被赋予了值：\n\
    \n`ENG101.students = 10;`\n`ENG101.weeks = 4;`\n`ENG101.days = 3;`\n`ENG202.students\
    \ = 12;`\n`ENG202.weeks = 6;`\n`ENG202.days = 3;`\n\n构造函数包含参数，在创建对象时时会接收参数。下面的示例演示了如何向构造函数传递参数：\n\
    \n```\nclass English\n{\n    int students, weeks, days;\n\n    English (int s,\
    \ int w, int d) {\n        students = s;\n        weeks = w;\n        days = d;\n\
    \    }\n\n    int totalDays () {\n        return weeks * days;\n    }\n}\n\nclass\
    \ TwoEnglishCourses\n{\n    public static void main (String args[]) {\n      \
    \  English ENG101 = new English (10, 4, 3);\n        English ENG202 = new English\
    \ (12, 6, 3);\n        System.out.println(\"The English 101 course has \" + ENG101.students\
    \ + \" students and the course last \" + ENG101.totalDays () + \" days\");\n \
    \       System.out.println(\"The English 202 course has \" + ENG202.students +\
    \ \" students and the course last \" + ENG202.totalDays () + \" days\");\n   \
    \ }\n}\n```\n\n##### ![](img/00013.jpeg)\n##### 图 2.10 – 参数化构造函数\n\n程序输出：\nThe\
    \ English 101 course has 10 students and the course last 12 days\nThe English\
    \ 202 course has 12 students and the course last 18 days\n\n第 5-10 行创建一个构造函数，在第\
    \ 5 行定义了三个参数 `s, w, d`。每个参数都用于初始化第 7 到 9 行的实例变量 `students, weeks, days`。在执行第 22\
    \ 行和 23 行后，ENG101 的值 `10, 4, 3` 和 ENG202 的值 `12, 6, 3` 被赋值给参数 `s, w, d`。结果是当使用\
    \ `new` 关键字创建每个对象 `ENG101 和 ENG202` 时，这些值被传递给 `English()` 构造函数。\n\n注意：构造函数没有使用如\
    \ `int` 或 void 等方法类型。注意第 5 行以 `English` 开头然后定义参数。Java 允许类包含多个构造函数。如果构造函数包含不同的参数列表，则该功能被称为构造函数重载。\n\
    \n## 访问器方法\n\n访问方法是用于获取和设置私有变量的方法。私有变量只能由其类内部的代码访问。因此，访问方法是两个称为 getter（获取器）和 setter（Setter）的方法，定义在与私有变量相同的类中。\n\
    \n这两个方法在定义时方法名前带有以 `get` 和 `set` 开头的前缀。例如，`getDays()` 和 `setDays()` 被视为获取天数然后设置天数的访问器方法。以下是两种访问器方法的示例：\n\
    \n```\nclass English\n{\n    private int students, weeks, days;\n\n    English\
    \ (int s, int w, int d) {\n        students = s;\n        weeks = w;\n       \
    \ days = d;\n    }\n\n    int getStudents () {\n        return students;\n   \
    \ }\n\n    int getWeeks() {\n        return weeks;\n    }\n\n    int getDays()\
    \ {\n        return days;\n    }\n\n    void setStudents (int s) {\n        students\
    \ = s;\n    }\n\n    void setWeeks(int w) {\n        weeks = w;\n    }\n\n   \
    \ void setDays(int d) {\n        days = d;\n    }\n\n    int totalDays () {\n\
    \        return weeks * days;\n    }\n}\n```\n\n##### ![](img/00014.jpeg)\n#####\
    \ 图 2.11 – 访问器方法\n* 第 3 行将所有实例变量 `students, weeks 和 days` 声明为 private\n* 第 5-10\
    \ 行是构造函数 方法\n* 第 12-25 行是 get 访问器方法。每个方法只返回人数、周数和天数\n* 第 27-40 行是 set 访问方法。每个方法设置/修改人数和天数\n\
    \n## this 关键字\n\n`this` 单词是一个关键字，在实例方法和/或构造函数 内部作为引用操作。它引用当前对象或正在调用的成员。当局部变量和实例变量同名时，`this`\
    \ 关键字是可选的，但非常有用。接面的示例展示了当局部变量和实例变量同名时如何使用 `this` 关键字：\n\n```java\npublic class\
    \ ThisKeyword\n{\n    int testVariable = 34;\n\n    void hideInstanceVariable\
    \ () {\n        int testVariable = 15;\n        System.out.println(\"What is the\
    \ value of the local variable NOT using 'this'? \" + testVariable);\n        System.out.println(\"\
    What is the value of the instance variable using 'this'? \" + this.testVariable);\n\
    \    }\n\n    public static void main(String[] args) {\n        ThisKeyword objHide\
    \ = new ThisKeyword ();\n        objHide.hideInstanceVariable ();\n    }\n}\n\
    ```\n\n##### ![](img/00015.jpeg)\n##### 图 2.12 – this 关键字\n\n程序输出：\nWhat is the\
    \ value of the local variable NOT using 'this'? 15\nWhat is the value of the instance\
    \ variable using 'this'? 34\n\n* 第 3 行声明并初始化实例变量 `testVariable` 为 34\n* 第 7 行声明并初始化局部变量\
    \ `testVariable` 为 15\n* 第 9 行打印不使用 'this' 关键字的局部变量值\n* 第 10 行打印使用 'this' 关键字的实例变量值\n\
    \n## 注解\n\n根据 [dictionary.com](http://dictionary.reference.com/browse/annotation?s=t)\
    \ 的定义，注解的意思是“关键或解释性的注释”。回想第 1 部分 – Java 4 Selenium WebDriver，注释是帮助程序员理解程序的注释。注解与注释相似，它们都提供信息。然而，注释会被编译器忽略，而注解为编译器提供数据。注解以\
    \ `@` 符号开头，并指定方法的目的。某些注解可以自定义以替换注释和预定义注解（如 `@Override`）。以下是 Selenium WebDriver\
    \ 中使用的 JUnit 注解示例：\n\n1. `@Before` 在每个测试前分配资源\n2. `@Test` 执行测试脚本\n3. `@After`\
    \ 在每个测试后释放已分配的\n\n注意：JUnit 注解的细节将在“Selenium WebDriver”书籍中使用并解释。\n\n## 访问修饰符\n\n\
    访问修饰符是面向对象编程中非常有用的特性。它们对每个类和类成员（变量和方法）施加访问限制非常有用。在 Java 中有四种访问修饰符：\n\n1. `public`\
    \ – 表示成员可以被所有类 访问\n\n"
- fmt: "\n2. `protected` indicates a member can be accessed by all `classes` and `subclasses`\
    \ within its own `package` (see `Inheritance in Chapter 4`) (see `Packages in\
    \ Chapter 5`).\n\n3. `no modifier` – indicates a member can be accessed by all\
    \ `classes` within its own `package`.\n\n4. `private` – indicates a member can\
    \ be accessed within its own `class`.\n\nThe access modifier precedes a class,\
    \ variable, and method declaration. Classes can only use the `public` modifier\
    \ or no modifier. Therefore, an error occurs if a class makes use of a `private`\
    \ or `protected` access modifier. The following is an example of a class, method,\
    \ and variables using a `public` modifier:\n\n```java\npublic class English {\n\
    \    public int students, weeks, days;\n\n    public int totalDays () {\n    \
    \    return weeks * days;\n    }\n}\n\nclass TwoEnglishCourses {\n    public static\
    \ void main (String args[]) {\n        English ENG101 = new English ();\n    \
    \    English ENG202 = new English ();\n        ENG101.students = 10;\n       \
    \ ENG101.weeks = 4;\n        ENG101.days = 3;\n        ENG202.students = 12;\n\
    \        ENG202.weeks = 6;\n        ENG202.days = 3;\n        System.out.println(\"\
    The English 101 course has \" + ENG101.students + \" students and the course last\
    \ \" + ENG101.totalDays () + \" days\");\n        System.out.println(\"The English\
    \ 202 course has \" + ENG202.students + \" students and the course last \" + ENG202.totalDays\
    \ () + \" days\");\n    }\n}\n```\n\n![](images/00016.jpeg)\n##### Figure 2.13\
    \ – Public Class, Variables, and Method\n\nThe class (line 1), all of the variables\
    \ (line 3), and method (lines 5 - 8) are declared with a `public` access modifier.\
    \ Consequently, there are no errors and the members within the `English` class\
    \ can be accessed by code from the class `TwoEnglishCourses`.\n\nThe following\
    \ is an example of a `private` method:\n\n```java\npublic class English {\n  \
    \  public int students, weeks, days;\n\n    private int totalDays () {\n     \
    \   return weeks * days;\n    }\n}\n\nclass TwoEnglishCourses {\n    public static\
    \ void main (String args[]) {\n        English ENG101 = new English ();\n    \
    \    English ENG202 = new English ();\n        ENG101.students = 10;\n       \
    \ ENG101.weeks = 4;\n        ENG101.days = 3;\n        ENG202.students = 12;\n\
    \        ENG202.weeks = 6;\n        ENG202.days = 3;\n        System.out.println(\"\
    The English 101 course has \" + ENG101.students + \" students and the course last\
    \ \" + ENG101.totalDays () + \" days\");\n        System.out.println(\"The English\
    \ 202 course has \" + ENG202.students + \" students and the course last \" + ENG202.totalDays\
    \ () + \" days\");\n    }\n}\n```\n\n![](images/00017.jpeg)\n##### Figure 2.14\
    \ – Private Method\nLine 5 declares `totalDays()` with a `private` access modifier.\
    \ That means only members within its class `English` can access the method. Lines\
    \ 26 and 27 attempts to call `totalDays()` but cannot because they are located\
    \ in a different class `TwoEnglishCourses`. As a result, an error message states\
    \ “method totalDays() from Type English is not visible.”\n\n![](images/00018.jpeg)\n\
    ##### Figure 2.15 – Private and Public Variables\nLine 3 declares instance variable\
    \ `students` as `private` while line 4 declares instance variables `weeks` and\
    \ `days` as `public`. Notice lines 19–25, two errors (“lines 19 and 23”) occur\
    \ for the private variable `students`. In addition, there is an error on lines\
    \ 27 and 28 which states “English.students is not visible”. The private variable\
    \ is only visible to the `English` class but not to `TwoEnglishCourses`. However,\
    \ the public variables are visible to both classes. The following are access levels\
    \ for each modifier:\n\n| | public | protected | no modifier | private |\n| ---\
    \ | --- | --- | --- | --- |\n| Class | Yes | Yes | Yes | |\n| Package | Yes |\
    \ Yes | No | |\n| Subclass | Yes | No | No | |\n| World | Yes | No | No | No |\n\
    \n##### Figure 2.16 – Access Modifier\n\nThe `static` keyword can be applied to\
    \ variables, methods, blocks, and nested classes. Usually, the members of a class\
    \ are accessed through an object of the class via the dot operator. When a member\
    \ is declared as `static`, the member can be accessed prior to creating an object.\
    \ However to access a static member, it is best to precede the static member with\
    \ a class name and dot operator rather than the object name and dot operator.\
    \ A warning message appears if the static member is preceded by an object name\
    \ and dot operator. The following is the syntax and example of a static variable:\n\
    \n`ClassName.variableName`\n\n```java\nclass StaticAddNumbers {\n    static int\
    \ a;\n    int b;\n\n    int addNumbers () {\n        return a + b;\n    }\n}\n\
    \nclass StaticExample {\n    public static void main(String[] args) {\n      \
    \  StaticAddNumbers objAdd = new StaticAddNumbers ();\n        objAdd.b = 50;\n\
    \        StaticAddNumbers.a = 25;\n        System.out.println(\"The value of 'objAdd.b'\
    \ is \" + objAdd.b);\n        System.out.println(\"The value of 'a' is \" + StaticAddNumbers.a);\n\
    \        System.out.println(\"The total of 'a + b' is \" + objAdd.addNumbers()\
    \ + \"\\n\");\n        StaticAddNumbers.a = 30;\n        System.out.println(\"\
    The value of 'a' changed to \" + StaticAddNumbers.a + \" but the value of 'objAdd.b'\
    \ remains \" + objAdd.b);\n    }\n}\n```\n\n![](images/00019.jpeg)\n##### Figure\
    \ 2.17 – Static Variable\nOutput:\nThe value of 'objAdd.b' is 50\nThe value of\
    \ 'a' is 25\nThe total of 'a + b' is 75\nThe value of 'a' changed to 30 but the\
    \ value of 'objAdd.b' remains 50\n\nLine 3 declares a static variable `a` within\
    \ `StaticAddNumbers`.\n"
