  trans: "\n字符串像其他对象一样，可以使用关键字 `new` 调用 `String` 构造函数来创建。以下是使用 `new` 关键字创建 `String`\
    \ 的示例：\n\n```java\nString name = new String (\"Rex Jones\");\n```\n\n## 字符串操作\n\
    \n在 Java 中，有一个 `String` 类，其中包含许多用于操作的方法。以下是 Eclipse 中几个 `String` 方法的截图：\n\n![](img/00031.jpeg)\n\
    ### 图 3.14 – 字符串方法\n\n* 第 7 行在变量 `name` 之后输入一个点后，会显示方法列表\n* 当高亮特定方法 `equals` 时，会显示该方法的描述\n\
    \n以下是常用的 `String` 方法、其数据类型和描述：\n\n1. `charAt (int index)`: `char` - 返回指定索引处的字符\n\
    2. `compareTo (str)`: `int` - 如果调用字符串小于 `str`，则返回负数；如果调用字符串大于 `str`，则返回正数；如果字符串相等，则返回零\n\
    3. `concat (String str)`: `String` - 将给定的字符串连接到字符串的末尾\n4. `equals (Object anObject)`:\
    \ `boolean` – 将字符串与特定对象进行比较\n5. `equalsIgnoreCase (String string)`: `boolean`\
    \ - 比较字符串并忽略大小写\n6. `indexOf (String str)`: `int` - 返回指定子字符串首次出现的索引\n7. `lastindexOf\
    \ (String str)`: `int` - 返回字符串最后一次出现的索引\n8. `length()`: `int` - 返回字符串的长度\n9. `replace\
    \ (char oldChar, char newChar)`: `String` - 在更改所有旧字符串出现的地方后返回新字符串\n10. `split\
    \ (String regex)`: `String[]` - 分割字符串并返回匹配给定正则表达式的字符串数组\n11. `toLowerCase()`:\
    \ `String` - 将 `String` 中的所有字符转换为小写\n12. `toUpperCase()`: `String` - 将 `String`\
    \ 中的所有字符转换为大写\n13. `trim()`: `String` - 返回字符串的副本，并删除了原始字符串开头和结尾的空白字符\n\n字符串数据类型不能与不同的数据类型结合进行乘法、减法或除法等操作。例如，值为“534000.00”的字符串看起来是一个数值，但除非使用类型包装类\
    \ 转换字符串，否则字符串不允许数学运算。值“534000.00”类似于 `double` 数据类型。然而，如果与 double 数据类型结合，将会发生错误。以下示例显示了当字符串数据类型与减法运算符结合时产生的错误：\n\
    \n```java\npublic class StringObject {\n    public static void main(String[] args)\
    \ {\n        String grossIncome = \"534000.00\";\n        double gross = 534000.00;\n\
    \        double taxes = 225000.00;\n        double netIncome;\n        netIncome\
    \ = grossIncome - taxes;\n        netIncome = gross - taxes;\n        System.out.println(\"\
    The net income is \" + netIncome);\n    }\n}\n```\n\n![](img/00032.jpeg)\n###\
    \ 图 3.15 – 因数学运算导致的字符串错误\n\n* 第 5 行声明并初始化了字符串值“534000.00”\n* 第 10 行显示错误，因为字符串不允许数学运算。然而，注意第\
    \ 11 行没有显示错误，因为变量 `gross` 和 `taxes` 都被声明为 double 数据类型“第 6 和第 7 行”\n\n## 类型包装类\n\
    \n类型包装类用于将字符串转换为原始类型（`byte`、`double`、`float`、`integer`、`long`、`short`）。因此，之前显示字符串值“534000.00”错误的示例可以转换为数字。类型包装类用于封装原始类型。以下是当指定字符串为“534000”时返回\
    \ `double` 的示例：\n\n```java\npublic class StringObject {\n    public static void\
    \ main(String[] args) {\n        String grossIncome = \"534000.00\";\n       \
    \ double taxes = 225000.00;\n        double netIncome;\n        netIncome = Double.parseDouble(grossIncome)\
    \ - taxes;\n        System.out.println(\"The net income is \" + netIncome);\n\
    \    }\n}\n```\n\n![](img/00033.jpeg)\n### 图 3.16 – 读取字符串值后返回 Double\n\n程序输出：The\
    \ net income is 309000.00\n* 第 5 行声明并初始化了字符串值“534000.00”\n* 第 9 行解析（也称为读取）字符串\
    \ `grossIncome` 然后返回一个 double 数据类型。之后，从 `grossIncome`“534000”中减去变量 `taxes`“225000”，并将值赋值给\
    \ `netIncome`\n\n以下是转换字符串数据类型的包装类列表：\n\n| 包装类 | 方法 |\n| :--- | :--- |\n| Double\
    \ | `Double.parseDouble(string)` |\n| Float | `Float.parseFloat(string)` |\n|\
    \ Long | `Long.parseLong(string)` |\n| Integer | `Integer.parseInt(string)` |\n\
    | Short | `Short.parseShort(string)` |\n| Byte | `Byte.parseByte(string)` |\n\n\
    ### 图 3.17 – 包装类\n\n类型包装类用于将字符串转换为原始类型（`byte`、`double`、`float`、`integer`、`long`、`short`）。因此，之前显示字符串值“534000.00”错误的示例可以转换为数字。类型包装类用于封装原始类型。以下是当指定字符串为“534000”时返回\
    \ `double` 的示例（见上文）。\n\n第 3 章解释了数组和字符串，它们是对象。数组是具有相同值的集合。继承允许代码和对象的用。\n\n## 继承\n\
    \n继承是面向对象编程中的一个重要基础。它允许向现有类添加功能，从而避免了重复编写相同的代码。子类继承父类的所有成员。被继承的类被称为子类。另一种看待父类和子类的方法是将父类看作父亲，将子类看作孩子。\n\
    \n为了让子类继承父类，必须在类声明中使用 `extends` 关键字。`extends` 意味着子类将扩展父类。子类不允许继承多个父类。然而，子类允许成为另一个子类的父类。作为结果，额外的子类继承了每个父类的成员。以下是子类继承父类的语法：\n\
    \n```java\nclass SubClassName extends SuperClassName {\n    // 类体\n}\n```\n\n\
    以下是子类继承父类的示例：\n\n```java\nclass School {\n    int numTeachers;\n    int numStudents;\n\
    \    void showNumberOfPeople() {\n        System.out.println(\"There are \" +\
    \ numTeachers + \" teachers and \" + numStudents + \" students\");\n    }\n}\n\
    \nclass ElementarySchool extends School {\n    String principalName;\n    int\
    \ totalTeacherStudents() {\n        return numTeachers + numStudents;\n    }\n\
    \    void displayPrincipal() {\n    }\n}\n```\n"
