  trans: "\n\n* `isReadable(Path path)`\n    测试该资源是否可读\n\n* `isSameFile(Path path,\
    \ Path path2)`\n    测试两个资源是否指向同一个资源\n\n* `isWritable(Path path)`\n    测试该资源是否可写\n\
    \n### 拷贝方法\n\n* `copy(Path source, Path target, CopyOption… options)`\n    将资源拷贝到指定的\
    \ target\n\n### 创建方法\n\n* `createFile(Path path, FileAttribute<?>... attrs)`\n\
    \    创建一个新的空资源\n\n### 删除方法\n\n* `Delete(Path path)`\n    删除该资源\n    注意：文件夹必须在为空时才能被删除\n\
    \n### 目录方法\n\n* `list()`\n    返回一个字符串数组，包含由此抽象路径指示的目录中的资源和目录名称\n\n* `listFiles()`\n\
    \    返回一个抽象路径数组，指示由此抽象路径指示的目录中的文件\n\n### 移动方法\n* [移动](https://docs.oracle.com/javase/7/docs/api/java/nio/file/Files.html#move%28java.nio.file.Path,%20java.nio.file.Path,%20java.nio.file.CopyOption...%29)\
    \ ([Path](https://docs.oracle.com/javase/7/docs/api/java/nio/file/Path.html)源,\
    \ [Path](https://docs.oracle.com/javase/7/docs/api/java/nio/file/Path.html)目标,\
    \ [CopyOption](https://docs.oracle.com/javase/7/docs/api/java/nio/file/CopyOption.html)...\
    \ 选项)\n    将资源移动或重命名到目标\n\n### 读取方法\n\n* `readAllBytes(Path path)`\n    从资源中读取所有字节\n\
    \n* `readAllLines(Path path, Charset cs)`\n    从资源中读取所有行\n\n### 空间方法\n\n* `length()`\n\
    \    返回由此抽象路径指示的资源的长度\n\n* `getFreeSpace()`\n    返回由此抽象路径指示的分区中未分配的字节数\n\n* `getTotalSpace()`\n\
    \    返回由此抽象路径指示的分区的大小\n\n* `getUsableSpace()`\n    返回在由此抽象路径指示的分区上该虚拟机可用的字节数\n\
    \n### 写入方法\n\n* `write(Path path, byte[] bytes, OpenOption… options)`\n    将字节写入资源\n\
    \n* `write(Path path, Iterable<? extends CharSequence> lines Charset cs, OpenOption…\
    \ options)`\n    将文本行写入资源\n\n## 结论\n\nJava 是一种以对象为中心的流行面向对象编程 (OOP) 语言。“第二部分 –\
    \ Java 4 Selenium WebDriver”的目标是提供 Java 的深度概念。Java 的优点之一是代码的可重用性。以下是书中的核心要点：\n\
    \n- 类：类是对象的模板，包含数据以及操作这些数据的代码。\n- 对象：对象是面向对象编程的基础。它包含两个特征：状态和行为。状态标识对象，行为代表对象的操作。\n\
    - 方法：方法是执行特定任务的代码块。\n- 继承：继承是一种层次化概念，允许扩展可重用的代码和对象。\n- 包：包是相关类的集合。\n- 接口：接口是相关方法的集合。\n\
    - 错误：错误是程序中不可避免的问题。\n- 异常：异常是在运行时发生的错误。\n- 调试：调试是检测并移除程序中意外状况的过程。\n\n## 资源\n\n\
    1. Beginning Java® Programming\n   面向对象的方法\n   Bart Baesens, Aimée Backiel, Seppe\
    \ vanden Broucke\n\n2. Java A Beginner’s Guide Sixth Edition\n   今天创建、编译并运行 Java\
    \ 程序\n   Herbert Schildt\n\n3. ORACLE Java Documentation\n   The Java TM Tutorials\n\
    \   [`docs.oracle.com/javase/tutorial/java/javaOO/returnvalue.html`](https://docs.oracle.com/javase/tutorial/java/javaOO/returnvalue.html)\n\
    \   [`docs.oracle.com/javase/7/docs/api/`](https://docs.oracle.com/javase/7/docs/api/)\n\
    \   [`docs.oracle.com/javase/7/docs/api/java/io/package-summary.html#package_description`](https://docs.oracle.com/javase/7/docs/api/java/io/package-summary.html#package_description)\n\
    \n4. Program Creek\n   [`www.programcreek.com/2009/02/diagram-for-hierarchy-of-exception-classes/`](http://www.programcreek.com/2009/02/diagram-for-hierarchy-of-exception-classes/)\n\
    \n5. TIOBE\n   [`www.tiobe.com/tiobe_index`](http://www.tiobe.com/tiobe_index)\n\
