    ### Figure 3.8 – Specific Index For A Two-Dimensional Array\n\n# For-Each Loop\n\
    \nThe for-each loop (known as enhanced for loop) was established to cycle through\
    \ a collection of objects such as an array. This type of control structure presents\
    \ the same functionality as the `for` loop (see Chapter 4 - Control Structures\
    \ in (Part 1) Java 4 Selenium WebDriver) which executes a block of code a certain\
    \ number of iterations. However, the for-each loop executes a block of code while\
    \ cycling through each element in the collection. The following is the for-each\
    \ loop syntax:\n\n### Syntax\n```java\nfor (collType itrVariable: collection)\n\
    {\n  statement(s)\n}\n```\n\n### Syntax Details\n\n| Argument | Description |\n\
    | :--- | :--- |\n| collType | Refers to the type of data for the collection |\n\
    | itrVariable | Refers to the name of the iteration variable that receives each\
    \ element after every iteration |\n| collection | The collection such as array\
    \ that will be iterated or cycled through |\n| statement(s) | The blocked of that\
    \ will be executed |\n| { … } | The opening and closing curly brackets |\n\n###\
    \ Figure 3.9 – For-Each Loop Syntax Details\n\nAll elements in the for-each loop\
    \ are retrieved and stored in the `itrVariable`. The loop repeats until all elements\
    \ are read in index order. It is important to know that the `colltype` must be\
    \ the same type as the object. In the case of arrays, the `collType` must be the\
    \ same type as the `arrType`. The following is an example of for-each loop:\n\n\
    ```java\npublic class ForEachLoop\n{\n public static void main(String[] args)\n\
    \    {\n     double[] costPerItem = {12.34, 56.78, 99.99};\n     double totalCost\
    \ = 0;\n     for (double i: costPerItem)\n     {\n      System.out.println(\"\
    The cost is \" + i);\n      totalCost = totalCost + i;\n     }\n     System.out.println(\"\
    \\n\" + \"The total cost of all items is \" + totalCost);\n  }\n}\n```\n\n![](images/00027.jpeg)\n\
    ### Figure 3.10 – For Each Loop Example\n\nProgram Output:\n```\nThe cost is 12.34\n\
    The cost is 56.78\nThe cost is 99.99\nThe total cost of all items is 169.11\n\
    ```\n\n*   Line 5 and 6 initialize and assign values to the array `costPerItem`\
    \ and `totalCost`\n*   Line 8 retrieves each element (12.34, 56.78, 99.99) in\
    \ array `costPerItem`\n*   Line 10 prints each element\n*   Line 11 calculates\
    \ the total of all elements\n\nNote: Lines 8 – 11 can be read as ”For each double\
    \ data type in the `costPerItem` array, print each element and calculate the total\
    \ of all elements”.\n\n## Two-Dimensional Array Iteration\n\nIterations for two-dimensional\
    \ arrays operate similar to single-dimensional arrays. The iteration variable\
    \ for a two-dimensional array must reference the single-dimensional array. It\
    \ must reference the single-dimensional array because two-dimensional arrays are\
    \ considered arrays of arrays. Therefore each two-dimensional array iteration\
    \ retrieves the next array. The following is an example of a two-dimensional array\
    \ iteration:\n\n```java\npublic class ForEachLoop\n{\n public static void main(String[]\
    \ args)\n    {\n     int totalCost = 0;\n     int[][] costPerItem =\n     {\n\
    \      {5, 10},\n      {5, 20},\n      {5, 30}\n     }; for (int i[]: costPerItem)\n\
    \     {\n      for (int j: i)\n      {\n         System.out.println(\"The cost\
    \ is \" + j);\n         totalCost = totalCost + j;\n      }\n     }\n     System.out.println(\"\
    \\n\" + \"The total cost of all items is \" + totalCost);\n  }\n}\n```\n\n![](images/00028.jpeg)\n\
    ### Figure 3.11 – Two-Dimension Array Iteration\n\nProgram Output:\n```\nThe cost\
    \ is 5\nThe cost is 10\nThe cost is 15\nThe cost is 25\nThe cost is 30\nThe total\
    \ cost of all items is 105\n```\n\n*   Line 5 initializes and assigns zero “0”\
    \ to `totalCost`\n*   Lines 6 – 11 initialize and assign values to the two-dimensional\
    \ array `costPerItem`\n*   Line 13 `for (int i[]: costPerItem)` references a single-dimensional\
    \ array whereby each iteration retrieves the next array in `costPerItem` from\
    \ start to finish “index 0 to index 5”\n*   Line 15 `for (int j: i)` cycles through\
    \ each element\n\n## Search An Array\n\nArrays can be searched to retrieve specific\
    \ values. There are times when only a certain value is needed from a collection\
    \ of values. The following example illustrates how to retrieve a specific value\
    \ from an array:\n\n```java\npublic class ForEachLoop\n{\n public static void\
