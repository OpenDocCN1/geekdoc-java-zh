  trans: "\n2. `protected` 表示该成员可以被其所属 `package` 内的所有 `classes` 和 `subclasses` 访问（参见“第\
    \ 4 章 继承”）（参见“第 5 章 包”）。\n\n3. `no modifier`（无修饰符）—— 表示该成员可以被其所属 `package` 内的所有\
    \ `classes` 访问。\n\n4. `private` —— 表示成员可以在其所属 `class` 内访问。\n\n访问修饰符位于类、变量和方法的声明之前。类只能使用\
    \ `public` 修饰符或无修饰符。因此，如果类使用了 `private` 或 `protected` 访问修饰符就会报错。以下是一个使用 `public`\
    \ 修饰符的类、方法和变量的示例：\n\n```java\npublic class English {\n    public int students,\
    \ weeks, days;\n\n    public int totalDays () {\n        return weeks * days;\n\
    \    }\n}\n\nclass TwoEnglishCourses {\n    public static void main (String args[])\
    \ {\n        English ENG101 = new English ();\n        English ENG202 = new English\
    \ ();\n        ENG101.students = 10;\n        ENG101.weeks = 4;\n        ENG101.days\
    \ = 3;\n        ENG202.students = 12;\n        ENG202.weeks = 6;\n        ENG202.days\
    \ = 3;\n        System.out.println(\"The English 101 course has \" + ENG101.students\
    \ + \" students and the course last \" + ENG101.totalDays () + \" days\");\n \
    \       System.out.println(\"The English 202 course has \" + ENG202.students +\
    \ \" students and the course last \" + ENG202.totalDays () + \" days\");\n   \
    \ }\n}\n```\n\n![](img/00016.jpeg)\n##### 图 2.13 – 公有类、变量和方法\n\n类（第 1 行）、所有变量（第\
    \ 3 行）以及方法（第 5-8 行）都使用 `public` 访问修饰符声明。因此，没有错误，`English` 类中的成员可以被 `TwoEnglishCourses`\
    \ 类代码访问。\n\n以下是一个 `private` 方法的示例：\n\n```java\npublic class English {\n    public\
    \ int students, weeks, days;\n\n    private int totalDays () {\n        return\
    \ weeks * days;\n    }\n}\n\nclass TwoEnglishCourses {\n    public static void\
    \ main (String args[]) {\n        English ENG101 = new English ();\n        English\
    \ ENG202 = new English ();\n        ENG101.students = 10;\n        ENG101.weeks\
    \ = 4;\n        ENG101.days = 3;\n        ENG202.students = 12;\n        ENG202.weeks\
    \ = 6;\n        ENG202.days = 3;\n        System.out.println(\"The English 101\
    \ course has \" + ENG101.students + \" students and the course last \" + ENG101.totalDays\
    \ () + \" days\");\n        System.out.println(\"The English 202 course has \"\
    \ + ENG202.students + \" students and the course last \" + ENG202.totalDays ()\
    \ + \" days\");\n    }\n}\n```\n\n![](img/00017.jpeg)\n##### 图 2.14 – 私有方法\n第\
    \ 5 行使用 `private` 访问修饰符声明 `totalDays()`。这意味着只有 `English` 类内部的成员可以访问该方法。第 26 行和第\
    \ 27 行尝试调用 `totalDays()` 但无法，因为它们位于不同的类 `TwoEnglishCourses` 中。结果错误信息显示“method\
    \ totalDays() from Type English is not visible.”\n\n![](img/00018.jpeg)\n#####\
    \ 图 2.15 – 私有和公共变量\n第 3 行将实例变量 `students` 声明为 `private`，而第 4 行将实例变量 `weeks` 和\
    \ `days` 声明为 `public`。注意第 19–25 行，私有变量 `students` 发生了两个错误（“第 19 和 23 行”）。此外，第\
    \ 27 和第 28 行存在一个错误，显示“English.students is not visible”。私有变量仅对 `English` 类可见，对\
    \ `TwoEnglishCourses` 不可见。然而，公有变量对两个类都可见。以下是每个修饰符的访问级别：\n\n| | public | protected\
    \ | no modifier | private |\n| --- | --- | --- | --- | --- |\n| Class | Yes |\
    \ Yes | Yes | |\n| Package | Yes | Yes | No | |\n| Subclass | Yes | No | No |\
    \ |\n| World | Yes | No | No | No |\n\n##### 图 2.16 – 访问修饰符\n\n`static` 关键字可以应用于变量、方法、块和嵌套类。通常，类的成员是通过类的对象通过点运算符来访问的。当一个成员被声明为\
    \ `static` 时，可以在创建对象之前访问该成员。但是，访问静态成员时，最好用类名和点运算符跟在静态成员，而不是对象名和点运算符。如果使用对象名和点运算符引导静态成员，则会出现警告信息。以下是静态变量的语法和示例：\n\
    \n`ClassName.variableName`\n\n```java\nclass StaticAddNumbers {\n    static int\
    \ a;\n    int b;\n\n    int addNumbers () {\n        return a + b;\n    }\n}\n\
    \nclass StaticExample {\n    public static void main(String[] args) {\n      \
    \  StaticAddNumbers objAdd = new StaticAddNumbers ();\n        objAdd.b = 50;\n\
    \        StaticAddNumbers.a = 25;\n        System.out.println(\"The value of 'objAdd.b'\
    \ is \" + objAdd.b);\n        System.out.println(\"The value of 'a' is \" + StaticAddNumbers.a);\n\
    \        System.out.println(\"The total of 'a + b' is \" + objAdd.addNumbers()\
    \ + \"\\n\");\n        StaticAddNumbers.a = 30;\n        System.out.println(\"\
    The value of 'a' changed to \" + StaticAddNumbers.a + \" but the value of 'objAdd.b'\
    \ remains \" + objAdd.b);\n    }\n}\n```\n\n![](img/00019.jpeg)\n##### 图 2.17\
    \ – 静态变量\n输出：\nThe value of 'objAdd.b' is 50\nThe value of 'a' is 25\nThe total\
    \ of 'a + b' is 75\nThe value of 'a' changed to 30 but the value of 'objAdd.b'\
    \ remains 50\n\n"
- fmt: "\nChapter three will discuss the following concerning arrays and strings:\n\
    \n- [Single-Dimensional Arrays](#part0000_split_029.html__One-Dimensional_Arrays)\n\
    - [Multi-Dimensional Arrays](#part0000_split_030.html__Multi-Dimensional_Arrays)\n\
    - [For-Each Loop](#part0000_split_031.html__For-Each_Loop)\n- [Strings](#part0000_split_034.html__Strings)\n\
    \n# Single-Dimensional Arrays\n\nSingle-Dimensional arrays are the most used type\
    \ of arrays. It stores a list of related values such as daily temperatures for\
    \ a specific month. In return, the list of values can lead to a monthly temperature\
    \ average. All of the information stored in an array is easily accessible by an\
    \ index. The following are two syntaxes for defining a single-dimensional array:\n\
    \n## Syntax\n\n```\narrType arrName[] = new arrType[arrSize];\n```\nor\n\n```\n\
    arrType arrName[];\narrName = new arrType[arrSize];\n```\n\n| Parameter | Description\
    \ |\n| :--- | :--- |\n| `arrType` | Determines the data type of each value in\
    \ the array |\n| `arrName` | Name of the array |\n| `new` | Allocates memory for\
    \ the array |\n| `arrSize` | Number of values in the array |\n\n### Figure 3.1\
    \ – Single Dimension Syntax Details\n\nThe following is an example of a single-dimensional\
    \ array:\n\n```java\npublic class OneDimensionalArray {\n    public static void\
    \ main(String[] args) {\n        int [] tempMay = new int [3];\n        tempMay[0]\
    \ = 105;\n        tempMay[1] = 102;\n        tempMay[2] = 98;\n        System.out.println(\"\
    The highest temperature in May was \" + tempMay[0] + \" degrees\");\n        System.out.println(\"\
    The 2nd highest temperature in May was \" + tempMay[1] + \" degrees\");\n    \
    \    System.out.println(\"The 3rd highest temperature in May was \" + tempMay[2]\
    \ + \" degrees\");\n    }\n}\n```\n\n![](images/00020.jpeg)\n\n### Figure 3.2\
    \ – Single-Dimensional Array Example\n\nProgram Output:\n```\nThe highest temperature\
    \ in May was 105 degrees\nThe 2nd highest temperature in May was 102 degrees\n\
    The 3rd highest temperature in May was 98 degrees\n```\n\n- Line 5 initializes\
    \ the array `tempMay` by using the keyword `new`. The number 3 in brackets `[3]`\
    \ indicate the array contain 3 elements.\n- Lines 7 – 9 assign values to each\
    \ of the array. The first value is stored at index position 0. Zero is always\
    \ the starting position for arrays. In this example, the last index position is\
    \ 2. Elements 0 – 2 holds a total of 3 elements.\n\nArrays can be assigned values\
    \ on one line without the keyword `new`. The following is another way to assign\
    \ values to an array:\n\n```java\npublic class OneDimensionalArray {\n    public\
    \ static void main(String[] args) {\n        int[] tempMay = {105, 102, 98};\n\
    \        System.out.println(\"The highest temperature in May was \" + tempMay[0]\
    \ + \" degrees\");\n        System.out.println(\"The 2nd highest temperature in\
    \ May was \" + tempMay[1] + \" degrees\");\n        System.out.println(\"The 3rd\
    \ highest temperature in May was \" + tempMay[2] + \" degrees\");\n    }\n}\n\
    ```\n\n![](images/00021.jpeg)\n\n### Figure 3.3 – Alternate Single-Dimensional\
    \ Array Example\n\nProgram Output:\n```\nThe highest temperature in May was 105\
    \ degrees\nThe 2nd highest temperature in May was 102 degrees\nThe 3rd highest\
    \ temperature in May was 98 degrees\n```\n\nLine 5 initializes the array `tempMay`\
    \ and assigns three values to the array. Notice the keyword `new` is not used\
    \ to initialize the array. However, the data type `int` is specified along with\
    \ the array name and values. Square brackets indicates an array while the number\
    \ of values within the curly brackets dictate the array size. The following is\
    \ a diagram displaying the array values from [Figure 3.2](#part0000_split_029.html_Figure_3_2)\
    \ and [Figure 3.3](#part0000_split_029.html_Figure_3_3):\n\n![](images/00022.jpeg)\n\
    \n### Figure 3.4 – Array Name, Values, and Indexes\n\n# Multi-Dimensional Arrays\n\
    \nMulti-Dimensional arrays are regarded as an array of arrays. Therefore two or\
    \ more brackets must be used to declare a multi-dimensional array. The most common\
    \ type of multi-dimensional array is a two-dimensional array. Each dimension contains\
    \ its own set of brackets. A spreadsheet with rows and columns is a good way to\
    \ imagine a two-dimensional array. The first pair of brackets are rows and second\
    \ pair of brackets are columns. The following is the syntax and example for a\
    \ two-dimensional array:\n\n## Syntax\n\n```\narrType arrName[][] = new arrType[arrSize1][arrSize2];\n\
    public class TwoDimensionalArray {\n    public static void main(String[] args)\
    \ {\n        int row, column;\n        int testDimension[][] = new int[2][3];\n\
    \        for (row = 0; row < 2; row++) {\n            for (column = 0; column\
    \ < 3; column++) {\n                testDimension[row][column] = row * 3 + 1;\n\
    \                System.out.print(testDimension[row][column] + \" \");\n     \
    \       }\n            System.out.println();\n        }\n    }\n}\n```\n\n![](images/00023.jpeg)\n\
    \n### Figure 3.5 – Two-Dimensional Example\n\nProgram Output:\n```\n1 2 3\n4 5\
    \ 6\n```\n\n- Line 7 initializes the two-dimensional array `testDimension` using\
    \ the keyword `new`. Two brackets indicate there are two dimensions similar to\
    \ rows and columns.\n- Notice the output produces a total of two rows and three\
    \ columns. Line 9 represents the count for rows while line 1 represents the count\
    \ for column.\n- Line 13 calculates the values through six.\n- Line 14 prints\
    \ the values through six\n\nComparable to single-dimensional arrays, a two-dimensional\
    \ array can be declared and initialized without the keyword `new`. The following\
    \ is an example of a two-dimensional array without being initialized keyword `new`.\n\
    \n```java\npublic class TwoDimensionalArray {\n    public static void main(String[]\
    \ args) {\n        int row, column;\n        int testDimension[][] = {\n     \
    \       {1, 2, 3},\n            {4, 5, 6}\n        };\n        for (row = 0; row\
    \ < 2; row++) {\n            for (column = 0; column < 3; column++) {\n      \
    \          System.out.print(testDimension[row][column] + \" \");\n           \
    \ }\n            System.out.println();\n        }\n    }\n}\n```\n\n![](images/00024.jpeg)\n\
    \n### Figure 3.6 – Alternate Two-Dimensional Example\n\nProgram Output:\n```\n\
    1 2 3\n4 5 6\n```\n\n- Lines 7–1 initialize the array by surrounding each dimension’s\
    \ list within a separate set of brackets. Notice how element is divided by a comma\
    \ and each set of brackets represent a row. The previous examples output the same\
    \ information. A specific value can be printed by indicating a row and column.\
    \ The following example prints a specific value according to a defined row and\
    \ column.\n"
