    \n##### Figure 2.15 – Private and Public Instance Variables\n\nLine 3 declares\
    \ instance variable “students” as private while line 4 declares instance variables\
    \ “weeks and days” as public. Notice lines 19 – 25, two errors “lines 19 and 23”\
    \ occur for the private variable “students”. In addition, there is an error on\
    \ lines 27 and 28 which states “The field English.students is not visible”. The\
    \ private variable is only visible to the English class but not visible to the\
    \ class “TwoEnglishCourses”. However, the public variables are visible to both\
    \ classes. The following are access levels for each modifier:\n\n|  | public |\
    \ protected | no modifier | private |\n\n| Class | Yes | Yes | Yes | Yes |\n\n\
    | Package | Yes | Yes | Yes | No |\n\n| Subclass | Yes | Yes | No | No |\n\n|\
    \ World | Yes | No | No | No |\n\n##### Figure 2.16 – Access Modifier Levels\n\
    \n# Static Keyword\n\nThe static keyword can be applied to variables, methods,\
    \ blocks, and nested classes. Usually, the members of a class are accessed through\
    \ an object of the class via the [dot operator](#part0000_split_018.html_Dot_Operator).\
    \ When a member is declared as static, the member can be accessed prior to creating\
    \ an object. However to access a static member, it is best to precede the static\
    \ member with a class name and [dot operator](#part0000_split_018.html_Dot_Operator)\
    \ rather than the object name and [dot operator](#part0000_split_018.html_Dot_Operator).\
    \ A warning message appears if the static member is preceded by an object name\
    \ and [dot operator](#part0000_split_018.html_Dot_Operator). The following is\
    \ the syntax and example of a static variable:\n\nSyntax\n\nClassName.variableName;\n\
    \nclass StaticAddNumbers\n\n{\n\n static  int  a;\n\n int  b;\n\n int addNumbers\
    \ ()\n\n              {\n\n return  a + b;\n\n              }\n\n}             \n\
    \nclass StaticExample\n\n{\n\n public  static  void main(String[] args)\n\n             \
    \ {\n\nStaticAddNumbers objAdd = new StaticAddNumbers ();\n\n objAdd.b = 50;\n\
    \n StaticAddNumbers.a = 25;\n\n                            System.out.println(\"\
    The value of 'objAdd.b' is \" + objAdd.b);                                         \
    \              \n\n                            System.out.println(\"The value\
    \ of 'a' is \" + StaticAddNumbers.a);\n\n                            System.out.println(\"\
    The total of 'a + b' is \" + objAdd.addNumbers() + \"\\n\");\n\n StaticAddNumbers.a\
    \  = 30;\n\n                            System.out.println(\"The value of 'a'\
    \ changed to \" + StaticAddNumbers.a  + \" but the value of 'objAdd.b' remains\
    \ \" + objAdd.b);                           \n\n                            System.out.println(\"\
    The total of 'a+b' is \" + + objAdd.addNumbers());\n\n              }\n\n}\n\n\
    ##### ![](images/00019.jpeg)\n\n##### Figure 2.17 – Static Variable\n\nProgram\
    \ Output:\n\nThe value of 'objAdd.b' is 50\n\nThe value of 'a' is 25\n\nThe total\
    \ of 'a + b' is 75\n\nThe value of 'a' changed to 30 but the value of 'objAdd.b'\
    \ remains 50\n\nThe total of 'a+b' is 80\n\nLine 3 declares a static variable\
    \ named “a” within class “StaticAddNumbers”. The variable “a” is accessed in lines\
    \ 19, 22, 25, and 26 by using the class name, dot operator, and static variable\
    \ name. Lines 19 and 25 set the value while lines 22 and 26 displays the value.\
    \ Static variables are treated like global variables and initialized at the start\
    \ of execution.\n\nChapter 2 described classes, objects, methods, annotations,\
    \ access modifiers, and keywords “this and static”. A class incorporates data\
    \ and code that operates on the data. In addition, classes provide a template\
    \ for objects which is the foundation for object-oriented programming. Methods\
    \ carry out a specific task while providing access to data defined by the class.\
    \ Chapter 3 will discuss arrays and strings which are regarded as objects in Java.\n\
    \nChapter 3\n\nArrays and Strings\n\nAn array is a collection of variables with\
    \ the same data type, same name and fixed number of values. The values are accessed\
    \ via an index which identifies an item and starts at zero. Each item in the array\
    \ is called an element. A benefit of arrays is the capacity to deal with a large\
    \ number of related values in one entity. For instance, a single array has the\
    \ ability to hold every employee’s salary.\n\nIn Java, arrays and strings are\
    \ considered objects. A string is a data type containing an immutable sequence\
    \ of characters. Immutable means the string cannot be modified after an initialization\
    \ statement. However, there are many methods that can perform actions on the strings."
