    \n**Program Output:**\nThe English 101 course has 10 students and the course last\
    \ 12 days\nThe English 202 course has 12 students and the course last 18 days\n\
    \nLines 12 and 13 create two objects (`ENG101` and `ENG202`) then assign values\
    \ to both objects in lines 18 – 24. Recall, if multiple objects exist then each\
    \ object can hold a different value than the other object. In this example, a\
    \ different value is assigned to variables `students` and `weeks` but variable\
    \ `days` contains the same value `3` for both objects.\n\n**Note:** The convention\
    \ for variables are `lowerCamelCase` where each word in the variable name begins\
    \ with a capital letter except the first word. However, `ENG101` and `ENG202`\
    \ is an exception which contains all capital letters because school courses normally\
    \ have all capital letters before a number in their course name.\n\n# Methods\n\
    \nA method is a block of code surrounded by curly brackets that perform a specific\
    \ action/task. The purpose is to manipulate and provide access to data defined\
    \ by the class. In other words, a method performs actions on the data. It is best\
    \ for all methods to carry out a single task. For example, a good method will\
    \ only perform a single task of adding numbers but not adding numbers and saving\
    \ data to a file. The program may become difficult to read and understand if a\
    \ method carries out more than one task.\n\nMethods consist of a header and body.\
    \ The method header includes a method type and a method name. The convention for\
    \ method name is similar to a variable name which consist of a `lowerCamelCase`\
    \ style. Each word begins with a capital letter except the first word. Succeeding\
    \ the method name is a required pair of parenthesis which sets apart variables\
    \ from methods. The following is the syntax for method:\n\n### Syntax\n\n```\n\
    methodType methodName (parameter-list)\n{\n    // Method Body\n}\n```\n\nThe `methodType`\
    \ (known as return type) determines the data type returned by the method. A programmer\
    \ is forced to use keyword `void` for the `methodType` if no values are returned.\
    \ The `methodName` can be any name except a Java keyword. A good technique to\
    \ employ for naming a method is verb-noun combinations, such as `getOrder` or\
    \ `addNumbers`. Method body is where code will be executed to carry out a task.\
    \ The parameter list are variables that receive `arguments` passed to the method.\
    \ If the method has no `parameters` then the parameter list must remain empty.\n\
    \n**Note:** A method signature is the `methodName` and parameter list.\n\n## Method\
    \ Returns\n\nMethod returns are concepts that return a value from a method or\
    \ transfer control out of a method. Both concepts are achieved by using the `return`\
    \ keyword. Execution is terminated and subsequent statements within the method\
    \ are skipped no matter where the `return` keyword is located. The following are\
    \ two method return types:\n\n1. Methods that return a value\n2. Methods that\
    \ cannot return a value\n\nAccording to `ORACLE`, a method returns to the code\
    \ that invoked it when it\n* completes all the statements in the method,\n* reaches\
    \ a `return` statement or\n* throws an exception\n\nwhichever occurs first.\n\n\
    **Note:** Usually, the `return` keyword (also known as return statement) is not\
    \ used for methods that cannot return a value. It is not used because all of the\
    \ code within the method is completed before executing the `return` keyword. However,\
    \ if the `return` keyword is used, then it will be implemented at the end of the\
    \ method to transfer control.\n\n### Return A Value\n\nMost methods return a value\
    \ which specifies the outcome of a calculation or result (pass, fail, etc.) The\
    \ return value is required to be the same data type as the method type. For instance,\
    \ if the method type is an `int` data type then the return type must be an `int`\
    \ data type. The following is a syntax and example for a method return:\n\n**Syntax**\n\
    \n```\nreturn value;\n```\n\n```java\nclass English\n{\n    int students, weeks,\
    \ days;\n    int totalDays ()\n    {\n        return weeks * days;\n    }\n}\n\
    \nclass TwoEnglishCourses\n{\n    public static void main (String args[])\n  \
    \  {\n        English ENG101 = new English ();\n        English ENG202 = new English\
    \ ();\n        ENG101.students = 10;\n        ENG101.weeks = 4;\n        ENG101.days\
    \ = 3;\n        ENG202.students = 12;\n        ENG202.weeks = 6;\n        ENG202.days\
    \ = 3;\n        System.out.println(\"The English 101 course has \" + ENG101.students\
    \ + \" students and the course last \" + totalDays101 + \" days\");\n        System.out.println(\"\
    The English 202 course has \" + ENG202.students + \" students and the course last\
    \ \" + totalDays202 + \" days\");\n    }\n}\n```\n\n### Figure 2.4 – Return a\
    \ Value\n\n**Program Output:**\nThe English 101 course has 10 students and the\
    \ course last 12 days\nThe English 202 course has 12 students and the course last\
    \ 18 days\n\nThe `.` operator connects `ENG101` and `ENG202` to a member `totalDays()`.\
    \ The `totalDays()` is placed on the right of the dot operator.\n\n### Return\
    \ No Value\n\nMethods that cannot return a value are `void` methods. The keyword\
    \ `void` is used as the method type rather than `int`.\n\n```java\nclass English\n\
    {\n    int students, weeks, days;\n    void totalDays ()\n    {\n        // No\
    \ return statement\n    }\n}\n\nclass TwoEnglishCourses\n{\n    public static\
    \ void main (String args[])\n    {\n        English ENG101 = new English ();\n\
    \        English ENG202 = new English ();\n        ENG101.students = 10;\n   \
    \     ENG101.weeks = 4;\n        ENG101.days = 3;\n        ENG202.students = 12;\n\
    \        ENG202.weeks = 6;\n        ENG202.days = 3;\n        System.out.println(\"\
    How many students are in the English 101 course? \" + ENG101.students);\n    \
    \    System.out.println(\"The course is \" + ENG101.days + \" days for \" + ENG101.weeks\
    \ + \" weeks.\");\n        System.out.print(\"Therefore the course last the following\
    \ total number of days:\");\n        ENG101.totalDays();\n        System.out.println(\"\
    \\n\");\n        System.out.println(\"How many students are in the English 202\
    \ course? \" + ENG202.students);\n    }\n}\n```\n"
