    \n## Pass Arguments To Parameters\n\nArguments are values passed to a method while\
    \ parameters receives the values. In other words, parameters receive arguments.\
    \ Parameter variables are declared within a method’s parenthesis and operate like\
    \ a local variable. Local variables and parameter variables are only visible to\
    \ the method where is declared. It is important to know that one or more arguments\
    \ can be passed to individual parameters. The following is an example of passing\
    \ two arguments to two parameters:\n\n```java\nclass English\n{\n    int totalDays\
    \ (int wk, int d)\n    {\n        return wk * d;\n    }\n}\n\nclass TwoEnglishCourses\n\
    {\n    public static void main (String args[])\n    {\n        English ENG101\
    \ = new English ();\n        English ENG202 = new English ();\n        System.out.println(\"\
    The English 101 course is a total of \" + ENG101.totalDays (4, 3) + \" days\"\
    );\n        System.out.println(\"The English 202 course is a total of \" + ENG202.totalDays\
    \ (6, 3) + \" days\");\n    }\n}\n```\n\n![](images/00010.jpeg)\n### Figure 2.7\
    \ – Pass Arguments To Parameters\n\nProgram Output:\nThe English 101 course is\
    \ a total of 12 days\nThe English 202 course is a total of 18 days\n\n*   Line\
    \ 3 defines two parameters `wk, d` for method `totalDays ()`. Methods can have\
    \ more than one parameter by separating each parameter with a comma\n*   Lines\
    \ 16 and 17 indicates the arguments `4, 3` for object `ENG101` and `6, 3` for\
    \ object `ENG202` are passed to parameters `wk, d`\n\nNote: Objects can be passed\
    \ to a method and returned from a method.\n\n## Method Types\n\nThe following\
    \ are the four types of methods:\n1. Instance Methods\n2. Class Methods\n3. Main\
    \ Method\n4. Constructors\n\n### Instance Methods\n\nInstance methods are called\
    \ (known as invoked) by an object. Therefore an instance method is similar to\
    \ an instance variable whereby members can be accessed through initialized objects.\
    \ However, instance variables can be accessed with an object or without an object.\
    \ The following is an instance method example:\n\n```java\npublic class Lion\n\
    {\n    void sound ()\n    {\n        System.out.println(\"ROAR\");\n    }\n  \
    \  public static void main (String args[])\n    {\n        Lion maleLion = new\
    \ Lion ();\n        maleLion.sound ();\n    }\n}\n```\n\n![](images/00011.jpeg)\n\
    ### Figure 2.8 – Instance Method\nProgram Output:\nROAR\n*   Lines 3 – 6 starts\
    \ the instance method `sound`\n*   Line 10 creates an object `maleLion` using\
    \ keyword `new`\n*   Line 11 calls the instance method `sound` through initialized\
    \ object `maleLion`\n\n### Class Methods\n\nA class method (known as static method)\
    \ is similar to a class variable whereby they are declared with `static` keyword.\
    \ The `static` keyword means the member belongs to the class and shared between\
    \ all objects. Class methods can be accessed via the object name or class name.\
    \ However, a warning appears when accessing the method by an object. Therefore\
    \ favored way to access classed methods is through class name. The following is\
    \ a class method example:\n\n```java\nclass StaticAddNumbers\n{\n    static int\
    \ a, b;\n    static int addNumbers ()\n    {\n        return a + b;\n    }\n}\n\
    \nclass StaticExample\n{\n    public static void main(String[] args)\n    {\n\
    \        StaticAddNumbers objAdd = new StaticAddNumbers ();\n        objAdd.a\
    \ = 20;\n        StaticAddNumbers.b = 30;\n        System.out.println(\"The addition\
    \ of variables 'a + b' is \" + objAdd.addNumbers() + \" and accessed by an object\"\
    );\n        System.out.println(\"The addition of variables 'a + b' is \" + StaticAddNumbers.addNumbers()\
    \ + \" and accessed by a class name\");\n    }\n}\n```\n\n![](images/00012.jpeg)\n\
    ### Figure 2.9 – Class Method\nProgram Output:\nThe addition of variables 'a +\
    \ b' is 50 and accessed by an object\nThe addition of variables 'a + b' is 50\
    \ and accessed by a class name\n\n*   Line 3 declares two class/static variables\
    \ `a, b`\n*   Lines 5 – 7 defines the class/static method `addNumbers`\n*   Line\
    \ 17 assigns 20 to class variable `a`. Notice, the warning next to line 17 that\
    \ states “The static field StaticAddNumbers.a should be accessed in a static way”.\
    \ This warning means the class variable (known as static variable) is preferred\
    \ to be accessed by class name. Line 18 does not have a warning because class\
    \ name precedes the variable name `b`\n*   Line 20 is similar to line 18. A warning\
    \ message appears because the static method is accessed via object name rather\
    \ than class name “i.e., line 21”\n\nNote: Class methods can only access class\
    \ variables and only call other class methods.\n\n### Main Method\n\nThe main\
    \ method is unique and mandatory if a particular class begins the program. This\
    \ method is required because it executes the program. The following is the syntax\
    \ for main method:\n\n```java\npublic static void main(String[] args)\n{\n //\
    \ Method Body\n}\n```\n\nThere are several examples of the main method but the\
    \ following explains each component:\n*   `public` - the method can be accessed\
    \ by all classes\n*   `static` – the method is shared between all objects\n* \
    \  `void` – the method does not return any values\n*   `String[] args` – the method\
    \ receives a String argument and pass the argument to the program\n\n### Constructors\n\
    \nA constructor is a special method that has the same name as the class. If a\
    \ constructor is not defined then a blank constructor is automatically created.\
    \ Consequently all classes contain a constructor which initialize objects of a\
    \ specific class. A new object calls a constructor every time the object is created.\
    \ By default, the instance variables are initialized to zero for numeric types,\
    \ null for reference types, and false for boolean types.\n"
