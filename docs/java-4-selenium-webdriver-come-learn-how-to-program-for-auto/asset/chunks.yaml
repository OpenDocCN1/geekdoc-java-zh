    \ are used for binding at run time.\n\n# Abstraction\n\nAbstraction applies to\
    \ classes as well as methods. The keyword “abstract” is used to create abstract\
    \ classes and methods. An abstract class cannot be instantiated so it is used\
    \ as a superclass. Abstract methods are declared without an implementation so\
    \ it does not include a body. Abstract classes can include abstract methods and\
    \ implemented methods. However, an abstract class cannot contain objects due to\
