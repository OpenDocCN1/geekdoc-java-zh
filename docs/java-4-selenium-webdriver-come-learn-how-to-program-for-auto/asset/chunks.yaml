    \ or more interfaces separated by a comma that will be extended |\n| `variableType`\
    \ | One or more interface variables |\n| `methodType methodName1 (parameter-list)`\
    \ | One or more interface methods |\n\n### Figure 6.1 – Interface Syntax\n\nThe\
    \ following is an interface example:\n\n```java\npublic interface InterfaceTest\n\
