    ### 图 3.7 – 从二维数组中打印特定值\n\n程序输出：\n```\n1 2 3\n4 5 6\nWhat value is located in\
    \ row 1 - column 2? 6\n```\n\n以下展示了表格格式的输出：\n\n![](img/00026.jpeg)\n### 图 3.8\
    \ – 二维数组的特定索引\n\n# For-Each 循环（增强 for 循环）\n\nfor-each 循环（被称为增强 for 循环）旨在用于遍历对象集合（如数组）。这种控制结构提供的功能与\
    \ `for` 循环相同（参见第 4 章 - (Part 1) Java 4 Selenium WebDriver 中的控制结构），它们都执行执行特定次数迭代的代码块。然而，for-each\
    \ 循环在遍历集合中的每个元素时执行代码块。以下是 for-each 循环的语法：\n\n### 语法\n```java\nfor (collType itrVariable:\
    \ collection)\n{\n  statement(s)\n}\n```\n\n### 语法细节\n\n| 参数 | 说明 |\n| :--- |\
    \ :--- |\n| collType | 指代集合的数据类型 |\n| itrVariable | 指迭代变量的名称，它在每次迭代后接收每个元素 |\n\
    | collection | 要进行遍历或循环的集合（如数组） |\n| statement(s) | 将执行的代码块 |\n| { … } | 开始和结束的大括号\
    \ |\n\n### 图 3.9 – For-Each 循环语法细节\n\nfor-each 循环中的所有元素都被检索并存储在 `itrVariable`\
    \ 中。循环不断重复，直到所有元素按索引顺序被读取。重要的是，`colltype` 必须与对象的类型相同。在数组的情况下，`collType` 必须与 `arrType`\
    \ 的类型相同。以下是 for-each 循环的示例：\n\n```java\npublic class ForEachLoop\n{\n public static\
    \ void main(String[] args)\n    {\n     double[] costPerItem = {12.34, 56.78,\
    \ 99.99};\n     double totalCost = 0;\n     for (double i: costPerItem)\n    \
    \ {\n      System.out.println(\"The cost is \" + i);\n      totalCost = totalCost\
    \ + i;\n     }\n     System.out.println(\"\\n\" + \"The total cost of all items\
    \ is \" + totalCost);\n  }\n}\n```\n\n![](img/00027.jpeg)\n### 图 3.10 – For Each\
    \ 循环示例\n\n程序输出：\n```\nThe cost is 12.34\nThe cost is 56.78\nThe cost is 99.99\n\
    The total cost of all items is 169.11\n```\n\n*   第 5 行和第 6 行初始化并为数组 `costPerItem`\
    \ 和 `totalCost` 赋值\n*   第 8 行检索数组 `costPerItem` 中的每个元素 (12.34, 56.78, 99.99)\n\
    *   第 10 行打印每个元素\n*   第 11 行计算所有元素的总和\n\n注意：第 8 – 11 行可以读为：“对于 `costPerItem` 数组中的每个\
    \ double 类型数据，打印每个元素并计算所有元素的总和”。\n\n## 二维数组迭代\n\n二维数组的迭代操作与单维数组类似。二维数组的迭代变量必须引用单维数组。它必须引用单维数组是因为二维数组被视为“数组的数组”。因此，每次二维数组迭代都会检索下一个数组。以下是二维数组迭代的示例：\n\
    \n```java\npublic class ForEachLoop\n{\n public static void main(String[] args)\n\
    \    {\n     int totalCost = 0;\n     int[][] costPerItem =\n     {\n      {5,\
    \ 10},\n      {5, 20},\n      {5, 30}\n     }; for (int i[]: costPerItem)\n  \
    \   {\n      for (int j: i)\n      {\n         System.out.println(\"The cost is\
    \ \" + j);\n         totalCost = totalCost + j;\n      }\n     }\n     System.out.println(\"\
    \\n\" + \"The total cost of all items is \" + totalCost);\n  }\n}\n```\n\n![](img/00028.jpeg)\n\
    ### 图 3.11 – 二维数组迭代\n\n程序输出：\n```\nThe cost is 5\nThe cost is 10\nThe cost is\
    \ 15\nThe cost is 25\nThe cost is 30\nThe total cost of all items is 105\n```\n\
    \n*   第 5 行初始化 `totalCost` 并赋值为零“0”\n*   第 6 – 11 行初始化并为二维数组 `costPerItem` 赋值\n\
    *   第 13 行 `for (int i[]: costPerItem)` 引用单维数组，每次迭代从头到尾检索 `costPerItem` 中的下一个数组（“从索引\
    \ 0 到索引 5”）\n*   第 15 行 `for (int j: i)` 循环每个元素\n\n## 数组搜索\n\n数组可以被检索以获取特定值。有时需要从集合中获取某个值。以下示例展示了如何从数组中检索特定值：\n\
    \n```java\npublic class ForEachLoop\n{\n public static void main(String[] args)\n\
    \    {\n     int specificCost = 20;\n     int[][] costPerItem =\n     {\n    \
    \  {5, 10},\n      {5, 20},\n      {5, 30}\n     }; for (int i[]: costPerItem)\n\
    \     {\n      for (int j: i)\n      {\n         if (j == specificCost)\n    \
    \     {\n          System.out.println(\"The specific cost of \" + specificCost\
    \ + \" was located in the collection of values\");\n         }\n      }\n    \
    \ }\n  }\n}\n```\n\n![](img/00029.jpeg)\n### 图 3.12 – 搜索二维数组\n\n程序输出：\n```\nThe\
    \ specific cost of 20 was located in the collection of values\n```\n\n*   第 5\
    \ 行为变量 `specificCost` 赋值 20\n*   第 6 – 11 行初始化并为二维数组 `costPerItem` 赋值\n*   第 13\
    \ 行 `for (int i[]: costPerItem)` 引用单维数组，每次迭代从头到尾检索 `costPerItem` 中的下一个数组（“从索引\
    \ 0 到索引 5”）\n*   第 15 行 `for (int j: i)` 循环每个元素\n*   第 17 行通过变量 `specificCost`\
    \ 搜索二维数组中的特定元素“20”\n\n# Strings\n\n字符串是一种不可变字符序列的数据类型。这种数据类型被视为对象，因此在 (Part 1)\
    \ Java 4 Selenium WebDriver 中与其他数据类型一起并没有讨论。创建字符串有两种方法：\n\n1.  字符串字面量\n2.  使用\
    \ `new` 关键字创建字符串\n\n以下是字符串字面量的示例：\n\n```java\npublic class StringObject\n{\n public\
    \ static void main(String[] args)\n    {\n     String firstName = \"Rex\";\n \
    \    String lastName = \"Jones\";\n     System.out.println(\"Strings are placed\
    \ within quotation marks\");\n     System.out.print(\"The first name is \" + firstName\
    \ + \" and last name is \" + lastName + \".\");\n     System.out.println(\" Both\
    \ names were declared and initialized as strings. A sequence of characters\");\n\
    \  }\n}\n```\n\n![](img/00030.jpeg)\n### 图 3.13 – 字符串示例\n\n程序输出：\n```\nStrings\
    \ are placed within quotation marks\nThe first name is Rex and last name is Jones.\
    \ Both names were declared and initialized as strings. A sequence of characters\n\
    ```\n\n*   第 5 行和第 6 行声明并初始化字符串数据类型\n*   第 8 – 10 行在 `println` 方法中显示字符串字面量\n\n"
- fmt: "\nStrings can be created like other objects by using the keyword `new` which\
    \ calls the `String` constructor. The following is an example of a `String` with\
    \ the keyword `new`:\n\n```java\nString name = new String (\"Rex Jones\");\n```\n\
    \n## String Operations\n\nIn Java, there is a `String` class which contains many\
    \ methods for operations. The following is a screenshot of several `String` methods\
    \ per Eclipse:\n\n![](images/00031.jpeg)\n### Figure 3.14 – String Methods\n\n\
    * Line 7 displays a list of methods after typing a period after the variable `name`\n\
    * A description of a specific method `equals` appears when it is highlighted\n\
    \nThe following are popular `String` methods, their data type, and description:\n\
    \n1. `charAt (int index)`: `char` - Returns the character at the specified index\n\
    2. `compareTo (str)`: `int` - Returns less than zero if the calling string is\
    \ less than `str`, greater than zero if the calling string is greater than `str`,\
    \ and zero if the strings are equal\n3. `concat (String str)`: `String` - Concatenates\
    \ the given string at the end of the string\n4. `equals (Object anObject)`: `boolean`\
    \ – Compares the string to a specific object\n5. `equalsIgnoreCase (String string)`:\
    \ `boolean` - Compare strings and ignore the cases\n6. `indexOf (String str)`:\
    \ `int` - Returns the index of the first occurrence of a specified substring\n\
    7. `lastindexOf (String str)`: `int` - Returns the index of the last occurrence\
    \ of a string\n8. `length()`: `int` - Returns the length of a string\n9. `replace\
    \ (char oldChar, char newChar)`: `String` - Returns the new string after changing\
    \ all occurrences of the old string\n10. `split (String regex)`: `String[]` -\
    \ Splits the string and returns a string array that matches the given regular\
    \ expression\n11. `toLowerCase()`: `String` - Converts all of the characters in\
    \ a `String` to lower case\n12. `toUpperCase()`: `String` - Converts all of the\
    \ characters in a `String` to upper case\n13. `trim()`: `String` - Returns a copy\
    \ of the string, after deleting leading and trailing white spaces from the original\
    \ string\n\nA string data type cannot be combined with a different data type for\
    \ an operation such as multiplication, subtraction, or division. For example,\
    \ a string value of “534000.00” appears to be a numeric value but string does\
    \ not allow mathematical operations unless a [type wrapper](#part0000_split_036.html__Type_Wrappers)\
    \ converts the string. The value “534000.00” resembles a `double` data type. However,\
    \ an error occurs if combined with a double data type. The following example displays\
    \ an error if a string data type is combined with a subtraction operator:\n\n\
    ```java\npublic class StringObject {\n    public static void main(String[] args)\
    \ {\n        String grossIncome = \"534000.00\";\n        double gross = 534000.00;\n\
    \        double taxes = 225000.00;\n        double netIncome;\n        netIncome\
    \ = grossIncome - taxes;\n        netIncome = gross - taxes;\n        System.out.println(\"\
    The net income is \" + netIncome);\n    }\n}\n```\n\n![](images/00032.jpeg)\n\
    ### Figure 3.15 – String Error Due To Mathematical Operations\n\n* Line 5 declares\
    \ and initializes a String value “534000.00”\n* Line 10 displays an error because\
    \ Strings do not allow mathematical operations. However, notice line 11 does not\
    \ display an error because both variables `gross` and `taxes` are declared as\
    \ a double data type “lines 6 and 7”\n\n## Type Wrappers\n\nType wrappers are\
    \ used to convert strings into primitive types (`byte`, `double`, `float`, `integer`,\
    \ `long`, `short`). Therefore the previous example which displayed an error for\
    \ string value “534000.00” can be converted into a number. Type wrappers are used\
    \ to wrap the primitive type. The following is an example of how to return a `double`\
    \ when the value “534000” is specified as a string:\n\n```java\npublic class StringObject\
    \ {\n    public static void main(String[] args) {\n        String grossIncome\
    \ = \"534000.00\";\n        double taxes = 225000.00;\n        double netIncome;\n\
    \        netIncome = Double.parseDouble(grossIncome) - taxes;\n        System.out.println(\"\
    The net income is \" + netIncome);\n    }\n}\n```\n\n![](images/00033.jpeg)\n\
    ### Figure 3.16 – Returns A Double After Reading String Value\n\nProgram Output:\
    \ The net income is 309000.00\n* Line 5 declares and initializes a String value\
    \ “534000.00”\n* Line 9 parses (known as reads) the string `grossIncome` then\
    \ return a double data type. Afterwards the variable `taxes` “225000” is subtracted\
    \ from `grossIncome` “534000” and the value is assigned to `netIncome`\n\nThe\
    \ following is a list of type wrappers that convert a string data type:\n\n| Wrapper\
    \ | Method |\n| :--- | :--- |\n| Double | `Double.parseDouble(string)` |\n| Float\
    \ | `Float.parseFloat(string)` |\n| Long | `Long.parseLong(string)` |\n| Integer\
    \ | `Integer.parseInt(string)` |\n| Short | `Short.parseShort(string)` |\n| Byte\
    \ | `Byte.parseByte(string)` |\n\n### Figure 3.17 – Wrappers\n\nChapter 3 explained\
    \ arrays and strings are objects. An array is a collection of variables with the\
    \ same data type, same name and fixed number of values. A string is a data type\
    \ containing an immutable sequence of characters. Chapter 4 will define inheritance\
    \ which is a hierarchical concept. The concept allows code and objects to be reused.\n\
    \n## Inheritance\n\nInheritance is a hierarchical concept which allows reusable\
    \ code and objects to be extended. A class known as superclass can be created\
    \ with variables then inherited by other classes. The inherited classes are called\
    \ subclasses. Each subclass that inherits the superclass are permitted to add\
    \ their own class members. For example, a dog is an animal, so the class `Dog`\
    \ would be a subclass of `Animal`. A cat is an animal and the class `Cat` would\
    \ also be a subclass of `Animal`. In both examples, class `Animal` is the superclass.\n\
    \nChapter four will explain the following regarding Inheritance:\n* [Fundamentals\
    \ of Inheritance](#part0000_split_038.html__Fundamentals_of_Inheritance)\n* [Superclass\
    \ Object](#part0000_split_039.html__Superclass_Object)\n* [Inheriting Private\
    \ Members](#part0000_split_040.html__Inheriting_Private_Members)\n* [Superclass\
    \ and Subclass Constructors](#part0000_split_041.html__Superclass_and_Subclass)\n\
    * [Polymorphism](#part0000_split_042.html__Polymorphism)\n* [Abstraction](#part0000_split_046.html__Abstraction)\n\
    * [Keyword Final](#part0000_split_047.html__Keyword_Final)\n\n### Fundamentals\
    \ of Inheritance\n\nThe concept of inheriting classes is an important foundation\
    \ within object-oriented programming. Functionalities are added to an existing\
    \ class which prevents the same code from being written times. The subclass inherits\
    \ all class members from the superclass. Another way to view superclass and subclass\
    \ is to think of superclass as the parent and subclass as the child.\n\nIn order\
    \ for the subclass to inherit the superclass, the keyword `extends` must be used\
    \ in the class declaration. Keyword `extends` means the subclass will add to the\
    \ superclass. Subclasses are not allowed to inherit multiple superclasses. However,\
    \ a subclass is allowed to become a superclass for an additional subclass. As\
    \ a result, the additional subclass inherits all class members from each superclass.\
    \ The following is the syntax for a subclass inheriting a superclass:\n\n```java\n\
    class SubClassName extends SuperClassName {\n    // Class Body\n}\n```\n\nThe\
    \ following is an example for a subclass inheriting a superclass:\n\n```java\n\
    class School {\n    int numTeachers;\n    int numStudents;\n    void showNumberOfPeople()\
    \ {\n        System.out.println(\"There are \" + numTeachers + \" teachers and\
    \ \" + numStudents + \" students\");\n    }\n}\n\nclass ElementarySchool extends\
    \ School {\n    String principalName;\n    int totalTeacherStudents() {\n    \
    \    return numTeachers + numStudents;\n    }\n    void displayPrincipal() {\n\
    \    }\n}\n```\n"
