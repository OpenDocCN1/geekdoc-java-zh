    \ the new data type “English” is the class name.\n\nNote: A convention for naming\
    \ classes is to use an UpperCamelCase where each word in the class name begins\
    \ with a capital letter (i.e., EnglishCourse).\n\n# Objects\n\nObject-Oriented\
    \ programming (OOP) is built upon objects. Therefore it is crucial to understand\
    \ how objects are formed and utilized. An object can be anything. All objects\
    \ share two characteristics: state and behavior. State identifies the object and\
    \ behavior represent the actions of the object. For example, a dog has a state\
    \ (name, breed, color) which identifies the dog and behavior (bark, jump, fetch)\
    \ which represent the dog’s actions. The state of an object is supported by variables\
    \ while behavior is implemented through [methods](#part0000_split_019.html__Methods).\
    \ Objects are created using the keyword “new”. The following example illustrates\
    \ how to create an object and how to access instance variables: \n\nclass English\n\
    \n{\n\n int  students;\n\n int  weeks;\n\n int  days;\n\n}\n\nclass OneEnglishCourse\n\
    \n{\n\n public  static  void main (String args[])\n\n              {\n\n English\
    \ ENG101 = new English ();\n\n int  totalDays;\n\n ENG101.students = 10;\n\n ENG101.weeks\
    \ = 4;\n\n ENG101.days = 3;\n\n totalDays = ENG101.weeks * ENG101.days;\n\n             \
    \               System.out.println(\"The English 101 course is a total of \" +\
    \ totalDays + \" days\");\n\n              }\n\n}\n\n##### ![](images/00005.jpeg)\n\
    \n##### Figure 2.2 – Create New Object and Access Instance Variables\n\nProgram\
    \ Output:\n\nThe English 101 course is a total of 12 days\n\nLine 12 creates a\
    \ new object (English ENG101 = newEnglish ();) by combining two steps. According\
    \ to Java A Beginner’s Guide Sixth Edition (2014), the two steps combined can\
    \ be rewritten like the following to show each step individually (page 106):\n\
    \n1.  English ENG101; - The left side of  the assignment which declares a variable\
    \ called ENG101 of class type English\n\n2.  ENG101 = new English (); - The right\
    \ side of the assignment which creates a copy of the object and give ENG101 a\
    \ reference to the object\n\nENG101 is a creation (known as instance) of English\
    \ after creating the new object. Lines 15 – 17 assign values to the instance variables\
    \ by accessing the variables using the dot (.) operator. The following is the\
    \ syntax for utilizing the dot operator:\n\nSyntax\n\nobjectName.MemberName;\n\
    \nThe dot operator connects an object with a member (instance variable or method).\
    \ In this example, an object name (ENG101) is located on the left and the instance\
    \ variables (students, weeks, days) are located on the right. An object hold its\
    \ own instance variable copy defined by the class. Therefore, if multiple objects\
    \ exist, each object can hold a different value than the other object. The following\
    \ example illustrate a creation of two objects (ENG101 and ENG202):\n\nclass English\n\
    \n{\n\n int  students;\n\n int  weeks;\n\n int  days;\n\n}\n\nclass TwoEnglishCourses\n\
    \n{\n\n public  static  void main (String args[])\n\n              {\n\n English\
    \ ENG101 = new English ();\n\n English ENG202 = new English ();\n\n int  totalDays101;\n\
    \n int  totalDays202;\n\n ENG101.students = 10;\n\n ENG101.weeks = 4;\n\n ENG101.days\
    \ = 3;\n\n ENG202.students = 12;\n\n ENG202.weeks = 6;\n\n ENG202.days = 3;\n\n\
    \ totalDays101 = ENG101.weeks * ENG101.days;"
