    \ as the methodType rather than a data type such as “int”. An error occurs if\
    \ there is an attempt to return a value from the void method. The following is\
    \ a void method example:\n\nclass English\n\n{\n\n int  students, weeks, days;\n\
    \n void totalDays ()\n\n              {\n\n System.out.println(weeks * days);\n\
    \n              }             \n\n}\n\nclass TwoEnglishCourses\n\n{\n\n public\
    \  static  void main (String args[])\n\n              {\n\nEnglish ENG101 = new\
