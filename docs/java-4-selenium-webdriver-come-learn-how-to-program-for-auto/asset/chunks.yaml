  trans: "\n\n数据以及操作该数据的代码（称为语句）是对象的两个合并的概念。因此，这两个合并的概念允许了一种名为“信息隐藏”的概念，通过这种方式可以隐藏数据。因此，默认情况下，对象的数据只能通过持有该对象的方法访问。受限制的访问防止了其他程序组件的干扰并导致错误。如果另一个组件想要更改对象的数据，该组件必须调用一个公开访问的方法。以下是四种类型的方法：\n\
    \n1. `Instance`（实例） – 可由对象访问的方法\n2. `Class`（类） – 类中所有对象共享的方法\n3. `Main`（主） – 用于运行应用程序的特殊方法。Selenium\
    \ WebDriver 不需要这种类型的方法。\n4. `Constructor`（构造函数） – 用于初始化特定类对象的特殊方法\n\n方法和变量被标记为类的成员，因为它们构成了该类。对这两个成员的访问由四种修饰符控制：\n\
    \n1. `public`（公共） – 允许访问定义在其 `class` 外部代码的修饰符\n2. `private`（私有） – 允许访问其 `class`\
    \ 内部其他成员的修饰符\n3. `no modifier`（无修饰符） – 允许访问其 `package` 内部所有 `classes` 的修饰符\n4.\
    \ `protected`（保护） – 允许在其 `package` 内部以及所有 `subclasses` 中访问的修饰符\n\n通常，类的成员通过其类内部的对象进行访问。然而，关键字\
    \ `static` 允许在类中创建任何对象之前访问成员。当关键字放置在成员前面时，方法和变量被声明为 `static`。\n\n第二章将解释关于类、对象和方法的以下内容：\n\
    \n* `Classes`（类）\n* `Objects`（对象）\n* `Methods`（方法）\n* `This Keyword`（this 关键字）\n\
    * `Annotations`（注解）\n* `Access Modifiers`（访问修饰符）\n* `Static Keyword`（static 关键字）\n\
    \n# Classes\n\n类定义了数据以及操作数据的代码。数据由变量表示，代码由方法表示。变量和方法都是类的成员。因此，类是一个定义对象结构的模板。因此，类的结构必须是精确的。由一个逻辑实体构成的类才是完整的。用逻辑连接的信息来定义类是非常重要的。例如，一个包含英语课程信息的类不应该包含关于学校学区限速的无关信息。\n\
    \n大多数现实世界的类包含一个实例变量和一个操作该实例变量的方法。记住第一本书《(Part 1) 绝对初学者：Java 4 Selenium WebDriver》：实例变量声明在类内部、方法外部。因此，实例变量的值对于每个对象来说都是唯一的。这种类型的变量可以在初始化之前或之后使用，并且对类中的所有方法可见。以下是定义类的语法：\n\
    \n### Syntax\n\n```\nclass ClassName\n{\n    // Declare Instance Variable\n  \
    \  variableType variableName1;\n    variableType variableName2;\n    variableType\
    \ variableNameN;\n\n    // Declare Methods\n    methodType methodName1 ()\n  \
    \  {\n        // Body of the Method\n    }\n    methodType methodName2 ()\n  \
    \  {\n        // Body of the Method\n    }\n    methodType methodNameN ()\n  \
    \  {\n        // Body of the Method\n    }\n}\n```\n\n# Objects\n\n面向对象编程 (OOP)\
    \ 构建在对象之上。关键字 `static` 允许在类中创建任何对象之前访问成员。当关键字放置在成员前面时，方法和变量被声明为 `static`。\n\n\
    方法和变量被标记为类的成员，因为它们构成了该类。对这两个成员的访问由四种修饰符控制：\n\n1. `public`（公共） – 允许访问定义在其 `class`\
    \ 外部代码的修饰符\n2. `private`（私有） – 允许访问其 `class` 内部其他成员的修饰符\n3. `no modifier`（无修饰符）\
    \ – 允许访问其 `package` 内部所有 `classes` 的修饰符\n4. `protected`（保护） – 允许在其 `package` 内部以及所有\
    \ `subclasses` 中访问的修饰符\n\n通常，类的成员通过其类内部的对象进行访问。然而，关键字 `static` 允许在类中创建任何对象之前访问成员。当关键字放置在成员前面时，方法和变量被声明为\
    \ `static`。\n\n### Creating and Access Objects（创建和访问对象）\n\n以下是一个名为 `English` 的仅包含数据的类示例：\n\
    \n```\nclass English\n{\n    int students;\n    int weeks;\n    int days;\n}\n\
    ```\n\n图 2.1 – Data Only（仅数据）\n\n以下是创建并访问对象的示例：\n\n```\nclass English\n{\n   \
    \ int students;\n    int weeks;\n    int days;\n}\n\nclass OneEnglish\n{\n   \
    \ public static void main (String args[])\n    {\n        English ENG101 = new\
    \ English ();\n        int totalDays;\n        ENG101.students = 10;\n       \
    \ ENG101.weeks = 4;\n        ENG101.days = 3;\n        totalDays = ENG101.weeks\
    \ * ENG101.days;\n        System.out.println(\"The English 101 course is a total\
    \ of \" + totalDays + \" days\");\n    }\n}\n```\n\n图 2.2 – Create New Object\
    \ and Access Variables（创建新对象并访问变量）\n\n程序输出：\nThe English 101 course is a total\
    \ of 12 days\n\n第 12 行通过两个步骤创建一个新对象（`English ENG101 = new English ();`）。根据《Java\
    \ A Beginner’s Guide 第 2014），这两个步骤可以重写如下，以显示每个步骤：\n\n1. `English ENG101;` – 赋值左侧声明了一个类型为\
    \ `English` 的变量 `ENG101`。\n2. `ENG101 = new English ();` – 赋值右侧创建了对象的副本，并赋予 `ENG101`\
    \ 该对象的引用。\n\n使用点运算符 `.` 的语法为：\n\n```\nobjectName.MemberName\n```\n\n点运算符连接对象与成员（实例变量或方法）。在这个示例中，对象名（`ENG101`）位于左侧，实例变量（`students`,\
    \ `weeks`, `days`）位于右侧。对象持有类定义的实例变量副本。因此，如果存在多个对象，每个对象的值可以与其他不同。以下示例说明了两个对象（`ENG101`\
    \ 和 `ENG202`）的创建：\n\n```\nclass English\n{\n    int students;\n    int weeks;\n\
    \    int days;\n}\n\nclass TwoEnglishCourses\n{\n    public static void main (String\
    \ args[])\n    {\n        English ENG101 = new English ();\n        English ENG202\
    \ = new English ();\n        int totalDays101;\n        int totalDays202;\n\n\
    \        ENG101.students = 10;\n        ENG101.weeks = 4;\n        ENG101.days\
    \ = 3;\n\n        ENG202.students = 12;\n        ENG202.weeks = 6;\n        ENG202.days\
    \ = 3;\n\n        totalDays101 = ENG101.weeks * ENG101.days;\n        totalDays202\
    \ = ENG202.weeks * ENG202.days;\n    }\n}\n```\n\n"
