  trans: "\n`逻辑错误`很难定位，因为系统不会生成错误信息。通常，逻辑错误会一直隐藏，直到程序员对程序进行调试。虽然错误是不可避免的问题，但某些问题可以在运行时处理。在运行时处理的问题被称为`异常`。程序员创建一个名为“异常处理器”的代码块，以规范的方式处理异常。处理异常的好处是程序在捕获到异常后仍然可以继续运行。\n\
    \n`调试`是一个允许程序员观察并纠正错误的过程。可以使用 `System.out.print`、`System.out.println` 或调试器找到程序中的问题。调试器是一个遵循代码逻辑的工具。大多数程序员倾向于使用调试器而不是多个打印语句来调查问题。如果使用了打印语句，程序员必须在解决问题前添加这些打印语句，并在解决问题后将它们移除。\n\
    \n第七章将解释关于错误、异常和调试的以下内容：\n\n* 错误类型\n* Throwable 异常父类\n* Java 内置异常\n* 异常\n* 处理异常的原则\n\
    * Try/Catch 块\n* Finally 块\n* Catch 获 Throwable 异常\n* Throwable 定义的方法\n* Throw\
    \ vs Throws\n* 调试\n\n# 错误类型\n\n在编程中，错误是由于程序员代码中的错误而导致的问题。错误出现在程序执行之前、程序执行期间，有时隐藏在程序内部。位于程序执行执行前的错误被称为`语法错误`。在程序执行期间发现的错误被称为`运行时错误`。隐藏在程序中最难发现的错误被称为`逻辑错误`。尽管如此，所有错误都必须解决才能获得成功的程序。\n\
    \n## 语法错误\n\n语法错误（称为编译错误）会停止程序执行。回想第一本书“第一部分 – Java 4 Selenium WebDriver”，语法是一组规定单词和符号结构化组合的规则。如果结构不正确，就会发生错误以防止语句编译。结果是由于程序员代码中的不准确之处导致错误无法通过编译。\n\
    \n语法错误是最容易定位和解决的错误。集成开发环境（IDE）如 `Eclipse` 会指出这些错误。错误通过代码下方的红色横线和/或行号左侧的红色 `X`\
    \ 显示。此外，在悬停于红色 `X` 上时，工具提示会显示显示错误的消息。根据《Beginning Java® Programming》(2015)，语法错误包括以下示例（第\
    \ 172 页）：\n\n* 类名、变量名或方法名拼错\n* 关键字拼错\n* 缺少分号\n* 方法缺少返回类型\n* 括号和括号位置错误或不匹配\n* 未声明或未初始变量\n\
    * 循环、方法或其他结构的格式错误\n\n以下代码程序中存在语法错误：\n\n```java\npublic  class SyntaxError\n\n\
    {\n\n public  static  void main(String[] args)\n\n             {\n\n int x, y,\
    \ total;\n\n                          x = 10;\n                          y = 6,\n\
    \n                          Total = x + y;\n                          System.out.println(\"\
    The total of 10 + 6 is \" + total);\n\n             }\n}\n```\n\n![](img/00049.jpeg)\n\
    ##### 图 7.1 – 语法错误示例\n\n* 第 10 行由于逗号而非分号显示错误\n* 第 11 行由于 `Total` 未定义而显示错误。首字母是小写\
    \ `t` 而非大写 `T`。\n"
- fmt: "\n```java\npublic class LogicalErrors {\n    public static void main(String[]\
    \ args) {\n        int total1 = (9 + (8 * 7)) / 6;\n        int total2 = (9 +\
    \ 8) * (7 / 6);\n        int total3 = 9 + 8 * 7 / 6;\n        int total4 = (9\
    \ + 8) * 7 / 6;\n\n        System.out.println(\"What is the result of total1:\
    \ \" + total1);\n        System.out.println(\"What is the result of total2: \"\
    \ + total2);\n        System.out.println(\"What is the result of total3: \" +\
    \ total3);\n        System.out.println(\"What is the result of total4: \" + total4);\n\
    \    }\n}\n```\n\n![](images/00054.jpeg)\n### Figure 7.6 – Operator Precedence\
    \ Logical Error Example\n\n**Program Output:**\n```\nWhat is the result of total1:\
    \ 10\nWhat is the result of total2: 17\nWhat is the result of total3: 18\nWhat\
    \ is the result of total4: 19\n```\n\nLines 7 – 10 initialize each variable `total1`,\
    \ `total2`, `total3`, `total4` with a different operator precedence. Each variable\
    \ produce a different value although the values `9, 8, 7, 6` are the same. The\
    \ following is an example of misplacing a semicolon:\n\n```java\npublic class\
    \ LogicalErrors2 {\n    public static void main(String[] args) {\n        int\
    \ i;\n        for (i = 0; i < 5; i++);\n        {\n            System.out.println(\"\
    The loop control variable is \" + i);\n        }\n    }\n}\n```\n\n![](images/00055.jpeg)\n\
    ### Figure 7.7 – Misplaced Semicolon Logical Error Example\n\n**Program Output:**\n\
    ```\nThe loop control variable is 5\n```\n\nLine 9 incorrectly places a semicolon\
    \ at the end of the `for` loop. Therefore the program outputs 5 rather than 0,\
    \ 1, 2, 3, 4.\n\n# Throwable Exception Parent Class\n\nAn exception is a Java\
    \ class whereby `java.lang.Throwable` is the parent class. Therefore, the Throwable\
    \ exception represents all exception classes. An object of a particular exception\
    \ class is generated when an exception is thrown in a program. There are two main\
    \ subclasses deriving from the `Throwable` parent class:\n\n1. `Error` – contains\
    \ serious exceptions that occur in the Java Virtual Machine (`JVM`). `JVM` is\
    \ a machine within a machine which solves problems and helps the program remain\
    \ secure. An `Error` subclass is not managed by the programmer.\n2. `Exception`\
    \ – contains exceptions that occur in the program. An `Exception` subclass is\
    \ managed by the programmer.\n\nThis book “Part 2 – Java 4 Selenium WebDriver”\
    \ will explain the `Exception` subclass. Exceptions from subclass `Error` are\
    \ beyond a programmer’s control. The following is a diagram from [Program Creek](http://www.programcreek.com/wp-content/uploads/2009/02/Exception-Diagram.jpeg)\
    \ which shows a hierarchy of Java classes:\n\n![](images/00056.jpeg)\n### Figure\
    \ 7.8 – Java Exception Hierarchy\n\n# Java’s Built-In Exceptions\n\nIn Java, there\
    \ is a respectable amount of exception classes defined inside `java.lang` standard\
    \ package. Therefore some exceptions are automatically available due to implicit\
    \ import of `java.lang` into every program. Most of the exceptions originate from\
    \ a standard type `RuntimeException`. `RuntimeException` contains exceptions that\
    \ are not checked by the compiler. All other exceptions are checked by the compiler\
    \ and must be included in a method’s `throws` list. The following is a list of\
    \ unchecked and checked exceptions in `java.lang`:\n\n| Unchecked Exceptions |\
    \ Description |\n| :--- | :--- |\n| `ArithmeticException` | Arithmetic error,\
    \ such as divide-by-zero. |\n| `ArrayIndexOutOfBoundsException` | Array index\
    \ is out-bounds. |\n| `ArrayStoreException` | Assignment to an array element of\
    \ an incompatible type. |\n| `ClassCastException` | Invalid cast. |\n| `EnumConstantException`\
    \ | An attempt is made to use an undefined enumeration value. |\n| `IllegalArgumentException`\
    \ | Illegal argument used to invoke a method. |\n| `IllegalMonitorStateException`\
    \ | Illegal monitor operation, such as waiting on an unlocked thread. |\n| `IllegalStateException`\
    \ | Environment or application is in incorrect state. |\n| `IllegalThreadStateException`\
    \ | Requested operation not compatible with current thread state. |\n| `IndexOutOfBoundsException`\
    \ | Some type of index is out-bounds. |\n| `NegativeArraySizeException` | Array\
    \ created with a negative size. |\n| `NullPointerException` | Invalid use of a\
    \ null reference. |\n| `NumberFormatException` | Invalid conversion of a string\
    \ to a numeric format. |\n| `SecurityException` | Attempt to violate security.\
    \ |\n| `StringIndexOutOfBoundsException` | Attempt to index outside the bounds\
    \ of a string. |\n| `TypeNotPresent` | Type not found. |\n| `UnsupportedOperationException`\
    \ | An unsupported operation was encountered. |\n\n### Figure 7.9 – Java Unchecked\
    \ Exceptions\n\n| Checked Exceptions | Description |\n| :--- | :--- |\n| `ClassNotFoundException`\
    \ | Class not found. |\n| `CloneNotSupportedException` | Attempt to clone an object\
    \ that does not implement `Cloneable` interface. |\n| `IllegalAccessException`\
    \ | Access to a class is denied. |\n| `InstantiationException` | Attempt to create\
    \ an object of an abstract class or interface. |\n| `InterruptedException` | One\
    \ thread has been interrupted by another thread. |\n| `NoSuchFieldException` |\
    \ A requested field does not exist. |\n| `NoSuchMethodException` | A requested\
    \ method does not exist. |\n| `ReflectiveOperationException` | Superclass of reflection-related\
    \ exceptions. |\n\n### Figure 7.10 – Java Checked Exceptions\n\nNote: In addition\
    \ to `java.lang`, the following packages include exceptions:\n\n| `java.awt` |\
    \ `java.net` |\n| `java.awt.color` | `java.rmi` |\n| `java.awt.datatransfer` |\
    \ `java.security` |\n| `java.beans` | `java.text` |\n\n### Figure 7.11 – Packages\
    \ That Include Exceptions\n\n# Common Exceptions\n\nCommon exceptions are exceptions\
    \ that occur frequently in a program. These type of exception happens to new programmers\
    \ as well as experienced programmers. The following is a list of common exceptions\
    \ in alphabetical order:\n\n* `ArrayIndexOutOfBoundsException`\n* `ClassCastException`\n\
    * `IllegalArgumentException`\n* `IllegalStateException`\n* `NullPointerException`\n\
    * `NumberFormatException`\n* `OutOfMemoryError`\n* `StackOverflowError`\n\nArrays\
    \ start at index zero which stores the first value. Therefore the last index position\
    \ is one less the size of the complete array. An `ArrayIndexOutOfBoundsException`\
    \ is thrown when a program attempts to access an index outside the boundaries\
    \ of the array. The following is an `ArrayIndexOutOfBoundsException`:\n\n```java\n\
    public class CommonException {\n    public static void main(String[] args) {\n\
    \        String[] continents = new String[7];\n        continents[0] = \"Africa\"\
    ;\n        continents[1] = \"Antarctica\";\n        continents[2] = \"Asia\";\n\
    \        continents[3] = \"Australia\";\n        continents[4] = \"Europe\";\n\
    \        continents[5] = \"North America\";\n        continents[6] = \"South America\"\
    ;\n        continents[7] = \"America\";\n\n        System.out.println(\"There\
    \ are \" + continents.length + \" countries\");\n    }\n}\n```\n\n![](images/00057.jpeg)\n\
    ### Figure 7.12 – ArrayIndexOutOfBoundsException / Common Exception Example\n\n\
    * Line 8 creates an array with 7 elements `String[] continents = new String[7];`\n\
    * Line 17 which contains `continents[7] = \"America\";` is out of bounds for the\
    \ array `continents`\n* Line 19 is not executed because the error causes the program\
    \ to stop\n\n**Program Output:**\n```\nException in thread \"main\" java.lang.ArrayIndexOutOfBoundsException:\
    \ 7\n    at ExceptionHandling.CommonException.main(CommonException.java:17)\n\
    ```\n"
