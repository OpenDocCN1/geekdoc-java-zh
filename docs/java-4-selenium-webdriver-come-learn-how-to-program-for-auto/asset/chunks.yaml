    \ contains no name. It is important to know that different source files are allowed\
    \ to use the same package statement. The following is the syntax for a package\
    \ statement:\n\nSyntax\n\npackage packagename;\n\nThe name of each package “e.g.,\
    \ packagename” is case sensitive. In Java, it is conventional to use all lowercase\
    \ letters for a package name. All lowercase letters for a package serves as a\
    \ clear distinction from class names, method names and most variable names. Eclipse\
    \ IDE displays a warning if the first letter within package name begins with a\
    \ capital letter. The following is a screenshot which shows a warning if the first\
