    \ args)\n\n              {\n\nString[] continents = new String[7];\n\n try\n\n\
                                {             \n\n                                         \
    \ System.out.println(\"An exception has not been thrown\");\n\n continents[0]\
    \ = \"Africa\"; \n\n continents[1] = \"Antarctica\";\n\n continents[2] = \"Asia\"\
    ;\n\n continents[3] = \"Australia\";\n\n continents[4] = \"Europe\";\n\n continents[5]\
    \ = \"North America\";\n\n continents[6] = \"South America\";\n\n continents[7]\
    \ = \"America\";\n\n                                          System.out.println(\"\
    There are \" + continents.length + \" continents\");\n\n                           \
    \ }\n\n catch (ArrayIndexOutOfBoundsException exc)\n\n                           \
    \ {\n\n                                          System.out.println(\"Exception!!!\
    \ - Array Index Out of Bounds. Not a valid continent\");\n\n                           \
    \ }                           \n\n                            System.out.println(\"\
    This line executes automatically whether an exception occurs or not\");\n\n             \
    \ }\n\n}\n\n##### ![](images/00058.jpeg)\n\n##### Figure 7.14 – Try and Catch\
    \ Block Example\n\nProgram Output:\n\nAn exception has not been thrown\n\nException!!!\
    \ - Array Index Out of Bounds. Not a valid continent\n\nThis line executes automatically\
    \ whether an exception occurs or not\n\n*   Line 8 starts the code monitoring\
    \ process for errors using the try block\n\n*   Line 19 forces an exception when\
    \ defining index position 7 which is outside of the array boundaries. Therefore\
    \ the try block is terminated and the program transfers control to the catch block\n\
    \n*   Line 21 does not execute due to the exception at line 19\n\n*   Line 23\
    \ starts the exception handling process by listing the exception type “ArrayIndexOutOfBoundsException”\
    \ within the catch block\n\n*   Line 25 is executed within the catch block after\
    \ the exception is caught\n\n*   Line 27 is executed following the catch block.\
    \ This line executes automatically whether an exception occurs or not.\n\nA common\
    \ practice in Java is to associate multiple catch blocks with a try block. Each\
    \ catch block must include a unique exception type such as arithmetic exception,\
    \ array index out of bounds exception, etc. The exception type determines which\
    \ catch block is executed after creating multiple catch blocks. Therefore if the\
    \ arithmetic exception type is executed then the array index out of bounds exception\
    \ type is bypassed. The following is an example of a try block with multiple catch\
    \ blocks:\n\npublic  class MultipleCatchBlocks\n\n{\n\n public  static  void \
    \ main(String[] args)\n\n              {\n\n int  oddNumbers[] = {11, 33, 55,\
    \ 77, 99, 111};\n\n int  evenNumbers[] = {0, 2, 4, 6, 8};\n\n for (int  i = 0;\
    \ i < oddNumbers.length; i++)\n\n                            {\n\n try\n\n             \
    \                             {\n\n                                                       \
    \ System.out.println(\"What is \" + oddNumbers[i] + \"/\" + evenNumbers[i] + \"\
    ? \"\n\n+ \"\" + oddNumbers[i]/evenNumbers[i]);\n\n                           \
    \               }\n\n catch (ArithmeticException except)\n\n                           \
    \               {\n\n                                                        System.out.println(\"\
    Exception!!! - Cannot divide a number by zero\");\n\n                           \
    \               }\n\n catch (ArrayIndexOutOfBoundsException except)\n\n             \
    \                             {\n\n                                                       \
    \ System.out.println(\"Exception!!! - Cannot locate the index\");\n\n             \
    \                             }\n\n                            }\n\n             \
    \ }\n\n}\n\n![](images/00059.jpeg)\n\n##### Figure 7.15 – Multiple Catch Blocks\n\
    \nProgram Output:\n\nException!!! - Cannot divide a number by zero\n\nWhat is\
    \ 33/2? 16\n\nWhat is 55/4? 13\n\nWhat is 77/6? 12\n\nWhat is 99/8? 12\n\nException!!!\
    \ - Cannot locate the index\n\n*   Line 17 displays the first catch block which\
    \ contains an arithmetic exception. Catch blocks are evaluated according to their\
    \ order of association to the try block. Therefore this catch block is evaluated\
    \ first since it occurs first in the program. The other catch block is ignored\
    \ when a match is found for this exception type.\n\n*   Line 19 is executed when\
    \ the code reaches zero “0” in array “evenNumbers[]”\n\n*   Line 21 displays the\
    \ second catch block which contains an array index out of bounds exception"
