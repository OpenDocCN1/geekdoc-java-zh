    \n### 图 4.1 – 子类继承父类的示例\n\n程序输出：\n```\nMy elementary school is Bishop Heights\n\
    The principal name is Joe Doe\nThere are 10 teachers and 130 students\nTherefore\
    \ the total of teachers and students is 140\n```\n\n*   第 1 行显示了父类 `School`\n\
    *   第 11 行使用关键字 `extends` 创建了子类 `ElementarySchool`，该子类继承了父类 `School`\n*   第 17\
    \ 行利用了父类的变量 `numTeachers` 和 `numStudents`\n*   第 29 行和 30 行显示了两个对象 `BishopHeights`\
    \ 和 `AltaMesa`\n*   第 32 行和 33 行将值 `10` 和 `130` 赋值给从父类 `School` 继承的变量 `numTeachers`\
    \ 和 `numStudents`\n*   第 34 行将值 `Joe Doe` 赋值给变量 `principalName`，该它是子类 `Elementary\
    \ School` 的成员\n\n子类 `ElementarySchool` 是父类 `School` 的一种类型。更多的子类（如 `HighSchool`、`University`\
    \ 等）也可以继承父类 `School`。`ElementarySchool` 类继承了 `School` 类的所有成员，然后添加了一个变量 `principalName`\
    \ 以及两个方法 `totalTeacherStudents` 和 `displayPrincipal`。注意看第 30 行创建了一个未被使用的对象。这表明可以创建更多的\
    \ `Elementary School` 对象来访问父类 `School` 的成员。\n\n注意：来自父类的对象并不了解子类的信息。因此，父类无法访问子类。\n\
    \n### 父类对象\n父类 `Object` 是所有类的最高父类。换句话说，在 `Object` 父类之上没有父类。默认情况下，`Object` 父类包含了所有子类继承的方法。以下截图显示了在创建新类时\
    \ `java.lang.Object` 默认作为父类：![](img/0035.jpeg) 图 4.2 – Eclipse 类创建\n\n### 继承成员\n\
    从父类继承的私有成员在子类中仍然是私有的。因此，子类无法访问私有成员。变量和方法只能由所属类内部的代码访问。尽管如此，可以使用访问器方法（accessor\
    \ methods）访问私有成员。\n\n### 父类和子类构造函数\n父类和子类包含各自类的构造函数。因此，构造函数是相互独立的。父类无法访问子类的构造函数，但子类可以访问父类的构造函数。子类通过使用关键字\
    \ `super` 调用父类的构造函数。以下是子类调用父类构造函数的语法：`super(parameter-list)`。以下是子类继承父类的示例：\n\n\
    ```java\nclass School {\n    private int numTeachers, numStudents;\n    School(int\
    \ t, int s) {\n        numTeachers = t;\n        numStudents = s;\n    }\n   \
    \ int getTeachers() { return numTeachers; }\n    int getStudents() { return numStudents;\
    \ }\n    void setTeachers(int t) { numTeachers = t; }\n    void setStudents(int\
    \ s) { numStudents = s; }\n    void showNumberOfPeople() {\n        System.out.println(\"\
    There are \" + numTeachers + \" teachers and \" + numStudents + \" students\"\
    );\n    }\n}\n\nclass ElementarySchool extends School {\n    private String principalName;\n\
    \    ElementarySchool(String p, int t, int s) {\n        super(t, s);\n      \
    \  principalName = p;\n    }\n    int totalTeacherStudents() {\n        return\
    \ getTeachers() + getStudents();\n    }\n    void displayPrincipal() {\n     \
    \   System.out.println(\"The principal name is \" + principalName);\n    }\n}\n\
    \nclass SchoolDistrict {\n    public static void main(String[] args) {\n     \
    \   ElementarySchool BishopHeights = new ElementarySchool(\"Joe Doe\", 10, 130);\n\
    \        System.out.println(\"My elementary school is Bishop Heights \\n\");\n\
    \        BishopHeights.displayPrincipal();\n        BishopHeights.showNumberOfPeople();\n\
    \        System.out.println(\"Therefore the total of teachers and students is\
    \ \" + BishopHeights.totalTeacherStudents());\n    }\n}\n```\n\n![](img/0036.jpeg)\n\
    \n### 图 4.3 – 子类继承父类\n\n程序输出：\n```\nMy elementary school is Bishop Heights\nThe\
    \ principal name is Joe Doe\nThere are 10 teachers and 130 students\nTherefore\
    \ the total of teachers and students is 140\n```\n\n# 多态\n多态是面向对象编程中的一个重要概念。该概念允许一个接口被多个方法重用。在父类和子类的情况下，父类提供了一个结构，使得子类可以定义自己的方法。当子类扩展父类时，方法会被继承。\n\
    \n## 方法重写与方法重载\n方法重写（Method Overriding）是子类方法覆盖父类方法的特征。两个方法必须具有相同的方法类型和签名。方法的签名由方法名和参数列表组成。尽管父类方法被子类方法重写，但仍然可以调用。如果使用关键字\
    \ `super` 和点操作符 `.` 后跟方法名，则可以调用该方法：`super.methodName()`。\n\n方法重载（Method Overloading）是指同一个类中多个方法名相同但参数列表不同的方法。当调用方法名时，参数列表决定了执行哪个重载方法。然而，如果多个方法具有相同的签名，则会导致重复方法错误。\n\
    \n| | 方法重写 (Overriding) | 方法重载 (Overloading) |\n| --- | :--- | :--- |\n| 定义 |\
    \ 父类和子类具有相同方法类型和签名的方法 | 同一个类中存在多个同名但参数列表不同的方法 |\n| 方法类型 | 父类和子类的方法类型必须兼容 | 类型可以相同也可以不同\
    \ |\n| 签名 | 父类和子类必须具有相同的签名 | 签名在参数数量、参数类型或顺序上是不同的 |\n\n"
- fmt: "\n### Figure 4.4 – Differences Between Method Overriding and Overloading\n\
    \nNote: An `@Override` annotation can be used to instruct the compiler of a subclass\
    \ overriding a superclass. Annotations make the program easier to read and lets\
    \ the compiler verify if the override is valid.\n\n## Static Binding\n\nBinding\
    \ is the connection between a method call and the method definition. Static binding\
    \ (known as early binding) is when binding occurs at compile time. Therefore binding\
    \ happens before a program executes. The following is an example of static binding:\n\
    \n```java\nclass Binding\n{\n    void printClassName() {\n        System.out.println(\"\
    This class is called Binding\");\n    }\n}\n\nclass BindingExtend extends Binding\n\
    {\n    @Override\n    void printClassName() {\n        System.out.println(\"This\
    \ class is called BindingExtend\");\n    }\n}\n\nclass BindingExamples\n{\n  \
    \  public static void main(String[] args) {\n        BindingExtend objBindingExtend\
    \ = new BindingExtend ();\n        objBindingExtend.printClassName();\n    }\n\
    }\n```\n\n#####![](images/00037.jpeg)\n\n##### Figure 4.5 – Static Binding Example\n\
    \nProgram Output:\nThis class is called BindingExtend\n\n*   Line 11 displays\
    \ an annotation which indicates the subclass method `printClassName()` will override\
    \ the superclass method `printClassName()`\n*   Line 12 displays an icon next\
    \ to the line number which has a tooltip that states `overrides Binding.printClassName`\n\
    *   Line 22 creates an object `objBindingExtend` of class `BindingExtend`\n* \
    \  Line 23 calls the method definition `printClassName()`\n\nNote: For static\
    \ binding, the compiler verifies if a method definition `printClassName` exist\
    \ in class `BindingExtend`.\n\n## Dynamic Binding\n\nDynamic binding is when binding\
    \ occurs at run time. Therefore this type of binding happens when the program\
    \ is running. Unlike static binding, dynamic binding allows polymorphism. Therefore\
    \ a method override is good illustration of dynamic binding. The following is\
