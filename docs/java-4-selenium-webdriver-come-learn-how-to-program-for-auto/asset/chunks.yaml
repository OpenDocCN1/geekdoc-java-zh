    }\n\nSyntax – Abstract Method\n\nabstract methodType methodName (parameter-list);\n\
    \nNote: A subclass must be declared as abstract or implement all of the abstract\
    \ methods from the superclass.\n\n# Keyword Final\n\nThe keyword “final” prevents\
    \ a class or method from being overwritten. Methods are implicitly declared as\
    \ final if the class is declared final. Recall from Part 1 – Java 4 Selenium WebDriver,\
    \ the keyword “final” is used to declare and initialize constants. Constants are\
