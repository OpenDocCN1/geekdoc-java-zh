    \n##### ![](images/00041.jpeg)\n\n##### Figure 5.3 – Package Directory Screenshot\n\
    \n# Import A Package\n\nA Java package is imported by using the keyword “import”.\
    \ Imports are useful when a class wants to access a member in another class. The\
    \ other class can be in the same package or different package. After importing\
    \ a package, the members of the package are used directly without any additional\
    \ syntax. The following is the syntax for importing a package:\n\nSyntax\n\nimportpackagename.ClassName; \n\
    \nTo import a class, the [dot (.) operator](#part0000_split_018.html_Dot_Operator)\
    \ is placed between the package name and class name. The import statements must\
    \ be entered after the package statement but before the classes are declared in\
    \ the current file. The following is an example of a package statement, import\
    \ statement, and a class declaration:\n\npackage examplepackage;\n\nimport examplepackage.PackageTest;\n\
    \npublic  class PackageOne\n\n{\n\n public  static  void  main (String args[])\n\
    \n              {\n\nPackageTest objPackage = new  PackageTest ();\n\n objPackage.printTest();\n\
    \n              }             \n\n}\n\n##### ![](images/00042.jpeg)\n\n##### Figure\
    \ 5.4 – Package Import\n\nProgram Output:\n\nThis is a test\n\n*   Line 1 contains\
    \ the package statement “package examplepackage;”\n\n*   Line 2 contains the import\
    \ statement “import examplepackage.PackageTest;”. The package name is “examplepackage”\
    \ and class name is “PackageTest” which is located in a different file.\n\n* \
    \  Line 4 begins the class declaration “public  class PackageOne”\n\n*   Line\
    \ 8 creates an object “objPackage” using the imported class “PackageTest”\n\n\
    *   Line 10 calls the method “printTest();” which is located in class “PackageTest”.\
    \ View [Figure 5.2 - Package Statement](#part0000_split_049.html__Figure_5.2__),\
    \ to see details of the method.\n\nNote: All of the classes from a specific package\
    \ can be imported by using the package name and an asterisk: import packagename.*;\n\
    \n# Java Class Library\n\nThe Java Class Library is known as Java Application\
    \ Programming Interface (API) which provides programmers with a collection of\
    \ prewritten classes. Each prewritten class helps support the logic of a program\
    \ by supplying useful functions. One of the packages called java.lang is automatically\
    \ imported into all programs. Therefore classes such as System is employed automatically\
    \ when using the print () and println () methods to display information. According\
    \ to [Oracle](https://docs.oracle.com/javase/7/docs/api/), the following shows\
    \ four of many Java Class Libraries: \n\n*   java.lang – Provides classes that\
    \ are fundamental to the design of the Java programming language.\n\n*   java.io\
    \ - Provides for system input and output through data streams, serialization and\
    \ the file system.\n\n*   java.math - Provides classes for performing arbitrary-precision\
    \ integer arithmetic (BigInteger) and arbitrary-precision decimal arithmetic (BigDecimal).\n\
    \n*   java.sql - Provides the API for accessing and processing data stored in\
    \ a data source (usually a relational database) using the JavaTM programming language.\n\
    \nNote: Package java.lang contains a math class which is different from package\
    \ java.math. The math class within java.lang contains methods that performs basic\
    \ numeric operations. \n\nChapter 5 described packages in Java. Each package contains\
    \ a group of related classes. The classes are accessed by the package name. An\
    \ import statement must be placed in the program in order for a class to utilize\
    \ members of another class. Chapter 6 will look into interfaces which is a group\
    \ of related methods.\n\nChapter 6\n\nInterfaces\n\nAn interface is a collection\
    \ of related methods. Interfaces are comparable to a class whereby it contains\
    \ variables and methods. However by default, an interface’s variable is declared\
    \ public, static, and final while the method is declared abstract. It is possible\
    \ for an interface to perform a task but usually there is no behavior implementation.\
    \ In other words, most methods in an interface do not contain a body. Therefore\
    \ an interface method without a body only includes a method’s [signature](#part0000_split_019.html_signature).\
    \ As a result, the interface defines what task to perform but not how to perform\
    \ the task. The class which implements the interface decides how to perform the\
    \ task. Interfaces can extend one or more interfaces similar to a subclass extending\
    \ a superclass. The following is the syntax for an interface:\n\nSyntax\n\naccessmodifier\
    \ interface interfaceName extends interfaceName1, interfaceName2, interfaceNameN\n\
    \n{\n\n              variableType variableName1;\n\n              variableType\
    \ variableName2;\n\n              variableType variableNameN;\n\n             \
    \ methodType methodName1 (parameter-list);\n\n              methodType methodName2\
    \ (parameter-list);\n\n              methodType methodNameN (parameter-list);\n\
    \n}\n\nSyntax Details\n\n| Argument | Description |\n\n| accessmodifier | Can\
    \ be public or no access modifier. A public declaration indicates the interface\
    \ can be used by any code. A no access modifier is the default which indicates\
    \ the interface is only available to members of its package |\n\n| interface |\
    \ A keyword used to declare an interface |\n\n| interfaceName | The name of an\
    \ interface |\n\n| extends | An optional keyword that extends one or more interfaces\
    \ |\n\n| interfaceName1, 2, N | One or more interfaces separated by a comma that\
    \ will be extended |\n\n| variableType variableName1, 2, N; | One or more interface\
    \ variables |\n\n| methodType methodName1 (parameter-list); | One or more interface\
    \ methods |\n\n##### Figure 6.1 – Interface Syntax Details\n\nThe following is\
    \ an interface example:\n\npublic  interface InterfaceTest\n\n{\n\n public  void\
    \  methodOne();\n\n public  void  methodTwo();\n\n}\n\n##### ![](images/00043.jpeg)\
    \  \n\n##### Figure 6.2 – Interface Example\n\n*   Line 3 declares an interface\
    \ by using the keyword “interface” with a “public” access modifier. Therefore\
    \ the code can be implemented by any class within any package. The name of the\
    \ interface is called InterfaceTest.\n\n*   Lines 5 and 6 are void abstract methods\
    \ “methodOne and methodTwo”. The keyword “abstract” is not needed within an interface.\
    \ Notice the semi-colon at the end of each method. The semi-colon is placed at\
    \ the end of the methods because there is no body/implementation.\n\nChapter six\
    \ will discuss the following regarding interfaces:\n\n [Interface Implementation](#part0000_split_053.html__Interface_Implementation)\n\
    \n [Interface Variables](#part0000_split_054.html__Interface_Variables)\n\n\
    \ [Multiple Inheritance](#part0000_split_055.html__Multiple_Inheritance)\n\n\
    \ [Default Interface Method](#part0000_split_056.html__Default_Interface_Method)\n\
    \n# Interface Implementation\n\nInterfaces are implemented using keyword “implements”\
    \ and one or more classes provide implementation for the methods. If a class does\
    \ not implement a method by providing a body then the class must be declared as\
    \ abstract. Each class may implement the same interface differently while supporting\
    \ the same methods. It is important to know that one class can implement multiple\
    \ interfaces. The following is the syntax for a class implementing an interface:\n\
    \nSyntax\n\nclass ClassName extends SuperClassName implements interfaceName\n\n\
    {\n\n // Class Body\n\n}\n\nThe following is an example of a class implementing\
    \ an interface.\n\npackage InterfaceTesting;\n\npublic  class InterfaceExamples\
    \ implements InterfaceTest\n\n{"
