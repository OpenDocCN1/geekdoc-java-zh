    \ An object of a particular exception class is generated when an exception is\
    \ thrown in a program. There are two main subclasses deriving from the Throwable\
    \ parent class:\n\n1.  Error – contains serious exceptions that occur in the Java\
    \ Virtual Machine (JVM). JVM is a machine within a machine which solves problems\
    \ and helps the program remain secure. An Error subclass is not managed by the\
    \ programmer.\n\n2.  Exception – contains exceptions that occur in the program.\
    \ An Exception subclass is managed by the programmer.\n\nThis book “Part 2 – Java\
    \ 4 Selenium WebDriver” will explain the Exception subclass. Exceptions from subclass\
    \ “Error” are beyond a programmer’s control. The following is a diagram from [Program\
    \ Creek](http://www.programcreek.com/wp-content/uploads/2009/02/Exception-Hierarchy-Diagram.jpeg)\
    \ which shows a hierarchy of Java Exception classes:\n\n##### ![](images/00056.jpeg)\n\
    \n##### Figure 7.8 – Java Exception Class Hierarchy\n\n# Java’s Built-In Exceptions\n\
    \nIn Java, there is a respectable amount of exception classes defined inside the\
    \ java.lang standard package. Therefore some exceptions are automatically available\
    \ due to an implicit import of java.lang into every program. Most of the exceptions\
    \ are subclasses that originate from a standard type called RuntimeException.\
    \ RuntimeException contains exceptions that are not checked by the compiler. All\
    \ other exceptions are checked by the compiler and must be included in a method’s\
    \ [throws](#part0000_split_070.html_throws) list. The following is a list of unchecked\
    \ and checked exceptions defined in the java.lang package:\n\n| Unchecked Exceptions\
    \ | Description |\n\n| ArithmeticException | Arithmetic error, such as divide-by-zero.\
    \ |\n\n| ArrayIndexOutOfBoundsException | Array index is out-of-bounds. |\n\n\
    | ArrayStoreException | Assignment to an array element of an incompatible type.\
    \ |\n\n| ClassCastException | Invalid cast. |\n\n| EnumConstantNotPresentException\
    \ | An attempt is made to use an undefined enumeration value. |\n\n| IllegalArgumentException\
    \ | Illegal argument used to invoke a method. |\n\n| IllegalMonitorStateException\
    \ | Illegal monitor operation, such as waiting on an unlocked thread. |\n\n| IllegalStateException\
    \ | Environment or application is in incorrect state. |\n\n| IllegalThreadStateException\
    \ | Requested operation not compatible with current thread state. |\n\n| IndexOutOfBoundsException\
    \ | Some type of index is out-of-bounds. |\n\n| NegativeArraySizeException | Array\
    \ created with a negative size. |\n\n| NullPointerException | Invalid use of a\
    \ null reference. |\n\n| NumberFormatException | Invalid conversion of a string\
    \ to a numeric format. |\n\n| SecurityException | Attempt to violate security.\
    \ |\n\n| StringIndexOutOfBoundsException | Attempt to index outside the bounds\
    \ of a string. |\n\n| TypeNotPresentException | Type not found. |\n\n| UnsupportedOperationException\
    \ | An unsupported operation was encountered. |\n\n##### Figure 7.9 – Java Unchecked\
    \ Exceptions\n\n| Checked Exceptions | Description |\n\n| ClassNotFoundException\
    \ | Class not found. |\n\n| CloneNotSupportedException | Attempt to clone an object\
    \ that does not implement the Cloneable interface. |\n\n| IllegalAccessException\
    \ | Access to a class is denied. |\n\n| InstantiationException | Attempt to create\
    \ an object of an abstract class or interface. |\n\n| InterruptedException | One\
    \ thread has been interrupted by another thread. |\n\n| NoSuchFieldException |\
    \ A requested field does not exist. |\n\n| NoSuchMethodException | A requested\
    \ method does not exist. |\n\n| ReflectiveOperationException | Superclass of reflection-related\
    \ exceptions. |\n\n##### Figure 7.10 – Java Checked Exceptions\n\nNote: In addition\
    \ to java.lang, the following packages include exceptions:\n\n| java.awt | java.net\
    \ |\n\n| java.awt.color | java.rmi |\n\n| java.awt.datatransfer | java.security\
    \ |\n\n| java.beans | java.text |\n\n##### Figure 7.11 – Packages That Include\
    \ Exceptions\n\n# Common Exceptions\n\nCommon exceptions are exceptions that occur\
    \ frequently in a program. These type of exception happens to new programmers\
    \ as well as experienced programmers. The following is a list of common exceptions\
    \ in alphabetical order:\n\n*   ArrayIndexOutOfBoundsException\n\n*   ClassCastException\n\
    \n*   IllegalArgumentException\n\n*   IllegalStateException\n\n*   NullPointerException\n\
    \n*   NumberFormatException\n\n*   OutOfMemoryError\n\n*   StackOverFlowError\n\
    \nArrays start at index position zero which stores the first value. Therefore\
    \ the last index position is one less the size of the complete array. An ArrayIndexOutOfBoundsException\
    \ is thrown when a program attempts to access an index outside the boundaries\
    \ of the array. The following is an ArrayIndexOutOfBoundsException: \n\npublic\
    \  class CommonException\n\n{\n\n public  static  void  main(String[] args)\n\n\
                  {\n\nString[] continents = new String[7];\n\n continents[0] = \"\
    Africa\"; \n\n continents[1] = \"Antarctica\";\n\n continents[2] = \"Asia\";\n\
    \n continents[3] = \"Australia\";\n\n continents[4] = \"Europe\";\n\n continents[5]\
    \ = \"North America\";\n\n continents[6] = \"South America\";\n\n continents[7]\
    \ = \"America\";\n\n                            System.out.println(\"There are\
    \ \" + continents.length + \" countries\");                           \n\n             \
    \ }\n\n}\n\n##### ![](images/00057.jpeg)\n\n##### Figure 7.12 – ArrayIndexOutOfBoundsException\
    \ / Common Exception Example\n\n*   Line 8 creates an array with 7 elements “String[]\
    \ continents = new String[7];”\n\n*   Line 17 which contains “continents[7] =\
    \ \"America\";” is out of bounds for the array “continents”\n\n*   Line 19 is\
    \ not executed because the error causes the program to stop\n\nProgram Output:\n\
    \nException in thread \"main\" java.lang.ArrayIndexOutOfBoundsException: 7\n\n\
                  at ExceptionHandling.CommonException.main(CommonException.java:17)"
