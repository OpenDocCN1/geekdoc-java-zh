    \ =\n     {\n      {5, 10},\n      {5, 20},\n      {5, 30}\n     }; for (int i[]:\
    \ costPerItem)\n     {\n      for (int j: i)\n      {\n         if (j == specificCost)\n\
    \         {\n          System.out.println(\"The specific cost of \" + \"'\" +\
    \ specificCost + \"'\" + \" was located in the collection of values\");\n    \
