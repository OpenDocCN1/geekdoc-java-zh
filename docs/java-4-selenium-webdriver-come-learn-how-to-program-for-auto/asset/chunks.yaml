    \ a body only includes a method’s signature.\n\nThe following is the syntax for\
    \ an interface:\n\n### Syntax\n\n```\naccessmodifier interface interfaceName extends\
    \ interfaceName1, interfaceN\n{\n    variableType methodName1 (parameter-list);\n\
    \    variableType methodName2 (parameter-list);\n    variableType methodNameN\
    \ (parameter-list);\n}\n```\n\n### Details\n\n| Argument | Description |\n| :---\
    \ | :--- |\n| `accessmodifier` | Can be `public` or no access modifier. A `public`\
    \ declaration indicates the interface can be used by any code. A no access modifier\
