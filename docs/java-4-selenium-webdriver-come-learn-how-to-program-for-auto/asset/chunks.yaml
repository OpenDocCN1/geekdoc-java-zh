    \ = 10;\n        ENG101.weeks = 4;\n        ENG101.days = 3;\n\n        ENG202.students\
    \ = 12;\n        ENG202.weeks = 6;\n        ENG202.days = 3;\n\n        totalDays101\
    \ = ENG101.weeks * ENG101.days;\n        totalDays202 = ENG202.weeks * ENG202.days;\n\
    \    }\n}\n```\n"
