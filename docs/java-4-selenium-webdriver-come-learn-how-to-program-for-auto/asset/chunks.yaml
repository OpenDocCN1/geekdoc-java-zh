    \n# Interface Variables\n\nInterface constants (known as constants) are implicitly\
    \ declared as public, static, and final. In other words, interface variables are\
    \ by default constants initialized with a value. Constants are unchangeable values\
    \ assigned to a variable name. The values are established in an interface without\
    \ a method and shared across all files. A class implements the interface variables\
    \ in the same manner as methods. The following is an example of an interface variable:\n\
    \n```java\npublic interface InterfaceVariable {\n    int DAYS_PER_WEEK = 7;\n\
    \    int MAX_HOURS_PER_DAY = 24;\n}\n```\n\n![](images/00045.jpeg)\n### Figure\
    \ 6.4 – Interface Variable Example\n\n# Multiple Inheritance\n\nMultiple inheritance\
    \ is when an interface extends another interface or a class implements multiple\
    \ interfaces. The keyword `extends` is used to extend an interface. An extension\
    \ of interfaces is beneficial if a programmer elects to add more methods. Errors\
    \ are displayed if a method is added to the original interface and the interface\
    \ has already been implemented by a class. All of the classes which used the original\
    \ interface will break existing code because there is no implementation of the\
    \ newly added method. However the original interface can get extended to accommodate\
    \ the new method in a separate interface. Programmers can decide to either continue\
    \ using the original interface or start using the extended interface.\n\nA class\
    \ inherits multiple interfaces by using the keyword `implements` followed by the\
    \ interfaces which are separated using a comma. A class must provide implementations\
    \ for all methods if the interface inherits another interface or the class implements\
    \ multiple interfaces. The following is an example of multiple inheritance for\
    \ an interface:\n\n```java\npublic interface ExtendInterface extends InterfaceTest\
    \ {\n    public void methodThree();\n    public void methodFour();\n}\n```\n\n\
    ![](images/00046.jpeg)\n### Figure 6.5 – Interface Extend Example\n\n- Line 3\
    \ uses the `extends` keyword to extends an interface `InterfaceTest`. The extended\
    \ interface contains abstract methods `methodOne` and `methodTwo` from [Figure\
    \ 6.2 Interface Example](#part0000_split_052.html__Figure_6.2__).\n- Lines 5 and\
    \ 6 display `public void abstract` methods `methodThree` and `methodFour`. The\
    \ methods from the extended interface are not needed when inheriting an interface.\
    \ Additional interfaces can be extended by adding the interface name and separating\
    \ all interfacing with a comma.\n\nThe following is an example of a class implementing\
    \ multiple interfaces:\n\n```java\npublic class MultipleInterfaces implements\
    \ InterfaceTest, ExtendInterface {\n    public void methodOne() {\n        System.out.println(\"\
    This is the body which implements methodOne\");\n    }\n    public void methodTwo()\
    \ {\n        System.out.println(\"This is the body which implements methodTwo\"\
    );\n    }\n    public void methodThree() {\n        System.out.println(\"This\
    \ is the body which implements methodThree\");\n    }\n    public void methodFour()\
    \ {\n        System.out.println(\"This is the body which implements methodFour\"\
    );\n    }\n    public static void main(String[] args) {\n        InterfaceTest\
    \ objInterface1 = new MultipleInterfaces();\n        objInterface1.methodOne();\n\
    \        ExtendInterface objInterface3 = new MultipleInterfaces();\n        objInterface3.methodThree();\n\
    \    }\n}\n```\n\n![](images/00047.jpeg)\n### Figure 6.6 – Class Implementing\
    \ Multiple Interfaces\n\nProgram Output:\n`This is the body which implements methodOne`\n\
    `This is the body which implements methodThree`\n\n- Line 3 uses the `implements`\
    \ keyword to implement multiple interfaces `InterfaceTest` and `ExtendInterface`.\n\
    - Lines 5 – 21 implements a body/behavior for each method in both interfaces.\n\
    - Lines 25 – 29 create objects `objInterface1` and `objInterface3` that is used\
    \ to call methods `methodOne` and `methodThree`.\n\n# Default Interface Method\n\
    \nA default interface method (known an method) allows an interface method to provide\
    \ a body. Therefore, the interface methods are permitted to implement a behavior.\
    \ This change occurred in the release of JDK 8 whereby an interface has the option\
    \ to remain abstract or define a default implementation. Default methods contain\
    \ a `default` keyword which precedes the method type. An advantage of default\
    \ methods is a class does not require implementation. However a class requires\
    \ implementation of a default method if a different value is returned. The following\
    \ is an example of a default method using figures “[Figures 6.2 – Interface Example](#part0000_split_052.html__Figure_6.2__)\
    \ and [Figure 6.5 – Interface Extend Example](#part0000_split_055.html__Figure_6.5__)”.\n\
    \n```java\npublic interface DefaultMethod {\n    public void methodOne();\n  \
    \  public void methodTwo();\n    default public void methodThree() {\n       \
    \ System.out.println(\"This is the body which implements methodThree\");\n   \
    \ }\n    default public void methodFour() {\n        System.out.println(\"This\
    \ is the body which implements methodFour\");\n    }\n}\n```\n\n![](images/00048.jpeg)\n\
    ### Figure 6.7 – Default Method Example\n\nChapter 6 explained interfaces which\
    \ is a collection of related methods. Generally, the interface methods do not\
    \ contain a body. Therefore the interface methods define what task to perform\
    \ but not how to perform the task. However, a default method allows an interface\
    \ method to provide a body which occurred in the release of JDK 8. Chapter 7 will\
    \ discuss errors, exceptions, and debugging.\n\n# Chapter 7\n\n## Errors, Exceptions,\
    \ and Debugging\n\nAll programs will include some kind of error. An error is an\
    \ unwanted problem in the program. It can be an unexpected problem such as misspelling\
    \ a keyword. In Java, the errors are grouped into three types:\n\n1. [Syntax](#part0000_split_059.html__Syntax_Errors)\
    \ – prevents code from executing\n2. [Runtime](#part0000_split_060.html__Runtime_Errors)\
    \ – generates an error when the program is executing \n3. [Logical](#part0000_split_061.html__Logical_Errors)\
    \ – does not generate an error message due to a fault in the code’s logic\n"
