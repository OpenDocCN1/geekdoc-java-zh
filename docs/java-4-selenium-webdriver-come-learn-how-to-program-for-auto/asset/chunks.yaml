  trans: "\n\n```java\npublic void methodOne() {\n    System.out.println(\"This is\
    \ the body which implements methodOne\");\n}\n\npublic void methodTwo() {\n  \
    \  System.out.println(\"This is the body which implements methodTwo\");\n}\n\n\
    public static void main(String[] args) {\n    InterfaceTest objInterface = new\
    \ InterfaceExamples();\n    objInterface.methodTwo();\n}\n```\n\n![](img/00044.jpeg)\n\
    ### 图 6.3 – 类实现接口\n\n程序输出：\n`This is the body which implements methodTwo`\n\n\
    注意：截图显示的是分屏图像，这是因为接口和类位于不同的文件中。如果接口和类位于同一个文件中，Eclipse 会显示“interface must be defined\
    \ in its own file”（接口必须在其文件中定义）的消息。\n\n- 第 3 行在类定义中包含了 `implements` 关键字。\n- 第\
    \ 5 – 12 行是实现的方法，具有方法体。每个类方法必须与接口方法匹配。因此，方法被声明为 `public`、`void` 类型，并具有相同的签名。如果其中一个方法没有被实现，则类应被声明为抽象类。抽象类的声明类似于下所示：\n\
    `abstract public class InterfaceExamples implements InterfaceTest`\n\n# 接口变量\n\
    \n接口常量（称为常量）被隐式声明为 `public`、`static` 和 `final`。换句话说，接口变量默认是带有初始值的常量。常量是赋值给变量名的不可更改的值。这些值在没有方法的接口中建立，并在所有文件中共享。类以与方法相同的方式接口变量。以下是接口变量的示例：\n\
    \n```java\npublic interface InterfaceVariable {\n    int DAYS_PER_WEEK = 7;\n\
    \    int MAX_HOURS_PER_DAY = 24;\n}\n```\n\n![](img/00045.jpeg)\n### 图 6.4 – 接口变量示例\n\
    \n# 多重继承\n\n多重继承是指一个接口扩展另一个接口或一个类实现多个接口。使用 `extends` 关键字扩展接口。如果程序员选择添加更多方法，那么接口的扩展是有益的。如果在原始接口中添加了方法，且该接口已被类实现，则会显示错误。所有使用原始接口的类都会破坏现有代码，因为没有新添加方法的实现。然而，可以通过单独的接口扩展原始接口以适应新方法。程序员可以决定继续使用原始接口或开始使用扩展接口。\n\
    \n类通过使用 `implements` 关键字后跟逗号分隔的接口来继承多个接口。如果接口继承另一个接口或类实现多个接口，则类必须为所有方法提供实现。以下是接口多重继承的示例：\n\
    \n```java\npublic interface ExtendInterface extends InterfaceTest {\n    public\
    \ void methodThree();\n    public void methodFour();\n}\n```\n\n![](img/00046.jpeg)\n\
    ### 图 6.5 – 接口扩展示例\n\n- 第 3 行使用 `extends` 关键字扩展接口 `InterfaceTest`。扩展的接口包含了图 6.2\
    \ 接口示例 中的抽象方法 `methodOne` 和 `methodTwo`。\n- 第 5 和 6 行显示了 `public void abstract`\
    \ 方法 `methodThree` 和 `methodFour`。继承接口时不需要扩展接口的方法。可以通过添加接口名称并用逗号分隔所有接口来扩展额外的接口。\n\
    \n以下是类实现多个接口的示例：\n\n```java\npublic class MultipleInterfaces implements InterfaceTest,\
    \ ExtendInterface {\n    public void methodOne() {\n        System.out.println(\"\
    This is the body which implements methodOne\");\n    }\n    public void methodTwo()\
    \ {\n        System.out.println(\"This is the body which implements methodTwo\"\
    );\n    }\n    public void methodThree() {\n        System.out.println(\"This\
    \ is the body which implements methodThree\");\n    }\n    public void methodFour()\
    \ {\n        System.out.println(\"This is the body which implements methodFour\"\
    );\n    }\n    public static void main(String[] args) {\n        InterfaceTest\
    \ objInterface1 = new MultipleInterfaces();\n        objInterface1.methodOne();\n\
    \        ExtendInterface objInterface3 = new MultipleInterfaces();\n        objInterface3.methodThree();\n\
    \    }\n}\n```\n\n![](img/00047.jpeg)\n### 图 6.6 – 类实现多个接口\n\n程序输出：\n`This is\
    \ the body which implements methodOne`\n`This is the body which implements methodThree`\n\
    \n- 第 3 行使用 `implements` 关键字实现多个接口 `InterfaceTest` 和 `ExtendInterface`。\n- 第 5\
    \ – 21 行为两个接口中的每个方法实现了方法体/行为。\n- 第 25 – 29 行创建了对象 `objInterface1` 和 `objInterface3`，用于调用方法\
    \ `methodOne` 和 `methodThree`。\n\n# 默认接口方法\n\n默认接口方法（称为方法）允许接口方法提供方法体。因此，允许接口方法实现行为。这一变化发生在\
    \ JDK 8 发布中，其中接口有选择保持抽象或定义默认实现。默认方法包含一个跟在方法类型之前的 `default` 关键字。默认方法的优势是类不需要实现。然而，如果返回了不同的值，则类需要对默认方法进行实现。以下是使用图“图\
    \ 6.2 – 接口示例]和图 6.5 – 接口扩展示例”的默认方法示例：\n\n```java\npublic interface DefaultMethod\
    \ {\n    public void methodOne();\n    public void methodTwo();\n    default public\
    \ void methodThree() {\n        System.out.println(\"This is the body which implements\
    \ methodThree\");\n    }\n    default public void methodFour() {\n        System.out.println(\"\
    This is the body which implements methodFour\");\n    }\n}\n```\n\n![](img/00048.jpeg)\n\
    ### 图 6.7 – 默认方法示例\n\n第 6 章解释了接口，它是相关方法的集合。通常，接口方法不包含方法体。因此接口方法定义执行任务而不是如何执行任务。然而，默认方法允许接口方法提供方法体，这是\
    \ JDK 8 发布时的变化。第 7 章将讨论错误、异常和调试。\n\n# 第 7 章\n\n## 错误、异常和调试\n\n所有程序都会包含某种错误。错误是程序中的意外问题。它可能是意想不到的问题，例如拼错关键字。在\
    \ Java 中，错误被分为三类：\n\n1. 语法 – 阻止代码执行\n2. 运行时 – 在程序运行时产生错误\n3. 逻辑 – 由于代码逻辑缺陷而不产生错误消息\n\
    \n"
