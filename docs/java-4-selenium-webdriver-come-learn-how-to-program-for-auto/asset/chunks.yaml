    \ executing. Recall from the first book “Part 1 – Java 4 Selenium WebDriver”,\
    \ syntax is a set of rules that specifies a structured combination of words and\
    \ symbols. If not structured correctly, an error occurs to prevent the statements\
    \ from compiling. As a result, the errors are not compiled due to an inaccuracy\
    \ in the programmer’s code. \n\nSyntax errors are the easiest errors to locate\
    \ and resolve. An Integrated Development Environment (IDE) such as `Eclipse` points\
    \ out the errors. The errors are disclosed by a red underline beneath the code\
    \ and/or red `X` to the left of a line number. In addition, a tool tip displays\
    \ a message that reveals the error after hovering over the red `X`. According\
    \ to Beginning Java® Programming (2015), syntax errors include the following examples\
    \ (page 172):\n\n* Misspelled class, variable, or method names\n* Misspelled keywords\n\
    * Missing semicolons\n* Missing return type for methods\n* Out of place or mismatched\
    \ parentheses and brackets\n* Undeclared or uninitialized variables\n* Incorrect\
    \ format of loops, methods, or other structures\n\nThe following code has syntax\
    \ errors in the program:\n\n```java\npublic  class SyntaxError\n{\n public  static\
    \  void main(String[] args)\n             {\n int x, y, total;\n             \
    \             x = 10;\n                          y = 6,\n                    \
    \      Total = x + y;\n                          System.out.println(\"The total\
    \ of 10 + 6 is \" + total);\n             }\n}\n```\n\n![](images/00049.jpeg)\n\
    ##### Figure 7.1 – Syntax Error Example\n\n* Line 10 displays an error due to\
    \ a comma rather than semicolon\n* Line 11 displays an error because `Total` is\
    \ not declared. The first letter begins with lowercase `t` rather than uppercase\
    \ `T`.\n\n## Runtime Errors\n\nRuntime errors are detected when a program executes.\
    \ The following is an example of a runtime error:\n\n```java\npublic  class RuntimeError\n\
    {\n public  static  void main(String[] args)\n             {\n int x, y, total;\n\
    \                          x = 10;\n                          y = 6,\n       \
    \                   Total = x + y;\n                          System.out.println(\"\
    The total of 10 + 6 is \" + total);\n             }\n}\n```\n... (rest of text\
    \ follows same pattern)\n"
  raw: "[Logical errors](#part0000_split_061.html__Logical_Errors) are difficult to\
    \ locate because an error message is not generated. Usually, logical errors are\
    \ hidden until a programmer debugs their program. Although errors are unavoidable\
    \ problems, some problems can be handled at runtime. Problems handled at runtime\
    \ are called exceptions. The programmer creates a block of code called an exception\
    \ handler which handle exceptions in a disciplined manner. A benefit of handling\
    \ exceptions is the program continues to run after catching the exception.\n\n\
    [Debugging](#part0000_split_071.html__Debugging) is a process that allows a programmer\
    \ to observe then correct an error. The problems in a program can be found by\
    \ using System.out.print, System.out.println or a debugger. A debugger is a tool\
    \ that follows a code’s logic. Most programmers prefer to use a debugger instead\
    \ of several print statements to investigate a problem. If print statements are\
    \ used, then the programmer must add the print statements and remove the print\
    \ statement after resolving the problem.\n\nChapter seven will explain the following\
    \ regarding errors, exceptions, and debugging.\n\n [Error Types](#part0000_split_058.html__Error_Types)\n\
    \n [Throwable Exception Parent Class](#part0000_split_062.html__Throwable_Exception_Parent)\n\
    \n [Java’s Built-In Exceptions](#part0000_split_063.html__Java_s_Built-In_Exceptions)\n\
    \n [Common Exceptions](#part0000_split_064.html__Common_Exceptions)\n\n [Principles\
    \ of Handling Exceptions](#part0000_split_065.html__Principles_of_Handling)\n\n\
     [Try/Catch Block](#part0000_split_066.html__Try___Catch)\n\n [Finally Block](#part0000_split_067.html__Finally_Block)\n\
    \n [Catch A Throwable Exception](#part0000_split_068.html__Catch_A_Throwable)\n\
    \n [Methods Defined By Throwable](#part0000_split_069.html__Methods_Defined_By)\n\
    \n [Throw vs Throws](#part0000_split_070.html__Throw_vs_Throws)\n\n [Debugging](#part0000_split_071.html__Debugging)\n\
    \n# Error Types\n\nIn programming, errors are problems that result from a mistake\
    \ in a programmer’s code. The errors are found before a program executes, when\
    \ a program executes, and sometimes hidden within a program. The errors located\
    \ before execution of a program are called [syntax errors](#part0000_split_059.html__Syntax_Errors).\
    \ Errors found during execution of a program are called [runtime errors](#part0000_split_060.html__Runtime_Errors).\
    \ The hardest errors to discover which are hidden in a program are called [logical\
    \ errors](#part0000_split_061.html__Logical_Errors). Nevertheless, all errors\
    \ must be resolved to have a successful program.\n\n## Syntax Errors\n\nSyntax\
    \ errors (known as compiler errors) stop programs from executing. Recall from\
    \ the first book “Part 1 – Java 4 Selenium WebDriver”, syntax is a set of rules\
    \ that specifies a structured combination of words and symbols. If not structured\
    \ correctly, an error occurs to prevent the statements from compiling. As a result,\
    \ the errors are not compiled due to an inaccuracy in the programmer’s code. \n\
    \nSyntax errors are the easiest errors to locate and resolve. An Integrated Development\
    \ Environment (IDE) such as Eclipse points out the errors. The errors are disclosed\
    \ by a red underline beneath the code and/or red X to the left of a line number.\
    \ In addition, a tool tip displays a message that reveals the error after hovering\
    \ over the red X. According to Beginning Java® Programming (2015), syntax errors\
    \ include the following examples (page 172):\n\n Misspelled class, variable,\
    \ or method names\n\n Misspelled keywords\n\n Missing semicolons\n\n Missing\
    \ return type for methods\n\n Out of place or mismatched parentheses and brackets\n\
    \n Undeclared or uninitialized variables\n\n Incorrect format of loops, methods,\
    \ or other structures\n\nThe following code has syntax errors in the program:\n\
    \npublic  class SyntaxError\n\n{\n\n public  static  void main(String[] args)\n\
    \n              {\n\n int x, y, total;\n\n                            x = 10;\n\
    \n                            y = 6,\n\n Total = x + y;\n\n                           \
    \ System.out.println(\"The total of 10 + 6 is \" + total);\n\n              }\n\
    \n}\n\n##### ![](images/00049.jpeg)\n\n##### Figure 7.1 – Syntax Error Example\n\
    \n*   Line 10 displays an error due to a comma rather than a semi-colon\n\n* \
    \  Line 11 displays an error because Total is not declared. Line 7 declares total\
    \ but the first letter begins with a lowercase “t” rather than an uppercase “T”.\n\
    \nThe following is an example of Eclipse revealing the error after hovering over\
    \ the red X for line 10:\n\n##### ![C:\\Users\\REXAJO~1\\AppData\\Local\\Temp\\\
    SNAGHTML1c0e652d.PNG](images/00050.jpeg)\n\n##### Figure 7.2 – Error Message After\
    \ Hovering Over Red X\n\nThe error states “Syntax error on token \",\", ; expected”\
    \ which means the compiler expects a semi-colon. A gray X with a circle and white\
    \ background appears after correcting the error. Consequently, the red underline\
    \ and red X disappear after replacing the comma with a semi-colon to complete\
    \ the statement.\n\nSome errors display a yellow circle with a smaller red X similar\
    \ to line 11\\. This error uncovers multiple solutions that may resolve the problem\
    \ after clicking the red X. The following is a screenshot of Eclipse displaying\
    \ possible solutions to fix the error on line 11:\n\n##### ![](images/00051.jpeg)\n\
    \n##### Figure 7.3 – Possible Solutions After Clicking The Red X\n\nSeveral solutions\
    \ unfold after clicking the red X on line 11\\. However, the correct solution\
    \ is the first option “Change to ‘total’”. Eclipse automatically updates the code\
    \ to reflect the selected proposed solution. Therefore lines 10 and 11 display\
    \ a gray X with a circle and white background. Both X’s are removed after saving\
    \ the file.\n\n## Runtime Errors\n\nRuntime errors are detected when a program\
    \ executes an invalid action. Invalid actions are operations such as divide by\
    \ zero. The syntax is correct so the program runs but a problem occurs during\
    \ runtime. The following is an example of a runtime error:\n\npublic  class RuntimeError\n\
    \n{\n\n public  static  void  main(String[] args)\n\n              {\n\n int \
    \ a, b, x, y;\n\n int  result, sum;\n\n a = x = 10;\n\n b = y = 0;\n\n result\
    \ = a/b;\n\n sum = x+y;\n\n                            System.out.println(\"What\
    \ is 10/0?\" + result);\n\n                            System.out.println(\"What\
    \ is 10+0?\" + sum);\n\n              }\n\n}\n\n##### ![](images/00052.jpeg)\n\
    \n##### Figure 7.4 – Runtime Error Example\n\nProgram Output:\n\nException in\
    \ thread \"main\" java.lang.ArithmeticException: / by zero\n\n              at\
    \ Errors.RuntimeError.main(RuntimeError.java:13)\n\n##### ![C:\\Users\\REXAJO~1\\\
    AppData\\Local\\Temp\\SNAGHTML1c73947f.PNG](images/00053.jpeg)\n\n##### Figure\
    \ 7.5 – Console/Program Output Screenshot\n\n*   Line 7 declares four variables\
    \ “a, b, x, y”\n\n*   Line 8 declares two variables “result, sum”\n\n*   Line\
    \ 10 initialize two of the variables “a and b” to 10\n\n*   Line 11 initialize\
    \ two of the variables “x and y” to 0\n\n*   Line 13 initialize variable “result”\
    \ to divide ‘a’ by ‘b’\n\n*   Line 14 initialize variable sum to add ‘x’ plus\
    \ ‘y’\n\nThe program executes but a runtime error occurs due to line 13\\. Therefore\
    \ execution immediately stops and does not execute lines 14 – 17\\. Although,\
    \ line 14 is a valid operation, the compiler will not execute the statement. The\
    \ Program Output displays a message which informs the programmer of the problem.\
    \ First line indicates a problem by showing “/ by zero” meaning a number was divided\
    \ by zero. Second line specifies where the problem occurred by showing the package\
    \ name “Errors”, class name “RuntimeError”, method name “main”, and line number\
    \ “13”.\n\n## Logical Errors\n\nLogical errors execute without an error but logically\
    \ performs the wrong task. As a result, this type of error is challenging unless\
    \ a programmer knows what to expect. The actual results are compared to the expected\
    \ results to verify what went wrong. Logical errors such as using an operator\
    \ precedence incorrectly or misplacing a semicolon will execute and produce improper\
    \ results. The following are examples of logical errors:"
