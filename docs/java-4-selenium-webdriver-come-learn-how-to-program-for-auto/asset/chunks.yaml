    \n### Figure 5.3 – Package Directory Screenshot\n\n# Import A Package\n\nA Java\
    \ package is imported by using the keyword `import`. Imports are useful when a\
    \ class wants to access a member in another class. The other class can be in the\
    \ same package or different package. After importing a package, the members of\
    \ the package are used directly without any additional syntax. The following is\
    \ the syntax for importing a package:\n\n### Syntax\n\n```\nimportpackagename.ClassName;\n\
    ```\n\nTo import a class, the [dot (.) operator](# is placed between the package\
    \ name and class name. The import statements must be entered after the package\
    \ statement but before the classes are declared in the current file. The following\
    \ is an example of a package statement, import statement, and a class declaration:\n\
    \n```java\npackage examplepackage;\n\nimport examplepackage.PackageTest;\n\npublic\
    \ class PackageOne\n{\n    public static void main (String args[])\n    {\n  \
    \      PackageTest objPackage = new PackageTest ();\n        objPackage.printTest();\n\
    \    }\n}\n```\n\n![](images/00042.jpeg)\n\n### Figure 5.4 – Package Import\n\n\
    Program Output:\n\nThis is a test\n\n* Line 1 contains the package statement `package\
    \ examplepackage;`\n* Line 2 contains the import statement `import examplepackage.PackageTest;`.\
    \ The package name is `examplepackage` and class name is `PackageTest` which is\
    \ located in a different file.\n* Line 4 begins the class declaration `public\
    \ class PackageOne`\n* Line 8 creates an object `objPackage` using the imported\
    \ class `PackageTest`\n* Line 10 calls the method `printTest();` which is located\
    \ in class `PackageTest`. View [Figure 5.2 - Package Statement], to see details\
    \ of the method.\n\nNote: All of the classes from a specific package can be imported\
    \ by using the package name and an asterisk: `import packagename.*;`\n\n# Java\
    \ Class Library\n\nThe Java Class Library is known as Java Application Programming\
    \ Interface (API) which provides programmers with a collection of prewritten classes.\
    \ Each prewritten class helps support the logic of a program by supplying useful\
    \ functions. One of the packages called `java.lang` is automatically imported\
    \ into all programs. Therefore classes such as `System` is employed automatically\
    \ when using the `print()` and `println()` methods to display information. According\
    \ to [Oracle](https://docs.oracle.com/javase/7/docs/api/), the following shows\
    \ four of many Java Class Libraries:\n\n* `java.lang` – Provides classes that\
    \ are fundamental to the design of the Java programming language.\n* `java.io`\
    \ – Provides for system input and output through data streams, serialization and\
    \ the file system.\n* `java.math` – Provides classes for performing arbitrary-precision\
    \ integer arithmetic (`BigInteger`) and arbitrary-precision decimal arithmetic\
    \ (`BigDecimal`).\n* `java.sql` – Provides the API for accessing and processing\
    \ data stored in a data source (usually a relational database) using the JavaTM\
    \ programming language.\n\nNote: Package `java.lang` contains a `math` class which\
    \ is different from package `java.math`. The `math` class within `java.lang` contains\
    \ methods that performs basic numeric operations.\n\nChapter 5 described packages\
    \ in Java. Each package contains a group of related classes. The classes are accessed\
    \ by the package name. An import statement must be placed in the program in order\
    \ for a class to utilize members of another class. Chapter 6 will look into interfaces\
    \ which is a group of related methods.\n\n# Chapter 6\n\n## Interfaces\n\nAn interface\
    \ is a collection of related methods. Interfaces are comparable to a class whereby\
    \ it contains variables and methods. However by default, an interface’s variable\
    \ is declared `public`, `static`, and `final` while the method is declared `abstract`.\
    \ It is possible for an interface to perform a task but usually there is no behavior\
    \ implementation. In other words, most methods in an interface do not contain\
    \ a body. Therefore an interface method without a body only includes a method’s\
    \ [signature](#).\n\nAn interface method without a body only includes a method’s\
    \ signature. Therefore an interface method without a body only includes a method’s\
