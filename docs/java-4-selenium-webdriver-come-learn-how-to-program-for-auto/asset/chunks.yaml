    \ args) {\n        int total1 = (9 + (8 * 7)) / 6;\n        int total2 = (9 +\
    \ 8) * (7 / 6);\n        int total3 = 9 + 8 * 7 / 6;\n        int total4 = (9\
    \ + 8) * 7 / 6;\n\n        System.out.println(\"What is the result of total1:\
    \ \" + total1);\n        System.out.println(\"What is the result of total2: \"\
    \ + total2);\n        System.out.println(\"What is the result of total3: \" +\
    \ total3);\n        System.out.println(\"What is the result of total4: \" + total4);\n\
    \    }\n}\n```\n\n![](img/00054.jpeg)\n### 图 7.6 – 运算符优先级逻辑错误示例\n\n**程序输出：\n```\n\
    What is the result of total1: 10\nWhat is the result of total2: 17\nWhat is the\
    \ result of total3: 18\nWhat is the result of total4: 19\n```\n\n第 7 – 10 行使用不同的运算符优先级初始化了变量\
    \ `total1`、`total2`、`total3`、`total4`。尽管数值 `9, 8, 7, 6` 相同，但每个变量都产生了不同的值。以下是一个分号位置错误的示例：\n\
    \n```java\npublic class LogicalErrors2 {\n    public static void main(String[]\
    \ args) {\n        int i;\n        for (i = 0; i < 5; i++);\n        {\n     \
    \       System.out.println(\"The loop control variable is \" + i);\n        }\n\
    \    }\n}\n```\n\n![](img/00055.jpeg)\n### 图 7.7 – 分号位置错误逻辑错误示例\n\n**程序输出：**\n\
    ```\nThe loop control variable is 5\n```\n\n第 9 行在 `for` 循环末尾错误地放置了分号。因此，程序输出\
    \ 5 而不是 0, 1, 2, 3, 4。\n\n# Throwable 异常父类\n\n异常是一个 Java 类，其中 `java.lang.Throwable`\
    \ 是其父类。因此，Throwable 异常代表所有异常类。当程序中抛出异常时，会生成特定异常类的对象。派自 `Throwable` 父类有两个主要的子类：\n\
    \n1. `Error` – 包含在 Java 虚拟机 (`JVM`) 中发生的严重异常。`JVM` 是机器内部的机器，用于解决问题并帮助程序保持安全。`Error`\
    \ 子类不由程序员管理。\n2. `Exception` – 包含程序中发生的异常。`Exception` 子类由程序员管理。\n\n本书“第 2 部分 –\
    \ Java 4 Selenium WebDriver”将解释 `Exception` 子类。源自 `Error` 子类的异常是程序员无法控制的。以下来自\
    \ [Program Creek](http://www.programcreek.com/wp-content/uploads/2009/02/Exception-Diagram.jpeg)\
    \ 的一张图，显示了 Java 类的层次结构：\n\n![](img/00056.jpeg)\n### 图 7.8 – Java 异常层次结构\n\n# Java\
    \ 内置异常\n\n在 Java 中，`java.lang` 标准包中定义了大量的异常类。因此，由于 `java.lang` 被隐式导入每个程序中，某些异常是自动可用的。大多数异常源自标准类型\
    \ `RuntimeException`。`RuntimeException` 包含编译器不检查的异常。所有其他异常都由编译器检查，并且必须包含在方法的 `throws`\
    \ 列表中。以下是 `java.lang` 中未检查（unchecked）和已检查（checked）异常的列表：\n\n| 未检查异常 | 说明 |\n|\
    \ :--- | :--- |\n| `ArithmeticException` | 算术错误，例如除以零。 |\n| `ArrayIndexOutOfBoundsException`\
    \ | 数组索引越界。 |\n| `ArrayStoreException` | 向不兼容的类型的数组元素赋值。 |\n| `ClassCastException`\
    \ | 无效的类型转换。 |\n| `EnumConstantException` | 尝试使用未定义的枚举值。 |\n| `IllegalArgumentException`\
    \ | 调用方法时使用了非法参数。 |\n| `IllegalMonitorStateException` | 非法监视器操作，例如在未锁定的线程上等待。\
    \ |\n| `IllegalStateException` | 环境或应用程序处于错误状态。 |\n| `IllegalThreadStateException`\
    \ | 请求的操作与当前线程状态不兼容。 |\n| `IndexOutOfBoundsException` | 某种类型的索引越界。 |\n| `NegativeArraySizeException`\
    \ | 使用负尺寸创建数组。 |\n| `NullPointerException` | 对空引用的无效使用。 |\n| `NumberFormatException`\
    \ | 字符串到数值格式的无效转换。 |\n| `SecurityException` | 尝试违反安全性。 |\n| `StringIndexOutOfBoundsException`\
    \ | 尝试访问字符串范围外的索引。 |\n| `TypeNotPresent` | 未找到类型。 |\n| `UnsupportedOperationException`\
    \ | 遇到不支持的操作。 |\n\n### 图 7.9 – Java 未检查异常\n\n| 已检查异常 | 说明 |\n| :--- | :--- |\n\
    | `ClassNotFoundException` | 未找到类。 |\n| `CloneNotSupportedException` | 尝试克隆一个没有实现\
    \ `Cloneable` 接口的对象。 |\n| `IllegalAccessException` | 拒绝对类的访问。 |\n| `InstantiationException`\
    \ | 尝试创建抽象类或接口的对象。 |\n| `InterruptedException` | 一个线程被另一个线程中断。 |\n| `NoSuchFieldException`\
    \ | 请求的字段不存在。 |\n| `NoSuchMethodException` | 请求的方法不存在。 |\n| `ReflectiveOperationException`\
    \ | 反射相关异常的超类。 |\n\n### 图 7.10 – Java 已检查异常\n\n注意：除了 `java.lang` 之外，以下包包含异常：\n\
    \n| `java.awt` | `java.net` |\n| :--- | :--- |\n| `java.awt.color` | `java.rmi`\
    \ |\n| `java.awt.datatransfer` | `java.security` |\n| `java.beans` | `java.text`\
    \ |\n\n### 图 7.11 – 包含异常的包\n\n# 常见异常\n\n常见异常是程序中频繁异常。这类异常发生在新程序员和经验程序员身上。以下是按字母顺序排列的常见异常：\n\
    \n* `ArrayIndexOutOfBoundsException`\n* `ClassCastException`\n* `IllegalArgumentException`\n\
    * `IllegalStateException`\n* `NullPointerException`\n* `NumberFormatException`\n\
    * `OutOfMemoryError`\n* `StackOverflowError`\n\n数组从索引 0 开始存储第一个值。因此，最后一个索引位置是数组大小减\
    \ 1。当程序尝试访问数组边界外的索引时，会抛出 `ArrayIndexOutOfBoundsException`。以下是 `ArrayIndexOutOfBoundsException`：\n\
    \n```java\npublic class CommonException {\n    public static void main(String[]\
    \ args) {\n        String[] continents = new String[7];\n        continents[0]\
    \ = \"Africa\";\n        continents[1] = \"Antarctica\";\n        continents[2]\
    \ = \"Asia\";\n        continents[3] = \"Australia\";\n        continents[4] =\
    \ \"Europe\";\n        continents[5] = \"North America\";\n        continents[6]\
    \ = \"South America\";\n        continents[7] = \"America\";\n\n        System.out.println(\"\
    There are \" + continents.length + \" countries\");\n    }\n}\n```\n\n![](img/00057.jpeg)\n\
    ### 图 7.12 – ArrayIndexOutOfBoundsException / 常见异常示例\n\n* 第 8 行创建了一个包含 7 个元素的数组\
    \ `String[] continents = new String[7];`\n* 第 17 行的 `continents[7] = \"America\"\
    ;` 超出了数组 `continents` 的边界\n* 第 19 行没有执行，因为错误导致程序停止\n\n**程序输出：**\n```\nException\
    \ in thread \"main\" java.lang.ArrayIndexOutOfBoundsException: 7\n    at ExceptionHandling.CommonException.main(CommonException.java:17)\n\
    ```\n\n"
- fmt: "\nAccording to the Program Output, the out of bounds index is “7” located\
    \ at line 17. The first line indicates there is an exception then shows the exception\
    \ type `java.lang.ArrayIndexOutOfBoundsException`. Number 7 specifies the index\
    \ which causes the exception. The second line displays where the exception is\
    \ located `at ExceptionHandling.CommonException.main(CommonException.java:17)`.\
    \ The following is a translation of the second line:\n\nAn exception occurred\
    \ in package name `ExceptionHandling`, class name `CommonException`, method name\
    \ `main`, at line number 17.\n\n# Principles of Handling Exceptions\n\nIt is understood\
    \ that exceptions are problems that occur at runtime (during program execution).\
    \ Java allows an exception handler to handle exceptions which include benefits.\
    \ Remember the runtime error example from [Figure 7.4](#part0000_split_060.html_Figure_7_4),\
    \ where execution stopped due to a division by zero. A benefit of handling exceptions\
    \ is the program will continue executing after responding to an error. Therefore\
    \ an error does not stop program execution but the exception handler permits the\
    \ program to continue running. In Java, there are five interrelated keywords that\
    \ facilitate the management of handling exceptions. The following is a description\
    \ of each keyword:\n\n1. [try](#part0000_split_066.html_try) – monitors code where\
    \ an exception might occur\n2. [catch](#part0000_split_066.html_catch) – handles\
    \ the exception when an error occurs\n3. [throw](#part0000_split_070.html_throw)\
    \ – manually throws a custom exception\n4. [throws](#part0000_split_070.html_throws)\
    \ – throws an exception that occurred from a method\n5. [finally](#part0000_split_067.html__Finally_Block)\
    \ – automatically executes code after exiting a try block\n\nThe [Java Virtual\
    \ Machine (JVM)](#part0000_split_062.html_JVM) catches all exceptions if the exception\
    \ handler does not catch the exception. [JVM](#part0000_split_062.html_JVM) displays\
    \ an error message which is good for [debugging](#part0000_split_071.html__Debugging)\
    \ but not for handling exceptions. It is not good for handling exceptions due\
    \ to termination of the program.\n\n# Try / Catch Block\n\nThe try / catch block\
    \ allows code to be tried to verify whether an exception occurs. If an exception\
    \ occurs then the exception is caught to specify what should happen. The keywords\
    \ “try and catch” operate together when handling exceptions. Try is used to contain\
    \ the code that may cause an exception while catch manages the exception. Both\
    \ keywords “try and catch” are central to handling exceptions. A try block is\
    \ provided along with one or more catch blocks. It is important to know that the\
    \ try block and all catch blocks are bypassed if no exception occurs. The following\
    \ is the try / catch block syntax for handling exceptions:\n\n### Syntax\n\n```java\n\
    try\n{\n    // Code monitored by try block\n}\ncatch (ExceptionType1 excObject)\n\
    {\n    // Exception Handler for ExceptionType1\n}\ncatch (ExceptionType2 excObject)\n\
    {\n    // Exception Handler for ExceptionType2\n}\n```\n\nThe following is the\
    \ syntax details for try and catch block:\n\n| Arguments | Description |\n| :---\
    \ | :--- |\n| try | Monitors a block of code for an exception |\n| catch | Handles\
    \ and processes the exception |\n| ExceptionType1 ExceptionType2 | Type of exception\
    \ that must be the name of a class inherited from the Throwable class |\n| excObject\
    \ | Receives the value of an exception caught by the handler. |\n\n#### Figure\
    \ 7.13 – Syntax Details\n\nThe following is an example of a try and catch exception\
    \ handler:\n\n```java\npublic class TryCatchBlock\n{\n    public static void main(String[]\
    \ args)\n    {\n        String[] continents = new String[7];\n        try\n  \
    \      {\n            System.out.println(\"An exception has not been thrown\"\
    );\n            continents[0] = \"Africa\";\n            continents[1] = \"Antarctica\"\
    ;\n            continents[2] = \"Asia\";\n            continents[3] = \"Australia\"\
    ;\n            continents[4] = \"Europe\";\n            continents[5] = \"North\
    \ America\";\n            continents[6] = \"South America\";\n            continents[7]\
    \ = \"America\";\n            System.out.println(\"There are \" + continents.length\
    \ + \" continents\");\n        }\n        catch (ArrayIndexOutOfBoundsException\
    \ exc)\n        {\n            System.out.println(\"Exception!!! - Array Out of\
    \ Bounds. Not a valid continent\");\n        }\n        System.out.println(\"\
    This line executes automatically whether an exception occurs or not\");\n    }\n\
    }\n```\n\n![](images/00058.jpeg)\n\n#### Figure 7.14 – Try and Catch Example\n\
    \n**Program Output:**\nAn exception has not been thrown\nException!!! - Array\
    \ Out of Bounds. Not a valid continent\nThis line executes automatically whether\
    \ an exception occurs or not\n\n* Line 8 starts the code process using the try\
    \ block\n* Line 19 forces an exception when defining position 7 which is outside\
    \ the array. Therefore the try block is terminated and the program transfers control\
    \ to the catch block\n* Line 21 does not execute due to the exception at line\
    \ 19\n* Line 23 starts the exception handling process by listing the exception\
    \ `ArrayIndexOutOfBoundsException` within the catch block\n* Line 25 is executed\
    \ within the catch block after the exception is caught\n* Line 27 is executed\
    \ following the catch block. This line executes automatically whether an exception\
    \ occurs or not.\n\nA common practice in Java is to associate multiple catch blocks\
    \ with a try block. Each catch block must include a unique exception type such\
    \ as arithmetic exception, array out of bounds exception, etc. The exception type\
    \ determines which catch block is executed after creating multiple catch blocks.\
    \ Therefore if the arithmetic exception is executed then the array out of bounds\
    \ exception type is bypassed. The following is an example of a try block with\
    \ multiple catch blocks:\n\n```java\npublic class MultipleCatchBlocks\n{\n   \
    \ public static void main(String[] args)\n    {\n        int oddNumbers[] = {1,\
    \ 33, 55, 77, 111};\n        int evenNumbers[] = {0, 2, 4, 8};\n        for (int\
    \ i = 0; i < oddNumbers.length; i++)\n        {\n            try\n           \
    \ {\n                System.out.println(\"What is \" + oddNumbers[i] + \"/\" +\
    \ evenNumbers[i] + \"? \" + \"\" + oddNumbers[i]/evenNumbers[i]);\n          \
    \  }\n            catch (ArithmeticException except)\n            {\n        \
    \        System.out.println(\"Exception!!! - Cannot divide by zero\");\n     \
    \       }\n            catch (ArrayIndexOutOfBoundsException except)\n       \
    \     {\n                System.out.println(\"Exception!!! - Cannot locate the\
    \ index\");\n            }\n            System.out.println(\"This line executes\
    \ automatically whether an exception occurs or not\");\n        }\n    }\n}\n\
    ```\n\n![](images/00059.jpeg)\n\n#### Figure 7.15 – Multiple Catch Blocks\n\n\
    **Program Output:**\nException!!! - Cannot divide by zero\nWhat is 33/2? 16\n\
    What is 55/4? 13\nWhat is 77/6? 12\nWhat is 99/8? 12\n\n* Line 17 displays the\
    \ first catch block which contains an arithmetic exception. Catch blocks are evaluated\
    \ according to their order of association to the try block. Therefore this catch\
    \ block is evaluated first since it occurs first in the program.\n* Line 19 is\
    \ executed when the code reaches zero “0” in array `evenNumbers[]`.\n* Line 21\
    \ displays the second catch block which contains an array index out of bounds\
    \ exception.\n"
