  md: '# # Appendix A


    # # Gotchas


    Here are some popular "gotchas," that is, issues, problems, or misconceptions
    that have popped up over and over again to trap the unwary.


    # ## A.1 As Long As The Code Works


    Some folks seem to think that it''s okay to live with broken unit tests as long
    as the code itself works. Code without tests—or with broken tests—is broken. You
    just don''t know where, or when. In this case, you''ve really got the worst of
    both worlds: all that effort writing tests in the first place is wasted, and you
    still have no confidence that the code is doing what it ought.


    If the tests are broken, treat it just as if the code were broken.


    # ## A.2 "Smoke" Tests


    Some developers believe that a "smoke test" is good enough for unit testing. That
    is, if a method makes it all the way to the end without blowing up, then it passed.


    You can readily identify this sort of test: there are no asserts within the test
    itself, just one assertTrue(true) at the end. Maybe the slightly more adventurous
    will have multiple assertTrue(true) throughout, but no more than that. All they
    are testing, "did it make it this far?"'
  merge: -1
  pgno: 138
- img_proc: true
  md: 'And that''s just not enough. Without validating any data or other behavior,
    all you''re doing is lulling yourself into a false sense of security—you might
    think the code is tested, but it is not.


    Watch out for this style of testing, and correct it as soon as possible. **Real
    testing checks results.** Anything else is just wasting everyone''s time.


    # # A.3 “Works On My Machine”


    Another pathologic problem that turns up on some projects is that old excuse,
    “It’s not broken, it works on my machine.\” This points to a bug that has some
    correlation with the environment. When this happens, ask yourself:


    +   - Everything is under version control

    - Is the development environment consistent on the affected machines?


    +   - Is it a genuine bug that just happens to manifest itself on another machine
    (because it''s faster, or has more or less memory, etc.)


    End users, in particular, don’t like to hear that the code works on *your* machine
    and not theirs.


    All tests must pass on *all* machines; otherwise the code is broken.


    # # A.4 Floating-Point Problems


    Quite a few developers appear to have missed that day in class when they talked
    about floating-point numbers. It''s a fact of life that there are floating point
    numbers that can only be approximately represented in computer hardware. The computer
    only has so many bits to work with, so something has to give.


    This means that $1.333 + 1.333$ isn''t going to equal $2.666$ exactly. It will
    be close, but not exact. That’s why the JUnit floating-point asserts require you
    to specify a *tolerance* along the desired values (see the discussion on page
    23).'
  merge: -1
  pgno: 139
- img_proc: true
  md: 'But still you need to be aware that “close enough” may be deceptive at times.
    Your tests may be too lenient for the real world’s requirements, for instance,
    or you might puzzle at an error message that says:


    +   There was 1 failure:

    1) testXyz(TestXyz).junit.framework.AssertionFailedError:

    expected:<1.000000 but was:<1.000000

    at testXyz.testXyz.java:10


    Gosh, they sure look equal to me!” But they aren’t—there must be a difference
    that’s smaller than is being displayed by the print method.


    As a side note, you can get a similar problem when using date and time types.
    Two dates might look equal as they are normally displayed—but maybe the milliseconds
    aren’t equal.


    # A.5 Tests Take Too Long


    Unit tests need to run fairly quickly. After all, you’ll be running them a lot.
    Suddenly you might notice that the tests are taking too long. It’s slowing you
    down as you write tests and code during the day.


    That means it’s time to go through and look at your tests with a fresh eye. Cull
    out individual tests that take longer than average to run, and group them together
    somewhere.


    You can run these optional, longer-running tests once a day with the build, or
    when you check in, but not have to run them every single time you change code.


    Just don’t move them so far out of the way that they never run.


    # A.6 Tests Keep Breaking


    Some teams notice that the tests keep breaking over and over again. Small changes
    to the code base suddenly break tests all over the place, and it takes a remarkable
    amount of effort to get everything working again.'
  merge: -1
  pgno: 140
- img_proc: true
  md: 'This is usually a sign of excessive coupling. Test code might be too tightly-coupled
    to external data, to other parts of the system, and so on.


    As soon as you identify this as a problem, you need to fix it. Isolate the necessary
    parts of the system to make the tests more robust, using the same techniques you
    would use to minimize coupling in production code. See [HT00] for more details
    on orthogonality and coupling, or [FBB+99] for information on refactoring and
    design smells, and don''t forget to use Mock Objects (Chapter 6) to decouple yourself
    from the real world.


    # A.7 Tests Fail on Some Machines


    Here''s a common nightmare scenario: all the tests run fine—on most machines.
    But on certain machines they fail consistently. Maybe on some machines they fail
    intermittently.


    What on earth could be going on? What could be different on these different machines?


    The obvious answer is differences in the version of the operating system, libraries,
    the Java runtime engine, the database driver; that sort of thing. Different versions
    of software have different bugs, workarounds, and features, so it''s quite possible
    that machines configured differently behave differently.


    But what if the machines are configured with identical software, and you still
    get different results?


    It might be that one machine runs a little faster than the other, and the difference
    in timing reveals a race condition or other problem with concurrency. The same
    thing can show up on single vs. multiple-processor machines.


    It''s a real bug, it just happened not to have shown up before. Track it down
    on the affected machine using the usual methods. Prove the bug exists on that
    machine as best you can, and verify that all tests pass on all machines when you
    are done.'
  merge: -1
  pgno: 141
