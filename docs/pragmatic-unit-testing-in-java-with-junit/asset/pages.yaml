  md: "# TESTING A SERVLET\n\nthe clock, or pull wires, or anything like that.\n\n\
    Because we've got an established interface to all system functions, people will\
    \ (hopefully) be more likely to use it instead of calling methods such as System.currentTimeMillis()\
    \ di-rectly, and we now have control over the behavior behind that interface.\n\
    \nAnd that's all there is to mock objects: faking out parts of the real world\
    \ so you can concentrate on testing your code easily. Let's look at a more complicated\
    \ example next.\n\n# 6.3 Testing a Servlet\n\nServlets are chunks of code that\
    \ a Web server manages: requests to certain URLs are forwarded to a servlet container\
    \ (or manager) such as Jakarta Tomcat, which in turn invokes the servlet code.\
    \ The servlet then builds a response that it sends back to the requester browser.\
    \ From the end-user's perspective, it's just like accessing any other page.\n\n\
    The listing below shows just part of the source of a trivial servlet that converts\
    \ temperatures from Fahrenheit to Celsius. Let's step quickly through its operation.\
    \ \n\n```\npublic void doGet(HttpServletRequest req,\n    HttpServletResponse\
    \ res)\nthrows ServletException, IOException {\n    String str_f = req.getParameter(\"\
    Fahrenheit\");\n    res.setContentType(\"text/html\");\n    PrintWriter out =\
    \ res.getWriter();\n    try {\n        int temp_f = Integer.parseInt(str_f);\n\
    \        double temp_c = (temp_f - 32)*5.0 / 9.0;\n        out.println(\"Fahrenheit:\
    \ \" + temp_f + \" Celsius: \" + temp_c);\n    } catch (NumberFormatException\
    \ e) {\n        out.println(\"Invalid temperature: \" + str_f);\n    }\n}\n```\n\
