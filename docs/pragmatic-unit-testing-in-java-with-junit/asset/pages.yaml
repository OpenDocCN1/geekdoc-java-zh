  md: '# Chapter 6


    # Using Mock Objects


    The objective of unit testing is to exercise just one method at a time, but what
    happens when that method depends on other things—hard-to-control things such as
    the network, or a database, or even a servlet engine?


    What if your code depends on other parts of the system—maybe even *many* other
    parts of the system? If you''re not careful, you might find yourself writing tests
    that end up initializing nearly every system component to give the tests enough
    context to run. Not only is this time consuming, it also introduces a ridiculous
    amount of coupling into the testing process: someone goes and changes an interface
    or a database table, and suddenly the setup code for your poor little test dies
    mysteriously. Even the best-intention developers will be discouraged after this
    happens a few times, and eventually abandon all testing. But there are techniques
    we can use to help.


    In movie and television production, crews will often use *stand-ins or doubles*
    for the real actors. In particular, while the crews are setting up the lights
    and camera angles, they''ll use *lighting doubles*: inexpensive, unimportant people
    who are about the same height and complexion as the expensive, important actors
    lounging in their luxurious trailers.


    The crew then tests their setup with the lighting doubles, measuring the distance
    from the camera to the stand-in'' nose, adjusting the lighting until there are
    no unwanted shad-'
