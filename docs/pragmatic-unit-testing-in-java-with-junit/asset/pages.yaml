  md: "# CHAPTER 3. WRITING TESTS IN JUNIT\n\nContrary to what you might think, exceptions\
    \ are really good things—they tell us that something is wrong. Sometimes in a\
    \ test, we want the method to throw an exception. Consider a method named sortList().\
    \ It's supposed to throw an exception if passed a null list. We must test for\
    \ that explicitly.\n\n```\npublic void testForException() {\n  try {\n    sortList(null);\n\
    \    fail(\"Should have thrown an exception\");\n  } catch (RuntimeException e)\
    \ {\n    assertTrue(true);\n  }\n}\n```\n\nThe method under test is within a try/catch\
    \ block on line 3. This method is expected to throw an exception, so if it doesn't—if\
    \ we proceed past line 3—then we need to fail the test immediately. If the exception\
    \ fires, the code will proceed to line 6 and record the assertion for statistical\
    \ purposes.\n\nNow you might ask why bother with the assertTrue It won't do anything,\
    \ it can't fail, so why bother putting it in? Any of assertTrue(true) translates\
    \ as \"I expect the control flow should pass through here.\" That's a strong form\
    \ of documentation that will help clear any possible misunderstandings later.\
    \ However, don't forget that an assertTrue(true) that is never called does not\
    \ generate a failure.\n\nIn general, you should test a method for every declared\
    \ exception, and make sure that it throws when it should. It covers us for expected\
    \ exceptions, but what about unexpected exceptions?\n\nWhile you can catch all\
    \ possible exceptions yourself and call JUnit's fail(), you'd better off letting\
    \ JUnit do the hard work. For instance, suppose you are reading a file of test\
    \ data. Rather than catching the possible I/O exceptions yourself, simply declare\
    \ your test method to throw the possible exceptions:\n\n```\npublic void testData1()\
    \ throws FileNotFoundException {\n  FileInputStream inputStream = new FileInputStream(\"\
    data.txt\");\n}\n```"
