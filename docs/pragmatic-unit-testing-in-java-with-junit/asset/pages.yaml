- img_proc: true
  md: '# 7.1 Automatic


    Unit tests need to be run automatically. We mean “automatically” in at least two
    ways: invoking the tests and checking the results.


    It must be really easy for you to invoke one or more unit tests, as you will be
    doing it all day long, day in day and day out. So it really can''t be any more
    complicated than pressing one button in the prompt or typing in one command in
    IDEs to run the tests you want. Some IDE can even be set up to run the tests continuously
    in the background.


    It’s important to maintain this environment: don’t introduce a test that breaks
    the automatic model by requiring manual steps. Whatever the test requires (database,
    network connections, etc.), make these an automatic part of the test itself. Mock
    objects, as described in Chapter 6, can help insulate you from changes in the
    real environment.


    But you''re not the only running tests. Somewhere a machine should be running
    all of the unit tests for all checked-in code continuously. This automatic, unattended
    check acts as a “back stop”: a safety mechanism to ensure that whatever is checked
    in hasn''t broken any tests, anywhere. In an ideal world, this wouldn''t be necessary
    as you could count on every individual developer to run all the necessary tests
    themselves.


    But this isn''t an ideal world. Maybe an individual didn''t run some necessary
    test in a remote center of the project. They have some code on their own machine
    that makes it all work—but they haven''t checked that code in, so even though
    the tests work on their own machine, those same tests fail everywhere else.


    You may want to investigate systems such as CruiseControl¹, AntHill², Tinder³.
    These are freely available, open source products that manage continuous building
    and testing. We describe setting up a continuous-build and testing environment
    in Volume III of the Starter Kit [Cla04].


    > ¹http://cruisecontrol.sourceforge.net

    ²http://www.cs.unibo.it/projects/anthill

    ³http://www.mozilla.org/tinderbox.html'
