    public class TestSimple extends TestCase {\n    public TestSimple(String name)\
    \ {\n        super(name);\n    }\n    public void testAdd() {\n        assertEquals(2,\
    \ 1+1);\n    }\n```\n\nThis code is pretty straightforward, but let's take a look\
    \ at each part in turn.\n\nFirst, the import statement on line 1 brings in the\
    \ necessary JUnit classes.\n\nNext, we have the class definition on line 3: each\
    \ class that contains tests must extend TestCase as shown. The base class TestCase\
    \ provides most of the unit-testing functionality that we'll need, including all\
    \ of the assert methods we described above.\n\nThe base class requires a constructor\
    \ that takes a String, so we have to provide a call to super that passes in a\
