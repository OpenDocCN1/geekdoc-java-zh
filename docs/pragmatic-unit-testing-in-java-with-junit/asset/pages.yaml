  md: 'of code and put that functionality in a method instead, so it can be called
    from several different places.


    You may find you accumulate several related test methods that should be encapsulated
    in a class. Don''t fight it! Go ahead and create a new class, even if it''s only
    ever used for testing. That''s not only okay, it''s encouraged: test code is real
    code. In some cases, you may even need to create a larger framework, or create
    a data-driven testing facility (remember the simple file reader for TestLargest
    on page 39?).


    Don''t waste time testing aspects that won''t help you. Remember, you don''t want
    to create tests just for the sake of creating tests. Test code must be thorough
    in that it test everything interesting about a method that is likely to contain
    a bug. If it''s not likely to contain a bug, don''t bother testing. It means that
    usually you shouldn''t waste time testing things like simple accessors:


    ```

    public Money getBalance() {

    return balance;

    }

    ```


    Frankly, there''s not much here to go wrong that the compiler can''t catch. Testing
    methods such as these are just a waste of time. However, if the accessor is doing
    some work along the way, then suddenly it becomes interesting—and we will want
    to test it:


    ```

    public Money getBalance() {

    return posted.getBalance() +

    unposted.getDebits() +

    unposted.getCredits();

    }

    ```


    That''s probably worth testing.


    Finally, expect that there will be at least as much test code written as there
    will be production code. Yup, you read that right. If you''ve got 20,000 lines
    of code in your product, then there would be reasonable to expect that there would
    lines or more of unit test code to exercise it. That''s a lot of test code, which
    is why it needs to be kept neat and tidy, well designed and well-factored, just
    as professional as the production code.'
