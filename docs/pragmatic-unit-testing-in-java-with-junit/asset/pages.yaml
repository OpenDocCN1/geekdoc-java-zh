    # 3.7 More on Naming


    Normally, you want tests all of the time. But suppose you thought a bunch of tests
    first, written them, and are now working your way through implementing the code
    required to pass the tests. What about all those new tests that would fail now?


    You can go ahead and write these tests, but you don''t want the testing framework
    to run these tests just yet. Fortunately, most testing frameworks use a naming
    convention to discover tests automatically. When using JUnit in Java, for instance,
    methods whose names start with "test" (as in testMyShop) will be run as tests;
    all you need to do is name the method something else until you''re ready to tackle
    it. If you named pending tests as "pendingTestMyShop", then not only will the
    testing framework ignore it for now, but you could also search for the string
    "pendingTest" throughout your code to find easily any tests you may have missed.
    Of course, the code still has to compile easily; if it''s not ready for that,
    then you should comment out the offending parts.


    What you want to avoid at all costs is the habit of ignoring failing test results.


    # 3.8 JUnit Test Skeleton


    All you really need to write tests using JUnit are just these three things:


    +   1. An import statement to bring in junit.framework.*

    2. An extends statement so your class will inherit from TestCase

    3. A constructor with a call to super(string)'
