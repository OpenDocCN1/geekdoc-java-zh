    \ the test code (to ensure that we don't get sued.\n\n# Parallel Trees\n\nAnother\
    \ option is to place your Test classes into the same package as your production\
    \ code, but in a different code tree. The trick is to ensure that the root of\
    \ both trees is in the compiler's CLASSPATH. In this case, both prod and test\
    \ should be in the CLASSPATH."
