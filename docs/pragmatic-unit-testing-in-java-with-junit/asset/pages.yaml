  md: '# 7.3 Repeatable


    Just as every test should be independent from every other test, they must be independent
    of the environment as well. The goal remains that every test should be able to
    run over and over again, in any order, and produce the same results. This means
    that tests cannot rely on anything in the external environment that isn''t under
    your direct control.


    Use mock objects as necessary to isolate the item under test and keep it independent
    from the environment. If you are forced to use some element from the real world
    (a database, perhaps), make sure that you won''t get interference from any other
    developer. Each developer needs their “sandbox” to play in, whether that''s their
    own database instance within Oracle, or their own webserver on some non-standard
    port.


    Without repeatability, you might be in some surprises at the worst moments. What''s
    worse, these sort of surprises are usually bogus—it''s not really a bug, it''s
    just a problem with the test. You can''t afford to waste time chasing down phantom
    problems.


    Each test should produce the same results every time. If it doesn''t, then should
    you tell you that there''s a real bug in the code.


    # 7.4 Independent


    Tests need to be kept neat and tidy, which means keeping them tightly focused,
    and independent from the environment and each other (remember, other developers
    may be running these same tests at the same time).


    When writing tests, make sure that you are only testing one thing at a time.


    Now that doesn''t mean you use only one assert in a test, but that one test method
    should concentrate on a single production method, or a small set of production
    methods that, together, provide some feature.'
