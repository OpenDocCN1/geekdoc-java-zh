  md: '# 9.5 Testing Invalid Parameters


    One question that comes up when folks first start testing is: "Do I have to test
    whether my class validates parameters?" The answer, in best consultant fashion,
    is "it depends.\"


    Is your class supposed to validate its parameters? If so, yes, you need to test
    that this functionality is correct. But there''s a larger question here: Who''s
    responsible for validating input data?


    In many systems, the answer is mixed, or haphazard at best. You can''t really
    trust that other part of the system has checked the input data, so you have to
    check it yourself—or at least, that aspect of the input data that particularly
    concerns you. In effect, the data ends up being checked by everyone and no one.
    Besides a grotesque violation of the DRY principle [HT00], it wastes a lot of
    time and energy—and we typically don''t have much extra to waste.


    In a well-designed system, you establish up-front the parts of the system that
    need to perform validation, and localize those to a small and well-known part
    of the system.


    So the first question you should ask about a system is, "who is supposed to check
    the validity of input data?",


    Generally we find the easiest rule to adopt is the "keep the barbarians out at
    the gate" approach. Check input at the boundaries of the system, and you won''t
    have to duplicate those tests inside the system. Internal components can trust
    that if the data has made it far into the system, then it must be okay.


    It''s sort like a hospital operating room or industrial "clean room" approach.
    You undergo elaborate cleaning rituals before you—or any tools or materials—can
    enter the room, but once there you are assured of a sterile field. If the field
    becomes contaminated, it''s a major catastrophe; you have to re-sterilize the
    entire environment.


    Any part of the software system that is outward-facing (a UI, or interface to
    another system) needs to be robust, and not allow any incorrect or unvalidated
    data through. What defines'
