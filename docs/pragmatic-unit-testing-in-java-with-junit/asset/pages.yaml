  md: '+   • Relative time (ordering in time)


    +   • Absolute time (elapsed and wall clock)


    +   • Concurrency issues


    Some interfaces are inherently stateful; you expect that login() will be called
    before logout(), that prepareState() is called before executeStatement(), connect()
    which is before read() which is before close(), and so on.


    What happens if those methods are called out of order? Maybe you should try calling
    methods out of the expected order. Try skipping the first, last and middle of
    a sequence. Just as order of data may may have mattered to you in the earlier
    examples (as we described in “Ordering” on page 49), now it''s the order of the
    calling sequence of methods.


    Relative time might also include issues of timeouts in the code: how long your
    method is willing to wait for some resource to become available. As we''ll discuss
    shortly, you''ll want to exercise possible error conditions in your code, including
    things as timeouts. Maybe you''ve got conditions that are not guarded by timeouts—can
    you think of a situation where the code might get “stuck” waiting forever for
    something that might not happen?


    This leads to issues of elapsed time. What if something you are waiting for takes
    “too much time”? What if your method takes too much time to return to the caller?


    Then there''s the actual wall clock time to consider. Most of the time, this makes
    no difference whatsoever to code. But every now and then, time of day will matter,
    perhaps in subtle ways. Here''s a quick question, true or false: every day of
    the year is 24 hours long?


    The answer is “it depends.” In UTC (Universal Coordinated Time, the modern version
    of Greenwich Mean Time, and GMT), the answer is Saving Time. In areas of the world
    that do not observe Daylight Savings Time (DST), the answer is YES. Most of the
    U.S. (which does DST), the answer is NO. In April, you''ll have a day with 23
    hours (spring forward) and in October you''ll have a day with 25 (fall back).
    This means that arithmetic won''t always work as you expect; 1:45AM plus 30 minutes
    might equal 1:15, for instance.'
