  md: '# Preface


    Welcome to the world of developer-centric unit testing! We hope you find this
    book to be a valuable resource for yourself and your project team. You can tell
    us how it helped you—or let us know how we can improve—by visiting the Pragmatic
    Unit Testing page on our web site and clicking on “Feedback."


    Feedback like that is what makes books great. It''s also what makes people and
    projects great. Pragmatic programming is all about using real-world feedback to
    fine tune and adjust your approach.


    Which brings us to unit testing. As we''ll see, unit testing is important to you
    as a programmer because it provides the feedback you need. Without unit testing,
    you may as well be writing programs on a yellow legal pad and hoping for the best
    when they''re run.


    That''s not very pragmatic.


    But while the examples are in Java, using the JUnit framework, the concepts remain
    the same whether you are writing in C++, Fortran, Ruby, Smalltalk, or VisualBasic.
    Testing frameworks similar to JUnit exist for over 60 different languages; these
    various frameworks can be downloaded for free.


