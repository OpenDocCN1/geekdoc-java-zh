  md: 'Finally, by “automatic” we mean that the test must determine for itself whether
    it passed or failed. Having a person (you) or some other hapless victim read through
    the test output and determine whether the code is working or not is a recipe for
    project failure. It''s an important feature of consistent regression to have the
    tests check for themselves. We humans aren''t very good at those repetitive tasks,
    and besides we''ve got more important things to do—remember the project?


    This idea of having the tests run by themselves is critical, because it means
    you don''t have to think about it—it just happens as part of the project. Testing
    can then fulfill its role as a major component of our project''s safety net. (Version
    control and automation are the other two major components of the “safety net.”)
    Tests are there to catch you when you fall, but they''re not in your way. You''ll
    need all of your concentration as you cross today''s high-wire.


    # 7.2 Thorough


    Good units are thorough; they test everything that''s likely to break. But just
    how thorough? At one extreme, you can aim to test every line of code, every possible
    branch the code might take, every exception it throws, and so on. At the other
    extreme, you test the most likely candidates—boundary conditions, missing and
    malformed data, and so on. It''s a question of judgment, based on the needs of
    your project.


    If you want to aim for more complete coverage, then you may want to invest in
    code coverage tools to help. (See, for instance, the freely available “nounit”4
    and “quilt”5 commercial tools, such as Clover, are available well.)


    These tools can help you determine how much of the code under test is actually
    exercised.


    It''s important to realize that bugs are not evenly distributed throughout the
    source code. Instead, they need to clump together in problematic areas (for an
    interesting story about these lines, see the sidebar on the following page).


    ```

    4http://nounit.sourceforge.net

    5http://quilt.sourceforge.net

    ```'
