  md: '+   - Reference — Does the code anything external that isn''t under direct
    control of the code itself


    +   - Existence — Does the value exist (e.g., is non-null, nonzero, present in
    a set, etc.)


    +   - Cardinality — Are there exactly enough values?


    +   - Time (absolute and relative) — Is everything happening in order? At the
    right time? In time


    We will examine all of these boundary conditions in the next chapter.


    # 4.3 Check Inverse Relationships


    Some methods can be checked by applying their logical-inverse. For instance you
    might check a method that calculates a square root by squaring the result, and
    testing that it is toler closely to the original number:


    ```

    public void testSquareRootUsingInverse() {

    double x = mySquareRoot(4.0);

    assertEquals(4.0, x * x, 0.0001);

    }

    ```


    You might check that some data was successfully inserted into a database by then
    searching for it, and so on.


    Be cautious when you''ve written both the original routine and it''s inverse,
    as some bugs might be masked by a common error in both routines. Where possible,
    use a different source for the inverse test. In the square root example, we''re
    just using regular multiplication to test our method. For the database search,
    we''ll probably use a vendor-provided search routine to test our insertion.


    # 4.4 Cross-check Using Other Means


    You might also be able to cross-check results of your method using different means.


    Usually there is more than one way calculate quantity; we might pick one algorithm
    over the others because it performs better, or has other desirable characteristics.
    That''s'
