  md: '# A.8 My main is Not Being Run


    If you write a custom main in your test code it will be run when you run that
    class (for example, from the command line). However, if run by a JUnit test runner,
    your main will not be executed.


    In particular, if you are using Ant^1 to run tests using the JUnit Task, main
    will not be called.


    That''s why you don''t want to place any sort of setup code in main. Use the JUnit-provided
    setUp and tearDown methods (discussed on page 29) instead.


    ^1http://ant.apache.org'
