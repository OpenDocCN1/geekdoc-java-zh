  md: '# Chapter 7


    # Properties of

    Good Tests


    Unit tests are very powerful magic, and if used badly can cause an enormous amount
    of damage to a project by wasting your time. If unit tests aren''t written and
    implemented properly, you can easily waste so much time maintaining and debugging
    the tests themselves that the production code—and the whole project—suffers.


    We can''t let that happen; remember, the whole reason you''re doing unit testing
    in the first place is to make your life easier! Fortunately, there are only a
    few simple guidelines that you need to follow to keep trouble from brewing on
    your project.


    Good tests have the following properties, which makes A-TRIP:


    +   * Automatic

    "* Repeatable

    "* Independent

    * Professional


    Let''s look at what each of these words means to us.'
