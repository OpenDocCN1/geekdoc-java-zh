  md: '# Joe Asks...


    What''s collateral damage?


    Collateral damage is what happens when a new feature or a bug fix in one part
    of the system causes a bug (damage) to another, possibly unrelated part of the
    system. It''s an insidious problem that, if allowed to continue, can quickly render
    the entire system broken beyond anyone''s ability to fix.


    We sometimes call this the "Whac-a-Mole" effect. In the carnival game of Whac-a-Mole,
    the player must strike the mechanical mole heads that pop up on the playing field.
    But they don''t keep their heads up for long; as soon as you move to strike one
    mole, it retreats and another mole pops up on the opposite side of the field.
    The moles pop up and down fast enough that it can be very frustrating to try to
    connect with one score. As a result, players generally flail hopelessly at the
    field as the moles continue to pop up where you least expect them.


    Widespread collateral damage to a code base can have a similar effect.


    It takes too much time to write the tests This is the number one complaint voiced
    by most newcomers to unit testing. It''s untrue, of course, but to see why we
    need to take a closer look at where you spend your time when developing code.


    Many people view testing of any sort as something that happens toward the end
    of a project. And yes, if you wait to begin unit testing until then it will take
    too long. In fact, you may not finish the job until the heat death of the universe
    itself.


    At least it will feel that way: it''s like trying to clear a couple of acres of
    land with a lawn mower. If you start early on when there''s just a field of grasses,
    the job is easy. If you wait until later, when the field contains thick, gnarled
    trees and dense, tangled underneath, then the job becomes impossibly difficult.'
