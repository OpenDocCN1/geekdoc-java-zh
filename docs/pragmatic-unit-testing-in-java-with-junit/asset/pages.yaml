  md: '# Reported Bugs vs. Unit Test Coverage


    We had a client recently that didn''t quite believe in the power of unit tests.
    A few members of the team were very good and disciplined at writing unit tests
    for their own modules, many were somewhat sporadic about it, and a few refused
    to be bothered with unit tests at all.


    As of the hourly build process, we whipped up a simple Ruby script that performed
    a quick-and-dirty analysis of test coverage: it tallied up the ratio of test code
    asserts to production code for each module. Well-tested methods may have 3, 4,
    or more asserts; untested methods will have none at all. This analysis ran with
    every build and produced a bar, ranking the most-tested modules at the top and
    the untested modules at the bottom.


    After a few weeks of gathering figures, we showed the bargain to the project manager,
    without initial explanation. He was very surprised to see all of the "problem
    modules" lumped together at the bottom—he thought we somehow produced this graph
    based on bug reports from QA and customer support. Indeed, the modules at the
    top of the graph (well tested) were nearly unknown to him; very few, if any problems
    had ever been reported against them. But the clump of modules at the bottom (that
    had no unit tests) were very well known to him, the sup-managers, and the local
    drugstore had resorted to stocking extra-large supplies of antacid.


    The results were very nearly linear: the more unit-tested the code, the fewer
    problems.


    This phenomenon leads to the well-known battle cry of "don''t patch it, rewrite
    it." Often, it can be much cheaper and less painful to throw out a piece of code
    that has a clump of bugs and rewrite it from scratch. And of course, it''s much
    safer to rewrite code from scratch now: you''ll have a set of unit tests that
    can confirm the new code works as it should.'
