  md: '# CHAPTER 4. WHAT TO TEST: THE RIGHT-BICEP


    The data file has a very simple format; each line contains a set of numbers. The
    first number is the expected answer, the numbers on the rest of the line are the
    arguments with which to test. We''ll allow a pound-sign (#) for comments, so that
    you you can put meaningful descriptions and notes in the test file.


    The test file can then be as simple as:


    ```

    # Simple tests:

    # 9 7 8 9

    9 9 8 7

    9 9 8 9

    # Negative number tests:

    # -7 -8 -9

    -8 -7 -8

    -9 -7 -8

    # Mixture:

    # 7 -9 -8 7 6 4

    9 -1 0 -7 4

    # Boundary conditions:

    # 1 1

    0 0

    2147483647 2147483647

    -2147483648 -2147483648

    ```


    For just a handful of tests, as in this example, it''s probably not worth the
    effort. But say this was a more advanced application, with tens or even hundreds
    of test cases in this form. Then the data file approach becomes a very compelling
    choice.


    Be aware that test data, whether it''s in a file or in the test code itself, might
    well be incorrect. In fact, experience suggests that test data is more likely
    to be incorrect than the code you''re testing, especially if the data was hand-calculated
    or obtained from a system we''re replacing (where new features deliberately cause
    new results). When test data says you''re wrong, double- and triple-check that
    the test data is right before attacking the code.


    Something else to think about: the code as presented does not test any exception
    cases. How might you implement that?


    Do whatever makes it easiest for you to prove that the method is right.


    ![](img/b707d7ecf5b37c24434a141d9f59b58d_57_0.png)'
