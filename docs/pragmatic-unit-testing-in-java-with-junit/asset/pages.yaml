  md: 'Wait wait, you may cry, what be about a leftover record from a previous test
    run? No, Won''t that be in the database? No, it won''t, for several reasons:


    +   - You may not really be testing against a live database. The code exercised
    by the above test case lies between the add method shown and the actual low-level
    database calls. Those database calls may be well handled by a mock object, whose
    data is not held persistently in between.


    +   - Tests are independent. All tests can be run in any order, and do not depend
    on each other, even if a real database is part of this test, the setup and tear-down
    must ensure that you get a “clean sandbox” to play in. The attempt to spring the
    trap can help prove that this is true.


    Now the Extreme Programming folks claim that their disciplined practice of test-first
    development avoids the problem of poor tests that don''t fail when they should.
    In test-first development, you only ever write code to fix a failing test. As
    soon as the test passes, then you know the code you added it. This puts you in
    the position where you always know with absolute certainty that the code you introduced
    fixes the failing test that caused you to write the code in the first place.


    But there''s many a slip ‘twixt the cup and the lip, and while test-first development
    does improve the situation dramatically, there will still be opportunities to
    be misled by coincidences. For those occasions, you can satisfy any lingering
    doubts by deliberately “springing the trap” to make sure that all is as you expect.


    Finally, remember to write tests that are A-TRIP (Automatic, Thorough, Repeatable,
    Independent, Professional); keep adding to your unit tests as new bugs and types
    of bugs are discovered; and check to make sure your tests really find the bugs
    they target.


    Then sit back and watch problems on your project disappear like magic.'
