    \ in the test subpackage that exposes it for testing.\n\n```\npackage com.acme.test;\n\
    import com.acme.Pool;\npublic class PoolForTesting extends Pool {\n    public\
    \ Date getLastCleaned() {\n        return lastCleaned;\n    }\n}\n```\n\nYou then\
    \ use PoolForTesting in the test code instead of using Pool directly (see Figure\
