  md: 'This code is a good starting point; however, there''s a lot of duplicated code
    in skeleton that will be propagated throughout the system. That is, copying this
    code for each class throughout the system will result in duplication. And that
    can cause problems.


    For example, we had a client that did exactly at that. They were somewhat new
    to unit testing, and wanted to be able to run tests from the command line. So
    they had a boilerplate template that provided a suitable main() to run the tests.
    It also contained startup code to establish database and CORBA connections.


    The code was widely copied throughout the system, which was unfortunate when the
    CORBA connection logic had to change. The developer who had written the template
    in the first place had to go through all 78 places where it had been copied to
    make the necessary change. When the database connection changed, he had to go
    through all 86 places and change them again (a few more classes had been introduced
    by then).


    So perhaps we''d better refactor this skeleton before it becomes widely used,
    to make the part that gets copied as small and trivial as possible, with all the
    real functionality located in one place (instead of the 112 places it''s up to
    now).


