    Let''s look at each one of these in turn. Remember that for each of these areas,
    you want to consider data that is passed in as arguments to your method as well
    as internal data that you maintain inside your method and class.


    The underlying question that you want to answer fully is:


    # What else can go wrong?


    Once you think of something that could go wrong, write a test for it. Once that
    test passes, again ask yourself, “what else can go wrong?” and write another test,
    and so on.


    # 5.1 Conformance


    Many times you expect or produce data that must conform to some specific format.
    An e-mail address, for instance, isn''t just a simple string. You expect that
    it must be of the form:


    ```

    name@somewhere.com

    ```


    With the possibility of extra dotted parts:


    ```

    firstname.lastname@subdomain.somewhere.com

    ```


    And even oddballs like this one:


    ```

    firstname.lastname%somewhere@subdomain.somewhere.com

    ```


    Suppose you are writing a method that will extract the user''s name from their
    e-mail address. You''ll expect the user''s name is the portion before the “@”
    sign. What will your code


