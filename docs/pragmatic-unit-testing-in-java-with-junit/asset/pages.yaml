    # 6.4 Easy Mock Objects


    If the thought of writing all these mock object classes is intimidating, you might
    want to take a look at Easy-Mock,³ a convenient Java API for creating mock objects
    dynamically.


    Easy-Mock uses a very interesting method to specify which method calls are allowed
    and what their return values should be: you specify which method calls should
    exist by calling them! The mock control object lets you specify a record mode
    and a replay mode for the corresponding mock object. While the object is in record
    mode, you go ahead and call all the methods you are interested in and set the
    desired return values. Once that''s finished, you switch over to replay mode.
    Now when you call those methods, you''ll get the return values you specified.


    Any remaining methods will throw a runtime exception if they are called—but the
    nice part is that you don''t have to define any of them.


