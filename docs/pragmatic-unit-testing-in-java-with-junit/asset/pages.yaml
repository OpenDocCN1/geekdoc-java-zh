    # 6.2 Mock Objects


    Fortunately, there''s a testing pattern that can help: mock objects. A mock object
    is simply a debug replacement for a real-world object. There are a number of situations
    that come up where mock objects can help us. Tim Mackinnon [MFC01] offers the
    following list:


    +   - The real object has nondeterministic behavior (it produces unpredictable
    results, like a stock-market quote feed.


    +   - The real object is difficult to set up.


    +   - The real object has behavior that is hard to trigger (for example, a network
    error).


    +   - The real object is slow.


    +   - The real object has (or is) a user interface.


    +   - The test needs to ask the real object about how it was used (for example,
    a test might need to confirm that a callback function was actually called).


    +   - The real object does not yet exist (a common problem when interfacing with
    other teams or new hardware systems).


    Using mock objects, we can get around all of these problems. The three key steps
    to using mock objects for testing:


    +   1. Use an interface to describe the object


    +   2. Implement the interface for production code


    +   3. Implement the interface in a mock object for testing


    The code under test only ever refers to the object by its interface, so it can
    remain blissfully ignorant as to whether it is using the real object or the mock.
    Let''s take another example. We''ll start by creating an interface for'
