  md: '# Appendix C


    # JUnit Test Skeleton


    Sometimes it can be convenient to add a bit more functional ity to the unit tests.
    In particular, it''s nice to add a main so that you can simply run the test class
    directly from the command line. For example, suppose we have a test case named
    com.abc.test.TestAlpha. In this case we have three test methods, named testDefault(),
    testWithReal() and testWithExtension().


    ```

    java com.abc.test.TestAlpha

    java com.abc.test.TestAlpha testWithReal

    java com.abc.test.TestAlpha testWithReal testDefault

    ```


    The first command will run all three of the test methods in TestAlpha. The second
    line will just run the one method testWithReal() and the last will run both testWithReal()
    and testDefault().


    Figure C.1 on the following page shows a skeleton template that provides that
    functionality: you can run tests or just a named test from the command line. It
    will use the suite method of a test class if one is defined, otherwise it will
    use reflection to discover the test... methods. It also includes stubs for the
    setUp and tearDown methods.


    You''ll notice we put in a default suite() method as well. This allows you to
    always assume that every TestCase has a suite() method you can call, even if it
    does the default dynamic-discovery of test methods. You can change this, of course,
    to add selected tests or composite suites and so on.'
