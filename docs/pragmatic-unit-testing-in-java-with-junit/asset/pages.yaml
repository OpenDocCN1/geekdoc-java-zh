  md: '# Fix a bug


    Run tests to demonstrate bug: fix and re-run unit tests.


    # Any successful compile


    Run local unit tests.


    # Each check-in to version control


    Run all module or system tests.


    # Continuously


    A dedicated machine should be running a full build and test, from scratch, automatically
    throughout the day (either periodically or on check-in to version control).


    Note that for larger projects, you might not be able to compile and test the whole
    system in under a few hours. You may only be able to run a full build and test
    overnight. For even larger projects, it might have to be every couple of days—and
    that''s a shame, because the longer the time between automatic builds the longer
    the “feedback gap” between creation of a problem and its identification.


    The reason to have a more-or-less continuous build is that it can identify any
    problems quickly. You don''t want to wait for another developer to stumble upon
    a build problem if you can help it. Having a build machine act as a constant developer
    increases the odds that it will find a problem, instead of a real developer.


    When the build machine does find a problem, then the whole team can be alerted
    to fact that it''s not safe to get any new code just yet, and can continue working
    with what they have. That''s better than getting stuck in a situation where you''ve
    got fresh code that doesn''t work.


    For more information on setting up automatic build and testing systems. nightly
    and continuous builds, and automation in general please see [Cla04].


    # 8.4 Tests and Legacy Code


    So far, we''ve talked about performing unit tests in the context of new code.
    But we haven''t said what to do if your project has a lot of code already—code
    that doesn''t have unit tests.'
