    Validating formatted string data such as e-mail addresses, phone numbers, account
    numbers, or file names is usually straightforward. But what about more complex
    structured data? Suppose you are reading some sort of report data that contains
    a header record linked to some number of data records, and finally to a trailer
    record. How many conditions might we have to test?


    +   - What if there''s no header, just data and a trailer?

    - What if there''s no data, just a header and trailer?

    - What if there''s no trailer, just a header and data?

    - What if there''s just a trailer?

    - What if there''s just a header?

    - What if there''s just data?


    Just as with the simpler e-mail address example, you have to consider what will
    happen if the data does not conform to the structure you think it should.


    And of course, if you are creating something like an e-mail address (possibly
    building it up from different sources) or the structured data above, you want
    to test your result to make sure it conforms.


    # 5.2 Ordering


    Another area to consider is the order of data, or the position of one piece of
    data within a larger collection. For instance, in the largest() example in the
    previous chapter, one bug manifested itself depending on whether the largest number
    you were searching for at the beginning or end of the list.


    That''s one aspect of ordering. Any kind of search routine should be tested for
    conditions where the search target is first or last, as many common bugs can be
    found that way.


    > ¹E-mail addresses are actually complicated. A close reading of RFC822 may surprise
    you.'
