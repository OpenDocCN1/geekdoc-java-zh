  md: '# CHAPTER 7. PROPERTIES OF GOOD TESTS


    Sometimes an entire test method might only test one small aspect of a complex
    production method—you may need multiple test methods to exercise the one production
    method fully.


    Ideally, you''d like to be able to have a traceable correspondence between potential
    bugs and test code. In other words, when a test fails, it should be obvious where
    in the code the underlying bug exists.


    Independent also means that no test relies on any other test; you should be able
    to run any individual test at any time, and in any order. You don''t want to have
    to rely on any other test having run first.


    We''ve shown mechanisms to help you do this: the per-test setup and teardown methods
    and the per-class setup and teardown methods. Use these methods to ensure that
    every test gets a fresh start—and doesn''t impact any test that might run next.


    Remember, you aren''t guaranteed that Unit tests will run in any particular order,
    and as you starting tests and suites in ever-increasing numbers, you really can''t
    afford to carry ordering dependencies along with you.


    > John Donne may have been right about people, but not about unit tests: every
    test should be an island.


    # 7.5 Professional


    ![](img/b707d7ecf5b37c24434a141d9f59b58d_101_0.png)


    The code you write for a unit test is real; some may argue it''s even real than
    the code you ship to customers. This means that it must be written and maintained
    to the same professional standards as your production code. All the usual rules
    of good design—maintaining encapsulation, honoring the DRY principle, lowering
    coupling, etc.—must be followed in test code just as in production code.


    It''s easy to fall into the trap of writing very linear test code; that is, code
    that just plods along doing the same thing over and over again, using the same
    lines of code over and over again, with nari function or object in sight. That''s
    a bad thing. Test code must be written in the same manner as real code. That means
    you need to pull out common, repeated bits'
  merge: -1
