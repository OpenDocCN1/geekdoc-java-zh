  md: '# PAY-AS-YOU-GO SINGLE TEST PHASE


    ![](img/b707d7ecf5b37c24434a141d9f59b58d_26_0.png)


    Figure 1.1: COMPARISON OF PAYING-AS-YOU-GO VS. HAVING A SINGLE TESTING PHASE


    Instead of waiting until the end, it''s far cheaper in the long run to adopt the
    "pay-as-you-go" model. By writing individual tests with the code itself as you
    go along, there''s no crunch at the end, and you experience fewer overall bugs
    as you are generally always working with tested code. By taking a little extra
    all the time, you minimize the risk of needing a huge amount of time at the end.


    You see, the trade-off is not "test now" versus "test later." It''s linear work
    now versus exponential work and complexity trying to fix and rework at the end:
    not only is the job larger and more complex, but now you have to re-learn the
    code you wrote weeks or months ago. All that extra work kills your productivity,
    as shown in Figure 1.1.


    Notice that testing is not free. In the pay-as-you-go model, the effort is not
    zero: it will cost you some amount of effort (and time money). But look at the
    frightening direction the right-hand curve takes over time—your productivity might
    even become negative. These productivity losses can easily doom


    If you think you don''t have time to write tests in addition to the code you''re
    already writing, consider the following questions:'
  merge: -1
  pgno: 26
- img_proc: true
  md: '+   1. How much time do you spend debugging code that you or others have written?


    +   2. How much time do you spend reworking code that you thought was working,
    but turned out to have major, crippling bugs?


    +   3. How much time do you spend isolating a reported bug to its source?


    For most people who work without unit tests, these numbers add up fast, and will
    continue to add up even faster over the life of the project. Proper unit testing
    dramatically reduces these times, which frees up enough time so that you''ll have
    the opportunity to write all of the unit tests you want—and maybe even some free
    time to spare.


    **It takes too long to run the tests** It shouldn’t. Most unit tests should execute
    extremely quickly, so you should be able to run hundreds, thousands of them in
    a matter of a few seconds. But sometimes that won’t be possible, and you may end
    up with certain tests that simply take too long to conveniently run all of the
    time.


    In that case, you''ll want to separate out the longer-running tests from the short
    ones. Only run the long tests once a day, or once every few days as appropriate,
    and run the shorter tests constantly.


    **It''s not my job to test my code** Now here''s an interesting excuse. Pray tell,
    what is your job, exactly? Presumably your job, at least in part, is to create
    working code. If you are throwing code over the wall to some testing group without
    any assurance that it’s working, you''re not doing your job. It’s not polite to
    expect others to clean up after our own messes, and in extreme cases submitting
    large volumes of buggy code can become a “career limiting” move.


    On the other hand, if the testers or QA group find it very difficult to find fault
    with your code, your reputation will grow rapidly—along with your job security!'
