  md: "# EXCUSES For Not Testing\n\nI don't really know how the code is supposed to\
    \ behave\n**I can't test it** If you truly don't know how the code is supposed\
    \ to behave, then maybe this isn't the time to writing it. Maybe a prototype would\
    \ be more appropriate as a first step to help clarify the requirements.\n\nIf\
    \ you don't know what the code is supposed to do, how will you know that it does\
    \ it?\n\n**But it compiles!** Okay, no one really comes out with this as an excuse,\
    \ at not out loud. But it's easy to get lured into thinking that a successful\
    \ compile is somehow a mark of approval, that you've passed some threshold of\
    \ goodness.\n\nThe compiler's blessing is a pretty shallow compliment. I can verify\
    \ that your syntax is correct, but it can't figure out what your code should do.\
    \ For example, the Java compiler can easily determine that this line is wrong:\n\
    \n```\npublic statuc void main(String args[]) {\n\npublic void add(Object anObject){\n\
    \  ArrayList myList = new ArrayList();\n  myList.add(anObject);\n  myList.add(anObject);\n\
    \  // code...\n}\n```\n\nIt's just a simple type, and should be static, not statuc.\
    \ That's the easy part. But now suppose you've written the following:\n\nDid you\
    \ really mean to add the same object to the same list twice? Maybe, maybe not.\
    \ The compiler can't tell the difference, only you know what you've intended the\
    \ code to do.\n\n**I'm being paid to write code, not to write tests** By that\
    \ same logic, you're not paid to spend all day in the debugger, either. Presumably\
    \ you are paid to write working code, and unit tests are merely a tool toward\
    \ that end, in the same fashion as an editor, IDE, or the compiler.\n\n> ²Automated\
    \ testing tools that generate their own tests based on your existing code fall\
    \ into this trap—they can only use what you wrote, not what you mean.\n\n![](img/b707d7ecf5b37c24434a141d9f59b58d_28_0.png)"
