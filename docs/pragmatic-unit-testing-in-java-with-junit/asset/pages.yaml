  md: 'Many Java library methods will throw an exception of some when faced with non-existent
    data. The problem is that it''s hard to debug a generic runtime exception buried
    deep in some library. But an exception that reports "Age isn''t set" makes tracking
    down the problem much easier.


    Most methods will blow up if expected data is not available, and that''s probably
    not what you want them to do. So you test for the condition—see what happens if
    you get a null instead of a CustomerRecord because some search failed. See what
    happens if the file doesn''t exist, or if the network is unavailable.


    Ah, yes: things in the environment can wink out of existence as well—networks,
    files URLs, license keys, users, printers—you name it. All of these things may
    not exist when you expect them to, so be sure to test with plenty of nulls, zeros,
    empty strings and other nihilist trappings.


    Make sure your method can stand up to nothing.


    # 5.6 Cardinality


    Cardinality has nothing to do with either highly-placed religious figures or small
    red birds, but instead with counting.


    Computer programmers (your humble authors included) are really bad at counting,
    especially past 10 when the fingers can no longer assist us. For instance, answer
    the following question quickly, the top of your head, without benefit of fingers,
    paper, or UML:


    > If you''ve got 12 feet of lawn, and each section of fencing is 3 feet wide,
    how many fence posts do you need?


    It''s one of many ways you can end up being "off by one;" an occasionally fatal
    condition that afflicts all programmers from


    ![](img/b707d7ecf5b37c24434a141d9f59b58d_73_0.png)'
  merge: -1
  pgno: 73
- img_proc: true
  md: 'time to time. So you need to think about ways to test how well your method
    counts, and check to see just how many of a thing you may have.


    It''s a related problem to Existence, but now you want to make sure you have exactly
    as many as you need, or that you''ve made exactly as many as needed. In most cases,
    the count of some set of values is only interesting in these three cases:


    +   - Zero

    - One

    - More than one


    It''s called the "0-1-n Rule," and it''s based on the premise that if you can
    handle more than one of something, you can probably handle 10, 20, or 1,000 just
    as easily. Most of the time that''s true, so many of our tests for cardinality
    are concerned with whether we have 2 or more of something. Of course there are
    situations where an exact count makes a difference—10 might be important to you,
    or 250.


    Suppose you are maintaining a list of the Top-Ten food items ordered in a pancake
    house. Every time an order is taken, you have to adjust the top-ten list. You
    also provide the current top-ten list as a real-time data feed to the pancake
    boss''s PDA. What sort of things might you want to test for?


    +   - Can you produce a report when there aren''t yet ten items in the list?

    - Can you produce a report when there are no items on the list?

    - Can you produce a report when there is only one item on the list?

    - Can you add an item when there aren''t yet ten items in the list?

    - Can you add an item when there are no items on the list?

    - Can you add an item when there is only one item on the list?

    - What if there aren''t ten items on the menu?

    - What if there are no items on the menu?'
