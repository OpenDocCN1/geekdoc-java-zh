  md: '# How To Run A JUnit Test


    JUnit is integrated into your IDE, then running a test may be as easy as pressing
    a button and selecting from a list of available test classes.


    Otherwise, you can always execute a TestRunner manually. There are several flavors
    of test runners. To run a GUI version that lets you pick and choose classes (and
    which remembers them from session to session), run the following class:


    ```

    java junit.swingui.TestRunner

    ```


    You''ll probably be able to run the junit.swingui. TestRunner class from your
    IDE. If not, run it from the command line using the jre or java command (as shown).


    To run a test using the textual UI, as we''ve shown in this book, use:


    ```

    java junit.textui.TestRunner classname

    ```


    For instance, to run the unit tests on the facing page we''d compile the Largest
    and the TestLargest programs, then run the TestRunner on TestLargest:


    ```

    javac Largest.java TestLargest.java

    java junit.textui.TestRunner TestLargest

    ```


