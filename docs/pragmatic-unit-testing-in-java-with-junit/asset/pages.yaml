  md: 'It depends on what kind of state that code is in. If it''s reasonably well-factored
    and modular, such that you can get at all of the individual pieces you need to,
    then you can add unit tests fairly easily. If, on the other hand, it''s just a
    “big ball of mud” all tangled together, then it might be close to impossible to
    test without substantial rewriting. Most older projects aren''t perfectly factored,
    but are usually modular enough that you can add unit tests.


    For new code that you write, you''ll obviously write unit tests as well. This
    may mean that you''ll have to expose or break out parts of the existing system,
    or create mock objects in order to test your new functionality.


    For existing code, you might choose to methodically add unit tests for everything
    that is testable. But that''s not very pragmatic. It''s better to add tests for
    the most broken stuff first, to realize a better return on investment of effort.


    The most important aspect of unit tests in this environment is to prevent back-sliding:
    to avoid the death-spiral where maintenance fixes and enhancements cause bugs
    in existing features. We use JUnit unit tests as regression tests during normal
    code development (to make sure new code doesn''t break anything that had been
    working), but regression testing is even more important when dealing with legacy
    code.


    And it doesn''t have to cover the entire legacy code base, just the painful parts.
    Consider the following true story from a pragmatic developer:


