    car (is it in motion or stopped).


    ```

    public void testJamItIntoPark() {

    transmission.shift(DRIVE);

    car.accelerateTo(35);

    assertEquals(DRIVE, transmission.getGear());

    // should silently shift ignore

    transmission.shift(PARK);

    assertEquals(DRIVE, transmission.getGear());

    car.accelerateTo(0); // i.e., stop

    car.brakeToStop();

    // should work now

    transmission.shift(PARK);

    assertEquals(PARK, transmission.getGear());

    }

    ```


    The preconditions for a given method specify what state the world must be in for
    method to run. In this case, the precondition for putting the transmission in
    park is that the car''s engine (a separate component elsewhere in the application''s
    world) would be at a stop. That''s a documented requirement for the method, so
    we want to make sure that the method will behave gracefully (in this particular
    case, just ignore the request silently) in case the precondition is not met.


    At the end of the method, postconditions are those things that you guarantee your
    method will make happen. Direct results returned by the method are one obvious
    to check, but if the method has any side-effects then you need to check those
    as well. In this case, applying the brakes has the side effect of stopping the
    car.


    Some languages even have built-in support for preconditions and postconditions;
    interested readers might want to read about Eiffel in Object-Oriented Software
    Construction [Mey97].


    # 5.5 Existence


    A large number of potential bugs can be discovered by asking the key question
    "does some thing exist?",


    For any value you are passed in or maintain, ask yourself what would happen to
    the method if the value didn''t exist—if it were null, blank, or zero.'
