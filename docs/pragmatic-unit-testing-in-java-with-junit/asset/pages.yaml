  md: '# Chapter 1


    # Introduction


    There are lots of different kinds of testing that can and should be performed
    on a software project. Some of this testing requires extensive involvement from
    the end users; other forms may require teams of dedicated Quality Assurance personnel
    or other expensive resources.


    But that''s not what we''re going to talk about here.


    Instead, we''re talking about unit testing: an essential, if often misunderstood,
    part of project and personal success. Unit testing is a relatively inexpensive,
    easy way to produce better code, faster.


    Many organizations have grand intentions when it comes to testing, but tend to
    only toward the end of a project, when the mounting schedule pressures cause testing
    to be curtailed or eliminated entirely.


    Many programmers feel that testing is just a nuisance: an unwanted bother that
    merely distracts from the real business at hand—cutting code.


    Everyone agrees that testing is needed, in the same way that everyone agrees you
    should eat your broccoli, stop smoking, get plenty of rest, and exercise regularly.
    That doesn''t mean that any of us actually do these things, however.


    But unit testing can be much more than these—while you might consider it to be
    in the broccoli family, we''re here to tell'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'that it''s more like an awesome sauce that makes everthing taste better. Unit
    testing isn''t designed to achieve some corporate quality initiative; it''s not
    a tool for the end-users, or managers, or team leads. Unit testing is done by
    programmers, for programmers. It''s here for our benefit alone, to make our lives
    easier.


    Put simply, unit testing alone can mean the difference between your success and
    your failure. Consider the following short story.


    # 1.1 Coding With Confidence


    Once upon a time—maybe it was last Tuesday—there were two developers, Pat and
    Dale. They were both up against the same deadline, which was rapidly approaching.
    Pat was pumping out code pretty fast; developing class after class and method
    after method, stopping every so often to make sure that the code would compile.


    Pat kept up this pace until the night before the deadline, when it would time
    to demonstrate all this code. Pat ran the top-level program, but didn''t get any
    output at all. Time to step through using the debugger. Hmm. It can''t be right,
    thought Pat. There''s no way that this variable could be zero by now. So Pat stepped
    back through the code, trying to track down the history of this elusive problem.


    It was getting late now. That bug was found and fixed, but Pat found several more
    during the process. And still, there was no output at all. Pat couldn''t understand
    why. It just didn''t make any sense.


    Dale, meanwhile, wasn''t churning out code nearly as fast. Dale would write a
    new routine and a short test to go along with it. Nothing fancy, just a simple
    test to see if the routine just written actually did what it was supposed to do.
    It took a little longer to think of the test, and write it, but Dale refused to
    move on until the new routine could prove itself. Only then would Dale move up
    and write the next routine that called called it, and so on.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'Dale rarely used the debugger, if ever, and was somewhat puz- zled at the picture
    of Pat, head in hands, muttering various evil-sounding curses at the computer
    with wide, bloodshot eyes staring at all those debugger windows.


    The deadline came and went, and Pat didn''t make it. Dale''s code was integrated
    and ran almost perfectly. One little glitch came up, but it was pretty easy to
    see where the problem was. Dale fixed it in just a few minutes.


    Now comes the punch line: Dale and Pat are the same age, and have roughly the
    same coding skills and mental prowess. The only difference is that Dale believes
    very strongly in unit testing, and tests every newly-crafted method before relying
    on or using it from other code.


    Pat does not. Pat "knows" that the code should work as writ- ten, and doesn''t
    bother to try it until most of the code has been written. But by then it''s too
    late, and it becomes very hard to try to locate the source of bugs, or even determine
    what''s working and what''s not.


    # 1.2 What is Unit Testing?


    A unit test is a piece of code written by a developer that ex- erises a very small,
    specific area of functionality of the code being tested. Usually a unit test exercises
    some particular method in a particular context. For example, you might add a large
    value to a sorted list, then confirm this value ap- pears at the end of the list.
    Or you might delete a pattern of characters from a string and then confirm that
    they are gone.


    Unit tests are performed to prove that a piece of code does what the developer
    thinks it should do.


    The question remains open as to whether that''s the right thing to do according
    to the customer and end-user: that''s what ac- cepance testing is for. We''re
    not really concerned with formal validation and verification or correctness just
    yet. We''re re- ally not even interested in performance testing at this point.
    All we want to do is prove code does what we intended, and we want to test very
    small, very isolated pieces of func- tionality. By building up confidence that
    the individual pieces'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# CHAPTER 1. INTRODUCTION


    work as expected, we can then proceed to assemble and test working systems.


    After all, if we aren''t sure the code is doing what we think, then any other
    forms of testing may just be a waste of time. You still need other forms of testing,
    and perhaps much more formal testing depending on your environment. But testing,
    as with charity, begins at home.


    # 1.3 Why Should I Bother with Unit Testing?


    Unit testing will make your life easier. It will make your designs better and
    drastically reduce the amount of time you spend debugging.


    In our tale above, Pat got into trouble by assuming that lower-level code worked,
    and then went on to use that in higher-level code, which was in turn used by more
    code, and so on. Without legitimate confidence in any of the code, Pat was building
    a “house of cards” of assumptions—one little nudge at the bottom and the whole
    thing falls down.


    When basic, low-level code isn''t reliable, the requisite fixes don''t stay at
    the low level. You fix the low level problem, but that impacts code at higher
    levels, which then need fixing, and so on. Fixes begin to ripple throughout the
    code, getting larger and more complicated as they go. The house of cards falls
    down, taking the project with it.


    Pat keeps saying like “that’s impossible” or “I don’t understand how that could
    happen.” If you find yourself thinking these sorts of thoughts, then that’s usually
    a good indication that you don’t have enough confidence in your code—you do not
    know for sure what’s working and what’s not.


    In order to gain the kind of code confidence that Dale has, you’ll need to ask
    the code itself what it is doing, and check that the result is what you expect
    it to be.


    That simple idea describes the heart of unit testing: the single most effective
    technique to better coding.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# WHAT DO I WANT TO ACCOMPLISH? 5


    # 1.4 What Do I Want to Accomplish


    It''s easy to get carried away with unit testing because it''s much fun, but at
    the end of the day we still need to produce production code for customers and
    end-users, so let''s be clear about our goals for unit testing. First and foremost,
    you want to do this to make your life—and the lives of your teammates easier.


    # Does It Do What I Want?


    Fundamentally, you want to answer the question: "Is the code fulfilling my intent?"
    The code might well be doing the wrong thing as far as the requirements are concerned,
    but that''s a separate exercise. You want the code to prove to you that it''s
    doing exactly what you think it should.


    # Does It Do What All of the Time?


    Many developers who claim they do testing only ever write one test. That''s the
    test that goes right down the middle, taking the "one right path" through the
    code where everything goes perfectly.


    But of course, life is rarely that cooperative, and things don''t always go perfectly:
    exceptions get thrown, disks get full, network lines drop, buffers overflow, and—heaven
    forbid—we bugs. That''s the "engineering" part of software development. effects
    of high winds, earthquakes, floods, and so on. Civil engineers must consider the
    load on bridges, the effects of high winds, Electrical engineers plan on frequency
    drift, voltage spikes, noise, even problems with parts availability.


    You don''t test a bridge by driving a car over it right down the middle lane on
    a clear, calm day. That''s not sufficient. Similarly, beyond ensuring the code
    does what you want, you need to ensure the code does what you want all of the
    time, even when the winds are high, the parameters are suspect, the disk is full,
    and the network is sluggish.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Can I Depend On It?


    No one writes perfect code, and that''s okay—as long as you know where the problems
    exist. Many of the spectacular software failures that strand spacecraft on distant
    planets or blow them up in mid-flight could have been avoided simply by knowing
    the limitations of the software. For instance, the Ariane 5 rocket software re-used
    a library from an older rocket that simply couldn''t handle the larger numbers
    of the higher-flying new rocket.¹ It exploded 40 seconds into flight, costing
    $500 million dollars with it into oblivion.


    We want to be able to depend on the code we write, and know for certain both its
    strengths and its limitations.


    For example, suppose you''ve written a routine to reverse a list of numbers. As
    part of testing, you give it an empty list—and the code blows up. The requirements
    don''t say you have to accept an empty list, so maybe you simply document that
    fact in the comment block for the method and throw an exception if the routine
    is called with an empty list. Now you know the limitations of code right away,
    instead of finding the hard way (often somewhere inconvenient, such as in the
    upper atmosphere).


    # Does it Document my Intent?


    One nice side-effect of unit testing is that it helps you communicate the code''s
    intended use. In effect, a unit test behaves as executable documentation, showing
    how you expect the code to behave under the conditions you consider.


