    # 3.7 More on Naming


    Normally, you want tests all of the time. But suppose you thought a bunch of tests
    first, written them, and are now working your way through implementing the code
    required to pass the tests. What about all those new tests that would fail now?


    You can go ahead and write these tests, but you don''t want the testing framework
    to run these tests just yet. Fortunately, most testing frameworks use a naming
    convention to discover tests automatically. When using JUnit in Java, for instance,
    methods whose names start with "test" (as in testMyShop) will be run as tests;
    all you need to do is name the method something else until you''re ready to tackle
    it. If you named pending tests as "pendingTestMyShop", then not only will the
    testing framework ignore it for now, but you could also search for the string
    "pendingTest" throughout your code to find easily any tests you may have missed.
    Of course, the code still has to compile easily; if it''s not ready for that,
    then you should comment out the offending parts.


    What you want to avoid at all costs is the habit of ignoring failing test results.


    # 3.8 JUnit Test Skeleton


    All you really need to write tests using JUnit are just these three things:


    +   1. An import statement to bring in junit.framework.*

    2. An extends statement so your class will inherit from TestCase

    3. A constructor with a call to super(string)'
- md: "\nMany IDE's will supply at least this much for you. Classes written this way\
    \ can be run using a JUnit test runner, and will automatically execute all of\
    \ the test... methods in the class.\n\nBut sometimes it's more convenient to be\
    \ able to run a test class directly, without running it from a JUnit runner. And\
    \ what *were* the names of those methods that ran before and after each test?\n\
    \nWe can make a skeleton that provides all of these features and more pretty easily.\
    \ If this would be helpful for your project, take a look at Appendix C on page\
    \ 131.\n\nNow that you've got a good idea of *how* to write tests, it's time to\
    \ take a closer look at figuring out *what* to test.\n\n## Chapter 4\n\n## What\
    \ to Test: The Right-BICEP\n\nIt can be hard to look at a method or a class and\
    \ try to come up with all the ways it might fail; to anticipate all the bugs that\
    \ might be lurking in there. With enough experience, you start to get a feel for\
    \ those things that are “likely to break,” and can effectively concentrate on\
    \ testing in those areas first. But without a lot of experience, it can be hard\
    \ and frustrating trying to discover possible failure modes. End-users are quite\
    \ adept at finding our bugs, but that’s both embarrassing and damaging to our\
    \ careers! What we need are some guidelines, reminders of areas that might be\
    \ important to test.\n\nLet’s take a look at six areas to test that will strengthen\
    \ your testing skills, using your RIGHT-BICEP:\n\n- **Right** — Are the results\
    \ **right**?\n- **B** — Are all the **boundary** conditions CORRECT?\n- **I**\
    \ — Can you check inverse relationships?\n- **C** — Can you you **cross-check**\
    \ results using other means?\n- **E** — Can you force **error conditions** to\
    \ happen?\n- **P** — Are **performance** characteristics within bounds?\n\n###\
    \ 4.1 Are the Results Right?\n\nThe first and most obvious area to test is simply\
    \ to see if the expected results are right—to validate the results.\n\nWe've seen\
    \ simple data validation already: the Chapter 2 that verify that a method returns\
    \ the largest number from a list.\n\nThese are usually the “easy” tests, and many\
    \ of these sorts of validations may even be specified in the requirements. If\
    \ they aren't, you'll probably need to ask someone. You need to be able to answer\
    \ the key question:\n\n> If the code ran correctly, how would I know?\n\nIf you\
    \ cannot answer this question satisfactorily, then writing the code—or the test—may\
    \ be a complete waste of time. “But wait,” you may say, “that doesn’t sound very\
    \ agile! What if the requirements are vague or incomplete? Does that mean we can't\
    \ write code until all the requirements are firm?\n\nNo, not at all. If the requirements\
    \ are truly not yet known, or complete, you can always invent some as a stake\
    \ in the ground. They may not be correct from the user's point of view, by you\
    \ now know what you think the code should do, and so you can answer the question.\n\
    \nOf course, you must arrange for feedback with users to fine-tune your assumptions.\
    \ The definition of “correct” may change over the lifetime of the code in question,\
    \ but at any point, you should be able to prove that it's doing what you think\
    \ it ought.\n\n### Using Data Files\n\nFor sets of tests with large amounts of\
    \ test data, you might want to consider putting the test values and/or results\
    \ in a separate data file that the unit test reads in. This doesn't need to be\
    \ a very complicated exercise—and you don't even need to use XML. Figure 4-1 on\
    \ the next page is a version of TestLargest that reads in all of the tests from\
    \ a data file.\n\n> This is clearly a joke. XML is mandatory on all projects today,\
    \ isn't it?\n\n### ARE THE Results Right?\n\n```java\nimport junit.framework.*;\n\
    import java.io.*;\nimport java.util.ArrayList;\nimport java.util.StringTokenizer;\n\
    public class LargestDataFile extends TestCase {\n    public TestLargestDataFile(String\
    \ name) {\n        super(name);\n    }\n    /* Run all tests in testdata.txt (does\
    \ not test\n     * We will get an error if any of the\n     * exception goes.\n\
    \     * File I/O goes wrong.\n     */\n    public void testFromFile() throws Exception\
    \ {\n        String line;\n        BufferedReader rdr = new BufferedReader(new\
    \ FileReader(\"testdata.txt\"));\n        while ((line = rdr.readLine()) != null)\
    \ {\n            if (line.startsWith(\"#\")) { // Ignore comments\n          \
    \      continue;\n            }\n            StringTokenizer st = new StringTokenizer(line);\n\
    \            if (!st.hasMoreTokens()) {\n                continue; // Blank line\n\
    \            }\n            // Get the expected value\n            String val\
    \ = st.nextToken();\n            int expected = Integer.valueOf(val).intValue();\n\
    \            // And the arguments to Largest\n            ArrayList argument_list\
    \ = new ArrayList<>();\n            while (st.hasMoreTokens()) {\n           \
    \     argument_list.add(Integer.valueOf(st.nextToken()));\n            }\n   \
    \         // Transfer object list into native array\n            int[] arguments\
    \ = new int[argument_list.size()];\n            for (int i=0; i < argument_list.size();\
    \ i++) {\n                arguments[i] = ((Integer)argument_list.get(i)).intValue();\n\
    \            }\n            // And run the assert\n            assertEquals(expected,\
    \ Largest.largest(arguments));\n        }\n    }\n}\n```\n\nFigure 4-1: LargestDataFile:\
    \ READING FROM A FILE.\n\n## CHAPTER 4. WHAT TO TEST: THE RIGHT-BICEP\n\nIt can\
    \ be hard to look at a method or a class and try to come up with all the ways\
    \ it might fail; to anticipate all the bugs that might be lurking in there. With\
    \ enough experience, you start to get a feel for those things that are “likely\
    \ to break,” and can effectively concentrate on testing in those areas first.\
    \ But without a lot of experience, it can be hard and frustrating trying to discover\
    \ possible failure modes. End-users are quite adept at finding our bugs, but that’s\
    \ both embarrassing and damaging to our careers! What we need are some guidelines,\
    \ reminders of areas that might be important to test.\n\nLet’s take a look at\
    \ six areas to test that will strengthen your testing skills, using your RIGHT-BICEP:\n\
    \n- **Right** — Are the results **right**?\n- **B** — Are all the **boundary**\
    \ conditions CORRECT?\n- **I** — Can you check inverse relationships?\n- **C**\
    \ — Can you you **cross-check** results using other means?\n- **E** — Can you\
    \ force **error conditions** to happen?\n- **P** — Are **performance** characteristics\
    \ within bounds?\n\n### 4.2 Boundary Conditions\n\nIn the previous \"largest number\"\
    \ example, we discovered several boundary conditions: when the largest value was\
    \ at the end of the array, when the array contained a negative number, an empty\
    \ array, and so on.\n\nIdentifying boundary conditions is one of the most valuable\
    \ parts of unit testing, because this is where most bugs live—at the edges. Some\
    \ conditions you might want to think about:\n\n- Totally bogus or inconsistent\
