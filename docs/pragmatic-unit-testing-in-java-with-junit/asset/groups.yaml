    \ You'd type that value into the dialog box:\n\nVariable: CLASSPATH\nVariable\
    \ Value: C:\\java\\junit3.8.1\\junit.jar\n\n![](img/b707d7ecf5b37c24434a141d9f59b58d_145_0.png)\n\
    \nIf you have existing entries in the class path, you may have to restart any\
    \ shell windows or applications to have this change take effect.\n\n## B.2 Does\
    \ it work?\n\nTo tell whether JUnit has been installed properly or not, try to\
    \ compile a source file containing the import statement:\n\n```\nimport junit.framework.*;\n\
    ```\n\nIf that succeeds, then your compiler can find JUnit. You're ready to go!\n\
    \nDon't forget that your test code needs to inherit from JUnit's TestCase base\
    \ class. See the explanation on page 26 for more information.\n\n## Appendix C\n\
    \n## JUnit Test Skeleton\n\nSometimes it can be convenient to add a bit more functionality\
