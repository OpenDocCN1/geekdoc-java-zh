    \ -8, -7] -> -7\n\nIt might look odd, but indeed -7 is larger than -9. Glad we\
    \ straightened out that now, rather in the debugger or production code where it\
    \ might not be so obvious.\n\nTo make all this more concrete, lets actually write\
    \ a \"largest\" method and test it. Here's the code for our first implementation:\n\
    \n```java\npublic class Largest {\n    /**\n     * @ Return the largest element\
