- md: "\n# The Pragmatic Programmers\n\n# Pragmatic Unit Testing\n## In Java with\
    \ JUnit\n\nThe Pragmatic Starter Kit - Volume II\n\n![](img/b707d7ecf5b37c24434a141d9f59b58d_0_0.png)\n\
