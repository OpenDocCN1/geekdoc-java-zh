  - "[PAGE 64]\n\n# Chapter 5\nCORRECT Boundary Conditions\n\nMany bugs in code occur\
    \ around “boundary conditions,” that is, under conditions where the code’s behavior\
    \ may be different from the normal, day-to-day routine.\n\nFor instance, suppose\
    \ you have a function that takes two integers:\n\n```\npublic int calculate(int\
    \ a, int b) {\n    return a / (a + b);\n}\n```\n\nMost of the time, this code\
    \ will return a number just as you expect. But if the sum of a and b happens to\
    \ equal zero, you will get an ArithmeticException instead of a return value. That\
    \ is a boundary condition—a place where things might suddenly go wrong, or at\
    \ least behave differently from your expectations.\n\nTo help you think of tests\
    \ for boundary conditions, we’ll use the acronym CORRECT:\n\n+   - Conformance\
    \ — Does the value conform to an expected format?\n\n+   - Ordering — Is the set\
    \ of values ordered or unordered as appropriate?"
