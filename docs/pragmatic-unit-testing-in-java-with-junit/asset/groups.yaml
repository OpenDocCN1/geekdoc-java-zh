    # 8.2 Test Courtesy


    The biggest difference between testing by yourself and testing with others lies
    in synchronizing working tests and code.


    When with other members of a team, you will be using some sort of version control
    system, such as CVS. (If you aren''t familiar with version control, or would like
    some assistance in getting it up and working correctly, please see [TH03]).


    In a team environment (and even in a personal environment) you should make sure
    that when you check in code (or otherwise make it available to everyone) that
    it has complete unit tests, and it passes all of them. In fact, every test in
    the whole system should continue to pass with your new code.


    The rule is very simple: As soon as anyone else can access your code


    Many teams institute policies to help "remind" developers of the consequences
    of breaking the build, or breaking the tests. These policies might begin by listing
    potential infractions involving code that you have checked in (or otherwise made
    available to other developers):


    +   - Incomplete code (e.g., checking in only one class file forgetting to check
    in other files it may depend upon.


    +   - Code that doesn''t compile.


    +   - Code that compiles, but breaks existing code such that existing code no
    longer compiles.


    +   - Code without corresponding unit tests.


    +   - Code with failing unit tests.


    +   - Code that passes its own tests, but causes other tests elsewhere in the
    system to fail.


    If found guilty of any of these heinous crimes, you may be sentenced to providing
    donuts for the entire team the next morning, or beer or soda, or frozen margaritas,
    or maybe you''ll have'
  - '[PAGE 111]


    # CHAPTER 8. TESTING ON A PROJECT


    to nursemaid the build machine, or some other token. menial task.


    A little lighthearted law enforcement usually provides enough motivation against
    careless accidents. But what happens if you have to make an incompatible change
    to the code, or if you make a change that does cause other tests to fail else-where
    in the system?


    The precise answer depends on the methodology and process you''re using on the
    project, but somehow you need to coordinate-nate changes with the folks who are
    responsible for the other pieces of code—which may well be you! The idea is to
    make all of the necessary changes at once, so the rest of the team sees a coherent
    picture (that actually works) instead of a fragmented, non-functional “work in
    progress.” (For more information on how to use version control to set up experimental
    developer branches, see [TH03])


    Sometimes the real world is not so willing, and it might take a few hours or even
    a few days to work out all of the incompat-ble bits and pieces, during which time
    the build is broken. If it can''t be helped, make sure that it is well-communicated.
    Make sure everyone knows that the build will be broken for the requisite amount
    of time so that everyone can plan around it as needed. If you''re not involved,
    maybe it would be a good time to take your car in for an oil change or slip off
    to the beach for a day or two. If you are involved, get it done quickly so everyone
    else can come back from the beach and get to work!


    # 8.3 Test Frequency


    How often should you run unit tests? It depends on what you''re doing, and your
    personal habits, but here are some general guidelines that we find helpful. You
    want to perform enough testing to make sure you''re catching everything you need
    to catch, but not so much testing that it interferes with producing production
    code.


    # Write a new method


    Compile and run local unit tests.'
- md: "\n# Fix a bug\n\nRun tests to demonstrate bug: fix and re-run unit tests.\n\
    \n# Any successful compile\n\nRun local unit tests.\n\n# Each check-in to version\
    \ control\n\nRun all module or system tests.\n\n# Continuously\n\nA dedicated\
    \ machine should be running a full build and test, from scratch, automatically\
    \ throughout the day (either periodically or on check-in to version control).\n\
    \nNote that for larger projects, you might not be able to compile and test the\
    \ whole system in under a few hours. You may only be able to run a full build\
    \ and test overnight. For even larger projects, it might have to be every couple\
    \ of days—and that's a shame, because the longer the time between automatic builds\
    \ the longer the “feedback gap” between creation of a problem and its identification.\n\
    \nThe reason to have a more-or-less continuous build is that it can identify any\
    \ problems quickly. You don't want to wait for another developer to stumble upon\
    \ a build problem if you can help it. Having a build machine act as a constant\
    \ developer increases the odds that it will find a problem, instead of a real\
    \ developer.\n\nWhen the build machine does find a problem, then the whole team\
    \ can be alerted to fact that it's not safe to get any new code just yet, and\
    \ can continue working with what they have. That's better than getting stuck in\
    \ a situation where you've got fresh code that doesn't work.\n\nFor more information\
    \ on setting up automatic build and testing systems, nightly and continuous builds,\
    \ and automation in general please see [Cl04].\n\n## 8.4 Tests and Legacy Code\n\
    \nSo far, we've talked about performing unit tests in the context of new code.\
    \ But we haven't said what to do if your project has a lot of code already—code\
    \ that doesn't have unit tests.\n\nIt depends on what kind of state that code\
    \ is in. If it's reasonably well-factored and modular, such that you can get at\
    \ all of the individual pieces you need to, then you can add unit tests fairly\
    \ easily. If, on the other hand, it's just a “big ball of mud” all tangled together,\
    \ then it might be close to impossible to test without substantial rewriting.\
    \ Most older projects aren't perfectly factored, but are usually modular enough\
    \ that you can add unit tests.\n\nFor new code that you write, you'll obviously\
    \ write unit tests as well. This may mean that you'll have to expose or break\
    \ out parts of the existing system, or create mock objects in order to test your\
    \ new functionality.\n\nFor existing code, you might choose to methodically add\
    \ unit tests for everything that is testable. But that's not very pragmatic. It's\
    \ better to add tests for the most broken stuff first, to realize a better return\
    \ on investment of effort.\n\nThe most important aspect of unit tests in this\
    \ environment is to prevent back-sliding: to avoid the death-spiral where maintenance\
    \ fixes and enhancements cause bugs in existing features. We use JUnit unit tests\
    \ as regression tests during normal code development (to make sure new code doesn't\
    \ break anything that had been working), but regression testing is even more important\
    \ when dealing with legacy code.\n\nAnd it doesn't have to cover the entire legacy\
    \ code base, just the painful parts. Consider the following true story from a\
    \ pragmatic developer:\n\n### Regression Tests Save the Day\n\n“Tibbert Enterprises¹\
    \ ships multiple applications, all of which are based on a common Lower Level\
    \ Library that is used to access the object database.\n\nOne day I overheard some\
    \ application developers talking about a persistent problem they were having.\
    \ In the product's Lower level interface, you can look up objects using the object\
    \ name, which includes a path to the object. Since the application has several\
    \ layers between it and the Lower Level code, and the Lower Level code has several\
    \ layers to reach the object database, it takes a while to isolate a problem when\
    \ the application breaks.\n\n¹Not their real name.\n\nAfter half of the application\
    \ team spent an entire day tracking down the bug, they discovered the bug in the\
    \ Lower Level code that accessed the database. If you had a space in the name,\
    \ the application died a violent, messy death. After isolating the Lower Level\
    \ code related to the database access, they presented the bug to the owner of\
    \ the code, along with a fix. He thanked them, incorporated their fix, and committed\
    \ the fix into the repository.\n\nBut the next day, the application died. Once\
    \ again, a team of application developers tracked it down. It took only half-a-day\
    \ this time (as they recognized the code paths by now), and the bug was in the\
    \ same place. This time, it was a space in the path to the object that was failing,\
    \ instead of a space in the name itself. Apparently, while integrating the fix,\
    \ the developer had introduced a new bug. Once again, they tracked it down and\
    \ presented him with a fix. It's Day Three, and the application is failing again!\
    \ The developer in question re-introduced the original bug.\n\nThe application\
    \ manager and I sat down and figured out that the equivalent of nearly two months\
    \ of effort had been spent on this issue over the course of one week by his team\
    \ alone (and likely affected other teams throughout the company). We then developed\
    \ API calls that tested the Lower Level calls that the application product was\
    \ using, and added tests for database access spaces in both the object name and\
    \ in the path. We put the product under the control of our continuous-build-and-test\
    \ program (using Cruise-Control) so that the unit tests were run automatically\
    \ every time code committed back to the repository.\n\nSure enough, the following\
    \ week, the test failed on two successive days, at the hands of the original developer.\
    \ He actually came to my office, shook my hand, and thanked me when he got the\
    \ automatic notification that the tests had failed.\n\nYou see, without the tests,\
    \ he wouldn't have known until much later. But with the tests, he found out immediately.\
    \ In fact, this is why we use continuous integration.\n\n## 8.5 Tests and Reviews\n\
    \nTeams that enjoy success often hold code reviews. This can be an informal affair\
    \ where a senior person just gives a quick look at the code. Or perhaps two people\
    \ are working on the code together, using Extreme Programming’s “Pair Programming”\
    \ practice. Or maybe it’s a very formal affair with checklists.\n\nHowever you\
    \ perform code reviews (and we suggest that you do), make the test code an integral\
    \ part of the review process. Since test code is held to the same standards as\
    \ production code, it should be reviewed as well.\n\nIn fact, it can sometimes\
    \ be helpful to expand on the idea of “test-first design” to include both writing\
    \ and reviewing test code before production code. That is, review in this order:\n\
    \n1. Write test cases and/ test code.\n2. Review test cases and/ test code.\n\
    3. Revise test cases and/ test code per review.\n4. Write production code that\
    \ passes the tests.\n5. Review production and test code.\n6. Revise test and production\
    \ code per review.\n\nReviews of the test code are incredibly useful. Not only\
    \ are reviews more effective than testing at finding bugs in the first place,\
    \ but by having everyone involved in reviews you can improve team communication.\
    \ People on the team get to see how others do testing, see what the team's conventions\
    \ are, and keep everyone honest.\n\nYou can use the checklists on page 141 of\
    \ this book to help identify possible test cases in reviews. But don't go overboard\
    \ testing things that aren't likely to break, or repeat essentially similar tests\
    \ over and over just for sake of testing.\n\nFinally, you may want to keep track\
    \ of common problems that come up again and again. These might be areas where\
    \ more training might be needed, or perhaps something else that should be added\
    \ to your standard review checklist.\n\nFor example, at a client's site several\
    \ years ago, we discovered that many of the developers misunderstood exception\
    \ handling. The code base was full of fragments similar to the:\n\n```\ntry {\n\
    \    DatabaseConnection dbc = new DatabaseConnection();\n    insertNewRecord(dbc,\
    \ record);\n    dbc.close();\n} catch (Exception e) {\n```\n\nThat is to say,\
    \ they simply ignored any exceptions that might have occurred. Not only did this\
    \ result in random missed records, but the system leaked database connections\
    \ as well—any error that came up would cause the close to be skipped.\n"
  mdcn: "\n\n# 修复 bug\n\n运行测试以演示 bug：修复并重新运行单元测试。\n\n# 任何成功的编译\n\n运行本地单元测试。\n\n# 每次提交到版本控制\n\
    \n运行所有模块或系统测试。\n\n# 持续地\n\n应该有一台专用机器，在整天时间内自动地从开始运行完整的构建和测试（无论是定期运行，还是在提交到版本控制时运行）。\n\
    \n请注意，对于较大的项目，你可能无法在几小时内编译并测试整个系统。你可能只能在夜间运行完整的构建和测试。对于更大的项目，可能必须每隔几天运行一次——这很遗憾，因为自动构建之间的时间间隔越长，产生问题到发现问题之间的“反馈间隙”就越长。\n\
    \n实施某种持续构建的原因是它可以快速识别任何问题。如果可能的话，你不想等待另一位开发者偶然发现构建问题。让构建机器充当常驻开发者，可以增加它发现问题的概率，而不是让真正的开发者去发现。\n\
    \n当构建机器确实发现问题时，整个团队都会收到通知，知道现在获取任何新代码是不安全的，可以继续使用现有的代码工作。这比陷入新代码无法运行的困境要好。\n\n\
    有关设置自动构建和测试系统、夜间构建和持续构建以及通用自动化更多信息，请参阅 [Cl04]。\n\n## 8.4 测试与遗留代码\n\n到目前为止，我们讨论了在新代码背景下执行单元测试。但我们还没有说，如果你的项目已经有很多代码——即那些没有单元测试的代码——该怎么办。\n\
    \n这取决于这些代码处于什么状态。如果它的重构相当良好且模块化，以至于你可以获取所有需要的各个部分，那么你就可以很轻松地添加单元测试。相反，如果它只是一个纠缠在一起的“大泥球”，那么在在不进行大量重写的情况下可能几乎无法进行测试。大多数旧项目并没有经过完美的重构，但通常具有足够的模块化，允许你添加单元测试。\n\
    \n对于你编写的新代码，你显然也会编写单元测试。这可能意味着你必须暴露或分离现有系统的某些部分，或者创建 mock 对象（模拟对象）来测试你的新功能。\n\n\
    对于现有代码，你可能会选择有计划地为所有可测试的内容添加单元测试。但这并不很务实。先为最混乱的部分添加测试，以实现更高的精力回报率。\n\n在这种环境下，单元测试最重要的方面是防止倒退：避免由于维护修复和增强导致现有功能出现\
    \ bug 的“死亡螺旋”。在正常代码开发期间，我们使用 JUnit 单元测试作为回归测试（以确保新代码不会破坏已经运行正常的功能），但在处理遗留代码时，回归测试更为重要。\n\
    \n而且它不需要覆盖整个遗留代码库，只需要覆盖那些痛苦的部分。考虑以下这个来自一个务实开发者的真实故事：\n\n### 回归测试解了燃\n\n“Tibbert\
    \ Enterprises¹ 交付了多个应用程序，所有程序都基于一个公共底层库（Lower Level Library），该库用于访问对象数据库。\n\n\
    有一天，我无意中听到一些应用程序开发者讨论他们面临的一个持续性问题。在产品的底层接口中，你可以使用对象名称查找对象，名称包含了指向对象的路径。由于应用程序与底层代码之间有几层结构，而底层代码到达对象数据库也有几层结构，因此当应用程序崩溃时，隔离问题需要一段时间。\n\
    \n¹不是他们的真实名称。\n\n在让半个应用程序团队花费了整天时间追踪该 bug 之后，他们在访问数据库的底层代码中发现了这个 bug。如果你在名称中有空格，应用程序就会以剧烈且混乱的方式死亡。在隔离出与数据库访问相关的底层代码后，他们向代码所有者展示了该\
    \ bug 并提供了一个修复方案。他感谢他们，采纳了修复，并将修复提交到了仓库。\n\n但第二天，应用程序又崩溃了。这一次，应用程序开发者团队再次追踪到了它。这次只用了半天（因为他们现在认出了代码路径），而且\
    \ bug 仍在同一个地方。这次是对象路径中的空格导致了失败，而不是名称本身中的空格。显然，在集成修复时，该开发者引入了一个新 bug。他们再次追踪到它并向他提供了一个修复方案。已经是第三天了，应用程序又失败了！相关的开发者重新引入了原始的\
    \ bug。\n\n应用程序经理和我坐下来发现，光是他的团队在这一周内就这个问题上花费了等同于近两个月的工作量（并且很可能影响了整个公司的其他团队）。然后，我们开发了\
    \ API 调用来测试应用程序产品正在使用的底层调用，并针对对象名称和路径中的数据库访问空格添加了测试。我们将产品置于我们的持续构建和测试程序（使用 Cruise-Control）的控制下，这样每当代码提交回仓库时，就会自动运行单元测试。\n\
    \n不出所然，在接下来的周里，测试在原始开发者的手中连续两天失败了。当他收到测试失败的自动通知时，他真的来到我的办公室，握了我的手并向我表示感谢。\n\n\
    你看，如果没有测试，他直到很之后才会知道。但有了测试，他立即发现了。事实上，这就是为什么我们使用持续集成的原因。\n\n## 8.5 测试与审查\n\n成功的团队通常会进行代码审查。这可以是非正式的形式，由一个资深人员快速查看代码。或者可能是两个人一起编写代码，使用极端编程的“结对编程”实践。又或者是一个带有检查列表的正式活动。\n\
    \n无论你如何执行代码审查（我们建议你这样做），都要让测试代码成为审查过程中不可或缺的一部分。由于测试代码遵循与生产代码相同的标准，它也应该被审查。\n\n\
    事实上，将“测试驱动设计”的想法扩展到编写和审查测试代码有时会有帮助。也就是说，按以下顺序进行：\n\n1. 编写测试用例和测试代码。\n2. 审查测试用例和测试代码。\n\
    3. 根据审查修改测试用例和测试代码。\n4. 编写通过测试的生产代码。\n5. 审查生产代码和测试代码。\n6. 根据审查修改生产代码和测试代码。\n\n\
    审查测试代码非常有用。不仅审查在发现问题方面比测试更有效，而且通过让每个人参与可以改善团队沟通。团队成员可以看到他人如何进行测试，了解团队的规范，并保持诚实。\n\
    \n你可以使用本书第 141 页的检查列表来帮助识别审查中可能的测试用例。但不要过度测试不太可能崩溃的东西，或者为了测试而反复进行本质上相似的测试。\n\n\
    最后，你可能想要跟踪反复出现的常见问题。这些可能是需要更多培训的领域，或者可能是应该添加到你的标准审查检查列表中的其他内容。\n\n例如，几年前在一个客户现场，我们发现许多开发者都误解了异常处理。代码库中充满了类似下面的片段：\n\
    \n```\ntry {\n    DatabaseConnection dbc = new DatabaseConnection();\n    insertNewRecord(dbc,\
    \ record);\n    dbc.close();\n} catch (Exception e) {\n```\n\n也就是说，他们只是忽略了任何可能发生的异常。这不仅导致了随机的记录丢失，还导致了系统泄漏数据库连接——任何错误都会导致\
    \ close 操作被跳过。\n\n"
