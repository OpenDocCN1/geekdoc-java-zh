  mdcn: "\n\n# 第2 章\n\n## 你的第一个单元测试\n\n正如我们在引言中所说的，单元测试仅仅是一段代码。它是你编写的一段用来运行另一段代码的代码，并确定另一段代码的行为是否符合预期。\n\
