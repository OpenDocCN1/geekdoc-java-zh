    # ABOUT THE STARTER KIT


    This volume, Pragmatic Unit Testing, is the second volume in the series. Unit
    testing is an essential technique as it provides real-world, real-time feedback
    for developers as we write code. Many developers misunderstand unit testing, and
    don''t realize that it makes our jobs as developers easier. This volume is available
    in two different language versions: in Java with JUnit, and in C# with NUnit.


    Volume III. Pragmatic Automation,¹ covers the essential practices and technologies
    needed to automate your code''s build, test, and release procedures. Few projects
    suffer from having too much time on their hands, so Pragmatic Automation will
    show you how to get the computer to do more of the mundane tasks by itself, freeing
    you to concentrate on the more interesting—and difficult—challenges.


    These books are created in the same approachable style as our first book, and
    address specific needs and problems that you face in the trenches every day. But
    these aren''t dummy-level books that only give you part of the picture; they''ll
    give you enough understanding that you''ll be able to invent your own solutions
    to the novel problems you face that we haven''t addressed specifically.


    For up-to-date information on these and other books, as well as related pragmatic
    resources for developers and managers, please visit us on the web at:


