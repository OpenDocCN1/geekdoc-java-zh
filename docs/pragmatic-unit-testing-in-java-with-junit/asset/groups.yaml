    # Chapter 7


    # Properties of

    Good Tests


    Unit tests are very powerful magic, and if used badly can cause an enormous amount
    of damage to a project by wasting your time. If unit tests aren''t written and
    implemented properly, you can easily waste so much time maintaining and debugging
    the tests themselves that the production code—and the whole project—suffers.


    We can''t let that happen; remember, the whole reason you''re doing unit testing
    in the first place is to make your life easier! Fortunately, there are only a
    few simple guidelines that you need to follow to keep trouble from brewing on
    your project.


    Good tests have the following properties, which makes A-TRIP:


    +   * Automatic

    "* Repeatable

    "* Independent

    * Professional


    Let''s look at what each of these words means to us.'
  - '[PAGE 97]


    # 7.1 Automatic


    Unit tests need to be run automatically. We mean “automatically” in at least two
    ways: invoking the tests and checking the results.


    It must be really easy for you to invoke one or more unit tests, as you will be
    doing it all day long, day in day and day out. So it really can''t be any more
    complicated than pressing one button in the prompt or typing in one command in
    IDEs to run the tests you want. Some IDE can even be set up to run the tests continuously
    in the background.


    It’s important to maintain this environment: don’t introduce a test that breaks
    the automatic model by requiring manual steps. Whatever the test requires (database,
    network connections, etc.), make these an automatic part of the test itself. Mock
    objects, as described in Chapter 6, can help insulate you from changes in the
    real environment.


    But you''re not the only running tests. Somewhere a machine should be running
    all of the unit tests for all checked-in code continuously. This automatic, unattended
    check acts as a “back stop”: a safety mechanism to ensure that whatever is checked
    in hasn''t broken any tests, anywhere. In an ideal world, this wouldn''t be necessary
    as you could count on every individual developer to run all the necessary tests
    themselves.


    But this isn''t an ideal world. Maybe an individual didn''t run some necessary
    test in a remote center of the project. They have some code on their own machine
    that makes it all work—but they haven''t checked that code in, so even though
    the tests work on their own machine, those same tests fail everywhere else.


    You may want to investigate systems such as CruiseControl¹, AntHill², Tinder³.
    These are freely available, open source products that manage continuous building
    and testing. We describe setting up a continuous-build and testing environment
    in Volume III of the Starter Kit [Cla04].


    > ¹http://cruisecontrol.sourceforge.net

    ²http://www.cs.unibo.it/projects/anthill

    ³http://www.mozilla.org/tinderbox.html'
  - '[PAGE 98]


    Finally, by “automatic” we mean that the test must determine for itself whether
    it passed or failed. Having a person (you) or some other hapless victim read through
    the test output and determine whether the code is working or not is a recipe for
    project failure. It''s an important feature of consistent regression to have the
    tests check for themselves. We humans aren''t very good at those repetitive tasks,
    and besides we''ve got more important things to do—remember the project?


    This idea of having the tests run by themselves is critical, because it means
    you don''t have to think about it—it just happens as part of the project. Testing
    can then fulfill its role as a major component of our project''s safety net. (Version
    control and automation are the other two major components of the “safety net.”)
    Tests are there to catch you when you fall, but they''re not in your way. You''ll
    need all of your concentration as you cross today''s high-wire.


    # 7.2 Thorough


    Good units are thorough; they test everything that''s likely to break. But just
    how thorough? At one extreme, you can aim to test every line of code, every possible
    branch the code might take, every exception it throws, and so on. At the other
    extreme, you test the most likely candidates—boundary conditions, missing and
    malformed data, and so on. It''s a question of judgment, based on the needs of
    your project.


    If you want to aim for more complete coverage, then you may want to invest in
    code coverage tools to help. (See, for instance, the freely available “nounit”4
    and “quilt”5 commercial tools, such as Clover, are available well.)


    These tools can help you determine how much of the code under test is actually
    exercised.


    It''s important to realize that bugs are not evenly distributed throughout the
    source code. Instead, they need to clump together in problematic areas (for an
    interesting story about these lines, see the sidebar on the following page).


    ```

    4http://nounit.sourceforge.net

    5http://quilt.sourceforge.net

    ```'
  - '[PAGE 99]


    # Reported Bugs vs. Unit Test Coverage


    We had a client recently that didn''t quite believe in the power of unit tests.
    A few members of the team were very good and disciplined at writing unit tests
    for their own modules, many were somewhat sporadic about it, and a few refused
    to be bothered with unit tests at all.


    As of the hourly build process, we whipped up a simple Ruby script that performed
    a quick-and-dirty analysis of test coverage: it tallied up the ratio of test code
    asserts to production code for each module. Well-tested methods may have 3, 4,
    or more asserts; untested methods will have none at all. This analysis ran with
    every build and produced a bar, ranking the most-tested modules at the top and
    the untested modules at the bottom.


    After a few weeks of gathering figures, we showed the bargain to the project manager,
    without initial explanation. He was very surprised to see all of the "problem
    modules" lumped together at the bottom—he thought we somehow produced this graph
    based on bug reports from QA and customer support. Indeed, the modules at the
    top of the graph (well tested) were nearly unknown to him; very few, if any problems
    had ever been reported against them. But the clump of modules at the bottom (that
    had no unit tests) were very well known to him, the sup-managers, and the local
    drugstore had resorted to stocking extra-large supplies of antacid.


    The results were very nearly linear: the more unit-tested the code, the fewer
    problems.


    This phenomenon leads to the well-known battle cry of "don''t patch it, rewrite
    it." Often, it can be much cheaper and less painful to throw out a piece of code
    that has a clump of bugs and rewrite it from scratch. And of course, it''s much
    safer to rewrite code from scratch now: you''ll have a set of unit tests that
    can confirm the new code works as it should.'
  - '[PAGE 100]


    # 7.3 Repeatable


    Just as every test should be independent from every other test, they must be independent
    of the environment as well. The goal remains that every test should be able to
    run over and over again, in any order, and produce the same results. This means
    that tests cannot rely on anything in the external environment that isn''t under
    your direct control.


    Use mock objects as necessary to isolate the item under test and keep it independent
    from the environment. If you are forced to use some element from the real world
    (a database, perhaps), make sure that you won''t get interference from any other
    developer. Each developer needs their “sandbox” to play in, whether that''s their
    own database instance within Oracle, or their own webserver on some non-standard
    port.


    Without repeatability, you might be in some surprises at the worst moments. What''s
    worse, these sort of surprises are usually bogus—it''s not really a bug, it''s
    just a problem with the test. You can''t afford to waste time chasing down phantom
    problems.


    Each test should produce the same results every time. If it doesn''t, then should
    you tell you that there''s a real bug in the code.


    # 7.4 Independent


    Tests need to be kept neat and tidy, which means keeping them tightly focused,
    and independent from the environment and each other (remember, other developers
    may be running these same tests at the same time).


    When writing tests, make sure that you are only testing one thing at a time.


    Now that doesn''t mean you use only one assert in a test, but that one test method
    should concentrate on a single production method, or a small set of production
    methods that, together, provide some feature.'
