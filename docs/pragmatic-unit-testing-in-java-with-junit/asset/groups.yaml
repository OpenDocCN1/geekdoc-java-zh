    \ as an added bonus.\n\n## 9.3 Testing the Class Invariant\n\nAnother way to improve\
    \ the design of a class is by defining and verifying the “class invariant.”¹¹\n\
    \nA class invariant is an assertion, or some set of assertions, about objects\
    \ of a class. For an object to be valid, all of these assertions must be true.\
    \ They cannot vary.\n\nFor instance, a class that implements a sorted list may\
    \ have the invariant that its contents are in sorted order. That means\n\n> ¹For\
    \ more information on pre-conditions, post-conditions and invariants, see [Mey97].\n\
    \nno matter what else happens, no matter what methods called, the list must always\
    \ be in sorted order—at least as viewed from outside the object. Within a method,\
    \ of course, in invariant may be momentarily violated as the class per-forms whatever\
    \ housekeeping is necessary. But by the time the method returns, or the object\
    \ is otherwise available for use (as in a multi-threaded environment), the invariant\
    \ must hold true or else it indicates a bug.\n\nThat means it's something you\
    \ could check for as part of every unit test for this class.\n\nThe invariant\
    \ is generally an artifact of implementation: inter-counters, the fact that certain\
    \ member variables are pop-ulated, and so on. The invariant is not the place to\
    \ check for user input validation or anything of that sort. When writing tests,\
    \ you want to test just one thing, but at the same time want to make sure the\
    \ overall state of the class is consistent—you want to make sure you have not\
    \ inflicted any collateral damage.\n\nHere are some possible areas where class\
    \ invariants might apply.\n\n### Structural\n\nThe most common invariants are\
    \ structural in nature. That is, they refer to structural properties of data.\
    \ For instance, an an order-entry system you might have invariants such as:\n\n\
    - Every line item must belong to an order\n- Every order must have one or more\
    \ line items\n\nWhen working with arrays of data, you'll typically maintain a\
    \ member variable that acts as an index into the array. The invariants on that\
    \ index would include:\n\n- index must be >= 0\n- index must be < array length\n\
    \nYou want to check the invariant if any of these conditions are likely to break.\
    \ Suppose you are performing some sort of calculation on the index into an array;\
    \ you'd want to check the invariant throughout your unit tests to make sure the\
    \ class is never in an inconsistent state. We showed this in the stack class example\
    \ on page 52.\n\nStructural errors will usually cause the program to throw an\
    \ exception and/or terminate abruptly. For that matter, so will failing the invariant\
    \ check. The difference is that when the invariant is violated, you know about\
    \ it right away—right at the scene of the crime. You'll probably know exactly\
    \ what condition was violated. Without the invariant, the failure may occur from\
    \ the original bug, and backtracking to the cause might take you anywhere from\
    \ a few minutes to a few days.\n\nMore importantly, checking the invariant makes\
    \ sure that you are not passing\n\n### Mathematical\n\nOther constraints are more\
    \ mathematical in nature. For instance, an order-entry system you might have invariants\
    \ such:\n\n- Debits and credits match\n- Amounts measured in\n\n### Consistency\n\
    \nAs it turns out, there are only a handful of common paper sizes in use, but\
