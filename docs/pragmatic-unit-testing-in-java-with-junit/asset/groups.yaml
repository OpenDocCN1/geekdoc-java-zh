    Think about this for a moment before reading on...


    Here are a few environmental things we''ve thought of.


    +   * Running out of memory

    * Running out of disk space

    * Issues with wall-clock time

    * Network availability and errors

    * System load

    * Limited color palette

    * Very high or very low video resolution


    # 4.6 Performance Characteristics


    One area that might prove beneficial to examine performance characteristics—not
    performance itself, but trends as input sizes grow, as problems become more complex,
    and so on.


    What we''d like to achieve is a quick regression test of performance characteristics.
    All too often, we might release one version of the system that works okay, but
    somehow by the next release it has become dead-dog slow. We don''t know why, or
    what change was made, or when, or who did it, or anything. And the end users are
    screaming bloody.


