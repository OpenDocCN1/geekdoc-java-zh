  - '[PAGE 42]


    logic, it''s probably a bad idea. In particular, what you really don''t want to
    see is a whole page of "test" code with a single assertTrue(true) at the very
    end (i.e., "the code made it to the very end without blowing up therefore it must
    work\).

    That''s not testing, that''s wish thinking.


    In addition to testing for true, you can also test for false:


    ```

    assertFalse([String message], boolean condition])

    ```


    Asserts that the given boolean condition is false, otherwise the test fails. The
    message is optional.


    # fail


    ```

    fail([String message])

    ```


    Fails the test immediately, with the optional message. Often used to mark sections
    of code that should not be reached (for instance, after an exception is expected).


    # Using asserts


    You usually have multiple asserts in a given test method, you prove various aspects
    and relationships of the method(s) under test. When an assert fails, that test
    method will be aborted—the remaining assertions in that method will be executed
    this time. But that shouldn''t be of any concern; you have to fix the failing
    test before you can proceed anyway. And you fix the next failing test. And and
    so on.


    You should normally expect that all tests pass all of the time. In practice, that
    means when you introduce a bug, only one or two tests fail. Isolating the problem
    is usually pretty easy in that environment.


    Under circumstances should you continue to add features when there are failing
    tests! Fix any test as soon as it fails, and keep all tests passing all of the
    time.


    To maintain discipline, you''ll need an easy way to run the tests—or to run groups
    of tests, particular subsystems, and so on.'
  - "[PAGE 43]\n\n# 3.3 JUnit Framework\n\nSo far, we've just looked at the assert\
    \ methods themselves. But you can't just stick assert methods into a source file\
    \ and expect it to work; you need a little bit more of a framework than that.\
    \ Fortunately, it's not too much more.\n\nHere is a very simple piece of test\
    \ code that illustrates the minimum framework you need to get started.\n\n```\n\
    import junit.framework.*;\npublic class TestSimple extends TestCase {\n    public\
    \ TestSimple(String name) {\n        super(name);\n    }\n    public void testAdd()\
    \ {\n        assertEquals(2, 1+1);\n    }\n```\n\nThis code is pretty straightforward,\
    \ but let's take a look at each part in turn.\n\nFirst, the import statement on\
    \ line 1 brings in the necessary JUnit classes.\n\nNext, we have the class definition\
    \ on line 3: each class that contains tests must extend TestCase as shown. The\
    \ base class TestCase provides most of the unit-testing functionality that we'll\
    \ need, including all of the assert methods we described above.\n\nThe base class\
    \ requires a constructor that takes a String, so we have to provide a call to\
    \ super that passes in a name. We don't know what name should be just at the moment,\
    \ so we'll just make our own constructor take a String and pass it along on line\
    \ 5.\n\nFinally, the test class contains individual methods named test.... In\
    \ the example, we've got one test method named testAdd on line 9. All methods\
    \ with names that begin with test will be run automatically by JUnit. You can\
    \ also specify particular methods to run by defining a suite method; more on that\
    \ bit later."
