    Many Java library methods will throw an exception of some when faced with non-existent
    data. The problem is that it''s hard to debug a generic runtime exception buried
    deep in some library. But an exception that reports "Age isn''t set" makes tracking
    down the problem much easier.


    Most methods will blow up if expected data is not available, and that''s probably
    not what you want them to do. So you test for the condition—see what happens if
    you get a null instead of a CustomerRecord because some search failed. See what
    happens if the file doesn''t exist, or if the network is unavailable.


    Ah, yes: things in the environment can wink out of existence as well—networks,
    files URLs, license keys, users, printers—you name it. All of these things may
    not exist when you expect them to, so be sure to test with plenty of nulls, zeros,
    empty strings and other nihilist trappings.


    Make sure your method can stand up to nothing.


    # 5.6 Cardinality


    Cardinality has nothing to do with either highly-placed religious figures or small
    red birds, but instead with counting.


    Computer programmers (your humble authors included) are really bad at counting,
    especially past 10 when the fingers can no longer assist us. For instance, answer
    the following question quickly, the top of your head, without benefit of fingers,
    paper, or UML:


    > If you''ve got 12 feet of lawn, and each section of fencing is 3 feet wide,
    how many fence posts do you need?


    It''s one of many ways you can end up being "off by one;" an occasionally fatal
    condition that afflicts all programmers from


