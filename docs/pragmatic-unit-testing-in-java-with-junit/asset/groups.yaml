    \ isn't designed to achieve some corporate initiative; it's not a tool for the\
    \ end-users, or managers, or team leads. Unit testing is done by programmers,\
    \ for programmers. It's here for our benefit alone, to make our lives easier.\n\
    \nPut simply, unit testing alone can mean the difference between your success\
    \ and your failure. Consider the following story.\n\n### 1.1 Coding With Confidence\n\
    \nOnce upon a time—maybe it was last Tuesday—there were two developers, Pat and\
    \ Dale. They were both against the same deadline, which was rapidly approaching.\
    \ Pat was pumping out code pretty fast; developing class after class and method\
    \ after method, stopping every so often to make sure the code would compile.\n\
    \nPat kept up this pace until the night before the deadline, when it would time\
    \ to demonstrate all this code. Pat ran the top-level program, but didn't get\
    \ any output at all. Time to step through using the debugger. Hmm. It can't be\
    \ right, thought Pat. There's no way that variable could be zero by now. So Pat\
    \ stepped back through the code, trying to track down the history of this elusive\
    \ problem.\n\nIt was getting late now. That bug was found and fixed, but Pat found\
    \ several more during the process. And still, there was no output at all. Pat\
    \ couldn't understand why.\n\nDale, meanwhile, wasn't churning out code nearly\
    \ as fast. Dale would write a new routine and a short test to go along with it.\
    \ Nothing fancy, just a simple test to see if the routine just written actually\
    \ did what it was supposed to do. It took a little longer to think of the test,\
    \ and write it, but Dale refused to move on until the new routine could prove\
    \ itself. Only then would Dale move up and write the next routine that called\
    \ it, and so on.\n"
