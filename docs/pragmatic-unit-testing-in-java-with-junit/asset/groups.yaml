    \    }\n}\n```\n\nAlso, now we can see what String parameter to the constructor\
    \ is for: it lets a TestCase return a reference to a named method. We're using\
    \ it to get the two short-running tests to populate our test suite.\n\n## JUNIT\
    \ COMPOSITION 29\n\nYou might want to have a higher-level test that is composed\
