    \ a unit test is just a piece of code. It's a piece of code you write that happens\
    \ to exercise another piece of code, and determines whether the other piece of\
    \ code is behaving as expected or not.\n\nHow do you do that, exactly?\n\nTo check\
    \ if code is behaving as you expect, you use an assertion, a simple method that\
    \ verifies that something is true. For instance, the method assertTrue checks\
