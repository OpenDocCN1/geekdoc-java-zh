    \ that after the next chapter, but first, let's take a more in-depth look at using\
    \ JUnit.\n\n## Chapter 3\n\n## Writing Tests in JUnit\n\nWe've looked at writing\
    \ tests somewhat informally in the last chapter, but now it's time to take a deeper\
    \ look at the difference between test code and production code, all the various\
    \ forms of JUnit's assert, the structure and composition of JUnit tests, and so\
    \ on.\n\n## 3.1 Structuring Unit Tests\n\nWhen writing test code, there are some\
    \ naming conventions you need to follow. If you have a method named createAccount\
    \ that you want to test, then your first test method might be named testCreateAccount.\
    \ The method CreateAccount will call createAccount with the necessary parameters\
    \ and verify that createAccount works as advertised. You can, of course, have\
    \ many test methods that exercise createAccount.\n\nThe relationship between these\
    \ two pieces of code is shown in Figure 3.1 on the following page.\n\nThe test\
    \ code is for our internal use only. Customers or endusers will never see or use\
    \ it. The production code—that is, the code that will eventually be shipped to\
    \ a customer and put into production—must therefore not know anything about the\
    \ test code. Production code will be thrust out into the cold world all alone,\
    \ without the test code.\n\n## CHAPTER 3. WRITING TESTS IN JUNIT\n\n### TestAccount.java\n\
    \n| |\n| :--- |\n| testCreateAccount() |\n| testCreateAcctDef() |\n| testCreateAcctDup()\
    \ |\n| (Internal Only) |\n\n### Account.java\n\n| |\n| :--- |\n| createAccount()\
    \ |\n| (Delivered) |\n\nFigure 3.1: TEST CODE AND PRODUCTION CODE\n\nThe test\
    \ code must be written to do a few things:\n\n- Set up all conditions needed for\
    \ testing (create any required objects, allocate any needed resources, etc.)\n\
    - Call the method to be tested\n- Verify that the method to be tested functioned\
    \ as expected\n- Clean up after itself\n\nYou write test code and compile it in\
    \ the normal fashion, as you would any other bit of source code in your project.\
    \ It might happen to use some additional libraries, but otherwise there's no magic—it's\
    \ just regular code.\n\nThe equals method for native arrays, however, does not\
    \ compare the contents, just the array reference, which is probably not what you\
    \ want.\n\nComputers cannot represent floating-point numbers exactly, and will\
    \ usually be a little bit. Because of this, if you are using an assert to compare\
    \ floating point numbers (floats or doubles in Java), you need to specify one\
    \ piece of information, the tolerance. This specifies just how close to \"equals\"\
    \ you need the result to be. For most business applications, 4 or 5 decimal places\
    \ is probably enough. For scientific apps, you may need much greater precision.\n\
    \n```java\nassertEquals([String message],\nexpected,\nactual,\ntolerance)\n```\n\
    \nFor instance, the following assert will check that the actual result is equal\
    \ to 3.33, but only look at the first two decimal places:\n\n```java\nassertEquals(\"\
    Should be 1/3\", 3.33, 10.0/3.0, 0.01);\n```\n\n## 3.2 Asserts\n\nAs we've seen,\
    \ there are some helper methods that assist you in determining whether condition\
    \ is true, or not. Generically, we use the following:\n\n### assertEquals\n\n\
    ```java\nassertEquals([String message],\n              expected,\n           \
    \   actual)\n```\n\nThis is the most-used form of assert. expected is a value\
    \ you hope to see (typically), and actual is a value actually produced by test.\
    \ message is an optional message that will be reported in event of failure. You\
    \ can omit the message and simply provide the expected and actual values.\n\n\
    Any kind of object may be tested for equality; the appropriate method will be\
    \ used for comparison. In particular, you can compare the contents of strings\
    \ using this method.\n\n### assertNull\n\n```java\nassertNull([String message],\
    \ java.lang.Object object)\nassertNotNull([String message], java.lang.Object object)\n\
    ```\n\nAsserts that the given object is null (or not), failing otherwise. The\
    \ message is optional.\n\n### assertSame\n\n```java\nassertSame([String message],\
    \ expected, actual)\n```\n\nAsserts that expected and actual refer to the same\
    \ object, and fails the test if they do not. The message is optional.\n\n```java\n\
    assertNotSame([String message], expected, actual)\n```\n\nAsserts that expected\
    \ and actual do not refer to the same object, and fails the test if they are the\
    \ same object. The message is optional.\n\n### assertTrue\n\n```java\nassertTrue([String\
    \ message], boolean condition)\n```\n\nAsserts that the given boolean condition\
    \ is true, otherwise the test fails. The message is optional.\n\nIf you find test\
    \ code is littered with the following:\n\n```java\nassertTrue(true);\n```\n\n\
    then you should rightfully be concerned. Unless construct is used to verify some\
    \ sort of branching or exception\n[/content] (Wait, I see I included my thought\
