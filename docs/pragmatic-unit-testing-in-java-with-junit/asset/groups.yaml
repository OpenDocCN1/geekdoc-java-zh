    \ Windows™ operating systems, go down the following menu path:\n\n- Start\n- Settings\n\
    - Control Panel\n- System\n- Advanced Tab\n- Environment Variables...\n\nModify\
    \ the existing CLASSPATH if there is one, or add a new environment variable named\
