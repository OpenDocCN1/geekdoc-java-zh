    # Chapter 1


    # Introduction


    There are lots of different kinds of testing that can and should be performed
    on a software project. Some of this testing requires extensive involvement from
    the end users; other forms may require teams of dedicated Quality Assurance personnel
    or other expensive resources.


    But that''s not what we''re going to talk about here.


    Instead, we''re talking about unit testing: an essential, if often misunderstood,
    part of project and personal success. Unit testing is a relatively inexpensive,
    easy way to produce better code, faster.


    Many organizations have grand intentions when it comes to testing, but tend to
    only toward the end of a project, when the mounting schedule pressures cause testing
    to be curtailed or eliminated entirely.


    Many programmers feel that testing is just a nuisance: an unwanted bother that
    merely distracts from the real business at hand—cutting code.


    Everyone agrees that testing is needed, in the same way that everyone agrees you
    should eat your broccoli, stop smoking, get plenty of rest, and exercise regularly.
    That doesn''t mean that any of us actually do these things, however.


    But unit testing can be much more than these—while you might consider it to be
    in the broccoli family, we''re here to tell'
  - '[PAGE 19]


    that it''s more like an awesome sauce that makes everthing taste better. Unit
    testing isn''t designed to achieve some corporate quality initiative; it''s not
    a tool for the end-users, or managers, or team leads. Unit testing is done by
    programmers, for programmers. It''s here for our benefit alone, to make our lives
    easier.


    Put simply, unit testing alone can mean the difference between your success and
    your failure. Consider the following short story.


    # 1.1 Coding With Confidence


    Once upon a time—maybe it was last Tuesday—there were two developers, Pat and
    Dale. They were both up against the same deadline, which was rapidly approaching.
    Pat was pumping out code pretty fast; developing class after class and method
    after method, stopping every so often to make sure that the code would compile.


    Pat kept up this pace until the night before the deadline, when it would time
    to demonstrate all this code. Pat ran the top-level program, but didn''t get any
    output at all. Time to step through using the debugger. Hmm. It can''t be right,
    thought Pat. There''s no way that this variable could be zero by now. So Pat stepped
    back through the code, trying to track down the history of this elusive problem.


    It was getting late now. That bug was found and fixed, but Pat found several more
    during the process. And still, there was no output at all. Pat couldn''t understand
    why. It just didn''t make any sense.


    Dale, meanwhile, wasn''t churning out code nearly as fast. Dale would write a
    new routine and a short test to go along with it. Nothing fancy, just a simple
    test to see if the routine just written actually did what it was supposed to do.
    It took a little longer to think of the test, and write it, but Dale refused to
    move on until the new routine could prove itself. Only then would Dale move up
    and write the next routine that called called it, and so on.'
