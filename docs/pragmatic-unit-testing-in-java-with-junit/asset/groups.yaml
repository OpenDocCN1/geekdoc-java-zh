- md: "\nSystem.currentTimeMillis() directly. What we need is a slightly cleaner—and\
    \ more object-oriented—way to accomplish the same thing.\n\n## 6.2 Mock Objects\n\
    \nFortunately, there's a testing pattern that can help: mock objects. A mock object\
    \ is simply a debug replacement for a real-world object. There are a number of\
    \ situations that come up where mock objects can help us. Tim Mackinnon [MFC01]\
    \ offers the following list:\n\n- The real object has nondeterministic behavior\
    \ (it produces unpredictable results, like a stock-market quote feed).\n- The\
    \ real object is difficult to set up.\n- The real object has behavior that is\
    \ hard to trigger (for example, a network error).\n- The real object is slow.\n\
    - The real object has (or is) a user interface.\n- The test needs to ask the real\
    \ object about how it was used (for example, a test might need to confirm that\
    \ a callback function was actually called).\n- The real object does not yet exist\
    \ (a common problem when interfacing with other teams or new hardware systems).\n\
    \nUsing mock objects, we can get around all of these problems. The three key steps\
    \ to using mock objects for testing:\n\n1. Use an interface to describe the object\n\
    2. Implement the interface for production code\n3. Implement the interface in\
    \ a mock object for testing\n\nThe code under test only ever refers to the object\
    \ by its interface, so it can remain blissfully ignorant as to whether it is using\
    \ the real object or the mock. Let's take another example. We'll start by creating\
    \ an interface for a number of real-world environmental things, one of which is\
    \ the current time:\n\n```java\npublic interface Environmental {\n    public long\
    \ getTime();\n    // Other methods omitted\n}\n```\n\nNext, we create the implementation:\n\
    \n```java\npublic class SystemEnvironment implements Environmental {\n    public\
    \ long getTime() {\n        return System.currentTimeMillis();\n    }\n    //\
    \ other methods\n}\n```\n\nAnd finally, the mock implementation:\n\n```java\n\
    public class MockSystemEnvironment implements Environmental {\n    public long\
    \ getTime() {\n        return current_time;\n    }\n    public void setTime(long\
    \ aTime) {\n        current_time = aTime;\n    }\n    private long current_time;\n\
    \    // ...\n}\n```\n\nNote that in the mock implementation, we've added the additional\
    \ method `setTime()` (and the corresponding private variable) that allows you\
    \ to control the mock object.\n\nNow suppose we've written a new method that depends\
    \ on `time()` method. Some details are omitted, but the part we are interested\
    \ in looks like this:\n\n```java\nimport java.util.Calendar;\npublic class Checker(Environmental\
    \ anEnv) {\n    Environmental env = anEnv;\n    /**\n     * After 5 o'clock, remind\
    \ people to go home\n     * by playing a whistle\n     */\n    public void reminder()\
    \ {\n        Calendar cal = Calendar.getInstance();\n        cal.setTimeInMillis(env.getTime());\n\
    \        int hour = cal.get(Calendar.HOUR_OF_DAY);\n        if (hour >= 17) {\
    \ // 5:00PM\n            env.playWavFile(\"quit_whistle.wav\");\n        }\n \
    \   }\n    // ...\n    private Environmental env;\n}\n```\n\nIn the production\
    \ environment—the real world that gets shipped to customers—an object of this\
    \ class would be initialized by passing in a real SystemEnvironment. The test\
    \ code, on the other hand, uses a MockSystemEnvironment.\n\nThe code under test\
    \ uses `env.getTime()` doesn't know the difference between a test environment\
    \ and the real environment, as they both implement the same interface. You can\
    \ now write tests that exploit the mock object by setting the time to known values\
    \ and checking for the expected behavior.\n\nIn addition to the `getTime()` call\
    \ that we've shown, the environmental interface also supports a `playWavFile()`\
    \ method (used on line 19 in Checker.java above). With a bit of extra support\
    \ code in our mock object, we can also add tests to see if the `playWavFile()`\
    \ method was called without having to listen to the computer's speaker.\n\n```java\n\
    public void playWavFile(String filename) {\n    playedWav = true;\n}\n\npublic\
