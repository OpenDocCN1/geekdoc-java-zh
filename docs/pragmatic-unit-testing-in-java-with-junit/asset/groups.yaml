    \n至少在感觉上是这样的：这就像是尝试用割草机清理几英亩的土地。如果你在早期开始，此时那里只有一片草地，工作就很简单。如果你等到后期，当地地上长满了粗壮、扭曲的树木和密密缠绕的灌木丛时，这项工作就会变得极其困难。\n\
    \n# 按需付费模式 vs 单一测试阶段\n\n![](img/b707d7ecf5b37c24434a141d9f59b58d_26_0.png)\n\n\
    图 1.1：按需付费模式与单一测试阶段的对比\n\n与其等到最后，从长远来看，采用“按需付费”模型要便宜得多。通过在编写代码的同时编写单独的测试，最后阶段就不会有冲刺压力，而且由于你通常始终在经过测试的代码上工作，你经历的整体\
    \ Bug 也会更少。通过一直多花一点时间，你最大限度地减少了最后需要大量时间的风险。\n\n你要明白，权衡并不是“现在测试”与“以后测试”之间的选择。而是现在进行线性工作，与后期试图修复和重做的指数级工作及复杂性之间的对比：工作不仅更大、更复杂，而且你现在必须重新学习几周或几个月前写的代码。所有这些额外工作都会扼杀你的生产力，如图\
