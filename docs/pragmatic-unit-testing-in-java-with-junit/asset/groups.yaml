  mdcn: "\n\n# Joe 提问...\n\n什么是附带损害（Collateral damage）？\n\n附带损害是指系统某部分的新功能或 Bug 修复导致了另一个可能不相关的系统部分出现\
    \ Bug（损害）。这是一种隐蔽的问题，如果任其持续下去，可能会迅速导致整个系统崩溃到任何人都无法修复的程度。\n\n我们有时把这种现象称为“打地鼠”（Whac-a-Mole）效应。在嘉华会的打地鼠游戏中，玩家必须击中在球场上弹出的机械老鼠。但它们停留不了多久；当你移动去击中其中一只老鼠时，它会缩回去，另一只老鼠会在场地的另一侧弹出。老鼠弹出的速度非常快，尝试击中一个来得分会非常令人沮丧。结果，玩家通常在场地上无力地挥舞，而老鼠却不断在他们最意想不到的地方弹出。\n\
    \n代码库中广泛的附带损害也会产生类似的效果。\n\n### 写测试花费了太多时间\n这是大多数单元测试新手提出的首要抱怨。当然，这并非事实，但为了让你明白为什么我们需要仔细审视你在开发代码时时间花在了哪里。\n\
