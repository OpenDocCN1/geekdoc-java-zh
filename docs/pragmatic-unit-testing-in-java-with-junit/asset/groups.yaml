    \n# Pragmatic Unit Testing in Java\n\n“This book starts out with a nice introduction\
    \ discussing what unit testing is as well as why we should do it. I like the anecdotes\
    \ peppered throughout the book illustrating the point of why one should bother....\
    \ I also really liked the analogies you use. It puts the codes into a real-world\
    \ context.”\n\n- Sharee J. Johnson\nProject Lead, Applications Development\n\n\
    “I wish I had a copy back when I started doing test-first development as part\
    \ of Extreme Programming.”\n\n- Al Koscielny, Software Developer\n\n“I'm not totally\
    \ new to testing, but I've struggled with many aspects of it. I think this book\
    \ does good job of bringing those along who are completely new to unit testing,\
    \ but still has enough advanced material to assist those of us who have dabbled\
    \ in testing and floundered once we hit obstacles.”\n\n- Andrew Thompson,\nConsultant,\
    \ Greenbier & Russel\n\n“When I'm on a project that needs to be doing unit testing\
    \ better (which is often the case), I'd like to have this book available as a\
    \ simple reference to suggest to the team.”\n\n- Bobby Woolf,\nConsulting I/T\
    \ Specialist,\nIBM Software Services for Websphere\n\n“I am a firm believer in\
    \ unit testing and would want all team members I work with to be religiously practicing\
    \ the techniques recommended in this book. I think there is a lot of good, practical\
    \ information in this book that any professional software engineer should be incorporating\
    \ into their daily work.”\n\n- James J. O'Connor III,\nLead System Design Engineer\n\
