    # The Pragmatic Starter Kit Series


    The Pragmatic Starter Kit includes three volumes that introduce the essential
    tools every pragmatic programmer or team needs to be successful.


    +   - Starter Kit Volume I: Pragmatic Version Control

    - Starter Kit Volume II: Pragmatic Unit Testing

    - Starter Kit Volume III: Pragmatic Project Automation


    You are here


    Pragmatic programmers use feedback to drive their development and personal processes.
    The most valuable feedback you can get while coding comes from "unit testing."


    With this book in hand, you will:


    +   - Write better code with fewer bugs

    - Discover the best hiding places where bugs breed, and how to fix them

    - Test pieces of code without using the entire code

    - See how to use JUnit to simplify test code

    - Test effectively with the whole team


    You don''t test a bridge by driving a single car over it right down the middle
    lane on a clear, calm day. Yet many programmers approach testing that way — one
    pass right down the middle and they call it "tested." Pragmatic programmers can
    do better than that!


    Test effectively with the whole team

    This book describes unit testing using the freely-available JUnit library in Java,
    but the techniques can be applied to other languages and frameworks as well. (This
    book is also available in a C# version).


    Real unit testing will make your life easier. It will make your designs better
    and drastically reduce the amount of time spent debugging.


    Andy Hunt and Dave Thomas, partners in The Pragmatic Programmers LLC, develop
    complex software systems for clients and offer pragmatic resources for developers
    and managers. Their first book, "The Pragmatic Programmer: From Jouryman to Master,"
    is a popular overview of techniques and practices that make programming effective
    and enjoyable. Contact the authors via www.pragmaticprogrammer.com


