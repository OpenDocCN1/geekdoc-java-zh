    \n![](img/b707d7ecf5b37c24434a141d9f59b58d_16_0.png)\n\n# Language-specific Versions\n\
    \nAs of this printing, Pragmatic Unit Testing is available in two\nprogramming\
    \ language-specific versions:\n\n- in Java with JUnit\n- in C# with NUnit\n\n\
    # Acknowledgments\n\nWe'd especially like to thank the following Practitioners\
