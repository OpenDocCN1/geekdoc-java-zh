    \ other words, given an array of numbers such as [7, 8, 9], this method should\
    \ return 9. That's a reasonable first test. What other tests can you think of,\
    \ off the top of your head? Take a minute and write down as many tests as you\
    \ can think of for this simple method before you continue reading it.\n\n> Think\
    \ about this for a moment before reading on...\n\nHow many tests did you come\
