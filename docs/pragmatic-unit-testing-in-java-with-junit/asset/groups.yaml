    \ and occasionally-twisted\nwriting: Will Gualtney, Sharee L. Johnson, Eric Kalendra,\
    \ Al\nKoscielny, James J. O'Connor III, Mike Stok, Drew Thompson,\nand Eric Vought.\n\
    \nThanks to all of you for your support.\n\nAndy Hunt and Dave Thomas\nOctober,\
    \ 2003\n\nprprog@pragmatic.com\n\n# Chapter 1\n\n## Introduction\n\nThere are\
    \ lots of different kinds of testing that can be performed. Some of this requires\
    \ extensive involvement from end users; other forms may require dedicated resources.\
    \ But that's not what we're going to talk about. Instead, we're talking about\
    \ unit testing: an essential, if often misunderstood, part of project that leads\
    \ to success.\n\nUnit testing is a relatively inexpensive, easy way to produce\
    \ better code, faster. Many programmers feel that testing is just a nuisance:\
