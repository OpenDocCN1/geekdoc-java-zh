    \ number in the given list\n     */\n    public static int largest(int[] list)\
    \ {\n        int index, max=Integer.MAX_VALUE;\n        for (int index = 0; index\
    \ < list.length-1; index++) {\n            if (list[index] > max) {\n        \
    \        max = list[index];\n            }\n        }\n        return max;\n \
    \   }\n}\n```\n\n![](img/b707d7ecf5b37c24434a141d9f59b58d_32_0.png)\n\nNow that\
    \ we've got some ideas for tests, we'll look at writing these tests in Java, using\
    \ the JUnit framework.\n\n### 2.2 Testing a Simple Method\n\nNormally you want\
    \ to make the first test you write incredibly simple, because there is much to\
    \ be tested the first time besides the code itself: all of that messy business\
