    # Chapter 9


    # Design Issues


    So far we have discussed unit testing as it helps you to understand and verify
    the functional, operational characteristics of your code. But unit testing offers
    several opportunities to improve the design and architecture of your code as well.


    In this chapter, we''ll take a look at the following design-level issues:


    +   - Better separation of concerns by designing for testability

    - Clarifying design by defining class invariants

    - Improving interfaces with test-driven design

    - Establishing and localizing validation responsibilities


    # 9.1 Designing for Testability


    "Separation of Concerns" is probably the single most important concept in software
    design and implementation. It''s the catch-all phrase that encompasses encapsulation,
    orthogonality, coupling, and all the other computer science terms that boil down
    to "write shy code" [HT00].


    You can keep your code well-factored (i.e., "shy") and easier to maintain by explicitly
    designing code to be testable. For example, suppose you are writing a method that
    will sleep until the top of the next hour. You''ve got a bunch of calculations
    and then a sleep():'
  - '[PAGE 119]


    ```

    public void sleepUntilNextHour()

    throws InterruptedException {

    int howlong;


    // Calculate how long to wait...


    Thread.sleep(howlong);

    return;

    }

    ```


    How will you test that? Wait around for an hour? Set a timer, call the method,
    wait for the method to return, check the timer, handle the cases when the method
    doesn''t get called when it should—this is starting to get pretty messy.


    Perhaps you might refactor this method, just to make testing easier. Instead of
    combining the calculation of how many-milliseconds to sleep with the sleep() method
    itself, split them up:


    ```

    public void sleepUntilNextHour()

    throws InterruptedException

    int howlong = millisecondsToNextHour(new Date());

    Thread.sleep(howlong);

    return;

    ```


    What''s likely to break? The system''s sleep call? It''s probably a fair bet to
    say that Java''s Thread.sleep() works as advertised (even if it doesn''t, our
    rule is to always suspect our own code first).


    ```

    assertEquals(10000,

    milliToNextHour(TEST_DATE_10));

    ```


    If we''re confident that millisecondsToNextHour() works to our satisfaction, then
    the order that sleepUntilNextHour() will be reliable as well—if it is not, then
    at least we know that the problem must be related to the sleep itself, and not
    to the numerical calculation. You might even be able to reuse the millisecondsToNextHour()
    method in some other context.


    This is what we mean when we claim that you can improve the design of code by
    making it easier to test. By changing'
  - '[PAGE 120]


    code so that you can get in there and test it, you''ll end up

    with a cleaner design that''s easier to extend and maintain as

    well as test.


    But instead of boring you with examples and techniques, all

    y really need to do remember this fundamental ques-

    tion when writing code:


    **How am I going to test this?**


    If the answer is not obvious, or if it looks like the test would

    ugly or hard to write, then take that as a warning signal. Your

    design probably needs to be modified: change things around

    until the code is easy to test, and your design will end up

    being far better for the effort.


