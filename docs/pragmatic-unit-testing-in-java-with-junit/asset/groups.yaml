    \ 7, 8] -> 9\n\nWhat happens if there are duplicate largest numbers?\n\n- [7,\
    \ 9, 8, 9] -> 9\n\nSince these are int types, not objects, you probably don't\
    \ care which 9 is returned, as long as one of them is.\n\nWhat if there's only\
