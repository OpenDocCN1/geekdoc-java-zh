    \ 6.2 模拟对象 (Mock Objects)\n\n幸运的是，有一种测试模式可以帮助我们：模拟对象（mock objects）。模拟对象仅仅是真实世界对象的调试替代品。在很多情况下，模拟对象都能帮我们解决问题。Tim\
    \ Mackinnon [MFC01] 提供了以下列表：\n\n- 真实对象具有非确定性行为（它会产生不可预测的结果，例如股票报价行情馈）。\n- 真实对象难以设置。\n\
    - 真实对象具有难以触发的行为（例如，网络错误）。\n- 真实对象很慢。\n- 真实对象有（或本身就是）用户界面。\n- 测试需要询问真实对象它是如何被使用的（例如，测试可能需要确认回调函数是否真的被调用了）。\n\
    - 真实对象尚不存在（在与其他团队或新硬件系统接口时的常见问题）。\n\n通过使用模拟对象，我们可以解决所有这些问题。使用模拟对象进行测试的三个关键步骤：\n\
    \n1. 使用接口来描述对象\n2. 为生产代码实现该接口\n3. 在模拟对象中实现该接口用于测试\n\n被测代码始终通过其接口引用对象，因此它可以完全无知地不知道它使用的是真实对象还是模拟对象。让我们来看另一个例子。我们首先为一些真实世界的环境事物创建一个接口，其中之一是当前时间：\n\
    \n```java\npublic interface Environmental {\n    public long getTime();\n    //\
    \ 其他方法省略\n}\n```\n\n接下来，我们创建实现：\n\n```java\npublic class SystemEnvironment implements\
    \ Environmental {\n    public long getTime() {\n        return System.currentTimeMillis();\n\
    \    }\n    // 其他方法\n}\n```\n\n最后，是模拟实现：\n\n```java\npublic class MockSystemEnvironment\
    \ implements Environmental {\n    public long getTime() {\n        return current_time;\n\
    \    }\n    public void setTime(long aTime) {\n        current_time = aTime;\n\
    \    }\n    private long current_time;\n    // ...\n}\n```\n\n注意，在模拟实现中，我们添加了额外的方法\
    \ `setTime()` 以及相应的私有变量，这允许你控制模拟对象。\n\n现在假设我们写了一个依赖于 `time()` 方法的新方法。省略了一些细节，但我们感兴趣的部分看起来如下：\n\
    \n```java\nimport java.util.Calendar;\npublic class Checker(Environmental anEnv)\
    \ {\n    Environmental env = anEnv;\n    /**\n     * 5点后，通过吹哨子\n     * 提醒人们回家\n\
    \     */\n    public void reminder() {\n        Calendar cal = Calendar.getInstance();\n\
    \        cal.setTimeInMillis(env.getTime());\n        int hour = cal.get(Calendar.HOUR_OF_DAY);\n\
    \        if (hour >= 17) { // 下午 5:00\n            env.playWavFile(\"quit_whistle.wav\"\
    );\n        }\n    }\n    // ...\n    private Environmental env;\n}\n```\n\n在生产环境中——交付给客户的真实世界中——该类的对象将通过传入一个真实的\
    \ `SystemEnvironment` 来初始化。而测试代码则使用 `MockSystemEnvironment`。\n\n被测代码使用 `env.getTime()`，它不知道测试环境和真实环境之间的区别，因为它们都实现了相同的接口。你现在可以通过将时间设置为已知值并检查预期行为来编写利用模拟对象的测试。\n\
    \n除了我们展示的 `getTime()` 调用外，环境接口还支持 `playWavFile()` 方法（在上面 Checker.java 的第19行中使用）。通过我们的模拟对象中添加额外的支持代码，我们还可以添加测试来查看\
    \ `playWavFile()` 方法是否被调用，而无需听电脑的扬声器。\n\n```java\npublic void playWavFile(String\
    \ filename) {\n    playedWav = true;\n}\n\npublic boolean wavPlayed() {\n    return\
