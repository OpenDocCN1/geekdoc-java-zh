    \ design, and take it one step at a time.\n\n**Answer 8:** Here's a possible scenario\
    \ of steps you might take. There is no right answer: this exercise is simply to\
    \ get you to think about test-first design.\n\n+   1. Begin by simply calculating\
    \ the days between any two dates first. The tests might include:\n    - Use the\
    \ same value for first date and last date.\n    - Try the normal case where first\
    \ date < last date.\n    - Try the error case where first date > last date.\n\
    \    - Try dates that span a year boundary (from October 1 2003 to March 1, 2004\
    \ for instance).\n    - Try dates more than a year apart (from October 1 2003\
    \ to December 1, 2006).\n2. Next, exclude weekends from the calculation, using\
    \ the same sorts of tests.\n3. Now exclude public and/or corporate holidays. This\
    \ raises a potentially interesting question: how do you specify holidays? You\
