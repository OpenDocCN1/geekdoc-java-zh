    \n图 9.3：重构后的菜谱静态类图\n\n主 GUI 类 RecipeGUI（以前被称为 Recipes）现在应该只包含面向 GUI 的代码：小部件、回调函数等。因此，所有的“业务逻辑”和文件\
    \ I/O 都可以放在非 GUI 的、完全测试的类中。\n\n作为额外奖励，我们获得了一个清晰的设计。\n\n## 9.3 测试类不变性\n\n改进类设计的另一种方法是定义并验证“类不变性（class\
    \ invariant）”。¹¹\n\n类不变性是关于类对象的某个断言（或一组断言）。要使一个对象有效，所有这些断言必须为真。它们不能改变。\n\n例如，一个实现排序列表的类可能具有如下不变性：其内容是按顺序排列的。这意味着\n\
    \n> ¹关于先置条件、后置条件和不变性的更多信息，请参见 [Mey97]。\n\n无论发生其他什么，无论调用了什么方法，列表必须始终保持排序状态——至少从对象的外部来看是这样的。当然，在方法内部，当类执行任何必要的清理工作时，不变性可能会暂时被违反。但在方法返回或对象以其他方式可用时（例如在多线程环境中），不变性必须保持有效，否则将表明存在\
    \ bug。\n\n这意味着你可以作为该类每个单元测试的一部分来检查这一点。\n\n不变性通常是实现过程的产物：计数器之间的关系、某些成员变量已被填充等。不变性不是检查用户输入验证或类似内容的地方。在编写测试时，你只想测试一件事，但同时想确保类的整体状态是一致的——你想确保自己没有造成任何附带损害。\n\
    \n以下是类不变性可能应用的一些领域。\n\n### 结构性\n\n最常见的不变性是结构性的。也就是说，它们指的是数据的结构属性。例如，在一个订单输入系统中，你可能会有如下不变性：\n\
