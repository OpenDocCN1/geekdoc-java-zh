    \    public void assertEquals(Money amount) {\n        assertEquals(\"\", amount);\n\
    \    }\n}\n```\n\n> DRY 代表“不要重复自己”（Don't Repeat Yourself）。这是一项基础技术，它要求系统中的每一部分知识都有一个唯一的、无歧的表示。\n\
    \n注意，我们提供了两种形式的断言：一个接收 `String`，另一个不接收。同样注意，你这样做并没有复制任何代码；你只是倾向于调用。现在，项目中的所有其他测试类都将继承这个基类，而不是直接继承\
    \ `TestCase`：\n\n```java\npublic class TestSomething extends ProjectTest {\n```\n\
    \n![](img/b707d7ecf5b37c24434a141d9f59b58d_50.png)\n\n事实上，在启动新项目时，始终继承你的自定义基类而不是直接继承\
    \ JUnit，通常是一个好主意——即使它最初没有添加任何功能。这样，当你需要添加每个测试类都需要的方法或功能时，你只需要将其添加到基类中即可，而无需编辑项目中的每个测试用例。\n\
    \n## 3.6 JUnit 与异常\n\n我们可能感兴趣的异常有两种：\n\n- 1. 测试产生的预期异常\n- 2. 产生某些严重错误时的非预期异常\n\
    \n第 3 章在 JUNIT 中编写测试\n\n与你可能想的相反，异常实际上是好事——它们告诉我们出问题了。有时在测试中，我们希望方法抛出异常。考虑一个名为\
    \ `sortList()` 的方法。如果传递了 `null`，它应该抛出异常。我们必须显式地测试这一点。\n\n```java\npublic void\
