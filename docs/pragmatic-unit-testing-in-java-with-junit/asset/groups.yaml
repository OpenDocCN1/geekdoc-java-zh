    # Chapter 8


    # # Testing on a Project


    Up to now we''ve talked about testing as an individual, solitary exercise.

    But of course, in the real world you''ll likely have teammates to work with. You''ll
    all be unit testing together, and that brings up a couple of issues.


    #  8.1 Where to Put Test Code


    On a small, one-person project, the location of test code and encapsulation of
    the production code may not be very important, but on larger projects it can become
    a critical issue. There are several different ways of structuring your production
    and test code that we''ll look at.


    In general, you don''t want to break any encapsulation for the sake of testing
    (or as Mom used to say, "don''t expose your privates!"). Most of the time, you
    should be able to test a class by exercising its public methods. If there is significant
    functionality that is hidden behind private or protected access, that might be
    a warning sign that there''s another class in there struggling to get out. When
    push comes to shove, however''s probably better to break encapsulation with working,
    tested code than it is to have good encapsulation of untested, non-working code.


    In Java, classes in the same package can have access to each others'' protected
    member variables and methods; you'
  - "[PAGE 107]\n\ncan exploit this feature to allow some non-public access us-ing\
    \ of the schemes that follow.\n\n# Same directory\n\nSuppose you are writing a\
    \ class named:\n\n```\ncom.pragprog.wibble.Account\n```\n\nwith a corresponding\
    \ test in:\n\n```\ncom.pragprog.wibble.TestAccount\n```\n\nThe first and easiest\
    \ method of structuring test code is to sim-clude it right in the same directory\
    \ alongside the produc-ion code.\n\n```\ncom/\n  └── pragprog/\n      └── wibble/\n\
    \          ├── Account.java\n          └── TestAccount.java\n```\n\nThis has the\
    \ advantage that TestAccount can access pro-cted member variables and methods\
    \ of Account. But the disadvantage is that the test code is lying around, cluttering\
    \ up the production code directory. This may or may not be a problem depending\
    \ on your IDE/compiler and your method of creating a release to ship to customers.\n\
    \nMost of the time, it's enough of a problem that we prefer one of the other solutions.\
    \ But for small projects, this might be sufficient.\n\n# Subdirectories\n\nThe\
    \ next option is to create test subdirectories under every production directory.\n\
    \n```\ncom/\n  └── pragprog/\n      └── wibble/\n          ├── Account.java\n\
    \          └── test/\n              └── TestAccount.java\n```"
  - "[PAGE 108]\n\nThis has the advantage of moving the test code a little bit out\
    \ of the way—not too far, but at least not in the same directory as the production\
    \ code. The disadvantage is now that the test code is in a different package:\
    \ TestAccount is now in com.pragprog.wibble.test.TestAccount. You won't be able\
    \ to access protected members unless your test code uses a subclass of the production\
    \ code that exposes the necessary members. For instance, suppose the class you\
    \ want to test looks this:\n\n```\npackage com.acme;\npublic class Pool {\n  \
    \  protected Date lastCleaned;\n    public void clear() {\n}\n}\n```\n\nYou need\
    \ to get at non-public bit of data that tells you when the pool was last cleaned\
    \ for testing, but there's no accessor for it (If there were, the pool association\
    \ would surely use us; they don't like to make that information public.) So you\
    \ make a subclass in the test subpackage that exposes it for testing.\n\n```\n\
    package com.acme.test;\nimport com.acme.Pool;\npublic class PoolForTesting extends\
    \ Pool {\n    public Date getLastCleaned() {\n        return lastCleaned;\n  \
    \  }\n}\n```\n\nYou then use PoolForTesting in the test code instead of using\
    \ Pool directly (see Figure 8.1 on the next page). In fact, you could make this\
    \ special class private to the test code (to ensure that we don't get sued.\n\n\
    # Parallel Trees\n\nAnother option is to place your Test classes into the same\
    \ package as your production code, but in a different code tree. The trick is\
    \ to ensure that the root of both trees is in the compiler's CLASSPATH. In this\
    \ case, both prod and test should be in the CLASSPATH."
