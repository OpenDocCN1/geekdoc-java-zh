    # 第 7 章 良好测试的属性


    有时，整个测试方法可能只测试了复杂生产方法的一个微小方面——你可能需要多个测试方法来充分地执行这一个生产方法。


    理想情况下，你希望能够在潜在 Bug 和测试代码之间建立一种可追溯的对应关系。换句话说，当测试失败时，应该显而易见底层 Bug 存在代码的哪里。


    独立性也意味着没有任何测试依赖于任何其他测试；你应该能够在任何时间、以任何顺序运行任何单独的测试。你不希望依赖于任何其他测试必须先运行。


    我们已经展示了可以帮助你实现此点的机制：每个测试的设置（setup）和拆卸场（teardown）方法，以及每个类的设置和拆卸场方法。使用这些方法来确保每个测试都有一个全新的开始——并且不会影响后续可能运行的任何测试。


    记住，你无法保证单元测试会以特定的顺序运行，而且随着你开始的测试和测试套件数量不断增加，你真的无法负担起带着顺序依赖的代价。


    > 约翰·多纳（John Donne）对人的看法可能是正确的，但对单元测试可能不是：每个测试都应该是一座孤岛。


    ## 7.5 专业


    ![](img/b707d7ecf5b37c24434a141d9f59b58d_101_0.png)


    你为单元测试编写的代码是真实的；有些人可能会认为甚至比你交付给客户的代码更真实。这意味着它必须按照与生产代码相同的专业标准进行编写和维护。良好设计的所有常规规则——维护封装、遵循
    DRY（不要重复自己）原则、降低耦合等——在测试代码中必须像在生产代码中一样被遵守。


    很容易陷入编写非常线性测试代码的陷阱；即代码只是在平调地重复地做相同的事情，反复地使用相同的行代码，而视野内没有任何函数或对象。这是一件坏事。测试代码必须以与真实代码相同编写。这意味着你需要提取出常见的、重复的代码片段，并将该功能放入方法中，这样它就可以从几个不同的地方调用了。


    你可能会发现自己积累了几个相关的测试方法，它们应该被封装在一个类中。不要抗拒！尽管创建一个新类吧，即使它仅用于测试。这不仅是可以的，而且是被鼓励的：测试代码就是真实代码。在某些情况下，你可能甚至需要创建一个更大的框架，或者创建一个数据驱动的测试设施（记得第
    39 页用于 TestLargest 的简单文件读取器吗？）。


    不要浪费时间测试那些对你没有帮助的方面。记住，你不想为了创建测试而创建测试。测试代码必须是彻底的，即测试可能包含 Bug 的方法的所有有趣之处。如果它可能包含
    Bug，就不要麻烦测试。这意味着通常你不应该浪费时间测试像简单的访问器（accessors）这样的东西：


    ```java

    public Money getBalance() {

    return balance;

    }

    ```


