- md: "\ndo if there is no \"@\" sign? Will it work? Throw runtime exception? Is this\
    \ boundary condition you need to consider?¹\n\nValidating formatted string data\
    \ such as e-mail addresses, phone numbers, account numbers, or file names is usually\
    \ straightforward. But what about more complex structured data? Suppose you are\
    \ reading some sort of report data that contains a header record linked to some\
    \ number of data records, and finally to a trailer record. How many conditions\
    \ might we have to test?\n\n- What if there's no header, just data and a trailer?\n\
    - What if there's no data, just a header and trailer?\n- What if there's no trailer,\
    \ just a header and data?\n- What if there's just a trailer?\n- What if there's\
    \ just a header?\n- What if there's just data?\n\nJust as with the simpler e-mail\
    \ address example, you have to consider what will happen if the data does not\
    \ conform to the structure you think it should.\n\nAnd of course, if you are creating\
    \ something like an e-mail address (possibly building it up from different sources)\
    \ or the structured data above, you want to test your result to make sure it conforms.\n\
    \n## 5.2 Ordering\n\nAnother area to consider is the order of data, or the position\
    \ of one piece of data within a larger collection. For instance, in the largest()\
    \ example in the previous chapter, one bug manifested itself depending on whether\
    \ the largest number you were searching for at the beginning or end of the list.\n\
    \nThat's one aspect of ordering. Any kind of search routine should be tested for\
    \ conditions where the search target is first or last, as many common bugs can\
    \ be found that way.\n\n> ¹E-mail addresses are actually complicated. A close\
    \ reading of RFC822 may surprise you.\n\n# CHAPTER 5. CORRECT BOUNDARY CONDITIONS\n\
    \nFor another aspect of ordering, suppose you are writing a method that is passed\
    \ a collection containing a restaurant order. You would probably expect that the\
    \ appetizers appear first in the order, followed by the salad (and that all-important\
    \ dressing choice), then the entree and finally a decadent dessert involving lots\
    \ of chocolate.\n\nWhat happens to your code if the dessert is first, and the\
    \ entree is last?\n\nIf there's a chance that sort of thing can happen, and if\
    \ it's the responsibility of your method to deal with it if it does, then you\
    \ need to test for this condition and address the problem. Now, it may be that\
    \ this is not something your method needs to worry about. Perhaps this needs to\
    \ be addressed at the user input level (see “Testing Invalid Parameters” later\
    \ on).\n\nIf you're writing a sort routine, what might happen if the set of data\
    \ is already ordered? Or worse, sorted in precisely reverse order? Ask yourself\
    \ if that could cause trouble—if these are conditions that might be worst, too.\n\
    \nIf you are supposed to maintain something in order, check for example, if your\
    \ method is part of the GUI that is sending the dinner order back to the kitchen,\
    \ you should have a test that verifies the items are in the correct serving order:\n\
    \n```java\npublic void testKitchenOrder() {\n    Order order = new Order();\n\
    \    FoodItem dessert = new Dessert(\"Chocolate Souffle\");\n    FoodItem entree\
    \ = new Entree(\"Beef Oscar\");\n    FoodItem salad = new Salad(\"Tossed\", \"\
    Parmesan Peppercorn\");\n    // Add out of order\n    order.addFoodItem(dessert);\n\
    \    order.addFoodItem(entree);\n    order.addFoodItem(salad);\n    // But should\
    \ come out in serving order\n    Iterator itr = order.iterator();\n    assertEquals(salad,\
    \ itr.next());\n    assertEquals(entree, itr.next());\n    assertEquals(dessert,\
    \ itr.next());\n    // No more left\n    assertFalse(itr.hasNext());\n}\n```\n\
    \nOf course, from a human standpoint, you'd need to modify the code so that it\
    \ is flexible enough to allow people to eat their ice cream first, if so desired.\
    \ In which case, you'd need to add a test to prove your four-year old nephew's\
    \ ice cream comes with everyone else's salads, but Grandma's ice cream comes at\
    \ the end with your cappuccino.\n\n## 5.3 Range\n\nRange is a convenient catch-all\
    \ word for the situation where a variable's type allows it to take on a wider\
    \ range of values than you need—or want. For instance, a person's age is typically\
    \ represented as an integer, and no one has ever lived to be 200,000 years old,\
    \ even though that's a perfectly valid integer value. Similarly, there are only\
    \ 360 degrees in a circle, even though degrees are commonly stored in an integer.\n\
    \nIn good object oriented design, you do not use a raw native type (e.g., an int\
    \ or Integer) to store a bounded-integer value such as an age, or a compass heading.\n\
    \n```java\n/**\n * Compass bearing\n */\npublic class Bearing {\n    protected\
    \ int bearing; // 0..359\n    /**\n     * Initialize a bearing to a value from\
    \ 0..359\n     */\n    public Bearing(int num_degrees) {\n        if (num_degrees\
    \ < 0 || num_degrees > 359) {\n            throw new RuntimeException(\"Bad bearing\"\
    );\n        }\n        bearing = num_degrees;\n    }\n    /**\n     * Return the\
    \ angle between bearing and another.\n     * May be negative.\n     */\n    public\
    \ int angleBetween(Bearing another) {\n        return bearing - another.bearing;\n\
    \    }\n}\n```\n\nNote that the angle returned is just an int, as we are not placing\
    \ any range restrictions on the result (it may be negative, etc.).\n\nBy encapsulating\
    \ the concept of a bearing within a class, you've now got one place in the system\
    \ that can filter out bad data. You cannot create a Bearing object with out of\
    \ range values. Thus, the rest of the system can use Bearing objects and be assured\
    \ that they contain only reasonable values.\n\nOther ranges may not be as straightforward.\
    \ For instance, suppose you have a class that maintains sets of x, y coordinates.\
    \ These are just integers, with arbitrary values, but the constraint on the range\
    \ is such that the two points must describe a rectangle with no side greater than\
    \ 100 units. Then, the allowed range of values for both x, y pairs is interdependent.\
    \ You'll want a range test for any method that can affect a coordinate to ensure\
    \ that the resulting range of the x, y pairs remains legitimate. For more information\
    \ on this topic, see “invariants” in the Design Issues chapter on page 101.\n\n\
    Since you will likely call this from a number of different tests, it probably\
    \ makes sense to make a new assert method:\n\n```java\npublic static final int\
    \ MAX_DIST = 100;\npublic void assertFairRange(String message, Point one, Point\
    \ two) {\n    assertTrue(Math.abs(one.x - two.x) <= MAX_DIST);\n    assertTrue(Math.abs(one.y\
    \ - two.y) <= MAX_DIST);\n}\n```\n\nBut the most common ranges you'll want to\
    \ test probably depend on data structure issues, not application constraints.\
    \ Take a simple example like a stack class using an array:\n\n```java\nclass MyStack\
    \ {\n    public MyStack() {\n        stack = new String[100];\n        next_index\
    \ = 0;\n    }\n    public String pop() {\n        return stack[--next_index];\n\
    \    }\n    // Delete n items from the stack\n    public void delete(int n) {\n\
    \        next_index -= n;\n    }\n    public void push(String aString) {\n   \
    \     stack[next_index++] = aString;\n    }\n    public String top() {\n     \
    \   return stack[next_index-1];\n    }\n\n    private int next_index;\n    private\
    \ String[] stack;\n\n    public void checkInvariant() throws InvariantException\
    \ {\n        // JDK 1.4 can use assert() instead\n        if (!next_index >= 0\
    \ && next_index < stack.length()) {\n            throw new InvariantException(\"\
    \ + next_index + \" out of range: \" + next_index + \" for stack length \" + stack.length());\n\
    \        }\n    }\n}\n```\n\nThere are some potential bugs lurking here, as there\
    \ are no checks at all for an empty stack or a stack overflow. However manipulate\
    \ the index variable next.index. one thing is supposed to be always true: (next.index\
    \ >= 0 && next.index < stack.length). We'd like to check to make sure this expression\
    \ is true.\n\nNow both next_index and stack are private variables; you don't want\
    \ to have to expose them just for the sake of testing. There are several ways\
    \ around this problem; for now we'll just make a special method in MyStack named\
    \ checkInvariant():\n\nNow a test method can call checkInvariant() to ensure that\
    \ nothing has gone awry inside the guts of the stack class, with having direct\
    \ access to those same guts.\n\n```java\nimport junit.framework.*;\npublic class\
    \ TestMyStack extends TestCase {\n    public void testEmpty() throws InvariantException\
    \ {\n        MyStack stack = new MyStack();\n        stack.checkInvariant();\n\
    \        stack.push(\"sample\");\n        stack.checkInvariant();\n        //\
    \ Popping last element ok\n        assertEquals(\"sample\", stack.pop());\n  \
    \      stack.checkInvariant();\n        // Delete from empty stack\n        stack.delete(1);\n\
    \        stack.checkInvariant();\n    }\n}\n```\n"
  mdcn: "\n如果没有 \"@\" 符号怎么办？它能工作吗？会抛出运行时异常吗？这是你需要考虑的边界条件吗？¹\n\n验证格式化字符串数据（如电子邮件地址、电话号码、账户或或文件名）通常是直接的。但更复杂的结构化数据呢？假设你正在读取某种报告数据，其中包含一个与若干条数据记录相关联的头部记录（header\
    \ record），最后是一个尾部记录（trailer record）。我们可能需要测试多少种条件？\n\n- 如果没有头部记录，只有数据和尾部怎么办？\n\
    - 如果没有数据，只有头部记录和尾部怎么办？\n- 如果没有尾部记录，只有头部记录和数据怎么办？\n- 如果只有尾部记录怎么办？\n- 如果只有头部记录怎么办？\n\
    - 如果只有数据怎么办？\n\n就像那个简单的电子邮件地址例子一样，你必须考虑如果数据不符合你认为它应该具有的结构会发生什么。\n\n当然，如果你正在创建一个类似电子邮件地址（可能从不同的来源构建它）或上述的结构化数据，你希望测试你的结果以确保它符合要求。\n\
    \n## 5.2 排序\n\n另一个需要考虑的领域是数据的顺序，或者一个数据单元在较大集合中的位置。例如，在上一章的 `largest()` 示例中，一个\
    \ bug 的出现取决于你搜索的最大数字是在列表的开头还是末尾。\n\n这是排序的一个方面。任何种类的搜索程序都应该对搜索目标位于开头或结尾的情况进行测试，因为通过这种方法可以许多常见的\
    \ bug。\n\n> ¹ 电子邮件地址实际上非常复杂。仔细阅读 RFC822 可能会让你惊讶。\n\n# 第 5 章 正确的边界条件\n\n对于排序的另一个方面，假设你正在编写一个方法，传递一个包含餐厅订单的集合。你可能希望前菜首先出现在订单中，然后是沙拉（以及至关重要的酱料选择），然后是主菜，最后是含有大量巧克力的奢华甜点。\n\
    \n如果甜点在第一个，主菜在最后，你的代码会发生什么？\n\n如果可能发生这种情况，并且如果处理这种情况是你的方法的职责，那么你就需要测试这种条件并解决该问题。现在，这可能不是你的方法需要担心的事情。也许这需要在用户输入层面来解决（参见后文的“测试无效参数”）。\n\
    \n如果你正在编写一个排序程序，如果数据集已经是排序过的，会发生什么？或者更糟，是按完全反序排序的？问问自己这是否会导致麻烦——如果这些也是可能出现的最坏情况。\n\
    \n如果你应该保持某些东西的顺序，例如，如果你的方法是向厨房发回晚餐订单的 GUI 的一部分，你应该有一个测试来验证项目是否处于正确的上菜顺序：\n\n```java\n\
    public void testKitchenOrder() {\n    Order order = new Order();\n    FoodItem\
    \ dessert = new Dessert(\"Chocolate Souffle\");\n    FoodItem entree = new Entree(\"\
    Beef Oscar\");\n    FoodItem salad = new Salad(\"Tossed\", \"Parmesan Peppercorn\"\
    );\n    // 乱序添加\n    order.addFoodItem(dessert);\n    order.addFoodItem(entree);\n\
    \    order.addFoodItem(salad);\n    // 但应该按照上菜顺序输出\n    Iterator itr = order.iterator();\n\
    \    assertEquals(salad, itr.next());\n    assertEquals(entree, itr.next());\n\
    \    assertEquals(dessert, itr.next());\n    // 没有剩余了\n    assertFalse(itr.hasNext());\n\
    }\n```\n\n当然，从人的角度来看，你需要修改代码，使其具有灵活性，允许人们根据意愿先吃冰淇淋。在这种情况下，你需要添加一个测试来证明你四岁侄子的冰淇淋和所有人的沙拉一起出现，但奶奶的冰淇淋则在最后和你的卡布咖啡一起出现。\n\
    \n## 5.3 范围\n\n“范围”（Range）是一个方便的统称，指变量的类型允许其取比你需要的（或想要的）更广泛的值范围。例如，一个人的年龄通常用整数表示，没有人没有人活过\
    \ 200,000 岁，尽管这是一个完全有效的整数值。同样，一个圆里只有 360 度，尽管度通常以整数形式存储。\n\n在良好的面向对象设计中，你不要使用原始原生类型（例如\
    \ `int` 或 `Integer`）来存储边界整数值，如年龄或罗盘方位角。\n\n```java\n/**\n * 罗盘方位\n */\npublic\
    \ class Bearing {\n    protected int bearing; // 0..359\n    /**\n     * 初始化方位为\
    \ 0..359 之间的一个值\n     */\n    public Bearing(int num_degrees) {\n        if (num_degrees\
    \ < 0 || num_degrees > 359) {\n            throw new RuntimeException(\"Bad bearing\"\
    );\n        }\n        bearing = num_degrees;\n    }\n    /**\n     * 返回方位与另一个方位之间的角。\n\
    \     * 可能是负数。\n     */\n    public int angleBetween(Bearing another) {\n    \
    \    return bearing - another.bearing;\n    }\n}\n```\n\n注意，返回的角度仅仅是一个 `int`，因为我们没有对结果设置任何范围限制（它可能是负数，等）。\n\
    \n通过将方角的概念封装在类中，你现在在系统中有了一个可以过滤掉错误数据的地方。你无法创建一个具有超出范围值的 `Bearing` 对象。因此，系统的其他部分可以使用\
    \ `Bearing` 对象，并确保它们只包含合理的值。\n\n其他范围可能没有那么简单。例如，假设你有一个类来维护 x, y 坐标集。这些只是整数，具有任意值，但对范围的限制是两个点必须描述一个边长都不大于\
    \ 100 单位的矩形。那么，x, y 对的允许值范围是相互依赖的。你可能对任何可能影响坐标的方法进行范围测试，以确保 x, y 对的最终范围保持合法。关于此主题的更多信息，请参见第\
    \ 101 页“设计问题”章节中的“不变性”（invariants）。\n\n由于你可能会从多个不同的测试调用此，因此创建一个新的 `assert` 方法可能是有意义的：\n\
    \n```java\npublic static final int MAX_DIST = 100;\npublic void assertFairRange(String\
    \ message, Point one, Point two) {\n    assertTrue(Math.abs(one.x - two.x) <=\
    \ MAX_DIST);\n    assertTrue(Math.abs(one.y - two.y) <= MAX_DIST);\n}\n```\n\n\
    但你想要测试的最常见范围取决于数据结构。来看一个使用数组的简单示例：\n\n```java\nclass MyStack {\n    public MyStack()\
    \ {\n        stack = new String[100];\n        next_index = 0;\n    }\n    public\
    \ String pop() {\n        return stack[--next_index];\n    }\n    // 从栈删除 n 个元素\n\
    \    public void delete(int n) {\n        next_index -= n;\n    }\n    public\
    \ void push(String aString) {\n        stack[next_index++] = aString;\n    }\n\
    \    public String top() {\n        return stack[next_index-1];\n    }\n\n   \
    \ private int next_index;\n    private String[] stack;\n\n    public void checkInvariant()\
    \ throws InvariantException {\n        // JDK 1.4 可以使用 assert() 代替\n        if\
    \ (!next_index >= 0 && next_index < stack.length) {\n            throw new InvariantException(next_index\
    \ + \" out of range: \" + stack.length());\n        }\n    }\n}\n```\n\n这里潜伏着一些潜在的\
    \ bug，因为完全没有对空栈或栈溢出的检查。然而，操作索引变量 `next_index`。有一件事应该始终为：`(next_index >= 0 && next_index\
    \ < stack.length)`。我们希望检查这个表达式是否为真。\n\n现在 `next_index` 和 `stack` 都是私有变量；你不想为了测试而暴露它们。解决这个问题有几种方法；目前我们只需在\
    \ `MyStack` 中创建一个名为 `checkInvariant()` 的特殊方法：\n\n现在测试方法可以调用 `checkInvariant()`\
    \ 来确保栈类的内部没有出现任何错误，而无需直接访问这些内部。\n\n```java\nimport junit.framework.*;\npublic\
    \ class TestMyStack extends TestCase {\n    public void testEmpty() throws InvariantException\
    \ {\n        MyStack stack = new MyStack();\n        stack.checkInvariant();\n\
    \        stack.push(\"sample\");\n        stack.checkInvariant();\n        //\
    \ 弹出最后一个元素正常\n        assertEquals(\"sample\", stack.pop());\n        stack.checkInvariant();\n\
    \        // 从空栈删除\n        stack.delete(1);\n        stack.checkInvariant();\n\
    \    }\n}\n```\n"
