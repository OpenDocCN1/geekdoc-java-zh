    \ test that is composed of both of these test classes:\n\n```\nimport junit.framework;\n\
    public class TestClassComposite extends TestCase {\n    public TestClassComposite(String\
    \ method) {\n        super(method);\n    }\n    static public Test suite() {\n\
    \        TestSuite suite = new TestSuite();\n        // Grab everything;\n   \
    \     suite.addTestSuite(TestClassOne.class);\n        // Use the test method:\n\
    \        suite.addTest(TestClassTwo.suite());\n        return suite;\n    }\n\
    }\n```\n\nNow if you run TestClassComposite, the following test methods will be:\n\
    \n+   - testAddition() from TestClassOne\n- testSubtraction() from TestClassOne\n\
    - testShortTest() from TestClassTwo\n- testAnotherShortTest() from TestClassTwo\n\
    \nYou can keep going with this scheme; another class might include TestClassComposite,\
    \ which would include the above methods, with some other composite of tests, and\
    \ so on.\n\n# Pre-test Setup and Tear-down\n\nEach test should run independently\
    \ of every other test; this allows you to run any individual test at any time,\
    \ in any order.\n\nTo accomplish this feat, you may need to reset some parts of\
    \ the testing environment between tests, or clean up after a test has run. JUnit's\
    \ TestCase base class provides two methods that you can override to set up and\
    \ tear down the test's environment:\n\n```\nprotected void setUp();\nprotected\
    \ void tearDown();\n```\n\nThe method setUp() will be called before each one of\
    \ the test... methods is executed, and the method tearDown() will be called after\
    \ each test is executed.\n\n![](img/b707d7ecf5b37c24434a141d9f59b58d_46_0.png)"
- md: "\n# CHAPTER 3. WRITING TESTS IN JUNIT\n\n| | Per-method |\n|---|---|\n| 1.\
    \ oneTimeSetUp() | One-time setup at start of suite, and teardown runs |\n| 2.\
    \ setup() | setup runs |\n| 3. testMethod() | before each test method, |\n| 4.\
    \ tearDown() | and teardown |\n| 5. setup() | runs after |\n| 6. testMethod2()\
    \ | each method. |\n| 7. tearDown() | |\n| 8. oneTimeTearDown() | |\n\n![](img/b707d7ecf5b37c24434a141d9f59b58d_47_0.png)\n\
    \nFor example, suppose you needed some sort of database connection object for\
    \ each test. Rather than have to include code in each test method that connects\
    \ to and disconnects from the database, you could take care of that using the\
    \ setup and teardown methods.\n\n```java\npublic class TestDB extends TestCase\
    \ {\n    private Connection dbConn;\n    protected void setUp() {\n        dbConn\
    \ = new Connection(\"oracle\", 1521, \"fred\", \"foobar\");\n        dbConn.connect();\n\
    \    }\n    protected void tearDown() {\n        dbConn.disconnect();\n      \
    \  dbConn = null;\n    }\n    public void testAccountAccess() {\n        // Uses\
    \ dbConn\n    }\n    public void testEmployeeAccess() {\n        // Uses dbConn\n\
    \    }\n}\n```\n\nIn this example, setUp() will be called before testAccountAccess(),\
    \ then tearDown() will be called. setUp() will be called again, followed by testEmployeeAccess()\
    \ and then tearDown() again.\n\n# Per-suite Setup and Tear-down\n\nNormally per-test-setup\
    \ is all you need, but in some circumstances you may need to set something up\
    \ or clean up after the entire test suite runs: for that, need per-suite setup\
    \ and tear-down (the difference between per-test and per-suite execution order\
    \ is shown in Figure 3.2 of the preceding page).\n\nPer-suite setup is a bit more\
    \ complicated. You need to provide a suite of the required tests (by whatever\
    \ means) and wrap it in a TestSetup object. Using our previous example, that might\
    \ look something like this:\n\n```java\nimport junit.framework.*;\nimport junit.extensions.*;\n\
    public class TestClassTwo extends TestCase {\n    private static TestClassTwo\
    \ tsp;\n    public TestClassTwo(String method) {\n        super(method);\n   \
    \ }\n    // This one takes a few hours...\n    public void testLongRunner() {\n\
    \        assertEquals(2300, tsp.shortestPath(50));\n    }\n    public void testShortTest()\
    \ {\n        assertEquals(140, tsp.shortestPath(5));\n    }\n    public void testAnotherTest()\
    \ {\n        assertEquals(586, tsp.shortestPath(10));\n    }\n    public static\
    \ TestSuite suite() {\n        TestSuite suite = new TestSuite();\n        //\
    \ Only include short tests\n        suite.addTest(new TestClassTwo(\"testShortTest\"\
    ));\n        suite.addTest(new TestClassTwo(\"testAnotherTest\"));\n        return\
    \ suite;\n    }\n    TestSetup wrapper = new TestSetup(suite);\n    protected\
    \ void setUp() {\n        oneTimeSetUp();\n    }\n    protected void tearDown()\
    \ {\n        oneTimeTearDown();\n    }\n    return wrapper;\n}\npublic static\
    \ void oneTimeSetup() {\n    // one-time initialization code goes here...\n  \
    \  tsp = new TSP();\n    tsp.loadCities(\"EasternSeaboard\");\n}\npublic static\
    \ void oneTimeTearDown() {\n    // one-time cleanup code goes...\n    tsp.releaseCities();\n\
    }\n```\n\nNote that you can use both per-suite and per-test setUp methods in the\
    \ same class.\n\n## 3.5 JUnit Custom Asserts\n\nThe standard asserts that JUnit\
    \ provides are usually sufficient for most testing. However, you may run into\
    \ a situation where it would be handy to have your own, customized asserts. Perhaps\
    \ you've got a special data type, or a common sequence of actions that is done\
    \ in multiple tests.\n\nDon't copy and paste common code in the tests; tests should\
    \ be written to the same high standards as regular code, which means honoring\
    \ good coding practices such as the DRY principle, orthogonality, and so on. Factor\
    \ out common bits of test harness into real methods, and use those methods in\
    \ your test cases.\n\nIf you have custom asserts or common code that needs to\
    \ be shared throughout the project, you may want to consider subclassing TestCase\
    \ and using the subclass for all testing. For instance, suppose you are testing\
    \ a financial application and virtually all tests use a data type called Money.\
    \ Instead of having tests subclass directly, you'd create a project-specific base\
    \ class:\n\n```java\nimport junit.framework.*;\n/**\n * Project-wide base class\
    \ for Testing\n */\npublic class ProjectTest extends TestCase {\n    /**\n   \
    \  * Assert that the amount of money is even\n     * number of dollars (no cents)\n\
    \     * @param message Text to display if the assertion fails\n     * @param amount\
    \ Money object to test\n     */\n    public void assertEquals(String message,\
    \ Money amount) {\n        assertEquals(message, amount.asDouble(), 0.0, 0.001);\n\
    \    }\n    /**\n     * Assert that the amount of money is even\n     * number\
    \ of dollars (no cents)\n     * @param amount Money object to test\n     */\n\
    \    public void assertEquals(Money amount) {\n        assertEquals(\"\", amount);\n\
    \    }\n}\n```\n\n> DRY stands for \"Don't Repeat Yourself.\" It's a fundamental\
    \ technique that demands every piece of knowledge in a system have a single, unambiguous\
    \ representation.\n\nNote that we provide both forms of assert: one that takes\
    \ a String and one that does not. Note also that you didn't copy any code in doing\
    \ so; you merely favored the call. Now all the other test classes in the project\
    \ will inherit from this base class instead of directly from TestCase:\n\n```java\n\
    public class TestSomething extends ProjectTest {\n```\n\n![](img/b707d7ecf5b37c24434a141d9f59b58d_50.png)\n\
    \nIn fact, it is usually a good idea to start off a new project by always inheriting\
    \ from your custom base class instead of directly from JUnit—even if it doesn't\
    \ add any functionality first. That way, should you need to add a method or capability\
    \ that every test class needs, you can simply add it to your base class without\
    \ having to edit every test case in the project.\n\n## 3.6 JUnit and Exceptions\n\
    \nThere are two kinds of exceptions that we might be interested:\n\n- 1. Expected\
    \ exceptions resulting from a test\n- 2. Unexpected exceptions from something\
    \ that's gone horribly wrong\n\nCHAPTER 3. WRITING TESTS IN JUNIT\n\nContrary\
    \ to what you might think, exceptions are really good things—they tell us that\
    \ something is wrong. Sometimes in a test, we want the method to throw an exception.\
    \ Consider a method named sortList(). It's supposed to throw an exception if passed\
    \ a null. We must test for that explicitly.\n\n```java\npublic void testForException()\
    \ {\n  try {\n    sortList(null);\n    fail(\"Should have thrown an exception\"\
    );\n  } catch (RuntimeException e) {\n    assertTrue(true);\n  }\n}\n```\n\nThe\
    \ method under test is within a try/catch block on line 3. This method is expected\
    \ to throw an exception, so if it doesn't—if we proceed past line 3—then we need\
    \ to fail the test immediately. If the exception fires, the code will proceed\
    \ to line 6 and record the assertion for statistical purposes.\n\nNow you might\
    \ ask why bother with the assertTrue It won't do anything, it can't fail, so why\
    \ bother putting it in? Any assertTrue(true) translates as \"I expect the control\
    \ flow should pass through here.\" That's a strong form of documentation that\
    \ will help clear any misunderstandings later. However, don't forget that an assertTrue(true)\
    \ that is never called does not generate a failure.\n\nIn general, you should\
    \ test a method for every declared exception, and make sure that it throws when\
    \ it should. It covers us for expected exceptions, but what about unexpected exceptions?\n\
    \nWhile you can catch all possible exceptions yourself and call JUnit's fail(),\
    \ you'd better off letting JUnit do the hard work. For instance, suppose you are\
    \ reading a file of test data. Rather than catching the possible I/O exceptions\
    \ yourself, simply declare your test method to throw the possible exceptions:\n\
    \n```java\npublic void testData1() throws FileNotFoundException {\n  FileInputStream\
    \ inputStream = new FileInputStream(\"data.txt\");\n}\n```\n\nJUnit framework\
    \ will catch any thrown exception and report it as an error, without any extra\
    \ effort on your part. Even better, JUnit will report the entire stack trace right\
    \ down to the bug itself, not just to the failed assert, which is tremendous when\
    \ trying to figure why a test failed.\n\n## 3.7 More on Naming\n\nNormally, you\
    \ want tests all of the time. But suppose you thought a bunch of tests first,\
    \ written them, and are now working your way through implementing the code required\
    \ to pass the tests. What about all those new tests that would fail now?\n\nYou\
    \ can go ahead and write these tests, but you don't want the testing framework\
    \ to run these tests just yet. Frankly, most testing frameworks use a naming convention\
    \ to discover tests automatically. When using JUnit in Java, for instance, methods\
    \ whose names start with \"test\" (as in testMyShop) will be run as tests; all\
    \ you need to do is name the method something else until you're ready to tackle\
    \ it. If you named pending tests as \"pendingTestMyShop\", then not only will\
    \ the testing framework ignore it for now, but you could also search for the string\
    \ \"pendingTest\" throughout your code to find easily any tests you may have missed.\n\
    \n## 3.8 JUnit Test Skeleton\n\nAll you really need to write tests using JUnit\
    \ are just these three things:\n\n- 1. An import statement to bring in junit.framework.*\n\
    - 2. An extends statement so your class will inherit from TestCase\n- 3. A constructor\
    \ with a call to super(string)\n"
