    # About the Starter Kit


    Our first book, The Pragmatic Programmer: From Journeyman to Master, is a widely-acclaimed
    overview of practical topics in modern software development. Since it was first
    published in 1999, many people have asked us about follow-on books, or sequels.
    We''ll get around to that. But first, we thought we''d go back and offer a prequel
    of sorts.


    Over the years, we''ve found that many of our pragmatic readers who are just starting
    out need a helping hand to get their development infrastructure in place, so they
    can begin forming good habits early. Many of our more advanced readers understand
    these topics thoroughly, but need help convincing and educating the rest of their
    team or organization. We think we''ve got something that can help.


    The Pragmatic Starter Kit is a three-volume set that covers the essential basics
    for modern software development. These volumes include the practices, tools, and
    philosophies that you need to get a team up and running and super-productive.
    Armed with this knowledge, you and your team can adopt good habits easily and
    enjoy the safety and comfort of a well-established "safety net" for your project.


    Volume I, Pragmatic Version Control, describes how to use version control as the
    cornerstone of a project. A project with-out version control is like a word processor
    without an UNDO button: the more text you enter, the more expensive a mistake
    will be. Pragmatic Version Control shows you how to use version control systems
    effectively, with all the benefits and safety but without crippling bureaucracy
    or lengthy, tedious procedures.'
