- md: "\n# Answer 1:\n\n- For a brand-new stack, isEmpty() should be true, top() and\
    \ pop() should throw exceptions.\n- Starting with an empty stack, push() to push\
    \ a test string onto the stack. Verify that top() returns several times in a row,\
    \ and that isEmpty() returns false.\n- Call pop() to remove the test string, and\
    \ verify that it is the same string. isEmpty() should now be true. Call pop()\
    \ again verify an exception is thrown.\n- Now do the same test again, but this\
    \ time add multiple items to the stack. Make sure you get the ones back, in the\
    \ right order (the most recent item added should be the one returned).\n- Push\
    \ a null onto the stack and pop it; confirm you get a null back.\n- Ensure you\
    \ can use the stack after it has thrown exceptions.\n\n# Exercise 2: from page\
    \ 61\n\nA shopping cart. This class lets you add, delete, and count the items\
    \ in a shopping cart.\n\nWhat sort of boundary conditions might come up? Are there\
    \ any implicit restrictions on what you can delete? Are there any interesting\
    \ issues if the cart is empty?\n\n```java\npublic interface ShoppingCart {\n \
    \   /**\n     * Add this many of this item to the\n     * shopping cart.\n   \
    \  */\n    public void addItem(Item anItem, int quantity)\n        throws NegativeCountException;\n\
    \    /**\n     * Delete this many of this item from the\n     * shopping cart\n\
    \     */\n    public void deleteItems(Item anItem,\n        int quantity)\n  \
    \      throws NegativeCountException,\n        NoSuchItemException;\n    /**\n\
    \     * Count of all items in the cart\n     * (that is, all items x qty each)\n\
    \     */\n    public int itemCount();\n```\n\nIn this case, assertEquals() isn't\
    \ good enough; you need to assertSame() to ensure it's the same object.\n\n# APPENDIX\
    \ F. ANSWERS TO EXERCISES 145\n\n```java\n/** Return Iterator of all items\n *\
    \ (see Java Collection's doc)\n */\npublic Iterator iterator();\n}\n\n# Answer\
    \ 2:\n\n- Call addItems with quantity of 0 and itemCount should remain the same.\n\
    - Call deleteItem with quantity of 0 and itemCount should remain the same.\n-\
    \ Call addItems with a negative quantity and it should raise an exception.\n-\
    \ Call deleteItem with a negative quantity and it should raise an exception.\n\
    - Call addItems and the item count should increase, whether the item exists already\
    \ or not.\n- Call deleteItem where the item does not exist and it should raise\
    \ an exception.\n- Call deleteItem when there are no items in the cart and itemCount\
    \ should remain at 0.\n- Call deleteItem where the quantity is larger than the\
    \ number of those items in the cart and it should raise an exception.\n- Call\
    \ iterator when there are no items in the cart and it should return an empty iterator\
    \ (i.e., it's a real iterator object (not null) that contains no items).\n- Call\
    \ addItems several times for a couple of items and verify that the contents of\
    \ the cart match what was added (as reported via iterator() and itemCount()).\n\
    \nHint: you can combine these asserts into a single test. For instance, you might\
    \ start with an empty cart, add 3 of an item, then delete one of them at a time.\n\
    \nExercise 3: from page 62\n\nA fax scheduler. This code will send fences from\
    \ a specified file name to a U.S. phone number. There is a validation requirement;\
    \ a U.S. phone number with area code must be of the form xnn-nnn-nnnn, where x\
    \ must be a digit in the range [2..9] and n can be [0..9]. The following blocks\
    \ are reserved and are not currently valid area codes: x11, x9n, 37n, 96n.\n\n\
    The method's signature is:\n\n# APPENDIX F. ANSWERS TO EXERCISES\n\n* Send the\
    \ named file as a fax to the\n* Send given phone number.\n\n```java\npublic boolean\
    \ sendFax(String filename)\n    throws MissingOrBadFileException,\n         FormatException,\n\
    \         PhoneAreaCodeException;\n```\n\nGiven these requirements, what tests\
    \ for boundary conditions could you think of?\n\nAnswer 3:\n\n- Phone numbers\
    \ with an area code of 111, 211, up to 911, 290, 291, 999, 370-379, or 960-969\
    \ should throw a Phone-AreaCodeException.\n- A phone number with too many digits\
    \ (in one of each set of number, area code, prefix, number) should throw a Phone-FormatException.\n\
    - A phone number with not enough digits (in one of each set) should throw a FormatException.\n\
    - A phone number with illegal characters (spaces, letters, etc.) should throw\
    \ a FormatException.\n- A phone number that's missing dashes should throw a Phone-FormatException.\n\
    - A phone number with multiple dashes should throw a Phone-FormatException.\n\
    - A null phone number should throw a MissingOrBadFile-Exception.\n- A file that\
    \ doesn't exist should throw a MissingOrBadFile-Exception.\n- A null filename\
    \ should also throw that exception.\n- An empty file should throw a MissingOrBadFileException.\n\
    - A file that's not in the correct format should throw a Missing-OrBadFileException.\n\
    \nExercise 4: from page 62\n\nAn automatic sewing machine that does embroidery.\
    \ The class controls it takes a few basic commands. The coordinates (0,0) represent\
    \ the lower-left corner of the machine. x and y increase you move toward the upper-right\
    \ corner, whose coordinates are x = getTableSize().width - 1 and y = getTableSize().height\
    \ - 1.\n\nCoordinates are specified in fractions of centimeters.\n\n```java\n\
    public void moveTo(float x, float y);\npublic void setTo(float x, float y);\n\
    public void setWorkpieceSize(float width, float height);\npublic Size getWorkpieceSize();\n\
    ```\n\nThere are some real-world constraints that might be interesting: you can't\
    \ sew thin as air, of course, and you can't sew a workpiece bigger than the machine.\n\
    \nGiven these requirements, what boundary conditions can you think of?\n\n# Answer\
    \ 4:\n\n- Huge value for one or both coordinates\n- Huge value for workpiece size\n\
    - Zero or negative value for one or both coordinates\n- Zero or negative value\
    \ for workpiece\n- Coordinates that move off the workpiece\n- Workpiece bigger\
    \ than the table\n\nExercise 5: from page 63\n\nAudio/Video Editing Transport.\
    \ A class that provides methods to control a VCR or tape deck. There's the notion\
    \ of a \"current position\" that lies somewhere between the beginning of tape\
    \ (BOT) and the end of tape (EOT).\n\nYou can ask for the current position and\
    \ move there to another position. Fast-forward moves from current position toward\
    \ EOT by some amount. Rewind moves from current position toward BOT by some amount.\n\
    \nWhen tapes are first loaded, they are positioned at BOT.\n\n```java\npublic\
    \ interface AVTransport {\n  /**\n   * Move the current position ahead by this\
    \ many\n   * seconds. Fast-forward past end-of-tape\n   * leaves the position\
    \ at end-of-tape\n   */\n  public void fastForward(float seconds);\n\n  /**\n\
    \   * Move the current position backwards by this\n   * seconds. Rewinding past\
    \ zero leaves\n   * the position at zero\n   */\n  public void rewind(float seconds);\n\
    \n  /**\n   * Return current position in seconds\n   */\n  public float currentTimePosition();\n\
    \n  /**\n   * Mark the current position with this label\n   */\n  public void\
    \ markTimePosition(String name);\n\n  /**\n   * Change the current position to\
    \ the one\n   * associated with the marked name\n   */\n  public void gotoMark(String\
    \ name);\n}\n```\n\n![](img/b707d7ecf5b37c24434a141d9f59b58d_165_0.png)\n\n# Answer\
    \ 5:\n\n- Verify that the initial position is BOT.\n- Fast forward by some allowed\
    \ amount (not past end of tape), then rewind by same amount. Should be at initial\
    \ location.\n- Rewind by some allowed amount (not past beginning of tape), then\
    \ fast forward by same amount. Should be at initial location.\n- Fast forward\
    \ past end of tape, then rewind by same amount. Should be before the initial location\
    \ by an appropriate amount to reflect the fact that you can't advance the location\
    \ past the end of tape.\n- Try the same thing in the other direction (rewind past\
    \ beginning of tape).\n- Mark various positions and return to them after moving\
    \ the current position around.\n- Mark a position and return to it without moving\
    \ in between.\n\nExercise 6: from page 63\n\nAudio/Video Editing Transport, Release\
    \ 2.0. As above, but now you can position in seconds, minutes, or frames (there\
    \ are exactly 30 frames per second in this example), and you can move relative\
    \ to the beginning or the end.\n"
  mdcn: "\n\n# 答案 1:\n\n- 对于全新的栈，`isEmpty()`应该为 `true`，`top()` 和 `pop()` 应该抛出异常。\n\
    - 从空栈开始，使用 `push()` 将一个测试字符串推入栈。验证连续调用 `top()` 返回的结果，且 `isEmpty()` 返回 `false`。\n\
    - 调用 `pop()` 移除该测试字符串，并验证它是同一个字符串。此时 `isEmpty()` 应该为 `true`。再次调用 `pop()` 验证是否抛出了异常。\n\
    - 现在再次执行相同的测试，这次向栈中添加多个项目。确保你按照正确的顺序取回这些项目（最近添加的项目应该是返回的某一个）。\n- 向栈中推入一个 `null`\
    \ 并将其 `pop` 出来；确认你得到的是 `null`。\n- 确保在栈抛出异常后你仍然可以使用它。\n\n# 练习 2：来自第 61 页\n\n一个购物车。这个类允许你添加、删除和统计购物车中的物品。\n\
