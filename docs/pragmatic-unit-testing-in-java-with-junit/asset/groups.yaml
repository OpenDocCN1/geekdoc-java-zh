    # 第 7 章


    ## 好测试的属性


    单元测试是非常强大的魔法，但如果使用不当，可能会因浪费时间而给项目造成巨大的损害。如果单元测试没有被正确地编写和实现，你很容易花费大量时间在维护和调试测试本身上，导致生产代码——以及整个项目——遭受损失。


    我们不能让这种情况发生；记住，你最初进行单元测试的完全是为了让你的生活变得更轻松！幸运的是，你只需要遵循几个简单的指南就可以防止问题在你的项目中滋生。


    良好的测试具有以下属性，它们构成了 **A-TRIP**：


    - 自动的 (Automatic)

    - 可重复的 (Repeatable)

    - 独立的 (Independent)

    - 专业的 (Professional)


    让我们来看看这些词对我们来说意味着什么。


    ### 7.1 自动的


    单元测试需要自动运行。我们所说的“自动”至少包含两个方面：调用测试和检查结果。


    对你来说，调用一个或多个单元测试必须非常简单，因为你每天都会日复一日地在做这件事。所以，它的复杂性绝不能比在提示符中按一个按钮或在 IDE 中输入一个命令来运行你想运行的测试更复杂。某些
    IDE 甚至可以设置为在后台持续运行测试。


    维护这种环境至关重要：不要引入需要手动操作步骤而破坏自动模型的测试。无论测试需要什么（数据库、网络连接等），都要让这些成为测试本身的自动部分。第 6 章中描述的
    Mock 对象（模拟对象）可以帮助你免受真实环境变化的影响。


    但你并不是唯一在运行测试的人。在某个地方，机器应该持续运行所有提交代码的单元测试。这种自动的、无人值的检查充当了“后盾”：一种安全机制，确保任何提交的内容都没有在任何地方破坏任何测试。在理想世界中，这是没必要的，因为你可以指望每位开发者自己运行所有必要的测试。


    但现实世界并非理想。也许某个人在项目的远程中心没有运行某些必要的测试。他们在自己的机器上有一些代码让一切运行正常——但他们没有提交这些代码，所以尽管测试在他们自己的机器上通过了，这些相同的测试在其他地方都会失败。


    你可能想要研究诸如 CruiseControl¹、AntHill² 和 Tinder³。这些是免费提供的开源产品，用于管理持续构建和测试。我们在《入门教程》第三卷
    [Cla04] 中描述了如何建立持续构建和测试环境。


    ¹ http://cruisecontrol.sourceforge.net

    ² http://www.cs.unibo.it/projects/anthill

    ³ http://www.mozilla.org/tinderbox.html


    最后，我们所说的“自动”是指测试必须自己判断通过还是失败。让一个人（你）或另一个可怜的受害者阅读测试输出并判断代码是否正常工作是项目失败的根源。持续回归的一项重要特性是让测试自我检查。我们人类并不擅长那些重复性任务，而且我们还有更重要的事情要忙——记住那个项目吗？


    这种让测试自动运行的想法至关重要，因为这意味着你不需要考虑它——它只是作为项目的一部分自然发生。这样测试就可以履行其作为项目安全网主要组成部分的角色。（版本控制和自动化是“安全网”的另外两个主要部分）。测试是为了在你跌倒时抓住你，但它们不会阻挡你的路。当你跨越今天的钢丝时，你需要全部的注意力。


    ### 7.2 彻底的


    良好的单元是彻底的；它们测试了所有可能出错的地方。但到底有多彻底？在一个极端，你的目标可以是测试每一行代码、代码可能采取的每一个分支、它抛出的每一个异常等。在另一个极端，你测试的是最可能出错的候选者——边界条件、缺失和格式错误的数据等。这是一个基于项目需求的判断问题。


    如果你目标是实现更全面的覆盖，那么你可能想要投入代码覆盖率工具来帮助。（例如，免费的“nounit”⁴ 和“quilt”⁵ 以及像 Clover 这样的商业工具都是很好的。）


    这些工具可以帮助你确定被测试代码中有多少实际上被执行了。


    要意识到，Bug 并不是均匀分布在源代码中的。相反，它们需要聚集在问题区域（关于这些代码的有趣故事，请看下一页的侧边栏）。


    ⁴ http://nounit.sourceforge.net

    ⁵ http://quilt.sourceforge.net


