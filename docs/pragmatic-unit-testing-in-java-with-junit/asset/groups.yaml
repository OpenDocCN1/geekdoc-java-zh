    # Chapter 4


    # What to Test:

    The Right-BICEP


    It can be hard to look at a method or a class and try to come up with all the
    ways it might fail; to anticipate all the bugs that might be lurking in there.
    With enough experience, you start to get a feel for those things that are “likely
    to break,” and can effectively concentrate on testing in those areas first. But
    without a lot of experience, it can be hard and frustrating trying to discover
    possible failure modes. End-users are quite adept at finding our bugs, but that’s
    both embarrassing and damaging to our careers! What we need are some guidelines,
    reminders of areas that might be important to test.


    Let’s take a look at six areas to test that will strengthen your testing skills,
    using your RIGHT-BICEP:


    +   - **Right** — Are the results **right**?

    - **B** — Are all the **boundary** conditions CORRECT?

    - **I** — Can you check inverse relationships?

    - **C** — Can you you **cross-check** results using other means?

    - **E** — Can you force **error conditions** to happen?

    - **P** — Are **performance** characteristics within bounds?'
  - '[PAGE 55]


    # 4.1 Are the Results Right?


    The first and most obvious area to test is simply to see if the expected results
    are right—to validate the results.


    We''ve seen simple data validation already: the Chapter 2 that verify that a method
    returns the largest number from a list.


    These are usually the “easy” tests, and many of these sorts of validations may
    even be specified in the requirements. If they aren''t, you''ll probably need
    to ask someone. You need to be able to answer the key question:


    > If the code ran correctly, how would I know?


    If you cannot answer this question satisfactorily, then writing the code—or the
    test—may be a complete waste of time. “But wait,” you may say, “that doesn’t sound
    very agile! What if the requirements are vague or incomplete? Does that mean we
    can''t write code until all the requirements are firm?


    No, not at all. If the requirements are truly not yet known, or complete, you
    can always invent some as a stake in the ground. They may not be correct from
    the user''s point of view, by you now know what you think the code should do,
    and so you can answer the question.


    Of course, you must arrange for feedback with users to fine-tune your assumptions.
    The definition of “correct” may change over the lifetime of the code in question,
    but at any point, you should be able to prove that it''s doing what you think
    it ought.


    # Using Data Files


    For sets of tests with large amounts of test data, you might want to consider
    putting the test values and/or results in a separate data file that the unit test
    reads in. This doesn''t need to be a very complicated exercise—and you don''t
    even need to use XML. Figure 4-1 on the next page is a version of TestLargest
    that reads in all of the tests from a data file.


    > This is clearly a joke. XML is mandatory on all projects today, isn''t it?'
