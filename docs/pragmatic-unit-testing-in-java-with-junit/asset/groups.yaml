    \ it provides mocked-up versions of HttpServletRequest and HttpServletResponse,\
    \ which by an incredible coincidence are the types of the parameters of the method\
    \ we want to test.\n\nWe can use their package to rig the tests, much as we faked\
    \ out setting the test in the earlier example:\n\n```java\nimport junit.framework.*;\n\
    import com.mockobjects.servlet.*;\n\npublic class TestServlet extends TestCase\
    \ {\n  public void test_bad_parameter() throws Exception {\n    HttpServlet s\
    \ = new HttpServlet();\n    MockHttpServletRequest request = new MockHttpServletRequest();\n\
    \    MockHttpServletResponse response = new MockHttpServletResponse();\n\n   \
    \ request.setupAddParameter(\"Fahrenheit\", \"boo!\");\n    response.setContentType(\"\
    text/html\");\n    s.doGet(request,response);\n    response.verify();\n    assertEquals(\"\
    Invalid parameter: boo!\\n\",\n        response.getStreamContents());\n  }\n\n\
    \  public void test_boil() throws Exception {\n    HttpServlet s = new HttpServlet();\n\
    \    MockHttpServletRequest request = new MockHttpServletRequest();\n    MockHttpServletResponse\
    \ response = new MockHttpServletResponse();\n\n    request.setupAddParameter(\"\
    Fahrenheit\", \"212\");\n    response.setContentType(\"text/html\");\n    s.doGet(request,response);\n\
    \    response.verify();\n    assertEquals(\"Fahrenheit: 212, Celsius: 100.0\\\
    n\",\n        response.getStreamContents());\n  }\n}\n```\n\nWe use a MockHttpServletRequest\
    \ object to set up the context in which to run the test. On line 13 of the code,\
    \ we set the parameter Fahrenheit to the value \"boo!\" in the request object.\
    \ This is equivalent to the user entering \"boo!\" in the corresponding form field\
    \ in the browser; our mock object eliminates the need for human input when the\
    \ test runs.\n\nOn line 14, we tell the response object that we expect the method\
    \ under test to set the response’s content type to be text/html. Then, on lines\
    \ 16 and 31, after the method under test has run, we tell the response object\
    \ to verify that this has happened. Here, the mock object eliminates the need\
    \ for a human to check the result visually. This example shows a pretty trivial\
    \ verification; in reality, mock objects can verify that fairly complex sequences\
    \ of actions have been performed, and they can check that methods have been called\
    \ the correct number of times.\n\nMock objects can also record the data that was\
    \ given to them. In our case, the response object receives the text that our servlet\
    \ wants to display on the browser. We can query this value (lines 18 and 33) to\
    \ check that we're returning the text we were expecting.\n\n![](img/b707d7ecf5b37c24434a141d9f59b58d_90_0.png)\n\
    \n# 6.4 Easy Mock Objects\n\nIf the thought of writing all these mock object classes\
    \ is intimidating, you might want to take a look at Easy-Mock, a convenient Java\
    \ API for creating mock objects dynamically.\n\nEasy-Mock uses a very interesting\
    \ method to specify which method calls are allowed and what their return values\
    \ should be: you specify which method calls should exist by calling them! The\
    \ mock control object lets you specify a record mode and a replay mode for the\
    \ corresponding mock object. While the object is in record mode, you go ahead\
    \ and call all the methods you are interested in and set the desired return values.\
    \ Once that's finished, you switch over to replay mode. Now when you call those\
    \ methods, you'll get the return values you specified.\n\nAny remaining methods\
    \ will throw a runtime exception if they are called—but the nice part is that\
    \ you don't have to define any of them.\n\nFor example, suppose we have an interface\
    \ for a Jukebox hardware controller that has over dozen methods, but we're only\
    \ interested in one for this demonstration. (Note that we're not really testing\
    \ anything here, but are just showing how you set up and use an EasyMock object.\
    \ Obviously, the whole point of using a mock object is to allow you to test something\
    \ that depends on the object you're mocking up.)\n\n> ³http://www.easymock.org\n\
    \n![](img/b707d7ecf5b37c24434a141d9f59b58d_91_0.png)\n\n```java\nimport junit.framework.*;\n\
    import org.easymock.MockControl;\n\npublic class TestJukebox extends TestCase\
    \ {\n    private Jukebox mockJukebox;\n    private MockControl mockJukebox_control;\n\
    \n    protected void setUp() {\n        // Create a control handle to the Mock\
    \ object\n        mockJukebox_control = MockControl.create(Jukebox.class);\n \
    \       // Create the Mock object itself\n        mockJukebox = (Jukebox) mockJukebox_control.getMock();\n\
    \    }\n\n    public void testEasyMockDemo() {\n        // Set up the mock object\
    \ by calling\n        // methods you want to exist\n        mockJukebox.getCurrentSong().setReturnValue(\n\
    \            \"King Crimson -- Epitaph\");\n        // You don't have to worry\
    \ about the other done\n        // methods defined in Jukebox...\n        // Switch\
    \ from record to playback\n        mockJukebox_control.replay();\n\n        //\
    \ Now it's ready to use:\n        assertEquals(\"King Crimson -- Epitaph\",\n\
    \            mockJukebox.getCurrentSong());\n    }\n}\n```\n\nThe code in the\
    \ setUp() method for this creates an empty mock object for the Jukebox interface,\
    \ along with its control. The control starts in record mode. Now it's ready to\
    \ use: assertEquals(\"King Crimson -- Epitaph\", mockJukebox.getCurrentSong());\n\
    \n# Exercises\n\n7. Come up with a simple MP3 player with the following methods:\n\
    \n```java\nimport java.util.ArrayList;\n\npublic interface Mp3Player {\n    /**\n\
    \     * Returns true if a song is currently played.\n     */\n    public boolean\
    \ isPlaying();\n\n    /**\n     * Load filenames into the playlist.\n     */\n\
    \    public void loadSongs(ArrayList names);\n\n    /**\n     * Begin playing.\n\
    \     */\n    public void play();\n\n    /**\n     * Pause playing.\n     */\n\
    \    public void pause();\n\n    /**\n     * Returns the number of seconds into\
    \ the current song.\n     */\n    public double currentPosition();\n\n    /**\n\
    \     * Returns the currently file name.\n     */\n    public String currentSong();\n\
    \n    /**\n     * Advance to the next song in the playlist.\n     */\n    public\
    \ void next();\n\n    /**\n     * Go back to the previous song in the playlist.\n\
    \     */\n    public void prev();\n}\n```\n\nIt should pass the following test:\n\
    \n```java\nimport junit.*;\nimport java.util.ArrayList;\n\nclass TestMp3Player\
    \ extends TestCase {\n    protected Mp3Player mp3;\n    protected ArrayList list\
    \ = new ArrayList();\n\n    public void setUp() {\n        mp3 = new MockMp3Player();\n\
    \        list = new ArrayList();\n        list.add(\"Bill Chase -- Up Wide\");\n\
    \        list.add(\"ethro Tulli -- Locomotive Breath\");\n        list.add(\"\
    The Bowntown Rats -- Monday\");\n        list.add(\"Carl Orff -- O Fortuna\");\n\
    \    }\n\n    public void testPlay() {\n        mp3.loadSongs(list);\n       \
    \ assertFalse(mp3.isPlaying());\n        mp3.play();\n        assertTrue(mp3.isPlaying());\n\
    \        assertTrue(mp3.currentPosition() != 0.0);\n        mp3.pause();\n   \
    \     assertFalse(mp3.currentPosition(), 0.1);\n    }\n\n    public void testPlayToList()\
    \ {\n        // Don't set the list up\n        assertFalse(mp3.isPlaying());\n\
    \        mp3.play();\n        assertFalse(mp3.isPlaying());\n        assertEquals(0.0,\
    \ mp3.currentPosition(), 0.1);\n        mp3.pause();\n        assertEquals(0.0,\
    \ mp3.currentPosition(), 0.1);\n        assertFalse(mp3.isPlaying());\n    }\n\
    }\n```\n\nWrite a MockMp3Player class that implements the Mp3Player interface\
    \ and makes the TestMp3Player test pass. You will need to track the state of the\
    \ player, the current song index, and the current position. You'll also need to\
    \ handle the case where the playlist is empty.\n"
  mdcn: "\n\n# 测试 SERVLET 73\n\n用于测试 servlet 环境的类。特别地，它提供了 `HttpServletRequest` 和\
    \ `HttpServletResponse` 的模拟版本，非常巧的是，这些类型正是我们想要测试的方法的参数类型。\n\n我们可以使用它们所在的包来编写测试，，就像我们在上一个示例中伪造测试设置一样：\n\
    \n```java\nimport junit.framework.*;\nimport com.mockobjects.servlet.*;\n\npublic\
    \ class TestServlet extends TestCase {\n  public void test_bad_parameter() throws\
    \ Exception {\n    HttpServlet s = new HttpServlet();\n    MockHttpServletRequest\
    \ request = new MockHttpServletRequest();\n    MockHttpServletResponse response\
    \ = new MockHttpServletResponse();\n\n    request.setupAddParameter(\"Fahrenheit\"\
    , \"boo!\");\n    response.setContentType(\"text/html\");\n    s.doGet(request,response);\n\
    \    response.verify();\n    assertEquals(\"Invalid parameter: boo!\\n\",\n  \
    \      response.getStreamContents());\n  }\n\n  public void test_boil() throws\
    \ Exception {\n    HttpServlet s = new HttpServlet();\n    MockHttpServletRequest\
    \ request = new MockHttpServletRequest();\n    MockHttpServletResponse response\
    \ = new MockHttpServletResponse();\n\n    request.setupAddParameter(\"Fahrenheit\"\
    , \"212\");\n    response.setContentType(\"text/html\");\n    s.doGet(request,response);\n\
    \    response.verify();\n    assertEquals(\"Fahrenheit: 212, Celsius: 100.0\\\
    n\",\n        response.getStreamContents());\n  }\n}\n```\n\n我们使用一个 `MockHttpServletRequest`\
    \ 对象来设置运行测试的上下文。在代码的第 13 行，我们在请求对象并将参数 `Fahrenheit` 设置为 \"boo!\"。这等同于用户在浏览器相应的表单字段中输入了\
    \ \"boo!\"；我们的模拟对象消除了测试运行时对人工输入的需求。\n\n在第 14 行，我们告诉响应对象，我们期望被测试的方法将响应的类型类型设置为\
    \ `text/html`。然后，在第 16 行和第 31 行，在被测试的方法运行后，我们告诉响应对象验证该操作是否已经发生。在这里，模拟对象消除了人工肉眼检查结果的需求。这个示例展示了一个非常简单的验证；在现实，模拟对象可以验证是否执行了相当复杂的动作序列，并且可以检查方法被调用的次数是否正确。\n\
    \n模拟对象还可以记录传递给它们的数据。在我们的案例中，响应对象接收了 servlet 想要在浏览器上显示的文本。我们可以查询此值（第 18 行和第 33\
    \ 行），以检查返回的是否我们预期的文本。\n\n![](img/b707d7ecf5b37c24434a141d9f59b58d_90_0.png)\n\n\
    # 6.4 Easy Mock 对象\n\n如果编写所有这些模拟对象类让你感到望畏，你可能想看一眼 Easy-Mock，这是一个用于动态创建模拟对象的便捷\
    \ Java API。\n\nEasy-Mock 使用了一种非常有趣的方法来指定哪些方法调用是允许的以及它们的返回值应该是：你通过调用这些方法来指定应该存在的方法调用！模拟控制对象（mock\
    \ control object）允许你为相应的模拟对象指定记录模式（record mode）和重放模式（replay mode）。当对象处于记录模式时，你可以直接调用所有你感兴趣的方法并设置期望的返回值。一旦完成，你就切换到重放模式。现在，当你调用这些方法时，你将获得你指定的返回值。\n\
    \n任何剩余的方法如果被调用，将会抛出运行时异常——但很棒的一点是你完全不需要定义其中任何一个。\n\n例如，假设我们有一个点播放机硬件控制器的接口，它有十多个方法，但在这个演示中我们只对一个感兴趣。（注意，我们在这里并没有真正测试任何东西，只是展示如何设置它。）\n\
    \n"
