    \nSome of these products are available in different versions, ranging from free,\
    \ entry-level versions to Enterprise-class editions with many bells and whistles.\
    \ The instructions for integrating JUnit into your IDE may vary depending on both\
    \ the product version and particular release, so we will not duplicate them here.\n\
    \n>¹http://junit.org\n\n## B.1 Command-line installation\n\nJUnit is provided\
    \ as a JAR file that contains all of the necessary classes. To install JUnit,\
    \ all you have to do is put the JAR file where your compiler can find it.\n\n\
    If you are not using an IDE, but are just using the JDK directly from the command\
    \ line, then you have to set your CLASSPATH to include the JUnit jar.\n\nOn Linux\
