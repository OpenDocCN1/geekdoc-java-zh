    # CHAPTER 7. PROPERTIES OF GOOD TESTS


    Sometimes an entire test method might only test one small aspect of a complex
    production method—you may need multiple test methods to exercise the one production
    method fully.


    Ideally, you''d like to be able to have a traceable correspondence between potential
    bugs and test code. In other words, when a test fails, it should be obvious where
    in the code the underlying bug exists.


    Independent also means that no test relies on any other test; you should be able
    to run any individual test at any time, and in any order. You don''t want to have
    to rely on any other test having run first.


    We''ve shown mechanisms to help you do this: the per-test setup and teardown methods
    and the per-class setup and teardown methods. Use these methods to ensure that
    every test gets a fresh start—and doesn''t impact any test that might run next.


    Remember, you aren''t guaranteed that Unit tests will run in any particular order,
    and as you starting tests and suites in ever-increasing numbers, you really can''t
    afford to carry ordering dependencies along with you.


    > John Donne may have been right about people, but not about unit tests: every
    test should be an island.


    # 7.5 Professional


    ![](img/b707d7ecf5b37c24434a141d9f59b58d_101_0.png)


    The code you write for a unit test is real; some may argue it''s even real than
    the code you ship to customers. This means that it must be written and maintained
    to the same professional standards as your production code. All the usual rules
    of good design—maintaining encapsulation, honoring the DRY principle, lowering
    coupling, etc.—must be followed in test code just as in production code.


    It''s easy to fall into the trap of writing very linear test code; that is, code
    that just plods along doing the same thing over and over again, using the same
    lines of code over and over again, with nari function or object in sight. That''s
    a bad thing. Test code must be written in the same manner as real code. That means
    you need to pull out common, repeated bits'
  - '[PAGE 102]


    of code and put that functionality in a method instead, so it can be called from
    several different places.


    You may find you accumulate several related test methods that should be encapsulated
    in a class. Don''t fight it! Go ahead and create a new class, even if it''s only
    ever used for testing. That''s not only okay, it''s encouraged: test code is real
    code. In some cases, you may even need to create a larger framework, or create
    a data-driven testing facility (remember the simple file reader for TestLargest
    on page 39?).


    Don''t waste time testing aspects that won''t help you. Remember, you don''t want
    to create tests just for the sake of creating tests. Test code must be thorough
    in that it test everything interesting about a method that is likely to contain
    a bug. If it''s not likely to contain a bug, don''t bother testing. It means that
    usually you shouldn''t waste time testing things like simple accessors:


    ```

    public Money getBalance() {

    return balance;

    }

    ```


    Frankly, there''s not much here to go wrong that the compiler can''t catch. Testing
    methods such as these are just a waste of time. However, if the accessor is doing
    some work along the way, then suddenly it becomes interesting—and we will want
    to test it:


    ```

    public Money getBalance() {

    return posted.getBalance() +

    unposted.getDebits() +

    unposted.getCredits();

    }

    ```


    That''s probably worth testing.


    Finally, expect that there will be at least as much test code written as there
    will be production code. Yup, you read that right. If you''ve got 20,000 lines
    of code in your product, then there would be reasonable to expect that there would
    lines or more of unit test code to exercise it. That''s a lot of test code, which
    is why it needs to be kept neat and tidy, well designed and well-factored, just
    as professional as the production code.'
  - '[PAGE 103]


    # 7.6 Testing the Tests


    There is one major conceptual weakness in our plans so far. Testing code to make
    sure it works is a great idea, but you have to write code to perform the tests.
    What happens when there are bugs in our test code? Does that mean you have to
    write test code to test the tests that test the code??? Where will it all end?


    Fortunately, you don''t need to go to that extreme. There are two things you can
    do to help ensure that the test code is correct:


    +   - Improve tests when fixing bugs

    - Prove tests by introducing bugs


    # How to Fix a Bug


    The steps you take when fixing a bug are very important to unit testing. Many
    times, an existing test will expose a bug in the code, and you can then simply
    test the code and watch the vigilant test pass.


    When a bug is found “in the wild” and reported back, that means there''s a hole
    in the net—a missing test. This is your opportunity to close the hole, and make
    sure that this bug never escapes again. All it takes is four simple steps:


    +   1. Identify the bug.

    2. Write a test that fails, to prove the bug exists.

    3. Fix the code that the test now passes.

    4. Verify that all tests still pass (i.e., you didn''t break anything else as
    a result of the fix).


    This simple mechanism of applying real-world feedback to help improve the tests
    is very effective. Over time, you can expect that your test coverage will steadily
    increase, and the number of bugs that escape into the wild from the existing code
    will decrease.


    Of course, as you write new code, you''ll undoubtedly introduce new bugs, and
    new classes of bugs, that aren''t being'
  - "[PAGE 104]\n\n```\npublic void testAdd() {\n  // Create a new account object\n\
    \  Account acct = new Account();\n  // Populate with our test person\n  acct.setPerson(TEST_PERSON_1);\n\
    \  // Add it to the database\n  Handler.add(acct);\n  // Should find it\n  assertTrue(Database.search(TEST_PERSON_1));\n\
    }\n```\n\n# Figure 7.1: TEST ADDING A PERSON TO A DATABASE\n\ncaught by the tests.\
    \ But when fixing any bug, ask yourself the key question:\n\n**Could this same\
    \ kind of problem happen anywhere else?**\n\nThen it doesn't matter whether you're\
    \ fixing a bug in an older feature or a new feature; either, apply what you've\
    \ just learned to the new-found knowledge in all the unit tests that are appropriate,\
    \ and you've done more than just fix one bug. You've caught a whole class of bugs.\n\
    \n# Spring the Trap\n\nIf you're not sure that a test is written correctly, the\
    \ easiest thing to do is to \"spring the trap\": cause the production code to\
    \ exhibit the very bug you're trying to detect, and verify that the test fails\
    \ as expected.\n\nFor instance, suppose you've got a test method that adds a customer\
    \ to the database and then tries to find it, something like the code in Figure\
    \ 7.1. Perhaps you're not certain that the \"finding\" part is really working\
    \ or not—it might be reporting success even if the record was not added correctly.\n\
    \nSo maybe you'll go into the add() method for DatabaseHandler and short-circuit\
    \ it: return instead of actually adding the record to the database. Now you should\
    \ see the assertion fail, because the record has not been added."
  - '[PAGE 105]


    Wait wait, you may cry, what be about a leftover record from a previous test run?
    No, Won''t that be in the database? No, it won''t, for several reasons:


    +   - You may not really be testing against a live database. The code exercised
    by the above test case lies between the add method shown and the actual low-level
    database calls. Those database calls may be well handled by a mock object, whose
    data is not held persistently in between.


    +   - Tests are independent. All tests can be run in any order, and do not depend
    on each other, even if a real database is part of this test, the setup and tear-down
    must ensure that you get a “clean sandbox” to play in. The attempt to spring the
    trap can help prove that this is true.


    Now the Extreme Programming folks claim that their disciplined practice of test-first
    development avoids the problem of poor tests that don''t fail when they should.
    In test-first development, you only ever write code to fix a failing test. As
    soon as the test passes, then you know the code you added it. This puts you in
    the position where you always know with absolute certainty that the code you introduced
    fixes the failing test that caused you to write the code in the first place.


    But there''s many a slip ‘twixt the cup and the lip, and while test-first development
    does improve the situation dramatically, there will still be opportunities to
    be misled by coincidences. For those occasions, you can satisfy any lingering
    doubts by deliberately “springing the trap” to make sure that all is as you expect.


    Finally, remember to write tests that are A-TRIP (Automatic, Thorough, Repeatable,
    Independent, Professional); keep adding to your unit tests as new bugs and types
    of bugs are discovered; and check to make sure your tests really find the bugs
    they target.


    Then sit back and watch problems on your project disappear like magic.'
- md: "\n# Chapter 8\n\n## Testing on a Project\n\nUp to now we've talked about testing\
    \ as an individual, solitary exercise. But of course, in the real world you'll\
    \ likely have teammates to work with. You'll all be unit testing together, and\
    \ that brings up a couple of issues.\n\n## 8.1 Where to Put Test Code\n\nOn a\
    \ small, one-person project, the location of test code and encapsulation of the\
    \ production code may not be very important, but on larger projects it can become\
    \ a critical issue. There are several different ways of structuring your production\
    \ and test code that we'll look at.\n\nIn general, you don't want to break any\
    \ encapsulation for the sake of testing (or as Mom used to say, \"don't expose\
    \ your privates!\"). Most of the time, you should be able to test a class by exercising\
    \ its public methods. If there is significant functionality that is hidden behind\
    \ private or protected access, that might be a warning sign that there's another\
    \ class in there struggling to get out. When push comes to shove, however it's\
    \ probably better to break encapsulation with working, tested code than it is\
    \ to have good encapsulation of untested, non-working code.\n\nIn Java, classes\
    \ in the same package can have access to each others' protected member variables\
    \ and methods; you can exploit this feature to allow some non-public access using\
    \ the schemes that follow.\n\n### Same directory\n\nSuppose you are writing a\
    \ class named:\n\n```\ncom.pragprog.wibble.Account\n```\n\nwith a corresponding\
    \ test in:\n\n```\ncom.pragprog.wibble.TestAccount\n```\n\nThe first and easiest\
    \ method of structuring test code is to include it right in the same directory\
    \ alongside the production code.\n\n```\ncom/\n  └── pragprog/\n      └── wibble/\n\
    \          ├── Account.java\n          └── TestAccount.java\n```\n\nThis has the\
    \ advantage that TestAccount can access protected member variables and methods\
    \ of Account. But the disadvantage is that the test code is lying around, cluttering\
    \ up the production code directory. This may or may not be a problem depending\
    \ on your IDE/compiler and your method of creating a release to ship to customers.\n\
    \nMost of the time, it's enough of a problem that we prefer one of the other solutions.\
    \ But for small projects, this might be sufficient.\n\n### Subdirectories\n\n\
    The next option is to create test subdirectories under every production directory.\n\
    \n```\ncom/\n  └── pragprog/\n      └── wibble/\n          ├── Account.java\n\
    \          └── test/\n              └── TestAccount.java\n```\n\nThis has the\
    \ advantage of moving the test code a little bit out of the way—not too far, but\
    \ at least not in the same directory as the production code. The disadvantage\
    \ is now that the test code is in a different package: TestAccount is now in com.pragprog.wibble.test.TestAccount.\
    \ You won't be able to access protected members unless your test code uses a subclass\
    \ of the production code that exposes the necessary members. For instance, suppose\
    \ the class you want to test looks like:\n\n```\npackage com.acme;\npublic class\
    \ Pool {\n    protected Date lastCleaned;\n    public void clear() {\n}\n}\n```\n\
    \nYou need to get at non-public bit of data that tells you when the pool was last\
    \ cleaned for testing, but there's no accessor for it (If there were, the pool\
    \ association would surely use us; they don't like to make that information public.)\
    \ So you make a subclass in the test subpackage that exposes it for testing.\n\
    \n```\npackage com.acme.test;\nimport com.acme.Pool;\npublic class PoolForTesting\
    \ extends Pool {\n    public Date getLastCleaned() {\n        return lastCleaned;\n\
    \    }\n}\n```\n\nYou then use PoolForTesting in the test code instead of using\
    \ Pool directly (see Figure 8.1 on the next page). In fact, you could make this\
    \ special class private to the test code (to ensure that we don't get sued.\n\n\
    ### Parallel Trees\n\nAnother option is to place your Test classes into the same\
    \ package as your production code, but in a different code tree. The trick is\
    \ to ensure that the root of both trees is in the compiler's CLASSPATH. In this\
    \ case, both prod and test should be in the CLASSPATH.\n\n| com.acme.Pool |\n\
    | --- |\n| #getLastCleaned() |\nprotected method in production code |\n\n| PRODUCTION\
    \ CODE | TEST CODE |\n| com.acme.test.PoolForTesting |\n| --- |\n| +getLastCleaned()\
    \ |\npublic in test code |\n\nFigure 8.1: SUBCLASSES EXPOSE METHODS FOR TESTING\n\
    \n- - prod/\n  - com/\n    - pragprog/\n      - wobble/\n        - Account.java\n\
    - - test/\n  - com/\n    - pragprog/\n      - wobble/\n        - TestAccount.java\n\
    \nNow the test code is *really* out of the way—maybe too far out of the way to\
    \ be convenient depending on your setup. But it certainly isn't lying near the\
    \ production code anymore more, and because the test code is in the same package,\
    \ it again enjoys preferential access.\n\nWhatever convention the team decides\
    \ to adopt, make sure it does so consistently. You cannot have some of the tests\
    \ in the system set up one way, and other tests elsewhere set up a different way.\
    \ Pick a style that looks like it will work in your environment and stick with\
    \ it for all of the system's unit tests.\n\n## 8.2 Test Courtesy\n\nThe biggest\
    \ difference between testing by yourself and testing with others lies in synchronizing\
    \ working tests and code.\n\nWhen with other members of a team, you will be using\
    \ some sort of version control system, such as CVS. (If you aren't familiar with\
    \ version control, or would like some assistance in getting it up and working\
    \ correctly, please see [TH03]).\n\nIn a team environment (and even in a personal\
    \ environment) you should make sure that when you check in code (or otherwise\
    \ make it available to everyone) that it has complete unit tests, and it passes\
    \ all of them. In fact, every test in the whole system should continue to pass\
    \ with your new code.\n\nThe rule is very simple: As soon as anyone else can access\
    \ your code\n\nMany teams institute policies to help \"remind\" developers of\
    \ the consequences of breaking the build, or breaking the tests. These policies\
    \ might begin by listing potential infractions involving code that you have checked\
    \ in (or otherwise made available to other developers):\n\n- Incomplete code (e.g.,\
    \ checking in only one class file forgetting to check in other files it may depend\
    \ upon.)\n- Code that doesn't compile.\n- Code that compiles, but breaks existing\
    \ code such that existing code no longer compiles.\n- Code without corresponding\
    \ unit tests.\n- Code with failing unit tests.\n- Code that passes its own tests,\
    \ but causes tests elsewhere to fail.\n\nIf found guilty of any of these heinous\
    \ crimes, you may be sentenced to providing donuts for the team next morning,\
    \ or beer or soda, or frozen margaritas, or maybe you'll have to nursemaid the\
    \ build machine, or some other menial task.\n\nBut what happens if you have to\
    \ make an incompatible change to the code, or if you make a change that does cause\
    \ other tests to fail?\n\nThe precise answer depends on the methodology and process\
    \ you're using on the project, but somehow you need to coordinate changes with\
    \ the folks who are responsible for the other pieces of code—which may well be\
    \ you! The idea is to make all of the necessary changes at once, so the rest of\
    \ the team sees a coherent picture (that actually works) instead of a fragmented,\
    \ non-functional “work in progress.” (For more information on how to use version\
    \ control to set up experimental developer branches, see [TH03])\n\nSometimes\
    \ the real world is not so willing, and it might take a few hours or even a few\
    \ days to work out all of the incompatible bits and pieces, during which time\
    \ the build is broken. If it can't be helped, make sure that it is well-communicated.\
    \ Make sure everyone knows that the build will be broken for the requisite amount\
    \ of time so that everyone can plan around it as needed. If you're not involved,\
    \ maybe it would be a good time to take your car in for an oil change or slip\
    \ off to the beach for a day or two. If you are involved, get it done quickly\
    \ so everyone else can come back from the beach and get to work!\n\n## 8.3 Test\
    \ Frequency\n\nHow often should you run unit tests? It depends on what you're\
    \ doing, and your personal habits, but here are some general guidelines that we\
    \ find helpful. You want to perform enough testing to make sure you're catching\
    \ everything you need to catch, but not so much testing that it interferes with\
    \ producing production code.\n\n## Write a new method\n\nCompile and run local\
    \ unit tests.\n"
  mdcn: "\n\n# 第 8 章\n\n## 对项目进行测试\n\n到为止，我们讨论的都是作为一项个人的、孤立的练习。但当然，在现实世界中，你可能会有队友一起工作。你们将共同进行单元测试，这引出了几个问题。\n\
    \n## 8.1 测试代码放在哪里\n\n在一个小型的、单人的项目中，测试代码的位置和生产环境代码的封装可能并不非常重要，但在较大的项目中，这可能会变成一个关键问题。有几种不同的结构化生产代码和测试代码的方法，我们将介绍这些方法。\n\
    \n总的来说，你不希望为了测试而破坏任何封装（或者用我妈妈常说的话，“不要暴露你的私密部位！”）。在大多数情况下，你应该能够通过执行它的公共方法来测试一个类。如果有重要的功能被隐藏在\
    \ `private` 或 `protected` 访问修符之后，这可能是一个警告信号，表明里面另一个类正在挣扎着想要出来。然而，在迫在眉头时，通过运行良好且经过测试的代码来破坏封装，可能比对未经过测试的、无法运行的代码进行良好的封装要好。\n\
    \n在 Java 中，同一个包中的类可以访问彼此的 `protected` 成员变量和方法；你可以利用这一特性，通过接下来的方案允许某些非公共访问。\n\n\
    ### 同一目录\n\n假设你正在编写一个名为类：\n\n```\ncom.pragprog.wibble.Account\n```\n\n其对应的测试类位于：\n\
    \n```\ncom.pragprog.wibble.TestAccount\n```\n\n结构化测试代码的第一种最简单的方法是将其直接包含在与生产代码相同的目录中。\n\
    \n```\ncom/\n  └── pragprog/\n      └── wibble/\n          ├── Account.java\n\
    \          └── TestAccount.java\n```\n\n这种方法的好处是 `TestAccount` 可以访问 `Account`\
    \ 的 `protected` 成员变量和方法。但缺点是测试代码到处都是，弄乱了生产代码目录。这可能是一个或不是问题，取决于你的 IDE/编译器以及你创建交付给客户的发布版本的方法。\n\
    \n在大多数情况下，这个问题已经大到让我们更倾向于使用其他解决方案了。但对于小型项目，这可能足够了。\n\n### 子目录\n\n下一个选项是在每个生产目录下创建测试子目录。\n\
    \n```\ncom/\n  └── pragprog/\n      └── wibble/\n          ├── Account.java\n\
    \          └── test/\n              └── TestAccount.java\n```\n\n这种方法的好处是将测试代码稍微移开位置——不是太远，但至少不在与生产代码相同的目录中。现在的缺点是测试代码位于不同的包中：`TestAccount`\
    \ 现在位于 `com.pragprog.wibble.test.TestAccount`。除非你的测试代码使用了生产代码的子类来暴露必要的成员，否则你无法访问\
    \ `protected` 成员。例如，假设你想测试的类看起来如下：\n\n```\npackage com.acme;\npublic class Pool\
    \ {\n    protected Date lastCleaned;\n    public void clear() {\n}\n}\n```\n\n\
    你需要获取一个非公共数据位，告诉你池上一次清理的时间以进行测试，但它没有相应的访问器（如果有的话，池关联类肯定会使用我们；他们不喜欢让该信息公开）。因此，你在测试子包中创建一个子类，以便为了测试而暴露它。\n\
    \n```\npackage com.acme.test;\nimport com.acme.Pool;\npublic class PoolForTesting\
    \ extends Pool {\n    public Date getLastCleaned() {\n        return lastCleaned;\n\
    \    }\n}\n```\n\n然后你在测试代码中使用 `PoolForTesting` 而不是直接使用 `Pool`（见下一页的图 8.1）。事实上，你可以让这个特殊类对测试代码私有（以确保我们不会被起诉）。\n\
    \n### 并行树\n\n另一个选项是将你的 `Test` 类放在与生产代码相同的包中，但在不同的代码树中。技巧是确保两棵树的根都在编译器的 `CLASSPATH`\
    \ 中。在这种情况下，生产和测试代码都应该在 `CLASSPATH` 中。\n\n| com.acme.Pool |\n| --- |\n| #getLastCleaned()\
    \ |\n生产代码中的受保护方法 |\n\n| 生产代码 | 测试代码 |\n| com.acme.test.PoolForTesting |\n| ---\
    \ |\n| +getLastCleaned() |\n测试代码中的公共方法 |\n\n图 8.1：子类暴露方法以进行测试\n\n- - prod/\n \
    \ - com/\n    - pragprog/\n      - wobble/\n        - Account.java\n- - test/\n\
    \  - com/\n    - pragprog/\n      - wobble/\n        - TestAccount.java\n\n现在，测试代码*真的*被移开了——取决于你的设置，可能移得太远了以至于不方便。但它确实不再躺在生产代码附近，而且由于测试代码在同一个包中，它再次享受到优先访问权限。\n\
    \n无论团队决定采用何种约定，都要确保其具有一致性。你不能让系统中的某些测试以一种方式设置，而其他地方的地方以另一种方式设置。选择一种看起来可以在你的环境中行的风格，并对系统中所有的单元测试坚持这种风格。\n\
    \n## 8.2 测试礼仪\n\n自己测试与他人共同测试最大的区别在于同步运行良好的测试和代码。\n\n当与团队的其他成员在一起工作时，你将使用某种版本控制系统，例如\
    \ CVS。（如果你不熟悉版本控制，请参阅 [TH03]）。在团队环境中（即使在个人环境中），你应该确保当你提交代码（或使其对其他人可用）时，它有完整的测试，并且通过了所有测试。\n\
    \n大多数情况下，这个问题已经大到让我们更倾向于使用其他解决方案了。许多团队会制定政策来帮助提醒开发者破坏构建的后果。这些政策可能从列出以下违规行为开始：\n\
    \n- 代码不完整（例如，忘记提交它可能依赖的其他文件）。\n- 无法编译的代码。\n- 可以编译但破坏了现有代码，导致现有代码无法编译。\n- 没有单元测试的代码。\n\
    - 单元测试失败的代码。\n- 通过了自身测试但导致其他地方测试失败的代码。\n\n如果犯了任何这些罪行，你可能会被判处为团队提供甜圈，或者啤酒或汽水，或者玛格丽，也许你必须照看构建机器或其他任务。\n\
    \n但如果你必须对代码进行不兼容的更改，或者你的更改确实导致了其他测试失败该怎么办？\n\n具体的答案取决于你正在使用的方法论和流程，但你需要与负责其他代码的人协调更改——这可能就是你自己！想法是一次性进行所有必要的更改，让团队的其他人看到一个连贯的画面，而不是碎片、不可功能的“进行中”（有关如何使用版本控制设置实验性分支的更多信息，请参阅\
    \ [TH03]）。\n\n有时现实世界并不那么理想，可能需要几小时甚至几天时间来解决所有不兼容的部分，在此期间构建处于损坏。如果无法避免，请确保进行良好的沟通。确保每个人都知道构建将在需要的时间内损坏，以便他们可以根据需要进行安排。如果你没有参与，也许现在是你给汽车换机油或去海滩玩两天的好机会。如果你参与了，请尽快完成，让其他人可以从海滩回来工作！\n\
    \n## 8.3 测试频率\n\n你应该多久运行一次单元测试？这取决于你在做什么以及你的个人习惯，但这里有一些我们非常有用的通用指南。你希望进行足够的测试以确保捕捉到需要捕捉的所有内容，但不要多到会干扰到生产代码的生成。\n\
    \n## 编写新方法\n\n编译并运行本地单元测试。\n\n"
