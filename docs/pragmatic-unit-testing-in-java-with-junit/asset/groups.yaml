    time to time. So you need to think about ways to test how well your method counts,
    and check to see just how many of a thing you may have.


    It''s a related problem to Existence, but now you want to make sure you have exactly
    as many as you need, or that you''ve made exactly as many as needed. In most cases,
    the count of some set of values is only interesting in these three cases:


    +   - Zero

    - One

    - More than one


    It''s called the "0-1-n Rule," and it''s based on the premise that if you can
    handle more than one of something, you can probably handle 10, 20, or 1,000 just
    as easily. Most of the time that''s true, so many of our tests for cardinality
    are concerned with whether we have 2 or more of something. Of course there are
    situations where an exact count makes a difference—10 might be important to you,
    or 250.


    Suppose you are maintaining a list of the Top-Ten food items ordered in a pancake
    house. Every time an order is taken, you have to adjust the top-ten list. You
    also provide the current top-ten list as a real-time data feed to the pancake
    boss''s PDA. What sort of things might you want to test for?


    +   - Can you produce a report when there aren''t yet ten items in the list?

    - Can you produce a report when there are no items on the list?

    - Can you produce a report when there is only one item on the list?

    - Can you add an item when there aren''t yet ten items in the list?

    - Can you add an item when there are no items on the list?

    - Can you add an item when there is only one item on the list?

    - What if there aren''t ten items on the menu?

    - What if there are no items on the menu?'
