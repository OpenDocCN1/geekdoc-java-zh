  - '[PAGE 112]


    # Fix a bug


    Run tests to demonstrate bug: fix and re-run unit tests.


    # Any successful compile


    Run local unit tests.


    # Each check-in to version control


    Run all module or system tests.


    # Continuously


    A dedicated machine should be running a full build and test, from scratch, automatically
    throughout the day (either periodically or on check-in to version control).


    Note that for larger projects, you might not be able to compile and test the whole
    system in under a few hours. You may only be able to run a full build and test
    overnight. For even larger projects, it might have to be every couple of days—and
    that''s a shame, because the longer the time between automatic builds the longer
    the “feedback gap” between creation of a problem and its identification.


    The reason to have a more-or-less continuous build is that it can identify any
    problems quickly. You don''t want to wait for another developer to stumble upon
    a build problem if you can help it. Having a build machine act as a constant developer
    increases the odds that it will find a problem, instead of a real developer.


    When the build machine does find a problem, then the whole team can be alerted
    to fact that it''s not safe to get any new code just yet, and can continue working
    with what they have. That''s better than getting stuck in a situation where you''ve
    got fresh code that doesn''t work.


    For more information on setting up automatic build and testing systems. nightly
    and continuous builds, and automation in general please see [Cla04].


    # 8.4 Tests and Legacy Code


    So far, we''ve talked about performing unit tests in the context of new code.
    But we haven''t said what to do if your project has a lot of code already—code
    that doesn''t have unit tests.'
  - '[PAGE 113]


    It depends on what kind of state that code is in. If it''s reasonably well-factored
    and modular, such that you can get at all of the individual pieces you need to,
    then you can add unit tests fairly easily. If, on the other hand, it''s just a
    “big ball of mud” all tangled together, then it might be close to impossible to
    test without substantial rewriting. Most older projects aren''t perfectly factored,
    but are usually modular enough that you can add unit tests.


    For new code that you write, you''ll obviously write unit tests as well. This
    may mean that you''ll have to expose or break out parts of the existing system,
    or create mock objects in order to test your new functionality.


    For existing code, you might choose to methodically add unit tests for everything
    that is testable. But that''s not very pragmatic. It''s better to add tests for
    the most broken stuff first, to realize a better return on investment of effort.


    The most important aspect of unit tests in this environment is to prevent back-sliding:
    to avoid the death-spiral where maintenance fixes and enhancements cause bugs
    in existing features. We use JUnit unit tests as regression tests during normal
    code development (to make sure new code doesn''t break anything that had been
    working), but regression testing is even more important when dealing with legacy
    code.


    And it doesn''t have to cover the entire legacy code base, just the painful parts.
    Consider the following true story from a pragmatic developer:


    # Regression Tests Save the Day


    “Tibbert Enterprises¹ ships multiple applications, all of which are based on a
    common Lower Level Library that is used to access the object database.


    One day I overheard some application developers talking about a persistent problem
    they were having. In the product''s Lower level interface, you can look up objects
    using the object name, which includes a path to the object. Since the application


    > ¹Not their real name.'
  - '[PAGE 114]


    has several layers between it and the Lower Level code, and the Lower Level code
    has several layers to reach the object database, it takes a while to isolate a
    problem when the application breaks.


    After half of the application team spent an entire day tracking down the bug,
    they discovered the bug in the Lower Level code that accessed the database. If
    you had a space in the name, the application died a violent, messy death. After
    isolating the Lower Level code related to the database access, they presented
    the bug to the owner of the code, along with a fix. He thanked them, incorporated
    their fix, and committed the fix into the repository.


    But the next day, the application died. Once again, a team of application developers
    tracked it down. It took only half-a-day this time (as they recognized the code
    paths by now), and the bug was in the same place. This time, it was a space in
    the path to the object that was failing, instead of a space in the name itself.
    Apparently, while integrating the fix, the developer had introduced a new bug.
    Once again, they tracked it down and presented him with a fix. It''s Day Three,
    and the application is failing again! The developer in question re-introduced
    the original bug.


    The application manager and I sat down and figured out that the equivalent of
    nearly two months of effort had been spent on this issue over the course of one
    week by his team alone (and likely affected other teams throughout the company).
    We then developed API calls that tested the Lower Level calls that the application
    product was using, and added tests for database access spaces in both the object
    name and in the path. We put the product under the control of our continuous-build-and-test
    program (using Cruise-Control) so that the unit tests were run automatically every
    time code committed back to the repository.


    Sure enough, the following week, the test failed'
  - '[PAGE 115]


    on two successive days, at the hands of the original developer. He actually came
    to my office, shook my hand, and thanked me when he got the automatic notification
    that the tests had failed.


    You see, without the JUnit test, the bad code made it out to the entire company
    during the nightly builds. But with our continuous build and test, he (and his
    manager and tester) saw the failure at once, and he was able to fix it immediately
    before anyone else in the company used the code. In fact, this test has failed
    half a dozen times since then. But it gets caught, so not a big deal anymore.
    The product is now stable because of these tests.


    We now have a rule that any issue pops twice must have a JUnit test by the end
    of the week.


    In this story, TibbertEnterprises aren''t using JUnit to prove things work so
    much as they are using to inoculate against known issues. As they slowly catch
    up, they''ll eventually expand to cover the entire product with unit tests, not
    just the broken parts.


    When you come into a shop with no automated tests of any kind, this seems to be
    a very effective approach. Remember, the only way to eat an elephant is one bite
    at a time.


    # 8.5 Tests and Reviews


    Teams that enjoy success often hold code reviews. This can be an informal affair
    where a senior person just gives a quick look at the code. Or perhaps two people
    are working on the code together, using Extreme Programming’s “Pair Programming”
    practice. Or maybe it’s a very formal affair with check-lists and a small committee.


    However you perform code reviews (and we suggest that you do), make the test code
    an integral part of the review process. Since test code is held up to the same
    high standards as production code, it should be reviewed as well.


    In fact, it can sometimes be helpful to expand on the idea of “test-first design”
    to include both writing and reviewing test'
