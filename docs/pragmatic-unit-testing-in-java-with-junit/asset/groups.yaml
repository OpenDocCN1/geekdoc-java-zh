  - '[PAGE 29]


    # I feel guilty about putting testers and QA staff out of work


    Not to worry, you won''t. Remember we''re only talking about unit testing, here.
    It''s the barest-bones, lowest-level testing that''s designed for us, the programmers.
    There''s plenty of other work to be done in the way of functional testing, acceptance
    testing, performance and environmental testing, validation and verification, formal
    analysis, and so on.


    # My company won''t let me run unit tests on the live system


    Whoa! We''re talking about developer unit-testing here. While we might be able
    to run those same tests in other contexts (on the live, production system, for
    instance) they are no longer unit tests. Run your unit tests on your machine,
    using your own database, or using a mock object (see Chapter 6).


    If the QA department or other testing staff want to run these tests in a production
    or staging environment, you might be able to coordinate the technical details
    with them so they can, but realize that they are no longer unit tests in that
    context.


    # 1.7 Roadmap


    Chapter 2, Your First Unit Tests, contains an overview of test writing. From there
    we''ll take a look at the specifics of Writing Tests in JUnit in Chapter 3. We''ll
    spend a few chapters on how you come up with what needs testing, and how to test
    them.


    Next we''ll look at the important properties of good tests in Chapter 7. We then
    talk about what you need to do to test effectively in your project in Chapter
    8. This chapter also discusses how to handle existing projects with lots of legacy
    code. Chapter 9, Design Issues, then looks at how testing can influence your application''s
    design (for the better).


    The appendices contain additional useful information: a look at common unit testing
    problems, a note on installing JUnit, a sample JUnit skeleton program, and a list
    of resources including the bibliography. We finish off with a summary containing
    the book''s tips and suggestions.


    So sit back, relax, and welcome to the world of better coding.'
