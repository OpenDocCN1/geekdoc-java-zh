  mdcn: "\n我们将此项加入到了评审期间需要检查的已知典型问题列表中。在代码审查时，一旦发现这些臭名昭彰的 `catch` 语句，首先对其进行标识，然后建立适当的单元测试来强制触发各种错误条件（RIGHT-BICEP\
    \ 中的“E”），并修复代码以传播或处理该异常。得益于这一简单的流程，系统的稳定性得到了极大的提升。\n\n# 第 9 章\n\n# 设计问题\n\n到目前为止，我们讨论了单元测试，因为它可以帮助你理解并验证代码的功能性、操作性。但单元测试也为改进代码的设计和架构提供了若干机会。\n\
    \n在本章中，我们将关注以下设计层面的问题：\n\n-   通过为可测试性进行设计来更好地实现关注点分离\n-   通过定义类不变性（class invariants）来明确设计\n\
    -   通过测试驱动设计改进接口\n-   建立并局部化验证职责\n\n## 9.1 为可测试性进行设计\n\n“关注点分离”可能是软件设计和实现中最重要的概念。它是一个涵盖性术语，融合了封装、正交性、耦合以及所有可以归结为“编写害性代码”的计算机科学术语\
    \ [HT00]。\n\n通过显式地设计可测试的代码，你可以保持代码良好的良好构（即“害性”的）并使其更容易维护。例如，假设你正在编写一个方法，它将一直睡眠到下一个小时开始。你进行了一系列计算，然后调用了\
    \ `sleep()`：\n\n```java\npublic void sleepUntilNextHour()\nthrows InterruptedException\
    \ {\n    int howlong;\n\n    // 计算需要等待多久...\n\n    Thread.sleep(howlong);\n  \
    \  return;\n}\n```\n\n你将如何测试它？等上一个小时？设置一个计时器，调用该方法，等待方法返回，检查计时器，处理方法在应该被调用时未被调用的这——开始变得非常混乱。\n\
    \n也许你可能会重构这个方法，仅仅为了让测试变得简单。与其将睡眠多少毫秒的计算与 `sleep()` 方法本身结合，不如将它们分开：\n\n```java\n\
    public void sleepUntilNextHour()\nthrows InterruptedException {\n    int howlong\
    \ = millisecondsToNextHour(new Date());\n    Thread.sleep(howlong);\n    return;\n\
    }\n```\n\n什么可能会出问题？系统的 `sleep` 调用吗？可以很有说 Java 的 `Thread.sleep()` 工作正如其描述的那样（即使它没有如此，我们的规则也是总是首先怀疑自己的代码）。\n\
    \n```java\nassertEquals(10000, milliToNextHour(TEST_DATE_10));\n```\n\n如果我们确信\
    \ `millisecondsToNextHour()` 的运行符合我们的预期，那么 `sleepUntilNextHour()` 的顺序也将是可靠——如果不是，我们至少知道问题一定与\
    \ `sleep` 本身有关，而不是数值计算有关。你甚至可以在某些其他语文中重用 `millisecondsToNextHour()` 方法。\n\n这就是我们所说的，通过提高代码的可测试性来改进代码设计。通过修改代码以便能够进入其中并进行测试，你最终将获得一个更简洁的设计，不仅更容易扩展和维护，也更便于测试。\n\
