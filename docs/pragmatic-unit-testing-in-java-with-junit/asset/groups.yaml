    # CHAPTER 3. WRITING TESTS IN JUNIT


    # TestAccount.java


    ```

    testCreateAccount()

    testCreateAcctDef()

    testCreateAcctDup()

    (Internal Only)

    ```


    ```

    Account.java

    createAccount()

    (Delivered)

    ```


    Figure 3.1: TEST CODE AND PRODUCTION CODE


    The test code must be written to do a few things:


    +   - Set up all conditions needed for testing (create any required objects, allocate
    any needed resources, etc.)

    - Call the method to be tested

    - Verify that the method to be tested functioned as expected

    - Clean up after itself


    You write test code and compile it in the normal fashion, as you would any other
    bit of source code in your project. It might happen to use some additional libraries,
    but otherwise there''s no magic—it''s just regular code.


    When it''s time to execute the code, remember that you never actually run the
    production code directly; at least, not the way a user would. Instead, you run
    the test code, which in turn exercises the production code under very carefully
    controlled conditions.


    We''ll be showing the conventions for JUnit, using Java, in our examples, but
    the general concepts are the same for any testing framework in any language or
    environment. If you don''t have JUnit installed on your computer yet, see Appendix
    B on page 127 and then come on back, and we''ll take a look at the JUnit-specific
    method calls and classes.


    # 3.2 JUnit Asserts


    As we''ve seen, there are some helper methods that assist you in determining whether
    a method under test is performing'
  - "[PAGE 40]\n\ncorrectly or not. Generically, we call all these methods assertions.\
    \ They let you assert that some condition is true: that two bits of data are equal,\
    \ or not, and so on. We'll take a look at each one of the assert methods that\
    \ JUnit provides next.\n\nAll of the following methods will record failures (that's\
    \ when the assertion is false) or errors (that's when you get an unexpected exception),\
    \ and report these through the JUnit classes. For the test version, this means\
    \ an error message printed to the console. The GUI version will show a red bar\
    \ and supporting details to indicate a failure.\n\nWhen a failure or error occurs,\
    \ execution of the current test method within the same test class will still be\
    \ run.\n\nAssert are the fundamental building block for unit tests; the JUnit\
    \ library provides a number of different forms of assert.\n\n# assertEquals\n\n\
    ```\nassertEquals([String message],\n              expected,\n              actual)\n\
    ```\n\nThis is the most-often used form of assert. expected is a value you hope\
    \ to see (typically hard-coded), and actual is a value actually produced by the\
    \ code under test. message is an optional message that will be reported in the\
    \ event of a failure. You can omit the message argument and simply provide the\
    \ expected and actual values.\n\nAny kind of object may be tested for equality;\
    \ the appropriate equals method will be used for the comparison. In particular,\
    \ you can compare the contents of strings using this method. Different method\
    \ signatures are also provided for all the native types (boolean, int, short,\
    \ etc.) and Object. Be aware that the equals method for native arrays, however,\
    \ does not compare the contents of the arrays, just the array reference itself,\
    \ which is probably not what you want.\n\nComputers cannot represent floating-point\
    \ numbers exactly, and will usually be a little bit. Because of this, if you are\
    \ using an assert to compare floating point numbers (floats or doubles in Java),\
    \ you need to specify one piece"
  - '[PAGE 41]


    of information, the tolerance. This specifies just how close to "equals" you need
    the result to be. For most business applications, 4 or 5 decimal places is probably
    enough. For scientific apps, you may need much greater precision.


    ```

    assertEquals([String message],

    expected,

    actual,

    tolerance)

    ```


    For instance, the following assert will check that the actual result is equal
    to 3.33, but only look at the first two decimal places:


    ```

    assertEquals("Should be 1/3", 3.33, 10.0/3.0, 0.01);

    ```


    # assertNull


    ```

    assertNull([String message], java.lang.Object object)

    assertNotNull([String message], java.lang.Object object)

    ```


    Asserts that the given object is null (or not null), failing otherwise. The message
    is optional.


    # assertSame


    ```

    assertSame([String message], expected, actual)

    ```


    Asserts that expected and actual refer to the same object, and fails the test
    if they do not. The message is optional.


    ```

    assertNotSame([String message], expected, actual)

    ```


    Asserts that expected and actual do not refer to the same object, and fails the
    test if they are the same object. The message is optional.


    # assertTrue


    ```

    assertTrue([String message], boolean condition)

    ```


    Asserts that the given boolean condition is true, otherwise the test fails. The
    message is optional.


    If you find test code is littered with the following:


    ```

    assertTrue(true);

    ```


