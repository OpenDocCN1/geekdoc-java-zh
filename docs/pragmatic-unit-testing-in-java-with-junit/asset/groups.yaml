    # Chapter 3


    # Writing Tests in JUnit


    We''ve looked at writing tests somewhat informally in the last chapter, but now
    it''s time to take a deeper look at the difference between test code and production
    code, all the various forms of JUnit''s assert, the structure and composition
    of JUnit tests, and so on.


    # 3.1 Structuring Unit Tests


    When writing test code, there are some naming conventions you need to follow.
    If you have a method named createAccount that you want to test, then your first
    test method might be named testCreateAccount. The method CreateAccount will call
    createAccount with the necessary parameters and verify that createAccount works
    as advertised. You can, of course, have many test methods that exercise createAccount.


    The relationship between these two pieces of code is shown in Figure 3.1 on the
    following page.


    The test code is for our internal use only. Customers or endusers will never see
    or use it. The production code—that is, the code that will eventually be shipped
    to a customer and put into production—must therefore not know anything about the
    test code. Production code will be thrust out into the cold world all alone, without
    the test code.'
