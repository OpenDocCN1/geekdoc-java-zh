    \ TestClassComposite extends TestCase {\n    public TestClassComposite(String\
    \ method) {\n        super(method);\n    }\n    static public Test suite() {\n\
    \        TestSuite suite = new TestSuite();\n        // Grab everything;\n   \
    \     suite.addTestSuite(TestClassOne.class);\n        // Use the test method:\n\
    \        suite.addTest(TestClassTwo.suite());\n        return suite;\n    }\n\
    }\n```\n\nNow if you run TestClassComposite, the following test methods will be:\n\
    \n- testAddition() from TestClassOne\n- testSubtraction() from TestClassOne\n\
    - testShortTest() from TestClassTwo\n- testAnotherShortTest() from TestClassTwo\n\
    \nYou can keep going with this scheme; another class might include TestClassComposite,\
    \ which would include the above methods, with some other composite of tests, and\
    \ so on.\n\n## Pre-test Setup and Tear-down\n\nEach test should run independently\
    \ of every other test; this allows you to run any individual test at any time,\
    \ in any order.\n\nTo accomplish this feat, you may need to reset some parts of\
    \ the testing environment between tests, or clean up after a test has run. JUnit's\
    \ TestCase base class provides two methods that you can override to set up and\
    \ tear down the test's environment:\n\n```\nprotected void setUp();\nprotected\
    \ void tearDown();\n```\n\nThe method setUp() will be called before each one of\
    \ the test methods is executed, and the method tearDown() will be called after\
    \ each test is executed.\n"
  mdcn: "\n对于逻辑来说，这可能是一个坏主意。特别是，你最不希望看到的是一整页的“测试”代码，却在最后处只有一个 `assertTrue(true)`（即：“代码运行到了最末端没有崩溃，所以它一定能工作”）。\n\
    那不是测试，是你的一厢情愿。\n\n除了测试真（true）之外，你也可以测试假（false）：\n\n```\nassertFalse([String message],\
    \ boolean condition])\n```\n\n断言给定的布尔条件是否为假，否则测试将失败。消息是可选的。\n\n# fail\n\n```\n\
    fail([String message])\n```\n\n立即使测试失败，并带上可选的消息。通常用于标记不应该被执行的代码段（例如，在预期会发生异常之后）。\n\
    \n# 使用断言\n\n你通常在一个给定的测试方法中会有多个断言，你借此证明被测试方法的各个方面和关系。当某个断言失败时，该测试方法将终止——该方法中剩余的断言此时将不再被执行。但这不应该引起任何担心；无论如何，你都必须先修复失败的测试。然后修复下一个失败的测试，并以此类推。\n\
    \n你通常应该期望所有测试始终通过。在实践中，这意味着当引入引入一个 bug 时，只有一个或两个测试会失败。在这种环境下，隔离问题通常非常容易。\n\n在有测试失败的情况下，你不应该继续添加新功能！一旦测试失败，立即修复任何测试，并保持所有测试始终通过。\n\
    \n为了保持纪律，你需要一种简单的方法运行测试——或者运行测试组、特定的子系统等。\n\n## 3.3 JUnit 框架\n\n到为止，我们只看了断言方法本身。但你不能仅仅把断言方法写进源文件并期望它工作；你需要比这多一点的框架。幸运的是，这并不复杂。\n\
    \n这是一段非常简单的测试代码，说明了你启动所需的最小框架。\n\n```\nimport junit.framework.*;\npublic class\
    \ TestSimple extends TestCase {\n    public TestSimple(String name) {\n      \
    \  super(name);\n    }\n    public void testAdd() {\n        assertEquals(2, 1+1);\n\
    \    }\n}\n```\n\n这段代码非常直观，但让我们逐一查看每个部分。\n\n首先，第 1 行的 `import` 语句引入了必要的 JUnit\
    \ 类。\n\n接下来，我们看第 3 行的类定义：每个包含测试的类必须如所示继承 `TestCase`。基类 `TestCase` 提供了我们所需的大单元测试功能，包括我们在上面描述的所有断言方法。\n\
    \n基类要求一个接收 `String` 的构造函数，因此我们必须提供对 `super` 的调用并传入一个名称。我们目前还不知道应该是什么名称，所以我们只需让自己的构造函数接收一个\
    \ `String` 并在第 5 行将其传递下去。\n\n最后，测试类包含以 `test....` 命名的独立方法。在示例中，我们在第 9 行有一个名为 `testAdd`\
    \ 的测试方法。所有以 `test` 开头的方法都会由 JUnit 自动运行。你也可以通过定义一个 `suite` 方法来指定运行特定的方法；这一点稍后会详细介绍。\n\
    \n在上一个示例中，我们在单个测试方法中使用单个断言展示了单个测试。当然，在测试方法内部，你可以放置任意数量的：\n\n```\npublic void testAdds()\
    \ {\n    assertEquals(2, 1+1);\n    assertEquals(4, 2+2);\n    assertEquals(-8,\
    \ -12+4);\n}\n```\n\n在这里，我们在测试方法中有三个 `assertEquals`。\n\n## 3.4 JUnit 测试组合\n\n\
    正如我们目前看到的，一个测试类包含测试方法；每个方法包含一个或多个断言语句。但测试类也可以调用其他测试类：单个类、包，甚至整个系统。\n\n这种魔法通过创建“测试套件”（test\
    \ suites）来实现。任何测试类都可以包含一个名为 `suite` 的静态测试方法：\n\n```\npublic static Test suite();\n\
    ```\n\n你可以提供一个 `suite()` 方法来返回你想要的测试集合（如果没有 `suite()` 方法，JUnit 会自动运行所有的 `test...`\
    \ 方法）。但你可能想手动添加特定的测试，包括来自其他套件的结果。\n\n例如，假设你有一组普通的测试，正如我们已经看到的，在一个名为 `TestClassOne`\
    \ 的类中所示。\n\n```\nimport junit.framework.*;\npublic class TestClassOne extends\
    \ TestCase {\n    public TestClassOne(String method) {\n        super(method);\n\
    \    }\n    public void testAddition() {\n        assertEquals(4, 2+2);\n    }\n\
    \    public void testSubtraction() {\n        assertEquals(0, 2-2);\n    }\n}\n\
    ```\n\n使用 Java 反射处理此类的默认操作将是运行 `testAddition()` 和 `testSubtraction()` 测试方法。\n\n\
    现在假设你有第二个类 `TestClassTwo`。它使用暴力破解算法来寻找你的推销员 Bob 在其历史中访问前 $n$ 个城市的最短路径。推销员算法的有趣之处在于，对于数量较少的城市它运行良好，但它是一个指数级算法——例如，几百个城市可能需要\
    \ 20,000 年才能运行。即使是 50 个城市也需要几个小时，所以你可能不想默认包含那个测试。\n\n```\nimport junit.framework.*;\n\
    public class TestClassTwo extends TestCase {\n    public TestClassTwo(String method)\
    \ {\n    }\n\n    // 这一个需要几个小时...\n    public void testRunner() {\n        TSP\
    \ tsp = new TSP(); // Load with cities\n        assertEquals(2300, tsp.shortestPath(50));\
    \ // top 50\n    }\n\n    public void testShortTest() {\n        TSP tsp = new\
    \ TSP(); // Load with cities\n        assertEquals(140, tsp.shortestPath(50));\
    \ // top 50\n    }\n\n    public void testAnotherTest() {\n        TSP tsp = new\
    \ TSP(); // Load with cities\n        assertEquals(586, tsp.shortestPath(10));\
    \ // top 10\n    }\n\n    public static Test suite() {\n        TestSuite suite\
    \ = new TestSuite();\n        // Only include short tests\n        suite.addTest(new\
    \ TestClassTwo(\"testShortTest\"));\n        suite.addTest(new TestClassTwo(\"\
    testAnotherTest\"));\n        return suite;\n    }\n}\n```\n\n此外，现在我们可以看到构造函数的\
    \ `String` 参数是做什么的：它允许 `TestCase` 返回一个命名方法的引用。我们正使用它获取两个快速测试来填充我们的测试套件。\n\n##\
    \ JUnit 测试组合\n\n你可能希望有一个由这两个测试类组合的高级测试：\n\n```\nimport junit.framework.*;\npublic\
    \ class TestClassComposite extends TestCase {\n    public TestClassComposite(String\
    \ method) {\n        super(method);\n    }\n    static public Test suite() {\n\
    \        TestSuite suite = new TestSuite();\n        // Grab everything;\n   \
    \     suite.addTestSuite(TestClassOne.class);\n        // Use the test method:\n\
    \        suite.addTest(TestClassTwo.suite());\n        return suite;\n    }\n\
    }\n```\n\n现在如果你运行 `TestClassComposite`，将测试方法是：\n\n- 来自 `TestClassOne` 的 `testAddition()`\n\
    - 来自 `TestClassOne` 的 `testSubtraction()`\n- 来自 `TestClassTwo` 的 `testShortTest()`\n\
    - 来自 `TestClassTwo` 的 `testAnotherTest()`\n\n你可以继续这种方案；另一个类可能包含 `TestClassComposite`，它包含上述方法以及其他测试组合，以此类推。\n\
    \n## 测试前设置与清理\n\n每个测试都应该与其他任何测试独立运行；这允许你在任何时间、任何顺序运行任何单独测试。\n\n为了实现这一目标，你可能需要在测试之间重置测试环境的某些，或者在测试运行时进行清理。JUnit\
    \ 的 `TestCase` 基类提供了两个可以重写的方法，用于设置和清理测试环境：\n\n```\nprotected void setUp();\nprotected\
    \ void tearDown();\n```\n\n`setUp()` 方法将在执行每个测试方法之前调用，而 `tearDown()` 方法将在每个测试执行后调用。\n"
