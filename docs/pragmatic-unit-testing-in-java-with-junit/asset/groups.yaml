    \ largest(int[] list);\n```\n\n换句话说，给定一个如 [7, 8, 9] 这样的数字数组，该方法应该返回 9。这是一个合理的第一个测试。你凭直觉还能想到哪些其他测试？在继续阅读之前，请花一分钟时间为这个简单的方法写下尽可能多的测试用例。\n\
