    \n# 我对测试人员和 QA 员工失业感到内疚\n\n不用担心，不会的。记住我们在这里讨论的只是单元测试。这是为我们程序员设计的最基础、最低层次的测试。在功能测试、验收测试、性能和环境测试、验证与确认、形式化分析等方面，还有大量工作要做。\n\
    \n# 我的公司不让我在现场系统上运行单元测试\n哇！我们在这里讨论的是开发者测试。虽然我们可以在其他语境下运行相同的测试（例如在现场系统上），但它们不再是单元测试了。在你的机器上运行你的单元测试，使用你自己的数据库，或使用\
