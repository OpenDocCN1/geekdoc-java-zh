    \ mp3.currentSong());\nassertTrue(mp3.isPlaying());\n```\n\n# Chapter 7\n\n##\
    \ Properties of Good Tests\n\nUnit tests are very powerful magic, and if used\
    \ badly can cause an enormous amount of damage to a project by wasting your time.\
    \ If unit tests aren't written and implemented properly, you can easily waste\
    \ so much time maintaining and debugging the tests themselves that the production\
    \ code—and the whole project—suffers.\n\nWe can't let that happen; remember, the\
    \ whole reason you're doing unit testing in the first place is to make your life\
    \ easier! Fortunately, there are only a few simple guidelines that you need to\
    \ follow to keep trouble from brewing on your project.\n\nGood tests have the\
    \ following properties, which makes A-TRIP:\n\n- Automatic\n- Repeatable\n- Independent\n\
    - Professional\n\nLet's look at what each of these words means to us.\n\n### 7.1\
    \ Automatic\n\nUnit tests need to be run automatically. We mean “automatically”\
    \ in at least two ways: invoking the tests and checking the results.\n\nIt must\
    \ be really easy for you to invoke one or more unit tests, as you will be doing\
    \ it all day long, day in day and day out. So it really can't be any more complicated\
    \ than pressing one button in the prompt or typing in one command in IDEs to run\
    \ the tests you want. Some IDEs can even be set up to run the tests continuously\
    \ in the background.\n\nIt’s important to maintain this environment: don’t introduce\
    \ a test that breaks the automatic model by requiring manual steps. Whatever the\
    \ test requires (database, network connections, etc.), make these an automatic\
    \ part of the test itself. Mock objects, as described in Chapter 6, can help insulate\
    \ you from changes in the real environment.\n\nBut you're not the only running\
    \ tests. Somewhere a machine should be running all of the unit tests for all checked-in\
    \ code continuously. This automatic, unattended check acts as a “back stop”: a\
    \ safety mechanism to ensure that whatever is checked in hasn't broken any tests,\
    \ anywhere. In an ideal world, this wouldn't be necessary as you could count on\
    \ every individual developer to run all the necessary tests themselves.\n\nBut\
    \ this isn't an ideal world. Maybe an individual didn't run some necessary test\
    \ in a remote center of the project. They have some code on their own machine\
    \ that makes it all work—but they haven't checked that code in, so even though\
    \ the tests work on their own machine, those same tests fail everywhere else.\n\
    \nYou may want to investigate systems such as CruiseControl¹, AntHill², Tinder³.\
    \ These are freely available, open source products that manage continuous building\
    \ and testing. We describe setting up a continuous-build and testing environment\
    \ in Volume III of the Starter Kit [Cla04].\n\n¹ http://cruisecontrol.sourceforge.net\n\
    ² http://www.cs.unibo.it/projects/anthill\n³ http://www.mozilla.org/tinderbox.html\n\
    \nFinally, by “automatic” we mean that the test must determine for itself whether\
    \ it passed or failed. Having a person (you) or some other hapless victim read\
    \ through the test output and determine whether the code is working or not is\
    \ a recipe for project failure. It's an important feature of consistent regression\
