    \ testing for true, you can also test for false:\n\n```\nassertFalse([String message],\
    \ boolean condition])\n```\n\nAsserts that the given boolean condition is false,\
    \ otherwise the test fails. The message is optional.\n\n# fail\n\n```\nfail([String\
    \ message])\n```\n\nFails the test immediately, with the optional message. Often\
    \ used to mark sections of code that should not be reached (for instance, after\
    \ an exception is expected).\n\n# Using asserts\n\nYou usually have multiple asserts\
    \ in a given test method, you prove various aspects and relationships of the method(s)\
    \ under test. When an assert fails, that test method will be aborted—the remaining\
    \ assertions in that method will be executed this time. But that shouldn't be\
    \ of any concern; you have to fix the failing test before you can proceed anyway.\
    \ And you fix the next failing test. And and so on.\n\nYou should normally expect\
    \ that all tests pass all of the time. In practice, that means when you introduce\
    \ a bug, only one or two tests fail. Isolating the problem is usually pretty easy\
    \ in that environment.\n\nUnder circumstances should you continue to add features\
    \ when there are failing tests! Fix any test as soon as it fails, and keep all\
    \ tests passing all of the time.\n\nTo maintain discipline, you'll need an easy\
    \ way to run the tests—or to run groups of tests, particular subsystems, and so\
    \ on.\n\n## 3.3 JUnit Framework\n\nSo far, we've just looked at the assert methods\
    \ themselves. But you can't just stick assert methods into a source file and expect\
    \ it to work; you need a little bit more of a framework than that. Fortunately,\
    \ it's not too much more.\n\nHere is a very simple piece of test code that illustrates\
    \ the minimum framework you need to get started.\n\n```\nimport junit.framework.*;\n\
    public class TestSimple extends TestCase {\n    public TestSimple(String name)\
    \ {\n        super(name);\n    }\n    public void testAdd() {\n        assertEquals(2,\
    \ 1+1);\n    }\n}\n```\n\nThis code is pretty straightforward, but let's take\
    \ a look at each part in turn.\n\nFirst, the import statement on line 1 brings\
    \ in the necessary JUnit classes.\n\nNext, we have the class definition on line\
    \ 3: each class that contains tests must extend TestCase as shown. The base class\
    \ TestCase provides most of the unit-testing functionality that we'll need, including\
    \ all of the assert methods we described above.\n\nThe base class requires a constructor\
    \ that takes a String, so we have to provide a call to super that passes in a\
    \ name. We don't know what name should be just at the moment, so we'll just make\
    \ our own constructor take a String and pass it along on line 5.\n\nFinally, the\
    \ test class contains individual methods named test.... In the example, we've\
    \ got one test method named testAdd on line 9. All methods with names that begin\
    \ with test will be run automatically by JUnit. You can also specify particular\
    \ methods to run by defining a suite method; more on that bit later.\n\nIn the\
    \ previous example, we showed a single test, using a single assert, in a single\
    \ test method. Of course, inside a test method, you can place any number of:\n\
    \n```\npublic void testAdds() {\n    assertEquals(2, 1+1);\n    assertEquals(4,\
    \ 2+2);\n    assertEquals(-8, -12+4);\n}\n```\n\nHere we have three assertEquals\
    \ inside a test method.\n\n## 3.4 JUnit Test Composition\n\nAs we've seen so far,\
    \ a test class contains test methods; each method contains one or more assert\
    \ statements. But a test class can also invoke other test classes: individual\
    \ classes, packages, or even the whole system.\n\nThis magic is achieved by creating\
    \ test suites. Any test class can contain a static test method named suite:\n\n\
    ```\npublic static Test suite();\n```\n\nYou can provide a suite() method to return\
    \ a collection of tests you want (without a suite() method), JUnit runs all of\
    \ the... methods automatically. But you might want to add particular tests by\
    \ hand, including the results from other suites.\n\nFor instance, suppose you\
    \ had a normal set of tests as we've already seen in a class named TestClassOne.\n\
    \n```\nimport junit.framework.*;\npublic class TestClassOne extends TestCase {\n\
    \    public TestClassOne(String method) {\n        super(method);\n    }\n   \
    \ public void testAddition() {\n        assertEquals(4, 2+2);\n    }\n    public\
    \ void testSubtraction() {\n        assertEquals(0, 2-2);\n    }\n}\n```\n\nThe\
    \ default action, using Java reflection on this class, would be to run the test\
    \ methods testAddition() and testSubtraction().\n\nNow suppose you've got a second\
    \ class, TestClassTwo. This uses a brute-force algorithm to find the shortest\
    \ route that your traveling salesman, Bob, can visit to the top n cities in his\
    \ history. The funny thing about the Traveling Salesman algorithm is that for\
