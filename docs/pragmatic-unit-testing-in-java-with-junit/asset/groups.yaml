    # 4.2 Boundary Conditions


    In the previous "largest number" example, we discovered several boundary conditions:
    when the largest value was at the end of the array, when the array contained a
    negative number, an empty array, and so on.


    Identifying boundary conditions is one of the most valuable parts of unit testing,
    because this is where most bugs generally live—at the edges. Some conditions you
    might want to think about:


    +   - Totally bogus or inconsistent input values, as a file name "!1*W:X\&Gi/w~>g/h#WQ"


    +   - Badly formatted data, such as an e-mail address without a top-level domain
    "fred@foobar."


    +   - Empty or missing values (such as 0, 0.0, "" or null).


    +   - Values far in excess of reasonable expectations, such as a person''s age
    of 10.000 years.


    +   - Duplicates in lists that shouldn''t have duplicates.


    +   - Ordered lists that aren''t, and vice-versa. Try handling a pre-sorted list
    to a sort algorithm, for instance—or even a reverse-sorted list.


    +   - Things that arrive out of order, or happen out of expected, such as trying
    to print a document before logging in, for instance.


    An easy way to think of possible boundary conditions is to remember the acronym
    CORRECT. For each of these items, consider whether or not similar conditions may
    exist in your method that you want to test, and what might happen if these conditions
    were violated:


    +   - Conformance — Does the value conform to an expected format?


    +   - Ordering — Is the set of values ordered or unordered appropriate?


    +   - Range — Is the value within reasonable minimum and maximum values?'
- md: "\n- Reference — Does the code access anything external that isn't under direct\
    \ control of the code itself\n- Existence — Does the value exist (e.g., is non-null,\
    \ nonzero, present in a set, etc.)?\n- Cardinality — Are there exactly enough\
    \ values?\n- Time (absolute and relative) — Is everything happening in order?\
    \ At the right time? In time\n\nWe will examine all of these boundary conditions\
    \ in the next chapter.\n\n## 4.3 Check Inverse Relationships\n\nSome methods can\
    \ be checked by applying their logical-inverse. For instance, you might check\
    \ a method that calculates a square root by squaring the result, and testing that\
    \ it is toler closely to the original number:\n\n```java\npublic void testSquareRootUsingInverse()\
    \ {\n  double x = mySquareRoot(4.0);\n  assertEquals(4.0, x * x, 0.0001);\n}\n\
    ```\n\nYou might check that some data was successfully inserted into a database\
    \ by then searching for it, and so on.\n\nBe cautious when you've written both\
    \ the original routine and its inverse, as some bugs might be masked by a common\
    \ error in both routines. Where possible, use a different source for the inverse\
    \ test. In the square root example, we're just using regular multiplication to\
    \ test our method. For the database search, we'll probably use a vendor-provided\
    \ search routine to test our insertion.\n\n## 4.4 Cross-check Using Other Means\n\
    \nYou might also be able to cross-check results of your method using different\
    \ means.\n\nUsually there is more than one way to calculate quantity; we might\
    \ pick one algorithm over the others because it performs better, or has other\
    \ desirable characteristics. That's the one we'll use in production, but we can\
    \ use one of the other versions to cross-check our results in the test system.\
    \ This technique is especially helpful when there's a proven, known way of accomplishing\
    \ the task that happens to be too slow or too inflexible to use in production\
    \ code.\n\nWe can use a somewhat lesser version to the advantage to check that\
    \ our new super-spiffy version is producing the same results².\n\n```java\npublic\
    \ void testSquareRootUsingStd() {\n  double number = 3880090.0;\n  double root1\
    \ = mySquareRoot(number);\n  double root2 = Math.sqrt(number);\n  assertEquals(root2,\
    \ root1, 0.0001);\n}\n```\n\nAnother way of looking at this is to use different\
    \ pieces of data to make sure they all \"add up.\" For instance, suppose you were\
    \ working on a library's database system (that is, a brick-and-mortar library\
    \ that lends real books). In this system, the number of copies of a particular\
    \ book should always balance. That is, the number of copies that are checked out\
    \ plus the number of copies sitting on the shelves should always equal the total\
    \ number of copies in the collection. These are separate pieces of data, and may\
    \ even be reported by objects of different classes, but they still need to agree,\
    \ and can be used to cross-check one another.\n\n## 4.5 Force Error Conditions\n\
    \nIn the real world, errors happen. Disks fill up, network lines drop, e-mail\
    \ goes into a black hole, and programs crash. You should be able to test that\
    \ your code handles all of these real-world problems by forcing errors to occur.\n\
    \nThat's easy enough to do with invalid parameters, and the like. To simulate\
    \ specific network errors—without unplugging any cables—takes special techniques.\
    \ We'll discuss one way to do this using Mock Objects in Chapter 6 on page 65.\n\
    \n> ²Some spreadsheet engines (as in Microsoft Excel™, etc.) employ similar techniques\
    \ to check that the models and methods chosen to solve a particular problem are\
    \ appropriate, and that the answers from different applicable methods agree with\
    \ each other.\n\n## CHAPTER 4. WHAT TO TEST: THE RIGHT-BICEP\n\nBut before we\
    \ get there, consider what kinds of errors or other environmental constraints\
    \ you might introduce to test your method? Make a short list before reading further.\n\
    \nThink about this for a moment before reading on...\n\nHere are a few environmental\
    \ things we've thought of:\n\n- Running out of memory\n- Running out of disk space\n\
    - Issues with wall-clock time\n- Network availability and errors\n- System load\n\
    - Limited color palette\n- Very high or very low video resolution\n\n## 4.6 Performance\
    \ Characteristics\n\nOne area that might prove beneficial to examine performance\
    \ characteristics—not performance itself, but trends as input sizes grow, as problems\
    \ become more complex, and so on.\n\nWhat we'd like to achieve is a quick regression\
    \ test of performance characteristics. All too often, we might release one version\
    \ of the system that works okay, but somehow by the next release it has become\
    \ dead-dog slow. We don't know why, or what change was made, or when, or who did\
    \ it, or anything. And the end users are screaming bloody.\n\nTo avoid that awkward\
    \ scenario, you might consider some rough tests to make sure that the performance\
    \ remains stable. For instance, suppose we've written a filter that identifies\
    \ websites we wish to block (using our new product to view naughty pictures might\
    \ get us in all sorts of legal trouble, after all.)\n\n![](img/b707d7ecf5b37c24434a141d9f59b58d_61_0.png)\n\
    \nThe code works fine with a few dozen sample sites, but will it work as well\
    \ with 10,000? 100,000? Let's write a unit test to find out.\n\n```java\npublic\
    \ void testFilter() {\n    Timer timer = new Timer();\n    String naughty_url\
    \ = \"http://example.com/\";\n\n    // First, check bad URL against small list\n\
    \    Filter filter = new URLFilter(small_list);\n    timer.start();\n    filter.check(naughty_url);\n\
    \    timer.end();\n    assertTrue(timer.elapsedTime() < 1.0);\n\n    // Next,\
    \ check bad URL against big list\n    filter = new URLFilter(big_list);\n    timer.start();\n\
    \    filter.check(naughty_url);\n    timer.end();\n    assertTrue(timer.elapsedTime()\
    \ < 2.0);\n\n    // Finally, check bad URL against huge list\n    filter = new\
    \ URLFilter(huge_list);\n    timer.start();\n    filter.check(naughty_url);\n\
    \    timer.end();\n    assertTrue(timer.elapsedTime() < 3.0);\n}\n```\n\nThis\
    \ gives us some assurance that we're still meeting targets. But because this one\
    \ takes seconds, we may not want to run it.\n"
