- md: "\nWhen you run this test, you'll quickly see that we need to add some range\
    \ checking:\n\n```\nThere was 1 error:\n1 testEmpty(TestMyStack)InvariantException:\n\
    next_index out of range: -1 for stack requires 100\nat MyStack.checkInvariant(MyStack.java:31)\n\
    at TestStack.test(TestMyStack.java:16)\n```\n\nIt's much easier to find and fix\
    \ this error in a simple environment instead of buried in a real application.\n\
    \nAlmost any indexing concept (whether it's a genuine integer index or not) should\
    \ be extensively tested. Here are a few ideas to get you started:\n\n- Start and\
    \ End index have the same value\n- First is greater than last\n- Index is negative\n\
    - Index is greater than allowed\n- Count doesn't match actual number of items\n\
    - ...\n\n## 5.4 Reference\n\nWhat things does your method reference that are outside\
    \ the scope of the method itself? Any external dependencies? What state does the\
    \ class have to? What other conditions must exist in order for the method to work?\n\
    \nFor example, a method in a web application to display a customer account history\
    \ might require that the customer is first logged on. The method pop() for a stack\
    \ requires a non-empty stack. Shifting the transmission in your car to Park from\
    \ Drive requires that the car is stopped.\n\nIf you have to make assumptions about\
    \ the state of the class and the state of other objects or the global application,\
    \ then you need to test your code to make sure that it is well-behaved when those\
    \ conditions are not met. For example, the code for microprocessor-controlled\
    \ transmission might have unit tests that check for that particular condition:\
    \ the state of the transmission (whether it can shift into Park or not) depends\
    \ on the state of the car (is it in motion or stopped).\n\n```\npublic void testJamItIntoPark()\
    \ {\n    transmission.shift(DRIVE);\n    car.accelerateTo(35);\n    assertEquals(DRIVE,\
    \ transmission.getGear());\n    // should silently shift ignore\n    transmission.shift(PARK);\n\
    \    assertEquals(DRIVE, transmission.getGear());\n    car.accelerateTo(0); //\
    \ i.e., stop\n    car.brakeToStop();\n    // should work now\n    transmission.shift(PARK);\n\
    \    assertEquals(PARK, transmission.getGear());\n}\n```\n\nThe preconditions\
    \ for a given method specify what state the world must be in for method to run.\
    \ In this case, the precondition for putting the transmission in park is that\
    \ the car's engine (a separate component elsewhere in the application's world)\
    \ would be at a stop. That's a documented requirement for the method, so we want\
    \ to make sure that the method will behave gracefully (in this particular case,\
    \ just ignore the request silently) in case the precondition is not met.\n\nAt\
    \ the end of the method, postconditions are those things that you guarantee your\
    \ method will make happen. Direct results returned by the method are one obvious\
    \ to check, but if the method has any side-effects then you need to check those\
    \ as well. In this case, applying the brakes has the side effect of stopping the\
    \ car.\n\nSome languages even have built-in support for preconditions and postconditions;\
    \ interested readers might want to read about Eiffel in Object-Oriented Software\
    \ Construction [Mey97].\n\n## 5.5 Existence\n\nA large number of potential bugs\
    \ can be discovered by asking the key question \"does some thing exist?\",\n\n\
    For any value you are passed in or maintain, ask yourself what would happen to\
    \ the method if the value didn't exist—if it were null, blank, or zero.\n\nMany\
    \ Java library methods will throw an exception of some when faced with non-existent\
    \ data. The problem is that it's hard to debug a generic runtime exception buried\
    \ deep in some library. But an exception that reports \"Age isn't set\" makes\
    \ tracking down the problem much easier.\n\nMost methods will blow up if expected\
    \ data is not available, and that's probably not what you want them to do. So\
    \ you test for the condition—see what happens if you get a null instead of a CustomerRecord\
    \ because some search failed. See what happens if the file doesn't exist, or if\
    \ the network is unavailable.\n\nAh, yes: things in the environment can wink out\
    \ of existence as well—networks, files URLs, license keys, users, printers—you\
    \ name it. All of these things may not exist when you expect them to, so be sure\
    \ to test with plenty of nulls, zeros, empty strings and other nihilist trappings.\n\
    \nMake sure your method can stand up to nothing.\n\n## 5.6 Cardinality\n\nCardinality\
    \ has nothing to do with either highly-placed religious figures or small red birds,\
    \ but instead with counting.\n\nComputer programmers (your humble authors included)\
    \ are really bad at counting, especially past 10 when the fingers can no longer\
    \ assist us. For instance, answer the following question quickly, the top of your\
    \ head, without benefit of fingers, paper, or UML:\n\n> If you've got 12 feet\
    \ of lawn, and each section of fencing is 3 feet wide, how many fence posts do\
    \ you need?\n\nIt's one of many ways you can end up being \"off by one;\" an occasionally\
    \ fatal condition that afflicts all programmers from time to time.\n\n![](img/b707d7ecf5b37c24434a141d9f59b58d_73_0.png)\n\
    \nSo you need to think about ways to test how well your method counts, and check\
    \ to see just how many of them you have. It's related to Existence, but now you\
    \ want to check:\n\n- Zero\n- One\n- More than one\n\nMost of the time, this makes\
    \ no difference to code. But every now and then, time of day will matter, perhaps\
    \ in subtle ways. Here's a quick question, true or false: every day of the year\
    \ is 24 hours long?\n\nThe answer is “it depends.” In UTC (Universal Coordinated\
    \ Time, the modern version of Greenwich Mean Time, and GMT), the answer is Saving\
    \ Time. In areas of the world that do not observe Daylight Savings Time (DST),\
