    \ could use this assert to check all sorts of things, including whether numbers\
    \ are equal to each other:\n\n```java\nint a = 2;\nassertTrue(a == 2);\n```\n\n\
    If for some reason a does not equal 2 when the method assertTrue is called, then\
    \ the program will abort.\n\nSince we check for equality a lot, it might be easier\
    \ to have an assert just for numbers. To check that two integers are equal, for\
    \ instance, we could write a method that takes two integer parameters:\n\n```java\n\
    public void assertEquals(int a, int b) {\n    assertTrue(a == b);\n}\n```\n\n\
    Armed with just these two asserts, we can start writing some tests. We'll look\
    \ at more asserts and describe the details of how you use asserts in unit test\
    \ code in the next chapter. But first, let's consider what tests might be needed\
    \ before we write any code at.\n\n### 2.1 Planning Tests\n\nWe'll start with a\
