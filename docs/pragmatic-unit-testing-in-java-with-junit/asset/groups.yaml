    cation, you can easily add and test business features without involving the GUI.


    The main GUI class RecipeGUI (formerly known as Recipes) should now contain nothing
    but GUI-oriented code: widgets, callbacks, and so on. Thus, all of the “business
    logic” and file I/O can be in non-GUI, fully testable classes.


    And we''ve got a clean design as an added bonus.


    # 9.3 Testing the Class Invariant


    Another way to improve the design of a class is by defining and verifying the
    “class invariant.”¹¹


    A class invariant is an assertion, or some set of assertions, about objects of
    a class. For an object to be valid, all of these assertions must be true. They
    cannot vary.


    For instance, a class that implements a sorted list may have the invariant that
    its contents are in sorted order. That means


    > ¹For more information on pre-conditions, post-conditions and invariants, see
    [Mey97].'
  - '[PAGE 132]


    no matter what else happens, no matter what methods

    called, the list must always be in sorted order—at least as

    viewed from outside the object. Within a method, of course,

    in invariant may be momentarily violated as the class per-

    forms whatever housekeeping is necessary. But by the time

    the method returns, or the object is otherwise available for

    use (as in a multi-threaded environment), the invariant must

    hold true or else it indicates a bug.


    That means it''s something you could check for as part of every

    unit test for this class.


    The invariant is generally an artifact of implementation: inter-

    counters, the fact that certain member variables are pop-

    ulated, and so on. The invariant is not the place to check for

    user input validation or anything of that sort. When writing

    tests, you want to test just one thing, but at the same

    time want to make sure the overall state of the class is

    consistent—you want to make sure you have not inflicted any

    collateral damage.


    Here are some possible areas where class invariants might

    apply.


    # Structural


    The most common invariants are structural in nature. That

    is, they refer to structural properties of data. For instance,

    an an order-entry system you might have invariants such as:


    +   * Every line item must belong to an order

    * Every order must have one or more line items


    When working with arrays of data, you''ll typically maintain

    a member variable that acts as an index into the array. The

    invariants on that index would include:


    +   * index must be >= 0

    * index must be < array length


    You want to check the invariant if any of these conditions

    are likely to break. Suppose you are performing some sort of

    calculation on the index into an array; you''d want to check the

    invariant throughout your unit tests to make sure the class'
  - '[PAGE 133]


    is never in an inconsistent state. We showed this in the stack class example on
    page 52.


    Structural errors will usually cause the program to throw an exception and/or
    terminate abruptly. For that matter, so will failing the invariant check. The
    difference is that when the invariant is violated, you know about it right away—right
    at the scene of the crime. You''ll probably know exactly what condition was violated.
    Without the invariant, the failure may occur from the original bug, and backtracking
    to the cause might take you anywhere from a few minutes to a few days.


    More importantly, checking the invariant makes sure that you are not passing the
    tests based on just luck. It may be that there''s a bug that the tests aren''t
    catching that will blow up under real conditions. The invariant might help you
    catch that early, even if an explicit test does not.


    # Mathematical


    Other constraints are more mathematical in nature. Instead of verifying the physical
    nature of data structures, you may need to consider the logical model. For example:


    +   - Debits and credits on a bank account match the balance.

    - Amounts measured in different units match after conversion (an especially popular
    issue with spacecraft).


    This starts to sound a lot like the boundary conditions we discussed earlier,
    and in a way they are. The difference is that an invariant must always be true
    for the entire visible state of a class. It''s not just a fleeting condition;
    it''s always true.


    # Data Consistency


    Often times an object may present the same data in different ways—a list of items
    in a shopping cart, the total amount of the sale, and the total number of items
    in the cart are closely related. From a list of items with details, you can derive
    the other two figures. It must be an invariant that these figures are consistent.
    If not, then there''s a bug.'
