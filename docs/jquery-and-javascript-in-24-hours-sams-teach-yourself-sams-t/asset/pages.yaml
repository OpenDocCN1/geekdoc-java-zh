    # Using try and catch Blocks


    Figuring out where to try blocks is the hardest part of using exceptions; it is
    not always obvious which actions might raise an exception. The next question is
    where to catch the exception. You might want to throw all exceptions where the
    memory is allocated, or to catch the exceptions high in the program where you
    deal with the user interface.


    When trying to determine try blocks, look for where you allocate memory or use
    resources. Other things to look for are out-of-bounds errors and illegal input.


    # Catching Exceptions


