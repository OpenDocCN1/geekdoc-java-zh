  md: '# HOUR 24

    Dealing with Exceptions and Error Handling


    **What You''ll Learn in This Hour:


    +   - What exceptions are

    - How exceptions are used and what issues they raise

    - How to create bug-free code

    - Where to go from here


    # Bugs, Errors, Mistakes, and Code Rot


    The code in this book was created for illustrative purposes. It has purposely
    not dealt with errors to keep the focus on the central issues being presented.
    Real-world programs, on the other hand, must take error conditions into consideration.
    In fact, anticipating and handling errors can account for the largest part of
    the code!


    The computer scientist Weinberg once said, "If builders houses the way programmers
    built programs, the first woodpecker to come along would destroy civilization."
    Too many commercial programs from some of the biggest vendors in the business
    have bugs. Too many open source programs are used on millions of Internet computers
    and other devices have bugs. Serious bugs.


    Writing robust, bug-free programs should be the number-one priority of anyone
    serious about programming. The biggest expense in major programming efforts often
    is testing, finding, and fixing bugs.


    There are a number of discrete kinds of bugs that can trouble a program. The first
    is logic: The program does just what you asked, but you haven''t thought about
    the algorithms properly. The second is syntactic: You used the wrong idiom, function,
    or structure. These two are the most common, and they are the most programmers
    are on the lookout for. Far harder to find subtle bugs that pop up only when the
    user does something unexpected. These little logic bombs can lur until they''re
    finally encountered and the program blows up.'
