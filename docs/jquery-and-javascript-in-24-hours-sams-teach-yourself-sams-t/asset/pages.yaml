    After being compiled, this program produces the following output when run on either
    a Windows 10 or Linux Ubuntu 15.10:


    ```

    The size of an integer:      4 bytes

    The size of a short integer:   2 bytes

    The size of a long integer:    4 bytes

    The size of a character:      1 bytes

    The size of a boolean:        1 bytes

    The size of a float:           4 bytes

    The size of a double float:    8 bytes

    The size of a long int:        8 bytes

    ```


    Compare this to how it runs on your computer. The sizeof() function returns the
    size of the specified object as its argument. For example, on line 16 the keyword
    float is passed to sizeof(). As you can see from the output, on the Windows or
    Ubuntu computers a float takes up two bytes of space and is equivalent to a long
    or an int.


    # Signed and Unsigned Variables


    All the integer types come in two varieties specified using a keyword. They are
    declared with unsigned when they hold positive values and signed when they hold
    positive or negative values. Here''s a statement that creates a short int variable
    zombies that does not hold negative numbers:


    ```

    unsigned short zombies = 0;

    ```


    The variable is assigned the initial value 0. Both signed and unsigned integers
    can equal 0. Integers that do not specify signed or unsigned are assumed to be
    signed.


    Signed and unsigned integers are stored using the same number of bytes. For this
    reason, the largest number that can be stored in an unsigned int is twice as big
    as the largest positive number that a signed int can handle numbers from 0 to
    65,535. Half the numbers represented by a signed short are negative, so a signed
    short represents numbers from -32,768 to 32,767. In both cases, the total number
    of possible values is 65,535.'
