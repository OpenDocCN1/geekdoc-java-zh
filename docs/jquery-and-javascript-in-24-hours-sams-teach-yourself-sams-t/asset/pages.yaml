  md: 'Every operator has a precedence value in C++. Multiplication has higher precedence
    than addition, the expression sets x to 29. The precedence of operators is shown
    in Table 4.1.


    You are introduced to most of these operators in later hours. Operators are evaluated
    from the top of the table down. Operators with the same precedence are evaluated
    from left to right or right to left, as indicated in the table.


    Looking at the table, you can see that the multiplication operator * and division
    operator / have higher precedence than the addition operator + and subtraction
    operator -. For this reason, multiplication and division are handled before addition
    and subtraction.


    # Table 4.1 Operator Precedence


    | Level | Operators | Evaluation Order |

    |---|---|---|

    | 1 (highest) | ( ) [ ] -> : | Left to right |

    | 2 | * & ! ++ + - = | Right to left |

    | | sizeof new delete | Left to right |

    | 3 | * -> * | Left to right |

    | 4 | / | Left to right |

    | 5 | + - | Left to right |

    | 6 | << >> | Left to right |

    | 7 | <= >= | Left to right |

    | 8 | == != | Left to right |

    | 9 | & | Left to right |

    | 10 | ^ | Left to right |

    | 11 | | | Left to right |

    | 12 | && | Left to right |

    | 13 | || | Left to right |

    | 14 | ?: | Right to left |

    | 15 | *= = / += -= %= | Right to left |

    | | << >> &= ^ = | | Right to left |

    | 16 (lowest) | | Left to right |


    When two mathematical operators have the same precedence, they are performed in
    left-to-right order. Here''s an expression with two multiplication operators and
    three addition operators:


    ```

    int x = 5 + 3 + 8 * 9 * 6 * 4;

    ```'
