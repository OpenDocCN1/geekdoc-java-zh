  md: '# Filtering Access to Contained Members


    Note that the String class provides `operator+`. The designer of the Employee
    class has blocked access to `operator+` being called on Employee objects by declaring
    that `getFirst()`, return a constant reference. `operator+` can''t be a const
    function because the object it is called on, so attempting to write following
    causes a compile-time error:


    ```

    String buffer = snett.getFirstName() + snett.getLast();

    ```


    The `getFirstName()` function returns a const String; you cannot call `operator+`
    on a constant object.


    To fix this, overload `getFirst()` to be non-const:


    ```

    const String& getFirstName() const { return firstName; }

    String& getFirstName() { return firstName; }

    ```


    Note that the return value is no longer const and the member itself is no longer
    const. Changing the return value is not sufficient to overload the function name;
    because both a const and a non-const version are provided, the compiler invokes
    the `const` version wherever possible (for example, when a client calls `getFirstName()`
    and the non-const version as needed (for example, when invoked with `operator+`).


    # Copying by Value Versus Reference


    When you pass `Employee` objects by value, all their contained strings are copied
    as well, so constructors are called. This is very expensive; it takes memory and
    it takes time.


    When you pass `Employee` objects by reference using pointers or references, all
    this is saved. This is why C++ programmers work hard not to pass anything larger
    than a few bytes by value.


    # Friend Classes and Functions


    Sometimes you will create classes together, as a set. These paired classes might
    need access to one another''s private members, but you might not want to make
    that information public.


    If you want to expose your member data or functions to another class, you must
    declare that class to be a `friend`. This extends the interface of your class
    to include the friend class.


    This friendship cannot be transferred and is not inherited. It is also not commutative.
    Assigning `Class1` to a friend of `Class2` does not make `Class2` a friend of
    `Class1`. (That''s kind of a jerk move by `Class2`, in my opinion.)'
