  md: '# Q&A 107


    Although strings are just character arrays in C++, they''re commonly referred
    to as strings because they serve so many useful purposes. Strings can collect
    user input, present text, and store textual data from files, web documents, and
    other sources.


    There are many other ways to represent data in C++ more sophisticated than simple
    data types and arrays.


    # Q&A


    +   Q. What happens if I write to element 25 in a 24-member array?


    +   A. The end of the world as we know it. Not really, but it''s pretty bad. When
    you store a value past the end of an array, you write to other memory with potentially
    disastrous effects on your program. Memory used by the program could be overwritten
    and the software could run improperly.


    This mistake is called a buffer overflow. According to security experts, the most
    common exploit used by malicious programmers is write data past a buffer and use
    this to execute new code. The new code often do anything, such as altering or
    deleting files, granting system privileges to untrusted users, and replicating
    viruses.


    +   Q. What is in an uninitialized array element?


    +   A. An element that has not been assigned a value. The value is whatever happens
    to be in memory at a given time. The results of using this element without assigning
    a value are unpredictable.


    +   Q. Why did the number 13 become associated with bad luck?


    +   A. Thirteen has been getting bad press since the Middle Ages, partially from
    the observation that the presence of Judas made the Last Supper table for 13.


    Additionally, the Norse god Loki arrived at a party attended by 12 of his colleagues
    and ruined the proceedings, according to one myth.


    Furthermore, when ancient calendars in Sumer and Babylon ventured far off the
    mark, a thirteenth month was added to bring things into line with the seasons.
    This kludge affected planting schedules and crop yield, month 13 was not welcome.


    Thirteen is one past a dozen and 12 is considered to be a suitable number for
    a wide variety of things. This makes 13 too many and represents transgression
    and discord.


    The number 13 is so terrifying there''s a word to describe the fear of it: triskaidekaphobia.


    As a person whose birthday falls on April 13, I think the number gets a bad rap.'
