  md: "# Exceptions\n\nIn C++, an *exception* is an object that is passed from the\
    \ area of code where a problem occurs to the part of the code that is going to\
    \ handle the problem. When an exception occurs it is said to be *thrown*. When\
    \ an exception is handled, it is said to be *caught*.\n\nThe type of the exception\
    \ determines which area of code will handle the problem. The contents of the object\
    \ as an exception may be used to provide feedback on the problem to the user.\n\
    \nThe basic idea behind exceptions is fairly straightforward:\n\n+   * The actual\
    \ allocation of resources (for example, the allocation of memory or the locking\
    \ of a file) is usually done at a very low level in the program\n* The logic of\
    \ what to do when an operation fails, memory cannot be allocated, or a file cannot\
    \ be locked unless in high program, with the code for interacting with the user.\n\
    * Exceptions provide an express path from the code that allocates resources to\
    \ the code that can handle the error condition. If there are intervening layers\
