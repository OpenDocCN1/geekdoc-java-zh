    # Classes with Other Classes as Member Data


    It is not uncommon to build a complex class by declaring simpler classes and including
    them in the declaration of the more complicated class.


    For example, you might declare the classes Wheel, Motor, Transmission, and so
    forth, then combine them in a Car class. This arrangement declares a "has-a" relationship:
    A car has a motor, it has a set of wheels, and it has a transmission.


