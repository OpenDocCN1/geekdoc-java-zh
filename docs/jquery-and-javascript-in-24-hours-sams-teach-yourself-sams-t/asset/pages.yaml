  md: '# HOUR 17

    Using Polymorphism and Derived Classes


    What You''ll Learn in This Hour:


    +   - What virtual member functions are

    - How to use virtual destructors and copy constructors

    - How virtual member functions enable you to use your base classes polymorphically

    - The costs and dangers in using virtual member functions


    # Polymorphism Implemented with Virtual Member Functions


    The previous hour emphasized the fact that a Dog object is a Mammal object. This
    meant that the Dog object inherited the attributes (data) and capabilities (member
    functions) of its base class. The relationship between a base class and derived
    class runs deeper than in C++.


    Polymorphism allows derived objects to be treated as if they were base objects.
    For example, suppose you created specialized Mammal types such as Dog, Cat, Horse,
    and so forth. All these derive from Mammal, and Mammal has a number of member
    functions factored out of the derived classes. One such function is speak(), which
    implements the capability of all mammals to make noise.


    You''d like to teach each of the derived types to specialize how they speak. A
    Dog says “woof,” and so forth. Each class must be able to override how it implements
    the speak() function.


    At the same time, when you have a collection of Mammal objects such as a Farm
    with Dog, Horse, and Cow objects, you want the farm to be able to tell each of
    these objects to speak() without knowing or caring about the details of how they
    implement the speak() function. When you treat these objects as if they are all
    mammals by calling the Mammal.speak() function, you are treating them polymorphically.'
