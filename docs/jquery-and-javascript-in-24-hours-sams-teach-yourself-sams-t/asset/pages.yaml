  md: 'player_score, and new_world_record. Others prefer lowercase letters except
    for the first letter of new words, such as highScore, playerScore, and newWorldRecord.
    (The latter naming convention has been dubbed CamelCase because the middle-of-word
    capitalizations look like a camel''s humps.)


    Programmers who learned in a Linux environment tend to use the first convention,
    whereas those in the Microsoft world use CamelCase. The compiler does not care.


    The code in this book follows CamelCase.


    With well-chosen variable names and plenty of comments, your C++ code will be
    much easier to figure out when you come back to it months or years later.


    # CAUTION


    Some compilers allow you to turn case sensitivity of variable names off. Do not
    do this. If you do, your programs will work with other compilers, and other C++
    programmers will make fun of you behind your back.


    Some words may not be used as variable names in C++ because they are keywords
    used by the language. Reserved keywords include if, for, and main. Generally,
    any reasonable name for a variable is almost certainly not a keyword.


    Variables may contain a keyword as part of a name but not the entire name, so
    variables mainFlag and forward are permitted even though main and for are reserved.


    # Assigning Values to Variables


    A variable is assigned a value using the operator, which is called the assignment
    operator. The following statements show it in action to create an integer named
    highScore with the value 13,000:


