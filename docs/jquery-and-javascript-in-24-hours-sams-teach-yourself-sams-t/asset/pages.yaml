  md: '# Overloading the Postfix Operator


    The preceding project used the prefix version of the ++ increment operator, which
    raises the question of how the postfix operator could be overloaded. The prefix
    and postfix operators are both ++ so the name of the overloaded member function
    is not useful to distinguish between the two.


    The way to handle this and overload the postfix operator is to include a int variable
    as the only parameter to the operator++ member function. The integer won''t be
    used; it''s just a signal that the function defines the postfix operator.


    As you learned in earlier hour, the postfix operator changes a variable''s value
    before returning it in expressions. The postfix operator returns the value before
    incrementing or decrementing it.


    To do this, in an overloaded member function, a temporary object must be created
    to hold the original value while the value of the object is incremented. The temporary
    object is returned because the postfix operator requires the original value, not
    the incremented value.


    The temporary object must be returned by value and not by reference. Otherwise,
    it goes out of scope as soon as the function returns.


    Counter3 program in Listing 15.3 demonstrates how to overload the prefix and the
    postfix operators.


    # LISTING 15.3 The Full Text of Counter3.cpp


    ```

    1: #include <iostream>

    2:

    3: class Counter

    4: {

    5: public:

    6:     Counter();

    7:     -Counter() {}

    8:     int getValue() const { return value; }

    9:     void setValue(int x) { value = x; }

    10:    const Counter& operator++(); // prefix

    11:    const Counter operator++(int); // postfix

    12:

    13: private:

    14:     int value;

    15: };

    16:

    17: Counter::Counter():

    18:     value(0)

    19: { }

    20:

    21: const Counter& Counter::operator++() // prefix

    ```'
