    # Lambda Expressions


    The most-asked-for feature to be added to C++ in recent years is lambda expressions,
    which enable the creation of inline anonymous functions. The syntax can seem a
    bit confusing at first, but as you master them, you will find they provide powerful
    functionality that can make your source code easier to understand.


    A lambda expression resembles a statement and can be defined in a single line
    of code. The expression is stored in a variable and called like a function.


    Here''s an example:


    ```

    auto aarhus = []() { std::cout << "Solidum petit in profundis!" << std::endl;\naarhus();

    ```


    This code produces the following:


    ```

    Solidum petit in profundis!

    ```


    The anonymous function executes the code between the ( and ) braces. Note that
    there''s a semi-colon at the end of the line following the } brace.


    The function is stored in the variable aarhus and run using the same syntax as
    calling a function.


    The lambda expression can have one or more arguments, which are specified within
    the parenthesis after the [] square brackets.


    This example has two arguments:


    ```

    auto multiply = [](int x, int y) { std::cout << "Total: " << x * y << std::endl;\nmultiply(7,
    17);

    ```


    Here''s the output:


    ```

    Total: 117

    ```


    When a lambda expression has no arguments, the parentheses can be left out of
    the expression. The first example didn''t have any, so here''s another version
    of that expression:


    ```

    auto aarhus = []() { std::cout << "Solidum petit in profundis!" << std::endl;

    ```'
