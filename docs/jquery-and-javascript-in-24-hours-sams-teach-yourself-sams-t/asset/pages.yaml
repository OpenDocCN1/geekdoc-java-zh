  md: '# Q&A


    Q. If a short integer can run out of room, why not always use long integers?


    A. Both short integers and long integers will run out of room, but a long integer
    will do so with a much larger number. On most computers, a long integer takes
    up twice as much memory, which has become less of a concern because of the memory
    available on modern PCs.


    Q. What happens if I assign a number with a decimal to an integer rather than
    a float or double? Consider the following line of code:


    ```

    int rating = 5.4;

    ```


    A. Some compilers issue a warning, but the assignment of a decimal value to an
    integer type is permitted in C++, so the statement assigns the rating value 5.
    The more precise information is lost in the assignment, so if you tried later
    rating to a float variable, it would still equal 5.


    Q. Why should I bother using symbolic constants?


    A. When a constant is used in several places in a program, a symbolic constant
    enables all the values to change simply by changing the constant''s initialization.
    Symbolic constants also serve an explanatory purpose like comments. If a statement
    multiplies a number by 360, it''s easily understood than multiplying it by a constant
