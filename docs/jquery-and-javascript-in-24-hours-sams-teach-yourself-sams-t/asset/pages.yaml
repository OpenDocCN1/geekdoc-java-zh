    # Encapsulation


    When the aforementioned bike engineer creates a new bicycle, she connects together
    component pieces such as the frame, handlebars, wheels, and a headlight (baseball
    card in the spokes optional). Each component has certain properties and can accomplish
    certain behaviors. We can use the headlight without understanding the details
    of how it works, as long as she knows what it does.


    To achieve this, the headlight must be self-contained. It must do one well-defined
    thing and it must do it completely. Accomplishing one thing is called encapsulation.


    All the properties of the headlight are encapsulated in the headlight object.
    They are not spread through the bicycle.


    C++ supports the properties of encapsulation through the creation of user-defined
    classes. A well-defined class as a fully encapsulated entity that is used as an
    unit or not at all. The inner workings of the class should be hidden on the principle
    that the programs which use a well-defined class do not need to know how the class
    works. They only need to know how to use it. You learn how to create classes in
    Hour 8, "Creating Basic Classes."


