    **Linked list:** A data structure that consists of nodes linked to one another.


    **Linker:** A program that builds an executable (runnable) file from the object
    code files produced by the compiler.


    **Linking:** The second step in creating an executable file; links together the
    object files produced by a compiler into an executable program.


    **Literal constant:** A value typed directly into the program, such as 35.


    **Local variables:** Variables that exist only within a function.'
  merge: -1
  pgno: 435
- img_proc: true
  md: '# M


    **Member functions (also called member methods):** The functions of your class.


    **Member methods:** See member functions.


    **Member variables (also known as data members):** The variables in your class.


    **Method definition:** A definition that begins with the name of the class followed
    by two colons, the name of the function, and its parameters.


    # O


    **Object:** An instance of a class.


    **Object oriented:** A programming approach that takes the next step beyond procedural
    and structural programming. As the name implies, it takes advantage of the behavior
    of objects (defined in classes).


    OO: See object oriented.


    **Operand:** A mathematical term referring to the part of an expression operated
    upon by an operator.


    **Operator:** A symbol that causes the compiler to take an action.


    **Overriding:** When a derived class creates a member function that changes the
    implementation of a function in the base class. The overridden method must have
    the same return type and signature as the base method.


    # P


    **Pointer:** A variable that holds a memory address.


    **Problem space:** The set of problems and issues your program will try to solve.


    **Procedural programming:** A series of actions performed on a set of data.


    **Polymorphism:** The ability to treat many subtypes as if they were of the same
    base type.


    **Postfix operator:** The postfix operator (zombies++) increments before evaluation
    in an expression.


    **Precedence value:** The precedence value tells the compiler the order in which
    to evaluate operators.


    **Prefix operator:** The prefix operator (--zombies) increments before evaluation
    in an expression.


    **Preprocessor:** A program that runs before your compiler and handles lines that
    begin with a pound (#) symbol.'
  merge: -1
  pgno: 436
- img_proc: true
  md: 'Prototype: Declaration of a function.


    Private access: Access available only to the methods of the class itself or to
    methods of classes derived from the class.


    Public access: Access available to methods of all classes.


    Pure virtual function: A virtual function that must be overridden in the derived
    class because it has no code behind it. It is purely abstract with no implementation
    in the base class.


    # R


    R-value: An r-value is an operand that can be on the right side of an operator.


    RAM: Random access memory.


    Reference: An alias to an object.


    Relational operators: Determine whether two numbers are equal or if one is greater
    or less than the other.


    # S


    Scope: Where a variable is visible and can be accessed.


    Shallow copy: Copies the exact values of one object''s member variables to another
    object. Also called a member-wise copy.


    Signature: The name of a function and its arguments.


    Signed: A variable type that can hold negative and positive values.


    Simulation: A computer model of part of a real-world system.


    Singly linked list: A linked list in which nodes point to the next node in the
    list, but not back to the previous.


    Solution space: The set of possible solutions to the problem.


    Spaghetti code: Programs written in a convoluted and difficult-to-read format
    with limited structure, which gets its name because program flow looks like a
    plate of spaghetti that is difficult to follow.


    Stack: A special area of memory allocated for your program to hold the data required
    by each of the functions in your program. Another term for LIFO (last, first out)
    queue. The last (most recent) item placed in the LIFO is the first pulled out.'
  merge: -1
  pgno: 437
- img_proc: true
  md: 'Statement: A way to control the sequence of execution, evaluate an expression,
    or do nothing

    (the null statement).


    **Static member data:** Unlike most member data elements within a class, this
    does not get replicated for each object created. Only one copy of these elements
    exists and can be accessed by all the objects of that class. It is typically used
    to keep track of the number of objects or anything else that applies to all member
    objects.


    **Static member functions:** Like *static member data*, these exist in the scope
    of the class, not individual objects and can be invoked without referencing a
    specific object.


    **Stray pointer** (also called a *dangling pointer*): The name for a pointer that
    is created when you perform *delete* on it and then access the memory that has
    been freed. This is a common bug that it is difficult to debug because the fault
    (accause the memory improperly) typically takes place after the *delete*.


    **String:** An array of characters ending with a null character.


    **Structured programming:** A systematic approach to breaking programs down into
    procedures.


    **Symbolic constant:** A typed and named value marked as constant, such as BoilingPoint.


    **Stubbing out:** Writing only enough of a function to compile, leaving the details
    for later.


    **Subscript:** Offsets to an array. The fourth element of `myArray` would be accessed
    as `myArray[3]``.


    # T


    **Template:** Provides the ability to create a general class or method and pass
    types as parameters.


    **Ternary operator:** An operator that takes three terms. In C++, there is only
    one ternary operator, the `?` operator, used as


    ```

    a < b ? : false;

    ```


    which will return true if `a` is less than `b`, and otherwise will return false.


    **Token:** A string of characters.


    **Tree:** A complex data structure built from nodes, each of which points to one
    or more child nodes.


    **Type:** The size and characteristics of an object.


    **Typedef:** A data type definition, which acts as a synonym for a built-in data
    type.'
  merge: -1
  pgno: 438
- img_proc: true
  md: '# U


    UMI: Unified Modeling Language. A standard, graphical means of representing requirements
    and design.


    **Unary operator**: An operator that takes only one term, such as a++, as opposed
    to a binary operator, which takes two terms, such as a a + b.


    **Unsigned**: A variable type that can only hold positive values.


    **Use case**: A description of how a program will be used.


    # V


    **Variable**: A named memory location in which you can store a value.


    **Virtual method**: One of the means by which C++ implements **polymorphism**.
    This allows you to treat derived objects as if they were base objects.


    **v-table**: The internal mechanism that keeps track of the virtual functions
    created within individual objects.


    # W


    **Waterfall**: A method in which each stage is completed before the product is
    passed to the next stage. Each stage is discrete and self-contained. This can
    be applied to software development or any project (including building a house
    or car or so forth).


    **Whitespace**: Spaces, tabs, and new lines.'
  merge: -1
