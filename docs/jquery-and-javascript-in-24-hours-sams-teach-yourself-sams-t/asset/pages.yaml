  md: '# HOUR 23


    # Creating Templates


    What You''ll Learn in This Hour:


    +   - What templates are and how to use them

    - Why templates are a better alternative to macros

    - How to create class templates


    # What Are Templates?


    In Hour 19, "Storing Information in Linked Lists," you learned how to make a linked
    list. Your linked list was encapsulated: The list knew only about its head pointer;
    the head pointer delegated its work to internal pointers, and so forth.


    One weakness of the linked list was that it only knew how to handle the data types
    it created with. If you wanted to put anything else into your linked list, you
    couldn''t. You couldn''t, for example, make a linked list of Car objects, or Robot
    objects, or any other object that wasn''t of the same type as that in the original
    list.


    The old way of solving this problem was to create new versions of the object for
    each new data type. A more object-oriented way is to create a Base class and derive
    from it the CarList and Robot classes. You can then cut and paste much of the
    LinkedList into the new RobotList declaration. In the future, however, when you
    want to make a list of Car objects, you have to make a new class and repeat most
    of the code.


    Neither of these are satisfactory solutions. Over time, the List class and its
    derived classes will have to be extended. Making sure all the changes are propagated
    to all the related classes will be a nightmare.


    Templates, a relatively new addition to C++, offer a solution to this problem.
    Unlike old-fashioned macros, templates are an integrated part of the language,
    they are type-safe, and very flexible.


    Templates enable you to create a general class and pass types as parameters to
    the template to build specific instances of the parameterized type.'
