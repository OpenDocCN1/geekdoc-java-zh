  md: '# APPENDIX D: Using the MinGW C++ Compiler on Windows


    A command window is a way to operate a computer by typing commands using the keyboard,
    rather than using the mouse. Few programs designed for Windows users require the
    command window today.


    To get to a command window in Windows, do one of the following:


    +   - On Windows 10, enter Command Prompt in the search box, then click the Command
    Prompt icon.

    - On Windows 8, choose Start, click the Search magnifying glass icon at upper-right,
    enter Command Prompt in the search box, and click the Command Prompt icon.

    - On Windows 7, Vista, XP, or Server 2003, choose Start, All Programs, Accessories,
    Command Prompt.

    - On Windows 98 or Me, choose Start, Programs, MS-DOS Prompt.

    - On Windows NT or 2000, choose Start, Accessories, Command Prompt.


    When you open a command window, it displays a line where you can type commands,
    as seen in Figure D.4.


    ![](img/69d0ba7a89f66b74047c2f072930167f_447_0.png)


    FIGURE D.4

    Using a newly opened command-window.


    Command line


    The command window uses commands adopted from MS-DOS, the Microsoft operating
    system that preceded Windows. MS-DOS supports the same functions as Windows—copying,'
  merge: -1
  pgno: 447
- img_proc: true
  md: 'moving, deleting files and folders; running programs; scanning and repairing
    a hard drive;

    formatting a floppy disk; and so on.


    In the window, a cursor blinks on the command line whenever you can type in a
    new command.

    Figure D.4, C:\Users\caden_000> is the command line.


    Because MS-DOS can be used to delete files and even format your hard drive, you
    should learn

    about the operating system before experimenting with its commands.


    However, you need to know only a few things about MS-DOS to use MinGW: how to
    create a

    folder, how to open a folder, and how to run a program.


    # # Opening Folders in MS-DOS


    When you are using MS-DOS on a Windows system, you have access to all the folders
    you

    normally use in Windows. For example, if you have a Windows folder on your C:
    hard drive, the

    same folder is accessible as C:\Windows from a command line.


    To open a folder in MS-DOS, type the command CD, followed by the name of the folder,
    and

    press Enter. Here''s an example:


    ```

    C:\Temp

    ```


    When you enter this command, the Temp folder on your system''s C: drive is opened,
    if it exists.

    After you open a folder, the command line is updated with the name of that folder,
    as shown in

    Figure D.5.


    ![](img/69d0ba7a89f66b74047c2f072930167f_448_0.png)


    **FIGURE D.5**

    Opening folder in a command-line window.


    MS-DOS command'
