    NOTE

    The arrays count up from 0 rather than 1 is a common cause of bugs written in
    C++ novices. When you use an array, remember that an array with 10 elements counts
    from array[0] to array[9].


    # Writing Past the End of Arrays


    When you assign a value to an array element, the compiler computes where to store
    the value in memory based on the size of each element and its subscript. If you
    store a new value in goal[3], the compiler multiplies the offset of 3 by the size
    of each element, for long integers four bytes. The compiler then moves many bytes,
    12, from the beginning of the array and stores the new value at that location.


    The goal array in the WeightGoals program has only four elements. If you try to
    store something in goal[4], the compiler ignores the fact that there is no element.
    Instead, it stores it in memory 20 bytes past the beginning of the first element,
    replacing whatever data is at that location. This can be any data, so writing
    the new out-of-bounds value might have unpredictable results, such as the program
    crashing or running with strange strings.


    These errors can be difficult to spot as a program runs, so it''s important to
    pay attention to the size of arrays when they are accessed.'
