  md: '# Workshop 299


    The linked list case study during this hour consisted of five classes: Data, HeadNode,
    TailNode, InternalNode, and LinkedList. True to object-oriented programming methodology,
    each class took care of its own work and relied on the other objects to do theirs.


    By understanding how these objects work together, you can develop a better sense
    of how to manage the relationships between objects.


    # Q&A


    +   Q. Why should you create a linked list if an array will work?


    +   A. An array must have a fixed size, whereas a linked list can be sized dynamically
    at runtime, making a more efficient use of memory.


    +   Q. Why do you separate the data object from the node?


    +   A. This programming practice fosters reuse. After you get your node objects
    working properly, you can reuse code for any number of objects that might want
    to live in a list.


    +   Q. If you want to add other objects to the list, do you you have to create
    a new list type and a new node type?


    +   A. For now, yes. But it''s possible to implement a linked list in a more generic
    way where the objects it holds are concerned. We''ll solve that when we get to
    Hour 23, "Creating Templates.",


    +   Q. What was the name of the Greek who carried a lantern and was looking for
    an honest man?


    +   A. That was Diogenes, a philosopher who lived around 320 B.C. Diogenes stressed
    self-sufficiency and the rejection of luxury, and his teachings caused him to
    be sent into exile from his birthplace of Sinope, Phagonia (I guess he didn''t
    have tenure.)


    In addition to his search for an honest man, Diogenes conducted with a lantern
    in broad daylight, there are other apocryphal stories associated with him.


    He slept in public buildings, lived in poverty, begged for food and was strongly
    antisocial. Diogenes believed that men and women should be promiscuous and that
    resulting children should be raised by the community instead of individual families.


    # Workshop


    Now that you''ve learned how to implement a complex data structure, answer a few
    questions and perform a couple of exercises to link it all together.'
