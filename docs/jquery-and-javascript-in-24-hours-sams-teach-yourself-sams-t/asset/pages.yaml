    # The 80/20 Rule


    A good rule of thumb at this stage is to design for those things that 80% of the
    people want to do 80% of the time, and to set aside your concerns about the remaining
    20%. The boundary conditions will be addressed sooner or later, but the core of
    your design should focus on the 80/80.


    Accordingly, you might decide to start designing the principal classes, setting
    aside the need for the secondary classes. Further, when you identify multiple
    classes that will have similar designs with only minor refinements, you might
    choose to pick one representative class and focus on that, leaving until later
    the design and implementation of its close cousins.


    NOTE


    There is another rule, the 80/20 rule, that states this: the first 20 percent
    of your time to code; the remaining 80 percent of your program will take the other
    80 percent of your time!


    The real rule is that 80 percent of the time is required to do 20 percent of the
    work—or that 80 percent of a company''s profit will come from 20 percent of the
    customers. This rule has wide application.


