  md: '# The Syntax of Derivation


    To create a class that inherits from another class in C++, in the class declaration,
    put a colon after the class name and specify the access level of the class (public,
    protected, or private) and the class from which it derives.


    Access control will be covered later. Here''s an example class declaration with
    an access level of public:


    class Dog : public Mammal


    This statement creates a derived class called Dog that inherits from the base
    class Mammal. The Mammal program in Listing 16.1 creates a full Dog class derived
    from Mammal.


