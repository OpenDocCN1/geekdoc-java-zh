  md: '# HOUR 1

    Writing Your First Program


    What You''ll Learn in this Hour:


    +   - How and why C++ was invented

    - How to find a C++ compiler

    - How to create and compile your first program

    - How to link and run the program


    # Using C++


    In 1979, a Danish computer scientist at Bell Labs in the United States began work
    on an enhancement to the C programming language. Bjarne Stroustrup explained on
    his personal website that he wanted a language “in which I could write programs
    that were both efficient and elegant.


    A lot of other people wanted that.


    Stroustrup''s creation, which he dubbed C++, has held a spot among the world''s
    top programming languages for decades. Many programming trends have come and gone
    over the years, this language remains a contemporary and useful choice for software
    development on desktop computers, servers, embedded devices like phones, and many
    other computing environments.


    C++ is a portable language that works equally on Microsoft Windows, Apple Mac
    OS, Linux, and UNIX systems. The best way to learn is to write programs without
    regard to the operating system they run on.


    Sams Teach Yourself C++ in 24 Hours offers a hand-introduction to the language
    that makes no no about your operating system. The book can achieve this because
    it covers standard C++ (also called ANSI/ISO C++), the internationally agreed-upon-version
    of the language, which is portable to any platform and development environment.


    The code presented throughout the book is ANSI/ISO C++ and should work with any
    development environment for C++ that''s up-to-date.'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'New features that are introduced in C++14, the language''s current version,
    are also covered. Popular C++ development environments support this version, which
    has 14 as part of its name because it was released in 2014.


    C++ programs are developed by a set of tools that work together called the compiler
    and linker.


    A compiler turns C++ programs into a form that can be run. The compiler translates
    a program from a human-readable format source code into a machine-runnable called
    machine code. The compiler produces an object file. From the object file, a linker
    builds an executable file that can be run.


    There are several popular environments for C++ programming that you might have
    used before or know how to obtain. Some of these are GCC (the GNU Compiler Collection),
    Microsoft Visual Studio, NetBeans, and Embaradero C++ Builder.


    If you have an up-to-date C++ compiler on your system and know the basics of how
    to use it, you will have no troublereadable completing the projects in this book.


    If you don''t have a C++ compiler, don''t know how to use a compiler, or don''t
    know how to find one, you can learn how to download and install an free compiler,
    GCC, in Appendix D, “Using the MinGW C++ Compiler on Windows.” Do that now if
    you need a compiler before you proceed in this book.


    Microsoft Visual Studio also supports C++ programming, and a free version Visual
    Studio Community is available from the website www.visualstudio.com. Some guidance
    is offered in this book for people learning C++ with Visual Studio.


    # Compiling and Linking the Source Code


    If you create your first C++ program later this hour, it''s worthwhile to understand
    the process.


    C++ programs begin as source code, which is just text typed into an editor such
    as Windows WordPad, Notepad, Emacs, or Vi. Although Microsoft Word and other word
    processors can save files as plain text, you should use a simpler editor for programming
    because you don''t need all the formatting and presentation capabilities of a
    word processor. Source code consists of plain text with no special formatting.


    NOTE


    There''s free text editor for Windows called Notepad++ that provides excellent
    support for C++ programming. It includes features you''ll come to appreciate as
    you get experience creating your own programs, such as code highlighting, which
    displays different elements of the language in different colors. You can download
    it from https://notepad-plus-plus.org.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Creating Your First Program


    The source code files you create for C++ can be given filenames ending with the
    extensions .cpp, .cxx, .cp, or .c. This book names all source code files with
    the .cpp extension, the most common choice for C++ programmers and the default
    for some. Most C++ compilers don''t care about the extension given to source,
    but using .cpp consistently helps identify source code files.


    Source code is the human-readable form of a C++ program. It can''t run until it
    is compiled and linked.


    After your source code is compiled, an object file is produced. This file is turned
    into an executable program by a linker.


    C++ programs are created by linking one or more object files with one or more
    libraries. A library is a collection of linkable files that provide useful functions
    and classes that you can rely on in programs. A function is a block of code that
    performs a task, such as multiplying numbers or displaying text. A class is the
    definition of a new type of data and related functions.


    Here are the steps to create a C++ program:


    +   1. Create a source code file with a text editor.

    2. Use a compiler to convert the source code into an object file.

    3. Use a linker to link the object file and any necessary libraries to produce
    an executable program.

    4. Type the name of the executable to run it.


    The GCC compiler can handle compiling and linking in a single step.


    # Creating Your First Program


    Now that you''ve been introduced to the process, it''s time to create your first
    C++ program and give it a test drive.


    Launch the text editor you''re using to create programs and open a new file. The
    first program that you will display text on the screen.


    Type the text of Listing 1.1 into the editor. Ignore the numbers on the left side
    of the listing and the colons that follow them—these are simply for reference
    purposes in this book.


    As you type, make sure to enter the punctuation on each line properly, such as
    the :: and << characters on line 5.


    When you''ve finished, save the file as Motto.cpp.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# LISTING 1.1 The Full Text of Motto.cpp.


    ```

    1: #include <iostream>

    2:

    3: int main()

    4: {

    5:     std::cout << "Solidum petit in profundis!\n";

    6:     return 0;

    7: }

    ```


    The point of this project is to become familiar with the steps of creating a C++
    program. If you are confused by what each line is doing, don''t panic—you’ll begin
    to discover what’s going on here during Hour 2, “Organizing the Parts of a Program.”


    After you save the file, it needs to be compiled and linked. If you’re using GCC,
    the following command accomplishes both tasks:


    ```

    g++ Motto.cpp -o Motto.exe

    ```


    This command tells the G++ compiler to compile the file named Motto.cpp and link
    it into an executable named Motto.exe. If it compiles successfully, no message
    is displayed. The compiler says only if there’s a problem, displaying an error
    message and the line (or lines) where the error appeared.


    If you get a compiler error, recheck the program line by line. Make sure that
    all the punctuation is included, particularly the semicolons at the end of lines
    5 and 6.


    After fixing any potential problems, try the compiler again. If you continue to
    experience problems and can’t find the cause, you can download a copy of this
    program from the book’s website at http://cplusplus.cadhead.org. Go to the Hour
    1 page.


    When the program has been compiled properly, you can run Motto.exe like any other
    program on your computer: Type its name, Motto.exe, as a command and press Enter.


    The motto program displays the following output:


    Solidum petit in profundis!


    This is the motto of Aarhus University, a public school with 38,000 students in
    Aarhus, Denmark, and the kingdom’s second-largest university. The motto is Latin
    for “Seek a firm footing in the depths.”


    Aarhus alumni include Danish Queen Margthe II, Nobel laureate chemist Jens Christian
    Skou, Crown Prince Frederik, and some guy named Bjarne Ststrup.'
