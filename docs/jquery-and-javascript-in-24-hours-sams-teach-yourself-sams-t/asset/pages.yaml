  md: '# The Stack and the Heap


    In line 17, the memory allocated in line 7 is returned to the heap by a call to
    delete. This frees the memory and dissociates the pointer from that memory location.
    pHeap is now free to point to another memory. It is reassigned in lines 18 and
    24, and line 25 displays the result. Line 26 again restores memory to the heap.


    NOTE


    Although line 26 is redundant (the end of the program would have returned that
    memory), it is a good idea to free this memory explicitly. If the program changes
    or is extended, it will be beneficial that this step was already taken care of.


    # Avoiding Memory Leaks


    Another way you might inadvertently create a memory leak is by reassigning a pointer
    before deleting the memory to it points. Consider this code:


    ```

    1: unsigned short int *pPointer = new unsigned short int;

    2: *pPointer = 72;

    3: pPointer = new unsigned short int;

    4: *pPointer = 84;

    ```


    Line 1 in this fragment creates pPointer and assigns it the address of an area
    on a heap. Line 2 stores the value 72 in that area of memory. Line 3 reassigns
    pPointer to another area of memory. Line 4 places the value 84 in that area. The
    original—in which the value 72 is now held—is unavailable because the pointer
    to that area of memory has been reassigned. There is no way to access that original
    area of memory, nor is any way to free it before the program ends.


    The code should have been written like this:


    ```

    1: unsigned short int *pPointer = new unsigned short int;

    2: *pPointer = 72;

    3: delete pPointer;

    4: ppointer = new unsigned short int;

    5: *pPointer = 84;

    ```


    Now the memory originally pointed to by pPointer—and thus freed—in line 3 of the
    preceding fragment.


    NOTE


    For every time in your program that you call new, there should be a call to delete.
    It is important to keep track of which pointer owns an area of memory and to ensure
    that the memory is returned to the heap when you are done with it.'
