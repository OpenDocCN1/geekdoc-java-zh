  md: '# How Virtual Member Functions Work


    When a derived object, such as a Dog object, is created, first the constructor
    for the base class is called, and then the constructor for the derived class is
    called. 17.1 shows what the Dog object looks like after it is created. Note that
    the Mammal part of the object is contiguous in memory with the Dog part.


    ![](img/69d0ba7a89f66b74047c2f072930167f_269_0.png)


    FIGURE 17.1

    The Dog object after it is created.


    When a virtual function is created in an object, the object must keep track of
    that function. Many compilers build a virtual function table, called a v-table.
    One of these is kept for each type, and each object of that type keeps a virtual
    table pointer (called a v-pointer or vptr), which points to that table.


    Each object''s v-pointer points to the v-table that, in turn, has a pointer to
    each of the virtual member functions. When the Mammal part of the Dog is created,
    the v-pointer is initialized to point to the virtual member functions for Mammal,
    as shown in Figure 17.2.


    ![](img/69d0ba7a89f66b74047c2f072930167f_269_1.png)


    FIGURE 17.2

    The v-table of a Mammal.'
