  md: "# Using auto in Function Return Types\n\nC++ is a type-safe language, providing\
    \ an important assurance that all data will remain in the form it takes when its\
    \ variable is declared. The burden is on the programmer to use each variable according\
    \ to type. But with each new version of the language, more type safety has been\
    \ ensured by the compiler.\n\nIn C++11, the auto keyword could be used in a variable\
    \ declaration to let the compiler infer the data type. This made it possible to\
    \ do things like:\n\n```\nauto length = 50;\nauto width = 30;\nauto height = 3;\n\
    auto area = length * width * height;\n```\n\n```\nstd::cout << \"Area: \" << area\
    \ << std::endl;\n```\n\nThe variables are all integers, which the compiler knows.\
    \ The length, width, and height variables are integers because they are assigned\
    \ integer values as when they are declared. The area is an integer because it\
    \ is the result of multiplying three integers.\n\nC++ extends this type inference\
    \ capability by making it possible to use auto as the return type of a function.\n\
    \nAs the compiler does with variable declarations, the auto keyword causes the\
