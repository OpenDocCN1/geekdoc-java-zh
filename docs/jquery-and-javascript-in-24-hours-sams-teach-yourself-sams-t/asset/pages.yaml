    NOTE

    Because C++ is case-sensitive, class names should follow the same convention to
    minimize errors. Instead of having to remember whether a class is called Tricycle,
    tricycle, or TRICYCLE, if you always prefix the first letter of a class name you''ll
    know it is Tricycle. Some programmers prefix every class name with a lowercase
    letter (for example, cTricycle or cateboard). The convention used in this book
    is initial capitalization, as in Tricycle and Squashquark.


    Member variables and functions also follow the same naming rules. This means begins
    with lowercase letters, as in speed and pedal(), and a capital letter beginning
    each subsequent word (if any), as in bringTricycle().


