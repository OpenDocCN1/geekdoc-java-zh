    # # Summary


    This hour covered several ways to make your functions more powerful.


    Static member variables as a way to store information about an entire class of
    objects. They''re also useful as a technique in which objects of the same class
    can exchange information with each other.


    Static member functions provide a place for behavior that fits a class but does
    not require a specific object of class to operate on.


    Friend functions make it possible for one class to expose its private member variables
    and functions to another class that would otherwise have access. Although normally
    these things are handled via inheritance between a base class and derived class,
    using friend functions gives special access to a class outside of its hierarchy.


    # # Q&A


    **Q. Why use static data when you can use global data?


    +   - Static data is scoped to the class. It is available only through an object
    of the class—through an explicit and full call using the class name if the data
    is public, or by using a static member. Static data is typed to the class type,
    and restricted access and strong typing makes static data safer than global data.


    **Q. Why use static member functions when you can use global functions?


    +   - Static member functions are scoped to the class and can be called only by
    an object of the class or an explicit full specification (such `ClassName::FunctionName()`).


    **Q. Why not make all classes friends of all the classes they use?


    +   - Making one class a friend of another exposes the implementation details
    and reduces encapsulation. The ideal in object-oriented programming is to keep
    all of the details of each class hidden from all others.


    **Q. Why did Ohio State coach Woody Hayes punch a player on an opposing team back
    in the ''70s?


    +   - Hayes, the fiery coach led the Buckeyes to three national championships,
    punched a Clemson Tigers player because he was a notorious loser. The player had
    just intercepted a pass late in a bowl game.'
