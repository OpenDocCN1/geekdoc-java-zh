    # Complex Hierarchies of Abstraction


    At times, you will derive ADTs from other ADTs. It might be that you want to make
    some of the pure virtual functions non-pure and leave others.


    If you create the Animal class, you can make eat(), sleep(), and reproduce() pure
    virtual functions. Perhaps you derive Mammal and Fish from Animal.


    On examination, you could decide that every Mammal will reproduce in the same
    way, and so you make Mammal::reproduce() non-pure leave eat(), sleep(), and move()
    as pure virtual functions.


    From Mammal you derive Dog, and Dog must override and implement the remaining
    three functions so that you can make objects of type Dog.


    What you say, as class designer, is that there is no Animal or Mammal objects
    can be instantiated, but that all Mammal objects can inherit the provided reproduce()
    member function without overriding it.'
