  md: 'If new cannot create memory on the heap—because memory is a limited resource—it
    throws an exception. Exceptions are error-handling objects covered in detail in
    Hour 24, “Dealing with Exceptions and Error Handling.”


    > NOTE\Some older compilers return a pointer that equals NULL. If you have an
    older compiler, check your pointer for NULL each time you request memory. All
    modern compilers can be counted on to throw an exception.


    # Using the delete Keyword


    When you have finished with your area of memory, you must call delete on the pointer,
    which returns the memory to the heap. Remember that the pointer itself—as opposed
    to the memory it points to—is a local variable. When the function in which it
    is declared, pointer goes out of scope and is lost. The memory allocated with
    the new operator is not freed automatically, however. That memory becomes unavailable.
    This situation is called a memory leak because memory cannot be recovered until
    the program ends. It is as though the memory has leaked out of your computer.


    To restore the memory to the heap, you use the keyword delete. For example:


    ```

    delete pPointer;

    ```


    When you delete the pointer, what you are really doing is freeing the memory whose
    address is stored in the pointer. You are saying, “Return to the heap the memory
    that this pointer points to.” The pointer is still a pointer, and it can be reassigned.


    When you call delete on a pointer, the memory it points to is freed. Calling delete
    on again will crash your program! When you delete a pointer, set it to nullptr.
    Calling delete on a null pointer is guaranteed to be safe. For example:


    ```

    Animal *pDog = new Animal;

    delete pDog; // frees the memory

    pDog = nullptr; // sets pointer to null

    // ...

    delete pDog; // harmless

    ```


    Don’t worry if the preceding code looks confusing. We’ll look at allocating objects
    on the heap the next hour. This also works with data types like int, as shown
    here:


    ```

    int *pNumber = new int;

    delete pNumber; // frees the memory

    pNumber = nullptr; // sets pointer to null

    // ...

    delete pNumber; // harmless

    ```'
