  md: '# Simulating an Alarm System


    A simulation is a computer model of a real-world system. There are many reasons
    to build a simulation, but a good design must start with an understanding of what
    questions you hope the simulation will answer.


    As a starting point, examine this problem: You have been asked to simulate the
    alarm system for the house. The house has four bedrooms, a finished basement,
    and an under-the-house garage.


    The downstairs has the following windows: three in the kitchen, four in the dining
    room, one in the half-bathroom, two each in the living room and the family room,
    and two small windows to the next door. All four bedrooms are upstairs; each has
    two windows except for the master bedroom, which has four. There are two baths,
    each with one window. Finally, there are four half-windows in the basement and
    one window in the garage.


    Normal access to the house is through the front door. In addition, the kitchen
    has a sliding glass door, and the garage has two doors for the cars and one door
    for easy access to the basement. There is also a cellar door in the backyard.


    All the windows and doors have alarms, and there is a panic button on each phone
    and next to the bed in the master bedroom. The grounds have alarms, as well, although
    these alarms are carefully calibrated so they are not set off by animals or birds.


    A central alarm system in the basement sounds a warning chirp when the alarm has
    been tripped. If the alarm is not disabled within a set amount of time, the police
    are called. If a panic button is pushed, the police are called immediately.


    The alarm is wired into the fire and smoke detectors and the sprinkler system.
    The alarm system itself is fault tolerant, has its own internal backup power supply,
    and is encased in a fireproof box.


    # Conceptualization


    In the conceptualization phase, you try to understand what the customer hopes
    to gain from the program: What is this program for? What questions might this
    simulation answer? For example, you might be able to use the simulation to answer
    these questions: How long might a sensor be broken before anyone notices? Is there
    a way to defeat the window alarms without the police being notified?


    The conceptualization phase is a good time to think about what is inside the program
    and is outside. Are the police represented in the simulation? Is control of the
    actual house alarm in the system itself?'
  merge: -1
