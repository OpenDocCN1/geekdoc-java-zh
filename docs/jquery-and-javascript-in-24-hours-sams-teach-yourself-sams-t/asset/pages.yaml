    +   - Always use public:, private:, protected: labels; don''t rely on the defaults.


    +   - List the public members first, then protected, then private. List the data
    members in a group after the member functions.


    +   - Put the constructors first in the appropriate section, followed by the destructor.
    List overloaded member functions with the same name adjacent to each other. Group
    accessors when possible.


    +   - Consider alphabetizing the member function within each group and alphabetizing
    the member variables. Be sure to alphabetize the filenames in include statements.


    +   - Even though the virtual keyword is optional when overriding, use it anyway;
    it helps to remind you that it is virtual, and also keeps the declaration consistent.


    # Class Definitions


    Try to keep the definitions of member functions in the same order as the declarations.
    It makes things easier to find.


    When defining a function, place the return type and all other modifiers on a previous
    line so that the class name and function begin on the left margin. This makes
    it much easier to find functions.'
