    Run this program to eyeball the following output:

    String1: Free the bound periodicals!

    String2: Free the bound periodicals!


    A character array is created on Line 6 and initialized with the value of a string
    literal. strcpy() function on Line 9 takes two character arrays: a destination
    and a source that will copy it. If the source is larger than the destination,
    strcpy() writes data past the end of the buffer.


    To protect against this, the standard library also includes the function strnc().
    This version takes a third argument that specifies the maximum number of characters
    to copy: strcpy(string1, string2, 80);


    # Reading Arrays with Foreach Loops


    One disadvantage of C++ relative to languages such as Java has the amount of code
    required to do one of the common tasks in programming. When you loop through the
    elements of an array (or other data structures), the code is a bit cumbersome.


    A recent addition to C++ is a new for loop that can loop through every element
    in an array. It is commonly called a foreach loop because it iterates through
    it once for each element.


    This foreach loop uses the keyword for, just like other for loops. Unlike for
    loops, the foreach has two sections separated by a colon (:) instead of three
    separated by semicolons.'
