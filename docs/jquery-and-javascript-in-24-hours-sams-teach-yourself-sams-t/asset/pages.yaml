    # Virtual Destructors


    It is permitted and even in C++ to pass a pointer to a derived object when a pointer
    to a base object is expected. What happens when pointer to a derived object is
    deleted? If the destructor is virtual, as it should be, the right thing happens—the
    derived class''s destructor is called. Because the derived class''s destructor
    will automatically invoke the base class''s destructor, the entire object will
    be properly destroyed.


    The rule of thumb is this: If any of the functions in your class are virtual,
    the destructor also be virtual.


    # Virtual Copy Constructors


    As previously stated, no constructor can be virtual. Nonetheless, there are times
    when your program desperately needs to pass in a pointer to a base object and
    have a copy of the correct derived object that is created. A common solution to
    this problem is to create a clone member in the base class and make it virtual.
    A clone function creates a copy of the current object and returns that.


    Because each derived class overrides the clone function, a copy of the derived
    class is created. The Mammal11 program (Listing 17.4) shows how this is.


