    # # Summary


    Polymorphism enables the same interface to be implemented with different member
    functions in a set of classes related by inheritance.


    This makes it possible for related objects to be used in the same manner, even
    if each object implements the behavior differently.


    Polymorphism achieves an important goal in object-oriented programming by letting
    objects handle related functionality by reusing an interface.


    # # Q&A


    +   Q. Why not make all classes virtual?

    A. There is overhead with the first virtual function in the creation of a v-table.
    After that, the overhead is trivial. Many C++ programmers feel that if one function
    is virtual, all others should be. Other programmers disagree, believing that there
    should always be an explicit reason for what you do in a program.


    +   Q. If a function someFunc() is virtual in a base class and also is overloaded
    so as to take either or two integers, the the classes override the function taking
    one integer, what is called when a pointer to a derived object calls the two-integer
    function?

    A. This causes the compiler to fail with an error. The overriding of the one-integer
    form of the function hides the entire base class function. The compiler fails
    with a message stating that the function requires only one integer.


    +   Q. What is the origin of "Rudolph the Red-Nosed Reindeer?"

    A. "Rudolph the Red-Nosed Reindeer" began as a 1939 poem by Robert May, a 34-year-old
    copywriter for the Montgomery Ward department in Chicago. May''s boss wanted something
    to give children in the store, and it became so popular that five million copies
    were distributed in the ''30s and ''40s.

    The poem was written when May''s wife was seriously ill. Like Rudolph, May''s
    four-year-old daughter left out—her mother could not do things with her like other
    mothers could.'
