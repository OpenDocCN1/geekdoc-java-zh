    An interpreter-based language translates a program as it reads each line, acting
    on each instruction.


    A compiler-based language translates a program into what is called object code
    through a process called compiling. This code is stored in an object file. Next,
    a linker transforms the object file into an executable program that can run on
    an operating system.


    Because interpreters read the code as it is written and execute the code on the
    fly, they''re easy for programmers to work with. Compilers require the more inconvenient
    extra steps of compiling and linking programs. The benefit to this approach is
    that the programs run significantly faster than by an interpreter.


    For many years, the principal goal of programmers was to write short pieces of
    code that would execute quickly. Programs needed to be small because memory was
    expensive, and they needed to be fast because processing power was expensive.
    As computers have become, faster, and more powerful and the cost and capacity
    of memory has fallen, these priorities diminished in importance.


    Today, the greatest expense in programming is the cost of a programmer''s time.
    Modern languages such as C++ make it faster to produce well-written, easy-to-maintain
    programs that can be extended and enhanced.


    # Styles of Programming


    As programming languages have evolved, languages have been created to cater to
    different styles of programming.


    In procedural programming, programs are conceived as a series of actions performed
    on a set of data. Structured programming was introduced to provide a systematic
    approach to organizing these procedures and managing large amounts of data.


    The principal ideal behind programming is to divide and conquer. Take a task that
    needs to be accomplished in a program, and if it is too complex, break it down
    into a set of smaller component tasks. If any of those tasks is still complicated,
    break it down into even smaller tasks. The end goal is tasks that are small and
    self-contained enough to be easily understood.


    As example, pretend you''ve been asked by this publisher to write a program that
    tracks the average income of its team of enormously talented and understated charismatic
    computer authors. This job can be broken down into these subtasks:


    +   1. Find out what each author earns.


    +   2. Count how many authors the publisher has.'
