    # Summary


    The loops and conditionals you learned about during this hour add considerable
    brainpower to C++ programs.


    The while loop runs a block of code until a condition is no longer true. If the
    condition is never true, the loop never executes.


    By contrast, the do-while loop runs a block of code at least once, even if the
    tested condition is never true.


    A for loop is designed using initialization, test, and action sections. These
    sections make it possible to create a counter variable, test its value, and change
    its value within the for statement that creates the loop.


    Sophisticated loops can be developed with the continue statement, which skips
    to the beginning of the next iteration through a loop, and the break statement,
    which ends a loop entirely.


    The switch-case conditional simplifies the process of checking the same variable
    for a set of different equality values. Although the same task could be achieved
    by a series of if or if-else conditionals, switch is simpler to develop and debug.'
