  md: '# Other Bases


    It is not an arbitrary choice that we use base 10; after all, our species has
    10 fingers. One can imagine a different base, however. Using the rules found in
    base 10, here''s how you can describe base 8:


    +   1. The digits in base 8 are 0–7.

    2. The columns are powers of 1s, 8s, 64s, and so on.

    3. With n columns, you can represent 0 to 8\–1.


    To distinguish numbers written in each base, write the base as a subscript next
    to the number. The number fifteen in base 10 would be written as 15 and read as
    “one, five, base ten."


    Therefore, to represent the number $15_{10}$ in base 8, you would write $17_8$.
    This is read “one, seven, base height.” Note that it can also be read “fifteen,”
    because that is the number it continues to represent.


    Why 17? The 1 means eight, and the 7 means seven ones. One plus seven ones equals
    fifteen. Consider asterisks:


    \*\*\*\*\*

    *\*\*\*\*


    The natural tendency is to make two groups, a group of ten asterisks and another
    of five. This would be represented in decimal as 15 (1 ten and 5 ones). You can
    also group the asterisks as follows:


    \*\*\*\*

    *\*\*\*\*


    That is, eight asterisks and seven. That would be represented in base 8 as $17_8$.
    That is, one eight and sevens.


    # Around the Bases


    You can represent the number fifteen in base 10 as 15, or $15_{10}$ in base 9
    as $16_9$, in base 8 as $17_8$, in base 7 as $21_7$. Why 21? In base 7, there
    is no numeral 8. To represent fifteen, you need two 7s and one.


    How do you generalize the process? To convert a base 10 number to base 7, think
    about the columns: in base 7, they are sevens, forty-nine, three-hundred forty-three,
    and so on. Which these columns? They represent $7^0$, $7^1$, $7^2$, $7^3$, and
    so forth. Create a table for yourself:


    | | 3 | 2 | 1 |

    | $7^3$ | $7^2$ | $7^1$ | $7^0$ |

    | 343 | 49 | 7 | 1 |'
