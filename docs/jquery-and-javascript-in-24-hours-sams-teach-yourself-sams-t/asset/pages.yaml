  md: 'Now that you are comfortable with the syntax of pointers, you can put them
    to better use.

    Pointers are employed most often for three tasks:


    +   * Managing data on the heap

    * Accessing class member data and functions

    * Passing variables by reference to functions


    The rest of this hour focuses on managing data on the heap and accessing class
    member data and functions. In Hour 12, “Creating References,” you learn about
    passing variables by reference.


    # The Stack and the Heap


    Programmers generally deal with five areas of memory:


    +   * Global name space

    * The heap

    * Registers

    * Code space

    * The stack


    Local variables are on the stack, along with function parameters. Code is in code
    space, of course, and global variables are in global name space. The registers
    are used for internal housekeeping functions, such as keeping track of top of
    the stack and the instruction pointer. Just about all remaining memory is given
    over to the heap, which is sometimes referred to as the free store.


    The limitation of local variables is that they don''t persist. When the function
    returns, the local variables are thrown away. Global variables solve that problem
    at the cost of being accessible without restriction throughout the program, which
    leads to the creation of bug-prone code that is more difficult to understand and
    maintain. Putting data in the heap solves both of these problems.


    You can think of the heap as a massive section of memory in which thousands of
    sequentially cubbyholes lie waiting for your data. You can''t label these cubbyholes,
    though, as you can with the stack. You must ask for the address of the cubbyhole
    that you reserve and then stash that address away in a pointer.


    One way to think about this is with an analogy: While camping, you avoid getting
    lost the location of your tent in a GPS device and give it the descriptive name
    “Camp.” The device saves the latitude and longitude of that location, but you
    don''t memorize them yourself.


    When you use the device later, you don''t know the exact latitude and longitude,
    only that the name Camp will lead you to that place.'
