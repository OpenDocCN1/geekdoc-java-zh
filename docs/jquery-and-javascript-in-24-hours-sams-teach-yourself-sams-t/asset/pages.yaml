  md: "# Instances of the Template\n\nTemplates enable you to teach the compiler how\
    \ to make a list of any type of thing, instead of creating a set of type-specific\
    \ lists. A PartsList is a list of parts; a RobotList is a list of robots. The\
    \ only way in which they differ is the type of the thing on the list. With templates,\
    \ the type of the thing on the list becomes a parameter to the definition of the\
    \ class.\n\nThe act of creating an object from a class or a specific type from\
    \ a template is called instantiation, and the individual classes are called instances\
    \ of the template.\n\n# Template Definition\n\nYou declare a parameterized List\
    \ object (a template for a list) with the template keyword, as in this code:\n\
    \n```\ntemplate <Class T> // declare the template and the parameter\nclass List\
    \             // the class being parameterized\n{\npublic:\n    List();\n    //\
    \ full class declaration\n};\n```\n\nThe keyword template is used at the beginning\
    \ of every declaration and definition of a template class. The template's parameters\
    \ follow the keyword template; they are the items that will change with each instance.\
    \ For example, in the list template shown in this code, the type of the objects\
    \ stored in the list will change. One instance might store a list of Integer objects,\
    \ another list of Animal objects.\n\nIn this code, the keyword class is used,\
    \ followed by the identifier T. The keyword class indicates that this is a parameter.\
    \ The identifier T is used throughout the rest of the template to refer to the\
    \ parameterized type. One instance of this class will substitute int everywhere\
    \ T appears, and will substitute Robot.\n\nTo declare an int and a Robot instance\
    \ of the parameterized list class, you would write the following:\n\n```\nList<int>\
    \ intList;\nList<Robot> robotList;\n```\n\nThe object intList is of the type of\
    \ integers; the object robotList is a list of Robot objects. You can now use the\
    \ type List<int> anywhere you would normally use a type—as the return value from\
    \ a function, as a parameter to a function, and so forth."
