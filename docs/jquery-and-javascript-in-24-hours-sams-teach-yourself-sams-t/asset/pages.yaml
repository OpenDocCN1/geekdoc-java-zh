  md: 'The answer to this question is decided not by any real-world, intrinsic factor,
    but by what makes sense in the design of your program. If you are writing a program
    that depicts a farm or a zoo, you might want Animal to an abstract data type but
    Dog to a class from which you can instantiate objects.


    On the other hand, if you are making an animal kennel, you might want to keep
    Dog as an abstract data type and only instantiate types of dogs: retrievers, terriers,
    and so forth. The level of abstraction is a function of how finely you need to
    distinguish your types.


    # Summary


    During this hour, you learned about abstract data types and pure virtual functions,
    aspects of the C++ language that make its support object-oriented programming
    more robust.


    An abstract data is a class that cannot be implemented as an object. Instead,
    defines common member variables and functions for its derived classes.


    A function becomes a pure virtual function by adding = 0 to the end of its declaration.
    If a class contains at least one pure function, the class is an abstract data
    type.


    The compiler will not allow objects of an abstract data type to be instantiated.


    # Q&A


    +   - **Why is dynamic casting bad?**

    - **The point of virtual functions is to let the virtual table, rather than the
    programmer, determine the runtime type of the object.**

    - **Why making an abstract data type? Why not just make it non-abstract and avoid
    any kinds of that?**

    - **The purpose of many of the conventions in C++ is to enlist the compiler in
    finding bugs to avoid runtime bugs in completed code. Making a class abstract
    by giving it pure virtual functions causes the compiler to flag objects created
    of that abstract type errors. It also means that you can share the abstract data
    types with other applications or programmers.**

    - **Has anyone ever Silbo, the whistling language used in Gomera in the Canary
    Islands?**

    - **The best reference on the topic of Silbo Gomero and similar forms of speech
    is Whled Languages, a 1976 book by R. G. Busnel and A. Classe that''s available
    at many public libraries. Silbo allows shepherds to communicate over deep ravines
    and narrow valleys at distances of 3 miles or more. The language has fallen into
    disuse on the island of 21,000.**'
