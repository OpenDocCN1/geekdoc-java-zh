  md: '436 APPENDIX D: Using the MinGW C++ Compiler on Windows


    You can also use the CD command in other ways:


    +   - Type CD \> to open the root folder on the current hard drive.

    - Type CDfoldername to open a subfolder matching the name you''ve used in place
    of filename, if such subfolder exists.

    - Type CD .. to open the folder that contains the current folder. For example,
    if you are in C:\Windows\Fonts and you use the CD .. command, C:\Windows is opened.

    - It''s helpful to create a folder for the projects you create in this book, such
    as one Cpp24. If you have already done this, you can switch to that folder by
    using the following commands:


    CD \


    CD Cpp24


    If you haven''t created that folder yet, you can do so using an MS-DOS command.


    # Creating Folders in MS-DOS


    To create a folder from a command line, type the command MD followed by the folder''s
    name, and press Enter, in the following example:


    MD C:\Stuff


    The folder is created in the root folder of the system''s C: drive. To open a
    newly created folder, use the CD command followed by that folder''s name, as shown
    in Figure D.6.


    ![](img/69d0ba7a89f66b74047c2f072930167f_449_0.png)


    FIGURE D.6

    Creating a new folder in a command-line window.'
  merge: -1
