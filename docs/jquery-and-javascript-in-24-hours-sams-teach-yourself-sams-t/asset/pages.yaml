    Emerson never had to deliver a 100,000-line C++ web application on deadline. Having
    consistency in your code is a good thing. It makes your life, and the life of
    your co-workers, easier if you follow the style of your group. That doesn''t mean
    the style has to be permanently fixed (improvements and new ideas come along the
    time), but the consistency makes it easier for everyone to work together.


