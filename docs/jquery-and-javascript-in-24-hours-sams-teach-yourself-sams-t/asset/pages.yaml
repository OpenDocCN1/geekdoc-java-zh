    # The Newest Version of C++


    Since the C++ programming language was created by Bjarne Stroustrup in 1979, it
    has undergone several significant revisions.


    In 1983, its name was changed from C Classes to C++, and numerous features such
    as virtual functions, operator overloading, and references were added. Two years
    later, the first edition of Stroustrup''s book C++ Programming Language was published,
    offering a full reference to a language that had not yet become an official standard.


    In 1989, version 2.0 of C++ came out and included such features as multiple inheritance,
    static member functions, and abstract classes.


    Nine years later, the C++ standards committee published the standardized version
    of the language, a version described informally as C++98.


    In 2011, C++11 was released after several years in its sliding schedule led it
    to be dubbed C++0x. (The Ox were a placeholder for the final two numbers in the
    year.)


    The latest and greatest version of the language is C++14. Most current C++ tools
    fully support this version, so you can begin taking advantage of the newest improvements
    to the language.'
