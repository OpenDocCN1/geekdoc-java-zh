  md: '# # APPENDIX D

    # Using the MinGW C++ Compiler on Windows


    This book works with any programming tool or integrated development environment
    (IDE) that supports C++14, the current version of the C++ programming language.
    If you already have an IDE such as Microsoft Visual Studio or C++ Builder and
    you know it supports C++14, you can use it and stop reading this appendix right
    now.


    A popular and free option for Windows users who want to learn C++ is GCC compiler,
    part of an open source programming toolkit for the language. GCC, which is available
    for Windows, Mac OS, and Linux, is a set of programs that are used in a command
    window instead of a graphical interface. You edit programs in any text editor
    you like, then type commands to make the C++ compiler and linker create a program''s
    executable code.


    GCC is included in MinGW, a set of programs called Minimalist GNU for Windows.
    In this appendix you learn how to download, install, and set up MinGW to work
    on a Windows computer.


    # ## Downloading MinGW-w64


    The most up-to-date version of MinGW for Windows is MinGW-64, which can be downloaded
    from the project''s SourceForge repository at http://sourceforge.net/projects/mingw-w64.
    This holds a lot of files, including the source code for advanced programmers
    to examine and modify, but all you need is the program''s main installation file
    for Windows.


    Click the Link in the navigation bar (which also includes links like Summary,
    Support, and Wiki).


    A page opens listing the project''s folders and files. Near the top, there should
    be a line that reads “Looking for the latest version?” followed by a link with
    the text Download Official MinGW-w64 installer. Click this link. The MinGW-w64
    download should begin automatically after a few seconds.


    (If you can''t find this link, try http://sourceforge.net/projects/mingw-w64/latest/download?source=files.)'
  merge: -1
  pgno: 442
- img_proc: true
  md: '430 APPENDIX D: Using the MinGW C++ Compiler on Windows


    This download is an installation wizard. Run it to begin installing the software.


    The wizard presents you with setup settings as Version, Architecture, and Build
    Revision. As a new user of MinGW-w64, you can click Next to accept the default
    values for these settings.


    You are asked for a destination folder in which to store the software. Instead
    of using the default value, here''s a better choice: In the Destination folder
    field, type C:\MinGW\, as shown in Figure D.1 (This assumes that C: is your main
    drive, as it is for most Windows users.)


    ![](img/69d0ba7a89f66b74047c2f072930167f_443_0.png)


    FIGURE D.1

    Choosing a folder for MinGW.'
  merge: -1
  pgno: 443
- img_proc: true
  md: 'Click Next to install the software in the chosen folder. This process is tracked
    by a progress bar, and when it''s complete, click Finish to close the wizard.


    After the software has been installed, you must manually configure Path, a Windows
    environment variable.


    # Setting the Path Environment Variable


    The MinGW tools are used in a command window. For these commands to work, Windows
    must know where the GCC compiler and the other tools can be found.


    These tools are in the bin subfolder the project''s main folder.


    If you choose C:\MinGW as the main, the tools are in C:\MinGW\mingw32\bin.


    This folder must be included in Path, an environment variable that contains a
    list of folders. Windows uses Path to locate programs when you type a command.


    There''s an Environment Variables dialog in the Control Panel.


    On Windows 10, set the Path variable with these steps:


    +   1. In the Search box on the task bar, enter environment in. A list of search
    results appears above the box.

    2. One of the top search results is Enter environment variables for your account.
    Click this result. The System Properties dialog opens.

    3. Click the Environment Variables button. A dialog with that title opens.

    4. In the System Variables pane, scroll down and choose Path, then click the Edit
    button below the System Variables pane. The Edit Environment Variables dialog
    appears.

    5. The Edit Environment Variables dialog lists all the folders in the Path. To
    add a new folder, click the New button. An entry opens up at the bottom of the
    list, as shown in Figure D.2.'
  merge: -1
