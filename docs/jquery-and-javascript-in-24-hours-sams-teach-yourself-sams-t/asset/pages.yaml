    - Unary operators are associated with their operand, so don''t put a space between
    them. Put a space on the side away from the operand. Unary operators include !,
    ~, +, -, * (pointers), & (casts), and sizeof.

    - Binary operators should have spaces on both sides: +, =, *, /, &, >>, <<, <
    >, ==, !=, &, |, and so on.

    - Don''t lack of spaces to indicate precedence (4+3*).

    - Put a space after commas and semicolons, before.

    - Parentheses should not have spaces on either side.

    - Keywords, such as if, should be set off by a space: if (a == b).

    - The body of the comment should be set off from the // with a space.


