    \ an advanced data structure known as a linked list.\n\n# Character Arrays\n\n\
    Familiarity with arrays makes it possible to work with longer text than the single\
    \ characters represented by the char data type. A string is a series of characters.\
    \ The strings you've worked up to this point have been string literals in std::cout\
    \ statements:\nstd::cout << \"Solidum petit in profundis\\n\";\n\nIn C++, string\
    \ is an array of characters ending with a null character, a special character\
    \ coded as '\\0'. You can declare and initialize a string like any other:\n\n\
    ```\nchar yum[] = { 'Z', 'o', 'm', 'b', 'i', 'e', \n               ' ', 'E', 'a',\
    \ 't', '\\ ', 'B', 'r', 'a', 'i', 'n',\n               's', '\\0' };\n```\n\n\
    The last character, '\\0', is the null character that terminates the string.\n\
    Because this character-by-character approach is difficult to debug and too many\
    \ opportunities for error, C++ enables a shorthand form of string initialization\
    \ using a literal:\n\n```\nchar yum[] = \"Zombie Eat Brains\";\n```\n\nThis form\
    \ of initialization does not require the null character; the compiler adds automatically.\n\
    The string \"Zombie Eat Brains\" is 18 bytes, including null.\nYou can also create\
    \ uninitialized character arrays, which are called buffers. With all arrays, it\
    \ is important to ensure that you put not more into the buffer than there is room\
    \ for.\n\nBuffers can be used to store text input by a user. Several programs\
    \ created in past hours used the std::cin object to collect user input and store\
    \ it in a variable:\nstd::cin >> yum;\n\nAlthough this approach works, two major\
    \ problems arise. First, if the user enters more characters than the size of the\
    \ buffer, cin writes past the end of the buffer, making the program run improperly\
