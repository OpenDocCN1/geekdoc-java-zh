  md: 'In the 1978 Gator Bowl in Jacksonville, Florida, the Buckeyes had the ball
    and were trailing Clemson 17-15 with a little over two minutes left. Charlie Bauman
    intercepted an Art Schlich pass and was knocked out of bounds on the Ohio State
    sideline.


    Hayes punched him in the neck and hit one of his players who were trying to restrain
    him. The coach was fired one day later and died in 1987.


    The coach once explained his competitiveness this way: “Nobody despises losing
    more than I do. That’s what got me into trouble over the years, but it also made
    a man with mediocre ability to a pretty good coach.


    # Workshop


    Now that you''ve had the chance to learn about static functions and friend functions,
    you can answer a few questions to see how well your brain is functioning.


    # Quiz


    +   1. How many copies of a static member variable exist for a class?


    +   A. None

    B. One

    C. One for each object of the class


    +   2. What keyword makes a member function static?


    +   A. static

    B. friend

    C. const


    +   3. When should you delete after you''re done using a function pointer?


    +   A. Always

    B. Never

    C. Sometimes


    # Answers


    +   1. Only one version is instantiated for all objects of that class.


    +   2. A The static keyword makes both member variables and functions static for
    the entire class.


    +   3. B Unlike a pointer that holds an address in memory, which should be deleted
    when longer needed, a function pointer points to code and cannot be freed with
    delete.'
