  md: '# Why Should I Learn C++?


    You could be learning a lot of other languages, C++ is valuable to learn because
    it has stood the test of time and continues to be a popular choice for modern
    programming.


    Despite being created in 1979, C++ is still being used for professional software
    today because of the power and flexibility of the language. There’s a new version
    of the language, called C++14, that makes it even more useful.


    Because other languages such as Java were inspired by C++, learning the language
    can provide you insight into them, well. Mastering C++ gives you portable skills
    that you can use on just any platform on the market today, from desktop computers
    to Linux servers, mobile devices, videogame consoles, and mainframes.


    # What If I Don’t Want This Book?


    I’m sorry you feel that way, but these things happen sometimes. Please reshelve
    this book with the front cover facing outward on an endcap with a lot of the store’s
