    # The Copy Constructor


    In addition to providing a default constructor and destructor, the compiler provides
    a default copy constructor. The copy constructor is called every time a copy of
    an object is made.


    When you pass an object by value, either into or as a function''s return value,
    a temporary copy of that object is made. If the object is a user-defined object,
    the class''s copy constructor is called.


    All copy constructors take one parameter: a reference to an object of the same
    class. It is a good idea to make it a constant reference, because the constructor
    will not have to alter the object passed in. For example:


    ```

    Tricycle(const Tricycle &triple);

    ```


    In this statement the Tricycle constructor takes a constant reference to an existing
    Tricycle object. The goal of the copy constructor is to make a copy of trike.


    The default copy constructor simply copies each member variable from the object
    passed as a parameter to the member variables of the new object. This is called
    a shallow (or member-wise) copy. This is fine for most member variables, it does
    not work for member variables that are pointers to objects on the heap.


    A shallow copy copies the exact values of one object''s member variables into
    another object. Pointers in both objects end pointing to the same memory. A deep
    copy, on the other hand, copies the values allocated on the heap to the newly
    allocated memory.


    An example illustrates the problem: if the Tricycle class includes a member variable
    called durability pointing to an integer on the heap, the default copy constructor
    copies the'
