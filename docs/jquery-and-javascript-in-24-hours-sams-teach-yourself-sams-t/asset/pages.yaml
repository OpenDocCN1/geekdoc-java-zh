  md: '# HOUR 22

    Employing Object-Oriented Analysis and Design


    What You''ll Learn in this Hour:


    +   - How to analyze problems from an object-oriented perspective

    - How to design your program from an object-oriented perspective

    - How to apply the syntax of C++ to implement design objectives

    - How to design for reusability and extensibility


    # The Development Cycle


    Many books and articles have been written about the development cycle. Some propose
    a waterfall technique, in which designers determine what the program should do.
    Architects determine how the program will be built, what classes will be used,
    and so forth. Programmers implement the design and architecture. By the time the
    design and architecture are given to the programmer, they are complete; all the
    programmer needs to do is implements the functionality.


    Even if the waterfall technique worked, it would be a poor technique for writing
    good programs. As the programmer proceeds, there is a necessary and natural feedback
    loop between what has been written so far and what remains to be. While it is
    true that good C++ programs are designed in great detail before a line of code
    is written, it is not true that design remains unchanged throughout the cycle.


    The amount of design that must be finished up, before programming begins, is a
    function of the size of the program. A highly complex effort, involving dozens
    of programmers working for many months, will require a more articulated architecture
    than a quick-and-dry application in one day by a single programmer.


    This hour focuses on the design of, complex programs that will be expanded and
    enhanced over many years. Many programmers enjoy working at the bleeding edge
    of technology; they tend to write programs whose complexity pushes the limits
    of their tools and understanding. In many ways, C++ was designed to extend the
    complexity that a programmer can manage.'
