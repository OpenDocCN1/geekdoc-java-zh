    A program is executed by line by line code, beginning with the start of main().
    When a function is called, the program branches off to the function. After the
    function has done its work, it returns control to the line where the function
    was called. Functions may or not return a value, with the exception of main(),
    which always returns an integer.


    Functions consist of a header and a body. The header consists of these:


    +   - The data type of the function returns


    +   - The function''s name


    +   - The parameters received by the function


    The function name is a short identifier that describes its purpose.'
