    # Null Pointers and Null References


    When pointers are not initialized, or when they are, ought to be assigned to nullptr.
    This is not true for references. In fact, a reference cannot be null, and a program
    with a reference to a null object is considered an invalid program. When a program
    is invalid, just about anything can happen. It can appear to work, run with an
    insignificant error, or erase important files on your hard drive. All are possible
    outcomes of an invalid program.


    Most compilers support null references without much complaint, crashing only if
    you try to use the reference in some way. Taking advantage of this, however, is
    not a good idea. When you move your program to another computer or a different
    compiler, mysterious bugs might occur if you have null references.


