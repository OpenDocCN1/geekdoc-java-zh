    messages necessarily share a base class with the preferences?


    # Rooted Hierarchies Versus Non-Rooted


    There are two overall approaches to inheritance hierarchies: you can have all,
    or nearly all, of your classes descend from a common root class, or you can have
    more than one inheritance hierarchy. An advantage of a common root class is that
    you can often avoid multiple inheritance; a disadvantage is that more times implementation
    will climb up into the root class.


    A set of classes is rooted if all share a common ancestor. Non-rooted hierarchies
    do not all share a common base class.


    Because you know that your product will be developed on many platforms, and multiple
    inheritance is complex and not necessarily well supported by all compilers on
    all platforms, your decision is to use a rooted hierarchy and single inheritance.
    You decide to identify those places where multiple inheritance might be used in
    the future. You can then design so that breaking apart the hierarchy and adding
    multiple inheritance at a later time not be traumatic to your design.


    You decide to prefix the name of all your internal classes with the letter p,
    so that you can easily and quickly tell which classes are yours and which are
    from other libraries.


    Your root class will be pObject. Nearly every class you create will descend from
    this object. pObject itself will be fairly simple; only the data that absolutely
    every item shares will appear in this class.


    If you want a rooted hierarchy, you should give the root a fairly generic name
    (like pObject) and few capabilities. The point of a root object is to be able
    to create collections of all its descendants and refer to them as instances of
    pObject. The trade-off is that rooted hierarchies often push the interface into
    the root class.


    The next likely candidates for top-of-the-hierarchy status are pStored and pired.
    pStored objects are saved to a file at various times (for example, when the program
    is not in use), and'
