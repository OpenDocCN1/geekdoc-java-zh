- img_proc: true
  md: 'Research and real-world experience have consistently shown that the later in
    the development process you find a problem, the more it costs to fix. The least
    expensive problems to fix are the ones you avoid creating. The next cheapest are
    those the C++ language standard forces compilers to put a lot of energy reporting
    a growing list of errors at compile time.


    Bugs that are compiled and caught at the first test—those that crash every time—are
    less expensive to find and fix than those that only crash in a while.


    A bigger problem than logic or syntactic bugs is unnecessary fragility: Your program
    works just fine if the user enters a number when one asks for it, but it crashes
    if the user enters letters. Other programs crash if they run out of memory, or
    if the hard disk is full, or if the Internet connection drops.


    To combat this fragility, programmers strive to make their programs bulletproof.
    A bulletproof program is one that can handle anything that comes up at runtime,
    by bizarre input to running out of memory. If you watch out and prepare for these
    things, you can avoid a crash.


    # Handling the Unexpected


    Programmers use design reviews and exhaustive testing to find logic errors.


    A different kind of error that may arise is called an exception.


    Exceptions take their name from exceptional circumstances. Some things that may
    occur in a program can''t be eliminated. Instead, you can only prepare for them.
    For example, computers will run out of memory from time to time. Programs only
    respond when it occurs, using one of these approaches:


    +   - Crash the program.

    - Inform the user and exit gracefully.

    - Inform the user and allow the user to recover and continue.

    - Take corrective action and continue without alerting the user.


    Although it is not necessary or even desirable for every program you write to
    automatically and silently recover from all exceptional circumstances, it is clear
    that you must do better than crashing.


    C++ exception handling provides a type-safe, integrated technique for coping with
    the predictable but unusual conditions that arise while running a program.'
