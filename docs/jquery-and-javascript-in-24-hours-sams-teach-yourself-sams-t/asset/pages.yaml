  md: '# PostMaster: A Case Study


    You confirm your early decision that you will read each mail message in its original
    format and transform it into PostMaster format. This way you will only have to
    store one core format, and writing to and reading from the disk will be simplified.
    You also decide to separate the header information (sender, recipient, date, title,
    and so on) from the body of the message. Often the user will want to scan the
    headers without necessarily reading the contents of all the messages. You anticipate
    that it might come when you want to download only the headers from the message
