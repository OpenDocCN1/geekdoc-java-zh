    user interface (or UI)—from the back end—the communications and database part.
    To get things going quickly, you decide to write for Windows, followed later by
    Mac OS and per Linux.


    This simple decision has enormous ramifications for your project. It becomes obvious
    that you need a class library or a series of libraries to handle memory management,
    the various user interfaces, and perhaps the communications and database components.


    Snett believes strongly that projects live or die by having one person with a
    clear vision, he asks that you do the initial architectural analysis and design
    before hiring any programmers. You set out to analyze the problem.


    # Divide and Conquer


    It quickly becomes obvious that you have more than one problem to solve. You divide
