  md: '# HOUR 7

    Storing Information in Arrays and Strings


    What You''ll Learn in This Hour:


    +   - How to store related data in arrays

    - How to declare arrays

    - How to create strings from character arrays

    - How to copy strings


    # What is an Array?


    An array is a collection of related data of the same data type. An array can be
    envisioned as a series of data storage locations. Each storage location is called
    an element of the array.


    An array is declared by writing the data type and array name followed by the number
    of elements the array holds square brackets. Here''s an example:


    ```

    long peaks[25];

    ```


    The array holds 25 integers. This declaration causes the compiler to set aside
    enough memory to hold all 25 elements. Because each long integer requires 4 bytes,
    this declaration sets aside 100 contiguous bytes of memory.


    Array elements are numbered from 0 to the largest element, so the peaks array
    holds elements from 0 through 24. Each element is accessed using its number in
    square braces. This statement assigns a value to the first peaks element:


    ```

    peaks[0] = 29029;

    ```


    This statement assigns a value to the last:


    ```

    peaks[24] = 7804;

    ```


    The number of an array element is also called its subscript.'
