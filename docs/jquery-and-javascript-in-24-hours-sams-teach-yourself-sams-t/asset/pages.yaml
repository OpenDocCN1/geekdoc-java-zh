  md: '# Overloading the Addition Operator


    The increment operator is a unary operator, which means it takes only one operand.
    The addition operator (+) is a binary operator which adds two operands together,
    which adds a new wrinkle to how overloading works.


    The next version of the Counter class will be able to add two Counter objects
    using the + operator:


    ```

    Counter var1, var2, var3;

    var3 = var1 + var2;

    ```


    Although you could write an add() method that takes Counter objects and returns
    a Counter that contains their sum, a better technique is to overload the + operator.
    The Counter program in Listing 15.4 shows how to do this.


    # LISTING 15.4 The Full Text of Counter4.cpp


    ```

    1:#include <iostream>

    2:

    3:class Counter

    4{

    5:public:

    6:   Counter();

    7:   Counter(int initialValue);

    8:   -Counter{}

    9:   int getValue() const { return value; }

    10:  void setValue(int x) { value = x; }

    11:  Counter operator+(const Counter&);

    12:

    13: private:

    14:  int value;

    15: };

    16:

    17: Counter::Counter(int initialValue):

    18:  value(initialValue)

    19: { }

    20:

    21: Counter::Counter():

    22:  value(0)

    23: { }

    24:

    25: Counter::operator+(const Counter &rhs)

    26: {

    27:   return Counter(value + rhs.getValue());

    28: }

    29:

    30: int main() {

    ```'
