  md: '# Constants


    A constant, like a variable, is a memory location where a value can be stored.
    Unlike variables, constants never change in value. You must initialize a constant
    when it is created. C++ has two types of constants: literal and symbolic.


    A literal constant is a value typed directly into your program wherever it is
    needed. For example, consider the following statement:


    ```

    long width = 19;

    ```


    This statement assigns the integer variable width the 19. The 19 in the statement
    is a literal constant. You can''t assign a value to 19, and its value can''t be
    changed.


    The values true and false, which are stored in bool variables, are also literal
    constants.


    A symbolic constant is a constant represented by a name, just like a variable.
    The const keyword precedes the type, name, and initialization. Here''s a statement
    that sets the point reward for killing a zombie:


    ```

    const int KILL_BONUS = 5000;

    ```


    Whenever a score is dispatched, the player''s score can be increased by the reward:

    playerScore = playerScore + KILL_BONUS;


    If you decide to increase the reward to 10,000 points, you can change the constant
    KILL_BONUS, and it will be reflected throughout the program. If you were to use
    the literal constant 5000 instead, it would be more difficult to find all the
    places it is used and change the value. Using constants reduces the potential
    for error.


    Well-named symbolic constants also make a program more understandable. Constants
    are often fully capitalized by programmers to make them distinct from variables.
    This is not required by C++, but the capitalization of a constant must be consistent
    in any statement where it appears because the language is case sensitive.


    # Defining Constants


    There''s another way to define constants that dates back to early versions of
    the C language, the precursor of C++. The preprocessor directive #define can create
    a constant by specifying its name and value, separated by spaces:


    ```

    #define KILL_BONUS 5000

    ```


    The constant does not have a type as int or char. The #define directive enables
    a simple substitution that replaces every instance of KILL_BONUS in the code with
    5000. The compiler sees only the end result.'
