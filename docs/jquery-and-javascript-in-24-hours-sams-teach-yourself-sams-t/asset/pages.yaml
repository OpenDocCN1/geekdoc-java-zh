  md: '# Summary


    Congratulations! You can now call yourself a C++ programmer, though you quit at
    this point no one will call you an ambitious one.


    The C++ language has been a popular choice for software development for more than
    three decades. The language has its idiosyncrasies, but when you become comfortable
    with how programs are structured, it is easy to build on your knowledge by creating
    more sophisticated programs.


    Over the next few hours, you learn the basic building blocks of C++, creating
    several programs each hour that demonstrate new facets of the language and programming
    techniques.


    Solidum petit in profundis!


    # Q&A


    +   Q. What is the difference between a text editor and a word processor?


    +   A. A text editor produces files with plain text in them—just letters, numbers,
    spaces, and punctuation. There are no formatting commands for things such as bold
    or italic text, justified lines, special margins, and so forth. You don''t need
    any of formatting in C++ source code, and using a word processor can save things
    in the file that the compiler won''t understand. If you have trouble getting the
    Motto to program and you''re on a Windows word processor, try a simpler editor
    such as Notepad (or Notepad++) on Windows to see whether that solves the problem.


    +   Q. My compiler has a built-in editor. Is that the right thing to use?


    +   A. It sounds like you''re using an integrated development environment (IDE),
    a graphical tool that speeds the process of writing, debugging, and testing programs.
    Sophisticated compilers such as Microsoft Visual Studio include a full IDE, enabling
    the programmer to help access files, edit, and compile the code in place, and
    also resolve compile and link errors without ever leaving the environment. These
