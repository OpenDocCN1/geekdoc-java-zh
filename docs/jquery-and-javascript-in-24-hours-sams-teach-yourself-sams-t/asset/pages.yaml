- img_proc: true
  md: '# Creating a folder


    Opening the folder


    If you haven''t already created a Cpp24 folder, you can do so from a command line:


    +   1. Change to the root folder (using the CD \ ).

    2. Type the command MD C:\Cpp24 and press Enter.


    After C:\Cpp24 has been created, you can go to it at any time from a command line
    by using this command:

    CD \Cpp24


    The last thing you need to learn about MS-DOS using MinGW is how to run programs.


    # Running Programs in MS-DOS


    The simplest way to run a program at the command line is to type its name and
    press Enter. For example, type DIR and press Enter to see a list of files and
    subfolders in the current folder.


    You can also run a program by typing its name followed by a space and some options
    that control how the program runs. These options are called arguments.


    To see an example of this, change to the root folder (using CD \) and type DIR
    Cpp24. You''ll see a list of files and subfolders contained in the Cpp24 folder,
    if it contains any.


    After you have installed MinGW, run the GCC compiler to see that it works. Type
    the following command at a command line:


    ```

    g++ --version

    ```


    g++ is the name of the GCC compiler, and --version is an argument that tells it
    to display its version number.


    You can see an example of this in Figure D.7, but your version number might be
    different, depending on what version of the kit you have installed.'
  merge: -1
