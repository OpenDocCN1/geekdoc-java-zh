  md: '# HOUR 17: Using Polymorphism and Derived Classes


    NOTE


    Polymorphism is an unusual word that means the ability to take many forms. It
    comes from the roots poly, which means many, and morph, which means form. You
    are dealing with Mammal in its many forms.


    You can use polymorphism to declare a pointer to Mammal and assign to the address
    of a Dog object you create on the heap. Because a Dog “is a” Mammal, the following
    is perfectly legal:


    Mammal* pMammal = new Dog;


    You can then use this pointer to invoke any member function on Mammal. What would
    you like is for functions that are overridden in Dog to call the correct function.


    Virtual member functions let you do. When you treat these objects polymorphically,
    you call the member function on the Mammal pointer and don’t know or care what
    the actual object is or how it implements its function.


    A virtual member function is declared with the virtual keyword. Here’s an example
    of this hour’s first project:


    ```

    void speak() const { std::cout << "Mammal speak!\n"; }

    ```


    The Mammal program in Listing 17.1 illustrates how virtual functions implement
    polymorphism.


    # LISTING 17.1 The Full Text of Mammal.cpp


    ```

    1: #include <iostream>

    2:

    3: class Mammal

    4: {

    5: public:

    6:     Mammal(int age) { std::cout << "Mammal constructor...\n"; }

    7:     ~Mammal() { std::cout << "Mammal destructor...\n"; }

    8:     void move(int step) const { std::cout << "Mammal move, one step!\\n"; }

    9:     virtual void speak() const { std::cout << "Mammal speak!\n"; }

    10:

    11: protected:

    12:     int age;

    13: };

    14:

    15: class Dog : public Mammal

    16: {

    17: public:

    18:     Dog(int age) { std::cout << "Dog constructor...\n"; }

    19:     ~Dog() { std::cout << "Dog destructor...\n"; }

    20:     void wagTail() { std::cout << "Wagging tail...\n"; } }

    ```'
