    All the extra member functions and data have been removed from these classes.
    On lines 6–8, the Mammal class declares the two overloaded move() functions. On
    line 17, Dog overrides the version of move() with no parameters. They are invoked
    on lines 24–26, and the output reflects this executed.


    Line 27, however, is commented out because it would cause a compiler error. Although
    the Dog class could have called the move (int) function if it had not overridden
    the version of move() without parameters, now that it has done so it must override
    both to use this. This is reminiscent of the rule that if you supply any constructor
    the compiler will no longer supply a default constructor.


    It is a common mistake to hide a base class member function, when you intend to
    override it, by forgetting to include the keyword const. That keyword is part
    of the signature, and leaving it off changes the signature and hides the member
    function instead of overriding it.


    Some compilers will give you a warning as the Mammal6 program somewhere lines
    14–18. Although you are allowed to hide base class functions from derived classes,
    it is often by mistake, prompting some compilers to issue a warning.


    # Calling the Base Member Function


    If you have overridden a base class member function, it is still possible to call
    it by fully qualifying the name of the function. You do this by writing the base
    name, followed by two colons, and the function name. For example:


    ```

    Mammal::move()

    ```


    It would have been possible to rewrite line 27 in Listing 16.6 so that it would
    compile:


    ```

    27: fido.Mammal::move(10);

