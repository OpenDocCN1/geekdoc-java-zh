  md: '# Hexadecimal 417


    Now, it turns out that if you treat this binary number as two sets of four digits,
    you can do a magical transformation.


    The right set is 1100. In decimal, that is 12, or in hexadecimal it is C.


    The left set is 1111, and in base 10 is 15, or in hex it is F.


    Thus, you have the following:


    ```

    1111    1100

    F       C

    ```


    Putting the two hex numbers together is FC, which is the real value of 1111 1100₂.
    This shortcut always works. You can take any binary number of length and reduce
    it to sets of four, translate each set of four to hex, and put the hex numbers
    together to get the result in hex.


    You can shortcut the hexadecimal to binary conversion using the reverse process.
    Split the hexadecimal number into individual digits and convert each of them into
    four binary digits (bits). If you remember the values of the first four bits are
    8, 4, 2, and 1, you can easily convert from hexadecimal to binary—because each
    hex digit can be treated as an individual four bits.


    Here''s a much larger number:


    ```

    1011 0001 0111

    ```


    The columns are 1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192,
    16384, and 32768:


