  md: "# Abstract Data Types 275\n\nIt is troubling, though, that it is possible to\
    \ instantiate a Shape object, and it might be desirable to make that impossible.\
    \ The Shape class exists only to provide an interface for the classes derived\
    \ from it. It is an abstract data type, or ADT.\n\nAn abstract data type represents\
    \ a concept (like a shape) rather than an object (like a circle). In C++, ADT\
    \ is the base class to other classes, and it is not valid to make an instance\
    \ of an ADT. Therefore, if you make Shape an ADT, it is not possible to make an\
    \ instance of a Shape object.\n\n# Pure Virtual Functions\n\nC++ supports the\
    \ creation of abstract data types with pure virtual functions. A pure virtual\
    \ function is a virtual function that must be overridden in the derived class.\
    \ A virtual function is made pure by initializing it with 0, as in the following\
    \ statement:\n\n```\nvirtual void draw() = 0;\n```\n\nAny class with one or more\
    \ pure virtual functions is an ADT, and it is illegal to instantiate an object\
    \ of a class that is an ADT. Trying to do so causes a compile-time error. Putting\
    \ a pure virtual function in your class signals two things to clients of your\
    \ class:\n\n+   - Don't make an object of this class; derive from it.\n- Make\
    \ sure to override the pure virtual function.\n\nAny class that derives from an\
    \ ADT inherits the pure virtual function as pure, so it must override every virtual\
    \ function if it wants to instantiate objects. Therefore, if Rectangle inherits\
    \ from Shape, and Shape has three pure virtual functions, Rectangle must override\
    \ all three of it, too, will be an ADT.\n\nA virtual function is declared to be\
    \ abstract by writing = 0 after the function declaration, as in this statement:\n\
    \n```\nvirtual long getArea() = 0;\n```\n\nHere's a rewrite of the Shape class\
    \ to be an abstract data type:\n\n```\nclass Shape\n{\npublic:\n    Shape() {}\n\
    \    virtual ~Shape() {}{\n    virtual long getArea() = 0;\n    virtual long getPerim()\
    \ = 0;\n    virtual void draw() = 0;\nprivate:\n};\n```"
