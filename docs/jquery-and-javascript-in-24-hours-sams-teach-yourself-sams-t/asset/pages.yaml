    # Overloading Functions


    In C++, more than one function can have the same name as long as there are differences
    in their arguments, a practice called function overloading. The functions must
    have different types for parameters, a different number of parameters, or both.
    Here are three prototypes for overloaded functions:


    ```

    int store(int, int);

    int store(long, long);

    int store(long);

    ```


    The store() function is overloaded with three different parameter lists. The first
    and second differ in the data types and the third differs in the number of parameters.


    The parameters the function is called with determine which function will be called.


    The return types for overloaded functions do not factor into whether they are
    different. Several overloaded functions can have the same return type, as in the
    preceding example, or different types. You can''t overload by making the return
    different, however, the parameter types or number of parameters must differ.


    Function overloading is also called polymorphism.


    Overloading makes it possible to create a function that performs a similar task
    on different types of data without creating unique names for each. If your program
    needs to average two numbers expressed in different formats, it could have functions
    named averageDoubles(), and averageFloats().


    To simplify, an overloaded function called average() could be used with these
    prototypes:


    ```

    int average(int, int);

    long average(long, long);

    float average(float, float);

    ```


    You just pass in the right data when calling average() and the proper function
    is called.'
