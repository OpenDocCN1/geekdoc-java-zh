    # Initializing Objects


    Constructors, like member functions, can be overloaded. The capability to overload
    constructors is powerful and flexible.


    A rectangle object could have two constructors. One takes a length and width as
    parameters and makes a rectangle of that size. The second takes no parameters
    and makes a rectangle of a default size specified by the class. The compiler chooses
    the right constructor based on the number and type of parameters.


    You can overload constructors, but you can''t overload destructors. Destructors
    always have the same signature: the name of the class preceded by a tilde (~)
    and no parameters.


