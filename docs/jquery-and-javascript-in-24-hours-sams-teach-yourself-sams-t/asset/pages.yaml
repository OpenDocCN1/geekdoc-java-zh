  md: '# Analysis and Requirements


    The conceptualization phase gives way to the analysis phase. During analysis,
    your job as object-oriented programming analyst is to help the customer understand
    what she requires from the program. Exactly what behavior will the program exhibit?
    What kinds of interactions can the customer expect?


    These requirements are typically captured in a series of documents, which might
    include cases. A *case* is a description of how the system will be used. It describes
    interactions and use patterns, helping the programmer capture the design goals
    of the system.


    NOTE

    Unified Modeling Language (UML) is one way of representing your requirements and
    analysis. The advantage of using UML to represent your information is twofold:
    it is graphical and it follows a standard form, so many people will be able to
    understand it. Although it is beyond the scope of this book to teach UML (there
    are many good books on that topic), you should know that it includes ways of representing
    use cases. It is particularly suited for object-oriented development, because
    it supports abstract and other types of cases directly.


    A good book for learning UML is *Sam Teach Yourself UML in 24 Hours, Third Edition*
    (ISBN: 0-672-32640-X), by Joseph Muller.


    # High-Level and Low-Level Design


    After the product is fully understood and the requirements have been captured
    in the appropriate documentation, it is time to move on to the high-level design.
    During this phase of the design doesn''t worry about the platform, operating system,
    or programming language issues. It concerns, instead, how the system will work:
    What are the major components? How do they interact with one another?


    One way to approach this problem is to set aside issues relating to the user interface,
    focusing only on the components of the problem space.


    The problem space is the set of issues and problems the program is trying to solve.
    The *solution space* is the set of possible solutions to the problems.


    As your high-level design evolves you''ll want to begin thinking about the responsibilities
    of the objects you identify—what they do and what information they hold. You also
    want to think about their collaborations—what objects interact with.


    For example, clearly you have sensors of various types, a central alarm system,
    buttons, wires, and telephones. Further thought persuades that you also simulate
    rooms, perhaps floors, and possibly groups of people such as owners and police.'
