  md: '# Summary


    Pointers can be created to point to simple data types like integers and to objects
    as well.


    Objects can be created and deleted on the heap. If you have declared an object,
    you can declare a pointer to that and instantiate the object on the heap.


    Data members of a class can be pointers to objects on the heap. Memory can be
    allocated in the class constructor or one of its functions and deleted in the
    destructor.


    The ability to directly access computer memory using pointers is one of the most
    powerful tools available to a C++ programmer.


    # Q&A


    +   Q. Why should I declare an object as const if it limits what I can do with?


    +   A. As a programmer, you want to enlist the return of a compiler in helping
    you find bugs. Any serious bug that is difficult to find is that that changes
    an object in ways that aren''t obvious to the calling function. Declaring object
    const prevents such changes.


    +   Q. Why should I bother to declare anything on the heap?


    +   A. Objects on the heap persist after the return of a function. They also are
    dynamic—you can allocate as many as you need for a particular application or set
    of input data. In addition, objects declared on the heap can be used to create
    complex data structures as explored in Hour 19, "Storing Information in Linked
    Lists"


    +   Q. Why do people have red eye in photographs?


    +   A. That happens when the camera''s bright flash reflects off a person''s retina,
    revealing the red color of blood vessels that nourish the eyes and giving pupils
    a demonic appearance.


    +   Some cameras offer a "red reduction" feature that reduces the effect by firing
    two flashes—before the picture is taken. The first flash causes the photo subject''s
    pupils to contract, minimizing the red-eye effect.


    +   Pupils that appear white in a photo are a possible indicator of eye disease
    such as retinoblastoma, a highly treatable cancer if detected early. If a photo
    shows a white-eye effect, the subject should seek an ophthalmologist to ensure
    his or her eyes are healthy.


