  md: 'pAge is called indifference because you are indirectly accessing howOld by
    means of pAge. Later this hour you see how to use indifference to access a variable''s
    value.


    Indirection accesses the value at the address held by a pointer. The pointer provides
    an indirect way to get the value held at that address.


    # The Indirection Operator, or Using Pointers Indirectly


    The indirection operator * is also called the dereference operator. When a pointer
    is dereferenced, the value at the address stored by the pointer is retrieved.
    Consider the following statements to assign one variable''s value to another:


    ```

    unsigned short int howOld = 50;

    unsigned short int yourAge;

    yourAge = howOld;

    ```


    A pointer provides indirect access to the value of the variable whose address
    it stores. To assign the value in howOld to the new yourAge by means of the pointer
    pAge, you write the following:


    ```

    unsigned short int howOld = 50;

    unsigned short int *pAge = &howOld;

    unsigned short int *yourAge;

    // create the variable howOld

    // pAge points to the address of howOld

    // create another variable

    // assign value at pAge (50) to yourAge

    yourAge = *pAge;

    ```


    NOTE

    The indirection operator * is used in two distinct ways with pointers: declaration
    and dereference.

    When a pointer is declared, the star indicates that it is a pointer, not a normal
    variable.

    For example:


    ```

    unsigned short *pAge = nullptr; // make a pointer to an unsigned short

    ```


    When the pointer is dereferenced, the indirection operator indicates that the
    value at the memory location stored in the pointer is accessed, rather than the
    address itself:

    *pAge = 5; // assign 5 to the value at pAge


    Also note this same character (*) is used as the multiplication operator. The
    compiler knows which operator to call based on context.'
