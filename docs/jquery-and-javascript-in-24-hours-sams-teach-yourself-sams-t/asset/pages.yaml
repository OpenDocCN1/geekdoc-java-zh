    the user.


    # Initial Class Design


    This analysis of the messages leads you to design the Message class. In anticipation
    of extending the program to non-email messages, you derive EmailMessage from the
    abstract base message. From EmailMessage you derive PostMessage, InterchangeMessage,
    OutlookMessage, GmailMessage, and so on.


    Messages are a natural choice for objects in a program handling messages, but
    finding all the right objects in a complex system is the greatest challenge of
    object-oriented programming. In some cases, as with messages, the primary objects
    seem to fail out of your understanding of the problem. More often, you have to
    think long and hard about what you are trying to accomplish the right objects.


    Don''t despair. Most designs are not the first time. A good starting point is
    to describe the problem out loud. Make a list of all the nouns and verbs you use
    when describing the project. The nouns are good candidates for objects. The verbs
    might be the functions of objects (or they might be objects in their own right).
    This is not a foolproof technique, but it is a good technique to use when starting
    on your design.


    Now the question arises, "Should the message header be a separate class from the
    body?" If so, do you need parallel hierarchies—ForumBody and ForumHeader as well
    as EmailBody and EmailHeader?


    Parallel hierarchies often are a warning of bad design. It is a common error in
    object-oriented design to have a set of objects in one hierarchy and matching
    set of manager objects in another. The burden of keeping these hierarchies up-to-date
    and in sync with some other becomes overwhelming: a classic maintenance nightmare.


    There are no hard-and-fast rules to designing a class hierarchy, of course, and
    at times parallel hierarchies are the most efficient way to solve a particular
    problem. Nonetheless, if you see your design moving in this direction, you should
    rethink the problem because a more elegant solution might be available.'
