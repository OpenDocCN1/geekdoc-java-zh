  md: '# Q&A


    Q. How do you choose between if-else and switch?


    +   A. If there''s more than one or two else clauses and all are testing the same
    value, consider using a switch statement. If you need to compare relationships
    (a > b for instance), you cannot use the switch statement. Otherwise, you can
    choose any conditional. There''s no wrong answer as long as your program works.


    Q. How do you choose between while and do-while?


    +   A. If the body of the loop always should execute at least once, a do-while
    loop; otherwise, use the while loop.


    Q. How do you choose between while and fox?


    +   A. If you are executing a statement (or block of statements) a fixed number
    of times based on the value of a variable that is being incremented, the for loop.
    If your variable is already initialized or not incremented on each loop, a while
    loop might be the better choice.


    Q. Why is an airplane''s black box orange?


    The boxes are normally placed at the most likely place to survive a crash: the
    rear of the plane near the juncture of the fuselage and the upper tail fin. They
    are designed to endure a temperature of 1,100 degrees Celsius for 30 minutes and
    an impact force 3,500 times as strong as gravity. There''s actually two boxes—a
    flight data recorder and cockpit voice recorder.


    The inventor of the device, Australian aeronautical engineer David Warren, was
    nine years old when his father died in a plane crash in the 1930s.


    Efforts are to make black boxes obsolete by transmitting flight data and pilot
    voice recordings to satellites throughout a flight.


    As to why they''re called black boxes, that appears to be borrowed from an early
    type of flight recorder. Francois Hussenot and Paul Beaudouin devised a revisor
    in France that used photographic film and a thin ray of light in a pitch-black
    box.


    # Workshop


    You learned about some complex program flow this hour, and you should answer a
    few questions and do a couple of exercises to firm up your knowledge of the topic.'
