  md: '# Q&A 59


    Operators are symbols that cause the compiler to take action. Operators can assign
    values, perform mathematical operations such as addition or division, compare
    two values, and handle logical comparisons.


    The conditional statements if and else can cause statements to be executed only
    if a specific condition is true. These conditions often are defined as expressions.


    # Q&A


    +   Q. Because precedence determines which operators are acted on first, why use
    parentheses when you don''t need?


    +   A. Precedence isn''t always clear to a programmer looking at code as it is
    to the C++ compiler. Using parentheses to make a program more understandable to
    the people working on it will pay off in the long run.


    +   Q. What effect do tabs, spaces, and newline characters have on a program?


    +   A. These characters, which are called whitespace, are ignored by the compiler
    and have no effect on the program. Their purpose is to make programs easier for
    humans to understand. Poor indentation can make it difficult to determine which
    statement belongs to an conditional, where a compound statement begins and ends,
    and so on.


    +   Q. Are negative numbers true or false?


    +   A. Every number except for 0, whether positive and negative, is treated as
    true.


    +   Q. Who gets to decide what a newly discovered animal is named?


    +   A. The naming system for new species is guided by the International Code on
    Zoological Nomenclature, a set of rules that determine how the name is structured.


    The person who discovers the animal usually gets to select its name, which is
    submitted for approval to the commission at the National History Museum in London,
    England.


    If you have discovered a new species, visit the commission''s web site at www.iczn.org.


    Most discovers base the name on themselves, but those who have started selling
    the rights to raise money towards conservation efforts. In 2005, the online casino
    GoldenPalace.Com paid $650,000 to a new primate Calliceus aureipalatii. Aureipalatii
    means ''golden palace'' in Latin.


    The German non-profit group Biopat sells naming rights to new species for a €2,600
    Euro donation (currently around $2,870 U.S.). Visit the group''s website at http://biopat.de/en
