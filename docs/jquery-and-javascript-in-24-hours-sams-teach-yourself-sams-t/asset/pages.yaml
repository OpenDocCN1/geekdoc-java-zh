  md: '# Bits, Bytes, and Nybbles


    After the decision to represent truth and falsehood with 1s and 0s, binary digits
    (or bits) become very important. Because early computers could send 8 bits at
    a time, it was natural to start writing using 8-bit numbers (called bytes).


    NOTE

    Half a byte (4 bits) is called a nibble! You may also see this spelled as nibble.


    With 8 binary digits, you can represent up to 256 different values. Why? Examine
    the columns If all 8 bits are set (1), the value is 255. If none is set (all the
    bits are clear or zero), the value is 0. So 0–255 is 256 possible states.


    # What’s a KB?


    It turns out that $2^{10}$ (1,024) is roughly equal to $10^3$ (1,000). This coincidence
    was too good to, so computer scientists started referring to $2^{10}$ as KB or
    1 kilobyte, based on the scientific prefix of kilo for thousand.


    Similarly, $1,024 * 1,024$ (1,048,576) is close enough to one million to receive
    the designation 1MB or 1 megabyte, and 1,024 megabytes is called 1 gigabyte (*giga*
    implies thousand-million).


    # Binary Numbers


    Computers use patterns of 1s and 0s to encode everything they do. Machine instructions
    are encoded as a series of 1s and 0s and interpreted by the fundamental circuitry.
    Arbitrary sets of 1s and 0s can be translated back into numbers by computer scientists,
    but it would be a mistake to think that these have intrinsic meaning.


    For example, the Intel x86 chip interprets the pattern 1001 0101 as an instruction.
    You can certainly translate this into decimal 149, but that has no special meaning.


    Sometimes the numbers are instructions, sometimes they are values, and sometimes
    they are codes. One standard standardized code set is ASCII. In ASCII, every letter
    and punctuation is given a seven-digit binary representation. For example, the
    lowercase letter $a$ is represented by 110 0001. This is not a number, although
    you translate it to the number $97_{10}$ ($64 + 32 + 1$). It is in this sense
    that people say that the letter $a$ is represented by $97_{10}$ in ASCII; but
    the truth is that the binary representation of $97_{10}$–1100001, is the encoding
    of the letter $a$, and the decimal 97 is a human convenience.'
