    # Passing a const Pointer


    Though passing a pointer to FunctionTwo() is more efficient, it is dangerous.
    FunctionTwo() is not supposed to change the SimpleCat object it is, yet it is
    given the address of the object. This exposes the object to impermissible change
    and defeats the protection offered in passing value.


    Passing by value is like giving a museum a photograph of your masterpiece rather
    than the real thing. If vandals mark it, no harm comes to the original. Passing
    by reference is like sending your home address to the museum and inviting guests
    to come over and look at the real thing.


    If you want to protect the security of pass by value and the efficiency of pass
    by reference, the solution is to pass a const pointer to SimpleCat. Doing prevents
    any non-const member function in SimpleCat, and protects the object from change.
    The ConstPasser program in Listing 13.2 demonstrates this.


