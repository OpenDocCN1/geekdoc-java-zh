  md: '# Summary


    A client of Rectangle could create a Rectangle object and get its area without
    looking at the implementation of getArea().


    By looking at the header file in Listing 9.3, which contains the declaration of
    the Rectangle class, a programmer knows that getArea() returns an int. How getArea()
    accomplishes this is not a concern to users of class Rectangle. In fact, the author
    of Rectangle could change the function without affecting programs that use the
    Rectangle class.


    A C++ programmer doesn''t have to use classes or objects at all. Programs could
    consist simply of variables and functions, removing the need to master the complex
    concepts of object-oriented programming.


    Few programmers go through this. Why? Because you can be much more effective if
    you design a program as a series of classes that interact with each other.


    Developing classes makes code more reusable. If an object''s useful in one program
    would be useful in another, the class can be reused. Word processor''s Spellchecker
    class could be added to a web browser or any other tool where users write text.
    The spell-checking object''s capabilities would work the same in any program.


    Classes also make code more reliable. The tasks a program requires are packaged
    with the data necessary to get that work done. By thinking of a program as a set
    of objects that each has specific tasks to perform, the work is spread out and
    organized. When problems crop up, it''s easier to determine the class where the
    error occurs.


    # Q&A


    +   Q. If using a const function to change a class may cause a compiler error,
    why shouldn''t I just leave out the const and be sure to avoid errors?


    +   A. If your logically shouldn''t change the class, using the keyword const
    is a good way to enlist the class in helping you find silly mistakes. For example,
    consider what happens if the getSpeed() function has this line

    if (speed = 100) cout << "Maximum speed reached\n";


    This code contains an error that the compiler will catch if the getSpeed() function
    is declared const. The statement, which is supposed to check whether speed equals
    100, accidentally assigns the value 100 to the member variable. (The assignment
    operator = is used by mistake instead of the equality ==.) Because this assignment
    changes the class in a constant function, the compiler will find the error.


    This kind of mistake can be found simply by scanning the code—the eye sees only
    what it expects. More importantly, the program might appear to run correctly,
    but speed has now been set to a bogus number.'
