    highScore = 13000;

    ```


    A variable can be assigned an initial value when it is created:


    ```

    unsigned int highScore = 13000;

    ```


    This is called initializing the variable. Initialization looks like assignment,
    but when you work with constants, you''ll see that some variables must be initialized
    because they cannot be assigned a value.


    The Rectangle program in Listing 3.2 uses variables and assignments to compute
    the area of a rectangle and display the result.'
