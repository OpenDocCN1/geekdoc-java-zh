  md: "# switch Statements\n\nWhen you use a series of if or if-else conditionals\
    \ on the same variable, your C++ code can become excessively confusing and cumbersome.\
    \ An alternative is to use switch, a conditional that tests one expression for\
    \ multiple values to decide which of blocks of code to execute.\n\nA switch statement\
    \ consists of the keyword switch followed by an expression to test one or more\
    \ cases with possible values of expression, and possibly a default section when\
    \ no case matches.\n\nThe following switch statement displays a singular or plural\
    \ ending to the word \"zombie\", depending on how many zombies you have killed:\n\
    \n```\nstd::cout << \"You killed \" << zombies << \" zombie\";\nswitch (zombies)\
    \ {\n    case 0:\n        std::cout << \"\\snn\";\n        break;\n    case 1:\n\
    \        std::cout << \"\\snn\";\n        break;\n    default:\n        std::cout\
    \ << \"\\snn\";\n}\n```\n\nThe switch expression is the variable zombies. The\
    \ two case sections catch different values of zombies. If the value is 0, the\
    \ character 's' makes the display text \"You have killed 0 zombies\" with the\
    \ trailing s. If the value is 1, the text is \"You have killed 1 zombie\" with\
    \ no trailing s.\n\nThe default section handles all other values for zombies,\
    \ displaying \"You have killed\" by the number and the word zombies.\n\nThe evaluation\
    \ in the case sections of a switch statement can only be for equality. There's\
    \ no way to test relational operators or Boolean operations. If one of the case\
    \ values matches the expression, jumps to those statements and continues to the\
    \ end of the switch block unless a break statement is encountered. If nothing\
    \ matches, execution branches to the optional default statement. If there is no\
    \ default and no matching value, execution falls through the switch statement,\
    \ and the statement ends.\n\n# TIP\n\nIt's good programming practice to have a\
    \ default case in switch statements even when you don have a reason to employ\
    \ one. The default can be used to display an error when a value varies your expectations\
    \ and doesn't match any of the case sections."
