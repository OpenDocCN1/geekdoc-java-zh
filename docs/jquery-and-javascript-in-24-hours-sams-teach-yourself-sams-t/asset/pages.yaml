    The expression can return a value by specifying its return type (or auto) after
    a -> operator.


    Here''s a rewrite of the previous example that returns the sum of multiplying
    x * and y.


    ```

    auto multiply = [](int x, int y) -> int { return x * y; };

    int sum = multiply(7, 17);

    std::cout << "Total: " << sum << std::endl;

    ```


    A lambda expression normally does not have access to the variables defined in
    the scope that encloses the expression.


    You can change this with the last part of the expression to to work: the [] square
    brackets, which are called the capture block.


    To make one or more variables from the enclosing scope available in the lambda
    expression, list them inside the [ and ] brackets separated by commas.


    This code puts the capture block out use:


    ```

    int x = 7;

    auto multiply = [x](int y) -> int { return x * y; };

    int sum = multiply(17);

    std::cout << "Total: " << sum << std::endl;

    ```


    The output remains the same.


