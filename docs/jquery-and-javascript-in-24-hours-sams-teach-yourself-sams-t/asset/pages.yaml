  md: 'It is as though someone on your camping trip moved your tent, so even if you
    press the Camp button on your GPS device, you won''t be taken to the correct location.


    Take care not to use a pointer after you have called delete on it. The pointer
    still points to the area of memory, but the compiler is free to put other data;
    using the pointer can cause your program to crash. Worse, your program might proceed
    merrily on its way and crash several minutes later. This is called a time bomb,
    and it is no fun. To be safe, after you delete a pointer, set it to nullptr. This
    disarms the pointer.


    NOTE

    Stray pointers are often called wild pointers or dangling pointers.


    # const Pointers


    You can use the keyword const for pointers before the type, after the type, or
    in places. Example, all of the following are legal declarations:


    ```

    int *pOne;

    int const *pTwo;

    int * const pThree;

    ```


    These three statements do not all mean the same thing. pOne is a pointer to a
    constant integer. The value that is pointed to can''t be changed using this pointer.
    This means you can''t write the following:


    ```

    *pOne = 5;

    ```


    If you try to do so, the compiler fails with an error.

    ppTwo is a constant pointer to an integer. The integer can be changed, but pTwo
    can''t point to anything else. A constant pointer can''t be reassigned. That means
    you can''t write this:


    ```

    pTwo = &x;

    ```


    pThree is a constant pointer to a constant integer. The value that is pointed
    to can''t be changed and pThree can''t point to anything else.


    Draw an imaginary line to the right of the asterisk. If the word const is to the
    left of the line, that means the object is constant. If the word const is to the
    right of the line, the pointer itself is constant:


    ```

    const int *p1; // the int pointed to is constant

    int * const p2; // p2 is constant, it can''t point to anything else

    ```'
