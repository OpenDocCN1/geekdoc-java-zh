    # Overloading Versus Overriding


    The terms overloading and overriding sound similar and do similar things in C++.
    When you overload a member function, you create more than one function with the
    same name but with different signatures. When you override a member function,
    you create a function in a derived class with same name as a function in the base
    class and with the same signature.


    # Hiding the Base Class Member Function


    In the Mammal program you created, the Dog class''s member function speak() hides
    the base class''s function. This is what you wanted, but it can have unexpected
    results. If Mammal has a move() member function that is overloaded, and Dog overrides
    that function, the Dog function hides all the Mammal functions with that name.


    If Mammal overloads move() as three functions—one that takes no parameters, one
    that takes an integer, and one that takes an integer and a direction—Dog overrides
    just the move() function which not be easy to access the other two functions using
