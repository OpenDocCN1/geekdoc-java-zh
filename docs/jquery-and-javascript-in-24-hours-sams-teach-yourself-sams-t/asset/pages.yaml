  md: 'The primary reason to learn the terms l-value and r-value is because they may
    appear in compiler error messages.


    # Mathematical Operators


    There are five mathematical operators: addition (+), subtraction (-), multiplication
    (*), division (/), and modulus (%). C+, like C, does not have an exponentiation
    operator to raise a value to a specified power. There is a function to perform
    the task.


    Addition, subtraction, and multiplication act as you''d expect, but division is
    more complex.


    Integer division differs from ordinary division. When you divide by 24, the result
    is a real number that has a fraction or decimal value. By contrast, integer division
    produces only integers, so the remainder is dropped. The value returned by 21
    / 4 is 5.


    The modulus operator % returns the remainder of integer division, 21 % 4 equals
    1. The integer division 21 / 4 is 5, leaving a remainder of 1.


    > NOTE

    When describing an expression using the modulus operator, it is called modulo,
    so 21 % 4 is "21 modulo 4." Modulo is the operation performed by the modulus operator
    and the result is called the modulus.


    Finding the modulus can be useful in programming. If you want to display a statement
    every tenth time that a task is performed, the expression taskCount % 10 can watch
    for this. The modulus ranges from 0 to 10. Every time it equals 0, the count of
    tasks is a multiple of 10.


    Floating-point division is comparable to ordinary division. The expression 21
    / 4.0 equals 5.25.

    C++ decides which division to perform based on the type of the operands. If at
    least one operand a floating-point variable or literal, the division is floating-point.
    Otherwise, it is integer division.


    # Combining Operators


    It is not uncommon to add a value to a variable and then assign the result back
    to the variable. The following expression adds 10 to the value of a variable named
    score:


    ```

    score = score + 10;

    ```


    This expression takes the existing value of score, adds 10 to it, and stores the
    result in score.


    This can be written more simply using the += self-assigned addition operator:


    ```

    score += 10;

    ```'
