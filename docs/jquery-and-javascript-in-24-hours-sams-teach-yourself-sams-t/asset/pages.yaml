  md: '# Operator Overloading


    Operator overloading is one of the aspects of C++ most used and abused by new
    programmers.

    It is tempting to create new and interesting uses for some of the more obscure
    operators, but these\often lead to code that is confusing and difficult to read.


    # CAUTION


    Doing counterintuitive things like making the + operator subtract and the + operator
    add is amusing

    t first time you try it, but no one would do that in their code.


    The real danger lies in the well-intentioned idiosyncratic use of an operator,
    such as using + to

    catenate a series of letters / to split a string. There is good reason to consider
    these uses,

    but better reason to proceed with caution. The goal of overloading operators is
    to increase usability

    understanding.


    # operator==


    The C++ compiler provides each class with a default constructor, destructor, and
    copy constructor.

    A fourth member function supplied by the compiler, when one has not been specified
    in the class,

    defines the assignment operator.


    The assignment operator''s overloaded function takes the form operator() and is
    called when

    you assign a value to an object, in this code:


    ```

    Tricycle wichita:

    wichita.setSpeed(4);

    Tricycle dallas,

    dallas.setSpeed(13);

    dallas = wichita:

    ```


    The Tricycle object named wichita is created and its member variable speed given
    the

    value 4, followed by the Tricycle dallas with the value 13. The final statement
    uses the

    assignment operator =.


    Because of this assignment, dallas''s speed variable is assigned the value of
    that variable from

    wichita. After this statement executes, dallas.speed will have the value 4 rather
    than 13.


    In this case, the copy constructor is not called because dallas already exists,
    there''s no need

    to construct it. The compiler calls the assignment operator indent.


    Hour 14, "Calling Advanced Functions," described the difference between a shallow
    (member-

    wise and deep copy. A shallow copy copies the members, making both objects point

    to the same area on the heap. A deep copy allocates the necessary memory.


    The same issue comes up here, with an added wrinkle. Because dallas already exists

    h has memory allocated, that memory must be deleted to prevent a memory leak.'
