  md: '# Problems with Single Inheritance 269


    The problem is not that you have such specific functions; it is that you are trying
    to get at them with the base class pointer. In an ideal world, when you have such
    a pointer you would not try to get at those functions.


    But is not an ideal world, and at times you find yourself with a collection of
    base objects—for example, a zoo full of mammals. At one point or another you might
    realize you have a Cat object and you want the damn to purr. In this case, there
    might be only one thing to do: cheat.


    To cheat, cast your base pointer to your derived type. You say to the compiler,
    "I know this is really a cat, so go and do what I tell you."


    To make this work, you''ll use the dynamic_cast operator. This operator ensures
    that when you cast, you can cast safely.


    Here''s how it works: If you have a pointer to a base class, as Mammal, and you
    assign to it a pointer to a derived class, as Cat, you can use the Mammal pointer
    polymorphically to access virtual functions. Then, if you need to get at the Cat
    object to call the purr() member function, you create a Cat pointer using the
    dynamic_cast operator to do so. At runtime, your new Cat pointer is fine. If the
    conversion is improper—you didn''t really have a Cat object after—your new pointer
    will be null. The Mammal13 program in Listing 18.2 illustrates this.


