  md: '# HOUR 4: Using Expressions, Statements, and Operators


    The compiler ignores whitespace (or the lack of it). Whitespace cannot be used
    inside a variable name, the variable playerScore could not be referred to as a
    player Score.


    The tabs or spaces that serve the purpose of indentation in programs are whitespace.
    Proper indentation makes it easier to see when a program block or function begins
    and ends.


    # Compound Statements


    Several statements can be grouped together as a compound statement, which begins
    with an opening brace and ends with a closing brace }. A compound statement can
    appear anywhere a single statement could.


    Although every statement in a compound statement must end with a semicolon, the
    compound statement itself does not end with a semicolon. Here''s an example:


    ```

    {

    temp = a;

    a = b;

    b = temp;

    }

    ```


    This compound statement swaps the values in the variables a and b using a variable
    temp as a temporary holding place for one value.


    # Expressions


    An expression is any part of a statement that returns a value, as in this simple
    example:

    x = y + 13;


    This statement makes the variable x equal to the value of y plus 13. So, if y
    equals 20, x equals 33. The entire statement returns the final value of x, so
    it''s also an expression. To understand this, consider a more complex statement:

    z = x = y + 13;


    This statement consists of three expressions:


    +   * The result of the expression y + 13 is stored in the variable x.

    * The expression x = y + 13 returns the value of x, which is stored in the variable
    z.

    * The expression z = x = y + 13 returns the value of z, which is not stored.


    The assignment operator = causes the operand on the left side of the operator
    to have its value changed to the value on the right side of the operator.'
