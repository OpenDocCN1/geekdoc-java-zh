  md: '# HOUR 9

    Moving into Advanced Classes


    What You''ll Learn in This Hour:


    +   - What constant member functions are

    - How to separate the class interface from its implementation

    - How to manage your classes

    - How to find and avoid bugs


    # const Member Functions


    If you declare a member function to be constant with the const keyword, it indicates
    that the function won''t change the value of any members of the class. To declare
    a function as constant, use the keyword const after the parentheses, as in this
    example:


    ```

    void displayPage() const;

    ```


    Accessors to retrieve a variable''s value, which are also called getter functions,
    often are constant functions. The Tricycle class from the preceding had had two
    accessors:

    void setSpeed(int newSpeed);

    int getSpeed();


    The setSpeed() function cannot be const because it changes the member variable
    speed. The getSpeed() function, on the other, can be const because it doesn''t
    change the class at all. It simply returns the current value of the member variable
    speed. Therefore, the declaration of that function can be:


    ```

    int getSpeed() const;

    ```


    If you declare a function to be const and the implementation of that function
    changes the object by changing the value of any of its members, the compiler will
    flag it as an error.


    It is good programming practice to declare as many functions to be const as possible.
    When you do, this enables the compiler to catch unintended changes to member variables,
    instead of letting these errors show up when your program is running.'
