  md: 'Operator Overloading 215


    # Writing an Increment Method


    Operator overloading provides functionality that would otherwise be missing in
    user-defined classes such as Counter. When you implement an operator for a class,
    you are said to be overloading that operator.


    The most common way to overload an operator in a class is to use a member function.
    The function declaration takes this form:


    ```

    returnType operatorsymbol(parameter list)

    {

    // body of overloaded member function

    }

    ```


    The name of the function is operator followed by the operator being defined, such
    as + or++. The returnType is the function''s return type and the parameter list
    holds zero, one, or two parameters (depending on the operator).


    The Counter2 program in Listing 15.2 illustrates how to overload the increment
    operator ++.


    # LISTING 15.2 The Full Text of Counter2.cpp


    ```

    1: #include <iostream>

    2:

    3: class Counter

    4: {

    5: public:

    6:     Counter();

    7:     -Counter();

    8:     int getValue() const { return value; }

    9:     void setValue(int x) { value = x; }

    10:    void increment() { ++value; }

    11:    const Counter& operator++();

    12:

    13: private:

    14:     int value;

    15: };

    16:

    17: Counter::Counter():

    18:     value(0)

    19: {}

    20:

    21: const Counter& Counter::operator++())

    22: {

    23:     ++value;

    24:     return *this;

    25: }

    ```'
