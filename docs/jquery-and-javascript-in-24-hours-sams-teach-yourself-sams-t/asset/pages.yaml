  md: '# Friend Classes and Functions


    Declarations of friend classes should be used with extreme caution. If two classes
    are inextricably entwined, and one must frequently access data in the other, there
    might be good reason to use this declaration. It is often as easy as to use public
    accessors instead. Doing so allows you to change one class without having to recompile
    the other.


    At times, you may want to grant the friend level of access not to an entire class,
    but only to one or two functions of that class. You can do this by declaring the
    member functions of the other class to be friends, instead of declaring the entire
    class to be a friend. In fact, you can declare any function, whether or not it
    is a member function of another class, to be a friend.


    # Pointers to Functions


    Just as an array name is a constant pointer to the first element of the array,
    a function name is a constant pointer to the function. It is possible to declare
    a pointer variable that points to a function and invoke the function using that
    pointer. This can prove very useful; it allows you to create programs that decide
    which functions invoke based on user input.


    The only tricky part function pointers is understanding the type of the object
    being pointed to. A pointer to int to an integer variable, and a pointer to a
    function must point to a function of the appropriate return type and signature.


    Consider this declaration:


    ```

    long (*funcPtr)(int);

    ```


    The funcPtr variable is declared to be a pointer that points to a function which
    takes an integer parameter and returns a long. The parentheses around *funcPtr
    are necessary because the parentheses around int have higher precedence than the
    indirection operator (*). Without the first parenthesis, this would declare a
    function that takes an integer and returns a pointer to a long.


    Examine these two declarations:


    ```

    long func(int);

    long (*funcPtr)(int);

    ```


    The first, func(), is a function taking an integer and returning a pointer to
    a variable of type long. The second, funcPtr, is a pointer to a function taking
    an integer and returning a variable of type long.


    The declaration of a function pointer always includes the return type and parentheses
    indicating the type of the parameters, if any. The FunctionPointer program in
    Listing 20.5 illustrates the declaration and use of function pointers.'
