  md: 'The self-assigned addition operator += adds the r-value to the l-value, and
    then assigns the result to the l-value. There are self-assigned subtraction (--),
    division (/=), multiplication (*), and modulus (=) operators, as well.


    These self-assigned operators do the same thing as longer expressions, so either
    form can be used at your discretion.


    # # Increment and Decrement Operators


    The most common value to add or subtract from a variable is 1. Increasing a variable
    by 1 is called incrementing, and decreasing it by 1 is called decrementing. C++
    includes a ++ increment operator and -- decrement operator to accomplish these
    tasks:


    ```

    score++;

    zombies--;

    ```


    These statements increase score by 1 and decrease zombies by 1, respectively.
    They are equivalent to these more verbose statements:


    ```

    score = score + 1;

    zombies = zombies - 1;

    ```


    The ++ operator is said aloud as "plus-plus" and -- as "minus-minus."


    # # Prefix and Postfix Operators


    The increment operator ++ and decrement operator -- can be used before or after
    a variable''s name to achieve different results. An operator placed before a variable''s
    name is called a prefix operator, as in this statement:


    ```

    ++count;

    ```


    An operator placed after the variable name is called the postfix operator:


    ```

    count++;

    ```


    In simple statements like the preceding examples, the operators accomplish the
    same thing. The count variable is increased by 1 in both statements.'
