  md: '# HOUR 4: Using Expressions, Statements, and Operators


    The reason for the existence of prefix and postfix operators becomes apparent
    in complex expressions where a variable is being incremented or decremented and
    assigned to another variable. The prefix operator occurs before the variable''s
    value is used in the expression. The postfix is evaluated after.


    This will make more sense with a concrete example:


    ```

