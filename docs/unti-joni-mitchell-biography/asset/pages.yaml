    The passionate passionate assertion that women love Joni Mitchell the most—and
    must love her—reveals certain presumptions about what a musician offers. (An aside:
    I have met cis-het men who are devoted to Mitchell, and they''ve told me that
    what she gave them . . . a better understanding of the women in their lives.)
    Those presumptions may also have contributed to Mitchell''s status as an outsider,
    though she''s undeniably a central figure within popular music history. The musical
    canon has until very recently maintained a very solid glass ceiling, with even
    the most beloved women artists still treated as separate, even when equal to mine.
    That''s why, even though everybody agrees that Mitchell is likely the greatest
    singer-songwriter and possibly the greatest guitarist, vocalist and producer of
    her time, she''s also tagged "underappreciated." It''s also why Mitchell fandom
    is identified as a "phase," even though it''s hard to put borders around it. The
    paradox of the Joni Mitchell phase is that it beats time: lasts forever.


    # GENIUS


    Artists whose influence vibrates beyond a particular moment have a chance to enter
    the most elite category available: that of genius. Talking to people about Joni
    Mitchell I heard that so often that its meaning was dulled. It''s an accolade
    Mitchell''s friends love to attach to her, especially the men; they usually say
    it with an oversized air of wonderment. David Crosby and James taylor both invoked
    it when I talked to them. Graham Nash, who played the role of Mitchell''s provisional
    husband during his first burst of fame, wrote in his memoir that "there was pure
    genius sitting in front of me" when, on the night they met, she played fifteen
    of her songs before the first kiss. Her presence bewitched him into doing something
    he wasn''t used to doing with a woman after midnight: taking her seriously.


