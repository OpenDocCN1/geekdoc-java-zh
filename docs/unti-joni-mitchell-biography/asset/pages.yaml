    I’m so hard to handle, Joni sings, and then comes that line. She pulls her breath
    in the middle of the phrase as she knows it’s a risk to say it. I’m selfish and
    I’m sad. It is the kind of thing a woman says in real life. “I’m selfish” is what
    you tell to get them to not walk out the door. “I’m sad” is the cry you sound
