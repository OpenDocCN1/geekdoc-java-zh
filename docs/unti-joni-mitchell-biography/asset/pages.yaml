    # A Moving Conclusion


    As Brandi grew closer to Joni, and Joni began stepping back into the world, I
    found myself moving in a different direction. Not opposite, exactly; witnessing
    the doyenne get her flowers was, as always, pleasurable, and the fan in me—yes,
    that fan who''d shyly begun showing herself to me as immersion quickened—loved
    that Joni was getting well through music, in music, held in recovery by those
    who loved her as both an artist and a person.


    But my inner fan''s sister, the skeptic, still staged her arguments. I knew what
    I valued most about Joni''s music and her life story—its therness, the way it
    always took unexpected turns, its perfectly contained audacity. The Joni who tentatively
    began to find and use her voice again faced limitations that would have sunk a
    weaker soul, and the very effort moved me. There was no way that the woman I''d
    flown close to the clouds that she could see them from all angles would return.
    The aneurysm, escalating the inevitable decline of aging, had her. Delighted as
    she seemed glowing, radiant, every breathless media report used those words—she
    remained subdued during her triumphant appearances. She was grounded, a term that
    can describe someone at peace, but also, a creature unable to soar.


    It''s never easy to watch the heroes of our youth grow out. Not only does their
    aging put the ultimate loss that is mortality clearly in sight; the process itself
    is a series of little murders. The ideals embodied by the young and those in the
    prime of life—quickness and nerve, the magnificent aplomb'
