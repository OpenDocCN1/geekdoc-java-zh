  md: 'Approaching forty, Mitchell realized that the pop-star privilege she’d enjoyed
    and sometimes mocked was now slipping out of her hands. Record sales were down;
    critics had started to question her acumen. Meanwhile, at the mirror, she eyed
    the nearly imperceptible sag in her jawline. The untouchable beauty with the grabbing
    hand now realized that men certainly still glanced her way, the urge—and maybe
    the ability—to conquer them was fading. She needed a palate cleanser, something
    that would redirect her energies and carry her into a new period.


    It was time for a new relationship, not only with a man, but with herself. So
    she decided to try something she never had had before: officially sanctioned domesticity.
    She settled down with one last prize, and what a guy—not only very cute and still
    in the bloom of young adulthood, but a musician who actually admitted he had to
    learn from her. Larry Klein, her one and only genuine husband, put that starter
    marriage and all those cases of serial monogamy into a wholly new context. In
    1982, when they met in the recording studio (of course), until their divorce in
    1994, Klein was her partner in morning yoga, cate and Malibu house refurbishing.
    But mostly, in music. Here was another reason ‘80s Joni became the one I began
    to like the best—she was no longer an everlasting solitary “I” but the peaceful,
    happy half of a productive “we.”


    When I wrote the paragraph above, I was idealizing. I knew it. The marriage, surviving
    after divorce as friendship and ever fruitful collaboration, had its ups and downs
    like any other. Larry had to deal with being shadowed by the celebrated ‘Joni
    Mitchell’ while he was still figuring out how to love the woman behind that name,
    and to be his own whole self in the meantime. Joni suffered in those years, too,
    from the emblematic survivable disasters of midlife—body aches, money pans—compounded
    by post-poli syndrome and the creeping feeling that her cultural authority was
    slipping. Middling reviews and the fading support of her music-biz champions hit
    her hard. Not that she needed the money, but no longer was she the queen who could
    always tell the record label guys exactly what to do. She was now a rich woman
    who, like many her age, felt precarity creeping everywhere.


    Still, there was the sunshine of that marriage. The soul connection. The warmth
    and heat of it. And the creative spark that sent her leaping into new musical
    terrain, learning a different way to work in the studio and taking on subjects
    she’d only dabbled before.'
