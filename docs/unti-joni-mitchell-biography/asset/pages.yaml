  md: '# 10


    # Emissaries


    As she made her way into genuine elder territory, Mitchell looked for new friends
    to support and inspire her. It took a particular kind of person to get her right,
    whether they were collaborating with her, interpreting her music or supporting
    her through difficult times. As I made my way to the end of my road with Joni,
    I wanted to talk to these people. They offered me a way into the mysteries of
    this iconic figure who always insisted on being just a woman, but not just any
    woman—into the flux she represents, between ordinary life and extraordinary insight,
    human imperfection and artistic transcendence.


    I focused on three who became Joni’s allies as she girded her legacy and continued
    to expand it. Their stories illustrate how different ways of encountering a legend—partnering,
    inhabiting, apprenticing—can clear away the weeds of renown and make room for
    new growth. They were the final stop on my own expedition. I wanted to hand over
    my maps to them and learn what they learned as they stood next to Joni, making
    footprints on her road.


