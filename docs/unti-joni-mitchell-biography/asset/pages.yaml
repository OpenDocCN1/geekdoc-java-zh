    pieces recently began to appear calling the Joni of the 1980s a "fearless, futurist
    auteur."


    Yet there is no groundwork around this Joni era, no echoing myths. Her 1980s albums
    are her problem children, loved but disappointing. "I seem to be out of sync with
    the times in this decade," she said Kristine McKenna of the L.A. Times in 1988.
    "I''ve come to accept that I must write what I feel when it and only do what is
    given."


