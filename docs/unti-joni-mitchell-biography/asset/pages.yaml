    in the L.A. Express. That''s how Carlton met Mitchell. By that time he''d begun
    to develop his own sound, and that''s what he brought to Court and Spark sessions.


    "In the beginning, I didn''t have an identifiable sound," he said. "Every session
    I went was just the guitar player. But after the Crusaders'' first record was
