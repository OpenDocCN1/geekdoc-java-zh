  md: '# # A Note on Naming


    Joni Mitchell wanted to rethink the way music moved from her mouth to others’
    ears, to fill songs, even anthems, with the breath of the personal. Her art marks
    her as both a kind of seer and a friend. These roles require different titles.
    Throughout her life, she would be “Joni Mitchell” in public, “Joan” to close friends
    and “Joni” when the textual or musical encounter was public but felt more private—sometimes
    in interviews, very occasionally in hip-sounding ad copy, but most of all to her
    fans, in those moments when they spoke their life for her.


    I feel comfortable calling Mitchell “Joni” as I consider both the revered figure
    she has become and the character she has crafted for herself in her music. But
    what of the artist who deserves critical attention? To call her “Joni” can, at
    times, feel somewhat trivializing. People often address creative work by their
    first names to make them approachable, cute, like your sister or your mom. Until
    Joni, no one called Shakespeare “Willy the Shake.” (Well, except Lord Buckley,
    the jazz comic from whom she borrowed the term for “Talk To Me.”) Yet when I put
    “Joni” aside and write “Mitchell,” that can feel diminishing, too. Without “Joni,”
    it’s almost generic. It’s a stage name, the divorced 1960s wife’s name. It lacks
    her essence.


    I decided the truest thing to do when it came to my slippery subject was to use
    “Joni” or “Mitchell” interchangeably, as the occasion demanded. This'
  merge: -1
  pgno: 5
- img_proc: true
  md: 'allowed for me to signal how I was thinking and feeling at different points,
    and also to make an argument Joni’s own music makes. That the personal can be
    timeless. That the intimate speaks to the world.


    Throughout these pages I call her by both or either name, following my intuition.
    Some aspects of her story feel more internal; others take place on bigger stages.
    I want to think about “Joni” and “Mitchell” in fruitful dialogue, the self-invented
    woman engaging with a masculinized inheritance. Women still wonder all the time
    if they should change their names. Sometimes the solution is to claim two.'
  merge: -1
