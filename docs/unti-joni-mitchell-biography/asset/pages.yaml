  md: '# # Introduction


    # ## Drawing the Maps


    I write so many times in my head, it''s tattooed there, like a song. What you
    are about to read is not a standard account of the life and work of Joni Mitchell.
    Instead, it''s a tale of journeying through a life that changed popular music:
    of a homesick wanderer forging ahead on routes of her own invention, and of me
    on her trail, heading toward the ringing of her voice.


    I''m not a biographer, in the usual definition of that term; something in instinctively
    opposes the idea that one person can sort through all the facts of another''s
    life and come up with anything close to stranger''s true story. Instead, I''m
    a critic. A kind of mapmaker, as I see it, setting down lines means to guide others
    along the trajectories of artists who are always one step ahead of me. In Mitchell
    I found an inexhaustible subject, one who never let put down my pen and declare
    my constraints.


    As I tried to keep up, I had to embrace a new way of writing that made room for
    gaps, inconsistencies and contradictions, honoring those unstable elements as
    a story well told. *I am on a lonely road, and I am traveling, traveling, traveling,
    traveling,* Mitchell sings in “All I Want, the opening track on her most revered
    album, Blue. I love that lyric because the word repeats at its end. Every “traveling”
    is different—determined, anxious, liberated, driven—as Joni extends her breath
    and clips it, finding a rhythm and immediately pushing away its constraints. So
    much ground covered in so little time. The line perfectly describes my experience
    writing this book. As I immersed myself in the landscapes and soundscapes where'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'Mitchell landed and made her music, I had to keep upprooting myself, rejecting
    any settled stances about who this woman is and why her music is special. I needed
    to keep moving because that what''s she''s always done.


    What happens to legends like Mitchell, not people but as subjects of the world''s
    impassioned interest, is that they get stuck within the edifice of fame, they
    become monuments themselves—solid structures built from the aspects of themselves
    that others love. Joni Mitchell the misunderstood musical genius, the emblematic
    free woman, the sad girl''s boy''s best imaginary friend, has solidified into
    a series of qualities and traits rather remaining a dynamic force running on both
    magic and flaws. She is: open tunings, conf songwriting, jazz-rock. She is: gamine
    old clone, a childless mother, a true blue lover leaving before the sun comes
    up. She is always in her category, so relatable, ultimately unknowable. In truth
    she''s all of these things, but reducing her to any of them turns into stone.


    Mitchell''s music changes and challenges society''s assumptions about what a woman
    and artist can be. Any singular view of her artistry, and her influence, diminishes
    it. I''m taking Mitchell''s lead on: “I feel sometimes like I''m a multiphenic
    person,” she once said, apparently inventing a term psychologists would later
    use to describe the condition of having “many selves and self-representations
    conflict.” Mitchell put it more plainly: “Will the real me stand up, you know.”


    My goal has been to follow Joni Mitchell as she''s drifted and flown and to chart
    the rhythms of her inquiries. When asked to define herself, she rarely calls herself
    a musician first, saying that since she was a child she''s a dancer. And a painter.
    Shimmying with the boys and the bad girls in the Saskatoon dive, wrecking her
    stockings. Reaching her overhead to make brushstrokes on a canvas, opening up
    unimaginined vistas with a smear of paint. A portrait hardens and becomes lifeless
    when it loses track of the breath, the living presence of her subject—a constantly
    shifting thing, blurry then focused dissolving then clear, then different, the
    light has changed—and strives for something absolute. A mapmaker must be open
    to new routes. People are not definitive; neither is one story. That is the point
    of Mitchell''s songs. Life is stranger and bigger than that. And people, even
    geniuses, are smaller: human, always incomplete. Every legend is also one of us.'
