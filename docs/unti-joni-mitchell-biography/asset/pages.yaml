  md: '# # About the Author


    **ANN POWERS** is widely acknowledged as one of the most influential music writers
    working today. Her books include *Good Booty: Love and Sex, Black and White, Body
    and Soul in American Music; Weird Like Us: My Bohemian America*; and, with the
    artist, the *New York Times* bestseller *Tori Amos: Piece by Piece*. With Evelyn
    McDonnell, she also co-eded the groundbreaking anthology *Rock She Wrote: Women
    Write About Pop, Rock, and Rap*. She has been a pop critic at the *New York Times*,
    the *Los Angeles Times*, and since 2011 she has been the critic and correspondent
    at NPR Music, the Village Voice and a curator at Seattle''s Museum of Popular
    Culture. Her articles have been widely anthologized in publications including
    *The Faber Book of Pop*, the *Library of America''s Shake It Up: Great Pop Writing*
    from Elvis to Jay Z, *The World of Bob Dylan, Women Who Rock*, and six consecutive
    years of the *Da Capo Best Music Writing* series. She won the ASCAP-Deems Taylor
    Award for excellence in music writing in 2010. In 2017 Powers cofounded NPR’s
    *Turning the Tables*, an ongoing project to recenter the popular music canon to
    be more inclusive of marginalized, underestimated and forgotten voices. The first
    season of the series won a Gracie Award from the Alliance for Women in Media.
    She lives in Nashville.


    Discover great authors, exclusive offers, and more at hc.com.'
