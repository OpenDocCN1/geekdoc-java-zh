    # THE CRIPPL


    To say that young Roberta Joan did not endure hardship would be a great oversight.
    She fell into the path of a viral disaster that struck in waves throughout the
    twentieth century, which mention terrified the parents of wandering summer children:
    polio.


    Polio ran through North America for sixty years before the vaccine devised by
    Dr. Jonas Salk got it under control. In Canada, multiple waves sickened approximately
    fifty thousand people, killing four and rendering many more permanently disabled.
    Most were children. One was Mitchell, who contracted the illness around the time
    of her ninth birthday, in 1952.'
