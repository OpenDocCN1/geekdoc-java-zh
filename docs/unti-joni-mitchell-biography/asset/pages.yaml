    Men on the rock scene in 1967 didn’t really have the skills to recognize women
    as more powerful than they were. Certainly not beyond the intimate confines of
    romance—and so many of the era’s most popular songs were just men wanting about
    what women might do to them, how they lost control in their presence but would
    regain control, dammit, don’t love me badly, a squirming dog who’s just had her
    day, please don’t let on that you knew when I was hungry and it was your world.
    These songs ensured that women knew that the rock world had a place for them,
    and they’d better stay in it.


    Joni knew place and could occupy it when necessary. The albums she made in her
    first Canyon years were aggressively feminine in tone, built around her aerial
    soprano and lyrics that leaned fiery even when she was talking about breaking
