    In 1964 Joni had just started her life as an explorer, but already she was dwelling
    on that itch of progress or escape, or both, and not only in the songs she wrote
    about the childhood she was leaving behind. The markers of her life at this point
    kept moving, and her songs captured: “Urge for Going,” “Here Today and Gone Tomorrow.”
    That train across Canada, some time in Calgary and Toronto, the sudden end of
    her affair with MathMath. A quickie marriage took her to Detroit. The end of that
    union and decision to entrust the daughter she bore born in adoption, leaving
    her to wonder for years that child herself had flown. A deeper immersion in her
    music, leading to career-cultivating trips through the Midwest and New England
    and an eventual brief landing in New York. Idylls in London and South Florida.
    All of this happened before Joni Mitchell saw L.A.


    From her years onward, Joni was propelled by a ruling tension between her need
    for grounding and her hankering for another port of call. I imagine her lugging
    a ukulele, and soon after a guitar, aboard the buses and trains of North America,
    or depositing her instrument carefully in the trunks of cars she shared with men
    Eric, David, Patrick, Tom, all itinerant musicians like herself. Driving her own
    vehicle from an army base to a church hall, happy to settle in for a week’s run
    in a downtown strip of folk dives when a booker would give her break. From 1963
    to 1967, for the two years when she was married to Chuck Mitchell and living in
    Detroit, Mitchell was a vagabond. It suited her. It also made for a strong persona
    and great songs.


    Unlike some of her peers, she took increasingly bigger step delicately, compelled
    to strive for a stable future as much as to live by the road’s rules. Joni Mitchell
    in transition didn’t simply fancy herself free spirit; she sought to inhabit archetype,
    though it contradicted her nature and the lessons of her upbringing, and in one
    central moment, her ability to care for another soul absent presence would stay
    with her from the moment she placed that baby in another family’s care. Mitchell
    created herself through a determined kind of restlessness, presenting herself
    to her audiences and her friends as a makeshift homemaker who’d decorate her temporary
    lodgings with thrift-'
