  md: 'Over the years, its uses have extended beyond the season. It’s a staple at
    public memorial services and in private mourning sessions, and within Hollywood
    rom-coms like Love, Actually, in which the “cold English wife” played by Emma
    Thompson declares that Mitchell’s music taught her how to feel. The realization
    that you’ve lost something, the admission that you will never get it; these are
    just some of the emotional crises “River” has come to represent. Joni Mitchell
    didn’t necessarily mean to surrender her divulgence of the entire world, but the
    world took it, and now it flows like the water underneath a stream’s gelid surface,
    moving where it is placed.


    At its source, though, “River” was something specific, and when Mitchell released
    it in 1971, its core of cold, formed by the limpid melody and floating rhythm
    built around the hushed word “wish,” prevents full immersion in any one emotion.
    This makes it a quintessential Mitchell: an inquiry, as she also famously described
    her open-tuning chords. For a woman to make such a meticulous investigation of
    her sense of stymied location in the world was daring; Nina Simone did it, as
    had Billie Holiday, but the world had little room for it. “River” resists catharsis,
    even resolution. It takes up the problem of sadness, instead of creating a comfortable
