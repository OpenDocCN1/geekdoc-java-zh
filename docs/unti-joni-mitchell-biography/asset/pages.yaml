  md: 'What is sure is that unlike many of her earlier songs about problematic men,
    the central crisis of “Not to Blame” is not just interpersonal but openly political.
    Mitchell casts scorn on the six hundred thousand doctors who blame women whom
    they see bleeding through their lives instead of apprehending the men they hurt.
    Like the tragic, bruised heroine Isabella Rossellini plains in Lynch’s Blue Velvet,
    the unnamed women in “Not to Blame” are complicated people destroyed by confinement
    marriages to dangerous men. Mitchell takes care to put just one man on notice,
    but the institution of marriage itself.


    By the time she recorded “Not to Blame,” she was questioning marriage’s value
    in her own life. There’s more rapture directed toward Klein on Night Ride Home,
    by Turbulent Indigo they had separated, and Mitchell’s attitude toward love grew
    dark. She mostly continued to look beyond herself, as in “Sex Kills,” a fierce
    diatribe against sexualized greed and violence and, implicitly, the hypocrisy
    of government during the AIDS crisis; or “The Magdalene Laundries,” a keen for
    the unwed mothers driven to their deaths on the Irish work farm. But one song
    on her marriage playlist stands apart. I think it’s the most personal she ever
    wrote about Klein. A coda, it breaks the heart.


    The arrangement on “Last Chance Lost” is spare. Only the two of them play on track:
    her guitar and voice, his bass and keyboards. She climbs and falls along a melody
    that ascends in stairsteps and continually collapses on itself. The lyrics are
    spare, too; this is a pared description of what happens when words fail. Real
    people to each other all those years, the married couple revert into stereotypes:
    the hero cannot make the change, the shrew will not be tamed. Klein’s is usually
    buoyant bass, for the first time ever and clearly, actually sounds a bit solid.
    The song’s last image is of the two soon-to-be exes bickering on a rifle range.
    The multitracked harmonies that end the song, just little phrases, careen like
    bullets and lean sharply, like bodies dodging something. Marriage is exposed here
    the bond that binds and winds. The song seems to end abruptly, at the same time,
    feels complete.


