    # For Art’s Sake


    One of the fundamental principles of Joni Mitchell’s life is that an artist must
    be free, must value above anything else the right to move and change. There can
    be no limits when it comes to pursuing something new, even a different face and
    name. For one leg of her Hejira road trip in the late 1970s she turned South in
    her white Mercedes and disguised herself in order to explore her regions unrecognized.
    One pseudonym she used venturing all the way to the Alabama Gulf Coast was “Joan
    Black.\” Later, she returned to Los Angeles, and made another crossing.


    Still playing with her new jazz persona, Mitchell darkened her visage and put
    on a wig and a fake moustache and became, in her mind, a Black man whom she alternately
    name Claude and Art Nouveau. She did it as a lark, then she did it again as a
    way to be a muse to herself, and again as an artistic statement she made sure
    was visible to all. Her choice to inhabit this character, which she’s never denounced,
    is inconceivable today. It’s shocking to realize that she felt no hesitancy when
    she buttoned up her vest and topped her polyester Afro with a brightly banded
    fedora. But few around her questioned her costume then, and most friends, fans
    and chroniclers have tread lightly around the worrisome subject since. It’s tough,
    they say, to even talk about it, especially because this is Joni, the unimpeachable,
    the treasure so many feel compelled to protect.'
