  md: '# EMBARKING


    Many years ago, I was standing in my front yard looking suspiciously at some gathering
    clouds when a New York editor called me and said, “I really wanted to read you
    Joni.” My first reaction was to pull the phone away from my face and laugh. Of
    course the woman music critic wrote about the woman demigod. Why didn''t anyone
    ever say to me, “I really wanted to read you on the Beatles?” In fact, I knew
    why. With thirty years and tens of words behind me, I''d made contemplating what
    it means to be a “woman in music” the heart of my work. Somewhere buried in a
    trunk at the back of my office closet is a clothbound notebook from my eighteenth
    year with I LOVE WOMEN! scrawled in blue ink halfway through and some kinda thoughts
    on Kate Bush, Chrissie Hynde, Debbie Harry, the artists of my Wave generation;
    renegades showed me that music could be the vehicle for my questions about what
    it means to move in a body gendered female spaces dominated by me. Also in there
    is a written talk I once gave on Joni Mitchell''s Blue. I have, at times, given
    to the inevitable, recognizing her brilliance. I just never longed in its proximity.


    I took a breath, put the phone to my ear again. There was really nothing strange
    about someone thinking that a woman like me—white, raised middle-class, fancied
    herself bohemian, loves a great ballad, grew up in the north but considers California
    a second home, can possibly play the guitar—should be interested in Joni Mitchell.
    Yet my feelings about Mitchell and her music were more abstract than ardent. The
    fact is that I''ve always found her a daunting figure, difficult to identify with.
    Yes, I can hear the perfection in Blue, and the reach of Hejira. I recognize her
    innovations as a guitarist, her studio wizardry, the diamond shine of her voice.
    At some point I got tired of hearing not only about how Joni Mitchell is, but
    that she''d never fully acknowledged as such.


    As I saw, she''d had more advantages than most. Her inimitable talent, of course,
    but also her connections to powerful men like the Davids (Crosby, Geffen) and
    the can charm that people who often regarded her female peers as silly and excessive.
    The minute Mitchell stepped onto the musical stage she found critical approval
    and a devoted audience, and even when her career took inevitable downturns, she
    remained the spirit of so many listeners'' hearts. I preferred underdogs. Even
    the rock and soul queens I'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'loved best, Janis Joplin and Aretha Franklin, were messier than Mitchell. Her
    svelte, swanlike cool felt so distant from my own way of being.


    Hold on, I said to the editor, let me call you back in a minute. I needed time
    to walk around the block and fret a bit. To mull over the possibility of entering
    the Joni congregation. Devotees and scholars, mostly inseparable from one another,
    have documented her every guitar tuning, road trip and close encounter. Women
    and men alike have rhapsized about her as both a soulmate and an unmatched ideal.
    Joni conquered so many hearts and was called “genius” so many times that the slant
    rhyme between her name and that word is embedded in her story, its principal signpost.
    All the Joni worship freaked me out, frankly—it''s so intense and uncompromising.
    To so many, she can do no wrong. I have never felt comfortable around the popular
    kids.


    I took another branch, I had to admit that there were times Joni got to me, too.
    When I managed to push away all of this baggage and really listen to her music,
    I heard someone I could recognize. A striver, relentlessly curious. A soul acknowledging
    its ownness. A lady who loved a good joke. And certainly a brilliant musician,
    one who most innovators could turn shortcomings into strengths and process the
    dominant artistic conversations of her time through her filters until they sounded
    unique. I''d spent enough time with Mitchell''s full recorded catalog to know
    she pulled this off many times—she didn''t settle into her achievements, instead
    always wanting something different. Her songs themselves formed an argument against
    being treated like a sacred cow. This made me wonder if I could find another Joni
    Mitchell, one less worshipped but better understood.


    So I called back and say okay. I''d take a trip with Joni, make her life and work
    the center of my world for a while. Little did I know, as I set forth with her
    in mind, that this journey would take me into so complicated spaces.


    # ECHOCATION


    When it comes to art, I don''t believe in anything timeless, but I do trust resonances,
    the echoes that intensify the impact of specific songs (or books, or paintings)
    in their moment and then carry them across the years. I fell in love with rock
    and roll as a kid because of the sound waves hit'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'making me feel every inch of my body and the heat and freedom and joy people
    felt when it enraptured them. That’s resonance in its most visceral form. I didn''t
    want to be lifted into some celestial realm; I needed to know my world better
    better Music always put me right in the middle of things. And the words of the
    songs I loved, which spoke so directly and demanded a response, enhanced the feeling
    that its present tense could be all-encompassing.


    Later I came to realize that resonance is also a cultural thing. Great artists
    don''t transcend their historical circumstances; they live deeply in specific
    times and places. They are also deeply themselves. Their gift is being able to
    figure out what elements from unsorted experience can make the jump beyond the
    moment they''re generated, forming stories, sounds and images that vibrate and
    expand. A year or a century later, someone can encounter a great artist''s work
    and recognize her own voice in its reverberations.


    Joni Mitchell is a metaphor for this kind of connectivity. It came to her in the
    spring of 1976, when she was driving through the West and saw some military planes
    flying in formation, an encounter that could have only happened in the Space Age
    but put in her mind of ancient things, of pilgrimage and prophecy. She used the
    image in her song “Amelia,” invoking her favorite form of divination, I Ching:
    in the hexagram of the heavens, she wrote, saw the strings of my guitar. And then
    when she recorded the song she asked jazz guitarist Larry Carlton to put down
    swooping lines that reinforced her words, showing them to be about dreaming, about
    modernity, about the way people''s lofty lofts of the universal are always grounded
    in their own hands and can grasp.


    That''s resonance. It''s personal; it''s here and now; it''s ancient. A hippie
    like Joni Mitchell might say it''s all those vibes, linking total strangers by
    making them feel what they have in common in their bones. A vision experienced
    alone becomes a song that rings forth into the universe and survives there, its
    original meanings multiplying as it moves through time and space. I wanted to
    track these sound waves in Joni''s, navigating by echolocation.


    To do this, I had to follow the molecules colliding and forming patterns within
    Mitchell''s life and work. That meant staying light on my feet. Though this book
    proceeds chronologically, I didn''t write it that way.'
