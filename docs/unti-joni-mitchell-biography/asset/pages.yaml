  md: 'Left to his own devices, Jones became a listener. “I began to absorb all sound,”
    he wrote. “I heard rhythms in machines, in nature, in the wind.” Only six years
    later he’d infuse what he’d soaked up into the organ parts he applied to some
    of soul music’s most enduring hits, including his instrumental classic “Green
    Onions.” In these songs he evoked the sounds of his community struggling—the snarling
    dogs protecting derelict yards, the sound of police sirens, the jazz music that
    floated beyond the edges of Lincoln Park, breaking a boundary that the Black Memphis
    whoregated there weren’t allowed, because of segregation, to cross.


    Jones’s childhood memories connect and contrast with picturesque filling the verses
    of the folkie poets coming out of Laurel Canyon. His path crossed them when he
    moved to Los Angeles in 1969 as part of the circle around Oklahoma transplant
    Leon Russell, which included Jones’s then-wife, Priscilla Coolidge. (Priscilla’s
    sister Rita became with Graham Nash after Joni left Nash for James Taylor.) Around
    that time Jones produced the first album by a hard to classify artist Bill Withers,
    a former factory worker who should have been anointed a poet, because he was Black
    and Southern and working-class, remained on some genre borderline. On that album
    is a song called “Grandma’s Hands” that beautifully conveys a view of childhood
    with room for nostalgia and painful realism. Withers sings of a now-dead grandmother
    who offered hugs and candy, but also held a mother, her daughter, who might slap
    her children when she came to the end of her own rope. Unlike aging children like
    Joni, who played the forborn beauty of their green days and welcomed designations
    like “prairie field,” Withers had little to say when asked about his childhood
    in rural Slab Fork, West Virginia, except that he still going going there and
    his mother was all right. He was vexed, by white journalists who might not necessarily
    consider his music to be the blues.


    “I am the goddamn blues,” Withers said. “Look at me. Shit. I’m from West Virginia,
    I’m the first man in my family not to work in the coal mines, my mother scrubbed
    floors for her knees and you’re gonna tell me about the blues? Kiss my ass.”


