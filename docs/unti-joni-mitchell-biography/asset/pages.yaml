  md: 'Instead trudging along the timeline of her life from childhood to venerable
    old age, I sought out the turning points that shaped her and worked to understand
    how she made those central within her music. I started my explorations where I
    most easily found her, at the turn of the 1970s, when Clouds and Blue made Mitchell
    the avatar for a new kind of literary openness. I learned as much as I could about
    the communities that formed her, as a folkie then and as a California seeker reinventing
    the genre under the influence of Hollywood, jazz and the counterculture. Tracking
    down her friends and collaborators, I explored what it meant for her to deal with
    quintessential problem for women working in creative fields: being female in scenes
    defined by men. Pushing up my sleeves in the Rock & Roll Hall of Fame and reading
    every early copy of Rolling Stone helped me understand how she became the role
    model for a certain kind of liberated woman in the wake of a feminist movement
    that never endured.


    Joni''s resonances filling my head as I continued to think, read, listen and write.
    I started to recognize how the matters that preoccupied her fit within the changing
    contexts through which she was living. Certain subjects emerged: childhood as
    an imaginary terrain where singerwriters could express their ideals and idiosyncrasies;
    sadness as a complicated form of women''s liberation; side roads and retreats
    as the secret sources of an artist''s strengths. And traveling, always traveling,
    the paradoxical grounding principle of her life.


    By the time I hit the late 1970s, Joni was no longer an abstraction to me. The
    figure ossified by fame away bit by bit, and the full shape of a woman emerged.
    This Joni Mitchell was neither the object bearer of women''s sorrows nor a goddess
    beyond comprehension. She was a goofball, fast with a joke, a satirist casting
    sharp eye on the haute-hippie pretensions that sometimes tucked her. She threw
    herself into love affairs and spiritual pursuits with anhearted enthusiasm that
    felt familiar. She''s always said that at heart she''s a real rock and roller,
    and her rebel spirit won me over. I also valued her growing commitment to jazz,
    the dedication she brought to becoming the musical collaborator and most inventive
    player and singer could be. I became absorbed by the music and lore of the jazz-rock
    milieu where she then moved, invigorated by the curiosity that compelled her to
    push beyond easy definitions. That same spirit characterized her often undervalued
    1980s work, and learning'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'about her pursuit of new technologies and themes helped me better understand
    the sounds of that time, the era of my own youth.


    The third act of Mitchell''s life presented diverse narrative challenges. After
    age fifty, she retreated for long periods; she struggled with illness. Her reunion
    with Kirsten Gibb, the daughter she''d entrusted in adoption shortly after birth,
    answered some central questions about her life and work, but as an adoptive mother
    myself I felt hesitant to make any conjectures about this most intimate connection.
    Every adoption story is different, and I firmly believe it belongs only to those
    who''ve lived it. I would not pry; my resistance to doing so is one reason I''ll
    never call myself a biographer. Eventually, though, I follow Mitchell''s signals
    as she moved into middle age and beyond. Learning to manage her new public identity
    as a mother, she found spiritual daughters, musicians and writers who craved her
    blessing. She played with her legacy in fascinating ways. And she began to build
    her archive just so doing became a primary focus for musicians of her generation,
    and a matter of central importance within popular music itself.


    Time went by and my Joni atlas grew. I took on a role that I''d never wanted:
    I became a kind of Joni expert. “Joni wrote about that,” I''d pipe up in pop-trivia
    discussions. “Check out verse two ''Cactus Tree.'' Or,"Joni used that synthesizer,”
    “Joni played that club,”that guitarist toured with Joni in 1979.” Friends tolerated
    my habitual flexing; they knew I''d been doing the work. But then they''d ask
    the inevitable question. “So, did you talk to her yet?” No, I''d say, and here''s
    why.


    I knew Joni Mitchell was a great interview—once she got going, she''d let it all
    hang out, she wasn''t lambasting the interlocutor for some opinion she found ridiculous.
    She once signed a contract to write an autobiography, but as of this writing she
    hasn''t published one; instead, she laid down through others'' pens. A growing
    literature exists documenting her garrulous conversations. Its lodestone is Malka
    Marom''s book-length collection of interviews Joni Mitchell: In Her Own Words.
    That collaboration with Mitchell''s longtime friend, a fellow Canadian folk singer
    and public personality, is the most revealing document she has produced. And throughout
    her life, Mitchell welcomed many other writers into her home, their tape recorders
    discreet activated.


    These encounters became invaluable to me. Michelle Mercer''s 2009 study of Mitchell''s
    “blue period,” Will You Take Me As I Am, is enriched'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'by warm talk over white wine with Joni in her Sunshine Coast backyard. It did
    much to dispel widespread myths about her, including that she was ever glamorously
    aloof. David Yaffe''s 2017 biography, Reckless Daughter, jumped off a series of
    hours-long conversations punctuated by communication breakdowns; Yaffe emerged
    from those conflicts perhaps too eager to stay in Joni''s good graces, but his
    book is powerful, especially when it comes to rich musical analysis, because it''s
    grounded in that meaningful exchange. Marom''s volume most convincingly conveys
    Mitchell''s personality; teased and comforted and, occasionally, challenged by
    a genuine friend in discussions staged across several decades, Mitchell lets her
    truths det and scatter in revelatory ways, even if her streams of uncensored musings
    also characterize Mitchell''s interviews in publications like Rolling Stone and
    Vanity Fair and preserved in anthologies by esteemed journalists like Barney Haskyns
    and Susan Whallit. Sitting next to a bookshelf heaving with Joni''s words, I felt
    lacking for her insights.


    In 2015, Mitchell suffered a debilitating aneurysm. For several years, it was
    unclear if she would speak in public again. I wrote of this book during her time
    of silence. When she finally reemerged, as the honored guest at various tributes
    to her, and then as a tentative but determined performer herself, I considered
    attempting a connection. I quickly decided against it, not only because her condition
    remained unclear but in truth, I feared what would happen if I sought her blessing.


    Was Being cowardly? Perhaps. As someone who spent years in the weird dance between
    artists and their chroniclers, I knew that even a little intimacy can create the
    desire for more. The more beloved the artist, the more potent the craving. Despite
    her sometimes gleeful arrogance, maybe partly of it, something about Joni Mitchell
    screams to know her is to love her—and to emphatically believe in her. Her supercharged
    appeal is a problem if clarity is your goal. It seduces. Mitchell''s biographers
    know this; they have wrestled with her potential disapproval. “I knew she would
    turn on me, that she could cast me out,” Yaffe said in an interview after he''d
    published his book, and indeed, she did reject him at certain points, though she
    would let him back in and cast him out again.


    The problem she faced, now mine, is that, like anyone, Mitchell the woman has
    a firm idea of what her story means, even though over the years she''s contradicted
    herself and filtered things through her own strong'
