    # KIDS IN THE STREET


    While young Roberta Jones chasing winged marlins across Saskatoon''s Aspen Parkland
    (or boys at the skating rink), Booker T. Jones made his own forays through the
    yards of South Memphis. This was long before he became a soul producer and a pop
    innovator in scenes directly adjacent to Joni''s folkish one. Jones had a paper
    route to keep him occupied while his mother and father worked at the local high
    school, a secretary and a math teacher. "I looked like a pregnant boy," the keyboardist
    and producer wrote in his memoir, remembering the two huge bags hung over his
    eleven-year-old shoulders. Deliveries showed him the Memphis middle-class parents
    to keep at arm''s length: doors opened by little girls who said, "My mama say
    she not here," a shack where an old man who stank of kerosene lived and looked
    forward to their brief daily encounter,"sex workers, people with disabilities,
    addicts, homeless people and church faithful." Jones noticed it all, but one window
    where he was paused at the house of pianist Phineas Newborn, Jr. There he''d hold
    papers and listen to Newborn practice, sometimes for an hour. It would throw off
    his whole afternoon.'
