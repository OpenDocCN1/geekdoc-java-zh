  md: 'What makes “River” so powerful is how it makes us think about being sad: about
    the crises sorrow perpetuates, the urgency with which it takes over and the energy
    it takes to fight back. To be selfish and sad is to demand the right to negative
    emotions while recognizing the harm they do to oneself and others. The song’s
    tight circle of a melody and the way Mitchell sings it embody an inner battle
    for composure. Her voice surges, pulls sternly back. The piano lines are grounded
    in simple chord changes, with every right-hand flourish slightly restrained by
    a stern quarter note from the left hand.


    “River” captures what it feels to be sad, but also to question one’s right to
    be sad, to long for and simultaneously worry about the urge to get lost in the
    sorrow. It''s also about wanting to get away from others who see you as sad, and
    from the circumstances reinforcing your sorrow. It''s Mitchell song that most
    directly captures the mood of the epigrammatic writing of her literary twin, Joan
    Didion, the queen of migraines and malaise. It especially recalls Didion’s classic
