    studios in 10 or 12 minutes. I married when I was 22. So far as hanging out, I
    wasn''t. I was a homebody between sessions, I''d go for dinner, as opposed to
    going out to a restaurant with the guys.


    As a teenager he''d been recruited to join the Crusaders, an all-Black band that
    had relocated from Houston and dropped the word "Jazz" from its name to be able
