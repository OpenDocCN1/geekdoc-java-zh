    something in 4/4 time but then throw in a section in 5/8 or 4/8—aiming, as she
    said, for something “sideways.” Guerin invented a system of transcription to guide
    the band, a way of mapping her hip shakes, the jazz guys confronted with her eccentricities
    could get into her groove. She didn''t read charts herself. She was just trying
    to “sophisticate” my music to my own taste.


    The pianist and composer Brad Mehlau, who has interpreted inimitable Mitchell
    songs throughout his career, attributed her conviction that music is a form of
    conversion. “Joni Mitchell’s unique rhythmic approach to melodies to do, for me,
    with a total conversational ease. A wonderful feeling of casualness that the music
    makes all the arresting because there is so pathos implied in the way she variously
    clips, shapters, and extends each phrase; in the controlled huskiness of her voice,
    and in the lyrics themselves,” he wrote in the liner notes to a 2007 Mitchell
    tribute album. This makes sense to me: she was always a talker, bubbling over
