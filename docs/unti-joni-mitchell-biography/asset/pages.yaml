  md: '“Moon at the Window,” from Wild Things Run Fast, is a perfect melding of her
    jazz sensibility with more direct poetic melodic lines and rhythms; it beguiles,
    but its lyric is sorrowful. This may be the closest Mitchell ever came to achieving
    a dream she’d had since childhood, of singing in spiritual kinship with Billie
    Holiday. It’s one of her first deep musical collaborations with Klein, whose layered
    bass parts—four in all—build a harmonic context for her guitar and underscore
    the song’s sense of stasis and isolation. It’s a counterpoint to the brighter
    songs on Wild Things Run Fast, Mitchell’s blue study of the institution she would
    soon enter.


    “The song is quite a dark poem about agoraphobia and the fleeting nature of happiness
    in romantic relationships and marriage,” Klein told me.

    “After we had gotten a basic track that felt definitive to everyone involved I
    proposed the idea of building an orchestral group of bass tracks to function as
    an ensemble that ran through the song to Joni. The dark nature of the poem somehow
    suggested this to me as an interesting possibility, and Joni was up for experimenting
    with the idea. I had never heard this before in context, and it felt fresh to
    me. Joni gave me the room to experiment with it, and in the end we felt that it
    worked well.


    Mitchell plays delicately syncopated guitar on “Moon at the Window”; Klein’s bass
    parts range into their zone and Wayne Shorter’s saxophone takes the high as Guerin
    keeps a characteristically light beat. An Oberheim synthesizer played by Russell
    Ferrante combines these elements so the sounds both both—lonely—and expansive.
    The ideal setting for the story of an abandoned wife haunted by the presence of
    a husband who still confines her, though now like a ghostly memory. Mitchell has
    said that the titular phrase, *At least the moon at the window, the thieves left
    that behind*, refers to a note written by Brad MacMath, her daughter’s father,
    when he left, three months pregnant. (He’d lifted the phrase from a poem by the
