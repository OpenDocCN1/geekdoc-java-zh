    for you and gratitude for our love and our partnership. Bebe, during the time
    I wrote this, you grew from a young teen to a woman. I am proud of all you, and
    it is my joy to continue getting to know the wise adult you are becoming. Thank
    you for every hug and How are you doing, Mom? They got me through.


    Frank-Nfurter Nietzsche, you share a name with Joni Mitchell''s cat, but you are
    a Malibu without peer. I am very glad you joined our family. I am also aware that
    as a dog, you can''t read, but I love you.


    And finally: Joni Mitchell, I thank you for your endless complexity. It gave me
    so much to explore, and I''ll never regret my time following you.'
