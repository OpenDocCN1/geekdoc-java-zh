    of the region''s First Nations culture—representing not only Cree people, but
    Lakota, Dene and others—was preserved by the white settlers of the pioneer territory
    where Roberta Joan was raised. On the back cover of Don Juan''s Reckless Daughter
    is a photograph of her in an “Indian” costume; mirroring the lyrics of “Paprika
    Plains,” this image, though confronted far less frequently than the notorious
    blackface costume she wears on the front cover, shows how Mitchell imagined herself
    as akin to First Nations people and misunderstood their lived experience from
    childhood on.


    Her activism on behalf of Indigenous causes has been a mainstay of Mitchell''s
    adult life, so much that she was even granted the name Sparkling White Bear Woman
    by the Saulteaux people in a civic ceremony in 2018. Mitchell also believed for
    many years that her own genetic makeup included the blood of the Sámi, the first
    people of northern Scandinavia, home of her great-grandparents. (This has been
    disproven.) She clearly feels a deep emotional bond with the distant neighbors
    who, to her, seemed like fellow outsiders in her lonesome prairie youth. But she
    was and can only be, at best, an ally, and at worst a romanticizer. Indigenous
    imagery runs through Mitchell''s lyrics, especially from the 1970s onwards, and
    often works the seed of protest. At the same time, when she pictures the white
    people in her memory or dreams as corrupted by the white man''s influence, she
