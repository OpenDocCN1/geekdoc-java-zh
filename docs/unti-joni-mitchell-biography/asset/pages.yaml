  md: 'perspective. Memory is always tricky; its power lies in the conviction of the
    teller. And after decades of being mined and guarded like a treasure, Mitchell
    the legend (if not the woman); it’s hard to tell) can’t bear too much heavy questioning.
    “Joni the rapper Q-Tip famously intoned in Janet Jackson’s "Got Til It''s Gone.\”
    That itself is a lie. We fudge things, omit and embellish. I didn’t want to reinforce
    the kinds of questions that could cause Mitchell to cast me out. So I chose to
    rely on the words she''d already offered and steer clear of the tenuous bond interview
    I creates.


    Resonances dont register accurately if you''re too close. I know what it''s like
    to feel overly committed to an artist and lose critical perspective. This''s a
    side effect of what Joni famously called the “star maker machinery,” the process
    through which fame becomes grounded in the exchange of a celebrity''s private
    life and inner thoughts for the price of a concert ticket, and an album, a magazine.
    Fans think their favorite stars, and in a personal encounter the rush of instant
    familiarity can distort everything. Journalists are supposed to be different from
    fans, but we are people, full of the longing for acceptance. I don’t want to seek
    Joni Mitchell''s acceptance. I want to bring as wide a perspective as I can manage
    to in her world, and I can do that only by maintaining some distance. In this
    way, I remain a witness, no friend.


    # A PHASE


    Others have not felt the same need for distance. The novelist Zadie Smith described
    the onset of her passion for Joni Mitchell as a physical affliction. “This is
    the effect that listening to Joni Mitchell has on me these days: uncontrollable
    tears,” she wrote in the *New Yorker* in 2012. “An emotional overcoming, disconcertingly
    distant from happiness, more like joy—if joy is the recognition of the almost
    intolerable beauty. It’s not a very civilized emotion.” Smith’s experience, no
    matter how intense, is typical for fans who become devoted to Joni. In her deeply
    subjective argument for Mitchell’s inimitability—“The Joni Mitchell Problem,”
    the essayist Meghan Daum recounts after realizing her life goal of meeting Mitchell
    and making a chatty connection with her, she lost the singer’s phone number. “After
    everything—after the dinner, after the art exhibit, after the decades spent with
    my own private Joni of adolescence and the indecision of early adulthood and the
    parting clouds of'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'middle adulthood—I let the woman herself slip away like a dream burned into
    abstraction by the glare of wakefulness.” Her not-that-wakeful dream of Mitchell
    could not be disturbed by the reality of an actual person. These few famous songs,
    as for many people, introspective encounters with Mitchell’s voice are so powerful
    and unique that they cannot be shared with others—even their source. Coming to
    love her is akin to enlightenment: a shocking moment of insight that transforms
    the world.


    Yet so many also talk about the experience as a phase. You know, like a “punk
    phase,” when you had a Mohawk, or a “Dylan phase” that a cardboard box of bad
    undergrad poetry exposes. The Joni Mitchell phase is distinctive in its stunning
    impact and the feeling that lingers of being intertwined with her words and voice.
    The critic Ron Rosenbaum wrote an ode to song “Amelia” in which he described his
    relationship to it as a bout of musical addiction,periods when I got tangled up
    and play it over and again for hours, sometimes days at a time.” Even lifelong
    fans, the musician Dan Bejar, used temporal language to describe listening to
