    \ 类的子类，而 `mammal` 类反又是 `animal` 类的子类。\n\n我们可以使用 IS-A 关系来观察这一点。其形式如下：\n\n* `Mammal`\
    \ IS-A `Animal`\n* `Reptile` IS-A `Animal`\n* `Dog` IS-A `Mammal`\n* 因此：`Dog`\
    \ 也 IS-A `Animal`\n\n使用 `extends` 关键字允许子类继承父类的每一个属性，但私有属性除外。\n\n使用实例运算符，我们可以确保普通类确实是\
    \ `animal` 类的实例。\n\n示例：\n\n```java\npublic class Dog extends Mammal{\n  public\
    \ static void main(String args[]){\n      Animal a = new Animal();\n      Mammal\
    \ m = new Mammal();\n      Dog d = new Dog();\n      System.out.println(m instanceof\
    \ Animal);\n      System.out.println(d instanceof Mammal);\n      System.out.println(d\
    \ instanceof Animal);\n  }\n}\n```\n\n输出：这将产生以下结果\n```\ntrue\ntrue\ntrue\n```\n\
    \n### instanceof 运算符\n\n在 Java 中，如果你想确定一个类是否属于某个特定的给定的类，或者实现某个给定的接口，可以使用 `instanceof`\
    \ 运算符。`instanceof` 运算符是一种类型比较运算符。`instanceof` 运算符根据类的状态返回 `true` 或 `false`。如果给定对象属于某个类，或者给定对象实现了某个接口，则\
    \ `instanceof` 运算符返回 `true`。否则，它将简单返回 `false`。\n\n在下面的示例中，你可以看到 `instanceof` 运算符的使用。\n\
    \n```java\nclass Vehicle {\n  String name;\n  Vehicle() {\n    name = \"Vehicle\"\
    ;\n  }\n}\n\nclass dirtbike extends Vehicle {\n  dirtbike() {\n    name = \"dirtbike\"\
    ;\n  }\n}\n\nclass atv extends dirtbike {\n  atv() {\n    name = \"atv\";\n  }\n\
    }\n\nclass LightVehicle extends Vehicle {\n  LightVehicle() {\n    name = \"LightVehicle\"\
    ;\n  }\n}\n\npublic class InstanceOfExample {\n  static boolean result;\n  static\
    \ dirtbike hV = new dirtbike();\n  static atv T = new atv();\n  static dirtbike\
    \ hv2 = null;\n\n  public static void main(String[] args) {\n      result = hV\
    \ instanceof dirtbike;\n      System.out.print(\"hV is dirtbike: \" + result +\
    \ \"\\n\");\n      result = T instanceof dirtbike;\n      System.out.print(\"\
    T is dirtbike: \" + result + \"\\n\");\n      result = hV instanceof atv;\n  \
    \    System.out.print(\"hV is atv: \" + result + \"\\n\");\n      result = hv2\
    \ instanceof dirtbike;\n      System.out.print(\"hv2 is dirtbike: \" + result\
    \ + \"\\n\");\n\n      hV = T; // 成功将子类转换为父类\n      T = (atv) hV; // 成功将父类转换为子类\n\
    \  }\n}\n```\n\n输出：\n```\nhV is dirtbike: true\nT is dirtbike: true\nhV is atv:\
    \ false\nhv2 is dirtbike: false\n```\n注意：`hv2` 没有引用 `dirtbike`，`instanceof` 返回\
    \ `false`。你应该记住，你不能在兄弟类之间使用 `instanceof`。\n\n### implements 关键字\n\n现在你已经对 `extends`\
    \ 关键字有了良好的理解，我们将来看 `implements` 关键字以及它如何用于获取 IS-A 关系。我们使用 `implements` 关键字让类继承接口。你应该记住，接口不能被类扩展，只能被实现。\n\
    \n示例：\n\n```java\npublic interface Animal {}\npublic class Mammal implements Animal\
    \ {}\npublic class Dog extends Mammal {}\n```\n\n### instanceof 关键字\n\n在这里，我们将查看\
    \ `instanceof` 运算符。我们使用这个运算符来判断一个类是否是其父类的实例。\n\n```java\ninterface Animal{}\n\
    class Mammal implements Animal{}\npublic class Dog extends Mammal{\n  public static\
    \ void main(String args[]){\n      Mammal m = new Mammal();\n      Dog d = new\
    \ Dog();\n      System.out.println(m instanceof Animal);\n      System.out.println(d\
    \ instanceof Mammal);\n      System.out.println(d instanceof Animal);\n  }\n}\n\
    ```\n\n输出：\n```\ntrue\ntrue\ntrue\n```\n\n### HAS-A 关系\n\n使用是这种关系的主要用处。如果某个类拥有（HAS-A）某些东西，我们就说两个对象之间存在这种关系。这种关系的主要用途是有助于减少\
    \ Bug 和代码重复。\n\n这里是一个显示对象之间存在 HAS-A 关系的示例。\n\n示例：\n\n```java\npublic class Vehicle{}\n\
    public class Speed{}\npublic class Van extends Vehicle{\n  private Speed sp;\n\
    }\n```\n\n上面的示例告诉我们 `van` 拥有一个 `speed`。如果我们专门为 `speed` 创建一个单独的类，我们可以在不同的应用程序中反复使用它。\n\
    \n在 Java 中，类只能有单继承。Java 不支持多重继承。每个类都限制为使用 `extends` 关键字进行单继承。然而，允许类实现多个接口。通过这种方式，可以在\
    \ Java 中获得多重继承。下面的语句包含两个带有 `extends` 关键字的类，无法以那样使用该关键字。\n\n`Public class extends\
    \ Animal, Mammal {}`\n\n# 第 7 章：对象的生存与死亡\n\n## 构造函数\n\n在 Java 中，构造函数可以定义为一种特殊的方法，通过它你可以初始化对象。构造函数在对象创建期间被调用。它之所以被称为构造函数，是因为它为对象构造了值。\n\
    \n### Java 中创建构造函数的规则\n\nJava 为构造函数定义了两个基本规则：\n* 构造函数的名称必须与类名完全相同。\n* 构造函数不应该返回值。\n\
    \n### 构造函数的类型\n\n在 Java 中，我们有两种类型的构造函数：\n* 默认构造函数或无参构造函数\n* 参数化构造函数\n\n### Java\
    \ 默认构造函数\n\nJava 默认构造函数是不带参数的构造函数。\n\n默认构造函数的语法：\n`<class_name>()()`\n\n这里是一个简单的默认构造函数的示例。\n\
    \n示例：\n\n```java\nclass Bike1{\n  Bike1(){System.out.println(\"Bike is created\"\
    );}\n  public static void main(String args[]){\n      Bike1 b=new Bike1();\n \
    \ }\n}\n```\n\n输出：\n```\nBike is created\n```\n\n这是一个默认构造函数的示例，它提供默认值。在个人示例中，你没有创建任何构造函数。在这里，编译器为你的代码提供了一个默认构造函数，因为没有定义，而\
    \ `0` 和 `null` 值是由默认构造函数提供的。\n\n示例：\n\n```java\nclass Student3{\n  int id;\n \
    \ String name;\n  void display(){System.out.println(id+\" \"+name);}\n  public\
    \ static void main(String args[]){\n      Student3 s1=new Student3();\n      Student3\
    \ s2=new Student3();\n      s1.display();\n      s2.display();\n  }\n}\n```\n\n\
    输出：\n```\nnull\nnull\n```\n\n### Java 中的参数化构造函数\n\n在 Java 中，如果构造函数带有参数，则被称为参数化构造函数。\n\
    \n我们为什么应该使用参数化构造函数？\n\n当我们给不同的对象赋予不同的值时，使用参数化构造函数。这里是一个参数化构造函数的示例。在下面的示例中，给 `student`\
    \ 类提供了两个参数。参数化构造函数可以定义任意数量的参数。\n\n示例：\n\n```java\nclass Student4{\n  int id;\n\
    \  String name;\n  Student4(int i,String n){\n    id = i;\n    name = n;\n  }\n\
    \  void display(){System.out.println(id+\" \"+name);}\n  public static void main(String\
    \ args[]){\n      Student4 s1 = new Student4(111,\"David\");\n  }\n}\n```\n"
