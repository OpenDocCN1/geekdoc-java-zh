    \n通过阅读本文，读者同意在任何情况下，我们对因使用本文中所包含的信息而导致的任何直接或间接损失概不负责，包括但不限于——错误、遗漏或不准确。\n\n# Java\
    \ 简介\n\nJava 作为互联网时代最流行的编程语言之一，于 1991 年在太阳微系统公司（Sun Microsystems）构思并开发。任何编程语言的演进都是由计算生态系统发展带来的需求驱动的——`java`\
    \ 也不例外。\n\n虽然用 C 或 C++ 编写的代码（Java 强大的前辈）也可以在所有设备上运行，每次为了让它们在特定设备上运行而所需的编译工作非常贵。\n\
    \nJava 解决了这个问题，只需获取文本源码（`.java`）将其编译为中间字节码文件（`.class`），然后该文件可以由任何运行解释器的设备 - Java\
    \ 虚拟机（`JVM`）进行解释。字节码的想法意味着代码与架构中立，只需要编译一次，并可以在任何可以运行 `JVM` 的设备上进行解释。\n\n今天，Java\
    \ 已经成为一种重要的编程语言，对于任何对编程感兴趣的人来说，至少了解 Java 的基础是必不可少的。本书正是为了这个目的而编写的。我想帮助任何几乎或完全没有编程经验的人，轻松且有效地接触\
    \ `java` 编程。\n\n# 第 1 章：入门\n\n## 安装\n\n在开始任何工作之前，我们需要准备好开发环境。初学者可以使用在线开发环境（`https://ideone.com/`）来执行短代码段，但如果需要执行的代码是一个完整的程序，则必须在系统中安装\
    \ `java` 并设置自己的离线开发环境。Java 有三种类型——\n\n- 微型版 (`J2ME`)\n- 标准版 (`J2SE`)\n- 企业版 (`J2EE`)\n\
    \n对于个人使用，人们可以从[下载页面](http://www.oracle.com/technetwork/java/javase/downloads/index.html)\
    \ 下载对应其操作系统的最新 SE 版本 `.exe` 文件。安装后，检查 `PATH` 变量是否指向 `java` 的安装路径。在终端窗口中执行 `java`\
    \ 将在屏幕上显示安装的 `java` 版本。\n\n## 代码结构\n\n![](img/00001.jpeg)\n\n每个 `java` 代码都以 `.Java`\
    \ 扩展保存。每个 `java` 程序包含一个或多个类。这些类中的每一个都包含一个或多个方法定义，每个方法内部带有几条语句。\n\n## 关键字的语法和含义\n\
    \n```java\nimport java.io.*;;\n\npublic class MyFirstProgram {\n    public static\
    \ void main(String[] args) {\n        //This is my first java program\n      \
    \  System.out.println(\" Hello World !\");\n    }\n}\n```\n\n- `import java.io.*;`\
    \ - 关键字 `import` 用于包含名为 `packages`（包）的 `java` 库，这些包包含了程序可以使用预定义函数。\n- `public\
    \ class MyFirstProgram` - 这是类定义，关键字 `public` 表示该类对所有人可见，`class` 表示类定义。\n- `MyFirstProgram`\
    \ – 这是类名。带有 `main()` 函数的类名应与源文件名相同。\n- 类定义封装在括号 `{}` 之中。\n- `public static void\
    \ main(String args[])`: 这是程序的主部分。由于 `main()` 是驱动函数，它应该始终是 `public` 的。\n- `static`:\
    \ 你需要记住 `main()` 方法应该是 `static` 的，因为这可以提高内存效率。\n- `void`: 这是方法的返回类型。这意味着 `main()`\
    \ 方法不会返回任何内容。\n- `main`: 方法名。解释器仅从 `main()` 方法开始执行。运行程序意味着指示 `JVM` 加载从源码编译的 `.class`\
    \ 文件并从 `main()` 方法开始执行。\n\n`main` 方法的两个用途可以总结为：\n1. 测试程序的所有其他方法\n2. 启动程序的执行\n\n\
    - `String[] args`: 是传递给 `main` 方法的参数。该方法始终接收字符串数组作为输入参数，数组名称应始终为 `args`。\n- 注意数据类型以大写\
    \ `S` 开始，这是因为 `Strings` 是 Java 中的一个类，所有类名都以大写开头。\n- 方法定义封装在花括号 `{}` 之中，在这种情况下，我们希望程序执行的操作只是打印\
    \ \"Hello World!\"。\n- 向标准输出控制台打印语句使用 `System.out.println(\"\");`。注意所有语句必须以分号（`;`）结束。\n\
    - 你也可以使用 `System.out.print()` 显示输出，区别在于 print`ln` 在它打印的每个语句末尾引入新行。\n- 我们程序中 `main()`\
    \ 方法中的另一个语句被称为“注释”语句。这些语句不会被编译，以 `//` 开头的这些语句仅用于为程序员提供更多信息。\n\nJava 根本没有全局变量的概念；通过使用\
    \ `final`、`static`、`public` 等关键字来实现。\n\n### 使用 Java 库\n\n"
- fmt: "\nWhen working with `Java`, you can see that there are a number of predefined\
    \ classes present. All these classes can be used within the Java program leaving\
    \ the user the task of reinventing the wheel. But for making use of these classes,\
    \ you should have some minimum knowledge of what you need to use and where to\
    \ find it. These are called as the Java APIs. The library is nothing but a huge\
    \ pile of predefined classes that can be used anywhere within the program. They\
    \ contain predefined code and all the user needs to know is how to use it. These\
    \ libraries believe the user from typing long lines of code. This is also called\
    \ as the `Java standard code library`. Within the `Java` platform, the `Java standard\
    \ code library` serves three main purposes. They are:\n\n- Just like other code\
    \ library is the Java libraries facilitate the programmer with a set of useful\
    \ facilities. These facilities include regular expression processing, container\
    \ classes etc.\n- The standard code library provides the user with abstract interfaces\
    \ with which he can execute tasks independently. With this the user need not write\
    \ the complete code for complex processes like file access and network access.\n\
    - There are a few underlying platforms that do not support all of the Java applications.\
    \ In such cases you can use the Java library to emulate those features or you\
    \ can use it to provide a way by which you can check for specific features presence.\n\
    \n### Implementation and configuration of the Java standard code library\n\nMost\
    \ of the code in the standard library is written in `Java`. The code, which is\
    \ needed for the direct access of the operating system or the hardware are exceptions.\
    \ The `Java native interface` wrappers are used in such cases for accessing the\
    \ APIs of the operating system. Almost all of the Java code libraries are stored\
    \ in a single archive called as the `rt.jar`. This file is distributed by the\
    \ `JDK` and the `JRE` distributions. The Java class library can be found in the\
    \ bootstrap class path.\n\n### Main features of the Java class Library.\n\nWe\
    \ use classes to access the Java class library features. These come under packages.\
    \ Some of the main features of the Java class library are given below:\n\n- `java.lang`\
    \ has all the fundamental interfaces and classes. They are closely tied to the\
    \ runtime system and the language.\n- There is a special package for mathematical\
    \ operations which includes mathematical expressions, evaluations and arbitrary\
    \ precision decimal numbers. They are all present in the `java.math` library.\n\
    - Utilities and collections: Java provides the user with its built-in Utility\
    \ classes and data structures. These utility classes and data structures can be\
    \ used for data compression, blogging, concurrency and regular expressions.\n\
    - 2D graphics and graphical user interface: The users can use the `AWT` package\
    \ which provides the graphical user interface operations. This package binds to\
    \ the native system. You can use this for designing platform independent toolkits\
    \ and also pluggable feel and look. This package can also be used for dealing\
    \ text components that are editable and non-editable.\n- Sound: this package provides\
    \ the user with classes and interfaces that can be used for writing, reading,\
    \ synthesising and sequencing of sound data.\n- Text: the `java.text` interface\
    \ is used for dealing with text, numbers, messages and dates.\n- Databases: user\
    \ can access the database (`sql`) using the `java.SQL` library.\n- The `Java.Security`\
    \ provides security along with encryption services. There is encryption services\
    \ are present in the `javax.crypto` library.\n- Java also enables you to access\
