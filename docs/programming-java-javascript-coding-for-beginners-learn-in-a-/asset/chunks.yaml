    \ After installing, check that the `PATH` variable points to the `java` installation.\
    \ Executing `java` from the terminal window will display the version of `java`\
    \ installed on the screen.\n\n## Code Structure\n\n![](images/00001.jpeg)\n\n\
    Every `java` code is saved with the extension `.Java`. Each `java` program contains\
    \ one or more classes. Each of these classes contains one or more method definitions\
    \ and each method carries a few statements in it.\n\n## Syntax and meanings of\
    \ keywords\n\n```java\nimport java.io.*;;\n\npublic class MyFirstProgram {\n \
    \   public static void main(String[] args) {\n        //This is my first java\
    \ program\n        System.out.println(\" Hello World !\");\n    }\n}\n```\n\n\
    - `import java.io.*;` - The keyword `import` is used for including `java` libraries\
    \ called `packages` which contain pre-defined functions that can be used in the\
    \ program.\n- `public class MyFirstProgram` - this is the class definition, the\
    \ keyword `public` indicates that this class is available to all and `class` denotes\
    \ to be a class definition.\n- `MyFirstProgram` – This is the name of a class.\
    \ Name of the class having the `main()` function should be the same as the source\
    \ file name.\n- The class definition is enclosed within the parenthesis `{}`.\n\
