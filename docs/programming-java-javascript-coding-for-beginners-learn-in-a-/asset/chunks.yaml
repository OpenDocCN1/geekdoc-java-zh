    \ Since `main()` is the driver function, it should always be `public`.\n- `static`:\
    \ You need to keep in mind that `main()` method should always be `static` because\
    \ it makes the program memory efficient.\n- `void`: This is the return type of\
    \ the method. This means that the `main()` method will not return anything.\n\
    - `main`: name of the method. The interpreter starts execution from the `main()`\
    \ method only. Running a program means instructing the `JVM` to load the `.class`\
    \ file which was compiled from the source code and start executing from the `main()`\
    \ method.\n\nThe two uses of the main method can be summarized as:\n1. To Test\
    \ all the other methods of the program\n2. To Start execution of the program.\n\
    \n- `String[] args`: is the argument that is passed to the `main` method. This\
    \ method always takes an array of strings as its input parameter, and the array\
    \ name should always be `args`.\n- Note that the data type starts with a upper\
    \ case `S`, this is because `Strings` is a class in Java and all class names start\
    \ with upper case.\n- The definition of the method is enclosed within flower braces\
    \ `{}`, in this case, the only thing that we want our program to do is print \"\
    Hello World!\".\n- To print a statement to standard output console, `System.out.println(\"\
    \");` is used. Note that all statements must end with a semi-colon (`;`).\n- You\
    \ can also use `System.out.print()` to display output, the difference is that\
    \ print`ln` introduces a new line at the end of each statement it prints.\n- The\
    \ other statement within the `main()` method in our program is called a \"comment\"\
    \ statement. These are not compiled, the purpose of these statements which are\
    \ preceded by `//` are only to give the programmer more information about code.\n\
    \nJava doesn’t have the concept of global variables at all; the same is achieved\
    \ using keywords such as `final`, `static`, `public`.\n\n### Using the Java library\n"
