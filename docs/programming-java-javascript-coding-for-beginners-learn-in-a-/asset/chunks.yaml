  trans: "\n当给一个对象引用赋值时，将执行隐式类型转换。在这里，对象的引用将被赋值给：\n\n*   与类类型相同的引用变量。该类是实例化给定对象的类。每个类的超类都是作为对象的对象。\n\
    *   使用该数据类型可用的引用，该数据类型是实例化对象的类所实现的接口。\n\n以下是一个示例展示了接口 `Automobile`、超类 `Bike` 和子类\
    \ `Ducati`。在这里，你可以看到编译器处理的给定对象引用的自动转换。\n\n```java\ninterface Automobile{\n\n}\n\
    \nclass Bike implements Automobile{\n\n}\nclass Ducati extends Bike{\n\n}\n```\n\
    \n示例：假设 `c` 是 `bike` 类类型的变量，`f` 是 `Ducati` 类类型，`v` 是一个 `vehicle` 接口引用。我们可以将 `Ducati`\
    \ 引用赋值给 `bike` 变量：\n\n即我们可以执行以下操作：\n\n#### 示例 1\n```java\nc = f; // 正常，编译通过\n\
    ```\n其中 `c = new bike();`\n并且 `f = new Ducati();`\n\n编译器会自动处理转换（赋值），因为类型是兼容的（子类与父类关系），即类型\
    \ `bike` 可以持有类型 `Ducati`，因为一个 `Ducati` 就是一个 `bike`。\n\n#### 示例 2\n```java\nv =\
    \ c; // 正常，编译通过\nc = v; // 从接口类型到类类型的非法转换会导致编译错误\n```\n其中 `c = new bike();`\n\
    并且 `v` 是一个 `Vehicle` 接口引用 (`Vehicle v`)\n\n编译器会自动处理转换（赋值），因为类型是兼容的（类与接口 关系），即类型\
    \ `bike` 可以转换为 `Vehicle` 接口类型，因为 `bike` 实现了 `Vehicle` 接口（`bike` 是一个 `Vehicle`）。\n\
    \n### 对象引用转换：显式转换\n\n有时在 Java 中，当隐式类型转换不起作用或效率不高时，我们必须显式进行类型转换。这种转换非常简单，只需要在成对的括号内指定新“类型”的名称。在这里我们将查看\
    \ `bike` 和 `Ducati` 类的示例。\n\n```java\nclass bike {\nvoid bikeMethod(){\n\n}\n\
    }\nclass Ducati extends bike {\n\nvoid DucatiMethod () {\n\n}\n}\n```\n\n在这里，你可以看到我们还有一个\
    \ `brakingsystem()` 函数。该函数接受 `bike` 引用作为输入参数。无论对象类型如何，方法都将调用 `bikemethod()`。这也会调用\
    \ `Ducatimethod()`。如果你想在运行时确定对象的类型，可以使用 `instanceof` 算符。\n\n```java\npublic void\
    \ breakingSystem (bike obj) {\n   obj.bikeMethod();\n   if (obj instanceof Ducati)((Ducati)obj).DucatiMethod\
    \ ();\n}\n```\n\n该操作告诉编译器将作为对象引用的 `bike` 对象视为一个 `Ducati` 对象。在这里，如果不进行转换，编译器会给出错误信息，说明在\
    \ `bike` 的定义中找不到 `Ducatimethod()`。\n\n接下来的示例程序将向你展示带引用的转换运算符。\n\n在此类中，`Honda`\
    \ 和 `Ducati` 是兄弟关系。这两个类都是 `bike` 类的子类。它们都拥有 `dirtvehicle` 类，这是一个扩展的对象类。任何无法显式扩展另一个类的类默认情况下都会被对象自动扩展。以下代码实例化了一个特定类的给定对象（在本例中为\
    \ `Ducati` 类），并将对象的引用赋值给 `bike` 类型的变量。此赋值是允许的，因为 `bike` 类是 `Ducati` 的超类。为了使用类类型的引用来调用方法，必须定义该方法，并且方法应该定义在给定类的类层次结构中或上方。\n\
    \n示例程序：\n\n```java\nclass bike extends Object {\n    void bikeMethod() {\n\n \
    \   }\n}\n\nclass dirtbike extends Object {\n\n}\n\nclass Ducati extends bike\
    \ {\n    void DucatiMethod() {\n        System.out.println(\"I am DucatiMethod\
    \ defined in Class Ducati\");\n    }\n}\n\nclass Honda extends bike {\n    void\
    \ DucatiMethod() {\n        System.out.println(\"I am DucatiMethod defined in\
    \ Class Ducati\");\n    }\n}\n\npublic class ObjectCastingEx {\n    public static\
    \ void main(String[] args) {\n        bike obj = new Ducati();\n        // 以下将导致编译错误\n\
    \        obj.DucatiMethod(); // 因为 bike 类型未定义方法 DucatiMethod\n        // 以下将导致编译错误\n\
    \        ((dirtbike)obj).DucatiMethod(); // 在 dirtbike 类型中未定义 DucatiMethod\n \
    \       // 以下将导致编译错误\n        ((Ducati) obj).DucatiMethod(); // 以下将编译并运行\n   \
    \     // hondaObj = (Ducati)obj; 无法转换，因为它们是兄弟关系\n    }\n}\n```\n\n在 Java 中允许将对象引用转换为字符串。这是在处理集合时常见的转换操作之一。\n\
    \n示例：\n\n```java\nimport java.util.Vector;\n\npublic class StringCastDemo {\n\
    \    public static void main(String args[]) {\n        String username = \"asdf\"\
    ;\n        String password = \"qwer\";\n        Vector v = new Vector();\n   \
    \     v.add(username);\n        v.add(password);\n        // String u = v.elementAt(0);\
    \ 无法转换\n        Object u = v.elementAt(0); // 未进行转换\n        System.out.println(\"\
    Username : \" + u);\n        // String uname = (String)u; // 允许\n        String\
    \ pass = (String)u; // 允许转换\n        System.out.println(\"Password : \" + pass);\n\
    \    }\n}\n```\n"
- fmt: "\nThe exceptions that are checked during the compile time are called as the\
    \ chat exceptions. In this case, if a method throws a checked exception, it should\
    \ be handled either by using the `try-catch` block or they should be declared\
    \ using the `throws` keyword. If neither of those given methods is followed, the\
    \ compiler will give a compilation error. As these exceptions checked during the\
    \ compile time, they are called as checked exceptions. Here is an example that\
    \ will help you understand about the checked exceptions.\n\nIn this example there\
    \ is a file `myfile.txt`. Data will be read from that file and will be displayed\
    \ on screen. There are three checked exceptions in this program and they are mentioned\
    \ below.\n\n### Example:\n\n```java\nimport java.io.*;\n\nclass Example {  \n\n\
    \  public static void main(String args[])\n  {\n      FileInputStream fis = null;\n\
    \      /*This constructor FileInputStream(File filename)\n           * throws\
    \ FileNotFoundException which is a checked\n           * exception*/\n      fis\
    \ = new FileInputStream(\"B:/myfile.txt\");\n      int k;\n      /*Method read()\
    \ of FileInputStream class also throws\n           * a checked exception: IOException*/\n\
    \      while(( k = fis.read() ) != -1)\n      {\n          System.out.print((char)k);\n\
    \      }\n      /*The method close() closes the file input stream\n          \
    \ * It throws IOException*/\n      fis.close();            \n  }\n}\n```\n\n####\
    \ Output:\n\n```\nException in thread \"main\" java.lang.Error: Unresolved compilation\
    \ problems:\nUnhandled exception type FileNotFoundException\nUnhandled exception\
    \ type IOException\nUnhandled exception type IOException\n```\n\nIn the above\
    \ example, the check and exceptions got checked by the compiler during the compile\
    \ time and as we did not declare those exceptions, the program displayed a compilation\
    \ error message.\n\nA few more check the exceptions are given below:\n\n* `SQLException`\n\
    * `IOException`\n* `DataAccessException`\n* `ClassNotFoundException`\n* `InvocationTargetException`\n\
    \n### Unchecked exceptions\n\nUnchecked exceptions are nothing but exceptions\
    \ that are not checked during compile time. These exceptions do not give compilation\
    \ errors as they cannot be checked during compile time. It doesn't matter if you\
    \ have declared an exception or not. Uncheck the exceptions mostly occur due to\
    \ the data that the user provides during his interaction with the program. The\
    \ only way to handle these exceptions is to anticipate them and writing an appropriate\
    \ handler for that exception. The `RuntimeException` class is the superclass of\
    \ all unchecked exceptions. Here is an example which will help you to get a better\
    \ understanding on unchecked exceptions.\n\n```java\nclass Example {  \n\n  public\
    \ static void main(String args[])\n  {\n      int num1=10;\n      int num2=0;\n\
    \      /*Since I'm dividing an integer with 0\n         * it should throw ArithmeticException*/\n\
    \      int res=num1/num2;\n      System.out.println(res);\n  }\n}\n```\n\nIf you\
    \ compile the above code you can see that the compilation will be successful but\
    \ however if you run it, the program would throw an exception called `ArithmeticException`.\
    \ With this, you know that check exceptions do not throw errors during compile\
    \ time but at runtime. Here is another example.\n\n#### Example:\n\n```java\n\
    class Example { \npublic static main(String args[])\n{\n      int arr[] ={1,2,3,4,5};\n\
    \      /*array has only 5 elements but\n         * I'm trying to display the value\
    \ of\n         * 8th element. It should throw\n         * ArrayIndexOutOfBoundsException*/\n\
    \      System.out.println(arr[7]);\n}\n```\n\nIn this example, just like the previous\
    \ one, there will be no compile errors. However this code when run throws an unchecked\
    \ exception the `ArrayIndexOutOfBoundsException`. These exceptions cannot be found\
    \ during compile time it does not mean that these are unnoticed by the compiler.\
    \ In the above example, it is wise to add a message advising the user to give\
    \ a value within the range. The code after adding the message is given below.\n\
    \n```java\nclass Example { \n     public static void main(String args[])\n   \
    \  {\n      try{\n          int arr[] ={1,2,3,4,5};\n          System.out.println(arr[7]);\n\
    \      }catch(ArrayIndexOutOfBoundsException e){\n          System.out.println(\"\
    The specified index does not exist \" + \"in array. Please correct the error.\"\
    );\n      }\n  }\n}\n```\n\nHere are some of the unchecked exceptions that are\
    \ frequently seen during runtime:\n\n* `NullPointerException`\n* `ArrayIndexOutOfBoundsException`\n\
    * `ArithmeticException`\n* `IllegalArgumentException`\n\n### Difference between\
    \ an exception and an error:\n\n**Exceptions:** exceptions occur within the code\
    \ and they can be handled by the developer. Developers can take the required actions\
    \ when they occur. Few examples of exceptions are given below\n\n* `DivideByZeroException`\n\
    * `NullPointerException`\n* `ArithmeticException`\n* `ArrayIndexOutOfBoundsException`\n\
    \n**Errors:** Errors are different from exceptions. They are abnormal conditions\
    \ which the system tries not to handle. When an error occurs it indicates that\
    \ the system encountered a serious problem. They define problems that cannot be\
    \ got under usual conditions by the program. A few examples of errors are:\n\n\
    * `Hardware error`\n* `Memory error`\n* `JVM error`\n\n### Exception Handling\n\
    \nException handling is a powerful mechanics in with which runtime errors can\
    \ be handled. Exception handling ensures that the normal flow of the program is\
    \ maintained.\n\nA few advantages of exception handling\n\n* Exceptional funding\
    \ will allow the user to control the flow of execution of a program if it has\
    \ exception handling written in it.\n* Whenever there is an error, it will throw\
    \ an exception. There are calling method will take care of the encounter error.\n\
    * With exception handling, differentiating and organising different types of errors\
    \ when separate blocks of code are used. The `try-catch` blocks can be used for\
    \ it.\n\nHere we will look at a few exception examples.\n\n#### Example:\n\n```java\n\
    class Division {\npublic static void main(String args[]) {\nint a, b, result;\n\
    Scanner input = new Scanner(System.in);\nSystem.out.println(\"Input two integers\"\
    );\na = input.nextInt();\nb = input.nextInt();\n// try block\ntry {\n  result\
    \ = a / b;\n  System.out.println(\"Result = \" + result);\n}\n// catch block\n\
    catch (ArithmeticException e) {\n  System.out.println(\"Exception caught: Division\
    \ by zero.\");\n}\n}\n}\n```\n"
