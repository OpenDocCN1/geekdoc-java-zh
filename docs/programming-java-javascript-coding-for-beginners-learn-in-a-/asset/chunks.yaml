  trans: "\n\n在编写 `Java` 时，你会发现存在许多预定义的类。所有这些类都可以在 Java 程序中使用，从而让用户无需重复造轮子。但为了能够使用这些类，你至少应该对需要使用什么以及在哪里找到它们具备基础的知识。这些被称为\
    \ Java API。该库无非是一堆巨大的、预定义的类集合，这些类可以在程序的任何地方使用。它们包含了预定义的代码，用户只需要知道如何使用它们即可。这些库避免了用户编写长长的代码。这也被称为\
    \ `Java 标准代码库`。在 `Java` 平台中，`Java 标准代码库` 主要有三个用途。它们是：\n\n- 就像其他代码库一样，Java 库为程序员提供了一系列实用的工具。这些工具包括正则表达式处理、容器类等。\n\
    - 标准代码库为用户提供了抽象接口，用户可以通过接口独立地执行任务。通过这种方式，用户无需为文件访问和网络访问等复杂过程编写完整的代码。\n- 某些底层平台不支持所有的\
    \ Java 应用程序。在这种情况下，你可以使用 Java 库来模拟这些功能，或者使用它来提供一种检查特定功能是否存在的方法。\n\n### Java 标准代码库的实现与配置\n\
    \n标准库中的大部分代码是用 `Java` 编写的。直接访问操作系统或硬件所需的代码除外。在这些情况下，使用 `Java native interface`（Java\
    \ 原生接口）来访问操作系统的 API。几乎所有的 Java 代码库都存储在一个名为 `rt.jar` 的单一归文件中。该文件由 `JDK` 和 `JRE`\
    \ 分发。Java 类库可以在引导类路径（bootstrap class path）中找到。\n\n### Java 类库的主要特征。\n\n我们使用类来访问\
    \ Java 类库的功能。这些类属于包（packages）。下面是 Java 类库的一些主要特征：\n\n- `java.lang` 包含了所有的基础接口和类。它们与运行时系统和语言紧密相关。\n\
    - 有一个专门用于数学运算的包，其中包含了数学表达式、求值和任意精度小数。它们都存在于 `java.math` 库中。\n- 工具与集合：Java 为用户提供了内置的工具类和数据结构。这些工具类和数据结构可以用于数据压缩、博客、并发和正则表达式。\n\
    - 2D 图形和图形用户界面：用户可以使用 `AWT` 包，该包提供了图形用户界面操作。该包绑定到原生系统。你可以用它来设计平台无关的工具包以及可插的外观和外观（feel\
    \ and look）。该包还可以处理可编辑和不可编辑的文本组件。\n- 音频：此包为用户提供了类和接口，可用于音频数据的写入、读取、合成和序列化。\n-\
    \ 文本：`java.text` 接口用于处理文本、数字、消息和日期。\n- 数据库：用户可以使用 `java.SQL` 库访问数据库 (`sql`）。\n\
    - `Java.Security` 提供安全保障以及加密服务。`javax.crypto` 库中存在加密服务。\n- Java 还允许你访问脚本引擎。你可以使用\
    \ `javax.script` 包使用任何符合标准的脚本语言。\n- Applets（小程序）：`Java.applet` 包允许你通过网络下载应用程序，并允许你在受保护的沙箱中运行它们。\n\
    \n# 第 2 章：面向对象编程\n\nJava 的语法与 `C` 相似，但编程哲学源自 `C++` —— 即：，java 是一种面向对象的语言。\n\n\
    在我们看到的第一个示例中，我们有一个类声明，并说明 `main()` 函数负责程序中执行的内容，嗯，这并没有让 java 变成一种 OOP 语言，让我们看一个示例来更好地理解\
    \ OOP —— 对象和类。\n\n## 过程化方法\n\n这并不简单，因为之前的形状是确定的，动画代码可以假设一个中心点并旋转形状；而对于像 `amoeba`（变形虫）这样不规则的形状，无法使用与其他形状相同的代码旋转，API\
    \ 需要更多的参数来定义形状应该旋转的坐标。\n\n## 面向对象方法\n\n因此，你可以为每个形状编写一个类文件，这样通过简单的添加新类就可以添加 `amoeba`\
    \ 或修改 `rotate` 方法，而不会扰动现有代码。你只需要测试新类。引入的任何新问题都可以轻松追溯到新做的更改。\n\n示例 1：\n```java\n\
    class Movie{\n    //变量声明\n    //方法\n} m1; // m1 是类型为“Movie”的的对象\n\n\n示例 2：\n```java\n\
    class Movie{\n    //变量声明\n    //方法\n}\n\nclass TestMovie{\n    public static void\
    \ main(String[] args){\n        Movie m1 = new Movie(); // m1 是类型为“Movie”的对象\n\
    \        m1.variable = value;\n        m1.method();\n    }\n}\n```\n\n# 第 3 章：变量声明与数据类型\n\
    \n下一个最重要且基础的要学习的概念是用于创建有用程序的“变量”和“数据类型”。变量本质上是命名的内存位置，用于存储值。Java 是一种强类型语言，因此类型为“x”的变量只能持有类型为“x”的值。\n\
    \n例如：\n```java\nint n;\n```\n在这里声明变量 `n` 用于存储类型为 `int` 的值。声明变量类型确保了 Java 的“类型安全”特性。\n\
    \nJava 中的变量可以是：\n- 局部变量（基本数据类型如 `int`, `float`, `double`, `Boolean` 等\n- 引用变量（类的实例）\n\
    \n假设你声明了一个类型为 `int` 的变量，可以使用它来节省短型值。如果不这样做，可能会发生溢出。\n\n此外注意，Java 默认认为带有小数点的数字是\
    \ `double`，因此在给定的数字后面附加“f”使其变为浮点型是重要的。\n```java\nfloat f = 1.56f;\n```\n\n变量命名的规则：\n\
    - 不要使用保留字作为变量名。\n- 变量名不能以数字开头。\n\n应该知道的一些 Java 关键字：\n(images/0002.jpeg)\n\n##\
    \ 字符串\n\n`String` 被声明为一个类。字符串上常用的操作有：\n```java\nString str = “Hello World”; //声明\n\
    int len = str.length(); // 获取字符串的长度\nint len = “hello Wolrd”.length(); // 也获取字符串的长度\n\
    String concatStr = “hello”+”world”; // +运算符可以重载以执行两个字符串的拼接。\nString str1 = “Heloo”;\n\
    String str2 = “World”;\nif (str1 == str2) //比较两个字符串\n    System.out.println(“strings\
    \ are equal”);\n```\n\n## 引用变量\n\n```\nMovie m1 = new Movie()\n```\n左侧是声明，指令 为引用变量保留空间以到达实际对象。\n\
    ```java\nint[] n; //声明一个整数数组\nn = new int[5]; //创建一个包含 5 个整数的数组\n```\n注意，即使是基本数据类型值的数组，数组也变成了一个对象。\n\
    ```java\nMovie[] mArray; //声明一个类型为“Movie”的对象数组\n```\n大小：引用变量没有像基本类型那预定义的大小。\n\n\
    ### 等于操作\n\n我们知道比较运算符如 `==` 和 `!=` 可以用于基本类型操作，但为了对对象执行比较操作，不能使用默认运算符，相反 Java 提供了关键字\
    \ `equals`。\n\n Array List\n\n"
- fmt: "\nThis is available in the `java.util.ArrayList` package.\n\n`ArrayList<String>\
    \ myList = new ArrayList<String>();`\n\nIt allows the declaration of an array\
    \ with different data types. It offers multiple methods to perform common array\
    \ operations like `add(elem)` `remove(index)` to add/remove elements from the\
    \ `arrayList`. Also API’s like `size()` to find the length of array, to find if\
    \ `isEmpty()` or if the `arrayList` `contains()` a given element.\n\nLet’s see\
    \ an example using the concepts learned so far,\n\n```java\nClass MyProgram{\n\
    \n    public static void main(Strings[] args)\n    {\n        //declare and assign\
    \ variables\n        int  num = 10;  \n        float fNum = 10.5;\n        //print\
    \ statements to output consoles\n        System.out.println(“The value of integer\
    \ num is : ”+num);\n        System.out.println(“The Value of integer fNum is :\
    \ ”+fNum);\n        num = num/2;\n        fNum = fNum+num;\n        System.out.println(“The\
    \ value of integer num after operation is : ”+num);\n        System.out.println(“The\
    \ Value of integer fNum after operation is : ”+fNum);\n    }\n}\n```\n\nOutput:\n\
    The value of integer num is : 10\nThe value of integer fNum is : 10.5\nThe value\
    \ of integer num after operation is : 5\nThe value of integer fNum after operation\
    \ is  : 20.5\n\nYou just have to use `+` operator in the SoP (`System.out.println`)\
    \ statement.\n\n## Wrapper Classes\n\nAs we know, Java is an object oriented programming\
    \ language and everything in Java can be viewed as an object. Anything from simple\
    \ files, images, an address of a system, etc. can all be considered as objects\
    \ in Java. We can change the date of type of an object using the wrapper classes.\
    \ In this tutorial we will look into the wrapper classes and their details. Using\
    \ Wrapper classes, you can convert any given data type into an object.\n\nAll\
    \ the primitive datatypes in Java are not objects. These primitive data types\
    \ don't belong to any class. These are defined in the Java language itself. We\
    \ may encounter situations where we will have two changes these primitive data\
    \ types into objects. What example, you can add a data type to vector or a stack\
    \ by converting it into an object. The Java design introduced wrapper classes\
    \ for making these conversions.\n\n### About wrapper classes\n\nAs the name suggests,\
    \ wrapper classes enclose (wrap) around any data type to give it an appearance\
    \ of an object and it can be used whenever the data type is needed. This is a\
    \ process that can be reversed. Wrapper classes can not only change the data types\
    \ into classes but also can un-wrap the object and return back the data type.\
    \ This is just like chocolate wrapper on the chocolate. The manufacturer wraps\
    \ the chocolate in the wrapper and ships it. The use of removes the wrapper for\
    \ having the chocolate.\n\nIt is have look at the following conversion where the\
    \ `int` datatype is converted into an object.\n\n```java\nint k = 100;\nInteger\
    \ it1 = new Integer (k);\n```\n\nIn the above example, the `int` data type `k`,\
    \ using wrapper classes, is converted into an object `it1`. This is done by using\
    \ the `integer` class. And whenever `K` is required, the object `it1` can be used.\n\
    \nThe following code shows you how to wrap the object and get the int datatype\
    \ from the integer object `it1`.\n\n```java\nint m = it1.intValue();\nSystem.out.println(m*m);\
    \ // prints 10000\n```\n\n### List of Wrapper classes\n\nIn the Java language,\
    \ there are 8 data types present and for each of them have their own wrapper classes.\n\
    \n| Primitive data type | Wrapper class |\n| :--- | :--- |\n| byte | Byte |\n\
    | short | Short |\n| int | Integer |\n| long | Long |\n| float | Float |\n| double\
    \ | Double |\n| char | Character |\n| Boolean | Boolean |\n\nAll the wrapper classes\
    \ can be found in the `java.lang` package. They are placed there so that they\
    \ can be made available implicitly to the programmer whenever imported. To avoid\
    \ inheritance, the Java designers made these wrapper classes as `final`.\n\n###\
    \ Importance of Wrapper classes\n\nWe use wrapper classes for serving two purposes:\n\
    \n- For converting simple data types into objects. This is done by giving the\
    \ object form to a given data type.\n- For converting the strings into data types.\
    \ For this type of conversion we use the methods like `parseXXX()`.\n\nHere there\
    \ is an example program showing the conversion of a datatype to an object and\
    \ also retrieving the data type from the same time.\n\n```java\npublic class WrappingUnwrapping\n\
    {\n    public static void main(String args[])\n    {\n        //  data types\n\
    \        byte grade = 2;\n        int marks = 50;\n        float price = 8.6f;\
    \ // observe suffix f for float\n        double rate = 0.5; // data types to objects\
    \ \n        Byte g1 = new Byte(grade); // wrapping\n        Integer m1 = new Integer(marks);\n\
    \        Float f1 = new Float(price);\n        Double r1 = new Double(rate);\n\
    \n        // let us print the values from objects\n        System.out.println(\"\
    Values of Wrapper objects (printing as objects)\");\n        System.out.println(\"\
    Byte object g1: \" + g1);\n        System.out.println(\"Integer object m1: \"\
