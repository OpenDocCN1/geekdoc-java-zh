    ### Type casting by object reference


    In Java, you can type the cost of an object reference into a different object
    reference. This is called as type casting. Typecasting is not limited to the class
    itself. Enjoy how you can type test one of your superclass or subclass types or
    interfaces. For type casting there are both compile time and runtime rules. When
    typecasting for a given type object, reference of any object can be assigned.
    This is because the object class that we use is the superclass of every class
    in Java. There are two types of typecasting. They are


    *   Upcasting


    *   Down casting


    Typecasting can be done implicitly or explicitly. It will be an implicit type
    casting if the casting is done from a lower data structure to a higher data structure.
    . Java does not perform down casting on its own. Down testing should only be done
    explicitly by the user. Type Casting from a higher data structure to know data
    structure should be done carefully as it involves lots of data if it is made forcibly.
    The Java virtual machine performs upcasting when needed. For example if there
    are a few data types of which only one of them is a higher data type, the JVM
    will cast all the other seven lower data types to the higher data type. Performing
    down casting on the case as above will result in the loss of data in the higher
    data type object. During the run time, there may arise a situation called as the
    ClassCastException, where the object on which type casting is being cast is not
    compatible with the other type with which it is being cast to. Here is an example
    explaining the ClassCastException.


    Example:


    //X is a supper class of Y and Z which are siblings.


    public class RunTimeCastDemo {


                  public static void main(String args[]) {


                                X x = new X();


                                Y y = new Y();


                                Z z = new Z();


                                X xy = new Y(); // compiles ok (up the hierarchy)


                                X xz = new Z(); // compiles ok (up the hierarchy)


                                //                            Y yz = new Z();   incompatible
    type (siblings)


                                //                            Y y1 = new X();   X
    is not a Y


                                //                            Z z1 = new X();   X
    is not a Z


                                X x1 = y; // compiles ok (y is subclass of X)


                                X x2 = z; // compiles ok (z is subclass of X)


                                Y y1 = (Y) x; // compiles ok but produces runtime
    error


                                Z z1 = (Z) x; // compiles ok but produces runtime
    error


                                Y y2 = (Y) x1; // compiles and runs ok (x1 is type
    Y)


                                Z z2 = (Z) x2; // compiles and runs ok (x2 is type
    Z)


                                //                            Y y3 = (Y) z;     inconvertible
    types (siblings)


                                //                            Z z3 = (Z) y;     inconvertible
    types (siblings)


                                Object o = z;


                                Object o1 = (Y) o; // compiles ok but produces runtime
    error


                  }


    }


