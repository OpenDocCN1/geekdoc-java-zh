    输出:\n111 David\n111 David\n\n### Java 中的垃圾回收\n\nJava 中的“垃圾”可以定义为 Java 中未被引用的对象。回收未使用的内存的过程称为垃圾回收。简单来说，垃圾回收意味着销毁所有不再使用的对象。与\
    \ C 和 C++ 不同，垃圾回收在 Java 中是一个自动过程。这就是 Java 为用户提供更好、更高效内存管理的原因之一。\n\n垃圾回收的优点：\n\n\
    *   垃圾回收通过移除所有未被引用的对象来提高内存效率。这些对象占用堆内存，而垃圾回收会清理这些内存。\n*   用户不需要手动执行垃圾回收，因为 Java\
