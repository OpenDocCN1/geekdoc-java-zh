    ,25);\n    s1.display();\n    s2.display();\n    }\n}\n```\n\nOutput:\n111 David\
    \ 0\n222 Aryan 25\n\n### Copy constructor in Java\n\nThough we call it a copy\
    \ constructor, there is no such thing in Java. If you wish to copy the values\
