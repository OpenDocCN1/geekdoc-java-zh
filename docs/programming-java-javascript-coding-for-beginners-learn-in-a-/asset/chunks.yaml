    \ Java 中所有类的父类。类型转换有两种：\n\n*   向上转型 (Upcasting)\n*   向下转型 (Down casting)\n\n类型转换可以隐式或显式地进行。从低级数据结构转换为高级数据结构，则是隐式转换。Java\
