  raw: 'When working with Java, you can see that there are a number of predefined
    classes present. All these classes can be used within the Java program leaving
    the user the task of reinventing the wheel. But for making use of these classes,
    you should have some minimum knowledge of what you need to use and where to find
    it. These are called as the Java APIs. The library is nothing but a huge pile
    of predefined classes that can be used anywhere within the program. They contain
    predefined code and all the user needs to know is how to use it. These libraries
    believe the user from typing long lines of code. This is also called as the Java
    standard code library. Within the Java platform, the Java standard code library
    serves three main purposes. They are


    *   Just like other code library is the Java libraries facilitate the programmer
    with a set of useful facilities. These facilities include regular expression processing,
    container classes etc.


    *   The standard code library provides the user with abstract interfaces with
    which he can execute tasks independently. With this the user need not write the
    complete code for complex processes like file access and network access.


    *   There are a few underlying platforms that do not support all of the Java applications.
    In such cases you can use the Java library to emulate those features or you can
    use it to provide a way by which you can check for specific features presence.


    Implementation and configuration of the Java standard code library.


    Most of the code in the standard library is written in Java. The code, which is
    needed for the direct access of the operating system or the hardware are exceptions.
    The Java native interface wrappers are used in such cases for accessing the APIs
    of the operating system. Almost all of the Java code libraries are stored in a
    single archive called as the "rt.jar". This file is distributed by the JDK and
    the JRE distributions. The Java class library can be found in the bootstrap class
    path.


    Main features of the Java class Library.


    We use classes to access the Java class library features. These come under packages.
    Some of the main features of the Java class library are given below.


    *   java.lang has all the fundamental interfaces and classes. They are closely
    tied to the runtime system and the language.


    *   There is a special package for mathematical operations which includes mathematical
    expressions, evaluations and arbitrary precision decimal numbers. They are all
    present in the java.math library.


    *   Utilities and collections: Java provides the user with its built-in Utility
    classes and data structures. These utility classes and data structures can be
    used for data compression, blogging, concurrency and regular expressions.


    *   2D graphics and graphical user interface: The users can use the AWT package
    which provides the graphical user interface operations. This package binds to
    the native system. You can use this for designing platform independent toolkits
    and also pluggable feel and look. This package can also be used for dealing text
    components that are editable and non-editable.


    *   Sound: this package provides the user with classes and interfaces that can
    be used for writing, reading, synthesising and sequencing of sound data.


    *   Text: The java.text interface is used for dealing with text, numbers, messages
    and dates.


    *   Databases: user can access the database (sql) using the java.SQL library.


    *   The Java.Security provides security along with encryption services. There
    is encryption services are present in the javax.crypto library.


    *   Java also enables you to access scripting engines. You can use any conforming
    scripting language using the javax.script package.


    *   Applets: the Java.applet package allows you to download applications using
    the network and allows you to run them in a guarded sandbox.


    # Chapter 2: Object Oriented Programming


    Java has its syntaxes similar to C while programming philosophy from C++ - that
    is, java is an object-oriented language. 


    In the first example that we saw, we had a class declaration and said that the
    main() function takes care what gets done in our program, well, that doesn’t make
    java a OOP language, let’s see an example of to understand OOP -  objects and
    classes better.


    ## Procedural Approach


    It is not that simple, because the previous shapes were definite and animation
    code could have assumed a center point and rotated the shape, while in case of
    an indefinite shape like amoeba, it’ll not rotate using the code for other shapes,
    instead the API needs to take couple of more arguments to define the co-ordinates
    on which the shape should rotate.


    ## Object Oriented Approach


    So you can write one class file each for the shapes, so adding amoeba or modifying
    to rotate method is done without disturbing existing code, by simple adding a
    new class. You need to test only the new class. Any new issue introduced can be
    easily tracked to the new changes made.


    Example 1:


    class  Movie{


        //variable Declaration


        //methods


    }m1;   //m1 is an object of class type “Movie”


                                               Example 2:


    class Movie{


         //variable Declaration


    //methods


    }


    class  TestMovie{


    public static void main(String[] args){


    Movie m1 = new Movie();  // m1 is an object of type “Movie”


    m1.variable = value;


    m1.method();


    }


    }


    # Chapter 3: Variable Declaration & Data Types


    The next most important and fundamental concept to learn is about “variables”
    and “data types” to create useful programs. Variables are basically named memory
    location, which are used to hold values. Java is a strongly typed language, so
    the variable of type “x” can hold a value of type “x” only.


    For example:


              int  n;


    Here a variable “n” is declared to hold value of type “int”. Declaring variable
    type ensure “type-safety” feature of java which in turn contributes to “security”.


    Variables in java can be either


    *   Local Variables (primitive data types like int, float, double, Boolean etc.)


    *   Reference Variables (objects – user defined instances of class)


    Assume that you declared a variable of type int, you can probably use it to save
    a short value. If done otherwise, it’ll overflow.


    Also note that java thinks anything with decimal point is by default a “double”,
    therefore it’s important to append an “f” at the end of a given decimal number
    to make it a double.


    float f = 1.56f;


    Rules for declaring variable names:


    *   Do not use any predefined reserved words as variable names.


    *   Variable names cannot start with a number.


    Some popular Java keywords that one should know:


    ![](images/00002.jpeg)


    ## Strings


    String is declared as a class. Some of the commonly used operations on string
    are:


    String str =  “Hello World”;  //declaration


    int len = str.length() ; // Givesthe length of the string


    int len = “hello Wolrd”.length(); // also gives length of the string


    String concatStr = “hello”+”world”; // the + operator can be overloaded to perform
    concatenation of two strings.


    String str1 = “Heloo”;


    String str2 = “World”;


    if (str1 == str2)  //compare two strings


        System.out.println(“strings are equal”);


    ## Reference Variable


    Movie m1 = new Movie()


    To the left is the declaration,which instructs the JVM to reserve space for the
    reference variable which holds the data to reach the actual object.


                  int[] n;  // declare an array of integers


                  n = new int[5];   //creates an array of 5 integers


    Note that even if it’s an array of primitive data type values, an array becomes
    an object.


                  Movie[] mArray; // declarean array of objects oftype “Movie”


    Size: There is no predefined size for reference variables like primitive types.


    Equals Operation


    We know that comparison operators like == and != can be used on primitive operators,
    but in order to perform comparison operation on objects, one cannot use the default
    operators, instead java provides keywords “equals”.


