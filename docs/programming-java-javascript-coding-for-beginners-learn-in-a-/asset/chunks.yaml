    Double object r1: \" + r1);\n\n        // objects to data types (retrieving data\
    \ types from objects)\n        byte bv = g1.byteValue();\n        int iv = m1.intValue();\n\
    \        float fv = f1.floatValue();\n        double dv = r1.doubleValue();\n\n\
    \        // let us print the values from data types\n        System.out.println(\"\
    Unwrapped values (printing as data types)\");\n        System.out.println(\"byte\
    \ value, bv: \" + bv);\n        System.out.println(\"int value, iv: \" + iv);\n\
    \        System.out.println(\"float value, fv: \" + fv);\n        System.out.println(\"\
    double value, dv: \" + dv);\n    }\n}\n```\n\n# Chapter 4: Control Statements\n\
    \nThe control statements in a program, as the name itself suggests, control the\
    \ general flow of every program. It includes conditional statements like if else,\
    \ or iteration statements like `while()`, `do while()` etc.\n\n![](images/00003.jpeg)\n\
    \n### If else\n\nSyntax :\n```java\nif(condition)\n    do action1;\nelse\n   \
    \ do action2;\n```\nAn action is taken when the `condition` is true, or else the\
    \ action in the `else` part is taken.\n\n### Switch case\n\nThis operation comes\
    \ in handy if you had to check for multiple conditions. Switch case takes action\
    \ based on a given value.\n\nSyntax :\n```java\nSwitch(id)\n{\n    Case id1:\n\
    \        Action;\n        Break;\n    Case id2:\n        Action;\n        Break;\n\
    \    Default:\n        ….\n}\n```\n\n### While ()\n\nThis is an iteration statement,\
    \ which performs action as long as the condition is true.\n\nSyntax:\n```java\n\
    while(condition)\n{\n    Do something while condition is true;\n}\n```\n\n###\
    \ Do - while ()\n\nThis too is an iteration operation, quite similar to the `while()`\
    \ loop, the difference being that the loop will execute at least once irrespective\
    \ of the validity of the condition, because the condition is evaluated only after\
    \ the `do` statement.\n\nSyntax\n```java\ndo{\n    do Something;\n}while(condition);\n\
    ```\n\n### For loop\n\nSyntax: `for ( initialization ;condition; counter updation)`\n\
    \nExample : `for (int i=0; i<5; i++)`\n\nThis will now execute the statement for\
    \ exactly 5 times. The first part declares and initializes a value to the counter\
    \ variable, the second part checks the condition, if true, it enters loop. On\
    \ completion of loop, it performs the increment. Then it again checks the condition\
    \ and continues the same steps until the condition turns false. Once the condition\
    \ is false, it exits out of the loop.\n"
