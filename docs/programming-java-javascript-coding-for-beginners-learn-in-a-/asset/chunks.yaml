  trans: "\n\n在编译时检查的异常被称为受检异常（checked exceptions）。在这种情况下，如果一个方法抛出了受检异常，它应该通过使用 `try-catch`\
    \ 块进行处理，或者使用 `throws` 关键字对其进行声明。如果没有遵循上述任何方法，编译器将给出编译错误。由于这些异常在编译时就会进行检查，因此它们被称为受检异常。这里有一个示例可以帮助你理解受检异常。\n\
    \n在这个示例中有一个文件 `myfile.txt`。数据将从该文件中读取并显示在屏幕上。该程序中有三个受检异常，下文会有。\n\n### 示例：\n\n\
    ```java\nimport java.io.*;\n\nclass Example {  \n\n  public static void main(String\
    \ args[])\n  {\n      FileInputStream fis = null;\n      /*此构造函数 FileInputStream(File\
    \ filename)\n           * 会抛出 FileNotFoundException，这是一个\n           * 受检异常*/\n\
    \      fis = new FileInputStream(\"B:/myfile.txt\");\n      int k;\n      /*FileInputStream\
    \ 类的 read() 方法也会抛出\n           * 受检异常：IOException*/\n      while(( k = fis.read()\
    \ ) != -1)\n      {\n          System.out.print((char)k);\n      }\n      /*close()\
    \ 方法关闭文件输入流\n           * 它抛出 IOException*/\n      fis.close();            \n\
    \  }\n}\n```\n\n#### 输出：\n\n```\nException in thread \"main\" java.lang.Error:\
    \ Unresolved compilation problems:\nUnhandled exception type FileNotFoundException\n\
    Unhandled exception type IOException\nUnhandled exception type IOException\n```\n\
    \n在上面的示例中，检查和异常在编译器在编译时进行了检查，由于我们没有声明这些异常，程序显示了编译错误信息。\n\n下面是另外几个受检异常：\n\n* `SQLException`\n\
    * `IOException`\n* `DataAccessException`\n* `ClassNotFoundException`\n* `InvocationTargetException`\n\
    \n### 非受检异常 (Unchecked exceptions)\n\n非受检异常本质是在编译时不进行检查的异常。这些异常不会产生编译错误，因为它们在编译时无法被检查。无论你是否声明了异常。非受检异常通常由于用户在与程序交互期间提供的数据。处理这些异常的唯一方法是预见到它们并为该异常编写适当的处理器。`RuntimeException`\
    \ 类是所有非受检异常的父类。这里有一个示例可以帮助你更好地理解非受检异常。\n\n```java\nclass Example {  \n\n  public\
    \ static void main(String args[])\n  {\n      int num1=10;\n      int num2=0;\n\
    \      /*由于我正在用 0 除以一个整数\n         * 它应该抛出 ArithmeticException*/\n      int res=num1/num2;\n\
    \      System.out.println(res);\n  }\n}\n```\n\n如果你编译上面的代码，你会发现编译将是成功的，但是如果你运行它，程序将抛出一个名为\
    \ `ArithmeticException` 的异常。通过此，你知道受检异常不在编译时抛出错误，而是在运行时。这里是另一个示例。\n\n#### 示例：\n\
    \n```java\nclass Example { \npublic static main(String args[])\n{\n      int arr[]\
    \ ={1,2,3,4,5};\n      /*数组只有 5 个元素，但\n         * 我正尝试显示\n         * 8 个元素的值。它应该抛出\n\
    \         * ArrayIndexOutOfBoundsException*/\n      System.out.println(arr[7]);\n\
    }\n```\n\n在这个示例中，和上一个一样，将不会有编译错误。然而，这段代码在运行时会抛出一个非受检异常 `ArrayIndexOutOfBoundsException`。这些异常在编译时无法发现，并不意味着它们没有被编译器注意到。在上面的示例中，添加一条建议用户提供范围内的值的消息是明智的。添加该消息后的代码如下：\n\
    \n```java\nclass Example { \n     public static void main(String args[])\n   \
    \  {\n      try{\n          int arr[] ={1,2,3,4,5};\n          System.out.println(arr[7]);\n\
    \      }catch(ArrayIndexOutOfBoundsException e){\n          System.out.println(\"\
    指定的索引不存在于 \" + \"数组。请纠正错误。\");\n      }\n  }\n}\n```\n\n以下是一些在运行时常见的非受检异常：\n\n\
    * `NullPointerException`\n* `ArrayIndexOutOfBoundsException`\n* `ArithmeticException`\n\
    * `IllegalArgumentException`\n\n### 异常 (Exception) 与错误 (Error) 之间的区别：\n\n**异常：**\
    \ 异常发生在代码内部，可以由开发者进行处理。当异常发生时，开发者可以采取必要的行动。下面是一些异常的示例：\n\n* `DivideByZeroException`\n\
    * `NullPointerException`\n* `ArithmeticException`\n* `ArrayIndexOutOfBoundsException`\n\
    \n**错误：** 错误与异常不同。它们是系统尝试不处理的异常状况。当错误发生时，表示系统遇到了严重问题。它们定义了程序在通常情况下无法解决的问题。这里是一些错误的示例：\n\
    \n* `Hardware error`\n* `Memory error`\n* `JVM error`\n\n### 异常处理 (Exception Handling)\n\
    \n异常处理是一种强大的机制，用它可以处理运行时错误。异常处理确保程序的正常流程得以维持。\n\n异常处理的几个优点：\n\n* 如果程序中编写了异常处理，异常处理将允许用户控制程序的执行流。\n\
    * 每当发生错误时，它都会抛出一个异常。调用方法将处理遇到的错误。\n* 通过异常处理，当使用不同的代码块时，可以区分并组织不同类型的错误。可以使用 `try-catch`\
    \ 块来实现。\n\n在这里我们将查看几个异常示例。\n\n#### 示例：\n\n```java\nclass Division {\npublic static\
    \ void main(String args[]) {\nint a, b, result;\nScanner input = new Scanner(System.in);\n\
    System.out.println(\"Input two integers\");\na = input.nextInt();\nb = input.nextInt();\n\
    // try block\ntry {\n  result = a / b;\n  System.out.println(\"Result = \" + result);\n\
    }\n// catch block\ncatch (ArithmeticException e) {\n  System.out.println(\"Exception\
    \ caught: Division by zero.\");\n}\n}\n}\n```\n\n"
- fmt: "\nThe only thing similar in Java and JavaScript is their similar sounding\
    \ names. Rest, the languages are completely different with regard to their functions\
    \ and concepts. What makes JavaScript stand out from the object oriented programming\
    \ languages like Java and `C++` is that its objects can be created or modified\
    \ during the run time. For doing this, Methods and properties are added to the\
    \ empty objects. An object once created can be used like a prototype in the process\
    \ of creating other similar objects. Variable parameter lists, source-code recovery,\
    \ dynamic script creation, dynamic object creation function variables etc are\
    \ the dynamic capabilities that JavaScript has.\n\n# Basics of JavaScript\n\n\
    ## Storing data in JavaScript\n\n- **Local Storage**: The local storage is used\
    \ to permanently store the data. With this, the data on that page can be accessed\
    \ anytime. The local storage doesn’t have an expiration date. One can use local\
    \ storage if they want their data to be reused again and again over the period\
    \ of time.\n- **Session Storage**: The session storage is not like local storage\
    \ as it only holds the data for a single session and disposes off the data once\
    \ the user closes the page. This kind of storage is used on web pages used for\
    \ booking tickets etc.\n\n### Storing Data using Variable Data and Constant Data\n\
    \nThe Variables and Constants store the data and values used in JavaScript. They\
    \ both have their own importance in JavaScript. All the data stored cannot be\
    \ made constant. Processes like time countdown use the variables and the Constants\
    \ are used for non-changing data.\n\n- **Variable Data**: As the name suggests,\
    \ this type of data that changes its value over time is called the Variable Data.\
    \ This type of data is widely used in JavaScript. Variables are dynamic in nature.\n\
    - **Constant Data**: The Constant data is something that never changes its value.\
    \ This data will be constant through time. This type of data is static. We use\
    \ this type of data for data which is which cannot be modified.\n\n## Creating\
    \ Variables and Constants\n\n### Declaring a Variable\n\nA variable is declared\
    \ by preceding the name by the `var` keyword. For example if you want to declare\
    \ `group` a variable, just add the `var` keyword before `group`. Every variable\
    \ should end with a `;` (semicolon). This makes the statement a self-containing.\
    \ Care should be taken while using the words because JavaScript is case sensitive.\
    \ For this the letters are to be used in the exact same declaration as in the\
    \ original.\n\nEg: `var Dell;`\n\nThe object `Dell` above is declared as a variable.\n\
    \n### Declaring a Constant\n\nThe keyword `const` is used before the name is to\
    \ make it a constant. This declaration is just like declaring a constant.\n\n\
    Eg: `const Book;`\n\nThe `Book` is made a constant in the above example.\n\n##\
    \ Decision making in JavaScript\n\nThere always rises a situation where we have\
    \ to select one of the two paths that are before him. Then we are able to implement\
    \ the conditional statements like `if` and `else`.\n\nThe `if` and `else` statements\
    \ can be used for decision-making. This will allow the program to choose the correct\
    \ path.\n\nThe following conditional statements are supported by JavaScript:\n\
    1. `if` statement\n2. `if...else` statement\n3. `if...else if...` statement\n\n\
    **if statement**: The `if` is the fundamental statement used to make decisions.\
    \ There a condition is added to the `if` statement and a set of statements can\
    \ be given if the given condition holds true.\n\nSYNTAX:\n```javascript\nif(condition){\n\
    statements to be executed\n}\n```\n\nEXAMPLE:\n```javascript\n<script type=\"\
    text/javascript\">\n<!--\nvar age = 20;\nif( age > 18 ){\n  document.write(\"\
    <b>Allowed inside the pub.</b>\");\n}\n//-->\n</script>\n```\nOUTPUT: Allowed\
    \ inside the pub. (if a no. above 18 is given)\n\n**if else statement**: This\
    \ is like an extension of the `if` statement. The system runs the code and executes\
    \ the statements in the `else` block if the `if` statement holds false.\n\nSYNTAX:\n\
    ```javascript\nif(condition)\n{statements}\nelse{statements}\n```\n\nEXAMPLE:\n\
    ```javascript\n<script type=\"text/javascript\">\n<!--\nvar age = 15;\nif( age\
    \ > 18 ){\n  document.write(\"<b>Allowed inside the pub</b>\");\n}else{\n  document.write(\"\
    <b>Is not allowed.</b>\");\n}\n//-->\n</script>\n```\nOUTPUT:\nAllowed inside\
    \ the pub (if a number above 18 is given)\nNot allowed (if a number below 18 is\
    \ given)\n\n**if else if**: This is like adding another step to the `if else`\
    \ statement. this is used when a series of conditions are used.\n\nSYNTAX:\n```javascript\n\
    if(condition){statements};\nelse if(condition){statements}\nelse if(condition){statements}\n\
    else{statements}\n```\n\nEXAMPLE:\n```javascript\n<script type=\"text/javascript\"\
    >\n<!--\nvar book = \"JAVASCRIPT\";\nif( book == \"JAVA\" ){\n  document.write(\"\
    <b>JAVA Book</b>\");\n}else if( book == \"JAVASCRIPT\" ){\n  document.write(\"\
    <b>JAVASCRIPT Book</b>\");\n}else if( book == \"DBMS\" ){\n  document.write(\"\
    <b>DBMS Book</b>\");\n}else{\n  document.write(\"<b>UNKNOWN Book</b>\");\n}\n\
    //-->\n</script>\n```\nOUTPUT: JAVASCRIPT book\n\n**The nested if**\n\nThe `nested\
    \ if` is an `if` statement inside another `if` statement.\n\nSYNTAX:\n```javascript\n\
    if(condition) {\n  if(condition){statement} \n}\n```\n\n**The switch and break\
    \ statements**:\n\nIn the `switch` statement there will be an expression followed\
    \ by several different statements. The statements will be executed basing on the\
    \ expression’s value selected.\n\nSYNTAX:\n```javascript\nswitch (expression)\n\
    {\n  case condition 1: statement(s)\n    break;\n  case condition 2: statement(s)\n\
    \    break;\n  ...\n  case condition n: statement(s)\n    break;\n  default: statement(s)\n\
    }\n```\nThe `break` statement is used to indicate that it is the end of the switch.\n\
    \n## Looping in JavaScript\n\n**The for Loop**:\n\nThe loops are used if one wants\
    \ the same code to be repeated again and again. The `for` loop is one of three\
    \ loops that can be made use of. The `for loop` is simple and compact. It contains\
    \ the following points:\n\n1. The start statement is performed before the loop\
    \ begins.\n2. The loop is executed only when the conditions given are true. But\
    \ a test code will be executed which runs the code for once.\n3. The counter for\
    \ iterations can be increased or decreased.\n\nSYNTAX:\n```javascript\nfor (initialization;\
    \ test condition; iteration){\n  Statement(s) to be executed if test condition\
    \ is true\n}\n```\n\nEXAMPLE:\n```javascript\n<script type=\"text/javascript\"\
    >\n<!--\nvar count;\ndocument.write(\"This will repeat for 10 times\" + \"<br\
    \ />\");\nfor(count = 0; count < 10; count++){\n  document.write(\"Currently repeated\
    \ : \" + count );\n  document.write(\"<br />\");\n}\ndocument.write(\"Done!!\"\
    );\n//-->\n</script>\n```\nOUTPUT:\nThis will repeat 10 times\nCurrently repeated\
    \ : 0\nCurrently repeated : 1\nCurrently repeated : 2\nCurrently repeated : 3\n\
    Currently repeated : 4\nCurrently repeated : 5\nCurrently repeated : 6\nCurrently\
    \ repeated : 7\nCurrently repeated : 8\nCurrently repeated : 9\n\n# Chapter 11:\
    \ Functions and Events in JavaScript\n\n## What is a Function?\n\nA group of codes\
    \ which are reusable when desired are called anywhere in the program is called\
    \ a function. It reduces the time and energy for one to write the same code again\
    \ and again. This reduces code redundancy. Modular code can be written by using\
    \ the functions. A large program can be divided into many or desired number of\
    \ parts using the functions. JavaScript, like any other programming language,\
    \ supports the features that are needed for writing modular code. This is done\
    \ by using functions.\n\nFunctions like `write()` and `alert()` are the default\
    \ functions. JavaScript provides the user with many functions which can be used\
    \ right away.\n\nJavaScript also allows one to create our own custom functions.\n\
    \n### Function Definition\n\nA function should first be defined before using it.\
    \ The `function` key is a common method to define functions in JavaScript. It\
    \ should be followed by the function name that is unique and lists of parameters.\
    \ It also should contain a statement block with curly braces.\n\nSYNTAX:\n```javascript\n\
    <script type=\"text/javascript\">\n<!--\nfunction functionname(parameter-list)\n\
    {\n  statements\n}\n//-->\n</script>\n```\n"
