    \n```javascript\nfunction simplefunction()\n{\n  alert(\"This is a simple function\"\
    );\n}\n```\n\n### Calling a Function\n\nTo call a function in javascript, the\
    \ name of that function should be written as follows.\n\n```javascript\nsimplefunction();\n\
    ```\n\n### Parameters of a function\n\nIn JavaScript a function can be passed\
    \ with parameters too. Different parameters can be passed in JavaScript while\
    \ it is calling a function. Manipulation can be done by the passed parameters,\
    \ which are in a function. Comma is used to separate multiple parameters in a\
    \ function.\n\n#### Example\n\nHere in the following example, we will modify our\
    \ `simplefunction` function. Now we will make use of two parameters.\n\n```javascript\n\
    function simplefunction(name, age)\n{\n  alert( name + \" is \" + age + \" years\
    \ old.\");\n}\n```\n\nThe function can be called. And it can be called as given\
    \ below.\n\n```javascript\nsimplefunction('Zara', 7 );\n```\n\n### The return\
    \ Statement\n\nAn optional `return` statement can be added to a JavaScript function\
    \ if the user desires a return value from that function. A `return` statement\
    \ should always be the last statement of the function.\n\nFor example, the user\
    \ may pass two different numbers in a particular function and from them he can\
    \ expect the function to return the product of those two numbers in the program.\n\
    \n#### EXAMPLE\n\n```javascript\nfunction concatenate(first, last)\n{\n  var full;\n\
    \  full = first + last;\n  return full;\n}\n```\n\nNow the function can be called\
    \ as follows:\n\n```javascript\nvar result;\nresult = concatenate('Zara', 'Ali');\n\
    alert(result );\n```\n\n## Events in JavaScript\n\n#### EVENT\n\nEvents handle\
    \ the interactions between JavaScript and HTML. This is done when a page is manipulated\
    \ by the user or a browser.\n\nEverything is an event. The loading of a page is\
    \ an event. When the user selects something by clicking, that click is considered\
    \ an event too. Infact any action done by the user like closing a window, selecting\
    \ a link, pressing a key, closing a tab, resizing a window, etc. are all examples\
    \ of events.\n\nThe responses that are coded in JavaScript are executed using\
    \ these events like closing windows, text to be displayed, alerts displayed, confirmation\
    \ messages or any type of response that is possible to happen.\n\nThe events are\
    \ part of the Document Object Model (DOM) Level3. A set of events are provided\
    \ to every HTML element. Those events trigger the code in JavaScript.\n\n####\
    \ The onclick event type\n\nThis is an event, when clicked, displays desired validation\
    \ or a warning etc. This very widely used.\n\nEXAMPLE: The below code, when the\
    \ hello button on the `onclick` is clicked, it triggers the `events` function.\n\
    \n```html\n<html>\n<head>\n<script type=\"text/javascript\">\nfunction events()\
    \ {\n  alert(\"Hello World\")\n}\n</script>\n</head>\n<body>\n<input type=\"button\"\
    \ onclick=\"sayHello()\" value=\"Say Hello\" />\n</body>\n</html>\n```\n\n####\
    \ onsubmit event type\n\nThe `onsubmit` event is another important event type.\
    \ Validation occurs when submit a form here. The text will only be sent if the\
    \ function returns `true`.\n\n#### EXAMPLE\n\n```html\n<html>\n<head>\n<script\
    \ type=\"text/javascript\">\nfunction validation() {\n  all validation goes here\n\
    \  .........\nreturn either true or false\n}\n</script>\n</head>\n<body>\n<form\
    \ method=\"POST\" action=\"t.cgi\" onsubmit=\"return validate()\">\n.......\n\
    <input type=\"submit\" value=\"Submit\" />\n</form>\n</body>\n</html>\n```\n\n\
