  trans: "\n\nJava 和 JavaScript 唯一相似之处是它们的名字听起来相似。除此之外，这两种语言在功能和概念上是完全不同的。让 JavaScript\
    \ 区别于 Java 和 `C++` 等面向对象编程语言的特点是，它的对象可以在运行时创建或修改。为了实现这一点，可以向空对象添加方法和属性。一旦创建了对象，可以在创建其他相似对象的过程中作为原型使用。可变参数列表、源码恢复、动态脚本创建、动态对象创建函数变量等都是\
    \ JavaScript 拥有的动态能力。\n\n# JavaScript 基础\n\n## 在 JavaScript 中存储数据\n\n- **本地存储\
    \ (Local Storage)**：本地存储用于永久性存储数据。通过它，可以随时访问该页面上的数据。本地存储没有过期日期。如果用户希望数据在一段时间内被反复重复使用，可以使用本地存储。\n\
    - **会话存储 (Session Storage)**：会话存储与本地存储不同，因为它只保留单个会话的数据，并在用户关闭页面后丢弃数据。这种存储用于用于订票等网页上。\n\
    \n### 使用变量数据和常量数据存储数据\n\n变量（Variables）和常量（Constants）存储了 JavaScript 中使用的数据和值。它们在\
    \ JavaScript 中都有其重要性。并非所有存储的数据都可以变为常量。像时间倒计时之类的过程使用变量，而常量则用于不变的数据。\n\n- **变量数据\
    \ (Variable Data)**：顾如其，，随时间改变值的数据被称为变量数据。这种数据在 JavaScript 中被广泛使用。变量在本质上是动态的。\n\
    - **常量数据 (Constant Data)**：常量数据是指永远不会改变的值。这种数据随时间保持不变。这种数据是静态的。我们使用这类数据处理无法修改的数据。\n\
    \n## 创建变量和常量\n\n### 声明变量\n\n在名称前加上 `var` 关键字来声明变量。例如，如果你想声明 `group` 为变量，只需在 `group`\
    \ 之前添加 `var` 关键字即可。每个变量都应该以 `;`（分号）结尾。这使得语句是自包含的。在使用单词时需要小心，因为 JavaScript 是区分大小写的。因此，使用的字母必须与原始声明中的完全一致。\n\
    \n例：`var Dell;`\n\n上述对象 `Dell` 被声明为一个变量。\n\n### 声明常量\n\n在名称之前使用 `const` 关键字使其成为常量。这种声明与声明常量非常相似。\n\
    \n例：`const Book;`\n\n在上面的示例中，`Book` 被制为了常量。\n\n## JavaScript 中的决策\n\n经常会出现我们需要在面前的两个路径中选择一条的情况。这时我们能够实现如\
    \ `if` 和 `else` 等条件语句。\n\n`if` 和 `else` 语句可用于决策。这将允许程序选择正确的路径。\n\nJavaScript 支持以下条件语句：\n\
    1. `if` 语句\n2. `if...else` 语句\n3. `if...else if...` 语句\n\n**if 语句**：`if` 是用于决策的基础性语句。在\
    \ `if` 语句中添加一个条件，如果给定的条件成立，就可以给出一组语句。\n\n语法：\n```javascript\nif(condition){\n\
    \  要执行的语句\n}\n```\n\n示例：\n```javascript\n<script type=\"text/javascript\">\n<!--\n\
    var age = 20;\nif( age > 18 ){\n  document.write(\"<b>Allowed inside the pub.</b>\"\
    );\n}\n//-->\n</script>\n```\n输出：Allowed inside the pub. (如果给出大于 18 的数字)\n\n**if\
    \ else 语句**：这类似于 `if` 语句的扩展。系统运行代码，如果 `if` 语句为假，则执行 `else` 块中的语句。\n\n语法：\n```javascript\n\
    if(condition)\n{语句}\nelse{语句}\n```\n\n示例：\n```javascript\n<script type=\"text/javascript\"\
    >\n<!--\nvar age = 15;\nif( age > 18 ){\n  document.write(\"<b>Allowed inside\
    \ the pub</b>\");\n}else{\n  document.write(\"<b>Is not allowed.</b>\");\n}\n\
    //-->\n</script>\n```\n输出：\nAllowed inside the pub (如果给出大于 18 的数字)\nNot allowed\
    \ (如果给出小于 18 的数字)\n\n**if else if**：这类似于在 `if else` 语句中添加了另一个步骤。当使用一系列条件时，使用它。\n\
    \n语法：\n```javascript\nif(condition){语句};\nelse if(condition){语句}\nelse if(condition){语句}\n\
    else{语句}\n```\n\n示例：\n```javascript\n<script type=\"text/javascript\">\n<!--\n\
    var book = \"JAVASCRIPT\";\nif( book == \"JAVA\" ){\n  document.write(\"<b>JAVA\
    \ Book</b>\");\n}else if( book == \"JAVASCRIPT\" ){\n  document.write(\"<b>JAVASCRIPT\
    \ Book</b>\");\n}else if( book == \"DBMS\" ){\n  document.write(\"<b>DBMS Book</b>\"\
    );\n}else{\n  document.write(\"<b>UNKNOWN Book</b>\");\n}\n//-->\n</script>\n\
    ```\n输出：JAVASCRIPT book\n\n**嵌套 if (The nested if)**\n\n`嵌套 if` 是另一个 `if` 语句内部的\
    \ `if` 语句。\n\n语法：\n```javascript\nif(condition) {\n  if(condition){语句} \n}\n```\n\
    \n**switch 和 break 语句**\n\n`switch` 语句后面会跟多个不同的语句。根据表达式的值执行相应的语句。\n\n语法：\n```javascript\n\
    switch (表达式)\n{\n  case 条件 1: 语句\n    break;\n  case 条件 2: 语句\n    break;\n  ...\n\
    \  case 条件 n: 语句\n    break;\n  default: 语句\n}\n```\n`break` 语句用于指示 `switch` 的结束。\n\
    \n## JavaScript 中的循环\n\n**for 循环 (The for Loop)**：如果想要重复相同的代码，则使用循环。`for` 循环是三种循环之一。`for`\
    \ 循环简单且紧凑。它包含以下点：\n\n1. 初始化语句在循环开始前执行。\n2. 只有当给定的条件为真时，循环才会执行。运行一次代码。\n3. 迭代计数器可以增加或减少。\n\
    \n语法：\n```javascript\nfor (初始化; 测试条件; 迭代){\n  条件为真时执行的语句(s)\n}\n```\n\n示例：\n```javascript\n\
    <script type=\"text/javascript\">\n<!--\nvar count;\ndocument.write(\"This will\
    \ repeat 10 times\" + \"<br />\");\nfor(count = 0; count < 10; count++){\n  document.write(\"\
    Currently repeated : \" + count );\n  document.write(\"<br />\");\n}\ndocument.write(\"\
    Done!!\");\n//-->\n</script>\n```\n输出：\nThis will repeat 10 times\nCurrently repeated\
    \ : 0\nCurrently repeated : 1\nCurrently repeated : 2\nCurrently repeated : 3\n\
    Currently repeated : 4\nCurrently repeated : 5\nCurrently repeated : 6\nCurrently\
    \ repeated : 7\nCurrently repeated : 8\nCurrently repeated : 9\nDone!!\n\n# 第\
    \ 11 章：JavaScript 中的函数和事件\n\n## 什么是函数？\n\n在程序任何需要的地方都可以被重复使用的一组代码被称为函数。它减少了反复编写相同代码的时间和精力。通过函数可以编写模块化代码。可以通过函数将大型程序划分为许多或所需的部分。JavaScript\
    \ 像任何其他编程语言一样，支持编写模块化代码所需的功能。这是通过使用函数实现的。\n\n`write()` 和 `alert()` 是默认函数。JavaScript\
    \ 为用户提供了许多可以直接使用的函数。\n\nJavaScript 还允许我们创建自己的自定义函数。\n\n### 函数定义\n\n函数在使用之前应该先定义。`function`\
    \ 关键字是 JavaScript 中定义函数的常用方法。它后面跟着一个唯一的函数名和参数列表。它还包含一个带有大括号的语句块。\n\n语法：\n```javascript\n\
    <script type=\"text/javascript\">\n<!--\nfunction 函数名(参数列表)\n{\n  语句\n}\n//-->\n\
    </script>\n```\n\n"
