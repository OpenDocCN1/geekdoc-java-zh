- fmt: "\n* The `mammal` and the `reptile` classes are both subclasses of the `animal`\
    \ class.\n* The `dog` class is subclass of the `mammal` class which is in return\
    \ a subclass of the `animal` class.\n\nWe can view the same using the IS-A relationship.\
    \ It looks as follows:\n\n* `Mammal` IS-A `Animal`\n* `Reptile` IS-A `Animal`\n\
    * `Dog` IS-A `Mammal`\n* Hence : `Dog` IS-A `Animal` as well\n\nUsing the `extends`\
    \ keyword allows the subclass to inherit every single property of this superclass\
    \ excluding its private properties.\n\nUsing the instance operator we can ensure\
    \ that the normal class is actually an instance of the `animal` class.\n\nExample:\n\
    \n```java\npublic class Dog extends Mammal{\n  public static void main(String\
    \ args[]){\n      Animal a = new Animal();\n      Mammal m = new Mammal();\n \
    \     Dog d = new Dog();\n      System.out.println(m instanceof Animal);\n   \
    \   System.out.println(d instanceof Mammal);\n      System.out.println(d instanceof\
    \ Animal);\n  }\n}\n```\n\nOutput: This would produce the following result\n```\n\
    true\ntrue\ntrue\n```\n\n### The instanceof operator\n\nIn Java, if you want to\
    \ determine a class if it belongs to a specific given class or for implementing\
    \ a given interface, you can make use of the `instanceof` operator. The `instanceof`\
    \ operator is a type comparison operator. The `instanceof` operator returns `true`\
    \ or `false` depending on the state of the class. The `instanceof` operator returns\
    \ `true` if a given object belongs to a certain class or if the given object implements\
    \ an interface. If not it will simply return `false`.\n\nHere, in the following\
    \ example you can see the use of the `instanceof` operator.\n\n```java\nclass\
    \ Vehicle {\n  String name;\n  Vehicle() {\n    name = \"Vehicle\";\n  }\n}\n\n\
    class dirtbike extends Vehicle {\n  dirtbike() {\n    name = \"dirtbike\";\n \
    \ }\n}\n\nclass atv extends dirtbike {\n  atv() {\n    name = \"atv\";\n  }\n\
    }\n\nclass LightVehicle extends Vehicle {\n  LightVehicle() {\n    name = \"LightVehicle\"\
    ;\n  }\n}\n\npublic class InstanceOfExample {\n  static boolean result;\n  static\
    \ dirtbike hV = new dirtbike();\n  static atv T = new atv();\n  static dirtbike\
    \ hv2 = null;\n\n  public static void main(String[] args) {\n      result = hV\
