    # 第 13 章：JavaScript 中的对象


    ## JavaScript - 对象：


    JavaScript 中的对象由属性组成。如果一个属性包含一个函数，则该属性被视为方法，否则该属性被视为属性（属性）。


    ## 对象属性：


    对象的属性可以是任何数据类型。


    当需要向对象添加属性时，使用以下语法：


    | `objectName.objectProperty = propertyValue;` | |


    ## 示例：


    接下来的示例展示了如何使用文档对象的 "title" 属性：


    | `var strg = document.title;` |


    ## 对象方法：


    允许对象执行特定任务的函数。


    ## 示例：


    下面的示例展示了如何使用 `write()` 方法：


    | `document.write("This is text");` |


    ## 自定义对象


    ### new 运算符


    `new` 运算符有助于创建对象的实例。要创建一个对象，构造方法紧跟在 `new` 运算符之后。


    在下述示例中，`Object()`、`Array()` 和 `Date()` 是构造方法，它们是 JavaScript 的内置函数。


    | `var emp = new Object();var textbooks = new Array("C", "Python", "Java");var
    day = new Date("August 21, 1987");` |


    ### Object() 构造函数：


    可以通过构造函数创建并初始化对象。`Object()` 是一个特殊的构造函数，有助于构建对象。


    下面的示例展示了如何创建一个对象：


    | `<html><head><title>用户定义的对象 </title><script type="text/javascript">var book
    = new Object();   // 创建对象    book.subject = "Perl"; // 为对象分配属性    book.author  =
    "Yashwanth";</script></head><body><script type="text/javascript">   document.write("Book
    name is : " + book.subject + "<br>");   document.write("Book author is : " + book.author
    + "<br>");</script></body></html>` |


    ## JavaScript Native 对象


    JavaScript 由许多内置原生对象组成。它们的行为不受运行它们的浏览器或平台的影响。


    以下是 JavaScript 中最常用的原生对象列表：


    1. Number 对象

    2. Boolean 对象

    3. [String](http://www.tutorialspoint.com/javascript/javascript_strings_object.htm)
    对象

    4. JavaScript Math 对象


    ## Number 对象


    JavaScript 中的数字对象（此处原文为复数：number objects）用于表示数值。它可以同时持有整数和浮点值。


    每当遇到数值时，网络浏览器会自动将这些值转换为 `number` 类实例。


    语法：


    创建数字对象的语法如下：


    | `var value = new Number(number);` |


    ### Number 方法


    以下是数字对象中包含的方法。


    | 方法 | 描述 |

    | :--- | :--- |

    | [`constructor()](http://www.tutorialspoint.com/javascript/number_constructor.htm)
    | 此方法用于返回创建对象实例的函数。 |

    | [`toExponential()](http://www.tutorialspoint.com/javascript/number_toexponential.htm)
    | 该方法的结果是以指数形式显示标准范围数字。 |

    | [`toLocaleString()](http://www.tutorialspoint.com/javascript/number_tolocalestring.htm)
    | 该方法接收一个数字并返回该数字的字符串版本。它是根据网络浏览器的区域设置进行格式化的。 |

    | [`toPrecision()](http://www.tutorialspoint.com/javascript/number_toprecision.htm)
    | 该方法定义了在给定数字中显示的位数。这包括小数点两侧的数字。 |

    | [`toString()](http://www.tutorialspoint.com/javascript/number_tostring.htm)
    | 此方法有助于将数字转换为字符串值。 |

    | [`valueOf()](http://www.tutorialspoint.com/javascript/number_valueof.htm) |
    此方法表示数字的值。 |


    ## Boolean 对象


    Boolean 对象用于表示一个可以是“真”（True）值也可以是“假”（False）值的值。


    语法：


    可以使用以下语法创建 Boolean 对象：


    | `var bval = new Boolean(value);` |


    如果 `value` 参数持有以下任何值之一：空字符串、null、0、Nan、-0、null 或 undefined，则 Boolean 对象的初始值为 `false`。


    ### Boolean 方法：


    以下是 Boolean 对象中包含的方法。


    | 方法 | 描述 |

    | :--- | :--- |

    | [`toSource()](http://www.tutorialspoint.com/javascript/boolean_tosource.htm)
    | 此方法用于返回由 Boolean 对象源码组成的字符串。可以使用该字符串创建一个等的对象。 |

    | [`toString()](http://www.tutorialspoint.com/javascript/boolean_tostring.htm)
    | 此方法用于根据对象的值返回 ‘true’ 字符串或 ‘false’ 字符串。 |

    | [`valueOf()](http://www.tutorialspoint.com/javascript/boolean_valueof.htm) |
    此方法用于返回 Boolean 对象的值。 |


    ## String 对象：


    String 对象允许用户处理字符。


    语法：


    可以使用以下语法创建 String 对象：


    | `var value = new String(string);` |


    `string` 参数代表一组字符。


    ### String 方法


    | 方法 | 描述 |

    | :--- | :--- |

    | [`charCodeAt()](http://www.tutorialspoint.com/javascript/charat.htm) | 此方法返回指定索引处字符的
    Unicode 值。 |

    | [`concat()](http://www.tutorialspoint.com/javascript/concat.htm) | 此方法用于连接两个字符串并返回新创建字符串。
    |

    | [`match()](http://www.tutorialspoint.com/javascript/match.htm) | 此方法用于用正则表达式匹配字符串。
    |

    | [`toLocaleLowerCase()](http://www.tutorialspoint.com/javascript/tolocalowercase.htm)
    | 用于在区域设置的情况下将字符串转换为小写。 |

    | [`toLocaleUpperCase()](http://www.tutorialspoint.com/javascript/tolocercase.htm)
    | 用于在区域设置的情况下将字符串转换为大写。 |

    | `toLowerCase()` | 返回一个将大写字母转换为小写的字符串。 |

    | `toUpperCase()` | 返回一个将小写字母转换为大写的字符串。 |


    ## Math 对象


    它允许用户执行许多数学计算。通过编写对象名称、点以及后续的方法名称来调用对象方法。参数写在方法的括号中。


    document.writeln(Math.sqrt(81));


    以下是 Math 对象中一些常用的函数：


    | 方法 | 描述 |

    | :--- | :--- |

    | `abs(x)` | x 的绝对值 |

    | `ceil(x)` | 将 x 向上取整到不小于 x 的最小整数。 |

    | `round(x)` | 将 x 四舍五入到最近的整数。 |

    | `pow(x , y)` | x 的 y 次 |

    | `floor(x)` | 将 x 向下取整到不大于 x 的最大整数。 |


