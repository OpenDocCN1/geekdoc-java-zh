    # Chapter 9: Exception Handling


    ### Exception


    An exception can be defined as anything that interrupts the flow of a given program.
    Exceptions want to let the program continue with its execution and will make them
    terminate without letting them continue any further. In cases like that, the system
    will generate error messages to notify the user about the problem occurred. But
    there is nothing to worry about exceptions as they can be handled.


    When can an exception occur?


    Exceptions can occur at both runtime and compile time. Not all exceptions occur
    at runtime. When there is a problem during the compilation of the program, the
    Java virtual machine gives an error message regarding that exception. Most of
    the exceptions occur during runtime. The exception is that occur during compile
    time are called as a compile time exceptions and those which occur during run
    time are called as run-time exceptions.


    What are the reasons for exceptions?


    There are many reasons for an exception to occur. For example, when the system
    cannot open the file, it throws an exception. Network connection problems, class
    file missing scenarios, handling operands which are out of range are some of the
    common reasons which throw exceptions.


    There are two types of exceptions that can be found in the Java language. They
    are checked exceptions and unchecked exceptions.


    Here we will learn about checked exceptions and unchecked exceptions in detail.


    ### Checked exceptions'
