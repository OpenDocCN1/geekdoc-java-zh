  \ 简介\n\nJava 作为互联网时代最流行的编程语言之一，于 1991 年在太阳微系统公司（Sun Microsystems）构思并开发。任何编程语言的演进都是由计算生态系统发展带来的需求驱动的——`java`\
  \ 也不例外。\n\n虽然用 C 或 C++ 编写的代码（Java 强大的前辈）也可以在所有设备上运行，每次为了让它们在特定设备上运行而所需的编译工作非常贵。\n\
  \nJava 解决了这个问题，只需获取文本源码（`.java`）将其编译为中间字节码文件（`.class`），然后该文件可以由任何运行解释器的设备 - Java\
  \ 虚拟机（`JVM`）进行解释。字节码的想法意味着代码与架构中立，只需要编译一次，并可以在任何可以运行 `JVM` 的设备上进行解释。\n\n今天，Java\
  \ 已经成为一种重要的编程语言，对于任何对编程感兴趣的人来说，至少了解 Java 的基础是必不可少的。本书正是为了这个目的而编写的。我想帮助任何几乎或完全没有编程经验的人，轻松且有效地接触\
  \ `java` 编程。\n\n# 第 1 章：入门\n\n## 安装\n\n在开始任何工作之前，我们需要准备好开发环境。初学者可以使用在线开发环境（`https://ideone.com/`）来执行短代码段，但如果需要执行的代码是一个完整的程序，则必须在系统中安装\
  \ `java` 并设置自己的离线开发环境。Java 有三种类型——\n\n- 微型版 (`J2ME`)\n- 标准版 (`J2SE`)\n- 企业版 (`J2EE`)\n\
  \n对于个人使用，人们可以从[下载页面](http://www.oracle.com/technetwork/java/javase/downloads/index.html)\
  \ 下载对应其操作系统的最新 SE 版本 `.exe` 文件。安装后，检查 `PATH` 变量是否指向 `java` 的安装路径。在终端窗口中执行 `java`\
  \ 将在屏幕上显示安装的 `java` 版本。\n\n## 代码结构\n\n![](img/00001.jpeg)\n\n每个 `java` 代码都以 `.Java`\
  \ 扩展保存。每个 `java` 程序包含一个或多个类。这些类中的每一个都包含一个或多个方法定义，每个方法内部带有几条语句。\n\n## 关键字的语法和含义\n\
  \n```java\nimport java.io.*;;\n\npublic class MyFirstProgram {\n    public static\
  \ void main(String[] args) {\n        //This is my first java program\n        System.out.println(\"\
  \ Hello World !\");\n    }\n}\n```\n\n- `import java.io.*;` - 关键字 `import` 用于包含名为\
  \ `packages`（包）的 `java` 库，这些包包含了程序可以使用预定义函数。\n- `public class MyFirstProgram` -\
  \ 这是类定义，关键字 `public` 表示该类对所有人可见，`class` 表示类定义。\n- `MyFirstProgram` – 这是类名。带有 `main()`\
  \ 函数的类名应与源文件名相同。\n- 类定义封装在括号 `{}` 之中。\n- `public static void main(String args[])`:\
  \ 这是程序的主部分。由于 `main()` 是驱动函数，它应该始终是 `public` 的。\n- `static`: 你需要记住 `main()` 方法应该是\
  \ `static` 的，因为这可以提高内存效率。\n- `void`: 这是方法的返回类型。这意味着 `main()` 方法不会返回任何内容。\n- `main`:\
  \ 方法名。解释器仅从 `main()` 方法开始执行。运行程序意味着指示 `JVM` 加载从源码编译的 `.class` 文件并从 `main()` 方法开始执行。\n\
  \n`main` 方法的两个用途可以总结为：\n1. 测试程序的所有其他方法\n2. 启动程序的执行\n\n- `String[] args`: 是传递给 `main`\
  \ 方法的参数。该方法始终接收字符串数组作为输入参数，数组名称应始终为 `args`。\n- 注意数据类型以大写 `S` 开始，这是因为 `Strings` 是\
  \ Java 中的一个类，所有类名都以大写开头。\n- 方法定义封装在花括号 `{}` 之中，在这种情况下，我们希望程序执行的操作只是打印 \"Hello World!\"\
  。\n- 向标准输出控制台打印语句使用 `System.out.println(\"\");`。注意所有语句必须以分号（`;`）结束。\n- 你也可以使用 `System.out.print()`\
  \ 显示输出，区别在于 print`ln` 在它打印的每个语句末尾引入新行。\n- 我们程序中 `main()` 方法中的另一个语句被称为“注释”语句。这些语句不会被编译，以\
  \ `//` 开头的这些语句仅用于为程序员提供更多信息。\n\nJava 根本没有全局变量的概念；通过使用 `final`、`static`、`public`\
  \ 等关键字来实现。\n\n### 使用 Java 库\n\n\n\n\n\n在编写 `Java` 时，你会发现存在许多预定义的类。所有这些类都可以在 Java\
  \ 程序中使用，从而让用户无需重复造轮子。但为了能够使用这些类，你至少应该对需要使用什么以及在哪里找到它们具备基础的知识。这些被称为 Java API。该库无非是一堆巨大的、预定义的类集合，这些类可以在程序的任何地方使用。它们包含了预定义的代码，用户只需要知道如何使用它们即可。这些库避免了用户编写长长的代码。这也被称为\
  \ `Java 标准代码库`。在 `Java` 平台中，`Java 标准代码库` 主要有三个用途。它们是：\n\n- 就像其他代码库一样，Java 库为程序员提供了一系列实用的工具。这些工具包括正则表达式处理、容器类等。\n\
  - 标准代码库为用户提供了抽象接口，用户可以通过接口独立地执行任务。通过这种方式，用户无需为文件访问和网络访问等复杂过程编写完整的代码。\n- 某些底层平台不支持所有的\
  \ Java 应用程序。在这种情况下，你可以使用 Java 库来模拟这些功能，或者使用它来提供一种检查特定功能是否存在的方法。\n\n### Java 标准代码库的实现与配置\n\
  \n标准库中的大部分代码是用 `Java` 编写的。直接访问操作系统或硬件所需的代码除外。在这些情况下，使用 `Java native interface`（Java\
  \ 原生接口）来访问操作系统的 API。几乎所有的 Java 代码库都存储在一个名为 `rt.jar` 的单一归文件中。该文件由 `JDK` 和 `JRE` 分发。Java\
  \ 类库可以在引导类路径（bootstrap class path）中找到。\n\n### Java 类库的主要特征。\n\n我们使用类来访问 Java 类库的功能。这些类属于包（packages）。下面是\
  \ Java 类库的一些主要特征：\n\n- `java.lang` 包含了所有的基础接口和类。它们与运行时系统和语言紧密相关。\n- 有一个专门用于数学运算的包，其中包含了数学表达式、求值和任意精度小数。它们都存在于\
  \ `java.math` 库中。\n- 工具与集合：Java 为用户提供了内置的工具类和数据结构。这些工具类和数据结构可以用于数据压缩、博客、并发和正则表达式。\n\
  - 2D 图形和图形用户界面：用户可以使用 `AWT` 包，该包提供了图形用户界面操作。该包绑定到原生系统。你可以用它来设计平台无关的工具包以及可插的外观和外观（feel\
  \ and look）。该包还可以处理可编辑和不可编辑的文本组件。\n- 音频：此包为用户提供了类和接口，可用于音频数据的写入、读取、合成和序列化。\n- 文本：`java.text`\
  \ 接口用于处理文本、数字、消息和日期。\n- 数据库：用户可以使用 `java.SQL` 库访问数据库 (`sql`）。\n- `Java.Security`\
  \ 提供安全保障以及加密服务。`javax.crypto` 库中存在加密服务。\n- Java 还允许你访问脚本引擎。你可以使用 `javax.script`\
  \ 包使用任何符合标准的脚本语言。\n- Applets（小程序）：`Java.applet` 包允许你通过网络下载应用程序，并允许你在受保护的沙箱中运行它们。\n\
  \n# 第 2 章：面向对象编程\n\nJava 的语法与 `C` 相似，但编程哲学源自 `C++` —— 即：，java 是一种面向对象的语言。\n\n在我们看到的第一个示例中，我们有一个类声明，并说明\
  \ `main()` 函数负责程序中执行的内容，嗯，这并没有让 java 变成一种 OOP 语言，让我们看一个示例来更好地理解 OOP —— 对象和类。\n\n\
  ## 过程化方法\n\n这并不简单，因为之前的形状是确定的，动画代码可以假设一个中心点并旋转形状；而对于像 `amoeba`（变形虫）这样不规则的形状，无法使用与其他形状相同的代码旋转，API\
  \ 需要更多的参数来定义形状应该旋转的坐标。\n\n## 面向对象方法\n\n因此，你可以为每个形状编写一个类文件，这样通过简单的添加新类就可以添加 `amoeba`\
  \ 或修改 `rotate` 方法，而不会扰动现有代码。你只需要测试新类。引入的任何新问题都可以轻松追溯到新做的更改。\n\n示例 1：\n```java\n\
  class Movie{\n    //变量声明\n    //方法\n} m1; // m1 是类型为“Movie”的的对象\n\n\n示例 2：\n```java\n\
  class Movie{\n    //变量声明\n    //方法\n}\n\nclass TestMovie{\n    public static void\
  \ main(String[] args){\n        Movie m1 = new Movie(); // m1 是类型为“Movie”的对象\n \
  \       m1.variable = value;\n        m1.method();\n    }\n}\n```\n\n# 第 3 章：变量声明与数据类型\n\
  \n下一个最重要且基础的要学习的概念是用于创建有用程序的“变量”和“数据类型”。变量本质上是命名的内存位置，用于存储值。Java 是一种强类型语言，因此类型为“x”的变量只能持有类型为“x”的值。\n\
  \n例如：\n```java\nint n;\n```\n在这里声明变量 `n` 用于存储类型为 `int` 的值。声明变量类型确保了 Java 的“类型安全”特性。\n\
  \nJava 中的变量可以是：\n- 局部变量（基本数据类型如 `int`, `float`, `double`, `Boolean` 等\n- 引用变量（类的实例）\n\
  \n假设你声明了一个类型为 `int` 的变量，可以使用它来节省短型值。如果不这样做，可能会发生溢出。\n\n此外注意，Java 默认认为带有小数点的数字是 `double`，因此在给定的数字后面附加“f”使其变为浮点型是重要的。\n\
  ```java\nfloat f = 1.56f;\n```\n\n变量命名的规则：\n- 不要使用保留字作为变量名。\n- 变量名不能以数字开头。\n\n应该知道的一些\
  \ Java 关键字：\n(images/0002.jpeg)\n\n## 字符串\n\n`String` 被声明为一个类。字符串上常用的操作有：\n```java\n\
  String str = “Hello World”; //声明\nint len = str.length(); // 获取字符串的长度\nint len =\
  \ “hello Wolrd”.length(); // 也获取字符串的长度\nString concatStr = “hello”+”world”; // +运算符可以重载以执行两个字符串的拼接。\n\
  String str1 = “Heloo”;\nString str2 = “World”;\nif (str1 == str2) //比较两个字符串\n  \
  \  System.out.println(“strings are equal”);\n```\n\n## 引用变量\n\n```\nMovie m1 = new\
  \ Movie()\n```\n左侧是声明，指令 为引用变量保留空间以到达实际对象。\n```java\nint[] n; //声明一个整数数组\nn = new\
  \ int[5]; //创建一个包含 5 个整数的数组\n```\n注意，即使是基本数据类型值的数组，数组也变成了一个对象。\n```java\nMovie[]\
  \ mArray; //声明一个类型为“Movie”的对象数组\n```\n大小：引用变量没有像基本类型那预定义的大小。\n\n### 等于操作\n\n我们知道比较运算符如\
  \ `==` 和 `!=` 可以用于基本类型操作，但为了对对象执行比较操作，不能使用默认运算符，相反 Java 提供了关键字 `equals`。\n\n Array\
  \ List\n\n\n\n\n这在 `java.util.ArrayList` 包中可用。\n\n`ArrayList<String> myList = new\
  \ ArrayList<String>();`\n\n它允许声明不同数据类型的数组。它提供了多种方法来执行常用的数组操作，如 `add(elem)` 和 `remove(index)`\
  \ 用于从 `arrayList` 中添加/删除元素。此外，还有如 `size()` 等 API 用于查找数组长度，查找 `isEmpty()` 是否为空，或者\
  \ `arrayList` 是否 `contains()` 给定的元素。\n\n让我们来看一个使用目前所学概念的示例，\n\n```java\nClass MyProgram{\n\
  \n    public static void main(Strings[] args)\n    {\n        //声明并赋值变量\n      \
  \  int  num = 10;  \n        float fNum = 10.5;\n        // 打印语句到控制台\n        System.out.println(“The\
  \ value of integer num is : ”+num);\n        System.out.println(“The Value of integer\
  \ fNum is : ”+fNum);\n        num = num/2;\n        fNum = fNum+num;\n        System.out.println(“The\
  \ value of integer num after operation is : ”+num);\n        System.out.println(“The\
  \ Value of integer fNum after operation is : ”+fNum);\n    }\n}\n```\n\n输出:\nThe\
  \ value of integer num is : 10\nThe value of integer fNum is : 10.5\nThe value of\
  \ integer num after operation is : 5\nThe value of integer fNum after operation\
  \ is  : 20.5\n\n你只需要在 SoP (`System.out.println`) 语句中使用 `+` 运算符。\n\n## 包装类 (Wrapper\
  \ Classes)\n\n正如我们所知，Java 是一种面向对象的编程语言，Java 中的一切都可以被视为对象。从简单的文件、图像、系统地址等任何内容都可以被视为\
  \ Java 中的对象。我们可以使用包装类来更改对象的类型。在本教程中，我们将介绍包装类及其细节。使用包装类，你可以将任何给的数据类型转换为对象。\n\nJava\
  \ 中的所有基本数据类型都不是对象。这些基本数据类型不属于任何类，它们定义在 Java 语言本身中。我们可能会遇到需要将这些基本数据类型转换为对象的情况。例如，通过将数据类型转换为对象来将其添加到向量（vector）或栈（stack）中。Java\
  \ 设计引入了包装类来完成这些转换。\n\n### 关于包装类\n\n正如其名所示，包装类封装（wrap）在任何数据类型周围，赋予其对象的外观，并在需要该数据类型时可以使用它。这是一个可以逆转的过程。包装类不仅可以将数据类型转换为类，还可以解包装对象并返回数据类型。这就像巧克力外面的包装纸一样。制造商用包装纸包裹巧克力并发货。用户在使用时剥掉包装纸以获得巧克力。\n\
  \n请看下面的转换示例，其中 `int` 数据类型被转换为对象。\n\n```java\nint k = 100;\nInteger it1 = new Integer\
  \ (k);\n```\n\n在上面的示例中，`int` 数据类型 `k` 使用包装类转换为对象 `it1`。这是通过使用 `integer` 类实现的。每当需要\
  \ `K` 时，就可以使用对象 `it1`。\n\n以下代码显示了如何封装对象并从整数对象 `it1` 获取 `int` 数据类型。\n\n```java\n\
  int m = it1.intValue();\nSystem.out.println(m*m); // 打印 10000\n```\n\n### 包装类列表\n\
  \n在 Java 语言中存在 8 种数据类型，每类型都有对应的包装类。\n\n| 基本数据类型 | 包装类 |\n| :--- | :--- |\n| byte\
  \ | Byte |\n| short | Short |\n| int | Integer |\n| long | Long |\n| float | Float\
  \ |\n| double | Double |\n| char | Character |\n| Boolean | Boolean |\n\n所有的包装类都可以在\
  \ `java.lang` 包中找到。它们被放置在那里是为了以便在导入时可以隐式地提供给程序员。为了避免继承，Java 设计师将这些包装类设为 `final`。\n\
  \n### 包装类重要性\n\n我们使用包装类有两个目的：\n\n- 将简单数据类型转换为对象。这是通过给给定的数据类型赋予对象形式来实现。\n- 将字符串转换为数据类型。对于此类转换，我们使用如\
  \ `parseXXX()` 等方法。\n\n这里有一个示例程序，展示了将数据类型转换为对象，并同时检索该数据类型。\n\n```java\npublic class\
  \ WrappingUnwrapping\n{\n    public static void main(String args[])\n    {\n   \
  \     //  数据类型\n        byte grade = 2;\n        int marks = 50;\n        float\
  \ price = 8.6f; // 注意 float 的后缀 f\n        double rate = 0.5; // 数据类型转对象 \n    \
  \    Byte g1 = new Byte(grade); // 封装\n        Integer m1 = new Integer(marks);\n\
  \        Float f1 = new Float(price);\n        Double r1 = new Double(rate);\n\n\
  \        // 让我们从对象打印值\n        System.out.println(\"Values of Wrapper objects (printing\
  \ as objects)\");\n        System.out.println(\"Byte object g1: \" + g1);\n    \
  \    System.out.println(\"Integer object m1: \" + m1);\n        System.out.println(\"\
  Float object f1: \" + f1);\n        System.out.println(\"Double object r1: \" +\
  \ r1);\n\n        // 从整数对象 it1 获取 int 数据类型（解封装）\n        byte bv = g1.byteValue();\n\
  \        int iv = m1.intValue();\n        float fv = f1.floatValue();\n        double\
  \ dv = r1.doubleValue();\n\n        // 打印对象的值\n        System.out.println(\"Unwrapped\
  \ values (printing as data types)\");\n        System.out.println(\"byte value,\
  \ bv: \" + bv);\n        System.out.println(\"int value, iv: \" + iv);\n       \
  \ System.out.println(\"float value, fv: \" + fv);\n        System.out.println(\"\
  double value, dv: \" + dv);\n    }\n}\n```\n\n# 第 4 章：控制语句\n\n程序中的控制语句，正如其名称所示，控制着程序的通用流程。它包含了如\
  \ if else 等条件语句，或 `while()`、`do while()` 等迭代语句。\n\n![](img/0003.jpeg)\n\n## If else\n\
  \n语法：\n```java\nif(condition)\n    do action1;\nelse\n    do action2;\n```\n当 `condition`\
  \ 为真时执行动作，否则执行 `else` 部分的动作。\n\n## Switch case\n\n当你需要检查多个条件时，这种操作非常有用。Switch case\
  \ 根据给定的值采取动作。\n\n语法：\n```java\nSwitch(id)\n{\n    Case id1:\n        Action;\n \
  \       Break;\n    Case id2:\n        Action;\n        Break;\n    Default:\n \
  \       ….\n}\n```\n\n## While ()\n\n这是一种迭代语句，只要条件为真就执行动作。\n\n语法：\n```java\nwhile(condition)\n\
  {\n    Do something while condition is true;\n}\n```\n\n## Do - while ()\n\n这也是一种迭代操作，与\
  \ `while()` 循环相似，区别在于循环至少会执行一次，因为条件是在 `do` 语句之后才进行评估的。\n\n语法\n```\ndo{\n    do Something;\n\
  }while(condition);\n```\n\n## For 循环\n\n语法：`for (初始化;条件;计数器更新)`\n\n示例：`for (int\
  \ i=0; i<5; i++)`\n\n这现在将精确执行 5 次语句。第一部分声明并初始化计数器变量的值，第二部分检查条件，如果为真则进入循环。在循环完成后，执行递增。然后再次检查条件并重复相同的步骤，直到条件变为假。一旦条件为假，它就会退出循环。\n\
  \n\n\n\n整数 `Num` 的值为：3\n\n整数 `Num` 的值为：2\n\n整数 `Num` 的值为：1\n\n整数 `Num` 的值为：5\n\n\
  整数 `Num` 的值为：5\n\n整数 `Num` 的值为：5\n\n整数 `Num` 的值为：5\n\n整数 `Num` 的值为：5\n\n上述程序使用了两个循环语句执行操作。\n\
  \n## `for` 循环与 `while` 循环的区别：\n\n如你所知，`for` 循环包含三个部分。它们分别是：初始化、布尔条件设置和迭代表达式。而在 `while`\
  \ 循环中，没有内置的初始化或迭代表达式。它只包含布尔测试。当你不知道条件返回 `true` 的迭代次数时，使用 `while` 循环是很好的。如果迭代次数是知的，使用\
  \ `for` 循环是明智的，因为它更整洁。\n\n这是一个使用简单 `while` 循环的示例。\n\n示例：\n\n```java\npublic class\
  \ Test {\n  public static void main(String args[]) {\n    int x = 10;\n    while(\
  \ x < 20 ) {\n      System.out.print(\"value of x : \" + x );\n      x++;\n    \
  \  System.out.print(\"\\n\");\n    }\n  }\n}\n```\n\n输出：\n\n```\nvalue of x : 10\n\
  value of x : 11\nvalue of x : 12\nvalue of x : 13\nvalue of x : 14\nvalue of x :\
  \ 15\nvalue of x : 16\nvalue of x : 17\nvalue of x : 18\nvalue of x : 19\n```\n\n\
  ###更多关于 `for` 循环\n\n在这里我们将研究循环的细节。现在我们来看 `for` 循环。每个 `for` 循环由三个部分组成。它们是：\n\n* \
  \  初始化：在初始化部分，我们将使用一个合适的变量来声明并初始化循环变量。我们在循环体中使用它。在循环中使用的这个变量通常用作计数器。循环内部可以放置的变量数量不仅限于\
  \ 1 个。你可以在循环体中放置任何数量作为计数器的变量。\n*   布尔条件设置：条件测试将放置在循环的这部分。给定的条件无论是什么，都必须解析为一个布尔值。你可以给出一个表达式，也可以使用返回布尔值的方法。\n\
  *   迭代表达式：在循环的这部分，你可以放置一个或多个你希望每次循环运行时执行的动作。始终记住，执行只会在循环结束时发生。\n\n###嵌套 `for` 循环：\n\
  \n你可以将一个 `for` 循环放在另一个 `for` 循环内部。这种安排被称为嵌套 `for` 循环。你可以在循环内部放置任意数量的循环。但建议不要超过五六层嵌套，因为这会让程序看起来臃肿。汽车里程表的工作原理与嵌套\
  \ `for` 循环相同。另一个例子是日期或日历。众所周知，一天由小时、分钟和秒组成。在数字钟中，嵌套 `for` 循环的最后一个分支是秒计数器。之上是分钟计数器。分钟计数器之上是小时计数器。这是嵌套中的嵌套循环。下面给出了嵌套\
  \ `for` 循环的语法。`for` 循环有三种形式，分别是：\n\n形式 1 语法：\n\n```java\nfor(initialization; test;\
  \ increment)\n{\n  statements;\n  while(expression)\n  {\n    statements;\n  }\n\
  \  do\n  {\n    statements;\n  }while(expression);\n}\n}\n```\n\n形式 2 语法：\n\n```java\n\
  for(initialization; test; increment)\n{\n  statements;\n  for(initialization; test;\
  \ increment)\n  {\n    statements;\n    for(initialization; test; increment)\n \
  \   {\n      statements;\n    }\n  }\n}\n```\n\n形式 3 语法：\n\n```java\nWhile(expression)\n\
  {\n  statements;\n  While(expression)\n  {\n    statements;\n  }\n}\n```\n\n这里有几个示例可以让你理解嵌套\
  \ `for` 循环的工作原理。\n\n示例 1：使用嵌套 `for` 循环显示 `*` 三角形的程序\n\n```java\nclass NestedForLoopDemo\n\
  {\n  public static void main(String args[])\n  {\n    for(int i = 1; i <=5 ; i++)\n\
  \    {\n      for(int j = 1; j <= i; j++)\n      {\n        System.out.println(\"\
  * \");\n      }\n      System.out.println(\"\");\n    }\n  }\n}\n```\n\n输出\n\n```\n\
  *\n* *\n* * *\n* * * *\n* * * * *\n```\n\n示例 2：打印表格的程序\n\n```java\nclass NestedWhileLoop\n\
  {\n  public static void main(String args[])\n  {\n    int i=1, j=1;\n    System.out.println(\"\
  Tables\");\n    while(i <= 2) // 根据用户需要的表格数量更改为 10 或 20\n    {\n      while(j <=\
  \ 10)\n      {\n        System.out.println(i + \" \" + j);\n      }\n      j=1;\n\
  \      i++;\n    }\n  }\n}\n```\n\n（注：示例 2 的原文是碎片化的；我根据标准的表格打印模式重构了逻辑）\n\n输出\n\n\
  ```\nTables\n1 1 1 2 1 3 1 4 1 5 1 6 1 7 1 8 1 9 1 10\n2 1 2 2 2 3 2 4 2 5 2 6 2\
  \ 7 2 8 2 9 2 10\n```\n\n示例 1：使用嵌套 `for` 循环显示 `*` 三角形的程序\n\n```java\nclass NestedForLoopDemo\n\
  {\n  public static void main(String args[])\n  {\n    for(int i = 1; i <=5 ; i++)\n\
  \    {\n      for(int j = 1; j <= i; j++)\n      {\n        System.out.println(\"\
  * \");\n      }\n      System.out.println(\"\");\n    }\n  }\n}\n```\n\n输出\n\n```\n\
  *\n* *\n* * *\n* * * *\n* * * * *\n```\n\n示例 2：打印表格的程序\n\n```java\nclass NestedWhileLoop\n\
  {\n  public static void main(String args[])\n  {\n    int i=1, j=1;\n    System.out.println(\"\
  Tables\");\n    while(i <= 2) // 根据用户需要的表格数量更改为 10 或 20\n    {\n      while(j <=\
  \ 10)\n      {\n        System.out.println(i + \" \" + j);\n      }\n      j=1;\n\
  \      i++;\n    }\n  }\n}\n```\n\n\n\n在这里，所有这些引用变量都指向堆内存中的对象 `deer`。\n\n## 虚拟方法\n\
  \n在本节中，我们将查看被重写方法的行为。在 Java 中，设计类时可以使用多态性。在方法重写中，子类有能力重写其父类中的方法。被重写的方法本质上被隐藏了。在子类使用\
  \ `super` 关键字之前，该方法将无法被调用。`super` 关键字应该在被重写的方法内部使用。\n\n考虑以下示例。\n\n```java\n/* File\
  \ name : Employee.java */\n\npublic class Employee\n{\n  private String name;\n\
  \  private String address;\n  private int number;\n\n  public Employee(String name,\
  \ String address, int number)\n  {\n      System.out.println(\"Constructing an Employee\"\
  );\n      this.name = name;\n      this.address = address;\n      this.number =\
  \ number;\n  }\n\n  public void mailCheck()\n  {\n      System.out.println(\"Mailing\
  \ a check to \" + this.name\n        + \" \" + this.address);\n  }\n\n  public String\
  \ toString()\n  {\n      return name + \" \" + address + \" \" + number;\n  }\n\n\
  \  public String getName()\n  {\n      return name;\n  }\n\n  public String getAddress()\n\
  \  {\n      return address;\n  }\n\n  public void setAddress(String newAddress)\n\
  \  {\n      address = newAddress;\n  }\n\n  public int getNumber()\n  {\n      return\
  \ number;\n  }\n}\n```\n\n如果我们像所示所示扩展 `Employee` 类：\n\n```java\n/* File name : Salary.java\
  \ */\n\npublic class Salary extends Employee\n{\n  private double salary; //Annual\
  \ salary\n\n  public Salary(String name, String address, int number, double salary)\n\
  \  {\n      super(name, address, number);\n      setSalary(salary);\n  }\n\n  public\
  \ void mailCheck()\n  {\n      System.out.println(\"Within mailCheck of Salary class\
  \ \");\n      System.out.println(\"Mailing check to \" + getName()\n        + \"\
  \ with salary \" + salary);\n  }\n\n  public double getSalary()\n  {\n      return\
