  \ UP\", 3, 3600.00);\n      Employee e = new Salary(\"John Adams\", \"Boston, MA\"\
  , 2, 2400.00);\n      System.out.println(\"Call mailCheck using Salary reference\
  \ --\");\n      s.mailCheck();\n\n      System.out.println(\"\\n Call mailCheck\
  \ using Employee reference--\");\n      e.mailCheck();\n  }\n}\n```\n\n输出：\n```\n\
  Constructing an Employee\nConstructing an Employee\nCall mailCheck using Salary\
  \ reference --\nWithin mailCheck of Salary class\nMailing check to George Martin\
  \ with salary 3600.0\nCall mailCheck using Employee reference--\nWithin mailCheck\
  \ of Salary class\nMailing check to John Adams with salary 2400.0\n```\n\n在这个示例中，两个薪资对象...（注：提供的文本在结尾变得重复/乱码；上述已保留核心逻辑）。\n\
  \n\n\n\n*   `mammal` 类和 `reptile` 类都是 `animal` 类的子类。\n*   `dog` 类是 `mammal` 类的子类，而\
  \ `mammal` 类反又是 `animal` 类的子类。\n\n我们可以使用 IS-A 关系来观察这一点。其形式如下：\n\n* `Mammal` IS-A\
  \ `Animal`\n* `Reptile` IS-A `Animal`\n* `Dog` IS-A `Mammal`\n* 因此：`Dog` 也 IS-A\
  \ `Animal`\n\n使用 `extends` 关键字允许子类继承父类的每一个属性，但私有属性除外。\n\n使用实例运算符，我们可以确保普通类确实是 `animal`\
  \ 类的实例。\n\n示例：\n\n```java\npublic class Dog extends Mammal{\n  public static void\
  \ main(String args[]){\n      Animal a = new Animal();\n      Mammal m = new Mammal();\n\
  \      Dog d = new Dog();\n      System.out.println(m instanceof Animal);\n    \
  \  System.out.println(d instanceof Mammal);\n      System.out.println(d instanceof\
  \ Animal);\n  }\n}\n```\n\n输出：这将产生以下结果\n```\ntrue\ntrue\ntrue\n```\n\n### instanceof\
  \ 运算符\n\n在 Java 中，如果你想确定一个类是否属于某个特定的给定的类，或者实现某个给定的接口，可以使用 `instanceof` 运算符。`instanceof`\
  \ 运算符是一种类型比较运算符。`instanceof` 运算符根据类的状态返回 `true` 或 `false`。如果给定对象属于某个类，或者给定对象实现了某个接口，则\
  \ `instanceof` 运算符返回 `true`。否则，它将简单返回 `false`。\n\n在下面的示例中，你可以看到 `instanceof` 运算符的使用。\n\
  \n```java\nclass Vehicle {\n  String name;\n  Vehicle() {\n    name = \"Vehicle\"\
  ;\n  }\n}\n\nclass dirtbike extends Vehicle {\n  dirtbike() {\n    name = \"dirtbike\"\
  ;\n  }\n}\n\nclass atv extends dirtbike {\n  atv() {\n    name = \"atv\";\n  }\n\
  }\n\nclass LightVehicle extends Vehicle {\n  LightVehicle() {\n    name = \"LightVehicle\"\
  ;\n  }\n}\n\npublic class InstanceOfExample {\n  static boolean result;\n  static\
  \ dirtbike hV = new dirtbike();\n  static atv T = new atv();\n  static dirtbike\
  \ hv2 = null;\n\n  public static void main(String[] args) {\n      result = hV instanceof\
  \ dirtbike;\n      System.out.print(\"hV is dirtbike: \" + result + \"\\n\");\n\
  \      result = T instanceof dirtbike;\n      System.out.print(\"T is dirtbike:\
  \ \" + result + \"\\n\");\n      result = hV instanceof atv;\n      System.out.print(\"\
  hV is atv: \" + result + \"\\n\");\n      result = hv2 instanceof dirtbike;\n  \
  \    System.out.print(\"hv2 is dirtbike: \" + result + \"\\n\");\n\n      hV = T;\
  \ // 成功将子类转换为父类\n      T = (atv) hV; // 成功将父类转换为子类\n  }\n}\n```\n\n输出：\n```\nhV\
  \ is dirtbike: true\nT is dirtbike: true\nhV is atv: false\nhv2 is dirtbike: false\n\
  ```\n注意：`hv2` 没有引用 `dirtbike`，`instanceof` 返回 `false`。你应该记住，你不能在兄弟类之间使用 `instanceof`。\n\
  \n### implements 关键字\n\n现在你已经对 `extends` 关键字有了良好的理解，我们将来看 `implements` 关键字以及它如何用于获取\
  \ IS-A 关系。我们使用 `implements` 关键字让类继承接口。你应该记住，接口不能被类扩展，只能被实现。\n\n示例：\n\n```java\n\
  public interface Animal {}\npublic class Mammal implements Animal {}\npublic class\
  \ Dog extends Mammal {}\n```\n\n### instanceof 关键字\n\n在这里，我们将查看 `instanceof` 运算符。我们使用这个运算符来判断一个类是否是其父类的实例。\n\
  \n```java\ninterface Animal{}\nclass Mammal implements Animal{}\npublic class Dog\
  \ extends Mammal{\n  public static void main(String args[]){\n      Mammal m = new\
  \ Mammal();\n      Dog d = new Dog();\n      System.out.println(m instanceof Animal);\n\
  \      System.out.println(d instanceof Mammal);\n      System.out.println(d instanceof\
  \ Animal);\n  }\n}\n```\n\n输出：\n```\ntrue\ntrue\ntrue\n```\n\n### HAS-A 关系\n\n使用是这种关系的主要用处。如果某个类拥有（HAS-A）某些东西，我们就说两个对象之间存在这种关系。这种关系的主要用途是有助于减少\
  \ Bug 和代码重复。\n\n这里是一个显示对象之间存在 HAS-A 关系的示例。\n\n示例：\n\n```java\npublic class Vehicle{}\n\
  public class Speed{}\npublic class Van extends Vehicle{\n  private Speed sp;\n}\n\
  ```\n\n上面的示例告诉我们 `van` 拥有一个 `speed`。如果我们专门为 `speed` 创建一个单独的类，我们可以在不同的应用程序中反复使用它。\n\
  \n在 Java 中，类只能有单继承。Java 不支持多重继承。每个类都限制为使用 `extends` 关键字进行单继承。然而，允许类实现多个接口。通过这种方式，可以在\
  \ Java 中获得多重继承。下面的语句包含两个带有 `extends` 关键字的类，无法以那样使用该关键字。\n\n`Public class extends\
  \ Animal, Mammal {}`\n\n# 第 7 章：对象的生存与死亡\n\n## 构造函数\n\n在 Java 中，构造函数可以定义为一种特殊的方法，通过它你可以初始化对象。构造函数在对象创建期间被调用。它之所以被称为构造函数，是因为它为对象构造了值。\n\
  \n### Java 中创建构造函数的规则\n\nJava 为构造函数定义了两个基本规则：\n* 构造函数的名称必须与类名完全相同。\n* 构造函数不应该返回值。\n\
  \n### 构造函数的类型\n\n在 Java 中，我们有两种类型的构造函数：\n* 默认构造函数或无参构造函数\n* 参数化构造函数\n\n### Java\
  \ 默认构造函数\n\nJava 默认构造函数是不带参数的构造函数。\n\n默认构造函数的语法：\n`<class_name>()()`\n\n这里是一个简单的默认构造函数的示例。\n\
  \n示例：\n\n```java\nclass Bike1{\n  Bike1(){System.out.println(\"Bike is created\"\
  );}\n  public static void main(String args[]){\n      Bike1 b=new Bike1();\n  }\n\
  }\n```\n\n输出：\n```\nBike is created\n```\n\n这是一个默认构造函数的示例，它提供默认值。在个人示例中，你没有创建任何构造函数。在这里，编译器为你的代码提供了一个默认构造函数，因为没有定义，而\
  \ `0` 和 `null` 值是由默认构造函数提供的。\n\n示例：\n\n```java\nclass Student3{\n  int id;\n  String\
  \ name;\n  void display(){System.out.println(id+\" \"+name);}\n  public static void\
  \ main(String args[]){\n      Student3 s1=new Student3();\n      Student3 s2=new\
  \ Student3();\n      s1.display();\n      s2.display();\n  }\n}\n```\n\n输出：\n```\n\
  null\nnull\n```\n\n### Java 中的参数化构造函数\n\n在 Java 中，如果构造函数带有参数，则被称为参数化构造函数。\n\n我们为什么应该使用参数化构造函数？\n\
  \n当我们给不同的对象赋予不同的值时，使用参数化构造函数。这里是一个参数化构造函数的示例。在下面的示例中，给 `student` 类提供了两个参数。参数化构造函数可以定义任意数量的参数。\n\
  \n示例：\n\n```java\nclass Student4{\n  int id;\n  String name;\n  Student4(int i,String\
  \ n){\n    id = i;\n    name = n;\n  }\n  void display(){System.out.println(id+\"\
  \ \"+name);}\n  public static void main(String args[]){\n      Student4 s1 = new\
  \ Student4(111,\"David\");\n  }\n}\n```\n\n\n\n\n```java\nStudent4 s2 = new Student4(222,\"\
  Aryan\");\n\ns1.display();\n\ns2.display();\n\n}\n\n}\n```\n输出:\n111 David\n222\
  \ Aryan\n\n### Java 中的构造函数重载\n\n构造函数重载是 Java 中的一种技术，通过该技术可以为类提供任意数量不同参数的构造函数。它们可以相同的参数数量，但参数列表不同。编译器会根据参数列表及其类型进行比较。\n\
  \n下面是构造函数重载的示例。\n\n示例：\n\n```java\nclass Student5{\n    int id;\n    String name;\n\
  \    int age;\n    Student5(int i,String n){\n    id = i;\n    name = n;\n    }\n\
  \    Student5(int i,String n,int a){\n    id = i;\n    name = n;\n    age=a;\n \
  \   }\n    void display(){System.out.println(id+\" \"+name+\" \"+age);}\n    public\
  \ static void main(String args[]){\n    Student5 s1 = new Student5(111,\"David\"\
  );\n    Student5 s2 = new Student5(222,\"Aryan\",25);\n    s1.display();\n    s2.display();\n\
  \    }\n}\n```\n\n输出:\n111 David 0\n222 Aryan 25\n\n### Java 中的拷贝构造函数\n\n虽然我们称之为拷贝构造函数，但在\
  \ Java 中并没有这种特定的语法。如果你希望将特定对象的值拷贝到不同的对象中，可以使用以下方法。\n\n*   使用构造函数\n*   将对象的值赋值给另一个对象\n\
  *   你可以使用 `clone()` 方法。它属于 `Object` 类。\n\n下面是一个示例，我们将一个对象的值拷贝到另一个构造函数中。\n\n示例：\n\
  \n```java\nclass Student6{\n    int id;\n    String name;\n    Student6(int i,String\
  \ n){\n    id = i;\n    name = n;\n    }\n    Student6(Student6 s){\n    id = s.id;\n\
  \    name =s.name;\n    }\n    void display(){System.out.println(id+\" \"+name);}\n\
  \    public static void main(String args[]){\n    Student6 s1 = new Student6(111,\"\
  David\");\n    Student6 s2 = new Student6(s1);\n    s1.display();\n    s2.display();\n\
  \    }\n}\n```\n\n输出:\n111 David\n111 David\n\n### 不使用构造函数的值拷贝\n\n正如我们之前讨论的，我们可以在不使用构造函数的情况下将对象的值拷贝到不同的对象中。在这种情况下，你不需要创建构造函数。只需通过将该对象的值赋值给另一个对象即可。在下面的示例中，我们没有使用构造函数，而是通过赋值来进行拷贝。\n\
  \n```java\nclass Student7{\n    int id;\n    String name;\n    Student7(int i,String\
  \ n){\n    id = i;\n    name = n;\n    }\n    Student7(){}\n    void display(){System.out.println(id+\"\
  \ \"+name);}\n    public static void main(String args[]){\n    Student7 s1 = new\
  \ Student7(111,\"David\");\n    Student7 s2 = new Student7();\n    s2.id=s1.id;\n\
  \    s2.name=s1.name;\n    s1.display();\n    s2.display();\n    }\n}\n```\n\n输出:\n\
  111 David\n111 David\n\n### Java 中的垃圾回收\n\nJava 中的“垃圾”可以定义为 Java 中未被引用的对象。回收未使用的内存的过程称为垃圾回收。简单来说，垃圾回收意味着销毁所有不再使用的对象。与\
  \ C 和 C++ 不同，垃圾回收在 Java 中是一个自动过程。这就是 Java 为用户提供更好、更高效内存管理的原因之一。\n\n垃圾回收的优点：\n\n\
  *   垃圾回收通过移除所有未被引用的对象来提高内存效率。这些对象占用堆内存，而垃圾回收会清理这些内存。\n*   用户不需要手动执行垃圾回收，因为 Java\
  \ 中的垃圾回收过程是自动的。因此，我们不需要为管理花费额外精力。Java 虚拟机会负责清理这些内存。\n\n有三种方法可以释放一个对象。它们是：\n\n* \
  \  将引用置空：通过移除对象的引用可以从堆内存中移除该对象。这是一个示例。\n```java\nEmployee e=new Employee();\ne=null;\n\
  ```\n*   通过将对象的引用赋值给另一个对象：移除对象的引用并将其交给另一个对象会导致第一个对象失去引用。众所周知，没有引用的对象将被释放。下面是一个示例。\n\
  ```java\nEmployee e1=new Employee();\nEmployee e2=new Employee();\ne1=e2;\n```\n\
  *   利用匿名对象：这是释放对象的第三种方法。在这里我们将创建一个新对象。\n`new Employee();`\n\n# 第 8 章：类型转换\n\n##\
  \ 通过对象引用进行类型转换\n\n在 Java 中，你可以将对象的类型转换到不同的对象引用。这被称为类型转换。类型转换不仅限于类本身。你可以体验如何转换你的父类或子类类型或接口。对于类型转换，既有编译时规则，也有运行时规则。在对给定对象进行类型转换时，可以分配任何对象的引用。这是因为我们使用的对象类是\
  \ Java 中所有类的父类。类型转换有两种：\n\n*   向上转型 (Upcasting)\n*   向下转型 (Down casting)\n\n类型转换可以隐式或显式地进行。从低级数据结构转换为高级数据结构，则是隐式转换。Java\
  \ 不会自动执行向下转型。向下转型应由用户显式完成。从高级数据结构到数据结构的类型转换需要小心，因为这涉及大量数据。Java 虚拟机在需要时执行向上转型。例如，如果存在几种数据类型，其中一个是高级数据类型，则\
  \ JVM 将所有其他低级数据类型转换为高级数据类型。在上述情况下执行向下转型会导致高级类型对象的数据丢失。在运行时，可能会出现一种名为 `ClassCastException`\
  \ 的异常，即正在进行类型转换的对象与其正在转换的类型不兼容。这是一个解释 `ClassCastException` 的示例。\n\n示例：\n\n```java\n\
  //X 是 Y 和 Z 的父类，Y 和 Z 是兄弟关系。\npublic class RunTimeCastDemo {\n    public static\
  \ void main(String args[]) {\n        X x = new X();\n        Y y = new Y();\n \
  \       Z z = new Z();\n        X xy = new Y(); // 编译通过（向上转型）\n        X xz = new\
  \ Z(); // 编译通过（向上转型）\n        // Y yz = new Z(); 类型不兼容（兄弟关系）\n\n    }\n}\n```\n\n\
  \n\n\n当给一个对象引用赋值时，将执行隐式类型转换。在这里，对象的引用将被赋值给：\n\n*   与类类型相同的引用变量。该类是实例化给定对象的类。每个类的超类都是作为对象的对象。\n\
  *   使用该数据类型可用的引用，该数据类型是实例化对象的类所实现的接口。\n\n以下是一个示例展示了接口 `Automobile`、超类 `Bike` 和子类\
  \ `Ducati`。在这里，你可以看到编译器处理的给定对象引用的自动转换。\n\n```java\ninterface Automobile{\n\n}\n\n\
  class Bike implements Automobile{\n\n}\nclass Ducati extends Bike{\n\n}\n```\n\n\
  示例：假设 `c` 是 `bike` 类类型的变量，`f` 是 `Ducati` 类类型，`v` 是一个 `vehicle` 接口引用。我们可以将 `Ducati`\
  \ 引用赋值给 `bike` 变量：\n\n即我们可以执行以下操作：\n\n#### 示例 1\n```java\nc = f; // 正常，编译通过\n```\n\
  其中 `c = new bike();`\n并且 `f = new Ducati();`\n\n编译器会自动处理转换（赋值），因为类型是兼容的（子类与父类关系），即类型\
  \ `bike` 可以持有类型 `Ducati`，因为一个 `Ducati` 就是一个 `bike`。\n\n#### 示例 2\n```java\nv = c;\
  \ // 正常，编译通过\nc = v; // 从接口类型到类类型的非法转换会导致编译错误\n```\n其中 `c = new bike();`\n并且 `v`\
  \ 是一个 `Vehicle` 接口引用 (`Vehicle v`)\n\n编译器会自动处理转换（赋值），因为类型是兼容的（类与接口 关系），即类型 `bike`\
  \ 可以转换为 `Vehicle` 接口类型，因为 `bike` 实现了 `Vehicle` 接口（`bike` 是一个 `Vehicle`）。\n\n## 对象引用转换：显式转换\n\
  \n有时在 Java 中，当隐式类型转换不起作用或效率不高时，我们必须显式进行类型转换。这种转换非常简单，只需要在成对的括号内指定新“类型”的名称。在这里我们将查看\
  \ `bike` 和 `Ducati` 类的示例。\n\n```java\nclass bike {\nvoid bikeMethod(){\n\n}\n}\n\
  class Ducati extends bike {\n\nvoid DucatiMethod () {\n\n}\n}\n```\n\n在这里，你可以看到我们还有一个\
  \ `brakingsystem()` 函数。该函数接受 `bike` 引用作为输入参数。无论对象类型如何，方法都将调用 `bikemethod()`。这也会调用\
  \ `Ducatimethod()`。如果你想在运行时确定对象的类型，可以使用 `instanceof` 算符。\n\n```java\npublic void\
  \ breakingSystem (bike obj) {\n   obj.bikeMethod();\n   if (obj instanceof Ducati)((Ducati)obj).DucatiMethod\
  \ ();\n}\n```\n\n该操作告诉编译器将作为对象引用的 `bike` 对象视为一个 `Ducati` 对象。在这里，如果不进行转换，编译器会给出错误信息，说明在\
  \ `bike` 的定义中找不到 `Ducatimethod()`。\n\n接下来的示例程序将向你展示带引用的转换运算符。\n\n在此类中，`Honda` 和\
  \ `Ducati` 是兄弟关系。这两个类都是 `bike` 类的子类。它们都拥有 `dirtvehicle` 类，这是一个扩展的对象类。任何无法显式扩展另一个类的类默认情况下都会被对象自动扩展。以下代码实例化了一个特定类的给定对象（在本例中为\
  \ `Ducati` 类），并将对象的引用赋值给 `bike` 类型的变量。此赋值是允许的，因为 `bike` 类是 `Ducati` 的超类。为了使用类类型的引用来调用方法，必须定义该方法，并且方法应该定义在给定类的类层次结构中或上方。\n\
  \n示例程序：\n\n```java\nclass bike extends Object {\n    void bikeMethod() {\n\n   \
  \ }\n}\n\nclass dirtbike extends Object {\n\n}\n\nclass Ducati extends bike {\n\
  \    void DucatiMethod() {\n        System.out.println(\"I am DucatiMethod defined\
  \ in Class Ducati\");\n    }\n}\n\nclass Honda extends bike {\n    void DucatiMethod()\
  \ {\n        System.out.println(\"I am DucatiMethod defined in Class Ducati\");\n\
  \    }\n}\n\npublic class ObjectCastingEx {\n    public static void main(String[]\
  \ args) {\n        bike obj = new Ducati();\n        // 以下将导致编译错误\n        obj.DucatiMethod();\
  \ // 因为 bike 类型未定义方法 DucatiMethod\n        // 以下将导致编译错误\n        ((dirtbike)obj).DucatiMethod();\
  \ // 在 dirtbike 类型中未定义 DucatiMethod\n        // 以下将导致编译错误\n        ((Ducati) obj).DucatiMethod();\
  \ // 以下将编译并运行\n        // hondaObj = (Ducati)obj; 无法转换，因为它们是兄弟关系\n    }\n}\n```\n\
  \n在 Java 中允许将对象引用转换为字符串。这是在处理集合时常见的转换操作之一。\n\n示例：\n\n```java\nimport java.util.Vector;\n\
  \npublic class StringCastDemo {\n    public static void main(String args[]) {\n\
  \        String username = \"asdf\";\n        String password = \"qwer\";\n    \
  \    Vector v = new Vector();\n        v.add(username);\n        v.add(password);\n\
  \        // String u = v.elementAt(0); 无法转换\n        Object u = v.elementAt(0);\
  \ // 未进行转换\n        System.out.println(\"Username : \" + u);\n        // String\
  \ uname = (String)u; // 允许\n        String pass = (String)u; // 允许转换\n        System.out.println(\"\
  Password : \" + pass);\n    }\n}\n```\n\n\n\n\n在编译时检查的异常被称为受检异常（checked exceptions）。在这种情况下，如果一个方法抛出了受检异常，它应该通过使用\
  \ `try-catch` 块进行处理，或者使用 `throws` 关键字对其进行声明。如果没有遵循上述任何方法，编译器将给出编译错误。由于这些异常在编译时就会进行检查，因此它们被称为受检异常。这里有一个示例可以帮助你理解受检异常。\n\
  \n在这个示例中有一个文件 `myfile.txt`。数据将从该文件中读取并显示在屏幕上。该程序中有三个受检异常，下文会有。\n\n### 示例：\n\n```java\n\
  import java.io.*;\n\nclass Example {  \n\n  public static void main(String args[])\n\
  \  {\n      FileInputStream fis = null;\n      /*此构造函数 FileInputStream(File filename)\n\
  \           * 会抛出 FileNotFoundException，这是一个\n           * 受检异常*/\n      fis = new\
  \ FileInputStream(\"B:/myfile.txt\");\n      int k;\n      /*FileInputStream 类的\
  \ read() 方法也会抛出\n           * 受检异常：IOException*/\n      while(( k = fis.read() )\
  \ != -1)\n      {\n          System.out.print((char)k);\n      }\n      /*close()\
  \ 方法关闭文件输入流\n           * 它抛出 IOException*/\n      fis.close();            \n  }\n\
  }\n```\n\n#### 输出：\n\n```\nException in thread \"main\" java.lang.Error: Unresolved\
  \ compilation problems:\nUnhandled exception type FileNotFoundException\nUnhandled\
  \ exception type IOException\nUnhandled exception type IOException\n```\n\n在上面的示例中，检查和异常在编译器在编译时进行了检查，由于我们没有声明这些异常，程序显示了编译错误信息。\n\
  \n下面是另外几个受检异常：\n\n* `SQLException`\n* `IOException`\n* `DataAccessException`\n*\
  \ `ClassNotFoundException`\n* `InvocationTargetException`\n\n## 非受检异常 (Unchecked\
  \ exceptions)\n\n非受检异常本质是在编译时不进行检查的异常。这些异常不会产生编译错误，因为它们在编译时无法被检查。无论你是否声明了异常。非受检异常通常由于用户在与程序交互期间提供的数据。处理这些异常的唯一方法是预见到它们并为该异常编写适当的处理器。`RuntimeException`\
  \ 类是所有非受检异常的父类。这里有一个示例可以帮助你更好地理解非受检异常。\n\n```java\nclass Example {  \n\n  public\
  \ static void main(String args[])\n  {\n      int num1=10;\n      int num2=0;\n\
  \      /*由于我正在用 0 除以一个整数\n         * 它应该抛出 ArithmeticException*/\n      int res=num1/num2;\n\
  \      System.out.println(res);\n  }\n}\n```\n\n如果你编译上面的代码，你会发现编译将是成功的，但是如果你运行它，程序将抛出一个名为\
  \ `ArithmeticException` 的异常。通过此，你知道受检异常不在编译时抛出错误，而是在运行时。这里是另一个示例。\n\n#### 示例：\n\n\
  ```java\nclass Example { \npublic static main(String args[])\n{\n      int arr[]\
  \ ={1,2,3,4,5};\n      /*数组只有 5 个元素，但\n         * 我正尝试显示\n         * 8 个元素的值。它应该抛出\n\
  \         * ArrayIndexOutOfBoundsException*/\n      System.out.println(arr[7]);\n\
  }\n```\n\n在这个示例中，和上一个一样，将不会有编译错误。然而，这段代码在运行时会抛出一个非受检异常 `ArrayIndexOutOfBoundsException`。这些异常在编译时无法发现，并不意味着它们没有被编译器注意到。在上面的示例中，添加一条建议用户提供范围内的值的消息是明智的。添加该消息后的代码如下：\n\
  \n```java\nclass Example { \n     public static void main(String args[])\n     {\n\
  \      try{\n          int arr[] ={1,2,3,4,5};\n          System.out.println(arr[7]);\n\
  \      }catch(ArrayIndexOutOfBoundsException e){\n          System.out.println(\"\
  指定的索引不存在于 \" + \"数组。请纠正错误。\");\n      }\n  }\n}\n```\n\n以下是一些在运行时常见的非受检异常：\n\n*\
  \ `NullPointerException`\n* `ArrayIndexOutOfBoundsException`\n* `ArithmeticException`\n\
  * `IllegalArgumentException`\n\n## 异常 (Exception) 与错误 (Error) 之间的区别：\n\n**异常：**\
  \ 异常发生在代码内部，可以由开发者进行处理。当异常发生时，开发者可以采取必要的行动。下面是一些异常的示例：\n\n* `DivideByZeroException`\n\
  * `NullPointerException`\n* `ArithmeticException`\n* `ArrayIndexOutOfBoundsException`\n\
  \n**错误：** 错误与异常不同。它们是系统尝试不处理的异常状况。当错误发生时，表示系统遇到了严重问题。它们定义了程序在通常情况下无法解决的问题。这里是一些错误的示例：\n\
  \n* `Hardware error`\n* `Memory error`\n* `JVM error`\n\n## 异常处理 (Exception Handling)\n\
  \n异常处理是一种强大的机制，用它可以处理运行时错误。异常处理确保程序的正常流程得以维持。\n\n异常处理的几个优点：\n\n* 如果程序中编写了异常处理，异常处理将允许用户控制程序的执行流。\n\
  * 每当发生错误时，它都会抛出一个异常。调用方法将处理遇到的错误。\n* 通过异常处理，当使用不同的代码块时，可以区分并组织不同类型的错误。可以使用 `try-catch`\
  \ 块来实现。\n\n在这里我们将查看几个异常示例。\n\n#### 示例：\n\n```java\nclass Division {\npublic static\
  \ void main(String args[]) {\nint a, b, result;\nScanner input = new Scanner(System.in);\n\
  System.out.println(\"Input two integers\");\na = input.nextInt();\nb = input.nextInt();\n\
  // try block\ntry {\n  result = a / b;\n  System.out.println(\"Result = \" + result);\n\
  }\n// catch block\ncatch (ArithmeticException e) {\n  System.out.println(\"Exception\
  \ caught: Division by zero.\");\n}\n}\n}\n```\n\n\n\n\n\nJava 和 JavaScript 唯一相似之处是它们的名字听起来相似。除此之外，这两种语言在功能和概念上是完全不同的。让\
  \ JavaScript 区别于 Java 和 `C++` 等面向对象编程语言的特点是，它的对象可以在运行时创建或修改。为了实现这一点，可以向空对象添加方法和属性。一旦创建了对象，可以在创建其他相似对象的过程中作为原型使用。可变参数列表、源码恢复、动态脚本创建、动态对象创建函数变量等都是\
  \ JavaScript 拥有的动态能力。\n\n# JavaScript 基础\n\n## 在 JavaScript 中存储数据\n\n- **本地存储 (Local\
  \ Storage)**：本地存储用于永久性存储数据。通过它，可以随时访问该页面上的数据。本地存储没有过期日期。如果用户希望数据在一段时间内被反复重复使用，可以使用本地存储。\n\
  - **会话存储 (Session Storage)**：会话存储与本地存储不同，因为它只保留单个会话的数据，并在用户关闭页面后丢弃数据。这种存储用于用于订票等网页上。\n\
  \n### 使用变量数据和常量数据存储数据\n\n变量（Variables）和常量（Constants）存储了 JavaScript 中使用的数据和值。它们在\
  \ JavaScript 中都有其重要性。并非所有存储的数据都可以变为常量。像时间倒计时之类的过程使用变量，而常量则用于不变的数据。\n\n- **变量数据 (Variable\
  \ Data)**：顾如其，，随时间改变值的数据被称为变量数据。这种数据在 JavaScript 中被广泛使用。变量在本质上是动态的。\n- **常量数据 (Constant\
  \ Data)**：常量数据是指永远不会改变的值。这种数据随时间保持不变。这种数据是静态的。我们使用这类数据处理无法修改的数据。\n\n## 创建变量和常量\n\
  \n### 声明变量\n\n在名称前加上 `var` 关键字来声明变量。例如，如果你想声明 `group` 为变量，只需在 `group` 之前添加 `var`\
  \ 关键字即可。每个变量都应该以 `;`（分号）结尾。这使得语句是自包含的。在使用单词时需要小心，因为 JavaScript 是区分大小写的。因此，使用的字母必须与原始声明中的完全一致。\n\
  \n例：`var Dell;`\n\n上述对象 `Dell` 被声明为一个变量。\n\n### 声明常量\n\n在名称之前使用 `const` 关键字使其成为常量。这种声明与声明常量非常相似。\n\
  \n例：`const Book;`\n\n在上面的示例中，`Book` 被制为了常量。\n\n## JavaScript 中的决策\n\n经常会出现我们需要在面前的两个路径中选择一条的情况。这时我们能够实现如\
  \ `if` 和 `else` 等条件语句。\n\n`if` 和 `else` 语句可用于决策。这将允许程序选择正确的路径。\n\nJavaScript 支持以下条件语句：\n\
  1. `if` 语句\n2. `if...else` 语句\n3. `if...else if...` 语句\n\n**if 语句**：`if` 是用于决策的基础性语句。在\
  \ `if` 语句中添加一个条件，如果给定的条件成立，就可以给出一组语句。\n\n语法：\n```javascript\nif(condition){\n  要执行的语句\n\
  }\n```\n\n示例：\n```javascript\n<script type=\"text/javascript\">\n<!--\nvar age =\
  \ 20;\nif( age > 18 ){\n  document.write(\"<b>Allowed inside the pub.</b>\");\n\
  }\n//-->\n</script>\n```\n输出：Allowed inside the pub. (如果给出大于 18 的数字)\n\n**if else\
  \ 语句**：这类似于 `if` 语句的扩展。系统运行代码，如果 `if` 语句为假，则执行 `else` 块中的语句。\n\n语法：\n```javascript\n\
  if(condition)\n{语句}\nelse{语句}\n```\n\n示例：\n```javascript\n<script type=\"text/javascript\"\
  >\n<!--\nvar age = 15;\nif( age > 18 ){\n  document.write(\"<b>Allowed inside the\
  \ pub</b>\");\n}else{\n  document.write(\"<b>Is not allowed.</b>\");\n}\n//-->\n\
  </script>\n```\n输出：\nAllowed inside the pub (如果给出大于 18 的数字)\nNot allowed (如果给出小于\
  \ 18 的数字)\n\n**if else if**：这类似于在 `if else` 语句中添加了另一个步骤。当使用一系列条件时，使用它。\n\n语法：\n\
  ```javascript\nif(condition){语句};\nelse if(condition){语句}\nelse if(condition){语句}\n\
  else{语句}\n```\n\n示例：\n```javascript\n<script type=\"text/javascript\">\n<!--\nvar\
  \ book = \"JAVASCRIPT\";\nif( book == \"JAVA\" ){\n  document.write(\"<b>JAVA Book</b>\"\
  );\n}else if( book == \"JAVASCRIPT\" ){\n  document.write(\"<b>JAVASCRIPT Book</b>\"\
  );\n}else if( book == \"DBMS\" ){\n  document.write(\"<b>DBMS Book</b>\");\n}else{\n\
  \  document.write(\"<b>UNKNOWN Book</b>\");\n}\n//-->\n</script>\n```\n输出：JAVASCRIPT\
  \ book\n\n**嵌套 if (The nested if)**\n\n`嵌套 if` 是另一个 `if` 语句内部的 `if` 语句。\n\n语法：\n\
  ```javascript\nif(condition) {\n  if(condition){语句} \n}\n```\n\n**switch 和 break\
  \ 语句**\n\n`switch` 语句后面会跟多个不同的语句。根据表达式的值执行相应的语句。\n\n语法：\n```javascript\nswitch (表达式)\n\
  {\n  case 条件 1: 语句\n    break;\n  case 条件 2: 语句\n    break;\n  ...\n  case 条件 n:\
  \ 语句\n    break;\n  default: 语句\n}\n```\n`break` 语句用于指示 `switch` 的结束。\n\n## JavaScript\
  \ 中的循环\n\n**for 循环 (The for Loop)**：如果想要重复相同的代码，则使用循环。`for` 循环是三种循环之一。`for` 循环简单且紧凑。它包含以下点：\n\
  \n1. 初始化语句在循环开始前执行。\n2. 只有当给定的条件为真时，循环才会执行。运行一次代码。\n3. 迭代计数器可以增加或减少。\n\n语法：\n```javascript\n\
  for (初始化; 测试条件; 迭代){\n  条件为真时执行的语句(s)\n}\n```\n\n示例：\n```javascript\n<script type=\"\
  text/javascript\">\n<!--\nvar count;\ndocument.write(\"This will repeat 10 times\"\
  \ + \"<br />\");\nfor(count = 0; count < 10; count++){\n  document.write(\"Currently\
  \ repeated : \" + count );\n  document.write(\"<br />\");\n}\ndocument.write(\"\
  Done!!\");\n//-->\n</script>\n```\n输出：\nThis will repeat 10 times\nCurrently repeated\
  \ : 0\nCurrently repeated : 1\nCurrently repeated : 2\nCurrently repeated : 3\n\
  Currently repeated : 4\nCurrently repeated : 5\nCurrently repeated : 6\nCurrently\
  \ repeated : 7\nCurrently repeated : 8\nCurrently repeated : 9\nDone!!\n\n# 第 11\
  \ 章：JavaScript 中的函数和事件\n\n## 什么是函数？\n\n在程序任何需要的地方都可以被重复使用的一组代码被称为函数。它减少了反复编写相同代码的时间和精力。通过函数可以编写模块化代码。可以通过函数将大型程序划分为许多或所需的部分。JavaScript\
  \ 像任何其他编程语言一样，支持编写模块化代码所需的功能。这是通过使用函数实现的。\n\n`write()` 和 `alert()` 是默认函数。JavaScript\
  \ 为用户提供了许多可以直接使用的函数。\n\nJavaScript 还允许我们创建自己的自定义函数。\n\n### 函数定义\n\n函数在使用之前应该先定义。`function`\
  \ 关键字是 JavaScript 中定义函数的常用方法。它后面跟着一个唯一的函数名和参数列表。它还包含一个带有大括号的语句块。\n\n语法：\n```javascript\n\
  <script type=\"text/javascript\">\n<!--\nfunction 函数名(参数列表)\n{\n  语句\n}\n//-->\n\
  </script>\n```\n\n\n\n\n\n示例：在下面的示例中，有一个简单的函数程序。\n\n```javascript\nfunction simplefunction()\n\
  {\n  alert(\"This is a simple function\");\n}\n```\n\n### 调用函数\n\n在 JavaScript 中调用函数，应按照如下方式编写该函数的名称。\n\
  \n```javascript\nsimplefunction();\n```\n\n### 函数参数\n\n在 JavaScript 中，函数也可以带有参数传递。在调用函数时，JavaScript\
  \ 可以传递不同的参数。可以对函数中传递的参数进行操作。使用逗号来分隔函数中的多个参数。\n\n#### 示例\n\n在接下来的示例中，我们将修改我们的 `simplefunction`\
  \ 函数。现在我们将使用两个参数。\n\n```javascript\nfunction simplefunction(name, age)\n{\n  alert(\
  \ name + \" is \" + age + \" years old.\");\n}\n```\n\n该函数可以被调用。可以如下所示进行调用。\n\n\
  ```javascript\nsimplefunction('Zara', 7 );\n```\n\n### return 语句\n\n如果用户希望从函数获取返回值，则可以在\
  \ JavaScript 函数中添加一个可选的 `return` 语句。`return` 语句始终应该是函数的最后一个语句。\n\n例如，用户可以在特定函数中传递两个不同的数字，并期望函数在程序中返回这两个数字的乘积。\n\
  \n#### 示例\n\n```javascript\nfunction concatenate(first, last)\n{\n  var full;\n\
  \  full = first + last;\n  return full;\n}\n```\n\n现在可以如下所示调用函数：\n\n```javascript\n\
  var result;\nresult = concatenate('Zara', 'Ali');\nalert(result );\n```\n\n## JavaScript\
  \ 中的事件\n\n#### 事件\n\n事件处理 JavaScript 与 HTML 之间的交互。当用户或浏览器对页面进行操作时，就会发生这种情况。\n\n\
  一切都是事件。页面加载是一个事件。当用户通过点击选择某些内容时，该点击也被视为一个事件。事实上，用户执行的任何操作如关闭窗口、选择链接、按下按键、关闭标签页、调整窗口大小等，都是事件的示例。\n\
  \n在 JavaScript 中编写的响应通过这些事件执行，例如关闭窗口、要显示的文本、显示的警框、确认消息或任何可能发生的响应。\n\n事件是文档对象模型 (DOM)\
  \ Level3 的一部分。每个 HTML 元素都提供一组事件。这些事件会触发 JavaScript 中的代码。\n\n#### onclick 事件类型\n\n\
  这是一个事件，点击时会显示预期的验证或警告等。这被广泛使用。\n\n示例：下面的代码，当点击 `onclick` 上的 hello 按钮时，它会触发 `events`\
  \ 函数。\n\n```html\n<html\n<head>\n<script type=\"text/javascript\">\nfunction events()\
  \ {\n  alert(\"Hello World\")\n}\n</script>\n</head>\n<body>\n<input type=\"button\"\
  \ onclick=\"sayHello()\" value=\"Say Hello\" />\n</body>\n</html>\n```\n\n#### onsubmit\
  \ 事件类型\n\n`onsubmit` 事件是另一个重要的事件类型。在此处提交表单时，会发生验证。只有当函数返回 `true` 时，文本才会被发送。\n\n\
  #### 示例\n\n```html\n<html\n<head>\n<script type=\"text/javascript\">\nfunction validation()\
  \ {\n  所有的验证逻辑都写在这里\n  .........\nreturn 返回 true 或 false\n}\n</script>\n</head>\n\
  <body>\n<form method=\"POST\" action=\"t.cgi\" onsubmit=\"return validate()\">\n\
  .......\n<input type=\"submit\" value=\"Submit\" />\n</form>\n</body>\n</html>\n\
  ```\n\n# 第 12 章：JavaScript 中的调试\n\n在编写程序时有很多机会可能出错。脚本中的此类错误被称为 bug。\n\n调试是修复 bug\
  \ 的过程。在开发过程中，调试是正常的一部分。我们编写的代码可能包含逻辑错误或语法错误，这些错误很难被识别。很多时候，当 JavaScript 代码包含错误时，什么都不会发生。没有消息会指示程序存在错误。\n\
  \n## 使用 JavaScript 验证器\n\n如果有人想检查代码中的 bug，则必须确保它是有效代码，并检查它是否遵循该语言的官方语法规则，这可以通过运行一个名为验证解析器（Validating\
  \ parsers）的程序，或者简称为验证器（Validators）来完成。它们通常与 JavaScript 编辑器和商业 HTML 编辑器一起提供。\n\n\
  访问网页后，将代码粘贴到文本区域，点击一次 `jslint` 按钮。该程序将解析我们的 JavaScript 代码，以确保所有变量和函数定义符合正确的语法。\n\
  \n## 在程序中添加调试代码\n\n`alert()` 或 `document.write()` 方法有助于调试你的代码。例如：\n\n```javascript\n\
  var debugging = true;\nvar whichImage = \"widget\";\nif( debugging )\n  alert( \"\
  Calls swapImage() with argument: \" + whichImage );\nvar swapStatus = swapImage(\
  \ whichImage );\nif( debugging )\n  alert( \"Exits swapImage() with swapStatus=\"\
  \ + swapStatus );\n```\n\n## 使用调试器\n\n调试器是一个允许程序员控制脚本执行的应用程序。它是按行运行的，并被指示在断点处停止。程序员可以在执行完成后检查脚本的状态和变量。\n\
  \n## 表单验证\n\n在客户端输入所需信息并点击提交按钮后，会发生表单验证。如果用户输入了无效信息，服务器必须向用户返回数据。\n\n- **基础验证**：为了确保每个必填字段都提供了数据，首先需要检查需求。\n\
  - **数据格式验证**：用于检查表单是否输入了正确的数据。\n\n让我们看看基础表单验证是如何实现的。在提交事件发生时，我们调用 `validate()` 函数进行验证。`validate()`\
  \ 函数实现如下：\n\n```javascript\nfunction validate()\n{\n  if( document.myForm.Name.value\
  \ == \"\" )\n  {\n    alert( \"请输入您的姓名!\" );\n    document.myForm.Name.focus() ;\n\
  \    return false;\n  }\n  if( document.myForm.EMail.value == \"\" )\n  {\n    alert(\
  \ \"请输入您的邮箱 ID!\" );\n    document.myForm.EMail.focus() ;\n    return false;\n \
  \ }\n  if( document.myForm.Zip.value == \"\" || isNaN( document.myForm.Zip.value\
  \ ) || document.myForm.Zip.value.length != 5 )\n  {\n    alert( \"请输入格式为 ##### 的邮编。\"\
  \n    document.myForm.Zip.focus() ;\n    return false;\n  }\n  if( document.myForm.Country.value\
  \ == \"-1\" )\n  {\n    alert( \"请输入您的国家名称!\" );\n    return false;\n  }\n  return(\
  \ true );\n}\n```\n\n## 数据格式验证\n\n在数据提交到 Web 服务器之前可以对数据进行验证。验证邮箱 ID 意味着意味着 ID 应该包含\
  \ `@` 符号和点（`.`），如下面的示例所示。此外，最后一个点在 `@` 符号之后至少要有一个字符，且邮箱地址不应以 `@` 符号开头。\n\n```javascript\n\
  function validateEmail()\n{\n  var emailID = document.myForm.EMail.value;\n  atpos\
  \ = emailID.indexOf(\"@\");\n  dotpos = emailID.lastIndexOf(\".\");\n  if (atpos\
  \ < 1 || ( dotpos - atpos < 2 ))\n  {\n```\n\n\n\n\n\n```javascript\nalert(\"\n\n\
  Please enter a valid email ID\n\n\")\n\ndocument.myForm.EMail.focus() ;\n\nreturn\
  \ false;\n\n}\n\nreturn( true );\n\n}\n\n//-->\n\n```</script>\n\n# 第 13 章：JavaScript\
  \ 中的对象\n\n## JavaScript - 对象：\n\nJavaScript 中的对象由属性组成。如果一个属性包含一个函数，则该属性被视为方法，否则该属性被视为属性（属性）。\n\
  \n## 对象属性：\n\n对象的属性可以是任何数据类型。\n\n当需要向对象添加属性时，使用以下语法：\n\n| `objectName.objectProperty\
  \ = propertyValue;` | |\n\n## 示例：\n\n接下来的示例展示了如何使用文档对象的 \"title\" 属性：\n\n| `var\
  \ strg = document.title;` |\n\n## 对象方法：\n\n允许对象执行特定任务的函数。\n\n## 示例：\n\n下面的示例展示了如何使用\
  \ `write()` 方法：\n\n| `document.write(\"This is text\");` |\n\n## 自定义对象\n\n### new\
  \ 运算符\n\n`new` 运算符有助于创建对象的实例。要创建一个对象，构造方法紧跟在 `new` 运算符之后。\n\n在下述示例中，`Object()`、`Array()`\
  \ 和 `Date()` 是构造方法，它们是 JavaScript 的内置函数。\n\n| `var emp = new Object();var textbooks\
  \ = new Array(\"C\", \"Python\", \"Java\");var day = new Date(\"August 21, 1987\"\
  );` |\n\n### Object() 构造函数：\n\n可以通过构造函数创建并初始化对象。`Object()` 是一个特殊的构造函数，有助于构建对象。\n\
  \n下面的示例展示了如何创建一个对象：\n\n| `<html><head><title>用户定义的对象 </title><script type=\"text/javascript\"\
  >var book = new Object();   // 创建对象    book.subject = \"Perl\"; // 为对象分配属性    book.author\
  \  = \"Yashwanth\";</script></head><body><script type=\"text/javascript\">   document.write(\"\
  Book name is : \" + book.subject + \"<br>\");   document.write(\"Book author is\
  \ : \" + book.author + \"<br>\");</script></body></html>` |\n\n## JavaScript Native\
  \ 对象\n\nJavaScript 由许多内置原生对象组成。它们的行为不受运行它们的浏览器或平台的影响。\n\n以下是 JavaScript 中最常用的原生对象列表：\n\
  \n1. Number 对象\n2. Boolean 对象\n3. [String](http://www.tutorialspoint.com/javascript/javascript_strings_object.htm)\
  \ 对象\n4. JavaScript Math 对象\n\n## Number 对象\n\nJavaScript 中的数字对象（此处原文为复数：number\
  \ objects）用于表示数值。它可以同时持有整数和浮点值。\n\n每当遇到数值时，网络浏览器会自动将这些值转换为 `number` 类实例。\n\n语法：\n\
  \n创建数字对象的语法如下：\n\n| `var value = new Number(number);` |\n\n### Number 方法\n\n以下是数字对象中包含的方法。\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| [`constructor()](http://www.tutorialspoint.com/javascript/number_constructor.htm)\
  \ | 此方法用于返回创建对象实例的函数。 |\n| [`toExponential()](http://www.tutorialspoint.com/javascript/number_toexponential.htm)\
  \ | 该方法的结果是以指数形式显示标准范围数字。 |\n| [`toLocaleString()](http://www.tutorialspoint.com/javascript/number_tolocalestring.htm)\
  \ | 该方法接收一个数字并返回该数字的字符串版本。它是根据网络浏览器的区域设置进行格式化的。 |\n| [`toPrecision()](http://www.tutorialspoint.com/javascript/number_toprecision.htm)\
  \ | 该方法定义了在给定数字中显示的位数。这包括小数点两侧的数字。 |\n| [`toString()](http://www.tutorialspoint.com/javascript/number_tostring.htm)\
  \ | 此方法有助于将数字转换为字符串值。 |\n| [`valueOf()](http://www.tutorialspoint.com/javascript/number_valueof.htm)\
  \ | 此方法表示数字的值。 |\n\n## Boolean 对象\n\nBoolean 对象用于表示一个可以是“真”（True）值也可以是“假”（False）值的值。\n\
  \n语法：\n\n可以使用以下语法创建 Boolean 对象：\n\n| `var bval = new Boolean(value);` |\n\n如果 `value`\
  \ 参数持有以下任何值之一：空字符串、null、0、Nan、-0、null 或 undefined，则 Boolean 对象的初始值为 `false`。\n\n\
  ### Boolean 方法：\n\n以下是 Boolean 对象中包含的方法。\n\n| 方法 | 描述 |\n| :--- | :--- |\n| [`toSource()](http://www.tutorialspoint.com/javascript/boolean_tosource.htm)\
  \ | 此方法用于返回由 Boolean 对象源码组成的字符串。可以使用该字符串创建一个等的对象。 |\n| [`toString()](http://www.tutorialspoint.com/javascript/boolean_tostring.htm)\
  \ | 此方法用于根据对象的值返回 ‘true’ 字符串或 ‘false’ 字符串。 |\n| [`valueOf()](http://www.tutorialspoint.com/javascript/boolean_valueof.htm)\
  \ | 此方法用于返回 Boolean 对象的值。 |\n\n## String 对象：\n\nString 对象允许用户处理字符。\n\n语法：\n\n可以使用以下语法创建\
  \ String 对象：\n\n| `var value = new String(string);` |\n\n`string` 参数代表一组字符。\n\n\
  ### String 方法\n\n| 方法 | 描述 |\n| :--- | :--- |\n| [`charCodeAt()](http://www.tutorialspoint.com/javascript/charat.htm)\
  \ | 此方法返回指定索引处字符的 Unicode 值。 |\n| [`concat()](http://www.tutorialspoint.com/javascript/concat.htm)\
  \ | 此方法用于连接两个字符串并返回新创建字符串。 |\n| [`match()](http://www.tutorialspoint.com/javascript/match.htm)\
  \ | 此方法用于用正则表达式匹配字符串。 |\n| [`toLocaleLowerCase()](http://www.tutorialspoint.com/javascript/tolocalowercase.htm)\
  \ | 用于在区域设置的情况下将字符串转换为小写。 |\n| [`toLocaleUpperCase()](http://www.tutorialspoint.com/javascript/tolocercase.htm)\
  \ | 用于在区域设置的情况下将字符串转换为大写。 |\n| `toLowerCase()` | 返回一个将大写字母转换为小写的字符串。 |\n| `toUpperCase()`\
  \ | 返回一个将小写字母转换为大写的字符串。 |\n\n## Math 对象\n\n它允许用户执行许多数学计算。通过编写对象名称、点以及后续的方法名称来调用对象方法。参数写在方法的括号中。\n\
  \ndocument.writeln(Math.sqrt(81));\n\n以下是 Math 对象中一些常用的函数：\n\n| 方法 | 描述 |\n| :---\
  \ | :--- |\n| `abs(x)` | x 的绝对值 |\n| `ceil(x)` | 将 x 向上取整到不小于 x 的最小整数。 |\n| `round(x)`\
  \ | 将 x 四舍五入到最近的整数。 |\n| `pow(x , y)` | x 的 y 次 |\n| `floor(x)` | 将 x 向下取整到不大于 x\
  \ 的最大整数。 |\n\n# 结语\n\n我们已经到达了 Java 和 JavaScript 编程基础书籍的最后。\n\n感谢你购买本书。我希望这本书对你有所帮助，并帮助你理解使用\
