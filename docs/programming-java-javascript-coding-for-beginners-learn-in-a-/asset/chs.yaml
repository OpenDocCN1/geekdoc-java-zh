  \ >= 0.0)\n      {\n          salary = newSalary;\n      }\n  }\n\n  public double\
  \ computePay()\n  {\n      System.out.println(\"Computing salary pay for \" + getName());\n\
  \      return salary/52;\n  }\n}\n```\n\n现在看下面的程序并尝试预测输出结果：\n\n```java\n/* File\
  \ name : VirtualDemo.java */\n\npublic class VirtualDemo\n{\n  public static void\
