    We''ll develop a simple compass app that will utilize the internal accelerometer
    and magnetometer sensors of the Android device. Accelerometer is a sensor which
    converts the mechanical acceleration information to electrical signals and similarly
    a magnetometer is used to translate the magnetic field intensity to electronic
    signals.


    Most Android devices have an accelerometer and a magnetometer sensor inside therefore
    using a compass app only requires software rather than additional hardware.


    As we develop our compass app, we''ll learn setting permissions to use sensors,
    reading acceleration and magnetic field data in Java code, extracting the orientation
    data from the sensor data and animating images. In the end, we''ll have a complete
    compass app that we can use in daily life.


    # 8.1. Setting up the Required Permissions


    Let''s start by creating an Android project first. I named the project as Compass
    App and selected Empty Activity as the default activity type. The minimum API
    is also set to 15.


