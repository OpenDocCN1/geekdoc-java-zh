    \ 24sp（sp = 比例无关像素），并通过点击 `textStyle` 部分中的 **B** 按钮将其样式设置为**粗体**。\n\n我们现在已经完成了用户界面的设置。由于我们不希望第一个应用具有某些交互功能，目前我们不需要编写任何代码。当然，在接下来的项目中我们会进行大量的编码工作，但此处我们不需要任何代码。\n\
    \n## 3.6. 构建项目并在模拟器上运行\n\n我们的第一个 Android 应用现在已经准备好在模拟器上运行了。在 Android Studio 中这非常简单。我们在上一章中已经设置了一个\
    \ Nexus 5 模拟器，那里我们只需要做的是：\n- i) 构建项目\n- ii) 选择模拟器，然后，\n- iii) 在模拟器上运行我们的应用。\n\n\
    ## Android Studio 移动应用开发入门指南\n\n![](img/86af6710fca68834c439be9649970710_35_0.png)\n\
    \n图 3.13. `TextView` 的可编辑属性\n\n为了构建并运行项目，请点击图 3.13 中箭头所示的“Run”按钮。将弹出图 3.14 所示的模拟器和设备选择对话框。由于我们之前创建过\
    \ Nexus 5 模拟器，它会被自动选中，如矩形所示。如果我们通过 USB 数据线向电脑连接了真实的 Android 设备，它也会显示在此对话框中。然而，由于目前没有连接真实设备，对话框顶部会显示图中椭圆所示的警告。请点击“Next”，然后模拟器将像真实设备一样启动。根据你的电脑速度，完全启动模拟器需要一些时间（大约\
