  md: "# CHAPTER 6. ANDROID APP #2: BMI CALCULATOR\n\n# 6.7. Final Notes\n\nAs you\
    \ can see from Figure 6.11, the BMI value is displayed with a lot of unnecessary\
    \ floating point digits. Probably only a single decimal digit is enough. We can\
    \ use the following code to trim the decimal digits of the BMI variable and assign\
    \ the trimmed value to a new double type BMI_trimmed:\n\n```\nDecimalFormat df\
    \ = new DecimalFormat(\"#.#\");\ndouble BMI_trimmed = Double.parseDouble(df.format(BMI));\n\
    ```\n\nCode 6.11\n\nThe DecimalFormat class is used for these types of operations.\
    \ Android Studio automatically adds the required library by the code line:\n\n\
    ```\nimport android.icu.text.DecimalFormat;\n```\n\nCode 6.12\n\nThe modified\
    \ complete MainActivity.java is also given as follows:\n\n```\npackage com.helloworld.quantum.bmmicalculator;\n\
    \nimport android.graphics.Color;\nimport android.graphics.drawable.ColorDrawable;\n\
