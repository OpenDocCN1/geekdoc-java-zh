    - **manifests 文件夹：** 此文件夹包含 AndroidManifest.xml 文件。它包含了配置参数，如权限、服务和额外的库。

    - **java 文件夹：** 源代码文件位于此文件夹中。

    - **res 文件夹：** 资源包含在此文件夹中。例如，如果我们想在项目中包含图像文件，我们将其放在“res”中。


