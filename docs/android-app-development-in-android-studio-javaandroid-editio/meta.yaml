  mdcn: "\n我们的下一个小节将关于 Java 中的逻辑决策结构，让我们休息一下喝咖啡，然后继续学习 if-else 和 switch-case 语句。\n\
    \n## 4.4. Java 中的逻辑决策语句\n\n决策在编程中和日常生活问题中一样，被广泛使用。我们在日常生活中经常做出逻辑决策，例如：\n\n- 如果咖啡好喝，我就再来一杯，否则我就去买杯茶。\n\
    - 如果下雨了我就带伞，否则我就不带。\n\n在编程语言中，决策语句控制现实生活中某个条件是否满足。Java 中有两种决策语句：if–else 和 switch–case\
    \ 块。\n\nif-else 结构：在这种条件判断中，如果满足条件，则执行 `if` 块中的代码。如果不满足条件，则执行 `else` 块中的代码。因此，如果我们需要使用\
    \ if–else 块来实现“下雨不下雨”的例子，可以如下所示：\n\n```java\nif (it’s rainy) {\n    I’ll take\
    \ my umbrella.\n} else {\n    I’ll not take my umbrella.\n}\n```\n\n让我们看看如何ing\
