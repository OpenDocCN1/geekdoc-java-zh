    \    for (int counter = 0; counter<=50; counter++) {\n        sum = sum + counter;\n\
    \    }\n    System.out.println(\"Sum is \" + sum);\n}\n}\n```\n\nIn this code,\
    \ a variable called sum is created to hold the sum. A for loop is defined in which\
    \ an integer variable named counter is created and looped from 0 to 50. In the\
    \ for loop, the loop variable is incremented by 1 in each iteration by the expression\
    \ counter++. Therefore, the counter variable takes the values of 0, 1, 2, 3, ...,\
    \ 50 as the loop continues to cycle. When it takes the value 51, the loop condition\
    \ counter<=50, which means equal or lower than 50, is not satisfied therefore\
    \ the loop ends without performing the loop operation for counter = 51.\n\nThe\
    \ variable sum is initialized to 0 and then the counter is added to the loop block\
    \ by the expression: sum=sum+counter. This method adds the numbers from 0 to 50\
    \ to the sum variable. In the end, the sum variable is printed on the terminal\
