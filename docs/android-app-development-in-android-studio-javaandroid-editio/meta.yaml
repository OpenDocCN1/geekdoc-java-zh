    royalty free image shown in Figure 8.1 for this aim (I chose this because it looks
    sort of ancient like an ancient compass ☺️). You can download this image from
    the book''s companion website as usual. You can course use any other image like
    in your project. Please copy and paste this image to your drawable folder as we
    did before. The name of the image is compass.png, we''ll use its name to access
    it in our code.'
