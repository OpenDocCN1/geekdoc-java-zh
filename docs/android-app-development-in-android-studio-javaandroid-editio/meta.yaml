    \ “Build number” may be different however I’m sure you can find it easily in the\
    \ Settings -> About section. Once you find the Build number, tap on it seven times\
    \ and your device will show a dialog “You’re now a developer.”\n\nAfter you've\
    \ enabled the Developer Mode, you'll find a new section called “Developer options”\
    \ under the Settings of your device. Please tap on it and then check “USB debugging”\
    \ to enable debugging via the USB connection.\n\n2. Things to be done in Android\
    \ Studio: First of all, please enable “ADB Integration” from Tools -> Android\
    \ -> ADB Integration as shown below:\n\n![](img/86af6710fca68834c439be9649970710_40_0.png)\n\
    \nFigure 3.21. Enabling ADB Integration in Android Studio\n\nYou can now install\
