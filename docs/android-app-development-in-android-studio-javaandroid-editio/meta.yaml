  md: '# BEGINNER''S GUIDE TO MOBILE APP DEVELOPMENT IN ANDROID STUDIO


    Let''s analyse the default MainActivity.java code line by line:


    +   - The first line is the `package` definition as in usual Java code. It shows
    to which this file belongs to.

    - The next two lines are `import` lines which import the required libraries. In
    our file, the `AppCompatActivity` and `Bundle` libraries are imported. They contain
    the base methods for user interaction and passing data among different activities.

    - The next line declares the `MainActivity` class which extends the `AppCompatActivity`
    class. This is like the class definition in Java. As in Java, the class name in
    Android should match the name of the `.java` file. In this case, the file is `MainActivity.java`
    therefore the name of the class is `MainActivity`.

    - Then an `@override` command is placed by default. It is used to tell the compiler
    that the current class will override any existing superclasses.

    - The sixth line defines a method called `onCreate()`. All activities are started
    by a sequence of method calls. `onCreate()` is the first of these calls.

    - The next line, `super.onCreate(savedInstanceState);`, tells that our code will
    be executed in addition to the existing code (if any) of the parent class.

    - In the last line, `setContentView()` sets the activity content from a layout
    source. We set up our app''s layout in the file `activity_main.xml`. Android accesses
    all resources via an auxiliary class called `R`. The R class is a special class
    which enables Android toutilize the resources in a simpler way compared to accessing
    via file paths. The argument of the `setContentView()` method is `R.layout.activity_main`
    which means “set the content of the activity to be the layout residing in activity_main.xml”


    We hear the word **activity** a lot in Android programming. Activity is a class
    that manages the user interface and the interaction of the app with the user.'
