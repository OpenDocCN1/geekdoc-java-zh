    \n图 7.8 放置所有所需对象后的 GUI\n\n我们需要骰子图像、结果 TextView 和按钮的 ID，因为我们将在代码中访问它们。我已将它们的 ID\
    \ 分别分配为 `diceimage`、`rollResult` 和 `rollButton`。\n\n## 7.3. 开发应用的主代码\n\n让我们开始编写一个按钮监听器，它将在用户点击“Roll!”时被调用。按钮监听器的模板如代码\
    \ 7.1 所示（在之前的章节中已开发）。在此方法中，声明了一个名为 `button` 的 Button 对象，并通过该对象访问 GUI 上的按钮。然后通过\
    \ `setOnClickListener()` 方法监听此按钮的点击。程序如下：\n\n```java\npublic void myButtonClickListener()\
    \ {\n    Button button = (Button) findViewById(R.id.rollButton);\n    button.setOnClickListener(new\
