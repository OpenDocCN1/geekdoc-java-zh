    We''ll develop a simple dice rolling app in this chapter. We''ll learn how to
    use images in the GUI and also code for basic random number generation in Java
    for rolling a virtual dice. When we hit a Roll button, the app will choose a number
    between 1 and 6 randomly, show the result as a number in a TextView and also display
    a dice image that shows the outcome.


    Please create a new project and save it on your computer. Select an empty activity
    as usual. I named project as Dice Roller but you can of course give any name you''d
    like.


    First of all, let''s design the user interface. While the activity_main.xml file
    is opened in Android Studio, please change the default TextView''s text from Hello
    World to Dice Roller and position it on the top of the GUI aligned horizontally
    in the middle as shown in Figure 7.1.


    We need now to place an ImageView component which will be used to display the
    dice face images. However, we first need to import the image files to the project.
    When the app starts, it is good to show a generic dice image and then change the
    image to the respective dice face image when the user rolls the dice. For this,
    we need to insert a generic dice image and 6 dice face images to Android Studio.
    These images are shown in Figure 7.2 which can be downloaded from the book''s
    companion website www.android-java.website.'
