    ## 第3章 实战测试：Hello World 应用


    我连接了我的华硕 Zenfone 6，因此设备选择窗口中显示了它的名称；如果你连接的设备不同，这里自然会有所不同。在选择设备后，点击“OK”按钮，图 3.18
    所示的应用程序界面就会出现在你的真实设备上。如果你在真实设备上看到了“Hello World!”文本，那太棒了。你现在已经知道如何在真实的 Android
    设备上安装你的应用程序了。在真实硬件上运行程序有时是至关重要的，因为像发送短信和拨打电话等操作只能在真实设备上完成。


    我们开发了实战测试应用“Hello World”，并学习了：


    - i) 创建一个 Android Studio 项目，

    - ii) 使用用户界面和控件（widgets），

    - iii) 创建模拟器，

    - iv) 编译应用，

    - v) 在模拟器上运行我们的应用，

    - vi) 在真实设备上运行我们的应用。


    但正如你可能注意到的，我们还没有与应用没有任何交互。它只是在屏幕上写了一段文字，仅此而已。为了让应用程序执行某些功能，我们需要对其进行编程。Java 是开发
    Android 应用时主要的编程语言。我们将在下一章学习 Java 基础，这将使我们能够将想法转化为运行的 Android 应用。在开始 Java 课程之前，让我们来喝杯咖啡吧（推荐
    3合1 咖啡，因为我们需要葡萄糖）。


    ## 第4章


    ## JAVA 基础


    ### 4.1. 什么是 Java？


    我们开发了第一个应用。这太好了。然而，它只是在屏幕上写了一段文字，仅此而已。用户与我们的应用没有任何交互。为了让应用程序具有交互性并执行真实任务，我们需要告诉它做什么。而且我们需要精确地告诉它。我们通过使用编程语言来实现这一点。


    正如老话所说：“计算机其实相当笨”。这是因为：**当我们告诉计算机执行一项任务时，必须用精确的术语来表达。** 让我们用一个例子来解释这一点：想象你度过了疲惫的一天，肚子饿着回家。在
    M4 高速公路上，牛津附近的交通堵塞了，你有时间思考晚餐吃什么。你突然想起冰箱里有冷冻的鸡肉咖喱（chicken korma）。你打了了妻子的电话（当然用免提！）让她做那道菜。


    你 —— 嗨，亲爱的，希望你一切都好。


    妻子 —— 谢谢，有点累。你呢？


    你 —— 我也是。而且非常饿。你能请为我做一份冷冻的鸡肉咖喱吗？冰箱里应该还有。我确定你也会喜欢的，我知道你很爱吃。


    你的伴侣 —— 好吃好吃。我会的，亲爱的，等你回来时它就滋滋作响了。等见，拜拜。（真是贴心的妻子！）


    你 —— 谢谢，亲爱的，拜拜。


    ## ANDROID STUDIO 移动应用开发入门指南


    然后，她会在冰箱的任何地方找到冷冻咖喱，拆开包装，撕掉外壳，并在膜盖上戳几个孔。设置定时，开启微波炉（或烤箱）并烹饪。她会直接煮好附带的香饭而不需要问你。就这样。然而，如果你有一个拥有电脑大脑的机器人妻子，对话会更像这样：


    你 —— 嗨，亲爱的，你很好。


    机器人妻子 —— 谢谢。你还好吗？（语气一点也不浪漫！）


    你 —— 非常累。非常饿。你能请为我做一份冷冻的鸡肉咖喱吗？冰箱里应该还有。


    机器人妻子 —— 冰箱里的冷冻咖喱在哪里？你需要我一起煮香饭吗？你想要正常熟的还是过熟的？你还要大蒜包吗？你希望什么时候准备好？……


    你 —— 停，请停下。我会开车去餐厅吃。


    机器人妻子 —— 我不懂，你说话没重点……


    事实上，，任何可编程的数字设备都大同小异。我们必须告诉它们精确的内容。我们通过使用编程语言来实现。有许多不同的编程语言用于为不同的平台开发软件。你可以在 TIOBE
    索引网站查看广泛使用的编程语言及其排名：http://www.tioobe.com/tioobe-index/。有时选择使用哪种编程语言是很困难的。不存在一种通用的完美/全能语言；它们都有自己的优缺点。


    当我们查看 TIOBE 索引时，看到 Java 多年来一直是最常用的编程语言。这有几个原因。主要原因是：i) 具有平台独立性，ii) 拥有大量的库，iii)
    面向对象，iv) 具有强大的安全性和健壮性。因为这些原因，Android 应用也主要用 Java 开发。因此，为了学习 Android 应用开发，我们必须掌握
    Java 编程语言的基础。学习 Java 后，我们将使用 Java 调用 Android SDK 库并开发 Android 应用。


    我们可以使用独立的 Java 编译器或 Java 专用的 IDE 来学习 Java。不过，通过一个简单的技巧，也可以在 Android Studio 中尝试
    Java 代码。由于我们已经安装了 Android Studio，在这里我们将用它来进行 Java 编码。


    ### 4.2. 使用 Android Studio 进行 Java 编码


    首先，我们需要启动 Android Studio 并创建一个项目。我们可以随心为项目命名并选择任何版本。项目的结构如下：


    | 组件 | 描述 |

    | :--- | :--- |

    | Package (包) | 定义文件的命名空间 |

    | Class (类) | 代码的主模板 |

    | Method (方法) | 执行任务的代码块 |


    在我们的案例中，文件名是 JavaBasics。文件内容如下：


    ```java

    package com.example.javabasics;


    public class JavaBasics {


    }

    ```


    第一行定义了包含这些文件的包。第二行是类的定义。第三行是类的结束括号。类体是空的，因此这个 Java 程序在编译和运行时不会执行任何操作。我们将在下一章学习如何在内部编写代码。


