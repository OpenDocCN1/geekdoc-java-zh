    # BEGINNER''S GUIDE TO MOBILE APP DEVELOPMENT ANDROID STUDIO


    ## 3.3. Main Sections of the IDE


    Android Studio is a sophisticated tool, therefore it has dozens of properties
    to make app development easier. Instead of giving every detail of this IDE at
    once, I prefer to explain and teach in a slower way so that the reader can grasp
    the app development contents in a solid way. Let''s start with explaining the
    main sections of Android Studio referring to Figure 3.6.


    ![](img/86af6710fca68834c439be9649970710_27_0.png)


    Figure 3.6. Basics sections of Android Studio


    The sections of Android Studio in the figure above can be summarized as follows:


    **Section 1.** The project files and folders can be viewed from here. In addition,
    new files can be added from this pane. We need to double-click on the filenames
    here to open them in the middle pane. The project structure will be explained
    in the next subsection.


    **Section 2.** The opened files can be activated from the tabs located here for
    viewing in the middle pane.


    **Section 3.** This is the middle pane. Contents of the active files can be viewed
    and changed from here. For the project shown in Figure 3.6, the file called “MainActivity.java”
    is the active tab in Section 2 therefore the middle pane in Section 3 shows the
    contents of this “MainActivity.java” file.


    **Section 4.** This section is also controlled via tabs. The developer can switch
    project files, structures, captures and favourites for viewing in the left pane.


    **Section 5.** The current or previous compilation, building or debugging processes
    are shown here. For the snapshot of Figure 3.6, it is indicated that the “Gradle
    build finished in 14 seconds”. Gradle is the build system of Android Studio. Therefore,
    the message says that the building engine completed its previous task in 14 seconds.


    **Section 6.** This is the **Run** button of Android Studio. When we set up the
    user interface and write the Java code of a project, we click this button to make
    the Android Studio build the project (which means creating the executable file
    from project files) and then we can run it on an emulator or on a real device.


    ## 3.4. Folder and File Structure of an Android Studio Project


    The file structure of an Android project can be viewed in various forms in Android
    Studio. The button just at above the left pane (shown by the arrow) is used to
    open the selection box for choosing the preferred method of viewing the file hierarchy
    as shown in Figure 3.7. The default file viewer is the “Android” mode which is
    the easiest way of grouping files and folders in my opinion. When the selection
    is the “Android” mode, the default files and folders shown in Figure 3.8 are in
    the left pane.


    The folders'' contents are explained as follows:


    - **manifests folder:** This folder has the AndroidManifest.xml file. This contains
    configuration parameters such as permissions, services and additional libraries.

    - **java folder:** The source code files reside in this folder.

    - **res folder:** The resources are contained in this folder. For example, if
    we want to include an image file in our project, we place this file inside “res”.


    # BEGINNER''S GUIDE TO MOBILE APP DEVELOPMENT ANDROID STUDIO


    ![](img/86af6710fca68834c439be9649970710_29_0.png)


    Figure 3.7. Switching among ways of viewing the folders


    # CHAPTER 3. TEST DRIVE: HELLO WORLD


    ![](img/86af6710fca68834c439be9649970710_30_0.png)


    **Figure 3.8.** Folder and file structure of an Android project


    ## 3.5. Building the User Interface


    Android Studio provides an easy way of designing user interfaces. The file named
    activity_main.xml under the “res/layout” folder contains all the layout information.
    If we try to open an .xml file outside of Android Studio it is opened by a text
    editor or browser. However, when we open an .xml file in Android Studio, it reads
    the .xml file and shows the corresponding activity layout with its components.
    In order to open the activity_main.xml in Android Studio, please double-click
    on it in the project explorer and the activity layout will be displayed in the
    middle pane:


    ![](img/86af6710fca68834c439be9649970710_31_0.png)


    Figure 3.9. Layout of the activity


    As you can see, the layout of the activity is shown in middle pane. The name of
    the app appears at the top of the activity. The default activity contains a default
    text which is shown inside the circle in the above figure. At the left top of
    the middle pane, there exists a tab called “Palette” indicated inside the rectangle
    in the figure. When we click on this tab, the palette shown in Figure 3.10 appears
    from which we can add all possible user interface objects and layout templates
    to the activity.


    ![](img/86af6710fca68834c439be9649970710_32_0.png)


    **Figure 3.10.** The component palette


    When the palette tab is clicked, two panes are opened: the Palette shown by the
    upper rectangle and the Component Tree pane inside the lower rectangle in Figure
    3.10.


    The Palette contains several groups like Widgets, Text Fields and Layouts. We
    can easily drag and drop these components to the user interface. On the other
    hand, the Component Tree lists the activity''s components in a hierarchical manner.
    We''ll see the utilization of these components as we develop complex apps in the
    following chapters.

