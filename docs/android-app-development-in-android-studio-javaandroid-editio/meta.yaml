  mdcn: "\n方法对于开发者之间共享代码也同样重要。如果我们可以在互联网上找到一个现成的方法，就可以轻松地在应用程序中使用它。\n\n方法始终是类的一部分。因此，现在让我们关注类、对象和继承，它们是所谓的“面向对象编程”的骨柱。\n\
    \n## 4.7. Java 中的类、对象和继承\n\nJava 编程语言结合使用了传统的（过程化）和面向对象的概念，以提供更强大的体验。过程化编程意味着程序按照顺序执行执行过程和函数。这是传统的方法。另一方面，面向对象编程使用类以及从这些类派生出的对象来执行所需的计算步骤。那么，什么是类和对象呢？\n\
    \n我们可以将类比为蓝图，将对象比作使用该蓝图制造的不同产品。同样，我们可以把汽车工厂作为类和对象的例子。每当我们改变颜色、行李箱尺寸、方向盘等时，我们可以在不改变汽车基本属性的情况下获得一辆不同的汽车。如果汽车的品牌和型号是\
    \ Virtua 和 Liberty（假设名称！），那么生产出的就是 Virtua Liberty 1.6、Virtua Liberty 2.0、Virtua\
    \ Liberty 3.0、Virtua Liberty 1.6 premium、Virtua Liberty 2.0 diesel 等。在这种情况下，类是\
    \ Virtua Liberty，而所有这些假设的模型都是属于该类的对象。我们可以将其想象为图 4.26 所示。\n\n让我们先在 Java 中声明一个 Car\
    \ 类，然后如代码 4.31 所示定义从该类派生的汽车对象。在代码中，通过 `public static class Car` 定义了一个名为 Car 的类，它拥有名为\
    \ `colour`（颜色）、`fuel type`（燃料类型）和 `engine_capacity`（发动机容量）的变量。这些是每个从该类派生的对象都不同的变量。\n\
    \n在类定义内部，有一个方法声明 `public Car(String carColour, String carFuelType, float CarEngineCapacity)`。这是一个与类名同名的构造方法，类变量通过代码\
    \ 4.33 所示的代码行在该方法内部赋值。\n\n### 类对象\n\n![](img/86af6710fca68834c439be9649970710_79_0.png)\n\
    \n图 4.26. 示例说明类与对象的关系\n\n```java\npackage com.helloworld.quantum.helloworld;\n\
    public class JavaClassMain1 {\n    public static class Car {\n        static String\
    \ colour;\n        static static String fuel_type;\n        static float engine_capacity;\n\
    \        public Car(String carColour, String carFuelType, float CarEngineCapacity){\n\
    \            colour=carColour;\n            fuel_type=carFuelType;\n         \
    \   engine_capacity = CarEngineCapacity;\n        }\n    }\n\n    public static\
    \ void main(String args[]) {\n        Car myCar = new Car(\"Red\", \"Diesel\"\
    , 1.2f);\n        System.out.println(myCar.colour);\n    }\n}\n```\n\n代码 4.32\n\
    \n## 第 4 章 Java 基础\n\n| 变量 | 赋值 |\n| :--- | :--- |\n| colour | carColour; |\n\
    | fuel type | carFuelType; |\n| engine capacity | CarEngineCapacity; |\n\n代码 4.33\n\
    \n最后，在程序的 main 函数内部，通过以下行创建了一个名为 myCar 的 Car 对象：\n\n|Car myCar = new Car(\"Red\"\
    , \"Diesel\", 1.2f);|\n\n代码 4.34\n\n请注意 `new` 关键字用于使用类创建对象。我们可以将此对象声明行读取为“使用 Car\
    \ 类和参数 'Red'、'Diesel' 和 '1.2f' 创建了一个名为 myCar 的对象”。\n\n一旦创建了对象，我们就可以使用点运算符 (.)\
    \ 访问它的变量和方法。在代码 4.31 的最后一行代码中，myCar 对象的 colour 变量通过表达式 `myCar.colour` 被提取并打印在终端上。输出结果如图\
    \ 4.27 所示的 myCar 对象的颜色变量。\n\n我们可以使用我们的类定义任意数量的不同对象：\n\n|Car yourCar = new Car(\"\
    White\", \"Gasoline\", 1.6f);|\n|Car newCar = new Car(\"Grey\", \"Diesel\", 2.0f);|\n\
    \n代码 4.5\n\n类对象概念的力量源于单个对象提供的变量和方法，以及轻松使用相同类结构的可能性。\n\n我们可以按照通常的方法定义向类添加一个方法。例如，如代码\
    \ 4.35 所示，添加一个显示燃料类型的方法。\n\n![](img/86af6710fca68834c439be9649970710_81_0.png)\n\
    \n图 4.27. Java 中的类和对象示例\n\n"
