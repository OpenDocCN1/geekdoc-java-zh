- md: "\n# Chapter 7\n\n## ANDROID APP #3: SIMPLE DICE ROLLER\n\n## 7.1. Creating\
    \ the Project and Adding an ImageView Widget\n\nWe'll develop a simple dice rolling\
    \ app in this chapter. We'll learn how to use images in the GUI and also code\
    \ for basic random number generation in Java for rolling a virtual dice. When\
    \ we hit a Roll button, the app will choose a number between 1 and 6 randomly,\
    \ show the result as a number in a TextView and also display a dice image that\
    \ shows the outcome.\n\nPlease create a new project and save it on your computer.\
    \ Select an empty activity as usual. I named project as Dice Roller but you can\
    \ of course give any name you'd like.\n\nFirst of all, let's design the user interface.\
    \ While the activity_main.xml file is opened in Android Studio, please change\
    \ the default TextView's text from Hello World to Dice Roller and position it\
    \ on the top of the GUI aligned horizontally in the middle as shown in Figure\
    \ 7.1.\n\nWe need now to place an ImageView component which will be used to display\
    \ the dice face images. However, we first need to import the image files to the\
    \ project. When the app starts, it is good to show a generic dice image and then\
    \ change the image to the respective dice face image when the user rolls the dice.\
    \ For this, we need to insert a generic dice image and 6 dice face images to Android\
    \ Studio. These images are shown in Figure 7.2 which can be downloaded from the\
    \ book's companion website www.android-java.website.\n\n**Figure 7.1.** TextView\
    \ showing the title of the app\n\n**Figure 7.2.** Dice face images and their filenames\
    \ used in the app\n\n## CHAPTER 7. ANDROID APP #3: SIMPLE DICE ROLLER\n\nPlease\
    \ select and right-click -> copy all of these images in the file explorer of your\
    \ computer (just as you do when you select files for copy-paste) and then right-click\
    \ -> paste in the drawable folder in Android Studio shown below:\n\nFigure 7.3.\
    \ Adding image files to the Android Studio project\n\nWhen we click the arrow\
    \ symbol just at the left of the drawable folder, we can see the newly added image\
    \ files as in Figure 7.4.\n\nFigure 7.4. The image files imported in the project\n\
    \nLet's place the ImageView object to the GUI now. Please find the ImageView object\
    \ in the Palette and drag and drop to the app's layout follows:\n\nFigure 7.5.\
    \ Adding an ImageView object\n\nWhen we drop the ImageView on the GUI, Android\
    \ Studio wants us to set its image as in Figure 7.6. The selected image will be\
    \ the image shown inside the ImageView when the app first starts (i.e. default\
    \ image). Therefore, please select the dicegeneral.png as in Figure 7.6.\n\n**Figure\
    \ 7.6.** Selecting the default image for the ImageView\n\nAfter this selection,\
    \ press OK and then the layout of our app will be shown as follows:\n\n**Figure\
    \ 7.7.** The layout after placing the ImageView\n\n## 7.2. Adding the Other Widgets\
    \ and Setting up the IDs\n\nPlease place a TextView and a Button just below the\
    \ ImageView object which will display the result of the rolling and initiate the\
    \ rolling, respectively. I have set the TextView to show Please tap the button....\
    \ Similarly, the button's text is changed to ROLL! as shown below:\n\nFigure 7.8.\
