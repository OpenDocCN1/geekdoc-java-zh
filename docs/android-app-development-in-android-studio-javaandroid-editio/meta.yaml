    ## CHAPTER 5. ANDROID APP #1: RED/BLUE LIGHTHEAD


    In our app, the default ID of the button widget is set as button Android Studio.
    We can change it just by clicking the ID box and replacing the button text.


    The next two boxes refer to the layout width and layout height properties of the
    button widget. Their settings determine the width and the height of the button
    object in the GUI. They are set as wrap_content by default. This means that the
    width and the height of the button will be adjusted to wrap (cover) the text inside
    the button (i.e. button’s label). The other available choice for these parameters
    is the match_parent as shown in Figure 5.15. If this is selected, the respective
    property (width or height) will be equal to the width or height of its parent
    container (which is the RelativeLayout covering the whole screen in this example).


    ![](img/86af6710fca68834c439be9649970710_96_0.png)


    **Figure 5.15.** The alternatives for the layout_width and layout_height parameters


    Since we don’t want the button to have a width or height filling the whole GUI,
    we need to leave these parameters having the value of wrap_content.


    In our app, the button is supposed to change the background colour of the screen
    therefore it is good to change the label of the button accordingly. The button’s
    label (the text on the button) is **Button** by default. Let’s change it to “Change!”
    as shown in Figure 5.16.


