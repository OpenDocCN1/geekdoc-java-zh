    # ANDROID STUDIO 应用开发初学者指南


    ## 3.3. IDE 的主要部分


    Android Studio 是一个复杂的工具，因此它有几十个属性来使应用开发变得更容易。与其一次性给出此 IDE 的所有细节，我更倾向于以较慢的速度解释和教学，以便读者能够稳固地掌握应用开发内容。让我们结合图
    3.6 开始解释 Android Studio 的主要部分。


    ![](img/86af6710fca68834c439be9649970710_27_0.png)


    图 3.6. Android Studio 基础部分


    图中 Android Studio 的部分可以总结如下：


    **区域 1。** 可以从这里查看项目文件和文件夹。此外，可以从此面板添加新文件。我们需要双击这里的文件名以便在中间窗格中打开它们。项目结构将在下一个小节中解释。


    **区域 2。** 可以从位于此处的标签激活已打开的文件以便在中间窗格中查看。


    **区域 3。** 这是中间窗格。可以从这里查看和更改活动文件的内容。对于图 3.6 所示的项目，名为“MainActivity.java”的文件是区域 2
    中的活动标签页，因此区域 3 中的中间窗格显示了该“MainActivity.java”文件的内容。


    **区域 4。** 此区域也通过标签页控制。开发者可以切换项目文件、结构、捕获和收藏夹，以便在左侧窗格中查看。


    **区域 5。** 此处显示当前或上一次的编译、构建或调试过程。对于图 3.6 的快照，它显示“Gradle build finished in 14 seconds”。Gradle
    是 Android Studio 的构建系统。因此，该消息表示构建引擎在 14 秒内完成了其之前的任务。


    **区域 6。** 这是 Android Studio 的 **Run**（运行）按钮。当我们设置用户界面并编写项目的 Java 代码时，我们点击此按钮让
    Android Studio 构建项目（这意味着从项目文件创建可执行文件），然后我们可以在模拟器或真实设备上运行它。


    ## 3.4. Android Studio 项目的文件夹和文件结构


    Android 项目的文件结构可以在 Android Studio 中以多种形式查看。位于左窗格正上方的按钮（如箭头所示）用于打开选择首选文件层级查看方法的选择框，如图
