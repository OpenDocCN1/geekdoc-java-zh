    # Android Studio 中 Android 应用开发入门指南


    最初，Android 由一家名为 Android Inc. 的公司创建的。Google 在 2005 年收购了这家公司。此后，Google 将其开源，Android
    获得了巨大的动力。如图 1.1 所示，Android 在 2016 年的市场份额约为 85%（数据来源：http://www.idc.com/）。考虑到这一市场份额，投资
    Android 应用开发显然是非常有回报的。


    ![](img/86af6710fca68834c439be9649970710_9_0.png)


    **图 1.1.** 2015-Q4 至 2016-Q3 移动操作系统的市场份额


    Android 有七个主要版本，并带有若干次小修订。为了及早跟随这些版本，开发者用 Cookie 名称来命名它们。流行的 Android 版本有 Kitkat
    (Android 4.4)、Lollipop (Android 5.1) 和 Marshmallow (Android 6.0)（https://www.statista.com/statistics/217174/share-of-android-platforms-on-mobile-devices-android-os/）。Nougat
    (Android 7.0) 也在变得流行。随着版本的提升，Android 变得越来越强大。然而，在应用开发过程中我们必须小心选择版本，因为并不是每个设备都使用最新版本。如果我们为
    Lollipop 开发一个应用，它可能无法在安装了 Froyo 的设备上运行。幸运的是，Android Studio 允许我们选择兼容性。


    Android 不仅用于智能手机，还用于平板电脑、笔记本电脑、数字电视游戏设备，甚至用于如 UDOO 等单板计算机。因此，在开发应用之前，我们首先需要选择目标设备和版本。


    ## 1.2. Android 应用是如何工作的？


    程序在各种平台上运行有不同的方式。最低层的软件可以用机器码编写，直接运行在微处理器上。这如图 1.2 所示。由于很难在机器码中开发复杂的应用程序，操作系统在应用软件和硬件之间提供了一个通信和控制层，如图
    1.3 所示。如果我们想为特定的硬件/操作系统开发用于运行地应用程序，我们必须使用编译器和链接器来完成。编译器和链接器获取源代码并创建实际上在操作系统上运行的可执行文件，如图
    1.4 所示。例如，如果我们想用 C++ 编程语言开发一个应用程序，我们就必须利用编译/链接过程。


    ![](img/86af6710fca68834c439be9649970710_10_0.png)


    **图 1.2.** 机器码 – 硬件关系


    原生应用程序的主要优势是速度。然而，缺点是不同平台之间互不兼容。例如，我们不能在 Ubuntu 上运行原生 Windows 应用程序，反之亦然。虚拟机的概念是为了是为了克服这一局限性。虚拟机是运行在操作系统上的软件，并为开发者提供了一种抽象，如图
    1.5 所示。应用软件运行在虚拟机之上。


    ![](img/86af6710fca68834c439be9649970710_11_0.png)


    **图 1.3.** 硬件与应用之间的操作系统层


    ![](img/86af6710fca68834c439be9649970710_11_1.png)


    **图 1.4.** 从源代码创建原生可执行文件


    因此，只要计算机运行着虚拟机，应用软件就可以在独立于硬件操作系统的计算机上运行。一个很好的例子是 Java 虚拟机 (JVM)，JVM 运行在几乎所有的操作系统和平台上。因此，当我们开发
    Java 软件时，它将独立于操作系统/平台运行。


    在虚拟机上运行的应用明显优势可以描述为：“一次开发，到处运行”。然而，在虚拟机上运行的应用比原生应用慢。


    虚拟机的通用开发过程如图 1.6 所示。


    ## 第一章 引言


    ![](img/86af6710fca68834c439be9649970710_12_0.png)


    **图 1.5.** 应用与操作系统之间的虚拟机


    ![](img/86af6710fca68834c439be9649970710_12_1.png)


    **图 1.6.** 从源代码创建中间代码 – 中间代码由虚拟机解释


    与 Java 应用类似，Android 应用也运行在 JVM 上。Android 使用两个特殊的虚拟机：Dalvik Machine (DVM) 和 Android
    Runtime (ART)。这些是可以在低资源运行的专用 JVM。.apk 文件（Android 应用的可执行文件）实际上运行在这些虚拟机上。直到 Lollipop
    发布（Android 5.0）之前，DVM 一一直是默认运行时环境（虚拟机）。ART 从 Android 4.0 开始引入并从 Android 5.0 起成为默认
    VM。DVM 和 ART 基本执行相同的工作：独立于平台运行 Android 应用。ART 相对于 DVM 的优势是提前编译 (AOT)，它比实时编译 (JIT)
    快。在 AOT 中，应用在安装期间编译，因此降低了 CPU 使用率。


