    \n![](img/86af6710fca68834c439be9649970710_41_1.png)\n\nFigure 3.23. Selecting\
    \ the real device\n"
  mdcn: "\n\n## Android Studio 移动应用开发入门指南\n\n让我们将这段由 `TextView` 控件组成的文本放置在视图的中间。为了这一点，请选择此\
