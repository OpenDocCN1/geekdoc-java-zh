    We''ll write our main code inside the onChanged() method. However, before moving
    on to the main code, let''s write the onResume() and onPause() methods for the
    main activity because sensors are power hungry components therefore it is important
    to pause and resume the sensor listeners when the activity pauses and resumes.
    For this, we simply add the following code just below the end of the onCreate()
    method:


    ```

    protected void onResume() {

    super.onResume();

    mensorManager.registerListener(this,

