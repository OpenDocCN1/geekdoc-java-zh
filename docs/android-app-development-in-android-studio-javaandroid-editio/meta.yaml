  md: '# Chapter 10


    # ANDRIOD APP # 6: S.O.S. MESSAGE SENDER


    # 10.1. Introduction


    Most of the Android devices have the capability of GSM connection therefore it
    is useful to learn SMS messaging in Android. A class called SmsManager enables
    us to design apps that can easily send and receive SMS programmatically. You''ll
    see how this class is used in this chapter.


    We''ll develop an app which sends the current location to pre-defined recipients
    using SMS. This app can be useful in case of emergency in deserts or if you''re
    boozed in a disco when you cannot type text in the message field and need to send
    your location to a mate to take you home.


    # 10.1. Adding the Required Permissions


    Firstly please create a standard Android Project having an empty activity and
    a target SDK version of 22 or lower. I named my project as S.O.S. Sender. We''ll
    use the location taken from the GPS sensor and send it with SMS. We, need to add
    both GPS usage and SMS sending permissions to the AndroidManifest.xml file as
    follows:


    ```

    <uses-permission name="android.permission.ACCESS_FINE_LOCATION />

    <uses-permission name="android.permission.SEND_SMS" />

    ```


    After inserting these permissions, AndroidManifest.xml file looks as shown below:


    ```

    <<?xml version="1.0" encoding="utf-8"?>

    ```'
