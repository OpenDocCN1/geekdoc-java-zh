    # 7.1. Creating the Project and Adding an ImageViewview Widget


    We''ll develop a simple dice rolling app in this chapter. We''ll learn how to
    use images in the GUI and also code for basic random number generation in Java
    for rolling a virtual dice. When we hit a Roll button, the app will choose a number
    between 1 and 6 randomly, show the result as a number in a TextView and also display
    a dice image that shows the outcome.


    Please create a new project and save it on your computer. Select an empty activity
    as usual. I named project as Dice Roller but you can of course give any name you''d
    like.


