    \ 类时，Android Studio 会通过一个红色灯泡警告我们，我们需要在代码中实现所需的方法：\n\n![](img/86af6710fca68834c439be9649970710_150_0.png)\n\
    \n图 8.8 实现所需方法的警告\n\n请点击“Implement methods”（实现方法），然后当我们在点击对话框中的“OK”按钮时，Android\
    \ Studio 将自动放置 `onChanged()` 和 `onSensorChanged()` 方法：\n\n![](![](img/86af6710fca68834c439be9649970710_150_1.png)\n\
    \n图 8.9 显示将要实现的方法的对话框\n\n# Android Studio 移动应用开发初学者\n\nAndroid Studio 自动将以下代码放入\
    \ `MainActivity.java` 中：\n\n```java\n@Override\npublic void onChanged(SensorEvent\
    \ event) {\n}\n\n@Override\npublic void onAccuracyChanged(Sensor sensor, int accuracy)\
    \ {\n}\n```\n\n我们将主代码写在 `onChanged()` 方法中。然而，在编写主代码之前，让我们先为主活动编写 `onResume()`\
    \ 和 `onPause()` 方法，因为传感器是耗电型组件，因此在活动暂停和恢复时暂停和恢复传感器监听器是非常重要的。对于这一点，我们只需在 `onCreate()`\
    \ 方法末尾下方添加以下代码：\n\n```java\nprotected void onResume() {\n    super.onResume();\n\
    \    compassSensorManager.registerListener(this,\n    accelerometer, SensorManager.SENSOR_DELAY_UI);\n\
    \    compassSensorManager.registerListener(this,magnetometer, SensorManager.SENSOR_DELAY_UI);\n\
    }\n\nprotected void onPause() {\n    super.onPause();\n    compassSensorManager.unregisterListener(this);\n\
    }\n```\n\n在 `onResume()` 方法中，注册了传感器监听器，这意味着当活动恢复时，传感器会再次开启。同样地，当活动暂停时，在 `onPause()`\
    \ 方法中取消注册（断开）传感器。\n\n我们现在准备好编写主代码了。首先，让我们定义两个 `float` 类型的数组来存储加速度计和磁计的输出数据。这些将是数组变量，这些传感器的输出是矢量，即它们在不同方向上有不同的值。我们可以如下为这些传感器定义数组\
    \ `accel_read` 和 `magnetic_read`：\n\n```java\nfloat[] accel_read;\nfloat[] magnetic_read;\n\
    ```\n\n请将这些声明写在 `onSensorChanged()` 方法之前，以便我们可以在该方法的任何地方访问这些变量。\n\n在 `onSensorChanged()`\
    \ 方法内部：当有新的传感器事件时，该方法会被自动调用，因此我们在这个方法中编写主代码。以下代码创建 GUI 的 `ImageView` 和 `TextView`\
    \ 对象，它们会在传感器事件发生时更新：\n\n```java\ntv_degrees = (TextView) findViewById(R.id.tv_degrees);\n\
    iv_compass = (ImageView) findViewById(R.id.iv_compass);\n```\n\n然后，以下代码读取加速度计和磁计传感器，并将输出存储到\
    \ `accel_read` 和 `magnetic_read` 数组中：\n\n```java\nif (event.sensor.getType() ==\
    \ Sensor.TYPE_ACCELERETER)\n    accel_read = event.values;\nif (event.sensor.getType()\
    \ == Sensor.TYPE_MAGNETIC_FIELD)\n    magnetic_read = event.values;\n```\n\n如果传感器输出可用（即它们不为\
    \ null），我们将在 `getRotationMatrix()` 方法中使用 `accel_read` 和 `magnetic_read` 变量获取设备的旋转矩阵\
    \ `R`：\n\n```java\nif (accel_read != null && magnetic_read != null) {\n    float\
    \ R[] = new float[9];\n    float I[] = new float[9];\n```boolean successfulreadread\
    \ = SensorManager.getRotationMatrix(R, I, accel_read,\n```_\n代码 8.15（接上页）\n\n\
    如果此操作成功，旋转矩阵将为 `R`。在这种情况下，我们准备好获取角度如下：\n\n```java\nif (successful_read) {\n  \
    \  float orientation[] = new float[3];\n    SensorManager.getArrayTo(orientation,\
    \ R);\n    azimuth_angle = Math.toDegrees(orientation[0]);\n}\n```\n代码 8.16\n\n\
    # Android Studio 移动应用开发指南\n\n## Android 应用：指南针\n\n根据角度旋转 `ImageView` 也是很好的。对于这种动画，我们需要声明一个持有角度的\
    \ `float` 变量。然后，可以使用以下动画代码旋转 `ImageView`：\n\n```java\nfloat current_degree = 0f;\n\
    RotateAnimation rotate = new RotateAnimation(current_degree, current_degree +\
    \ 360);\nrotate.setDuration(1000);\nrotate.setFillAfter(true);\niv_compass.startAnimation(rotate);\n\
    ```代码 8.17在此代码中，我们声明了一个动画并设置了持续时间。`startAnimation` 启动了 `ImageView` 的旋转。结合这些代码行，我们得到了所示的\
    \ `MainActivity.java`：\n\n```java\npackage com.example.atomic.compass;\n\nimport\
