    ## BEGINNER''S GUIDE TO MOBILE APP DEVELOPMENT IN ANDROID STUDIO


    Java is, of course, a very extensive programming language and Java SDK has thousands
    of methods for developing sophisticated Java programs. However, I think this Java
    basics lecture ensures for starting to develop Android apps. I''m sure you''ll
    get used to writing Java code in the upcoming chapters.


    ![](img/86af6710fca68834c439be9649970710_85_0.png)


    Figure 4.29. Class extension example in Java


    The good news is that the boring stuff ends here and the function is: actual Android
    app development–developing apps that actually do something. We''ll design apps
    that interact with the user and use the wonders of Android platform like SMS sending
    and GPS reading. Let''s have a coffee and relax for some time before beginning
    the next chapter where we''ll start our Android development journey.


    ## Chapter 5


    ## ANDROID APP #1: RED/BLUE LIGHTHEAD


    We''ll develop a simple strobe light app in this project. We''ll go through accessing
    the button in Java code, getting the screen background colour, setting this colour
    and sensing button taps to change the background colour.


    Our aim is to develop an Android app where the background colour of the app is
    varied as in a red/blue strobe light. The background colour of the app will change
    from red to blue or vice versa each time we click a button located in the middle
    of the screen. This is a very simple app but will teach us the basics of visual
    programming.


    ### 5.1. Creating a New Android Project


    Firstly, select “Create a new project”. If Android Studio is already running,
    File -> New -> New Project from the top menu as shown below:


