    \                break;\n            case 'E':\n                System.out.println(\"\
    Your grade is very low. You have to study again.\");\n                break;\n\
    \            default:\n                System.out.println(\"Not a grade\");\n\
    \        }\n    }\n}\n```\n\n代码 4.19 在此中，grade 变量类型为 char。default 块在 Java 中不是强制性的，但正如我们在\
    \ Android 应用中看到的很有用。如果输入 A、B、C、D、E 以外的字符，程序将在终端上打印“Not a grade”。\n\n## 4.5. Java\
    \ 中的循环\n\n编程中经常需要以重复的形式执行操作。这些重复通过循环完成。例如，让我们尝试计算 1 到 50 的和。如果没有循环，我们将执行如下：\n\n\
    ```java\nint sum = 0;\nsum = sum + 1;\nsum = sum + 2;\nsum = sum + 3;\n// ...\
    \ 44 行代码\nsum = sum + 48;\nsum = sum + 49;\nsum = sum + 50;\n```\n\n代码 4.20 在省略号所示的行中必须有\
    \ 44 行代码（上文缩写）。如你所见，如果没有循环，这个简单的任务将需要 51 行代码。而且，它很容易出错。请记住，我们希望用尽可能短的代码来完成编程，以防止错误。\n\
    \nJava 有三种类型的循环：for 循环、while 循环和 do-while 循环。\n\n1. **for 循环**：当我们知道操作执行次数时，使用\
    \ for 循环。for 循环的标准结构如下：\n\n```java\nfor (type counter = initial value; counter\
    \ check; counter increment/decrement statement) {\n    重复执行的代码\n}\n```\n\n代码 4.21\n\
    \n- 计数器是一个整数变量。\n- 在每次循环后，计数器变量根据 (counter increment/decrement statement) 中的表达式进行递增或递减。\n\
