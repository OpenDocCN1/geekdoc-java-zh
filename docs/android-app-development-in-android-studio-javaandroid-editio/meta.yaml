    \ DecimalFormat class is used for these operations. Android Studio automatically\
    \ adds the required library by the code line: The modified MainActivity.java is\
    \ also given as follows:\n\n```java\npackage com.helloworld.quantum.bmicalculator;\n\
    \nimport android.support.v7.app.AppCompatActivity;\nimport android.os.Bundle;\n\
    import android.view.View;\nimport android.widget.Button;\nimport android.widget.EditText;\n\
    import android.widget.RelativeLayout;\nimport android.widget.TextView;\nimport\
    \ java.text.DecimalFormat;\n\npublic class MainActivity extends AppCompatActivity\n\
    {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
    \       super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
    \        myButtonListenerMethod();\n    }\n\n    public void myButtonListenerMethod()\
    \ {\n        Button button = (Button) findViewById(R.id.button);\n        button.setOnClickListener(new\
    \ View.OnClickListener() {\n            @Override\n            public void onClick(View\
    \ v) {\n                final EditText height = (EditText) findViewById(R.id.height);\n\
    \                String heightStr = height.getText().toString();\n           \
    \     double height = Double.parseDouble(heightStr);\n                final EditText\
    \ weight = (EditText) findViewById(R.id.weightInput);\n                String\
    \ weightStr = weight.getText().toString();\n                double weight = Double.parseDouble(weightStr);\n\
    \                double BMI = (weight)/(height*height);\n                final\
    \ EditText BMIResult = (EditText) findViewById(R.id.BMIResult);\n            \
    \    BMIResult.setText(Double.toString(BMI));\n                String BMI_Cat;\n\
    \                if (BMI < 15)\n                    BMI_Cat = \"Very severely\
    \ underweight\";\n                else if (BMI < 16)\n                    BMI_Cat\
    \ = \"Severely underweight\";\n                else if (BMI < 18.5)\n        \
    \            BMI_Cat = \"Underweight\";\n                else if (BMI < 25)\n\
    \                    BMI_Cat = \"Normal\";\n                else if (BMI < 30)\n\
    \                    BMI_Cat = \"Overweight\";\n                else if (BMI <\
    \ 35)\n                    BMI_Cat = \"Obese Class 1 - Moderately Obese\";\n \
    \               else if (BMI < 40)\n                    BMI_Cat = \"Obese Class\
    \ 2 - Severely Obese\";\n                else\n                    BMI_Cat = \"\
    Obese Class 3 - Very Severely Obese\";\n\n                final TextView BMICategory\
    \ = (TextView)\n                    findViewById(R.id.BMICategory);\n        \
    \        BMICategory.setText(BMI_Cat);\n            }\n        });\n    }\n}\n\
    ```\n\nWhen the modified code is used, the calculation result is displayed in\
    \ the emulator as follows:\n\n![](img/86af6710fca68834c439be9649970710_128_0.png)\n\
    \nFigure 6.12. The sample BMI calculation with trimmed BMI digits\n\n**Note 2.**\
