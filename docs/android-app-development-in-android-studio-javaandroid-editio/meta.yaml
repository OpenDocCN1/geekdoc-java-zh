    \    break;\n  case 6:\n    img.setImageResource(R.drawable.dice6);\n    break;\n\
    }\n```\n代码 7.5\n\n请注意，我们通过 `setImageResource()` 方法更改 ImageView 对象的图像，该方法接收图像资源。结合所有代码行并在活动的\
    \ `onCreate()` 方法中调用按钮监听器，我们得到了完整的 `MainActivity.java`：\n\n```java\npackage com.helloworld.myapplication;\n\
    \nimport android.support.v7.app.AppCompatActivity;\nimport android.os.Bundle;\n\
    import android.view.View;\nimport android.widget.Button;\nimport android.widget.ImageView;\n\
    import android.widget.TextView;\nimport java.util.Random;\n\npublic class MainActivity\
    \ extends AppCompatActivity\n{\n    @Override\n    protected void onCreate(Bundle\
    \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n       \
    \ setContentView(R.layout.activity_main);\n        myButtonListenerMethod();\n\
    \    }\n\n    public void myButtonListenerMethod() {\n        Button button =\
    \ (Button) findViewById(R.id.rollButton);\n        button.setOnClickListener(new\
    \ View.OnClickListener() {\n            @Override\n            public void onClick(View\
    \ v) {\n                Random rand = new Random();\n                int rollResult\
    \ = rand.nextInt(6) + 1;\n\n                TextView diceResult = (TextView) findViewById(R.id.diceResult);\n\
    \                diceResult.setText(Integer.toString(rollResult));\n\n       \
    \         ImageView img = (ImageView) findViewById(R.id.diceImage);\n\n      \
    \          switch (rollResult) {\n                    case 1:\n              \
    \          img.setImageResource(R.drawable.dice1);\n                        break;\n\
    \                    case 2:\n                        img.setImageResource(R.drawable.dice2);\n\
    \                        break;\n                    case 3:\n               \
    \         img.setImageResource(R.drawable.dice3);\n                        break;\n\
    \                    case 4:\n                        img.setImageResource(R.drawable.dice4);\n\
    \                        break;\n                    case 5:\n               \
    \         img.setImageResource(R.drawable.dice5);\n                        break;\n\
    \                    case 6:\n                        img.setImageResource(R.drawable.dice6);\n\
    \                        break;\n                }\n            }\n        });\n\
    \    }\n}\n```\n\n"
