    +   - A new array called orientation is declared.

    - The orientation of the device is extracted using the getOrientation() method
    and 3-dimensional orientation data is stored in the orientation array.

    - The first component of this array is the azimuth angle in radians, which is
    assigned to the azimuth_angle variable in the fourth line.

    - In the fifth line, the azimuth angle in radians is converted to degrees and
    assigned to the newly created variable degrees.

    - The degrees variable is of float type therefore it is better to round it to
    an integer. The sixth line does this job using the method Math.round().

    - Finally, the azimuth angle in integer degrees is shown in the TextView in the
    user interface. The char 0x00B0 is used to display the degree symbol (°).


