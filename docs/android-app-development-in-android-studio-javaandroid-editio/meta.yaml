    \ 所示设置其图像。选定的图像将在应用首次启动时在 ImageView 内部显示的图像（即默认图像）。因此，请按图 7.6 所示选择 `dicegeneral.png`。\n\
    \n**图 7.6.** 为 ImageView 选择默认图像\n\n选择完毕后，按下 OK，然后我们应用的布局将如下所示：\n\n**图 7.7.** 放置\
    \ ImageView 后的布局\n\n## 7.2. 添加其他小部件并设置 ID\n\n请在 ImageView 对象下方放置一个 TextView 和一个\
