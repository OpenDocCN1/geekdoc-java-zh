    \ a method to generate random numbers between 1 and 6. There are various methods\
    \ in Java. The following Random object does the job for our dice roller:\n\n```java\n\
    Random rand = new Random();\nint rollResult = rand.nextInt(6) + 1;\n```\nCode\
    \ 7.2\n\nIn this code, a Random object called rand is created in the first line.\
    \ In the second line, the method nextInt() is applied on this object by rand.nextInt(6).\
    \ The nextInt(int n) method generates random numbers between 0 and n. Therefore\
