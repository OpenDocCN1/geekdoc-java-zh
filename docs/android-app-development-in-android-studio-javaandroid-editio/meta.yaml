  mdcn: "\n\n## 第 9 章.ANDROID 应用 #5：显示我的位置\n\n- 如果设备上未安装 Google Play 服务，用户将收到提示在 SupportMapFragment\n\
    - 内部安装。此方法只有在用户安装了 Google Play 服务\n- 并返回应用时才会被触发。\n\n```java\n@Override\npublic\
    \ void onMapReady(GoogleMap googleMap) {\n    mMap = googleMap;\n\n    // 在悉尼添加一个标记并移动相机\n\
    \    LatLng sydney = new LatLng(-34, 151);\n    mMap.addMarker(new MarkerOptions().position(sydney).title(\"\
    Marker in Sydney\"));\n\n    mMap.moveCamera(CameraUpdateFactory.newLatLng(sydney));\n\
    }\n```\n\n代码 9.3（接上页）\n\n在这一段代码中，`mapFragment.getAsync(this)` 这一行将地图组件添加到应用中。然后，在\
    \ `onMapReady()` 方法内部创建了一个包含纬度和经度数据的 LatLng 对象。代码行 `LatLng sydney = new LatLng(-34,\
    \ 151)` 声明了一个纬度为 -34、经度为 151 的 LatLng 对象，这是澳大利亚悉尼的坐标（请注意，该点是由 Android Studio 自动选择的）。然后，通过应用于地图对象的\
    \ `addMarker()` 方法在悉尼处放置了一个标记。在最后一行，通过 `moveCamera()` 方法将相机移动到该点。\n\n## 9.4. 首次运行地图应用\n\
    \n我们现在准备好在模拟器中尝试当前状态的应用了。请点击 Android Studio 中的 Run（运行），然后你应该能在模拟器中看到如图 9.7 所示的应用。\n\
    \n如果你看到了带有标记的地图，恭喜你。如果你没有看到地图，请检查上面的 api 密钥部分。大多数错误是由错误的 api 密钥引起的，除非 gradle 构建系统指示了其他错误。\n\
    \n![](img/86af6710fca68834c439be9649970710_165_0.png)\n\n图 9.7. 我们应用当前的状态\n\n\
    ## 9.5. 实现所需的调函数\n\n现在我们需要从 GPS 接收器获取数据，然后在地图上显示我们的当前位置，而不是默认标记。为了这一点，我们首先在主类定义中实现所需的调，如下所示：\n\
    \n```java\npublic class MapsActivity extends FragmentActivity\nimplements OnMapReadyCallback,\
    \ LocationListener,\nGoogleApiClient.ConnectionCallbacks,\nGoogleApiClient.OnConnectionFailedListener\n\
    {}\n```\n\n代码 9.4\n\n在这一段代码中，我们实现了这些额外的回调：`LocationListener`、`GoogleApiClient.ConnectionCallback`\
    \ 和 `GoogleApiClient.OnConnectionFailedListener`。这些回调函数的功能如下：\n\n- LocationListener:\
    \ 在位置改变时激活。\n- GoogleApiClient.ConnectionCallback: 在设备状态改变时激活。\n- GoogleApiClient.OnConnectionFailedListener:\
    \ 在连接地图数据服务器失败时激活。\n\n当我们在 `MapsActivity.java` 的类定义中添加这些回调时，Android Studio 会在回调定义行显示错误。当我们点击红色灯泡时，应该选择如下所示的\
    \ Implement methods（实现方法）选项：\n\n| 选项描述 |\n| :--- |\n| public class MapsActivity\
    \ extends FragmentActivity implements OnMapReadyCallback |\n| GoogleApiClient.ConnectionCallbacks,\
    \ GoogleApiClient.OnConnectionFailedListener |\n| implement methods |\n| Make\
    \ 'MapsActivity' abstract |\n| Add on demand static import for 'com.google.android.gms.com.api.ApiClient'\
    \ |\n| Create Test |\n| Create subclass |\n| Insert Map Indexing API ready to\
    \ be used. |\n| Unimplement Interface |\n| Make package-local |\n\n图 9.8. 为修正回调而选择\
    \ Implement methods\n\n在选择实现方法后，会出现图 9.9 所示的对话框。请保留所选方法并点击此窗口中的 OK。然后，所需的方法将被添加到\
    \ MapsActivity.java 中，错误标记将消失。\n\n![](img/86af6710fca68834c439be9649970710_167_0.png)\n\
    \n图 9.9. 选择要实现的回调方法\n\n实现这些方法后，MapsActivity.java 如下所示：\n\n```java\npackage com.example.atomic.myapplication;\n\
    \nimport android.location.Location;\nimport android.location.LocationListener;\n\
