    new files can be added from this pane. We need to double-click on the filenames
    here to open them in the middle pane. The project structure will be explained
    in the next subsection.


    **Section 2.** The opened files can be activated from the tabs located here for
    viewing in the middle pane.


    **Section 3.** This is the middle pane. Contents of the active files can be viewed
    and changed from here. For the project shown in Figure 3.6, the


    28'
