    ## CHAPTER 3. TEST DRIVE: HELLO WORLD APP


    I have connected my Asus Zenfone 6 hence its name is written in the device selection
    window; it will obviously be different if the device you connected is different.
    After the device selection, click on the “OK” button and then the app screen of
    Figure 3.18 should appear on your actual device. If you see the “Hello World!”
    text on the real device, it’s excellent. You now know how to install your apps
    on real Android devices. Running an app on a real hardware is sometimes essential
    because some operations like SMS sending and calling can only be done on real
    devices.


    We have developed test drive app, “Hello World”, and learned:


    - i) Creating an Android Studio project,

    - ii) Using user interfaces and widgets,

    - iii) Creating emulators,

    - iv) Building the app,

    - v) Running our app on the emulator,

    - vi) Running our app on a real device.


    But as you may have noticed, we didn’t have any interaction with our app. It just
    writes a text on the screen and that’s it. In order to make an app to do something,
    we need to program it. Java is the main programming language used for developing
    Android apps. We’ll learn the basics of Java in the next chapter which will enable
    us to transform our ideas to working Android apps. Let’s have a coffee break (a
    3in1 coffee is recommended since we’ll need glucose) before starting our Java
    lecture.


    ## Chapter 4


    ## JAVA BASICS


    ### 4.1. What is Java?


    We have developed our first app. That''s great. However, it just writes a text
    on the screen and that''s it. The user doesn''t have any interaction with our
    app. In order to make an app to be interactive and do something real, we need
    to tell it what to do. And we need to tell it exactly. We do this by using programming
    languages.


    As an old saying: “Computers are actually rather stupid”. This is because: **we''re
    telling a computer to do a task, we have to do this in exact terms.** Let''s try
    to explain this by an example: imagine that you had a tiring workday and going
    home with your stomach rumbling. While you''re on the way to M4 motorway, the
    traffic got crowded near Oxford and you had some time to think what you''ll have
    for the dinner. You suddenly remembered that there is frozen chicken korma in
    the fridge. You ring your wife (with hands-free of course!) and will ask her to
    cook that meal.


    You – Hi darling, hope you''re OK.


    Your wife – Thanks, a bit tired. You?


    You – Me too. And also very hungry. Could you please cook a frozen chicken korma
    for me? There should be some in the fridge. I''m sure you''ll also have one, I
    know you love it.


    Your partner – Yummy yummy. I''ll, darling, it will be sizzling when you arrive.
    See you in a while, bye. (A caring wife!)


    You – Thanks darling, bye.


    ## BEGINNER GUIDE TO MOBILE APP DEVELOPMENT IN ANDROID STUDIO


    Then, she''ll find the frozen korma wherever it is in the fridge, unpack it, remove
    the sleeve and pierce film lid in several places. Set the timer, power on the
    microwave (or oven) and cook. She''ll cook the included pilau rice without a need
    to ask you. That''s. However, if you had a robot wife with a computer brain, the
    dialog would be more like this:


    You – Hi darling, you''re OK.


    Robot wife – Thanks. You OK? (not in a romantic tone!)


    You – Very tired. And very hungry. Could you please cook a frozen chicken korma
    for me? There should be some in the fridge.


    Robot wife – Where is the frozen korma in fridge, do you want me to cook pilau
    rice too? Do you want them normal or overcooked? Do you want a garlic bread too?
    When do you want it to be ready?....


    You – Stop, stop please. I''ll drive to a restaurant.


    Robot wife – I don''t understand, you are no nonsense....


    Well, any programmable digital device is more or less the same. We have to tell
    exact things to them. We do this by using programming languages. There are a lot
    of different programming languages used to develop software for different platforms.
    You can check the widely used programming languages and their rankings at the
    TIOBE index website: http://www.tioobe.com/tioobe-index/. It is sometimes difficult
    to choose which programming language to use. There is not a universally excellent/complete
    programming language; they have strong and weak sides.


    When we check the TIOBE index, we see that Java is consistently the most used
    programming language for years. There are several reasons for this. The main reasons
    are: i) being platform independence, ii) having a lot of libraries and iii) having
    object oriented, iv) having a strong security and robustness. Because of these
    reasons, Android apps are also mainly developed in Java. Therefore, in order to
    learn Android app development, we have to grasp the basics of Java programming
    language. After learning Java, we''ll use Android SDK libraries with Java and
    develop Android apps.


    We can use standalone Java compilers or Java-specific IDEs for learning Java.
    However it is also possible to try Java code in Android Studio with a simple trick.
    Since we already set up Android Studio, we will use it for Java coding here.


    ### 4.2. Using Android Studio for Java Coding


    First of all, we need to launch Android Studio and create a project. We can name
    the project as we want and select any version. The structure of the project will
    be the following:


    | Component | Description |

    | :--- | :--- |

    | Package | Defines the namespace for the files |

    | Class | The main template for the code |

    | Method | The blocks of code that perform tasks |


    In our case, the filename is JavaBasics. The content of the file as follows:


    ```java

    package com.example.javabasics;


    public class JavaBasics {


    }

    ```


    The first line defines a package that contains the files. The second line is the
    class definition. The third line is the closing bracket of the class. The body
    of the class is empty thus this Java program does not do anything when it is compiled
    and run. We will learn how to write code inside in the next chapter.

