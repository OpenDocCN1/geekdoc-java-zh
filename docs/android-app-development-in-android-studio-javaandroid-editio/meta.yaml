    1. manifests folder: This folder has the AndroidManifest.xml file inside. This
    file contains the configuration parameters of the project such as permissions,
    services and additional libraries.


    2. java folder: The source code files written in Java programming language reside
    in this folder. You can see that the java file of the activity “MainActivity.java”
    is automatically created in this folder.


    3. res folder: The resource files are contained in this folder. Resources basically
    mean all needed files except the source code. For example, if we want to include
    an mp3 file in our project, we place this file inside the “res” folder.'
