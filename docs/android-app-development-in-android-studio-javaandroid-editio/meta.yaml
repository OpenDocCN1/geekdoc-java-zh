    activity_main.xml - Android Stu...\nFile Edit View Navigate Code Analyze Refactor\
    \ Build Run Tools VCS Window Help\nHelloWorld2 - [app]\n  - app  src  main  res\
    \  layout  activity_main.xml\n  - activity_main.xml  MainActivity.java\n```\n\n\
    Figure 3.19. The “Re-Run” button in Android Studio\n\nI changed the text to “Hello\
    \ World!” from the TextView properties (shown in Figure 3.12) and pressed the\
    \ Re-Run button. Android Studio built the project and the updated app is displayed\
    \ on the emulator as follows:\n\n![](img/86af6710fca68834c439be9649970710_39_0.png)\n\
    \nFigure 3.20. The emulator running the updated app\n\nYou can stop the emulator\
    \ running the app using the square “Stop” button which is just at the right of\
    \ the “Re-Run” button. When you stop the app, the emulator will shut down and\
    \ wait for the next\n\n## 3.7. Running on a Real Device\n\nIt is also easy to\
