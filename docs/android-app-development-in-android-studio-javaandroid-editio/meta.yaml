    # 10.1. Introduction


    Most of the Android devices have the capability of GSM connection therefore it
    is useful to learn SMS messaging in Android. A class called SmsManager enables
    us to design apps that can easily send and receive SMS programmatically. You''ll
    see how this class is used in this chapter.


    We''ll develop an app which sends the current location to pre-defined recipients
    using SMS. This app can be useful in case of emergency in deserts or if you''re
    boozed in a disco when you cannot type text in the message field and need to send
    your location to a mate to take you home.


