    \n![](img/86af6710fca68834c439be9649970710_36_0.png)\n\n图 3.14. 为我们的第一个应用选择运行目标\n\
    \n![](img/86af6710fca68834c439be9649970710_36_1.png)\n\n图 3.15. Nexus 5 模拟器\n\n\
    ## Android Studio 移动应用开发入门指南\n\n模拟器已启动，但我们无法看到应用在上面上运行。不要慌！！如果我们检查 Android Studio\
    \ 的主窗口，可以看到它已经给出了如下所示的警告：\n\n![](img/86af6710fca68834c439be9649970710_37_0.png)\n\
    \n图 3.16. Instant Run（即时运行）警告\n\nAndroid Studio 询问我们是否想要利用一个名为 Instant Run 的组件。Instant\
    \ Run 是 Android Studio 2.0 中引入的系统，缩短了“代码 -> 构建 -> 运行”周期。当我们使用 Instant Run 时，Android\
    \ Studio 将代码更新推送到模拟器，而不需要构建新的可执行文件。此外，可以在更短时间内在模拟器上看到代码更改的效果。总之，Instant Run 是一件好事，让我们通过点击图\
    \ 3.16 所示的“Install and Continue”按钮来安装它。Android Studio 将在短时间内下载所需文件，然后我们需要按照通常的下一步-下一步程序安装这些更新。在完成微小的安装后，Android\
    \ Studio 将如图 3.17 矩形内所示构建我们的项目。\n\n构建过程完成后，模拟器将如图 3.18 所示运行我们的第一个应用。如果你看到了图中所示的模拟器屏幕，恭喜你。你成功创建了你的第一个\
    \ Android 应用。\n\n我们可以对应用进行任何更改，然后按下图 3.19 箭头所示的“Re-Run”按钮。模拟器将安装更新后的应用进行仿真。\n\n\
    正如你从自己的项目中所看到的，Android Studio 提供了大量的可能性和用户友好的界面，可以将你的想法转化为 Android 应用。\n\n## 第\
    \ 3 章。测试：Hello World 应用\n\n![](img/86af6710fca68834c439be9649970710_38_0.png)\n\
    \n图 3.17. 正在构建我们项目的 Android Studio\n\n![](img/86af6710fca68834c439be9649970710_38_1.png)\n\
    \n图 3.18. 模拟器运行我们的“Hello World”应用\n\n## Android Studio 移动应用开发入门指南\n\n```\nHelloWorld2\
    \ - [C:\\Users\\quantum\\AndroidProjects\\HelloWorld2 - [app]] - ...\\app\\src\\\
    main\\res\\layout\\activity_main.xml - Android Stu...\nFile Edit View Navigate\
    \ Code Analyze Refactor Build Run Tools VCS Window Help\nHelloWorld2 - [app]\n\
    \  - app  src  main  res  layout  activity_main.xml\n  - activity_main.xml  MainActivity.java\n\
    ```\n\n图 3.19. Android Studio 中的“Re-Run”按钮\n\n我从 `TextView` 属性（图 3.12 所示）将文本更改为“Hello\
    \ World!”并按了 Re-Run 按钮。Android Studio 构建了项目，更新后的应用如下显示在模拟器上：\n\n![](img/86af6710fca68834c439be9649970710_39_0.png)\n\
    \n图 3.20. 运行更新应用的模拟器\n\n你可以使用位于 Re-Run 按钮右侧的方形“Stop”按钮停止运行应用的模拟器。停止应用时，模拟器将关闭并等待下\n\
    \n## 3.7. 在真实设备上运行\n\n在真实设备上尝试应用也是简单的。\n\n1. 设备上需要完成的任务：在真实设备上运行应用之前，我们必须在设备上启用开发者模式。为了这一点，请在真实设备上导航到\
    \ 设置 -> 关于 -> 版本号。根据设备和 Android 版本，“版本号”的位置可能不同，但我确定你可以在设置部分轻松地找到它。找到版本号后，连续点击七次，设备将弹出对话框“你现在是开发者了。”\n\
    \n启用开发者模式后，你会在设备设置下找到名为“开发者选项”的新部分。请点击它并勾选“USB 调试”以通过 USB 连接调试。\n\n2. Android\
    \ Studio 中需要完成的任务：首先，请从 Tools -> Android -> ADB Integration 启用“ADB Integration”，如下所示：\n\
    \n![](img/86af6710fca68834c439be9649970710_40_0.png)\n\n图 3.21. 在 Android Studio\
    \ 中启用 ADB Integration\n\n现在你可以通过 USB 连接从 Android Studio 将应用安装到设备上。现在我们需要将应用设置为可调试。为了这一点，双击打开\
    \ AndroidManifest.xml 文件并添加文本\n\n```\n:debuggable=\"true\"\n```\n\n我们现在准备好在真实设备上测试我们的“Hello\
    \ World”应用了。当我们点击 Android Studio 中的“Run”按钮时，将弹出以下设备窗口：\n\n![](img/86af6710fca68834c439be9649970710_41_1.png)\n\
    \n图 3.23. 选择真实设备\n\n"
