    # 4.7. Classes, Objects and Inheritance in Java


    Java programming language uses traditional (procedural) and object-oriented concepts
    together for a stronger experience. Procedural programming means that a program
    uses procedures and functions executed by order. This is the traditional method.
    On the other side, object-oriented programming uses classes and objects derived
    from these classes to execute the required computational steps. So, what are classes
    and objects?


    We can think classes as blueprints and objects as different products made using
    this blueprint. Similarly, we can consider a car factory as an example for classes
    and objects. Each time we change the colour, baggage size, steering wheel, etc.,
    we obtain a different car without changing the basic properties of the car. If
    the car make and model are Virtua and Liberty (hypothetical names!), the production
    band produces Virtua Liberty 1.6, Virtua Liberty 2.0, Virtua Liberty 3.0, Virtua
    Liberty 1.6 premium, Virtua Liberty 2.0 diesel, etc. In this case the class is
