    The emulator started but we cannot see our app running on it. Don’t panic! If
    we check the main Android Studio window, we can see that it has given a warning
    as shown below:


    ![](img/86af6710fca68834c439be9649970710_37_0.png)


    Figure 3.16. Instant Run warning


    Android Studio asks us if we want to utilize a component called Instant Run. Instant
    Run is a system introduced in Android Studio 2.0 and shortens the Code -> Build
    -> Run cycle. When we use Instant Run, Android Studio pushes code updates to the
    emulator without the need of building a new executable. Furthermore, viewing the
    effects of the changes of the code can be seen on the emulator in a shorter time.
