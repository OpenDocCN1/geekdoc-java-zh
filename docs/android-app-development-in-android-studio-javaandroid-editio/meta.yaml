  md: '# Chapter 9


    # ANDRIOD APP # 5: SHOW MY LOCATION: USING GPS AND MAPS


    # 9.1. Creating a Map Project


    Geolocation and navigation apps are popular in all mobile platforms. Considering
    this, most mobile devices especially smartphones include components called GPS
    receivers. These receivers take microwave band radio signals from global positioning
    satellites that move in specified orbits around the earth. These GPS signals are
    extremely weak but thanks to the electronics tech, amplifier and processing circuits
    in smartphones are utilize these signals for location services.


    Anyway, let''s start developing our 5th app: Show My Location. In this chapter,
    you''ll learn to use maps and geolocation data from GPS in your apps. It sounds
    easy but there are confusing tricks to use the GPS receiver; don''t worry I''ll
    show all of them in a while.


    In this app, we aim to show our real time location on the map.


    Let''s start with creating a new Android project and select Google Maps Activity
    the activity type as shown in Figure 9.1. When we select the Google Maps Activity,
    as main Java file and the xml layout of the project are named as MainActivity.java
    and activity_maps.xml automatically as in Figure 9.2.


    When a Google Maps App project is created, a file named google_maps_api.xml is
    generated and placed under the res -> folder as shown in Figure 9.3.


    ![](img/86af6710fca68834c439be9649970710_158_0.png)'
