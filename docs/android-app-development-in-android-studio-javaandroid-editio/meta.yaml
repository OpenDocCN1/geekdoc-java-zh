    We need to implement these steps because there''s no other way to directly take
    the EditText value as a String or double.


    The following code does a similar job and in the end the weight value is stored
    in the weight variable.


    ```

    final EditText weightText = (EditText)

    findViewById(R.id.weightInput);

    String weightStr = weightText.getText().toString();

    double weight = Double.parseDouble(weightStr);

    ```


    We now have weight and data in data type variables so we can do the BMI calculation
    using the equation given in the beginning of the chapter as:


    ```

    double BMI = (weight) / (height*height);

    ```


    In this code, the * operator does the multiplication while the / operator divides
    the weight to the height squared.


    We will display this BMI value in the EditText box next to the You BMI label in
    the GUI. We set its ID as BMIResult when we laid out the user interface before.
    Therefore, the following code does this job:


    ```

    final EditText BMIResult = (EditText)

    findViewById(R.id.BMIResult);

    BMIResult.setText(Double.toString(BMI));

    ```


    In this code, the widget with the ID BMIResult is found in the first line and
    then the double type BMI variable is converted to String by the Double.toString(BMI)
    for displaying inside the EditText. Note that the texts written inside the EditText
    widgets can only be read and written as Strings.


