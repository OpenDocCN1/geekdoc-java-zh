  md: "# CHAPTER 10. ANDROID APP #6: S.O.S. MESSAGE SENDER\n\nHit OK in this dialog\
    \ and the methods onLocationChanged(), onStatus(), onProviderEnabled() and onProviderDisabled()\
    \ will be added to the MainActivity.java. onStatusChanged() is called when a change\
    \ in the location occurs. Similarly, onProviderEnabled() and onProviderDisabled()\
    \ methods are called when the GPS receiver is enabled and disabled, respectively.\
