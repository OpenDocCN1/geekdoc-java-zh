- md: "\nOur next subsection is about the logical decision making structures in Java,\
    \ let's have a coffee break and then continue with if-else and switch-case statements.\n\
    \n## 4.4. Logical Decision Making Statements in Java\n\nDecision making is a widely\
    \ used in programming as in daily life problems. We frequently make logical decisions\
    \ in daily life such as:\n\n- If their coffee is tasty I’ll get another one, else\
    \ I’ll grab a tea.\n- If it’s rainy I’ll take my umbrella, else I’ll not.\n\n\
    In a programming language, decision making statements control if a condition is\
    \ met or not in real life. There are two decision making statements in Java: if–else\
    \ and switch–case blocks.\n\nIf-else structure: In this conditional, if the condition\
    \ is satisfied, the code inside the if block is executed. If the condition isn’t\
    \ satisfied, then the code in the else block is executed. Hence, if we need the\
    \ rainy not rainy example using an if–else block block, we do it as follows:\n\
    \n```java\nif (it’s rainy) {\n    I’ll take my umbrella.\n} else {\n    I’ll not\
    \ take my umbrella.\n}\n```\n\nLet’s see how we can check if two numbers are equal\
    \ in Java using an if-else statement:\n\n```java\npackage com.helloworld.quantum.helloworld;\n\
    public class JavaElse {\n    public static void main(String[] args[]) {\n    \
    \    int a = 4;\n        int b = 4;\n        if (a == b) {\n            System.out.println(\"\
    a and b are equal\");\n        } else {\n            System.out.println(\"a and\
    \ b are not equal\");\n        }\n    }\n}\n```\n\nCode 4.17 (cont’d from the\
    \ previous page)\n\nLet’s analyse this code:\n\n- In this code, two integer type\
    \ variables, **a** and **b**, are created and initialized to 4.\n- In the next\
    \ line, the if statement checks if **a** and **b** are equal. The comparison operator\
    \ == is used to check the equality.\n- If the result of this comparison is true,\
    \ the statement inside the if block **System.out.println(\"a and b are equal\"\
    );** is executed which prints \"a and b are equal\" on the terminal screen.\n\
    - If the result of this comparison is false, the statement inside the if block\
    \ **System.out.println(\"a and b are not equal\");** is executed which prints\
    \ \"a and b are not equal\" on the terminal screen.\n\nSince we initialized both\
    \ **a** and **b** to 4, they are equal and the Java compiler executes the code\
    \ inside the **if** block as follows:\n\n![](img/86af6710fca68834c439be9649970710_65_0.png)\n\
    \nFigure 4.18. —else example in Java\n\n## CHAPTER 4. JAVA BASICS\n\nWhen we choose\
    \ one of the numbers to something other than 4, the code inside the else block\
    \ is executed as shown in Figure 4.19.\n\n![](img/86af6710fca68834c439be9649970710_66_0.png)\n\
    \n**Figure 4.19.** if–else statement in Java when the condition is not satisfied\n\
    \nIf–else statements can also be used in nested forms as in Code 4.17. In nested\
    \ statements, the conditions are checked from top to down. When a condition is\
    \ satisfied, the code inside its block is executed and the program ends. If none\
    \ of the conditions are true, then the final **else** block is executed. In other\
    \ words, the statements in the last else block is executed if none of the conditions\
    \ above it are satisfied. The screenshot of this nested code in the playground\
    \ is given in Figure 4.20.\n\n```java\npackage com.helloworld.quantum.helloworld;\n\
    public class JavaNestedIfElse {\n    public static void main(String args[]) {\n\
