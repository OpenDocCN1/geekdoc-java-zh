    mensorManager.registerListener(this,\magnetometer, SensorManager.SENSOR_DELAY_UI);

    }


    protected void onPause() {

    super.onPause();

    mensorManager.unregisterListener(this);

    }

    ```


    In the onResume() method, the sensor listeners are registered meaning the sensors
    are powered on again when the activity resumes. Similarly, the sensors are unregistered
    (disconnected) in the onPause() method when the activity pauses.'
