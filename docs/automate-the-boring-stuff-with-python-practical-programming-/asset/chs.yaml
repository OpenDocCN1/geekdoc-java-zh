  \n```\n>>> import docx\n>>> doc = docx.Document()\n>>> doc.add_paragraph('Hello\
  \ world!')\n<docx.text.Paragraph object at 0x000000000366AD30>\n>>> paraObj1 = doc.add_paragraph('This\
  \ is a second paragraph.')\n>>> paraObj2 = doc.add_paragraph('This is a yet another\
  \ paragraph.')\n>>> paraObj1.add_run(' This text is being added to the second paragraph.')\n\
  <docx.text.Run object at 0x0000000003A2C860>\n>>> doc.save('multipleParagraphs.docx')\n\
  ```\n\n生成的文档看起来如图 13-9。注意文本 `This text is being added to the second paragraph.`\
  \ 被添加到了 `paraObj1` 的 `Paragraph` 对象中，而它是添加到 `doc` 中的第二个段落。`add_paragraph()` 和 `add_run()`\
  \ 函数分别返回段落和 `Run` 对象，以为你省去麻烦。\n\n\n\n\n\nWord 文档更加可靠，你可以使用 `python-docx` 模块来读取它们。你可以通过\
  \ `Paragraph` 和 `Run` 对象来操作 Word 文档中的文本。这些对象也可以赋予样式，但样式必须来自默认样式集或文档中已有的样式。你可以向文档中添加新的段落、标题、换行符和图片，但只能添加到末尾。\n\
  \n在处理 PDF 和 Word 文档时遇到的许多局限性是因为这些格式是为了给人类读者美观地展示，而不是为了方便软件解析。下一章将介绍另一种常用的信息存储格式：JSON\
  \ 和 CSV 文件。这些格式设计用于供计算机使用，你会发现 Python 处理这些格式要要容易得多。\n\n## 练习题\n\n| Q: | 1\\. PDF\
