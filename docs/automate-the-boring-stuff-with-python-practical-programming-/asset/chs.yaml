  \ |\n\n## 练习项目\n\n为了练习，请编写执行以下内容的程序。\n\n## 扩展和修复章节项目程序\n\n本章中的 `resizeAndAddLogo.py`\
  \ 程序处理 PNG 和 JPEG 文件，但 Pillow 支持的格式远多于这两种。扩展 `resizeAndAddLogo.py` 以也能处理 GIF 和 BMP\
  \ 图像。\n\n另一个小问题是，该程序仅在文件扩展名为小写时才会修改 PNG 和 JPEG 文件。例如，它会处理 `zophie.png` 但不会处理 `zophie.PNG`。修改代码使文件扩展名检查不区分大小。\n\
  \n![当图像并不比 logo 大大时，结果看起来很难看。(Images/httpatomoreillycomsourcenostarchimages2189747.png.jpg)\n\
  \n图 17-16. 当图像并不比 logo 大大时，结果看起来很难看。\n\n## 识别硬盘上的文件夹\n\n编写一个程序遍历硬盘并寻找潜在的图片文件夹。当然，你首先需要定义什么是“照片文件夹”；假设它是任何超过一半文件都是照片的文件夹。照片文件必须具有\
  \ `.png` 或 `.jpg` 扩展。此外，照片是大图像；照片文件的宽度和高度必须大于 500 像素。\n\n作为一个提示，这里是该程序的大致结构：\n\n\
  ```python\n#! python3\n导入模块并编写注释描述此程序。\n\nfor foldername, subfolders, filenames\
  \ in os.walk('C:\\\\'):\n    numPhotoFiles = 0\n    numNonPhotoFiles = 0\n    for\
  \ filename in filenames:\n        # 检查扩展名是否为 .png 或 .jpg。\n        if TODO:\n  \
  \          numNonPhotoFiles += 1\n            continue    # 跳到下一个文件名\n\n       \
  \ # 使用 Pillow 打开图像。\n\n        # 检查宽度和高度是否大于 500。\n        if TODO:\n          \
  \  # 图像足够大认为是照片。\n            numPhotoFiles += 1\n        else:\n            # 图像太小，不是照片。\n\
  \            numNonPhotoFiles += 1\n\n    # 如果超过一半的文件是照片，\n    # 打印文件夹的绝对路径。\n \
  \   if TODO:\n        print(TODO)\n```\n\n当程序运行时，会在屏幕上打印任何照片文件夹的绝对路径。\n\n## 自定义座位卡\n\
  \n第 13 节包含了一个根据客人列表创建自定义邀请函的练习项目。作为一个额外项目，使用 `pillow` 模块为你的客人创建座位卡图像。对于 `http://nostarch.com/automatestuff/`\
  \ 资源中 `guests.txt` 文件列出的每位客人，生成一个包含客人姓名和一些花卉装饰的图像文件。资源中提供了一张公领域的花卉图像。为了确保每张座位卡的大小相同，在邀请函图像边缘添加一个黑色矩形，这样在打印图像时就会有一个剪裁指南。Pillow\
  \ 生成的 PNG 文件设置设置为每英寸 72 像素，因此 4×5 英寸的卡片需要 288×360 像素的图像。\n\n\n\n\n了解各种用于编辑电子表格、下载文件和启动程序的\
  \ Python 模块是有用的，但有时对于你需要处理的应用程序，并没有对应的模块可用。自动化计算机上任务的终极工具是你编写的直接控制键盘和鼠标的程序。这些程序可以通过向其他应用程序发送虚拟按键和鼠标点击来控制它们，就像你亲自坐在电脑前亲自与应用程序交互一样。这种技术被称为“图形用户界面自动化”（`graphical\
  \ user interface automation`），简称 `GUI 自动化`。通过 GUI 自动化，你的程序可以执行坐在电脑前的人类用户能做的任何事情，只是不会把咖啡洒在键盘上。\n\
  \n将 GUI 自动化想象成编程一个机械臂。你可以编写机械臂在你的键盘上打字并为你移动鼠标。这种技术对于涉及大量无意义点击或填写表单的任务特别有用。\n\n`pyautogui`\
  \ 模块具有模拟鼠标移动、按钮点击和滚动滚轮的函数。本章仅涵盖了 PyAutoGUI 功能的子集；你可以在 `[`pyautogui.readthedocs.org/`](http://pyautogui.readthedocs.org/)`\
  \ 找到完整的文档。\n\n# 安装 pyautogui 模块\n\n`pyautogui` 模块可以向 Windows、OS X 和 Linux 发送虚拟键和鼠标点击。根据你使用的操作系统，你可能需要在安装\
  \ PyAutoGUI 之前安装一些其他模块（称为`依赖`）。\n\n*   在 Windows 上，不需要安装其他模块。\n*   在 OS X 上，运行 `sudo\
  \ pip3 install pyobjc-framework-Quartz`、`sudo pip3 install pyobjc-core`，然后运行 `sudo\
  \ pip3 install pyobjc`。\n*   在 Linux 上，运行 `sudo pip3 install python3-xlib` 和 `sudo\
  \ apt-get scrot`。（`Scrot` 是 PyAutoGUI 使用的截图程序。）\n\n安装这些依赖后，运行 `pip install pyautogui`（在\
  \ OS X 和 Linux 上使用 `pip3`）来安装 PyAutoGUI。\n\n附录 A 有关于安装第三方模块的完整信息。要测试 PyAutoGUI 是否安装正确，请在交互式\
  \ shell 中运行 `import pyautogui` 并检查是否有任何错误信息。\n\n# 保持正轨\n\n在投入 GUI 自动化之前，你应该知道如何逃离可能出现的问题。Python\
  \ 可以以惊人的速度移动鼠标和输入按键。事实上，它的速度可能快到其他程序无法跟上。此外，如果发生了错误但你的程序仍在移动鼠标，将很难判断程序到底在做什么，或者如何从问题中恢复。就像迪士尼《魔法师的儿子》中的魔法扫帚一样，不断地向米奇的浴缸里注水——直到溢出来——你的程序即使完美执行了你的指令，也可能失控。如果鼠标在自动移动，停止程序可能会变得困难，因为你无法点击\
  \ IDLE 窗口来关闭它。幸运的是，有几种方法可以防止或恢复 GUI 自动化问题。\n\n## 通过注销关闭所有程序\n\n停止失控的 GUI 自动化程序最简单的方法可能是注销，这将关闭所有运行中的程序。在\
  \ Windows 和 Linux 上，注销热键是 `CTRL-ALT-DEL`。在 OS X 上，它是 `![](img/httpatomoreillycomsourcenostarchimages2189649.png.jpg)-SHIFT-OPTION-Q`。通过注销，你会丢失任何未保存的工作，但至少你不需要等待电脑完全重启。\n\
  \n## 暂停与安全机制\n\n你可以让脚本在每次函数调用后进行等待，这样在发生问题时，你就有了一个简短的窗口来接管鼠标和键盘。要实现这一点，将 `pyautogui.PAUSE`\
  \ 变量设置为你希望它暂停的秒数。例如，在设置 `pyautogui.PAUSE = 1.5` 后，每个 PyAutoGUI 函数调用在执行操作后将等待一秒半。非\
  \ PyAutoGUI 指令不会有这种暂停。\n\nPyAutoGUI 还有一个安全机制（fail-safe）。将鼠标光标移动到屏幕左上角会导致 PyAutoGUI\
  \ 抛出 `pyautogui.FailSafeException` 异常。你的程序可以使用 `try` 和 `except` 语句处理此异常，也可以让异常导致程序崩溃。无论何种方式，如果你快速将鼠标移动到尽可能左上角，安全机制将停止程序。你可以通过设置\
  \ `pyautogui.FAILSAFE = False` 来禁用此功能。在交互式 shell 中输入以下内容：\n\n```\n>>> import pyautogui\n\
  >>> pyautogui.PAUSE = 1\n>>> pyautogui.FAILSAFE = True\n```\n\n在这里我们导入了 `pyautogui`并将\
  \ `pyautogui.PAUSE` 设置为 `1`，以便在每次函数调用后暂停一秒。我们将 `pyautogui.FAILSAFE` 设置为 `True` 以启用安全机制。\n\
  \n# 控制鼠标移动\n\n在本节中，你将学习如何使用 PyAutoGUI 移动鼠标并跟踪其在屏幕上的位置，但你需要理解 PyAutoGUI 如何处理坐标。\n\
  \nPyAutoGUI 的鼠标函数使用 x 和 y 坐标。`Figure 18-1` 显示了屏幕的坐标系；它与 `[Text/ch18.html_coordinates_of_a_computer_screen_with_19\
  \ \"第 17 章\"]` 中讨论的图像坐标系相似。`x` 和 `y` 均为零的原点 `origin` 位于左上角。`x` 坐标向右增加，`y` 坐标向下增加。![1920×1080\
  \ 分辨率的电脑屏幕坐标](img/httpatomoreillycomsourcenostarchimages2189649.png.jpg) 你的`分辨率`\
  \ 是屏幕的宽和高像素数。如果你的屏幕分辨率设置为 1920×1080，那么左上角的坐标将是 `(0, 0)`，右下角的坐标将是 `(1919, 1079)`。\n\
  \n`pyautogui.size()` 函数返回一个包含屏幕像素宽度和高度的双整数元组。在交互式 shell 中输入以下内容：\n\n```\n>>> import\
  \ pyautogui\n>>> pyautogui.size()\n(1920, 1080)\n>>> width, height = pyautogui.size()\n\
  ```\n\n`pyautogui.size()` 在分辨率为 1920×1080 的电脑上返回 `(1920, 1080)`；根据你的屏幕分辨率，返回值可能会不同。你可以将\
  \ `pyautogui.size()` 的宽度和高度存储在 `width` 和 `height` 等变量中以提高可读性。\n\n## 移动鼠标\n\n现在你理解了屏幕坐标，让我们移动鼠标吧。`pyautogui.moveTo()`\
  \ 函数会将鼠标光标移动到屏幕上的指定位置。x 和 y 坐标的整数值分别是函数的第一个和第二个参数。可选的 `duration` 整数或浮点数关键字参数指定了移动到目标位置所需的秒数。如果你留空，默认值为\
  \ `0`，即瞬间移动。（PyAutoGUI 函数中所有的 `duration` 关键字参数都是可选的）。在交互式 shell 中输入以下内容：\n\n```\n\
  >>> import pyautogui\n>>> for i in range(10):\n      pyautogui.moveTo(100, 100,\
  \ duration=0.25)\n      pyautogui.moveTo(200, 100, duration=0.25)\n      pyautogui.moveTo(200,\
  \ 200, duration=0.25)\n      pyautogui.moveTo(100, 200, duration=0.25)\n```\n\n\
  此示例在四个坐标之间顺时针循环移动鼠标光标十次。根据 `duration=0.25` 关键字参数的指定，每次移动需要四分之一秒。如果你没有向任何 `pyautogui.moveTo()`\
  \ 调用传递第三个参数，鼠标光标将瞬间在点与点之间传送。\n\n\n\n\n`pyautogui.moveRel()` 函数根据鼠标当前的位置移动鼠标光标。下面的示例将鼠标以正方形模式移动，不同之处它会从代码开始运行时鼠标在屏幕上的任意位置开始绘制正方形：\n\
  \n```\n>>> import pyautogui\n>>> for i in range(10):\n      pyautogui.moveRel(100,\
  \ 0, duration=0.25)\n      pyautogui.moveRel(0, 100, duration=0.25)\n      pyautogui.moveRel(-100,\
  \ 0, duration=0.25)\n      pyautogui.moveRel(0, -100, duration=0.25)\n```\n\n`pyautogui.moveRel()`\
  \ 还接受三个参数：向右水平移动多少像素、垂直向下多少像素，以及（可选的）完成移动所需的时间。第一个或第二个参数传入负整数将导致鼠标分别向左或向上移动。\n\n\
  ## 获取鼠标位置\n\n你可以通过调用 `pyautogui.position()` 函数来确定鼠标的当前位置，该函数将返回一个包含函数调用时鼠标光标 `x`\
  \ 和 `y` 位置的元组。在交互式 shell 中输入以下内容，每次调用后移动鼠标：\n\n```\n>>> pyautogui.position()\n(311,\
  \ 622)\n>>> pyautogui.position()\n(377, 481)\n>>> pyautogui.position()\n(1536, 637)\n\
  ```\n\n当然，你的返回值将根据鼠标光标所在的位置而异。\n\n# 项目：“鼠标现在在哪儿？”\n\n能够确定鼠标位置是设置 GUI 自动化脚本的重要部分。但仅通过观察屏幕几乎是不可能确定像素的精确坐标的。如果有一个程序在你移动鼠标时不断显示鼠标光标的\
  \ x 和 y 坐标，将非常有用。\n\n从高层面上来说，你的程序应该执行以下操作：\n\n* 显示鼠标光标当前的 x 和 y 坐标。\n* 随着鼠标在屏幕上移动，更新这些坐标。\n\
  \n这意味着你的代码需要执行以下操作：\n\n* 调用 `position()` 函数获取当前坐标。\n* 通过向屏幕打印 `\\b` 退格格字符来擦除之前打印的坐标。\n\
  * 处理 `KeyboardInterrupt` 异常，以便用户可以按 CTRL-C 退出。\n\n打开一个新的文件编辑器窗口并将其保存为 `mouseNow.py`。\n\
  \n## 第 1 ：导入模块\n\n使用以下代码启动程序：\n\n```python\n#! python3\n# mouseNow.py - 显示鼠标光标的当前位置。\n\
  import pyautogui\nprint('Press Ctrl-C to quit.')\n#TODO: 获取并打印鼠标坐标。\n```\n\n程序的开头导入了\
  \ `pyautogui` 模块，并向用户打印提醒，让他们按 CTRL-C 退出。\n\n## 第 2 ：设置退出代码和无限循环\n\n你可以使用无限 `while`\
  \ 循环来不断打印来自 `pyautogui.position()` 的当前鼠标坐标。至于退出程序的代码，你需要捕获 `KeyboardInterrupt` 异常，每当用户按下\
  \ CTRL-C 时就会触发该异常。如果你不处理此异常，它将向用户显示难看的轨迹溯和错误信息。向你的程序添加以下内容：\n\n```python\n#! python3\n\
  # mouseNow.py - 显示鼠标光标的当前位置。\nimport pyautogui\nprint('Press Ctrl-C to quit.')\n\
  try:\n    while True:\n        # TODO: 获取并打印鼠标坐标。\nexcept KeyboardInterrupt:\n \
  \   print('\\nDone.')\n```\n\n为了处理异常，将无限 `while` 循环封装在 `try` 语句中。当用户按下 CTRL-C 时，程序执行将移动到\
  \ `except` 子句并在新行打印 `Done.`。\n\n## 第 3 ：获取并打印鼠标坐标\n\n`while` 循环内部的代码应该获取当前鼠标坐标，对其进行格式化以便于查看，并将其打印。将以下代码添加到\
  \ `while` 循环内部：\n\n```python\n#! python3\n# mouseNow.py - 显示鼠标光标的当前位置。\nimport pyautogui\n\
  print('Press Ctrl-C to quit.')\n--snip--\n        # 获取并打印鼠标坐标。\n        x, y = pyautogui.position()\n\
  \        positionStr = 'X: ' + str(x).rjust(4) + ' Y: ' + str(y).rjust(4)\n--snip--\n\
  ```\n\n使用多赋值技巧，变量 `x` 和 `y` 被赋予 `pyautogui.position()` 返回的元组中两个整数的值。通过将 `x` 和 `y`\
  \ 传递给 `str()` 函数，你可以得到整数坐标的字符串形式。`rjust()` 字符串方法将它们进行右对齐，以便它们占据相同的空间，无论坐标是一位、两位、三位还是四位数。将右对齐字符串字符串与\
  \ `'X: '` 和 `' Y: '` 标签拼接，我们得到了一个格式化良好的字符串，它将存储在 `positionStr` 中。\n\n在程序的末尾，添加以下代码：\n\
  \n```python\n#! python3\n# mouseNow.py - 显示鼠标光标的当前位置。\n--snip--\n        print(positionStr,\
  \ end='')\n        print('\\b' * len(positionStr), end='', flush=True)\n```\n\n\
  `end=''` 参数防止添加换行符。由于超出本书范围的原因，对打印 `\\b` 字符的 `print()` 调用始终传递 `flush=True`。由于 `while`\
  \ 循环重复非常快，用户实际上不会注意到你在删除并重打印整个数字。例如，如果 x 坐标是 563，鼠标向右移动一个像素，看起来 563 中的 3 变成了 4。\n\
  \n当你运行程序时，将打印两行。它们看起来像这样：\n\n```\nPress Ctrl-C to quit.\nX: 290 Y: 424\n```\n\n\
  第一行显示按 CTRL-C 的指令。第二行的鼠标坐标会随着鼠标移动而改变。使用此程序，你将能够为你的 GUI 自动化脚本确定坐标。\n\n# 控制鼠标交互\n\n\
  现在你已经知道如何移动鼠标以及它在屏幕上的位置，准备好开始点击、拖拽和滚动了。\n\n## 点击鼠标\n\n要向电脑发送虚拟鼠标点击，调用 `pyautogui.click()`\
  \ 方法。默认情况下，此点击使用左鼠标键并发生在鼠标光标当前的位置。如果你想让点击发生在鼠标当前位置以外的地方，可以将 x 和 y 坐标作为可选的第一、第二个参数。\n\
  \n如果你想指定使用哪种鼠标键，请包含 `button` 关键字参数，值为 `'left'`、`'middle'` 或 `'right'`。例如，`pyautogui.click(100,\
  \ 150, button='left')` 将 (100, 150) 点击左鼠标键，而 `pyautogui.click(200, 250, button='right')`\
  \ 将 (200, 250) 执行右键点击。\n\n在交互式 shell 中输入以下内容：\n\n```\n>>> import pyautogui\n>>>\
  \ pyautogui.click(10, 5)\n```\n\n\n\n\n\n你应该能看到鼠标指针移动到屏幕左上角附近并点击一次。一次完整的“点击”被定义为按下鼠标按钮然后释放，在此期间不移动光标。你也可以通过调用\
  \ `pyautogui.mouseDown()` 来执行点击（它只按下鼠标按钮），以及通过 `pyautogui.mouseUp()` 来执行点击（它只释放按钮）。这些函数的参数与\
  \ `click()` 相同，实际上，`click()` 函数只是对这两个函数调用的一个方便封装。\n\n为了进一步方便起见，`pyautogui.doubleClick()`\
  \ 函数将使用鼠标左键执行两次点击，而 `pyautogui.rightClick()` 和 `pyautogui.middleClick()` 函数将分别使用右键和中键执行一次点击。\n\
  \n## 拖动鼠标\n\n`Dragging` 指在按住其中一个鼠标键的同时移动鼠标。例如，你可以通过拖动文件夹图标在文件夹之间移动文件，或者在日历应用中移动安排。\n\
  \nPyAutoGUI 提供了 `pyautogui.dragTo()` 和 `pyautogui.dragRel()` 函数，可以将鼠标指针拖动到新位置或相对于当前位置的位置。`dragTo()`\
  \ 和 `dragRel()` 的参数与 `moveTo()` 和 `moveRel()` 相同：x 坐标/水平移动、y 坐标/垂直移动以及可选的持续时间。（OS\
  \ X 在鼠标移动过快时无法正确拖动，因此建议传递 `duration` 关键字参数。）\n\n要尝试这些函数，请打开一个图形绘制应用程序，如 Windows\
  \ 上的 Paint、OS X 上的 Paintbrush 或 Linux 上的 GNU Paint。（如果没有绘图程序，可以使用 [`sumopaint.com/`](http://sumopaint.com/)\
  \ 线工具。）我将使用 PyAutoGUI 在这些应用程序中绘图。\n\n当鼠标指针悬留在绘图程序的画布上并选中铅笔或画笔工具时，在新的编辑器窗口中输入以下内容并保存为\
  \ `spiralDraw.py`：\n\n```\n import pyautogui, time\n➊ time.sleep(5)\n➋ pyautogui.click()\
  \    # 点击以使绘图程序聚焦\n   distance = 200\n   while distance > 0:\n➌     pyautogui.dragRel(distance,\
  \ 0, duration=0.2)   # 向右移动\n➍     distance = distance - 5\n➎     pyautogui.dragRel(0,\
  \ distance, duration=0.2)   # 向下移动\n➏     pyautogui.dragRel(-distance, 0, duration=0.2)\
  \  # 向左移动\n       distance = distance - 5\n       pyautogui.dragRel(0, -distance,\
  \ duration=0.2)  # 向上移动\n```\n\n当你运行此程序时，会有五秒钟的延迟 ➊，让你将鼠标指针移动到已选中铅笔或画笔工具的绘图窗口上。然后\
  \ `spiralDraw.py` 将接管鼠标并点击以使绘图程序聚焦 ➋。当窗口具有激活的闪烁光标时，它处于 `focus` 状态，你执行的操作——例如打字或在这种情况下拖动鼠标——会影响该窗口。一旦绘图程序聚焦，`spiralDraw.py`\
  \ 将画出一个像图 18-2 example\") 样的方形螺旋图案。\n\n![dragRel() 示例的结果](img/httpatomoreillycomsourcenostarchimages2189751.png.jpg)\n\
  \n图 18-2. `pyautogui.dragRel()` 示例的结果\n\n`distance` 变量初始值为 `200`，因此在 `while` 循环第一次迭代中，第一次\
  \ `dragRel()` 调用将光标向右移动 200 像素，耗 0.2 秒 ➌。然后 `distance` 减到 195 ➍，第二次 `dragRel()`\
  \ 调用将光标向下移动 195 像素 ➎。第三次 `dragRel()` 调用将光标水平移动 -195（向左 195）➏，`distance` 减到 190，最后一次\
  \ `dragRel()` 将光标向上移动 190 像素。在每次迭代中，鼠标都会右、下、左、上移动，`distance` 比上一次迭代略小。通过循环这段代码，你可以移动鼠标指针画出一个方形螺旋。\n\
  \n你可以手动（或者说通过鼠标）画出这个螺旋，但你必须操作得很慢才能达到这种精确度。PyAutoGUI 在几秒钟内就能完成！\n\n### 注意\n\n你可以让代码使用\
  \ `pillow` 模块的绘制函数来绘制图像——更多信息请参见第 17 章。但使用 GUI 自动化允许你利用图形程序提供的高级绘制工具，例如渐变、不同的画笔或填充桶。\n\
  \n## 滚动鼠标\n\n最后一个 PyAutoGUI 鼠标函数是 `scroll()`，你传递它一个整数参数，表示你想向上或向下滚动鼠标的单位。单位的大小随每个操作系统和应用程序而异，因此你必须通过实验来查看在特定情况下具体滚动了多远。滚动发生在光标当前位置。传递正整数向上滚动，传递负整数向下滚动。\n\
  \n```python\nimport pyautogui\nimport time\ntime.sleep(5)\nnumbers = ''\nfor i in\
  \ range(200):\n    numbers += str(i) + '\\n'\npyperclip.copy(numbers)\npyautogui.scroll(100)\n\
  ```\n\n\n\n\n\n```\n>>> im.getpixel((0, 0))\n(176, 176, 175)\n>>> im.getpixel((50,\
  \ 200))\n(130, 135, 144)\n```\n\n向 `getpixel()` 传递一个坐标元组，例如 `(0, 0)` 或 `(50, 200)`，它将告诉你图像中这些坐标处像素的颜色。`getpixel()`\
  \ 的返回值是一个包含三个整数的 RGB 元组，分别代表像素中红色、绿色和蓝色的量。（没有第四个 alpha 值，因为截图图像是完全不透明的。）这就是你的程序如何“看到”屏幕当前显示内容的方法。\n\
  \n## 分析截图\n\n假设你的 GUI 自动化程序中的某个步骤是点击一个灰色按钮。在调用 `click()` 方法之前，你可以截一张屏，并查看脚本即将点击的像素。如果它与灰色按钮的颜色不是同一种，那么你的程序就知道出问题了。可能是窗口意外移动了，或者是弹出的对话框挡住了按钮。此时，你的程序与其继续执行——并可能因点击错误的内容而造成混乱——不如“看到”它没有点击到正确的对象并自动停止。\n\
  \nPyAutoGUI 的 `pixelMatchesColor()` 函数如果发现屏幕上给定 x 和 y 坐标处的像素与给定颜色匹配，将返回 `True`。第一个和第二个参数是\
  \ x 和 y 坐标的整数，第三个参数是一个包含三个整数的元组，代表屏幕像素必须匹配的 RGB 颜色。在交互式 shell 中输入以下内容：\n\n```\n\
  >>> import pyautogui\n   >>> im = pyautogui.screenshot()\n➊ >>> im.getpixel((50,\
  \ 200))\n   (130, 135, 144)\n➋ >>> pyautogui.pixelMatchesColor(50, 200, (130, 135,\
  \ 144))\n   True\n➌ >>> pyautogui.pixelMatchesColor(50, 200, (255, 135, 144))\n\
  \   False\n```\n\n在截图并使用 `getpixel()` 获取特定坐标 ➊像素颜色的 RGB 元组后，将相同的坐标和 RGB 元组传递给 `pixelMatchesColor()`\
  \ ➋，它应该返回 `True`。然后更改 RGB 元组中的一个值，并对相同坐标再次调用 `pixelMatchesColor()` ➌。这应该返回 `false`。这种方法可以在你的\
  \ GUI 自动化程序准备调用 `click()` 的时候调用非常有用。请注意，给定坐标处的颜色必须完全匹配。即使只有微小的不同——例如，是 `(255, 255,\
  \ 254)` 而不是 `(255, 255, 255)`——`pixelMatchesColor()` 也会返回 `False`。\n\n# 项目：扩展 mouseNow\
  \ 程序\n\n你可以扩展本章早之前的 `mouseNow.py` 项目，使其不仅提供鼠标光标当前位置的 x 和 y 坐标，还提供光标下像素的 RGB 颜色。修改\
  \ `mouseNow.py` 中 `while` 循环内的代码如下：\n\n```python\n#! python3\n# mouseNow.py - 显示鼠标光标当前位置。\n\
  --snip--\n        positionStr = 'X: ' + str(x).rjust(4) + ' Y: ' + str(y).rjust(4)\n\
  \        pixelColor = pyautogui.screenshot().getpixel((x, y))\n        positionStr\
  \ += ' RGB: (' + str(pixelColor[0]).rjust(3)\n        positionStr += ', ' + str(pixelColor[1]).rjust(3)\n\
  \        positionStr += ', ' + str(pixelColor[2]).rjust(3) + ')'\n        print(positionStr,\
  \ end='')\n--snip--\n```\n\n现在，当你运行 `mouseNow.py` 时，输出将包含鼠标光标下像素的 RGB 颜色值。\n\n```\n\
  按 Ctrl-C 退出。\nX:  406 Y:   17 RGB: (161, 50, 50)\n```\n\n这些信息结合 `pixelMatchesColor()`\
  \ 函数，应该让你在 GUI 自动化脚本中添加像素颜色检查变得易许多。\n\n# 图像识别\n\n但如果你预先不知道 PyAutoGUI 应该点击哪里怎么办？你可以使用图像识别。给\
  \ PyAutoGUI 提供一张你想点击的元素的图像，让它来计算坐标。\n\n例如，如果你之前已经通过截图捕获了 `submit.png` 中的提交按钮图像，那么\
  \ `locateOnScreen()` 函数将返回找到该图像的坐标。要了解 `locateOnScreen()` 如何工作，请尝试对屏幕上的小区域进行截图；然后保存图像并在交互式\
  \ shell 中输入以下内容，将 `'submit.png'` 替换为你的截图文件名：\n\n```\n>>> import pyautogui\n>>> pyautogui.locateOnScreen('submit.png')\n\
  (643, 745, 70, 29)\n```\n\n`locateOnScreen()` 返回的四整数元组包含屏幕上首次找到图像的左边缘 x 坐标、顶边缘 y\
  \ 坐标、宽度和高度。如果你在自己的电脑上用自己的截图进行尝试，你的返回值将与此处显示的不同。\n\n如果未找到图像，`locateOnScreen()` 返回\
  \ `None`。如果你想找到图像的所有出现处，请使用 `locateOnScreen()`，它返回一个元组的生成器。你可以将此生成器传递给 `list()`\
  \ 查看所有坐标：\n\n```\n>>> list(pyautogui.locateOnScreen('submit.png'))\n[(643, 745,\
  \ 70, 29)]\n```\n\n# 控制键盘\n\nPyAutoGUI 还有用于向计算机发送虚拟按键的函数，这让你能够填写表单或输入文本。\n\n## 从键盘发送字符串\n\
  \n`pyautogui.typewrite()` 函数向计算机发送虚拟按键。这些按键的作用取决于哪个窗口和文本框拥有焦点。你可能需要先向你想要的目标文本框发送一次鼠标点击，以确保它拥有焦点。\n\
  \n作为一个简单的例子，让我们用 Python 自动在文件编辑器窗口中输入 *Hello world!*。首先，打开一个新的文件编辑器窗口并将其放置在屏幕的左上角，这样\
  \ PyAutoGUI 就能点击正确的位置使其获得焦点。接下来，在交互式 shell 中输入以下内容：\n\n```python\n>>> pyautogui.click(100,\
  \ 100); pyautogui.typewrite('Hello world!')\n```\n\n注意，将两个命令放在同一行并用分号隔开，可以防止交互式\
  \ shell 在执行两个指令之间提示你输入。这可以防止你在调用 `click()` 和 `typewrite()` 之间意外将新窗口带入焦点。\n\n\n\n\
  \n\n![使用 PyAutogGUI 点击文件编辑器窗口并在其中输入 Hello world!](img/httpatomoreillycomsourcenostarchimages2189753.png.jpg)\n\
  \n图 18-3. 使用 PyAutogGUI 点击文件编辑器窗口并在其中输入 *Hello world!*\n\n默认情况下，`typewrite()` 函数会立即输入整个字符串。然而，你可以传递一个可选的第二个参数，在每个字符之间添加短时间的暂停。这个第二个参数是一个整数或浮点值，表示暂停的秒数。例如，`pyautogui.typewrite('Hello\
  \ world!', 0.25)` 将在输入 `H` 后等待四分之一秒，输入 `e` 之后再等待四分之一秒，以此此类推。这种逐渐的打字机效果对于处理按键速度跟不上\
  \ PyAutoGUI 的较慢应用程序可能有用。\n\n对于如 `A` 或 `!` 等字符，PyAutoGUI 会自动模拟按住 `SHIFT` 键。\n\n##\
  \ 键名\n\n并不是所有的键都容易用单个文本字符表示。例如，你如何用单个字符表示 `SHIFT` 或左箭头键呢？在 PyAutoGUI 中，这些键盘键由短字符串值表示：`'esc'`\
  \ 表示 ESC 键，`'enter'` 表示 ENTER 键。\n\n与其传递单个字符串参数，不如将这些键盘键字符串的列表传递给 `typewrite()`。例如，以下调用会按下\
  \ `A` 键，然后是 `B` 键，接着是两次左箭头键，最后是 `X` 和 `Y` 键：\n\n```\n>>> pyautogui.typewrite(['a',\
  \ 'b', 'left', 'left', 'X', 'Y'])\n```\n\n由于按下左箭头键会移动光光标，这将输出 `XYab`。表 18-1 列出了你可以传递给\
  \ `typewrite()` 的 PyAutoGUI 键盘键字符串，用于模拟按下任何组合键。\n\n你还可以检查 `pyautogui.KEYBOARD_KEYS`\
  \ 列表，查看 PyAutoGUI 接受的所有可能的键盘键字符串。`'shift'` 字符串指的是左 `SHIFT` 键，等同于 `'shiftleft'`。`'ctrl'`、`'alt'`\
  \ 和 `'win'` 字符串也是如此；它们都指的是左侧键。\n\n表 18-1. `PyKeyboard` 属性\n\n| 键盘键字符串 | 含义 |\n|\
  \ --- | --- |\n| `'a'`, `'b'`, `'c'`, `'A'`, `'B'`, `'C'`, `'1'`, `'2'`, `'3'`,\
  \ `'!'`, `'@'`, `'#'` 等 | 单个字符的键 |\n| `'enter'` (或 `'return'` 或 `'\\n'`) | ENTER\
  \ 键 |\n| `'esc'` | ESC 键 |\n| `'shiftleft'`, `'shiftright'` | 左、右 SHIFT 键 |\n| `'altleft'`,\
  \ `'altright'` | 左、右 ALT 键 |\n| `'ctrlleft'`, `'ctrlright'` | 左、右 CTRL 键 |\n| `'tab'`\
  \ (或 `'\\t'`) | TAB 键 |\n| `'backspace'`, `'delete'` | 退格键和删除键 |\n| `'pageup'`,\
  \ `'pagedown'` | 翻页和翻页键 |\n| `'home'`, `'end'` | Home 和 End 键 |\n| `'up'`, `'down'`,\
  \ `'left'`, `'right'` | 上、下、左、右方向键 |\n| `'f1'`, `'f2'`, `'f3'` 等 | F1 到 F12 键 |\n\
  | `'volumemute'`, `'volumedown'`, `'volumeup'` | 静音、减音量、增音量键（某些键盘没有这些键，但你的操作系统仍能理解这些模拟按键）\
  \ |\n| `'pause'` | PAUSE 键 |\n| `'capslock'`, `'numlock'`, `'scrolllock'` | 大写锁定、数字锁定和滚动锁定键\
  \ |\n| `'insert'` | 插入键 |\n| `'printscreen'` | 打印屏幕键（PRTSC） |\n| `'winleft'`, `'winright'`\
  \ | 左、右 WIN 键（在 Windows 上） |\n| `'command'` | Command 键（OS X 上） |\n| `'option'`\
  \ | OPTION 键（OS X 上） |\n\n## 按下和释放键盘\n\n与 `mouseDown()` 和 `mouseUp()` 函数类似，`pyautogui.keyDown()`\
  \ 和 `pyautogui.keyUp()` 会向计算机发送虚拟按键和释放信号。它们接收一个键盘键字符串作为参数（参见 表 18-1）。为了方便，PyAutoGUI\
  \ 提供了 `pyautogui.press()` 函数，它通过调用这两个函数来模拟完整的按键过程。\n\n运行以下代码，它将输入美元符号字符（通过按住 `SHIFT`\
  \ 键并按下 4 ）：\n\n```\n>>> pyautogui.keyDown('shift'); pyautogui.press('4'); pyautogui.keyUp('shift')\n\
  ```\n\n这一行按下 `SHIFT`，按下（并释放）4，然后释放 `SHIFT`。如果你需要在文本框中输入字符串，`typewrite()` 函数更合适。但对于接受单键命令的应用程序，`press()`\
  \ 函数是更简单的方法。\n\n## 热键组合\n\n（注：输入文本由于源错误包含重复部分，我已处理了唯一内容以保持逻辑流。）\n\n## PyAutoGUI\
  \ 函数回顾\n\n由于本章涵盖了许多函数，这里有一个简单的总结：\n\n*   `moveTo(x, y)`：将光标移动到指定的 `x` 和 `y` 坐标。\n\
  *   `moveRel(xOffset, yOffset)`：相对于当前位置移动光标。\n*   `dragTo(x, y)`：在按住左键时时移动光标。\n\
  *   `dragRel(xOffset, yOffset)`：在按住左键时，相对于当前位置移动光标。\n*   `click(x, y, button)`：模拟点击（默认为左键）。\n\
  *   `rightClick()`：模拟右键点击。\n*   `middleClick()`：模拟中键点击。\n*   `doubleClick()`：模拟左键双击。\n\
  *   `mouseDown(x, y, button)`：模拟在 `x`, `y` 位置按下指定的按键。\n*   `mouseUp(x, y, button)`：模拟在\
  \ `x`, `y` 位置释放指定的按键。\n*   `scroll(units)`：模拟滚轮。正参数向上滚动；负数参数向下滚动。\n*   `typewrite(message)`：输入给定消息字符串中的字符。\n\
  *   `typewrite([key1, key2, key3])`：输入指定的键盘键字符串。\n\n\n\n\n\n*   `press(key)`. 按下指定的键盘键字符串。\n\
  *   `keyDown(key)`. 模拟按下指定的键盘键。\n*   `keyUp(key)`. 模拟释放指定的键盘键。\n*   `hotkey([key1,\
  \ key2, key3])`. 模拟按顺序按下指定的键盘键字符串，然后按反顺序释放它们。\n*   `screenshot()`. 返回一个 `Image`\
  \ 对象格式的截图。（有关 `Image` 对象的信息，请参阅 第 17 章* 找到。它看起来就像 图 18-4 所示。\n\n![项目使用的表单](img/httpatomoreillycomsourcenostarchimages2189755.png.jpg)\n\
  \n图 18-4. 本项目使用的表单\n\n从高层面上来看，你的程序应该执行以下操作：\n\n*   点击表单的第一个文本字段。\n*   遍历表单，在每个字段中输入信息。\n\
  *   点击提交（Submit）按钮。\n*   对下一组数据重复此过程。\n\n这意味着你的代码需要执行以下操作：\n\n*   调用 `pyautogui.click()`\
  \ 来点击表单和提交按钮。\n*   调用 `pyautogui.typewrite()` 向字段中输入文本。\n*   处理 `KeyboardInterrupt`\
  \ 异常，以便用户可以按 CTRL-C 退出。\n\n打开一个新的文件编辑器窗口并将其保存为 `formFiller.py`。\n\n## 第 1 步：确定步骤\n\
  \n在编写代码之前，你需要确定填写一次表单所需的精确按键和鼠标点击操作。[项目：“鼠标现在在哪里？”]](#ch18.html_project_quotation_markwhere_is_the_mouse\
  \ \"项目：“鼠标现在在哪里？”\") 中的 `mouseNow.py` 脚本可以帮助你确定特定的鼠标坐标。你只需要知道第一个文本字段的坐标。在点击第一个字段后，只需按\
  \ `TAB` 键即可将焦点移动到下一个字段。这将节省你计算每个字段点击所需的 x 和和 y 坐标的时间。\n\n以下是向表单输入数据的步骤：\n\n1.  点击姓名（Name）字段。（在最大化浏览器窗口后使用\
  \ `mouseNow.py` 确定坐标。在 OS X 上，你可能需要点击两次：第一次让浏览器获取焦点，第二次点击姓名字段。）\n2.  输入姓名，然后按 `TAB`。\n\
  3.  输入你最深恐惧的事，然后按 `TAB`。\n4.  按正确次数的向下箭头键来选择魔法师力量来源：一次 `wand`（魔杖），两次 `amulet`（护身符），三次\
  \ `crystal ball`（水晶球），四次 `money`（钱）。然后按 `TAB`。（注意，在 OS X 上，每个选项你都需要多按一次向下箭头键。对于某些浏览器，你可能还需要按\
  \ `ENTER` 键。）\n5.  按右箭头键选择对警卫机器人问题的答案。按一次选择 `2`，两次选择 `3`，三次 `4`，或四次 `5`；或直接按空格键选择\
  \ `1`（它是默认高亮的的）。然后按 `TAB`。\n6.  输入额外的评论，然后按 `TAB`。\n7.  按 `ENTER` 键“点击”提交按钮。\n8.\
  \  提交表单后，浏览器将带你进入一个页面，你需要在那里点击链接以返回表单页面。\n\n注意，如果你以后再次运行此程序，你可能需要更新鼠标点击坐标，因为浏览器窗口的位置可能发生了变化。为了解决这个问题，在寻找第一个表单字段的坐标之前，务必确保浏览器窗口已最大化。此外，不同操作系统上的不同浏览器运行可能与此处提供的步骤略有不同，因此在运行程序之前，请检查这些键组合对你的电脑是否有效。\n\
  \n## 第 2 步：设置坐标\n\n在浏览器中加载下载的示例表单（图 18-4）并最大化浏览器窗口。打开一个新的终端或命令行窗口运行 `mouseNow.py`\
  \ 脚本，然后获取 `nameField` 到 `submitButton` 再到 `submitColor` 以及 `submitAnotherLink`。\n\
  \n## 第 3 步：开始输入数据\n\n`for` 循环将遍历 `formData` 列表中的每个字典，将字典中的值传递给 PyGUIGUI 函数，这些函数将在虚拟地在文本字段中输入。\n\
  \n在你的程序中添加以下代码：\n\n\n\n\n\n```python#! python3\n# formFiller.py - 自动填 own 表单。\n\n\
  --snip--\n\nfor person in formData:\n    # Give the user a chance to kill the script.\n\
  \    print('>>> 5 SECOND PAUSE TO LET USER PRESS CTRL-C <<<')\n➊     time.sleep(5)\n\
  \n    # Wait until the form page has loaded.\n➋     while not pyautogui.pixelMatchesColor(submitButton[0],\
  \ submitButton[1], submitButtonColor):\n        time.sleep(0.5)\n\n--snip--\n```\n\
  \n作为一项小型安全功能，脚本设置了五秒的暂停 ➊，这为用户提供了按下 CTRL-C 的机会（或将鼠标光标移动到屏幕左上角以触发 `FailSafeException`\
  \ 异常），以便在程序执行意料之外的操作时将其关闭。然后，程序会等待提交（Submit）按钮的颜色可见 ➋，让程序知道表单页面已加载。记住你已经在第 2 步确定了坐标和颜色信息，并将其存储在\
  \ `submitButton` 和 `submitButtonColor` 变量中。要使用 `pixelMatchesColor()`，你需要传入坐标 `submitButton[0]`\
  \ 和 `submitButton[1]` 以及颜色 `submitButtonColor`。\n\n在等待提交按钮颜色可见的代码之后，添加以下内容：\n\n\
  ```python\n#! python3\n# formFiller.py - 自动填 in 表单。\n\n--snip--\n\n➊     print('Entering\
  \ %s info...' % (person['name']))\n➋     pyautogui.click(nameField[0], nameField[1])\n\
  \n    # Fill out the Name field.\n➌     pyautogui.typewrite(person['name'] + '\\\
  t')\n\n    # Fill out the Greatest Fear(s) field.\n➍     pyautogui.typewrite(person['fear']\
  \ + '\\t')\n\n--snip--\n```\n\n我们偶尔添加 `print()` 调用，以便在终端窗口中显示程序的状态，让用户知道正在发生什么 ➊。\n\
  \n由于程序知道表单已加载，现在是时候调用 `click()` 点击名称（Name）字段 ➋，并使用 `typewrite()` 输入 `person['name']`\
  \ 中的字符串 ➌ 了。在传递给 `typewrite()` 的字符串末尾添加了 `'\\t'` 字符，以模拟按下 TAB 键，这会将键盘焦点移动到下一个字段——最大的恐惧（Greatest\
  \ Fears）。再次调用 `typewrite()` 将将 `person['fear']` 中的字符串输入到该字段，然后制表跳转到表单中的下一个字段 ➍。\n\
  \n## 第 4 步：处理选择列表和单选按钮\n\n“魔法力量（wizard powers）”问题的下拉菜单和机器人警察（Robocop）字段的单选按钮比文本字段更难处理。要用鼠标点击这些选项，你需要找出每个可能选项的\
  \ x 和 y 坐标。使用键盘箭头键进行选择会更简单。\n\n向你的程序中添加以下内容：\n\n```python\n#! python3\n# formFiller.py\
  \ - 自动填 in 表单。\n\n--snip--\n\n    # Fill out the Source of Wizard Powers field.\n\
  ➊     if person['source'] == 'wand':\n➋     pyautogui.typewrite(['down', '\\t'])\n\
  \    elif person['source'] == 'amulet':\n        pyautogui.typewrite(['down', 'down',\
  \ '\\t'])\n    elif person['source'] == 'crystal ball':\n        pyautogui.typewrite(['down',\
  \ 'down', 'down', '\\t'])\n    elif person['source'] == 'money':\n        pyautogui.typewrite(['down',\
  \ 'down', 'down', 'down', '\\t'])\n\n    # Fill out the Robocop field.\n➌     if\
  \ person['robocop'] == 1:\n➍     pyautogui.typewrite([' ', '\\t'])\n    elif person['robocop']\
  \ == 2:\n        pyautogui.typewrite(['right', '\\t'])\n    elif person['robocop']\
  \ == 3:\n        pyautogui.typewrite(['right', 'right', '\\t'])\n    elif person['robocop']\
  \ == 4:\n        pyautogui.typewrite(['right', 'right', 'right', '\\t'])\n    elif\
  \ person['robocop'] == 5:\n        pyautogui.typewrite(['right', 'right', 'right',\
  \ 'right', '\\t'])\n\n--snip--\n```\n\n一旦下拉菜单获得焦点（记得你在填写“最大的恐惧”字段后编写了模拟按下 TAB 键的代码），按下向下箭头将移动到选择列表中的下一项。根据\
  \ `person['source']` 的值，你的程序应该在制表到下一个字段之前发送几次向下箭头键按下。如果该用户字典中 `'source'` 键的值为 `'wand'`\
  \ ➊，我们模拟按下一次向下箭头键（以选择 *Wand*）并按下 TAB ➋。如果 `'source'` 键的值为 `'amulet'`，我们模拟按下两次向下箭头键并按下\
  \ TAB，其他可能的答案也依此类推。\n\n机器人警察问题的单选按钮可以使用右箭头键进行选择——或者，如果你想选择第一个选项 ➌，只需按下空格键 ➍。\n\n\
  ## 第 5 步：提交表单并等待\n\n你可以通过将 `person['comments']` 作为参数传递给 `typewrite()` 函数来填写注释（Additional\
  \ Comments）字段。你可以输入一个额外的 `'\\t'` 来模拟按下 TAB 键，这会将键盘焦点移动到下一个字段——提交（Submit）。\n\n一旦程序知道表单已加载，是时候调用\
  \ `click()` 点击名称字段 ➋，并使用 `typewrite()` 输入 `person['name']` 中的字符串 ➌ 了。`'\\t'` 字符被添加到传递给\
  \ `typewrite()` 的字符串末尾，以模拟按下 TAB 键，这会将键盘焦点移动到下一个字段——最大的恐惧（Greatest Fears）。再次调用 `typewrite()`\
  \ 将将 `person['fear']` 中的字符串输入到该字段，然后制表跳转到表单中的下一个字段 ➍。通过添加以下内容完成你的程序：\n\n```python\n\
  #! python3\n# formFiller.py - 自动填 in 表单。\n\n--snip--\n\n    # Fill out Comments\
  \ field.\n    pyautogui.typewrite(person['comments'] + '\\t')\n\n    # Click Submit.\n\
  \    pyautogui.press('enter')\n\n    # Wait until page has loaded.\n    print('Clicked\
  \ Submit.')\n    time.sleep(5)\n\n    # Click another response.\n    pyautogui.click(submitButton[0],\
  \ submitButton[1])\n```\n\n一旦 `for` 循环结束，程序将为每个人填写信息。在这个例子中只有四个人。但如果有 4000 个人，编写程序将节省大量时间！\n\
  \n## 总结\n\n使用 `pyautogui` 模块进行 GUI 自动化可以通过控制鼠标和键盘与计算机上的应用程序交互。虽然这种方法非常灵活，可以执行人类可以执行的一切，但缺点是这些程序对于它们正在点击或输入的内容几乎是盲目的。在编写\
  \ GUI 自动化程序时，尽量确保它们在收到错误指令时快速崩溃。崩溃很恼人，但比程序继续报错要好得多。\n\n你可以使用 PyAutoGUI 在屏幕上移动鼠标光标并模拟点击、击键和快捷键。pyautogui\
  \ 模块还可以检查屏幕上的颜色，这可以为你的 GUI 自动化程序提供足够的屏幕内容信息，以判断是否已到位。你甚至可以给 PyAutoGUI 一张截图，让它确定你想点击区域的坐标。\n\
  \n你可以结合所有的 PyAutoGUI 功能来自动化计算机上任何机械重复的任务。事实上，看着鼠标光标自动移动以及文字自动出现在屏幕上非常催眠。为什么不利用节省下来的时间坐着看程序为你完成所有工作呢？看到自己的聪明如何让你从无聊的事情中解脱，会有种特殊的满足感。\n\
