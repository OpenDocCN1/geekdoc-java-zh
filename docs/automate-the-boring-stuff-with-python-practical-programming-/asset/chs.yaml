  \ 提供了一个函数来处理这个过程。\n\n让我们看看 *C:\\delicious* 文件夹及其内容，如图 9-1 所示。\n\n![一个包含三个文件夹和四个文件的示例](img/httpatomoreillycomsourcenostarchimages2189629.png.jpg)\n\
  \n图 9-1.�一个包含三个文件夹和四个文件的示例\n\n\n\n这是一个使用 `os.walk()` 函数对图 9-1 中的目录树进行操作的示例程序：\n\n\
  \n\n\n```python\nimport os\n\nfor folderName, subfolders, filenames in os.walk('C:\\\
  \\delicious'):\n    print('The current folder is ' + folderName)\n\n    for subfolder\
  \ in subfolders:\n        print('SUBFOLDER OF ' + folderName + ': ' + subfolder)\n\
  \    for filename in filenames:\n        print('FILE INSIDE ' + folderName + ':\
  \ '+ filename)\n\n    print('')\n```\n\n`os.walk()` 函数接收一个单一字符串值：文件夹的路径。你可以在 `for`\
  \ 循环语句中使用 `os.walk()` 来遍历目录树，就像你可以使用 `range()` 函数来遍历数字范围一样。与 `range()` 不同，`os.walk()`\
  \ 函数在循环的每次迭代中都会返回三个值：\n\n1.  当前文件夹名称的字符串\n2.  当前文件夹中所有文件夹的字符串列表\n3.  当前文件夹中所有文件的字符串列表\n\
  \n（所谓“当前文件夹”，指的是 `for` 循环当前迭代次数的文件夹。`os.walk()` *不会*改变程序的当前工作目录。）\n\n就像你可以在代码 `for\
  \ i in range(10):` 中选择变量名 `i` 一样，你也可以为前面列出的三个值选择变量名。我通常使用 `foldername`、`subfolders`\
  \ 和 `filenames`。\n\n当你运行这个程序时，它将输出以下内容：\n\n```\nThe current folder is C:\\delicious\n\
  SUBFOLDER OF C:\\delicious: cats\nSUBFOLDER OF C:\\delicious: walnut\nFILE INSIDE\
  \ C:\\delicious: spam.txt\n\nThe current folder is C:\\delicious\\cats\nFILE INSIDE\
  \ C:\\delicious\\cats: catnames.txt\nFILE INSIDE C:\\delicious\\cats: zophie.jpg\n\
  \nThe current folder is C:\\delicious\\walnut\nSUBFOLDER OF C:\\delicious\\walnut:\
  \ waffles\n\nThe current folder is C:\\delicious\\walnut\\waffles\nFILE INSIDE C:\\\
  delicious\\walnut\\waffles: butter.txt.\n```\n\n由于 `os.walk()` 为 `subfolder` 和 `filename`\
  \ 变量返回字符串列表，你可以在它们自己的 `for` 循环中使用这些列表。将 `print()` 函数调用替换为你自己的自定义代码。（或者如果你不需要其中一个或两个，请删除\
  \ `for` 循环。）\n\n# 使用 zipfile 模块压缩文件\n\n你可能对 ZIP 文件（扩展名为 `.zip`）熟悉，它们可以包含许多其他文件的压缩内容。压缩文件可以减小其体积，这在通过互联网传输文件时非常有用。由于\
  \ ZIP 文件还可以包含多个文件和子文件夹，因此它是将几个文件打包成一个方便的方法。这个单独的文件被称为*归档文件*（archive file），之后可以作为邮件附件。\n\
  \n你的 Python 程序可以使用 `zipfile` 模块中的函数来创建和打开（或*提取*）ZIP 文件。假设你有一个名为 `example.zip` 的\
  \ ZIP 文件，其内容如图图 9-2 所示。\n\n你可以从 `[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)`\
  \ 下载这个 ZIP 文件，或者直接使用电脑上已有的 ZIP 文件进行练习。\n\n![example.zip 的内容](img/httpatomoreillycomsourcenostarchimages2189631.png.jpg)\n\
  \n图 9-2. `example.zip` 的内容\n\n## 读取 ZIP 文件\n\n要读取 ZIP 文件的内容，首先必须创建一个 `ZipFile` 对象（注意大写字母\
  \ `Z` 和 `F`）。`ZipFile` 对象在概念上与你在上一章中看到的 `open()` 函数返回的 `File` 对象相似：它们是程序与文件交互的值。要创建\
  \ `ZipFile` 对象，调用 `zipfile.ZipFile()` 函数，并传入 `.zip` 文件的文件名字符串。注意 `zipfile` 是 Python\
  \ 模块的名称，而 `ZipFile()` 是函数的名称。\n\n例如，在交互式 shell 中输入以下内容：\n\n```\n >>> import zipfile,\
  \ os\n   >>> os.chdir('C:\\\\')    #移动到包含 example.zip 的文件夹\n   >>> exampleZip =\
  \ zipfile.ZipFile('example.zip')\n   >>> exampleZip.namelist()\n   ['spam.txt',\
  \ 'cats/', 'cats/catnames.txt', 'cats/zophie.jpg']\n   >>> spamInfo = exampleZip.getinfo('spam.txt')\n\
  \   >>> spamInfo.file_size\n   13908\n   >>> spamInfo.compress_size\n   3828\n➊\
  \ >>> 'Compressed file is %sx smaller!' % (round(spamInfo.file_size / spamInfo\n\
  \   .compress_size, 2))\n   'Compressed file is 3.63x smaller!'\n   >>> exampleZip.close()\n\
  ```\n\n`ZipFile` 对象有一个 `namelist()` 方法，它返回 ZIP 文件中所有文件和文件夹的字符串列表。这些字符串可以传递给 `ZipFile`\
  \ 的 `getinfo()` 方法，以返回该特定文件的 `ZipInfo` 对象。`ZipInfo` 对象有自己的属性，例如以字节为单位的 `file_size`\
  \ 和 `compress_size`，分别存储原始文件大小和压缩文件大小的整数。由于 `os.walk()` 为 `subfolder` 和 `filename`\
  \ 变量返回字符串列表，你可以在它们自己的 `for` 循环中使用这些列表。将 `print()` 函数调用替换为你自己的自定义代码。（或者如果你不需要其中一个或两个，请删除\
  \ `for` 循环。）\n\n\n\n\n# 项目：将美式日期格式的文件重命名为欧式日期\n\n假设你的老板给你发了成千上万个文件，文件名中带有美式日期（MM-DD-YYYY），并要求将它们重命名为欧式日期（DD-MM-YYYY）。这项无聊的任务手动完成可能需要花费一整天！让我们写一个程序来完成它。\n\
  \n以下是该程序的功能：\n\n*   它会在当前工作目录下的所有文件名中搜索美式日期。\n*   找到一个后，它将交换月份和日期来重命名文件，变为欧式格式。\n\
  \n这意味着代码需要执行以下操作：\n\n*   创建一个可以识别美式日期文本模式的正则表达式。\n*   调用 `os.listdir()` 工作目录中的所有文件。\n\
  *   遍历每个文件名，使用正则表达式检查其是否包含日期。\n*   如果包含日期，使用 `shutil.move()` 重命名文件。\n\n对于这个项目，请打开一个新的文件编辑器窗口，并将代码保存为\
  \ `renameDates.py`。\n\n## 第 1 步：为美式日期创建一个正则表达式\n\n程序的第一部分需要导入必要的模块，并创建一个可以识别 MM-DD-YYYY\
  \ 日期的正则表达式。`TODO` 注释会提醒你程序中还有什么需要编写。将它们输入为 `TODO` 可以方便使用 IDLE 的 CTRL-F 查找功能找到它们。让你的代码看起来如下：\n\
  \n```python\n#! python3\n   # renameDates.py - 将带有美式 MM-DD-YYYY 日期格式的文件名重命名\n  \
  \ # 为欧式 DD-MM-YYYY。\n\n➊ import shutil, os, re\n\n   # 创建一个匹配美式日期格式文件的正则表达式。\n➋\
  \ datePattern = re.compile(r\"\"\"^(.*?) # 日期之前的所有文本\n       ((0|1)?\\d)-      \
  \               # 月份的一或两位数字\n       ((0|1|2|3)?\\d)-                 # 日期的一或两位数字\n\
  \       ((19|20)\\d\\d)                   # 年份的四位数字\n       (.*?)$             \
  \             # 日期之后的所有文本\n➌     \"\"\", re.VERBOSE)\n\n   # TODO: 遍历工作目录中的文件。\n\
  \n   # TODO: 跳过没有日期的文件。\n\n   # TODO: 获取文件名的不同部分。\n\n   # TODO: 构造欧式格式的文件名。\n\n\
  \   # TODO: 获取完整的绝对文件路径。\n\n   # TODO: 重命名文件。\n```\n\n从这一章中，你知道 `shutil.move()`\
  \ 函数可以用于重命名文件：它的参数是要重命名的文件名和新文件名。由于此函数存在于 `shutil` 模块中，你必须导入该模块 ➊。\n\n但在重命名文件之前，你需要识别想要重命名哪些文件。带有日期的文件名（如\
  \ `spam4-4-1984.txt` 和 `01-03-2014eggs.zip`）应该被重命名，而不带日期的文件名（如 `littlebrother.epub`）则可以被忽略。\n\
  \n你可以使用正则表达式来识别这种模式。在顶部导入 `re` 模块后，调用 `re.compile()` 创建一个 `Regex` 对象 ➋。为第二个参数传递\
  \ `re.VERBOSE` ➌ 将允许正则表达式字符串中包含空格和注释，使其更具可读性。\n\n正则表达式字符串以 `^(.*?)` 开头，匹配文件名开头可能出现在日期之前的任何文本。`((0|1)?\\\
  d)` 组匹配月份。第一位数字可以是 `0` 或 `1`，所以正则表达式匹配 12 月的 `12`，也匹配 2 月的 `02`。这个数字也是可选的，因此 4 月可以是\
  \ `04` 或 `4`。日期的组为 `((0|1|2|3)?\\d)`，逻辑类似；`3`、`03` 和 `31` 都是有效的数字。（是的，这个正则表达式会接受一些无效的日期，如\
  \ `4-31-2014`、`2-29-2013` 和 `0-15-2014`。日期有很多棘手的特殊情况很容易被忽略。但为了简单起见，这个程序中的正则表达式已经足够用了。）\n\
  \n虽然 1885 是有效年份，但你只需要寻找 20 世纪或 21 世纪的年份。这将防止你的程序意外匹配具有类似日期格式的非文件名，例如 `10-10-1000.txt`。\n\
  \n正则表达式的 `(.*?)$` 部分匹配日期之后的任何文本。\n\n## 第 2 步：从文件名中识别日期部分\n\n接下来，程序必须遍历 `os.listdir()`\
  \ 返回的文件名字符串列表，并与正则表达式进行匹配。任何不包含日期的文件都应该跳跳。对于包含日期的文件名，匹配到的文本将存储在几个变量中。在你的程序中用以下代码填充前三个\
  \ `TODO`：\n\n```python\n#! python3\n   # renameDates.py - 将带有美式 MM-DD-YYYY 日期格式的文件名重命名\n\
  \   # 为欧式 DD-MM-YYYY。\n\n   --snip--\n\n   # 遍历工作目录中的文件。\n   for amerFilename in\
  \ os.listdir('.'):\n       mo = datePattern.search(amerFilename)\n\n       # 跳过没有日期的文件。\n\
  ➊     if mo == None:\n➋         continue\n➌     # 获取文件名的不同部分。\n       beforePart\
  \ = mo.group(1)\n       monthPart = mo.group(2)\n       dayPart    = mo.group(4)\n\
  \       yearPart   = mo.group(6)\n       afterPart  = mo.group(8)\n\n   --snip--\n\
  ```\n\n如果 `search()` 返回的 `Match` 对象为 `None` ➊，则 `amerFilename` 不匹配正则表达式。`continue`\
  \ 语句 ➋ 将跳过剩余部分并处理下一个文件名。\n\n否则，正则表达式组将存储在 `beforePart`、`monthPart`、`dayPart`、`yearPart`\
  \ 和 `afterPart` 中。为了弄清楚组数字，尝试从头读取正则表达式并在遇到左括号时计数。例如：\n\n```python\ndatePattern =\
  \ re.compile(r\"\"\"¹ # 日期之前的所有文本\n    ((2)(3))-                     # 月份的一或两位数字\n\
  \    ((4)(5))-                 # 日期的一或两位数字\n    ((6)(7))                   # 年份的四位数字\n\
  \    (8)$                          # 日期之后的所有文本\n    \"\"\", re.VERBOSE)\n```\n\n\
  在这里，数字 1 到 8 代表你写的组。\n\n## 第 3 步：构造新文件名并重命名文件\n\n最后一步是将上一步生成的变量与欧式日期拼接：日期在月份之前。用以下代码填充程序中剩下的三个\
  \ `TODO`：\n\n```python\n#! python3\n   # renameDates.py - 将带有美式 MM-DD-YYYY 日期格式的文件名重命名\n\
  \   # 为欧式 DD-MM-YYYY。\n\n   --snip--\n\n   # 构造欧式格式的文件名。\n➊ euroFilename = beforePart\
  \ + dayPart + '-' + monthPart + '-' + yearPart +\n                      afterPart\n\
  \n   # 获取完整的绝对文件路径。\n   absWorkingDir = os.path.abspath('.')\n   amerFilename =\
  \ os.path.join(absWorkingDir, amerFilename)\n   euroFilename = os.path.join(absWorkingDir,\
  \ euroFilename)\n\n   # 重命名文件。\n➋ print('Renaming \"%s\" to \"%s\"...' % (amerFilename,\
  \ euroFilename))\n➌ #shutil.move(amerFilename, euroFilename)   # 测试后取消注释\n```\n\n\
  将拼接后的字符串存储在名为 `euroFilename` 的变量中 ➊。然后，将原始文件名 `amerFilename` 和新变量 `euroFilename`\
  \ 传递给 `shutil.move()` 函数来重命名文件➌。\n\n此程序注释了 `shutil.move()` 调用，而是打印将要重命名的文件 ➋。先这样运行程序可以让你检查文件重命名是否正确。然后你可以取消\
  \ `shutil.move()` 的注释并再次运行程序以实际重命名文件。\n\n## 类似程序的创意\n\n\n\n\n还有许多其他原因导致你可能重命名大量文件：\n\
  \n*   在文件名开头添加前缀，例如通过添加 `spam_` 将 `eggs.txt` 重命名为 `spam_eggs.txt`\n*   将使用欧洲日期格式的文件名更改为美国日期格式\n\
  *   删除如 `spam0042.txt` 等文件中的数字 0\n\n# 项目：将文件夹备份为 ZIP 文件\n\n假设你正在进行一个项目，该项目的文件都保存在名为\
  \ `C:\\AlsPythonBook` 的文件夹中。你担心丢失工作，因此想为整个文件夹创建 ZIP 文件的“快照”。你想保留不同的版本，所以你希望 ZIP\
  \ 文件的文件名在每次创建时都递增；例如，`AlsPythonBook_1.zip`、`AlsPythonBook_2.zip`、`AlsPythonBook_3.zip`\
  \ 等。你可以手动完成这些操作，但这非常繁琐，而且你可能会不小心写错 ZIP 文件的命名的编号。运行一个程序来为你完成这项枯燥的任务要简单得多。\n\n对于这个项目，打开一个新的文件编辑器窗口并将其保存为\
  \ `backupToZip.py`。\n\n## 第一步：确定 ZIP 文件的文件名\n\n该程序的代码将放在一个名为 `backupToZip()` 的函数中。这将方便你将该函数复制粘贴到需要此功能的其他\
  \ Python 程序中。在程序结束时，将调用该函数来执行备份。让你的程序看起来如下：\n\n```\n #! python3\n   # backupToZip.py\
  \ - 将整个文件夹及其内容复制到\n   # 文件名递增的 ZIP 文件中。\n\n➊ import zipfile, os\n\n   def backupToZip(folder):\n\
  \       # 将 \"folder\" 的所有内容备份到 ZIP 文件。\n\n       folder = os.path.abspath(folder)\
  \ # 确保文件夹是绝对路径\n\n       # 根据已存在的文件确定代码应该使用的\n       # 文件名。➋     number = 1\n➌ \
  \    while True:\n           zipFilename = os.path.basename(folder) + '_' + str(number)\
  \ + '.zip'\n           if not os.path.exists(zipFilename):\n               break\n\
  \           number = number + 1\n\n➍     # TODO: 创建 ZIP 文件。\n\n       # TODO: 遍历整个文件夹树并压缩每个文件夹中的文件。\n\
  \       print('Done.')\n\n   backupToZip('C:\\\\delicious')\n```\n\n首先完成基础工作：添加\
  \ shebang (`#!`) 行，描述程序的功能，并导入 `zipfile` 和 `os` 模块 ➊。\n\n定义一个 `backupToZip()` 函数，它只接受一个参数\
  \ `folder`。该参数是需要备份内容的文件夹的字符串路径。函数将决定为其创建的 ZIP 文件使用什么文件名；然后函数将创建文件、遍历 `folder` 文件夹，并将每个子文件夹和文件添加到\
  \ ZIP 文件中。在源代码中为这些步骤编写 `TODO` 注释，提醒自己以后完成它们 ➍。\n\n第一部分是命名 ZIP 文件，使用了 `folder` 绝对路径的基础名称。如果正在备份的文件夹是\
  \ `C:\\delicious`，那么 ZIP 文件的名称应该是 `delicious_N.zip`，其中 `N` = 1 是第一次运行程序时，`N` = 2\
  \ 是第二次，以此类推。\n\n你可以通过检查 `delicious_1.zip` 是否已存在，然后检查 `delicious_2.zip` 是否存在，以此类推来确定\
  \ `N` 应该是多少。使用一个名为 `number` 的变量作为 `N` ➋，并在调用 `os.path.exists()` 的循环内部不断递增它以检查文件是否存在\
  \ ➌。找到第一个不存在的文件名将导致循环 `break`，因为已经找到了新 zip 文件的文件名。\n\n## 第二步：创建新的 ZIP 文件\n\n接下来让我们创建\
  \ ZIP 文件。让你的程序看起来如下：\n\n```\n #! python3\n   # backupToZip.py - 将整个文件夹及其内容复制到\n\
  \   # 文件名递增的 ZIP 文件中。\n\n   --snip--\n       while True:\n           zipFilename\
  \ = os.path.basename(folder) + '_' + str(number) + '.zip'\n           if not os.path.exists(zipFilename):\n\
  \               break\n           number = number + 1\n\n       # 创建 ZIP 文件。\n \
  \      print('Creating %s...' % (zipFilename))\n➊     backupZip = zipfile.ZipFile(zipFilename,\
  \ 'w')\n\n       # TODO: 遍历整个文件夹树并压缩每个文件夹中的文件。\n       print('Done.')\n\n   backupToZip('C:\\\
  \\delicious')\n```\n\n现在新 ZIP 文件的文件名已存储在 `zipFilename` 变量中，你可以调用 `zipfile.ZipFile()`\
  \ 来实际创建 ZIP 文件 ➊。确保将 `'w'` 作为第二个参数传递，以便以写入模式打开 ZIP 文件。\n\n## 第三步：遍历目录树并添加到 ZIP 文件\n\
  \n现在你需要使用 `os.walk()` 函数来完成列出文件夹及其子文件夹中每个文件的工作。让你的程序看起来如下：\n\n```\n #! python3\n\
  \   # backupToZip.py - 将整个文件夹及其内容复制到\n   # 文件名递增的 ZIP 文件中。\n\n   --snip--\n\n  \
  \     # 遍历整个文件夹树并压缩每个文件夹中的文件。\n➊     for folder, subfolders, filenames in os.walk(folder):\n\
  \           print('Adding files in %s...' % (folder))\n           # 将当前文件夹添加到 ZIP\
  \ 文件。➋         backupZip.write(folder)\n           # 将此文件夹中的所有文件添加到 ZIP 文件。➌   \
  \      for filename in filenames:\n               newBase = os.path.basename(folder)\
  \ + '_'\n               # 不要备份 zip 文件\n               if filename.startswith(newBase)\
  \ and filename.endswith('.zip'):\n                   continue\n               backupZip.write(os.path.join(folder,\
  \ filename))\n       backupZip.close()\n       print('Done.')\n\n   backupToZip('C:\\\
  \\delicious')\n```\n\n你可以在 `for` 循环中使用 `os.walk()` ➊，每次迭代都会返回文件夹名称、子文件夹和文件名。\n\n\
  在 `for` 循环中，文件夹被添加到 ZIP 文件 ➋。嵌套的 `for` 循环遍历 `filenames` 列表中的每个文件名 ➌。这些文件都会添加到 ZIP\
  \ 文件，除了已备份的文件。\n\n当你运行此程序时，它将产生如下输出：\n\n```\nCreating delicious_1.zip...\nAdding\
  \ files in C:\\delicious...\nAdding files in C:\\delicious\\cats...\nAdding files\
  \ in C:\\delicious\\waffles...\nAdding files in C:\\delicious\\walnut...\nAdding\
  \ files in C:\\delicious\\walnut\\waffles...\nDone.\n```\n\n第二次运行时，它会将 `C:\\delicious`\
  \ 中的所有文件放入名为 `delicious_2.zip` 的压缩中，以此类推。\n\n## 类似程序的想法\n\n你可以在多个程序中遍历目录树并将添加到压缩存档。例如，你可以编写执行以下操作的程序：\n\
  \n* 遍历目录树并仅归档特定扩展名的文件（如 `.txt` 或 `.py`），而不包含其他\n* 遍历目录树并归档除 `.txt` 和 `.py` 之外的所有文件\n\
  * 在目录树中找到文件最多或占用空间最大的文件夹\n\n## 总结\n\n即使你是经验计算机用户，可能仍然使用鼠标和键盘手动处理文件。现代的文件管理器让你轻松处理少数文件。但有时你需要执行一项使用计算机文件管理器可能花费数小时的任务。\n\
  \n`os` 和 `shutil` 模块提供了复制、移动、重命名和删除文件的函数。在删除文件时，你可能想使用 `send2trash` 模块将文件移动到回收站或垃圾箱，而不是永久删除。在编写处理文件的程序时，良好的做法是注释掉执行实际复制/移动/重命名/删除的代码，取而添加一个\
  \ `print()` 调用，这样你就可以运行程序并验证它将要做什么。\n\n\n\n\n通常你不仅需要对一个文件夹中的文件执行这些操作，还需要对该文件夹中的每一个文件夹、这些文件夹中的每个文件夹等类推执行。`os.walk()`\
  \ 函数会为你处理这种跨文件夹的遍历，这样你就可以专注于你的程序需要对这些文件进行的操作。\n\n`zipfile` 模块提供了一种通过 Python 压缩和提取\
  \ `.zip` 归包文件的方法。结合 `os` 和 `shutil` 的文件处理函数，`zipfile` 可以让你轻松地将硬盘上任意位置的多个文件打包。与许多单独的文件相比，这些\
  \ `.zip` 文件上传到网站或作为电子邮件附件发送要容易得多。\n\n本书的之前几个章节已经为你提供了可供复制的源代码。但当你编写自己的程序时，它们第一次运行可能不会非常完美。下一章将重点介绍一些\
  \ Python 模块，这些模块将帮助你分析和调试程序，以便你能够快速让它们正确运行。\n\n## 练习题\n\n| Q: | 1\\. `shutil.copy()`\
