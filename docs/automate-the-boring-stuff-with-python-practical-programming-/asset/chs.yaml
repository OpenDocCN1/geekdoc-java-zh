  \ to the second paragraph.` 被添加到了 `paraObj1` 的 `Paragraph` 对象中，而它是添加到 `doc` 中的第二个段落。`add_paragraph()`\
  \ 和 `add_run()` 函数分别返回段落和 `Run` 对象，以为你省去麻烦。\n\n生成的文档如[图 13-9] 所示。\n\n图 13-7. `restyled.docx`\
