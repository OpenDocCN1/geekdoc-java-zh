  \ |\n\n## 练习项目\n\n为了练习，请编写执行以下内容的程序。\n\n## PDF 恐惧症\n\n使用第 9 章 中的 `os.walk()` 函数，编写一个脚本，遍历文件夹（及其子文件夹）中的每个\
  \ PDF，并使用命令行提供的密码对 PDF 进行加密。保存每个加密后的 PDF 时，在原始文件名后添加 `_encrypted.pdf` 后缀。在删除原始文件之前，让尝试读取并解密文件以确保加密正确。\n\
  \n然后，编写一个程序，找到文件夹（及其子文件夹）中所有加密的 PDF，并使用提供的密码创建 PDF 的解密副本。如果密码错误，程序应向用户打印消息并继续处理下一个\
  \ PDF。\n\n## 作为 Word 文档的自定义邀请函\n\n假设你有一个包含宾客名单的文本文件。该 `guests.txt` 文件每行一个名字，如下：\n\
  \n```\nProf. Plum\nMiss Scarlet\nCol. Mustard\nAl Sweigart\nRobocop\n```\n\n编写程序生成一个包含自定义邀请函的\
  \ Word 文档，外观类似于图 13-11。\n\n由于 Python-Docx 只能使用 Word 文档中已存在的样式，你必须先将这些样式添加到空白的 Word\
  \ 文件中，然后用 Python-Docx 打开该文件。生成的 Word 文档中每页应有一个邀请函，因此在每个邀请函的最后一个段落之后调用 `add_break()`\
  \ 来分页。这样，你只需要打开一个 Word 文档就可以一次打印所有邀请函。\n\n![你的自定义邀请脚本生成的 Word 文档](img/httpatomoreillycomsourcenostarchimages2189705.png.jpg)\n\
  \n图 13-11。你的自定义邀请脚本生成的 Word 文档。\n\n你可以从*[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)*\
  \ 下载示例的 `guests.txt` 文件。\n\n## 暴力破解 PDF 密码器\n\n假设你有一个加密的 PDF，你忘记了密码，但你记得它是一个英语单词。尝试猜忘记的密码是一项非常无聊的任务。相反，你可以编写一个程序，通过尝试每一个可能的英语单词直到找到一个有效的，来解密该\
  \ PDF。这被称为*暴力破解密码攻击*。从*[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)*\
  \ 下载文本文件 `dictionary.txt`。这个`字典文件`包含了 44,000 多个单词。\n\n# 第 14 章. 处理 CSV 文件和 JSON\
  \ 数据\n\n在第 13 章，你学习了如何从 PDF 和 Word 文档中提取文本。这些文件是二进制格式，需要特殊的模块。相反，CSV 和 JSON 文件只是纯文本文件。你可以在文本编辑器中查看它们。但\
  \ Python 也自带了 `csv` 和 `json` 模块，每个模块都提供了帮助你处理这些文件的函数。\n\n## CSV 模块\n\nCSV 文件中的每一行代表电子表格中的行，逗号分隔单元格。例如，来自*[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)*\
  \ 的电子表格 `example.xlsx` 在 CSV 文件中看起来如下：\n\n```\n4/5/2015 13:34,Apples,73\n4/5/2015\
  \ 3:41,Cherries,85\n4/6/2015 12:46,Pears,14\n4/8/2015 8:59,Oranges,52\n4/10/2015\
  \ 2:07,Apples,152\n4/10/2015 18:10,Bananas,23\n4/10/2015 2:40,Strawberries,98\n\
  ```\n\n我将使用此文件在本章的交互式 shell 示例。你可以从*[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)*\
  \ 下载 `example.csv`，或者将文本输入文本编辑器并保存为 *example.csv*。\n\nCSV 文件很简单，缺少 Excel 电子表格的许多功能。例如，CSV\
  \ 文件\n\n*   值没有类型——所有内容都是字符串\n*   没有字体大小或颜色设置\n*   没有多个工作表\n*   无法指定单元格宽度和高度\n*\
  \   无法合并单元格\n*   无法嵌入图像或图表\n\n\n\n\nCSV 文件的优势在于简单性。CSV 文件被许多类型的程序广泛支持，可以在文本编辑器（包括\
  \ `IDLE` 的文件编辑器）中查看，并且表示电子表格数据的一种直接方法。CSV 格式正如其广告的那样：它只是一个逗号分隔的值的文本文件。\n\n由于 CSV\
  \ 文件仅仅是文本文件，你可能想将它们作为字符串读取，然后使用你在第 8 章 中学习的技巧来处理该字符串。例如，由于 CSV 文件中的每个单元格都用逗号分隔，也许你只需要对每行文本调用\
  \ `split()` 方法来获取值。但并非 CSV 文件中的每个逗号都代表两个单元格之间的边界。CSV 文件还有自己的一套转义字符，允许将逗号和其他字符作为值的一部分。`split()`\
  \ 方法无法处理这些转义字符。由于这些潜在的陷阱，你应该始终使用 `csv` 模块来读取和写入 CSV 文件。\n\n## Reader 对象 (Reader\
  \ Objects)\n\n要使用 `csv` 模块从 CSV 文件读取数据，你需要创建一个 `Reader` 对象。`Reader` 对象允许你遍历 CSV\
  \ 文件中的行。在交互式 shell 中输入以下内容，假设 `example.csv` 在当前工作目录下：\n\n```\n➊ >>> import csv\n\
  ➋ >>> exampleFile = open('example.csv')\n➌ >>> exampleReader = csv.reader(exampleFile)\n\
  ➍ >>> exampleData = list(exampleReader)\n➍ >>> exampleData\n   [['4/5/2015 13:34',\
  \ 'Apples', '73'], ['4/5/2015 3:41', 'Cherries', '85'],\n   ['4/6/2015 12:46', 'Pears',\
  \ '14'], ['4/8/2015 8:59', 'Oranges', '52'],\n   ['4/10/2015 2:07', 'Apples', '152'],\
  \ ['4/10/2015 18:10', 'Bananas', '23'],\n   ['4/10/2015 2:40, 'Strawberries', '98']]\n\
  ```\n\n`csv` 模块随 Python 一起提供，因此我们可以直接导入它 ➊，无需预先安装。\n\n要用 `csv` 模块读取 CSV 文件，首先使用\
  \ `open()` 函数打开它 ➋，就像处理任何其他文本文件一样。但不要在 `open()` 返回的 `File` 对象上调用 `read()` 或 `readlines()`\
  \ 方法，而是将其传递给 `csv.reader()` 函数 ➌。这将为你返回一个 `Reader` 对象供你使用。请注意，你不需要直接将文件名字符串传递给 `csv.reader()`\
  \ 函数。\n\n访问 `Reader` 对象中值的最直接方法是通过将其传递给 `list()` 将其转换为一个普通的 Python 列表 ➍。对此 `Reader`\
  \ 对象使用 `list()` 会返回一个列表列表，你可以将其存储在像 `exampleData` 这样的变量中。在 shell 中输入 `exampleData`\
  \ 会显示该列表列表 ➎。\n\n现在你已经拥有了作为列表列表的 CSV 文件，你可以使用表达式 `exampleData[row][col]` 访问特定行和列的值，其中\
  \ `row` 是 `exampleData` 中某个列表的索引，而 `col` 是你想要从该列表中获取的项目索引。在交互式 shell 中输入以下内容：\n\n\
  ```\n>>> exampleData[0][0]\n'4/5/2015 13:34'\n>>> exampleData[0][1]\n'Apples'\n\
  >>> exampleData[0][2]\n'73'\n>>> exampleData[1][1]\n'Cherries'\n>>> exampleData[6][1]\n\
  'Strawberries'\n```\n\n`exampleData[0][0]` 进入第一个列表并带给我们第一个字符串，`exampleData[0][2]`\
  \ 进入第一个列表并带给我们第三个字符串，依此类推。\n\n## 在 for 循环中从 Reader 对象读取数据\n\n对于大型 CSV 文件，你可能希望在\
  \ `for` 循环中使用 `Reader` 对象。这可以避免一次性将整个文件加载到内存中。例如，在交互式 shell 中输入以下内容：\n\n```\n>>>\
  \ import csv\n>>> exampleFile = open('example.csv')\n>>> exampleReader = csv.reader(exampleFile)\n\
  >>> for row in exampleReader:\n        print('Row #' + str(exampleReader.line_num)\
  \ + ' ' + str(row))\n\nRow #1 ['4/5/2015 13:34', 'Apples', '73']\nRow #2 ['4/5/2015\
  \ 3:41', 'Cherries', '85']\nRow #3 ['4/6/2015 12:46', 'Pears', '14']\nRow #4 ['4/8/2015\
  \ 8:59', 'Oranges', '52']\nRow #5 ['4/10/2015 2:07', 'Apples', '152']\nRow #6 ['4/10/2015\
  \ 18:10', 'Bananas', '23']\nRow #7 ['4/10/2015 2:40, 'Strawberries', '98']]\n```\n\
  \n## Writer 对象 (Writer Objects)\n\n`Writer` 对象允许你向 CSV 文件写入数据。`writerow()` 方法接受一个列表参数。列表中的每个值都被放置在输出的相应单元格中。`writerow()`\
  \ 的返回值写入文件的字符数。\n\n这段代码产生了一个这样的 *output.csv* 文件：\n\n```\nspam,eggs,bacon,ham\n\"\
  Hello, world!\",eggs,bacon,ham\n1,2,3\n```\n\n注意 `Writer` 对象如何用双引号对 `'Hello, world!'`\
  \ 值中的逗号进行转义。\n\n## delimiter 和 linetinator 参数\n\n假设你想用制表符代替逗号分隔单元格，并希望行之间有双倍间距。你可以在交互式\
  \ shell 中输入类似的内容：\n\n```\n >>> import csv\n   >>> csvFile = open('example.tsv',\
  \ 'w', newline='')\n➊ >>> csvWriter = csv.writer(csvFile, delimiter='\\t', linetinator='\\\
  n\\n')\n   >>> csvWriter.writerow(['apples', 'oranges', 'grapes'])\n   24\n   >>>\
  \ csvWriter.writerow(['eggs', 'bacon', 'ham'])\n   17\n   >>> csvWriter.writerow(['spam',\
  \ 'spam', 'spam', 'spam', 'spam', 'spam'])\n   32\n   >>> csvFile.close()\n```\n\
  \n这更改了文件中分隔符和换行符。*delimiter*（分隔符）是行上单元格之间的字符。默认情况下，CSV 文件的分隔符是逗号。*line terminator*（换行符）是行尾的字符。默认情况下，换行符是换行符。你可以通过在使用\
  \ `csv.writer()` 时使用 `delimiter` 和 `lineterminator` 关键字参数将字符改为不同的值。\n\n\n\n\n```\n\
  apples  oranges grapes\n\neggs    bacon   ham\nspam    spam    spam    spam    spam\
  \    spam\n```\n\n现在我们的单元格已经制表符隔开了，我们使用扩展名 `*.tsv*` 表示制表符分隔的值。\n\n# 项目：从 CSV 文件中移除表头\n\
  \n假设你有一项无聊的工作：需要从数百个 CSV 文件中删除第一行。也许你正要把它们输入到某个自动化过程中，该过程只需要数据而不需要列顶部的表头。你*可以*在\
  \ Excel 中打开每个文件，删除第一行并重新保存文件——但这将花费几个小时。让我们写一个程序来完成这项任务。\n\n该程序需要打开当前工作目录中所有 `*.csv`\
  \ 扩展的文件，读取 CSV 文件的内容，并将不包含第一行的内容重写到同名的文件中。这将用新的、无表头的内容替换 CSV 文件的旧内容。\n\n### 注意事项\n\
  \n正如一往的常，每当你编写一个修改文件的程序时，请务必先备份文件，以万一你的程序运行结果不像你预期的那样。你不希望意外删除自己的原始文件。\n\n从高层次来说，程序必须执行以下操作：\n\
  \n* 找到当前工作目录中的所有 CSV 文件。\n* 读取每个文件的完整内容。\n* 跳过第一行，将内容写入新的 CSV 文件中。\n\n在代码层面，这意味着程序需要执行以下操作：\n\
  \n* 遍历从 `os.listdir()` 获取的文件列表，并跳过非 CSV 文件。\n* 创建一个 CSV `Reader` 对象并读取文件内容，使用 `line_num`\
  \ 属性来确定要跳过哪一行。\n* 创建一个 CSV `Writer` 对象并将读取的数据写入新文件。\n\n对于这个项目，请打开一个新的文件编辑器窗口并将其保存为\
  \ *removeCsvHeader.py*。\n\n## 第 1 步：遍历每个 CSV 文件\n\n程序需要做的第一件事是遍历当前工作目录中所有 CSV 文件名的列表。让你的\
  \ *removeCsvHeader.py* 看起来像这样：\n\n```python\n #! python3\n   # removeCsvHeader.py\
  \ - 移除当前工作\n   # 目录中所有 CSV 文件的表头。\n\n   import csv, os\n\n   os.makedirs('headerRemoved',\
  \ exist_ok=True)\n\n   # 遍历当前工作目录中的每一个文件。\n   for csvFilename in os.listdir('.'):\n\
  \       if not csvFilename.endswith('.csv'):\n           continue    # 跳过非 csv 文件\n\
  \n       print('Removing header from ' + csvFilename + '...')\n\n       # TODO:\
  \ 读取 CSV 文件（跳过第一行）。\n\n       # TODO: 写入 CSV 文件。\n```\n\n`os.makedirs()` 调用将创建一个\
  \ `headerRemoved` 文件夹，所有无表头的 CSV 文件将被写入其中。在 `os.listdir('.')` 上使用 `for` 循环可以完成部分工作，但它会遍历工作目录中的*所有*文件，因此你需要在循环开始添加一些代码，跳过不以\
  \ `.csv` 结尾的文件。`continue` 语句会让 `for` 循环在遇到非 CSV 文件时移动到下一个文件名。\n\n为了让程序在运行时有些输出，请打印一条消息显示程序正在处理哪个\
  \ CSV 文件。然后，为程序的剩余部分添加一些 `TODO` 注释。\n\n## 第 2 步：读取 CSV 文件\n\n程序并没有从 CSV 文件中删除第一行，而是创建了一个不包含第一行的\
  \ CSV 文件副本。由于副本的文件名与原始文件名相同，副本将覆盖原始文件。\n\n程序需要一种方法来跟踪当前是否正在循环第一行。在 *removeCsvHeader.py*\
  \ 中添加以下内容：\n\n```python\n#! python3\n# removeCsvHeader.py - 移除当前工作\n# 目录中所有 CSV\
  \ 文件的表头。\n\n--snip--\n# 读取 CSV 文件（跳过第一行）。\ncsvRows = []\ncsvFileObj = open(csvFilename)\n\
  readerObj = csv.reader(csvFileObj)\nfor row in readerObj:\n    if readerObj.line_num\
  \ == 1:\n        continue    # 跳过第一行\n    csvRows.append(row)\ncsvFileObj.close()\n\
  \n# TODO: 写入 CSV 文件。\n```\n\n`Reader` 对象的 `line_num` 属性可以用于确定当前正在读取 CSV 文件中的哪一行。另一个\
  \ `for` 循环将遍历从 CSV `Reader` 对象返回的行，除第一行以外的所有行都将添加到 `csvRows` 中。\n\n当 `for` 循环遍历每一行时，代码会检查\
  \ `readerObj.line_num` 是否被设置为 `1`。如果是，它将执行 `continue` 以移动到下一行，而不将其添加到 `csvRows`\
  \ 中。对于之后的每一行，条件将始终为 `False`，该行将被添加到 `csvRows` 中。\n\n## 第 3 步：写入不包含第一行的 CSV 文件\n\n\
  现在 `csvRows` 包含了除第一行以外的所有行，需要将该列表写入 *headerRemoved* 文件夹中的 CSV 文件。在 *removeCsvHeader.py*\
  \ 中添加以下内容：\n\n```python\n #! python3\n   # removeCsvHeader.py - 移除当前工作\n   # 目录中所有\
  \ CSV 文件的表头。\n   --snip--\n\n   # 遍历当前工作目录中的每一个文件。\n   for csvFilename in os.listdir('.'):\n\
  \       if not csvFilename.endswith('.csv'):\n           continue    # 跳过非 csv 文件\n\
  \n       --snip--\n\n       # 写入 CSV 文件。\n       csvFileObj = open(os.path.join('headerRemoved',\
  \ csvFilename), 'w', newline='')\n       csvWriter = csv.writer(csvFileObj)\n  \
  \     for row in csvRows:\n           csvWriter.writerow(row)\n       csvFileObj.close()\n\
  ```\n\n`Writer` 对象将把读取的数据写入新文件。这将用新的、无表头的内容替换 CSV 文件的旧内容。\n\n`Writer` 对象将通过 `csvFilename`\
  \ 将列表写入 `headerRemoved` 中的 CSV 文件。当循环结束，程序就完成了。\n\n为了测试你的程序，请从 [`nostarch.com/automatuff/`](http://nostarch.com/automatuff/)\
  \ 下载 *removeCsvHeader.zip* 并解压到文件夹。在该目录下运行 *removeCsvHeader.py* 程序。输出如下：\n\n```\n\
  Removing header from NAICS_data_1048.csv...\nRemoving header from NAICS_data_1218.csv...\n\
  Removing header from NAICS_data_9834.csv...\nRemoving header from NAICS_data_9986.csv...\n\
  ```\n\n该程序每次从 CSV 文件提取第一行都会打印文件名。\n\n## 类似程序的创意\n\n为 CSV 文件编写程序与为 Excel 文件编写程序非常相似，因为它们都是表格文件。你可以编写执行以下操作的程序：\n\
  \n* 比较 CSV 文件不同行之间或多个 CSV 文件之间的数据。\n* 将特定数据从 CSV 文件复制到 Excel 文件，或反之。\n* 检查 CSV 文件中的无效数据或格式错误并提醒用户这些错误。\n\
  * 从 CSV 文件读取数据作为你的 Python 程序的输入。\n\n# JSON 和 API\n\nJavaScript 对象符号（JSON）是一种将数据格式化为单个人类可读字符串的流行方法。JSON\
  \ 是 JavaScript 程序写入数据结构的原生方式，通常类似于 Python `pprint()` 函数产生的结果。你不需要 JavaScript 就可以处理\
  \ JSON 格式的数据。\n\n这里有一个 JSON 格式数据的示例：\n\n```json\n{\"name\": \"Zophie\", \"isCat\"\
  : true,\n \"miceCaught\": 0, \"napsTaken\": 37.5,\n \"felineIQ\": null}\n```\n\n\
  了解 JSON 很有用，因为许多网站提供 JSON 内容作为程序与网站交互的方式。这被称为提供*应用程序编程接口 (API)*。访问 API 与通过 URL 访问任何其他网页相同。区别在于\
  \ API 返回的数据格式（例如 JSON）是为机器准备的；API 对人类来说并不易读。\n\n\n\n\n许多网站以 JSON 格式提供其数据。Facebook、Twitter、Yahoo、Google、Tumblr、Wikipedia、Flickr、Data.gov、Reddit、IMDb、Rotten\
  \ Tomatoes、LinkedIn 以及许多热门网站都提供了供程序使用的 API。其中一些网站需要注册，这几乎总是免费的。你需要找到文档，了解你的程序为了获取所需的数据需要请求哪些\
  \ URL，以及返回的 JSON 数据结构的通用格式。这些文档应该由提供 API 的网站提供；如果他们有“开发者”（Developers）页面，请在该页面查找文档。\n\
  \n使用 API，你可以编写执行以下操作的程序：\n\n*   从网站抓取原始数据。（访问 API 通常比下载网页并使用 `Beautiful Soup` 解析\
  \ HTML 更方便。）\n*   自动从你的某个社交网络账户下载新帖子，并将其发布到另一个账户。例如，你可以将你的 `Tumblr` 帖子发布到 `Facebook`。\n\
  *   通过从 `IMDb`、`Rotten Tomatoes` 和 `Wikipedia` 获取数据并将其放入计算机上的单个文本文件中，为你的个人电影收藏创建一个“电影百科书”。\n\
  \n你可以在 `[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)` 资源中看到一些\
  \ JSON API 的示例。\n\n# JSON 模块\n\nPython 的 `json` 模块处理了带有 JSON 数据的字符串与 Python 值之间转换的所有细节，适用于\
  \ `json.loads()` 和 `json.dumps()` 函数。JSON 无法存储*每一种* Python 值。它只能包含以下数据类型的值：字符串、整数、浮点数、布尔值、列表、字典和\
  \ `NoneType`。JSON 无法表示 Python 特有的对象，例如 `File` 对象、CSV `Reader` 或 `Writer` 对象、`Regex`\
  \ 对象或 Selenium `WebElement` 对象。\n\n## 使用 loads() 函数读取 JSON\n\n要将包含 JSON 数据的字符串转换为\
  \ Python 值，请将其传递给 `json.loads()` 函数。（该名称意思是“加载字符串”，而不是“loads”）。在交互式外壳中输入以下内容：\n\n\
  ```\n>>> stringOfJsonData = '{\"name\": \"Zophie\", \"isCat\": true, \"miceCaught\"\
  : 0,\n\"felineIQ\": null}'\n>>> import json\n>>> jsonDataAsPythonValue = json.loads(stringOfJsonData)\n\
  >>> jsonDataAsPythonValue\n{'isCat': True, 'miceCaught': 0, 'name': 'Zophie', 'felineIQ':\
  \ None}\n```\n\n在导入 `json` 模块后，你可以调用 `loads()` 并传递一个 JSON 数据字符串。注意 JSON 字符串始终使用双引号。它将该数据作为\
  \ Python 字典返回。Python 字典是无序的，因此在打印 `jsonDataAsPythonValue` 时，键值对可能会以不同的顺序出现。\n\n\
  ## 使用 dumps() 函数写入 JSON\n\n`json.dumps()` 函数（意思是“转储字符串”，而不是“dumps”）将一个 Python 值转换为\
  \ JSON 格式的数据的字符串。在交互式外壳中输入以下内容：\n\n```\n>>> pythonValue = {'isCat': True, 'miceCaught':\
  \ 0, 'name': 'Zophie',\n'felineIQ': None}\n>>> import json\n>>> stringOfJsonData\
  \ = json.dumps(pythonValue)\n>>> stringOfJsonData\n'{\"isCat\": true, \"felineIQ\"\
  : null, \"miceCaught\": 0, \"name\": \"Zophie\" }'\n```\n\n该值只能是以下基本 Python 数据类型之一：字典、列表、整数、浮点数、字符串、布尔值或\
  \ `None`。\n\n# 项目：获取当前天气数据\n\n检查天气似乎相当简单：打开你的网络浏览器，点击地址栏，输入天气网站的 URL（或搜索一个网站然后点击链接），等待页面加载，忽略所有广告，等等。\n\
  \n实际上，如果你有一个程序可以下载未来几天的天气预报并将其以纯文本形式打印，你就可以跳过很多无聊的步骤。该程序使用了第 11 章中的 `requests` 模块从网络下载数据。\n\
  \n总的来说，该程序执行以下操作：\n\n*   从命令行读取请求的位置。\n*   从 `OpenWeatherMap.org` 下载 JSON 天气数据。\n\
  *   将 JSON 数据字符串转换为 Python 数据结构。\n*   打印今天以及后两天的天气。\n\n因此，代码需要执行以下操作：\n\n*   合并\
  \ `sys.argv` 中的字符串以获取位置。\n*   调用 `requests.get()` 下载天气数据。\n*   调用 `json.loads()`\
  \ 将 JSON 数据转换为 Python 数据结构。\n*   打印天气预报。\n\n对于这个项目，打开一个新的文件编辑器窗口并将其保存为 `quickWeather.py`。\n\
  \n##  1 ：从命令行参数获取位置\n\n该程序的输入将来自命令行。让 `quickWeather.py` 看起来像：\n\n```\n#! python3\n\
  # quickWeather.py - 从命令行打印某个位置的天气。\n\nimport json, requests, sys\n\n# 从命令行参数计算位置。\n\
  if len(sys.argv) < 2:\n    print('Usage: quickWeather.py location')\n    sys.exit()\n\
  location = ' '.join(sys.argv[1:])\n\n# TODO: 从 OpenWeatherMap.org 的 API 下载 JSON\
  \ 数据。\n\n# TODO: 将 JSON 数据加载到 Python 变量中。\n```\n\n在 Python 中，命令行参数存储在 `sys.argv`\
  \ 列表中。在 `#!` 散 shell 行和 `import` 语句之后，程序将检查是否有多个命令行参数。（记得 `sys.argv` 始终包含一个元素 `sys.argv[0]`，即\
  \ Python 脚本的文件。）如果列表中只有一个元素，说明用户没有在命令行提供位置，程序将提供“用法”信息并结束。\n\n命令行参数按空格分割。命令行参数 `San\
  \ Francisco, CA` 会使 `sys.argv` 持有 `['quickWeather.py', 'San', 'Francisco,', 'CA']`。因此，调用\
  \ `join()` 方法合并 `sys.argv` 中第一个以外的所有元素。将此合并后的字符串存储在变量 `location` 中。\n\n## 第二：下载\
  \ JSON 数据\n\nOpenWeatherMap 提供 JSON 格式的实时天气信息。你的程序只需要下载 `[`api.openweathermap.org/data/2.5/forecast/daily?q=<Location>&cnt=3`](http://api.openweathermap.org/data/2.5/forecast/daily?q=%3CLocation%3E&cnt=3)`\
  \ 页面，其中 `<Location>` 是你想要的城市。向 `quickWeather.py` 添加以下内容。\n\n```\n#! python3\n# quickWeather.py\
  \ - 从命令行打印某个位置的天气。\n\n--snip--\n\n# 从 OpenWeatherMap.org 的 API 下载 JSON 数据。\nurl\
  \ ='http://api.openweathermap.org/data/2.5/forecast/daily?q=%s&cnt=3' % (location)\n\
  response = requests.get(url)\nresponse.raise_for_status()\n\n# TODO: 将 JSON 数据加载到\
  \ Python 变量中。\n```\n\n我们从命令行参数获取了 `location`。为了构造我们要访问的 URL，我们使用 `%s` 占符并将存储在 `location`\
  \ 中的字符串插入 URL 字符串的该位置。我们将结果存储在 `url` 中并将其传递给 `requests.get()`。`requests.get()` 调用返回一个\
  \ `Response` 对象，你可以通过调用 `raise_for_status()` 来检查错误。如果没有异常，下载的文本将在 `response.text`\
  \ 中。\n\n## 第三：加载 JSON 数据并打印天气\n\n`response.text` 成员变量持有一个大型 JSON 格式数据字符串。要将其转换为\
  \ Python 值，请调用 `json.loads()` 函数。JSON 数据看起来如下：\n\n\n\n\n\n```python\n{'city': {'coord':\
  \ {'lat': 37.7771, 'lon': -122.42},\n          'country': 'United States of America',\n\
  \          'id': '5391959',\n          'name': 'San Francisco',\n          'population':\
  \ 0},\n'cnt': 3,\n'cod': '200',\n'list': [{'clouds': 0,\n          'deg': 233,\n\
  \          'dt': 1402340000,\n          'humidity': 58,\n          'pressure': 101223,\n\
  \          'speed': 1.96,\n          'temp': {'day': 302.29,\n                 \
  \  'eve': 296.46,\n                   'max': 302.29,\n                   'min':\
  \ 289.77,\n                   'morn': 294.59,\n                   'night': 289.77},\n\
  \          'weather': [{'description': 'sky is clear',\n                       'icon':\
  \ '0d'}]}\n```\n\n你可以通过将 `weatherData` 传递给 `pprint()` 查看这些数据。你可能想检查 [`openweathermap.org`](http://openweathermap.org/)\
  \ 获取更多关于这些字段含义的文档。例如，在线文档会告诉你 `day` 是开尔文单位的白天温度，而不是摄氏度或华氏度。\n\n你需要的天气描述是 `main`\
  \ 和 `description`。为了整齐地打印它们，请将以下内容添加到 `quickWeather.py`：\n\n```python\npython3\n\
  # quickWeather.py - 输出某个位置的天气。\n\n# 将 JSON 数据加载到变量。\nweatherData = json.loads(response.text)\n\
  # 打印天气描述。\nw = weatherData['list']\nprint('Current weather in %s:' % (location))\n\
  print(w[0]['weather'][0]['main'], w[0]['weather'][0]['description'])\nprint('Tomorrow:')\n\
  print(w[1]['weather'][0]['main'], w[1]['weather'][0]['description'])\nprint('Day\
  \ after tomorrow:')\nprint(w[2]['weather'][0]['main'], w[2]['weather'][0]['description'])\n\
  ```\n\n注意代码如何将 `weatherData['list']` 存储在变量 `w` 中以节省输入量。你使用 `w[0]`、`w[1]` 和 `w[2]`\
  \ 分别获取今天、明天和后天的字典。这些字典中的每一个都有一个 `weather` 键，其值是一个列表。你感兴趣的是列表中的第一个项，这是一个在索引 0 处具有多个更多键的嵌套字典。在这里，我们打印存储在\
  \ `main` 和 `description` 键中的值，并用连字符分隔。\n\n当使用命令行参数 `quickWeather.py San Francisco,\
  \ CA` 运行此程序时，输出如下：\n\n```\nCurrent weather in San Francisco, CA:\nClear - sky is\
  \ clear\n\nTomorrow:\nClouds - few clouds\n\nDay after tomorrow:\nClear - sky is\
  \ clear\n```\n\n（天气是我喜欢住在旧金山的原因之一！）\n\n## 类似程序的创意\n\n访问天气数据可以作为许多类型程序的基础。你可以创建类似的程序来实现：\n\
  \n- 收集多个营地或徒步路线的天气预报，查看哪一个地方的天气最好。\n- 调度程序定期检查天气，如果你需要将植物移到室内，则向你发送霜冻警报。（第 15 章\
  \ 涵盖调度，第 16 章 “发送电子邮件和短信”解释了如何发送电子邮件。）\n- 从多个站点抓取天气数据并一次性显示，或计算并显示多个天气预测的平均值。\n\n\
  ## 总结\n\nCSV 和 JSON 是存储数据的常用纯文本格式。它们便于程序解析，同时保持了人类可读性，因此通常被用于简单的电子表格或 Web 应用数据。`csv`\
  \ 和 `json` 模块大大简化了读写 CSV 和 JSON 文件的过程。\n\n最后几个章节教了你如何使用 Python 解析来自各种文件格式的信息。一个常见任务是从各种格式获取数据，并解析出你所需的特定信息。这些任务通常非常具体，商业软件往往无法提供最佳帮助。通过编写自己的脚本，你可以让计算机处理这些格式呈现的大量数据。\n\
  \n在 第 15 章 “管理时间、调度任务和启动程序”中，你将脱离数据格式，学习如何让你的程序通过发送电子邮件和短信与你通信。\n\n## 练习题\n\n| Q:\
