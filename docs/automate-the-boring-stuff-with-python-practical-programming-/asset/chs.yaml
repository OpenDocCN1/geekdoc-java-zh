  \ == 5))\n(True and True) and (True == False)\n(not False) or (not True)\n```\n\
  | Q: | 5\\. 六个比较运算符是什么？ |\n| Q: | 6\\. 等于运算符与赋值运算符之间的区别是什么？ |\n| Q: | 7\\. 解释什么是条件以及你在什么地方使用它。\
