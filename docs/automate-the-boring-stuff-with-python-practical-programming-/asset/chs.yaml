- "# Python 自动化无聊任务：零基础学者实用编程指南\n\n\n\n\n\n\n\n\n> 送我的侄子 Jack\n\n# 关于作者\n\nAl Sweigart\
  \ 是一位住在旧金山的软件开发者和技术书籍作者。Python 是他最喜欢的编程语言，他还是该语言多个开源模块的开发者。他的其他书籍可以在他的网站 [`www.inventwithpython.com/`](http://www.inventwithpython.com/)\
  \ 上通过知识共享许可协议免费获取。他的猫重达 14 磅。\n\n# 关于技术审查员\n\nAri Lacenski 是一位 Android 应用开发者和 Python\
  \ 软件开发者。她住在旧金山，在 [`gradlewhy.ghost.io/`](http://gradlewhy.ghost.io/) 编写 Android\
  \ 编程，并在 Women Who Code 担任导师。她还是一位民谣吉他手手。\n\n# 致谢\n\n如果没有许多人的帮助，我无法写出这样的一本书。我要感谢\
  \ Bill Pollock；我的编辑 Laurel Chun、Leslie Shen、Greg Poulos 和 Jennifer Griffith-Delgado；以及\
  \ No Starch Press 的全体员工提供的宝贵帮助。感谢我的技术审查员 Ari Lacenski 提供的极佳建议、编辑和支持。\n\n非常感谢我们的“终身独裁者”\
  \ Guido van Rossum 以及 Python 软件基金会的所有人的卓越工作。Python 社区是我在科技行业发现的最优秀的社区。\n\n最后，我要感谢我的家人、朋友以及\
  \ Shotwell’s 的伙伴们，不介意我在写书期间忙碌的生活。干杯！\n\n# 引言\n\n“你只用两个小时就完成了我们三个人需要两天才能完成的工作。”我的大学室友在\
  \ 2000 年代初在一家零售电子产品商店工作。偶尔，商店会收到来自竞争对手的一份包含数千种产品价格的电子表格。一个由三人组成的团队会将电子表格打印在厚叠纸上，然后分头处理。对于每个产品价格，他们会查询自己商店的价格，并记录所有竞争对手售价更低的产品。这通常需要几天时间。\n\
  \n“你们知道，如果你有打印件的原始文件，我可以写一个程序来做这件事，”我的室友看到他们坐在地板上，周围散落和堆叠着纸时对他们说道。\n\n几个小时后，他写了一个短程序，程序可以从文件中读取竞争对手的价格，在商店的数据库中找到该产品，并记录竞争对手是否便宜。他当时还是编程新手，大部分时间都花在查阅编程书籍文档上。实际程序运行只需要几秒钟。我的室友和同事们那天吃了一顿超长的午餐。\n\
  \n这就是计算机编程的力量。计算机就像一把瑞士军刀，你可以针对无数任务对它进行配置。许多人花费数小时点击和打字来执行重复性任务，却不知道如果给机器正确的指令，他们使用的机器可以在几秒钟内完成他们的工作。\n\
  \n# 这本书是给谁看的？\n\n软件是我们今天使用的许多工具的核心：几乎每个人都使用社交网络进行通信，许多人的手机里有连接互联网的电脑，而大多数办公室工作都涉及与计算机交互以完成工作。因此，对会编程的人员的需求急剧增长。无数书籍、交互式网络教程和开发者训练营都承诺将野心勃勃的初学者转变为年薪六位数的软件工程师。\n\
  \n这本书不是给那些人看的。它是给其他人准备的。\n\n单看这本书，它并不能让你成为专业的软件开发者，就像几节吉他课无法让你成为摇滚明星一样。但如果你是一名办公人员、行政人员、学者或任何其他使用计算机工作或娱乐的人员，你将学习编程基础，以便能够自动执行以下简单任务：\n\
  \n*   移动和重命名数千个文件并将它们分类到文件夹中\n*   填写在线表单，无需打字\n*   每当网站更新时下载文件或从网站复制文本\n*   让你的计算机通过短信发送自定义通知\n\
  *   更新或格式化 Excel 表格\n*   检查电子邮件并发送预先写的回复\n\n这些任务对人类来说简单但耗费时间，而且它们往往非常微不足道或具体，以至于没有现成的软件来执行它们。掌握一点编程知识，你就可以让计算机为你完成这些任务。\n\
  \n# 规范\n\n本书的设计并不是作为参考手册；它是一本面向初者的指南。代码风格有时会违背最佳实践（例如，某些程序使用全局变量），但这是为了让代码更容易学习而做的权衡。这本书是为了人们编写“一次性代码”而制作的，因此在风格和优雅性上没有花费太多时间。复杂的编程概念——如面向对象编程、列表推导式和生成器——因为它们增加了复杂性而未涵盖。资深程序员可能会指出书中的代码可以如何修改以提高效率，但本书主要关注如何用最少的精力让程序运行。\n\
  \n# 什么是编程？\n\n电视节目和电影经常显示程序员在闪烁的屏幕上疯狂地输入加密的 1 和 0 流，但现代编程并没有那么神秘。编程简单来说就是为计算机输入要执行的指令的行为。这些指令可能会计算某些数字、修改文本、在文件中查找信息，或通过互联网与其他计算机通信。\n\
  \n所有程序都使用基础指令作为构建块。这里是一些最常见的指令，用英语描述：\n\n*   “做这个；然后做那个。”\n*   “如果此条件成立，执行此操作；否则执行该操作。”\n\
  *   “重复执行此操作。”\n*   “持续这样做直到此条件成立。”\n\n你可以组合这些构建块来实现更复杂的决策。例如，这里是用 Python 语言编写的一个简单程序的指令，称为源代码。从顶部开始，Python\
  \ 软件执行每一行代码（某些行仅在特定条件成立时执行，否则执行另一行），直到到达底部。\n\n```\npasswordFile = open('SecretPasswordFile.txt')\n\
  ➋ secretPassword = passwordFile.read()\n➌ print('Enter your password.')\n  typedPassword\
  \ = input()\n➍ if typedPassword == secretPassword:\n➎    print('Access granted')\n\
  ➏ if typedPassword == '12345':\n➐       print('那是会放在行李上的密码。')\n  else:\n➑    print('Access\
  \ denied')\n```\n\n你可能对编程一无所知，但通过阅读之前的代码，你可能会做一个合理的猜测。首先，打开 `SecretPasswordFile.txt`\
  \ 文件 ➊，并读取其中的密码 ➋。然后，提示用户输入密码（来自键盘）➌。比较这两个密码 ➍，如果它们相同，程序会在屏幕上打印 *允许访问* ➎。接下来，程序检查密码是否为\
  \ `12345` ➏，并暗示这种选择可能不是最好的 ➐。如果密码不相同，程序会在屏幕上打印 *拒绝访问* ➑。\n\n## 什么是 Python？\n\n\n\
  \n\n\n`Python` 指 Python 编程语言（包含编写被视为有效 Python 代码的语法规则）以及读取源代码（用 Python 语言编写）并执行其指令的\
  \ Python 解释器软件。Python 解释器可以从 `[`python.org/`](http://python.org/)]` 免费下载，并提供 Linux、OS\
  \ X 和 Windows 版本。\n\nPython 的名字来源于超现实主义英国喜剧小组“蒙提派剧”（Monty Python），而不是指蛇。Python 程序员被亲切地称为\
  \ Pythonistas（Python ），蒙提派剧和蛇的引用通常会穿插在 Python 教程和文档中。\n\n## 程序员不需要掌握大量数学\n\n我听过的关于学习编程的最常见的焦虑是，人们认为这需要大量的数学。实际上，大多数编程不需要基础算术以外的数学知识。事实上，擅长编程与擅长解数独游戏并没有太大区别。\n\
  \n要解开数独谜，必须在整个 9×9 盘格的每一行、每一列以及每个 3×3 内部方格内填入 1 到 9 的数字。你通过对初始数字应用推论和逻辑来找到解决方案。例如，由于数字\
  \ 5 出现在 `图 1` 所示数独题的左上角，它不能出现在顶行的其他地方、最左列或左上角的 3×3 方格中。一次解决一行、一列或一个方格将为谜题的其他部分提供更多数字线索。\n\
  \n![一个新的数独题（左侧）及其解决方案（右侧）。尽管使用了数字，数独并不涉及大量数学。（图像 © Wikimedia Commons）](img/httpatomoreillycomsourcenostarchimages2189555.png.jpg)\n\
  \n图 1。一个新的数独题（左侧）及其解决方案（右侧）。尽管使用了数字，数独并不涉及大量数学。（图像 © Wikimedia Commons）\n\n仅仅因为数独涉及数字并不意味着你必须擅长数学才能算出答案。编程也是如此。就像解数独一样，编写程序涉及将问题分解为单个、详细的步骤。同样，当你`debugging`\
  \ 程序时（即查找并修复错误），你会耐心地观察程序在做什么，并找到 bug 的原因。和所有技能一样，你编程得越频繁，就会变得越好。\n\n## 编程是一项创意活动\n\
  \n编程是一项创意任务，类似于用乐高积木搭建城堡。你先对城堡的样子有一个基本想法，并清点可用积木。然后开始构建。一旦你完成了程序的编写，你可以像装饰城堡一样美化你的代码。\n\
  \n编程与其他创意活动的区别在于，在编程时，你的计算机里拥有所需的所有原材料；你不需要购买任何额外的画布、颜料、胶片、线、乐高积木或电子元件。当你的程序写好，它可以轻松地在网上与全世界共享。尽管你在编程时会出错，但这项活动仍然非常有趣。\n\
  \n# 关于本书\n\n本书的第一部分涵盖了基础 Python 编程概念，第二部分了你可以让计算机自动化的各种任务。第二部分的每个章节都有项目程序供你学习。以下是每个章节内容的简要介绍：\n\
  \n**第一部分]` 免费下载 Windows、OS X 和 Ubuntu 的 Python。如果你从下载页面下载最新版本，书中所有的程序都应该运行。\n\n\
  ## 警告\n\n*务必下载 Python 3 版本（例如 3.4.0）。书中的程序是为 Python 3 编写，在 Python 2 上可能无法正确运行或根本无法运行。*\n\
  \n\n\n\n你可以在下载页面找到适用于每个操作系统的 64 位和 32 位计算机的 Python 安装程序，因此首先要确定你需要哪种安装程序。如果你是在 2007\
  \ 年或之后购买的电脑，那么它很可能是 64 位系统。否则，你使用的是 32 位版本，但可以通过以下方法确切确认：\n\n*   在 Windows 上，选择`开始`▸`控制面板`▸`系统`，并检查“系统类型”显示的是\
  \ 64 位还是 32 位。\n*   在 OS X 上，进入苹果菜单，选择`关于关于本机`▸`更多信息` ▸ `系统报告`▸`硬件`，然后查看“处理器名称”字段。如果显示\
  \ Intel Core Solo 或 Intel Core Duo，则你有一台 32 位机器。如果显示其他内容（包括 Intel Core 2 Duo），则你有一台\
  \ 64 位机器。\n*   在 Ubuntu Linux 上，打开终端并运行命令 `uname -m`。响应 `i686` 表示 32 位，`x86_64`\
  \ 表示 64 位。\n\n在 Windows 上，下载 Python 安装程序（文件名以 `*.msi` 结尾）并双击它。按照安装程序在屏幕上显示的指令安装\
  \ Python，如下所示：\n\n1.  选择`为所有用户安装`，然后点击`下一步`。\n2.  点击`下一步`将其安装到 `C:\\Python34` 文件夹。\n\
  3.  再次点击`下一步`以跳过自定义 Python 部分。\n\n在 Mac OS X 上，下载适用于你 OS X 版本的 `.dmg` 文件并双击它。按照安装程序在屏幕上显示的指令安装\
  \ Python，如下所示：\n\n1.  当 DMG 包在新建窗口中打开时，双击 `Python.mpkg` 文件。你可能需要输入管理员密码。\n2.  点击`继续`通过欢迎界面，并点击`同意`接受许可协议。\n\
  3.  选择`HD Macintosh`（或你硬盘的任何名称）并点击`安装`。\n\n如果你正在运行 Ubuntu，可以按照以下步骤从终端安装 Python：\n\
  \n1.  打开终端窗口。\n2.  输入 `sudo apt-get install python3`。\n3.  输入 `sudo apt-get install\
  \ idle3`。\n4.  输入 `sudo apt-get install python3-pip`。\n\n# 开始 IDLE\n\n虽然 Python\
  \ 解释器是运行你 Python 程序的软件，但交互式开发环境（IDLE）软件是你输入程序的地方，就像文字处理器一样。让我们现在开始运行 IDLE。\n\n*\
  \   在 Windows 7 或更高版本上，点击屏幕左下角的开始图标，在搜索框中输入 `IDLE`，并选择 `IDLE (Python GUI)`。\n* \
  \  在 Windows XP 上，点击`开始`按钮，然后选择`程序`▸`Python 3.4`▸`IDLE (Python GUI)`。\n*   在 Mac\
  \ OS X 上，打开 Finder 窗口，点击`应用程序`，点击 `Python 3.4`，然后点击 IDLE 图标。\n*   在 Ubuntu 上，选择`应用程序`▸`附件`▸`终端`，然后输入\
  \ `idle3`。（你也可以点击屏幕顶部的`应用程序`，选择`编程`，然后点击 `IDLE 3`。）\n\n## 交互式 Shell\n\n无论你运行的是什么操作系统，首次出现的\
  \ IDLE 窗口大部分应该是空白的，除了类似下面的文本外：\n\n```\nPython 3.4.0 (v3.4.0:04f714765c13, Mar 16\
  \ 2014, 19:25:23) [MSC v.1600 64\nbit (AMD64)] on win32Type \"copyright\", \"credits\"\
  \ 或 \"license()\" 获取更多\n信息。\n>>>\n```\n\n这个窗口被称为交互式 Shell。Shell 是一个允许你向计算机输入指令的程序，类似于\
  \ OS X 和 Windows 上的终端或命令提示符。Python 的交互式 Shell 允许你为 Python 解释器软件输入运行指令。计算机读取你输入的指令并立即运行它们。\n\
  \n例如，在交互式 Shell 的 `>>>` 提示符后输入以下内容：\n\n```\n>>> print('Hello world!')\n```\n\n在你输入该行并按下回车键后，交互式\
  \ Shell 应该显示以下响应：\n\n```\n>>> print('Hello world!')\nHello world!\n```\n\n# 如何查找帮助\n\
  \n自己解决编程问题比你想象的要容易。如果你不信服，那么让我们故意制造一个错误：在交互式 Shell 中输入 `'42' + 3`。你现在不需要知道这条指令意味着什么，但结果应该像这样：\n\
  \n```\n >>> '42' + 3\n➊ Traceback (最近的回溯信息):\n    File \"<pyshell#0>\", line 1,\
  \ in <module>\n      '42' + 3\n➋ TypeError: Can't convert 'int' object to str implicitly\n\
  \  >>>\n```\n\n错误信息 ➋ 出现在这里是因为 Python 无法理解你的指令。错误信息中的 traceback 部分 ➊ 显示了 Python\
  \ 遇到困难的特定指令和行号。如果你不知道如何处理某个特定的错误信息，可以在网上搜索完全的错误信息。\n\n\n\n\n对于大多数人来说，电脑只是一件电器而不是一个工具。但通过学习编程，你将获得现代世界最强大的工具之一，并在这个过程中获得乐趣。编程并不是脑部手术——业余爱好者进行实验和犯错完全没问题的。\n\
  \n我喜欢帮助人们发现 `Python`。我在我的博客 *[`inventwithpython.com/blog/`](http://inventwithpython.com/blog/)*\
  \ 上编写编程教程，你可以通过 *al@inventwithpython.com* 与我联系提问。\n\n这本书将带你从零基础开始，但你可能会遇到一些超出其涵盖范围的问题。请记住，提出有效的问题并知道如何寻找答案，是你在编程之旅程中无价的工具。\n\
  \n让我们开始吧！\n\n# 第一部分 Python 编程基础\n\n# 第 1 章 Python 基础\n\n`Python` 编程语言具有广泛的语法结构、标准库函数和交互式开发环境功能。坦率地说，你可以忽略其中大部分内容；你只需要学习编写一些实用小程序的知识即可。\n\
  \n然而，在做任何事情之前，你必须学习一些基础编程概念。就像一个训练中的巫师，你可能认为这些概念看起来深奥而枯燥，但通过一些知识和实践，你就能像使用魔棒一样指挥你的电脑来完成不可思议的成就。\n\
  \n本章有几个示例鼓励你在交互式 shell 中输入，这让你一次一次执行 `Python` 指令并立即向你显示结果。使用交互式 shell 对于学习基础 `Python`\
  \ 指令的作用非常有帮助，因此在跟随学习时尝试一下。你对自己做过的事情会比只看记得得多。\n\n## 在交互式 shell 中输入表达式\n\n你通过启动 `IDLE`\
  \ 来运行交互式 shell，你在介绍中已随 `Python` 安装了它。在 Windows 上，打开开始菜单，选择`所有程序` ▸ `Python 3.3`，然后选择\
  \ `IDLE (Python GUI)`。在 OS X 上，选择`应用程序` ▸ `MacPython 3.3` ▸ `IDLE`。在 Ubuntu 上，打开一个新的终端窗口并输入\
  \ `idle3`。\n\n会出现一个带有 `>>>` 提示符的窗口；那就是交互式 shell。在提示符处输入 `2 + 2` 让 `Python` 执行一些简单的数学计算。\n\
  \n```\n>>> 2 + 2\n4\n```\n\n`IDLE` 窗口现在应该显示如下文本：\n\n```\nPython 3.3.2 (v3.3.2:d047928ae3f6,\
  \ May 16 2013, 00:06:53) [MSC v.1600 64 bit\n(AMD64)] on win32\n输入 \"copyright\"\
  , \"credits\" 或 \"license()\" 获取更多信息。\n>>> 2 + 2\n4\n>>>\n```\n\n在 `Python` 中，`2\
  \ + 2` 被称为*表达式*，它是该语言中最基本的编程指令。表达式由*值*（如 `2`）和*运算符*（如 `+`）组成，它们始终可以*求值*（即简化）为单个值。这意味着在\
  \ `Python` 代码中任何可以使用值的地方都可以使用表达式。\n\n在上一个示例中，`2 + 2` 被求值为单个值 `4`。一个没有运算符的单一值也被认为一个表达式，尽管它只求值为其本身，如下所示：\n\
  \n```\n>>> 2\n2\n```\n\n## 错误没关系！\n\n如果程序包含计算机无法理解的代码，程序将会崩溃，这会导致 `Python` 显示错误消息。不过，错误消息不会损坏你的电脑，所以不要害怕犯错。*崩溃*只是意味着程序意外停止运行。\n\
  \n如果你想了解更多关于错误消息的信息，可以在网上搜索精确的消息文本以查找更多关于该特定错误的信息。你也可以查看 *[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)*\
  \ 上的资源，查看常见 `Python` 错误消息列表及其含义。\n\n`Python` 表达式中还有许多其他可以使用的运算符。例如，表 1-1` 列出了 `Python`\
  \ 中所有的数学运算符。\n\n表 1-1. 优先级从高到低的数学运算符\n\n| 运算符 | 操作 | 示例 | 求值为... |\n| --- | ---\
  \ | --- | --- |\n| `**` | 幂 | `2 ** 3` | `8` |\n| `%` | 取模/余数 | `22 % 8` | `6` |\n\
  | `//` | 整除/地板除 | `22 // 8` | `2` |\n| `/` | 除法 | `22 / 8` | `2.75` |\n| `*` | 乘法\
  \ | `3 * 5` | `15` |\n| `-` | 减法 | `5 - 2` | `3` |\n| `+` | 加法 | `2 + 2` | `4` |\n\
  \n`Python` 数学运算符的操作顺序（也称为*优先级*）与数学类似。`**` 运算符首先求值；`*`、`/`、`//` 和 `%` 运算符从左到右求值；`+`\
  \ 和 `-` 运算符最后求值。你可以使用括号覆盖这一顺序：\n\n```\n>>> (2 + 3) * 4\n20\n```\n\n## 整数、浮点和字符串类型\n\
  \n记住表达式只是结合运算符的值，它们总是求值为单个值。*数据类型*是值的分类，每个值恰恰属于一个数据类型。`Python` 中常见的数据类型列在 表 1-2\
  \ 中。例如，值 `-2` 和 `30` 是*整数值*。整数（或 `int`）数据类型表示整数。带有小数点的数字（如 `3.14`）被称为*浮点数*（或 *floats*）。注意，尽管值\
  \ `42` 是整数，但值 `42.0` 将会是一个浮点数。\n\n表 1-2. 常见数据类型\n\n| 数据类型 | 示例 |\n| --- | --- |\n\
  | 整数 | `-2`, `-1`, `0`, `1`, `2`, `3`, `4`, `5` |\n| 浮点数 | `-1.25`, `-1.0`, `-0.5`,\
  \ `0.0`, `0.5`, `1.0`, `1.25` |\n| 字符串 | `'a'`, `'aa'`, `'aaa'`, `'Hello!'`, `'11\
  \ cats'` |\n\n\n\n\nPython 程序也可以包含名为 `strings`（字符串）或 `strs`（读音为“stirs”）的文本值。始终用单引号（`'\
  \ `）将你的字符串括起来（例如 `'Hello'` 或 `'Goodbye cruel world!'`），这样 Python 才能知道字符串从哪里到结束。你甚至可以拥有一个不包含任何字符的字符串\
  \ `''`，这被称为 `blank string`（空字符串）。在第 4 章中将对字符串进行更详细的解释。\n\n如果你看到错误信息 `SyntaxError:\
  \ EOL while scanning string literal`，你可能忘记在字符串末尾加上最后的单引号了，如下例所示：\n\n```\n>>> 'Hello\
  \ world!\nSyntaxError: EOL while scanning string literal\n```\n\n## 字符串拼接与复制\n\n\
  运算符的含义可能会根据其相邻数值的数据类型而改变。例如，当 `+` 作用于两个整数或浮点数值时，它是加法运算符。然而，当 `+` 用于两个字符串值时，它就作为\
  \ `string concatenation`（字符串拼接）运算符将字符串连接在一起。在交互式外中输入以下内容：\n\n```\n>>> 'Alice' +\
  \ 'Bob'\n'AliceBob'\n```\n\n该表达式求出一个单一的新字符串值，它结合了两个字符串的文本。然而，如果你尝试在字符串和一个整数值之间使用\
  \ `+` 运算符，Python 将不知道如何处理，并会显示一条错误信息。\n\n```\n>>> 'Alice' + 42\nTraceback (most\
  \ recent call last):\n  File \"<pyshell#26>\", line 1, in <module>\n    'Alice'\
  \ + 42\nTypeError: Can't convert 'int' object to str implicitly\n```\n\n错误信息 `Can't\
  \ convert 'int' object to str implicitly` 意味着 Python 认为你正试图将一个整数连接到字符串 `'Alice'`\
  \ 上。你必须显式将整数转换为字符串，因为 Python 无法自动这样做。类型转换在字符串转换方法中有更详细的解释。\n\n`*` 运算符作用于两个整数或浮点数时，是乘法运算符。但当\
  \ `*` 作用于一个字符串和一个整数时，它会按照指定的次数重复字符串，这就是 `string replication`（字符串复制）。在交互式外中输入以下内容：\n\
  \n```\n>>> 'Alice' * 3\n'AliceAliceAlice'\n```\n\n该表达式求出一个单一的字符串值，它将字符串重复了指定的次数。然而，如果你尝试在两个字符串之间使用\
  \ `*` 运算符，Python 将不知道如何处理，并会显示一条错误信息。\n\n```\n>>> 'Alice' * 'Bob'\nTraceback (most\
  \ recent call last):\n  File \"<pyshell#26>\", line 1, in <module>\n    'Alice'\
  \ * 'Bob'\nTypeError: can't multiply sequence by non-int of type 'str'\n```\n\n\n\
  \n虽然交互式 shell 适合一次运行一条 Python 指令，但要编写整个 Python 程序，你需要将指令输入到文件编辑器中。`file editor`\
  \ 类似于记事本或 TextMate 等文本编辑器，但它具有一些输入源码的特定功能。在 IDLE 中打开文件编辑器，选择 `File`▸`New Window`。\n\
  \n出现的窗口应该包含一个等待你输入的光标，但它与交互式 shell 不同，后者会在你按下 ENTER 键后立即运行 Python 指令。文件编辑器允许你输入许多指令、保存文件并运行程序。以下是区分两者的方法：\n\
  \n*   交互式 shell 窗口始终带有 `>>>` 提示符的那一个。\n*   文件编辑器窗口将没有 `>>>` 提示符。\n\n现在是时候创建你的第一个程序了！当文件编辑器窗口打开时，在输入以下内容：\n\
  \n```\n➊ # 这个程序向我问好并询问我的名字。\n\n➋ print('Hello world!')\n   print('What is your name?')\
  \    # 询问他们的名字\n➌ myName = input()\n➍ print('It is good to meet you, ' + myName)\n\
  ➎ print('The length of your name is:')\n   print(len(myName))\n➏ print('What is\
  \ your age?')    # 询问他们的年龄\n   myAge = input()\n   print('You will be ' + str(int(myAge)\
  \ + 1) + ' in a year.')\n```\n\n一旦输入了源码，请保存它，这样你就就不需要在每次启动 IDLE 时重新输入。从文件编辑器窗口顶部菜单中，选择\
  \ `File`▸`Save As`。在 Save As 窗口中，在 File Name 字段输入 `hello.py`，然后点击 `Save`。\n\n在输入程序时，你应该经常保存。这样，即使计算机崩溃或你不小心退出了\
  \ IDLE，也不会丢失代码。作为快捷键，你可以在 Windows 和 Linux 上按 `CTRL-S`，在 OS X 上按 `⌘-S` 来保存文件。\n\n\
  保存后，让我们运行程序。选择 `Run`▸`Run Module` 或直接按 `F5` 键。你的程序应该运行在你首次启动 IDLE 时出现的交互式 shell\
  \ 窗口中。记住，你必须在文件编辑器窗口中按 `F5`，而不是交互式 shell 窗口。当程序询问名字时，输入你的名字。交互式 shell 中的程序输出看起来应该是这样的：\n\
  \n```\nPython 3.3.2 (v3.3.2:d047928ae3f6, May 16 2013, 00:06:53) [MSC v.1600 64\
  \ bit\n(AMD64)] on win32\nType \"copyright\", \"credits\" or \"license()\" for more\
  \ information.\n>>> ================================ RESTART ================================\n\
  >>>\nHello world!\nWhat is your name?\nAl\nIt is good to meet you, Al\nThe length\
  \ of your name is:\n2\nWhat is your age?\n4\nYou will be 5 in a year.\n>>>\n```\n\
  \n当没有更多可执行的代码行时，Python 程序就会 `terminates`（终止）；即停止运行。（你也可以说 Python 程序 `exits` 出。）\n\
  \n你可以通过点击窗口顶部的 X 关闭文件编辑器。要重新加载已保存的程序，从菜单中选择 `File`▸`Open`。现在执行操作，在出现的窗口中选择 `hello.py`，并点击\
  \ `Open` 按钮。你之前保存的 `hello.py` 程序应该会在文件编辑器窗口中打开。\n\n## 解析你的程序\n\n在文件编辑器中打开你的新程序后，让我们通过观察每行代码的作用，快速浏览一下它使用的\
  \ Python 指令。\n\n### 注释\n\n下面这一行被称为 `comment`（注释）。\n\n```\n➊ # 这个程序向我问好并询问我的名字。\n\
  ```\n\nPython 会忽略注释，你可以用它们来写笔记或提醒自己代码试图做什么。哈号（`#`）之后该行的任何文本都是注释的一部分。\n\n有时，程序员会在某行代码前面加一个\
  \ `#`，以便在测试程序时临时移除它。这被称为 `commenting out`（注释掉）代码，当你试图弄清楚程序无法工作的原因时，它非常有用。当你准备好重新放回该行时，可以移除\
  \ `#`。\n\nPython 还会忽略注释后的空行。你可以根据需要向程序添加任意数量的空行。这可以让你的代码更易读，就像书中的段落一样。\n\n## print()\
  \ 函数\n\n`print()` 函数将括号内的字符串值显示在屏幕上。\n\n```\n➋ print('Hello world!')\n   print('What\
  \ is your name?') # 询问他们的名字\n```\n\n`print('Hello world!')` 这一行的意思是“打印字符串 `'Hello\
  \ world!'` 中的文本。”当 Python 执行这一行时，我们说 Python 正在 `calling`（调用） `print()` 函数，字符串值正被\
  \ `passed`（传递）给函数。传递给函数调的值是 `argument`（参数）。注意引号不会打印到屏幕上。它们只是标记字符串的开始和结束；它们不是字符串值的一部分。\n\
  \n### 注意\n\n*你也可以使用此函数在屏幕上留一个空行；只需在括号内不留任何内容并调用 `print()` 即可。*\n\n在编写代码时，你也可以使用此函数在屏幕上留一个空行；只需在括号内不留任何内容并调用\
  \ `print()` 即可。\n\n## input() 函数\n\n`input()` 函数等待用户输入文本并按下 ENTER。\n\n```\n➌ myName\
  \ = input()\n```\n\n该函数调用会将用户输入的字符串赋值给 `myName` 变量。\n\n## 打印用户的名字\n\n以下 `print()`\
  \ 调用实际上包含了该表达式。\n\n```python\n➍ print('It is good to meet you, ' + myName)\n```\n\
  \n记住，表达式总是可以评估为一个值。如果 `'Al'` 是上一行存储在 `myName` 中的值，那么这个表达式评估为 `'It is good to meet\
  \ you, Al'`。这个单一字符串值随后被传递给 `print()` 打印。\n\n## len() 函数\n\n你可以向 `len()` 函数传递一个字符串值（或包含字符串的变量），该函数评估为字符串字符数量的整数值。\n\
  \n```python\n➎ print('The length of your name is:')\n   print(len(myName))\n```\n\
  \n在交互式 shell 中输入以下内容进行尝试：\n\n```python\n>>> len('hello')\n5\n>>> len('My energetic\
  \ monster just scarfed nachos.')\n```\n\n就像这些示例一样，`len(myName)` 评估为一个整数。它随后被传递给\
  \ `print()`。注意 `print()` 允许你传递整数值或字符串值。但请注意当你在交互式 shell 中输入以下内容时显示的错误：\n\n```python\n\
  >>> print('I am ' + 29 + ' years old.')\nTraceback (most recent call last):\n  File\
  \ \"<pyshell#6>\", line 1, in <module>\n    print('I am ' + 29 + ' years old.')\n\
  TypeError: Can't convert 'int' object to str implicitly\n```\n\n`print()` 函数并没有引起该错误，而是你尝试传递给\
  \ `print()` 的表达式。如果你在交互式 shell 中单独输入该表达式，也会得到相同的错误消息。\n\n```python\n>>> 'I am '\
  \ + 29 + ' years old.'\nTraceback (most recent call last):\n  File \"<pyshell#7>\"\
  , line 1, in <module>\n    'I am ' + 29 + ' years old.'\nTypeError: Can't convert\
  \ 'int' object to str implicitly\n```\n\n\n\n\n如果你想将整数（如 `29`）与字符串拼接并传递给 `print()`，你需要获取值\
  \ `'29'`，即 `29` 的字符串形式。`str()` 函数可以接受一个整数值，并将其求值为该值的字符串形式版本，如下所示：\n\n```python\n\
  >>> str(29)\n'29'\n>>> print('I am ' + str(29) + ' years old.')\nI am 29 years old.\n\
  ```\n\n因为 `str(29)` 的求值为 `'29'`，表达式 `'I am ' + str(29) + ' years old.'` 的求值为 `'I\
  \ am ' + '29' + ' years old.'`，进而求值为 `'I am 29 years old.'`。这就是传递给 `print()` 函数的值。\n\
  \n`str()`、`int()` 和 `float()` 函数将分别将你传递的值求值为字符串、整数型和浮点数形式。尝试在交互式外壳中使用这些函数转换一些值，并观察发生了什么。\n\
  \n```python\n>>> str(0)\n'0'\n>>> str(-3.14)\n'-3.14'\n>>> int('42')\n42\n>>> int('-99')\n\
  -99\n>>> int(1.25)\n1\n>>> int(1.99)\n1\n>>> float('3.14')\n3.14\n>>> float(10)\n\
  10.0\n```\n\n之前的示例调用了 `str()`、`int()` 和 `float()` 函数，并向它们传递其他数据类型的值，以获取这些值的字符串、整数或浮点数形式。\n\
  \n当你有一个整数或浮点数并想将其拼接到字符串时，`str()` 函数非常有用。如果你有一个字符串形式的数字并想在某些数学运算中使用它，`int()` 函数也有帮助。例如，`input()`\
  \ 函数始终返回字符串，即使用户输入的是数字。在交互式外壳中输入 `spam = input()`，并在等待输入时输入 `101`。\n\n```python\n\
  >>> spam = input()\n101\n>>> spam\n'101'\n```\n\n存储在 `spam` 内部的值不是整数 `101`，而是字符串\
  \ `'101'`。如果你想使用 `spam` 中的值进行数学计算，使用 `int()` 函数获取 `spam` 的整数形式，然后将其作为新值存储在 `spam`\
  \ 中。\n\n```python\n>>> spam = int(spam)\n>>> spam\n101\n```\n\n现在你应该能够将 `spam` 变量视为整数而不是字符串了。\n\
  \n```python\n>>> spam * 10 / 5\n202.0\n```\n\n请注意，如果你传递给 `int()` 的值无法无法求值为整数，Python\
  \ 将显示错误消息。\n\n```python\n>>> int('99.99')\nTraceback (most recent call last):\n\
  \  File \"<pyshell#18>\", line 1, in <module>\n    int('99.99')\nValueError: invalid\
  \ literal for int() with base 10: '99.99'\n>>> int('twelve')\nTraceback (most recent\
  \ call last):\n  File \"<pyshell#19>\", line 1, in <module>\n    int('twelve')\n\
  ValueError: invalid literal for int() with base 10: 'twelve'\n```\n\n如果你需要向下取整浮点数，`int()`\
  \ 函数也很有用。如果你想向上取整浮点数，只需在之后对其加 `1` 即可。\n\n```python\n>>> int(7.7)\n7\n>>> int(7.7)\
  \ + 1\n8\n```\n\n在你的程序中，你在最后三行使用了 `int()` 和 `str()` 函数来获取对应数据类型的值。\n\n```python\n\
  print('What is your age?') # 询问年龄\nmyAge = input()\nprint('You will be ' + str(int(myAge)\
  \ + 1) + ' in a year.')\n```\n\n`myAge` 变量包含了从 `input()` 返回的值。因为 `input()` 函数始终返回字符串（即使用户输入的是数字），你可以使用\
  \ `int(myAge)` 代码来返回 `myAge` 中字符串的整数值。这个整数值在表达式 `int(myAge) + 1` 中被加了 `1`。\n\n此相加的结果被传递给\
  \ `str()` 函数：`str(int(myAge) + 1)`。返回的字符串值随后与字符串 `'You will be '` 和 `' in a year.'`\
  \ 拼接，求值为一个大的字符串值。这个大字符串最终传递给 `print()` 显示在屏幕上。\n\n假设用户为 `myAge` 输入字符串 `'4'`。字符串\
  \ `'4'` 被转换为整数，所以你可以对它加 1。结果是 `5`。`str()` 函数将结果转换回字符串，因此你可以将其与第二个字符串 `'in a year.'`\
  \ 拼接，以创建最终的消息。这些求值步骤类似于图 1-4。\n\n## 文本与数字的等价\n\n尽管 `42` 和 `'42'` 相同的值，但 Python 认为它们是不同的类型。\n\
  \n```python\n>>> 42 == '42'\nFalse\n>>> 42 == 42.0\nTrue\n>>> '42' == '42'\nTrue\n\
  ```\n\n## 总结\n\n你可以使用运算符（`+``,```,`*`,`/`,`//`,`%``,`**`）和字符串拼接计算表达式。记住本章介绍的数据类型（整数、浮点数和字符串）。\n\
  \n还介绍了一些函数。`print()` 和 `input()` 处理简单的文本输出（到屏幕）和输入（来自键盘）。`len()` 函数接收一个字符串并求值为字符数。\n\
  \n## 练习题\n\n1. 下面哪些是运算符，哪些是值？\n```\n*\n'hello'\n-88.8\n-\n/\n+\n5\n```\n\n2. 哪个是变量，哪个是字符串？\n\
  ```\nspam\n'spam'\n```\n\n3. 举三种数据类型。\n\n4. 表达式由什么组成？所有表达式的作用是什么？\n\n5. 本章介绍了赋值语句，例如\
  \ `spam = 10`。表达式和语句的区别是什么？\n\n6. 运行以下代码后，变量 `bacon` 包含什么？\n```python\nbacon = 20\n\
  bacon + 1\n```\n\n7. 以下两个表达式的求值应该是？\n```python\n'spam' + 'spamspam'\n'spam' * 3\n\
  ```\n\n8. 为什么 `eggs` 是有效的变量名，而 `100` 是无效的？\n\n9. 可以使用哪三个函数获取值的整数、浮点数或字符串版本？\n\n\
  10. 为什么这个表达式会导致错误？如何修复它？\n```python\n'I have eaten ' + 99 + ' burritos.'\n```\n\n\
  **额外奖励：** 在网上搜索 Python 的 `len()` 函数文档。它位于标题为“Built-in Functions”（内置函数）的网页上。浏览 Python\
  \ 拥有的其他函数列表，查找 `round()` 函数的作用，并在交互式外壳中对其实验。\n\n\n\n\n现在你已经了解了单个指令的基础知识，并知道程序仅仅是指令的序列。但编程的真正力量不仅仅在于像周末待办清单一样一个一个运行（或执行）指令。根据表达式的求值结果，程序可以决定跳过指令、重复指令或在几条指令中选择一条运行。事实上，你几乎从未希望程序从代码的第一行开始简单地执行每一行直到结束。流程控制语句可以根据条件决定执行哪些\
  \ Python 指令。\n\n这些流程控制语句直接对应流程图中的符号，因此我将提供本章讨论代码的流程图版本。图 2-1 展示了下雨时该做的流程图。遵循箭头从“开始”（Start）到“结束”（End）的路径即可。\n\
  \n![一个下雨时该做什么的流程图](img/httpatomoreillycomsourcenostarchimages2189567.png.jpg)\n\n\
  图 2-1. 下雨时该做什么的流程图\n\n在流程图中，从开始到结束通常有多种方法。计算机程序中的代码行也是如此。流程图用菱形表示这些分支点，而其他步骤则用矩形表示。开始和结束步骤用圆矩形表示。\n\
  \n在你学习流程控制语句之前，你首先需要学习如何表示那些“是”和“否”的选项，并且你需要理解如何将这些分支点写成 Python 代码。为此，让我们探索一下布尔值、比较运算符和布尔运算符。\n\
  \n## 布尔值\n\n虽然整数、浮点数和字符串数据类型有无限个可能的值，但布尔数据类型只有两个值：`True` 和 `False`。（Boolean 首字母大写是因为该数据类型是以数学家乔治·布尔命名的。）当作为\
  \ Python 代码输入时，布尔值 `True` 和 `False` 缺少放在字符串周围的引号，而且它们总是以大写字母 T 或 F 开头，其余部分均为小写。在交互式\
  \ shell 程序中输入以下内容。（其中某些指令是故意错误的，它们会导致错误信息的出现。）\n\n```\n➊ >>> spam = True\n   >>>\
  \ spam\n   True\n➋ >>> true\n   Traceback (most recent call last):\n     File \"\
  <pyshell#2>\", line 1, in <module>\n       true\n   NameError: name 'true' is not\
  \ defined\n➌ >>> True = 2 + 2\n   SyntaxError: assignment to keyword\n```\n\n与其他任何值一样，布尔值被用于表达式并可以存储在变量中\
  \ ➊。如果你没有使用正确的大小写 ➋，或者尝试将 `True` 和 `False` 用于变量名 ➌，Python 将给你一条错误信息。\n\n## 比较运算符\n\
  \n比较运算符比较两个值并求值为单一的布尔值。表 2-1 列出了比较运算符。\n\n表 2-1. 比较运算符\n\n| 运算符 | 含义 |\n| --- |\
  \ --- |\n| `==` | 等于 |\n| `!=` | 不等于 |\n| `<` | 小于 |\n| `>` | 大于 |\n| `<=` | 小于等于\
  \ |\n| `>=` | 大于等于 |\n\n这些运算符根据你提供它们的值求值为 `True` 或 `False`。现在让我们尝试一些运算符，从 `==` 和\
  \ `!=` 开始。\n\n```\n>>> 42 == 42\nTrue\n>>> 42 == 99\nFalse\n>>> 2 != 3\nTrue\n>>>\
  \ 2 != 2\nFalse\n```\n\n正如你预期的那样，当两边的值相同时，`==`（等于）求值为 `True`；当两个值不同时，`!=`（不等于）求值为\
  \ `True`。`==` 和 `!=` 运算符实际上可以处理任何数据类型的值。\n\n```\n >>> 'hello' == 'hello'\n   True\n\
  \   >>> 'hello' == 'Hello'\n   False\n   >>> 'dog' != 'cat'\n   True\n   >>> True\
  \ == True\n   True\n   >>> True != False\n   True\n   >>> 42 == 42.0\n   True\n\
  ➊ >>> 42 == '42'\n   False\n```\n\n注意，整数或浮点数值永远不等于字符串值。表达式 `42 == '42'` ➊ 求值为 `False`，因为\
  \ Python 认为整数 `42` 与字符串 `'42'` 不同。\n\n另一方面，`<`、`>`、`<=` 和 `>=` 运算符仅适用于整数和浮点数。\n\n\
  ```\n >>> 42 < 100\n   True\n   >>> 42 > 100\n   False\n   >>> 42 < 42\n   False\n\
  \   >>> eggCount = 42\n➊ >>> eggCount <= 42\n   True\n   >>> myAge = 29\n➋ >>> myAge\
  \ >= 10\n   True\n```\n\n## == 和 = 运算符之间的区别\n\n你可能注意到，当两边的值相同时，`==`（等于）求值为 `True`；当两个值不同时，`!=`（不等于）求值为\
  \ `True`。`==` 和 `!=` 运算符实际上可以处理任何数据类型的值。\n\n（注：此处原文中存在逻辑重复和混乱，译文已根据上下文逻辑进行了理顺，修正了原文中关于\
  \ `==` 和 `` 描述的误区。）\n\n## 布尔运算符\n\n布尔运算符（`and`、`or`、`not`）用于比较值。和比较运算符一样，它们求值为单一的布尔值。\n\
  \n## 二元运算符\n\n`and` 和 `or` 运算符总是接收两个值，因此它们是二元运算符。`and` 运算符在两个布尔值均为 `True` 时求值为 `True`；否则求值为\
  \ `False`。在交互式 shell 中输入一些 `and` 表达式。\n\n```\n>>> True and True\nTrue\n>>> True\
  \ and False\nFalse\n```\n\n`and` 运算符的所有可能结果在表 2-2 所示的真值表中。\n\n表 2-2. and 运算符真值表\n\
  \n| 表达式 | 求值 |\n| --- | --- |\n| True and True | True |\n| True and False | False\
  \ |\n| False and True | False |\n| False and False | False |\n\n另一方面，`or` 运算符在其中任意一个布尔值为\
  \ `True` 时求值为 `True`；如果两个均为 `False`，则求值为 `False`。在 shell 中输入一些 `or` 表达式。\n\n```\n\
  >>> False or True\nTrue\n>>> False or False\nFalse\n```\n\n你可以在 `or` 运算符的真值表中看到所有可能的结果，见表\
  \ 2-3。\n\n表 2-3. or 运算符真值表\n\n| 表达式 | 求值 |\n| --- | --- |\n| True or True | True\
  \ |\n| True or False | True |\n| False or True | True |\n| False or False | False\
  \ |\n\n与 `and` 和 `or` 不同，`not` 运算符作用于单个布尔值（或表达式）。`not` 运算符简单地求值为相反的布尔值。\n\n```\n\
  \ >>> not True\n   False\n➊ >>> not not not True\n   True\n```\n\n就像在语言和写作中使用双重否定一样，你可以嵌套\
  \ `not` 运算符 ➊，尽管在实际程序中永远没有理由这样做。表 2-4 展示了 `not` 的真值表。\n\n表 2-4. not 运算符真值表\n\n|\
  \ 表达式 | 求值 |\n| --- | --- |\n| not True | False |\n| not False | True |\n\n\n\n\n\
  ## 混合布尔运算符与比较运算符\n\n由于比较运算符的结果为布尔值，因此你可以在包含布尔运算符的表达式中使用它们。\n\n请记住 `and`、`or` 和 `not`\
  \ 运算符被称为布尔运算符，因为它们始终对布尔值 `True` 和 `False` 进行操作。虽然像像 `4 < 5` 这样的表达式不是布尔值，但它们是求值后布尔值的表达式。尝试在交互式外壳中输入一些使用比较运算符的布尔表达式。\n\
  \n```\n>>> (4 < 5) and (5 < 6)\nTrue\n>>> (4 < 5) and (9 < 6)\nFalse\n>>> (1 ==\
  \ 2) or (2 == 2)\nTrue\n```\n\n计算机会先评估左侧表达式，然后评估右侧表达式。当它知道每个表达式的布尔值后，它将把整个表达式评估为一个布尔值。你可以将计算机对\
  \ `(4 < 5) and (5 < 6)` 的评估过程视为图 2-2 和 (5 < 6) 为 True 的过程。\")所示。\n\n你也可以在表达式中使用多个布尔运算符以及比较运算符。\n\
  \n```\n>>> 2 + 2 == 4 and not 2 + 2 == 5 and 2 * 2 == 2 + 2\nTrue\n```\n\n布尔运算符具有与数学运算符相同的运算顺序。在任何数学和比较运算符求值后，Python\
  \ 会先评估 `not` 运算符，然后是 `and` 运算符，最后是 `or` 运算符。\n\n![评估 (4 < 5) 和 (5 < 6) 为 True 的过程。](img/httpatomoreillycomsourcenostarchimages2189569.png.jpg)\n\
  \n图 2-2.评估 `(4 < 5)` `and` `(5 < 6)` 为 `True` 的过程。\n\n## Flow 控制元素\n\n流程控制语句通常以称为\
  \ `condition`（条件）的部分开始，后面都跟着一个称为 `clause`（子句）的代码块。在学习 Python 特有的流程控制语句之前，我会先介绍什么是条件和块。\n\
  \n### 条件\n\n你到为止看到的布尔表达式都可以被视为条件，它们与表达式是一样的；在流程控制语句的上下文中，`condition` 只是一个更具体的名称。条件始终评估为布尔值\
  \ `True` 或 `False`。流程控制语句根据条件是 `True` 还是 `False` 来决定做什么，几乎每个流程控制语句都会使用条件。\n\n##\
  \ 代码块\n\nPython 代码行可以组合在 `blocks`（块）中。你可以根据代码行的缩进判断块的开始和结束。关于块有三个规则：\n\n1. 当缩进增加时，块开始。\n\
  2. 块可以包含其他块。\n3. 当缩进减少到零或减少到包含块的缩进时，块结束。\n\n通过查看一些缩进的代码可以更容易理解块，让我们在下面的小型游戏程序的一部分中寻找块：\n\
  \n```\n if name == 'Mary':\n➊     print('Hello Mary')\n   if password == 'swordfish':\n\
  ➋     print('Access granted.')\n   else:\n➌     print('Wrong password.')\n```\n\n\
  第一个代码块 ➊ 从 `print('Hello Mary')` 这一行开始，包含其之后的所有行。此块内部是另一个块 ➋，它只有一行：`print('Access\
  \ Granted.')`。第三个块 ➌ 也是一行长：`print('Wrong password.')`。\n\n## 程序执行\n\n在上一章的 `hello.py`\
  \ 程序中，Python 从程序顶部开始向下一个接一个地执行指令。`program execution`（程序执行，或简单称为 `execution`）是正在执行的指令的术语。如果你将源代码打印在纸上，并在执行每行时将手指放在行上，你可以将你的手指视为程序执行。\n\
  \n然而，并不是所有程序都是简单的向下执行的。如果你用手指追踪一个带有流程控制语句的程序，你可能会发现自己根据条件在源代码中来回跳跃，并且可能会跳过整个子句。\n\
  \n## 流程控制语句\n\n现在，让我们探索流程控制最重要的部分：语句本身。语句代表了你在图 2-1 中流程图里看到的菱形，它们是你的程序将做出的实际决策。\n\
  \n### if 语句\n\n最常见的流程控制语句类型是 `if` 语句。如果 `if` 语句的子句（即 `if` 语句后的块）条件为 `True`，则执行该子句。如果条件为\
  \ `False`，则跳过该子句。\n\n用通俗的话说，`if` 语句可以读作：“如果此条件为真，执行子句中的代码。”在 Python 中，`if` 语句由以下部分组成：\n\
  \n* `if` 关键字\n* 一个条件（即评估为 `True` 或 `False` 的表达式）\n* 冒号\n* 从下一行开始，一个缩进的代码块（称为 `if`\
  \ 子句）\n\n例如，假设你有一些代码来检查某人的名字是否是 Alice。（假设 `name` 已赋值）\n\n```python\nif name == 'Alice':\n\
  \    print('Hello Alice.')\n```\n\n这个 `if` 语句以冒号结束，后面跟着一个新块（if 子句）。图 2-3 显示了该代码的流程图样式。\n\
  \n![if 流程图](img/httpatomoreillycomsourcenostarchimages2189571.png)\n\n图 2-3. if\n\
  \n## else 语句\n\n`if` 子句可以可选跟随一个 `else` 语句。只有当 `if` 语句的条件为 `False` 时，才会执行 `else`\
  \ 子句。用通俗的话说，`else` 语句可以读作：“如果此条件为真，执行此代码。否则，执行那些代码。”`else` 语句没有条件，在代码中，`else` 语句由以下部分组成：\n\
  \n* `else` 关键字\n* 冒号\n* 从下一行开始，一个缩进的代码块（称为 else 子句）\n\n回到 Alice 的示例，让我们看看使用 `else`\
  \ 语句在名字不是时提供不同问候的代码：\n\n```python\nif name == 'Alice':\n    print('Hi, Alice.')\n\
  else:\n    print('Hello, stranger.')\n```\n\n图 2-4 显示了该代码的流程图样式。\n\n![else 流程图](img/httpatomoreillycomsourcenostarchimages2189573.png)\n\
  \n图 2-4. else\n\n## elif 语句\n\n虽然 `if` 或 `else` 子句中只会执行一个，但你可能会遇到需要执行多个可能子句之一的情况。`elif`\
  \ 语句是“else if”语句，它总是跟在 `if` 或另一个 `elif` 语句之后。它提供了另一个条件，只有在之前的条件都为 `False` 时才会进行检查。在代码中，`elif`\
  \ 语句由以下部分组成：\n\n* `elif` 关键字\n* 一个条件（即评估为 `True` 或 `False` 的表达式）\n* 冒号\n* 从下一行开始，一个缩进的代码块（称为\
  \ `elif` 子句）\n\n让我们在名字检查中添加一个 `elif` 来观察这个语句的作用。\n\n```python\nif name == 'Alice':\n\
  \    print('Hi, Alice.')\nelif age < 12:\n    print('You are not Alice, kiddo.')\n\
  ```\n\n这次，你检查一个人的年龄，如果他们小于 12 岁，程序会告诉他们不同的内容。你可以在图 2-5 中看到该代码的流程图。\n\n![elif 流程图](img/httpatomoreillycomsourcenostarchimages2189575.png)\n\
  \n图 2-5. elif\n\n\n\n\n`elif` 子句在 `age < 12` 为 `True` 且 `name == 'Alice'` 为 `False`\
  \ 时执行。然而，如果两个条件都为 `False`，那么两个子句都会被跳过。**并不**保证至少有一个子句会被执行。当存在 `elif` 语句链时，只有一个子句或一个都没有子句会被执行。一旦发现某个语句的条件为\
  \ `True`，其余的 `elif` 子句将自动被跳过。例如，打开一个新的文件编辑器窗口，并输入以下代码，将其保存为 `vampire.py`：\n\n```python\n\
  if name == 'Alice':\n    print('Hi, Alice.')\nelif age < 12:\n    print('You are\
  \ not Alice, kiddo.')\nelif age > 2000:\n    print('Unlike you, Alice is not an\
  \ undead, immortal vampire.')\nelif age > 100:\n    print('You are not Alice, grannie.')\n\
  ```\n\n在这里，我添加了两个 `elif` 语句，使得名称检查器根据 `age` 对不同的人给出不同的问候回答。图 2-6 显示了该流程图。\n\n![vampire.py\
  \ 程序中多个 elif 语句的流程图](img/httpatomoreillycomsourcenostarchimages2189577.png)\n\n\
  图 2-6。`vampire.py` 程序中多个 `elif` 语句的流程图。\n\n然而，`elif` 语句的顺序确实。让我们重新排列它们以引入一个 bug。记住，一旦发现了\
  \ `True` 条件，其余的 `elif` 子句就会自动被跳过，因此如果你交换了 `vampire.py` 中的某些子句，就会遇到问题。将代码更改如下所示，并将其保存为\
  \ `vampire2.py`：\n\n```python\nif name == 'Alice':\n    print('Hi, Alice.')\nelif\
  \ age < 12:\n    print('You are not Alice, kiddo.')\nelif age > 100:\n    print('You\
  \ are not Alice, grannie.')\nelif age > 2000:\n    print('Unlike you, Alice is not\
  \ an undead, immortal vampire.')\n```\n\n假设在执行这段代码之前，`age` 变量包含值 `3000`。你可能期望代码打印字符串\
  \ `'Unlike you, Alice is not an undead, immortal vampire.'`。然而，由于 `age > 100` 条件为\
  \ `True`（毕竟 3000 *确实* 大 100），因此打印了字符串 `'You are not Alice, grannie.'`，其余的 `elif`\
  \ 语句自动被跳过。记住，最多只有一个子句会被执行，而且对于 `elif` 语句，顺序非常重要！\n\n图 2-7 显示了上一个代码的流程图。注意 `age >\
  \ 100` 和 `age > 2000` 的菱形是如何交换位置的。\n\n可选地，你可以在最后一个 `elif` 语句之后有一个 `else` 语句。在这种情况下，**保证**至少有一个（且仅有一个）子句会被执行。如果每个\
  \ `if` 和 `elif` 语句中的条件都为 `False`，则执行 `else` 子句。例如，让我们重新创建 Alice 程序以使用 `if`、`elif`\
  \ 和 `else` 子句。\n\n```python\nif name == 'Alice':\n    print('Hi, Alice.')\nelif\
  \ age < 12:\n    print('You are not Alice, kiddo.')\nelse:\n    print('You are neither\
  \ Alice nor a little kid.')\n```\n\n图 2-8 显示了这段新代码的流程图，我们将其保存为 `littleKid.py`。\n\
  \n用通俗来说，这种流程控制结构将是：“如果第一个条件为真，执行这个。否则，如果第二个条件为真，执行那个。否则，做别些事情。”当你将所有三个语句一起使用时，记住这些关于排序的规则，以避免出现像图\
  \ 2-7 那样的 bug。首先，始终有一个 `if` 语句。任何需要的 `elif` 语句都应该跟在 `if` 语句后面。其次，如果你想确保至少执行一个子句，用\
  \ `else` 语句结束该结构。\n\n## while 语句\n\n你可以使用 `while` 语句让一段代码反复执行。`while` 子句只要条件为 `True`\
  \ 就会一直执行。在代码中，一个 `while` 语句包含：\n\n*   `while` 关键字\n*   一个条件（即评估为 `True` 或 `False`\
  \ 的表达式）\n*   冒号\n*   从下一行开始的缩进代码块（称为*循环*）\n\n`while` 语句类似于 `if` 语句。区别在于它们的行为方式。在\
  \ `if` 语句结束后，程序继续执行 `if` 语句之后的内容。但在 `while` 子句结束后，程序返回 `while` 语句的开头。\n\n让我们观察具有相同条件和动作的\
  \ `if` 语句和 `while` 循环。这里是 `if` 语句的代码：\n\n```python\nspam = 0\nif spam < 5:\n   \
  \ print('Hello, world.')\n```\n\n这里是 `while` 语句的代码：\n\n```python\nspam = 0\nwhile\
  \ spam < 5:\n    print('Hello, world.')\n```\n\n这些语句是相似的——`if` 和 `while` 都会检查 `spam`\
  \ 的值，如果小于五，就会打印消息。但当你运行这两个代码段时，`if` 语句的输出只是 `\"Hello, world.\"`。对于 `while` 语句，它是重复五次的\
  \ `\"Hello, world.\"` 查看这两个代码的流程图,图 2-9 和 图 2-10，看看为什么会这样。\n\n`if` 语句的代码检查条件，如果条件为真，它只打印一次\
  \ `Hello, world.`。相比之下，`while` 循环的代码会打印五次。这是因为在每次循环结束后，`spam` 中的整数都会增加 1，这意味着在 `spam\
  \ < 5` 为 `False` 之前，循环会执行五次。\n\n在 `while` 循环中，条件在每次*迭代*（即每次执行循环时）开始时总是被检查。如果条件为\
  \ `True`，则执行子句，之后再次检查条件。当第一次发现条件为 `False` 时，`while` 子句就会被跳过。\n\n### 一个恼人的 while\
  \ 循环\n\n\n\n\n这是一个小型示例程序，它会不断要求你输入（字面上的）your name`。选择 `File`（文件）▸`New Window`（新建窗口）打开一个新的文件编辑器窗口，输入以下代码，并将文件保存为\
  \ `yourName.py`：\n\n```\n➊ name = ''\n➋ while name != 'your name':\n       print('Please\
  \ type your name.')\n➌     name = input()\n➍ print('Thank you!')\n```\n\n首先，程序将\
  \ `name` 变量 ➊ 设置为空字符串。这样 `name != 'your name'` 条件的评估结果为 `True`，程序执行将进入 `while` 循环语句块\
  \ ➋。\n\n该语句块内部的代码要求用户输入其姓名，并将其赋值给 `name` 变量 ➌。由于这是代码块的最后一行，执行将跳回 `while` 循环的开头并重新评估条件。如果\
  \ `name` 中的值*不等于*字符串 `'your name'`，则条件为 `True`，执行将再次进入 `while` 语句块。\n\n但一旦用户输入了\
  \ `your name`，`while` 循环的条件将变为 `'your name' != 'your name'`，评估结果为 `False`。现在条件为\
  \ `False`，程序执行不再重新进入 `while` 循环语句块，而是跳过它并继续运行程序的其余部分 ➍。图 2-11 显示了 `yourName.py`\
  \ 程序的流程图。\n\n![yourName.py 程序的流程图](img/httpatomoreillycomsourcenostarchimages2189587.png)\n\
  \n图 2-11. `yourName.py` 程序的流程图。\n\n现在，让我们看看 `yourName.py` 的运行。按下 `F5` 运行，并在给予程序想要的内容之前，多次输入\
  \ `your name` 以外的内容。\n\n```\nPlease type your name.\nAl\nPlease type your name.\n\
  Albert\nPlease type your name.\n%#@#%*(^&!!!\nPlease type your name.\nyour name\n\
  Thank you!\n```\n\n如果你从未输入过 `your name`，那么 `while` 循环的条件永远不会为 `False`，程序将一直问下去。在这里，`input()`\
  \ 调用允许用户输入正确的字符串以让程序继续。在其他程序中，条件可能永远不会改变，这可能会导致问题。让我们看看如何跳出 `while` 循环。\n\n## break\
  \ 语句\n\n有一种快捷方法可以使程序执行提前跳出 `while` 循环语句块。如果执行运行到 `break` 语句，它会立即退出 `while` 语句块。在代码中，`break`\
  \ 语句仅包含 `break` 关键字。\n\n非常简单，对吧？这里有一个程序与之前的程序相同，但它使用 `break` 语句来跳出循环。输入以下代码，并将文件保存为\
  \ `yourName2.py`：\n\n```\n➊ while True:\n       print('Please type your name.')\n\
  ➋     name = input()\n➌     if name == 'your name':\n➍         break\n➎ print('Thank\
  \ you!')\n```\n\n第一行 ➊ 创建了一个*无限循环*；它是一个条件始终为 `True` 的 `while` 循环。（毕竟，`True` 表达式始终评估为值\
  \ `True`。）程序执行将始终进入循环，只有在执行 `break` 语句时才会退出。（*从不*退出的无限循环是一个常见的编程错误。）\n\n和之前一样，这个程序要求用户输入\
  \ `your name` ➋。但现在，当执行仍在 `while` 循环内部时，会执行 `if` 语句 ➌ 来检查 `name` 是否等于 `your name`。如果此条件为\
  \ `True`，则运行 `break` 语句 ➍，执行将跳出循环执行 `print('Thank you!')` ➎。否则，带有 `break` 语句的 `if`\
  \ 语句块将被跳过，使执行到达 `while` 循环的末尾。此时，程序执行跳回 `while` 语句的开头以重新检查条件。由于该条件仅仅是 `True` 布尔值，执行将进入循环再次要求用户输入\
  \ `your name`。请查看图 2-12 获取此程序的流程图。\n\n运行 `yourName2.py`，并输入你在 `yourName.py` 中输入的相同文本。重写的程序响应与原始程序相同。\n\
  \n![带有无限循环的 yourName2.py 程序的流程图。注意 X 路径在逻辑上永远不会发生，因为循环条件始终为 True。](img/httpatomoreillycomsourcenostarchimages2189589.png.jpg)\n\
  \n图 2-12. 带有无限循环的 `yourName2.py` 程序的流程图。注意 X 路径在逻辑上永远不会发生，因为循环条件始终为 `True`。\n\n\
  ## continue 语句\n\n像 `break` 语句一样，`continue` 语句用于循环内部。当执行到达 `continue` 语句时，程序执行跳回\
  \ `while` 语句的开头并重新评估条件。（这也是到达循环末尾时发生。）\n\n### 陷入无限循环了？\n\n如果你运行了陷入无限循环的程序，请按下 `CTRL-C`。要尝试它，在\
  \ `infeloop.py` 中创建一个简单的无限循环：\n\n```\nwhile True:\n    print('Hello world!')\n```\n\
  \n当你运行此程序时，它将一直打印 `Hello world!`，因为 `while` 语句的条件始终为 `True`。在 IDLE 交互式 shell 中，停止此程序有两种：`CTRL-C`\
  \ 或从菜单选择 `Shell ▸ restart Shell`。如果你想立即终止程序，`CTRL-C` 非常方便。\n\n让我们使用 `continue` 编写一个请求姓名和密码的程序。将以下代码输入编辑器窗口并将程序保存为\
  \ `swordfish.py`：\n\n```\n while True:\n      print('Who are you?')\n      name\
  \ = input()\n➊    if name != 'Joe':\n➋        continue\n      print('Hello, Joe.\
  \ What is the password? (It is a fish.)')\n➌    password = input()\n      if password\
  \ == 'swordfish':\n➍        break\n➎ print('Access granted.')\n```\n\n如果用户输入了 `Joe`\
  \ 以外的任何姓名 ➊，`continue` 语句会导致执行跳回循环开头。重新评估条件时，执行将进入循环。一旦他们跳过了该 `if` 语句，就会要求输入密码 ➌。如果输入的密码是\
  \ `swordfish`，则运行 `break` 语句 ➍，执行将跳出 `while` 循环执行 `Access granted` ➎。否则，执行继续到 `while`\
  \ 循环的末尾，然后跳回循环开头。请查看图 2-13 获取此程序的流程图。\n\n\n\n\n\n```python\nname = ''\nwhile not\
  \ name:➊\n    print('Enter your name:')\n    name = input()\nprint('How many guests\
  \ will you have?')\nnumOfGuests = int(input())\nif numOfGuests:➋\n    print('Be\
  \ sure to have enough room for all your guests.')➌\nprint('Done')\n```\n\n如果用户为\
  \ `name` 输入空字符串，那么 `while` 语句的条件将为 `True` ➊，程序将继续询问名称。如果 `numOfGuests` 的值不是 `0`\
  \ ➋，则该条件被视为 `True`，程序将为用户打印一条提醒 ➌。\n\n你可以用 `not name != ''` 代替 `not name`，并用 `numOfGuests\
  \ != 0` 代替 `numOfGuests`，但使用真值（truthy）和假值（falsey）值可以让你的代码更易于读。\n\n运行这个程序并提供一些输入。在在你声称自己是\
  \ Joe 之前，它不应该询问密码，一旦你输入正确的密码，它就会退出。\n\n```\nWho are you?\nI'm fine, thanks. Who\
  \ are you?\nWho are you?\nJoe\nHello, Joe. What is the password? (It is a fish.)\n\
  Mary\nWho are you?\nJoe\nHello, Joe. What is the password? (It is a fish.)\nswordfish\n\
  Access granted.\n```\n\n## for 循环和 range() 函数\n\n`while` 循环在条件为 `True` 时会持续循环（这也是它名字的由来），但如果你只想执行特定次数的代码呢？你可以通过\
  \ `for` 循环语句和 `range()` 函数来实现。\n\n在代码中，`for` 语句看起来像 `for i in range(5):`，并且始终包含以下内容：\n\
  \n*   `for` 关键字\n*   一个变量名\n*   `in` 关键字\n*   对 `range()` 方法的调用，并传入最多三个整数\n*   一个冒号\n\
  *   从下一行开始，一个缩进的代码块（称为 `for` 子句）\n\n让我们创建一个名为 `fiveTimes.py` 的新程序，帮助你看到 `for` 循环的运行情况。\n\
  \n```python\nprint('My name is')\nfor i in range(5):\n    print('Jimmy Five Times\
  \ (' + str(i) + ')')\n```\n\n`for` 子句中的代码会被运行五次。在第一次运行时，变量 `i` 被设置为 `0`。子句中的 `print()`\
  \ 调用将打印 `Jimmy Five Times (0)`。当 Python 完成对 `for` 子句内部所有代码的迭代后，执行将回到循环顶部，`for` 语句将\
  \ `i` 增加 1。这就是为什么 `range(5)` 导致子句进行五次迭代，`i` 分别被设置为 `0`、然后是 `1`、`2`、`3`、最后是 `4`。变量\
  \ `i` 将增加到（但但不包含）传递给 `range()` 的整数。图 2-14 显示了 `fiveTimes.py` 程序的流程图。\n\n![The flowchart\
  \ for fiveTimes.py](img/httpatomoreillycomsourcenostarchimages2189593.png)\n\n图\
  \ 2-14. `fiveTimes.py` 的流程图\n\n当你运行这个程序时，它应该打印 `Jimmy Five Times` 然后是 `i` 的值五次，最后退出\
  \ `for` 循环。\n\n```\nMy name is\nJimmy Five Times (0)\nJimmy Five Times (1)\nJimmy\
  \ Five Times (2)\nJimmy Five Times (3)\nJimmy Five Times (4)\n```\n\n### Note\n\n\
  你也可以在 `for` 循环内部使用 `break` 和 `continue` 语句。`continue` 语句将继续 `for` 循环计数器的下一个值，仿佛程序执行已到达循环结束并返回开头。事实上，你只能在\
  \ `while` 和 `for` 循环内部使用 `continue` 和 `break` 语句。如果你在其他地方尝试这些语句，Python 将给你一个错误。\n\
  \n作为另一个 `for` 循环示例，考虑这个关于数学家卡尔·弗里德里希·高斯的故事。当高斯还是个孩子时，老师想给班级布置一些作业。老师告诉他们把从 0 到 100\
  \ 的所有数字相加。年轻的高斯想出了一个巧妙的技巧在几秒内算出答案，但你可以编写一个带有 `for` 循环的 Python 程序来为你完成这项计算。\n\n```python\n\
  ➊ total = 0\n➋ for num in range(101):\n➌     total = total + num\n➍ print(total)\n\
  ```\n\n结果应该是 5,050。当程序首次启动时，变量 `total` 被设置为 `0` ➊。随后 `for` 循环 ➋ 执行 `total = total\
  \ + num` ➌ 100 次。当循环完成所有 100 次迭代时，从 `0` 到 `100` 的每一个整数都已加到 `total` 中。此时，`total`\
  \ 被打印到屏幕上 ➍。在最慢的电脑上，这个程序的运行时间不到一秒。\n\n（年轻的高斯发现有 50 对 100，所以 50 * 100 = 5,000，外加\
  \ 1 到 100 的和，即 (100 * 101) / 2 = 5050。等等，1 到 100 的和是 5050。让我们重新计算：1+100=101，2+99=101...\
  \ 有 50 对 101，结果是 5050。）\n\n### range() 和 for 循环\n\n`while` 循环在条件为 `True` 时会持续循环（这也是它名字的由来），但如果你只想执行特定次数的代码呢？你可以通过\
  \ `for` 循环语句和 `range()` 函数来实现。\n\n在代码中，`for` 语句看起来像 `for i in range(5):`，并且始终包含以下内容：\n\
  \n*   `for` 关键字\n*   一个变量名\n*   `in` 关键字\n*   对 `range()` 方法的调用，并传入最多三个整数\n*   一个冒号\n\
  *   从下一行开始，一个缩进的代码块（称为 `for` 子句）\n\n让我们创建一个名为 `fiveTimes.py` 的新程序，帮助你看到 `for` 循环的运行情况。\n\
  \n```python\nprint('My name is')\nfor i in range(5):\n    print('Jimmy Five Times\
  \ (' + str(i) + ')')\n```\n\n`for` 子句中的代码会被运行五次。第一次运行时，变量 `i` 被设置为 `0`。子句中的 `print()`\
  \ 调用将打印 `Jimmy Five Times (0)`。当 Python 完成对 `for` 子句内部所有代码的迭代后，执行将回到循环顶部，`for` 语句将\
  \ `i` 增加 1。这就是为什么 `range(5)` 导致子句进行五次迭代，`i` 分别被设置为 `0`、然后是 `1`、`2`、`3`、最后是 `4`。变量\
  \ `i` 将增加到（但不包含）传递给 `range()` 的整数。图 2-14 显示了 `fiveTimes.py` 程序的流程图。\n\n![The flowchart\
  \ for fiveTimes.py](img/httpatomoreillycomsourcenostarchimages2189593.png)\n\n图\
  \ 2-14. `fiveTimes.py` 的流程图\n\n当你运行这个程序时，它应该打印 `Jimmy Five Times` 然后是 `i` 的值五次，最后退出\
  \ `for` 循环。\n\n```\nMy name is\nJimmy Five Times (0)\nJimmy Five Times (1)\nJimmy\
  \ Five Times (2)\nJimmy Five Times (3)\nJimmy Five Times (4)\n```\n\n### Note\n\n\
  你也可以在 `for` 循环内部使用 `break` 和 `continue` 语句。`continue` 语句将继续 `for` 循环计数器的下一个值，仿佛程序执行已到达循环结束并返回开头。事实上，你只能在\
  \ `while` 和 `for` 循环内部使用 `continue` 和 `break` 语句。如果你在其他地方尝试这些语句，Python 将给你一个错误。\n\
  \n作为另一个 `for` 循环示例，考虑这个关于数学家卡尔·弗里德里希·高斯的故事。当高斯还是个孩子时，老师想给班级布置一些作业。老师告诉他们把从 0 到 100\
  \ 的所有数字相加。年轻的高斯想出了一个巧妙的技巧在几秒内算出答案，但你可以编写一个带有 `for` 循环的 Python 程序来为你完成这项计算。\n\n```python\n\
  ➊ total = 0\n➋ for num in range(101):\n➌     total = total + num\n➍ print(total)\n\
  ```\n\n结果应该是 5,050。当程序首次启动时，变量 `total` 被设置为 `0` ➊。随后 `for` 循环 ➋ 执行 `total = total\
  \ + num` ➌ 100 次。当循环完成所有 100 次迭代时，从 `0` 到 `100` 的每一个整数都已加到 `total` 中。此时，`total`\
  \ 被打印到屏幕上 ➍。在最慢的电脑上，这个程序的运行时间不到一秒。\n\n（年轻的高斯发现有 50 对 100，所以 50 * 100 = 5,000，外加\
  \ 1 到 100 的和，即 (100 * 101) / 2 = 5050。等等，1 到 100 的和是 5050。让我们重新计算：1+100=101，2+99=101...\
  \ 有 50 对 101，结果是 5050。所以结果是 5050。）\n\n### range() 和 for 循环\n\n`while` 循环在条件为 `True`\
  \ 时会持续循环（这也是它名字的由来），但如果你只想执行特定次数的代码呢？你可以通过 `for` 循环语句和 `range()` 函数来实现。\n\n在代码中，`for`\
  \ 语句看起来像 `for i in range(5):`，并且始终包含以下内容：\n\n*   `for` 关键字\n*   一个变量名\n*   `in`\
  \ 关键字\n*   对 `range()` 方法的调用，并传入最多三个整数\n*   一个冒号\n*   从下一行开始，一个缩进的代码块（称为 `for` 子句）\n\
  \n让我们创建一个名为 `fiveTimes.py` 的新程序，帮助你看到 `for` 循环的运行情况。\n\n```python\nprint('My name\
  \ is')\nfor i in range(5):\n    print('Jimmy Five Times (' + str(i) + ')')\n```\n\
  \n`for` 子句中的代码会被运行五次。第一次运行时，变量 `i` 被设置为 `0`。子句中的 `print()` 调用将打印 `Jimmy Five Times\
  \ (0)`。当 Python 完成对 `for` 子句内部所有代码的迭代后，执行将回到循环顶部，`for` 语句将 `i` 增加 1。这就是为什么 `range(5)`\
  \ 导致子句进行五次迭代，`i` 分别被设置为 `0`、然后是 `1`、`2`、`3`、最后是 `4`。变量 `i` 将增加到（但不包含）传递给 `range()`\
  \ 的整数。\n\n### Starting, Stopping, and Stepping\n\n`range()` 函数可以接受三个参数：第一个参数是起始值，第二个是停止值（不包含），第三个是步长（可选）。\n\
  \n```python\nfor i in range(0, 10, 2):\n    print(i)\n```\n\n这段代码将打印 `0, 2, 4, 6,\
  \ 8`。如果你省略第一个参数，起始值将默认为 `0`。如果你省略第三个参数，步长将默认为 `1`。\n\n```python\nfor i in range(5,\
  \ 10):\n    print(i)\n```\n\n这段代码将打印 `5, 6, 7, 8, 9`。\n\n```python\nfor i in range(10,\
  \ 5, -1):\n    print(i)\n```\n\n这段代码将打印 `10, 9, 8, 7, 6`。\n\n### An Equivalent while\
  \ Loop\n\n你可以使用 `while` 循环来实现与 `for` 循环相同的功能。\n\n```python\ni = 0\nwhile i < 5:\n\
  \    print(i)\n    i = i + 1\n```\n\n这段代码将打印 `0, 1, 2, 3, 4`。使用 `for` 循环通常更简洁，因为它会自动处理初始化、条件检查和递增。\n\
  \n### Nested Loops\n\n你还可以在循环中嵌套另一个循环。\n\n```python\nfor i in range(3):\n    for\
  \ j in range(2):\n        print(i, j)\n```\n\n### Summary `while` 循环在条件为 `True`\
  \ 时会持续循环（这也是它名字的由来），但如果你只想执行特定次数的代码呢？你可以通过 `for` 循环语句和 `range()` 函数来实现。\n\n（注：由于你提供的原始文本中存在大量重复内容，我在翻译时已根据指令“不要重复输出原文”的要求进行了去重处理，确保了逻辑的连贯。）\n\
  \n\n\n\n这是一个 `import` 语句的示例，用于导入四个不同的模块：\n\n```\nimport random, sys, os, math\n\
  ```\n\n现在我们可以使用这四个模块中的任何函数。我们将在书的后面学习更多关于它们的知识。\n\n## from import 语句\n\n`import`\
  \ 语句的另一种形式由 `from` 关键字组成，后面跟着模块名、`import` 关键字和一个星号 `*`；例如，`from random import *`。\n\
  \n使用这种形式的 `import` 语句，调用 `random` 中的函数将不需要 `random.` 前缀。然而，使用全名会让代码更具可读性，因此最好使用\
  \ `import` 语句的普通形式。\n\n## 使用 sys.exit() 提前结束程序\n\n最后一个要介绍的流程控制概念是如何终止程序。如果程序执行到达指令的底部，就会发生这种情况。但是，你可以通过调用\
  \ `sys.exit()` 函数来导致程序终止或退出。由于该函数位于 `sys` 模块中，你必须在程序使用它之前导入 `sys`。\n\n打开一个新的文件编辑器窗口并输入以下代码，将其保存为\
  \ `exitExample.py`：\n\n```python\nimport sys\n\nwhile True:\n    print('Type exit\
  \ to exit.')\n    response = input()\n    if response == 'exit':\n        sys.exit()\n\
  \    print('You typed ' + response + '.')\n```\n\n在 IDLE 中运行此程序。此程序有一个没有 `break`\
  \ 语句的无限循环。该程序结束的唯一方法是用户输入 `exit`，导致调用 `sys.exit()`。当 `response` 等于 `exit` 时，程序结束。由于\
  \ `response` 变量由 `input()` 函数设置，用户必须输入 `exit` 来停止程序。\n\n## 总结\n\n通过使用求值为 `True`\
  \ 或 `False` 的表达式（也称为条件），你可以编写程序来决定执行哪些代码以及跳过哪些代码。你还可以在特定条件求值为 `True` 的时候在循环中反复执行代码。如果你需要退出循环或跳回开头，`break`\
  \ 和 `continue` 语句非常有用。\n\n这些流程控制语句将让你编写出智能得多的程序。还有另一种类型的流程控制可以通过编写自己的函数来实现，这是下一章的主题。\n\
  \n## 练习题\n\n| Q: | 1\\. 布尔数据类型的两个值是什么？你如何编写它们？ |\n| Q: | 2\\. 三种布尔运算符是什么？ |\n| Q:\
  \ | 3\\. 写出每个布尔运算符的真值表（即该运算符的布尔值的各种可能组合以及它们的求值结果）。 |\n| Q: | 4\\. 下述表达式的求值是什么？ |\n\
