  \n## 选择性复制\n\n编写一个程序遍历文件夹树并搜索具有特定文件后缀（例如 `.pdf` 或 `.jpg`）的文件。将这些文件从所在的任何位置复制到一个新文件夹中。\n\
  \n## 删除不需要的文件\n\n几个不需要但体积巨大的文件或文件夹占据了硬盘的大部分空间并不罕见。如果你正尝试为电脑腾出空间，删除那些不需要的文件中最大的几个将让你获得最高的效率。但首先，你必须找到它们。\n\
  \n编写一个程序，遍历文件夹树并搜索异常巨大的文件或文件夹——例如，大小大于 100MB 的文件。（记住，要获取文件大小，可以使用 `os` 模块中的 `os.path.getsize()`。）将这些文件及其绝对路径打印到屏幕上。\n\
  \n## 填补空隙\n\n编写一个程序，在单个文件夹中查找所有给定前缀的文件（例如 `spam001.txt`、`spam002.txt` 等），并定位编号中的任何空隙（例如存在\
  \ `spam001.txt` 和 `spam003.txt` 但没有 `spam002.txt`）。让程序重命名后续的所有文件以填补这个空隙。\n\n作为一个额外挑战，编写另一个程序，可以在编号的文件中插入空隙，以便添加新文件。\n\
  \n# 第 10 章 调试\n\n现在你已经掌握了编写更复杂程序的知识，你可能开始在程序中发现并不简单的 bug。本章将涵盖了一些工具和技术，用于寻找程序中 bug\
  \ 的根源，帮助你更快、更轻松地修复它们。\n\n用程序员之间的一句老笑话来说：“写代码占编程的 90%，调试代码占了另外的 90%。”\n\n你的电脑只会执行你让它做的事情；它不会读取你的心思并执行你*想要*让它做的事。即使是专业程序员也会不断创建\
  \ bug，所以如果你的程序出现问题，不要感到气馁。\n\n幸运的是，有几种工具和技术可以识别你的代码到底在做什么，以及哪里出了错。首先，你将学习日志（logging）和断言（assertions），这是可以帮助你早期检测\
  \ bug 的两个功能。通常情况下，越早发现 bug，修复就越容易。\n\n其次，你将学习如何使用调试器。调试器是 IDLE 的一个功能，它可以一次执行一条指令，让你在代码运行时有机会检查变量中的值，并跟踪这些值在程序运行过程中的变化。这比全速运行程序要慢得多，但在程序运行时查看实际值是有帮助的，而不是从源代码中推断值可能是什么。\n\
  \n## 抛出异常\n\n当 Python 尝试执行无效代码时，就会抛出异常。在第 3 章 中，你学习了如何使用 `try` 和 `except` 语句处理 Python\
  \ 异常，以便你的程序可以从预料的异常中恢复。但你也可以在代码中抛出自己的异常。抛出异常是表达：“停止运行此函数中的代码，并将程序执行转移到 `except`\
  \ 语句。”\n\n异常通过 `raise` 语句抛出。在代码中，`raise` 语句由以下部分组成：\n\n*   `raise` 关键字\n*   对 `Exception()`\
  \ 函数的调用\n*   传递给 `Exception()` 函数的带有错误信息的字符串\n\n例如，在交互式 shell 中输入以下内容：\n\n```\n\
  >>> raise Exception('This is the error message.')\nTraceback (most recent call last):\n\
  \  File \"<pyshell#191>\", line 1, in <module>\n    raise Exception('This is the\
  \ error message.')\nException: This is the error message.\n```\n\n如果没有 `try` 和 `except`\
  \ 语句覆盖 `raise` 语句，程序将崩溃并显示异常的错误信息。通常是调用函数的代码 own 函数本身知道如何处理异常。例如，打开一个新文件，输入以下代码并将其保存为\
  \ *boxPrint.py*：\n\n```python\ndef boxPrint(symbol, width, height):\n    if len(symbol)\
  \ != 1:\n        raise Exception('Symbol must be a character string.')\n    if width\
  \ <= 2:\n        raise Exception('Width must be greater than 2.')\n    if height\
  \ <= 2:\n        raise Exception('Height must be greater than 2.')\n    print(symbol\
  \ * width)\n    for i in range(height - 2):\n        print(symbol + (' ' * (width\
  \ - 2)) + symbol)\n    print(symbol * width)\n\nfor sym, w, h in ('*', 4, 4), ('O',\
  \ 20, 5), ('x', 1, 3), ('ZZ', 3, 3)):\n    try:\n        boxPrint(sym, w, h)\n \
  \   except Exception as err:\n        print('An exception happened: ' + str(err))\n\
  ```\n\n在这里我们定义了一个 `boxPrint()` 函数，它接收一个字符、一个宽度和一个高度，并用字符画出一个相应尺寸的小盒子。这个盒子形状被打印到控制台。\n\
  \n假设我们希望字符是单个字符，且宽度和高度大于 2。如果不满足这些要求，我们就添加 `if` 语句来抛出异常。随后，当我们用各种参数调用 `boxPrint()`\
  \ 时，我们的 `try/except` 将处理无效参数。\n\n该程序使用了 `except Exception as err` 形式的 `except` 语句。如果从\
  \ `boxPrint()` 返回了一个 `Exception` 对象，这个 `except` 语句将其存储在名为 `err` 的变量中。然后可以通过将其传递给\
  \ `str()` 将异常对象转换为字符串，产生产生友好的错误信息。当你运行此 *boxPrint.py* 时，输出看起来如下：\n\n```****\n* \
  \ *\n*  *\n****\nOOOOOOOOOOOOOOOOOOOO\nO                  O\nO                 \
  \ O\nO                  O\nOOOOOOOOOOOOOOOOOOOO\nAn exception happened: Width must\
  \ be greater than 2.\nAn exception happened: Symbol must be a character string.\n\
  ```\n\n使用 `try` 和 `except` 语句，你可以更优雅地处理错误，而不是让整个程序崩溃。\n\n# 将回溯信息转换为字符串\n\n\n\n\n\
  \n当 Python 遇到错误时，它会产生大量的名为 `traceback`（回溯）的错误信息。traceback 包含了错误信息、产生错误的行号，以及导致该错误的函数调用序列。这系列调用被称为\
  \ `call stack`（调用堆栈）。\n\n在 IDLE 中打开一个新文件编辑器窗口，输入以下程序并将其保存为 `errorExample.py`：\n\n\
  ```python\ndef spam():\n    bacon()\ndef bacon():\n    raise Exception('This is\
  \ the error message.')\n\nspam()\n```\n\n当你运行 `errorExample.py` 时，输出将如下：\n\n```\n\
  Traceback (most recent call last):\n  File \"errorExample.py\", line 7, in <module>\n\
  \    spam()\n  File \"errorExample.py\", line 2, in spam\n    bacon()\n  File \"\
  errorExample.py\", line 5, in bacon\n    raise Exception('This is the error message.')\n\
  Exception: This is the error message.\n```\n\n从 traceback 中你可以看到错误发生在第 5 行的 `bacon()`\
  \ 函数中。这次对 `bacon()` 的特定调用来自 `spam()` 函数的第 2 行，而 `spam()` 又是在第 7 行调用的。在函数可以从多处调用的程序中，调用堆栈可以帮助你确定哪个调用导致了错误。\n\
  \n每当异常异常未被处理时，Python 都会显示 traceback。但你也可以通过调用 `traceback.format_exc()` 将其作为字符串获取。如果你既想要异常回溯的信息，又想用\
  \ `except` 语句来优雅地处理异常，那么这个函数就会有用。在调用此函数之前，你需要导入 Python 的 `traceback` 模块。\n\n例如，与其在异常发生时立即让程序崩溃，你可以将\
  \ traceback 信息写入日志文件并让程序继续运行。当你准备好调试程序时，可以再查看日志文件。在交互式 shell 中输入以下内容：\n\n```python\n\
  >>> import traceback\n>>> try:\n         raise Exception('This is the error message.')\n\
  except:\n         errorFile = open('errorInfo.txt', 'w')\n         errorFile.write(traceback.format_exc())\n\
  \         errorFile.close()\n         print('The traceback info was written to errorInfo.txt.')\n\
  \n116\nThe traceback info was written to errorInfo.txt.\n```\n\n`116` 是 `write()`\
  \ 方法的返回值，因为文件被写入了 116 个字符。traceback 文本已写入 `errorInfo.txt`。\n\n```\nTraceback (most\
  \ recent call last):\n  File \"<pyshell#28>\", line 2, in <module>\nException: This\
  \ is the error message.\n```\n\n## 断言 (Assertions)\n\n`assertion`（断言）是一种性检查，用于确保你的代码没有在执行明显错误的操作。这些性检查通过\
  \ `assert` 语句执行。如果性检查失败，则会抛出 `AssertionError` 异常。在代码中，一个 `assert` 语句由以下部分组成：\n\n\
  * `assert` 关键字\n* 一个条件（即求值为为 `True` 或 `False` 的表达式）\n* 一个逗号\n* 当条件为 `False` 时要显示的字符串\n\
  \n例如，在交互式 shell 中输入以下内容：\n\n```python\n>>> podBayDoorStatus = 'open'\n>>> assert\
  \ podBayDoorStatus == 'open', 'The pod bay doors need to be \"open\".'\n>>> podBayDoorStatus\
  \ = 'I\\'m sorry, Dave. I\\'m afraid I can\\'t do that.'\n>>> assert podBayDoorStatus\
  \ == 'open', 'The pod bay doors need to be \"open\".'\nTraceback (most recent call\
  \ last):\n  File \"<pyshell#10>\", line 1, in <module>\n    assert podBayDoorStatus\
  \ == 'open', 'The pod bay doors need to be \"open\".'\nAssertionError: The pod bay\
  \ doors need to be \"open\".\n```\n\n在这里，我们将 `podBayDoorStatus` 设置为 `'open'`，所以从现在起，我们完全预期该变量的值为\
  \ `'open'`。在使用该变量的程序中，我们可能在假设值为 `'open'` 的情况下编写了很多代码——这些代码依赖于其值为 `'open'` 以按照我们的预期工作。因此，我们添加一个断言来确保我们假设\
  \ `podBayDoorStatus` 为 `'open'` 是正确的。在这里，我们包含了消息 `'The pod bay doors need to be\
  \ \"open\".'`，这样如果断言失败，就能很容易看出哪里错了。\n\n随后，假设我们犯了一个明显的错误，给 `podBayDoorStatus` 赋值了另一个值，但在许多行代码中没有注意到。断言捕捉到了这个错误并清楚地告诉我们哪里错了。\n\
  \n用通俗的话说，一个 `assert` 语句的意思是：“我断言这个条件成立的，如果不是，说明程序某处有 bug。” 与异常不同，你的代码不应该用 `try`\
  \ 和 `except` 来处理 `assert` 语句；如果断言失败，你的程序应该崩溃。通过这种“快速失败”的方式，你缩短了产生 bug 原因与你首次发现它之间的时间。这将减少你在找到导致\
  \ bug 的代码之前需要检查的代码量。\n\n断言是针对程序员错误的，而不是用户错误。对于可以恢复的错误（例如找不到文件或用户输入了无效数据），应该抛出异常，而不是用\
  \ `assert` 语句来检测。\n\n## 在交通灯模拟中使用断言\n\n假设你正在构建一个交通灯模拟。表示红绿灯的数据结构是一个带有 `ns`（南北）和\
  \ `ew`（东西）键的字典。值将是 `'green'`、`'yellow'` 或 `'red'` 之一。代码如下：\n\n```python\nmarket_2nd\
  \ = {'ns': 'green', 'ew': 'red'}\nmission16th = {'ns': 'red', 'ew': 'green'}\n```\n\
  \n为了启动项目，你想编写一个 `switchLights()` 函数，它接收一个字典作为参数并切换信号灯。实现此功能的代码如下：\n\n```python\n\
  def switchLights(stoplight):\n    for key in stoplight.keys():\n        if stoplight[key]\
  \ == 'green':\n            stoplight[key] = 'yellow'\n        elif stoplight[key]\
  \ == 'yellow':\n            stoplight[key] = 'red'\n        elif stoplight[key]\
  \ == 'red':\n            stoplight[key] = 'green'\n\nswitchLights(market_2nd)\n\
  ```\n\n你可能已经看到了这段代码的问题，但让我们假设你在没有注意到它的情况下编写了数千行的其余模拟代码。当你终于运行模拟时，程序没有崩溃——但你的虚拟汽车却崩溃了！由于你已经写了程序的其余部分，你不知道\
  \ bug 可能在哪里。它可能在模拟汽车的代码中，也可能在模拟虚拟司机的代码中。\n\n但如果在编写 `switchLights()` 时你添加了一个断言来确保至少有一盏灯是红色的，你可能在函数底部包含了以下内容：\n\
  \n```python\nassert 'red' in stoplight.values(), 'Neither light is red! ' + str(stoplight)\n\
  ```\n\n有了这个断言后，你的程序将带有以下错误消息崩溃：\n\n```\nTraceback (most recent call last):\n  File\
  \ \"carSim.py\", line 14, in <module>\n    switchLights(market_2nd)\n  File \"carSim.py\"\
  , line 13, in switchLights\n    assert 'red' in stoplight.values(), 'Neither light\
  \ is red! ' + str(stoplight)\nAssertionError: Neither light is red! {'ns': 'yellow',\
  \ 'ew': 'green'}\n```\n\n这里的关键行是 `AssertionError`。虽然程序崩溃并不理想，但它立即指出了性检查失败：两个方向的交通都没有红灯。通过在程序执行早期阶段快速失败，你可以节省大量的未来调试工作。\n\
  \n\n\n\n\n## 禁用断言\n\n在运行 Python 时，可以通过传递 `-O` 选项禁用断言。当你已经完成程序的编写和测试，并且不希望它因执行健全性检查而变慢时（尽管在大多数情况下\
  \ `assert` 语句不会导致明显的速度差异），这种方法非常有用。断言是用于开发阶段的，而不是最终产品。在你将程序交给他人运行之前，它应该已经没有错误且不再需要健全性检查。有关如何使用\
  \ `-O` 选项启动你可能没疯的程序，请参阅附录 B。\n\n# 日志\n\n如果你曾经在代码中放入 `print()` 语句在程序运行时输出某个变量的值，那么你已经使用了某种形式的\
  \ `logging` 来调试代码。日志是理解程序内部正在发生什么以及发生顺序的极佳方法。Python 的 `logging` 模块让你能够轻松地创建你所编写的自定义消息记录。这些日志消息将描述程序执行何时到达日志函数调用，并列出你在该时间点指定的任何变量。相反，缺失日志消息表示代码的某部分被跳过且从未执行。\n\
  \n## 使用 logging 模块\n\n要让 `logging` 模块在程序运行时将日志消息显示在屏幕上，将以下内容复制到程序的顶部（但要在 `#! python`\
  \ shebang 行之下）：\n\n```\nimport logging\nlogging.basicConfig(level=logging.DEBUG,\
  \ format=' %(asctime)s - %(levelname)s\n- %(message)s')\n```\n\n你不需要太担心它是如何工作的，但基本上，当\
  \ Python 记录一个事件时，它会创建一个包含该事件信息的 `LogRecord` 对象。`logging` 模块的 `basicConfig()` 函数允许你指定你想要看到的关于\
  \ `LogRecord` 对象的细节信息，以及你希望如何显示这些细节。\n\n假设你写了一个用于计算数字 `factorial`（阶乘）的函数。在数学中，4\
  \ 的阶乘是 1 × 2 × 3 × 4，即 24。7 的阶乘是 1 × 2 × 3 × 4 × 5 × 6 × 7，即 5,040。打开一个新的文件编辑器窗口并输入以下代码。代码中有一个错误，但你也会输入几条日志消息来帮助自己找出哪里出了问题。将程序保存为\
  \ `factorialLog.py`。\n\n```\nimport logging\nlogging.basicConfig(level=logging.DEBUG,\
  \ format=' %(asctime)s - %(levelname)s\n- %(message)s')\nlogging.debug('Start of\
  \ program')\n\ndef factorial(n):\n    logging.debug('Start of factorial( %)' % (n))\n\
  \    total = 1\n    for i in range(n + 1):\n        total *= i\n        logging.debug('i\
  \ is ' + str(i) + ', total is ' + str(total))\n    logging.debug('End of factorial(\
  \ %)' % (n))\n    return total\n\nprint(factorial(5))\nlogging.debug('End of program')\n\
  ```\n\n在这里，当我们想要打印日志信息时，使用 `logging.debug()` 函数。这个 `debug()` 函数会调用 `basicConfig()`，并打印一行信息。这些信息将按照我们在\
  \ `basicConfig()` 中指定的格式格式，并包含我们传递给 `debug()` 的消息。`print(factorial(5))` 调用是原始程序的一部分，因此即使禁用了日志消息，结果也会显示。\n\
  \n该程序的输出如下：\n\n```\n2015-05-23 16:20:12,664 - DEBUG - Start of program\n2015-05-23\
  \ 16:20:12,664 - DEBUG - Start of factorial(5)\n2015-05-23 16:20:12,665 - DEBUG\
  \ - i is 0, total is 0\n2015-05-23 16:20:12,668 - DEBUG - i is 1, total is 0\n2015-05-23\
  \ 16:20:12,670 - DEBUG - i is 2, total is 0\n2015-05-23 16:20:12,673 - DEBUG - i\
  \ is 3, total is 0\n2015-05-23 16:20:12,675 - DEBUG - i is 4, total is 0\n2015-05-23\
  \ 16:20:12,678 - DEBUG - i is 5, total is 0\n2015-05-23 16:20:12,680 - DEBUG - End\
  \ of factorial(5)\n0\n2015-05-23 16:20:12,684 - DEBUG - End of program\n```\n\n\
  `factorial()` 函数返回 `5` 的阶乘为 `0`，这是不对的。`for` 循环应该将 `total` 中的值乘以从 `1` 到 `5` 的数字。但\
  \ `logging.debug()` 显示的日志消息显示变量 `i` 是 `0` 开始的而不是 `1`。由于任何数乘以零都是零，后续迭代的 `total` 值也是错误的。日志消息提供了面包屑线索，可以帮助你发现问题。将\
  \ `for i in range(n + 1):` 行改为 `for i in range(1, n + 1):` 并运行程序。输出将如下：\n\n```\n\
  2015-05-23 16:20:12,664 - DEBUG - Start of program\n2015-05-23 16:20:12,664 - DEBUG\
  \ - Start of factorial(5)\n2015-05-23 16:20:12,665 - DEBUG - i is 1, total is 1\n\
  2015-05-23 16:20:12,668 - DEBUG - i is 2, total is 2\n2015-05-23 16:20:12,670 -\
  \ DEBUG - i is 3, total is 6\n2015-05-23 16:20:12,673 - DEBUG - i is 4, total is\
  \ 24\n2015-05-23 16:20:12,675 - DEBUG - i is 5, total is 120\n2015-05-23 16:20:12,680\
  \ - DEBUG - End of factorial(5)\n120\n2015-05-23 16:20:12,684 - DEBUG - End of program\n\
  ```\n\n## 不要用 print() 调试\n\n日志消息是面向程序员的，而不是用户的。用户不会关心你为了调试而需要查看的某些值；对于这种内容请使用日志消息。对于用户想要看到的消息，例如\
  \ *文件未找到* 或 *输入无效，请输入数字*，你应该使用 `print()` 调用。你不希望在禁用日志消息后剥夺用户的有用信息。\n\n## 日志\n\n\
  日志级别提供了一种按重要性对日志消息进行分类的方法。共有五个日志级别，如表 10-1 所示，从不重要到重要。可以使用不同的日志函数在每个级别上记录消息。\n\n\
  表 10-1. Python 中的日志级别\n\n| 级别 | 日志函数 | 说明 |\n| --- | --- | --- |\n| DEBUG | `logging.debug()`\
  \ | 最低级别。用于记录细节。通常在诊断问题时你会关注这些消息。 |\n| INFO | `logging.info()` | 用于记录程序中的一般事件或确认程序在某一点运行正常。\
  \ |\n| WARNING | `logging.warning()` | 用于指示可能出现的问题，该问题不会阻止程序运行，但未来可能会导致。 |\n| ERROR\
  \ | `logging.error()` | 用于记录导致程序执行某些失败的错误。 |\n| CRITICAL | `logging.critical()`\
  \ | 最高级别。用于指示导致程序停止运行或即将导致程序完全停止运行的致命错误。 |\n\n你的日志消息作为字符串传递给这些函数。日志级别只是建议。归根结底，由你决定日志消息属于哪个类别。在交互式\
  \ shell 中输入以下内容：\n\n\n\n\n\n```\n>>> import logging\n>>> logging.basicConfig(level=logging.DEBUG,\
  \ format=' %(asctime)s -\n%(levelname)s - %(message)s')\n>>> logging.debug('Some\
  \ debugging details.')\n2015-05-18 19:04:26,901 - DEBUG - Some debugging details.\n\
  >>> logging.info('The logging module is working.')\n2015-05-18 19:04:35,569 - INFO\
  \ - The logging module is working.\n>>> logging.warning('An error message is about\
  \ to be logged.')\n2015-05-18 19:04:56,843 - WARNING - An error message is about\
  \ to be logged.\n>>> logging.error('An error has occurred.')\n2015-05-18 19:05:07,737\
  \ - ERROR - An error has occurred.\n>>> logging.critical('The program is unable\
  \ to recover!')\n2015-05-18 19:05:45,794 - CRITICAL - The program is unable to recover!\n\
  ```\n\n日志级别的好处在于，你可以更改想要查看的日志消息优先级。将 `logging.DEBUG` 传递给 `basicConfig()` 函数的 `level`\
  \ 关键字参数，将显示来自所有日志级别的消息（DEBUG 是最低级别）。但在对程序进行更进一步开发后，你可能只对错误感兴趣。在这种情况下，你可以将 `basicConfig()`\
  \ 的 `level` 参数设置为 `logging.ERROR`。这将只显示 `ERROR` 和 `CRITICAL` 消息，并跳过 `DEBUG`、`INFO`\
  \ 和 `WARNING` 消息。\n\n## 禁用日志\n\n在你调试完程序后，可能不希望所有这些日志信息弄满屏幕。`logging.disable()` 函数可以禁用这些日志，这样你就不需要手动进入程序并删除所有的日志调用。你只需向\
  \ `logging.disable()` 传递一个日志级别，它就会抑制该级别及更低级别的所有日志消息。因此，如果你想完全禁用日志，只需在程序中添加 `logging.disable(logging.CRITICAL)`\
  \ 即可。例如，在交互式 shell 中输入以下内容：\n\n```\n>>> import logging\n>>> logging.basicConfig(level=logging.INFO,\
  \ format=' %(asctime)s -\n%(levelname)s - %(message)s')\n>>> logging.critical('Critical\
  \ error! Critical error!')\n2015-05-22 11:10:48,054 - CRITICAL - Critical error!\
  \ Critical error!\n>>> logging.disable(logging.CRITICAL)\n>>> logging.critical('Critical\
  \ error! Critical error!')\n>>> logging.error('Error! Error!')\n```\n\n由于 `logging.disable()`\
  \ 将禁用其之后的所有消息，你可能想将其添加到程序中 `import logging` 代码行附近。这样，你就可以方便地找到并注释掉或取消该调用，以根据需要启用或禁用日志消息。\n\
  \n## 将日志写入文件\n\n与其将日志消息显示在屏幕上，还不如将它们写入文本文件。`logging.basicConfig()` 函数接受一个 `filename`\
  \ 关键字参数，如下：\n\n```python\nimport logging\nlogging.basicConfig(filename='myProgramLog.txt',\
  \ level=logging.DEBUG, format='\n%(asctime)s - %(levelname)s - %(message)s')\n```\n\
  \n日志消息将保存到 `myProgramLog.txt` 中。虽然日志消息很有帮助，但它们会弄乱屏幕并导致难以阅读程序的输出。将日志消息写入文件可以保持屏幕整洁，并存储这些消息以便你在运行程序后阅读它们。你可以使用任何文本编辑器（如\
  \ Notepad 或 TextEdit）打开此文本文件。\n\n## IDLE 调试器\n\n`debugger` 是 IDLE 的一个功能，允许你逐行执行程序。调试器将运行单行代码，然后等待你告诉它继续。通过这种方式“在调试器下”运行你的程序，你可以花费任何需要的时间来在程序生命周期内的任何时间点检查变量的值。这是一个追踪\
  \ bug 的非常有价值的工具。\n\n要启用 IDLE 的调试器，请在交互式 shell 窗口中点击 `Debug`▸`Debugger`。这将调出调试控制窗口，其外观类似于图\
  \ 10-1。\n\n当调试控制窗口出现时，勾选 `Stack`、`Locals`、`Source` 和 `Globals` 所有四个复选框，以便窗口显示完整的调试信息。当调试控制窗口显示时，每当你从文件编辑器运行程序，调试器都会在第一条指令之前暂停执行并显示以下内容：\n\
  \n*   即将执行的代码行\n*   所有局部变量及其值的列表\n*   所有全局变量及其值的列表\n\n![调试控制窗口](img/httpatomoreillycomsourcenostarchimages2189633.png.jpg)\n\
  \n图 10-1. 调试控制窗口\n\n你会注意到，在全局变量列表中，有几个你没有定义的变量，例如 `__builtins__`、`__doc__`、`__file__`\
  \ 等。这些是 Python 在每次运行程序时自动设置的变量。这些变量的含义超出了本书的讨论范围，你可以放心地忽略它们。\n\n程序将保持暂停状态，直到你按下窗口中的其中一个按钮：`Go`、`Step`、`Out`\
  \ 或 `Quit`。\n\n### Go\n点击 `Go` 按钮将使程序正常运行直到遇到*断点*（断点将在本节介绍）。如果你完成了调试并想让程序继续，点击 `Go`\
  \ 按钮。\n\n### Step\n点击 `Step` 按钮将使调试器执行下一行代码然后再次暂停。调试控制窗口的全局和局部变量列表会在值发生变化时更新。如果下一行代码是一个调用，调试器将“进入”该函数并跳转到该函数的第一行代码。\n\
  \n### Over\n点击 `Over` 按钮将执行下一行代码，类似于 `Step` 按钮。然而，如果下一行代码是一个调用，`Over` 按钮将“跳过”函数代码。函数代码将全速执行，调试器将在调用返回后暂停。例如，如果下一行代码是\
  \ `print()` 调用，你并不关心 `print()` 函数内部的代码；只想只想传递它的字符串打印到屏幕上。由于这个原因，使用 `Over` 按钮比使用\
  \ `Step` 按钮更常见。\n\n### Out\n点击 `Out` 按钮将使调试器全速执行代码直到从当前函数返回。如果你使用 `Step` 进入了函数调用，现在只想一直执行直到出来，点击\
  \ `Out` 按钮以退出当前函数调用。\n\n### Quit\n如果你想完全停止调试并且不再运行程序的剩余部分，点击 `Quit` 按钮。`Quit` 按钮将立即终止程序。如果你想再次正常运行程序，请再次选择\
  \ `Debug`▸`Debugger` 以禁用调试器。\n\n## 调试一个数字加法程序\n\n打开一个新的文件编辑器窗口并输入以下代码：\n\n```python\n\
  print('输入要加的第一个数字:')\nfirst = input()\nprint('输入要加的第二个数字:')\nsecond = input()\n\
  print('输入要加的第三个数字:')\nthird = input()\nprint('和为' + first + second + third)\n```\n\
  \n将其保存为 *buggyAddingProgram.py* 首先在未启用调试器的情况下运行。程序将输出类似的内容：\n\n```\n输入要加的第一个数字：\n\
  5\n输入要加的第二个数字：\n3\n输入要加的第三个数字：\n42\n和为 5342\n```\n\n程序没有崩溃，但结果显然是错误的。让我们启用调试窗口并再次运行，这次在调试器下运行。\n\
  \n\n\n\n当你按下 `F5` 或选择 `Run`▸`Run Module`（在启用 `Debug`▸`Debugger` 并勾选了调试控制窗口上的所有四个复选框框时），程序将在第\
  \ 1 行以暂停状态启动。调试器总会在它即将执行的代码行上暂停。调试控制窗口的视图将如图 10-2 所示。\n\n![程序在调试器下首次启动时的调试控制窗口](img/httpatomoreillycomsourcenostarchimages2189635.png.jpg)\n\
  \n图 10-2. 程序在调试器下首次启动时的调试控制窗口\n\n点击一次 `Over` 按钮来执行第一次 `print()` 调用。在这里你应该使用 `Over`\
  \ 而不是 `Step`，因为你不想进入 `print()` 函数内部的代码。调试控制窗口将更新到第 2 行，文件编辑器窗口中的第 2 行将被高亮，如图 10-3\
  \ 所示。这向你展示了程序当前执行的位置。\n\n![点击 Over 后调试控制窗口](img/httpatomoreillycomsourcenostarchimages2189637.png.jpg)\n\
  \n图 10-3. 点击 Over 后调试控制窗口\n\n再次点击 `Over` 执行 `input()` 函数调用，此时调试控制窗口中的按钮将禁用，同时 IDLE\
  \ 等待你在交互 shell 窗口中为 `input()` 输入内容。输入 `5` 并按回车键。调试控制窗口的按钮将重新启用。\n\n继续点击 `Over`，并输入\
  \ `3` 和 `42` 作为两个数字，直到调试器到达第 7 行，即程序中最后一个 `print()` 调用。调试控制窗口的视图应如图 10-4 所示。你可以在\
  \ Globals（全局变量）部分看到第一个、第二个和第三个变量被设置为字符串值 `'5'`、`'3'` 和 `'42'`，而不是整数值 `5`、`3` 和 `42`。当执行最后一行时，这些字符串会被拼接而不是相加，导致了错误。\n\
  \n![最后一行的调试控制窗口。变量被设置为字符串，导致了错误。](img/httpatomoreillycomsourcenostarchimages2189639.png.jpg)\n\
  \n图 10-4. 最后一行的调试控制窗口。变量被设置为字符串，导致了错误。\n\n使用调试器逐行执行程序很有帮助但可能很慢。通常你可能希望程序一直正常运行，直到到达某行代码。你可以通过断点来配置调试器实现这一点。\n\
  \n## 断点\n\n*断点*（breakpoint）可以设置在特定的代码行上，并强制调试器每当程序执行到达该行时都暂停。打开一个新的文件编辑器窗口并输入以下程序，该程序模拟了抛掷\
  \ 1000 次硬币。将其保存为 *coinFlip.py*。\n\n```\n import random\n   heads = 0\n   for i in\
  \ range(1, 1001):\n     if random.randint(0, 1) == 1:\n           heads = heads\
  \ + 1\n       if i == 500:\n         print('Halfway done!')\n   print('Heads came\
  \ up ' + str(heads) + ' times.')\n```\n\n`random.randint(0, 1)` 调用 ➊ 有一半时间返回 `0`，另一半时间返回\
  \ `1`。这可以模拟 50/50 的硬币掷，其中 `1` 代表正面。当你不使用调试器运行此程序时，它会快速输出如下内容：\n\n```\nHalfway done!\n\
  Heads came up 490 times.\n```\n\n在调试器下运行此程序，在程序终止之前你需要点击数千次 `Over` 按钮。如果你对程序执行到一半（即已完成\
  \ 1000 次硬币掷中的 500 次）时 `heads` 的值感兴趣，你只需在 `print('Halfway done!')` ➋ 行设置一个断点即可。要设置断点，在文件编辑器中右键点击该行并选择\
  \ `Set Breakpoint`，如图 10-5 所示。\n\n![设置断点](img/httpatomoreillycomsourcenostarchimages2189641.png.jpg)\n\
  \n图 10-5. 设置断点\n\n你不会在 `if` 语句行上设置断点，因为 `if` 语句在每次迭代中都会执行。通过在 `if` 语句的代码内部设置断点，调试器只会在执行进入\
  \ `if` 子句时中断。\n\n文件编辑器中带有断点的行将显示为黄色。当你在调试器下运行程序时，它将在暂停状态启动。要移除断点，在文件编辑器中右键点击该行并选择\
  \ `Clear Breakpoint`。黄色高亮将消失，调试器将不再在该处中断。\n\n## 总结\n\n断言、异常、日志和调试器都是发现 bug 的有效工具。\n\
  \n## 练习题\n\n1. 写一个断言语句，如果 `spam` 小于 10 则触发 `AssertionError`。\n2. 写一个断言语句，如果 `eggs`\
  \ 和 `bacon` 包含相同的字符串（即使大小写不同，即 `'hello'` 和 `'hello'` 被视为相同，`'goodbye'` 和 `'GOODbye'`\
  \ 也视为相同），则触发 `AssertionError`。\n3. 写一个总是触发 `AssertionError` 的断言语句。\n4. 为了调用 `logging.debug()`，程序需要哪两行代码？\n\
  5. 为了让 `logging.debug()` 将日志发送到名为 *programLog.txt* 的文件，程序需要哪两行代码？\n6. 五种日志级别是什么？\n\
  7. 添加哪行代码可以禁用程序中的所有日志消息？\n8. 使用日志消息比使用 `print()` 显示相同好在哪里？\n9. 调试控制窗口中的 `Step`、`Over`\
  \ 和 `Out` 按钮有什么区别？\n10. 在点击调试控制窗口中的 `Go` 后，调试器何时停止？\n11. 什么是断点？\n12. 在 IDLE 中如何对代码行设置断点？\n\
  \n## 练习项目\n\n为了练习，请编写一个执行以下功能的程序。\n\n## 调试硬币掷\n\n\n\n\n以下程序是一个简单的硬币正反猜游戏。玩家有两次猜测的机会（这是一个很容易的游戏）。然而，程序中存在几个\
  \ bug。运行几次程序来找出导致程序无法正常运行的 bug。\n\n```python\nimport random\nguess = ''\nwhile guess\
  \ not in ('heads', 'tails'):\n    print('Guess the coin toss! Enter heads or tails:')\n\
  \    guess = input()\ntoss = random.randint(0, 1) # 0 是反面，1 是正面\nif toss == guess:\n\
  \    print('You got it!')\nelse:\n    print('Nope! Guess again!')\n    guesss =\
  \ input()\n    if toss == guess:\n       print('You got it!')\n    else:\n     \
  \   print('Nope. 你真的不擅长玩这个游戏了。')\n```\n\n# 第 11 章：网络爬取\n\n在那些罕见且可怕的没有 Wi-Fi 的时刻，我意识到我在电脑上做的大部分工作实际上是在互联网上完成的。出于习惯，我会发现自己正尝试检查邮件、阅读朋友的\
  \ Twitter 动态，或者回答这个问题：“Kurtwood Smith 在出演 1987 年原版《机械警察》之前担任过什么主要角色吗？”^\n\n由于电脑上的很多工作都涉及互联网，如果你的程序可以上线，那就太棒了。网络爬取（Web\
  \ scraping）是指使用程序从网上下载并处理内容的术语。例如，Google 运行许多网络爬取程序来为它的搜索引擎索引网页。在本章中，你将学习几个可以让 Python\
  \ 轻松爬取网页的模块。\n\n*   `webbrowser`。随 Python 一起提供，可以打开浏览器访问特定页面。\n*   `Requests`。从互联网下载文件和网页。\n\
  *   `Beautiful Soup`。解析 HTML，即网页编写的格式。\n*   `Selenium`。启动并控制网络浏览器。Selenium 能够在此浏览器中填写表单并模拟鼠标点击。\n\
  \n# 项目：使用 webbrowser 模块实现 mapit.py\n\n`webbrowser` 模块的 `open()` 函数可以启动一个新的浏览器访问指定的\
  \ URL。在交互式 shell 中中输入以下内容：\n\n```python\n>>> import webbrowser\n>>> webbrowser.open('http://inventwithpython.com/')\n\
  ```\n\n浏览器标签页将打开到 URL `http://inventwithpython.com/`。这是 `webbrowser` 模块能做的唯一事情。尽管如此，`open()`\
  \ 函数确实让一些有趣的事情成为可能。例如，将街道地址复制到剪贴板并在 Google Maps 上显示地图是很繁琐的。你可以通过编写一个简单的脚本跳出这一任务，使用剪贴板的内容自动在浏览器中启动地图。这样一来，你只需要将地址复制到剪贴板并运行脚本，地图就会为你加载。\n\
  \n这就是你的程序所执行的操作：\n\n*   从命令行参数或剪贴板获取街道地址。\n*   打开浏览器到该地址的 Google Maps 页面。\n\n这意味着你的代码需要执行以下操作：\n\
  \n*   从 `sys.argv` 读取命令行参数。\n*   读取剪贴板内容。\n*   调用 `webbrowser.open()` 函数打开网络浏览器。\n\
  \n打开一个新的文件编辑器窗口并将其保存为 `mapIt.py`。\n\n## 步骤 1：确定 URL\n\n根据附录 B 中的说明，设置 `mapIt.py`，以便当你像这样从命令行运行时……\n\
  \n```\nC:\\> mapit 870 Valencia St, San Francisco, CA 94110\n```\n\n... 脚本将使用命令行参数而不是剪贴板。如果没有命令行参数，程序将知道使用剪贴板的内容。\n\
  \n首先，你需要确定给定的街道地址使用什么 URL。当你在浏览器中加载 `http://maps.google.com/` 并搜索地址时，地址栏中的 URL 看起来像这样：`https://www.google.com/maps/place/870+Valencia+St/@37.7590311,-122.4215096,17z/data=!3m1!4b1!4m2!3m1!1s0x808f7e3dadc07a37:0xc86b0b2bb93b73d8`。地址在\
  \ URL 中，但那里有很多额外的文本。网站通常会在 URL 中添加额外数据以帮助跟踪访问者或自定义网站。但如果你尝试直接访问 `https://www.google.com/maps/place/870+Valencia+St+San+Francisco+CA/`，地址在\
  \ URL 中，但也有很多额外的文本……（注：原文此处存在大量重复段落，已去重处理）。\n\n\n\n\n看看 `mapIt.py` 如何让这项任务变得不再枯燥？\n\
  \n## 类似程序的思路\n\n只要你有一个 URL，`webbrowser` 模块就可以让用户跳过打开浏览器并手动输入网站的步骤。其他程序可以使用此功能来实现以下操作：\n\
  \n*   在不同的浏览器标签页中打开页面上的所有链接。\n*   打开浏览器并跳转到本地天气的 URL。\n*   打开你经常查看的几个社交网络网站。\n\n\
  # 使用 requests 模块从网络下载文件\n\n`requests` 模块让你轻松地从网络下载文件，而无需担心网络错误、连接问题和数据压缩等复杂问题。`requests`\
  \ 模块并不随 Python 一带，因此你需要先安装它。从命令行运行 `pip install requests`。（附录 A 有关于如何安装第三方模块的更多细节。）\n\
  \n编写 `requests` 模块是因为 Python 的 `urllib2` 模块用起来太复杂了。事实上，拿一支记性马克笔，涂掉这一整段。忘记我曾提到过 `urllib2`。如果你需要从网络下载内容，直接使用\
  \ `requests` 模块即可。\n\n接下来，进行一个简单的测试以确保 `requests` 模块已正确安装。在交互式 shell 中输入以下内容：\n\n\
  ```\n>>> import requests\n```\n\n如果没有显示任何错误信息，说明 `requests` 模块已成功安装。\n\n## 使用 requests.get()\
  \ 函数下载网页\n\n`requests.get()` 函数接收一个用于下载的 URL 字符串。通过对 `requests.get()` 的返回值调用 `type()`，你可以看到它返回了一个\
  \ `Response` 对象，该对象包含了 Web 服务器对你的请求给出的响应。我稍后会详细解释 `Response` 对象，但现在请在电脑连接互联网的情况下在交互式\
  \ shell 中输入以下内容：\n\n```\n >>> import requests\n➊ >>> res = requests.get('http://www.gutenberg.org/cache/epub/1112/pg1112.txt')\n\
  \   >>> type(res)\n   <class 'requests.models.Response'>\n➋ >>> res.status_code\
  \ == requests.codes.ok\n   True\n   >>> len(res.text)\n   178981\n   >>> print(res.text[:250])\n\
  \   The Project Gutenberg EBook of Romeo and Juliet, by William Shakespeare\n\n\
  \   This eBook is for the use of anyone anywhere at no cost and with\n   almost\
  \ no restrictions whatsoever. You may copy it, give it away or\n   re-use it under\
  \ the terms of the Proje\n```\n\n该 URL 指向由 Project Gutenberg ➊ 《罗密欧与朱丽叶》全剧的文本网页。你可以通过检查\
  \ `Response` 对象的 `status_code` 属性来判断该网页请求是否成功。如果它等于 `requests.codes.ok` 的值，则一切正常\
  \ ➋。（顺便提一下，HTTP 协议中“OK”的状态码是 200。你可能已经熟悉“未找到”的 404 状态码。）\n\n如果请求成功，下载的网页将作为一个字符串存储在\
  \ `Response` 对象的 `text` 变量中。该变量持有整个剧的大字符串；调用 `len(res.text)` 显示其长度超过了 178,000 个字符。最后，调用\
  \ `print(res.text[:250])` 只会显示前 250 个字符。\n\n## 检查错误\n\n如你所见，`Response` 对象有一个 `status_code`\
  \ 属性，可以通过与 `requests.codes.ok` 进行比较来查看下载是否成功。检查成功的更简单的方法是调用 `Response` 对象上的 `raise_for_status()`\
  \ 方法。如果下载文件出现错误，该方法将抛出一个异常；如果下载成功，则什么都不做。在交互式 shell 中输入以下内容：\n\n```\n>>> res = requests.get('http://inventwithpython.com/page_that_does_not_exist')\n\
  >>> res.raise_for_status()\nTraceback (most recent call last):\n  File \"<pyshell#138>\"\
  , line 1, in <module>\n    res.raise_for_status()\n  File \"C:\\Python34\\lib\\\
  site-packages\\requests\\models.py\", line 773, in raise_for_status\n    raise HTTPError(http_error_msg,\
  \ response=self)\nrequests.exceptions.HTTPError: 404 Client Error: Not Found\n```\n\
  \n`raise_for_status()` 方法是确保程序在发生下载下载时停止的好方法。这是一件好事：你希望程序在发生意外错误时立即停止。如果下载失败对你的程序不是致命的，你可以用\
  \ `try` 和 `except` 语句包裹 `raise_for_status()` 行，以处理这种错误情况而不导致崩溃。\n\n```\nimport requests\n\
  res = requests.get('http://inventwithpython.com/page_that_does_not_exist')\ntry:\n\
  \    res.raise_for_status()\nexcept Exception as exc:\n    print('There was a problem:\
  \ %s' % (exc))\n```\n\n此 `raise_for_status()` 方法调用会导致程序输出以下内容：\n\n```\nThere was\
  \ a problem: 404 Client Error: Not Found\n```\n\n在调用 `requests.get()` 之后始终调用 `raise_for_status()`。\n\
  \n## 将下载的文件保存到硬盘\n\n`iter_content()` 方法在每次迭代时返回内容的“块”（chunks）。每个块都是 `bytes` 类型，并且你可以指定每个块包含多少字节。十万字节通常是一个合适的大小，因此请将\
  \ `100000` 作为参数传递给 `iter_content()`。\n\n```\n>>> import requests\n>>> res = requests.get('http://www.gutenberg.org/cache/epub/1112/pg1112.txt')\n\
  >>> res.raise_for_status()\n>>> playFile = open('RomeoJuliet.txt', 'wb')\n>>> for\
  \ chunk in res.iter_content(100000):\n        playFile.write(chunk)\n\n100000\n\
  78981\n>>> playFile.close()\n```\n\n文件 `RomeoJuliet.txt` 现在将存在于当前目录下。注意，虽然网站上的文件名是\
  \ `pg1112.txt`，但你硬盘上的文件文件名不同。`requests` 模块仅负责下载网页内容。一旦网页被下载，它就是你程序中的数据。即使你在下载网页后丢失了互联网连接，所有的网页数据仍然会在你的电脑上。\n\
  \n`write()` 方法返回写入文件的字节数。在刚才的例子中，第一个块有 100,000 字节，而文件的剩余部分只需要 78,981 字节。\n\n\n\n\
  \n`requests` 模块的内容就这些了！`for` 循环和 `iter_content()` 等内容似乎比你一直用于写入文本文件时的 `open()`/`write()`/`close()`\
  \ 工作流要复杂，但这是为了确保即使在下载巨大的文件，`requests` 模块也不会占用过多的内存。你可以从*[`requests.readthedocs.org/`](http://requests.readthedocs.org/)*\
  \ 了解 `requests` 模块的其他功能。\n\n# HTML\n\n在拆解网页之前，你将学习一些 HTML 基础知识。你还将学习如何访问网络浏览器强大的开发者工具，这将使得从\
  \ Web 上爬取信息变得简单得多。\n\n## 学习 HTML 的资源\n\n*超文本标记语言 (HTML)* 是编写网页时使用的格式。本章假设你已经有一定的\
  \ HTML 基础经验，但如果你需要初学者教程，我建议以下网站之一：\n\n*   *[`htmldog.com/guides/html/beginner/`](http://htmldog.com/guides/html/beginner/)*\n\
  *   *[`www.codecademy.com/tracks/web/`](http://www.codecademy.com/tracks/web/)*\n\
  *   *[`developer.mozilla.org/en-US/learn/html/`](https://developer.mozilla.org/en-US/learn/html/)*\n\
  \n## 快速复习\n\n以防你已经很久没看过 HTML 了，这里有一个基础知识的快速概述。HTML 文件是带有 `.html` 扩展名的纯文本文件。这些文件中的文本被\
  \ `tags` 包围，标签是包含在角括号内的单词。标签告诉浏览器如何格式化网页。起始标签和结束标签可以包裹某些文本以形成一个 `element`。`text`（或\
  \ `inner HTML`）是起始标签和结束标签之间的内容。例如，以下 HTML 将在浏览器中显示 *Hello world!*，其中 *Hello* 为加粗：\n\
  \n```\n<strong>Hello</strong> world!\n```\n\n此 HTML 在浏览器中看起来像图 11-1。\n\n![浏览器中渲染的\
  \ Hello world!](img/httpatomoreillycomsourcenostarchimages2189643.png.jpg)\n\n图\
  \ 11-1. *浏览器中渲染的 Hello world!*。\n\n起始标签 `<strong>` 表示所包裹的文本将以加粗显示。结束标签 `</strong>`\
  \ 告诉浏览器加粗文本的结束位置。\n\nHTML 中有很多不同的标签。其中某些标签在角括号内具有形式为 `attributes` 的额外属性。例如，`<a>`\
  \ 标签包裹了本应该是链接的文本。文本所链接的 URL 由 `href` 属性决定。这里有一个示例：\n\n```\nAl's free <a href=\"\
  http://inventwithpython.com\">Python books</a></a>.\n```\n\n此 HTML 在浏览器中看起来像图 11-2。\n\
  \n![浏览器中渲染的链接](img/httpatomoreillycomsourcenostarchimages2189645.png.jpg)\n\n图 11-2.\
  \ 浏览器中渲染的链接。\n\n某些元素具有 `id` 属性，用于唯一标识页面中的元素。你经常会指示程序通过 `id` 属性寻找某个元素，因此使用浏览器的开发者工具确定元素的\
  \ `id` 属性是编写网页爬虫程序的常见任务。\n\n## 查看网页的源代码 HTML\n\n你需要查看程序将处理的网页的 HTML 源代码。要做到这一点，在网络浏览器中的任何网页上点击右键（或在\
  \ OS X 上按 CTRL 点击），并选择**查看源代码**或**查看页面源代码**以查看页面的 HTML 文本（参见图 11-3）。这是你的浏览器实际接收到的文本。浏览器知道如何从此\
  \ HTML 显示或*渲染*（render）网页。\n\n![查看网页源代码](img/httpatomoreillycomsourcenostarchimages2189647.png.jpg)\n\
  \n图 11-3. 查看网页源代码。\n\n我强烈建议查看你喜的一些网站的源代码。即使你在查看源代码时并不完全理解所看到的内容，也没关系。编写简单的网页爬虫程序不需要精通\
  \ HTML——毕竟，你又不是在编写自己的网站。你只需要足够的知识从现有网站中提取数据。\n\n## 打开你浏览器的开发者工具\n\n除了查看网页源代码外，你还可以使用浏览器的开发者工具查看页面的\
  \ HTML。在 Windows 的 Chrome 和 Internet Explorer 中，开发者工具已经安装好了，你可以按 `F12` 让它们出现（参见图\
  \ 11-4）。在 Chrome 中，你也可以通过选择“开发者工具”来调出它。再次按 `F12` 会会让它消失。在 Firefox 中，你可以按 `CTRL-SHIFT-C`（Windows\
  \ 和 Linux）或在 OS X 上按 `⌘-C` 打开网页检查器。在 Safari 中，打开设置，并在高级面板中勾选“在菜单栏中显示开发菜单”。启用后，你可以按\
  \ `⌘-C` 调出开发者工具。其布局与 Chrome 几乎相同。\n\n![浏览器中的开发者工具窗口](img/httpatomoreillycomsourcenostarchimages2189647.jpg.httpatomoreillycomsourcenostarchimages2189651.jpg)\n\
  \n图 11-4. 浏览器中的开发者工具窗口。\n\n## 不要使用正则表达式解析 HTML\n\n在字符串中定位特定的 HTML 片段似乎是正则表达式的完美用例。然而，我不建议你这样做。HTML\
  \ 有许多不同的格式化方式但仍然有效的 HTML，尝试用正则表达式捕获所有可能的变可能是枯燥且容易错误的。使用专门为解析 HTML 开发的模块（例如 Beautiful\
  \ Soup）将不容易产生 bug。\n\n你可以在此处找到为什么不要使用正则表达式解析 HTML 的扩展论证*[`stackoverflow.com/a/1732454/189364/`](http://stackoverflow.com/a/1732454/189364/)*。\n\
  \n\n\n\n\n![使用开发者工具检查持有温度文本的元素](img/httpatomoreillycomsourcenostarchimages2189653.png.jpg)\n\
  \n图 11-5. 使用开发者工具检查持有温度文本的元素\n\n通过开发者工具，你可以看到网页中温度部分的 HTML 是 `<p class=\"myforecast-current\
  \ -lrg\">57°F</p>`。这正是你要寻找的内容！温度信息似乎包含在一个具有 `myforecast-current-lrg` 类的 `<p>` 元素中。现在你已经知道要找什么，`BeautifulSoup`\
  \ 模块将帮助你从字符串中找到它。\n\n# 使用 BeautifulSoup 模块解析 HTML\n\nBeautiful Soup 是一个用于从 HTML\
  \ 页面提取信息的模块（对于这个目的，它比正则表达式要好得多）。`BeautifulSoup` 模块的名称为 `bs4`（代表 Beautiful Soup 第\
  \ 4 版本）。要安装它，你需要在命令行中运行 `pip install beautifulsoup4`。（有关安装第三方模块的说明，请查看附录 A。）虽然安装时使用的名称是\
  \ `beautifulsoup4`，但导入 Beautiful Soup 时运行的是 `import bs4`。\n\n在本章中，Beautiful Soup\
  \ 的示例将 `parse`（即分析并识别各个部分）硬盘上的一个 HTML 文件。在 IDLE 中打开一个新文件编辑器窗口，输入以下内容并将其保存为 `example.html`。或者，从\
  \ `[http://nostarch.com/automatestuff/]` 下载它。\n\n```\n这是一个 这是 example.html 示例文件。\
  \ -->\n\n<html><head><title>网站标题</title></head>\n<body\n<p>Download my <strong>Python</strong>\
  \ book from <a href=\"http://\ninventwithpython.com\">my website</a></a>>.</p>\n\
  <p class=\"slogan\">Learn Python the easy way!</p>\n<p>By <span id=\"author\">Al\
  \ Sweigart</span></span>></p>\n</body></html>\n```\n\n如你所见，即使是简单的 HTML 文件也涉及许多不同的标签和属性，在复杂的网站上，这些事情很快就会变得混乱。幸运的是，Beautiful\
  \ Soup 让处理 HTML 变得简单得多。\n\n## 从 HTML 创建 BeautifulSoup 对象\n\n调用 `bs4.BeautifulSoup()`\
  \ 函数时需要传入一个包含它要解析的 HTML 的字符串。`bs4.BeautifulSoup()` 函数返回的是一个 `BeautifulSoup` 对象。在电脑连接互联网时，在交互\
  \ shell 中输入以下：\n\n```\n>>> import requests, bs4\n>>> res = requests.get('http://nostarch.com')\n\
  >>> res.raise_for_status()\n>>> noStarchSoup = bs4.BeautifulSoup(res.text)\n>>>\
  \ type(noStarchSoup)\n<class 'bs4.BeautifulSoup'>\n```\n\n这段代码使用 `requests.get()`\
  \ 从 No Starch Press 网站下载主页，并将响应的 `text` 属性传递给 `bs4.BeautifulSoup()`。它返回的 `BeautifulSoup`\
  \ 对象存储在名为 `noStarchSoup` 的变量中。\n\n你也可以通过向 `bs4.BeautifulSoup()` 传递 `File` 对象从硬盘加载\
  \ HTML 文件。在交互 shell 中输入以下内容（确保 `example.html` 文件位于工作目录）：\n\n```\n>>> exampleFile\
  \ = open('example.html')\n>>> exampleSoup = bs4.BeautifulSoup(exampleFile)\n>>>\
  \ type(exampleSoup)\n<class 'bs4.BeautifulSoup'>\n```\n\n一旦你拥有了 `BeautifulSoup`\
  \ 对象，就可以使用它的方法来定位 HTML 文档的特定部分。\n\n## 使用 select() 方法查找元素\n\n你可以通过调用 `select()` 方法并传递一个要查找元素的\
  \ CSS `selector`（选择器）字符串，从 `BeautifulSoup` 对象检索网页元素。选择器类似于正则表达式：它们指定了要查找的模式，在这种情况下是在\
  \ HTML 页面而不是普通文本字符串中。\n\n关于 CSS 选择器语法的完整讨论超出了本书的范围（在 `[http://nostarch.com/automatestuff/]`\
  \ 的资源中有一个很好的选择器教程），这里是对选择器的简要介绍。表 11-2 显示了常见 CSS 选择器模式的示例。\n\n表 11-2. CSS 选择器示例\n\
  \n| 传递给 `select()` 方法的选择器 | 将匹配...\n| --- | --- |\n| `soup.select('div')` | 所有名为\
  \ `<div>` 的元素 |\n| `soup.select('#author')` | `id` 属性为 `author` 的元素 |\n| `soup.select('.notice')`\
  \ | 所有使用名为 `notice` 的 CSS `class` 属性的元素 |\n| `soup.select('div span')` | 所有位于 `<div>`\
  \ 元素内部的名为 `<span>` 的元素 |\n| `soup.select('div > span')` | 所有`直接`位于 `<div>` 元素内部且中间没有其他元素的\
  \ `<span>` 元素 |\n| `soup.select('input[name]')` | 所有具有任意值 `name` 属性的名为 `<input>`\
  \ 的元素 |\n| `soup.select('input[type=\"button\"]')` | 所有 `type` 值为 `button` 的名为 `<input>`\
  \ 的元素 |\n\n## 从元素的属性获取数据\n\n用于 `Tag` 对象的 `get()` 方法使得访问元素的属性值变得非常简单。该方法接收一个属性名称字符串并返回该属性的值。使用\
  \ `example.html`，在交互 shell 中输入以下内容：\n\n\n\n\n\n```\n>>> import bs4\n>>> soup = bs4.BeautifulSoup(open('example.html'))\n\
  >>> spanElem = soup.select('span')[0]\n>>> str(spanElem)\n'<span id=\"author\">Al\
  \ Sweigart</span>'\n>>> spanElem.get('id')\n'author'\n>>> spanElem.get('some_nonexistent_addr')\
  \ == None\nTrue\n>>> spanElem.attrs\n{'id': 'author'}\n```\n\n在这里我们使用 `select()`\
  \ 来查找所有的 `<span>` 元素，并将第一个匹配的元素存储在 `spanElem` 中。将属性名 `'id'` 传递给 `get()` 会返回属性的值\
  \ `'author'`。\n\n# 项目：“我今天很手运”Google 搜索\n\n每当我在 Google 上搜索一个主题时，我不会一次只看一个搜索结果。通过中键点击搜索结果链接（或在按住\
  \ `CTRL` 的情况下点击），我会在前几个链接在系列新标签页中打开，以便稍后阅读。我搜索 Google 的频率很高，以至于这种工作流——打开浏览器、搜索主题、然后逐一中键点击链接——变得非常繁琐。如果我能简单地在命令行输入一个搜索词，让电脑自动打开浏览器并在新标签页中显示所有顶部搜索结果就太好了。让我们写一个脚本来实现它。\n\
  \n这是你的程序实现的功能：\n\n* 从命令行参数获取搜索关键词。\n* 获取搜索结果页面。\n* 为每个结果打开一个浏览器标签页。\n\n这意味着你的代码需要执行以下操作：\n\
  \n* 从 `sys.argv` 读取命令行参数。\n* 使用 `requests` 模块获取搜索结果页面。\n* 找到指向每个搜索结果的链接。\n* 调用 `webbrowser.open()`\
  \ 函数打开网页浏览器。\n\n打开一个新的文件编辑器窗口并将其保存为 `lucky.py`。\n\n##  1：获取命令行参数并请求搜索页面\n\n在编写任何代码之前，你首先需要知道搜索结果页面的\
  \ URL。通过在 Google 搜索后查看浏览器地址栏，你可以看到结果页有一个类似于 `https://www.google.com/search?q=SEARCH_TERM_HERE`\
  \ 的 URL。`requests` 模块可以下载页面，然后你可以使用 Beautiful Soup 在 HTML 中找到搜索结果链接。最后，你将使用 `webbrowser`\
  \ 模块在浏览器标签页中打开这些链接。\n\n让你的代码看起来如下：\n\n```python\n#! python3\n# lucky.py - 打开多个 Google\
  \ 搜索结果。\n\nimport requests, sys, webbrowser, bs4\n\nprint('Googling...') # 在下载 Google\
  \ 页面时显示文本\nres = requests.get('http://google.com/search?q=' + ' '.join(sys.argv[1:]))\n\
  res.raise_for_status()\n\n# TODO: 获取顶部搜索结果链接。\n\n# TODO: 为每个结果打开一个浏览器标签页。\n```\n\
  \n用户在启动程序时将使用命令行参数指定搜索词。这些参数将作为字符串存储在 `sys.argv` 列表中。\n\n## 2：找到所有结果\n\n现在，你需要使用\
  \ Beautiful Soup 从下载的 HTML 中提取顶部的搜索结果链接。但你如何为这项工作找到正确的选择器呢？例如，你不能只搜索所有的 `<a>` 标签，因为\
  \ HTML 中有很多你不关心的链接。相反，你必须使用浏览器的开发者工具检查搜索结果页面，尝试找到一个只选出你想要的链接的选择器。\n\n在 Google 上搜索\
  \ *Beautiful Soup* 之后，你可以打开浏览器的开发者工具并检查页面上的一些链接元素。它们看起来极其复杂，类似于这样：`<a href=\"/url?sa\
  \ =t&amp;rct=j&amp;q=&amp;esrc=s&amp;source=web&amp;cd=1&amp;cad=rja&amp;uact=8&\
  \ amp;ved=0CCgQFjAA&amp;url=http%3A%2F%2Fwww.crummy.com%2Fsoftware%2FBeautifulSoup\
  \ %2F&amp;ei=LHBVU_XDD9KVyAShmYDwCw&amp;usg=AFQjCNHAxwplurFOBqg5cehWQEVKi-TuLQ&a\
  \ mp;sig2=sdZu6WVlBlVSDrwhtworMA\" onmousedown=\"return rwt(this,'','','','1','AFQ\
  \ jCNHAxwplurFOBqg5cehWQEVKi-TuLQ','sdZu6WVlBlVSDrwhtworMA','0CCgQFjAA','','',ev\
  \ ent)\" data-href=\"http://www.crummy.com/software/BeautifulSoup/\"><em>Beautiful\
  \ Soup</em>: We called him Tortoise because he taught us.</a>`。\n\n元素看起来极其复杂并没有关系。你只需要找到所有搜索结果链接都具有的模式。但是这个\
  \ `<a>` 元素并没有什么容易将其与页面上非搜索结果的 `<a>` 元素区分开来。\n\n让你的代码看起来如下：\n\n```python\n#! python3\n\
  # lucky.py - 打开多个 google 搜索结果。\n\nimport requests, sys, webbrowser, bs4\n\n--snip--\n\
  \n# 获取顶部搜索结果链接。\nsoup = bs4.BeautifulSoup(res.text, 'html.parser')\n\n# 为每个结果打开一个浏览器标签页。\n\
  linkElems = soup.select('a')\n```\n\n## 3：为每个结果打开浏览器\n\n最后，我们将告诉程序打开标签。在你的程序中添加以下内容：\n\
  \n```python\n#! python3\n# lucky.py - 打开多个 google 搜索结果。\n\nimport requests, sys,\
  \ webbrowser, bs4\n\n--snip--\n\n# 为每个结果打开一个浏览器标签页。\nlinkElems = soup.select('a')\n\
  numOpen = min(5, len(linkElems))\nfor i in range(numOpen):\n    webbrowser.open('http://google.com'\
  \ + linkElems[i].get('href'))\n```\n\n默认情况下，我们使用 `webbrowser` 模块打开五个结果。然而，用户可能搜索了少于五个结果的内容。`soup.select()`\
  \ 调用返回所有元素的列表，因此你想打开的标签数量是 `5` 或该列表的长度。\n\n内置函数 `min()` 返回它接收的整数或浮点数参数的最小值（还有一个\
  \ `max()` 函数返回它接收的最大参数）。你可以使用 `min()` 来判断是否少于五个，并将结果存储在变量 `numOpen` 中。然后，你可以通过调用\
  \ `range(numOpen)` 来运行 `for` 循环。\n\n在每次迭代中，我们使用 `webbrowser.open()` 在浏览器中打开新标签页。注意，返回的\
  \ `<a>` 元素的 `href` 属性值不包含 `http://google.com` 部分，所以你需要将其拼接上去。\n\n现在你可以通过在命令行运行 `lucky\
  \ python programming tutorials` 来立即打开 *Python 教程* 的前五个 Google 结果！（参见附录 B 查看如何在操作系统上轻松运行程序）。\n\
  \n## 类似程序的想法\n\n标签页浏览的好处是你可以轻松地在新标签页中打开链接以便以后浏览。一个一次性打开多个链接的程序可以作为执行以下操作的快捷方式：\n\
  \n* 在亚马逊等购物网站搜索后打开所有产品页面\n* 打开某个产品的所有评论链接\n* 在 Flickr 或 Imgur 等照片网站搜索后打开照片结果链接\n\
  \n# 项目：下载所有 XKCD 漫画\n\n博客和其他定期更新的网站通常有一个包含最新文章的首页，页面上还有一个“上一个”按钮可以带你进入上一篇文章。该文章也有“上一个”按钮，以此类推，形成一条从最新文章到网站第一篇文章的轨迹。如果你想在离线时拥有网站内容的副本进行阅读，可以手动导航到每一个页面并保存。但这是一个很无聊的工作，所以让我们写一个程序来代替吧。\n\
  \n\n\n\nXKCD 是一种受欢迎的极客网络漫画，其网站符合这种结构（参见图 11-6”）。`[`xkcd.com/`](http://xkcd.com/)`\
  \ 首页有一个 `Prev` 按钮，引导用户返回之前的漫画。手动下载每一部漫画将花费无尽的时间，但你可以编写一个脚本在几分钟内完成任务。\n\n以下是你的程序的功能：\n\
  \n* 加载 XKCD 主页。\n* 保存该页面上的漫画图像。\n* 点击“上一个漫画”链接。\n* 重复此过程直到到达第一部漫画。\n\n![XKCD, “关于浪漫、讽刺、数学和语言的网络漫画”](img/httpatomoreillycomsourcenostarchimages2189655.png.jpg)\n\
  \n图 11-6. XKCD，“关于浪漫、讽刺、数学和语言的网络漫画”\n\n这意味着你的代码需要执行以下操作：\n\n* 使用 `requests` 模块下载页面。\n\
  * 使用 Beautiful Soup 找到页面中漫画图像的 URL。\n* 使用 `iter_content()` 下载并将漫画图像保存到硬盘。\n* 找到“上一个漫画”链接的\
  \ URL 并重复。\n\n打开一个新的文件编辑器窗口并将其保存为 `downloadXkcd.py`。\n\n## 第 1 步：设计程序\n\n如果你打开浏览器的开发者工具并检查页面元素，你会发现以下内容：\n\
  \n* 漫画图像文件的 URL 由 `<<img>>` 元素的 `href` 属性提供。\n* `<<img>>` 元素位于 `<div id=\"comic\"\
  >` 元素内部。\n* `Prev` 按钮有一个值为 `prev` 的 HTML 属性 属性。\n* 第一部漫画的 `Prev` 按钮链接到 `[`xkcd.com/#`](http://xkcd.com/#)`\
  \ URL，表示没有更多之前的页面了。\n\n让你的代码看起来如下所示：\n\n```python\n#! python3\n# downloadXkcd.py\
  \ - 下载每一部 XKCD 漫画。\n\nimport requests, os, bs4\n\nurl = 'http://xkcd.com'      \
  \        #起始 url\nos.makedirs('xkcd', exist_ok=True)   # 将漫画存储在 ./xkcd\nwhile not\
  \ url.endswith('#'):\n    # TODO: 下载页面。\n\n    # TODO: 找到漫画图像的 URL。\n\n    # TODO:\
  \ 下载图像。\n\n    # TODO: 将图像保存到 ./xkcd。\n\n    # TODO: 获取 Prev 按钮的 url。\n\nprint('Done.')\n\
  ```\n\n你有一个 `url` 变量，它的初始值为 `'http://xkcd.com'`，并反复（在 `for` 循环中）更新它为当前页面 `Prev`\
  \ 链接的 URL。在循环的每一步，你都会下载 `url` 处的漫画。当 `url` 以 `'#'` 结尾时，你就知道结束循环了。\n\n你将图像文件下载到当前工作目录下名为\
  \ `xkcd` 的文件夹中。`os.makedirs()` 调用确保了该文件夹存在，而 `exist_ok=True` 关键字参数防止了函数在文件夹已存在时抛出异常。代码的其他部分只是概述你程序其余部分的注释。\n\
  \n## 第 2 步：下载网页\n\n让我们实现下载页面的代码。让你的代码看起来如下：\n\n```python\n#! python3\n# downloadXkcd.py\
  \ - 下载每一部 XKCD 漫画。\n\nimport requests, os, bs4\n\nurl = 'http://xkcd.com'      \
  \        #起始 url\nos.makedirs('xkcd', exist_ok=True)   # 将漫画存储在 ./xkcd\nwhile not\
  \ url.endswith('#'):\n    # 下载页面。\n    print('正在下载页面 %s...' % url)\n    res = requests.get(url)\n\
  \    res.raise_for_status()\n\n    soup = bs4.BeautifulSoup(res.text)\n\n    # TODO:\
  \ 找到漫画图像的 URL。\n\n    # TODO: 下载图像。\n\n    # TODO: 将图像保存到 ./xkcd。\n\n    # TODO:\
  \ 获取 Prev 按钮的 url。\n\nprint('Done.')\n```\n\n首先，打印 `url`，让用户知道程序准备下载哪个 URL；然后使用\
  \ `requests` 模块的 `request.get()` 函数下载它。像既往一样，你立即调用 `Response` 对象的 `raise_for_status()`\
  \ 方法，如果下载过程中出现问题，则抛出异常并结束程序。否则，你从下载的面的文本创建一个 `BeautifulSoup` 对象。\n\n## 第 3 步：查找并下载漫画图像\n\
  \n让你的代码看起来如下：\n\n```python\n#! python3\n# downloadXkcd.py - 下载每一部 XKCD 漫画。\n\nimport\
  \ requests, os, bs4\n\n--snip--\n\n    # 找到漫画图像的 URL。\n    comicElem = soup.select('#comic\
  \ img')\n    if comicElem == []:\n         print('未找到漫画图像。')\n    else:\n      \
  \   comicUrl = comicElem[0].get('src')\n         # 下载图像。\n         print('正在下载图像\
  \ %s...' % (comicUrl))\n         res = requests.get(comicUrl)\n         res.raise_for_status()\n\
  \n    # TODO: 将图像保存到 ./xkcd。\n\n    # TODO: 获取 Prev 按钮的 url。\n\nprint('Done.')\n\
  ```\n\n## 第 4 步：保存图像并查找漫画\n\n让你的代码看起来如下：\n\n```python\n#! python3\n# downloadXkcd.py\
  \ - 下载每一部 XKCD 漫画。\n\nimport requests, os, bs4\n\n--snip--\n\n        # 将图像保存到 ./xkcd。\n\
  \        imageFile = open(os.path.join('xkcd', os.path.basename(comicUrl)), 'wb')\n\
  \        for chunk in res.iter_content(100000):\n            imageFile.write(chunk)\n\
  \        imageFile.close()\n\n    # 获取 Prev 按钮的 url。\n    prevLink = soup.select('a[rel=\"\
  prev\"]')[0]\n    url = 'http://xkcd.com' + prevLink.get('href')\n\nprint('Done.')\n\
  ```\n\n\n\n```\nDownloading page http://xkcd.com...\nDownloading image http://imgs.xkcd.com/comics/phone_alarm.png...\n\
  Downloading page http://xkcd.com/1358/...\nDownloading image http://imgs.xkcd.com/comics/nro.png...\n\
  Downloading page http://xkcd.com/1357/...\nDownloading image http://imgs.xkcd.com/comics/free_speech.png...\n\
  Downloading page http://xkcd.com/1356/...\nDownloading image http://imgs.xkcd.com/comics/orbital_mechanics.png...\n\
  Downloading page http://xkcd.com/1355/...\nDownloading image http://imgs.xkcd.com/comics/airplane_message.png...\n\
  Downloading page http://xkcd.com/1354/...\nDownloading image http://imgs.xkcd.com/comics/heartbleed_explanation.png...\n\
  --snip--\n```\n\n该项目是一个很好的程序示例，它可以通过自动跟随链接来从 Web 上抓取大量数据。你可以从 Beautiful Soup 的文档中了解它的其他功能：`[`www.crummy.com/software/BeautifulSoup/bs4/doc/`](http://www.crummy.com/software/BeautifulSoup/bs4/doc/)`。\n\
  \n## 类似程序的设想\n\n下载页面和跟随链接是许多爬虫程序的基础。类似的程序还可以执行以下操作：\n\n*   通过跟随所有链接来备份整个网站。\n* \
  \  复制网络论坛上的所有消息。\n*   复制在线商店中销售商品的目录。\n\n只要你能弄出需要传递给 `requests.get()` 的 URL，`requests`\
  \ 和 `BeautifulSoup` 模块就是非常棒的。然而，有时这些 URL 并不容易找到。或者，你想让程序导航的网站可能要求你先登录。`selenium`\
  \ 模块将赋予你的程序执行此类复杂任务的能力。\n\n# 使用 selenium 模块控制浏览器\n\n`selenium` 模块允许 Python 通过程序化点击链接和填写登录信息来直接控制浏览器，几乎就像有一个人类用户与页面交互一样。Selenium\
  \ 允许你以比 Requests 和 Beautiful Soup 高得多的方式与网页交互；但因为它启动了 浏览器，所以速度会慢一些，而且如果你只需要从 Web\
  \ 上下载一些文件，它很难在后台运行。\n\n附录 A 有关于安装第三方模块的更详细步骤。\n\n## 启动由 Selenium 控制的浏览器\n\n对于这些示例，你需要\
  \ Firefox 浏览器。这将由你控制的浏览器。如果你还没有 Firefox，可以从 `[`getfirefox.com/`](http://getfirefox.com/)`\
  \ 免费下载。\n\n导入 Selenium 模块稍微有点复杂。你不需要运行 `import selenium`，而是需要运行 `from selenium import\
  \ webdriver`。（`selenium` 模块这样设置的具体原因超出了本书的范围。）之后，你可以用 Selenium 启动 Firefox 浏览器。在交互式\
  \ shell 中输入以下内容：\n\n```\n>>> from selenium import webdriver\n>>> browser = webdriver.Firefox()\n\
  >>> type(browser)\n<class 'selenium.webdriver.firefox.webdriver.WebDriver'>\n>>>\
  \ browser.get('http://inventwithpython.com')\n```\n\n你会注意到当调用 `webdriver.Firefox()`\
  \ 时，Firefox 浏览器会启动。对值 `webdriver.Firefox()` 调用 `type()` 可以揭示它是 `WebDriver` 数据类型。而调用\
  \ `browser.get('http://inventwithpython.com')` 会将浏览器导向 `[`inventwithpython.com/`](http://inventwithpython.com/)`。你的浏览器看起来应该像\
  \ 图 11-7 和 get() 后，Firefox 浏览器出现了。\")。\n\n![在 IDLE 中调用 webdriver.Firefox() 和 get()\
  \ 后，Firefox 浏览器出现了。](img/httpatomoreillycomsourcenostarchimages2189657.png.jpg)\n\
  \n图 11-7。在 IDLE 中调用 `webdriver.Firefox()` 和 `get()` 后，Firefox 浏览器出现了。\n\n## 在页面上查找元素\n\
  \n`WebDriver` 对象拥有许多用于在页面查找元素的方法。它们被分为 `find_element_*` 和 `find_elements_*` 方法。`find_element_*`\
  \ 方法返回单个 `WebElement` 对象，代表页面上匹配你查询的第一个元素。`find_elements_*` 方法返回一个 `WebElement_*`\
  \ 对象的列表，对应页面上*每一个*匹配的元素。\n\n表 11-3 显示了在存储在变量 `browser` 中的 `WebDriver` 对象上调用 `find_element_*`\
  \ 和 `find_elements_*` 方法的几个示例。\n\n表 11-3. Selenium 用于查找元素的 `WebDriver` 方法\n\n| 方法名\
  \ | 返回的 WebElement 对象/列表 |\n| --- | --- |\n| | |\n```\nbrowser.find_element_by_class_name(name)\n\
  browser.find_elements_by_class_name(name)\n``` | 使用 CSS 类 `name` 的元素 |\n| | |\n\
  ```\nbrowser.find_element_by_css_selector(selector)\nbrowser.find_elements_by_css_selector(selector)\n\
  ``` | 匹配 `selector` 的元素 |\n| | |\n```\nbrowser.find_element_by_id(id)\nbrowser.find_elements_by_id(id)\n\
  ``` | 匹配 `id` 的元素 |\n| | |\n```\nbrowser.find_element_by_link_text(text)\nbrowser.find_elements_by_link_text(text)\n\
  ``` | 完全匹配 `text` 的元素 |\n| | |\n```\nbrowser.find_element_by_partial_link_text(text)\n\
  browser.find_elements_by_partial_link_text(text)\n``` | 包含 `text` 的元素 |\n| | |\n\
  ```\nbrowser.find_element_by_name(name)\nbrowser.find_elements_by_name(name)\n```\
  \ | 匹配 `name` 属性的元素 |\n| | |\n```\nbrowser.find_element_by_tag_name(name)\nbrowser.find_elements_by_tag_name(name)\n\
  ``` | 匹配标签名 `name` |\n\n除了 `*_by_name()` 方法外，所有方法的参数都是区分大小写的。如果页面上不存在匹配查找内容的元素，`selenium`\
  \ 模块会抛出 `NoSuchElement` 异常。如果你不想让这个异常导致程序，请在代码中添加 `try` 和 `except` 语句。\n\n一旦有了 `WebElement`\
  \ 对象，你可以可以通过表 11-4 中的属性或调用方法来获取它的更多信息。\n\n表 11-4. WebElement 的属性和方法\n\n| 属性或方法 |\
  \ 描述 |\n| --- | --- |\n| `tag_name` | 标签名，例如 <a> 元素的 `'a'` |\n| `get_attribute(name)`\
  \ | 元素的 `name` 属性的值 |\n| `text` | 元素内的文本，例如 `<span>hello</span>` 中的 `'hello'` |\n\
  | `clear()` | 对于文本字段或文本区域元素，清除输入的文本 |\n| `is_displayed()` | 如果元素可见则返回 `True`，否则返回\
  \ `False` |\n| `is_enabled()` | 对于输入元素，如果元素可用则返回 `True`，否则返回 `False` |\n| `is_selected()`\
  \ | 对于复选框或单选按钮，如果被选中则返回 `True`，否则返回 `False` |\n| `location` | 包含 `'x'` 和 `'y'` 键的字典，表示元素在页面上的位置\
  \ |\n\n例如，打开一个新的文件编辑器并输入以下程序：\n\n```\nfrom selenium import webdriver\nbrowser =\
  \ webdriver.Firefox()\nbrowser.get('http://inventwithpython.com')\ntry:\n    elem\
  \ = browser.find_element_by_class_name('bookcover')\n    print('Found <%s> element\
  \ with that class name!' % (elem.tag_name))\nexcept:\n    print('Was not able to\
  \ find an element with that name.')\n```\n\n在这里我们打开 Firefox 并引导到 URL。在这个页面上，我们尝试查找类名为\
  \ `'bookcover'` 的元素，如果找到了这样的元素，我们就使用 `tag_name` 属性打印它的标签名。如果没有找到这样的元素，我们就会打印一条不同的消息。\n\
  \n该程序将输出以下内容：\n\n```\nFound <img> element with that class name!\n```\n\n\n\n\n我们找到了一个类名为\
  \ `'bookcover'` 标签名为 `'img'` 的元素。\n\n## 点击页面\n\n从 `find_element_*` 和 `find_elements_*`\
  \ 方法返回的 `WebElement` 对象具有 `click()` 方法，该方法可以模拟对该元素进行鼠标点击。此方法可用于跟随链接、在单选按钮上进行选择、点击提交按钮，或触发鼠标点击元素时可能发生的任何其他操作。例如，在交互式\
  \ shell 中输入以下内容：\n\n```\n>>> from selenium import webdriver\n>>> browser = webdriver.Firefox()\n\
  >>> browser.get('http://inventwithpython.com')\n>>> linkElem = browser.find_element_by_link_text('Read\
  \ It Online')\n>>> type(linkElem)\n<class 'selenium.webdriver.remote.webelement.WebElement'>\n\
  >>> linkElem.click() # 点击 \"Read It Online\" 链接\n```\n\n这将打开 Firefox 访问 `http://inventwithpython.com/`，获取文本为\
  \ `Read It Online` 的 `<a>` 元素的 `WebElement` 对象，然后模拟点击该 `<a>` 元素。这就像你自己点击该链接一样；浏览器随后会跟随该链接。\n\
  \n## 填写和提交表单\n\n向网页上的文本框发送按键只需找到该文本框的 `<input>` 或 `<textarea>` 元素，然后调用 `send_keys()`\
  \ 方法。例如，在交互式 shell 中输入以下内容：\n\n```\n>>> from selenium import webdriver\n>>> browser\
  \ = webdriver.Firefox()\n>>> browser.get('http://gmail.com')\n>>> emailElem = browser.find_element_by_id('Email')\n\
  >>> emailElem.send_keys('not_my_real_email@gmail.com')\n>>> passwordElem = browser.find_element_by_id('Passwd')\n\
  >>> passwordElem.send_keys('12345')\n>>> passwordElem.submit()\n```\n\n只要 Gmail\
  \ 自此书出版以来没有更改用户名密码文本框的 `id`，之前的代码将用提供的文本填充这些文本框。（你可以随时使用浏览器的检查器来验证 `id`。）在在任何元素上调用\
  \ `submit()` 方法产生的结果与点击该元素所在表单的提交按钮相同。（你完全可以同样地调用 `emailElem.submit()`，代码的效果也是样的。）\n\
  \n## 发送特殊按键\n\nSelenium 有一个键盘按键模块，用于处理无法输入字符串值中的按键，其功能类似于转义字符。这些值存储在 `selenium.webdriver.common.keys`\
  \ 模块的属性中。由于模块名称非常长，在程序顶部运行 `from selenium.webdriver.common.keys import Keys` 要容易得多；如果你这样做了，就可以在任何需要编写\
  \ `selenium.webdriver.common.keys` 的地方简单地写 `Keys`。表 11-5 列出了常用的 `Keys` 变量。\n\n表\
  \ 11-5. `selenium.webdriver.common.keys` 模块中常用的变量\n\n| 属性 | 含义 |\n| --- | --- |\n\
  | `Keys.DOWN`, `Keys.UP`, `Keys.LEFT`, `Keys.RIGHT` | 键盘方向方向键 |\n| `Keys.ENTER`,\
  \ `Keys.RETURN` | 回车键和 Return 键 |\n| `Keys.HOME`, `Keys.END`, `Keys.PAGE_DOWN`,\
  \ `Keys.PAGE_UP` | `home`、`end`、`pagedown` 和 `pageup` 键 |\n| `Keys.ESCAPE`, `Keys.BACK_SPACE`,\
  \ `Keys.DELETE` | ESC、BACKSPACE 和 DELETE 键 |\n| `Keys.F1`, `Keys.F2`,..., `Keys.F12`\
  \ | 键盘顶部的 F1 到 F12 键 |\n| `Keys.TAB` | TAB 键 |\n\n例如，如果光标当前不在文本框中，按下 HOME 和 END\
  \ 键将分别滚动滚动到页面顶部和底部。在交互式 shell 中输入以下内容，注意 `send_keys()` 调用是如何滚动页面的：\n\n```\n>>> from\
  \ selenium import webdriver\n>>> from selenium.webdriver.common.keys import Keys\n\
  >>> browser = webdriver.Firefox()\n>>> browser.get('http://nostarch.com')\n>>> htmlElem\
  \ = browser.find_element_by_tag_name('html')\n>>> htmlElem.send_keys(Keys.END) \
  \    # 滚动到底部\n>>> htmlElem.send_keys(Keys.HOME)    # 滚动到顶部\n```\n\n`<html>` 标签是\
  \ HTML 文件的基础标签：HTML 文件的完整内容包含在 `<html>` 和 `</html>` 标签之间。调用 `browser.find_element_by_tag_name('html')`\
  \ 是向通用网页发送按键的好地方。如果例如，当你滚动到页面底部时加载了新内容时，这将会很有用。\n\n## 点击浏览器按钮\n\nSelenium 可以通过以下方法模拟各种浏览器按钮的点击：\n\
  \n* `browser.back()`。点击后退按钮。\n* `browser.forward()`。点击前进按钮。\n* `browser.refresh()`。点击刷新按钮。\n\
  * `browser.quit()`。点击关闭按钮。\n\n## 关于 Selenium 的更多信息\n\nSelenium 的功能远超这里描述的内容。它可以修改你浏览器的\
  \ cookies、截屏、运行 JavaScript。要了解更多关于这些功能，可以访问 selenium-python.org/。\n\n## 总结\n\n大多数任务并不限于计算机上的文件。为了自动化任何基于网页的任务，你需要直接控制浏览器。`selenium`\
  \ 模块允许你登录并填写表单。\n\n## 练习题\n\n| |\n| --- |\n| 1. 简述 `webbrowser`、`requests`、`BeautifulSoup`\
