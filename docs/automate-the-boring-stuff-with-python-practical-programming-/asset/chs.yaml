  \    if spam > 5:\n        print('bacon')\n    else:\n        print('ham')\n   \
  \ print('spam')\nprint('spam')\n```\n| Q: | 9\\. 编写代码：如果 `spam` 中存储的是 `1`，则打印 `Hello`；如果\
  \ `spam` 中存储的是 `2`，则打印 `Howdy`；如果 `spam` 中存储的是其他内容，则打印 `Greetings!` |\n| Q: | 10\\\
  . 如果你的程序卡在无限循环中，你可以按什么键？ |\n| Q: | 11\\. `break` 和 `continue` 的区别是什么？ |\n| Q: |\
  \ 12\\. 在 `for` 循环中，`range(10)`、`range(0, 10)` 和 `range(0, 10, 1)` 的区别是什么？ |\n|\
  \ Q: | 13\\. 编写一个短程序，使用 `for` 循环打印数字 `1` 到 `10`。然后编写一个等效程序，使用 `while` 循环打印数字 `1`\
  \ 到 `10`。 |\n| Q: | 14\\. 如果你在名为 `spam` 的模块内部有一个名为 `bacon()` 的函数，在导入 `spam` 后你会如何调用它？**额外加分：**\
  \ 在互联网上查找 `round()` 和 `abs()` 函数，并找出它们的作用。在交互式外壳中尝试它们。 |\n\n# 第 3 章 函数\n\n你已经熟悉前几章节中的\
  \ `print()`、`input()` 和 `len()` 函数。Python 提供了许多类似的内置函数，但你也可以编写自己的函数。`函数` 就像程序内部的一个微程序。\n\
  \n为了更好地理解函数如何工作，让我们创建一个。在文件编辑器中输入此程序并将其保存为 `helloFunc.py`：\n\n```python\n➊ def hello():\n\
  ➋     print('Howdy!')\n```\n（注：提供的源代码在此处中断/损坏，我已根据可用文本进行了格式调整。）*\n\n\n\n\n这类似于程序终止时程序变量被遗忘的情况。我将在本章之后讨论函数的局部作用域（local\
  \ scope）时，详细解释为什么会发生这种情况。\n\n## 返回值与 return 语句\n\n当你调用 `len()` 函数并向它传递如 `'Hello'`\
  \ 这样的参数时，函数调用会被求值为整数值 `5`，这就是你传递的字符串的长度。通常情况下，函数调用求值的结果被称为函数的**返回值**（return value）。\n\
  \n当使用 `def` 语句创建函数时，你可以通过 `return` 语句来指定返回值应该是什么。`return` 语句由以下部分组成：\n\n*  `return`\
  \ 关键字\n* 函数应该返回的值或表达式\n\n当在 `return` 语句中使用表达式时，返回值就是该表达式求值的结果。例如，下面的程序定义了一个函数，它根据传入的参数数字返回不同的字符串。将此代码输入到文件编辑器并保存为\
  \ `magic8Ball.py`：\n\n```python\n➊ import random\n➋ def getAnswer(answerNumber):\n\
  ➌     if answerNumber == 1:\n           return 'It is certain'\n       elif answerNumber\
  \ == 2:\n           return 'It is decidedly so'\n       elif answerNumber == 3:\n\
  \           return 'Yes'\n       elif answerNumber == 4:\n           return 'Reply\
  \ hazy try again'\n       elif answerNumber == 5:\n           return 'Ask again\
  \ later'\n       elif answerNumber == 6:\n           return 'Concentrate and ask\
  \ again'\n       elif answerNumber == 7:\n           return 'My reply is no'\n \
  \      elif answerNumber == 8:\n           return 'Outlook not so good'\n      \
  \ elif answerNumber == 9:\n           return 'Very doubtful'\n\n➍ r = random.randint(1,\
  \ 9)\n➎ fortune = getAnswer(r)\n➏ print(fortune)\n```\n\n当此程序启动时，Python 首先导入 `random`\
  \ 模块 ➊。接着定义了 `getAnswer()` 函数 ➋。因为正在定义函数（而不是调用它），执行过程会跳过其内部的代码。接下来，调用了 `random.randint()`\
  \ 函数并传入了两个参数 `1` 和 `9` ➍。它求值为 `1` 到 `9` 之间的随机整数（包括 `1` 和 `9` 本身），该值被存储在名为 `r` 的变量中。\n\
  \n使用 `r` 作为参数调用 `getAnswer()` 函数 ➎。程序执行移动到 `getAnswer()` 函数的顶部 ➌，值 `r` 被存储在名为 `answerNumber`\
  \ 的参数中。然后，根据 `answerNumber` 中的此值，函数返回多个可能的字符串值之一。程序执行返回到程序底部最初调用 `getAnswer()` 的一行\
  \ ➎。返回的字符串被赋值给名为 `fortune` 的变量，然后该变量被传递给 `print()` 调用 ➏ 并打印到屏幕上。\n\n注意，由于你可以将返回值作为参数传递给另一个函数调用，你可以缩短这三行代码：\n\
  \n```python\nr = random.randint(1, 9)\nfortune = getAnswer(r)\nprint(fortune)\n\
  ```\n\n简化为这一行等效代码：\n\n```python\nprint(getAnswer(random.randint(1, 9)))\n```\n\n\
  记住，表达式是由值和运算符组成的。函数调用可以用于表达式中，因为会被求值为它的返回值。\n\n## None 值\n\n在 Python 中有一个名为 `None`\
  \ 的值，代表值的缺失。`None` 是 `NoneType` 数据类型的唯一值。（其他编程语言可能将此值称为 `null`、`nil` 或 `undefined`。）就像布尔值\
  \ `True` 和 `False` 一样，`None` 必须大大写字母 `N`。\n\n当你需要在变量中存储某些不会被误认为是真实值时，这种“没有值的值”非常有帮助。`None`\
  \ 的用法之一是 `print()` 的返回值。`print()` 函数在屏幕上显示文本，但不需要像 `len()` 或 `input()` 那样返回任何内容。但由于所有函数调用都需要求值为返回值，`print()`\
  \ 返回 `None`。要查看演示，请在交互式 shell 中输入以下内容：\n\n```python\n>>> spam = print('Hello!')\n\
  Hello!\n>>> None == spam\nTrue\n```\n\n在底层，Python 会在任何没有 `return` 语句的函数定义最后添加 `return\
  \ None`。这类似于 `while` 或 `for` 循环隐式以 `continue` 语句结束。此外，如果你使用不带值的 `return` 语句（即只有\
  \ `return` 关键字本身），则返回 `None`。\n\n## 关键字参数与 print()\n\n大多数参数通过它们在函数调用中的位置来识别。例如，`random.randint(1,\
  \ 10)` 与 `random.randint(10, 1)` 不同。函数调用 `random.randint(1, 10)` 将返回 1 到 10 之间的随机整数，因为第一个参数是范围的低端，第二个参数是高端（而\
  \ `random.randint(10, 1)` 会导致错误）。\n\n然而，**关键字参数**通过函数调用中放在它们前面的关键字来识别。关键字参数通常用于可选参数。例如，`print()`\
  \ 函数拥有可选参数 `end` 和 `sep`。\n\n如果你运行以下代码：\n\n```python\nprint('Hello')\nprint('World')\n\
  ```\n\n输出将是：\n\n```\nHello\nWorld\n```\n\n`print()` 函数会自动在字符串末尾添加换行符。然而，你可以设置 `end`\
  \ 关键字参数来改变这一点。例如，如果你使用：\n\n```python\nprint('Hello', end='')\nprint('World')\n```\n\
  \n输出将是：\n\n```\nHelloWorld\n```\n\n同样，当你向 `print()` 传递多个字符串值时，函数将用单个空格将它们分隔。在交互式\
  \ shell 中输入以下：\n\n```python\n>>> print('cats', 'dogs', 'mice')\ncats dogs mice\n\
  ```\n\n但你可以通过传递 `sep` 关键字参数来替换默认分隔字符串。在交互式 shell 中输入：\n\n```python\n>>> print('cats',\
  \ 'dogs', 'mice', sep=',')\ncats,dogs,mice\n```\n\n你也可以为你编写的函数添加关键字参数，但你首先需要学习列表和字典数据类型。现在只需知道某些函数具有可选参数。\n\
  \n## 局部作用域与全局作用域\n\n在调用函数赋值的参数和变量被认为存在于函数的局部作用域（local scope）。在所有函数外部赋值的变量被认为存在于全局作用域（global\
  \ scope）。存在于局部作用域的变量被称为**局部变量**（local variable），而存在于全局作用域的变量被称为**全局变量**（global variable）。变量必须是其中之一；不能既是局部的又是全局的。\n\
  \n将*作用域*视为变量的容器。当作用域销毁时，存储在作用域变量中的所有值都会被遗忘。只有一个全局作用域，它在程序开始时创建。当程序终止时，全局作用域被销毁，其所有变量都会被遗忘。否则，下次你运行程序时，变量将记住它们上次运行时的值。\n\
  \n每当调用函数时，都会创建一个局部作用域。在该函数中赋值的任何变量都在该作用域内。当函数返回时，局部作用域被销毁，这些变量会被遗忘。当你下次调用此函数时，局部变量将不会记住上次调用函数时存储在它们中的值。\n\
  \n\n\n\n作用域非常重要，原因有几个：\n\n- 全局作用域中的代码不能使用任何局部变量。\n- 然而，局部作用域可以访问全局变量。\n- 函数局部作用域中的代码不能使用其他局部作用域中的变量。\n\
  - 如果变量在不同的作用域中，你可以对它们使用相同的名称。也就是说，可以有一个名为 `spam` 的局部变量，同时也存在一个名为 `spam` 的全局变量。\n\
  \nPython 拥有不同作用域而不是将所有内容都变为全局变量的原因是：这样当变量被特定函数调用中的代码修改时，该函数仅通过其参数和返回值与程序的其余部分进行交互。这缩小了可能导致错误的代码行范围。如果你的程序只包含全局变量，并且因为某个变量被设置了错误的值而产生错误，那么将很难追踪这个错误值是在哪里被设置的。它可能在程序的任何地方被设置过——而你的程序可能有成百上上千行代码！但如果错误是因为某个局部变量具有错误值，你就知道只有该函数中的代码可能错误地设置了它。\n\
  \n虽然在小型程序中使用全局变量没有问题，但随着程序变得越来越大，依赖全局变量是一个坏习惯。\n\n### 局部变量无法在全局作用域中使用\n\n考虑这个程序，当你运行它时会导致错误：\n\
  \n```\ndef spam():\n    eggs = 31337\nspam()\nprint(eggs)\n```\n\n如果你运行这个程序，输出将如下：\n\
  \n```\nTraceback (most recent call last):\n  File \"C:/test3784.py\", line 4, in\
  \ <module>\n    print(eggs)\nNameError: name 'eggs' is not defined\n```\n\n错误发生是因为\
  \ `eggs` 变量只存在调用 `spam()` 时创建的局部作用域中。一旦程序执行从 `spam` 返回，该局部作用域就会被销，不再存在名为 `eggs`\
  \ 的变量。因此，当你的程序尝试运行 `print(eggs)` 时，Python 会给你一个错误说 `eggs` 未定义。如果你仔细考虑，这是合理的；当程序执行在全局作用域中时，不存在局部作用域，因此不存在任何局部变量。这就是为什么只有全局变量可以在全局作用域中使用。\n\
  \n## 局部作用域无法使用其他局部作用域中的变量\n\n每当调用函数时，都会创建一个新的局部作用域，包括从另一个函数调用函数时。考虑这个程序：\n\n```python\n\
  \ def spam():\n    eggs = 99\n    bacon()\n    print(eggs)\n\n  def bacon():\n \
  \     ham = 101\n      eggs = 0\n\n spam()\n```\n\n当程序启动时，调用 `spam()` 函数并创建了一个局部作用域。局部变量\
  \ `eggs` 被设置为 `99`。然后调用 `bacon()` 函数，创建了第二个局部作用域。多个局部作用域可以同时存在。在这个新的局部作用域中，局部变量\
  \ `ham` 被设置为 `101`，局部变量 `eggs`（与 `spam()` 局部作用域中的那个不同）也被创建并设置为 `0`。\n\n当 `bacon()`\
  \ 返回时，该调用的局部作用域被销毁。程序执行继续 `spam()` 函数中打印 `eggs` 的值，由于此处调用 `spam()` 的局部作用域仍然存在，`eggs`\
  \ 变量被设置为 `99`。这就是程序打印的内容。\n\n结论是，一个函数中的局部变量与另一个函数中的局部变量是完全独立的。\n\n## 全局变量可以在局部作用域中读取\n\
  \n考虑以下程序：\n\n```python\ndef spam():\n    print(eggs)\neggs = 42\nspam()\nprint(eggs)\n\
  ```\n\n由于 `spam()` 函数中没有名为 `eggs` 的参数，也没有任何给 `eggs` 赋值的代码，当在 `spam()` 中使用 `eggs`\
  \ 时，Python 将其视为对全局变量 `eggs` 的引用。这就是为什么运行上一个程序时会打印出 `42`。\n\n## 同名的局部和全局变量\n\n为了简化你的生活，请避免使用与全局变量或其他局部变量同名的局部变量。但从技术上讲，在\
  \ Python 中这样做是完全合法的。要看看发生了什么，请将以下代码输入文件编辑器并保存为 `sameName.py`：\n\n```python\n def\
  \ spam():\n    eggs = 'spam local'\n    print(eggs) # 打印 'spam local'\n  def bacon():\n\
  \n    eggs = 'bacon local'\n    print(eggs) # 打印 'bacon local'\n    spam()\n   \
  \ print(eggs) # 打印 'bacon local'\n\n eggs = 'global'\n   bacon()\n   print(eggs)\
  \ # 打印 'global'\n```\n\n当你运行这个程序时，输出如下：\n\n```\nbacon local\nspam local\nbacon local\n\
  global\n```\n\n程序中实际上有三个不同的变量，但混淆的是它们都被命名为 `eggs`。变量如下：\n\n- 在调用 `spam()` 时存在于局部作用域的\
  \ `eggs` 变量。\n- 在调用 `bacon()` 时存在于局部作用域的 `eggs` 变量。\n- 存在于全局作用域的 `eggs` 变量。\n\n\
  由于这三个独立的变量具有相同的名称，追踪哪一个是哪一个可能会很困惑。\n\n## global 语句\n\n如果你需要在函数内部修改全局变量，请使用 `global`\
  \ 语句。\n\n有四条规则可以判断变量是在局部作用域还是全局作用域：\n\n1. 如果变量在全局作用域中使用（即在所有函数之外），那么它总是全局变量。\n2.\
  \ 如果在函数中对该变量有 `global` 语句，它就是全局变量。\n3. 否则，如果变量在函数中被赋值语句中使用，它就是局部变量。\n4. 但如果变量没有在赋值语句中使用，它就是全局变量。\n\
  \n为了更好地感受这些规则，这里有一个示例程序。将以下内容输入文件编辑器并保存为 `sameName.py`：\n\n```python\n def spam():\n\
  \    global eggs\n    eggs = 'spam' # 这是全局的\n\n  def bacon():\n    eggs = 'bacon'\
  \ # 这是局部的\n  def ham():\n    print(eggs) # 这是全局的\n\n  eggs = 42 # 这是全局的\n  spam()\n\
  \  print(eggs)\n```\n\n在 `spam()` 函数中，`eggs` 是全局变量 `eggs`，因为在函数开头有 `eggs` 的 `global`\
  \ 语句。在 `bacon()` 中，`eggs` 是局部变量，因为在该中有赋值语句。在 `ham()` 中，`eggs` 是全局变量，因为在该中没有赋值语句或\
  \ `global` 语句。如果你运行 `sameName3.py`，输出如下：\n\n```\nspam\n```\n\n在函数内部，变量要么始终是全局的，要么始终是局部。函数代码无法先使用一个名为\
  \ `eggs` 的局部变量，然后在同一函数稍后又使用全局 `eggs` 变量。\n\n### 注意事项\n\n*如果你想在函数内部修改存储在全局变量中的值，必须对该变量使用\
  \ `global` 语句。*\n\n如果你尝试在给局部变量赋值之前在函数中使用它，如如下程序所示，Python 会给出一个错误。要查看这一点，请将以下内容输入文件编辑器并保存为\
  \ `sameName4.py`：\n\n\n\n\n\n```python\n def spam():\n      print(eggs) # ERROR!\n\
  ➊    eggs = 'spam local'\n\n➋ eggs = 'global'\n   spam()\n```\n\n如果你运行上面的程序，它会产生一条错误信息。\n\
  \n```\nTraceback (most recent call last):\n  File \"C:/test3784.py\", line 6, in\
  \ <module>\n    spam()\n  File \"C:/test3784.py\", line 2, in spam\n    print(eggs)\
  \ # ERROR!\nUnboundLocalError: local variable 'eggs' referenced before assignment\n\
  ```\n\n这个错误发生是因为 Python 看到在 `spam()` 函数中有对 `eggs` 的赋值语句 ➊，因此将 `eggs` 视为局部变量。但由于\
  \ `print(eggs)` 在 `eggs` 被赋值任何值之前就被执行，局部变量 `eggs` 并不存在。Python **不会**回退到使用全局变量 `eggs`\
  \ ➋。\n\n## 作为“黑盒”的函数\n\n通常情况下，你对函数只需要知道它的输入（参数）和输出值；你并不总是需要去负担函数代码实际上是如何工作的。当你以这种高层的方式思考函数时，通常说你正在将函数视为一个“黑盒”。\n\
  \n这个思想是现代编程的基础。本书的随后的章节将向你展示几个由他人编写的带有函数的模块。虽然如果你好奇，可以看一眼源码，但你不需要知道这些函数是如何工作的就可以使用它们。而且由于鼓励在不全局变量的情况下编写函数，你通常不需要担心函数代码与程序的其余部分发生交互。\n\
  \n## 异常处理\n\n现在，在你的 Python 程序中获取错误或 `exception`（异常）意味着整个程序将崩溃。你不希望这种情况在真实的程序中发生。相反，你希望程序能够检测到错误、处理它们，然后继续运行。\n\
  \n例如，考虑以下程序，它有一个“除以零”错误。打开一个新的文件编辑器窗口并输入以下代码，将其保存为 `zeroDivide.py`：\n\n```python\n\
  def spam(divideBy):\n    return 42 / divideBy\n\nprint(spam(2))\nprint(spam(12))\n\
  print(spam(0))\nprint(spam(1))\n```\n\n我们定义了一个名为 `spam` 的函数，给它传递了一个参数，然后用不同的参数打印了该函数的值以观察发生了什么。这是你运行上面的代码时得到的输出：\n\
  \n```\n21.0\n3.5\nTraceback (most recent call last):\n  File \"C:/zeroDivide.py\"\
  , line 6, in <module>\n    print(spam(0))\n  File \"C:/zeroDivide.py\", line 2,\
  \ in spam\n    return 42 / divideBy\nZeroDivisionError: division by zero\n```\n\n\
  每当你尝试将数字除以零时，就会发生 `ZeroDivisionError`。从错误信息中给出的行号，你知道 `spam()` 中的 `return` 语句导致了错误。\n\
  \n错误可以使用 `try` 和 `except` 语句来处理。可能出错的代码被放在 `try` 子句中。如果发生错误，程序执行将移动到随后的 `except`\
  \ 子句的开头。\n\n你可以将之前的除以零代码放在 `try` 子句中，并让 `except` 子句包含处理当该错误发生时情况的代码。\n\n```python\n\
  def spam(divideBy):\n    try:\n        return 42 / divideBy\n    except ZeroDivisionError:\n\
  \        print('Error: Invalid argument.')\n\nprint(spam(2))\nprint(spam(12))\n\
  print(spam(0))\nprint(spam(1))\n```\n\n当 `try` 子句中的代码引起错误时，程序执行会立即移动到 `except` 子句中的代码。在运行该代码后，执行将恢复正常继续。上程序的输出如下：\n\
  \n```\n21.0\n3.5\nError: Invalid argument.\nNone\n42.0\n```\n\n注意，在 `try` 块中的函数调用中发生的任何错误都也将被捕获。考虑以下程序，它将\
  \ `spam()` 的调用放在了 `try` 块中：\n\n```python\ndef spam(divideBy):\n    return 42 / divideBy\n\
  \ntry:\n    print(spam(2))\n    print(spam(12))\n    print(spam(0))\n    print(spam(1))\n\
  except ZeroDivisionError:\n    print('Error: Invalid argument.')\n```\n\n运行此程序时，输出看起来如下：\n\
  \n```\n21.0\n3.5\nError: Invalid argument.\n```\n\n`print(spam(1))` 永远不会执行的原因是，一旦执行跳转到\
  \ `except` 子句中的代码，它就不会返回到 `try` 子句。相反，它只是正常地继续移动。\n\n## 一个短程序：猜数字\n\n我目前为止向你展示的玩具示例对于介绍基本概念很有用，但现在让我们看看你学的一切如何在在一个完整的程序中结合起来。在本节中，我将向你展示一个简单的“猜数字”游戏。当你运行这个程序时，输出看起来像这样：\n\
  \n```\nI am thinking of a number between 1 and 20.\nTake a guess.\n10\nYour guess\
  \ is too low.\nTake a guess.\n15\nYour guess is too low.\nTake a guess.\n17\nYour\
  \ guess is too high.\nTake a guess.\n16\nGood job! You guessed my number in 4 guesses!\n\
  ```\n\n将以下源代码输入文件编辑器，并将文件保存为 `guessNumber.py`：\n\n```python\n### This is a guess\
  \ the number game\nimport random\nsecretNumber = random.randint(1, 20)\nprint('I\
  \ am thinking of a number between 1 and 20.')\n\n### Ask the player to guess 6 times.\n\
  for guessesTaken in range(1, 7):\n    print('Take a guess.')\n    guess = int(input())\n\
  \n    if guess < secretNumber:\n        print('Your guess is too low.')\n    elif\
  \ guess > secretNumber:\n        print('Your guess is too high.')\n    else:\n \
  \       break    # This condition is the correct guess!\n\nif guess == secretNumber:\n\
  \    print('Good job! You guessed my number in ' + str(guessesTaken) + ' guesses!')\n\
  else:\n    print('Nope. The number I was thinking of was ' + str(secretNumber))\n\
  ```\n\n让我们从顶部逐行查看这段代码。\n\n```python\n### This is a guess the number game\nimport\
  \ random\nsecretNumber = random.randint(1, 20)\n```\n\n首先，顶部的注释解释了程序的功能。然后，程序导入\
  \ `random` 模块，以便可以使用 `random.randint()` 函数为用户生成一个数字。返回值（1 到 20 之间的随机整数）存储在变量 `secretNumber`\
  \ 中。\n\n```python\nprint('I am thinking of a number between 1 and 20.')\n\n### Ask\
  \ the player to guess 6 times.\nfor guessesTaken in range(1, 7):\n    print('Take\
  \ a guess.')\n    guess = int(input())\n```\n\n程序告诉玩家它想了一个数字，并将给玩家六次机会来猜。让玩家输入猜测并检查猜测的代码位于一个最多循环六次的\
  \ `for` 循环中。循环中发生的第一是玩家输入猜测。由于 `input()` 返回字符串，其返回值直接传递给 `int()`，将字符串转换为整数值。这被存储在名为\
  \ `guess` 的变量中。\n\n```python\nif guess < secretNumber:\n    print('Your guess is\
  \ too low.')\nelif guess > secretNumber:\n    print('Your guess is too high.')\n\
  ```\n\n这几行代码检查猜测是否小于或大于秘密数字。在任何情况下，屏幕都会打印一个提示。\n\n```python\nelse:\n    break  \
  \  # This condition is the correct guess!\n```\n\n如果猜测既不高于也不低于秘密数字，那么它一定等于秘密数字，在这种情况下，你希望程序执行跳出\
  \ `for` 循环。\n\n```python\nif guess == secretNumber:\n    print('Good job! You guessed\
  \ my number in ' + str(guessesTaken) + ' guesses!')\nelse:\n    print('Nope. The\
  \ number I was thinking of was ' + str(secretNumber))\n```\n\n\n\n\n在 `for` 循环之后，之前的\
  \ `if...else` 语句会检查玩家是否正确猜中了数字，并在屏幕上打印适当的消息。在两种情况下，程序都会显示一个包含整数值的 de 变量（`guessesTaken`\
  \ 和 `secretNumber`）。由于程序必须将这些整数值转换为字符串，因此它会将这些变量传递给 `str()` 函数，该函数会返回这些整数的字符串形式。现在，这些字符串就可以用\
  \ `+` 运算符进行拼接，最后传递给 `print()` 函数调用。\n\n## 总结\n\n函数是将代码划分为逻辑组的主要方法。由于函数中的变量存在于自己的局部作用域中，因此一个函数中的代码无法直接影响另一个函数中变量的值。这限制了能够修改变量值的代码范围，这在调试代码时非常有帮助。\n\
  \n函数是帮助你组织代码的绝佳工具。你可以将它们看作黑盒：它们有以参数形式存在的输入和以返回值形式存在的输出，且其内部的代码不会影响其他函数中的变量。\n\n\
  在之前的章节中，单个错误就可能导致你的程序崩溃。在本章中，你学习了 `try` 和 `except` 语句，它们可以在检测到错误时运行代码。这可以使你的程序对常见的错误情况更具韧性。\n\
  \n## 练习题\n\n| Q: | 1. 为什么在程序中使用函数有什么优势？ |\n| Q: | 2. 函数中的代码在什么时候执行：是在函数定义时还是在函数调用时？\
  \ |\n| Q: | 3. 什么语句可以创建函数？ |\n| Q: | 4. 函数和函数调用之间的区别是什么？ |\n| Q: | 5. Python 程序中有多少个全局作用域？多少个局部作用域？\
  \ |\n| Q: | 6. 函数返回时，局部作用域中的变量会发生什么？ |\n| Q: | 7. 什么是返回值？返回值可以作为表达式的一部分吗？ |\n| Q:\
  \ | 8. 如果函数没有 return 语句，那么调用该函数的返回值是什么？ |\n| Q: | 9. 你如何强制函数中的变量引用全局变量？ |\n| Q:\
  \ | 10. `None` 的数据类型是什么？ |\n| Q: | 11. `import areallyourpetsnamederic` 语句的作用是什么？\
  \ |\n| Q: | 12. 如果你在 `spam` 模块中有一个名为 `bacon()` 的函数，在导入 `spam` 后如何调用它？ |\n| Q: |\
  \ 13. 你如何防止程序在遇到错误时崩溃？ |\n| Q: | 14. `try` 子句中写什么？`except` 子句中写什么？ |\n\n## 练习项目\n\
  \n为了练习，请编写程序完成以下任务。\n\n## 考拉兹序列\n\n编写一个名为 `collatz()` 的函数，它有一个名为 `number` 的参数。如果\
  \ `number` 是偶数，则 `collatz()` 打印 `number // 2` 并返回该值。如果 `number` 是奇数，则 `collatz()`\
  \ 打印并返回 `3 * number + 1`。\n\n然后编写一个程序，让用户输入一个整数，并不断对该数字调用 `collatz()`，直到函数返回值为 `1`。（令人惊讶的是，这个序列实际上适用于任何整数——迟早，使用这个序列，你都会到达\
  \ 1！甚至数学家们也不确定为什么。你的程序正在探索所谓的*考拉兹序列*（Collatz sequence），有时被称为“最简单不可能的数学题”。）\n\n记住使用\
  \ `int()` 函数将 `input()` 的返回值转换为整数；否则它将是一个字符串值。\n\n提示：如果 `number % 2 == 0`，则整数 `number`\
  \ 是偶数；如果 `number % 2 == 1`，则它是奇数。\n\n该程序的输出可能如下：\n\n```\nEnter number:\n3\n10\n\
  5\n16\n8\n4\n2\n1\n```\n\n## 输入验证\n\n在之前的项目中添加 `try` 和 `except` 语句，以检测用户是否输入了非整数字符串。通常，如果向\
  \ `int()` 函数传递非整数字符串，它会引起 `ValueError` 错误，例如 `int('puppy')`。在 `except` 子句中，向用户打印消息，说明他们必须输入整数。\n\
  \n# 第 4 章 列表\n\n在开始认真编写程序之前，你需要理解的另一个主题是列表数据类型及其表亲元组（tuple）。列表和元组可以包含多个值，这使得编写处理大量数据的程序变得更容易。由于列表本身可以包含其他列表，你可以使用它们将数据排列成层次结构。\n\
  \n在本章中，我将讨论列表的基础。我还会教你方法（methods），即与特定数据类型的值绑定的函数。然后我将简要介绍类似列表元组和字符串数据类型，以及它们与列表值的比较。在下一章中，我将为你介绍字典数据类型。\n\
  \n## 列表数据类型\n\n*列表*（list）是一个在有序序列中包含多个值的值。*列表值*（list value）指的是列表本身（这是一个可以像其他值一样存储在变量中或传递给函数的值），而不是列表值内部的值。列表值看起来像这样：`['cat',\
  \ 'bat']`。就像字符串值使用引号字符标记字符串的开始和结束一样，列表值以左括号开始，以右括号结束。列表内部的值被称为*项*（items）。项用逗号分隔（即它们是*分隔的*）。例如，在交互式\
  \ shell 中输入以下内容：\n\n```\n>>> spam = ['cat', 'bat', 'rat', 'elephant']\n>>> spam\n\
  ['cat', 'bat', 'rat', 'elephant']\n```\n\n`spam` 变量仍然只赋值了一个值：即列表值。但列表本身包含了其他值。值\
  \ `[]` 是一个不包含值的列表，类似于 `''`。\n\n## 使用索引获取列表中的单个值\n\n假设有一个列表 `['cat', 'bat', 'rat',\
  \ 'elephant']` 存储在变量 `spam` 中。Python 代码 `spam[0]` 的值为 `'cat'`，`spam[1]` 的值为 `'bat'`，依此类推。列表方括号内的整数被称为*索引*（index）。列表中的第一个值位于索引\
  \ `0`，第二个值位于索引 `1`，第三个值位于索引 `2`，依此类推。图 4-1 显示了赋值给 `spam` 的列表值，以及索引表达式的求值结果。\n\n\
  ![List value in the variable spam, showing which value index refers to](img/httpatomoreillycomsourcenostarchimages2189595.png)\n\
  \n图 4-1. 变量中的列表值，显示索引的引用\n\n例如，在交互式 shell 中输入以下表达式。首先将列表赋值给变量 `spam`。\n\n```\n>>>\
  \ spam = ['cat', 'bat', 'rat', 'elephant']\n>>> spam[0]\n'cat'\n>>> spam[1]\n'bat'\n\
  >>> spam[2]\n'rat'\n>>> spam[3]\n'elephant'\n>>> ['cat', 'bat', 'rat', 'elephant'][3]\n\
  'elephant'\n1 >>> 'Hello ' + spam[0]\n➋ 'Hello cat'\n>>> 'The ' + spam[1] + ' ate\
  \ the ' + spam[0] + '.'\n'The bat ate the cat.'\n```\n\n注意表达式 `'Hello ' + spam[0]`\
  \ ➊ 的求值为 `'Hello ' + 'cat'`，因为 `spam[0]` 的求值为字符串 `'cat'`。该表达式随后求值为字符串值 `'Hello cat'`\
  \ ➋。\n\n如果你使用的索引超过了列表值的数量，Python 会给你一个 `IndexError` 错误消息。\n\n\n\n\n\n```python\n\
  >>> spam = ['cat', 'bat', 'rat', 'elephant']\n>>> spam[10000]\nTraceback (most recent\
  \ call last):\n  File \"<pyshell#9>\", line 1, in <module>\n    spam[10000]\nIndexError:\
  \ list index out of range\n```\n\n索引是整数值，不能是浮点数。以下示例将导致 `TypeError` 错误：\n\n```python\n\
  >>> spam = ['cat', 'bat', 'rat', 'elephant']\n>>> spam[1]\n'bat'\n>>> spam[1.0]\n\
  Traceback (most recent call last):\n  File \"<pyshell#13>\", line 1, in <module>\n\
  \    spam[1.0]\nTypeError: list indices must be integers, not float\n>>> spam[int(1.0)]\n\
  'bat'\n```\n\n列表也可以包含其他列表值。这些嵌套列表中的值可以使用多个索引来访问，如下：\n\n```python\n>>> spam = [['cat',\
  \ 'bat'], [10, 20, 30, 40, 50]]\n>>> spam[0]\n['cat', 'bat']\n>>> spam[0][1]\n'bat'\n\
  >>> spam[1][4]\n50\n```\n\n第一个索引决定使用哪一个列表值，第二个索引指示该列表值内部的值。例如，`spam[0][1]` 打印 `'bat'`，即第一个列表中的第二个值。如果你只使用一个索引，程序将打印该索引处的完整列表值。\n\
  \n## 负索引\n\n虽然索引从 `0` 开始并增加，但你也可以负整数作为索引。整数值 `-1` 指列表的最后一个索引，值 `-2` 指列表的倒数第二个索引，依此类推。在交互式外器中输入以下内容：\n\
  \n```python\n>>> spam = ['cat', 'bat', 'rat', 'elephant']\n>>> spam[-1]\n'elephant'\n\
  >>> spam[-3]\n'bat'\n>>> 'The ' + spam[-1] + ' is afraid of the ' + spam[-3] + '.'\n\
  'The elephant is afraid of the bat.'\n```\n\n## 使用切片获取子列表\n\n就像索引可以从列表中获取单个值一样，*切片*（slice）可以以新列表的形式从列表中获取多个值。切片写在方括号中，类似于索引，但它有两个由冒号分隔的整数。注意索引和切片之间的区别。\n\
  \n*   `spam[2]` 是带有索引（一个整数）的列表。\n*   `spam[1:4]` 是带有切片（两个整数）的列表。\n\n在切片中，第一个整数是切片开始的索引。第二个整数是切片结束的索引。切片包含到但不包含第二个索引处的值。切片求值为为一个新的列表值。在交互式外器中输入以下内容：\n\
  \n```python\n>>> spam = ['cat', 'bat', 'rat', 'elephant']\n>>> spam[0:4]\n['cat',\
  \ 'bat', 'rat', 'elephant']\n>>> spam[1:3]\n['bat', 'rat']\n>>> spam[0:-1]\n['cat',\
  \ 'bat', 'rat']\n```\n\n作为快捷方法，你可以省略切片中冒号两侧的一个或两个索引。省略第一个索引等同于使用 `0` 或列表的开头。省略第二个索引等同于使用列表的长度，这将切片到列表的末。在交互式外器中输入以下内容：\n\
  \n```python\n>>> spam = ['cat', 'bat', 'rat', 'elephant']\n>>> spam[:2]\n['cat',\
  \ 'bat']\n>>> spam[1:]\n['bat', 'rat', 'elephant']\n>>> spam[:]\n['cat', 'bat',\
  \ 'rat', 'elephant']\n```\n\n## 使用 len() 获取列表长度\n\n`len()` 函数将返回传递给它的列表值中的值数量，就像它可以计算字符串值中的字符数一样。在交互式外器中输入以下内容：\n\
  \n```python\n>>> spam = ['cat', 'dog', 'moose']\n>>> len(spam)\n3\n```\n\n## 使用索引修改列表中的值\n\
  \n通常，变量名位于赋值语句的左侧，例如 `spam = 42`。然而，你也可以使用列表索引来更改该索引处的值。例如，`spam[1] = 'aardvark'`\
  \ 意味着“将列表 `spam` 中索引 `1` 处的值赋值为字符串 `'aardvark'`”。在交互式外器中输入以下内容：\n\n```python\n>>>\
  \ spam = ['cat', 'bat', 'rat', 'elephant']\n>>> spam[1] = 'aardvark'\n>>> spam\n\
  ['cat', 'aardvark', 'rat', 'elephant']\n>>> spam[2] = spam[1]\n>>> spam\n['cat',\
  \ 'aardvark', 'aardvark', 'elephant']\n>>> spam[-1] = 12345\n>>> spam\n['cat', 'aardvark',\
  \ 'aardvark', 12345]\n```\n\n## 列表拼接与列表复制\n\n`+` 运算符可以合并两个列表以创建一个新的列表值，就像它合并两个字符串形成新的字符串值一样。`*`\
  \ 运算符也可以与列表和整数值配合复制列表。在交互式外器中输入以下内容：\n\n```python\n>>> spam = ['cat', 'bat', 'rat',\
  \ 'elephant']\n>>> spam + ['dog', 'mouse']\n['cat', 'bat', 'rat', 'elephant', 'dog',\
  \ 'mouse']\n>>> spam * 3\n['cat', 'bat', 'rat', 'elephant', 'cat', 'bat', 'rat',\
  \ 'elephant', 'cat', 'bat', 'rat', 'elephant']\n```\n\n## 使用 del 从列表中删除值\n\n`del`\
  \ 语句可以从列表中删除一个项。\n\n```python\n>>> spam = ['cat', 'bat', 'rat', 'elephant']\n>>>\
  \ del spam[1]\n>>> spam\n['cat', 'rat', 'elephant']\n>>> del spam[0]\n>>> spam\n\
  ['rat', 'elephant']\n>>> del spam\n>>> spam\n[]\n```\n\n`del` 语句也可以从列表中删除一个切片。\n\
  \n```python\n>>> spam = ['cat', 'bat', 'rat', 'elephant']\n>>> del spam[1:3]\n>>>\
  \ spam\n['cat', 'elephant']\n```\n\n`del` 语句还可以删除列表中的所有元素。\n\n```python\n>>> spam\
  \ = ['cat', 'bat', 'rat', 'elephant']\n>>> del spam[:]\n>>> spam\n[]\n```\n\n如果你尝试删除不存在的索引，将得到\
  \ `IndexError`。\n\n```python\n>>> spam = ['cat', 'bat', 'rat', 'elephant']\n>>>\
  \ del spam[10]\nTraceback (most recent call last):\n  File \"<pyshell#25>\", line\
  \ 1, in <module>\n    del spam[10]\nIndexError: list index out of range\n```\n\n\
  `del` 语句也可以用于删除列表中的切片。\n\n```python\n>>> spam = ['cat', 'bat', 'rat', 'elephant']\n\
  >>> del spam[1:10]\n>>> spam\n['cat']\n```\n\n## 使用列表方法\n\n`pop()` 方法从列表中删除并返回一个项。\n\
  \n```python\n>>> spam = ['cat', 'bat', 'rat', 'elephant']\n>>> spam.pop()\n'elephant'\n\
  >>> spam\n['cat', 'bat', 'rat']\n>>> spam.pop(1)\n'bat'\n>>> spam\n['cat', 'rat']\n\
  ```\n\n`append()` 方法向列表末尾添加一个项。\n\n```python\n>>> spam = ['cat', 'bat', 'rat', 'elephant']\n\
  >>> spam.append('dog')\n>>> spam\n['cat', 'bat', 'rat', 'elephant', 'dog']\n```\n\
  \n`insert()` 方法在指定的索引向列表中插入一个项。如果没有指定索引，则将其添加到列表末尾。\n\n```python\n>>> spam = ['cat',\
  \ 'bat', 'rat', 'elephant']\n>>> spam.insert(1, 'dog')\n>>> spam\n['cat', 'dog',\
  \ 'bat', 'rat', 'elephant']\n```\n\n`extend()` 方法将另一个列表的所有元素添加到列表中。\n\n```python\n\
  >>> spam = ['cat', 'bat', 'rat', 'elephant']\n>>> spam.extend(['dog', 'mouse'])\n\
  >>> spam\n['cat', 'bat', 'rat', 'elephant', 'dog', 'mouse']\n```\n\n`sort()` 方法按升序排序列表元素。\n\
  \n```python\n>>> spam = ['elephant', 'cat', 'rat', 'bat']\n>>> spam.sort()\n>>>\
  \ spam\n['bat', 'cat', 'elephant', 'rat']\n```\n\n`reverse()` 方法反转列表元素的顺序。\n\n```python\n\
  >>> spam = ['cat', 'bat', 'rat', 'elephant']\n>>> spam.reverse()\n>>> spam\n['elephant',\
  \ 'rat', 'bat', 'cat']\n```\n\n`count()` 方法返回一个值在列表中出现的次数。\n\n```python\n>>> spam\
  \ = ['cat', 'bat', 'rat', 'cat']\n>>> spam.count('cat')\n1\n```\n\n`index()` 方法返回值首次出现的索引。如果未找到该值，它将抛出\
  \ `ValueError`。\n\n```python\n>>> spam = ['cat', 'bat', 'rat', 'cat']\n>>> spam.index('bat')\n\
  1\n```\n\n`copy()` 方法返回列表的浅拷贝。\n\n```python\n>>> spam = ['cat', 'bat', 'rat', 'elephant']\n\
  >>> new_spam = spam.copy()\n>>> new_spam\n['cat', 'bat', 'rat', 'elephant']\n```\n\
  \n## 遍历列表\n\n你可以使用 `for` 循环遍历列表的元素。\n\n```python\n>>> spam = ['cat', 'bat', 'rat',\
  \ 'elephant']\n>>> item in spam:\n...     print(item)\ncat\nbat\nrat\nelephant\n\
  ```\n\n你还可以使用 `range()` 函数遍历列表的索引。\n\n```python\n>>> spam = ['cat', 'bat', 'rat',\
  \ 'elephant']\n>>> i in range(len(spam)):\n...     print(i, spam[i])\n0 cat\n1 bat\n\
  2 rat\n3 elephant\n```\n\n## 列表推导式\n\n列表推导式提供了创建新列表的简洁方式。\n\n```python\n>>> spam\
  \ = ['cat', 'bat', 'rat', 'elephant']\n>>> [item.upper() for item in spam]\n['CAT',\
  \ 'BAT', 'RAT', 'ELEPHANT']\n```\n\n列表推导式还可以包含条件语句。\n\n```python\n>>> spam = ['cat',\
  \ 'bat', 'rat', 'elephant']\n>>> [item for item in spam if len(item) > 3]\n['elephant']\n\
  ```\n\n\n\n\n\n在第 2 章 中，你学习了使用 `for` 循环执行特定次数的代码块。从技术上讲，`for` 循环会针对列表或类列表值中的每个值重复执行代码块。例如，如果你运行了以下代码：\n\
  \n```python\nfor i in range(4):\n    print(i)\n```\n\n该程序的输出如下：\n\n```\n0\n1\n2\n\
  3\n```\n\n这是因为 `range(4)` 的返回值是一个类列表值，Python 认为它类似于 `[0, 1, 2, 3]`。。接下来的程序输出与上一个程序相同：\n\
  \n```python\nfor i in [0, 1, 2, 3]:\n    print(i)\n```\n\n之前的 `for` 循环实际执行的操作是遍历其子句，并在每次迭代中将变量\
  \ `i` 设置为 `[0, 1, 2, 3]` 列表中的连续值。\n\n### 注意事项\n\n在书中，我使用“类列表”（list-like）一词来指代技术上名为\
  \ `sequences`（序列）的数据类型。不过，你不需要知道这个术语的技术定义。一种常用的 Python 技术是使用 `range(len(someList))`\
  \ 配合 `for` 循环遍历列表的索引。例如，在交互式 shell 中输入以下内容：\n\n```python\n>>> supplies = ['pens',\
  \ 'staplers', 'flame-throwers', 'binders']\n>>> for i in range(len(supplies)):\n\
  \    print('Index ' + str(i) + ' in supplies is: ' + supplies[i])\n\nIndex 0 in\
  \ supplies is: pens\nIndex 1 in supplies is: staplers\nIndex 2 in supplies is: flame-throwers\n\
  Index 3 in supplies is: binders\n```\n\n在之前显示的 `for` 循环中使用 `range(len(supplies))`\
  \ 非常方便，因为循环代码可以访问索引（作为变量 `i`）以及该索引处的值（作为 `supplies[i]`）。最棒的是，`range(len(supplies))`\
  \ 会遍历 `supplies` 的所有索引，无论它包含多少项。\n\n## in 和 not in 运算符\n\n你可以使用 `in` 和 `not in`\
  \ 运算符来判断一个值是否在列表中。像其他运算符一样，`in` 和 `not in` 用于表达式并连接两个值：一个要在列表中查找的值，以及该值可能存在的列表。这些表达式将求值为一个布尔值。在交互式\
  \ shell 中输入以下内容：\n\n```python\n>>> 'howdy' in ['hello', 'hi', 'howdy', 'heyas']\n\
  True\n>>> spam = ['hello', 'hi', 'howdy', 'heyas']\n>>> 'cat' in spam\nFalse\n>>>\
  \ 'howdy' not in spam\nFalse\n>>> 'cat' not in spam\nTrue\n```\n\n例如，下面的程序允许允许输入宠物名称，然后检查该名称是否在宠物列表中。打开一个新的文件编辑器窗口，输入以下代码并将其保存为\
  \ `myPets.py`：\n\n```python\nmyPets = ['Zophie', 'Pooka', 'Fat-tail']\nprint('Enter\
  \ a pet name:')\nname = input()\nif name not in myPets:\n    print('I do not have\
  \ a pet named ' + name)\nelse:\n    print(name + ' is my pet.')\n```\n\n输出可能类似于这样：\n\
  \n```\nEnter a pet name:\nFootfoot\nI do not have a pet named Footfoot\n```\n\n\
  ## 多变量赋值技巧\n\n*多变量赋值技巧*（multiple assignment trick）是一种快捷方法，让你在一行代码中将列表中的值赋值给多个变量。因此，而不是这样做：\n\
  \n```python\n>>> cat = ['fat', 'black', 'loud']\n>>> size = cat[0]\n>>> color =\
  \ cat[1]\n>>> disposition = cat[2]\n```\n\n你可以输入这一行代码：\n\n```python\n>>> cat = ['fat',\
  \ 'black', 'loud']\n>>> size, color, disposition = cat\n```\n\n变量的数量和列表的长度必须完全相等，否则\
  \ Python 将给你抛出一个 `ValueError`：\n\n```python\n>>> cat = ['fat', 'black', 'loud']\n\
  >>> size, color, disposition, name = cat\nTraceback (most recent call last):\n \
  \ File \"<pyshell#84>\", line 1, in <module>\n    size, color, disposition, name\
  \ = cat\nValueError: need more than 3 values to unpack\n```\n\n## 复合赋值运算符\n\n在给变量赋值时，你会经常使用变量本身。例如，在将\
  \ `42` 赋值给变量 `spam` 后，你可以通过以下代码将 `spam` 中的值增加 `1`：\n\n```python\n>>> spam = 42\n\
  >>> spam = spam + 1\n>>> spam\n43\n```\n\n作为快捷方式，你可以使用复合赋值运算符 `+=` 来相同的操作：\n\n```python\n\
  >>> spam = 42\n>>> spam += 1\n>>> spam\n43\n```\n\n对于 `+`、`-`、`*`、`/` 和 `%` 运算符都有复合赋值运算符，见表\
  \ 4-1。\n\n表 4-1. 复合赋值运算符\n\n| 语句 | 等效语句 |\n| :--- | :--- |\n| `x += y` | `x = x\
  \ + y` |\n| `x -= y` | `x = x - y` |\n| `x *= y` | `x = x * y` |\n| `x /= y` | `x\
  \ = x / y` |\n| `x %= y` | `x = x % y` |\n| `x //= y` | `x = x // y` |\n| `x <<=\
  \ y` | `x = x << y` |\n| `x >>= y` | `x = x >> y` |\n| `x **= y` | `x = x ** y`\
  \ |\n\n`+=` 运算符可以执行字符串拼接，而 `*=` 可以执行复制。在交互式 shell 中输入：\n\n```python\n>>> spam =\
  \ 'Hello'\n>>> spam += '!'\n>>> spam\n'Hello!'\n```\n\n```python\n>>> bacon = ['Zophie']\n\
  >>> bacon *= 3\n>>> bacon\n['Zophie', 'Zophie', 'Zophie']\n```\n\n## 方法\n\n*方法*与函数相同，是在值上调用的。例如，列表类型有多种用于查找、添加、处理值的方法。`index()`\
  \ 方法可以查找列表中的值。在交互式 shell 中输入：\n\n```python\n>>> spam = ['hello', 'hi', 'howdy',\
  \ 'heyas']\n>>> spam.index('hello')\n0\n>>> spam.index('howdy')\n2\n>>> spam.index('cat')\n\
  Traceback (most recent call last):\n  File \"<pyshell#31>\", line 1, in <module>\n\
  \    spam.index('cat')\nValueError: 'cat' is not in list\n```\n\n当列表中存在重复值时，返回其首次出现的索引。输入以下内容，注意\
  \ `index()` 返回 `1`：\n\n```python\n>>> spam = ['Zophie', 'Pooka', 'Fat-tail', 'Pooka']\n\
  >>> spam.index('Pooka')\n1\n```\n\n## 使用 append() 和 insert() 向列表添加值\n\n向列表添加新值使用\
  \ `append()` 和 `insert()` 方法。在交互式 shell 中输入对存储在 `spam` 中的列表值调用 `append()` 方法：\n\n\
  ```python\n>>> spam = ['cat', 'dog', 'bat']\n>>> spam.append('moose')\n>>> spam\n\
  ['cat', 'dog', 'bat', 'moose']\n```\n\n之前的 `append()` 方法调用将参数添加到列表末尾。`insert()`\
  \ 方法可以在列表的任何索引处插入值。`insert()` 的第一个参数是新值的索引，第二个参数是待插入的新值。在交互式 shell 中输入：\n\n```python\n\
  >>> spam = ['cat', 'dog', 'bat']\n>>> spam.insert(1, 'chicken')\n>>> spam\n['cat',\
  \ 'chicken', 'dog', 'bat']\n```\n\n\n\n\n方法属于单一数据类型。`append()` 和 `insert()` 方法是列表方法，只能在列表值上调用，不能在字符串或整数等值上调用。在交互式\
  \ shell 中输入以下内容，并注意出现的 `AttributeError` 错误消息：\n\n```\n>>> eggs = 'hello'\n>>> eggs.append('world')\n\
  Traceback (most recent call last):\n  File \"<pyshell#19>\", line 1, in <module>\n\
  \    eggs.append('world')\nAttributeError: 'str' object has no attribute 'append'\n\
  >>> bacon = 42\n>>> bacon.insert(1, 'world')\nTraceback (most recent call last):\n\
  \  File \"<pyshell#22>\", line 1, in <module>\n    bacon.insert(1, 'world')\nAttributeError:\
  \ 'int' object has no attribute 'insert'\n```\n\n## 使用 remove() 从列表中删除值\n\n`remove()`\
  \ 方法接收一个要从其调用的列表中删除的值。在交互式 shell 中输入以下内容：\n\n```\n>>> spam = ['cat', 'bat', 'rat',\
  \ 'elephant']\n>>> spam.remove('bat')\n>>> spam\n['cat', 'rat', 'elephant']\n```\n\
  \n尝试删除列表中不存在的值将导致 `ValueError` 错误。例如，在交互式 shell 中输入以下内容并注意显示的错误：\n\n```\n>>> spam\
  \ = ['cat', 'bat', 'rat', 'elephant']\n>>> spam.remove('chicken')\nTraceback (most\
  \ recent call last):\n  File \"<pyshell#31>\", line 1, in <module>\n    spam.remove('chicken')\n\
  ValueError: list.remove(x): x not in list\n```\n\n如果该值在列表中多次出现，则只会删除值的第一个实例。在交互式\
  \ shell 中输入以下内容：\n\n```\n>>> spam = ['cat', 'bat', 'rat', 'cat', 'hat']\n>>> spam.remove('cat')\n\
  >>> spam\n['bat', 'rat', 'cat', 'hat']\n```\n\n当你知道要从列表中删除的值的索引时，使用 `del` 语句很好。当你知道要从列表中删除的值时，使用\
  \ `remove()` 方法很好。\n\n## 使用 sort() 对列表中的值排序\n\n数值列表或字符串列表可以使用 `sort()` 方法进行排序。例如，在交互式\
  \ shell 中输入以下内容：\n\n```\n>>> spam = [2, 5, 34, 1, -7]\n>>> spam.sort()\n>>> spam\n\
  [-7, 1, 2, 5, 34]\n>>> spam = ['ants', 'cats', 'elephants']\n>>> spam.sort()\n>>>\
  \ spam\n['ants', 'cats', 'elephants']\n```\n\n你也可以为 `reverse` 关键字参数传递 `True`，让 `sort()`\
  \ 反序对值排序。在交互式 shell 中输入以下内容：\n\n```\n>>> spam.sort(reverse=True)\n>>> spam\n['elephants',\
  \ 'cats', 'ants']\n```\n\n关于 `sort()` 方法有三点你需要注意。第一，`sort()` 方法会原地排序列表；不要尝试通过编写\
  \ `spam = spam.sort()` 这样的代码来获取返回值。\n\n第二，你不能对既有数值又有字符串的列表进行排序，因为 Python 不知道如何比较这些值。在交互式\
  \ shell 中输入以下内容并注意 `TypeError` 错误：\n\n```\n>>> spam = [1, 3, 2, 4, 'Alice', 'Bob']\n\
  >>> spam.sort()\nTraceback (most recent call last):\n  File \"<pyshell#70>\", line\
  \ 1, in <module>\n    spam.sort()\nTypeError: unorderable types: str and int\n```\n\
  \n第三，`sort()` 对字符串排序使用“ASCII 顺序”而不是字母顺序。这意味着大写字母在小写字母之前。因此，小写的 `a` 排序后排在大写的 `Z`\
  \ 之后。例如，在交互式 shell 中输入以下内容：\n\n```\n>>> spam = ['Alice', 'ants', 'Bob', 'Carol',\
  \ 'cats']\n>>> spam.sort()\n>>> spam\n['Alice', 'Bob', 'Carol', 'ants', 'cats']\n\
  ```\n\n如果你需要按照常规字母顺序对值排序，在调用 `sort()` 方法时为 `key` 关键字参数传递 `str.lower`。\n\n```\n>>>\
  \ spam = ['a', 'z', 'A', 'Z']\n>>> spam.sort(key=str.lower)\n>>> spam\n['a', 'A',\
  \ 'z', 'Z']\n```\n\n这使得 `sort()` 函数将列表中的所有项都视为小写形式，而不会实际更改列表中的值。\n\n## 示例程序：使用列表的魔力水晶球\n\
  \n使用列表，你可以写出一个比上一章节的魔力水晶球程序优雅得多的版本。与其使用几行几乎完全相同的 `elif` 语句，你可以创建一个代码可以操作的单一列表。打开一个新的文件编辑器窗口并输入以下代码。将其保存为\
  \ `magic8Ball2.py`。\n\n```\nimport random\n\nmessages = ['It is certain',\n    'It\
  \ is decidedly so',\n    'Yes definitely',\n    'Reply hazy try again',\n    'Ask\
  \ again later',\n    'Concentrate and ask again',\n    'My reply is no',\n    'Outlook\
  \ not so good',\n    'Very doubtful']\n\nprint(messages[random.randint(0, len(messages))])\n\
  ```\n\n## Python 缩进的异常\n\n在大多数情况下，缩进决定了代码属于哪个块。但是，这个规则有一些例外。例如，列表可以跨越多行。在交互式 shell\
  \ 中输入以下内容并注意缩进：\n\n```\n>>> spam = ['apples',\n    'oranges',\n    'bananas',\n\
  \    'cats']\nprint(spam)\n```\n\n你也可以使用行尾的 `\\` 将单条指令拆分到多行。将 `\\` 理解为“此指令继续在下一行”。这里的缩进并不重要。例如，以下\
  \ Python 代码是有效的：\n\n```python\nprint('Four score and seven ' \\\n      'years ago...')\n\
  ```这些技巧当你想要让列表更具可读性时非常有用。运行这个程序时，你会发现它与 `magic8Ball.py` 工作一样。注意你用于索引 `messages`\
  \ 的表达式：`random.randint(0, len(messages) - 1)`。无论 `messages` 的大小如何，它都会产生一个随机数作为索引。这种方法的用处是你可以轻松地向\
  \ `messages` 添加或删除字符串，而无需改变其他代码。\n\n## 类列表类型：字符串和元组\n\n列表不是唯一表示有序序列的数据类型。例如，如果你将字符串视为单个字符的“列表”，那么字符串和列表是相似的。许多对列表的操作也可以对字符串进行：索引；切片；以及与\
  \ `for` 循环、`len()` 以及 `in` 和 `not in` 运算符一起使用。要验证这一点，在交互式 shell 中输入以下内容：\n\n```\n\
  >>> name = 'Zophie'\n>>> name[0]\n'Z'\n>>> name[-2]\n'i'\n>>> name[0:4]\n'Zoph'\n\
  >>> 'Zo' in name\nTrue\n>>> 'z' in name\nFalse\n>>> 'p' not in name\nFalse\n>>>\
  \ for i in name:\n        print('* * * ' + i + ' * *')\n\n* * * Z * * *\n* * * o\
  \ * * *\n* * * p * * *\n* * * h * * *\n* * * i * * *\n* * * e * * *\n```\n\n## 可变与不可变数据类型\n\
  \n但列表和字符串在一个重要的点上不同。列表值是一个可变数据类型：可以添加、删除或更改值。然而，字符串是不可变的：它不能被更改。尝试对字符串中重新赋值单个字符会导致\
  \ `TypeError` 错误，你可以通过在交互式 shell 中输入以下内容看到：\n\n```\n>>> name = 'Zophie a cat'\n\
  >>> name[7] = 'the'\nTraceback (most recent call last):\n  File \"<pyshell#50>\"\
  , line 1, in <module>\n    name[7] = 'the'\nTypeError: 'str' object does not support\
  \ item assignment\n```\n\n\n\n\n“修改”字符串的正确方法是使用切片和拼接，通过从旧字符串的部分拷贝来构建新字符串。在交互式 shell\
  \ 程序中输入以下内容：\n\n```\n>>> name = 'Zophie a cat'\n>>> newName = name[0:7] + 'the'\
  \ + name[8:12]\n>>> name\n'Zophie a cat'\n>>> newName\n'Zophie the cat'\n```\n\n\
  我们使用 `[0:7]` 和 `[8:12]` 来引用我们不想替换的字符。注意，原始的 `'Zophie a cat'` 字符串没有被修改，因为字符串是不可变的。\n\
  \n虽然列表值*是*可变的，但以下代码中的第二行并没有修改列表 `eggs`：\n\n```\n>>> eggs = [1, 2, 3]\n>>> eggs =\
  \ [4, 5, 6]\n>>> eggs\n[4, 5, 6]\n```\n\n这里 `eggs` 中的列表值并没有被改变；相反，是一个全新的、不同的列表值（`[4,\
  \ 5, 6]`）覆盖了旧的列表值（`[1, 2, 3]`）。这在图 4-2 中所示。\n\n如果你想实际修改 `eggs` 中的原始列表以包含 `[4, 5,\
  \ 6]`，你必须执行如下操作：\n\n```\n>>> eggs = [1, 2, 3]\n>>> del eggs[2]\n>>> del eggs[1]\n\
  >>> del eggs[0]\n>>> eggs.append(4)\n>>> eggs.append(5)\n>>> eggs.append(6)\n>>>\
  \ eggs\n[4, 5, 6]\n```\n\n![当执行 eggs = [4, 5, 6] 时，eggs 的内容被新的列表值替换。](Images/httpatomoreillycomsourcenostarchimages2189597.png.jpg)\n\
  \n图 4-2。当执行 `eggs = [4, 5, 6]` 时，`eggs` 的内容被新的列表值替换。\n\n在第一个示例中，`eggs` 最终获得的列表值与它开始时的列表值是相同的。只是这个列表被改变了，而不是被覆盖。图\
  \ 4-3 方法在原地修改了同一个列表值。\")描述了上一个交互式 shell 示例中前七行所做的七次更改。\n\n![del 语句和 append() 方法在原地修改了同一个列表值。](img/httpatomoreillycomsourcenostarchimages2189599.png.jpg)\n\
  \n图 4-3。`del`语句和 `append()` 方法在原地修改了同一个列表值。\n\n更改可变数据类型的值（如上一个示例中 `del` 语句和 `append()`\
  \ 方法所做的那样）是在原地更改值的，因为变量的值没有被替换为新的列表值。\n\n可变类型与不可变类型之间似乎是一个没有意义的区分，但传递引用 将解释当用可变参数和不可变参数调用函数时的不同行为。但在之前，让我们了解一下元组数据类型，它是列表数据类型的不可变形式。\n\
  \n## 元组数据类型\n\n*元组*（tuple）数据类型与列表数据类型几乎相同，仅有两个不同。第一，元组使用圆括号 `(` 和 `)` 进行类型，而不是方括号\
  \ `[` 和 `]`。例如，在交互式 shell 程序中输入以下内容：\n\n```\n>>> eggs = ('hello', 42, 0.5)\n>>>\
  \ eggs[0]\n'hello'\n>>> eggs[1:3]\n(42, 0.5)\n>>> len(eggs)\n3\n```\n\n但元组与列表的主要区别在于，元组像字符串一样是不可变的。元组的值不能被修改、添加或删除。在交互式\
  \ shell 程序中输入以下内容，查看 `TypeError` 错误消息：\n\n```\n>>> eggs = ('hello', 42, 0.5)\n>>>\
  \ eggs[1] = 99\nTraceback (most recent call last):\n  File \"<pyshell#5>\", line\
  \ 1, in <module>\n    eggs[1] = 99\nTypeError: 'tuple' object does not support item\
  \ assignment\n```\n\n如果你的元组中只有一个值，可以通过在括号内的值后面添加一个尾随逗号来指示这一点。否则，Python 会认为你只是在普通括号内输入了一个值。逗号让\
  \ Python 知道这是一个元组值。（与某些其他编程语言不同，在 Python 中，列表或元组的最后一个项后带有尾随逗号是可以的。）在交互式 shell 程序中输入以下\
  \ `type()` 函数调用以查看区别：\n\n```\n>>> type(('hello',))\n<class 'tuple'>\n>>> type(('hello'))\n\
  <class 'str'>\n```\n\n你可以使用元组向任何阅读你代码的人传达：你不打算让该值序列发生变化。如果你需要一个永远不会改变的有序值序列，请使用元组。使用元组代替列表的第二个用处是，由于它们是不可变的且内容不改变，Python\
  \ 可以实现一些优化，使得使用元组的代码比使用列表的代码稍微快。\n\n## 使用 list() 和 tuple() 函数转换类型\n\n就像 `str(42)`\
  \ 会返回 `'42'`（整数 `42` 的字符串表示）一样，`list()` 和 `tuple()` 函数将返回传递给它们的值的列表和元组版本。在交互式 shell\
  \ 程序中输入以下内容，注意返回值与传递的值数据类型不同：\n\n```\n>>> tuple(['cat', 'dog', 5])\n('cat', 'dog',\
  \ 5)\n>>> list(('cat', 'dog', 5))\n['cat', 'dog', 5]\n>>> list('hello')\n['h', 'e',\
  \ 'l', 'l', 'o']\n```\n\n如果你需要元组值的可变版本，那么将元组转换为列表非常方便。\n\n## 引用\n\n正如你所见，变量存储字符串和整数值。在交互式\
  \ shell 程序中输入以下内容：\n\n```\n>>> spam = 42\n>>> cheese = spam\n>>> spam = 100\n>>>\
  \ spam\n100\n>>> cheese\n42\n```\n\n你将 `42` 赋值给 `spam`，然后将 `spam` 的值赋值给 `cheese`。当你之后将\
  \ `spam` 的值为 `100` 时，这不会影响 `cheese`。因为 `spam` 和 `cheese` 是存储不同值的不同变量。\n\n列表并不是这样工作的。当你将列表赋值给变量时，你实际上赋值的是列表引用。引用是指向某些列表的值。这里有一些代码可以使这种区别更容易理解。在交互式\
  \ shell 程序中输入：\n\n```\n➊ >>> spam = [0, 1, 2, 3, 4]\n➋ >>> cheese = spam\n➌ >>>\
  \ cheese[1] = 'Hello!'\n   >>> spam\n   [0, 'Hello!', 2, 3, 4]\n   >>> cheese\n\
  \   [0, 'Hello!', 2, 3, 4]\n```\n\n这看起来来说可能很奇怪。代码改变了 `cheese` 列表，但看起来 `spam` 和 `cheese`\
  \ 列表都改变了。\n\n当你创建列表 ➊，你在变量 `spam` 中赋值了一个引用。但下一行 ➋ 将 `spam` 中的列表引用赋值给 `cheese`，而不是列表值。这意味着\
  \ `spam` 和 `cheese` 存储的值指向同一个列表。只有一个列表，因为列表本身从未被复制。所以当你修改 `cheese` 的第一个元素 ➌ 时，你修改的是\
  \ `spam` 所引用的同一个列表。\n\n记住，变量就像包含值的盒子。本章之前的插图显示盒子中的列表并不准确，因为列表变量并不真正包含列表——它们包含列表的引用。这些引用会有\
  \ Python 内部使用的 ID 号，但你可以忽略它们。使用盒子作为变量的比喻，图 4-4 显示了将列表赋值给 `spam` 变量时发生的情况。\n\n\n\n\
  \n随后，在图 4-5 中，`spam` 中的引用被复制到 `cheese`。只创建了一个新的引用并存储在 `cheese` 中，而不是一个新的列表。注意看这两个引用都指向同一个列表。\n\
  \n![spam = cheese copies the reference, not the list.](img/httpatomoreillycomsourcenostarchimages2189603.png.jpg)\n\
  \n图 4-5. `spam = cheese` 复制了引用，而不是列表。\n\n当你修改 `cheese` 所引的列表时，`spam` 所引的列表也会发生改变，因为\
  \ `cheese` 和 `spam` 都指向同一个列表。你可以在图 4-6 中看到这一点。\n\n![cheese[1] = 'Hello!' modifies\
  \ the list that both variables refer to.](Images/httpatomoreillycomsourcenostarchimages2189605.png.jpg)\n\
  \n图 4-6. `cheese[1] = 'Hello!'` 修改了两个变量指向的列表。\n\n变量包含的是列表值的引用，而不是列表值本身。但对于字符串和整数值，变量直接包含字符串或整数值。当变量必须存储可变数据类型（如列表或字典）的值时，Python\
  \ 会一直使用引用。对于字符串、整数或元组等不可变数据类型的值，Python 变量将存储值本身。\n\n尽管 Python 变量在技术上包含对列表或字典值的引用，但人们经常会随口说变量包含了列表或字典。\n\
  \n## 传递引用\n\n引用对于理解参数如何传递给函数至关重要。当调用函数时，参数的值会被复制到参数变量中。对于列表（以及字典，我将在下一章中描述），这意味着参数使用了引用的副本。要看到这种做法产生的影响，请打开一个新的文件编辑器窗口，输入以下代码并将其保存为\
  \ `passingReference.py`：\n\n```python\ndef eggs(someParameter):\n    someParameter.append('Hello')\n\
  \nspam = [1, 2, 3]\neggs(spam)\nprint(spam)\n```\n\n注意，当调用 `eggs()` 时，并没有使用返回值来给\
  \ `spam` 赋新值。相反，它直接在原地修改了列表。运行该程序时，会产生以下输出：\n\n```\n[1, 2, 3, 'Hello']\n```\n\n\
  尽管 `spam` 和 `someParameter` 包含独立的引用，但它们都指向同一个列表。这就是为什么函数内部的 `append('Hello')` 方法调用在函数返回后仍然影响该列表。\n\
  \n请记住这种行为：忘记 Python 是这样处理列表和字典变量会导致困惑的 bug。\n\n## copy 模块的 copy() 和 deepcopy() 函数\n\
  \n虽然传递引用通常是处理列表和字典最方便的方法，但如果函数修改了传递的列表或字典，你可能不希望原始列表或字典值也发生这些变化。为此，Python 提供了一个名为\
  \ `copy` 的模块，该模块提供了 `copy()` 和 `deepcopy()` 函数。其中第一个 `copy.copy()` 可用于创建可变值（如列表或字典）的副本，而不仅仅是引用的副本。在交互式\
  \ shell 中输入以下内容：\n\n```python\n>>> import copy\n>>> spam = ['A', 'B', 'C', 'D']\n\
  >>> cheese = copy.copy(spam)\n>>> cheese[1] = 42\n>>> spam\n['A', 'B', 'C', 'D']\n\
  >>> cheese\n['A', 42, 'C', 'D']\n```\n\n现在 `spam` 和 `cheese` 变量指向的是独立的列表，这就是为什么在索引\
  \ `1` 处赋值 `42` 时，只有 `cheese` 中的列表被修改了。正如你在图 4-7 创建了第二个列表，可以独立于第一个进行修改.\")所示，两个变量的引用\
  \ ID 不再相同，因为它们指向的是独立的列表。\n\n![cheese = copy.copy(spam) creates a second list that\
  \ can be modified independently of the first.](img/httpatomoreillycomsourcenostarchimages2189607.png.jpg)\n\
  \n图 4-7. `cheese = copy.copy(spam)` 创建了第二个列表，可以独立于第一个进行修改。\n\n如果你需要复制的列表包含列表，请使用\
  \ `copy.deepcopy()` 函数代替 `copy.copy()`。`deepcopy()` 函数也会复制这些内部的列表。\n\n## 总结\n\n\
  列表是有用的数据类型，因为它们允许你编写在单个变量中处理多个可修改数量的值的代码。在书的后面部分，你将看到使用列表来完成那些在没有它们的情况下很难或无法完成的任务。\n\
  \n列表是可变的，这意味着它们的内容可以改变。元组和字符串虽然在某些方面类似于列表，但它们是不可变的，不能更改。包含元组或字符串值的变量可以被新的元组或字符串值覆盖，但这等同于修改本身。\n\
  \n## 练习题\n\n对于以下问题，假设 `spam` 包含 `['a', 'b', 'c', 'd']`。\n\n1. `[]` 是什么？\n2. 如何给名为\
  \ `spam` 的列表第三个值赋值为 `'c'`？\n3. `spam[-1]` 的求值是什么？\n4. `spam[:2]` 的求值是什么？\n\n假设 `bacon`\
  \ 包含 `[3.14, 'cat', True, 'cat']`。\n\n1. `bacon.index('cat')` 的求值是什么？\n2. `bacon.append(99)`\
  \ 让 `bacon` 的列表值变成了什么样？\n3. `bacon.remove('cat')` 让 `bacon` 的列表值变成了什么样？\n4. 列表拼接和列表复制的运算符是什么？\n\
  5. `append()` 和 `insert()` 列表方法有什么区别？\n6. 从列表中删除值的两种方法？\n7. 列举列表值与字符串值的一些相似之处。\n\
  10. 列表和元组的区别是什么？\n11. 如何输入只包含整数值 `42` 的元组值？\n12. 如何获取列表值的元组形式？\n13. 如何获取元组值的列表形式？\n\
  14. “包含”列表值的变量并不直接包含列表。它们包含的是什么？\n15. `copy.copy()` 和 `copy.deepcopy()` 有什么区别？\n\
  \n## 练习项目\n\n为了练习，编写程序完成以下任务。\n\n## 逗号代码\n\n假设你有一个这样的列表值：\n\n```python\nspam = ['apples',\
  \ 'bananas', 'tofu', 'cats']\n```\n\n编写一个函数，接受列表值作为参数，并返回一个字符串，其中所有项目用逗号和空格分隔，并在最后一个项目之前插入\
  \ *and*。例如，将之前的 `spam` 列表传递给该函数将返回 `'apples, bananas, tofu, and cats'`。但你的函数应该能够处理传递给它的任何列表值。\n\
  \n## 字符网格\n\n假设你有一个列表列表，其中内部列表的每个值都是单字符字符串，如下：\n\n\n\n\n\n```\ngrid = [['.', '.',\
  \ '.', '.', '.', '.'],\n        ['.', 'O', 'O', '.', '.', '.'],\n        ['O', 'O',\
  \ 'O', 'O', '.', '.'],\n        ['O', 'O', 'O', 'O', 'O', '.'],\n        ['.', 'O',\
  \ 'O', 'O', 'O', 'O'],\n        ['O', 'O', 'O', 'O', 'O', '.'],\n        ['O', 'O',\
  \ 'O', 'O', '.', '.'],\n        ['.', 'O', 'O', '.', '.', '.'],\n        ['.', '.',\
  \ '.', '.', '.', '.']]\n```\n\n你可以将 `grid[x][y]` 视为用文本字符绘制的“图片”中 `x` 和 `y` 坐标处的字符。`(0,\
  \ 0)` 原点位于左上角，`x` 坐标向右增加，`y` 坐标向下增加。\n\n复制上一个网格值，并编写代码使用它来打印该图像。\n\n```\n..OO.OO..\n\
  .OOOOOOO.\n.OOOOOOO.\n..OOOOO..\n...OOO...\n....O....\n```\n\n提示：你将需要嵌套循环来打印 `grid[0][0]`，然后是\
  \ `grid[1][0]`，然后是 `grid[2][0]`，以此类推，直到 `grid[8][0]`。这将完成第一行，然后打印换行符。接着你的程序应该打印\
  \ `grid[0][1]`，然后是 `grid[1][1]`，然后是 `grid[2][1]`，以此类推。程序最后打印的内容是 `grid[8][5]`。\n\
  \n此外，如果你不想在每次 `print()` 调用后自动打印换行，请记住向 `print()` 传递 `end` 关键字参数。\n\n# 第 5 章字典与数据结构\n\
  \n在本章中，我将介绍字典数据类型，它提供了一种灵活访问和组织数据的方法。然后，通过结合上一章中列表的知识，你将学习如何创建一个数据结构来模拟井字棋盘。\n\n\
  ## 字典数据类型\n\n与列表一样，`dictionary`（字典）是许多值的集合。但与列表的索引不同，字典的索引可以使用许多不同的数据类型，而不仅仅是整数。字典的索引被称为\
  \ `keys`（键），一个键及其关联的值被称为 `key-value pair`（键值对）。\n\n在代码中，字典用大括号 `{}` 定义。在交互式 shell\
  \ 中输入以下内容：\n\n```\n>>> myCat = {'size': 'fat', 'color': 'gray', 'disposition': 'loud'}\n\
  ```\n\n这会将一个字典赋值给变量 `myCat`。该字典的键是 `'size'`、`'color'` 和 `'disposition'`。这些键的值分别为\
  \ `'fat'`、`'gray'` 和 `'loud'`。你可以通过这些键来访问这些值：\n\n```\n>>> myCat['size']\n'fat'\n\
  >>> 'My cat has ' + myCat['color'] + ' fur.'\n'My cat has gray fur.'\n```\n\n字典仍然可以使用整数作为键，就像列表使用整数作为索引一样，但它们不必从\
  \ `0` 开始，可以是任何数字。\n\n```\n>>> spam = {12345: 'Luggage Combination', 42: 'The Answer'}\n\
  ```\n\n## 字典 vs 列表\n\n与列表不同，字典中的项是无序的。名为 `spam` 的列表中的第一个项是 `spam[0]`。但字典中没有“第一个”项。虽然项的顺序对于判断两个列表是否相同很重要，但在字典中，键值对的键入顺序并不重要。在交互式\
  \ shell 中输入以下内容：\n\n```\n>>> spam = ['cats', 'dogs', 'moose']\n>>> bacon = ['dogs',\
  \ 'moose', 'cats']\n>>> spam == bacon\nFalse\n>>> eggs = {'name': 'Zophie', 'species':\
  \ 'cat', 'age': '8'}\n>>> ham = {'species': 'cat', 'age': '8', 'name': 'Zophie'}\n\
  >>> eggs == ham\nTrue\n```\n\n由于字典是无序的，它们不能像列表那样进行切片。\n\n尝试访问字典中不存在的键将导致 `KeyError`\
  \ 错误消息，类似于列表的“超出范围”的 `IndexError` 错误消息。在交互式 shell 中输入以下内容，并注意由于没有 `'color'` 键而显示的错误消息：\n\
  \n```\n>>> spam = {'name': 'Zophie', 'age': 7}\n>>> spam['color']\nTraceback (most\
  \ recent call last):\n  File \"<pyshell#1>\", line 1, in <module>\n    spam['color']\n\
  KeyError: 'color'\n```\n\n虽然字典无序的，但你可以为键设置任意值，这一事实允许你以强大的方式组织数据。假设你想让程序存储关于朋友生日的数据。你可以使用一个字典，以名字为键，以生日为值。打开一个新的文件编辑器窗口并输入以下代码。将其保存为\
  \ `birthdays.py`。\n\n```\n➊ birthdays = {'Alice': 'Apr 1', 'Bob': 'Dec 12', 'Carol':\
  \ 'Mar 4'}\n\n   while True:\n       print('Enter a name: (blank to quit)')\n  \
  \     name = input()\n       if name == '':\n           break\n\n➋     if name in\
  \ birthdays:\n           print(name + 's birthday is on ' + birthdays[name])\nelse:\n\
  \           print('No record of that name')\n```\n\n## 检查字典是否存在某个键或值\n\n回顾上一章，`in`\
  \ 和 `not in` 运算符可以检查值是否存在于列表中。你也可以使用这些运算符来检查字典中是否存在某个键或值。在交互式 shell 中输入以下内容：\n\n\
  \n\n\n\n```\n>>> spam = {'name': 'Zophie', 'age': 7} \n>>> 'name' in spam.keys()\n\
  True \n>>> 'Zophie' in spam.values()\nTrue \n>>> 'color' in spam.keys()\nFalse \n\
  >>> 'color' not in spam.keys()\nTrue \n>>> 'color' in spam\nFalse\n```\n\n在上一个示例中，注意到\
  \ `'color' in spam` 本质上是 `'color' in spam.keys()` 的简写形式。情况总是如此的：如果你想检查某个值是否是（或不是）字典中的一个键，你可以直接对字典本身使用\
  \ `in`（或 `not in`）关键字。\n\n## `get()` 方法\n\n在访问某个键的值之前，先检查字典中是否存在该键是非常繁琐的。幸运的是，字典有一个\
  \ `get()` 方法，它接受两个参数：要检索的值的对应的键，以及当该键不存在时要返回的备用值。\n\n在交互式 shell 环境中输入以下内容：\n\n```\n\
  >>> picnicItems = {'apples': 5, 'cups': 2} \n>>> 'I am bringing ' + str(picnicItems.get('cups',\
  \ 0)) + ' cups.'\n'I am bringing 2 cups.' \n>>> 'I am bringing ' + str(picnicItems.get('eggs',\
  \ 0)) + ' eggs.'\n'I am bringing 0 eggs.'\n```\n\n因为 `picnicItems` 字典中没有 `'eggs'`\
  \ 键，`get()` 方法返回了默认值 `0`。如果不使用 `get()`，代码将产生错误信息，如下例所示：\n\n```\n>>> picnicItems\
  \ = {'apples': 5, 'cups': 2}\n>>> 'I am bringing ' + str(picnicItems['eggs']) +\
  \ ' eggs.'\nTraceback (most recent call last):\n  File \"<pyshell#34>\", line 1,\
  \ in <module>\n    'I am bringing ' + str(picnicItems['eggs']) + ' eggs.'\nKeyError:\
  \ 'eggs'\n```\n\n## `setdefault()` 方法\n\n你经常需要在字典的某个键尚没有值时，为该键设置一个值。代码看起来像这样：\n\n\
  ```\nspam = {'name': 'Pooka', 'age': 5}\nif 'color' not in spam:\n    spam['color']\
  \ = 'black'\n```\n\n`setdefault()` 方法提供了一种用一行代码完成此操作的方法。传递给方法的第一个参数要检查的键，第二个参数是如果该键不存在时在该键上设置的值。如果键已存在，`setdefault()`\
  \ 方法返回该键的值。在交互式 shell 环境中输入以下内容：\n\n```\n>>> spam = {'name': 'Pooka', 'age': 5}\n\
  >>> spam.setdefault('color', 'black')\n'black'\n>>> spam\n{'color': 'black', 'age':\
  \ 5, 'name': 'Pooka'}\n>>> spam.setdefault('color', 'white')\n'black'\n>>> spam\n\
  {'color': 'black', 'age': 5, 'name': 'Pooka'}\n```\n\n第一次调用 `setdefault()` 时，`spam`\
  \ 中的字典变为 `{'color': 'black', 'age': 5, 'name': 'Pooka'}`。该方法返回值 `'black'`，因为这现在是键\
  \ `'color'` 设置的值。当下次调用 `spam.setdefault('color', 'white')` 时，该键的值不会被改为 `'white'`，因为\
  \ `spam` 已经有一个名为 `'color'` 的键。\n\n`setdefault()` 方法是一个确保键存在的很好的快捷方法。这是一个简短的程序，用于统计字符串中每个字母出现的次数。打开文件编辑器窗口并输入以下代码，将其保存为\
  \ `characterCount.py`：\n\n```python\nmessage = 'It was a bright cold day in April,\
  \ and the clocks were striking thirteen.'\ncount = {}\n\nfor character in message:\n\
  \    count.setdefault(character, 0)\n    count[character] = count[character] + 1\n\
  \nprint(count)\n```\n\n该程序遍历 `message` 变量字符串中的每个字符，统计每个字符出现的频率。`setdefault()` 方法的调用确保了键在\
  \ `count` 字典中（默认值为 `0`），这样程序在执行 `count[character] = count[character] + 1` 时就不会抛出\
  \ `KeyError` 错误。当你运行这个程序时，输出将如下：\n\n```\n{' ': 13, ',': 1, '.': 1, 'A': 1, 'I':\
  \ 1, 'a': 4, 'c': 3, 'b': 1, 'e': 5, 'd': 3, 'g': 2, 'i':\n6, 'h': 3, 'k': 2, 'l':\
  \ 3, 'o': 2, 'n': 4, 'p': 1, 's': 3, 'r': 5, 't': 6, 'w': 2, 'y': 1}\n```\n\n从输出中你可以看到小写字母\
  \ *c* 出现了 3 次，空格字符出现了 13 次，大写字母 *A* 出现了 1 次。无论 `message` 变量中是什么字符串（即使很长），这个程序都能工作。\n\
  \n## 美化打印 (Pretty Printing)\n\n如果你导入 `pprint` 模块，就可以可以使用 `pprint()` 和 `format()`\
  \ 函数，它们可以“美化打印”字典。这在字典包含嵌套列表或字典时特别有用。如果你想获取美化的文本而不是在屏幕上显示，调用 `pprint()`。\n\n```python\n\
  import pprint\nmessage = 'It was a bright cold day in April, and the clocks were\
  \ striking thirteen.'\ncount = {}\n\nfor character in message:\n    count.setdefault(character,\
  \ 0)\n    count[character] = count[character] + 1\n\npprint.pprint(count)\n```\n\
  \n输出将如下：\n\n```\n{' ': 13, ',': 1, '.': 1, 'A': 1, 'I': 1, 'a': 4, 'c': 3, 'b':\
  \ 1, 'e': 5, 'd': 3, 'g': 2, 'i':\n6, 'h': 3, 'k': 2, 'l': 3, 'o': 2, 'n': 4, 'p':\
  \ 1, 's': 3, 'r': 5, 't': 6, 'w': 2, 'y': 1}\n```\n\n这两行代码是等价的：\n\n```python\nprint(pprint.pformat(count))\n\
  print(count)\n```\n\n## 使用数据结构建模现实世界\n\n在互联网出现之前，与世界另一端的人下国际棋是可能的。每位玩家在家里设置好国际象棋棋盘，并轮流邮寄明片描述每次移动。为了这一点，玩家需要一种能够无歧地描述棋盘的状态。在*记法*中，棋盘上的空间通过数字和字母来标识，如图\
  \ 5-1 所示。\n\n![国际象棋棋盘坐标](img/atomoreillycomsourcenarchimages2189609.png.jpg)\n\n\
  图 5-1 国际象棋棋盘坐标\n\n棋子通过字母标识：*K* 代表王、*Q* 代表后、*R* 代表车、*B* 代表主教以及 *N* 代表骑士。描述移动时使用棋子的字母和目的坐标。一对这样的移动描述了单回合（以白方先走）；例如记法\
  \ *2\\. Nf3 Nc6*。\n\n计算机的记忆力很好。现代计算机上的程序可以轻松存储数亿个像 `'2\\. Nf3 Nc6'` 这样的字符串。这就是计算机如何在没有物理棋盘的情况下玩国际象棋。它们建模数据来表示棋盘，你可以编写代码与该模型进行交互。在第一个示例中，你将使用一种比国际象棋更简单的游戏：井字棋。\n\
  \n## 井字棋盘\n\n\n\n\n井字格棋盘看起来像一个巨大的哈希符号（`#`），有九个格子，每个格子都可以包含一个 `X`、一个 `O` 或空白。要用字典来表示棋盘，你可以为每个格子分配一个字符串值键（key），如\
  \ 图 5-2 所示。\n\n你可以使用字符串值来表示棋盘上每个格子的内容：`'X'`、`'O'` 或 `' '`（一个空格字符）。因此，你需要存储九个字符串。你可以为此使用一个值字典。键为\
  \ `'top-R'` 的字符串值可以代表右上，键为 `'low-L'` 的字符串值可以代表左下角，键为 `'mid-M'` 的字符串值可以代表中间，以此此类推。\n\
  \n![井字格棋盘及其对应的键](img/httpatomoreillycomsourcenostarchimages2189611.png)\n\n图 5-2.\
  \ 井字格棋盘及其对应的键\n\n这个字典是一个表示井字格棋盘的数据结构。将这个以字典形式的棋盘存储在名为 `theBoard` 的变量中。打开一个新的文件编辑器窗口，输入以下源代码，并保存为\
  \ `ticTacToe.py`：\n\n```\ntheBoard = {'top-L': ' ', 'top-M': ' ', 'top-R': ' ',\n\
  \            'mid-L': ' ', 'mid-M': ' ', 'mid-R': ' ',\n            'low-L': ' ',\
  \ 'low-M': ' ', 'low-R': ' '}\n```\n\n存储在 `theBoard` 变量中的数据结构表示 图 5-3 所示的井字格棋盘。\n\
  \n![空的井字格棋盘](img/httpatomoreillycomsourcenostarchimages2189613.png)\n\n图 5-3. 一个空的井字格棋盘\n\
  \n由于 `theBoard` 中每个键的值都是空格字符串，因此这个字典表示一个完全空的棋盘。如果玩家 X 先手并选择了中间空格，你可以用这个字典来表示该棋盘：\n\
  \n```\ntheBoard = {'top-L': ' ', 'top-M': ' ', 'top-R': ' ',\n            'mid-L':\
  \ ' ', 'mid-M': 'X', 'mid-R': ' ',\n            'low-L': ' ', 'low-M': ' ', 'low-R':\
  \ ' '}\n```\n\n现在，`theBoard` 中的数据结构表示 图 5-4 所示的井字格棋盘。\n\n![第一步](img/httpatomoreillycomsourcenostarchimages2189615.png)\n\
  \n图 5-4. 第一步\n\n玩家 O 通过在顶排排满 `O` 获胜的棋盘可能像这样：\n\n```\ntheBoard = {'top-L': 'O', 'top-M':\
  \ 'O', 'top-R': 'O',\n            'mid-L': 'X', 'mid-M': 'X', 'mid-R': ' ',\n  \
  \          'low-L': ' ', 'low-M': ' ', 'low-R': 'X'}\n```\n\n现在，`theBoard` 中的数据结构表示\
  \ 图 5-5 所示的井字格棋盘。\n\n![玩家 O 获胜。](img/httpatomoreillycomsourcenostarchimages2189617.png)\n\
  \n图 5-5. 玩家 O 获胜。\n\n当然，玩家只能看到打印在屏幕上的内容，而不是变量的内容让我们创建一个函数将棋盘字典打印到屏幕上。在 `ticTacToe.py`\
  \ 中添加以下内容（新代码加粗）：\n\n```\ntheBoard = {'top-L': ' ', 'top-M': ' ', 'top-R': ' ',\n\
  \            'mid-L': ' ', 'mid-M': ' ', 'mid-R': ' ',\n            'low-L': ' ',\
  \ 'low-M': ' ', 'low-R': ' '}\ndef printBoard(board):\n    print(board['top-L']\
  \ + '|' + board['top-M'] + '|' + board['top-R'])\n    print('-+-+-')\n    print(board['mid-L']\
  \ + '|' + board['mid-M'] + '|' + board['mid-R'])\n    print('-+-+-')\n    print(board['low-L']\
  \ + '|' + board['low-M'] + '|' + board['low-R'])\nprintBoard(theBoard)\n```\n\n\
  当你运行此程序时，`printBoard()` 将打印出一个空白井字格棋盘。\n\n```\n| |\n-+-+-\n| |\n-+-+-\n| |\n```\n\
  \n`printBoard()` 函数可以处理传递给它的任何井字格数据结构。尝试将代码修改为如下内容：\n\n```\ntheBoard = {'top-L':\
  \ ' ', 'top-M': ' ', 'top-R': ' ',\n            'mid-L': ' ', 'mid-M': ' ', 'mid-R':\
  \ ' ',\n            'low-L': ' ', 'low-M': ' ', 'low-R': ' '}\ndef printBoard(board):\n\
  \    print(board['top-L'] + '|' + board['top-M'] + '|' + board['top-R'])\n    print('-+-+-')\n\
  \    print(board['mid-L'] + '|' + board['mid-M'] + '|' + board['mid-R'])\n    print('-+-+-')\n\
  \    print(board['low-L'] + '|' + board['low-M'] + '|' + board['low-R'])\nprintBoard(theBoard)\n\
  ```\n（注：此处原文示例代码逻辑似乎有重复或未完整，已按要求翻译内容并保持格式）\n\n*注：根据用户提供的原始文本，后半部分存在大量重复和混乱，翻译已根据逻辑进行了对齐。*\n\
  \n玩家 O 在顶排排满 `O` 获胜的棋盘可能像这样：\n\n```\ntheBoard = ...\nprintBoard(theBoard)\n```\n\
  \n现在当你运行此程序时，`printBoard()` 将打印出一个空白的井字格棋盘。\n\n```\ntheBoard = {'top-L': 'O', 'top-M':\
  \ 'O', 'top-R': 'O',\n            'mid-L': 'X', 'mid-M': 'X', 'mid-R': ' ',\n  \
  \          'low-L': ' ', 'low-M': ' ', 'low-R': 'X'}\n```\n\n（由于提供的待翻译文本后半部分存在严重的重复和逻辑混乱，以上翻译严格遵循了原文的结构，并确保了术语的准确性。）\n\
  \n\n\n```python\nallGuests = {'Alice': {'apples': 5, 'pretzels': 12},\n        \
  \        'Bob': {'ham sandwiches': 3, 'apples': 2},\n                'Carol': {'cups':\
  \ 3, 'apple pies': 1}}\n\ndef totalBrought(guests, item):\n    numBrought = 0\n\
  \    ➊ for k, v in guests.items():\n        ➋ numBrought = numBrought + v.get(item,\
  \ 0)\n    return numBrought\n\nprint('Number of things being brought:')\nprint('\
  \ - Apples         ' + str(totalBrought(allGuests, 'apples')))\nprint(' - Cups \
  \          ' + str(totalBrought(allGuests, 'cups')))\nprint(' - Cakes          '\
  \ + str(totalBrought(allGuests, 'cakes')))\nprint(' - Ham Sandwiches ' + str(totalBrought(allGuests,\
  \ 'ham sandwiches')))\nprint(' - Apple Pies     ' + str(totalBrought(allGuests,\
  \ 'apple pies')))\n```\n\n在 `totalBrought()` 函数内部，`for` 循环遍历了 `guests` 中的键值对 ➊。循环内部，访客的名字字符串被赋值给\
  \ `k`，他们要携带的野餐物品字典被赋值给 `v`。如果 `item` 参数作为键存在该字典，则它的值（数量）会被加到 `numBrought` 上 ➋。如果它作为键不存在，`get()`\
  \ 方法将返回 `0` 并加到 `numBrought`。\n\n该程序的输出如下：\n\n```\nNumber of things being brought:\n\
  - Apples 7\n- Cups 3\n- Cakes 0\n- Ham Sandwiches 3\n- Apple Pies     1\n```\n\n\
  这看起来可能是一个非常简单的建模任务，以至于你不需要费力编写一个程序来实现它。但请意识到，同一个 `totalBrought()` 函数可以轻松处理包含成千上万访客的字典，每个人携带成千上万种不同的野餐物品。在数据结构中存储这些信息并配合\
  \ `totalBrought()` 函数将为你节省大量时间！\n\n你可以以任何你喜欢的方式使用数据结构对事物进行建模，只要程序中的其他代码能够正确处理该数据模型即可。当你刚开始编程时，不要过于担心建模数据的“正确”方法。随着经验的增加，你可能会提出更高效的模型，但重要的是数据模型要符合你程序的需求。\n\
  \n## 总结\n\n在本章中，你学习了关于字典的所有知识。列表和字典都是可以包含多个值的类型，包括其他列表和字典。字典之所以有用，是因为你可以将一个项目（键）映射到另一个项目（值），而列表只是按顺序包含一系列值。字典内部的值使用方括号进行访问，这与列表一样。字典的不是整数索引，而是可以具有各种数据类型的键：整数、浮点数、字符串或元组。通过将程序的值组织到数据结构中，你可以创建现实世界对象的表示。你通过一个井棋盘的例子看到了这一点。\n\
