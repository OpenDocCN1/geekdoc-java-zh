  \ 'Richmond', 'Washington': 'Olympia', 'West\n   Virginia': 'Charleston', 'Wisconsin':\
  \ 'Madison', 'Wyoming': 'Cheyenne'}\n\n   # 生成 35 份测验文件。\nfor quizNum in range(35):\n\
  \       # TODO: 创建测验卷和答案密钥文件。\n\n       # TODO: 写入测验的头部。\n\n       # TODO: 随机排序州的顺序。\n\
  \n       # TODO: 遍历所有 50 个州，为每个州创建一个问题。\n```\n\n由于该程序将随机排序问题和答案，你需要导入 `random` 模块以使用它的函数。`capitals`\
  \ 变量包含一个美国州为键、其首府为值的字典。由于你想创建 35 份测验，实际生成测验卷和答案密钥文件的代码（目前标记为 `TODO` 注释）将放在一个循环 35\
  \ 次的 `for` 循环内部。（这个数字可以更改以生成任意数量的测验文件。）\n\n## 步骤 2：创建测验文件并随机排序问题顺序\n\n现在是时候填充那些\
  \ `TODO` 了。\n\n循环中的代码将重复 35 次——每份测验卷一次——所以你在循环中只需要考虑一次测验卷。首先，你将创建实际的测验文件。它需要一个唯一的文件名，并且还应该包含某种标准头部，留出供学生填写姓名、日期和班级的地方。然后，你需要获取一个随机排序的州列表，这之后可以用于创建测验的问题和答案。\n\
  \n向 `randomQuizGenerator.py` 中添加以下代码：\n\n```python\n#! python3\n   # randomQuizGenerator.py\
  \ - 创建问题和答案顺序随机的 \n   # 测验卷，以及答案密钥。\n\n   --snippet--\n\n   # 生成 35 份测验文件。\n   for\
  \ quizNum in range(35):\n       # 创建测验卷和答案密钥文件。\n       quizFile = open('capitalsquiz%s.txt'\
  \ % (quizNum + 1), 'w')\n       answerFile = open('capitalsquiz_answers%s.txt' %\
  \ (quizNum + 1), 'w')\n\n       # 写入测验的头部。\n       quizFile.write('Name:\\nDate:\\\
  nPeriod:\\n')\n       quizFile.write((' ' * 20) + 'State Capitals (Form %s)' % (quizNum\
  \ + 1))\n       quizFile.write('\\n')\n\n       # 随机排序州的顺序。\n       states = list(capitals.keys())\n\
  \       random.shuffle(states)\n\n       # 遍历所有 50 个州，为每个州创建一个问题。\n```\n\n测验卷的文件名将为\
  \ `capitalsquiz<N>.txt`，其中 `<N>` 是一个数字，字符串中的 `%s` 占位符将被 `(quizNum + 1)` 替换，因此创建的第一个测验卷和答案密钥将是\
  \ `capitalsquiz1.txt` 和 `capitalsquiz_answers1.txt`。这些文件通过调用 `open()` 并以 `'w'` 作为第二个参数来创建。`write()`\
  \ 语句创建测验头部。最后，通过 `random.shuffle()` 函数创建随机的州列表，该函数会重新排列传递给它的列表。\n\n## 步骤 3：创建答案选项\n\
  \n现在你需要为每个问题生成答案选项，即 A 到 D 的选项。你需要创建另一个 `for` 循环——这次用于生成测验中 50 个问题的内容。然后将嵌套第三个 `for`\
  \ 循环，为每个问题生成多选题选项。使你的代码如下：\n\n```python\n#! python3\n   # randomQuizGenerator.py\
  \ - 创建问题和答案顺序随机的 \n   # 测验卷，以及答案密钥。\n\n   --snippet--\n\n       # 遍历所有 50 个州，为每个州创建一个问题。\n\
  \       for questionNum in range(50):\n\n           # 获取正确和错误答案。\n           correctAnswer\
  \ = capitals[states[questionNum]]\n           wrongAnswers = list(capitals.values())\n\
  \           del wrongAnswers[wrongAnswers.index(correctAnswer)]\n           wrongAnswers\
  \ = random.sample(wrongAnswers, 3)\n           answerOptions = wrongAnswers + [correctAnswer]\n\
  \           random.shuffle(answerOptions)\n\n           # TODO: 将问题和答案选项写入测验文件。\n\
  \n           # TODO: 将答案密钥写入文件。\n```\n\n正确答案很容易获取——它存储在 `capitals` 字典的值中。这个循环将遍历随机排序的\
  \ `states` 列表，从 `states[0]` 到 `states[49]`，在 `capitals` 中查找每个州，并将其对应的首府存储在 `correctAnswer`\
  \ 中。\n\n\n\n可能的错误答案列表生成起来复杂一些。你可以通过复制 `capitals` 字典中的*所有*值 ➋，删除正确答案 ➌，并从该列表中随机选择三个值\
  \ ➍来获取它。`random.sample()` 函数可以轻松地完成这种选择。它的第一个参数是你想要从中选择的列表；第二个参数是你想要选择的值的数量。答案选项的完整列表是这三个错误答案与正确答案的组合\
  \ ➎。最后，需要对答案进行随机化 ➏，这样正确答案就不会始终是 D 。\n\n## 步骤 4：将内容写入测验文件和答案文件\n\n剩下的唯一工作就是将问题写入测验文件，将答案写入答案文件。让你的代码看起来如下：\n\
  \n```\n #! python3\n   # randomQuizGenerator.py - 创建具有随机顺序的问题和答案的\n   # 验，以及答案列表。\n\
  \n   --snip--\n       # 遍历所有 50 个州，为每个州创建一个问题。\n       for questionNum in range(50):\n\
  \           --snip--\n\n           # 将问题和答案选项写入测验文件。\n           quizFile.write('%s.\
  \ What is the capital of %s?\\n' % (questionNum + 1,\n               states[questionNum]))\n\
  ➊         for i in range(4):\n➋             quizFile.write(' %s. %s\\n' % ('ABCD'[i],\
  \ answerOptions[i]))\n           quizFile.write('\\n')\n\n           # 将答案列表写入文件。\n\
  ➌         answerKeyFile.write('%s. %s\\n' % (questionNum + 1, 'ABCD'[\n        \
  \      answerOptions.index(correctAnswer)]))\n       quizFile.close()\n       answerKeyFile.close()\n\
  ```\n\n遍历整数 `0` 到 `3` 的 `for` 循环将写入 `answerOptions` 列表中的答案选项 ➊。➋ 处的表达式 `'ABCD'[i]`\
  \ 将字符串 `'ABCD'` 视为数组，并在循环的每次迭代中分别求值为 `'A'`、`'B'`、`'C'` 和 `'D'`。\n\n在最后一行 ➌ 中，表达式\
  \ `answerOptions.index(correctAnswer)` 将在随机排序的答案中找到正确答案的整数索引，而 `'ABCD'[answerOptions.index(correctAnswer)]`\
  \ 将求值为正确答案的字母，并写入答案文件。\n\n运行程序后，你的 `capitalsquiz1.txt` 文件将像所示，不过取决于你 `random.shuffle()`\
  \ 用的结果，你的问题和答案选项可能与此处所示不同：\n\n```\nName:\n\nDate:\n\nPeriod:\n\n               \
  \     State Capitals Quiz (Form 1)\n\n1\\. What is the capital of West Virginia?\n\
  \    A. Hartford\n    B. Santa Fe\n    C. Harrisburg\n    D. Charleston\n\n2\\.\
  \ What is the capital of Colorado?\n    A. Raleigh\n    B. Harrisburg\n    C. Denver\n\
  \    D. Lincoln\n\n--snip--\n```\n\n对应的 `capitalsquiz_answers1.txt` 文本文件看起来如下：\n\
  \n```\n1\\. D\n2\\. C\n3\\. A\n4\\. C\n--snip--\n```\n\n## 项目：多剪贴板 (Multiclipboard)\n\
  \n假设你有一项枯燥的任务，需要在网页或带有多个文本字段的软件中填写许多表单。剪贴板可以让你避免重复输入相同的文本。但剪贴板一次只能有一个内容。如果你有几段不同的文本需要复制和粘贴，你就必须不断地选中并复制这几项。\n\
  \n你可以编写一个 Python 程序来跟踪多个段文本。这个“多剪贴板”将命名为 `mcb.pyw`（因为“mcb”比“multiclipboard”更容易输入）。`.pyw`\
  \ 扩展意味着 Python 在运行此程序时不会显示终端窗口。（详情请见附录 B。）\n\n程序会将每段剪贴板文本保存在一个关键字下。例如，当你运行 `py mcb.pyw\
  \ save spam` 时，剪贴板当前的内容将用关键字 `spam` 保存。之后可以通过运行 `py mcb.pyw spam` 将该文本重新加载到剪贴板。如果用户忘记了自己的关键词，可以运行\
  \ `py mcb.pyw list` 将所有关键字列表复制到剪贴板。\n\n以下是该程序的功能：\n\n* 检查用于关键字的命令行参数。\n* 如果参数是 `save`，则将剪贴板内容保存到关键字下。\n\
  * 如果参数是 `list`，则将所有关键字复制到剪贴板。\n* 否则，将关键字对应的文本复制到剪贴板。\n\n这意味着代码需要执行以下操作：\n\n* 从 `sys.argv`\
  \ 读取命令行参数。\n* 读取和写入剪贴板。\n* 保存和加载到架子文件（shelf file）。\n\n如果你使用 Windows，可以通过创建一个名为 `mcb.bat`\
  \ 的批处理文件轻松地从“运行...”窗口中运行此脚本：\n\n```\n@pyw.exe C:\\Python34\\mcb.pyw %*\n```\n\n\
  ## 步骤 1：注释和架子设置\n\n让我们从创建一个带有注释和基础设置的骨架脚本开始。让你的代码看起来如下：\n\n```\n #! python3\n  \
  \ # mcb.pyw - 保存和加载文本段。\n   # 用法: py.exe mcb.pyw <keyword> - 保存剪贴板。\n   #      \
  \  py.exe mcb.pyw <keyword> - 加载剪贴板。\n   #        py.exe mcb.pyw list - 列出关键字。\n\
  \n➋ import shelve, pyperclip, sys\n\n➌ mcbShelf = shelve.open('mcb')\n\n   # TODO:\
  \ 保存剪贴板内容。\n   # TODO: 列出关键字并加载内容。\n\n   mcbShelf.close()\n```\n\n将通用用法放在文件顶部的注释中\
  \ 是一项常见的做法 ➊。如果你忘记了如何运行脚本，请查看这些 ➋。架子文件将是 `mcb` ➌。\n\n## 步骤 2：使用关键字保存剪贴板内容\n\n程序会根据用户是想将文本保存到关键字、将文本加载到剪贴板还是列出所有关键字来执行不同的操作。我们先处理这部分。让你的代码看起来如下：\n\
  \n```\n #! python3\n   # mcb.pyw - 保存和加载文本段。\n   --snip--\n\n   # 保存剪贴板内容。\nif len(sys.argv)\
  \ == 3 and sys.argv[1].lower() == 'save':\n         mcbShelf[sys.argv[2]] = pyperclip.paste()\n\
  elif len(sys.argv) == 2:\n    # TODO: 列出关键字并加载内容。\n\n   mcbShelf.close()\n```\n\n\
  如果第一个命令行参数（位于 `sys.argv` 列表的 `1` 处）是 `'save'` ➊，第二个命令行参数就是剪贴板内容的关键字。关键字将用作 `mcbShelf`\
  \ 的键，值将是当前剪贴板上的文本 ➋。\n\n如果只有一个命令行参数，你假设它是 `'list'` 或要加载到剪贴板的关键字。我们稍后会实现该代码。现在只需在那里放置一个\
  \ `TODO` 注释即可 ➌\n\n## 步骤 3：列关键字并加载关键字内容\n\n最后，让我们实现剩下的两种情况：用户想要从关键字加载剪贴板文本，或者想要可用关键字的列表。让你的代码看起来如下：\n\
  \n```\n #! python3\n   # mcb.pyw - 保存和加载文本段。\n   --snip--\n\n   # 保存剪贴板内容。\n   if\
  \ len(sys.argv) == 3 and sys.argv[1].lower() == 'save':\n         mcbShelf[sys.argv[2]]\
  \ = pyperclip.paste()\n   elif len(sys.argv) == 2:\n       # 列出关键字并加载内容。\nif sys.argv[1].lower()\
  \ == 'list':\n     pyperclip.copy(str(list(mcbShelf.keys())))\n   elif sys.argv[1]\
  \ in mcbShelf:\n     pyperclip.copy(mcbShelf[sys.argv[1]])\n\n   mcbShelf.close()\n\
  ```\n\n\n\n\n\n如果只有一个命令行参数，首先让我们检查它是否为 `'list'` ➊。如果是的话，书架键列表的字符串表示将被复制到剪贴板中 ➋。用户可以将此列表粘贴到打开的文本编辑器中进行阅读。\n\
  \n否则，你可以假设命令行参数是一个关键字。如果该关键字在 `mcbShelf` 书架中作为键存在，你可以将该值加载到剪贴板中 ➌。\n\n就是这样！根据你计算机使用的操作系统，启动此程序的步骤有所不同。有关你操作系统的详情，请参附录\
  \ B。\n\n回想你在第 6 章 中创建的密码锁程序，它将密码存储在字典中。更新密码需要修改程序的源代码。这并不理想，因为普通用户并不擅长通过修改源代码来更新软件。此外，每当你修改程序的源代码时，都面临着意外引入新\
  \ bug 的风险。通过将程序数据存储在与代码不同的地方，你可以让程序更容易供他人使用，并且更具抗性。\n\n## 总结\n\n文件被组织在文件夹（也称为目录）中，路径描述了文件的位置。在你计算机上运行的每个程序都有一个当前工作目录，这允许你指定相对于当前位置的文件路径，而无需始终输入完整（或绝对）路径。`os.path`\
  \ 模块有许多处理文件路径的函数。\n\n你的程序还可以直接与文本文件的内容交互。`open()` 函数可以打开这些文件，将其内容读取为一个大字符串（使用 `read()`\
  \ 方法）或一个字符串列表（使用 `readlines()` 方法）。`open()` 函数可以以写模式或追加模式打开文件，分别创建新的文本文件或向现有的文本文件添加内容。\n\
  \n在之前的章节中，你使用剪贴板作为向程序输入大量文本的方法，而不是全部手动输入。现在，你可以让程序直接从硬盘读取文件，这是一个巨大的改进，因为文件比剪贴板要稳定得多。\n\
  \n在下一章中，你将学习如何处理文件本身，通过复制、删除、重命名、移动文件等操作。\n\n## 练习题\n\n| Q: | 1\\. 相对路径是相对于什么的？\
