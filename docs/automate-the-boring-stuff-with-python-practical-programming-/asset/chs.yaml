  ***\n\n^([2]) 答案是否。\n\n# 第 12 章。处理 Excel 电子表格\n\nExcel 是 Windows 上流行且强大的电子表格应用程序。`openpyxl`\
  \ 模块允许你的 Python 程序读取和修改 Excel 电子表格文件。例如，你可能有一项枯燥的任务：从一个电子表格复制某些数据并将其粘贴到另一个中。或者你可能需要遍历数千行，根据某些标准筛选出其中几行进行细幅编辑。或者你可能需要查看数百份部门预算表格，寻找任何赤字的项目。这些正是\
  \ Python 可以为你完成的这类枯燥、机械的电子表格任务。\n\n尽管 Excel 是微软的专有软件，但在 Windows、OS X 和 Linux 上有许多免费替代方案。LibreOffice\
  \ Calc 和 OpenOffice Calc 都支持 Excel 的 `.xlsx` 电子表格格式，这意味着 `openpyxl` 模块也可以处理这些应用程序的电子表格。你可以分别从\
  \ `https://www.libreoffice.org/` 和 `http://www.openoffice.org/` 下载软件。即使你的电脑上已经安装了\
  \ Excel，你可能会发现这些程序更容易使用。不过，本章中的截图全部来自 Windows 7  Excel 2010。\n\n# Excel 文档\n\n首先，让我们过一下基本定义：Excel\
  \ 表格文档被称为 `workbook`（工作簿）。单个工作簿保存在扩展名为 `.xlsx` 的文件中。每个工作簿可以包含多个 `sheets`（也称为工作表）。用户当前查看（或在关闭\
  \ Excel 前最后查看）的工作表被称为 `active sheet`（活动工作表）。\n\n每个工作表都有 `columns`（用从 A 开始的字母命名）和\
  \ `rows`（用从 1 开始的数字命名）。特定列和行的框被称为 `cell`（单元格）。每个单元格可以包含数字或文本值。带有数据的单元格网格构成了一个工作表。\n\
  \n# 安装 openpyxl 模块\n\nPython 不带 OpenPyXL，因此你必须安装它。请遵循附录 A 中安装第三方模块的说明；该模块的名称为 `openpyxl`。要测试是否安装正确，请在交互式\
  \ shell 中输入以下：\n\n```\n>>> import openpyxl\n```\n\n如果模块安装正确，这不会产生任何错误消息。记住在运行本章中的交互式\
  \ shell 示例之前导入 `openpyxl` 模块，否则你将得到 `NameError: name 'openpyxl' is not defined`\
  \ 错误。\n\n本书涵盖了 OpenPyXL 的 2.1.4 版本，但 OpenPyXL 团队经常发布新版本。不过担心：新版本在很长一段时间内应该与本书中的指令保持后兼容。如果你有更新版本并想查看可以使用哪些额外功能，可以在\
  \ `http://openpyxl.readthedocs.org/` 查看 OpenPyXL 的完整文档。\n\n# 读取 Excel 文档\n\n本章的示例将使用存储在根目录下的名为\
  \ `example.xlsx` 的电子表格。你可以自己创建电子表格，也可以从 `http://nostarch.com/automatestuff/` 下载。图\
  \ 12-1 显示了 Excel 为新工作簿自动提供的三个默认工作表标签：`Sheet1`、`Sheet2` 和 `Sheet3`。（创建默认工作表的数量可能根据操作系统和电子表格程序而异。）\n\
  \n![工作簿工作表的标签位于 Excel 的左下角。](img/httpatomoreillycom)\n\n现在我们已经有了电子表格，让我们看看如何使用 `openpyxl`\
  \ 模块来操作它。\n\n## 使用 OpenXL 打开 Excel 文档\n\n一旦导入了 `openpyxl` 模块，你就可以使用 `openpyxl.load_workbook()`\
  \ 函数。在交互式 shell 中输入以下：\n\n```\n>>> import openpyxl\n>>> wb = openpyxl.load_workbook('example.xlsx')\n\
  >>> type(wb)\n<class 'openpyxl.workbook.workbook.Workbook'>\n```\n\n`openpyxl.load_workbook()`\
  \ 函数接收文件名并返回 `workbook` 数据类型的值。这个 `Workbook` 对象代表 Excel 文件，类似于 `File` 对象代表已打开的文本文件。\n\
  \n记住，`example.xlsx` 需要位于当前工作目录下才能对其进行操作。你可以通过导入 `os` 并使用 `os.getcwd()` 获取当前工作目录，并可以使用\
  \ `os.chdir()` 更改当前工作目录。\n\n## 从工作簿获取工作表\n\n你可以通过调用 `get_sheet_names()` 方法获取工作簿中所有工作表的列表。在交互式\
  \ shell 中输入以下：\n\n```\n>>> import openpyxl\n>>> wb = openpyxl.load_workbook('example.xlsx')\n\
  >>> wb.get_sheet_names()\n['Sheet1', 'Sheet2', 'Sheet3']\n>>> sheet = wb.get_sheet_by_name('Sheet3')\n\
  >>> sheet\n<Worksheet \"Sheet3\">\n>>> type(sheet) <class 'openpyxl.worksheet.worksheet.Worksheet'>\n\
  >>> sheet.title\n'Sheet3'\n>>> anotherSheet = wb.get_active_sheet()\n>>> anotherSheet\n\
  <Worksheet \"Sheet1\">\n```\n\n\n\n\n\n每个工作表都由一个 `Worksheet` 对象表示，你可以通过向工作簿方法 `get_sheet_by_name()`\
  \ 传递表名称字符串来获取它。最后，你可以调用 `Workbook` 对象的 `get_active_sheet()` 方法获取工作簿的活动工作表。活动工作表是在\
  \ Excel 中打开工作簿时显示在顶部的表。一旦你有了 `Worksheet` 对象，就可以从 `title` 属性获取它的名称。\n\n## 从表中获取单元格\n\
  \n一旦你拥有了 `Worksheet` 对象，就可以通过名称访问 `Cell` 对象。在交互式 shell 中输入以下内容：\n\n```\n>>> import\
  \ openpyxl\n>>> wb = openpyxl.load_workbook('example.xlsx')\n>>> sheet = wb.get_sheet_by_name('Sheet1')\n\
  >>> sheet['A1']\n<Cell Sheet1.A1>\n>>> sheet['A1'].value\ndatetime.datetime(2015,\
  \ 4, 5, 13, 34, 2)\n>>> c = sheet['B1']\n>>> c.value\n'Apples'\n>>> 'Row ' + str(c.row)\
  \ + ', Column ' + c.column + ' is ' + c.value\n'Row 1, Column B is Apples'\n>>>\
  \ 'Cell ' + c.coordinate + ' is ' + c.value\n'Cell B1 is Apples'\n>>> sheet['C1'].value\n\
  73\n```\n\n`Cell` 对象有一个 `value` 属性，意而不用说，它包含了存储在该单元格中的值。`Cell` 对象还有 `row`、`column`\
  \ 和 `coordinate` 属性提供了单元格的位置信息。\n\n在这里，访问单元格 B1 的 `Cell` 对象的 `value` 属性会得到字符串 `'Apples'`。`row`\
  \ 属性返回整数 `1`，`column` 属性返回 `'B'`，而 `coordinate` 属性返回 `'B1'`。\n\nOpenPyXL 会自动解释 A\
  \ 列中的日期，并将它们返回为 `datetime` 值而不是字符串。`datetime` 数据类型将在 第 16 章 中进一步解释。\n\n通过字母指定列在编程时可能比较困难，尤其是因为在\
  \ Z 列之后，列开始使用两个字母：AA、AB、AC 等。作为替代方案，你也可以使用工作表的 `cell()` 方法并为 `row` 和 `column` 关键字参数传递整数来获取单元格。第一行或第一列的整数是\
  \ `1`，而不是 `0`。通过输入以下内容继续交互式 shell ：\n\n```\n>>> sheet.cell(row=1, column=2)\n<Cell\
  \ Sheet1.B1>\n>>> sheet.cell(row=1, column=2).value\n'Apples'\n>>> for i in range(1,\
  \ 8, 2):\n        print(i, sheet.cell(row=i, column=2).value)\n\n1 Apples\n3 Pears\n\
  5 Apples\n7 Strawberries\n```\n\n如所示，使用工作表的 `cell()` 方法并传递 `row=1` 和 `column=2`\
  \ 可以获取单元格 `B1` 的 `Cell` 对象，这与指定 `sheet['B1']` 是一样的。然后，使用 `cell()` 方法及其关键字参数，你可以编写一个\
  \ `for` 循环来打印一系列单元格的值。\n\n假设你想在 B 列向下移动并打印每个行号为奇数的单元格的值。通过向 `range()` 函数的“step”参数传递\
  \ `2`，你可以获取每隔行的单元格（在这种情况下，是所有奇数行）。`for` 循环的变量 `i` 被传递给 `cell()` 方法的 `row` 关键字参数，而\
  \ `2` 始终传递给 `column` 关键字参数。注意传递的是整数 `2`，字符串 `'B'`。\n\n你可以使用 `Worksheet` 对象的 `get_highest_row()`\
  \ 和 `get_highest_column()` 方法确定工作表的大小。在交互式 shell 中输入以下内容：\n\n```\n>>> import openpyxl\n\
  >>> wb = openpyxl.load_workbook('example.xlsx')\n>>> sheet = wb.get_sheet_by_name('Sheet1')\n\
  >>> sheet.get_highest_row()\n7\n>>> sheet.get_highest_column()\n3\n```\n\n注意，`get_highest_column()`\
  \ 方法返回的是整数，而不是 Excel 中显示的字母。\n\n## 列字母与数字之间的转换\n\n要从字母转换为数字，调用 `openpyxl.cell.column_index_from_string()`\
  \ 函数。要从数字转换为字母，调用 `openpyxl.cell.get_column_letter()` 函数。在交互式 shell 中输入以下内容：\n\n\
  ```\n>>> import openpyxl\n>>> from openpyxl.cell import get_column_letter, column_index_from_string\n\
  >>> get_column_letter(1)\n'A'\n>>> get_column_letter(2)\n'B'\n>>> get_column_letter(27)\n\
  'AA'\n>>> get_column_letter(900)\n'AHP'\n>>> wb = openpyxl.load_workbook('example.xlsx')\n\
  >>> sheet = wb.get_sheet_by_name('Sheet1')\n>>> get_column_letter(sheet.get_highest_column())\n\
  'C'\n>>> column_index_from_string('A')\n1\n>>> column_index_from_string('B')\n2\n\
  >>> column_index_from_string('AA')\n27\n>>> column_index_from_string('AHP')\n900\n\
  ```\n\n\n\n\n要访问某个特定的元组，可以通过其在较大元组中的索引来引用。例如，要获取代表 B 列的元组，你可以使用 `sheet.columns[1]`。要获取包含\
  \ A 列中 `Cell` 对象的元组，你应该使用 `sheet.columns[0]`。一旦你有了代表某行或某列的元组，就可以遍历它的 `Cell` 对象并打印它们的值。\n\
  \n## 工作簿、工作表、单元格\n\n作为快速复习，这里列出了从电子表格文件中读取单元格时涉及的所有函数、方法和数据类型：\n\n1. 导入 `openpyxl`\
  \ 模块。\n2. 调用 `openpyxl.load_workbook()` 函数。\n3. 获取一个 `Workbook` 对象。\n4. 调用工作簿方法\
  \ `get_active_sheet()` 或 `get_sheet_by_name()`。\n5. 获取一个 `Worksheet` 对象。\n6. 使用索引或带有\
  \ `row` 和 `column` 关键字的 `cell()` 工作表方法。\n7. 获取一个 `Cell` 对象。\n8. 读取 `Cell` 对象的 `value`\
  \ 属性。\n\n# 项目：从电子表格读取数据\n\n假设你有一份 2010 年美国人口普查数据的电子表格，你有一项枯燥的任务：遍历其数千行，统计每个县的总人口和人口普区数量。（人口普区只是为了人口普查目的而定义的地理区域。）每一行代表一个人口普区。我们将电子表格文件命名为\
  \ `censuspopdata.xlsx`，你可以从 `[http://nostarch.com/automatestuff/]` 下载它。它的内容所示 图\
  \ 12-2。\n\n![censuspopdata.xlsx 电子表格](img/httpatomoreillycomsourcenostarchimages2189661.png)\n\
  \n图 12-2. `censuspopdata.xlsx` 电子表格\n\n尽管 Excel 可以计算多个选中单元格的和，但你仍然需要为 3000 多个县选择单元格。即使手动计算一个县的人口只需要几秒钟，处理整个表格也需要几个小时。\n\
  \n在这个项目中，你将编写一个脚本，该脚本可以在几秒钟内从普表格文件读取并计算每个县的统计数据。\n\n这是你的程序的功能：\n\n* 从 Excel 电子表格读取数据。\n\
  * 统计每个县的人口普区数量。\n* 统计每个县的总人口。\n* 打印结果。\n\n这意味着你的代码需要完成以下操作：\n* 使用 `openpyxl` 模块打开并读取\
  \ Excel 文档的单元格。\n* 计算所有的区域和人口数据并将其存储在数据结构中。\n* 使用 `pprint` 模块将数据结构写入扩展名为 `.py` 的文本文件中。\n\
  \n## 步骤 1：读取电子表格数据\n\n`censuspopdata.xlsx` 电子表格只有一个工作表，名为 `'Population by Census\
  \ Tract'`，每行都包含一个人口普区的数据。列分别是普区编号 (A)、州缩写 (B)、县名 (C) 和普区的人口 (D)。\n\n打开一个新的文件编辑器窗口并输入以下代码。将文件保存为\
  \ `readCensusExcel.py`。\n\n```\n #! python3\n   # readCensusExcel.py - 统计每个县的人口和人口普区数量。\n\
  \n➊ import openpyxl, pprint\n   print('Opening workbook...')\n➋ wb = openpyxl.load_workbook('censuspopdata.xlsx')\n\
  ➌ sheet = wb.get_sheet_by_name('Population by Census Tract')\n   countyData = {}\n\
  \n   # TODO: 用每个县的人口和普区数量填充 countyData。\n   print('Reading rows...')\n➍ for row\
  \ in range(2, sheet.get_highest_row() + 1):\n       # 电子表格中的每一行都包含一个人口普区的数据。\n \
  \      state  = sheet['B' + str(row)].value\n       county = sheet['C' + str(row)].value\n\
  \       pop    = sheet['D' + str(row)].value\n\n   # TODO: 打开一个新的文本文件并将 countyData\
  \ 的内容写入其中。\n```\n\n这段代码导入了 `openpyxl` 模块，以及用于打印最终县数据的 `pprint` 模块 ➊。然后它打开 `censuspopdata.xlsx`\
  \ 文件 ➋，获取包含普查数据的工作表 ➌，并开始遍历其行 ➍。\n\n注意，你还创建了一个名为 `countyData` 的变量，它将包含你为每个县计算的人口和普区数量。但在存储任何内容之前，你应该确定你将如何构造其中的数据。\n\
  \n## 步骤 2：填充数据结构\n\n存储在 `countyData` 中的数据结构是以州缩写为键的字典。每个州缩写将映射到另一个字典，其键是该州县名的字符串。每个县名反过来映射到一个仅包含两个键\
  \ `'tracts'` 和 `'pop'` 的字典。这些键对应每个县的人口普区数量和人口。\n\n\n\n\n当 `for` 循环完成后，`countyData`\
  \ 字典将包含所有人口和普区信息，并以县和州作为键（key）。此时，你可以编写更多代码来将这些内容写入文本文件或另一个 Excel 表格。现在，让我们先使用 `pprint.pformat()`\
  \ 函数将 `countyData` 字典的值作为一个巨大的字符串写入到名为 `census2010.py` 的文件中。请将以下代码添加到程序的末尾（确保该代码处于**未缩进**状态，以确保它仍然保持在\
  \ `for` 循环之外）：\n\n```python\n#! python 3\n# readCensusExcel.py - Tabulates population\
  \ and number of census tracts for\n# each county.\n--snip--\n\nfor row in range(2,\
  \ sheet.get_highest_row() + 1):\n--snip--\n\n# Open a new text file and write the\
  \ contents of countyData to it.\nprint('Writing results...')\nresultFile = open('census2010.py',\
  \ 'w')\nresultFile.write('allData = ' + pprint.pformat(countyData))\nresultFile.close()\n\
  print('Done.')\n```\n\n`pprint.pformat()` 函数生成的字符串本身格式化为有效的 Python 代码。通过将其输出到名为\
  \ `census2010.py` 的文本文件中，你已经从你的 Python 程序中生成了一个 Python 程序！这看起来可能很复杂，但优势在于你现在可以像导入其他\
  \ Python 模块一样导入 `census2010.py`。在交互式 shell 中，将当前工作目录更改包含新创建的 `census2010.py` 文件的文件夹（在我的笔记本电脑上，路径为\
  \ `C:\\Python34`），然后导入它：\n\n```python\n>>> import os\n>>> os.chdir('C:\\\\Python34')\n\
  >>> import census2010\n>>> census2010.allData['AK']['Anchorage']\n{'pop': 291826,\
  \ 'tracts': 55}\n>>> anchoragePop = census2010.allData['AK']['Anchorage']['pop']\n\
  >>> print('The 2010 population of Anchorage was ' + str(anchoragePop))\nThe 2010\
  \ population of Anchorage was 291826\n```\n\n`readCensusExcel.py` 程序是一次性的代码：一旦你将其结果保存到\
  \ `census2010.py`，就不再需要再次运行该程序了。每当你需要县数据时，只需运行 `import census2010` 即可。\n\n手动计算这些数据需要几个小时；而这个程序在几秒钟就完成了。使用\
  \ OpenPyXL，你将轻松地提取保存到 Excel 表格的信息并对其进行计算。你可以从 `[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)`\
  \ 下载完整的程序。\n\n## 类似程序的创意\n\n许多企业和办公室使用 Excel 存储各种类型的数据，表格变得庞大且难以处理并不罕见。任何解析 Excel\
  \ 表格的程序都有相似的结构：它加载表格文件，准备一些变量或数据结构，然后遍历表格中的每一行。这样的程序可以执行以下操作：\n\n*   比较表格中多行之间的数据。\n\
  *   打开多个 Excel 文件并比较表格之间的数据。\n*   检查表格是否有空行或任何单元格中的无效数据，如果有，则提醒用户。\n*   从表格中读取数据并将其作为你\
  \ Python 程序的输入。\n\n# 写入 Excel 文档\n\nOpenPyXL 还提供了写入数据的方法，这意味着你的程序可以创建和编辑表格文件。使用\
  \ Python 创建包含数千行数据的表格非常简单。\n\n## 创建并保存 Excel 文档\n\n调用 `openpyxl.Workbook()` 函数来创建一个新的、空白的\
  \ `Workbook` 对象。在交互式 shell 中输入以下内容：\n\n```python\n>>> import openpyxl\n>>> wb =\
  \ openpyxl.Workbook()\n>>> wb.get_sheet_names()\n['Sheet']\n>>> sheet = wb.get_active_sheet()\n\
  >>> sheet.title\n'Sheet'\n>>> sheet.title = 'Spam Bacon Eggs Sheet'\n>>> wb.get_sheet_names()\n\
  ['Spam Bacon Eggs Sheet']\n```\n\n工作簿将从一个名为 `Sheet` 的工作表开始。你可以通过在其 `title` 属性中存储新字符串来更改工作表的名称。\n\
  \n每当你修改 `Workbook` 对象或其工作表和单元格时，在调用 `save()` 工作方法之前，表格文件都不会保存。在交互式 shell 中输入以下内容（假设当前工作目录下有\
  \ `example.xlsx`）：\n\n```python\n>>> import openpyxl\n>>> wb = openpyxl.load_workbook('example.xlsx')\n\
  >>> sheet = wb.get_active_sheet()\n>>> sheet.title = 'Spam Spam Spam'\n>>> wb.save('example_copy.xlsx')\n\
  ```\n\n在这里，我们更改了工作表的名称。为了保存更改，我们将文件名作为字符串传递给 `save()` 方法。传递与原始文件不同的文件名（例如 `'example_copy.xlsx'`），会将更改保存到表格的副本中。\n\
  \n每当你编辑从文件加载的表格时，都应该将新的、编辑过的表格保存为与原始文件不同的文件名。这样，如果代码中的 bug 导致新保存的文件包含错误或损坏的数据，你仍然有一个原始表格文件可以使用。\n\
  \n## 创建和删除工作表\n\n可以使用 `create_sheet()` 和 `remove()` 方法向工作簿中添加和删除工作表。在交互式 shell 中输入以下：\n\
  \n```python\n>>> import openpyxl\n>>> wb = openpyxl.Workbook()\n>>> wb.get_sheet_names()\n\
  ['Sheet']\n>>> wb.create_sheet()\n<Worksheet \"Sheet1\">\n>>> wb.get_sheet_names()\n\
  ['Sheet', 'Sheet1']\n>>> wb.create_sheet(index=0, title='First Sheet')\n<Worksheet\
  \ \"First Sheet\">\n>>> wb.get_sheet_names()\n['First Sheet', 'Sheet1']\n>>> wb.create_sheet(index=2,\
  \ title='Middle Sheet')\n<Worksheet \"Middle Sheet\">\n>>> wb.get_sheet_names()\n\
  ['First Sheet', 'Sheet', 'Middle Sheet', 'Sheet1']\n```\n\n`create_sheet()` 方法返回一个名为\
  \ `SheetX` 的新 `Worksheet` 对象，默认设置为工作簿中的最后一个。可以通过 `index` 和 `title` 关键字指定新工作表的索引和名称。\n\
  \n通过输入以下继续示例：\n\n```python\n>>> wb.get_sheet_names()\n['First Sheet', 'Sheet', 'Middle\
  \ Sheet', 'Sheet1']\n>>> wb.remove_sheet(wb.get_sheet_name('Middle Sheet'))\n>>>\
  \ wb.remove_sheet(wb.get_sheet_name('Sheet1'))\n>>> wb.get_sheet_names()\n['First\
  \ Sheet', 'Sheet']\n```\n\n`remove_sheet()` 方法接受一个 `Worksheet` 对象而不是工作表的名称字符串作为参数。如果你只知道要删除的工作表的名称，调用\
  \ `get_sheet_name()` 并将其返回值传递给 `remove_sheet()`。\n\n在工作簿中添加或删除工作表后，记得调用 `save()`\
  \ 方法保存更改。\n\n## 向单元格写入值\n\n向单元格写入值非常像向字典键写入值。在交互式 shell 中输入：\n\n```python\n>>> import\
  \ openpyxl\n>>> wb = openpyxl.Workbook()\n>>> sheet = wb.get_sheet_by_name('Sheet')\n\
  >>> sheet['A1'] = 'Hello world!'\n>>> sheet['A1'].value\n'Hello world!'\n```\n\n\
  如果你有单元格坐标的字符串，可以像字典键一样使用它来指定要写入的单元格。\n\n# 项目：更新表格\n\n在这个项目中，你将编写一个程序来更新产品销售表格中的单元格。你的程序将遍历表格，找到特定的农产品并更新它们的价格。从\
  \ `[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)` 下载此表格。图\
  \ 12-3 显示了表格的样子。\n\n![A spreadsheet of produce sales](img/httpatomoreillycomsourcenostarchimages2189663.png.jpg)\n\
  \n图 12-3. 一个产品销售表格\n\n\n\n\n每行代表单笔销售。列分别是销售的农产品类型 (A)、该农产品每磅的成本 (B)、销售的磅数 (C) 以及销售总额\
  \ (D)。`TOTAL` 列设置为 Excel 公式 `*=ROUND(B3*C3, 2)*`，它将每磅成本乘以销售磅数，并将结果四舍五入到最的小数位。使用此公式，如果\
  \ B 列或 C 列发生变化，`TOTAL` 列中的单元格将自动更新。\n\n现在想象一下，大蒜、芹菜和柠檬的价格输入错误，导致你面临一项无聊的任务：遍历此电子表格中的数千行，更新任何大蒜、芹菜或柠檬行的每磅成本。你无法无法对价格进行简单的查找和替换，因为可能有其他价格相同的物品，而你不希望误地“纠正”了它们。对于数千行数据，手动操作需要几个小时。但你可以编写一个程序在几秒钟内完成任务。\n\
  \n你的程序将执行以下操作：\n\n*   遍历所有行。\n*   如果该行是关于大蒜、芹菜或柠檬的，则更改价格。\n\n这意味着你的代码需要完成以下操作：\n\
  \n*   打开电子表格文件。\n*   对于每一行，检查 A 列中的值是否为 `Celery`、`Garlic` 或 `Lemon`。\n*   如果是，则更新\
  \ B 列中的价格。\n*   将电子表格保存为新文件（以防丢失旧电子表格，以万一）。\n\n## 步骤 1：设置带有更新信息的数据结构\n\n你需要更新的价格如下：\n\
  \n| Celery | 1.19 |\n| Garlic | 3.07 |\n| Lemon | 1.27 |\n\n你可以编写如下代码：\n\n```python\n\
  if produceName == 'Celery':\n    cellObj = 1.19\nif produceName == 'Garlic':\n \
  \   cellObj = 3.07\nif produceName == 'Lemon':\n    cellObj = 1.27\n```\n\n将农产品和更新后的价格数据像这样硬编码是不够优雅的。如果你需要用不同的价格或不同的农产品再次更新电子表格，将必须修改大量代码。每次修改代码，你都有引入\
  \ Bug 的风险。\n\n更灵活的解决方案是将纠正后的价格信息存储在字典中，并编写代码使用此数据结构。在新的编辑器窗口中，输入以下代码：\n\n```python\n\
  #! python3\n# updateProduce.py - Correct 农产品销售电子表格中的成本。\n\nimport openpyxl\n\nwb\
  \ = openpyxl.load_workbook('produceSales.xlsx')\nsheet = wb.get_sheet_by_name('Sheet')\n\
  \n# 农产品类型及其更新后的价格\nPRICE_UPDATES = {'Garlic': 3.07,\n                 'Celery':\
  \ 1.19,\n                 'Lemon': 1.27}\n\n# TODO: 遍历行并更新价格。\n```\n\n将其保存为 `updateProduce.py`。如果你需要再次更新电子表格，只需更新\
  \ `PRICE_UPDATES` 字典，而无需修改任何其他代码。\n\n## 步骤 2：检查所有行并更新错误的价格\n\n程序的下部分将遍历电子表格中的所有行。在\
  \ `updateProduce.py` 的末尾添加以下代码：\n\n```python\n#! python3\n   # updateProduce.py\
  \ - Correct 农产品销售电子表格中的成本。\n\n   --snip--\n\n   # 遍历行并更新价格。\n➊ for rowNum in range(2,\
  \ sheet.get_highest_row()):  # 跳过第一行\n➋     produceName = sheet.cell(row=rowNum,\
  \ column=1).value\n➌     if produceName in PRICE_UPDATES:\n           sheet.cell(row=rowNum,\
  \ column=2).value = PRICE_UPDATES[produceName]\n\n➍ wb.save('updatedProduceSales.xlsx')\n\
  ```\n\n我们从第 2 行开始遍历，因为第 1 行只是表头 ➊。第 1 列（即 A 列）中的单元格将存储在变量 `produceName` 中 ➋。如果 `produceName`\
  \ 作为键存在于 `PRICE_UPDATES` 字典中 ➌，你就行必须纠正价格。正确的价格将在 `PRICE_UPDATES[produceName]` 中。\n\
  \n注意使用 `PRICE_UPDATES` 如何让代码变得整洁。更新每种农产品只需要一个 `if` 语句，而不是像 `if produceName == 'Garlic':`\
  \ 那样的代码。由于代码使用了 `PRICE_UPDATES` 字典，而不是在 `for` 循环中硬编码农产品名称和更新成本，因此如果农产品销售电子表格需要额外更改，你只需要修改\
  \ `PRICE_UPDATES` 字典而不需要修改代码。\n\n遍历整个电子表格并进行更改后，代码将 `Workbook` 对象保存到 `updatedProduceSales.xlsx`\
  \ ➍。它没有覆盖旧电子表格，以防你的程序存在 Bug 导致更新后的电子表格错误。在检查更新后的电子表格无误后，你可以删除旧电子表格。\n\n你可以从 [`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)\
  \ 下载此程序的完整源代码。\n\n## 类似程序的想法\n\n由于许多办公人员经常使用 Excel 电子表格，能够自动编辑和写入 Excel 文件的程序将非常有用。\n\
  \n# 设置单元格字体\n\nOpenPyXL 使用 `Style` 对象表示单元格设置集合。可以通过将 `Style` 对象赋值给 `style` 属性来设置单元格样式。\n\
  \n要自定义字体样式，从 `openpyxl` 导入 `Font()` 和 `Style()` 函数。\n\n```python\nFont, Style\n\
  ```\n\n以下示例创建一个工作簿并将 A1 设置为 24 斜体字体。在交互式 shell 中输入以下内容：\n\n```python\n>>> import\
  \ openpyxl\n>>> from openpyxl.styles import Font, Style\n>>> wb = openpyxl.Workbook()\n\
  >>> sheet = wb.get_sheet_by_name('Sheet')\n>>> italic24Font = Font(size=24, italic=True)\n\
  >>> styleObj = Style(font=italic24Font)\n```\n\n`Font` 对象中的 `style` 属性影响单元格内容的显示方式。要设置字体样式属性，向\
  \ `Font()` 传递关键字参数。表 12-2 显示了 `Font()` 函数可能的关键字参数。\n\n表 12-2. Font 样式属性关键字参数\n\n\
  | 关键字参数 | 数据类型 |  |\n| --- | --- | --- |\n| `name` | 字符串 | 字体名称，例如 'Calibri' 或 'Times\
  \ New Roman' |\n| `size` | 整数 | 字号 |\n| `bold` | 布尔值 | `True`，用于加粗字体 |\n\n\n\n\n\
  | `italic` | Boolean | `True`, 用于斜体字体 |\n\n你可以调用 `Font()` 来创建一个 `Font` 对象并将该 `Font`\
  \ 对象存储在变量中。然后，你将其传递给 `Style()`，将生成的 `Style` 对象存储在变量中，并将该变量赋值给 `Cell` 对象的 `style`\
  \ 属性。例如，此代码创建了各种字体样式：\n\n```\n>>> import openpyxl\n>>> from openpyxl.styles import\
  \ Font, Style\n>>> wb = openpyxl.Workbook()\n>>> sheet = wb.get_sheet_by_name('Sheet')\n\
  \n>>> fontObj1 = Font(name='Times New Roman', bold=True)\n>>> styleObj1 = Style(font=fontObj1)\n\
  >>> sheet['A1'].style/styleObj\n>>> sheet['A1'] = 'Bold Times New Roman'\n\n>>>\
  \ fontObj2 = Font(size=24, italic=True)\n>>> styleObj2 = Style(font=fontObj2)\n\
  >>> sheet['B3'].style/styleObj\n>>> sheet['B3'] = '24 pt Italic'\n\n>>> wb.save('styles.xlsx')\n\
  ```\n\n在这里，我们将一个 `Font` 对象存储在 `fontObj1` 中并用它创建一个 `Style` 对象，将其存储在 `styleObj1` 中，然后将\
  \ A1 `Cell` 对象的 `style` 属性设置为 `styleObj`。我们用另一个 `Font` 对象和 `Style` 对象重复此过程，设置第二个单元格的样式。运行此代码后，电子表中\
  \ A1 和 B3 单元格的样式将被设置为自定义字体样式，如图 12-4 所示。\n\n![具有自定义字体样式的工作表](img/httpatomoreillycomsourcenostarchimages2189665.png)\n\
  \n图 12-4 具有自定义字体样式的工作表\n\n对于单元格 A1，我们将字体设置为 `'Times New Roman'`并将 `bold` 设置为 `true`，因此我们的文本以粗体\
  \ Times New Roman 显示。我们没有指定大小，因此使用了 `openpyxl` 的默认值 11。在单元格 B3 中，我们的文本是斜体，大小为 24；我们没有指定字体名称，因此使用了\
  \ `openpyxl` 的默认值 Calibri。\n\n# 公式\n\n公式以等号开头，可以配置单元格以包含从其他单元格计算出的值。在本节中，你将使用 `openpyxl`\
  \ 模块以程序的方式向单元格添加公式，就像添加任何普通值一样。例如：\n\n```\n>>> sheet['B9'] = '=SUM(B1:B8)'\n```\n\
  \n这将 `=SUM(B1:B8)` 作为值存储在单元格 B9 中。这会将 B9 单元格设置为一个公式，用于计算 B1 到 B8 单元格值的和。你可以在图 12-5，该公式加了\
  \ B1 到 B8 单元格。\")中看到其实效果。\n\n![单元格 B9 包含公式 =SUM(B1:B8)，该公式加了 B1 到 B8 单元格。](img/httpatomoreillycomsourcenostarchimages2189667.png.jpg)\n\
  \n图 12-5 单元格 B9 包含公式 =SUM(B1:B8)，该公式加了 B1 到 B8 单元格。\n\n设置公式就像设置单元格中的任何其他文本值一样。在交互式\
  \ shell 中输入以下内容：\n\n```\n>>> import openpyxl\n>>> wb = openpyxl.Workbook()\n>>>\
  \ sheet = wb.get_active_sheet()\n>>> sheet['A1'] = 200\n>>> sheet['A2'] = 300\n\
  >>> sheet['A3'] = '=SUM(A1:A2)'\n>>> wb.save('writeFormula.xlsx')\n```\n\nA1 和 A2\
  \ 单元格分别设置为 200 和 300。单元格 A3 的值被设置为一个 A1 和 A2 之和公式。当在 Excel 中打开电子表时，A3 将显示其数值为 500。\n\
  \n你也可以像读取任何值一样读取单元格中的公式。然而，如果你想查看公式的计算结果而不是字面公式，则在调用 `load_workbook()` 时为关键字参数 `data_only`\
  \ 传递 `True`。这意味着 `Workbook` 对象可以显示公式或公式的结果，但不同者兼得。（但你可以为同一个电子表文件加载多个 `Workbook`\
  \ 对象。）在交互式 shell 中输入以下内容，以查看带不带 `data_only` 关键字加载工作表的区别：\n\n```\n>>> import openpyxl\n\
  >>> wbFormulas = openpyxl.load_workbook('writeFormula.xlsx')\n>>> sheet = wbFormulas.get_active_sheet()\n\
  >>> sheet['A3'].value\n'=SUM(A1:A2)'\n\n>>> wbDataOnly = openpyxl.load_workbook('writeFormula.xlsx',\
  \ data_only=True)\n>>> sheet = wbDataOnly.get_active_sheet()\n>>> sheet['A3'].value\n\
  500\n```\n\n# 调整行和列\n\n一旦你有了 `RowDimension` 对象，就可以设置它的高度。一旦你有了 `ColumnDimension`\
  \ 对象，就可以设置它的宽度。行高可以设置为 `0` 到 409 之间的整数或浮点数，其中单位是磅（points），1 磅等于 1/72 英寸。默认行高为 12.75。列宽可以设置为\
  \ `0` 到 255 之间的整数或浮点数，该值代表在默认字体大小（11 磅）下的字符数。默认列宽为 8.43 个字符。\n\n# 设置行高和列\n\n`Worksheet`\
  \ 对象拥有 `row_dimensions` 和 `column_dimensions` 属性来控制行和列。在 shell 中输入：\n\n```\n>>>\
  \ import openpyxl\n>>> wb = openpyxl.Workbook()\n>>> sheet = wb.get_active_sheet()\n\
  >>> sheet['A1'] = 'Tall row'\n>>> sheet['B2'] = 'Wide column'\n>>> sheet.row_dimensions[1].height\
  \ = 70\n>>> sheet.column_dimensions['B'].width = 20\n>>> wb.save('dimensions.xlsx')\n\
  ```\n\n`row_dimensions` 和 `column_dimensions` 是字典类的值。在 `row_dimensions` 中，你可以通过行号（此处为\
  \ 1）访问它。在 `column_dimensions` 中，你可以通过列字母（此处为 B）访问它。*dimensions.xlsx* 电子表如图 12-6\
  \ 所示。\n\n# 合并和取消合并单元格\n\n矩形单元格区域可以通过表的 `merge_cells()` 方法合并为单个单元格。在交互式 shell 中输入以下内容：\n\
  \n```\n>>> import openpyxl\n>>> wb = openpyxl.Workbook()\n>>> sheet = wb.get_active_sheet()\n\
  >>> sheet.merge_cells('A1:D3')\n>>> sheet['A1'] = 'Twelve cells merged together.'\n\
  >>> sheet.merge_cells('C5:D5')\n>>> sheet['C5'] = 'Two merged cells.'\n>>> wb.save('merged.xlsx')\n\
  ```\n\n`merge_cells()` 的参数是表示合并矩形区域左上角和右下角单元格的单个字符串：`'A1:D3'` 将 12 个单元格合并为一个单元格。要设置这些合并单元格的值，只需设置合并组中左上单元格的值即可。\n\
  \n\n\n\n\n当你运行这段代码时，`merged.xlsx` 将看起来类似于图 12-7。\n\n![电子表格中的合并单元格](img/httpatomoreillycomsourcenostarchimages2189671.png)\n\
  \n图 12-7。电子表格中的合并单元格\n\n要取消合并单元格，请调用 `unmerge_cells()` 表格方法。在交互式 shell 中输入以下：\n\n\
  ```\n>>> import openpyxl\n>>> wb = openpyxl.load_workbook('merged.xlsx')\n>>> sheet\
  \ = wb.get_active_sheet()\n>>> sheet.unmerge_cells('A1:D3')\n>>> sheet.unmerge_cells('C5:D5')\n\
  >>> wb.save('merged.xlsx')\n```\n\n如果你保存了更改并查看电子表格，你会发现合并的单元格已恢复回单个单元格。\n\n## 冻结窗格\n\
  \n对于无法一次性全部显示的巨大电子表格，在屏幕上“冻结”顶部几行或左侧几列非常有帮助。例如，冻结的列标题或行标题在用户滚动电子表格时始终对用户可见。这些被统为*冻结窗格*。在\
  \ OpenPyXL 中，每个 `Worksheet` 对象都有一个 `freeze_panes` 属性，可以被设置为 `Cell` 对象或单元格坐标字符串。请注意，该单元格上方的所有行和左侧的所有列都将被冻结，但单元格本身的行和列不会被冻结。\n\
  \n要取消冻结所有窗格，将 `freeze_panes` 设置为 `None` 或 `'A1'`。表 12-3 显示了在 `freeze_panes` 的某些示例设置下，哪些行和列会被冻结。\n\
  \n表 12-3。冻结窗格示例\n\n| `freeze_panes` 设置 | 被冻结的行和列 |\n| --- | --- |\n| `sheet.freeze_panes\
  \ = 'A2'` | 第 1 行 |\n| `sheet.freeze_panes = 'B1'` | A 列 |\n| `sheet.freeze_panes\
  \ = 'C1'` | A 列和 B 列 |\n| `sheet.freeze_panes = 'C2'` | 第 1 行以及 A、B 列 |\n| `sheet.freeze_panes\
  \ = 'A1'` 或 `sheet.freeze_panes = None` | 无冻结窗格 |\n\n确保你已从 *[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff)*\
  \ 获取了产品销售表格。然后在交互式 shell 中输入以下内容：\n\n```\n>>> import openpyxl\n>>> wb = openpyxl.load_workbook('produceSales.xlsx')\n\
  >>> sheet = wb.get_active_sheet()\n>>> sheet.freeze_panes = 'A2'\n>>> wb.save('freezeExample.xlsx')\n\
  ```\n\n如果你将 `freeze_panes` 属性设置为 `'A2'`，无论用户在电子表格的哪个位置滚动，第 1 行都始终可见。你可以在图 12-8 中看到这一点。![当\
  \ freeze_panes 设置为 'A2' 时，即使用户向下滚动，第 1 行始终可见](img/httpatomoreillycomsourcenostarchimages2189673.png.jpg)\n\
  \n图 12-8。当 `freeze_panes` 设置为 `'A2'` 时，即使用户向下滚动，第 1 行始终可见。\n\n# 图表\n\nOpenPyXL 支持使用单元格中的数据创建柱图、折线图、散点图和饼图。要创建图表，你需要执行以下操作：\n\
  \n1. 从矩形单元格区域创建一个 `Reference` 对象。\n2. 通过传入 `Reference` 对象创建一个 `Series` 对象。\n3. 创建一个\
  \ `Chart` 对象。\n4. 将 `Series` 对象附加到 `Chart` 对象中。\n5. 可选地设置 `Chart` 对象的 `drawing.top`、`drawing.left`、`drawing.width`\
  \ 和 `drawing.height` 变量。\n6. 将 `Chart` 对象添加到 `Worksheet` 对象中。\n\n`Reference` 对象需要一些解释。`Reference`\
  \ 对象通过调用 `openpyxl.charts.Reference()` 函数并传入三个参数来创建：\n\n1. 包含图表数据的 `Worksheet` 对象。\n\
  2. 一个包含两个整数的元组，代表包含图表数据的矩形区域的左上角单元格：元组中的第一个整数是行，第二个是列。请注意 `1` 是第一行，而不是 `0`。\n3.\
  \ 一个包含两个整数的元组，代表包含图表数据的矩形区域的右下角单元格：元组中的第一个整数是行，第二个是列。\n\n图 12-9, (10, 1); (3, 2),\
  \ (6, 4); (5, 3), (5, 3)\") 显示了一些示例坐标参数。![从左到右：(1, 1), (10, 1); (3, 2), (6, 4);\
  \ (5, 3), (5, 3)](img/httpatomoreillycomsourcenostarchimages2189674.png)\n\n图 12-9。从左到右：(1,\
  \ 1), (10, 1) 这种。\n\n在电子表格中使用以下交互式代码来创建图表并将其添加到电子表格：\n\n```\n>>> import openpyxl\n\
  >>> wb = openpyxl.Workbook()\n>>> sheet = wb.get_active_sheet()\nfor i in range(1):\
  \         # 在 A 列创建一些数据\n    sheet['A' + str(i)] = i\n\n>>> refObj = openpyxl.charts.Reference(sheet,\
  \ (1, 1), (10, 1))\n>>> seriesObj = openpyxl.charts.Series(refObj, title='First\
  \ series')\n>>> chartObj = openpyxl.charts.BarChart()\n>>> chartObj.append(seriesObj)\n\
  >>> chartObj.top = 50\n>>> chartObj.left = 100\n>>> chartObj.width = 300\n>>> chartObj.height\
  \ = 200\n>>> sheet.add_chart(chartObj)\n>>> wb.save('sampleChart.xlsx')\n```\n\n\
  这产生了一个类似于图 12-10 的电子表格。\n\n通常处理信息的困难部分不是处理本身，而是获取正确的格式。但一旦你将电子表格加载到 Python 中，就可以比手动操作得多地提取和处理数据。\n\
  \n你还可以从程序生成电子表格。如果同事需要将数千个联系人的文本或 PDF 转换为电子表格，你就不需要所有的手动复制粘贴。\n\n有了 `openpyxl` 模块和一些编程知识，你会发现处理最大的电子表格也轻而易举。\n\
  \n## 练习题\n\n对于以下问题，假设你有一个 `Workbook` 对象 `wb`、一个 `Worksheet` 对象 `sheet`、一个 `Cell`\
  \ 对象 `cell`、一个 `Comment` 对象 `comm` 和一个 `Image` 对象 `img`。\n\n| Q | 1. `openpyxl.load_workbook()`\
  \ 返回什么？ |\n| Q | 2. `get_sheet_names()` 工作方法返回什么？ |\n| Q | 3. 如何获取名为 `'Sheet1'`\
  \ 的 `Worksheet` 对象？ |\n| Q | 4. 如何获取工作表的活动表 `Worksheet` 对象？ |\n| Q | 5. 如何获取单元格\
  \ C5 的值？ |\n| Q | 6. 如何将单元格 C5 的值设置为 `\"Hello\"`？ |\n| Q | 7. 如何以整数形式获取单元格的行和列？\
  \ |\n| Q | 8. `get_highest_column()` 和 `get_highest_row()` 方法返回什么？返回类型是什么？ |\n|\
  \ Q | 9. 如果你需要获取列 `'M'` 的整数索引，你需要调用哪个函数？ |\n| Q | 10. 如果你需要获取列 `14` 的字符串名称，你需要调用哪个函数？\
  \ |\n\n\n\n\n\n| Q: | 11\\. 如何获取从 A1 到 F1 的所有 `Cell` 对象的元组？ |\n| Q: | 12\\. 你如何将工作簿保存为文件名\
  \ `example.xlsx`？ |\n| Q: | 13\\. 如何在单元格中设置公式？ |\n| Q: | 14\\. 如果你想获取单元格公式的结果而不是公式本身，你\
  \ 必须先做什么？ |\n| Q: | 15\\. 如何将第 5 行的高度设置为 100？ |\n| Q: | 16\\. 如何隐藏 C 列？ |\n| Q:\
  \ | 17\\. 列举几项 OpenPyXL 2.1.4 不从电子表格文件中加载的特性。 |\n| Q: | 18\\. 什么是冻结窗格（freeze pane）？\
  \ |\n| Q: | 19\\. 创建柱状图需要调用五个函数和方法？ |\n\n## 练习项目\n\n为了练习，请编写执行以下任务的程序。\n\n## 相乘表生成器\n\
  \n创建一个名为 `multiplicationTable.py` 的程序，从命令行接收一个数字 `N`，并在 Excel 电子表格中创建一个 `N`×`N`\
  \ 的乘表。例如，当程序按如下方式运行时：\n\n```\npy multiplicationTable.py 6\n```\n\n... 它应该创建一个类似于图\
  \ 12-11 的电子表格。\n\n![一个在电子表格中生成的乘表](img/httpatomoreillycomsourcenostarchimages2189679.png.jpg)\n\
  \n图 12-11. 在电子表格中生成的乘表\n\n第 1 行和 A 列应作为标签并并加粗。\n\n## 空行插入器\n\n创建一个名为 `blankRowInserter.py`\
  \ 的程序，接收两个整数和一个文件名字符串作为命令行参数。我们将第一个整数称为 `N`，第二个整数称为 `M`。从第 `N` 行开始，程序应该在电子表格中插入\
  \ `M` 行空行。例如，当程序按如下方式运行时：\n\n```python\npython blankRowInserter.py 3 2 myProduce.xlsx\n\
  ```\n\n... “插入之前”和“之后”的电子表格应该类似于图 12-12。\n\n![在第 3 行插入两个空行之前（左侧）和之后（右侧）](img/httpatomoreillycomsourcenostarchimages2189681.png.jpg)\n\
  \n图 12-12. 在第 3 行插入两个空行之前（左侧）和之后（右侧）\n\n你可以通过读取电子表格的内容来编写此程序。然后在写入新的电子表格时，使用 `for`\
  \ 循环复制前 `N` 行。对于剩余行，在输出电子表格的行号上加上 `M`。\n\n## 电子表格单元格反转\n\n编写一个程序反转电子表格单元格的行和列。例如，第\
  \ 5 行第 3 列的值将位于第 3 行第 5 列（反之亦然）。这应该应用于电子表格中的所有单元格。例如，“插入之前”和“之后”的电子表格类似于图 12-13。\n\
  \n![反转之前（顶部）和之后（底部）的电子表格](img/httpatomoreillycomsourcenostarchimages2189683.png.jpg)\n\
  \n图 12-13. 反转之前（顶部）和之后（底部）的电子表格\n\n你可以通过嵌套的 `for` 循环将电子表格数据读入列表列表的数据结构来编写此程序。该数据结构可以使用\
  \ `sheetData[x][y]` 表示第 `x` 列第 `y` 行的单元格。然后在写入新的电子表格时，使用 `sheetData[y][x]` 表示第 `x`\
  \ 列第 `y` 行。\n\n## 文本文件到电子表格\n\n编写一个程序读取多个文本文件的内容（你可以自己创建这些文本文件），并将这些内容插入电子表格中，每行一条文本。第一个文本文件的行将位于\
  \ A 列的单元格中，第二个文本文件的行将位于 B 列的单元格中，依此类推。\n\n使用 `readlines()` `File` 对象方法返回一个字符串列表，文件中的每行一个字符串。对于第一个文件，将第一行输出到第\
  \ 1 列第 1 行。第二行应写入到第 1 列第 2 行，依此类推。使用 `readlines()` 读取的下一个文件将写入第 2 列，下一个文件写入第 3 列，依此类推。\n\
  \n## 电子表格到文本文件\n\n编写一个程序按相反顺序执行上一个程序的任务：程序应该打开一个电子表格，并将 A 列的单元格写入一个文本文件，将 B 列的单元格写入另一个文本文件，依此类推。\n\
  \n# 第 13 章. 处理 PDF 和 Word 文档\n\nPDF 和 Word 文档是二进制文件，这使得它们比纯文本文件复杂得多。除了文本，它们还存储了字体、颜色和布局信息。如果你想让程序读取或写入\
  \ PDF 或 Word，你需要的不仅仅是将文件名传递给 `open()`。\n\n幸运的是，有 Python 模块可以轻松与 PDF 交互。本章将介绍两个此类模块：PyPDF2\
  \ 和 python-docx。\n\n## PDF 文档\n\nPDF 代表便携文档格式（Portable Document Format），使用 `.pdf`\
  \ 扩展。尽管 PDF 支持许多功能，本章将重点关注你经常需要的操作：从 PDF 读取内容以及创建新的 PDF。\n\n处理 PDF 的模块是 PyPDF2。要安装它，请从命令行运行\
  \ `pip install PyPDF2`。该模块名称大小写敏感，因此请确保小写。（有关安装第三方模块的详细信息请参见附录 A。）如果安装正确，在交互式 shell\
  \ 中运行 `import PyPDF2` 不应显示任何错误。\n\n## 问题 PDF 格式\n\n虽然 PDF 文件便于人类打印和阅读，但对于软件解析为纯文本来说并不直接。提取，\
  \ PDF 可能会出错，甚至无法打开某些 PDF。遗憾的是，对此你无能为。尽管如此，我还没有发现任何无法用 PyPDF2 打开的 PDF。\n\n## 从 PDF\
  \ 提取文本\n\nPyPDF2 无法从 PDF 文档提取图像、图表或其他媒体，但它可以提取文本并以 Python 字符串的形式返回。为了开始学习 PyPDF2\
  \ 的用法，我们将它用于图 13-1 所示的示例 PDF。\n\n![我们将提取的 PDF 页面](img/httpatomoreillycomsourcenostarchimages2189685.png.jpg)\n\
  \n图 13-1. 我们将提取的 PDF 页面\n\n从[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)\
  \ 下载此 PDF，并在交互式 shell 中输入以下内容：\n\n```\n >>> import PyPDF2\n   >>> pdfFileObj = open('meetingminutes.pdf',\
  \ 'rb')\n   >>> pdfReader = PyPDF2.PdfFileReader(pdfFileObj)\n➊ >>> pdfReader.numPages\n\
  \   19\n➋ >>> pageObj = pdfReader.getPage(0)\n➌ >>> pageObj.extractText()\n   'OOFFFFIICALL\
  \ BBOARRDD MMIINUTTEESS Meeting of March 7, 2015\n   \\n     The Board of Elementary\
  \ and Secondary Education shall provide leadership\n   and create policies for education\
  \ that expand opportunities for children,\n   empower families and communities,\
  \ and advance Louisiana in an increasingly\n   competitive global market. BOARD\
  \ of ELEMENTARY and SECONDARY EDUCATION '\n```\n\n首先，导入 `PyPDF2` 模块。然后以二进制读取模式打开\
  \ *meetingminutes.pdf* 并将其存储在 `pdfFileObj` 中。调用 `PyPDF2.PdfFileReader()` 并传递 `pdfFileObj`\
  \ 以获取该 PDF 的 `PdfFileReader` 对象。将该对象存储在 `pdfReader` 中。\n\n\n\n\n文档的总页数存储在 `PdfFileReader`\
  \ 对象的 `numPages` 属性中 ➊。示例 PDF 有 19 页，但让我们只从第一页提取文本。\n\n要从某页提取文本，你需要从 `PdfFileReader`\
  \ 对象中获取一个 `Page` 对象，该对象代表 PDF 的单页。你可以通过在 `PdfFileReader` 对象上调用 `getPage()` 方法 ➋，并传递你感兴趣的页码来获取\
  \ `Page` 对象——在案例中是 0。\n\nPyPDF2 在获取页面时使用`从零开始的索引`：第一页是第 0 页，第二页是介绍 (Introduction)，依此类推。即使文档内部的页码标记不同，情况也是如此。例如，假设你的\
  \ PDF 是某份较长报告的三个页摘录，其页码标记为 42、43 和 44。要获取此文档的第一页，你需要调用 `pdfReader.getPage(0)`，而不是\
  \ `getPage(42)` 或 `getPage(1)`。\n\n一旦你获取了 `Page` 对象，调用其 `extractText()` 方法即可返回该页文本的字符串\
  \ ➌。文本提取并非完美：PDF 中的文本 `Charles E. “Chas” Roemer, President` 未出现在 `extractText()`\
  \ 返回的字符串中，且间距有时会出错。尽管如此，这种对 PDF 内容的近似提取对于你的程序可能已经足够。\n\n## 解密 PDF\n\n某些 PDF 文档具有加密功能，这会阻止它们被读取，直到打开文档的人提供密码。在带有下载的\
  \ PDF 的交互式 shell 中中输入以下内容，该 PDF 已使用密码 `rosebud` 进行了加密：\n\n```\n >>> import PyPDF2\n\
  \   >>> pdfReader = PyPDF2.PdfFileReader(open('encrypted.pdf', 'rb'))\n➊ >>> pdfReader.isEncrypted\n\
  \   True\n   >>> pdfReader.getPage(0)\n➋ Traceback (most recent call call):\n  \
  \   File \"<pyshell#173>\", line 1, in <module>\n       pdfReader.getPage()\n  \
  \   --snip--\n     File \"C:\\Python34\\lib\\site-packages\\PyPDF2\\pdf.py\", line\
  \ 1173, in getObject\n       raise utils.PdfReadError(\"file has not been decrypted\"\
  )\n   PyPDF2.utils.PdfReadError: file has not been decrypted\n➌ >>> pdfReader.decrypt('rosebud')\n\
  \   1\n   >>> pageObj = pdfReader.getPage(0)\n```\n\n所有 `PdfFileReader` 对象都有一个 `isEncrypted`\
  \ 属性，如果 PDF 被加密则其为 `True`，否则为 `False` ➊。在用正确密码解密之前，任何尝试读取文件的函数的调用都将导致错误 ➋。\n\n要读取加密的\
  \ PDF，请调用 `decrypt()` 函数并将密码作为字符串传递 ➌。在使用正确密码调用 `decrypt()` 后，你会发现调用 `getPage()`\
  \ 不再会导致错误。如果提供的密码错误，`decrypt()` 函数将返回 `0` 且 `getPage()` 将继续失败。注意，`decrypt()` 方法仅解密\
  \ `PdfFileReader` 对象，而不是实际的 PDF 文件。在程序结束后，硬盘上的文件仍然保持加密状态。你的程序在下次运行时必须再次调用 `decrypt()`。\n\
  \n## 创建 PDF\n\nPyPDF2 对应 `PdfFileReader` 对象的类是 `PdfFileWriter` 对象，它可以创建新的 PDF 文件。但\
  \ PyPDF2 无法像 Python 处理纯文本文件那样向 PDF 写入任意文本。相反，PyPDF2 的写入能力受限于从其他 PDF 复制页面、旋转页面、叠加页面以及加密文件。\n\
  \nPyPDF2 不允许你直接编辑 PDF。相反，你需要创建一个新的 PDF，然后从现有文档复制内容。本节中的示例将遵循这种通用方法：\n\n1. 将一个或多个现有\
  \ PDF（源 PDF）打开为 `PdfFileReader` 对象。\n2. 创建一个新的 `PdfFileWriter` 对象。\n3. 将页面从 `PdfFileReader`\
  \ 对象复制到 `PdfFileWriter` 对象。\n4. 最后，使用 `PdfFileWriter` 对象写入输出 PDF。\n\n创建 `PdfFileWriter`\
  \ 对象仅创建一个在 Python 中表示 PDF 文档的值。它并没有创建实际的 PDF 文件。对于这一点，你必须调用 PdfFileWriter 的 `write()`\
  \ 方法。\n\n`write()` 方法接收一个以 `write-binary`（二二进制写入）模式打开的普通 `File` 对象。你可以通过调用 Python\
  \ 的 `open()` 函数并传入两个参数来获取此类 `File` 对象：PDF 文件名的字符串以及指示 `'wb'`（表示文件应以二二进制写入模式打开）。\n\
  \n如果这听起来有点困惑，不要担心——你将在下面的代码示例中看到它是如何工作的。\n\n### 复制页面\n\n你可以使用 PyPDF2 将页面从一个 PDF\
  \ 文档复制到另一个。这允许你合并多个 PDF 文件、剪掉不需要的页面或重新排序页面。\n\n从[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)\
  \ 下载 `meetingminutes.pdf` 和 `meetingminutes2.pdf`并将它们放在当前工作目录下。在交互式 shell 中输入以下内容：\n\
  \n```\n >>> import PyPDF2\n   >>> pdf1File = open('meetingminutes.pdf', 'rb')\n\
  \   >>> pdf2File = open('meetingminutes2.pdf', 'rb')\n   >>> pdf1Reader = PyPDF2.PdfFileReader(pdf1File)\n\
  \   >>> pdf2Reader = PyPDF2.PdfFileReader(pdf2File)\n   >>> pdfWriter = PyPDF2.PdfFileWriter()\n\
  \   >>> for pageNum in range(pdf1Reader.numPages):\n       ... pageObj = pdf1Reader.getPage(pageNum)\n\
  \       ... pdfWriter.addPage(pageObj)\n   >>> for pageNum in range(pdf2Reader.numPages):\n\
  \       ... pageObj = pdf2Reader.getPage(pageNum)\n       ... pdfWriter.addPage(pageObj)\n\
  \   >>> pdfOutputFile = open('combinedminutes.pdf', 'wb')\n   >>> pdfWriter.write(pdfOutputFile)\n\
  \   >>> pdfOutputFile.close()\n   >>> pdf1File.close()\n   >>> pdf2File.close()\n\
  ```\n（注：上面的代码块已重构，以匹配文中描述的逻辑）。\n\n### 注意\n\n`PyPDF2` 无法在 `PdfFileWriter` 对象中间插入页面；`addPage()`\
  \ 方法只会将页面添加到末尾。\n\n你现在创建了一个将 `meetingminutes.pdf` 和 `meetingminutes2.pdf` 的页面合并到一个文档的新\
  \ PDF。记住传递给 `PyPDF2.PdfFileReader()` 的 `File` 对象需要通过 `open()` 传递第二个参数 `'rb'` 以二进制读取模式打开。同样，传递给\
  \ `PyPDF2.PdfFileWriter()` 的 `File` 对象需要以 `'wb'` 以二进制写入模式打开。\n\n### 旋转页面\n\nPDF\
  \ 的页面还可以通过 `rotateClockwise()` 和 `rotateCounterClockwise()` 方法以 90 度为增进行旋转。向这些方法传递\
  \ `90`、`180` 或 `270` 整数之一。在交互式 shell 中输入以下内容，假设 `meetingminutes.pdf` 文件位于当前工作目录下：\n\
  \n```\n >>> import PyPDF2\n   >>> minutesFile = open('meetingminutes.pdf', 'rb')\n\
  \   >>> pdfReader = PyPDF2.PdfFileReader(minutesFile)\n➊ >>> page = pdfReader.getPage(0)\n\
  ➋ >>> page.rotateClockwise(90)\n   {'/Contents': [IndirectObject(961, 0), IndirectObject(962,\
  \ 0),\n   --snip--\n   }\n   >>> pdfWriter = PyPDF2.PdfFileWriter()\n   >>> pdfWriter.addPage(page)\n\
  ➌ >>> resultPdfFile = open('rotatedPage.pdf', 'wb')\n   >>> pdfWriter.write(resultPdfFile)\n\
  \   >>> resultPdfFile.close()\n   >>> minutesFile.close()\n```\n\n\n\n在这里我们使用 `getPage(0)`\
  \ 来选择 PDF 的第一页 ➊，然后对该页调用 `rotateClockwise(90)` ➋。我们写入一个包含旋转后页的新 PDF，并将其保存为 `rotatedPage.pdf`\
  \ ➌。\n\n生成的 PDF 将包含一页，已顺时针旋转 90 度，如图图 13-2 所示。`rotateClockwise()` 和 `rotateCounterClockwise()`\
  \ 的返回值包含许多你可以忽略的信息。\n\n![页面顺时针旋转 90 度的 rotatedPage.pdf 文件](img/httpatomoreillycomsourcenostarchimages2189687.png.jpg)\n\
  \n图 13-2. 页面顺时针旋转 90 度的 rotatedPage.pdf 文件\n\n### 叠加页面\n\nPyPDF2 还可以将一个页面的内容叠加到另一个页面上，这对于在页面添加\
  \ Logo、时间戳或水印非常有用。使用 Python 可以轻松地为多个文件添加水印，并且仅对程序指定的页面添加。\n\n从 `[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)`\
  \ 下载 `watermark.pdf`，并将 PDF 与 `meetingminutes.pdf` 一起放在当前工作目录下。然后在交互式 shell 中输入以下内容：\n\
  \n```\n>>> import PyPDF2\n>>> minutesFile = open('meetingminutes.pdf', 'rb')\n➋\
  \ >>> pdfReader = PyPDF2.PdfFileReader(minutesFile)\n➋ >>> minutesFirstPage = pdfReader.getPage(0)\n\
  ➌ >>> pdfWatermarkReader = PyPDF2.PdfFileReader(open('watermark.pdf', 'rb'))\n➍\
  \ >>> minutesFirstPage.mergePage(pdfWatermarkReader.getPage(0))\n➎ >>> pdfWriter\
  \ = PyPDF2.PdfFileWriter()\n➏ >>> pdfWriter.addPage(minutesFirstPage)\n\n➐ >>> for\
  \ pageNum in range(1, pdfReader.numPages):\n           pageObj = pdfReader.getPage(pageNum)\n\
  \           pdfWriter.addPage(pageObj)\n   >>> resultPdfFile = open('watermarkedCover.pdf',\
  \ 'wb')\n   >>> pdfWriter.write(resultPdfFile)\n   >>> minutesFile.close()\n   >>>\
  \ resultPdfFile.close()\n```\n\n在这里我们创建了 `meetingminutes.pdf` 的 `PdfFileReader`\
  \ 对象 ➊。我们调用 `getPage(0)` 获取第一页的 `Page` 对象，并将该对象存储在 `minutesFirstPage` 中 ➋。接着我们为\
  \ `watermark.pdf` 创建一个 `PdfFileReader` 对象 ➌，并在 `minutesFirstPage` 上调用 `mergePage()`\
  \ ➍。传递给 `mergePage()` 的参数是 `watermark.pdf` 第一页的 `Page` 对象。\n\n现在我们已经对 `minutesFirstPage`\
  \ 调用了 `mergePage()`，`minutesFirstPage` 代表了带有水印的第一页。我们创建一个 `PdfFileWriter` 对象 ➎ 并添加带有水印的第一页\
  \ ➏。然后，我们遍历 `meetingminutes.pdf` 中的其余页面，并将它们添加到 `PdfFileWriter` 对象中 ➐。最后，我们打开一个名为\
  \ `watermarkedCover.pdf` 的新 PDF，并将 `PdfFileWriter` 的内容写入该新 PDF。\n\n图 13-3\") 显示了结果。我们的新\
  \ PDF `watermarkedCover.pdf` 包含了 `meetingminutes.pdf` 的所有内容，且第一页带有水印。\n\n![原始 PDF（左侧）、水印\
  \ PDF（中间）和合并后的 PDF（右侧）](img/httpatomoreillycomsourcenostarchimages2189687.png.jpg)\n\
  \n图 13-3. 原始 PDF（左侧）、水印 PDF（中间）和合并后的 PDF（右侧）\n\n### 加密 PDF\n\n`PdfFileWriter` 对象还可以为\
  \ PDF 添加加密。在调用 `write()` 方法保存到文件之前，调用 `encrypt()` 方法并传入密码字符串。在 shell 中输入以下内容：\n\n\
  ```\n>>> import PyPDF2\n>>> pdfFile = open('meetingminutes.pdf', 'rb')\n>>> pdfReader\
  \ = PyPDF2.PdfFileReader(pdfFile)\n>>> pdfWriter = PyPDF2.PdfFileWriter()\n>>> for\
  \ pageNum in range(pdfReader.numPages):\n       pageObj = pdfReader.getPage(pageNum)\n\
  \       pdfWriter.addPage(pageObj)\n➊ >>> pdfWriter.encrypt('user_password', 'owner_password',\
  \ {'encryption': 'AES'})\n>>> resultPdf = open('encrypted.pdf', 'wb')\n>>> pdfWriter.write(resultPdf)\n\
  >>> pdfFile.close()\n>>> resultPdf.close()\n```\n\n`encrypt()` 方法的第一个和第二个参数分别是用户密码（允许查看\
  \ PDF）和所有者密码（允许权限）。如果只传递一个字符串参数，它将用于两个密码。\n\n# 项目：合并页面\n\n假设你有将多个文档合并为一个 PDF 的任务。从高层次来看，程序将执行以下操作：\n\
  \n- 查找目录下的所有 PDF 文件。\n- 对它们进行排序。\n- 创建输出 PDF 的 `PdfFileWriter` 对象。\n- 遍历每个文件，为其创建一个\
  \ `PdfFileReader` 对象。\n- 遍历所有页面（第一页外）并将其添加。\n- 将结果 PDF 保存到文件。\n\n对于此项目，打开一个新的文件编辑器并将其保存为\
  \ `combinePdfs.py`。\n\n### 第一步：查找所有 PDF 文件\n\n首先，你的程序需要获取当前目录下所有 `.pdf` 扩展文件的列表并对其进行排序。让你的代码看起来如下：\n\
  \n```python\n#!/python3\n# combinePdfs.py - 将当前目录下的所有 PDF 合并为\n# 一个 PDF。\n\n➊ import\
  \ PyPDF2, os\n\n# 获取所有的 PDF 文件名。\npdfFiles = []\nfor filename in os.listdir('.'):\n\
  \    if filename.endswith('.pdf'):\n➋ pdfFiles.append(filename)\n➌ pdfFiles.sort(key=str.lower)\n\
  \n➍ pdfWriter = PyPDF2.PdfFileWriter()\n\n# TODO: 遍历所有 PDF 文件。\n\n# TODO: 遍历所有页面（第一页外）并添加。\n\
  \n# TODO: 将结果 PDF 保存到文件。\n```\n\n\n\n\n```\n#! python3\n# combinePdfs.py - 将当前工作目录下的所有\
  \ PDF 合并为\n# 单 PDF 文件。\n\nimport PyPDF2, os\n\n# 获取所有 PDF 文件名。\npdfFiles = []\n\
  --snip--\n# 遍历所有的 PDF 文件。\nfor filename in pdfFiles:\n    pdfFileObj = open(filename,\
  \ 'rb')\n    pdfReader = PyPDF2.PdfFileReader(pdfFileObj)\n    # TODO: 遍历所有页面（第一页除外）并添加它们。\n\
  \n# TODO: 将生成的 PDF 保存到文件中。\n```\n\n对于每个 PDF，循环通过调用 `open()` 并以 `'rb'` 作为第二个参数，以以二进制读取模式打开\
  \ `filename`。`open()` 调用返回一个 `File` 对象，该对象被传递给 `PyPDF2.PdfFileReader()`，以为该 PDF\
  \ 文件创建一个 `PdfFileReader` 对象。\n\n## 步骤 3：添加每一页\n\n对于每个 PDF，你将希望遍历第一页之外的所有页面。将此代码添加到你的程序中：\n\
  \n```python\n#! python3\n   # combinePdfs.py - 将当前工作目录下的所有 PDF 合并为\n   # 单 PDF 文件。\n\
  \n   import PyPDF2, os\n\n   --snip--\n\n   # 遍历所有的 PDF 文件。\n   for filename in\
  \ pdfFiles:\n   --snip--\n       # 遍历所有页面（第一页除外）并添加它们。\n     for pageNum in range(1,\
  \ pdfReader.numPages):\n           pageObj = pdfReader.getPage(pageNum)\n      \
  \     pdfWriter.addPage(pageObj)\n\n   # TODO: 将生成的 PDF 保存到文件中。\n```\n\n`for` 循环内部的代码将每个\
  \ `Page` 对象单独复制到 `PdfFileWriter` 对象中。记住，你想跳过第一页。由于 `PyPDF2` 将 `0` 视为第一页，因此你的循环应该从\
  \ `1` ➊ 开始，然后一直到（但不包含）`pdfReader.numPages` 中的整数。\n\n## 步骤 4：保存结果\n\n在这些嵌套的 `for`\
  \ 循环完成后，`pdfWriter` 变量将包含一个 `PdfFileWriter` 对象，其中包含了所有 PDF 的合并页面。最后一步是将此内容写入硬盘上的文件。将此代码添加到你的程序中：\n\
  \n```python\n#! python3\n# combinePdfs.py - 将当前工作目录下的所有 PDF 合并为\n# 单 PDF 文件。\nimport\
  \ PyPDF2, os\n\n--snip--\n\n# 遍历所有的 PDF 文件。\nfor filename in pdfFiles:\n--snip--\n\
  \    # 遍历所有页面（第一页除外）并添加它们。\n    for pageNum in range(1, pdfReader.numPages):\n \
  \   --snip--\n\n# 将生成的 PDF 保存到文件中。\npdfOutput = open('allminutes.pdf', 'wb')\npdfWriter.write(pdfOutput)\n\
  pdfOutput.close()\n```\n\n向 `open()` 传递 `'wb'` 会以二进制写入模式打开输出 PDF 文件 `allminutes.pdf`。然后，将生成的\
  \ `File` 对象传递给 `write()` 方法将创建实际的 PDF 文件。调用 `close()` 方法将结束程序。\n\n## 类似程序的创意\n\n\
  能够从其他 PDF 的页面创建 PDF 将允许你编写执行以下功能的程序：\n\n*   从 PDF 中提取特定页面。\n*   重新排列 PDF 中的页面顺序。\n\
  *   仅从那些由 `extractText()` 识别出的包含特定文本的页面创建 PDF。\n\n# Word 文档\n\nPython 可以使用 `python-docx`\
  \ 模块创建和修改具有 `.docx` 扩展名的 Word 文。你可以通过运行 `pip install python-docx` 安装该模块。（附录 A 有关于安装第三方模块的完整细节。）\n\
  \n### 注意事项\n\n在使用 `pip` 安装 Python-Docx 时，请确保安装的是 `python-docx` 而不是 `docx`。安装名称 `docx`\
  \ 是另一个本书未涵盖的模块。然而，当你准备导入 `python-docx` 模块时，你需要运行 `import docx`，而不是 `import python-docx`。\n\
  \n如果你没有 Word，LibreOffice Writer 和 OpenOffice Writer 都是适用于 Windows、OS X 和 Linux 的免费替代应用程序，可用于打开\
  \ `.docx` 文件。你可以分别从 [`www.libreoffice.org`](https://www.libreoffice.org) 和 [`openoffice.org`](http://openoffice.org)\
  \ 下载它们。Python-Docx 的完整文档可以在 [`python-docx.readthedocs.org/`](https://python-docx.readthedocs.org/)\
  \ 上找到。虽然 OS X 有版本的 Word，但本章将重点介绍 Windows 版 Word。\n\n与纯文本相比，`.docx` 文件具有许多结构。这种结构在\
  \ Python-Docx 中用三种不同的数据类型表示。在最高层，`Document` 对象代表整个文档。`Document` 对象包含一个 `Paragraph`\
  \ 对象列表，代表文档中的段落。（每当用户在 Word 文档中打字时按下 ENTER 或 RETURN，就会开始一个新段落。）这些 `Paragraph` 对象中的每一个都包含一个或多个\
  \ `Run` 列表。图 13-4 中的单句段落有四个运行。\n\n![在 Paragraph 对象中识别出的 Run 对象](img/Images)\n\n\
  ## 读取 Word 文档\n\n在 ➊，我们在 Python 中打开一个 `.docx` 文件，调用 `docx.Document()` 并传递文件名 `demo.docx`。这将返回一个\
  \ `Document` 对象，该对象有一个 `paragraphs` 属性，它是一个 `Paragraph` 对象列表。当我们对 `doc.paragraphs`\
  \ 调用 `len()` 时，它返回 `7`，这告诉我们有七个 `Paragraph` 对象 ➋。这些 `Paragraph` 对象中的每一个都有一个 `text`\
  \ 属性，包含文本字符串（不带样式）。在这里，第一个 `text` 属性包含 `'Document'` ➌，第二个包含 `'A plain paragraph\
  \ with some bold and some italic'` ➍。\n\n每个 `Paragraph` 对象还有一个 `runs` 属性，它是一个 `Run`\
  \ 对象列表。`Run` 对象也有一个 `text` 属性，仅包含该运行部分中的文本。让我们看看第二个 `Paragraph` 对象 `'A plain paragraph\
  \ with some bold and some italic'` 中的 `text` 属性。对该 `Paragraph` 对象调用 `len()` 告诉我们有四个\
  \ `Run` 对象 ➎。第一个 `Run` 对象包含 `'A plain paragraph with some '` ➏。然后，文本变为粗体样式，因此 `'bold'`\
  \ 开启了一个新的 `Run` 对象 ➐。此后文本恢复到未加粗的样式，这导致生成了第三个 `Run` 对象`' and some '` ➑。最后，第四个也是最后一个\
  \ `Run` 对象包含斜体式的 `'italic'` ➒。\n\n## 从 .docx 文件获取完整文本\n\n如果你只关心 Word 文档中的文本，而不关心样式信息，可以使用\
  \ `getText()` 函数。它接受 `.docx` 文件的文件名并返回其文本的单个字符串值。打开一个新的文件编辑器窗口并输入以下代码，将其保存为 *readDocx.py*：\n\
  \n\n\n\n\n```python\n#! python3\n\nimport docx\n\ndef getText(filename):\n    doc\
  \ = docx.Document(filename)\n    fullText = []\n    for para in doc.paragraphs:\n\
  \        fullText.append(para.text)\n    return '\\n'.join(fullText)\n```\n\n`getText()`\
  \ 函数打开 Word 文档，遍历 `paragraphs` 列表中的所有 `Paragraph` 对象，然后将它们的文本附加到 `fullText` 列表中。循环结束后，`fullText`\
  \ 中的字符串将用换行符连接在一起。\n\n`readDocx.py` 程序可以像其他模块一样被导入。现在，如果你只需要 Word 文档中的文本，可以输入以下内容：\n\
  \n```python\n>>> import readDocx\n>>> print(readDocx.getText('demo.docx'))\nDocument\
  \ Title\nA plain paragraph with some bold and some italic\nHeading, level 1\nIntense\
  \ quote\nfirst item in unordered list\nfirst item in ordered list\n```\n\n你也可以调整\
  \ `getText()` 在返回字符串之前对其修改。例如，为了每个段落进行缩进，可以将 `readDocx.py` 中的 `append()` 调用替换为：\n\
  \n```python\nfullText.append(' ' + para.text)\n```\n\n为了在段落之间添加双倍空格，将 `join()` 调用代码改为：\n\
  \n```python\nreturn '\\n\\n'.join(fullText)\n```\n\n如你所见，只需要几行代码就能编写出读取 `.docx`\
  \ 文件并按喜好返回内容字符串的函数。\n\n## 设置段落对象和 Run 对象的样式\n\n在 Windows 版 Word 中，你可以通过按下 `CTRL-ALT-SHIFT-S`\
  \ 显示样式面板来查看样式，该面板类似于图 13-5。在 OS X 上，你可以通过点击 `视图`▸`样式` 菜单项来查看样式面板。\n\n![在 Windows\
  \ 上按下 CTRL-ALT-SHIFT-S 显示样式面板。](img/httpatomoreillycomsourcenostarchimages2189693.png.jpg)\n\
  \n### 图 13-5. 在 Windows 上按下 `CTRL-ALT-SHIFT`-S 显示样式面板。\n\nWord 和其他文字处理器使用样式来保持相似类型文本的视觉呈现一致且易于更改。例如，你可能希望将正文段落设置为\
  \ 11 号 Times New Roman 字体、左对齐、右不对齐。你可以创建一个带有这些设置的样式并将其分配给所有正文段落。以后如果你想更改文档中所有正文段落的显示，只需更改样式，所有这些段落将自动更新。\n\
  \n对于 Word 文档，有三种样式：`段落样式`可以应用于 `Paragraph` 对象，`字符样式`可以应用于 `Run` 对象，而`链接样式`可以同时应用于这两种对象。你可以通过将它们的\
  \ `style` 属性设置为字符串来为 `Paragraph` 和 `Run` 对象赋予样式。该字符串应该是样式的名称。如果 `style` 被设置为 `None`，则\
  \ `Paragraph` 或 `Run` 对象将没有与其关联的样式。\n\n默认 Word 样式的字符串值如下：\n\n| `'Normal'` | `'Heading5'`\
  \ | `'ListBullet'` | `'ListParagraph'` |\n| :--- | :--- | :--- | :--- |\n| `'BodyText'`\
  \ | `'Heading6'` | `'ListBullet2'` | `'MacroText'` |\n| `'BodyText2'` | `'Heading7'`\
  \ | `'ListBullet3'` | `'NoSpacing'` |\n| `'BodyText3'` | `'Heading8'` | `'ListContinue'`\
  \ | `'Quote'` |\n| `'Caption'` | `'Heading9'` | `'ListContinue2'` | `'Subtitle'`\
  \ |\n| `'Heading1'` | `'IntenseQuote'` | `'ListContinue3'` | `'TOCHeading'` |\n\
  | `'Heading2'` | `'List'` | `'ListNumber'` | `'Title'` |\n| `'Heading3'` | `'List2'`\
  \ | `'ListNumber2'` | |\n| `'Heading4'` | `'List3'` | `'ListNumber3'` | |\n\n在设置\
  \ `style` 属性时，不要在样式名称中使用空格。例如，虽然样式名称可能是 Subtle Emphasis（细微强调），但你应该将 `style` 属性设置为字符串值\
  \ `'SubtleEmphasis'` 而不是 `'Subtle Emphasis'`。包含空格会导致 Word 误读样式名称并无法应用。\n\n当对 `Run`\
  \ 对象使用链接样式时，你需要在名称末尾添加 `'Char'`。例如，为 `Paragraph` 对象设置 Quote 链接样式，你会使用 `paragraphObj.style\
  \ = 'Quote'`，但对于 `Run` 对象，你会使用 `runObj.style = 'QuoteChar'`。\n\n在 Python-Docx 的当前版本\
  \ (0.7.4) 中，唯一可样式是默认 Word 样式和打开的 `.docx` 中的样式。无法创建新样式——尽管这在未来的 Python-Docx 版本中可能会发生。\n\
  \n## 使用非默认样式创建 Word 文档\n\n如果你想创建使用默认样式之外样式的 Word 文档，你需要打开一个空白 Word 文档，并通过点击样式面板底部的“新建样式”按钮自己创建样式（图\
  \ 13-6）\n\n### Run 属性\n\n可以使用 `text` 属性进一步对 Run 设置。每个属性可以设置为三个值之一：`True`（启用属性）、`False`（禁用属性）或\
  \ `None`（取决于样式的设置）。\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `bold` | 文本加粗。 |\n| `italic`\
  \ | 文本斜体。 |\n| `underline` | 文本带下划线。 |\n| `strike` | 文本带有删除线。 |\n| `double_strike`\
  \ | 文本带有双删除线。 |\n| `all_caps` | 文本全大写。 |\n| `small_caps` | 文本大写，，小写字母较小。 |\n| `shadow`\
  \ | 文本带有阴影。 |\n| `outline` | 文本呈现轮廓而非实心。 |\n| `rtl` | 文本从右向左写入。 |\n| `imprint` |\
  \ 文本凹入页面效果。 |\n| `emboss` | 文本浮出页面效果。 |\n\n例如，要更改 `demo.docx` 的样式，在交互式 shell 中输入以下内容：\n\
  \n```python\n>>> doc = docx.Document('demo.docx')\n>>> doc.paragraphs[0].text\n\
  'Document Title'\n>>> doc.paragraphs[0].style\n'Title'\n>>> doc.paragraphs[0].style\
  \ = 'Normal'\n>>> doc.paragraphs[1].text\n'A plain paragraph with some bold and\
  \ some italic'\n>>> (doc.paragraphs[1].runs[0].text, doc.paragraphs[1].runs[1].text,\
  \ doc.\nparagraphs[1].runs[2].text, doc.paragraphs[1].runs[3].text)\n('A plain paragraph\
  \ with some ', 'bold', ' and some ', 'italic')\n>>> doc.paragraphs[1].runs[0].style\
  \ = 'QuoteChar'\n>>> doc.paragraphs[1].runs[1].underline = True\n>>> doc.paragraphs[1].runs[3].underline\
  \ = True\n>>> doc.save('restyled.docx')\n```\n\n\n\n\n\n`restyled.docx` 顶部的 `Document\
  \ Title` 文字将具有 `Normal` 样式而不是 `Title` 样式，文本 `A plain paragraph with some` 的 `Run`\
  \ 对象将具有 `QuoteChar` 样式，而单词 `bold` 和 `italic` 的两个 `Run` 对象的 `underline` 属性将分别设置为\
  \ `True`。图 13-7 显示了 `restyled.docx` 中段落和运行对象的样式看起来是样的。\n\n![The restyled.docx file](img/httpatomoreillycomsourcenostarchimages2189697.png.jpg)\n\
  \n图 13-7. `restyled.docx` 文件\n\n你可以在 [`python-docx.readthedocs.org/en/latest/user/styles.html`](https://python-docx.readthedocs.org/en/latest/user/styles.html)\
  \ 找到更多关于 Python-Docx 使用样式的完整文档。\n\n## 创建 Word 文档\n\n在交互式 shell 中输入以下内容：\n\n```\n\
  >>> import docx\n>>> doc = docx.Document()\n>>> doc.add_paragraph('Hello world!')\n\
  <docx.text.Paragraph object at 0x0000000003B56F60>\n>>> doc.save('helloworld.docx')\n\
  ```\n\n要创建你自己的 `.docx` 文件，请调用 `docx.Document()` 返回一个新的、空白 Word `Document` 对象。`add_paragraph()`\
  \ 文档方法向文档中添加一个新的文本段落，并返回所添加的 `Paragraph` 对象的引用。当你完成文本添加后，将文件名字符串传递给 `save()` 文档方法，即可将\
  \ `Document` 对象保存到文件中。\n\n这将在当前工作目录下创建一个名为 `helloworld.docx` 的文件，打开它时，它看起来像图 13-8\"\
  )。\n\n![The Word document created using add_paragraph('Hello world!')](img/httpatomoreillycomsourcenostarchimages2189699.png.jpg)\n\
  \n图 13-8. 使用 `add_paragraph('Hello world!')` 创建的 Word 文档\n\n你可以再次调用 `add_paragraph()`\
  \ 方法并新段落的文本来添加段落。或者要在现有段落的末尾添加文本，可以调用段落的 `add_run()` 方法并传递一个字符串。在交互式 shell 中输入以下内容：\n\
  \n```\n>>> import docx\n>>> doc = docx.Document()\n>>> doc.add_paragraph('Hello\
  \ world!')\n<docx.text.Paragraph object at 0x000000000366AD30>\n>>> paraObj1 = doc.add_paragraph('This\
  \ is a second paragraph.')\n>>> paraObj2 = doc.add_paragraph('This is a yet another\
  \ paragraph.')\n>>> paraObj1.add_run(' This text is being added to the second paragraph.')\n\
  <docx.text.Run object at 0x0000000003A2C860>\n>>> doc.save('multipleParagraphs.docx')\n\
  ```\n\n生成的文档看起来像图 13-9。注意文本 `This text is being added to the second paragraph.`\
  \ 被添加到了 `paraObj1` 的 `Paragraph` 对象中，而它是添加到 `doc` 中的第二个段落。`add_paragraph()` 和 `add_run()`\
