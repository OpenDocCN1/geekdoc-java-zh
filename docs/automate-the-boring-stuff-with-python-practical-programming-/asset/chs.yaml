  \ 函数的 `args` 和 `kwargs` 关键字参数。\n\n## 并发问题\n\n\n\n你可以轻松地创建几个新线程并让它们同时运行。但多个线程也会导致被称为`并发问题（`concurrency\
  \ issues`）的问题。这些问题发生在多个线程同时读写变量时，导致线程之间相互干扰。并发问题可能很难一致地重现，使得它们难以调试。\n\n多线程编程本身是一个广阔的课题，超出了本书的涵盖范围。你需要记住这一点是：为了避免并发问题，永远不要让多个线程读或写同一个变量。当你创建一个新的`Thread`\
  \ 对象时，确保它的目标函数只使用该函数内部的局部变量。这将避免你的程序中出现难以调试的并发问题。\n\n### 注意事项\n\n一个关于多线程编程的初学者教程可以在\
  \ [`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/) 找到。\n\n# 项目：多线程\
  \ XKCD 下载器\n\n在第 11 章 中，你编写了一个程序来下载 XKCD 网站上所有的 XKCD 漫画。这是一个单线程程序：它一次只下载一个漫画。程序的大部分运行时间花在了建立网络连接以开始下载以及将下载的图像写入硬硬盘上。如果你有宽带互联网连接，你的单线程程序并没有充分利用可用带宽。\n\
  \n一个多线程程序在某些线程下载漫画的同时，另一些线程建立连接并将漫画图像文件写入磁盘，这可以更有效地利用你的互联网连接，并更快地下载漫画系列。打开一个新的文件编辑器窗口并将其保存为\
  \ `multidownloadXkcd.py`。你将修改此程序以添加多线程。完全修改后的源代码可以从 [`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)\
  \ 下载。\n\n##  1 ：修改程序以使用函数\n\n此程序大部分将与第 11 章 中的下载代码相同，因此我跳过对 `Requests` 和 `BeautifulSoup`\
  \ 代码的解释。你需要做的主要更改是导入 `threading` 模块并创建一个 `downloadXkcd()` 函数，该函数接受起始和结束漫画编号作为参数。\n\
  \n例如，调用 `downloadXkcd(140, 280)` 将循环执行下载代码，下载 [`xkcd.com/140`](http://xkcd.com/140)、[`xkcd.com/141`](http://xkcd.com/141)、[`xkcd.com/142`](http://xkcd.com/142)\
  \ 等漫画，直到到 [`xkcd.com/279`](http://xkcd.com/279)。你创建的每个线程都将调用 `downloadXkcd()` 并传递不同范围的漫画进行下载。\n\
  \n向你的 `multidownloadXkcd.py` 程序中添加以下代码：\n\n```\n # python3\n   # multidownloadXkcd.py\
  \ - 使用多个线程下载 XKCD 漫画。\n\n   import requests, os, bs4, threading\n➊ os.makedirs('xkcd',\
  \ exist_ok=True) # 将漫画存储在 ./xkcd\n\n➋ def downloadXkcd(startComic, endComic):\n\
  ➌     for urlNumber in range(startComic, endComic):\n           # 下载页面。\n      \
  \     print('Downloading page http://xkcd.com/%s...' % (urlNumber))\n➍         res\
  \ = requests.get('http://xkcd.com/%s' % (urlNumber))\n           res.raise_for_status()\n\
  \n➎         soup = bs4.BeautifulSoup(res.text)\n\n           # 寻找漫画图像的 URL。\n➏ \
  \        comicElem = soup.select('#comic img')\n           if comicElem == []:\n\
  \               print('Could not find comic image.')\n           else:\n➐      \
  \       comicUrl = comicElem[0].get('src')\n               # 下载图像。\n           \
  \    print('Downloading image %s...' % (comicUrl))\n➑             res = requests.get(comicUrl)\n\
  \               res.raise_for_status()\n\n               # 将图像保存到 ./xkcd。\n    \
  \           imageFile = open(os.path.join('xkcd', os.path.basename(comicUrl)), 'wb')\n\
  \               for chunk in res.iter_content(100000):\n                   imageFile.write(chunk)\n\
  \               imageFile.close()\n\n   # TODO: 创建并启动 Thread 对象。\n   # TODO: 等待所有线程结束。\n\
  ```\n\n在导入所需的模块后，我们在 ➊ 处创建了一个目录来存储漫画并在 ➋ 处开始定义 `downloadXkcd()`。我们遍历指定范围内的所有数字 ➌\
  \ 并下载每个页面 ➍。我们使用 `BeautifulSoup` 遍历每个页面的 HTML ➎ 并找到漫画图像 ➏。如果页面上没有找到漫画图像，我们会打印一条消息。否则，我们获取图像的\
  \ URL ➐ 并下载图像 ➑。最后，我们将图像保存到我们创建的目录中。\n\n## 2 2：创建并启动线程\n\n现在我们已经定义了 `downloadXkcd()`，我们将创建多个线程，每个线程都调用\
  \ `downloadXkcd()` 来下载不同范围的漫画。在 `downloadXkcd()` 之后向 `multidownloadXkcd.py` 中添加以下代码：\n\
  \n```\n#! python3\n# multidownloadXkcd.py - 使用多个线程下载 XKCD 漫画。\n\n--snip--\n\n# 创建并启动\
  \ Thread 对象。\ndownloadThreads = []\nfor i in range(0, 1400, 100):\n    downloadThread\
  \ = threading.Thread(target=downloadXkcd, args=(i, i + 99))\n    downloadThreads.append(downloadThread)\n\
  \    downloadThread.start()\n```\n\n首先我们创建一个空列表 `downloadThreads`；这将帮助我们跟踪的 `Thread`\
  \ 对象。由于 `for` 循环从 `0` 到 `1400` 步长为 `100`，`i` 在第一次迭代中为 `0`，第二次迭代中为 `100`，第三次迭代中为\
  \ `200`，以此类推。由于我们将 `args=(i, i + 99)` 传递给 `threading.Thread()`，传递给 `downloadXkcd()`\
  \ 的两个参数在第一次迭代中为 `0` 和 `99`，第二次迭代为 `100` 和 `199`，第三次迭代为 `200` 和 `299`，以此类推。当 `Thread`\
  \ 对象的 `start()` 方法被调用且新线程开始运行 `downloadXkcd()` 内部的代码时，主线程将继续 `for` 循环的下一次迭代。\n\n\
  ## 3 3：等待所有线程结束\n\n在我们创建的其他线程下载漫画时，主线程按正常方式运行。但假设某些代码你不希望在所有线程完成之前在主线程运行。调用 `Thread`\
  \ 对象的 `join()` 方法将阻塞，直到该线程完成。通过使用 `for` 循环遍历 `downloadThreads` 列表中的所有 `Thread` 对象，主线程可以调用每个其他线程的\
  \ `join()` 方法。在程序的末尾添加以下内容：\n\n```\n#! python3\n# multidownloadXkcd.py - 使用多个线程下载\
  \ XKCD 漫画。\n\n--snip--\n\n# 等待所有线程结束。\nfor downloadThread in downloadThreads:\n\
  \    downloadThread.join()\nprint('Done.')\n```\n\n在所有 `join()` 调用返回之前，字符串 `'Done.'`\
  \ 都不会被打印。如果 `Thread` 对象在调用其 `join()` 方法时已经完成，那么该方法将直接返回。如果你想在所有漫画下载完成后再运行某些代码来扩展此程序，可以将\
  \ `print('Done.')` 这一行替换为你的新代码。\n\n# 从 Python 启动其他程序\n\n\n\n\n\n你的 Python 程序可以使用内置\
  \ `subprocess` 模块中的 `Popen()` 函数在你的计算机上启动其他程序。（`Popen()` 函数名称中的 `P` 代表 `process`（进程）。）如果你打开了一个应用程序的多个实例，那么其中每个实例都是该程序的一个独立进程。例如，如果你同时打开了网络浏览器的多个窗口，那么每个窗口都是网络浏览器程序的一个不同进程。请参阅图\
  \ 15-1 以查看同时打开多个计算器进程的示例。\n\n每个进程都可以拥有多个线程。与线程不同，进程无法直接读取和写入另一个进程的变量。如果你将多线程程序看作是有多个手指在跟踪源代码，那么打开同一个程序的多个进程就像是你的朋友也拥有一份程序源代码的独立副本。你们都在独立地执行同一个程序。\n\
  \n如果你想从 Python 脚本启动一个外部程序，请将程序的文件名传递给 `subprocess.Popen()`。（在 Windows 上，右键点击应用程序的“开始”菜单项并选择“属性”来查看应用程序文件名。在\
  \ OS X 上，按住 CTRL 点击应用程序并选择“显示包内容”以找到可执行文件的路径。）`Popen()` 函数将立即返回。请记住，启动的程序并不是在你的\
  \ Python 程序相同的线程中运行的。\n\n![同一个计算器程序的六个正在运行的进程](img/httpatomoreillycomsourcenostarchimages2189709.png.jpg)\n\
  \n图 15-1. 同一个计算器程序的六个正在运行的进程\n\n在 Windows 计算机上，在交互式 shell 中输入以下内容：\n\n```\n>>> import\
  \ subprocess\n>>> subprocess.Popen('C:\\\\Windows\\\\System32\\\\calc.exe')\n<subprocess.Popen\
  \ object at 0x0000000003055A58>\n```\n\n在 Ubuntu Linux 上，你需要输入内容：\n\n```\n>>> import\
  \ subprocess\n>>> subprocess.Popen('/usr/bin/gnome-calculator')\n<subprocess.Popen\
  \ object at 0x7f2bcf93b20>\n```\n\n在 OS X 上，过程略有不同。请参阅使用默认应用程序打开文件。\n\n返回值是一个 `Popen`\
  \ 对象，它有两个有用的方法：`poll()` 和 `wait()`。\n\n你可以将 `poll()` 方法想为询问你的朋友是否已经运行完你给给她的代码。如果在调用\
  \ `poll()` 时进程仍在运行，则 `poll()` 将返回 `None`。如果程序已终止，它将返回进程的整数退出码（`exit code`）。退出码用于指示进程是在没有错误的情况下终止（退出码为\
  \ `0`），还是由于错误导致了进程终止（非零退出码——通常为 `1`，但可能因程序而异）。\n\n`wait()` 方法就像等待你的朋友完成代码工作后，你再继续你的代码工作。`wait()`\
  \ 方法会阻塞，直到启动的进程终止。如果你希望你的程序暂停，直到用户完成另一个程序，这非常有帮助。`wait()` 的返回值是进程的整数退出码。\n\n在 Windows\
  \ 上，在交互式 shell 中输入以下内容。注意，`wait()` 调用将阻塞，直到你退出启动的计算器程序。\n\n```\n➊ >>> calcProc =\
  \ subprocess.Popen('c:\\\\Windows\\\\System32\\\\calc.exe')\n➋ >>> calcProc.poll()\
  \ == None\n   True\n➌ >>> calcProc.wait()\n   0\n   >>> calcProc.poll()\n   0\n\
  ```\n\n在这里我们打开了一个计算器进程 ➊。当它仍在运行时，我们检查 `poll()` 是否返回 `None` ➋。它应该是返回的，因为进程仍在运行。然后我们关闭计算器程序，并对终止的进程调用\
  \ `wait()` ➌。现在 `wait()` 和 `poll()` 返回 `0`，表示该进程在没有错误的情况下终止了。\n\n## 向 Popen() 传递命令行参数\n\
  \n你可以向用 `Popen()` 创建的进程传递命令行参数。要做到这一点，你需要将一个列表作为 `Popen()` 的唯一参数传递。列表中的第一个字符串将是你想要启动的程序的可执行文件名；所有随后的字符串都将是程序启动时传递给该程序的命令行参数。实际上，这个列表将是所启动程序的\
  \ `sys.argv` 的值。\n\n大多数具有图形用户界面（GUI）的应用程序不像基于命令行或终端的程序那样频繁地使用命令行参数。但大多数 GUI 应用程序都会接受单一的文件参数，应用程序在启动时会立即打开它。例如，如果你正在使用\
  \ Windows，创建一个名为 `C:\\hello.txt` 的简单文本文件，然后在交互式 shell 中输入以下内容：\n\n```\n>>> subprocess.Popen(['C:\\\
  \\Windows\\\\notepad.exe', 'C:\\\\hello.txt'])\n<subprocess.Popen object at 0x00000000032DCEB8>\n\
  ```\n\n这不仅会启动记事本应用程序，还会让立即打开 `C:\\hello.txt` 文件。\n\n## 调度程序、launchd 和 cron\n\n如果你精通计算机，可能知道\
  \ Windows 上的任务调度程序（Task Scheduler）、OS X 上的 launchd 或 Linux 上的 cron 器。这些文档良好的工具都允许你安排应用程序在特定时间启动。如果你想更多地了解它们，可以在\
  \ *[`nostarch.com/automatuff/`](http://nostarch.com/automatuff/)* 找到教程。\n\n与其使用操作系统的调度器，你的代码可以循环到特定的日期和时间，每次调用\
  \ `time.sleep(1)`。但是，如果你只需要让你的程序短暂暂停，请使用 `time.sleep()` 函数。\n\n## 使用 Python 打开网站\n\
  \n`webbrowser.open()` 函数可以从你的程序启动浏览器到特定的网站，而不是使用 `subprocess.Popen()` 打开浏览器应用程序。更多细节请参阅项目：使用\
  \ webbrowser 模块 mapit.py。\n\n像运行其他应用程序一样运行 Python 脚本。你只需要将 `python.exe` 可执行文件传递给\
  \ `Popen()`并将 `.py` 脚本的文件名作为其参数。例如，以下代码将运行第一章 Python 基础：\n\n```\n>>> subprocess.Popen(['C:\\\
  \\python34\\\\python.exe', 'hello.py'])\n<subprocess.Popen object at 0x000000000331CF28>\n\
  ```\n\n向 `Popen()` 传递一个包含 Python 可执行文件路径字符串和脚本文件名字符串的列表。如果你启动的脚本需要命令行参数，将它们添加到脚本文件名之后。Python\
  \ 可执行文件在 Windows 位置是 `C:\\python34\\python.exe`。在 OS X 上，它是 `/Library/Frameworks/Python.framework/Versions/3.3/bin/python3`。在\
  \ Linux 上，它是 `/usr/bin/python3`。\n\n与将 Python 程序导入为模块不同，当你的 Python 程序启动另一个 Python\
  \ 程序时，它们在独立的进程中运行，无法共享彼此的变量。\n\n## 使用默认应用程序打开文件\n\n在你的计算机上双击 `.txt` 文件将自动启动与 `.txt`\
  \ 扩展名关联的应用程序。你的计算机已经设置了许多此类文件扩展关联。Python 也可以通过这种方式用 `Popen()` 打开文件。\n\n\n\n\n\n\
  每个操作系统都拥有一个程序，可以执行等同于双击文档文件以打开它的操作。在 Windows 上，这是 `start` 程序。在 OS X 上，这是 `open`\
  \ 程序。在 Ubuntu Linux 上，这是 `see` 程序。在交互式 shell 中输入以下内容，并根据你的系统向 `Popen()` 传递 `'start'`、'open'`\
  \ 或 `'see'`：\n\n```\n>>> fileObj = open('hello.txt', 'w')\n>>> fileObj.write('Hello\
  \ world!')\n12\n>>> fileObj.close()\n>>> import subprocess\n>>> subprocess.Popen(['start',\
  \ 'hello.txt'], shell=True)\n```\n\n在这里，我们向新的 `hello.txt` 文件写入 `Hello world!`。然后我们调用\
  \ `Popen()`，并向它传递一个包含程序名称（在本例中，Windows 下为 `'start'`）和文件名的列表。我们还传递了 `shell=True`\
  \ 关键字参数，这在 Windows 上需要的。操作系统知道所有的文件关联，并可以判断出应该启动例如 `Notepad.exe` 来处理 `hello.txt`\
  \ 文件。\n\n在 OS X 上，`open` 程序被用于打开文档文件和程序。如果你使用的是 Mac，请在交互式 shell 中输入以下内容：\n\n```\n\
  >>> subprocess.Popen(['open', '/Applications/Calculator.app/'])\n<subprocess.Popen\
  \ object at 0x10202ff98>\n```\n\n计算器应用程序将会打开。\n\n# UNIX 哲学\n\n设计良好的可由其他程序启动的程序比其代码本身更强大。`Unix\
  \ 哲学` 是由 Unix 操作系统的程序员（现代 Linux 和 OS X 均在此基础上）建立的一套软件设计原则。它认为，编写许多小的、目的单一且可以相互操作的程序，比编写大型、功能丰富的应用程序更好。较小的程序更容易理解，而且通过相互操作，它们可以成为更强大应用程序的构建模块。\n\
  \n智能手机应用也遵循这种方法。如果你的餐厅应用需要显示到咖啡馆的路线，开发者并没有通过编写自己的地图代码来重复轮子。餐厅应用只需启动地图应用，并向其传递咖啡馆的地址，就像你的\
  \ Python 代码调用一个函数并传递参数一样。\n\n你在书中书中编写的 Python 程序大多符合 Unix 哲学，特别在一个重要的方面：它们使用命令行参数而不是\
  \ `input()` 函数调用。如果程序所需的所有信息都可以预先提供，那么将这些信息作为命令行参数传递比等待用户输入要好。这样，命令行参数可以由人类用户输入，也可以由另一个程序提供。这种相互操作的方法会让你的程序可以作为另一个程序的一部分被重用。\n\
  \n唯一的例外是你不希望将密码作为命令行参数传递，因为命令行可能会将其记录为命令历史功能的一部分。相反，当你的程序需要你输入密码时，应该调用 `input()`\
  \ 函数。\n\n你可以在 `[`en.wikipedia.org/wiki/Unix_philosophy/`](https://en.wikipedia.org/wiki/Unix_philosophy/)`\
  \ 阅读更多关于 Unix 哲学的知识。\n\n# 项目：简单倒计时程序\n\n就像寻找一个简单的秒表应用可能很难，寻找一个简单的倒计时应用也可能很难。让我们来写一个在倒计时结束时播放警报的倒计时程序。\n\
  \n从高层次来说，你的程序将执行以下操作：\n\n* 从 60 开始倒计时。\n* 当计时到达零时播放声音文件（`alarm.wav`）。\n\n这意味着你的代码需要执行以下操作：\n\
  \n* 通过调用 `time.sleep()` 在显示倒计时中的每个数字之间暂停一秒。\n* 调用 `subprocess.Popen()` 使用默认应用程序打开声音文件。\n\
  \n打开一个新的文件编辑器窗口并将其保存为 `countdown.py`。\n\n## 第一步：倒计时\n\n此程序需要 `time` 模块的 `time.sleep()`\
  \ 函数和 `subprocess` 模块的 `subprocess.Popen()` 函数。输入以下代码并将文件保存为 `countdown.py`：\n\n\
  ```python\n #! python3\n   # countdown.py - 一个简单的倒计时脚本。\n\n   import time, subprocess\n\
  \n➊ timeLeft = 60\n   while timeLeft > 0:\n➋     print(timeLeft, end='')\n둑    \
  \ time.sleep(1)\n➍     timeLeft = timeLeft - 1\n\n   # TODO: 在倒计时结束时，播放声音文件。\n```\n\
  \n导入 `time` 和 `subprocess` 后，创建一个名为 `timeLeft` 的变量来存储倒计时剩余的秒数 ➊。它可以从 60 开始——或者你可以在此处将值更改为所需的任何数值，甚至可以从命令行参数进行设置。\n\
  \n在 `while` 循环中，你显示剩余计数 ➋，暂停一秒 ➌，然后在循环重新开始之前将 `timeLeft` 变量减 1 ➍。只要 `timeLeft` 大于\
  \ 0，循环就会持续进行。之后，倒计时结束。\n\n## 第二步：播放声音文件\n\n虽然有第三方模块可以播放各种格式的声音文件，但快速简单的方法是直接启动用户已经在使用的播放声音文件的任何程序。操作系统将根据\
  \ `.wav` 文件扩展名确定应该启动哪个应用程序来播放该文件。这个 `.wav` 文件也可以是其他声音文件格式，例如 `.mp3` 或 `.ogg`。\n\n\
  你可以使用计算机上的任何声音文件在倒计时结束时播放，也可以从 `http://nostarch.com/automatestuff/` 下载 `alarm.wav`。\n\
  \n向你的代码添加以下内容：\n\n```python\n#! python3\n# countdown.py - 一个简单的倒计时脚本。\n\nimport\
  \ time, subprocess\n\n#省略\n\n# 在倒计时结束时，播放声音文件。\nsubprocess.Popen(['start', 'alarm.wav'],\
  \ shell=True)\n```\n\n在 `while` 循环结束后，`alarm.wav`（或你选择的声音文件）将播放以通知用户倒计时结束。在 Windows\
  \ 上，确保在传递给 `Popen()` 的列表中包含 `'start'`，并传递关键字参数 `shell=True`。在 OS X 上，用 `'open'`\
  \ 代替 `'start'` 并移除 `shell=True`。\n\n与其播放声音文件，你可以在某处保存一个带有“休息结束！”消息的文件，并在倒计时结束时打开它。这将创建一个弹窗。或者你可以在倒计时结束时使用\
  \ `webbrowser.open()` 函数打开特定的网站。与你在网上找到某些免费倒计时应用不同，自己的倒计时程序的警报可以是任何你想要的！\n\n## 类似程序的想法\n\
  \n倒计时是在继续执行之前的简单延迟。这也可以用于其他应用程序和功能，例如：\n\n* 使用 `time.sleep()` 让用户有机会按下 CTRL-C 取消操作，例如删除文件。你的程序可以打印“按\
  \ CTRL-C 取消”的消息，然后用 `try` 和 `except` 语句处理任何 `KeyboardInterrupt` 异常。\n* 对于倒计时，你可以使用\
  \ `timedelta` 对象来测量未来某个时刻（生日？纪念日？）之前的天、小时、分钟和秒。\n\n## 总结\n\nUnix 纪（1970 年 1 月 1\
  \ 日午夜 UTC）是包括 Python 在内的许多编程语言的标准参考时间。虽然 `time.time()` 模块返回纪元时间戳（即自 Unix 纪元以来秒数的浮点值），但\
  \ `datetime` 模块更适合执行日期算术以及格式化或解析带有日期信息的字符串。\n\n`time.sleep()` 函数将阻塞（即不返回）指定的秒数时间。它可以用于为你的程序添加暂停。但如果你想计划程序在特定时间启动，`http://nostarch.com/automatestuff/`\
  \ 上的说明可以告诉你如何使用操作系统已提供的调度器。\n\n\n\n\n\n`threading` 模块用于创建多个线程，这在你需要下载多个文件或同时执行其他任务时非常有用。但请确保线程只读写本地变量，否则你可能会遇到并发问题。\n\
  \n最后，你的 Python 程序可以使用 `subprocess.Popen()` 函数启动其他应用程序。可以将命令行参数传递给 `Popen()` 调，以便用该应用程序打开特定的文档。或者，你也可以使用\
  \ `Popen()` 调用 `start`、`open` 或 `see` 程序，利用你计算机的文件关联来自动确定应使用哪种应用程序打开文档。通过使用你电脑上的其他应用程序，你的\
  \ Python 程序可以利用它们的功能来满足你的自动化需求。\n\n## 练习题\n\n| Q: | 1\\. 什么是 Unix 纪（epoch）？ |\n\
  | Q: | 2\\. 哪个函数返回自 Unix 纪以来的秒数？ |\n| Q: | 3\\. 如何让你的程序恰好暂停 5 秒？ |\n| Q: | 4\\.\
  \ `round()` 函数返回什么？ |\n| Q: | 5\\. `datetime` 对象和 `timedelta` 对象之间有什么区别？ |\n| Q:\
  \ | 6\\. 假设你有一个名为 `spam()` 的函数。你如何在单独线程中调用此函数并运行其内部的代码？ |\n| Q: | 7\\. 为了避免多个线程之间的并发问题，你应该怎么做？\
  \ |\n| Q: | 8\\. 如何让你的 Python 程序运行位于 `C:\\Windows\\System32` 文件夹下的 `calc.exe` 程序？\
  \ |\n\n## 练习项目\n\n为了练习，请编写执行以下内容的程序。\n\n## 美化计时器\n\n扩展本章的计时器项目，使其使用 `rjust()` 和\
  \ `ljust()` 字符串方法对输出进行“美化”（这些方法在第 6 章中介绍过。）而不是输出如下所示：\n\n```\nLap #1: 3.56 (3.56)\n\
  Lap #2: 8.63 (5.07)\nLap #3: 17.68 (9.05)\nLap #4: 19.11 (1.43)\n```\n\n... 输出将看起来像这样：\n\
  \n```\nLap # 1:  3.56 (  3.56)\nLap # 2:  8.63 (  5.07)\nLap # 3: 17.68 (  9.05)\n\
  Lap # 4: 19.11 (  1.43)\n```\n\n注意，你需要 `lapNum`、`lapTime` 和 `totalTime` 整数和浮点变量的字符串版本，以便对它们调用字符串方法。\n\
  \n接下来，使用第 6 章中引入的 `pyperclip` 模块将输出复制到剪贴板，这样用户就可以快速将输出粘贴到文本文件或电子邮件。\n\n## 网络漫画下载器\n\
  \n编写一个程序检查多个网络漫画网站，如果漫画自程序上次访问以来已更新，则自动下载图像。你操作系统的调度程序（Windows 上的计划任务、OS X 上的 `launchd`\
  \ 以及 Linux 上的 `cron`）可以每天运行一次你的 Python 程序。Python 程序本身可以下载漫画并复制到桌面，以便查找。这将让你不再需要亲自检查网站查看是否已更新。（可以在\
  \ `http://nostarch.com/automatestuff/` 获取网络漫画列表。）\n\n# SMTP 发送电子邮件和短信\n\n检查和回复电子邮件非常耗费时间。当然，你不能只写一个程序来替你处理所有邮件，因为每条消息都需要自己的回复。但一旦你学会了编写可以发送和接收电子邮件的程序，仍然可以自动化许多与电子邮件相关的任务。例如，可能你有一个满客户记录的电子表格，并根据年龄和位置给每个客户发送不同的信件。商业软件可能无法为你完成这一点；幸运的是，你可以编写自己的程序来发送电子邮件，节省大量的复制和粘贴时间。你还可以编写程序发送电子邮件和短信，在你离开电脑时通知你某些情况。如果你正在自动化一个需要几个小时才能完成的任务，你并不希望每隔几分钟就回到电脑前检查程序的状态。相反，程序在完成后只需向你的手机发送短信——这样在你离开电脑时，就可以专注于关注更重要的事情了。\n\
  \n就像 HTTP 是计算机在互联网上发送网页的协议一样，简单邮件传输协议（SMTP）是用于发送电子邮件的协议。SMTP 规定了邮件消息应如何格式化、加密以及在邮件服务器之间中继，以及在你点击“发送”后计算机处理的所有细节。不过，你不需要了解这些技术细节，因为\
  \ Python 的 `smtplib` 模块将它们简化为了几个函数。SMTP 仅负责向他人发送电子邮件。另一种名为 IMAP 的协议负责检索发送给你的邮件，并在\
  \ IMAP 中进行了描述。\n\n你可能熟悉从 Outlook、Thunderbird 或通过 Gmail、Yahoo Mail 等网站发送电子邮件！遗憾的是，Python\
  \ 并没有为你提供像这些服务那样的图形化界面。相反，你通过调用函数来执行 SMTP 的每个主要步骤，如下面的交互式 shell 所示。\n\n### 注意\n\n\
  不要在 IDLE 中输入此示例；它将无法运行，因为 `smtp.example.com`、`bob@example.com`、`SECRET_PASSWORD`\
  \ 和 `alice@example.com` 只是占位符。此代码是使用 Python 发送电子邮件的概述。\n\n```\nimport smtplib\n\
  >>> smtpObj = smtplib.SMTP('smtp.example.com', 587)\n>>> smtpObj.ehlo()\n(250, b'mx.example.com\
  \ at your service, [216.172.148.131]\\nSIZE 35825\\nSTARTTLS\\nCHUNKING')\n>>> smtpObj.starttls()\n\
  (220, b'Ready to start TLS')\n>>> smtpObj.login('bob@example.com', '你的密码')\n(235,\
  \ b'Accepted')\n>>> smtpObj.sendmail('bob@example.com', 'alice@example.com', 'Subject:\
  \ So long.\\nDear Alice, so long and thanks for the fish.\\nSincerely, Bob')\n{}\n\
  >>> smtpObj.quit()\n(221, b'closing connection')\n```\n\n在接下来的章节中，我们将通过替换你的信息来连接并登录\
  \ SMTP 服务器、发送电子邮件并断开连接。\n\n## 连接 SMTP 服务器\n\n如果你曾经设置过 Thunderbird、Outlook 或其他程序连接到电子邮件账户，你可能熟悉配置\
  \ SMTP 服务器和端口。这些设置对于每个电子邮件提供者都不同，但搜索 `<your provider> smtp settings` 可以找到使用的服务器和端口。\n\
  \nSMTP 服务器的域名名称通常是你的电子邮件提供者的域名名称，前面加上 `smtp.`。例如，Gmail 的 SMTP 服务器位于 `smtp.gmail.com`。表\
  \ 16-1 列出了常见的电子邮件提供者及其 SMTP 服务器。（端口是一个整数值，几乎总是是 587，它用于命令加密标准 TLS。）\n\n表 16-1. 电子邮件提供者及其\
  \ SMTP 服务器\n\n| 提供者 | SMTP 服务器域名名称 |\n| --- | --- |\n| Gmail | `smtp.gmail.com`\
  \ |\n| Outlook.com/Hotmail.com | `smtp-mail.outlook.com` |\n| Yahoo Mail | `smtp.mail.yahoo.com`\
  \ |\n| AT&T | `smpt.mail.att.net` (端口 465) |\n| Comcast | `smtp.comcast.net` |\n\
  | Verizon | `smtp.verizon.net` (端口 465) |\n\n\n\n\n\n```\n>>> smtpObj = smtplib.SMTP('smtp.gmail.com',\
  \ 587)\n>>> type(smtpObj)\n<class 'smtplib.SMTP'>\n```\n\n输入 `type(smtpObj)` 可以让你看到\
  \ `smtpObj` 中存储了一个 `SMTP` 对象。你需要这个 `SMTP` 对象来调用登录和发送邮件的方法。如果 `smtplib.SMTP()` 调用未成功，可能是因为你的\
  \ SMTP 服务器在 `587` 端口上不支持 TLS。在这种情况下，你将需要使用 `smtplib.SMTP_SSL()` 和端口 `465` 来创建一个\
  \ `SMTP` 对象。\n\n```\n>>> smtpObj = smtplib.SMTP_SSL('smtp.gmail.com', 465)\n```\n\
  \n字体 注意（Note）\n\n如果你没有连接到互联网，Python 将抛出 `socket.gaierror: [Errno 11004] getaddrinfo\
  \ failed` 或类似的异常。\n\n对于你的程序来说，TLS 和 SSL 之间的区别并不重要。你只需要知道你的 SMTP 服务器使用哪种加密标准，以便知道如何连接它。在接后的所有交互式\
  \ shell 示例中，变量 `smtpObj` 将包含由 `smtplib.SMTP()` 或 `smtplib.SMTP_SSL()` 函数返回的 `SMTP`\
  \ 对象。\n\n## 发送 SMTP “Hello”消息\n\n一旦你获取了 `SMTP` 对象，就可以调用其命名奇特的 `ehlo()` 方法来向 SMTP\
  \ 邮件服务器“打招呼”。这个问候是 SMTP 的第一步，对于建立服务器的连接至关重要。你不需要了解这些协议的细节。只需确保在获取 `SMTP` 对象后立即调用\
  \ `ehlo()` 方法，否则后续的方法调用将导致错误。以下是 `ehlo()` 调用及其返回值的示例：\n\n```\n>>> smtpObj.ehlo()\n\
  (250, b'mx.google.com at your service, [216.172.148.131]\\nSIZE 35882577\\\nn8BITMIME\\\
  nSTARTTLS\\nENHANCEDSTATUSCODES\\nCHUNKING')\n```\n\n如果返回的元组中的第一个项是整数 `250`（SMTP\
  \ 中表示“成功”的代码），则表示问候成功。\n\n## 启动 TLS 加密\n\n如果你正在连接到 SMTP 服务器上的 `587` 端口（即你正在使用 TLS\
  \ 加密），你接下来需要调用 `starttls()` 方法。这一必要步骤会为你的连接启用加密。如果你连接到端口 `465`（使用 SSL），则加密已经设置好了，你应该跳过这一步。\n\
  \n以下是 `starttls()` 方法调用的示例：\n\n```\n>>> smtpObj.starttls()\n(220, b'2.0.0 Ready\
  \ to start TLS')\n```\n\n`starttls()` 将你的 SMTP 连接置于 TLS 模式。返回值中的 `220` 告诉服务器已就绪。\n\
  \n## 登录 SMTP 服务器\n\n一旦建立了到 SMTP 服务器的加密连接，你就可以调用 `login()` 方法使用用户名（通常是你的邮箱地址）和邮件密码登录。\n\
  \n```\n>>> smtpObj.login(' my_email_address@gmail.com ', ' MY_SECRET_PASSWORD ')\n\
  (235, b'2.7.0 Accepted')\n```\n\n### Gmail 的应用专用密码\n\nGmail 为 Google 账户提供了额外的安全功能，称为“应用专用密码”。当你的程序尝试登录时收到\
  \ `Application-specific password required`（需要应用专用密码）错误消息，你必须为你的 Python 脚本设置其中一个密码。请查看\
  \ `http://nostarch.com/automatestuff/` (http://nostarch.com/automatestuff/) 资源，获取如何为\
  \ Google 账户设置应用专用密码的详细说明。\n\n将你的邮箱地址字符串作为第一个参数，将密码字符串作为第二个参数。返回值中的 `235` 表示身份验证成功。如果密码错误，Python\
  \ 将抛出 `smtplib.SMTPAuthenticationError` 异常。\n\n### 警告（Warning）\n\n小心不要在源代码中放置密码。如果任何人复制了你的程序，他们将获得访问你邮箱的权限！调用\
  \ `input()` 让用户输入密码是一个好主意。虽然每次运行程序都要输入密码可能不方便，但这种方法可以防止你将密码留在电脑的未加密文件中，黑客或笔记本电脑小偷者可以轻易获取它。\n\
  \n## 发送邮件\n\n一旦登录到你的邮件提供商的 SMTP 服务器，你就可以调用 `sendmail()` 方法实际发送邮件。`sendmail()` 方法的调用如下：\n\
  \n```\n>>> smtpObj.sendmail(' my_email_address@gmail.com ', ' recipient@example.com\
  \ ',\n'Subject: So long.\\nDear Alice, so long and thanks for all the fish. Sincerely,\n\
  Bob')\n{}\n```\n\n`sendmail()` 方法需要三个参数：\n\n- 你的邮箱地址字符串（作为邮件的“发件人”地址）\n- 收件人的邮箱地址字符串或多个收件人的字符串列表（作为“收件人”地址）\n\
  - 邮件正文字符串\n\n邮件正文字符串的开头*必须*以 `'Subject: \\n'` 作为邮件主题。`'\\n'` 换行符分隔主题行和邮件正文。\n\n\
  `sendmail()` 的返回值是一个字典。对于每个发送失败的收件人，都会有一个键值对。空字典意味着所有收件人均发送成功。\n\n## 断开 SMTP 连接\n\
  \n发送完邮件后，务必调用 `quit()` 方法。这将你的程序与 SMTP 服务器断开连接。\n\n```\n>>> smtpObj.quit()\n(221,\
  \ b'2.0.0 closing connection smtp')\n```\n\n返回值中的 `221` 表示会话结束。\n\n要回顾连接、登录、发送邮件和断开连接的所有步骤，请参阅发送邮件。\n\
  \n# IMAP\n\n正如 SMTP 是发送邮件的协议一样，互联网消息访问协议（IMAP）规定了如何与邮件提供商服务器通信以检索邮件。Python 自带 `imaplib`\
  \ 模块，但实际上第三方 `imapclient` 模块更容易使用。本章提供了 IMAPClient 的介绍；完整文档位于 http://imapclient.readthedocs.org/\
  \ (http://imapclient.readthedocs.org/)。\n\n`imapclient` 模块从 IMAP 服务器下载邮件时，格式相当复杂。你可能需要将它们从这种格式转换为简单的字符串值。`pyzmail`\
  \ 模块为你完成了解析这些邮件的困难工作。你可以在 http://www.magiksys.net/pyzmail/ (http://www.magiksys.net/pyzmail/)\
  \ 找到 PyzMail 的完整文档。\n\n从终端窗口安装 `imapclient` 和 `pyzmail`。附录 A 有如何安装第三方模块。\n\n# 使用\
  \ IMAP 和删除邮件\n\n在 Python 中查找和检索邮件是一个多步骤过程，需要使用 `imapclient` 和 `pyzmail` 这两个第三方模块。为了让你有一个概览，这里有一个完整的示例，展示了如何登录\
  \ IMAP 服务器、搜索邮件、获取邮件，然后从从中提取邮件正文内容。\n\n\n\n\n\n```python\n>>> import imapclient\n\
  >>> imapObj = imapclient.IMAPClient('imap.gmail.com', ssl=True)\n>>> imapObj.login('\
  \ my_email_address@gmail.com ', ' MY_SECRET_PASSWORD ')\n'my_email_address@gmail.com\
  \ Jane Doe authenticated (Success)'\n>>> imapObj.select_folder('INBOX', readonly=True)\n\
  >>> UIDs = imapObj.search(['SINCE 05-Jul-2014'])\n>>> UIDs\n[40032, 40033, 40034,\
  \ 40035, 40036, 40037, 40038, 40039, 40040, 40041]\n>>> rawMessages = imapObj.fetch([40041],\
  \ ['BODY[]', 'FLAGS'])\n>>> import pyzmail\n>>> message = pyzmail.PyzMessage.factory(rawMessages[40041]['BODY[]'])\n\
  >>> message.get_subject()\n'Hello!'\n>>> message.get_addresses('from')\n[('Edward\
  \ Snowden', 'esnowden@nsa.gov')]\n>>> message.get_addresses('to')\n[(Jane Doe',\
  \ 'jdoe@example.com')]\n>>> message.get_addresses('cc')\n[]\n>>> message.get_addresses('bcc')\n\
  []\n>>> message.text_part != None\nTrue\n>>> message.text_part.get_payload().decode(message.text_part.charset)\n\
  'Follow the money.\\r\\n\\r\\n-Ed\\r\\n'\n>>> message.html_part != None\nTrue\n\
  >>> message.html_part.get_payload().decode(message.html_part.charset)\n'<div dir=\"\
  ltr\"><div>So long, and thanks for all the fish!<br><br></div>-\nAl<br></div>\\\
  r\\n'\n>>> imapObj.logout()\n```\n\n不需要记住这些步骤。在我们详细介绍每一个步骤之后，你可以回来查看此概述以复习记忆。\n\n\
  ## 连接到 IMAP 服务器\n\n就像你需要一个 `SMTP` 对象来连接到 SMTP 服务器并发送邮件一样，你需要一个 `IMAPClient` 对象来连接到\
  \ IMAP 服务器并接收邮件。首先，你需要你的电子邮件提供商的 IMAP 服务器的域名。这与 SMTP 服务器的域名不同。表 16-2 列出了几个流行电子邮件提供商的\
  \ IMAP 服务器。\n\n表 16-2. 电子邮件提供商及其 IMAP 服务器\n\n| 提供商 | IMAP 服务器域名 |\n| --- | --- |\n\
  | Gmail | `imap.gmail.com` |\n| Outlook.com/Hotmail.com | `imap-mail.outlook.com`\
  \ |\n| Yahoo Mail | `imap.mail.yahoo.com` |\n| AT&T | `imap.mail.att.net` |\n| Comcast\
  \ | `imap.comcast.net` |\n| Verizon | `incoming.verizon.net` |\n\n一旦你获取了 IMAP 服务器的域名，调用\
  \ `imapclient.IMAPClient()` 函数来创建一个 `IMAPClient` 对象。大多数电子邮件提供商都要求 SSL 加密，因此请传递 `ssl=True`\
  \ 关键字参数。在交互式 shell 中输入以下内容（使用你提供者的域名）：\n\n```python\n>>> import imapclient\n>>>\
  \ imapObj = imapclient.IMAPClient('imap.gmail.com', ssl=True)\n```\n\n在后续章节的所有交互式\
  \ shell 示例中，`imapObj` 变量将包含由 `imapclient.IMAPClient()` 函数返回的 `IMAPClient` 对象。在此上下文中，*客户端*（client）是指连接到服务器的对象。\n\
  \n## 登录 IMAP 服务器\n\n一旦你有了 `IMAPClient` 对象，调用它的 `login()` 方法，并将用户名（通常是你的电子邮件地址）和密码作为字符串传入。\n\
  \n```python\n>>> imapObj.login(' my_email_address@gmail.com ', ' MY_SECRET_PASSWORD\
  \ ')\n'my_email_address@gmail.com Jane Doe authenticated (Success)'\n```\n\n## 警告\n\
  \n记住，永远不要直接在代码中编写密码！相反，设计你的程序以接受 `input()` 返回的密码。\n\n如果 IMAP 服务器拒绝此用户名/密码组合，Python\
  \ 将抛出 `imaplib.error` 异常。对于 Gmail 账户，你可能需要使用应用程序专用密码；更多信息请参阅 Gmail 的应用程序专用密码。\n\n\
  ## 搜索邮件\n\n一旦登录，检索你感兴趣的邮件实际上分两个步骤。首先，你必须选择一个文件夹。然后，调用 `IMAPClient` 对象的 `search()`\
  \ 方法并传入一个字符串。\n\n### 选择文件夹\n\n几乎每个账户默认都有 `INBOX`，但你也可以通过调用 `imapclient` 对象的 `list()`\
  \ 方法获取文件夹列表。要选择文件夹，将名称传递给 `select_folder(readonly=True)`。\n\n```python\n>>> imapObj.select_folder('INBOX',\
  \ readonly=True)\n```\n\n`readonly=True` 参数可以防止你对任何邮件进行更改或删除。如果你想删除邮件，请将 `readonly`\
  \ 设置为 `False`。\n\n### 执行搜索\n\n选择文件夹后，你现在可以使用 `IMAPClient` 对象的 `search()` 方法搜索邮件。`search()`\
  \ 的参数是一个字符串列表，表 16-3 描述了各种搜索键。\n\n表 16-3. IMAP 搜索键\n\n| 搜索键 | 含义 |\n| --- | ---\
  \ |\n| `'ALL'` | 返回文件夹中的所有邮件。参见限制。 |\n| `'BEFORE` `date`*, `'ON` `date`*, `'SINCE`\
  \ `date`* | 这三个搜索键分别返回在指定 `date` 之前、当天或之后接收的邮件。日期格式必须为 `05-Jul-2015`。此外，`'SINCE\
  \ 05-Jul-2015'` 会匹配 7 月 5 日及之后的邮件，而 `'BEFORE 05-Jul-2015'` 只匹配 7 月 5 日之前的邮件（不包含当天）。\
  \ |\n| `'SUBJECT` `string`*, `'BODY` `string`*, `'TEXT` `string`* | 返回 `string`\
  \ 存在于主题、正文或二者之一的邮件。如果 `string` 包含空格，请用双引号括起来：`'TEXT \"search with spaces\"'`。 |\n\
  | `'FROM` `string`*, `'TO` `string`*, `'CC` `string`*, `'BCC` `string`* | 分别返回 `string`\
  \ 存在于发件人邮件地址、收件人地址、抄送（cc）地址或密抄（bcc）地址的邮件。如果 `string` 中有多个电子邮件地址，请用空格分隔它们并将它们全部用双引号括起来：`'CC\
  \ \"firstcc@example.com secondcc@example.com\"'`。 |\n| `'SEEN'`, `'UNSEEN'` | 分别返回带有和不带已读（Seen）标记的邮件。如果邮件通过\
  \ `fetch()` 方法调用（后文描述）访问，或者在电子邮件程序或网络浏览器中检查邮件时被点击，它就会获得 *Seen* 标记。人们更常说邮件已“读取”而不是“已读”，但它们的意思相同。\
  \ |\n| `'ANSWERED'`, `'UNANSWERED'` | 分别返回带有和不带已回复（Answered）标记的邮件。当邮件被回复时，它会获得 *Answered*\
  \ 标记。 |\n\n\n\n\n\n| `'DELETED'`, `'UNDELETED'` | 分别返回所有带有和不带有 `Deleted` 标记的邮件。使用\
  \ `delete_messages()` 方法删除的电子邮件会被赋予 `Deleted` 标记，但在调用 `expunge()` 方法之前，它们并不会被永久删除（请参删除邮件）。请注意，某些邮件提供商（如\
  \ Gmail）会自动清理邮件。 |\n| `'DRAFT'`, `'UNDRAFT'` | 分别返回所有带有和不带有 `Draft` 标记的邮件。草稿邮件通常保留在单独的\
  \ `Drafts` 文件夹中，而不是 `INBOX` 文件夹中。 |\n| `'FLAGGED'`, `'UNFLAGGED'` | 分别返回所有带有和不带有\
  \ `Flagged` 标记的邮件。此标记通常用于将邮件标记为“重要”或“紧急”。 |\n| `'LARGER N'`, `'SMALLER N'` | 分别返回所有大于\
  \ `N` 字节或小于 `N` 字节的邮件。 |\n| `'NOT search-key'` | 返回 `search-key` **不会**返回的邮件。 |\n\
  | `'OR search-key1 search-key2'` | 返回匹配第一个或第二个 `search-key` 的邮件。 |\n\n请注意，某些 IMAP\
  \ 服务器在处理标记和搜索密钥方面的实现方式可能略有不同。你可能需要在交互式 shell 中进行一些实验，以查看它们的具体行为。\n\n你可以在向 `search()`\
  \ 方法的 `list` 参数中传递多个 IMAP 搜索密钥字符串。返回的邮件是匹配`all`搜索密钥的邮件。如果你想匹配`any`搜索密钥，请使用 `OR`\
  \ 搜索密钥。对于 `NOT` 和 `OR` 搜索密钥，后面分别会跟上一个完整的搜索密钥和两个完整的搜索密钥。\n\n以下是一些 `search()` 方法调用的示例及其含义：\n\
  \n*   `imapObj.search(['ALL'])`。返回当前选择文件夹中的所有邮件。\n*   `imapObj.search(['ON 05-Jul-2015'])`。返回\
  \ 2015 年 7 月 5 日发送的所有邮件。\n*   `imapObj.search(['SINCE 01-Jan-2015', 'BEFORE 01-Feb-2015',\
  \ 'UNSEEN'])`。返回 2015 年 1 月发送的所有未读邮件。（注意，这意味着从 1 月 1 日（包含）起，但不包含 2 月 1 日的邮件。）\n\
  *   `imapObj.search(['SINCE 01-Jan-2015', 'FROM alice@example.com'])`。返回 2015 年初以来来自\
  \ `alice@example.com` 的所有邮件。\n*   `imapObj.search(['SINCE 01-Jan-2015', 'NOT FROM\
  \ alice@example.com'])`。返回 2015 年初以来除 `alice@example.com` 之外的所有人员发送的邮件。\n*   `imapObj.search(['OR\
  \ FROM alice@example.com FROM bob@example.com'])`。返回所有来自 `alice@example.com` 或 `bob@example.com`\
  \ 发送过的所有邮件。\n*   `imapObj.search(['FROM alice@example.com', 'FROM bob@example.com'])`。技巧示例！此搜索将永远不会返回任何邮件，因为邮件必须匹配`all`搜索关键词。由于只能有一个“来自”地址，一封邮件就不同时来自\
  \ `alice@example.com` 和 `bob@example.com` 是可能的。\n\n`search()` 方法返回的不是邮件本身，而是以整数值形式表示的邮件唯一标识（UIDs）。然后你可以将这些\
  \ UIDs 传递给 `fetch()` 方法以获取邮件内容。\n\n通过输入以下内容继续交互式 shell 示例：\n\n```python\n>>> UIDs\
  \ = imapObj.search(['SINCE 05-Jul-2015'])\n>>> UIDs\n[40032, 40033, 40034, 40035,\
  \ 40036, 40037, 40038, 40039, 40040, 40041]\n```\n\n在这里由 `search()` 返回的邮件 ID 列表（针对\
  \ 7 月 5 日起收到的邮件）存储在 `UIDs` 中。你计算机上返回的 UID 列表与此处显示的不同；它们对于特定的电子邮件账户是唯一的。当你之后将 UIDs\
  \ 传递给其他函数调用时，请使用你收到的 UID 值，而不是本书示例中的值。\n\n### 大小限制\n\n如果你的搜索匹配了大量邮件，Python 可能会抛出异常\
  \ `imaplib.error: got more than 10000 bytes`。当发生这种情况时，你必须断开并重新连接到 IMAP 服务器并重试。\n\
  \n设置此限制是为了防止你的 Python 程序消耗过多内存。遗憾的是，默认限制通常太小了。你可以将此限制从 10,000 字节更改为 10,000 字节。\n\
  \n### 获取邮件并将其标记为已读\n\n一旦你拥有了 UID 列表，就可以调用 `imapClient` 对象的 `fetch()` 方法获取邮件内容。\n\
  \nUID 列表将是 `fetch()` 的第一个参数。第二个参数应该是列表 `['BODY[]']`，它告诉 `fetch()` 下载邮件的正文内容。\n\n\
  让我们继续交互式 shell 示例。\n\n```python\n>>> rawMessages = imapObj.fetch(UIDs, ['BODY[]'])\n\
  >>> import pprint\n>>> pprint.pprint(rawMessages)\n{40040: {'BODY[]': 'Delivered-To:\
  \ my_email_address@gmail.com\\r\\n'\n                   'Received: by 10.76.71.167\
  \ with SMTP id '\n                   --snip--\n                   '\\r\\n'\n   \
  \                '------=_Part_6000970_707736290.1404819487066--\\r\\n',\n     \
  \    'SEQ': 5430}}\n```\n\n你可以看到，`'BODY[]'` 键中的邮件内容非常难以理解。它采用一种名为 RFC 822 的格式，专为\
  \ IMAP 服务器读取设计的。但你不需要理解 RFC 822 格式；在本章后面的部分，`pyzmail` 模块将为你解析它。\n\n\n\n\n当你选择一个文件夹进行搜索时，你带有\
  \ `readonly=True` 关键字参数调用了 `select_folder()`。这样做可以防止你不小心删除邮件——但也意味着如果你使用 `fetch()`\
  \ 方法获取邮件，邮件将不会被标记为已读。如果你确实想在获取邮件时将它们标记为已读，则需要向 `select_folder()` 传递 `readonly=False`。如果所选文件夹已经处于只读模式，你可以通过再次调用\
  \ `select_folder()` 来重新选择当前文件夹，这次使用 `readonly=False` 关键字参数：\n\n```\n>>> imapObj.select_folder('INBOX',\
  \ readonly=False)\n```\n\n## 从原始消息中获取邮箱地址\n\n`fetch()` 方法返回的原始消息对于只想阅读邮件的人来说仍然不是很有用。`pyzmail`\
  \ 模块解析这些原始消息并将它们作为 `PyzMessage` 对象返回，这使得你的 Python 代码可以轻松访问邮件的主题、正文、“收件人字段、“发件人字段以及邮件的其他部分。\n\
  \n使用以下内容继续交互式命令行示例（使用你自己的邮箱账户的 UID，而不是这里显示的这些）：\n\n```\n>>> import pyzmail\n>>>\
  \ message = pyzmail.PyzMessage.factory(rawMessages[40041]['BODY[]'])\n```\n\n首先，导入\
  \ `pyzmail`。然后，要创建一个邮件的 `PyzMessage` 对象，调用 `pyzmail.PyzMessage.factory()` 函数并将原始消息的\
  \ `'BODY[]'`部分传递传递。将结果存储在 `message` 中。现在 `message` 包含一个 `PyzMessage` 对象，它有几个方法可以轻松获取邮件的主题以及所有的发送者和收件人地址。`get_subject()`\
  \ 方法将主题作为简单的字符串值返回。`get_addresses()` 方法返回你传递给它的字段的地址列表。例如，方法调用可能如下：\n\n```\n>>>\
  \ message.get_subject()\n'Hello!'\n>>> message.get_addresses('from')\n[('Edward\
  \ Snowden', 'esnowden@nsa.gov')]\n>>> message.get_addresses('to')\n[(Jane Doe',\
  \ 'my_email_address@gmail.com')]\n>>> message.get_addresses('cc')\n[]\n>>> message.get_addresses('bcc')\n\
  []\n```\n\n注意 `get_addresses()` 的参数是 `'from'`、`'to'`、`'cc'` 或 `'bcc'`。`get_addresses()`\
  \ 的返回值元组列表。每个元组包含两个字符串：第一个与邮箱地址相关的名称，第二个是邮箱地址本身。如果请求字段中没有地址，`get_addresses()` 将返回一个空列表。在这里，`'cc'`\
  \ 抄送和 `'bcc'` 密抄字段都不包含地址，因此返回了空列表。\n\n## 从原始消息中获取正文\n\n邮件可以以纯文本、HTML 或两者都有的形式发送。纯文本邮件只包含文本，而\
  \ HTML 邮件可以包含颜色、字体、图像和其他让邮件内容看起来像一个小型网页的特性。如果邮件仅为纯文本格式，则其 `PyzMessage` 对象的 `html_part`\
  \ 属性将设置为 `None`。同样，如果邮件仅为 HTML，其 `PyzMessage` 对象的 `text_part` 属性将设置为 `None`。\n\n\
  否则，`text_part` 或 `html_part` 值将有一个 `get_payload()` 方法，该方法将邮件正文作为 `bytes` 数据类型的值返回。（`bytes`\
  \ 数据类型超出了本书的范围。）但这仍然不是我们可以使用的字符串值。哎！最后一步是对 `get_payload()` 返回的字节值调用 `decode()` 方法。`decode()`\
  \ 方法接受一个参数：消息的字符编码，存储在 `text_part.charset` 或 `html_part.charset` 属性中。这最终将返回邮件正文的字符串。\n\
  \n输入以下内容继续交互式命令行示例：\n\n```\n➊ >>> message.text_part != None\n   True\n   >>> message.text_part.get_payload().decode(message.text_part.charset)\n\
  ➋ 'So long, and thanks for all the fish!\\r\\n\\r\\n-Al\\r\\n'\n➌ >>> message.html_part\
  \ != None\n   True\n➍ >>> message.html_part.get_payload().decode(message.html_part.charset)\n\
  \   '<div dir=\"ltr\"><div>So long, and thanks for all the fish!<br><br></div>-Al\n\
  \   <br></div>\\r\\n'\n```\n\n我们正在处理的邮件同时包含纯文本和 HTML 内容，因此存储在 `message` 中的 `PyzMessage`\
  \ 对象的 `text_part` 和 `html_part` 属性不等于 `None` ➊ ➌。在消息的 `text_part` 上调用 `get_payload()`，然后对字节值调用\
  \ `decode()`，返回邮件文本版本的字符串 ➋。对消息的 `html_part` 使用 `get_payload()` 和 `decode()` 返回邮件\
  \ HTML 版本的字符串 ➍。\n\n## 删除邮件\n\n要删除邮件，将消息 UID 列表传递给 `IMAPClient` 对象的 `delete_messages()`\
  \ 方法。这会将邮件标记为 `Deleted`（已删除）。调用 `expunge()` 方法将永久删除所有带有 `Deleted` 标记的邮件。考虑以下交互式示例：\n\
  \n```\n➊ >>> imapObj.select_folder('INBOX', readonly=False)\n➋ >>> UIDs = imapObj.search(['ON\
  \ 09-Jul-2015'])\n   [40066]\n➌ >>> imapObj.delete_messages(UIDs)\n   {40066: ('Seen',\
  \ '\\Deleted')}\n   >>> imapObj.expunge()\n   ('Success', [(5452, 'EXISTS')])\n\
  ```\n注意，某些邮件提供商（如 Gmail）会在调用 `delete_messages()` 时自动删除邮件，而不是等待 `expunge` 命令。\n\n\
  ## 断开 IMAP 服务器连接\n\n当你的程序完成检索或删除邮件后，只需调用 `IMAPClient` 的 `logout()` 方法即可断开 IMAP 服务器的连接。\n\
  \n```\n>>> imapObj.logout()\n```\n\n如果你的程序运行几或更长时间，IMAP 服务器可能会超时或自动断开。在这种情况下，你的程序对\
  \ `IMAPClient` 进行的下一次方法调用将引发异常：\n\n```\nimaplib.abort: socket error: [WinError 10054]\
  \ An existing connection was forcibly closed by the remote host\n```\n\n在这种情况下，你的程序必须再次调用\
  \ `IMAPClient()` 连接。\n\n# 项目：发送会费提醒邮件\n\n假设你被“委派”为志愿者俱乐部跟踪会费。这是一项非常无聊的工作，涉及维护一份每月缴费者的表格，并向未缴费的人发送提醒邮件。与其自己去查看表格并给每个欠费的人复制相同的邮件，让我们——你猜得没错——写一个脚本来替你完成工作。\n\
  \n从高层次来说，你的程序将执行：\n\n*   从 Excel 表格中读取数据。\n*   找到所有未缴纳最新会费的成员。\n*   找到他们的邮箱地址并发送个性化的提醒。\n\
  \n这意味着你的代码需要：\n\n*   使用 `openpyxl` 模块打开并读取 Excel 文档的单元格。（有关处理 Excel 文件，请参见 第 12\
  \ 章 。）\n\n\n\n\n*   创建一个欠缴会费成员的字典。\n*   通过调用 `smtplib.SMTP()`、`ehlo()`、`starttls()`\
  \ 和 `login()` 登录 SMTP 服务器。\n*   对于所有欠缴会费的成员，通过调用 `sendmail()` 方法发送一封个性化的提醒邮件。\n\n\
  打开一个新文件编辑器窗口并将其保存为 `sendDuesReminders.py`。\n\n## 第 1 ：打开 Excel 文件\n\n假设你用于跟踪成员会费缴纳情况的\
  \ Excel 表格如图 16-2 所示，并且位于名为 `duesRecords.xlsx` 的文件中。你可以从 *[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)*\
  \ 下载此文件。\n\n![跟踪成员会费缴纳情况的表格](img/httpatomoreillycomsourcenostarchimages2189713.png.jpg)\n\
  \n图 16-2。跟踪成员会费缴纳情况的表格\n\n此表格包含每个成员的姓名和电子邮件地址。每个月有一列用于跟踪成员的付款状态。一旦某个成员缴纳了会费，该成员对应的单元格就会被标记为文本\
  \ `paid`。\n\n程序必须打开 `duesRecords.xlsx`，并通过调用 `get_highest_column()` 方法来确定最新月份的列。（你可以查阅第\
  \ 12 章以获取更多关于使用 `openpyxl` 模块访问 Excel 表格文件单元格的信息。）在文件编辑器窗口中输入以下代码：\n\n```python\n\
  #! python3\n# sendDuesReminders.py - 根据表格中的付款状态发送邮件。\n\nimport openpyxl, smtplib,\
  \ sys\n\n# 打开表格并获取最新的会费状态。\n➊ wb = openpyxl.load_workbook('duesRecords.xlsx')\n\
  ➋ sheet = wb.get_sheet_by_name('Sheet1')\n\n➌ lastCol = sheet.get_highest_column()\n\
  ➍ latestMonth = sheet.cell(row=1, column=lastCol).value\n\n# TODO: 每个成员的付款状态。\n\
  # TODO: 登录邮箱账户。\n# TODO: 发送提醒邮件。\n```\n\n在导入 `openpyxl`、`smtplib` 和 `sys` 模块后，我们打开\
  \ `duesRecords.xlsx` 文件并将生成的 `Workbook` 对象存储在 `wb` 中 ➊。然后我们获取 Sheet 1 并将生成的 `Worksheet`\
  \ 对象存储在 `sheet` 中 ➋。现在我们有了一个 `Worksheet` 对象，可以访问行、列和单元格了。我们将最高列存储在 `lastCol` 中 ➌，然后使用行号\
  \ 1 和 `lastCol` 访问应该包含最新月份的单元格。我们获取该单元格的值并将其存储在 `latestMonth` 中 ➍。\n\n## 第 2 ：找到所有未付款成员\n\
  \n一旦你确定了最新月份的列号（存储在 `lastCol` 中），你就可以遍历第一行（包含列标题的行）之后的所有行，以查看哪些成员在该月份的会费单元格中具有 `paid`\
  \ 文本。如果该成员未付款，你可以分别从第 1 列和第 2 列获取该成员的姓名和电子邮件地址。这些信息将进入 `unpaidMembers` 字典，该字典将跟踪所有在最新月份未付款的成员。将以下代码添加到\
  \ `sendDuesReminder.py` 中。\n\n```python\n#! python3\n# sendDuesReminders.py - 根据表格中的付款状态发送邮件。\n\
  \n--snip--\n\n# 每个成员的付款状态。\nunpaidMembers = {}\n➊ for r in range(2, sheet.get_highest_row()\
  \ + 1):\n➋     payment = sheet.cell(row=r, column=lastCol).value\n     if payment\
  \ != 'paid':\n➌         name = sheet.cell(row=r, column=1).value\n➍         email\
  \ = sheet.cell(row=r, column=2).value\n➎         unpaidMembers[name] = email\n```\n\
  \n这段代码设置了一个空字典 `unpaidMembers`，然后遍历第一行之后的所有行 ➊。对于每一行，最新列的值被存储在 `payment` 中 ➋。如果\
  \ `payment` 不等于 `'paid'`，则将第一列的值存储在 `name` 中 ➌，将第二列的值存储在 `email` 中 ➍，并将 `name` 和\
  \ `email` 添加到 `unpaidMembers` 中 ➎。\n\n## 第 3 ：发送个性化提醒邮件\n\n一旦你有了所有未付款成员的列表，就是时候给他们发送提醒邮件了。将以下代码添加到你的程序，但要替换为你真实的电子邮件地址和供应商信息：\n\
  \n```python\n#! python3\n# sendDuesReminders.py - 根据表格中的付款状态发送邮件。\n\n--snip--\n\n\
  # 登录邮箱账户。\nsmtpObj = smtplib.SMTP('smtp.gmail.com', 587)\nsmtpObj.ehlo()\nsmtpObj.starttls()\n\
  smtpObj.login(' my_email_address@gmail.com ', sys.argv[1])\n```\n\n通过调用 `smtplib.SMTP('smtp.gmail.com',\
  \ 587)` 并传递域名和端口来创建一个 `SMTP` 对象。调用 `ehlo()` 和 `starttls()`，然后调用 `login()` 并传递你的电子邮件地址和\
  \ `sys.argv[1]`，这将存储你的密码。一旦你的程序登录了账户，它应该遍历 `unpaidMembers` 字典并向每个成员发送个性化邮件。将以下代码添加到\
  \ `sendDuesReminder.py`：\n\n```python\n#! python3\n# sendDuesReminders.py - 根据表格中的付款状态发送邮件。\n\
  \n--snip--\n\n# 发送提醒邮件。\nfor name, email in unpaidMembers.items():\n➊     body =\
  \ \"Subject: %s unpaid.\\nDear %s,\\nRecords show that you have not\npaid dues for\
  \ %s. Please make this payment as soon as possible. Thank you!'\" %\n   (latestMonth,\
  \ name, latestMonth)\n➋     print('Sending email to %s...' % email)\n➌     sendmailStatus\
  \ = smtpObj.sendmail('my_email_address@gmail.com', email, body)\n\n➍     if sendmailStatus\
  \ != {}:\n           print('There was a problem sending email to %s: %s' % (email,\n\
  \           sendmailStatus))\nsmtpObj.quit()\n```\n\n这段代码遍历姓名和电子邮件。对于每一行，我们打印输出正在向该电子邮件地址发送邮件\
  \ ➋。然后我们调用 `sendmail()`，传递发件地址和个性化消息 ➌。我们将返回值存储在 `sendmailStatus` 中。\n\n记住，如果 SMTP\
  \ 服务器在发送特定邮件时报告错误，`sendmail()` 方法将返回一个非空字典。`for` 循环的最后部分 ➍ 检查返回的字典是否非空，如果是，则打印电子邮件地址和返回字典。\n\
  \n在程序发送所有邮件后，调用 `quit()` 方法断开 SMTP 服务器。\n\n当你运行程序时，输出看起来像这样：\n\n```\nSending email\
  \ to alice@example.com...\nSending email to bob@example.com...\nSending email to\
  \ eve@example.com...\n```\n\n收者将收到一封邮件，如图 16-3。\n\n# 使用 Twilio 发送短信\n\n大多数人在手机附近的概率比在电脑附近大，因此短信可能是比邮件更直接、更可靠的通知方式。此外，短信的短长度使得人们更有可能去阅读它们。\n\
  \n\n\n\n在本节中，你将学习如何注册免费的 Twilio 服务，并使用其 Python 模块发送短信。Twilio 是一个 `SMS gateway service`，这意味着是一项允许你通过程序发送短信的服务。虽然你每月发送的短信数量有限制，且短信会带有\
  \ `Sent from a Twilio trial account` 字样，但这个试用服务对于你的个人程序可能足够了。免费试用是无限期的；你以后不需要升级付费计划。\n\
  \nTwilio 并不是唯一的短信网关服务。如果你不想使用 Twilio，可以在互联网上搜索 `free sms gateway`、`python sms api`\
  \ 甚至 `twilio alternatives` 来寻找替代服务。\n\n在注册 Twilio 账户之前，请安装 `twilio` 模块。附录 A 有关于安装第三方模块的更多详细信息。\n\
  \n### 注意\n\n本节专门针对美国。Twilio 确实为美国以外的国家提供短信服务，但这些具体细节未在本书中涵盖。不过，`twilio` 模块及其函数在美国境外也同样适用。欲了解更多信息，请访问\
  \ [`twilio.com/`](http://twilio.com/)。\n\n## 注册 Twilio 账户\n\n访问 [`twilio.com/`](http://twilio.com/)\
  \ 并填写注册表单。一旦注册了新账户，你需要验证一个你想要发送短信的手机号码。（这种验证是为了防止人们利用该服务向随机手机号码发送垃圾短信。）\n\n收到带有验证码的短信后，将其输入\
  \ Twilio 网站，以证明你拥有正在验证的手机号码。现在，你就可以使用 `twilio` 模块向该手机号码发送短信了。\n\nTwilio 为你的试用账户提供了一个号码作为短信的发送者。你还需要另外两个信息：你的\
  \ `account SID` 和 `auth`（身份验证）令牌。登录 Twilio 账户后，可以在 Dashboard 页面找到这些信息。从 Python 程序中登录时，这些值相当于你的\
  \ Twilio 用户名和密码。\n\n## 发送短信\n\n一旦安装了 `twilio` 模块、注册了 Twilio 账户、验证了手机号码、注册了 Twilio\
  \ 号并获取了 `account SID` 和 `auth token`，你就可以准备好从 Python 脚本给自己发送短信了。\n\n与所有的注册步骤相比，实际的\
  \ Python 代码相当简单。在电脑连接互联网的情况下，在交互式 shell 中输入以下内容，并将 `accountSID`、`authToken`、`myTwilioNumber`\
  \ 和 `myCellPhone` 变量值替换为真实信息：\n\n```\n➊ >>> from twilio.rest import TwilioRestClient\n\
  \   >>> accountSID = 'ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'\n   >>> authToken = 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'\n\
  ➋ >>> twilioCli = TwilioRestClient(accountSID, authToken)\n   >>> myTwilioNumber\
  \ = '+14955551234'\n   >>> myCellPhone = '+14955558888'\n➌ >>> message = twilioCli.messages.create(body='Mr.\
  \ Watson - Come here - I want\n   to see you.', from_=myTwilioNumber, to=myCellPhone)\n\
  ```\n\n输入最后一行几秒后，你应该应该收到一条内容为 `Sent from your Twilio trial account - Mr. Watson\
  \ - Come here - I want to see you` 的短信。\n\n由于 `twilio` 模块的设置方式，你需要使用 `from twilio.rest\
  \ import TwilioRestClient` 来导入它，而不仅仅是 `import twilio` ➊。将你的账户 SID 存储在 `accountSID`\
  \ 中，将认证令牌存储在 `authToken` 中，然后调用 `TwilioRestClient()` 并传递传递 `accountSID` 和 `authToken`。调用\
  \ `TwilioRestClient()` 返回一个 `TwilioRestClient` 对象 ➋。该对象有一个 `messages` 属性，该属性又有一个\
  \ `create()` 方法，你可以用它来发送短信。该方法将指示 Twilio 服务器发送你的短信。在将你的 Twilio 号和手机号分别存储在 `myTwilioNumber`\
  \ 和 `myCellPhone` 后，调用 `create()` 并传递关键字参数，以指定短信正文、发送者号码（`myTwilioNumber`）和接收者号码（`myCellPhone`）\
  \ ➌。\n\n`create()` 方法返回的 `Message` 对象将包含已发送短信的信息。输入以下内容继续交互式 shell 示例：\n\n```\n\
  >>> message.to\n'+14955558888'\n>>> message.from_\n'+14955551234'\n>>> message.body\n\
  'Mr. Watson - Come here - I want to see you.'\n```\n\n`to`、`from_` 和 `body` 属性应分别持有你的手机号、Twilio\
  \ 号和消息。注意，发送手机号码位于 `from_` 属性中——结尾带有下划线——而不是 `from`。这是因为 `from` 是 Python 中的关键字（例如你已经在\
  \ `from modulename import *` 形式的 `import` 语句中见过它），所以它不能作为属性名。使用以下内容继续交互式 shell 示例：\n\
  \n```\n>>> message.status\n'queued'\n>>> message.date_created\ndatetime.datetime(2015,\
  \ 7, 8, 1, 36, 18)\n>>> message.date_sent == None\n```\n\n`status` 属性应该返回一个字符串。`date_created`\
  \ 和 `date_sent` 属性返回一个 `datetime` 对象（如果短信已创建）。如果 `status` 为 `'queued'` 而 `date_sent`\
  \ 为 `None`，看起来可能很奇怪。这是因为你在短信实际发送*之前*获取了 `Message` 对象。你需要重新获取 `Message` 对象才能看到最新的\
  \ `status`。每条 Twilio 消息都有一个唯一的 ID (SID)，可以使用：\n'SM09520de763ba3af136fc7c5f4b51'\n\
  >>> updatedMessage = twilioCli.messages.get(message.sid)\n>>> updatedMessage.status\n\
  'delivered'\n>>> updatedMessage.date_sent\ndatetime.datetime(2015, 7, 8, 1, 36,\
  \ 18)\n```\n\n输入 `message.sid` 显示该 SID。通过将此 SID 传递给 Twilio 客户端的 `get()` 方法 ➊，你可以获取包含最新信息的\
  \ `Message` 对象。在这个新的 `Message` 对象中，`status` 和 `date_sent` 属性是正确的。`status` 属性将被设置为以下值之一：`'queued'`、`'sending'`、`'sent'`、`'delivered'`、`'undelivered'`\
  \ 或 `'failed'`。这些状态是不言而喻的，但若需更精确的细节，请参考资源。\n\n遗憾的是，使用 Twilio 接收短信比发送短信复杂得多。Twilio\
  \ 需要你运行一个拥有自己的 Web 应用程序。这超出了本书的范围，但你可以在资源中找到更多详细信息。\n\n# 项目：“给我发短信”模块\n\n你最经常从程序发送短信的人可能是你自己。短信是你离开电脑时向自己发送通知的极佳方式。如果你用程序自动化了一项需要运行几个小时的枯燥任务，你可以让它在完成后通过短信通知你。或者你可能有一个定期运行的程序，有时需要联系你，例如一个检查天气的程序提醒你带伞。\n\
  \n作为一个简单的示例，这里有一个小型 Python 程序，包含一个 `textmyself()` 函数，它可以发送作为字符串参数传递给它的。打开一个新的文件编辑器窗口并输入以下代码，将账户\
  \ SID、认证令牌和手机号码替换为你自己的信息。将其保存为 *textMyself.py*。\n\n\n\n\n```\n #! python3\n   #\
  \ textMyself.py - 定义 textmyself() 函数，将传递给它的\n   # 字符串作为短信发送。\n\n   # 预设值：\n   accountSID\
  \ = 'ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'\n   authToken = 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'\n\
  \   myNumber = '+15559998888'\n   twilioNumber = '+15552225678'\n\n   from twilio.rest\
  \ import TwilioRestClient\n\n➊ def textmyself(message):\n➋     twilioCli = TwilioRestClient(accountSID,\
  \ authToken)\n➌     twilioCli.messages.create(body=message, from_=twilioNumber,\
  \ to=myNumber)\n```\n\n此程序存储了 `accountSID`、`authToken`、发送号码 `twilioNumber` 以及接收号码\
  \ `myNumber`。它随后定义了 `textmyself()` 函数来接收参数 ➊，创建一个 `TwilioRestClient` 对象 ➋，并使用你传递的消息调用\
  \ `create()` ➌。\n\n如果你想让你的其他程序也能使用 `textmyself()` 函数，只需将 `textMyself.py` 文件放在与 Python\
  \ 可执行文件相同的文件夹中（Windows 上的 `C:\\Python34`，OS X 上的 `/usr/local/lib/python3.4`，以及 Linux\
  \ 上的 `/usr/bin/python3`）。现在你可以在其他程序中使用该函数了。每你想让其中一个程序给你发短信时，只需添加以下内容：\n\n```\nimport\
  \ textmyself\ntextmyself.textmyself('The boring task is finished.')\n```\n\n你只需要注册\
  \ Twilio 并编写一次短信代码。之后，只需两行代码即可从你的任何其他程序中发送短信。\n\n## 总结\n\n我们在互联网和手机网络上通过数十种不同的方式相互通信，但电子邮件和短信占据主流。你的程序可以通过这些通道进行通信，这为它们提供了强大的新通知功能。你甚至可以编写运行在不同计算机上的程序，让它们通过电子邮件直接相互通信：一个程序使用\
  \ SMTP 发送邮件，另一个程序则通过 IMAP 获取邮件。\n\nPython 的 `smtplib` 提供了通过你的电子邮件提供商的 SMTP 服务器发送邮件的函数。同样，第三方模块\
  \ `imapclient` 和 `pyzmail` 允许你访问 IMAP 服务器并检索发送给你的邮件。虽然 IMAP 比 SMTP 稍微复杂，但它也非常强大，允许你搜索特定的邮件、下载邮件并对其进行解析以提取主题和正文的字符串值。\n\
  \n短信与电子邮件略有不同，因为与电子邮件不同，发送短信需要的不仅仅是互联网连接。幸运的是，像 Twilio 这样的服务提供了模块，允许你从程序中发送短信。一旦你完成了初始设置过程，只需几行代码就能发送短信。\n\
  \n在你的技能树中掌握这些模块后，你将能够编写程序发送通知或提醒的特定条件。现在，你的程序的触范围将远超它们运行运行的计算机！\n\n## 练习题\n\n| Q:\
  \ | 1\\. 发送邮件的协议是什么？检查和接收邮件的协议是什么？ |\n\n| Q: | 2\\. 登录 SMTP 服务器必须调用哪四个 `smtplib`\
  \ 函数/方法？ |\n\n| Q: | 3\\. 登录 IMAP 服务器必须调用哪两个 `imapclient` 函数/方法？ |\n\n| Q: | 4\\\
  . 你向 `imapObj.search()` 传递什么类型的参数？ |\n\n| Q: | 5\\. 如果你的代码收到显示 `got more than 10000\
  \ bytes` 的错误信息，该怎么办？ |\n\n| Q: | 6\\. `imapclient` 模块处理连接到 IMAP 服务器和查找邮件。哪一个模块负责处理\
  \ `imapclient` 收集的邮件？ |\n\n| Q: | 7\\. 在发送短信之前，你从 Twilio 需要哪三条信息？ |\n\n## 练习项目\n\
  \n为了练习，请编写执行以下功能的程序。\n\n## 随机家务分配邮件发送器\n\n编写一个程序，接收一组人的邮箱列表和一个需要完成的家务列表，并随机将家务分配给这些人。给每人发送邮件告知其分配的家务。如果你很有野心，可以记录每个人之前分配过的家务，以确保程序避免再次给任何人分配他们上次做过的相同家务。另一个可能的功能是安排程序每周自动运行一次。\n\
  \n这里有一个提示：如果你向 `random.choice()` 函数传递一个列表，它将从列表中随机选择一个项。你的代码部分可以像这样：\n\n```\nchores\
  \ = ['dishes', 'bathroom', 'vacuum', 'walk dog']\nrandomChore = random.choice(chores)\n\
  chores.remove(randomChore) # 这项家务现在已被占用，所以将其删除\n```\n\n## 雨伞提醒\n\n第 11 章 向你展示了如何使用\
  \ `requests` 模块从 `http://weather.gov/` 爬取数据。编写一个在你早上醒来之前运行的程序，检查当天是否下雨。如果是，让程序给你发短信提醒你在出门前带上雨伞。\n\
  \n## 自动退订\n\n编写一个程序扫描你的邮箱账户，找到所有邮件中的所有取消订阅链接，并在浏览器中自动打开它们。这个程序必须登录你的电子邮件提供商的 IMAP\
  \ 服务器。你可以使用 BeautifulSoup（在第 11 章 中涵盖过）来检查 HTML 标签中任何 `unsubscribe` 实例。\n\n一旦你获得了这些\
  \ URL 列表，可以使用 `webbrowser.open()` 自动打开它们。你仍然需要手动处理并完成额外的退订步骤，但这个脚本让你无需翻阅所有邮件来寻找退订。然后你可以将此脚本传给朋友，让他们在邮箱账户上运行。（只需确保你的邮箱密码没有硬编码在代码中！）\n\
  \n## 通过电子邮件控制计算机\n\n编写一个程序每 15 分钟检查一次邮箱账户，执行你通过邮件发送的指令。例如，BitTorrent 是一种点对点下载系统。使用\
  \ qBittorrent 等免费 BitTorrent 软件，你可以在家里计算机下载大型媒体文件。如果你给程序发送 BitTorrent 链接，程序最终检查邮件，找到该邮件，提取链接，然后启动\
  \ qBittorrent 开始下载。这样，你可以在离开时让家里计算机开始下载，并在返回家时下载完成。\n\n第 15 章 涵盖了如何使用 `subprocess.Popen()`\
  \ 函数在计算机上启动程序。例如，以下调用将启动 qBittorrent 程序以及一个 torrent 文件：\n\n```\nqbProcess = subprocess.Popen(['C:\\\
  \\Program Files (x86)\\\\qBittorrent\\\\qbittorrent.exe', 'shakespeare_complete_works.torrent'])\n\
  ```\n\n当然，你可能希望程序确保邮件来自你。特别地，你可能要求邮件必须包含密码，因为黑客伪造邮件“发件人”地址是相当容易的。程序应该删除它找到的邮件，以免在每次检查邮箱账户时重复执行指令。作为额外功能，让程序在每次执行命令时都给你发送邮件或短信作为确认信息。由于你不会坐在运行程序的计算机前，最好使用日志函数（参阅第\
  \ 10 章）写入一个文本文件日志，以便在出现错误时可以进行检查。\n\n\n\n\n\nqBittorrent（以及其他 BitTorrent 应用）有一项功能，可以在下载完成后自动退出。第\
  \ 15 章 解释了如何使用 `Popen` 对象的 `wait()` 方法来确定启动的应用程序何时已退出。`wait()` 方法的调用会阻塞，直到 qBittorrent\
  \ 停止，然后你的程序就可以发送电子邮件或短信通知你下载已完成。\n\n你可以为这个项目添加很多可能的功能。如果你在某个地方卡住了，可以从 *[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)*\
  \ 下载该程序的示例实现。\n\n# 第 17 章 图像处理\n\n如果你拥有一台数码相机，或者只是从手机将照片上传到 Facebook，你可能经常与数字图像文件打交道。你可能知道如何使用基础图形软件，例如微软画画或\
  \ Paintbrush，甚至是更高级的应用程序如 Adobe Photoshop。但如果你需要编辑大量的图像，手动编辑它们将是一项漫长且无聊的工作。\n\n\
  现在 Python 登场。Pillow 是一个用于与图像文件交互的第三方 Python 模块。该模块有几个函数，可以轻松裁剪、调整大小和编辑图像内容。凭借像使用微软画画或\
  \ Adobe Photoshop 等软件一样处理图像的能力，Python 可以轻松地自动编辑数百或数千张图像。\n\n# 计算机图像基础\n\n为了处理图像，你需要了解计算机处理图像中颜色和坐标的基础知识，以及如何在\
  \ Pillow 中处理颜色和坐标。在继续之前，请安装 `pillow` 模块。有关安装第三方模块的帮助，请参见附录 A。\n\n## 颜色与 RGBA 值\n\
  \n计算机程序通常将图像中的颜色表示为 `RGBA value`。`RGBA value` 是一组数字，指定颜色中红、绿、蓝和 `alpha`（或透明度）的量。这些分量值中的每一个都是\
  \ `0`（完全没有）到 `255`（最大值）的整数。这些 `RGBA values` 被分配给单个 `pixels`（像素）；像素是计算机屏幕可以显示的单色最小单位圆点（正如你可以想象的，屏幕上有数百万个像素）。像素的\
  \ `RGB` 设置会精确地告诉它应该显示何种深色的颜色。图像还有 alpha 值来创建 `RGBA values`。如果图像在背景图像或桌面壁纸上显示在屏幕上，alpha\
  \ 值决定了你可以通过图像像素“看透”多少的背景。\n\n在 Pillow 中，`RGBA values` 由由四个整数值组成的元组表示。例如，红色表示为 `(255,\
  \ 0, 0, 255)`。这种颜色具有最大量的红色，没有绿色或蓝色，以及最大的 alpha 值，这意味着它是完全不透明的。绿色表示为 `(0, 255, 0,\
  \ 255)`，蓝色表示为 `(0, 0, 255, 255)`。白色是所有颜色的组合，`(255, 255, 255, 255)`，而没有任何颜色的黑色是 `(0,\
  \ 0, 0, 255)`。\n\n如果某种颜色的 alpha 值为 `0`，它是不可见的，`RGB values` 是什么实际上并不重要。毕竟，不可见的红色看起来和不可见的黑色是一样的。\n\
  \nPillow 使用 HTML 所使用的标准颜色名称。表 17-1 列出了一部分标准颜色名称及其值。\n\n### 表 17-1. 标准颜色名称及其 RGBA\
  \ 值\n\n| 名称 | RGBA 值 | 名称 | RGBA 值 |\n| --- | --- | --- | --- |\n| 白色 | `(255, 255,\
  \ 255, 255)` | 红色 | `(255, 0, 0, 255)` |\n| 绿色 | `(0, 128, 0, 255)` | 蓝色 | `(0,\
  \ 0, 255, 255)` |\n| 灰色 | `(128, 128, 128, 255)` | 黄色 | `(255, 255, 0, 255)` |\n\
  | 黑色 | `(0, 0, 0, 255)` | 紫色 | `(128, 0  128, 255)` |\n\nPillow 提供 `ImageColor.getcolor()`\
  \ 函数，这样你就不需要记忆想要使用的颜色的 `RGBA values`。该函数接受颜色名称字符串作为第一个参数，并将字符串 `'RGBA'` 作为第二个参数，然后返回一个\
  \ `RGBA` 元组。\n\n## CMYK 与 RGB 显色\n\n在小学，你学过混合红、黄、蓝颜料可以形成其他颜色；例如，你可以混合蓝色和黄色来制作绿色颜料。这被称为\
  \ `subtractive color model`（减色色模型），它适用于染料、墨水和颜料。这就是为什么打印机有 `CMYK` 墨盒：`Cyan`（青）、`Magenta`（品红）、`Yellow`（黄）。\n\
  \n## 坐标与边界元组\n\n图像像素通过 `x-` 和 `y-coordinates` ，分别指定像素在图像中的水平和垂直位置。`origin`（原点）是图像左上角的像素，用\
  \ `(0, 0)` 表示。第一个零代表 `x-coordinate`（x 坐标），它从原点开始向右增加。第二个零代表 `y-coordinate`（y 坐标），它从原点开始向下增加。这里需要重复一下：y\
  \ 坐标是向下增加，这与你可能在数学课上记忆的 y 坐标相反。图 17-1 展示了这种坐标系是如何工作的。\n\nPillow 的许多函数和方法接受 `box\
  \ tuple` 参数。这意味着 Pillow 期望一个由四个整数坐标组成的元组，代表图像中的一个矩形区域。这四个整数顺序如下：\n\n*   `Left`（左）：框左边缘的\
  \ x 坐标。\n*   `Top`（上）：框上边缘的 y 坐标。\n*   `Right`（右）：框右侧一个像素的 x 坐标。此整数必须大于左整数。\n* \
  \  `Bottom`（下）：框底部下方一个像素的 y 坐标。此整数必须大于上整数。\n\n\n\n\n请注意，该框包含了左侧和上方的坐标，包含但不包含右侧和下方的坐标。例如，框的元组\
  \ `(3, 1, 9, 6)` 代表图 17-2 表示的区域\") 中黑色框中的所有像素。\n\n# 使用 Pillow 处理图像\n\n现在你已经了解了 Pillow\
  \ 中颜色和坐标是如何工作的，让我们 own 使用 Pillow 来处理图像。图 17-3 是本章中所有交互式 shell 示例将将使用的图像。你可以从*[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)*\
  \ 下载它。\n\n一旦你在当前工作目录下有了图像文件 `Zophie.png`，就可以准备将 Zophie 的图像加载到 Python 中，如下所示：\n\n\
  ```\n>>> from PIL import Image\n>>> catIm = Image.open('zophie.png')\n```\n\n![我的猫\
  \ Zophie。相机让它重了 10 磅（这对猫来说非常多）。](img/httpatomoreillycomsourcenostarchimages2189721.png.jpg)\n\
  \n图 17-3. 我的猫 Zophie。相机让它重了 10 磅（这对猫来说非常多）。\n\n要加载图像，你只需从 Pillow 导入 `Image` 模块并调用\
  \ `Image.open()`，传递图像的文件名。然后，你可以将加载的图像存储在像 `CatIm`get 变量中。Pillow 的模块名为 `PIL`，这是为了与一个名为\
  \ Python Imaging Library 的旧模块兼容，这就是为什么你必须运行 `from PIL import Image` 而不是 `from Pillow\
  \ import Image`。由于 Pillow 创建者设置 `pillow` 模块的方式，你必须使用 `from PIL import Image` 这种形式的\
  \ `import` 语句，而不是简单地 `import PIL`。\n\n如果图像文件不在当前工作目录下，可以通过调用 `os.chdir()` 函数将工作目录更改为包含图像文件的文件夹。\n\
  \n```\n>>> import os\n>>> os.chdir('C:\\\\folder_with_image_file')\n```\n\n`Image.open()`\
  \ 函数返回 `Image` 对象数据类型的值，这是 Pillow 将图像表示为 Python 值的方式。你可以通过向 `Image.open()` 函数传递文件名的字符串，从图像文件（任何格式）加载一个\
  \ `Image` 对象。你对 `Image` 对象所做的的任何更改都可以使用 `save()` 方法保存到图像文件（同样可以是任何格式）中。所有的旋转、缩放、裁剪、绘图和其他图像处理都将通过对此\
  \ `Image` 对象调用方法来完成。\n\n为了缩短本章的示例，我假设你已经导入了 Pillow 的 `Image` 模块，并且将 Zophie 图像存储在名为\
  \ `catIm` 的变量中。请确保 `zophie.png` 文件位于当前工作目录下，以便 `Image.open()` 函数能够找到它。否则，你还必须在 `Image.open()`\
  \ 的字符串参数中指定完整的绝对路径。\n\n## 使用图像数据类型\n\n`Image` 对象具有几个实用的属性，可以提供关于其加载的图像文件的基本信息：它的宽度和高度、文件名以及图形格式（如\
  \ JPEG、GIF 或 PNG）。\n\n例如，在交互式 shell 中输入以下内容：\n\n```\n >>> from PIL import Image\n\
  \   >>> catIm = Image.open('zophie.png')\n   >>> catIm.size\n➊ (816, 1088)\n➋ >>>\
  \ width, height = catIm.size\n➌ >>> width\n   816\n➍ >>> height\n   1088\n   >>>\
  \ catIm.filename\n   'zophie.png'\n   >>> catIm.format\n   'PNG'\n   >>> catIm.format_description\n\
  \   'Portable network graphics'\n➎ >>> catIm.save('zophie.jpg')\n```\n\n从 `Zophie.png`\
  \ 创建 `Image` 对象并将 `Image` 对象存储在 `catIm` 之后，我们可以看到对象的 `size` 属性包含一个图像像素宽度和高度的元组 ➊。我们可以将元组中的值分配给\
  \ `width` 和 `height` 变量 ➋，以便单独访问宽度 ➌ 和高度 ➍。`filename` 属性描述原始文件的名称。`format` 和 `format_description`\
  \ 属性是描述原始文件图像格式的字符串（`format_description` 稍微详细一点）。\n\n最后，调用 `save()` 方法并向其传递 `'zophie.jpg'`，将一个名为\
  \ `zophie.jpg` 的新图像保存到你的硬盘上 ➎。Pillow 发现文件扩展名为 `.jpg`，并自动使用 JPEG 图像格式保存图像。现在你的硬盘上应该有两个图像，`zophie.png`\
  \ 和 `zophie.jpg`。虽然这些文件基于相同的图像，但由于格式不同，它们并不是相同的。\n\nPillow 还提供了 `Image.new()` 函数，它用于创建一个新图像。`Image.new()`\
  \ 返回一个 `Image` 对象，其参数如下：\n\n*   字符串 `'RGBA'`，设置图像模式。\n*   尺寸，一个包含图像宽度和高度的整数元组。\n\
  *   背景颜色，作为图像的颜色。\n\n例如，在交互式 shell 中输入以下内容：\n\n```\n >>> PIL import Image\n➊ >>>\
  \ im = Image.new('RGBA', (100, 200), 'purple')\n   >>> im.save('purpleImage.png')\n\
  ➋ >>> im2 = Image.new('RGBA', (20, 20), (0, 0, 0, 0))\n   >>> im2.save('transparentImage.png')\n\
  ```\n这里我们创建了一个宽 100 像素、高 200 像素的紫色背景的 `Image` 对象 ➊，该图像保存为 `purpleImage.png`。我们再次调用\
  \ `Image.new()` 创建另一个 `Image` 对象，这次传递尺寸为 `(20, 20)`，如果没有指定背景颜色，默认使用黑色 `(0, 0, 0,\
  \ 0)`，因此第二个图像具有透明背景 ➋ `transparentImage.png`。\n\n## 裁剪图像\n\n裁剪图像意味着在图像内部选择一个矩形区域并移除外部的所有内容。`Image`\
  \ 对象的 `crop()` 方法接收一个框元组并返回一个表示裁剪图像的 `Image` 对象。裁剪不是就地的——也就是说，原始的 `Image` 对象保持不变，`crop()`\
  \ 方法返回一个新的 `Image` 对象。\n\n在交互式 shell 中输入以下内容：\n\n```\n>>> croppedIm = catIm.crop((335,\
  \ 345, 565, 560))\n>>> croppedIm.save('cropped.png')\n```\n\n这为裁剪图像创建了一个新的 `Image`\
  \ 对象，将其存储在 `croppedIm` 中，然后对 `croppedIm` 调用 `save()` 将裁剪图像保存为 `cropped.png`。新文件\
  \ `cropped.png` 将从原始图像创建，如图 17-4。\n\n## 复制并粘贴到其他图像上\n\n`copy()` 方法将返回一个新的 `Image`\
  \ 对象，其内容与被调用的 `Image` 对象相同。如果你需要对图像进行更改，但想保留原始的未触动版本，这非常有用。例如，在交互式 shell 中输入以下内容：\n\
  \n```\n>>> catIm = Image.open('zophie.png')\n>>> catCopyIm = catIm.copy()\n```\n\
  \n\n\n`catIm` 和 `catCopyIm` 变量包含两个独立的 `Image` 对象，它们都拥有相同的图像。现在，你已经在 `catCopyIm`\
  \ 中存储了一个 `Image` 对象，你可以随心所欲地修改 `catCopyIm` 并将其保存为新文件名，同时保持 `zophie.png` 不变。例如，让我们尝试使用\
  \ `paste()` 方法修改 `catCopyIm`。\n\n`paste()` 方法在 `Image` 对象上调用，并将另一张图像粘贴到它的上方。让我们通过将一张较小的图像粘贴到\
  \ `catCopyIm` 上来继续 shell 示例。\n\n```\n>>> faceIm = catIm.crop((335, 345, 565, 560))\n\
  >>> faceIm.size\n(230, 215)\n>>> catCopyIm.paste(faceIm, (0, 0))\n>>> catCopyIm.paste(faceIm,\
  \ (400, 500))\n>>> catCopyIm.save('pasted.png')\n```\n\n首先，我们向 `crop()` 传递一个矩形元组，用于\
  \ `zophie.png` 中包含 Zophie 脸的区域。这创建了一个表示 230×215 裁剪区域的 `Image` 对象，将其存储在 `faceIm`\
  \ 中。现在我们可以将 `faceIm` 粘贴到 `catCopyIm` 上。`paste()` 方法接受两个参数：一个“源” `Image` 对象和一个 x、y\
  \ 坐标元组，决定了你想将源 `Image` 对象的左上角粘贴到主 `Image` 对象的位置。在这里，我们在 `catCopyIm` 上调用了两次 `paste()`，第一次传递\
  \ (0, 0)，第二次传递 (400, 500)。这会将 `faceIm` 两次粘贴到 `catCopyIm` 上：一次是 `faceIm` 的左上角位于 `catCopyIm`\
  \ 的 (0, 0)，另一次是 `faceIm` 的左上角位于 (400, 500)。最后，我们将修改后的 `catCopyIm` 保存为 `pasted.png`。`pasted.png`\
  \ 图像看起来就像 图 17-5。\n\n![脸粘贴了两次的猫咪 Zophie](img/httpatomoreillycomsourcenostarchimages2189725.png.jpg)\n\
  \n图 17-5. 脸粘贴了两次的猫咪 Zophie\n\n### 注意事项\n\n尽管名称如此，但 Pillow 中的 `copy()` 和 `paste()`\
  \ 方法并没有使用你计算机的剪贴板。\n\n请注意，`paste()` 方法会原地修改其 `Image` 对象；它不会返回一个带有已粘贴图像的 `Image`\
  \ 对象。如果你想调用 `paste()` 但又保留一个未被修改的原始图像版本，你需要先复制图像，然后在该副本上调用 `paste()`。\n\n假设你想将 Zophie\
  \ 的头部铺满整张图像，如 图 17-6 来复制猫的脸（如果可以这么说，这就是一个副本）。\")所示。你只需要几个 `for` 循环就能这种效果。输入以下内容继续交互\
  \ shell 示例：\n\n```\n >>> catImWidth, catImHeight = catIm.size\n   >>> faceImWidth,\
  \ faceImHeight = faceIm.size\n➊  >>> catCopyTwo = catIm.copy()\n➋ >>> for left in\
  \ range(0, catImWidth, faceImWidth):\n➌         for top in range(0, catImHeight,\
  \ faceImHeight):\n               print(left, top)\n               catCopyTwo.paste(faceIm,\
  \ (left, top))\n   0 0\n   0 215\n   0 430\n   0 645\n   0 860\n   0 1075\n   230\
  \ 0\n   230 215\n   --snip--\n   690 860\n   690 1075\n   >>> catCopyTwo.save('tiled.png')\n\
  ```\n\n在这里，我们将 `catIm` 的宽度和高度存储在 `catImWidth` 和 `catImHeight` 中。在 ➊ 处，我们创建了 `catIm`\
  \ 的副本并将其存储在 `catCopyTwo` 中。现在我们有了一个可以粘贴的副本，开始循环将 `faceIm` 粘贴到 `catCopyTwo` 上。外部\
  \ `for` 循环的 `left` 变量从 0 开始，并每次增加 `faceImWidth(230)` ➋。内部 `for` 循环的 `top` 变量从 0\
  \ 开始，每次增加 `faceImHeight(215)` ➌。这些嵌套的 `for` 循环产生了 `left` 和 `top` 的值，以便在 `catCopyTwo\
  \ Image` 对象上粘贴网格状的 `faceIm` 图像，如 图 17-6 来复制猫的脸（如果可以这么说，这就是一个副本）。\")所示。只需几个 `for`\
  \ 循环就能实现这种效果。输入以下内容继续交互 shell 示例。（注：此处提供的文本存在重复/混乱，已清理核心逻辑）。\n\n\n\n请注意，当图像旋转 90\
  \ 或 270 度时，图像的宽度和高度会发生变化。如果按其他角度旋转图像，图像的原始尺寸将保持不变。在 Windows 上，使用黑色背景来填充旋转产生的任何间隙，如图\
  \ 17-8 所示。在 OS X 上，则使用透明像素来填充间隙。\n\n`rotate()` 方法有一个可选的关键字参数 `expand`，可以将其设置为 `True`\
  \ 以扩大图像尺寸，以适应整个旋转后的新图像。可选的 `expand` 关键字参数可以设置为 `True` 以扩大图像尺寸，以适应整个旋转后的新图像。例如，在交互式外壳中输入以下内容：\n\
  \n```\n>>> catIm.rotate(6).save('rotated6.png')\n>>> catIm.rotate(6, expand=True).save('rotated6_expanded.png')\n\
  ```\n\n第一次调用将图像旋转 6 度并保存为 `rotate6.png`（参见图 17-8）左侧的图像）。第二次调用将图像旋转 6 度并将 `expand`\
  \ 设置为 `True`，然后保存为 `rotate6_expanded.png`（参见图 17-8）右侧的图像）。\n\n![图像正常旋转 6 度（左侧）以及使用\
  \ expand=True 旋转（右侧）](img/httpatomoreillycomsourcenostarchimages2189731.png.jpg)\n\
  \n图 17-8. 图像正常旋转 6 度（左侧）以及使用 `expand=True`（右侧）\n\n你还可以使用 `transpose()` 方法获取图像的“镜像翻转”。你必须向\
  \ `transpose()` 方法传递 `Image.FLIP_LEFT_RIGHT` 或 `Image.FLIP_TOP_BOTTOM`。在交互式外壳中输入以下内容：\n\
  \n```\n>>> catIm.transpose(Image.FLIP_LEFT_RIGHT).save('horizontal_flip.png')\n\
  >>> catIm.transpose(Image.FLIP_TOP_BOTTOM).save('vertical_flip.png')\n```\n\n与 `rotate()`\
  \ 一样，`transpose()` 创建一个新的 `Image` 对象。在这里，我们传递 `Image.FLIP_LEFT_RIGHT` 来水平翻转图像，然后将结果保存到\
  \ `horizontal_flip.png`。要垂直翻转图像，我们传递 `Image.FLIP_TOP_BOTTOM` 并保存到 `vertical_flip.png`。结果如图\
  \ 17-9 所示。\n\n![原始图像（左侧）、水平翻转（中间）和垂直翻转（右侧）](img/httpatomoreillycomsourcenostarchimages2189733.png.jpg)\n\
  \n图 17-9. 原始图像（左侧）、水平翻转（中间）和垂直翻转（右侧）\n\n## 修改单个像素\n\n可以使用 `getpixel()` 和 `putpixel()`\
  \ 方法获取或设置单个像素的颜色。这两个方法都接受一个表示像素 x 和 y 坐标的元组。`putpixel()` 方法还接受一个额外的元组参数作为像素颜色。该颜色参数是一个包含四个整数的\
  \ RGBA 元组或包含三个整数的 RGB 元组。在交互式外壳中输入以下内容：\n\n```\n➊ >>> im = Image.new('RGBA', (100,\
  \ 100))\n➋ >>> im.getpixel((0, 0))\n   (0, 0, 0, 0)\n➌ >>> for x in range(100):\n\
  \           for y in range(50):\n➍             im.putpixel((x, y), (210, 210, 210))\n\
  \   >>> from PIL import ImageColor\n➎ >>> for x in range(100):\n           for y\
  \ in range(50, 100):\n➏             im.putpixel((x, y), ImageColor.getcolor('darkgray',\
  \ 'RGBA'))\n   >>> im.getpixel((0, 0))\n   (210, 210, 210, 255)\n   >>> im.getpixel((0,\
  \ 50))\n   (169, 169, 169, 255)\n   >>> im.save('putPixel.png')\n```\n\n在 ➊ 处，我们创建一个新的\
  \ 100×100 透明正方形图像。在此图像的某些坐标上调用 `getpixel()` 返回 `(0, 0, 0, 0)`，因为图像是透明的 ➋。为图像中的像素上色，我们可以使用嵌套的\
  \ `for` 循环遍历图像上半部分的所有像素 ➌，并使用 `putpixel()` 为每个像素上色 ➍。在这里我们传递给 `putpixel()` 的 `(210,\
  \ 210, 210)`。该颜色参数是一个包含四个整数的 RGBA 元组或包含三个整数的 RGB 元组。\n\n\n\n\n通过在程序开头设置 `SQUARE_FIT_SIZE`\
  \ 和 `LOGO_FILENAME` 常量，我们使得以后修改程序变得非常简单。假设你要添加的 logo 不是猫咪图标，或者你想要将输出图像的最大尺寸减小到 300\
  \ 像素以外的其他数值。有了程序开头的这些常量，你只需要打开代码，修改一次这些值即可完成。（或者你也可以让这些常量的值从命令行参数中获取。）如果没有了这些常量，你将不得不在代码中搜索所有的\
  \ `300` 和 `'catlogo.png'` 实例，并将它们替换为你新项目的值。简而言之，使用常量会让你的程序更具通用性。\n\n`Image` 对象由\
  \ `Image.open()` 返回。为了代码的可读性，`logoWidth` 和 `logoHeight` 被赋值为来自 `logoIm.size` 的值。\n\
  \n程序的其余部分目前只是由 `TODO` 注释构成的骨架。\n\n## 第 2 步：遍历所有文件并打开图像\n\n现在，你需要找到当前工作目录下的每一个 `.png`\
  \ 和 `.jpg` 文件。注意，你不想将 logo 图像添加到 logo 图像本身，因此程序应该跳过文件名与 `LOGO_FILENAME` 相同的图像。在你的代码中添加以下内容：\n\
  \n```python\n#! python3\n# resizeAndAddLogo.py - 调整当前工作目录下所有图像的大小以适应\n#  300x300\
  \ 的正方形，并将 catlogo.png 添加到右下角。\n\nimport os\nfrom PIL import Image\n\n--snip--\n\n\
  os.makedirs('withLogo', exist_ok=True)\n# 遍历工作目录中的所有文件。\nfor filename in os.listdir('.'):\n\
  \    if not (filename.endswith('.png') or filename.endswith('.jpg')) \\\n      \
  \   or filename == LOGO_FILENAME:\n        continue # 跳过非图像文件和 logo 文件本身\n\n   \
  \ im = Image.open(filename)\n    width, height = im.size\n--snip--\n```\n\n首先，`os.makedirs()`\
  \ 调用创建一个 `withLogo` 文件夹来存储带有 logo 的完成图像，而不是覆盖原始图像文件。`exist_ok=True` 关键字参数会防止在 `withLogo`\
  \ 已经存在时 `os.makedirs()` 抛出异常。在使用 `os.listdir('.')` 遍历工作目录中的所有文件时，长 `if` 语句检查每个文件名是否不是以\
  \ `.png` 或 `.jpg` 结尾。如果是——或者该文件本身就是 logo 图像——循环应该跳过它并使用 `continue` 进入下一个文件。如果 `filename`\
  \ 确实以 `.png` 或 `.jpg` 结尾（且不是 logo 文件），你可以将其作为 `Image` 对象打开并设置 `width` 和 `height`。\n\
  \n## 第 3 步：调整图像大小\n\n程序应仅在宽度或高度大于 `SQUARE_FIT_SIZE`（在这种情况下为 300 像素）时调整图像，因此将所有的调整大小代码放在一个检查\
  \ `width` 和 `height` 变量的 `if` 语句中。为你的程序添加以下代码：\n\n```python\n#! python3\n# resizeAndAddLogo.py\
  \ - 调整当前工作目录下所有图像的大小以适应\n#  300x300 的正方形，并将 catlogo.png 添加到右下角。\n\nimport os\nfrom\
  \ PIL import Image\n\n--snip--\n\n  # 检查图像是否需要调整大小。\n  if width > SQUARE_FIT_SIZE\
  \ and height > SQUARE_FIT_SIZE:\n      # 计算调整大小的新宽度和高度。\n      if width > height:\n\
  \        height = int((SQUARE_FIT_SIZE / width) * height)\n        width = SQUARE_FIT_SIZE\n\
  \      else:\n        width = int((SQUARE_FIT_SIZE / height) * width)\n        height\
  \ = SQUARE_FIT_SIZE\n\n      # 调整图像大小。\n      print('Resizing %s...' % (filename))\n\
  \      im = im.resize((width, height))\n\n--snip--\n```\n\n如果图像确实需要调整大小，你需要弄清楚它是宽图还是高图。如果\
  \ `width` 大于 `height`，则高度减少的比例应与宽度减少的比例相同。这个比例是 `SQUARE_FIT_SIZE` 值除以当前宽度。新的 `height`\
  \ 值是该比例乘以当前的 `height` 值。由于除法运算符返回的是浮点值，而 `resize()` 要求尺寸为整数，请记住使用 `int()` 函数将结果转换为整数。最后，新的\
  \ `width` 值将简单地设置为 `SQUARE_FIT_SIZE`。\n\n如果 `height` 大于或等于 `width`（两种情况都在 `else`\
  \ 子句中处理），则进行相同的计算，只是交换了 `height` 和 `width` 变量。\n\n一旦 `width` 和 `height` 包含新的图像尺寸，将它们传递给\
  \ `resize()` 方法并将返回的 `Image` 对象存储在 `im` 中。\n\n## 第 4 步：添加 logo 并保存更改\n\n无论图像是否调整了大小，都应该粘贴\
  \ logo。在你的代码将 logo 粘贴到图像之后，它应该保存 `Image` 对象。\n\n```python\n#! python3\n# resizeAndAddLogo.py\
  \ - 调整当前工作目录下所有图像的大小以适应\n#  300x300 的正方形，并将 catlogo.png 添加到右下角。\n\nimport os\nfrom\
  \ PIL import Image\n\n--snip--\n\n  # 检查图像是否需要调整大小。\n  --snip--\n\n  # 添加 logo。\n\
  \  print('Adding logo to %s...' % (filename))\n  im.paste(logoIm, (width - logoWidth,\
  \ height - logoHeight), logoIm)\n\n  # 保存更改。\n  im.save(os.path.join('withLogo',\
  \ filename))\n```\n\n新代码打印了一条消息告诉用户正在添加 logo，在计算出的坐标处将 `logoIm` 粘贴到 `im` 上，并将更改保存到\
  \ `withLogo` 目录中的文件中。当你以 *zophie.png* 文件作为目录下唯一的图像运行此程序时，输出如下：\n\n```\nResizing\
  \ zophie.png...\nAdding logo to zophie.png...\n```\n\n图像 *zophie.png* 将变为一个 225×300\
  \ 像素的图像，看起来类似于图 17-13。请记住，如果不作为第三参数传递 `logoIm`，`paste()` 方法将不会粘贴透明像素。此程序可以在几分钟内自动调整数百张图像的大小并“添加\
  \ logo”。\n\n## 类似程序的想法\n\n批量组合图像或修改图像尺寸在许多应用程序中都用。你可以编写类似的程序来实现以下功能：\n\n*   在图像上添加文本或网站\
  \ URL。\n\n\n\n\n\n*   为图片添加时间戳。\n*   根据图片的大小将图片复制或移动到不同的文件夹中。\n*   在图片上添加半透明的水印以防止他人复制。\n\
  \n# 在图像上绘图\n\n如果你需要在图像上绘制线条、矩形、圆形或其他简单形状，可以使用 Pillow 的 `ImageDraw` 模块。在交互式 shell\
  \ 中输入以下内容：\n\n```python\n>>> from PIL import Image, ImageDraw\n>>> im = Image.new('RGBA',\
  \ (200, 200), 'white')\n>>> draw = ImageDraw.Draw(im)\n```\n\n首先，我们导入 `Image` 和\
  \ `ImageDraw`。然后我们创建一个新图像（在此情况下是一个 200×200 的白色图像），并将 `Image` 对象存储在 `im` 中。我们将 `Image`\
  \ 对象传递给 `ImageDraw.Draw()` 函数以获取一个 `ImageDraw` 对象。该对象有多个方法用于在 `Image` 对象上绘制形状和文本。将\
  \ `ImageDraw` 对象存储在 `draw` 等变量中，以便在后续示例中方便地使用。\n\n## 绘制形状\n\n以下 `ImageDraw` 方法可以在图像上绘制各种类型的形状。这些方法的\
  \ `fill` 和 `outline` 参数是可选的，如果不指定，默认将为白色。\n\n### 点\n\n`point(xy, fill)` 方法绘制单个像素。`xy`\
  \ 参数表示你想要绘制的点的列表。该列表可以是 x 和 y 坐标元组的列表，例如 `[(x, y), (x, y), ...]`，也可以是不带元组的 x 和 y\
  \ 坐标列表，例如 `[x1, y1, x2, y2, ...]`。`fill` 参数是点的颜色，可以是 RGBA 元组或颜色名称字符串（例如 `'red'`）。`fill`\
  \ 参数是可选的。\n\n### 线\n\n`line(xy, fill, width)` 方法绘制一条线或一系列线。`xy` 既可以是元组列表（例如 `[(x,\
  \ y), (x, y), ...]`），也可以是整数列表（例如 `[x1, y1, x2, y2, ...]`）。每个点都是你正在绘制的线条上的连接点之一。可选的\
  \ `fill` 参数是线条的颜色，格式为 RGBA 元组或颜色名称。可选的 `width` 参数是线条的宽度，如果不指定，默认为 1。\n\n### 矩形\n\
  \n`rectangle(xy, fill, outline)` 方法绘制矩形。`xy` 参数是一个格式为 `(left, top, right, bottom)`\
  \ 的边界框元组。`left` 和 `top` 值指定矩形左上角的 x 和 y 坐标，而 `right` 和 `bottom` 指定右下角。可选的 `fill`\
  \ 参数是用于填充矩形内部的颜色。可选的 `outline` 参数是矩形轮廓的颜色。\n\n### 圆\n\n`ellipse(xy, fill, outline)`\
  \ 方法绘制椭圆。如果椭圆的宽度高度相同，该方法将绘制一个圆。`xy` 参数是一个边界框元组（`left`, `top`, `right`, `bottom`），代表一个精确包含椭圆的框。可选的\
  \ `fill` 参数是椭圆内部的颜色，可选的 `outline` 参数是椭圆轮廓的颜色。\n\n### 多边形\n\n`polygon(xy, fill, outline)`\
  \ 方法绘制任意多边形。`xy` 参数是一个元组列表（例如 `[(x, y), (x, y), ...]`）或整数列表（例如 `[x1, y1, x2, y2,\
  \ ...]`），代表多边形边的连接点。最后一对坐标将自动连接到第一对。可选的 `fill` 参数是多边形内部的颜色，可选的 `outline` 参数是多边形轮廓的颜色。\n\
  \n### 绘图示例\n\n在交互式 shell 中输入以下内容：\n\n```python\n>>> from PIL import Image, ImageDraw\n\
  >>> im = Image.new('RGBA', (200, 200), 'white')\n>>> draw = ImageDraw.Draw(im)\n\
  ➊ >>> draw.line([(0, 0), (199, 0), (199, 199), (0, 199), (0, 0)], fill='black')\n\
  ➋ >>> draw.rectangle((20, 30, 60, 60), fill='blue')\n➌ >>> draw.ellipse((120, 30,\
  \ 160, 60), fill='red')\n➍ >>> draw.polygon(((57, 87), (79, 62), (94, 85), (120,\
  \ 90), (103, 113)), fill='brown')\n➎ >>> for i in range(100, 200, 10):\n       \
  \    draw.line([(i, 0), (200, i - 100)], fill='green')\n\n>>> im.save('drawing.png')\n\
  ```\n\n在为 200×200 的白色图像创建 `Image` 对象后，将其传递给 `ImageDraw.Draw()` 以获取 `ImageDraw` 对象，并将该\
  \ `ImageDraw` 对象存储在 `draw` 中，就可以调用 `draw` 的绘图方法。在这里，我们在图像边缘绘制了一个细的黑色轮廓 ➊，一个左上角在指定的蓝色矩形\
  \ ➋，一个红色的圆 ➌，一个棕色的多边形 ➍，以及一组绿色线条 ➎。\n\n# 绘制文本\n\n`ImageDraw` 对象有一个 `text()` 方法可以在图像上绘制文本。`text()`\
  \ 需要四个参数：`xy`、`text`、`fill` 和 `font`。\n\n*   `xy` 是文本左上角的坐标元组。\n*   `text` 是想要写入的文本字符串。\n\
  *   `fill` 是文本的颜色。\n*   `font` 是用于设置字体大小的可选 `ImageFont` 对象。\n\n由于很难预先知道给定字体下文本的大小，`ImageDraw`\
  \ 模块还提供了 `textsize()` 方法。它的第一个参数是想要测量的字符串，第二个参数是可选的 `ImageFont` 对象。`textsize()`\
  \ 方法将返回该文本如果写入图像时对应的宽度和高度。你可以使用这些值来精确计算放置文本的位置。\n\n在使用 `text()` 之前，让我们来看可选的第四个参数\
  \ `ImageFont` 对象。要创建一个，先运行：\n\n```python\nfrom PIL import ImageFont\n```\n\n现在你导入了\
  \ Pillow 的 `ImageFont` 模块，可以调用 `ImageFont.truetype()` 函数，它接受两个参数。第一个参数是 TrueType\
  \ 文件的字符串——这是硬盘上的实际字体文件。TrueType 文件具有 *.ttf* 扩展名，通常位于以下文件夹：\n\n*   Windows：`C:\\\
  Windows\\Fonts`\n*   OS X：`/Library/Fonts` 和 `/System/Library/Fonts`\n*   Linux：`/usr/share/fonts/truetype`\n\
  \n你实际上不需要在 TrueType 文件字符串中输入这些路径，因为 Python 会自动在这些目录中搜索字体。但如果无法找到指定的字体，Python 将显示错误。\n\
  \n`ImageFont.truetype()` 的第二个参数是以磅为的字体字体整数（而不是像素）。请记住 Pillow 创建的 PNG 图像默认每英寸 72\
  \ 像素，而一点是 1/72 英寸。\n\n在交互式 shell 中输入以下内容，将 `FONT_FOLDER` 替换为你操作系统使用的实际文件夹名称：\n\n\
  \n\n\n\n```\n >>> from PIL import Image, ImageDraw, ImageFont\n   >>> import os\n\
  ➊ >>> im = Image.new('RGBA', (200, 200), 'white')\n➋ >>> draw = ImageDraw.Draw(im)\n\
  ➌ >>> draw.text((20, 150), 'Hello', fill='purple')\n   >>> fontsFolder = 'FONT_FOLDER'\
  \ # e.g. 'Library/Fonts'\n➍ >>> arialFont = ImageFont.truetype(os.path.join(fontsFolder,\
  \ 'arial.ttf'), 32)\n➎ >>> draw.text((100, 150), 'Howdy', fill='gray', font=arialFont)\n\
  \   >>> im.save('text.png')\n```\n\n导入 `Image`、`ImageDraw`、`ImageFont` 和 `os` 后，我们为新的\
  \ 200×200 白色图像创建了一个 `Image` 对象 ➊，并从该 `Image` 对象创建了一个 `ImageDraw` 对象 ➋。我们使用 `text()`\
  \ 在 (20, 150) 处用紫色的 `Hello` ➌。我们在此次 `text()` 调用中没有传递可选的第四个参数，因此该文本的字体和大小没有经过自定义。\n\
  \n要设置字体类型和大小，我们首先将文件夹名称（如 `/Library/Fonts`）存储在 `fontsFolder` 中。然后我们调用 `ImageFont.truetype()`，并传入我们所需的字体的\
  \ `.ttf` 文件，随后传入一个整型字体大小 ➍。将从 `ImageFont.truetype()` 获取的 `Font` 对象存储在 `arialFont`\
  \ 等变量中，然后在最后的关键字参数中将该变量传递给 `text()`。➎ 处的 `text()` 调用在 (100, 150) 处用灰色和 32 磅 Arial\
  \ 字体绘制了 `Howdy`。\n\n生成的 `text.png` 文件看起来将像图 17-15。\n\n![生成的 text.png 图像](img/httpatomoreillycomsourcenostarchimages2189745.png.jpg)\n\
  \n图 17-15. 生成 `text.png` 图像\n\n## 总结\n\n图像由像素集合组成，每个像素都有一个颜色的 RGBA 值，并通过 x  和 y\
  \ 坐标进行访问。两种常见的图像格式是 JPEG 和 PNG。`pillow` 模块可以处理这两种格式以及其他格式。\n\n当图像加载到 `Image` 对象中时，其宽度和高度维度以双整数元组的形式存储在\
  \ `size` 属性中。`Image` 数据类型的对象还具有常用图像操作的方法：`crop()`、`copy()`、`paste()`、`resize()`、`rotate()`\
  \ 和 `transpose()`。要将 `Image` 对象保存为图像文件，请调用 `save()` 方法。\n\n如果你想让程序在图像上绘制形状，请使用 `ImageDraw`\
  \ 方法来绘制点、线、矩形、椭圆和多边形。该模块还提供了以你选择的字体类型和字体大小绘制文本的方法。\n\n尽管 Photoshop 等高级（且昂贵的）应用程序提供了自动批处理功能，但你可以使用\
  \ Python 脚本免费地完成许多相同的修改。在之前的章节中，你编写了 Python 程序来处理纯文本文件、电子表格、PDF 和其他格式。通过 `pillow`\
  \ 模块，你已经将编程能力扩展到了处理图像！\n\n## 练习题\n\n| Q: | 1. 什么是 RGBA 值？ |\n| Q: | 2. 你如何从 `Pillow`\
