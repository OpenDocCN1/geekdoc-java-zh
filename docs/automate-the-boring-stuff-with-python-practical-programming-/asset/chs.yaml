  \ 方法之间的区别是什么？ |\n\n| Q: | 9\\. 书架的值类似于哪种数据结构？ |\n\n## 练习项目\n\n为了练习，设计并编写以下程序。\n\n\
  ## 扩展多剪贴板\n\n扩展本章的多剪贴板程序，使其具有 `delete <keyword>` 命令行参数，用于从书架中删除关键字。然后添加一个 `delete`\
  \ 命令行参数，用于删除*所有*关键字。\n\n## 填字游戏\n\n创建一个 Mad Libs 程序，它可以读取文本文件，并允许用户在文本文件中出现 `ADJECTIVE`、`NOUN`、`ADVERB`\
  \ 或 `VERB` 的地方添加自己的文本。例如，一个文本文件可能如下所示：\n\n```\nThe ADJECTIVE panda walked to the\
  \ NOUN and then VERB. A nearby NOUN was\nunaffected by these events.\n```\n\n程序将找到这些出现位置并提示用户替换它们。\n\
  \n```\nEnter an adjective:\nsilly\nEnter a noun:\nchandelier\nEnter a verb:\nscreamed\n\
  Enter a noun:\npickup truck\n```\n\n随后将创建如下文本文件：\n\n```\nThe silly panda walked\
  \ to the chandelier and then screamed. A nearby pickup\ntruck was unaffected by\
  \ these events.\n```\n\n结果应该打印到屏幕上并保存到新的文本文件中。\n\n## 正则搜索\n\n编写一个程序，打开文件夹中所有的 `.*txt*`\
  \ 文件，并搜索匹配用户提供的正则表达式的行。结果应该打印到屏幕上。\n\n# 第 9 章. 组织文件\n\n在上一节中，你学习了如何在 Python 中创建和向新文件写入。你的程序还可以组织硬盘上的预存文件。也许你曾有过这样的经历：遍历一个包含几十、数百甚至数千个文件的文件夹，并手动对它们进行复制、重命名、移动或压缩。或者考虑此类任务：\n\
  \n*   在一个文件夹的每个子文件夹中复制所有 PDF 文件（*仅限* PDF 文件）\n*   对于包含名为 `spam001.txt`、`spam002.txt`、`spam003.txt`\
  \ 等数百个文件的文件夹，删除文件名开头的零\n*   将几个文件夹的内容压缩成一个 ZIP 文件（这可以是一个简单的备份系统）\n\n所有这些无聊的事情正适合用\
  \ Python 自动化。通过编程让计算机来执行这些任务，你可以将其变成一个快速工作的文件办事员。\n\n## shutil 模块\n\n`shutil`（或\
  \ shell utilities）模块拥有可以复制、移动、重命名和删除文件的函数。要使用 `shutil` 函数，首先需要 `import shutil`。\n\
  \n## 复制文件和文件夹\n\n`shutil` 模块提供了复制文件以及整个文件夹的函数。\n\n调用 `shutil.copy(*source, destination*)`\
  \ 将将 `source` 路径的文件复制到 `destination` 路径的文件夹中（`source` 和 `destination` 都是字符串）。如果\
  \ `destination` 是文件名，它将作为复制文件的新名称。该函数返回复制文件的路径字符串。\n\n在交互式命令行中输入以下内容查看 `shutil.copy()`\
  \ 的工作：\n\n```\n >>> import shutil, os\n >>> os.chdir('C:\\\\')\n➊ >>> shutil.copy('C:\\\
  \\spam.txt', 'C:\\\\delicious')\n   'C:\\\\delicious\\\\spam.txt'\n➋ >>> shutil.copy('eggs.txt',\
  \ 'C:\\\\delicious\\\\eggs2.txt')\n   'C:\\\\delicious\\\\eggs2.txt'\n```\n\n第一个\
  \ `shutil.copy()` 调用将 `C:\\spam.txt` 复制到 `C:\\delicious`。返回值为新复制文件的路径。注意，由于指定了文件夹作为目标，使用了原始的\
  \ *spam.txt* 文件名。第二个 `shutil.copy()` 调用 ➋ 也将 `C:\\eggs.txt` 复制到 `C:\\delicious`，但将复制的文件命名为\
  \ *eggs2.txt*。\n\n虽然 `shutil.copy()` 复制文件，但 `shutil.copytree()` 会复制整个文件夹以及其中所有的文件夹和文件。调用\
  \ `shutil.copytree(*source, destination*)` 将 `source` 路径的文件夹及其所有文件和子文件夹复制到 `destination`\
  \ 路径的文件夹中（`source` 和 `destination` 参数都是字符串）。该函数返回被复制文件夹的路径字符串。\n\n在交互式命令行中输入以下内容：\n\
  \n```\n>>> import shutil, os\n>>> os.chdir('C:\\\\')\n>>> shutil.copytree('C:\\\\\
  bacon', 'C:\\\\bacon_backup')\n'C:\\\\bacon_backup'\n```\n\n\n\n\n\n`shutil.copytree()`\
  \ 调用会创建一个名为 `bacon_backup` 的新文件夹，其内容与原始 `bacon` 文件夹相同。你现在已经安全地备份了你珍贵的、珍贵的 bacon。\n\
  \n## 移动和重命名文件与文件夹\n\n调用 `shutil.move(source, destination)` 将位于 `source` 路径的文件或文件夹移动到\
  \ `destination` 路径，并返回新位置的绝对路径字符串。\n\n如果 `destination` 指向一个文件夹，则 `source` 文件将被移动到\
  \ `destination` 中并保留其当前文件名。例如，在交互式 shell 中输入以下内容：\n\n```\n>>> import shutil\n>>>\
  \ shutil.move('C:\\\\bacon.txt', 'C:\\\\eggs')\n'C:\\\\eggs\\\\bacon.txt'\n```\n\
  \n假设 `C:\\` 目录下已经存在一个名为 `eggs` 的文件夹，那么此 `shutil.move()` 调用表示：“将 `C:\\bacon.txt`\
  \ 移动到文件夹 `C:\\eggs` 中。”\n\n如果如果 `C:\\eggs` 中已经存在 `bacon.txt` 文件，它将会被覆盖。由于通过这种方式很容易意外覆盖文件，因此在使用\
  \ `move()` 时你应该格外小心。\n\n`destination` 路径也可以指定文件名。在下面的示例中，`source` 文件被移动*且*被重命名了。\n\
  \n```\n>>> shutil.move('C:\\\\bacon.txt', 'C:\\\\eggs\\\\new_bacon.txt')\n'C:\\\\\
  eggs\\\\new_bacon.txt'\n```\n\n这一行代码表示：“将 `C:\\bacon.txt` 移动到文件夹 `C:\\eggs` 中，顺便将该\
  \ `bacon.txt` 文件重命名为 `new_bacon.txt`。”\n\n之前的两个示例都在假设 `C:\\` 目录下存在 `eggs` 文件夹的情况下运行。但如果没有\
  \ `eggs` 文件夹，`move()` 将把 `bacon.txt` 重命名为名为 `eggs` 的文件。\n\n```\n>>> shutil.move('C:\\\
  \\bacon.txt', 'C:\\\\eggs')\n'C:\\\\eggs'\n```\n\n在这里，`move()` 在 `C:\\` 目录中找不到名为\
  \ `eggs` 的文件夹，因此假设 `destination` 必须指定的是文件名而不是文件夹。因此，`bacon.txt` 文本文件被重命名为 `eggs`（一个没有\
