  \n## 看起来很忙碌\n\n许多即时通讯软件通过检测鼠标在一段时间内（例如十分钟）内没有移动，来判断你是否处于闲置状态或离开了电脑。也许你可能想离开座位一会儿，但不想让别人看到你的即时通讯状态变为空闲模式。编写一个脚本，每隔十秒轻微移动一下你的鼠标光标。这种微动应该足够小，以至于在脚本运行期间确实需要使用电脑时，也不会产生妨碍。\n\
  \n## 即时通讯机器人\n\nGoogle Talk、Skype、Yahoo Messenger、AIM 以及其他即时通讯应用通常使用私有协议，这使得其他人编写与这些程序交互的\
  \ Python 模块变得困难。但即使是这些私有协议无法阻止你编写 GUI 自动化工具。\n\nGoogle Talk 应用有一个搜索栏，允许你输入朋友列表中的用户名，并在按下\
  \ ENTER 键时打开消息窗口。键盘焦点会自动移动到新窗口。其他即时通讯应用也有类似的打开新消息窗口的方法。编写一个程序，自动向你朋友列表中的选定小组发送通知消息。你的程序可能需要处理特殊情况，例如朋友离线、聊天窗口出现在屏幕上的不同坐标，或者中断你发送消息的确认框。你的程序将通过截图来引导其\
  \ GUI 交互，并采用检测虚拟按键是否未被发送出去的方法。\n\n### 注意事项\n\n*在编写此程序时，你可能想设置一些虚拟测试账户，以免无意中给你的真实朋友发送垃圾信息。*\n\
  \n## 游戏机器人教程\n\n有一份名为“如何构建一个可以玩网页游戏的 Python 机器人”的优秀教程，你可以在 `[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)`\
  \ 找到。该教程解释了如何在 Python 中创建一个 GUI 自动化程序，用来玩一个名为 Sushi Go Round 的 Flash 游戏。该游戏涉及点击正确的原料按钮来完成客户的寿司订单。你完成订单越快且错误越少，获得的分数就越多。这是一个\
  \ GUI 自动化程序非常完美的任务——也是一种作弊获得高分的方法！该教程涵盖了本章的许多相同主题，还包含了对 PyAutoGUI 基本图像识别功能的描述。\n\
  \n# 附录 A. 安装第三方模块\n\n除了 Python 自带的标准库模块外，其他开发者还编写了自己的模块来进一步扩展 Python 的功能。安装第三方模块的主要方法是使用\
  \ Python 的 `pip` 工具。该工具从 Python 软件基金会的网站 `[`pypi.python.org/`](https://pypi.python.org/)`\
  \ 安全地下载并将 Python 模块安装到你的电脑上。PyPI，即 Python 包索引（Python Package Index），是一种类似于 Python\
  \ 模块的免费应用商店。\n\n# pip 工具\n\n`pip` 工具的可执行文件在 Windows 上称为 `pip`，在 OS X 和 Linux 上称为\
  \ `pip3`。在 Windows 上，你可以在 `C:\\Python34\\Scripts\\pip.exe` 找到 pip。在 OS X 上，它位于 `/Library/Frameworks/Python.framework/Versions/3.4/bin/pip3`。在\
  \ Linux 上，它位于 `/usr/bin/pip3`。\n\n虽然 `pip` 随着 Windows 和 OS X  Python 3.4 自动安装，但在\
  \ Linux 上必须单独安装。要在 Ubuntu 或 Debian Linux 上安装 `pip3`，打开一个新的终端窗口并输入 `sudo apt-get\
  \ install python3-pip`。要在 Fedora Linux 上安装 `pip3`，在终端窗口输入 `sudo yum install python3\
  \ -pip`。你需要输入电脑的管理员密码来安装此软件。\n\n# 安装第三方模块\n\n`pip` 工具旨在从命令行运行：你向它传递 `install` 命令，后跟你想要安装的模块名称。例如，在\
  \ Windows 上你将输入 `pip install ModuleName`，其中 `ModuleName` 是模块名。在 OS X 和 Linux 上，你必须带有\
  \ `sudo` 前缀运行 `pip3`，以授予安装模块的管理员权限。你需要输入 `sudo pip3 install ModuleName`。\n\n如果你已经安装了该模块，但想将其升级到\
  \ PyPI 上的最新版本，运行 `pip install –U ModuleName`（在 OS X 和 Linux 上运行 `pip3 install –U\
  \ ModuleName`）。\n\n安装模块后，你可以在交互式外壳中运行 `import ModuleName` 来测试是否安装成功。如果没有显示任何错误信息，你就可以认为该模块已成功安装。\n\
  \n你可以通过运行下面列出的命令来安装书中涵盖的所有模块。（记得如果你在 OS X 或 Linux 上，请将 `pip` 替换为 `pip3`。）\n\n- `pip\
  \ install send2trash`\n- `pip install requests`\n- `pip install beautifulsoup4`\n\
  - `pip install selenium`\n- `pip install openpyxl`\n- `pip install PyPDF2`\n- `pip\
  \ install imapclient`\n- `pip install pyzmail`\n- `pip install twilio`\n- `pip install\
  \ pillow`\n- `pip install pyobjc-core` (OS X 专用)\n- `pip install pyobjc` (OS X 专用)\n\
  - `pip install python3-xlib` (Linux 专用)\n- `pip install pyautogui`\n\n### 注意事项\n\
  \n*对于 OS X 用户：`pyobjc` 模块安装可能需要 20 分钟或更长时间，所以如果花费很久请不要报警。你应该先安装 `pyobjc-core` 模块，这将缩短整体时间。*\n\
  \n# 附录 B. 运行程序\n\n如果你在 IDLE 中打开了一个程序，运行它只需按下 F5 或选择 Run 菜单项。这是编写时运行程序的简单方法，但为了运行而打开\
  \ IDLE 是一种麻烦。有更方便的方法来执行 Python 脚本。\n\n# She 行\n\n你所有的 Python 程序的第一行都应该是 She 行，它告诉电脑你想让\
  \ Python 执行此程序。She 行以 `#!` 开头，其余取决于你的操作系统。\n\n- 在 Windows 上，She 行是 `#! python3`。\n\
  - 在 OS X 上，She 行是 `#! /usr/bin/env python3`。\n- 在 Linux 上，She 行是 `#! /usr/bin/python3`。\n\
  \n你可以在没有 She 行的情况下从 IDLE 运行 Python 脚本，但从命令行运行时需要该行。\n\n# 在 Windows 上运行 Python 程序\n\
  \n在 Windows 上，Python 3.4 解释器位于 `C:\\Python34\\python.exe`。或者，方便的 `py.exe` 程序会读取\
  \ `.py` 文件顶部的 She 行，并运行相应的 Python 版本。如果你的电脑上安装了多个版本，`py.exe` 程序将确保使用正确的 Python 版本运行\
  \ Python 程序。\n\n为了方便运行你的 Python 程序，创建一个 *.bat 批处理文件* 通过 *py.exe* 运行 Python 程序。制作批处理文件只需创建一个包含如下内容的新文本文件：\n\
  \n```\n@py.exe C:\\path\\to\\your\\pythonScript.py %*\n```\n\n\n\n\n\n将此路径替换为你自己的程序的绝对路径，并将此文件以\
  \ `.bat` 扩展名保存（例如，`pythonScript.bat`）。此批处理文件将让你无需每次运行 Python 程序时都输入 Python 程序的完整绝对路径。我建议将所有的批处理文件和\
  \ `.py` 文件放在同一个文件夹中，例如 `C:\\MyPythonScripts` 或 `C:\\Users\\YourName\\PythonScripts`。\n\
  \n应将 `C:\\MyPythonScripts` 文件夹添加到 Windows 的系统路径中，这样你就可以从运行对话框运行其中的批处理文件了。要这样做，请修改\
  \ `PATH` 环境变量。点击**开始**按钮并输入**编辑账户环境变量**。在你开始输入后，该选项会自动完成补全。出现的环境变量窗口将如图 B-1 所示。\n\
  \n从系统变量选择 `Path` 变量并点击**编辑**。在“值”文本字段中，添加分号，输入 `C:\\MyPythonScripts`，然后点击**确定**。现在，你只需按下\
  \ WIN-R 并输入脚本名称，即可运行 `C:\\MyPythonScripts` 文件夹中的任何 Python 脚本。例如，运行 `pythonScript`\
  \ 将运行 `pythonScript.bat`，这又避免了你需要在运行对话框中运行整个命令 `py.exe C:\\MyPythonScripts\\pythonScript.py`。\n\
  \n![Windows 环境变量窗口](img/httpatomoreillycomsourcenostarchimages2189757.png.jpg)\n\
  \n图 B-1. Windows 环境变量窗口\n\n# 在 OS X 和 Linux 上运行 Python 程序\n\n在 OS X 上，选择应用程序▸实用工具▸终端将打开`Terminal`窗口。终端是一种仅使用文本在计算机上输入命令的方法，而不是点击图形界面。要在\
  \ Ubuntu Linux 上打开终端窗口，请按 WIN（或 SUPER）键调出 Dash 并输入**Terminal**。\n\n终端窗口将在你的用户账户主目录中启动。如果我的用户名是\
  \ `asweigart`，那么在 OS X 上主目录为 `/Users/asweigart`，在 Linux 上为 `/home/asweigart`。波浪号\
  \ (`~`) 字符是主目录的快捷方式，因此你可以输入 `cd ~` 来切换到主目录。你也可以使用 `cd` 命令将当前工作目录更改到任何其他目录。在 OS X\
  \ 和 Linux 上，`pwd` 命令都将打印当前工作目录。\n\n要运行你的 Python 程序，请将 `.py` 文件保存到主目录中。然后，运行 `chmod\
  \ +x pythonScript.py` 来更改 `.py` 文件的权限使其可执行。文件权限超本书的范围，但如果你想从终端窗口运行程序，就需要对你的 Python\
  \ 文件运行此命令。一旦执行完毕，你就可以随时打开终端窗口并输入 `./pythonScript.py` 来运行你的脚本。脚本顶部的 shebang 行将告诉操作系统在何处定位\
  \ Python 解释器。\n\n# 附录 C. 练习题答案\n\n本附录包含了每章章节末尾练习题的答案。我强烈建议你花时间完成这些题目。编程不仅仅是记忆语法和函数名列表。就像学习外语一样，练习越多，收获就越多。也有许多网站提供编程问题练习题。你可以在\
  \ *[`nostarch.com/automatestuff/`](http://nostarch.com/automatestuff/)* 中找到这些列表。\n\
  \n# 第 1 章\n\n1. 运算符有 `+`、`-`、`*` 和 `/`。值为 `'hello'`、`-88.8` 和 `5`。\n2. 字符串是 `'spam'`；变量是\
  \ `spam`。字符串始终以引号开头和结尾。\n3. 本章介绍的三种数据类型是整数、浮点数和字符串。\n4. 表达式是值和运算符的组合。所有表达式都会求值（即，简化）为一个单个值。\n\
  5. 表达式求值为单个值。语句不是。\n6. `bacon` 变量被设置为 `20`。`bacon + 1` 表达式不会重新为 `bacon` 赋值（那需要赋值语句：`bacon\
  \ = bacon + 1`）。\n7. 两个表达式都求值为字符串 `'spamspamspam'`。\n8. 变量名不能以数字开头。\n9. `int()`、`float()`\
  \ 和 `str()` 函数将求值为传递给它们的值的整数、浮点数和字符串版本。\n10. 该表达式导致了错误，因为 `99` 是整数，只有字符串才能用 `+`\
  \ 运算符与其他字符串拼接。正确的方法是 `I have eaten ' + str(99) + ' burritos.'`。\n\n# 第 2 章\n\n1.\
  \ `True` 和 `False`，使用大写的 `T` 和 `F`，其余字母小写。\n2. `and`、`or` 和 `not`。\n3. `True and\
  \ True` 为 `True`。\n   - `True and False` 为 `False`。\n   - `False and True` 为 `False`。\n\
  \   - `False and False` 为 `False`。\n4. \n   ```\n   True\n   False\n   True\n  \
  \ False\n   False\n   False\n   ```\n5. `==`、`!=`、`<` 和 `>=`。\n6. `==` 是比较两个值的运算符，而\
  \ `=` 是存储赋值运算符。\n7. `if` 语句是一个求值为布尔值的流程控制。\n8. \n   ```\n   bacon\n   ham\n   eggs\n\
  \   ```\n9. \n   ```\n   if spam == 1:\n       print('Hello')\n   elif spam == 2:\n\
  \       print('Howdy')\n   else:\n       print('Greetings!')\n   ```\n10. 按 CTRL-C\
  \ 停止死循环的程序。\n11. `break` 语句将执行跳转到循环之外。`continue` 语句将执行跳转到循环开始。\n12. \n   ```\n \
  \  for i in range(1, 11):\n       print(i)\n   ```\n   以及：\n   ```\n   i = 1\n \
  \  while i <= 10:\n       print(i)\n       i = i + 1\n   ```\n13. 此函数可以通过 `spam.bacon()`\
  \ 调用。\n\n# 第 3 章\n\n1. 函数减少了重复代码。这使得程序更短、易读且更容易更新。\n2. 函数的代码在调用函数时执行，而不是在定义时执行。\n\
  3. `def` 语句定义（即创建）一个函数。\n4. 函数由 `def` 语句及其 `def` 子句中的代码组成。\n   - 函数调用是将程序执行进入函数的方法，函数调用求值为函数的返回值。\n\
  5. 有一个全局作用域，每当调用函数时都会创建一个局部作用域。\n6. 当函数返回时，局部作用域被销毁，其中所有的变量都会被遗忘。\n7. 返回值是函数调用求值的结果。像任何值一样，返回值可以作为表达式的一部分。\n\
