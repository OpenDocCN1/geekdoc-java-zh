  \ JSON 数据字符串？ |\n\n## 练习项目\n\n为了进行练习，请编写一个执行以下操作的程序：\n\n## Excel 转 CSV 转换\n\nExcel\
  \ 只需几次点击即可将电子表格保存为 CSV 文件，但如果你必须转换数百个 Excel 文件为 CSV，那将花费数小时。使用 第 12 章 “处理电子表格”中的\
  \ `openpyxl` 模块，编写一个程序读取当前目录下所有的 Excel 文件并将其输出为 CSV 文件。CSV 的文件名应为 `<filename>_<sheet\
  \ title>.csv`，其中 `<filename>` 是不带扩展的文件名，`<sheet title>` 是来自 `Worksheet` 对象的 `title`\
  \ 变量。\n\n```python\nfor excelFile in os.listdir('.'):\n    # 跳过非 xls 文件，加载工作簿对象。\n\
  \    for sheetName in wb.get_sheet_names():\n        # 遍历工作簿中的每个工作表。\n        sheet\
  \ = wb.get_sheet_by_name(sheetName)\n\n        # 根据 Excel 文件名和工作表标题创建 CSV 文件名。\n\
  \        #为此 CSV 文件创建 csv.writer 对象。\n\n        # 遍历工作表中的每一行。\n        for rowNum\
  \ in range(1, sheet.get_highest_row() + 1):\n            rowData = []    # 将每个单元格添加到列表中\n\
  \            # 遍历行中的每个单元格。\n            for colNum in range(1, sheet.get_highest_column()\
  \ + 1):\n                # 将每个单元格的数据添加到 rowData。\n\n            # 将 rowData 列表写入\
  \ CSV 文件。\n\n        csvFile.close()\n```\n\n\n\n\n你计算机的系统时钟设置为特定的日期、时间和时区。内置的 `time`\
  \ 模块允许你的 Python 程序读取系统时钟的当前时间。`time.time()` 和 `time.sleep()` 函数是 `time` 模块中最实用的函数。\n\
  \n## `time.time()` 函数\n\n`Unix 纪元`（Unix epoch）是编程中常用的时间参考点：协调世界时 (UTC) 1970 年 1\
  \ 月 1 日凌晨 12 点。`time.time()` 函数返回自该刻起的秒数，格式为浮点数。（记住，浮点数只是一个带有小数点的数字。）这个数字被称为 `epoch\
  \ 时间戳`（epoch timestamp）。例如，在交互式外壳中输入以下内容：\n\n```\n>>> import time\n>>> time.time()\n\
  1425063955.068649\n```\n\n这里我在 2015 年 2 月 27 日太平洋标准时间 11:05（或 UTC 时间晚上 7:05）调用了\
  \ `time.time()`。返回值是从 Unix 纪元到调用 `time.time()` 这一刻之间经过的秒数。\n\n### 注意\n\n交互式外壳的示例将产生我\
  \ 2015 年 2 月编写本章时的日期和时间。除非你是时间旅行者，否则你的日期和时间将会不同。\n\nEpoch 时间戳可以用于代码的 `profile`（性能分析），即测量一段代码运行所需的时间。如果你在想要测量的代码块开始调用\
  \ `time.time()`，并在结束时再次调用，你可以用第二个时间戳减去第一个，以找到两次调用之间的运行时间。例如，打开一个新的文件编辑器窗口并输入以下程序：\n\
  \n```python\nimport time\ndef calcProd():\n    # 计算前 100,000 个数字的积。\n    product\
  \ = 1\n    for i in range(1, 100000):\n        product = product * i\n    return\
  \ product\n\nstartTime = time.time()\nprod = calcProd()\nendTime = time.time()\n\
  print('The result is %s digits long.' % (len(str(prod))))\nprint('Took %s seconds\
  \ to calculate.' % (endTime - startTime))\n```\n\n在 ➊ 处，我们定义了一个函数 `calcProd()` 来遍历\
  \ 1 到 99,999 的整数并返回它们的积。在 ➋ 处，我们调用 `time.time()` 并将其存储在 `startTime` 中。紧接调用 `calcProd()`\
  \ 之后，我们再次调用 `time.time()` 并将其存储在 `endTime` ➌。最后，我们打印 `calcProd()` 返回的积的长度 ➍ 以及运行\
  \ `calcProd()` 所需的时间 ➵。\n\n将此程序保存为 `calcProd.py` 并运行它。输出看起来像这样：\n\n```\nThe result\
  \ is 456569 digits long.\nTook 2.844162940979004 seconds to calculate.\n```\n\n\
  ### 注意\n\n性能分析代码的另一种方法是使用 `cProfile.run()` 函数，它提供的详细信息比简单的 `time.time()` 技术要丰富得多。`cProfile.run()`\
  \ 函数的解释可以在 [https://docs.python.org/3/library/profile.html] 找到。\n\n## `time.sleep()`\
  \ 函数\n\n如果你需要让程序暂停一段时间，调用 `time.sleep()` 函数并传入你希望程序暂停的秒数。在交互式外壳中输入以下内容：\n\n```\n\
  >>> import time\n>>> for i in range(3):\n    print('Tick')\n    time.sleep(1)\n\
  \    print('Tock')\n    time.sleep(1)\nTick\nTock\nTick\nTock\nTick\nTock\n>>> time.sleep(5)\n\
  ```\n\n`for` 循环会打印 `Tick` ➊，暂停一秒 ➋，打印 `Tock` ➌，暂停一秒 ➍，打印 `Tick`，暂停，以此类推，直到 `Tick`\
  \ 和 `Tock` 各打印三次为止。\n\n`time.sleep()` 函数会 `block`（阻塞）——也就是说，它不会返回并释放你的程序去执行其他代码，直到传递给\
  \ `time.sleep()` 的秒数过去。例如，如果你输入 `time.sleep(5)` ➎，你会发现直到五秒之后，下一个提示符（`>>>`）才会出现。\n\
  \n请注意，在 IDLE 中按下 CTRL-C 不会中断 `time.sleep()` 调用。IDLE 会等到整个暂停结束后才会抛出 `KeyboardInterrupt`\
  \ 异常。为了解决这个问题，不要使用单一的 `time.sleep(30)` 来暂停 30 秒，而是使用 `for` 循环调用 30 次 `time.sleep(1)`。\n\
  \n```\n>>> for i in range(30):\n    time.sleep(1)\n```\n\n如果你在这 30 秒内的某时刻按了 CTRL-C，你应该会立即看到抛出\
  \ `KeyboardInterrupt` 异常。\n\n# 数字的舍入\n\n在处理时间时，你经常遇到小数点后有许多数字的浮点值。为了让这些值更容易处理，你可以使用\
  \ Python 内置的 `round()` 函数来缩短它们，该函数可以将数字舍入到指定的小位数。\n\n在交互式外壳中输入以下内容：\n\n```\n>>>\
  \ import time\n>>> time.time()\n1425063955.068649\n>>> round(time.time(), 2)\n1425063955.07\n\
  >>> round(time.time(), 0)\n1425063955\n```\n\n# 项目：超级秒表\n\n假设你想跟踪自己在任务上花费的时间。你可以自己用\
  \ Python 编写一个简单的秒表。\n\n从高层次来说，你的程序将执行：\n\n*   跟踪每次按下 ENTER 之间经过的时间。\n*   打印圈数、总时间和每圈时间。\n\
  \n这意味着你的代码需要：\n\n*   通过调用 `time.time()` 获取当前时间，并将其存储在程序开始以及每圈开始时。\n*   每当按下 ENTER\
  \ 时增加圈计数。\n*   通过减去时间戳计算经过的时间。\n*   处理 `KeyboardInterrupt` 异常，以便用户可以使用 CTRL-C 退出。\n\
  \n打开一个新的文件编辑器窗口并保存为 *stopwatch.py*。\n\n## 第一步：设置程序以跟踪时间\n\n秒表程序需要使用当前时间，因此你需要导入\
  \ `time` 模块。你的程序还应该调用 `input()` 之前向用户打印指令，以便计时在用户按下 ENTER 后开始。然后代码将开始跟踪时间。\n\n在编辑器中输入以下代码，编写\
  \ `TODO` 注释作为后续代码的占位符：\n\n```python\n#! python3\n# stopwatch.py - 一个简单的秒表程序。\n\n\
  import time\n\n# 显示程序的指令。\nprint('按下 ENTER 开始。此后，按下 ENTER “点击”秒表。\\n 按下 Ctrl-C 退出。')\n\
  input()                    # 按 Enter 开始\nprint('已启动。')\nstartTime = time.time()\
  \    # 获取第一圈的开始时间\nlastTime = startTime\nlapNum = 1\n\n# TODO: 开始跟踪每圈时间。\n```\n\n\
  ## 第二步：跟踪并打印圈时间\n\n现在让我们编写代码来启动每个新的一圈，计算上一圈花费的时间，并计算从启动秒表以来的总时间。我们将显示圈时间和总时间，并在每个新圈时增加圈数。将以下代码添加到你的程序中：\n\
  \n\n\n\n```python\n#! python3\n# stopwatch.py - 一个简单的秒表程序。\n\nimport time\n\n--snip--\n\
  \n# 开始记录圈数时间。\n➊ try:\n➋    while True:\n           input()\n➌         lapTime =\
  \ round(time.time() - lastTime, 2)\n➍         totalTime = round(time.time() - startTime,\
  \ 2)\n➎         print('Lap #%s: %s (%s)' % (lapNum, totalTime, lapTime), end='')\n\
  \           lapNum += 1\n           lastTime = time.time() # 重置上一个圈的时间\n➏ except\
  \ KeyboardInterrupt:\n       # 处理 Ctrl-C 异常以防止其错误信息显示。\n       print('\\nDone.')\n\
  ```\n\n如果用户按下 `CTRL-C` 停止秒表，将抛出 `KeyboardInterrupt` 异常；如果执行时没有使用 `try` 语句，程序将会崩溃。为了防止崩溃，我们将程序的这部分封装在\
  \ `try` 语句中 ➊。我们将在 `except` 子句 ➏ 中处理异常，因此当按下 `CTRL-C` 并抛出异常时，程序执行将移动到 `except` 子句打印\
  \ `Done`，而不是显示 `KeyboardInterrupt` 错误信息。在此发生之前，执行处于一个无限循环 ➋ 中，该循环调用 `input()` 并等待用户按下\
  \ `ENTER` 结束一圈。当一圈结束时，我们通过从当前时间 `time.time()` 减去该圈的开始时间 `lastTime` 来计算该圈花费 ➌。我们通过从当前时间减去秒表的整体开始时间\
  \ `startTime` 来计算已经过的总时间 ➍。\n\n由于这些时间计算结果的小数点会有很多数字（例如 `4.766272783279419`），因此我们在\
  \ ➌ 和 ➍ 处使用 `round()` 函数将浮点值保留两位小数。\n\n在 ➎ 处，我们打印圈数、已过的总时间和该圈时间。由于用户为 `input()`\
  \ 调用按下 `ENTER` 会在屏幕上打印换行，因此向 `print()` 函数传递 `end=''` 以避免输出双倍空格。打印圈信息后，我们通过将计数 `lapNum`\
  \ 加 1 并 `lastTime` 设置为当前时间（即下一圈的开始时间）来为下一圈做好准备。\n\n## 类似程序的创意\n\n时间跟踪为你的程序开启了许多可能性。虽然你可以下载应用来完成这些事情，但自己编写程序的好处是它们是免费的，并且没有充斥广告和无用的功能。你可以编写类似的程序来实现以下功能：\n\
  \n*   创建一个简单的工时表应用，记录你输入人姓名的时间，并使用当前时间进行打卡或下班。\n*   为你的程序添加一个功能，显示进程启动以后的经过时间，例如使用\
  \ `requests` 模块的下载。（参见第 11 章\n➋ datetime.datetime(2015, 2, 27, 11, 10, 49, 55, 53)\n\
  ➌ >>> dt = datetime.datetime(2015, 10, 21, 16, 29, 0)\n➍ >>> dt.year, dt.month,\
  \ dt.day\n   (2015, 10, 21)\n➎ >>> dt.hour, dt.minute, dt.second\n   (16, 29, 0)\n\
  ```\n\n调用 `datetime.datetime.now()` ➊ 会根据你计算机的时钟返回一个用于当前日期的 `datetime` 对象 ➋。该对象包含了当前时刻的年、月、日、时、分、秒和微秒。你也可以通过使用\
  \ `datetime.datetime()` 函数 ➌ 获取特定时刻的 `datetime` 对象，传递代表该时刻的年、月、日、时和秒的整数。这些整数将存储在\
  \ `datetime` 对象的 `year`、`month`、`day` ➍、`hour`、`minute` 和 `second` ➎ 属性中。\n\nUnix\
  \ 纪戳可以通过 `datetime.datetime.fromtimestamp()` 函数转换为 `datetime` 对象。`datetime` 对象的日期时间将转换为本地时间。在交互式\
  \ shell 中输入以下内容\n\n```\n>>> datetime.datetime.fromtimestamp(1000000)\ndatetime.datetime(1970,\
  \ 1, 12, 5, 46, 40)\n>>> datetime.datetime.fromtimestamp(time.time())\ndatetime.datetime(1970,\
  \ 1, 12, 5, 46, 40)\n```\n\n\n\n\n在这个示例中，我们向 `datetime.delta()` 传递关键字参数来指定一个 11\
  \ 天、10 小时、9 分钟和 8 秒的持续时间，并将返回的 `timedelta` 对象存储在 `delta` ➊。这个 `timedelta` 对象的 `days`\
  \ 属性存储了 `11`，其 `seconds` 属性存储了 `36548`（10 小时、9 分钟和 8 秒，以秒为单位表示） ➋。调用 `total_seconds()`\
  \ 告诉我们 11 天 10 小时 9 分钟和 8 秒是 986,948 秒。最后，将 `timedelta` 对象传递给 `str()` 将返回一个清晰解释该持续时间的字符串。\n\
  \n算术运算符可以对 `datetime` 值进行*日期算术*。例如，要计算现在 1,000 天后的日期，请在交互式外壳中输入以下内容：\n\n```\n>>>\
  \ dt = datetime.datetime.now()\n>>> dt\ndatetime.datetime(2015, 2, 27, 18, 38, 50,\
  \ 636181)\n>>> thousandDays = datetime.timedelta(days=1000)\n>>> dt + thousandDays\n\
  datetime.datetime(2017, 11, 23, 18, 38, 50, 636181)\n```\n\n首先，为当前时刻创建一个 `datetime`\
  \ 对象并将其存储在 `dt` 中。然后，创建一个持续时间为 1,000 天的 `timedelta` 对象并将其存储在 `thousandDays` 中。将\
  \ `dt` 和 `thousandDays` 相加以得到现在 1,000 天后日期的 `datetime` 对象。Python 将执行日期算术，算出 2015\
  \ 年 2 月 27 日之后的 1,000 天是 2017 年 11 月 23 日。这非常有用，因为当你计算从给定日期起 1,000 天时，你必须记住每个月有多少天，并考虑闰年和其他复杂的细节。`datetime`\
  \ 模块会为你处理所有这些。\n\n可以使用 `+` 和 `-` 运算符使用 `datetime` 对象或其他 `timedelta` 对象对 `timedelta`\
  \ 对象进行加法或减法。可以使用 `*` 和 `/` 运算符将 `timedelta` 对象乘以整数或除以浮点值。在交互式外壳中输入以下内容：\n\n```\n\
  ➊ >>> oct21st = datetime.datetime(2015, 10, 21, 16, 29, 0)\n➋ >>> aboutThirtyYears\
  \ = datetime.timedelta(days=365 * 30)\n   >>> oct21st\n   datetime.datetime(2015,\
  \ 10, 21, 16, 29)\n   >>> oct21st - aboutThirtyYears\n   datetime.datetime(1985,\
  \ 10, 28, 16, 29)\n   >>> oct21st - (2 * aboutThirtyYears)\n   datetime.datetime(1955,\
  \ 11, 5, 16, 29)\n```\n\n在这里，我们为 2015 年 10 月 21 日创建一个 `datetime` 对象 ➊，并为大约 30 年的持续时间创建一个\
  \ `timedelta` 对象（我们假设这些中的每年都是 365 天） ➋。从 `oct21st` 减去 `aboutThirtyYears` 得到 2015\
  \ 年 10 月 21 日 30 年前的日期 `datetime` 对象。从 `oct21st` 减去 `2 * aboutThirtyYears` 返回 2015\
  \ 年 10 月 21 日 60 年前的日期的 `datetime` 对象。\n\n## 暂停到特定日期\n\n`time.sleep()` 方法允许你暂停程序若干秒。通过使用\
  \ `while` 循环，你可以让程序暂停直到某个特定日期。例如，以下代码将持续循环直到 2016 年万圣节：\n\n```\nimport datetime\n\
  import time\nhalloween2016 = datetime.datetime(2016, 10, 31, 0, 0, 0)\nwhile datetime.datetime.now()\
  \ < halloween2016:\n    time.sleep(1)\n```\n\n`time.sleep(1)` 调用将暂停你的 Python 程序，这样计算机就不会仅仅反复检查时间而浪费\
  \ CPU 处理周期。相反，`while` 循环将每秒检查一次条件，并在 2016 年万圣节之后（或你程序设定停止的时间）继续执行程序的其余部分。\n\n##\
  \ 将 datetime 对象转换为字符串\n\nEpoch 时间戳和 `datetime` 对象对人类眼睛来说并不十分友好。使用 `strftime()` 方法将\
  \ `datetime` 对象显示为字符串。（`strftime()` 函数名称中的 *f* 代表 *format*（格式化）。）\n\n`strftime()`\
  \ 方法使用类似于 Python 字符串格式化的指令。表 15-1 列出了 `strftime()` 指令的完整列表。\n\n表 15-1. `strftime()`\
  \ 指令\n\n| strftime 指令 | 含义 |\n| --- | --- |\n| `%Y` | 带有世纪的年份，例如 `'2014'` |\n| `%y`\
  \ | 不带世纪的年份，`'00'` 到 `'99'`（1970 年到 2069 年） |\n| `%m` | 十进制数字形式的月份，`'01'` 到 `'12'`\
  \ |\n\n[content]\n\nEpoch 时间戳和 `datetime` 对象对人类眼睛来说并不十分友好。使用 `strftime()` 方法将 `datetime`\
  \ 对象显示为字符串。（`strftime()` 函数名称中的 *f* 代表 *format*（格式化）。）\n\n`strftime()` 方法使用类似于 Python\
  \ 字符串格式化的指令。表 15-1 列出了 `strftime()` 指令的完整列表。\n\n表 15-1. `strftime()` 指令\n\n| strftime\
  \ 指令 | 含义 |\n| --- | --- |\n| `%Y` | 带有世纪的年份，例如 `'2014'` |\n| `%y` | 不带世纪的年份，`'00'`\
  \ 到 `'99'`（1970 年到 2069 年） |\n| `%m` | 十进制数字形式的月份，`'01'` 到 `'12'` |\n| `%B` | 完整的月份名称，如\
  \ `'November'` |\n| `%b` | 缩写的月份名称，如 `'Nov'` |\n| `%d` | 月份中的几天，`'01'` 到 `'31'`\
  \ |\n| `%j` | 年中的第几天，`'001'` 到 `'366'` |\n| `%w` | 一周中的第几天（0 为星期日），`'0'` 到 `'6'`\
