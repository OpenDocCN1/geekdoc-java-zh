  \ City',\n   'Oregon': 'Salem', 'Pennsylvania': 'Harrisburg', 'Rhode Island': 'Providence',\n\
  \   'South Carolina': 'Columbia', 'South Dakota': 'Pierre', 'Tennessee':\n   'Nashville',\
