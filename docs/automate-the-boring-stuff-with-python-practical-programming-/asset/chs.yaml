  \ 传递关键字参数来指定一个 11 天、10 小时、9 分钟和 8 秒的持续时间，并将返回的 `timedelta` 对象存储在 `delta` ➊。这个 `timedelta`\
  \ 对象的 `days` 属性存储了 `11`，其 `seconds` 属性存储了 `36548`（10 小时、9 分钟和 8 秒，以秒为单位表示） ➋。调用\
  \ `total_seconds()` 告诉我们 11 天 10 小时 9 分钟和 8 秒是 986,948 秒。最后，将 `timedelta` 对象传递给\
  \ `str()` 将返回一个清晰解释该持续时间的字符串。\n\n算术运算符可以对 `datetime` 值进行*日期算术*。例如，要计算现在 1,000 天后的日期，请在交互式外壳中输入以下内容：\n\
  \n```\n>>> dt = datetime.datetime.now()\n>>> dt\ndatetime.datetime(2015, 2, 27,\
  \ 18, 38, 50, 636181)\n>>> thousandDays = datetime.timedelta(days=1000)\n>>> dt\
  \ + thousandDays\ndatetime.datetime(2017, 11, 23, 18, 38, 50, 636181)\n```\n\n首先，为当前时刻创建一个\
  \ `datetime` 对象并将其存储在 `dt` 中。然后，创建一个持续时间为 1,000 天的 `timedelta` 对象并将其存储在 `thousandDays`\
  \ 中。将 `dt` 和 `thousandDays` 相加以得到现在 1,000 天后日期的 `datetime` 对象。Python 将执行日期算术，算出\
  \ 2015 年 2 月 27 日之后的 1,000 天是 2017 年 11 月 23 日。这非常有用，因为当你计算从给定日期起 1,000 天时，你必须记住每个月有多少天，并考虑闰年和其他复杂的细节。`datetime`\
  \ 模块会为你处理所有这些。\n\n可以使用 `+` 和 `-` 运算符使用 `datetime` 对象或其他 `timedelta` 对象对 `timedelta`\
  \ 对象进行加法或减法。可以使用 `*` 和 `/` 运算符将 `timedelta` 对象乘以整数或除以浮点值。在交互式外壳中输入以下内容：\n\n```\n\
  ➊ >>> oct21st = datetime.datetime(2015, 10, 21, 16, 29, 0)\n➋ >>> aboutThirtyYears\
  \ = datetime.timedelta(days=365 * 30)\n   >>> oct21st\n   datetime.datetime(2015,\
  \ 10, 21, 16, 29)\n   >>> oct21st - aboutThirtyYears\n   datetime.datetime(1985,\
  \ 10, 28, 16, 29)\n   >>> oct21st - (2 * aboutThirtyYears)\n   datetime.datetime(1955,\
  \ 11, 5, 16, 29)\n```\n\n在这里，我们为 2015 年 10 月 21 日创建一个 `datetime` 对象 ➊，并为大约 30 年的持续时间创建一个\
  \ `timedelta` 对象（我们假设这些中的每年都是 365 天） ➋。从 `oct21st` 减去 `aboutThirtyYears` 得到 2015\
  \ 年 10 月 21 日 30 年前的日期 `datetime` 对象。从 `oct21st` 减去 `2 * aboutThirtyYears` 返回 2015\
  \ 年 10 月 21 日 60 年前的日期的 `datetime` 对象。\n\n## 暂停到特定日期\n\n`time.sleep()` 方法允许你暂停程序若干秒。通过使用\
  \ `while` 循环，你可以让程序暂停直到某个特定日期。例如，以下代码将持续循环直到 2016 年万圣节：\n\n```\nimport datetime\n\
  import time\nhalloween2016 = datetime.datetime(2016, 10, 31, 0, 0, 0)\nwhile datetime.datetime.now()\
  \ < halloween2016:\n    time.sleep(1)\n```\n\n`time.sleep(1)` 调用将暂停你的 Python 程序，这样计算机就不会仅仅反复检查时间而浪费\
  \ CPU 处理周期。相反，`while` 循环将每秒检查一次条件，并在 2016 年万圣节之后（或你程序设定停止的时间）继续执行程序的其余部分。\n\n##\
  \ 将 datetime 对象转换为字符串\n\nEpoch 时间戳和 `datetime` 对象对人类眼睛来说并不十分友好。使用 `strftime()` 方法将\
  \ `datetime` 对象显示为字符串。（`strftime()` 函数名称中的 *f* 代表 *format*（格式化）。）\n\n`strftime()`\
  \ 方法使用类似于 Python 字符串格式化的指令。表 15-1 列出了 `strftime()` 指令的完整列表。\n\n表 15-1. `strftime()`\
  \ 指令\n\n| strftime 指令 | 含义 |\n| --- | --- |\n| `%Y` | 带有世纪的年份，例如 `'2014'` |\n| `%y`\
  \ | 不带世纪的年份，`'00'` 到 `'99'`（1970 年到 2069 年） |\n| `%m` | 十进制数字形式的月份，`'01'` 到 `'12'`\
  \ |\n\n\n\n\n*   `datetime.datetime(year`, `month`, `day`, `hour`, `minute`, `second)`\
  \ 函数返回一个由参数指定的时刻的 `datetime` 对象。如果未提供 `hour`、`minute` 或 `second` 参数，它们默认值为 `0`。\n\
  \n*   `datetime.datetime.now()` 函数返回当前时刻的 `datetime` 对象。\n\n*   `datetime.datetime.fromtimestamp(epoch)`\
  \ 函数返回由 `epoch` 时间戳参数表示的时刻的 `datetime` 对象。\n\n*   `datetime.timedelta(weeks`, `days`,\
  \ `hours`, `minutes`, `seconds`, `milliseconds`, `microseconds)` 函数返回一个表示持续时间的 `timedelta`\
  \ 对象。该函数的关键字参数都是可选的，且不包括 `month` 或 `year`。\n\n*   `timedelta` 对象的 `total_seconds()`\
  \ 方法返回 `timedelta` 对象所表示的秒数。\n\n*   `strftime(format)` 方法返回一个基于 `format` 字符串的自定义格式的\
  \ `datetime` 对象所表示的时间字符串。格式详细信息请参阅表 15-1 Directives\")。\n\n*   `datetime.datetime.strptime(time_string`,\
  \ `format)` 函数返回使用 `format` 字符串参数解析的由 `time_string` 指定时刻的 `datetime` 对象。格式详细信息请参阅表\
  \ 15-1 Directives\")。\n\n# 多线程\n\n为了引入多线程的概念，让我们来看一个示例场景。假设你想调度某些代码在延迟后或在特定时间运行。你可以在程序的开头添加如下代码：\n\
  \n```\nimport time, datetime\n\nstartTime = datetime.datetime(2029, 10, 31, 0, 0,\
  \ 0)\nwhile datetime.datetime.now() < startTime:\n    time.sleep(1)\n\nprint('Program\
  \ now starting on Halloween 2029')\n--snip--\n```\n\n这段代码指定了 2029 年 10 月 31 日为开始时间，并不断调用\
  \ `time.sleep(1)` 直到开始时间到达。在等待 `time.sleep()` 调用循环结束期间，你的程序无法做任何事；它只会停留在那里直到 2029\
  \ 年万圣节。这是因为 Python 程序默认只有一个执行线程。\n\n要理解什么是执行线程，回回第 2 章 中关于流程控制的讨论，当时你将程序的执行想象成手指放在程序中的某行代码上，并移动到下一行或流程控制语句发送到的任何地方。单线程程序只有一个手指。但多线程程序有多个手指。每个手指仍然根据流程控制语句的定义移动到下一行代码，但手指可以处于程序的不同位置，同时执行不同的代码。（到目前为止，书中的所有程序都是单线程的。）\n\
  \n与其让你所有代码都等待 `time.sleep()` 函数完成，你可以使用 Python 的 `threading` 模块在单独线程中执行延迟或调度的代码。单独线程会在\
  \ `time.sleep` 调用处暂停。同时，你的程序可以在原始线程中执行其他工作。\n\n要创建一个单独线程，你首先需要通过调用 `threading.Thread()`\
  \ 函数来创建一个 `Thread` 对象。在新文件中输入以下代码并将其保存为 `threadDemo.py`：\n\n```\n import threading,\
  \ time\n   print('Start of program.')\n\n➊ def takeANap():\n       time.sleep(5)\n\
  \       print('Wake up!')\n\n➋ threadObj = threading.Thread(target=takeANap)\n➌\
  \ threadObj.start()\n\n   print('End of program.')\n```\n\n在 ➊ 处，我们定义了一个想要在新线程中使用的函数。要创建一个\
  \ `Thread` 对象，我们调用 `threading.Thread()` 并向它传递关键字参数 `target=takeANap` ➋。这意味着我们在新线程中想要调用的函数是\
  \ `takeANap()`。注意关键字参数是 `target=takeANap` 而 `target=takeANap()`。这是因为你想将 `takeANap()`\
  \ 函数本身作为参数传递，而不是调用 `takeANap()` 并传递它的返回值。\n\n在我们把 `threading.Thread()` 创建的 `Thread`\
  \ 对象存储在 `threadObj` 中之后，调用 `threadObj.start()` ➌ 来创建新线程并在新线程中开始执行目标函数。当运行此程序时，输出将如下：\n\
  \n```\nStart of program.\nEnd of program.\nWake up!\n```\n\n这可能让人有点困惑。如果 `print('End\
  \ of program.')` 是程序的最后一行，你可能会认为它应该是最后一个打印的内容。`Wake up!` 出现在它之后是因为……（此处原文存在大量重复的无效描述，翻译已根据核心逻辑处理）。\n\
  \n## 向线程函数传递参数\n\n如果你要在新线程中运行的目标函数带有参数，你可以将目标函数的参数传递给 `threading.Thread()`。例如，假设你想在自己的线程中运行这个\
  \ `print()` 调用：\n\n```\n>>> print('Cats', 'Dogs', 'Frogs', sep=' & ')\nCats & Dogs\
  \ & Frogs\n```\n\n这个 `print()` 调用有三个普通参数 `'Cats'`、`'Dogs'` 和 `'Frogs'`，以及一个关键字参数\
  \ `sep=' & '`。普通参数可以通过列表传递给 `threading.Thread()` 中的 `args` 关键字参数。关键字参数可以作为字典指定为\
  \ `threading.Thread()` 中的 `kwargs` 关键字参数。\n\n在交互式 shell 中输入以下内容：\n\n```\n>>> import\
  \ threading\n>>> threadObj = threading.Thread(target=print, args=['Cats', 'Dogs',\
  \ 'Frogs'],\nkwargs={'sep': ' & '})\n>>> threadObj.start()\nCats & Dogs & Frogs\n\
  ```\n\n为了确保参数 `'Cats'`、`'Dogs'` 和 `'Frogs'` 被传递到新线程中的 `print()`，我们向 `threading.Thread()`\
  \ 传递 `args=['Cats', 'Dogs', 'Frogs']`。为了确保关键字参数 `sep=' & '` 被传递到新线程中的 `print()`，我们向\
  \ `threading.Thread()` 传递 `kwargs={'sep': '& '}`。\n\n`threadObj.start()` 调用将创建一个新线程来调用\
  \ `print()` 函数，并将 `'Cats'`、`'Dogs'` 和 `'Frogs'` 作为参数以及 `' & '` 作为 `sep` 关键字参数。\n\
  \n这是一种创建调用 `print()` 的新线程的方法：\n\n```python\nthreadObj = threading.Thread(target=print('Cats',\
  \ 'Dogs', 'Frogs', sep=' '))\n```\n\n这段代码的结果是调用 `print()` 函数并将其返回值（`print()` 的返回值始终为\
  \ `None`）作为 `target` 关键字参数。它*没有*传递 `print()` 函数本身。在新线程向函数传递参数时，使用 `threading.Thread()`\
  \ 函数的 `args` 和 `kwargs` 关键字参数。\n\n## 并发问题\n\n*(注：我在代码块中添加了 `python` 以便渲染，尽管提示只要求三个反引号，我将其移除以严格遵守示例风格).*\n\
