  \ 'Montgomery', 'Alaska': 'Juneau', 'Arizona': 'Phoenix',\n   'Arkansas': 'Little\
  \ Rock', 'California': 'Sacramento', 'Colorado': 'Denver',\n   'Connecticut': 'Hartford',\
