  \n[content]\n## 正则表达式\n\n正则表达式（regex）是用于模式匹配的强大工具。它们允许使用特殊语法定义搜索。\n\n### 基础语法\n\n\
  正则表达式由字面字符和特殊元字符组成：\n\n- **字面字符**: 匹配自身（例如 `a`）。\n- **元字符**: 定义特殊规则（例如 `.` 匹配任意字符，`*`\
  \ 表示前面的次数）。\n\n### 常用元字符和构造\n\n- `.`: 匹配除换行符外的任意单个字符。\n  `a.c\".matches(\"abc\"\
  ) // true`\n- `\\d`: 匹配任意数字 (0-9)。\n  `\"123\".matches(\"\\\\d+\") // true`\n- `\\\
  w`: 匹配任意单词字符（字母、数字和下划线）。\n  `\"word_1\".matches(\"\\\\w+\") // true`\n- `\\s`: 匹配任意空白字符。\n\
  \  `\" \".matches(\"\\\\s\") // true`\n- `^`: 匹配字符串的开头。\n  `\"^abc\".matches(\"\
  ^abc.*\") // 如果开头是 abc 则真\n- `$`: 匹配字符串的结尾。\n  `\"abc$\".matches(\".*abc$\") //\
  \ 如果结尾是 abc 则真\n- `[abc]`: 匹配括号内的任意字符。\n  `a.matches(\"[abc]\") // true`\n- `[^abc]`:\
  \ 匹配括号外的任意字符。\n  `\"d\".matches(\"[^abc]\") // true`\n- `(a|b)`: 匹配 a 或 b。\n  `\"\
  a\".matches(\"(a|b)\") // true`\n- **量词**: 指定出现的次数。\n  - `*`: 0 次或更多\n  - `+`: 1\
  \ 次或更多\n  - `?`: 0 次或 1 次\n  - `{n}`: 正好 n 次\n  - `{n,}`: 至少 n 次\n  - `{n,m}`: 在\
  \ n 到 m 次之间\n\n![](img/image_rsrc88K.jpg)\n\n### 在 Java 中使用正则表达式\n\n在 Java 中，`java.util.regex`\
  \ 包中的 `Pattern` 和 `Matcher` 类用于处理正则表达式。\n\n#### 示例：\n\n```java\nimport java.util.regex.*;\n\
  \npublic class RegexExample {\n    public static void main(String[] args) {\n  \
  \      String text = \"The quick brown fox jumps over the lazy dog.\";\n       \
  \ String patternString = \"\\\\b\\\\w{3,5}\\\\b\";\n        Pattern pattern = Pattern.compile(patternString);\n\
  \        Matcher matcher = pattern.matcher(text);\n\n        while (matcher.find())\
  \ {\n            System.out.println(\"Found: \" + matcher.group());\n        }\n\
  \    }\n}\n```\n\n\n\n# 类与对象的详细拆解\n属性\n\n\n\n\n## 属性\n属性代表对象的的数据或状态。它们定义在 `class`\
  \ 内部，但可以通过该类的对象进行访问和修改。属性可以有不同的访问修饰符，例如 `private`、`public` 或 `protected`，这些决定了它们的可见性和可访问性。\n\
  \n例如，如果你有一个具有 `private` 属性的 `Car` 类，你需要提供 `public` 方法（`getters` 和 `setters`）来访问和修改这些属性：\n\
  \n```java\npublic class Car {\n\n// 私有属性\nprivate String color;\nprivate String\
  \ model;\nprivate int year;\n\n// 构造函数\npublic Car(String color, String model, int\
  \ year) {\n    this.color = color;\n    this.model = model;\n    this.year = year;\n\
  }\n\n// Getter 方法\npublic String getColor() {\n    return color;\n}\n\npublic String\
  \ getModel() {\n    return model;\n}\n\npublic int getYear() {\n    return year;\n\
  }\n\n// Setter 方法\npublic void setColor(String color) {\n    this.color = color;\n\
  }\n\npublic void setModel(String model) {\n    this.model = model;\n}\n\npublic\
  \ void setYear(int year) {\n    this.year = year;\n}\n\n// 方法\nvoid start() {\n\
  \    System.out.println(\"The car is starting.\");\n}\n\nvoid stop() {\n    System.out.println(\"\
  The car is stopping.\");\n}\n\nvoid accelerate() {\n    System.out.println(\"The\
  \ car is accelerating.\");\n}\n}\n```\n\n在这个示例中，属性是 `private` 的，并提供了 `public` getter\
  \ 和 setter 方法来访问和修改这些属性。\n\n## 方法\n方法定义了从 `class` 创建的对象的行为。它们可以操作 `class` 的属性并执行各种操作。方法也可以有不同的访问修饰符，并且可以被重载，以为具有相同\
  \ `methodName` 但不同参数的方法提供不同的实现。\n\n例如，`Car` 类可以有一个重载的 `accelerate` 方法：\n\n```java\n\
  public class Car {\n\n// 属性和构造函数如之前所示...\n// 方法\nvoid start() {\n    System.out.println(\"\
  The car is starting.\");\n}\n\nvoid stop() {\n    System.out.println(\"The car is\
  \ stopping.\");\n}\n\nvoid accelerate() {\n    System.out.println(\"The car is accelerating.\"\
  );\n}\n\n// 重载方法\nvoid accelerate(int speed) {\n    System.out.println(\"The car\
  \ is accelerating to \" + speed + \" mph.\");\n}\n}\n```\n\n在这个示例中，`accelerate`\
  \ 方法被重载以接受一个整数参数，提供了更具体的行为。\n\n## 构造函数\n构造函数是用于初始化对象的特殊方法。它们与 `class` 的同名，且没有返回类型。构造函数在创建对象时被调用，可以重载以提供不同的初始化对象方式。\n\
  \n例如，`Car` 类可以有多个构造函数：\n\n```java\npublic class Car {\n\n// 属性\nprivate String color;\n\
  private String model;\nprivate int year;\n\n// 默认构造函数\npublic Car() {\n    this.color\
  \ = \"Unknown\";\n    this.model = \"Unknown\";\n    this.year = 0;\n}\n\n// 参数化构造函数\n\
  public Car(String color, String model, int year) {\n    this.color = color;\n  \
  \  this.model = model;\n    this.year = year;\n}\n\n// 方法如之前所示...\n}\n```\n\n在这个示例中，有两个构造函数：一个默认构造函数和一个参数化构造函数。这允许创建对象时具有灵活性。\n\
  \n## 类与对象之间的关系\n类与对象之间的关系是面向对象编程（OOP）的基础。`class` 提供了创建对象的模板，而对象是类的实例。从同一个 `class`\
  \ 可以创建多个对象，每个对象都有其独特的状态。\n\n例如，你可以创建多个 `Car` 对象：\n\n```java\npublic class Main {\n\
  \    public static void main(String[] args) {\n        // 创建 Car 类的多个对象\n      \
  \  Car car1 = new Car(\"Red\", \"Toyota\", 2022);\n        Car car2 = new Car(\"\
  Blue\", \"Honda\", 2021);\n\n        // 访问属性和方法\n        System.out.println(\"Car\
  \ 1 color: \" + car1.getColor());\n        System.out.println(\"Car 1 model: \"\
  \ + car1.getModel());\n        System.out.println(\"Car 1 year: \" + car1.getYear());\n\
  \        System.out.println(\"Car 2 color: \" + car2.getColor());\n        System.out.println(\"\
  Car 2 model: \" + car2.getModel());\n        System.out.println(\"Car 2 year: \"\
  \ + car2.getYear());\n\n        car1.start();\n        car2.start();\n        car1.accelerate();\n\
  \        car2.accelerate(60);\n        car1.stop();\n        car2.stop();\n    }\n\
  }\n```\n\n在这个示例中，`car1` 和 `car2` 是 `Car` 类的实例。它们共享由 `Car` 类定义的结构和行为，但具有不同的状态。\n\n\
  ![](img/image_rsrc88U.jpg)!(image_rsrc88V.jpg)\n\n# Java 中的方法\nJava 方法是定义从类创建的对象行为的本质构建块。它们封装了执行特定任务的代码，并可以操作\
  \ `class` 的属性。理解如何有效地定义和使用方法对于编写整洁、模块化且可维护的 Java 程序至关重要。\n\n## Java 中的定义方法\nJava\
  \ 方法是定义从类创建的对象行为的不可或缺的构建组件。它们封装了执行特定任务的代码，并可以操作 `class` 的属性。理解如何有效地定义和使用方法对于编写整洁、模块化且可维护的\
  \ Java 程序至关重要。\n\n## 定义方法\n在 Java 中定义方法包含访问修饰符、返回类型、方法名和方法体。以下是 Java 中定义方法的通用语法：\n\
  \n```\naccessModifier returnType methodName(parameterList) {\n    // method body\n\
  }\n```\n\n`accessModifier`：方法的可见性。\n- `returnType`：方法返回的值类型。\n- `methodName`：方法的名称。\n\
  - `parameterList`：方法的参数列表。\n- `method body`：方法的执行代码。\n\n以下是 Java 中方法的一个示例：\n\n```java\n\
  public class Car {\n\n// 属性\nprivate String color;\nprivate String model;\nprivate\
  \ int year;\n\n// 构造函数\npublic Car(String color, String model, int year) {\n   \
  \ this.color = color;\n    this.model = model;\n    this.year = year;\n}\n\n// 启动汽车的方法\n\
  public void start() {\n    System.out.println(\"The car is starting.\");\n}\n\n\
  // 停止汽车的方法\npublic void stop() {\n    System.out.println(\"The car is stopping.\"\
  );\n}\n\n// 加速汽车的方法\npublic void accelerate() {\n    System.out.println(\"The car\
  \ is accelerating.\");\n}\n\n// 获取汽车详情的方法\npublic String getDetails() {\n    return\
  \ \"Car: \" + this.model + \", Color: \" + this.color + \", Year: \" + this.year;\n\
  }\n}\n```\n\n在这个示例中，`Car` 类有四个方法：`start()`、`stop()`、`accelerate()` 和 `getDetails()`。`start()`、`stop()`\
  \ 和 `accelerate()` 方法是 `void` 方法，意味着它们不返回任何值。`getDetails()` 方法返回一个描述汽车的 `String`。\n\
  \n![](img/image_rsrc88W.jpg)\n\n## 调用方法\n要调用方法，你需要类的实例并使用点符号来调用方法。以下是你可以调用 `Car`\
  \ 类定义的方法的方法：\n\n```java\npublic class Main {\n    public static void main(String[]\
  \ args) {\n        // 创建 Car 类的对象\n        Car myCar = new Car(\"Red\", \"Toyota\"\
  , 2022);\n\n        // 调用方法\n        myCar.start();\n        myCar.accelerate();\n\
  \        System.out.println(myCar.getDetails());\n        myCar.stop();\n    }\n\
  }\n```\n\n在这个代码段中，我们创建了 `Car` 类的对象 `myCar` 并调用了它的方法 `start()`、`accelerate()`、`getDetails()`\
  \ 和 `stop()`。\n\n## 方法参数\n方法可以接受参数以提供执行所需的额外信息。参数在方法定义的括号内指定。调用方法时，必须提供与参数类型和顺序匹配的参数。\n\
  \n以下是一个带参数方法的示例：\n\n```java\npublic class Car {\n\n// 到特定速度加速的方法\npublic void accelerate(int\
  \ speed) {\n    System.out.println(\"The car is accelerating to \" + speed + \"\
  \ mph.\");\n}\n}\n```\n\n\n\n\n\n```java\n// 方法与之前相同...\n\n}\n```\n\n带参数调用此方法的方法：\n\
  \n```java\npublic class Main {\n    public static void main(String[] args) {\n \
  \       // 创建 Car 类的对象\n        Car myCar = new Car(\"Red\", \"Toyota\", 2022);\n\
  \        // 带参数调用 accelerate 方法\n        myCar.accelerate(60);\n    }\n}\n```\n\n\
  在这个示例中，`accelerate` 方法接收一个整数参数 `speed`，我们使用参数 `60` 来调用它。\n\n### 返回类型\n\n方法可以向调用者返回一个值。返回类型在方法的定义中指定。如果方法返回一个值，则必须使用\
  \ `return` 语句来返回该值。\n\n这是一个返回值的方法的示例：\n\n```java\npublic class Car {\n    // 属性和构造函数与之前相同...\n\
  \    // 获取车辆详情的方法\n    public String getDetails() {\n        return \"Car: \" +\
  \ this.model + \", Color: \" + this.color + \", Year: \" + this.year;\n    }\n \
  \   // 方法与之前相同...\n}\n```\n\n调用此方法并使用返回的值：\n\n```java\npublic class Main {\n   \
  \ public static void main(String[] args) {\n        // 创建 Car 类的对象\n        Car\
  \ myCar = new Car(\"Red\", \"Toyota\", 2022);\n        // 调用 getDetails 方法并存储返回的值\n\
  \        String details = myCar.getDetails();\n        System.out.println(details);\n\
  \    }\n}\n```\n\n在这段代码中，`getDetails` 方法返回一个描述汽车的 `String`，我们将返回的值存储在 `details`\
  \ 变量中。\n\n### 方法重载\n\n方法重载允许类拥有多个同名相同但参数列表不同的方法。这为使用不同类型或数量的参数来调用方法提供了灵活性。\n\n这里是方法重载的示例：\n\
  \n```java\npublic class Car {\n    // 属性和构造函数与之前相同...\n    // 加速的方法\n    public\
  \ void accelerate() {\n        System.out.println(\"The car is accelerating.\");\n\
  \    }\n    // 重载的方法，将车辆加速到特定速度\n    public void accelerate(int speed) {\n     \
  \   System.out.println(\"The car is accelerating to \" + speed + \" mph.\");\n \
  \   }\n    // 方法与之前相同...\n}\n```\n\n在这个示例中，`accelerate` 方法被重载了两个版本：一个不接受任何参数，另一个接收一个整数参数。\n\
  \n### 访问修饰符\n\n方法可以拥有访问修饰符，决定它们的可见性：\n\n- `public`：方法可以从任何其他类访问。\n- `private`：方法只能在定义它的类内部访问。\n\
  - `protected`：方法可以在同一个包和子类中被访问。\n- `default`（无修饰符）：方法可以在同一个包内被访问。\n\n这是一个演示不同访问修饰符的示例：\n\
  \n```java\npublic class Car {\n    // 属性和构造函数与之前相同...\n    // 公有方法\n    public void\
  \ start() {\n        System.out.println(\"The car is starting.\");\n    }\n    //\
  \ 私有方法\n    private void checkEngine() {\n        System.out.println(\"Checking\
  \ the engine.\");\n    }\n    // 保护方法\n    protected void stop() {\n        System.out.println(\"\
  The car is stopping.\");\n    }\n    // 默认方法\n    void accelerate() {\n        System.out.println(\"\
  The car is accelerating.\");\n    }\n}\n```\n\n在这个示例中，`start` 是公有方法，`checkEngine`\
  \ 是私有方法，`stop` 是保护方法，而 `accelerate` 具有默认访问权限。\n\n![](img/image_rsrc88X.jpg)![](img/image_rsrc88Y.jpg)\n\
  \n## 构造函数\n\n构造函数是 Java 中用于初始化对象的特殊方法。与普通方法不同，构造函数的名称与类名相同，且没有返回类型。在创建类的对象时，它们会被自动调用，允许你设置对象的初始状态。\n\
  \n#### 构造函数的目的\n\n构造函数的主要目的是初始化新创建的对象。这包括为对象的属性设置初始值，并在对象可以使用之前执行任何必要的设置工作。\n\n\
  ![](img/image_rsrc88Z.jpg)\n\n#### 定义构造函数\n\n构造函数定义在类内部，并与类名相同。它不返回任何值，即使是 `void`也不行。这是一个构造函数的基本示例：\n\
  \n```java\npublic class Car {\n    // 属性\n    private String color;\n    private\
  \ String model;\n    private int year;\n    // 构造函数\n    public Car(String color,\
  \ String model, int year) {\n        this.color = color;\n        this.model = model;\n\
  \        this.year = year;\n    }\n    // 方法\n    public void start() {\n      \
  \  System.out.println(\"The car is starting.\");\n    }\n    public void stop()\
  \ {\n        System.out.println(\"The car is stopping.\");\n    }\n    public void\
  \ accelerate() {\n        System.out.println(\"The car is accelerating.\");\n  \
  \  }\n    public String getDetails() {\n        return \"Car: \" + this.model +\
  \ \", Color: \" + this.color + \", Year: \" + this.year;\n    }\n}\n```\n\n在这个示例中，`Car`\
  \ 类有一个接收三个参数的构造函数：`color`、`model` 和 `year`。当创建 `Car` 对象时，该构造函数会初始化对象的属性。\n\n####\
  \ 使用构造函数\n\n要创建对象并初始化它，使用 `new` 关键字后面跟随构造所需的参数：\n\n```java\npublic class Main {\n\
  \    public static void main(String[] args) {\n        // 创建 Car 类的对象\n        Car\
  \ myCar = new Car(\"Red\", \"Toyota\", 2022);\n        // 访问方法\n        myCar.start();\n\
  \        myCar.accelerate();\n        System.out.println(myCar.getDetails());\n\
  \        myCar.stop();\n    }\n}\n```\n\n在这段代码中，`Car` 对象通过构造函数进行了属性初始化。\n\n### 构造函数的类型\n\
  \nJava 中有两种主要的构造函数类型：默认构造函数和参数构造函数。\n\n##### 默认构造函数\n\n默认构造函数不接受参数。如果你没有显式定义构造函数，Java\
  \ 会提供一个默认构造函数。这是一个带有默认构造函数的示例：\n\n```java\npublic class Car {\n    // 属性\n    private\
  \ String color;\n    private String model;\n    private int year;\n    // 默认构造函数\n\
  \    public Car() {\n        this.color = \"Unknown\";\n        this.model = \"\
  Unknown\";\n        this.year = 0;\n    }\n    // 方法\n    public void start() {\n\
  \        System.out.println(\"The car is starting.\");\n    }\n    public void stop()\
  \ {\n        System.out.println(\"The car is stopping.\");\n    }\n    public void\
  \ accelerate() {\n        System.out.println(\"The car is accelerating.\");\n  \
  \  }\n    public String getDetails() {\n        return \"Car: \" + this.model +\
  \ \", Color: \" + this.color + \", Year: \" + this.year;\n    }\n}\n```\n\n在这个示例中，`Car`\
  \ 类使用默认构造函数来初始化默认属性。\n\n##### 参数构造函数\n\n参数构造函数接收用于初始化对象的参数。这种构造函数允许你使用特定的初始值创建对象。\n\
  \n这是一个带有参数构造函数的示例：\n\n```java\npublic class Car {\n    // 属性\n    private String\
  \ color;\n    private String model;\n    private int year;\n    // 参数构造函数\n    public\
  \ Car(String color, String model, int year) {\n        this.color = color;\n   \
  \     this.model = model;\n        this.year = year;\n    }\n    // 方法\n    public\
  \ void start() {\n        System.out.println(\"The car is starting.\");\n    }\n\
  \    public void stop() {\n        System.out.println(\"The car is stopping.\");\n\
  \    }\n    public void accelerate() {\n        System.out.println(\"The car is\
  \ accelerating.\");\n    }\n    public String getDetails() {\n        return \"\
  Car: \" + this.model + \", Color: \" + this.color + \", Year: \" + this.year;\n\
  \    }\n}\n```\n\n在这个示例中，`Car` 类使用参数构造函数根据提供的值初始化属性。\n\n#### 重载构造函数\n\n就像方法一样，构造函数也可以重载。这意味着你可以在同一个类中拥有多个参数列表不同的构造函数。构造函数重载允许你根据提供的参数以不同的方式创建对象。\n\
  \n\n\n\n```java\npublic class Car {\n  // Attributes\n  private String color;\n\
  \  private String model;\n  private int year;\n\n  // 默认构造函数\n  public Car() {\n\
  \    this.color = \"Unknown\";\n    this.model = \"Unknown\";\n    this.year = 0;\n\
  \  }\n\n  // 参数化构造函数\n  public Car(String color, String model, int year) {\n   \
  \ this.color = color;\n    this.model = model;\n    this.year = year;\n  }\n\n \
  \ // 两个参数的参数化构造函数\n  public Car(String color, String model) {\n    this.color =\
  \ color;\n    this.model = model;\n    this.year = 2022; // Default 年份\n  }\n\n\
  \  // 方法\n  public void start() {\n    System.out.println(\"The car is starting.\"\
  );\n  }\n\n  public void stop() {\n    System.out.println(\"The car is stopping.\"\
  );\n  }\n\n  public void accelerate() {\n    System.out.println(\"The car is accelerating.\"\
  );\n  }\n\n  public String getDetails() {\n    return \"Car: \" + this.model + \"\
  , Color: \" + this.color + \", Year: \" + this.year;\n  }\n}\n```\n\n在这个示例中，`Car`\
  \ 类有三个构造函数：一个默认构造函数、一个带有三个参数的参数化构造函数以及一个带有两个参数的参数化构造函数。\n\n### 构造函数链 (Constructor\
  \ Chaining)\n\n构造函数链是一种构造函数调用同一类或父类中另一个构造函数的技术。这有助于避免代码重复并使初始化过程更加高效。\n\n以下是同一类中构造函数链的示例：\n\
  \n```java\npublic class Car {\n  // 属性\n  private String color;\n  private String\
  \ model;\n  private int year;\n\n  // 默认构造函数\n  public Car() {\n    this(\"Unknown\"\
  , \"Unknown\", 0);\n  }\n\n  // 参数化构造函数\n  public Car(String color, String model,\
  \ int year) {\n    this.color = color;\n    this.model = model;\n    this.year =\
  \ year;\n  }\n\n  // 两个参数的参数化构造函数\n  public Car(String color, String model) {\n\
  \    this(color, model, 2022);\n  }\n\n  // 方法\n  public void start() {\n    System.out.println(\"\
  The car is starting.\");\n  }\n\n  public void stop() {\n    System.out.println(\"\
  The car is stopping.\");\n  }\n\n  public void accelerate() {\n    System.out.println(\"\
  The car is accelerating.\");\n  }\n\n  public String getDetails() {\n    return\
  \ \"Car: \" + this.model + \", Color: \" + this.color + \", Year: \" + this.year;\n\
  \  }\n}\n```\n\n在这个示例中，默认构造函数和带有两个参数的构造函数使用 `this` 关键字调用了带有三个参数的构造函数。\n\n![](img/image_rsrc890.jpg)![](img/image_rsrc891.jpg)\n\
  \n# 继承 (Inheritance)\n\n继承是面向对象编程 (OOP) 中的一个基本概念，它允许一个类（称为子类或派生类）继承另一个类（称为父类或基类）的属性和方法。这促进了代码复用，并在类之间建立了自然的层级关系。\n\
  \n### 继承的目的\n\n继承提供了几个关键的优势：\n\n1. **代码复用**：通过继承父类，子类可以复用已经定义的代码，减少冗余并促进代码复用。\n\
  2. **层级组织**：继承有助于将类组织成层级结构，使得复杂系统更容易被理解和维护。\n3. **可扩展性**：子类可以通过添加新属性和方法或通过重写现有方法来扩展父类的功能。\n\
  \n### 定义继承\n\n在 Java 中，继承是通过使用 `extends` 关键字实现的。子类扩展父类，继承它的属性和方法。这里是一个基础示例：\n\n\
  ```java\n// 父类\npublic class Vehicle {\n  // 属性\n  protected String brand;\n  protected\
  \ int year;\n\n  // 构造函数\n  public Vehicle(String brand, int year) {\n    this.brand\
  \ = brand;\n    this.year = year;\n  }\n\n  // 方法\n  public void displayInfo() {\n\
  \    System.out.println(\"Brand: \" + brand + \", Year: \" + year);\n  }\n}\n\n\
  // 子类\npublic class Car extends Vehicle {\n  // 属性\n  private String model;\n\n\
  \  // 构造函数\n  public Car(String brand, int year, String model) {\n    super(brand,\
  \ year); // 调用父类构造函数\n    this.model = model;\n  }\n\n  // 方法\n  public void displayModel()\
  \ {\n    System.out.println(\"Model: \" + model);\n  }\n}\n```\n\n![](img/image_rsrc892.jpg)\n\
  \n在这个示例中：\n\n* `Vehicle` 是父类，具有属性 `brand` 和 `year` 以及一个方法 `displayInfo()`。\n* `Car`\
  \ 是子类，它扩展了 `Vehicle` 并添加了额外的属性 `model` 和方法 `displayModel()`。\n\n### 使用继承\n\n要使用继承，请创建子类的对象并调用它的方法：\n\
  \n```java\npublic class Main {\n  public static void main(String[] args) {\n   \
  \ // 创建一个 Car 类的对象\n    Car myCar = new Car(\"Toyota\", 2022, \"Corolla\");\n\n\
  \    // 调用来自父类和子类的方法\n    myCar.displayInfo(); // 来自父类的方法\n    myCar.displayModel();\
  \ // 来自子类的方法\n  }\n}\n```\n\n\n\n\n多态（Polymorphism）是面向对象编程（OOP）的核心概念，它允许不同类的对象被视为公共父类的对象。它允许用单一接口用于一组通用操作，使得可以使用单个方法来操作各种类型的对象。多态通过促进泛型方法的使用和简化代码结构，增强了代码的灵性和可维护性。\n\
  \n# 多态的类型\n\nJava 中主要有两种类型的多态性：\n\n### 编译时多态（方法重载）\n方法重载允许在同一个类中存在多个名称相同但参数列表不同的方法。要调用的正确方法根据方法签名在编译时确定。\n\
  \n### 运行时多态（方法重写）\n方法重写允许子类为其父类中已定义的方法提供特定的实现。要调的方法根据对象的实际类型在运行时确定，从而实现动态方法分发。\n\
  \n![](img/image_rsrc895.jpg)\n\n### 编译时多态（方法重载）\n当同一个类中的多个方法名称相同但参数列表不同时，就会发生方法重载。编译器根据传递参数的数量和类型来决定调用哪个方法。\n\
  \n这里是方法重载的示例：\n\n```java\npublic class Calculator {\n    // 添加两个整数的方法\n    public\
  \ int add(int a, int b) {\n        return a + b;\n    }\n\n    // 加载的方法：添加三个整数\n\
  \    public int add(int a, int b, int c) {\n        return a + b + c;\n    }\n\n\
  \    // 加载的方法：添加两个双精度浮点数\n    public double add(double a, double b) {\n        return\
  \ a + b;\n    }\n}\n\npublic class Main {\n    public static void main(String[]\
  \ args) {\n        Calculator calculator = new Calculator();\n        System.out.println(\"\
  2 和 3 的和: \" + calculator.add(2, 3));\n        System.out.println(\"1, 2 和 3 的和:\
  \ \" + calculator.add(1, 2, 3));\n        System.out.println(\"1.5 和 2.5 的和: \"\
  \ + calculator.add(1.5, 2.5));\n    }\n}\n```\n\n在这个示例中，`Calculator` 类拥有三个具有不同参数列表的\
  \ `add` 方法，演示了方法重载。\n\n### 运行时多态（方法重写）\n方法重写允许子类为其父类中已定义的方法提供特定的实现。要调用的方法根据对象的实际类型在运行时确定，实现了动态方法分发。\n\
  \n这里是方法重写的示例：\n\n```java\n// 父类\npublic class Animal {\n    // 发出声音的方法\n    public\
  \ void makeSound() {\n        System.out.println(\"动物发出了声音\");\n    }\n}\n\n// 子类\n\
  public class Dog extends Animal {\n    // 重写 makeSound 方法\n    @Override\n    public\
  \ void makeSound() {\n        System.out.println(\"狗在汪叫\");\n    }\n}\n\n// 另一个子类\n\
  public class Cat extends Animal {\n    // 重写 makeSound 方法\n    @Override\n    public\
  \ void makeSound() {\n        System.out.println(\"猫在喵喵\");\n    }\n}\n\npublic\
  \ class Main {\n    public static void main(String[] args) {\n        Animal myDog\
  \ = new Dog();\n        Animal myCat = new Cat();\n        // 调用重写的方法\n        myDog.makeSound();\
  \ // 输出: 狗在汪叫\n        myCat.makeSound(); // 输出: 猫在喵喵\n    }\n}\n```\n\n在这个示例中，`Dog`\
  \ 和 `Cat` 类重写了 `Animal` 类的 `makeSound` 方法。要调的方法根据实际对象类型（`Dog` 或 `Cat`）在运行时确定。\n\n\
  ### 多态的应用\n多态允许你编写更通用、更灵活的代码。例如，你可以使用公共接口或父类来处理一组相关对象。\n\n这里是一个使用接口的示例：\n\n```java\n\
  // 接口\npublic interface Shape {\n    void draw();\n}\n\n// 在类中实现接口\npublic class\
  \ Circle implements Shape {\n    @Override\n    public void draw() {\n        System.out.println(\"\
  绘制圆形\");\n    }\n}\n\n// 另一个实现接口的类\npublic class Rectangle implements Shape {\n\
  \    @Override\n    public void draw() {\n        System.out.println(\"绘制矩形\");\n\
  \    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n\
  \        // 创建 Shape 引用数组\n        Shape[] shapes = {new Circle(), new Rectangle()};\n\
  \        // 使用多态绘制形状\n        for (Shape shape : shapes) {\n            shape.draw();\
  \ // 输出: 绘制圆形, 绘制矩形\n        }\n    }\n}\n```\n\n在这个示例中，`Shape` 接口定义了一个公共方法 `draw()`。`Circle`\
  \ 和 `Rectangle` 类实现了该接口，并提供了 `draw()` 方法的特定实现。`Main` 类通过使用单一循环调用不同类型 `Shape` 对象的\
  \ `draw()` 方法，演示了多态性。\n\n## 多态的优势\n\n1. **代码复用性**：多态允许你使用相同的方法或接口来处理不同类型的对象，促进了代码复用。\n\
  2. **灵活性**：多态使得添加实现相同接口或扩展相同父类的的新类变得容易，而无需修改现有代码。\n3. **可维护性**：它减少了代码的复杂性。\n4. **可扩展性**：通过添加子类或实现接口，你可以扩展代码库。\n\
  \n# 封装 (Encapsulation)\n\n封装是面向对象编程（OOP）的基本原则之一，与继承、多态和抽象并列。它将数据（属性）和操作数据的方法（函数）封装在一个名为类的单元中。封装限制了对对象某些组件的直接访问。\n\
  \n### 封装的核心概念\n\n1. **数据隐藏**：封装隐藏了对象的内部状态，并通过受控的接口暴露。这意味着对象的内部表示是对外部隐藏的。\n2. **访问修饰符**：Java\
  \ 提供了四种访问修饰符来确定类的可见性：\n    - `private`：仅在类内部可见。\n    - `default`（无修饰符）：仅在同包的类中可见。\n\
  \    - `protected`：在同包类中以及子类中可见。\n    - `public`：在任何其他类中可见。\n\n## 封装的好处\n\n- **提高可维护性**：封装允许更改类的实现，而不影响程序的其他部分。这使得代码更容易维护和更新。\n\
  - **增强安全性**：通过限制对对象内部状态的访问，封装有助于保护数据不受意外修改，并确保设置的是有效数据。\n- **模块化设计**：封装通过将代码组织为具有良好定义的独立单元来促进模块化，使系统更容易理解和管理。\n\
  \n![](img/image_rsrc898.jpg)\n\n### 实现封装\n\n在 Java 中实现封装，通常将类的属性设为 `private`，并提供公共的\
  \ getter 和 setter 方法来访问和修改属性。这种方法确保了对属性的访问是受控的，并在必要时进行验证。\n\n这里是一个 Java 封装的简单示例：\n\
  \n```java\npublic class Person {\n    // 私有属性\n    private String name;\n    private\
  \ int age;\n\n    // 构造函数\n    public Person(String name, int age) {\n        this.name\
  \ = name;\n        this.age = age;\n    }\n\n    // name 的 public getter 方法\n  \
  \  public String getName() {\n        return name;\n    }\n\n    // name 的 public\
  \ setter 方法\n    public void setName(String name) {\n        this.name = name;\n\
  \    }\n\n    // age 的 public getter 方法\n    public int getAge() {\n        return\
  \ age;\n    }\n}\n```\n\n\n\n\n```java\n// 年龄的公共 setter 方法\npublic void setAge(int\
  \ age) {\n    if (age > 0) {\n        this.age = age;\n    } else {\n        System.out.println(\"\
  Age must be positive.\");\n    }\n}\n\n// 显示个人详情的方法\npublic void displayDetails()\
  \ {\n    System.out.println(\"Name: \" + name + \", Age: \" + age);\n}\n}\n\npublic\
  \ class Main {\n    public static void main(String[] args) {\n        // 创建 Person\
  \ 类的对象\n        Person person = new Person(\"John\", 25);\n        // 通过公共方法访问并修改私有属性\n\
  \        person.setName(\"Jane\");\n        person.setAge(30);\n\n        // 显示详情\n\
  \        person.displayDetails(); // 输出: Name: Jane, Age: 30\n\n        // 尝试设置无效的年龄\n\
  \        person.setAge(-5); // 输出: Age must be positive.\n    }\n}\n```\n\n在这个示例中：\n\
  \n- `Person` 类拥有私有属性 `name` 和 `age`。\n- 提供了公共的 getter 和 setter 方法来访问和修改这些属性。\n-\
  \ `setAge` 方法包含了验证逻辑，以确保 `age` 为正数。\n\n### 现实世界示例：银行账户类中的封装\n\n让我们考虑一个更实用的示例，使用封装来实现\
  \ `BankAccount` 类。该类应该封装账户余额，并提供存款和取款的方法，同时确保账户余额不能被直接设置。\n\n```java\npublic class\
  \ BankAccount {\n    // 私有属性\n    private double balance;\n\n    // 构造函数\n    public\
  \ BankAccount(double initialBalance) {\n        if (initialBalance > 0) {\n    \
  \        this.balance = initialBalance;\n        } else {\n            this.balance\
  \ = 0;\n            System.out.println(\"Initial balance must be positive.\");\n\
  \        }\n    }\n\n    // 余额的公共 getter 方法\n    public double getBalance() {\n\
  \        return balance;\n    }\n\n    // 存款的方法\n    public void deposit(double\
  \ amount) {\n        if (amount > 0) {\n            balance += amount;\n       \
  \     System.out.println(\"Deposited: \" + amount + \", New balance: \" + balance);\n\
  \        } else {\n            System.out.println(\"Deposit amount must be positive.\"\
  );\n        }\n    }\n\n    // 取款的方法\n    public void withdraw(double amount) {\n\
  \        if (amount > 0 && amount <= balance) {\n            balance -= amount;\n\
  \            System.out.println(\"Withdrew: \" + amount + \", New balance: \" +\
  \ balance);\n        } else {\n            System.out.println(\"Invalid withdraw\
  \ amount.\");\n        }\n    }\n}\n\npublic class Main {\n    public static void\
  \ main(String[] args) {\n        // 创建带有初始余额的银行账户\n        BankAccount account =\
  \ new BankAccount(1000);\n        // 存款\n        account.deposit(500);\n       \
  \ // 输出: Deposited: 500.0, New balance: 1500.0\n\n        // 取款\n        account.withdraw(300);\n\
  \        // 输出: Withdrew: 300.0, New balance: 1200.0\n\n        // 尝试取出超过余额的金额\n\
  \        account.withdraw(2000);\n        // 输出: Invalid withdraw amount.\n\n  \
  \      // 显示余额\n        System.out.println(\"Final balance: \" + account.getBalance());\n\
  \        // 输出: Final balance: 1200.0\n    }\n}\n```\n\n在这个示例中：\n\n- `BankAccount`\
  \ 类封装了 `balance` 属性，使其变为私有。\n- 提供了公共方法 `deposit` 和 `withdraw` 来修改 `balance`。\n-\
  \ `deposit` 和 `withdraw` 方法包含了验证，以确保操作是有效的。\n\n# 抽象 (Abstraction)\n\n抽象是面向对象编程（OOP）的核心原则之一，侧重于隐藏复杂的实现细节，并向外部世界暴露对象的本质特征。这简化了与对象的交互，允许开发者关注高层功能，而无需担心底层的复杂性。Java\
  \ 通过抽象类和接口实现抽象。\n\n### 抽象的核心概念\n\n1. **简化**：抽象通过隐藏实现细节简化对象的交互。\n2. **模块化**：抽象通过将复杂系统拆分为更小、易于管理的组件，促进了模块化。\n\
  3. **关注“做什么”，而不是“怎么做”**：抽象允许开发者关注对象做什么，而不是它是如何实现的。\n\n### 抽象类\n\nJava 中的抽象类是不能直接实例化的类。它既可以包含抽象方法（没有方法体的方法），也可以包含具体方法（有方法体的方法）。抽象类用于定义可以被子类的的特征和行为。\n\
