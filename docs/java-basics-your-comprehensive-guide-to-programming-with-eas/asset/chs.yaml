  \    char charVar;\n    boolean boolVar;\n\n    public static void main(String[]\
  \ args) {\n        // 创建该类的实例\n        DataTypeDemo demo = new DataTypeDemo();\n\
  \n        // 初始化实例变量\n        demo.byteVar = 10;\n        demo.shortVar = 20;\n\
