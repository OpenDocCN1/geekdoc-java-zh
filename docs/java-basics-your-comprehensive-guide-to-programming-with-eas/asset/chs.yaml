  无效选项。请重试。\");\n                    break;\n            }\n        }\n        scanner.close();\n\
  \    }\n}\n```\n\n## 解析\n\n1. `Contact` 类：定义了一个包含姓名、电话号码和邮箱属性的联系人。包含了这些属性的 getter\
  \ 和 setter 方法，以及一个用于显示的重写了 `toString` 方法。\n2. `ContactManager` 类：使用 `HashMap` 管理联系人集合。提供了添加、删除、更新、查询和显示联系人的方法。\n\
  3. `Main` 类：提供了一个与联系人管理系统交互的用户界面。它使用 `Scanner` 获取用户输入，并使用循环保持程序运行，直到用户选择退出。\n\n\n\
  \n\n\n`InputStream` 类是所有字节输入流的父类，它提供了从源读取字节的方法。\n\n### 常见的 InputStream 子类：\n\n####\
  \ `FileInputStream`: 从文件中读取字节字节。\n\n```java\nimport java.io.FileInputStream;\nimport\
  \ java.io.IOException;\n\npublic class FileInputStreamExample {\n    public static\
  \ void main(String[] args) {\n        try (FileInputStream fis = new FileInputStream(\"\
  example.txt\")) {\n            int byteData;\n            while ((byteData = fis.read())\
  \ != -1) {\n                System.out.print((char) byteData);\n            }\n\
  \        } catch (IOException e) {\n            e.printStackTrace();\n        }\n\
  \    }\n}\n```\n![](img/image_rsrc8AM.jpg)\n\n#### `ByteArrayInputStream`: 从内存中的字节数组读取字节。\n\
  \n```java\nimport java.io.ByteArrayInputStream;\nimport java.io.IOException;\n\n\
  public class ByteArrayInputStreamExample {\n    public static void main(String[]\
  \ args) {\n        byte[] byteArray = {65, 66, 67, 68};\n        try (ByteArrayInputStream\
  \ bais = new ByteArrayInputStream(byteArray)) {\n            int byteData;\n   \
  \         while ((byteData = bais.read()) != -1) {\n                System.out.print((char)\
  \ byteData);\n            }\n        } catch (IOException e) {\n            e.printStackTrace();\n\
  \        }\n    }\n}\n```\n\n# OutputStream\n\n`OutputStream` 类是所有字节输出流的父类，它提供了向目标写入字节的方法。\n\
  \n### 常见的 OutputStream 子类：\n\n#### `FileOutputStream`: 向文件写入字节。\n\n```java\nimport\
  \ java.io.FileOutputStream;\nimport java.io.IOException;\n\npublic class FileOutputStreamExample\
  \ {\n    public static void main(String[] args) {\n        try (FileOutputStream\
  \ fos = new FileOutputStream(\"example.txt\")) {\n            String data = \"Hello,\
  \ World!\";\n            fos.write(data.getBytes());\n        } catch (IOException\
  \ e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\n#### `ByteArrayOutputStream`:\
  \ 向内存中的字节数组写入字节。\n\n```java\nimport java.io.ByteArrayOutputStream;\nimport java.io.IOException;\n\
  \npublic class ByteArrayOutputStreamExample {\n    public static void main(String[]\
  \ args) {\n        try (ByteArrayOutputStream baos = new ByteArrayOutputStream())\
  \ {\n            String data = \"Hello, World!\";\n            baos.write(data.getBytes());\n\
  \            byte[] byteArray = baos.toByteArray();\n            for (byte b : byteArray)\
  \ {\n                System.out.print((char) b);\n            }\n        } catch\
  \ (IOException e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\
  ![](img/image_rsrc8AN.jpg)[](image_rsrc8AP.jpg)\n\n# 字符流\n\nJava 中的字符流设计用于处理文本数据。它们以\
  \ 16 位 Unicode 字符的形式读取和写入数据，适用于处理文本文件，并确保字符编码的正确处理。字符流的主要类是 `Reader` 和 `Writer`。\n\
  \n## Reader\n\n`Reader` 类是所有字符输入流的父类，提供了读取字符、字符数组和行的方法。\n\n### 常见的 Reader 子类：\n\n\
  #### `FileReader`: 从文件中读取字符。\n\n```java\nimport java.io.FileReader;\nimport java.io.IOException;\n\
  \npublic class FileReaderExample {\n    public static void main(String[] args) {\n\
  \        try (FileReader fr = new FileReader(\"example.txt\")) {\n            int\
  \ charData;\n            while ((charData = fr.read()) != -1) {\n              \
  \  System.out.print((char) charData);\n            }\n        } catch (IOException\
  \ e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\n#### `CharArrayReader`:\
  \ 从字符数组读取字符。\n\n```java\nimport java.io.CharArrayReader;\nimport java.io.IOException;\n\
  \npublic class CharArrayReaderExample {\n    public static void main(String[] args)\
  \ {\n        char[] charArray = {'H', 'e', 'l', 'l', 'o'};\n        try (CharArrayReader\
  \ car = new CharArrayReader(charArray)) {\n            int charData;\n         \
  \   while ((charData = car.read()) != -1) {\n                System.out.print((char)\
  \ charData);\n            }\n        } catch (IOException e) {\n            e.printStackTrace();\n\
  \        }\n    }\n}\n```\n![](img/image_rsrc8AR.jpg)\n\n## Writer\n\n`Writer` 类是所有字符输出流的父类，提供了写入字符、字符数组和字符串的方法。\n\
  \n### 常见的 Writer 子类：\n\n#### `FileWriter`: 向文件写入字符。\n\n```java\nimport java.io.FileWriter;\n\
  import java.io.IOException;\n\npublic class FileWriterExample {\n    public static\
  \ void main(String[] args) {\n        try (FileWriter fw = new FileWriter(\"example.txt\"\
  )) {\n            fw.write(\"Hello, World!\");\n        } catch (IOException e)\
  \ {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\n#### `CharArrayWriter`:\
  \ 向字符数组写入字符。\n\n```java\nimport java.io.CharArrayWriter;\nimport java.io.IOException;\n\
  \npublic class CharArrayWriterExample {\n    public static void main(String[] args)\
  \ {\n        try (CharArrayWriter caw = new CharArrayWriter()) {\n            caw.write(\"\
  Hello, World!\");\n            char[] charArray = caw.toCharArray();\n         \
  \   for (char c : charArray) {\n                System.out.print(c);\n         \
  \   }\n        } catch (IOException e) {\n            e.printStackTrace();\n   \
  \     }\n    }\n}\n```\n\n# 缓冲流\n\n字符缓冲流使用内部缓冲区来减少 I/O 操作次数，从而提高性能。它们通常作为其他流的包装器。\n\
  \n#### `BufferedReader`: 缓冲字符输入流。\n\n```java\nimport java.io.BufferedReader;\nimport\
  \ java.io.FileReader;\nimport java.io.IOException;\n\npublic class BufferedReaderExample\
  \ {\n    public static void main(String[] args) {\n        try (BufferedReader br\
  \ = new BufferedReader(new FileReader(\"example.txt\"))) {\n            String line;\n\
  \            while ((line = br.readLine()) != null) {\n                System.out.println(line);\n\
  \            }\n        } catch (IOException e) {\n            e.printStackTrace();\n\
  \        }\n    }\n}\n```\n\n#### `BufferedWriter`: 缓冲字符输出流。\n\n```java\nimport\
  \ java.io.BufferedWriter;\nimport java.io.FileWriter;\nimport java.io.IOException;\n\
  \npublic class BufferedWriterExample {\n    public static void main(String[] args)\
  \ {\n        try (BufferedWriter bw = new BufferedWriter(new FileWriter(\"example.txt\"\
  ))) {\n            bw.write(\"Hello, World!\");\n            bw.newLine();\n   \
  \         bw.write(\"Java character streams are powerful.\");\n        } catch (IOException\
  \ e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n![](img/image_rsrc8AS.jpg)[](image_rsrc8AT.jpg)\n\
  \n# 缓冲流（通用）\n\nJava 中的缓冲流设计用于通过减少物理读写次数来增强 I/O 操作的性能。它们使用内部缓冲区存储数据，尽量减少与底层 I/O 系统的交互。\n\
  \n### BufferedInputStream\n\n`BufferedInputStream` 包装 `InputStream` 并缓冲输入以提高效率。它将数据块读取到缓冲区，并从缓冲区提供后续读取。\n\
  \n```java\nimport java.io.BufferedInputStream;\nimport java.io.FileInputStream;\n\
  import java.io.IOException;\n\npublic class BufferedInputStreamExample {\n    public\
  \ static void main(String[] args) {\n        try (BufferedInputStream bis = new\
  \ BufferedInputStream(new FileInputStream(\"example.txt\"))) {\n            int\
  \ byteData;\n            while ((byteData = bis.read()) != -1) {\n             \
  \   System.out.print((char) byteData);\n            }\n        } catch (IOException\
  \ e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n![](img/image_rsrc8AU.jpg)\n\
  \n### BufferedOutputStream\n\n`BufferedOutputStream` 包装 `OutputStream` 并缓冲输出以提高效率。它将数据写入缓冲区，仅当缓冲区满或流被刷新时才写入输出流。\n\
  \n```java\nimport java.io.BufferedOutputStream;\nimport java.io.FileOutputStream;\n\
  import java.io.IOException;\n\npublic class BufferedOutputStreamExample {\n    public\
  \ static void main(String[] args) {\n        try (BufferedOutputStream bos = new\
  \ BufferedOutputStream(new FileOutputStream(\"example.txt\"))) {\n            String\
  \ data = \"Hello, World!\";\n            bos.write(data.getBytes());\n        }\
  \ catch (IOException e) {\n            e.printStackTrace();\n        }\n    }\n\
  }\n```\n\n### BufferedReader and BufferedWriter\n\n缓冲字符流进一步优化了文本数据的读取和写入。\n\n`BufferedReader`:\
  \ 用于高效读取字符输入流。\n\n```java\nimport java.io.BufferedReader;\nimport java.io.FileReader;\n\
  import java.io.IOException;\n\npublic class BufferedReaderExample {\n    public\
  \ static void main(String[] args) {\n        try (BufferedReader br = new BufferedReader(new\
  \ FileReader(\"example.txt\"))) {\n            String line;\n            while ((line\
  \ = br.readLine()) != null) {\n                System.out.println(line);\n     \
  \       }\n        } catch (IOException e) {\n            e.printStackTrace();\n\
  \        }\n    }\n}\n```\n\n\n\n\n\n`BufferedWriter`: 缓冲输出字符流以高效写入。\n\n```java\n\
  import java.io.BufferedWriter;\nimport java.io.FileWriter;\nimport java.io.IOException;\n\
  \npublic class BufferedWriterExample {\n    public static void main(String[] args)\
  \ {\n        try (BufferedWriter bw = new BufferedWriter(new FileWriter(\"example.txt\"\
  ))) {\n            bw.write(\"Hello, World!\");\n            bw.newLine();\n   \
  \         bw.write(\"Buffered streams in Java are efficient.\");\n        } catch\
  \ (IOException e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\
  \n## 缓冲流的优势\n\n1. **性能**：缓冲流通过批处理读取和写减少了 I/O 操作的次数，提升了整体性能。\n2. **效率**：通过最小化物理 I/O\
  \ 交互，缓冲流使得数据传输更高效。\n3. **便利性**：缓冲流为读取和写入文本行提供了方便的方法，使代码更简单且具可读性。\n\n![](img/image_rsrc8AV.jpg)!![](img/image_rsrc8AW.jpg)\n\
  \n## 序列化与反序列化\n\nJava 中的序列化是将对象转换为字节流的过程，允许将其轻松地保存到文件、发送到网络或存储在数据库中。反序列化是相反的过程，将字节流转换回原始对象的副本。这种机制对于持久化存储以及\
  \ Java 程序之间的通信至关重要。\n\n### 序列化\n\n要对对象进行序列化，该对象必须实现 `Serializable` 接口，它是一个标记接口（没有方法的接口）。`ObjectOutputStream`\
  \ 类用于将对象写入输出流。\n\n示例：\n\n```java\nimport java.io.FileOutputStream;\nimport java.io.ObjectOutputStream;\n\
  import java.io.Serializable;\nimport java.io.IOException;\n\nclass Person implements\
  \ Serializable {\n    private static final long serialVersionUID = 1L;\n    String\
  \ name;\n    int age;\n    Person(String name, int age) {\n        this.name = name;\n\
  \        this.age = age;\n    }\n}\n\npublic class SerializationExample {\n    public\
  \ static void main(String[] args) {\n        Person person = new Person(\"John Doe\"\
  , 30);\n        try (FileOutputStream fileOut = new FileOutputStream(\"person.ser\"\
  );\n             ObjectOutputStream out = new ObjectOutputStream(fileOut)) {\n \
  \           out.writeObject(person);\n            System.out.println(\"Serialized\
  \ data is saved in person.ser\");\n        } catch (IOException i) {\n         \
  \   i.printStackTrace();\n        }\n    }\n}\n```\n![](img/image_rsrc8AX.jpg)\n\
  \n### 反序列化\n\n反序列化使用 `ObjectInputStream` 类进行，该类读取字节流并将其转换回对象。\n\n示例：\n\n```java\n\
  import java.io.FileInputStream;\nimport java.io.ObjectInputStream;\nimport java.io.IOException;\n\
  \npublic class DeserializationExample {\n    public static void main(String[] args)\
  \ {\n        Person person = null;\n        try (FileInputStream fileIn = new FileInputStream(\"\
  person.ser\");\n             ObjectInputStream in = new ObjectInputStream(fileIn))\
  \ {\n            person = (Person) in.readObject();\n            System.out.println(\"\
  Deserialized Person...\");\n            System.out.println(\"Name: \" + person.name);\n\
  \            System.out.println(\"Age: \" + person.age);\n        } catch (IOException\
  \ | ClassNotFoundException i) {\n            i.printStackTrace();\n        }\n \
  \   }\n}\n```\n\n### Transient 关键字\n\n标记为 `transient` 的字段不会被序列化。这对于敏感或对序列化无意义的字段非常有用。\n\
  \n```java\nclass Person implements Serializable {\n    private static final long\
  \ serialVersionUID = 1L;\n    String name;\n    transient int age; // 此字段不会被序列化\n\
  \    Person(String name, int age) {\n        this.name = name;\n        this.age\
  \ = age;\n    }\n}\n```\n\n### 自定义序列化\n\n实现自定义序列化允许你通过定义 `writeObject` 和 `readObject`\
  \ 方法来控制序列化和反序列化过程。\n\n```java\nprivate void writeObject(ObjectOutputStream oos)\
  \ throws IOException {\n    // 序列化非 transient 字段\n    oos.defaultWriteObject();\n\
  \    oos.writeInt(age); // 对 age 的自定义序列化\n}\n\nprivate void readObject(ObjectInputStream\
  \ ois) throws IOException, ClassNotFoundException {\n    // 反序列化非 transient 字段\n\
  \    ois.defaultReadObject();\n    age = ois.readInt(); // 对 age 的自定义反序列化\n}\n```\n\
  ![](img/image_rsrc8AY.jpg)!![](img/image_rsrc8AZ.jpg)\n\n## 项目：开发文件加密/解密工具\n\n在这个项目中，我们将创建一个可以使用\
  \ Java 对文件进行加密和解密的工具。该工具将利用 Java 加密架构 (JCA) 来确保数据安全。我们将使用 `AES`（高级加密标准）算法进行加密和解密，因为它具有高效性和安全性。\n\
  \n### 逐步实现\n\n1. **设置项目**：创建一个名为 `FileEncryptionUtility` 的新项目和类。\n2. **生成 AES 密钥**：为\
  \ AES 生成对称密钥。\n3. **加密文件**：实现一个加密文件的方法。\n4. **解密文件**：实现一个解密文件的方法。\n5. **主方法**：提供一个简单的接口来测试加密和解密函数。\n\
  \n创建一个名为 `FileEncryptionUtility.java` 的 Java 文件。\n\n```java\nimport javax.crypto.Cipher;\n\
  import javax.crypto.KeyGenerator;\nimport javax.crypto.SecretKey;\nimport javax.crypto.spec.SecretKeySpec;\n\
  import java.io.FileInputStream;\nimport java.io.FileOutputStream;\nimport java.io.IOException;\n\
  import java.security.NoSuchAlgorithmException;\n\npublic class FileEncryptionUtility\
  \ {\n    private static final String ALGORITHM = \"AES\";\n    private static final\
  \ int KEY_SIZE = 128;\n\n    public static void main(String[] args) {\n        try\
  \ {\n            // 生成 密钥\n            SecretKey secretKey = generateKey();\n  \
  \          // 加密文件\n            String inputFile = \"plainfile.txt\";\n        \
  \    encryptFile(secretKey, inputFile, \"encryptedfile.enc\");\n            // 解密文件\n\
  \            String decryptedFile = \"decryptedfile.txt\";\n            decryptFile(secretKey,\
  \ decryptedFile);\n        } catch (Exception e) {\n            e.printStackTrace();\n\
  \        }\n    }\n\n    // 生成 AES 密钥\n    public static SecretKey generateKey()\
  \ throws NoSuchAlgorithmException {\n        KeyGenerator keyGen = KeyGenerator.getInstance(ALGORITHM);\n\
  \        keyGen.init(KEY_SIZE, new java.security.SecureRandom());\n        return\
  \ keyGen.generateKey();\n    }\n\n    // 加密文件\n    public static void encryptFile(SecretKey\
  \ key, String inputFile, String outputFile) throws Exception {\n        Cipher cipher\
  \ = Cipher.getInstance(ALGORITHM);\n        cipher.init(Cipher.ENCRYPT_MODE, key);\n\
  \        try (FileInputStream inputStream = new FileInputStream(inputFile);\n  \
  \           FileOutputStream outputStream = new FileOutputStream(outputFile)) {\n\
  \            byte[] inputBytes = new byte[64];\n            int bytesRead;\n   \
  \         while ((bytesRead = inputStream.read(inputBytes)) != -1) {\n         \
  \       byte[] outputBytes = cipher.update(inputBytes, 0, bytesRead);\n        \
  \        if (outputBytes != null) {\n                    outputStream.write(outputBytes);\n\
  \                }\n            }\n            byte[] outputBytes = cipher.doFinal();\n\
  \            if (outputBytes != null) {\n                outputStream.write(outputBytes);\n\
  \            }\n        }\n    }\n\n    // 解密文件\n    public static void decryptFile(SecretKey\
  \ key, String inputFile) throws Exception {\n        Cipher cipher = Cipher.getInstance(ALGORITHM);\n\
  \        cipher.init(Cipher.DECRYPT_MODE, key);\n        try (FileInputStream inputStream\
  \ = new FileInputStream(inputFile);\n             FileOutputStream outputStream\
  \ = new FileOutputStream(\"decrypted.txt\")) {\n            byte[] inputBytes =\
  \ new byte[64];\n            int bytesRead;\n            while ((bytesRead = inputStream.read(inputBytes))\
  \ != -1) {\n                byte[] outputBytes = cipher.update(inputBytes, 0, bytesRead);\n\
  \                if (outputBytes != null) {\n                    outputStream.write(outputBytes);\n\
  \                }\n            }\n            byte[] outputBytes = cipher.doFinal();\n\
  \            if (outputBytes != null) {\n                outputStream.write(outputBytes);\n\
  \            }\n        }\n    }\n}\n```\n\n### 代码说明\n\n**生成 AES 密钥**：`generateKey`\
  \ 方法使用 `KeyGenerator` 为 AES 加密生成密钥密钥。`KeyGenerator.getInstance(ALGORITHM)` 获取 `AES`\
  \ 密钥生成器的实例。`keyGen.init(KEY_SIZE, new SecureRandom())` 使用指定的密钥大小和安全随机生成器初始化密钥生成器。\n\
  \n**加密文件**：`encryptFile` 方法使用密钥密钥在 `ENCRYPT_MODE` 模式下初始化 `Cipher`。它调用 `processFile`\
  \ 方法来执行加密，从输入文件读取并将加密后的数据写入输出文件。\n\n\n\n\n\n`decryptFile` 方法使用密钥在 `DECRYPT_MODE`\
  \ 下初始化 `Cipher`。\n\n它调用 `processFile` 方法执行解密操作，从加密文件中读取数据并将解密后的数据写入输出文件。\n\n###\
  \ 处理文件\n\n`processFile` 方法分块从输入文件中读取数据，并使用 `Cipher` 进行进行处理。\n\n它将处理后的数据写入输出文件。\n\
