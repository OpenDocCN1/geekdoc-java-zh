  \nJava 中的接口是一种引用类型，它可以只包含抽象方法（在 Java 8 之前）。接口用于定义类可以实现的约定。\n\n这是一个接口的示例：\n\n```java\n\
  // 接口\ninterface Vehicle {\n    void start();\n    void stop();\n}\n\n// 实现接口的类\n\
  class Car implements Vehicle {\n    @Override\n    public void start() {\n     \
  \   System.out.println(\"Car is starting.\");\n    }\n\n    @Override\n    public\
  \ void stop() {\n        System.out.println(\"Car is stopping.\");\n    }\n}\n\n\
  // 另一个实现接口的类\nclass Motorcycle implements Vehicle {\n    @Override\n    public void\
  \ start() {\n        System.out.println(\"Motorcycle is starting.\");\n    }\n\n\
  \    @Override\n    public void stop() {\n        System.out.println(\"Motorcycle\
  \ is stopping.\");\n    }\n}\n\npublic class Main {\n    public static void main(String[]\
  \ args) {\n        Vehicle car = new Car();\n        Vehicle motorcycle = new Motorcycle();\n\
  \n        car.start(); // 输出: Car is starting.\n        car.stop();   // 输出: Car\
  \ is stopping.\n        motorcycle.start(); // 输出: Motorcycle is starting.\n   \
  \     motorcycle.stop();  // 输出: Motorcycle is stopping.\n    }\n}\n```\n\n在这个示例中：\n\
  \n- `Vehicle` 是一个接口，定义了抽象方法 `start()` 和 `stop()`。\n- `Car` 和 `Motorcycle` 是实现 `Vehicle`\
