- "# Java 基础：从零到高级概念的轻松自信编程全面指南\n\n\n[费曼学习法](https://wiki.example.org/feynmans_learning_method)灵感源于诺贝尔奖获得者**查德·费曼**。\n\
  \n1.  运用费曼技巧，你只需花 `20 min`就能深入理解知识点，而且记忆深刻*难以遗忘*。\n\n```\nif (condVar > someVal)\
  \ {console.log(\"xxx\")}\n```\n\n\n\n\n# 集成开发环境 (IDEs)\n\n用于 Java 开发的流行 IDE 包括 `IntelliJ\
  \ IDEA`、`Eclipse` 和 `NetBeans`。这些工具提供了代码补全、调试和版本控制集成等高级功能，使开发更加高效。\n\n# Java 的应用\n\
  \nJava 广泛应用于不同领域的各种场景：\n\n- **Web 应用**：Java 广泛用于服务器端开发，如 `Spring` 和 `JavaServer\
  \ Faces` (`JSF`) 等框架简化了可扩展 Web 的创建。\n- **移动应用**：最流行的移动操作系统 Android 高度依赖 Java 进行应用开发。Android\
  \ 开发的官方 IDE `Android Studio` 使用 Java 作为其主要语言。\n- **企业级应用**：Java 是企业环境中的支柱，通过 `Java\
  \ EE`（企业版）等框架为复杂的业务应用和系统提供支持。\n- **嵌入式系统**：Java 的平台独立性和扩展性使其适用于嵌入式系统，例如智能卡和 `IoT`\
  \ 设备。\n- **大数据技术**：Java 在大数据技术中发挥着重要作用，`Hadoop` 和 `Apache Kafka` 等平台依赖 Java 来处理和管理大型数据集。\n\
  - **科学应用**：Java 用于科学计算，因为它具有高精度、可靠性以及支持复杂数学计算和模拟的广泛库。\n\n![](img/image_rsrc87G.jpg)\n\
  \n# Java 的历史与演变\n\nJava 的历程始于 20 世纪 90 年代初，当时 Sun Microsystems James Gosling 领导的团队寻求为消费电子开发一种平台无关的编程语言。最初的项目名为“Oak”，旨在创建一种可以在各种设备上无需修改即可运行的语言。然而，随着互联网的兴起，重心转向为\
  \ Web 应用开发健壮、安全且可移植的语言。Java 就此诞生。\n\n## 早期阶段\n\n- **1995 - Java 1.0**：Java 的第一个正式版本，以“编写一次，到处运行”（WORA）的口号推出。该版本包含了让\
  \ Java 具有革命性意义的核心特性能：平台独立性、健壮的安全模型和巨大的标准库。\n- **1996 - Java 1.1**：该版本带来了显著改进，包括引入内部类、`JavaBeans`\
  \ 和 `JDBC`（Java 数据库连接），这使得 Java 应用能够无缝地与数据库交互。\n\n![](img/image_rsrc87H.jpg)\n\n\
  ## 成长与成熟\n\n- **1997-1999 - Java 2 (JDK 1.2, 1.3, 1.4)**：随着更名为为 Java 2，平台分为三个版本：Java\
  \ 标准版 (`J2SE`)、Java 企业版 (`J2EE`) 和 Java 微型版 (`J2ME`)。这些版本引入了用于构建图形用户界面的 `Swing`、集合框架以及对性能和安全的增强。\n\
  - **2004 - Java 5 (J2SE 5.0)**：标志着巨大的飞跃，该版本引入了泛型、元数据（注解）、枚举类型和增强型 for 循环。这些特性显著提高了开发者的生产力和代码的可读性。\n\
  \n## 现代 Java\n\n- **2006 - Java 6**：专注于性能改进，并包含了 Java 编译器和运行时的增强。它还通过包含 `Java Compiler\
  \ API` 引入了脚本支持。\n- **2011 - Java 7**：该版本引入了如 `try-with-resources` 语句、菱形运算符和用于并行处理的\
  \ `fork/join` 框架等特性。Java 7 还标志着 Java 管理权从 Sun Microsystems 转移到 Oracle 公司。\n- **2014\
  \ - Java 8**：最具变革性的发布之一，Java 8 带来了 lambda 表达式、`Stream API` 和新的 `Date and Time API`。这些特性显著增强了\
  \ Java 代码的表达能力性能。\n- **2017 - Java 9**：此版本引入了模块系统（Project Jigsaw），允许开发者对其应用程序以及\
  \ `JDK` 本身进行模块化。它还包含了对 `JVM` 的改进以及新工具如 Java 的交互式 REPL `JShell`。\n- **2018 - Java\
  \ 10**：引入了用于局部变量类型推断的 `var` 关键字，代码更加简洁。\n- **2018 - Java 11**：标志着转向六个月的新发布周期。此 LTS（长期支持）版本包含了\
  \ `HTTP Client API` 等特性以及对垃圾收集器和 `JVM` 的各种改进。\n- **2019 - Java 12**：继续定期更新的模式，引入了如新的\
  \ `switch` 表达式和 `JVM constants API` 等特性。\n- **2019 - Java 13**：带来了文本块等增强，简化了在 Java\
  \ 代码中包含多行字符串字面量。\n- **2020 - Java 14**：引入了如 `instanceof` 模式匹配、`records` 和更有用的 `NullPointerExceptions`\
  \ 等特性。\n- **2021 - Java 16**：包含了如 `vector API`、增强的伪随机数生成器以及并发线程栈处理。\n- **2021 -\
  \ Java 17**：另一个 LTS 版本，它引入了 `sealed classes` 和新的 macOS 渲染管道等特性。\n- **2022 - Java\
  \ 18**：引入了如简单的 Web 服务器、默认 `UTF-8` 以及 Java API 文档中的代码片段等。\n- **2023 - Java 19**：专注于孵化特性，如结构化并发、虚拟线程和针对\
  \ `switch` 的模式匹配。\n- **2024 - Java 22**：引入了最新的更新，专注于性能、新语言特性和 `JVM` 改进。\n\n![](img/image_rsrc87J.jpg)\n\
  \n# Java 的特性\n\nJava 作为一种编程语言，其卓越之处在于多种关键特性的结合，这些特性使其对于各种类型的应用都是健壮、安全且多功能的。让我们详细研究这些特性。\n\
  \n## 平台独立性\n\nJava 最受关注的特性之一是其平台独立性，通常总结为“编写一次，到处运行”（WORA）。Java 程序被编译成称为 `bytecode`\
  \ 的中间形式，由 Java 虚拟机 (`JVM`) 执行。这意味着同一个 Java 程序无论底层硬件和操作系统如何，可以在配备了 `JVM` 的设备上运行。这种抽象级别消除了对特定平台修改的需求，显著减少了开发和维护工作。\n\
  \n## 面向对象编程\n\nJava 本质是面向对象的，这促进了模块化和组织化的软件开发方法。在面向对象编程 (`OOP`) 中，现实世界的实体被建模为“对象”，它们包含数据（属性）和方法（行为）。Java\
  \ 中的关键 OOP 原则包括封装、继承、多态和抽象。封装确保了数据被隐藏，并且只能通过定义良好的接口访问。继承允许新类继承现有类的属性和行为，从而促进代码复用。多态允许将对象视为其父类的实例而不是其实际类，从而允许动态方法调用。抽象通过对适用于问题领域的类建模来简化复杂系统。\n\
  \n## 健壮性\n\nJava 的健壮性通过多种机制实现，这些机制确保了可靠且无误的运行。其中一种机制是其强大的内存管理，包括自动垃圾收集。该过程会自动释放不再使用的内存，防止内存泄漏和其他相关问题。Java\
  \ 还强调编译时和运行时的强类型检查，这有助于在开发过程中早期捕获错误。此外，Java 提供了广泛的异常处理能力，允许开发者通过 `try-catch` 块和自定义异常类优雅地管理运行时错误。\n\
  \n## 安全\n\n\n\n\n安全性是 Java 中的一个首要考虑的问题，特别是由于其在网络环境中被广泛使用。Java 运行在一个名为 Java 运行时环境（`JRE`）的受控环境中，其中包含一个安全管理器和一组安全策略，这些策略限制了关键系统资源的访问。字节码验证过程确保代码在执行之前符合\
  \ Java 严格的安全和访问规则。Java 还提供了用于加密、安全通信和身份验证的 API，使得构建安全应用程序变得更容易。\n\n![](img/image_rsrc87K.jpg)\n\
  \n## 多线程\nJava 在语言层面支持多线程，允许开发者编写并发执行多个任务的程序。这对于开发响应迅速且高性能的应用程序至关重要。Java 内置线程模型包含了如\
  \ `Thread`、`Runnable` 和 `java.util.concurrent` 包等类和接口，它们为管理线程和并发提供了一个框架。提供了同步机制来防止竞态条件，并确保以线程安全的方式访问共享资源。\n\
  \n## 高性能\n虽然 Java 是一种解释型语言，但现代 JVM 的实现使用了即时编译（`JIT`）[2 来提高性能。`JIT` 编译器在运行时将字节码翻译成原生机器码，并针对特定的硬件和操作系统进行优化。这导致执行速度可以与原生编译语言相媲，有时甚至超过它们。此外，Java\
  \ 的性能还通过高效的垃圾回收 [3 算法和复杂的内存管理技术得到了进一步增强。\n\n## 可移植性\nJava 的可移植性不仅限于其平台无关性。Java 标准库提供了一\
  \ set 在所有 JVM 实现中保持一致的全面 API。这意味着开发者无论平台如何，都可以依赖核心库的一致行为。Java 应用程序的移植性通过使用标准的数据格式和协议得到了进一步支持。\n\
  \n## 分布式计算\nJava 天生为分布式计算设计。它包含一套 API 和技术，促进了网络和分布式应用程序的。例如，Java 的远程方法调用（`RMI`）允许位于不同机器上的对象相互通信并调用对方的方法。Java\
  \ 命名和目录接口（`JNDI`）为各种命名和目录服务提供了统一的接口，更容易定位和访问分布式资源。\n\n## 动态与可扩展\nJava 是一种动态且可扩展的语言，这意味着它可以适应不断变化的环境。`JVM`\
  \ 可以在运行时动态加载类，这对于那些无需重新编译即可整合新功能的应用程序至关重要。Java 还支持反射，允许程序在运行时检查并操作自身的结构和行为。这种动态特性使\
  \ Java 具有高度适应性，适用于广泛的应用。\n\n## 丰富的标准库\nJava 标准库也称为 Java API，非常广泛，涵盖了大量功能。它包含了用于数据结构、网络、数据库访问、图形用户界面等的包。这套丰富的库极地减少了开发时间和精力的，因为开发者可以利用预构建和测试过的组件来完成常见任务。\n\
  \n![](img/image_rsrc87M.jpg)\n\n# 设置 Java 开发环境\n对于任何 Java 新手来说，设置 Java 开发环境都是关键的第一步。本节将引导你完成安装必要的工具并配置系统以开始开发\
  \ Java 应用程序。\n\n![](img/image_rsrc87N.jpg)\n\n### 第 1 ：安装 Java 开发包 (JDK)\nJava 开发包（`JDK`）是\
  \ Java 开发的核心组件。它包含了 Java 运行时环境（`JRE`）、Java 编译器以及各种开发工具。按照以下步骤安装 `JDK`：\n\n1. 下载\
  \ `JDK`：访问 [Oracle JDK 下载页面](https://www.oracle.com/java/technologies/downloads/)\
  \ 下载适用于你操作系统（Windows、macOS 或 Linux）的最新版本 `JDK`。\n\n![](img/image_rsrc87P.jpg)\n\n\
  2. 安装 `JDK`：运行安装程序并按照屏幕上的说明操作。默认安装设置通常足够了。\n\n3. 设置环境变量（可选但建议执行）：\n    * Windows：将\
  \ `JDK` 安装目录添加到 `PATH` 环境变量中。你可以通过 属性属性 -> 高级 -> 环境变量来实现，然后将 `JDK` 路径添加到 `PATH`\
  \ 变量中。\n    * macOS/Linux：通过向你的 shell 启动脚本（例如 `.bash_profile` 或 `.zshrc`）添加行 `export\
  \ PATH=/path/to/jdk/bin:$PATH` 来将 `JDK` 路径添加。\n\n### 第 2 步：验证安装\n在安装 `JDK` 之后，你应该验证它是否已正确安装：\n\
  \n1. 打开终端/命令提示符：打开你系统的终端或命令提示符。\n2. 检查 `JDK` 版本：输入 `java -version` 和 `javac -version`。你应该看到显示已安装的\
  \ `JDK` 版本和 Java 编译器的输出。\n\n### 第 3 步：安装集成开发环境 (IDE)\n`IDE` 是一种为计算机程序员提供软件开发全面设施的软件应用程序。虽然你可以使用简单的文本编辑器编写\
  \ Java 代码，但使用 `IDE` 可以通过代码补全、调试和项目管理等功能显著提高生产力。以下是一些流行的 Java `IDEs`：\n\n1. IntelliJ\
  \ IDEA：来自 JetBrains 的一个强大且功能丰富的 `IDE`。它提供免费的 Community 版和付费的 Ultimate 版。\n\n![](img/image_rsrc87R.jpg)\n\
  \n2. Eclipse：一种广泛使用的开源 `IDE`，高度可定制，并支持广泛的插件。\n3. NetBeans：另一个开源 `IDE`，易于使用并支持 Java\
  \ 及其他语言。\n\n### 第 4 步：配置你的 IDE\n一旦安装了 `IDE`，你需要配置它以与 `JDK` 配合：\n\n1. 设置 `JDK` 路径：大多数\
  \ `IDE` 在初始化时都会提示你指定 `JDK` 路径。确保该路径指向系统上的 `JDK` 安装目录。\n2. 创建新项目：按照 `IDE` 的说明创建一个新的\
  \ Java 项目。这通常涉及指定项目名称、位置和 `JDK` 版本。\n\n当你越来越熟悉 Java 开发时，你可能想要探索额外的工具和库来增强工作流。一些实用工具包括：\n\
  \n* Maven 或 Gradle：用于管理项目依赖和自动化构建过程的构建自动化工具。\n    * [Maven](https://maven.apache.org/)\n\
  \    * [Gradle](https://gradle.org/)\n* Git：管理代码库更改的版本控制系统。\n    * [Git](https://git-scm.com/)\n\
  \n![](img/image_rsrc87S.jpg)\n\n## 编写你的 Java 程序\n编写第一个 Java 程序是你掌握 Java 之旅的激动一步。本节将引导你编写、编译和运行一个简单的\
  \ Java 程序。我们将使用经典的“Hello, World!”示例来说明这一过程。\n\n### 第 1 步：创建 Java 文件\n首先，为你的 Java\
  \ 代码创建一个文件。文件应具有 `.java` 扩展名，且名称与类名匹配。在示例中，我们将文件命名为 `HelloWorld.java`。\n\n### 第\
  \ 2 步：编写 Java 代码\n在你的 `IDE` 或文本编辑器中打开新创建的文件并输入以下代码：\n\n```java\npublic class HelloWorld\
  \ {\n    public static void main(String[] args) {\n        System.out.println(\"\
  Hello, World!\");\n    }\n}\n```\n\n![](img/image_rsrc87T.jpg)\n\n让我们拆解这段代码：\n\n\
  \n\n\n### 1. 类声明\n`public class HelloWorld` 定义了一个名为 `HelloWorld` 的公共类。在 Java 中，每个应用程序都从类定义开始。\n\
  \n### 2. 主方法\n`public static void main(String[] args)` 是任何 Java 程序的入口。`JVM` 调用此方法来启动程序。\n\
  \n### 3. 打印语句\n`System.out.println(\"Hello, World!\")` 是一个向控制台打印“Hello, World!”的语句。`System.out`\
  \ 是标准输出流，而 `println` 是一个打印一行文本的方法。\n\n## 第 3 步：编译 Java 程序\n\n在运行程序之前，你需要对它进行编译。编译将人类可读的\
  \ Java 代码转换为 `JVM` 可以执行的字节码。\n\n1. **打开终端/命令提示符**：导航到 `HelloWorld.java` 文件所在的目录。\n\
  2. **编译程序**：运行以下命令：\n\n```\njavac HelloWorld.java\n```\n\n此命令调用 Java 编译器 (`javac`)\
  \ 并编译 `HelloWorld.java`。如果没有语法错误，该命令将生成一个名为 `HelloWorld.class` 的文件，其中包含字节码。\n\n\
  ## 第 4 步：运行 Java 程序\n\n编译完成后，你可以运行你的程序了：\n\n1. **执行程序**：在终端中输入：\n\n```\njava HelloWorld\n\
  ```\n\n此命令启动 `JVM`，它加载 `HelloWorld.class` 文件并调用 `main` 方法。你应该能看到输出：\n\n```\nHello,\
  \ World!\n```\n\n## 常见问题排排除\n\n- **文件名**：确保文件名与类名匹配，并具有 `.java` 扩展名。\n- **路径问题**：确保终端或命令提示符已导航到包含\
  \ `.java` 文件的目录。\n- **环境变量**：确保 JDK 的 `bin` 目录包含在系统的 `PATH` 环境变量中以便访问 `javac` 和\
  \ `java` 命令。\n\n## 增强程序\n\n为了在这个基础程序的基础上进行，你可以修改打印语句以包含变量、获取用户输入或执行简单的计算。例如，为了打印个性化消息，你可以如下修改代码：\n\
  \n```java\nimport java.util.Scanner;\n\npublic class HelloWorld {\n    public static\
  \ void main(String[] args) {\n        Scanner scanner = new Scanner(System.in);\n\
  \        System.out.print(\"Enter your name: \");\n        String name = scanner.nextLine();\n\
  \        System.out.println(\"Hello, \" + name + \"!\");\n    }\n}\n```\n\n在这个增强版本中，程序会提示用户输入名称，然后打印个性化的问候语。这引入了使用\
  \ `Scanner` 类来获取用户输入。\n\n![](img/image_rsrc87U.jpg)\n\n## 项目：创建一个简单的控制台计算器\n\n创建一个简单的控制台计算器是应用\
  \ Java 编程基础的极佳方法。该项目将编写一个执行基本算术运算的 Java 程序：加、减、乘、除。\n\n### 第 1 步：设置项目\n\n**创建一个新的\
  \ Java 文件**：从创建一个名为 `Calculator.java` 的新文件开始。\n\n### 第 2 步：编写代码\n\n打开文件并编写以下 Java\
  \ 代码：\n\n```java\nimport java.util.Scanner;\n\npublic class Calculator {\n    public\
  \ static void main(String[] args) {\n        Scanner scanner = new Scanner(System.in);\n\
  \        System.out.println(\"Simple Console-Based Calculator\");\n        System.out.println(\"\
  Choose an operation: \");\n        System.out.println(\"1. Addition\");\n      \
  \  System.out.println(\"2. Subtraction\");\n        System.out.println(\"3. Multiplication\"\
  );\n        System.out.println(\"4. Division\");\n        System.out.print(\"Enter\
  \ your choice (1-4): \");\n        int choice = scanner.nextInt();\n        System.out.print(\"\
  Enter the first number: \");\n        double num1 = scanner.nextDouble();\n    \
  \    System.out.print(\"Enter the second number: \");\n        double num2 = scanner.nextDouble();\n\
  \        double result = 0;\n        boolean validOperation = true;\n        switch\
  \ (choice) {\n            case 1:\n                result = num1 + num2;\n     \
  \           break;\n            case 2:\n                result = num1 - num2;\n\
  \                break;\n            case 3:\n                result = num1 * num2;\n\
  \                break;\n            case 4:\n                if (num2 != 0) {\n\
  \                    result = num1 / num2;\n                } else {\n         \
  \           System.out.println(\"Error: Division by zero is not allowed.\");\n \
  \                   validOperation = false;\n                }\n               \
  \ break;\n            default:\n                System.out.println(\"Error: Invalid\
  \ choice.\");\n                validOperation = false;\n                break;\n\
  \        }\n        if (validOperation) {\n            System.out.println(\"The\
  \ result is: \" + result);\n        }\n    }\n}\n```\n\n### 代码解释\n\n1. **导入 Scanner**：`import\
  \ java.util.Scanner;` 用于引入 `Scanner` 类，它有助于从用户获取输入。\n2. **类声明**：`public class Calculator`\
