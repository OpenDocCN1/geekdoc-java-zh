  System.out.println(\"a >= b: \"  + (a >= b)); // false\nSystem.out.println(\"a <=\
  \ b: \"  + (a <= b)); // true\n\n// Logical Operators\nboolean x  =  true;\nboolean\
  \ y  =  false;\nSystem.out.println(\"x && y: \"  + (x && y)); // false\nSystem.out.println(\"\
  x || y: \"  + (x || y)); // true\nSystem.out.println(\"!x: \"  + (!x)); // false\n\
  \n// Assignment Operators\nint c  =  5;\nc +=  10;\nSystem.out.println(\"c += 10:\
  \ \"  + c); // 15\nc -=  5;\nSystem.out.println(\"c -= 5: \"  + c); // 10\nc *=\
