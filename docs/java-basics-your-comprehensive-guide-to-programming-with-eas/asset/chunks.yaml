    ## Project: Create a Simple Console-Based Calculator


    Creating a simple console-based calculator is an excellent way to apply the basics
    of Java programming. This project will involve writing a Java program that performs
    basic arithmetic operations: addition, subtraction, multiplication, and division.


    Step 1: Set Up the Project


    Create a New Java File: Start by creating a new file named Calculator.java.


    Step 2: Write the Code


    Open your file and write the following Java code:


    import  java.util.Scanner;


    public  class  Calculator  {


    public  static  void  main(String[] args)  {


    Scanner  scanner  =  new  Scanner(System.in);


    System.out.println("Simple Console-Based Calculator");


    System.out.println("Choose an operation: ");


    System.out.println("1. Addition");


    System.out.println("2. Subtraction");


    System.out.println("3. Multiplication");


    System.out.println("4. Division");


    System.out.print("Enter your choice (1-4): ");


    int  choice  =  scanner.nextInt();


    System.out.print("Enter the first number: ");


    double  num1  =  scanner.nextDouble();


    System.out.print("Enter the second number: ");


    double  num2  =  scanner.nextDouble();


    double  result  =  0;


    boolean  validOperation  =  true;


    switch (choice) {


    case  1:


    result = num1 + num2;


    break;


    case  2:


    result = num1 - num2;


    break;


    case  3:


    result = num1 * num2;


    break;


    case  4:


    if (num2 !=  0) {


    result = num1 / num2;


    } else {


    System.out.println("Error: Division by zero is not allowed.");


    validOperation =  false;


    }


    break;


    default:


    System.out.println("Error: Invalid choice.");


    validOperation =  false;


    break;


    }


    if (validOperation) {


    System.out.println("The result is: "  + result);


    }


    }


    }


    Explanation of the Code


    1.  Import Scanner: import java.util.Scanner; is used to include the Scanner class,
    which helps in taking input from the user.


    2.  Class Declaration: public class Calculator declares the class named Calculator.


    3.  Main Method: public static void main(String[] args) is the entry point of
    the application.


    4.  Scanner Object: Scanner scanner = new Scanner(System.in); creates a Scanner
    object to read user input.


    5.  User Input for Operation: The program prompts the user to choose an arithmetic
    operation and enter two numbers.


    6.  Switch Case: The program uses a switch-case statement to perform the chosen
    arithmetic operation.


    7.  Validation: The program checks for division by zero and handles invalid choices.


    Step 3: Compile and Run the Program


    1.  Compile the Program: Open the terminal or command prompt, navigate to the
    directory containing Calculator.java, and run:


    javac Calculator.java


    Run the Program: Execute the compiled bytecode with:


    java Calculator


    You should see output prompting you to choose an operation and enter numbers.
    The program will then display the result of the arithmetic operation.


