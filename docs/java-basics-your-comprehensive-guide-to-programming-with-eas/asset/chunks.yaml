    \n## 第 3 步：编译 Java 程序\n\n在运行程序之前，你需要对它进行编译。编译将人类可读的 Java 代码转换为 `JVM` 可以执行的字节码。\n\
    \n1. **打开终端/命令提示符**：导航到 `HelloWorld.java` 文件所在的目录。\n2. **编译程序**：运行以下命令：\n\n```\n\
    javac HelloWorld.java\n```\n\n此命令调用 Java 编译器 (`javac`) 并编译 `HelloWorld.java`。如果没有语法错误，该命令将生成一个名为\
    \ `HelloWorld.class` 的文件，其中包含字节码。\n\n## 第 4 步：运行 Java 程序\n\n编译完成后，你可以运行你的程序了：\n\
    \n1. **执行程序**：在终端中输入：\n\n```\njava HelloWorld\n```\n\n此命令启动 `JVM`，它加载 `HelloWorld.class`\
    \ 文件并调用 `main` 方法。你应该能看到输出：\n\n```\nHello, World!\n```\n\n## 常见问题排排除\n\n- **文件名**：确保文件名与类名匹配，并具有\
