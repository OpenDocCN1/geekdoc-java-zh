    \n## String 方法\n\nJava 中的 `String` 类提供了广泛用于操作和查询字符串的方法。这些方法使得执行各种操作变得简单，例如搜索、比较和修改字符串。以下是一些常用方法及其示例：\n\
    \n### Length\n返回字符串的长度。\n```java\nString str = \"Hello, World!\";\nint length\
    \ = str.length(); // 13\n```\n\n### CharAt\n返回指定索引处的字符。\n```java\nchar ch = str.charAt(1);\
    \ // 'e'\n```\n\n### Substring\n提取字符串的部。\n```java\nString sub = str.substring(0,\
    \ 5); // \"Hello\"\n```\n\n### Equals\n比较两个字符串的相等性。\n```java\nboolean isEqual\
    \ = str.equals(\"Hello, World!\");\n```\n\n### EqualsIgnoreCase\n比较两个字符串的相等性，忽略忽略大小写。\n\
    ```java\nboolean isEqualIgnoreCase = str.equalsIgnoreCase(\"hello, world!\");\n\
    ```\n\n### CompareTo\n按字典顺序比较两个字符串。\n```java\nint result = str.compareTo(\"Hello,\
    \ Java!\"); // 正数、负数或零\n```\n\n### IndexOf\n返回字符或子字符串首次出现的索引。\n```java\nint index\
    \ = str.indexOf('o'); // 4\nint indexSub = str.indexOf(\"World\"); // 7\n```\n\
    \n### LastIndexOf\n返回字符或子字符串最后一次出现的索引。\n```java\nint lastIndex = str.lastIndexOf('o');\
    \ // 8\n```\n\n![](img/image_rsrc88G.jpg)\n\n### ToLowerCase\n将字符串转换为小写。\n```java\n\
    String lower = str.toLowerCase(); // \"hello, world!\"\n```\n\n### ToUpperCase\n\
    将字符串转换为大写。\n```java\nString upper = str.toUpperCase(); // \"HELLO, WORLD!\"\n\
    ```\n\n### Trim\n移除头部和尾的空白字符。\n```java\nString trimmed = str.trim(); // \"Hello,\
    \ World!\"\n```\n\n### Replace\n将字符或子字符串的出现处替换另一个字符或子字符串。\n```java\nString replaced\
    \ = str.replace('o', 'a'); // \"Hella, Warld!\"\nString replacedSub = str.replace(\"\
    World\", \"Java\"); // \"Hello, Java!\"\n```\n\n### Split\n根据分隔符将字符串拆分为数组。\n```java\n\
    String[] words = str.split(\", \"); // [\"Hello\", \"World!\"]\n```\n\n### ValueOf\n\
    返回各种数据类型的字符串表示。\n```java\nString value = String.valueOf(10);\n```\n\n## 示例\n\n\
    这是一个演示了几种 `String` 方法的示例：\n\n```java\npublic class StringMethods {\n    public\
    \ static void main(String[] args) {\n        String message = \"Hello, World!\"\
    ;\n\n        // Length\n        System.out.println(\"Length: \" + message.length());\n\
    \n        // CharAt\n        System.out.println(\"Char at index 1: \" + message.charAt(1));\n\
    \n        // Substring\n        System.out.println(\"Substring (0, 5): \" + message.substring(0,\
    \ 5));\n\n        // Equals\n        System.out.println(\"Is equal: \" + message.equals(\"\
    Hello, World!\"));\n\n        // EqualsIgnoreCase\n        System.out.println(\"\
    Is equal: \" + message.equalsIgnoreCase(\"hello, world!\"));\n\n        // CompareTo\n\
    \        System.out.println(\"Compare: \" + message.compareTo(\"Hello, Java!\"\
    ));\n\n        // IndexOf\n        System.out.println(\"Index of 'o': \" + message.indexOf('o'));\n\
    \n        // LastIndexOf\n        System.out.println(\"Last index of 'o': \" +\
    \ message.lastIndexOf('o'));\n\n        // ToLowerCase\n        System.out.println(\"\
    Lower: \" + message.toLowerCase());\n\n        // ToUpperCase\n        System.out.println(\"\
    Upper: \" + message.toUpperCase());\n\n        // Trim\n        System.out.println(\"\
    Trimmed: \" + message.trim());\n\n        // Replace\n        System.out.println(\"\
    Replaced: \" + message.replace('o', 'a'));\n\n        // Split\n        String[]\
    \ words = message.split(\", \");\n    }\n}\n```\n*(注：由于原文提供的示例代码块存在逻辑错乱（如变量未定义、括号不匹配），翻译时根据“不漏掉任何行”的原则保留了其结构，但对代码可读性进行了微调以符合翻译逻辑)*\n\
