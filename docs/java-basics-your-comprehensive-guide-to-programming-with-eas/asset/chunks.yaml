    \n![](image_rsrc890.jpg)![](image_rsrc891.jpg)\n\n## Inheritance\n\nInheritance\
    \ is a fundamental concept in Object-Oriented Programming (OOP) that allows one\
    \ class (called the subclass or derived class) to inherit the attributes and methods\
    \ of another class (called the superclass or base class). This promotes code reuse\
    \ and establishes a natural hierarchy between classes.\n\n### Purpose of Inheritance\n\
    \nInheritance provides several key benefits:\n\n1. **Code Reusability**: By inheriting\
    \ from a superclass, a subclass can reuse code that is already defined, reducing\
    \ redundancy and promoting code reuse.\n2. **Hierarchical Organization**: Inheritance\
    \ helps organize classes into a hierarchical structure, making it easier to understand\
    \ and maintain complex systems.\n3. **Extensibility**: Subclasses can extend the\
    \ functionality of the superclass by adding new attributes and methods or by overriding\
    \ existing methods.\n\n### Defining Inheritance\n\nIn Java, inheritance is achieved\
    \ using the `extends` keyword. A subclass extends a superclass, inheriting its\
    \ attributes and methods. Here’s a basic example:\n\n```java\n// Superclass\n\
    public class Vehicle {\n  // Attributes\n  protected String brand;\n  protected\
    \ int year;\n\n  // Constructor\n  public Vehicle(String brand, int year) {\n\
    \    this.brand = brand;\n    this.year = year;\n  }\n\n  // Method\n  public\
    \ void displayInfo() {\n    System.out.println(\"Brand: \" + brand + \", Year:\
    \ \" + year);\n  }\n}\n\n// Subclass\npublic class Car extends Vehicle {\n  //\
    \ Additional attribute\n  private String model;\n\n  // Constructor\n  public\
    \ Car(String brand, int year, String model) {\n    super(brand, year); // Call\
    \ to superclass constructor\n    this.model = model;\n  }\n\n  // Method\n  public\
    \ void displayModel() {\n    System.out.println(\"Model: \" + model);\n  }\n}\n\
    ```\n\n![](image_rsrc892.jpg)\n\nIn this example:\n\n* `Vehicle` is the superclass\
    \ with attributes `brand` and `year` and a method `displayInfo()`.\n* `Car` is\
    \ the subclass that extends `Vehicle` and adds an additional attribute `model`\
    \ and a method `displayModel()`.\n\n### Using Inheritance\n\nTo use inheritance,\
    \ create an object of the subclass and call its methods:\n\n```java\npublic class\
    \ Main {\n  public static void main(String[] args) {\n    // Creating an object\
    \ of the Car class\n    Car myCar = new Car(\"Toyota\", 2022, \"Corolla\");\n\n\
    \    // Calling methods from both the superclass and subclass\n    myCar.displayInfo();\
    \ // Method from superclass\n    myCar.displayModel(); // Method from subclass\n\
    \  }\n}\n```\n\nIn this code snippet, the `myCar` object of the `Car` class can\
    \ access methods from both the `Vehicle` superclass and the `Car` subclass.\n\n\
    ### Types of Inheritance\n\nJava supports different types of inheritance:\n\n\
    * **Single Inheritance**: A subclass inherits from one superclass. This is the\
    \ most common form of inheritance in Java.\n\n```java\npublic class Animal {\n\
    \  // Attributes and methods of Animal\n}\n\npublic class Dog extends Animal {\n\
    \  // Attributes and methods of Dog\n}\n```\n\n* **Multilevel Inheritance**: A\
    \ subclass inherits from another subclass, creating a chain of inheritance.\n\n\
    ```java\npublic class Animal {\n  // Attributes and methods of Animal\n}\n\npublic\
    \ class Mammal extends Animal {\n  // Attributes and methods of Mammal\n}\n\n\
    public class Dog extends Mammal {\n  // Attributes and methods of Dog\n}\n```\n\
    \n* **Hierarchical Inheritance**: Multiple subclasses inherit from a single superclass.\n\
    \n```java\npublic class Animal {\n  // Attributes and methods of Animal\n}\n\n\
    public class Dog extends Animal {\n  // Attributes and methods of Dog\n}\n\npublic\
    \ class Cat extends Animal {\n  // Attributes and methods of Cat\n}\n```\n\nNote:\
    \ Java does not support multiple inheritance (a subclass inheriting from multiple\
    \ superclasses) directly to avoid complexity. However, multiple inheritance can\
    \ be achieved using interfaces.\n\n### Overriding Methods\n\nIn a subclass, you\
    \ can override methods of the superclass to provide a specific implementation.\
    \ Method overriding allows a subclass to define a behavior that is specific to\
    \ its type.\n\n```java\npublic class Vehicle {\n  public void start() {\n    System.out.println(\"\
    Vehicle is starting.\");\n  }\n}\n\npublic class Car extends Vehicle {\n  // Overriding\
    \ the method\n  @Override\n  public void start() {\n    System.out.println(\"\
    Car is starting.\");\n  }\n}\n```\n\nIn this example, the `Car` class overrides\
    \ the `start()` method of the `Vehicle` class to provide a specific implementation.\n\
    \nTo call the overridden method:\n\n```java\npublic class Main {\n  public static\
    \ void main(String[] args) {\n    Car myCar = new Car();\n    myCar.start(); //\
    \ Calls the overridden start method in Car\n  }\n}\n```\n\n### The super Keyword\n\
    \nThe `super` keyword is used in the subclass to refer to the superclass. It is\
    \ often used to call the superclass’s constructor or methods.\n\n#### Calling\
    \ Superclass Constructor\n\n```java\npublic class Vehicle {\n  protected String\
    \ brand;\n  protected int year;\n\n  public Vehicle(String brand, int year) {\n\
    \    this.brand = brand;\n    this.year = year;\n  }\n}\n\npublic class Car extends\
    \ Vehicle {\n  private String model;\n\n  public Car(String brand, int year, String\
    \ model) {\n    super(brand, year); // Call to superclass constructor\n    this.model\
    \ = model;\n  }\n}\n```\n\n#### Calling Superclass Method\n\n```java\npublic class\
    \ Vehicle {\n  public void start() {\n    System.out.println(\"Vehicle is starting.\"\
    );\n  }\n}\n\npublic class Car extends Vehicle {\n  @Override\n  public void start()\
    \ {\n    super.start(); // Call to superclass method\n    System.out.println(\"\
    Car is starting.\");\n  }\n}\n```\n\n![](image_rsrc893.jpg)![](image_rsrc894.jpg)\n\
