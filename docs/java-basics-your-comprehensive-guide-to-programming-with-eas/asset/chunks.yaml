    2. **关系运算符**：比较两个整数并打印各种关系操作的结果。\n3. **逻辑运算符**：展示了逻辑与（AND）、或（OR）和非（NOT）操作的结果。\n\
    4. **赋值运算符**：说明了如何使用赋值运算符来修改变量的值。\n5. **一元运算符**：演示了增减运算符的使用，展示了后增/后减以及前增/前减。\n\
    \n![](img/image_rsrc880.jpg)![](img/image_rsrc881.jpg)\n\n## 控制流语句\n\nJava 中的控制流语句允许你规定语句执行的顺序，从而在程序中实现复杂的动态行为。这些包括决策语句、循环语句和分支语句。\n\
    \n### 决策语句\n\n决策语句允许你根据特定条件执行特定的代码块。Java 中的主要决策语句有：\n\n#### **if 语句**：如果条件求值为真，则执行该代码块。\n\
    \n```java\nint number =  10;\nif (number >  5) {\n    System.out.println(\"The\
    \ number is greater than 5\");\n}\n```\n\n#### **if-else 语句**：如果条件为真，执行一个代码块；如果条件为假，则执行另一个代码块。\n\
    \n```java\nint number =  10;\nif (number >  5) {\n    System.out.println(\"The\
    \ number is greater than 5\");\n} else {\n    System.out.println(\"The number\
    \ is not greater than 5\");\n}\n```\n\n#### **if-else-if 阶梯**：顺序检查多个条件。\n\n```java\n\
    int number =  10;\nif (number >  10) {\n    System.out.println(\"The number is\
    \ greater than 10\");\n} else if (number ==  10) {\n    System.out.println(\"\
    The number is 10\");\n} else {\n    System.out.println(\"The number is less than\
    \ 10\");\n}\n```\n\n![](img/image_rsrc882.jpg)\n\n#### **switch 语句**：从多个备选项中选择一个代码块执行。\n\
    \n```java\nint day =  3;\nswitch (day) {\n    case  1:\n        System.out.println(\"\
    Monday\");\n        break;\n    case  2:\n        System.out.println(\"Tuesday\"\
    );\n        break;\n    case  3:\n        System.out.println(\"Wednesday\");\n\
    \        break;\n    default:\n        System.out.println(\"Invalid day\");\n\
    }\n```\n\n### 循环语句\n\n循环语句允许你根据条件重复执行代码块。Java 中的主要循环语句有：\n\n#### **for 循环**：按指定的次数重复代码块。\n\
    \n```java\nfor (int i =  0; i <  5; i++) {\n    System.out.println(\"i = \"  +\
    \ i);\n}\n```\n\n#### **while 循环**：只要条件为真，就重复执行代码块。\n\n```java\nint i =  0;\n\
    while (i <  5) {\n    System.out.println(\"i = \"  + i);\n    i++;\n}\n```\n\n\
    #### **do-while 循环**：与 while 循环类似，但在测试条件之前至少执行一次代码块。\n\n```java\nint i =  0;\n\
    do {\n    System.out.println(\"i = \"  + i);\n    i++;\n} while (i <  5);\n```\n\
    \n### 分支语句\n\n分支语句通过将控制转移到代码的其他部分来改变执行流。Java 中的主要分支语句有：\n\n#### **break 语句**：提前退出循环或\
    \ switch 语句。\n\n```java\nfor (int i =  0; i <  10; i++) {\n    if (i ==  5) {\n\
    \        break;\n    }\n    System.out.println(\"i = \"  + i);\n}\n```\n\n####\
    \ **continue 语句**：跳过循环的当前迭代并进入下一次迭代。\n\n```java\nfor (int i =  0; i <  10; i++)\
    \ {\n    if (i %  2  ==  0) {\n        continue;\n    }\n    System.out.println(\"\
    i = \"  + i);\n}\n```\n\n#### **return 语句**：退出当前方法并可选地返回一个值。\n\n```java\npublic\
    \ int  add(int a,  int b) {\n    return a + b;\n}\n```\n\n## 示例\n\n让我们各种控制流语句组合成示例中，用于检查一个数字是否为质数：\n\
    \n```java\npublic class ControlFlowExample {\n    public static void main(String[]\
    \ args) {\n        int number  =  29;\n        boolean isPrime  =  true;\n   \
    \     if (number <=  1) {\n            isPrime =  false;\n        } else {\n \
    \           for (int  i  =  2; i <= number /  2; i++) {\n                if (number\
    \ % i ==  0) {\n                    isPrime =  false;\n                    break;\n\
    \                }\n            }\n        }\n        if (isPrime) {\n       \
    \     System.out.println(number + \" is a prime number\");\n        } else {\n\
    \            System.out.println(number + \" is not a prime number\");\n      \
    \  }\n    }\n}\n```\n\n### 代码解析\n\n1. **main 方法**：程序的入口点，执行在此开始。\n2. **变量初始化**：`number`\
    \ 是要检查的值，`isPrime` 是初始为真的布尔标志。\n3. **if 语句**：检查数字是否小于等于 1。如果是，则将 `isPrime` 设置为假。\n\
    4. **for 循环**：从 2 直到数字的一半检查因子。如果找到因子，则将 `isPrime` 设置为假并退出循环。\n5. **最终 if 语句**：根据\
    \ `isPrime` 的值打印该数字是否为质数。\n\n![](img/image_rsrc883.jpg)\n"
