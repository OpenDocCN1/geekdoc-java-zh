    \n# Map 接口\n\nJava 集合框架中的 `Map` 接口表示键值对的集合，其中每个键都映射到单个值。Map 不允许重复的键，每个键最多可以映射到一个值。对于那些需要将值与键关联的场景（例如字典），此接口至关重要。\n\
    \n### 常见实现类\n\n- **HashMap**: 使用哈希表实现 `Map` 接口。假设哈希函数能够适当散列元素，它为基本操作（`get` 和 `put`）提供了常数时间性能。它不维护键的任何顺序。\n\
    ```java\nMap<String, Integer> hashMap = new HashMap<>();\nhashMap.put(\"Apple\"\
    , 1);\nhashMap.put(\"Banana\", 2);\nhashMap.put(\"Cherry\", 3);\n```\n\n- **LinkedHashMap**:\
    \ 扩展了 `HashMap`，通过一个贯穿条目的双链表来维护插入顺序或访问顺序。它适用于需要预测迭代顺序的应用程序。\n\n```java\nMap<String,\
    \ Integer> linkedHashMap = new LinkedHashMap<>();\nlinkedHashMap.put(\"Dog\",\
    \ 1);\nlinkedHashMap.put(\"Cat\", 2);\nlinkedHashMap.put(\"Bird\", 3);\n```\n\n\
    - **TreeMap**: 使用红黑树实现 `Map` 接口，根据自然的自然顺序或指定的比较器对键进行排序。它保证 map 将按键的升序排列。\n\n```java\n\
    Map<String, Integer> treeMap = new TreeMap<>();\ntreeMap.put(\"Red\", 1);\ntreeMap.put(\"\
    Green\", 2);\ntreeMap.put(\"Blue\", 3);\n```\n\n![](img/image_rsrc8AB.jpg)\n\n\
    ### 关键方法\n\n- `put(K key, V value)`: 将指定的值与 map 中的指定键关联。\n```java\nmap.put(\"\
    Key\", \"Value\");\n```\n\n- `get(Object key)`: 返回指定键映射的值，如果此 map 不包含该键的映射，则返回\
    \ `null`。\n```java\nString value = map.get(\"Key\");\n```\n\n- `remove(Object\
    \ key)`: 如果 map 中存在该键，则移除该键的映射。\n```java\nmap.remove(\"Key\");\n```\n\n- `containsKey(Object\
    \ key)`: 如果 map 包含指定键的映射，则返回 `true`。\n```java\nboolean hasKey = map.containsKey(\"\
    Key\");\n```\n\n- `containsValue(Object value)`: 如果 map 将一个或多个键映射到指定值，则返回 `true`。\n\
    ```java\nboolean hasValue = map.containsValue(\"Value\");\n```\n\n- `keySet()`:\
    \ 返回 map 中包含的键的 `Set` 视图。\n```java\nSet<String> keys = map.keySet();\n```\n\n\
    - `values()`: 返回 map 中包含的值的 `Collection` 视图。\n```java\nCollection<Integer> values\
    \ = map.values();\n```\n\n- `entrySet()`: 返回 map 中包含的映射的 `Set` 视图。\n```java\n\
    Set<Map.Entry<String, Integer>> entries = map.entrySet();\n```\n\n### 示例\n\n这里有一个演示\
    \ `Map` 接口使用的示例：\n\n```java\nimport java.util.*;\n\npublic class MapExample {\n\
    \    public static void main(String[] args) {\n        // 使用 HashMap 创建 map\n\
    \        Map<String, Integer> fruits = new HashMap<>();\n        fruits.put(\"\
    Apple\", 10);\n        fruits.put(\"Banana\", 20);\n        fruits.put(\"Cherry\"\
    , 30);\n\n        // 访问元素\n        System.out.println(\"Apple count: \" + fruits.get(\"\
    Apple\"));\n\n        // 修改元素\n        fruits.put(\"Banana\", 25);\n        System.out.println(\"\
    Updated Banana count: \" + fruits.get(\"Banana\"));\n\n        // 移除元素\n     \
    \   fruits.remove(\"Cherry\");\n        System.out.println(\"After removal: \"\
    \ + fruits);\n\n        // 检查键\n        if (fruits.containsKey(\"Apple\")) {\n\
    \            System.out.println(\"Apple is present in the map.\");\n        }\n\
    \n        // 遍历 map\n        for (Map.Entry<String, Integer> entry : fruits.entrySet())\
    \ {\n            System.out.println(entry.getKey() + \": \" + entry.getValue());\n\
    \        }\n    }\n}\n```\n\n![](img/image_rsrc8AC.jpg)!(image_rsrc8AD.jpg)\n\n\
    # 遍历集合\n\n在 Java 中遍历集合是一项基础任务，允许你访问并操作集合中的每个元素。遍历集合有多种方法，每种方法适用于不同的用例和集合类型。让我们探索最常用的方法。\n\
    \n### 使用 for-each 循环\n\n在 Java 5 中引入的 `for-each` 循环是遍历集合的一种简洁且易读的方式。它适用于不需要修改迭代顺序的情况。\n\
    \n```java\nfor (String fruit : fruits) {\n    System.out.println(fruit);\n}\n\
    ```\n\n### 使用 Iterator\n\n`Iterator` 接口提供了遍历集合的方法，特别是当你需要在迭代过程中删除元素时。\n\n```java\n\
    Iterator<String> iterator = fruits.iterator();\nwhile (iterator.hasNext()) {\n\
    \    String fruit = iterator.next();\n    System.out.println(fruit);\n}\n```\n\
    \n### 使用 ListIterator\n\n`ListIterator` 是专门为列表设计的迭代器，允许双向遍历。\n\n```java\nListIterator<String>\
    \ listIterator = fruits.listIterator();\nwhile (listIterator.hasNext()) {\n  \
    \  String fruit = listIterator.next();\n    if (\"Banana\".equals(fruit)) {\n\
    \        iterator.remove(); // 安全移除\n    }\n}\n```\n\n### 使用 Streams\n\nJava 8\
    \ 引入了 `Stream` API，提供了一种函数式的处理方式。\n\n```java\nfruits.stream()\n    .filter(fruit\
    \ -> fruit.startsWith(\"A\"))\n    .forEach(System.out::println);\n```\n\n###\
    \ 使用 forEach 方法\n\n`forEach` 方法引入自 Java 8，允许使用 Lambda 表达式进行迭代，使代码更加简洁。\n\n```java\n\
    fruits.forEach(fruit -> System.out.println(fruit));\n```\n\n### 示例\n\n这是一个演示各种遍历集合方式的综合示例：\n\
    \n```java\nimport java.util.*;\nimport java.util.stream.*;\n\npublic class CollectionIterationExample\
    \ {\n    public static void main(String[] args) {\n        List<String> fruits\
    \ = new ArrayList<>(Arrays.asList(\"Apple\", \"Banana\", \"Cherry\"));\n\n   \
    \     // 使用 for-each 循环\n        for (String fruit : fruits) {\n            System.out.println(\"\
    For-each loop: \" + fruit);\n        }\n\n        // 使用 Iterator\n        Iterator<String>\
    \ iterator = fruits.iterator();\n        while (iterator.hasNext()) {\n      \
    \      String fruit = iterator.next();\n            System.out.println(\"Iterator:\
    \ \" + fruit);\n        }\n\n        // 使用 ListIterator\n        ListIterator<String>\
    \ listIterator = fruits.listIterator();\n        while (listIterator.hasNext())\
    \ {\n            String fruit = listIterator.next();\n            if (\"Banana\"\
    .equals(fruit)) {\n                listIterator.set(\"Blueberry\"); // 修改当前元素\n\
    \            }\n        }\n\n        // 使用 Streams\n        fruits.stream()\n\
    \            .filter(fruit -> fruit.startsWith(\"A\"))\n            .forEach(System.out::println);\n\
    \n        // 使用 forEach 方法\n        fruits.forEach(fruit -> System.out.println(\"\
    forEach method: \" + fruit));\n    }\n}\n```\n\n![](img/image_rsrc8AE.jpg)!(image_rsrc8AF.jpg)\n\
    \n# 项目：实现联系人管理系统\n\n在这个项目中，我们将使用 Java 集合框架创建一个简单的联系人管理系统。该系统允许用户添加、删除、更新和搜索联系人。每个联系人都有姓名、电话号码和电子邮件。我们将使用\
    \ `HashMap` 来存储联系人，以联系人名为键，自定义的 `Contact` 对象为值。\n\n### 实施步骤\n\n1. **定义 Contact\
    \ 类**：创建一个表示联系人的类。\n2. **创建联系人管理类**：实现添加、删除、更新和搜索联系人的方法。\n\n"
