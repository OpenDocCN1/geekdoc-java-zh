    \ of the draw() method. The Main class demonstrates polymorphism by using a single\
    \ loop to call the draw() method on different types of Shape objects.\n\nAdvantages\
    \ of Polymorphism\n\n1.  Code Reusability: Polymorphism allows you to use the\
    \ same method or interface to work with different types of objects, promoting\
    \ code reuse.\n\n2.  Flexibility: Polymorphism makes it easy to add new classes\
    \ that implement the same interface or extend the same superclass without modifying\
    \ existing code.\n\n3.  Maintainability: Polymorphism reduces the complexity of\
    \ the code, making it easier to understand and maintain.\n\n4.  Extensibility:\
    \ You can extend your codebase by adding new subclasses or implementing new interfaces,\
    \ without affecting the existing functionality.\n\n![](image_rsrc896.jpg)![](image_rsrc897.jpg)\n\
    \n## Encapsulation\n\nEncapsulation is one of the four fundamental principles\
    \ of Object-Oriented Programming (OOP), alongside inheritance, polymorphism, and\
    \ abstraction. It involves bundling the data (attributes) and the methods (functions)\
    \ that operate on the data into a single unit called a class. Encapsulation restricts\
    \ direct access to some of an object’s components, which can prevent the accidental\
    \ modification of data and help maintain the integrity and security of the data.\n\
    \nKey Concepts of Encapsulation\n\n1.  Data Hiding: Encapsulation hides the internal\
    \ state of the object and only exposes a controlled interface. This means that\
    \ the internal representation of an object is hidden from the outside world, only\
    \ accessible through public methods.\n\n2.  Access Modifiers: Java provides four\
    \ access modifiers that determine the visibility of a class's members (attributes\
    \ and methods):\n\n    *   private: The member is accessible only within the same\
    \ class.\n\n    *   default (no modifier): The member is accessible only within\
    \ classes in the same package.\n\n    *   protected: The member is accessible\
    \ within the same package and by subclasses.\n\n    *   public: The member is\
    \ accessible from any other class.\n\nBenefits of Encapsulation\n\n❖ Improved\
    \ Maintainability: Encapsulation allows changes to the implementation of a class\
    \ without affecting other parts of the program. This makes the code easier to\
    \ maintain and update.\n\n❖ Enhanced Security: By restricting access to the internal\
    \ state of an object, encapsulation helps protect the data from unintended modifications\
    \ and ensures that only valid data is set.\n\n❖ Modular Design: Encapsulation\
    \ promotes modularity by organizing the code into discrete units with well-defined\
    \ interfaces, making the system easier to understand and manage.\n\n![](image_rsrc898.jpg)\n\
    \nImplementing Encapsulation\n\nTo implement encapsulation in Java, you typically\
    \ make the attributes of a class private and provide public getter and setter\
    \ methods to access and modify the attributes. This approach ensures that any\
    \ access to the attributes is controlled and validated if necessary.\n\nHere’s\
    \ a simple example of encapsulation in Java:\n\npublic  class  Person  {\n\n//\
    \ Private attributes\n\nprivate  String name;\n\nprivate  int age;\n\n// Constructor\n\
    \npublic  Person(String  name, int  age)  {\n\nthis.name  = name;\n\nthis.age\
    \  = age;\n\n}\n\n// Public getter method for name\n\npublic  String  getName()\
    \  {\n\nreturn name;\n\n}\n\n// Public setter method for name\n\npublic  void\
    \  setName(String  name)  {\n\nthis.name  = name;\n\n}\n\n// Public getter method\
    \ for age\n\npublic  int  getAge()  {\n\nreturn age;\n\n}"
