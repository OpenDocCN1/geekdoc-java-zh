    \ !=  null) {\n\nSystem.out.println(line);\n\n}\n\n} finally {\n\nif (reader !=\
    \  null) {\n\nreader.close();\n\n}\n\n}\n\n}\n\n}\n\nIn this example:\n\n*   The\
