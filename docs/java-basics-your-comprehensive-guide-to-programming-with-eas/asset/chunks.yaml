    ## Iterating through Collections


    Iterating through collections in Java is a fundamental task that allows you to
    access and manipulate each element in a collection. There are several ways to
    iterate through collections, each suited for different use cases and collection
    types. Let''s explore the most common methods.


    Using for-each Loop


    The for-each loop, introduced in Java 5, is a concise and readable way to iterate
    over collections. It''s suitable for when you don''t need to modify the collection
    during iteration.


    List<String> fruits =  Arrays.asList("Apple", "Banana", "Cherry");


    for (String fruit : fruits) {


    System.out.println(fruit);


    }


    Using Iterator


    The Iterator interface provides methods to traverse a collection and remove elements
    safely. It''s more flexible than the for-each loop, especially when you need to
    remove elements during iteration.


    List<String> fruits =  new  ArrayList<>(Arrays.asList("Apple", "Banana", "Cherry"));


    Iterator<String> iterator =  fruits.iterator();


    while (iterator.hasNext()) {


    String fruit =  iterator.next();


    if ("Banana".equals(fruit)) {


    iterator.remove();  // Safe removal


    }


    System.out.println(fruit);


    }


    Using ListIterator


    ListIterator is a bidirectional iterator for lists, allowing traversal in both
    directions and modification of elements during iteration.


    List<String> fruits =  new  ArrayList<>(Arrays.asList("Apple", "Banana", "Cherry"));


    ListIterator<String> listIterator =  fruits.listIterator();


    while (listIterator.hasNext()) {


    String fruit =  listIterator.next();


    if ("Banana".equals(fruit)) {


    listIterator.set("Blueberry");  // Modify the current element


    }


    System.out.println(fruit);


    }


    Using Streams


    Java 8 introduced the Stream API, providing a functional approach to iterate and
    perform operations on collections. Streams are powerful for complex operations,
    such as filtering and mapping.


    List<String> fruits =  Arrays.asList("Apple", "Banana", "Cherry");


    fruits.stream()


    .filter(fruit ->  fruit.startsWith("A"))


    .forEach(System.out::println);  // Output: Apple


    Using forEach Method


    The forEach method, introduced in Java 8, allows iteration using lambda expressions,
    making the code concise and expressive.


    List<String> fruits =  Arrays.asList("Apple", "Banana", "Cherry");


    fruits.forEach(fruit ->  System.out.println(fruit));


    Example


    Here''s a comprehensive example that demonstrates various ways to iterate through
    a collection:


    import  java.util.*;


    import  java.util.stream.*;


    public  class  CollectionIterationExample  {


    public  static  void  main(String[] args)  {


    List<String> fruits  =  new  ArrayList<>(Arrays.asList("Apple", "Banana", "Cherry"));


    // Using for-each loop


    for (String  fruit  : fruits) {


    System.out.println("For-each loop: "  + fruit);


    }


    // Using Iterator


    Iterator<String> iterator  =  fruits.iterator();


    while (iterator.hasNext()) {


    String  fruit  =  iterator.next();


    System.out.println("Iterator: "  + fruit);


    }


    // Using ListIterator


    ListIterator<String> listIterator  =  fruits.listIterator();


    while (listIterator.hasNext()) {


    String  fruit  =  listIterator.next();


    System.out.println("ListIterator: "  + fruit);


    }


    // Using Streams


    fruits.stream().forEach(fruit ->  System.out.println("Stream: "  + fruit));


    // Using forEach method


    fruits.forEach(fruit ->  System.out.println("forEach method: "  + fruit));


    }


    }


