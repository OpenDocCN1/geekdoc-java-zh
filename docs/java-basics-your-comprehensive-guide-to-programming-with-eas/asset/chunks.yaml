    ## Custom Exceptions


    Sometimes, the standard exceptions provided by Java are not sufficient to describe
    specific error conditions in your application. In such cases, you can create your
    own custom exceptions. Custom exceptions allow you to provide more meaningful
    error messages and handle specific error conditions in a more precise manner.


    Creating custom exceptions involves extending the `Exception` class or one of
    its subclasses. This allows you to define exceptions that are tailored to the
    particular needs of your application.


    ### Why Use Custom Exceptions?


    1. **Enhanced Readability**: Custom exceptions make your code more readable by
    providing clear and specific error messages that describe the problem accurately.

    2. **Better Error Handling**: They allow you to handle specific error conditions
    more precisely, improving the robustness of your application.

    3. **Code Reusability**: Custom exceptions can encapsulate common error handling
    logic, promoting code reuse and reducing redundancy.


    ### Creating a Custom Exception


    To create a custom exception, you typically extend the `Exception` class or one
    of its subclasses. Here’s an example of a custom exception:


    ```java

    public class InvalidAgeException extends Exception {

    public InvalidAgeException(String message) {

    super(message);

    }

    }

    ```


    In this example:

    * The `InvalidAgeException` class extends the `Exception` class.

    * A constructor is provided to accept an error message, which is passed to the
    superclass.


    ### Using Custom Exceptions


    Here’s how you can use `InvalidAgeException` in a method to validate the age of
    a user:


    ```java

    public class User {

    private String name;

    private int age;

    public User(String name, int age) throws InvalidAgeException {

    if (age < 0 || age > 120) {

    throw new InvalidAgeException("Age must be between 0 and 120.");

    }

    this.name = name;

    this.age = age;

    }

    public String getName() {

    return name;

    }

    public int getAge() {

    return age;

    }

    public static void main(String[] args) {

    try {

    User user = new User("Alice", -5);

    } catch (InvalidAgeException e) {

    System.out.println("Error: " + e.getMessage());

    }

    }

    }

    ```


    In this example:

    * The `User` constructor validates the `age`.

    * If the age is invalid, it throws an `InvalidAgeException` with a descriptive
    message.

    * The `main` method catches this exception and prints the message.


    ### Custom Exception with Additional Attributes


    You can also add additional attributes to your custom exceptions to provide more
    context. Here’s an example:


    ```java

    public class InsufficientFundsException extends Exception {

    private double amount;

    public InsufficientFundsException(String message, double amount) {

    super(message);

    this.amount = amount;

    }

    public double getAmount() {

    return amount;

    }

    }

    ```


    In this example:

    * The `InsufficientFundsException` class includes an additional `amount` attribute.

    * A constructor initializes the error message and the amount.


    Here’s how you can use this custom exception:


    ```java

    public class BankAccount {

    private double balance;

    public BankAccount(double balance) {

    this.balance = balance;

    }

    public void withdraw(double amount) throws InsufficientFundsException {

    if (amount > balance) {

    throw new InsufficientFundsException("Insufficient funds for withdrawal.", amount);

    }

    balance -= amount;

    }

    public double getBalance() {

    return balance;

    }

    public static void main(String[] args) {

    BankAccount account = new BankAccount(500.0);

    try {

    account.withdraw(600.0);

    } catch (InsufficientFundsException e) {

    System.out.println("Error: " + e.getMessage() + " Amount: " + e.getAmount());

    }

    }

    }

    ```


    In this example:

    * The `BankAccount` class has a `withdraw` method that throws an `InsufficientFundsException`
    if the withdrawal amount exceeds the balance.

    * The `main` method catches this exception and prints the error message along
    with the amount that caused the exception.

