    ## Operators in Java


    Operators in Java are special symbols that perform operations on variables and
    values. They are essential in manipulating data and performing computations. Java
    supports several types of operators, including arithmetic, relational, logical,
    assignment, and more. Let''s delve into these categories and see how they are
    used.


    Arithmetic Operators


    Arithmetic operators perform basic mathematical operations:


    Addition (+): Adds two operands.


    int sum =  10  +  20;  // sum is 30


    Subtraction (-): Subtracts the second operand from the first.


    int difference =  20  -  10;  // difference is 10


    Multiplication (*): Multiplies two operands.


    int product =  10  *  20;  // product is 200


    Division (/): Divides the numerator by the denominator.


    int quotient =  20  /  10;  // quotient is 2


    Modulus (%): Returns the remainder of a division operation.


    int remainder =  20  %  3;  // remainder is 2


    ![](image_rsrc87Z.jpg)


    Relational Operators


    Relational operators compare two operands and return a boolean result:


    Equal to (==): Checks if two operands are equal.


    boolean isEqual = (10  ==  20);  // isEqual is false


    Not equal to (!=): Checks if two operands are not equal.


    boolean isNotEqual = (10  !=  20);  // isNotEqual is true


    Greater than (>): Checks if the left operand is greater than the right.


    boolean isGreater = (20  >  10);  // isGreater is true


    Less than (<): Checks if the left operand is less than the right.


    boolean isLess = (10  <  20);  // isLess is true


    Greater than or equal to (>=): Checks if the left operand is greater than or equal
    to the right.


    boolean isGreaterOrEqual = (20  >=  10);  // isGreaterOrEqual is true


    Less than or equal to (<=): Checks if the left operand is less than or equal to
    the right.


    boolean isLessOrEqual = (10  <=  20);  // isLessOrEqual is true


    Logical Operators


    Logical operators are used to combine multiple boolean expressions:


    AND (&&): Returns true if both operands are true.


    boolean result = (10  >  5) && (20  >  15);  // result is true


    OR (||): Returns true if at least one of the operands is true.


    boolean result = (10  >  5) || (20  <  15);  // result is true


    NOT (!): Reverses the boolean value of the operand.


    boolean result =  !(10  >  5);  // result is false


    Assignment Operators


    Assignment operators are used to assign values to variables:


    Assignment (=): Assigns the right operand''s value to the left operand.


    int a =  10;  // a is 10


    Addition assignment (+=): Adds the right operand to the left operand and assigns
    the result to the left operand.


    int a =  10;


    a +=  5;  // a is 15


    Subtraction assignment (-=): Subtracts the right operand from the left operand
    and assigns the result to the left operand.


    int a =  10;


    a -=  5;  // a is 5


    Multiplication assignment (*=): Multiplies the left operand by the right operand
    and assigns the result to the left operand.


    int a =  10;


    a *=  2;  // a is 20


    Division assignment (/=): Divides the left operand by the right operand and assigns
    the result to the left operand.


    int a =  10;


    a /=  2;  // a is 5


    Modulus assignment (%=): Takes the modulus of the left operand by the right operand
    and assigns the result to the left operand.


    int a =  10;


    a %=  3;  // a is 1


    Unary Operators


    Unary operators operate on a single operand:


    Unary plus (+): Indicates a positive value (optional).


    int a =  +5;  // a is 5


    Unary minus (-): Negates the value.


    int a =  -5;  // a is -5


