    ## Buffered Streams


    Buffered streams in Java are designed to enhance the performance of I/O operations
    by reducing the number of physical reads and writes. They use an internal buffer
    to store data, minimizing the interaction with the underlying I/O system.


    BufferedInputStream


    BufferedInputStream wraps an InputStream and buffers the input to improve efficiency.
    It reads chunks of data into the buffer and serves subsequent reads from the buffer.


    import  java.io.BufferedInputStream;


    import  java.io.FileInputStream;


    import  java.io.IOException;


    public  class  BufferedInputStreamExample  {


    public  static  void  main(String[] args)  {


    try (BufferedInputStream  bis  =  new  BufferedInputStream(new  FileInputStream("example.txt")))
    {


    int  byteData;


    while ((byteData =  bis.read()) !=  -1) {


    System.out.print((char) byteData);


    }


    } catch (IOException  e) {


    e.printStackTrace();


    }


    }


    }


    ![](image_rsrc8AU.jpg)


    BufferedOutputStream


    BufferedOutputStream wraps an OutputStream and buffers the output to improve efficiency.
    It writes data to the buffer and only writes to the underlying output stream when
    the buffer is full or when the stream is flushed.


    Example:


    import  java.io.BufferedOutputStream;


    import  java.io.FileOutputStream;


    import  java.io.IOException;


    public  class  BufferedOutputStreamExample  {


    public  static  void  main(String[] args)  {


    try (BufferedOutputStream  bos  =  new  BufferedOutputStream(new  FileOutputStream("example.txt")))
    {


    String  data  =  "Hello, World!";


    bos.write(data.getBytes());


    } catch (IOException  e) {


    e.printStackTrace();


    }


    }


    }


    BufferedReader and BufferedWriter


    Buffered character streams further optimize reading and writing of text data.


    BufferedReader: Buffers the input character stream for efficient reading.


