    \n## 继承 (Inheritance)\n\n继承是面向对象编程 (OOP) 中的一个基本概念，它允许一个类（称为子类或派生类）继承另一个类（称为父类或基类）的属性和方法。这促进了代码复用，并在类之间建立了自然的层级关系。\n\
    \n### 继承的目的\n\n继承提供了几个关键的优势：\n\n1. **代码复用**：通过继承父类，子类可以复用已经定义的代码，减少冗余并促进代码复用。\n\
    2. **层级组织**：继承有助于将类组织成层级结构，使得复杂系统更容易被理解和维护。\n3. **可扩展性**：子类可以通过添加新属性和方法或通过重写现有方法来扩展父类的功能。\n\
    \n### 定义继承\n\n在 Java 中，继承是通过使用 `extends` 关键字实现的。子类扩展父类，继承它的属性和方法。这里是一个基础示例：\n\n\
    ```java\n// 父类\npublic class Vehicle {\n  // 属性\n  protected String brand;\n \
    \ protected int year;\n\n  // 构造函数\n  public Vehicle(String brand, int year) {\n\
    \    this.brand = brand;\n    this.year = year;\n  }\n\n  // 方法\n  public void\
    \ displayInfo() {\n    System.out.println(\"Brand: \" + brand + \", Year: \" +\
    \ year);\n  }\n}\n\n// 子类\npublic class Car extends Vehicle {\n  // 属性\n  private\
    \ String model;\n\n  // 构造函数\n  public Car(String brand, int year, String model)\
    \ {\n    super(brand, year); // 调用父类构造函数\n    this.model = model;\n  }\n\n  //\
    \ 方法\n  public void displayModel() {\n    System.out.println(\"Model: \" + model);\n\
    \  }\n}\n```\n\n![](img/image_rsrc892.jpg)\n\n在这个示例中：\n\n* `Vehicle` 是父类，具有属性\
    \ `brand` 和 `year` 以及一个方法 `displayInfo()`。\n* `Car` 是子类，它扩展了 `Vehicle` 并添加了额外的属性\
    \ `model` 和方法 `displayModel()`。\n\n### 使用继承\n\n要使用继承，请创建子类的对象并调用它的方法：\n\n```java\n\
    public class Main {\n  public static void main(String[] args) {\n    // 创建一个 Car\
    \ 类的对象\n    Car myCar = new Car(\"Toyota\", 2022, \"Corolla\");\n\n    // 调用来自父类和子类的方法\n\
    \    myCar.displayInfo(); // 来自父类的方法\n    myCar.displayModel(); // 来自子类的方法\n \
    \ }\n}\n```\n"
- fmt: "\nPolymorphism is a core concept in Object-Oriented Programming (OOP) that\
    \ allows objects of different classes to be treated as objects of a common superclass.\
    \ It enables a single interface to be used for a general class of actions, making\
    \ it possible to use a single method to operate on objects of various types. Polymorphism\
    \ enhances flexibility and maintainability in code by promoting the use of generic\
    \ methods and simplifying the code structure.\n\n## Types of Polymorphism\n\n\
    There are two main types of polymorphism in Java:\n\n### Compile-Time Polymorphism\
    \ (Method Overloading)\nMethod overloading allows multiple methods with the same\
    \ name but different parameter lists within the same class. The correct method\
    \ to invoke is determined at compile time based on the method signature.\n\n###\
    \ Runtime Polymorphism (Method Overriding)\nMethod overriding allows a subclass\
    \ to provide a specific implementation of a method that is already defined in\
    \ its superclass. The method to invoke is determined at runtime based on the object's\
    \ actual type, enabling dynamic method dispatch.\n\n![](image_rsrc895.jpg)\n\n\
    ### Compile-Time Polymorphism (Method Overloading)\nMethod overloading occurs\
    \ when multiple methods in the same class have the same name but different parameter\
    \ lists. The compiler determines which method to call based on the number and\
    \ type of arguments passed.\n\nHere’s an example of method overloading:\n\n```java\n\
    public class Calculator {\n    // Method to add two integers\n    public int add(int\
    \ a, int b) {\n        return a + b;\n    }\n\n    // Overloaded method to add\
    \ three integers\n    public int add(int a, int b, int c) {\n        return a\
    \ + b + c;\n    }\n\n    // Overloaded method to add two doubles\n    public double\
    \ add(double a, double b) {\n        return a + b;\n    }\n}\n\npublic class Main\
    \ {\n    public static void main(String[] args) {\n        Calculator calculator\
    \ = new Calculator();\n        System.out.println(\"Sum of 2 and 3: \" + calculator.add(2,\
    \ 3));\n        System.out.println(\"Sum of 1, 2, and 3: \" + calculator.add(1,\
    \ 2, 3));\n        System.out.println(\"Sum of 1.5 and 2.5: \" + calculator.add(1.5,\
    \ 2.5));\n    }\n}\n```\n\nIn this example, the `Calculator` class has three `add`\
    \ methods with different parameter lists, demonstrating method overloading.\n\n\
    ### Runtime Polymorphism (Method Overriding)\nMethod overriding allows a subclass\
    \ to provide a specific implementation for a method that is already defined in\
    \ its superclass. The method to be invoked is determined at runtime based on the\
    \ actual object's type, enabling dynamic method dispatch.\n\nHere’s an example\
    \ of method overriding:\n\n```java\n// Superclass\npublic class Animal {\n   \
    \ // Method to make a sound\n    public void makeSound() {\n        System.out.println(\"\
    Animal makes a sound\");\n    }\n}\n\n// Subclass\npublic class Dog extends Animal\
    \ {\n    // Overriding the makeSound method\n    @Override\n    public void makeSound()\
    \ {\n        System.out.println(\"Dog barks\");\n    }\n}\n\n// Another Subclass\n\
    public class Cat extends Animal {\n    // Overriding the makeSound method\n  \
    \  @Override\n    public void makeSound() {\n        System.out.println(\"Cat\
    \ meows\");\n    }\n}\n\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        Animal myDog = new Dog();\n        Animal myCat = new Cat();\n\
    \        // Calling the overridden methods\n        myDog.makeSound(); // Outputs:\
    \ Dog barks\n        myCat.makeSound(); // Outputs: Cat meows\n    }\n}\n```\n\
    \nIn this example, the `Dog` and `Cat` classes override the `makeSound` method\
    \ of the `Animal` class. The method to invoke is determined at runtime based on\
    \ the actual object type (`Dog` or `Cat`).\n\n### Polymorphism in Action\nPolymorphism\
    \ allows you to write more generic and flexible code. For example, you can use\
    \ a common interface or superclass to handle a group of related objects.\n\nHere’s\
    \ an example using an interface:\n\n```java\n// Interface\npublic interface Shape\
    \ {\n    void draw();\n}\n\n// Implementing the interface in a class\npublic class\
    \ Circle implements Shape {\n    @Override\n    public void draw() {\n       \
    \ System.out.println(\"Drawing a Circle\");\n    }\n}\n\n// Another class implementing\
    \ the interface\npublic class Rectangle implements Shape {\n    @Override\n  \
    \  public void draw() {\n        System.out.println(\"Drawing a Rectangle\");\n\
    \    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n\
    \        // Creating an array of Shape references\n        Shape[] shapes = {new\
    \ Circle(), new Rectangle()};\n        // Using polymorphism to draw shapes\n\
    \        for (Shape shape : shapes) {\n            shape.draw(); // Outputs: Drawing\
    \ a Circle, Drawing a Rectangle\n        }\n    }\n}\n```\n\nIn this example,\
    \ the `Shape` interface defines a common method `draw()`. The `Circle` and `Rectangle`\
    \ classes implement this interface, providing their specific implementations of\
    \ the `draw()` method. The `Main` class demonstrates polymorphism by using a single\
    \ loop to call the `draw()` method on different types of `Shape` objects.\n\n\
    ## Advantages of Polymorphism\n\n1. **Code Reusability**: Polymorphism allows\
    \ you to use the same method or interface to work with different types of objects,\
    \ promoting code reuse.\n2. **Flexibility**: Polymorphism makes it easy to add\
    \ new classes that implement the same interface or extend the same superclass\
    \ without modifying existing code.\n3. **Maintainability**: It reduces the complexity\
    \ of the code, making it easier to understand and maintain.\n4. **Extensibility**:\
    \ You can extend your codebase by adding new subclasses or implementing interfaces.\n\
    \n## Encapsulation\n\nEncapsulation is one of the fundamental principles of Object-Oriented\
    \ Programming (OOP), alongside inheritance, polymorphism, and abstraction. It\
    \ involves bundling the data (attributes) and the methods (functions) that operate\
    \ on the data into a single unit called a class. Encapsulation restricts direct\
    \ access to some of an object’s components, which.\n\n### Key Concepts of Encapsulation\n\
    \n1. **Data Hiding**: Encapsulation hides the internal state of the object and\
    \ only exposes a controlled interface. This means that the internal representation\
    \ of an object is hidden from the outside world, accessible through public methods.\n\
    2. **Access Modifiers**: Java provides four access modifiers that determine the\
    \ visibility of a class's members:\n    - `private`: The member is accessible\
    \ only within the same class.\n    - `default` (no modifier): The member is accessible\
    \ only within classes in the same package.\n    - `protected`: The member is accessible\
    \ within the same package and by subclasses.\n    - `public`: The member is accessible\
    \ from any other class.\n\n## Benefits of Encapsulation\n\n- **Improved Maintainability**:\
    \ Encapsulation allows changes to the implementation of a class without affecting\
    \ other parts of the program. This makes the code easier to maintain and update.\n\
    - **Enhanced Security**: By restricting access to the internal state of an object,\
    \ encapsulation helps protect the data from unintended modifications and ensures\
    \ that only valid data is set.\n- **Modular Design**: Encapsulation promotes modularity\
    \ by organizing the code into discrete units with well-defined interfaces, making\
    \ the system easier to understand and manage.\n\n![](image_rsrc898.jpg)\n\n###\
    \ Implementing Encapsulation\n\nTo implement encapsulation in Java, you typically\
    \ make the attributes of a class `private` and provide public getter and setter\
    \ methods to access and modify the attributes. This approach ensures that any\
    \ access to the attributes is controlled and validated if necessary.\n\nHere’s\
    \ a simple example of encapsulation in Java:\n\n```java\npublic class Person {\n\
    \    // Private attributes\n    private String name;\n    private int age;\n\n\
    \    // Constructor\n    public Person(String name, int age) {\n        this.name\
    \ = name;\n        this.age = age;\n    }\n\n    // Public getter method for name\n\
    \    public String getName() {\n        return name;\n    }\n\n    // Public setter\
    \ method for name\n    public void setName(String name) {\n        this.name =\
    \ name;\n    }\n\n    // Public getter method for age\n    public int getAge()\
    \ {\n        return age;\n    }\n}\n```\n"
