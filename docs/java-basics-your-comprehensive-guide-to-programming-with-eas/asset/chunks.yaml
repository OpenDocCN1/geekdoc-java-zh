    ## Throw, Throws, and Finally


    In Java, the `throw`, `throws`, and `finally` keywords are essential components
    of exception handling. They provide mechanisms for explicitly throwing exceptions,
    declaring exceptions that methods might throw, and ensuring certain code is executed
    regardless of whether an exception occurred.


    ### Throw


    The `throw` keyword is used to explicitly throw an exception from a method or
    block of code. When an exception is thrown, the normal flow of the program is
    interrupted, and control is transferred to the nearest enclosing `try-catch` block
    that can handle the type of exception being thrown.


    Here''s an example of using `throw`:


    ```java

    public class ThrowExample {

    public static void main(String[] args) {

    try {

    validateAge(15);

    } catch (IllegalArgumentException e) {

    System.out.println("Caught an exception: " + e.getMessage());

    }

    }

    public static void validateAge(int age) {

    if (age < 18) {

    throw new IllegalArgumentException("Age must be at least 18.");

    }

    System.out.println("Age is valid.");

    }

    }

    ```


    In this example, the `validateAge` method throws an `IllegalArgumentException`
    if the `age` is less than 18. The `main` method catches this exception and prints
    an appropriate message.


    ### Throws


    The `throws` keyword is used in a method signature to declare that the method
    can throw one or more exceptions. This indicates to the caller of the method that
    it must handle these exceptions, either with a `try-catch` block or by propagating
    them further using the `throws` keyword.


    Here''s an example of using `throws`:


    ```java

    import java.io.BufferedReader;

    import java.io.FileReader;

    import java.io.IOException;

    public class ThrowsExample {

    public static void main(String[] args) {

    try {

    readFile("example.txt");

    } catch (IOException e) {

    System.out.println("Caught an IOException: " + e.getMessage());

    }

    }

    public static void readFile(String fileName) throws IOException {

    BufferedReader reader = new BufferedReader(new FileReader(fileName));

    String line;

    while ((line = reader.readLine()) != null) {

    System.out.println(line);

    }

    reader.close();

    }

    }

    ```


    In this example, the `readFile` method declares that it throws an `IOException`.
    The `main` method handles this exception with a `try-catch` block.


    ### Finally


    The `finally` block is used to execute a block of code regardless of whether an
    exception was thrown or caught. This is typically used for cleanup activities,
    such as closing files, releasing resources, or resetting variables. The `finally`
    block ensures that these critical operations are performed even if an exception
    occurs.


    Here''s an example of using `finally`:


    ```java

    import java.io.BufferedReader;

    import java.io.FileReader;

    import java.io.IOException;

    public class FinallyExample {

    public static void main(String[] args) {

    BufferedReader reader = null;

    try {

    reader = new BufferedReader(new FileReader("example.txt"));

    String line;

    while ((line = reader.readLine()) != null) {

    System.out.println(line);

    }

    } catch (IOException e) {

    System.out.println("Caught an IOException: " + e.getMessage());

    } finally {

    try {

    if (reader != null) {

    reader.close();

    }

    } catch (IOException e) {

    System.out.println("Error closing the reader: " + e.getMessage());

    }

    }

    }

    }

    ```


    In this example:

    * The `try` block opens and reads from a file.

    * The `catch` block handles any `IOException` that might occur during reading.

    * The `finally` block ensures that the `BufferedReader` is closed, even if an
    exception occurs.


