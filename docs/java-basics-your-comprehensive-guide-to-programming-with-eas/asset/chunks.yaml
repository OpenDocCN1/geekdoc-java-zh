- fmt: "\nThe `InputStream` class is the superclass of all byte input streams, and\
    \ it provides methods to read bytes from a source.\n\n### Commonly used InputStream\
    \ subclasses:\n\n#### `FileInputStream`: Reads bytes from a file.\n\n```java\n\
    import java.io.FileInputStream;\nimport java.io.IOException;\n\npublic class FileInputStreamExample\
    \ {\n    public static void main(String[] args) {\n        try (FileInputStream\
    \ fis = new FileInputStream(\"example.txt\")) {\n            int byteData;\n \
    \           while ((byteData = fis.read()) != -1) {\n                System.out.print((char)\
    \ byteData);\n            }\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n![](image_rsrc8AM.jpg)\n\n#### `ByteArrayInputStream`:\
    \ Reads bytes from an in-memory byte array.\n\n```java\nimport java.io.ByteArrayInputStream;\n\
    import java.io.IOException;\n\npublic class ByteArrayInputStreamExample {\n  \
    \  public static void main(String[] args) {\n        byte[] byteArray = {65, 66,\
    \ 67, 68};\n        try (ByteArrayInputStream bais = new ByteArrayInputStream(byteArray))\
    \ {\n            int byteData;\n            while ((byteData = bais.read()) !=\
    \ -1) {\n                System.out.print((char) byteData);\n            }\n \
    \       } catch (IOException e) {\n            e.printStackTrace();\n        }\n\
    \    }\n}\n```\n\n# OutputStream\n\nThe `OutputStream` class is the superclass\
    \ of all byte output streams, and it provides methods to write bytes to a destination.\n\
    \n### Commonly used OutputStream subclasses:\n\n#### `FileOutputStream`: Writes\
    \ bytes to a file.\n\n```java\nimport java.io.FileOutputStream;\nimport java.io.IOException;\n\
    \npublic class FileOutputStreamExample {\n    public static void main(String[]\
    \ args) {\n        try (FileOutputStream fos = new FileOutputStream(\"example.txt\"\
    )) {\n            String data = \"Hello, World!\";\n            fos.write(data.getBytes());\n\
    \        } catch (IOException e) {\n            e.printStackTrace();\n       \
    \ }\n    }\n}\n```\n\n#### `ByteArrayOutputStream`: Writes bytes to an in-memory\
    \ byte array.\n\n```java\nimport java.io.ByteArrayOutputStream;\nimport java.io.IOException;\n\
    \npublic class ByteArrayOutputStreamExample {\n    public static void main(String[]\
    \ args) {\n        try (ByteArrayOutputStream baos = new ByteArrayOutputStream())\
    \ {\n            String data = \"Hello, World!\";\n            baos.write(data.getBytes());\n\
    \            byte[] byteArray = baos.toByteArray();\n            for (byte b :\
    \ byteArray) {\n                System.out.print((char) b);\n            }\n \
    \       } catch (IOException e) {\n            e.printStackTrace();\n        }\n\
    \    }\n}\n```\n![](image_rsrc8AN.jpg)[](image_rsrc8AP.jpg)\n\n# Character Streams\n\
    \nCharacter streams in Java are designed for handling text data. They read and\
    \ write data in 16-bit Unicode characters, making them suitable for working with\
    \ text files and ensuring proper handling of character encoding. The primary classes\
    \ for character streams are `Reader` and `Writer`.\n\n## Reader\n\nThe `Reader`\
    \ class is the superclass of all character input streams, providing methods to\
    \ read characters, arrays of characters, and lines.\n\n### Commonly used Reader\
    \ subclasses:\n\n#### `FileReader`: Reads characters from a file.\n\n```java\n\
    import java.io.FileReader;\nimport java.io.IOException;\n\npublic class FileReaderExample\
    \ {\n    public static void main(String[] args) {\n        try (FileReader fr\
    \ = new FileReader(\"example.txt\")) {\n            int charData;\n          \
    \  while ((charData = fr.read()) != -1) {\n                System.out.print((char)\
    \ charData);\n            }\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\n#### `CharArrayReader`: Reads characters from a character\
    \ array.\n\n```java\nimport java.io.CharArrayReader;\nimport java.io.IOException;\n\
    \npublic class CharArrayReaderExample {\n    public static void main(String[]\
    \ args) {\n        char[] charArray = {'H', 'e', 'l', 'l', 'o'};\n        try\
    \ (CharArrayReader car = new CharArrayReader(charArray)) {\n            int charData;\n\
    \            while ((charData = car.read()) != -1) {\n                System.out.print((char)\
    \ charData);\n            }\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n![](image_rsrc8AR.jpg)\n\n## Writer\n\nThe `Writer`\
    \ class is the superclass of all character output streams, providing methods to\
    \ write characters, arrays of characters, and strings.\n\n### Commonly used Writer\
    \ subclasses:\n\n#### `FileWriter`: Writes characters to a file.\n\n```java\n\
    import java.io.FileWriter;\nimport java.io.IOException;\n\npublic class FileWriterExample\
    \ {\n    public static void main(String[] args) {\n        try (FileWriter fw\
    \ = new FileWriter(\"example.txt\")) {\n            fw.write(\"Hello, World!\"\
    );\n        } catch (IOException e) {\n            e.printStackTrace();\n    \
    \    }\n    }\n}\n```\n\n#### `CharArrayWriter`: Writes characters to a character\
    \ array.\n\n```java\nimport java.io.CharArrayWriter;\nimport java.io.IOException;\n\
    \npublic class CharArrayWriterExample {\n    public static void main(String[]\
    \ args) {\n        try (CharArrayWriter caw = new CharArrayWriter()) {\n     \
    \       caw.write(\"Hello, World!\");\n            char[] charArray = caw.toCharArray();\n\
    \            for (char c : charArray) {\n                System.out.print(c);\n\
    \            }\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\n# Buffered Streams\n\nBuffered streams for characters\
    \ use an internal buffer to reduce the number of I/O operations, enhancing performance.\
    \ They are typically used as wrappers around other streams.\n\n#### `BufferedReader`:\
    \ Buffers the input character stream.\n\n```java\nimport java.io.BufferedReader;\n\
    import java.io.FileReader;\nimport java.io.IOException;\n\npublic class BufferedReaderExample\
    \ {\n    public static void main(String[] args) {\n        try (BufferedReader\
    \ br = new BufferedReader(new FileReader(\"example.txt\"))) {\n            String\
    \ line;\n            while ((line = br.readLine()) != null) {\n              \
    \  System.out.println(line);\n            }\n        } catch (IOException e) {\n\
    \            e.printStackTrace();\n        }\n    }\n}\n```\n\n#### `BufferedWriter`:\
    \ Buffers the output character stream.\n\n```java\nimport java.io.BufferedWriter;\n\
