    ```\nSimple Console-Based Calculator\nChoose an operation: \n1. Addition\n2. Subtraction\n\
    3. Multiplication\n4. Division\nEnter your choice (1-4): \nEnter the first number:\
    \ \nEnter the second number: \nThe result is: ...\n```\n\n## Java Basics\n\n###\
