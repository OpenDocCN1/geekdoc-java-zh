    ## Project: Develop a Basic Number Guessing Game


    Creating a number guessing game is a fun way to apply the Java basics you''ve
    learned, such as data types, control flow statements, and arrays. This project
    will involve generating a random number and allowing the user to guess it, providing
    feedback until the correct number is guessed.


    Step-by-Step Implementation


    1.  Setup the Project: Create a new Java file named NumberGuessingGame.java.


    2.  Import Necessary Packages: We will use the Scanner class for user input and
    Random class to generate the random number.


    import  java.util.Scanner;


    import  java.util.Random;


    Class and Main Method: Define the main class and method.


    public  class  NumberGuessingGame  {


    public  static  void  main(String[] args)  {


    // Create a Scanner object for user input


    Scanner  scanner  =  new  Scanner(System.in);


    // Create a Random object for generating random numbers


    Random  random  =  new  Random();


    // Generate a random number between 1 and 10


    int  randomNumber  =  random.nextInt(10) +  1;


    // Initialize the guess count


    int  guessCount  =  0;


    // Boolean to track if the number is guessed correctly


    boolean  guessedCorrectly  =  false;


    // Introduction to the game


    System.out.println("Welcome to the Number Guessing Game!");


    System.out.println("I have selected a number between 1 and 100\. Try to guess
    it!");


    // Loop until the number is guessed correctly


    while (!guessedCorrectly) {


    // Prompt user to enter a guess


    System.out.print("Enter your guess: ");


    int  userGuess  =  scanner.nextInt();


    guessCount++;


    // Check if the guess is correct


    if (userGuess == randomNumber) {


    guessedCorrectly =  true;


    System.out.println("Congratulations! You guessed the number in "  + guessCount
    +  " attempts.");


    } else  if (userGuess < randomNumber) {


    System.out.println("Your guess is too low. Try again.");


    } else {


    System.out.println("Your guess is too high. Try again.");


    }


    }


    // Close the scanner


    scanner.close();


    }


    }


