    ## List Interface


    The List interface in the Java Collections Framework represents an ordered collection
    (also known as a sequence). Lists can contain duplicate elements, and elements
    are accessed by their integer index, allowing for precise control over where each
    element is inserted. The List interface extends the Collection interface and provides
    additional methods to manipulate the order and position of elements.


    ![](image_rsrc8A5.jpg)


    Common Implementations


    ArrayList: A resizable array implementation of the List interface. It offers fast
    random access and is efficient for retrieving and setting values by index. However,
    it is slower for operations that involve inserting or removing elements from the
    middle of the list due to the need to shift elements.


    List<String> arrayList =  new  ArrayList<>();


    arrayList.add("Apple");


    arrayList.add("Banana");


    arrayList.add("Cherry");


    LinkedList: A doubly-linked list implementation of the List interface. It provides
    better performance than ArrayList for insertions and deletions from the middle
    of the list. However, it is slower for random access due to the need to traverse
    the list.


    List<String> linkedList =  new  LinkedList<>();


    linkedList.add("Dog");


    linkedList.add("Cat");


    linkedList.add("Bird");


    Vector: Similar to ArrayList but synchronized, making it thread-safe. It is generally
    less preferred due to the overhead of synchronization.


    List<String> vector =  new  Vector<>();


    vector.add("Red");


    vector.add("Green");


    vector.add("Blue");


    Key Methods


    add(E element): Appends the specified element to the end of the list.


    list.add("Element");


    add(int index, E element): Inserts the specified element at the specified position
    in the list.


    list.add(1, "InsertedElement");


    get(int index): Returns the element at the specified position in the list.


    String element =  list.get(0);


    remove(int index): Removes the element at the specified position in the list.


    list.remove(2);


    set(int index, E element): Replaces the element at the specified position in the
    list with the specified element.


    list.set(1, "NewElement");


    indexOf(Object o): Returns the index of the first occurrence of the specified
    element in the list, or -1 if the list does not contain the element.


    int index =  list.indexOf("Element");


    size(): Returns the number of elements in the list.


    int size =  list.size();


    Example


    Here''s an example demonstrating the usage of the List interface:


    import  java.util.*;


    public  class  ListExample  {


    public  static  void  main(String[] args)  {


    // Create a list using ArrayList


    List<String> fruits  =  new  ArrayList<>();


    fruits.add("Apple");


    fruits.add("Banana");


    fruits.add("Cherry");


    // Access elements


    System.out.println("First fruit: "  +  fruits.get(0));


    // Modify elements


    fruits.set(1, "Blueberry");


    System.out.println("Modified list: "  + fruits);


    // Insert element


    fruits.add(1, "Mango");


    System.out.println("List after insertion: "  + fruits);


    // Remove element


    fruits.remove(2);


    System.out.println("List after removal: "  + fruits);


    // Iterate through the list


    for (String  fruit  : fruits) {


    System.out.println(fruit);


    }


    }


    }


