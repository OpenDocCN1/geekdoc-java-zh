    \n[content]\n## 正则表达式\n\n正则表达式（regex）是用于模式匹配的强大工具。它们允许使用特殊语法定义搜索。\n\n### 基础语法\n\
    \n正则表达式由字面字符和特殊元字符组成：\n\n- **字面字符**: 匹配自身（例如 `a`）。\n- **元字符**: 定义特殊规则（例如 `.` 匹配任意字符，`*`\
    \ 表示前面的次数）。\n\n### 常用元字符和构造\n\n- `.`: 匹配除换行符外的任意单个字符。\n  `a.c\".matches(\"abc\"\
    ) // true`\n- `\\d`: 匹配任意数字 (0-9)。\n  `\"123\".matches(\"\\\\d+\") // true`\n\
    - `\\w`: 匹配任意单词字符（字母、数字和下划线）。\n  `\"word_1\".matches(\"\\\\w+\") // true`\n- `\\\
    s`: 匹配任意空白字符。\n  `\" \".matches(\"\\\\s\") // true`\n- `^`: 匹配字符串的开头。\n  `\"^abc\"\
    .matches(\"^abc.*\") // 如果开头是 abc 则真\n- `$`: 匹配字符串的结尾。\n  `\"abc$\".matches(\"\
    .*abc$\") // 如果结尾是 abc 则真\n- `[abc]`: 匹配括号内的任意字符。\n  `a.matches(\"[abc]\") //\
    \ true`\n- `[^abc]`: 匹配括号外的任意字符。\n  `\"d\".matches(\"[^abc]\") // true`\n- `(a|b)`:\
    \ 匹配 a 或 b。\n  `\"a\".matches(\"(a|b)\") // true`\n- **量词**: 指定出现的次数。\n  - `*`:\
    \ 0 次或更多\n  - `+`: 1 次或更多\n  - `?`: 0 次或 1 次\n  - `{n}`: 正好 n 次\n  - `{n,}`: 至少\
    \ n 次\n  - `{n,m}`: 在 n 到 m 次之间\n\n![](img/image_rsrc88K.jpg)\n\n### 在 Java 中使用正则表达式\n\
    \n在 Java 中，`java.util.regex` 包中的 `Pattern` 和 `Matcher` 类用于处理正则表达式。\n\n#### 示例：\n\
    \n```java\nimport java.util.regex.*;\n\npublic class RegexExample {\n    public\
    \ static void main(String[] args) {\n        String text = \"The quick brown fox\
    \ jumps over the lazy dog.\";\n        String patternString = \"\\\\b\\\\w{3,5}\\\
    \\b\";\n        Pattern pattern = Pattern.compile(patternString);\n        Matcher\
    \ matcher = pattern.matcher(text);\n\n        while (matcher.find()) {\n     \
    \       System.out.println(\"Found: \" + matcher.group());\n        }\n    }\n\
    }\n```\n"
