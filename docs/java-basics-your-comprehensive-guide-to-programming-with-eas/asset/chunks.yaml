    ## Serialization and Deserialization


    Serialization in Java is the process of converting an object into a byte stream,
    allowing it to be easily saved to a file, sent over a network, or stored in a
    database. Deserialization is the reverse process, converting the byte stream back
    into a copy of the original object. This mechanism is essential for persistent
    storage and communication between Java programs.


    Serialization


    To serialize an object, it must implement the Serializable interface, which is
    a marker interface (an interface with no methods). The ObjectOutputStream class
    is used to write the object to an output stream.


    Example:


    import  java.io.FileOutputStream;


    import  java.io.ObjectOutputStream;


    import  java.io.Serializable;


    import  java.io.IOException;


    class  Person  implements  Serializable  {


    private  static  final  long serialVersionUID =  1L;


    String name;


    int age;


    Person(String  name, int  age)  {


    this.name  = name;


    this.age  = age;


    }


    }


    public  class  SerializationExample  {


    public  static  void  main(String[] args)  {


    Person  person  =  new  Person("John Doe", 30);


    try (FileOutputStream  fileOut  =  new  FileOutputStream("person.ser");


    ObjectOutputStream  out  =  new  ObjectOutputStream(fileOut)) {


    out.writeObject(person);


    System.out.println("Serialized data is saved in person.ser");


    } catch (IOException  i) {


    i.printStackTrace();


    }


    }


    }


    ![](image_rsrc8AX.jpg)


    Deserialization


    Deserialization is performed using the ObjectInputStream class, which reads the
    byte stream and converts it back into an object.


    Example:


    import  java.io.FileInputStream;


    import  java.io.ObjectInputStream;


    import  java.io.IOException;


    public  class  DeserializationExample  {


    public  static  void  main(String[] args)  {


    Person  person  =  null;


    try (FileInputStream  fileIn  =  new  FileInputStream("person.ser");


    ObjectInputStream  in  =  new  ObjectInputStream(fileIn)) {


    person = (Person) in.readObject();


    System.out.println("Deserialized Person...");


    System.out.println("Name: "  +  person.name);


    System.out.println("Age: "  +  person.age);


    } catch (IOException | ClassNotFoundException  i) {


    i.printStackTrace();


    }


    }


    }


    Transient Keyword


    Fields marked with the transient keyword are not serialized. This is useful for
    fields that are sensitive or irrelevant for serialization.


    class  Person  implements  Serializable  {


    private  static  final  long serialVersionUID =  1L;


    String name;


    transient  int age;  // This field will not be serialized


    Person(String  name, int  age)  {


    this.name  = name;


    this.age  = age;


    }


    }


    Custom Serialization


    Implementing custom serialization allows you to control the serialization and
    deserialization processes by defining the writeObject and readObject methods.


    private  void  writeObject(ObjectOutputStream oos) throws IOException {


    oos.defaultWriteObject();  // Serialize the non-transient fields


    oos.writeInt(age);  // Custom serialization for age


    }


    private  void  readObject(ObjectInputStream ois) throws IOException, ClassNotFoundException
    {


    ois.defaultReadObject();  // Deserialize the non-transient fields


    age =  ois.readInt();  // Custom deserialization for age


    }


