    Java Input and Output (I/O)


    ## File Handling


    File handling in Java is essential for many applications, enabling you to read
    from and write to files stored on your system. Java''s java.io package provides
    the necessary classes and methods to perform these operations. Understanding how
    to manage files is crucial for tasks such as data storage, configuration management,
    and data transfer.


    ![](image_rsrc8AH.jpg)


    Creating and Deleting Files


    To create a new file, you can use the File class from the java.io package. The
    createNewFile method is used to create a new file if it does not already exist.


    import  java.io.File;


    import  java.io.IOException;


    public  class  FileHandlingExample  {


    public  static  void  main(String[] args)  {


    File  file  =  new  File("example.txt");


    try {


    if (file.createNewFile()) {


    System.out.println("File created: "  +  file.getName());


    } else {


    System.out.println("File already exists.");


    }


    } catch (IOException  e) {


    System.out.println("An error occurred.");


    e.printStackTrace();


    }


    }


    }


    To delete a file, use the delete method of the File class:


    if (file.delete()) {


    System.out.println("Deleted the file: "  +  file.getName());


    } else {


    System.out.println("Failed to delete the file.");


    }


    Reading and Writing Files


    Reading and writing files can be done using various classes provided in the java.io
    package. For reading files, FileReader and BufferedReader are commonly used, whereas
    FileWriter and BufferedWriter are used for writing files.


    Reading from a file:


    import  java.io.FileReader;


    import  java.io.BufferedReader;


    import  java.io.IOException;


    public  class  FileReadingExample  {


    public  static  void  main(String[] args)  {


    try (BufferedReader  br  =  new  BufferedReader(new  FileReader("example.txt")))
    {


    String  line;


    while ((line =  br.readLine()) !=  null) {


    System.out.println(line);


    }


    } catch (IOException  e) {


    e.printStackTrace();


    }


    }


    }


    Writing to a file:


    import  java.io.FileWriter;


    import  java.io.BufferedWriter;


    import  java.io.IOException;


    public  class  FileWritingExample  {


    public  static  void  main(String[] args)  {


    try (BufferedWriter  bw  =  new  BufferedWriter(new  FileWriter("example.txt")))
    {


    bw.write("Hello, world!");


    bw.newLine();


    bw.write("Java file handling is easy.");


    } catch (IOException  e) {


    e.printStackTrace();


    }


    }


    }


    Working with Directories


    In addition to files, Java provides methods to work with directories. You can
    create, list, and delete directories using the File class.


    Creating a directory:


    File directory =  new  File("exampleDir");


    if (directory.mkdir()) {


    System.out.println("Directory created: "  +  directory.getName());


    } else {


    System.out.println("Directory already exists.");


    }


    Listing files in a directory:


    File dir =  new  File("exampleDir");


    if (dir.isDirectory()) {


    String[] files =  dir.list();


    for (String file : files) {


    System.out.println(file);


    }


    }


    Deleting a directory:


    if (dir.delete()) {


    System.out.println("Deleted the directory: "  +  dir.getName());


    } else {


    System.out.println("Failed to delete the directory.");


    }


    ![](image_rsrc8AJ.jpg)![](image_rsrc8AK.jpg)


    ## Byte Streams


    Byte streams in Java are used to handle raw binary data. They read and write data
    in 8-bit bytes, making them suitable for handling all kinds of I/O, including
    files, network sockets, and even memory buffers. The primary classes for byte
    streams are InputStream and OutputStream.


