    \               }\n                break;\n            default:\n            \
    \    System.out.println(\"Error: Invalid choice.\");\n                validOperation\
    \ = false;\n                break;\n        }\n        if (validOperation) {\n\
    \            System.out.println(\"The result is: \" + result);\n        }\n  \
    \  }\n}\n```\n\n### 代码解释\n\n1. **导入 Scanner**：`import java.util.Scanner;` 用于引入\
