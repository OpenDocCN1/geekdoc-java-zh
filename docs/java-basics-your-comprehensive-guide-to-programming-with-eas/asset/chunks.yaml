  trans: "\n\n`InputStream` 类是所有字节输入流的父类，它提供了从源读取字节的方法。\n\n### 常见的 InputStream 子类：\n\
    \n#### `FileInputStream`: 从文件中读取字节字节。\n\n```java\nimport java.io.FileInputStream;\n\
    import java.io.IOException;\n\npublic class FileInputStreamExample {\n    public\
    \ static void main(String[] args) {\n        try (FileInputStream fis = new FileInputStream(\"\
    example.txt\")) {\n            int byteData;\n            while ((byteData = fis.read())\
    \ != -1) {\n                System.out.print((char) byteData);\n            }\n\
    \        } catch (IOException e) {\n            e.printStackTrace();\n       \
    \ }\n    }\n}\n```\n![](img/image_rsrc8AM.jpg)\n\n#### `ByteArrayInputStream`:\
    \ 从内存中的字节数组读取字节。\n\n```java\nimport java.io.ByteArrayInputStream;\nimport java.io.IOException;\n\
    \npublic class ByteArrayInputStreamExample {\n    public static void main(String[]\
    \ args) {\n        byte[] byteArray = {65, 66, 67, 68};\n        try (ByteArrayInputStream\
    \ bais = new ByteArrayInputStream(byteArray)) {\n            int byteData;\n \
    \           while ((byteData = bais.read()) != -1) {\n                System.out.print((char)\
    \ byteData);\n            }\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\n# OutputStream\n\n`OutputStream` 类是所有字节输出流的父类，它提供了向目标写入字节的方法。\n\
    \n### 常见的 OutputStream 子类：\n\n#### `FileOutputStream`: 向文件写入字节。\n\n```java\nimport\
    \ java.io.FileOutputStream;\nimport java.io.IOException;\n\npublic class FileOutputStreamExample\
    \ {\n    public static void main(String[] args) {\n        try (FileOutputStream\
    \ fos = new FileOutputStream(\"example.txt\")) {\n            String data = \"\
    Hello, World!\";\n            fos.write(data.getBytes());\n        } catch (IOException\
    \ e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\n#### `ByteArrayOutputStream`:\
    \ 向内存中的字节数组写入字节。\n\n```java\nimport java.io.ByteArrayOutputStream;\nimport java.io.IOException;\n\
    \npublic class ByteArrayOutputStreamExample {\n    public static void main(String[]\
    \ args) {\n        try (ByteArrayOutputStream baos = new ByteArrayOutputStream())\
    \ {\n            String data = \"Hello, World!\";\n            baos.write(data.getBytes());\n\
    \            byte[] byteArray = baos.toByteArray();\n            for (byte b :\
    \ byteArray) {\n                System.out.print((char) b);\n            }\n \
    \       } catch (IOException e) {\n            e.printStackTrace();\n        }\n\
    \    }\n}\n```\n![](img/image_rsrc8AN.jpg)[](image_rsrc8AP.jpg)\n\n# 字符流\n\nJava\
    \ 中的字符流设计用于处理文本数据。它们以 16 位 Unicode 字符的形式读取和写入数据，适用于处理文本文件，并确保字符编码的正确处理。字符流的主要类是\
    \ `Reader` 和 `Writer`。\n\n## Reader\n\n`Reader` 类是所有字符输入流的父类，提供了读取字符、字符数组和行的方法。\n\
    \n### 常见的 Reader 子类：\n\n#### `FileReader`: 从文件中读取字符。\n\n```java\nimport java.io.FileReader;\n\
    import java.io.IOException;\n\npublic class FileReaderExample {\n    public static\
    \ void main(String[] args) {\n        try (FileReader fr = new FileReader(\"example.txt\"\
    )) {\n            int charData;\n            while ((charData = fr.read()) !=\
    \ -1) {\n                System.out.print((char) charData);\n            }\n \
    \       } catch (IOException e) {\n            e.printStackTrace();\n        }\n\
    \    }\n}\n```\n\n#### `CharArrayReader`: 从字符数组读取字符。\n\n```java\nimport java.io.CharArrayReader;\n\
    import java.io.IOException;\n\npublic class CharArrayReaderExample {\n    public\
    \ static void main(String[] args) {\n        char[] charArray = {'H', 'e', 'l',\
    \ 'l', 'o'};\n        try (CharArrayReader car = new CharArrayReader(charArray))\
    \ {\n            int charData;\n            while ((charData = car.read()) !=\
    \ -1) {\n                System.out.print((char) charData);\n            }\n \
    \       } catch (IOException e) {\n            e.printStackTrace();\n        }\n\
    \    }\n}\n```\n![](img/image_rsrc8AR.jpg)\n\n## Writer\n\n`Writer` 类是所有字符输出流的父类，提供了写入字符、字符数组和字符串的方法。\n\
    \n### 常见的 Writer 子类：\n\n#### `FileWriter`: 向文件写入字符。\n\n```java\nimport java.io.FileWriter;\n\
    import java.io.IOException;\n\npublic class FileWriterExample {\n    public static\
    \ void main(String[] args) {\n        try (FileWriter fw = new FileWriter(\"example.txt\"\
    )) {\n            fw.write(\"Hello, World!\");\n        } catch (IOException e)\
    \ {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\n#### `CharArrayWriter`:\
    \ 向字符数组写入字符。\n\n```java\nimport java.io.CharArrayWriter;\nimport java.io.IOException;\n\
    \npublic class CharArrayWriterExample {\n    public static void main(String[]\
    \ args) {\n        try (CharArrayWriter caw = new CharArrayWriter()) {\n     \
    \       caw.write(\"Hello, World!\");\n            char[] charArray = caw.toCharArray();\n\
    \            for (char c : charArray) {\n                System.out.print(c);\n\
    \            }\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\n# 缓冲流\n\n字符缓冲流使用内部缓冲区来减少 I/O 操作次数，从而提高性能。它们通常作为其他流的包装器。\n\
    \n#### `BufferedReader`: 缓冲字符输入流。\n\n```java\nimport java.io.BufferedReader;\n\
    import java.io.FileReader;\nimport java.io.IOException;\n\npublic class BufferedReaderExample\
    \ {\n    public static void main(String[] args) {\n        try (BufferedReader\
    \ br = new BufferedReader(new FileReader(\"example.txt\"))) {\n            String\
    \ line;\n            while ((line = br.readLine()) != null) {\n              \
    \  System.out.println(line);\n            }\n        } catch (IOException e) {\n\
    \            e.printStackTrace();\n        }\n    }\n}\n```\n\n#### `BufferedWriter`:\
    \ 缓冲字符输出流。\n\n```java\nimport java.io.BufferedWriter;\nimport java.io.FileWriter;\n\
    import java.io.IOException;\n\npublic class BufferedWriterExample {\n    public\
    \ static void main(String[] args) {\n        try (BufferedWriter bw = new BufferedWriter(new\
    \ FileWriter(\"example.txt\"))) {\n            bw.write(\"Hello, World!\");\n\
    \            bw.newLine();\n            bw.write(\"Java character streams are\
    \ powerful.\");\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n![](img/image_rsrc8AS.jpg)[](image_rsrc8AT.jpg)\n\n\
    # 缓冲流（通用）\n\nJava 中的缓冲流设计用于通过减少物理读写次数来增强 I/O 操作的性能。它们使用内部缓冲区存储数据，尽量减少与底层 I/O 系统的交互。\n\
    \n### BufferedInputStream\n\n`BufferedInputStream` 包装 `InputStream` 并缓冲输入以提高效率。它将数据块读取到缓冲区，并从缓冲区提供后续读取。\n\
    \n```java\nimport java.io.BufferedInputStream;\nimport java.io.FileInputStream;\n\
    import java.io.IOException;\n\npublic class BufferedInputStreamExample {\n   \
    \ public static void main(String[] args) {\n        try (BufferedInputStream bis\
    \ = new BufferedInputStream(new FileInputStream(\"example.txt\"))) {\n       \
    \     int byteData;\n            while ((byteData = bis.read()) != -1) {\n   \
    \             System.out.print((char) byteData);\n            }\n        } catch\
    \ (IOException e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\
    ![](img/image_rsrc8AU.jpg)\n\n### BufferedOutputStream\n\n`BufferedOutputStream`\
    \ 包装 `OutputStream` 并缓冲输出以提高效率。它将数据写入缓冲区，仅当缓冲区满或流被刷新时才写入输出流。\n\n```java\nimport\
    \ java.io.BufferedOutputStream;\nimport java.io.FileOutputStream;\nimport java.io.IOException;\n\
    \npublic class BufferedOutputStreamExample {\n    public static void main(String[]\
    \ args) {\n        try (BufferedOutputStream bos = new BufferedOutputStream(new\
    \ FileOutputStream(\"example.txt\"))) {\n            String data = \"Hello, World!\"\
    ;\n            bos.write(data.getBytes());\n        } catch (IOException e) {\n\
    \            e.printStackTrace();\n        }\n    }\n}\n```\n\n### BufferedReader\
    \ and BufferedWriter\n\n缓冲字符流进一步优化了文本数据的读取和写入。\n\n`BufferedReader`: 用于高效读取字符输入流。\n\
    \n```java\nimport java.io.BufferedReader;\nimport java.io.FileReader;\nimport\
    \ java.io.IOException;\n\npublic class BufferedReaderExample {\n    public static\
    \ void main(String[] args) {\n        try (BufferedReader br = new BufferedReader(new\
    \ FileReader(\"example.txt\"))) {\n            String line;\n            while\
    \ ((line = br.readLine()) != null) {\n                System.out.println(line);\n\
    \            }\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\n"
- fmt: "\n`BufferedWriter`: Buffers the output character stream for efficient writing.\n\
    \n```java\nimport java.io.BufferedWriter;\nimport java.io.FileWriter;\nimport\
    \ java.io.IOException;\n\npublic class BufferedWriterExample {\n    public static\
    \ void main(String[] args) {\n        try (BufferedWriter bw = new BufferedWriter(new\
    \ FileWriter(\"example.txt\"))) {\n            bw.write(\"Hello, World!\");\n\
    \            bw.newLine();\n            bw.write(\"Buffered streams in Java are\
    \ efficient.\");\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\n## Benefits of Buffered Streams\n\n1. **Performance**:\
    \ Buffered streams reduce the number of I/O operations by batching reads and writes,\
    \ improving overall performance.\n2. **Efficiency**: By minimizing physical I/O\
    \ interactions, buffered streams make data transfer more efficient.\n3. **Convenience**:\
    \ Buffered streams provide convenient methods for reading and writing lines of\
    \ text, making code simpler and more readable.\n\n![](image_rsrc8AV.jpg)!![](image_rsrc8AW.jpg)\n\
    \n## Serialization and Deserialization\n\nSerialization in Java is the process\
    \ of converting an object into a byte stream, allowing it to be easily saved to\
    \ a file, sent over a network, or stored in a database. Deserialization is the\
    \ reverse process, converting the byte stream back into a copy of the original\
    \ object. This mechanism is essential for persistent storage and communication\
    \ between Java programs.\n\n### Serialization\n\nTo serialize an object, it must\
    \ implement the `Serializable` interface, which is a marker interface (an interface\
    \ with no methods). The `ObjectOutputStream` class is used to write the object\
    \ to an output stream.\n\nExample:\n\n```java\nimport java.io.FileOutputStream;\n\
    import java.io.ObjectOutputStream;\nimport java.io.Serializable;\nimport java.io.IOException;\n\
    \nclass Person implements Serializable {\n    private static final long serialVersionUID\
    \ = 1L;\n    String name;\n    int age;\n    Person(String name, int age) {\n\
    \        this.name = name;\n        this.age = age;\n    }\n}\n\npublic class\
    \ SerializationExample {\n    public static void main(String[] args) {\n     \
    \   Person person = new Person(\"John Doe\", 30);\n        try (FileOutputStream\
    \ fileOut = new FileOutputStream(\"person.ser\");\n             ObjectOutputStream\
    \ out = new ObjectOutputStream(fileOut)) {\n            out.writeObject(person);\n\
    \            System.out.println(\"Serialized data is saved in person.ser\");\n\
    \        } catch (IOException i) {\n            i.printStackTrace();\n       \
    \ }\n    }\n}\n```\n![](image_rsrc8AX.jpg)\n\n### Deserialization\n\nDeserialization\
    \ is performed using the `ObjectInputStream` class, which reads the byte stream\
    \ and converts it back into an object.\n\nExample:\n\n```java\nimport java.io.FileInputStream;\n\
    import java.io.ObjectInputStream;\nimport java.io.IOException;\n\npublic class\
    \ DeserializationExample {\n    public static void main(String[] args) {\n   \
    \     Person person = null;\n        try (FileInputStream fileIn = new FileInputStream(\"\
    person.ser\");\n             ObjectInputStream in = new ObjectInputStream(fileIn))\
    \ {\n            person = (Person) in.readObject();\n            System.out.println(\"\
