  trans: "\n\n`StringBuffer` 类是线程安全的，这意味着它的方法经过了同步处理，以确保可以在多线程环境中安全地使用。然而，这种线程安全性是以性能为代价的，导致\
    \ `StringBuffer` 比 `StringBuilder` 稍慢。\n\n### 创建 StringBuffer:\n\n```java\nStringBuffer\
    \ sb = new StringBuffer(\"Hello\");\n```\n\n### 重要方法:\n\n- **Append**: 在缓冲区末尾添加文本。\n\
    \  `sb.append(\" World\"); // \"Hello World\"`\n- **Insert**: 在指定位置插入文本。\n  `sb.insert(5,\
    \ \" Java\"); // \"Hello Java World\"`\n- **Delete**: 移除指定位置之间的文本。\n  `sb.delete(5,\
    \ 10); // \"Hello World\"`\n- **Reverse**: 反转缓冲区内容。\n  `sb.reverse(); // \"dlroW\
    \ olleH\"`\n- **Replace**: 替换指定位置之间的文本。\n  `sb.replace(0, 5, \"Hi\"); // \"Hi\
    \ World\"`\n\n![](img/image_rsrc88D.jpg)\n\n## StringBuilder\n\n`StringBuilder`\
    \ 类与 `StringBuffer` 相似，但它不是同步的，因此速度更快但不是线程安全的。它适用于不需要考虑线程安全的单线程环境。\n\n### 创建 StringBuilder:\n\
    \n```java\nStringBuilder sb = new StringBuilder(\"Hello\");\n```\n\n### 重要方法:\n\
    \n- **Append**: 在构建器末尾添加文本。\n  `sb.append(\" World\"); // \"Hello World\"`\n-\
    \ **Insert**: 在指定位置插入文本。\n  `sb.insert(5, \" Java\"); // \"Hello Java World\"\
    `\n- **Delete**: 移除指定位置之间的文本。\n  `sb.delete(5, 10); // \"Hello World\"`\n- **Reverse**:\
    \ 反转构建器内容。\n  `sb.reverse(); // \"dlroW olleH\"`\n- **Replace**: 替换指定位置之间的文本。\n\
    \  `sb.replace(0, 5, \"Hi\"); // \"Hi World\"`\n\n## 示例\n\n这是一个演示如何使用 `StringBuffer`\
    \ 和 `StringBuilder` 的示例：\n\n```java\npublic class StringBufferBuilderExample {\n\
    \    public static void main(String[] args) {\n        // 使用 StringBuffer\n  \
    \      StringBuffer stringBuffer = new StringBuffer(\"Hello\");\n        stringBuffer.append(\"\
    \ World\");\n        System.out.println(\"StringBuffer: \" + stringBuffer);\n\n\
    \        // 使用 StringBuilder\n        StringBuilder stringBuilder = new StringBuilder(\"\
    Hello\");\n        stringBuilder.append(\" World\");\n        System.out.println(\"\
    StringBuilder: \" + stringBuilder);\n\n        // 插入文本\n        stringBuffer.insert(5,\
    \ \" Java\");\n        stringBuilder.insert(5, \" Java\");\n        System.out.println(\"\
    StringBuffer after insert: \" + stringBuffer);\n        System.out.println(\"\
    StringBuilder after insert: \" + stringBuilder);\n\n        // 删除文本\n        stringBuffer.delete(5,\
    \ 10);\n        stringBuilder.delete(5, 10);\n        System.out.println(\"StringBuffer\
    \ after delete: \" + stringBuffer);\n        System.out.println(\"StringBuilder\
    \ after delete: \" + stringBuilder);\n\n        // 反转文本\n        stringBuffer.reverse();\n\
    \        stringBuilder.reverse();\n        System.out.println(\"StringBuffer after\
    \ reverse: \" + stringBuffer);\n        System.out.println(\"StringBuilder after\
