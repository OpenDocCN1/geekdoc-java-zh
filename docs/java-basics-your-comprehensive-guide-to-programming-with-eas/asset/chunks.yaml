    ## Map Interface


    The Map interface in the Java Collections Framework represents a collection of
    key-value pairs, where each key maps to a single value. Maps do not allow duplicate
    keys, and each key can map to at most one value. This interface is crucial for
    scenarios where you need to associate values with keys, like a dictionary.


    Common Implementations


    HashMap: Implements the Map interface using a hash table. It provides constant-time
    performance for basic operations (get and put), assuming the hash function disperses
    elements properly. It does not maintain any order of the keys.


    Map<String,  Integer> hashMap =  new  HashMap<>();


    hashMap.put("Apple", 1);


    hashMap.put("Banana", 2);


    hashMap.put("Cherry", 3);


    LinkedHashMap: Extends HashMap with a linked list running through its entries,
    maintaining the order of insertion or access order. It is useful for applications
    that need predictable iteration order.


    Map<String,  Integer> linkedHashMap =  new  LinkedHashMap<>();


    linkedHashMap.put("Dog", 1);


    linkedHashMap.put("Cat", 2);


    linkedHashMap.put("Bird", 3);


    TreeMap: Implements the Map interface using a red-black tree, ordering the keys
    based on their natural ordering or by a specified comparator. It guarantees that
    the map will be in ascending key order.


    Map<String,  Integer> treeMap =  new  TreeMap<>();


    treeMap.put("Red", 1);


    treeMap.put("Green", 2);


    treeMap.put("Blue", 3);


    ![](image_rsrc8AB.jpg)


    Key Methods


    put(K key, V value): Associates the specified value with the specified key in
    the map.


    map.put("Key", "Value");


    get(Object key): Returns the value to which the specified key is mapped, or null
    if this map contains no mapping for the key.


    String value =  map.get("Key");


    remove(Object key): Removes the mapping for a key from this map if it is present.


    map.remove("Key");


    containsKey(Object key): Returns true if this map contains a mapping for the specified
    key.


    boolean hasKey =  map.containsKey("Key");


    containsValue(Object value): Returns true if this map maps one or more keys to
    the specified value.


    boolean hasValue =  map.containsValue("Value");


    keySet(): Returns a Set view of the keys contained in this map.


    Set<String> keys =  map.keySet();


    values(): Returns a Collection view of the values contained in this map.


    Collection<Integer> values =  map.values();


    entrySet(): Returns a Set view of the mappings contained in this map.


    Set<Map.Entry<String,  Integer>> entries =  map.entrySet();


    Example


    Here''s an example demonstrating the usage of the Map interface:


    import  java.util.*;


    public  class  MapExample  {


    public  static  void  main(String[] args)  {


    // Create a map using HashMap


    Map<String, Integer> fruits  =  new  HashMap<>();


    fruits.put("Apple", 10);


    fruits.put("Banana", 20);


    fruits.put("Cherry", 30);


    // Access elements


    System.out.println("Apple count: "  +  fruits.get("Apple"));


    // Modify elements


    fruits.put("Banana", 25);


    System.out.println("Updated Banana count: "  +  fruits.get("Banana"));


    // Remove an element


    fruits.remove("Cherry");


    System.out.println("After removal: "  + fruits);


    // Check for a key


    if (fruits.containsKey("Apple")) {


    System.out.println("Apple is present in the map.");


    }


    // Iterate through the map


    for (Map.Entry<String, Integer> entry  :  fruits.entrySet()) {


    System.out.println(entry.getKey() +  ": "  +  entry.getValue());


    }


    }


    }


