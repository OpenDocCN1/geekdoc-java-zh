    Java Basics


    ## ![](image_rsrc87W.jpg)Data Types and Variables


    Java, like all programming languages, relies on data types and variables to store
    and manipulate data. Understanding these fundamental concepts is essential for
    writing effective Java programs.


    Data Types


    Data types in Java specify the type of data that a variable can hold. Java has
    two main categories of data types: primitive data types and reference data types.


    ![](image_rsrc87X.jpg)


    Primitive Data Types


    Primitive data types are the most basic data types available in Java. There are
    eight primitive data types:


    byte: An 8-bit signed integer. Range: -128 to 127.


    byte b =  100;


    short: A 16-bit signed integer. Range: -32,768 to 32,767.


    short s =  10000;


    int: A 32-bit signed integer. Range: -2^31 to 2^31-1.


    int i =  100000;


    long: A 64-bit signed integer. Range: -2^63 to 2^63-1.


    long l =  100000L;


    float: A single-precision 32-bit floating-point. Used for decimals.


    float f =  10.5f;


    double: A double-precision 64-bit floating-point. More precision for decimals.


    double d =  10.5;


    char: A single 16-bit Unicode character.


    char c =  ''A'';


    boolean: Represents true or false.


    boolean flag =  true;


    Reference Data Types


    Reference data types are more complex types and include classes, arrays, and interfaces.
    Variables of these types store references to objects rather than the actual data.


    String: Represents a sequence of characters.


    String str =  "Hello, Java!";


    Arrays: A collection of variables of the same type.


    int[] numbers = {1,  2,  3,  4,  5};


    Objects: Instances of classes.


    MyClass obj =  new  MyClass();


    Variables


    Variables in Java are containers that hold data. They must be declared before
    they can be used. A variable declaration specifies the data type and the variable
    name.


    int number; // Declaration


    number =  10;  // Initialization


    Variables can be classified into several categories based on their scope and usage:


    Local Variables: Declared within a method and accessible only within that method.


    public  void  myMethod() {


    int localVar =  5;


    }


    Instance Variables: Declared within a class but outside any method. These are
    non-static and each instance of the class has its own copy.


    public  class  MyClass  {


    int instanceVar;


    }


    Class Variables (Static Variables): Declared with the static keyword inside a
    class but outside any method. All instances of the class share the same variable.


    public  class  MyClass  {


    static  int staticVar;


    }


