    \ types.\n\n### Primitive Types\nPrimitive types are the most basic data types\
    \ available.\n\n- `byte`: An 8-bit signed integer. Range: -128 to 127.\n- `short`:\
    \ A 16-bit signed integer. Range: -32,768 to 32,767.\n- `int`: A 32-bit signed\
    \ integer. Range: -2^31 to 2^31-1.\n- `long`: A 64-bit signed integer. Range:\
    \ -2^63 to 2^63-1.\n- `float`: A single-precision 32-bit floating-point. Used\
    \ for decimals.\n- `double`: A double-precision 64-bit floating-point. More precision\
    \ for decimals.\n- `char`: A single 16-bit Unicode character.\n- `boolean`: Represents\
    \ true or false.\n\n### Reference Types\nReference types are more complex types\
    \ and include classes, arrays, and interfaces. Variables of these types store\
    \ references to objects rather than the actual data.\n\n- `String`: Represents\
    \ a sequence of characters.\n- `Arrays`: A collection of variables of the same\
    \ type.\n- `Objects`: Instances of classes.\n\n### Variables\nVariables are containers\
    \ that hold data. They must be declared before they can be used. A variable declaration\
    \ specifies the data type and the variable name.\n\n- **Local Variables**: Declared\
    \ within a method and accessible only within that method.\n- **Instance Variables**:\
    \ Declared within a class but outside any method. These are non-static and each\
    \ instance of the class has its own copy.\n- **Class Variables (Static Variables)**:\
    \ Declared with the `static` keyword inside a class but outside any method. All\
    \ instances of the class share the same variable.\n"
