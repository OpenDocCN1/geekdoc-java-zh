  trans: "\n安全性是 Java 中的一个首要考虑的问题，特别是由于其在网络环境中被广泛使用。Java 运行在一个名为 Java 运行时环境（`JRE`）的受控环境中，其中包含一个安全管理器和一组安全策略，这些策略限制了关键系统资源的访问。字节码验证过程确保代码在执行之前符合\
    \ Java 严格的安全和访问规则。Java 还提供了用于加密、安全通信和身份验证的 API，使得构建安全应用程序变得更容易。\n\n![](img/image_rsrc87K.jpg)\n\
    \n## 多线程\nJava 在语言层面支持多线程，允许开发者编写并发执行多个任务的程序。这对于开发响应迅速且高性能的应用程序至关重要。Java 内置线程模型包含了如\
    \ `Thread`、`Runnable` 和 `java.util.concurrent` 包等类和接口，它们为管理线程和并发提供了一个框架。提供了同步机制来防止竞态条件，并确保以线程安全的方式访问共享资源。\n\
    \n## 高性能\n虽然 Java 是一种解释型语言，但现代 JVM 的实现使用了即时编译（`JIT`）[2 来提高性能。`JIT` 编译器在运行时将字节码翻译成原生机器码，并针对特定的硬件和操作系统进行优化。这导致执行速度可以与原生编译语言相媲，有时甚至超过它们。此外，Java\
    \ 的性能还通过高效的垃圾回收 [3 算法和复杂的内存管理技术得到了进一步增强。\n\n## 可移植性\nJava 的可移植性不仅限于其平台无关性。Java\
    \ 标准库提供了一 set 在所有 JVM 实现中保持一致的全面 API。这意味着开发者无论平台如何，都可以依赖核心库的一致行为。Java 应用程序的移植性通过使用标准的数据格式和协议得到了进一步支持。\n\
    \n## 分布式计算\nJava 天生为分布式计算设计。它包含一套 API 和技术，促进了网络和分布式应用程序的。例如，Java 的远程方法调用（`RMI`）允许位于不同机器上的对象相互通信并调用对方的方法。Java\
    \ 命名和目录接口（`JNDI`）为各种命名和目录服务提供了统一的接口，更容易定位和访问分布式资源。\n\n## 动态与可扩展\nJava 是一种动态且可扩展的语言，这意味着它可以适应不断变化的环境。`JVM`\
    \ 可以在运行时动态加载类，这对于那些无需重新编译即可整合新功能的应用程序至关重要。Java 还支持反射，允许程序在运行时检查并操作自身的结构和行为。这种动态特性使\
    \ Java 具有高度适应性，适用于广泛的应用。\n\n## 丰富的标准库\nJava 标准库也称为 Java API，非常广泛，涵盖了大量功能。它包含了用于数据结构、网络、数据库访问、图形用户界面等的包。这套丰富的库极地减少了开发时间和精力的，因为开发者可以利用预构建和测试过的组件来完成常见任务。\n\
    \n![](img/image_rsrc87M.jpg)\n\n## 设置 Java 开发环境\n对于任何 Java 新手来说，设置 Java 开发环境都是关键的第一步。本节将引导你完成安装必要的工具并配置系统以开始开发\
    \ Java 应用程序。\n\n![](img/image_rsrc87N.jpg)\n\n### 第 1 ：安装 Java 开发包 (JDK)\nJava\
    \ 开发包（`JDK`）是 Java 开发的核心组件。它包含了 Java 运行时环境（`JRE`）、Java 编译器以及各种开发工具。按照以下步骤安装 `JDK`：\n\
    \n1. 下载 `JDK`：访问 [Oracle JDK 下载页面](https://www.oracle.com/java/technologies/downloads/)\
    \ 下载适用于你操作系统（Windows、macOS 或 Linux）的最新版本 `JDK`。\n\n![](img/image_rsrc87P.jpg)\n\
    \n2. 安装 `JDK`：运行安装程序并按照屏幕上的说明操作。默认安装设置通常足够了。\n\n3. 设置环境变量（可选但建议执行）：\n    * Windows：将\
    \ `JDK` 安装目录添加到 `PATH` 环境变量中。你可以通过 属性属性 -> 高级 -> 环境变量来实现，然后将 `JDK` 路径添加到 `PATH`\
    \ 变量中。\n    * macOS/Linux：通过向你的 shell 启动脚本（例如 `.bash_profile` 或 `.zshrc`）添加行 `export\
    \ PATH=/path/to/jdk/bin:$PATH` 来将 `JDK` 路径添加。\n\n### 第 2 步：验证安装\n在安装 `JDK` 之后，你应该验证它是否已正确安装：\n\
    \n1. 打开终端/命令提示符：打开你系统的终端或命令提示符。\n2. 检查 `JDK` 版本：输入 `java -version` 和 `javac -version`。你应该看到显示已安装的\
    \ `JDK` 版本和 Java 编译器的输出。\n\n### 第 3 步：安装集成开发环境 (IDE)\n`IDE` 是一种为计算机程序员提供软件开发全面设施的软件应用程序。虽然你可以使用简单的文本编辑器编写\
    \ Java 代码，但使用 `IDE` 可以通过代码补全、调试和项目管理等功能显著提高生产力。以下是一些流行的 Java `IDEs`：\n\n1. IntelliJ\
    \ IDEA：来自 JetBrains 的一个强大且功能丰富的 `IDE`。它提供免费的 Community 版和付费的 Ultimate 版。\n\n![](img/image_rsrc87R.jpg)\n\
    \n2. Eclipse：一种广泛使用的开源 `IDE`，高度可定制，并支持广泛的插件。\n3. NetBeans：另一个开源 `IDE`，易于使用并支持\
    \ Java 及其他语言。\n\n### 第 4 步：配置你的 IDE\n一旦安装了 `IDE`，你需要配置它以与 `JDK` 配合：\n\n1. 设置 `JDK`\
    \ 路径：大多数 `IDE` 在初始化时都会提示你指定 `JDK` 路径。确保该路径指向系统上的 `JDK` 安装目录。\n2. 创建新项目：按照 `IDE`\
    \ 的说明创建一个新的 Java 项目。这通常涉及指定项目名称、位置和 `JDK` 版本。\n\n当你越来越熟悉 Java 开发时，你可能想要探索额外的工具和库来增强工作流。一些实用工具包括：\n\
    \n* Maven 或 Gradle：用于管理项目依赖和自动化构建过程的构建自动化工具。\n    * [Maven](https://maven.apache.org/)\n\
    \    * [Gradle](https://gradle.org/)\n* Git：管理代码库更改的版本控制系统。\n    * [Git](https://git-scm.com/)\n\
    \n![](img/image_rsrc87S.jpg)\n\n## 编写你的 Java 程序\n编写第一个 Java 程序是你掌握 Java 之旅的激动一步。本节将引导你编写、编译和运行一个简单的\
    \ Java 程序。我们将使用经典的“Hello, World!”示例来说明这一过程。\n\n### 第 1 步：创建 Java 文件\n首先，为你的 Java\
    \ 代码创建一个文件。文件应具有 `.java` 扩展名，且名称与类名匹配。在示例中，我们将文件命名为 `HelloWorld.java`。\n\n###\
    \ 第 2 步：编写 Java 代码\n在你的 `IDE` 或文本编辑器中打开新创建的文件并输入以下代码：\n\n```java\npublic class\
    \ HelloWorld {\n    public static void main(String[] args) {\n        System.out.println(\"\
    Hello, World!\");\n    }\n}\n```\n\n![](img/image_rsrc87T.jpg)\n\n让我们拆解这段代码：\n"
- fmt: "\n### 1. Class Declaration\n`public class HelloWorld` defines a public class\
    \ named `HelloWorld`. In Java, every application begins with a class definition.\n\
    \n### 2. Main Method\n`public static void main(String[] args)` is the entry point\
    \ of any Java application. The `JVM` calls this method to start the program.\n\
    \n### 3. Print Statement\n`System.out.println(\"Hello, World!\")` is a statement\
    \ that prints \"Hello, World!\" to the console. `System.out` is the standard output\
    \ stream, and `println` is a method that prints a line of text.\n\n## Step 3:\
    \ Compile the Java Program\n\nBefore running the program, you need to compile\
    \ it. Compilation converts the human-readable Java code into bytecode that the\
    \ `JVM` can execute.\n\n1. **Open a Terminal/Command Prompt**: Navigate to the\
    \ directory where your `HelloWorld.java` file is located.\n2. **Compile the Program**:\
    \ Run the following command:\n\n```\njavac HelloWorld.java\n```\n\nThis command\
    \ invokes the Java compiler (`javac`) and compiles `HelloWorld.java`. If there\
    \ are no syntax errors, this command will produce a file named `HelloWorld.class`,\
    \ which contains the bytecode.\n\n## Step 4: Run the Java Program\n\nAfter compiling,\
    \ you can run your program:\n\n1. **Execute the Program**: In the terminal, type:\n\
    \n```\njava HelloWorld\n```\n\nThis command starts the `JVM`, which loads the\
    \ `HelloWorld.class` file and calls the `main` method. You should see the output:\n\
    \n```\nHello, World!\n```\n\n## Troubleshooting Common Issues\n\n- **File Naming**:\
    \ Ensure that the file name matches the class name and has a `.java` extension.\n\
