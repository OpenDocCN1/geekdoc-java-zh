    \n```java\npublic class BankAccount {\n    // Private attribute\n    private double\
    \ balance;\n\n    // Constructor\n    public BankAccount(double initialBalance)\
    \ {\n        if (initialBalance > 0) {\n            this.balance = initialBalance;\n\
    \        } else {\n            this.balance = 0;\n            System.out.println(\"\
    Initial balance must be positive.\");\n        }\n    }\n\n    // Public getter\
    \ method for balance\n    public double getBalance() {\n        return balance;\n\
    \    }\n\n    // Method to deposit money\n    public void deposit(double amount)\
    \ {\n        if (amount > 0) {\n            balance += amount;\n            System.out.println(\"\
    Deposited: \" + amount + \", New balance: \" + balance);\n        } else {\n \
    \           System.out.println(\"Deposit amount must be positive.\");\n      \
    \  }\n    }\n\n    // Method to withdraw money\n    public void withdraw(double\
    \ amount) {\n        if (amount > 0 && amount <= balance) {\n            balance\
    \ -= amount;\n            System.out.println(\"Withdrew: \" + amount + \", New\
    \ balance: \" + balance);\n        } else {\n            System.out.println(\"\
    Invalid withdraw amount.\");\n        }\n    }\n}\n\npublic class Main {\n   \
    \ public static void main(String[] args) {\n        // Creating a bank account\
    \ with an initial balance\n        BankAccount account = new BankAccount(1000);\n\
    \        // Depositing money\n        account.deposit(500);\n        // Outputs:\
    \ Deposited: 500.0, New balance: 1500.0\n\n        // Withdrawing money\n    \
    \    account.withdraw(300);\n        // Outputs: Withdrew: 300.0, New balance:\
    \ 1200.0\n\n        // Trying to withdraw more money than the balance\n      \
    \  account.withdraw(2000);\n        // Outputs: Invalid withdraw amount.\n\n \
    \       // Displaying the balance\n        System.out.println(\"Final balance:\
    \ \" + account.getBalance());\n        // Outputs: Final balance: 1200.0\n   \
    \ }\n}\n```\n\nIn this example:\n\n- The `BankAccount` class encapsulates the\
    \ `balance` attribute, making it private.\n- Public methods `deposit` and `withdraw`\
    \ are provided to modify the `balance`.\n- The `deposit` and `withdraw` methods\
    \ include validation to ensure that the operations are valid.\n\n## Abstraction\n\
    \nAbstraction is one of the core principles of Object-Oriented Programming (OOP)\
    \ that focuses on hiding the complex implementation details and exposing only\
    \ the essential features of an object to the outside world. This simplifies the\
    \ interaction with objects and allows developers to focus on high-level functionalities\
    \ without worrying about the underlying complexity. Abstraction is achieved through\
    \ abstract classes and interfaces in Java.\n\n#### Key Concepts of Abstraction\n\
    \n1. **Simplification**: Abstraction simplifies the interaction with objects by\
    \ exposing only the necessary details and hiding the implementation details.\n\
    2. **Modularity**: Abstraction promotes modularity by breaking down complex systems\
    \ into smaller, manageable components.\n3. **Focus on What, Not How**: Abstraction\
    \ allows developers to focus on what an object does rather than how it does it.\n\
    \n### Abstract Classes\n\nAn abstract class in Java is a class that cannot be\
    \ instantiated directly. It can have both abstract methods (methods without a\
    \ body) and concrete methods (methods with a body). Abstract classes are used\
    \ to define common characteristics and behaviors that can be inherited by subclasses.\n\
    \nHere’s an example of an abstract class:\n\n```java\n// Abstract class\npublic\
    \ abstract class Animal {\n    // Abstract method (no body)\n    public abstract\
    \ void makeSound();\n\n    // Concrete method\n    public void sleep() {\n   \
    \     System.out.println(\"The animal is sleeping.\");\n    }\n}\n\n// Subclass\n\
    public class Dog extends Animal {\n    // Implementing the abstract method\n \
    \   @Override\n    public void makeSound() {\n        System.out.println(\"Dog\
    \ barks\");\n    }\n}\n\n// Another subclass\npublic class Cat extends Animal\
    \ {\n    // Implementing the abstract method\n    public void makeSound() {\n\
    \        System.out.println(\"Cat meows\");\n    }\n}\n\npublic class Main {\n\
    \    public static void main(String[] args) {\n        Animal dog = new Dog();\n\
    \        Animal cat = new Cat();\n        dog.makeSound(); // Outputs: Dog barks\n\
    \        cat.makeSound(); // Outputs: Cat meows\n        dog.sleep();     // Outputs:\
    \ The animal is sleeping.\n    }\n}\n```\n\nIn this example:\n\n- `Animal` is\
    \ an abstract class with an abstract method `makeSound()` and a concrete method\
    \ `sleep()`.\n- `Dog` and `Cat` are subclasses that inherit from `Animal` and\
    \ implement the `makeSound()` method.\n\n### Interfaces\n\nAn interface in Java\
    \ is a reference type that can contain only abstract methods (until Java 8, when\
    \ default and static methods were introduced). Interfaces are used to define a\
    \ contract that classes can implement.\n\nHere’s an example of an interface:\n\
    \n```java\n// Interface\npublic interface Vehicle {\n    void start();\n    void\
    \ stop();\n}\n\n// Implementing the interface in a class\npublic class Car implements\
    \ Vehicle {\n    @Override\n    public void start() {\n        System.out.println(\"\
    Car is starting.\");\n    }\n\n    @Override\n    public void stop() {\n     \
    \   System.out.println(\"Car is stopping.\");\n    }\n}\n\n// Another class implementing\
    \ the interface\npublic class Motorcycle implements Vehicle {\n    @Override\n\
    \    public void start() {\n        System.out.println(\"Motorcycle is starting.\"\
    );\n    }\n\n    @Override\n    public void stop() {\n        System.out.println(\"\
    Motorcycle is stopping.\");\n    }\n}\n\npublic class Main {\n    public static\
    \ void main(String[] args) {\n        Vehicle car = new Car();\n        Vehicle\
    \ motorcycle = new Motorcycle();\n        car.start(); // Outputs: Car is starting.\n\
    \        motorcycle.start(); // Outputs: Motorcycle is starting.\n        car.stop();\
    \ // Outputs: Car is stopping.\n        motorcycle.stop(); // Outputs: Motorcycle\
    \ is stopping.\n    }\n}\n```\n\nIn this example:\n\n- `Vehicle` is an interface\
    \ with two-abstract methods: `start()` and `stop()`.\n- `Car` and `Motorcycle`\
    \ are classes that implement the `Vehicle` interface and provide implementations\
    \ for the `start()` and `stop()` methods.\n\n#### Differences Between Abstract\
    \ Classes and Interfaces\n\n- **Instantiation**: Abstract classes cannot be instantiated\
    \ directly, while interfaces cannot be instantiated at all.\n- **Methods**: Abstract\
    \ classes can have both abstract and concrete methods. Interfaces (prior to Java\
    \ 8) can only have abstract methods. Since Java 8, interfaces can have default\
    \ and static methods.\n- **Multiple Inheritance**: A class can implement multiple\
    \ interfaces, allowing for multiple inheritance of type. However, a class can\
    \ inherit from only one abstract class (single inheritance of implementation).\n\
    \n### Practical Example: Abstraction in a Library Management System\n\nLet’s consider\
    \ a practical example where abstraction is used in a library management system.\n\
    \n```java\n// Abstract class\npublic abstract class LibraryItem {\n    protected\
    \ String title;\n    protected String author;\n\n    public LibraryItem(String\
    \ title, String author) {\n        this.title = title;\n        this.author =\
    \ author;\n    }\n}\n```\n"
