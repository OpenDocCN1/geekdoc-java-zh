    ## Set Interface


    The Set interface in the Java Collections Framework represents a collection that
    does not allow duplicate elements. It models the mathematical set abstraction
    and is a subtype of the Collection interface. The Set interface ensures that each
    element is unique and provides operations to add, remove, and check for the presence
    of elements.


    Common Implementations


    HashSet: Implements the Set interface backed by a hash table. It makes no guarantees
    about the iteration order and is the best-performing implementation for most use
    cases.


    Set<String> hashSet =  new  HashSet<>();


    hashSet.add("Apple");


    hashSet.add("Banana");


    hashSet.add("Cherry");


    LinkedHashSet: Extends HashSet with a linked list running through its entries,
    maintaining the insertion order.


    Set<String> linkedHashSet =  new  LinkedHashSet<>();


    linkedHashSet.add("Dog");


    linkedHashSet.add("Cat");


    linkedHashSet.add("Bird");


    TreeSet: Implements the Set interface backed by a tree structure (specifically
    a red-black tree), which orders its elements based on their natural ordering or
    a specified comparator.


    Set<String> treeSet =  new  TreeSet<>();


    treeSet.add("Red");


    treeSet.add("Green");


    treeSet.add("Blue");


