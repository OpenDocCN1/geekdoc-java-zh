    \n## 项目：开发一个基础猜数字游戏\n\n创建一个猜数字游戏是应用你所学的 Java 基础知识的一种趣味方式，例如数据类型、控制语句和数组。这个项目将涉及生成随机数并允许用户进行猜测，在猜中正确数字之前提供反馈。\n\
    \n### 逐步实现步骤\n\n1. **设置项目**：创建一个名为 `NumberGuessingGame.java` 的新 Java 文件。\n2. **导入必要的包**：我们将使用\
    \ `Scanner` 类处理用户输入，并使用 `Random` 类生成随机数。\n\n```java\nimport java.util.Scanner;\n\
    import java.util.Random;\n```\n\n3. **类和主方法**：定义主类和主方法。\n\n```java\npublic class\
    \ NumberGuessingGame {\n    public static void main(String[] args) {\n       \
    \ // 创建用于用户输入的 Scanner 对象\n        Scanner scanner = new Scanner(System.in);\n\
    \        // 创建用于生成随机数的 Random 对象\n        Random random = new Random();\n    \
    \    // 生成一个 1 到 10 之间的随机数\n        int randomNumber = random.nextInt(10) + 1;\n\
    \        // 初始化猜测计数\n        int guessCount = 0;\n        // 用于跟踪数字是否被猜中的布尔值\n\
    \        boolean guessedCorrectly = false;\n        // 游戏介绍\n        System.out.println(\"\
    欢迎来到猜数字游戏!\");\n        System.out.println(\"我选了一个 1 到 100 之间的数字。试着猜一下！\");\n\
    \        // 循环直到猜中正确数字\n        while (!guessedCorrectly) {\n            // 提示用户输入猜测\n\
    \            System.out.print(\"输入你的猜测: \");\n            int userGuess = scanner.nextInt();\n\
    \            guessCount++;\n            // 检查猜测是否正确\n            if (userGuess\
    \ == randomNumber) {\n                guessedCorrectly = true;\n             \
    \   System.out.println(\"恭喜！你用了 \" + guessCount + \" 次尝试猜中了数字。\");\n         \
    \   } else if (userGuess < randomNumber) {\n                System.out.println(\"\
    你猜太小了。再试一次。\");\n            } else {\n                System.out.println(\"你猜太大了。再试一次。\"\
    );\n            }\n        }\n        // 关闭 scanner\n        scanner.close();\n\
    \    }\n}\n```\n\n### 代码解释\n\n#### **导入包**：\n- `import java.util.Scanner;` 导入\
    \ `Scanner` 类用于读取用户输入。\n- `import java.util.Random;` 导入 `Random` 类用于生成随机数。\n\n\
    #### **类和主方法**：\n- `public class NumberGuessingGame { ... }` 定义了主类。\n- `public\
    \ static void main(String[] args) { ... }` 定义了程序执行开始的方法。\n\n#### **创建对象**：\n-\
    \ `Scanner scanner = new Scanner(System.in);` 创建了一个 `Scanner` 对象读取用户输入。\n- `Random\
    \ random = new Random();` 创建了一个 `Random` 对象来生成随机数。\n\n#### **生成随机数**：\n- `int\
    \ randomNumber = random.nextInt(10) + 1;` 生成一个 1 到 10 之间的随机数。\n\n#### **游戏循环**：\n\
    - `while` 循环运行直到用户猜中正确数字（`!guessedCorrectly`）。\n- 在循环内部，提示用户输入他们的猜测。\n- 程序检查猜测是太高、太低还是正确，并提供相应的反馈。\n\
    \n#### **猜测计数**：\n- `int guessCount = 0;` 初始化猜测次数。\n- `guessCount++;` 每次猜测后计数加\
    \ 1。\n\n#### **结束游戏**：\n- 如果用户猜对了，将显示一条带有尝试次数的祝贺消息。\n\n#### **关闭 Scanner**：\n\
    - `scanner.close();` 关闭 `Scanner` 对象以防止资源泄漏。\n\n![](img/image_rsrc888.jpg)\n\n\
    ## 字符串操作\n\n![](img/image_rsrc889.jpg)\n\n### String 类\nJava 中的 `String` 类是处理字符序列的强大工具。它是最常用的类之一，并提供了许多用于操作和查询字符串的方法。Java\
    \ 中的字符串是不可变的，这意味着一旦创建了 `String` 对象，就无法更改。对字符串的任何修改都会导致产生一个新的 `String` 对象。\n\n\
    ### 创建字符串\n在 Java 中，有多种方式可以创建字符串：\n- **字符串字面量**：直接赋值字符串值。\n  `String greeting\
    \ = \"Hello, World!\";`\n- **使用 new 关键字**：显式创建一个新的 `String` 对象。\n  `String greeting\
    \ = new String(\"Hello, World!\");`\n- **字符数组**：从字符数组创建字符串。\n  `char[] helloArray\
    \ = {'H', 'e', 'l', 'l', 'o'};`\n\n![](img/image_rsrc88A)\n\n### String 类的重要方法\n\
    `String` 类提供了许多方法。这里是一些重要的：\n- **length**：返回字符串的长度。\n  `greeting.length()`\n-\
    \ **拼接**：连接两个字符串。\n  `\"John\" + \" \" + \"Doe\"`\n- **substring**：提取字符串的一部分。\n\
    \  `greeting.substring(0, 5)`\n- **charAt**：获取指定索引处的字符。\n  `greeting.charAt(1)`\n\
    - **相等检查**：比较两个字符串是否相等。\n  `greeting.equals(\"Hello, World!\")`\n- **忽略大小写的相等检查**：比较两个字符串是否相等，忽略大小写。\n\
    \  `greeting.equalsIgnoreCase(\"hello, world!\")`\n- **大小写转换**：将字符串转换为小写或大写。\n\
    \  `greeting.toLowerCase()`\n  `greeting.toUpperCase()`\n- **trim**：移除首尾空白符。\n\
    \  `greeting.trim()`\n- **replace**：替换字符或子字符串。\n  `greeting.replace('o', 'a')`\n\
    - **split**：根据分隔符将字符串分割为数组。\n  `greeting.split(\" \")`\n\n### 示例\n让我们来看展示 `String`\
    \ 类多种方法的综合示例：\n\n```java\npublic class StringExample {\n    public static void\
    \ main(String[] args) {\n        String message = \"Welcome to Java Programming!\"\
    ;\n\n        // 字符串长度\n        System.out.println(\"Length: \" + message.length());\n\
    \n        // 子字符串\n        System.out.println(\"Substring (0, 7): \" + message.substring(0,\
    \ 7));\n\n        // 指定索引处的字符\n        System.out.println(\"Character at index\
    \ 4: \" + message.charAt(4));\n\n        // 拼接\n        String newMessage = message.concat(\"\
    \ Enjoy your coding journey.\");\n        System.out.println(\"Concatenated message:\
    \ \" + newMessage);\n\n        // 转换为大写\n        System.out.println(\"Uppercase:\
    \ \" + message.toUpperCase());\n\n        // 替换字符\n        System.out.println(\"\
    Replace 'a' with 'o': \" + message.replace('a', 'o'));\n\n        // 相等检查\n  \
    \      boolean isEqual = message.equals(\"Welcome to Java Programming!\");\n \
    \       System.out.println(\"Is equal to 'Welcome to Java Programming!': \" +\
    \ isEqual);\n    }\n}\n```\n\n![](img/image_rsrc88B.jpg)![](img/image_rsrc88C.jpg)\n\
    \n## StringBuffer 和 StringBuilder\n在 Java 中，`StringBuffer` 和 `StringBuilder` 是用于创建可变字符串的类，可以在创建后进行修改。这与不可变的\
    \ `String` 类不同。这些类提供了高效追加、插入、删除和修改字符串内容的方法。\n\n\n"
- fmt: "\nThe `StringBuffer` class is thread-safe, meaning that its methods are synchronized\
    \ to ensure that it can be used safely in a multi-threaded environment. However,\
    \ this thread safety comes with a performance cost, making `StringBuffer` slightly\
    \ slower than `StringBuilder`.\n\n### Creating a StringBuffer:\n\n```java\nStringBuffer\
    \ sb = new StringBuffer(\"Hello\");\n```\n\n### Important Methods:\n\n- **Append**:\
    \ Adds text to the end of the buffer.\n  `sb.append(\" World\"); // \"Hello World\"\
    `\n- **Insert**: Inserts text at a specified position.\n  `sb.insert(5, \" Java\"\
    ); // \"Hello Java World\"`\n- **Delete**: Removes text between specified positions.\n\
    \  `sb.delete(5, 10); // \"Hello World\"`\n- **Reverse**: Reverses the buffer\
    \ content.\n  `sb.reverse(); // \"dlroW olleH\"`\n- **Replace**: Replaces text\
    \ between specified positions.\n  `sb.replace(0, 5, \"Hi\"); // \"Hi World\"`\n\
    \n![](image_rsrc88D.jpg)\n\n## StringBuilder\n\nThe `StringBuilder` class is similar\
    \ to `StringBuffer` but is not synchronized, making it faster but not thread-safe.\
    \ It is suitable for use in a single-threaded environment where thread safety\
    \ is not a concern.\n\n### Creating a StringBuilder:\n\n```java\nStringBuilder\
    \ sb = new StringBuilder(\"Hello\");\n```\n\n### Important Methods:\n\n- **Append**:\
    \ Adds text to the end of the builder.\n  `sb.append(\" World\"); // \"Hello World\"\
    `\n- **Insert**: Inserts text at a specified position.\n  `sb.insert(5, \" Java\"\
    ); // \"Hello Java World\"`\n- **Delete**: Removes text between specified positions.\n\
    \  `sb.delete(5, 10); // \"Hello World\"`\n- **Reverse**: Reverses the builder\
    \ content.\n  `sb.reverse(); // \"dlroW olleH\"`\n- **Replace**: Replaces text\
    \ between specified positions.\n  `sb.replace(0, 5, \"Hi\"); // \"Hi World\"`\n\
    \n## Example\n\nHere's an example demonstrating the use of both `StringBuffer`\
    \ and `StringBuilder`:\n\n```java\npublic class StringBufferBuilderExample {\n\
    \    public static void main(String[] args) {\n        // Using StringBuffer\n\
    \        StringBuffer stringBuffer = new StringBuffer(\"Hello\");\n        stringBuffer.append(\"\
    \ World\");\n        System.out.println(\"StringBuffer: \" + stringBuffer);\n\n\
    \        // Using StringBuilder\n        StringBuilder stringBuilder = new StringBuilder(\"\
    Hello\");\n        stringBuilder.append(\" World\");\n        System.out.println(\"\
    StringBuilder: \" + stringBuilder);\n\n        // Inserting text\n        stringBuffer.insert(5,\
    \ \" Java\");\n        stringBuilder.insert(5, \" Java\");\n        System.out.println(\"\
    StringBuffer after insert: \" + stringBuffer);\n        System.out.println(\"\
    StringBuilder after insert: \" + stringBuilder);\n\n        // Deleting text\n\
    \        stringBuffer.delete(5, 10);\n        stringBuilder.delete(5, 10);\n \
    \       System.out.println(\"StringBuffer after delete: \" + stringBuffer);\n\
    \        System.out.println(\"StringBuilder after delete: \" + stringBuilder);\n\
    \n        // Reversing text\n        stringBuffer.reverse();\n        stringBuilder.reverse();\n\
    \        System.out.println(\"StringBuffer after reverse: \" + stringBuffer);\n\
    \        System.out.println(\"StringBuilder after reverse: \" + stringBuilder);\n\
    \    }\n}\n```\n\n![](image_rsrc88E.jpg)![](image_rsrc88F.jpg)\n\n## String Methods\n\
    \nThe `String` class in Java provides a wide range of methods for manipulating\
    \ and querying strings. These methods make it easy to perform various operations\
    \ such as searching, comparing, and modifying strings. Here are some of the most\
    \ commonly used methods along with examples:\n\n### Length\nReturns the length\
    \ of the string.\n```java\nString str = \"Hello, World!\";\nint length = str.length();\
    \ // 13\n```\n\n### CharAt\nReturns the character at a specified index.\n```java\n\
    char ch = str.charAt(1); // 'e'\n```\n\n### Substring\nExtracts a part of the\
    \ string.\n```java\nString sub = str.substring(0, 5); // \"Hello\"\n```\n\n###\
    \ Equals\nCompares two strings for equality.\n```java\nboolean isEqual = str.equals(\"\
    Hello, World!\");\n```\n\n### EqualsIgnoreCase\nCompares two strings for equality,\
    \ ignoring case considerations.\n```java\nboolean isEqualIgnoreCase = str.equalsIgnoreCase(\"\
    hello, world!\");\n```\n\n### CompareTo\nCompares two strings lexicographically.\n\
    ```java\nint result = str.compareTo(\"Hello, Java!\"); // positive, negative,\
    \ or zero\n```\n\n### IndexOf\nReturns the index of the first occurrence of a\
    \ character or substring.\n```java\nint index = str.indexOf('o'); // 4\nint indexSub\
    \ = str.indexOf(\"World\"); // 7\n```\n\n### LastIndexOf\nReturns the index of\
    \ the last occurrence of a character or substring.\n```java\nint lastIndex = str.lastIndexOf('o');\
    \ // 8\n```\n\n![](image_rsrc88G.jpg)\n\n### ToLowerCase\nConverts the string\
    \ to lower case.\n```java\nString lower = str.toLowerCase(); // \"hello, world!\"\
    \n```\n\n### ToUpperCase\nConverts the string to upper case.\n```java\nString\
    \ upper = str.toUpperCase(); // \"HELLO, WORLD!\"\n```\n\n### Trim\nRemoves leading\
    \ and trailing whitespace.\n```java\nString trimmed = str.trim(); // \"Hello,\
    \ World!\"\n```\n\n### Replace\nReplaces occurrences of a character or substring\
    \ with another character or substring.\n```java\nString replaced = str.replace('o',\
    \ 'a'); // \"Hella, Warld!\"\nString replacedSub = str.replace(\"World\", \"Java\"\
    ); // \"Hello, Java!\"\n```\n\n### Split\nSplits the string into an array based\
    \ on a delimiter.\n```java\nString[] words = str.split(\", \"); // [\"Hello\"\
    , \"World!\"]\n```\n\n### ValueOf\nReturns the string representation of various\
    \ data types.\n```java\nString value = String.valueOf(10);\n```\n\n## Example\n\
    \nHere's an example demonstrating several `String` methods:\n\n```java\npublic\
    \ class StringMethods {\n    public static void main(String[] args) {\n      \
    \  String message = \"Hello, World!\";\n\n        // Length\n        System.out.println(\"\
    Length: \" + message.length());\n\n        // CharAt\n        System.out.println(\"\
    Char at index 1: \" + message.charAt(1));\n\n        // Substring\n        System.out.println(\"\
    Substring (0, 5): \" + message.substring(0, 5));\n\n        // Equals\n      \
    \  System.out.println(\"Is equal: \" + message.equals(\"Hello, World!\"));\n\n\
    \        // EqualsIgnoreCase\n        System.out.println(\"Is equal ignore case:\
    \ \" + message.equalsIgnoreCase(\"hello, world!\"));\n\n        // CompareTo\n\
    \        System.out.println(\"Compare to: \" + message.compareTo(\"Hello, Java!\"\
    ));\n\n        // IndexOf\n        System.out.println(\"Index of 'o': \" + message.indexOf('o'));\n\
    \        System.out.println(\"Index of 'World': \" + message.indexOf(\"World\"\
    ));\n\n        // LastIndexOf\n        System.out.println(\"Last index of 'o':\
    \ \" + message.lastIndexOf('o'));\n\n        // ToLowerCase\n        System.out.println(\"\
    Lower: \" + message.toLowerCase());\n\n        // ToUpperCase\n        System.out.println(\"\
    Upper: \" + message.toUpperCase());\n\n        // Trim\n        System.out.println(\"\
    Trimmed: \" + message.trim());\n\n        // Replace\n        System.out.println(\"\
    Replace 'o' with 'a': \" + message.replace('o', 'a'));\n        System.out.println(\"\
    Replace 'World' with 'Java': \" + message.replace(\"World\", \"Java\"));\n\n \
    \       // Split\n        String[] parts = message.split(\", \");\n        for\
    \ (String part : parts) {\n            System.out.println(\"Part: \" + part);\n\
    \        }\n    }\n}\n```\n\n![](image_rsrc88H.jpg)![](image_rsrc88J.jpg)\n\n\
    ## Regular Expressions\n\nRegular expressions (regex) are powerful tools for pattern\
    \ matching and manipulation of strings. They allow you to define search patterns\
    \ using specialized syntax.\n\n### Basic Syntax\n\nRegular expressions consist\
    \ of literal characters and special metacharacters:\n\n- **Literal Characters**:\
    \ Match themselves (e.g., `a` matches `a`).\n- **Metacharacters**: Special characters\
    \ that define patterns (e.g., `.` matches any character, `*` means zero or more\
    \ of the preceding element).\n\n### Common Metacharacters and Constructs\n\n-\
    \ `.`: Matches any single character except newline.\n  `\"a.c\".matches(\"abc\"\
    ) // true`\n- `\\d`: Matches any digit (0-9).\n  `\"123\".matches(\"\\\\d+\")\
    \ // true`\n- `\\w`: Matches any word character (alphanumeric and underscore).\n\
    \  `\"word_1\".matches(\"\\\\w+\") // true`\n- `\\s`: Matches any whitespace character.\n\
    \  `\" \".matches(\"\\\\s\") // true`\n- `^`: Matches the start of a string.\n\
    \  `\"^abc\".matches(\"^abc.*\") // true for \"abc\" at the start`\n- `$`: Matches\
    \ the end of a string.\n  `\"abc$\".matches(\".*abc$\") // true for \"abc\" at\
    \ the end`\n- `[abc]`: Matches any character inside the brackets.\n  `\"a\".matches(\"\
    [abc]\") // true`\n- `[^abc]`: Matches any character not inside the brackets.\n\
    \  `\"d\".matches(\"[^abc]\") // true`\n- `(a|b)`: Matches either a or b.\n  `\"\
    a\".matches(\"(a|b)\") // true`\n- **Quantifiers**: Specify the number of occurrences.\n\
    \  - `*`: Zero or more\n  - `+`: One or more\n  - `?`: Zero or one\n  - `{n}`:\
    \ Exactly n times\n  - `{n,}`: At least n times\n  - `{n,m}`: Between n and m\
    \ times\n\n![](image_rsrc88K.jpg)\n\n### Using Regular Expressions in Java\n\n\
    In Java, the `Pattern` and `Matcher` classes from the `java.util.regex` package\
    \ are used to work with regular expressions.\n\n#### Example:\n\n```java\nimport\
    \ java.util.regex.*;\n\npublic class RegexExample {\n    public static void main(String[]\
    \ args) {\n        String text = \"The quick brown fox jumps over the lazy dog.\"\
    ;\n        String patternString = \"\\\\b\\\\w{3,5}\\\\b\";\n        Pattern pattern\
    \ = Pattern.compile(patternString);\n        Matcher matcher = pattern.matcher(text);\n\
    \n        while (matcher.find()) {\n            System.out.println(\"Found: \"\
    \ + matcher.group());\n        }\n    }\n}\n```\n"
