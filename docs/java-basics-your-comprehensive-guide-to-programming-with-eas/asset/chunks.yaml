    allows one class (called the subclass or derived class) to inherit the attributes
    and methods of another class (called the superclass or base class). This promotes
    code reuse and establishes a natural hierarchy between classes.


    Purpose of Inheritance


    Inheritance provides several key benefits:


    1.  Code Reusability: By inheriting from a superclass, a subclass can reuse code
    that is already defined, reducing redundancy and promoting code reuse.


    2.  Hierarchical Organization: Inheritance helps organize classes into a hierarchical
    structure, making it easier to understand and maintain complex systems.


    3.  Extensibility: Subclasses can extend the functionality of the superclass by
    adding new attributes and methods or by overriding existing methods.


    Defining Inheritance


    In Java, inheritance is achieved using the extends keyword. A subclass extends
    a superclass, inheriting its attributes and methods. Here’s a basic example:


    // Superclass


    public  class  Vehicle  {


    // Attributes


    protected  String brand;


    protected  int year;


    // Constructor


    public  Vehicle(String  brand, int  year)  {


    this.brand  = brand;


    this.year  = year;


    }


    // Method


    public  void  displayInfo()  {


    System.out.println("Brand: "  + brand +  ", Year: "  + year);


    }


    }


    // Subclass


    public  class  Car  extends  Vehicle  {


    // Additional attribute


    private  String model;


    // Constructor


    public  Car(String  brand, int  year, String  model)  {


    super(brand, year); // Call to superclass constructor


    this.model  = model;


    }


    // Method


    public  void  displayModel()  {


    System.out.println("Model: "  + model);


    }


    }


    ![](image_rsrc892.jpg)


    In this example:


    *   Vehicle is the superclass with attributes brand and year and a method displayInfo().


    *   Car is the subclass that extends Vehicle and adds an additional attribute
    model and a method displayModel().


    Using Inheritance


    To use inheritance, create an object of the subclass and call its methods:


    public  class  Main  {


    public  static  void  main(String[] args)  {


    // Creating an object of the Car class


    Car  myCar  =  new  Car("Toyota", 2022, "Corolla");


    // Calling methods from both the superclass and subclass


    myCar.displayInfo(); // Method from superclass


    myCar.displayModel(); // Method from subclass


    }


    }


    In this code snippet, the myCar object of the Car class can access methods from
    both the Vehicle superclass and the Car subclass.


    Types of Inheritance


    Java supports different types of inheritance:


    Single Inheritance: A subclass inherits from one superclass. This is the most
    common form of inheritance in Java.


    public  class  Animal  {


    // Attributes and methods of Animal


    }


    public  class  Dog  extends  Animal  {


    // Attributes and methods of Dog


    }


    Multilevel Inheritance: A subclass inherits from another subclass, creating a
    chain of inheritance.


    public  class  Animal  {


    // Attributes and methods of Animal


    }


    public  class  Mammal  extends  Animal  {


    // Attributes and methods of Mammal


    }


    public  class  Dog  extends  Mammal  {


    // Attributes and methods of Dog


    }


    Hierarchical Inheritance: Multiple subclasses inherit from a single superclass.


    public  class  Animal  {


    // Attributes and methods of Animal


    }


    public  class  Dog  extends  Animal  {


    // Attributes and methods of Dog


    }


    public  class  Cat  extends  Animal  {


    // Attributes and methods of Cat


    }


    Note: Java does not support multiple inheritance (a subclass inheriting from multiple
    superclasses) directly to avoid complexity and ambiguity. However, multiple inheritance
    can be achieved using interfaces.


    Overriding Methods


    In a subclass, you can override methods of the superclass to provide a specific
    implementation. Method overriding allows a subclass to define a behavior that
    is specific to its type.


    public  class  Vehicle  {


    public  void  start()  {


    System.out.println("Vehicle is starting");


    }


    }


    public  class  Car  extends  Vehicle  {


    // Overriding the start method


    @Override


    public  void  start()  {


    System.out.println("Car is starting");


    }


    }


    In this example, the Car class overrides the start() method of the Vehicle class
    to provide a specific implementation.


    To call the overridden method:


    public  class  Main  {


    public  static  void  main(String[] args)  {


    Car  myCar  =  new  Car();


    myCar.start(); // Calls the overridden start method in Car


    }


    }


    The super Keyword


    The super keyword is used in the subclass to refer to the superclass. It is often
    used to call the superclass’s constructor or methods.


    Calling Superclass Constructor


    public  class  Vehicle  {


    protected  String brand;


    protected  int year;


    public  Vehicle(String  brand, int  year)  {


    this.brand  = brand;


    this.year  = year;


    }


    }


    public  class  Car  extends  Vehicle  {


    private  String model;


    public  Car(String  brand, int  year, String  model)  {


    super(brand, year); // Call to superclass constructor


    this.model  = model;


    }


    }


    Calling Superclass Method


    public  class  Vehicle  {


    public  void  start()  {


    System.out.println("Vehicle is starting");


    }


    }


    public  class  Car  extends  Vehicle  {


    @Override


    public  void  start()  {


    super.start(); // Call to superclass method


    System.out.println("Car is starting");


    }


    }


