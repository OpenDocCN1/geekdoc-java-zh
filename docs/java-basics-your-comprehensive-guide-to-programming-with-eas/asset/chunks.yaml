  trans: "\nJava 集合框架的主要优势之一是其一致性和灵活性。该框架包含了排序和搜索等算法，这些算法可以在集合上操作并提供执行常见任务的标准方法。此外，该框架支持泛型，允许开发者创建类型安全的集合，从而减少运行时错误。\n\
    \n## 核心接口及其作用\n\n1. `Collection`：所有集合类型的根接口，定义了添加、删除和检查元素等基本操作。\n2. `List`：扩展了\
    \ `Collection`，表示元素的有序序列。常见的实现类包括 `ArrayList` 和 `LinkedList`。\n3. `Set`：扩展了 `Collection`，表示没有重复元素的集合。常见的实现类包括\
    \ `HashSet` 和 `TreeSet`。\n4. `Map`：表示键值对集合，提供了基于键的高效检索。常见的实现类包括 `HashMap` 和 `TreeMap`。\n\
    \n## 使用 Java 集合框架的好处\n\n- **可用性**：提供了开箱用的数据结构和算法，减少了对自定义实现的需求。\n- **性能**：为各种类型的集合提供了高性能的实现。\n\
    - **灵活性**：支持不同类型的集合，并允许在不同实现之间易于切换。\n- **类型安全**：利用泛型来确保类型安全并减少运行时错误。\n- **一致性**：确保不同类型集合之间具有一致的且可预测的行为。\n\
    \n### 示例\n\n这是一个展示集合框架使用的简单示例：\n\n```java\nimport java.util.*;\n\npublic class\
    \ CollectionsExample {\n    public static void main(String[] args) {\n       \
    \ // 创建一个字符串列表\n        List<String> fruits = new ArrayList<>();\n        fruits.add(\"\
    Apple\");\n        fruits.add(\"Banana\");\n        fruits.add(\"Cherry\");\n\n\
    \        // 遍历列表\n        for (String fruit : fruits) {\n            System.out.println(fruit);\n\
    \        }\n\n        // 创建一个整数集合\n        Set<Integer> numbers = new HashSet<>();\n\
    \        numbers.add(1);\n        numbers.add(2);\n        numbers.add(3);\n\n\
    \        // 检查数字是否在集合中\n        if (numbers.contains(2)) {\n            System.out.println(\"\
    The set contains 2\");\n        }\n\n        // 创建一个字符串-整数对的映射\n        Map<String,\
    \ Integer> ages = new HashMap<>();\n        ages.put(\"Alice\", 30);\n       \
    \ ages.put(\"Bob\", 25);\n\n        // 从映射中获取年龄\n        int age = ages.get(\"\
    Alice\");\n        System.out.println(\"Alice's age is \" + age);\n    }\n}\n\
    ```\n\n![](img/image_rsrc8A3.jpg)![](img/image_rsrc8A4.jpg)\n\n## List 接口\n\n\
    Java 集合框架中的 `List` 接口表示一个有序集合（也称为序列）。List 可以包含重复元素，并通过其整数索引访问元素，从而允许精确控制每个元素插入的位置。`List`\
    \ 接口扩展了 `Collection` 接口，并提供了额外的方法来操作元素的顺序和位置。\n\n![](img/image_rsrc8A5.jpg)\n\n\
    ### 常见实现类\n\n- `ArrayList`：`List` 接口的可变长度数组实现。它提供了快速的随机访问，并且对于通过索引检索和设置值非常高效。然而，由于需要移动元素，对于涉及在列表中间插入或删除元素的操作，它的较慢。\n\
    ```java\nList<String> arrayList = new ArrayList<>();\narrayList.add(\"Apple\"\
    );\narrayList.add(\"Banana\");\narrayList.add(\"Cherry\");\n```\n- `LinkedList`：`List`\
    \ 接口的双向链表实现。对于列表中间的插入和删除，它提供了比 `ArrayList` 更好的性能。然而，由于需要遍历列表，它的随机访问较慢。\n```java\n\
    List<String> linkedList = new LinkedList<>();\nlinkedList.add(\"Dog\");\nlinkedList.add(\"\
    Cat\");\nlinkedList.add(\"Bird\");\n```\n- `Vector`：与 `ArrayList` 类似但它是同步的，使其是线程安全的。由于同步的开销，通常不被优选。\n\
    ```java\nList<String> vector = new Vector<>();\nvector.add(\"Red\");\nvector.add(\"\
    Green\");\nvector.add(\"Blue\");\n```\n\n### 核心方法\n\n- `add(E element)`：将指定的元素添加到列表末尾。\n\
    `list.add(\"Element\");`\n- `add(int index, E element)`：将指定的元素插入到列表的指定位置。\n`list.add(1,\
    \ \"InsertedElement\");`\n- `get(int index)`：返回列表中指定位置的元素。\n`String element =\
    \ list.get(0);`\n- `remove(int index)`：移除列表中指定位置的元素。\n`list.remove(2);`\n- `set(int\
    \ index, E element)`：用指定的元素替换列表中指定位置的元素。\n`list.set(1, \"NewElement\");`\n- `indexOf(Object\
    \ o)`：返回指定元素在列表中首次出现的索引，如果列表不包含该元素，则返回 -1。\n`int index = list.indexOf(\"Element\"\
    );`\n- `size()`：返回列表中的元素数量。\n`int size = list.size();`\n\n### 示例\n\n这是一个展示使用 `List`\
    \ 接口的示例：\n\n```java\nimport java.util.*;\n\npublic class ListExample {\n    public\
    \ static void main(String[] args) {\n        // 使用 ArrayList 创建列表\n        List<String>\
    \ fruits = new ArrayList<>();\n        fruits.add(\"Apple\");\n        fruits.add(\"\
    Banana\");\n        fruits.add(\"Cherry\");\n\n        // 访问元素\n        String\
    \ first = fruits.get(0);\n        System.out.println(\"First fruit: \" + first);\n\
    \n        // 修改元素\n        fruits.set(1, \"Blueberry\");\n\n        // 移除元素\n\
    \        fruits.remove(\"Cherry\");\n\n        // 列表大小\n        System.out.println(\"\
    Size: \" + fruits.size());\n\n        // 遍历列表\n        for (String fruit : fruits)\
    \ {\n            System.out.println(fruit);\n        }\n    }\n}\n```\n\n![](img/image_rsrc8A6.jpg)![](img/image_rsrc8A7.jpg)\n\
    \n## Set 接口\n\n`Set` 接口在集合集合中表示不允许重复元素的集合。它模拟了集合抽象，是 `Collection` 接口的子类型。`Set`\
    \ 确保元素唯一。\n\n### 常见实现\n\n- `HashSet`：由哈希表实现的 `Set`。它不保证迭代顺序，并且是大多数用例中性能最好的实现。\n\
    ```java\nSet<String> hashSet = new HashSet<>();\nhashSet.add(\"Apple\");\nhashSet.add(\"\
    Banana\");\nhashSet.add(\"Cherry\");\n```\n- `LinkedHashSet`：带有链接链表的 `HashSet`，维护插入顺序。\n\
    ```java\nSet<String> linkedHashSet = new LinkedHashSet<>();\nlinkedHashSet.add(\"\
    Dog\");\nlinkedHashSet.add(\"Cat\");\nlinkedHashSet.add(\"Bird\");\n```\n- `TreeSet`：由树结构（具体为红黑树）实现的\
    \ `Set`，它根据自然排序或指定的比较器对元素排序。\n```java\nSet<String> treeSet = new TreeSet<>();\n\
    treeSet.add(\"Red\");\ntreeSet.add(\"Green\");\ntreeSet.add(\"Blue\");\n```\n\n\
    ![](img/image_rsrc88.jpg)\n\n### 核心方法\n\n- `add(E e)`：如果元素不存在，则将指定的元素添加到集合。\n\
    `set.add(\"Element\");`\n- `remove(Object o)`：如果元素存在，则从集合中移除。\n`set.remove(\"\
    Element\");`\n- `contains(Object o)`：如果集合包含指定的元素，则返回 true。\n`boolean contains\
    \ = set.contains(\"Element\");`\n- `size()`：返回集合中的元素数量。\n`int size = set.size();`\n\
    - `isEmpty()`：如果集合不包含任何元素，则返回 true。\n`boolean isEmpty = set.isEmpty();`\n- `clear()`：移除集合中的所有元素。\n\
    `set.clear();`\n\n### 示例\n\n这是一个展示使用 `Set` 接口的示例：\n\n```java\nimport java.util.*;\n\
    \npublic class SetExample {\n    public static void main(String[] args) {\n  \
    \      // 使用 HashSet 创建集合\n        Set<String> fruits = new HashSet<>();\n   \
    \     fruits.add(\"Apple\");\n        fruits.add(\"Banana\");\n        fruits.add(\"\
    Cherry\");\n        fruits.add(\"Banana\"); // 重复元素，不会被添加\n\n        // 检查是否存在\n\
    \        if (fruits.contains(\"Apple\")) {\n            System.out.println(\"\
    Set contains Apple\");\n        }\n\n        // 遍历集合\n        for (String fruit\
    \ : fruits) {\n            System.out.println(fruit);\n        }\n    }\n}\n```\n"
- fmt: "\n```java\n// Remove an element\nfruits.remove(\"Banana\");\n\nSystem.out.println(\"\
    Set after removing Banana: \" + fruits);\n\n// Iterate through the set\nfor (String\
    \ fruit : fruits) {\n    System.out.println(fruit);\n}\n\n// Create a set using\
    \ TreeSet\nSet<String> colors = new TreeSet<>();\ncolors.add(\"Red\");\ncolors.add(\"\
    Green\");\ncolors.add(\"Blue\");\n\n// Iterate through the TreeSet\nfor (String\
    \ color : colors) {\n    System.out.println(color); // Output will be in sorted\
    \ order\n}\n\n}\n}\n```\n\n![](image_rsrc8A9.jpg)!(image_rsrc8AA.jpg)\n\n# Map\
    \ Interface\n\nThe `Map` interface in the Java Collections Framework represents\
    \ a collection of key-value pairs, where each key maps to a single value. Maps\
    \ do not allow duplicate keys, and each key can map to at most one value. This\
    \ interface is crucial for scenarios where you need to associate values with keys,\
    \ like a dictionary.\n\n### Common Implementations\n\n- **HashMap**: Implements\
    \ the `Map` interface using a hash table. It provides constant-time performance\
    \ for basic operations (`get` and `put`), assuming the hash function disperses\
    \ elements properly. It does not maintain any order of the keys.\n```java\nMap<String,\
    \ Integer> hashMap = new HashMap<>();\nhashMap.put(\"Apple\", 1);\nhashMap.put(\"\
    Banana\", 2);\nhashMap.put(\"Cherry\", 3);\n```\n\n- **LinkedHashMap**: Extends\
    \ `HashMap` with a linked list running through its entries, maintaining the order\
    \ of insertion or access order. It is useful for applications that need predictable\
    \ iteration order.\n\n```java\nMap<String, Integer> linkedHashMap = new LinkedHashMap<>();\n\
    linkedHashMap.put(\"Dog\", 1);\nlinkedHashMap.put(\"Cat\", 2);\nlinkedHashMap.put(\"\
    Bird\", 3);\n```\n\n- **TreeMap**: Implements the `Map` interface using a red-black\
    \ tree, ordering the keys based on their natural ordering or by a specified comparator.\
    \ It guarantees that the map will be in ascending key order.\n\n```java\nMap<String,\
    \ Integer> treeMap = new TreeMap<>();\ntreeMap.put(\"Red\", 1);\ntreeMap.put(\"\
    Green\", 2);\ntreeMap.put(\"Blue\", 3);\n```\n\n![](image_rsrc8AB.jpg)\n\n###\
    \ Key Methods\n\n- `put(K key, V value)`: Associates the specified value with\
    \ the specified key in the map.\n```java\nmap.put(\"Key\", \"Value\");\n```\n\n\
    - `get(Object key)`: Returns the value to which the specified key is mapped, or\
    \ `null` if this map contains no mapping for the key.\n```java\nString value =\
    \ map.get(\"Key\");\n```\n\n- `remove(Object key)`: Removes the mapping for a\
    \ key from this map if it is present.\n```java\nmap.remove(\"Key\");\n```\n\n\
    - `containsKey(Object key)`: Returns `true` if this map contains a mapping for\
    \ the specified key.\n```java\nboolean hasKey = map.containsKey(\"Key\");\n```\n\
    \n- `containsValue(Object value)`: Returns `true` if this map maps one or more\
    \ keys to the specified value.\n```java\nboolean hasValue = map.containsValue(\"\
    Value\");\n```\n\n- `keySet()`: Returns a `Set` view of the keys contained in\
    \ this map.\n```java\nSet<String> keys = map.keySet();\n```\n\n- `values()`: Returns\
    \ a `Collection` view of the values contained in this map.\n```java\nCollection<Integer>\
    \ values = map.values();\n```\n\n- `entrySet()`: Returns a `Set` view of the mappings\
    \ contained in this map.\n```java\nSet<Map.Entry<String, Integer>> entries = map.entrySet();\n\
    ```\n\n### Example\n\nHere's an example demonstrating the usage of the `Map` interface:\n\
    \n```java\nimport java.util.*;\n\npublic class MapExample {\n    public static\
    \ void main(String[] args) {\n        // Create a map using HashMap\n        Map<String,\
    \ Integer> fruits = new HashMap<>();\n        fruits.put(\"Apple\", 10);\n   \
    \     fruits.put(\"Banana\", 20);\n        fruits.put(\"Cherry\", 30);\n\n   \
    \     // Access elements\n        System.out.println(\"Apple count: \" + fruits.get(\"\
    Apple\"));\n\n        // Modify elements\n        fruits.put(\"Banana\", 25);\n\
    \        System.out.println(\"Updated Banana count: \" + fruits.get(\"Banana\"\
    ));\n\n        // Remove an element\n        fruits.remove(\"Cherry\");\n    \
    \    System.out.println(\"After removal: \" + fruits);\n\n        // Check for\
    \ a key\n        if (fruits.containsKey(\"Apple\")) {\n            System.out.println(\"\
    Apple is present in the map.\");\n        }\n\n        // Iterate through the\
    \ map\n        for (Map.Entry<String, Integer> entry : fruits.entrySet()) {\n\
    \            System.out.println(entry.getKey() + \": \" + entry.getValue());\n\
    \        }\n    }\n}\n```\n\n![](image_rsrc8AC.jpg)!(image_rsrc8AD.jpg)\n\n# Iterating\
    \ through Collections\n\nIterating through collections in Java is a fundamental\
    \ task that allows you to access and manipulate each element in a collection.\
    \ There are several ways to iterate through collections, each suited for different\
    \ use cases and collection types. Let's explore the most common methods.\n\n###\
    \ Using for-each Loop\n\nThe `for-each` loop, introduced in Java 5, is a concise\
    \ and readable way to iterate over collections. It's suitable for when you don't\
    \ need to modify the collection during iteration.\n\n```java\nList<String> fruits\
    \ = Arrays.asList(\"Apple\", \"Banana\", \"Cherry\");\nfor (String fruit : fruits)\
    \ {\n    System.out.println(fruit);\n}\n```\n\n### Using Iterator\n\nThe `Iterator`\
    \ interface provides methods to traverse a collection and remove elements safely.\
    \ It's more flexible than the `for-each` loop, especially when you need to remove\
    \ elements during iteration.\n\n```java\nList<String> fruits = Arrays.asList(\"\
    Apple\", \"Banana\", \"Cherry\");\nIterator<String> iterator = fruits.iterator();\n\
    while (iterator.hasNext()) {\n    String fruit = iterator.next();\n    System.out.println(fruit);\n\
    }\n```\n\n### Using ListIterator\n\n`ListIterator` is a specialized iterator for\
    \ lists, allowing bidirectional traversal.\n\n```java\nList<String> fruits = Arrays.asList(\"\
    Apple\", \"Banana\", \"Cherry\");\nListIterator<String> listIterator = fruits.listIterator();\n\
    while (listIterator.hasNext()) {\n    String fruit = listIterator.next();\n  \
    \  if (\"Banana\".equals(fruit)) {\n        iterator.remove(); // Safe removal\n\
    \    }\n}\n```\n\n### Using Streams\n\nJava 8 introduced the `Stream` API, providing\
    \ a functional approach to iterate on collections.\n\n```java\nList<String> fruits\
    \ = Arrays.asList(\"Apple\", \"Banana\", \"Cherry\");\nfruits.stream()\n    .filter(fruit\
    \ -> fruit.startsWith(\"A\"))\n    .forEach(System.out::println);\n```\n\n###\
    \ Using forEach Method\n\nThe `forEach` method, introduced in Java 8, allows iteration\
    \ using lambda expressions, making the code concise and expressive.\n\n```java\n\
    List<String> fruits = Arrays.asList(\"Apple\", \"Banana\", \"Cherry\");\nfruits.forEach(fruit\
    \ -> System.out.println(fruit));\n```\n\n### Example\n\nHere's a comprehensive\
    \ example that demonstrates various ways to iterate through a collection:\n\n\
    ```java\nimport java.util.*;\nimport java.util.stream.*;\n\npublic class CollectionIterationExample\
    \ {\n    public static void main(String[] args) {\n        List<String> fruits\
    \ = new ArrayList<>(Arrays.asList(\"Apple\", \"Banana\", \"Cherry\"));\n\n   \
    \     // Using for-each loop\n        for (String fruit : fruits) {\n        \
    \    System.out.println(\"For-each loop: \" + fruit);\n        }\n\n        //\
    \ Using Iterator\n        Iterator<String> iterator = fruits.iterator();\n   \
    \     while (iterator.hasNext()) {\n            String fruit = iterator.next();\n\
    \            System.out.println(\"Iterator: \" + fruit);\n        }\n\n      \
    \  // Using ListIterator\n        ListIterator<String> listIterator = fruits.listIterator();\n\
    \        while (listIterator.hasNext()) {\n            String fruit = listIterator.next();\n\
    \            if (\"Banana\".equals(fruit)) {\n                listIterator.set(\"\
    Blueberry\"); // Modify the current element\n            }\n        }\n\n    \
    \    // Using Streams\n        fruits.stream()\n            .filter(fruit -> fruit.startsWith(\"\
