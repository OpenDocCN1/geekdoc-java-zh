    Abstract Classes


    An abstract class in Java is a class that cannot be instantiated directly. It
    can have both abstract methods (methods without a body) and concrete methods (methods
    with a body). Abstract classes are used to define common characteristics and behaviors
    that can be inherited by subclasses.


    Here’s an example of an abstract class:


    // Abstract class


    public  abstract  class  Animal  {


    // Abstract method (no body)


    public  abstract  void  makeSound();


    // Concrete method


    public  void  sleep()  {


    System.out.println("The animal is sleeping.");


    }


    }


    // Subclass


    public  class  Dog  extends  Animal  {


    // Implementing the abstract method


    @Override


    public  void  makeSound()  {


    System.out.println("Dog barks");


    }


    }


    // Another subclass


    public  class  Cat  extends  Animal  {


    // Implementing the abstract method


    @Override


    public  void  makeSound()  {


    System.out.println("Cat meows");


    }


    }


    public  class  Main  {


    public  static  void  main(String[] args)  {


    Animal  myDog  =  new  Dog();


    Animal  myCat  =  new  Cat();


    myDog.makeSound(); // Outputs: Dog barks


    myCat.makeSound(); // Outputs: Cat meows


    myDog.sleep(); // Outputs: The animal is sleeping.


    myCat.sleep(); // Outputs: The animal is sleeping.


    }


    }


    In this example:


    *   Animal is an abstract class with an abstract method makeSound() and a concrete
    method sleep().


    *   Dog and Cat are subclasses that inherit from Animal and provide implementations
    for the makeSound() method.


    Interfaces


    An interface in Java is a reference type that can contain only abstract methods
    (until Java 8, when default and static methods were introduced). Interfaces are
    used to define a contract that classes can implement, specifying what methods
    they must provide.


    Here’s an example of an interface:


    // Interface


    public  interface  Vehicle  {


    void  start();


    void  stop();


    }


    // Implementing the interface in a class


    public  class  Car  implements  Vehicle  {


    @Override


    public  void  start()  {


    System.out.println("Car is starting.");


    }


    @Override


    public  void  stop()  {


    System.out.println("Car is stopping.");


    }


    }


    // Another class implementing the interface


    public  class  Motorcycle  implements  Vehicle  {


    @Override


    public  void  start()  {


    System.out.println("Motorcycle is starting.");


    }


    @Override


    public  void  stop()  {


    System.out.println("Motorcycle is stopping.");


    }


    }


    public  class  Main  {


    public  static  void  main(String[] args)  {


    Vehicle  myCar  =  new  Car();


    Vehicle  myMotorcycle  =  new  Motorcycle();


    myCar.start(); // Outputs: Car is starting.


    myMotorcycle.start(); // Outputs: Motorcycle is starting.


    myCar.stop(); // Outputs: Car is stopping.


    myMotorcycle.stop(); // Outputs: Motorcycle is stopping.


    }


    }


    In this example:


    *   Vehicle is an interface with two abstract methods: start() and stop().


    *   Car and Motorcycle are classes that implement the Vehicle interface and provide
    implementations for the start() and stop() methods.


    Differences Between Abstract Classes and Interfaces


    *   Instantiation: Abstract classes cannot be instantiated directly, while interfaces
    cannot be instantiated at all.


    *   Methods: Abstract classes can have both abstract and concrete methods. Interfaces
    (prior to Java 8) can only have abstract methods. Since Java 8, interfaces can
    have default and static methods.


    *   Multiple Inheritance: A class can implement multiple interfaces, allowing
    for multiple inheritance of type. However, a class can inherit from only one abstract
    class (single inheritance of implementation).


