    In the next section, we will integrate all the OOP concepts we have discussed
    so far—classes and objects, methods, constructors, inheritance, polymorphism,
    encapsulation, and abstraction—into a practical project: creating a simple library
    management system. This project will help reinforce your understanding of these
    concepts and demonstrate how they work together to create a functional application.


    ## Project: Create a Simple Library Management System


    In this project, we will create a simple library management system using the concepts
    of Object-Oriented Programming (OOP) that we have covered so far. This system
    will manage different types of library items, such as books and magazines, and
    will demonstrate the use of classes, objects, methods, constructors, inheritance,
    polymorphism, encapsulation, and abstraction.


    #### Project Requirements


    LibraryItem Class (Abstract Class)


    Attributes: title, author


    Methods: displayDetails() (abstract)


    Book Class (Subclass of LibraryItem)


    Additional Attributes: ISBN


    Methods: displayDetails()


    Magazine Class (Subclass of LibraryItem)


    Additional Attributes: issueNumber


    Methods: displayDetails()


    Library Class


    Attributes: ArrayList<LibraryItem>


    Methods: addItem(LibraryItem item), displayAllItems()


    Main Class


    Create instances of Book and Magazine


    Add items to the library


    Display all items in the library


    Implementation


    Let''s start by implementing each of these classes step by step.


    1\. LibraryItem Class (Abstract Class)


    public  abstract  class  LibraryItem  {


    protected  String title;


    protected  String author;


    public  LibraryItem(String  title, String  author)  {


    this.title  = title;


    this.author  = author;


    }


    // Abstract method to display details


    public  abstract  void  displayDetails();


    }


    2\. Book Class (Subclass of LibraryItem)


    public  class  Book  extends  LibraryItem  {


    private  String ISBN;


    public  Book(String  title, String  author, String  ISBN)  {


    super(title, author);


    this.ISBN  = ISBN;


    }


    @Override


    public  void  displayDetails()  {


    System.out.println("Book: "  + title +  ", Author: "  + author +  ", ISBN: "  +
    ISBN);


    }


    }


    3\. Magazine Class (Subclass of LibraryItem)


    public  class  Magazine  extends  LibraryItem  {


    private  int issueNumber;


    public  Magazine(String  title, String  author, int  issueNumber)  {


    super(title, author);


    this.issueNumber  = issueNumber;


    }


    @Override


    public  void  displayDetails()  {


    System.out.println("Magazine: "  + title +  ", Author: "  + author +  ", Issue:
    "  + issueNumber);


    }


    }


    4\. Library Class


    import  java.util.ArrayList;


    public  class  Library  {


    private  ArrayList<LibraryItem> items;


    public  Library()  {


    items =  new  ArrayList<>();


    }


    // Method to add an item to the library


    public  void  addItem(LibraryItem  item)  {


    items.add(item);


    }


    // Method to display all items in the library


    public  void  displayAllItems()  {


    for (LibraryItem  item  : items) {


    item.displayDetails();


    }


    }


    }


    5\. Main Class


    public  class  Main  {


    public  static  void  main(String[] args)  {


    // Creating a library


    Library  library  =  new  Library();


