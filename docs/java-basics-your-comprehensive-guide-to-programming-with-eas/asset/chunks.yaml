    ## Control Flow Statements


    Control flow statements in Java enable you to dictate the order in which statements
    are executed, allowing for complex and dynamic behavior in your programs. These
    include decision-making statements, loop statements, and branching statements.


    Decision-Making Statements


    Decision-making statements allow you to execute specific blocks of code based
    on certain conditions. The primary decision-making statements in Java are:


    if Statement: Executes a block of code if its condition evaluates to true.


    int number =  10;


    if (number >  5) {


    System.out.println("The number is greater than 5");


    }


    if-else Statement: Executes one block of code if its condition is true, and another
    block if the condition is false.


    int number =  10;


    if (number >  5) {


    System.out.println("The number is greater than 5");


    } else {


    System.out.println("The number is not greater than 5");


    }


    if-else-if Ladder: Checks multiple conditions sequentially.


    int number =  10;


    if (number >  10) {


    System.out.println("The number is greater than 10");


    } else  if (number ==  10) {


    System.out.println("The number is 10");


    } else {


    System.out.println("The number is less than 10");


    }


    ![](image_rsrc882.jpg)


    switch Statement: Selects a block of code to execute from multiple alternatives.


    int day =  3;


    switch (day) {


    case  1:


    System.out.println("Monday");


    break;


    case  2:


    System.out.println("Tuesday");


    break;


    case  3:


    System.out.println("Wednesday");


    break;


    default:


    System.out.println("Invalid day");


    }


    Loop Statements


    Loop statements allow you to execute a block of code repeatedly based on a condition.
    The primary loop statements in Java are:


    for Loop: Repeats a block of code a specified number of times.


    for (int i =  0; i <  5; i++) {


    System.out.println("i = "  + i);


    }


    while Loop: Repeats a block of code as long as its condition is true.


    int i =  0;


    while (i <  5) {


    System.out.println("i = "  + i);


    i++;


    }


    do-while Loop: Similar to the while loop, but the block of code is executed at
    least once before the condition is tested.


    int i =  0;


    do {


    System.out.println("i = "  + i);


    i++;


    } while (i <  5);


    Branching Statements


    Branching statements alter the flow of execution by transferring control to other
    parts of the code. The primary branching statements in Java are:


    break Statement: Exits a loop or switch statement prematurely.


    for (int i =  0; i <  10; i++) {


    if (i ==  5) {


    break;


    }


    System.out.println("i = "  + i);


    }


    continue Statement: Skips the current iteration of a loop and proceeds with the
    next iteration.


    for (int i =  0; i <  10; i++) {


    if (i %  2  ==  0) {


    continue;


    }


    System.out.println("i = "  + i);


    }


    return Statement: Exits from the current method and optionally returns a value.


    public  int  add(int a,  int b) {


    return a + b;


    }


    Example


    Let''s combine various control flow statements into a single example that checks
    whether a number is prime:


    public  class  ControlFlowExample  {


    public  static  void  main(String[] args)  {


    int  number  =  29;


    boolean  isPrime  =  true;


    if (number <=  1) {


    isPrime =  false;


    } else {


    for (int  i  =  2; i <= number /  2; i++) {


    if (number % i ==  0) {


    isPrime =  false;


    break;


    }


    }


    }


    if (isPrime) {


    System.out.println(number +  " is a prime number");


    } else {


    System.out.println(number +  " is not a prime number");


    }


    }


    }


    Explanation of the Code


    1.  Main Method: The program entry point where execution begins.


    2.  Variable Initialization: number is the value to check, and isPrime is a boolean
    flag initially set to true.


    3.  if Statement: Checks if the number is less than or equal to 1\. If so, it
    sets isPrime to false.


    4.  for Loop: Iterates from 2 to half of the number to check for factors. If a
    factor is found, isPrime is set to false, and the loop is exited using break.


    5.  Final if Statement: Prints whether the number is prime based on the value
    of isPrime.


