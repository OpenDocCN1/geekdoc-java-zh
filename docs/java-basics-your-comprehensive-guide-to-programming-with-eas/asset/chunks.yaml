    ## Character Streams


    Character streams in Java are designed for handling text data. They read and write
    data in 16-bit Unicode characters, making them suitable for working with text
    files and ensuring proper handling of character encoding. The primary classes
    for character streams are Reader and Writer.


    Reader


    The Reader class is the superclass of all character input streams, providing methods
    to read characters, arrays of characters, and lines.


    Commonly used Reader subclasses:


    FileReader: Reads characters from a file.


    import  java.io.FileReader;


    import  java.io.IOException;


    public  class  FileReaderExample  {


    public  static  void  main(String[] args)  {


    try (FileReader  fr  =  new  FileReader("example.txt")) {


    int  charData;


    while ((charData =  fr.read()) !=  -1) {


    System.out.print((char) charData);


    }


    } catch (IOException  e) {


    e.printStackTrace();


    }


    }


    }


    CharArrayReader: Reads characters from a character array.


    import  java.io.CharArrayReader;


    import  java.io.IOException;


    public  class  CharArrayReaderExample  {


    public  static  void  main(String[] args)  {


    char[] charArray  = {''H'', ''e'', ''l'', ''l'', ''o''};


    try (CharArrayReader  car  =  new  CharArrayReader(charArray)) {


    int  charData;


    while ((charData =  car.read()) !=  -1) {


    System.out.print((char) charData);


    }


    } catch (IOException  e) {


    e.printStackTrace();


    }


    }


    }


    ![](image_rsrc8AR.jpg)


    Writer


    The Writer class is the superclass of all character output streams, providing
    methods to write characters, arrays of characters, and strings.


    Commonly used Writer subclasses:


    FileWriter: Writes characters to a file.


