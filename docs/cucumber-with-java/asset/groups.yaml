    **8.�Filtering�scenarios**


    **8.1�Tagging�the�scenarios**


    We�can�tag�scenarios�using�@�symbol�in�Feature�files�as�shown�in�below�example.�Note


    that�we�can�also�tag�all�the�scenarios�in�a�feature�file�by�writing�the�tag�at�the�beginning�of


    the�feature�file.�We�can�also�associate�multiple�tags�with�the�same�scenario�as�well.�In


    below�example,�we�have�tagged�the�scenario�with�4�tags�-�selenium,�regression,�sanity�and


    critical.


    �


    @selenium


    Feature:�My�feature


    ��@regression�@sanity�@critical


    ��Scenario:�Verify�title


    Given�I�am�on�the�www.softpost.org�home�page


    Then�I�verify�that�title�contains�tutorials


    To�execute�the�scenarios�with�2�tags�say�regression�and�critical,�we�can�use�below�syntax.


    **tags�=�[“@regression”,”@critical”]**


    To�execute�the�scenarios�with�2�tags�say�regression�or�critical,�we�can�use�below�syntax


    **tags�=�[“@regression,@critical”]**


    To�skip�the�scenarios�tagged�with�tag�say�sanity,�we�can�use�below�syntax


    **Negative�tags�=�[“~@sanity”]**


    We�can�also�tie�the�@Before�and�@After�methods�with�scenarios�tagged�with�specific


    names.


    For�example,�below�before�method�will�be�executed�only�before�the�scenarios�tagged�with


    selenium


    **@Before(“@selenium”)**


    Here�is�the�example�showing�the�usage�of�tags�in�Cucumber.


    Consider�below�feature�file.


    @selenium


    Feature:�My�feature


    @regression�@sanity�@critical


    Scenario:�Verify�softpost�title


    Given�I�am�on�the�www.softpost.org�home�page


    Then�I�verify�that�title�contains�tutorials


    @sanity


    Scenario:�Verify�yahoo�title


    Given�I�am�on�the�www.yahoo.com�home�page


    Then�I�verify�that�title�contains�tutorials'
- md: "\nNow take a look at below Test Class. After executing below test class, only\
    \ first scenario will be executed because that scenario is tagged with @sanity\
    \ and @regression.\n\n**package** org.softpost;\n\nimport cucumber.api.CucumberOptions;\n\
    import cucumber.api.SnippetType;\nimport cucumber.api.junit.Cucumber;\nimport\
    \ org.junit.runner.RunWith;\n\n@RunWith(Cucumber.class)\n@CucumberOptions(\n \
    \ features=\"classpath:abc.feature\",\n  glue=\"classpath:org.softpost\",\n  tags={\"\
    @sanity\",\"@regression\"},\n  plugin=\"html:target/selenium-reports\",\n  dryRun=false,\n\
    \  monochrome=true,\n  strict=true,\n  snippets=SnippetType.CAMELCASE\n)\n\npublic\
    \ class MyTest\n{\n\n}\n\nNow take a look at below test class. After executing\
    \ below test, both scenarios will be executed as both are tagged with @sanity\
    \ tag.\n\n**package** org.softpost;\nimport cucumber.api.CucumberOptions;\nimport\
    \ cucumber.api.SnippetType;\nimport cucumber.api.junit.Cucumber;\nimport org.junit.runner.RunWith;\n\
    \n@RunWith(Cucumber.class)\n@CucumberOptions(\n  features=\"classpath:abc.feature\"\
    ,\n  glue=\"classpath:org.softpost\",\n  tags={\"@sanity,@regression\"},\n  plugin=\"\
    html:target/selenium-reports\",\n  dryRun=false,\n  monochrome=true,\n  strict=true,\n\
    \  snippets=SnippetType.CAMELCASE\n)\n\npublic class MyTest\n{\n\n}\n\nNow take\
    \ a look at below test class. After executing below test class, none of the scenarios\
    \ will be executed as tag is prefixed with ~..\n\n**package** org.softpost;\n\
    import cucumber.api.CucumberOptions;\nimport cucumber.api.junit.Cucumber;\nimport\
    \ org.junit.runner.RunWith;\n\n@RunWith(Cucumber.class)\n@CucumberOptions(\n \
    \ features=\"classpath:abc.feature\",\n  glue=\"classpath:org.softpost\",\n  tags={\"\
    ~@sanity\"},\n  plugin=\"html:target/selenium-reports\"\n)\n\npublic class MyTest\n\
    {\n\n}\n\n## 8.2 Using name option\n\nWe can execute the specific scenarios with\
    \ their names matching typical pattern. For example - Consider below feature file.\n\
    \n@selenium\nFeature: My feature\n@regression @sanity @critical\nScenario: Verify\
    \ softpost title\n  Given I am on the www.softpost.org home page\n  Then I verify\
    \ that title contains tutorials\n\n@sanity\nScenario: Verify yahoo title\n  Given\
    \ I am on the www.yahoo.com home page\n  Then I verify that title contains tutorials\n\
    \nTo execute only those scenarios with name containing \"softpost\", we can use\
    \ below test class. Note that we can also use regular expression as well to specify\
    \ the value of scenario name.\n\n**package** org.softpost;\nimport cucumber.api.CucumberOptions;\n\
    import cucumber.api.junit.Cucumber;\nimport org.junit.runner.RunWith;\n\n@RunWith(Cucumber.class)\n\
    @CucumberOptions(\n  features=\"classpath:abc.feature\",\n  glue=\"classpath:org.softpost\"\
    ,\n  name={\"softpost\"},\n  plugin=\"html:target/selenium-reports\"\n)\n\npublic\
    \ class MyTest\n{\n\n}\n\n## 9. Passing parameters to steps\n\nWe can pass the\
    \ parameters to the step methods from feature file as shown in below scenario.\
    \ In below scenario, we have passed the name of website in Given step. The main\
    \ advantage of passing the parameters is that we can re-use same step method in\
    \ different scenarios with different parameters.\n\n@selenium\nFeature: Simple\
    \ feature\n\nScenario: Test web title\n  Given I am on \"www.yahoo.com\" page\n\
    \  Then I verify that the title is \"yahoo\"\n\nScenario: Test web title\n  Given\
    \ I am on \"www.softpost.org\" page\n  Then I verify that the title is \"tutorials\"\
    \n\nHere are the step definitions for above steps. Note that both scenarios re-use\
    \ same step definitions with different parameters.\n\n**package** org.softpost;\n\
    \nimport com.google.common.primitives.Bytes;\nimport cucumber.api.Scenario;\n\
    import cucumber.api.java.After;\nimport cucumber.api.java.Before;\nimport cucumber.api.java.en.Given;\n\
    import cucumber.api.java.en.Then;\nimport org.junit.framework.Assert;\nimport\
    \ org.openqa.selenium.OutputType;\nimport org.openqa.selenium.TakesScreenshot;\n\
    import org.openqa.selenium.WebDriver;\nimport org.openqa.selenium.firefox.FirefoxDriver;\n\
    \npublic class seleniumsteps\n{\n  WebDriver driver;\n  Scenario scenario;\n\n\
    \  @Before(\"@selenium\")\n  public void launchBrowser(Scenario scenario)\n  {\n\
    \    driver = new FirefoxDriver();\n    this.scenario = scenario;\n    System.out.println(\"\
    Executing scenario \" + scenario.getName());\n  }\n\n  @After(\"@selenium\")\n\
    \  public void killBrowser()\n  {\n    scenario.write(\"Finished scenario\");\n\
    \    if (scenario.isFailed())\n    {\n      scenario.embed(((TakesScreenshot)driver).getScreenshotAs(OutputType.BYTES),\
    \ \"image/png\");\n    }\n    driver.close();\n    driver.quit();\n  }\n\n  @Given(\"\
    ^I am on \\\"([^\"]*)\\\" page$\")\n  public void i_am_on_page(String arg1) throws\
    \ Throwable\n  {\n    driver.get(\"http://\" + arg1);\n  }\n\n  @Then(\"^I verify\
    \ that the title is \\\"([^\"]*)\\$\"\")\n  public void i_verify_that_the_title_is(String\
    \ arg1) throws Throwable\n  {\n    Assert.assertTrue(driver.getTitle().contains(arg1));\n\
    \  }\n}\n\n## 10. Passing data table to steps\n\n### 10.1 Key-Value Datatable\n\
    \nWe can pass the data table with key and value as shown in below.\n\nFeature:\
    \ Simple datatable\nScenario: Test web title\n  Given I am on home page of site\n\
    \  And I submit the form with below\n    | name | sagar |\n    | id | 989 |\n\
    \    | address | mumbai |\n  Then I see that form is successful\n\nHere is the\
    \ step definition for above. Note how we have converted the table.\n\n**package**\
    \ org.softpost;\n\nimport cucumber.api.DataTable;\nimport cucumber.api.java.en.Given;\n\
    import cucumber.api.java.en.Then;\nimport java.util.List;\nimport java.util.Map;\n\
    \n/**\n * Created by Sagar on 13-07-2016\n */\npublic class DatatableSteps\n{\n\
    \  @Given(\"^I am on home page of site$\")\n  public void i_am_on_page_of_site()\n\
    \  {\n    System.out.println(\"Navigate to home page\");\n  }\n\n  @Given(\"^I\
    \ submit the form with below$\")\n  public void i_submit_the_form_with_below(DataTable\
    \ arg1) throws Throwable\n  {\n    Map<String, String> m = arg1.asMap(String.class,\
    \ String.class);\n    System.out.println(\"Filling with data\");\n    for (String\
    \ k : m.keySet())\n    {\n      System.out.println(\"Key->\" + k + \" Value->\"\
    \ + m.get(k));\n    }\n  }\n\n  @Then(\"^I see that form is successful$\")\n \
    \ public void i_see_that_form_is_successful() throws Throwable\n  {\n    System.out.println(\"\
    Verify form message\");\n  }\n}\n\nHere is the output of execution of file.\n\
    Navigate home page\nFilling with data\nKey->name Value->sagar\nKey->id Value->989\n\
    Key->address Value->mumbai\nVerify form message\nScenarios (1 passed)\nSteps (3\
    \ passed)\n0.525s\n\n## 10.2 Multiple column datatable in Cucumber\n\nNow let\
    \ us look at how to pass the data table with multiple columns in Cucumber.\n\n\
    Feature: Multiple column table\nScenario: Create student records\n  Given We have\
    \ below list of students\n    | name | id | address |\n    | sagar | 28834 | Brisbane\
    \ |\n    | watson | 38829 | London |\n    | paul | 34223 | Chicago |\n\nNow take\
    \ a look at below Student Class. This class is mapped with the data table.\n\n\
    **package** org.softpost;\n\n/**\n * Created by Sagar on 13-07-2016\n */\npublic\
    \ class Student\n{\n  private String name;\n  private String address;\n  private\
    \ int id;\n\n  public Student(String name, int id, String address)\n  {\n    this.name\
    \ = name;\n    this.id = id;\n    this.address = address;\n  }\n\n  public void\
    \ printStudent()\n  {\n    System.out.println(\"\\nStudent->\" + name + \", \"\
    \ + id + \", \" + address);\n  }\n}\n\nHere is the step definition class. Note\
    \ how we have converted the Data table to the list of student objects.\n"
  mdcn: "\n现在看下面的测试类（Test Class）。执行该测试类后，只有第一个场景会被执行，因为该场景被标记了 @sanity 和 @regression。\n\
    \n\n\n**package** org.softpost;\n\nimport cucumber.api.CucumberOptions;\nimport\
