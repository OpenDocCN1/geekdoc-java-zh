    Click delete button\nVerify deleted record\nBackground - Filtering some records\n\
    Click update button\nVerify modified record\n2 Scenarios (2 passed)\n6 Steps (6\
    \ passed)\n0m0.578s\n\n## 11.2 Scenario outline（场景大纲）\n有时，我们需要使用不同的测试数据执行相同的场景。在这种情况下，我们可以使用名为\
    \ scenario outline 的概念。在下方的示例中，相同的场景将执行两次。第一次使用 99 和 100；第二次使用 11 和 200。\n\nFeature:\
