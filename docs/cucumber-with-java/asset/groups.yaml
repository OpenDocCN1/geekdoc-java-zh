    \ class MyTest\n{\n\n}\n\n## 9. 向步骤（steps）传递参数\n\n我们可以像下面的场景所示，从特性文件中将参数传递给步骤方法。在下面的场景中，我们在\
    \ Given 步骤中传递了网站名称。传递参数的主要优势是我们可以在不同的场景中使用不同的参数复用同一个步骤方法。\n\n@selenium\nFeature:\
