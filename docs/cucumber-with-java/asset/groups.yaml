- md: "\n## Sample feature file with Background\n\nBackground keyword is used when\
    \ we want to execute certain number of steps before each scenario. For example,\
    \ suppose you want to clear browser cookies before execution of each scenario,\
    \ then we can use background keyword with step to clear cookies.\n\n## Passing\
    \ input data to the step\n\nEach scenario can have multiple steps and each step\
    \ is the user action. A step is like specific operation in the system. A steps\
    \ may need the input data to be processed. We can pass the input to the step using\
    \ 3 ways.\n\n1. In-line Variables\n2. Multi-line string\n3. Tables\n\n## Grouping\
    \ the scenarios and features with tags\n\nWe use tags to group similar scenarios\
    \ and features together in Gherkin. @ symbol is used for tagging the scenarios\
    \ and features.\n\n## 4. Adding Cucumber dependency to Java project\n\nTo write\
    \ the tests using cucumber, we need to add 2 types of dependencies.\n\n1. cucumber-java\n\
    2. junit\n\nIf you are using Maven build management system, you can use below\
    \ XML block in POM.XML\n\n```xml\n<dependency>\n  <groupId>info.cukes</groupId>\n\
    \  <artifactId>cucumber-java</artifactId>\n  <version>1.2.4</version>\n</dependency>\n\
    \n<dependency>\n  <groupId>junit</groupId>\n  <artifactId>junit</artifactId>\n\
    \  <version>4.12</version>\n  <scope>test</scope>\n</dependency>\n```\n\n## 5.\
    \ Cucumber Test\n\n### 5.1 Writing first cucumber test\n\nJust follow below steps\
    \ to write first cucumber test in IntelliJ IDEA.\n\n1. Create a maven project.\n\
    2. Add feature file containing scenarios in Test Resources directory.\n3. Add\
    \ the maven dependency for Cucumber.\n4. Write step definitions and execute the\
    \ tests from feature file.\n\nHere is the feature file that we created and put\
    \ in the test resources folder.\n\n```gherkin\n@selenium\nFeature: My feature\n\
    \n  Scenario: Verify title\n    Given I am on the www.softpost.org home page\n\
    \    Then I verify that title contains tutorials\n```\n\nNote that we have not\
    \ added the step definitions for above steps in feature file. When you execute\
    \ the feature file, you will see below errors.\n\nYou can implement missing steps\
    \ with the snippets below:\n\n```java\n@Given(\"^^I am on the www\\\\.softpost\\\
    \\.org home page$\")\npublic void i_am_on_the_www_softpost_org_home_page() throws\
    \ Throwable {\n    // Write code here that turns the phrase above into concrete\
    \ actions\n    throw new PendingException();\n}\n\n@Then(\"^^I verify that title\
    \ contains tutorials$\")\npublic void i_verify_that_title_contains_tutorials()\
    \ throws Throwable {\n    // Write code here that turns the phrase above into\
    \ concrete actions\n    throw new PendingException();\n}\n```\n\nUndefined step:\
    \ Given I am on the www.softpost.org home page\nUndefined step: Then I verify\
    \ that title contains tutorials\n\n## Writing the step definitions\n\nYou can\
    \ copy above method snippets and write your own code inside it. Alternatively,\
    \ if you have cucumber for Java and Gherkin plugin installed in IntelliJ IDEA,\
    \ then you can create the step definitions by pressing alt+enter on the steps\
    \ in Feature file as shown in below image.\n\n![](img/01a02959ac67a9cb80992ea769fa586c_22_0.png)\n\
    *Creating cucumber step definitions in IntelliJ IDEA*\n\nHere is the class with\
    \ step definitions.\n\n```java\npackage org.softpost;\n\nimport cucumber.api.java.After;\n\
    import cucumber.api.java.Before;\nimport cucumber.api.java.en.Given;\nimport cucumber.api.java.en.Then;\n\
    import junit.framework.Assert;\nimport org.openqa.selenium.WebDriver;\nimport\
    \ org.openqa.selenium.firefox.FirefoxDriver;\n\n/**\n***** Created by Sagar on\
    \ 12-07-2016.\n*/\n@SuppressWarnings(\"ALL\")\npublic class seleniumsteps {\n\
    \    WebDriver driver;\n\n    @Before\n    public void launchBrowser() {\n   \
    \     driver = new FirefoxDriver();\n    }\n\n    @Given(\"^^I am on the www\\\
    \\.softpost\\\\.org home page$\")\n    public void i_am_on_the_www_softpost_org_home_page()\
    \ throws Throwable {\n        driver.get(\"http://www.softpost.org\");\n    }\n\
    \n    @Then(\"^^I verify that title contains tutorials$\")\n    public void i_verify_that_title_contains_tutorials()\
    \ throws Throwable {\n        Assert.assertTrue(driver.getTitle().toLowerCase().contains(\"\
    tutorials\"));\n    }\n\n    @After\n    public void killBrowser() {\n       \
    \ driver.close();\n        driver.quit();\n    }\n}\n```\n\nAfter writing the\
    \ step definitions, you can create the run configuration for feature file as shown\
    \ in below image. Note that Glue property is very important. You should specify\
    \ the package name that contains step definitions in the Glue.\n\n![](img/01a02959ac67a9cb80992ea769fa586c_23_0.png)\n\
    *glue in Cucumber run configuration*\n\nThen you can right-click on feature file\
    \ and run the test as shown in below image.\n\n![](img/01a02959ac67a9cb80992ea769fa586c_24_0.png)\n\
    *Running feature file in IntelliJ IDEA*\n\nIf everything is ok, tests will run\
    \ successfully.\n\n## Cucumber Reports in IntelliJ IDEA\n\nYou can view report\
    \ of execution as shown below.\n\n![](img/01a02959ac67a9cb80992ea769fa586c_25_0.png)\n\
    *Viewing execution in IntelliJ*\n\n![](img/01a02959ac67a9cb80992ea769fa586c_25_1.png)\n\
    *HTML report of tests*\n\n## 6. Executing tests using Cucumber class\n\nTo write\
    \ the tests using JUnit @Run annotation, we need below dependencies.\n\n```xml\n\
    <dependency>\n  <groupId>junit</groupId>\n  <artifactId>junit</artifactId>\n \
    \ <version>4.12</version>\n  <scope>test</scope>\n</dependency>\n\n<dependency>\n\
    \  <groupId>info.cukes</groupId>\n  <artifactId>cucumber-java</artifactId>\n \
    \ <version>1.2.4</version>\n</dependency>\n```\n\nThen you can add below class.\
    \ After running the test, cucumber generates the report at target/reports. Cucumber\
    \ class reads the feature file and executes it.\n\n```java\npackage org.softpost;\n\
    \nimport cucumber.junit.Cucumber;\nimport cucumber.junit.CucumberOptions;\n\n\
    @RunWith(Cucumber.class)\n@CucumberOptions(\n    features = \"classpath:feature\"\
    ,\n    glue = \"org.softpost\",\n    plugin = \"html:target/reports\"\n)\npublic\
    \ class MyTests {\n}\n```\n\n## 7. Cucumber options\n\nWhen executing the scenarios,\
    \ we can pass various options as mentioned below:\n\n1. features - path of the\
    \ features\n2. glue - path of the step definitions\n3. dryRun - used to check\
    \ that all steps are defined\n4. monochrome - true/false controls the output readability\n\
    5. strict - false means undefined steps are skipped\n6. plugin - json, html, pretty\n\
    7. snippets - style can be CamelCase or underscore\n\nHere is the sample class\
    \ showing all options.\n\n```java\npackage org.softpost;\n\nimport cucumber.junit.Cucumber;\n\
    import cucumber.junit.CucumberOptions;\nimport org.junit.runner.RunWith;\n\n@RunWith(Cucumber.class)\n\
    @CucumberOptions(\n    features = \"classpath:feature\",\n    glue = \"org.softpost\"\
    ,\n    plugin = \"html:target/reports\",\n    dryRun = false,\n    monochrome\
    \ = true,\n    strict = true,\n    snippets = \"CamelCase\"\n)\npublic class MyTests\
    \ {\n}\n```\n\n## 8. Filtering scenarios\n\n### 8.1 Tagging the scenarios\n\n\
    We can tag scenarios using @ symbol in feature files as shown below example. Note\
    \ that we can also tag all scenarios in a feature file by writing the tag at the\
    \ beginning of the feature file. We can also associate multiple tags with the\
    \ same scenario as well. In below example, we have tagged the scenario with 4\
    \ tags - selenium, regression, sanity and critical.\n\n```gherkin\n@selenium\n\
    Feature: My feature\n\n  @regression@sanity@critical\n  Scenario: Verify softpost\
    \ title\n    Given I am on the www.softpost.org home page\n    Then I verify that\
    \ title contains tutorials\n\n  @sanity\n  Scenario: Verify yahoo title\n    Given\
    \ I am on the www.yahoo.com home page\n    Then I verify that title contains tutorials\n\
    ```\n\nWe can also tie the @Before and @After methods with scenarios tagged with\
    \ specific names. For example, below before method will be executed only before\
    \ the scenarios tagged with selenium.\n\n```java\n@Before(\"@selenium\")\npublic\
    \ void beforeMethod() {\n    // code\n}\n```\n"
  mdcn: "\n\n## 带有 Background 的示例 feature 文件\n\nBackground 关键字用于在执行每个场景（scenario）之前执行某些数量的步骤。例如，假设你希望在执行每个场景之前清除浏览器\
    \ cookie，那么我们可以使用 background 关键字配合清除 cookie 的步骤。\n\n## 向步骤传递输入数据\n\n每个场景可以包含多个步骤（step），而每个步骤都是用户操作。一个步骤类似于系统中的某个特定操作。某些步骤可能需要输入数据进行处理。我们可以通过以下\
    \ 3 方式将输入传递给步骤：\n\n1. 内联变量（In-line Variables）\n2. 多行字符串\n3. 表格\n\n## 使用标签（tags）对场景和特性分组\n\
    \n在 Gherkin 中，我们使用标签将相似的场景和特性分组。@ 符号用于标记场景和特性。\n\n## 4.向 Java 项目中添加 Cucumber 依赖\n\
    \n要使用 cucumber 编写测试，我们需要添加 2 类型的依赖。\n\n1. cucumber-java\n2. junit\n\n如果你使用 Maven\
    \ 构建管理系统，可以在 POM.XML 中使用下面的 XML 块：\n\n```xml\n<dependency>\n  <groupId>info.cukes</groupId>\n\
    \  <artifactId>cucumber-java</artifactId>\n  <version>1.2.4</version>\n</dependency>\n\
    \n<dependency>\n  <groupId>junit</groupId>\n  <artifactId>junit</artifactId>\n\
    \  <version>4.12</version>\n  <scope>test</scope>\n</dependency>\n```\n\n## 5.\
    \ Cucumber 测试\n\n### 5.1 编写第一个 cucumber 测试\n\n只需按照以下步骤在 IntelliJ IDEA 中编写第一个 cucumber\
    \ 测试。\n\n1. 创建一个 maven 项目。\n2. 在 Test Resources 目录下添加包含场景的 feature 文件。\n3. 添加\
    \ Cucumber 的 maven 依赖。\n4. 编写步骤定义（step definitions）并从 feature 文件执行测试。\n\n这是我们创建并放入\
    \ test resources 文件夹的 feature 文件。\n\n```gherkin\n@selenium\nFeature: My feature\n\
    \n  Scenario: Verify title\n    Given I am on the www.softpost.org home page\n\
    \    Then I verify that title contains tutorials\n```\n\n注意，我们还没有为上述 feature 文件中的步骤添加步骤定义。当你执行\
    \ feature 文件时，你将看到下面的错误。\n\n你可以使用下面的代码片段（snippets）实现缺失的步骤：\n\n```java\n@Given(\"\
    ^^I am on the www\\\\.softpost\\\\.org home page$\")\npublic void i_am_on_the_www_softpost_org_home_page()\
    \ throws Throwable {\n    // 在此处编写代码将上面的短语转换为具体的动作\n    throw new PendingException();\n\
    }\n\n@Then(\"^^I verify that title contains tutorials$\")\npublic void i_verify_that_title_contains_tutorials()\
    \ throws Throwable {\n    // 在此处编写代码将上面的短语转换为具体的动作\n    throw new PendingException();\n\
    }\n```\n\nUndefined step: Given I am on the www.softpost.org home page\nUndefined\
    \ step: Then I verify that title contains tutorials\n\n## 编写步骤定义\n\n你可以复制上面的方法片段并在内部编写你自己的代码。或者，如果你在\
    \ IntelliJ IDEA 中安装了 cucumber for Java 和 Gherkin 插件，你可以通过在 Feature 文件中的步骤上按 alt+enter\
    \ 如下所示所示创建步骤定义。\n\n![](img/01a02959ac67a9cb80992ea769fa586c_22_0.png)\n*在 IntelliJ\
    \ IDEA 中创建 cucumber 步骤定义*\n\n这是带有步骤定义的类。\n\n```java\npackage org.softpost;\n\n\
    import cucumber.api.java.After;\nimport cucumber.api.java.Before;\nimport cucumber.api.java.en.Given;\n\
    import cucumber.api.java.en.Then;\nimport junit.framework.Assert;\nimport org.openqa.selenium.WebDriver;\n\
    import org.openqa.selenium.firefox.FirefoxDriver;\n\n/**\n***** 由 Sagar 于 12-07-2016\
    \ 创建。\n*/\n@SuppressWarnings(\"ALL\")\npublic class seleniumsteps {\n    WebDriver\
    \ driver;\n\n    @Before\n    public void launchBrowser() {\n        driver =\
    \ new FirefoxDriver();\n    }\n\n    @Given(\"^^I am on the www\\\\.softpost\\\
    \\.org home page$\")\n    public void i_am_on_the_www_softpost_org_home_page()\
    \ throws Throwable {\n        driver.get(\"http://www.softpost.org\");\n    }\n\
    \n    @Then(\"^^I verify that title contains tutorials$\")\n    public void i_verify_that_title_contains_tutorials()\
    \ throws Throwable {\n        Assert.assertTrue(driver.getTitle().toLowerCase().contains(\"\
    tutorials\"));\n    }\n\n    @After\n    public void killBrowser() {\n       \
    \ driver.close();\n        driver.quit();\n    }\n}\n```\n\n编写步骤定义后，你可以像下面所示为\
    \ feature 文件创建运行配置（run configuration）。注意 Glue 属性非常重要。你应该在 Glue 中指定包含步骤定义的包名。\n\
    \n![](img/01a02959ac67a9cb80992ea769fa586c_23_0.png)\n*glue 属性很重要*\n\n在 feature\
    \ 文件上点击右键并运行，如下所示。\n\n![](img/01a02959ac67a9cb80992ea769fa586c_24_0.png)\n*运行\
    \ feature 文件*\n\n当你执行 feature 文件时，你将看到如下所示的错误。\n\n![](img/01a02959ac67a9cb80992ea769fa586c_25_0.png)\n\
    *在 IntelliJ IDEA 中执行*\n\n你可以像下面所示查看 cucumber 的执行报告。\n\n![](img/01a02959ac67a9cb80992ea769fa586c_26_0.png)\n\
    *在 IntelliJ IDEA 中查看执行*\n\n如果一切正常，测试将成功运行。\n\n![](img/01a02959ac67a9cb80992ea769fa586c_27_0.png)\n\
    *Cucumber 报告*\n\n## 6. 使用 JUnit 执行测试\n\n要使用 JUnit 注解编写测试，我们需要下面的依赖。\n\n```xml\n\
    <dependency>\n  <groupId>junit</groupId>\n  <artifactId>junit</artifactId>\n \
    \ <version>4.12</version>\n  <scope>test</scope>\n</dependency>\n```\n\n运行该类后，cucumber\
    \ 会在 target/reports 生成报告。\n\n```java\npackage org.softpost;\n\nimport cucumber.junit.Cucumber;\n\
    import cucumber.junit.CucumberOptions;\nimport org.junit.runner.RunWith;\n\n@RunWith(Cucumber.class)\n\
    @CucumberOptions(\n    features = \"classpath:feature\",\n    glue = \"org.softpost\"\
    ,\n    plugin = \"html:target/reports\"\n)\npublic class MyTests {\n}\n```\n\n\
    ## 7. Cucumber 选项\n\n在执行场景时，我们可以传递下面的各种选项：\n\n1. features - 特性的路径\n2. glue - 步骤定义的路径\n\
    3. dryRun - 用于检查所有步骤是否已定义\n4. monochrome - 控制输出的可读性\n5. strict - 设置为 false 时未定义的步骤将被跳过\n\
    6. plugin - json, html, pretty\n7. snippets - 样式可以是 CamelCase 或下划线\n\n这是一个显示所有选项的示例类。\n\
    \n```java\npackage org.softpost;\n\nimport cucumber.junit.Cucumber;\nimport cucumber.junit.CucumberOptions;\n\
    import org.junit.runner.RunWith;\n\n@RunWith(Cucumber.class)\n@CucumberOptions(\n\
    \    features = \"classpath:feature\",\n    glue = \"org.softpost\",\n    plugin\
    \ = \"html:target/reports\",\n    dryRun = false,\n    monochrome = true,\n  \
    \  strict = true,\n    snippets = \"CamelCase\"\n)\npublic class MyTests {\n}\n\
    ```\n\n## 8. 过滤场景\n\n### 8.1 标记场景\n\n我们可以在 feature 文件中使用 @ 符号标记场景，如下示例所示。注意，我们也可以通过在\
    \ feature 文件开头编写标签来标记所有的场景。我们也可以为同一个场景关联多个标签。在下面的示例中，我们为场景标记了 4 个标签：selenium、regression、sanity\
    \ 和 critical。\n\n```gherkin\n@selenium\nFeature: My feature\n\n  @regression@sanity@critical\n\
    \  Scenario: Verify softpost title\n    Given I am on the www.softpost.org home\
    \ page\n    Then I verify that title contains tutorials\n\n  @sanity\n  Scenario:\
    \ Verify yahoo title\n    Given I am on the www.yahoo.com home page\n    Then\
    \ I verify that title contains tutorials\n```\n\n我们还可以将 @Before 和 @After 方法与带有特定名称的场景绑定。例如，下面的\
    \ before 方法将只在标记为 selenium 的场景之前执行。\n\n```java\n@Before(\"@selenium\")\npublic\
