    \n/**\n***** Created by Sagar on 13-07-2016.\n */\npublic class DatatableSteps\
    \ {\n\n    @Given(\"^We have below list of students$\")\n    public void we_have_below_list_of_students(DataTable\
    \ arg1) throws Throwable {\n        List<Student> students = arg1.asList(Student.class);\n\
    \n        for (Student s : students) {\n            s.printStudent();\n      \
    \  }\n    }\n}\n\nHere is the output of above code.\nTesting started at 19:48…\n\
    Student -> sagar, 288345, Brisbane\nStudent -> watson, 38829, London\nStudent\
    \ -> paul, 34223, Chicago\n1 Scenarios (1 passed)\n1 Steps (1 passed)\n0m0.635s\n\
    \n## 11. Feature file variations\n\n### 11.1 Scenario Background\nSometimes, we\
    \ need to execute certain steps, before every scenario in the same feature file.\
    \ Backgrounds allow you to reuse same steps across multiple scenarios. For example\
    \ - to test some feature, we might need to filter records before every scenario.\
    \ So we can put the steps required to filter the records inside Background. These\
    \ steps would be executed every time each scenario in the same feature file is\
    \ executed.\n\nIn below feature file, we have one step in the background (Given\
    \ I filter some records). This step will be executed before every scenario in\
    \ this feature file.\n\nFeature: Simple background feature\n\n  Background: Execute\
    \ before every scenario\n    Given I filter some records\n\n    Scenario: Verify\
    \ delete functionality\n      Given I click on the delete button of the first\
    \ record\n      Then I verify that record is removed from the table\n\n    Scenario:\
    \ Verify Update functionality\n      Given I click on update button of the first\
    \ record\n      Then I verify that record opens in new window and we can modify\
    \ it\n\nHere is the step definition class.\n```java\npackage org.softpost;\n\n\
    import cucumber.api.java.en.Given;\nimport cucumber.api.java.en.Then;\n\n/**\n\
    ***** Created by Sagar on 13-07-2016.\n */\npublic class backgroundsteps {\n\n\
    \    @Given(\"^I filter some records$\")\n    public void i_filter_some_records()\
    \ throws Throwable {\n        System.out.println(\"\\n\\nBackground - Filtering\
    \ some records\\n\");\n    }\n\n    @Given(\"^I click on the delete button of\
    \ the first record$\")\n    public void i_click_on_the_delete_button_of_the_first_record()\
    \ throws Throwable {\n        System.out.println(\"Click delete button\\n\");\n\
    \    }\n\n    @Then(\"^I verify that record is removed from the table$\")\n  \
    \  public void i_verify_that_record_is_removed_from_the_table() throws Throwable\
    \ {\n        System.out.println(\"Verify deleted record\\n\");\n    }\n\n    @Given(\"\
    ^I click on update button of the first record$\")\n    public void i_click_on_update_button_of_the_first_record()\
    \ throws Throwable {\n        System.out.println(\"Click update button\\n\");\n\
    \    }\n\n    @Then(\"^I verify that record opens in new window and we can modify\
    \ it$\")\n    public void i_verify_that_record_opens_in_new_window_and_we_can_modify_it()\
    \ throws Throwable {\n        System.out.println(\"Verify modified record\\n\"\
    );\n    }\n\n}\n```\n\nHere is the output of execution of above feature file.\n\
    Background - Filtering some records\nClick delete button\nVerify deleted record\n\
    Background - Filtering some records\nClick update button\nVerify modified record\n\
    2 Scenarios (2 passed)\n6 Steps (6 passed)\n0m0.578s\n\n## 11.2 Scenario outline\n\
    Sometimes, we need to execute the same scenario but with different test data.\
    \ In such cases, we can use the concept called as scenario outline. In below example,\
    \ same scenario will be executed twice. First time with 99 and 100. Second time\
    \ with 11 and 200.\n\nFeature: Outline feature\n\n  Scenario Outline: Addition\
    \ of numbers\n    When I add integers <i1> and <i2>\n    Then I see the result\
    \ as <sum>\n    Examples:\n      | i1 | i2 | sum |\n      | 99 | 100 | 199 |\n\
    \      | 11 | 200 | 211 |\n\nHere is the step definitions class.\n```java\npackage\
    \ org.softpost;\n\nimport cucumber.api.java.en.Then;\nimport cucumber.api.java.en.When;\n\
    import org.junit.Assert;\n\n/**\n***** Created by Sagar on 13-07-2016.\n */\n\
    public class outlinesteps {\n    int result = 0;\n\n    @When(\"^add integers\
    \ (d+) and (d+)$\")\n    public void add_integers_and(int arg1, int arg2) throws\
    \ Throwable {\n        result = arg1 + arg2;\n        System.out.println(\"Adding\
    \ \" + arg1 + \" and \" + arg2 + \"\\n\");\n    }\n\n    @Then(\"^see the result\
    \ as (d+)$\")\n    public void see_the_result_as(int arg1) throws Throwable {\n\
    \        Assert.assertEquals(result, arg1);\n    }\n}\n```\n\nHere is the output\
    \ of execution of above feature file.\nTesting started at 19:18…\nAdding 99 and\
    \ 100\nAdding 11 and 200\n2 Scenarios (2 passed)\n4 Steps (4 passed)\n0m0.59s\n\
    \n## 12. Running multiple files in Cucumber\nWe can execute scenarios in multiple\
    \ files as shown below. Note that to execute all files we can also use operator.\n\
    \n```java\npackage org.softpost;\n\nimport cucumber.api.junit.CucumberOptions;\n\
    import org.junit.runner.RunWith;\n\n@RunWith(Cucumber.class)\n@CucumberOptions(\n\
    \    features = {\"feature\",\"outline.feature\"},\n    glue = {\"softpost\"},\n\
    \    plugin = {\"html:target/cucumber-reports\"}\n)\npublic class MultipleTest\
    \ {\n}\n```\nHere is the HTML report generated after execution.\n\n## 13. Sharing\
    \ driver instance using PicoContainer\nIn Selenium automation we create a driver\
    \ instance. But we can use the same driver in different step classes in two ways:\n\
    1. By creating a static field\n2. By using PicoContainer (Dependency Injection)\n\
    \nFirst method is very simple. Just create a class with static field. Now let\
    \ us take a look at how we can share the driver using Dependency Injection. For\
    \ this you will need below dependencies.\n\n```xml\n<dependency>\n    <groupId>org.selenium</groupId>\n\
    \    <artifactId>selenium-java</artifactId>\n    <version>2.42.2</version>\n</dependency>\n\
    \n<dependency>\n    <groupId>info.cukes</groupId>\n    <artifactId>picocontainer</artifactId>\n\
    \    <version>1.2</version>\n    <scope>test</scope>\n</dependency>\n```\n\nNext\
    \ we need to create a class where we will create driver as shown in below example.\
    \ Note that we instantiate the driver only once. We have got method getDriver()\
    \ to get the driver.\n\n```java\npackage org.softpost;\n\nimport cucumber.api.java.After;\n\
    import cucumber.api.java.Before;\nimport org.openqa.selenium.WebDriver;\nimport\
    \ org.openqa.selenium.firefox.FirefoxDriver;\n\npublic class SharedClass {\n\n\
    \    private static boolean startBrowser = false;\n    private WebDriver driver;\n\
    \    public String title = \"\";\n\n    @Before(\"@sharedselenium\")\n    public\
    \ void init() throws Exception {\n        if (!startBrowser) {\n            driver\
    \ = new FirefoxDriver();\n            // To stop launching browser after every\
    \ scenario, assign below variable with true value\n            startBrowser =\
    \ false;\n        }\n    }\n\n    public WebDriver getDriver() {\n        return\
    \ driver;\n    }\n\n    @After(\"@sharedselenium\")\n    public void cleanUp()\
    \ {\n        driver.close();\n        driver.quit();\n    }\n}\n```\n"
