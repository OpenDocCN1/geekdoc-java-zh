- md: "\n# CUCUMBER WITH JAVA\n\n![](img/01a02959ac67a9cb80992ea769fa586c_0_0.png)\n\
    \n## BEGINNER’S GUIDE\n\nPAUL WATSON\n\n**About the Author**\n\nMr. Paul Watson\
    \ has many years of experience in working with BDD and Cucumber. He has worked\
    \ on large software projects in USA, UK, Singapore, Hong Kong, Dubai, Australia\
    \ and Switzerland.\n\nHis hobbies include travelling to new tourist places, watching\
    \ basketball, cricket, Soccer and learning latest technological stuff.\n\n**Who\
    \ is this book for**\n\nThis book is for software developers, automation testers,\
    \ Devops and engineers working on IT project. Whether you are a beginner or an\
    \ experienced developer, this book will help you master the skills on Cucumber.\n\
    \nThe book starts with introduction of Cucumber and then dives into key concepts\
    \ like creating project in IntelliJ IDEA, using tags, plugins, integration with\
    \ Junit, executing selenium tests, using picocontainer and lam expressions.\n\n\
    **Preface**\n\nThis book is for those who are new to Cucumber. It will help you\
    \ understand what is Cucumber and how you can use it in your software project.\n\
    \nIn this book, you will learn below topics.\n\n1. Introduction to Cucumber\n\
    2. Installation of Cucumber\n3. Writing feature files using Gherkin\n4. Adding\
    \ Cucumber dependency to Java project\n5. Cucumber Test\n6. Executing Cucumber\
    \ tests using Cucumber class\n7. Cucumber options\n8. Filtering scenarios\n9.\
    \ Passing parameters to steps\n10. Passing the data table to steps\n11. Feature\
    \ file variations\n12. Running multiple feature files in Cucumber\n13. Sharing\
    \ selenium Webdriver instance using PicoContainer\n14. Reports in Cucumber\n15.\
    \ Cucumber using Lambda Expressions\n\nAbout the Author\nWho is this book for\n\
    \nPreface\n\n1. Introduction\n2. Installation of Cucumber\n3. Writing feature\
    \ files using Gherkin\n4. Adding Cucumber dependency to Java project\n5. Cucumber\
    \ Test\n5.1 Writing first cucumber test\n6. Executing Cucumber tests using Cucumber\
    \ class\n7. Cucumber options\n8. Filtering scenarios\n8.1 Tagging the scenarios\n\
    8.2 Using name option\n9. Passing parameters to steps\n10. Passing the data table\
    \ to steps\n10.1 Key-Value pair Datatable\n10.2 Multiple column datatable in Cucumber\n\
    11. Feature file variations\n11.1 Scenario Background\n11.2 Scenario outline\n\
    12. Running multiple feature files in Cucumber\n13. Sharing selenium Webdriver\
    \ instance using PicoContainer\n14. Reports in Cucumber\n14.1 Embedding the screenshot\n\
    14.2 Writing to Cucumber HTML reports\n15. Cucumber using Lambda Expressions\n\
    15.1 Cucumber dependency for using Lambda expressions in Java 8\n15.2 Cucumber\
    \ test using Lambda expressions\n\n**1. Introduction**\n\nCucumber is the BDD\
    \ (Behavior driven development) testing framework.\n\nKey things to note about\
    \ Cucumber are -\n\n1. Open source BDD testing framework.\n2. Cross platform framework.\n\
    3. Tests are written in various languages like English, French, German and many\
    \ more using Gherkin Syntax.\n4. We can write the tests in various programming\
    \ languages like Ruby, JRuby, PHP, Java, Jython, Groovy, Javascript, Clojure,\
    \ Gos, Lua, .Net, PHP, C++ and TCL\n5. Integrates very well with CI servers like\
    \ Jenkins and TeamCity\n6. Reports can be generated in HTML, JSON, JUnit style\n\
    7. Capybara - the testing framework - is a part of Cucumber\n8. Integrates very\
    \ well with frameworks like Selenium, Appium, Spring, Watir, Ruby on Rails etc.\n\
    \n**2. Installation of Cucumber**\n\nSetting up Cucumber is very simple.\n\nYou\
    \ will need to install below tools.\n\n1. Java JDK\n2. Java IDE - IntelliJ IDEA\
    \ or Eclipse\n3. Cucumber library\n4. Build tools like Maven or gradle\n5. IntelliJ\
    \ IDEA Plugins - Gherkin and cucumber for Java\n\nBelow image shows the IntelliJ\
    \ plugins that you need.\n\n![](img/01a02959ac67a9cb80992ea769fa586c_12_0.png)\n\
    \n*Cucumber and Gherkin plugins in IntelliJ IDEA*\n\nCreate a simple Maven or\
    \ gradle project and add below dependency.\n\n```xml\n<dependency>\n  <groupId>info.cukes</groupId>\n\
    \  <artifactId>cucumber-java</artifactId>\n  <version>1.2.4</version>\n  <scope>test</scope>\n\
    </dependency>\n```\n\nFor writing the test steps using lambda expression in Java\
    \ 8, you will have to add below dependency.\n\n```xml\n<dependency>\n  <groupId>info.cukes</groupId>\n\
    \  <artifactId>cucumber-java8</artifactId>\n  <version>1.2.4</version>\n  <scope>test</scope>\n\
    </dependency>\n```\n\nYou also need below JUnit dependencies to integrate Cucumber\
    \ with JUnit.\n\n```xml\n<dependency>\n  <groupId>junit</groupId>\n  <artifactId>junit</artifactId>\n\
    \  <version>4.12</version>\n  <scope>test</scope>\n</dependency>\n\n<dependency>\n\
    \  <groupId>info.cukes</groupId>\n  <artifactId>cucumber-junit</artifactId>\n\
    \  <version>1.2.4</version>\n  <scope>test</scope>\n</dependency>\n```\n\n**3.\
    \ Writing feature files using Gherkin**\n\nBDD is an emerging development model\
    \ used with agile. Some of the key things to know about BDD are -\n\n1. First\
    \ created BDD framework\n2. Other BDD frameworks are spec, Cucumber\n3. The tests\
    \ are written in plain text of stories or features\n4. Domain specific language\
    \ (Gherkin) is used for writing tests\n\n**What is Gherkin?**\n\nGherkin is the\
    \ plain text language used to write feature files (also called as stories) implemented\
    \ in most of languages like English, German, many more. This means any stakeholder\
    \ can write and understand the tests.\n\n**Key points to note about feature file**\n\
    \n1. Each feature file can contain one or more scenarios and outline\n2. Each\
    \ scenario has steps like given, when, then\n\n**What are the keywords in Gherkin?**\n\
    \nGherkin has some reserved keywords which have specific meaning in the context\
    \ of feature files. Below is the list of\n\n1. Given - used to specify the condition\
    \ of the scenario\n2. When - used to specify the action\n3. And - used to specify\
    \ additional conditions\n4. Then - used to specify the result of the action\n\
    5. Feature - used to specify the feature\n6. Scenario - used to specify the scenario\n\
    7. Outline\n8. Background - used to specify the action to be taken before each\
    \ scenario\n9. \"\" - used to pass data in line format\n10. | - used to pass data\
    \ in table format\n11. @ - used to tag scenarios and features\n12. # - used to\
    \ comment the line in feature file\n\nBelow feature file will make you understand\
    \ most of the syntax of Cucumber.\n\n**Basic feature file**\n\nNow let us take\
    \ a look at simplest feature file that we can have in gherkin.\n\nFeature: ATM\
    \ authentication\n\nUser should be asked for the PIN once ATM card is inserted\
    \ into the machine.\nUser should be given warning message if PIN number is wrong.\n\
    User should be authenticated successfully if PIN number is correct.\n\nScenario:\
    \ Enter wrong PIN at ATM\nGiven I insert the ATM card in machine\nAnd I am asked\
    \ to enter the PIN\nWhen I enter the correct PIN\nThen I should be able to see\
    \ option to withdraw money\n\n**Sample feature file with Outline and Examples\
    \ keyword**\n\nScenario outline-are-used in cases where we need to repeat same\
    \ set of actions but with different combination of data. For instance, In below\
    \ scenario outline, we need to test the login functionality with different combinations\
    \ of user id and password. In such cases, we use <VariableData> syntax to specify\
    \ the varying data and it is supplied through examples keyword. So in below scenario,\
    \ all steps will be executed 4 times - one for each user.\n\nScenario Outline:\
    \ Password rules\nGiven that we are on login page\nWhen we enter user id <ID>\
    \ and password <PASSWORD>\nThen the login should be <OUTCOME>\n\nExamples:\n|\
    \ ID | PASSWORD | OUTCOME |\n| :--- | :--- | :--- |\n| Sagar | 128$9# | Fail |\n\
    | Amol | 98sjdg | PASS |\n| Shaun | jslsh9 | PASS |\n| Ben | KON() | FAIL |\n"
  mdcn: "\n\n# Java 语言下的 CUCUMBER \n\n![](img/01a02959ac67a9cb80992ea769fa586c_0_0.png)\n\
    \n## 初学者指南\n\nPAUL WATSON\n\n**关于作者**\n\nPaul Watson 先生在 BDD 和 Cucumber 方面拥有多年经验。他曾在美国、英国、新加坡、香港、迪拜、澳大利亚和瑞士工作过大型软件项目。\n\
    \n他的爱好包括去新的旅游胜地旅行、看篮球、板球、足球以及学习最新的技术知识。\n\n**这本书是写给谁的**\n\n本书适用于软件开发人员、自动化测试人员、Devops\
    \ 以及从事 IT 项目的工程师。无论你是初学者还是经验丰富的开发者，这本书都将帮助你掌握 Cucumber 技能。\n\n本书从 Cucumber 的介绍开始，然后深入核心概念，如在\
    \ IntelliJ IDEA 中创建项目、使用标签、插件、与 Junit 集成、执行 Selenium 测试、使用 PicoContainer 和 Lambda\
    \ 表达式。\n\n**序言**\n\n本书是为 Cucumber 的初学者准备的。它将帮助你理解什么是 Cucumber，以及你如何在软件项目中使用它。\n\
    \n在本书中，你将学习以下主题：\n\n1. Cucumber 简介\n2. 安装 Cucumber\n3. 使用 Gherkin 编写 feature 文件\n\
    4. 为 Java 项目添加 Cucumber 依赖\n5. Cucumber 测试\n6. 使用 Cucumber 类执行 Cucumber 测试\n7.\
    \ Cucumber 选项\n8. 过滤场景（Scenarios）\n9. 向步骤传递参数\n10. 向步骤传递数据表\n11. feature 文件变体\n\
    12. 在 Cucumber 中运行多个 feature 文件\n13. 使用 PicoContainer 共享 selenium Webdriver 实例\n\
    14. Cucumber 报告\n15. 使用 Lambda 表达式使用 Cucumber\n\n关于作者\n这本书是写给谁的\n\n序言\n\n1. 简介\n\
    2. 安装 Cucumber\n3. 使用 Gherkin 编写 feature 文件\n4. 为 Java 项目添加 Cucumber 依赖\n5. Cucumber\
    \ 测试\n5.1 编写第一个 cucumber 测试\n6. 使用 Cucumber 类执行 Cucumber 测试\n7. Cucumber 选项\n\
    8. 过滤场景\n8.1 为场景打上标签\n8.2 使用 name 选项\n9. 向步骤传递参数\n10. 向步骤传递数据表\n10.1 键值对数据表\n\
    10.2 Cucumber 中的多列数据表\n11. feature 文件变体\n11.1 场景背景（Background）\n11.2 场景大纲（Outline）\n\
    12. 在 Cucumber 中运行多个 feature 文件\n13. 使用 PicoContainer 共享 selenium Webdriver 实例\n\
    14. Cucumber 报告\n14.1 嵌入截图\n14.2 写入 Cucumber HTML 报告\n15. 使用 Lambda 表达式使用 Cucumber\n\
    15.1 Java 8 中使用 Lambda 表达式 Cucumber 依赖\n15.2 使用 Lambda 表达式进行 cucumber 测试\n\n**1.\
    \ 简介**\n\nCucumber 是 BDD（行为驱动开发）测试框架。\n\n关于 Cucumber 需要的关键点有：\n\n1. 开源 BDD 测试框架。\n\
    2. 跨平台框架。\n3. 使用英语、法语、德语等多种语言通过 Gherkin 语法编写测试。\n4. 我们可以使用多种编程语言编写测试，如 Ruby, JRuby,\
    \ PHP, Java, Jython, Groovy, Javascript, Clojure, Gos, Lua, .Net, PHP, C++ 和 TCL。\n\
    5. 与 Jenkins 和 TeamCity 等 CI 服务器集成得非常好。\n6. 报告可以以 HTML、JSON、JUnit 格式生成。\n7. Capybara\
    \ - 测试框架 - 是 Cucumber 的一部分。\n8. 与 Selenium, Appium, Spring, Watir, Ruby on Rails\
    \ 等框架集成得非常好。\n\n**2. 安装 Cucumber**\n\n设置 Cucumber 非常简单。\n\n你需要安装以下工具：\n\n1. Java\
    \ JDK\n2. Java IDE - IntelliJ IDEA 或 Eclipse\n3. Cucumber 库\n4. 构建工具，如 Maven 或\
    \ gradle\n5. IntelliJ IDEA 插件 - 用于 Java 的 Gherkin 和 cucumber\n\n下图显示了你需要的 IntelliJ\
    \ 插件。\n\n![](img/01a02959ac67a9cb80992ea769fa586c_12_0.png)\n\n*IntelliJ IDEA\
    \ 中的 Cucumber 和 Gherkin 插件*\n\n创建一个简单的 Maven 或 gradle 项目并添加以下依赖。\n\n```xml\n<dependency>\n\
    \  <groupId>info.cukes</groupId>\n  <artifactId>cucumber-java</artifactId>\n \
    \ <version>1.2.4</version>\n  <scope>test</scope>\n</dependency>\n```\n\n要在 Java\
    \ 8 中使用 lambda表达式编写测试步骤，你需要添加以下依赖。\n\n```xml\n<dependency>\n  <groupId>info.cukes</groupId>\n\
    \  <artifactId>cucumber-java8</artifactId>\n  <version>1.2.4</version>\n  <scope>test</scope>\n\
    </dependency>\n```\n\n你还需要以下 JUnit 依赖将 Cucumber 与 JUnit 集成。\n\n```xml\n<dependency>\n\
    \  <groupId>junit</groupId>\n  <artifactId>junit</artifactId>\n  <version>4.12</version>\n\
    \  <scope>test</scope>\n</dependency>\n\n<dependency>\n  <groupId>info.cukes</groupId>\n\
    \  <artifactId>cucumber-junit</artifactId>\n  <version>1.2.4</version>\n  <scope>test</scope>\n\
    </dependency>\n```\n\n**3. 使用 Gherkin 编写 feature 文件**\n\nBDD 是一种与敏捷结合的新兴开发模型。关于\
    \ BDD 的一些关键点是：\n\n1. 最先创建的 BDD 框架\n2. 其他 BDD 框架有 spec, Cucumber\n3. 测试是用故事或特性的纯文本编写的\n\
    4. 使用领域特定语言（Gherkin）来编写测试\n\n**什么是 Gherkin？**\n\nGherkin 是一种用于编写 feature 文件（也称为故事）的纯文本语言，可以用英语、德语等许多语言进行实现。这意味着任何利益相关者都可以编写并理解测试。\n\
    \n**关于 feature 文件的关键点**\n\n1. 每个 feature 文件可以包含一个或多个场景（scenario）和大纲（outline）\n\
    2. 每个场景都有如 given, when, then 这样的步骤\n\n**Gherkin 中的关键字有哪些？**\n\nGherkin 具有一些保留关键字，它们在\
    \ feature 文件的文中具有特定含义。以下是列表：\n\n1. Given - 用于指定场景的条件\n2. When - 用于指定动作\n3. And\
    \ - 用于指定额外条件\n4. Then - 用于指定动作的结果\n5. Feature - 用于指定功能\n6. Scenario - 用于指定场景\n\
    7. Outline - 场景纲\n8. Background - 用于指定在每个场景之前要执行的操作\n9. \"\" - 用于以行格式传递数据\n10.\
    \ | - 用于以表格格式传递数据\n11. @ - 用于为场景和功能标记标签\n12. # - 用于对 feature 文件中的行进行注释\n\n下面的\
    \ feature 文件将让你理解 Cucumber 的大部分语法。\n\n**基础 feature 文件**\n\n现在让我们来看看我们在 gherkin\
    \ 中可以拥的最简单的 feature 文件。\n\nFeature: ATM 身份验证\n\n当 ATM 卡插入机器时，应要求用户输入 PIN 码。\n\
    如果 PIN 码错误，应给用户显示警告消息。\n如果 PIN 码正确，用户应成功通过身份验证。\n\nScenario: 在 ATM 输入错误的 PIN\n\
    Given 我将 ATM 卡插入机器\nAnd 我被要求输入 PIN\nWhen 我输入正确的 PIN\nThen 我应该看到取款的选项\n\n**带有 Outline\
    \ 和 Examples 关键字的示例 feature 文件**\n\nScenario outline 用于我们需要重复一组操作但使用不同数据组合的情况。例如，在下方的场景\
    \ outline 中，我们需要用不同的用户 ID 和密码组合来测试登录功能。在这些情况下，我们使用 <VariableData> 语法来指定变化的数据，并通过\
    \ examples 关键字提供。因此，在下面的场景中，所有步骤将执行 4 次 - 每个用户执行一次。\n\nScenario Outline: 密码规则\n\
    Given 我们位于登录页面\nWhen 我们输入用户 ID <ID> 和密码 <PASSWORD>\nThen 登录结果应该是 <OUTCOME>\n\n\
    Examples:\n| ID | PASSWORD | OUTCOME |\n| :--- | :--- | :--- |\n| Sagar | 128$9#\
    \ | Fail |\n| Amol | 98sjdg | PASS |\n| Shaun | jslsh9 | PASS |\n| Ben | KON()\
    \ | FAIL |\n\n"
