    \ void i_verify_that_title_contains_tutorials() throws Throwable {\n        Assert.assertTrue(sharedClass.getDriver().getTitle().toLowerCase().contains(\"\
    tutorials\"));\n    }\n\n    @Then(\"^I verify_that_title_contains_tutooorials$\"\
    )\n    public void i_verify_that_title_contains_tutooorials() throws Throwable\
    \ {\n        Assert.assertTrue(sharedClass.getDriver().getTitle().toLowerCase().contains(\"\
    tutooorials\"));\n    }\n}\n```\n\n## 14. Reports in Cucumber\n\n### 14.1 Embedding\
    \ the screenshot\n\nWhen working in a selenium automation project, we often need\
    \ to take a screenshot on test failure. Selenium API provides a way to take screenshot\
    \ with the help of takesScreenshot interface.\n\nCucumber allows you to embed\
    \ that screenshot in the Cucumber reports. Here is the simple code.\n\n```java\n\
    @After(\"@selenium\")\npublic void killBrowser(Scenario scenario) {\n    if (scenario.isFailed())\
    \ {\n        scenario.embed(((TakesScreenshot)driver).getScreenshotAs(OutputType.BYTES),\
    \ \"image/png\");\n    }\n    driver.close();\n    driver.quit();\n}\n```\n\n\
    Below image shows where to find the HTML report in Maven project.\n\n![](img/01a02959ac67a9cb80992ea769fa586c_57_0.png)\n\
    *Cucumber report location in Maven project*\n\nHere is the sample HTML report\
    \ showing the captured screenshot.\n\n![](img/01a02959ac67a9cb80992ea769fa586c_58_0.png)\n\
    *Embeding the screenshot in Cucumber report*\n\n### 14.2 Writing to Cucumber HTML\
    \ reports\n\nWe can write to Cucumber HTML report using write method of Scenario\
    \ class. Below step definition class illustrates how to write to HTML report.\
    \ Note how we have passed scenario object to Before method.\n\n```java\npackage\
    \ org.softpost;\n\nimport com.google.common.primitives.Bytes;\nimport cucumber.api.Scenario;\n\
    import cucumber.api.java.After;\nimport cucumber.api.java.Before;\nimport cucumber.api.java.en.Given;\n\
    import cucumber.api.java.en.Then;\nimport junit.framework.Assert;\nimport org.openqa.selenium.OutputType;\n\
    import org.openqa.selenium.TakesScreenshot;\nimport org.openqa.selenium.WebDriver;\n\
    import org.openqa.selenium.firefox.FirefoxDriver;\n\n/**\n * Created by Sagar\
    \ on 12-07-2016.\n */\n@SuppressWarnings(\"ALL\")\npublic class seleniumsteps\
    \ {\n\n    WebDriver driver;\n    Scenario scenario;\n\n    @Before(\"@selenium\"\
    )\n    public void launchBrowser(Scenario scenario) {\n        driver = new FirefoxDriver();\n\
    \        this.scenario = scenario;\n    }\n\n    @Given(\"^I am on_the_www\\.softpost\\\
    .org_home_page$\")\n    public void i_am_on_the_www_softpost_org_home_page() throws\
    \ Throwable {\n        driver.get(\"http://www.softpost.org\");\n        scenario.write(\"\
    Navigated to www.softpost.org\");\n    }\n\n    @Then(\"^I verify_that_title_contains_tutorials$\"\
    )\n    public void i_verify_that_title_contains_tutorials() throws Throwable {\n\
    \        Assert.assertTrue(driver.getTitle().toLowerCase().contains(\"tutorials\"\
    ));\n    }\n\n    @Then(\"^I verify_that_title_contains_tutooorials$\")\n    public\
    \ void i_verify_that_title_contains_tutooorials() throws Throwable {\n       \
    \ Assert.assertTrue(driver.getTitle().toLowerCase().contains(\"tutooorials\"));\n\
    \    }\n\n    @After(\"@selenium\")\n    public void killBrowser() {\n       \
    \ scenario.write(\"Finished scenario\");\n        if (scenario.isFailed()) {\n\
    \            scenario.embed(((TakesScreenshot)driver).getScreenshotAs(OutputType.BYTES),\
    \ \"image/png\");\n        }\n        driver.close();\n        driver.quit();\n\
    \    }\n}\n```\n\nHere is the sample HTML report.\n\n![](img/01a02959ac67a9cb80992ea769fa586c_60_0.png)\n\
    *Writing to cucumber HTML report*\n\n## 15. Cucumber using Lambda Expressions\n\
    \n### 15.1 Cucumber dependency for using Lambda expressions in Java 8\n\nIn Java\
    \ 8, Lambda expressions were introduced. Cucumber allows you to write step definitions\
    \ using Lambda expressions. You need to add below dependency to write tests using\
    \ Lambda expressions.\n\n```xml\n<dependency>\n    <groupId>info.cukes</groupId>\n\
    \    <artifactId>cucumber-java8</artifactId>\n    <version>1.2.4</version>\n \
    \   <scope>test</scope>\n</dependency>\n```\n\nEnsure that JDK version is 1.8.0_51.\
    \ Otherwise you will get below error.\n\nException in thread \"main\" cucumber.runtime.CucumberException:\
    \ Failed to instantiate class …….CucumberException: java.lang.IllegalArgumentException:\
    \ Wrong type at constant pool index\n\n### 15.2 Cucumber test using Lambda expressions\n\
    \nNow let us write sample step definitions using Lambda expressions. Here is the\
    \ sample feature file.\n\n```gherkin\nFeature: Lambda feature\nScenario: Verify\
    \ sum\n  Given I add 1 and 2\n  Then I verify that sum is 3\n```\n\nHere is the\
    \ sample Test Class using Lambda expressions to write the step definitions. Note\
    \ that StepClass must implement cucumber.api.java8.En interface and step methods\
    \ should be inside the constructor of test class. You also need to ensure Java\
    \ language level should be 1.8.\n\n```java\npackage org.softpost;\n\nimport cucumber.api.java8.En;\n\
    \npublic class StepClass8 implements En {\n\n    public StepClass8() {\n     \
    \   Given(\"^I add 1 and 2$\", () -> {\n            System.out.println(\"Adding\
    \ 1 and 2\");\n        });\n\n        Then(\"^I verify that sum is 3$\", () ->\
    \ {\n            System.out.println(\"Checking that sum is 3\");\n        });\n\
    \    }\n}\n```\n\nIf you are using Maven, you can specify the Java language level\
    \ using below XML section in POM.XML:\n\n```xml\n<build>\n    <plugins>\n    \
    \    <plugin>\n            <groupId>org.apache.maven.plugins</groupId>\n     \
    \       <artifactId>maven-compiler-plugin</artifactId>\n            <version>2.3.2</version>\n\
    \            <configuration>\n                <source>1.8</source>\n         \
    \       <target>1.8</target>\n                <encoding>UTF-8</encoding>\n   \
    \         </configuration>\n        </plugin>\n    </plugins>\n</build>\n```\n"
