    0m0.59s\n\n## 12. 在 Cucumber 中运行多个文件\n我们可以像下面所示在多个文件中执行场景。注意，要执行所有文件，我们使用操作符。\n\
    \n```java\npackage org.softpost;\n\nimport cucumber.api.junit.CucumberOptions;\n\
    import org.junit.runner.RunWith;\n\n@RunWith(Cucumber.class)\n@CucumberOptions(\n\
    \    features = {\"feature\",\"outline.feature\"},\n    glue = {\"softpost\"},\n\
    \    plugin = {\"html:target/cucumber-reports\"}\n)\npublic class MultipleTest\
    \ {\n}\n```\n这里是执行后生成的 HTML 报告。\n\n## 13. 使用 PicoContainer 共享 driver 实例\n在 Selenium\
    \ 自动化中，我们创建一个 driver 实例。但我们可以通过两种方式在不同的步骤类中使用同一个 driver：\n1. 通过创建静态字段\n2. 使用 PicoContainer（依赖注入）\n\
    \n第一种方法非常简单。只需创建一个带有静态字段的类即可。现在让我们来看看如何使用依赖注入共享 driver。对于这一点，你需要下面的依赖项。\n\n```xml\n\
    <dependency>\n    <groupId>org.selenium</groupId>\n    <artifactId>selenium-java</artifactId>\n\
    \    <version>2.42.2</version>\n</dependency>\n\n<dependency>\n    <groupId>info.cukes</groupId>\n\
    \    <artifactId>picocontainer</artifactId>\n    <version>1.2</version>\n    <scope>test</scope>\n\
    </dependency>\n```\n\n接下来，我们需要创建一个类，并在其中如示例所示创建 driver。注意我们只实例化一次 driver。我们得到了\
    \ getDriver() 方法来获取 driver。\n\n```java\npackage org.softpost;\n\nimport cucumber.api.java.After;\n\
    import cucumber.api.java.Before;\nimport org.openqa.selenium.WebDriver;\nimport\
    \ org.openqa.selenium.firefox.FirefoxDriver;\n\npublic class SharedClass {\n\n\
    \    private static boolean startBrowser = false;\n    private WebDriver driver;\n\
    \    public String title = \"\";\n\n    @Before(\"@sharedselenium\")\n    public\
    \ void init() throws Exception {\n        if (!startBrowser) {\n            driver\
    \ = new FirefoxDriver();\n            // 如果要在每个场景后停止启动浏览器，将下方变量赋值为 true\n    \
    \        startBrowser = false;\n        }\n    }\n\n    public WebDriver getDriver()\
    \ {\n        return driver;\n    }\n\n    @After(\"@sharedselenium\")\n    public\
    \ void cleanUp() {\n        driver.close();\n        driver.quit();\n    }\n}\n\
    ```\n\n"
