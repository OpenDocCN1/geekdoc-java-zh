    ### 11.1 Scenario Background（场景背景）\n有时，我们需要在同一个 feature 文件的每个场景（scenario）执行之前执行某些步骤。Background\
    \ 允许你在多个场景之间复用相同的步骤。例如 - 为了测试某些功能，我们可能需要在每个场景执行之前对记录进行过滤。因此，我们可以将过滤记录所需的步骤放在 Background\
    \ 内部。这些步骤会在同一个 feature 文件中的每个场景执行时被重复执行。\n\n在下方的 feature 文件中，我们在背景中有一个步骤（Given\
    \ I filter some records）。该步骤将在此 feature 文件的每个场景执行之前执行。\n\nFeature: 简单的背景功能\n\n\
    \  Background: 在每个场景执行前执行\n    Given 我过滤了一些记录\n\n    Scenario: 验证删除功能\n      Given\
    \ 我点击第一条记录的删除按钮\n      Then 我验证该记录已从表格中删除\n\n    Scenario: 验证更新功能\n      Given\
    \ 我点击第一条记录的更新按钮\n      Then 我验证该记录在新窗口中打开，并且我们可以对其进行修改\n\n这里是步骤定义类。\n```java\n\
