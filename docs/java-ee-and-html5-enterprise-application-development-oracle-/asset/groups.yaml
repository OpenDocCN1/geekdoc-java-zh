    ## 第 6 章：HTML5 与 Java 应用安全


    当 Web 应用将用户输入整合到生成的输出中，但没有对输入进行适当的验证或编码时，就会发生 XSS。来自终端用户（例如表单输入）或数据连接（例如 REST
    服务）的数据被视为不可信数据。这些数据并不是你作为应用程序的一部分创建的，因此你无法验证它们是否来自可信源。你必须防范这些不可信数据。


    理解 XSS 的最佳方法是看一些示例。虽然本节的重点是客户端安全，但服务器端 XSS 攻击最容易理解，因此接下来提供了两个服务器端 XSS 攻击的示例，随后是一个客户端示例。


    对于第一个示例，假设你决定为 404（未找到文件）错误创建一个自定义错误页面。当有人输入类似下面的 URL 时：


    ```

    http://my.website.com/not-here

    ```


    错误页面返回一条消息，说明服务器上未找到 not-here 文件。如果错误消息中显示的数据在被浏览器读取之前没有转义，就会发生 XSS 漏洞，在这种情况下，攻击者可以执行类似以下的操作：


    ```

    http://my.website.com/<script>alert("TEST")</script>

    ```


    浏览器在解析数据以显示为错误消息的一部分时，会执行 `<script>` 标签。


    对于第二个示例，假设你的 Web 应用有一个搜索框。当用户进行搜索时，搜索结果将显示在一个单独的结果页面上。如果页面使用了常见的“找到针对：<搜索内容> 的
    x 个结果”这种模式，并且没有对搜索字符串进行适当的编码，就会发生 XSS 漏洞。如果恶意用户输入类似于上一个示例中 `<script>` 块的搜索字符串，那么当搜索结果页面在浏览器中加载时，JavaScript
    将执行。


    上述两个示例通常会在服务器端处理，因为错误页面和搜索结果页面通常会在服务器上生成。如前所述，第三种 XSS 攻击纯粹是客户端的，涉及 JavaScript
    如何处理 DOM 元素的执行。


    为了演示基于 DOM 的 XSS 攻击是如何工作的，我们将使用一个与之前的搜索字段示例类似的示例。假设你的 HTML5 应用有一个表单，其中包含一个请求用户用户名的输入字段。该表单还包含一个
    `<div>` 元素，当用户按下回车键时，该元素将更新以显示用户在输入字段中输入的任何内容。列表 6-1 显示了该示例的代码。


    ### 列表 6-1 表单示例


    ```

    <label id="nameLabel" for="userName">User name: </label>

    <input id="userName" autocomplete="off"/>


    <div id="user"></</div>

    ```


    你想要将此 `<div>` 元素的内容设置为用户名输入字段中输入的字符串值。使用原生 JavaScript 执行此操作可能类似于列表 6-2。


    ### 列表 6-2 innerHTML 示例


    ```javascript

    document.getElementById("user").innerHTML = document.getElementById("userName").value;

    ```


    列表 6-2 中的代码运行得完全正常。然而，通过使用 `<div>` 元素的 `.innerHTML` 属性，你将自己暴露在了基于 DOM 的 XSS 攻击之下了。如果恶意用户输入了类似于下面内容的字符串：


    ```

    <div onmouseover="javascript:alert(''failed!'')">XSS Test</div></div>

    ```


    该 HTML 将按原样添加到 DOM 中，下一次有人将鼠标移动到新的 `<div>` 元素上时，JavaScript 就会执行。


    对于某些 DOM 属性和方法，你应该避免处理不可信数据。部分列表包括：


    - element.innerHTML

    - document.write()

    - document.writ()

    - javascript.eval()

    - element eventHandlers

    - setTimeout

    - setInterval

    - new function ()


    通常情况下，如果你正在处理不可信数据，请设置你的 HTML 以便可以使用元素的 `.textContent` 方法（如列表 6-3 所示），而不是尝试直接添加
    HTML。


    ### 列表 6-3 textContent 示例


    ```javascript

    document.getElementById("user").textContent = document.getElementById("userName").value;

    ```


    如果你必须允许不可信数据进入可以被 JavaScript 或 HTML 解析器执行的上下文，那么你应该学习如何使用提供的许多 HTML 和 JavaScript
    编码器之一。你可以尝试自己使用编码器，但这样做可能是很复杂的，因为每个浏览器的 JavaScript 引擎处理方式略有不同。你最好使用由信任的安全团队开发的编码器，例如来自开放
    Web 应用安全项目 (OWASP) 团队提供的企业安全 API (ESAPI)。


    你应该意识到，使用 jQuery 等 JavaScript 框架也会相同的问题。使用如下代码：


    ```javascript

    $(''#user'').html($(''#userName'').val());

    ```


    将打开与 `.innerHTML` 相同的 XSS 攻击向量。如果你在使用 jQuery，请确保使用 `.text` 而不是 `.html`：


    ```javascript

    $(''#user'').text($(''#userName'').val());

    ```


    ![](img/6d0f4c34e63ae3ea4485e31eaa5072)


    ## Java EE 和 HTML5 企业级应用开发


    ### 跨站请求伪造


    利用跨站请求伪造 (CSRF) 安全漏洞的攻击并不常见，因为它们只在非常有限的条件下成功。然而，如果你不采取某些措施来防止攻击，你就会让你的网站访问者面临潜在的严重结果。


    解释 CSRF 攻击的一种良好方法是使用银行网站的示例。我们将该网站称为 megabank.com。当你登录该银行网站的账户时，登录会在浏览器中存储一个 cookie。这对于银行网站来说是完全正常且接受的做法。如果你在没有注销的情况下离开了网站，CSRF
    漏洞就会存在。你的浏览器在缓存中仍然拥有该 cookie。cookie 的过期时间由 megabank.com 网站设置，大多数情况下会在最后活动后 15
    分钟过期。不过，这个过期时间可能会有所不同。假设你导航到另一个被黑的网站，该网站包含了恶意代码，激活后（例如通过点击按钮）会指示你的浏览器向 megabank.com
    发送请求，从“你的账户”转移资金到黑客账户。当银行网站接收到请求时，它会寻找会话 cookie 来识别用户，它会在你的浏览器中找到。转移就像是你执行了请求一样。


    虽然成功的 CSRF 攻击所需的所有变量存在的概率较低，但只需要一次成功的攻击就能破坏 megabank.com 网站的声誉。如果你遇到过垃圾邮件或链接到看似随机网站的垃圾评论，它们很可能是诱导你进行
    CSRF 攻击的尝试。CSRF 漏洞最糟糕的部分是终端用户甚至不需要在被黑的网站上点击任何内容。整个攻击可以在页面加载时由 JavaScript 处理。


    所以，你可以做什么来确保你的 HTML5 应用不会允许这种 CSRF 攻击？首先，要意识到你的应用程序必须维护会话 cookie 这种类型的攻击才会发生。如果你的应用程序不维护会话
    cookie（无状态应用程序），那么它就不会受到这种攻击的影响，你不需要做任何事情。


    '
