    All the information needed for processing is contained in the method parameters.


    +   **Stateful** The bean saves state information during its conversation with
    the user. These enterprise beans are useful for business processes that require
    an interaction between a client and application service that lasts longer than
    a single method invocation and requires memory of the state of the interaction.
    An example is an online shopping cart. The end user, through the client program,
    can order a'
