    | 属性 | 描述 |

    | --- | --- |

    | <input type="color"/> | 输入值代表颜色 |

    | <input type="date"/> | 输入值代表日期 |

    | <input type="datetime"/> | 输入值代表日期和时间 |

    | <input type="datetime-local"/> | 输入值代表无时区偏移的本地日期和时间 |

