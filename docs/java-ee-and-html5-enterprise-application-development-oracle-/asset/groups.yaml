    Web 应用中的所有角色。换句话说，指定预留角色名称 `*`意味着任何登录用户都可以访问该资源。


    - `<user-data-constraint>` 如果指定，则表示资源可以通过安全传输进行访问。在列表 6-6 中，需要添加以下元素：


    ```xml

    <user-data-constraint>

    <transport-guarantee>CONFIDENTIAL</transport-guarantee>

    </user-data-constraint>

    ```


    如果客户端尝试使用 HTTP 访问资源，它将被重定向到 HTTPS URL。这确保了传输的数据不会被其他实体观察到，从而允许强制执行机密性这一核心概念。


    `<transport-guarantee>` 子元素也可以取 `NONE` 或 `INTEGRAL` 的值。后者确保了数据在传输过程中不会被更改，从而允许强制执行数据完整性这一核心概念。


    它同样重要的是，如果在 `<security-constraint>` 中列出了一个 `<http-method>`，则该方法将按照部署描述符中定义的约束受到保护。所有其他未显式列出的
    HTTP 方法被称为“未受保护的方法”（uncovered methods）。在部署描述符中添加顶层 `<deny-uncovered-http-methods/>`
    元素可以保护这些方法。


    - `<login-config>` 元素用于配置此应用程序应使用的身份验证方法和域（realm）。它具有以下子元素：


    - `<auth-method>` 配置 Web 应用的身份验证机制。元素内容必须是 `BASIC`、`DIGEST`、`FORM`、`CLIENT-CERT`
    或特定厂商身份验证方案。前四个值对应之前解释的不同身份验证方案。


    - `<realm-name>` 指定为 Web 应用选择的身份验证方案使用的域名称。


    - `<security-role>` 元素定义安全角色。子元素 `<role-name>` 指定安全角色的名称。注意，这些角色是以特定应用程序服务器的方式创建。


    ## REST 资源安全


    在保护 REST 资源时，以下是需要记住的一些指南：


    - 用户名和密码、安全令牌或 API 密钥不应出现在 URL 中，因为它们可能会在 Web 服务器日志中被捕获并用于恶意目的。


    - 每个 REST 资源并不一定需要被读取 (GET)、创建 (POST)、更新 (PUT) 和删除 (DELETE)。确保在部署描述符中仅暴露了所需的 HTTP
    方法，并使用之前定义的机制（如 `<deny-uncovered-http-methods/>`）显式地保护其他方法。


    - 每个用户并不需要访问所有 REST 资源。通过使用 `<security-role>` 定义角色并相应地使用 `<auth-constraint>` 提供资源访问来实现适当的授权。


    - 对于接收多种内容类型的 REST 端点，始终检查 Content-Type 头部和 Bean Validation 约束（如第 2 节所述），以限制类型。


    - 第三方 REST API 允许通过 Google、Facebook 和 Twitter 等流行的 OAuth 提供者进行身份验证和授权。考虑集成这些提供者，而不是从零开始创建自己的基础设施。


    ## WebSocket 安全


    WebSocket 连接是从现有的 HTTP 连接升级而来的。普通 WebSocket 连接使用 `ws` URI 方案建立，安全连接可以使用 `wss`
    URI 方案建立。这允许通过标准端口 80（用于明文通信）和 443（用于安全通信）进行 WebSocket 通信，因此不需要在防火墙中打开额外端口。这还允许现有的
    HTTP 安全机制应用于 WebSocket 连接。


    WebSocket 使用 Web 浏览器常用的基于源的安全模型。RFC 6454 (https://www.iet.org/rfc/rfc6454.txt)
    定义了用户代理（如浏览器）如何隔离从不同源（URL 的方案、主机名和端口的组合）获取的内容，以防止恶意网站的运营者干扰良性网站的运行。基本上，从一个源获取的内容可以与从同一源获取的其他内容自由交互，但它与从不同源获取的内容交互的方式受到限制。RFC
    6455 定义了一个 HTTP 头部字段 `Origin`，它指示与 HTTP 请求关联的源。浏览器的 WebSocket 握手需要包含此头部，以便后续请求能够得到相应的处理。然而，当非浏览器客户端初始化
    WebSocket 连接时，该模型将不起作用。


    除了 `Origin` 字段外，WebSocket 开启握手还需要 `Sec-WebSocket-Key` 字段。该字段作为开启握手的一部分从客户端发送，并用于服务器证明它收到了有效的
    WebSocket 握手。这有助于确保服务器接受来自非 WebSocket 客户端（例如 HTTP 客户端）的连接，这些连接可能被滥用向毫无防备的 WebSocket
    服务器发送数据。


    如你所见，WebSocket 已经提供了相当水平的协议级安全。此外，Java EE 中的 WebSocket 端点可以使用容器安全模型进行保护。映射到 `ws://`
    URI 的 WebSocket 在部署描述符中通过映射具有相同主机名、端口和路径的 URI 受到保护，因为这是开启握手的 URL。WebSocket 应用程序在开启握手之前可以使用基本身份验证或基于表单的身份验证。同样，可以通过向部署描述符中添加
    `<security-constraint>` 元素来设置 WebSocket 授权。安全约束中 `<url-pattern>` 用于匹配 WebSocket
    开启握手的请求 URI。最后，`CONFIDENTIAL` 的 `<transport-guarantee>` 允许通过 `wss://` 连接运行 WebSocket
    应用。


    ## 总结


    HTML5 规范提供了许多新功能，这些功能也带来了自身的安全问题。虽然本书重点关注 HTML5 与 Web 服务的交互（即服务器发送事件 Server-Sent
    Events），但可能还有其他你想要研究的领域，例如本地存储、地理定位等。


    开放 Web 应用项目 (OWASP) 是一个全球性的非营利组织，其主要关注点是提高安全性。该组织的网站 (www.owasp.org) 是研究 HTML5
    开发所有领域现有安全问题的绝佳资源。

