    | 元素 | 描述 |

    | --- | --- |

    | <audio> | 音频多媒体内容。 |

    | <video> | 视频多媒体内容。 |

    | <source> | <audio> 和 <video> 的子元素。当有多个可用源格式时使用。 |

    | <track> | 用于 <video> 元素的文本轨道。 |

    | <canvas> | 用于渲染动态位图内容的部分。用于图表或游戏等内容。 |

    | <svg> | 用于渲染可缩放矢量图形 (SVG) 的部分。 |


