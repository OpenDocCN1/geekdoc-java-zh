    # What This Book Covers


    The primary topics covered in this book


    +   - Java EE 7 Persistence API (JPA)


    +   - Java EE 7 API for RESTful Web Services (JAX-RS)


    +   - Java EE 7 API for WebSocket


    +   - New features of the HTML5 specification


    +   - JavaScript Model-View-View-ViewModel (MVVM) architectural pattern via Knockout.js


    +   - JavaScript API for REST, WebSocket, and Server-Sent Events (SSE)


    +   - Responsive design concepts via CSS3 features


    +   - CSS preprocessing with Syntactically Awesome StyleSheets (SASS)


    +   - Client and server security concepts for web-based applications


    These topics are covered in the following six chapters:


    +   - Chapter 1, "Introduction to Java EE and HTML5 Enterprise Development," provides
    a brief overview of the three main areas of the book: Java EE 7 web services,
    HTML5 application development, and NetBeans IDE.


    +   - Chapter 2, "Persistence," discusses the Java Persistence API (JPA) and shows
    you the key concepts for persistence and how data can be created, read, updated,
    and deleted from a relational database using JPA.


    +   - Chapter 3, "RESTful Resources," introduces you to REST, or Representational
    State Transfer, as an architectural style for distributed systems such as the
    World Wide Web. The Java EE 7 API for RESTful Web Services (JAX-RS) is covered,
    including the new support for Server-Sent Events (SSE). You are shown how to develop
    your own RESTful web service and SSE service that you will use as the data resources
    for a Book Club application that you develop in Chapter 5.'
- md: "\n# Introduction xii\n\n- Chapter 4, “WebSocket,” covers the development of\
    \ both the server and client portions of an application using WebSocket. You learn\
    \ about the Java API for WebSocket, as well as how to develop an HTML5 client\
    \ that interacts with the WebSocket service.\n- Chapter 5, “HTML5, JavaScript,\
    \ and CSS,” is all about HTML5 and client-side development. You interact with\
    \ the REST and SSE services that you created in Chapter 3. You are shown how to\
    \ work with the Model-View-View-Model (MVVM) architectural pattern through the\
    \ use of the JavaScript library, Knockout. You are introduced to responsive design\
    \ concepts as well as CSS preprocessing techniques with Syntactically Awesome\
    \ Stylesheets (SASS).\n- Chapter 6, “HTML5 and Java Application Service,” covers\
    \ security concepts for HTML5 client applications and Java EE–based web services.\n\
    \n## How to Use This Book and Code\n\nThis book is structured such that you can\
    \ read it sequentially or jump to any chapter and read it as a stand-alone topic.\
    \ Source code is provided for all applications discussed in the book and is available\
    \ for download at www.OraclePressBooks.com. This allows you to start in a later\
    \ chapter and still have access to the resources that you would have developed\
    \ had you read the earlier chapters first. For example, if you choose to read\
    \ Chapter 5 first, in which you develop the Book Club application, you have access\
    \ to the data resources from Chapter 3 that the application relies on. The source\
    \ code and follow along as you read each chapter, or deploy and run the source\
    \ code from NetBeans IDE—whichever method works best for you. Net IDE is used\
    \ throughout the book to show you how to use wizards and other efficient methods\
    \ of development, such as the built-in JavaScript debugger.\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_20_0.png)\n\
    \n## CHAPTER 1\n Introduction to Java EE and HTML5 Enterprise Development\n\n\
    ## 2 Java EE and HTML5 Enterprise Application Development\n\nThere have been many\
    \ changes taking place in the area of enterprise software development in recent\
    \ years. Two of the largest changes are the trend toward Software as a Service\
    \ (SaaS) and the use of HTML5 to provide a pure client-side user interface.\n\n\
    In this chapter, you will be introduced to the main topics that will be covered\
    \ throughout the book: NetBeans IDE, Java EE 7, and HTML5. You will be presented\
    \ with information about how to obtain the applications and samples that will\
    \ help you as you work your way through the coming chapters. Using this combination\
    \ of IDE, platform, and HTML5 technology, you will soon be building powerful,\
    \ dynamic enterprise applications.\n\n## Development Tools\n\nThree main development\
    \ tools are used throughout this book: NetBeans IDE, Java EE 7, and HTML5. You\
    \ will learn how to use the combination of these tools to build powerful, modern\
    \ enterprise applications. Before you begin building applications, it is important\
    \ to make sure you have a solid understanding of the basics of each of these technologies.\n\
    \n## NetBeans\n\nNetBeans IDE is the development tool you will use throughout\
    \ this book. It provides features such as editors, templates, and code generators\
    \ that make it a perfect fit for creating applications using Java EE 7 and HTML5.\
    \ Starting with NetBeans IDE 7.3, new features have been introduced to support\
    \ and enhance the development experience with client-side web applications that\
    \ utilize the HTML5 family of technologies. You can use this IDE to rapidly and\
    \ intuitively create rich web applications that support the responsive design\
    \ paradigm targeting desktop and mobile platforms simultaneously. In addition,\
    \ from NetBeans 7.4 onward, you can use HTML5 technologies within Java EE and\
    \ PHP applications.\n\nThe NetBeans story begins in 1996, when a group of students\
    \ at Charles University in Prague attempted to write a Delphi-like Java IDE in\
    \ Java. Originally called Xelfi, the student project delved into what was then\
    \ the uncharted territory of Java IDEs. Xelfi generated enough interest in the\n\
    \n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_21_0.png)\n\ndeveloper community that,\
    \ after they graduated, the students decided to put their new product on the market.\
    \ In 1997, they formed a company and changed the name of the IDE to NetBeans.\n\
    \nIt wasn't long before Sun Microsystems became interested in NetBeans as Sun\
    \ began searching for Java development tools. In 1999, Sun acquired NetBeans and\
    \ made the NetBeans IDE the flagship toolset for Java. At the time, Sun made another\
    \ critical decision: to establish NetBeans IDE as an open source project—free\
    \ to anyone wanted to use it. Over the years, the NetBeans IDE has become a fully\
    \ featured, cross-platform IDE, supporting all aspects of Java application development.\n\
    \nWhen Oracle acquired Sun in 2010, NetBeans IDE became part of Oracle, and Oracle\
    \ made the commitment to continue to support it. Today, more people are using\
    \ NetBeans IDE than ever before. By 2010, the one million active user was reached,\
    \ and the NetBeans IDE community continues to innovate and grow.\n\nYou can download\
    \ NetBeans IDE from the Oracle NetBeans website. Visit://netbeans.org/downloads\
    \ for overlook of the available distributions and to find the corresponding download\
    \ links. You need to have either \"Java EE\" or \"All\" distribution of NetBeans\
    \ IDE to be able to follow the instructions in this book. The instructions and\
    \ code samples have been created in NetBeans IDE 7.4, the latest version at the\
    \ time of writing. Subsequently released versions of NetBeans IDE should work\
    \ just as well, if you encounter problems when using a later version, you are\
    \ recommended to switch to NetBeans IDE 7.4.\n\nHaving just the Java Runtime Environment\
    \ (JRE) on your system is not sufficient for running NetBeans IDE. You need to\
    \ have the Java Development Kit (JDK), which includes a copy of the JRE. The IDE\
    \ relies on development tools and sources provided by the JDK. You can go to http://\
    \ oracle.com/technwork/java/index.html to find and download the latest version\
    \ of the JDK.\n\n## Java EE 7\n\nJava Platform, Enterprise Edition (Java EE) provides\
    \ a standards-based platform for developing web and enterprise applications. The\
    \ platform consists of multiple components that enable developers to build these\
    \ applications. Each component is defined using a formal specification that describes\
    \ the\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_22_0.png)\n\n## Java EE and\
    \ HTML5 Enterprise Application Development\n\nproposed component and its features.\
    \ The platform is also accompanied by an application programming interface (API)\
    \ described using Javadoc. This API is then used to build the application. The\
    \ platform also provides some additional services, such as naming, injection,\
