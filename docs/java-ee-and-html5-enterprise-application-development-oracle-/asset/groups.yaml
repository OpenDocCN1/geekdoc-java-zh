    ## Chapter 1: Introduction to Java EE and HTML5 Enterprise Development 5


    Java domain model. Consistent with the overarching theme adding an annotation
    allows a POJO to be mapped to a database table. There are reasonable defaults
    that can be overridden by annotations. The POJOs can also be used to generate
    the database tables, or even table-generation scripts. Developers can write string-based
    or type-safe queries to operate on the Java data model.


    In addition, the information from this data needs to be stored and retrieved to
    preserve the ACID (atomicity, consistency, isolation, durability) properties.
    This can be achieved using Enterprise JavaBeans (EJB) or the newly introduced
    @Transactional annotation. EJBs provide convenient container-managed transactions.
    They also come in different flavors: stateless (where there is no state on the
    server), stateful (state is stored on the server), and singleton (single instance
    per application per JVM).


    The newly added @Transactional annotation can be specified on a POJO to provide
    container-managed transactions outside of Enterprise JavaBeans. Annotating a class
    means all methods of the class are going to run inside a container-managed transaction.
    Alternatively, this annotation may be specified on a method to limit the scope
    of transaction.


    This book will cover all of these topics in detail using extensive code samples.


    In addition, the Java EE 7 platform provides several other components:


    - Batch Applications for the Java Platform Allows noninteractive, bulk-oriented,
    and long-running tasks to be easily defined and executed. It allows item-oriented
    processing style, aka Chunk, and task-oriented processing style, aka Batchlet.
    Chunk, the primary and recommended processing style, reads, processes, and aggregates
    for writing a “chunk” number of items at a time. Each chunk is written in a container-managed
    transaction and also provides checkpoints. Batchlet is a roll-your-own batch pattern.
    It is a task-oriented processing style where a task is invoked once, runs to completion,
    and returns an exit status.


    - Java Message Service (JMS) Provides a message-oriented middleware that allows
    sending and receiving messages between distributed systems. It provides a point-to-point
    messaging model, where a publisher sends a message to a specific destination,
    called a queue, targeted to a subscriber. Alternatively, JMS provides a publish-subscribe
    messaging model where multiple publishers can publish a message to a destination,
    called a topic, which can then be subscribed to multiple subscribers. In both
    cases, publisher and subscriber are loosely coupled from each other. They only
    need to know the destination and message format.


    - **Contexts and Dependency Injection (CDI)** Provides a type-safe dependency
    injection mechanism. A bean is "strongly typed" as it only defines the type and
    semantics of other beans it depends upon, without a string name and using the
    type information available in the Java type system. It provides "loose coupling"
    as the injection request need not be aware of the actual life cycle, concrete
    implementation, threading model, or other clients of the bean.


    - **Concurrency Utilities** Allows adding concurrency design principles for existing
    Java EE applications. It allows an application to create user threads that are
    managed by the controller. The usual classloading context, Java Naming and Directory
    Interface (JNDI) context, and security context are propagated to these threads.


    - **JavaServer Faces (JSF)** Provides the server-side user interface (UI) framework.
    It allows creation of web pages with a set of reusable UI components following
    the Model-View-Controller (MVC) design pattern. The components are bound to a
    server-side model that enables two-way migration of application data with the
    UI. JSF also defines page navigation, manages UI component state across server
    requests, and can be easily used to build and reuse custom components.


    - **Java Servlet Technology** Allows a web client to interact using a request/response
    pattern and generates dynamic content. The container is responsible for the life
    cycle of the servlet, receives requests and sends responses, and performs any
    other encoding/decoding required as part of that function.


    Refer to The Java EE 7 Tutorial (http://docs.oracle.com/javaee/7/tutorial/doc/home.htm)
    for more details on the complete set of Java EE 7 technologies.


    ## HTML5


    While most people believe HTML5 is relatively new, it has actually been in development
    since 2004. The World Wide Web Consortium (W3C) designed the original specification
    to address what it observed as common uses of HTML and XHTML across the Internet
    at the time. Other considerations the W3C addressed as it drafted the new specification
    were the trend toward incorporating multimedia into web pages and the need to
    consolidate various specifications that had become commonly used during the years
    that the HTML 4.01 specification had been in use. This consolidation included
    not only upgrading to the HTML 4 specification, but also combining the XHTML 1
    and DOM Level 2 HTML specifications into one.


    ## HTML5 Specification Reaches Feature Complete


    What has brought HTML5 to the forefront over the past year is that on December
    17, 2012, the W3C announced that the HTML5 specification was feature complete.
    By labeling the specification as a “Candidate Recommendation,” the W3C gave businesses
    and developers a stable specification that they could start with.


    One major issue that you need to take into consideration when working with HTML5
    as your client-side application framework is that, while it has reached a stable,
    feature-complete status, it has not been approved as a completed standard yet.
    The largest ramification of this is that there are still different implementations
    of what a draft specification was being used. Now that that specification is feature
    complete, the main browser user agent developers should be able to converge on
    implementations that come closer to meeting the specification. This will take
    time though, and you will need to make sure you test all of your HTML5 code on
    the browsers and user agents.


    In its release announcing the completed definition of the HTML5 specification
    (www.w3.org/2012/12/html5-cr.html), the W3C describes as follows what the next
    phase will involve:


    During this stage, the HTML Working Group will analyze current HTML5 implementations,
    establish priorities for test development, and work with the community to develop
    these tests. The HTML Group has planned for this implementation phase to last
    into mid-2014, after which W3C expects to publish the final HTML5 Recommendation,
    available Royalty-Free to implementers.


    ## Java EE and HTML5 Enterprise Application Development


    The implementation of the HTML5 specification so far has been done against a moving
    target, so to speak. Different vendors support the specification in different
    ways, or may not support certain parts of the specification at all. This poses
    a problem for application developers, who have to develop for a customer base
    that could be using a wide variety of device combinations. Frankly, several websites
    have been created to help developers navigate this tricky area. Two of the most
    popular sites are


    - HTML5 Test http://html5test.com/

    - Can I Use http://caniuse.com/


    The HTML5 Test website will allow you to see how well a specific version or brand
    of browser implements the whole of the HTML5 specification. This is very useful
    when you are trying to decide what kind of browser or device support matrix your
    application will provide.


    The Can I Use website goes into more detail and allows you to look at a specific
    HTML element or attribute and see which browser vendors have implemented it and
    in which versions of their browsers.


    ## Use of Mobile Devices


    Probably the second largest reason for HTML5''s recent rise in visibility is the
    increase in the availability of smartphones, tablets, and other types of mobile
    and embedded devices with Internet access (such as Internet-ready TVs, game consoles,
    and Blu-ray players, just to name a few). The reason that the rise in the availability
    of these devices has brought HTML5 to prominence is that all of them are being
