    }\n```"
- md: "\n# 114 Java EE and HTML5 Enterprise Application Development\n\n```\nself.sseData(\"\
    SSE Connection Closed<hr>\");\n}\n```\n\nServer-Sent Events is a new feature introduced\
    \ in HTML5. Some browsers do not support this feature at the time of writing.\n\
    \n> **TIP**\n> Currently, no versions of Microsoft Internet Explorer support Server-Sent\
    \ Events.\n\nBefore continuing with the initialization code, it's a good idea\
    \ to perform the following check to make sure the browser provides SSE support:\n\
    \n```\nif (typeof (EventSource) !== \"undefined\") {\n```\n\nIf the browser doesn't\
    \ understand the type of EventSource, then it doesn't support SSE, in which case\
    \ you can display an error message.\nLet's walk through the code in Listing 5-18\
    \ to see what each section does:\n\n- The first few line sets the defaults for\
    \ your Knockout observables. These observables are bound to the SSE section of\
    \ the HTML code.\n\n- Inside the if statement that is checking to make sure the\
    \ browser supports Server-Sent Events, you create a new EventSource object and\
    \ assign it to the self.source variable. The URL that is used to make the connection\
    \ is for the SSE stream that you wrote in Chapter 3 of the book:\n\n```\nnew EventSource(serviceRootURL\
    \ + \"/books/events\");\n```\n\n- Once you have the EventSource object, there\
    \ are three events you can listen for and then perform the appropriate actions:\n\
    \n- onopen: This event is triggered on the initial opening of the connection.\n\
    \n- onmessage: This is triggered each time the server sends a message to the browser.\
    \ This is the main event that you will want to work with.\n\n- onclose: This is\
    \ triggered when the connection is closed for any reason.\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_133_0.png)\n\
    \nIn Listing 5-18, you are setting the local variable message to a string stating\
    \ that the connection was opened. You are then assigning that value to the Knockout\
    \ observable sseData, which will be displayed inside the SSE HTML section that\
    \ is bound to the same observable. Because you are including HTML markup in the\
    \ message, the Knockout binding on the HTML page is actually the html: binding\
    \ instead of the plain text : binding:\n\n```\n<div id=\"sseMessage\" data-bind=\"\
    html: sseData, ...\"></</div>\n```\n\n- In the onmessage function, you want to\
    \ lay out the message that goes into this area by appending the most recent message\
    \ from the server to the end of the existing messages. You do this by setting\
    \ the local variable message to the actual value of the observable and then appending\
    \ the incoming event .data. After generating the new appended message, you set\
    \ the self.sseData observable to the new value.\n\n- If the connection is closed\
    \ for whatever reason, set a message stating that the connection is closed and\
    \ set the same self.sseData to show that message.\n\n- When the original observables\
    \ for self.displayMessage and self.displayError were initialized, they were set\
    \ to false so they would not show these areas while the page is loading. Now that\
    \ the connection has been established and a message is set, you can set the observable\
    \ to true, which will display the Message area while still leaving the Error section\
    \ hidden.\n\n- Finally, there is a small X icon in the View layer of the Event\
    \ section that has been bound to the closeSSE() function. When the icon is clicked,\
    \ the current SSE stream closes and an appropriate message is displayed.\n\n##\
    \ WebSocket\n\nUsing the WebSocket API in JavaScript and connecting the resulting\
    \ data to an HTML view layer was covered in Chapter 4. If you haven't read Chapter\
    \ 4 yet, the basic approach to setting up the connection to the service is the\
    \ same as what you just learned with Server-Sent Events. However, with the WebSocket\
    \ API, you can also send data back to the server. One of the biggest advantages\
    \ of using a WebSocket connection instead of REST or some other type of protocol\
    \ is the significant reduction in the amount of traffic that you send over the\
    \ wire when you use the WebSocket protocol. The connection between the client\
    \ and server is set up once and then maintained until the connection is closed\
    \ either via the API or via the client closing. With other protocols, you are\
    \ required to go through the connection setup each time you want to send or receive\
    \ data from the server.\n\nTo get a full description of the new WebSocket protocol,\
    \ please read Chapter 4.\n\n## Responsive Design\n\nThe concept of responsive\
    \ design addresses the need to design your web application such that it renders\
    \ its layout appropriately in response to the screen size of the device on which\
    \ it is being displayed. The application View layer needs to respond to this change\
    \ in view size by changing the layout, or of, the content that is rendered.\n\n\
    The CSS2 specification provided the capability to use different CSS rules dynamically\
    \ based on the media type. The most common of these types are (and continue to\
    \ be in CSS3) screen and print. The CSS3 specification expands this capability\
    \ with the introduction of media queries. A media query is made up of a media\
    \ type and zero or more expressions. These expressions check for specific conditions\
    \ of media features. A good example of this is an expression that checks for the\
    \ current size of the display screen:\n\n```\n@media only screen (min-width: 450px)\
    \ and (max-width: 1024px) {}\n```\n\nThrough the use of media queries and a pattern\
    \ of CSS classes defined as a grid layout, you can make your application respond\
    \ to changes in the display screen.\n\nThe grid layout pattern is something that\
    \ you can design yourself, but it's much easier to use an existing grid framework.\
    \ Thus far, you have been using the Bootstrap framework to show columns. Note\
    \ that Bootstrap uses a 12-column grid system. This means that a column can span\
    \ any number from 1 to 12. For example, a col-md-6 will take up half of the width,\
    \ while a col-md-4 will take up one-third and a col-md-3 will take up one-quarter\
    \ of the width.\n\nThe grid is also responsive, meaning that you can specify different\
    \ layouts for different screen sizes. For example, you can use col-sm-12 on small\
    \ screens, col-md-6 on medium screens, and col-lg-3 on large screens. This will\
    \ allow the layout to adapt itself as the screen size changes.\n\nThe grid layout\
