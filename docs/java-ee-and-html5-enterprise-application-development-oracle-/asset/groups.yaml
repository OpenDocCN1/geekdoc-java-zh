- md: "\n## Chapter 3: RESTful Resources 51\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_70_0.png)\n\
    \nFIGURE 3-3. New RESTful Java Client wizard\n\nHTML/JavaScript/CSS front end\
    \ for your RESTful web service via the RESTful JavaScript client wizard, as shown\
    \ in Figure 3-4.\n\nIn a standard HTTP request-response scenario, a JavaScript\
    \ client or a Java client using the JAX-RS Client API opens a connection to the\
    \ resource endpoint, sends an HTTP request to the server (for example, an HTTP\
    \ GET request), and then receives an HTTP response back; the server closes the\
    \ connection once the response is fully sent/received. The client always initiates\
    \ the request and “pulls” the information from the server as required. Sometimes\
    \ there may be a need for a server to asynchronously “push” information to the\
    \ client. For example, a stock ticker endpoint can push the updated stock price\
    \ to the client. In our example, information about a new book can be pushed to\
    \ the client.\n\n# Java EE and HTML5 Enterprise Application Development\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_71_0.png)\n\
    \nFIGURE 3-4. New REST JavaScript Client wizard\n\n### Server-Sent Events\n\n\
    Typically, a client initiates a request to the server and receives a response.\
    \ Server-Sent Events (SSE) is a mechanism that allows the server to asynchronously\
    \ push the data from the server to the client whenever a new “chunk” of data is\
    \ available. The client is still responsible for establishing the connection with\
    \ the server. When new data is ready to be sent on the server, the server sends\
    \ the data event to the client, hence the name, Server-Sent Events.\n\nA server-event\
    \ is generated on the server side with a predefined media type of text/event-stream.\
    \ There is no restriction for a media type used in individual event messages.\
    \ On the client side, the standard EventSource JavaScript API is used to open\
    \ an HTTP connection for receiving push notifications from the server. These events\
    \ are received in callback handlers registered in the client JavaScript and are\
    \ used to update the client.\n\nNote that SSE will be a final specification along\
    \ with the rest of HTML5. This is targeted to be final in late 2014. Until then,\
    \ SSE cannot be added as a standard API to JAX-RS. However, the JAX-RS reference\
    \ implementation, Jersey, has added support for SSE. This chapter will use Jersey\
    \ to implement that functionality in our application and explain SSE.\n\n## Chapter\
    \ 3: RESTful Resources 53\n\nLet's say you have a Book resource to represent the\
    \ books written by an author. This resource can be described following the design\
    \ pattern used for the Author. Now let's say you update the Book resource endpoint\
    \ such that it generates a server-side event whenever a new book is added.\n\n\
    First of all, you need to enable support for SSE for the JAX-RS application. As\
    \ this is not part of the standard JAX-RS API, you need to update the pom.xml\
    \ file to include the SSE media type module, as shown in Listing 3-3.\n\n# Listing\
    \ 3-3 Jersey SSE Media Dependency\n\n```xml\n<dependency>\n  <groupId>org.glassfish.jersey.media</groupId>\n\
    \  <artifactId>jersey-media-sse</artifactId>\n  <version>2.0</version>\n  <scope>provided</scope>\n\
    </dependency>\n```\n\nNext, you need to register org.glassfish.jersey.media.sse.SseFeature\
    \ in the Application class, as shown in Listing 3-4.\n\n# Listing 3-4 Adding SseFeature\
    \ to JAX-RS\n\n```java\npublic Set<Class<?>> getClasses() {\n  Set<Class<?>> resources\
    \ = new java.util.HashSet<>();\n\n  // ..\n  resources.add(SseFeature.class);\n\
