    图 2-3. 设置创建实体类的选项\n\n-   **Column Names in Relationships**：如果选中，当表引用外键时，字段名将根据表的列名生成。例如，如果\
    \ `customer` 表有一个名为 `zip` 的列映射到 `micromarket` 表中名为 `zip_code` 的列，则生成的字段名将是 `zip`。此选项默认勾选。\n\
    \n当你点击 **Finish** 时，IDE 会为向导中指定的每个表创建实体类，如图 2-4 所示。\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_43_0.png)\n\
    图 2-4. 创建实体类的结果\n\n## Packaging an Entity\n\n实体被管理在*持久化上下*（见下节“Packaging an Entity”），持久化上下文是一个受管理的实体实例集合，其中任何持久化实体都有唯一标识。持久化上下文拥有多个管理实体生命周期的*管理器*。实体管理器、配置信息以及映射实体的可选元数据一起被封装为持久化单元。持久化单元由\
