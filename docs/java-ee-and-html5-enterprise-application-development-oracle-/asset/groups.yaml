    -   **Generate JAXB Annotations**：如果选中，IDE 会在实体类中生成注解，将类映射到 XML 元素，然后该元素可以被 Java\
    \ XML 绑定 (JAXB) Web 服务使用。\n\n为了持久化实体类类，你的项目需要一个持久化单元（如下节“Packaging an Entity”所述）。当你创建实体类时，NetBeans\
    \ IDE 会检查项目是否存在持久化单元。如果 IDE 无法找到持久化单元，则会出现 **Create Persistence Unit** 复选框，如图\
