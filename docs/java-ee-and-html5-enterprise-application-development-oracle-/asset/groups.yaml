    js method. You are assigning the variable self.Books to a Knockout observableArray
    and initializing it with an empty array. The use of Knockout observables and observableArrays
    is the key to setting up two-way binding between the data at the Model layer of
    your MVVM architecture and the View layer. You’ll see a bit later in this chapter
    how this observableArray is used.'
