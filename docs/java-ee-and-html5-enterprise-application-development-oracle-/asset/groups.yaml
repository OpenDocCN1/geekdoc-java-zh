    You play X\");\n        } else {\n            games.put(session.getId(), \"y\"\
    );\n            session.getBasicRemote().sendText(\"You play O\");\n        }\n\
    \    }\n\n    @OnMessage\n    public void onMessage(Board board, Session session)\
    \ throws IOException, EncodeException {\n        if (board.getStatus() != null\
    \ && board.getStatus().equals(\"clear\")) {\n            for (Session s : session.getOpenSessions())\
    \ {\n              games.remove(s.getId());\n              s.close();\n      \
    \      }\n            return;\n        }\n\n        String symbol = null;\n  \
    \      for (String game : games.keySet()) {\n            if (game.equals(session.getId()))\
