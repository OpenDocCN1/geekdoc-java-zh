    # 58 Java EE and HTML5 Enterprise Application Development


    TTP was designed to share information over the Internet, and it has served very
    well in that respect. But it is inherently half-duplex; that is, the client (in
    most cases the browser) initiates a request to an HTTP server, and the server
    processes the request and responds to the client. Web applications that require
    the server to push information to the client have typically achieved that functionality
    by abusing the protocol, such as via polling and long polling.


    In polling, a client requests a resource from a server using normal HTTP at regular
    intervals, say after three seconds, the server returns any new information in
    the response. The connection is closed after the client has received the information.
    It is likely that new information is not available for each request. This also
    requires tuning the interval at which the information is requested, and is generally
    application-specific. Therefore, this is not a very efficient way to push information
    from server to client.


    In polling, a client requests a resource from a server using normal HTTP. The
    server does not immediately respond with the requested information but rather
    waits and responds when new information is available. The client receives the
    new information, closes the connection, and immediately sends another request
    to the server. This type of polling keeps an open connection between the client
    and the server indefinitely, with possibly no data exchanged during the majority
    of the time. It also requires opening a new connection after a response is received.
    This is also not efficient utilization of resources.


    The Server-Sent Events (SSE) specification included in HTML5 provides a similar
    mechanism to the long polling mechanism, except it does not send only one message
    per connection. The client sends a request and the server holds open a connection
    until a new message is ready. It sends a message back to the client when new information
    is available while still keeping the connection open. This allows the connection
    to be reused for subsequent messages, or events.


    For a regular HTTP request and response, each HTTP request establishing a new
    TCP connection to the server, and that connection is terminated after the HTTP
    response has been received. Setting up a TCP connection is an expensive operation
    but is rather invisible if the number of HTTP requests is low. If the number of
    requests increases, then creation'
