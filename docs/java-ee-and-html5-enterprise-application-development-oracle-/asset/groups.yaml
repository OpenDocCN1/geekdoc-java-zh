    从 **Entity Classes** 页面，你可以点击 **Finish** 为指定的每个表创建实体类，也可以点击 **Next** 修改生成映射注解时使用的默认设置，如图\
    \ 2-3 所示。如果你选择后一种选项，可以设置以下选项来配置生成的注解元素：\n\n-   **Association Fetch**：选择要添加到关系注解中的\
    \ fetch 元素。你可以选择 default、eager 或 lazy。如果选择了 default（默认选中 default），则不会向关系注解中添加任何元素。\n\
    -   **Collection Type**：为 OneToMany 和 ManyToMany 容器管理关系 (CMR) 字段选择集合类型。你可以选择 `java.util.Collection`、`java.util.List`\
