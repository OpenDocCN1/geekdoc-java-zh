    \ \n  xsi:schemaLocation=\"http://xmlns.jcp.org/ns/persistence/persistence_2_1.xsd\"\
    >\n  \n  <persistence-unit name=\"authorPU\" transaction-type=\"JTA\">\n    <properties>\n\
