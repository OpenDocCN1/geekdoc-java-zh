    \ persistence.xml\n\npersistence.xml 文件可以拥有多个 `<persistence-unit>` 元素，每个元素对应一个管理器。每个管理器可以使用标准的\
    \ `javax.persistence.<properties>` 元素进行配置。\n\nNetBeans IDE 为编辑 persistence.xml\
