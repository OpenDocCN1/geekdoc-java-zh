    \ you will need to get information from your security team about what kinds of\
    \ checks your application will need to implement to make sure it behaves properly\
    \ within your specific environment.\n\n## Client-Side Security Common Sense\n\n\
    A commonsense approach to client-side security will help you avoid many pitfalls.\
    \ With that in mind, here are some commonsense practices you should consider following:\n\
    \n- Try to always run your application using the HTTPS protocol.\n- If your application\
    \ is running in a secure domain (HTTPS), don't connect your application to unsecured\
    \ services. Make sure that your REST calls are also going to HTTPS domains and\
    \ that your WebSocket calls are using wss instead of ws (see \"WebSocket Security\"\
    \ later in the chapter).\n- If at all possible, don't allow <script> elements\
    \ in your HTML files. Place your JavaScript in external files and reference them.\n\
    - If you are using a JavaScript framework, check to see what kind of help it provides\
    \ with common security issues, and use those features.\n- Finally, take the time\
    \ to research which security measures your specific application security requires.\
    \ You'll find that there is a lot of application security information available,\
    \ and it's growing rapidly.\n\n## Server-Side Security\n\nThis section explains\
    \ the key concepts of server-side security: authentication, confidentiality, and\
    \ data integrity.\n\n- Authentication validates the identity of a client. It determines\
    \ whether the client is, in fact, really what it is claiming to be. It usually\
    \ involves receiving a request from a client that includes a user ID and credentials.\
    \ The servlet container in a Java EE application server provides mechanisms to\
    \ leverage standard web protocols and validate the credentials.\n- Authorization\
    \ ensures that the authenticated client has appropriate rights to access the requested\
    \ resource. This allows the server to check if the user can invoke certain operations\
    \ on your service. The servlet container typically defines the operations that\
    \ can be performed.\n- Confidentiality ensures that only the authorized recipients\
    \ can access the information. This concept is similar to authorization, the key\
    \ difference being authorization prevents the information from reaching unintended\
    \ parties, confidentiality ensures that even if the information does reach unintended\
    \ parties, confidentiality ensures it cannot be viewed or used.\n- Data integrity\
    \ ensures that the information has not changed while in transit between the client\
    \ and server. A hashcode, or signature of the data, is sent along with the data\
    \ and confirmed on the receiving side.\n\nLet's take a look at how these concepts\
    \ can be realized in a Java EE container. After that, we'll turn our attention\
    \ to REST resource security and WebSocket security.\n\n## Authentication\n\nThere\
    \ are different ways to achieve authentication; the first two types listed next\
    \ are from the RFC 2617 draft standard:\n\n- Basic Authentication This is the\
    \ simplest method of authentication over HTTP. The client, most often a web browser,\
    \ opens a login box prompting the user to enter a username and password. The client\
    \ then sends a base64-encoded username and password to the service. The server\
    \ then checks if the user account exists and verifies the sent password. If the\
    \ username and password match those of the account, then the response is made\
    \ available; otherwise, an HTTP 401 response code is returned to the client, informing\
    \ the client that it is not authorized to access the resource.\n\nUnder the covers,\
    \ the client generates an HTTP Authorization header set to a base64-encoded string\
    \ of the username, a colon character, and the password. The authorization method\
    \ and a space (that is, \"Basic \") is added before this encoded string. If your\
    \ username is \"u1\" and your password is \"p1\", then the header will look like\
    \ this:\n\n```\nAuthorization: Basic DTE6cDE=\n```\n\nUsing Basic Authentication\
    \ with HTTPS is highly recommended because otherwise the username and password\
    \ can be easily decoded.\n\n- Digest Authentication One of the limitations of\
    \ Basic Authentication is that the password is sent in clear text and is susceptible\
    \ to man-in-the-middle attacks. Digest Authentication, which is Basic Authentication\
    \ over an encrypted HTTP connection, solves this problem.\n\nDigest Authentication\
    \ communicates credentials in an encrypted form by applying a hash function to\
    \ the username, the password, a server-supplied nonce value, the HTTP method,\
    \ and the requested URI.\n\nFor your username and password, the Authorization\
    \ header looks like this:\n\n```\nAuthorization: Digest username=\"u1\"\nrealm=\"\
    file\"\nnonce=\"06mhdNdONXUNFTMNJgxMxQ1MTEzFItUvu5MR75Khm/wtvp1E=\"\nuri=/webresources/authors/\n\
    algorithm=MD5\nresponse=\"21c29c7a7c760e5c39ba46637ad4313aa\nopaque=\"00000000000000000000000000000000\"\
    \n```\n\nMany of the security options in Digest Authentication are optional so\
    \ the server may operate in a security-reduced mode. Even though it is slightly\
    \ better than Basic Authentication, it is not intended to replace stronger authentication\
    \ protocols, like client-cert. Like Basic Authentication, Digest Authentication\
    \ is also susceptible to man-in-the-middle attacks. These types of attacks can\
    \ be avoided by using HTTPS instead of HTTP.\n\n- Form-based Authentication Form-based\
    \ authentication allows customization of the login screen and error pages that\
    \ are presented to the client. The login form must contain fields for username\
    \ and password, and a submit button. These is coded as follows:\n\n```\n<form\
    \ action=\"security_check\" method=\"POST\">\n  Username: <input type=\"text\"\
    \ name=\"username\">\n  Password: <input type=\"password\" name=\"password\">\n\
    \  <input type=\"submit\" value=\"Submit\">\n</form>\n```\n\nThe login form must\
    \ be named security_check. If the authentication succeeds, the client is redirected\
    \ to the requested resource. If the authentication fails, the error page is returned.\n\
    \n- Client-Cert Authentication HTTPS not only provides a secure connection but\
    \ also can be used for authentication. This mechanism requires the client to possess\
    \ a public key certificate (PKC) issued by a trusted organization, called a certificate\
    \ authority. The server authenticates the client using this PKC. The only disadvantage\
    \ of this approach is the managing of the certificates on both the client and\
    \ server. Otherwise, this method is more secure than Basic Authentication and\
    \ form-based authentication.\n\n## Java EE and HTML5 Application Development\n\
    \n### Descriptors\n\n```xml\n<web-app xmlns=\"http://xmlns.jcp.org/xml/ns/javaee\"\
    \n             xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n     \
    \        xsi:schemaLocation=\"http://xmlns.jcp.org/xml/ns/javaee/web-app_3_1.xsd\"\
    \n             version=\"3.1\">\n\n<security-constraint>\n  <web-resource-collection>\n\
    \    <web-resource-name>Authors</web-resource-name>\n    <url-pattern>/webresources/</url-pattern>\n\
    \    <http-method>GET</http-method>\n  </web-resource-collection>\n  <auth-constraint>\n\
    \    <role-name>admin</role-name>\n  </auth-constraint>\n</security-constraint>\n\
    \n<login-config>\n  <auth-method>BASIC</auth-method>\n  <realm-name>file</realm-name>\n\
    </login-config>\n\n<security-role>\n  <role-name>admin</role-name>\n</security-role>\n\
    \n</web-app>\n```\n\nAs you can see in Listing 6-6, the deployment descriptor\
    \ has three main elements:\n\n- <security-constraint> element is used to associate\
    \ security constraints with one or more web resource collections. It has the following\
    \ subelements:\n  - <web-resource-collection> Identifies a subset of the resources\
    \ and HTTP methods on those resources within a web application to which a security\
    \ constraint applies. For example, in Listing 6-6, the security constraints are\
    \ defined for the HTTP GET method on the resource accessible at /webresources/.\
    \ Wildcards can be used to specify URL patterns, such as:\n    /webresources/*\n\
    \    /webresources/authors/*\n    /*.html\n  - Once the user is authenticated,\
    \ <web-resource-collection> defines which methods the user is authorized to access.\n\
    \  - <auth-constraint> Indicates the user roles that should be permitted access\
    \ to this resource. The <role-name> used\n"
  mdcn: "\n\n# 第 6 章：HTML5 与 Java 应用安全 135\n\n应用程序服务器的方法。这也是授权（authorization）概念出现的地方。一旦应用程序服务器（或应用程序服务器使用的身份管理系统）验证了终端用户，就可以用它来判断终端用户是否有权访问您的应用程序。在这种环境中，您需要从安全团队获取信息，了解您的应用程序需要实现哪些类型的检查，以确保它在您的特定环境中正常运行。\n\
    \n## 客户端安全常识\n\n处理客户端安全的常识方法将帮助您避开许多陷阱。基于此，这里是一些您应该考虑遵循的常识做法：\n\n- 尝试始终使用 HTTPS\
    \ 协议运行您的应用程序。\n- 如果您的应用程序运行在安全域（HTTPS）中，请勿将应用程序连接到不安全的服务。确保您的 REST 调用也指向 HTTPS\
    \ 域，并且您的 WebSocket 调用使用的是 wss 而不是 ws（参见本章稍后部分的“WebSocket 安全”）。\n- 如果可能，请不要在你的\
    \ HTML 文件中允许 `<script>` 元素。将您的 JavaScript 放置在外部文件中并引用它们。\n- 如果您正在使用 JavaScript\
    \ 框架，请检查它针对常见的安全问题提供了什么帮助，并使用这些功能。\n- 最后，花时间研究您的特定应用程序安全需要哪些安全措施。您会发现有很多应用程序安全信息，而且这些信息正在快速增长。\n\
    \n## 服务端安全\n\n本节解释了服务器端的关键概念：认证（authentication）、机密性（confidentiality）和数据完整性（data\
    \ integrity）。\n\n- 认证（Authentication）验证客户端的身份。它确定客户端是否真的是它所声称的。它通常涉及接收来自客户端包含用户\
    \ ID 和凭据的请求。Java EE 应用程序服务器中的 Servlet 容器提供了利用标准 Web 协议验证凭据的机制。\n- 授权（Authorization）确保经过认证的客户端拥有访问请求资源的适当权限。这允许服务器检查用户是否可以在您的服务上调用某些操作。Servlet\
    \ 容器通常定义了可以执行的操作类型。\n- 机密性（Confidentiality）确保只有经过授权的接收者才能访问信息。这个概念与授权相似，关键区别在于：授权防止信息到达非意图对方，而机密性确保即使信息确实到达了非意图对方，也能确保其无法被查看或使用。\n\
    - 数据完整性（Data integrity）确保信息在客户端和服务器之间的传输过程中没有发生更改。数据的哈希值（hashcode）或签名随数据一起发送，并在接收端进行确认。\n\
    \n让我们来看看这些概念如何在 Java EE 容器中实现。之后，我们将注意力转到 REST 资源安全和 WebSocket 安全。\n\n## 认证\n\n\
    实现认证有多种方法；下面列出的前两种类型来自 RFC 2617 草案标准：\n\n- 基础认证（Basic Authentication）这是 HTTP 上最简单的认证方法。客户端（通常是\
    \ Web 浏览器）会打开一个登录框，提示用户输入用户名和密码。然后，客户端将 base64 编码的用户名和密码发送给服务。服务器随后检查用户账户是否存在，并验证发送的密码。如果用户名和密码与账户匹配，则提供响应；否则，将向客户端返回\
    \ HTTP 401 响应码，告知客户端其无权访问该资源。\n\n在底层，客户端生成一个 HTTP `Authorization` 请求头，其设置为用户名、冒号和密码的\
    \ base64 编码字符串。在这些编码字符串之前会添加授权方法和一个空格（即 \"Basic \"）。如果您的用户名是 \"u1\"，密码是 \"p1\"\
    ，那么请求头看起来如下：\n\n```\nAuthorization: Basic DTE6cDE=\n```\n\n强烈建议在 HTTPS 配合使用基础认证，否则用户名和密码可以被很容易地解码。\n\
    \n- 摘要认证（Digest Authentication）基础认证的一个局限性是密码是以明文发送的，并且容易受到中间人攻击。摘要认证（即在加密的 HTTP\
    \ 连接上进行基础认证）解决了这个问题。\n\n摘要认证通过对用户名、密码、服务器提供的随机数（nonce value）、HTTP 方法和请求的 URI 应用哈希函数，以加密的形式通信凭据。\n\
    \n对于您的用户名和密码，`Authorization` 请求头看起来如下：\n\n```\nAuthorization: Digest username=\"\
    u1\"\nrealm=\"file\"\nnonce=\"06mhdNdONXUNFTMNJgxMxQ1MTEzFItUvu5MR75Khm/wtvp1E=\"\
    \nuri=/webresources/authors/\nalgorithm=MD5\nresponse=\"21c29c7a7c760e5c39ba46637ad4313aa\n\
    opaque=\"00000000000000000000000000000000\"\n```\n\n摘要认证中的许多安全选项是可选的，因此服务器可能会在安全降低模式下运行。尽管它比基础认证好一点，但它并不打算替代更强的认证协议（如客户端证书\
    \ `client-cert`）。与基础认证一样，摘要认证也容易受到中间人攻击。这类攻击可以通过使用 HTTPS 代替 HTTP 来避免。\n\n- 表单认证（Form-based\
    \ Authentication）表单认证允许对呈现客户端的登录屏幕和错误页面进行自定义。登录表单必须包含用户名、密码字段以及一个提交按钮。这些内容的编码如下：\n\
    \n```\n<form action=\"security_check\" method=\"POST\">\n  Username: <input type=\"\
    text\" name=\"username\">\n  Password: <input type=\"password\" name=\"password\"\
    >\n  <input type=\"submit\" value=\"Submit\">\n</form>\n```\n\n登录表单必须命名为 `security_check`。如果认证成功，将重定向到请求资源。如果失败，则返回错误页面。\n\
