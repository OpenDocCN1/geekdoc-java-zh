- md: "\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_45_0.png)\n\nFIGURE 2-6. Design\
    \ view for persistence.xml file\n\n## Managing an Entity\n\nEach entity goes through\
    \ create, read, update, and delete (CRUD) operations during its life cycle. Typically,\
    \ an entity is created once, read and updated multiple times, and then deleted\
    \ once.\n\nAn Enterprise JavaBean (EJB; also known as enterprise beans) is typically\
    \ used to manage the entity. An EJB instance is itself managed at runtime by an\
    \ EJB container. The container provides all the plumbing, such as transactions,\
    \ remoting, concurrency, connection pooling, and other such details, so that the\
    \ application developer can focus on the business logic.\n\nThere are two types\
    \ of EJBs: session beans and message-driven beans. A session bean processes the\
    \ message synchronously, and a message-driven bean is used to process messages\
    \ asynchronously. There are three types of session beans: stateful, stateless,\
    \ and singleton. A stateful session bean maintains a conversational state for\
    \ a specific client, a stateless session bean does not contain any conversational\
    \ state for a specific client, and a singleton session bean is instantiated once\
    \ per application.\n\nA stateless session bean, by its very nature of being stateless,\
    \ can be pooled by the container and provides much better scalability for the\
    \ application. By default, all methods of a session bean have container-managed\
    \ transactions. This means the EJB container implements all the low-level transaction\
    \ protocols, such as the two-phase commit protocol between a transaction manager\
    \ and a database system, to honor the transactional semantics. The changes to\
    \ the underlying resources are all committed or rolled back accordingly.\n\nA\
    \ container-managed entity manager can be obtained in a stateless session bean\
    \ using dependency injection. The entity manager is then used to perform operations\
    \ on an entity.\n\nListing 2-3 shows how a stateless session bean can be used\
    \ to create or delete an entity instance.\n\n## Listing 2-3 CRUDing Author Entity\n\
    \n```\n@Stateless\npublic class AuthorSessionBean {\n    @PersistenceContext\n\
    \    EntityManager em;\n    public void addAuthor(Author e) {\n        em.persist(e);\n\
    \    }\n    public void deleteAuthor(Author e) {\n        em.remove(e);\n    }\n\
    }\n```\n\nA stateless session bean is defined by adding @javax.ejb.Stateless annotation\
    \ on the POJO. To create a new row in the database table, a new entity instance\
    \ is created using a no-args constructor or a convenience constructor. Calling\
    \ setters or assigning instance variables populates the entity values. This is\
    \ typically done in a client component such as a servlet or any other Java EE\
    \ component.\n\nA container-managed javax.persistence.EntityManager is obtained\
    \ and used within the addAuthor() method to save the entity. Similarly, an entity\
    \ instance can be removed by calling the EntityManager.remove(). The EJB container\
    \ starts a transaction before the method is invoked and commits the transaction\
    \ after the method completes. All changes made to the entity manager are stored\
    \ in the database with a transaction commit.\n\nNetBeans IDE provides a wizard\
    \ that enables you to generate EJBs. In the IDE, right-click your application\
    \ and choose New | Other | Enterprise JavaBeans | Session Bean to open the New\
    \ Session Bean wizard, shown in Figure 2-7.\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_47_0.png)\n\
    \nFor Session Type, you can select one of the following:\n\n- **Stateless** The\
    \ bean does not save state information during its conversation with the user.\
    \ These enterprise beans are useful for simple interactions between the client\
    \ and the application service, interactions that are complete in a single method\
    \ invocation. An example is an enterprise bean that processes orders. Each order\
    \ can be processed by an invocation of one method, such as processOrder(). All\
    \ the information needed for processing is contained in the method parameters.\n\
    \n- **Stateful** The bean saves state information during its conversation with\
    \ the user. These enterprise beans are useful for business processes that require\
    \ an interaction between a client and application service that lasts longer than\
    \ a single method invocation and requires memory of the state of the interaction.\
    \ An example is an online shopping cart. The end user, through the client program,\
    \ can order a number of items. The stateful session bean managing the interaction\
    \ must accumulate items until the end user is ready to review the accumulated\
    \ order, approve or reject items, and initiate processing of the lot. The stateful\
    \ session bean has to store the unprocessed items and enable the end user to add\
    \ more.\n\n- A singleton session bean is instantiated only once per application\
    \ and exists for the life cycle of the application. You can create a singleton\
    \ bean that the container instantiates when the application starts up using the\
    \ @startup annotation. An example is a bean that is used to initialize data for\
    \ an application that can be concurrently accessed by many clients.\n\nAn alternative\
    \ to using EJB container providing container-managed transactions is to use the\
    \ newly introduced @javax.transaction.Transactional annotation on a POJO or its\
    \ method. This allows declarative definition of transaction boundaries on beans\
    \ managed by Contexts and Dependency Injection (CDI), as well as classes defined\
    \ by managed beans or other Java EE components.\n\nListing 2-4 shows how @javax.transaction.Transactional\
    \ annotation can be specified on a method to create or delete an entity instance.\
    \ Just like in EJB, a container-managed transaction is automatically started by\
    \ the CDI runtime and committed or rolled back, as appropriate.\n\n## Listing\
    \ 2-4 Author with @Transactional\n\n```\npublic class AuthorSessionBean {\n  \
    \  @PersistenceContext\n    EntityManager em;\n\n    @Transactional\n    public\
    \ void addAuthor(Author e) {\n        em.persist(e);\n    }\n\n    @Transactional\n\
    \    public void deleteAuthor(Author e) {\n        em.remove(e);\n    }\n}\n```\n\
    \n## Java Persistence Query Language\n\nJava Persistence Query Language JPQL is\
    \ a string-based query language used to define queries over entities and their\
    \ persistent state. JPQL allows the application developer to specify the semantics\
    \ of queries in a portable way. The underlying persistence provider converts the\
    \ query to a target language, such as SQL, of a database or a persistent store.\n\
    \nA query may be a SELECT statement (R from Read of CRUD), UPDATE statement (U\
    \ from Update of CRUD), or DELETE statement (D from Delete of CRUD). An optional\
    \ WHERE clause can be used to restrict the results, and a GROUP BY clause, HAVING\
    \ clause, or ORDER BY clause can be used to aggregate the results. The query may\
    \ be constructed dynamically or be statically defined in a metadata annotation.\n\
    \nAs shown in the following example, javax.persistence.NamedQuery annotation can\
    \ be used on an entity to specify multiple JPQL queries. Each query is specified\
    \ using @javax.persistence.NamedQuery annotation. Each query requires a name attribute\
    \ to uniquely identify the query within the persistence unit. The query string\
    \ is defined using the query attribute.\n\n```\n@NamedQuery(name = \"Author.findAll\"\
    , query = \"SELECT a FROM Author a\")\n@NamedQuery(name = \"Author.findById\"\
    , query = \"SELECT a FROM Author WHERE a.id = :id\")\n```\n\nIn the preceding\
    \ example, both the queries are statically defined. The first query has the name\
    \ Author.findAll and is equivalent to selecting all rows from the table. Note\
    \ that the query string is defined around the entity, and not the corresponding\
    \ database table. This is what provides portability of JPQL over multiple databases.\
    \ The second query has the name Author.findById, which uses a WHERE clause to\
    \ restrict the result, and requires a parameter id to be specified.\n\nNetBeans\
    \ IDE provides a JPQL Query dialog so that you can verify queries without deploying\
    \ the application. Before you use it, make sure to compile the JPA entities in\
    \ your application, these compiled classes are used by the JPQL Query dialog.\
    \ Then, as shown in Figure 2-8, right-click\n"
  mdcn: "\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_45_0.png)\n\n图 2-6 persistence.xml\
    \ 文件的设计视图\n\n## 管理实体\n\n每个实体在其生命周期内都会经历创建、读取、更新和删除（CRUD）操作。通常，一个实体会被创建一次，被读取和更新多次，然后被删除一次。\n\
    \nEnterprise JavaBean（EJB；也称为企业豆）通常用于管理实体。EJB 实例本身在运行时由 EJB 容器管理。容器提供了所有底层工作，如事务、远程调用、并发、连接池以及其他细节，使得应用程序开发者可以专注于业务逻辑。\n\
    \nEJB 有两种类型：会话豆（session beans）和消息驱动豆（message-driven beans）。会话豆同步处理消息，而消息驱动豆用于异步处理消息。会话豆有三种类型：有状态（stateful）、无状态（stateless）和单例（singleton）。有状态会话豆为特定客户端维护会话状态，无状态会话豆不包含特定客户端的任何会话状态，而单例会话豆每个应用程序只实例化一次。\n\
    \n无状态会话豆由于其无状态的本质，可以被容器池化，并为应用程序提供更好的扩展性。默认情况下，会话豆的所有方法都具有容器管理的事务。这意味着 EJB 容器实现了所有低层事务协议，例如事务管理器与数据库系统之间的两阶段提交协议，以遵循事务语义。底层资源的更改将根据情况相应提交或回滚。\n\
    \n在无状态会话豆中，可以通过依赖注入获取容器管理的实体管理器（entity manager）。然后使用该实体管理器对实体执行操作。\n\n列表 2-3 显示了如何使用无状态会话豆来创建或删除实体实例。\n\
    \n## 列表 2-3 对 Author 实体体的 CRUD 操作\n\n```\n@Stateless\npublic class AuthorSessionBean\
    \ {\n    @PersistenceContext\n    EntityManager em;\n    public void addAuthor(Author\
    \ e) {\n        em.persist(e);\n    }\n    public void deleteAuthor(Author e)\
    \ {\n        em.remove(e);\n    }\n}\n```\n\n通过在 POJO 上添加 @javax.ejb.Stateless\
    \ 注解来定义无状态会话豆。要在数据库表中创建新行，可以使用无参构造函数或便利构造函数创建新的实体实例。调用 setter 或为实例变量将填充实体值。这通常在客户端组件（如\
    \ servlet 或其他 Java EE 组件）中完成。\n\n在 `addAuthor()` 方法中获取并使用容器管理的 javax.persistence.EntityManager\
    \ 来保存实体。同样，可以通过调用 `EntityManager.remove()` 移除实体实例。EJB 容器在方法调用之前启动事务，并在方法完成后提交事务。对实体管理器的所有更改都会随着事务提交存储在数据库中。\n\
    \nNetBeans IDE 提供了一个允许你生成 EJB 的向导。在 IDE 中，右键点击你的应用程序，并选择 New | Other | Enterprise\
    \ JavaBeans | Session Bean 来打开 New Session Bean 向导，如图 2-7 所示。\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_47_0.png)\n\
    \n对于会话类型（Session Type），你可以选择以下内容之一：\n\n-   **Stateless**（无状态）：该豆在与用户交互期间不保存任何状态信息。这些企业豆法适用于客户端与应用程序服务之间的简单交互，这些交互在单个方法调用中完成。例如，一个处理订单的企业豆。每个订单都可以通过调用一个方法（如\
    \ `processOrder()`）来处理。处理所需的所有信息都包含在方法参数中。\n\n-   **Stateful**（有状态）：该豆在与用户交互期间会保存状态信息。这些企业豆适用于客户端与应用程序服务之间的业务流程，这种交互持续时间超过单个方法调用，并且需要记住交互状态。例如，在线购物车。最终用户通过客户端程序订购多个项目。管理交互的有状态会话豆必须累积项目，直到最终用户准备好查看累积订单、批准或拒绝项目并启动批量处理。有状态会话豆必须存储未处理的项目并允许最终用户添加更多。\n\
    \n-   单例会话豆每个应用程序只实例化一次，并在应用程序生命周期内存在。你可以使用 @startup 注解创建一个容器在应用程序启动时实例化的单例豆。例如，用于初始化应用程序并发访问数据的豆。\n\
    \n使用 EJB 容器提供容器管理事务的替代方案是在 POJO 或其方法上使用新引入的 @javax.transaction.Transactional 注解。这允许对由上下文和依赖注入（CDI）管理的豆，以及由托管豆或其他\
    \ Java EE 组件定义的类进行声明式的事务边界定义。\n\n列表 2-4 显示了如何在方法上指定 @javax.transaction.Transactional\
    \ 注解以创建或删除实体实例。就像在 EJB 中一样，容器管理的事务由 CDI 运行时自动启动，并根据情况提交或回滚。\n\n## 列表 2-4 带有 @Transactional\
    \ 的 Author\n\n```\npublic class AuthorSessionBean {\n    @PersistenceContext\n\
    \    EntityManager em;\n\n    @Transactional\n    public void addAuthor(Author\
    \ e) {\n        em.persist(e);\n    }\n\n    @Transactional\n    public void deleteAuthor(Author\
    \ e) {\n        em.remove(e);\n    }\n}\n```\n\n## Java 持久查询语言\n\nJava Persistence\
    \ Query Language（JPQL）是一种基于字符串的查询语言，用于定义对实体及其持久状态的查询。JPQL 允许应用程序开发者以可移植的方式指定查询语义。底层持久化提供程序会将查询转换为目标语言（例如数据库的\
    \ SQL）。\n\n查询可以是 SELECT 语句（CRUD 中的读取）、UPDATE 语句（CRUD 中的更新）或 DELETE 语句（CRUD 中的删除）。可选的\
    \ WHERE 子句可用于限制结果，GROUP BY 子句、HAVING 子句或 ORDER BY 子句可用于聚合结果。查询可以动态构建，也可以在元数据注解中静态定义。\n\
    \n如下例所示，javax.persistence.NamedQuery 注解可以用于实体以指定多个 JPQL 查询。每个查询使用 @javax.persistence.NamedQuery\
    \ 注解指定。每个查询都需要一个 `name` 属性在持久化单元内唯一标识该查询。查询字符串使用 `query` 属性定义。\n\n```\n@NamedQuery(name\
    \ = \"Author.findAll\", query = \"SELECT a FROM Author a\")\n@NamedQuery(name\
    \ = \"Author.findById\", query = \"SELECT a FROM Author WHERE a.id = :id\")\n\
    ```\n\n在前面的示例中，两个查询都是静态定义的。第一个查询名为 Author.findAll，等于从表中选择所有行。注意查询字符串是围绕实体定义的，而不是对应的数据库表。这提供了\
    \ JPQL 在多个数据库之间的可移植性。第二个查询名为 Author.findById，它使用 WHERE 子句限制结果，并要求指定参数 id。\n\n\
    NetBeans IDE 提供了一个 JPQL 查询对话框，以便你可以在不部署应用程序的情况下验证查询。在使用之前，请确保编译应用程序中的 JPA 实体，这些编译后的类会被\
    \ JPQL 查询对话框使用。然后，如图 2-8 所示，右键点击\n\n"
