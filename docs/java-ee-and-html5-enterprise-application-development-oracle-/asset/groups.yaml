    \ 库被开发出来，以引入一种类似的架构，称为“模型-视图-视图模型”（MVVM）。\n\nMVVM 最初由微软在 2005 年开发，是其 Windows 呈现框架（WPF）的一部分。Steve\
    \ Sanderson 在 2010 年作为一个开源项目引入了该架构模式的 JavaScript 实现。它以 Knockout.js（http://knockout.com/）的名字发布，并迅速在已经熟悉\
    \ MVC 开发实践的 JavaScript 开发者中流行起来。虽然深入理解 MVVM（更具体地说是 Knockout.js）超出了本书的范围，但当你在第\
    \ 5 章创建一个 HTML5 应用时，你将使用 Knockout.js，该应用将消耗并与 REST、WebSockets 和服务器发送事件（SSE）等网络服务交互。\n\
    \n## 总结\n\n你已经学习了 Java EE 7 规范在网络服务方面的更新内容，这些服务用于开发 HTML5 应用所需的特定服务。你还了解了 HTML5\
    \ 规范中的一些新功能，以及开发客户端 HTML5 应用所需的特定技术。这种对开发工具当前状态的介绍将帮助你在完成本书剩余内容时，结合编码概念和示例进行工作。\n\
    \n正如你所看到的，Java EE Web 开发和 HTML Web 开发在过去几年中都已趋于成熟，朝着“软件即服务”（SaaS）的共同趋势发展。遵循这一趋势，NetBeans\
    \ IDE 等工具已经演进，提供了比以往任何时候都更容易结合这两种技术的功能。\n\n在下一章中，你将深入研究 Java EE 7 持久 API（Persistence\
    \ API），学习如何为你的 HTML5 应用创建和维护数据库。\n\n## 第2章\n## 持久化\n\n## 16 Java EE 和 HTML5 企业应用程序开发\n\
    \n数据是任何应用程序不可或缺的一部分，通常定义了应用程序在任何特定时间的状态。持久化是应用程序状态的一种特征，其寿命比创建它的进程更长。如果没有持久化，应用程序数据将在程序终止时丢失。如果银行应用程序无法持久化账户信息，那么该应用程序将无用武处。同样，如果零售商店应用程序无法持久化库存、客户订单和发货信息，它也将毫无价值。持久化允许应用程序访问数据并执行更改数据状态的\
    \ CRUD（创建、读取、更新和删除）操作。在应用程序意外崩溃并恢复后，持久化允许应用程序使用与崩溃时完全相同状态的数据。\n\n在 Java 中有许多方法可以持久化数据。Java\
    \ 平台标准版（Java SE）提供了操作流和文件的 API。这需要大量的低级处理，例如定义流的位置和名称、打开和关闭流，以及定义数据格式。Java 数据库连接（JDBC）API\
    \ 可用于将数据存储在关系型数据库中，例如 Oracle 或 MySQL 数据库服务器。这需要管理数据库连接、编写 SQL 查询语句、将结果映射到 Java\
    \ 对象以及许多其他操作。不同的 NoSQL 数据存储提供了用于管理特定数据存储数据的 API。大多数数据都持久化在数据库中，特别是关系型数据库中。\n\n\
    Java EE 平台提供了 Java 持久 API（JPA）用于管理持久化和对象/关系映射。换句话说，一个 POJO（普通 Java 对象）可以用于表示关系型数据库中的一张表，每个类实例对应于表中的某行。该\
    \ API 定义了如何使用 POJO 管理这些行。\n\n存储在关系型数据库中的数据应保持 ACID（原子性、一致性、隔离性、持久性）属性。为了帮助维护 ACID\
    \ 属性，确保任何对数据的更新或删除都在事务边界内完成是非常重要的。事务可以是容器管理的，也可以是用户管理的。容器管理的事务既可以通过企业级 JavaBeans（EJB）容器管理，也可以通过使用事务\
    \ API（JTA）提供的 `@javax.transaction.Transactional` 注解来管理。在这种情况下，事务由容器自动启动，然后由容器提交或回滚。用户管理的事务则由用户显式启动，然后由用户提交或回滚。\n\
    \n本章将介绍 JPA 的核心概念，以及如何创建、查询和更新实体。文中解释了基于文本的持久化查询语言（JPQL）和类型安全的 Criteria API。最后解释了如何使用\
    \ NetBeans 工具和向导生成数据库架构。\n\n## JPA 实体\n\nJPA 将实体定义为轻量级领域对象。任何带有无参构造函数的 POJO 都可以是实体。图\
    \ 2-1 显示了一个定义作者的 JPA 实体。\n\n列表 2-1 作者实体\n```java\n@Entity\n@Table(name = \"AUTHOR\"\
    )\npublic class Author implements Serializable {\n    private static final long\
    \ serialVersionUID = 1L;\n    @Id\n    private Integer id;\n\n    @NotNull\n \
    \   @Size(min = 1, max = 20)\n    private String firstName;\n\n    @Size(max =\
    \ 20)\n    private String lastName;\n\n    @Size(max = 1000)\n    private String\
    \ bio;\n\n    @Size(max = 30)\n    private String email;\n    public Author()\
    \ { }\n    // 其他构造函数\n\n    // getters 和 setters\n}\n```\n\n## Java EE 和 HTML5\
    \ 企业级开发\n\n让我们来看这段代码：\n\n- `@javax.persistence.Entity` 注解用在 POJO 上，指定这是一个实体。实体的默认名称是类的未限定名。可以使用可选的\
    \ `name` 属性来指定实体名称，该名称随后查询中引用实体。\n- `@javax.persistence.Table` 是实体上的一个可选注解，用于指定被注解实体的主表。附加表可以使用\
    \ `SecondaryTable` 或 `SecondaryTables` 注解来指定。\n\n如果实体上没有指定 `@Table` 注解，或者注解未指定\
    \ `name` 属性，则生成的表默认为实体名称。\n\n- 实现 `Serializable` 接口允许该类通过远程接口按值传递。\n- 遵循 JavaBean\
    \ 风格访问器（“属性访问”）或实例变量（“字段访问”）的 Bean 属性代表实体的持久状态。实体类的持久化字段或属性可以是许多类型，例如 Java 原始类型、任何原始类型包装类、使用\
    \ `@javax.persistence.Embedded` 定义的并称为嵌入对象的其他细粒度类、嵌入对象的集合以及许多其他类型。\n\n代码中的 `firstName`、`lastName`、`bio`\
    \ 和 `email` 具有 getters 和 setters，为了代码在代码中省略了。这些字段中的每一个都将映射到数据库表中的列。\n\n属性和字段使用了合理的默认列名。例如，列名\
    \ `ID` 用于 `id` 属性，列名 `FIRST_NAME` 用于 `firstName` 属性。可选可以使用 `@javax.persistence.Column`\
    \ 注解来覆盖映射列的名称。\n\n- `@javax.persistence.Id` 注解指定实体的主键。应用此注解的字段或属性\n\n"
