    \ protocol to work over HTTP ports 80 and 443 and to support HTTP proxies and\
    \ intermediaries.\n\nThe WebSocket-related header fields in Listing 4-1 are as\
    \ follows:\n\n- The Upgrade and Connection header fields mark this HTTP request\
    \ as an upgrade request, specifically requesting an upgrade to WebSocket.\n\n\
    - Different subprotocols can be negotiated using the Sec-WebSocket-Protocol header\
    \ field. If you choose to define a subprotocol, that same field must be included\
