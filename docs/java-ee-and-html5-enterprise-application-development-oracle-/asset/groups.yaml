    # Chapter 1: Introduction to Java EE and HTML5 Enterprise Development 9


    This rise in accessing the Internet via mobile devices is also one of the factors
    that has enticed enterprise developers to look more at HTML5. The traditional
    website layout does not comfortably scale down for viewing on a smaller device
    like a smartphone or tablet. The existing methods of producing a completely different
    version of the website to display when the client is detected to be a mobile device
    have proven to be fraught with maintenance problems and inefficient to scale.


    ## New HTML5 Features


    One of the major new features of HTML5 is the inclusion of new semantic elements
    (see Table 1-1) to help developers manage the layout of the HTML page and its
    content so it scales flawlessly for viewing on smaller devices. You can now lay
    out your HTML content using tags such as `<header>`, `<footer>`, `<section>`,
    `<article>`, `<aside>`, `<nav>`, and many others.


    Along with the new semantic elements in the HTML5 specification, there are also
    new syntactic elements, as listed in Table 1-2, that are meant to remove the need
    to install proprietary plug-ins. These include elements as `<canvas>`, `<video>`,
    `<audio>`, and `<svg>`. These features are designed to make it easier to work
    with multimedia and graphics.


    Lastly, the HTML5 specification brings new attributes to some of the existing
    elements. The most notable of these are the new values for the type attributes
    of the `<input>` element (see Table 1-3). These are primarily used for forms.
    While all of these new type values are now part of the finalized specification...


    ### TABLE 1-1. Semantic Elements


    | Element | Description |

    | --- | --- |

    | <header> | The header section of a document. Usually contains introductory or
    navigational information. |

    | <footer> | The footer of a document. Usually contains things like copyright
    information, legal information, links to more information about the website, etc.
    |

    | <section> | A generic section in a document. |

    | <article> | An independent area of content within the document. |

    | <aside> | A piece of content that is only slightly connected to the rest of
    the document. |

    | <main> | The main content for the document. Only one of these elements is allowed
    in the document. |

    | <dialog> | A section of the document that will be used as a dialog box or pop-up
    window. |

    | <nav> | A section of the document meant for navigation links. |

    | <menuitem> | A piece of text that represents a command the user can choose from
    a pop-up menu. |

    | <mark> | A piece of text that should be highlighted for additional reference.
    |

    | <details> | A section of the document that contains additional controls or information
    that can be shown or hidden on demand. |

    | <summary> | Provides the summary content for the <details> element. |

    | <bdi> | A section of the document that needs to be isolated from other parts
    because it might be formatted for languages that need bidirectional language support.
    |

    | <figure> | A self-contained section of the document having its own flow. Usually
    of a graphical nature, such as images, video content, etc. |

    | <figcaption> | A caption for a <figure> element. |

    | <meter> | A section of the document that represents a measurement. |

    | <progress> | A section that presents the completion of a task. |

    | <ruby> | Allows for the inclusion of <ruby> annotations. Usually in East Asian
    typography. |

    | <rt> | Subelement of <ruby>. |

    | <rp> | Subelement of <ruby>. |

    | <time> | An element containing date and/or time information. |

    | <wbr> | An opportunity for a line break. |

    | <datalist> | Used in conjunction with the list attribute of an <input> element
    to create combo boxes. |

    | <output> | A section of the document that represents the output of some kind
    of calculation. |

    | <keygen> | Used as a key pair generator control. |


    ### TABLE 1-2. Syntactic Elements


    | Element | Description |

    | --- | --- |

    | <audio> | Audio multimedia content. |

    | <video> | Video multimedia content. |

    | <source> | A subelement of both <audio> and <video>. Used when there are multiple
    source formats available. |

    | <track> | Text tracks for the <video> element. |

    | <canvas> | A section used for rendering dynamic bitmap content. Intended for
    content like graphs or games. |

    | <svg> | A section used for rendering Scalable Vector Graphics (SVG). |


    ### TABLE 1-3. Form Input Type


    | Attribute | Description |

    | --- | --- |

    | <input type="color"/> | Input value represents a color |

    | <input type="date"/> | Input value represents a date |

    | <input type="datetime"/> | Input value represents a date and time |

    | <input type="datetime-local"/> | Input value represents a local date and time
    with no time-zone offset |

    | <input type="time"/> | Input value represents a time |

    | <input type="email"/> | Input value represents an email address |

    | <input type="month"/> | Input value represents a month |

    | <input type="week"/> | Input value represents a week |

    | <input type="number"/> | Input value represents a number |

    | <input type="range"/> | Input value represents a range between a minimum and
    maximum setting |

    | <input type="search"/> | Input value represents a search |

    | <input type="tel"/> | Input value represents a telephone number |

    | <input type="url"/> | Input value represents a URL |


    # Chapter 1: Introduction to Java EE and HTML5 Enterprise Development 11


    # Java EE and HTML5 Enterprise Application Development


    HTML5 specification, each browser can, and implemented how they behave when they
    are rendered. It is the intent of the specification that the vendor will be able
    to provide a user interface for each of these input types. For instance, if a
    browser renders an input field with the type set to "Date", the end user would
    see a date picker to select the date they wish to enter. Unfortunately, this is
    one of the areas in which browser vendors currently have the largest separation
    in functionality. On mobile devices, the experience is better. You will often
    find when you click or touch in an input field that has the type set to "number",
    you will get a number pad instead of the normal keyboard, or a different type
    of keyboard will be displayed if the input field is like "url".


    ## Parts of an HTML5 Application


    One of the most misconceptions about HTML5 applications is that they are composed
    of HTML5 only. In fact, in all cases the application is actually made up of at
    least three components: HTML5, JavaScript, and Cascading Style Sheets (CSS). By
    combining all of the new media query feature of CSS version 3 (CSS), you can display
    the same content with different layouts device sizes. This method of modifying
    the content to respond to the device''s available display size is called *responsive
    design*; the layout responds to the display size that it is rendered.


    There are a few important caveats to note about responsive design. First, although
    it does allow you to create a website that will have the same look and feel across
    multiple device sizes, the HTML5 application is still a web page that is being
    viewed in a web browser on a smaller device such as a smartphone or tablet. The
    application will not have a true “native” look and feel like an application that
    is written and compiled for a specific type of mobile device. Second, HTML5 and
    responsive design may not be the answer for developers who want their application
    to have access to specific mobile features such as the camera, contact list, and
    calendar. Because the application is running in a web browser, you can only program
    your application to use what the browser allows you to interact with.


    As previously mentioned, the third component commonly used in HTML5 applications
    is JavaScript. The introduction of JavaScript architectural libraries has been
    a big factor in making it more acceptable to enterprise developers.

