  - '[PAGE 105]


    86 Java EE and HTML5 Enterprise Application Development


    The increase in development and availability of HTML5 applications for just about
    every type of device, from desktop computers to smartphones, and everything in
    between, has brought much-needed scrutiny to HTML5 applications best be used in
    the enterprise application space. In this chapter you will learn how to create
    a pure client-side HTML5 application that will consume and interact with the REST,
    Server-Sent Events (SSE), and WebSocket java services that you learned how to
    write in previous chapters. You will see how to implement the Model-View-ViewModel
    (MVVM) architecture pattern through the use of the JavaScript library Knockout.js.
    You will also be shown the basics of responsive design techniques using CSS3 media
    queries to dynamically change the UI layout when the application is displayed
