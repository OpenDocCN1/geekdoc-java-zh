    \ `addBook` 对话框类似，这是一个 Twitter Bootstrap 模态框。在列表 5-15 中有两个重要的点需要注意。首先，你不需要直接向此对话框传递任何信息。每个字段都绑定到现有的\
    \ Knockout 可观察对象上，该对象也用于在主页面中显示书籍详情。\n\n> 注意\n> 注意所有 `<input>` 元素都使用 `value` 绑定，而其他\
    \ DOM 元素使用 `text:` 绑定来获取内容。在处理 Knockout 绑定时，为种类型的 DOM 元素绑定正确的内容属性至关重要。例如，如果你通过\
    \ `value` 属性设置 DOM 元素的内容，那么你应该使用 Knockout 绑定。\n\n其次，注意在所有表单元素中，Knockout 可观察对象都是被当作函数来调用的：`data-bind=\"\
    value: isbn()`。这非常重要。由于 Knockout 的双向绑定，如果你尝试直接绑定到可观察对象，一旦你在表单字段中更改了它，它就会立即在书籍详情页中更新。你不希望这种情况立即发生，以防最终用户点击“取消”按钮而不是提交更改。通过作为函数调用可观察对象，你获得的是变量的实际值而不是可观察对象。\n\
    \n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_128_0.png)\n\n## Java EE 和 HTML5 企业级应用开发\n\
    \n列表 5-16 展示了如何处理表单以及如何在 REST API 中执行实际更新。\n\n### 列表 5-16 提交更新\n\n```javascript\n\
    function updateBook(data) {\n  var json = {\n    title: data.elements[1].value,\n\
    \    isbn: data.elements[2].value,\n    publisher: data.elements[3].value,\n \
    \   published: new Date(data.elements[4].value),\n    description: data.elements[5].value\n\
    \  };\n  $.ajax({\n    url: serviceRootURL + \"/books\",\n    type: 'PUT',\n \
    \   data: JSON.stringify(json),\n    dataType: 'json',\n    contentType: 'application/json',\n\
    \    success: function(data, status, xhr) {\n      $('#updateBookDialog').modal('hide');\n\
    \    },\n    $('#updateBookDialog').on('hidden.bs.modal', function () {\n    \
    \  loadDefaults();\n    });\n    error: function(xhr, status, errorThrown) {\n\
    \      alert('Error updating the Book: ' + status + \": \" + errorThrown);\n \
    \   }\n  });\n}\n```\n\n让我们遍历这段代码以检查正在发生什么：\n\n- 传入 REST API 调用的 JSON 对象是使用 Knockout\
    \ 提交（绑定触发）时传递的表单数据创建的。\n- 再次使用用于添加新书籍的同一个 AJAX 调用来更新书籍。然而，使用的 `type` 属性现在是 `PUT`，而不是添加方法时使用的\
    \ `POST`。\n- 你同样拥有相同的 `success:` 和 `error:` 回调函数。`error:` 函数与之前完全相同。\n\n## 第5章：HTML5,\
    \ JavaScript, CSS 111\n\n更新完成后，应用程序将返回主页面。`success:` 函数会关闭 `updateBookDialog`\
    \ 对话框并等待其完成。然后它会调用 `loadDefaults()` 函数，该函数会重置 ViewModel 并正确的绑定恢复到主页面。\n\n## 删除，使用\
    \ DELETE 请求（CRUD 中的 D）\n\n更新过程的设置有点长，但这些设置开启了删除功能。`confirmDeleteDialog` 对话框的显示方式与\
    \ `updateBookDialog` 对话框相同，通过调用 `showDeleteDialog()` 函数来实现。列表 5-17 显示了执行删除所需的\
    \ REST API 调用。\n\n### 列表 5-17 DELETE REST API 调用示例\n\n```javascript\nfunction\
    \ deleteBook(data) {\n  var currentISBN = data.isbn();\n  var books = booksVM.Books();\n\
    \n  $.ajax({\n    url: serviceRootURL + \"books/\" + data.isbn(),\n    type: 'DELETE',\n\
    \    dataType: 'application/json',\n    success: function(data, status, xhr) {\n\
    \      var match = ko.utils.arrayFirst(books, function(item) {\n        return\
    \ item.isbn() === currentISBN;\n      });\n      ko.utils.arrayRemove(books, match);\n\
    \      $('#confirmDeleteDialog').modal('hide');\n      $('#confirmDeleteDialog').on('hidden.bs.modal',\
    \ function() {\n        loadDefaults();\n      });\n    },\n    error: function(xhr,\
    \ status, errorThrown) {\n      alert('Error updating the Book: ' + status + \"\
    : \" + errorThrown);\n    }\n  });\n}\n```\n\n## Java EE 和 HTML5 企业级应用开发\n\n112\
    \ Server-Sent Events (SSE)\n\n## Server-Sent Events (SSE)\n\nServer-Sent Events\
    \ 有时被称为推送技术，因为数据流是单向的。一切都来自服务器。浏览器选择连接到 SSE 流，以便在有新信息可用向其发送信息。示例应用程序设置了一个部分用于显示传入的数据。Knockout\
    \ 双向绑定对于显示非常有帮助，因为你可以将传入的数据与特定的 DOM 元素建立绑定，并在新数据进入时让 Knock 进行更新。列表 5-18 展示了如何连接到\
    \ SSE 流以及使用哪些函数处理流及其数据。\n\n### 列表 5-18 Server-Sent Events 示例\n\n```javascript\n\
    function sseViewModel() {\n  var self = this;\n  self.sseData = ko.observable('test\
    \ message');\n  self.displayError = ko.observable(false);\n  self.displayMessage\
    \ = ko.observable(false);\n\n  if (typeof(Event) == \"undefined\") {\n    self.source\
    \ = new EventSource(serviceRootURL + \"/books/events\");\n    self.source.onopen\
    \ = function (event) {\n      var message = \"SSE Connection Opened<hr>\";\n \
    \     self.sseData(message);\n    };\n    self.source.onmessage = function(event)\
    \ {\n      var message = self.sseData() + event.data + \"<hr>\";\n      self.sseData(message);\n\
    \    };\n    self.source.onerror = function (event) {\n      self.displayError(false);\n\
    \      self.sseData(event.data);\n    };\n  } else {\n    self.sseData(\"Sorry,\
    \ your browser does not support server-events...\");\n    self.displayError(true);\n\
    \  }\n}\n\nself.closeSSE = function() {\n  self.source.close();\n}\n```\n\n"
