    \    </select>\n  </div>\n</div>\n<div class=\"form-group\">\n  <label class=\"\
    control-label col-md-3\" for=\"bookISBN\">ISBN</label>\n  <div class=\"col-md-9\"\
    >\n    <input id=\"bookISBN\" type=\"text\" class=\"form-control\"/>\n  </div>\n\
