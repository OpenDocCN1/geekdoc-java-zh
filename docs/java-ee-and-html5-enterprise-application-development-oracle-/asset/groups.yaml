- md: "\nLet's take a closer look at the methods shown in Listing 4-9. Remember that\
    \ during the initialization, you defined the new WebSocket object as a variable\
    \ named websocket.\n\n- websocket.onopen (evt) you are simply sending a message\
    \ to the output variable saying that the connection was successful. This is the\
    \ first event thrown by the WebSocket connection and where you would do any additional\
    \ setup code if you needed it.\n\n- websocket.onclose (evt) you are going to check\
    \ for the code given by the WebSocket protocol to help determine why the connection\
    \ was closed. The tricky part with doing this is that the WebSocket protocol (RFC\
    \ 6455) says only that the endpoint \"may\" send a close code, that it does not\
    \ have to. If a code is sent, it should conform with one of the close codes defined\
    \ in the IETF specification (https://tools.ietf.org/html/rfc6455#section-7.4).\
    \ The recommended codes are listed and described (quoting RFC 6455) in Table 4-1.\n\
    \n| Code | Description |\n| --- | --- |\n| 1000 | Indicates a normal closure,\
    \ meaning that the purpose for which the connection was established has been fulfilled.\
    \ |\n| 1001 | Indicates that an endpoint is \"going away,\" such as a server going\
    \ down or a browser having navigated away from a page. |\n| 1002 | Indicates that\
    \ an endpoint is terminating the connection due to a protocol error. |\n| 1003\
    \ | Indicates that an endpoint is terminating the connection because it has received\
    \ a type of data that it cannot accept (e.g., an endpoint that understands only\
    \ text data MAY send this if it receives a binary message). |\n| 1004 | Reserved.\
    \ The specific meaning must be defined in the future. |\n| 1005 | Is a reserved\
    \ value and MUST NOT be set as a status code in a Close control frame by an endpoint.\
    \ It is designated for use in applications expecting a status code to indicate\
    \ that no status code was actually present. |\n\nTABLE 4-1. RFC 6455 Close Codes\n\
    \n# Java EE and HTML5 Enterprise Application Development\n\n| Code | Description\
    \ |\n|---|---|\n| 1006 | Is a reserved value and MUST NOT be set as a status code\
    \ in a Close control frame by an endpoint. It is designated for use in applications\
    \ expecting a status code to indicate that the connection was closed abnormally\
    \ (e.g., without sending or receiving a Close control frame). |\n| 1007 | Indicates\
    \ that an endpoint is terminating the connection because it has received data\
    \ within a message that was not consistent with the type of the message (e.g.,\
    \ non-UTF-8 [RFC3629] data within a text message). |\n| 1008 | Indicates that\
    \ an endpoint is terminating the connection because it has received a message\
    \ that violates its policy. This is a generic status code that can be returned\
    \ when there is no other suitable status code (e.g., 1003 or 1009) or if there\
    \ is a need to hide specific details about the policy. |\n| 1009 | Indicates that\
    \ an endpoint is terminating the connection because it has received a message\
    \ that is too big to process. |\n| 1010 | Indicates that an endpoint (client)\
    \ is terminating the connection because it has expected the server to negotiate\
    \ one or more extensions, but the server didn't return them in the response message\
    \ of the WebSocket handshake. The list of extensions that are needed SHOULD appear\
    \ in the /reason/ part of the Close frame. Note that status code is not used by\
    \ the server, because it can fail the WebSocket handshake instead. |\n| 1011 |\
    \ Indicates that a server is terminating the connection because it encountered\
    \ an unexpected condition that prevented it from fulfilling the request. |\n|\
    \ 1015 | Is a reserved value and MUST NOT be set as a status code in a Close control\
    \ frame by an endpoint. It is designated for use in applications expecting a status\
    \ code to indicate that the connection was closed due to a failure to perform\
    \ a TLS handshake (e.g., the server certificate can't be verified). |\n\nTABLE\
    \ 4-1. RFC 6455 Close Codes\n\nThe code for this game you are only going to check\
    \ for a couple of specific codes, and just fall back to a generic message that\
    \ shows the close code for anything else that may be sent by the endpoint. The\
    \ check for close code 1006 is just in case the application tries to connect to\
    \ the endpoint and it's not there. You can't use the onerror() event for this\
    \ case because the WebSocket object is not completely created when this happens.\
    \ It closes before it has been completely opened. The check for close code 1000\
    \ is to indicate that the New Game button was clicked and the websocket.close()\
    \ method was called and processed successfully.\n\n- websocket.onerror() method\
    \ is pretty self-explanatory. If there is an error, the endpoint may trigger an\
    \ error event. That error would be captured by this method and the message will\
    \ be displayed on the game.\n\n- websocket.send() method is used to send a message\
    \ to the server. For this game example, only text is being sent and received over\
    \ the WebSocket connection. However, the WebSocket protocol can also send and\
    \ receive binary data in the form of a Blob or ArrayBuffer.\n\n# WebSocket Data\
    \ Management\n\nThe final method for the WebSocket API is websocket.onmessage().\
    \ This is where the heart of the communication between the client and server is\
    \ performed. Listing 4-10 shows the code from the websocket.js file that handles\
    \ the incoming text messages from the server endpoint.\n\n> Listing 4-10 websocket.onmessage()\
    \ Method\n\n```javascript\nwebsocket.onmessage = function(evt) {\n  var json =\
    \ null;\n  try {\n    json = $.parseJSON(evt.data);\n  } catch (ex) {\n    json\
    \ = null;\n  }\n  if (json === null) {\n    if (evt.data.toLowerCase().indexOf(\"\
    x\") >= 0) {\n      vm.playerName('Player One');\n      vm.playerStatus(true);\n\
    \    }\n  }\n```\n\n# Java EE and HTML5 Enterprise Application Development\n\n\
    ```javascript\n  vm.gameStatus('You Go First!');\n  vm.image(vm.X);\n  vm.symbol(vm.playerOne);\n\
    } else {\n    vm.playerName('Player Two');\n    vm.showStatus(true);\n    vm.gameStatus('Please\
    \ Wait');\n    vm.image(vm.O);\n    vm.symbol(vm.playerTwo);\n} else {\n    if\
    \ (json.symbol === 'x') {\n        vm.image(vm.X);\n        vm.symbol(json.symbol);\n\
    \        setCellImage(json);\n    } else {\n        vm.image(vm.O);\n        vm.symbol(json.symbol);\n\
    \    }\n}\n```\n\nLet's walk through the code in Listing 4-10 to get a better\
    \ idea of how the client interacts with the server:\n\n- The first time the browser\
    \ connects to the WebSocket endpoint, the server sends back a message saying which\
    \ player that connection is. Player X goes first in the game of tic-tac-toe, so\
    \ the returned string is parsed for the character “x” and, if found, the onmessage\
    \ method does all the game setup for “Player One.” Any other string is assigned\
