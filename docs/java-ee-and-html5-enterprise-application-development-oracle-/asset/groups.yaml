    # 112 Java EE and HTML5 Enterprise Application Development


    After the user clicks the Yes button in the confirmDeleteDialog confirmation dialog,
    the deleteBook(data) function is called and the current Books details are passed
    to the function. To delete a record using a REST API, you need to have a unique
    ID for the record you want to delete. The example application''s case, this is
    the ISBN value.

    Let''s take a look at the code in Listing 5-17:


    +   - The JSON object that will be passed to the AJAX call needs to contain only
    the unique ID for the record you want to delete. Notice that, once again, you
    are setting the actual value of the observable, and not a reference to the observable
    object.

    - A local variable is set to the current ISBN value so that the ISBN can be used
    in a comparison later.

    - A local variable is set to the Books observableArray so that you can remove
    the Model entry if the REST API call is successful.

    - The URL is set in the AJAX call to use the REST API that will get the exact
    book that you want to delete.

    - The type attribute is set to DELETE.

    - The dataType and contentType are both set to JSON so that the service knows
    that is what you are sending and expecting back.

    - As all the other calls, there are success: and error: callback functions. The
    error: function is exactly the same as before.

    - The success: function uses the Knockout utility function of arrayFirst() to
    find the first match in the observableArray. Once is found, it returns a reference
    to Model so that it can be removed using another Knockout utility function called
    arrayRemoveItem().

    - Just as you did with the updateBookDialog dialog, the confirmDeleteDialog dialog
    is closed, and then once the close is completed, the loadDefaults() function is
    called to reset the ViewModel and load the main page.'
  - "[PAGE 132]\n\n# Server-Sent Events (SSE)\n\nServer-Sent Events is sometimes referred\
    \ to as push technology because the data flow is in one direction only. Everything\
    \ comes from the server. The browser chooses to attach to the SSE stream to have\
    \ information sent to it whenever new information becomes available. The example\
    \ application has an Events section set up that will display data coming from\
    \ an SSE stream. Knockout two-way binding is really helpful with the displaying\
    \ of the data since you can set up the binding between the incoming data and a\
    \ specific DOM element and just let Knock update whenever the new data coming\
    \ in. Listing 5-18 shows how you connect to the SSE stream and which functions\
    \ are used to work with the stream and its data.\n\n+   **Listing 5-18** Example\
    \ of Server-Sent Events\n\n```\nfunction sseViewModel() {\n  var self = this;\n\
    \  self.sseData = ko.observable('test message');\n  self.displayError = ko.observable(false);\n\
    \  self.displayMessage = ko.observable(false);\n\n  if (typeof(Event) == \"undefined\"\
    ) {\n    self.source = new EventSource(serviceRootURL + \"/books/events\");\n\
