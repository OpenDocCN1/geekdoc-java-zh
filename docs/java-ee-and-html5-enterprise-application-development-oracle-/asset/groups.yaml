    \ IDE 中查看数据，如图 2-11 所示。\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_52_0.png)\n\
    \n图 2-10. 查看数据库中定义的数据\n\n## Java EE 和 HTML5 企业级开发\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_53_0.png)\n\
    \n图 2-11. 在 SQL 编辑器中编辑 SQL 查询字符串\n\n可以通过任何方法检索所需的实体来删除数据库表中的某行。调用 `javax.persistence.EntityManager.remove()`\
    \ 方法来删除实体。与 `javax.persistence.EntityManager.persist()` 方法一样，它必须在事务内调用。当事务提交时（由容器隐式提交或用户显式提交），实体的状态将持久化到数据库。\n\
    \nNetBeans IDE 提供了一个向导，用于生成 JPA 控制器类，以为实体类执行 CRUD 功能。在 IDE 中，右键点击你的应用程序并选择 New\
    \ | Other | Persistence | JPA Controller Classes from Entity Classes。\n\n此外，你还可以为应用程序中的实体类生成\
    \ session beans。在 IDE 中，右键点击你的应用程序并选择 New | Other | Enterprise JavaBeans Session\
    \ Beans for Entity Classes，这将显示图 2-12 所示的 New Session Beans for Entity Classes\
    \ 页面。\n\n## 第 2 章：持久化 35\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_54_0.png)\n\
    \n图 2-12. 开始为现有实体类创建 session beans\n\n从左侧面板的 Available Entity Classes 列表中选择任意实体类，并点击\
    \ Add 按钮。任何引用的实体类都会自动添加到右侧面板的 Selected Entity Class 列表中。如果实体类显示为灰色，则表示它是被引用的实体类。\n\
    \n点击 Next 到向导的 Generated Session Beans 页面（如图 2-13 所示），并检查或设置以下内容：\n\n- Project（项目）：显示将保存实体类的项目。此字段是只读的。\n\
    - Location（位置）：选择你想要创建实体类的源文件夹。\n- Package（包）：从 Package 下拉列表中选择现有的包，或输入新包的名称。\n\
    - Create Interfaces（创建接口）：选择你希望向导生成的 session facade 接口。\n\n当你点击 Finish 时，将创建指定的\
    \ session beans，如图 2-14 所示。\n\n## 36 Java EE 和 HTML5 企业级开发\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_55_0.png)\n\
    \n图 2-13. 为 session beans 指定详细信息\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_55_0.png)\n\
    \n图 2-14. 在应用程序中创建 session beans\n\n## 架构生成\n\n通常，数据库架构已经定义，并且可以从脚本生成。列表 2-7 显示了如何配置这些属性：\n\
    \n```xml\n<persistence version=\"2.1\" xmlns=\"http://xmlns.jcp.org/ns/persistence\"\
    \nxmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\nxsi:noNamespaceLocation=\"\
    http://xmlns.jcp.org/ns/persistence/persistence.xsd\">\n  <persistence-unit name=\"\
    authorPU\" transaction-type=\"JTA\">\n    <properties>\n      <property name=\"\
    javax.persistence.schema-generation.database.action\" value=\"drop-and-create\"\
    />\n      <property name=\"javax.persistence.schema-generation.create-source\"\
    \ value=\"script\"/>\n      <property name=\"javax.persistence.schema-generation.drop-source\"\
    \ value=\"script\"/>\n      <property name=\"javax.persistence.schema-generation.create-script-source\"\
    \ value=\"META-INF/create.sql\"/>\n      <property name=\"javax.persistence.schema-generation.drop-script-source\"\
    \ value=\"META-INF/drop.sql\"/>\n      <property name=\"javax.persistence.sql-load-source\"\
    \ value=\"META-INF/load.sql\"/>\n    </properties>\n  </persistence-unit>\n</persistence>\n\
    ```\n\n以下列表解释了这些属性：javax.persistence.schema-generation.database\n\n- `javax.persistence.schema-generation.database.action`\
    \ 属性值指定删除现有表并创建。可能的值有 none、create、drop-and-create 和 drop。\n- `javax.persistence.schema-generation.create-source`\
    \ 属性值指定数据库创建是基于脚本的。\n- `javax.persistence.schema-generation.drop-source` 属性值指定数据库删除是基于脚本的。\n\
    \n上述两个属性的可能值有 metadata、script、metadata-then-script 和 script-then-metadata。在这种情况下，使用实体上指定的脚本或元数据或组合来创建或删除表。\n\
    \n- `javax.persistence.schema-generation.create-script-source` 属性值指定数据库创建脚本的位置。\n\
    - `javax.persistence.schema-generation.drop-script-source` 属性值指定数据库删除脚本的位置。\n\
    - `javax.persistence.sql-load-source` 属性值指定 SQL 批量加载脚本的位置。\n\n最后三个属性值指定脚本与应用程序打包。在这种情况下，脚本的位置相对于持久化单元指定。或者，可以使用\
    \ URL 外部标识脚本。\n\n这些属性允许从脚本或实体元数据生成数据库架构。除了之前描述的属性外，可以使用以下属性来指定脚本的生成：\n\n- `javax.persistence.schema-generation.scripts.action`\
    \ 可指定需要哪些脚本。可能的值有 none、create、drop-and-create 和 drop。\n- `javax.persistence.schema-generation.scripts.create-target`\
    \ 和 `javax.persistence.schema-generation.scripts.drop-target` 可指定创建和删除脚本的位置。位置指定为对应文件\
    \ URL 的字符串。\n\n"
