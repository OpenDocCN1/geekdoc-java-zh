    >\n    <label class=\"control-label col-md-3\" for=\"bookISBN\">ISBN</label>\n\
    \    <div class=\"col-md-9\">\n      <input id=\"bookISBN\" type=\"text\" class=\"\
    form-control\" data-bind=\"value: isbn()\">\n    </div>\n  </div>\n</div>\n```\n\
    \nLike the addBook dialog created in Listing 5-9, this is a Twitter Bootstrap\
    \ modal. There are two important things to note in Listing 5-15. First, you don't\
    \ need to pass any information to this dialog directly. Each field is bound to\
    \ the existing Knockout observable that was also used to display the book details\
    \ in the main page.\n\n> NOTE\n> Notice that all <input> elements use a value\
    \ binding while other DOM elements use a text: binding to get their content. When\
    \ working with Knockout bindings, it's important to bind the proper content attribute\
    \ for each type of DOM element. For example, if you set the content of a DOM element\
    \ by using the value attribute, then you would use the Knockout binding.\n\nSecond,\
    \ notice that the Knockout observables are being called as a function in all of\
    \ the form elements: `data-bind=\"value: isbn()\"`. This is very important. Because\
    \ Knockout's two-way binding, if you were to attempt a binding to the observable\
    \ directly, as soon as you changed it in the form field, it would update in the\
    \ book details page. You don't want this to happen immediately, just in case the\
    \ end user clicks the Cancel button instead of submitting the changes. By calling\
    \ the observable as a function, you get the actual value of the variable instead\
    \ of the observable object.\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_128_0.png)\n\
    \n## Java EE and HTML5 Enterprise Application Development\n\nListing 5-16 shows\
    \ how the form is processed and the actual update is performed in the REST API.\n\
    \n### Listing 5-16 Submitting Update\n\n```javascript\nfunction updateBook(data)\
    \ {\n  var json = {\n    title: data.elements[1].value,\n    isbn: data.elements[2].value,\n\
    \    publisher: data.elements[3].value,\n    published: new Date(data.elements[4].value),\n\
    \    description: data.elements[5].value\n  };\n  $.ajax({\n    url: serviceRootURL\
    \ + \"/books\",\n    type: 'PUT',\n    data: JSON.stringify(json),\n    dataType:\
    \ 'json',\n    contentType: 'application/json',\n    success: function(data, status,\
    \ xhr) {\n      $('#updateBookDialog').modal('hide');\n    },\n    $('#updateBookDialog').on('hidden.bs.modal',\
    \ function () {\n      loadDefaults();\n    });\n    error: function(xhr, status,\
    \ errorThrown) {\n      alert('Error updating the Book: ' + status + \": \" +\
    \ errorThrown);\n    }\n  });\n}\n```\n\nLet's walk through this code to examine\
    \ what is going on:\n\n- The JSON object that will be passed into the REST API\
    \ call is being created using the form data passed when Knockout submit: binding\
    \ is triggered.\n- The same AJAX call that you used to add a new book is used\
    \ again to update a book. However, the type attribute used is now PUT instead\
    \ of POST as was used for the add method.\n- You have the same success: and error:\
    \ callback functions as well. The error: function is exactly the same as before.\n\
    \n## Chapter 5: HTML5, JavaScript, CSS 111\n\nAfter the update has been completed,\
    \ the application returns to the main page. The success: function closes the updateBookDialog\
    \ dialog and waits for that to be completed. It then calls the loadDefaults()\
    \ function, which resets the ViewModel and correct bindings back to the main page.\n\
    \n## Delete, Using the DELETE Request (D of CRUD)\n\nThe setup for the update\
    \ process was a little long, but that setup enabled the delete functionality.\
    \ The confirmDeleteDialog dialog is displayed in the same way as the updateBookDialog\
    \ dialog was, with a call to a showDeleteDialog() function. Listing 5-17 shows\
    \ the REST API call that is needed to perform a delete.\n\n### Listing 5-17 Example\
    \ of DELETE REST API Call\n\n```javascript\nfunction deleteBook(data) {\n  var\
    \ currentISBN = data.isbn();\n  var books = booksVM.Books();\n\n  $.ajax({\n \
