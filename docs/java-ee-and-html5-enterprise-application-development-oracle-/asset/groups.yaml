    \ shows the use of the NetBeans IDE Network Monitor feature to see the data being\
    \ sent and received.\n\n# Managing the Game Logic\n\nIn the ticactoe.js file,\
    \ the rest of the game logic is processed. Listing 4-11 shows the setCellImage()\
    \ method.\n\n> Listing 4-11 setCellImage() Method\n\n```javascript\nfunction setCellImage(data)\
    \ {\n  var myData = data;\n  var cellID = \"cell\" + myData.x + \"-\" + myData.y;\n\
    \  if (myData.symbol === 'x') {\n    vm.image(vm.X);\n    vm.symbol(vm.playerTwo);\n\
    \  } else {\n    vm.image(vm.O);\n    vm.symbol(vm.playerOne);\n  }\n  $('#' +\
    \ cellID).attr(\"src\", vm.image());\n  if (vm.gameStatus().toLowerCase().indexOf(\"\
    wait\") >= 0) {\n    vm.gameStatus('Your turn');\n  } else {\n    vm.gameStatus('Please\
    \ wait');\n  }\n}\n```\n\n| Output | Network Monitor | Headers: Frames |\n| ---\
    \ | --- | --- |\n| localhost:8080/TicTacToe/toepoint | | You play O |\n| localhost:8080/TicTacToe/bandSize\
    \ | | (Symbol: Y, X, Y, X) |\n\nFigure 4-2. NetBeans Network Monitor window\n"
  mdcn: "\n让我们仔细查看列表 4-9 中显示的方法。请记住，在初始化期间，你将新的 WebSocket 对象定义为一个名为 `websocket` 的变量。\n\
    \n- `websocket.onopen (evt)`：你只是在向输出变量发送一条消息，表示连接成功。这是由 WebSocket 连接抛出的第一个事件，如果你需要任何额外的设置代码，可以在此处进行。\n\
    \n- `websocket.onclose (evt)`：你将检查 WebSocket 协议提供的代码，以帮助确定连接关闭的原因。执行此操作的棘手之处在于，WebSocket\
    \ 协议 (RFC 6455) 仅说明端点“可以”发送关闭代码，但并不必须发送。如果发送了代码，它应该符合 IETF 规范（https://tools.ietf.org/html/rfc6455#section-7.4）中定义的其中一个关闭代码。表\
    \ 4-1 列出并描述了建议的代码（引自 RFC 6455）。\n\n| 代码 | 描述 |\n| --- | --- |\n| 1000 | 表示正常关闭，意味着建立连接的目的已经实现。\
    \ |\n| 1001 | 表示端点正在“离开”，例如服务器宕机或浏览器已导航离开页面。 |\n| 1002 | 表示端点由于协议错误正在终止连接。 |\n\
    | 1003 | 表示端点因为收到了无法接受的数据类型的数据而终止连接（例如，仅理解文本数据的端点如果接收到二进制消息，可能会发送此代码）。 |\n| 1004\
    \ | 预留。具体含义必须在未来定义。 |\n| 1005 | 是一个预留值，端点**不得**在 Close（关闭）控制帧中将其设置为状态码。它被指定用于期望通过状态码来指示实际上不存在任何状态码的应用。\
    \ |\n\n表 4-1. RFC 6455 关闭代码\n\n# Java EE 和 HTML5 企业级应用开发\n\n| 代码 | 描述 |\n|---|---|---|\n\
    | 1006 | 是一个预留值，端点**不得**在 Close（关闭）控制帧中将其设置为状态码。它被指定用于期望通过状态码来指示连接异常关闭（例如，在没有发送或接收\
    \ Close 控制帧的情况下）的应用。 |\n| 1007 | 表示端点因为收到的消息内数据与消息类型不一致而终止连接（例如，文本消息中包含非 UTF-8\
    \ [RFC3629] 数据）。 |\n| 1008 | 表示端点因为收到的消息违反了其策略而终止连接。这是一个通用状态码，当没有其他合适的状态码（例如 1003\
    \ 或 1009）或者当需要隐藏有关策略的特定细节时，可以返回此代码。 |\n| 1009 | 表示端点因为收到的消息过大而无法处理而终止连接。 |\n|\
    \ 1010 | 表示端点（客户端）正在终止连接，因为它期望服务器协商一或或多个扩展，但服务器没有在 WebSocket 握手的响应消息中返回这些扩展。所需的扩展列表**应该**出现在\
    \ Close（关闭） 帧的 `/reason/` 部分。注意，服务器不使用状态码，因为它可以导致 WebSocket 握手失败。 |\n| 1011 |\
    \ 表示服务器因为遇到了阻止其完成请求的意外情况而正在终止连接。 |\n| 1015 | 是一个预留值，端点**不得**在 Close（关闭）控制帧中将其设置为状态码。它被指定用于期望通过状态码指示连接因执行\
    \ TLS 握手失败而关闭的应用（例如，无法验证服务器证书）。 |\n\n表 4-1. RFC 6455 关闭代码\n\n对于这个游戏代码，你只需要检查几个特定的代码，对于端点可能发送的任何其他内容，回退到一个显示关闭代码的通用消息。检查关闭代码\
    \ 1006 只是以防应用程序尝试连接端点但该端点并不存在。在这种情况下，你无法使用 `onerror()` 事件，因为发生这种情况时 WebSocket\
    \ 对象尚未完全创建。它在完全打开之前就关闭了。检查关闭代码 1000 是表示点击了“新游戏”（New Game）按钮，并且 `websocket.close()`\
    \ 方法已调用并成功处理。\n\n- `websocket.onerror()` 方法非常浅而易懂。如果发生错误，端点可能会触发错误事件。该错误将被此方法捕获，消息将显示在游戏上。\n\
    \n- `websocket.send()` 方法用于向服务器发送消息。在这个游戏示例中，WebSocket 连接仅发送和接收文本。然而，WebSocket\
    \ 协议还可以以 Blob 或 ArrayBuffer 的形式发送和接收二进制数据。\n\n# WebSocket 数据管理\n\nWebSocket API\
    \ 的最后一个方法是 `websocket.onmessage()`。这是客户端与服务器之间通信的核心。列表 4-10 显示了 `websocket.js`\
    \ 文件中处理来自服务器端点的入站文本的代码。\n\n> 列表 4-10 websocket.onmessage() 方法\n\n```javascript\n\
    websocket.onmessage = function(evt) {\n  var json = null;\n  try {\n    json =\
