- md: "\n# 80 Java EE and HTML5 Enterprise Application Development\n\nWhen setting\
    \ the image for the specific game cell, as shown in Listing 4-11, the image can\
    \ be set either from the client of the player actually clicking the game cell\
    \ or from the server to show what the opponent just selected. This method has\
    \ to handle both cases. Here is where your use of the Knockout viewmodel starts\
    \ to come into play. If the symbol member of the data object is player X, the\
    \ viewmodel's image attribute, or observable in Knockout terms, is to be the image\
    \ for X. You are then going to set the viewmodel's symbol observable to the opposite\
    \ of who played. This is because the existing player's turn is done and you are\
    \ beginning to set things up for the next player. Now you set the arc attribute\
    \ of the specific cell to that location of the X or Y image. Finally, the status\
    \ needs to be updated to tell the players when observable is currently set to\
    \ \"Wait wait\", then you switch it to say \"Your turn.\" Otherwise, set it to\
    \ \"Please wait\".\n\nSo far you have followed the flow of how things work when\
    \ data is received from the server with the websocket.onmessage() event. The flow\
    \ for clicking a specific game cell and sending that to the server and then your\
    \ opponent is very similar, but it starts with the gameCellClicked() method in\
    \ Listing 4-12.\n\n## Listing 4-12 Capturing Game Cell Clicks and Sending Data\n\
    \n```javascript\nfunction gameCellClicked(data, event) {\n    var player = vm.symbol();\n\
    \    var json = createJSON(player, $(event.currentTarget).attr('data-x'), $(event.currentTarget).attr('data-y'));\n\
    \    setCellImage(json);\n    send(JSON.stringify(json));\n}\n\nfunction createJSON(symbol,\
    \ x, y) {\n    var jsonData = \"\"\n    + \"\\\"symbol\\\": \\\"\" + symbol +\
    \ \"\\\",\"\n    + \"\\\"x\\\": \\\"\" + x + \"\\\",\"\n    + \"\\\"y\\\": \\\"\
    \" + y + \"\\}\";\n\n    return JSON.parse(jsonData);\n}\n```\n\nLet's walk through\
    \ the two functions shown in Listing 4-12:\n\n- When a cell on the game board\
    \ is clicked, it calls the gameCellClicked() method. The Knockout click binding\
    \ that is used for this automatically sends the data and the event objects as\
    \ part of the method. The data object in this case contains the current boardViewModel()\
    \ content. The event object is what you are really looking for though. You want\
    \ to know which game cell was clicked so you can set the appropriate image, and\
    \ then you want to create the JSON data for that cell so you can send it back\
    \ to the server and have your opponent's game board updated.\n\n- In the gameCellClicked()\
    \ method, the current player is set by getting the value of symbol from the viewmodel.\
    \ The values of the data-x and data-y attributes of the specific cell that was\
    \ clicked are gathered. All three of these values are sent to a function that\
    \ will format the values into the JSON object that your WebSocket endpoint expects.\
    \ This is done in the createJSON() method shown in Listing 4-12.\n\nNOTE\nIt would\
    \ be desirable to use the HTML5 dataset method to get the data-x and data-y values\
    \ in this function. If you were to use dataset, the code would look like this:\n\
    \n```javascript\n$(event.currentTarget).data('x')\n```\n\nThe reason this is not\
    \ done in this example is that the dataset HTML5 feature is not supported in all\
    \ browsers at the time of writing. Internet Explorer specifically did not support\
    \ this feature until IE 11 was released. Using a direct DOM call to get the attribute\
    \ will work with all browsers.\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_100_0.png)\n\
    \n- The createJSON() function returns the formatted JSON as a JSON object that\
    \ it can be used in the cellImage() function that you looked at earlier in Listing\
    \ 4-11.\n\n- Once the image and game status have been set properly, the JSON object\
    \ is converted to a string so it can be sent to the WebSocket endpoint using the\
    \ websocket.send() method. Remember that WebSocket data must be in either UTF-8\
    \ string format or a binary format of Blob or ArrayBuffer. Sending the actual\
    \ JSON object will result in a WebSocket protocol error.\n\n# Java EE and HTML5\
    \ Enterprise Application Development\n\nWhile the game code used for this chapter\
    \ does not make use of the Blob or ArrayBuffer binary data types, you may want\
    \ to know a little more about how they are used. Blob is the default binary data\
    \ type, and there is nothing special that you have to do to send data in this\
    \ format. Just pass in a Blob object as the argument to the send() method, just\
    \ as you would with a text string. The server code will need to check for the\
    \ type of the incoming message. Listing 4-13 shows a possible way of checking\
    \ for the message type and processing it appropriately.\n\n## Listing 4-13 Example\
    \ of Testing for Message Type\n\n```javascript\nif (message.type == 'utf8') {\n\
    \    console.log('Received Text Message: ' + message);\n    ... // do something\
    \ with the string\n} else if (message.type == 'binary') {\n    console.log('Received\
    \ Binary Message: ' + message.binaryData);\n    ... // do something more with\
    \ the binary data\n}\n```\n\nFrom the client side, you would need to provide some\
    \ method for gathering the binary data and then passing that data to a function\
    \ for processing and sending to the WebSocket connection. Listing 4-14 shows one\
    \ possible solution: using an input type of file and allowing the end user to\
    \ select a file and send it to the WebSocket.\n\n## Listing 4-14 Example of Client-Side\
    \ Code for Sending Data\n\n```javascript\ndocument.getElementById(\"binary\").addEventListener('change',\
    \ sendBinary, false);\nfunction sendBinary(evt) {\n    var file = evt.target.files[0];\n\
    \    socket.binaryType = \"arraybuffer\";\n    var reader = new FileReader();\n\
    \    reader.readAsArrayBuffer(file);\n    console.log('file.size: ' + file.size);\n\
    \    reader.onload = function(e) {\n        socket.send(e.target.result);\n  \
    \  };\n}\n```\n\nLet’s take a quick look at the code in 4-14:\n\n- The first line\
    \ is adding an event listener to an input element in the HTML markup. This input\
    \ element has an id attribute set to \"binary\".\n\n- When the event listener\
    \ detects a change that has happened to the input element, it will call the sendBinary()\
    \ function. This function uses the event object that the listener sent by default\
    \ to get the file that the end user selected.\n\n- The sendBinary() method then\
    \ sets the binaryType property of the WebSocket connection to be type of ArrayBuffer.\n\
    \n- At this point a FileReader object is created and the contents of the file\
    \ are read into it using the FileReader readAsArrayBuffer() method.\n\n- Finally,\
    \ the FileReader has completed the loading of the data, the data is sent over\
    \ the WebSocket.\n\n> NOTE\nShould be noted that the FileReader API is new to\
    \ HTML5 and is not implemented by all browsers. Specifically, Internet Explorer\
    \ 9 and any version of Safari older than 6.0 do not support it.\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_102_0.png)\n\
    \n# Summary\n\nIn this chapter you have learned about what the WebSocket protocol\
    \ is, and how the APIs for both Java and JavaScript are used to interact with\
    \ the WebSocket protocol on the server and in a pure client-side HTML5 application.\
    \ You have learned how to work with the Java API for JSON to read and generate\
    \ JSON objects on the server.\n\nOn the client side, you learned how to work with\
    \ String and JSON object data to manipulate the HTML DOM elements and interact\
    \ with the game board using the Knockout.js MVVM architectural pattern. One thing\
    \ that you may have noticed while either playing the game or reading all of the\
    \ Knockout observables in the boardViewModel() is that there is not a scoring\
    \ system implemented in the game. This omission is intentional. It is now up to\
    \ you to take what you have learned and add the client- and server-side code that\
    \ can store and manage the game state. The Knockout observables of win, lose,\
    \ and tie are already in place and ready for you to use with the gameStatus system\
    \ that is in place.\n"
  mdcn: "\n\n# 80 Java EE 与 HTML5 企业应用开发\n\n在为特定的游戏单元格设置图像时（如列表 4-11 所示），既可以从点击游戏单元格的玩家客户端设置，也可以从服务器设置显示对手刚刚选择的内容。这种方法必须处理这两种情况。这就是你使用\
    \ Knockout 视图模型（viewModel）大显身的地方。如果数据对象的 `symbol` 成员是玩家 X，那么视图模型的 `image` 属性（在\
    \ Knockout 术语中称为 observable）就应该是 X 的图像。然后你会将视图模型的 `symbol` 可观察对象设置为操作者的相反者。这是因为当前玩家的回合已结束，你正在为下个玩家做准备。现在，你将特定单元格的\
    \ `arc` 属性设置为该 X 或 Y 图像的位置。最后，需要更新状态以告知玩家：当可观察对象设置为“Wait wait”（等待中）时，将其切换为“Your\
    \ turn”（轮到你了）；否则，设置为“Please wait”（请稍候）。\n\n到为止，你已经熟悉了通过 `websocket.onmessage()`\
    \ 事件从服务器接收数据的流程。点击特定游戏单元格并将其发送到服务器，然后发送给对手的流程非常相似，但它起始于列表 4-12 中的 `gameCellClicked()`\
    \ 方法。\n\n## 列表 4-12 捕捉游戏单元格点击并发送数据\n\n```javascript\nfunction gameCellClicked(data,\
    \ event) {\n    var player = vm.symbol();\n    var json = createJSON(player, $(event.currentTarget).attr('data-x'),\
    \ $(event.currentTarget).attr('data-y'));\n    setCellImage(json);\n    send(JSON.stringify(json));\n\
    }\n\nfunction createJSON(symbol, x, y) {\n    var jsonData = \"\"\n    + \"\\\"\
    symbol\\\": \\\"\" + symbol + \"\\\",\"\n    + \"\\\"x\\\": \\\"\" + x + \"\\\"\
    ,\"\n    + \"\\\"y\\\": \\\"\" + y + \"\\}\";\n\n    return JSON.parse(jsonData);\n\
    }\n```\n\n让我们来看列表 4-12 显示的两个函数：\n\n- 当游戏棋板上的单元格被点击时，它会调用 `gameCellClicked()` 方法。用于此的\
    \ Knockout click 绑定会自动将数据和事件对象作为方法的一部分发送。在这种情况下，数据对象包含当前的 `boardViewModel()` 内容。\n\
    \n不过，你真正寻找的是事件对象。你想知道点击了哪个游戏单元格，以便设置相应的图像，然后你想为该单元格创建 JSON 数据，以便将其发送回服务器，并更新你对手的游戏棋板。\n\
    \n- 在 `gameCellClicked()` 方法中，通过从视图模型中获取 `symbol` 的值来设置当前玩家。收集了被点击的特定单元格的 `data-x`\
    \ 和 `data-y` 属性值。这三个值都会被发送到一个函数，该函数将这些值格式化为你的 WebSocket 端点所预期的 JSON 对象。这在列表 4-12\
    \ 所示的 `createJSON()` 方法中完成。\n\n注意\n在在此函数中，使用 HTML5 的 `dataset` 方法来获取 `data-x`\
    \ 和 `data-y` 值将是理想的。如果你使用 `dataset`，代码看起来像这样：\n\n```javascript\n$(event.currentTarget).data('x')\n\
    ```\n\n在本示例中没有这样做的原因是，在编写时并非所有浏览器都支持 HTML5 的 `dataset` 特性。特别是 Internet Explorer\
    \ 直到 IE 11 发布才支持此功能。使用直接的 DOM 调用来获取属性可以在所有浏览器中运行。\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_100_0.png)\n\
    \n- `createJSON()` 函数返回格式化后的 JSON 对象，该对象可以在你稍早在列表 4-11 中查看过的 `cellImage()` 函数中使用。\n\
    \n- 一旦图像和游戏状态被正确设置，JSON 对象将被转换为字符串，以便可以使用 `websocket.send()` 方法发送到 WebSocket 端点。记住，WebSocket\
    \ 数据必须是 UTF-8 字符串格式或 `Blob` 或 `ArrayBuffer` 的二进制格式。直接发送实际 JSON 对象将导致 WebSocket\
    \ 协议错误。\n\n# Java EE 与 HTML5 企业应用开发\n\n虽然本章使用的游戏代码没有使用 `Blob` 或 `ArrayBuffer`\
    \ 二进制数据类型，但你可能想多了解一些它们如何使用的信息。`Blob` 是默认的二进制数据类型，发送这种格式的数据不需要进行任何特殊操作。只需将 `Blob`\
    \ 对象作为参数传递给 `send()` 方法即可，就像传递文本字符串一样。服务器代码需要检查传入消息的类型。列表 4-13 显示了检查消息类型并恰当处理的可能方法。\n\
    \n## 列表 4-13 测试消息类型的示例\n\n```javascript\nif (message.type == 'utf8') {\n    console.log('Received\
    \ Text Message: ' + message);\n    ... // 对字符串进行操作\n} else if (message.type ==\
    \ 'binary') {\n    console.log('Received Binary Message: ' + message.binaryData);\n\
    \    ... // 对二进制数据进行更多操作\n}\n```\n\n在客户端侧，你需要提供一些方法来收集二进制数据，然后将该数据传递给函数进行处理并发送到\
    \ WebSocket 连接。列表 4-14 显示了一种可能的解决方案：使用类型为 `file` 的输入，允许用户选择文件并将其发送到 WebSocket。\n\
    \n## 列表 4-14 客户端发送数据的示例\n\n```javascript\ndocument.getElementById(\"binary\").addEventListener('change',\
    \ sendBinary, false);\nfunction sendBinary(evt) {\n    var file = evt.target.files[0];\n\
    \    socket.binaryType = \"arraybuffer\";\n    var reader = new FileReader();\n\
    \    reader.readAsArrayBuffer(file);\n    console.log('file.size: ' + file.size);\n\
    \    reader.onload = function(e) {\n        socket.send(e.target.result);\n  \
    \  };\n}\n```\n\n让我们快速查看 4-14 中的代码：\n\n- 第一行代码向一个输入元素添加事件监听器。该输入元素的 `id` 属性设置为\
    \ \"binary\"。\n\n- 当事件监听器检测到输入元素发生变化时，它将调用 `sendBinary()` 函数。该函数使用监听器默认发送的事件对象获取用户选择的文件。\n\
    \n- `sendBinary()` 方法将 WebSocket 连接的 `binaryType` 属性设置为 \"arraybuffer\"。\n\n-\
    \ 此时创建一个 `FileReader` 对象并使用 `readAsArrayBuffer()` 方法读取文件。\n\n- 最后，`FileReader`\
    \ 完成数据加载，数据通过 WebSocket 发送。\n\n> 注意\n应该注意，`FileReader` API 是 HTML5 的新特性，并非所有浏览器都实现。特别是\
    \ Internet Explorer 9 和 6.0 之前的任何 Safari 版本不支持它。\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_102_0.png)\n\
    \n# 总结\n\n在本章中，你学习了什么是 WebSocket 协议，以及 Java 和 JavaScript 的 API 如何在服务器和纯客户端 HTML5\
    \ 应用中与 WebSocket 协议交互。你学习了如何使用 Java 的 JSON API 在服务器上读取和生成 JSON 对象。\n\n在客户端，你学习了如何处理字符串和\
    \ JSON 对象数据以操作 HTML DOM 元素，并使用 Knockout.js MVVM 架构模式与游戏板交互。你在游戏或阅读 `boardViewModel()`\
    \ 中所有的 Knockout 可观察对象时，可能注意到游戏中没有实现评分系统。这种遗漏是有意为之的。现在轮你根据所学知识添加客户端和服务端的代码来存储和管理游戏状态。`win`、`lose`\
    \ 和 `tie` 的 Knockout 可观察对象已经就绪，供你配合现有的游戏状态系统使用。\n\n"
