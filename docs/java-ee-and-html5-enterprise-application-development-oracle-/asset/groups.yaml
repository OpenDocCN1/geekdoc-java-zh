    \ Wielenga\n\n# 引言\n\n市场上有很多书籍仅涵盖 Java Web 服务或仅涵盖 HTML5，但者未兼顾。因此，本书试图在两者之间寻找平衡：HTML\
    \ 开发者应该对他们连接的 Java Web 服务了解多少，以及 Java 开发者应该对那些消费并与 Web 服务交互的 HTML5 应用了解多少。\n\n\
    随着过去几年 JavaScript 的复兴，Java 开发者经常面临需要理解 HTML5 客户端应用如何交互并消费他们一直在创建的服务端 Web 服务的需求。同时，HTML5\
    \ 开发者经常发现他们需要理解应用程序所依赖的服务是如何构建和配置的。随着新的 HTML5 和 CSS3 规范引发行业大量关注，以及 AngularJS 和\
    \ Knockout 等新 JavaScript 库日益流行，一些 Java 开发者可能会怀疑自己的技能仍然适用。\n\n# 谁应该读这本书\n\n这本书对于以下开发者是理想的：他们发现自己不仅需要如何开发基于\
    \ Java EE 的 Web 服务（如 REST、SSE 和 WebSocket），还需要如何开发消费并与这些 Web 服务交互的 HTML5 。无论你是一个寻找\
    \ HTML5 应用如何连接到 服务的 Java 开发者，还是一个希望更好地了解服务端 Java EE 服务的 HTML5 开发者，本书都能满足你的需求。\n\
    \n# 本书涵盖内容\n\n本书涉及主题\n\n- Java EE 7 持久化 API (JPA)\n- Java EE 7 RESTful Web 服务\
    \ API (JAX-RS)\n- Java EE 7 WebSocket API\n- HTML5 规范的新特性\n- 通过 Knockout 的 JavaScript\
    \ 模型-视图-模型 (MVVM) 架构模式\n- REST、WebSocket 和服务端事件 (SSE) 的 JavaScript API\n- 通过 CSS3\
    \ 特性的响应式设计\n- 使用 SASS 进行 CSS 预处理\n- Web 应用的客户端和服务安全概念\n\n这些主题将在六章中涵盖：\n\n- 第一章“Java\
    \ EE 与 HTML5 企业级开发简介”提供了书中三个主要领域的概述：Java EE 7 Web 服务、HTML5 应用开发和 NetBeans IDE。\n\
    - 第二章“持久化”讨论了 Java 持久化 API (JPA)，并向你展示了持久化的核心概念以及如何使用 JPA 在关系数据库中创建、读取、更新和删除数据。\n\
    - 第三章“RESTful 资源”介绍了 REST（表述状态转移）作为全球网等分布式系统的架构风格。涵盖了 Java EE 7 RESTful Web 服务\
