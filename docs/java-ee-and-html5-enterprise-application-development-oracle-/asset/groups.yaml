    | <input type="search"/> | 输入值代表搜索 |

    | <input type="tel"/> | 输入值代表电话号码 |

    | <input type="url"/> | 输入值代表 URL |


    # 第 1 章：Java EE 与 HTML5 企业级开发简介 11


    # Java EE 与 HTML5 企业级应用开发


    HTML5 规范规定了每个浏览器可以以及如何实现它们在渲染时的行为。规范的意图是厂商能够为这些输入类型中的每一种提供用户界面。例如，如果浏览器渲染一个 `type`
    设置为 "Date" 的输入字段，用户将看到一个日期选择器来选择他们想要输入的日期。遗憾的是，这是目前浏览器厂商在功能上差异最大的领域之一。在移动设备上，体验更好。你经常发现，当你点击或触摸
    `type` 设置为 "number" 的输入字段时，你会得到一个数字小键盘而不是普通键盘，或者如果输入字段是 "url"，则会显示不同类型的键盘。


    ## HTML5 应用的组成部分


    关于 HTML5 应用最大的误解之一是它们仅由 HTML5 组成。事实上，在所有情况下，应用程序实际上至少由三个组件组成：HTML5、JavaScript
    和 级联样式表 (CSS)。通过结合 CSS 第 3 版本 (CSS) 的所有新媒体查询功能，你可以在不同的设备尺寸布局下显示相同的内容。这种修改内容以响应设备可用显示尺寸的方法被称为*响应式设计*（responsive
    design）；布局响应于它被渲染时的显示尺寸。


    关于响应式设计有几点重要的注意事项。首先，尽管它允许你创建一个在多个设备尺寸上具有相同外观和体验的网站，但 HTML5 仍然是在智能手机或平板电脑等较小设备上的网络浏览器中查看的网页。应用程序不会像为特定类型移动设备编写和编译的应用程序那样具有真正的“原生”外观和体验。其次，对于希望应用程序能够访问特定移动功能（如摄像头、联系人列表和日历）的开发者来说，HTML5
    和响应式设计可能不是标准答案。因为应用程序在网络浏览器中运行，你只能编写程序来使用浏览器允许你交互的内容。


    如前所述，HTML5 应用中常用的第三个组件是 JavaScript。JavaScript 架构库的引入是使其更容易被企业开发者接受的一个大因素。


    '
