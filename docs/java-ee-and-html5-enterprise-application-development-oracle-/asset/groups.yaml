    to access the requested resource. This allows the server to check if the user
    can invoke certain operations on your service. The servlet container typically
    defines the operations that can be performed.


    +   - Confidentiality ensures that only the authorized recipients can access the
    information. This concept is similar to authorization, the key difference being
    authorization prevents the information from reaching unintended parties, confidentiality
    ensures that even if the information does reach unintended parties, confidentiality
    ensures it cannot be viewed or used.


    +   - Data integrity ensures that the information has not changed while in transit
    between the client and server. A hashcode, or signature of the data, is sent along
    with the data and confirmed on the receiving side.


    Let''s take a look at how these concepts can be realized in a Java EE container.
    After that, we''ll turn our attention to REST resource security and WebSocket
    security.


    # Authentication


    There are different ways to achieve authentication; the first two types listed
    next are from the RFC 2617 draft standard:


    +   - Basic Authentication This is the simplest method of authentication over
    HTTP. The client, most often a web browser, opens a login box prompting the user
    to enter a username and password. The client then sends a base64-encoded username
    and password to the service. The server then checks if the user account exists
    and verifies the sent password. If the username and password match those of the
    account, then the response is made available; otherwise, an HTTP 401 response
    code is returned to the client, informing the client that it is not authorized
    to access the resource.'
