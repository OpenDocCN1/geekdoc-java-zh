  - '[PAGE 92]


    # JavaScript API for WebSocket


    You''ve learned how to create and interact with the Java API for WebSocket on
    the server side, now let''s take a look at how that same WebSocket service can
    be consumed and interacted with from the client side.


    # WebSocket Initialization


    When the websocket.js file is loaded, the initialization of the WebSocket connection
    is attempted as shown in Listing 4-8.


    # Listing 4-8 WebSocket Endpoint Initialization


    ```

    var host = window.location.host;

    var wsUri = "ws://" + host + "/TicToe/endpoint";

    var websocket = new WebSocket(wsUri);

    var output = document.getElementById("output");

    ```


    You''ll notice that the URL for the WebSocket endpoint is a reference to the endpoint
    that you set up during your work with the Java API for WebSocket. While you can
    set the URL directly to the service in your final production code, it''s a good
    idea to set up the URL dynamically when you are in development. The reason for
    this is more about testing than about development. When you run the code from
    the IDE, it will usually load with localhost as your local development machine.
    However, if you hard-code the endpoint URL to localhost, you will have trouble
    connecting to the web application from some other device for testing. By getting
    the current hostname from the browser''s window object, you can connect from any
    device on the same network for testing. As an example, if you run the tic-tac-toe
    game from your local machine, it will show up in the browser at http://localhost:8080/TicToe/.
    However, if you connected to the same web app from a tablet that is connected
    to the same wireless network, you would have to do something like http://<ip address
    of dev machine>:8080/TicTacToe.


    Using the code in Listing 4-8 will connect using whichever hostname you join the
    game.


    # WebSocket Control Methods


    Just as working with the Java API for WebSocket, you have five different methods
    available in the JavaScript API:


    +   * open()

    * onmessage()'
