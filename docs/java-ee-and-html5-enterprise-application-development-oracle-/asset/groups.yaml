    >Date</label>\n  <div class=\"col-md-9\">\n    <input id=\"bookPublishedDate\"\
    \ type=\"text\" class=\"form-control\" placeholder=\"mm-dd-yyyy\"/>\n  </div>\n\
    </div>\n<div class=\"form-group\">\n  <label class=\"control-label col-md-3\"\
