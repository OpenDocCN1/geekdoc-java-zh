    本章解释了关键的 REST 原则，以及如何在 Java 中发布和调用 REST 服务。\n\n# REST 原则\n\n万维网（World Wide Web）是符合\
    \ REST 架构风格的最大系统。在这种背景下，REST 是一组原则，定义了如何使用 HTTP 和 URL 等网络标准来构建您的应用程序。要成功构建利用 Web\
    \ 标准的 Java 应用程序，您需要理解 REST 架构的指导原则。这些原则将在您定义资源和设置服务时指导您。\n\nREST 架构的指导原则是：\n\n\
    - **资源（Resource）**：架构中的关键信息是资源。任何可以命名为资源的信息：文档或图像、书本、作者、其他资源的集合等。\n- **客户端和服务器（Client\
    \ and server）**：使用客户端-服务器模型，客户端向服务器发起请求；服务器处理请求并向客户端返回适当的响应。请求和响应围绕资源的传输而构建。\n\
    \n# 第3章：RESTful 资源\n\n- **资源识别（Identification of resources）**：每个资源在客户端和服务器上都有唯一标识。Web\
    \ 上的一切都可以被识别为资源，每个资源都可以通过 URI 唯一标识。\n- **资源有多种表示形式（Resources are available in\
    \ multiple representations）**：资源可以通过媒体类型以多种格式表示。客户端和服务器可以对资源的内容类型进行协商。\n- **可以使用标准方法操作这些资源（Standard\
    \ methods can be used to manipulate these resources）**：可以使用标准方法创建、读取、更新和删除每个资源。使用\
    \ GET、PUT、POST 和 DELETE 等 HTTP 动词在 Web 上无状态地操作资源。\n- **通信（Communicate）**：服务器不会为任何客户端保留单个请求之外的通信状态。如果需要状态，则应保留在客户端或转换为资源状态。这允许服务器具有更好的扩展性。\n\
    \n随着本章的继续，您将看到这些原则是如何应用于 Java REST API 的，以及在第5章 JavaScript REST API 中的应用。\n\n\
