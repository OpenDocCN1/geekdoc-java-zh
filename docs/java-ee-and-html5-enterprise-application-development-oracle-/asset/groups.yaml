    to the current object so that the same object can still be referenced no matter
    how the function is called later in your.


    +   self.serviceURL = serviceRootURL + "/books"; This line sets up the URL that
    will be used to make the actual REST API call. Since all of the REST API calls
    have the same hostname and application path, a global variable has been set to
    contain the part of the URL that is always the same. One thing to keep in mind
    while working with REST service calls in development mode is that the hostname
    may vary as you test your code from different devices. For example, using "localhost"
    as the hostname will work fine for any browser that would use to connect to the
    REST service that you are running on the same machine. However, if you were to
    test your code from say, a tablet and connect to the IP address of your development
    machine, the JavaScript call to "localhost" would fail. For this reason, you will
    see at the top of the sample application code that the serviceHostname variable
    is being set to serviceHostname = window.location.hostname; and the final serviceRootURL
    variable is created using this dynamic value.


