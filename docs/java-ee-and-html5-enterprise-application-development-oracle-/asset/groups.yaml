    response="21c29c7a7c760e5c39ba46637ad4313aa

    opaque="00000000000000000000000000000000"

    ```


    Many of the security options in Digest Authentication are optional so the server
    may operate in a security-reduced mode. Even though it is slightly better than
    Basic Authentication, it is not intended to replace stronger authentication protocols,
    like client-cert. Like Basic Authentication, Digest Authentication is also susceptible
    to man-in-the-middle attacks. These types of attacks can be avoided by using HTTPS
    instead of HTTP.


