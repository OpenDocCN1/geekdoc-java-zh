  - "[PAGE 56]\n\n# Schema Generation\n\nTypically, the database schema is already\
    \ defined and JPA entity classes can be generated from that. Alternatively, entity\
    \ managers can be configured to generate database table definitions in an existing\
    \ schema or table generation scripts by specifying javax.persistence.schema-generation.*\
    \ properties in persistence.xml.\n\nListing 2-7 shows how these properties can\
    \ be configured on an entity manager.\n\n+   Listing 2-7 Generating Schema Using\
    \ persistence.xml\n\n```\n<persistence version=\"2.1\" xmlns=\"http://www.jcp.org/xml/ns/\n\
    persistence xmlns=\"http://www.w3.org/2001/XMLSchema-instance\"\nsi:noNamespaceLocation=\"\
    http://www.jcp.org/xml/ns/persistence http://www.jcp.org/xml/ns/persistence_2_1.xsd\"\
    >\n  <persistence-unit name=\"authorPU\" transaction-type=\"JTA\">\n  <properties>\n\
    \    <property name=\"javax.persistence.schema-generation.\ndatabase.action\"\
    \ value=\"drop-and-create\"/>\n    <property name=\"javax.persistence.schema-generation.\n\
    create-script\" value=\"script\"/>\n    <property name=\"javax.persistence.schema-generation.\n\
    drop-source\" value=\"script\"/>\n    <property name=\"javax.persistence.schema-generation.\n\
    create-script-source\" value=\"META-INF/create.sql\"/>\n    <property name=\"\
    javax.persistence.schema-generation.\ndrop-script-source\" value=\"META-INF/drop.sql\"\
    />\n    <property name=\"javax.persistence.sql-load-script-\nsource\" value=\"\
    META-INF/load.sql\"/>\n  </properties>\n</persistence-unit>\n</persistence>\n\
    ```\n\nThe following list explains these properties: javax.persistence.schema-generation.database\n\
    \n+   The javax.persistence.schema-generation.database\naction property value\
    \ specifies to drop the existing tables and\ncreate them again. The possible values\
    \ are none, create, drop-\nand create, drop."
  - '[PAGE 57]


    +   The javax.persistence.schema-generation.create-source property value specifies
    that the database creation should occur on the basis of the scripts.


    +   The javax.persistence.schema-generation.drop-source property value specifies
    that the database deletion should occur on the basis of the scripts.drop-source
    property value specifies that the database deletion should occur on the basis
    of the scripts.


    The possible values for the preceding two properties are metadata, script, metadata-then-script,
    and script-then-metadata. In this case, either script or metadata specified on
    the entity or a combination is used to create or drop tables.


    +   The javax.persistence.schema-generation.create-script-source property value
    specifies the location of the database creation script.


    +   The javax.persistence.schema-generation.drop-script-source property value
    specifies the location of the database deletion script.


    +   The javax.persistence.sql-load-script-source property value specifies the
    location of SQL bulk load script.


    The last three property values specify that the script is packaged with the application.
    In this case, the location of the script is specified relative to the root of
    the persistence unit. Alternatively, a URL may externally identify the scripts.


    These properties enable generation of the database schema from scripts or entity
    metadata. In addition to the properties described previously, the following properties
    may be used to specify the generation of scripts:


    +   javax.persistence.schema-generation.scripts.action can be used to specify
    which scripts need to be generated. The possible values are none, create, drop-and-create,
    and drop.


    +   javax.persistence.schema-generation.scripts.create-target and javax.persistence.schema-generation.scripts.drop-target
    can be used to specify the location of create and drop scripts. The locations
    are specified as strings corresponding to file URLs.'
- md: "\nJPA provides several annotations such as @javax.persistence.Index, @javax.persistence.ForeignKey,\
    \ @javax.persistence.CollectionTable, @javax.persistence.JoinTable, and @javax.persistence.JoinColumn\
    \ that can be specified on an entity to facilitate database or scripts generation.\n\
    \nNetBeans IDE provides a wizard that simplifies the generation of scripts based\
    \ upon metadata. In the IDE, right-click your application and choose New | Other\
    \ | Persistence | DB Scripts for Entity Classes to generate the scripts.\n\nThe\
    \ Java Persistence API also provides a mechanism for second-level caching, optimistic\
    \ and pessimistic locking, entity lifecycle listeners, and many more advanced\
    \ concepts.\n\n# Summary\n\nThis chapter described the key concepts of persistence\
    \ and explained how data can be created, read, updated, and deleted from relational\
    \ database tables using JPA. It also looked at how relational database tables\
    \ can be easily mapped to JPA entities, and it presented the requirements around\
    \ their packaging. Different types of Enterprise JavaBeans were introduced and\
    \ their transactional nature was explained briefly. Finally, this chapter demonstrated\
    \ how the database tables can be easily generated using the properties defined\
    \ in persistence.xml. NetBeans IDE tools and wizards were shown throughout the\
    \ chapter to highlight the simplified development process. The next chapter will\
    \ take these JPA entities and publish them as RESTful endpoints.\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_59_0.png)\n\
    \n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_60_0.png)\n\n# CHAPTER 3\n\n# RESTful\
    \ Resources\n\n# Java EE and HTML5 Enterprise Application Development\n\nREST,\
    \ or Representational State Transfer, is an architectural style for distributed\
    \ systems as the Web. This term was originally introduced and defined in 2000\
    \ by Roy Fielding in his dissertation Architectural Styles and the Design of Network-based\
    \ Software Architectures. Fielding's motivation for choosing the dissertation\
    \ topic was his \"desire to understand and evaluate the architectural design of\
    \ network-based application software through principled use of architectural constraints,\
    \ thereby obtaining the functional, performance, and social properties of an architecture.\"\
    \ See www.ics.uci.edu/~ffield/pubs/dissertation/introduction.htm. This was achieved\
    \ by defining a framework to understand the architecture of network-based applications.\
    \ The thesis then describes how REST is used to guide the design and development\
    \ of the architecture for the modern Web.\n\nModern applications typically publish\
    \ their APIs using REST API is published at https://dev.twitter.com/docs/api.\
    \ Integrating any Twitter functionality, such as searching for tweets with a particular\
    \ hashtag or obtaining a collection of the most recent tweets, can be accomplished\
    \ by invoking the Twitter REST API and processing the result in your application.\n\
    \nThis chapter explains the key REST principles and how REST services can be published\
    \ and invoked from Java.\n\n# REST Principles\n\nThe World Wide Web is the largest\
    \ implementation of a system conforming to the REST architectural style. In that\
    \ context, REST is a set of principles that defines how web standards, such as\
    \ HTTP and URLs, are supposed to be used for building your applications. To successfully\
    \ build Java applications that utilize web standards, you'll need to understand\
    \ the guiding principles of REST architecture. These principles will guide you\
    \ as you define resources and set up services.\n\nThe guiding principles of REST\
    \ architecture are:\n\n- **Resource**: The key information in this architecture\
    \ is a resource. Any information that can be named as a resource: a document or\
    \ image, a book, an author, a collection of other resources, and so on.\n- **Client\
    \ and server**: A client-server model is used where a client initiates a request\
    \ to the server; the server processes the request and returns an appropriate response\
    \ to the client. Requests and responses are built around the transfer of resources.\n\
    \n# Chapter 3: RESTful Resources\n\n- **Identification of resources**: Every resource\
    \ is uniquely identified on the client and server. Everything on the Web can be\
    \ identified as a resource, and each resource can be uniquely identified by a\
    \ URI.\n- **Resources are available in multiple representations**: A resource\
    \ can be represented in multiple formats, by a media type. The client and server\
    \ can negotiate on the content type of the resource.\n- **Standard methods can\
    \ be used to manipulate these resources**: Each resource can be created, read,\
    \ updated, and deleted using standard methods. HTTP verbs such as GET, PUT, POST,\
    \ and DELETE to manipulate resources stateless on the Web.\n- **Communicate**:\
    \ The server does not retain any communication state for any of the clients beyond\
    \ a single request. If state is required, then it should be kept on the client\
    \ or converted into resource state. This allows the server to scale much better.\n\
    \nYou will see how each of these principles is used with the Java API for REST\
    \ as you continue in this chapter, and with the JavaScript API for REST Chapter\
    \ 5.\n\n# Java API for RESTful Web Services\n\nJava API for RESTful Web Services\
    \ (JAX-RS) defines a standard, annotation-driven API that helps developers develop\
    \ and invoke a RESTful web service in Java. JAX-RS 1.1 was first included in the\
    \ Java EE 6 platform. Java EE 7 includes JAX-RS 2.0, which is a deep revision\
    \ of JAX-RS that adds several features that can handle the most modern style of\
    \ web applications.\n\nLet's consider a REST resource that provides create, read,\
    \ update, and delete operations on an author database. Such a REST resource can\
    \ be invoked using any of the standard HTTP verbs such as POST, GET, PUT, or DELETE.\
    \ The endpoint should have the capability to publish and consume resource representations\
    \ in multiple formats. A complete list of authors or a specific author should\
    \ be accessible. A REST endpoint that publishes and consumes multiple representations\
    \ of the author resource using common HTTP verbs is shown in Listing 3-1.\n\n\
    # Listing 3-1 Author REST Resource\n\n```\n@Path(\"authors\")\npublic class AuthorResource\
    \ {\n    @Inject AuthorBean bean;\n\n    @GET\n    @Produces({\"application/xml;qs=0.75\"\
    ,\"application/json;qs=1\"})\n    public List<Author> findAll() {\n        return\
    \ bean.findAllAuthors();\n    }\n\n    @GET\n    @Path(\"{id}\")\n    @Produces({\"\
    application/xml;qs=0.75\",\"application/json;qs=1\"})\n    public Author find(@PathParam(\"\
    id\") Integer id) {\n        return bean.findAuthor(id);\n    }\n\n    @GET\n\
    \    @Path(\"count\")\n    @Produces(\"text/plain\")\n    public int count() {\n\
    \        return bean.countAuthors();\n    }\n\n    @POST\n    @Consumes({\"application/xml\"\
    ,\"application/json\"})\n    public void create(Author author) {\n        bean.createAuthor(author);\n\
    \    }\n\n    @PUT\n    @Consumes({\"application/xml\",\"application/json\"})\n\
    \    public void edit(Author author) {\n        bean.updateAuthor(author);\n \
    \   }\n\n    @DELETE\n    @Path(\"{id}\")\n    public void remove(@PathParam(\"\
    id\") Integer id) {\n        bean.removeAuthor(id);\n    }\n}\n```\n\nJava EE\
    \ and HTML5 Enterprise Application Development\n\nThe following information will\
    \ help you to understand this code:\n\n- A POJO can be converted to a REST resource\
    \ by adding @javax.ws.rs.Path annotation to the class. The annotation defines\
    \ the URI where the resource is accessible—authors in this case. Paths are relative.\
    \ For an annotated class, the base URI is defined using @javax.ws.rs.ApplicationPath\
    \ annotation on a class that extends javax.ws.rs.core.Application class. The complete\
    \ URI of the resource is defined as:\n\n```\nhttp://<host>:<port>/<webapp-context>/<base-URI>/<resource-URI>\n\
    ```\n\nSo if the resource is packaged in a WAR file with the context root सहारा\
    \ and deployed on the host \"localhost\" and the port \"8080\" with the base URI\
    \ \"webresources,\" then the complete path of the resource would be\n\n```\nhttp://localhost:8080/sahara/webresources/authors\n\
    ```\n\n- A subresource of the main resource can be defined by annotating a method\
    \ of the root resource with @javax.ws.rs.Path annotation. The base URI of this\
    \ subresource is the effective URI of the containing class. The annotated method\
    \ is invoked whenever the resource is accessed using the complete path defined\
    \ by the base URI and the path specified on the method. In Listing 3-1, the count\
    \ () method is called if the resource is accessed at the webresources/authors/count\
    \ path. Note that the count () method is also annotated with @javax.ws.rs.GET\
    \ annotation, but it is available at a different path because it is defined as\
    \ a subresource.\n\n- In addition, although not shown in Listing 3-1, cookies\
    \ can be bound to a parameter using @javax.ws.rs.CookieParam annotation, HTTP\
    \ headers can be bound to a parameter using @javax.ws.rs.PathParam annotation,\
    \ a matrix parameter can be bound\n"
  mdcn: "\n\nJPA 提供了多种注解，例如 @javax.persistence.Index、@javax.persistence.ForeignKey、@javax.persistence.CollectionTable、@javax.persistence.JoinTable\
    \ 和 @javax.persistence.JoinColumn，可以在实体上指定这些注解，以方便数据库或脚本的生成。\n\nNetBeans IDE 提供了一个向导，可以简化基于元数据的脚本生成。在\
    \ IDE 中，右键点击您的应用程序并选择 New | Other | Persistence | DB Scripts for Entity Classes\
    \ 来生成脚本。\n\nJava 持久化 API（Java Persistence API）还提供了二级缓存、乐观和悲观锁、实体生命周期监听器等许多高级概念。\n\
    \n# 总结\n\n本章描述了持久化的核心概念，并解释了如何使用 JPA 从关系型数据库表中创建、读取、更新和删除数据。它还研究了如何轻松将关系型数据库表映射到\
    \ JPA 实体，并介绍了关于它们打包的get。介绍了不同类型的企业级 Java Bean（Enterprise JavaBeans）并简要解释了它们的事务性质。最后，本章演示了如何使用\
    \ persistence.xml 中定义的属性轻松生成数据库表。整个章节都展示了 NetBeans IDE 工具和向导，以突出简化的开发流程。下一章将采用这些\
    \ JPA 实体并将它们发布为 RESTful 端点。\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_59_0.png)\n\
    \n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_60_0.png)\n\n# 第3章\n\n# RESTful 资源\n\
    \n# Java EE 和 HTML5 企业级应用开发\n\nREST或表表示状态转移（Representational State Transfer）是\
    \ Web 等分布式系统的架构风格。该术最初由 Roy Fielding 在他2000年的毕业论文《架构风格与网络软件架构的设计》中引入并定义。Fielding\
