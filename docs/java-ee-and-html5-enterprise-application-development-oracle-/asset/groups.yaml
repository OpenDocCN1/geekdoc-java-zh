    \ information, the managed entities, and optional metadata that defines the mapping\
    \ of the entities to the database are together packaged as a persistence unit.\
    \ A persistence unit is defined by a *persistence.xml* file and packaged within\
    \ a WAR file. Listing 2-2 shows a *persistence.xml* file.\n\n**Listing 2-2** Sample\
    \ persistence.xml File\n\n```\n<xml version=\"1.0\" encoding=\"UTF-8\"?>\n<persistence\
