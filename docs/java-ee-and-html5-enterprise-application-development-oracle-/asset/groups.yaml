  - "[PAGE 150]\n\n# Chapter 6: HTML5 and Java Application Security 131\n\nmake sure\
    \ your website isn't susceptible to the XSS types of attack described in the previous\
    \ section. If it is susceptible to XSS attacks, then anything you do to try and\
    \ prevent CSRF attacks is meaningless.\n\nTo implement any kind of CSRF prevention\
    \ in an HTML5 client-side application, you need to work in conjunction with what\
    \ is being done on the server side of your application. The technique that you\
    \ use to prevent CSRF is called double-spending cookies. This technique involves\
    \ reading the session ID from the cookie that was sent from the web page was first\
    \ requested. Using JavaScript, you place that same session ID into a hidden field\
    \ in all of the forms in your application, and attach it to any AJAX call that\
    \ makes your application back to the server. When sending the session ID value\
    \ back to the server, it's often referred to as a CSRF token.\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_150_0.png)\n\
    \n> Never set a CSRF token on an AJAX call that uses the method type of GET. Doing\
    \ so will potentially expose the CSRF token in many different places (server logs,\
    \ browser logs, network monitors, and so forth).\n\nUsing code similar to that\
    \ in Listing 6-4 will allow you to echo the current session ID back to the server,\
    \ which will then check to make sure it matches the session ID in the cookie.\
    \ Using this technique makes it extremely unlikely that the server will receive\
    \ from another website a request that has both the proper session cookie and the\
    \ same session ID in a hidden form element.\n\n# Listing 6-4 CSRF Hidden Form\
    \ Token\n\n```\n<form action=\"servlet/formsubmission\" method=\"post\">\n  <input\
    \ type=\"hidden\" name=\"CSRFToken\" value=\"secret_key\">\n</form>\n<script>\n\
    \  document.getElementById('csrf').setAttribute('value',\n  getCookie('Session'));\n\
    </script>\n```\n\nAs you can see, the real solution to prevent CSRF attacks has\
    \ to start at the server, but as a client-side developer, you can also do your\
    \ part to protect against such attacks."
  - "[PAGE 151]\n\n# Clickjacking\n\nClickjacking is another type of attack against\
    \ which you must protect your HTML5 web application. For a clickjacking attack\
    \ to succeed, the attacker must first manage to wrap a web page from your application\
    \ inside of a frame, or `<iframe>`, of some kind on a website that the hacker\
    \ has created. The hacker creates a series of stacked transparent layers over\
    \ the top of the website that the hacker created, which appears to be a normal\
    \ website. When a website visitor thinks they are clicking buttons or links on\
    \ your website and clicking a button that is not visible. Back in 2009, Chris\
    \ Shlett described an attack of this kind (http://shiflett.org/blog/2009/feb/twitter-dont-click-exploit)\
    \ that used a Twitter page as the transparent overlay. When an end user clicked\
    \ the \"Don't Click\" button, they were actually clicking the Post of the hidden\
    \ Twitter page and sending out a tweet devised by the attacker.\n\nAs most with\
    \ these kinds of attacks, the best way to defend against clickjacking is to do\
    \ so from the server side. In the case of clickjacking, the server-side defense\
    \ is to use the X-Frame-Options response header to deny all types of frames or\
    \ to only frames from the same domain. However, there is one coding practice that\
    \ you can use on the client side to protect your application from clickjacking.\n\
    \nIf you cannot modify the response headers from the server side, or you need\
    \ to support older browser versions that don't understand the X-Frame-Options\
    \ header, you can add the piece of code shown in Listing 6-5 to the <head> element\
    \ of your pages to help protect against clickjacking attacks. This concept comes\
    \ from Jason Li at Aspect Security and is discussed here: https://www.codemagi.com/blog/post/194.\n\
    \n+   Listing 6-5 Anti-clickjacking Example\n\n```\n<head>\n<style id=\"antiClickjack\"\
    >body{display:none !important;}</style>\n<script type=\"text/javascript\">\n \
    \ if (self === top) {\n    var antiClickjack = document.getElementById(\"antiClickjack\"\
    );\n    antiClickjack.parentNode.removeChild(antiClickjack);\n  } else {\n   \
    \ top.location = self.location;\n  }\n</script>\n...\n</head>\n```"
  - '[PAGE 152]


    # Chapter 6: HTML5 and Java Application Security 133


    Adding a <style> element to the top of your page enables the script that immediately
    follows it to know it''s referencing your page. If you were to use only the else
    part of the code by itself, the expression could be defeated through multiple
    kinds of workarounds. With the code in Listing 6-5, the script looks for the antiClickjack
    <style> element, and if it''s not already the top layer, it moves to the top.
    This is the OWASP-recommended method for preventing clickjacking attacks from
    the client side.


    # Authentication and Authorization


    Probably the most obvious security issue when developing an HTML5 web application
    is how to handle your application login. None of the coding examples presented
    thus in this book have included a login process, but if your application is going
    to store information that is specific to a user and/or information that will help
    make the user''s current visit to your application more enjoyable, then you will
    want to build some form of authentication into your application.


    The common method of authentication used for JavaScript applications is the OAuth
    standard. OAuth is an open standard for authentication. In 2006, a few developers
    from Twitter and Magnolia put together the concept for OAuth. Through the work
    of a small group of developers over the next year, a draft proposal for the OAuth
    standard was developed, in a final draft that was released in October of 2007.
    In 2008, the OAuth specification was brought in front of a group of developers
    at the Internet Engineering Task Force (IETF) annual meeting for work on further
    standardization.


    The OAuth 1.0 protocol was released in April 2010 as IETF RFC 5849. The OAuth
    standard is now the required authentication protocol for many leading web service
    APIs, such as Twitter, Flickr, Netflix, and others. The OAuth 2.0 specification
    was released as RFC 6749 in 2012. Although it is slowly gaining popularity across
    the Internet, many controversies arose throughout its development. Some of the
    original developers of the OAuth 1.0 protocol have resigned from the project because
    of disagreements over its direction and policies. To decide which of the two protocols
    to use in your specific situation, you will need to conduct further research on
    your own. It''s safe to say that if your application needs to support direct authentication,
    you should start with the OAuth protocol.'
  - '[PAGE 153]


    # 134 Java EE and HTML5 Enterprise Application Development


    Without getting into the technical details of the protocol, OAuth enables a client
    application, often a web application, to act on behalf of a user, with the user''s
    permission. The main components of OAuth 2.0 are


    +   * Client

    * Authorization server

    * Resource server

    * Resource owner


    The resource owner is an entity that can grant access to a protected resource.
    The client is the application that makes the access request on behalf of the resource
    owner. A client performs actions on a resource server based on authorization provided
    by the user at the authorization server. For example, a user can access images
    on www.flickr.com (resource server) via a web browser (client) by signing in to
    Flickr using their Google Account (where www.google.com is the authorization server).
    The advantage of this approach, as opposed to the user does not have to create
    and remember multiple logins and passwords. Instead, the client obtains a *bearer
    token* from the authorization server, with the user''s approval, and stores it.
    Then, when the resource needs to be accessed at the resource server, the client
    sends a special HTTP header in the following format:


    ```

    Authorization: Bearer <token_value>

    ```


    The token value is opaque to the client but can be decoded by a resource server
    so that the server can check that the client, on the user''s behalf, has permission
    to access the resource.


    If your application is going to be used as part of a larger enterprise environment
    that requires user authentication, then your application probably does not need
    to provide separate authentication. If you do need to include some of authentication
    in your application, there are plenty of libraries in different languages by different
    authorization servers and resource providers that provide OAuth support. It''s
    worth looking them before deciding on your security infrastructure.


    In a typical enterprise environment, your application will be part of a larger
    application server installation. This application server will do the authentication
    for your application, and the user will not get to your application''s pages until
    they have already been authenticated by the'
- md: "\n# Chapter 6: HTML5 and Java Application Security 135\n\napplication server's\
    \ methods. This is also where the concept of authorization comes into play. Once\
    \ the application server, or the identity management system that the application\
