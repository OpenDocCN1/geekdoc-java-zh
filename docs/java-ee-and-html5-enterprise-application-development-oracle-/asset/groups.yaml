    # Java API for RESTful Web Services


    Java API for RESTful Web Services (JAX-RS) defines a standard, annotation-driven
    API that helps developers develop and invoke a RESTful web service in Java. JAX-RS
    1.1 was first included in the Java EE 6 platform. Java EE 7 includes JAX-RS 2.0,
    which is a deep revision of JAX-RS that adds several features that can handle
    the most modern style of web applications.


