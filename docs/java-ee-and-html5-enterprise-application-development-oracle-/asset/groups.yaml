    ## Chapter 6: HTML5 and Java Application Security


    XSS occurs when a web application incorporates user input into the output that
    it generates without properly validating or encoding the input. Data coming from
    the end user (for example, form input) or from a data connection (for example,
    a REST service) is considered untrusted data. You didn''t create the data as part
    of your application, so you can''t verify that it came from a trusted source.
    It''s untrusted data that you have to guard against.


    The best way to understand XSS is to look at some examples. Although the focus
    of this section is client-side security, server-side XSS attacks are the easiest
    to understand, so a couple of examples of server-side XSS attacks are provided
    next, followed by a client-side example.


    For the first example, assume that you''ve decided to create a custom error page
    for a 404 (file not found) error. When someone types in a URL similar to


    ```

    http://my.website.com/not-here

    ```


    the error page returns a message stating that the file not-here could not be found
    on the server. The XSS vulnerability occurs if the data displayed in the error
    message is not escaped before it''s read by the browser, in which case an attacker
    could do something like this:


    ```

    http://my.website.com/<script>alert("TEST")</script>

    ```


    The browser would execute the <script> when it parsed the data to display it as
    part of the error message.


    For the second example, assume that your web application has a search box. When
    a user conducts a search, the results of the search are displayed on a separate
    results page. The XSS vulnerability occurs if the page uses the common pattern
    of displaying "x number of results found for: <what was searched for>" and does
    not perform proper encoding of the search string. If a malicious user enters a
    search string similar to the <script> block in the previous example, the JavaScript
    will be executed when the search results page is loaded in the browser.


    Both of the preceding examples would normally be managed on the server side, because
    the error page and the search results page would normally be generated on the
    server. As previously mentioned, the third kind of XSS attack is purely client
    side and deals with how JavaScript handles the execution of DOM elements.


    To demonstrate how a DOM-based XSS attack works, we will use a similar example
    to the previous search field example. Suppose your HTML5 application has a form
    that includes an input field requesting the user''s username. The form also includes
    a `<div>` element that will be updated to show the content of whatever the user
    typed into the input field when the user presses the ENTER key. Listing 6-1 shows
    the code for this example.


    ### Listing 6-1 Form Example


    ```

    <label id="nameLabel" for="userName">User name: </label>

    <input id="userName" autocomplete="off"/>


    <div id="user"></div>

    ```


    You want to set the contents of this `<div>` element to the value of the string
    entered into the username input field. Doing this with plain JavaScript may look
    something like Listing 6-2.


    ### Listing 6-2 innerHTML Example


    ```javascript

    document.getElementById("user").innerHTML = document.getElementById("userName").value;

    ```


    The code in Listing 6-2 will work just fine. However, by using the `.innerHTML`
    attribute of the `<div>` element, you have opened yourself up to a DOM-based XSS
    attack. If a malicious user were to enter a string that looked something like


    ```

    <div onmouseover="javascript:alert(''failed!'')">XSS Test</div></div>

    ```


    the HTML would be added to the DOM as written, and the next time someone moves
    their mouse over the new `<div>` element, the JavaScript would be executed.


    There are certain DOM attributes and methods that you should avoid working with
    untrusted data. A partial list includes:


    - element.innerHTML

    - document.write()

    - document.writ()

    - javascript.eval()

    - element eventHandlers

    - setTimeout

    - setInterval

    - new function ()


    In general, if you are working with untrusted data, set up your HTML so you can
    use the element''s `.textContent` method, as shown in Listing 6-3, instead of
    trying to add HTML directly.


    ### Listing 6-3 textContent Example


    ```javascript

    document.getElementById("user").textContent = document.getElementById("userName").value;

    ```


    If you absolutely have to allow untrusted data into a context that can be executed
    by either JavaScript or the HTML parser, then you should learn how to use one
    of the many HTML and JavaScript encoders that are available. You could try to
    use an encoder yourself, but doing so can be tricky because each browser''s JavaScript
    engine can handle things a little bit differently. You are better off using an
    encoder that has been developed by a trusted security team, such as the Enterprise
    Security API (ESAPI) that is available from the Open Web Application Security
    Project (OWASP) team.


    You should also be aware that using a JavaScript framework like jQuery poses the
    same issue. Using code as such


    ```javascript

    $(''#user'').html($(''#userName'').val());

    ```


    will open the same XSS attack vector as `.innerHTML`. If you are using jQuery,
    make sure you use `.text` instead of `.html`:


    ```javascript

    $(''#user'').text($(''#userName'').val());

    ```


    ![](img/6d0f4c34e63ae3ea4485e31eaa5072)


    ## Java EE and HTML5 Enterprise Application Development


    ### Cross-Site Request Forgery


    Attacks that exploit the cross-site request forgery (CSRF) security vulnerability
    are uncommon because they are successful only under a very limited set of conditions.
    However, if you don''t take some measures to guard against XSS, you are exposing
    your website visitors to a potentially nasty result.


    A good way to explain the CSRF attack is to use an example of a banking website.
    Let''s call the website megabank.com. When you log into your account on this bank
    website, the login stores a session cookie in your browser. This is a perfectly
    normal and acceptable practice for a banking website. The CSRF vulnerability exists
    if you leave the website without first logging out. Your browser still has that
    session cookie in its cache until the cookie expires. The expiration of the session
    cookie is set by the megabank.com website and in most cases will expire 15 minutes
    after the last activity. This expiration time can vary though. Suppose you navigate
    to another website that has been hacked to include malicious code that, when activated
    (via a button click, for example), instructs your browser to send a request to
    megabank.com to transfer funds from “your account to the hacker''s account. When
    the megabank website receives the request, it will look for a session cookie to
    identify the user, which it will find in your browser. The transfer will go through
    as if you performed the request.


    Although the chances are low that all the variables required for a successful
    CSRF attack will be present, it would take only one successful attack to ruin
    the reputation of the megabank.com website. If you''ve encountered spam emails
    or spam comment posts that just link in to seemingly random websites, they could
    well be attempts to lure you into a CSRF attack. The worst part of the CSRF vulnerability
    is that the end user doesn''t even have to click anything on the website that
    is hacked. The entire attack can be handled by JavaScript when the page is loaded.


    So, what can you do to make sure your HTML5 application doesn''t allow this kind
    of CSRF attack? First, be aware that your application has to be maintaining a
    session cookie in order for this type of attack to happen. If your application
    doesn''t maintain session cookies (a stateless application), then it isn''t vulnerable
    to this type of attack and you do not need to do anything. If your application
    does maintain session cookies, then your first priority is to

