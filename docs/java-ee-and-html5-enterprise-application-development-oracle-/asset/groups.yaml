    in recent years. Two of the largest changes are the trend toward Software as a
    Service (SaaS) and the use of HTML5 to provide a pure client-side user interface.


    In this chapter, you will be introduced to the main topics that will be covered
    throughout the book: NetBeans IDE, Java EE 7, and HTML5. You will be presented
    with information about how to obtain the applications and samples that will help
    you as you work your way through the coming chapters. Using this combination of
    IDE, platform, and HTML5 technology, you will soon be building powerful, dynamic
    enterprise applications.


    # Development Tools


    Three main development tools are used throughout this book: NetBeans IDE, Java
    EE 7, and HTML5. You will learn how to use the combination of these tools to build
    powerful, modern enterprise applications. Before you begin building applications,
    it is important to make sure you have a solid understanding of the basics of each
