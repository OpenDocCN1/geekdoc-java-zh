    \ Application Development\n\nAfter the update has been completed, the application\
    \ returns to the main page. The success: function closes the updateBookDialog\
    \ dialog and waits for that to be completed. It then calls the loadDefaults()\
    \ function, which resets the ViewModel and correct bindings back to the main page.\n\
    \n## Delete, Using the DELETE Request (D of CRUD)\n\nThe setup for the update\
    \ process was a little long, but that setup enabled the delete functionality.\
    \ The confirmDeleteDialog dialog is displayed in the same way as the updateBookDialog\
    \ dialog was, with a call to a showDeleteDialog() function. Listing 5-17 shows\
    \ the REST API call that is needed to perform a delete.\n\n### Listing 5-17 Example\
    \ of DELETE REST API Call\n\n```javascript\nfunction deleteBook(data) {\n  var\
    \ currentISBN = data.isbn();\n  var books = booksVM.Books();\n\n  $.ajax({\n \
    \   url: serviceRootURL + \"books/\" + data.isbn(),\n    type: 'DELETE',\n   \
    \ dataType: 'application/json',\n    success: function(data, status, xhr) {\n\
    \      var match = ko.utils.arrayFirst(books, function(item) {\n        return\
    \ item.isbn() === currentISBN;\n      });\n      ko.utils.arrayRemove(books, match);\n\
    \      $('#confirmDeleteDialog').modal('hide');\n      $('#confirmDeleteDialog').on('hidden.bs.modal',\
    \ function() {\n        loadDefaults();\n      });\n    },\n    error: function(xhr,\
    \ status, errorThrown) {\n      alert('Error updating the Book: ' + status + \"\
    : \" + errorThrown);\n    }\n  });\n}\n```\n\n## Java EE and HTML5 Enterprise\
    \ Application Development\n\n112 Server-Sent Events (SSE)\n\n## Server-Sent Events\
    \ (SSE)\n\nServer-Sent Events is sometimes referred to as push technology because\
    \ the data flow is in one direction only. Everything comes from the server. The\
    \ browser chooses to attach to the SSE stream to have information sent to it whenever\
    \ new information becomes available. The example application has an Events section\
    \ set up that will display data coming from an. Knockout two-way binding is really\
    \ helpful with the displaying of the data since you can set up the binding between\
    \ the incoming data and a specific DOM element and just let Knock update whenever\
    \ new data coming in. Listing 5-18 shows how you connect to the SSE stream and\
    \ which functions are used to work with the stream and its data.\n\n### Listing\
    \ 5-18 Example of Server-Sent Events\n\n```javascript\nfunction sseViewModel()\
    \ {\n  var self = this;\n  self.sseData = ko.observable('test message');\n  self.displayError\
    \ = ko.observable(false);\n  self.displayMessage = ko.observable(false);\n\n \
    \ if (typeof(Event) == \"undefined\") {\n    self.source = new EventSource(serviceRootURL\
    \ + \"/books/events\");\n    self.source.onopen = function (event) {\n      var\
    \ message = \"SSE Connection Opened<hr>\";\n      self.sseData(message);\n   \
    \ };\n    self.source.onmessage = function(event) {\n      var message = self.sseData()\
    \ + event.data + \"<hr>\";\n      self.sseData(message);\n    };\n    self.source.onerror\
    \ = function (event) {\n      self.displayError(false);\n      self.sseData(event.data);\n\
    \    };\n  } else {\n    self.sseData(\"Sorry, your browser does not support server-events...\"\
    );\n    self.displayError(true);\n  }\n}\n\nself.closeSSE = function() {\n  self.source.close();\n\
    }\n```\n"
