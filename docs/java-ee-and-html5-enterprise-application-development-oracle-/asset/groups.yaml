    http://www.w3.org/2001/XMLSchema-instance\"\nsi:schemaSchemaLocation=\"http://xmlns.jcp.org/xml/ns/persistence\
    \ http://xmlns.jcp.org/xml/ns/persistence/persistence_2_1.xsd\" \n  \n  <persistence-unit\
    \ name=\"authorPU\" transaction-type=\"JTA\">\n    <properties>\n    </properties>\n\
    \  </persistence-unit>\n</persistence>\n```"
