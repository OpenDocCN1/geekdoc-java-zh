  mdcn: "\n第 4 章：WebSocket 59\n\n并且每次 HTTP 消息交换都会终止 TCP 连接，这了应用程序的整体性能。\n\nHTTP 作为一种线缆协议，其开销也很大。为了满足协议要求，客户端和服务器之间在传输线上必须交换最少一组标头部。解析这些标头部需要处理成本，如果消息交换的次数增加，这种成本会进一步降低应用程序的性能。\n\
    \n简而言之，HTTP 是一种全双工且冗长的协议，对于客户端和服务器之间的全双工双向通信来说效率低下。这正是 WebSocket 所解决的需求。\n\n##\
    \ 什么是 WebSocket？\n\nWebSocket 是一种全双工的双向协议，它使用单个 TCP 连接进行双向的消息交换。WebSocket 由两个规范定义：\n\
    \n- WebSocket 协议，RFC 6455 http://tools.ietf.org/html/rfc6455\n- W3C WebSocket\
    \ API www.w3.org/TR/websockets/\n\nRFC 6455 定义了如何通过握手建立 WebSocket 连接。它还定义了 WebSocket\
    \ 消息交换的线缆协议。W3C WebSocket API 是一个由不同浏览器实现的 JavaScript API。该 API 可以供 Web 应用用于与\
    \ WebSocket 端点建立连接并交换消息。\n\n## WebSocket 握手\n\nHTTP 1.1 (RFC 2616) 的 14.42 定义了一种升级机制，允许从\
    \ HTTP 1.1 协议转换到不同的协议。在这种情况下即 WebSocket 协议。在客户端和服务器之间协商升级后，随后的请求将使用新选择的协议进行交换。\n\
    \nRFC 6455 定义了 WebSocket 客户端如何发出 HTTP 升级请求。这被称为 WebSocket 客户端握手，如列表 4-1 所示。\n\n\
    ## 60 Java EE 和 HTML5 企业级开发\n\n### 列表 4-1 WebSocket 客户端握手\n\n```\nGET /chat HTTP/1.1\n\
    Host: server.example.com\nUpgrade: websocket\nConnection: Upgrade\nSec-WebSocket-Key:\
    \ dGhlIHNnhbBsZsSBub225jZQ=\nOrigin: http://example.com\nSec-WebSocket-Protocol:\
    \ chat\nSec-WebSocket-Version: 13\n```\n\n列表 4-1 显示了一个典型的开启握手请求。握手中的标头部字段可以是任何顺序。在这个片段中，前几行类似于普通的\
    \ HTTP 请求，标识了请求指向的主机和 URI。这里需要注意的关键部分是，WebSocket 协议试图在现有的 HTTP 基础设施环境中实现双向通信。这使得该协议可以在\
    \ HTTP 端口 80 和 443 上运行，并支持 HTTP 代理和中间件。\n\n列表 4-1 中的 WebSocket 相关的标头部字段如下：\n\n\
    - `Upgrade` 和 `Connection` 标头部字段将此 HTTP 请求标记为升级请求，专门请求升级到 WebSocket。\n\n- 可以 `Sec-WebSocket-Protocol`\
    \ 标头部字段协商不同的子协议。如果你选择定义子协议，则服务器和客户端都必须包含该字段。还建议将任何子协议向互联网分配数字机构（IANA）注册，以帮助避免命名冲突。\n\
    \n- `Sec-WebSocket-Version` 标头部由服务器返回，必须设置为值 13。\n\n- `Origin` 标头部字段用于防止在 Web\
    \ 浏览器中使用 WebSocket API 的脚本未经授权跨源使用 WebSocket 服务器。\n\n- 如果服务器能够处理此升级请求，它将使用预定义的算法处理收到的\
    \ `Sec-WebSocket-Key` 标头部字段，并在服务器握手响应中返回生成的值。\n\n一个典型的服务器开启握手响应如下：\n\n```\nHTTP/1.1\
    \ 101 Switching Protocols\nUpgrade: websocket\nConnection: Upgrade\nSec-WebSocket-Accept:\
    \ s3pPLMBITxaq9KGYzzZrbK+xOo=\n```\n\n第一行是 HTTP 状态行，表示握手成功。`Upgrade` 和 `Connection`\
