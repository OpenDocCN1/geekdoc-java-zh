    \ id=\"bookDescrip\" class=\"form-control\" rows=\"3\"></textarea>\n  </div>\n\
    </div>\n```\n"
  mdcn: "\n\n## 特选书籍 +\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_117_0.png)\n\n\
    JavaScript：初学者指南\nHTML5 多媒体开发者指南\nHTML5：初学者指南\nJava WebSockets 编程\n\n**图 5-1.**\
    \ 所有书籍列表\n\n它是当前视图的一部分，当你获取此书的详情时，确实需要此值。通过将 CSS 样式类设置为 \"hidden\"，实际的 `<div>`\
    \ 不会被渲染，但 ISBN 值将作为 Knockout 传递给函数的数据的一部分（通过点击绑定 `click: binding`）可用。\n\n将列表 5-3\
    \ 到列表 5-6 中的所有代码放在一起并在浏览器中运行时，其最终结果将如图 5-1 所示。\n\n## 创建，使用 POST 请求（CRUD 中的 C）\n\
    \n现在你已经学会了如何使用 REST 服务执行最常见的任务——读取数据，接下来你将学习如何向你的数据服务添加新记录。\n\n在本例中中，你将向数据库添加一本新书。你将使用与读取书籍列表\
    \ `/books` 相同的 REST API；然而，你使用的请求类型将是 POST 请求，而不是之前使用的 GET 请求。列表 5-7 显示了执行此 POST\
    \ 请求的代码。\n\n**列表 5-7** AJAX POST 调用示例\n\n```javascript\n.ajax(\n  url: serviceRootURL\
    \ + \"/books\",\n  type: 'POST',\n  data: JSON.stringify(json),\n  dataType: 'json',\n\
    \  contentType: 'application/json',\nsuccess: function(response, status, xhr)\
    \ {\n    booksVM.Books.push(new bookModel(json));\n    $('#addBookDialog').modal('hide');\n\
    \  },\n  error: function(xhr, status, errorThrown) {\n    alert('Error adding\
    \ Book: '+status+':'+errorThrown)\n  }\n});\n```\n\n让我们逐行的代码：\n\n- $.ajax({ 这是用于实现异步\
    \ HTTP 请求 (AJAX) 的 jQuery 方法。\n- url: serviceRootURL + \"books\", 这行设置了你将进行 REST\
    \ 调用的 URL。\n- type: 'POST', 这一行将请求类型设置为 POST。这告诉 REST 服务你想将此新数据添加到数据库中。\n- data:\
