    \ 按钮查看文件的源码。在 Source 视图中使用代码补全时——即按下 CTRL-TAB（默认）——可以获得补全当前单词的建议，并带有相关的文档补全，如图\
    \ 2-5 所示。\n\n当你点击 **Design** 按钮时，将显示一个用于处理 persistence.xml 结构化视图（见图 2-6）。下拉列表允许导航到感兴趣的部分，而文本字段和按钮允许你向底层的\
