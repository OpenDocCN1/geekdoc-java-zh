    # Java Persistence Query Language


    Java Persistence Query Language JPQL is a string-based query language used to
    define queries over entities and their persistent state. JPQL allows the application
    developer to specify the semantics of queries in a portable way. The underlying
    persistence provider converts the query language to a target language, such as
    SQL, of a database or a persistent store.


    A query may be a SELECT statement (R from Read of CRUD), UPDATE statement (U from
    Update of CRUD), or DELETE statement (D from Delete of CRUD). An optional WHERE
    clause can be used to restrict the results, and a GROUP BY clause, HAVING clause,
    or ORDER BY clause can be used to aggregate the results. The query may be constructed
    dynamically or be statically defined in a metadata annotation.


    As shown in the following example, javax.persistence.NamedQuery annotation can
    be used on an entity to specify multiple JPQL queries. Each query is specified
    using @javax.persistence.NamedQuery annotation. Each query requires a name attribute
    to uniquely identify the query within the persistence unit. The query string is
    defined using the query attribute.


    ```

    @NamedQuery(name = "Author.findAll", query = "SELECT a FROM Author a")

    @NamedQuery(name = "Author.findById", query = "SELECT a FROM Author WHERE a.id
    = :id")

    ```


    In the preceding example, both the queries are statically defined. The first query
    has the name Author.findAll and is equivalent to selecting all rows from the table.
    Note that the query string is defined around the entity, and not the corresponding
    database table. This is what provides portability of JPQL over multiple databases.
    The second query has the name Author.findById, which uses a WHERE clause to restrict
    the result, and requires a parameter id to be specified.


    NetBeans IDE provides a JPQL Query dialog so that you can verify queries without
    deploying the application. Before you use it, make sure to compile the JPA entities
    in your application, these compiled classes are used by the JPQL Query dialog.
    Then, as shown in Figure 2-8, right-click'
- md: "\n# Chapter 2: Persistence 31\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_50_0.png)\n\
    \nFIGURE 2-8. Opening the JPQL Query dialog\n\nthe persistence.xml file and choose\
    \ Run JPQL to open the JPQL dialog.\nIn the JPQL Query dialog, you can use code\
    \ completion, CTRL-TAB (by default), to help you define your queries. When you\
    \ run a query, the results are shown in the Result tab, as shown in Figure 2-9,\
    \ while the SQL version of the query is available in the SQL tab.\n\n## Criteria\
    \ API\n\nthe javax.persistence.Criteria API is an object-based, type-safe alternative\
    \ to string-based JPQL. It operates on a metamodel of the entities, which is typically\
    \ generated by an annotation processor. The metamodel is a set of classes that\
    \ describes your domain model and provides a generic way to deal with an application's\
    \ domain model. The APIs in the package, javax.persistence.criteria and javax.persistence.metamodel,\
    \ are used to create this strongly typed query.\n\nListing 2-5 shows how you can\
    \ write the Author.findAll query using the Criteria API.\n\n## Java EE and HTML5\
    \ Enterprise Application Development\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_51_0.png)\n\
    \nFIGURE 2-9. Showing query results\n\n+ Listing 2-5 Author Criteria query\n```java\n\
    CriteriaBuilder builder = em.getCriteriaBuilder();\nCriteriaQuery criteria = builder.createQuery(Author.class);\n\
    Root<Author> root = criteria.from(Author.class);\ncriteria.select(root);\ntypedQuery<Author>\
    \ query = em.createQuery(criteria);\nList<Author> list = query.getResultList();\n\
    ```\n\nThe Criteria query is verbose but provides a lot of flexibility in constructing\
    \ dynamic queries.\n\n## Native SQL\n\nIn certain cases, a native SQL statement\
    \ may have to be used to query the database. The javax.persistence.EntityManager.createNativeQuery()\
    \ method can be used to specify the native SQL query string. Listing 2-6 shows\
    \ how the Author.findAll named query can be executed as a native SQL query.\n\n\
    ## Listing 2-6 Author Native Query\n\n```java\nem.createNativeQuery(\"select *\
    \ from author\", Author.class);\n```\n\nIn this simplified case, the result set\
    \ is mapped directly to the Author entity class. More complex mappings can be\
    \ specified using the @java.persistence.SQL.ResultSetMapping annotation.\n\nNetBeans\
    \ IDE provides wizards to query the database using native SQL query strings. Switch\
    \ to the Services window (CTRL-3) and expand the Databases. Right-click a table\
    \ node, as shown in Figure 2-10, and choose View Data to view data in the related\
    \ table in the database.\n\nWhen the SQL editor opens, you have syntax coloring\
    \ and code completion available to query the database and view the data directly\
    \ in the IDE, as shown in Figure 2-11.\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_52_0.png)\n\
    \nFIGURE 2-10. Viewing data defined in a database\n\n## Java EE and HTML5 Enterprise\
    \ Application Development\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_53_0.png)\n\
    \nFIGURE 2-11. Editing SQL query strings in the SQL editor\n\nA row from the database\
    \ table can be removed by retrieving the required entity using any method. The\
    \ javax.persistence.EntityManager.remove() method is called to remove the entity.\
    \ Like the javax.persistence.EntityManager.persist() method, it must be called\
    \ within a transaction. The entity's state is persisted to the database when the\
    \ transaction is committed, either implicitly by the container or explicitly by\
    \ the user.\n\nNetBeans IDE provides a wizard to generate JPA controller classes\
    \ that perform CRUD functionality for an entity class. In the IDE, right-click\
    \ your application and choose New | Other | Persistence | JPA Controller Classes\
    \ from Entity Classes.\n\nIn addition, you can generate session beans for the\
    \ entity classes in the application. In the IDE, right-click your application\
    \ and choose New | Other | Enterprise JavaBeans Session Beans for Entity Classes,\
    \ which displays the New Session Beans for Entity Classes page shown in Figure\
    \ 2-12.\n\n## Chapter 2: Persistence 35\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_54_0.png)\n\
    \nFIGURE 2-12. Getting started creating session beans for existing entity classes\n\
    \nSelect any entity classes from the Available Entity Classes list in the left\
    \ pane, and click the Add button. Any referenced entity classes are automatically\
    \ added to the Selected Entity Class list in the right pane. If an entity class\
    \ is grayed out, that indicates it is a referenced entity class.\n\nClick Next\
    \ to move to the Generated Session Beans page of the wizard, shown in Figure 2-13,\
    \ and review or set the following:\n\n- Project Displays the project where the\
    \ entity classes will be saved. This field is read-only.\n- Location: Select the\
    \ source folder where you want to create the entity class.\n- Package: Select\
    \ an existing package from the Package drop-down list or type the name of a new\
    \ package.\n- Create Interfaces: Select the session facade interfaces that you\
    \ want the wizard to generate.\n\nWhen you click Finish, the specified session\
    \ beans are created, as shown in Figure 2-14.\n\n## 36 Java EE and HTML5 Enterprise\
    \ Application Development\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_55_0.png)\n\
    \nFIGURE 2-13. Specifying details for session beans\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_55_0.png)\n\
    \nFIGURE 2-14. Session beans created in the application\n\n## Schema Generation\n\
    \nTypically, the database schema is already defined and entity classes can be\
    \ generated from scripts. Listing 2-7 shows how these properties can be configured:\n\
    \n```xml\n<persistence version=\"2.1\" xmlns=\"http://xmlns.jcp.org/xml/ns/persistence\"\
    \nxmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\nxsi:noNamespaceLocation=\"\
    http://xmlns.jcp.org/xml/ns/persistence/persistence_2.xsd\">\n  <persistence-unit\
    \ name=\"authorPU\" transaction-type=\"JTA\">\n    <properties>\n      <property\
    \ name=\"javax.persistence.schema-generation.database.action\" value=\"drop-and-create\"\
    />\n      <property name=\"javax.persistence.schema-generation.create-source\"\
    \ value=\"script\"/>\n      <property name=\"javax.persistence.schema-generation.drop-source\"\
    \ value=\"script\"/>\n      <property name=\"javax.persistence.schema-generation.create-script-source\"\
    \ value=\"META-INF/create.sql\"/>\n      <property name=\"javax.persistence.schema-generation.drop-script-source\"\
    \ value=\"META-INF/drop.sql\"/>\n      <property name=\"javax.persistence.sql-load-script-source\"\
    \ value=\"META-INF/load.sql\"/>\n    </properties>\n  </persistence-unit>\n</persistence>\n\
    ```\n\nThe following list explains these properties: javax.persistence.schema-generation.database\n\
    \n- The javax.persistence.schema-generation.database.action property value specifies\
    \ to drop existing tables and create them again. The possible values are none,\
    \ create, drop-and-create, and drop.\n- The javax.persistence.schema-generation.create-source\
    \ property value specifies that the database creation should occur on the basis\
    \ of the scripts.\n- The javax.persistence.schema-generation.drop-source property\
    \ value specifies that the database deletion should occur on the basis of the\
    \ scripts.\n\nThe possible values for the preceding two properties are metadata,\
    \ script, metadata-then-script, and script-then-metadata. In this case, either\
    \ script or metadata specified on the entity or a combination is used to create\
    \ or drop tables.\n\n- The javax.persistence.schema-generation.create-script-source\
    \ property value specifies the location of the database creation script.\n- The\
    \ javax.persistence.schema-generation.drop-script-source property value specifies\
    \ the location of the database deletion script.\n- The javax.persistence.sql-load-script-source\
    \ property value specifies the location of SQL bulk load script.\n\nThe last three\
    \ property values specify that the script is packaged with the application. In\
    \ this case, the location of the script is specified relative to the root of the\
    \ persistence unit. Alternatively, a URL may externally identify the scripts.\n\
    \nThese properties enable generation of the database schema from scripts or entity\
    \ metadata. In addition to the properties described previously, the following\
    \ properties may be used to specify the generation of scripts:\n\n- javax.persistence.schema-generation.scripts.action\
    \ can be used to specify which scripts need to be generated. The possible values\
    \ are none, create, drop-and-create, and drop.\n- javax.persistence.schema-generation.scripts.create-target\
    \ and javax.persistence.schema-generation.scripts.drop-target can be used to specify\
    \ the location of create and drop scripts. The locations are specified as strings\
    \ corresponding to file URLs.\n"
