    Server-Sent Events（服务器事件）是 HTML5 引入的一项新功能。在本文写作时，某些浏览器尚不支持此功能。


    > **提示**

    > 目前，没有任何版本的 Microsoft Internet Explorer 支持 Server-Sent Events。


    在继续执行初始化代码之前，最好进行以下检查，以确保浏览器提供了 SSE 支持：


    ```

    if (typeof (EventSource) !== "undefined") {

    ```


    如果浏览器不理解 `EventSource` 的类型，则它不支持 SSE，在这种情况下你可以显示一条错误消息。

    让我们通过列表 5-18 中的代码，看看每个部分的作用：


    - 前几行设置了你的 Knockout 可观测对象（observables）的默认值。这些观测对象被绑定到 HTML 代码中的 SSE 部分。


    - 在检查浏览器是否支持服务器发送事件的 `if` 语句内部，你创建了一个新的 `EventSource` 对象并将其赋值给 `self.source` 变量。用于建立连接的
    URL 是你在书中第 3 章中编写的 SSE 流：


    ```

    new EventSource(serviceRootURL + "/books/events");

    ```


    - 一旦你有了 `EventSource` 对象，你就可以监听以下三个事件，然后执行相应的操作：


    - onopen: 该事件在连接首次打开时触发。


    - onmessage: 每当服务器向浏览器发送消息时都会触发此事件。这是你想要处理的主事件。


    - onclose: 当连接由于任何原因关闭时触发此事件。


    ![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_133_0.png)


    在列表 5-18 中，你正在将局部变量 `message` 设置为一个表示连接已打开的字符串。然后你将该值赋值给 Knockout 可观测对象 `sseData`，它将显示在绑定到同一观测对象的
    SSE HTML 部分中。由于你在此消息中包含了 HTML 标记，因此 HTML 页面上的 Knockout 绑定实际上是 `html:` 绑定，而不是纯文本的
    `:` 绑定：


    ```

    <div id="sseMessage" data-bind="html: sseData, ..."></</div>

    ```


    - 在 `onmessage` 函数中，你希望通过将服务器的最新消息追加到现有消息的末尾，布局进入此区域的消息。你通过将局部变量 `message` 设置为观测对象的实际值，然后追加传入的事件
    `.data` 来实现。生成新的追加消息后，你将 `self.sseData` 可观测对象设置为新值。


    - 如果连接由于任何原因关闭，请设置一条表示连接已关闭的消息，并设置相同的 `self.sseData` 来显示该消息。


    - 当 `self.displayMessage` 和 `self.displayError` 的原始可观测对象初始化时，它们被设置为 `false`，这样在页面加载期间就不会显示这些区域。现在连接已经建立并设置了消息，你可以将可观测对象设置为
    `true`，这将显示消息区域，同时保持错误部分隐藏。


    - 最后，在事件区域的视图层中有一个很小的 X 图标，它已绑定到 `closeSSE()` 函数。当点击该图标时，当前的 SSE 流将关闭并显示适当的消息。


    ## WebSocket


    在 JavaScript 中使用 WebSocket API 并结果数据连接到 HTML 视图层已经在第 4 章中介绍过。如果你还没有读第 4 章，建立服务连接的基本方法与你刚刚通过
    Server-Sent Events 学到的相同。然而，通过 WebSocket API，你还可以向服务器发送数据。使用 WebSocket 连接代替 REST
    或其他类型协议的最大优势之一是显著减少了你发送的流量。使用 WebSocket 协议时，客户端和服务器之间的连接建立一次，并一直保持到通过 API 或客户端关闭。对于其他协议，你每次想要从服务器发送或接收数据都需要重新建立连接。


    要获取 WebSocket 协议的完整描述，请阅读第 4 章。


    ## 响应式设计


    响应式设计的概念是为了设计你的 Web 应用程序，使其根据显示设备的屏幕尺寸适当地渲染布局。应用程序视图层需要通过更改布局或渲染的内容来响应尺寸的变化。


    CSS2 规范提供了根据媒体类型动态使用不同 CSS 规则的能力。这些类型中最常见的（在 CSS3 中继续存在）是屏幕和打印。CSS3 规范通过引入媒体查询（media
    queries）扩展了这一功能。媒体查询由一个媒体类型和零或多个表达式组成。这些表达式检查媒体的特定条件。一个很好的例子是检查显示屏幕尺寸的表达式：


    ```

    @media only screen (min-width: 450px) and (max-width: 1024px) {}

    ```


    通过使用媒体查询和定义为网格布局的 CSS 类模式，你可以让应用程序响应显示屏幕的变化。


    网格布局模式是你可以设计的内容，但使用现有的网格框架要简单得多。到为止，你一直在使用 Bootstrap 框架来显示列。注意 Bootstrap 使用 12
    列网格系统。这意味着一列可以跨越 1 到 12 的任何数字。例如，`col-md-6` 占据宽度的一半，`col-md-4` 占据三分之一，而 `col-md-3`
    占据四分之一。


    （注：原文文本中存在大量重复的响应式设计描述，此处已根据要求去冗处理，仅保留核心逻辑）

