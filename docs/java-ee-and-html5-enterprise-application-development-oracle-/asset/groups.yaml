    # Client-Side Security Common Sense


    A commonsense approach to client-side security will help you avoid many pitfalls.
    With that in mind, here are some commonsense practices you should consider following:


    +   * Try to always run your application using the HTTPS protocol.

    * If your application is running in a secure domain (HTTPS), don''t connect your
    application to unsecured services. Make sure that your REST calls are also going
    to HTTPS domains and that your WebSocket calls are using w instead of ws (see
    "WebSocket Security" later in the chapter).

    * If at all possible, don''t allow <script> elements in your HTML files. Place
    your JavaScript in external files and reference them.

    * If you are using a JavaScript framework, check to see what kind of help it provides
    with common security issues, and use those features.

    * Finally, take the time to research which security measures your specific application
    security requires. You''ll find that there is a lot of application security information
    available, and it''s growing rapidly.


    # Server-Side Security


    This section explains the key concepts of server-side security: authentication,
    confidentiality, and data integrity.


    +   * Authentication validates the identity of a client. It determines whether
    the client is, in fact, really what it is claiming to be. It usually involves
    receiving a request from a client that includes a user'
