    # 关于作者


    John Brock 是 Oracle 公司的首席产品经理。John 拥有超过 15 年的 Web 应用开发经验。在 Sun Microsystems 工作期间，他负责识别新兴技术以及它们可能如何与
    Java 虚拟机 (JVM) 交互。他目前的重点是 NetBeans 的 HTML5 开发、JavaScript 和 CSS 功能。


    Arun Gupta 是 Red Hat 的开发者倡导总监，专注于围绕 JBoss 中件构建社区。作为 Sun Microsystems Java EE 团队的创始成员，他通过内容、营销活动和计划领导了
    Java EE 7 平台的全球发布。Arun 拥有丰富的演讲经验，曾遍布 37 个国家，并是 Java Rockstar。他是一位畅销书作者、跑步爱好者，可以通过
    @ungupta 联系他。


    Geertjan Wielenga 是 Oracle 公司的首席产品经理。Geertjan 自 1996 年起进入软件行业。在 Sun Microsystems
    期间，他负责一系列技术的文档工作（主要是 Java EE 和 Web 领域），开发教程并编写著作。Geertjan 是 NetBeans 作为 Web 技术工具中心解决方案的热心支持者。他还推广
    NetBeans Platform 作为大型 Java 桌面应用的稳定通用解决方案。他目前担任 NetBeans IDE 推广的产品经理。


    # 关于技术编辑


    John Yeary 是 Infor Global Solutions Epiphany CRM 营销首席软件工程师。John 一直是 Java 倡导者，自
    1995 年起从事 Java 工作。John 是一位专注于 Java 企业版、NetBeans 和 GlassFish 的技术博客。他是 Greenville
    Java 用户组 (GreenJUG) 的创始人和主席。他是教师、导师以及丰富的开源贡献者。


    John 毕业于缅海洋学院，获得海洋工程学学位，专注于数学。他是一名海事船员，拥有许多执照和认证。在不从事 Java 和开源项目时，他喜欢徒步、航海、旅行并与家人共度时光。John
    还是美国童子军 (BSA) 833 队的助理童军长、单位辅导以及 Blue Ridge Council Southbounder 区活动与公民服务主席。


