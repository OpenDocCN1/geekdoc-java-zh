    # Introduction


    Many any books are available that cover just Java web services or just HTML5,
    but not both. So, this book strives to find a balance between what HTML developer
    should know about the Java web services they connect to and what the Java developer
    should know about the HTML5 applications that are consuming and interacting with
    the web services.


    With the resurgence of JavaScript over the past few years, Java developers are
    often faced with the need to understand how HTML5 client-based applications interact
    and consume the server-side web services that the developers have been creating.
    At the same time, HTML5 developers often find that they need to understand how
    the services applications rely on are built and configured. With the new HTML5
    and CSS3 specifications generating a lot of industry buzz and the new JavaScript
    libraries, such as AngularJS and Knockout, becoming increasingly popular, some
    Java developers may wonder whether their skills are still relevant.


    # Who Should Read This Book


    This book is ideal for developers who find they need to understand not only how
    to develop Java EE-based web services such as REST, Server Events (SSE), and WebSocket,
    but also how to develop HTML5-based clients that consume and interact with those
    web services. Whether you are primarily a Java developer looking for information
    about how HTML5 applications connect to your web services, or an HTML5 developer
    looking to better understand how the Java EE web services are created on the server
    side, this book will fit your needs.'
