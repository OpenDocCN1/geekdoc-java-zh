    ## 第 1 章：Java EE 与 HTML5 企业级开发简介


    Java 领域模型。与整体主题一致，添加注解允许将 POJO 映射到数据库表。它提供了合理的默认值，可以通过注解进行覆盖。POJO 还可以用于生成数据库表，甚至是表生成所需的脚本。开发人员可以编写基于字符串或类型安全的查询来对
    Java 数据模型进行操作。


    此外，这些数据中的信息需要被存储和检索，以保持 ACID（原子性、一致性、隔离性、持久性）属性。这可以通过企业级 JavaBean (EJB) 或新引入的
    @Transactional 注解来实现。EJB 提供了方便的容器托管事务。它们还有不同的类型：无状态（stateless，服务器端无状态）、有状态（stateful，状态存储在服务器上）和单例（singleton，每个应用程序每个
    JVM 仅有一个实例）。


    新添加的 @Transactional 注解可以指定在 POJO 上，以便在 Enterprise JavaBeans 之外提供容器托管事务。对类进行注解意味着该类的所有方法将在容器托管事务中运行。或者，该注解也可以指定在方法上以限制事务的范围。


    本书将使用大量的代码示例详细介绍所有这些主题。


    此外，Java EE 7 平台提供了其他几个组件：


    - Java 平台批处理应用程序 (Batch Applications for the Java Platform)：允许定义和执行非交互式、批量型和长时间运行的任务。它允许面向条目的处理处理样式（也称为
    Chunk）和面向任务的处理样式（也称为 Batchlet）。Chunk 是主要且推荐的处理样式，它一次读取、处理并聚合以写入一个“块”数量的项。每个 chunk
    都在容器托管事务中写入，并提供检查点。Batchlet 是一种自定义的批处理模式。它是一种面向任务的处理样式，任务被调用一次，运行完成并返回退出状态。


    - Java 消息服务 (JMS)：提供了一种面向消息的中间件，允许在分布式系统之间发送和接收消息。它提供了点对点消息模型，发布者将消息发送到特定的目标（称为队列
    queue），目标指向订阅者。或者，JMS 提供了发布-订阅消息模型，多个发布者可以将消息发布到一个目标（称为主题 topic），该主题可以被多个订阅者订阅。在这两种情况下，发布者和订阅者之间都是松耦合的。他们只需要知道目标和消息格式。


    - **上下文与依赖注入 (CDI)**：提供了一种类型安全的依赖注入机制。bean 是“强类型”的，因为它只定义了它依赖的其它 bean 的类型和语义，而不使用字符串名称，并使用
    Java 类型系统中可用的类型信息。它提供了“松耦合”，因为注入请求无需感知 bean 的实际生命周期、具体实现、线程模型或其他客户端。


    - **并发工具类 (Concurrency Utilities)**：允许为现有的 Java EE 应用程序添加并发设计原则。它允许应用程序创建由控制器管理的的用户线程。通常的类加载、、Java
    命名目录接口 (JNDI) 上下文以及安全上下文会传播到这些线程。


    - **JavaServer Faces (JSF)**：提供服务端用户界面 (UI) 框架。它允许遵循模型-视图-控制器 (MVC) 设计模式使用一组可重用的
    UI 组件来创建网页。组件绑定到服务端模型上，实现了应用程序数据与 UI 之间的双向迁移。JSF 还定义了页面导航，管理跨服务器请求的 UI 组件状态，并可以轻松用于构建和复用自定义组件。


    - **Java Servlet 技术**：允许 Web 客户端使用请求/响应模式进行交互并生成动态内容。容器负责 servlet 的生命周期，接收请求并发送响应，并作为该功能执行所需的任何其他编码/解码。


    请参阅《Java EE 7 教程》(http://docs.oracle.com/javaee/7/tutorial/doc/home.htm) 了解完整的
    Java EE 7 技术的详细信息。


    ## HTML5


    虽然大多数人认为 HTML5 是相对新的，但它实际上从 2004 年开始就在开发了。万维网联盟 (W3C) 设计原始规范是为了解决它所观察到的当时互联网上
    HTML 和 XHTML 的常见用途。W3C 在起草新规范时考虑的其他因素还包括了将多媒体整合到网页中的趋势，以及合并在 HTML 4.01 规范使用期间已成为广泛使用的各种规范的需求。这种整合不仅包括升级到
    HTML 4 规范，还将将 XHTML 1 和 DOM Level 2 HTML 规范合并为一。


    ## HTML5 规范达到功能完备


    过去一年中，让 HTML5 跃居前沿的是在 2012 年 12 月 17 日，W3C 宣布 HTML5 规范已达到功能完备。通过将规范标记为“候选建议”（Candidate
    Recommendation），W3C 为企业和开发人员提供了一个可以开始使用的稳定规范。


    当你将 HTML5 作为你的客户端应用程序框架工作时，需要考虑的一个主要问题是，虽然它已经达到了稳定、功能完备的状态，但它尚未被批准为一个完成的标准。这最大的影响是，由于使用的草案规范不同，仍然存在不同的实现。或者可能完全不支持规范的某些部分。现在该规范已经功能完备，主要的浏览器用户代理开发者应该能够收敛到更接近规范的实现上。然而，这需要时间，你需要确保在所有浏览器和用户代理上测试你所有的
    HTML5 代码。


    W3C 在发布 HTML5 规范完整定义的公告中（www.w3.org/2012/12/html5-cr.html），对下阶段将包含的内容描述如下：


    > [content]>在此阶段，HTML 工作组将分析当前的 HTML5 实现，为测试开发建立优先级，并与社区合作开发这些测试。HTML 小组计划此实施阶段持续到
    2014 年年中，之后 W3C 预计发布最终的 HTML5 建议，供实施者免费使用.[/content]


    ## Java EE 与 HTML5 企业级应用程序开发


    到目前为止，HTML5 规范的实现可以说是针对一个不断变化的目标进行的。不同的供应商以不同的方式支持规范，或者可能完全不支持规范的某些部分。这为应用程序开发人员带来了问题，因为他们必须为可能使用各种设备组合的客户群进行开发。坦率地说，已经建立了几个网站来帮助开发人员应对这一棘手领域。最流行的两个网站是：


    - HTML5 Test http://html5test.com/

    - Can I Use http://caniuse.com/


    HTML5 Test 网站将允许你看到特定版本或品牌的浏览器实现整个 HTML5 规范的程度如何。当你试图决定应用程序提供哪种浏览器或设备支持矩阵时，这非常有用。


    Can I Use 网站提供了更详细的信息，允许你查看特定的 HTML 元素或属性并查看哪些浏览器供应商实现了它以及在哪些版本中实现。


    ## 移动设备的使用


    HTML5 最近可见度上升的第二个主要原因可能是智能手机、平板电脑以及其他具有互联网访问能力的移动和嵌入式设备（例如联网电视、游戏机和蓝光播放器，仅举几例）可用性的增加。这些设备可用性的增加让
    HTML5 脱颖而出的原因是，所有它们都是使用在某种程度上已经支持 HTML5 的浏览器进行开发的。与桌面操作系统不同，这些设备的浏览器开发人员不需要考虑任何与现有浏览器实现的后兼容性问题。这些类型设备上一切都是新的，制造商从最新的
    HTML5 规范开始，以期待其在不久后成为标准。


    '
