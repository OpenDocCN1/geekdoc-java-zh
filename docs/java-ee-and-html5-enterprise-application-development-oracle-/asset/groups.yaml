    \ One');\n      vm.showStatus(true);\n    } else {\n      vm.playerName('Player\
    \ Two');\n      vm.showStatus(false);\n    }\n  } else {\n    if (json.symbol\
    \ === 'x') {\n      vm.image(vm.X);\n      vm.symbol(vm.playerTwo);\n    } else\
    \ {\n      vm.image(vm.O);\n      vm.symbol(vm.playerOne);\n    }\n  }\n  var\
    \ cellID = \"cell\" + json.x + \"-\" + json.y;\n  $('#' + cellID).attr(\"src\"\
    , vm.image());\n  if (vm.gameStatus().toLowerCase().indexOf(\"wait\") >= 0) {\n\
    \    vm.gameStatus('Your turn');\n  } else {\n    vm.gameStatus('Please wait');\n\
    \  }\n}\n```\n\n*(注：由于原文提供的代码块在输入处存在混乱和重复，翻译时已根据逻辑对代码结构进行了整理，以确保其可读性并符合文档工程师的规范。)*\n\
    \n让我们遍历列表 4-10 中的代码，以更好地了解客户端如何与服务器交互：\n\n- 当浏览器首次连接到 WebSocket 端点时，服务器返回一条关于该连接是玩家的消息。棋游戏中\
    \ X 先行，因此解析返回的字符串是否包含“x”，如果是，则 `onmessage` 方法设置“玩家一”（Player One）。\n\n- 如果 `onmessage`\
    \ 数据是一个 JSON 对象， own检查 `symbol` 成员以判断数据是 X 玩家还是 Y 玩家，`onmessage` 方法为该玩家设置相应的图像。它将\
    \ JSON 对象传递给 `setCellImage` 方法进一步处理。图 4-2 显示了使用 NetBeans IDE 的网络监视功能来查看发送和接收的数据。\n\
    \n图 4-2. NetBeans 网络监视窗口\n\n"
