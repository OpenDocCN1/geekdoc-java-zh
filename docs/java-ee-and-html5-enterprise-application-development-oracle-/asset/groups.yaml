    # Cross-Site Request Forgery


    Attacks that exploit the cross-site request forgery (CSRF) security vulnerability
    are uncommon because they are successful only under a very limited set of conditions.
    However, if you don''t take some measures to guard against CSRF attacks, you are
    exposing your website visitors to a potentially very nasty result.


    A good way to explain the CSRF attack is to use an example of a banking website.
    Let''s call the website megabank.com. When you log into your account on this bank''s
    website, the login stores a session cookie in your browser. This is a perfectly
    normal and acceptable practice for a banking website. The CSRF vulnerability exists
    if you leave the website without first logging out by clicking the Logout button.
    Your browser still has that session cookie in its cache until the cookie expires.
    The expiration of the session cookie is set by the megabank.com website and in
    most cases will expire approximately 15 minutes after the last activity on the
    website. This expiration time can vary though. Suppose you navigate to another
    website that has been hacked to include malicious code that, when activated (via
    a button click, for example), instructs your browser to send a request to megabank.com
    to transfer funds from “your” account to the hacker''s account listed in the malicious
    code. When the megabank website receives the request, it will look for a session
    cookie to identify the user, which it will find in your browser because you just
    visited the website and didn''t log out. The transfer will go through as if you
    performed the request.


    Although the chances are low that all the variables required for a successful
    CSRF attack will be present, it would take only one successful attack to ruin
    the reputation of the megabank.com website. If you''ve encountered spam emails
    or spam comment posts that just link in to some seemingly random websites, they
    could well be attempts to lure you into a CSRF attack. The worst part of the CSRF
    vulnerability is that the end user doesn''t even have to click anything on the
    website that is hacked. The entire attack can be handled by JavaScript when the
    page is loaded.


    So, what can you do to make sure your HTML5 application doesn''t allow this kind
    of CSRF attack? First, be aware that your application has to be maintaining a
    session cookie in order for this type of attack to happen. If your application
    doesn''t maintain session cookies (a stateless application), then it isn''t vulnerable
    to this type of attack and you do not need to do anything. If your application
    does maintain session cookies, then your first priority is to'
- md: "\n## Chapter 6: HTML5 and Java Application Security 131\n\nmake sure your website\
    \ isn't susceptible to the XSS types of attack described in the previous section.\
    \ If it is susceptible to XSS attacks, then anything you do to try and prevent\
    \ CSRF attacks is meaningless.\n\nTo implement any kind of CSRF prevention in\
    \ an HTML5 client-side application, you need to work in conjunction with what\
    \ is being done on the server side of your application. The technique that you\
    \ use to prevent CSRF is called double-spending cookies. This technique involves\
    \ reading the session ID from the cookie that was sent from the web page was first\
    \ requested. Using JavaScript, you place that same session ID into a hidden field\
    \ in all of the forms in your application, and attach it to any AJAX call that\
    \ makes your application back to the server. When sending the session ID value\
    \ back to the server, it's often referred to as a CSRF token.\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_150_0.png)\n\
    \n> Never set a CSRF token on an AJAX call that uses the method type of GET. Doing\
    \ so will potentially expose the CSRF token in many different places (server logs,\
    \ browser logs, network monitors, and so forth).\n\nUsing code similar to that\
    \ in Listing 6-4 will allow you to echo the current session ID back to the server,\
    \ which will then check to make sure it matches the session ID in the cookie.\
    \ Using this technique makes it extremely unlikely that the server will receive\
    \ from another website a request that has both the proper session cookie and the\
    \ same session ID in a hidden form element.\n\n### Listing 6-4 CSRF Hidden Form\
    \ Token\n\n```\n<form action=\"servlet/formsubmission\" method=\"post\">\n  <input\
    \ type=\"hidden\" name=\"CSRFToken\" value=\"secret_key\">\n</form>\n<script>\n\
    \  document.getElementById('csrf').setAttribute('value',\n  getCookie('Session'));\n\
    </script>\n```\n\nAs you can see, the real solution to prevent CSRF attacks has\
    \ to start at the server, but as a client-side developer, you can also do your\
    \ part to protect against such attacks.\n\n## Clickjacking\n\nClickjacking is\
    \ another type of attack against which you must protect your HTML5 web application.\
    \ For a clickjacking attack to succeed, the attacker must first manage to wrap\
    \ a web page from your application inside of a frame, or `<iframe>`, of some kind\
    \ on a website that the hacker has created. The hacker creates a series of stacked\
    \ transparent layers over the top of the website that the hacker created, which\
    \ appears to be a normal website. When a website visitor thinks they are clicking\
    \ buttons or links on your website and clicking a button that is not visible.\
    \ Back in 2009, Chris Shlett described an attack of this kind (http://shiflett.org/blog/2009/feb/twitter-dont-click-exploit)\
    \ that used a Twitter page as the transparent overlay. When an end user clicked\
    \ the \"Don't Click\" button, they were actually clicking the Post of the hidden\
    \ Twitter page and sending out a tweet devised by the attacker.\n\nAs most with\
    \ these kinds of attacks, the best way to defend against clickjacking is to do\
    \ so from the server side. In the case of clickjacking, the server-side defense\
    \ is to use the X-Frame-Options response header to deny all types of frames or\
    \ to only frames from the same domain. However, there is one coding practice that\
    \ you can use on the client side to protect your application from clickjacking.\n\
    \nIf you cannot modify the response headers from the server side, or you need\
    \ to support older browser versions that don't understand the X-Frame-Options\
    \ header, you can add the piece of code shown in Listing 6-5 to the <head> element\
    \ of your pages to help protect against clickjacking attacks. This concept comes\
    \ from Jason Li at Aspect Security and is discussed here: https://www.codemagi.com/blog/post/194.\n\
    \n- Listing 6-5 Anti-clickjacking Example\n\n```\n<head>\n<style id=\"antiClickjack\"\
    >body{display:none !important;}</style>\n<script type=\"text/javascript\">\n \
    \ if (self === top) {\n    var antiClickjack = document.getElementById(\"antiClickjack\"\
    );\n    antiClickjack.parentNode.removeChild(antiClickjack);\n  } else {\n   \
    \ top.location = self.location;\n  }\n</script>\n...\n</head>\n```\n\n## Chapter\
    \ 6: HTML5 and Java Application Security 133\n\nAdding a <style> element to the\
    \ top of your page enables the script that immediately follows it to know it's\
    \ referencing your page. If you were to use only the else part of the code by\
    \ itself, the expression could be defeated through multiple kinds of workarounds.\
    \ With the code in Listing 6-5, the script looks for the antiClickjack <style>\
    \ element, and if it's not already the top layer, it moves to the top. This is\
    \ the OWASP-recommended method for preventing clickjacking attacks from the client\
    \ side.\n\n## Authentication and Authorization\n\nProbably the most obvious security\
    \ issue when developing an HTML5 web application is how to handle your application\
    \ login. None of the coding examples presented thus in this book have included\
    \ a login process, but if your application is going to store information that\
    \ is specific to a user and/or information that will help make the user's current\
    \ visit to your application more enjoyable, then you will want to build some form\
    \ of authentication into your application.\n\nThe common method of authentication\
    \ used for JavaScript applications is the OAuth standard. OAuth is an open standard\
    \ for authentication. In 2006, a group of developers put together the concept\
    \ for OAuth. In the next year, a draft for OAuth was developed. In 2007, the OAuth\
    \ 1.0 protocol was released. In 2008, the OAuth specification was brought in front\
    \ of the Internet Task Force (IETF) annual meeting. In 2009, a draft for OAuth\
    \ was released. In 2010, the OAuth standard was released in April as RFC 5849.\
    \ In 2011, the OAuth standard is now the required authentication for many leading\
    \ service APIs, such as Twitter, Flickr, and others. In 2012, the OAuth 2.0 specification\
    \ was released as RFC 6749. Although it is slowly gaining popularity across the\
    \ Internet, many controversies arose throughout its development. To decide which\
    \ of the two protocols to use in your situation, you will need to conduct further\
    \ research on your own. It's safe to say that if your application needs to support\
    \ direct authentication, you should start with OAuth.\n\n## 134 Java EE and HTML5\
    \ Enterprise Development\n\nWithout getting into the technical details of the\
    \ protocol, OAuth enables a client application, often a web application, to act\
    \ on behalf of a user, with the user's permission. The main components of OAuth\
    \ 2.0 are\n\n- Client\n- Authorization server\n- Resource server\n- Resource owner\n\
    \nThe resource owner is an entity that can grant access to a protected resource.\
    \ The client is the application that makes the access request on behalf of the\
    \ resource owner. A client performs actions on a resource server based on authorization\
    \ provided by the user. For example, a user can access images on www.flickr.com\
    \ (resource server) via a web browser (client) by signing in to Flickr using their\
    \ Google Account (where www.google.com is the authorization server). The advantage\
    \ of this approach, as opposed to the user not having to create and remember multiple\
    \ logins and passwords. Instead, the client obtains a *bearer token* from the\
    \ authorization server, with the user's approval, and stores it. Then, when the\
    \ resource needs to be accessed at the resource server, the client sends a special\
    \ HTTP header in the following format:\n\n```\nAuthorization: Bearer <token_value>\n\
    ```\n\nThe token value is opaque to the client but can be decoded by a resource\
    \ server so that the server can check that the client, on the user's behalf, has\
    \ permission to access the resource.\n\nIf your application is going to be used\
    \ as part of a larger enterprise environment that requires user authentication,\
    \ then your application probably does not need to provide separate authentication.\
    \ If you do need to include some of authentication in your application, there\
    \ are plenty of libraries in different languages by different authorization servers\
    \ and resource providers that provide OAuth support. It's worth looking them before\
    \ deciding on your security infrastructure.\n\nIn a typical enterprise environment,\
    \ your application will be part of a larger application server installation. This\
    \ application server will do the authentication for your application, and the\
    \ user will not get to your application's pages until they have already been authenticated\
    \ by the\n"
  mdcn: "\n\n## 第 6 章：HTML5 与 Java 应用安全 131\n\n确保你的网站不会受到前一节描述的 XSS 类型攻击。如果它容易受到 XSS\
    \ 攻击，那么你为防止 CSRF 攻击所做的任何努力都是徒劳的。\n\n要在 HTML5 客户端应用程序中实现任何类型的 CSRF 预防，你需要与应用程序服务器端的操作配合。你用于防止\
    \ CSRF 的技术被称为“双重 Cookie Cookie”（double-spending cookies）。该技术涉及从最初请求的网页发送的 cookie\
    \ 中读取会话 ID（session ID）。使用 JavaScript 将相同的会话 ID 放入应用程序中所有表单的隐藏字段中，并将其附加到任何从应用程序返回服务器的\
    \ AJAX 调用中。在将 session ID 值传回服务器时，它通常被称为 CSRF 令牌。\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_150_0.png)\n\
    \n> 永远不要在 GET 方法类型的 AJAX 调用上设置 CSRF 令牌。这样做可能会导致 CSRF 令牌暴露在许多不同的地方（服务器日志、浏览器日志、网络监视器等）。\n\
    \n使用与列表 6-4 类似的代码允许你将当前的 session ID 回传给服务器，然后服务器将检查其是否与 cookie 中的 session ID 匹配。使用这种技术，服务器极不可能从另一个网站收到一个既具有正确的\
    \ session cookie 又在隐藏表单元素中有相同 session ID 的请求。\n\n### 列表 6-4 CSRF 隐藏表单令牌\n\n```\n\
    <form action=\"servlet/formsubmission\" method=\"post\">\n  <input type=\"hidden\"\
    \ name=\"CSRFToken\" value=\"secret_key\">\n</form>\n<script>\n  document.getElementById('csrf').setAttribute('value',\n\
    \  getCookie('Session'));\n</script>\n```\n\n如你所示，防止 CSRF 攻击的真正解决方案必须从服务器开始，但作为客户端开发者，你也可以尽一份之力来防止此类攻击。\n\
    \n## 点击劫持 (Clickjacking)\n\n点击劫持是另一种你必须保护 HTML5 Web 应用程序的攻击类型。为了使点击劫持成功，攻击者必须首先能够将你应用程序的网页嵌入黑客创建的网站的某种框架（即\
    \ `<iframe>`）中。黑客在其创建的看似是正常网站的网站上方堆叠了一系列透明层。当网站访问者认为他们正在点击你网站上的按钮或链接时，他们实际上在点击一个不可见的按钮。2009\
    \ 年，Chris Shlett 描述了这样一种攻击（http://shiflett.org/blog/2009/feb/twitter-dont-click-exploit），该攻击使用\
    \ Twitter 页面作为透明覆盖层。当终端用户点击“不要点击”按钮时，他们实际上是在点击隐藏的 Twitter 页面的帖子，并发送了一条由攻击者设计的推文。\n\
    \n与大多数此类攻击一样，防御点击劫持的最佳方法是从服务器端。在点击劫持的情况下，服务器端的防御是使用 `X-Frame-Options` 响应头来拒绝所有类型的框架，或仅允许来自同域的框架。然而，有一种你可以在客户端使用的编码实践可以保护你的应用程序免受点击劫持。\n\
    \n如果你无法从服务器端修改响应头，或者你需要支持不支持 X-Frame-Options 头的旧版浏览器，你可以将列表 6-5 所示的代码添加到页面的 `<head>`\
    \ 元素中，以帮助防止点击劫持攻击。这个概念来自 Aspect Security 的 Jason Li，并在此讨论：https://www.codemagi.com/blog/post/194。\n\
    \n- 列表 6-5 反点击劫持示例\n\n```\n<head>\n<style id=\"antiClickjack\">body{display:none\
    \ !important;}</style>\n<script type=\"text/javascript\">\n  if (self === top)\
    \ {\n    var antiClickjack = document.getElementById(\"antiClickjack\");\n   \
    \ antiClickjack.parentNode.removeChild(antiClickjack);\n  } else {\n    top.location\
    \ = self.location;\n  }\n</script>\n...\n</head>\n```\n\n## 第 6 章：HTML5 与 Java\
    \ 应用安全 133\n\n在页面顶部添加 `<style>` 元素可以使紧随其后的脚本知道它正在引用你的页面。如果你只单独使用代码的 `else` 部分，该表达式可以通过多种种绕过方法被破解。使用列表\
    \ 6-5 中的代码，脚本会寻找 `antiClickjack` `<style>` 元素，如果它还不是最顶层，它就会移动到顶层。这是 OWASP 推荐的从客户端防止点击劫持的方法。\n\
    \n## 身份验证与授权 (Authentication and Authorization)\n\n开发 HTML5 Web 应用程序时最明显的安全问题可能是如何处理应用程序登录。到目前为止书中介绍的所有代码示例都没有包含登录过程，但如果你的应用程序将存储特定用户的信息和/或有助于让用户当前访问你的应用程序更加愉快的信息，那么你将希望在应用程序中构建某种形式的身份验证。\n\
    \nJavaScript 应用程序常用的身份验证方法是 OAuth 标准。OAuth 是一种开放的身份验证标准。2006 年，一组开发者汇编了 OAuth\
    \ 的概念。在接下来的一年中，开发了 OAuth 草案。2007 年，OAuth 1.0 协议发布。2008 年，OAuth 规范带到了互联网工程任务组（IETF）年度会议。2009\
    \ 年，发布了 OAuth 草案。2010 年，OAuth 标准在 4 月发布为 RFC 5849。2011 年，OAuth 标准已成为 Twitter、Flickr\
    \ 等许多服务的强制性身份验证。2012 年，OAuth 2.0 规范发布为 RFC 6749。尽管它在互联网上逐渐流行，但在其开发过程中出现了许多争议。要决定在你的情况下使用哪种协议，你将需要自行研究。可以认为，如果你的应用程序需要支持直接验证，你应该从\
    \ OAuth 开始。\n\n## 134 Java EE 与 HTML5 企业级开发\n\n在不涉及协议技术细节的情况下，OAuth 允许客户端应用程序（通常是\
    \ Web 应用程序）代表用户采取行动。OAuth 2.0 的主要组件是\n\n- 客户端 (Client)\n- 授权服务器 (Authorization\
    \ server)\n- 资源服务器 (Resource server)\n- 资源所有者 (Resource owner)\n\n资源所有者是可以访问受保护资源的实体。客户端是代表资源所有者做出请求的应用程序。客户端根据用户授权对资源服务器执行操作。例如，用户可以通过登录\
    \ Google 账户（google.com 为授权服务器）通过浏览器（客户端）访问 flickr.com（资源服务器）上的图像。这种方法的优点是用户不需要创建和记住多个登录名和密码。相反，客户端在用户允许的情况下从授权服务器获取*访问令牌*bearer\
    \ token），并将其存储。然后，当需要在资源服务器访问资源时，客户端发送格式如下的特殊 HTTP 头部：\n\n```\nAuthorization:\
    \ Bearer <token_value>\n```\n\n令牌值对客户端来说是不透明的，但资源服务器可以对其解码，以便服务器检查客户端是否代表用户有权访问该资源。\n\
    \n如果你的应用程序将作为需要用户验证的大型企业环境的一部分使用，那么你的应用程序可能不需要提供独立的身份验证。如果你确实需要在应用程序中包含一些身份验证，有许多不同语言、不同授权服务器和资源提供者提供的库提供了\
    \ OAuth 支持。在决定你的安全基础设施之前，值得查看它们。\n\n在典型的企业环境中，你的应用程序将是更大的应用程序服务器安装的一部分。该应用程序服务器将为你的应用程序执行身份验证，用户在通过验证之前无法进入你的应用程序页面。\n\
    \n"
