    # HTML5 Client Application for WebSocket


    The client-side code for the tic-tac-toe application that you''ve been working
    on so far is all located in the Web Pages folder in the NetBeans IDE navigator
    window, as shown in Figure 4-1. Over the next sections of this chapter, you will
    build the client code that connects to the WebSocket service created in previous
    sections.


    # HTML5 Application Setup


    The client side of this tic-tac-toe application is created using a couple of different
    JavaScript frameworks. Twitter Bootstrap is used for the basic look and feel,
    as well as to enable the application to resize the browser window changes size—called
    responsive design (covered in more detail in Chapter 5). The second framework
    is Knockout.js.


    Listing 4-4 shows how index.html file is set up to load all the dependencies.


