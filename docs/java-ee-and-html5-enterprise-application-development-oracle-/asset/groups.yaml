    \ 145\n\n# 致谢\n\n感谢 Liza Lyons 在视觉化 Book Club 示例应用程序布局方面提供的帮助。非常感谢编辑们：从技术到校对。一位优秀的编辑能将技术思维作者的“涂鸦笔记”变得如此出色，这真是不可思议。与\
    \ Oracle Press 团队的其他成员一起工作是一种乐幸，当然，非常感谢我的合作者们。\n-John Brock\n\n诚心感谢 Brandi Shailer\
    \ 和 Amanda Russell 在整个过程中的引导。非常感谢 John Yeary 提供的扎实的技术评审，展示了他对该领域的渊博知识。如果没有我的两位合作者以及\
