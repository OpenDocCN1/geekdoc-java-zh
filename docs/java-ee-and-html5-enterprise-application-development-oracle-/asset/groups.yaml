    # 12 Java EE HTML5 Enterprise Application Development


    HTML5 specification, each browser vendor can, and implemented how they behave
    when they are rendered. It is the intent of the specification that the vendor
    will be able to provide a user interface for better integration with each of these
    input types. For instance, if a browser renders an input field with the type set
    to "Date", the end user would see a date picker displayed to select the date that
    they wish to enter. Unfortunately, this is one of the areas in which browser vendors
    currently have the largest separation in functionality. On mobile devices, the
    experience is better. You will often find when you click or touch in an input
    field that has the type set to "number", you will get a number pad instead of
    the normal keyboard, or a different type of keyboard will be displayed if the
    input field is set to something like "url".


    # Parts of an HTML5 Application


    One of the most misconceptions about HTML5 applications is that they are composed
    of HTML5 only. In fact, in all cases the application is actually made up of at
    least three components: HTML5, JavaScript, and Cascading Style Sheets (CSS). By
    combining all of the new media query feature of CSS version 3 (CSS), you can display
    the same content with different layouts device sizes. This method of modifying
    the content to respond to the device''s available display size is called *responsive
    design*; the layout responds to the display size that it is rendered.


    There are a few important caveats to note about responsive design. First, although
    it does allow you to create a website that will have the same look and feel across
    multiple device sizes, the HTML5 application is still a web page that is being
    viewed in a web browser on a smaller device such as a smartphone or tablet. The
    application will not have a true “native” look and feel like an application that
    is written and compiled for a specific type of mobile device. Second, HTML5 and
    responsive design may not be the answer for developers who want their application
    to have access to specific mobile features such as the camera, contact list, and
    calendar. Because the application is running in a web browser, you can only program
    your application to use what the browser allows you to interact with.


    As previously mentioned, the third component commonly used in HTML5 applications
    is JavaScript. The introduction of JavaScript architectural libraries has been
    a big factor in making it more acceptable to enterprise developers.'
- md: "\n## Chapter 1: Introduction to Java EE and HTML5 Enterprise Development 13\n\
    \nDeveloping an application in an enterprise environment often means the separation\
    \ of development tasks, with designers and UI teams working on the front end or\
    \ view layer, while other teams are working on the data and controller layers.\
    \ This type of separation between application layers is referred to as a Model-View-Controller\
    \ (MVC) architectural pattern. Over the past few years, JavaScript libraries have\
    \ been developed to introduce a similar architecture, called Model-View-ViewModel\
    \ (MVVM).\n\nMVVM was originally developed by Microsoft in 2005 as part of its\
    \ Windows Presentation Foundation (WPF). A JavaScript implementation of this architectural\
    \ pattern was introduced as an open source project in 2010 by Steve Sanderson.\
    \ It was released under the name of Knockout.js (http://knockout.com/) and has\
    \ quickly gained popularity among JavaScript developers who are already familiar\
    \ with the MVC development practices. While a deep understanding of MVVM, and\
    \ more specifically Knockout.js, is beyond the scope of this book, you will use\
    \ Knockout.js in Chapter 5 when creating an HTML5 application that will consume\
    \ and interact with web services such as REST, WebSockets, and Server-Sent Events\
    \ (SSE).\n\n## Summary\n\nYou've learned what's new in the Java EE 7 specification\
    \ in the area of web services that are used for developing the specific services\
    \ that an HTML5 application will need. You've also been shown some of the new\
    \ features in the HTML5 specification and the specific technologies that are required\
    \ to develop a client-side HTML5 application. This introduction to the current\
    \ state of development tools will help you throughout the rest of this book as\
    \ you work with the coding concepts and samples.\n\nAs you can see, both Java\
    \ EE web development and HTML web development have matured over the past few years\
    \ towards the common trend of providing Software as a Service. In keeping with\
    \ this development trend, tools such as NetBeans IDE have evolved to provide features\
    \ that make it easier than ever to combine these two types of technologies.\n\n\
    In the next chapter, you will dive into the Java EE 7 Persistence API to learn\
    \ how to create and maintain a data store for your HTML5 application.\n\n## CHAPTER\
    \ 2\n## Persistence\n\n## 16 Java EE and HTML5 Enterprise Application Development\n\
    \nData is an integral part of any application and typically defines the state\
    \ of an application at any given point of time. Persistence is the characteristic\
    \ of an application state that outlives the process that created it. Absent persistence,\
    \ application data would be lost when the application terminates. If a banking\
    \ application could not persist information about the accounts, application would\
    \ be useless. Similarly, if a retail store application could not persist information\
    \ about the inventory, customer orders, and shipments, it would be of no value.\
    \ Persistence allows applications to access the data and perform CRUD (create,\
    \ read, update, and delete) operations that change the data's state. After an\
    \ application crashes unexpectedly and then recovers, persistence enables the\
    \ application to use the data in the exact state that it was in at the time of\
    \ the crash.\n\nThere are many ways to persist data in Java. Java Platform, Standard\
    \ Edition (Java SE) provides APIs to manipulate streams and files. This requires\
    \ lots of low-level handling, such as defining the stream location and names,\
    \ opening and closing streams, and defining a data format. The Java Database Connectivity\
    \ (JDBC) API can be used to store data to a relational database such as an Oracle\
    \ or MySQL database server. This requires managing database connections, writing\
    \ SQL queries, mapping results with Java objects, and a lot more. Different NoSQL\
    \ data stores provide APIs to manage data specific to those data stores. The majority\
    \ of data is persisted in databases, specifically relational databases.\n\nThe\
    \ Java EE platform provides the Java Persistence API (JPA) for the management\
    \ of persistence and object/relational mapping. In other words, a POJO (Plain\
    \ Old Java Object) can be used to represent a table in the relational database,\
    \ and each class instance corresponds to a row in that table. The API defines\
    \ how these rows can be managed using the POJO.\n\nData stored in a relational\
    \ database should maintain ACID (atomicity, consistency, isolation, durability)\
    \ properties. To help ensure that ACID properties are maintained, it is very important\
    \ to ensure that any update, or deletion of data is done within a transactional\
    \ boundary. The transactions can be container-managed or user-managed. Container-managed\
    \ transactions can be managed either by the Enterprise JavaBeans (EJB) container\
    \ or by using the @javax.transaction.Transactional annotation provided by the\
    \ Transaction API (JTA). In this, a transaction is automatically started by the\
    \ container and then either committed or rolled back by the container. A user-managed\
    \ transaction is explicitly started and then either committed or rolled back by\
    \ the user.\n\nThis chapter will introduce the main concepts of JPA, how an entity\
    \ can be created, queried, and updated. Text-based Persistence Query Language\
    \ (JPQL) and type-safe Criteria API are explained. Finally, database schema generation\
    \ using NetBeans tools and wizards are explained.\n\n## JPA Entity\n\nJPA defines\
    \ an entity as a lightweight domain object. Any POJO with a no-args constructor\
    \ can be an entity. A JPA entity defining the author is shown in 2-1.\n\nListing\
    \ 2-1 Author Entity\n```java\n@Entity\n@Table(name = \"AUTHOR\")\npublic class\
    \ Author implements Serializable {\n    private static final long serialVersionUID\
    \ = 1L;\n    @Id\n    private Integer id;\n\n    @NotNull\n    @Size(min = 1,\
    \ max = 20)\n    private String firstName;\n\n    @Size(max = 20)\n    private\
    \ String lastName;\n\n    @Size(max = 1000)\n    private String bio;\n\n    @Size(max\
    \ = 30)\n    private String email;\n    public Author() { }\n    // other constructors\n\
    \n    // getters and setters\n}\n```\n\n## Java EE and HTML5 Enterprise Development\n\
    \nLet us walk through this code:\n\n- @javax.persistence.Entity annotation on\
    \ a POJO specifies that this is an entity. The default name of the entity is the\
    \ unqualified name of the class. An optional name attribute may be used to specify\
    \ the entity name, which is then used to refer to the entity in queries.\n- @javax.persistence.Table\
    \ is an optional annotation on an entity and specifies the primary table for the\
    \ annotated entity. Additional tables may be specified using SecondaryTable or\
    \ SecondaryTables annotation.\n\nIf no @Table annotation is specified on the entity,\
    \ or the annotation is specified by no name attribute, then the generated table\
    \ defaults to the entity name.\n\n- Implementing the Serializable interface allows\
    \ the class to be passed by value through a remote interface.\n- The properties\
    \ of the bean that follow the JavaBeans-style accessors (\"property access\")\
    \ or instance variables (\"field access\") represent the persistent state of the\
    \ entity. The persistent fields or properties of an entity class can be from a\
    \ wide range of types, such as Java primitive types, any primitive wrapper type,\
    \ other fine-grained classes defined using @javax.persistence.Embedded and known\
    \ as embeddables, a collection of embeddables, and many other types.\n\nThe, firstName,\
    \ lastName, bio, and email have getters and setters that are omitted for brevity\
    \ in this code. Each of these fields will map to a column in the database table.\n\
    \nReasonable default column names are used for properties and fields. For example,\
    \ the column name ID is used for the id property, and the column name FIRST_NAME\
    \ is used for the firstName property. Optionally, a @javax.persistence.Column\
    \ annotation may be used to override the name of the mapped column.\n\n- @javax.persistence.Id\
    \ annotation specifies the primary key of an entity. The field or property to\
    \ which this annotation is applied\n"
  mdcn: "\n\n## 第1章：Java EE 和 HTML5 企业级开发简介 13\n\n在企业环境中开发应用程序通常意味着开发任务的分离，设计师和 UI\
