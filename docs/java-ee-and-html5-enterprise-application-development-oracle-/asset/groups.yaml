    \ order they are listed, but each file will overwrite any previously set style\
    \ classes. A concept of last in wins. If you happened to have the same rule defined\
    \ in multiple files, the file in which the rule would take effect depended on\
    \ the order in which the files were listed in your HTML code. In 2007, SASS was\
    \ introduced by a developer named Hampton Catlin. The development of SASS is continued\
    \ today by Nathan Weizenbaum and Chris Epstein.\n\nThe original stylesheet language\
    \ was designed to be similar to the Haml (HTML abstraction markup language) programming\
    \ language in its use of an indentation syntax, this style really doesn't look\
    \ or feel like CSS at all. This syntax is most referenced with a file extension\
    \ of .sass. A newer syntax has been called Sassy CSS, or SCSS, which is designed\
    \ to look and feel exactly like CSS itself—so much that any valid CSS code is\
    \ also a valid subset of SCSS. This syntax is most often referred by a file extension\
    \ of .scss.\n\nSASS works as a preprocessor of the SASS or SCSS files and compiles\
    \ these separate files into one or more CSS files that you can reference in your\
