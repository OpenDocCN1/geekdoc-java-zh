    \n- 生命周期事件：`onopen()`, `onerror()`, `onClose()`\n- 消息：`onmessage()`\n\n## WebSocket\
    \ Java API\n\nWebSocket Java API 定义了一组用于开发 WebSocket 应用的 Java API。该 API 允许你定义服务器或客户端。你可以通过使用\
    \ WebSocket 的注解装饰 POJO 来定义服务器或客户端。在本章中，我们将使用 WebSocket 构建经典的井井棋游戏。在游戏中，两个玩家（标识为\
    \ X 和 O）交替在由三行三列组成的九宫网格中标记。在水平、垂直或对角线方向上成功放置三个标记的玩家获胜游戏。游戏的注解端点如列表 4-2 所示。\n\n\
    ### 列表 4-2 WebSocket 注解\n\n```\n@Endpoint(value = \"/endpoint\",\n    decoders\
    \ = BoardDecoder.class)\npublic class TicTacToeEndpoint {\n    private static\
