    # Server-Sent Events


    Typically, a client initiates a request to the server and receives a response.
    Server-Sent Events (SSE) is a mechanism that allows the server to asynchronously
    push the data from the server to the client whenever a new “chunk” of data is
    available. The client is still responsible for establishing the connection with
    the server. When new data is ready to be sent on the server, the server sends
    the data event to the client, hence the name, Server-Sent Events.


    A server-event is generated on the server side with a predefined media type of
    text/event-stream. There is no restriction for a media type used in individual
    event messages. On the client side, the standard EventSource JavaScript API is
    used to open an HTTP connection for receiving push notifications from the server.
    These events are received in callback handlers registered in the client JavaScript
    and are used to update the client.


    Note that SSE will be a final specification along with the rest of HTML5. This
    is targeted to be final in late 2014. Until then, SSE cannot be added as a standard
    API to JAX-RS. However, the JAX-RS reference implementation, Jersey, has added
    support for SSE. This chapter will use Jersey to implement that functionality
    in our application and explain SSE.'
