    to get the attribute will work with all browsers.


    ![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_100_0.png)


    +   - The createJSON() function returns the formatted JSON as a JSON object that
    it can be used in the cellImage() function that you looked at earlier in Listing
    4-11.


    +   - Once the image and game status have been set properly, the JSON object is
    converted to a string so it can be sent to the WebSocket endpoint using the websocket.send()
    method. Remember that WebSocket data must be in either UTF-8 string format or
    a binary format of Blob or ArrayBuffer. Sending the actual JSON object will result
    in a WebSocket protocol error.'
  - "[PAGE 101]\n\n# Java EE and HTML5 Enterprise Application Development\n\nWhile\
    \ the game code used for this chapter does not make use of the Blob or ArrayBuffer\
    \ binary data types, you may want to know a little more about how they are used.\
    \ Blob is the default binary data type, and there is nothing special that you\
    \ have to do to send data in this format. Just pass in a Blob object as the argument\
    \ to the send() method, just as you would with a text string. The server code\
    \ will need to check for the type of the incoming message. Listing 4-13 shows\
    \ a possible way of checking for the message type and processing it appropriately.\n\
    \nListing 4-13 Example of Testing for Message Type\n\n```\nif (message.type ==\
    \ 'utf8') {\n    console.log('Received Text Message: ' + message);\n    ... //\
    \ do something with the string\n} else if (message.type == 'binary') {\n    console.log('Received\
    \ Binary Message: ' + message.binaryData);\n    ... // do something more with\
    \ the binary data\n}\n```\n\nFrom the client side, you would need to provide some\
    \ method for gathering the binary data and then passing that data to a function\
    \ for processing and sending to the WebSocket connection. Listing 4-14 shows one\
    \ possible solution: using an input type of file and allowing the end user to\
    \ select a file and send it to the WebSocket stream.\n\nListing 4-14 Example of\
    \ Client-Side Code for Sending Binary Data\n\n```\ndocument.getElementById(\"\
    binary\").addEventListener('change', sendBinary, false);\nfunction sendBinary(evt)\
    \ {\n    var file = evt.target.files[0];\n    socket.binaryType = \"arraybuffer\"\
    ;n    var reader = new FileReader();\n    reader.readAsArrayBuffer(file);\n  \
    \  console.log('file.size: ' + file.size);\n    reader.onload = function(e) {\n\
    \        socket.send(e.target.result);\n    };\n}\n```"
  - '[PAGE 102]


    Let’s take a quick look at the code in Listing 4-14:


    +   - The first line is adding an event listener to an input element of type file
    in the HTML markup. This input element has an id attribute set to the name "binary".


    +   - When the event listener detects a change that has happened to the input
    element, it will call the sendBinary () function. This function uses the event
    object that the listener sent by default to get the file that the end user selected.


    +   - The sendBinary () method then sets the binaryType property of the WebSocket
    connection to be a type of ArrayBuffer.


    +   - At this point a FileReader object is created and the contents of the file
    are read into it using the FileReader readAsArrayBuffer () method.


    +   - Finally, the FileReader has completed the loading of the data, the data
    is sent over the WebSocket connection.


    > NOTE

    Should be noted that the FileReader API is new to HTML5 and is not implemented
    by all browsers. Specifically, Internet Explorer 9 and any version of Safari older
    than 6.0 do not support it.


    ![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_102_0.png)


    # Summary


    In this chapter you have learned about what the WebSocket protocol is, and how
    the APIs for both Java and JavaScript are used to interact with the WebSocket
    protocol on the server and in a pure client-side HTML5 application. You have learned
    how to work with the Java API for JSON to read and generate JSON objects on the
    server.


    On the client side, you learned how to work with String and JSON object data to
    manipulate the HTML DOM elements and interact with the game board using the Knockout.js
    MVVM architectural pattern.


    One thing that you may have noticed while either playing the game or reading all
    of the Knockout observables in the boardViewModel() is that there is not a scoring
    system implemented in the game. This omission is'
  - '[PAGE 103]


    intentional. It is now up to you to take what you have learned and add the client-
    and server-side code that can store and manage the game state. The Knockout observables
    of win, lose, and tie are already in place and ready for you to use with the gameStatus
    system that is in place.


    In Chapter 5 you will learn more details about working with HTML5, JavaScript,
    and CSS. The Knockout.js library will also be given more attention.'
