    +   - setTimeout


    +   - setInterval


    +   - new function ()


    In general, if you are working with untrusted data, set up your HTML so you can
    use the element''s .textContext method, as shown in Listing 6-3, instead of trying
    to add HTML directly.


    # Listing 6-3 textContext Example


