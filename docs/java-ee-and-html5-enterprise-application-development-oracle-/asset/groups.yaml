    # 16 Java EE and HTML5 Enterprise Application Development


    Data is an integral part of any application and typically defines the state of
    an application at any given point of time. Persistence is the characteristic of
    an application state that outlives the process that created it. Absent persistence,
    application data would be lost when the application terminates. If a banking application
    could not persist information about the accounts, application would be useless.
    Similarly, if a retail store application could not persist information about the
    inventory, customer orders, and shipments, it would be of no value. Persistence
    allows applications to access the data and perform CRUD (create, read, update,
    and delete) operations that change the data''s state. After an application crashes
    unexpectedly and then recovers, persistence enables the application to use the
    data in the exact state that it was in at the time of the crash.


    There are many ways to persist data in Java. Java Platform, Standard Edition (Java
    SE) provides APIs to manipulate streams and files. This requires lots of low-level
    handling, such as defining the stream location and names, opening and closing
    streams, and defining a data format. The Java Database Connectivity (JDBC) API
    can be used to store data to a relational database such as an Oracle or MySQL
    database server. This requires managing database connections, writing SQL queries,
    mapping results with Java objects, and a lot more. Different NoSQL data stores
    provide APIs to manage data specific to those data stores. The majority of data
    is persisted in databases, specifically relational databases.


    The Java EE platform provides the Java Persistence API (JPA) for the management
    of persistence and object/relational mapping. In other words, a POJO (Plain Old
    Java Object) can be used to represent a table in the relational database, and
    each class instance corresponds to a row in that table. The API defines how these
    rows can be managed using the POJO.


    Data stored in a relational database should maintain ACID (atomicity, consistency,
    isolation, durability) properties. To help ensure that ACID properties are maintained,
    it is very important to ensure that any update, or deletion of data is done within
    a transactional boundary. The transactions can be container-managed or user-managed.
    Container-managed transactions can be managed either by the Enterprise JavaBeans
    (EJB) container or by using the @javax.transaction.Transactional annotation provided
    by the Transaction API (JTA). In this, a transaction is automatically started
    by the container and then either committed or rolled back by the container. A
    user-managed transaction is explicitly started and completed by the user. in'
