    of the many HTML and JavaScript encoders that are available. You could try to
    use an encoder yourself, but doing so can be tricky because each browser''s JavaScript
    engine can handle things a little bit differently. You are better off using an
    encoder that has been developed by a trusted security team, such as the Enterprise
    Security API (ESAPI) that is available from the Open Web Application Security
    Project (OWASP) team.


    You should also be aware that using a JavaScript framework like jQuery poses the
    same issue. Using code as such


    ```

