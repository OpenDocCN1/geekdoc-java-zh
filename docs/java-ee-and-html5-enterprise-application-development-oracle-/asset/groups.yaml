    The data passed into the addBook() function contains an array of the HTML elements,
    and you will assign the value, from those elements that you need, to the fields
    that are expected by the REST service. In this case, the array includes the five
    fields shown in Listing 5-10. When you are sending data to the REST service, you
    have to know in which format each field is expecting its value to be sent. For
    example, when the publishedDate field is being set, the REST service expects a
    Date to be sent for this field, so you will need to transform the data from the
    form into the appropriate format.


    Data validation can be done in two ways at this point. You can use built-in validation
    functionality from the client-side frameworks, such as Twitter Bootstrap, to make
    sure that the data entered into the form is in the proper formats before the submit
    event fired, and/or you can perform validation on the data as you are assigning
    it to the JSON object. The sample application provided doesnt perform any client-side
    validation. It does, however, provide a hint on the Published Date form field
    to help the end user know which format is expected for this field:


    ```

    <input id="bookPublishedDate" type="text" class="form-control" placeholder="mm-dd-yyyy"
    />

    ```


    Knowing which specific HTML element contains the data that you want to assign
    to a specific field in your JSON object may be tricky if you also have included
    elements in your form that you don''t to use. NetBeans IDE provides a JavaScript
    debugger that is very useful for determining what is in the data object returned
    to the function. Figure 5-2 shows an example of how the debugger can be used to
    determine which elements you need to achieve the code shown in Listing 5-10. Clicking
    on the left-hand gutter of your JavaScript file will place a breakpoint on that
    line, as shown for line 141 in Figure 5-2. When the form is submitted in the browser,
    the IDE will stop at this line. You can hover over the da variable to see the
    value of it in the tooltip. Expanding it will show each of the elements in the
    data object and their values. Of course, you can also see this debugger information
    in the Variables window at the bottom of the IDE if you don''t to use the tooltip
    approach.'
- md: "\n# Java EE and HTML5 Enterprise Application Development\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_123_0.png)\n\
    \nFIGURE 5. NetBeans JavaScript debugger example\n\nNow that you have submitted\
    \ the request to add the book to the REST service, you may have to finish any\
    \ changes to the View layer that may be affected by the result of the POST request.\
    \ Taking another look at Listing 5-7, you will see the two callback functions\
    \ for success and error. If there is an error, you should do something to the\
    \ end user that the request didn't work. In this example, an alert is called with\
    \ the error status and an alert that returns the result of the error:\n\n```\n\
    error: function(xhr, status, errorThrown) {\n    alert('Error adding new book:\
    \ ' + status + ' ' + errorThrown);\n}\n```\n\nIn the case where the request is\
    \ successful, you will want to add the same JSON data that you sent to the server\
    \ to the existing Knockout observableArray that your View is bound to. In Listing\
    \ 5-7, the line of code booksVM.Books.push(new bookModel(json)); creates a new\
    \ Model object out of the JSON data and pushes it into the observableArray booksVM.Books().\
    \ Because Books is a Knockout observableArray, just adding the new Model object\
    \ will cause an event to be fired, and the HTML that is bound to the foreach binding\
    \ will automatically update itself.\n\n## Update, Using the PUT Request (U of\
    \ CRUD)\n\nThe process for updating a record is the same as the process for creating\
    \ a new entry, as covered in the previous section. You will want to see the details\
    \ for the books that you are going to edit. Listing 5-11 shows how the HTML is\
    \ coded to list all of the books in your service.\n\n- Listing 5-11 Example of\
    \ Knockout foreach: Binding\n\n```\n<div class=\"item active\" data-bind=\"foreach:\
    \ Books\">\n  <div id=\"bookCoverPhoto\" class=\"bookCoverPhoto col-md-3\" data-bind=\"\
    click: getBookDetails\">\n    <a class=\"thumbnail\">\n      <img alt=\"book cover\
    \ photo\" data-bind=\"attr: {src:'/'+image+'.jpg'}\\ />\n      <div class=\"caption\"\
    \ data-bind=\"text: title\" style=\"margin-left:10px\"></div>\n      <div id=\"\
    isbn\" class=\"hidden\" data-bind=\"text:isbn\"></div>\n    </a>\n  </div>\n</div>\n\
    ```\n\nThe Knockout binding of foreach: is used to display each item in Books\
    \ with the same look and feel. Books is the Knockout observableArray from your\
    \ ViewModel. The most important element in the HTML code is actually a <div> that\
    \ contains the ISBN for each book. The ISBN is a unique ID for each book, which\
    \ will allow you to make another REST call to get the information about one specific\
    \ book. Notice that each of the <div id=\"bookCoverPhoto\"> elements for the book’s\
    \ cover image, title, and ISBN has a click: binding to the function getBookDetails().\
    \ This function will load the page that shows all the details about a specific\
    \ book.\n\nListing 5-12 shows this function.\n\n## Listing 5-12 getBookDetails\
    \ Function\n\n```javascript\nfunction getBookDetails(data) {\n  var bookData =\
    \ $(data);\n  ko.cleanNode('#mainPage'));\n  $('#mainPage').load('bookDetails.html',\
    \ function() {\n    var vm = new bookDetailsViewModel(bookData);\n    ko.applyBindings(vm,\
    \ document.getElementById('bookInfo'));\n    ko.applyBindings(vm, document.getElementById('bookDialogContainer'));\n\
    \  });\n}\n```\n\nLet's take a look at this code:\n\n- The first line simply sets\
    \ a local variable, bookData, to contain the data from the page that you just\
    \ left.\n- The entire sample application that you have been working with so far\
    \ is designed as a single-page application. This means that the application doesn't\
    \ change URLs and load a new page when a request is made, but rather loads a new\
    \ page fragment, or template, into a specific section of the larger page. In case\
    \ of this application, the index.html page has been designed to have the header\
    \ and footer code and a single <div> in the body of the page to contain all the\
    \ other page templates. This <div> has an ID of mainpage. Because Knockout allows\
    \ you to have only one binding to a DOM element at one time, you need to clear\
    \ out the existing binding and adding the new bindings as you load the new page\
    \ template.\n- ko.cleanNode ($('#mainPage')); clears out the mainpage DOM element,\
    \ $('#mainPage').load('bookDetails.html', function() loads the new page template\
    \ into that same DOM element.\n- In the callback function for the .load method,\
    \ you will set the new ViewModel and bind that ViewModel to two separate DOM elements.\
    \ The first is the container for all of the individual book details, and the second\
    \ is the container for the modal dialogs. The dialogs will be used for updating\
    \ the details for this book and as a confirmation of whether to delete the book\
    \ or not.\n\nOnce you call the Knockout applyBindings() call, the bookDetailsViewModel()\
    \ ViewModel will be processed. Listing 5-13 shows this ViewModel code.\n\n## Listing\
    \ 5-13 Example of bookDetailsViewModel Function\n\n```javascript\nfunction bookDetailsViewModel(data)\
    \ {\n  var self = this;\n  self.bookAuthor = ko.observable('');\n  self.serviceURL\
    \ = serviceRootURL + \"books/\" + data.isbn() + \"/authors\";\n  self.isbn = ko.observable(data.isbn());\n\
    \  self.publisher = ko.observable(data.publisher());\n  self.publishedDate = ko.observable(data.publishedDate());\n\
    \  self.title = ko.observable(data.title());\n  self.description = ko.observable(data.description());\n\
    \  $.JSON(self.serviceURL, function(result) {\n    if (result.length > 0) {\n\
    \      self.bookAuthor(result[0].firstName + \" \" + result[0].lastName);\n  \
    \  } else {\n      self.bookAuthor(\"Unknown\");\n    }\n  }, this);\n```\n\n\
    When you created the new instance of the bookDetailsViewModel() in the getBookDetails()\
    \ function, you passed the bookData variable. This means that you have all of\
    \ the information you need for that specific book and can assign those values\
    \ to Knockout observables for use in your View. However, the Author information\
    \ is not included in that data. The Author details are kept in a separate table.\
    \ There is a REST API for getting the details for a specific book, though. In\
    \ the fourth line of code in 5-13, you can see that you are setting a variable\
    \ called self.serviceURL to point to that API. Further down in 5-13 you make a\
    \ getJSON() call to get the details:\n\n```\n$.JSON(self.serviceURL, function(result)\n\
    ```\n\nIn your database, Author is not a required field, so this API could return\
    \ successfully and still not contain information. Because of this, the code is\
    \ testing to see the length of the returned data is larger than zero; if it is,\
    \ the code sets the Knockout observable for the author's name to be a concatenation\
    \ of the first and last name. If the returned data doesn't contain any information,\
    \ the code sets the author to Unknown.\n\nNow that you have loaded the new page\
    \ template for book details and have pulled into the appropriate data to populate\
    \ the page, you can take a look at how to allow your user to edit the book data.\n\
    \nListing 5-14 shows that at the top of the book details template there a click:\
    \ binding added to an icon for Edit and another icon for Delete. Both of these\
    \ functions do nothing more than load and display the dialogs for their specific\
    \ purposes.\n\n## Listing 5-14 Examples of Icons for Edit and Delete\n\n```\n\
    <div id=\"bookTitle\" class=\"bookTitle col-md-5\" data-bind=\"text:title\">See\
    \ Me</div>\n<div class=\"bookTitle col-md-4\">\n<img class=\"bookTitleAction\"\
    \ src=\"css/img/pencil-16x16.png\" data-bind=\"click: showUpdateDialog()\"/>\n\
    <img class=\"bookTitleAction\" src=\"css/img/delete-16x16.png\" data-bind=\"click:\
    \ showDeleteDialog() />\n</div>\n</div>\n```\n\nLet's look at Listing 5-15 to\
    \ see how the updateDialog dialog is handled first.\n\n## Listing 5-15 Partial\
    \ Edit Dialog\n\n```html\n<div id=\"updateDialog\" class=\"modal fade\" tabindex=\"\
    -1\" role=\"dialog\" aria-labelledby=\"updateBookDialog\" aria-hidden=\"true\"\
    >\n  <div class=\"modal-content\">\n    <div class=\"modal-header\">\n      <button\
    \ type=\"button\" class=\"close\" data-dismiss=\"modal\" aria-hidden=\"true\"\
    >\n        <img src=\"css/img/delete-16x16.png\"/>\n      </button>\n      <h3\
    \ id=\"addBookLabel\">Edit Book</h3>\n    </div>\n    </div>\n    <form id=\"\
    updateForm\" class=\"form-horizontal\" data-bind=\"submit: updateBook\">\n   \
    \   <div class=\"modal-body\">\n        <fieldset\n```\n"
  mdcn: "\n\n# Java EE 与 HTML5 企业应用开发\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_123_0.png)\n\
    \n图 5. NetBeans JavaScript 调试器示例\n\n现在你已经提交了将书籍添加到 REST 服务的请求，你可能需要对 View 层完成任何可能受\
    \ POST 请求结果影响的更改。再次查看列表 5-7，你将看到用于成功和错误的两个回调函数。如果发生错误，你应该对用户执行某些操作，告知请求无效。在本示例中，调用了\
    \ alert 并传入错误状态以及一个返回错误结果的警框：\n\n```\nerror: function(xhr, status, errorThrown)\
    \ {\n    alert('Error adding new book: ' + status + ' ' + errorThrown);\n}\n```\n\
    \n在请求成功的情况下，你将希望把发送到服务器的相同 JSON 数据添加到你的 View 绑定的现有 Knockout `observableArray`\
    \ 中。在列表 5-7 中，代码行 `booksVM.Books.push(new bookModel(json))` 根据 JSON 数据创建一个新的 Model\
    \ 对象并将其推入可观测数组 `booksVM.Books()`。因为 `Books` 是一个 Knockout `observableArray`，只需添加新的\
    \ Model 对象就会触发事件，绑定到 `foreach` 绑定的 HTML 将自动更新自身。\n\n## 更新，使用 PUT 请求 (CRUD 中的 U)\n\
    \n更新记录的过程与上一节介绍的创建新条目的过程相同。你将希望查看你将要编辑的书籍的详细信息。列表 5-11 显示了如何编写 HTML 来列出你服务中的所有书籍。\n\
    \n- 列表 5-11 Knockout foreach 绑定示例\n\n```\n<div class=\"item active\" data-bind=\"\
    foreach: Books\">\n  <div id=\"bookCoverPhoto\" class=\"bookCoverPhoto col-md-3\"\
    \ data-bind=\"click: getBookDetails\">\n    <a class=\"thumbnail\">\n      <img\
    \ alt=\"book cover photo\" data-bind=\"attr: {src:'/'+image+'.jpg'}\\ />\n   \
    \   <div class=\"caption\" data-bind=\"text: title\" style=\"margin-left:10px\"\
    ></div>\n      <div id=\"isbn\" class=\"hidden\" data-bind=\"text:isbn\"></div>\n\
    \    </a>\n  </div>\n</div>\n```\n\n`foreach:` 的 Knockout 绑定用于以相同的样式显示 `Books`\
    \ 中的每一项。`Books` 是来自 ViewModel 的 Knockout `observableArray`。HTML 代码中最重要的元素实际上是包含每本书\
    \ ISBN 的 `<div>`。ISBN 是每本书的唯一 ID，它允许你再次调用 REST 来获取某本特定书籍的信息。注意，用于书籍封面图像、标题和 ISBN\
    \ 的每个 `<div id=\"bookCoverPhoto\">` 元素都通过 `click:` 绑定到了函数 `getBookDetails()`。该函数将加载显示该特定书籍所有详细信息的页面。\n\
    \n列表 5-12 显示了此函数。\n\n## 列表 5-12 getBookDetails 函数\n\n```javascript\nfunction getBookDetails(data)\
    \ {\n  var bookData = $(data);\n  ko.cleanNode('#mainPage'));\n  $('#mainPage').load('bookDetails.html',\
    \ function() {\n    var vm = new bookDetailsViewModel(bookData);\n    ko.applyBindings(vm,\
    \ document.getElementById('bookInfo'));\n    ko.applyBindings(vm, document.getElementById('bookDialogContainer'));\n\
    \  });\n}\n```\n\n让我们来看这段代码：\n\n- 第一行简单地设置了一个本地变量 `bookData`，包含你刚刚离开的页面的数据。\n\
    - 到目前为止你一直使用的整个示例应用程序设计为单页应用。这意味着应用程序在发出请求时不会更改 URL 并加载新页面，而是将新的页面片段或模板加载到大页面的特定部分。在本应用程序中，`index.html`\
    \ 页面被设计为包含头部和页脚代码，并在主体中有一个单个 `<div>` 来包含所有其他页面模板。这个 `<div>` 的 ID 为 `mainpage`。由于\
    \ Knockout 允许你同时对一个 DOM 元素只有一个绑定，因此在加载新页面模板时，你需要清除现有绑定并添加新绑定。\n- `ko.cleanNode($('#mainPage'));`\
    \ 清除 `mainpage` DOM 元素，`$('#mainPage').load('bookDetails.html', function()` 将新页面模板加载到同一个\
    \ DOM 元素中。\n- 在 `.load` 方法的回调函数中，你将设置新的 ViewModel并将该 ViewModel 绑定到两个独立的 DOM 元素。第一个是所有书籍书籍详细信息的容器，第二个是模态对话框的容器。对话框将用于更新此书籍的详细信息，并作为是否删除该书籍的确认。\n\
    \n一旦调用 Knockout `applyBindings()`，`bookDetailsViewModel()` ViewModel 将被处理。列表 5-13\
    \ 显示了此 ViewModel 代码。\n\n## 列表 5-13 bookDetailsViewModel 函数示例\n\n```javascript\n\
    function bookDetailsViewModel(data) {\n  var self = this;\n  self.bookAuthor =\
    \ ko.observable('');\n  self.serviceURL = serviceRootURL + \"books/\" + data.isbn()\
    \ + \"/authors\";\n  self.isbn = ko.observable(data.isbn());\n  self.publisher\
    \ = ko.observable(data.publisher());\n  self.publishedDate = ko.observable(data.publishedDate());\n\
    \  self.title = ko.observable(data.title());\n  self.description = ko.observable(data.description());\n\
    \  $.JSON(self.serviceURL, function(result) {\n    if (result.length > 0) {\n\
    \      self.bookAuthor(result[0].firstName + \" \" + result[0].lastName);\n  \
    \  } else {\n      self.bookAuthor(\"Unknown\");\n    }\n  }, this);\n```\n\n"
