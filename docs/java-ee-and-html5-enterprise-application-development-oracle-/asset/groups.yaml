    \ POJO 以成为 WebSocket 端点。该注解允许开发者使用 `value` 属性定义发布此端点的 URL。\n\n默认情况下，每个应用程序每个虚拟机（VM）会创建一个端点实例，以表示每个连接对等端的逻辑端点。在这种典型情况下，端点的每个实例处理来自一个且仅一个对等端的连接。\n"
