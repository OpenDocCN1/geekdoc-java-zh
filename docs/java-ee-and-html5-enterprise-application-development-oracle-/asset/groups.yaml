    @Produces on this method ensures that the media type of the returned type is text/event-stream.


    SseBroadcaster provides a convenient way of grouping multiple EventOutput instances
    and broadcasting new events to all the client connections grouped in the broadcaster.


    SseFeature adds support for a new entity Java type, namely OutboundEvent. This
    entity can be used to create any server outbound events. SseFeature also adds
    support for InboundEvent, which can be used for inbound client events for the
    JAX-RS Client API.


    The create () method is updated to broadcast a message to all the clients listening
    on their SSE connections. A new SSE event is built in the standard way and passed
    to the broadcaster by calling the broadcast message. The broadcaster internally
    invokes write (OutboundEvent) on all registered EventOutput instances. As mentioned
    earlier, there is no restriction on the media type for individual event messages.
    This application is sending a plain text message as a server-event.


    Individual EventOutput instances can be stored in a collection and iterated over
    the create () method. However, SseBroadcaster also internally identifies and handles
    client disconnects. When a client closes the connection, the broadcaster detects
    and removes the stale connection from the internal collection of the registered
    EventOutput instances. The broadcaster also frees all the server-side resources
    associated with the stale connection. Additionally, SseBroadcaster is implemented
    to be thread-safe so that clients can connect and disconnect at any time; SseBroadcaster
    will always broadcast messages only to the most recent collection of registered
    and active set of clients.


    In addition to addressing many other HTML5 client-specific topics, Chapter 5 will
    show you how SSE is consumed on the client side.'
