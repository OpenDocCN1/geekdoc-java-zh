- md: "\n## Featured Books +\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_117_0.png)\n\
    \nJavaScript: A Beginners Guide\nHTML5 Multimedia Developers Guide\nHTML5: A Beginners\
    \ Guide\nJava WebSockets Programming\n\n**FIGURE 5-1.** List of all books\n\n\
    part of the current View, but you do need this value when you get the details\
    \ for this book. By setting the CSS style class to \"hidden\", the actual <div>\
    \ is not rendered, but the ISBN value will be available as part of the data Knockout\
    \ passes to the function as part of the click: binding.\n\nThe final result of\
    \ putting all of the code from Listing 5-3 through Listing 5-6 together will look\
    \ like Figure 5-1 when you run it in a browser.\n\n## Create, Using the POST Request\
    \ (C of CRUD)\n\nNow that you know how to do the most common task, reading data,\
    \ with a REST service, you will learn how to add a new record to your data service.\n\
    \nFor this example, you will be adding a new book to the database. You will use\
    \ the same REST API that used for reading the list of books, /books; however,\
    \ the request type that you use will be a POST request instead of the GET request\
    \ that you used previously. Listing 5-7 shows the code for making this POST request.\n\
    \n**Listing 5-7** Example of AJAX POST Call\n\n```javascript\n.ajax(\n  url: serviceRootURL\
    \ + \"/books\",\n  type: 'POST',\n  data: JSON.stringify(json),\n  dataType: 'json',\n\
    \  contentType: 'application/json',\nsuccess: function(response, status, xhr)\
    \ {\n    booksVM.Books.push(new bookModel(json));\n    $('#addBookDialog').modal('hide');\n\
    \  },\n  error: function(xhr, status, errorThrown) {\n    alert('Error adding\
    \ Book: '+status+':'+errorThrown)\n  }\n});\n```\n\nLet's walk through the code:\n\
    \n- $.ajax({ This is the jQuery method for implementing asynchronous HTTP request\
    \ (AJAX).\n- url: serviceRootURL + \"books\", This line sets the URL that you\
    \ will make the REST call to.\n- type: 'POST', This line sets the request type\
    \ to POST. This tells the REST service that you want to add this new data to the\
    \ database.\n- data: JSON.stringify(json), The data that you pass into the request\
    \ is coming from a form, which you'll learn how to create in a little while. Since\
    \ the REST service is expecting to receive data as a JSON object, you will use\
    \ the utility method .stringify() provided by the JSON object to convert the code\
    \ into a valid JSON object.\n- dataType: 'json', This is the type of data that\
    \ you are expecting back from the server in response to json.\n- contentType:\
    \ 'application/json', This tells the server what type of data you are sending\
    \ to it in this request.\n- success: This is the callback function that is used\
    \ if the request is successful.\n- error: This is the callback function that is\
    \ used if the request fails.\n\n![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_118_0.png)\n\
    \nTIP\nTo test your error callback function, sending a request with the same value\
    \ for a field that is required to be unique. In the case of the sample application,\
    \ try adding two books with the same ISBN.\n\n## 100 Java EE and HTML5 Enterprise\
    \ Application Development\n\nThe HTML code shown in Listing 5-8 includes a Knockout\
    \ click:binding that displays the dialog which to enter the information about\
    \ new book that you want to add to the database.\n\n### Listing 5-8 click: Binding\
    \ to Show New Book Dialog\n\n```html\n<div id=\"featuredBooks\" class=\"featured\"\
    >\n  Featured Books\n  <span class=\"addNewBookIcon\" data-bind=\"click: showDialog\"\
    >\n  +</span>\n</div>\n```\n\nThis code is straightforward. The Knockout click:binding\
    \ is calling a function called showDialog. This function is using the modal dialog\
    \ functionality provided by the Twitter Bootstrap framework (with which initially\
    \ created the project) to display a modal dialog. This dialog contains a form\
    \ that gives the details for new books being added to the database. Listing 5-9\
    \ shows the HTML for the dialog. The one line of code that displays the dialog\
    \ is\n\n```javascript\n$('#addBookDialog').modal('show');\n```\n\n### Listing\
    \ 5-9 New Book Modal Dialog with Form\n\n```html\n<div id=\"addBookDialog\" class=\"\
    modal fade\" tabindex=\"-1\"\nrole=\"dialog\" aria-labelledby=\"bookLabel\" aria-hidden=\"\
    true\">\n  <div class=\"modal-dialog\">\n    <div class=\"modal-content\">\n \
    \     <div class=\"modal-header\">\n        <button type=\"button\" class=\"close\"\
    \ data-dismiss=\"modal\"\n        aria-hidden=\"true\"><img src=\"css/img/delete-16x16.png\"\
    /></button>\n        <h3 id=\"addLabel\">New Book<strong></strong></h3>\n    \
    \  </div>\n      <div class=\"form-horizontal\" data-bind=\"submit: addBook\"\
    >\n        <div class=\"modal-body\" style=\"padding: 20px;\">\n          <fieldset>\n\
    \            <div class=\"form-group\">\n              <label class=\"control-label\
