    # # Managing an Entity


    Each entity goes through create, read, update, and delete (CRUD) operations during
    its life cycle. Typically, an entity is created once, read and updated multiple
    times, and then deleted once.


    An Enterprise JavaBean (EJB; also known as enterprise beans) is typically used
    to manage the entity. An EJB instance is itself managed at runtime by an EJB container.
    The container provides all the plumbing, such as transactions, remoting, concurrency,
    connection pooling, and other such details, so that the application developer
    can focus on the business logic.


    There are two types of EJBs: session beans and message-driven beans. A session
    bean processes the message synchronously, and a message-driven bean is used to
    process messages asynchronously. There are three types of session beans: stateful,
    stateless, and singleton. A stateful session bean maintains a conversational state
    for a specific client, a stateless session bean does not contain any conversational
    state for a specific client, and a singleton session bean is instantiated once
    per application.


    A stateless session bean, by its very nature of being stateless, can be pooled
    by the container and provides much better scalability for the application. By
    default, all methods of a session bean have container-managed transactions. This
    means the EJB container implements all the low-level transaction'
  - "[PAGE 46]\n\nprotocols, such as the two-phase commit protocol between a transaction\
    \ manager and a database system, to honor the transactional semantics. The changes\
    \ to the underlying resources are all committed or rolled back accordingly.\n\n\
    A container-managed entity manager can be obtained in a stateless session bean\
    \ using dependency injection. The entity manager is then used to perform operations\
    \ on an entity.\n\nListing 2-3 shows how a stateless session bean can be used\
    \ to create or delete an entity instance.\n\n# Listing 2-3 CRUDing Author Entity\n\
    \n```\n@Stateless\npublic class AuthorSessionBean {\n    @PersistenceContext\n\
    \    EntityManager em;\n    public void addAuthor(Author e) {\n        em.persist(e);\n\
    \    }\n    public void deleteAuthor(Author e) {\n        em.remove(e);\n    }\n\
    }\n```\n\nA stateless session bean is defined by adding @javax.ejb.Stateless annotation\
    \ on the POJO. To create a new row in the database table, a new entity instance\
    \ is created using a no-args constructor or a convenience constructor. Calling\
    \ setters or assigning instance variables populates the entity values. This is\
    \ typically done in a client component such as a servlet or any other Java EE\
    \ component.\n\nA container-managed javax.persistence.EntityManager is obtained\
    \ and used within the addAuthor() method to save the entity. Similarly, an entity\
    \ instance can be removed by calling the EntityManager.remove(). The EJB container\
    \ starts a transaction before the method is invoked and commits the transaction\
    \ after the method completes. All changes made to the entity manager are stored\
    \ in the database with a transaction commit.\n\nNetBeans IDE provides a wizard\
    \ that enables you to generate EJBs. In the IDE, right-click your application\
    \ and choose New | Other | Enterprise JavaBeans | Session Bean to open the New\
    \ Session Bean wizard, shown in Figure 2-7."
