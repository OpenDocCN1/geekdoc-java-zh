  - '[PAGE 78]


    Chapter 4: WebSocket 59


    and termination of the TCP connection with each HTTP message exchange reduces
    the overall performance of the application.


    HTTP also has a high overhead for a wire protocol. A minimum set of headers must
    be exchanged on-the-wire between the client and the server in order to fulfill
    the protocol requirements. There is a processing cost associated with parsing
    these headers that further reduces the performance of an application if the number
    of message exchanges increases.


    In short, HTTP is a full-duplex and verbose protocol that is inefficient for full-duplex
    and bidirectional communication between client and server. This is exactly the
    need served by WebSocket.


    # # What Is WebSocket?


    WebSocket is a full-duplex, bidirectional protocol that uses a single TCP connection
    for exchanging messages in both directions. WebSocket is defined by two different
    specifications:


    +   - WebSocket Protocol, RFC 6455 http://tools.ietf.org/html/rfc6455

    - W3C WebSocket API www.w3.org/TR/websockets/


    RFC 6455 defines how a WebSocket connection can be established using a handshake.
    It also defines the wire protocol for WebSocket message exchange. The W3C WebSocket
    API is a JavaScript API that is implemented by different browsers. This API can
    then be used by web applications to make connections to WebSocket endpoints and
    exchange messages.


    # # WebSocket Handshake


    14.42 of HTTP 1.1 (RFC 2616) defines an upgrade mechanism that allows a transition
    from the HTTP 1.1 protocol to a different protocol. In this case, the WebSocket
    protocol. After an upgrade is negotiated between the client and the server, the
    subsequent requests use the newly chosen protocol for exchanges.


    RFC 6455 defines how a WebSocket client can make an HTTP upgrade request. This
    is called a WebSocket client handshake and is shown in Listing 4-1.'
  - '[PAGE 79]


    # 60 Java EE and HTML5 Enterprise Application Development


    # Listing 4-1 WebSocket Client Handshake


    ```

    GET /chat HTTP/1.1

    Host: server.example.com

    Upgrade: websocket

    Connection: Upgrade

    Sec-WebSocket-Key: dGhlIHNnhbBsZsSBub225jZQ=

    Origin: http://example.com

    Sec-WebSocket-Protocol: chat

    Sec-WebSocket-Version: 13

    ```


    Listing 4-1 shows a typical opening handshake request. The header fields in the
    handshake may be in any order. In this fragment, the first couple of lines are
    like a usual HTTP request, and identifying the host and URI to which the request
    is addressed. The key part to notice here is that the WebSocket protocol attempts
    to achieve bidirectional communication in the context of existing HTTP infrastructure.
    This allows the protocol to work over HTTP ports 80 and 443 and to support HTTP
    proxies and intermediaries.


    The WebSocket-related header fields in Listing 4-1 are as follows:


    +   - The Upgrade and Connection header fields mark this HTTP request as an upgrade
    request, specifically requesting an upgrade to WebSocket.


    +   - Different subprotocols can be negotiated using the Sec-WebSocket-Protocol
    header field. If you choose to define a subprotocol, that same field must be included
    on both the server and client. It is also recommended that any subprotocol be
    registered with the Internet Assigned Numbers Authority (IANA) to help avoid naming
    conflicts.


    +   - The Sec-WebSocket-Version header is returned by the server and must be set
    to a value of 13.


    +   - The Origin header field is used to protect against unauthorized cross-origin
    use of the WebSocket server by scripts using the WebSocket API in a web browser.


    +   - If the server is capable of handling this upgrade request, then it processes
    the received Sec-WebSocket-Key header field using a predefined algorithm and returns
    the generated value in the server handshake response.'
  - '[PAGE 80]


    # A typical server opening handshake response looks like this:


    ```

    HTTP/1.1 101 Switching Protocols

    Upgrade: websocket

    Connection: Upgrade

    Sec-WebSocket-Accept: s3pPLMBITxaq9KGYzzZrbK+xOo=

    ```


    The first line is an HTTP status line and indicates that the handshake was successful.
    The Upgrade and Connection header fields complete the HTTP upgrade. The Sec-WebSocket-Accept
    header field must contain the value generated by the server using the predefined
    algorithm defined by RFC 6455. All these header fields must be present in order
    for the handshake to be complete.


    Once a connection is established between the client and server, they are considered
    to be peers with equal capabilities. Each send can send messages to the other
    without waiting for the other to respond.


    Each peer can initiate the handshake by sending a Close control frame with data
    containing a specified control sequence. The receiving peer sends a Close control
    frame in response indicating that the connection is now closed.


    A peer does not send any further data after sending a Close control frame. Similarly,
    a peer discards any further data after receiving a Close control frame. The WebSocket
    closing handshake then initiates the TCP closing handshake as well.


    # WebSocket API


    The WebSocket API (www://www.w3.org/TR/websockets/) enables web pages for two-way
    communication with a remote host.


    WebSocket can send and receive text and binary data. The API provides an overloaded
    send method that can send text or binary data by taking any of the following parameters:


    +   - Text: String

    - Binary: Blob, ArrayBuffer, ArrayBufferView


    The API provides event handlers that are invoked for different lifecycle events
    and when a message is received:


    +   - Lifecycle events: onopen(), onerror(), onClose()

    - Message: onmessage()'
