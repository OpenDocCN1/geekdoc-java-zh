  - "[PAGE 96]\n\nThe code for this game you are only going to check for a couple\
    \ of specific codes, and just fall back to a generic message that shows the close\
    \ code for anything else that may be sent by the endpoint. The check for close\
    \ code 1006 is just in case the application tries to connect to the endpoint and\
    \ it's not there. You can't use the onerror () event for this case because the\
    \ WebSocket object is not completely created when this happens. It closes before\
    \ it has been completely opened. The check for close code 1000 is to indicate\
