  md: '# Introduction


    Many any books are available that cover just Java web services or just HTML5,
    but not both. So, this book strives to find a balance between what HTML developer
    should know about the Java web services they connect to and what the Java developer
    should know about the HTML5 applications that are consuming and interacting with
    the web services.


    With the resurgence of JavaScript over the past few years, Java developers are
    often faced with the need to understand how HTML5 client-based applications interact
    and consume the server-side web services that the developers have been creating.
    At the same time, HTML5 developers often find that they need to understand how
    the services applications rely on are built and configured. With the new HTML5
    and CSS3 specifications generating a lot of industry buzz and the new JavaScript
    libraries, such as AngularJS and Knockout, becoming increasingly popular, some
    Java developers may wonder whether their skills are still relevant.


    # Who Should Read This Book


    This book is ideal for developers who find they need to understand not only how
    to develop Java EE-based web services such as REST, Server Events (SSE), and WebSocket,
    but also how to develop HTML5-based clients that consume and interact with those
    web services. Whether you are primarily a Java developer looking for information
    about how HTML5 applications connect to your web services, or an HTML5 developer
    looking to better understand how the Java EE web services are created on the server
    side, this book will fit your needs.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# What This Book Covers


    The primary topics covered in this book


    +   - Java EE 7 Persistence API (JPA)


    +   - Java EE 7 API for RESTful Web Services (JAX-RS)


    +   - Java EE 7 API for WebSocket


    +   - New features of the HTML5 specification


    +   - JavaScript Model-View-View-ViewModel (MVVM) architectural pattern via Knockout.js


    +   - JavaScript API for REST, WebSocket, and Server-Sent Events (SSE)


    +   - Responsive design concepts via CSS3 features


    +   - CSS preprocessing with Syntactically Awesome StyleSheets (SASS)


    +   - Client and server security concepts for web-based applications


    These topics are covered in the following six chapters:


    +   - Chapter 1, "Introduction to Java EE and HTML5 Enterprise Development," provides
    a brief overview of the three main areas of the book: Java EE 7 web services,
    HTML5 application development, and NetBeans IDE.


    +   - Chapter 2, "Persistence," discusses the Java Persistence API (JPA) and shows
    you the key concepts for persistence and how data can be created, read, updated,
    and deleted from a relational database using JPA.


    +   - Chapter 3, "RESTful Resources," introduces you to REST, or Representational
    State Transfer, as an architectural style for distributed systems such as the
    World Wide Web. The Java EE 7 API for RESTful Web Services (JAX-RS) is covered,
    including the new support for Server-Sent Events (SSE). You are shown how to develop
    your own RESTful web service and SSE service that you will use as the data resources
    for a Book Club application that you develop in Chapter 5.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Introduction xii


    +   - Chapter 4, “WebSocket,” covers the development of both the server and client
    portions of an application using WebSocket. You learn about the Java API for WebSocket,
    as well as how to develop an HTML5 client that interacts with the WebSocket service.


    +   - Chapter 5, “HTML5, JavaScript, and CSS,” is all about HTML5 and client-side
    development. You interact with the REST and SSE services that you created in Chapter
    3. You are shown how to work with the Model-View-View-Model (MVVM) architectural
    pattern through the use of the JavaScript library, Knockout. You are introduced
    to responsive design concepts as well as CSS preprocessing techniques with Syntactically
    Awesome Stylesheets (SASS).


    +   - Chapter 6, “HTML5 and Java Application Service,” covers security concepts
    for HTML5 client applications and Java EE–based web services.


    # How to Use This Book and Code


    This book is structured such that you can read it sequentially or jump to any
    chapter and read it as a stand-alone topic. Source code is provided for all applications
    discussed in the book and is available for download at www.OraclePressBooks.com.
    This allows you to start in a later chapter and still have access to the resources
    that you would have developed had you read the earlier chapters first. For example,
    if you choose to read Chapter 5 first, in which you develop the Book Club application,
    you have access to the data resources from Chapter 3 that the application relies
    on. The source code and follow along as you read each chapter, or deploy and run
    the source code from NetBeans IDE—whichever method works best for you. Net IDE
    is used throughout the book to show you how to use wizards and other efficient
    methods of development, such as the built-in JavaScript debugger.'
