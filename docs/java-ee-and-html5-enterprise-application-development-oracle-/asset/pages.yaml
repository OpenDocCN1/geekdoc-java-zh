- img_proc: true
  md: '# Chapter 6: HTML5 and Java Application Security 133


    Adding a <style> element to the top of your page enables the script that immediately
    follows it to know it''s referencing your page. If you were to use only the else
    part of the code by itself, the expression could be defeated through multiple
    kinds of workarounds. With the code in Listing 6-5, the script looks for the antiClickjack
    <style> element, and if it''s not already the top layer, it moves to the top.
    This is the OWASP-recommended method for preventing clickjacking attacks from
