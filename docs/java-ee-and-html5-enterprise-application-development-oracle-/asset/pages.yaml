  md: '# Chapter 6: HTML5 and Java Application Security 137


    Under the covers, the client generates an HTTP Authorization header set to a base64-encoded
    string of the username, a colon character, and the password. The authorization
    method and a space (that is, "Basic ") is added before this encoded string. If
    your username is "u1" and your password is "p1", then the header will look like
    this:


    ```

    Authorization: Basic DTE6cDE=

    ```


    Using Basic Authentication with HTTPS is highly recommended because otherwise
    the username and password can be easily decoded.


    +   Digest Authentication One of the limitations of Basic Authentication is that
    the password is sent in clear text and is susceptible to man-in-the-middle attacks.
    Digest Authentication, which is Basic Authentication over an encrypted HTTP connection,
    solves this problem.


    Digest Authentication communicates credentials in an encrypted form by applying
    a hash function to the username, the password, a server-supplied nonce value,
    the HTTP method, and the requested URI.


    For your username and password, the Authorization header looks like this:


    ```

    Authorization: Digest username="u1"

    realm="file"

    nonce="06mhdNdONXUNFTMNJgxMxQ1MTEzFItUvu5MR75Khm/wtvp1E="

    uri=/webresources/authors/

    alгорит=MD5

    response="21c29c7a7c760e5c39ba46637ad4313aa

    opaque="00000000000000000000000000000000"

    ```


    Many of the security options in Digest Authentication are optional so the server
    may operate in a security-reduced mode. Even though it is slightly better than
    Basic Authentication, it is not intended to replace stronger authentication protocols,
    like client-cert. Like Basic Authentication, Digest Authentication is also susceptible
    to man-in-the-middle attacks. These types of attacks can be avoided by using HTTPS
    instead of HTTP.


    +   Form-based Authentication Form-based authentication allows customization of
    the login screen and error pages that are presented'
