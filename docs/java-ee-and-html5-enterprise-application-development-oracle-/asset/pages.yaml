    # # Managing an Entity


    Each entity goes through create, read, update, and delete (CRUD) operations during
    its life cycle. Typically, an entity is created once, read and updated multiple
    times, and then deleted once.


    An Enterprise JavaBean (EJB; also known as enterprise beans) is typically used
    to manage the entity. An EJB instance is itself managed at runtime by an EJB container.
    The container provides all the plumbing, such as transactions, remoting, concurrency,
    connection pooling, and other such details, so that the application developer
    can focus on the business logic.


    There are two types of EJBs: session beans and message-driven beans. A session
    bean processes the message synchronously, and a message-driven bean is used to
    process messages asynchronously. There are three types of session beans: stateful,
    stateless, and singleton. A stateful session bean maintains a conversational state
    for a specific client, a stateless session bean does not contain any conversational
    state for a specific client, and a singleton session bean is instantiated once
    per application.


    A stateless session bean, by its very nature of being stateless, can be pooled
    by the container and provides much better scalability for the application. By
    default, all methods of a session bean have container-managed transactions. This
    means the EJB container implements all the low-level transaction'
