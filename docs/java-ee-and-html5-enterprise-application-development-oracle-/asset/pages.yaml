    +   - websocket.onopen (evt) you are simply sending a message to the output variable
    saying that the connection was successful. This is the first event thrown by the
    WebSocket connection and where you would do any additional setup code if you needed
    it.


    +   - websocket.onclose (evt) you are going to check for the code given by the
    WebSocket protocol to help determine why the connection was closed. The tricky
    part with doing this is that the WebSocket protocol (RFC 6455) says only that
    the endpoint "may" send a close code, that it not has to. If a code is sent, it
    should conform with one of the close codes defined in the IETF specification (https://tools.ietf.org/html/rfc6455#section-7.4).
    The recommended codes are listed and described (quoting RFC 6455) in Table 4-1.


    | Code | Description |

    | --- | --- |

    | 1000 | Indicates a normal closure, meaning that the purpose for which the connection
    was established has been fulfilled. |

    | 1001 | Indicates that an endpoint is "going away," such as a server going down
    or a browser having navigated away from a page. |

    | 1002 | Indicates that an endpoint is terminating the connection due to a protocol
    error. |

    | 1003 | Indicates that an endpoint is terminating the connection because it has
    received a type of data that it cannot accept (e.g., an endpoint that understands
    only text data MAY send this if it receives a binary message). |

    | 1004 | Reserved. The specific meaning must be defined in the future. |

    | 1005 | Is a reserved value and MUST NOT be set as a status code in a Close control
    frame by an endpoint. It is designated for use in applications expecting a status
    code to indicate that no status code was actually present. |


    TABLE 4-1. RFC 6455 Close Codes'
