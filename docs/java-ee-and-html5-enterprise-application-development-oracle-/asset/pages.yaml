  md: '# About the Authors


    John Brock is a Principal Product Manager for Oracle Corporation. John has over
    15 years’ experience working with web application development. While working at
    Sun Microsystems, he was responsible for identifying emerging Internet technologies
    and how they could potentially interact with the Java Virtual Machine (JVM). John
    has worked with development teams from Ruby, Jython, Groovy, JavaFX, and more.
    His current focus is on HTML5 application development, and he is the product manager
    for the HTML5, JavaScript, and CSS3 features of NetBeans IDE. John can easily
    be reached at @peppertech.


    Arun Gupta is Director of Developer Advocacy at Red Hat and focuses on building
    community around JBoss Middleware. As a founding member of the Java EE team at
    Sun Microsystems, he spread the love for technology all around the world. At Oracle,
    Arun led a cross-functional team to drive the global launch of the Java EE 7 platform
    through strategy, planning, and execution of content, marketing campaigns, and
    programs. Arun has extensive speaking experience, including appearances in 37
    countries speaking on myriad topics, and is a javaOne Rockstar. An author of a
    best-selling book, an avid runner, a globe trotter, and a Java Champion, he is
    easily accessible at @arungupta.


    Geertjan Wielenga is a Principal Product Manager for Oracle Corporation. Geertjan
