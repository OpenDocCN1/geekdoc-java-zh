  md: '# 2 Java EE and HTML5 Enterprise Application Development


    There have been many changes taking place in the area of enterprise software development
    in recent years. Two of the largest changes are the trend toward Software as a
    Service (SaaS) and the use of HTML5 to provide a pure client-side user interface.


    In this chapter, you will be introduced to the main topics that will be covered
    throughout the book: NetBeans IDE, Java EE 7, and HTML5. You will be presented
    with information about how to obtain the applications and samples that will help
    you as you work your way through the coming chapters. Using this combination of
    IDE, platform, and HTML5 technology, you will soon be building powerful, dynamic
    enterprise applications.


    # Development Tools


    Three main development tools are used throughout this book: NetBeans IDE, Java
    EE 7, and HTML5. You will learn how to use the combination of these tools to build
    powerful, modern enterprise applications. Before you begin building applications,
    it is important to make sure you have a solid understanding of the basics of each
    of these technologies.


    # NetBeans


    NetBeans IDE is the development tool you will use throughout this book. It provides
    features such as editors, templates, and code generators that make it a perfect
    fit for creating applications using Java EE 7 and HTML5. Starting with NetBeans
    IDE 7.3, new features have been introduced to support and enhance the development
    experience with client-side web applications that utilize the HTML5 family of
    technologies. You can use this IDE to rapidly and intuitively create rich web
    applications that support the responsive design paradigm targeting desktop and
    mobile platforms simultaneously. In addition, from NetBeans 7.4 onward, you can
    use HTML5 technologies within Java EE and PHP applications.


    The NetBeans story begins in 1996, when a group of students at Charles University
    in Prague attempted to write a Delphi-like Java IDE in Java. Originally called
    Xelfi, the student project delved into what was then the uncharted territory of
    Java IDEs. Xelfi generated enough interest in the


    ![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_21_0.png)'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'developer community that, after they graduated, the students decided to put
    their new product on the market. In 1997, they formed a company and changed the
    name of the IDE to NetBeans.


    It wasn''t long before Sun Microsystems became interested in NetBeans as Sun began
    searching for Java development tools. In 1999, Sun acquired NetBeans and made
    the NetBeans IDE the flagship toolset for Java. At the time, Sun made another
    critical decision: to establish NetBeans IDE as an open source project—free to
    anyone wanted to use it. Over the years, the NetBeans IDE has become a fully featured,
    cross-platform IDE, supporting all aspects of Java application development.


    When Oracle acquired Sun in 2010, NetBeans IDE became part of Oracle, and Oracle
    made the commitment to continue to support it. Today, more people are using NetBeans
    IDE than ever before. By 2010, the one million active user was reached, and the
    NetBeans IDE community continues to innovate and grow.


    You can download NetBeans IDE from the Oracle NetBeans website. Visit://netbeans.org/downloads
    for overlook of the available distributions and to find the corresponding download
    links. You need to have either "Java EE" or "All" distribution of NetBeans IDE
    to be able to follow the instructions in this book. The instructions and code
    samples have been created in NetBeans IDE 7.4, the latest version at the time
    of writing. Subsequently released versions of NetBeans IDE should work just as
    well, if you encounter problems when using a later version, you are recommended
    to switch to NetBeans IDE 7.4.


    Having just the Java Runtime Environment (JRE) on your system is not sufficient
    for running NetBeans IDE. You need to have the Java Development Kit (JDK), which
    includes a copy of the JRE. The IDE relies on development tools and sources provided
    by the JDK. You can go to http:// oracle.com/technwork/java/index.html to find
    and download the latest version of the JDK.


    # Java EE 7


    Java Platform, Enterprise Edition (Java EE) provides a standards-based platform
    for developing web and enterprise applications. The platform consists of multiple
    components that enable developers to build these applications. Each component
    is defined using a formal specification that describes the


    ![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_22_0.png)'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Java EE and HTML5 Enterprise Application Development


    proposed component and its features. The platform is also accompanied by an application
    programming interface (API) described using Javadoc. This API is then used to
    build the application. The platform also provides some additional services, such
    as naming, injection, and resource management, that span the platform. These applications
    are then deployed in Java EE 7 containers, such as Glassfish, that provide the
    runtime support.


    There are 33 components defined in the Java EE 7 platform. The ones that pertain
    to the content of this book are described in this section. For a full list of
    the components, refer to The Java EE 7 Technologies list (www.oracle.com/technet/javaee/tech/index.html).


    One of the major themes for the Java EE 7 platform is to simplify development
    of HTML5 applications, especially the services that are needed on the server side.
    To enable that, Java API for RESTful Web Services (JAX-RS) is a component in the
    platform that defines how to develop, deploy, and invoke RESTful Web Services.
    A Plain Old Java Object (POJO) can be easily published as a Representational State
    Transfer (REST) endpoint by specifying an annotation. Regular methods can be easily
    invoked when the resource is accessed using standard HTTP verbs. A Java API to
    invoke REST endpoints is also available. Server-Sent Events (SSE), a key part
    of the HTML5 specification, is to asynchronously push data from the server to
    the client. Even though SSE is not part of the platform yet, the JAX-RS implementation
    provides support for SSE.


    WebSocket provides a full-duplex, bidirectional communication channel over a single
    TCP connection and significantly improves the latency for modern web applications.
    A new API was added to the Java EE 7 platform for building WebSocket applications.
    Just like JAX-RS, adding an annotation on a POJO converts it into a WebSocket
    endpoint. With all the excitement around WebSocket and a simplified API, Java
    EE 7 is the best platform for building your HTML5 applications.


    JavaScript Object Notation (JSON) is a key technology for data transfer within
    HTML5 applications, and certainly a lingua franca of the Web. Java EE 7 adds new
    APIs for the parsing and generation of JSON text and objects using JSON-P 1.0.
    The API allows parsing or generating the entire JSON text using only the API.
    Alternatively, the document may be structured one item at a time.


    Any web application typically requires information to be persisted in a permanent
    data store. The Java Persistence API (JPA) defines an API for the management of
    persistence and object-relational mapping using a'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Chapter 1: Introduction to Java EE and HTML5 Enterprise Development 5


    Java domain model. Consistent with the overarching theme adding an annotation
    allows a POJO to be mapped to a database table. There are reasonable defaults
    that can be overridden by annotations. The POJOs can also be used to generate
    the database tables, or even table-generation scripts. Developers can write string-based
    or type-safe queries to operate on the Java data model.


    In addition, the information from this data needs to be stored and retrieved to
    preserve the ACID (atomicity, consistency, isolation, durability) properties.
    This can be achieved using Enterprise JavaBeans (EJB) or the newly introduced
    @Transactional annotation. EJBs provide convenient container-managed transactions.
    They also come in different flavors: stateless (where there is no state on the
    server), stateful (state is stored on the server), and singleton (single instance
    per application per JVM).


    The newly added @Transactional annotation can be specified on a POJO to provide
    container-managed transactions outside of Enterprise JavaBeans. Annotating a class
    means all methods of the class are going to run inside a container-managed transaction.
    Alternatively, this annotation may be specified on a method to limit the scope
    of transaction.


    This book will cover all of these topics in detail using extensive code samples.


    In addition, the Java EE 7 platform provides several other components:


    +   Batch Applications for the Java Platform Allows noninteractive, bulk-oriented,
    and long-running tasks to be easily defined and executed. It allows item-oriented
    processing style, aka Chunk, and task-oriented processing style, aka Batchlet.
    Chunk, the primary and recommended processing style, reads, processes, and aggregates
    for writing a “chunk” number of items at a time. Each chunk is written in a container-managed
    transaction and also provides checkpoints. Batchlet is a roll-your-own batch pattern.
    It is a task-oriented processing style where a task is invoked once, runs to completion,
    and returns an exit status.


    +   Java Message Service (JMS) Provides a message-oriented middleware that allows
    sending and receiving messages between distributed systems. It provides a point-to-point
    messaging model, where a publisher sends a message to a specific destination,
    called a queue,'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Java EE and HTML5 Enterprise Application Development


    targeted to a subscriber. Alternatively, JMS provides a publish-subscribe messaging
    model where multiple publishers can publish a message to a destination, called
    a topic, which can then be subscribed to multiple subscribers. In both cases,
    publisher and subscriber are loosely coupled from each other. They only need to
    know the destination and message format.


    +   **Contexts and Dependency Injection (CDI)** Provides a type-safe dependency
    injection mechanism. A bean is "strongly typed" as it only defines the type and
    semantics of other beans it depends upon, without a string name and using the
    type information available in the Java type system. It provides "loose coupling"
    as the injection request need not be aware of the actual life cycle, concrete
    implementation, threading model, or other clients of the bean.


    +   **Concurrency Utilities** Allows adding concurrency design principles for
    existing Java EE applications. It allows an application to create user threads
    that are managed by the controller. The usual classloading context, Java Naming
    and Directory Interface (JNDI) context, and security context are propagated to
    these threads.


    +   **JavaServer Faces (JSF)** Provides the server-side user interface (UI) framework.
    It allows creation of web pages with a set of reusable UI components following
    the Model-View-Controller (MVC) design pattern. The components are bound to a
    server-side model that enables two-way migration of application data with the
    UI. JSF also defines page navigation, manages UI component state across server
    requests, and can be easily used to build and reuse custom components.


    +   **Java Servlet Technology** Allows a web client to interact using a request/response
    pattern and generates dynamic content. The container is responsible for the life
    cycle of the servlet, receives requests and sends responses, and performs any
    other encoding/decoding required as part of that function.


    Refer to The Java EE 7 Tutorial (http://docs.oracle.com/javaee/7/tutorial/doc/home.htm)
    for more details on the complete set of Java EE 7 technologies.'
