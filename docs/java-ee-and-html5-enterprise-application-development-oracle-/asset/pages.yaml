  md: '# Java Persistence Query Language


    Java Persistence Query Language JPQL is a string-based query language used to
    define queries over entities and their persistent state. JPQL allows the application
    developer to specify the semantics of queries in a portable way. The underlying
    persistence provider converts the query language to a target language, such as
    SQL, of a database or a persistent store.


    A query may be a SELECT statement (R from Read of CRUD), UPDATE statement (U from
    Update of CRUD), or DELETE statement (D from Delete of CRUD). An optional WHERE
    clause can be used to restrict the results, and a GROUP BY clause, HAVING clause,
    or ORDER BY clause can be used to aggregate the results. The query may be constructed
    dynamically or be statically defined in a metadata annotation.


    As shown in the following example, javax.persistence.NamedQuery annotation can
    be used on an entity to specify multiple JPQL queries. Each query is specified
    using @javax.persistence.NamedQuery annotation. Each query requires a name attribute
    to uniquely identify the query within the persistence unit. The query string is
    defined using the query attribute.


    ```

    @NamedQuery(name = "Author.findAll", query = "SELECT a FROM Author a")

    @NamedQuery(name = "Author.findById", query = "SELECT a FROM Author WHERE a.id
    = :id")

    ```


    In the preceding example, both the queries are statically defined. The first query
    has the name Author.findAll and is equivalent to selecting all rows from the table.
    Note that the query string is defined around the entity, and not the corresponding
    database table. This is what provides portability of JPQL over multiple databases.
    The second query has the name Author.findById, which uses a WHERE clause to restrict
    the result, and requires a parameter id to be specified.


    NetBeans IDE provides a JPQL Query dialog so that you can verify queries without
    deploying the application. Before you use it, make sure to compile the JPA entities
    in your application, these compiled classes are used by the JPQL Query dialog.
    Then, as shown in Figure 2-8, right-click'
