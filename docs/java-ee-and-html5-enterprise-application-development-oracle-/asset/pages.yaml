  md: "# Java EE and HTML5 Enterprise Application Development\n\nWhile the game code\
    \ used for this chapter does not make use of the Blob or ArrayBuffer binary data\
    \ types, you may want to know a little more about how they are used. Blob is the\
    \ default binary data type, and there is nothing special that you have to do to\
    \ send data in this format. Just pass in a Blob object as the argument to the\
    \ send() method, just as you would with a text string. The server code will need\
    \ to check for the type of the incoming message. Listing 4-13 shows a possible\
    \ way of checking for the message type and processing it appropriately.\n\nListing\
    \ 4-13 Example of Testing for Message Type\n\n```\nif (message.type == 'utf8')\
    \ {\n    console.log('Received Text Message: ' + message);\n    ... // do something\
    \ with the string\n} else if (message.type == 'binary') {\n    console.log('Received\
    \ Binary Message: ' + message.binaryData);\n    ... // do something more with\
    \ the binary data\n}\n```\n\nFrom the client side, you would need to provide some\
    \ method for gathering the binary data and then passing that data to a function\
    \ for processing and sending to the WebSocket connection. Listing 4-14 shows one\
    \ possible solution: using an input type of file and allowing the end user to\
    \ select a file and send it to the WebSocket stream.\n\nListing 4-14 Example of\
    \ Client-Side Code for Sending Binary Data\n\n```\ndocument.getElementById(\"\
    binary\").addEventListener('change', sendBinary, false);\nfunction sendBinary(evt)\
    \ {\n    var file = evt.target.files[0];\n    socket.binaryType = \"arraybuffer\"\
    ;n    var reader = new FileReader();\n    reader.readAsArrayBuffer(file);\n  \
    \  console.log('file.size: ' + file.size);\n    reader.onload = function(e) {\n\
    \        socket.send(e.target.result);\n    };\n}\n```"
  merge: -1
