  md: '# Chapter 6: HTML5 and Java Application Security 135


    application server''s methods. This is also where the concept of authorization
    comes into play. Once the application server, or the identity management system
    that the application server is using, authenticates the end user, it can then
    be used to determine if the end user has the rights, to access your application.
    In such an environment, you will need to get information from your security team
    about what kinds of checks your application will need to implement to make sure
