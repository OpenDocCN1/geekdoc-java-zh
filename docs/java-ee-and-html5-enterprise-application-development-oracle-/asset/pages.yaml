    # REST Resource Security


    The following are some other guidelines to keep in mind when securing REST resources:


    +   - Username and passwords, security tokens, or API keys should not appear in
    the URL, as these can be captured in web server logs and reused for malicious
    purposes.


    +   - Every REST resource may not need to be read (GET), created (POST), updated
    (PUT), and deleted (DELETE). Make sure that only the required HTTP methods are
    exposed in the deployment descriptor and that other methods are explicitly protected
    using the mechanism defined earlier, such as <deny-uncovered-http-methods/>.


    +   - Each user need not have access to all the REST resources. Appropriate authorization
    by defining roles using <security-role> and giving access to resources accordingly
    using <auth-constraint>.


    +   - For REST endpoints receiving multiple content types, always check the Content-Type
    header and Bean Validation constraints, as discussed in Chapter 2, to restrict
    the types.


    +   - Most-party REST APIs allow authentication and authorization with popular
    OAuth providers like Google, Facebook, and Twitter. Consider integrating these
    providers instead of creating your own infrastructure from scratch.


    # WebSocket Security


    WebSocket connections are upgraded from an existing HTTP connection. A plain WebSocket
    connection is established using the ws URI scheme, and a secure connection can
    be established using the wss URI scheme. This allows the WebSocket communication
    over standard ports 80 for plain'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# 142 Java EE HTML5 Enterprise Application Development


    text communication and 443 for secure communication, thus not requiring opening
    additional ports in firewalls. This also allows existing HTTP security mechanisms
    to apply to a WebSocket connection.


    WebSocket uses an origin-based security model commonly used by web browsers. RFC
    6454 (https://www.iet.org/rfc/rfc6454.txt) defines how user agents, such as browsers,
    isolate content retrieved from different origins (scheme, host, and port combination
    of the URL) to prevent malicious website operators from interfering with the operation
    of benign websites. Basically, content retrieved from one origin can interact
    freely with other content retrieved from that same origin, but it is restricted
    on how it can interact with content retrieved from a different origin. RFC 6455
    defines an HTTP header field, Origin, which indicates that origins are associated
    with an HTTP request. A WebSocket handshake from a browser is required to have
    this header so that subsequent requests can be serviced accordingly. However,
    this model does not work when a non-browser client initializes WebSocket connections.


    In addition to Origin field, the WebSocket opening handshake is required to have
    a Sec-WebSocket-Key field. This field is sent from the client as part of the opening
    handshake and is used by the server to prove that it received a valid WebSocket
    handshake. This helps ensure that the server does not accept connections from
    non-WebSocket clients (for example, HTTP clients) that may be abused to send data
    to unsuspecting WebSocket servers.


    As you can see, WebSocket already provides a decent level of protocol-level security.
    In addition, WebSocket endpoints in a Java EE application can be secured using
    a container security model. A WebSocket mapped to a ws:// URI is protected in
    the deployment descriptor by a listing to an URI with the same hostname, port,
    and path since this is the URL of the opening handshake. A WebSocket application
    may use Basic Authentication or form-based authentication prior to the opening
    handshake. Similarly, WebSocket authorization may be set by adding a <security-constraint>
    element to the deployment descriptor. The <url-pattern> used in the security constraint
    is used to match the request URI of the opening handshake of WebSocket. Finally,
    a <transport-guarantee> of CONFIDENTIAL allows WebSocket communication over an
    encrypted wss:// connection. This allows WebSocket applications to assign an authentication
    scheme, user roles, and a transport guarantee using standard mechanisms.'
  merge: -1
  pgno: 161
