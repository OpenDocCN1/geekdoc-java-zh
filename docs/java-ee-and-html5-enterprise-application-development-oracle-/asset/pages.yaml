    # JAX-RS Client API


    Prior to the release of JAX-RS 2.0, invoking a REST resource required writing
    boilerplate code using java .net.URL and a related set of classes. Marshaling
    and unmarshaling Java objects to resource representations had to be done manually.
    Any errors received from the endpoint had to be again again manually mapped to
    more meaningful exceptions on the client side. JAX-RS 2.0 introduces a Client
    API that can be used to invoke a REST resource from a Java application. This API
    can be used to consume any web service exposed on top of an HTTP protocol or its
    extension (e.g., WebDAV) and is not restricted to services implemented using JAX-RS.'
