  md: '# Java EE and HTML5 Enterprise Application Development


    Let us walk through this code:


    +   @javax.persistence.Entity annotation on a POJO specifies that this is an entity.
    The default name of the entity is the unqualified name of the class. An optional
    name attribute may be used to specify the entity name, which is then used to refer
    to the entity in queries.


    +   @javax.persistence.Table is an optional annotation on an entity and specifies
    the primary table for the annotated entity. Additional tables may be specified
    using SecondaryTable or SecondaryTables annotation.


    If no @Table annotation is specified on the entity, or the annotation is specified
    by no name attribute is specified, then the generated table defaults to the entity
    name.


    +   Implementing the Serializable interface allows the class to be passed by value
    through a remote interface.


    +   The properties of the bean that follow the JavaBeans-style accessors ("property
    access") or instance variables ("field access") represent the persistent state
    of the entity. The persistent fields or properties of an entity class can be from
    a wide range of types, such as Java primitive types, any primitive wrapper type,
    other fine-grained classes defined using @javax.persistence.Embedded and known
    as embeddables, a collection of embeddables, and many other types.


    The id, firstName, lastName, bio, and email have getters and setters that are
    omitted for brevity in this code. Each of these fields will map to a column in
    the database table.


    Reasonable default column names are used for properties and fields. For example,
    the column name ID is used for the id property, and the column name FIRST_NAME
    is used for the firstName property. Optionally, a @javax.persistence.Column annotation
    may be used to override the name of the mapped column. This annotation can also
    use several attributes to control the definition of the mapped column.


