  md: '# Chapter 1: Introduction to Java EE and HTML5 Enterprise Development 13


    Developing an application in an enterprise environment often means the separation
    of development tasks, with designers and UI teams working on the front end or
    view layer, while other teams are working on the data and controller layers. This
    type of separation between application layers is referred to as a Model-View-Controller
    (MVC) architectural pattern. Over the past few years, JavaScript libraries have
    been developed to introduce a similar architecture, called Model-View-ViewModel
    (MVVM).


    MVVM was originally developed by Microsoft in 2005 as part of its Windows Presentation
    Foundation (WPF). A JavaScript implementation of this architectural pattern was
    introduced as an open source project in 2010 by Steve Sanderson. It was released
    under the name of Knockout.js (http://knockout.com/) and has quickly gained popularity
    among JavaScript developers who are already familiar with the MVC development
    practices. While a deep understanding of MVVM, and more specifically Knockout.js,
    is beyond the scope of this book, you will use Knockout.js in Chapter 5 when creating
    an HTML5 application that will consume and interact with web services such as
    REST, WebSockets, and Server-Sent Events (SSE).


    # Summary


    You''ve learned what''s new in the Java EE 7 specification in the area of web
    services that are used for developing the specific services that an HTML5 application
    will need. You''ve also been shown some of the new features in the HTML5 specification
    and the specific technologies that are required to develop a client-side HTML5
    application. This introduction to the current state of development tools will
    help you throughout the rest of this book as you work with the coding concepts
    and samples.


    As you can see, both Java EE web development and HTML web development have matured
    over the past few years towards the common trend of providing Software as a Service.
    In keeping with this development trend, tools such as NetBeans IDE have evolved
    to provide features that make it easier than ever to combine these two types of
    technologies.


    In the next chapter, you will dive into the Java EE 7 Persistence API to learn
    how to create and maintain a data store for your HTML5 application.'
  merge: -1
