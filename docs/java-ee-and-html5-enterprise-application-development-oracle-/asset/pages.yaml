  md: '# Summary


    The HTML5 specification provides many new features that also bring their own potential
    security issues. While this book is focused specifically on HTML5 interactions
    with web services of REST, WebSocket, and Server-Sent Events, there may be other
    areas that you will want to research, such as local-storage, geolocation, and
    more.


    The Open Web Application Security Project (OWASP) is a worldwide, not-for-profit
    organization whose main focus is on improving security in software. This organization''s
    website (www.owasp.org) is a great resource for researching existing and potential
    security issues in all areas of HTML5 development.'
