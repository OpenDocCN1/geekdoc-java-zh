    by either JavaScript or the HTML parser, then you should learn how to use one
    of the many HTML and JavaScript encoders that are available. You could try to
    use an encoder yourself, but doing so can be tricky because each browser''s JavaScript
    engine can handle things a little bit differently. You are better off using an
    encoder that has been developed by a trusted security team, such as the Enterprise
    Security API (ESAPI) that is available from the Open Web Application Security
    Project (OWASP) team.


    You should also be aware that using a JavaScript framework like jQuery poses the
    same issue. Using code as such


    ```

    $(''#user'').html($(''#userName'').val());

    ```


    will open the same XSS attack vector as .innerHTML. If you are using jQuery, make
    sure you use .text instead of .html:


    ```

    $(''#user'').text($(''#userName'').val());

    ```


    ![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_148_0.png)


    > NOTE

    Modern versions of both Firefox and Chrome browsers equipped with a basic XSS
    auditor that will help prevent some kinds of XSS attacks. However, you should
    not rely on this functionality in any way as the sole method of protection. Using
    proper coding practices is the only way to truly protect against XSS attacks.'
