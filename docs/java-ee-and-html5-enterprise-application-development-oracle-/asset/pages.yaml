  md: '126 Java EE and HTML5 Enterprise Application Development


    As an application developer, you may get the sense that every time you obtain
    a good understanding of the latest security issue, a new one crops. Staying ahead
    of the security curve may seem practically impossible, but there are basic development
    practices that you can follow that will help you to keep up with the security
    curve. Application security can take many forms. In the case of HTML5 and Java
    web applications, the two major forms of security are client-side and server-side
    security. The top issues and common best practices that apply to client-side security
    and server-side security differ, so this chapter discusses each separately, starting
    with securing the client side.


    # Client-Side Security


    When working with HTML5 applications, always keep in mind this important fact:
    different HTTP traffic analyzers can read just about anything that you send or
    receive.


    ![](img/6d0f4c34e63ae3ea4485e31eaa5072e4_145_0.png)


    > TIP

    You should treat all data entering and exiting your HTML5 application as potentially
    malicious.


    While almost all security measures need to be implemented on the server side for
    HTML5 applications, there are still a few types of client-side attacks that you
    need to be aware of, and properly code against, to avoid having your application
    exploited by hackers. These attack types include cross-site scripting, cross-site
    request forgery, and clickjacking. You will also want to have a basic understanding
    of authentication and authorization practices for your application and finally,
    some commonsense practices that should always be used when doing client-side security
    coding.


    # Cross-Site Scripting


    Cross-site scripting (XSS) is one of the most common security vulnerabilities
    in web applications. There are actually three different kinds of XSS attacks:
    reflected, stored, and DOM-based. Reflected and stored XSS attacks that must be
    handled at the application server or web server, whereas DOM-based XSS attacks
    are client-side attacks that must be addressed by client-side developers.'
  merge: -1
  pgno: 145
- img_proc: true
  md: '# Chapter 6: HTML5 and Java Application Security 127


    XSS occurs when a web application incorporates user input into the output that
    it generates without properly validating or encoding the input. Data coming from
    the end user (for example, form input) or from a data connection (for example,
    a REST service) is considered untrusted data. You didn''t create the data as part
    of your application, so you can''t verify that it came from a trusted source.
    It''s untrusted data that you have to guard against.


    The best way to understand XSS is to look at some examples. Although the focus
    of this section is client-side security, server-side XSS attacks are the easiest
    to understand, so a couple of examples of server-side XSS attacks are provided
    next, followed by a client-side example.


    For the first example, assume that you''ve decided to create a custom error page
    for a 404 (file not found) error. When someone types in a URL similar to


    ```

    http://my.website.com/not-here

    ```


    the error page returns a message stating that the file not-here could not be found
    on the server. The XSS vulnerability occurs if the data displayed in the error
    message is not escaped before it''s read by the browser, in which case an attacker
    could do something like this:


    ```

    http://my.website.com/<script>alert("TEST")</script>

    ```


    The browser would execute the <script> when it parsed the data to display it as
    part of the error message.


    For the second example, assume that your web application has a search box. When
    a user conducts a search, the results of the search are displayed on a separate
    results page. The XSS vulnerability occurs if the page uses the common pattern
    of displaying "x number of results found for: <what was searched for>" and does
    not perform proper encoding of the search string. If a malicious user enters a
    search string similar to the <script> block in the previous example, the JavaScript
    will be executed when the search results page is loaded in the browser.


    Both of the preceding examples would normally be managed on the server side, because
    the error page and the search results page would normally be generated on the
    server. As previously mentioned, the third kind of XSS attack is purely client
    side and deals with how JavaScript handles the execution of DOM elements.


    To demonstrate how a DOM-based XSS attack works, we will use a similar example
    to the previous search field example. Suppose your HTML5 application has a form
    that includes an input field requesting the user''s'
