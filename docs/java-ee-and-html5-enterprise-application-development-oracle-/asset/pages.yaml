    # Summary


    This chapter described the key concepts of persistence and explained how data
    can be created, read, updated, and deleted from relational database tables using
    JPA. It also looked at how relational database tables can be easily mapped to
    JPA entities, and it presented the requirements around their packaging. Different
    types of Enterprise JavaBeans were introduced and their transactional nature was
    explained briefly. Finally, this chapter demonstrated how the database tables
    can be easily generated using the properties defined in persistence.xml. NetBeans
    IDE tools and wizards were shown throughout the chapter to highlight the simplified
    development process. The next chapter will take these JPA entities and publish
    them as RESTful endpoints.'
