  md: '# 134 Java EE and HTML5 Enterprise Application Development


    Without getting into the technical details of the protocol, OAuth enables a client
    application, often a web application, to act on behalf of a user, with the user''s
    permission. The main components of OAuth 2.0 are


    +   * Client

    * Authorization server

    * Resource server

    * Resource owner


    The resource owner is an entity that can grant access to a protected resource.
    The client is the application that makes the access request on behalf of the resource
    owner. A client performs actions on a resource server based on authorization provided
    by the user at the authorization server. For example, a user can access images
    on www.flickr.com (resource server) via a web browser (client) by signing in to
    Flickr using their Google Account (where www.google.com is the authorization server).
    The advantage of this approach, as opposed to the user does not have to create
    and remember multiple logins and passwords. Instead, the client obtains a *bearer
    token* from the authorization server, with the user''s approval, and stores it.
    Then, when the resource needs to be accessed at the resource server, the client
    sends a special HTTP header in the following format:


    ```

    Authorization: Bearer <token_value>

    ```


    The token value is opaque to the client but can be decoded by a resource server
    so that the server can check that the client, on the user''s behalf, has permission
    to access the resource.


    If your application is going to be used as part of a larger enterprise environment
    that requires user authentication, then your application probably does not need
    to provide separate authentication. If you do need to include some of authentication
    in your application, there are plenty of libraries in different languages by different
    authorization servers and resource providers that provide OAuth support. It''s
    worth looking them before deciding on your security infrastructure.


    In a typical enterprise environment, your application will be part of a larger
    application server installation. This application server will do the authentication
    for your application, and the user will not get to your application''s pages until
    they have already been authenticated by the'
