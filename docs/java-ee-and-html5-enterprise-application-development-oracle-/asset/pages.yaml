    When setting the image for the specific game cell, as shown in Listing 4-11, the
    image can be set either from the client of the player actually clicking the game
    cell or from the server to show what the opponent just selected. This method has
    to handle both cases. Here is where your use of the Knockout viewmodel starts
    to come into play. If the symbol member of the data object is player X, the viewmodel''s
    image attribute, or observable in Knockout terms, is to be the image for X. You
    are then going to set the viewmodel''s symbol observable to the opposite of who
    played. This is because the existing player''s turn is done and you are beginning
