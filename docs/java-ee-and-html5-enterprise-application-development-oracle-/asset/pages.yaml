    ```


    The code in Listing 6-2 will work just fine. However, by using the .innerHTML
    attribute of the <div> element, you have opened yourself up to a DOM-based XSS
    attack. If a malicious user were to enter a string that looked something like


    ```

    <div onmouseover="javascript:alert(''failed!'')">XSS Test</div></div>

    ```


    the HTML would be added to the DOM as written, and the next time someone moves
    their mouse over the new <div> element, the JavaScript would be executed.


    There are certain DOM attributes and methods that you should avoid working with
    untrusted data. A partial list includes


    +   - element.innerHTML

    - document.write()

    - document.writ()

    - javascript.eval()

    - element eventHandlers'
