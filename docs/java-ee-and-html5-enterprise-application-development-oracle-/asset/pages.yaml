  md: '# Java EE and HTML5 Enterprise Application Development


    EST, or Representational State Transfer, is an architectural style for distributed
    systems as the World Web. This term was originally introduced and defined in 2000
    by Roy Fielding in his dissertation Architectural Styles and the Design of Network-based
    Software Architectures. Fielding''s motivation for choosing the dissertation topic
    was his "desire to understand and evaluate the architectural design of network-based
    application software through principled use of architectural constraints, thereby
    obtaining the functional, performance, and social properties of an architecture."
    See www.ics.uci.edu/~ffield/pubs/dissertation/introduction.htm. This was achieved
    by defining a framework to understand the architecture of network-based applications.
    The thesis then describes how REST is used to guide the design and development
    of the architecture for the modern Web.


    Modern applications typically publish their APIs using REST API is published at
    https://dev.twitter.com/docs/api. Integrating any Twitter functionality, such
    as searching for tweets with a particular hashtag or obtaining a collection of
    the most recent tweets, can be accomplished by invoking the Twitter REST API and
    processing the result in your application.


    This chapter explains the key REST principles and how REST services can be published
    and invoked from Java.


    # REST Principles


    The World Wide Web is the largest implementation of a system conforming to the
    REST architectural style. In that context, REST is a set of principles that defines
    how web standards, such as HTTP and URLs, are supposed to be used for building
    your applications. To successfully build Java applications that utilize web standards,
    you''ll need to understand the guiding principles of REST architecture. These
    principles will guide you as you define resources and set up services.


    The guiding principles of REST architecture are


    +   - **Resource** The key information in this architecture is a resource. Any
    information that can be named as a resource: a document or image, a book, an author,
    a collection of other resources, and so on.


    +   - **Client and server** A client-server model is used where a client initiates
    a request to the server; the server processes the request and returns an appropriate
    response to the client. Requests and responses are built around the transfer of
    resources.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# Chapter 3: RESTful Resources


    +   - Identification of resources Every resource is uniquely identified on the
    client and server. Everything on the Web can be identified as a resource, and
    each resource can be uniquely identified by a URI.


    +   - Resources are available in multiple representations A resource can be represented
    in multiple formats, by a media type. The client and server can negotiate on the
    content type of the resource.


    +   - Standard methods can be used to manipulate these resources Each resource
    can be created, read, updated, and deleted using standard methods. HTTP verbs
    such as GET, PUT, POST, and DELETE to manipulate resources stateless on the Web.


    +   - Communicate the server does not retain any communication state for any of
    the clients beyond a single request. If state is required, then it should be kept
    on the client or converted into resource state. This allows the server to scale
    much better.


    You will see how each of these principles is used with the Java API for REST as
    you continue in this chapter, and with the JavaScript API for REST Chapter 5.


    # Java API for RESTful Web Services


    Java API for RESTful Web Services (JAX-RS) defines a standard, annotation-driven
    API that helps developers develop and invoke a RESTful web service in Java. JAX-RS
    1.1 was first included in the Java EE 6 platform. Java EE 7 includes JAX-RS 2.0,
    which is a deep revision of JAX-RS that adds several features that can handle
    the most modern style of web applications.


    Let''s consider a REST resource that provides create, read, update, and delete
    operations on an author database. Such a REST resource can be invoked using any
    of the standard HTTP verbs such as POST, GET, PUT, or DELETE. The endpoint should
    have the capability to publish and consume resource representations in multiple
    formats. A complete list of authors or a specific author should be accessible.
    A REST endpoint that publishes and consumes multiple representations of the author
    resource using common HTTP verbs is shown in Listing 3-1.'
