  md: 'The following information will help you to understand this code:


    +   A POJO can be converted to a REST resource by adding @javax.ws.rs.Path annotation
    to the class. The annotation defines the URI where the resource is accessible—authors
    in this case. Paths are relative. For an annotated class, the base URI is defined
    using @javax.ws.rs.ApplicationPath annotation on a class that extends the javax.ws.rs.core.Application
    class. The complete URI of the resource is defined as:


    ```

    http://<host>:<port>/<webapp-context>/<base-URI>/<resource-URI>

    ```


    So if the resource is packaged in a WAR file with the context root सहारा and deployed
    on the host "localhost" and the port "8080" with the base URI "webresources,"
    then the complete path of the resource would be


    ```

    http://localhost:8080/sahara/webresources/authors

    ```


    +   A subresource of the main resource can be defined by annotating a method of
    the root resource with @javax.ws.rs.Path annotation. The base URI of this subresource
    is the effective URI of the containing class. The annotated method is invoked
    whenever the resource is accessed using the complete path defined by the base
    URI and the path specified on the method. In Listing 3-1, the count () method
    is called if the resource is accessed at the webresources/authors/count path.
    Note that the count () method is also annotated with @javax.ws.rs.GET annotation,
    but it is available at a different path because it is defined as a subresource.


    The @javax.ws.rs.Path annotation can take a URI template parameter. The value
    passed to this template parameter can be bound to a resource method using @javax.ws.rs.PathParam
    annotation. In Listing 3-1, the find() method is called if the resource is accessed
    at the webresources/authors/nnn path, where nnn is some value. The id() method
    parameter is populated with the value nnn and invokes the method on the EJB.


