    # # Responsive Design


    The concept of responsive design addresses the need to design your web application
    such that it renders its layout appropriately in response to the screen size of
    the device on which it is being displayed. The application View layer needs to
    respond to this change in view size by changing the layout, or of, the content
    that is rendered.


    The CSS2 specification provided the capability to use different CSS rules dynamically
    based on the media type. The most common of these types are (and continue to be
    in CSS3) screen and print. The CSS3 specification expands this capability with
    the introduction of media queries. A media query is made up of a media type and
    zero or more expressions. These expressions check for specific conditions of media
    features. A good example of this is an expression that checks for the current
    size of the display screen:


    ```

    @media only screen (min-width: 450px) and (max-width: 1024px) {}

    ```


    Through the use of media queries and a pattern of CSS classes defined as a grid
    layout, you can make your application respond to changes in the display screen.


