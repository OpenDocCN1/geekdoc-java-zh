    ## About the App Development Guide series


    The App Development Guide series from LearnToProgram Media is designed to provide
    you with guides for creating interesting apps. The app development guides provide
    all of the code, assets, and other materials that you will need to create complete
    applications. Some of the apps in this series are designed to work within a web
    browser while others are designed to be deployed to mobile devices—either as a
    native iOS or Android App or as a HTML5 based app that works on both platforms.


    The best way to learn app development is to actually build apps. Our goal is not
    to provide an exhaustive explanation for every tag, method and property we use
    in building the apps. In this series, it is our hope that the guides will provide
    context to integrate what you’ve learned previously, and, perhaps, set you up
    for future learning.


    I hope that you gain a great deal of satisfaction from coding along with these
    guides and making the app work on your own. Once the app is working I’d invite
    you to modify the app—add features and make it more interesting, usable or useful.


    I am a big believer in the learn-by-doing paradigm.—It is how I gained much of
    the skillset I boast today. I hope after working through our App Development Guide
    series, that you will feel the same.


    If you have any feedback about any of the books in this series, please don’t hesitate
    to reach out to me at `mark@learntoprogram.tv` or @mlassoff on Twitter.


    ## Technologies


    This app development guide uses the following technologies:


    * HTML5

    * CSS


    The final application may be fun on any contemporary Mac or PC with a current
    browser.


