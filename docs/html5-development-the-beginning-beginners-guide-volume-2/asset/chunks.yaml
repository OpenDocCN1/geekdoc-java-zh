    现在我们应该有了一个页面标题、两个标题以及一些段落标签中的内容。我们应该确保保存了文件。当我们在 Brackets 中点击实时预览图标时，我们应该能在浏览器中看到如下的渲染结果：


    ![](img/00009.jpeg)


    图 1-8——添加二级标题


    进展非常顺利！我信任，既然我们已经有了一些基础部分来构建我们的网站，你现在更有信心继续下下了。


    # 你 HTML 的辅助阵容


    回顾我们迄为止取得的进展令人兴奋。我们正在通过坚实的代码和优秀的内容构建一个优秀网站的基础。正如我们之前提到的，优秀的内容是任何网站的核心，而良好的 HTML
    提供了结构、组织和布局。


    然而，交付高质量的网站还需要很多方面，现在我们将讨论三个重要的部分：浏览器、文本编辑器以及层级样式表（CSS）。


    ## 浏览器

    浏览器是访问者用来访问和查看你网站的软件应用程序。当你开始在网页上构建内容时，留意浏览器所起的作用至关重要。


    正如你可能知道的，今天有几种主要的浏览器。Chrome、Safari、Firefox 和 Internet Explorer 是常用的浏览器。组织良好的代码和准确的标签将在浏览器中运行良好，并渲染出内容的预期结构和格式。


    ## 文本编辑器

    我们用来保持代码组织良好、结构化且运行良好的工具是文本编辑器。我们在这里选择的文本编辑器是 `Brackets`，这是一个由 Adobe 赞助的开源项目。


    就像你的访问者有多种浏览器可以访问你的页面一样，你的选择有很多。常见的选项包括 Notepad++, TextMate 和 Sublime Text。不同的编辑器具有不同的功能和界面，但通常网页设计师和开发者根据个人偏好选择文本编辑器。


    ## 注释

    使用文本编辑器保持代码组织的非常有用且常用的方法是使用注释。在编码背景下，注释是你写给自己或阅读你代码的人的有用笔记。这些注释嵌入在代码中，但它们使用特定的语法编写，防止它们与其他
    HTML 代码一起读取。此外，它们不会干扰你的页面在浏览器中的渲染。你可以将注释看作拥有自己的标签，如下例所示。


    ```代码示例：注释标签和添加注释


    ```html

    <!--这是一个注释。注释不会在浏览器中显示-->


    <p>这是一个段落。这将在浏览器中显示。</p>

    ```

