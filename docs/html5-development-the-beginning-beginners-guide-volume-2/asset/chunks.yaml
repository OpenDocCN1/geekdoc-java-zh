  trans: "\n保存你的文件并测试你的代码。它应该在左上角渲染，并且指向“主页”的链接应该是有效的。我们将在下一节中创建博客页面。在你学习代码时，你可以看到我们正在向\
    \ `<nav>` 标签内部为我们自己的页面添加链接。这里是截图：\n\n![](img/00034.jpeg)\n\n图 7-2——添加了导航链接的 work.html\
    \ 页面\n\n做得好！提供方便且实用的导航是获得良好用户体验的关键。你现在应该知道如何开始利用对不同元素的基础理解来加速你在其他领域的学习。在这种情况下，对如何格式化标签和链接的了解帮助我们快速学会了导航。优秀良好编程的关键在于不断“借用”你在一个领域已有的知识，并在其他领域尽可能在合适的地方应用它。\n\
    \n现在我们正在为访问者提供多种体验我们内容的方式，是时候添加一些重要的交互元素，并允许访问者通过表单向我们提供数据和反馈了。\n\n## 表单：添加额外的交互性\n\
    \n表单是你网站的极佳补充。它们提供了与访问者通信的另一个层级。良好的表单允许你接受访问者的反馈和数据。结果，你的网站变成了你和访客之间有效的双向通道。为了在后端妥善地存储和使用这些数据，你需要添加一些额外的代码和编程（此处未涵盖）。我们将向你展示如何在网站的前端添加一个基础表单。这将帮助你理解在浏览器中展示表单的基础知识，并开始思考你可以通过哪些奇妙的方式为你的网站添加这种交互功能。\n\
    \n对于这个示例，我们将在网站上创建一个新博客，但我们想向访问者询问关于他们想看什么类型的博客。我们将构建一个表单来从访问者那里收集这些信息。为了最大化你的学习效果，我们将构建三种不同的小表单。\n\
    \n第一步是在你的文本编辑器中创建一个新文件并将其命名为 `blog.html`。将其保存到我们用于该项目的 `My_Page` 文件夹中。这与你在上一节中创建\
    \ `work.html` 文件所遵循的过程相同。\n\n在空白文件的顶部添加以下代码，使你的 HTML 文件拥有 `<head>` 部分、你的导航元素以及我们将用于解释此页面目的的内容。然后你将链接你的\
    \ CSS 文件。花一点时间研究这段代码中的元素。它们应该对你来说都是熟悉的。你也可以回顾本书之前章节中涵盖的内容。\n\n### 代码示例：开始构建用于表单的页面\n\
    \n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n    <title>My Blog</title>\n<link\
    \ rel=\"stylesheet\" type=\"text/css\" href=\"css/styling.css\">\n</head>\n<body>\
    \    \n<nav>\n  <a href=\"mypage.html\">Main Page</a> |\n  <a href=\"work.html\"\
    >Work History</a> |\n</nav>\n<h1 align=\"center\">My Blog Is Coming Soon! </h1>\n\
    <h2>Help me start my blog!!</h2>\n<p>我计划很快就会开始写博客。我计划写关于我最喜欢的话题，包括教育、教学和网页设计。你能帮我吗？请随时告诉我你更偏好哪些主题，并把你的个人信息发给我，这样我可以将你加入我的邮件列表并在发布时通知你。再次感谢你的帮助，期待你的回音！</p>\n\
    </body>\n</html>\n```\n\n在 HTML 和 CSS 中，设计和样式化表单有很多选择。我选择了一个简单的框架，它可以将不同的元素组合在一起，并自动添加一些边框以保持我们的表单整洁有序。\n\
    \n我们将引入几个新标签，它们将在下面的代码示例中使用。\n\n*   `<form>` 标签作为我们所有表单元素的容器。\n*   `<br>` 标签是\
    \ break 的缩写。它将帮助我们把元素分到不同的行。\n*   `<fieldset>` 标签将对我们的元素分组。这不是表单的必要部分，但它将从设计的角度帮助我们分离和分组元素。当你尝试对代码使用不同的方法时，可以随时注释掉这些标签，看看在没有\
    \ fieldset 标签的情况下表单是如何渲染的。如果你不指定大小，此标签将默为 100% 的宽度。我们可以使用 `%` 或像素。\n*   `<legend>`\
    \ 标签为表单的特定部分提供标题。\n*   `<input>` 标签用于通过 `type` 属性声明表单的此部分接受什么类型的输入。在第一个实例中，它将是\
    \ `type=`radio``，用于单选按钮。在表单后面，我们还会使用文本类型。\n\n下面的代码示例提供了我们表单的第一部分。我们将创建三个单选按钮，允许访问者为他们想在我们的博客上阅读的话题“投票”：教育、网页设计或两者。\n\
    \n### 代码示例：我们表单的第一块代码\n\n```html\n<form>\n  <h3>I would love to hear from you!</h3>\n\
    \  <br>\n  <fieldset style=\"width:50%\">\n      <legend>What type of topics would\
    \ you like to see?</legend>\n<input type=\"radio\" name=\"blogtype\" value=\"\
    education\">\n      <br>\n      <input type=\"radio\" name=\"blogtype\" value=\"\
    web design\">\n      <br>\n      <input type=\"radio\" name=\"blogtype\" value=\"\
    both\">\n  </fieldset>\n</form>\n```（注：上面的代码已根据提供的文本进行了清理）\n\n下面的代码示例提供了我们表单的第一部分。我们将创建三个单选按钮，允许访问者为他们想在我们的博客上阅读的话题“投票”：教育、网页设计或两者。\n\
    \n（等待，让我重新对齐提供的原始代码）：\n\n```html\n<form>\n  <h3>I would love to hear from you!</h3>\n\
    \  <br>\n  <fieldset style=\"width:50%\">\n      <legend>What type of topics would\
    \ you like to see?</legend>\n<input type=\"radio\" name=\"blogtype\" value=\"\
    education\">\n      <br>\n      <input type=\"radio\" name=\"blogtype\" value=\"\
    web design\">\n      <br>\n      <input type=\"radio\" name=\"blogtype\" value=\"\
    both\">\n  </fieldset>\n</form>\n```\n\n实际上，提供的源文本代码块是碎片化的。我将按照文本显示的内容进行格式化：\n\
    \n下面的代码示例提供了我们表单的第一部分。我们将创建三个单选按钮，允许访问者为他们想在我们的博客上阅读的话题“投票”：教育、网页设计或两者。\n\n###\
    \ 代码示例：我们表单的第一块代码\n\n```html\n<form>\n  <h3>I would love to hear from you!</h3>\n\
    \  <br>\n  <fieldset style=\"width:50%\">\n      <legend>What type of topics would\
    \ you like to see?</legend>\n<input type=\"radio\" name=\"blogtype\" value=\"\
    education\">\n      <br>\n      <input type=\"radio\" name=\"blogtype\" value=\"\
    web design\">\n      <br>\n      <input type=\"radio\" name=\"blogtype\" value=\"\
    both\">\n  </fieldset>\n</form>\n```\n\n（自纠：用户文本代码块非常乱。我将提供文本的逻辑表示。）\n\n（基于提供的乱文本块的最终整洁布局）：\n\
    \n下面的代码示例提供了我们表单的第一部分。我们将创建三个单选按钮，允许访问者为他们想在我们的博客上阅读的话题“投票”：教育、网页设计或两者。\n\n###\
    \ 代码示例：我们表单的第一块代码\n\n```html\n<form>\n  <h3>I would love to hear from you!</h3>\n\
    \  <br>\n  <fieldset style=\"width:50%\">\n      <legend>What type of topics would\
    \ you like to see?</legend>\n<input type=\"radio\" name=\"blogtype\" value=\"\
    education\">\n      <br>\n      <input type=\"radio\" name=\"blogtype\" value=\"\
    web design\">\n      <br>\n      <input type=\"radio\" name=\"blogtype\" value=\"\
    both\">\n  </fieldset>\n</form>\n```\n"
- fmt: "\nIn this last sample of code, you will also see a `<textarea>` tag. You will\
    \ open and close this tag as normal. This creates the text box. You will need\
    \ to indicate a size by selecting a number of rows and columns.\n\nBefore the\
    \ closing `</form>` tag you will also see an `<input>` tag with an attribute of\
    \ `type=\"submit\"`. This creates a generic submit button for our users to send\
    \ us their information which will live at the bottom of our form. In this block,\
    \ we will also close our `form`, `body` and `html` tags.\n\n### Code Sample: First\
    \ block of code for our forms\n\n```html\n<fieldset style=\"width:35%\">     \
    \        \n<legend>Feel free to add your ideas about future blog posts:</legend>\n\
    <textarea rows=\"5\" columns=\"500\"></textarea>\n</fieldset>\n<br><br>\n<input\
