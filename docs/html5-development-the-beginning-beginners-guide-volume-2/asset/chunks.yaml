    \n[content]\n# 列表格式\n\n如果你更喜欢使用字母按字母显示，或者你更想使用罗马数字，你还有额外的选项。有序列表默认使用传统的阿拉伯数字。但如果你更喜欢使用不同的符号，可以通过指定你想要的符号类型来将其声明为属性。\n\
    \n## 有序列表自定义\n\n要使用大写字母按字母排列，你将使用下面的代码。我突出显示了你添加类型的地方：\n\n### 代码示例：为有序列表添加类型\n\
    ```html\n<ol type = \"A\">\n  <li>2011 年度年度教师</li>\n  <li>2012 年带领男足队获得了赛区冠军</li>\n\
    \  <li>2015 年有三位学生获得了备受赞誉的奖学金</li>\n</ol>\n```\n\n当你测试代码时，现在应该能看到列表按大写字母排列了。这里有一个示例：\n\
    \n![](img/00020.jpeg)\n\n图 4-6—带有类型为“A”属性（type = “A”）的有序列表截图\n\n要使用罗马数字，你只需要在类型声明中添加一个大写的“I”即可。这是一个示例：\n\
    \n### 代码示例：为有序列表添加类型\n```html\n<ol type = \"I\">\n  <li>2011 年度年度教师</li>\n  <li>2012\
    \ 年带领男足队获得了赛区冠军</li>\n  <li>2015 年有三位学生获得了备受赞誉的奖学金</li>\n</ol>\n```\n\n要使用小写字母或罗马数字，你只需添加小写版本而不是大写版本。配合我们的反转属性，这允许我们六种方式显示有序列表。这为你提供了极佳的灵活性，并让你学习结构化列表信息的许多不同方法。未来通过书籍或课程对\
