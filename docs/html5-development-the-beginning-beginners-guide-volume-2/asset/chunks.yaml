  trans: "\n\n# 列表格式\n\n如果你更喜欢使用字母按字母顺序显示，或者更想使用罗马数字，你还有额外的选项。有序列表默认使用传统的阿拉伯数字。但如果你更喜欢使用不同的符号，可以通过指定你想要的符号类型来将其声明为属性。\n\
    \n## 有序列表自定义\n\n要使用大写字母按字母顺序排列，你将使用下面的代码。我突出显示了你添加类型的地方：\n\n### 代码示例：为有序列表添加类型\n\
    ```html\n<ol type = \"A\">\n  <li>2011 年度年度教师</li>\n  <li>2012 年带领男足队获得了赛区冠军</li>\n\
    \  <li>2015 年有三位学生获得了备受赞誉的奖学金</li>\n</ol>\n```\n\n当你测试代码时，现在应该能看到列表按大写字母排列了。这里有一个示例：\n\
    \n![](img/00020.jpeg)\n\n图 4-6—带有类型为“A”属性（type = “A”）的有序列表截图\n\n要使用罗马数字，你只需要在类型声明中添加一个大写的“I”即可。这是一个示例：\n\
    \n### 代码示例：为有序列表添加类型\n```html\n<ol type = \"I\">\n  <li>2011 年度年度教师</li>\n  <li>2012\
    \ 年带领男足队获得了赛区冠军</li>\n  <li>2015 年有三位学生获得了备受赞誉的奖学金</li>\n</ol>\n```\n\n要使用小写字母或罗马数字，你只需添加小写版本而不是大写版本。配合我们的反转属性，这允许我们六种方式显示有序列表。这为你提供了极佳的灵活性，并让你学习结构化列表信息的许多不同方法。未来通过书籍或课程对\
    \ CSS 有更深入的理解将为你的列表提供更多样式选项。因此，你的内容不仅组织良好，而且富有创意且引入胜。\n\n# 链接：连接到世界维网上的其他页面\n\n\
    世界维网最好的功能之一就是能够轻松链接到许多涵盖广泛信息的不同页面。作为网站创建者，能够链接到其他页面的便利性为你带来了许多益处。你可能想在页面上添加链接有很多理由。我们将在在这里介绍其中几个。然而，我鼓励你发挥想象力，思考将链接整合到网页设计中的多种方式。添加链接可以支持你的内容，并为访问者提供丰富、独特且定制的体验。\n\
    \n要添加链接，你将使用带有特殊属性的 `<a>` 标签。`<a>` 是 anchor（锚点）的缩写。正如你在下面的示例中看到的，你的链接标签通常位于其他标签内部，如\
    \ `<h1>`、`<p>` 或 `<ul>`。\n\n典型的锚点元素以起始标签 `<a>` 开始，并有一个 `href` 属性。`href` 属性是 hypertext\
    \ reference（超文本引用）的缩写。它将有一个通用资源定位符，即 `url`。这就是网站或链接地址。元素的第二部分将是渲染到网页并包含链接的文本。这意味着链接文本是可点击的，并包含了\
    \ `url`，让访问者在点击链接时到达他们预期想要去的地方。\n\n以下是 HTML 中链接形式的示例：\n\n### 代码示例：基本链接结构\n```html\n\
