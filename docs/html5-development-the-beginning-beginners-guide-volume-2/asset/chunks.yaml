    \n![](img/00030.jpeg)\n\n图 6-3—表格格式化数据示例\n\n到此时，我们表格的基本结构已经开始成型。我们希望为表格添加一些基础样式。一个良好的表格应该具有简单且组织良好的布局。不要过过头非常重要。然而，通过添加一些边框并强调某些文本和行，我们可以从视觉上帮助访问者理解表格中的数据，并确保信息流通逻辑。\n\
    \n为了更好地区分数据，我们将添加一个边框。边框是可选的，但我们在这里添加一个，以帮助你练习它的功能。我们还将添加一个属性来控制表格的宽度。\n\n###\
    \ 代码示例：为表格添加边框和宽度\n\n```html\n<table border=\"1\" style=\"width:100%\">\n  <thead>\n\
    \    <tr>\n      <th>Title</th>\n      <th>Location</th>\n      <th>Year</th>\n\
    \    </tr>\n  </thead>\n...\n</table>\n```\n\n你会注意到宽度被设置为 100%。在 HTML5 中，设置尺寸的两种常用选项是像素（pixels）或百分比（per-cent-tages）。保存你的文件，测试你的代码，并查看表格在\
    \ 100% 时的外观。\n\n我打算将最终版本设置为 50%。我在下方显示的代码示例中突出显示了它。我们还将在起始 `<table>` 标签中使用另一个属性使表格居中。我们将添加一个属性为\
    \ `center` 的 `align` 属性。\n\n最后一步是为表格添加一个总标题。在 HTML5 中，这被称为 caption（标题）。我们将添加一个起始\
    \ `<caption>` 标签和一个结束 `</<caption>>` 标签，并在两个标签之间放置我们想要作为表格标题的文本。你可以从下面的示例中看到应该放置的位置。我们添加的代码已高亮显示。\n\
    \n### 代码示例：为表格添加边框、宽度和对齐方式\n\n```html\n<table border=\"1\" style=\"width:50%\"\
    \ align=\"center\">\n  <caption>My Work History</caption>\n  <thead>\n...\n</table>\n\
    ```\n\n我还想把我们添加的办公室图片移动到最后一页。它位于我们索引页 `<h2>` 的下方。\n\n#### 如何剪切和粘贴你的代码：\n\n1. 高亮显示你想要的代码。在这种情况下，是整个\
    \ `<img>` 标签。\n2. 在选中状态下点击右键。\n3. 点击 `Cut`（剪切）。\n4. 返回你的 `work.html` 文件。\n5. 将光标放置在\
    \ `<caption>` 标签下方的一个新行上。\n6. 点击右键。\n7. 点击 `paste`（粘贴）。\n\n这是来自表格头部部分的代码，添加了边框、宽度、标题和居中对齐，并包含了我们从另一个文件剪切并粘贴的\
    \ `<img>` 标签。在这一步中，我们还想添加一个 `<h1>`，你可以在高亮部分看到它。\n\n### 代码示例：为表格添加边框、宽度和对齐方式\n\n\
    ```html\n<table border=\"1\" style=\"width:50%\" align=\"center\">\n  <caption>My\
    \ Work History</caption>\n  <img src=\"http://images.freeimages.com/images/previews/67e/office-1238353.jpg\"\
    \ alt=\"My office\" width=\"400\" height=\"200\">\n  <thead>\n    <tr>\n     \
