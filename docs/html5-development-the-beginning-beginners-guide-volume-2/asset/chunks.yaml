  trans: "\n如果你只是简单列列信息，且项目的顺序并不重要，那么你将使用无序列表。无序列表将具有起始标签 `<ul>` 和结束标签 `</ul>` 格式，你现在应该已经熟悉它们了。\n\
    \n当我们构建列表时，还会为列表中的每个项目添加标签。列表标签将在每个列出的项目周围开启 `<li>` 并关闭 `</li>`。考虑这种做法的一种简单方法是把\
    \ `<ul>` 标签看作声明将构建一个列表，而每个 `<li>` 标签都嵌套在这个较大的列表中。这里有一个空列表的示例，展示了我们包含三个项目的无序列表将使用的标签：\n\
    \n### 代码示例：添加无序列表\n\n```html\n<ul>\n  <li></li>\n  <li></li>\n  <li></li>\n</ul>\n\
    ```\n\n添加有序列表（即项目需要反映特定顺序的列表）也遵循类似的模式。\n\n然而，对于有序列表，我们将使用起始标签 `<ol>` 来声明一个列表，表示我们现在想要一个有序列表。我们将按照惯例用\
    \ `</ol>` 标签将其关闭。\n\n我们在有序列表中嵌套列表项目的方式与无序列表相同。这里是一个空有序列表的代码示例：\n\n### 代码示例：添加有序列表\n\
    \n```html\n<ol>\n  <li></li>\n  <li></li>\n  <li></li>\n</ol>\n```\n\n现在，让我们回到个人主页并添加一些列表吧！我们将回到添加完链接样式表的代码后所在的地方。你的代码应该像下面的示例所示：\n\
    \n### 代码示例：个人简介项目的当前代码状态\n\n```html\n<html>\n<head>\n  <title>My Page</title>\n\
    \  <link rel=\"stylesheet\" type=\"text/css\" href=\"css/style.css\">\n</head>\n\
    <body>\n  <h1>感谢访问我的页面并了解更多关于我的信息！ </h1>\n  <h2>这个网站被设计为一个个人简介。</h2>\n  <p>我于\
    \ 2010 年毕业于德克萨斯大学，获得英语学位。  我是一名英语老师，也是一名足球教练，正在学习构建网页。</p>\n</body>\n</html>\n\
    ```\n\n让我们添加一些有趣的细节，包括我们的兴趣和爱好，这样访问我们页面的访问者就能感受到我们的个性。在我们段落元素下方，我将添加一个无序列表，列出我在空闲时间喜欢做的三件事。我还会在段落元素中添加一句话来介绍下方的列表。我突出显示了这一步中新增的代码。在为段落元素添加了句子和无序列表后，我的代码现在看起来像这样：\n\
    \n### 代码示例：添加无序列表\n\n```html\n<html>\n<head>\n  <title>My Page</title>\n  <link\
    \ rel=\"stylesheet\" type=\"text/css\" href=\"css/style.css\">\n</head>\n<body>\n\
    \  <h1>感谢访问我的页面并了解更多关于我的信息！ </h1>\n  <h2>这个网站被设计为一个个人简介。</h2>\n  <p>  我于 2010\
    \ 年毕业于德克萨斯大学，获得英语学位。   我是一名英语老师，也是一名足球教练，正在学习构建网页。这是在空闲时间喜欢做的一些：</p>\n  <ul>\n\
    \    <li>basketball</li>\n    <li>soccer </li>\n    <li>table tennis </li>\n \
    \ </ul>\n</body>\n</html>\n```\n\n此时，你就可以保存文件并在浏览器中测试你的代码了。完成之后，我的看起来是这样的：\n\n\
    ![](img/00016.jpeg)\n\n图 4-1—添加列表\n\n做得好！看起来看起来极了，我们应该再加一个！\n\n让我们添加一些职业成就。由于列表的性质，以及我们希望优先考虑职业生涯中最令自豪的事，我们想按顺序列出这些元素。正如我们现在所知，这需要有序列表。\n\
    \n为了引入这个列表，我们不再在段落标签中添加文本，而是添加一个新的标题。让我们添加一个 `<h3>` 来引入我们的列表，然后将我们的列表 `<li>` 元素嵌套在有序列表的起始\
    \ `<ol>` 和结束 `</ol>` 标签中。\n\n首先，我将添加一个标题，告诉访问者我们将列出职业成就。我们将这个标签直接放在刚刚添加的无序列表下方。\n\
    \n### 代码示例：添加额外的标题\n\n```html\n<h3>以下是我的部分职业成就</h3>\n```\n\n现在我们来构建有序列表。这些项目将按顺序在我们的页面上显示。它的基本格式与我们的无序列表相同，只是用\
    \ `<ol>` 标签代替了 `<ul>` 标签。这是我们将放置在刚刚添加的标题标签下方的代码。\n\n### 代码示例：添加有序列表\n\n```html\n\
    <ol>\n  <li>2011 年度年度教师</li>\n  <li>2012 年带领男足队获得赛区冠军</li>\n  <li>2015 年三位学生获得了享有声誉的奖学金</li>\n\
    </ol>\n```\n\n这是一个非常好的进展！我们现在有了标题、添加了基础样式表、一些内容以及两个不同的列表（无序和有序）。我们已经...\n\n"
- fmt: "\n# List Formatting\n\nIf you prefer letters and an alphabetical display,\
    \ or if you’d rather use Roman numerals, you have additional options. An ordered\
    \ list will use traditional decimal numbers by default. But if you would prefer\
    \ a different symbol, you can declare that as an attribute by indicating the type\
    \ of symbol you want.\n\n## Ordered List Customization\n\nTo use uppercase letters\
    \ alphabetically, you will use the code below. I have highlighted where you add\
    \ the type:\n\n### Code Sample: Adding type to an ordered list\n```html\n<ol type\
    \ = \"A\">\n  <li>Teacher of the year in 2011</li>\n  <li>Coached the Boy's soccer\
    \ team to the conference title in 2012</li>\n  <li>Three former students received\
    \ prestigious scholarships in 2015</li>\n</ol>\n```\n\nWhen you test your code,\
    \ you should now see your list organized by upper case alphabetical letters. Here\
    \ is an example:\n\n![](images/00020.jpeg)\n\nFigure 4-6—Screenshot with our ordered\
    \ list with type = “A”\n\nTo use Roman numerals, you simply add an uppercase “I”\
    \ to your type declaration. Here is a sample:\n\n### Code Sample: Adding type\
    \ to an ordered list\n```html\n<ol type = \"I\">\n  <li>Teacher of the year in\
    \ 2011</li>\n  <li>Coached the Boy's soccer team to the conference title in 2012</li>\n\
    \  <li>Three former students received prestigious scholarships in 2015</li>\n\
    </ol>\n```\n\nTo use lowercase letters or Roman numerals, you simply add the lowercase\
    \ version instead of an uppercase version. Along with our reversed attribute,\
    \ this allows six different ways that we can display an ordered list. This offers\
    \ you excellent flexibility and allows you to learn many different ways to structure\
    \ listed information. An increased understanding of CSS from a future book or\
    \ course will provide you with many additional styling options for your lists.\
    \ As a result, your content will not only be well-organized but also creative\
    \ and engaging.\n\n# Links: Connecting to other pages on the World Wide Web\n\n\
    One of the best features of the World Wide Web is the opportunity to easily link\
    \ many different pages covering a wide variety of information. The convenience\
    \ of being able to link to other pages provides you many benefits as a site creator.\
    \ There are many reasons why you might want to add links to your page. We will\
    \ cover a few of them here. However, I encourage you to use your imagination and\
    \ think of the numerous ways that you can incorporate links into your web designs.\
    \ Adding links can support your content and provide a rich, unique and tailored\
    \ experience to your visitors.\n\nTo add a link, you will use an `<a>` tag with\
    \ a special attribute. `<a>` is an abbreviation for anchor. Often, as you will\
    \ see in the following example, your link tags will live inside of other tags\
    \ like `<h1>`, or `<p>`, or `<ul>`.\n\nThe typical anchor element starts with\
    \ an opening `<a>` tag and will have a `href` attribute. The attribute `href`\
    \ is short for hypertext reference. It will have a universal resource locator,\
    \ or `url`. This is the website or link address. The second part of the element\
    \ will have the text that will be rendered to the webpage and contain the link.\
    \ This means the link text is clickable and houses the `url` that will take the\
    \ visitor where they intended to go by clicking on the link.\n\nHere is an example\
    \ of what a link in HTML looks like:\n\n### Code Sample: Basic link structure\n\
    ```html\n<a href=\"url\">link text</a>\n```\n\nIf, for example, I wanted to link\
    \ to Yahoo.com, I could build the element below.\n\n### Code Sample: Basic link\
    \ structure\n```html\n<a href=\"http://www.yahoo.com\">Click here to go to Yahoo.com</a>\n\
    ```\n\nLet’s look at the process of building a link element. Refer to the preceding\
    \ code sample, as I outline the steps below.\n\n1. Open the element with an `<a>`\
    \ tag.\n2. Add the `href=` attribute, and then, in quotes, add the `url` or address\
    \ for the site you want to link to, exactly as we have done above.\n3. Close the\
    \ link portion with a `>`.\n4. Add the text the user will click to activate the\
    \ link.\n5. Add a closing `</a>` tag.\n\nWhile there seems to be more going on\
    \ in a link element than we have seen in the other elements we have covered thus\
    \ far, you will always follow the same structure. With a little practice, you\
    \ will have this new skill mastered and be able to take advantage of the full\
    \ power of the web by linking to other HTML documents across the world.\n\n# Practical\
    \ Practice\n\nNow, let’s get more practice by adding a few links to our personal\
    \ profile. In this section, I will also show you one or two unique functions that\
    \ can improve the sophistication and functionality of your website.\n\nFirst,\
    \ assume that we want to be able to share more information about where we grew\
    \ up. It would be impractical to add a great deal of information about this since\
    \ the purpose of this page is to share information about us. However, some visitors\
    \ might be curious, and might want additional information. By providing them with\
    \ a link, you can offer them the chance to learn more, while not taking up precious\
    \ space on your page for those with less interest.\n\nFor the purpose of this\
    \ example, we will say that we grew up in Dallas, Texas and want to add a link\
    \ to a site providing more information about Dallas.\n\nFirst, let’s start a new\
    \ biography section to add some of this biographical information. I will start\
    \ with a new `<h3>` and then add a brief introduction to the section in a `<p>`\
    \ tag. I have highlighted the addition to our full code sample below.\n\n### Code\
    \ Sample: Adding a new header and link\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <title>My Page</title>\n  <link rel=\"stylesheet\" type=\"text/css\" href=\"\
    style.css\">\n</head>\n<body>\n  <h1>Thanks for visiting!</h1>\n  <h2>This site\
    \ is designed as personal.</h2>\n  <p>I graduated from teacher. Here are some\
    \ things I like in free time:</p>\n  <ul>\n    <li>basketball</li>\n    <li>soccer</li>\n\
    \  </ul>\n  <h3>Below are my accomplishments</h3>\n  <ol>\n    <li>Teacher of\
    \ the year in 2011</li>\n    <li>Coached the Boy's soccer team to the conference\
    \ title in 2012</li>\n    <li>Three former students received prestigious scholarships\
    \ in 2015</li>\n  </ol>\n  <h3>A brief Biography</h3>\n  <p>I am originally from\
    \ Dallas. Click <a href=\"http://allascityhall.com/Pages/default.aspx\">here</a>\
    \ if you want to learn more about Dallas.</p>\n</body>\n</html>\n```\n\nNotice\
    \ how we have embedded the link inside of the `<p>` tag. With links to remember\
    \ that we not only need to add an address or link, but we also must indicate what\
    \ text we want to display that will be linked. In this case, the word ‘here’ in\
    \ the previous code will house the link and by clicking on that word, the visitor\
    \ will be taken to that site. The other text will not be linked and will simply\
    \ be placed around the linked text.\n\nNow that we know how to add a link, let’s\
    \ explore a fun and useful way to add functionality for our visitors and make\
    \ it easy for them to contact us. Let’s add our email address as a link that visitors\
    \ can click on to reach out to us in a convenient way. We will add this as the\
    \ last element in our `<head>` section, right under the `<h2>` tag.\n\nTo add\
    \ this functionality, you will build an element that looks very similar to a normal\
    \ link element. However, you will add a command called `mailto:` that opens the\
    \ visitor’s email and generates a new email that is addressed to you. Here is\
    \ an example of how it looks:\n\n```html\n<a href=\"mailto:youremailaddress\"\
    >Email Me</a>\n```\n\nYou will notice the normal `<a>` tag for a link, for the\
    \ `href`, we have added `mailto:` which is followed by an email address, and the\
    \ link text at the end of the element before the closing tag. I will add the code\
    \ below to my profile below the `<h2>` element at the bottom of the `<head>` section.\
    \ Feel free to use your own email address where I have added the `contact@learntoprogram.tv`\
    \ address.\n"
  raw: 'If you prefer letters and an alphabetical display, or if you’d rather use
    Roman numerals, you have additional options.  An ordered list will use traditional
    decimal numbers by default.  But if you would prefer a different symbol, you can
    declare that as an attribute by indicating the type of symbol you want.


    To use uppercase letters alphabetically, you will use the code below. I have highlighted
    where you add the type:


    Code Sample: Adding type to an ordered list


    <ol type = "A">


    <li>Teacher of the year in 2011</li>


    <li>Coached the Boy''s soccer team to the conference title in 2012</li>


    <li>Three former students received prestigious scholarships in 2015</li>


    </ol>


    When you test your code, you should now see your list organized by upper case
    alphabetical letters.  Here is an example:


    ![](images/00020.jpeg)


    Figure 4-6—Screenshot with our ordered list with type = “A”


    To use Roman numerals, you simply add an uppercase “I” to your type declaration. 
    Here is a sample:


    Code Sample: Adding type to an ordered list


    <ol type = "I">


    <li>Teacher of the year in 2011</li>


    <li>Coached the Boy''s soccer team to the conference title in 2012</li>


    <li>Three former students received prestigious scholarships in 2015</li>


    </ol>


    To use lowercase letters or Roman numerals, you simply add the lowercase version
    instead of an uppercase version. Along with our reversed attribute, this allows
    six different ways that we can display an ordered list. This offers you excellent
    flexibility and allows you to learn many different ways to structure listed information. 
    An increased understanding of CSS from a future book or course will provide you
    with many additional styling options for your lists.  As a result, your content
    will not only be well-organized but also creative and engaging.


    Links: Connecting to other pages on the World Wide Web


    One of the best features of the World Wide Web is the opportunity to easily link
    many different pages covering a wide variety of information. The convenience of
    being able to link to other pages provides you many benefits as a site creator.
    There are many reasons why you might want to add links to your page. We will cover
    a few of them here.  However, I encourage you to use your imagination and think
    of the numerous ways that you can incorporate links into your web designs. Adding
    links can support your content and provide a rich, unique and tailored experience
    to your visitors.


    To add a link, you will use an <a> tag with a special attribute. <a>  is an abbreviation
    for anchor. Often, as you will see in the following example, your link tags will
    live inside of other tags like <h1>, or <p>, or <ul>.


    The typical anchor element starts with an opening <a> tag and will have a href
    attribute. The attribute href is short for hypertext reference.  It will have
    a universal resource locator, or url. This is the website or link address. The
    second part of the element will have the text that will be rendered to the webpage
    and contain the link. This means the link text is clickable and houses the url
    that will take the visitor where they intended to go by clicking on the link.


    Here is an example of what a link in HTML looks like:


    Code Sample: Basic link structure


    <a href="url">link text</a>


    If, for example, I wanted to link to Yahoo.com, I could build the  element below.


    Code Sample: Basic link structure


    <a href="http://www.yahoo.com">Click here to go to Yahoo.com</a>


    Let’s look at the process of building a link element. Refer to the preceding code
    sample, as I outline the steps below.


    1.  Open the element with an <a tag


    2.  Add the href= attribute, and then, in quotes, add the url or address for the
    site you want to link to, exactly as we have done above.


    3.  Close the link portion with a >


    4.  Add the text the user will click to activate the link


    5.  Add a closing </a> tag


    While there seems to be more going on in a link element than we have seen in the
    other elements we have covered thus far,  you will always follow the same structure.
    With a little practice, you will have this new skill mastered and be able to take
    advantage of the full power of the web by linking to other HTML documents across
    the world.


    Now, let’s get more practice by adding a few links to our personal profile. In
    this section, I will also show you one or two unique functions that can improve
    the sophistication and functionality of your website.


    First, assume that we want to be able to share more information about where we
    grew up. It would be impractical to add a great deal of information about this
    since the purpose of this page is to share information about us. However, some
    visitors might be curious, and might want additional information. By providing
    them with a link, you can offer them the chance to learn more, while not taking
    up precious space on your page for those with less interest.


    For the purpose of this example, we will say that we grew up in Dallas, Texas
    and want to add a link to a site providing more information about Dallas.


    First, let’s start a new biography section to add some of this biographical information.
    I will start with a new <h3> and then add a brief introduction to the section
    in a <p> tag. I have highlighted the addition to our full code sample below.


    Code Sample: Adding a new header and link


    <!DOCTYPE html>


    <html>


    <head>


    <title>My Page</title>


    <link rel="stylesheet" type="text/css" href="css/style.css">


    </head>


    <body>


    <h1>Thanks for visiting my page and learning more about me! </h1>


    <h2>This site is designed as a personal profile.</h2>


    <p>I graduated from the University of Texas in 2010 with a degree in English. 
    I am an English teacher and soccer coach and learning to build web pages. Here
    are some things I like to do in my free time:</p>


    <ul>


    <li>basketball</li>


    <li> soccer</li>


    <li> table tennis</li>


    </ul>


    <h3> Below are some my career accomplishments</h3>


    <ol>


    <li>Teacher of the year in 2011</li>


    <li>Coached the Boy''s soccer team to the conference title in 2012</li>


    <li>Three former students received prestigious scholarships in 2015</li>


    </ol>


    <h3> A brief Biography</h3>


    <p> I am originally from Dallas, Tx.  I have many fond memories of Dallas. Click
    <a href="http://http://dallascityhall.com/Pages/default.aspx">here</a> if you
    want to learn more about Dallas. </p>


    </body>


    </html>


    Notice how we have embedded the link inside of the <p> tag. With links to remember
    that we not only need to add an address or link, but we also must indicate what
    text we want to display that will be linked. In this case, the word ‘here’ in
    the previous code will house the link and by clicking on that word, the visitor
    will be taken to that site. The other text will not be linked and will simply
    be placed around the linked text.


    Now that we know how to add a link, let’s explore a fun and useful way to add
    functionality for our visitors and make it easy for them to contact us. Let’s
    add our email address as a link that visitors can click on to reach out to us
    in a convenient way. We will add this as the last element in our <head> section,
    right under the <h2> tag.


    To add this functionality, you will build an element that looks very similar to
    a normal link element.  However, you will add a command called “mailto:” that
    opens the visitor’s email and generates a new email that is addressed to you.
    Here is an example of how it looks:


    <a href="mailto:youremailaddress">Email Me</a>


    You will notice the normal <a> tag for a link, for the href, we have added mailto:
    which is followed by an email address, and the link text at the end of the element
    before the closing tag. I will add the code below to my profile below the <h2>
    element at the bottom of the <head> section. Feel free to use your own email address
    where I have added the [contact@learntoprogram.tv](mailto:contact@learntoprogram.tv)
    address.'
