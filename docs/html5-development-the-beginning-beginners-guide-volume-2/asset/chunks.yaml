    ## 引言


    祝贺！你已经迈出了重要的一步，开启了学习 HTML5 并创建自己页面的有趣旅程。这种感觉应该让你感到充满动力。你理解网站带来了多少快乐。本书的目标是带你循序渐进。这本书是为初学者设计的。我们将一起通过简单的示例，从最开始开始。我们的目标是为每个步骤提供引人入胜的视角，以便我们在过程中积累知识和信心。让我们开始


    ## HTML5 的构建模块：元素、标签和属性


    如果你以前看过 HTML5 或者尝试过构建网站，你可能会觉得它就像火箭科学一样复杂且令人生畏。我们希望随着你对本书的阅读，这种畏感将会消失，你将对自己构建网页页的能力获得实质性的信心。


    建立信心的最佳起点是对比 HTML5 及其用途有一个非常简短的理解。


    简单来说，HTML5 是一种用于在万网上结构化和展示内容的语言。任何网站的目标都是通信。你的 HTML5 代码将对内容进行结构化并与浏览器协作向访问者展示内容。当前标准
    HTML5 是该语言的最新标准。HTML 正在不断进化，以支持最新的多媒体和技术。这对你来说是个好消息，因为该语言保持着新且灵活，让你能够在最新的设备上以你认为的方式传播你的内容。


    学习简单的 HTML5 方法并构建网页的第一步是理解这些构建模块实际上有多简单。所有 HTML5 程序的基础构建模块都是元素、标签和属性。你程序的基础将是
    HTML 元素，而标签和属性是元素的一部分，让你能够控制内容、布局和结构，并最终控制你的网站。


    '
- fmt: '

    Here is an example of tags. I have highlighted them in the example:


    ```

    <p>This is text that will appear on a website</p>

    ```


    We will cover many types of tags and what they mean later in the book. In this
    case, `<p>` is short for paragraph, and the text between the bracketed tags will
    appear in the browser. It is not necessary to what about what the tags do yet.
    It is more important to focus on the overall structure.


    ![](images/00001.jpeg)

    Figure 1-1—HTML elements and tags


    Tags are always bookended by angle brackets. The letters inside the brackets indicate
    the type of tag it is. The contents of the tag represent the content that the
    tag is structuring for a browser. Most tags have a closing tag which is symbolized
    by a forward slash in front of the tag name inside of the normal angle brackets.


    It might be necessary to add additional content or structure with a tag. We do
    that using an attribute.


    Here is our example tag we used previously. However, now we have added an attribute.
    I have highlighted the attribute.


    ```html

    <p align="center">This is text that will appear on a website</p>

    ```


    As you can probably guess, the attribute, in this case, will center our text.


    An attribute is placed within the opening tag and an HTML tag can have one or
    many attributes. Attributes are always included in the opening tag. They are preceded
    by a space and they include the name of the attribute, an equal sign, and a value
    in quotes.


    ![](images/00002.jpeg)

    Figure 1-2—Placement of an attribute


    With that as a base of understanding, I am confident you are ready to write your
    first lines of HTML5 code! There is only one additional tool that we need.


    One of the most basic tools for building a web page is a text editor. A text editor
    will not only house your code but it will also help you keep your web page project
    organized. A good text editor is your best friend when you build code for your
    sites.


    There are many available options for very good text editors. For this project,
    we will use `Brackets` from Adobe. `Brackets` is a great editor, easy to install,
    and simple to use. However, do not let its simplicity fool you. It also has very
    powerful capabilities and is used every day by many professionals building and
    maintaining the websites of tomorrow.


    The first step is to download and install your text editor.


    ### How to install and run Brackets:


    ![](images/00003.jpeg)

    Figure 1-2.5—Download screen for `Brackets.io`


    1. In your browser, navigate to `Brackets.io` and click on the blue download button
    in the middle of the screen that says “Download Brackets”.

    2. Click `Open` to open the `Installer`.

    3. Follow the instructions on the installer and click `finish` or `install`.

    4. When you are finished with the installation, open `Brackets`.

    5. By default, `Brackets` opens a folder containing some simple "Getting Started"
    content. Read through this to get a feel for `Brackets` and some of the terminology
    used. Don’t worry if you don’t understand some or all of what it covers.


    ### Your First Program


    Now that you have access to `Brackets`, it is time to build your first HTML5 script!
    Let me be the first to congratulate you. In the next few minutes, you will have
    your very first page up.


    Your first step is to create a new folder where you would like to save your files
    and store your webpage.


    1. Right click in the location you want to create your folder such as your desktop
    or normal folder directory.

    2. Click `New`.

    3. Click `Folder`.

    4. Name your folder `My Page`.


    Now that you have a project folder created, it is time to start a file in your
    text editor. In `Brackets`, click `File` and then `New`.


    At this point, you have a blank text file in the text editor. This is exactly
    where every good web page starts.


    Let’s type our first line of text into `Brackets` for our site. I’ll start with:


    `Thanks for visiting my page and learning more about me!`


    After typing this, follow this simple process to start saving your file.


    1. Click `File`

    2. Click `Save as`

    3. Name your first page `index.html`


    It is critical to use a `.html` extension so that your text editor and browsers
    know to read this file as an HTML file. The title `index` is a customary title
    for the primary or home page of a website. For the purposes of this exercise,
    I’ll save our first page as: `index.html`


    Now click `Save`. At this point, you should have your very first page to render
    to a browser. In `Brackets`, you will click on the small lightning bolt icon in
    the upper right of your screen to test your code in a browser. This is called
    the `Live Preview` feature.


    ![](images/00004.jpeg)

    Figure 1-3—Live Preview feature in `Brackets`


    If you do this now, you should see this:


    ![](images/00005.jpeg)

    Figure 1-4—First rendering to browser


    Congratulations! This is the small and humble starting point of what will be a
    fantastic web page in the not so distant future. All web pages start as a blank
    canvas.


    From this first step, we can see that we are able to render content to a browser
    with no additional HTML5. This will remain true throughout all of your scripts.
    Your text and other parts of your content will maintain their native structure.
    The HTML tags and attributes that you place around your content will assist you
    in building a web page by structuring that content. Additionally, a great deal
    of styling, design and decorative elements will come from the CSS you add.


    Let’s delete the first line we typed that we used as a test. We will now add some
    basic HTML tags and begin to build our actual site. We will add the tags below
    to our `index.html` file in `Brackets`. This is known as the HTML Boilerplate.
    It is the initial starting point for every page built in HTML.


    #### Code sample: Initial HTML Boilerplate


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title></title>

    </head>

    <body>

    </body>

    </html>

    ```


    The `!DOCTYPE` declaration indicates to the browser the version of HTML that the
    document is written in. Every HTML file you write will have the same starting
