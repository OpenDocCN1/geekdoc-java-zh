  trans: "\n在最后一个代码示例中，你还会看到一个 `<textarea>` 标签。你将像常一样打开和关闭这个标签。这会创建一个文本框。你需要通过选择行数和列数来指定大小。\n\
    \n在闭合标签 `</form>` 之前你还会看到一个带有 `type=\"submit\"` 属性的 `<input>` 标签。这为我们的用户创建一个通用的提交按钮，用于向我们发送信息，它位于表单的底部。在这个块中，我们还将关闭\
    \ `form`、`body` 和 `html` 标签。\n\n### 代码示例：我们表单的第一段代码\n\n```html\n<fieldset style=\"\
    width:35%\">             \n<legend>请随时添加你对未来博客文章的想法：</legend>\n<textarea rows=\"\
    5\" columns=\"500\"></textarea>\n</fieldset>\n<br><br>\n<input type=\"submit\"\
    \ value=\"Submit\">\n</form>\n</body>\n```\n\n保存你的代码并在浏览器中测试。它看起来应该像这样：\n\n![](img/00036.jpeg)\n\
    \n图 1-10—添加了文本框\n\n你现在对表单有了良好的基础理解。我们构建了三种类型的表单，并将它们整洁地布局在一个带有提交按钮的表单中。做得好！这将让你在未来学习其他技术时乐在其中。它将使你能够在\
    \ `CSS` 中创建额外的样式，并使用 Javascript 创建交互，以处理从访问者那里接收的数据，并进一步丰富他们的体验。\n\n### 下一步工作\n\
    \n完成这本书以及我们涵盖的所有练习绝对让你自豪。我真心相信，在编程方面，在实践中学习是唯一有意义的学习方式。我们确实得到了大量的练习。祝贺你！\n\n除此之外，我认为构建网页应该是有趣的。我还将提高你与更广泛的连接和交流的能力。我鼓励你在这里所学的基础上继续进步，将其作为持续学习的跳板。\n\
    \n你现在已经知道了如何在网上添加内容的知识。你还理解允许你处理这些内容的标签、元素和属性。你现在可以学习如何使用 `CSS` 对内容进行样式设计，让你的网页设计通过色彩和创意焕发生。你还可以学习\
    \ Javascript，这是一种允许网页进行深层次交互的语言。它能够实现用户与浏览器之间更好的通信，使你的网页元素更具动态感。\n\n想想你学了多少——你才刚刚开始！在未来，你的限制将只有你自己的奉献和想象力。\n\
