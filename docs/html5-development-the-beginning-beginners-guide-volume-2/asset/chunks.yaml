    </table>\n```\n\n当我们在浏览器中测试代码时，它应该看起来像：\n\n![](img/00031.jpeg)\n\n图 6-4—带有表格、标题和图片的页面\n\
    \n我们还希望为我们的页面添加一个居中的页眉。我们还会添加一个 `<h1>`。\n\n### 代码示例：为表格添加边框、宽度和对齐方式\n\n```html\n\
    <table border=\"1\" style=\"width:50%\" align=\"center\">\n  <caption>My Work\
    \ History</caption>\n  <img src=\"http://images.freeimages.com/images/previews/67e/office-1238353.jpg\"\
    \ alt=\"My office\" width=\"400\" height=\"200\">\n...\n```\n\n"
- fmt: "\nSave your file and test your code. It should render in the upper left and\
    \ the link to the Main Page should be live. We will create the Blog page in the\
    \ next section. As you study the code, you can see that what we are doing is adding\
    \ links to our own pages inside of `<nav>` tags. Here is a screen shot:\n\n![](images/00034.jpeg)\n\
    \nFigure 7-2—work.html page with navigation links added\n\nGreat work! Allowing\
    \ for easy and functional navigation is the key to a positive user experience.\
    \ You should now see how how to begin to use a fundamental understanding of different\
    \ elements to speed your learning in other areas. In this case, a knowledge of\
    \ how to format tags and links assisted us in quickly learning navigation. A key\
    \ to good programming is to constantly “borrow” what you know in one area, and\
    \ to apply it as often as it makes sense in other areas.\n\nNow that we are adding\
    \ multiple ways for visitors to experience our content, it is time to add some\
    \ important interactive elements and allow our visitors to provide us data and\
    \ feedback through the use of forms.\n\n## Forms: Add Additional Interactivity\n\
    \nForms are a great addition to your site. They offer another layer of communication\
    \ with your visitors. Good forms allow you to accept feedback and data from your\
    \ visitors. As a result, your website becomes an effective two way street between\
    \ you and your guests. To properly store and use this data on the backend, you\
    \ will need to add some additional code and programming (not covered here). We\
    \ will show you how to add a basic form on the front end of a website. This will\
    \ help you to understand the fundamentals of presenting forms in a browser and\
    \ begin to think about all of the fantastic ways you can add this interactive\
    \ feature to your site.\n\nFor this example, we are going to create a new blog\
    \ on our site, but we want to ask for some information from our visitors about\
    \ what type of blog they want to see. We will build a form to collect this information\
    \ from our visitors. In order to maximize your learning, we will build three different\
    \ types of small forms.\n\nThe first step is to create a new file in your text\
    \ editor and call it `blog.html`. Save it in the `My_Page` folder that we are\
    \ using for our project. This is the same process you followed to create the `work.html`\
    \ file in the last section.\n\nAdd the following code to the top of the blank\
    \ file to get your HTML file started with a `<head>` section, your navigation\
    \ elements and the content that we will use to explain the purpose of this page.\
    \ You will then link your CSS file. Take a minute to study the elements in this\
    \ code. They should all be familiar to you. You can also review what was covered\
    \ in previous sections of the book.\n\n### Code Sample: Starting our page to house\
    \ our forms\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n    <title>My Blog</title>\n\
    <link rel=\"stylesheet\" type=\"text/css\" href=\"css/styling.css\">\n</head>\n\
    <body>    \n<nav>\n  <a href=\"mypage.html\">Main Page</a> |\n  <a href=\"work.html\"\
    >Work History</a> |\n</nav>\n<h1 align=\"center\">My Blog Is Coming Soon! </h1>\n\
    <h2>Help me start my blog!!</h2>\n<p>I plan on starting a blog very soon. I plan\
    \ on writing about my favorite topics which include education, teaching, and web\
    \ design. Will you help me? Feel free to let me know which topics you would prefer,\
    \ and send me your personal information so I can add you to my mailing list and\
    \ let you know when the posts begin. Thanks again for your help, I look forward\
    \ to hearing from you!</p>\n</body>\n</html>\n```\n\nThere are many options to\
    \ design and style forms in HTML and CSS. I have chosen a simple framework that\
    \ will group different elements together and automatically add some borders to\
    \ keep our forms neat and organized.\n\nWe are going to introduce a few new tags,\
    \ which will be used in the code sample below. \n\n*   The `<form>` tag acts as\
    \ a container for all of our form elements.\n*   The `<br>` tag is short for break.\
    \ It will help us to separate elements onto different lines.\n*   The `<fieldset>`\
    \ tag will group our elements. This is not a required part of a form, but it will\
    \ help us to separate and group elements from a design perspective. As you try\
    \ out different approaches with your code, feel free to comment out these tags\
    \ and see how the form renders without the fieldset tag. This tag will default\
    \ to a width of 100% if you do not indicate a size. We can use either a `%` or\
    \ pixels.\n*   The `<legend>` tag provides a title for a particular section of\
    \ a form.\n*   The `<input>` tag is used to declare what type of input this section\
    \ of the form will accept through the `type` attribute. In this first instance,\
    \ it will be type=`radio` for radio buttons. Later in the form, we will also use\
    \ text.\n\nThe code sample below provides the first section of our form. We will\
    \ create three radio buttons to allow visitors to “vote” for what topics they\
    \ want to read about on our blog; education, web design, or both.\n\n### Code\
    \ Sample: First block of code for our forms\n\n```html\n<form>\n  <h3>I would\
    \ love to hear from you!</h3>\n  <br>\n  <fieldset style=\"width:50%\">\n    \
    \  <legend>What type of topics would you like to see?</legend>\n<input type=\"\
    radio\" name=\"blogtype\" value=\"education\">\n      <br>\n      <input type=\"\
    radio\" name=\"blogtype\" value=\"web design\">\n      <br>\n      <input type=\"\
    radio\" name=\"blogtype\" value=\"both\">\n  </fieldset>\n</form>\n```\n*(Note:\
    \ The code above has been cleaned up for clarity based on the provided text structure)*\n\
