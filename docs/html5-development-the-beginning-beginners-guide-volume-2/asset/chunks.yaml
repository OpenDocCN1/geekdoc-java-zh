- fmt: "\nWe will place the `<a>` tags inside of `<p>` tags so that we can control\
    \ their placement. In our opening `<p>` tag, we will add a `center` attribute\
    \ to place it in the middle of the page.\n\n### Code Sample: Adding a new header\
    \ and link\n\n```html\n<p align=\"center\"><a href=\"mailto:contact@learntoprogram.tv\"\
    >\n\nEmail Me</a></p>\n```\n\nAfter adding that code, please save your code and\
    \ then test it in the browser. The result should resemble this screenshot:\n\n\
    ![](images/00021.jpeg)\n\nFigure 4-7—Screenshot of the current version of our\
    \ site\n\nGreat work! Don’t worry if it takes you a few tries. Learning to code\
    \ takes considerable trial and error. However, it is the way that everyone learns.\
    \ You can now add links and even allow your visitors to email you with one click\
    \ of their mouse! That is certainly worth the effort it took.\n\n## Images: How\
    \ to Make Your Site Picture Perfect!\n\nAlong with links, another cornerstone\
    \ of every good site is images. The web is a highly visual medium. One of the\
    \ best ways to add an engaging visual flair to your site is through the effective\
    \ use of images. Good images help you to communicate messages, evoke emotion,\
    \ and add additional layers of content to engage your audience.\n\nWhen you’d\
    \ like to add images to your site, you will use the `<img>` tag with a `src` attribute.\
    \ The `src` stands for “Source” and works just like the `<a>` tag’s `href` attribute.\
    \ It tells the image tag where to find the image you’d want to include on your\
    \ page.\n\nBelow is an example of a `<img>` tag. You will notice that it does\
    \ not have a closing tag.\n\n### Code Sample: Example image tag\n\n```html\n<img\
    \ src=\"image url\" alt=\"brief title of image\" width=\"in pixels\" height=\"\
    in pixels\">\n```\n\nLet’s explain the parts of this tag in more detail.\n\n-\
    \ `<img>` will open your tag and element for adding images.\n- `src` is short\
    \ for source and directs the browser to where it will find an image.\n- `alt`\
    \ is what appears if there is an issue with displaying the image. It is also what\
    \ will be read by a screen reader.\n- `Width` will contain a number which will\
    \ specify the width of the image (in pixels) that will be displayed.\n- `Height`\
    \ will contain a number which specify the height of the image (in pixels) that\
    \ will be displayed.\n- There are many options that can be used for images. However,\
    \ you will want to always include these basic attributes in every `<img>` tag.\
    \ You want to tell the browser where to get the image, what text to place if it\
    \ has an issue as well as the height and width.\n\nThere are two ways to source\
    \ images for your site. Relative addressing tells your browser: “Look in our project\
    \ folder for the file specified. Or, if a folder is specified, look within that\
    \ folder for the file specified.”\n\nOn the other hand, when we link to a source\
    \ outside of our project, usually another website, it is referred to as an absolute\
    \ address.\n\nWe will want to add a profile picture to the top of our site. Let’s\
    \ start with an example of a relative address and use an image that we already\
    \ have.\n\nAt the top of our code, in the head section right below the `<h2>`\
    \ tag and above the email address we just added, we will build our `<img>` tag\
    \ so that we have a nice image at the top of our page. Go ahead and insert a blank\
    \ `<img>` tag that looks just like the code sample below and we will add to it\
    \ as we go.\n\n### Code Sample: Blank image tag\n\n```html\n<img src=\"\" alt=\"\
    \" width=\"\" height=\"\">\n```\n\nFirst, create a new subfolder on your computer\
    \ inside of the folder you are saving your HTML to. This will be the folder we\
    \ use to place our images.\n\nTo create a new folder, go to the folder where you\
    \ are saving your HTML and CSS and right-click any blank area (or press `CTRL\
    \ + click`). This will create a pop-up menu from which you can select new folder.\n\
    \n![](images/00022.jpeg)\n\nFigure 5-1—Creating a new folder\n\nName your new\
    \ folder `images`. In your folder, you should have an HTML file, a subfolder housing\
    \ your CSS, and a subfolder with your images.\n\nYou now have a place to save\
    \ any images that you want to display on your site. You can save a few images\
    \ that you might want to add to your web project to this folder. For the purpose\
    \ of this project, I will save images with a `.jpg` extension which indicates\
    \ that they are JPEG files. Exploring image file types will not be discussed here.\
    \ However, JPEG is a standard and widely used format that serves our purposes\
    \ well. I recommend that you add some images and save them to the folder as JPEG\
    \ files.\n\nI have named my project folder `My_Page` and I am keeping my images\
    \ in a folder titled `images`. To access that folder in an `<img>` tag, you can\
    \ use a line of code like the code sample below. I have highlighted the `src`\
    \ attribute pointing to the `.jpeg` file in our images folder.\n\n### Code Sample:\
    \ Adding sizes to our image\n\n```html\n<head>\n    <title>My Page</title>\n \
    \   <link rel=\"stylesheet\" type=\"text/css\" href=\"css/style.css\">\n</head>\n\
    <body>\n    <h1>Thanks for visiting my page and learning more about me! </h1>\n\
    \    <h2>This site is designed as a personal profile.</h2>\n    <img src=\"images/headshot.jpg\"\
    \ alt=\"headshot\" height=\"250\" width=\"200\">\n    <p align=\"center\"><a href=\"\
    mailto:contact@learntoprogram.tv\">\nEmail Me</a></p>\n```\n\nAfter adding the\
    \ image, my site looks like this:\n\n![](images/00023.jpeg)\n\nFigure 5-2—Current\
    \ version of code after adding `<img>`\n\nDon’t worry if your image isn’t centered\
    \ above the email address! We will cover that soon.\n\nWe will now discuss how\
    \ to add an image from another website. Please find an image online that you would\
    \ like to use. To be able to use an image that is already online, you will need\
    \ to locate that image address or `url`, and place that in your code. This a a\
    \ very simple process that is outlined below. First, put a blank image tag at\
    \ the bottom of your code below the last `<p>` tag and right above the last `</body>`\
    \ tag.\n\n1. Navigate to the image you like\n2. Right click your mouse button\
    \ while hovering over the image\n![](images/00024.jpeg)\n\nFigure 5-3—copying\
    \ image address\n3. Select “copy image address” from the menu that appears\n4.\
    \ Return to your code, and put your cursor between the quotes after `src=`\n5.\
    \ Right click on your mouse, and press paste.\n\nYou should now see the address\
    \ in your `<img>` tag as part of the source attribute and you should mirror the\
    \ following code sample.\n\n### Code Sample: Adding image from a url\n\n```html\n\
    <h3> A brief Biography</h3>\n<p> I am originally from Dallas, Tx. I have many\
    \ fond memories of Dallas. Click <a href=\"http://http://dallascityhall.com/Pages/default.aspx\"\
    >here</a> if you want to learn more about Dallas.</p>\n<img src=\"http://images.freeimages.com/images/previews/67e/office-1238353.jpg\"\
    \ alt=\"\" width=\"\" height=\"\">\n</body>\n</html>\n```\n\nAfter adding the\
    \ image, our site should resemble the following screen shot. Don’t worry if yours\
    \ is a different size. We will work on sizes soon. Here is how my page looks with\
    \ the image.\n\n![](images/00025.jpeg)\n\nFigure 5-4—with image from url added\n"
  raw: 'We will place the <a> tags inside of <p> tags so that we can control their
    placement. In our opening <p> tag, we will add a center attribute to place it
    in the middle of the page.


    Code Sample: Adding a new header and link


    <p align="center"><a href="mailto:contact@learntoprogram.tv">


    Email Me</a></p>


    After adding that code, please save your code and then test it in the browser.
    The result should resemble this screenshot:


    ![](images/00021.jpeg)


    Figure 4-7—Screenshot of the current version of our site


    Great work!  Don’t worry if it takes you a few tries. Learning to code takes considerable
    trial and error. However, it is  the way that everyone learns.  You can now add
    links and  even allow your visitors to email you with one click of their mouse!
    That is certainly worth the effort it took.


    Images: How to Make Your Site Picture Perfect!


    Along with links, another cornerstone of every good site is images. The web is
    a highly visual medium. One of the best ways to add an engaging visual flair to
    your site is through the effective use of images.  Good images help you to communicate
    messages, evoke emotion, and add additional layers of content to engage your audience.


    When you’d like to add images to your site, you will use the <img> tag with a
    “src” attribute. The “src” stands for “Source” and works just like the <a> tag’s
    “href” attribute. It tells the image tag where to find the image you’d want to
    include on your page.


    Below is an example of a <img> tag. You will notice that it does not have a closing
    tag.


    Code Sample: Example image tag


    <img src="image url" alt="brief title of image" width="in pixels" height="in pixels">


    Let’s explain the parts of this tag in more detail. 


    *   <img will open your tag and element for adding images.


    *   src is short for source and directs the browser to where it will find an image.


    *   alt is what appears if there is an issue with displaying the image.  It is
    also what will be read by a screen reader.


    *   Width will contain a number which will specify the width of the image (in
    pixels) that will be displayed.


    Height will contain a number which specify the height of the image (in pixels)
    that will be displayed.


    *   There are many options that can be used for images. However, you will want
    to always include these basic attributes in every <img> tag. You want to tell
    the browser where to get the image, what text to place if it has an issue as well
    as the height and width.


    There are two ways to source images for your site. Relative addressing  tells
    your browser: “Look in our project folder for the file specified. Or, if a folder
    is specified, look within that folder for the file specified.”


    On the other hand, when we link to a source outside of our project, usually another
    website, it is referred to as an absolute address.


    We will want to add a profile picture to the top of our site. Let’s start with
    an example of a relative address and use an image that we already have.


    At the top of our code, in the head section right below the <h2> tag and above
    the email address we just added, we will build our <img> tag so that we have a
    nice image at the top of our page. Go ahead and insert a blank <img> tag that
    looks just like the code sample below and we will add to it as we go.


    Code Sample: Blank image tag


       <img src="" alt="" width="" height="">


    First, create a new subfolder on your computer inside of the folder you are saving
    your HTML to. This will be the folder we use to place our images.


    To create a new folder, go to the folder where you are saving your HTML and CSS
    and right-click any blank area (or press CTRL + click). This will create a pop-up
    menu from which you can select new folder.


    ![](images/00022.jpeg)


    Figure 5-1—Creating a new folder


    Name your new folder “images”.


    In your folder, you should have an HTML file, a subfolder housing your CSS, and
    a subfolder with your images.


    You now have a place to save any images that you want to display on your site.
    You can save a few images that you might want to add to your web project to this
    folder. For the purpose of this project, I will save images with a .jpg extension
    which indicates that they are JPEG files. Exploring image file types will not
    be discussed here. However, JPEG is a standard and widely used format that serves
    our purposes well.   I recommend that you add some images and save them to the
    folder as JPEG files.


    I have named my project folder My_Page and I am keeping my images in a folder
    titled images. To access that folder in an <img> tag, you can use a line of code
    like the code sample below. I have highlighted the src attribute pointing to the
    .jpeg file in our images folder.


    Code Sample: Adding sizes to our image


    <head>


                  <title>My Page</title>


    <link rel="stylesheet" type="text/css" href="css/style.css">


    </head>


    <body>


    <h1>Thanks for visiting my page and learning more about me! </h1>


    <h2>This site is designed as a personal profile.</h2>


    <img src="images/headshot.jpg" alt="headshot" height="250" width="200">


    <p align="center"><a href="mailto:contact@learntoprogram.tv">


    Email Me</a></p>


    After adding the image, my site looks like this:


    ![](images/00023.jpeg)


    Figure 5-2—Current version of code after adding  <img>


    Don’t worry if your image isn’t centered above the email address!  We will cover
    that soon.


    We will now discuss how to add an image from another website. Please find an image
    online that you would like to use. To be able to use an image that is already
    online, you will need to locate that image address or url, and place that in your
    code. This a very simple process that is outlined below.  First, put a blank image
    tag at the bottom of your code below the last <p> tag and right above the last
    </body> tag.


    1.  Navigate to the image you like


    2.  Right click your mouse button while hovering over the image


    ![](images/00024.jpeg)


    Figure 5-3—copying image address


    3.  Select “copy image address” from the menu that appears


    4.  Return to your code, and put your cursor between the quotes after src=


    5.  Right click on your mouse, and press paste. 


    You should now see the address in your <img> tag as part of the source attribute
    and you should mirror the following code sample.


    Code Sample: Adding image from a url


    <h3> A brief Biography</h3>


    <p> I am originally from Dallas, Tx.  I have many fond memories of Dallas. Click
    <a href="http://http://dallascityhall.com/Pages/default.aspx">here</a> if you
    want to learn more about Dallas.</p>


    <img src="http://images.freeimages.com/images/previews/67e/office-1238353.jpg"
    alt="" width="" height="">


    </body>


    </html>


    After adding the image, our site should resemble the following screen shot. Don’t
    worry if yours is a different size. We will work on sizes soon. Here is how my
    page looks with the image.


    ![](images/00025.jpeg)


    Figure 5-4—with image from url added


    Save your file and test your code in the browser.


    This looks great! Adding images is a fun and creative way to layer in content
    and add depth to your ability to communicate with your visitors.


    There are still a few elements that we need to add to our image tag. First, we
    have total control over the size of the image as it renders on our page, so let’s
    work with our height and width. As you noticed when you rendered the latest version
    of your code, you do not need to enter a height and width. However, it is a best
    practice and something that you will want to have a good grasp of. Images will
    come in at different sizes due to their original properties. You will want to
    maintain control over the image, and make sure that you have prescribed a height
    and width that aligns with what you need for your page.'
