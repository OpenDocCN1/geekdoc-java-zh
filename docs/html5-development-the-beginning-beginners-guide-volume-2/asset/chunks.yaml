  raw: 'Save your file and test your code. It should render in the upper left and
    the link to the Main Page should be live. We will create the Blog page in the
    next section. As you study the code, you can see that what we are  doing is adding
    links to our own pages inside of <nav> tags. Here is a screen shot:


    ![](images/00034.jpeg)


    Figure 7-2—work.html page with navigation links added


    Great work! Allowing for easy and functional navigation is the key to a positive
    user experience. You should now see how  to begin to use a fundamental understanding
    of different elements to speed your learning in other areas. In this case, a knowledge
    of how to format tags and links assisted us in quickly learning navigation. A
    key to good programming is to constantly “borrow” what you know in one area, and
    to apply it as often as it makes sense in other areas.


    Now that we are adding multiple ways for visitors to experience our content, it
    is time to add some important interactive elements and allow our visitors to provide
    us data and feedback through the use of forms.


    Forms: Add Additional Interactivity


    Forms are a great addition to your site. They offer another layer of communication
    with your visitors. Good forms allow you to accept feedback and data from your
    visitors. As a result, your website becomes an effective two way street between
    you and your guests. To properly store and use this data on the backend, you will
    need to add some additional code and programming (not covered here). We will 
    show you how to add a basic form on the front end of a website. This will help
    you to understand the fundamentals of presenting forms in a browser and begin
    to think about all of the fantastic ways you can add this interactive feature
    to your site.


    For this example, we are going to create a new blog on our site, but we want to
    ask for some information from our visitors about what type of blog they want to
    see. We will build a form to collect this information from our visitors. In order
    to maximize your learning, we will build three different types of small forms.


    The first step is to create a new file in your text editor and call it blog.html.
    Save it in the My_Page folder that we are using for our project. This is the same
    process you followed to create the work.html file in the last section.


    Add the following code to the top of the blank file to get your HTML file started
    with a <head> section, your navigation elements and the content that we will use
    to explain the purpose of this page. You will then link your CSS file. Take a
    minute to study the elements in this code. They should all be familiar to you.
    You can also review what was covered in previous sections of the book.


    Code Sample: Starting our page to house our forms


    <!DOCTYPE HTML>


    <html>


    <head>


                  <title>My Blog</title>


    <link rel="stylesheet" type="text/css" href="css/styling.css">


    </head>


    <body>   


    <nav>


      <a href="mypage.html">Main Page</a> |


      <a href="work.html">Work History</a> |


    </nav>


    <h1 align="center">My Blog Is Coming Soon! </h1>


    <h2>Help me start my blog!!</h2>


    <p>I plan on starting a blog very soon. I plan on writing about my favorite topics
    which include education, teaching, and web design.  Will you help me? Feel free
    to let me know which topics you would prefer, and send me your personal information
    so I can add you to my mailing list and let you know when the posts begin.  Thanks
    again for your help, I look forward to hearing from you!</p>


    </body>


    </html>


    There are many options to design and style forms in HTML and  CSS. I have chosen
    a simple framework that will group different elements together and automatically
    add some borders to keep our forms neat and organized.


    We are going to introduce a few new tags, which will be used in the code sample
    below. 


    *   The <form> tag acts as a container for all of our form elements.


    *   The <br> tag is short for break. It will help us to separate elements onto
    different lines.


    *   The <fieldset> tag will group our elements. This is not a required part of
    a form, but it will help us to separate and group elements from a design perspective.
    As you try out different approaches with your code, feel free to comment out these
    tags and see how the form renders without the fieldset tag.  This tag will default
    to a width of 100% if you do not indicate a size. We can use either a % or pixels.


    *   The <legend> tag provides a title for a particular section of a form.


    *   The <input> tag is used to declare what type of input this section of the
    form will accept through the type attribute. In this first instance, it will be
    type= “radio” for radio buttons. Later in the form, we will also use text.


    The code sample below provides the first section of our form. We will create three
    radio buttons to allow visitors to “vote” for what topics they want to read about
    on our blog; education, web design, or both.


    Code Sample: First block of code for our forms


    <form>


      <h3>I would love to hear from you!</h3>


      <br>


      <fieldset style="width:50%">                                               


      <legend> What type of topics would you like to see discussed?</legend>                                              


      <input type="radio" name="blogtype" value="education">Education


      <br>


      <input type="radio" name="blogtype" value="web">Web Design


      <br>


      <input type="radio" name="blogtype" value="both">Both!


      <br>


      </fieldset>


    The value attribute associates the value given by the input. The name attribute
    is an entry that indicates the data you are collecting. The name attribute is
    used to reference elements later in Javascript, or to reference form data after
    a form is submitted, both of which are beyond our scope here. It is important
    to understand these  other uses in order to later use advanced skills like Javascript. 
    The now important to have a good understanding of the building blocks in HTML.


    You can see in the text what will appear in the form that renders in the browser.
    At the end of each line of code that begins with an input type, you can see the
    words Education, Web Design, and Both!. Whatever text is outside of the <input>
    tag will appear in the browser. 


    After each line, we also added a <br> to help us space our form elements.


    The next sample of code will provide another group of form elements.  However,
    these will be text field inputs instead of radio buttons.


    Code Sample: First block of code for our forms


    <fieldset style="width:50%">


    <legend> Your Information</legend>


      First name:<br>


    <input type="text" name="firstname">


      <br>


      Last name:<br>


      <input type="text" name="lastname">


      <br>


      Email:<br>


      <input type="email" name="email">


    <br>


      Zip Code:<br>


      <input type="number" name="number">


      <br>


      </fieldset>


    Before starting to work with this code, you  should spend a few minutes comparing
    the two samples in order to determine similarities and differences. The tags are
    primarily the same. The main differences are the values in the attributes. It
    is important to remember that we are now adding a form that accepts text inputs
    while the previous form was a series of radio buttons.


    You will also notice we placed the breaks between the text and the input fields.
    This was an optional design choice. You  can place your <br> tags wherever you’d
    like. If you want the text input fields to appear next to the text like in the
    radio button section, just switch the <br> tags to after the input fields like
    we did with the radio button section.


    After adding the code, please save your file and test your code in a browser.
    It should look like this:


    ![](images/00035.jpeg)


    Figure 8-1—First form elements added


    Our last section of code will provide our visitors with an open entry text box
    to send us their own comments, thoughts and ideas. Instead of specific inputs,
    we want to set up a text box with a general question and/or title so that visitors
    can type and submit their thoughts.'
