    输入 `<p>` 标签后，保存并在浏览器中测试你的代码。下面的截图演示了我的页面是如何渲染的。


    ![](img/00008.jpeg)


    图 1-7——添加标题和 `<p>` 标签


    让我们添加一个二级标题，为访问者提供视觉和导航提示，让他们知道页面的预期。我将添加一个 `<h2>` 标签和一些文本，这些内容在下面的代码示例中被复制并突出显示。


    代码示例：添加二级标题标签


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>My Page</title>

    </head>

    <body>

