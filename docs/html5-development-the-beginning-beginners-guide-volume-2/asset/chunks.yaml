  trans: "\n默认测量在 `HTML5` 中几乎总是以像素或数值百分比表示的。当你开始尝试构建网页时，在测试不同尺寸时，你会经常在代码和浏览器中的渲染版本之间来回切换。这完全没有问题，而且这也是专业且经验丰富的开发人员的工作方式。\n\
    \n编码通常是一个非常反复的过程，充满了尝试和错误。你应该在代码和浏览器的渲染版本之间来回切换。拥抱这种过程并享受其中吧，因为这是构建你最终会感到自豪的事物的最佳方法。在调整图像等尺寸时，这一点尤为真实。\n\
    \n尺寸没有绝对的规则。这就像在家里墙上挂画一样。第一次尝试很少是完美的，或者完全符合你的意愿。在 `HTML5` 中调整图像大小也非常相似。享受尝试不同的选项，花时间考虑最佳方案，并始终朝着与你想要传达的信息一致的设计和布局努力。\n\
    \n虽然编码对你来说可能是全新的，但在做出最终布局和设计决策时，请相信你的直觉。你清楚你的网站应该什么样，当你看到时就会知道，所以请继续尝试不同的选项，调整代码并经常测试，这样当你看到最适合你的布局时，你会充满信心，因为你已经尝试过几种。\n\
    \n我要给我的 `img` 元素添加 400 像素或 200px 的宽度和高度。请花时间尝试不同的尺寸并在浏览器中测试它们。\n\n### 代码示例：为我们的图像添加尺寸\n\
    \n### 简要简历\n\n```html\n<p>我来自德克萨斯州达拉斯。我对达拉斯有许多美好的回忆。如果你想了解更多关于达拉斯的信息，请点击<a href=\"\
    http://http://dallascityhall.com/Pages/default.aspx\">这里</a>。</p>\n\n<img src=\"\
    http://images.freeimages.com/images/previews/67e/office-1238353.jpg\" alt=\"\"\
    \ width=\"400\" height=\"400\">\n```\n```\n\n也有为我们的 `alt` 属性添加一些文本。这些文本在图像未加载时会显示。它也是屏幕阅读器读取的内容。屏幕阅读器是允许盲人或视障人士使用语音合成器或盲文显示器阅读电脑屏幕上显示的文本的软件程序。\n\
    \n对于我通用的办公图像，我将添加一些基础文本，并在下方的代码示例高亮部分进行演示。请自由使用你认为能简要描述图像的任何文本。\n\n### 代码示例：为图像添加\
    \ alt 文本\n\n### 简要简历\n\n```html\n<p>我来自德克萨斯州达拉斯。我对达拉斯有许多美好的回忆。如果你想了解更多关于达拉斯的信息，请点击<a\
    \ href=\"http://http://dallascityhall.com/Pages/default.aspx\">这里</a>。</p>\n\n\
    <img src=\"http://images.freeimages.com/images/previews/67e/office-1238353.jpg\"\
    \ alt=\"我的办公室\" width=\"400\" height=\"400\">\n```\n```\n\n花时间保存你的代码并在浏览器中测试。只要你的图像显示正常，你的\
    \ `alt` 就不会出现。最后，让我们让图像居中。为了做到这一点，我们将回到 `CSS`。我们将告诉 `CSS` 让图像独占一行，并占据该行的全宽，同时在两侧留有等的边距。这可以通过下面的规则实现：\n\
    \n### 代码示例：居中我们的图像\n\n```css\nimg {\n    display: block;\n    margin-left: auto;\n\
    \    margin-right: auto;\n}\n```\n确保你保存了 `CSS` 和 `HTML` 文件并在浏览器中测试它们。它们现在应该像这样：images/0026.jpeg\
    \ 图 5-5—带有图像\n\n你可以玩图像玩很多趣。对 `CSS` 更深入理解将为你提供更多选项。通过实践来学习是非常重要的。这将为你前进提供极佳的基础。\n\
    \n### 表格：为内容提供额外的组织和布局\n\n正如我们讨论过的，`HTML5` 为构建网页内容提供了很好的工具。你可以使用的另一种常见格式是使用表格结构化数据。作为示例简介的一部分，我们将最近的历史放入一个类似于常见简历格式的表格中。这是我们想要完成的示例：images/0027.jpeg\
    \ 图 6-0—表格数据示例\n\n表格是一个更复杂的元素，比我们过的其他元素需要更多的代码。学习如何构建表格需要几个步骤来逐步建立表格，并掌握序列中的每一个步骤。第一步是开启一个包含我们工作经历的新页面。步骤如下：\n\
    \n1. 在 Brackets 中，点击 `File`（文件）\n2. 点击 `New`（新建）打开一个空白文件\n3. 再次点击 `File`（文件）\n\
    4. 点击 `Save As`（另存为）\n5. 将文件命名为 `work.html`，并确保在保存时选择了包含项目其他部分的 `My_Page` 文件夹。这与我们保存\
    \ `index.html` 文件的文件夹是同一个。这是第一段代码，它将提供 `HTML5` 中的基础表格结构。从添加模板代码开始。将页面标题命名为 work\
    \ history（工作经历）。我们还想确保添加我们的 `CSS` 表格。我还正确地添加了工作经历中最近的一个职位，即林肯高中的英语老师，这将从基础表格的格式化开始。\n\
    \n### 代码示例：添加基础表格\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Work\
    \ History</title>\n    <link rel=\"stylesheet\" type=\"text/css\" href=\"css/style.css\"\
    >\n</head>\n<body>\n    <table>\n        <tr>\n            <td>English Teacher</td>\n\
    \            <td>Lincoln High School</td>\n            <td>2015-2016</td>\n  \
    \      </tr>\n    </table>\n</body>\n</html>\n```\n\n类似于列表中的所有项目都位于两个 `li` 标签之间，表格中的所有元素都将位于开启\
    \ `table` 标签和关闭 `table` 标签之间。`tr` 标签是 table row（表格行）的缩写。该标签分隔每个唯一的行。`tr` 标签之间列出的每个项目将占据一个单元格，项目将组织成行。`td`\
    \ 标签之间的每个项目将占据自己的单元格，并代表你表格中的数据。前一个示例中的代码应该渲染出一个像这样的单行表格：images/0028.jpeg 图 6-1—构建表格的第一步\n\
    \n到目前为止表格还不完整。然而，这段基础代码的准确性非常重要。它应该为我们构建表格其余部分将要使用的模式提供良好的感。现在我将添加两个与上一个示例完全相同的代码块。每个代码块将代表一行工作经历，并遵循完全相同的模式。这里是完整的代码示例：\n\
    \n### 代码示例：添加基础表格\n\n```html\n<table>\n    <tr>\n        <td>English Teacher</td>\n\
    \        <td>Lincoln High School</td>\n        <td>2015-2016</td>\n    </tr>\n\
    \    <tr>\n        <td>Soccer Coach</td>\n        <td>Lincoln High School</td>\n\
    \        <td>2012-2015</td>\n    </tr>\n    <tr>\n        <td>Tutor</td>\n   \
    \     <td>Rosedale High School</td>\n        <td>2010-2011</td>\n    </tr>\n</table>\n\
    ```\n\n我们现在表格中有了三行工作经历。让我们保存文件并在浏览器中测试。它看起来应该像这样：images/0029.jpeg 图 6-2—表格中格式化的数据示例\n\
    \n到目前为止一切顺利！但我们还没有结束！良好的表格应该设计良好的表头，以便我们的访问者确切知道他们在看什么。为了添加表头，我们只需添加一个开启的 `thead`\
    \ 标签，然后创建一个包含每列表头的 `tr` 标签的新行。然后我们添加关闭的 `thead` 标签。我们还需要将表格主体放在开启的 `tbody` 标签和关闭的\
    \ `tbody` 标签之间。我们的表格代码块所示：\n\n### 代码示例：添加表格表头\n\n```html\n<table>\n    <thead>\n\
    \        <tr>\n            <th>Title</th>\n        </tr>\n    </thead>\n</table>\n\
    ```\n\n"
- fmt: "\n| Location | Year | Year |\n| :--- | :--- | :--- |\n| English Teacher |\
    \ Lincoln High School | 2015-2016 |\n| Soccer Coach | Lincoln High School | 2012-2015\
    \ |\n| Tutor | Rosedale High School | 2010-2011 |\n\nOur table is certainly getting\
    \ there! Let’s save the file and render it in a browser.\n\n![](images/00030.jpeg)\n\
    \nFigure 6-3—Example of data formatted in a table\n\nAt this point, the basic\
    \ structure of our table is taking shape. We will want to add some basic styling\
    \ to our table. A good table should have a simple and well organized layout. It\
    \ is very important not to overdo it. However, by adding some borders and emphasizing\
    \ certain text and rows, we can visually help our visitors understand the data\
    \ in our table and make sure that the information flows logically.\n\nTo better\
    \ separate the data, we will add a border. A border is optional, but we will add\
    \ one here to help you practice with its functionality. We will also add an attribute\
    \ to control the width of the table.\n\n### Code Sample: Adding border and width\
    \ to a table\n\n```html\n<table border=\"1\" style=\"width:100%\">\n  <thead>\n\
    \    <tr>\n      <th>Title</th>\n      <th>Location</th>\n      <th>Year</th>\n\
    \    </tr>\n  </thead>\n...\n</table>\n```\n\nYou will notice the width is set\
    \ to 100%. The two most common options for sizing in HTML5 are either in pixels\
    \ or percentages. Save your file, test your code and see how the table looks at\
    \ 100%.\n\nI am going to set the final version at 50%. I have highlighted it in\
    \ the code sample that is shown below. We will also center our table with another\
    \ attribute in the opening `<table>` tag. We will add an `align` attribute with\
    \ a property of `center`.\n\nThe last step is to add an overall title to our table.\
    \ In HTML5, this is referred to as our caption. We will add an opening `<caption>`\
    \ tag and a closing `</caption>` tag and place the text between the tags we want\
    \ to use as a title for our table. You can see where to place it from the sample\
    \ below. The code we are adding is highlighted.\n\n### Code Sample: Adding border,\
    \ width and alignment to a table\n\n```html\n<table border=\"1\" style=\"width:50%\"\
    \ align=\"center\">\n  <caption>My Work History</caption>\n  <thead>\n...\n</table>\n\
    ```\n\nI also would like to move the image of the office we added to the last\
    \ page. It is located below the `<h2>` on our index page.\n\n#### To cut and paste\
    \ your code:\n\n1. Highlight the code you want. In this case, it is the entire\
    \ `<img>` tag.\n2. Right click while it is highlighted.\n3. Click on `Cut`.\n\
    4. Return to your `work.html` file.\n5. Place your cursor on a new line below\
