    ![](images/00031.jpeg)


    Figure 6-4—Our page with a table, caption and image


    We will also want a centered header for our page.  I am going to add the following
    <h1> tag to our page.  I have highlighted the portion I am adding.


    Code Sample: Adding border, width and alignment to a table


    <h1 align="center">Welcome to my work history page!</h1>


    <table border="1" style="width:50%" align="center">


    <caption>My Work History</caption>


    <img src="http://images.freeimages.com/images/previews/67e/office-1238353.jpg"
    alt="My office" width="400" height="200">


    Our titles and headers might need some additional styling to provide a proper
    visual hierarchy to our table. In order to do this, we will return to CSS and
    add some rules to ensure that we format and style our table exactly the way we
    want to.


    Open the CSS file that we started earlier in your text editor. If you recall,
    we had added one rule to style our header. Our CSS should appear like this when
    we open it.


    Code Sample: Current status of CSS code


    h1 {


        color: blue;


    }


    body {


        font-family:  Arial, Helvetica, sans-serif


    }


    img {


        display: block;


        margin-left: auto;


        margin-right: auto;


    }


    CSS rules start with a selector, which is the element we are adding styling to.
    They contain a property, which indicates what we are going to add, and the value
    with provides the exact nature of the styling.


    To add visual cues to our table, I would like to make the caption the biggest
    text size. I need to add prominence to our headers so that the text from this
    portion stands out. To do this, I will add three CSS rules. Here is the code:


    Code Sample: Adding CSS rules for our table


    caption {


        font-size: 30px


    }


    th {


        font-size: 24px


    }


    tbody {


        color:blue;


        font-size: 20px


    }


    We should now have a larger title, prominent headers, and blue text in our table.
    Save your CSS file, switch back to the work.html file, press Live Preview and
    test it in the browser.  As a tip, Live Preview only works when your editor is
    open to an .html file.


    ![](images/00032.jpeg)


    Figure 6-7—Table with our CSS added


    Fantastic job! The table looks great and is worthy of the hard earned work experience
    it communicates. 


    Now that we have learned some very effective ways of displaying content on multiple
    pages, it is time to build an important feature to support the overall visitor
    experience which is navigation.


    Navigation: Linking your pages together


    Now that you are creating multiple pages, we need to add the ability to move back
    and forth between the pages.


    Navigation bars are one element of your page that can get highly stylized. For
    our purposes here, we will aim for a very simple implementation to give us navigational
    functionality and to allow us a base to build upon that can be used for our future
    learning.


    The navigation bar will live at the top of our HTML document. Our goal is to list
    links to other pages so that visitors can go back and forth.  In a simple way,
    we are adding links to a specific part of our page.


    We will use opening <nav> and closing </nav> tags  with our links nesting inside
    of them.


    Later, we will be adding a blog page, so I will go ahead and add that page to
    the nav element in order to save time later.


    You should now insert the following code into the <body> section of your main
    page. I have highlighted the section to add.


    Code Sample: Adding navigation links


    <head>


                  <title>My Page</title>


    <link rel="stylesheet" type="text/css" href="css/styling.css">


    </head>


    <body>   


    <nav>


      <a href="blog.html">My Blog</a> |


      <a href="work.html">Work History</a> |


    </nav>


    <h1 align="center">Thanks for visiting my page and learning more about me! </h1>


    You should now save your file and test it in the browser. When you test it, click
    on the Work History link, and it should take you to that page. The My Blog link
    will not work until we create the page in the next exercise.


    ![](images/00033.jpeg)


    Figure 7-1—With navigation links added


    You should now open your new work.html file. Insert the highlighted code below
    into the same section of that page.


    Code Sample: Adding navigation links


    <head>


                  <title>Work History</title>


    <link rel="stylesheet" type="text/css" href="css/styling.css">


    </head>


    <body>   


    <nav>


      <a href="mypage.html">Main Page</a> |


      <a href="blog.html">My Blog</a> |


    </nav>


