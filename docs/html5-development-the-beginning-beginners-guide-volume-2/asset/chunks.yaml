    ## Introduction


    Congratulations! You have taken an important first step on what will be a fun
    journey as you learn HTML5 and begin to create your own pages. This should feel
    empowering. You understand how much joy and fun websites bring. Our goal with
    this book is to take you step by step. This book is designed with you, the beginner,
    in mind. We will work through simple examples together by step and start at the
    absolute beginning. Our goal is to provide an engaging look at each step so that
    you build knowledge and confidence as we go. Let’s build


    ## The Building Blocks of HTML5: Elements, Tags, and Attributes


    If you have ever looked at HTML5 before or tried to build a website, you might
    feel like it is akin to rocket science and that it is complicated and intimidating.
    Our hope is that as you proceed through this book, the feeling of intimidation
    will melt away and you will gain meaningful confidence in your ability to build
    pages for the World Wide Web.


    The best place to start building confidence is with a very brief understanding
    of what HTML5 is and what it is used for.


    At its simplest, HTML5 is a language used for structuring and presenting content
    on the World Wide Web. The goal of any website is communication. Your HTML5 code
    will structure, format and then work with a browser to present your content to
    your visitors. The current standard, HTML5, is the most current standard of the
    language. HTML is constantly evolving to support the latest in multimedia and
    technology. This is good news for you as the language remains current and flexible
    allowing you to communicate your content on the latest devices and in ways that
    are important to you.


    The first step to learning a simple approach to HTML5 and building pages for the
    web is to understand how simple the building blocks actually are. The basic building
    blocks of all HTML5 programs are elements, tags, and attributes. The foundation
    of your program will be your HTML elements, and your tags and attributes are parts
    of your elements that give you control over the content, layout and structure
    of your content and ultimately, your site.

