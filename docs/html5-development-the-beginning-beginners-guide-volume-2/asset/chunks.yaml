    Our table is certainly getting there!  Let’s save the file and render it in a
    browser.


    ![](images/00030.jpeg)


    Figure 6-3—Example of data formatted in a table


    At this point, the basic structure of our table is taking shape. We will want
    to add some basic styling to our table. A good table should  have a simple and
    well organized layout. It is very important not to overdo it. However, by adding
    some borders and emphasizing certain text and rows, we can visually help our visitors
    understand the data in our table and make sure that the information flows logically.


    To better separate the data, we will add a border. A border is optional, but we
    will add one here to help you practice with its functionality. We will also add
    an attribute to control the width of the table.


    Code Sample: Adding border and width to a table


    <table border="1" style="width:100%">


    <thead>


    <tr>


    <th>Title</th>


    <th>Location</th>


    <th>Year</th>


    </tr>


    </thead>


    You will notice the width is set to 100%. The two most common options for sizing
    in HTML5 are either in pixels or percentages. Save your file, test your code and
    see how the table looks at 100%.


    I am going to set the final version at 50%. I have highlighted it in the code
    sample that is shown below. We will also center our table with another attribute
    in the opening <table> tag. We will add an align attribute with a property of
    center.


    The last step is to add an overall title to our table. In HTML5, this is referred
    to as our caption. We will add an opening <caption> tag and a closing </caption>
    tag and place the text between the tags we want to use as a title for our table.
    You can see where to place it from the sample below. The code we are adding is
    highlighted.


    Code Sample: Adding border, width and alignment to a table


    <table border="1" style="width:50%" align="center">


    <caption>My Work History</caption>


    <thead>


    I also would like to move the image of the office we added to the last page. It
    is located below the <h2> on our index page.


    To cut and paste your code:


    1\. Highlight the code you want. In this case, it is the entire <img> tag. 


    2\. Right click while it is highlighted. 


    3\. Click on Cut


    4\. Return to your work.html file


    5\. Place your cursor on a new line below the caption tag


    6\. Right click


    7\. Click paste


    Here is the code from the head portion of our table with a border, width, title
    and center alignment added and the img tag from the toehr file we that we just
    cut and pasted. In this step, we will also want to add an <h1> which you can view
    in the highlighted portion.


    Code Sample: Adding border, width and alignment to a table


    <table border="1" style="width:50%" align="center">


    <caption>My Work History</caption>


    <img src="http://images.freeimages.com/images/previews/67e/office-1238353.jpg"
    alt="My office" width="400" height="200">


    <thead>


    <tr>


    <th>Title</th>


    <th>Location</th>


    <th>Year</th>


    </tr>


    </thead> 


