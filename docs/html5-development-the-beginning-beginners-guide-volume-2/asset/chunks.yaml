    第一步是为我们的页面命名。在 `<title>` 开始和结束标签之间，我将放入“My page”（我的页面），这将作为我们的标题。


    在 `<body>` 部分，我将放入一段欢迎访问者的文本。


    现在，你的代码应该像下面所示：


    代码示例：添加初始内容


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>My Page</title>

    </head>

    <body>

    Thanks for visiting my page and learning more about me!

    </body>

    </html>

    ```


    # 添加用于格式化和样式的基础标签


    现在我们已经有了一些基础文本和模板代码，是时候添加几个标签了，这些标签可以帮助你结构化文本元素，并构建页面上的大部分内容。


    这里的秘诀在于，许多网页只需要少数标签就能完成其大部分内容。理解基础标签的作用、功能和最佳用途，将加速你构建有趣且富有创意网页的能力，让这些网页充满有趣且相关的内容，并完全按照你的方式进行结构化。


    你将最常用的两个标签是标题（header）和段落（paragraph）标签。标题选项从 1 到 6 级，通常 1 级是主标题，随后的标题随着数字增大而重要性递减。主标题的开始标签是
    `<h1>`，结束标签是 `</h1>`。二级标题的开始标签看起来像 `<h2>`，带有惯用的结束语法 `</h2>`。你将在随后的标题中遵循相同的模式，尽管大多数页面很少用到
    `<h5>` 或 `<h6>`。


    让我们创建标题标签。这些标签对你的访问者非常重要，并能帮助他们进行导航。优秀的网页是直观且易于导航的，因为它们是用强烈的视觉线索和元素（如标题）构建的。我将在我现有的文本周围添加
    `<h1>` 标签，使其更具重点。我在下方突出显示了要添加到我们模板代码中的新代码：


    代码示例：添加标题


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>My Page</title>

    </head>

    <body>

    <h1>Thanks for visiting my page and learning more about me!</h1>

    </body>

    </html>

    ```


    保存你的代码，并点击文本编辑器中的“实时预览”（Live Preview）以在浏览器中进行测试。注意看在添加 `<h1>` 标签前后的区别。


    在浏览器中查看时，你的页面现在应该像这张图片：


    ![](img/00007.jpeg)


    图 1-6——添加标题标签


    恭喜你已经做到了这里！通过理解基础标签的放置和重要性，你正在学习构建网页的常规操作。如果需要尝试几次，没关系！你会发现，大量的编码工作都是试错，即使是最经验丰富、技能高超的程序员也是这样工作的。关键是不断向前，，尽可能多地学习，寻找解决问题的创意方法，并尽快应用新学到的。


    另一个你经常使用的非常常见的标签是段落，或 `<p>` 标签。你网站上大部分基于文本的内容将位于 `<p>` 开始标签和 `</p>` 结束标签之间。


    考虑到我们正在构建一个个人简介网页，我在 `<body>` 部分的 `<p>` 标签之间添加了一些简短的个人信息，我们可以在后面的课程中对其进行扩展。


    我在下面的示例中突出显示了我添加的代码和文本。


    代码示例：添加段落标签


