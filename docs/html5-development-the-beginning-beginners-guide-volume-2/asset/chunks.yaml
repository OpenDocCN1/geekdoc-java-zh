    这里有一个标签的示例。我在示例中高亮了它们：


    ```

    <p>This is text that will appear on a website</p>

    ```


    我们将在书的后后部分介绍许多类型的标签及其含义。在这种情况下，`<p>` 是 paragraph（段落）的缩写，括号标签之间的文本将显示在浏览器中。目前不需要担心这些标签的具体作用，更重要的是关注整体结构。


    ![](img/00001.jpeg)

    图 1-1—HTML 元素和标签


    标签总是由一对角括号括起来。括号内的字母表示该标签的类型。标签的内容代表了该标签为浏览器构建的内容内容。大多数标签都有一个闭合标签，其符号是在普通角括号内的标签名称前加一个正斜杠
    `/`。


    可能需要使用标签来添加额外的内容或结构。我们通过**属性（attribute）**来实现这一点。


    这是我们之前使用的示例标签。现在，我们为其添加了一个属性。我高亮了该属性。


    ```html

    <p align="center">This is text that will appear on a website</p>

    ```


    正如你可能猜到的，在这种情况下，该属性将我们的文本居中。


    属性放置在起始标签内，一个 HTML 标签可以有一个或多个属性。属性始终包含在起始标签中。它们的前面有一个空格，并包含属性名称、一个等号以及带引号的值。


    ![](img/00002.jpeg)

    图 1-2—属性的放置


    基于这些理解，我有信心你已经准备好编写第一行 HTML5 代码了！我们只需要一个额外的工具。


    构建网页最基础的工具之一是**文本编辑器（text editor）**。文本编辑器不仅存放你的代码，还能帮助你保持网页项目的组织井齐。当你为网站编写代码时，一个好的文本编辑器是你最好的朋友。


    目前有很多非常棒的文本编辑器可供选择。对于本项目我们将使用 Adobe 的 `Brackets`。`Brackets` 是一个非常棒编辑器，安装简单且使用方便。然而，不要被它的简单性误骗，它也具有非常强大的功能，许多专业人士每天都在构建和维护未来的网站。


    第一步是下载并安装你的文本编辑器。


    ### 如何安装和运行 Brackets：


    ![](img/00003.jpeg)

    图 1-2.5—`Brackets.io` 的下载界面


    1. 在浏览器中导航到 `Brackets.io`，点击屏幕中间写有“Download Brackets”的蓝色下载按钮。

    2. 点击 `Open` 打开安装程序。

    3. 按照安装程序的说明进行操作，点击 `finish` 或 `install`。

    4. 安装完成后，打开 `Brackets`。

    5. 默认情况下，`Brackets` 会打开包含一些简单“入门”内容的文件夹。阅读这些内容以熟悉 `Brackets` 以及使用的一些术语。如果你不理解它涵盖的部分或全部，不要担心。


    ### 你的第一个程序


    现在你已经可以使用 `Brackets` 了，是时候构建你的第一个 HTML5 脚本了！让我先来祝贺你。在接下来的几分钟内，你将拥有你的第一个页面。


    你的第一步是创建一个新文件夹，用于保存文件和存储你的网页。


    1. 在你想创建文件夹的位置（例如桌面或普通文件夹目录）上点击右键。

    2. 点击 `New`。

    3. 点击 `Folder`。

    4. 将文件夹命名为 `My Page`。


    现在你已经创建了项目文件夹，是时候在文本编辑器中开始文件了。在 `Brackets` 中，点击 `File` 然后点击 `New`。


    此时，你在文本编辑器中有一个空白的文本文件。这正是每一个优秀网页的起点。


    让我们为我们的网站在 `Brackets` 中输入第一行文本。我将从这里开始：


    `Thanks for visiting my page and learning more about me!`


    输入后，按照以下简单流程开始保存你的文件。


    1. 点击 `File`

    2. 点击 `Save as`

    3. 将你的第一个页面命名为 `index.html`


    使用 `.html` 扩展名至关重要，这样你的文本编辑器和浏览器就知道将此文件读取为 HTML 文件。`index` 标题是网站主页或首页的惯用标题。出于本次练习的目的，我将我们的第一个页面保存为：`index.html`


    现在点击 `Save`。此时，你应该已经有了第一个可以渲染到浏览器的页面了。在 `Brackets` 中，你将点击屏幕右上角的小闪电图标在浏览器中测试你的代码。这被称为
    `Live Preview`（实时预览）功能。


    ![](img/00004.jpeg)

    图 1-3—`Brackets` 中的 `Live Preview` 功能


    如果你现在这样做，你应该能看到这个：


    ![](img/00005.jpeg)

    图 1-4—首次渲染到浏览器


    恭喜！这在不遥的将来成为一个精彩网页的微小而谦虚的起点。所有的网页都从空白开始。


    从这第一步我们可以看到，不需要额外的 HTML5 就可以向浏览器渲染内容。这在你之后所有的脚本中都将有效。你的文本和内容的其他部分将保持其原生结构。你放置在内容周围的
    HTML 标签和属性将通过构建这些内容来帮助构建网页。此外，大量的样式、设计和装饰元素将来自你添加的 CSS。


    让我们删除我们最初用于测试的第一行文本。现在我们将添加一些基础的 HTML 标签并开始构建我们的实际网站。我们将在 `Brackets` 的 `index.html`
    文件中添加以下标签。这被称为 **HTML 模板代码（HTML Boilerplate）**。它是每个用 HTML 构建的页面的初始起点。


    #### 代码示例：初始 HTML 模板代码


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title></title>

    </head>

    <body>

    </body>

    </html>

    ```


    `!DOCTYPE` 声明告诉浏览器文档所使用的 HTML 版本。你编写的每个 HTML 文件将有相同的起点。它必须存在，且必须始终位于最顶端。


    第一个标签 `<html>` 只是告诉浏览器正在传递 HTML 文件，并且需要进行渲染。


    `<head>` 标签充当容器或位置，用于存放标题和元数据等内容，这些内容通常位于文档的“头部”或顶部。


    `<html>` 标签表示 HTML 文档的开始和结束。


    `<title>` 标签后的文本将在页面打开时显示在浏览器标签页上。标题标签的内容用于 Google 等搜索引擎在你的网站发布到网络后对其进行索引。`</title>`
    关闭文档的该部分，`</head>` 关闭头部部分。


    `<body>` 标签将作为容器，用于通常出现在网页正文段落和图像等元素。`</body>` 标签关闭该部分，`</html>` 标志文档的结束。


    在输入完上面的模板代码后，你文本编辑器中的代码应该像下面所示：


    ![](img/00006.jpeg)

    图 1-5—`Brackets` 编辑器中的 HTML 模板


    作为一个通用规则，所有包含内容的标签都有起始和闭合标签。有些标签不包含或不需要闭合标签，但它们超出了我们目前的范围。


    现在我们已经有了模板代码，我们需要确定页面的目标，收集一些主意，然后是时候开始构建了！


    对于本项目，我们将构建一个作为个人简介的网站。它将为页面提供基础布局，页面将包含个人细节、图像、收藏网站的链接、工作历史信息以及访问者反馈的地方。


    我将为一个虚构人物虚构个人细节，并为个人简介类网站提供基础结构。在处理文本部分时你可以随时添加自己的细节，但请确保你严格遵循代码。


