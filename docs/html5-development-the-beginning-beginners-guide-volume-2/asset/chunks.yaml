  trans: "\n\n在 Brackets.（以及其他几个文本编辑器）中，有一个简单的键盘快捷键可以处理注释。只需突出显示你想注释的区域，并同时按下 `Ctrl`\
    \ 和 `/`（Mac 上为 `Command` 和 `/`）即可。你会看到注释标记出现，并且该区域的文本将变为灰色。在页页面设计之间来回切换时，你会有需要“注释掉”代码的情况。假设在添加我们的二级标题标签后，你想查看带有标题和没有标题的页面。以下是我们页面目前的渲染效果：\n\
    \n![](img/00010.jpeg)\n\n图 2-1——页面当前版本\n\n现在，让我们来“注释掉”我们的 `<h2>` 标签。我将用光标选中该 `<h2>`\
    \ 标签，并按下 `Ctrl` + `/`。\n\n我在下方的代码示例中用黄色标出了我们正在注释掉的那行代码。\n\n代码示例：注释一行代码\n\n```html\n\
    <h1>Thanks for visiting my page and learning more about me!</h1>\n\n<!--<h2>This\
    \ site is designed as a personal profile<h2>-->\n\n</head>\n\n<body>\n\n<p>I graduated\
    \ from the University of Texas in 2010 with a degree in English. I am an English\
    \ teacher and soccer coach and learning to build web pages.</p>\n```\n\n当我们现在将页面渲染到浏览器时，你会发现它只是简单地从浏览器的渲染结果中删除了那行代码：\n\
    \n![](img/00011.jpeg)\n\n图 2-2——注释一行代码的结果\n\n现在我们已经看过了没有标题的页面，我们想要将其恢复到访问者在浏览器中看到的内容。我们需要从代码中移除注释。为了做到这一点，我们只需突出显示想要移除注释标签的代码（在本例中为我们的\
    \ `<h2>` 标签），然后再次按下 `Ctrl` + `/`。执行此操作后，我们的代码应该看起来像下面的示例一样。\n\n代码示例：取消注释一行代码\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>My Page</title>\n</head>\n\
    <body>\n\n<h1>Thanks for visiting my page and learning more about me! </h1>\n\n\
    <h2>This site is designed as a personal profile.</h2>\n\n<p> I graduated from\
    \ the University of Texas in 2010 with a degree in English. I am an English teacher\
    \ and soccer coach and learning to build web pages.</p>\n\n</body>\n</html>\n\
    ```\n\n恭喜你！你现在正在开发专业人员每天都会使用的技能。使用注释以及理解浏览器和文本编辑器作用的能力将让你在这个项目及未来的开发中大获益，帮助你构建有趣、兴奋且富有意的网页。\n\
    \n# CSS：为你的页面添加样式感\n\n构建网页的最好的部分之一是，它提供了一个以标准格式工作的机会，任何人都可以学习这种格式。同时，它提供了大量的灵活性和选项来构建设计元素，让每个人都有机会以一种不仅有效，而且具有创意和吸引力的方式来反映他们自己的内容。\n\
    \n你今天在网页上看到的许多设计功能和样式都来自层叠样式表，即 `CSS`。正如书中前面提到的，HTML 结构和格式化了你想传播的内容，而 `CSS` 则帮助你对其样式化和呈现。\n\
    \n对 `CSS` 的深度解释和探索超出了本书的范围，但我确实想介绍它，让你熟悉 `CSS` 规则的结构，以及你将如何将 `CSS` 样式表添加到你的 HTML\
    \ 文档中。\n\n你将在单独的文件构建 `CSS`，并将其链接到你的 HTML 文件。这个过程非常简单，只需要在文本编辑器中打开一个新文件，并在 HTML\
    \ 文件的顶部添加一行代码即可。以下是前三步：\n\n1. 在你的 `My_Page` 文件夹中，创建一个子文件夹并将其命名为 `CSS`。\n2. 在你的文本编辑器中打开一个新文件并将其保存为文件名\
    \ `style.css`。\n3. 将该文件保存到你 `My_Page` 项目内部的新 `CSS` 文件夹中。\n\n以 `.css` 扩展名保存文件，并将其保存到位于主\
    \ `My_Page` 项目文件夹内的名为 `CSS` 的子文件夹中是非常重要的。\n\n![](img/00012.jpeg)\n\n图 3-1——创建一个新的\
    \ CSS 文件\n\n为了添加我们的样式表，我们现在需要将 `CSS` 链接到我们的 HTML 文件。我将我的样式表命名为“style.css”，因此我将在代码中使用它来链接两者。\n\
    \n在 HTML 文件的 `<head>` 元素中，你将添加一行简单的代码来链接这两个文件。以下是位于 `CSS` 文件夹中的名为 `style.css`\
    \ 文件的示例代码：\n\n代码示例：将 CSS 链接到 HTML 文档\n\n```html\n<link rel=\"stylesheet\" type=\"\
    text/css\" href=\"css/style.css\">\n```\n\n链接 `CSS` 文件和 HTML 文件的代码应该像这样放在 HTML\
