    \ p divides n, divide n by p as many times as possible\n\nwhile (n % p == 0) {\n\
    \nn /= p;\n\n}\n\nresult -= result / p; // Apply the formula for prime factors\n\
    \n}\n\np++;\n\n}\n\n// If n is a prime number greater than 1\n\nif (n > 1) {\n\
    \nresult -= result / n;\n\n}\n\nreturn result; // Return the result\n\n}\n\npublic\
