    \    // 计算数字真因数之和的函数\n    public static int getProperDivisorsSum(int number) {\n\
    \        int sum = 1; // 从 1 开始，因为每个数都能被 1 整除\n        for (int i = 2; i <= Math.sqrt(number);\
    \ i++) {\n            if (number % i == 0) {\n                sum += i;\n    \
