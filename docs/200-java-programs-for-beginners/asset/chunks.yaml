    \n# 70. 向线程定时函数传递参数\n\n![image](img/chapter_title_below.png)\n\n```java\nimport\
    \ java.util.concurrent.Executors;\nimport java.util.concurrent.ScheduledExecutorService;\n\
    import java.util.concurrent.TimeUnit;\n\npublic class TimerExample {\n    // 接收参数并打印的方法\n\
    \    public static void myFunction(String parameter) {\n        System.out.println(\"\
    Parameter received: \" + parameter);\n    }\n\n    public static void main(String[]\
    \ args) {\n        // 定义参数\n        String myParameter = \"Hello, world!\";\n\
    \        // 创建单线程定时执行服务\n        ScheduledExecutorService executor = Executors.newSingleThreadScheduledExecutor();\n\
    \        // 定义一个延迟执行的任务\n        Runnable delayedExecution = () -> myFunction(myParameter);\n\
    \        // 调度任务，延迟 1 秒执行\n        executor.schedule(delayedExecution, 1, TimeUnit.SECONDS);\n\
    \        // 任务完成后关闭执行器\n        executor.shutdown();\n    }\n}\n```\n\n![image](img/chapter_title_corner_decoration_left.png)\
