    # 95. 微型数独检查\n\n```java\nimport java.util.HashSet;\n\npublic class MiniSudoku\
    \ {\n    // 检查 3x3 网格是否为有效的微型数独\n    public static boolean isMiniSudoku(int[][]\
    \ square) {\n        HashSet<Integer> seen = new HashSet<>();\n        // 检查网格是否为\
    \ 3x3\n        if (square.length != 3 || square[0].length != 3) {\n          \
    \  return false; // 尺寸无效\n        }\n        for (int[] row : square) {\n    \
    \        for (int num : row) {\n                // 检查数字是否在有效范围内 (1-9)\n      \
    \          if (num < 1 || num > 9) {\n                    return false;\n    \
    \            }\n                // 检查是否有重复\n                if (!seen.add(num))\
    \ {\n                    return false;\n                }\n            }\n   \
    \     }\n        // 如果所有数字恰好出现一次且在范围内，返回 true\n        return true;\n    }\n\n\
    \    public static void main(String[] args) {\n        int[][] validSudoku = {\n\
    \            {1, 3, 2},\n            {9, 7, 8},\n            {4, 5, 6}\n     \
    \   };\n        int[][] invalidSudoku1 = {\n            {1, 1, 3},\n         \
    \   {6, 5, 4},\n            {8, 7, 9}\n        };\n        int[][] invalidSudoku2\
