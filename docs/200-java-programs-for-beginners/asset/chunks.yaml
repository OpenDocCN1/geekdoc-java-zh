    \ \n\n```java\npublic class NextPrimeNumber {\n    // 检查一个数字是否为质数的函数\n    public\
    \ static boolean isPrime(int num) {\n        if (num < 2) {\n            return\
    \ false;\n        }\n        for (int i = 2; i <= Math.sqrt(num); i++) {\n   \
    \         if (num % i == 0) {\n                return false;\n            }\n\
    \        }\n        return true;\n    }\n\n    // 寻找下一个质数的函数\n    public static\
    \ int nextPrimeNumber(int givenNumber) {\n        int nextNumber = givenNumber\
    \ + 1;\n        while (!isPrime(nextNumber)) {\n            nextNumber++;\n  \
    \      }\n        return nextNumber;\n    }\n\n    public static void main(String[]\
    \ args) {\n        int givenNumber = 10;\n        int nextPrime = nextPrimeNumber(givenNumber);\n\
    \        System.out.println(\"Given Number: \" + givenNumber);\n        System.out.println(\"\
    Next Prime Number: \" + nextPrime);\n    }\n}\n```\n\n// 给定数字: 10\n// 下一个质数: 11\n\
