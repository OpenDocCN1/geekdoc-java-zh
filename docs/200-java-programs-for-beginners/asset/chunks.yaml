    \        };\n        int[][] validSudoku2 = {\n            {8, 9, 2},\n      \
    \      {5, 6, 1},\n            {3, 7, 4}\n        };\n        System.out.println(\"\
    isMiniSudoku(validSudoku) = \" + isMiniSudoku(validSudoku)); // true\n       \
    \ System.out.println(\"isMiniSudoku(invalidSudoku1) = \" + isMiniSudoku(invalidSudoku1));\
    \ // false\n        System.out.println(\"isMiniSudoku(invalidSudoku2) = \" + isMiniSudoku(invalidSudoku2));\
    \ // false\n        System.out.println(\"isMiniSudoku(validSudoku2) = \" + isMiniSudoku(validSudoku2));\
    \ // true\n    }\n}\n// 输出:\n// isMiniSudoku(validSudoku) = true\n// isMiniSudoku(invalidSudoku1)\
    \ = false\n// isMiniSudoku(invalidSudoku2) = false\n// isMiniSudoku(validSudoku2)\
    \ = true\n```\n\n# 96. 检查数字是否为完美数\n\n```java\npublic class PerfectNumber {\n \
    \   // 检查一个数字是否为完美数\n    public static boolean isPerfectNumber(int number) {\n\
    \        if (number < 2) {\n            return false; // 1 及以下不可能是完美数\n      \
    \  }\n        // 计算因数的和\n        int sumOfDivisors = 1; // 从 1 开始，因为 1 是任何数字的因子\n\
    \        int sqrt = (int) Math.sqrt(number);\n        for (int i = 2; i <= sqrt;\
    \ i++) {\n            if (number % i == 0) {\n                sumOfDivisors +=\
    \ i;\n                if (i != number / i) {\n                    sumOfDivisors\
    \ += number / i;\n                }\n            }\n        }\n        // 检查因数的和是否等于原数\n\
    \        return sumOfDivisors == number;\n    }\n\n    public static void main(String[]\
    \ args) {\n        int testNumber = 28;\n        boolean result = isPerfectNumber(testNumber);\n\
    \        System.out.println(\"数字 \" + testNumber + \" 是完美数吗? \" + result);\n \
    \   }\n}\n// 输出:\n// 数字 28 是完美数吗? true\n```\n\n# 97. 计算圆柱体积\n\n```java\npublic\
    \ class Cylinder {\n    // 计算圆柱体积的方法\n    public static double calculateVolume(double\
    \ radius, double height) {\n        if (radius <= 0 || height <= 0) {\n      \
    \      throw new IllegalArgumentException(\"半径和高度必须为正数\");\n        }\n      \
    \  return Math.PI * Math.pow(radius, 2) * height;\n    }\n\n    public static\
    \ void main(String[] args) {\n        double radius = 5.0;\n        double height\
    \ = 10.0;\n        try {\n            double volume = calculateVolume(radius,\
    \ height);\n            System.out.printf(\"圆柱体积: %.2f%n\", volume);\n       \
    \ } catch (IllegalArgumentException e) {\n            System.out.println(e.getMessage());\n\
    \        }\n    }\n}\n// 输出:\n// 圆柱体积: 785.40\n```\n\n# 98. 获取学生列表最高分\n\n```java\n\
