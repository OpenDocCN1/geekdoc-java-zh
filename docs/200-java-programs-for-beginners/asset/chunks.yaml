  trans: "\n![](img/cover.jpg)\n\n![img](img/cover.jpg) \n\n# 初学者的 200+ Java 程序\n\
    Hernando Abella\n\nAluna 出版社因教育、语言和技术的共同热情而凝聚在一起。我们的使命是在书籍方面提供终极的学习体验。我们相信，书籍不仅仅是纸上的文字；它们是通往知识、想象力和启蒙的门户。\n\
    \n通过我们的共同专业知识，我们旨在弥合传统学习与数字时代之间的差距，利用技术的力量让书籍更易获取、更具互动性且乐趣。我们致力于创建一个能够培养对阅读、语言和终身学习热爱的平台。加入我们的旅程，开启一段重新定义你体验书籍方式的探索。\n\
    \n让我们一页一页地解锁知识的无限潜力。\n\n# 目录\n\n- 引言\n- 1. 打印 Hello World\n- 2. 两个数字相加\n- 3. 寻找平方根\n\
    - 4. 计算三角形面积\n- 5. 交换两个变量\n- 6. 求解二次方程\n- 7. 公里转英里\n- 8. 摄氏度转华氏度\n- 9. 生成随机数\n\
    - 10. 检查数字是否为正数、负数或零\n- 11. 检查数字是奇数还是偶数\n- 12. 找出三个数中的最大值\n- 13. 检查质数\n- 14. 打印范围内的所有质数\n\
    - 15. 计算数字的阶阶\n- 16. 显示乘法表\n- 17. 打印斐波那契数列\n- 18. 检查阿姆斯特数\n- 19. 在范围内寻找阿姆斯特数\n\
    - 20. 制作简单的计算器\n- 21. 求自然数之和\n- 22. 检查数字的末位数是否相同\n- 23. 寻找最大公约数 HCF 或 GCD\n- 24.\
    \ 寻找最小公倍数 LCM\n- 25. 寻找数字的因子\n- 26. 使用递归求自然数之和\n- 27. 猜一个随机数\n- 28. 打洗牌牌\n- 29.\
    \ 使用递归显示斐波那契数列\n- 30. 使用递归计算数字的阶阶\n- 31. 十进制转二进制\n- 32. 查找字符的 ASCII 值\n- 33. 检查字符串是否为回文\n\
    - 34. 按字母顺序排序单词\n- 35. 替换字符串中的字符\n- 36. 反转字符串\n- 37. 统计字符串中的元音数量\n- 38. 将字符串的首字母转换为大写\n\
    - 39. 检查字符串是否以特定字符开头和结尾\n- 40. 替换字符串中出现的所有字符\n- 41. 替换所有换行符\n- 42. 检查闰年\n- 43.\
    \ 格式化日期\n- 44. 显示当前日期\n- 45. 比较两个日值\n- 46. 创建倒计时器\n- 47. 从数组中移除特定项\n- 48. 检查数组是否包含指定值\n\
    - 49. 在数组中插入项\n- 50. 从数组中获取随机项\n- 51. 执行两个数组的交集\n- 52. 将数组拆分为更小的块\n- 53. 获取文件扩展名\n\
    - 54. 检查变量是否为 undefined 或 null\n- 55. 在两个数字之间生成随机数\n- 56. 最长连续登录\n- 57. 验证邮箱地址\n\
    - 58. 记录温度\n- 59. 卡普雷卡数\n"
