    \                }\n            }\n        }\n        return sum;\n    }\n\n \
    \   // 检查一个数字是否为孤立数的函数\n    public static boolean isSolitaryNumber(int number)\
    \ {\n        int sumOfDivisors = getProperDivisorsSum(number);\n        return\
