  \    public static int digitSum(int n) {\n        int sum = 0;\n        while (n\
  \ > 0) {\n            sum += n % 10;\n            n /= 10;\n        }\n        return\
  \ sum;\n    }\n\n    // 执行质因数分解的函数\n    public static List<Integer> primeFactorization(int\
  \ n) {\n        List<Integer> factors = new ArrayList<>();\n        for (int i =\
  \ 2; i * i <= n; i++) {\n            while (n % i == 0) {\n                factors.add(i);\n\
  \                n /= i;\n            }\n        }\n        if (n > 1) {\n     \
  \       factors.add(n);\n        }\n        return factors;\n    }\n\n    // 检查数字是否为\
  \ Smith–Morra 数的函数\n    public static boolean isSmithMorraGambitNumber(int number)\
  \ {\n        List<Integer> factors = primeFactorization(number);\n        int sumOfDigitsOfFactors\
  \ = 0;\n        for (int factor : factors) {\n            sumOfDigitsOfFactors +=\
  \ digitSum(factor);\n        }\n        return sumOfDigitsOfFactors == digitSum(number);\n\
  \    }\n\n    public static void main(String[] args) {\n        int number = 22;\
  \ // 示例数字\n    }\n}\n```\n\n\n\n\n\n```java\nSystem.out.printf(\"Is %d a Smith–Morra\
