  \ static List<Long> primeFactors(long num) {\n        List<Long> factors = new ArrayList<>();\n\
  \        for (long i = 2; i * i <= num; i++) {\n            while (num % i == 0)\
  \ {\n                factors.add(i);\n                num /= i;\n            }\n\
  \        }\n        if (num > 1) {\n            factors.add(num);\n        }\n \
  \       return factors;\n    }\n\n    public static boolean isSmithNumber(long num)\
  \ {\n        long originalSum = sumOfDigits(num);\n        long primeFactorSum =\
  \ primeFactors(num).stream().mapToLong(Main::sumOfDigits).sum();\n        return\
  \ originalSum != primeFactorSum && !isPrime(num);\n    }\n\n    public static void\
  \ main(String[] args) {\n        long number = 728;\n        System.out.println(\"\
  \" + number + \" 是史密数吗？ \" + isSmithNumber(number));\n    }\n}\n// 输出: 728 是史密数吗？\
