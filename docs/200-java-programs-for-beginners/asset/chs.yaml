  */\n```\n\n## 56. 创建倒计时器\n\n```java\nimport java.time.LocalDateTime ;\nimport java.time.Duration;\n\
  \npublic class CountdownTimer {\n    public static void main(String[] args) throws\
  \ InterruptedException {\n        // 设置目标日期为现在 1 分钟后\n        LocalDateTime targetDate\
  \ = LocalDateTime.now().plusMinutes(1);\n\n        while (true) {\n            //\
  \ 计算剩余时间\n            Duration timeDiff = Duration.between(LocalDateTime.now(),\
  \ targetDate);\n\n            if (timeDiff.isNegative() || timeDiff.isZero()) {\n\
  \                break; // 如果倒计时结束则退出循环\n            }\n\n            long days\
  \ = timeDiff.toDays();\n            long hours = timeDiff.toHours() % 24;\n    \
  \        long minutes = timeDiff.toMinutes() % 60;\n            long seconds = timeDiff.getSeconds()\
  \ % 60;\n\n            // 显示倒计时\n            System.out.printf(\"倒计时: %dd %dh %dm\
  \ %ds%n\", days, hours, minutes, seconds);\n\n            Thread.sleep(1000); //\
