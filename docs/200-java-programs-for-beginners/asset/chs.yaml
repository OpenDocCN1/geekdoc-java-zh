  \ \n\n## 206. URL 解\n\n![image](img/chapter_title_below.png) \n\n```java\nimport\
  \ java.util.HashMap;\nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\
  \npublic class URLBreakdown {\n    public static void breakUrl(String url) {\n \
  \       // 用于匹配 URL 组件的正则表达式\n        String urlRegex = \"^(\\\\w+):\\\\/\\\\/(\\\
  \\w+([\\\\.\\\\w-]*)?)(\\\\/.*)?$\";\n        Pattern pattern = Pattern.compile(urlRegex);\n\
  \        Matcher matcher = pattern.matcher(url);\n\n        // 用于存储 URL 部分的 HashMap\n\
  \        HashMap<String, String> urlParts = new HashMap<>();\n        if (matcher.find())\
  \ {\n            urlParts.put(\"scheme\", matcher.group(1));\n            urlParts.put(\"\
  domain\", matcher.group(2));\n            urlParts.put(\"path\", matcher.group(4)\
  \ != null ? matcher.group(4) : \"\");\n        } else {\n            System.out.println(\"\
  无效的 URL 格式.\");\n            return;\n        }\n\n        // 打印 URL 部分\n      \
  \  System.out.println(\"URL Parts:\");\n        for (HashMap.Entry<String, String>\
  \ entry : urlParts.entrySet()) {\n            System.out.println(entry.getKey()\
  \ + \": \" + entry.getValue());\n        }\n    }\n\n    public static void main(String[]\
  \ args) {\n        breakUrl(\"https://www.example.org/page\");\n    }\n}\n// URL\
  \ Parts:\n// scheme: https\n// domain: www.example.org\n// path: /page\n```\n\n\
