  \            // 检查是否有重复\n                if (!seen.add(num)) {\n               \
  \     return false;\n                }\n            }\n        }\n        // 如果所有数字恰好出现一次且在范围内，返回\
  \ true\n        return true;\n    }\n\n    public static void main(String[] args)\
