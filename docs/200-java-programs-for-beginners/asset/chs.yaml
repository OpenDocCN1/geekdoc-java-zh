  \ \n\n## 23. 求最大公约数 (HCF 或 GCD)\n\n![image](img/chapter_title_below.png) \n\n```java\n\
  import java.util.Scanner ;\n\npublic class HCF {\n    public static void main(String[]\
  \ args) {\n        Scanner scanner = new Scanner(System.in);\n        long num1\
  \ = readPositiveNumber(scanner, \"输入第一个正整数: \");\n        long num2 = readPositiveNumber(scanner,\
  \ \"输入第二个正整数: \");\n        System.out.printf(\"%d 和 %d 的最大公约数 (GCD) 是 %d%n\", num1,\
  \ num2, gcd(num1, num2));\n        scanner.close();\n    }\n\n    private static\
  \ long readPositiveNumber(Scanner scanner, String prompt) {\n        System.out.print(prompt);\n\
  \        while (true) {\n            if (scanner.hasNextLong()) {\n            \
  \    long number = scanner.nextLong();\n                if (number > 0) {\n    \
  \                return number;\n                } else {\n                    System.out.println(\"\
  请输入一个正整数.\");\n                }\n            } else {\n                System.out.println(\"\
  请输入有效的整数.\");\n                scanner.next(); // 清除无效输入\n            }\n      \
  \  }\n    }\n\n    private static long gcd(long a, long b) {\n        while (b !=\
  \ 0) {\n            long temp = b;\n            b = a % b;\n            a = temp;\n\
  \        }\n        return a;\n    }\n}\n```\n\n// 输入第一个正整数: 22\n// 输入第二个正整数: 33\n\
