  \ \n\n## 17. 打印斐波那契数列\n\n![image](img/chapter_title_below.png) \n\n```java\nimport\
  \ java.util.Scanner;\n\npublic class FibonacciSequence {\n    public static void\
  \ main(String[] args) {\n        Scanner scanner = new Scanner(System.in);\n   \
  \     System.out.print(\"输入斐波那契数列的项数: \");\n        // 验证输入\n        while (!scanner.hasNextInt())\
  \ {\n            System.out.println(\"请输入一个正整数.\");\n            scanner.next();\
  \ // 清除无效输入\n            System.out.print(\"输入斐波那契数列的项数: \");\n        }\n     \
  \   int numTerms = scanner.nextInt();\n        if (numTerms <= 0) {\n          \
  \  System.out.println(\"请输入正整数.\");\n            scanner.close();\n            return;\n\
  \        }\n        // 生成斐波那契数列\n        long[] fib = new long[numTerms];\n    \
  \    if (numTerms > 0) fib[0] = 0; // 第一项\n        if (numTerms > 1) fib[1] = 1;\
  \ // 第二项\n        for (int i = 2; i < numTerms; i++) {\n            fib[i] = fib[i\
  \ - 1] + fib[i - 2]; // 斐波那契公式\n        }\n        // 打印斐波那契数列\n        System.out.print(\"\
  斐波那契数列: \");\n        for (int i = 0; i < numTerms; i++) {\n            System.out.print(fib[i]);\n\
  \            if (i < numTerms - 1) {\n                System.out.print(\", \");\n\
  \            }\n        }\n        System.out.println();\n        scanner.close();\n\
  \    }\n}\n```\n\n// 输入斐波那契数列的项数: 5\n// 斐波那契数列: 0, 1, 1, 2, 3\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
