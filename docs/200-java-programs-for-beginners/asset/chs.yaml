  \ = 8 * total;\n        if (!isSquare(discriminant)) {\n            return false;\n\
  \        }\n        long sqrtDisc = (long) Math.sqrt(discriminant);\n        long\
  \ n = (sqrtDisc - 1) / 2;\n        // 验证 n 是正整数并满足条件\n        return n > 0 && n\
  \ * (n + 1) / 2 == total;\n    }\n\n    public static void main(String[] args) {\n\
  \        long[] testCases = {5, 4005, 9453};\n        for (long total : testCases)\
