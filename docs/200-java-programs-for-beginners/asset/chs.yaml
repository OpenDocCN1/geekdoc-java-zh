  \ \n\n# 119. 检查字符串是否为另一个字符串的字母异位\n\n```java\nimport java.util.HashMap;\n\npublic\
  \ class Main {\n    // 统计字符\n    private static HashMap<Character, Integer> getCount(String\
  \ s) {\n        HashMap<Character, Integer> count = new HashMap<>();\n        for\
  \ (char c : s.toCharArray()) {\n            count.put(c, count.getOrDefault(c, 0)\
  \ + 1);\n        }\n        return count;\n    }\n\n    public static boolean areAnagram(String\
  \ str1, String str2) {\n        // 获取两个字符串的计数\n        HashMap<Character, Integer>\
  \ count1 = getCount(str1);\n        HashMap<Character, Integer> count2 = getCount(str2);\n\
  \        // 比较频率\n        return count1.equals(count2);\n    }\n\n    public static\
  \ void main(String[] args) {\n        String string1 = \"listen\";\n        String\
  \ string2 = \"silent\";\n        boolean result = areAnagram(string1, string2);\n\
  \        System.out.println(string1 + \" 和 \" + string2 + \" 是字母异位: \" + result);\n\
  \    }\n}\n// 输出:\n// listen 和 silent 是字母异位: true\n```\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
