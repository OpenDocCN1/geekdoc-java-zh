  \  |\n![image](img/chapter_title_above.png) \n\n## 19. 在区间内寻找阿姆斯特数\n\n![image](img/chapter_title_below.png)\
  \ \n\n```java\nimport java.util.Scanner;\n\npublic class ArmstrongInInterval {\n\
  \    public static void main(String[] args) {\n        Scanner scanner = new Scanner(System.in);\n\
  \        // 读取区间\n        System.out.print(\"输入起始数字: \");\n        int start = getValidInteger(scanner);\n\
  \        System.out.print(\"输入结束数字: \");\n        int end = getValidInteger(scanner);\n\
  \        if (start > 0 && start < end) {\n            System.out.println(\"区间 [\"\
  \ + start + \", \" + end + \"] 内的阿姆斯特数:\");\n            boolean found = false;\n\
  \            for (int i = start; i <= end; i++) {\n                if (isArmstrong(i))\
  \ {\n                    System.out.println(i);\n                    found = true;\n\
  \                }\n            }\n            if (!found) {\n                System.out.println(\"\
  区间内没有找到阿姆斯特数.\");\n            }\n        } else {\n            System.out.println(\"\
  请输入起始数字小于结束数字的有效整数.\");\n        }\n        scanner.close();\n    }\n\n    // 验证输入并返回整数\n\
  \    private static int getValidInteger(Scanner scanner) {\n        while (!scanner.hasNextInt())\
  \ {\n            System.out.println(\"请输入有效的整数.\");\n            scanner.next();\
  \ // 清除无效输入\n        }\n        return scanner.nextInt();\n    }\n\n    // 检查数字是否为阿姆斯特数\n\
  \    private static boolean isArmstrong(int num) {\n        int originalNum = num;\n\
  \        int sum = 0;\n        int digits = Integer.toString(num).length();\n  \
  \      // 计算各位幂之和\n        while (num > 0) {\n            int digit = num % 10;\n\
  \            sum += Math.pow(digit, digits);\n            num /= 10;\n        }\n\
  \        return sum == originalNum;\n    }\n}\n```\n\n## 20. 制作简易计算器\n\n（注：原文此处代码不完整，仅翻译了提供的结构性部分）\n\
  \n```java\npublic class SimpleCalculator {\n    public static void main(String[]\
  \ args) {\n        Scanner scanner = new Scanner(System.in);\n        double num1\
  \ = readNumber(scanner, \"输入第一个数字: \");\n        double num2 = readNumber(scanner,\
  \ \"输入第二个数字: \");\n        String operation = readOperation(scanner);\n        double\
  \ result = performCalculation(num1, num2, operation);\n        if (!Double.isNaN(result))\
  \ {\n            System.out.printf(\"结果: %.2f %s %.2f = %.2f%n\", num1, operation,\
  \ num2, result);\n        }\n        scanner.close();\n    }\n}\n```\n\n\n\n\n\n\
  ```java\n// 从用户输入读取数字的函数\n\nprivate static double readNumber(Scanner scanner, String\
  \ prompt) {\n    System.out.print(prompt);\n    while (!scanner.hasNextDouble())\
  \ {\n        System.out.println(\"无效数字。请重试.\");\n        scanner.next(); // 清除无效输入\n\
  \        System.out.print(prompt);\n    }\n    return scanner.nextDouble();\n}\n\
  \n// 从用户输入读取操作符\n\nprivate static String readOperation(Scanner scanner) {\n    System.out.print(\"\
  输入操作 (+, -, *, /): \");\n    return scanner.next().trim();\n}\n\n// 根据操作执行计算\n\n\
  private static double performCalculation(double num1, double num2, String operation)\
  \ {\n    switch (operation) {\n        case \"+\":\n            return num1 + num2;\n\
  \        case \"-\":\n            return num1 - num2;\n        case \"*\":\n   \
  \         return num1 * num2;\n        case \"/\":\n            if (num2 == 0) {\n\
