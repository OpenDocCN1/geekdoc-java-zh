  \n![image](img/chapter_title_above.png)\n\n# 69. 卡普卡数 (Kaprekar Numbers)\n\n![image](img/chapter_title_below.png)\n\
  \n```java\npublic class KaprekarNumber {\n    // 判断数字是否为卡普卡数的方法\n    public static\
  \ boolean Kaprekar(long n) {\n        if (n == 0 || n == 1) {\n            return\
  \ true; // 0 和 1 是卡普卡数\n        }\n        // 计算 n 的平方\n        long square = n\
  \ * n;\n        String squareStr = Long.toString(square);\n        int len = squareStr.length();\n\
  \        // 将平方分成左部分和右部分\n        String leftStr, rightStr;\n        if (len ==\
  \ 1) {\n            leftStr = \"\"; // 只有右部分\n            rightStr = squareStr;\n\
  \        } else {\n            int splitIndex = len / 2;\n            leftStr =\
  \ squareStr.substring(0, len - splitIndex);\n            rightStr = squareStr.substring(len\
  \ - splitIndex);\n        }\n        // 将左右部分转换为数字\n        long left = leftStr.isEmpty()\
  \ ? 0 : Long.parseLong(leftStr);\n        long right = rightStr.isEmpty() ? 0 :\
  \ Long.parseLong(rightStr);\n        // 检查左右部分之和是否等于 n\n        return left + right\
  \ == n;\n    }\n\n    public static void main(String[] args) {\n        // 测试用例\n\
  \        // 输出: false\n        System.out.println(\"Kaprekar(3) ➞ \" + Kaprekar(3));\n\
  \        // 输出: false\n        System.out.println(\"Kaprekar(5) ➞ \" + Kaprekar(5));\n\
  \        // 输出: true\n        System.out.println(\"Kaprekar(297) ➞ \" + Kaprekar(297));\n\
  \    }\n}\n```\n\n![image](img/chapter_title_corner_decoration_left.png)  |  | ![image](img/chapter_title_corner_decoration_right.png)\n\
