  public static class Main {\n    // 计算二项式系数 C(n, k)\n    public static long binomialCoefficient(long\
  \ n, long k) {\n        long result = 1;\n        if (k > n - k) {\n           \
  \ k = n - k; // 利用对称性\n        }\n        for (long i = 0; i < k; i++) {\n     \
  \       result *= n;\n            result /= (i + 1);\n            n--;\n       \
  \ }\n        return result;\n    }\n\n    // 检查数字是否为卡特兰数\n}\n```\n\n\n\n\n\n```java\n\
  public static boolean isCatalanNumber(long num) {\n    long i = 0;\n    while (true)\
  \ {\n        long catalan = binomialCoefficient(2 * i, i) / (i + 1);\n        if\
  \ (catalan == num) {\n            return true; // 找到匹配\n        } else if (catalan\
  \ > num) {\n            return false; // 超过该数字\n        }\n        i++;\n    }\n\
  }\n\npublic static void main(String[] args) {\n    long numberToCheck = 42; // 替换为你想检查的数字\n\
