  \n```java\npublic class VideoLength {\n    // 将 \"MM:SS\" 格式的视频长度转换为总秒数\n    public\
  \ static int minutesToSeconds(String videoLength) {\n        String[] parts = videoLength.split(\"\
  :\");\n        // 检查格式是否有效\n        if (parts.length != 2) {\n            return\
  \ -1; // 格式无效\n        }\n        // 解析分钟\n        int minutes;\n        try {\n\
  \            minutes = Integer.parseInt(parts[0]);\n        } catch (NumberFormatException\
  \ e) {\n            return -1; // 分钟值无效\n        }\n        // 解析秒\n        int\
  \ seconds;\n        try {\n            seconds = Integer.parseInt(parts[1]);\n \
  \       } catch (NumberFormatException e) {\n            return -1; // 秒值无效\n  \
  \      }\n        // 验证秒\n        if (seconds >= 60) {\n            return -1; //\
  \ 秒值无效\n        }\n        return minutes * 60 + seconds; // 返回总秒数\n    }\n\n  \
  \  public static void main(String[] args) {\n        String[] testCases = {\"01:00\"\
  , \"13:56\", \"10:60\", \"121:49\", \"invalid\"};\n        for (String caseStr :\
  \ testCases) {\n            System.out.printf(\"Video Length '%s': %d seconds%n\"\
