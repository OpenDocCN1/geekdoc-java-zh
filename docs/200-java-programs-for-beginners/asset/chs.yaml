  \ static boolean isPrime(long num) {\n        if (num < 2) return false;\n     \
  \   for (long i = 2; i * i <= num; i++) {\n            if (num % i == 0) return\
  \ false;\n        }\n        return true;\n    }\n\n    public static long sumOfDigits(long\
  \ num) {\n        long sum = 0;\n        while (num > 0) {\n            sum += num\
