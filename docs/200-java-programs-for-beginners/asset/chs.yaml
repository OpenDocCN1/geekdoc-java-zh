  \n\n\n# 18. Club Entry\n\n![image](img/chapter_title_below.png)\n\n```java\npublic\
  \ class Main {\n    public static Integer clubEntry(String word) {\n        // 寻找连续的字母\n\
  \        Character doubledLetter = null;\n        for (int i = 0; i < word.length()\
  \ - 1; i++) {\n            if (word.charAt(i) == word.charAt(i + 1)) {\n       \
  \         doubledLetter = word.charAt(i);\n                break;\n            }\n\
  \        }\n        // 确保找到了连续的字母\n        if (doubledLetter == null) {\n      \
  \      return null; // 未找到连续字母\n        }\n        // 计算字母在字母表中的位置\n        int\
  \ position = doubledLetter - 'a' + 1;\n        // 将位置乘以 4\n        int result =\
  \ position * 4;\n        return result;\n    }\n\n    public static void main(String[]\
  \ args) {\n        String[] words = {\"hill\", \"apple\", \"bee\"};\n        for\
  \ (String word : words) {\n            Integer number = clubEntry(word);\n     \
  \       if (number != null) {\n                System.out.println(word + \" ➞ \"\
  \ + number);\n            } else {\n                System.out.println(word + \"\
  \ ➞ 无连续字母\");\n            }\n        }\n    }\n}\n// 输出:\n// hill ➞ 3\n// apple\
  \ ➞ 4\n// bee ➞ 8\n```\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
