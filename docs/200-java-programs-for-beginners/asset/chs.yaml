  import java.util.Arrays;\n\npublic class Main {\n    public static double findMedian(int[]\
  \ arr) {\n        // 检查列表是否有效\n        if (arr.length == 0) {\n            throw\
  \ new IllegalArgumentException(\"Invalid input. Please provide a non-empty list.\"\
  );\n        }\n        // 对数组排序\n        Arrays.sort(arr);\n        int len = arr.length;\n\
  \        int middleIndex = len / 2;\n        // 计算中位数\n        if (len % 2 == 0)\
  \ {\n            // 如果列表有偶数个元素，返回两个中间元素的平均值\n            return (arr[middleIndex\
  \ - 1] + arr[middleIndex]) / 2.0;\n        } else {\n            // 如果列表有奇数个元素，返回中间元素\n\
  \            return arr[middleIndex];\n        }\n    }\n\n    public static void\
  \ main(String[] args) {\n        int[] numbers = {5, 2, 8, 1, 7, 3};\n        double\
  \ median = findMedian(numbers);\n        System.out.printf(\"Median: %.1f%n\", median);\n\
  \    }\n}\n```\n// 输出: Median: 4.0\n\n## 103. 计算两点之间的距离\n\n```java\npublic class\
