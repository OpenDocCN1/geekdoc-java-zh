  \ \n\n# 120. 生成杨斯卡三角形\n\n![image](img/chapter_title_below.png) \n\n```java\nimport\
  \ java.util.ArrayList;\nimport java.util.List;\n\npublic class Main {\n    public\
  \ static List<List<Integer>> generatePascalsTriangle(int numRows) {\n        List<List<Integer>>\
  \ triangle = new ArrayList<>();\n        if (numRows == 0) {\n            return\
  \ triangle;\n        }\n        // 初始化第一行\n        triangle.add(new ArrayList<>());\n\
  \        triangle.get(0).add(1);\n        for (int i = 1; i < numRows; i++) {\n\
  \            List<Integer> row = new ArrayList<>();\n            row.add(1); //\
  \ 每行的第一个元素都是 1\n            // 根据上一行计算值\n            List<Integer> prevRow = triangle.get(i\
  \ - 1);\n            for (int j = 1; j < i; j++) {\n                row.add(prevRow.get(j\
  \ - 1) + prevRow.get(j));\n            }\n            row.add(1); // 每行的最后一个元素都是\
  \ 1\n            triangle.add(row);\n        }\n        return triangle;\n    }\n\
  \n    public static void main(String[] args) {\n        int numRows = 5;\n     \
  \   List<List<Integer>> triangle = generatePascalsTriangle(numRows);\n        System.out.println(\"\
  包含 \" + numRows + \" 行的杨斯卡三角形:\");\n        for (List<Integer> row : triangle) {\n\
  \            System.out.println(row);\n        }\n    }\n}\n// 输出:\n// 包含 5 行的杨斯卡三角形:\n\
  // [1]\n// [1, 1]\n// [1, 2, 1]\n// [1, 3, 3, 1]\n// [1, 4, 6, 4, 1]\n```\n\n\n\n\
  \n\n# 121. 将十进制转换为罗马数字\n\n![image](img/chapter_title_below.png)\n\n```java\npublic\
  \ class Main {\n\n    public static String decimalToRoman(int num) throws IllegalArgumentException\
  \ {\n        if (num <= 0 || num > 3999) {\n            throw new IllegalArgumentException(\"\
  输入无效。请提供 1 到 3999 之间的有效正整数。\");\n        }\n        // 定义罗马数字符号及其值\n        String[]\
  \ romanSymbols = {\n            \"M\", \"CM\", \"D\", \"CD\",\n            \"C\"\
  , \"XC\", \"L\", \"XL\",\n            \"X\", \"IX\", \"V\", \"IV\", \"I\"\n    \
  \    };\n        int[] values = {\n            1000, 900, 500, 400,\n          \
  \  100, 90, 50, 40,\n            10, 9, 5, 4, 1\n        };\n        StringBuilder\
  \ result = new StringBuilder();\n        // 将十进制转换为罗马数字\n        for (int i = 0;\
  \ i < values.length; i++) {\n            while (num >= values[i]) {\n          \
  \      result.append(romanSymbols[i]);\n                num -= values[i];\n    \
  \        }\n        }\n        return result.toString();\n    }\n\n    public static\
  \ void main(String[] args) {\n        int decimalNumber = 1984;\n        try {\n\
  \            String romanNumeral = decimalToRoman(decimalNumber);\n            System.out.println(decimalNumber\
