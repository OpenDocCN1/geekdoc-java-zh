  md: 'food production was increasing, famines were becoming less frequent. Surely,

    he wrote, if the world was overrun with people and our natural resources

    were about to run out, the price of all these things should be going through

    the roof?[10]


    Up until then Ehrlich hadn''t paid much attention to Simon, and nor had

    anyone else. But Ehrlich couldn''t allow this impertinence to stand. He wrote

    in Science disputing Simon''s points, and so began a series of letters

    tween the two men, which culminated with Simon saying:


    I''ll put my money where my mouth is. This is a public offer to take $10,000,
    in separate

    transactions of $1000 or $100 each, on my belief that the cost of non-government-controlled

    raw materials (including grain and oil) will not rise in the long run.


    Ehrlich quickly accepted. He bet Simon that the value of five key metals—ncoper,
    chromium, nickel, tin and tungsten—would increase in real terms (in

    other orders adjusted for inflation) between 29 September 1980 and 29

    September 1990. There was nothing accidental about the choice of metals, on

    each which Ehrlich staked $200; chromium and nickel are, as you know,

    ccial ingredients for alloying steel; tin and tungsten are both important

    feedstocks in the production of countless electronics items. If the world would

    continue to build, industrialise and, above all else, procreate, then demand

    for these metals could surely only increase.


    With few materials was this more obvious, as far as Ehrlich was

    concerned, with that. Of all the industrial metals like iron or

    aluminium, copper is the most scarce. In the very earliest days of

    metalworking, which is to say about 10,000 years ago, copper was plentiful

    enough that it was occasionally discovered in its native form—beautiful pure

    nuggets that could be plucked from the ground. Its first great mining

    centre, Cyprus (whose Greek name, Kypros, is where we get the word copper

    from), dotted with rich ores: large clumps of blue-green rocks with

    copper content was as much as 20 per cent. But in the succeeding millennia

    we mined almost all of the purest stuff; what is left are far more dilute

    resources. At the time Ehrlich made the bet, the total global reserves of iron

    ore were counted in the hundreds of years. The global reserves of copper

    were calculated to last barely more than 30 years.'
