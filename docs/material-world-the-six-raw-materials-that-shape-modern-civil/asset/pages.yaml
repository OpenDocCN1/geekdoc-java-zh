    iron ore, essentially granulated rust, and turning into a metal means ripping
    the oxygen atoms away from the iron atoms. And that, ultimately, is what this
    enormous furnace is here for: to provide an environment where the oxygen can leave
    the iron and bond with the carbon from the coal. Strictly speaking, the main end
    product of these blast furnaces is not the iron ore gushing out of the side and
    the slag that gets drained away later, but carbon dioxide, and lots of it.[*1]


    # Iron, Coal and the Industrial Revolution


    Iron is a fossil fuel product. Each year we staggering quantities of coal—more
    than a billion tonnes, which works out at comfortably more than the combined weight
    of every human being on the planet—into the thousand or so blast furnaces operating
    around the world. The iron that comes out the other end may not have much carbon
    embedded in it, but its production entails the creation of enormous quantities
    of CO2—around 7–8 per cent of the global total. No other source of greenhouse
    gases is quite so concentrated into such a small number of sites.[*2]


    And while Port Talbot with its two blast furnaces looks puddling days in comparison
    with most Chinese steelworks, it is nonetheless still the single biggest steelworks
    and, therefore, the single biggest carbon emitter in the UK. Yet there is an irony
