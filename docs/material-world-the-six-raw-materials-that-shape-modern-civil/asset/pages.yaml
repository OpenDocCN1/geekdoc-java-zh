  md: 'out, block caving is somewhat more brutal. Rather than following a seam you
    dig underneath the ore and then plant large quantities of high explosive into
    the rocks above your head. Having stepped back distance you blast those rocks
    and let gravity do its job, collapsing hundreds of thousands of rocks into that
    tunnel. Those rocks are conveyor-belted to be refined in Chuqui''s smelters or
    shipped elsewhere for further processing. The unsettling thing was that work on
    both bits of the mine overlapped. Even as I watched the open-pit miners boring
    holes in the ground downwards, somewhere below them was another crew blasting
    holes in the ceiling upwards.[17]


    Block caving is the new thing in industrial mining and Chuqui is not the only
    place where it is employed. On the other side of the world in the Indonesian half
    of New Guinea, on remote mountain range that jut more than 4,000 metres into the
    sky, you will find Grasberg.


    It is possibly the most breathtaking mine in the world since it looks like a movie
    villain''s lair wreathed in clouds, with a massive hole scooped out of the top
    of the mountains. The wealth of the ores here is stupendous: it has the world''s
    largest known reserve of gold and the second-largest reserve of copper. But having
