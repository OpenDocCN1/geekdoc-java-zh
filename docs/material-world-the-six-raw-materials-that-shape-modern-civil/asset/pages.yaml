  md: 'Some took the other side


    Such views were not fringe. There were “perhaps ten years left” to save the planet,
    said U Thant, the secretary-general of the United Nations, in 1969, calling for
    a global partnership to avert catastrophe. In 1970 Nobel Prize-winning biologist
    George Wald said “civilization will end within 15 or 30 years without immediate
    action is taken against problems facing mankind.” Ehrlich was simply the most
    provocative voice for what was becoming the conventional wisdom in corridors of
    power from Washington and New York to London and Beijing. Julian Simon, on the
    other hand, thought it was all a little bit over the top.


    “Bad news,” he wrote in the journal Science,“sells books, newspapers, and magazines;
    good news is not so interesting.” He then ran through a host of claims, many of
    them from Ehrlich’s The Population Bomb and The Limits to Growth, and declared
    them almost universally false. Far from falling,'
  merge: -1
