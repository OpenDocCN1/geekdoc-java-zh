    The Second World War was not merely a war against refineries, it was a war of
    refineries. Even as they targeted German hydrogenation plants, the Allies were
    out-refining their opponents, giving their fighters a sizable advantage in the
    process. Germany''s synthetic fuel was a thing of wonder, but on the other side
    of the Atlantic, American refineries were making their own breakthroughs. Among
    them were a complex catalytic cracking technology carried out in skyscraper-sized
    refinery units that produced high-grade 100-octane fuel, as opposed to the 87-octane
    variety coming out of places like Wieseling.


    An octane rating is essentially a measure of how well fuel can withstand pressure
    in an engine without prematurely exploding or "knocking," as it-sometimes called.
    The higher-octane fuel meant Spitfires and Lancasters could be equipped with superior
    engines, such as the Rolls-Royce Merlin. They could fly 15 per faster than their
    German counterparts, had 1,500 miles more range on their bombing missions and
    a maximum altitude 10,000 feet higher. This fuel advantage might even have swung
    the balance in the Battle of Britain.


    # The Heavy Consequences of a Heavy Metal


    Tempting as it might be at this point to applaud American refiners for such a
    splendid achievement, there is another, less flattering prism through to view
    this story. These clever techniques pioneered by American refiners to improve
    the octane of fuels were the successor to another, darker way to reduce knocking:
    adding lead to the mix.


    Engine knock was one of the great early challenges faced by the motor industry.
    In an effort to outdo its rivals at Ford, General Motors (GM) began in the 1920s
    to look for a way to quiet the engines in its Cadillacs. One of its engineers,
    a man called Thomas Midley, discovered that a drop of tetraethyl'
