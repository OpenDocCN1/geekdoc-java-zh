  md: 'One of Lang Hancock’s many firm convictions was that miners should be allowed
    to mine where their bloody well wanted, even when those mines sat sites long held
    sacred by the tribes who lived here thousands of years before the first settlers
    showed up. And up until the 1970s that was more or less the way Australian mining
    proceeded, with hundreds of square miles raced and cleared with little care for
    those ancestors trode lands. This would be unacceptable for most cultures—think
    back to the Shoshone people of Nevada—but it is especially destructive for Australian
    Aboriginal people, whose philosophy, the Dreaming, is all about connection with
    the land. There are stories of how their ancestral spirits created the sites and
    formations that these red hills. Rupture the geology and you rupture the Dreaming,
    which is tens of thousands of years older than the Koran or the Bible. No other
    people on earth can claim to have had long as a continuous cultural history as
    the Aboriginal populations—and for many of them that history is embedded in Pilbara
    ironstone.


    The headless destruction of sacred places was supposed to have stopped with the
    passage of the 1972 Aboriginal Heritage Act, which stipulated that Rio Tinto and
    others would have to recognise the relevant peoples as traditional owners of these
    sites, come to agreements with them mining and avoiding anything of significant
    cultural or historical value. But, every so often, things have gone wrong—very
    wrong. Which brings us to the story of Brockman 4.


    Brockman 4, as the name suggests, an offshoot of another mine, Brockman (actually
    Brockman 2), in a corner of the Hamersley Range first highlighted back in Lang
    Hancock’s era. The grades of iron here are rich, the expanse of hematite rocks
    wide across spectacular hills and valleys, and the first few years of mining were
    very promising indeed—so much so that in 2013 Rio Tinto sought approval to extend
    the mine further, making it its second biggest in the Pilbara.


    The neighbouring land covered by the potential extension included a ravine known
    as Juukan Gorge. This was one of those ephemeral'
