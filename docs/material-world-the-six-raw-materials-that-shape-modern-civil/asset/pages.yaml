  md: '# Jelly Rolls


    SPARKS, NEVADA


    There is still snow on the mountaintops here in the deserts of northern Nevada.
    Wild horses chase each other up down the hillside, tossing their manes as they
    canter. And were it not for what is at the the bottom of the valley you could
    be fooled into thinking we are in a scene from a Wild West movie.


    But no: what we are looking at, beneath us, is one of the most intriguing buildings
    in the world. Not that it looks tremendously exciting from the outside; all we
    can see from here is a massive, L-shaped edifice covered in solar panels with
    a red line running across the top. The main thing that strikes you from a distance
    is its scale: about the size of 33 American football fields. But it is when you
    peel away the sides that things start to get interesting. What looks from afar
    like a low-slung, flat building actually contains three double-sized storeys of
    factory space. And then we get to what they''re actually making here.


    Fully two-thirds of this enormous complex is devoted to the manufacture of batteries.
    They are everywhere you look: millions of cells—finger-sized metal cylinders that
    look not unlike the AA batteries we''re all familiar with, albeit a touch bigger.
    Watch them go round the machines a while and eventually you find yourself feeling
    a little hypnotised. Whiz! They zing down tiny tracks and conveyor belts, carried
    on little caddies, held in place by steel rails. Ping! Up and down they go, before
    being swung around'
  merge: -1
  pgno: 333
- img_proc: true
  md: 'what look like miniature merry-go-rounds, all to a score of metallic clinking
    and tinkling.


    The first time I saw one of these battery assembly units with its steel tubes
    whizzing to and fro I was reminded, strange as this will, of a tinned tuna plant
    I had seen a few years earlier in the Seychelles, albeit minus the unbearable
    smell of dead fish. Yet what we are witnessing here is perhaps the closest thing
    to a modern-day industrial revolution. These little steel tubes are the cells
    which will help to electrify road transport.


    For this is the lithium extracted from beneath the Salar de Atacama is transformed
    into something we can actually use. In between leaving Chile and arriving here,
    the metal has already been around the world. At another plant it has been mixed
    up into a cocktail of what are known as cathode active materials, to be pasted
    on to the electrodes before being slotted into these steel canisters.


    This battery plant is where the field of material science collides head-on with
    the exigencies of scale. The real challenge here—the nut to be cracked if there
    is to be any hope of arresting climate change—is not merely to come up with the
    best chemistry inside those batteries but to turn out enough of them to make electric
    vehicles an affordable reality. What we are seeing inside this plant, then, is
    the Thomas Edison moment in concrete, the Henry Ford moment in cars, where something
    clever and artisanal began to be churned out in astounding numbers. It is where
    the ancient lithium brine we saw in Chile is repurposed into something that can
    actually change the world.


    After all, there is no eliminating carbon emissions without addressing our use
    of gasoline- and diesel-powered cars and trucks. As of 2020, more than a fifth
    of all our greenhouse gas emissions could be traced back to fuel vehicles. There
    is no other single activity that has such a bearing on our carbon footprint, which
    is why today there is quite so much obsession with batteries, and why places like
    this building are so important.


