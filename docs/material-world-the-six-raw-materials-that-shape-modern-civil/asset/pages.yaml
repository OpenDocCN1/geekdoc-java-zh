    The secret of polyethylene''s success is to be found in its molecular structure.
    Like all plastics (and for matter some natural substances including the proteins
    inside our muscles or DNA itself) it is a polymer—a very large molecule consisting
    of far more atoms than simple substances like water, alcohol or silica. In the
    case of polyethylene, these molecules are astoundingly long chains of hydrogen
    and carbon.


    The best way to visualise what''s going on at a molecular level here is to think
    of a bowl of spaghetti. If you stick your fork into the pasta and pull it out,
    you will probably ensnare a whole bunch of other strands that tangle together.
    In this essence, is how polymers like polyethylene get their strength; the longer
    the strands, the more entangled they can get and the harder it is to separate
    them from each other. Think about it: if you cut the spaghetti into short strands,
    as some people do, then all of a sudden do not hold together.[13]


    Now imagine these strands are 25–30 centimetres, as is typically the case in most
    spaghetti packs, but about how fiendish tricky it would be to separate one strand
    from another. That''s what''s happening at an atomic level with polyethylene when
    it is forming—only the strands are so small they are only a few atoms across and
    a few thousands of atoms in length. And by playing around with this molecular
    structure, polymer designers can vary its strength and behaviour enormously. Pack
    the chains close together so they crystallise and you might end up with a hard,
    rigid plastic bottle; space them further apart, with fewer microscopic plastic
    crystals joining them together, and you have a bottle you can squeeze out of.
    Vary the length and something similar applies: the bulletproof vest of polyethylene
    (ultra-high molecular weight) involves strands that—if they were the width of
    spaghetti—would be about 250 metres long.


    Polyethylene isn''t the only plastic—it''s one of five main families of human-made
    polymer. There is polystyrene, famed for its puffy packaging foam but equally
    capable of being moulded into a hard, clear plastic. There is vinyl—polyvinyl
    chloride—from which you can make pipes and soft'
  merge: -1
  pgno: 297
- img_proc: true
  md: 'shower curtains. There is nylon, famed for its silky stockings but just as
    easily moulded into hard machine screws. There is polypropylene, flexible enough
    to be used as the lid of a flip-top bottle but hard enough to be formed into furniture.
    There are also thermosetting materials like epoxy resin, familiar to us as a glue
    but even more important as a binding matrix that helps carbon fibre and fiberglass
    set into ultra-hard materials. Thermosetting plastics must be heated, cured, to
    adopt their chemical form while thermoplastics, which comprise most of today''s
    plastics, do not. Nor does it end there: there are 15 other categories of synthetic
    polymer, as well as tens of thousands of sub-categories—all materials the world
    had literally never seen before.


    For millennia, humankind had been bound by the properties of the substances endowed
    by nature. We could burn and beat and refine what we found in the ground, adapting
    them to our needs. With plastics we could go one step further: we could tailor-materials
    rather than bending them to our use. And for a period, the consensus was that
    plastics were indeed a miracle. Not only were we improving on nature, we were
    using polymers to help safeguard nature. The very first plastic, celluloid, was
    developed to replace the natural ivory used in billiard balls. Its invention in
    the 1860s helped save African elephant herds from almost certain extinction. Artfully
    dyed celluloid could take the place of natural tortoiseshell, polyester could
    stand for mink fur. Plastics could protect endangered species such as kerosene
    had protected the world''s sperm population in the early days of oil.


    With plastic packaging we no longer had to melt down as much into glass or chop
    down many trees and turn into paper and card. Polyethylene insulation helped safeguard
    the Malaysian gutta-percha tree, not to mention other materials too. A Bell Labs
    report in the 1970s found that America had continued to sheath its telephone cables
    with lead rather than polyethylene, this alone would have consumed four-fifths
    of all the lead produced in the country.[14]


    As the forties and fives gave way to the sixties and seventies, there seemed to
    be no end to the wonder. Chemicals company, fed by the naphtha'
  merge: -1
  pgno: 298
- img_proc: true
  md: 'and ethylene coming out of oil refineries and from gas plants, churned out
    more plastic, as well as chemicals and pharmaceuticals, which could be custom-designed
    out of hydrocarbon molecules. While the use of plastics proliferated, most of
    the new materials were still based on those five main families of plastic, discovered
    in the golden age—years bookending the Second World War. There were certain breakthroughs,
    but nothing quite like what Fawcett and Gibson discovered—or rather rediscovered—at
    Northwick.


    Those ICI in Cheshire were shut down years ago—long before the demise of the company
    and the sale of the site to Tata Chemicals. Today there is no sign or waypoint
    on the map; nothing on the internet to provide any clue about whether the building
    has survived—or where it is. Few substances have changed the world as much as
    this one, but it looks curiously as if it is a momentous discovery everyone is
    trying to forget.


    So, one chilly winter morning, I drove to Northwick to see if I could locate the
    old lab. I took the A533 through the town and I passed through Winnington, just
    before crossing the River Weaver, I spotted a handsome brick building on my right.
    Its tall walls were boarded with white metal shutters, but I recognised one feature
    I had seen in some old photos: the distinctive roundel of an oriental parasol
    in plasterwork above each window.


    I parked in front of the building. There were a few security cameras and a sign:
    “Leave the Premises with a Little Thought for the Local Residents.” A faded board
    on the side of the building suggested this place had briefly been a gym; another
    advertised it as an indoor paintball centre. Yet it almost certainly the right
    building, all the way down to the Art Deco lanterns by the entrance.


    I walked up towards the door and then I saw it—a blue plaque in the corner:


    In this building, which housed ICI’s Winnington Research Laboratory until 1995,
    RO Gibson and EW Fawcett discovered Polythene on 27 March 1933. An important early
    use was in the development of RADAR. Polythene went on to become the world’s largest
    tonnage plastic.'
  merge: -1
  pgno: 299
- img_proc: true
  md: 'The memorial was tucked away so discreetly you could barely spot it from the
    road.


    A little later I emailed Tata Chemicals to ask what had become of this historic
    building; what was it being used for today? Eventually the reply came back: “It
    is now a sauna.”


    In the past 13 years we have produced more plastic than our entire output between
    its invention in the early twentieth century and 2010. Save for a few dips such
    as the COVID-19 pandemic in 2020 and the oil crisis of the early 1970s, plastic
    output has tended to carry on exponentially. There is little convincing sign of
    a slowdown.


    Ethylene, the waste we produce John D. Rockefeller supposedly complained about
    as he saw it burning at one of his refineries, is now the foundation of an enormous
    new petrochemical sector. It gets pumped into vast crackers whose flares periodically
    light up the sky. The ICI plant, which once supplied much of the world with polyethylene,
    is still running, sitting along the banks of the River Tees at Wilton. These days
    it is owned by SABIC—the petrochemical arm of the Saudi oil giant Aramco. Even
    as the Saudis keep pumping crude out of Ghawar, they also operate this historic
    plant thousands of miles away, inhaling hydrocarbons and exhaling millions of
    tiny pellets—nurdles as they are sometimes called. No one likes to talk about
    the fact that a facility in Teesside makes the plastic for much of the continent’s
    carrier bags.


    It is a reminder, though, that Europe and the U.S. used to dominate the sector
    until more recently than you might have assumed. Making polyethylene is a tricky
    business, and long after China became the world’s biggest manufacturer it was
    still importing of its raw plastic from sites in the West. But since 2010 that
    has begun to change. Today, a third of the world’s raw plastic is made in China,
    much of it produced from coal rather than oil or gas, as the Germans once did
    in Wesselin all those years ago. There, the love affair has yet to sour.'
  merge: -1
  pgno: 300
- img_proc: true
  md: 'Here in Europe, what was once a wonder material is now regarded with suspicion
    and dismay. The substances we created that helped us transcend the need for traditional
    raw materials such as metals and stone have degraded into a symbol of the Anthropocene.
    Except that they haven''t degraded at all; this is the problem. They are very
    much with us, sometimes visible to the naked eye, sometimes not. There are microplastics
    in the ocean, microplastics rafting undetected through most of our homes, microplastics
    even in uninhabited parts of the world, high up in the mountains, scattered there
    on the wind. Each month brings new research about the dangers of plastics to animals,
    humans and the wider environment.


    We are learning that plastics can leach toxic chemicals into their surroundings,
    that they can harbour antibiotic-resistant bacteria, and that, when ground down
    to nanoplastic scale, they can even pass through biological membranes, possibly
    into the brain. While the damage to oceanic species has sometimes been overstated,
    there is little doubt that plastic pollution has spread in the seas. The proportion
    of oceans speckled with microplastics is still small, but given we only invented
    these materials a few generations ago, and the quantity of plastic we have produced
    in the past decade and a bit, this is not especially reassuring.


    Many countries have now banned single-use shopping bags and other items like plastic
    straws. In some cases these bans have been shorts: the manufacture of paper bags
    and straws can create considerably more carbon emissions than their plastic counterparts.
    A plastic straw can be reused multiple times whereas a paper straw is unlikely
    to make it more than a few sucks—as any parent of a young child will testify.
    Some biodegradable polymers lack the strength and stability of the traditional
    plastics they are supposed to replace; sometimes they fail to degrade as promised.
    They threaten to sit alongside the other things we thoughtlessly away.


    And while it is possible to recycle plastics at scale, the challenge is that while
    some types of plastic are perfectly suited to being melted down and remoulded,
    others are not. Soft drinks made out of polyethylene terephthalate (PET), for
    instance, could easily be re-formed into a polyester'
  merge: -1
  pgno: 301
- img_proc: true
  md: 'fleece. But add a different type of plastic to the recycling process, a thermosetting
    one for instance, and what comes out is a bit of a mess. One argument about why
    plastic recycling rates remain so low (only about 25 per cent in Europe and 10
    per cent in the U.S., compared with 80 per cent for steel) is that it is simply
    too complex, with consumers asked to distinguish between seven different types
    of plastic (those recycling codes you sometimes see on bottles) before putting
    them in the correct bin. The other argument is that the virgin material, so cheap
    that nurdles are churned out of ethylene crackers around the world, are so cheap
    that recycling makes little economic sense.[16]


    There is an irony here: these plastics were the product of an oil industry that
    was so parsimonious, so determined not to waste even the smallest fraction of
    a barrel, that it turned every last drop into products and profit. It encouraged
    the creation of whole new industries and materials along the way. We were engulfed
    with plastics so cheap and plentiful that they felt almost valueless, disposable.
    But what the refineries saved from becoming a waste product has ended up as waste
    the same: litter tossed on beaches, roads, in the sea and into landfill.


    OceanofPDF.com'
