    to remove the soot from the stove. The hands of the farm wives of the era were
    scarred all over from close encounters with the sad iron.


    When electricity came to these outposts and towns, the very first most families
    bought an electric iron. Such things are long forgotten these days. When historians
    talk about the coming of electricity they usually talk about the obvious stuff—the
    replacement of dim kerosene lamps with bright lightbulbs and the introduction
    of electric pumps so no longer had to be hauled all from the well. But what made
    electricity the next greatest thing after the love of God was that it rapidly
    improved every aspect of everyday life, from the big to the small. And the material
    on which electricity was generated and then carried into people’s homes, the material
    which helped bring about this revolution, was copper.


    All six of the materials featured in this book are essential to modern life, but
    there is something especially seductive about copper. This shimmering metal is
    at once a symbol of our ancient history and a key to our future. As'
