    # Salt at the Heart of the Modern World


    As you travel across this post-industrial landscape, you might be left with the
    impression that this industry has disappeared altogether. But don''t be fooled.
    For it turns out Cheshire is today making more salt—much more—than it did at comparative
    high point in the late nineteenth century: between 2 million and 4 million tonnes
