  md: 'Coal and iron were helping birth the industrial revolution—coal to fuel the
    machinery, iron to build it. Their story was as intertwined then as it is today.
    Watt’s engines, for instance, only really came of age when he encountered John
    Wilkinson—a man so obsessed with this metal that he worked at an iron desk, commissioned
