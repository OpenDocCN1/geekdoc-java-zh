  pgno: 236
- img_proc: true
  md: '1913 down below 2 per cent by the middle of the century and below 1 per cent
    by its end. And as the grades fell, the work of extracting the copper from the
    ores significantly more demanding. Between 1900 and today, the quantity of stone
