    Today, polyethylene has become the most widely used plastic in the world. Every
    six seconds we make of it in Europe to wrap the Eiffel Tower from head to toe.
    Every six seconds! We produce about 100 million tonnes a year—which is more than
    the combined global production of copper and aluminium. Much of that is plastic
    bags—for better or worse the most iconic of all polymer objects—but that''s the
    beginning of it. Alongside the low-density polyethylene we make into shopping
    bags and clingfilm, there is a very low-density variety that we make freezer bags,
    and a linear low-density version from which we make bubble wrap and Tupperware.
    There is high-density polyethylene, which becomes detergent bottles and plastic
