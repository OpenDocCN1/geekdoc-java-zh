- img_proc: true
  md: 'went, and by state the bans were revoked and the age of leaded petrol began.


    But there is no safe amount of lead, however microscopic. This substance can accumulate
    over time in the brain, the bones and the lungs of anyone exposed to it. Lead
    impairment means whole generations of people who inhaled these fumes have lower
    IQs than would otherwise have been the case. There are even compelling stories
    suggesting a correlation between leaded petrol and violent behaviour.


    Only in the 1980s did the U.S. formally ban lead from gasoline. After all, there
    was nothing to stop refiners making viable petrol without lead, using some of
    the clever tricks they had put to so good use 40 years earlier in the war. But
    many of the lead particles belched out of car exhausts over more than half a century
    are still sitting in the soil and dirt of cities around the world, an invisible
    remnant of a miserable chapter in the story of oil refining.


    Given it is these stories people most associate with oil refineries—stories of
    pollution, if not from lead then from benzene or other toxins produced in these
    sites—perhaps it’s no surprise they become so unfashionable. Even the oil majors
