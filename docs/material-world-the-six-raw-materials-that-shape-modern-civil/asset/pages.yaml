    # Earning Their Salt


    You can cross most of England on old salt routes. From Droitwich to Warwick, from
    Buxton to Sheffield, there are paths and roads that have been padded along for
    thousands of years, where people carried salt from where it was made to where
    it was consumed. Indeed many of what the English call their Roman roads were originally
    ancient salt routes, which the Romans paved over when they conquered the country.


    Medieval Europe was criss-crossed with such roads: from Venice to Trieste, Trieste
    to Vienna, Augsburg to Salzburg (literally: salt-town) and, perhaps most famous
    of all, between the brine springs at Lüneburg and the port of Lübeck on the north
    coast of Germany. From Lübeck salt was'
