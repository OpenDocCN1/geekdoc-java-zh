    and piston did his engine begin to roar.[6]


    This was not just an industrial revolution, but a material revolution and—the
    first great energy transition, humankind shifting from wood and charcoal power
    to fossil power. The beginning of the nineteenth century, most of the industries
    in Britain were powered by coal. This, it’s worth saying, quite unique. In 1800,
    95 cent of Britain’s energy came from coal; at the very same point, almost all
    of France’s energy—over 90 cent—came from burning wood. No longer was Britain
    yoked to the organic limitations of how many trees could be grown on its landmass.
    Around this time, its income per capita began to soar. By the early nineteenth
    century it was 80 per richer than France.[7]


    Perhaps the simplest way to illustrate the importance of this energy transition—humankind’s
    natural constraints—is to ask what life would look like today if we detached coal
    and coke from our blast furnaces and returned to using wood and charcoal instead?
    After all, some countries, most notably Brazil, use lots of charcoal instead of
    coke, so it’s theoretically doable—until you run the numbers. For replacing all
    the coke for Britain’s 30 megatons of steel consumption would necessitate nearly
    half the surface of the UK purely for charcoal production. To do the same for
    global steel production would entail chopping down half of the Amazon. Depressing
    as this thought experiment might be, it rather underlines why we are still tipping
    and spraying so much hard, energy-dense coal into blast furnaces like the one
    here in Port Talbot.[8]'
