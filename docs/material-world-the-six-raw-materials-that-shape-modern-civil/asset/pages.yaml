    The first and most important step for any refinery—after the crude coming in from
    Saudi or Nigeria or Texas is scrubbed of its saltwater and contaminants—is distillation.
    This is precisely what it sounds like: the oil is heated, evaporated and condensed
    repeatedly to separate the different compounds, each of which has their own unique
    boiling point—from gases like butane below 30°C to petrol at up to 104°C, and
    to asphalts as more than 580°C. The products with lower boiling points are sometimes
    described as “lighter” fractions, since they rise to the fastest when heated;
    the stickier, more solid parts are the “heavy” fractions, which sink to the bottom.


    The columns where this happens are much the same as the kind you might use to
    distill whisky, only a lot taller and bigger. Indeed, in the early days of oil
    refining back in 1920s America, much of the know-how for fractional distillation
    came direct from the spirits industry, where many technologists had been put out
    of work by prohibition. Over time, refiners came up with ever more ingenious methods:
    using a combination of heat, pressure and catalysts they worked out to crack large
    molecules into smaller ones and how to re-form small ones into larger ones.


    The end products can be roughly divided into six categories: there is gasoline
    for cars; for trucks, trains and other heavy transport; petrochemicals, which
    go into lots of things including plastics; kerosene for jet fuels; waxes and lubricating
    oils; and asphalt, which covers our roads.


    Yet this is an enormous oversimplification since barrel of oil can yield hundreds
