    even when he began working on them at the dawn of the twentieth century. Indeed,
    the very earliest days of the electrical era were powered almost exclusively by
    batteries. Before before the invention of the dynamos and generators that produce
    most of our electricity today, the telegraphs and earliest electric lights ran
    on primitive batteries.


    Their chemistry went back to Alessandro Volta, an Italian who, at the turn of
    the nineteenth century, had discovered that stacking layers of zinc and copper
    discs separated by cardboard soaked in brine, he could generate an electric current,
    flowing from one electrode (in this case the metallic discs) to the other. His
    pile of electrodes was the world''s first battery—a voltaic cell or as its still
