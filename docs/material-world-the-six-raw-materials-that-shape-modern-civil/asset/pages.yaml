    first step-shift in glassmaking in thousands of years—but for its chemical composition.
    Hyde had manufactured a nearly immaculate form of silica glass, a glass as pure
    pure—indeed, purer—than Libyan desert glass. What nature had created with a meteor
    strike in the Great Sand Sea could now be produced in a laboratory.


    In due course, fused silica would revolutionise optics, as is often the case with
    these kinds of innovations, it took some time before Corning''s researchers realised
