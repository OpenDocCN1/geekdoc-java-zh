  md: '# Pipes


    There is something peculiar about the Wesseling refinery—but no one much likes
    to talk about it.


    To the uninitiated observer, which is to say of most of us, it looks just like
    any other oil refinery: a spaghetti junction of steel piping, chrome canisters
    and steaming, stinging chimneys.


    When I visited it was early summer and the Rhineland was a sea of green trees.
    The only clues that this was Germany’s industrial sweetheart were the occasional
    chimney poking above the leaves and the roaring sounds emerging from every other
    warehouse. I walked down the long roads that link the different zones of the refinery,
    trying to understand what I was seeing.


    Making sense of an oil refinery is perhaps the hardest of all the tasks in the
    Material World. Parachute into a copper mine like Chuquicamata or the plant where
    the oil is crushed and the metal melted into anodes, and you can intuitively see
    what is happening before you. Glance at a gas furnace or even a lab where the
    Czochralski process is being used to turn out a perfect silicon boule (though
    good luck being allowed in) and it is much the same thing: you very quickly grasp
    what you are witnessing.


    Oil refineries are different. The deeper you stray into the forest of pipes, the
