  md: '# The Last Blast


    PILBARA, WESTERN AUSTRALIA


    There is nowhere on the planet quite like the Pilbara. This sweltering expanse
    of scrub and eucalyptus, where temperatures routinely exceed 45°C and road signs
    warn that the nearest petrol station is hundreds of kilometres away, is a kaleidoscope
    of colour. Down in the gorges there are rock figs and fluffy mulla mulla flowers
    with neon-pink tips; there are deep red bottlelebrushes and tall, violet Ashford
    peas, but most of all, there is the unmistakable Pilbara soil.


    Red rock in the valleys, red rock on the mountains and red dust everywhere. It
    clings to your boots and coats your clothes and covers your windscreen as you
    drive down the long, straight roads of what Australians call their Wild West.
    That the earth here looks like rust because the earth here is rust. There is iron
    in much of the world''s soil, but nowhere else is there so much iron in such concentrations
    over quite an enormous expanse as here in the Pilbara.


    Slice through some of the rocks and you reveal an extraordinary cross section:
    a geological tapestry that looks a lot like an aboriginal artwork. There are successive
    layers of iron, chert, shale, siltstone and dolomite, wiggling their way through
    time. Geology offers few more spellbinding sights than these banded ironstone
    formations—the remains of oceanic activity from the Precambrian era, the very
    earliest in the planet''s history.'
  merge: -1
  pgno: 196
- img_proc: true
  md: 'That this type of ironstone is nearly blood red is no coincidence. Hematite,
    as it is technically known after the Greek for blood, contains iron atoms in the
    very same state of oxidation as the ones flowing inside our veins. There are other
    types of iron ores elsewhere—black magnetic of the kind found in the magnetic
    mountain in Russia, brown limonite in many soils, as well as on the surface of
    Mars—but none is quite captivating.[1]


    People here have cleaving these rocks apart since prehistoric times, using ironstone
    to fashion axes and tools, using rocks to grind their food, kill animals and sometimes
    artwork into cave walls. Forty thousand years ago the hunter-gatherers here would
    move from one waterhole to another, travelling an average of 27 miles a day and
    stalking their prey. In the winter they would seek refuge in the many natural
    rock shelters here and light fires, before moving. Archaeologists are still discovering
    fresh evidence of these artefacts of stone and bone, which date back tens of thousands
    of years: earlier than ancient monuments like Stonehenge or the Great Pyramids
    of Giza.


    But today the nature of cleaving and digging is of a different order entirely.
    For evidence of this


    Australia has more of the world''s mineable iron than any other country. Each
    year, it extracts more than twice as much as Brazil, its nearest rival, and about
    three times as much as China. This is of no small significance, for building a
    world-leading domestic iron industry has one of Beijing''s chief strategic goals
    since at least the 1990s. Yet unlike pretty much every other sphere—steel manufacture,
    concrete, plastic and machine assembly—this is one of those areas where all billions
    of'
  merge: -1
  pgno: 197
- img_proc: true
  md: 'renminbi and billions of hours of labour have not paid off. So while the rest
    of the world is utterly reliant on China for pretty much every tradable product,
    China remains utterly reliant on Australia for this all-important substance. After
    all, there is simply no escaping geology, and China’s iron reserves are nothing
    like the ones you find here in the Pilbara.


    # Enough Iron for the Whole World


    That there was iron here—and lots of it—was long suspected by geologists. Back
    in 1890 one of them, Harry Page Woodward, wrote that “There is enough iron to
    supply the whole world, should show the present sources were worked out.” But
    the story really began in November 1952 when a fellow named Lang Hancock was trying
    to find his way to Perth with his wife, Hope.\[2]


    Hancock was, in the words of the New Yorker magazine, “a piece of work”: thick
    of neck, short of temper and unapologetically right wing. He once told an interviewer
    that the best thing to do about Aboriginal people was to “dope” their water, sterilising
    and wiping out the population. A keen pilot with a fair bit of money from his
    family and an asbestos mine he had sold a few years earlier, Hancock was flying
    his twin-engine plane over the Hamersley Range when he spotted a thunderstorm.[3]


    Hammersley, which begins north-west of Newman and stretches nearly 300 miles up
    towards the Fortscure River, is a rugged landscape of ridges, plateaus, chasms
    and gorges cut by torrential rivers. Seeing the dark clouds ahead, Hancock, an
    expert pilot, dropped the plane’s altitude and began to thread through the gorges,
    and as he did, he noticed something striking.


    “The walls looked to me to be solid iron,” he later told Australian television.
    “I was particularly alerted by the rusty-looking colour on them which pushed me
    to be oxidised iron.”[4]


    And, so his story went (a story his biographers have questioned, given there was
    no record of rain anywhere on the Hamersley Range that day), once the weather
    cleared he returned for a better look.'
  merge: -1
  pgno: 198
- img_proc: true
  md: 'The simplest to tell whether the rocks you are inspecting contain much iron
    is to chip a chunk off and hold it in your hand. Iron ore is heavy—noticeably
    heavy, far heavier than most rocks. And the Hamersley Range, turned out, was essentially
    made of these heavy, hematite ores; it was made of iron—enough, indeed, to supply
    the world. At the time of Hancock''s discovery, the prevailing wisdom was that
    Australia had hardly enough iron to last a couple of generations, so there was
    an embargo on any exports. After the ban was lifted in 1960, Hancock persuaded
    the London mining company Rio Tinto to begin work on the Hamersley Range. They
    agreed to pay Hancock a 2.5 per cent royalty on every tonne of iron ore produced
    in perpetuity. A small percentage of a very large number is still a large number,
    and the iron ore began to flow, first to Japan and then to China, Hancock became
    one of Australia''s richest people. He died in 1992 whereupon his company, and
    those all-important royalties, were inherited by his daughter, Gina Rinearth,
    who thought only after a vicious courtroom battle with her stepmother, whom she
    accused of plotting to kill her father.[51]


    Today, more than half a century on, Rio Tinto is the lead miner of most of the
    iron here in the Hamersley Range alongside BHP Billiton, which mines Mount Whaleback.
    Their mining technique—blasting the ground with explosives and then scraping up
    the earth—is a direct descendant of what Andrew Carnegie''s machines started in
    the Mesabi Range of north-eastern Minnesota in the late nineteenth century. That
    great belt of iron, which stretched parallel to Lake Superior, was the source
    of America''s steel for its motor industry and its first great skyscrapers. They
    pioneered the use of enormous steam shovels, which tore away the ground and cleaved
    a new chapter in humankind relationship with the earth. No longer did mining mean
    pickaxes and tunnels; on the Mesabi it meant peeling an entire landscape and freighting
    it off to be processed into steel. The iron fields of the Mesabi are still being
    worked today by U.S. Steel, the company built up Carnegie''s empire, but this
    one is mostly exhausted. Today it is towards Pilbara that people look when they
    need lots of cheap iron, and quickly.'
