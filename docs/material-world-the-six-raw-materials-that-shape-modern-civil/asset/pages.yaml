  md: 'Substance of Civilization to Mark Miodownik’s Stuff Matters. John Browne’s
    Seven Elements That Have Changed the World is similarly useful, and should you
    like to dive deeper into material-specific rabbit holes, here are a few more suggestions.


    # Sand


    There are two excellent books on sand, Michael Welland’s *Sand: The Never-Ending
    Story* and Vince Beiser’s *The World in a Grain*. For a compelling argument about
    the centrality of glass to human development, read *The Glass Bathyscaphe* by
    Gerry Martin and Alan Macfarlane, though if you’re after a more scientific primer,
    Seth Rasmussen’s *How Glass Changed the World* is worth a look. There are plenty
    of textbooks you you can find on the science and practice of concrete but for
    an overview, Robert Courland’s *Concrete Planet* is second to none. However, once
    you’ve got that you’ll probably want more on the built world, and I recommend
    *Building* by Bill Addis, which also doubles as a chunky coffee-table book you
    will find flicking through years to come. When I was writing the chapter on silicon
    chips, there was a surprising dearth of approachable books on semiconductor manufacturing.
    Jon Gertner’s *The Idea Factory* is excellent on the early days of wafers at Bell
    Labs, and there is a great 1978 book called *Revolution in Miniature* by Ernest
    Braun and Stuart MacDonald. Then, shortly before I submitted my final draft, the
    world finally got the semiconductor book it always desired, in the form of Chris
    Miller’s stupendous *Chip War*. If the journey along the silicon chain whetted
    your appetite, you know where to look next.


    # Salt


    There are two fine “general interest” books on salt, Pierre Laslo’s *Salt: Grain
    of Life* and Mark Kurlansky’s *Salt: A World History*, but there are countless
    excellent papers and books that delve into the specifics of both salt and (the
    shadow topic of this chapter) chemicals. For a deeper dive into the history of
    sodium chloride, consider picking up Samuel Adhead’s *Salt and Civilization*.
    The best place to start with the story of Chilean caliche'
