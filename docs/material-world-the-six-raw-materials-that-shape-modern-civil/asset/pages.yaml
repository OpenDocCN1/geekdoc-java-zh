    cars and a hydrogen alternative. The conventional wisdom is that places like this
    will become “stranded assets,” left behind when the world moves on.


    But there is an alternative vision being conjured up by places like Wesseling.
    Having ended the war tangled wreckage, this place was reinvented to refine oil
    rather than coal. Wesseling rebuilt its pipes and cylinders on top of the old,
