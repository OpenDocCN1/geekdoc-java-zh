    but if these pipes are a clue about what is happening beneath our feet.


    A couple of hundred metres under this grassy meadow, millions of tonnes of salt
    are being mined from enormous underground caverns—some small, others vast as cathedrals.
    Down there the walls, ceilings and floors are a stunning translucent pinky-brown.
    Were to shine a light into them they would glow like flesh; except you can''t
    do anything of the sort, for no human has set foot in the caves below this field.
    This leaves one pondering a riddle: what kind of mine has no miners?


