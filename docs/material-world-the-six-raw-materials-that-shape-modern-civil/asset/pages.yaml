  md: 'Ponder that for a moment: a millennium before one of the world''s most famous
    ancient monuments was constructed, the people here were already mass producing
    products and trading them. This settlement is a kind of missing link between the
    agricultural revolution and everything that followed. The people who worked here—who
    are thought to have come across mainland Europe, possibly from France—had brought
    with them knowledge about how to turn natural resources into a product, before
    selling or trading it onwards. Squint a bit, and you can see the veries of what
    might now call intellectual property, tech and, and, for that matter, capitalism.


    There have been many great transitions in history, some of which we will cover
    in the following chapters, this moment, in which our early ancestors corralled
    their friends and family together to work to produce nothing for their own consumption
    but to trade or sell to others, stands as an important watershed. That salt was
    the product in question might sound peculiar to the modern reader, who probably
    takes this staple product for granted, cheap and ubiquitous as it is. But it was
