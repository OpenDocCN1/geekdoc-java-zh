  md: '# Introduction


    I was standing on the edge of a precipice looking into the deepest hole I had
    ever seen. At the bottom was a group of people in hard hats, or at least so I
    was told; they were much too far to make out with the naked eye. In the ground
    near them were hundreds of pounds of high explosive. This was enough, I was informed,
    to demolish a city block.


    In front of me was a metal panel with two buttons, and next to me was a man with
    a walkie-talkie. We were listening in to the control room where someone was counting
    down. I had been told to press the two buttons simultaneously when the countdown
    reached zero. The charge from the detonator would take a split second to reach
    the bottom of the pit, at which point a football pitch-sized square of the Nevada
    dirt would evaporate before our eyes.


    > “You’ll feel the shockwave first,” said the man with the walkie-talkie. Then
    you’ll see the earth going up, then you’ll hear the explosion. In that order.
    It’s kinda weird.”


    I hadn''t travelled into the high desert to set off a bomb; I had come because
    of a spreadsheet. Some months earlier, scanning through Britain’s trade statistics,
    I had noticed something: flows of gold were distorting the nation’s figures, and
    hence our picture of the nation’s economy. Gold, it turned out, had overtaken
    cars and pharmaceuticals as the UK’s biggest export. Given Britain does not have
    a gold-mining industry this was perplexing. How a country with no significant
    gold reserves become one of its biggest producers? As far as I could make out,
    part of the answer was that much of the world’s physical gold passes through London
    on its way somewhere else. In order to solve the riddle I travelled out to where
    the precious metal is'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'actually extracted, to chart the journey of gold from the ground to the refinery
    and then, in the form of bars of bullion, around the world. But as we began filming
    it dawned on me that there was an even more intriguing story to tell, one that
    says rather a lot about humankind''s relationship with the world.


    It had taken some months for my producer to persuade the miner in question, Barrick
    Gold Corporation, to open its doors, and a few days to get there from London.
    The Cortez mine is not the kind of place you happen upon accidentally. In our
    case it took two flights and a four-hour drive across the salt flats of Utah,
    followed by another two-hour journey with Barrick''s minds. There was a highway,
    mostly empty except for the occasional heavy truck, then a long desert road, then
    a dirt track winding into a long, dry uninhabited valley. Cowboy country.


    The mine itself is located on the slopes of a hill called Mount Tenaboa, a sacred
    site for the tribespeople of the Western Shoshone. The process of mining is comparatively
    simple, and echoes the techniques used by gold miners back in the nineteenth century,
    albeit a gargantuan scale. The rocks are blasted out of the earth, crushed and
    ground into a fine dust, and eventually mixed with a cyanide solution which helps
    separate the gold itself.


    This is the reality of twenty-first-century resource exploitation: reducing vast
    quantities of rock into granules and chemically processing what remains. is both
    awe inspiring and disturbing. One risk is that the cyanide and mercury used in
    the method could escape into the surrounding ecosystem. After all, while miners
    like Barrick insist they follow all the rules laid down by the U.S. Environmental
    Protection Agency (EPA), campaigners warn that pollution often finds its way out
    of the mine. Indeed, a few years earlier the EPA had fined Barrick and another
    nearby miner $618,000 for failing to report the release of toxic chemicals including
    cyanide, lead and mercury. The main thing I was struck by as I observed each stage
    in this process was just how far we go these days to secure a tin shred of shiny
    metal.


    The scale, for one thing, was mind-boggling. As I looked down into the pit I could
    just make out some trucks on the bottom, but only when they emerged at the top
    did I realise that they were bigger than three-storey'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'buildings; the tyres alone were the size of a double-decker bus. How much earth
    do you have to remove to produce a gold bar? I asked my mind. They didn''t know,
    but they did know that in a single working day those trucks would shift rocks
    equivalent to the weight of the Empire State Building. Later I did the sums for
    myself. For a standard gold bar (400 ounces) they would have to dig about 5,000
    tonnes of earth. That''s nearly the same weight as ten fully laden Airbus A380
    super-jumbos, the world''s largest passenger planes—for one bar of gold.


    Perhaps you already know this is gold mined these days—that it doesn''t come out
    of the earth in nuggets or a rich seam formed by Mother Nature. Perhaps you know
    that it is instead the product of a chemical reaction involving one of the most
    toxic cocktails known to humankind, that it''s extracted by burrowing in the earth
    so much as tearing down entire mountains. Perhaps I was naive but I, for one,
    hadn''t quite realised.


    As I looked down into the open pit at the house-sized trucks and the miners scurrying
    like ants around the blast site, I started to feel a little queasy. It wasn''t
    just the spectacle in front of me—it was something I was wearing on my finger.


    Some months earlier I had got married. My wife and I stood before our family and
    friends and exchanged gold rings as a token of our love. As the countdown continued
    on the walkie-talkie beside me, thumbed the ring and pondered. The chances were
    it was probably extracted from the ground through precisely the same techniques
    I now witnessing. Why hadn''t I checked where it came from? I made a point of
    checking the diamonds in my wife''s engagement ring weren''t conflict diamonds,
    so why I didn''t find out what was sacrificed, by man and land, for the gold?
    Later I would learn that while it once have taken about 30 tonnes of ore, extracted
    via more traditional mining methods, to obtain enough gold for a typical wedding
    ring, these days it might take between 4 and 20 tonnes of rock. Standing there
    with the detonator in front of me, I felt like someone who has just enjoyed a
    slapup sausage and egg breakfast before being shown around the abattoir.


    Then there was the mountain itself. The pit I was staring into was not just somewhere
    near Mount Tenabo. It was Mount Tenabo. The mine was literally'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'being dug into the shoulders of the peak. As I looked across to the other side
    of the hole I could count layer upon layer of multicoloured rock strata constituting
    the internals of this mountain. I don''t believe in the water gods the Indigenous
    Western Shoshone tribes worship upon so it was hard not to feel there something,
    well, brutal and significant about peeling away the skin of the soil and peering
    beneath the surface.


    As the countdown continued I turned around and looked desperately towards my producer.
    “Would you like the honour?”


    She looked at me in disbelief and then took my place. Shamefacedly I stepped back
    and watched.


    The countdown reached zero. “Firing shot one, Cortez Hills,” said the man into
    the walkie-talkie, and pointed at the buttons. She pressed them both. There was
    a momentary pause—a second or so. Then a wave of pressure hit us—nothing dramatic,
    more like a waft of air. Then the ground was shaking and I looked down feet towards
    the bottom of the pit where the earth had turned to liquid. The explosion rippled
    the base of the mine, casting dirt and smoke into the air. Only then did we hear
    the rumble. It boomed and echoed around the valley for what felt like minutes.


    —


    The economist John Maynard Keynes once called a gold “barbarous relic.” His point
    was that while it might look pretty on a necklace or inside a sarcophagus it doesn''t
    really do all of that.


    Clearly it has value—why else would we blow up entire mountains for a few bits
    of it? But think, for a moment, about what gold actually does. It plays an important
    if somewhat fringe in electronics and chemistry, but that accounts for less than
    a tenth of demand these days. Instead, its primary uses are in jewellery, decoration
    and as an asset for those who worry about economic disaster. Some of the gold
    I saw being mined in Nevada is probably now on someone else’s ring finger. Or
    it might just as plausibly be back underground again, this time in the form of
    a bar in a bank vault. Sacrilegious as this will sound to jewellers and jumpy
    investors, the world would probably'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'not cease to function, nor civilisation grind to a halt, if we suddenly ran
    out of gold.[11]


    So in the months after I returned from Nevada I kept returning to a few questions.
    If this is what it takes to extract a metal we could possibly live without, then
    what does it take to extract those materials we really need? Come to mention it,
    what are the materials we really depend on? What are the physical ingredients
    without which civilisation would grind to a halt, and where do they actually come
    from?


    I had a hunch that steel would have to be among them. Most buildings and cars—not
    to mention the machines with which we build everything else too—are made from
    this alloy of iron, carbon and a few other crucial elements. Nor could we create
    modern spaces without concrete. Copper was surely essential, which it underpins
    the electrical networks upon which we depend. Since we still rely on fossil fuels
    for much of our energy I would guess, qualify as essential materials too—though
    perhaps one should also consider something like lithium, the element at the heart
    of all batteries we need in future. But how is one to quantify our dependence
    on these materials? And did their extraction invariably involve the same places
    of destruction I witnessed at the Cortez mine?


    Economics, the discipline in which I have been immersed for most of my professional
    life, seemed to have few definitive answers to these sorts of questions. Something''s
    value is what that someone is willing to pay for it, goes the standard explanation.
    If something is in short supply, people will cut back, find a suitable substitute
    (if such a exists) and move on. End of story.


    Yet the story doesn''t seem to accord with the reality, because this stuff clearly
    matters. For all that we are told we live in an increasingly dematerialized world,
    where ever more value lies in intangible items—apps and networks and online services—the
    physical world continues to undermine everything else. This is not especially
    evident when you glance at the balance sheets of our economies, which show that,
    for instance, four out of every five dollars generated in the U.S. can be traced
    back to the services sector and an ever vanishing fraction is attributed to energy,
    mining and manufacturing. But pretty everything from social networks to retail
    to financial services is'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'wholly reliant upon the physical infrastructure that facilitates it and the
    energy that powers it. Without concrete, copper and fibre optics there would be
    no data centres, no electricity, no internet. The world, dare I say, would not
    end if Twitter or Instagram suddenly ceased to exist; if we suddenly ran out of
    steel or natural gas, however, that would be a very different story.


    We all know this instinctively. And such principles are self-evident during periods
    of war, shortage or financial meltdown. As far as all-important statistics like
    gross domestic product (GDP) are concerned a dollar is a dollar, whether it is
    spent on Facebook or on food. There is a logic and elegance to this, but it didn''t
    exactly answer my questions. It is all very well knowing the price of something,
    but price is not the same thing as importance.


    This book started off as my attempt to answer these questions—a meditation not
    so much on the market value of substances but our dependence upon them. But as
    I journeyed deeper, beyond my comfort zone of conventional economics, it became
    something: a story of wonder. For the more I understood about these materials—commonplace,
    humdrum and often, yes, cheap—the magical they appeared to be.


    Consider something as simple as a grain of sand. There is no element in the earth''s
    crust, save for oxygen, which is more commonplace than sand''s main ingredient—silicon.
    Yet kneel down and examine what''s in the ground and you soon realise that you
    are sinking into a universe of complexity. There are coarse, angular sands sitting
    on the seafloor until they are dredged and turned into new land. There are desert
    sands, so worn by the wind that you study them under a microscope you see what
    looks like a pile of marbles—the edges of the grains rounded down by thousands
    of years of erosion. There are sands left behind ancient tropical oceans of such
    purity that they are traded around the world.


    Mix sand and small stones with cement, add some water and you have concrete, literally
    the foundational material for modern cities. Add it to gravel and bitumen and
    you have asphalt, of which most roads are made—those that aren''t made of concrete,
    that is. Without silicon we would not be able to make the computer chips that
    support the modern world. Melt sand'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'a high enough temperature with the right additives and you make glass. Glass—plain,
    simple glass—is, it turns out, one of the great mysteries of material science;
    neither liquid nor solid with an atomic structure we still do not entirely understand.
    And the glass you have in your windscreen is just the beginning of it, for woven
    into strands and accompanied by resin, glass becomes fibreglass; the substance
    out which wind-turbine blades are made. Refined into pure wires, it becomes the
    fibre optics with which the internet is woven. Add lithium to the mix and you
    get a strong, resilient glass; add boron and you get something called borosilicate
    glass;


    You will have encountered borosilicate glass before, probably under the brand
    name the manufacturer Corning giving it: Pyrex. Stable, clear and robust, capable
    of withstanding a wide range of temperatures, from the naked flame of a Bunsen
    burner to the piercing cold of deep space, borosilicate glass is one of the unsung
    heroes of the modern age. Unlike regular glass, which when exposed to potent chemicals
    can make small particles into the liquid, borosilicate glass remains chemically
    inert, making it the perfect material for test tubes, lab bakers and medical vials.
    The one thing almost every medicine or vaccine in history—including those developed
    for COVID-19—has common in the borosilicate containers in which they were worked
    on—stored and transported.


    But we did not pay attention to these kinds of things until we ran short of them.
    That was certainly the case with borosilicate glass, which received a sudden flurry
    of interest in the wake of the COVID pandemic, amid worries that the main thing
    holding back the distribution of vaccinations might not be the pharmaceuticals
    themselves but the containers in which they would be shipped. In the event, thousands
    of workers along a complex supply chain stretching from mines to refineries ever
    deployed an entirely new type of glass, not made with boron but with aluminium,
    calcium and magnesium, to help satisfy the demand for medicinal vials.


    Other sectors were not so fortunate. In the pandemic and thereafter, there were
    shortages of face masks, of swabs and diagnostic reagents, shortages of cement
    and steel, of timber and toilet paper, of industrial gases and'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'chemicals, shortages of meats, of mustards, of eggs and dairy. There was such
    a shortfall of silicon chips—semiconductors as they are often called—that car
    manufacturers across the world had to down tools and shutter their plants. Computer
    and smartphone manufacturers were unable to fulfil orders. Even a year after their
    launch, the new generation of game consoles was still in short supply. Only after
    around two years did those shortages come to an end.


    The funny thing about these supply chain crises was that each of them seemed to
    take the world’s governments and policymakers by complete surprise. They were
    surprised that there was a shortage of semiconductors, that cars needed so many
    of them and the shortage of new cars would push second-hand car prices up to record
    highs.


    The UK government was similarly startled in late 2021 when it suddenly ran short
    of carbon dioxide and discovered that without CO² the food industry is unable
    not merely to make sparkling drinks fizzy but also to preserve and store foods,
    as well as stun pigs and chickens before slaughter. This could all be traced back
    to the sudden closure of two fertiliser plants in Cheshire and Teesside. The majority
    of Britain’s CO² supplies come, it turned out, from two sites whose primary purpose
    was to make something else altogether: ammonia. And since natural gas prices were
    high and since ammonia is added, as we shall see in the following chapters, from
    natural gas, a lunch in one price had caused a sudden shortage in another, seemingly
    unrelated substance.


    But should this really have come as such a surprise? For a clue about the answer,
    consider a famous essay written in 1958 by Leonard Read, an American economist,
    called “I, Pencil.” “I am a lead pencil,” it begins, “the ordinary wooden pencil
    familiar to all boys and girls and adults who can read and write.” Yet, continues
    Read, or rather the pencil, “not a single person on the face of this earth knows
    how to make me.”[


    The wood in the pencil comes from cedars growing in western America, saw down
    with steel in blast furnaces and finished in workshops. It is milled into slats
    and dried and dyed and dried again, and the slats are grooved and glued into place.
    The lead in the pencil’s core is graphite mined in Sri'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'Lanka, refined and mixed with clay from Mississippi, alongside chemicals made
    from animal fat and sulphuric acid. The wood and lead of the pencil are coated
    in lacquer made from castor oil derived from castor beans, resins are used to
    label, and it is capped on its base with brass made from copper and zinc, on the
    other side of the world. The eraser is made from rapeseed oil from Indonesia,
    with numerous chemicals along the way, from sulphur chloride to cadmium sulphide.


    All for simplest of these, a pencil. Yet from the manufacturers who worked on
    each ingredient to the haulers who shipped the parts to those working in power
    stations providing the energy for the process, “millions of people,” writes Read’s
    pencil, “have had a hand in my creation, no one of whom even knows more than a
    few of the others."


    There are couple of straightforward lessons here. The first is how little we understand
    about how everyday products are actually made. The second is, given all this complexity,
    no single human being could carry out, or for that matter direct, these numerous
    processes. For obvious reasons “I, Pencil,” written at the height of the Cold
    War, put most of the emphasis on some of those lessons. Read’s essay was championed
    by the free market economist Milton Friedman as an illustration of why his Soviet
    counterparts were wrong to try to run their economy via central planning committees.


    Yet I contemplated the breakdown in twenty-first-century supply chains, it struck
    me that we might have done just well to remember the first of those lessons. Surely
    if we spent a little more time contemplating the items upon which we rely actually
    get produced, we might not be so baffled when they run short. Thanks to Read’s
    essay, millions of economics students now know their way around the supply chain
    of a pencil, but what about a smartphone or a vaccine or a battery? What about
    the supply chain for carbon dioxide or borosilicate glass?


    These networks of people and expertise, turning raw materials into sophisticated
    products and delivering them to us, stand alongside the substances themselves
    as the other star of this book. In the following pages you will find a celebration
    of how networks of humans, most of whom do not know each other, can collaborate
    to turn seemingly promising, inert'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'substances into things of wonder. And few supply chains, I discovered, are
    quite wondrous as those producing silicon chips.


    Long before the chip shortage, I had undertaken to try to tell the story of a
    grain of silicon, all the way from the quarry to the semiconductor foundry and
    assembly plant where it would become part of a smartphone. I soon realised that,
    much as with Read’s pencil, no single person, even those working on the supply
    chain itself, could fully explain to me the processes—even the very simplified
    processes—that took place at each stage along this journey. Those working at foundries
    understood plenty about photolithography and chemical abrasion, but little how
    the ultra-pure silicon wafers they were working on actually made. No one at the
    quarry digging quartzite from the ground (the chips, it turns out, begin their
    lives as grains of sand but fist-sized lumps of stone) understood much about its
    eventual destiny.


    Yet striking of all was the extraordinary length and drama of this journey. Between
    being blasted out of the ground in a quarry and ending up inside a smartphone,
    this grain of silicon will have circumnavigated the world numerous times. It will
    have been heated to more than 1,000°C and then cooled, not once or twice but three
    times. It will have been transformed from an amorphous mass into one of the purest
    crystalline structures in the universe. It will have been zapped with lasers powered
    by a form of light that you can’t see and doesn’t survive exposure to the atmosphere.
    This—the process of turning silicon into a tiny silicon chip—was the most extraordinary
    journey I had ever traced.


    But this was just the beginning. Over the following months I would see more quarries.
    I would descend to the sweltering depths of the deepest mine in Europe. I would
    see where salt comes from and how it gets transformed into the chemicals without
    which we would all struggle to survive. I saw red rock being turned into molten
    metal and then hammered into steel. I travelled to eerie pools from where we get
    lithium and followed the substance as it was pasted and rolled and squeezed into
    a battery for an electric car. And the more I travelled, the more I realised that
    I had spent most of my life'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'inhabiting another world altogether, a place I came to think of as the ethereal
    world.


    Perhaps you live there too: it is a rather lovely place, a world of ideas. In
    the ethereal world we sell services and management and administration; we build
    apps and websites; we transfer money from one column to another; we trade mostly
    in thoughts and advice, in haircuts and food delivery. If mountains are being
    torn down on the other side of the planet, it hardly seems relevant here in the
    ethereal world.


    When I flew out to Nevada to film that mountain being exploded I was really looking
    to film a visual metaphor, to turn the physical into something ethereal: a news
    report that would help people understand an idea like trade flows that bit better.
    Standing at the edge of the pit there, though, it occurred to me that my perspective
    had been dangerously shallow. All of a sudden realised I was staring out from
    the brink of one world and into another: the Material World.


    The Material World is what undergrids our everyday lives. Without this place your
    beautifully designed smartphone wouldn''t switch you, your brand new electric
    car would have no battery. The Material World will not provide you with a gorgeous
    home, but it will ensure your home can actually stand up. It will keep you warm,
    clean, fed and well, however little heed you may pay it.


    The Material World is where you will find the most important companies you''ve
    never heard of, companies like CATL, Wacker, Codelco, Shagang, TSMC and ASML.
    These names may mean nothing to you, but they are just as important, perhaps more
    important, than the familiar brands everyone has heard of—the Walmarts, Apples,
    Tesla and Googles of this world. For the best-secret of the modern economy is
    that this world-famous brands depend entirely on the obscure firms of the Material
    World to make their products and help their clever ideas, well, materialise. It
    is where ideas become a tangible reality.


    Why are today megabrands so happy to rely on other companies to get the real work
    done? Partly, frankly, because operating in the Material World, where you have
    to dig and extract stuff and turn it into physical products, can be a difficult,
    dangerous, dirty business. In the following pages we'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'witness how far twenty-first-century humanity is willing to go for these materials,
    whether that means digging a hole as deep as a canyon or scouring the bottom of
    the ocean to discover metals of concentrations richer than anything that exists
    on dry land.


    That brings us perhaps the most dangerous of all the myths that predominate the
    ethereal world—the idea that we are weaning ourselves off physical materials.
    Some economists point to data in the U.S. and UK showing that we are consuming
    ever fewer resources for each dollar or pound of income we generate. For most
    of human history our economic output closely tracked our exploitation of natural
    resources—and for that matter our energy use—in the past couple of decades these
    two lines have diverged: GDP kept on rising while our use of such resources plateaued.
    This, they say, is cast iron proof that we are getting “more from less.”[131]


    It is an appealing idea—especially with the world''s climate heating up everyone
    casting around for good news—but having just witnessed a sacred mountain being
    destroyed for something we didn''t exactly need, I was a little sceptical. Was
    there a chance, I wondered, that we were simply outsourcing this dirty stuff to
    a different place where we didn''t have to think about it? In short, to the Material
    World?


    I probed a little more, and discovered that while material consumption is certainly
    falling in post-industrial nations like the U.S. and UK, on the other side of
    the world, in the countries whence Americans and Britons import most of their
    goods, it is rising at a breakneck rate. Indeed, gold mines in Nevada are the
    barest fraction of it. We go to far more extraordinary lengths to extract copper
