    The honey limestone of Oxford these quadrangles, the brownstones of Brooklyn,
    the granite of Aberdeen: these buildings are'
  merge: -1
  pgno: 66
- img_proc: true
  md: 'made not of anonymous beige blocks but of the very stones found in nearby quarries.
