    category of mineral extraction, from sand and metals to oil and coal, falling.


    You don''t hear about all that much, or if you do it is primarily through a fossil
    fuel prism. For all sorts of understandable reasons there is plenty of attention
    given to the hydrocarbons we are still extracting. You will probably already know
    that we have, for decades, been mining enormous amounts of coal and oil from the
