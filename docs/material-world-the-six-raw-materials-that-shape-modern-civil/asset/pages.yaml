  md: 'get it out of the ground—or rather, how to get it out of the ground while turning
    a profit.[13]


    Enter the Guggenheims. The mining family had seen what Carnegie had achieved at
    iron mines in the Mesabi, by deploying enormous diggers to scrape out staggering
    quantities of ore. What if one could do the same thing with lower-grade metals
    like copper? With the help of an enterprising engineer called Daniel C. Jackling
    they began using steam shovels and enormous quantities of explosives to extract
    copper from low-grade ores in Bingham Canyon in Utah—the American mine that sometimes
    vies with Chuqui for the title of world’s biggest hole. But the reserves in Chile
    were even more promising, so the Guggenheims headed south and set up shop at Chuquicamata.


    It is a rarely told story: even as Henry Ford was mass producing cars in Detroit,
    the Guggenheims were quietly mining into a mass production activity—or “mass destruction,”
    as some have called it. They did so by deploying an old alchemists’ trick: converting
    unpromising rock into something that could earn a fortune. Chuqui was where the
    old era of mining—in which rocks were dug out manually and hand sorted—gave way
    to the new. The steam shovels that helped dig the Panama Canal were shipped down
    to Chile and put to work. Enormous mills were built to pulverise the rocks into
    dust, after which heavy copper particles were separated from the lighter quartz.[14]


    Eventually the Guggenheims sold the mine to the Anaconda Copper company to finance
    their fateful (some would say disastrous) shift into nitrate production, but the
    pace of mining only accelerated. The mountain went ground down into a plateau
    and then a canyon. “You cannot say that it’s lacking in beauty,” wrote the revolutionary
    Che Guevara when he visited in 1951,“but it is beauty without grace, imposing
    and glacial.”[15]


    But the thing to ask yourself when you think back to the mine is not merely how
    it got so deep but how anyone afford to dig it so deep? For as the miners dug
    further down the cost of extracting the ores rose, even as the grades of those
    ores fell. And they did. The twentieth century wore on the amount of copper in
    each new lump of rock here fell from 2.4 per cent in'
