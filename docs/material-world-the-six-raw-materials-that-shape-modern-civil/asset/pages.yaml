    this hidden valley in the wilds of Nevada.


    This is Tesla''s Gigafactory 1 (also known as Gigafactory Nevada); the world''s
    first gigafactory. There are a fair few other buildings that go by that name,
    Tesla these days; at the time of writing Tesla had four others besides—one in
    Shanghai, in Berlin, one in Texas and another in upstate New York, though Tesla
    still calls that one a gigafactory most others do not. The definition of a gigafactory
    is always vague, in large part because the term was essentially plucked out of
    the air a few years ago by the mercurial Tesla chief Elon Musk, and because his
    precise definition has shifted as time has gone by. These days, however, most
    people in the battery business seem to have converged on a broad definition: a
    gigafactory is any big manufacturing plant turning out a lot of batteries—and
    since last Tesla “gigafactory” makes solar panels, it doesn''t qualify.


    However, Gigafactory Nevada undeniably. Still only a third of its eventual planned
    size, this factory is so vast that its workers get from one section to another
    on bicycles and tricycles. The floorspace is given entirely to the production
    of cells, battery packs and electric motors, all of which are trucked off to Tesla’s
    Fremont, California, factory to be slotted into cars. That''s right: it turns
