  pgno: 67
- img_proc: true
  md: 'than 10,000 years. Bedouins in the south of Syria and northern Jordan created
    concrete-like structures in around 6500 BC. Most famously of all, the Romans used
    a form of concrete in many of their buildings. Concrete makes up the foundations
    of the Colosseum in Rome and, most spectacularly, the enormous dome of the Pantheon,
    still the world’s biggest unreinforced concrete dome.


    The original recipe for concrete was lost for hundreds of years after the fall
    of the Roman Empire, and interest in it was only reignited in the fifteenth century,
    when *On Architecture*, a manuscript by the Roman architect Vitruvius, was discovered.
    Vitruvius''s book was translated into French and then English, triggering great
    scientific quest to rediscover the secret of concrete. Throughout the eighteenth
    and nineteenth centuries, inventors and industrialists raced to come up with new
    concoctions that could replicate or even outdo the Roman recipe. Even, today scientists
    are still trying to reverse-engineer that Roman concoction, with researchers at
    MIT claiming fresh breakthroughs as recently as 2023. [17]


    But the recipe for the cement we use today was patented in 1824 by a man named
    Joseph Aspdin. He called it Portland cement, because its colour resembled the
    Portland stone quarried in Dorset. In truth, there were all sorts of vying recipes
    around the same time, and no one is quite whether Aspdin, a slightly shady character,
    really won the race or actually pioneered his blueprint from somebody else. [18]


    Still, inventing something is one thing; turning it into a success is another.
    Cement is ultimately a recipe, and in much the same way as the wrong proportions
