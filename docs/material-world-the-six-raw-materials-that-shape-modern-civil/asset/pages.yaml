  md: 'probably Thomas Hager''s *The Alchemy of Air*, which is also an excellent account
    of the tragic tale of Fritz Haber, whose inventions pockmark this book. Benjamin
    Labutat''s *When We Cease to Understand the World* is a semi-fictionalised account
    of various scientific revelations and might not tell you all much extra about
    high-pressure manufacturing techniques, its first chapter (which is 99 per cent
    accurate) is the most poetic account of Haber''s life that you''ll ever read.


    # Iron


    The iron and copper chapters leaned heavily on Martin Lynch''s *Mining in World
    History*, the ultimate account of the evolution of this trade. Vaclav Smil''s
    *Still the Iron Age* is good on the specifics of steelmaking while Roger Osborne''s
    *Iron, Steam & Money* will guide you through the story of the English industrial
    revolution. The story of Stalin''s obsession with iron, and the city it spawned,
    is famously told by Stephen Kotkin in *Magnetic Mountain*. The latter part of
    this chapter, especially the sections about the future of steel, benefited enormously
    from Julian Allwood and Jonathan Cullen''s book *Sustainable Materials: With Both
    Eyes Open*. You can download it for free from the Cambridge University site. Do
    so now. You won''t regret.


    # Copper


    Much of the early part of the copper chapter, about the electrical revolution,
    came from three books: the first volume of Robert Caro''s magisterial biography
    of Lyndon B. Johnson, *The Path to Power*, Thomas Parke Hughes'' *Networks of
    Power*, and *The Next Greatest Thing*, Richard Pence''s book, published by the
    National Rural Electric Cooperative Association, about the early days of rural
    power networks. There are plenty of biographies of Thomas Edison, the most recent
    of which was written by Edmund Morris, but for a page-turning account of the battle
    of the electrical systems—a battle decided in part by the scarcity of copper—you
    couldn''t do better than Empires of Light* by Jill Joneses. For more on copper
    itself, Suzanne and Barry Golding''s *Metals, Energy and Sustainability: The Story
    of Doctor Copper and'
  merge: -1
