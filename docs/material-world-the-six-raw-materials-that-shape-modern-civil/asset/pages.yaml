- img_proc: true
  md: 'the upshot that the packs being put together at Gigactory Nevada are so tightly
    closed with adhesives and fasteners that there is no easy way to disassemble them.
    So one of the hardest steps in the recycling process is actually the first one,
    pulling the battery pack apart, ideally without setting it on fire.


    The next step, however, is precisely that. Those little batteries are dropped
    into an enormous blast furnace where they are smelted down into a molten liquid.
    If you think this sounds a lot iron manufacture, you''re not entirely wrong, except
    here the molten liquid coming out of the furnace contains nickel, cobalt and copper
    with the slag drained away the lithium. Watching the batteries tumble into the
    top of the furnace is an unexpectedly satisfying experience, after each drop into
    the steaming mouth there is a sort of belch of yellow sparks and steam as it is
    digested. This belch, it turns out, is the energy stored up in that lithium, helping
    fire the furnace and melt the rest of the contents.


    As you watch the smelting and then the treating of these metals, what''s striking
    is how similar it all is to conventional mining. Umicore simply does with the
    lithium slag that comes out of its furnace much the same as Chinese refiners do
    with the spodumene came from Australia. Some of the other recycling start-ups
    say they can get by without this so-called pyrometurgical step but Umicore, which
    has been doing this longer than anyone else, says it''s the best option out there,
    and that it can recover more than 95 cent of the copper, cobalt and nickel coming
    in. The lithium numbers are even less impressive: over 50 cent and rising.


    But even a 95 per cent rate doesn''t add up to a circular economy. Consider a
    battery in an electric car, which might last ten years. Every ten years it must
    be tossed back in the furnace and recycled, and each time you have to add 5 per
    cent of fresh materials (or more, in the case of lithium). Extrapolate out a few
    decades and in a hundred years the battery has less than 60 per cent of those
    original raw materials left. The rest will have to come from fresh mining: more
    blasting, draining and refining.


    Even so, the future of mineral extraction could look very different to the past.
    In future, the bulk of our materials could come not from the mines'
