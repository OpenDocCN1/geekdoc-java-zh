  md: 'This is the first of the clues as to why Paul Ehrlich lost the bet; we became
    ever better at producing more stuff with less manpower. At the time of the Roman
    Empire the price of a tonne of pure copper was equivalent to roughly 40 years
    of the average wage. Forty years of work for a tonne of copper. By 1800 it had
    fallen to 6 years a tonne. In the following 200 years it dropped to 0.06 years
    per tonne. For Paul Gait, a polymathic mining investor from London, this measure
    of the “real price” of copper is the big story here. It is a productivity miracle,
    as impressive as Moore’s law for semiconductors—yet few people, even inside the
    sector, seem to be all aware of it.


    This brings us a recurrent theme of the Material World. As the amount of stuff
    we remove from the ground and turn into extraordinary continues to increase, the
    proportion of people needed to make this happen decreases. Even now now miners
    are coming up with new ways to automate their processes. The next thing in the
    business is making those mammoth trucks and diggers driverless, and controlling
    the whole operation from the site itself but, sometimes hundreds of miles away.
    While in Antofagasta, I visited a control centre where men and women in front
    of monitors wgled sticks controlling the various crushers and diggers at a copper
    mine more than a hundred miles away. The trucks beneath Chuquicamata’s pit in
    the new underground mine will be autonomous too.


    The happy-product of this automation is that fewer people working directly with
    heavy machinery means fewer potential accidents waiting to happen. With fewer
    of us working in their production, is it any surprise we know so little about
    what it takes to make these materials or turn them into products? Is it any surprise
    we take the Material World for granted?


    The second reason Ehrlich lost the bet is that we have come up with ever nifty
    ways to extract the metal from the rocks. Again, the story is there in front of
    your eyes at Chuqui: there are the great mills and flotation machines, which made
    it possible to mine these lower-grade rocks more than a century ago. The lead
    pads represent a hydrometallurgical revolution over recent decades, which means
    ores could be sprinkled with solution to remove'
