    # The Missing Link


    In his latest dig, Steve found clay bowls and burned stone implements that were
    far older than his previous finds; radiocarbon dating put them at nearly 6,000
    years old. They look like something you might wedge under a kettle as you heat
    it in the fire. That suggested an oven. He found traces of chlorine, a tell-tale
    sign of salt making. So far so interesting: while there was evidence of Neolithic
    salt making in central Europe, nothing along those lines had been discovered this
    far. Then his scans showed there were lipids: fatty deposits, which suggested
    people had been working with milk. As he robbed and down the field, his neck hunched
    slightly from years craning into excavation pits, he realised that this was the
    earliest sign of cheesemaking in Britain (you need a lot of salt to make a hard
    cheese like cheddar).


    But as he dug further did the ultimate revelation occur. Alongside that first
    oven he found a second and a third one; a series of ovens. Slowly it dawned on
    him that this was no ordinary settlement. This place did not fit the standard
    image of a small, informal community of subsistence farmers. This was a factory,
    a production line. Almost by accident, Steve uncovered one of the earliest pieces
    of evidence of the origin of manufacture and trade.


    This is, after all, the late Stone Age we''re talking about, a period when people
    in England had yet to harness metalworking and were only beginning to transition
    from hunter-gathering to agricultural life. The saltern—salt factory—here we was
    up and running, churning out salt and cheese and possibly other products too,
    a thousand years before Stonehenge’s standing stones were even erected.'
