  md: 'But that brings us to one of the great challenges facing the copper industry.
    As mines like Chuqui deeper and the easiest, richest ores get extracted, what
    happens next? With the world hungrier than it has ever been for this metal, for
    generators and motors and electric cars and wind turbines, is there a chance we
    may eventually run out of the stuff altogether?


    This, it auspices, is not a new question. It is one of the oldest known to man,
    and it is the inspiration for the most famous bet in economic history.


    # The Bet


    When economists discuss productivity—that most important of all economic forces—they
    like to talk about things such as computers and artificial intelligence. They
    jab their fingers at robots whizzing around Amazon distribution centers as proof
    of humankind’s ability to create more value out of less input. cite Moore’s law—that
    principle we encountered in Chapter 3—that each year or two goes by the transistor
    density in their silicon chips gets ever greater. Rarely, if ever, talk about
    holes in the ground like Chuquicamata.


    In part, this is because unlike computing or robots or even financial services,
    the end product provided by this mine has remained the same for decades. Today’s
    iPhones are vastly more powerful than the computers on board the Apollo landings
    that took man to the moon, or for that those in your laptop of a couple of years
    ago, but copper is still just cut. Yet the story of copper mining—human-made canyons
    and mountains, obliterated landscapes, massive trucks and all—is one of the great
    untold tales of economic endeavour. It is a productivity miracle, and uncomfortable
    though this story may be at times, it is nonetheless part of the explanation for
    why we enjoy the standard of living we have today.


    The first step in understanding this is to hear the story of a bet made in 1980
    between two men: Paul Ehrlich and Julian Simon. Ehrlich, an entomologist whose
    main expertise up until then had been the study of butterfly colonies, had become
    renowned as a kind of modern-day Nostradamus. A few years earlier, in 1968, he
    had written a bestseller called'
  merge: -1
  pgno: 230
- img_proc: true
  md: 'The Population Bomb, whose overarching thesis was encapsulated in the opening
    lines:


    The battle to feed all of humanity is over. In the 1970s and 1980s hundreds of
    millions of people will starve to death in spite of any crash programs embarked
    upon now. At this late dating nothing can prevent a substantial increase in the
    world death rate.[6]


    Ehrlich predicted that as billions more people consumed ever more resources, they
    would exhaust the raw materials upon which the planet depended. Soils would be
    degraded, forests denuded, pollution would become unbearable and billions would
    die as a result. Simon, an obscure economist at an unspectacular college, was
    astonished and disgusted. Surely, he thought, it wasn''t all bad news: the more
    people there were on the planet, the more minds there were to work on solutions
    for environmental problems. Surely we would innovate our way out of disaster?
    There was evidence to back this up. The synthetic ammonia developed by Fritz Haber
    and Carl Bosch meant that despite exhausting the guano of the Chincha Islands
    and much of the nitrates in the Chilean desert, humankind now had an essentially
    limitless supply of nitrogen to grow crops. The development of special breeds
    of wheat by Norman Borlaug helped launch a green revolution that was feeding the
    world. Sure, the planet is by definition finite, reasoned Simon, but its resources
    are far greater than we imagine. And if we ran out of one material wouldn''t we
    just invent or substitute another for it?[7]


    Now in some senses these two men were rehashing a very old debate, one that has
    raged since at least the era of ancient Greece. Confucius, Plato and Aristotle
    all expressed fears about humankind''s propensity to throw the natural world out
    of balance. In the late eighteenth century such worries were given a name and
    a framework by English economist Malthus, whose 1798 Essay on the Principle of
    Population warned that humans tended to multiply far faster than the ability of
    the land to produce enough food to feed them. We were, warned Malthus, stuck in
    a trap, and the bigger the population grew, the more likely we were to face famines,
    shortages and destruction.[8]'
