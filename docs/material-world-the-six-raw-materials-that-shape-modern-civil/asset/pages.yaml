    mud!)[13]'
  merge: -1
  pgno: 64
- img_proc: true
  md: 'Yet for all that it is traduced, looked down on or misunderstood (it most certainly
    is not mud), concrete, a mixture of sand, aggregate and cement, is nonetheless
    quite extraordinary. Perhaps the best place to start is to ask a question: if
    you were looking to improve the life of low-income families in poor parts of the
    developing world, which of the following would you provide for them? A bundle
    of cash, nutritional supplements or a bag of cement?


    You already know where this is heading, of course, but let me explain: one of
    the biggest problems for young children in poor countries is intestinal parasites,
    which can damage their health and keep them from school. These parasites usually
    live in faeces, which often gets brought into the family home on the bottom of
    someone''s feet. If that home is a shack with a dirt floor, the parasites can
    go undetected for longer and get transmitted to more children.


    A few years ago, Mexico began providing families with the cement to pave over
    dirt floors, with the consequence that parasitic infections dropped by 78 percent.
    The number of children with diarrhoea dropped by half; those with anaemia dropped
    by four-fifths. There were sorts of other happy outcomes too—children did better
    at school, their mothers became happier and less depressed. And all thanks to
    a cheap bag of cement.[14]


    The virtues of this material do not end there. Replacing dirt tracks with paved
    roads (i.e. concrete) has been shown to increase the wages of those who work near
    them by more than a quarter and also increases the proportion of children who
    earn in school.[15]


    We tend to underestimate the importance of the built world. Shelter is one of
    humanity’s primary needs, yet it is easy, when you have a roof over your head
    and a firm floor beneath you, to forget this. And when it comes to the built world,
    no other material has made such an enormous difference as quickly as cement.


    Rather than having to form and fire bricks before laying laboriously with mortar,
    you can simply pour concrete into a mould. A job that would hitherto taken days
    or weeks can be done in days with a fraction of the workforce. A couple of centuries
    ago, nearly all building was done with brick or timber; today concrete accounts
    for about 80 cent of all the materials we use in construction. Yet because concrete
    is unfashionable it is'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'usually overlooked in histories of technology in favour of other, more shiny
