  md: 'King Coal is a trove, featuring even more on the great hole of Chuquicamata.
    The Malthusian v. Cornucopian wager between Paul Ehrlich and Julian Simon is recounted
    in the appropriately named The Bet by Paul Sabin. There is a whole book waiting
    to be written about deep-sea mining, though much of course will depend on whether
    it becomes a commercial reality.


    # Oil


    One book towers over all others when it comes to the story of oil: Daniel Yergin''s
    The Prize. If you have any interest in modern history, let alone energy, and go
    and get a copy immediately. Greg Zuckerman''s The Crackers is an excellent account
    of the shale revolution while Vaclav Sim''s Natural Gas: Fuel for the 21st Century
    provides plenty more detail on methane, upon which we''re going to be reliant
    for delicates, regardless of the geopolitical difficulties. By far and away the
    best (perhaps the only) people explaining oil refining to “normal” are William
    Leflier Petroleum Refining in Nontechnical Language, without which I would never
    have been able to navigate any of those spaghetti junctions of pipes. Susan Freinkel''s
    Plastic: A Toxic Love Story is a good entry-point to the story of petrochemicals
    while William Reader''s two-volume history of ICI has more detail than you''ll
    ever need on the origin story of many of these extraordinary substances—not to
    mention on salt. If anyone would like to write a book on the subsequent demise
    of ICI, you have at least one ready reader here.


    # Lithium


    The coming decades will doubtless see many excellent books on lithium and battery
    chemicals at the time of writing two of the strongest Seth Fletcher''s Bottled
    Lightning and Steve LeVine''s The Powerhouse, though Henry Sanderson''s Volt Rush,
    published in 2022, provides even more detail and colour about the mining and materials
    we need to power the future. If you want to know more about Tesla and its rollercoaster
    ride to prominence, you could read Power Play by Tim Higgins. The final section
    of the lithium chapter dealt with Congo in passing, I need little excuse to'
  merge: -1
