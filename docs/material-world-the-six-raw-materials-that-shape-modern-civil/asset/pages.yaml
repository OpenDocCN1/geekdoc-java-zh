  md: '# Sweet and Sour, Light and Heavy


    The oil coming out of Ghawar, for instance, is sometimes called “Arabian light”:
    light because it is less viscous and dense than, say, heavy, gloopy Venezuelan
    Merey crude or Maya crude from Mexico. And since you can pump lighter oil out
    of the ground more easily, Saudi oil—at least the stuff they have onshore—needs
    considerably less work and expense to pump and refine more oils around the world.


    Oils can also be “sweet” or “sour”—a measure of sulphur content, which dates back
    to the early days when crude was mostly for indoor lighting. Too much sulphur
    in the kerosene and not only was there a noxious smell when it burned, it would
    also tarnish the silver in your lamp. Then the quickest way to test for this before
    burning was to give it a quick test—the more sulphur, the more sour it was—and
    this shorthand says. Broadly speaking, the less heavy and sour oil is, the less
    time and effort refineries have to put into processing it, so lighter and sweeter
    crudes fetch a higher price.


    Here in Wessel, the refiners pride themselves on being able to refine an unusually
    wide variety of oils—around a hundred different flavours around the world. The
    fact, for instance, that the European Union had just banned Russian crude imports
    was no problem: they simply switched to a blend from elsewhere instead. This is
    more of a challenge for most other refineries, which tend to be dealt with quite
    specific types of crude. That might sound like a technicality, but for an example
    of how it shapes the modern world, consider the current predicament in the United
    States.


    Most American refineries are set up for the kinds of heavy, sour crudes you get
    from Canada, Mexico and Venezuela. That made sense when it looked as if the U.S.
    was running out of domestic oil, but then came the shale oil revolution. American
    shale oil, it turns out, is typically light and high quality, meaning it is not
    best-suited for domestic refineries. The upshot is that while arithmetically America
    is energy independent—producing far more oil than it consumes—in practice it is
    anything but. It must keep sucking in'
