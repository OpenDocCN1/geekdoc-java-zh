    But about the fact that there are only about 30 to 40 years'' worth of copper
    reserves left in the world? This turns out, it is one of those statistics that
    is invariably misunderstood and misinterpreted, so it''s time for a brief lesson.
    When miners talk about the reserves they have left of a given material, that means
    everything they''ve got left in their mines or approved mine sites that could
    be economically extracted at any given moment. The reason we have about 30 to
    40 years'' worth of copper reserves left (42 at the time of writing) is not because
    that''s what''s left in the ground, but because that''s the kind of time horizon
    over which miners tend to make plans.[19]


    Yet so often a report will emerge attempting to extrapolate from these numbers
    that we are to run out of this metal—The Limits to Growth was only the most famous
    study to attempt something along those lines. Reports of imminent catastrophe
    tend to get far more attention than hard statistics about the real world, here''s
    a datap to keep in mind. Between 2010 and 2020 we met 207 million tonnes of copper
    around the world, but from falling, the total global reserves of copper grew by
