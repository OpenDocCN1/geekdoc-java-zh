    There are plenty of anecdotes one could choose to illustrate this, but few are
    fresh and acute as what happened in 2022 after Russia invaded Ukraine. In the
    following months it became evident how Europe and the U.S. still were to even
    a fractional fall in the supply of these hydrocarbons—Russia accounting for 12
    per cent of the world''s oil and 17 per cent of its gas. The global economy, which
    had been bouncing out of the COVID-19 downturn, suddenly lost momentum. And as
    oil and gas prices soared, much of the world plunged into what the media called
    a "cost of living crisis." Petrol stocks rose to unprecedented highs, along with
    the cost of natural gas in Europe. Inflation—a measure of wider prices, which
    everyone assumed was no longer sensitive to energy—leaped to the highest levels
    for all four decades.


    With the price of gasoline at U.S. pumps rising to over $5 a gallon, in July 2022
    Joe Biden visited Saudi Arabia and urged the kingdom to increase crude production.
    The journey was particularly humiliating for the U.S. president, who had campaigned
