    But today it is rapidly down on governments the world over that the control of
    these materials and processes matters more than ever. One of Joe Biden’s first
    acts upon becoming U.S. president was to sign an executive order on “America’s
    Supply Chains,” to examine where the U.S. was reliant on other countries. For
    semiconductors, it is the silicon chips whose manufacture'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'we will encounter in the following pages. For batteries, it is a collection
    of metals including cobalt, nickel, zinc and, most importantly of all, lithium.


    This book about the Material World is told through six materials: sand, salt,
    iron, copper, oil and lithium. Casting these materials as the protagonists might
    seem slightly perverse, given most stories of human progress come from our own
    perspective. Why do some countries thrive while others fail? Why did the industrial
    revolution take place in England rather than in Ethiopia? The fashionable view
    these days is that it comes down to a combination of history, happenstance and
    having the right kinds of institutions that allow people to innovate and thrive.
    But this has never been the full story, the secret of humankind''s success is
    about more than our DNA or our political institutions. Our destiny has invariably
    intertwined with what we have extracted from the earth and adapted to our purposes.


    While terms like the Stone, the Bronze and the Iron Age are typically used to
    refer to distant, forgotten eras, actually our reliance on physical tools and
    materials has exploded rather than diminishing. Given how much sand and rock we
    still blast from the planet, we are still firmly embedded in the Stone Age. Our
    need for steel and copper has multiplied in recent years. This, then, is also
    the Iron Age, not to mention the age of copper, salt, of oil and lithium.


    These six materials are the essential ingredients of the environment in which
    you are reading—the battery without your phone would cease to function, the concrete
    without your home''s foundations would crumble. These materials rarely feature
    in stories of human endeavour and innovation, or if they do it as an inert substance
    magically transformed by a brilliant inventor.


    But it is time now to give these materials their moment in the sun, and to tell
    our story from their perspective. We might, just about, be able to live without
    these six materials but we could not thrive without them. They are the substances
    for which there is, for the most part, no ideal substitute. They helped us build
    our world, and we would be thrown into chaos if we were to lose access to them—indeed,
    as we will discover, the collapse of some'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'civilisations and the triumph of others can be laid at the door of one or a
    number of the six.


    We will discover how the pursuit of these materials shaped geopolitical history
    and is beginning to shape its future. We will uncover the uncomfortable consequences
    for our environment of our insatiable appetite for these materials. At times you
    will find it unsettling experience—especially since we are all to some extent
    complicit, creating the demand for the raw materials we extract from the ground.
    You might be left with the impression that the best solution is for us all try
    to consume less and recycle more, and this, frankly, will be no bad thing.


    But towards the end of the book there is also a tantalising glimpse of something
    else: a world where, for the first time since the industrial revolution, we might
    be able to sustain ourselves without digging deeper into the earth and exploding
    mountains to satisfy our demand for commodities. We will never live in a truly
    dematerialised world; ever since humans picked up stone and fashioned it into
    tools we have been exploiting the earth and leaving our mark. We can shrink our
    footprint. In doing so we could help mitigate the rise of greenhouse gas emissions
    and confront climate change. The paradox, as you will see, is that getting to
    that promised land may involve digging and blasting more than we ever have before.


    In that promised land, we may no longer rely on fossil fuels, but for the time
    being we remain hopelessly dependent on them. That became abundantly in early
    2022 when Russia invaded Ukraine. The invasion pushed up European energy prices
    to record highs, which in turn fuelled the rise in the cost of living. The scale
    of the increase took economists by surprise—after all, in the ethereal world it
    is easy to convince ourselves that we have decoupled ourselves from grimy things
    like energy and raw materials. But one of the lessons you quickly learn when parachuted
    into the Material World is that in economics nearly everything comes back to energy—even
    the stuff you least expect. Fertilisers and salts, chemicals and plastics, food
    and drinks—they are all, to a greater or lesser extent, fossil fuel products.'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'The events in Ukraine may well speed our transition towards renewable energy—provided
    it doesn''t push the world back towards coal—but that will raise some fresh challenges.
    Even as we become less reliant on fossil fuels and petrostates like Russia, we
    will become more dependent on another more obscure suite of metals from other
    countries, with which we can build machines to provide us with clean energy. And
    since renewable energy is so much less-dense than fossil fuels or nuclear power,
    we will have to build many more structures to produce the same amount of energy.
    So it goes in the Material World.


    Why only six materials? Why only sand, salt, iron, copper, oil and lithium? After
    all, there are hundreds of elements, compounds and materials that play important
    roles in producing the products we rely on and the services we need in the modern
    world. Boron never featured on any pandemic preparedness plan, yet getting hold
    of enough proved central to the effort to produce and distribute a vaccine for
    COVID-19—no easy task given boron is most found in a handful of spots with volcanic
    activity and an arid climate. Nearly a third of the global reserves are in Turkey,
    with other supplies located in the deserts of California and the Far Eastern reaches
    of Russia.


    Moreover borates, the salts in which the element is found, have plenty of other
    uses: they are an ingredient in fertilisers, helping seed development and crop
    yield; they help preserve wood by protecting it from insects and fungal decay.
    When added to steel, boron can increase its strength; sprinkled into a swimming
    pool, borate salts can reduce the acidity of the water and prevent the build-up
    of algae.


    Or about tin, which is both a crucial component in electronic circuit boards and
    one of the earliest metals our ancestors learned to exploit? What about aluminium,
    the most common metal in the earth''s crust—albeit one we only learned to refine
    relatively recently? What about platinum and its sister metals such as palladium
    and rhodium—scarce, important ingredients in electrical components and catalytic
    converters? What about chromium, which plays an essential role in the manufacture
    of stainless steel, cobalt, or rare earth metals such as neodymium, which goes
    into precision magnets?'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'The line I have drawn is as follows: while the six materials that star in this
    book are not the only important substances in the world, it is hard to imagine
    modern civilisation without them. We can make batteries without cobalt. We can
    make headphones and electric motors without neodymium magnets—though they would
    be bigger and less efficient. The materials in this book are the very hardest
    to replace.


    Albert Einstein was once asked by a group of reporters to explain his theory of
    relativity. “I can explain it as follows,” he said. “It was formerly believed
    that if all material disappeared out of the universe, time and space would be
    left. According to the relativity theory, however, time and space would disappear
    with the things.” You might say the same thing about the Material World. These
    substances are the fabric of civilisation. Without them, normal life as we know
    it would disintegrate.[41]


    It is no accident, for instance, that we begin with sand, for this is the material
    from which humankind has made so much of our environment. It also provides us
    with a tour d’horizon of the Material World. Here, we have the world’s oldest
    manufactured product (glass) and one of our most advanced (semiconductors). While
    sand is the substance from which we make things, salt is a magical material we
    use to transform things, as well as a vital ingredient for our health and nourishment.
    The sections on iron and copper are sequenced because the story of iron is intertwined
    with the story of coal while copper is the medium of electricity. Putting them
    in this order means we cover the first and then the second energy transitions
    of the modern age: the third and fourth energy transitions are covered in the
    oil section, which actually features both oil and gas. Having spent much of the
    book considering the materials which helped bring us the industrial revolutions
    of centuries gone by, we finish with the material which promises to deliver the
    next one. Lithium is at the heart of the next energy transition—away from fossil
    fuels and towards renewable resources.


    I have taken a few liberties along the way. Purists may question my decision to
    lump oil and gas together in one section, or the fact that the salt section does
    not concern itself purely with sodium chloride, taking a detour'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'into a few other salts besides. And other materials—coal, for instance, and
    nitrogen-based fertilisers—make regular cameos along the way, even though they
    are not nominally among the six materials.


    Journeying through this world has been the single most fascinating and intellectually
    exhilarating experience of my career. But it was something else too: unexpectedly
    therapeutic. As I ventured deeper and researched the primal instincts of modern
    life, I began to feel ever slightly more connected with the world around me. Granted,
    I was no closer to being able to manufacture a car battery, a sheet of glass or
    a smartphone, but these objects were no longer complete mysteries to me. Having
    spent most of my life coseted in the ethereal world, blissfully ignorant about
    how we make and get things, I began to look out with fresh eyes. My hope is that
    this book inspires you to take a second look at the world we inhabit, where there
    is magic in everyday objects and wonder in simple substances.


    The six materials described in this book may not be scarce. They may not look
    or feel particularly sexy. They are not especially valuable in and of themselves.
    Yet they are the primary building blocks of our world. They have fuelled the prosperity
    of empires. They have helped us to build cities and tear them down. They have
    changed the climate and may, in time, help save it. These materials are the unsung
    heroes of the modern age, and it is time we heard their story.


    OceanofPDF.com'
