    the extent that most women in pre-electric rural America were noticeably stooped
    and bent by middle age. One calculation from 1886 found that a typical North Carolina
    housewife ended carrying a cumulative total of 36 tonnes of water 148 miles in
    a single year. And that was before counting the wood to be heaped into the house
    for the stove. Even boiling water was a serious undertaking; ironing even more
    so,[3]


    While today’s irons are mostly plastic with a lightweight steel or aluminium base,
    their pre-electric predecessors were heavy, solid blocks of iron. If you played
    the board game Monopoly a few years ago, before they replaced the iron piece with
    a cat, you would know what these things looked like. However, Monopoly playing
    pieces cannot replicate the feeling of holding one of these sad irons (sad being
