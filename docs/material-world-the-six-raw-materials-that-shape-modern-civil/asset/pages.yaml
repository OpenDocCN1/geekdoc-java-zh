    more comfortable lives than ever before. It has enabled us to fill the planet
    with more individuals than anyone could have imagined, with 8 billion brains and
    8 billion sets of hopes and dreams.


    We are also capable of living far more sustainable, cleaner lives, diminishing
    our destruction and contamination and living in closer harmony with the planet.
    We will do so not by eschewing or dismissing the Material World, but by embracing
    it and understanding it. These six substances helped us survive and thrive. They
    helped us make magic. They can do it again.


    SKIP NOTES


