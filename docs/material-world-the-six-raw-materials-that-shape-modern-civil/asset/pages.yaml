  md: 'In theory, polyethylene was the perfect substitute. The only problem, it turned
    out, was making it. Having discovered the substance, Fawcett and Gibson returned
    to the lab a day or two later and tried to re-create the experiment. There was
    a massive explosion, which blew up their equipment. They kept plugging away and
    the lab kept exploding, until, after too many fires, further work on polyethylene
    was suspended, pending the acquisition of hardier equipment.


    The trick, it turned out, was building the reaction chamber from a steel that
    was a little less brittle and a bit more ductile: that would allow a little flexibility
    in the face of the extraordinary pressures needed for the reaction. Eventually,
    by the late 1930s, ICI came up with a system for mass producing the plastic and
    the first purpose-built chunks of polyethylene were produced. When war broke shortly
    afterwards, this wonder substance was rapidly co-opted for the national effort.
    After Japan took control of Malaysia and all its rubber plantations, suddenly
