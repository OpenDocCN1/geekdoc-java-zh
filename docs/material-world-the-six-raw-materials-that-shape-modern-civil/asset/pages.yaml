    # Networks of Power


    The conventional story of electrification is mostly concerned with scientists
    like Humphry Davy, who invented the first electrical light—the arc light—or his
    protégé Michael Faraday. It Hans Christian Ørsted, who discovered electromagnetism,
    and Thomas Edison, who brought this power source to the masses. But this being
    the Material World, we need to turn the story on its head, for the rise of electricity
    was also a consequence of something far earlier and more practical: the availability
    of the right kind of copper in the right kind of quantities.


    Back in the mid-nineteenth century, when the U.S. began to string telegraph lines
    between its cities and were faced for cables to cross the Atlantic, the early
    wire producers could just about make do with the coppered out of the reverberatory
    furnaces in Swansea. But when the electrical age really began to take shape—with
    Edison and George Westinghouse building of the world''s first power stations in
    London and New York, equipped with large generators strung with copper—it soon
    became apparent that Welsh copper was a poor electrical conductor. The explanation
    comes back to the same problem early semiconductor manufacturers ran into: the
    less pure the atomic structure of your silicon or germanium wafer, the harder
    it is for electrons to pass through it. And so it went for copper wires.


    But it just so happened that at or more the same time as Edison was on the hunt
    for a better variety of copper, miners—some of them in the U.S., some in the UK—had
    come up with the solution. Instead of melting the copper ores to release the metal,
    they would electroyse them as well—dunking them in a solution and passing a current
    through it. And electrolytically refined copper was far purer: the only variety
    enough for the advanced electric motors and generators that would power the future.'
  merge: -1
  pgno: 220
- img_proc: true
  md: 'This new technique was the nail in the coffin for Swansea''s refineries, but
    it came precisely the right moment for the budding electricity industry. Just
    as it began to demand ultra-pure copper, the metals industry was in a position
    to deliver it. And the more electricity was generated by Edison and Westinghouse''s
    power stations such as the hydroelectric dam at Niagara Falls, the more current
    the refiners could pass through their electrolysis cells, allowing them to produce
    even more ultra-pure copper. This virtuous circle helped Edison and his fellow
    entrepreneurs to weave a string of electrical wires around American cities, and
    then the rest of the world. The dramatic fall in the price of light quantified
    by William Nordhaus wasn''t a consequence of ingenuity and enterprise but of materials
    too. Indeed, it was the first (but not the last) instance of the copper market
    defying the pessimists and managing to provide enough metal to satisfy global
    demand.[14][*]


    Not that this stopped Edison fretting about the price of copper. He was not the
    first to invent a lightbulb—that accolade probably goes to Joseph Swan, a scientist
