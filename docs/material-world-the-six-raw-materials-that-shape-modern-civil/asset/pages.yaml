  md: 'the copper rather than having to be thrown into expensive and polluting furnaces.
    Here is the electrowinning facility, where liquid concentrate is elektrolysed
    and turned into incredibly pure copper cathodes—an innovation of the 1980s. Obscuring
    mining techniques and mammoth trucks—these are what explain all those predictions
