  md: '# 1


    # Homo Faber


    This story begins with a bang.


    An explosion of such magnitude that it would have been audible in two, maybe three
    continents. Not that there was anyone around to hear it. Because this was roughly
    29 million years ago—long before the birth of Homo sapiens—somewhere near the
    modern-day border between Egypt and Libya.


    There in the Great Sand Sea desert a meteor pierced the sky and exploded. The
    force of the blast was truly cataclysmic, enough to create a fireball and a sound
    that rattled the sabre-toothed cats and roamed the other side of the Mediterranean.


    This meteor strike is less well-known than the one that is thought to have done
    for the dinosaurs 60 million years earlier. As far as we know it did not cause
    widespread extinctions. Scientists disagree on whether the meteor exploded mid-air
    or impact upon the ground and the search for a plausible crater is still ongoing.
    The African meteor nonetheless has a special significance, for it provides the
    most compelling explanation for a mystery story that has puzzled archaeologists
    and geologists for a century.


    Among the treasures discovered with the sarcophagus of Tutankham was a necklace
    depicting the sun god Ra. It was a stunning piece of jewellery, subtle but no
    less gleaming than the iconic gold funeral mask of the Egyptian boy king. This
    pectoral, as it is sometimes called, was encrusted with precious gems and metals:
    gold, silver, lapis lazuli, turquoise and carnelian. But at its centre was a beetle
    carved out of a translucent, canary-yellow stone. All the other gems were familiar
    but at the time of the tomb’s discovery, in the early twentieth century, no one
    had seen anything like this'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'yellow material before. Why? What was it? And where did it come from? Only
    when explorers ventured deep into the desert would they begin to find answers.


    The Great Sand Sea was so named by Gerhard Rohlfs, a German explorer who in 1873
    led an expedition westward into what in Pharaonic times was called the Land of
    the Dead. A hundred miles after he left the Dakhla Oasis, weeks after setting
    eyes on any trace of human life, he suddenly encountered an impassable barrier.


    “Sand dunes, and sand beyond, truly an ocean of sand,” he wrote. He tried to cross
    the dunes: impossible, too high, the sand too underfoot, even for the camels.
    He tried to go around them: impossible, for they stretched north and south as
    far as the eye could see. He marched his team alongside the dunes for weeks, to
    no avail. Eventually he decided to turn back north towards Siwa, the nearest oasis.
    He and his team wrote a message, put it in a bottle in case they didn''t survive
    the return journey, and built a cairn of rocks over it. If you travel to the Great
    Sand Sea and pass by the cairn today it is customary to leave your own message
    in a bottle.


    Rohlfs barely survived the return journey. He would surely have perished, in fact,
    had it not been for an extraordinary stroke of luck. For while returning across
    one of the world’s driest regions, where parts can go without rain for decades,
    the heavens unexpectedly opened and his crew were able to replenish their water
    supplies. Weeks later this fortunate, emaciated German and his companions reached
    safety. They brought with them such dismal testimony that no one else bothered
    attempting the journey for more than fifty years.


    Glance at satellite images of this territory and you will soon see what he encountered;
    long, parallel dunes running north to south, separated by flat corridors straight
    as a Roman road. These perpendicular formations, a product of the prevailing winds,
    are called seif dunes—after the Arabic word for “sword”—and some run for nearly
    a hundred miles. There is a uniformity, a kind of symmetry to them. Except that
    by the time you’ve seen the images they are already out of date.'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'The dunes are constantly on the move, devouring anything that stands in their
    way. Herodotus once wrote of a Persian prince who sent an army into this desert.
    Not long after they entered the Great Sand Sea they were engulfed by a sandstorm
    and never seen again. Every so often an archaeologist surfaces with supposed evidence
    of the lost army.


    Surveying these dunes from above fails to convey the feeling of standing at their
    feet. It is not for nothing that most of the early explorers described these formations
    as living creatures.


    “They grow,” wrote Ralph Bagnold, a Briton who explored the Sahara in the 1930s.
    “Some…can live independently, keep their shape moving from place to place, and
    can breed.”[1]


    Sometimes the seif dunes collapse under escarpments and form into crescent dunes—barchans,
    as they are known. Sometimes one seif can mount another, and together they form
    a whaleback, or mega-barchan.


    The way these grains interact with each other, the wind and their surroundings
    seems mysterious and unpredictable, but actually the physics of sand is just incredibly
    complex. Having encountered these dunes as he traversed the deserts, Bagnold devoted
    the rest of his life to trying to understand them.


    Anyone who studies sand dunes labours under Bagnold’s long shadow. He became so
    influential that when NASA was attempting to understand the dunes on Mars it was
    to Bagnold’s books that they turned. Indeed, the Curiosity rover you may recall
    that it spent two years exploring Mars’s Bagnold Dunes.


    Bagnold and a band of fellow explorers were the first to traverse this desert
    in the early thirties, finishing the journey Rohls had failed to complete half
    century earlier. They navigated the seifs in motor vehicles, letting the air out
    of the tyres of their Model A Fords to drive and surf the loose sand of the dunes.
    One of Bagnold’s colleagues, an Irishman called Pat Clayton, was crossing the
    lip of one dune in December 1932 when he suddenly heard a crunching sound beneath
    his wheels. He got out to investigate and discovered that the desert was covered
    in great sheets of yellow glass.'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'Only in the late 1990s did scientists finally confirm that the canary-yellow
    beetle at the heart of Tutankhamen''s necklace was carved from the very same material
    Pat Clayton had crunched over 500 miles away in the Great Sand Sea. The Egyptian
    king was buried in the Valley of the Gods with a precious stone plucked from the
    Land of the Dead. This luminous stone was not forged like diamonds, sapphires
    and other gems over thousands of years of heat and pressure within the earth''s
    crust. Instead, it was created in the blink of an eye by a falling star. That
    meteor 29 million years ago had turned the sand into a kind of glass—Libyan desert
    glass.


    There are other forms of glass that occur in nature. Obsidian, a jet-black stone
    used by our prehistoric ancestors as to, is actually a kind of volcanic glass
    formed by magma as it rapidly cools into stone. There are tektites: glassy pebbles
    created by meteorites or comets smashing into the earth''s surface, bits of which
    fuse into shiny stones. There are fugurites: gnarly, hollow tubes you sometimes
    find on a beach or after a lightning strike. But what distinguishes the glass
    Clayton found in the desert was that it was utterly, almost unbelievably, pure.


    The main ingredient in most sands is silica—silicon dioxide, or as it sometimes
    known, quartz. And since glass is, for want of a better phrase, melted sand, silica
    is also the primary ingredient in glass. But that silica content can vary significantly.
    The glasses we drink from or in our window panes typically have about 70 per silica.
    The silica content of obsidian and of most tektites is generally between 65 per
    cent and 80 per cent. The silica content of Libyan desert glass, on the other
    hand, is a staggering 98 per cent. Not only did this make it the purest naturally
    occurring glass to have been discovered anywhere, it was purer than anything humankind
    could create—for the time being at least.[2]


    Sand is the great enigma of the Material World.


    There is no shortage of the stuff. Heave your way to the top of those dunes and
    look out over the Great Sand Sea and all you can see is an'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'unending vista of silicon. Silicon in the grains beneath your feet, silicon
    in the floors of the corridors that separate the seifs, silicon in the Palaeozoic
    sandstones of the Gilf Kebir on the horizon. After oxygen, which attaches itself
    to pretty much everything, silicon is comfortably the most common element in the
    earth''s crust.


    Given this ubiquity, it''s perhaps surprising we''ve found so many different things
    to do with it. We dig and quarry and blast out of the earth than any other material.
    The economic enigma of sand is that in certain guises it is very precious, so
    much that the European Union deems its purest, most elemental forms a critical
    raw material.


    The earth is made of sand, yet we frequently hear stories of desperate shortages.
    In some corners of the world there are sand mafias who fight and kill for control
    of grains of silicon. Under cover of night, renegade crews dig up beaches and
    riverbeds and smuggle and trade the sand on the black market.


    Some sands are prized for their value, some for their beauty, some for the shape
    of their grains, others for their purity. In Sardinia the authorities have started
    fining people for removing the iconic white sand from its beaches. At Cleopatra
    Beach, a bay on an island off the Anatolian coast of Turkey, the unusually white
    sand is so prized that you must wash it from your feet before leaving, so you
    do not inadvertently take a single grain with you. In parts of Asia, river ecosystems
    are under threat because of excessive dredging as attempt to satisfy a seemingly
    unending appetite for building sand and aggregates. Lives have been ruined and
    the environment threatened, all in the pursuit of something that appears to be
    everywhere.


    Except that saying it''s everywhere is to miss the point, for there are many different
    types of sand, each with their own unique characteristics. While most sands are
    primarily silica, some, especially the beautiful white ones on tropical beaches,
    composed mainly of something else: the ground-down remains of seashells and corals.
    Indeed, if you''re on a pristine beach in the Caribbean or Hawaii, the chances
    are that your feet are probably sinking intofish excrement: the fish eat the corals,
    extract the nutrients, and poop the remaining calcium carbonate onto the seabed.
    For the most part, the'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'whiter and warmer the beach, the more likely it is to come out of the bottom
    of a parrotfish.


    The question of what sand is made from is of more than passing consequence. Geologists
    have something called the Uden–Wentworth scale, which dictates that any solid,
    loose grain of a given size (strictly speaking somewhere between 0.0625mm and
    2mm) is a type of sand. Paradoxically, this means that sand and salt are actually
    sand. But for our cases let''s ignore the Uden–Wentworth scale and focus primarily
    on the 70 per cent of sands that are mostly made of silica.


    The silica content of sand matters because that ultimately determines what you
    can do with it. Some sands, including those in the Great Sand Sea, are relatively
    rich in silica—which is part of the explanation for why Libyan desert glass is
    pure. But much of the sand you or tread on has too little silica and too many
    impurities to be turned into clear glass, or for that matter, silicon chips. Still:
    part of what sand is enigmatic and that in the world no two handful are alike.


    Silicon is a chemical enigma too, metallic yet quite metal, conductive but only
    on its own terms. It can be made into a polymer, a plastic. Sand can be gloriously
    soft to touch but each grain is mighty hard, its astounding strength helping to
    explain why it is used for the physical foundations of the twenty-first-century
    world. It is at once the basis of the very oldest and the very newest products
    humankind has learned how to manufacture. It bookends civilisation.


    Sand, you see, is the most ancient and the most modern substance of all. It was
    our transformation of silicon into beads and cups and jewellery that marked the
    beginning of the era of Homo faber—man manufacturer. Yet this same substance can
    be used to create the smartphones and smart weaponry of the twenty-first century.


    Here on the beach and in the desert we have our first protagonist. For a long
    time, chemists sought the key to alchemy—how to turn lead and other unpromising
    metals into gold. The quest failed, or at least says the conventional wisdom.
    But hang on. Today we routinely turn silicon into'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'products that are quite literally worth their weight in gold. We forge wondrous
    products from golden sand.


    Given we have learned how to transform a cheap, inert substance into something
    so valuable, perhaps we shouldn''t be shocked that these skills become so highly
    prized. When trade have erupted, shang has often been at the very centre of them.
    China''s ability to manufacture its own silicon chips to the same extraordinary
    levels of intricacy as those being made in Taiwan and South Korea is a frequent
    concern in Washington these days. Will it develop quantum computers faster and
    with more success than those in the United States?


    Since Beijing has surpassed its rivals in many so other economic fields in recent
    years, Chinese silicon supremacy might feel inevitable, but at least the time
    of writing, we are nowhere there yet. China may be able to dominate global steel,
    construction, battery and smartphone manufacturing, and even, more lately, social
    media, a world-beating semiconductor industry? Not yet.


    Why? In part the process of turning sand into silicon chips is, as we shall see
    later in this section, among the most extraordinary feats of engineering. Indeed,
    many of the techniques employed to create transistors so small they are measured
    in atoms sound so far-fetched that even someone with an overactive imagination
    would struggle to envisage them. And it is in part because Western leaders will
    stop at nothing to prevent China from gaining supremacy in this technology. They
    are determined to prevent the intellectual property property, the tools of twenty-first-century
    alchemy, from escaping. Still, as contemporary as all this sound, shang has always
    been at the heart of cutting-edge technology, long before the era of silicon chips.


    For centuries governments viewed with each other to control another leading technology
    derived from sand, a technology that endowed those using it with bionic powers.
    That technology was glass. Just as today''s governments attempt to build their
    semiconductor industries and electric car sectors, their predecessors pulled every
    lever they could, from industrial strategy to industrial subteruge, to control
    the trade in glass. In the same way as scientists are today prevented from smuggling
    their secrets from the West'
  merge: -1
  pgno: 34
- img_proc: true
