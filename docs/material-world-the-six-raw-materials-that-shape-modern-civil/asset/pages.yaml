  md: 'shipped to the Baltic, Norway and even up to the Shetland Islands, where it
    was used to salt cod.


    Even in the U.S., many modern roads are built atop the paths beaten by herds of
    bison and other animals as they walked from one brine spring to another. Towns
    often sprang up near such places. Syracuse in upstate New York rapidly became
    one of the most important cities in America after settlers discovered brine springs
    in nearby Onondaga.


    All around the world, we are still walking salt routes—the SS4 autostrada cuts
    across Italy from Rome to Porto d''Ascoli is in fact built on top of the ancient
    Roman Via Salaria—the salt road. That the road ends up at the Adriatic is no coincidence:
    for thousands of years, this was one of the great salt-making hubs. Since at least
    the medieval era, salt from Venice was transported to Modena and Parma and other
    regions on the banks of the River Po, where it was used in the manufacture of
    ham and cheese. A wheel of Parmigiano Reggiano tastes as it does because it is
    dunked in a salty brine solution for 20 days before being left to mature for a
    year, during which the salt gradually settles to its core. Parma ham, prosciutto,
    salami: they were all products not just of meat but of salt, sourced most typically
    from Genoa and Venice.


    That Venice''s story is inextricably bound up with salt might seem counterintuitive:
    wasn''t famous for more exotic business, such as the trade of spices with Asia?
    Well, yes, but before that, and for that afterwards Venice, was a salt economy.
    As early as AD 523 when the Ostrogoths ruled the Western Roman Empire, their administrator
    Cassiodorius wrote to the Venetians that:


    > All your energies are spent on your salt-fields; in indeed lies their prosperity,
    and your power to purchase those things which you have not. For though there may
    be men who have little need of gold, yet one who live does not salt.


    In these early centuries the Venetians controlled much of the salt production
