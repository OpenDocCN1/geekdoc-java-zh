    Still, for a tangible illustration of this mineral abundance, consider the situation
    with cobalt—one of the world''s scarcer metals and a critical ingredient in modern
    rechargeable batteries (not to mention steel alloys). The vast majority of the
    world''s cobalt reserves are to be found in one of the world''s most unstable
