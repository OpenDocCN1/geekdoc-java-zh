    to make salt. You can evaporate from the sea, a painstaking process the Neolithic
    people in Boulby were carrying out at scale thousands of years ago. You can dig
    salt out from the ground, as happens in perhaps the oldest operational mine in
    the world: the Khewra salt mine in Pakistan, which is said to date back to the
