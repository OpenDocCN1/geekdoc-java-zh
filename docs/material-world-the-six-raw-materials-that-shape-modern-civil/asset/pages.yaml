    The answer, it turns out, is the Chuquicamata dam, where waste from the refining
    process is piped in and deposited. It is about as enormous as you would probably
    imagine, given it holds decades’ worth of muck from the biggest copper mine on
    the planet. The formal name for this monumental dump is Talabre, a reminder that
    once upon a time this used to be a salt lake by the same name. These days all
    salt is covered in a greyish sludge of mud, rich in molybdenum and arsenic, covering
    an area about the size of Manhattan.[^4]


    Alarming as this might sound, it is a significant improvement on how things used
    to be done. Once upon a time, the wastewater from the mines in the Atacama was
    simply left to flow into nearby valleys and canals down to the sea. The water
    on the coast is still contaminated from those decades of untramelled pollution.
    In the port of Chañar, some 220 megatons of waste material from copper mines were
    dumped and accumulated in the bay, creating an artificial beach stretching 10
    kilometres (6 miles) across the coastline, killing much of the local wildlife.
    While the dumping stopped following judicial intervention in 1989, a recent study
    found elevated levels of nickel, lead and arsenic in the urine of local men.[^5]


    Today, locals in Calama complain that their water and their air is still tainted
    by arsenic. The copper miners respond that the arsenic comes from the ground and
    not their operations, which is strictly speaking true, except it glosses over
    the fact that it were not for all this excavation much of the poisonous element
    would stay under the ground. When in Calama I spoke to a local pediatrician who
    said had noticed elevated levels of respiratory and allergic health problems among
    children—something he thought was due to the high particulate levels in the air.
    In a town where nearly everyone owes their living to copper mining—even the sex
