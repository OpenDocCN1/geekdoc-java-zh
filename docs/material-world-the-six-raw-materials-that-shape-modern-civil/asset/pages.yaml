    But arguably the single most important figure in the history of concrete is someone
    remembered for many innovations but not this one: Thomas Edison.'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'Edison—we will encounter again later in the book—often features as a funny
    footnote in accounts of concrete because he came up with the delightful wheeze
    of building entire homes out of it, including concrete furniture, concrete beds
    and concrete phonographs. Yet his contribution was far more significant than is
    widely understood today, for it was Edison who perfected the mass production of
    concrete.


    To see why, it is worth taking a visit to a modern cement plant, in my case the
    one that sits outside Rugby, in England''s West Midlands. There has been a cement
    plant here since 1865. Back in the Victorian era, when it made the cement that
    helped build industrial Britain, the mills were fed with stone from the neighbouring
    limestone quarries. That limestone is now pretty much exhausted and the chalks
    come down a 57-mile pipeline, from a quarry in Bedfordshire.


    At the centre of the plant—indeed the heart of the cement business—is the kiln.
    But this is not a bottle-shaped brick like the pottery furnaces still preserved
    in Stoke-on-Trent, home of Britain''s ceramic industry. When I first looked around
    the site I missed it altogether, for a rotary kiln is not a chimney but an enormous
    metallic tube that passes from one hanger to another. Watching it turn is an unexpectedly
    hypnotic experience. There is no fire to be anywhere, no smoke or noise save for
    the hum of machinery and the occasional blast of air to keep the raw ingredients
    moving, you can see the heat haze above it and, when it rains, the water turns
    instantly to steam as it hits the kiln''s surface.


    The kiln must keep rotating 24 hours a day, for if it stopped for any extended
    period the terrific heat inside would begin to melt the structure, which would
    sag and then fail. This, said the plant''s manager, is his greatest fear, the
    greatest fear of any cement plant manager. So the kiln keeps rolling, the ingredients
    keep passing down it, tumbling until they have turned into clinker—a kind of dark
    nugget, which is then ground down into cement, the glue that bonds the Material
    World together.


    Edison''s breakthrough was to build the world''s longest kiln, all of 150 feet,
    which is not much shorter than the one rotating in Rugby. He adopted the German
    improvements to the recipe, added a few steps of his and'
  merge: -1
  pgno: 69
- img_proc: true
  md: 'patented the system. It would prove one of his most lucrative inventions and,
    based on its impact on the world, you could make a strong case that it was also
    one of his most important. Yet this being concrete—boring, unfashionable concrete—at
    the time of writing it doesn''t even feature in Edison’s Wikipedia page.[19]


    What Edison brought to the cement industry was something important: scale. Using
    his enormous rotary kiln, plants could churn out thousand barrels of cement a
    day—more than enough to cover the costs of the fuel and the rocks needed to make
    it. The ability to produce vast quantities of a given substance might capture
    the imagination, but it is another of the recurring themes one encounters as one
    tours the Material World. From concrete to copper, from iron to lithium, it is
    our ability not merely to invent the future but to mass produce and disseminate
    these materials that has enhanced lives and lifted millions from poverty. To put
    it another way, reason cement has changed the world is not merely because it has
    magical qualities but because it is cheap and it is everywhere.


    # The Darker Side of Concrete


    To say that concrete is everywhere is hardly an exaggeration. Despite the fact
    that we only began producing this mixture of sand, aggregates and cement just
    over a century ago, there are now more than 80 tonnes of concrete on this planet
    for every person alive—around 650 gigatonnes in total. To put that slightly meaningless
    number into perspective, it is considerably more than the combined weight of every
    single living thing on the planet: every cow, every tree, every human, animal,
    bacterium and single-celled organism. Each year we produce enough concrete around
    the world to cover the entire landmass of England.[20]


    For a sense of what this means in practice, consider Tianjin, a megacity of 15
    million people that sprawl all the way from the coastline to touching distance
