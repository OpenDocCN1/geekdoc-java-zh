    or so, the power began to peter out.


    So about all those areas that weren''t within a mile of a power station? The answer
    was provided by Westinghouse and Nikola Tesla, who pioneered the use of alternating
    currents. While the current in Edison''s wires'
  merge: -1
  pgno: 221
- img_proc: true
  md: 'would travel in one direction, like water down a river, the current in Westinghouse
