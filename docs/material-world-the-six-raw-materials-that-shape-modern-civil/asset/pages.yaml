    is only the start of it, for what makes sodium chloride an important part of the
    Material World and cements its place alongside the other five materials in this
    book is that today salt is the bedrock for the chemicals and pharmaceuticals industry.
    While a fraction of the brine pumped out from under the ground here in Cheshire
