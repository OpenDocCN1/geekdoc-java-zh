    # # The Longest Journey


    There are many extraordinary journeys in the natural world. The European eel''s
    long, mysterious migration to the Sargasso Sea; the pole-to-pole journey of the
    Arctic tern, which can cover a million and a half miles in its lifetime; the rush
    of king salmon hundreds of miles upstream, up waterfalls, into tearing river torrents.


    Journeys through the Material World are no less awe inspiring, especially when
    viewed through the dimension of time. Consider the humble sand grain, a tiny speck
    of quartz. Over millions of years—sometimes billions—it has witnessed the passage
    of deep time. It has been rock and then grain and then rock again. It has been
    compacted into stone, pressed under the earth for hundreds of millions of years
    before freed by the erosion of a river or the wind. It has been swirled downstream
    into estuaries and beachheads, tossed and turned in the tide, packed and compressed
    back into rock. Ground down by glaciers, tipped through channels and waterfalls,
    this grain has dormant being picked up for the cycle to begin all again.


    It is thought that about half of all sand grains have been through six cycles
    like these, from rock to sand to rock again. The rocks may wear down through the
    ages but the sand grain remains, on its onward voyage. It is perhaps the second
    most extraordinary journey in the Material World.


    Why only second? Because, remarkable as this journey is, it pales in comparison
    with another epic odyssey. This journey begins with a piece of rock pulled from
    the ground; it ends in your pocket, having been transformed into one of the most
    technologically advanced pieces of machinery in existence. Along the way it involves
    two, maybe three or more'
