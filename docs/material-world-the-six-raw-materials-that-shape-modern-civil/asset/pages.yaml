    If you have visited an artisan salt maker you will know what I mean. On the Mediterranean
    islands of Ibiza and Mallorca they have been making it since the Phoenician era.
    They guide the tide through channels and sluice gates to ponds and pools where
    it is warmed under the sun, leaving an ever-more concentrated brine solution from
    which, eventually, salt crystals can be scraped away. These crystals—leur de sel
    as they call them in France, *flor de sal* in Spain—are the most prized of all
    salts, a delicate, flaky variety that chefs these days like to sprinkle over their
    burrata and mozzarella.


    The reason *leur de sel* is so expensive is much the same as the reason salt was
    long one of the most precious substances: doing it takes time and energy—in this
