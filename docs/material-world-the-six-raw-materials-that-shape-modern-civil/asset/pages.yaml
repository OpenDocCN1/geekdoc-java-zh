  md: 'This story is intertwined with another one—the story of the industrial revolution.
    Quite why the revolution occurred in the UK rather than elsewhere in Europe, or
    for that matter Asia or the Americas, is still debated today. There are all sorts
    of probable factors: demographics, geography, the political and institutional
    backdrop, the nature of the labour market, the steady accumulation of previous
    innovations, not to mention these building environmental pressures as manufacturers
    searched eagerly for a cheaper, more abundant form of fuel. Britain was also blessed
    with an unusual geology. It is hard to find many other countries as small as the
    UK with quite such a rich mix of minerals, with plentiful iron and limestone through
    to obscure metals like tin, copper and silica sand. Most obviously, there was
    a seemingly limitless supply of coal—rich anthracite, mostly—near the surface
    in much of central Scotland, the north-east of England, Yorkshire, the Midlands,
    Kent, Gloucestershire and the valleys of South Wales.


    So as fears grew about wood supply from the sixteenth century onwards, these early
    entrepreneurs began to experiment. Brewers and dyers, brickmakers and potters,
    smelters and glassmakers: as the seventeenth century, they began to use coal.
    This was not without its problems. While a pure, high-carbon fuel like charcoal
    burned cleanly, coal was dirty and smelly. It blackened many of the bricks made
    with it and introduced a noxious stink to beers brewed with it.


    But over time, industrialists adapted. A few breweries worked out that if they
    pre-baked the coal, as you did with wood to make charcoal, ended up with a purer
    form of coal with fewer the nasty contaminants—coke, as it became known. And coke
    and coal were rapidly adopted elsewhere: mandated for the manufacture of glass
    and widely used by the salt makers of the north-east and of Cheshire. Coal was
    shipped down from Newcastle and Sunderland to London to fuel breweries, and the
    colliers would return north loaded with silica sand for the glass industry on
    Tyneside, not to mention other, unconventional cargoes.


    One burgeoning business in those days was the production of alum—a chemical that
    would help make clothes dyes colourfast. Rocks containing the'
