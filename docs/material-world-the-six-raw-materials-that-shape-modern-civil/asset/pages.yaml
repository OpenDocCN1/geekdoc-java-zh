  md: 'When I visited in 2022 I was lucky, if that is the word, to witness one of
    the blasts as hundreds more tonnes of rock were exploded at the very bottom of
    the pit. Even from the top of the mine more than a kilometre up, the shockwave
    was palpable, the noise shattering—far louder than the I witnessed at the Cortez
    mine. The entire artificial valley was so consumed in a thick cloud of acrid condite.
    Then the rubble was loaded into trucks, which chugged their way slowly up the
    side of the mine, as they do 24 hours a day, every day of the year. A small fraction
    of it was destined to become copper or concentrate, the rest would end up on the
    torta consuming the ghost town of Chuquiqui.


    However, these mountains of waste rock are only the most visible of the environmental
    consequences of this mine. It, together with many other mines in this extreme
    environment, is also under scrutiny for another reason. In the world’s driest
    desert, why is so much water used by those who are pulling rocks out of the ground?
    Mining and processing ores at this kind of scale demands volumes of water, and
    the more rock you process the more water you need. Much of this water is sprinkled
    on enormous piles of crushed ore, which sit atop plastic sheeting and are drenched
    in a dilute acidic solution. It is heap leaching, similar to what they do at the
    Cortez gold mine, only—this being copper—the scale is astounding. Squint a bit
    and you might think the leach pads are a form of hydroponic agriculture, since
    they look like enormous fields cross-crossed with irrigation holes. But no; the
    water here is helping extract the copper from the rocks, in a solution which is
    drained out at the bottom and sent off to the next stage in the refinery. The
    earth is watered not to breathe life into it but to leach reaches of.


    Over time mines like this are attempting to reduce their water consumption. Some
    mines are piping in seawater rather draining local rivers. But alongside the carbon
    footprint and the water footprint, there is another footprint that is even harder
    to ignore. Drive out of Chuquicamata, down the hill, past the neighbouring Ministro
    Hales mine (technically a separate, small operation but already producing enough
    copper to rival the big hole), go past Calama and take the road towards San Pedro.
    For miles'
