- img_proc: true
  md: 'aluminium the rate is 42–70 per cent; for cobalt 68 per cent; for copper 43–53
    per cent. For lithium it is less than 1 per cent.[15]


    The concept of the “circular economy” holds that we should try increasingly to
    treat waste as a kind of resource in and of itself. The twentieth century was
    the era of planned obsolescence, where first motorists and then consumers of all
    stripes were encouraged to upgrade their products as often as possible, the coming
    era is, we are told, one where the priority is to dispense with disposal. Recycling
    goes from being a sideshow to the main show. Everything becomes about closing
    loops.


    Batteries are only one part of this story. We will need to get better at recycling
    wind turbine blades, which are mostly thrown away at present, sometimes shredded
    and used in concrete, because they are formed of a thermoset resin which cannot
    be melted down and re-formed. We will need to work out how to recycle solar panels
    and wiring and circuitry, and all the other bits and pieces of the Material World.
    Yet batteries are a useful example for few reasons. The first is that they contain
    minerals we would rather mine of loss in future.


    In the case of cobalt comes back to the DRC; since mining conditions are brutal
    and so much of the world’s supply is bound in a single place, there are both ethical
    and strategic reasons to try to find alternative sources. And so many people remain
    understandably nervous over deep-sea mining, there are, shall we say, big questions
    remaining about that. And with similar issues surrounding the environmental impact
    of lithium extraction, not to mention nickel, car manufacturers have become increasingly
    focused in recent years on where their minerals come from. Many of them have signed
    up to a new scheme called the Global Battery Alliance, which aims to create a
    kind of “passport” that would document where the minerals come from before they
    or the car they’re in reach a showroom. In one sense this feels like unfamiliar
    territory, though you can also hear distinct echoes of Henry Ford’s obsession
    with where his steel would come from.


    The second reason it makes sense to ponder batteries is that lithium-ion cell
    production is such a new industry that there is a chance of closing some'
  merge: -1
  pgno: 353
- img_proc: true
  md: 'of loops from the very beginning. This would be in stark contrast to most other
    industrial processes, for which waste is sometimes a distant afterthought. Mercury
