- img_proc: true
  md: 'There are some causes for optimism, for in much of the rich world the demand
    for iron ore and virgin, newly blast-furnnaced steel is diminishing. The per capita
    steel quotient in the U.S. and the UK has been more or less flat for a few decades,
    implying that at some point, when a society has enough hospitals and railway tracks,
    it reaches saturation. At some point, maybe Jevons''s paradox will no longer apply
    and we really will have enough.


    And steel is relatively easily recycled (mostly iron, most steels are magnetic
    so sorting them from other is pretty straightforward) there is no reason why,
    after the metal has served us for a few decades, our girders and plate couldn''t
    be recycled and re-used. Indeed, this is precisely where an ever-greater fraction
    of our steel already comes from. There is the chunk of scrap that goes into the
    blast furnace, of course, but more of our steel comes these days from what we
    are known as “mini-mills,” an entirely different way of producing steel, melting
    down scrap in electric furnaces. More than two-thirds of America''s steel is now
    made from scrap, as also skyscrapers and cars are reconstructed into new bar and
    plate.[8]


    Squint a little and you might envisage a future where rich countries subs almost
    entirely on recycled steel. Every 30 or 40 years, old buildings and infrastructure
    could be dismantled, the steel broken, melted in electric arc furnaces and reintroduced
    as liquid steel. The era of the blast furnace and Bessemer converter, that period
    birthed the industrial revolution, would give way to the “scrap age. This would
    be a seismic shift but we are slowly creeping towards it. Based on current trends,
    by the second half of this century we will be getting more steel from recycling
    from iron ore. The heartbeat of blasts in the Pilbara will slow, and all of a
    sudden China will have too many blast furnaces. Within a lifetime we may see it
    begin to ship its steel mills across Africa in much the same way as it imported
    them brick-by-brick from Germany and the U.S. in decades by,[9]


    And if those mini-mills our recycled steel comes from were to be powered by renewable
    energy then this really would be a form of “green steel.” The world may never
    need another blast furnace—at least, not for another couple of generations. Of
    course, this all depends on improving our'
