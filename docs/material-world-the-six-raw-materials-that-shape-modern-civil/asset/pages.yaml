    # Plastic Planet


    The most synthetic material in the world was invented by accident. In the world
    of plastics this, it transpires, is not especially unusual: pretty every major
    variant was discovered or less by accident. But what distinguishes the world’s
    most synthetic material is that it was invented by accident not once or twice
    but three times.


    The first discovery happened in 1894 when a German chemist named Hans von Bechmann
    was playing around with an explosive gas called diazomethane. He found it decomposed
    into a white powder of hydrogen and carbon, which he called polyethylene. He thought
    no more about it.[6]


    Then in 1930 a couple of researchers at the University of Illinois were messing
    around with organic compounds of arsenic. Again, their experiments'
  merge: -1
  pgno: 293
- img_proc: true
  md: 'left behind a strange, white, waxy residue. “This solid,” they wrote, “has
    not been studied further.” And that was that.


    The final discovery—the one that really mattered—happened in 1933 at the labs
    of British chemists ICI. This was in Northwich—at the very same site where soda
    ash and sodium bicarbonate are still being made from salty Cheshire brine. Two
    ICI chemists, Eric Fawcett and Reginald Gibson, were working on chemical reactions
    at high pressure, the same kind of technique that helped Haber and Bosch to fix
    nitrogen from the air and that helped Friedrich Berius turn coal into oil. One
    day they began to experiment with ethylene, that gas being flared at the Standard
    Oil refinery in the apocryphal Rockefeller story. When they smashed it with another
    gas, benzaldehyde, at a pressure of 1,400 atmospheres, they ended up with a “white
    waxy solid” on the reaction tube. They had (re-)discovered polyethylene, now named
    polyethylene, or as it’s often called in Britain, polyethylene.[2]


    There are many different varieties of plastic—though in fact—but few are as versatile
    and useful as polyethylene. It can be spun into ultra-high molecular weight varieties
    that are stiffer than steel or into low-density sheeting, which is as soft as
    wax. Its incredible ductility means it tend to stretch rather than breaking. Water
    resistant and durable, heatproof above water’s boiling point yet recyclable, polyethylene
    could be stung into strands strong enough to deflect bullets; its non-conductive
    properties mean it was the perfect electrical insulator.


    Many of these uses were only discovered decades after polyethylene was invented,
    but its potential as electrical insulation was what immediately leaped out to
    ICI. This, after all, was the early era of international communication, where
    copper wires were being laid down everywhere for telephone and electricity lines,
    but they all needed protective, insulating layers around them. At the time, the
    most appropriate material was gutta-percha, a non-conductive rubber latex made
    from the gum of a tree in Malaysia. Wires would be insulated in gutta-percha and
    then wrapped in a lead sheathing. But supply and costs couldn''t keep up with
    the demand for wiring.'
