    The ancient Hittites, occupied the area covered by Turkey and Syria, seem to have
    worked out to smelt iron and create steel weapons around 1400 bc, and over the
    following years the skills spread throughout Asia and Europe, kickstarting what
    anthropologists like to call the Iron Age. But it wasn''t until the fifth century
    bc that the Chinese developed the first blast furnaces, and it wasn''t the medieval
    period that they spread to Europe. There were furnaces producing pig iron in Sussex
    around 1500 and in South Wales not long afterwards.


    And these furnaces had something in common: they used charcoal as their fuel.
    Charcoal—a nearly pure form of carbon produced by cooking chunks of wood without
    exposing them to the air—generated an intensely hot, intensely clean heat, which
    made it ideal for ironmaking, as well as other forms of smelting or for matter
    brewing beer or bubbling cloth dyes. As for demand for charcoal wood, so too did
    pressure on the forests. Wood, after all, was also invaluable for the construction
    of houses and, especially in England, the ships and masts of the Royal Navy. In
    1559, amid reports that timber stocks had fallen to Worcester to worrying lows,
    a new law was introduced to prevent the felling of trees for iron production within
    14 miles of the River Severn. Fears about an impending environmental catastrophe
    forced industrialists to look elsewhere. What followed was one of those epochal
    shifts—not just in the production of iron but in the story of the modern world—for
    gradually, entrepreneurs in England and Wales began to rely not on wood for their
    heat but on fossil fuels.[4][|2]'
