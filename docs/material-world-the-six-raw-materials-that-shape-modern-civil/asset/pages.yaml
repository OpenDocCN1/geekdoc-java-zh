  md: 'Chuqui was not abandoned because the mine shut down or ran out of ore; quite
    the contrary. It was shut down because it was about to be eaten up by the mine.
    As the machines have dug deeper and displaced more earth, the piles of rocks,
    rubble and tailings that constitute the waste product began to encroach on the
    town.


    By the early 2000s the waste rock from Chuqui was beginning to spill out on houses
    and gardens. Clouds of toxic gas were wafting out from the refinery on the avenues
    and streets. The residents were getting sick and the mine gained a new nickname—Chuqui
    qui mata, Chuqui which kills. So in the following years Codelec, the huge state-owned
    corporation that runs the mine, moved over 20,000 inhabitants to Calama, the nearest
    city. They were given new homes and schools, and by 2008 Chuqui was empty and
    left to rot.


    But since this is the Atacama, the driest desert on earth where the environment
    preserves rather than degrades, many of the buildings still look much as they
    did when people left them for the last time. Peer into the windows of the school
    and you can still see goodbye messages from the blackboards. Inside homes there
    are toothbrushes on the sinks and kitchen roll waiting to be used, a Christmas
    card on a mantelpiece, a shopping list left on a kitchen table.


    Drive to the northern quarter of Chuqui and soon enough you find yourself in the
    shadow of an immense hill, a massive pile of waste rubble. The Chilean landscape
    is dotted with these human-made mountains the locals call tortas—cakes. Chuqui''s
    cake has already eaten up more than a quarter of the homes and shops. A seven-floor
    hospital, which back in the 1960s was the most advanced in Latin America, is now
    completely entombed and every so often a new street is smothered in the waste
