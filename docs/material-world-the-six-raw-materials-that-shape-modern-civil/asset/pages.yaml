  md: '# Where There’s Muck There’s Brass


    Umicore’s plant on the banks of the River Scheldt in Hoboken does not look like
    a vision of the future. The site is ringed by piles of black dirt heaped high
    into mounds and in the middle are vast chimneys puffing smoke out into the sky.
    This place, which remains a hotspot for lead pollution, hardly looks like the
    key to a healthier, more sustainable future.


    But do not be fooled. For this is where, among other things, they make cathode
    active materials for batteries. The company formerly known as Union Minière no
    longer mine cobalt in the DRC, but it still processes the metal from there—alongside
    nickel, manganese and, of course, lithium—into the ultra-pure cocktails that get
    pasted on rechargeable battery electrodes. There’s a good chance your next electric
    car will contain batteries with chemicals processed by Umicore.


    The main reason why we are here is because Umicore is also a pioneer in a field
    upon which so much will depend in the coming years. Having eschewed, or more accurately
    booted out of, most of its mines, Umicore is now what you might call an “urban
    miner.” Rather than just refining metals from ores extracted from the ground,
    it also refines them from waste—electronics, old batteries and other contraptions.
    Its recycled lithium hydroxide, or for that matter gold and silver bars, looks
    much the same as you’ll find anywhere else, except that it didn’t necessitate
    the destruction of a mountain—or rather, it might have done, but only once.


    For most of human history, the main source of materials for the products we have
    used is the stone and earth beneath our feet. In the future most of that material
    come instead from the old products we have discarded. For the time this remains
    a dream because we are still a long, long way from that promised land. Steel,
    as you know, is perhaps the most recycled metal on the planet, and in the United
    States the vast majority of stuff being milled is already made from scrap melted
    down in mini mills. Across the world, the end-of-life recycling rate—the proportion
    of scrap that goes to be reused—is somewhere between 70 per cent and 90 per cent.
    For'
