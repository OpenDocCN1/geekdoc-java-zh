  md: '# The Elephant


    1940: HARADH, SAUDI ARABIA


    The first clue was the river.


    Well, it wasn''t exactly a river: more a dry riverbed—a wadi—which would very
    occasionally carry water on the rare days when it rained here in the desert. But
    as Ernie Berg paced up and down its length he just knew that something wasn''t
    quite right.


    The wadi ran down off the nearby mountains and travelled due east towards the
    sea for almost all its length but, around the local Bedouins called Haradh, it
    suddenly bent south for a fair distance, before bending back again towards the
    east and proceeding on its way. Why the bend? There was nothing else on the surface
    to explain it.


    The river wasn''t the only odd thing: there were the drunken hills too. These
    mountains—zebels they called here—were little plateaus with flat tops, which all
    seemed to be dipping and leaning in random directions. They couldn''t have been
    eroded by the wind or the sand, or so what was causing it?


    Most people would hardly have noticed any of this but Berg, a geologist for the
    California Arabian Standard Oil Company (an offshoot of the company now known
    as Chevron), was on the lookout for precisely these kinds of anomalies. It was
    the early days of oil exploration, long before the arrival of satellite imagery,
    gravity meters or other sophisticated tools.'
  merge: -1
  pgno: 259
- img_proc: true
  md: 'Explorers were beginning to deploy seismic sensors, but for Berg there was
    still no substitute for careful eyeballing and a bit of detective work.


    He had been in Saudi for a few years now, surveying the desert square mile after
    another, trying out his Arabic in the rare moments when the local Bedu approached
    and wanted to talk. The days were hot and the nights unbearably cold, especially,
    as now, in the winter, but there was a tight camaraderie between the Americans
    and their Saudi hosts. They were there, exploring lands that had hardly been mapped,
    alone inhabited. It was invigorating work, made all the more intense by the knowledge
    that war was raging in lands far from them—a war fuelled by the very substance
    they were seeking. Sometimes they would drive, sometimes they would ride on camels,
    often they would have to forage or hunt for their food. Occasionally they would
    take pot-shots at a promising site, having done all their diligence, they would
    eventually drill down into the earth and see what came up.[11]


    Most of these “wildcat” wells were fruitless exercises but so often they struck
    it lucky. A few years earlier, further north-east in Dammam, Berg’s boss, chief
    geologist Max Steineke, had one of those, a bit like Ernie did now, but about
    the lay of the local hills. He drilled one well, then another, then another, but
    got nothing other than some warm, salty water and some incredibly thick oil, useless
    for anything other than tarring the roads. The well number seven was being drilled,
    everyone’s patience was well and truly exhausted and some were planning on abandoning
    the enterprise altogether. Then, suddenly, a massive burst of gas and then crude
    oil erupted from the well. Almost overnight, Saudi had become a petrostate.[2]


    # The Black Gold


    Cr oil is, alongside its sister fuel natural gas, the greatest energy force of
    the past century. If steel is the skeleton of the modern world and copper its
    veins, then oil is the food that sustains us. It provides us with energy, with
    the chemicals from which we make the fertilisers that keep half the planet alive.'
  merge: -1
  pgno: 260
- img_proc: true
  md: 'It is the great accelerator of life, sparking a powered transportation revolution
    that began with the motor vehicle and reached its apotheosis in the jet aircraft.
    The oil age, like the coal age before it, delivered humankind from much of the
    drudgery of manual labour; it lifted incomes around the world and helped us live
    longer lives. Petroleum products and energy helped us mitigate infant death and
    fight malnutrition. They have, along the way, allowed us to fill the planet with
    billions more souls than its animals, plants and soil alone support. It is hard,
    in other words, to contemplate a world without oil as a fuel and as a source of
    chemicals. But even as it accelerated our lifestyles, oil contributed to greenhouse
    gas emissions, which accelerated climate change.


    Not that any of this was especially apparent in the early days. In the same way
    as coking coal helped mitigate one ecological catastrophe—the exploitation of
    vast tracts of forest to feed the early blast furnaces—petroleum seemed initially
    to be a solution rather than a problem. It helped the sperm whale from potential
    extinction by providing a superior lamp fuel to substitute for whale oil. The
    motor car replaced horse-drawn carriages just as commentators were panicking that
    their cities would soon be engulfed in horse manure. So it goes in the Material
    World.


    But the story of crude oil began long before Elie Berg’s curiosity was piqued
    by dry river at Haradh. Those who lived in this part of the world had long been
    familiar with what we now call crude oil. It would seep from beneath the ground
    in places, a thick, viscous goo that people in Persia and the Gulf had used for
    thousands of years to help caulk the bottom of their boats and as a mortar for
    bricks. Bitumen from tar pits was used by the ancient Egyptians to help embal
    bodies before mummification; it was sometimes deployed in primitive early forms
    of bombs. For the most part our ancestors used oil as a kind of chemical product
    rather than burning it.


    That changed in the mid-nineteenth century when chemists worked out how to distill
    liquid from bitumen. Kerosene, after the Greek for wax, was a wonder product.
    It burned six times brighter than the spermaceti extracted from the skulls of
    sperm whales. As settlers worried about the impending moment "when all the whales
    had been killed," it provided a'
  merge: -1
  pgno: 261
- img_proc: true
  md: 'tantalising glimmer of hope. This, of course, was the dim, pre-electric age,
    but even so, the quest to light up the night sky, extending the working day and
    improving the living conditions of households, became one of the great goals of
    the age. And so began a pursuit for more sources of kerosene, a pursuit that began
    in the oilfields of Baku in Azerbaijan but was most eagerly followed in the United
    States.[31]


    In 1859 crude was found at Titusville, Pennsylvania. There was a breakneck rush
    to get the oil out of the ground there anywhere else it could be found. As is
    often the case, the pursuit for wealth preceded the pursuit for understanding,
    and only gradually did geologists begin to learn how oil formed and where it could
    be found. When some years later a stupendous gusher was tapped in Jefferson County,
    Texas, it transpired that the hill it was, Spindlelet, was actually a salt dome—a
    bulging layer of halite beneath the ground.


    Salt—solid and impenetrable yet plastic and malleable—was the perfect substance
    to hold these subterranean reserves of oil in place. And where was salt, there
    was often oil and gas—something the Chinese had learned millennia earlier, burning
    the natural gas to help evaporate their brine. So began a race to drill into any
    plausible-looking salt dome in the U.S. or further field. And, it turned out,
    there was salt aplenty in the Persian Gulf. Oil was found in Iran in 1908, in
    Iraq in 1927, and then in Kuwait and Bahrain in the 1930s.


    The news drew in yet more American and British oil companies. They waved contracts
    at the local sheikhs, but the rulers seemed far interested in having people drill
    for water than for oil. This was a poor, nomadic part of the world. Before the
    1930s the main export had been wild pearls in the Gulf, until a Japanese businessman,
    Kokichi Mikimoto, found a way to culture these pearls artificially, causing an
    instant collapse in Gulf revenues. With the discovery of oil everything was about
    to change, but you wouldn''t have guessed it on the ground.


    At the time Saudi was far from being the oil giant it is today. Some of the geologists
    at the big oil companies remained sceptical about the area''s potential. The voguish
    place to look was Albania or other parts of eastern'
  merge: -1
  pgno: 262
- img_proc: true
  md: 'Europe and the Caucasus. But as surveyed the hills at Haradh, Berg felt there
    must be something going on here in this barren patch of land on the edge of the
    Empty Quarter—the sand desert that covers much of the Arabian peninsula.[44]


    Unlike elsewhere in the Gulf, there was no salt dome here; but there didn’t have
    to be. A salt dome, Berg knew, was only one of “trap” that could seal oil in the
    ground. Sometimes crude would be trapped beneath a geological fault or under folds
    of stone known as anticlines. Each type of trap often caused tell-tale ridges
    and bulges on the surface—subtle enough that most people would miss them, but
    not geologists like Berg.


    Over the course of months he had painstakingly mapped and measured how those jebels
    stood and turned out they were all gradually leaning outwards from a central point,
    as if there were something building up underneath them. He studied the maps again;
    if there were a bulge, that might explain why the waist suddenly changed course
    before bending towards the east? Yes, it just much… The more he thought about
    it the more excited he was getting: this was oil; he was sure of it.


    There was oil. Astonishing, unbelievable, world-changing amounts of oil. Berg
    had discovered the southern point of what was later called the Gawar field. It
    is so vast that it took geologists many years to realise that a well they struck
    more than a hundred miles north was actually drilling into the very same reservoir.
    The field stretches 175 miles north to south and 19 miles across; when you see
    it on a map it looks little like a ballet dancer’s stretched leg. Here in Saudi
    they call this anticline “En Nala”—the slippers.


    Many oilfields were discovered before and since, but nothing like Gawar. There
    is a category given to proven reserves of more than 500 million barrels of oil:
    giants. Then there are those with 5 billion or more: the super-giants. Gawar is
    bigger than any super-giant ever discovered before or since. Its precise size
    is still debated today—and indeed it is ever-changing as more reserves of oil
    and gas are discovered—but it has already'
  merge: -1
  pgno: 263
- img_proc: true
  md: 'produced more than 70 billion barrels of oil and around 50 billion more still
    available underground. It belongs in a category of its own: not a giant or a super-giant
    but perhaps, as some have called it, an elephant—or rather the elephant, since
    we will almost certainly never discover another place quite like it.[5]


    To understand why, ponder for a moment the conditions under which crude oil is
    formed. Crude is best thought of as a cocktail of distinct compounds, from heavy,
    tacky liquids to light fuels. Indeed some would argue that it should be referred
    to in the plural: crude oils. We won''t do that, though we will lump crude together
    with natural gas—a cocktail of methane, ethane and propane. Both oil and gas are
    hydrocarbons (compounds of hydrogen and carbon), both are formed in more or less
    the same way and both are frequently (though not always) found together. Not only
    is Gawar the world''s biggest oilfield, it is also one of the world''s biggest
    gas fields, producing enough methane each year, both as associated gas from the
    reservoirs and from separate gas reservoirs along its length, that it comfortably
    qualifies as a gas too.[6]


    Gawar exists at all is strange as this will sound, to global warming. Its story
    begins about 100 million years ago, when a spate of volcanic activity pushed up
    atmospheric carbon dioxide levels and led to a massive increase in plankton populations.
    Around what today is the time, the northern coast of the supercontinent Gondwana),
    these organic remains gradually settled into the seabed, one layer at a time.


    You probably already know what happened next: the zooplankton and algae were heated
    and compressed over millions of years and transformed into oil and gas. But it''s
    worth briefly dipping into the geology here, if only understanding this is also
    the key to understanding the latest chapter in the history of oil—one we''ll get
    to in a moment.


    The thing to remember is that oil forms and where it is eventually found are usually
    not the same place. This is quite different to say, coal: when you dig and blast
    out of the ground you are obliterating the trunks and turf of an ancient forest.
    But when you drill into an oil reservoir you'
  merge: -1
  pgno: 264
- img_proc: true
  md: 'generally not tapping an ancient seabed. The formation Ernie Berg found was
    not located in the place where those plankton and algae had settled 100 million
    years ago: instead that “source rock”—the fossilised seabed where the oil actually
    formed—is somewhere else, a massive bed of hard stone underlying much of the Arabian
    Peninsula.


    Having an ancient sea, thick with algae and other microscopic creatures, which
    is then compressed into a hard source rock, is only the first step. You also need
    another place for oil and gas to bubble their way into. This “reservoir rock”
    needs to be porous and permeable, and to be capped with a hard ceiling, which
    traps the oil and gas. This was what Berg was searching for; this was the outstreched
    leg of the Gawar oilfield.


    What makes the Gulf remarkable—still as of 2023 comfortably the most hydrocarbon-rich
    area on the planet with half the world’s oil reserves and 40 per cent of the gas—is
    that it ticks all of these boxes: the ancient algae in the right rocks, the right
    amount of heat and pressure over time, the perfect set of permeable reservoir
    rocks with the right kind of traps to seal in all that oil and gas.


    There are many other oilfields around the world, but none of them ticks these
    boxes quite enthusiastically as Gawar. Berg had discovered a geological wonder,
    a place as significant for hydrocarbons as the Pilbara for iron ore and the Andean
    foothills of Chile and Peru for copper. If Saudi Arabia is the single most important
    country in the oil business—and at the time of writing it is certainly still regarded
    that way—then Gawar is comfortably its single most important field, accounting
    for more than half of every barrel of oil produced in Saudi since the beginning
    of the oil age.


    No other oilfield on earth—nor for that any coal pit, any uranium mine or nuclear
    plant, any wind or solar farm, however massive—produces as much of this planet’s
    energy. And this brings us to a maxim we’ve been flirting with all the way through
    this book: in the Material World, and for that matter the ethereal world many
    of us inhabit, energy is pretty much everything.'
