    The more you think about this the more extraordinary an achievement is. The twentieth
    century''s electrical was built out of copper—a great tide of copper for the electrification
    of major cities, the age of consumer electronics and the rise of mammoth new markets
    for wiring and electronics like China and India. Even as people demanded more
    copper the earth became considerably less giving to give up. Somehow those working
    in Chuqui and elsewhere churn churning copper at pretty much the same price. Falling
    supply; rising demand. You might have thought the price should have skyrocketed,
    potentially stifling the world’s progress—but no.


    Let''s return to the lip of the canyon of Chuquicamata. Cast your eyes down to
    the bottom, to the enormous trucks, the ones bigger than a semi-detached house.
    These are Ultra-class vehicles, introduced in the 1980s. Before they arrived on
    the scene the average mining truck could carry perhaps 40 tonnes of rock; today,
    it is more than 400 tonnes. Turn around to look at the mills where the rocks are
    ground down and you see row after row of crushers, each reducing all stone to
    the consistency of talc. Stare out at the heap leach pads, so enormous they melt
    into the desert horizon. Then there is the bit you can''t see. Deep beneath the
    hole Codelco is now mining this copper underground. This, turns out, is no longer
    just the biggest open mine in the world; it is also set to become the biggest
    underground mine in the world.


    The technical term for what it is doing is“block cave mining” and the concept
    of it is enough to induce a wince. While most underground mining involves digging
    along a seam of rock and then drilling or blasting the ore'
  merge: -1
