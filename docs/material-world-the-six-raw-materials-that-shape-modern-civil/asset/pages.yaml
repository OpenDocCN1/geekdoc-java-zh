    pinpoint smashing of molecules happens 50,000 times per second, so that the stream
    of tin droplets and the laser explosions are totally indiscernible. All of this
    to generate a stream of EUV light whose real task is yet to come, for only then
    it is bounced out towards our waiting wafer.


    Actually, calling it is a bit misleading for it is more like a kind of radiation,
    a little bit like an X-ray. And like it has a habit of being absorbed by most
    solid materials, including most lenses. This is where sand makes yet another cameo
    appearance, in order to bounce this EUV light down to the wafer, ASML has contracted
    Zeiss to produce a set of special mirrors called Bragg reflectors, made from layers
    of silicon and molybdenum.


    Quite how these mirrors are made is yet another closely guarded secret, but according
    to Zeiss, they are ground down from blocks weighing 50 kilograms, and robots are
