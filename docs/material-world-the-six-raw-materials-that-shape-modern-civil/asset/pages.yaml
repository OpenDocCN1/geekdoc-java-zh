    What is striking at Grasberg and at Chuqui is not merely the scale or the extent
    to which the environment has been scarred by copper exploitation but also something
    else: how few people it takes to do so much work. During the twentieth century
    the number of people working in copper mining and production in the United States
    fell by two-thirds, but the amount of copper produced more than quadrupled.'
