    Yet there are, of course, consequences to all of this. The flipside of getting
    ever more effective at mining ever poorer copper ores is that we displace ever
    more amounts of the planet in our bid to do so. Between 2004 and 2016 Chilean
    miners increased annual copper production by 2.6 per cent. Yet the amount of ore
    they had to dig out of the ground to produce this marginal increase in refined
    copper rose by 75 per cent. The most staggering thing about this statistic, however
    is not just the numbers themselves but the fact that they show up in no environmental
    accounts or material flow analysis, which count only the refined metal. When it
    comes to the United Nations’ measures of how much humans are affecting the planet,
    this waste rock doesn’t count.[221]


    There’s another pressing reason to start pondering this, because eliminating carbon
    emissions essentially involves switching a lot of our activities over from fossil
    fuels to electricity. Out go gas- and oil-fired boilers in our homes; in electric
    heat pumps. Out go combustion engine cars; in come battery-powered ones. Between
    2020 and 2050 the share of our primary energy coming from electricity is expected
    to rise to 20 per cent to 50 per cent. All of a sudden copper becomes the backbone
    of, well, everything.


    The average car already contains about a mile of copper wire connecting the sensors
    and electrical components that help it function. In electric cars we need three
    or four times the amount of copper, with half of that going into the motors and
    the rest into the wiring harness and battery. A battery-powered bus will require
    nearly half a tonne of copper in motors and circuitry and large slabs—busbars
    as they’re called—capable of carrying more current than conventional vehicles.
    High-speed trains will need even more.[22]


    The numbers are made more prodigious by the infrastructure we need to generate
    extra, green electricity. For all that they have the metal at the heart of their
    generators, conventional power stations are actually comparatively copper-light.
    But solar panels need roughly seven times as'
