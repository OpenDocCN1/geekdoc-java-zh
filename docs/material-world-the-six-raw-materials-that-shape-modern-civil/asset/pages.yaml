    with why it was constructed in the first place: to carry particular cargo down
    from the desert to the port. That cargo was saltpeter, a type of salt that was
    explosive in both senses of the word. Sprinkled on plants, it would make them
    grow thick and fast. But, even more consequentially, as a basic ingredient of
    gunpowder, saltpeter was also the key to winning wars.


    # A Very Special Salt


    The Chinese had the first to discover this substance, scraping a white tangy salt
    we now know as potassium nitrate from rocks and bricks and setting it alight,
    with ferocious results. They called the salt huo yao—the “fire drug”—but in the
    West it became known as saltpeter—Latin for “salt of the stone”—since it was often
    found encrusted on stone walls underground in old cells and crypts. Mix this salt
    with a tiny fraction of sulphur and charcoal dust and you have gunpowder.


    But the problem with saltpeter was that for most of history it was frustratingly
    difficult to find. For hundreds of years, the main source was fetid organic matter,
    most notably rotting meat and urine. For a while military leaders of the time
    were disproportionately concerned with dung heaps and old, abandoned privies.
    Men were dispatched across medieval kingdoms on the hunt for patches of putrid
    earth. Having identified and tasted a patch for quality, they would dig up the
    stinking ground, boil it, strain it and evaporate to produce precious flakes of
    saltpeter.


