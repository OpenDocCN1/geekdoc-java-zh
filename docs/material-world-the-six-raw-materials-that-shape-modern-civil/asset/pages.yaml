  md: 'Every day a train is loaded with cathodes and copper concentrate. It rides
    the line—that famous railway which precipitated the Saltpeter War—down to the
    coast and while the cathodes head off to manufacturers, the concentrate is loaded
    into container ships bound for refiners in China. Only there does the Chilean
    copper become pure copper, at which point no one is really sure where it came
    from more.


    The vast majority of the world’s copper—about 80 per cent—is produced this way,
    far from where it is pulled out of the ground, making it incredibly difficult
    to work out exactly where that metal was mined. Most of the world’s copper plates
    and bars are a cocktail of atoms from all over the world: a bit from Chile, a
    bit from Australia, some recycled from copper mined long ago somewhere else the
    Democratic Republic of Congo. Each slab is a physical manifestation of globalisation.
    Even so, it’s a safe bet that there is a little bit of Chuquicamata somewhere
    near you, given that this place is by some measures the biggest mine on the planet.


    Quite what constitutes the biggest mine on the planet is a matter of debate. By
    one measure—the amount of metal extracted from a single place—the iron ores of
    Australia, Brazil or Russia would easily surpass this place. But since iron ore
    tends to be found in far greater concentrations than copper, with about 60 per
    cent in each hunk of ore, compared with barely 0.6 per cent in ore, you need to
    move a lot more earth for each tonne of copper than each tonne of ore. Based on
    my back-of-an-envelope sums (surprisingly scant research has been done on this
    topic), copper mining results in the disturbance of considerably more of the planet’s
    surface than the production of any other metal—even though there is so much less
    of the end product.[22]


    These days more copper comes each year from Escondonda, another gigantic hole
