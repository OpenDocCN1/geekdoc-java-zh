  md: 'ground, which in turn poses fresh risks to the ecosystem. So goes the inescapable
    dilemma of the Material World.


    Yet the paradox of sand is that it is not merely the substrate of glass—the world''s
    first manufactured product—or for that matter the fabric of the built world. It
    is not merely deployed as the foundations of buildings or the substance with which
    countries extend their territory. The story of sand is not only one of astounding
    scale, but one of astounding miniaturisation. For the very same atom that comprises
    the backbone of concrete is the atom upon which we etched and formed the computer
    age.


    The paradox of sand is that today we make one of humankind''s most precious creations
    from one of nature''s most abundant elements. But doing so involves a set of transformations
