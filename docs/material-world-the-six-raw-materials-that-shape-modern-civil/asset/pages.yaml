  md: 'fertiliser companies invariably use natural gas instead: natural gas to provide
    energy and natural gas as a chemical feedstock to provide hydrogen. Not only were
    these tomatoes being warmed with natural gas, they were being nourished with a
    natural gas product too.


    This is not just a story about tomatoes. It is a story about all foods. The vast
    majority of the world''s crops are sustained by nitrogen fertilisers created from
    natural gas. The vast majority of the world''s animals are fed with food sustained
    by fertilisers created from natural gas. If fertilisers are among the most important
    substances in the world—and given that without them it would be impossible to
    support nearly half of the global population it''s fair to say—then so too is
    gas. A small fraction—barely more than 2 per cent—of the world''s annual natural
    gas output is used to make fertilisers, but these are incomparably important molecules.


    Nor does the agriculture sector''s reliance on fossil fuels end there. Back in
    the glasshouse Lof crouched down and showed me a white, perforated plastic pipe
