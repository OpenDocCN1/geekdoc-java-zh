    ourselves off these fuels—or rather we are slightly slowing the rate at which
    we extract them from the ground.


    You might presume, then, that this means our broader appetite for minerals is
    diminishing. Not a bit of it. It turns out oil and other fossil fuels have only
    ever represented a fraction of the total mass of resources we''re extracting from
    the earth. For every tonne of fossil fuels, we exploit 6 tonnes of other materials—mostly
