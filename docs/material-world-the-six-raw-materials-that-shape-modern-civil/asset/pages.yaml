  md: '# Acknowledgements


    One of the most wonderful, and for that matter challenging, things about telling
    the story of the Material World is that this place doesn''t fit neatly into any
    pre-existing scientific or literary categories. This is a story of geology, but
    it''s also about engineering. It''s about history and about economics. It covers
    material science and chemistry, not to mention physics and biology. It is, in
    short, a bit of everything, which is the best defence I can offer for why I, a
    mere journalist, am the one attempting to tie these strands together.


    One of the joys of writing this book has been the licence it has given me to ring
    some of the world''s leading experts and ask bone-headed questions about how the
    world really works. This book is a product of hundreds of conversations with scientists,
    environmentalists, policymakers and businesspeople, not to mention the residents
    of the Material World itself—the miners and engineers working to turn these materials
    into life-saving and life-enhancing products. It is, I hope, their story rather
    than mine—even if their names do not appear on the cover (or, for those who preferred
    to remain anonymous, here in the acknowledements either).


    To whom I''m immensely grateful for sparing time to provide advice and ideas,
    and for potentially answering my stupid questions, include: Julian Allwood, Justin
    Baring, Tom Tide, Nigel Bouckelly, Flo Bullough, Tom Butler, Diane Coyle, Django
    Davidson, Stefan Debryune, Athene Donald, David Edgerton, Simon Evans, Andrew
    Fulton, Paul Gait, Ben Goldsmith, Ben Gordon, Sarah Gordon, Andy Haldane, Reiner
    Haus, Andrew Heald, Neil Hume, Michael Lodge, David Mapstone, Brian Menell, Chris
    Miller, Simon Moores, Bram Murton, Malcolm Penn, Jose Ignacio Perez, Simon'
  merge: -1
  pgno: 406
- img_proc: true
  md: 'Price, Andrew Rabneck, Caspar Rawles, Matt Ridley, Vaclav Smil, Jonathan Spencer,
    Judy Stevenson, Ricky Tite, Frances Wall and Giles Wilkes. Special thanks to Jamie
    Bell, Andrew Bloodworth, Richard Davies, Richard Jones and Rob West, who read
    through some of the drafts and provided essential advice and corrections. But
    if any mistakes remain in the text—and given the expanse of subject matter in
    the Material World, I would be amazed if there weren’t—then they are mine and
    mine alone.


    The idea for this book really began with a conversation with my agent, the incomparable
    Jonathan Conway. We are not related but share a surname, a long friendship and
    now, this latest project, of which I hope he is proud as I am. Enormous thanks
    must go to Jamie Joseph and colleagues at WH Allen and Ebury, for helping me turn
    my inchoate drafts into something resembling, a well, a book. Thank you to my
    company, Sky, especially my bosses John Ryle and Jonathan Levy, who gave me the
    time and support to make this book happen, even through some of the busiest years
    in news that any of us can remember. Thanks and apologies to colleagues who had
    to accommodate what increasingly random forays into covering obscure topics like
    the mechanics of oil refining and the manufacture of salt. I hope, if you are
    reading this, you see what all the fuss was about!


    Thank you, above all, to my family. Thank you, Eliza, the love of my life, the
    source of much inspiration and happiness, the first and most incisive of all my
    readers. Thank you to my daughters, for putting up with a father who spent so
    many months held away writing rather than playing with you on the beach or in
    the garden. Each time I returned from a trip under the ground or over the sea,
    I brought back what I feared would be the most dismal of souvenirs: rocks and
    earth, crystals and strange powders. You handled them with such wonder and excitement
    that it reminded me what this book was really about: the magic embodied in seemingly
    simple substances. It turned out to be the most inspirational lesson of all.'
