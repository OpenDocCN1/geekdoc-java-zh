  md: 'The short answer is that our history and our present are infused with salt.
    At its simplest, there is a biological imperative for this. Each year the human
    body needs several kilograms of table salt, sodium chloride, if it is to keep
    on functioning. Among other things, salt helps our machinery of nerves, muscles
    and tendons to operate, allowing electrical currents to flow. And much like most
    electrical machines, our physical apparatus will conk out when it can''t get enough
    and will overload if it has too much. Up until the invention of modern refrigerators,
    salt was the primary method of preserving food. It has antiseptic qualities, which
    kill bacteria; when we salt meat, we are literally curing it of the harm it could
    do us. The salt of the earth is the stuff of life.


    Yet as said, we spend little time pondering our reliance on this humble substance.
    In fact, our complacency about salt is, if anything, even more ingrained. While
    few people comprehend the continued importance of glass to the modern economy,
    no one considers it trivial. But to say salt is the stuff of life remains true
    today as it was in Roman times. It is not merely that we need it in our food;
    salt is the very basic of much of the sanitary and pharmaceutical sector. Think
    of a handful of the stuff you find underneath your kitchen sink. Baking soda for
    cooking, bleach for cleaning—even the pipes down which the waste water travels.
    This humble grain is still the foundation for much of the chemical industry. Implausible
    as this might sound, many of those gases and acids scouring through the pipes
    from the sub-fab up to the cleanroom in that astoundingly advanced silicon foundry
    in Taiwan began their lives as grains of salt mined from under the ground, or
    evaporated out of the sea.


    There is another reason why it pays not to underestimate this substance. If you
    want to understand capitalism and power, the best place to begin is with salt.
    That the following pages are rammed with politics, oppression and war is not coincidental.
    The fact that salt is essential for human survival (and that other obscure salts
    have been essential for our sustenance) means it has been an instrument of power
    since its very earliest days. The reason salt earns'
