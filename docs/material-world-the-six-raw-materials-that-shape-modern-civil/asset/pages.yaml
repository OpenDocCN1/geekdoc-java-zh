  md: '# The Deep


    26°N, 45°W


    At sea level, the world’s biggest mountain range looks as flat as sands of a pancake.


    This ridge of peaks and valleys, which snakes tens of thousands of miles north
    to south, is longer than the Andes and the North American Cordillera and taller
    in places than the Himalayas. Yet few have ever seen it, let alone scaled its
    peaks, for the world’s biggest mountain range is submerged under thousands of
    meters of seawater.


    We are in the middle of the Atlantic Ocean onboard the RRS James Cook, a ship
    dedicated to scientific research (RRS stands for Royal Research Ship), and somewhere
    beneath our feet is the Mid-Atlantic Ridge. The sea is rough here, the waves more
    than 15 feet high; trade winds whip across the water at speeds up to 50mph, tossing
    the ship and its crew this way and that. When the clouds do there there is no
    room for sunbathing, for the deck of this ship is festooned with cranes and heavy
    machinery, constantly in motion.


