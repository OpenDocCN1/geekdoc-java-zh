- img_proc: true
  md: 'The vast majority of hydrocarbons still end up in the tanks of vehicles, and
    most natural gas is used to generate power and heat. Yet the remaining 10 per
    cent—the by-product of refining oil and gas—plays a disproportionate role in our
    lives.


    These products clothe us and feed us. They help keep us clean and healthy, and
    they are embedded in the vast majority of items available for purchase today.
    They are among the newest creations we know, yet it is impossible to imagine the
    world without them. They help conserve energy but they are produced from a fossil
    fuel. Clean yet dirty, commonplace but extraordinary, the most interesting thing
    about petrochemicals is how little time most of us spend thinking about them.
    But they are everywhere.


    Plastics, fertilisers, packaging and pharmaceuticals. Preservatives and resins,
    paints and adhesives, dyes and flavours. As an oil refinery''s job is to decomplexify
    crude oil, the petrochemical sector''s job is to reconstitute those simple molecules
    into a dizzying number of products—far more than we can cover individually here.
    But to understand how intertwined our lives are with the stuff that comes out
    of those oil and gas reservoirs under the ground in the U.S., Qatar, Saudi and
    beyond, we need to start somewhere else altogether.


    # The Truth about Tomatoes


    Picture a plump, red cherry tomato, freshly plucked from the vine. It is perfectly
    ripe and exceedingly inviting. Its firm skin glistens with sensuous droplets of
    moisture. As you take a bite, it explodes in your mouth with an intense burst
    of flavour, gloriously sweet and delightfully rich in umami. Is there any other
    experience that brings you closer to nature than eating raw produce straight from
    the soil?


    Well...this is awkward. Because what you have just eaten, savoured and enjoyed
    is the fact fruit of fossil fuels. Those sugars and flavours contained atoms that
    began their lives as part of a molecule of methane—natural gas—'
  merge: -1
  pgno: 289
- img_proc: true
  md: 'which was pumped from under the ground by an energy company. And the same is
    often true for a cucumber, a pepper or a lettuce as well.


    Much of what we eat today is, one way or another, a fossil fuel product. This
    is rarely mentioned on food packaging, in recipe books or on supermarket shelves,
    with so much else in the Material World, nobody wants to think about this. But
    when you take a moment to ponder how this tomato came to be, its true heritage
    will become abundantly clear.


    These days an ever increasing proportion of the world''s tomatoes are not grown
    outside soil but inside greenhouses. Controlled environment agriculture, as it''s
    sometimes called, is widely regarded as the future for the cultivation of our
    crops. With the world''s population projected to surpass 10 billion later in this
    century, we will have to produce more food in the next four decades than all farmers
    have in the past 8,000 years. And with ever more pressure on freshwater systems
    and land ever more precious, this kind of farming has a few important attractions.[2]


    Growing crops rather than outside, in large conservatories or even vertical farms
    with artificial lighting, means a single acre can yield as much as 400 times what
    you get from a typical field. No longer do farmers need to be held hostage by
    the vagaries of weather or soil quality: with a computer-controlled climate and
    the ability to grow crops in hydroponic substrates infused with the right amount
    of nutrients, you can do this more or less anywhere—including urban areas, meaning
    no need for expensive and dirty shipping. You use considerably less water along
    the way and, since your crops are growing inside, you do not need to spray as
    fertiliser and have little need for nasty pesticides.


    In the Netherlands, where this kind of agriculture was pioneered, the greenhouses
    cover an area the size of Paris, and have helped this country with a not-especially-favourable
    climate become the world’s second largest exporter of food. Fly over it at night
    and you will see large expanses of glass lit up by LED lighting, as the plants
    inside are exposed to extra light to window of photosynthesis.[3]


    The glasshouse at Valley Grown Nurseries, one of the UK''s biggest tomato producers,
    situated in the Lea Valley just outside London, is based on'
  merge: -1
  pgno: 290
- img_proc: true
  md: 'a Dutch design. When I visited it was one of those cloudy days when spring
    hadn''t quite given way to summer and I arrived to find the manager, Nof Nicastro,
    looking disapprovingly up at the sky. Unless you use LED bulbs—and Nof did not—light
    is the one thing you can''t control in these places; each dull day sets the crop
    back a few percentage points.


    Inside the cavernous glasshouse metal pipes ran along the floor, keeping the temperature
    a constant 20°C. Tomato vines hung from gutters a few metres above the floor in
    long rows, stretching far out into the distance. Their roots were not buried in
    soil but in mineral wool—fine fibres of basalt—which was constantly fed with a
    solution of water and fertilisers. Surprisingly, perhaps, there were bees buzzing
    everywhere, since we have yet to discover anything else that can outperform the
    natural world when it comes to pollinating the plants. A constant swarm was flying
    in and out of cardboard boxes at the end of every row. Nof plucked a tomato off
    the vine and handed it to me. It was vibrant red and much like the one you just
    tasted in your imagination: glorious. The taste of fossil fuels.


    The first clue to that heritage was to be found in a corrugated iron shed next
    to the greenhouse. Inside was an enormous boiler, about the size of a bus. This
    was the heart of the operation: the source of heat in those pipes running through
    the glasshouse.


    We tend not to think of agriculture as a form of energy transfer, but that, ultimately,
    is what it is. When farmers grow wheat or corn or rice outside in their fields
    or paddies they are converting the sun''s energy into edible calories. When we
    eat what we are consuming calories that were once ingested in turn by a cow or
    chicken as it eat rice or corn. You can trace a direct line back from what you
    eat to the sun''s rays. Or, you could.


    For the story of modern agriculture is really about something bigger: our substitution
    of natural forms of energy with fossil fuels. These greenhouses provide a vivid
    example: gas-fired heating replacing the warmth of the sun. Yet this is only the
    beginning, for now consider how we make the fertilisers that are being drip-fed
    into the substrate containing the tomato''s roots.


    Back in the early days of the Haber–Bosch process, BASF used coal to create the
    hydrogen it needed to fix nitrogen out of the air, but these days'
