    stream of carbon dioxide. This was another Dutch innovation. Since carbon dioxide
    is, alongside light, the main input into photosynthesis, you can dramatically
    accelerate the rate of growth by increasing the CO2 inside the greenhouse from
    the atmospheric average of just 400 parts per million to 800ppm or even 1,000ppm.
    And where does CO2 come from? It is sequestered from the flue of the gas boiler
    and pumped straight into the conservatory.


    It is a finely honed system, a system that means this type of farming doesn''t
    just use less land; it uses less fertiliser (since the unabsorbed solution gets
    recycled around the irrigation loop) and it uses less chemicals than conventional
    farming while turning out many multiples produce. If we were an economist after
    an example of productivity, you could hardly do better. Yet the chlorophyll inside
    these tomatoes contains carbon from natural gas, hydrogen from natural gas and
    nitrogen from fertiliser (which is produced with natural gas). They are made of
    fossil fuels.


    As a result, a kilogram of greenhouse tomatoes generates as much 3 kilograms of
    carbon emissions. Some growers are experimenting with using'
