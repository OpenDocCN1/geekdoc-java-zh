  md: '# # Postscript: Peak Oil


    RAS TANURA, SAUDI ARABIA


    As you look out from the North Pier, all you see is tanker after tanker.

    It is a blistering day, the temperature knocking on 40°C, but through the haze
    you can just about discern 15 or maybe 16 of these ships, some loading, some waiting,
    some manoeuvred into place; pulled and pushed this way and that by small, stocky
    tugboats, which occasionally disappear beneath the tankers'' vast silhouettes.


    The technical name for this class of ship is VLCC—very large crude carrier, capable
    of carrying up to 350,000 tonnes of oil, longer than the Empire State Building
    is tall. There are bigger oil tankers these days—the ultra-large crude carrier
    class—but they are almost *too* big: unable to dock at any but the very deepest
    deep-water ports, so it is mostly VLCCs these days.


    Aramco''s pilots board each vessel to help steer them into port. Sometimes, some
    involves a well-timed jump from a launch boat to a rope ladder; sometimes it involves
    rappelling down from a helicopter as it hovers above deck. The ships are steered
    into place, some of them on the bizarre-looking Sea Island—a long platform of
    pipes and a couple of nautical miles out to sea, where the very largest tankers
    can dock without ever coming into contact with dry land. All being well, it will
    take about a day—sometimes a day and a half—for each ship to load, its deck sinking
    closer to the waterline as it is filled with the crude pumped through long pipelines
    from Ghawar and the other nearby fields.'
  merge: -1
  pgno: 303
- img_proc: true
  md: 'The terminal here at Ras Tanura dates back to 1939, when the oil from the first
    Saudi field at Dammam was beginning to flow. King Abdul Aziz Ibn Saud ceremonially
    opened the valve and oil has been flowing more or less continuously ever since.
    And from here, the world''s biggest oil export facility, so begin the voyages
    that keep the world ticking.


    Many of these tankers sail for China and India, where they will help fuel a quarter
    of the world''s economic output. Some will depart for the Americas or for Europe.
    They will sail south, through the Strait of Hormuz, around the Arabian Peninsula
    and north into the Red Sea, then the Suez the Suez Canal. But since a fully laden
    VLCC tanker''s hull is too deep to navigate the shallow waterways of Suez, they
    will offload some of their crude into pipes at the Ain Sukhtina terminal before
    sailing through the canal to the Mediterranean and picking up their oil at the
    other end.


    This finely honed process is happening right now as you read this—a constant arterial
    flow of hydrocarbons along the high seas and through steel pipes without most
    of what you have read about would cease to function.


    All of which makes Ras Tanura a very important place, and also a very vulnerable
    one. Directly opposite, on the other side of the Persian Gulf, is Iran, one of
    Saudi''s greatest enemies. This site is within range of countless Iranian missiles,
    which could level the port within a matter of minutes. There are periodic drone
    attacks on Saudi facilities, usually carried out by Houthi rebels from the north
    of Yemen, funded or supported by Iran. In 2021 the Saudis said the port had intercepted
    a drone and missile attack. So far none of these assaults has caused lasting damage
    to oil flows, but analysts fear it is only a matter of time. Nor is this the only
    target, for more than 100 miles south-east lies another port which may, these
    days, be even more important.


    # RAS LAFFAN, QATAR'
  merge: -1
  pgno: 304
- img_proc: true
  md: 'Ras Laffan sits on the headland of the Qatari peninsula. It is a sprawling
    jungle of pipework in the desert: some of it cleaning and processing natural gas,
    some of it condensing and cooling the gas into its liquefied form. When I visited
    a few years ago I spent some hours driving through the maze of steel in a little
    electric golf buggy, trying to identify where the liquefaction actually took place,
    and failing. It was another baffling experience much like the Wesseling refinery
    in Cologne. Only here, the hydrocarbon is somewhat lighter, somewhat different.


    If oil marked the world''s third energy transition—the moment we discovered how
    to refine petroleum, diesel and other petrochemicals from crude oil—natural gas
    is described as marking the fourth energy transition. While oil is considerably
    more energy-dense than most types of gas, better-equipped to fuel internal combustion
    engines, gas is better still at turning fuel into power. Today''s gas turbines
    are the very best energy converters in existence, which makes gas the most efficient
    and least pollutant of all fossil fuels. Were China to shift all its coal-powered
    stations to gas, then the world would immediately be on track to hit its climate
    goals.


    However, this transition has taken some time to get going. Oil overtook coal as
    the world''s biggest energy source in the mid-1960s but gas was only beginning
    to overtake coal at the time of writing, in the early 2020s. In part this is because
    gas is a lot trickier to move about than oil; it necessitates vast distribution
    networks, which take many years to build. Today there are transcontinental pipelines
    across North America and China, across much of the Middle East and the Caucasus;
    there are pipelines connecting the Russian gas fields in Siberia with Europe,
    though some are inactive and the biggest of them, Nord Stream, was sabotaged in
    2022. There''s an increasing number of terminals that do what they do at Ras Laffan,
    compressing natural gas into a super-cool liquefied form, which can then be shipped
    in special LNG vessels, much like those mammoth oil tankers circulating the globe.


    And this place is even more important than the other ports and plants along the
    Gulf coastline, for it sits next to what is the single biggest energy'
  merge: -1
  pgno: 305
- img_proc: true
  md: 'source on the planet. While Gawar is the world''s biggest oilfield the North
    Field, which sits under the sea just off Qatar, is comfortably the world''s biggest
    natural gas field. And since we can turn natural gas into heat or power far more
    efficiently than any other fuel, the amount of useful energy we can extract from
    it is greater than anywhere else on the planet—bigger even than Gawar and all
    the oil flowing through the Ras Tanura terminal in Saudi. At the time of writing,
    nowhere else came as close to the North Field, making it the single most important
    energy source on earth.[1]


    The North Field is huge—a massive underground reservoir of gas covering 3,750
    square miles, most of it under Qatari waters stretching into Iranian territory.
    Qatari pumps gas through pipes and the CO2 and sulphur are removed at the jungle
    of Laff. It is hard, even as one paces through this astonishing complex of metalwork,
    to comprehend how much this place matters. This single place provides around 4
    per cent of global energy—comfortably more than solar panel and wind turbine in
    the world combined.


    And as the world continues to shift across from coal and oil towards gases, Ras
    Laff will become even more important. So it is unsettling that this place is also
    firmly in the sights of Iranian cruise missiles. These two nations—one small,
    one large, one aligned with the West, the other part of the so-called “axis of
    evil”—are both poking their straws into the very same reservoir. They are both
    uneasily tapping the same hydrocarbons, the fossilised plankton laid down in a
    tropical sea hundreds of millions of years beneath this, the world''s most energy-rich
    region.


    Of course are there other places in the world that produce natural gas. Thousands
    of miles north in the Arctic reaches of Siberia, millions of cubic metres of gas
    flow silently out of a complex of Russian wells. For decades those molecules travelled
    down pipes towards Europe, whose energy system was reliant on gas from the east.
    The German manufacturing powerhouse was predicated on cheap Russian gas, which
    powered much of its industry and fed most of its chemicals plants. German cars
    and machinery were manufactured out of steel forged increasingly increasingly
    in China using hydrocarbons extracted from'
  merge: -1
  pgno: 306
- img_proc: true
  md: 'Russia. But up until the invasion of Ukraine in 2022 few of the politicians
    in Berlin gave this much of a second thought.


    Across the Atlantic, at Texan wells above the Permian basin, operators pump down
    a solution of sand, chemicals and water, and pump up extraordinary quantities
    of oil and gas. The inexorable logic of a world where all economic activity is
    a form of energy transfer suggests that the fracking revolution will help support
    American economic activity and prosperity in the coming decades. As Europe''s
    supplies of Russian energy were curtailed, it was American and Qatari oil and
    gas which helped fill the hole.


    The fourth energy transition is still underway, and gas will provide more of our
    energy than oil or coal. We already rely on natural gas to heat the furnaces to
    melt sand into glass; to turn salt into chemicals; to melt and refine copper;
    there is even natural gas injected into blast furnaces these days alongside the
    coal. It is not just fertilisers, petrochemicals and tomatoes.


    Throughout the age of oil there were periodic scares that the world might be about
    run out of the stuff: that Ghawar might finally reach its twilight. There is some
    logic to this, much as it is getting harder to find rich seams of copper in the
    ground, the easiest oil reserves are long since exhausted. The best yardstick
    for this is to compare the amount of energy one must expend to extract the oil
    with the amount we get out—energy return on investment (EROI) as it''s sometimes
    called. Back in those early, early days of exploration you might expect about
    100 barrels of oil for every barrel you needed to expend to drill and pump it.
    Today you might only get five barrels out for every barrel you put in. The effort
    is greatest of all in the shale basins of America, where the breakneck growth
    of the 2010s has been followed with insipid growth in the 2020s.


    Still, the lesson is much the same as with copper: humans have become ever more
    ingenious at out hydrocarbons, whether that be from far under the seabed, from
    far-flung parts of the world or from hard shale rocks rather than reservoirs like
    Ghawar. The Saudi field has gracefully declined rather than collapsing, supplemented
    by newer oilfields along the way. The U.S. fracking revolution means no one seriously
    talks about “peak oil” any'
  merge: -1
  pgno: 307
- img_proc: true
  md: 'more. Or if they do, it is because they are referring not to peak supply but
    peak demand.


    For while natural gas is the most efficient and least pollutant of all the fossil
    fuels—producing a fifth less carbon than oil and a third less than the very best
    coal—it is still part of another problem. As the world''s population and its appetite
    for energy have both grown, so too have our combined carbon emissions.[2]


    Today most of the world''s nations have determined that we must undergo a fifth
    energy transition. This time the objective is not to increase the energy density
    of our fuels, as in every previous transition, but to eliminate carbon emissions
    completely. The goal is to replace almost all our fuel use with renewable resources
    such as hydroelectricity, solar power, wind and nuclear.


    It is already happening. As the energy needed to squeeze oil out of the rocks
    has increased, we have become better at eking more performance out of our engines
    and processes, so the amount of oil it takes to fuel each dollar of economic output
    is falling. The next step is to reduce our overall reliance on crude oil and natural
    gas, and on the basis of what governments were pledging in 2022, global demand
    for oil and gas could plateau by the mid-2020s. Indeed, in an analysis published
    in 2023, oil giant BP said that demand for crude may already have peaked, though
    natural gas consumption would take longer to reach that point. Much, however,
    will depend on whether politicians can match some of their bold promises with
    actions.[3]


    Weaning ourselves off of our oil and gas use can be done. It is not impossible.
    But given how much we depend on them to propel and feed us, this will be no mean
    feat. It will mean building untold new energy capacity across the world: solar
    panels, wind turbines and nuclear plants, at a rate humankind has never before
    achieved. It will mean turning the clock back in an important respect: much as
    our ancestors gave little thought to burning oil, in future we may, once again,
    use this extraordinary substance as a fuel than as a chemical ingredient. The
    complex products distilled in refineries could help us make the battery engines
    we need to deal with the intermittency of renewable power. They can help us manufacture
    the resilient'
  merge: -1
  pgno: 308
- img_proc: true
  md: 'plastics we need for the biggest, toughest wind turbines. But there is no point
    in pretending either that this will be easy or that it will come without some
    uncomfortable compromises.


    Escaping from oil will set us on the road towards a new age of mineral exploitation.
    The black gold of the twentieth century will be replaced by a powdery white gold,
    which promises to power the twenty-first century. On the other side of the planet
    from the Gulf of Arabia, this new age is starting to materialise.


    OceanofPDF.com'
