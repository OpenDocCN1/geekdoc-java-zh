- img_proc: true
  md: 'lead in gasoline would miraculously increase octane levels and stop all the
    pinging. And so began one of the most shameful stories of pollution in modern
    history—considerably more shameful than today’s carbon emissions, since while
    the science of global warming came after the adoption of fossil fuels, everyone
    knew the risks of putting lead in petrol fuel from the start.


    Vitruvian, the Roman philosopher whose recipe for cement helped inspire the invention
    of modern concrete, observed that the men who worked with this heavy metal looked
    desperately unhealthy, and advised people to steer clear of drinking water that
    came through lead pipes. Lead is a powerful neurotoxin, especially damaging to
    the brains of children. Doctors knew, policymakers and most members of the general
    public knew too—rather than seek a way to remove lead, GM simply removed the word
    from the chemical''s brand name: they called it “Ethyl."


    There were warning signs from the start, with a spate of illnesses at a refinery
    in New Jersey shortly after it entered the market. Men were quite literally going
    mad, hallucinating and working themselves up into a frenzy. Some men who died
    in the same place, the section of the refinery where they synthesised tetraethyl
    lead. The unit had been nicknamed the “House of Butterflies,” because people were
    continually brushing imaginary insects off their bodies.[8]


    After news of the deaths, some states banned the use of lead gasoline. It looked
    briefly as if GM would be forced to come up with an alternative (of which there
    were a few, including ethyl alcohol, since this could not be patented and was
    also significantly less lucrative as prospect). But then, in an extraordinary
    stunt, the inventor, Thomas Midley, held a press conference where he washed his
    hands in a solution of tetraethyl lead and spent a minute inhaling its fumes,
    to prove there were no effects. It was a bizarre pantomime, especially since,
    unbeknown to the journalists witnessing it, Midley had just spent a period in
    Florida recovering from lead poisoning himself.[2]


    GM and its lawyers suggested that the men who died must have fallen victim to
    their own negligence and argued the case for progress against inefficient, clanking
    engines. This was the Roaring Twenties with anything'
