- img_proc: true
  md: 'The Salar itself is a salt lake, though it doesn''t look much like the kind
    of salt lakes you might have in your mind''s eye: those massive, flat expanses
    of white like the Great Salt Lake of Utah or the Salar of Uyuni in Bolivia. The'
  merge: -1
  pgno: 311
- img_proc: true
  md: 'Salar of Atacama, by contrast, brown and slightly scaly. The brown colour is
    in fact a very thin coating of sand, which has blown out from the neighbouring
    desert on to the surface here and clings to the salt. The scaliness is a function
    of the fact that the salty surface is still slowly, imperceptibly growing, with
    new stalks of salt reaching like fingers towards the sky. Other salt lakes are
    white and flat because the rain tends to wash away the sand and dissolve the scaly
    claws before they can form. But since it doesn''t really rain here, the fingers
    and claws slowly carry on growing.


    At one point I strode out on this crispy surface and soon realised I''d made a
    mistake. You are supposed to wear tough gloves if you go near the unbroken salt,
    since those fingers and edges are sharper than a chef''s knife. The surface is
    uneven and unpredictable that it is hard to pick your way through without occasionally
    stumbling, and if you stumble and use your hands to break your fall...after five
    minutes of unsteadily picking my way through the thick of salt I paused, looked
    down at my fingers, visualised what they''d look like if I fell and turned back.
    With each stride the salt cracked and snapped at my feet. Strange echoes tweaked
    through the surface like the thawing ice on a Nordic lake. These sounds were all
    the more spooky because I knew a few meters beneath the surface: an utterly gigantic
    underground reservoir of concentrated saltwater. This saltwater, brine, is the
    business; it''s what we are here for. It is a deep, rich solution of many different
    salts of sodium, magnesium, potassium, boron and, yes, lithium.


    There is a certain empiric logic that causes lithium''s place as one of the six
    key members of the Material World. This is a magical metal: alongside hydrogen
    and helium it was one of the three primordial elements created in the Big Bang,
    making it one of the oldest pieces of matter in the universe. No other element
    has quite the same combination of lightness, conductivity and electrochemical
    power. No other metal is quite as at storing energy. So light it floats in oil,
    so you could cut it with a kitchen knife but so reactive that it fizzes and bangs
    when it makes contact with water and air, it is one of those materials you don''t
    ever see in its elemental form outside of a chemistry'
  merge: -1
  pgno: 312
- img_proc: true
  md: 'lab. And this reactivity helps explain why lithium is at the heart of the most
    powerful batteries, and therefore the heart of the twenty-first-century world.


    If we are to eliminate carbon emissions and phase out fossil fuels in the coming
    decades we will have to electrify much of the world (less oil but more copper).
    We need to build many more wind turbines (steel, silica and copper) and solar
    panels (copper and metallurgical silicon), not to mention hydroelectric dams (concrete).
    But none of this will do the trick unless we have a way of storing that energy.
    We will need to store it for short periods to deal with the inherent intermittency
    of renewable sources of energy, such as the sun and the wind. And we will need
    to store it so that road vehicles can get from A to B without burning fossil fuels.


    While batteries do not provide all of the answers, there are a large part of missing
    link that might just get us there. And while there are many other chemicals inside
    batteries—of which, more later—there is no beating lithium when it comes to its
    lightness and its ability to store energy. As science Seth Fletcher puts, “The
    universe hasn''t given us anything better.”[1]


    The reason we are in Chile once again is that in much the same way as there is
    nowhere else on the planet with so much copper, there is also nowhere else on
    the planet where we can lay our hands on so much lithium. The Salar of Atacama
    is the single biggest source of lithium.


    Quite it come to here is one of those mysteries we are only beginning to fathom,
    but as we currently stand, the most compelling explanation is as follows. Think
    of the Salar as a kind of cauldron, with the Andean volcanoes on one side and
    another smaller set of hills on the other. Water comes down from the Andes in
    a number of different rivers, which run down through deep gorges—quebradas—towards
    the basin. Along the way this picks up microscopic amounts of these unusual minerals
    in the Chilean earth, when it hits the bottom of the valley it has nowhere to
    go. Trapped inside the cauldron, the water percolates into the gravelly ground,
    where—this being one of the driest regions on earth—much of it evaporates.


    Only when you imagine this process happening over millions of years of deep time—the
    river water with its tiny quantities ofached'
  merge: -1
  pgno: 313
- img_proc: true
  md: 'minerals coursing into the basin, soaking through the alluvial fan and then
    evaporating under the punishing South American sun—do you start to comprehend
    how this enormous salt lake came to be. Millennium after millennium the water
    evaporated, leaving concentrated liquid cocktail of salts. Millennium after millennium
    the sodium chloride, which precipitates faster than the other ingredients in this
    brine, formed into a crust on the surface: that crust I briefly stumbled over.
    In the oldest sections furthest from the rivers, the salt folded into an entire
    mountain range, the Cordillera de la Sal, as the tectonic plates beneath this
    landscape continued to crunch together. The process is probably still happening
    today, but too slowly to be in any way discernible.


    And there you have it. The Salar is undoubtedly striking to behold, but what is
    more mind-boggling is what lies beneath it. In parts, the salt is at least 3 miles
    thick. In parts there is only a thin skin and beneath it quantities of ancient
    brine, which has sat beneath the surface, soaking underground like a sponge, for
    at least 3 million years. We tend to think of water as being constantly in motion,
    whether in the sea or our rivers or in the droplets that evaporate from lakes
    into clouds which rain down and complete the cycle. But the water here has been
    imprisoned in this dark, salty dungeon—still and inert—since well before the dawn
    of humanity.


    That the batteries in mobile phones, laptops and electric cars are made in part
    from this ancient liquid is one of those paradoxes you are already familiar with
    from the Material World: the very old giving to the very new. But there is nonetheless
    dizzying about it. As you watch the brine watery out of the pipes it is hard to
    get your head around the fact that this is the first time it has seen the light
    for millions of years. Or that it will soon be entombed again inside a battery
    in a contraption on the other side of the world.


    Two companies mine the lithium in the brine. There is Albemarle, which started
    out as a paper manufacturer and chemicals firm before doubling down on lithium
    as well, and SQM, that same chemicals company we encountered back in the salt
    section, which mines caliche and turns it into fertilisers elsewhere in the Atacama.'
  merge: -1
  pgno: 314
- img_proc: true
  md: 'The way this type of lithium mining works is relatively simple. The ancient
    brine is pumped out from under the salt crust, from brine wells located all over
    the Salar. It is channelled into gigantic ponds where the water is evaporated
    away. It is a slow process taking many months: first the sodium chloride precipitates,
    then the remaining brine is channelled into another big pond where the potassium
    salts precipitate, then into another evaporation pond where the magnesium salts
    are removed. Eventually, after well over a year, that brine that left the underground
    reservoir as a pale blue liquid has been concentrated into a yellow-green solution,
    almost as bright as a neon highlighter. At this stage, it is about 25 cent per
    lithium chloride, though the green colour actually comes from the boron still
    in the solution.


    You might have noticed that not only is this process rather straightforward, it''s
    also precisely the same technique the Phoenicians used when making salt in Ibiza
    thousands of years ago and artisan still use today to turn seawater into fleur
