    The only olive-green, lithium-heavy brine from the Salar is tricked in, still
    in liquid form. It is pumped into pipes and chambers where it undergoes more evaporation
    cycles and gets mixed with chemicals, which help it form into a fine, white powder.
    There are various grades, the finest of which sifts the lithium compounds into
    grains measuring barely 5 microns–so small that the powder behaves more like a
    liquid than a solid, sloshing around as you handle it.


    That helped explain why the entire plant was wreathed in white dust. So far in
    my voyage through the Material World I had been engulfed in sparkling iron fireworks
