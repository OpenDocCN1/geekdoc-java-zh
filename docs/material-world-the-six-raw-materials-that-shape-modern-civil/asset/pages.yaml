  md: '# Bibliography


    This book barely scratches the surface of the Material World, but the good news
    is that there is a trove of reading material out there should you want to venture
    deeper. My only warning, and I''m speaking from experience here, is that this
    sort of thing can be extremely addictive. Before you know it, you''re trapped
    deep in a wormhole about alum production or hydrocracking or silicon boules, from
    which it is very difficult to escape. If you''re willing to take that risk, however,
    here are a few places to start.


    If you had to distil the Material World and shape it into human form you would
    end up with something resembling Vaclav Smil, the Czech-born scientist based these
    days at the University of Manitoba in Canada. His research has informed many parts
    of this book and if you are after more, be it the history of fertilisers or the
    arc of human energy use from ancient times to the present day, you will find most
    of it somewhere in his works, many of which are cited below. Perhaps the best
    place to start, though, is with his 2022 book How the World Really Works. Another
    theme thating much of this book—that we call the industrial revolution was really
    an energy revolution—owes a lot to the late Tony Wright, whose 2010 book Energy
    and the English Industrial Revolution transformed thinking on the topic. Energy
    really is everything; the further I ventured into the Material World, the more
    I realised this. One excellent user guide to this is Richard Rhodes''s Energy:
    A Human History.


    If you are interested in material science, a good place to begin is with J.E.
    Gordon''s The New Science of Strong Materials. There are plenty of excellent popular
    science books, too, from Ivan Amato''s Stuff and Stephen Sass''s The'
