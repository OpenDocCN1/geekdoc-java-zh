    # Salt and Power


    Understand the history of salt and you do not merely comprehend the origins of
    trade and commerce; you understand the origins of power and tyranny. For as long
    as there have been rulers, they have sought to rule with salt, controlling it,
    regulating it and taxing it to cement their power, and in no country has this
    been more evident than in China.


    There have been 13 major dynasties in China—some lasting hundreds of years. There
    have been different political currents from feudalism to communism, but throughout
    this country’s extraordinarily long history there has been one institutional,
    one constant: the salt monopoly. The principle that governors should control and
    tax the trade in salt can be traced back far as the seventh century bc, before
    the Han dynasty; before the construction of the Great Wall of China, before the
    Roman Empire or for that matter Alexander the Great or Plato or Aristotle. One
    and a half thousand years before Machiavelli wrote Il Principe, China had the
