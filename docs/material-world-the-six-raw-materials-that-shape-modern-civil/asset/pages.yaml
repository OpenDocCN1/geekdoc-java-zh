    # The Next Greatest Thing


    “Brothers and sisters,” said the man. “I want to tell you this. The greatest thing
    on earth is to have the love of God in your heart, and the next greatest thing
    is to have electricity in your house.”


    This was the early 1940s. The man was a farmer, speaking at a church in rural
    Tennessee. His farm had been electrified not long before and he was occasionally
    seen out there, sitting on a knoll, gazing in wonder at the lights blazing out
    from his house, his barn and his smokehouse.[1]


    The vignette is one of many from the era, as tendrils of electricity spread out
    the cities to the further reaches of rural America, changing people’s lives with
    a suddenness and profundity that is hard today to appreciate.


    There have been many revolutions in our living standards in centuries gone by,
    but few were quite as abrupt and welcome as electricity.


    One way of getting your head round is to consider an iron—not the kind of iron
    you encountered in the last section: instead, the kind you use to press your clothes.


    We give little thought these days to clothes irons, which garner even less attention
    than other simple household appliances like ovens or vacuum cleaners, but it was
    not always so. Ironing used to be very, very different and very, very difficult.
    Before the arrival of electricity,“ironing was the worst,” according to one Texas
    housewife. “Nothing could ever be as hard as ironing.”[2]


    These, by the way, were seriously tough folks, whose definition of “hard” was
    almost certainly qualitatively different to ours. They would spend hours scrubbing
    clothes on boards with caustic soaps that blister their skin. They'
  merge: -1
  pgno: 211
- img_proc: true
