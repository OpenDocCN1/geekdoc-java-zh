    ponder for a moment that it may well have been made of the sands from their mysterious
    drowned world, out in the middle of the North Sea.


    In the world of concrete, mundaneness often sits alongside the mystical and wonderful,
    seemingly dead rocks are in fact alive and the ancient is moulded into something
    resembling the future. The barges dredging sand from Doggerland routinely discover
