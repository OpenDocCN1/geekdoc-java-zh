  md: '# Unmanufacturing


    BRUSSELS, BELGIUM


    If you ever find yourself in Brussels, here is a sightseeing tip. Head for the
    Royal Palace, the grand eighteenth-century building where state occasions occur.
    But once you arrive, don''t loiter outside the front with the rest of the tourists—instead,
    walk around the outside, down the Rue Ducale, until you find yourself at the back
    gates.


    There you see a bronze statue of a middle-aged man. The man might almost pass
    for a monk, dressed in a kind of smock with a long, square-cut beard. He sits
    on top of an enormous steed, gazing imperiously upon what used to be a grand avenue
    but is now an ugly underpass with glass-fronted office blocks. The last time I
    passed by, there was a homeless man asleep on the steps beneath the statue. Young
    people often come here on summer evenings, to sit and smoke and drink cans of
    beer. For a long time the plinth and what sat on top of it were just another part
    of the urban furniture.


    Except that this is no monk. The man on the horse is Leopold II—the Belgian king
    who ran Congo as his personal fiefdom for more than two decades at the turn of
    the twentieth century. Under his rule, millions of people in Congo died as their
    colonial overlords became rich, from the rubber exported to become tyres in the
    first automobiles, from the ivory from slaughtered elephants and, most of all,
    rich from the proceeds of this country’s extraordinary wealth.[11]'
  merge: -1
  pgno: 347
- img_proc: true
  md: 'King Leopold II, who never even set foot in Congo and hence never had to confront
    with his own eyes what was happening in that erstwhile Material World, died more
    than a century ago. But he still casts a long shadow over Belgium, which seems
    frozen in the headlights of history, unsure or unable to deal with the legacy
    of its brutal baggage. Very so often the statue is defaced, then the graffiti
    painstakingly removed, and an earnest conversation follows about what to do next.
    After the death of George Floyd in 2020, this statue—and a number of other statues
    of Leopold II—were graffied. His hands were painted blood red. “THIS MAN KILLED
    15M PEOPLE,” read the words sprayed on the plinth. The paint was cleaned away
    and a report was published a couple of years later raising the prospect of melting
    down the statue and reforming the bronze into something commemorating the people
    of Congo, at the time of writing at least, Leopold is still up on his saddle,
    looking as disapproving and unrepentant as ever.


    The legacy of colonialism is the unpleasant underbelly of the Material World.
    Belgium, of course, was hardly the only country engaged in the “scramble for Africa.”
    Britain, France, Germany, Spain and the rest also raced to invade, divide and
    control the continent, exploiting its minerals, trading them elsewhere and pocketing
    the proceeds. A similar process occurred many times before, from ancient Rome
    through to the conquest of the Americas, but this scramble for resources (both
    mineral and, in the form of slavery) was particularly brutal.


    Occasionally the exploitation benefited the colonised citizens, but more often
    than not the money flowed instead to their rulers. Meanwhile the occupied cities
    suffered a destructive legacy that endured long after their overlords left. Indeed,
    while you might have expected nations with mineral wealth to enjoy better prospects
    than their neighbours, invariably the opposite was the case, as geological abundance
    correlated with weak economic growth. And when it comes to the “resource curse”—a
    consequence in part of the endemic corruption fuelled by the availability of mining
    royalties—few countries provide as vivid case study as the Belgian Congo, or as
    it is known today, the Democratic Republic of Congo (the DRC). Here, per capita
    is among the world’s lowest, as is'
  merge: -1
  pgno: 348
- img_proc: true
  md: 'life expectancy. Most of the country lives in crushing poverty while a handful
    of people make untold sums. Yet no other country in the world has quite the same
    kind of endowment of critical minerals.


    In the preceding pages we have visited some of the world’s richest sources of
    minerals, but few can claim to be genuine anomalies. Chile and the Pilbara have
    extraordinary amounts of copper and iron respectively, but you can find other
    spots with similar grades, if not quantities, of these metals. The DRC, on the
    other hand, sits astride a set of unique geological features. The most famous
    are to be found in the former Katanga province in the south of the country.


    Situated there is an old mine called Shinkolobie, which boasted the richest uranium
    reserves ever discovered anywhere in the world: nearly 70 percent concentrations,
    compared with 0.01 per cent elsewhere. For a period in the early twentieth century,
    this mine had an effective monopoly on the world’s supply of uranium, most of
    which was shipped to Belgium for processing. Little Boy, the atom bomb that fell
    on Hiroshima, was filled with uranium from Katanga.


    There are extensive deposits of copper and astounding quantities of. Cobalt is
    often found alongside copper ores but the grades are mostly minuscule, well below
    1 per cent. Here, thanks to a quirk of geology, they are mind-blowing: as much
    as 10 to 15 per cent. There is nowhere else on the planet quite like it.


    By now you have noticed that cobalt is not one of the six chief substances in
    the Material World. This is not to imply that it’s not extremely important. It
    certainly is. Many lithium-ion battery recipes rely on cobalt to help electrons
    pass safely from cathode to anode. Cobalt is a crucial ingredient in steel alloys
    and the fact that so much of it is located in a single country—an unstable one—has
    many governments around the world have long fretted about its availability. Conditions
    in some of the unofficial “artisanal” mines are frequently horrendous, with families,
    including young children, often using hand tools to scrape away the ore from the
    red earth in the southern DRC. There are no regulatory protections or healthcare
    here and fatal accidents and injuries are commonplace. So there are important
    reasons'
  merge: -1
  pgno: 349
- img_proc: true
  md: 'to be concerned with the supply of cobalt. But the reason it didn''t quite
    make the grade is simple: you can, these days at least, make decent batteries
    without it—something you can''t really say about lithium,[2]


    But the company that once extracted all that uranium, copper and cobalt might
    end up playing an important role in the future of lithium. Walk round to the back
    of the statue of Leopold in Brussels and you will see an old copper plaque which,
    in archaic French script, says: “The copper and tin of this statue come from the
    Belgian Congo. They were donated by the Union Minière du Haut-Katanga.”


    Save for Leopold himself, no other single institution stood for Belgium''s exploitation
    of Congo''s resources quite as directly as the Union Minière. Starting in 1906,
    the king sought to transfer ownership of this African nation to the Belgian state,
    this company controlled and ran Congo''s mining industry. Copper and cobalt, tin
    and uranium, zinc and germanium, silver and gold—they were all mined by the Union
    Minière, with most of the profits back home. If Belgium owed much of its wealth
    in this period to it did, then the central vector in this appropriation was the
    Union Minière. By the 1920s it was the world''s biggest cobalt miner—not to mention
    the world''s foremost provider of nuclear fuel.


    As many as a quarter of a million people were pressed into working for the company,
    it was more like a political institution, a one-party state in Katanga. Intransigent
    workers were routinely flayed with the chicotte—a whip made from strips of dried
    hippopotamus hide—even after corporal punishment was supposedly outlawed. Other
    African countries won independence in the middle of the twentieth century, the
    Union Minière funded political parties and intelligence agencies trying to fight
    the cause. These movements for self-rule were went the propaganda, all part of
    a Soviet plot.[3]


    And when independence finally came in 1960, the company supported plans for Katanga
    to become a breakaway republic, similar to South Africa''s apartheid state. The
    plot failed, but Congo''s first post-independence leader, Patrice Lumumba, was
    deposed in a CIA-backed coup and handed over to'
