    CHUQUICAMATA, CHILE


    At first glance Chuquicamata looks a lot like many of the other small mountain
    towns you find throughout the north of Chile.


    Roll down the main road and you see a bank, a cinema, a library and a smart little
    hotel. There is a playground with slides and swings and a garish model of Pinocchio.
    There is a plaza with bandstand and a small stadium—the Estadio Anaconda.


    As in many other towns in this region of Chile, an area which used to be part
    of Bolivia, nearly every other street is named after heroes from Chilean history:
    here is Calle Lord Cochrane, after the British naval officer who helped the country
    fight its way to independence, and there, running parallel, is Calle Arturo Prat,
    after the hero of the Saltpetre War. The painted surfaces of these glimmer the
    cobalt sky that dwarfs all human life in the high desert.


    But there are two things about Chuquicamata that are very unusual indeed. The
    first is found if you follow the main road as it snakes north-east away from the
    town square, towards the mountains on the horizon. After a minute or two the residential
    areas give way to enormous warehouses of concrete and corrugated iron. There are
    strange dark pools, dusty railwayards and piles of rock everywhere. Then, after
    a few more turns of the wheel, you pass through a tunnel and suddenly before you
    is an enormous crevasse. Here,'
  merge: -1
  pgno: 223
- img_proc: true
  md: 'at the top of what should be a hill, is the most almighty canyon: the bottom
    is

    barely visible; the sides are steep enough to induce a vertiginous shudder.


    But this is no canyon, this is the Chuquicamata copper mine. It is a

    monumental hole gouged out of the landscape of the Atacama Desert.

