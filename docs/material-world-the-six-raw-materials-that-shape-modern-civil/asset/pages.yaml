    # Concrete and Climate Change


    These problems, however, pale in comparison with the environmental implications.
    The other course of concrete is that it is one of the biggest emitters of carbon
    on the planet. For all the attention lavished on other sources of greenhouse gases
    such as aviation or deforestation, the production of cement generates more CO²
    than those two sectors combined. Cement production accounts for a staggering 7-8
    per cent of all carbon emissions.


    At the time of writing, global emissions are split roughly 60:40 between the chemical
    reaction occurring in chalk or limestone as it burns its carbon in the process
    of becoming cement, and the energy needed to heat the kiln. The latter is relatively
    easy to resolve by using alternative fuels rather than fossil fuels to heat the
    kiln. The cement plant at Rugby has swapped most of its calc with something called
    Climafuel, essentially a form of processed waste. Developed economies, including
    the UK and the U.S., have managed to reduce their cement carbon emissions by more
    than 50 per cent, thanks in this kind of substitution and in part by adding other
    products to the powder that comes out of the kiln.


    But the chemical reaction is a far harder to crack. Humans have been heating calcium
    carbonate to produce calcium oxide or quicklime, the central reaction in the production
    of cements, for thousands of years; indeed, this'
  merge: -1
  pgno: 73
- img_proc: true
  md: 'process was humankind’s very first large-scale carbon emission, millennia before
    the era of fossil fuels. And we have yet yet to find an easy way of removing the
