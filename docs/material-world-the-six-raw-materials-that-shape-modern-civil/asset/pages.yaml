    the refining of metals at its plant in Hoboken, on the outskirts of Antwerp, where
    it had begun extracting silver from lead concentrates all the way back in the
    nineteenth century. In 2001 the company was consolidated into a new legal structure
    and renamed Umicore, those first letters the main remnant of its colonial past.


    Even after Congo''s independence, however, the firm was plagued by occasional
    controversies. In the 1970s it emerged that children living near the Hoboken plant
    had extremely high levels of lead in their blood. There is, as we saw previously,
    no safe level of this poisonous metal, especially for children, yet particles
    of lead had been drifting out around the neighbouring area for decades. Attempts
    to bring down the pollution, cleaning the local houses and yards, seemed to be
    bearing fruit, only for lead levels in children''s blood to spike again in 2015
    and then in 2020. The plan was to try to buy up the neighbouring homes and replace
    them with green space, but many of the locals were refusing to sell.[14]


    Anyway, put all of this together—the uranium in nuclear bombs, the shameful history
    of exploitation in Congo, the lead poisoning of local children, for heaven''s
    sake—and you might not be inclined to look ever upon a company like Umicore. But
    here''s where things get—weird, for this firm, with its “colourful” history, might
    be one of the most important cogs in the machine helping us towards a green future.'
