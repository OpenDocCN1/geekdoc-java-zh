    The deeper you delve into concrete, however, the more awe inspiring it. Much as
    with glass, we still have yet to understand fully what is happening at the heart
    of concrete when it is setting. In some respects, those dull, brutalist monoliths
    in our city centres are more alive than anything else in the urban environment.
    The concrete is still curing, the stones reacting with the environment. Even the
    Hoover Dam, the enormous Depression-era project on the Colorado River, is still
    thought to be curing today—gaining ever so slightly in strength with each year
    that passes.


    While the terms are sometimes used interchangeably, concrete and cement are not
    quite the same thing. The simplest way to put it is that cement is the magic ingredient,
    the glue, that sticks concrete together. The cement itself is a powder when you
    roast and crush limestone or chalk along clay, and occasionally, some other additives
    such as iron oxide. When you add water, the calcium and silicon in the cement
    react with it to form a gloopy grey gel, inside of which are millions of microscopic
    stony tendrils. These tendrils, crystals of calcium silicate hydrate, grow and
    mesh and spread their fingers through the grout, locking in the water and forming
    a kind of skeletal stone-like structure. Add some gravel and sand to the initial
    mix and, rather than just bonding to themselves, these tendrils will glue themselves
    around the stone and sand too, creating concrete. Liquid stone. A rock can pour.[16]


    There is art in the pouring and the finishing. I vividly remember watching a craftsman
    finishing the concrete that would become the wall of an underground tunnel a few
    years ago. He carefully, lovingly almost, ran his trowel over it, smoothing a
    surface that would probably never be glimpsed by human eyes. It was like watching
    a sculptor at work.


    Some would suggest that for all its scientific advantages, concrete nonetheless
    lacks a sense of place. After all, the most glorious urban environments are products
