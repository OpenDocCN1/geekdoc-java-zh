    # The Invention of Mining


    Humanity’s relationship with copper predates electricity. There is no cute origin
    story like the one about the Phoenicians on a Mediterranean beach heating sand
    and accidentally discovering glass. But the discovery of how to smelt this metal
    probably happened at roughly the same time: 6,000 years or so ago, probably somewhere
    in the triangle between Armenia, Turkey and Egypt. On certain mountains in Cyprus
    you stumble over dark fossilised bits of slag—remnants of the very earliest mining
    and metal processing. These are the charred waste products from our ancestors
    heating up to produce liquid copper thousands of years ago. For those who witnessed
    this might have been dumbfound: through some form of alchemy or magic, wise men
    could make seemingly red liquid metal spring forth from what looked like simple
    stone.[10]


    That shift from stone to metallic tools gave rise to what anthropologists call
    the Copper Age or Chalcolithic period (from the Greek for copper—chalkos). That
    was followed by the Bronze Age, when people discovered that when copper was combined
    with tin it produced an alloy that was stronger and harder and far suited to being
    used in tools. Bronze tools allowed our ancestors to hunt, to build and to fight.
    This all predated the age of iron, whose strength and workability would outdo
    bronze. Then again, the real copper age, the one that still matters today, was
    yet to come.


    Over the years, the centre of the copper trade flipped from one country to another,
    from Cyprus to Israel, from the rich Spanish deposits of Rio Tinto to Sweden’s
    Kopparberg—the great copper mountain. While it was Saxony in what is now Germany,
    where as they did with concrete and glassmaking, local tradespeople imposed a
    new rigour on the discipline, founding the very first mining schools and turning
    what was an informal trade into something resembling a profession.'
