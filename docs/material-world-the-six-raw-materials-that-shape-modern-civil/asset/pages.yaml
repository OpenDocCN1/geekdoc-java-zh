    diminishing the strength of the eventual cement. You can add other substances
    such as fly ash and limestone. These techniques are now widely practised, and
    have helped to reduce carbon emissions, but they cannot eliminate them altogether.
    For the cement industry is putting its hope in something called carbon capture
    and storage (CCS). You do not go far in the Material World without hearing about
    CCS, a technology that would filter the CO2 out from chimneys and into a substance
    that could be stored elsewhere, most likely underground. The problem with CCS
    is that while it works in theory, it is so expensive that it is hard to make the
    sums up—especially in a high-volume, low-margin sector like cement.


    The same issue of scale overshadow some of the more radical solutions to concrete’s
    carbon problem. There are other ways of making cement, which bypass that chemical
