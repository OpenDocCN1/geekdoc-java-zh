  md: '# The Everything Thing


    There’s an old story people sometimes tell about John D. Rockefeller, the man
    who built the Standard Oil empire in the early days of crude. One day he was looking
    out over one of his refineries when he noticed flames flaring from one of the
    chimneys.


    “What’s burning?” he asked one of his lieutenants. The explanation came back that
    it was a by-product of the refining process. As they distilled and cracked each
    fraction of crude they invariably ended up with certain compounds for there was
    no market. This one was called ethylene gas.


    “I don’t believe in wasting anything,” snapped Rockefeller. “Figure out something
    to do with it!”


    The tale is almost certainly apocryphal, but it’s a helpful anecdote to have in
    the back of your head as we spend a moment contemplating the weird, wonderful
    and worrying world of petrochemicals. For the story of crude oil goes hand-in-hand
    with the story of the modern consumer age.


    The more oil plants like Wesseling refined, the more by-products they were left
    to sell on for other uses, which mostly meant plastics, pharmaceuticals, fertilisers
    and the panoply of other petrochemical products. That these products have become
    cheap, disposable and ubiquitous is precisely because of the staggering amount
    of oil processed by refineries, primarily for gasoline and diesel. When people
    talk about how the motor car changed the world, they are invariably referring
    to what it meant for personal independence, for freight and for mobility, but
    this is only half of the story. For, barrel by barrel, refiners and the motorists
    buying their petrol quite literally fuelling another sector altogether.'
