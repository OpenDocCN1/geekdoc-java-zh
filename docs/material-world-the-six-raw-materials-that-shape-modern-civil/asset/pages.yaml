    the reserves of iron ore.


    Iron, gold, uranium, copper, lithium: there are few good reserves of these minerals
    anywhere in the world that do not, one way or another, disturb the rights and
    memories of those still living on the surface. Perhaps what makes the destruction
    of the Juukan caves most disturbing is that we are all, one way or another, complicit.
    Cheap iron ore from Australia is part of reason China has been able to carry on
    producing cheap goods for the rest of the world. That cheap iron ore has become
    the steel from which China has built the factories and machinery where our smartphones
    are made, where batteries are assembled, where the toys for our children are manufactured.


    Today, or perhaps tomorrow, another enormous blast will propel thousands of tonnes
    of Pilbara ironstone a few feet into the air, before it lands as a pile of rocks.
    The rocks are excavated by church-sized diggers and heaved off to be crushed and
    sorted, before being loaded into a train north for Port Hedland. There, at what
    is now the world''s largest port for bulk export—most of iron ore, but also salt
    and these days lithium—the Pilbara earth will be loaded on to massive ships, which
    will transport it around the world: to China, to Japan, to Korea, the U.S. and
    occasionally even the Port Talbot selects in South Wales.


    This is the iron ore that is, ever so gradually, correcting steel-per capita inequality
    between nations, helping Asia and Africa build the highways, railways, schools
    and health clinics which will need if they are to bring their living standards
    in line with the rest of the world. Yet as you survey the various impacts here—the
    levelling of the Pilbara''s extraordinary hills and gorges, the desecation of
    cultural sites and the puffing of vast quantities of carbon dioxide into the air—is
    it not tempting to ask whether there might be some better way of doing all this?


    # The Scrap Steel Age'
  merge: -1
