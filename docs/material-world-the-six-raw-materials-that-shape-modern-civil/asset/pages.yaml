  md: 'Cristina did not set out to become a campaigner or indeed to spend her time
    vying with lawyers, drafting a document designed to change the fundamental laws
    in Chile. She spent most of her career studying obscure algae in the Salar, only
    to be thrust into this strange world when she found data suggesting a fall in
    the population of flamingos feeding on the algae.


    “It’s a big paradox. In the middle of the Atacama Desert—the driest desert in
    the world—to be evaporating water,” she said, before pausing and looking once
    again at the neighbouring jetty.


    “We need to understand that there will probably be other types of batteries,”
    she said. “We already had this experience with nitrates. Almost all the Chilean
    economy was based on nitrate exploitation, but then suddenly the Germans invented
    artificial nitrates and [sparked] one of the main crises in this country—especially
    in this area.


    “This dependence on raw materials could also put us in a very difficult situation
    in the future.”


    We have, in other words, here before. If you travel up from Antofagasta, through
    the hills, behind the colourful shacks of the shanty town, and follow the railway
    line as it ascends towards the Andes, after about 10 miles you will come to a
    dilapidated hunk of buildings and a sign: O''Higgins.


    Named for the man who freed Chile from Spanish rule, this was one of the railway
    line’s first stations, built to connect to one of those early caliche mines. The,
    of course, is long gone and the station long abandoned, but the trains still clank
