  md: '# Conclusion


    In the course of this book we have zipped back and forth through time. We have
    sped along the four great energy transitions of the modern era and touched upon
    the fifth. We have piggybacked on atoms of silicon and lithium as they journeyed
    around the world to become semiconductors and batteries. Down the pipes of an
    oil refinery we went, into the furnaces where sand is melted into glass and along
    the copper wires which power the modern world, but this was nonetheless the merest
    whistlestop of the Material World. It is but a brief window into these hidden
    networks of substance and intelligence that make the world go round.


    Far from being independent from the physical world around us, we have never been
    more reliant upon it, whether that is the energy in a molecule of natural gas,
    the concrete without which the built world would crumble or the fibre optics through
    which most of our data travels. What makes these six materials so special is not
    merely that they are so good at what they do—from the electrical conductivity
    of copper to the energy density of oil—but a few other things too.


    The first is that we have worked out how to turn complex products into commonplace
    items. The smartphone in your pocket and the computer I''m typing this on are
    only the beginning of it. Everyone vaguely comprehends that the silicon chips
    inside them are objects of astounding complexity, though maybe not the extent
    of it—that the transistors are now far smaller than a virus and be dwarfed by
    one of your red blood cells. However, the fact that so few people pay much attention
    is not something to despair about. It is a mark of success. It is all very well
    creating mind-blowing objects in a laboratory, but creating something that is
    both mind-blowing and goes'
