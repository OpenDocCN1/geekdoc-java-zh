  md: '# The Third Great Energy Transition


    The industrial revolution was not just a revolution of ideas and engineering and
    chemistry; it was an energy revolution. The vast majority of processes you have
    encountered in the preceding pages, from the transformation of sand into glass,
    through to the creation of silicon chips, the production of chlorine out of brine,
    the conversion of iron into steel and the generation of electricity, depends on
    enormous amounts of energy, most of which is currently delivered to us, directly
    or indirectly, by fossil fuels. The extraordinary explosion of wealth and wellbeing
    that began somewhere in the middle of the nineteenth century might be seen as
    an extraordinary harnessing of these fuels to do stuff.[88]


    We have spent much of the past centuries gradually climbing up a thermodynamic
    ladder. Coal has about twice the amount of energy that can be released per kilogram
    of weight—or kerosene, refined from crude oils, has nearly twice the energy density
    of coal. And a higher energy density means you can carry less fuel and greater
    distances. That mattered back in the earliest industrialised era: fuelling a ship
    with wood rather than coal would have meant giving more than twice its storage
    space to fuel. And it mattered in the era of the combustion engine and jet travel.
    Part of the explanation for why powered flight happened at all is that kerosene
    is incredibly energy-dense.


    Then there were the practical advantages. Coal had to be shovelled into a furnace
    when liquid fuels could be pumped, opening up the possibility of internal combustion,
    which allowed engines to be considerably more efficient than steam engines of
    previous centuries. It could be pumped up from beneath the ground, meaning miners
    did not have to be sent down into the depths, and pumped easily into ships and
    pipelines. It is hard to imagine the modern world without oil and it is hard to
    imagine the oil age without the vast quantities of oil coming from Saudi Arabia.


    Yet in pumping the oil from the ground, we are breaking a geological cycle that
    goes back more than 100 million years—long before our species existed. And in
    burning oil and gas we are sending the carbon dioxide that'
  merge: -1
  pgno: 266
- img_proc: true
  md: 'was sequestered long ago into these underground reservoirs back into the atmosphere,
    precipitating a new age of global warming. What makes this all the more uncomfortable
    is not merely the bad stuff—the carbon emissions whose consequences we are finally
    starting to understand, the pollution in our cities and the plastic waste in our
    seas—but the good stuff too. It is the billions of lives lived thanks to oil and
    gas. It is the fact that oil and gas are so useful as well as destruct.


    When scientists discovered the hole in the ozone layer it didn''t take long to
    engineer near-identical alternatives to the chlorluorocarbons that were mostly
    responsible. It was possible to save the environment without even noticing. Oil
    and gas are by their very nature trickier to substitute since they represent an
    almost perfect energy source and a near irreplaceable feedstock into every manufactured
    product. Weaning ourselves them will take far more than a bit of goodwill and
    a net-zero target.


    It is possible. And in the following chapters we will explore some of the ways
    it might do. It will be very difficult, both because oil and gas are so good at
    what they do, and because we remain so utterly, hopelessly reliant on them: dependent
    as I write this in 2023, and on the basis of even the most optimistic projections,
    dependent in 2030 and 2040.


    That might sound somewhat surprising given how much talk there is about renewable
    energy, given how many wind turbines and solar panels have been constructed in
    recent years, and given the rapid rise of electric vehicles. Yet a few datapoints
    tell the story clearly enough.[9]


    As of 2019, right before the pandemic struck and skewed the data, just over 80
    per cent of the world’s primary energy—which includes both electricity generation
    and all other uses as transport, heating and industrial processes—came from the
    burning of fossil fuels: coal, oil and gas. The striking thing about this number
    is how stable it has: just over 80 per cent at the turn of the millennium, just
    over 80 per cent in 1990 and only a touch higher—around 85 per cent—in 1980. Wind
    and solar, by contrast, provided just 1.5 per cent of our energy in 2019.


    Even today, then, we live in a fossil fuel world, and even as many countries reduce
    the rate at which they burn coal, they are maintaining or'
  merge: -1
  pgno: 267
- img_proc: true
  md: 'increasing their reliance on oil and gas, which provide about 55 per cent of
    our energy today—a proportion which has stayed remarkably static for the past
