  md: '# THE PKI UNDER ''GUIDED DEMOCRACY'' 99


    Overall, although the PKI had grown rapidly and took matters of organization seriously,
    the outward appearance believed significant strains that were the result of its
    rapid expansion. The party developed mechanisms to enhance control and ideological
    education, as well as to keep senior cadres in touch with the grassroots, and
    in this context the PKI drew creatively on practices from communists abroad. However,
    exerting control over such an expansive organization was a huge challenge. A combination
    of growing bureaucracy and widening social and generational divisions meant that
    the organic connection between the leadership and activists at the grassroots
    was weakening. In attempting to weld together the logic of a cadre party and a
    mass party, the PKI had simultaneously become more bureaucratic and more loosely
    woven.


    # Entrenched Resistance to the PKI


    Guided Democracy has often been described as a ''balance between the PKI and the
    army'' in which President Sukarno acted as a figurehead and mediator.⁴ This may
    have had some truth in parts of Central and Eastern Java where the PKI was particularly
    strong, but in West Java the balance between the PKI and a coalescing anti-communist
    coalition was waged against the PKI.⁵ As the PKI grew, so did the determination
    of other groups to push back against it. This was evident in the resistance from
    rival political parties in the regional assemblies, as well as in the PKI''s relative
    weakness in the quasi-governmental National Front organization, although ultimately
    the most important factor was concerted opposition from the well-entrenched Siliwangi
    Division.


    Amid the growing divides of the Guided Democracy period, the PKI sought out allies
    where possible and was willing to work with others in local government. Following
    the regional elections of 1957, branches of the PKI tried to form local coalitions
    with other parties or factions.⁶ The situation


