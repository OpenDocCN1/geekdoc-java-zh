  md: '# THE PKI AND ALLIED MASS ORGANIZATIONS 133


    the provinces have also received limited attention. Studies have also tended to
    focus on a single organization or field of activism. As a result, less consideration
    has been given to overarching patterns or comparisons between the organizations
    that became allied to the PKI. In this turn has limited the potential for a re-evaluation
    of the collective significance of the mass organizations and a reappraisal of
    the relationship between the PKI and society.


    This chapter takes a more holistic approach to the mass organizations allied to
    the PKI, looking across a range of the most allied organizations and considering
    developments both at a national level and the ground in West Java. The chapter
    discusses the Party''s entanglement (among others) without reducing them to party
    ''fronts''. It traces the growth of the PKI''s influence within the mass organizations
    over time and the strengthening of hierarchical tendencies. The effects of the
    PKI influence varied by organization, in some cases reigning in grassroots militancy,
    but stoking it in others. However, the chapter also shows how the mass organizations
    manifested a dynamism that stemmed from their affinity with the needs and aspirations
    of ordinary people, a vitality that was only diminished in the increasingly authoritarian
    Guided Democracy period. The PKI''s ability to tap into these energies was a crucial
    element in the party''s rapid growth, and also reflected the party''s to adapt
    and embed itself in varied social contexts.


    The following sections focus in particular on the most prominent of these mass
    organizations: for labour, peasants, youth, women, and artists. These organizations
    have been chosen on the basis of a combination of their size, prominence in public
    life, and their importance to the PKI.¹⁴ The conclusion draws these threads together,
    considering these mass organizations collectively as part of a web of social relations
    at the interface of the party and society.


    The chapter sees the relationships between the PKI and allied mass organizations
    as combining elements of hierarchy, organic solidarity and pluralism. The organizations
    had distinctive priorities, and members with heterogeneous views, which also drew
    on some common


