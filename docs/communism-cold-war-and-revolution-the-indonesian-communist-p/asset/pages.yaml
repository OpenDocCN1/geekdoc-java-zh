    were particularly vulnerable to sexual assault.^44 Forced labour of political
    prisoners was widely used.^45 A national framework for the detentions was laid
    out in a series of orders issued under the Operational Command for the Restoration
    of Security and Order (Komando Operasi Pemulihan Keamanan dan Ketertiban, KOPKAMTIB),
    a military command structure under Suharto’s authority.^46 However, the language
    of these orders was vague and provided regional commanders with extraordinary
    discretion which was reflected in the regional variation of numbers detained:
    a peak of 10,000 in West Java contrasted with 25,000 in East Java and 70,000 in
    Central Java.^48 The ‘discretionary power’ of regional commanders was also an
    important factor in variations in the lethality of the anti-communist violence,
    as is explored below.


    One of the earliest and most extreme instances of mass killings in West Java occurred
    in October 1965 in the Subang area, with killings in Subang accounting for perhaps
    half of the total killed in West overall.^49 According to Ul Sundhausen, on the
    basis of interviews with Siliwangi officers, violence started in the Subang area
    in early October. In his version of events, Lt. Col. Otje Djundund, head of Subang
    District Military Command (Komando Distrik Militer, Kodim), had few men at his
    disposal, but along with his superior, Col. Witono, head of the Cbon Inter-District
    Army Command (Komando Resor Militer, Korem), he agreed to cooperate although Adjie
    had not given his permission for strong anti-communist action. Subsequently, Otjie
    gathered some anti-communists who pulled down PKI signs and wrecked offices of
    communist unions. Once action had got under way it was fairly out of the control
    of Kodim command. Moslems and supporters of the banned PSI started to kill communist
    cadres and members.^50


