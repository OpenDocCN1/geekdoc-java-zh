    performed particularly strongly in West Java, gaining the highest vote share of
    any party in the province (26 per cent). Masumi was also particularly dominant
    in Banten and Bogor, the PKI was at its weakest, despite a history of communist
    activism in those areas. Religious culture and ethnic identity intertwined: the
    PKI’s strength in the ethnically Javanese areas of East and Central Java also
    corresponded to areas where Masumi was weak. The PKI performed well in areas of
    West Java with a stronger Javanese influence, such as districts of Cirebon and
    Ciamis near the border with Central Java (see Map 1.1 for results across West
    Java). Socio-economic dimensions were another factor shaping the distribution
    of support. The urban and industrial centres of Cirebon and Bandung (was as well
    as Sukabumi and Tasikmalaya), saw PKI vote shares.222 The party also did well
    in areas with a large-scale agro-industry presence, such as the plantations of
    Subang and Ciamis, and the district of Cirebon with its sugar industry.223


    Evidence from district and subdistrict electoral results provides indications
    of the importance of grassroots networks. The party’s strong performance in the
    Cirebon and Bandung areas built on long-term activist efforts. Fragmentary subdistrict
    electoral sometimes makes it possible to track the extension of these networks
    at a more granular level.224 In the area around Bandung, for example, the PKI
    performed strongly in parts of the hinterland such as the districts of Ujungberg,
    Cicadas, Cimahi, and Cisarua, which reflected the party’s success in reaching
    its adjacent areas which were suffering from a combination of population pressure
    and tensions over land. Transport links were also important in facilitating the
    extension of party networks. This was a factor in the relatively strong areas
    of support for the PKI in the subdistrict around the road and rail hubs of Ciampek
    in Karawang and Banjar in Ciamis, as well as Jatibarang and Lobener in Indramayu.
    This also fits with data district level, with the PKI’s lowest vote share coming
    in the geographically isolated district of Pangelang in the south-west of Banten
    (although the strength of Masumi in the district was a factor too).


