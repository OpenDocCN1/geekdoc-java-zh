  md: '# 226 COMMUNISM, COLD WAR, AND REVOLUTION


    The PKI''s violent destruction occurred in a period when Cold War competition
    in Southeast Asia was intensifying, with conflict escalating in the Indochinese
    peninsula. A tendency to see events through a Cold War lens explains why officials
    in the US (and some of its allies) not remained silent during the massacres, but
    colluded with the PKI''s destruction. In an Indonesian context, accusations that
    the PKI were stooges of Moscow or Beijing and that the PKI''s opponents were in
    the thrall of Western imperialism contributed to growing polarization. Cold War
    tensions had fed into a longer-term process of polarization within Indonesia.
    This was evident in the support given by the US and some of its allies to the
    regional rebellion in the 1950s, and in the efforts of the US to bolster the Indonesian
    army as a bulwark against communism. The increasingly radical rhetoric of the
    PKI, in part reflecting a growing affinity with Chinese communism, also raised
    the political temperature.


    As well as Cold War flashpoint, it is also helpful to view the destruction of
    the PKI in terms of a broader counter-revolution involving the ''composite'' mobilization
    of forces led by state actors. Evidence from West Java reaffirms the army''s key
    role in driving the anti-communist violence, via a campaign of propaganda and
    the widespread use of forced disappearances over detention. The lower levels of
    violence in West Java than Central and Eastern Java were influenced by the approach
    of the Siliwangi''s leader General Adjie, though this as much as to a concern
    for maintaining order as ''Sukarnoism''. The smaller size of the PKI in West Java
    as compared with that of Central and Eastern Java was also part of the context
    for lower levels of violence, as was warness mobilizing civilian militias in the
    context of a history of counter-insurgency efforts. The cutting edge of the counter-revolutionary
    coalition in West Java was a group of radical Siliwangi Division officers who
    wanted more drastic action against alleged communists than their commander. This
    group backed by the central military command and more willing to mobilize civilians
    to participate in anti-communist killings in West Java to a significant extent
    reflected the fall, then rise of this group.


    Beyond the killings, the radicals within the Siliwangi Division also worked closely
