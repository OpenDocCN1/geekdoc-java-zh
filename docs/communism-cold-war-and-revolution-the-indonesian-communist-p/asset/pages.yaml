    puzzle of why Adjie was the first commander to ban the ‘Sukarno Front’ organization,
    a body set up to mobilize popular support for the president. The ‘entrenchment
    model’ helps raise the issue of army-civil relations and the geographical variation
    of violence within West Java. However, as the ‘Adjie-Sukarno thesis’, there is
    a tendency to treat the Siliwangi Division as inherently unified.⁸ The model also
    struggles to explain why some mass killings occurred in some parts of the province,
    where Darul Islam had previously been strong and where the Siliwangi Division
    was likely to be well entrenched. Additionally, none of the approaches outlined
    above has much to say about the precise timing of the violence in West Java. The
    analysis below addresses some of the limitations of existing analysis. It pays
    close attention to when and where killings occurred in West Java and argues that
    greater attention needs to be paid to competing coalitions within provincial army
    divisions and how these intersected with the army command in Jakarta and with
    the mobilization of civilian allies.


    Before examining the killings that occurred in West Java in more detail, it is
    important to note the importance of a vicious anti-communist propaganda campaign
    and an accelerating process of mass detention that fed into escalating violence
    from late 1965. Despite the lack of evidence implicating the PKI’s membership
    (as opposed to individual leaders) in the Thirtieth September Movement, the military-supervised
    press carried out a campaign of misinformation. A national propaganda campaign,
    which accelerated as October progressed, implicated the PKI as a whole, as all
    its allied organizations, and depicted a vast conspiracy reaching down to the
    grassroots.⁹ The Bandung Pikiran Rakjat echoed themes articulated in the military
    press at a national level and applied them to West Java. They were alleged to
    be hoarding weapons,¹⁰ to have planned mini-coups,¹¹ to have created blacklists
    of local officials to eliminate,¹² to have trained groups to carry out a reign
    of terror,¹³ and to have dug graves in preparation for killing their opponents.¹⁴


