    day would be [bodies] floating in the river.⁸


    The account indicates a degree of control in the killings (some of the decapitated
    bodies had their hands tied), a combination of security and public display (with
    bodies being dumped into the river at night with the knowledge that they would
    be seen as they washed downstream) and the support of the security apparatus (as
    suggested by the use of jeeps). A journalist from Bandung, who was himself imprisoned,
    heard leaders in the Subang area had been ‘disappeared’ at the point of transfer
    between detention centres, again contradicting an impression of out-of-control
    violence⁹ A tendency for killings to take the form of forced disappearances reflected
