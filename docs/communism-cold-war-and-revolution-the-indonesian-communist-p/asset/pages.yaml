    organizations gets to the heart of the tension between ideas of the party as an
    organization or as part a broader social movement.


    This tension is echoed in the historiography. Some accounts have viewed the PKI''s
    relationship with the mass organizations in instrumental terms. These analyses
    have examined how the PKI sought to increase its control of the bodies, whilst
    shaping and reshaping their priorities. The narrative of PKI dominance over the
    mass organizations was made most crudely in quasi-academic propaganda material
    produced by Suharto''s military regime.¹10 Accounts with a similar thrust have
    also been made by a number of more independent, but still strongly anti-communist
    Indonesian intellectuals in their analyses of particular mass organizations.¹11
    Even the more nuanced account of the party''s relationship with the mass organizations
    by the historian Donald Hindley struggles to capture the dynamism or motivating
    forces that drove the mass organizations, notably commenting on the "passivity"
    of Indonesian workers and peasants.¹12


    Against this backdrop, a growing number of accounts have looked to take a broader
    view of particular mass organizations allied to the party. These have shed light
    on various aspects of the mass organizations and the contributions these organizations
    made in the context of wider intellectual, cultural, and social developments in
    Indonesia during the period.¹13 However, this scholarship has extended our understanding
    of the mass organizations, the coverage has uneven. For example, the People''s
    Youth, the allied organization most closely tied to the party, has been little
    studied. More experiences of activists on the group


