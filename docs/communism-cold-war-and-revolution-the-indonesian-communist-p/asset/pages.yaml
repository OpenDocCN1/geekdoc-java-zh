    also needs to be acknowledged that the PKI gave particular focus to mobilization
    via mass organizations and close attention to the theoretical and practical issues
    this entailed. The ability of the PKI and its allied organizations to raise money
    from dues (albeit uneven), rather than relying on patronage, was an important
    factor. Joel Rocamora commented on the relative weakness of the PNI''s allied
    mass organizations, in the context of the PNI''s long-term reliance on the bureaucracy.
    While Rémy Madnier commented on the importance of a web of community organizations
    linked to Masyumi, but noted that the relationships between them were ‘chaotic’.
    The PKI did not have a monopoly on mass organizations during this period, but
    was unique in the way it approached and in the revolutionary potential it sought
    to cultivate in its members. In this context, the PKI''s relations to the mass
    organizations were essential to their appeal; they were crucial interfaces between
    the party and broader social forces, enabling the party''s to tap into an upswell
