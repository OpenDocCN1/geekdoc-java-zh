    It is also important to recognize that West Java itself was characterized by significant
    diversity, a fact that influenced the variation in levels of support for the PKI
    in different parts of the province. The province was diverse in terms of ethnicity,
    ecology, and patterns of socio-economic development. The largest ethnic group
    in the region was the Sundanese, but in parts of the province there were other
    significant ethnic groups, including ethnic Javanese (including speakers of a
    range of dialects), ethnic Betawi, and ethnic Chinese, among others. Ecologically,
    there were three main zones: a fertile northern lowland, a mountainous (but also
    fertile) band through the middle of the region, and a sparsely populated and heavily
    forested strip with poor soils along the south.¹²⁸ A further layer of diversity
    was in patterns of socio-economic change. The region was home to a few substantial
    cities such as Bandung and Cirebon, but the population was predominantly rural.
    As Dutch power in western Java had increased from the seventeenth century, differing
    systems of economic extraction had emerged in different parts of the region. The
    densely populated Cirebon saw intensive production, growing population pressure,
    and a broader impoverisement of poorer peasants, a pattern seen more widely in
    swathes of Central and East Java.¹⁹ The Priangan (a loose region of mountainous
    territory in the centre and south of the province) experienced a growing and diverse
    foreign estate sector and increasing landholdings by indigenous elites.¹⁰ Along
    parts of the northern coast there was yet another pattern, with chunks of territory
    sold wholesale to ethnic Chinese or European businesses before slowly being bought


