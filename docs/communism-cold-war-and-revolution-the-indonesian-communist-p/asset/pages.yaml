    organizational repertoires and shared an ethos that emphasized working against
    poverty and exploitation. They were also more than the sum of their parts. Collectively,
    they represented the weaving of the PKI into Indonesia''s social fabric.


    # SOBSI, Labour, and the PKI


    Founded in 1947, the All Indonesia Central Labour Organization (Sentral Organasi
    Buruh Seluruh Indonesia, SOBSI) grew to become the largest labour federation in
    Indonesia, encompassing dozens of member unions. While early accounts emphasized
    the PKI''s top-down influence on the movement via SOBSI, more historians have
    given greater attention to the intersection of the labour movement, social identities,
    and the role of the postcolonial state. This section argues that SOBSI became
    more hierarchical and PKI influence grew over time, but stresses that SOBSI should
    not be seen as a common front directed from above: trade unions in SOBSI and affiliated
    unions maintained distinct priorities. Moreover, mid- and lower-level union activists
    were embedded in their workplaces and well attuned to members'' concerns, despite
    an increasingly unfavourable environment for labour activism.


    During the War of Independence, union activism combined bottom-up organizational
    efforts with an ambivalent relationship to the state in the context of growing
    political polarization. In some parts of Java, workers at the grassroots undertook
    enterprises and organized to defend themselves and the independence effort. In
    the areas of West Java


