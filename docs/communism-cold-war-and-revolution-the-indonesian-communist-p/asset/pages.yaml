    The evolving situation in Indonesia interacted with shifting Cold War alignments.
    The US, during which this period was becoming deeply involved in conflicts on
    the Southeast Asian mainland, also became progressively more concerned about developments
    in Indonesia.¹¹ It continued to build links with various anti-communist parties,
    having already helped Masumi with funding and propaganda during the elections
