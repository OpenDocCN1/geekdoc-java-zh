  md: '# 238 COMMUNISM, COLD WAR, AND REVOLUTION


    mass electoral base combined with mobilization via mass organizations seemed the
    most plausible path forward. Moreover, the PKI contributed to growing polarization,
    this process was intertwined with international and domestic contexts. From the
    late 1950s Cold War tensions in the region escalated, stoked by the PRC chamber
    of a potent anti-imperialist and anti-capitalist synthesis as well as intensifying
    US backing for anti-communists in Southeast Asia. Meanwhile, a fierce strand of
    anti-communism was evident in Mayumi''s rhetoric in the 1950s and fed into the
    Western-backed rebellions of the late 1950s that destabilize Indonesia''s constitutional
    democracy. Sukarno was skilful in reconciling contradictory forces within Indonesian
    politics, but his growing authoritarianism and revolutionary rhetoric ultimately
    intensified a sense of polarization and crisis. The growing influence and hardening
    of army leaders was also a key dimension of growing polarization, as manifested
    most notably in the army''s central role in the massacres of 1965–6. Given the
    immense human cost of the anti-communist purge, it is important to reiterate the
    fundamental culpability of the military and allied civilian groups responsible
    for the mass violence of the mid-1960s, as well as their Western backers.


    Despite the party''s size and its influence on the political climate, the coalition
    of forces ranged against it determined. Despite the PKI''s adaptability and its
    outreach to various sectors of Indonesian society, its influence remained uneven.
    Key elements in the coalition ranged against the party included some religious
    groups, right-wing nationalists, and elements in the security services, particularly
    the army. Growing evidence of the party''s potential to mobilize mass support
    made only more the shifting alliance of anti-communist groups more determined
    to resist it. During the late 1950s and early 1960s in parts of its heartlands
    of East and Central Java it seemed the PKI might become heemonic. However, the
    situation in West Java spoke to the fragility of the PKI''s position more broadly
    across the archipelago. Within the province parties and religious organizations
    were becoming increasingly hostile and the well-entrenched Siliwangi Division
    posed a formidable barrier to leftist mobilization. The aftermath of the September
    Movement saw the coalescing of an anti-communist coalition spearheaded by actors
    within the state that drove the violence and forged a new sociopolitical order.
    Within West Java a key role was played by the most radical elements in the Siliwangi
    Division, who worked with civilian allies and received the backing of the military
    command in Jakarta. The triumph'
