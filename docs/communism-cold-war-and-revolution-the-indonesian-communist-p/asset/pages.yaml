    These developments pose a series of questions about the trajectory of the PKI.
    How successful were efforts to expand and strengthen the party? Was the PKI now
    just part of an increasingly authoritarian system, or did it maintain a democratic
    or even revolutionary impulse? How far did the PKI drive growing polarization
    in Indonesian politics and society? How far was the PKI a victim of the Cold War?


    This chapter argues there is a danger of exaggerating the party’s strength and
    resilience during this period. It points to towards hierarchy and bureaucracy,
    whilst finding that the party became more loosely woven and less coherent as time
    went. The sheer size of the party meant ensuring compliance at the grassroots
    was difficult, and rapid expansion also meant there were widening social and generational
    divisions within the party. Top-down direction jostled with pressures from below.
    If labour struggled together top-down and bottom-up impulses. Even the organization
    of the Twentieth September Movement’s coup attempt, from one perspective the result
    of concentrating too much power in Aidit’s hands, showed how far events on the
    ground could diverge from leaders’ plans.


