    # The People''s Youth


    The Indonesian Socialist Youth (Pemuda Sosialis Indonesia, Pesindo) was formed
    in 1945 as the wing of the Socialist Party, one among a plethora of armed youth
    groups that sprang up and played an important role during the War of Independence.¹¹³
    Over time Pesindo was pulled increasingly to the left, eventually becoming embedded
    in the Medium Affair in 1948, after it lost most of its leadership, membership,
    and influence.¹³⁴ In 1950 Pesindo changed its name to the People’s Youth (Pemuda
    Rakyat), and the re-formed organization grew rapidly through the 1950s and claimed
    three million members by 1965.¹¹³⁵ During this period the People’s Youth stood
    out among the mass organizations allied to the PKI due to its close identification
    with the party; by the mid-1950s it


