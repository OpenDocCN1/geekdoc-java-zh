    of violence in the province relative to Central and East Java, even in light of
    the fact that the PKI was smaller in the province than elsewhere in Java. The
    first might be termed the ‘official history’ approach, which claims that the PKI
    tackled in a largely peaceful way in West Java. In this account, the one complication
    in facing the communist threat was the attempt by unnamed actors to hit the head
    of the Siliwangi Division, General Adjie, against his chief of staff, Hartono
    Rekso Dharsono.25 The second approach could be described as the ‘Adjie-Sukarno
    thesis’, which stresses the role of General Ibrahim Adjie, characterized as anti-communist
    but ‘Sukarnoist’ (or at least personally loyal to Sukarno), who used his authority
    as commander of relatively united Siliwangi Division to restrain anti-communist
    violence.26 The third approach can described as the ‘entrenchment model’, arguing
    that fewer killings occurred in West Java because the Siliwangi Division was unusually
    strong, united, and well entrenched in society. This meant that in areas of high
    trenchment, especially parts of the province where Darul Islam had been strong,
    the army did not need to rely on civilian allies in its attacks on the PKI. This
    was important, as a reliance on civilian allies for intelligence in other regions
    was one factor that increased levels of mass killings in some parts of Indonesia.27


    Each of these accounts highlights significant issues, but offers a fully satisfactory
    account of the violence in West Java. The ‘official history’ narrative fully hints
    at a rift within the Siliwangi Division but glosses over the fact that significant
    numbers of killings took place in West Java. The ‘Adjie-Sukarno thesis’ wisely
    points to the importance of General Adjie’s role and apiece to explain why killings
    were less extensive in the province than in East or Central Java. However, it
    does less to explain the patterns in the killing that did take place in West Java.
    A narrative based on the premise of Adjie’s strength over a united Siliwangi Division
    also sits uneasily with evidence of tensions between Adjie and Dharsono. Additionally,
    the stress’s loyalty to Sukarno leaves unresolved


