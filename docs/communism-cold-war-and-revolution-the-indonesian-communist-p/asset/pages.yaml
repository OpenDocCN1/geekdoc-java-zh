    The chapter also shows that the PKI in West Java found itself increasingly isolated,
    with opposition increasing from Islamic and nationalist parties, as well as from
    the well-entrenched West Java army unit, the Siliwangi Division. Guided Democracy
    is often described as a ''balance'' between the army and the PKI (with President
    Sukarno mediating). However, examination of conditions in West Java is suggestive
    of the formidable challenges the party faced nationally. The chapter also scrutinizes
    the PKI''s role in growing sociopolitical polarization, in terms of its increasingly
    militant rhetoric, backing for a land reform campaign, and the secret involvement
