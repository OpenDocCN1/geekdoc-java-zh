    A crucial factor in the speed and intensity of the violence in Subang seems to
    have been the orientation of Otje and Witono, and their readiness to mobilize
    military and civilian allies against the PKI and its allied organizations. Both
    Otje and Witono were known to be fiercely communist and connected to a group of
    officers who were hostile to Sukarno.51 Part of the context for tense relations
    between the military and the PKI in Subang was the large BTI and Sarbupi presence
    in the area. Mass arrests and evictions of squat represented by the BTI had causing
    ongoing tensions with plantation managers and the security apparatus.52 As elsewhere
    in the province, the nationalization of plantations in Subang had increased the
    strain between the military and plantation managers, on the one hand, and PKI-allied
    unions, on the other.53 It is likely that the strength of the PKI in Subang and
    the relatively small army detachment in the local- made them more willing to mobilize
    civilian allies.54 In taking action against the PKI, Otje also seems to have drawn
    on the assistance of the plantation management, which he published for providing
    a ‘great deal of help’ in ‘the eradication (penumpasan) of the Thirtieth September
    Movement in the Subang area.55 In to the struggles between the Otje, Sarbupi,
    and plantation managers, there had also been a history of disputes involving tensions
    within villages, including where devout Muslim landlords had been the targets
    of peasant anger.56 This may help explain the willingness of civilian militias
    to participate in the anti-communist violence.

