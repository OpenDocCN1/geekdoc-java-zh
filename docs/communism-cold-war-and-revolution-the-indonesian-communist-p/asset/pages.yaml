  md: '# COMMUNISM, COLD WAR, AND REVOLUTION


    research on the PKI has been far from straightforward. Oral history research is
    challenging in a context where many people continue to suffer from the trauma
    resulting from their experiences and the threat of stigma and discrimination.
    Moreover, the remaining survivors able to relate their experiences is declining
    increasingly rapidly as a result of old age and ill health. Researchers have also
    faced difficulties in accessing important documents, with the military and other
    state bodies generally reluctant to release relevant records.


    Beyond the limitations on the available evidence, another challenge in studying
    the PKI has been the party''s history has tended to be overshadowed by the events
    of 1965–6. One dimension of this has been the intense controversy over the Thirtieth
    September Movement, an abortive coup attempt in 1965 that came to be blamed on
    the PKI. From late 1965, army-influenced media put forward a narrative where the
    PKI''s trajectory, embodied in the Thirtieth September Movement, was contrasted
    with the role of the army in saving the nation. An extensive body of literature
    emerged to untangling who was responsible for the coup attempt, with ranging from
    outright propaganda and conspiracy theories to serious academic studies. Since
    the fall of the military dictatorship in 1965–68, there has also been renewed
    scrutiny of the


