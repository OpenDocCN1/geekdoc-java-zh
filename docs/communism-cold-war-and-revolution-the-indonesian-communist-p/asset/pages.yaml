    In conclusion, the PKI''s rhetoric became more radical over the course of the
    Guided Democracy period, with the most consequential change for conditions on
    the ground becoming a growing focus on agrarian struggle. This shift was partly
    a working through of the logic of earlier strategies, partly a response to changing
    opportunities and also reflected a growing affinity with Maoist thought. The PKI''s
    national leadership decided on pursuing the Unilateral Action approach to land
    reform, and the party was set to work through the policy. However, the course
    of the campaign was infected by local circumstances: it drew energy from existing
    tensions over land, and the party found it hard to keep a handle on developments
    on the ground. Tensions varied depending on local conditions, and levels of conflict
    were less than those experienced in parts of East and Central Java. However, the
    overall trend was for the sharpening of intertwined conflict, socio-economic,
    and political division.


    # The Thirtieth September Movement


    By late 1965, national politics was becoming increasingly polarized, and the situation
    was exacerbated by economic chaos, Indonesia''s growing isolation on the international
    stage, and concerns about Sukarno''s health. Then, in late 1965, Indonesian politics
    was radically rectified. The precipitate was an attempted coup by a group calling
    themselves the Thirtieth September Movement (Gerakan Tiga Puluh September, abbreviated
    in Indonesia to G30S). The group kidnapped and killed six generals and announced
    the formation of a ''revolutionary council'', but the plot quickly collapsed.
    The army, under General Suharto, unilaterally announced a counter-coup on 1 October,
    quickly blamed the PKI and its allied


