    # New Leadership and the National United Front


    After the period 1950–1 a small group of relatively young PKI cadres headed by
    Dipa Nusantara Aidit maneuvered and displaced the party’s then leader, Tan Ling
    Jie, who had taken over in the wake of the post-Maidium repression of the PKI.
    The shift in leadership also marginalized Tan Ling Jie''s allies among the older
    generation of PKI leaders, as Alimin. The generational change was the result of
    many factors. The execution of many of the PKI''s most prominent leaders after
    the Maidium Affair in 1948 left a leadership vacuum. Additionally, Alimin, one
    of the most prominent leaders of the generation, suffering from ill health and
    becoming less active in PKI affairs. Meanwhile, Aidit and his allies had a power
    base in the agitprop department, which published the key party periodical Bintang
    Merah (Red Star). Aidit also seems to have the backing of influential trade union
    leaders who thought a better chance of reinvigorating the labour movement. Some
    in the PKI may have been concerned that Tan Ling Jie''s ethnic identity could
    have the party vulnerable to anti-Chinese prejudice.


    Following the change in leadership, between 1951 and 1953 Aidit and his allies
    made series of important policy decisions that saw the PKI take an increasingly
    accommodative stance within the context of the parliamentary system. Such a move
    made sense amid a political landscape where direct confrontation left the PKI
    vulnerable to repression and in which participation in parliament appeared to
    offer growing opportunities. The Aidit leadership seems to have been broadly supportive
    of mass strikes that took place in 1950–1, but following a government crackdown
    in August 1951 more


