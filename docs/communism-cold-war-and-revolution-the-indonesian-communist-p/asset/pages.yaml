  md: '# THE PKI UNDER CONSTITUTIONAL DEMOCRACY 79


    The geographical distribution of the PKI''s vote was quite similar in the parliamentary
    elections, the Constituent Assembly elections that followed two months later,
    and the regional elections of 1957. However the PKI was particularly effective
    in maintaining the momentum with its campaigning and increased its vote share
    (see Table L1 and Map L1).225 Meanwhile the PNI saw its vote share decline, unwound
    part of its own campaigning apparatus, and was rival by internal divisions leading
    to leadership churn and competition for jobs following the 1955 elections.226


    A review of the course of the elections of the army in the mid-1950s shows a number
    of patterns emerging. The PKI emphasized the importance of on-the-ground campaigning
    in which it could draw in its longer-term organizational efforts and allied mass
    organizations. ''Mass'' techniques such as print media and mass meetings were
    likely to be less important in reaching out to voters but were still important
    in informing and guiding activists (the case of print media) and generating excitement
    among them (the case of mass meetings). The geographical pattern of electoral
    support also reflected the interaction of sociocultural divisions, ethnic identity,
    and socio-economic tensions. Evidence of the PKI spreading from its early bases
    of support and the party''s vote share between the rounds of elections paid testimony
    to the dynamism of the party''s activist base and their efforts at outreach to
    society at large.


    # The PKI and the Security Apparatus


    The central role of the army in the violent destruction of the PKI in 1948 and
    1965–6 has influenced historians'' accounts of relations between the PKI and the
    security apparatus during the 1950s. Max Lane has depicted developments in the
    1950s within a trajectory in which the PKI faced the ongoing ''threat of repression
    and massacre'' from ''the violent and reactionary... Indonesian Army''.227 John
    Roosa took a slightly different approach, arguing that a military reorganization
