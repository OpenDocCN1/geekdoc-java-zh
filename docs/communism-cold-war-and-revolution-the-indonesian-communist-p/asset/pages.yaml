    In existing research on the anti-communist forces of 1965–6 at a national level,
    two central questions have been who were responsible for driving the violence,
    and how the intensity of the violence varied significantly across Indonesia. Some
    scholarship has shown that social conflicts, including disputes over land, have
    heightened tensions in a number of areas where the killing was most intense.³
    Other studies have highlighted the involvement of civilian militants, particularly
    those associated with religious groups, which both participated directly in some
    of the violence and provided important intelligence to the state apparatus.³ However,
    there has been a growing consensus on the central role played by the army in organizing
    the mass killing. This consensus is based partly on documentary evidence that
    has begun to elucidate the operation of military chains of command during the
    purge and also draws on oral history evidence that has demonstrated the widespread
    killing of detainees in facilities run by the army.²⁴


