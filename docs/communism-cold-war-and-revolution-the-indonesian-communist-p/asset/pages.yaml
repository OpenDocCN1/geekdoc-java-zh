  md: '# INTRODUCTION


    South.44 Communism as a transnational movement had always been complex. However,
    the establishment of the PRC in 1949, the death of Stalin, and the emergence of
    the Sino-Soviet Split from the late 1950s challenged Soviet leadership in the
    communist world in unprecedented ways and created new challenges and opportunities
    for communist movements around the world. This was a context that qualitatively
    different from that experienced by Russian or Chinese communists on their paths
    to power, or to the experiences of earlier iterations of the PKI. The PKI’s efforts
    to navigate these contexts whilst maintaining a distinct perspective are a recurrent
    theme in the book.


    At a national level, the sheer growth and size of the PKI were remarkable, as
    was its appearance of determination and unity. From a few thousand members at
    the start of the 1950s the PKI grew to the point where the end of the 1950s could
    arguably make the claim to be the largest party in Indonesia, and by the mid-1960s
    had become the largest non-ruling communist party in the world.45 The size and
    vitality of its allied organizations were also impressive. The party achieved
    levels of size and organizational consolidation far greater than the previous
    dramatic but fleeting periods of growth in the 1920s or 1940s. It also managed
    a greater degree of influence and coherence than the Communist Party of India,
    another non-ruling party which faced extreme local diversity.


    The extreme diversity the PKI faced also set it apart from most communist-parties,
    including the most successful communist parties in Western Europe, such as those
    of France and Italy. Indonesia as a country presented a context at least as diverse,
    and in some ways perhaps even more than, other Eurasian giants such as Russia,
    China, or India. Indonesia is a vast archipelago made of thousands of islands
    and spanning over 500 kilometres, a distance similar to that from London to Mecca
    or from Kolkata to Tokyo. It is one of the most linguistically diverse countries
    in the world, home to around 700 indigenous regional languages.46 The social environment
    ranges from bustling metropolises to tropical rainforest. PKI Chairman D. N. Audit
    explained, the PKI was tackling the task of lead-


