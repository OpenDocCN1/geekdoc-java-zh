    People''s Youth members recruited any military training. However, the rhetoric,
    the style, and the aesthetic contributed to a growing sense of tension in the
    1960s.


    In conclusion, the People''s Youth drew on a tradition of militant left-wing youth
    activism that emerged during the War of Independence. Since then it expanded rapidly
    and ramped up efforts as it became even closer to the PKI. Its anti-imperialism
    itself facilitated cooperation with youth groups with differing political orientations,
    but tensions between these groups became increasingly apparent. The People''s
    Youth were enthusiastic contributors to their communities through social work
    and cultural activities, demonstrating impressive energy and enthusiasm. Such
    activities tapped into members'' idealism and sense of duty, which was part of
    a broader view of the People''s Youth and the PKI as defending the work, the ''little
    people''. These idealistic impulses were increasingly combined with a growing
    sense of militancy and support for the PKI. In practical terms, this expressed
    itself in support for peasants in land disputes and sometimes could involve physical
    confrontations and low-level violence. The organization also took on a more martial
    edge over time. There is no evidence that the People''s Youth had military capabilities
    beyond parading and posturing, but these activities, as well as leaders'' increasingly
    excitable rhetoric, helped raise the political temperature during the Guided Democracy
    period.


