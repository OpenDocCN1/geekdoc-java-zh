    by conditions on the ground, and party leaders often found events in the provinces
    slipping out under ever tighter top-down direction, forces emerging from below
    continued to influence the party''s direction.


    Chapter 3 addresses the mass organizations allied to the PKI, particular working
    in the fields of labour, the peasantry, women, youth, and the arts. The chapter
    argues that the relationships between the PKI and allied mass organizations combined
    elements of hierarchy, organic solidarity, and plurality. To some extent, the
    PKI''s engagement with mass organizations drew from Marxist-Leninist theory and
    echoed the approach of communists elsewhere in the world. However, the chapter
    argues that the mass organizations also reflected the PKI''s responsiveness to
    the burgeoning of associative life emerging from the Indonesian Revolution and
    the way the party became deeply embedded within Indonesian society. The party''s
    relationships with the mass organizations played an important role as the PKI
    shifted from a small cadre to a mass party, with the party becoming ever more
    entwined with a series of social movements. In this way the PKI was able to build
    up organic connections and tap into the energies of trade union organizers, peasant
    representatives, women''s rights activists, and artists. Through the late 1950s
    and into the 1960s the PKI exerted increasing influence over these organizations.
    However, it would be reductive to see the mass organizations as more PKI ''fronts'',
