    With regard the role of the working class as an agent of revolutionary change,
    it is true that the PKI tended to become increasingly cautious over time. As the
    1950s progressed, the party toned down the emphasis on the proletariat in its
    theoretical formulations. The 1951 party general programme began with the assertion
    that the PKI was ‘organized vanguard and highest class organization of the Indonesian
    proletarian class’⁷⁹ However, by 1954 this language had been removed and the working
    class was now to ‘pioneer the struggle of the entire People’ ‘the leaders of a
    national united front’⁸⁰ Moreover, a wave of repression in 1951, the installation
    of a PKI prime minister in 1952, and the dialogue the PKI was having with its
    comrades also pointed towards a broader National United Front strategy involving
    an alliance with ‘bourgeois nationalists’ and limits to direct direct confrontation
    with the government (see the section ‘New Leadership and the National United Front
    above’). The PKI called in 1952 for a ‘United Labour Front’, with actions to be
    taken if they had widespread ‘sympathy and support, had ‘a good of success’, and
    were ended ‘at the right moment.’⁸¹ This policy, as well as a tightening of restrictions
    on military, set the stage for the PKI leadership''s approach in the years that
    followed. From the late 1950s the situation was complicated further by the nationalization
    of foreign-owned industries.


    However, there is a danger of underestimating the significance of the PKI''s interest
    in organized labor and the significance of SOBSI''s activities.⁸² For one thing,
    the PKI''s longer-term interest in activism and its support for the wave of labour
    unrest at the start of the 1950s helped embed the party in the labour movement,
    which would provide an important base of support as the PKI looked to expand.⁸³
    This was evident in West Java in the party''s rapid expansion in areas that were
