  md: 'coined the term ''polycentric'' communism, whilst by the 1950s Sino-Soviet
    rift was becoming increasingly evident. Communist parties throughout Asia were
    grappling with the question of how to indigenize Marxism-Leninism.4 Growing pluralism
    in the communist world, coupled with the PKI''s growing membership and influence,
    further convinced Aidit and his allies that the PKI needed to chart its course.


    An analysis of the national-global dialectic and the national party line only
    takes us so far. It is one thing to formulate a strategy, but quite another for
    this to be translated into mass support and activism on the ground. This study
    has highlighted the party''s adaptability in navigating cleavages in Indonesian
    society and has used the term ''archipelagic communism'' to reflect the party''s
    creativity in mediating not only international and national forces but also varied
    local dynamics and social forces. It has sometimes been argued that the PKI was
    essentially an ethnically Javanese party, representing a constituency of Muslims,
    in whose socioeconomic tensions were minimal. It is true that the party performed
    particularly strongly in the ethnic Javanese areas of Central and East Java, that
    some of the PKI''s staunchhest opponents were pious Muslims, and that local leaders
    of the PKI and BTI rarely came from the poorest strata. This is far from the full
    story. The study has shown how the PKI carefully accommodated Sundanese identity
    and the idea of regional autonomy, how the party positioned itself with different
    manifestations of Islam and reached out to those Muslims they thought might be
    persuasive, and how the party tapped into resentment generated by socio-economic
    inequalities in rural West Java. Kevin Morgan has noted that communist parties
    often exhibited ''multiplicity,'' a capacity to operate in ''diverse cultural
    and social environments.''5 In a similar vein, Julian Mischi used the term ''militant
    sociability'' to describe the ''plural'' forms of mobilization and the existence
