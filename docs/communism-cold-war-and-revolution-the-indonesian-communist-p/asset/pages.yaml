    incomplete revolution. As both an organization and a movement, the party represented
    more than a political programme. It was thus inevitable that the impact of the
    party''s destruction would ripple through Indonesian society. This was especially
    the case because attacks on the PKI extended to the allied mass organizations:
    these organization were also banned and their members subject to detention and
    violence.¹⁸⁸² Moreover, the new regime that emerged made anti-communism a core
    element of its identity, a factor that permeated its approach to government and
    Indonesian society.


    This section outlines a number of ways in which the destruction of the PKI and
    the new regime''s anticommism shaped ''New Order'' society. The first dimension
    examined the role of a powerful anti-communist myth and its role in stifling dissent.
    A second is the surveillance and stigma of hundreds of thousands for alleged connections
    to the PKI or allied organizations. A third is with the implication that the destruction
    of SOBSI and the BTI, coupled with potentially communist, workers and peasants
    vulnerable to predatory forms of capitalism that saw military and commercial interests
    intertwined. A fourth is the linking of anti-communism and the spectre of Gerwani
    with socially conservative views of the family that emphasized female domestic
    within a broader hierarchical social order. A fifth is interaction between anti-communism
    and certain forms of ''boundary maintenance'': a process of demarcation between
    those included and excluded from the national community by their ethnic or religious
    identities.¹⁸³


    From its inception, the New Order was bound up with a potent anti-communist mythology
    that came to permeate Indonesian society. National-level propaganda provided an
    overarching framework via government-sponsored historiography, school textbooks,
    museums, annual


