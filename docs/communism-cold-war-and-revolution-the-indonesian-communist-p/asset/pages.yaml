    # The PKI and Socio-Economic Cleavages


    The most influential accounts of the PKI have tended to downplay the relevance
    of socio-economic cleavages for the development of the PKI in the 1950s. For example,
    Rex Mortimer argued that ''social differentiation'' in rural Java was limited74
    and that the PKI tended to emphasize ''vertical'' rather than horizontal social
    cleavages75 Meanwhile Donald Hindling argued that ''social antagonisms'' in much
    of the countryside of Java were ''minimal'', whilst that generally peasants were
    ''passive'' and conservative76 These accounts in turn were influenced by the work
    of the anthropologist Clifford Geertz, who had argued that ''shared poverty'',
    rather than social stratification, was a defining characteristic of rural life
    in Java.77


    This section finds that socio-economic tensions were a significant factor in the
    growth of the PKI in West Java, part due to high levels of rural inequality in
    the region. More it argues that Mortimer and Hindling overstated the level of
    homogeneity and passivity of the peasantry across Java, and as a result of this
    underplayed the ability of the PKI and BTI to tap into peasant discontent. In
    this context it is worth looking at the PKI''s socio-economic agenda during the
    1950s. It was true that in the general PKI took an increasingly conciliatory approach
    to labour affairs as the 1950s progressed and during that date was no extensive
    land reform campaign to match which would occur in the 1960s.78 However, the PKI''s
    work in labour unions was still important to the party and workers themselves,
    while agrarian issues rose progressively up


