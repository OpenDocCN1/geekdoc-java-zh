    In conclusion, West Java was not really a ‘balance’ between pro and anti-PKI forces.
    Rather, there was a tendency for the PKI’s political isolation to increase even
    as the party grew. It looked for allies where it could and sought to make the
    best of forms such as regional councils and the National Front. However, the party
    frequently found itself hemmed in by a coalition of rivals. These included the
    main political parties, Mayumi now faded from the scene. More important was the
    Siliwangi Division, which penetrated ever more deeply into West Java’s society
    and received support from the US on the basis of its potential to act as anti-communist
    bulkhead.


