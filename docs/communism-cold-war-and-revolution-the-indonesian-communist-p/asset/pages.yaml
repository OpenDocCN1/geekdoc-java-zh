    The tensions and vulnerabilities inherent in the PKI''s strategy explain how a
    party that had been deeply woven into Indonesian society could be so rapidly eliminated
    and thoroughly undermined. However, it is important to acknowledge that the party''s
    direction was constrained and conditioned by the circumstances it faced. At the
    start of the 1950s the party was tiny, in disarray, and tainted for some allegations
    of tre relating to the Madiun Affair of 1948. Some surviving leaders in the aftermath
    of the PKI''s destruction in 1965 argued that the party should have pursued armed
    struggle on the Chinese model.³ However, a guerrilla campaign was unlikely to
    have succeeded. Indonesia lacked a potential base area near to a border with a
    communist state, an important difference from the Chinese experience that aided
    them.³¹ Given that context, the National Front strategy and the pursuit of a


