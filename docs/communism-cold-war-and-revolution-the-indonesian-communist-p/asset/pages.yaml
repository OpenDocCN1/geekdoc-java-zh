    The experience of the PKI in West Java complicates the narrative of a linear trajectory
    towards conflict between the army and the PKI and the idea that 1957 was a decisive
    turning point in entrenching military influence in society. This section argues
    the need to respond to the Darul Islam uprising meant that the army had already
    become entrenched in West Java’s society in the early 1950s. In this context,
    reforms to the military’s role in society in the late 1950s were less significant
    in some regions of Indonesia than others. Additionally, a shared animosity that
    the army and the PKI had for the Darul الإسلام proved a degree of common ground
    in West Java during the early and mid-1950s. While the PKI and its allied organizations
    faced ongoing harassment from officials, during this period it were more likely
    to come from the police than the army. The section also looks at the most significant
    episode of repression against the PKI in the early 1950s, the August Raids of
    1951, in which thousands of leftists were detained without trial across Indonesia.
    It argues that whilst were some echoes of the 1951 repression in 1965–6, the differences
    between the episodes were revealing the similarities.


    Given the ongoing security threats in West Java throughout the 1950s, the army
    entrenched its influence in the province usually early and thoroughly. A number
