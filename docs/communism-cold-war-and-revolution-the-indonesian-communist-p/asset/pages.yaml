  md: '# THE PKI’S DESTRUCTION AND INDONESIA’S ‘NEW ORDER’ 205


    Overall, the analysis above has highlighted how the dynamics of anticommunist
    violence were shaped by a process of coalition formation that spanned national,
    provincial, and sub-provincial levels. General Adjie played an important role
    in limiting the killing in West Java, though he was not entirely opposed to violence
    and the depiction of Adjie a ‘Sukarnoist’ is an oversimplification. A concern
    to maintain order, in part shaped by long experience fighting the Darul Islam,
    was also a key factor. Adjie was also challenged by hardliners within the Siliwangi
    Division who worked with the central military command and pushed for a more aggressive
    response to the perceived communist threat and were more willing to mobilize civilians
    to take part in the violence. A careful examination of the geography and timing
    of the fortunes of hardliners in the Siliwangi Division influenced the degree
    of violence on the ground. Radical elements in the Siliwangi Division acted as
    the cutting edge of the counter-revolution in West Java. This was true not just
    in terms of shaping a broader movement that undermined Sukarno’s authority.


    # The Rise of the ‘New Order’ Regime


    The destruction of the PKI was closely bound up with the rise of a regime led
    by Suharto and the military that progressively sidelined President Sukarno. Suharto’s
    initial unilateral assumption of control of the armed forces on 1 October 1965
    was a response to the actions of the Tirthiet September September Movement but
    also reflected a degree of individual initiative that effectively amounted to
    insubordination and a willingness to ignore Sukarno’s orders.¹12¹ A further milestone
    in Suharto’s rise and Sukarno’s fall occurred on 11 March 1966, when Sukarno was
    pressed into granting Suharto wide-ranging powers to maintain order.¹12² The following
    day Suharto issued an order banning Sukarno’s name banning the PKI.¹12³ In March
    1967 Parliament appointed Suharto president, withdrawing Sukarno’s


