    # The PKI under Constitutional Democracy


    # Introduction


    Following the end of the War of Independence, Indonesia experienced a period of
    ‘constitutional democracy’ between 1949 and the late 1950s characterized by relative
    political openness, inter-party competition focused on parliament, and a vibrant
    press.^1 It witnessed Indonesia’s first national elections in 1955, followed by
    regional elections in 1957–8.^2 Indonesia also emerged on the world stage, hosting
    the first Afro-Asian Conference at Bandung in 1955, which received strong support
    from the centre and left of Indonesian politics, including the PKI.^3 However
    the Indonesian political system also faced serious challenges, including the rapid
    turnover of administrations and ongoing armed conflict in a number of regions,
    including West Java.^4


    During this period the PKI, which had a major setback following the Madiun Affair
    of 1948, was able to regroup. In 1951, at the point D. N. Aidit and a small group
    of allies took over the party’s national


