    mandate on the basis that, among other things, he had instituted policies that
    had *indirectly* benefited the PKI-Thirtieth September Movement.¹124


    Observers have described Suharto''s displacement of Sukarno as the result of a
    ‘creeping coup.’¹125 Thisfully highlights the crucial role of the army in the
    regime change of the mid-1960s. However, the term might have been taken to imply
    a transition of power with a minimal popular base and unaccompanied by mass mobilization.¹126
    Understanding the transition as part of a broader counter-revolution points instead
    towards an examination of what Gerry van Klingen has termed the ‘hybrid, fuzzy
    boundary zone between state and society.’¹127 This chapter has previously highlighted
    the role of a radical grouping within the Siliwangi Division in driving anti-communist
    violence, with the support of the military high command and civilian militias
    (see the section ‘The Army, Society and Anti-Communist Violence’ above). The present
    section looks at how the hardships in the Siliwangi worked with a range of civilians
    shaped a political climate that weakened the position of Sukarno and the Left
    broadly, and sought to give the appearance of popular legitimacy for the emerging
    regime. The relative strength of this coalition in West Java accelerated the establishment
    of the ‘New Order’ in the province. In this context, West Java provided an important
    launch pad from which to consolidate areas where the Left was stronger. If East
    Java being referred to as ‘Sukarno’s fortress’ as of 1968¹128 the West Java provincial
    capital of Bandung was already being called the ‘capital of the New Order’ by
    late 1966.¹129


