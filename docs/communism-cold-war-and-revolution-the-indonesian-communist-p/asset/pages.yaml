  md: '# 202 COMMUNISM, COLD WAR, AND REVOLUTION


    The predominant pattern of killing in West Java was the forcible disappearance
    of prisoners being held in military detention facilities. There are numerous accounts
    of detainees who were ''loaned out'' or in other words ''taken'' and did not come
    back.''110 For example a family in Sukabumi who lived in the vicinity of the Pasilangkap
    plantation recalled it commanded as an army base and used as a venue for holding
    political prisoners. Some of these were taken out at night, shot, and buried in
    unmarked graves.111 Thanks to the work of NGO activists, there is unusually detailed
    information about a wave of forced disappearances that occurred in Cirebon District
    around April 1966. The data gathered includes the village of origin and organizational
    affiliation of 163 of those killed. These indicate an organized and quite systematic
    attempt to annihilate physically the core of the party’s support in the region,
    as reflected in the members and roles of those killed and their geographical distribution.
    The organizations most targeted were the PKI and the People''s Youth, the affiliate
    most closely linked to the party. PKI leaders at all low levels were killed, whilst
    for the People''s Youth and BTI those were targeted from the Subdistrict level,
    and with Gerwani only the more prominent activists.112


    The data on the forced disappearances in Cirebon is one of pieces of evidence
    pointing to the role of mid-level army commanders influencing the level of killings
    in particular areas. The geographical spread of the killings across the district
    suggests decisions were being made at the level of the District Military Command
    (Komando Distrik Militer, Kodim) or higher, although no specific orders have been
    preserved in the available public record. More broadly, the large majority of
    the killing in West Java happened within the areas of two intra-district commands:
    Order 063, based in Cirebon, and Order 061, based in Bogor (see Map 4.1).


    > 110 This is a recurring theme in former members of the party or its allied organizations.
    For example, Interview 5, Sukabumi, 14 January 2018; Interview 8, Surakarta, 4–5
    February 2018; Interview 9, 13 February 2018; Interview 10, Kuningan, 7 April
    2018.


    > 111 ''Menguak Jejak-jejak Pembantaian Massal PKI di Pasilangkap Sukabumi'',
    Pojokbaru, 30 September 2018. https://pojoksatu.com/sukabumi/2018/09/30/menguak-jejak-jejak-pembantaian-massal-pki-di-pasilangkap-sukabumi/,
    accessed 28 November 2024.


    > 112 This analysis draws on ''Data Korban Pembunuhan Kabupaten Cirebon'' and
    an explanationation given in Interview 6, Jakarta, 22 January 2018, with a student
    activist who is familiar with the work of the NGO.'
