    and workers were left vulnerable to commercial interests working together with
    state agents. A socially conservative view of the family was propagated as part
    of the New Order view of society. Those who dissented or sought to organize faced
    being branded as communists. Anxieties about communism also encouraged a sharper
    differentiation between Indonesians and ‘foreign’ Chinese, and between the religious
    and supposedly communist. At the same time, a large section of the Left was also
    purged from educational institutions and the arts, which removed a cohort of dedicated
    teachers and impoverished Indonesia’s cultural life. Although Indonesia experienced
    profound changes after the fall of the military regime at the end of the 1990s,
    subsequent efforts to reckon with these legacies have been limited, halting and
    fiercely contested.


    # Conclusion


    Paul Chamberlin has argued the massacres of 1965–6 were ‘one of the pivotal events
    of the middle Cold War’, part of a surge of violence beginning in the mid-1960s,
    the ‘Indo-Asian bloodbaths’, that seemed to set the expansion of Third World communism.255
    Ultimately communism still maintained a degree of dynamism in the decade that
    followed, as was evident from the continued worldwide resonance of Marxist and
    particularly Maoist ideas.256 Yet it is still helpful to consider the Indonesian
    masses in the context of an international wave of counter-revolutionary consolidation.
    Vincent Bevins has noted parallels between military take-overs in Indonesia and
    Brazil, while Mattias Fibiger has analysed Indonesia and the Suharto regime to
    ‘internationalize counterrevolution’ in the following decades.257 More broadly,
    global data sets of coups and attempted coups show a noticeable peak in the mid-1960s.258


