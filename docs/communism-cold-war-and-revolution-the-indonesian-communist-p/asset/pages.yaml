  md: '# Introduction


    # Introduction


    This book addresses two central tensions within communism as an ideology and project.
    One is that communism'' universalizing tendencies had by necessity to engage with
    varied circumstances. Although it was shaped by a global outlook and was interwoven
    with a sense of proletarian internationalism, communism also had to adapt to particular
    local conditions. The second tension is that between top-down and bottom-up forces:
    communist paid close attention to the issues of organization and discipline but
    also understood that to achieve their goals they needed to tap into broader social
    forces.


    This study explores these issues by analysing the experience of the Indonesian
    Communist Party (Partai Komunis Indonesia, PKI) in the province of West Java,
    with a focus on the period 1949–66. In 1949 the party had only a few thousand
    members nationwide, but by the mid-1960s, the PKI had millions of members and
    was the third largest communist party in the world. It became an integral part
    of the Indonesian political system, playing an increasingly important role in
    shaping the terms of Indonesia''s national conversation, while providing a powerful
    example of the attractions of communism in the Global South. It had gathered around
    an alliance of organizations in fields including labour, the peasantry, women''s
    activism, youth, and the arts. Moreover, it had achieved in a vast and diverse
    archipelago. However, the party was all destroyed in an anti-communist purge that
    began in October 1965, which left perhaps a million dead and over a thousand imprisoned
    without trial. It was a ‘shattering blow’, in the words of the US State Department,


