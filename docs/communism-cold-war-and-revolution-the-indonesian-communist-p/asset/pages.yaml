    the mass organizations was a powerful force. The artistic activities of the mass
    organizations, above all Lekra, enhanced the cultural and social depth of these
    emerging networks. It was perfectly possible to be a member of a mass organization
    and have little interest in Marxist theory. However, through the mass organizations
    the PKI built up networks of activists, inducing them in a process of socialization
