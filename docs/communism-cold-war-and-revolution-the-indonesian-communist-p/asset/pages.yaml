  md: '# CONCLUSION 231


    what was particularly remarkable about the ''archipelagic communism'' of the PKI
    was its ability to achieve such rapid growth and immense scale in a context of
    such extreme ecological, social, cultural, and ethnic diversity. The experience
    of Indian communism, which also faced immense diversity with regard to cultural
    and social contexts, highlighted the skill required to manage the combination
    of shifting international, national, and local contexts. Indian communism never
    achieved the national level levels of support that the PKI reached at its peak
    and ended up splitting into multiple parties, driven by ideological divisions
    encouraged by the Sino-Soviet split that saw Indian communism descend into ''disaggregation''
    and [subnational] regional focus''.⁷


    Another manifestation of the PKI''s ''multiplicity'' was its engagement with mass
    organizations representing workers, peasants, women, young people, and artists,
    among others. The PKI manoeuvred itself to the centre of a family of organizations,
    bound by a broad ideological affinity as well as personal ties. The interlinking
    of the party with mass organizations enabled the party, in the words of Aidit,
    to ''gather the broadest masses around it in all fields''. Party argued, in a
    Marxist-Leninist tradition, that participation in the struggle for their immediate
