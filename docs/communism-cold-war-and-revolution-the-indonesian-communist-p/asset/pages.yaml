  md: '# CONCLUSION 233


    increasingly bureaucratic and hierarchical. At the same time, the PKI continued
    to tighten its control over the national leaderships of the mass organizations.
    In some cases this meant dampening activists'' militancy, especially within trade
    unions. In other cases it meant stoking struggles at the grassroots, particularly
    on the issue of land reform. The party placed a growing emphasis on plans and
    systems—on the power of organization. However, it is possible to overestimate
    efficiency of the PKI apparatus, which struggled to impose order on what became
    a vast and sprawling party. Thirtieth September Movement, in which Aidit and a
    small group of conspirators worked outside the main party apparatus, was in one
    sense the antithesis of the party as a movement. The chaotic breakdown of the
    plot, which was even more disorganized in the regions than in Jakarta, highlighted
    the limits of central control.


    The growing importance of organization within the PKI can to some extent seen
    as part of a broader disciplinary tendency in Indonesian associational and political
    life that had progressively intensified since the early twentieth century. Earlier
    markers included the refounding of the ISDV as an explicitly communist party in
    1920, the break between the PKI and the Islamic League in the early 1920s, the
    split in the governing left-wing coalition in 1947, and the crystallization of
    ideological alignments around the time of the Madiun Affair. Comparing the PKI
    in the 1920s to the party in the 1950 and 1960s, Benedict Anderson noted a trend
    from ‘improvisation’ to a greater ideological and organisational ‘standardisation’.¹¹
