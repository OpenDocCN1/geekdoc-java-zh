    In conclusion, the BTI emerged out of a burgeoning of agrarian activism during
    the War of Independence that was ideologically and organization-diverse. Through
    the first half of the 1950s a process of organizational consolidation took place,
    one that was particularly convoluted in West Java. Over time the PKI gradually
    increased its influence over the BTI, but at lower levels especially, the relationship
    was as much organic as by a line of command. The BTI was sensitive to variation
    in conditions on the ground and sought to address peasant interests through a
    wide range of activities such as giving technical advice, carrying out community
    work, advocating for peasants in disputes, and leading direct ‘actions’ in their
    defence. In contrast to SOBSI’s declining militancy and continued variation by
    region, there was a trend for the BTI to become increasingly radical force in
