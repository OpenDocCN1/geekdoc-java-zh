  md: '# A Note on Indonesian Spellings and Names


    Historically, Indonesian has been written using a number of spelling systems.
    In 1947 a new system was introduced under which ''oe'' was changed to ''u''. In
    1972 further changes were introduced, including changing ''dj'' to ''j'', ''j''
    to ''y'', ''tj'' to ''c'', and ''ch'' to ''kh''. Whilst these spelling changes
    were broadly adopted, there were some exceptions; for example, some individuals
    preferred to keep the spelling of their names as it had been previously. I have
    kept the original spelling when quoting or directly referencing. Otherwise I have
    used ''u'' rather than ''oe''. I have also adopted the 1972 changes, except where
    to do so would be particularly likely to cause confusion, for example in the case
    of names of publications or publishers that used the earlier spelling conventions,
    where an individual continued to use the pre-1972 spelling even after the changes
    were introduced, or where adopting the changes would also require altering widely
    recognised abbreviations.


    Within Indonesia, there are varied naming systems, the pattern of forename followed
    by surname should not necessarily be expected to apply. In some parts of Indonesia
    it is not particularly unusual to have one name, and where an individual has multiple
    names, the last name may not be the family name. A further complicating factor
    is that in revolutionary circles it was not uncommon for individuals to change
    their names. For example, the communist leader commonly known as D. N. Aid was
    born Achmad Aidit. However, he later became known as Dipa Nusantara Aidit (nusantara
    meaning ''archipelago''), whilst he sometimes wrote under the pen name Alamputra.
    For public figures, I generally use the name most commonly associated with that
    individual.'
