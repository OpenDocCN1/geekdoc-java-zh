  md: '# COMMUNISM, COLD WAR, AND REVOLUTION


    # Conclusion


    Looking at the mass organizations, one can detect a growing tendency towards hierarchy
    and a strengthening control impulse from the party. This pattern in part reflected
    a strand in Marxist-Leninist thought that saw mass organizations as a key interface
    between the revolutionary vanguard and the masses. The rapid growth of the mass
    organizations often involved a process of organizational consolidation ranging
    from mergers and changes to the institutionalization of education programs and
    the dissemination of publications. Initial ideological diversity tended to be
    squeezed by PKI influence. The party controlled a growing number of key positions
    in the leadership of mass organizations at national, regional, and local levels,
    and exerted influence via party cuses. In this context, the mass organizations''
    public rhetoric (on both domestic and international matters) became increasingly
    synchronized, and more and more tended to draw on similar organizational repertoires
    as the ''go down'' movement and military plans. When the PKI''s tone hardened,
    in 1959 updating its constitution to state that the PKI must work to become the
    principle element (teras) of all the revolutionary mass organizations'' and ''must
    execute a struggle against activities within and outside the party'' that threatened
    the revolution, the unity of the working class, or its alliance with revolutionary
    classes.³¹³


    It would be reductionist to see these bodies as PKI vehicles or ''front organizations.''³³⁴
    Indeed, a key reason that the organizations were so important to the PKI was because
    they connected the party organically to a series of dynamic social movements.
    The mass organizations drew on the efflorescence of organizational activity that
    had sprung during the War of Independence. Activists in the mass organizations
    were committed to representing their members in that field and adapted to local
    conditions, drawing on local knowledge and connections. They combined ongoing
