    and Research, World Strength of the Communist Party Organizations: 17th Annual
    Report (Washington DC: US Department of State Bureau of Intelligence and Research),
    7–14.


    Communism, Cold War, and Revolution: The Indonesian Communist Party in West Java,
    1949–1966.

