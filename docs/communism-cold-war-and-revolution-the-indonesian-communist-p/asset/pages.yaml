    membership of almost nine million by 1965, with around one and a half million
    members in West Java.^76 The BTI also came to be seen by the PKI as an important
    allied organization. While some scholars have treated the BTI as little less than
    a PKI front,77 there has been a growing recognition of the need to consider the
    subjectivities, experiences, and priorities of BTI members.^78 This section argues,
    in a process that some parallels with SOBSI''s development, the BTI drew on diverse
    streams of activism that blossomed during the War of Independence. It was only
    gradually that a greater degree of ideological and organizational unity was achieved.
    Over time the PKI extended its influence within the BTI, but even during the later
    period the PKI and BTI were not synonymous. Moreover, the BTI''s success to a
    significant extent resulted from a sensitivity to the various problems faced by
    the peasantry and to conditions on the ground.


    In its early years, the BTI encompassed significant ideological and organizational
