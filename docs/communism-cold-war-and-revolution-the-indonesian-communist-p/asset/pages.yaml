  md: '# COMMUNISM, COLD WAR, AND REVOLUTION


    Another reason to avoid applying a one-size-fits-all class framework to understanding
    PKI support is that the party could emphasize a broad-based progressive anti-poverty
    agenda or a more mobilational anti-inequality approach, depending on the context.
    Significant rural inequality and the presence of various agrarian disputes in
    West Java were an important contributory factor in the growth of the PKI and BTI.
    However, the community service that activists in the PKI and its allied organizations
    carried out—such as cooperatives, mutual aid, and support for public works—was
    attractive to potential supporters in varied socio-economic contexts. An accumulation
    of case studies and local histories across Indonesia points to substantial regional
    and local variation in the relationship between the PKI, the BTI, and socio-economic
    configurations. In some areas the PKI and BTI had already become involved agrarian
    conflict beyond plantation and forestry areas in the 1950s. In addition to parts
    of West Java, they were supporting peasants in agrarian disputes in parts of Central
    and East Java such as Katen and Kediri.¹⁰⁹ Yet were other areas, especially where
    levels of socio-economic inequality were lower, where a broader emphasis on development
    and anti-poverty efforts was more likely to gain support. It was sometimes the
    case in West Java and was more frequent in certain parts of Central and Eastern
    Java, where ''whole villages'' joined the PKI.¹¹⁰⁰ A broad-based anti-poverty
    effort was also evident as the PKI began to make inroads in well-connected parts
    of Indonesia from the late 1950s.¹¹¹¹ However, it should be noted that the PKI
    and BTI came to place emphasis on land reform in the 1960s, there was a general
    tendency for levels of polarization to increase (see the section ‘Militant Tendencies
    and Agrarian Struggle’ in Chapter 2).


    Overall, this analysis suggests that the role of socio-economic tensions has been
    underplayed in the most influential accounts of the PKI. Although the PKI became
    increasingly wary of the idea of mass strikes (especially for Indonesian-owned
    enterprises), the allied trade unions continued their organizational and advocacy
    work and remained the most important


