    The PKI leadership could point to their role in setting the political agenda within
    Indonesia. Growing in self-confidence, PKI leaders could also admire the PRC''s
    anti-imperialism and agrarian radicalism, but still feel able to chart their own
    path by adapting Marxism-Leninism to local conditions. The PKI''s forty-fifth
    anniversary celebrations in May 1965, held at the national stadium with capacity
    crowd, were triumphant. Sukarno gave a speech, selected communist dignitaries
    spoke, and Aid called on the PKI to ''advance with the spirit of the revolutionary
    offensive.''²³⁵


    Yet if on the surface it appeared that the PKI had adapted effectively to the
    conditions of the Guided Democracy era, closer investigation revealed mounting
    challenges. Cross-cutting pressures for ideological conformity and rapid expansion
    strained the PKI''s internal coherence. The party was becoming increasingly bureaucratic
    and unwieldy, which breakthrough also fed growing social and generational divisions.
    The party''s growing foothold within the state, from one perspective a sign of
    success, exacerbated these tensions. The PKI tended to be pragmatic when given
    responsibility in local office, and the party''s military with regard to labour
    was increasingly tempered by an emphasis on allied unions on productivity within
    state enterprises. Yet the PKI leadership''s rhetoric became increasingly radical,
    showing an increasingly Maoist tinge and feeding into the increasingly heated
    tone of public discourse during the Guided Democracy period. The party also embarked
    on a divisive land reform campaign.


    The period of Guided Democracy saw the culmination of tensions embodied in the
    party''s hybrid nature as a mass party, social movement party, and vanguard party.
    As a mass party, the PKI created an increasingly hierarchical organization with
    less internal coherence, which resorting to ever more radical rhetoric. As a social
    movement party, it catalysed grassroots mobilization, especially in the form of
    agitation for agrarian reform. The party''s size, its publications, and its actions
    on the ground all contributed to escalating polarization within the Indonesian
    political system. At the same time, Aid had not fully abandoned the conspiratorial
    dimension of a vanguard party, and this now came to the fore with its entanglement
    with the Thirtieth September Movement. When the plan unraveled, the party with
    its mass base became vulnerable,


