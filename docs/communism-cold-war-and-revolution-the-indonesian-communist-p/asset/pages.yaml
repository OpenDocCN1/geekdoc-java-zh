    to a Moscow or Beijing ''line.''² PKI leaders argued communists needed ''to be
    guided by... the experiences of communists across the world'' but also ''grounded
    in the situation of their own state and people.''³ Communism had to be adapted
    to Indonesian circumstances. Major PKI policy shifts should be understood partly
    in the role of evolving domestic contexts. The party reformulation of the National
    Union Front in the early 1950s came at a time when the dangers of open opposition
    were becoming clearer and it seemed increasingly possible to form a broad-based
    parliamentary alliance. The PKI''s focusing on agrarian strategies in the 1960s
    should also be seen in terms of the narrowing opportunities for mobilizing organised
    labor and the sheer numerical importance of the peasantry. Sukarno''s ideological
    flexibility and the importance of the military as shifting parameters with which
    the PKI had to contend. In the context of evolving domestic circumstances, Marxist
