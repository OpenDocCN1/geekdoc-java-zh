  md: '# 240 COMMUNISM, COLD WAR, AND REVOLUTION


    histories combine: the fraying of international communist unity, a shift in the
    centre of gravity of communism towards the decolonizing world, the formation of
    the Indonesian polity, and the grassroots convulsions of the long Indonesian Revolution.
    In that context and in an environment characterized by extreme levels of social
    and cultural diversity, the PKI tested the achieve and the possibility of combining
    a disciplined revolutionary vanguard, a mass party and a social movement. In doing
    it provides an example of the potential and fragilis of mass mobilization in the
    name of a revolutionary cause. As such, it forms an essential part of histories
    of global communism, the Cold War, and Indonesia''s long revolution.'
