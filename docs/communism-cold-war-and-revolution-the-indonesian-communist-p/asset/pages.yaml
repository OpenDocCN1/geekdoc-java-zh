    Besides straight-out fabrication, the situation was compounded by a disregard
    for the truth throughout the interrogation process. There was widespread use of
    torture, where suspects were ‘known’ to be guilty and forced to ‘confess’.³35
    John Roosa has highlighted a vicious circle formed, with the press aggravating
    misinformation, which informed interrogators, who pressured detainees to confirm
    these narratives, with confessions under torture subsequently forming the basis
    for further press ‘revelations’.³36 To this further dimension can be added of
    national and regional media recycling and amplifying each other’s propaganda.


    A process of mass detention began in early October and continued expanding into
    1966, with an estimated 10,000 prisoners being held in West Java around the end
    of 1965.³37 Some prisoners were passed through a police station, a prosecutor’s
    office, or other improvised holding facility during an initial processing phase.
    Many were taken directly or shortly after their arrest to army installations.³38
    Prisoner then fell after a period in 1965–6.³³⁹ Over time, detainees were concentrated
    in larger camps within the province or transferred to detention elsewhere in Indonesia,
    including the notorious Buru island camp.³⁴⁰ Arbitrariness and harsh conditions
    are recurring in the accounts of prisoners, some of whom had only a tenuous connection
    to an organization linked to the PKI.¹¹ Some were not questioned,⁴² and a minuscule
    proportion of prisoners faced trial. Many recounted here, the prevalence of disease,
    and the general brutality of their treatment.³⁴³ Female prisoners


