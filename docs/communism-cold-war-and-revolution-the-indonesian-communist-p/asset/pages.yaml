    From late 1965, a number of civilian groups provided political cover for the army’s
    moves against the PKI. Major religious organizations, in coordination with elements
    in the army, quickly condemned the Thirtieth September Movement and blamed it
    on the PKI.¹130 The national leadership of the NU and Muhammadiyah issued statements
    in early October demanding that the PKI be banned and ‘eradicated’ (dikikis habis)
    down to the very roots.¹131 Militants in NU and the Catholic Party also worked
    with the army in setting up the Action Command to Crush the 30th September Movement
    (Komando Aksi Pengganyangan Gerakan September Puluh, KAP-Gestapu).¹132 In West
    Java the major Muslim organizations quickly called for the PKI set up in the province
    along similar lines to KAP-Gestapu, probably with at least the collusion of Siliwangi
    officers.¹133 Whilst the PKI was internally divided, elements on the right of
    the party, which was particularly strong in West Java, called for the PKI to be
    banned.¹134 The coalition of religious parties and right-wing nationalists passed
    a series of resolutions in West Java’s regional councils demanding that the PKI
    and allied organizations should be banned.¹135 Meanwhile, many unions, especially
    those affiliated to Muslim groups or the army, condemned the PKI and its allied


