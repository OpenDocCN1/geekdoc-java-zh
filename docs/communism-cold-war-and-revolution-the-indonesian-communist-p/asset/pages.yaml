    # The Structure of the Book


    Having set the scene in the introduction, Chapter 1 analyses the history of the
    PKI during the period of constitutional democracy (c. 1949–57). It argues that
    international, national, and local conditions combined to shape the trajectory
    of the PKI as it grew from a tiny vanguard party to become one of the four largest
    parties in Indonesia. The chapter first traces the emergence of new leadership
    within the party at the start of the 1950s and the decision to move towards a
    broad National United Front strategy, as party leaders engaged with a dialogue
    with communist parties and responded to a shifting political context within Indonesia.
    However, the chapter warns against an overemphasis on top-down direction and argues
    that other factors in the party''s growth have received insufficient attention.
    In this context the chapter highlights the unleashing of activist energies at
    the grassroots and the efforts the party made to adapt to local conditions by
    navigating social, cultural, and ethnic cleavages in society. As the PKI extended
    its networks, it tapped into socio-economic tensions, was sensitive to regional
    ethnic identity, and made sustained efforts to engage with pious Muslims who seemed
    open to cooperation. The chapter then analyses how these forces interacted during
    the elections of the mid-1950s. Finally, the chapter examines the relationship
    between the PKI and the security apparatus in the 1950s, pointing to emerging
    tensions but also warning against projecting the conflicts of the 1960s onto the
    early and mid-1950s.


    Chapter 2 examines the party during Indonesia''s period of authoritarian ''Guided
    Democracy'' (c. 1957–65). It argues that the PKI''s rapid growth during this period
    grew strains within the party as well as broader sociopolitical polarization.
    The PKI expanded quickly, and its leaders made efforts to increase their control
    of the organization. However, the chapter argues that growth created barriers
    to top-down direction and the PKI became more internally differentiated and less
    coherent as a movement. The result was an awkward combination of the hierarchical
    logic of a vanguard party with the scale of a mass party and the energy of a social'
