  md: '# COMMUNISM, COLD WAR, AND REVOLUTION


    overshadowing all serious setbacks for the world communist movement’ that year.²
    The PKI’s size, the social breadth of its influence, and the diversity of setting
    it a particularly valuable case study for understanding how communism took root
    in the mid-twentieth century in the decolonizing world, amid international, national,
    and local contexts.³ The question of the party’s political and social significance
    is also important in understanding the global Cold War, modern Indonesian history,
    and the nature of revolution and counter-revolution. Despite the PKI’s size and
    significance, it has been relatively neglected in the study of global communism.⁴


    The following sections explain a series of interrelated arguments that underpin
    the study. The first section outlines evidentiary limitations and a tendency to
    focus on the PKI’s destruction in the mid-1960s have tended to limit consideration
    of the party’s experience during the preceding years. A second section highlights
    the emergence of new sources and new scholarship is beginning to change this situation.
    A third section introduces the concept of ‘archipelagic communism’, a term the
    book uses to characterize Indonesian communism in the 1950s and 1960s to encapsulate
    the way the PKI achieved rapid growth and impressive scale while navigating an
    increasing pluralism in global communism and a context of extreme local cultural
    and social diversity. The section explains how this approach speaks to three distinct
    but interrelated historiographical themes, in particular scholarship on ‘plural
    communism’, a ‘centred Cold War’ and the idea of Indonesia’s ‘revolutionary worlds’.
    A further section argues that the PKI during this period should be thought of
    not just as a revolutionary organization but also a movement that gained much
    of its dynamism from forces emerging from below. This fits with a view of the
    PKI as an important part of Indonesia’s ‘long revolution’ amidst ongoing struggle
    over the sociopolitical settlement in post-independence Indonesia. This was a
    struggle which was curtailed by the counter-revolution of the


