    Fatally Belonging (Abingdon: Routledge, 2006), ch. 1. For the continued salience
    of the issue, see Redy Pahrun Wadipala, ''The Communist Imaginary in Indonesia''s
    2014 and 2019 Presidential Elections,'' PhD dissertation, University of Leeds,
    2022.'
