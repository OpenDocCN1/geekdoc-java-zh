    mass organizations over polygamy, with some men seeking to ally with their female
    comrades on an issue they saw as a lapse of communist morals.246


    In conclusion, Gerwani drew on strands of women''s activism that had emerged prior
    to during the War of Independence both nationally and within West Java. Gerwani
    developed a powerful ideological synthesis together feminism, socialism, and anti-imperial
    nationalism. Through this combination Gerwani could address everyday problems
    and regional issues such as the impact of Darul Islam, also tapping into patriotic
    sentiment and connecting to broader left-feminist solidarities. This combination,
    along with extensive social work, bound a diverse membership that could focus
    on issues in Gerwani''s agenda that were most relevant to an individual level.
    Gerwani''s growth was bound up with the emergence of an expanding family of organizations
    allied to the PKI, but Gerwani also sought to work with other women''s organizations.
    Over time, the PKI extended its influence in Gerwani, and rhetoric was increasingly
    aligned with the party. The PKI also worked to increase its female membership,
    seeing women PKI members as an inseparable part of broader revolutionary efforts
    who also acted as a vanguard within Gerwani. In this context, there was growing
    tension between the agenda of some Gerwani activists and the tendency of PKI leaders
    to subsume gender inequalities into issues of class, whilst failing to enact gender
    equality within the party itself.


