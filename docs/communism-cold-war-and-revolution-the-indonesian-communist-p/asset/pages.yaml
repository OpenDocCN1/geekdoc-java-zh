    surveillance and stigmatization continued to afflict hundreds of thousands of
    those marred with the allegation of communist treason. Those released from mass
    detention during this period gained a form of semi-freedom, where they were tracked
    by the authorities and denied many civil rights. In this case, the long-term detainees
    joined a much larger group who had been designated by the authorities as part
    of ‘forbidden organization’ (i.e. the PKI or its allied organization) but who
    had been detained briefly, if at all. The total number marked in official records
    of West Java was 29,631 in 1971 and was as high as 172,853 as de 1992.¹191 This
    grey zone of official monitoring could involve an ‘obligation to report in’ (wajib
    labor) regularly to military or local government offices¹192 and the marking of
    identity cards with their status as former prisoners.¹193 Some were also required
    to perform unpaid labour on public works.¹194 During national elections they were
    detained,¹195 indoctrinated.¹196 prevented from voting,¹197 compelled to compete
