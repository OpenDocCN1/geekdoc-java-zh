  md: '# 224 COMMUNISM, COLD WAR, AND REVOLUTION


    This section has primarily focused on developments up to the fall of the military
    regime at turn of the 1990s. The fall of the military dictatorship at the turn
    of the century led to important changes in national conditions that have provided
    greater room for civil society to mobilize and to question anti-communist narratives.
    These efforts have been led by elements of society including NGOs, journalists,
    and artists.248 There have also been a series of stop-start (and half-hearted)
    government initiatives to address past human rights abuses including in 1965–6.,249
    However, there has also been a resilient strain of anti-communism and ongoing
    resistance to a serious historical reckoning.250 The backlash occurred amid national
    trends that have seen efforts to gain redress blocked.,251 publications on the
    PKI or the violence of 1965–6 censored,252 and public events addressing these
    issues disrupted by vigilantes.253 The backlash has been particularly severe in
    West Java, stoked by the thriving Islamic vigilante in the province and the instrumentalization
    of anti-communism by certain political factions.,254 Over century later, the impact
    of the PKI’s destruction continues to leave a mark on Indonesian public life.


    Overall, the implications of Indonesia’s counter-revolution were profound, even
    beyond the fate of those killed and imprisoned, and those stigmatized and tracked
    by the state. Anti-communism was a central element in the New Order’s propaganda.
    The destruction of SOBSI, the BTI, Gerwani, and ethnic minorities Peas marked
    the elimination of some of the most important organizations representing peasants,
    women, and minorities.


