    Chapter 4 focuses on the violent destruction of the PKI in the mid-1960s. The
    chapter argues that the PKI''s violent destruction 1965–6 was both an event of
    international significance and a moment of counter-revolutionary mobilization
    in which hard-line anti-communist army officers in the provinces played an important
    role. The demise of the PKI was an important juncture in the Cold War and a major
    setback for communism in the Global South. Intensifying Cold War competition in
    Southeast Asia provided important context for the mass violence of the anti-communist
    purge, which was closely monitored and in some cases assisted by major Western
    powers. However, the chapter argues that the PKI''s destruction was also a process
    of ''composite'' countermobilization on the part of an communist coalition. This
    amounted to a counter-revolution that entailed a wide-ranging realignment in Indonesian
    society. The chapter highlights the important role played by a group of vehemently
    anti-communist army officers in West Java, who allied with the central military
    command and segments of broader society to escalate anti-communist violence and
    accelerate the marginalization of the political left. In doing so, they helped
    West Java into a launch pad for the establishment of a new regime. The chapter
    sees the PKI''s destruction as integral to the emergence of an authoritarian and
    vehemently anti-communist ''New Order'' that left peasants and workers vulnerable
    to exploitation, the ascendency of patriarchal state ideology, and stigmatmatized
    the ethnic Chinese and alleged ''atheists''. As was the case in a number of other
    countries, a Cold War crisis and counter-revolution intersected with profound
    and lasting-socio political implications.


    The Conclusion steps back to consider the PKI''s experience as reflecting a conjecture
    of global, national, and local histories: the weakening of international communist
    unity, the growth of communism in the decolonizing world, the efflorescence of
    mass mobilization emerging from the Indonesian Revolution, and the energy and
    ingenuity of grassroots activists amid their local milieux. The Conclusion also
    engages with scholarship on other communist parties and highlights the significant
    accomplishments as well as the limitations of the PKI''s ''archipelagic communism''.
