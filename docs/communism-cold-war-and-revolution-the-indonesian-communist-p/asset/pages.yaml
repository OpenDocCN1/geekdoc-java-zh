    pulled in different directions. The BTI''s central leadership joined the PKI in
    backing the famous Delengku strike in the run-up to the Madiun Affair.81 Some
    of the BTI''s policies differed from those of the PKI at the time, the BTI giving
    greater emphasis to the direct distribution of land to farmers.82 The BTI was
    also quick to make a statement itself from any parties following the Madiun Affair.83
    Besides the ideological heterogeneity of its leadership, there was also geographical
    and organizational variation. During the revolution a wide range of peasant organizations
    were formed, some entirely new and others drawing on organizations which had first
    emerged in the Dutch and Japanese periods.84 Diversity was particularly pronounced
    in West Java, where the Dutch occupation from mid-1947 made it hard for the BTI
    to operate.85 The PKI''s response was to build another organization in the area:
    the Indonesian Peasants'' Association (Rukun Tani Indonesia, under Hartarto).86
    organizations also sprang up, including the Indonesian Peasants'' Party, the Indonesian
    Peasants'' Union (SakTI), the Peasants'' Association (Gabungan Rakyat, Garap),
    and the People''s Movement (Gerakan Rakyat).87


