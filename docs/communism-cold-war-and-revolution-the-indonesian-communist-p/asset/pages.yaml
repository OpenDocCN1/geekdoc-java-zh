    Gerwani’s organizational development in West Java was bound up with the growth
    of a family of organizations allied to the PKI. An important element in this dynamic
    was Gerwani’s transformation from a care organization of ‘conscious’ women towards
    becoming a mass organization. The trend was marked by its name change in 1954,
    in which somewhat exclusive ‘conscious’ was dropped from the organization’s name.
    West Java, Gerwani increasingly branched out from heartlands such as Bandung into
    rural areas and around 150,000 members in the province by the mid-1960s.²17 There
    was a natural synergy with the SOBSI trade union federation, given that substantial
    proportions of workers were women, including an estimated 45 per cent of plantation
    workers and 65 per cent of textile workers, both industries strongly represented
    in West Java.²18 Sarbupi and SOBSI leader in West Java called how, on plantations
    where ‘many’ female labourers joined both Sarbupi and Gerwani, and ‘there was
    good cooperation’ between the organizations.²19 Indeed, sometimes Gerwani events
    were held in union buildings. In the countryside, there was also overlap between
    BTI and Gerwani, aided by the increasingly strong female representation within
    the BTI—in 1965 Nyoto claimed that half of all BTI members were women.²20 Gerwani
    and the BTI members worked together during the Unilateral Action reform campaign.²21
    Both the BTI and SOBSI paid increasing attention to mobilizing female members
    from the late-1950s (although most leadership positions were still held by many).²22
    The PKI was keen to ensure cooperation between allied organizations, with both
    the party and Gerwani seeing this as preferable to


