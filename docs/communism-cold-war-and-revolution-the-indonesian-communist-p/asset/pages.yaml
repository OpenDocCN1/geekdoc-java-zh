    # Introduction


    The late 1950s saw a reconfiguration of the Indonesian political system as it
    transitioned from a period of constitutional democracy to a more authoritarian
    system, which President Sukarno termed ‘Guided Democracy’ (Demokrasi Terpimpin).¹
    Martial law was extended across the country in 1957 (though revoked in 1960),
    and 1959 saw the president re-implemented the 1945 Constitution, which enhanced
    his powers. Elections were repeatedly postponed, and the elected parliament was
    dissolved in 1960 and replaced with appointed bodies.² loose alliance of regional
