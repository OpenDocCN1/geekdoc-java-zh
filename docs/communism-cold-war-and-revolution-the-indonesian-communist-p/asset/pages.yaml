  md: '# THE PKI’S DESTRUCTION AND INDONESIA’S ‘NEW ORDER’ 227


    party in other parts of Java. This was particularly important given West Java’s
    strategic position adjacent to the capital. A radical coalition within the Siliwangi
    Division then played an important role in making West Java a base that facilitate
    the new regime’s consolidation of power.


    Several significant checkpoints in the shifting balance of power occurred in West
    Java in 1966, including Sukarno’s issuing of an order delegating wide-ranging
    powers to Suharto in the march, the conference saw the purging of the PNI’s left
    wing in April, and the MPR session that saw the PKI permanently banned in July.
    In August 1966 in Bandung a seminar was held at the army training school. At the
    seminar ‘army for the first time systematized the philosophical foundations of
    the New Order.’²⁵⁹ This was symbolic of the way West Java had a launch pad for
    the ‘New Order’ regime.


    The broader counter-revolution was built up with the creation of a new sociopolitical
    order. Earlier chapters have highlighted how the PKI had become woven into Indonesia’s
    social fabric. The impact of the PKI’s destruction also rippled outwards through
    society. The social and political were intertwined both in revolution and counterrevolution.
    The most immediately impacted were those killed, those who lost ones, or those
    who were detained, and those stigmatized and surveilled for past associations
    or family ties. More broadly, an anti-communist mythology permeated New Order
    society which stifled dissent (including from workers and peasants), reinforced
    a patriarchal view of society, impoverished culture life, and stigmatized the
    ethnic Chinese and those not adhering to an officially recognized religion. Anti-communism
    remains a potent force in Indonesia and has become entangled with vigilantism,
    a phenomenon that has been particularly pronounced in West Java. Efforts to address
    honestly the PKI’s violent destruction continue to meet strong resistance.


