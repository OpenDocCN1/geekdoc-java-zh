  md: '# CONCLUSION 239


    of the New Order in the region provided a launch pad for regime consolidation
    elsewhere in the country.


    The PKI’s destruction was a significant setback for international communism, a
    violent juncture in the global Cold War, and a counter-revolutionary turning point
    for Indonesia. One of the largest communist parties in the world was eliminated
    amid a surge in Cold War conflict and counterrevolutionary mobilization. Even
    as conflict in Indochina was escalating, Indonesia now became an important element
    in a Western-aligned anti-communist ‘arc of containment’ along the maritime perimeter
    of East Asia.²32 Having backed anti-communist rebels in the early 1950s and built
    close relations with the army, the US encouraged and supported the army as it
    led the PKI’s violent destruction and then worked closely with the new regime.
    Meanwhile within Indonesia the coalescing of an anti-communist coalition spearheaded
    by actors forged a new sociopolitical order. The ‘New Order’ was both anti-democratic
    and anti-communist, a combination that manifested in brutal violence and long-term
    repression, the neutering of peasant and labour movements, the assertion of a
    patriarchal ideology, the elimination of vibrant cultural traditions, and the
    stigmatization of ethnic and religious groups. Despite significant changes in
    Indonesian politics and society since the end of the military regime, the legacies
    of the anti-communist purge continue to leave an imprint on Indonesia up to the
    present.


    In this context, it is right that the PKI’s destruction has gained scholarly and
    global attention in recent years. Yet for a full understanding of this period
    it is important, as scholars such as Zhou Taomo and Vanessa Hearman have argued,
    to go beyond ‘event history’ so as be able to understand longer-term historical
    processes and their significance.³³ Ioannis Balampanid own, although with a different
    temporal and geographical focus, has highlighted the value in examining ‘moments
    of transformation’—a range of transient ‘potentialities’ in the international
    history of the Left.³⁴ The PKI’s ‘archipelagic communism’ represented a daring
    experiment within a global movement that profoundly shaped the twentieth century.
    The party operated in a conjecture that saw global, national, and local


