    of 100 million people of many different ethnic groups, and with a very uneven
    population density.¹47


    The book, therefore, uses the term ‘archipelagic communism’ to encapsulate a juncture
    with global, national, and local dimensions. In a period when global communism
    was diversifying, the PKI navigated and synthesized varied transnational influences
    and achieved rapid growth and significant influence in a context of extreme local
    diversity. Although the term ‘archipelagic communism’ was not used by PKI leaders,
    an underlying tension between unity and particular ran through their thought and
    praxis. The book’s argument runs counter to an excessive focus on any one individual
    in the history of the party and the tendency of some scholars to view the 1950s
    and the 1960s as representing ‘communism as la Aidit’⁴⁸ There is, a poetic resonance
    in what Aidit chose ‘Archipelago’ (Nusantara) as his adopted name.⁴⁹


