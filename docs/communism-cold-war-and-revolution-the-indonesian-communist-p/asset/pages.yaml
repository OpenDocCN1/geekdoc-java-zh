    in SOBSI''s call to ‘prevent sabotage, smooth production, and strengthen unity’⁷³
    Although both the PKI and SOBSI stepped up criticism of ‘capitalists bureaucrats’,
    they did little to back this up with concrete action.⁷⁴ The reality of labour
    relations in the nationalized industries was a messy balancing of different interests,
    with benefits to workers far from. A student researching a plantation where workers
    were almost all SOBSI members found that workers had seen little benefit from
    nationalization. Besides a small wage ‘there was no difference from the previous
    situation, indeed they have to work more rapidly’⁷⁵


    In conclusion, SOBSI emerged through a process that channelled union activism
    emerging from the revolution into an overarching organizational structure. West
    Barat''s substantial agro-industry, transportation, and manufacturing forces forced
    it into a relatively strong union in the region that spanned urban and rural areas,
    although sugar-producing areas, which brought union workers and peasants into
    particularly close interaction, were less common than in Central and East Java.
    Over time, SOBSI became hierarchical and the PKI became increasingly influential
    in SOBSI''s leadership. However, union activists at lower levels tended to focus
    on representing their workers on day-to-day issues, and the grassroots membership
    of affiliated unions was ideologically uniform. Both the PKI''s policy and tightening
    legal restrictions over time dampened labour militancy to some extent, and under
    Guided democracy organised even greater pressure, with an ambivalent PKI and an
    entrenched security apparatus limiting SOBSI''s room for manoeuvre amid waves
    of nationalizations. SOBSI remained an important body representing labour, but
    there were growing question marks over its ability to promote a broader revolutionary
    movement.


