    given SOBSI’s complexity as a federation spanning a wide range of sectors, unions,
    and localities.


    More broadly, the possibilities for trade union activism were constrained by a
    combination of shifting political, local, and socio-economic contexts. This was
    evident in the fluctuating extent of labour militancy during the 1950s and 1960s,
    which had three phases: a wave of major strikes occurred in 1950–1, followed by
    ongoing strike action at a lower level around 1957, before strikes tailed off
    significantly (see Figure 3.1). The strikes of 1950–1 marked with a Sarubpri strike
    involving hundreds of thousands of workers. Although activists played important
    roles and outsiders detected communist influence, it is easy to exaggerate the
    PKI’s impact. The party had only a few thousand members at the time and was driven
    by an internal leadership struggle. More important in stimulating the wave of
    industrial action seems to have been the collision of terrible working conditions
    with mushrooming labour organizations and rising expectations in post-war Indonesia.¹⁰
