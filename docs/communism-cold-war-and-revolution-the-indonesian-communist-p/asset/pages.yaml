    # Archipelagic Communism amid Cold War and Revolution


    This study introduces the term ''archipelagic communism'' as a means to capture
    the creativity and adaptability of Indonesian communism during the 1950s and 1960s
    resulted in rapid growth and immense scale amid a context of growing global complexity
    and extreme local diversity. Scholars of Indonesia (and Southeast Asia more broadly)
    have given considerable thought to the ''heterogeneity of archipelagic intermediity'',
    ''communication and cohesion'' amid a context characterized by great plurality.^42
    In this context the term ''archipelagic'' can helpfully used to denote the simultaneous
    ''entanglements of transnational connections, national belongings and local sensibilities.''43
    In examining the reciprocal relationship between the PKI and its contexts, this
    study uses the concept of ''archipelagic communism'' to bring into dialogue a
    series of historiographical strands relating to ''plural communism'', a ''decentred
    Cold War'' and Indonesia''s ''revolutionary worlds''. Communist movements have
    always had to reconcile the challenge of a universalizing ideology and particular
    local circumstances. However, this book uses the term ''archipelagic communism''
    to refer to a distinctive juncture at global, national, and local levels that
    was embodied by the PKI during this period.


    At a global level, the 1950s and 1960s was a time of increasing pluralism in the
    communist world as decolonization accelerated and China increasingly to offer
    another inspiration for revolutionaries in the Global


