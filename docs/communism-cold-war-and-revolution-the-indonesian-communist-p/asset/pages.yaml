    # Introduction


    Through the 1950s and into the 1960s the PKI became increasingly entwined with
    a series of mass organizations ranging from trade unions to associations for peasants,
    women, youth, students, artists, and intellectuals, among others. The PKI''s close
    engagement with mass organizations during this period was shaped by a combination
    of practical and theoretical considerations. In part, the importance of these
    bodies reflected a burgeoning of organizational life across all fields of society.
    This process had begun in the early twentieth century but was greatly accelerated
    by the societal ferment amid the War of Independence and continued to develop
    in the post-war period. This social context detailed with Marxist-Leninist attentiveness
    to the interaction of social and political forces, and the PKI''s concern ''rousing,
    mobilizing, and organizing the masses''


    Efforts to cultivate allied mass organizations were in evidence soon after the
    party was founded in the mid-1940s. When the PKI leadership consolidated at a
    party congress in 1947, a supporting committee had been established with representatives
    for labour affairs, peasant affairs, youth affairs, and women''s affairs. At the
    same congress, there were calls for party members to join organizations such trade
    unions, peasant fronts, or organizations for young people or women. In doing so,
    PKI drew inspiration from Lenin and Stalin in the party''s ''manifestation of
    the bond between the workers and their vanguard,'' with an obligation to strengthen
    a connection to the


