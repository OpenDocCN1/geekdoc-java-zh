    # Conclusion


    The story of the PKI under Constitutional Democracy was one of adaptability. The
    national leadership adapted to an evolving international environment and shifting
    domestic political contexts. The takeover of the PKI by the Aid leadership at
    the start of the 1950s was followed by important shifts in policy. Over the next
    few years the party shifted away from struggle, instead engaging with the parliamentary
    system, advocating a broad ‘National United Front’, setting the PKI in the direction
    of becoming a mass party. These shifts reflected the changing political landscape
    within Indonesia and an ongoing dialogue between PKI leaders and comrades abroad.
    However, there was still a long way initiating such a policy and bringing it to
    fruition. The national PKI leadership worked to exert control from the apex of
    the party, and the PKI drew on a Leninist model of democratic centralism.


    Crucially, though, the party and its activists on the ground also adapted to local
    contexts. In this sense, the case of West Java, although conditioned by particular
    circumstances in the province, was revealing of a wider trend. It is easy to exaggerate
    the impact of top-down direction, given the difficulty of managing cadres on the
    ground, and even in the party’s theoretical formations there was a prominent strand
    emphasizing the initiative of activists and sensitivity towards local contexts.
    In this context, midlevel cadres, whose activism emerged out of experiences during
    the revolution and who often bound the party to allied mass organizations, played
    a crucial role. The emergence of such networks in West Java was part of a pattern
    occurring in other areas of Indonesia, particularly across Java and parts of Sumatra.


    The reach and spread of party networks were shaped by a range of factors including
    socio-economic strains, sociocultural divisions, and the influence of ethnicity.
    The PKI softened its rhetoric on the relationship between the proletariat and
    the revolution over time, allied trade'
