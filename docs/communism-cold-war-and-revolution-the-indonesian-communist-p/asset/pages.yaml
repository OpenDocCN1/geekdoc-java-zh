    Indies. The PKI''s forerunner, the Indies Social Democratic Association (Indische
    Socialist Vereniging, ISDV) was founded in 1914. Initially, it had only dozens
    of members, was dominated by Europeans, and represented a broad spectrum of socialist
    views.133 By 1920, when the organization changed its name to the Communist Party
    in the Indies (Perserikan Kommunist di India, PKI).134 it still had only a few
    hundred members. However, the organization had undergone an important transformation:
    its leadership had been Indonesianized, its politics more closely attuned to internationalism,
    and had begun expanding.135 The PKI''s emergence against a background of broader
    changes, such as urbanization and the developing communications infrastructure,
    which had stimulated the development of new forms of


