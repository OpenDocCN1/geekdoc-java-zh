    This chapter takes as its starting point the suggestion that, as well as a serious
    setback for global communism and a Cold War flashpoint, the convulsions experienced
    during the mid-1960s also constituted a ‘counter-revolution’ that involved a reorganisation
    of social forces.¹17 Recent scholarship on the anti-communist purge has made the
    role of state institutions, above all the Indonesian army leadership, increasingly
    clear.¹18 Whilst recognizing the importance of the state apparatus and its natural
    leaders, viewing the events of the mid-1960s as a counter-revolution necessitates
    a sensitivity to the importance of alliances within the state and between state
    agents and social groupings. Grzegorz Ekiert and Elizabeth Perry have conceptualized
    counter-revolutionary actions within a framework of ‘state-mobilized movements’,
    arguing that state intervention comes not from the centre but from multiple ‘bureaucratic
    agents’ in varied ‘strategic and spatial locations’, amid processes that involve
    innovation and adaption on the part of state and society.¹19 In particular, this
    chapter highlights the importance of networks of hard-line army officers in the
    provinces in driving forward the anti-communist purge in alliance with army leaders
    in Jakarta as well as civilian groups.


    The first two sections of this chapter develop this line of thinking with regard
    to West Java in particular, paying close attention to the formation of anti-communist
    coalitions both within the armed forces and civilian groups. The first section
    (‘The Army, Society and Anti-Communist Violence’) examines the destruction of
    the PKI in West Java and traces the impact of evolving struggles within the Siliwangi
