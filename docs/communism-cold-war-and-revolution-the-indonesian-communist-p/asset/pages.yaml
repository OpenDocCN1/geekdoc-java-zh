    There is evidence that somewhat parallel processes at the grassroots were happening
    in other areas of Indonesia where the PKI was rapidly reconstructing itself. The
    biographies of provincial PKI leaders across Indonesia in the mid-1950s, most
    of whom started at lower levels in the early 1950s, often reflected comparable
    trajectories to those in West Java.^70 The evocative memoir of Siswoyo, who rose
    rapidly in the party in Central Java during the late 1940s, for example, conveys
    the impact of revolutionary legacies, a transition between generations, and the
    interweaving of allied organizations.^71 The process was somewhat uneven, though
    was most adjusted in Java and parts of North and South Sumatra. There were also
    signs of the party gaining a foothold in Bali and some cities in Eastern Indonesia
    such as Manado in Sulawesi and Pontianak in Kalimantan.^72 However, in less accessible
    parts of Eastern Indonesia that were less well integrated into national politics,
    expansion by the PKI would occur significantly later.^73


    Thus, while the PKI was in a perilous position at the start of the 1950s, we should
    not take Aid'' claims to have rebuilt the party from the ground up at face value.
    The national leadership skillfully engaged with overseas comrades and attentiveness
    to domestic contexts, provided a sense of direction, and set out the contours
    of a strategy that made a transformation into a mass party possible. However,
    in reality it was hard to control cadres on the ground, and there was a counterv
    ideological tendency that emphasized sensitivity to local conditions and the need
    for members to have initiative. Energetic activists brought a zeal to organizing
    that helped generate the momentum behind self-sustaining networks and complemented
    the development of allied mass organizations. This process set the stage for the
    PKI''s unexpectedly robust


