    Overall, then, a West Java case study has the potential to illuminate developments
    at a wider level. West Java was a populous province in a strategically important
    location and was home to important national institutions. It also has as good
    a claim to be a median province in terms of the political culture of the period
    as in any Indonesia. At the same time, variations between West Java and other
    parts of Indonesia, as well as West Java, make the province a useful entry point
    for exploring how the PKI navigated Indonesia''s extreme diversity, an important
    factor in the party''s growth and its limits.


    # The PKI in Western Java up to 1949


