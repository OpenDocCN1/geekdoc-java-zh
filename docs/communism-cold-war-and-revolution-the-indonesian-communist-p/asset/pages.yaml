    described itself as the ‘loyal helper of the PKI¹³⁶ Despite the size and significance
    of the People’s Youth, the PKI’s engagement with youth movements has been less
    studied than its involvement in other social movements, such as labour, the peasantry,
    or women’s activism. The analysis below argues that whilst there was an increasingly
    close relationship between the PKI and the People’s Youth, this should not obscure
    an initial degree of ideological diversity in its early years. Moreover, it highlights
    the ability of the People’s Youth to tap into an energetic idealism that combined
    activism with a growing sense of militancy and to take on forms with an increasingly
    martial edge.


    The People’s Youth in West Java grew rapidly as the 1950s progressed, with a core
    of able and better-educated leaders, initially mostly based in areas of relative
    strength for the PKI, working to expand and educate the membership. Its organizational
    footprint grew, starting from urban and plantation areas in the early 1950s;¹³⁷
    it extended into the villages, especially in PKI holdings such as Cirebon, but
    more broadly across the province, claiming it branches across West Java by 1957.¹³⁸
    Internal figures had the People’s Youth claiming 100,000 members in West Java
    at the start of the 1960s and around 210,000 by 1964.¹¹³⁹ The early core of the
    provincial leadership tended to be quite well-educated. Education and the organizational
    skills it could bring were valued at lower levels of the organization too;¹⁴⁰
    some local leaders had little in the world of formal schooling.¹⁴¹ The rank and
    file seem to have been overwhelmingly from humble backgrounds; in the words of
