    activists left bewildered and uncertain how to respond. The tactical and strategic
    decisions of the PKI’s leaders and the competing impulses within the party ultimately
    helped to polarize and destabilize Indonesian politics.


    As the Guided Democracy period progressed, a coalition of anti-communist forces
    became increasingly alarmed at the PKI''s growing power. It was Masyumi and the
    PSI had been banned, while the left wing of the PNI, whose brand of left nationalism
    dovetailed with the PKI''s agenda in some ways, found common ground on some issues
    with the PKI. However, there was ongoing resistance from others, including NU
    and the right wing of the PNI. The most important countervailing force was the
    army, which commanded coercive power with a growing sense of its role in national
    affairs, in which increasingly saw communism as the key threat. By 1965 the mutual
    suspicion between the leaderships of PKI and army were escalating yet further.
    This situation was exacerbated by swirling rumours and conversations with overseas
    allies who were keen to boost the PKI''s position at a national level and the
    unevenness of its progress.


    Developments within West Java provided hints of the fragility of the PKI''s position
    at a national level and the unevenness of its progress. While there were regions
    (both within the province and in the country at large) where the PKI had become
    the largest party, there were other areas where it was only just starting to make
    inroads. Where PKI strength was not overwhelming, rival political parties sometimes
    tried to freeze it out. Meanwhile, the army became more entrenched in society,
    following a path pioneered by the Siliwangi Division. The anti-Chinese crises
    of 1958–60 and 1963, with their epicentre in West Java but with national and international
    implications, were a taster of the dangers posed by an alliance of anti-communist
    forces. These dangers were to be realized with terrible consequences in 1965–6
    (see the section ''The Army, Society, and Anti-Communist Violence'' in Chapter
    4).'
