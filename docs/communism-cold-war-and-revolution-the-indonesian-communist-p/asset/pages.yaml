  md: '# INTRODUCTION 25


    Beyond the importance of West Java in itself, a study of West Java has particular
    potential to speak to the PKI''s broader development. The province has as good
    a claim as any to being median region in the politics of Indonesia during the
    studied period. West Java shared some similarities with the political cultures
    of other parts of Java (such as areas of PKI strength), and also with those of
    Indonesia''s outer islands'' (such as the reformist Islamic Masumi Party).¹²³
    The PKI''s 11 per cent share in West Java in the 1955 election was approximately
    halfway between the 26 per cent achieved in its strongest province, Central Java,
    and the 0.5 per cent it received in its weakest province, East Nusa Tenggara.¹²⁴


    Whilst in some regards West Java could be thought of as a median region in Indonesia''s
    politics during the period, there were also a number of factors that made it distinctive,
    as would be expected, given Indonesia''s extreme diversity. West Java''s ethnic
    make-up set it apart from the rest of the island. The largest ethnic group in
    West Java is the Sundanese, who at the point of Indonesian independence made up
    about 14 per cent of the Indonesia population. The largest ethnic group in Indonesia,
    the Javanese, constituted around 45 per cent of Indonesia''s population, with
    Javanese concentrated in the provinces of Central and East Java.¹²⁵ The ethnic
    difference of the Sundanese was also entwined with variations in religious culture:
    Islam was the majority religion throughout Java, but Sundanese ethnicity has often
    been seen as particularly closely identified with Islam.¹²⁶ In terms of socio-economic
    development, in general West Java experienced lower levels of overcrowding but
    higher levels of inequality than Central and East Java.¹²⁷ A further distinctive
    aspect was the region''s


