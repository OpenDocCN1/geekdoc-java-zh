    apparent in late 1965.


    # A West Java Case Study


    This study engages with developments at international and national levels but
    pays particular attention to developments in the province of West Java (see Map
    0.1 and Map 0.2).¹² A number of factors make West Java a valuable case study for
    exploring the themes outlined above. One is that it is populous and strategically
    important province. By the 1960s West Java had a population of over seventeen
    million. This was among the highest of any province and represented almost half
    of Indonesia’s population.¹¹² The province is adjacent to the national capital,
    Jakarta, which makes control of the province important to the security of national-level
    institutions. The province was also home to a number of sites and institutions
    that had national significance. One of these was the presidential palace in Bogor,
    whilst the provincial capital Bandung became home to Indonesia’s Constituent Assembly,
    the People’s Consultative Assembly, and the Army Command and General Staff College,
    as well as the national headquarters of Indonesia’s telephone and telegraph networks.
    Bandung also added symbolic significance as the host of the first Afro-Asian Conference
    in 1955.


    ¹¹ This study defines ‘West Java’ as the area covered by the province of West
    Java during the 1950s and 1960s. This area covers the present-day province of
    West Java and Banten (separated from West Java in the year 2000), but not the
    city of Jakarta, which remains an autonomous region. The province of West Java
    was formally created after the end of the War of Independence, in 1950. On this
    basis I will refer to up to the end of the War of Independence and to West Java
    after that.


    ¹² Widojo Nitisastastro, Population Trends in Indonesia (Ithaca, NY: Cornell University
    Press, 1970), 174, drawing on census data.'
