    context see: Zhao Taomo, Archipelagic Turn: Islands as Method in Understanding
    Cold War Asia; in Masuda Hajimu, ed., Cold War Asia: Unearning Narratives, Making
    New Histories (Chapel Hill, NC: University of North Carolina, 2025); Adrian De
    Leon et al., ''Toward an Archipelagic Praxis and Method: Storytelling, and Decolonization
    across Global Asias,'' 10/2 (2024), 2–42.


    +   ^43 Hei Wai Weng, ''Archipelagic Chineseness: Competing Ways of Being Chinese
    Muslims in Contemporary Indonesia and Malaysia,'' Asian Ethnicity, 24/1 (2023),
    132–50.'
