    Lekra was keen to engage with Sundanese culture but in doing a selective and sometimes
    critical approach. Lekra activists participated in meetings about Sundanese literature,
    supporting the teaching of Sundanese in schools,279 and honouring past contributions
    to Sundanese art and cultural life.280 In particular, folk arts offered the potential
    to reach the masses, especially in rural areas where literacy rates were lower.
    The West Java branch noted that reog, wayang, and pencak were particularly widespread281
    and highlighted how folk arts could be tackle issues including inflation, ''feudalism,
    landlord exploitation, [corruption]''282 However, the commitment of Lekra activists
    to Sundanese culture tended to be qualified. Hendra Gunawan warned against a''narrow
    seafing of provincialism''.283 Buyang Saleh expressed that Sundanese literature
    was ''conservative'' and argued that the Sundanese language contained ''feudal''
    elements and needed to be ''democratized''.284 Uty Tatang argued for drawing on
