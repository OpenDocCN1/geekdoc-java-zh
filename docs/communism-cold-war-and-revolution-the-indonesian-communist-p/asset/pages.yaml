  md: '# Conclusion


    This Conclusion returns to underlying tensions that have run through the book.
    The PKI saw itself as part of a global revolutionary effort, but it also had to
    adapt to local circumstances in a context of great diversity. The party had to
    manage a shifting balance between a dynamic ''movement'' aspect and a hierarchical
    organizing impulse. In this context, the PKI became deeply embedded in Indonesian
    society; yet in a remarkably short time the party was eliminated. With the PKI''s
    destruction came the emergence of a durable and fervently anti-communist New Order,
    a regime determined to obliterate any legacy might have had.


    PKI leaders were conscious that they were part of a global movement, aware that
    communists around the world were ''busy implementing the ideals...sent reverberating
    by the Great Socialist Revolution of 1917!'' Throughout the period studied, Aidit
    and his allies engaged in an ongoing dialogue with foreign communist leaders.
    There is a danger that historians, aware of the Stalin and Mao regimes, give insufficient
    weight to the moral authority that these leaders had within the communist world.
    Stalin''s role was particularly evident as Aidit and his allies set to chart the
    PKI''s direction during the early 1950s, a period when the PKI leadership were
    also engaging with Soviet and Chinese texts. Stalin was a major influence on the
    party''s 1954 programme, which continued to be a key point of reference for the
    party in the following decade. PKI leaders also closely observed events in China
    and found the CCP''s rhetorical rhetoric, its emphasis on the revolutionary role
    of the peasantry, and its vehement anti-imperialism increasingly resonant. The
    PKI''s relationship with Khrushchev gradually soared, whilst Mao remained an important
    interlocutor. Beyond direct contacts with Soviet and Chinese leaders, the works
    of Lenin, Stalin, and Mao (as well as of other less prominent thinkers) informed
    the PKI''s ideological formulations. From the Soviet site, particularly important


