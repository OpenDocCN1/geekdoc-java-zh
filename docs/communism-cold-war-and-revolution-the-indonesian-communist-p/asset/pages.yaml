    # The PKI and Islam


    As well as influencing narratives about the interaction of Indonesia''s post-independence
    politics and socio-economic contexts, Clifford Geertz''s scholarship has had an
    enduring impact on scholars'' perceptions of the relationship between communism
    and Islam in Indonesia.¹¹² Geertz argued that Islam in Java was characterized
    by ''syncretism'' and distinguished between ''cultural types'', with pious ''santri''
    stressing Islamic dimensions, whilst peasant ''abangan'' and aristocratic-bureaucratic
    ''priyayi'' emphasized syncretic elements.¹¹³ He saw Indonesia''s post-independence
    politics as shaped by this context, with Islamic drawing support from among the
    santri, while the PKI was particularly strong among the abangan.¹¹⁴ This model
    also influenced the accounts of the PKI by Donald Holiday and Rex Mortimer.¹¹⁵
    Geertz''s analysis has subsequently been crit by a number of scholars¹⁶ but a
    distinction between less observant abangan


