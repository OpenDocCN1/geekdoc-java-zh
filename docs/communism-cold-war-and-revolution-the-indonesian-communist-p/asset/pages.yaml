    # The PKI, Campaigning, and Electoral Geography


    During the period 1955–8 Indonesia experienced three sets of elections. In 1955
    there were both national parliamentary elections and elections for a Constituent
    Assembly that was to draw up a new constitution. In 1957–8 regional elections
    were held to elect representatives to provincial, city, and district councils,
    with those in Java taking place in 1957. This section looks at the PKI’s efforts
    to mobilize support and examines the geographical distribution of its voter base.
    It interprets the elections in the light of the trends identified earlier in the
    chapter. In particular, the PKI’s campaign relied heavily on its grassroots networks
    and those of allied organizations, with central direction and mass media complementing
    these efforts. The geographical distribution of results, meanwhile, was shaped
    by the distribution of these networks, which in turn related to broader contexts,
    such as sociocultural and socio-economic cleavages, as well as ethnicity.


    The networks PKI built up during the early 1950s came into their run-up to the
    elections of 1955 and 1957. A central part of the PKI’s approach to campaigning
    was a focus on activities on the ground, and here the party benefited from its
    track record of work in local communities. One member of the West Java PKI leadership
    later recalled the most important election preparation being:


    concrete mass actions...for example in plantation areas, focusing on those who
    were squatting on empty land, defending them from eviction... also [setting up]
    cooperatives for lending and borrowing...there were lots of things where the people
    could feel the benefit. So they did forget that...these were the result of the
    PKI’s efforts.¹¹⁹⁷


    The national leadership recognized the importance of this work and made it a key
    focal point of their electionering approach.¹¹⁹⁸ For example, they set up ‘action
    committees’ mirroring the party structure to the village level which were tasked
    with supporting voter registration and turning out


