    arser we can occasionally get a glimpse of what was going on in more peripheral
    areas. For example, following the formation of the Indramayu branch in 1958, its
    plans included participating in local cultural events and festivities, setting
    up wayang performances, holding cultural lectures, publishing a book on Indramayu''s
    culture, and sending a troupe of actors to the national Lekra congress.


    Lekra fitted into a web of mutually supportive mass organizations linked to the
    PKI, creating a symbiotic network which strengthened their attraction at grassroots
    level. Lekra often performed at events organized by the PKI or its allied mass
    organizations. These activities were particularly valuable, given groups such
    as plantation workers and poor village youth had few entertainment options. Lekra''s
    involvement complemented the cultural activities of other mass organizations such
    as Sarubpuri''s culture and sport sections and the People''s drama and drum bands.
    These activities helped create a sense of solidarity. A People''s member recalled
    seeing Lekra as an allied organization, even if the precise was not always clear.
    For those who took part in artistic activities which were often free, they offered
    opportunities for self-development and building self-esteem. One plantation activist
    saw Lekra allowing people to develop their talents in whatever kind of art.


    Lekra in West Java also joined an elite of Sundanese writers and artists who maintained
    connections to West Java but whose lives, careers, and interests extended beyond
    West Java to national and international levels. The best-known included the painters
    Hendra Gunawan and Tatang Gangar, the playwright Utuy Tatang Satoni, and a number
    who wrote and edited, including Siti Rukiah, A. S. Dharta, and Buyung Saleh.


