  md: '# INTRODUCTION 3


    mid-1960s which saw the PKI violently destroyed and Indonesian politics and society
    transformed an intensifying Cold War in Southeast Asia. The next section addresses
    the puzzle of the PKI''s rapid growth during the 1950s and 1960s and its limitations.
    It highlights the party''s adaptability and its ability to navigate cleavages
    within society and weave itself into Indonesia''s social fabric. It also notes
    the importance of the party''s support for struggles against poverty and inequality.
    It also argues that Indonesia''s diversity and the potential threat the PKI posed
    to the status quo underpinned growing resistance to the party. The remaining sections
    of the Introduction then explain the West Java context and outline the history
    of the PKI in the region up to 1949. The Introduction ends with a summary of the
    structure of the book.


    # The Communist Spectre and the Shadow of 1965


    Since its destruction in 1965–6, the PKI has a strange afterlife, maintaining
    a spectral form of existence as a looming, yet elusive presence in Indonesian
    public life. The military dictatorship that ruled from the mid-1960s to the late-1990s
    made anti-communism an important part of its identity and a central theme in its
    propaganda, and even in recent years have been periodic attempts to stroke fears
    of a supposedly revived PKI.⁵ Yet despite this salience in official discourse
    and the popular imagination within Indonesia, there have been ongoing difficulties
    in reconstructing the party''s history. The most obvious is the murder of many
    members and supporters of the party and its allied organizations in the mid-1960s,
    which means they will never be able to tell their stories. Many others were imprisoned
    for long periods and subject to state surveillance upon release. This occurred
    amidst a broader repressive climate under the military regime that severely curtailed
    free discussion of the PKI. Even since the fall of the dictatorship, despite greater
    political freedom and increased leeway for critical enquiry within the public
    sphere, conducting


