- "# Android Studio Chipmunk 必备 - Java 版：使用 Android Studio 2021.2.1 和 Java 开发 Android\
  \ 应用\n\n\n\n![](img/java_chipmunk_front_cover_large.png)\n\n\n\n\n\n\n\n\n\n# 简介\n\
  \n本书已针对 Android Studio Chipmunk 完成完全更新，其目标是教你如何使用 `Java` 编程语言开发 Android 应用程序。\n\n\
  从基础知识开始，本书提供了设置 Android 开发和测试环境所需的步骤大纲。书中包含了对 `Android Studio` 的概述，涵盖了工具窗口、代码编辑器和\
  \ `Layout Editor`（布局编辑器）工具等领域。在介绍 Android 架构之后，将深入探讨如何使用 `Android Studio` 环境设计 Android\
  \ 应用程序和用户界面。\n\n书中还涵盖了 Android 架构组件，包括视图模型（view models）、生命周期管理、`Room` 数据库访问、`Database\
  \ Inspector`数据库检查器）、应用导航、活动数据（live data）和数据绑定。\n\n此外还涵盖了如 `intents` 等高级主题，以及触摸屏处理、手势识别以及音频的录制和播放。本版书籍还涵盖了打印、过渡以及对折叠屏设备的支持。\n\
  \n书中还详细介绍了材料设计（material design）的概念，包括悬浮操作按钮、`Snackbars`、标签页界面、卡片视图（card views）、导航抽屉和折叠工具栏的使用。\n\
  \n`Android Studio Chipmunk` 和 Android 的其他关键特性也得到了详细介绍，包括 `Layout Editor`、`ConstraintLayout`\
  \ 和 `ConstraintSet` 类、`MotionLayout Editor`、视图绑定（view binding）、约束链（constraint chains）、屏障（barriers）和直接回复通知。\n\
  \n章节还涵盖了 `Android Studio` 的高级功能，如 `App Links`应用链接、`Dynamic Delivery`动态交付、`Gradle`\
  \ 构建配置以及将应用提交到 `Google Play Developer Console`。\n\n假设你已经具备一些 `Java` 编程经验，准备好下载 `Android\
  \ Studio` 和 `Android SDK`，拥有 Windows、Mac 或 Linux 系统，并且对要开发的某些应用有了想法，那么你就可以开始了了。\n\
  \n## 1.1 下载代码示例\n\n书中所包含示例的源代码和 `Android Studio` 项目文件可以从以下地址下载：\n\n[`www.ebookfrenzy.com/retail/chipmunkjava/index.php`](https://www.ebookfrenzy.com/retail/chipmunkjava/index.php)\n\
  \n从代码示例中将项目加载到 `Android Studio` 的步骤如下：\n\n1. 在“欢迎使用 Android Studio”对话框中，点击 `Open`（打开）按钮选项。\n\
  2. 在项目选择对话框中，导航并选择包含要导入项目的文件夹，然后点击 `OK`（确定）。\n\n## 1.2 反馈\n\n我们希望你对购买本书感到满意。如果你在书中发现任何错误，或有任何意见、问题或疑虑，请通过\
  \ feedback@ebookfrenzy.com 联系我们。\n\n## 1.3 勘误\n\n虽然我们尽力确保书中内容的准确性，但对于涵盖如此规模和复杂程度领域的书籍，包含一些错误和遗漏不可避免的。书中任何已知问题将在以下\
  \ URL 列出并附带解决方案：\n\n[`www.ebookfrenzy.com/errata/chipmunkjava.html`](https://www.ebookfrenzy.com/errata/chipmunkjava.html)\n\
  \n如果你发现了勘误列表中未列出的错误，请发送电子邮件给我们的技术支持团队 feedback@ebookfrenzy.com 告诉我们。他们将为你提供帮助，并努力解决你可能遇到的任何问题。\n\
  \n# 2 设置 Android Studio 开发环境\n\n在开始开发 Android 应用程序之前，第一步是配置计算机系统作为开发平台。这涉及几个步骤，包括安装\
  \ `Android Studio` 集成开发环境 (`IDE`)，其中也包括 `Android 软件开发包` (`SDK`) 和 `OpenJDK` Java\
  \ 开发环境。\n\n本章将涵盖在 Windows、macOS 和 Linux 系统上安装 Android 应用程序开发所需组件的步骤。\n\n## 2.1 系统要求\n\
  \nAndroid 应用程序开发可以在以下类型的系统上进行：\n\n* Windows 8/10/11 64 位\n* 运行在 Intel 或 Apple 芯片上的\
  \ macOS 10.14 或更高版本\n* 配置 Intel i5 或更高处理器的 Chrome OS 设备\n* 版本为 2.31 或更高版本的 GNU C\
  \ Library (`glibc`) 的 Linux 系统\n* 至少 8GB RAM（见下文）\n* 约 8GB 可用磁盘空间\n* 最低分辨率 1280\
  \ x 800\n\n尽管 `Android Studio` 可以在具有 8GB 内存的电脑上运行，但在包含更多内存的系统上性能将大大提高。如果你计划使用 Android\
  \ 虚拟机模拟器 (`AVD`) 测试你的应用，这一点尤为重要。\n\n## 2.2 下载 Android Studio 包\n\n开发 Android 应用的大部分工作将使用\
  \ `Android Studio` 环境完成。书中的内容和示例是基于 `Android Studio Chipmunk 2021.2.1` 和 `Android\
  \ API 32 SDK` 创建的，在编写时这些是当前的最新版本。\n\n然而，`Android Studio` 频繁更新，因此在本书出版后可能发布了新版本。\n\
  \n可以从以下 URL 找到主下载页面下载最新版本的 `Android Studio`：\n\n[`developer.android.com/studio/index.html`](https://developer.android.com/studio/index.html)\n\
  \n如果该页面提供了下载较新版本 `Android Studio` 的说明，请注意本书与软件之间可能存在某些细微差异。如果这些差异成为问题，搜索“Android\
  \ Studio Chipmunk”应提供下载旧版本的选项。或者，访问以下网页查找 `Android Studio Chipmunk 2021.2.1`：\n\n\
  [`developer.android.com/studio/archive`](https://developer.android.com/studio/archive)\n\
  \n## 2.3 安装 Android Studio\n\n下载完成后，安装 `Android Studio` 的具体步骤取决于执行的操作系统。\n\n###\
  \ 2.3.1 在 Windows 上安装\n\n在 Windows 资源管理器中找到下载的 Android Studio 安装执行文件（命名为 `android-studio-<version>-windows.exe`），并双击它开始安装过程，如果弹出用户账户控制对话框，点击“是”。\n\
  \n一旦出现 Android Studio 安装向导，请按照各个屏幕根据你的需求配置安装，包括 `Android Studio` 应安装的文件系统位置以及是否对系统的其他用户可用。在提示选择要安装的组件时，确保选中\
  \ `Android Studio` 和 `Android Virtual Device` 选项。\n\n虽然对 `Android Studio` 在系统上的位置没有严格规定，本书的其余部分将假设安装在\
  \ `C:\\Program Files\\Android\\Android Studio`，且 `Android SDK` 包已安装在用户的 `AppData\\\
  Local\\Android\\sdk` 子文件夹中。配置好选项后，点击 `Install` 按钮开始安装。\n\n在带有开始菜单的 Windows 版本中，可以从安装期间添加的条目启动新安装的\
  \ `Android Studio`。可以通过导航到 `Android Studio\\bin` 目录，右键点击 `studio64` 可执行文件并选择“固定到任务栏”菜单选项将其固定到任务栏以便快速访问（在\
  \ Windows 11 上，此选项可以通过选择“显示更多选项”找到）。\n\n### 2.3.2 在 macOS 上安装\n\nmacOS 版 `Android\
  \ Studio` 以磁盘镜像 (`.dmg`)文件的格式下载。下载 `android-studio-<version>-mac.dmg` 文件后，在 Finder\
  \ 窗口中找到并双击打开，如 图 2-1 所示：\n\n\n\n\n\n![](img/as_dmg_drag_to_applications.jpg)\n\n\
  图 2-1\n\n要安装此包，只需将 Android Studio 图标拖动到 Applications（应用程序）文件夹中。Android Studio 包将随后安装到系统的\
  \ Applications 文件夹中，此过程通常需要几秒钟完成。\n\n要启动 Android Studio，使用 Finder 窗口在 Applications\
  \ 文件夹中找到可执行文件并双击它。\n\n为了方便以后访问该工具，可以从 Finder 窗口中拖动 Android Studio 图标并释放到 Dock（程序坞）上。\n\
  \n### 2.3.3 在 Linux 上安装\n\n下载 Linux 版 Android Studio 软件包后，打开终端窗口，切换目录到要安装 Android\
  \ Studio 的位置并执行以下命令：\n\n```bash\nunzip /<path to package>/android-studio-ide-<version>-linux.zip\n\
  ```\n\n注意，Android Studio 软件包将安装到名为 `android-studio` 的子目录中。因此，假设上述命令是在 `/home/demo`\
  \ 中执行的，软件包将将解压到 `/home/demo/android-studio`。\n\n要启动 Android Studio，打开终端窗口，切换目录到\
  \ `android-studio/bin` 子目录并执行以下命令：\n\n```bash\n./studio.sh\n```\n\n在 64 位 Linux\
  \ 系统上运行时，可能需要在在 Android Studio 运行之前安装一些 32 位支持库。在 Ubuntu 上，可以使用以下命令安装这些库：\n\n```bash\n\
  sudo apt-get install libc6:i386 libncurses5:i386 libstdc++6:i386 lib32z1 libbz2-1.0:i386\n\
  ```\n\n在基于 Red Hat 和 Fedora 的 64 位系统上，使用以下命令：\n\n```bash\nsudo yum install zlib.i686\
  \ ncurses-libs.i686 bzip2-libs.i686\n```\n\n## 2.4 Android Studio 设置向导\n\n如果您是第一次安装\
  \ Android Studio，在设置过程开始后出现的初始对话框可能类似于下方的图 2-2 所示：\n\n![](img/as_no_sdk_found.jpg)\n\
  \n图 2-2\n\n如果出现此对话框，点击 Next（下一步）按钮显示 SDK 组件设置对话框（图 2-3）。在此对话框中，点击 Next 按钮之前，请确保选择了\
  \ Android SDK 选项以及最新的 API 程序包：\n\n![](img/as_install_sdk.jpg)\n\n图 2-3\n\n点击 Next\
  \ 后，Android Studio 将下载并安装 Android SDK 和工具。\n\n如果您之前安装过旧版本的 Android Studio，在首次启动此新版本时，可能会出现一个对话框，提供从以前的\
  \ Android Studio 版本导入设置的选项。如果您有以前版本的设置并想将其导入到最新安装中，请选择相应的选项和位置。或者，表示您不需要导入任何之前的设置并点击\
  \ OK（确定）按钮继续。\n\n完成这些初始设置步骤后，点击 Finish（完成）按钮显示 Welcome to Android Studio 界面：\n\n\
  ![](img/as_bumble_bee_welcome.jpg)\n\n图 2-4\n\n## 2.5 安装额外的 Android SDK 软件包\n\n\
  到目前为止执行的操作安装了 Android Studio IDE 和当前组默认 Android SDK 软件包。在继续之前，值得花一些时间验证安装了哪些包，并安装任何缺失或更新的包。\n\
  \n此任务可以通过点击欢迎对话框中的 More Actions（更多操作）链接并在下拉菜单中选择 SDK Manager 选项来完成。一旦调用，将显示 Preferences（首选项）对话框中的\
  \ Android SDK 界面，如图 2-5 所示：\n\n![](img/android_studio_sdk_manager.jpg)\n\n图 2-5\n\
  \n首次安装 Android Studio 后，可能只安装了最新发布的 Android SDK 版本。要安装旧版本的 Android SDK，只需勾选对应版本的复选框并点击\
  \ Apply（应用）按钮。\n\n本书中的大多数示例将支持低至 Android 8.0 (Oreo) 的旧版本 Android。这是为了确保应用 运行在广泛的\
  \ Android 设备上。在 SDK 版本列表中，启用 Android 8.0 (Oreo) 旁的复选框并点击 Apply 按钮。在生成的确认对话框中，点击\
  \ OK 按钮安装 SDK。随后的对话框将在执行安装前要求接受许可和条款。安装完成后点击 Finish。\n\n可能还会列出最新 SDK 的可用更新。要访问有关准备更新的包的详细信息，请启用屏幕右下角的\
  \ Show Package Details（显示包详细信息）选项。这将显示类似于图 2-6 所示的信息：\n\n![](img/Image2471.jpg)\n\
  \n图 2-6\n\n上面的图片强调了可用更新。要安装更新，勾选项目名称左侧的复选框并点击 Apply 按钮。\n\n除了 Android SDK 软件包外，还安装了几个用于构建\
  \ Android 应用的工具。要查看当前安装的包并检查更新，请留在 SDK 设置界面并选择 SDK Tools 选项卡，如图 2-7 所示：\n\n![](img/as_sdk_tools.jpg)\n\
  \n图 2-7\n\n在 Android SDK Tools 界面中，确保以下软件包列在 Installed（已安装）列：\n\n- Android SDK Build-tools\n\
  - Android Emulator\n- Android SDK Platform-tools\n- Google Play Services\n- Intel\
  \ Emulator Accelerator (HAXM installer)\n- Google USB Driver (仅限 Windows)\n- Layout\
  \ Inspector image for API S\n\n注意 Intel Emulator Accelerator (HAXM installer) 无法在基于\
  \ Apple Silicon 的 Mac 上安装。\n\n如果上述任何软件包列为 Not Installed（未安装）或需要更新，只需勾选这些软件包旁的复选框并点击\
  \ Apply 按钮启动安装过程。如果出现 HAXM 器设置对话框，选择推荐的内存分配：\n\n![](img/as_haxm_memory.jpg)\n\n\
  图 2-8\n\n安装完成后，检查软件包列表并确保所选软件包现在列为 Installed。如果有未安装的，确保选中它们并再次点击 Apply 按钮。\n\n##\
  \ 2.6 使 Android SDK 工具命令行可用\n\n大多数情况下，Android SDK 的底层工具将在 Android Studio 环境内访问。尽管如此，在某些情况下从命令提示符或终端窗口调用这些工具将非常有用。为了让开发的操作系统能够找到这些工具，有必要将其添加到系统的\
  \ PATH 环境变量。\n\n无论什么操作系统，PATH 变量都需要配置包含以下路径（`<path_to_android_sdk_installation>`\
  \ 代表安装 Android SDK 的文件系统位置）：\n\n- `<path_to_android_sdk_installation>/sdk/tools`\n\
  - `<path_to_android_sdk_installation>/sdk/tools/bin`\n- `<path_to_android_sdk_installation>/sdk/platform-tools`\n\
  \n可以通过启动 SDK Manager 并参考设置面板顶部的 Android SDK Location: 字段来识别 SDK 在系统上的位置，如图 2-9 所示：\n\
  \n![](img/as_sdk_location.jpg)\n\n图 2-9\n\n一旦确定了 SDK 的位置，将其添加到 PATH 变量的步骤取决于操作系统：\n\
  \n### 2.6.1 Windows 8.1\n\n\n\n\n\n1. 在启动屏幕上，将鼠标移动到屏幕右下角，并在结果菜单中选择`搜索`（Search）。在搜索框中输入`控制面板`（Control\
  \ Panel）。当`控制面板`图标出现在结果区域时，点击它在桌面上启动该工具。\n\n2. 在`控制面板`中，使用`类别`（Category）菜单将显示更改为`大图标`（Large\
  \ Icons）。从图标列表中选择名为`系统`（System）的项目。\n\n3. 在`环境变量`对话框中，在系统变量列表中找到 `Path` 变量，选中它并点击`编辑…`（Edit…）按钮。在编辑对话框中使用`新建`（New）按钮为\
  \ `path` 添加三个新项。例如，假设 Android SDK 安装在 `C:\\Users\\demo\\AppData\\Local\\Android\\\
  Sdk`，则需要添加以下项目：\n\n```\nC:\\Users\\demo\\AppData\\Local\\Android\\Sdk\\platform-tools\n\
  C:\\Users\\demo\\AppData\\Local\\Android\\Sdk\\tools\nC:\\Users\\demo\\AppData\\\
  Local\\Android\\Sdk\\tools\\bin\n```\n\n4. 点击每个对话框中的`确定`（OK）并关闭系统属性控制面板。\n\n通过按下键盘上的\
  \ `Windows + R` 并在运行对话框中输入 `cmd` 来打开命令提示符窗口。在`命令提示符`窗口中输入：\n\n```bash\necho %Path%\n\
  ```\n\n返回的路径变量值应包含 Android SDK 平台工具文件夹的路径。通过尝试如下运行 `adb` 工具来验证 `platform-tools`\
  \ 值是否正确：\n\n```bash\nadb\n```\n\n执行该工具时，应输出命令行选项列表。\n\n同样，通过尝试运行 `AVD Manager` 命令行工具来检查工具路径设置（如果\
  \ `avdmanager` 工具报告 Java 问题，请忽略——这稍后会解决）：\n\n```bash\navdmanager\n```\n\n如果其中一个或两个命令出现了类似下面的消息，那么很可能是向\
  \ `Path` 环境变量中添加了错误的路径：\n\n`'adb' is not recognized as an internal or external command,\
  \ operable program or batch file.`\n\n### 2.6.2 Windows 10\n\n右键点击`开始`（Start）菜单，从结果菜单中选择`设置`（Settings），并在`查找设置`文本框中输入“编辑系统环境变量”。在`系统属性`对话框中，点击`环境变量...`（Environment\
  \ Variables...）按钮。按照 Windows 8.1 列出的步骤从第 3 步开始操作。\n\n### 2.6.3 Windows 11\n\n右键点击位于任务栏上的`开始`（Start）图标，并从结果菜单中选择`设置`（Settings）。当`设置`对话框出现时，向下滚动类别列表并选择“关于”（About）选项。在“关于”屏幕上，从“相关链接”（Related\
  \ links）部分选择“高级系统设置”（Advanced system settings）。当`系统属性`窗口出现时，点击`环境变量...`（Environment\
  \ Variables...）按钮。按照 Windows 8.1 列出的步骤从第 3 步开始操作。\n\n### 2.6.4 Linux\n\n在 Linux\
  \ 上，此配置通常可以通过向家目录下的 `.bashrc` 文件中添加命令来实现（具体取决于取决于使用的特定 Linux 发行版）。假设 Android SDK\
  \ 捆包安装在 `/home/demo/Android/sdk`，`.bashrc` 文件中的 `export` 行内容如下：\n\n```bash\nexport\
  \ PATH=/home/demo/Android/sdk/platform-tools:/home/demo/Android/sdk/tools:/home/demo/Android/sdk/tools/bin:/home/demo/android-studio/bin:$PATH\n\
  ```\n\n同时注意，上述命令将 `android-studio/bin` 目录添加到 `PATH` 变量中。这将允许无论终端窗口中的当前目录如何，都可以执行\
  \ `studio.sh` 脚本。\n\n### 2.6.5 macOS\n\n可以使用若干种技术来修改 macOS 上的 `$PATH` 环境变量。认为最干净的方法是在\
  \ `/etc/paths.d` 目录下创建一个新文件，其中包含要添加到 `$PATH` 的路径。假设 Android SDK 安装位置为 `/Users/demo/Library/Android/sdk`，可以通过在\
  \ `/etc/paths.d` 目录下创建一个名为 `android-sdk` 的新文件并包含以下行来配置路径：\n\n```\n/Users/demo/Library/Android/sdk/tools\n\
  /Users/demo/Library/Android/sdk/tools/bin\n/Users/demo/Library/Android/sdk/platform-tools\n\
  ```\n\n注意由于这是一个系统目录，在创建文件时将需要使用 `sudo` 命令。例如：\n\n```bash\nsudo vi /etc/paths.d/android-sdk\n\
  ```\n\n## 2.7 Android Studio 内存管理\n\nAndroid Studio 是一个大型且复杂的应用程序，由许多后台进程组成。尽管 Android\
  \ Studio 过去曾被批评性能不佳，但 Google 在最近的发布中进行了重大的性能改进，并在每个新版本中持续改进。这些改进包括允许用户配置 Android\
  \ Studio IDE 以及用于构建和运行应用程序的后台进程所使用的内存量。这允许软件利用具有更大内存的系统。\n\n如果你在具有足够空闲内存来增加这些值的系统上运行\
  \ Android Studio（此功能仅适用于具有 5GB 或更多内存的 64 位系统），并发现 Android Studio 性能出现下降，那么尝试这些内存设置可能是值得的。Android\
  \ Studio 还可能通过类似下方所示的对话框通知你可以提高性能：\n\n![](img/as_3.5_increase_memory_notification.jpg)\n\
  \n图 2-10\n\n## 2.8 更新 Android Studio 和 SDK\n\nAndroid Studio 和 SDK 会经常发布新版本。使用 `Android\
  \ SDK Manager` 安装新版本的 SDK。Android Studio 通常会通知你有有可用更新。\n\n要手动检查 Android Studio 更新，请从\
  \ Android Studio 主窗口使用`帮助 -> 检查更新...`（Help -> Check for Updates...）菜单选项（macOS 为\
  \ `Android Studio -> Check for Updates...`）。\n\n## 2.9 总结\n\n在开发 Android 应用程序之前，第一步是设置环境。这包括\
  \ Android SDK 和 Android Studio IDE。在本章中，我们涵盖了在 Windows、macOS 和 Linux 上安装这些包的步骤。\n\
  \n# 3. 在 Android Studio 中创建示例应用\n\n本书之前的章节涵盖了配置适用于 Android Studio IDE 开发 Android\
  \ 应用程序的环境所需的步骤。在继续更高级的主题之前，现在是验证所有所需的开发包均已安装并正常运行的好时。实现此目标的最佳方法是创建一个 Android 应用程序并编译运行。本章将介绍创建\
  \ Android 项目的过程。创建项目后，后续章节将探讨使用 Android 模拟器环境进行应用程序的测试运行。\n\n## 3.1 关于项目\n\n\n\n\
  \n在本章创建的项目是一个初级的货币汇率转换器（事实上，它非常简单，仅支持从美元转换为欧元，并使用估算的折算汇率进行转换）。该项目还将使用 Android Studio\
  \ 项目模板中最基础的之一。这种简单性使我们能够介绍 Android 应用开发的一些关键方面，而不会因为一次性引入过多的概念（例如推荐的应用程序架构和 Android\
  \ 架构组件）让初学者感到无从下手。在遵循本章的教程时，请放心，在这个初始示例项目中使用的所有技术和代码将在后面的章节中进行更详细的介绍。\n\n## 3.2\
  \ 创建新的 Android 项目\n\n应用开发过程的第一步是在 Android Studio 环境中创建一个新项目。因此，请从启动 Android Studio\
  \ 开始，如图 3-1 所示的“Welcome to Android Studio”界面：\n\n![](img/as_welcome_screen.jpg)\n\
  \n图 3-1\n\n一旦出现此窗口，Android Studio 就已准备好创建新项目。要创建新项目，只需点击 `New Project`（新建项目）选项即可显示新项目向导的第一个屏幕。\n\
  \n## 3.3 创建 Activity\n\n第一步是为应用定义要创建的初始 Activity 类型。提供多种选项，可以为手机和平电脑、Wear OS、电视、Android\
  \ 音频或 Android Things 创建项目。在开发 Android 应用时，可以使用多种 Activity 类型，其中许多将在后面的章节中进行详细介绍。然而，为了本示例的目的，只需从\
  \ Templates（模板）面板中选择 `Phone and Tablet`（手机和平电脑）选项，然后选择创建 `Empty Activity`（空 Activity）选项。`Empty\
  \ Activity` 会创建一个包含单个 `TextView` 对象的模板用户界面。\n\n![](img/as_select_empty_activity.jpg)\n\
  \n图 3-2\n\n选中 `Empty Activity` 选项后，点击 `Next`（下一步）继续配置项目。\n\n## 3.4 定义项目和 SDK 设置\n\
  \n在项目配置窗口（图 3-3）中，将 `Name`（名称）字段设置为 `AndroidSample`。应用程序名称是在 Android Studio 内部引用和识别该应用程序的名称，也是如果完成的应用程序要在\
  \ Google Play 商店销售时将使用的名称。\n\n`Package name`（包名）用于在 Android 应用生态系统中唯一标识该应用程序。虽然它可以被设置为任何唯一标识你的应用的的字符串，但传统上，它是基于域名的反转\
  \ URL，后跟应用程序名称。例如，如果你的域名是 `www.mycompany.com`，且应用程序已命名为 `AndroidSample`，则包名指定如下：\n\
  \n`com.mycompany.androidsample`\n\n如果你没有域名，可以在 `Company Domain`（公司域名）字段中输入任何其他字符串，或者出于测试之目的使用\
  \ `example.com`，但在发布应用程序之前需要更改它：\n\n`com.example.androidsample`\n\n`Save location`（保存位置）设置将默认到位于你主目录下名为\
  \ `AndroidStudioProjects` 文件夹中的位置，可以通过点击包含当前路径设置文本字段右侧的文件夹图标进行更改。\n\n将 `minimum\
  \ SDK`（最低 SDK）设置设置为 `API 26`：Android 8.0 (Oreo)。除非某个必要功能仅在较新版本中可用，否则本书中创建的大多数项目将使用此最低\
  \ SDK。这里的目标是使用最新的 Android SDK 构建应用，同时保持与运行旧版本 Android 的设备的兼容性（在这种情况下，最远可追溯到 Android\
  \ 8.0）。Minimum SDK 设置下方的文本将概述目前正在运行该应用的 Android 设备百分比。点击 `Help me choose`（帮助我选择）按钮（在图\
  \ 3-3 中突出显示）查看仍在使用的各种 Android 版本的详情：\n\n![](img/as_new_project_settings.jpg)\n\n\
  图 3-3\n\n最后，将 `Language`（语言）菜单更改为 `Java` 并点击 `Finish`（完成）启动项目创建过程。\n\n## 3.5 修改示例应用程序\n\
  \n此时，Android Studio 已创建一个最小的示例应用程序项目并打开了主窗口。\n\n![](img/as_4.1_main_window.jpg)\n\
  \n图 3-4\n\n新创建的项目和关联文件的引用列位于主项目窗口左侧的 `Project`（项目）工具窗口。`Project` 工具窗口有多种显示信息的模式。默认情况下，此面板应处于\
  \ `Android` 模式。此设置由面板顶部的菜单控制，如图 3-5 所示。如果面板当前不在 `Android` 模式，请使用菜单切换模式：\n\n![](img/as_project_tool_window_menu.jpg)\n\
  \n图 3-5\n\n## 3.6 修改用户界面\n\n我们 Activity 的用户界面设计存储在名为 `activity_main.xml` 的文件中，该文件位于项目文件层次结构的\
  \ `app -> res -> layout` 下。一旦在 `Project` 工具窗口中找到它，双击该文件将其加载到用户界面 `Layout Editor`（布局编辑器）工具中，该工具出现在\
  \ Android Studio 主窗口的中间面板：\n\n![](img/as_4.1_layout_editor.jpg)\n\n图 3-6\n\n`Layout\
  \ Editor` 窗口顶部工具栏上有一个菜单（在图中设置为 `Pixel`），它反映在 `Layout Editor` 面板中的设备视觉表示中。点击此菜单可以选择广泛的其他设备选项。\n\
  \n要在设备表示的横屏和竖屏之间切换方向，请直接使用设备选择菜单左侧显示 ![](img/as_4.1_orientation.jpg) 图标的下拉菜单。使用夜间按钮(![](img/as_night_mode.jpg))\
  \ 开启或关闭夜间模式。\n\n正如设备屏幕所示，内容布局已经包含一个显示“Hello World!”消息的标签。面板左侧有一个调色板，包含了不同类别的用户界面组件，这些组件用于构建用户界面，例如按钮、标签和文本字段。然而，需要注意的是，并不是所有的用户界面组件对用户可见。其中一个类别是布局。Android\
  \ 支持多种布局，为视觉用户界面组件在屏幕上的定位和管理提供不同程度的控制。虽然从用户界面的视觉表示很难判断，但当前设计是使用 `ConstraintLayout`\
  \ 创建的。可以通过查看 `Component Tree`（组件树）面板中的信息来确认，该面板默认位于 `Layout Editor` 面板的左下角，如图 3-7\
  \ 所示：\n\n![](img/as_4.1_component_tree.jpg)\n\n图 3-7\n\n从组件树层次结构可以看出，用户界面布局由一个 `ConstraintLayout`\
  \ 父对象和一个 `TextView` 子对象组成。\n\n\n\n\n在继续之前，请同样检查布局编辑器（Layout Editor）的自动连接（Autoconnect）模式已启用。这意味着当组件被添加到布局时，布局编辑器将自动添加约束，以确保组件在不同的屏幕尺寸和设备方向上正确定位（该主题将在后续章节中进行更详细的介绍）。“自动连接”按钮位于布局编辑器工具栏中，用一个磁铁图标表示。当其被禁用时，磁铁图标上会出现一条对斜线（见图\
  \ 3-8）。如有必要，请点击此按钮重新启用自动连接模式。\n\n![](img/as_autoconnect_button.jpg)\n\n图 3-8\n\n\
  修改应用程序的下一步是向布局添加一些额外的组件，其中第一个是 `Button`（按钮），供用户点击以启动货币转换。\n\n调色板（Palette）面板由两列组成，左列包含视图组件类别列表。右列列出当前选择类别包含的组件。例如，在图\
  \ 3-9 中，当前在 `Buttons` 类别中选择了 `Button` 视图：\n\n![](img/as_4.1_palette.jpg)\n\n图 3-9\n\
  \n从 `Buttons` 列表中点击并拖动 `Button` 对象，将其到用户界面设计的水平中心，使其位于现有的 `TextView` 小部件下方：\n\n\
  ![](img/as_4.1_androidsample_button_added.jpg)\n\n图 3-10\n\n下一步是更改当前由 `Button` 组件显示的文本。位于设计区域右侧的面板是属性（Attributes）面板。该面板显示分配给布局中当前选择组件的属性。在此面板中，在“常用属性（Common\
  \ Attributes）”部分找到 `text`（文本）属性，并将当前值从“Button”更改为“Convert”（转换），如图图 3-11 所示：\n\n\
  ![](img/as_4.1_text_attribute.jpg)\n\n图 3-11\n\n第二个带有扳手图标的文本属性允许设置文本属性，该属性仅在布局编辑器工具中显示，而在运行时不会显示。这对于测试视觉组件和布局在不同设置下的行为非常有用，而无需反复运行应用。\n\
  \n以防自动连接系统未能设置所有布局连接，点击“推断约束（Infer constraints）”按钮（图 3-12），为布局添加任何缺失的约束：\n\n![](img/as_4.1_infer_button.jpg)\n\
  \n图 3-12\n\n此时，重要的是解释位于布局编辑器工具右上角的警告按钮，如图图 3-13 所示。显而易见，这表明布局可能存在潜在问题。要需任何任何问题的详细信息，请点击该按钮：\n\
  \n![](img/as_3.6_layout_warnings.jpg)\n\n图 3-13\n\n点击该按钮时，将出现一个面板（图 3-14），用于描述问题的性质并提供一些可能的纠正措施：\n\
  \n![](img/as_hardcoded_text.jpg)\n\n图 3-14\n\n目前，列出的唯一警告如下：\n\n硬编码字符串 \"Convert\"\
  ，应使用 @string 资源\n\n此 I18N（国际化）消息告诉我们，项目未来的国际化方面存在潜在问题（“I18N”源于“internationalization”一词以“I”开头，以“N”结尾，中间有\
  \ 18 个字母）。该警告提醒我们，在开发 Android 时，应尽可能将文本字符串等属性和值存储为资源的形式。这样做可以通过修改资源文件来更改应用程序的外，而无需更改应用程序源代码。这在将用户界面翻译成不同的语言时特别有价值。如果用户界面中的所有文本都包含在一个资源文件中，例如，可以将该文件交给翻译人员，由他们执行翻译工作并返回翻译后的文件包含应用程序中。这使得可以针对多种语言而无需进行任何源代码更改。在此情况下，我们将创建一个名为\
  \ `convert_string` 的新资源，并为其分配字符串“Convert”。\n\n点击问题说明（Issue Explanation）面板中的“修复（Fix）”按钮以显示提取资源（Extract\
  \ Resource）面板（图 3-15）。在此面板中，将资源名称字段更改为 `convert_string`，并在点击 OK 按钮之前将资源值保留为 Convert。\n\
  \n![](img/as_4.1_extract_resource.jpg)\n\n图 3-15\n\n要添加的下一个部件是 `EditText` 小部件，用户将在其中输入要转换的美元金额。从调色板面板中，选择\
  \ Text 类别，点击并拖动 Number (Decimal) 组件到布局上，使其水平居中并位于现有的 `TextView` 小部件上方。选中该小部件后，使用属性工具窗口将\
  \ `hint`（提示）属性设置为“dollars”。点击警告图标并将字符串提取为名为 `dollars_hint` 的资源。\n\n本章稍后编写的代码将需要访问用户输入\
  \ `EditText` 字段的美元值。它将通过引用分配给用户界面布局中小部件的 `id` 来实现。Android 分配给小部件的默认 `id` 可以在选择小部件时从属性工具窗口查看和更改，如图图\
  \ 3-16 所示：\n\n![](img/as_4.0_textview_id.jpg)\n\n图 3-16\n\n将 id 更改为 `dollarText`，并在命名对话框中点击“重构（Refactor）”按钮。这确保了项目其他地方对旧\
  \ id 的引用会自动更新：\n\n![](img/as_4.1_rename_dialog.jpg)\n\n图 3-17\n\n点击“推断（Infer）”按钮添加任何缺失的布局约束。此时，布局应类似于图\
  \ 3-18 所示：\n\n![](img/as_4.1_androidsample_ui.jpg)\n\n图 3-18\n\n## 3.7 审查布局和资源文件\n\
  \n在进入下一步之前，我们将查看一些用户界面设计和资源处理的内部方面。在上一节中，我们通过使用布局编辑器工具修改 `activity_main.xml` 文件对用户界面进行了一些更改。实际上，布局编辑器所做的只是提供了一种易于编辑文件底层\
  \ XML 内容的方法。在实践中，没有理由不直接修改 XML 来进行用户界面更改，而且在某些情况下，这实际上比使用布局编辑器工具更快。在布局编辑器面板的右上角有三个按钮，如下图\
  \ 3-19 所示：\n\n![](img/as_4.0_layout_editor_buttons.jpg)\n\n图 3-19\n\n默认情况下，编辑器将处于设计模式，仅显示布局的可视化表示。最左侧的按钮将切换到代码模式以显示布局的\
  \ XML，而中间按钮将进入分屏模式，同时显示布局和 XML，如图图 3-20 所示：\n\n![](img/as_4.1_split_mode.jpg)\n\n\
  图 3-20\n\n从 XML 文件的结构可以看出，用户界面由 `ConstraintLayout` 组件组成，而它又是 `TextView`、`Button`\
  \ 和 `EditText` 对象的父级。我们还可以看到，例如 `Button` 的文本属性被设置为我们的 `convert_string` 资源。尽管复杂性和内容不同，所有用户界面布局都是以这种层次化的、基于\
  \ XML 的方式组织的。\n\n\n\n\n\n当 XML 布局发生更改时，这些更改将反映在布局画布上。也可以在布局画布面板内对布局进行视觉化修改，更改将出现在\
  \ XML 列表中。要查看此效果，请切换到分屏模式（Split mode）并修改 XML 布局，将 `ConstraintLayout` 的背景颜色更改为如下红色调：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\"\n    android:background=\"#ff2438\" >\n\n\
  .\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n注意，布局的颜色会实时变化以匹配\
  \ XML 文件中的新设置。同时注意，在 XML 编辑器左侧边距（也称为槽 gutter）包含颜色设置的行旁边，会出现一个小红色正方形。这是在某个属性上设置了红色的视觉提示。点击红色正方形将显示一个颜色选择器，允许选择不同的颜色：\n\
  \n![](img/as_4.1_gutter_color_chooser.jpg)\n\n图 3-21\n\n在继续之前，请从布局文件中删除背景属性，以便背景恢复到默认设置。\n\
  \n最后，使用项目（Project）面板找到找到 `app -> res -> values -> strings.xml` 文件，并双击它将其加载到编辑器中。目前\
  \ XML 的内容如下：\n\n```xml\n<resources>\n    <string name=\"app_name\">AndroidSample</string>\n\
  \    <string name=\"convert_string\">Convert</string>\n    <string name=\"dollars_hint\"\
  >dollars</string>\n</resources>\n```\n\n作为资源运行的演示，将当前分配给 `convert_string` 资源的字符串值更改为“Convert\
  \ to Euros”，然后通过选择编辑器面板中布局文件的标签页返回布局编辑器工具。注意，布局已经获取了该字符串的新资源值。\n\n访问 XML 文件中引用的资源值还有一种快捷方法。在分屏（Split）或代码（Code）模式下使用布局编辑器工具，点击\
  \ `\"@string/convert_string\"` 属性设置使其变为高亮，然后在键盘上按 `Ctrl-B`（macOS 上为 `Cmd-B`）。Android\
  \ Studio 随后打开 `strings.xml` 文件并带您到该文件中声明此资源的行。利用此机会将字符串资源还原为原始的“Convert”文本，并添加以下额外的字符串资源项，该资源将在应用代码中引用：\n\
  \n```xml\n<resources>\n.\n    <string name=\"convert_string\">Convert</string>\n\
  \    <string name=\"dollars_hint\">dollars</string>\n    <string name=\"no_value_string\"\
  >No Value</string>\n</resources>\n```\n\n资源字符串也可以使用 Android Studio Translation 编辑器（Translations\
  \ Editor）进行编辑。要打开此编辑器，右键点击 `app -> res -> values -> strings.xml` 文件并选择 `Open editor`\
  \ 菜单选项。这将在 Android Studio 窗口的主面板中中显示翻译编辑器：\n\n![](img/as_3.6_translations_editor.jpg)\n\
  \n图 3-22\n\n此编辑器允许对分配给资源键的字符串进行编辑，并管理多种语言的翻译。\n\n### 3.8 添加交互\n\n此示例项目的最后一步是使应用程序具有交互性，这样当用户在\
  \ `EditText` 字段中输入美元值并点击转换按钮时，转换后的欧元值将显示在 `TextView` 上。这涉及在 `Button` 控件上实现一些事件处理。具体来说，需要配置\
  \ `Button`，以便在触发 `onClick` 事件时调用应用代码中的方法。事件处理可以通过多种不同的方式实现，并将在稍后一个标题为“Android 事件处理概览与示例”的章节中进行详细介绍。将布局编辑器切换到设计（Design）模式，在布局编辑器中选择\
  \ `Button` 控件，参考属性（Attributes）工具窗口，并如下所示指定名为 `convertCurrency` 的方法：\n\n![](img/as_3.6_set_onclick.jpg)\n\
  \n图 3-23\n\n注意，`onClick` 属性的文本字段现在用红色边框高亮，以警告我们该按钮已配置为调用一个尚不存在的方法。为了解决这个问题，在项目工具窗口中双击\
  \ `MainActivity.java` 文件（`app -> java -> <package name> -> MainActivity`）将其加载到代码编辑器中，并在类文件中添加\
  \ `convertCurrency` 方法的代码，使其内容如下，请注意还需要导入一些额外的 Android 程序包：\n\n```java\npackage\
  \ com.ebookfrenzy.androidsample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.view.View;\nimport android.widget.EditText;\n\
  import android.widget.TextView;\n.\nimport java.util.Locale;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \    }\n\n    public void convertCurrency(View view) {\n        EditText dollarText\
  \ = findViewById(R.id.dollarText);\n        TextView textView = findViewById(R.id.textView);\n\
  \        if (!dollarText.getText().toString().equals(\"\")) {\n            float\
  \ dollarValue = Float.parseFloat(dollarText.getText().toString());\n           \
  \ float euroValue = dollarValue * 0.85F;\n            textView.setText(String.format(Locale.ENGLISH,\"\
  %f\", euroValue));\n        } else {\n            textView.setText(R.string.no_value_string);\n\
  \        }\n    }\n}\n```\n\n### 3.9 总结\n\n虽然并不复杂，但设置 Android 开发环境涉及许多步骤。在完成这些步骤后，值得运行一个示例以确保环境正确安装和配置。在本章中，我们创建了一个示例应用程序并使用\
  \ Android Studio 布局编辑器工具修改了用户界面布局。在此过程中，我们探讨了尽可能使用资源的重要性，特别是在字符串值的情况下，并简要涉及了布局的主题。\n\
  \n最后，在 `Button` 上添加了 `onClick` 事件，连接到一个方法，该方法用于从 `EditText` 组件中提取用户输入，将美元转换为欧元，并将结果显示在\
  \ `TextView` 上。\n\n由于应用程序已准备好进行测试，下一章将详细介绍用于测试的模拟器所需的步骤。\n\n\n\n\n\n尽管 Android Studio\
  \ 预览面板允许我们看到正在设计的布局并使用交互模式测试基本功能，但若要完全测试其运行情况，仍需要编译并运行整个应用程序。Android 应用程序可以通过在物理设备或\
  \ Android 虚拟设备（`AVD`）模拟器环境中安装并运行来完成测试。在使用 `AVD` 之前，必须先创建并配置它以匹配特定设备型号的规格。在本章中，我们将以\
  \ `Pixel 4` 手机作为示例，完成此类虚拟设备的创建。\n\n## 4.1 关于 Android 虚拟设备\n\n`AVDs` 本质上是模拟器，允许在测试\
  \ Android 应用程序时，无需将应用安装在物理 Android 设备上。一个 `AVD` 可以被配置为模拟各种硬件功能，包括屏幕大小、内存容量，以及是否存在摄像头、`GPS`\
  \ 导航支持或加速度计等选项。作为 Android Studio 标准安装的一部分，系统安装了多个模拟器模板，允许为一系列不同的设备配置 `AVDs`。此外，通过指定处理器类型、内存容量以及屏幕尺寸和像素密度等属性，还可以创建匹配任何物理\
  \ Android 设备的自定义配置。\n\n`AVD` 会话可以以独立窗口的形式出现，也可以嵌入在 Android Studio 窗口中。\n\n新的 `AVDs`\
  \ 使用 Android 虚拟设备管理器创建和管理，该管理器可以在命令行模式下使用，也可以使用更友好的图形界面。创建新 `AVD` 的第一步是启动 `AVD Manager`。这可以在\
  \ Android Studio 环境内通过从主窗口选择 `Tools -> Device Manager` 菜单来实现。\n\n启动后，管理器将以工具窗口的形式显示，如图\
  \ 4-1 所示：\n\n![](img/as_avd_manager.jpg)\n\n图 4-1\n\n要添加新的 `AVD`，请确保在点击 `Create\
  \ device` 按钮之前选择了 `Virtual` 选项卡，以打开虚拟设备配置对话框：\n\n![](img/as_avd_manager_select_hardware.jpg)\n\
  图 4-2\n\n在对话框中，执行以下步骤以创建一个兼容 `Pixel 4` 的模拟器：\n\n1. 从 `Category` 面板中选择 `Phone` 选项，以显示可用的\
  \ Android 手机 `AVD` 模板列表。\n2. 选择 `Pixel 4` 设备选项并点击 `Next`。\n3. 在 `System Image` 屏幕上，选择最新版本的\
  \ Android。注意，如果系统镜像尚未安装，`Release Name` 旁边将提供 `Download` 链接。点击此链接下载并安装系统镜像，然后再选择它。如果所需的镜像未在列表中，点击\
  \ `x86 Images`（如果你运行带有 Apple 芯片的 Mac，请点击 `ARM images`）或 `Other images` 选项卡以查看备列表。\n\
  4. 点击 `Next` 继续，并在 `name` 字段中输入描述性名称（例如 `Pixel 4 API 32`），或直接接受默认名称。\n5. 点击 `Finish`\
  \ 创建 `AVD`。\n6. `AVD` 创建完成后，现在可以关闭 `Device Manager`。如果以后需要对 `AVD` 进行修改，只需重新打开 `Device\
  \ Manager`，从列表中选择该 `AVD`，并点击 `Actions` 列中的 `pencil icon` 来编辑设置。\n\n## 4.2 启动模拟器\n\
  \n要对新创建的 `AVD` 模拟器进行测试运行，只需从 `Device Manager` 中选择该模拟器并点击 `launch button`（`Actions`\
  \ 列中的三角形）。模拟器将嵌入到 Android Studio 主窗口中并开始启动过程。模拟器启动所需的时间取决于 `AVD` 的配置及其运行系统的配置：\n\
  \n![](img/as_emulator_tool_window.jpg)\n图 4-3\n\n要隐藏和显示模拟器工具窗口，请点击 `Emulator` 工具窗口按钮（如上方标记的\
  \ A）。点击标签页旁边的“x”关闭按钮（B）退出模拟器。模拟器工具窗口可以容纳多个模拟器会话，每个会话由一个标签页表示。例如[图 4-4]显示了一个具有两个模拟器会话的工具窗口：\n\
  \n![](img/as_4.1_emulator_tool_window_two_sessions.jpg)\n图 4-4\n\n要在会话之间切换，只需点击相应的标签页即可。\n\
  \n虽然模拟器可能默认以竖屏方向显示，但和其他默认选项可以更改。在 `Device Manager` 中，选择新的 `Pixel 4` 条目，并点击设备行 `Actions`\
  \ 列中的 `pencil icon`。在配置屏幕中，找到 `Startup orientation` 部分并更改方向设置。退出并重启模拟器会话以查看更改效果。关于模拟器的更多细节将在下一章[使用和配置\
  \ Android Studio AVD 模拟器]中介绍。\n\n为了节省本章下一节的时间，请在继续之前保持模拟器运行。\n\n## 4.3 在 AVD 中运行应用程序\n\
  \n配置好 `AVD` 模拟器后，在前章节创建的示例应用程序 `AndroidSample` 现在可以编译并运行。将 `AndroidSample` 项目加载到\
  \ Android Studio 后，确保新创建的 `Pixel 4` `AVD` 显示在设备菜单中（见下方[图 4-5]中的标记 A），然后点击绿色三角形（B）的运行按钮，或选择\
  \ `Run -> Run ‘app’` 菜单选项：\n\n![](img/as_avd_run_target.jpg)\n图 4-5\n\n设备菜单（A）可选择不同的\
  \ `AVD` 实例或物理设备作为运行目标，并在多个设备上运行。该菜单还提供了访问 `Device Manager` 以及设备连接和故障排除选项：\n\n![](img/as_run_target.jpg)\n\
  图 4-6\n\n一旦应用程序安装并运行，第一个 fragment 的界面将出现在模拟器中（fragment 是 Android 项目中可重用的部分，通常由用户界面布局和代码组成，该主题将在“Android\
  \ Fragment 简介”章节中介绍）：\n\n![](img/as_android_sample.running)\n图 4-7\n\n如果活动没有自动启动，请检查模拟器上出现了启动图标。如果是，只需点击它即可启动应用程序。一旦运行开始，`Run`\
  \ 工具窗口将变为可用。`Run` 工具窗口会在包安装和启动时显示诊断信息。[图 4-8]显示了典型应用程序启动时的 `Run` 工具窗口输出：\n\n![](img/as_4.1_run_tool_window.jpg)\n\
  图 4-8\n\n如果在启动过程中遇到问题，`Run` 工具窗口将提供信息，这可能有助于隔离问题原因。\n\n假设应用程序加载到模拟器并按预期运行，那么我们已经安全地验证了\
  \ Android 开发环境已正确安装和配置。现在程序正在运行，尝试进行温度转换以验证应用是否按预期工作。\n\n## 4.4 在多个设备上运行\n\n上述[图\
  \ 4-6]所示的运行菜单包含一个并行在多个模拟器和设备上运行应用程序的选项。选择此选项后，将显示[图 4-9]所示的对话框，列出了系统中配置的所有 `AVDs`\
  \ 以及任何连接的物理设备列表。在点击 `Run` 按钮之前，勾选要运行的模拟器或设备旁的复选框：\n\n![](img/as_4.1_multiple_devices.jpg)\n\
  \n\n\n\n\n图 4-9\n\n点击 `Run` 按钮后，Android Studio 将在选定的模拟器和设备上启动该应用。\n\n## 4.5 停止正在运行的应用程序\n\
  \n要停止正在运行的应用程序，只需点击主工具栏上的停止按钮，如 图 4-10 所示：\n\n![](img/as_4.1_stop_button.jpg)\n\n\
  图 4-10\n\n也可以使用 `Run` 工具窗口终止应用。首先，通过在应用运行时变为可用的标题栏按钮显示 `Run` 工具窗口。一旦 `Run` 工具窗口出现，点击下方\
  \ 图 4-11 所示中高亮显示的停止按钮：\n\n![](img/as_4.1_stop_button_run_window.jpg)\n\n图 4-11\n\
  \n## 4.6 支持深色主题\n\nAndroid 10 引入了备受期待的深色主题，Android Studio 应用项目默认已启用了该功能。若要在 AVD\
  \ 模拟器中测试深色主题，请在模拟器中运行的 Android 实例内打开 `Settings` 应用。在 `Settings` 应用中，选择 `Display`\
  \ 分类并如 图 4-12 所示启用 `Dark` 主题选项，使屏幕背景变为黑色：\n\n![](img/as_avd_dark_theme_setting.jpg)\n\
  \n图 4-12\n\n启用深色主题后，运行 `AndroidSample` 应用，你会注意到它以深色主题的形式显示，包括黑色背景和按钮上的紫色背景色，如 图\
  \ 4-13 所示：\n\n![](img/as_eandroid_sample_running_dark.jpg)\n\n图 4-13\n\n在继续操作之前，返回\
  \ `Settings` 应用并关闭深色主题模式。\n\n## 4.7 在独立窗口中运行模拟器\n\n到本章为止，我们仅将模拟器作为嵌入在 Android Studio\
  \ 主窗口内的工具窗口进行使用。若要在独立窗口中运行模拟器，请选择 `File -> Settings...` 菜单选项（macOS 为 Android Studio\
  \ -> Preferences...），在设置对话框的左侧导航面板中导航到 `Tools -> Emulator`，并禁用 `Launch in a tool\
  \ window` 选项：\n\n![](img/as_avd_separate_window_setting.jpg)\n\n图 4-14\n\n禁用选项后，点击\
  \ `Apply` 按钮随后点击 `OK` 提交更改，然后点击上方 图 4-3 中标记为 B 的标签上的关闭按钮退出当前的模拟器会话。\n\n再次运行示例应用，模拟器将如下作为一个独立窗口出现：\n\
  \n![](img/as_android_emulator_standalone.jpg)\n\n图 4-15\n\n选择独立模式还是工具窗口模式取决于个人喜好。如果你喜欢模拟器在工具窗口中运行，请返回设置屏幕并重新启用\
  \ `Launch in a tool window` 选项。但在决定使用独立模式之前，请记住也可以通过点击模拟器工具栏中的设置按钮（齿轮图标表示）并选择 `View\
  \ Mode -> Float` 菜单选项，将模拟器工具窗口从 Android Studio 主窗口中分离：\n\n![](img/as_avd_float_mode.jpg)\n\
  \n图 4-16\n\n## 4.8 设备框架\n\n模拟器可以配置为带有（图 4-17）或不带（图 4-15）设备框架显示。\n\n![](img/as_eandroid_sample_running_device_frame.jpg)\n\
  \n图 4-17\n\n要更改设置，打开 `Device Manager`，从列表中选择 AVD，并点击 `Actions` 列中的铅笔图标以编辑设置。在设置屏幕上，找到并更改\
  \ `Enable Device Frame` 选项：\n\n![](img/as_avd_device_frame_setting.jpg)\n\n图 4-18\n\
  \n## 4.9 AVD 命令行创建\n\n如前所述，除了图形用户界面外，还可以直接从命令行创建新的 AVD。这是通过使用 `avdmanager` 工具结合某些命令行选项实现的。一旦启动，该工具将在创建新\
  \ AVD 之前提示额外信息。\n\n`avdmanager` 工具运行需要访问 运行时环境 (JRE)。如果在尝试运行 `avdmanager` 时出现错误消息指示找不到\
  \ `java` 命令，则可以配置运行命令的命令提示符或终端窗口以使用 Android Studio 捆绑的 OpenJDK 环境。首先按照以下方式识别 OpenJDK\
  \ JRE 的位置：\n\n1. 启动 Android Studio 并打开书中之前创建的 `ComposeDemo` 项目。\n2. 选择 `File ->\
  \ Settings...` 菜单选项（macOS 为 Android Studio -> Preferences...）。\n3. 导航到 `Build, Execution,\
  \ Deployment` 部分，并选择 `Build Tools` 下的 `Gradle` 选项。\n4. 点击 `Gradle JDK` 设置并记录 Android\
  \ Studio 默认 JDK 的路径：\n\n![](img/as_gradle_jdk_setting.jpg)\n\n图 4-19\n\n在 Windows\
  \ 上，在命令提示符中执行以下命令（其中 `<path to JDK>` 替换为 Android Studio 默认 JDK 的路径）：\n\n```\nset\
  \ JAVA_HOME=<path to JDK>\n```\n\n在 macOS 或 Linux 上，执行以下命令：\n\n```bash\nexport JAVA_HOME=\"\
  <path to JDK>\"\n```\n\n如果你打算频繁使用 `avdmanager`，请按照书中“设置 Android 环境”(#Installation.xhtml__idAnchor009)\
  \ 中的步骤来配置 `JAVA_HOME`。假设系统已配置好 SDK，可以通过运行以下命令获取可用的 AVD 列表：\n\n```bash\navdmanager\
  \ list\n```\n\n该输出将包含可用的 AVD，例如：\n\n```\nAvailable Android Virtual Devices:\n  Name:\
  \ Pixel_XL_API_28_No_Play\n  Device: pixel_xl (Google)\n  Path: /Users/neilsmyth/.android/avd/Pixel_XL_API_28_No_Play.avd\n\
  \  Target: Google APIs (Google Inc.)\n    Based on: Android API 28 Tag/ABI: google_apis/x86\n\
  \  Skin: pixel_xl_silver\n  Sdcard: 512M\n```\n\n同样，要删除现有的 AVD，只需使用 `delete` 选项：\n\
  \n```bash\navdmanager delete avd -n <avd name>\n```\n\n`avdmanager` 工具还允许从命令行创建新的\
  \ AVD。例如，要使用 Android API  29 的 x86 目标创建一个名为 `myAVD` 的新 AVD，可以使用以下命令：\n\n```bash\n\
  avdmanager create avd -n myAVD -k system-images;android-29;google_apis;x86\n```\n\
  \n`avdmanager` 工具将根据基础 Android 设备的规范创建 AVD，同时也提供了匹配特定设备的自定义配置。一旦从命令行创建了新的 AVD，在点击\
  \ `Refresh` 按钮之前，它可能不会出现在 Device Manager 工具中。\n\n\n\n\n`config.ini` 文件包含了设备配置设置，例如在\
  \ AVD 创建过程中指定的显示尺寸和内存。这些设置可以直接在配置文件中进行更改，并在下一次调用 AVD 时，其将采用这些更改。\n\n`<avd name>.ini`\
  \ 文件包含了对目标 Android SDK 的引用以及 AVD 文件的路径。请注意，`config.ini` 文件中 `image.sysdir` 值的更改也需要反映在该文件的目标值中。\n\
  \n## 4.11 移动和重命名 Android 虚拟设备\n\n可以使用 `avdmanager` 工具的 `move avd` 参数从命令行更改 AVD 的名称或\
  \ AVD 文件的位置。例如，要将名为 `Pixel4` 的 AVD 重命名为 `Pixel4a`，可以执行以下命令：\n\n```\navdmanager move\
  \ avd -n Pixel4 -r Pixel4a\n```\n\n若要物理移动与 AVD 相关的文件，应使用以下命令语法：\n\n```\navdmanager\
  \ move avd -n <avd name> -p <path to new location>\n```\n\n例如，将 AVD 从其当前的文件系统位置移动到\
  \ `/tmp/Pixel4Test`：\n\n```\navdmanager move avd -n Pixel4 -p /tmp/Pixel4Test\n\
  ```\n\n请注意，在执行移动 AVD 的命令之前，目标目录不能存在。\n\n## 4.12 总结\n\n典型的应用开发过程遵循编码、编译和在测试环境中运行的循环。Android\
  \ 应用可以在实体 Android 设备上进行测试，也可以使用 Android 虚拟设备（AVD）模拟器进行测试。AVD 使用 Android Studio Device\
  \ Manager 工具创建和管理，该工具可以作为命令行工具，也可以通过图形用户界面使用。在创建 AVD 以模拟特定的 Android 设备型号时，虚拟设备的硬件规格应与物理设备的规格相匹配。\n\
  \nAVD 模拟器会可能会显示为独立窗口，也可以嵌入到 Android Studio 主界面界面。\n\n## 5. 使用和配置 Android Studio\
  \ AVD 模拟器\n\n在下一章探索在实体 Android 设备上进行测试之前，本章将花费一些时间提供 Android Studio AVD 模拟器的概述，并介绍许多可在独立模式和工具窗口模式下用于自定义环境的配置功能。\n\
  \n## 5.1 模拟器环境\n\n当以独立模式启动时，模拟器在加载过程中会显示一个初始启动屏幕。加载完成后，会出现主模拟器窗口，其中包含所选设备类型的表示（在图\
  \ 5-1 所示这是一个 Pixel 4 设备）：\n\n![](img/android_12_avd_running_standalone.jpg)\n\n\
  图 5-1\n\n窗口右侧边缘设有工具栏，提供了快速访问模拟器控制和配置选项的通道。\n\n## 5.2 模拟器工具栏选项\n\n模拟器工具栏（图 5-2）提供了与模拟器环境外观和行为相关的系列选项访问。\n\
  \n![](img/as_3.5_avd_toolbar.jpg)\n\n图 5-2\n\n工具栏中的每个按钮都关联有一个键盘快捷键，可以通过将鼠标指针悬停在按钮上并等待提示框出现，或者通过扩展控制面板的帮助选项来识别。\n\
  \n尽管工具栏中的许多选项是自而易懂的，但为了完整起见，将将介绍每个选项：\n\n- **退出 / 最小化**：工具栏最顶部的“x”按钮在选中时退出模拟器会话，而“-”选项则最小化整个窗口。\n\
  - **电源**：电源按钮模拟实体 Android 设备上的硬件电源按钮。点击并释放此按钮将锁定设备并关闭屏幕。按住此按钮将启动设备的“关机”请求序列。\n-\
  \ **音量增大 / 减小**：两个控制模拟器环境内播放音量的按钮。\n- **向左/向右旋转**：在纵屏和横屏方向之间旋转模拟的设备。\n- **截图**：对设备屏幕当前显示的内容进行截图。捕获的图像存储在本章稍后概述的扩展控制面板的设置屏幕中指定的位置。\n\
  - **缩放模式**：此按钮在缩放模式之间切换，其细节将在本章稍后介绍。\n- **返回**：执行标准的 Android“返回”导航以返回上一个屏幕。\n- **主页**：显示设备主屏幕。\n\
  - **概览**：模拟选择标准的 Android“概览”导航，用于显示设备上正在运行的应用。\n- **折叠设备**：模拟可折叠设备的折叠和展开。此选项仅在模拟器运行折叠屏系统镜像时可用。\n\
  - **扩展控制**：显示扩展控制面板，允许配置此类选项，如模拟位置和电话活动、电池强度、蜂窝网络类型和指纹识别。\n\n## 5.3 在缩放模式下工作\n\n\
  位于模拟器工具栏的缩放按钮在缩放模式之间切换。当缩放模式激活时，工具栏按钮处于按下状态，且鼠标指针悬停在设备屏幕上时将显示为放大镜。点击左鼠标键将导致显示相对于屏幕上的所选点进行缩放，重复点击将增加缩放级别。相反，点击右鼠标键将减小缩放级别。关闭缩放按钮将显示恢复到默认大小。\n\
  \n在缩放模式下点击并拖动将定义一个矩形区域，释放鼠标按键时视图将缩放至该区域。\n\n在缩放模式下，可以使用模拟器窗口内的水平和垂直滚动条来移动屏幕可视区域。\n\
  \n## 5.4 调整模拟器窗口大小\n\n模拟器窗口的大小（以及相应的设备表示）可以通过点击并拖动窗口的任何角或侧边随时更改。\n\n## 5.5 扩展控制选项\n\
  \n扩展控制工具栏按钮显示如图 5-3 所示的面板。默认情况下将显示位置设置。从左侧面板选择不同的类别将显示相应的控制组：\n\n![](img/as_avd_location.jpg)\n\
  \n图 5-3\n\n### 5.5.1 位置\n\n位置控制允许以十进制或六进制坐标的形式将模拟位置信息发送到模拟器。位置信息可以是单个位置的形式，也可以代表设备移动的点序列，后者通过\
  \ GPS 交换 (GPX) 或 Keyhole 标记语言 (KML) 格式的文件提供。或者，可以使用集成的 Google Maps 面板来视觉化选择单点或旅行路线。\n\
  \n### 5.5.2 显示\n\n除了模拟器屏幕内显示的主显示外，显示选项允许在同一个 Android 实例中添加额外的显示。这对于测试如 Microsoft\
  \ Surface Duo 等双屏应用非常有用。这些额外的屏幕可以配置为所需的尺寸，并显示在同一个模拟器窗口中。\n\n### 5.5.3 蜂窝\n\n可以在蜂窝设置屏幕中更改模拟的蜂窝连接类型。可以使用选项来模拟不同的网络类型（CSM、EDGE、HSDPA\
  \ 等），以及一系列语音和数据场景，如漫游和拒绝访问。\n\n### 5.5.4 电池\n\n在扩展控制屏幕的此面板上可以模拟各种电池状态和充电条件，包括电池电量、电池健康状况以及当前连接了\
  \ AC 充电器。\n\n### 5.5.5 摄像头\n\n\n\n\n\n当摄像头激活时，模拟器会模拟一个 3D 场景。这表现为虚拟建筑的内部，你可以通过按住\
  \ `Option` 键（Windows 上为 `Alt`）并使用鼠标指针和键盘键，在模拟器内录制视频或拍摄照片之前进行导航。此扩展配置选项允许上传不同的图像以在虚拟环境中进行显示。\n\
  \n### 5.5.6 手机\n\n手机的扩展控制功能在模拟器中提供了两个非常简单但实用的模拟。第一个选项允许模拟来自指定电话号码的入电电话。这在测试应用如何处理此类高层中断时特别有用。\n\
  \n第二个选项允许在模拟器会话中模拟接收短信。与现实世界一样，这些消息会显示在 `Message`（消息）应用中，并触发模拟器内的标准通知。\n\n### 5.5.7\
  \ 方向键\n\n方向键（`D-Pad`）是内置在 Android 设备中或外部连接（如游戏控制器）的一组额外控制控件，用于提供方向控制（左、右、上、下）。方向键设置允许在模拟器中模拟\
  \ `D-Pad` 交互。\n\n### 5.5.8 麦克风\n\n麦克风设置允许启用麦克风并模拟虚拟耳机和麦克风连接。还提供了一个按钮用于启动模拟器上的 `Voice\
  \ Assistant`（语音助手）。\n\n### 5.5.9 指纹\n\n许多 Android 设备现在都配备了内置指纹检测硬件。`AVD` 模拟器使得无需在包含指纹传感器的物理设备上测试应用即可测试指纹认证。如何在模拟器中配置指纹测试的细节将在本章后面详细介绍。\n\
  \n### 5.5.10 虚拟传感器\n\n虚拟传感器选项允许模拟加速度计和磁力计，通过偏航角、俯仰角和横滚角设置来模拟设备物理运动的效果，如旋转、移动和倾斜。\n\
  \n### 5.5.11 快照\n\n快照包含当前运行的 `AVD` 会话的状态，可以保存并快速恢复，从而使模拟器轻松返回到精确状态。快照将在本章后部分介绍。\n\
  \n### 5.5.12 录制与回放\n\n允许将模拟器屏幕和音频录制并保存为 `WebM` 或 `animated GIF`（动画 GIF）格式。\n\n###\
  \ 5.5.13 Google Play\n\n如果模拟器运行的是安装了 `Google Play Services` 的 Android 版本，此选项将显示当前的\
  \ `Google Play` 版本并提供将模拟器更新到最新版本的选项。\n\n### 5.5.14 设置\n\n设置面板提供了一组配置选项。使用此面板为工具栏和扩展控制面板选择较深的主题，指定保存截图的文件系统位置，配置\
  \ `OpenGL` 支持级别，并配置模拟器窗口显示在桌面上其他窗口之上。\n\n### 5.5.15 帮助\n\n`Help`（帮助）屏幕包含三个子面板，包含快捷键列表、访问模拟器在线文档的链接、报告\
  \ Bug 和发送反馈的链接，以及模拟器版本信息。\n\n## 5.6 使用快照\n\n当模拟器首次启动时，它会执行冷启动，就像物理 Android 设备通电一样。由于操作系统加载并启动所有后台进程，冷启动过程可能需要一些时间才能完成。为了避免每次启动模拟器都经历这个过程，系统被配置为每次退出时自动保存模拟器当前状态的快照（称为\
  \ `quick-boot snapshot`，快速启动快照）。下次启动模拟器时，`quick-boot snapshot` 将加载到内存中并从上次离开的地方继续执行，允许模拟器在冷启动完成所需的一部分时间内重启。\n\
  \n扩展控制面板的 `Snapshots`（快照）屏幕可以在模拟器执行期间的任何点存储额外的快照。这保存了整个模拟器的精确状态，允许模拟器恢复到拍摄快照时的精确时间点。在屏幕中，可以使用\
  \ `Take Snapshot`（拍摄快照）按钮（在图 5-4 中标记为 `A`）拍摄快照。要恢复现有快照，从列表中选择它 (`B`) 并点击屏幕底部的 `run`\
  \ 按钮 (`C`)。还提供了编辑 (`D`) 快照名称和描述，以及删除 (`E`) 当前所选快照的选项：\n\n![](img/as_emulator_snapshot.jpg)\n\
  \n图 5-4\n\n`Settings`（设置）选项 (`F`) 提供了配置自动保存快速启动快照的选项（默认情况下，模拟器会在每次退出时询问是否保存快速启动快照）以及重新加载最近的快照。要强制模拟器会话执行冷启动而不是使用之前的\
  \ `quick-boot snapshot`，打开 `AVD Manager` (`Tools -> AVD Manager`)，点击模拟器 `Actions`\
  \ 列中的向下箭头并选择 `Cold Boot Now`（立即冷启动）菜单选项。\n\n![](img/as_avd_cold_boot.jpg)\n\n图 5-5\n\
  \n## 5.7 配置指纹模拟\n\n模拟器允许配置最多 10 个模拟指纹，用于测试 Android 应用中的指纹认证。要配置模拟指纹，首先启动模拟器，打开 `Settings`\
  \ 应用并选择 `Security & Location`（安全与位置）选项。\n\n在 `Security`（安全）设置屏幕中，选择 `Use fingerprint`（使用指纹）选项。在生成的信息屏幕上点击\
  \ `Next`（下一步）按钮进入 `Fingerprint`（指纹）设置屏幕。在启用指纹安全之前，必须配置备份解锁方法（例如 `PIN`）。点击 `Fingerprint\
  \ + PIN` 按钮并在提示时选择在设备启动时不需要 `PIN`。输入并确认一个合适的 `PIN`，并通过默认选项完成 `PIN` 输入过程。\n\n继续后续屏幕，直到\
  \ `Settings` 应用请求传感器指纹。此时显示扩展控制对话框，在左面板选择 `Fingerprint` 类别，并确保主设置面板选择了 `Finger 1`：\n\
  \n![](img/Image2468.jpg)\n\n图 5-6\n\n点击 `Touch the Sensor` 按钮模拟 `Finger 1` 触摸指纹传感器。模拟器将报告指指纹：\n\
  \n![](img/Image2478.jpg)\n\n图 5-7\n\n要添加更多指纹，点击 `Add Another` 按钮并在再次点击 `Touch the\
  \ Sensor` 之前选择另一个手指。\n\n## 5.8 工具窗口模式下的模拟器\n\n如上一节所述（在 Android Studio 中创建 Android\
  \ 设备 (AVD)），Android Studio 可以配置为嵌入工具窗口启动模拟器，使其不会在独立窗口中显示。在此模式下运行时，与独立模式相同的控件将在工具栏中提供，如图\
  \ 5-8 所示：\n\n![](img/as_avd_internal_toolbar.jpg)\n\n图 5-8\n\n从左到右，这些按钮执行以下任务（详情与独立模式相同）：\n\
  \n• 电源\n\n• 音量增大\n\n• 音量减小\n\n• 向左旋转\n\n• 向右旋转\n\n• 返回\n\n• 主页\n\n• 概述\n\n• 截图\n\
  \n• 快照\n\n• 扩展控制\n\n## 5.9 总结\n\nAndroid Studio 包含一个 Android 设备模拟器环境，旨在使无需在物理 Android\
  \ 设备上运行即可轻松测试应用程序。本章简要介绍了模拟器，并强调了可用于配置和自定义环境以模拟不同测试条件的关键功能。\n\n\n\n\n\n# 6. Android\
  \ Studio 用户界面概览\n\n虽然人们可能急于开始运行上一章中创建的示例应用程序，但这样做涉及到 Android Studio 用户界面的某些方面，而这些方面最好预先进行描述。\n\
  \nAndroid Studio 是一个功能强大且功能丰富的开发环境，在很大程度上，它的操作是非常直观的。尽管如此，现在花时间熟悉 Android Studio\
  \ 用户界面的布局和组织，将大大缩短书中后续章节的学习曲线。本着此考虑，本章将对组成 Android Studio 环境的各个区域和组件提供初步概述。\n\n\
  ## 6.1 欢迎界面\n\n欢迎界面（图 6-1）在 Android Studio 运行但当前没有打开任何项目时显示（可以通过选择 `File -> Close\
  \ Project` 菜单选项随时关闭打开的项目）。如果在项目仍打开时退出了 Android Studio，该工具在下次启动时将跳过欢迎界面，自动打开之前激活的项目。\n\
  \n![](img/as_bumble_bee_welcome_with_recent.jpg)\n\n图 6-1\n\n除了最近项目列表外，欢迎界面还了一系列执行任务的选项，例如打开和创建项目，以及访问当前受版本控制的项目。此外，`Customize`\
  \ 屏幕提供了更改 IDE 和编辑器使用的主题和字体设置的选项。可以通过 `Plugins` 选项查看、安装和管理 Android Studio 插件。\n\n\
  点击如图 6-2 所示的菜单按钮可以获得更多选项：\n\n![](img/as_bumble_bee_welcome_menu.jpg)\n\n图 6-2\n\n\
  ## 6.2 主窗口\n\n当创建新项目或打开现有项目时，Android Studio 主窗口将会出现。当同时打开多个项目时，每个项目都将分配自己的主窗口。窗口的精确配置取决于上次打开项目时显示了哪些工具和面板，但通常类似于图\
  \ 6-3。\n\n![](img/as_4.2_main_window_labelled.jpg)\n\n图 6-3\n\n主窗口的各种元素可以概括如下：\n\
  \n- **A – 菜单栏 (Menu Bar)** – 包含一系列用于在 Android Studio 环境中执行任务的菜单。\n- **B – 工具栏 (Toolbar)**\
  \ – 一系列频繁执行操作的快捷键。工具栏按钮提供了快速访问一组菜单栏操作的通道。可以通过右键点击该栏条并选择 `Customize Menus and Toolbars…`\
  \ 菜单选项来自自定义工具栏。如果工具栏可见，可以使用 `View -> Appearance -> Toolbar` 菜单选项显示它。\n- **C – 导航栏\
  \ (Navigation Bar)** – 导航栏提供了在组成项目的和文件夹之间移动的便捷方法。点击导航栏中的元素将弹出一个菜单，列出该位置的子文件夹和文件供选择。同样，点击类名将显示列出该类包含的方法列表。从列表中选择一个方法即可进入代码编辑器中的相应位置。使用\
  \ `View -> Appearance -> Navigation Bar` 菜单选项隐藏和显示此栏。\n- **D – 编辑器窗口 (Editor Window)**\
  \ – 编辑器窗口显示开发者当前正在工作的文件。然而，在此处显示的内容取决于上下文。例如，在编辑代码时，将出现代码编辑器。另一方面，在处理用户界面布局文件时，将出现用户界面布局编辑器工具。当打开多个文件时，每个文件都由编辑器顶部的标签页表示，如图\
  \ 6-4 所示。\n\n![](img/as_4.1_editor_File_tabs.jpg)\n\n图 6-4\n\n- **E – 状态栏 (Status\
  \ Bar)** – 状态栏显示关于项目和 Android Studio 活动的信息消息，以及位于左下角的工具菜单按钮。悬停在状态栏条目上将提供该字段的描述。许多字段是可交互的，允许用户点击以执行任务或获取更详细的状态信息。\n\
  - **F – 项目工具窗口 (Project Tool Window)** – 项目工具窗口提供了项目文件结构的层级概述，允许执行到特定文件和文件夹的导航。可以使用工具栏以多种不同的方式显示项目。默认设置是\
  \ Android 视图，这是本书剩余部分主要使用的模式。\n\n项目工具窗口只是 Android Studio 环境中提供的许多工具窗口之一。\n\n## 6.3\
  \ 工具窗口\n\n除了项目视图工具窗口外，Android Studio 还包含许多其他窗口，启用后将显示在主窗口的底部和侧边。可以通过将鼠标指针悬停在状态栏最左角的按钮上（图\
  \ 6-5）而不点击鼠标按钮来访问工具窗口快速访问菜单。\n\n![](img/android_studio_tool_window_menu.jpg)\n\n\
  图 6-5\n\n从快速访问菜单中选择项目将导致相应的工具窗口在主窗口内出现。\n\n或者，可以通过点击状态栏中的快速访问菜单图标来显示一组工具窗口栏。这些栏出现在主窗口的左侧、右侧和底部边缘（如图\
  \ 6-6 中箭头所示），并包含用于显示和隐藏每个工具窗口的按钮。当工具窗口栏显示时，再次点击状态栏上的按钮将隐藏它们。\n\n![](img/as_4.1_tool_window_bars.jpg)\n\
  \n图 6-6\n\n点击按钮将显示相应的工具窗口，而再次点击将隐藏窗口。带有数字前缀的按钮（例如 1: Project）表示可以通过按下键盘上的 `Alt`\
  \ 键（macOS 为 `Command` 键）配合相应的数字来显示工具窗口。\n\n按钮在工具窗口栏中的位置指示了窗口显示时相对于窗口的侧边。可以通过点击并拖动按钮到工具工具栏的位置来更改这些位置。\n\
  \n每个工具窗口在顶部都有自己的自己的工具栏。这些工具栏中的按钮因工具而异，但所有工具窗口都包含一个由齿轮图标表示的设置选项，可以更改窗口的各个方面。图 6-7\
  \ 显示了项目视图工具窗口的设置菜单。\n\n![](img/as_project_tool_menu.jpg)\n\n图 6-7\n\n所有窗口在工具栏的最右侧都包含一个按钮，提供了另一种隐藏工具窗口视图的方法。对工具窗口内的项目进行搜索，只需通过点击该窗口使其获得焦点，然后输入搜索术语（例如项目工具窗口中的文件名）即可完成。搜索框将出现在窗口的工具栏中，并高亮显示匹配搜索的项。\n\
  \nAndroid Studio 提供了一系列广泛的工具窗口，其中最常用的如下：\n\n\n\n\n\n# Android Studio 工具窗口\n\n- **应用检查器\
  \ (App Inspector)** - 提供对 `Database`（数据库）和 `Background Task`（后台任务）检查器的访问。`Database\
  \ Inspector` 允许你在应用运行时检查、查询和修改应用的数据库。`Background Task Inspector` 允许监控和管理使用 `WorkManager`\
  \ 创建的后台工作线程任务。\n- **构建 (Build)** - 构建工具窗口在项目编译和打包期间显示构建过程的信息，并显示遇到的任何任何错误详细信息。\n\
  - **构建变体 (Build Variants)** – 构建变体工具窗口为当前应用程序项目配置不同的构建目标提供了快速方法（例如，针对应用程序的调试和发布版本提供不同的构建，或针对不同设备类别的多个构建）。\n\
  - **设备文件管理器 (Device File Explorer)** - 通过 `View -> Tool Windows -> Device File Explorer`\
  \ 菜单访问，此工具窗口提供了对当前连接的 Android 设备或模拟器文件系统的直接访问，允许浏览系统并将文件复制到本地文件系统。\n- **设备管理器 (Device\
  \ Manager)** - 提供对 `Device Manager` 工具窗口的访问，可以在其中添加、删除和管理物理 Android 设备连接和模拟器。\n\
  - **模拟器 (Emulator)** - 如果启用了在工具窗口中运行模拟器的选项，则包含 `AVD` 模拟器，具体参见标题为在 Android Studio\
  \ 中创建 Android 虚拟设备 (AVD)章节。\n- **事件日志 (Event Log)** - 事件日志窗口显示与在 Android Studio\
  \ 中执行的事件和活动相关的消息。例如，项目的成功构建或应用程序正在运行等将在此工具窗口内报告。\n- **收藏 (Favorites)** - 可以将各种项目项添加到收藏列表。例如，在项目视图中右键点击文件，可以访问\
  \ `Add to Favorites`（添加到收藏）菜单选项。同样，可以在 `Structure`（结构）工具窗口中右键点击源文件中的方法将其添加为收藏。添加到收藏列表的任何内容都可以通过此收藏工具窗口访问。\n\
  - **Gradle** - `Gradle` 工具窗口提供了项目构建配置所需的 `Gradle` 任务视图。该窗口列出了将项目各种元素编译为可执行应用程序所涉及的任务。右键点击顶层\
  \ `Gradle` 任务并选择 `Open Gradle Config`（打开 Gradle 配置）菜单选项，可以将当前项目的 Gradle 构建文件加载到编辑器中。Gradle\
  \ 将在书后部分详细介绍。\n- **布局检查器 (Layout Inspector)** - 提供构成用户界面布局的组件层次结构的可视 3D 渲染。\n- **Logcat**\
  \ - `Logcat` 工具窗口提供了对运行应用程序监控日志输出的访问，以及拍摄应用程序截图、视频以及停止和重启进程的选项。\n- **问题 (Problems)**\
  \ - 查看项目内所有当前错误或警告的中心位置。双击问题列表中的项将带您跳转到问题所在的文件和位置。\n- **性能分析器 (Profiler)** - `Android\
  \ Profiler` 工具窗口提供了用于识别运行应用中性能问题的实时监控和分析工具，包括 CPU、内存和网络使用情况。当应用当前运行时，此选项将变为可用。\n\
  - **项目 (Project)** - 项目视图提供了构成项目的文件结构概览，允许在文件之间快速导航。通常情况下，在项目视图中双击文件将导致文件加载到适当的编辑工具中。\n\
  - **资源管理器 (Resource Manager)** - 用于添加和管理项目包含的资源和资产（如图像、颜色和布局文件）的工具。\n- **运行 (Run)**\
  \ - 当应用程序当前运行时，运行工具窗口将可用，并提供运行结果视图以及停止或重启运行进程的选项。如果应用程序无法在设备或模拟器上安装和运行，此窗口通常会提供与问题相关的诊断信息。\n\
  - **结构 (Structure)** - 结构工具提供了编辑器中当前显示的源文件结构的高级视图。此信息包括文件中的类、方法和变量等项列表。从结构列表中选择项将带您跳转到编辑器窗口中源文件中的对应位置。\n\
  - **终端 (Terminal)** - 提供对运行 Android Studio 的系统终端窗口的访问。在 Windows 系统上，这是 `Command\
  \ Prompt`（命令提示符）界面，而在 Linux 和 macOS 系统上，它是 `Terminal` 提示。\n- **TODO** - 顾其实名，此工具提供了一个查看项目中尚未完成项的地方。Android\
  \ Studio 通过扫描构成项目的源文件并匹配指定 TODO 模式的注释来编译此列表。可以通过选择 `File -> Settings…`（macOS 上为\
  \ Android Studio -> Preferences...）菜单并导航到 `Editor` 下的 TODO 页面来查看和更改这些模式。\n\n## 6.4\
  \ Android Studio 快捷键\n\nAndroid Studio 包含了丰富的键盘快捷键，旨在执行常用任务时节省时间。可以在 Android Studio\
  \ 项目窗口内通过选择 `Help -> Keymap Reference` 菜单选项查看并打印完整的键盘快捷键映射列表。您还可以通过选择 `File -> Settings...`（macOS\
  \ 上为 Android Studio -> Preferences...）菜单选项并点击 `Keymap` 项（如下方的图 6-8 所示）来列出和修改快捷键：\n\
  \n![](img/as_keymap_settings.jpg)\n\n图 6-8\n\n## 6.5 切换器和最近文件导航\n\n在 Android Studio\
  \ 主窗口内导航的另一种有用机制是使用 `Switcher`（切换器）。通过键盘快捷键 `Ctrl-Tab` 访问，切换器显示为一个列出所有工具窗口和当前打开文件的面板（见下图\
  \ 6-9）。\n\n![](img/as_4.2_switcher.jpg)\n\n图 6-9\n\n只要按住 `Ctrl` 键，切换器就会保持可见。在按住\
  \ `Ctrl` 键的同时反复点击 `Tab` 键将在各种选项之间循环，而释放 `Ctrl` 键则会在主窗口中选中当前高亮的项。\n\n除了切换器外，`Recent\
  \ Files`（最近文件）面板提供了最近打开文件的导航（见下图 6-10）。可以使用快捷键 `Ctrl-E`（macOS 上为 Cmd-E）访问。显示后，可以使用鼠标指针选择选项，或者使用键盘箭头键滚动文件名和工具窗口选项。按下\
  \ `Enter` 键将选中当前高亮的项。\n\n![](img/as_4.0_recent_files.jpg)\n\n图 6-10\n\n## 6.6 更改\
  \ Android Studio 主题\n\nAndroid Studio 环境的主题可以通过欢迎界面的 `Configure -> Settings` 选项，也可以通过主窗口的\
  \ `File -> Settings…`（macOS 上为 Android Studio -> Preferences...）更改。\n\n显示设置对话框后，在左侧面板中选择\
  \ `Appearance & Behavior` 选项及其下的 `Appearance`，然后更改 `Theme` 菜单的设置，最后点击 `Apply` 按钮。可用的主题取决于平台，但通常包括\
  \ `Light`、`IntelliJ`、`Windows`、`High Contrast` 和 `Darcula` 等选项。图 6-11 展示了选择 `Darcula`\
  \ 主题的主窗口示例：\n\n![](img/as_3.6_darcula.jpg)\n\n图 6-11\n\n\n\n\n\n要使 Android Studio\
  \ 主题与操作系统的亮/深色模式设置同步，请启用 `Sync with OS`（与操作系统同步）选项，并使用下拉菜单控制每个模式使用的主题：\n\n![](img/as_theme_configuration.jpg)\n\
  \n图 6-12\n\n## 6.7 总结\n\nAndroid Studio 环境的主要元素包括欢迎界面和主窗口。每个打开的项目都分配有自己的主窗口，主窗口反过来由菜单栏、工具栏、编辑和设计区域、状态栏以及一组工具窗口组成。工具窗口出现在主窗口的侧边和底部，可以通过状态栏中的快速访问菜单访问，也可以通过可选的工具窗口栏访问。\n\
  \nAndroid Studio 中极少数的操作是无法通过键盘快捷键触发的。可以随时在 Android Studio 主窗口中访问默认快捷键的映射（keymap）。\n\
  \n## 7. 在物理 Android 设备上测试 Android Studio 应用\n\n虽然使用 Android 虚拟设备 (AVD) 测试应用程序可以实现很多功能，但在物理\
  \ Android 设备上进行真实世界的应用测试是不可替代的，而且某些 Android 功能仅在物理设备上可用。\n\n与 AVD 实例和连接的 Android\
  \ 设备之间的通信均由 Android 调试桥 (ADB) 处理。在本章中，我们将解释如何配置 `adb` 环境，以便在基于 macOS、Windows 和 Linux\
  \ 的系统的 Android 设备上进行应用测试。\n\n## 7.1 Android 调试桥 (ADB) 概述\n\n`ADB` 的主要目的是方便开发系统（在此例中\
  \ Android Studio）与 AVD 模拟器以及 Android 设备之间的交互，以运行和调试应用程序。`ADB` 允许你通过 WiFi 网络或直接使用\
  \ USB 线连接到设备。\n\n`ADB` 由一个客户端、一个在开发系统后台运行的服务器进程以及一个在 AVD 或真实 Android 设备（如手机和平板）上运行的守护进程组成。\n\
  \n`ADB` 客户端有多种形式。例如，在 Android SDK 的 `platform-tools` 子目录下以名为 `adb` 的命令行工具形式提供客户端。同样，Android\
  \ Studio 也有一个内置的客户端。\n\n可以使用 `adb` 命令行工具执行多种任务。例如，可以使用 `devices` 命令行参数获取当前活跃的虚拟或物理设备列表。以下命令输出表示系统上存在\
  \ AVD，但没有物理设备：\n\n```\n$adb devices\nList of devices attached\nemulator-5554 device\n\
  ```\n\n## 7.2 在 Android 设备上启用 USB 调试 ADB\n\n在 `ADB` 连接到 Android 设备之前，必须先配置该设备以允许连接。在运行\
  \ Android 6.0 或更高版本的手机和平板设备上，实现此目的的步骤如下：\n\n1. 打开设备上的 `Settings`（设置）应用并选择 `About\
  \ tablet` 关于平板电脑或 `About phone` 关于手机 选项（在某些 Android 版本中，可以在 `Settings` 应用的 `System`\
  \ 页面找到）。\n2. 在 `About`（关于）屏幕上，向下滚动到 `Build number`（编译号）字段并点击七次，直到出现指示已启用开发者模式的消息。如果\
  \ `About` 屏幕上没有列出 `Build number`，则可以通过 `Software information`（软件信息）选项找到。或者，如果可用，展开列表中的\
  \ `Advanced`（高级）部分。\n\n![](img/as_3.2_build_number.jpg)\n\n图 7-1\n\n3. 返回主 `Settings`\
  \ 屏幕，注意出现名为 `Developer options`（开发者选项）的新选项（在较新的 Android 版本中，此选项列在 `System` 设置屏幕上）。选择此选项，并在生成的屏幕上找到如图\
  \ 7-2 所示的 `USB debugging`（USB 调试）选项：\n\n![](img/android_12_enable_debugging.jpg)\n\
  \n图 7-2\n\n4. 启用 `USB debugging` 选项并在请求确认时点击 `Allow`（允许）按钮。\n\n此时，设备已配置为接受来自 USB\
  \ 连接的开发系统上 `adb` 的调试连接。剩下的工作是配置开发系统以便在连接设备时检测到它。虽然这是一个相对简单的过程，但涉及的步骤取决于开发系统运行的是\
  \ Windows、macOS 还是 Linux。注意，以下步骤假设已按照“设置 Android Studio 开发环境”章节所述，Android SDK `platform-tools`\
  \ 目录已包含在系统的 `PATH` 环境中。\n\n### 7.2.1 macOS ADB 配置\n\n要在 macOS 系统上配置 `ADB` 环境，请使用\
  \ USB 线将设备连接到计算机系统，打开终端窗口并执行以下命令以重启 `adb` 服务器：\n\n```\n$adb kill-server\n$adb start-server\n\
  * daemon not running. starting it now on port 5037 *\n* daemon started successfully\
  \ *\n```\n\n一旦服务器成功运行，执行以下命令验证设备是否已检测到：\n\n```\n$adb devices\nList of devices attached\n\
  74CE000600000001 offline\n```\n\n如果设备被列为 `offline`（离线），请查看 Android 设备并检查是否存在图 7-3\
  \ 所示请求 `Allow USB debugging`（允许 USB 调试）权限的对话框。在点击 `OK` 之前，勾选 `Always allow from\
  \ this computer`（始终允许来自此计算机）复选框。\n\n![](img/Image2856.jpg)\n\n图 7-3\n\n再次执行 `adb\
  \ devices` 命令现在会将设备列为可用：\n\n```\nList of devices attached\n015d41d4454bf80c device\n\
  ```\n\n### 7.2.2 Windows ADB 配置\n\n配置基于 Windows 的开发系统使用 ADB 连接到 Android 设备的第一步是在系统上安装相应的\
  \ USB 驱动程序。要安装的 USB 驱动程序取决于 Android 设备的型号。如果你拥有 Google 设备（如 Pixel 手机），需要在 Windows\
  \ 系统上安装并配置 `Google USB Driver`。实现此目的的详细步骤可在以下网页找到：https://developer.android.com/sdk/win-usb.html\n\
  \n对于 Google 驱动程序不支持的 Android 设备，需要下载设备制造商提供的驱动程序。可以在此处获取驱动程序列表以及安装信息：https://developer.android.com/tools/extras/oem-usb.html\n\
  \n在安装驱动程序且设备已被识别为正确的设备类型后，打开命令提示符窗口并执行以下命令：\n\n```\nadb devices\n```\n\n该命令应输出有关连接设备的信息如下：\n\
  \n```\nList of devices attached\nHT4CTJT0196 offline\n```\n\n如果设备列为 `offline` 或\
  \ `unauthorized`（未授权），请查看设备屏幕并检查是否存在图 7-3 所示请求 `Allow USB debugging` 权限的对话框。在点击\
  \ `OK` 之前，勾选 `Always allow from this computer`（始终允许来自此计算机）复选框。再次执行 `adb devices`\
  \ 命令现在会将设备列为已就绪：\n\n```\nList of devices attached\nHT4CTJT0196 device\n```\n\n如果设备未列出，尝试执行以下命令重启\
  \ ADB 服务器：\n\n```\nadb kill-server\nadb start-server\n```\n\n如果设备仍未列出，尝试执行以下命令：\n\
  \n```\nandroid update adb\n```\n\n注意，可能还需要重启系统。\n\n### 7.2.3 Linux adb 配置\n\n\n\n\
  \n在本章中，我们将再次使用 Ubuntu Linux 作为示例，介绍如何在 Linux 上配置 `adb` 以连接到物理 Android 设备进行应用测试。\n\
  \n在 Ubuntu Linux 上进行物理设备测试需要安装一个名为 `android-tools-adb` 的包，这反过来要求 Android Studio\
  \ 用户必须是 `plugdev` 组的成员。这是大多数 Ubuntu 版本用户账户的默认设置，您可以通过运行 `id` 命令进行验证。如果列表中没有列出 `plugdev`\
  \ 组，请运行以下命令将您的账户添加到该组：\n\n```bash\nsudo usermod -aG plugdev $LOGNAME\n```\n\n在满足组成员要求后，可以通过执行以下命令来安装\
  \ `android-tools-adb` 包：\n\n```bash\nsudo apt-get install android-tools-adb\n```\n\
  \n完成上述更改后，重启 Ubuntu 系统。系统重启后，打开终端窗口（Terminal），启动 `adb` 服务并检查连接的设备列表：\n\n```bash\n\
  $ adb start-server\n* daemon not running. starting it now on port 5037 *\n* daemon\
  \ started successfully *\n$ adb devices\nList of devices attached\n015d41d4454bf80c\
  \ offline\n```\n\n如果设备显示为 `offline`（离线）或未授权，请查看 Android 设备并检查如图 7-3 所示的对话框，请求允许\
  \ USB 调试。\n\n## 7.3 解决 USB 连接问题\n\n如果您无法通过上述步骤成功连接到设备，请显示运行目标菜单（图 7-4）并选择“排除设备连接”（Troubleshoot\
  \ Device Connections）选项：\n\n![](img/as_pair_devices_troubleshooting.jpg)\n\n图 7-4\n\
  \n连接助手将扫描设备并报告问题可能的解决方案。\n\n## 7.4 在 Android 设备上启用无线调试\n\n按照上述第 7.2 节的第 1 至 3 步操作，这次启用图\
  \ 7-5 所示的无线调试选项：\n\n![](img/android_12_enable_wifi_debugging.jpg)\n\n图 7-5\n\n接下来，点击上面的无线调试项，显示如图\
  \ 7-6 所示的屏幕：\n\n![](img/android_12_enable_wifi_debugging_settings.jpg)\n\n图 7-6\n\
  \n如果您使用的设备带有摄像头，请选择“通过二维码 配对设备”（Pair device with QR code），否则选择“通过配对码配对设备”（Pair device\
  \ with pairing code）选项。根据您的选择，“设置”应用将启动摄像头会话或如图 7-7 所示显示配对码：\n\n![](img/as_pair_devices_code.jpg)\n\
  \n图 7-7\n\n选择选项后，返回 Android Studio，并在运行目标菜单中选择如图 7-8 所示的“使用 WiFi 配对设备”（Pair Devices\
  \ Using WiFi）选项：\n\n![](img/as_pair_devices_wifi_menu.jpg)\n\n图 7-8\n\n在配对对话框中，根据您之前在设备“设置”应用中的选择，选择“使用二维码配对”（Pair\
  \ using QR code）或“使用配对码配对”（Pair using pairing code）：\n\n![](img/as_pair_devices_qr_code.jpg)\n\
  \n图 7-9\n\n使用 Android 设备扫描二维码，或将设备屏幕上显示的配对码输入到 Android Studio 对话框（图 7-10）中完成配对过程：\n\
  \n![](img/as_pair_devices_wifi_enter_code.jpg)\n\n图 7-10\n\n如果配对过程失败，请尝试重启开发系统和\
  \ Android 设备并重试。\n\n## 7.5 测试 adb 连接\n\n假设在您选择的开发平台上已成功配置 `adb`，下一步是在设备上尝试运行在在 Android\
  \ Studio 中创建示例 Android 应用章节中创建的测试应用程序。启动 Android Studio，打开 `AndroidSample` 项目，并验证设备是否出现在如图\
  \ 7-11 所示的高亮设备选择菜单中：\n\n![](img/android_12_device_in_menu_scaled.jpg)\n\n图 7-11\n\
  \n从列表中选择设备并点击运行按钮（位于设备菜单右侧的绿色箭头按钮）来安装并运行应用。\n\n## 7.6 总结\n\n虽然 Android 虚拟设备（AVD）模拟器提供了良好的测试环境，但请记住，确保应用在物理\
  \ Android 设备上运行正常是没有任何真正的替代品的。毕竟，这才是应用在现实世界中使用的地方。\n\n然而，默认情况下，Android Studio 环境未配置为将\
  \ Android 设备作为目标测试设备。因此，必须执行某些步骤，以便通过 USB 线缆或 WiFi 网络从 Android Studio 开发环境直接加载应用到\
  \ Android 设备上。实现此目标的具体步骤取决于所使用的开发平台。在本章中，我们涵盖了适用于 Linux、macOS 和基于 Windows 平台的步骤。\n\
  \n## 8. Android Studio 编辑器基础\n\n为 Android 开发应用涉及大量的编程工作，在运行 Android Studio 时通常会在编辑器窗口内进行代码。现代代码编辑器需要的功能远超基础的输入、删除和粘贴。\n\
  \n如今代码编辑器的实用性通常取决于它减少输入量量、对大源码文件的导航便利性，以及在编写代码时检测并突出显示错误的能力。正如本章将要说明的，这些只是 Android\
  \ Studio 编辑器出色的少数领域之一。\n\n虽然这并不是 Android Studio 编辑器功能的详尽概述，但本章旨在提供该工具的主要功能指南。经验程序员会发现其中某些功能是许多代码编辑器通用的，而许多功能是其特有的。\n\
  \n## 8.1 Android Studio 编辑器\n\n当选择 Java、Kotlin、XML 或其他文本文件进行编辑时，Android Studio 编辑器出现在主窗口中心。例如图\
  \ 8-1 显示了一个典型的编辑会话：\n\n![](img/as_code_editor_labelled.jpg)\n\n图 8-1\n\n构成编辑器窗口的元素总结如下：\n\
  \nA – 标签页 – Android Studio 能够同时打开多个文件进行编辑。每打开一个文件，它都会被分配一个位于编辑器窗口顶部标签栏的标签页，显示文件名。当空间不足显示所有标签页时，标签栏远右角会出现一个小小的下拉菜单。点击此菜单将列出其他打开的文件列表。标签页文件名下方的波浪红线表示文件中的代码包含一个或多个错误，在编译运行项目之前需要解决这些错误。\n\
  \n在文件之间切换只需点击相应的标签页或使用 `Alt-Left` 和 `Alt-Right` 快捷键。也可以使用切换器（通过 `Ctrl-Tab` 快捷键访问）进行文件导航。\n\
  \n要将编辑器面板从 Android Studio 主窗口中分离出来使其在单独窗口中显示，请点击标签页并拖动到主窗口之外的桌面区域。要将编辑器返回主窗口，请点击分离编辑器窗口中的文件标签，并将其拖动到主窗口的原始编辑器标签栏中。\n\
  \n\n\n\n## B – 编辑器侧边区域 (Gutter Area)\n侧边区域被编辑器用于显示信息图标和控件。此侧边区域中典型项目包括调试断点标记、折叠和展开代码块的控件、书签、更改标记和行号。行号默认开启，但可以通过在侧边区域上点击右键并选择\
  \ `Show Line Numbers`（显示行号）菜单选项来禁用。\n\n## C – 代码结构位置\n编辑器底部的此栏显示光标相对于代码整体结构的当前位置。例如，下图所示，该栏表示当前正在编辑\
  \ `convertCurrency` 方法，且该方法包含 `MainActivity` 类中。\n\n![](img/as_4.2_code_location.jpg)\n\
  \n图 8-2\n\n双击该栏内的任意元素将把光标移动到代码文件中相应的位置。例如，双击 `convertCurrency` 条目将把光标移动到源代码中 `convertCurrency`\
  \ 方法的顶部。同样，点击 `MainActivity` 条目将弹出一个可用的代码导航点列表供选择：\n\n![](img/as_4.2_code_location_menu.jpg)\n\
  \n图 8-3\n\n## D – 编辑器区域\n这是用户显示、输入和编辑代码的主区域。本章随后的章节将详细介绍编辑区域的关键功能。\n\n## E – 验证与标记侧边栏\n\
  Android Studio 整合了一项名为“实时代码分析（on-the-fly code analysis）”的功能。这基本上意味着当你输入代码时，编辑器正在分析代码以检查警告和语法错误。验证侧边栏顶部的指示器会随着代码的添加实时更新发现的错误和警告数量。点击此指示器将显示一个弹出窗口，其中包含编辑器代码中发现的问题摘要，如图\
  \ 8-4 所示：\n\n![](img/as_4.2_code_editor_warning_errors.jpg)\n\n图 8-4\n\n可以使用向上和向下箭头在代码中的错误位置之间移动。绿色勾号表示未检测到警告或错误。\n\
  \n侧边栏还会在使用相同的颜色编码在检测到问题的位置显示标记。当编辑器区域中某行代码可见时，将鼠标指针悬停在标记上，将显示一个包含问题描述的弹出窗口：\n\n\
  ![](img/as_warning_box.jpg)\n\n图 8-5\n\n当某行代码滚动出编辑器区域可视范围时，将鼠标指针悬停在该行的标记上，将显示一个“透镜（lens）”覆盖层，包含问题所在的代码块（图\
  \ 8-6），从而无需滚动到编辑器中的该位置即可查看：\n\n![](img/Image2460.jpg)\n\n图 8-6\n\n值得注意的是，透镜覆盖层不仅限于侧边栏中的警告和错误。悬停在侧边栏的任何部分上都会出现一个透镜，其中包含源文件中该处的代码。\n\
  \n## F – 状态栏 (Status Bar)\n虽然状态栏实际上是主窗口的一部分而非编辑器，但它确实包含关于当前活动编辑会话的信息。这些信息包括光标在行和字符方面的当前位置，以及文件的编码格式（UTF-8、ASCII\
  \ 等）。点击状态栏中的这些值可以更改相应的设置。例如，点击行号会显示“转到行（Go to Line）”对话框。\n\n在提供了构成 Android Studio\
  \ 编辑器的元素概述后，本章的剩余部分将更详细地探讨编辑环境的关键功能。\n\n## 8.2 分屏编辑器窗口\n默认情况下，编辑器将显示显示当前选中文件内容的单个面板。在同时处理多个源文件时，一个特别实用的功能是将编辑器拆分为多个窗格。要拆分编辑器，可以在编辑器窗口内的文件标签上点击右键，并选择\
  \ `Split Vertically`（垂直拆分）或 `Split Horizontally`（水平拆分）菜单选项。例如，图 8-7 显示了拆分器的操作，编辑器被拆分为三个面板：\n\
  \n![](img/Image2467.jpg)\n\n图 8-7\n\n可以通过右键点击相应的标签并选择 `Change Splitter Orientation`（更改拆分方向）菜单选项来随时更改拆分面板的方向。重复这些步骤可以取消单个面板的拆分，此时从菜单选择\
  \ `Unsplit`（取消拆分）选项。可以通过右键点击任何标签并选择 `Unsplit All`（取消所有拆分）选项移除所有拆分面板。\n\n窗口拆分可显示不同的文件，或为同一个文件提供多个窗口，允许同时查看和编辑同一文件的不同区域。\n\
  \n## 8.3 代码补全\nAndroid Studio 编辑器内置了大量 Java 编程语法以及构成 Android SDK 的类和方法的知识，还拥有关于你自己的代码库的知识。随着代码的输入，编辑器会扫描输入内容，并在适当情况下就完成某个语句或引用可能需要的内容提供建议。当编辑器检测到补全建议时，将出现一个包含建议列表的面板。例如在图\
  \ 8-8 中，编辑器正在为 `String` 声明的开头提供可能项：\n\n![](img/Image2477.jpg)\n\n图 8-8\n\n如果自动补全建议都不正确，只需继续输入，编辑器将不断完善建议。要接受顶部建议，只需按下\
  \ `Enter` 或 `Tab` 键。\n\n可以使用 `Ctrl-Space` 快捷键手动调用完成建议。这在编辑器中更改单词时非常有用。\n\n代码补全对许多程序员来说是一个个人喜好问题。考虑到这一事实，Android\
  \ Studio 对自动补全设置提供了高级别的控制。可以通过选择 `File -> Settings…` 菜单（macOS 上为 `Android Studio\
  \ -> Preferences…`）并从设置面板选择 `Editor -> General -> Code Completion` 来查看和修改这些设置，如图\
  \ 8-9 所示：\n\n![](img/as_3.6_code_completion_preferences.jpg)\n\n图 8-9\n\n## 8.4\
  \ 语句补全\nAndroid Studio 编辑器提供的另一种自动补全形式是语句补全。它可以自动填充方法和循环语句等项的括号和大括号。语句补全通过 `Shift-Ctrl-Enter`（macOS\
  \ 上为 `Shift-Cmd-Enter`）快捷键调用。考虑以下代码：\n\n```\nmyMethod()\n```\n\n\n\n\n在编辑器中输入此代码后，触发语句补全将导致编辑器自动为方法添加大括号：\n\
  \n```java\nmyMethod() {\n\n}\n```\n\n### 8.5 参数信息\n\n你也可以要求编辑器提供关于方法接受的参数参数的信息。将光标置于方法调用的括号之间时，使用\
  \ `Ctrl-P`（macOS 上为 `Cmd-P`）组合键将显示该方法已知接受的参数，并将最可能的建议**加粗**显示：\n\n![](img/Image2491.jpg)\n\
  \n图 8-10\n\n### 8.6 参数名提示\n\n代码编辑器可以配置为在方法调用中显示参数名提示。例如图 8-11 显示了 `Snackbar` 类调用\
  \ `make()` 和 `setAction()` 方法时的参数名提示：\n\n![](img/Image2499.jpg)\n\n图 8-11\n\n此模式的设置可以通过选择\
  \ `File` -> `Settings` 菜单（macOS 上为 `Android Studio` -> `Preferences`），然后在左侧面板中选择\
  \ `Editor` -> `Inlay Hints` -> `Java` 来配置。在生成的屏幕上，从列表中选择 `Parameter Hints` ，并启用或禁用\
  \ `Show parameter hints` 选项。要调整提示设置，点击 `Exclude list...` 链接并进行任何调整。\n\n### 8.7 代码生成\n\
  \n除了在输入时补全代码外，编辑器在某些条件下还可以自动为你生成代码。当光标位于文件中需要生成代码的位置时，可以使用 `Alt-Insert`（macOS 上为\
  \ `Cmd-N`）快捷键访问图 8-12 所示的可用代码生成选项列表。\n\n![](img/as_3.4_code_editor_generate.jpg)\n\
  \n图 8-12\n\n为了示例说明，考虑一种情况：我们希望在项目中的 `Activity` 准备被操作系统销毁时收到通知。正如本书后续章节将概述的，这可以通过重写\
  \ `Activity` 超类的 `onStop()` 周期方法来实现。要让 Android Studio 为此生成存根方法，只需从代码生成列表中选择 `Override\
  \ Methods…` 选项，并在生成的可用方法列表中选择 `onStop()` 方法：\n\n![](img/as_3.6_override_methods.jpg)\n\
  \n图 8-13\n\n选择好要重写的方法后，点击 `OK` 将在 Java 源文件的当前光标位置生成存根方法，如下：\n\n```java\n@Override\n\
  protected void onStop() {\n    super.onStop();\n}\n```\n\n### 8.8 代码折叠\n\n一旦源文件达到特定大小，即使是格式最整齐、组织最好的代码也可能变得难以处理和导航。Android\
  \ Studio 认为并不总是需要让每个代码块的内容始终保持可见。通过使用 Android Studio 编辑器的代码折叠功能，可以使导航变得更容易。代码折叠通过源文件中每个代码块开头和结尾处编辑器行槽中的标记来控制。例如图\
  \ 8-14 显示了当前未折叠的方法声明的起始和结束标记：\n\n![](img/as3.2_java_code_folding.jpg)\n\n图 8-14\n\
  \n点击这些标记中的任意一个都会折叠语句，使仅签名行可见，如图 8-15 所示：\n\n![](img/Image2533.jpg)\n\n图 8-15\n\n\
  要展开已折叠的代码段，只需点击编辑器行槽中的 `+` 标记。要在不展开的情况下查看隐藏代码，请将鼠标指针悬停在 `{……}` 指示器上，如图 8-16 所示。随后编辑器将显示包含折叠代码块的透镜遮罩覆盖层：\n\
  \n![](img/Image2540.jpg)\n\n图 8-16\n\n可以使用 `Ctrl-Shift-Plus` 和 `Ctrl-Shift-Minus`\
  \ 组合键对文件中的所有代码块进行折叠或展开。\n\n默认情况下，Android Studio 编辑器在打开源文件时会自动折叠某些代码。要配置发生这种情况的条件，选择\
  \ `File` -> `Settings…`（macOS 上为 `Android Studio` -> `Preferences…`），并在生成的设置面板中选择\
  \ `Editor` -> `General` -> `Code Folding` 项（图 8-17）：\n\n![](img/as_3.6_code_folding_preferences.jpg)\n\
  \n图 8-17\n\n### 8.9 快速文档查询\n\n将光标置于所需文档的声明上并按下 `Ctrl-Q` 快捷键（macOS 上为 `Ctrl-J`），即可访问上下文相关的\
  \ Java 和 Android 文档。这将显示一个包含该项目相关引用文档的弹出窗口。例如图 8-18 显示了 `Android FloatingActionButton`\
  \ 类的文档：\n\n![](img/Image2557.jpg)\n\n图 8-18\n\n显示后，可以根据需要可以在屏幕上移动文档弹出窗口。\n\n###\
  \ 8.10 代码格式化\n\n通常情况下，Android Studio 编辑器会在添加时自动对语句和代码块进行缩进、间距和嵌套格式化。在代码行需要格式化的情况下（例如从网站复制代码时），编辑器提供了代码格式化功能，选择后将匹配主流代码样式。要格式化源代码，按下\
  \ `Ctrl-Alt-L`（macOS 上为 `Cmd-Opt-L`）快捷键。要显示格式化对话框（图 8-19），使用 `Ctrl-Alt-Shift-L`（macOS\
  \ 上为 `Cmd-Opt-Shift-L`）。提供了格式化当前选中代码、整个源文件或仅更改代码的选择。\n\n![](img/reformat_dialog.jpg)\n\
  \n图 19\n\n完整的代码样式偏好可以在项目设置内更改。选择 `File` -> `Settings` 菜单（macOS 上为 `Android Studio`\
  \ -> `Preferences`），并在左侧面板中选择 `Code Style` 以访问支持的编程和标记语言。选择一种语言将提供大量的格式选项，所有选项都可以从\
  \ Android Studio 默认进行修改。要配置上述对话框中 `Rearrange code` 选项的设置，例如，展开 `Code Style` 部分，选择\
  \ `Java`，然后从 Java 设置中选择 `Arrangement` 选项卡。\n\n### 8.11 查找示例代码\n\nAndroid Studio\
  \ 编辑器提供了访问与当前高亮项相关的示例代码的方法。此功能对于学习如何使用特定的 Android 类或方法非常有用。要查找示例代码，在编辑器中高亮方法或类名，右键点击并选择\
  \ `Find Sample Code` 菜单选项。查找代码面板（图 8-20）出现在编辑器下方，显示示例列表。从列表中选择示例会将相应的代码加载到右侧面板：\n\
  \n![](img/Image2571.jpg)\n\n图 8-20\n\n### 8.12 Live Templates\n\n在编写 Android 代码时，你会发现经常使用某些结构。例如，常见的需求是使用\
  \ `Toast` 类向用户显示弹出消息。Live 模板是常用代码结构的集合，可以通过输入初始字符后跟一个特殊键（默认设置为 `Tab` 键）在编辑器输入模板代码。要体验这一操作，在代码编辑器中输入\
  \ `toast` 然后按 `Tab` 键，Android Studio 将在光标位置插入以下代码，并准备好编辑：\n\n```java\nToast.makeText(,\
  \ \"\", Toast.LENGTH_SHORT).show();\n```\n\n\n\n\n要列出并编辑现有模板、更改特殊键或添加自己的模板，请打开 Preferences（选项）对话框，并在左侧导航面板的\
  \ Editor（编辑器）部分选择 Live Templates（实时模板）：\n\n![](img/as_4.0_live_templates.jpg)\n\n\
  图 8-21\n\n使用上方图 8-21 中标记为 A 的按钮来添加、删除、复制或重置模板。要修改模板，请从列表 (B) 中选择它，并更改标记为 C 的面板中的设置。\n\
  \n## 8.13 总结\n\nAndroid Studio 编辑器尽了精力减少编写代码所需的打字量，并使代码更易阅读和导航。在本章中，我们涵盖了许多关键编辑器功能，包括代码补全、代码生成、编辑器窗口分割、代码折叠、重格式、文档查询和实时模板。\n\
  \n# 9. Android 架构概述\n\n到目前为止，本书已经采取了步骤来建立适用于使用 `Android Studio` 开发 Android 应用的环境。通过创建\
  \ `Android Studio` 应用项目，也已经迈出了应用开发流程的第一步。\n\n然而，在进一步探讨 Android 应用开发的实际问题之前，理解 `Android\
  \ SDK` 以及通用的 Android 开发的一些较为抽象的概念是非常重要的。现在清晰地理解这些概念将为进一步构建知识提供坚实的基础。\n\n本章从 Android\
  \ 架构概述开始，并在本书的接几章节中继续，目标是提供 Android 开发基础的详细概述。\n\n## 9.1 Android 软件栈\n\nAndroid\
  \ 以软件栈的形式结构，由应用程序、操作系统、运行时环境、中间件、服务和库组成。这种架构或许可以通过图 9-1 所示的视觉化表示最为清晰。栈的每一层以及每层中的相应元素都紧密集成并经过仔细调整，为移动设备提供最佳的应用开发和执行环境。本章的其余部分将介绍\
  \ Android 栈的不同层，从底部的 `Linux Kernel` 开始。\n\n![](img/Image2438.jpg)\n\n图 9-1\n\n##\
  \ 9.2 Linux 内核\n\n`Linux Kernel` 位于 Android 软件栈的底部，在设备硬件与 Android 软件栈上层之间提供了一种抽象。内核基于\
  \ Linux 版本 `2.6`，提供了抢占式多任务处理、内存、进程和电源管理等低级核心系统服务，还为显示器、WiFi 和音频等硬件提供了网络栈和设备驱动程序。\n\
  \n原始的 `Linux kernel` 由 Linus Torvalds 在 1991 年开发，并与 Richard Stallman 在自由软件基金会开发的一系列工具、实用程序和编译器相结合，创建了名为\
  \ `GNU/Linux` 的完整操作系统。各种 Linux 发行版都是从这些基础性基石演生而来，例如 `Ubuntu` 和 `Red Hat Enterprise\
  \ Linux`（红帽企业 Linux）。\n\n然而，需要注意的是，Android 仅使用 `Linux kernel`。尽管如此，值得注意的是，`Linux\
  \ kernel` 最初是为传统的台式机和服务器形式的计算机设计的。事实上，Linux 现在最广泛地部署在任务关键的企业服务器环境中。我们发现这种软件位于 Android\
  \ 软件栈的核心，既证明了当今移动设备的强大，也证明了 `Linux kernel` 的效率和性能。\n\n## 9.3 Android 运行时 – ART\n\
  \n当在 `Android Studio` 中构建 Android 应用时，它会被编译成中间字节码格式（称为 `DEX` 格式）。当随后将应用加载到设备时，Android\
  \ 运行时 (`ART`) 使用一种称为提前编译（`Ahead-of-Time`）的过程将字节码翻译为设备处理器所需的原生指令。这种格式被称为可执行和链接格式（`ELF`）。\n\
  \n每当随后启动应用时，都会运行 `ELF` 可执行版本，从而获得更快的应用性能和更好的电池续航。\n\n这与旧版 Android 实现中使用的即时编译（`JIT`）方法形成对比，在那种方法中，字节码在每次启动应用时都在虚拟机\
  \ (`VM`) 中翻译。\n\n## 9.4 Android 库\n\n除了一组标准的 `Java` 开发库（提供对字符串处理、网络和文件操作等通用任务的支持）外，Android\
  \ 开发环境还包括 `Android Libraries`。这些是一组专门用于 Android 开发的 Java 库。此类库的示例包括应用框架库，以及便于用户界面构建、图形绘制和数据库访问的库。\n\
  \nAndroid 开发者可用的一些关键核心 Android 库摘要如下：\n\n- `android.app` – 提供对应用模型的访问，是所有 Android\
  \ 应用的基石。\n- `android.content` – 促进应用程序与应用组件之间的内容访问、发布和消息传递。\n- `android.database`\
  \ – 用于访问内容提供者发布的数据，包括 `SQLite` 数据库管理类。\n- `android.graphics` – 低级 2D 图形绘制 API，包括颜色、点、滤镜、矩形和画布。\n\
  - `android.hardware` – 提供提供访问加速度计和光传感器等硬件的 API。\n- `android.opengl` – 指向 `OpenGL\
  \ ES` 3D 图形渲染 API 的 Java 接口。\n- `android.os` – 为应用提供标准操作系统服务的访问，包括消息、系统服务和进程间通信。\n\
  - `android.media` – 提供启用音频和视频播放的类。\n- `android.net` – 提供访问网络栈的一组 API。包括 `android.net.wifi`，用于访问设备的无线栈。\n\
  - `android.print` – 包括一组类，允许从 Android 应用内部将内容发送到配置的打印机。\n- `android.provider` –\
  \ 一组便利类，提供对标准 Android 内容提供者的访问，例如日历和联系人应用维护的内容。\n- `android.text` – 用于在设备显示器上渲染和处理文本。\n\
  - `android.util` – 一组工具类用于执行字符串和数字转换、XML 处理以及日期时间处理等任务。\n- `android.view` – 应用用户界的基础构建块。\n\
  - `android.widget` - 丰富的内置用户界面组件集合，如按钮、标签、列表视图、布局管理器、单选按钮等。\n- `android.webkit`\
  \ – 一组旨在允许应用构建网络浏览功能的类。\n\n在涵盖了 Android 运行时中的 Java 库之后，现在是时候关注 软件栈这一层包含的 C/C++ 库。\n\
  \n### 9.4.1 C/C++ 库\n\n在前节概述的 Android 运行时核心库基于 Java，并为编写 Android 应用的开发者提供了主要的 API。然而，需要注意的是，核心库并没有执行许多实际工作，事实上它们只是一组\
  \ C/C++ 库的 Java “封装器”。例如，当调用 `android.opengl` 库以便在设备显示器上绘制 3D 图形时，该库最终会调用 `OpenGL\
  \ ES` C++ 库，而该库又与底层的 `Linux kernel` 协作完成绘制任务。\n\n\n\n\n\n包含了 C/C++ 库来实现广泛且多样的功能，包括\
  \ 2D 和 3D 图形绘制、安全套接层 (SSL) 通信、SQLite 数据库管理、音频视频播放、位图和矢量字体渲染、显示子系统和图形层管理，以及标准 C 系统库\
  \ (`libc`) 的实现。\n\n在实践中，典型的 Android 开发者将通过基于 Java 的 Android 核心库 API 访问这些库。如果需要直接访问这些库，可以使用\
  \ Android (NDK) 实现，其目的是通过 Java 原生接口 (`JNI`) 从 Java 代码中调用非 Java 或 Kotlin 编程语言（如 `C`\
  \ 和 `C++`）的原生方法。\n\n## 9.5 应用框架 (Application Framework)\n\n应用框架是一系列共同构成了 Android\
  \ 应用程序运行和管理环境的服务。该框架实现了 Android 应用程序是由可重用、可交换和可替换的组件构建的理念。这一概念更进一步，即应用程序还可以发布其功能以及任何相关数据，以便其他应用程序发现并重用它们。\n\
  \nAndroid 框架包含以下关键服务：\n\n-   **Activity Manager (Activity 管理)** – 控制应用程序生命周期和活动栈的所有方面。\n\
  -   **Content Providers (内容提供者)** – 允许应用程序发布并与其他应用程序共享数据。\n-   **Resource Manager\
  \ (资源管理器)** – 提供对非代码嵌入资源的访问，如字符串、颜色设置和用户界面布局。\n-   **Notifications Manager (通知管理器)**\
  \ – 允许应用程序向用户显示警报和通知。\n-   **View System (视图系统)** – 用于创建应用程序用户界面的可扩展视图集。\n-   **Package\
  \ Manager (包管理器)** – 应用程序借此查找设备上当前安装的其他应用程序信息的系统。\n-   **Telephony Manager (电话管理器)**\
  \ – 向应用程序提供设备上可用电话服务的信息，例如状态和订阅者信息。\n-   **Location Manager (位置管理器)** – 提供位置服务的访问，允许应用程序接收位置更改的更新。\n\
  \n## 9.6 应用程序 (Applications)\n\n位于 Android 软件栈最顶端的是应用程序。它们包含了特定 Android 实现所提供的原生应用程序（例如网络浏览器和电子邮件应用程序）以及用户在购买设备后安装的第三方应用程序。\n\
  \n## 9.7 总结 (Summary)\n\n良好的 Android 开发知识基础需要对 Android 的整体架构有理解。Android 以软件栈架构的形式实现，由\
  \ Linux 内核、运行时环境及相应的库、应用框架和一组应用程序组成。应用程序主要用 `Java` 或 `Kotlin` 编写，并在 Android Studio\
  \ 构建环境中编译为字节码格式。当应用程序随后安装在设备上时，这些字节码将由 Android 运行时 (`ART`) 编译为 CPU 使用的原生格式。Android\
  \ 架构的关键目标是性能和效率，涵盖了应用程序执行以及应用程序设计中重用的实现。\n\n## 10. Android 应用程序剖析 (The Anatomy of\
  \ an Android Application)\n\n无论你之前的编程经验如何，无论是基于 `Windows`、`macOS`、`Linux` 甚至是 `iOS`，Android\
  \ 开发可能与你以前遇到过的任何事物都很不同。\n\n因此，本章的目的是理解 Android 应用程序架构背后的高级概念。在此，我们将详细探索用于构建应用程序的各种组件，以及允许这些组件协同工作以创建一个一致应用程序的机制。\n\
  \n## 10.1 Android Activities\n\n熟悉 `Java`、`Kotlin`、`C++` 或 `C#` 等面向对象编程语言的人熟悉将应用程序功能元素封装在类中的概念，然后将其实例化为对象并进行操作以创建应用程序。由于\
  \ Android 应用程序是用 `Java` 和 `Kotlin` 编写的，情况仍然如此。然而，Android 将可重用组件的概念提高到了更高的水平。\n\n\
  Android 应用程序通过汇集一个或多个被称为 `Activities` 的组件创建。Activity 是应用程序功能的单一独立模块，通常直接对应单个用户界面屏幕及其相应的功能。例如，一个预约应用程序可能会有一个\
  \ Activity 屏幕，显示当天设置的预约。该应用程序还可能使用第二个 Activity，它由一个允许用户在其中输入新预约的屏幕组成。\n\nActivity\
  \ 被设计为完全可重用和可交换的构建块，可以在不同的应用程序之间共享。例如，现有的电子邮件应用程序可能包含一个专门用于编写和发送电子邮件消息的 Activity。开发者可能正在编写一个也具有发送电子邮件消息要求的应用程序。开发者无需为这个新应用程序专门开发一个邮件编写\
  \ Activity，而可以直接使用来自现有电子邮件应用程序的 Activity。\n\nActivity 是作为 Android `Activity` 类的子类创建的，并且必须实现为完全独立于应用程序中的其他\
  \ Activity。换句话说，共享的 Activity 不能依赖于在程序流的已知点处被调用（因为其他应用程序可能会以意想不到的方式使用该 Activity），而且一个\
  \ Activity 不能直接调用另一个 Activity 的方法或访问其实例数据。相反，这是通过 `Intents` 和 `Content Providers`\
  \ 实现的。\n\n默认情况下，Activity 无法向调用它的 Activity 返回结果。如果需要此功能，则必须将该 Activity 特别启动为源 Activity\
  \ 的子 Activity。\n\n## 10.2 Android Fragments\n\n如上所述，Activity 通常代表应用内部的单个用户界面屏幕。一种方案是使用单个用户界面布局和一个对应的\
  \ Activity 类文件来构建 Activity。然而，更好的替代方案是将 Activity 拆分为不同的部分。这些部分中的每一个被称为一个 fragment（片段），每个片段由用户界面布局的一部分和一个匹配的类文件（声明为\
  \ Android `Fragment` 类的子类）组成。在这种情况下，Activity 仅仅变成一个容器，一个或多个 fragment 被嵌入其中。\n\n\
  事实上，fragment 为每个用户界面屏幕由一个独立的 Activity 表示提供了高效的替代方案。相反，应用可以由单个 Activity 组成，在不同的 fragment\
  \ 之间切换，每个 fragment 代表不同的应用屏幕。\n\n## 10.3 Android Intents\n\nIntent 是一个 Activity\
  \ 启动另一个 Activity 并实现构成应用程序的 Activity 之间的的机制。Intent 由对要执行的操作的描述以及可选的要执行操作的数据组成。\n\
  \nIntent 可以是显式的，即通过引用类名来请求启动特定的 Activity；也可以是隐式的，即通过说明要执行的操作类型或提供要执行该操作的特定类型的数据。在隐式\
  \ Intent 的情况下，Android 运行时将使用称为 Intent 解析的过程选择与 `Intent` 指定准则最匹配的 Activity 进行启动。\n\
  \n## 10.4 Broadcast Intents\n\n\n\n\n\n另一种类型的 `Intent` 是广播许可（Broadcast Intent），它是一种系统级的许可，发送给所有注册了“感兴趣”广播接收器（Broadcast\
  \ Receiver）的应用程序。例如，Android 系统通常会发送广播许可来指示设备状态的变化，例如系统启动完成、外部电源连接到设备或屏幕开启或关闭。\n\n\
  广播许可可以是“普通的”（异步的），即它在几乎相同的时间内被发送给所有感兴趣的广播接收器；也可以是“有序的”，即它一次发送给一个接收器，由接收器对其进行处理，然后终止或允许传递给下一个广播接收器。\n\
  \n## 10.5 广播接收器\n\n广播接收器是应用程序响应广播许可的机制。接收器必须由应用程序注册，并配置 `Intent Filter`（意图过滤器）以指明其感兴趣的广播类型。当匹配的意图被广播时，无论注册该接收器的应用程序当前是否运行，Android\
  \ 运行时都会调用该接收器。接收器随后有 5 秒的时间来完成其所需的任何任务（例如启动 `Service`、更新数据或向用户发布通知），然后返回。广播接收器在后台运行，不具有用户界面。\n\
  \n## 10.6 Android 服务\n\nAndroid 服务是在后台运行的且不具有用户界面的进程。它们可以从活动（activities）、广播接收器或其他\
  \ `Services` 启动并进行管理。Android 服务适用于应用程序需要继续执行任务但不一定需要向用户显示界面的情况。虽然服务缺少用户界面，但它们仍然可以使用通知（notifications）和吐司（toasts，出现在屏幕上但不中断当前可见活动的小型通知消息）通知用户事件，并能够发布\
  \ `Intents`。\n\nAndroid 运行时赋予服务的优先级高于许多其他进程，系统只有在作为最后手段的，时才会将其终止以释放资源。然而，如果运行时确实需要杀死一个\
  \ `Service`，一旦资源再次可用，它将自动重启。`Service` 可以通过声明自己需要在在前台运行来降低被终止的风险。这是通过调用 `startForeground()`\
  \ 实现的。这仅建议终止会对用户体验产生不利的影响（例如，如果用户正在收听由 `Service` 流出的音频）。\n\n`Service` 可能作为实际解决方案的示例场景包括（如之前提到的）：当应用程序不再活跃时仍应继续的音频流，或者在股票达到指定价格时需要通知用户的股票跟踪应用程序。\n\
  \n## 10.7 内容提供者\n\n内容提供者（Content Providers）实现了应用程序之间共享数据的机制。任何应用程序都可以通过实现 `Content\
  \ Provider` 为其他应用程序提供对其底层数据的访问，包括添加、删除和查询数据的能力（取决于权限）。对数据的访问通过 `Content Provider`\
  \ 定义的通用资源标识符 (`URI`) 提供。数据可以以文件或整个 `SQLite` 数据库的形式共享。\n\n原生 Android 应用程序包含许多标准的内容提供者，允许应用程序访问联系人和媒体文件等数据。Android\
  \ 系统上当前可用的内容提供器可以使用 `Content Resolver` 进行定位。\n\n## 10.8 应用程序清单\n\n将组成应用程序的各种元素结合在一起的胶水是应用程序清单文件（Application\
  \ Manifest file）。在这个基于 XML 的文件中，应用程序概述了构成完整应用程序的活动、服务、广播接收器、数据提供和权限。\n\n## 10.9\
  \ 应用程序资源\n\n除了清单文件和包含字节码的 `Dex` 文件，Android 应用程序包通常还包含一组资源文件。这些文件包含了用户界面中显示的资源，如字符串、图像、字体和颜色，以及用户界面布局的\
  \ XML 表示。默认情况下，这些文件存储在应用程序项目层次结构的 `/res` 子目录中。\n\n## 10.10 应用程序上下文\n\n当应用程序编译时，会创建一个名为\
  \ `R` 的类，其中包含应用程序资源的引用。应用程序清单文件和这些资源共同创建了应用程序上下文（Application Context）。该上下文由 `Android\
  \ Context` 类表示，可以在应用程序代码中使用它在运行时访问应用程序资源。此外，可以在应用程序上下文中调用多种方法来收集信息并在运行时更改应用程序的环境。\n\
  \n## 10.11 总结\n\n多个不同的元素可以组合成一个 Android 应用程序。在本章中，我们提供了对活动（Activities）、片段（Fragments）、服务（Services）、意图（Intents）和广播接收器的概述，以及对清单文件和应用程序资源的概述。\n\
  \n通过以活动和意图的形式创建单个独立功能模块，促进了最大的重用和互操作性，而应用程序之间的数据共享通过实现内容提供者来实现。\n\n活动专注于用户与应用程序交互的区域（活动基本上等同于单个用户界面屏幕，通常由一个或多个片段组成），而后台处理通常由\
  \ `Services` 和广播接收器处理。\n\n构成应用程序的组件在清单文件中为 Android 运行时系统进行了概述，该文件与应用程序资源结合，代表了应用程序的上下文。\n\
  \n本章涵盖了许多对普通开发者来说可能全新的新内容。然而，请放心，后续章节将对对这些概念进行大量的探索和实际应用，以确保在构建您自己的应用程序时拥有坚固的知识基础。\n\
  \n# 11 Android 视图绑定概述\n\n开发 Android 应用程序的重要组成部分涉及代码与构成用户界面布局的视图之间的交互。本章将查看在代码中访问布局视图的选项，特别强调一种被称为视图绑定（view\
  \ binding）的选项。在涵盖视图绑定的基础之后，本章将概述将 AndroidSample 项目转换为使用此方法所需的更改。\n\n## 11.1 通过 ID\
  \ 查找视图\n\n正如“Android 应用程序剖析”章节概述的，构成应用程序的所有资源都被编译到名为 `R` 的类中。这些资源中包含了定义布局的资源。`R`\
  \ 类中有一个名为 `layout` 的子类，它包含了布局资源，包括构成用户界面的视图。大多数应用程序都需要实现代码与这些视图之间的交互，例如在读取输入到 `EditText`\
  \ 视图的值或更改 `TextView` 上显示的内容时。\n\n在 Android Studio 3.6 之前，从应用程序代码内部访问视图的唯一选项是编写代码通过\
  \ `findViewById()` 方法根据其 ID 手动查找视图。例如：\n\n```\nTextView exampleView = findViewById(R.id.exampleView);\n\
  ```\n\n```\nexampleView.setText(\"Hello\");\n```\n\n\n\n\n\n虽然通过 ID 查找视图仍然是一种可行的方案，但它存在一些局限性，`findViewById()`\
  \ 最大的缺点是可能会获取到布局中尚未创建的视图引用，从而导致在尝试访问视图属性时抛出空指针异常。\n\n从 Android Studio 3.6 开始，已经提供了一种以视图绑定（view\
  \ binding）的形式从应用代码访问视图的替代方法。\n\n## 11.2 视图绑定 (View Binding)\n\n当在应用模块中启用视图绑定时，Android\
  \ Studio 会为该模块内的每个布局文件自动生成绑定类。使用此绑定类，可以从代码内部访问布局视图，而无需使用 `findViewById()`。\n\nAndroid\
  \ Studio 生成的绑定类名称是基于布局文件名转换为所谓的“驼峰命名法”（camel case），并在末尾附加“Binding”单词。例如，对于 `activity_main.xml`\
  \ 文件，绑定类将被命名为 `ActivityMainBinding`。\n\nAndroid Studio Chipmunk 在项目模板中使用视图绑定的情况尚并不一致。例如，我们在创建\
  \ `AndroidSample` 项目时使用的 Empty Activity 模板并没有使用视图绑定。另一方面，Basic Activity 模板是使用视图绑定实现的。如果你使用的是没有使用视图绑定的模板，那么了解如何将该项目从合成属性（synthetic\
  \ properties）迁移出来是非常重要的。\n\n## 11.3 转换 AndroidSample 项目\n\n在本章的剩余部分，我们将通过将 `AndroidSample`\
  \ 项目转换为使用视图绑定而不是使用 `findViewById()` 来练习迁移操作。\n\n首先，启动 Android Studio 并打开在 Android\
  \ Studio 中创建示例 Android 应用章节中创建的 `AndroidSample` 项目。\n\n## 11.4 启用视图绑定\n\n要使用视图绑定，必须对需要视图绑定的模块的\
  \ `build.gradle` 文件进行更改。对于 `AndroidSample` 项目，这需要对 `Gradle Scripts -> build.gradle\
  \ (Module: AndroidSample.app)` 文件进行微调。将此文件加载到编辑器，找到 `android` 部分并添加以下项以启用 `viewBinding`\
  \ 属性：\n\n```gradle\nplugins {\n    id 'com.android.application'\n}\n\nandroid {\n\
  \    buildFeatures {\n        viewBinding true\n    }\n}\n```\n\n完成此更改后，点击编辑器面板顶部的\
  \ Sync Now 链接，然后使用 Build 菜单清理（clean）并重新构建（rebuild）项目，以确保生成绑定类。下一步是在代码中使用该绑定类。\n\n\
  ## 11.5 使用视图绑定\n\n此过程的第一步是“膨胀”（inflate）视图绑定类，以便我们可以访问布局中的根视图。该根视图将作为布局的内容视图。\n\n\
  执行这些任务的逻辑位置位于与布局关联的 `onCreate()` 方法中。一个典型的 `onCreate()` 方法如下：\n\n```java\n@Override\n\
  protected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_main);\n}\n```\n\n要切换到使用视图绑定，需要导入视图绑定类并按如下方式修改类。注意，由于布局文件名为\
  \ `activity_main.xml`，我们可以推断 Android Studio 生成的绑定类名称为 `ActivityMainBinding`。请注意，如果你在创建项目时使用了\
  \ `com.example` 以外的域名，则下面的导入语句需要修改以反映这一点：\n\n```java\nimport android.widget.EditText;\n\
  import android.widget.TextView;\nimport com.example.androidsample.databinding.ActivityMainBinding;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n    }\n```\n\n现在我们已经有了绑定的引用，可以按照如下方式通过名称访问视图：\n\
  \n```java\npublic void convertCurrency(View view) {\n    EditText dollarText = findViewById(R.id.dollarText);\n\
  \    TextView textView = findViewById(R.id.textView);\n    if (!binding.dollarText.getText().toString().equals(\"\
  \")) {\n        Float dollarValue = Float.valueOf(binding.dollarText.getText().toString());\n\
  \        Float euroValue = dollarValue * 0.85F;\n        binding.textView.setText(euroValue.toString());\n\
  \    } else {\n        binding.textView.setText(R.string.no_value_string);\n   \
  \ }\n}\n```\n\n编译并运行应用，验证货币转换过程是否像以前一样正常工作。\n\n## 11.6 选择建议\n\n尽管 Empty Activity\
  \ 模板未采用视图绑定，但 Google 强烈建议尽可能地使用视图绑定。事实上，对合成属性的支持现在已经废弃，并可能会在 Android Studio 的未来版本中移除。因此，在开发项目时，可能应该使用视图绑定。\n\
  \n## 11.7 书中的视图绑定\n\n本书中任何依赖未实现视图绑定的项目模板的章节将首先进行迁移。然而，为了避免每次需要迁移时都重复这些步骤，这些章节将引导你回到这里复习记忆（别担心，过几个章节后，必要的更改将变得自然成章）。为了帮助这一过程，下面的部分更简洁地总结了迁移步骤。\n\
  \n## 11.8 将项目迁移到视图绑定\n\n将项目模块转换为使用视图绑定的过程涉及以下步骤：\n\n1. 编辑项目窗口中列出的 `Gradle Scripts\
  \ -> build.gradle (Module: <project name>.app)` 模块级 Gradle 脚本，其中 `<project name>`\
  \ 是项目名称（例如 AndroidSample）。\n2. 找到文件的 `android` 部分并添加以下项以启用 `viewBinding` 属性：\n\n\
  ```gradle\nandroid {\n    buildFeatures {\n        viewBinding true\n    }\n}\n\
  ```\n3. 点击编辑器顶部的 Sync Now 链接以这些新的构建设置重新同步项目。\n4. 编辑 `MainActivity.java` 文件并将其修改如下如下（其中\
  \ `<reverse domain>` 代表创建项目时使用的域名，`<project name>` 替换为项目的小写名称，例如 androidsample），`<binding\
  \ name>` 是对应布局资源文件的绑定类名称（例如 `activity_main.xml` 的绑定为 `ActivityMainBinding`）：\n\n\
  ```java\nimport android.view.View;\nimport com.<reverse domain>.<project name>.databinding.<binding\
  \ name>;\n\npublic class MainActivity extends AppCompatActivity {\n    private <binding\
  \ name> binding;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        binding = <binding name>.inflate(getLayoutInflater());\n        View view\
  \ = binding.getRoot();\n        setContentView(view);\n    }\n}\n```\n\n5. 通过绑定对象的属性按名称访问视图。\n\
  \n## 11.9 总结\n\n\n\n\n\n在 Android Studio 3.6 引入之前，从应用代码内部访问布局视图需要使用 `findViewById()`\
  \ 方法。现在提供了一种名为视图绑定（view bindings）的替代方案。视图绑定由 Android Studio 为每个 XML 布局文件自动生成的类组成。这些类包含了对应布局中每个视图的绑定，相比\
  \ `findViewById()` 方法提供的选项提供了更安全的选择。然而，从 Android Studio Chipmunk 版本开始，某些项目模板默认未启用视图绑定，需要额外的步骤来在每个项目模块中手动启用并配置相关支持。\n\
  \n# 12. 理解 Android 应用程序和 Activity 生命周期\n\n在较早的章节中，我们已经学习了 Android 应用程序运行在进程中，并且它们由活动（activities）、服务（services）和广播接收器（broadcast\
  \ receivers）形式的多个组件组成。本章的目标是通过查看 Android 运行时系统中应用程序和 Activity 的生命周期来扩展这些知识。\n\n\
  无论如今移动设备与过去的桌面系统相比所拥有的内存和计算能力有多么轰动人心，但请记住，根据现代桌面和笔记本电脑系统的标准，这些设备仍被认为是“资源受限”的，特别是在内存方面。因此，Android\
  \ 系统的一项核心责任是确保这些有限资源得到有效管理，并确保操作系统和运行其上的应用程序始终对用户保持响应。为了实现这一目标，Android 对运行应用程序的进程以及构成这些应用程序的各个组件的生命周期和状态拥有完全控制。\n\
  \n因此，开发 Android 应用程序的一个重要因素是理解 Android 的应用程序和 Activity 生命周期管理模型，以及应用程序在执行生命周期内应对可能施加于它的状态变化。\n\
  \n## 12.1 Android 应用程序与资源管理\n\n每个运行的 Android 应用程序被操作系统视为一个独立的进程。如果系统识别到设备上的资源达到容量，它将采取措施终止进程以释放内存。\n\
  \n在决定终止哪个进程以释放内存时，系统会同时考虑所有当前运行进程的优先级和状态，结合这些因素创建 Google 所谓的“重要性层次结构”（importance\
  \ hierarchy）。进程将从最低优先级开始终止，并按层次向上移动，直到系统释放了足够的资源以供其运行。\n\n## 12.2 Android 进程状态\n\
  \n进程托管应用程序，而应用程序由组件组成。在 Android 系统中，进程的当前状态由其所托管的应用程序中排名最高的活动组件定义。正如图 12-1 所示，进程在任何给定时间都可以处于以下五种状态之一：\n\
  \n![android_process_priorities.png](img/Image24381.jpg)\n\n图 12-1\n\n### 12.2.1\
  \ 前台进程 (Foreground Process)\n\n这些进程被赋予最高优先级。在任何时刻，活跃的前台进程不太可能超过两个，它们通常是系统最后终止的。进程必须满足以下一个或多个标准才能获得前台状态：\n\
  \n* 托管用户正在交互的 Activity。\n* 托管与用户正在交互的 Activity 连接的 Service。\n* 托管一个通过调用 `startForeground()`\
  \ 指明终止会破坏用户体验的 Service。\n* 正在执行其 `onCreate()`、`onResume()` 或 `onStart()` 回调的 Service。\n\
  * 托管一个正在执行其 `onReceive()` 方法的广播接收器。\n\n### 12.2.2 可见进程 (Visible Process)\n\n包含一个对用户可见但不是用户正在交互的\
  \ Activity 的进程被归类为“可见进程”。这通常发生在进程中的 Activity 对用户可见，但另一个 Activity（例如部分屏幕或对话框）处于前台时。如果一个进程托管的\
  \ Service 本身绑定到一个可见或前台 Activity，该进程也有资格获得可见状态。\n\n### 12.2.3 服务进程 (Service Process)\n\
  \n包含已启动并正在执行的 Service 的进程。\n\n### 12.2.4 后台进程 (Background Process)\n\n包含一个或多个当前对用户不可见的\
  \ Activity，且没有托管符合服务进程状态的 Service 的进程。属于此类别的进程如果需要为高优先级进程释放额外内存，则面临很高的终止风险。Android\
  \ 维护着后台进程的动态列表，按时间顺序终止进程，使得最久未在前台的进程首先被杀死。\n\n### 12.2.5 空进程 (Empty Process)\n\n\
  空进程不再包含任何活动应用程序，并被保留在内存中，准备作为新启动应用程序的托管者。这类似于为了等乘客到达而保持公交车门打开、引擎运行。此类进程显然被认为优先级最低，是第一个被杀死以释放资源的。\n\
  \n## 12.3 进程间依赖\n\n确定最高优先级进程的情况比前节描述的稍微复杂一点，简单原因是进程之间往往是相互依赖的。因此，在确定进程优先级时，Android\
  \ 系统还会考虑该进程是否以某种方式为另一个更高优先级的进程提供服务（例如，作为前台进程的内容提供者的服务进程）。根据一条基本规则，Android 文档说明一个进程的排名永远不会低于它当前正在服务的另一个进程。\n\
  \n## 12.4 Activity 生命周期\n\n正如我们之前确定的，Android 进程的状态在很大程度上取决于其托管应用程序的 Activity 和组件的状态。因此，重要的理解是，这些\
  \ Activity 在应用程序的执行生命周期内也会转换不同的状态。Activity 的当前状态在部分取决于它在所谓的“Activity 栈”（Activity\
  \ Stack）中的位置。\n\n## 12.5 Activity 栈\n\n对于 Android 设备上运行的每个应用程序，运行时系统都维护一个 Activity\
  \ 栈。当应用程序启动时，应用程序中启动的第一个 Activity 被放入栈中。当启动第二个 Activity 时，它被放置在栈的顶部，而先前的 Activity\
  \ 则被向下推。位于栈顶部的 Activity 被称为活跃（或运行中）Activity。当活跃 Activity 退出时，它会被运行时从栈中弹出，栈中紧邻下方的\
  \ Activity 变成当前的活跃 Activity。例如，栈顶部的 Activity 可能会因为其负责的任务已完成而简单退出。或者，用户可能选择了屏幕上的“返回”按钮以回到之前的\
  \ Activity，导致当前 Activity 被运行时系统从栈中弹出并因此销毁。Android Activity 栈的视觉表示如图图 12-2 所示。\n\n\
  \n\n\n\n如图所示，当新活动启动时，它们会被推入栈的顶端。当前活跃活动位于栈的顶端，直到它被新活动推入栈的下方，或者在它退出或用户导航到上一个活动时从栈中弹出。如果资源变得受限，运行时将杀死活动，并从栈底的活动开始。\n\
  \n活动栈（Activity Stack）在编程术语中是指通常所说的“后进先出”（LIFO）栈，因为最后一个推入栈的项是第一个被弹出栈的项。\n\n![android_activity_lifecycle_diagram.png](img/Image2447.jpg)\n\
  图 12-2\n\n## 12.6 活动状态\n\n在应用程序执行的整个过程中，活动可能处于多种不同状态之一：\n\n- **活跃 / 运行（Active /\
  \ Running）** – 该活动位于活动栈的顶端，是设备屏幕上可见的前台任务，拥有焦点并且正在与用户进行交互。在资源短缺的情况下，这种活动最不容易被终止。\n\
  - **暂停（Paused）** – 该活动对用户可见，但目前没有焦点（通常是因为该活动部分被当前活跃的活动遮挡）。暂停的活动保留在内存中，保持连接到窗口管理器，保留所有状态信息，并在移动到活动栈顶端时可以快速恢复到活跃状态。\n\
  - **停止（Stopped）** – 该活动目前对用户是不可见的（换句话说，它在设备显示器上被其他活动完全遮挡）。与暂停的活动一样，它保留了所有状态和成员信息，但在低内存情况下被终止的风险更高。\n\
  - **已杀死（Killed）** – 该活动已被运行时系统终止以释放内存，不再存在于活动栈中。如果应用程序需要，则必须重启此类活动。\n\n## 12.7 配置更改\n\
  \n到本章目前为止，我们已经了导致 Android 活动状态改变的两种原因，即活动在前台和后台之间的移动，以及运行时系统终止活动以释放内存。事实上，还有第三种情况，即活动的状态可能会发生剧烈变化，这涉及设备配置的更改。\n\
  \n默认情况下，任何影响活动外观的配置更改（例如在竖屏和横屏模式之间旋转设备方向，或更改系统字体设置）都会导致活动被销毁并重建。这背后的逻辑是此类更改会影响资源（如用户界面布局），而简单地销毁和重建受影响的活动是活动响应配置更改的最快方法。然而，也可以配置活动使其在响应特定配置更改时不被系统重启。\n\
  \n## 12.8 处理状态更改\n\n至少从本章中应当明确的是，应用程序（根据定义，其中包含的组件）在整个生命周期内将经历许多状态。特别重要的一点是，这些状态更改（包括完全终止）是\
  \ Android 运行时根据用户操作和设备上资源的可用性而强加给应用程序的。\n\n在实践中，这些状态更改并非完全在没有通知的情况下强加的，在大多数情况下，应用程序会收到运行时系统的更改通知并获得机会做出相应反应。这通常涉及保存或恢复内部数据结构和用户界面状态，从而允许用户在应用程序之间无缝切换，并至少提供多个并发运行应用程序的象。\n\
  \nAndroid 提供了两种处理应用内对象生命周期状态变化的方法。一种方法涉及响应操作系统的状态更改方法调用，将在下一章处理 Android 活动状态更改中进行详细介绍。\n\
  \n另一种新方法，也是 Google 推荐的方法，涉及与 Jetpack Android 一起一起的生命周期类，这些类在使用 Jetpack 构建现代 Android\
  \ 应用架构中引入，并在标题为使用 Android 生命周期感知组件的章节中进行了更详细的解释。\n\n## 12.9 总结\n\n移动设备通常被认为是资源受限的，特别是在内存容量方面。因此，Android\
  \ 操作系统的主要责任之一是确保应用程序以及整个操作系统对用户保持响应。\n\n应用程序托管在 Android 的进程中。每个应用程序又由活动和服务等形式的组件组成。\n\
  \nAndroid 运行时系统有权终止进程和单个活动以释放内存。运行时系统在决定一个进程是否是终止的候选者时，会考虑进程状态。进程的状态在很大程度上取决于该进程托管的活动状态。\n\
  \n本章的核心信息是，应用程序在执行生命周期内会经历各种状态，并且对其在 Android 运行时环境中的命运几乎没有控制权。那些不直接与用户交互的进程和活动面临更高的被运行时系统终止的风险。因此，Android\
  \ 应用开发的一个基本要素是应用程序响应操作系统状态更改通知的能力。\n\n## 13 处理 Android 活动状态更改\n\n根据理解 Android 应用和活动生命周期章节中概述的信息，现在显而易见，构成应用程序的活动和片段在应用程序整个生命周期内会经历各种不同的状态。从一个状态到另一个状态的更改是由\
  \ Android 运行时系统强加的，因此在很大程度上不受活动本身的控制。然而，这并不意味着应用程序无法响应这些更改并采取适当行动。\n\n### 13.1 新旧生命周期技术\n\
  \n直到最近，在应用中构建生命周期感知的标准方法。这是本章介绍的方法，涉及在活动或片段实例中实现一组方法（每个生命周期状态一个），当该对象的生命周期状态变化时，操作系统会调用这些方法。这种方法自\
  \ Android 操作系统的早期以来一直没有变化，虽然在今天仍然是一个可行的选择，但它确实有一些局限性，这些将在本章后半部分进行解释。\n\n\n\n\n\n\
  随着 Jetpack Android 架构组件生命周期类的引入，现在有了更好的方法来处理生命周期。这种现代的生命周期管理方法（结合 Jetpack 组件和架构指南）将在随后的章节中进行详细介绍。然而，出于几个原因，理解传统的生命周期方法仍然很重要。首先，作为一名\
  \ Android 开发者，你无法完全隔离开传统的生命周期方法，并且仍然会使用其中的一些方法。更重要的是，理解旧的生命周期处理方式将提供一个良好的知识基础，以便在书的后后部分学习新方法。\n\
  \n## 13.2 Activity 和 Fragment 类\n\n在极少数情况下，应用程序中的活动（activities）和片段（fragments）分别创建为\
  \ Android `AppCompatActivity` 类和 `Fragment` 类的子类。\n\n例如，考虑在“在 Android Studio 中创建示例\
  \ Android 应用”中创建的 `AndroidSample` 项目，并随后将其转换为视图绑定（view binding）。将此项目加载到 Android\
  \ Studio 环境中并找到 `MainActivity.java` 文件（位于 `app` -> `java` -> `com` -> `<your domain>`\
  \ -> `androidsample`）。找到文件后，双击它将其加载到编辑器中，其内容如下：\n\n```java\npackage com.example.androidsample;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\n\nimport android.view.View;\n\
  \nimport android.os.Bundle;\n\nimport java.util.Locale;\n\nimport com.example.androidsample.databinding.ActivityMainBinding;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n    private ActivityMainBinding\
  \ binding;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n    }\n\n\
  \    public void convertCurrency(View view) {\n        if (!binding.dollarText.getText().toString().equals(\"\
  \")) {\n            float dollarValue = Float.parseFloat(\n                    binding.dollarText.getText().toString());\n\
  \            float euroValue = dollarValue * 0.85F;\n            binding.textView.setText(\n\
  \                    String.format(Locale.ENGLISH,\"%f\", euroValue));\n       \
  \ } else {\n            binding.textView.setText(R.string.no_value_string);\n  \
  \      }\n    }\n}\n```\n\n在创建项目时，我们指示 Android Studio 同时也创建一个名为 `MainActivity.java`\
  \ 的初始活动。如上面的代码所示，`MainActivity` 类是 `AppCompatActivity` 类的子类。\n\n查看 `AppCompatActivity`\
  \ 类的参考文档可以发现它本身也是 `Activity` 类的子类。这可以在 Android Studio 编辑器中使用“层次结构（Hierarchy）”工具窗口进行验证。当\
  \ `MainActivity.java` 文件加载到编辑器中时，点击类声明行中的 `AppCompatActivity` 并按下快捷键 `Ctrl-H`。随后会显示层次结构工具窗口，展示所选类的类层级关系。正如图\
  \ 13-1 所示，`AppCompatActivity` 显然是继承自 `FragmentActivity` 类的子类，而 `FragmentActivity`\
  \ 最终也是 `Activity` 类的子类：\n\n![](img/as_3.6_class_heirachy.jpg)\n\n图 13-1\n\n`Activity`\
  \ 和 `Fragment` 类包含一系列方法，这些方法旨在由 Android 运行时调用，以便在对象状态发生变化时通知它。在本章中，我们将这些方法称为“生命周期方法”。活动或片段类只需要重写这些方法并在它们内部实现必要的功能，以对状态变化做出相应响应。\n\
  \n其中一个方法名为 `onCreate()`，再次回到上面的代码段，我们可以看到该方法在 `MainActivity` 类中已经为我们重写并实现。在随后的章节中，我们将详细探索\
  \ `onCreate()` 以及 `Activity` 和 `Fragment` 类的其他相关生命周期方法。\n\n## 13.3 动态状态与 持久化状态\n\
  \n生命周期管理的一个目标是确保活动的状态在适当的时间保存并恢复。当我们在此语境下讨论“状态”时，指的是当前存储在活动内部的数据以及用户界面的显示。例如，活动可能会在内存中维护一个需要保存到数据库或文件的数据模型。这种状态信息因为会从应用程序的多次调用中持续存在，因此被称为持久化状态（persistent\
  \ state）。\n\n用户界面的显示内容（例如输入到字段中但尚未提交给应用程序的文本）被称为动态状态（dynamic state），因为它通常只在应用程序的次调用期间保留。理解这两种状态之间的差异非常重要，因为它们的保存方式以及保存的原因都不同。\n\
  \n保存持久化状态的目的是避免活动被运行时系统杀死可能导致的数据丢失。另一方面，保存动态状态的原因稍微复杂一些。\n\n例如，考虑一个应用程序包含一个活动（我们将其称为\
  \ Activity A），该活动包含一个文本字段和一些单选按钮。在使用应用程序的过程中，用户在文本字段中输入了一些文本并从单选按钮中进行了选择。然而，在执行保存这些更改的操作之前，用户切换到了另一个活动，导致\
  \ Activity A 被推入活动栈（Activity Stack）并置于后台。一段时间后，运行时系统确定内存不足，因此杀掉了 Activity A 以释放资源。但对于用户来说，Activity\
  \ A 只是被置于后台，并准备好随时移动到前台。当返回 Activity A 到前台时，用户理所当然预期输入的文本和单选按钮的选择会被保留。然而在这种情况下，Activity\
  \ A 的新实例已经被创建，如果动态状态没有被保存和恢复，之前的用户输入就会丢失。\n\n因此，保存动态状态的主要目的是为了提供在前台和后台活动之间无缝切换的感知，无论活动实际上是否已经过杀死并重启。\n\
  \n保存持久化状态和动态状态的机制将在章的后续章节中变得更加清晰。\n\n## 13.4 Android 生命周期方法\n\n如之前所述，`Activity`\
  \ 和 `Fragment` 类包含许多生命周期方法，这些方法在实例状态变化时作为事件处理器。Android `Activity` 和 `Fragment` 类支持的主要方法如下：\n\
  \n- `onCreate(Bundle savedInstanceState)`：在活动首次创建时调用的方法，是执行大多数初始化任务的理想位置。该方法接收一个\
  \ `Bundle` 对象作为参数，该对象可能包含来自活动之前调动态状态信息（通常与用户界面状态有关）。\n- `onRestart()`：当活动之前被运行时系统停止后准备重启时被调用。\n\
  \n\n\n\n\n## Activity 生命周期周期方法\n\n- `onStart()` – 始终在调用 `onCreate()` 或 `onRestart()`\
  \ 方法后立即调用，此方法通知 activity 它即将变得对用户可见。如果 activity 移动到 activity 栈的顶部，则此后将调用 `onResume()`；如果它被另一个\
  \ activity 推入栈底，则将调用 `onStop()`。\n- `onResume()` – 表示 activity 现在处于 activity 栈的顶端，并且是用户当前正在交互的\
  \ activity。\n- `onPause()` – 表示之前的 activity 即将成为前台 activity。根据 activity 是返回前台还是对用户不可见，此调用将随后调用\
  \ `onResume()` 或 `onStop()` 方法。在此方法中可以采取步骤来存储尚未被应用保存的持久化状态信息。为了避免切换 activity 之间的延迟，应避免在此方法中执行耗时操作，如将数据存储到数据库或执行网络操作。此方法还应该停止任何\
  \ CPU 密集型任务（如动画）。\n- `onStop()` – activity 现在不再对用户可见。此调用之后可能出现的两种场景是：如果 activity\
  \ 再次移动到前台，则调用 `onRestart()`；如果 activity 正在终止，则调用 `onDestroy()`。\n- `onDestroy()`\
  \ – activity 即将被销毁，可能是因为 activity 已完成任务并调用了 `finish()` 方法而主动，也可能是因为运行时正在终止它以释放内存，或由于配置更改（如设备方向改变）。需要注意的是，当\
  \ activity 终止时，并不总是会调用 `onDestroy()`。\n- `onConfigurationChanged()` – 当发生配置更改且该\
  \ activity 已指示不要重启时调用。该方法会接收一个概述了新设备配置的 `Configuration` 对象，然后由 activity 负责对更改做出响应。\n\
  \n### Fragment 生命周期周期方法\n\n以下生命周期方法仅适用于 `Fragment` 类：\n\n- `onAttach()` - 当 fragment\
  \ 分配给 activity 时调用。\n- `onCreateView()` - 用于创建并返回 fragment 的用户界面布局视图层次结构。\n- `onActivityCreated()`\
  \ - 与 fragment 关联的 activity 的 `onCreate()` 方法已完成执行。\n- `onViewStatusRestored()`\
  \ - fragment 保存的视图层次结构已恢复。\n\n### 状态保存与恢复\n\n除了上述生命周期方法外，还有两个方法专门用于保存和恢复 activity\
  \ 的动态状态：\n\n- `onRestoreInstanceState(Bundle savedInstanceState)` – 在 activity 从之前保存过状态的调用中重启时，此方法在调用\
  \ `onStart()` 方法后立即被调用。与 `onCreate()` 类似，此方法会传递一个包含之前状态数据的 `Bundle` 对象。此方法通常用于在在\
  \ `onCreate()` 和 `onStart()` 中完成 activity 初始化后，恢复之前的状态更具意义的情况。\n- `onSaveInstanceState(Bundle\
  \ outState)` – 在 activity 销毁之前调用，以便保存当前的动态状态（通常与用户界面有关）。该方法接收一个应将状态保存其中的 `Bundle`\
  \ 对象，该状态随后会在 activity 重启时传递给 `onCreate()` 和 `onRestoreInstanceState()` 方法。请注意，只有在运行时确定需要保存动态状态时，此方法才会被调用。\n\
  \n在重写（override）上述方法时，请记住，除了 `onRestoreInstanceState()` 和 `onSaveInstanceState()`\
  \ 之外，方法实现必须包含对父类中对应方法的调用。例如，下面的方法重写了 `onRestart()` 方法，但也包含了对该方法的父类实例的调用：\n\n```java\n\
  protected void onRestart() {\n    super.onRestart();\n    Log.i(TAG, \"onRestart\"\
  );\n}\n```\n\n在方法重写中未进行此父类调用将导致运行时在执行期间抛出异常。虽然在 `onRestoreInstanceState()` 和 `onSaveInstanceState()`\
  \ 方法中对父类的调用是可选的（例如，在实现自定义保存和恢复行为时可以省略它们），但使用它们有显著益处，这一主题将在[保存和恢复 Android Activity\
  \ 状态]章节中进行介绍。\n\n## 13.5 生命周期 (Lifetimes)\n\n最后一个要涵盖的的话题涉及 activity 或 fragment 在执行期间将经历的整个、可见和前台生命期的概述：\n\
  \n- **整个生命 (Entire Lifetime)** – “整个生命”一术语用于描述从首次调用 `onCreate()` 方法到对象终止前调用 `onDestroy()`\
  \ 方法之间发生发生的一切。\n- **可见生命 (Visible Lifetime)** – 涵盖了调用 `onStart()` 到 `onStop()` 之间的执行期间。在此期间，activity\
  \ 或 fragment 对用户可见，尽管它可能不是用户当前正在交互的对象。\n- **前台生命 (Foreground Lifetime)** – 指调用 `onResume()`\
  \ 和 `onPause()` 方法之间的执行期间。\n\n需要注意的是，一个 activity 或 fragment 在整个生命周期过程中可能会多次通过前台和可见生命。\n\
  \n生命周期和生命周期方法的概念在[图 13-2]中所示：\n\n![android_activity_lifecycle_methods.png](img/Image2446.jpg)\n\
  图 13-2\n\n## 13.6 折叠屏设备与多恢复 (Foldable Devices and Multi-Resume)\n\n如前所述，当 activity\
  \ 移动到前台并是用户当前正在交互的 activity 时，它被认为处于恢复状态。在标准设备上，应用在任何时候只有一个 activity 处于恢复状态，所有其他\
  \ activity 可能处于暂停或停止状态。\n\n一段时间以来，Android 一直包含了多窗口支持，允许多个 activity 同时在分屏或自由形式配置中显示。虽然最初主要用于大屏幕平板设备，但随着折叠屏设备的推出，这一功能可能会变得流行。\n\
  \n在运行 Android 10 并启用多窗口支持的设备上（大多数折叠屏设备如此），多个应用 activity 同时处于恢复状态（这种概念被称为多恢复），允许这些可见\
  \ activity 在另一个 activity 焦点时继续运行（例如流媒体内容或更新视觉数据）。虽然多个 activity 可以处于恢复状态，但这些 activity\
  \ 中的只有一个会被视为恢复 activity（换句话说，用户最近交互的 activity）。\n\nactivity 可以通过实现 `onTopResumedActivityChanged()`\
  \ 回调方法接收其获得或丢失顶部恢复状态的通知。\n\n## 13.7 禁用配置更改重启\n\n\n\n\n\n正如本章开头所过的，生命周期方法已经使用了多年，直到最近，它们仍然处理活动（activity）和片段（fragment）生命周期状态变化的唯一机制。然而，这种方法存在缺点。\n\
  \n生命周期方法的一个问题是，它们无法让活动或片段在应用程序执行过程中的任何一点轻松发现其当前的生命周期状态。相反，对象需要在内部跟踪状态，或者等待下一次生命周期方法的调用。\n\
  \n此外，这些方法没有提供一种简单的方法让一个对象观察应用内其他对象的生命周期状态变化。这是一个严重的考虑因素，因为应用中的许多其他对象都可能受到特定活动或片段生命周期状态变化的影响。\n\
  \n生命周期方法仅适用于 `Fragment` 和 `Activity` 类的子类。因此，无法构建出真正感知生命周期的自定义类。\n\n最后，生命周期方法导致大多数生命周期处理代码被编写在活动或片段内部，这可能导致代码复杂且易出错。理想情况下，这些代码的大部分应该位于受状态变化影响的其他类中。例如，一个流媒体视频的应用可能包含一个专门用于管理输入数据流的类。如果应用在主活动停止时需要暂停流，那么执行该操作的代码应该位于流媒体类中，而不是主活动。\n\
  \n所有这些问题以及更多问题都可以通过使用生命周期感知组件来解决，这一主题将从“使用 Jetpack 构建现代 Android 应用架构”]中，我们将实现一个示例应用程序，将这些理论付诸实践。\n\
  \n## 14. 通过示例理解 Android 活动状态变化\n\n之前的章节详细讨论了构成 Android 应用的活动的不同状态和生命周期。在本章中，我们将通过创建一个示例应用程序，将处理活动状态变化的理论付诸实践。该示例应用程序的目的是为活动在\
  \ Android 运行时通过各种不同状态的过程提供一个真实世界的演示。在下一章“保存和恢复 Android 活动的状态”]中，在本章中构建的示例项目将得到扩展，以演示动态活动状态的保存和恢复。\n\
  \n### 14.1 创建状态变更示例项目\n\n此练习的第一步是创建一个新项目。首先启动 Android Studio，如有必要，使用 `File -> Close\
  \ Project` 菜单选项关闭任何当前打开的项目，以便显示欢迎界面。\n\n在欢迎界面选择 New Project（新建项目）选项，在弹出的新项目对话框中，点击\
  \ Next（下一步）按钮之前选择 Empty Activity（空活动）模板。\n\n在 `Name` 字段中输入 `StateChange`，并指定 `com.ebookfrenzy.statechange`\
  \ 为包名。在点击 Finish（完成）按钮之前，将 Minimum API level（最低 API ）设置为 `API 26: Android 8.0 (Oreo)`，并将语言菜单设置为\
  \ `Java`。项目创建完成后，`StateChange` 项目应列在 Android Studio 主窗口左侧的 Project 工具窗口中。使用章节 11.8\
  \ 将项目迁移到 View Binding 中概述的步骤将项目转换为使用 view binding。\n\n接下来的操作涉及活动的用户界面设计。它存储在一个名为\
  \ `activity_main.xml` 的文件中，该文件应该已经加载到 Layout Editor 工具中。如果没有，请在项目工具窗口中导航到它，可以在 `app\
  \ -> res -> layout` 文件夹找到它。找到后，双击文件将将其加载到 Android Studio Layout Editor 工具中。\n\n\
  ![](img/as_4.2_statechange_layout_editor.jpg)\n\n图 14-1\n\n## 14.2 设计用户界面\n\n当用户界面布局加载到\
  \ Layout Editor 工具中后，现在是为示例应用程序设计用户界面了。与用户界面设计中目前的“Hello World!” `TextView` 不同，活动实际上需要一个\
  \ `EditText` 。在 Layout Editor 画布上选择 `TextView` 对象并按下键盘上的 Delete 键将其从设计中删除。\n\n从\
  \ Layout Editor 左侧的 Palette（调板）中，选择 Text（文本）类别，从文本组件列表中点击并拖 Plain Text（纯文本）组件到设备屏幕的可视表示上。将组件移动到显示器中心，出现中心引导线，然后将其放置，使布局类似于图\
  \ 14-2。\n\n![](img/as_3.6_state_change_ui.jpg)\n\n图 14-2\n\n在使用 `EditText` 组件时，有必要为视图指定输入类型（inputType）。这简单地定义了用户输入的文本或数据类型。例如，如果将输入类型设置为\
  \ `Phone`，用户将被限制在视图中输入数字。或者，如果将输入类型设置为 `TextCapCharacters`，输入将默认为大写字母。输入类型设置也可以组合。\n\
  \n出于本示例的考虑，我们将设置输入类型以支持通用文本输入。要这样做，在布局中选择 `EditText` 组件，并在 Attributes 工具窗口中找到 `inputType`\
  \ 条目。点击当前设置左侧的旗帜图标打开选项列表，在列表中，关闭 `textPersonName` 并启用 `text`，然后点击 Apply（应用）按钮。留在\
  \ Attributes 工具窗口中，将视图的 `id` 更改为 `editText`，并在弹出的对话框中点击 Refactor（重构）按钮。\n\n默认情况下，`EditText`\
  \ 显示的文本为“Name”。留在 Attributes 面板中，从 `text` 属性字段中删除此内容，使视图在布局中为空。\n\n在继续之前，点击布局编辑器工具栏上的\
  \ Infer Constraints（推断约束）按钮以添加任何缺失的约束。\n\n\n\n\n\n此时，项目包含一个名为 `MainActivity` 的单一活动，它派生自\
  \ `AppCompatActivity` 类。该活动的源代码包含在 `MainActivity.java` 文件中，该文件应该已经在编辑器会话中打开，并在编辑器标签栏中以标签页的形式显示。如果文件未打开，请在项目（Project）工具窗口面板中导航到它（`app\
  \ -> java -> com -> ebookfrenzy -> statechange -> MainActivity`）并双击将其加载到编辑器中。\n\n\
  到为止，活动重写的唯一生命周期方法是 `onCreate()` 方法，该方法已实现为在为活动设置用户界面之前调用该方法的父类实例。现在，我们将修改此方法，使其在每次执行时都能在\
  \ Android Studio 的 Logcat 面板中输出诊断消息。为了实现这一点，我们将使用 `Log` 类，这要求我们导入 `android.util.Log`\
  \ 并声明一个标签（tag），以便我们能够在日志输出中过滤这些消息：\n\n```java\npackage com.ebookfrenzy.statechange;\n\
  \nimport android.util.Log;\nimport androidx.annotation.NonNull;\nimport android.view.View;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    private static final String TAG = \"StateChange\";\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        Log.i(TAG, \"\
  onCreate\");\n    }\n}\n```\n\n下一个任务是重写更多方法，每个方法都包含一个相应的日志调用。这些重写方法可以手动添加，也可以使用\
  \ `Alt-Insert` 快捷键生成，正如标题为“Android Studio 代码编辑器基础的章节概述概述。注意，如果方法是自动生成的，仍然需要手动添加\
  \ `Log` 调用：\n\n```java\n@Override\nprotected void onStart() {\n    super.onStart();\n\
  \    Log.i(TAG, \"onStart\");\n}\n\n@Override\nprotected void onResume() {\n   \
  \ super.onResume();\n    Log.i(TAG, \"onResume\");\n}\n\n@Override\nprotected void\
  \ onPause() {\n    super.onPause();\n    Log.i(TAG, \"onPause\");\n}\n\n@Override\n\
  protected void onStop() {\n    super.onStop();\n    Log.i(TAG, \"onStop\");\n}\n\
  \n@Override\nprotected void onRestart() {\n    super.onRestart();\n    Log.i(TAG,\
  \ \"onRestart\");\n}\n\n@Override\nprotected void onDestroy() {\n    super.onDestroy();\n\
  \    Log.i(TAG, \"onDestroy\");\n}\n\n@Override\nprotected void onSaveInstanceState(@NonNull\
  \ Bundle outState) {\n    super.onSaveInstanceState(outState);\n    Log.i(TAG, \"\
  onSaveInstanceState\");\n}\n\n@Override\nprotected void onRestoreInstanceState(@NonNull\
  \ Bundle savedInstanceState) {\n    super.onRestoreInstanceState(savedInstanceState);\n\
  \    Log.i(TAG, \"onRestoreInstanceState\");\n}\n```\n\n### 14.4 过滤 Logcat 面板\n\n\
  在 `MainActivity.java` 的重写方法中添加代码目的是将日志信息输出到 Logcat 工具窗口。此输出可以配置为显示与设备或模拟器会话相关的所有事件，也可以限制为与当前选中应用相关的事件。输出还可以进一步限制为仅匹配特定过滤器的日志事件。\n\
  \n显示 Logcat 工具窗口并点击过滤器菜单（在图 14-3 中标记为 B）以查看可用选项。当此菜单设置为 `Show only selected application`（仅显示所选应用）时，Logcat\
  \ 面板中将仅显示标记为 A 的菜单中选中应用相关的消息。相反，选择 `No Filters`（无过滤器）将显示由设备或模拟器生成的所有消息。\n\n![](img/as_4.0_statechange_logcat.jpg)\n\
  图 14-3\n\n在运行应用程序之前，演示创建一个过滤器是值得的，当选择它时，它将进一步限制日志输出，确保只显示包含我们在活动中声明的标签的日志消息。\n\n\
  从过滤器菜单（B）选择 `Edit Filter Configuration`（编辑过滤器配置）选项。在 `Create New Logcat Filter`（创建新\
  \ Logcat 过滤器）对话框（图 14-4）中，将过滤器命名为 `Lifecycle`，并在 `Log Tag` 字段中输入在 `MainActivity.java`\
  \ 中声明的 `Tag` 值（在上面的代码示例中为 `StateChange`）。\n\n![](img/Image2459.jpg)\n图 14-4\n\n\
  在 `Package Name` 字段中输入包标识，更改完成后，点击 `OK` 按钮创建过滤器并关闭对话框。Logcat 工具窗口中现在应该选中新创建的过滤器，而不是列出\
  \ `No Filters`。\n\n## 14.5 运行应用程序\n\n为了获得最佳结果，应用程序应该在物理 Android 设备或模拟器上运行。在设备配置好并连接到开发电脑后，点击\
  \ Android Studio 工具栏中由绿色三角形表示的运行按钮，如下方的图 14-5 所示，选择 `Run -> Run…` 菜单选项或使用键盘快捷键 `Shift+F10`：\n\
  \n![](img/as_3.5_run_state_change.jpg)\n图 14-5\n\n如果出现 `Choose Device` 对话框，选择物理\
  \ Android 设备或模拟器（假设你尚未将其配置为默认目标）。在 Android Studio 构建应用程序并安装到设备后，它应该启动并运行在前台。\n\n\
  查看 Logcat 面板应指示哪些方法已被触发（确保选择了上一节创建的 `Lifecycle` 过滤器，以过滤掉不相关的日志事件）：\n\n![](img/Image2476.jpg)\n\
  图 14-6\n\n### 14.6 测试活动\n\n诊断功能正常后，现在是时候通过视图测试应用程序以理解活动生命周期的变化。首先，考虑 Logcat 面板中的初始日志序列：\n\
  \n`onCreate`\n`onStart`\n`onResume`\n\n显然，初始状态的变化与“理解 Android 应用程序`中的概述完全一致。然而，注意没有调用\
  \ `onRestoreInstanceState()`，因为 Android 运行时检测到没有需要恢复的状态。\n\n点击设备底部状态栏上的 Home 图标，并日志中报告的方法调用序列：\n\
  \n`onPause`\n`onStop`\n`onSaveInstanceState`\n\n在这种情况下，运行时注意到活动不再在前台、对用户不可见并已停止该活动，但并未提供活动保存动态状态的机会。取决于运行时最终销毁了活动还是仅仅重启了它，当用户返回活动时，活动将通过调用\
  \ `onRestart()` 被通知其已重启，或者将再次通过创建序列。\n\n正如“理解 Android 应用程序`概述的，活动的销毁和重建可以通过对设备进行配置更改来触发，例如从竖屏旋转到横屏。要看到此效果，只需在\
  \ `StateChange` 应用程序在前台时旋转设备。当使用模拟器时，可以使用模拟器工具栏上的旋转按钮来模拟设备旋转。为了完成旋转，可能还需要点击旋转按钮。它出现在设备或模拟器屏幕的底部，如图\
  \ 14-7 所示：\n\n![](img/as_4.1_rotate_screen_button.jpg)\n图 14-7\n\n\n\n\n日志中产生的方法调用序列应当如下：\n\
  \n`onPause`\n`onStop`\n`onSaveInstanceState`\n`onDestroy`\n`onCreate`\n`onStart`\n\
  `onRestoreInstanceState`\n`onResume`\n\n显然，运行时系统在 activity 被销毁和重启之前，已经提供了保存状态的机会。\n\
  \n## 14.7 总结\n\n“一画胜千言”这句古老的格言在学习新的编程范式示例时同样适用。在本章中，我们创建了一个 Android 应用程序示例，用于演示\
  \ activity 可能会经历的各种生命周期状态。在本章的项目开发过程中，我们还研究了从 activity 内部生成诊断性日志信息的机制。\n\n在下一章中，我们将扩展\
  \ `StateChange` 示例项目，用以演示如何保存和恢复 activity 的动态状态。\n\n# 15. 存储和恢复 Android Activity\
  \ 状态\n\n如果之前的几个章节已经实现了目标，那么现在对于在 activity 生命周期的特定点保存和恢复用户界面状态的重要性，应该变得更清晰了。\n\n\
  在本章中，我们将扩展在通过示例学习 Android Activity 状态变化中创建的示例应用程序，演示当 activity 被运行时系统销毁并重建时，保存和恢复状态所需的步骤。\n\
  \n存储和恢复动态状态的关键组件涉及对 Android SDK `Bundle` 类的使用，该主题也将在本文中涵盖。\n\n## 15.1 存储动态状态\n\n\
  正如我们已经学到的，activity 有机会通过运行时系统调用其内部的 `onSaveInstanceState()` 方法来保存动态状态信息。作为参数传递给该方法的是一个\
  \ `Bundle` 对象的引用，该方法需要向该对象中存储任何需要保存的动态数据。随后，运行时系统会代表 activity 存储该 `Bundle` 对象，并在如果以及调用\
  \ activity 的 `onCreate()` 和 `onRestoreInstanceState()` 方法时，将其作为参数传递过去。然后，可以在这些方法内部从\
  \ `Bundle` 对象中检索数据，并将其用于恢复 activity 的状态。\n\n## 15.2 用户界面状态的默认存储\n\n在上一章中，`StateChange`\
  \ 示例应用程序的诊断输出显示，当运行它的设备旋转到足以以触发方向变化时，activity 会经历多次状态变化。\n\n再次启动 `StateChange` 应用程序，这次在执行设备旋转之前，在\
  \ `EditText` 字段中输入一些文本（在运行 Android 9 或更高版本的设备或模拟器上，可能需要点击位于状态栏中的旋转按钮来完成旋转）。旋转设备后，Logcat\
  \ 窗口中会出现以下状态变化序列：\n\n```\nonPause\nonStop\nonSaveInstanceState\nonDestroy\nonCreate\n\
  onStart\nonRestoreInstanceState\nonResume\n```\n\n显然，这导致了 activity 的销毁和重建。然而，通过查看运行中应用程序的用户界面，应该发现输入到\
  \ `EditText` 字段中的文本已被保留。鉴于 activity 经历过销毁和重建，而且我们没有添加任何特定的代码来确保文本被保存和恢复，这种行为需要一些解释。\n\
  \n事实上，Android SDK 包含的大多数视图控件（view widgets）已经实现了在 activity 重启时自动保存和恢复状态所需的行为。启用此行为的唯一要求是\
  \ activity 中的 `onSaveInstanceState()` 和 `onRestoreInstanceState()` 重写方法必须包含对父类对应方法的调用：\n\
  \n```java\n@Override\nprotected void onSaveInstanceState(@NonNull Bundle outState)\
  \ {\n    super.onSaveInstanceState(outState);\n}\n\n@Override\nprotected void onRestoreInstanceState(@NonNull\
  \ Bundle savedInstanceState) {\n    super.onRestoreInstanceState(savedInstanceState);\n\
  }\n```\n\n在 XML 布局文件中，可以通过将 `android:saveEnabled` 属性设置为 `false` 来禁用用户界面视图的状态自动保存。为了演示，我们将禁用用户界面布局中\
  \ `EditText` 视图的自动状态保存机制，然后在应用程序中添加代码来手动保存和恢复视图的状态。\n\n要配置 `EditText` 视图以便在 activity\
  \ 重启时状态不会被保存和恢复，请编辑 `activity_main.xml` 文件，使视图的条目如下（注意可以通过点击 Layout Editor 面板底部的\
  \ Text 标签页直接编辑 XML）：\n\n```xml\n<EditText\n    android:id=\"@+id/editText\"\n  \
  \  android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:ems=\"10\"\n    android:inputType=\"text\"\n    android:saveEnabled=\"\
  false\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n做出更改后，运行应用程序，输入文本并旋转设备，以在继续操作之前验证文本不再被保存和恢复。\n\n## 15.3 Bundle\
  \ 类\n\n对于需要在超出用户界面视图组件提供的默认功能之外保存状态的情况，`Bundle` 类提供了一个容器，使用键值对机制存储数据。键的形式为字符串值，而与这些键关联的值可以是原始值的形式，也可以是任何实现了\
  \ `Parcelable` 接口的对象的格式。许多类已经实现了 `Parcelable` 接口。可以通过实现 `Parcelable` 接口中定义的方法来使自定义类变为“可序列化的”，这些细节可以在\
  \ Android 文档中找到：\n\n[`developer.android.com/reference/android/os/Parcelable.html`](https://developer.android.com/reference/android/os/Parcelable.html)\n\
  \n`Bundle` 类还包含一组方法，用于获取和设置各种类型的键值对，包括原始类型（boolean、char、double 和 float）以及对象（如 String\
  \ 和 CharSequence）。\n\n在本示例中，由于已经禁用了 `EditText` 视图的自动保存，我们需要确保用户在 `EditText` 字段中输入的文本被保存到\
  \ `Bundle` 对象中并在随后恢复。这将作为在 Android 应用程序中手动保存和恢复状态的演示，并将分别通过 `Bundle` 类的 `putCharSequence()`\
  \ 和 `getCharSequence()` 方法来实现。\n\n## 15.4 保存状态\n\n扩展 `StateChange` 应用程序的第一步是确保用户输入的文本从\
  \ `MainActivity` activity 的 `onSaveInstanceState()` 方法中的 `EditText` 组件中提取，然后作为键值对保存到\
  \ `Bundle` 对象中。\n\n为了从 `EditText` 对象中提取文本，我们首先需要在用户界面中识别该对象。显然，这涉及到 activity 的 Java\
  \ 代码（包含在 `MainActivity.java` 源码文件中）与用户界面 XML 表示（包含在 `activity_main.xml` 资源文件中）之间的桥接。为了提取输入到\
  \ `EditText` 组件的文本，我们需要访问该用户界面对象。\n\n\n\n\n\n用户界面中的每个组件都关联着一个唯一的标识符。默认情况下，`Layout\
  \ Editor` 工具会根据对象类型为新添加的组件构建 `id`。如果布局中包含多个相同类型的视图，则在类型名称后会跟上一个顺序数字（不过开发者可以也应该将其更改为更具意义的内容）。当选中\
  \ `activity_main.xml` 文件并显示 `Layout Editor` 工具时，通过 Android Studio 主窗口中的 `Component\
  \ Tree`（组件树）面板可以看到`EditText` 组件被分配了 `id` `editText`：\n\n![](img/as_4.1_state_change_component_tree.jpg)\n\
  \n图 15-1\n\n现在我们可以可以通过对象的 `getText()` 方法获取 `editText` 视图包含的文本，该方法反过来会返回当前文本：\n\n\
  ```\nCharSequence userText = binding.editText.getText();\n```\n\n最后，我们可以使用 `Bundle`\
  \ 对象的 `putCharSequence()` 方法保存文本，通过传递键（这可以是任何字符串值，在本例中，我们将其声明为“savedText”）和 `userText`\
  \ 对象作为参数：\n\n```\noutState.putCharSequence(\"savedText\", userText);\n```\n\n将所有这些整合在一起，我们在\
  \ `MainActivity.java` 文件中得到了修改后的 `onSaveInstanceState()` 方法，内容如下：\n\n```java\npackage\
  \ com.ebookfrenzy.statechange;\n\n.\n\n.\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n\n.\n\n...\n\n    protected void onSaveInstanceState(@NonNull Bundle outState)\
  \ {\n        super.onSaveInstanceState(outState);\n        Log.i(TAG, \"onSaveInstanceState\"\
  );\n        CharSequence userText = binding.editText.getText();\n        outState.putCharSequence(\"\
  savedText\", userText);\n    }\n.\n.\n```\n\n既然已经采取了保存状态的步骤，下一阶段就是确保在需要时恢复该状态。\n\
  \n### 15.5 恢复状态\n\n保存的动态状态可以在传递 `Bundle` 对象作为参数的生命周期方法中恢复。这让开发者可以选择使用 `onCreate()`\
  \ 或 `onRestoreInstanceState()`。使用哪种方法取决于 Activity 的性质。在状态最好在 Activity 初始化任务执行后恢复的情况下，`onRestoreInstanceState()`\
  \ 方法通常更合适。为了本例的目的，我们将在 `onRestoreInstanceState()` 方法中添加代码，使用“savedText”键从 `Bundle`\
  \ 中提取保存的状态。然后我们可以使用对象的 `setText()` 方法在 `editText` 组件上显示文本：\n\n```java\n@Override\n\
  protected void onRestoreInstanceState(@NonNull Bundle savedInstanceState) {\n  \
  \  super.onRestoreInstanceState(savedInstanceState);\n    Log.i(TAG, \"onRestoreInstanceState\"\
  );\n    CharSequence userText =\n               savedInstanceState.getCharSequence(\"\
  savedText\");\n    binding.editText.setText(userText);\n}\n```\n\n### 15.6 测试应用程序\n\
  \n剩下的工作只是再次构建并运行 `StateChange` 应用程序。运行并处于前台时，触摸 `EditText` 组件并在旋转设备到另一种方向之前输入一些文本。以前文本的更改将会丢失，但现在得益于我们在本章中为\
  \ Activity 添加的代码，新文本将保留在 `editText` 组件中。\n\n在验证代码按预期运行后，注释掉这两个方法中的 `super.onSaveInstanceState()`\
  \ 和 `super.onRestoreInstanceState()` 调用，重新启动应用，并注意在设备旋转后文本仍然被保留。默认的保存和恢复系统本质上被自定义实现取代了，从而提供了在\
  \ Activity 内部动态且选择性地保存和恢复状态的方法。\n\n## 15.7 总结\n\n在 Android 应用中保存和恢复动态状态只需在相应的生命周期方法中实现适当的代码。对于大多数用户界面视图，这由\
  \ `Activity` 超类自动处理。在其他情况下，这通常包括在 `onSaveInstanceState()` 方法中提取值和设置，并将数据作为键值对保存到运行时系统传递给\
  \ Activity 的 `Bundle` 对象中。\n\n可以在 Activity 的 `onCreate()` 或 `onRestoreInstanceState()`\
  \ 方法中通过从 `Bundle` 对象中提取值并根据存储的值更新 Activity。\n\n在本章中，我们使用了这些技术更新了 `StateChange` 项目，使\
  \ `Activity` 能够在销毁及随后的重建过程中保留更改。\n\n# 16. 理解 Android 视图、视图组和布局\n\n除了听流媒体音频外，用户与\
  \ Android 设备的交互本质上主要是视觉和触觉的。所有这些交互都通过设备上安装的应用程序的用户界面进行，包括内置应用程序和用户安装的任何第三方应用程序。因此，开发\
  \ Android 应用的一个关键要素涉及用户界面的设计和创建，这并不意外。\n\n在本章中，将涵盖 Android 用户界面结构主题，并概述用于组成用户界面的不同元素；即\
  \ `Views`（视图）、`View Groups`（视图组）和 `Layouts`（布局）。\n\n### 16.1 为不同的 Android 设备设计\n\
  \n“Android 设备”一词涵盖了大量具有屏幕尺寸和分辨率的平板和平手机产品。因此，应用程序用户界面现在必须仔细设计，以确保在尽可能广泛的设备上正确显示。这在很大程度上可以通过仔细的规划和使用本章概述的布局管理器来实现。\n\
  \n同样重要的是，大多数基于 Android 的智能手机和平板电脑都可以竖屏或横屏模式持有。设计良好的用户界面应该能够适应这种变化，并进行合理的布局调整以利用可用空间。\n\
  \n### 16.2 视图与视图组\n\n用户界面中的每一项都是 Android `View` 类的子类（准确说是 `android.view.View`）。Android\
  \ SDK 提供了一组预构建视图，用于构建用户界面。典型的示例包括 `Button`、`CheckBox`、`ProgressBar` 和 `TextView`\
  \ 类。此类视图也被称为控件或组件。对于 SDK 无法满足的需求，可以通过子类化扩展现有类来创建新视图，或者直接在 `View` 类之上构建全新的组件。\n\n\
  一个视图也可以由多个其他视图组成（其他称为复合视图）。此类视图是 Android `ViewGroup` 类（`android.view.ViewGroup`）的子类，而该类本身是\
  \ View 的子类。此类视图的一个示例是 `RadioGroup`，旨在包含多个 `RadioButton` 对象，使得在任何时间只有一个处于“开启”状态。从结构上来说，复合视图由单个父视图（派自\
  \ `ViewGroup` 类）及其包含其他视图组成。\n\n除了上一节讨论的控件风格视图外，SDK 还包含了一组被称为布局的视图。布局是容器视图（因此也是 `ViewGroup`\
  \ 的子类），其唯一目的是控制子视图在屏幕上的位置。\n\n\n\n\n\nAndroid SDK 包含了以下布局视图，它们可以用于 Android 用户界面设计中：\n\
  \n- `ConstraintLayout` – 引入自 Android 7，建议在大多数布局需求下使用此布局管理器。`ConstraintLayout` 允许通过为每个子视图分配的简单约束设置，来定义布局中视图的位置和行为。该布局的灵活性使得能够快速、方便地创建复杂的布局，而无需在其他布局类型内部进行层嵌套，从而提高了布局性能。`ConstraintLayout`\
  \ 还紧密集成到 Android Studio 布局编辑器工具中。除非另有说明，它是书中大多数示例的优选布局。\n\n- `LinearLayout` – 根据所选的方向（orientation），将子视图置在单行或单列中。可以在每个子视图上设置权重（weight）值，以指定该子视图相对于其他子视图占据布局空间的比例。\n\
  \n- `TableLayout` – 将子视图排列为行和列的网格格式。表格每行由一个 `TableRow` 对象子项表示，该子项又包含一个每个单元格的视图对象。\n\
  \n- `FrameLayout` – `FrameLayout` 的目的是分配一个屏幕区域，通常用于显示单个视图。如果添加了多个子视图，它们默认会堆叠显示并位于布局区域的左上角。通过为每个子视图设置重力（gravity）值可以实现单个子视图的交替定位。例如，在子视图上设置\
  \ `center_vertical` 重力将使其置于容器 `FrameLayout` 视图的垂直中心。\n\n- `RelativeLayout` – `RelativeLayout`\
  \ 通过通过在子视图上指定对齐方式和边距（margins），允许子视图相对于彼此以及容器布局视图进行定位。例如，可以将子视图 A 配置为位于容器 `RelativeLayout`\
  \ 视图的垂直和水平中心。另一方面，视图 B 也可以配置为在布局视图内水平居中，但位于视图 A 顶部上方 30 像素处，从而使其相对于视图 A 的垂直位置。在设计必须适应各种屏幕尺寸和方向的用户界面时，`RelativeLayout`\
  \ 管理器可能特别有用。\n\n- `AbsoluteLayout` – 允许将子视图置在容器布局视图内特定的 X 和 Y 坐标上。不建议使用这种布局，因为它缺乏响应屏幕尺寸和方向变化的灵活性。\n\
  \n- `GridLayout` – `GridLayout` 实例由不可见线划分，形成一个包含行和列单元格的网格。子视图被放置在单元格中，并可以配置为水平和垂直方向覆盖多个单元格，从而允许快速方便地实现广泛的布局选项。`GridLayout`\
  \ 中组件之间的间隙可以通过在相邻单元格中放入一种名为 `Space` 的特殊类型视图，或通过设置边距（margin）参数来实现。\n\n- `CoordinatorLayout`\
  \ – 作为 Android 5.0 的 Android 设计支持库的一部分引入，`CoordinatorLayout` 专门设计用于协调应用程序屏幕顶部应用栏（app\
  \ bar）与其他视图元素的外观和行为。当使用 Basic Activity 模板创建新活动时，主布局中的父视图将使用 `CoordinatorLayout`\
  \ 实例实现。该布局管理器将从标题为 “使用浮动操作按钮和 Snackbar` 的章节开始进行详细介绍。\n\n在考虑在 Android 应用的用户界面中使用布局时，值得记住，正如下一节将概述的，这些布局可以相互嵌套，以创建几乎任何所需复杂程度的用户界面设计。\n\
  \n## 16.4 视图层次结构 (View Hierarchy)\n\n用户界面中的每个视图都代表显示器上的矩形区域。视图负责在该矩形区域内绘制的内容，并响应发生在屏幕该部分的事件（例如触摸事件）。\n\
  \n用户界面屏幕由一个视图层次结构组成，其中根视图位于树的顶端，子视图位于下方的分支上。容器视图的子视图显示在其父视图之上，并被限制在父视图显示区域的边界内显示。例如，考虑图\
  \ 16-1 所示的用户界面：\n\n![](img/Image2798.jpg)\n\n图 16-1\n\n除了可见的按钮和复选框视图外，用户界面实际上还包含了许多布局视图，它们控制可见视图的定位方式。图\
  \ 16-2 显示了用户界面的另一种视图，这次突出了布局视图与子视图的对应关系：\n\n![](img/Image2808.jpg)\n\n图 16-2\n\n\
  正如之前讨论的，用户界面是以视图层次结构的形式构建的，顶部有一个根视图。既然如此，我们也可以以图 16-3 所示的视图树的形式来视觉化上述用户界面示例：\n\n\
  ![](img/Image2815.jpg)\n\n图 16-3\n\n视图层次结构图可能最清晰地概述了图 16-1 所示的用户界面中各种视图之间的关系。当用户界面显示给用户时，Android\
  \ 运行时会遍历视图层次结构，从根视图开始沿树向下移动，并渲染每个视图。\n\n## 16.5 创建用户界面\n\n在对视图、布局和视图层次结构概念有了更清晰的理解后，接几章将重点介绍创建\
  \ Android 界面的步骤。\n\n## 16.6 总结\n\nAndroid 应用用户界面屏幕中的每个元素都是视图，它们最终继承自 `android.view.View`\
  \ 类。每个视图代表显示器的矩形区域，既负责该矩形内的内容，又处理发生在视图边界内的事件。多个视图可以组合以创建一个单一复合视图。复合视图中的视图是容器视图的子视图，容器视图通常是\
  \ `android.view.ViewGroup` 的子类（而 `ViewGroup` 本身又是 `android.view.View` 的子类）。\n\n\
  Android SDK 提供了一系列预构建视图，用于创建用户界面。这些不仅基础组件（如文本字段和按钮），还包括一系列用于控制子视图定位的布局管理器。如果提供的视图无法满足特定需求，可以创建自定义视图，方法可以是扩展或组合现有视图，或者通过子类\
  \ `android.view.View` 创建一个全新的视图类。\n\n## 17. Android Studio 布局编辑器工具指南\n\n\n\n\n\n\
  很难想象出一个不需要某种形式用户界面的 Android 应用程序概念。大多数 Android 设备都配备了触摸屏和键盘（虚拟或物理），点击和滑动是用户与应用程序之间交互的主要形式。这些交互无不通过应用程序的用户界面进行。\n\
  \n一个设计良好且实现的用户界面是创建一个成功且流行的 Android 应用程序的重要因素，根据单个应用程序的设计需求，其复杂程度可以从简单到极其复杂。无论复杂度如何，Android\
  \ Studio 布局编辑器工具都显著简化了设计和实现 Android 用户界面的任务。\n\n## 17.1 基础 Activity vs. 空 Activity\
  \ 模板\n\n正如“Android 应用程序结构”（#App_Anatomy.xhtml__idTextAnchor249)章节概述的，Android 应用程序由一个或多个活动（activity）组成。Activity\
  \ 是应用程序功能的一个独立模块，通常直接对应于单个用户界面屏幕。因此，当使用 Android Studio 布局编辑器时，我们始终是在处理某个 Activity\
  \ 的布局。\n\n在创建新的 Android Studio 项目时，有许多不同的模板可以作为主 Activity 用户界面的起点。这些模板中最基础的是 Basic\
  \ Activity（基础 Activity）模板和 Empty Activity（空 Activity）模板。尽管它们乍看之下似乎相似，但这两个选项之间实际上存在显著差异。要在布局编辑器中查看这些差异，可以使用\
  \ View Options（视图选项）菜单启用 Show System UI（显示系统 UI），如下方的[图 17-1\n图 17-1\n\nEmpty Activity\
  \ 模板创建一个单一布局文件，由一个 `ConstraintLayout` 实例实例组成，其中包含一个 `TextView` 对象，如下方的图 17-2\n图\
  \ 17-2\n\n另一方面，Basic Activity 由多个布局文件组成。顶层布局文件具有一个 `CoordinatorLayout` 作为根视图、一个可配置的标题栏（也称为操作栏），它出现在设备屏幕顶部（在图\
  \ 17-3\n图 17-3\n\nBasic Activity 包含两个屏幕的布局，都包含一个按钮和一个文本。此模板的目的是演示如何在应用内部实现多个屏幕之间的导航。如果运行使用\
  \ Basic Activity 模板的未修改的应用程序，将显示这两个屏幕中的第一个（在图 17-4 中标记为 A）。按下 Next（下一步）按钮将导航到第二个屏幕\
  \ (B)，该屏幕反过来又包含一个返回到第一个屏幕的按钮：\n\n![](img/as_4.1_layout_editor_basic_navigation.jpg)\n\
  图 17-4\n\n此应用程序行为使用了两个称为片段（fragments）和导航（navigation）的 Android 特性，这两个都将分别从[“Android\
  \ 片片简介”（#Fragments.xhtml__idTextAnchor675)章节和[“导航架构组件概述”（#Navigation_Overview.xhtml__idTextAnchor806)章节开始介绍。\n\
  \n`content_main.xml` 文件包含一个名为导航主机片段（Navigation Host Fragment）的特殊片段，它允许根据 `res ->\
  \ layout -> nav_graph.xml` 文件中配置的设置在视图中切换内容。在 Basic Activity 模板的情况下，`nav_graph.xml`\
  \ 文件被配置为 `fragment_first.xml` 和 `fragment_second.xml` 文件中定义的用户界面布局之间切换。\n\n显然，如果你既不需要浮动按钮也不需要菜单，Empty\
  \ Activity 模板是有用的。然而，Basic Activity 用在于它默认提供了这些元素。由于本书中的并非所有示例都需要 Basic Activity\
  \ 的功能，本章的大多数示例将使用 Empty Activity 模板。\n\n为了以后以后参考，如果你需要菜单但不需要操作按钮，请使用 Basic Activity\
  \ 并按照以下步骤删除操作按钮：\n\n1. 双击位于 Project 工具窗口中 `app -> res -> layout` 下的 `activity_main.xml`\
  \ 布局文件，将其加载到布局编辑器中。\n2. 布局加载到布局编辑器后，选择操作按钮并按下键盘上的 delete 键将其从布局中删除。\n3. 找到并编辑 Activity\
  \ 的 Java 代码（位于 `app -> java -> <package name> -> <activity name>`），并如下从 `onCreate`\
  \ 方法中删除操作按钮代码：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \    setContentView(binding.getRoot());\n    NavController navController = Navigation.findNavController(this,\
  \ R.id.nav_host_fragment_content);\n    appBarConfiguration = new AppBarConfiguration.Builder(navController.getGraph()).build();\n\
  \    NavigationUI.setupActionBarWithNavController(this, navController, appBarConfiguration);\n\
  \    binding.fab.setOnClickListener(new View.OnClickListener() {\n        @Override\n\
  \        public void onClick(View view) {\n            Snackbar.make(view, \"Replace\
  \ with own action\", Snackbar.LENGTH_LONG)\n                .setAction(\"Action\"\
  , null).show();\n        }\n    });\n}\n```\n\n如果你需要操作按钮但不需要菜单，请使用 Basic Activity\
  \ 并按照以下步骤操作：\n\n1. 编辑 Activity 类文件并删除 `onCreateOptionsMenu` 和 `onOptionsItemSelected`\
  \ 方法。\n2. 选择 Project 工具窗口中的 `res -> menu` 项并按下键盘 Delete 键从项目中删除文件夹和相应的菜单资源文件。\n\n\
  如果你需要 Basic Activity 模板但既不需要导航功能也不需要第二个内容片段，请按照以下步骤操作：\n\n1. 在 Project 工具窗口中导航并双击\
  \ `app -> res -> navigation -> nav_graph.xml` 文件，将其加载到导航编辑器。\n2. 在编辑器中，选择图面板中的 `SecondFragment`\
  \ 并按下键盘 delete 键将其从图中删除。\n3. 找到并删除 `SecondFragment.java` (`app -> java -> <package\
  \ name> -> SecondFragment`) 和 `fragment_second.xml` (`app -> res -> layout -> fragment_second.xml`)\
  \ 文件。\n\n\n\n\n\n# 4. 最后一个任务是从 `FirstFragment` 类中移除一些代码，以便 `Button` 视图在点击时不再导航到已不存在的第二个片段。找到\
  \ `FirstFragment.java` 文件，双击它将其加载到编辑器，并移除 `onViewCreated()` 方法中的代码，使其内容如下：\n\n```java\n\
  public void onViewCreated(@NonNull View view, Bundle savedInstanceState) {\n   \
  \ super.onViewCreated(view, savedInstanceState);\n    binding.buttonFirst.setOnClickListener(new\
  \ View.OnClickListener() {\n        @Override\n        public void onClick(View\
  \ view) {\n            NavHostFragment.findNavController(FirstFragment.this)\n \
  \                   .navigate(R.id.action_FirstFragment_to_SecondFragment);\n  \
  \      }\n    });\n}\n```\n\n## 17.2 Android Studio 布局编辑器\n\n正如前面的章节所演示的，布局编辑器工具提供了一个“所见即所得”（WYSIWYG）环境，在该环境中可以从调色板中选择视图，然后将其放置在代表\
  \ Android 设备显示的画布上。一旦视图被放置在画布上，就可以对其进行移动、删除和调整大小（受父视图约束的限制）。此外，可以使用属性（Attributes）工具窗口修改与所选视图相关的属性。\n\
  \n在底层，布局编辑器工具实际上构建了一个包含正在设计的用户界面定义的 XML 资源文件。因此，布局编辑器工具以三种不同的模式运行，称为设计（Design）、代码（Code）和拆（Split）模式。\n\
  \n## 17.3 设计模式\n\n在设计模式下，用户可以通过操作视图调色板和布局的图形化表示来可视化地操作用户界面。图 17-5 显示了 Android Studio\
  \ 布局编辑器工具在设计模式下的关键区域：\n\n![](img/as_4.2_layout_editor_labelled.jpg)\n\n图 17-5\n\n\
  *   **A – 调色板 (Palette)** – 调色板提供了 Android SDK 提供的系列视图组件的访问。这些组件被分类分组以便于导航。可以通过从调色板中拖拽视图组件并将其掉到布局上所需的位置来向布局中添加项。\n\
  *   **B – 设备屏幕 (Device Screen)** – 设备屏幕提供了设计中用户界面布局的视觉化“所见即所得”表示。该布局允许对设计进行直接操作，允许选择、删除、移动和调整视图的大小。可以使用工具栏上的菜单随时更改布局所表示的设备模型。\n\
  *   **C – 组件树 (Component Tree)** – 正如上一节（“理解 Android 视图、视图组和布局”）所述，用户界面是用层级结构构建的。组件树提供了用户界面设计结构的视觉概览。从组件树中选择元素将导致布局中相应的视图被选中。同样，从设备屏幕布局中选择视图将选中组件树层次中的该视图。\n\
  *   **D – 属性 (Attributes)** – 调色板中列出的所有组件视图都有一组关联属性，可以使用这些属性调整视图的行为和外观。布局编辑器的属性面板提供了布局中当前选中视图属性的访问，允许进行更改。\n\
  *   **E – 工具栏 (Toolbar)** – 布局编辑器工具栏提供了多种选项的快速访问，包括但不限于：放大和缩小设备屏幕布局、更改当前显示的设备模型、在手机竖屏和横屏之间旋转布局，以及切换到不同的\
  \ Android SDK API 级别。工具栏还有一组上下文敏感按钮，当在设备屏幕布局选中相关的视图类型时，这些按钮将会。\n*   **F – 模式切换控制\
  \ (Mode Switching Controls)** – 这三个按钮提供了在布局编辑器工具的设计、代码和拆模式之间来切换的方法。\n*   **G - 缩放和平移控制\
  \ (Zoom and Pan Controls)** - 此控制面板允许你对设计画布进行放大和缩小，并抓取画布进行移动以寻找放大时被遮挡的区域。\n\n##\
  \ 17.4 调色板\n\n布局编辑器调色板组织为两个面板，旨在方便查找和预览要添加到布局设计中的视图组件。类别面板（在图 17-6 中标记为 A）列出了 Android\
  \ SDK 支持的不同视图组件类别。当从列表中选择一个类别时，第二个面板 (B) 将更新并显示该类下的组件列表：\n\n![](img/as_4.1_layout_editor_palette.jpg)\n\
  \n图 17-6\n\n要从调色板将组件添加到布局画布上，只需从组件列表或预览面板中选择该项，将其拖动到画布上的所需位置并放到位即可。\n\n可以通过点击调色板工具栏中的搜索按钮（在图\
  \ 17-6 上方标记为 C）并输入组件名称，在当前选择的类别内启动特定组件的搜索。随着字符的输入，匹配的结果将实时出现在组件列表面板中。如果你不确定组件所在的哪个类别，只需在搜索操作之前或期间选择“全部”（All）类别即可。\n\
  \n## 17.5 设计模式和布局视图\n\n默认情况下，布局编辑器将以设计模式出现，如上方的图 17-5 所示。此模式提供了用户界面的视觉表示。通过点击图 17-7\
  \ 所示的模式切换控件，可以随时选择设计模式：\n\n![](img/as_4.2_layout_editor_labelled.jpg)\n\n图 17-7\n\
  \n当布局编辑器处于设计模式时，可以通过两种方式查看布局。上方图 17-5 所示的视图是设计视图，显示了在运行应用程序中的布局和控件。另一种被称为蓝图（Blueprint）的模式可以替代设计视图显示，也可以与之同时显示。图\
  \ 17-8 所示的工具栏菜单提供了显示设计、蓝图或两种视图的选项。还有针对色盲的设置。\n\n![](img/as_blueprint_menu.jpg)\n\
  \n图 17-8\n\n显示布局视图、设计视图或两者取决于个人喜好。一种很好的方法是从开始同时显示两者，如图 17-9 所示：\n\n![](img/as_3.5_show_layout_design_and_blueprint.jpg)\n\
  \n图 17-9\n\n## 17.6 夜间模式\n\n要在设计中使用夜间模式查看布局，请选择下方图 17-10 所示的菜单并将设置更改“夜间”（Night）：\n\
  \n![](img/as_4.2_layout_editor_labelled.jpg)\n\n图 17-10\n\n## 17.7 代码模式\n\n在使用 Android\
  \ Studio 布局编辑器工具时，重要的是记住它实际上只是为创建 XML 布局资源文件提供了一种更易用户的方法。在设计过程的任何时候，只需点击布局编辑器工具面板右上角的“代码”（Code）按钮，如图\
  \ 17-11 所示，即可查看并直接编辑底层 XML。\n\n![](img/as_4.0_layout_editor_code_button.jpg)\n\n\
  图 17-11\n\n\n\n\n\n# 布局编辑器\n\n图 17-12 显示了代码模式下的 Android Studio 布局编辑器工具，允许通过修改 XML\
  \ 来更改用户界面声明：\n\n```![](img/as_3.6_layout_editor_code_mode.jpg)\n```\n\n图 17-12\n\
  \n## 17.8 分屏模式\n\n在分屏模式下，编辑器并排显示 `Design`（设计）视图和 `Code`（代码）视图，允许用户通过设计画布进行视觉化修改，也可以通过直接修改\
  \ XML 声明来用户界面。要进入分屏模式，请点击下方图 17-13 所示的中间按钮：\n\n```![](img/as_4.1_layout_split_button.jpg)\n\
  ```\n\n图 17-13\n\n对 XML 的任何更改都会自动反映在设计画布上，反之亦然。图 17-14 显示了分屏模式下的编辑器：\n\n```![](img/as_4.1_layout_split_mode.jpg)\n\
  ```\n\n图 17-14\n\n## 17.9 设置属性\n\n属性面板提供了当前所选组件的所有可用设置。例如，图 17-15 显示了 `TextView`\
  \ 控件的属性：\n\n```![](img/as_4.1_layout_attributes.jpg)\n```\n\n图 17-15\n\n属性工具窗口分为以下不同部分：\n\
  \n*   `id`：包含 `id` 属性，定义了在 App 源代码中引用当前所选对象的名称。\n*   `Declared Attributes`（已声明属性）：包含所有已赋值的属性。\n\
  *   `Layout`（布局）：定义当前所选视图对象相对于屏幕和其他布局中其他对象的定位和大小的设置。\n*   `Transforms`（变换）：包含允许当前所选对象进行旋转、缩放和偏移的控件。\n\
  *   `Common Attributes`（常用属性）：当前所选视图对象类通常需要更改的属性列表。\n*   `All Attributes`（所有属性）：当前所选对象所有可用属性的完整列表。\n\
  \n可以通过选择属性工具窗口工具栏中的搜索按钮并输入属性名称来对特定属性进行搜索。\n\n某些属性的值字段右侧有一个窄按钮。这表示可以使用资源对话框（Resources\
  \ dialog）来协助选择合适的属性值。要显示对话框，只需点击该按钮。该按钮的外观发生变化，反映相应的属性值是存储在资源文件中还是硬编码的。如果值存储在资源文件中，`text`\
  \ 属性字段右侧的按钮将填充，表示该值不是硬编码，如下方的图 17-16 所示：\n\n```![](img/as_3.4_resource_extracted.jpg)\n\
  ```\n\n图 17-16\n\n对于具有有限有效选项的属性，将显示一个下拉菜单（图 17-17），可以从中进行选择。\n\n```![](img/as_4.0_type_face_menu.jpg)\n\
  ```\n\n图 17-17\n\n可以点击滴管图标（如上方图 17-16 中 `backgroundTint` 字段所示）来显示颜色选择面板。同样，当此位置出现标志图标时，点击它可以显示属性的选项列表，而图像图标会打开资源管理器面板，允许为属性选择图像和其他资源类型。\n\
  \n## 17.10 变换\n\n属性工具窗口中的变换面板（图 17-18）提供了一组控件和属性，用于旋转、透明度（用于视图的淡入淡出）、缩放（大小）和平移（与当前位置的偏移）方面控制当前所选对象的视觉方面：\n\
  \n```![](img/as_4.1_layout_editor_transforms.jpg)\n```\n\n图 17-18\n\n面板包含视图的视觉表示，会随属性的更改而更新。这些更改也会反映在布局画布内的视图上。\n\
  \n## 17.11 工具可见性切换\n\n在代码模式下查看 Android Studio XML 布局文件的内容时，你会发现许多定义视图外观和行为的属性以 `android:`\
  \ 前缀开头。这表示属性设置在 `android` 命名空间内，并会在 App 运行时生效。例如，以下布局文件的摘录在 `Button` 视图上设置了多种属性：\n\
  \n```xml\n<Button\n    android:id=\"@+id/button\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"\n    android:text=\"Button\"\n```\n\
  \n除了 `android` 命名空间外，Android Studio 还提供了一个 `tools` 命名空间。当在此命名空间内设置属性时，它们仅在布局编辑器预览中生效。在设计布局时，例如，你可能会发现让\
  \ `EditText` 视图显示某些文本很有帮助，但在 App 运行时需要该视图为空。为了实现这一点，你可以使用 `tools` 命名空间如下设置视图属性：\n\
  \n```xml\n<EditText\n    android:id=\"@+id/editTextName\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:ems=\"10\"\
  \n    android:inputType=\"text\"\n    tools:text=\"Sample Text\"\n```\n\n这种类型的属性通过属性窗口中带有扳手图标的字段设置，如下方的图\
  \ 17-19 所示：\n\n```![](img/as_4.1_text_tools.jpg)\n```\n\n图 17-19\n\n工具属性对于设计过程中更改视图的可见性非常有用。布局可能包含一个在\
  \ App 运行时根据用户操作显示或隐藏的视图。为了隐藏视图，可以使用工具属性：\n\n```xml\ntools:visibility=\"invisible\"\
  \n```\n\n使用 `invisible` 设置时，虽然视图不再可见，但它仍然存在于布局中并占据可见时的空间。要让布局表现得视图不存在，应将可见性属性设置为\
  \ `gone`：\n\n```xml\ntools:visibility=\"gone\"\n```\n\n在上述示例中，可见性设置仅适用于布局编辑器，在运行\
  \ App 时没有效果。要在布局编辑器和运行 App 中控制可见性，将使用 `android` 命名空间设置相同的属性：\n\n```xml\nandroid:visibility=\"\
  gone\"\n```\n\n虽然这些可见性工具属性很有用，但手动编辑 XML 布局文件是一个麻烦的过程。为了方便更改这些设置，Android Studio 在布局编辑器的组件树面板中提供了一组切换。要访问这些控件，点击面板中对应视图右侧的边距。例如，图\
  \ 17-20 显示了名为 `myButton` 的 `Button` 视图的工具可见性切换：\n\n```![](img/as_4.2_layout_tools_visibility.jpg)\n\
  ```\n\n图 17-20\n\n这些切换控制 `android` 和 `tools` 命名空间对应视图的可见性，并提供 `not set`（未设置）、`visible`（可见）、`invisible`（隐藏）和\
  \ `gone`选项。当设置冲突属性时（例如 `android` 命名空间切换设置为 `visible` 而 `tools` 值设置为 `invisible`），`tools`\
  \ 命名空间在预览中具有优先级。当做出切换选择时，Android Studio 会向布局文件中的 XML 视图元素添加相应的属性。\n\n除了组件树面板中的可见性切换，布局编辑器还包含了工具可见性和位置切换按钮，如下图\
  \ 17-21](#Layout_Editor.xhtml__idTextAnchor385)中高亮所示：\n\n```![](img/as_4.1_layout_editor_tools_toggle.jpg)\n\
  ```\n\n图 17-21\n\n\n\n\n\n此按钮用于切换当前工具的可见性设置。例如，如果上方显示的 `Button` 视图当前的工具可见性属性被设置为\
  \ `gone`，则切换此按钮将使其可见。这使得在视图添加到布局或从布局中移除时，能够快速检查布局行为。此切换功能也有助于检查布局中的视图是否正确设置了约束，该主题将在名为在\
  \ Android Studio 中使用 ConstraintLayout 指南的章节中介绍。\n\n## 17.12 转换视图\n\n在布局中将视图从一种类型转换为另一种类型（例如将\
  \ `TextView` 转换为 `EditText`），可以在 Android Studio 布局编辑器中轻松完成。只需在屏幕布局内或 `Component\
  \ tree`（组件树）窗口中对视图点击鼠标右键，并选择 `Convert view...`（转换视图...）菜单选项即可（图 17-22）：\n\n![](img/as_layout_convert_view.jpg)\n\
  \n图 17-22\n\n选中后，将弹出一个对话框，其中包含所选对象可以转换的兼容视图类型列表。例如，图 17-23 显示了现有 `TextView` 视图可以转换的类型：\n\
  \n![](img/as_3.2_convert_layout_textview.jpg)\n\n图 17-23\n\n这种技术也适用于将布局从一种类型转换为另一种类型（例如将\
  \ `ConstraintLayout` 转换为 `LinearLayout`）。\n\n## 17.13 显示示例数据\n\n在 Android Studio\
  \ 中设计布局时，会出现这样一种情况：用户界面中显示的内容在应用完成并运行之前是不可用的。这有时会导致很难从布局编辑器内部评估布局在应用运行时的外观。为了解决这个问题，布局编辑器允许指定示例数据，用示例图像和数据填充布局编辑器中的视图。这些示例数据仅显示在布局编辑器中，在应用运行时不会显示。可以通过直接编辑布局的\
  \ `XML` 或通过使用设计时助手进行可视化操作（通过在设计区域的小部件上点击右键并选择 `Set Sample Data`（设置示例数据）菜单选项）来配置示例数据。设计时助手面板将为所选视图项显示一组预配置的示例数据选项，包括各种配置下的文本和图像组合。例如，图\
  \ 17-24 显示了选择在 `RecyclerView` 列表中显示示例数据时显示的示例选项：\n\n![](img/as_3.4_sample_data_menu.jpg)\n\
  \n图 17-24\n\n或者，也可以在布局设计过程中提供自定义文本和图像进行显示。在布局编辑器中使用示例数据的示例包含在后续名为“布局编辑器示例数据教程的章节中。由于示例数据是实现为\
  \ `tools` 属性的，可以使用上方图 17-21 中突出显示的切换按钮来控制预览中数据的可见性。\n\n## 17.14 创建自定义设备定义\n\n布局编辑器工具栏中的设备菜单（图\
  \ 17-25）提供了预配置的设备类型列表，选中后，这些类型将作为设备屏幕画布出现。除了预配置的设备类型外，任何在 Android Studio 环境中以前配置过的\
  \ `AVD` 实例也会列在菜单中。要添加设备配置，显示设备菜单，选择 `Add Device Definition`（添加设备定义）选项，并按照在 Android\
  \ Studio 中创建 Android 虚拟设备 (AVD)章节中概述的步骤进行。\n\n![](img/as_3.6_layout_device.jpg)\n\
  \n图 17-25\n\n## 17.15 更改当前设备\n\n作为设备选择的替代，可以通过从设备菜单选择 `Custom`（自定义）选项，点击位于右下角的调整柄来更改当前设备格式。随着屏幕调整大小，将出现标记指示各种可用尺寸和方向：\n\
  \n![](img/as_3.5_layout_resize.jpg)\n\n图 17-26\n\n## 17.16 布局验证\n\n布局验证（也称为多重预览）选项允许在系列屏幕上同时预览用户界面布局。要访问多重预览，点击如图\
  \ 17-27 所示位于 Android Studio 主窗口右上角的标签页：\n\n![](img/as_4.0_validation_tab.jpg)\n\n\
  图 17-27\n\n加载后，面板将如图 17-28 所示所示，其中在多个设备配置上渲染了布局：\n\n![](img/as_layout_validation.jpg)\n\
  \n图 17-28\n\n## 17.17 总结\n\n开发 Android 应用的关键部分之一是创建用户界面。在 Android Studio 环境中，这是使用布局编辑器工具完成的，该工具以三种模式运行。在\
  \ `Design`（设计）模式下，从调色板中选择视图组件并放置在代表 Android 设备的布局上，并使用属性列表进行配置。在 `Code`（代码）模式下，可以直接编辑代表用户界面的底层\
  \ `XML`。另一方面，`Split`（拆）模式允许通过可视化和直接编辑 XML 来创建和修改布局。布局验证面板允许在多个屏幕上快速预览用户界面布局。\n\n\
  # 18 ConstraintLayout 使用指南\n\n正如在理解视图、视图组和布局章节中所述的，Android 提供了多种布局管理器用于设计用户界面。从\
  \ Android 7 开始，Google 引入了一种布局，旨在解决旧布局器的许多缺点。这种名为 `ConstraintLayout` 的新布局将简单、灵活且灵活的布局系统与\
  \ Android Studio 布局编辑器中强大的功能相结合，以便创建能够适应不同屏幕尺寸和方向变化的响应式用户界面布局。\n\n本章将概述 `ConstraintLayout`\
  \ 的基本概念，下一章将详细概述如何在 Android Studio 布局编辑器中使用 `ConstraintLayout` 创建基于约束的布局。\n\n##\
  \ 18.1 ConstraintLayout 如何工作\n\n与其他布局一样，`ConstraintLayout` 负责管理它包含的视觉组件（也称为小部件）的定位和尺寸行为。它是根据每个子小部件设置的约束连接来实现的。\n\
  \n为了充分理解并使用 `ConstraintLayout`，理解以下关键概念是非常重要的：\n\n• 约束 (Constraints)\n• 边距 (Margins)\n\
  • 对抗约束 (Opposing Constraints)\n• 约束偏置 (Constraint Bias)\n• 链 (Chains)\n• 链样式 (Chain\
  \ Styles)\n• 导线 (Guidelines)\n• 组 (Groups)\n• 屏障 (Barriers)\n• 流 (Flow)\n\n\n\n\n\
  \n约束（Constraints）本质上是一组规则，规定了组件（widget）与其他组件、容器 `ConstraintLayout` 的边界以及称为辅助线（guidelines）的特殊元素的对齐和距离方式。约束还决定了\
  \ activity 的界面布局如何响应设备方向的变化，或者在不同屏幕尺寸的设备上显示时的响应。为了充分配置，组件必须具有足够的约束连接，以便 `ConstraintLayout`\
  \ 布局引擎能够在水平和垂直平面上都解析其位置。\n\n## 18.1.2 边距 (Margins)\n\n边距（margin）是约束的一种形式，指定了固定距离。考虑一个需要放置在设备屏幕右上角的\
  \ `Button` 对象。这可以通过实现 `Button` 顶部和右侧边缘的边距约束，并将其连接到父级 `ConstraintLayout` 相应的边来实现，如图\
  \ 18-1 所示：\n\n![](img/Image2437.jpg)\n\n图 18-1\n\n如上图所示，每个约束连接都关联着一个边距值，该值规定了组件距离父级布局两边的固定距离。在这种配置下，无论屏幕尺寸或设备方向如何，`Button`\
  \ 对象将始终根据两个约束连接的指定，分别距离父级 `ConstraintLayout` 的顶部和右侧边缘 20 和 15 设备无关像素 (dp)。\n\n虽然上述配置在某些情况下是可以接受的，但它在允许\
  \ `ConstraintLayout` 布局引擎调整组件位置以响应设备旋转以及支持不同尺寸屏幕方面没有提供灵活性。要在布局中添加这种响应性，必须实现对向约束（opposing\
  \ constraints）。\n\n## 18.1.3 对向约束 (Opposing Constraints)\n\n在单个组件上沿同一轴运行的两个约束被称为对向约束。换句话说，在左侧和右侧都有约束的组件被认为具有水平对向约束。例如，图\
  \ 18-2 展示了在之前的布局中同时添加水平和垂直对向约束：\n\n![](img/Image24461.jpg)\n\n图 18-2\n\n这里需要理解的关键点是，一旦在特定轴上实现了对向约束，组件的定位将变为基于百分比而不是基于坐标。例如，组件不再固定在布局顶部的\
  \ 20dp 处，而是位于布局顶部 30% 的位置。在不同的方向以及在更大或更小的屏幕上运行时，`Button` 始终相对于父级布局的处于相同的位置。\n\n\
  现在需要理解的是，图 18-2 中概述的布局不仅使用了对向约束，还通过应用了约束偏置（constraint bias）。\n\n## 18.1.4 约束偏置 (Constraint\
  \ Bias)\n\n现在已经确定，`ConstraintLayout` 中的组件可能会受到对向约束连接的影响。默认情况下，对向约束是相等的，导致相应的组件在对向轴上居中。例如，图\
  \ 18-3 展示了一个使用对向水平和垂直约束在包含它的 `ConstraintLayout` 中居中的组件：\n\n![](img/Image2453.jpg)\n\
  \n图 18-3\n\n为了在存在对向约束的情况下允许调整组件的调整，`ConstraintLayout` 实现了一种名为约束偏置的功能。约束偏置允许组件沿对向轴的定位根据指定的百分比向某一个约束偏移。例如，图\
  \ 18-4 显示了之前的约束布局，其具有 75% 的水平偏置和 10% 的垂直偏置：\n\n![](img/Image24461.jpg)\n\n图 18-4\n\
  \n下一章标题为“Android Studio 中使用 ConstraintLayout 指南”，将更详细地涵盖这些概念，并解释这些功能是如何集成到 Android\
  \ Studio 布局编辑器工具中的。然而，在此还需要涵盖 `ConstraintLayout` 类的其他几个领域。\n\n## 18.1.5 链 (Chains)\n\
  \n`ConstraintLayout` 链（chains）提供了一种方法，可以将两个或多个组件的布局行为定义为一个组。链可以在垂直或水平轴上声明，并配置为定义链中组件的间距和大小。\n\
  \n当组件通过双向约束连接在一起时，它们就成了链。例如，图 18-5 展示了三个以此方式链接的组件：\n\n![](img/Image24681.jpg)\n\n\
  图 18-5\n\n链中的第一个元素是链头（chain head），它在垂直链中对应顶部组件，或者在水平链中对应最左侧的组件。整个链的布局行为主要通过在链头组件设置属性来配置。\n\
  \n## 18.1.6 链样式 (Chain Styles)\n\n`ConstraintLayout` 链的布局行为由应用于链头组件的链样式决定。`ConstraintLayout`\
  \ 类目前支持以下链布局样式：\n\n- **散开链 (Spread Chain)** – 链中包含的组件均匀分布在可用空间内。这是链的默认行为。\n\n![](img/Image24781.jpg)\n\
  \n图 18-6\n\n- **内部分开链 (Spread Inside Chain)** – 链中包含的组件在链头和链的最后一个组件之间均匀分布。头部和最后一个组件不包含在间距内。\n\
  \n![](img/Image2485.jpg)\n\n图 18-7\n\n- **权重链 (Weighted Chain)** – 允许通过权重属性定义链中每个组件占据的空间。\n\
  \n![](img/Image2492.jpg)\n\n图 18-8\n\n- **紧凑链 (Packed Chain)** – 构成链的组件无间隙聚集。可以应用偏置来控制链相对于容器的水平或垂直位置。\n\
  \n![](img/Image2500.jpg)\n\n图 18-9\n\n## 18.2 基线对齐 (Baseline Alignment)\n\n到目前，本章仅提到了相对于组件侧边的对齐约束（通常称为侧约束）。然而，一种常见的需求是组件相对于其显示的内容进行对齐，而不是相对于组件本身。为了满足这一需求，`ConstraintLayout`\
  \ 基线对齐的支持。\n\n例如，假设之前的布局图 18-1 需要一个 `TextView` 组件位于 `Button` 左侧 40dp 处。在这种情况下，`TextView`\
  \ 需要与 `Button` 基线对齐。这意味着 `Button` 中的文本需要与 `TextView` 中的文本垂直对齐。该布局的额外约束需要如图 18-10\
  \ 所示进行连接：\n\n![](img/Image2508.jpg)\n\n图 18-10\n\n现在 `TextView` 垂直上相对于 `Button`\
  \ 的基线，并在水平上距离 `Button` 对象的左边缘 40dp。\n\n## 18.3 配置组件维度\n\n控制组件的尺寸是用户界面设计过程中的关键元素。`ConstraintLayout`\
  \ 提供了三个选项，可以设置在单个组件上以管理尺寸行为。这些设置是单独为高度和宽度维度进行配置的：\n\n- **固定 (Fixed)** – 组件固定为指定的尺寸。\n\
  \n\n\n\n\n- `Match Constraint` – 允许布局引擎调整组件的大小，以满足当前的约束条件。也称为 `AnySize` 或 `MATCH_CONSTRAINT`\
  \ 选项。\n- `Wrap Content` – 组件的大小由其包含的内容（即文本或图形）决定。\n\n## 18.4 Guideline Helper（指南线助手）\n\
  \n指南线（Guidelines）是 `ConstraintLayout` 中可用的特殊元素，它们为约束连接提供了一个额外的目标。在一个 `ConstraintLayout`\
  \ 实例中可以添加多个指南线，这些指南线可以被配置为水平或垂直方向。一旦添加，就可以建立从布局中的组件到指南线的约束连接。这在多个组件需要沿某一轴对齐时特别有用。例如，在图\
  \ 18-11\n\n图 18-11\n\n## 18.5 Group Helper（分组助手）\n\n`ConstraintLayout` 的此功能允许将组件放置在逻辑组中，并作为一个单一实体来控制这些组件的可见性。`Group`\
  \ 本质上是布局中其他组件的引用列表。一旦定义，更改组实例的可见性属性（`visible`、`invisible` 或 `gone`）将该更改应用到所有组成员。这使得通过更改单个属性即可轻松隐藏和显示多个组件。单个布局可以包含多个组，一个组件也可以属于多个组。如果组之间发生冲突，则\
  \ XML 文件中最后声明的组具有优先级。\n\n## 18.6 Barrier Helper（屏障助手）\n\n与指南线类似，屏障（barriers）是用于约束布局内视图的虚拟视图。与指南线一样，屏障可以是垂直或水平的，并且一个或多个视图可以被约束在它上（为了避免混淆，这些视图被称为受约束视图）。然而，与指南线在布局中保持固定位置不同，屏障的位置是由一组所谓的“参考视图”（reference\
  \ views）定义的。引入屏障是为了解决经常发生的视图重叠问题。例如，考虑下方图 18-12 所示的布局：\n\n![](img/Image2526.jpg)\n\
  \n图 18-12\n\n上述布局需要注意的关键点是 `View 3` 的宽度设置为匹配约束模式，且该视图的左边缘连接到 `View 1` 的右边缘。按照目前的实现方式，增加\
  \ `View 1` 的宽度将产生预期效果，即缩小 `View 3` 的宽度：\n\n![](img/Image25331.jpg)\n\n图 18-13\n\n\
  但是，如果增加的是 `View 2` 的宽度而不是 `View 1`就会出现问题：\n\n![](img/Image25401.jpg)\n\n图 18-14\n\
  \n显然，因为 `View 3` 仅受 `View 1` 制，它不会为了适应 `View 2` 宽度的增加而调整大小，导致视图重叠。\n\n解决此问题的办法是添加垂直屏障，并将\
  \ `Views 1` 和 `View 2` 分为屏障的参考视图，以便它们控制屏障的位置。`View 3` 的左边缘将相对于屏障进行约束，使其成为受约束视图。\n\
  \n现在，当 `View 1` 或 `View 2` 的任一宽度增加时，屏障将移动以适应两个视图中最宽的那一个，导致 `View 3` 的宽度相对于新的屏障位置发生变化：\n\
  \n![](img/Image2548.jpg)\n\n图 18-15\n\n在使用屏障工作时，与单个屏障关联的参考视图和受约束视图的数量没有限制。\n\n##\
  \ 18.7 Flow Helper（流布局助手）\n\n`ConstraintLayout Flow` 助手允许视图组以流式网格布局样式显示。与 `Group`\
  \ 助手一样，`Flow` 包含了对其负责定位的视图的引用，并提供了多种配置选项，包括垂直和水平方向、换行行为（包括换行前的最大组件数量）、间距和对齐属性。`Flow`\
  \ 布局还可以应用链（Chain）行为，包括分布（spread）、内部分布（spread inside）和紧凑（packed）选项。\n\n图 18-16 表示使用\
  \ `Flow` 助手实例在水平模式且无换行设置下的五个等大小按钮的布局：\n\n![](img/as_4.1_flow_no_wrap.jpg)\n\n图 18-16\n\
  \n图 18-17 显示了相同的按钮在水平流配置中的情况，设置为每第三个组件后换行：\n\n![](img/as_4.1_flow_with_wrap.jpg)\n\
  \n图 18-17\n\n另一方面，图 18-18 显示了将换行设置为使用内部分布链模式的按钮（其效果仅在第二行可见，因为第一行是满的）。该配置还设置了 `gap`\
  \ 属性以在按钮之间添加间距：\n\n![](img/as_4.1_flow_chain_spread_inside.jpg)\n\n图 18-18\n\n作为\
  \ `Flow` 助手灵活性的最终演示，图 18-19 显示了五个不同大小的按钮，配置为水平紧凑链模式，并在每三个组件后换行。此外，通过设置 `horizontal-bias`\
  \ 值为 `1.0` 使网格内容右对齐（值为 `0.5` 则将网格内容居中）：\n\n![](img/as_4.1_flow_right_align.jpg)\n\
  \n图 18-19\n\n## 18.8 Ratios（比例）\n\n可以使用比例设置定义组件的尺寸。例如，可以使用比例设置约束组件，使得无论如何缩放，其宽度都是高度的两倍。\n\
  \n## 18.9 ConstraintLayout Advantages（约束布局的优势）\n\n`ConstraintLayout` 提供的灵活性使得单个布局实例即可实现许多旧布局的功能。通过允许设计所谓的“扁平”或“浅层”布局层次，避免了嵌套布局的问题，从而减少了复杂性并提升了运行时的用户界面性能。\n\
  \n`ConstraintLayout` 的实现也是为了解决目前各种 Android 设备尺寸的问题。`ConstraintLayout` 的灵活性使得设计响应并适应应用程序运行设备的用户界面变得更容易。\n\
  \n最后，正如“在 Android Studio 中使用 ConstraintLayout”章节所示，Android Studio 布局编辑器工具已针对基于 `ConstraintLayout`\
  \ 的用户界面设计进行了增强。\n\n## 18.10 ConstraintLayout Availability（可用性）\n\n虽然 `ConstraintLayout`\
  \ 是随 Android 7 引入的，但它是作为支持库从主 Android SDK 中提供的，并兼容到 API  9（Gingerbread）的旧 Android\
  \ 版本。这使得使用这种新布局的应用程序可以在运行旧版本 Android 系统的设备上运行。\n\n## 18.11 Summary（总结）\n\n`ConstraintLayout`\
  \ 是随 Android 7 引入的布局管理器。它旨在便于创建适应市场上许多 Android 设备尺寸和方向的灵活布局。`ConstraintLayout` 使用约束来控制组件相对于父\
  \ `ConstraintLayout` 实例、指南线、屏障以及布局中其他组件的对齐和定位。`ConstraintLayout` 是新建 Android Studio\
  \ 项目的默认布局，也是设计用户界面布局时的推荐选择。通过这种简单而灵活的布局管理方法，可以以意想不到的轻松方式实现复杂的响应式用户界面。\n\n\n\n\n\n\
  正如前面的章节中多次提到的，Google 对 Android Studio 布局编辑器（Layout Editor）工具进行了重大更改，其中许多更改仅是为了支持使用\
  \ `ConstraintLayout` 进行用户界面布局设计。在上一章概述了 `ConstraintLayout` 的基本概念之后，本章将详细探讨这些概念，并概述布局编辑器工具如何允许设计和实现基于\
  \ `ConstraintLayout` 的用户界面的方法。\n\n## 19.1 设计与布局视图\n\n标题为 Android Studio 布局编辑器工具指南的章节解释了，Android\
  \ Studio 布局编辑器工具提供了两种方式，以设计（Design）和布局（Layout）视图（也称为蓝图视图）的形式查看 Activity 的界面布局。这些布局视图可以单独显示，也可以像图\
  \ 19-1 所示那样并排显示：\n\n![](img/as_4.1_layout_editor_previews.jpg)\n\n图 19-1\n\n`Design`\
  \ 视图（位于上图左侧）呈现布局的“所见即所得”表示，其中布局的外观与在运行中的应用程序中的显示一致。相反，`Layout` 视图显示蓝图风格的视图，其中控件由阴影轮廓表示。如上方的图\
  \ 19-1 所示，`Layout` 视图还显示了约束连接（在本情况下，用于将按钮居中于布局的对等约束）。当选中布局中的特定控件或鼠标指针悬停在设计区域上时，这些约束也会叠加在\
  \ `Design` 视图上，如图 19-2 所示：\n\n![](img/as_4.1_layout_editor_design_view.jpg)\n\n\
  图 19-2\n\n两种视图中约束连接的外观都可以通过图 19-3 所示的 `View Options`（视图选项）菜单进行更改：\n\n![](img/as_layout_view_options.jpg)\n\
  \n图 19-3\n\n除了显示用户界面布局的两种模式外，布局编辑器工具还提供了三种不同的方式来为特定的布局设计建立所需的约束。\n\n## 19.2 自动连接模式\n\
  \n`Autoconnect`（自动连接）顾如其名，会在项添加到布局中时自动建立约束连接。可以使用图 19-4 所示的工具栏按钮启用或禁用 `Autoconnect`\
  \ 模式：\n\n![](img/as_layout_autoconnect_button.jpg)\n\n图 19-4\n\n`Autoconnect` 模式使用算法，根据控件的位置以及控件与父布局侧边和布局中其他元素的距离远近，来决定确定要建立的最优约束。如果任何自动约束连接未能提供预期的行为，可以按照本章稍后概述的方法进行手动更改。\n\
  \n## 19.3 推断模式\n\n`Inference`（推断）模式使用涉及算法和概率的启发式方法，在控件已添加到布局后自动实现约束连接。这种模式通常用于关闭了\
  \ `Autoconnect` 特性且在没有任何约束连接的情况下向布局添加对象的情况。这允许通过从调色板将对象拖到布局画布上并更改尺寸和位置，直到布局符合要求来简单地设计布局。本质上，这涉及到“绘制”布局而不必担心约束。`Inference`\
  \ 模式也可以在设计过程中的任何时间填充布局中缺失的约束。\n\n点击 `Infer constraints`（推断约束）按钮（图 19-5）时，会自动会自动添加约束：\n\
  \n![](img/as_layout_infer_button.jpg)\n\n图 19-5\n\n与 `Autoconnect` 模式一样，布局编辑器工具始终存在推断错误约束的可能性，尽管这些可以手动进行修改和修正。\n\
  \n## 19.4 手动操作约束\n\n实现约束连接的第三种选择是手动进行。在这样做时，理解布局编辑器工具中控件周围出现的各种句柄将会有很大帮助。例如，考虑图\
  \ 19-6 所示的控件：\n\n![](img/as_4.1_constraint_handles.jpg)\n\n图 19-6\n\n显然，像弹簧一样的线条\
  \ (A) 代表了从控件侧边到目标已建立的约束连接。对象每个角上的小正方形标记 (B) 是缩放句柄，点击并拖动它们可以缩放控件。位于控件每个侧边的小圆句柄 (C)\
  \ 是侧边约束锚点。要创建约束连接，点击句柄并将生成的线条拖到要连接约束的元素上（如辅助线或父布局侧边或另一个控件的侧边），如图 19-7 所示。当连接到另一个控件的侧边时，只需将线条拖到该控件的侧边约束句柄，并在控件和句柄高亮时释放线条。\n\
  \n![](img/as_4.1_constraint_drag_line.jpg)\n\n图 19-7\n\n如果将约束线拖到控件并释放，但未连接到句柄，布局编辑器将显示一个包含可以附加约束的侧边的列表。在图\
  \ 19-8 中，例如，约束可以附加到目标控件的顶部或底部边缘：\n\n![](img/as_4.1_constraint_between_widgets.jpg)\n\
  \n图 19-8\n\n额外的标记指示基线约束的锚点，其中控件内部的内容而非边缘被用作对齐点。要显示此标记，只需右键点击控件并选择 `Show Baseline`（显示基线）。要要从基线建立约束连接，只需将鼠标指针悬停在句柄上使其高亮，然后点击并拖动到目标（如图\
  \ 19-9 所示的另一个控件的基线锚点）。\n\n![](img/as_baseline_constraint.jpg)\n\n图 19-9\n\n再次右键点击控件并选择\
  \ `Hide Baseline`（隐藏基线）。\n\n## 19.5 在检查器中添加约束\n\n可以使用图 19-10 所示的位于属性窗口的 `Inspector`（检查器）面板为\
  \ Android Studio 布局编辑器中的视图添加约束。中间的正方形表示当前选中的视图，正方形周围的区域表示应用于视图对应侧边的约束（如果有）：\n\n\
  ![](img/as_3.5_constraint_attributes.jpg)\n\n图 19-10\n\n视图侧缺少约束由指向带有加号的蓝色圆的虚线表示（如图中视图底部边缘所示）。要添加约束，只需点击此蓝色圆，布局编辑器将添加连接到它认为的布局中最合适目标的约束。\n\
  \n## 19.6 在属性窗口中查看约束\n\n通过显示下方图 19-11 所示的属性窗口中的 `Constraints`（约束）部分，可以查看当前选中控件上配置的约束列表：\n\
  \n![](img/as_3.5_attributes_constraints_list.jpg)\n\n图 19-11\n\n\n\n\n\n点击列表中的约束将选中设计布局中的该约束。\n\
  \n### 19.7 删除约束\n\n要删除单个约束，只需在设计布局内或 `Attributes` 工具窗口中选择该约束，使其高亮显示（例如，在图 19-12\
  \ 中所示，最右侧的约束已被选中），然后按下键盘上的删除键。该约束将从从布局中移除。\n\n![](img/as_4.1_constraint_highlighted.jpg)\n\
  \n图 19-12\n\n另一种选项是按住 `Ctrl` 键（macOS 上为 `Cmd`）的同时将鼠标指针悬停在约束锚点上，并在锚点变为红色后点击它：\n\n\
  ![](img/as_4.1_constraint_delete.jpg)\n\n图 19-13\n\n或者，通过右键点击组件并选择 `Clear Constraints\
  \ of Selection`（清除选择约束）菜单选项，移除该组件的所有约束。\n\n要移除布局中每个组件的所有约束，请使用图 19-14 中突出显示的工具栏按钮：\n\
  \n![](img/as_layout_delete_constraints.jpg)\n\n图 19-14\n\n### 19.8 调整约束偏移\n\n在上一章中，概述了使用偏移（bias）设置来倾向于一个相对约束而非另一个约束的概念。`Android\
  \ Studio Layout Editor` 工具中的偏移可以通过位于 `Attributes` 工具窗口中的 `Inspector` 进行调整，并如图图 19-15\
  \ 所示。图中用箭头指示的两个滑块用于控制当前选中组件的垂直和水平相对约束的偏移量。\n\n![](img/as_3.2_constraint_bias_sliders.jpg)\n\
  \n图 19-15\n\n### 19.9 理解 ConstraintLayout 边距\n\n约束可以结合边距使用，以实现组件与另一个元素（如另一个组件、辅助线或父布局侧边）之间的固定间隙。例如，考虑图\
  \ 19-16 中应用于 `Button` 对象的水平约束：\n\n![](img/as_4.1_constraint_no_margins.jpg)\n\n\
  图 19-16\n\n按照目前的配置，水平约束延伸到父 `ConstraintLayout` 的左右边缘。因此，该组件具有相对的水平约束，这表明 `ConstraintLayout`\
  \ 布局引擎在运行时组件的实际定位方面具有裁量权。这使得布局具有灵活性，以适应不同的屏幕尺寸和设备方向。水平偏移设置也能控制组件的位置直到布局的右侧。例如，图\
  \ 19-17 显示了应用了 100% 水平偏移的相同按钮：\n\n![](img/as_4.1_constraint_bias_100.jpg)\n\n图 19-17\n\
  \n`ConstraintLayout` 边距可能会出现在约束连接的末端，代表一个固定间隙，即使在调整偏移或响应活动其他部分的布局的变化时，组件也无法移动到该间隙内。在图\
  \ 19-18 中，右侧约束现在包含 50dp 的边距，即使偏移仍设为 100%，组件也无法移动到其中。\n\n![](img/as_4.1_constraint_margin_50.jpg)\n\
  \n图 19-18\n\n组件上现有的边距值可以在 `Inspector` 内部修改。如图 19-19 所示，正在使用下拉菜单将当前选中组件的右边距更改为 16dp。或者，点击当前值也可以在字段中输入数字。\n\
  \n![](img/as_3.2_constraint_set_margins.jpg)\n\n图 19-19\n\n可以使用图 19-20 中突出显示的工具栏中的选项，随时更改新约束的默认边距：\n\
  \n![](img/as_layout_margin_button.jpg)\n\n图 19-20\n\n### 19.10 相对约束和偏移的重要性\n\n正如上一章所讨论的，在\
  \ Android 中使用 `ConstraintLayout` 时，相对约束、边距和偏移是响应式布局设计的基石。当组件受到约束但没有相对约束连接时，这些约束本质上是边距约束。这在\
  \ `Layout Editor` 工具中通过实线连并带有边距测量值的视觉形式指示出来，如图图 19-21 所示。\n\n![](img/as_4.1_constraints_opposing.jpg)\n\
  \n图 19-21\n\n上述约束本质上将组件固定在那个位置。结果是，如果设备旋转到横屏模式，组件将不再可见，因为垂直约束将其推出了设备屏幕的顶边缘（如图 19-22\
  \ 所示）。如果在屏幕比之前更小的设备上运行应用，也会类似的问题。\n\n![](img/as_4.1_constraints_opposing_landscape.jpg)\n\
  \n图 19-22\n\n当实现相对约束时，约束连接由弹簧状线表示（弹簧比喻旨在指示组件的位置没有固定到绝对的 `X` 和 `Y` 坐标）：\n\n![](img/as_4.1_constraints_opposing.jpg)\n\
  \n图 19-23\n\n在上述布局中，垂直和水平偏移设置为为使组件始终位于距离底部 90% 和距离左边缘 35% 的位置。因此，在旋转后，组件仍然可见，并相对于屏幕尺寸处于相同位置：\n\
  \n![](img/as_4.1_constraints_opposing_landscape.jpg)\n\n图 19-24\n\n在手动设计界面布局和对自动创建的约束进行修正时，考虑到偏移和相对约束是非常重要的。\n\
  \n### 19.11 配置组件尺寸\n\n`ConstraintLayout` 内部组件的内部尺寸也可以通过 `Inspector` 配置。正如上一章概述的，组件尺寸可以设置为包裹内容（wrap\
  \ content）、固定（fixed）或匹配约束（match constraint）。当前选中组件每个尺寸的现有设置显示在 `Inspector` 中代表组件的正方形内，如图图\
  \ 19-25 所示：\n\n![](img/as_3.2_constraint_widget_dimensions.jpg)\n\n图 19-25\n\n在上述图中，水平和垂直维度都设置为包裹内容模式（由向内的箭头指示）。检查器使用以下视觉指示器来表示三种尺寸模式：\n\
  \n| 固定大小 (Fixed Size) | ![](img/Image2826.jpg) |\n| 匹配约束 (Match Constraint) | ![](img/Image2834.jpg)\
  \ |\n| 包裹内容 (Wrap Content) | ![](img/Image2844.jpg) |\n\n表 19-1\n\n要更改当前设置，只需点击指示器并在三种不同的设置之间循环。当布局编辑器中视图的尺寸设置为匹配约束模式时，视图相应的边将用弹簧状线绘制，而不是普通的直线。例如，在图\
  \ 19-26 中，仅视图的宽度被设置为匹配约束：\n\n![](img/Image2855.jpg)\n\n图 19-26\n\n\n\n\n\n此外，可以通过\
  \ `Expand horizontally`（水平扩展）和 `Expand vertically`（垂直扩展）选项，将组件的大小扩展到约束以及布局中其他组件允许的最大水平或垂直方向尺寸。这些选项可以通过右键点击布局中的组件，并从弹出的菜单中选择\
  \ `Organize`（组织）选项来访问（如图 19-27）。使用时，当前选中的组件将在水平或垂直方向上增大，以填充周围的可用空间。\n\n![](img/as_4.1_constraint_organize_menu.jpg)\n\
  \n图 19-27\n\n## 19.12 设计时工具定位\n\n名为“Android Studio 布局编辑器工具指南”的章节介绍了 `tools` 命名空间的概念，并解释了如何使用它来设置仅在布局编辑器内有效的可见性属性。在后台，Android\
  \ Studio 也会使用 `tools` 属性在当组件在没有约束的情况下放置在布局上时保持其位置。例如，在禁用自动连接模式时将一个 `Button` 放置在布局上。虽然组件在预览画布中似乎处于正确位置，但在运行应用时，它将出现在屏幕左上角。这是因为组件没有约束来告诉父布局\
  \ `ConstraintLayout` 将其放置在何处。\n\n组件在布局编辑器中显示正确位置的原因是，Android Studio 设置了绝对 X 和 Y\
  \ 轴定位 `tools` 属性，以便在添加约束之前将其保持在正确位置。在 XML 布局文件中，其内容可能如下：\n\n```xml\n<Button\n  \
  \  android:id=\"@+id/button4\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:text=\"Button\"\n    tools:layout_editor_absoluteX=\"\
  111dp\"\n    tools:layout_editor_absoluteY=\"88dp\" />\n```\n\n一旦为组件添加了足够的约束，布局编辑器将移除这些\
  \ `tools` 属性。一种快速识别哪些组件缺少约束而无需等待应用运行的实用技巧是：点击图 19-28 中高亮的按钮以切换工具位置可见性。任何跳转到左上角的组件都是未完全约束的，它们通过临时的\
  \ `tools` 绝对 X 和 Y 定位属性保持固定。\n\n![](img/as_4.1_toggle_tools_positions.jpg)\n\n图\
  \ 19-28\n\n## 19.13 添加辅助线\n\n辅助线（Guidelines）提供了可以锚定约束的其他元素。可以通过右键点击布局并选择 `Vertical\
  \ Guideline`（垂直辅助线）或 `Horizontal Guideline`（水平辅助线）菜单选项，或使用工具栏菜单选项来添加，如图 19-29 所示：\n\
  \n![](img/as_layout_guidelines_button.jpg)\n\n图 19-29\n\n或者，也可以从 `Palette`（调色板）的\
  \ `Helpers` 部分拖动水平和垂直 `Guidelines` 并放置到布局上：\n\n![](img/as_4.1_guideline_from_palette.jpg)\n\
  \n图 19-30\n\n添加后，辅助线将以虚线形式出现，并可以通过简单的拖动进行移动。要建立约束，如图 19-31 所示，点击辅助线。辅助线的位置可以指定为距离父布局左侧或右侧的绝对距离：\n\
  \n![](img/as_4.1_guideline_constraint.jpg)\n\n图 19-31\n\n或者，辅助线可以相对于整体宽度或高度的百分比。要在这些模式之间切换，选择辅助线并点击顶部或起始位置。例如，图\
  \ 19-32 显示了一个基于百分比的辅助线：\n\n![](img/as_4.1_guideline_percentage.jpg)\n\n图 19-32\n\
  \n## 19.14 添加屏障\n\n屏障（Barriers）可以通过右键点击布局并选择 `Vertical Barrier`（垂直屏障）或 `Horizontal\
  \ Barrier`（水平屏障）菜单选项，或使用 `Helpers` 部分的工具栏菜单选项来添加，如图 19-29 所示。或者，也可以从 `Palette` 的\
  \ `Helpers` 部分拖动水平和垂直 `Barriers` 并放置到布局上：\n\n![](img/as_4.2_barrier_added.jpg)\n\
  \n图 19-33\n\n添加后，屏障将出现在布局中。要添加视图作为引用视图，只需将组件拖动到屏障项上。例如，在图 19-34 中，分配了 `textView1`\
  \ 和 `textView2`：\n\n![](img/as_4.2_barrier_children.jpg)\n\n图 19-34\n\n在添加引用视图后，需要配置屏障以指定方向。这在选择屏障时在\
  \ `Attributes`（属性）工具窗口中定义：\n\n![](img/as_4.1_barrier_direction.jpg)\n\n图 19-35\n\
  \n下图显示了一个包含 `textView1` 和 `textView2`（作为引用视图）以及 `textView3`（受约束视图）的布局。由于屏障是从视图的末端推向受约束视图，因此屏障方向已设置为\
  \ `end`：\n\n![](img/as_3.5_constraints.jpg)\n\n图 19-36\n\n## 19.15 添加组\n\n要在布局中添加\
  \ `Group`（组），右键点击布局并从 `Helpers` 菜单中选择 `Group` 选项，或如之前图 19-29 所示使用工具栏选项。或者，在 `Palette`\
  \ 的 `Helpers` 部分找到 `Group` 项目并将其拖放到布局画布或组件树上。\n\n要向组添加组件，请在组件树中选择它们并将它们拖到 `Group`\
  \ 项上。例如，图 19-37 显示将三个选定的组件添加到组中：\n\n![](img/as_4.1_add_widgets_to_group.jpg)\n\n\
  图 19-37\n\n组引用的任何组件在组件树中都会以斜体形式显示在组项下方，如图 19-38 所示。要从组中移除组件，只需选择它并按下键盘删除键：\n\n![](img/as_4.1_group_widget_list.jpg)\n\
  \n图 19-38\n\n一旦将组件分配给组，使用 `Attributes` 工具窗口中的 `Constraints` 部分修改可见性设置：\n\n![](img/as_4.1_group_visibility.jpg)\n\
  \n图 19-39\n\n## 19.16 使用 Flow 辅助工具\n\n`Flow` 辅助工具可以像之前其他辅助工具一样，使用菜单或 `Palette` 添加。与\
  \ `Group` 辅助工具一样（图 19-37），通过在组件树中将组件拖动到 `Flow` 项向 `Flow` 实例添加组件。添加 `Flow` 辅助工具并为其分配组件后，在组件树中选择它并使用\
  \ `Attribute` 工具窗口的 `Common Attributes`（通用属性）部分配置流布局行为。\n\n\n\n\n\n![](img/as_4.1_flow_attributes.jpg)\n\
  \n图 19-40\n\n# 19.17 组件组对齐与分布\n\nAndroid Studio 布局编辑器提供了一系列对齐和分布操作，当布局中选中两个或多个组件时可以执行这些操作。只需按住\
  \ Shift 点击要包含的每个组件，在布局上点击右键，并从 `Align`（对齐）菜单显示的许多选项中进行选择：\n\n![](img/as_layout_align_menu.jpg)\n\
  \n图 19-41\n\n如下方的图 19-42 所示，这些选项也可以通过布局编辑器工具栏上的 `Align`（对齐）按钮访问：\n\n![](img/as_4.1_constraints_align_menu.jpg)\n\
  \n图 19-42\n\n同样，`Pack`（打包）菜单（图 19-43）可以重新放置所选组件，使它们在垂直或水平方向上紧凑排列。它通过更改组件的绝对 `x`\
  \ 和 `y` 坐标来实现此，但不会应用任何约束。另一方面，`Pack` 菜单中的两个分布选项会移动所选组件，使其在垂直或水平轴上均匀间距，并在视图之间应用约束以维持这种间距。\n\
  \n![](img/as_3.2_constraints_pack_menu.jpg)\n\n图 19-43\n\n# 19.18 将其他布局转换为 ConstraintLayout\n\
  \n对于使用一个或多个其他 Android 布局类（如 `RelativeLayout` 或 `LinearLayout`）的现有用户界面布局，布局编辑器提供了一个将用户界面转换为使用\
  \ `ConstraintLayout` 的选项。\n\n当布局编辑器打开并处于 Design（设计）模式时，`Component Tree`（组件树）面板显示在\
  \ `Palette`（调面板）下方。要将布局转换为 `ConstraintLayout`，在 `Component Tree` 中找到它，右键点击它，并选择\
  \ `Convert <current layout> to Constraint Layout`（将 <当前布局> 转换为 Constraint Layout）菜单选项：\n\
  \n![](img/as_3.4_convert_to_constraintlayout.jpg)\n\n图 19-44\n\n当选择此菜单选项时，Android\
  \ Studio 将将选的布局转换为 `ConstraintLayout` 并使用推理建立约束，以匹配原始布局类型的行为。\n\n# 19.19 总结\n\n\
  重新设计的布局编辑器工具结合 `ConstraintLayout`，使得使用 Android Studio 设计复杂的用户界面布局变成了一个相对快速且直观的过程。本章详细介绍了约束、外边距（margins）和偏移（bias）的概念，同时探索了基于\
  \ `ConstraintLayout`的设计如何集成到布局编辑器工具中。\n\n# 20. 在 Android Studio 中使用 ConstraintLayout\
  \ 链和比例\n\n之前的章节介绍了 `ConstraintLayout` 类的关键功能，并概述了 Android Studio 布局编辑器中基于 `ConstraintLayout`\
  \ 的用户界面设计的最佳实践。尽管 `ConstraintLayout` 链（chains）和比例的概念在 Android ConstraintLayout 指南章节中已经过概述，但我们尚未讨论如何在布局编辑器中使用这些功能。因此，本章的重点是提供在使用\
  \ `ConstraintLayout` 类时如何创建和管理链与比例的实际步骤。\n\n## 20.1 创建链\n\n链可以通过向 activity 的 XML\
  \ 布局资源文件添加几行代码，或使用布局编辑器的某些链特定功能来实现。\n\n考虑一个由三个 `Button` 组件组成的布局，它们被约束在 `ConstraintLayout`\
  \ 父布局的左上角、顶部中央和右上角，如图图 20-1](#Chains_and_Ratios.xhtml__idTextAnchor503)所示：\n\n![](img/as_4.1_layout_buttons_no_chain.jpg)\n\
  \n图 20-1\n\n为了表示此类布局，XML 资源布局文件可能包含以下按钮组件的条目：\n\n```xml\n<Button\n    android:id=\"\
  @+id/button1\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_marginStart=\"8dp\"\n    android:layout_marginTop=\"\
  16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n<Button\n    android:id=\"@+id/button2\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"\
  8dp\"\n    android:layout_marginStart=\"8dp\"\n    android:layout_marginTop=\"16dp\"\
  \n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"0.5\"\n\
  \    app:layout_constraintEnd_toStartOf=\"@+id/button3\"\n    app:layout_constraintStart_toEndOf=\"\
  @+id/button1\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n<Button\n  \
  \  android:id=\"@+id/button3\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_marginEnd=\"8dp\"\n    android:layout_marginTop=\"\
  16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n按照目前的配置，没有双向约束将这些组件分组成链。为了解决这个问题，需要从 `button1` 的右侧到 `button2`\
  \ 的左侧，以及从 `button3` 的左侧到 `button2` 的右侧添加额外的约束，如下：\n\n```xml\n<Button\n    android:id=\"\
  @+id/button1\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_marginStart=\"8dp\"\n    android:layout_marginTop=\"\
  16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    app:layout_constraintEnd_toStartOf=\"@+id/button2\" />\n<Button\n\
  \    android:id=\"@+id/button2\"\n    android:layout_width=\"wrap_content\"\n  \
  \  android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"8dp\"\n\
  \    android:layout_marginStart=\"8dp\"\n    android:layout_marginTop=\"16dp\"\n\
  \    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"0.5\"\n\
  \    app:layout_constraintEnd_toStartOf=\"@+id/button3\"\n    app:layout_constraintStart_toEndOf=\"\
  @+id/button1\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n<Button\n  \
  \  android:id=\"@+id/button3\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_marginEnd=\"8dp\"\n    android:layout_marginTop=\"\
  16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    app:layout_constraintStart_toEndOf=\"@+id/button2\" />\n```\n\n通过这些更改，组件现在配置了双向水平约束。这在本质上构成了一个\
  \ `ConstraintLayout` 链，在布局编辑器中通过链连接视觉化表示，如下方的图 20-2 所示。注意，在此配置下，链默认使用了分布链样式。\n\n\
  ![](img/as_4.1_layout_horizontal_chain.jpg)\n\n图 20-2\n\n也可以通过右键点击一个视图并选择 `Chains\
  \ -> Create Horizontal Chain`（链 -> 创建水平链）或 `Chains -> Create Vertical Chain`（链 ->\
  \ 创建垂直链）菜单选项来创建链。\n\n## 20.2 更改链样式\n\n如果没有配置链样式，`ConstraintLayout` 将默认使用分布链样式可以通过右键点击链中的任何组件并选择\
  \ `Cycle Chain Mode`（循环链模式）菜单选项来更改链样式。每次点击菜单选项，样式都会切换到另一个设置，顺序为分布（spread）、内部分布（spread\
  \ inside）和打包（packed）。\n\n或者，可以在 `Attributes` 工具窗口中指定样式，展开 `layout_constraints` 属性，并根据链的方向更改\
  \ `horizontal_chainStyle` 或 `vertical_chainStyle` 属性：\n\n\n\n\n\n![](img/as_4.1_chain_style_attribute.jpg)\n\
  \n图 20-3\n\n## 20.3 链内部散开样式 (Spread Inside Chain Style)\n\n图 20-4 展示了使用上述技术将链样式更改为“链内部散开”样式的效果：\n\
  \n![](img/as_4.1_layout_horizontal_chain_spread_inside.jpg)\n\n图 20-4\n\n## 20.4\
  \ 紧凑链样式 (Packed Chain Style)\n\n使用相同的技术，将链样式属性更改为`packed`会导致布局发生变化，如图 20-5 所示：\n\
  \n![](img/as_4.1_layout_horizontal_chain_packed.jpg)\n\n图 20-5\n\n## 20.5 带偏移的紧凑链样式\
  \ (Packed Chain Style with Bias)\n\n紧凑链的定位可能会受到应用偏移值（bias）的影响。偏移值可以是 `0.0` 到 `1.0`\
  \ 之间的任意值，其中 `0.5` 代表父容器的中心。可以通过选择链头控件并在属性（Attributes）面板中为 `layout_constraintHorizontal_bias`\
  \ 或 `layout_constraintVertical_bias` 属性赋值来控制偏移。图 20-6 显示了一个水平偏移设为 `0.2` 的紧凑链：\n\n\
  ![](img/as_4.1_layout_horizontal_chain_packed_bias.jpg)\n\n图 20-6\n\n## 20.6 权重链\
  \ (Weighted Chain)\n\n最后一个探索的链区域涉及对单个控件进行加权，以控制链中每个控件在可用空间中所占比例。权重链只能通过 `spread`\
  \ 链样式实现，并且链中任何要响应权重属性的控件必须将其相应的尺寸属性（垂直链为 `height`，水平链为 `width`）配置为 `match constraint`（匹配约束）模式。控件尺寸的\
  \ `match constraint` 模式可以通过选择控件、显示属性面板并将尺寸更改为 `match_constraint`（等同于 `0dp`）来配置。在图\
  \ 20-7 中，按钮的 `layout_width` 约束已设置为 `match_constraint` (`0dp`)，表示控件的宽度将根据现有的约束设置来确定：\n\
  \n![](img/as_3.5_chain_match_constraints.jpg)\n\n图 20-7\n\n假设已选择了 `spread` 链样式，且所有三个按钮都配置为宽度维度设置为匹配约束，则链中的控件将等宽扩展以填充可用空间：\n\
  \n![](img/as_4.1_layout_horizontal_chain_match_constraints.jpg)\n\n图 20-8\n\n每个控件相对于链中其他控件所占的空间大小可以通过向控件添加权重属性来控制。图\
  \ 20-9 展示了将 `button1` 的 `layout_constraintHorizontal_weight` 属性设置为 `4`，并将 `button2`\
  \ 和 `button3` 的该属性均设置为 `2` 的效果：\n\n![](img/as_4.1_layout_horizontal_chain_weight.jpg)\n\
  \n图 20-9\n\n由于这些权重值，`button1` 占据了一半的空间 (`4/8`)，而 `button2` 和 `button3` 各占据了空间的四分之一\
  \ (`2/8`)。\n\n## 20.7 使用比例 (Working with Ratios)\n\nConstraintLayout 比例允许控件的一个维度相对于控件的另一个维度（也称为纵横比）进行缩放。例如，可以将比例设置应用到\
  \ `ImageView`，以确保其宽度始终是高度的倍倍。\n\n尺寸比例约束通过将受限维度设置为 `match_constraint` 模式，并在该控件上将\
  \ `layout_constraintDimensionRatio` 属性配置为所需的比例来实现。该比例值可以指定浮点值，也可以以 `width:height`\
  \ 比例的形式指定。例如，下面的 XML 代码段为 `ImageView` 控件配置了 `2:1` 的比例：\n\n```xml\n<ImageView\n \
  \   android:layout_width=\"0dp\"\n    android:layout_height=\"100dp\"\n    android:id=\"\
  @+id/imageView\"\n    app:layout_constraintDimensionRatio=\"2:1\" />\n```\n\n上面的示例演示了当仅设置一个维度匹配约束时如何配置比例。当两个维度都设置为\
  \ `match_constraint` 模式时，也可以应用比例。这涉及到在比例前加上 `H` 或 `W`，以指示哪一个维度是相对于另一个维度的约束。\n\n\
  例如，考虑以下 `ImageView` 对象的 XML 代码段：\n\n```xml\n<ImageView\n    android:layout_width=\"\
  0dp\"\n    android:layout_height=\"0dp\"\n    android:id=\"@+id/imageView\"\n  \
  \  app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintRight_toRightOf=\"\
  parent\"\n    app:layout_constraintLeft_toLeftOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    app:layout_constraintDimensionRatio=\"W,1:3\" />\n```\n\n在上面的示例中，高度将受应用于其上的约束。在这种情况下，约束被配置为连接到父容器的顶部和底部，从而拉伸填充整个高度。无论布局显示如何，宽度将是高度的三分之一。\n\
  \n同样的结果也可以无需手动编辑 XML 文件来实现。当控件尺寸设置为 `match constraint` 时，属性面板的检查区域会出现比例开关。图 20-10\
  \ 示例显示了按钮的布局宽度和高度设置为匹配约束，并突出了比例开关：\n\n![](img/as_3.2_toggle_ratio.jpg)\n\n图 20-10\n\
  \n默认情况下，比例开关是关闭的。点击该开关启用比例约束并显示可以更改比例的额外字段：\n\n![](img/as_3.2_toggle_ratio_settings.jpg)\n\
  \n图 20-11\n\n## 20.8 总结\n\n链和比例都是 ConstraintLayout 的强大功能，旨在为设计灵活的响应式用户界面提供更多选项。如本章所述，Android\
  \ Studio Layout Editor 已经增强，便于在设计过程中使用这些功能。\n\n## 21. Android Studio 教程\n\n最简单且有效的方法是使用\
  \ Android Studio Layout Editor。本章将介绍如何使用这种方法创建基于 ConstraintLayout 的界面。在介绍了 Android\
  \ Studio Layout Editor 后，本章还将介绍布局检查工具。\n\n## 21.1 Android Studio Layout Editor 示例\n\
  \n此阶段的第一步是创建一个 Android Studio 项目。首先启动 Android Studio，并通过 File -> Close Project 菜单关闭任何已打开的项目。\n\
  \n在欢迎界面上选择 New Project 。在之前的示例中，我们请求 Android Studio 为项目创建一个模板活动。然而，我们将通过此节教程学习如何手动创建一个全新的活动以及相应的布局资源文件，因此在点击\
  \ Next 按钮之前，请确保选择了 No Activity 选项。\n\n在 Name 字段中输入 LayoutSample，并指定包名为 com.ebookfrenzy.layoutsample。在点击\
  \ Finish 按钮之前，将 Minimum API 级设置为 API 26: Android 8.0 (Oreo)，并将 Language 菜单更改为 Java。\n\
  \n\n\n\n\n一旦项目创建过程完成，Android Studio 主窗口将会出现，我们就可以准备好创建一个新的 Activity。这将是一次非常有价值的练习，因为在开发\
  \ Android 应用程序的过程中，有很多情况需要从零开始创建新的 Activity。\n\n首先，使用 `Alt-1/Cmd-1` 快捷键显示 `Project`\
  \ 工具窗口（如果它尚未显示）。一旦显示出 Android 层次结构，点击 `Project` 窗口中条目旁向右的箭头展开它。这里的目标是访问项目层次结构中的\
  \ `app -> java -> com -> ebookfrenzy -> layoutsample` 文件夹。一旦包名可见，右键点击它，并如图 21-1\
  \ 所示选择 `New -> Activity -> Empty Activity` 菜单选项。或者，选择 `New -> Activity -> Gallery...`\
  \ 选项来浏览可用模板，并在 `New Android Activity` 对话框中选择。\n\n![](img/Image2435.jpg)\n\n图 21-1\n\
  \n在弹出的 `New Android Activity` 对话框中，将新 Activity 命名为 `MainActivity`，将布局命名为 `activity_main`。该\
  \ Activity 自然需要一个布局资源文件，因此请确保 `Generate a Layout File` 选项已启用。\n\n为了让应用程序能够在设备上运行，它需要指定一个\
  \ Activity 作为启动 Activity（launcher activity）。如果没有启动 Activity，操作系统将不知道在应用程序首次启动时启动哪个\
  \ Activity，应用程序将无法启动。由于此示例只有一个 Activity，它需要被指定为应用程序的启动 Activity，因此在点击 `Finish` 按钮之前，请确保\
  \ `Launcher Activity` 选项已启用。\n\n此时，Android Studio 应该向项目中添加了两个文件。Activity 的 Java\
  \ 源文件位于 `app -> java -> com -> ebookfrenzy -> layoutsample` 文件夹中。\n\n此外，用户界面的 XML\
  \ 布局文件应该已在 `app -> res -> layout` 文件夹中创建。注意此 Activity 选择了 `Empty Activity` 模板，因此布局完全包含在\
  \ `activity_main.xml` 文件，没有单独的内容布局文件。此外，由于我们不会编写代码来访问用户界面布局中的视图，因此没有必要将项目转换为支持视图绑定（view\
  \ binding）。\n\n最后，新 Activity 应该已添加到 `AndroidManifest.xml` 文件中并指定为启动 Activity。清单文件可以在项目窗口的\
  \ `app -> manifests` 文件夹下找到，并应包含以下 XML：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    package=\"com.ebookfrenzy.layoutsample\"\
  >\n    <application\n        android:allowBackup=\"true\"\n        android:dataExtractionRules=\"\
  @xml/data_extraction_rules\"\n        android:fullBackupContent=\"@xml/backup_rules\"\
  \n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher_round\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/Theme.LayoutSample\"\n        tools:targetApi=\"\
  31\">\n        <activity\n            android:name=\".MainActivity\"\n         \
  \   android:exported=\"true\" >\n            <intent-filter>\n                <action\
  \ android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"\
  android.intent.category.LAUNCHER\" />\n            </intent-filter>\n        </activity>\n\
  \    </application>\n</manifest>\n```\n\n## 21.3 准备布局编辑器环境\n\n找到 `app -> res ->\
  \ layout` 文件夹中的 `activity_main.xml` 布局文件并双击它，将其加载到 `Layout Editor` 工具中。由于本教程的目的是消除布局编辑器的神秘感，我们将使用\
  \ `Design` 视图而不是 `Code` 或 `Split` 视图。`Design` 视图允许您拖放组件来构建 UI，这对于初学者来说通常更直观。\n\n\
  此时，组件的约束还不足以让布局引擎能够在运行时对其进行定位和调整大小。如果现在运行程序，所有组件都将位于屏幕的左上角。\n\n将组件添加到布局后，使用 `Layout\
  \ Editor` 工具栏上的设备旋转按钮（如图 21-9 中的箭头所示）来横屏模式查看用户界面。\n\n\n\n\n\n由于缺少约束，导致布局无法适应设备方向的变化，使得内容未居中，并且部分图像以及三个按钮都位于屏幕的可视区域之外。显然，仍然需要进行一些工作才能将其转化为一个响应式用户界面。\n\
  \n## 21.5 添加约束\n\n约束是创建能够适应设备方向变化和不同屏幕尺寸布局的关键。首先，将布局旋转回竖屏方向，并选择位于 `ImageView` 上方的\
  \ `TextView` 组件。在选中该部件后，将 `TextView` 的左侧、右侧和顶部连接到父 `ConstraintLayout` 的相应侧边，如图 21-10\
  \ 所示：\n\n![](img/as_3.5_layout_sample_textview_constraints.jpg)\n\n图 21-10\n\n在\
  \ `TextView` 小部件设置约束后，选择 `ImageView` 实例，并在左右两侧建立相反的约束，每个约束都连接到父布局的相应侧边。接下来，从 `ImageView`\
  \ 的顶部到 `TextView` 的底部建立约束连接，并从 `ImageView` 的底部到中间 `Button` 组件的顶部建立约束。如有必要，点击并拖动\
  \ `ImageView`，使其保持在布局的垂直中心位置。\n\n在 `ImageView` 仍被选中的情况下，使用属性面板中的 `Inspector`（检查器）将\
  \ `ImageView` 的顶部底部边距分别更改为 24 和 8，并将部件的高度和宽度维度属性均改为 `match_constraint`，以便部件能够调整大小以匹配约束。这些设置将允许布局引擎在必要时放大或缩小\
  \ `ImageView` 的尺寸，以适应布局的变化：\n\n![](img/as_33_layout_attributes.jpg)\n\n图 21-11\n\
  \n图 21-12 显示了 `ImageView` 相对于布局中其他元素的当前实现约束：\n\n![](img/as_4.1_layout_sample_ui_constrained.jpg)\n\
  \n图 21-12\n\n最后一个任务是为三个 `Button` 组件添加约束。在本例中，按钮将以链（chain）的形式放置。首先，通过点击图 21-2 中高亮的工具栏按钮，在\
  \ `Layout Editor` 中开启 `Autoconnect`（自动连接）。\n\n接下来，点击 `Buy Now` 按钮，然后按 Shift 点击其他两个按钮，以便选中所有三个。右键点击\
  \ `Buy Now` 按钮，从弹出菜单中选择 `Chains -> Create Horizontal Chain`（链 -> 创建水平链）。默认情况下，链将使用散开（spread）样式显示，这是本例的正确行为。\n\
  \n最后，在 `Buy Now` 按钮底部和布局底部建立约束。对剩余按钮重复此步骤。\n\n完成这些步骤后，按钮应如图 21-13 所示被约束：\n\n![](img/as_4.1_layout_sample_chain.jpg)\n\
  \n图 21-13\n\n## 21.6 测试布局\n\n在布局中添加约束后，将屏幕旋转到横屏，验证布局是否适应了新的屏幕尺寸。\n\n虽然 `Layout Editor`\
  \ 工具提供了一个用于设计用户界面布局的实用视觉环境，但在测试方面，运行应用测试是不可替代的。在物理 Android 设备或模拟器会话上启动应用，并验证用户界面是否反映了在\
  \ `Layout Editor` 中创建的布局。图 21-14 显示了横屏模式下的运行应用：\n\n![](img/as_4.1_layout_sample_completed.jpg)\n\
  \n图 21-14\n\n用户界面设计现在已完成。设计更复杂的用户界面布局是上述步骤的延续。只需将视图拖放到显示器上，根据需要进行定位、约束并设置属性即可。\n\
  \n## 21.7 使用 Layout Inspector\n\n可以使用 `Layout Inspector` 工具随时查看构成用户界面布局的组件层级结构。要访问此信息，应用必须在运行\
  \ Android API 29 或更高版本的设备或模拟器上。应用运行后，选择 `Tools -> Layout Inspector` 菜单选项，然后通过下方图\
  \ 21-15 中标记为 A 的菜单选择要检查的进程。\n\n一旦检查器加载，最左侧的面板 (B) 显示了构成用户界面布局的组件层级结构。中间面板 (C) 显示了布局设计的视觉表示。点击视觉布局中的部件将导致该项在层级列表中高亮显示，从而轻松找到视觉组件相对于整个布局层级结构所在的位置。\n\
  \n最后，最右侧的面板（在图 21-15 中标记为 D）包含当前选中组件的所有属性设置，允许对组件的内部配置进行深入分析。在适当的情况下，值单元格将包含一个指向项目源代码中属性设置位置的链接。\n\
  \n![](img/as_layout_inspector.jpg)\n\n图 21-15\n\n要以 3D 视图查看布局，点击标记为 E 的按钮。这将显示层级结构的“爆炸式”表示，以便进行旋转和检查。这对于识别被遮挡的视图等任务非常有用：\n\
  \n![](img/as_4.1_layout_inspector_spacing.jpg)\n\n图 21-16\n\n使用图中指示箭头拖动渲染进行三维旋转。点击标记为\
  \ E 的按钮返回 2D 视图。\n\n## 21.8 总结\n\nAndroid Studio 中的 `Layout Editor` 工具与 `ConstraintLayout`\
  \ 紧密集成。本章通过创建一个示例用户界面，概述了如何在 `Layout Editor` 中通过添加部件设置约束来实现基于 `ConstraintLayout`\
  \ 的用户界面。本章还介绍了 `Layout Inspector` 工具，它用于分析用户界面的结构组成。\n\n## 22 Android Studio 中的手动\
  \ XML 布局设计\n\n虽然使用 Android Studio `Layout Editor` 工具设计布局可以大大提高效率，但仍然可以通过编辑底层 XML\
  \ 创建布局。本章将介绍 Android XML 布局的基础。\n\n## 22.1 手动创建 XML 布局\n\nXML 布局文件的结构实际上简单。资源文件的第一行应包含标准声明：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n```\n\n该声明之后应该是布局的根元素，通常是一个容器视图。它由起始标签和结束标签以及需要设置在视图上的任何属性表示。例如，以下\
  \ XML 定义了一个 `ConstraintLayout` 作为根元素，分配了 ID `activity_main` 并设置了 `match_parent`\
  \ 属性，使其填充设备显示的所有空间：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/activity_main\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    android:paddingLeft=\"16dp\"\n\
  \    android:paddingRight=\"16dp\"\n    android:paddingTop=\"16dp\"\n    android:paddingBottom=\"\
  16dp\">\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n\n\n\n\n\
  ```xml\n    tools:context=\".MainActivity\">\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n注意，在上面的示例中，布局元素的每个侧都配置了 `16dp`（密度无关像素）的内边距。Android 布局中的任何间距规范必须使用以下单位之一：\n\
  \n*   `in` – 英寸。\n*   `mm` – 毫米。\n*   `pt` – 点（1/72 英寸）。\n*   `dp` – 密度无关像素。一种基于设备显示器相对于\
  \ `160dpi` 显示基准的物理密度的抽象测量单位。\n*   `sp` – 比例无关像素。与 `dp` 类似，但会根据用户的字体偏好进行缩放。\n*  \
  \ `px` – 实际屏幕像素。不建议使用，因为不同的显示器每英寸像素数不同。请使用 `dp` 而非此单位。\n\n任何需要添加到 `ConstraintLayout`\
  \ 父元素的子元素都必须嵌套在起始标签和结束标签之间。在以下示例中，添加了一个 `Button` 控件作为 `ConstraintLayout` 的子元素：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/activity_main\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    android:paddingLeft=\"16dp\"\n\
  \    android:paddingRight=\"16dp\"\n    android:paddingTop=\"16dp\"\n    android:paddingBottom=\"\
  16dp\"\n    tools:context=\".MainActivity\">\n    <Button\n        android:text=\"\
  @string/button_string\"\n        android:layout_width=\"wrap_content\"\n       \
  \ android:layout_height=\"wrap_content\"\n        android:id=\"@+id/button\" />\n\
  </androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n按照目前的实现，按钮没有任何约束连接。因此，在运行时，按钮将出现在屏幕的左上角尽管由于父布局分配的内边距而缩进了\
  \ `16dp`）。然而，如果为按钮两侧添加了相对的约束，它将显示在布局的中央：\n\n```xml\n<Button\n    android:text=\"\
  @string/button_string\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:id=\"@+id/button\"\n    app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n注意，每个约束都绑定到名为\
  \ `activity_main` 的元素，在这种情况下它是父 `ConstraintLayout` 实例。\n\n要向布局中添加第二个控件，只需将其嵌入 `ConstraintLayout`\
  \ 元素的体内部。例如，下面的修改向布局中添加了一个 `TextView` 控件：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:id=\"@+id/activity_main\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    android:paddingLeft=\"16dp\"\n    android:paddingTop=\"16dp\"\n    android:paddingRight=\"\
  16dp\"\n    android:paddingBottom=\"16dp\"\n    tools:context=\".MainActivity\"\
  >\n    <Button\n        android:text=\"@string/button_string\"\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:id=\"\
  @+id/button\"\n        app:layout_constraintBottom_toBottomOf=\"parent\"\n     \
  \   app:layout_constraintEnd_toEndOf=\"parent\"\n        app:layout_constraintStart_toStartOf=\"\
  parent\"\n        app:layout_constraintTop_toTopOf=\"parent\" />\n    <TextView\n\
  \        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
  wrap_content\"\n        android:id=\"@+id/textView\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n\n\n\n\n到本书为止，所有的用户界面设计任务都是使用 Android Studio Layout Editor 工具完成的，涵盖了文本模式或设计模式。编写\
  \ XML 资源文件或使用 Android Studio Layout Editor 的替代方案，是编写 Java 代码来直接创建、配置和操作构成 Android\
  \ Activity 用户界面的视图（view）对象。在本章中，我们将在描述一些如视图属性以及布局约束的创建与管理等关键概念之前，先探索使用 Java 代码创建用户界面的的一些优点和缺点。\n\
  \n在下一章节中，将创建并使用一个示例项目，以演示这种创建 Android 用户界面的方法所涉及的一些典型步骤。\n\n## 23.1 Java 代码与 XML\
  \ 布局文件的对比\n\n与编写 Java 代码相比，使用 XML 资源文件设计用户界面具有许多关键优势。事实上，Google 在 Android 文档中花费了大量篇幅来极力推崇\
  \ XML 资源优于 Java 代码的优点。正如上一节所讨论的，XML 方法的一个关键优势包括可以使用 Android Studio Layout Editor\
  \ 工具，该工具本身就会生成 XML 资源。另一个优势是，一旦创建了应用程序，只需通过修改 XML 文件即可对用户界面屏幕进行更改，从而避免了重新编译应用程序的必要性。此外，即使是手动编写\
  \ XML 布局，也可以通过 Android Studio Layout Editor 工具的预览功能获取用户界面外观的实时反馈。而要测试由 Java 创建的用户界外观，开发者不可避免地将反复通过编写代码、编译和测试的循环，以完成设计工作。\n\
  \n在 Java 代码创建布局的优势方面，Java 相比 XML 资源文件最显著的优势体现在处理动态用户界面时。XML 资源文件在定义静态布局时本质上最有用，换句话说，就是那些在每次调用\
  \ Activity 之间不太可能发生显著更改的布局。相反，Java 代码非常适合在运行时动态创建用户界面。这在用户界面可能受外部因素影响而在每次执行 Activity\
  \ 时显示不同的情况下特别有用。\n\n当需要在 Activity 运行时实时对基于静态 XML 资源的布局进行动态更改时，在 Java 代码中处理用户界面组件的知识也会有用。\n\
  \n最后，某些开发者无论后续方法提供的优点如何，只是倾向于编写 Java 代码而不是使用布局工具和 XML。\n\n## 23.2 创建视图 (Views)\n\
  \n如前，Android SDK 包含了一个视图类工具箱，旨在满足大多数基础用户界面设计需求。在 Java 中创建视图只需创建这些类的实例，并传递与该视图关联的\
  \ Activity 引用作为参数即可。\n\n第一个视图（通常是容器视图，可以向其添加额外的子视图）通过调用 Activity 的 `ContentView()`\
  \ 方法显示给用户。可以通过调用对象的 `addView()` 方法向根视图添加额外的视图。\n\n当使用 Java 代码操作 XML 布局资源文件中包含的视图时，必须获取视图的\
  \ ID。这一规则对于在 Java 中创建的视图同样适用。因此，对于在后续 Java 代码中需要进行某些类型访问的任何视图，必须为其分配一个 ID。这通过调用相关视图对象的\
  \ `setId()` 方法来实现。在随后的代码中，可以通过对象的 `getId()` 方法获取视图的 ID。\n\n## 23.3 视图属性 (View Attributes)\n\
  \n每个视图类都关联有一系列属性。这些属性设置直接作用在视图实例上，通常定义了视图对象将如何外观或行为。属性的示例包括在 `Button` 对象上显示的文本，或者\
  \ `ConstraintLayout` 视图的背景颜色。Android SDK 中的每个视图类都有一组预定义的方法，允许用户设置和获取这些属性值。例如，`Button`\
  \ 类有一个 `setText()` 方法，可以在 Java 代码内部调用，将按钮上显示的文本设置为特定的字符串值。另一方面，`ConstraintLayout`\
  \ 对象的背景颜色可以通过调用对象的 `setBackground()` 方法来设置。\n\n## 23.4 约束集 (Constraint Sets)\n\n\
  虽然属性设置是视图内部的并决定了视图的外观和行为，但约束集用于控制视图相对于其父视图和其他兄弟视图的外观。每个 `ConstraintLayout` 实例都关联有一组约束，定义了其子视图的位置和约束方式。\n\
  \n在 Java 代码中处理约束集的关键是 `ConstraintSet` 类。该类包含系列方法，允许执行诸如创建、配置和将约束应用于 `ConstraintLayout`\
  \ 实例等任务。此外，`ConstraintLayout` 实例的当前约束可以复制到 `ConstraintSet` 对象中，并用于将相同的应用于应用于布局（可以或不包含修改）。\n\
  \n`ConstraintSet` 实例的就像创建任何其他 Java 对象一样：\n\n```\nConstraintSet set = new ConstraintSet();\n\
  ```\n\n一旦创建了约束集，就可以在该实例上调用方法来执行广泛的任务。\n\n### 23.4.1 建立连接\n\n`ConstraintSet` 类的 `connect()`\
  \ 方法用于建立视图之间的约束连接。以下代码配置了一个约束集，其中 `Button` 视图的左侧连接到 `EditText` 视图的右侧，间距为 70dp：\n\
  \n```\nset.connect(button1.getId(), ConstraintSet.LEFT,\n             editText1.getId(),\
  \ ConstraintSet.RIGHT, 70);\n```\n\n### 23.4.2 将约束应用于布局\n\n一旦配置了约束集，必须将其应用于 `ConstraintLayout`\
  \ 实例才能生效。约束集通过调用 `applyTo()` 方法应用，并传递要应用设置的布局引用：\n\n```\nset.applyTo(myLayout);\n\
  ```\n\n### 23.4.3 父约束连接\n\n也可以通过引用 `ConstraintSet.PARENT_ID` 常量在子视图与其父 `ConstraintLayout`\
  \ 之间建立连接。在以下示例中，配置约束集将 `Button` 视图的顶部连接到父布局的顶部，间距为 100dp：\n\n```\nset.connect(button1.getId(),\
  \ ConstraintSet.TOP,\n             ConstraintSet.PARENT_ID, ConstraintSet.TOP, 100);\n\
  ```\n\n### 23.4.4 尺寸约束\n\n有许多方法可控制视图的尺寸行为。例如，以下代码将 `Button` 视图的水平尺寸设置为 `wrap_content`，并将\
  \ `ImageView` 实例的垂直尺寸最大为 250dp：\n\n```\nset.constrainWidth(button1.getId(), ConstraintSet.WRAP_CONTENT);\n\
  set.constrainMaxHeight(imageView1.getId(), 250);\n```\n\n### 23.4.5 约束偏移 (Constraint\
  \ Bias)\n\n\n\n\n\n正如《Android Studio 中使用 ConstraintLayout 指南》章节中所述，当一个视图具有对立的约束时，它将沿着约束轴（即水平或垂直方向）居中。这种居中位置可以通过在特定的约束轴上应用偏移（bias）来调整。当使用\
  \ Android Studio 布局编辑器时，这可以通过属性（Attributes）工具窗口中的控件来实现。然而，在处理约束集（constraint set）时，可以使用\
  \ `setHorizontalBias()` 和 `setVerticalBias()` 方法添加偏移，这些方法引用视图 ID 和作为 0 到 1 之间浮点值的偏移值。\n\
  \n例如，以下代码将 `Button` 的左侧和右侧约束到父布局的相应侧边，然后应用 25% 的水平偏移：\n\n```java\nset.connect(button1.getId(),\
  \ ConstraintSet.LEFT, ConstraintSet.PARENT_ID, ConstraintSet.LEFT, 0);\nset.connect(button1.getId(),\
  \ ConstraintSet.RIGHT, ConstraintSet.PARENT_ID, ConstraintSet.RIGHT, 0);\nset.setHorizontalBias(button1.getId(),\
  \ 0.25f);\n```\n\n### 23.4.6 对齐约束\n\n也可以使用约束集来应用对齐设置。Android Studio 布局编辑器提供的全套对齐选项也可以通过\
  \ `centerVertically()` 和 `centerHorizontally()` 方法使用约束集进行配置，这两个方法都根据正在配置的对齐方式接收各种参数。此外，可以使用\
  \ `center()` 方法将一个视图在两个其他视图之间居中。\n\n在在下面的代码中，`button2` 的位置设置使其与 `button1` 在水平方向对齐：\n\
  \n```java\nset.centerHorizontally(button2.getId(), button1.getId());\n```\n\n###\
  \ 23.4.7 复制和应用约束集\n\n`ConstraintLayout` 实例的当前约束集可以使用 `clone()` 方法复制到约束集对象中。例如，下行代码将名为\
  \ `myLayout` 的 `ConstraintLayout` 实例的约束设置复制到一个约束集对象中：\n\n```java\nset.clone(myLayout);\n\
  ```\n\n一旦复制，可以将约束集直接应用到另一个布局，或者像下面的示例所示，在应用到第二个布局之前进行修改：\n\n```java\nConstraintSet\
  \ set = new ConstraintSet();\nset.clone(myLayout);\nset.constrainWidth(button1.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\nset.applyTo(mySecondLayout);\n```\n\n### 23.4.8\
  \ ConstraintLayout 链（Chains）\n\n也可以使用 `createHorizontalChain()` 和 `createVerticalChain()`\
  \ 方法在约束集中创建垂直和水平链。使用这些方法的语法如下：\n\n```java\ncreateHorizontalChain(int leftId, int\
  \ leftSide, int rightId, int rightSide, int[] chainIds, float[] weights, int style);\n\
  ```\n\n根据上述语法，以下示例创建了一个从 `button1` 开始并以 `button4` 结束的水平分布链（spread chain）。在这些视图之间是\
  \ `button2` 和 `button3`，它们的权重都被设置为零：\n\n```java\nint[] chainViews = {button2.getId(),\
  \ button3.getId()};\nfloat[] chainWeights = {0, 0};\nset.createHorizontalChain(button1.getId(),\
  \ ConstraintSet.LEFT, button4.getId(), ConstraintSet.RIGHT, chainViews, chainWeights,\
  \ ConstraintSet.CHAIN_SPREAD);\n```\n\n可以通过将要移除的视图的 ID 传递给 `removeFromHorizontalChain()`\
  \ 或 `removeFromVerticalChain()` 方法从链中移除视图。可以使用 `addToHorizontalChain()` 或 `addToVerticalChain()`\
  \ 方法将视图添加到现有的链中。在这两种情况下，方法接收的参数是用于插入新视图的两个视图之间的 ID，如下：\n\n```java\nset.addToHorizontalChain(newViewId,\
  \ leftViewId, rightViewId);\n```\n\n### 23.4.9 引导线（Guidelines）\n\n使用 `create()`\
  \ 方法向约束集中添加引导线，然后使用 `setGuidelineBegin()`、`setGuidelineEnd()` 或 `setGuidelinePercent()`\
  \ 方法进行定位。在下面的代码中，创建了一个垂直引导线并将其定位在父布局宽度的 50% 处。然后将按钮视图的左侧无边距地连接到该引导线：\n\n```java\n\
  set.create(R.id.myGuideline, ConstraintSet.VERTICAL_GUIDELINE);\nset.setGuidelinePercent(R.id.myGuideline,\
  \ 0.5f);\nset.connect(button.getId(), ConstraintSet.LEFT, R.id.myGuideline, ConstraintSet.LEFT,\
  \ 0);\nset.applyTo(layout);\n```\n\n### 23.4.10 移除约束\n\n可以使用 `clear()` 方法从视图中移除约束，通过参数传递视图以及要移除约束的锚点点：`set.clear(view,\
  \ ConstraintSet.LEFT)`。同样，通过在 `clear()` 方法中引用视图，可以一步移除视图上的所有约束：`set.clear(view)`。\n\
  \n### 23.4.11 缩放\n\n可以使用 `setScaleX()` 和 `setScaleY()` 方法调整布局内视图的缩放，这些方法接收要执行操作的视图以及一个表示缩放比例的浮点值。在下面的代码中，一个按钮对象被缩放为宽度的两倍和高度的一半：\n\
  \n```java\nset.setScaleX(myButton.getId(), 2f);\nset.setScaleY(myButton.getId(),\
  \ 0.5f);\n```\n\n### 23.4.12 旋转\n\n可以使用 `setRotationX()` 和 `setRotationY()` 方法分别在\
  \ X 轴或 Y 轴上旋转视图，这两个方法都必须接收视图的 ID 和表示旋转角度的浮点值。执行旋转的中心点可以通过 `setTransformPivot()`、`setTransformPivotX()`\
  \ 和 `setTransformPivotY()` 方法定义。下面的代码在 500、500 处的中心点沿 Y 轴旋转按钮 30 度：\n\n```java\n\
  set.setTransformPivot(button.getId(), 500, 500);\nset.setRotationY(button.getId(),\
  \ 30);\n```\n\n### 23.5 总结\n\n正如章节所述，可以使用 Java 代码动态创建约束。使用 Java 代码创建布局包括创建类的实例并为这些对象设置属性以定义所需的外观和行为。\n\
  \n视图相对于 `ConstraintLayout` 父视图以及任何兄弟视图的位置和大小是通过使用约束集来定义的。约束集由 `ConstraintSet` 类的实例表示，一旦创建，就可以通过各种方法调用来执行建立约束连接、控制视图大小行为和创建链等任务。\n\
  \n在本章涵盖了 `ConstraintSet` 类的基础知识后，下一章将通过教程把这些功能付诸实践。\n\n# 24 Android ConstraintSet\
  \ 教程\n\n上一章介绍了使用 Java 代码创建和修改用户界面布局的基本概念，使用了 `ConstraintLayout` 和 `ConstraintSet`\
  \ 类。本章将通过创建一个完全使用 Java 代码创建且不使用 Android Studio 布局工具的示例布局，将这些概念付诸实践。\n\n## 24.1 在\
  \ Android Studio 中创建示例项目\n\n\n\n\n在 `Name` 字段中输入 `JavaLayout`，并指定 `com.ebookfrenzy.javalayout`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单更改为 `Java`。\n\n项目创建完成后，`MainActivity.java` 文件将自动加载到编辑面板。正如我们预期的那样，Android\
  \ Studio 创建了一个模板 Activity 并重写了 `onCreate()` 方法，这为添加 Java 代码以创建用户界面提供了一个理想的位置。\n\n\
  ## 24.2 向 Activity 添加视图\n\n目前 `onCreate()` 方法被设计为使用资源布局文件作为用户界面。因此，首先从该方法中删除此行代码：\n\
  \n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n   \
  \ super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_main);\n\
  }\n```\n\n下一次修改是向 Activity 添加一个包含单个 `Button` 视图子控件的 `ConstraintLayout` 对象。这涉及创建\
  \ `ConstraintLayout` 和 `Button` 类的新实例。然后需要将 `Button` 视图作为子视图添加到 `ConstraintLayout`\
  \ 视图中，通过调用 Activity 实例的 `setContentView()` 方法显示：\n\n```java\npackage com.ebookfrenzy.javalayout;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\n\
  import androidx.constraintlayout.widget.ConstraintLayout;\nimport android.widget.Button;\n\
  import android.widget.EditText;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        configureLayout();\n    }\n\
  \n    private void configureLayout() {\n        Button myButton = new Button(this);\n\
  \        ConstraintLayout myLayout = new ConstraintLayout(this);\n        myLayout.addView(myButton);\n\
  \        setContentView(myLayout);\n    }\n}\n```\n\n当以这种方式创建用户界面对象的新实例时，必须向构造方法传递创建对象时的上下文，在本例中，它是当前\
  \ Activity。由于上述代码位于 Activity 类内部，因此通过标准的 `this` 关键字即可引用上下文：\n\n```java\nButton myButton\
  \ = new Button(this);\n```\n\n完成上述添加后，编译并运行应用程序（在物理设备或模拟器上）。启动后，可见的运行是在 `ConstraintLayout`\
  \ 视图的左上角出现一个没有任何文本的按钮，如图 24-1 所示：\n\n![](img/Image24351.jpg)\n\n图 24-1\n\n## 24.3\
  \ 设置视图属性\n\n出于本次练习的目的，我们需要将 `ConstraintLayout` 视图的背景设置为蓝色，并让 `Button` 视图在黄色背景上显示“Press\
  \ Me”文本。这两项任务都可以通过如下代码片段所示，在 Java 代码中设置视图的属性来实现。为了让按钮上的文字能够翻译成其他语言，将将其作为 `String`\
  \ 资源添加。在 Project 工具窗口中，找到 `app -> res -> values -> strings.xml` 文件并修改它以为“Press Me”字符串添加资源值：\n\
  \n```xml\n<resources>\n    <string name=\"app_name\">JavaLayout</string>\n    <string\
  \ name=\"press_me\">Press Me</string>\n</resources>\n```\n\n虽然这是处理代码中直接引用字符串的推荐方法，但为了避免在书后续部分重复此步骤，许多后续代码示例将直接在代码中输入字符串。\n\
  \n一旦字符串存储为资源，就可以如下方式从代码内部访问：\n\n```java\ngetString(R.string.press_me);\n```\n\n\
  创建字符串资源后，在 `configureLayout()` 方法中添加代码以设置按钮文本和颜色属性：\n\n```java\nimport android.graphics.Color;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private void configureLayout()\
  \ {\n        Button myButton = new Button(this);\n        myButton.setText(getString(R.string.press_me));\n\
  \        myButton.setBackgroundColor(Color.YELLOW);\n        ConstraintLayout myLayout\
  \ = new ConstraintLayout(this);\n        myLayout.setBackgroundColor(Color.BLUE);\n\
  \        myLayout.addView(myButton);\n        setContentView(myLayout);\n    }\n\
  }\n```\n\n现在编译并运行应用程序时，布局将反映这些设置，布局将呈现蓝色背景，且按钮将在黄色背景上显示文本。\n\n## 24.4 创建视图 ID\n\n\
  在 `ConstraintSet` 类中引用视图之前，必须为它们分配唯一的 ID。此过程的第一步是创建一个资源文件。右键点击 `app -> res`，选择 New\
  \ -> Resource File 并将其命名为 `id`。创建资源文件后，编辑其内容如下：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<resources>\n    <id name=\"myButton\"/>\n    <id name=\"\
  editText\"/>\n</resources>\n```\n\n在教程的此阶段，只创建了 `Button`，因此编辑 `configureLayout()`\
  \ 方法将 ID 分配给对象：\n\n```java\nprivate void configureLayout() {\n    Button myButton\
  \ = new Button(this);\n    myButton.setText(getString(R.string.press_me));\n   \
  \ myButton.setBackgroundColor(Color.YELLOW);\n    myButton.setId(R.id.myButton);\n\
  }\n```\n\n## 24.5 配置约束集\n\n在没有任何约束的情况下，`ConstraintLayout` 视图将 `Button` 视图放置在左上角。为了指示布局视图将按钮放在不同的位置（在本例中为水平和垂直居中），有必要创建一个\
  \ `ConstraintSet` 实例，用适当的设置对其初始化，并将其应用到布局。对于此示例，按钮需要被约束，使其宽度和高度限制在文本的大小。再次编辑 `configureLayout()`\
  \ 方法以进行这些更改：\n\n```java\nimport androidx.constraintlayout.widget.ConstraintSet;\n\
  \n// ...\n    Button myButton = new Button(this);\n    myButton.setText(getString(R.string.press_me));\n\
  \    myButton.setBackgroundColor(Color.YELLOW);\n    myButton.setId(R.id.myButton);\n\
  \    ConstraintLayout myLayout = new ConstraintLayout(this);\n    myLayout.setBackgroundColor(Color.BLUE);\n\
  \    myLayout.addView(myButton);\n    setContentView(myLayout);\n\n    ConstraintSet\
  \ set = new ConstraintSet();\n    set.constrainHeight(myButton.getId(), ConstraintSet.WRAP_CONTENT);\n\
  \    set.constrainWidth(myButton.getId(), ConstraintSet.WRAP_CONTENT);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.START, myLayout.PARENT_ID, ConstraintSet.START, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.END, myLayout.PARENT_ID, ConstraintSet.END, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.TOP, myLayout.PARENT_ID, ConstraintSet.TOP, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.BOTTOM, myLayout.PARENT_ID, ConstraintSet.BOTTOM, 0);\n    set.applyTo(myLayout);\n\
  ```\n\n配置好初始约束后，编译并运行应用程序，验证按钮视图现在是否出现在布局中心：\n\n![](img/Image2444.jpg)\n\n图 24-2\n\
  \n## 24.6 添加 EditText 视图\n\n要添加到布局的下一个项是 `EditText` 视图。第一步是创建 `EditText` 对象，为其分配在\
  \ `id.xml` 资源文件中声明的 ID，并将其添加到布局中。实现这些步骤的更改更改现在需要对 `configureLayout()` 方法如下进行：\n\n\
  \n\n\n\n```java\nprivate void configureLayout() {\n    Button myButton = new Button(this);\n\
  \    myButton.setText(getString(R.string.press_me));\n    myButton.setBackgroundColor(Color.YELLOW);\n\
  \    myButton.setId(R.id.myButton);\n    EditText myEditText = new EditText(this);\n\
  \    myEditText.setId(R.id.myEditText);\n    ConstraintLayout myLayout = new ConstraintLayout(this);\n\
  \    myLayout.setBackgroundColor(Color.BLUE);\n    myLayout.addView(myButton);\n\
  \    myLayout.addView(myEditText);\n    setContentView(myLayout);\n}\n```\n\n`EditText`\
  \ 小组件的大小旨在根据其显示的内容调整，在布局中水平居中，并位于现有 `Button` 视图上方 70dp 处.为 `configureLayout()` 方法添加代码，使其内容如下：\n\
  \n```java\nset.connect(myButton.getId(), ConstraintSet.START, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.START, 0);\nset.connect(myButton.getId(), ConstraintSet.END, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.END, 0);\nset.connect(myButton.getId(), ConstraintSet.TOP, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.TOP, 0);\nset.connect(myButton.getId(), ConstraintSet.BOTTOM, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.BOTTOM, 0);\nset.constrainHeight(myEditText.getId(), ConstraintSet.WRAP_CONTENT);\n\
  set.constrainWidth(myEditText.getId(), ConstraintSet.WRAP_CONTENT);\nset.connect(myEditText.getId(),\
  \ ConstraintSet.START, ConstraintSet.PARENT_ID, ConstraintSet.START, 0);\nset.connect(myEditText.getId(),\
  \ ConstraintSet.END, ConstraintSet.PARENT_ID, ConstraintSet.END, 0);\nset.connect(myEditText.getId(),\
  \ ConstraintSet.BOTTOM, myButton.getId(), ConstraintSet.TOP, 70);\nset.applyTo(myLayout);\n\
  ```\n\n运行应用程序测试应显示 `EditText` 字段在按钮上方居中，并有 70dp 的间距。\n\n### 24.7 将密度无关像素 (dp) 转换为像素\
  \ (px)\n\n此练习中的下一个任务是将 `EditText` 视图的宽度设置为 200dp。正如名为\"Android Studio 布局编辑器 ConstraintLayout\
  \ 教程”的章节所述，在用户界面布局中设置大小和位置时，使用密度无关像素 (dp) 比像素 (px) 更好。使用 dp 设置位置，需要在运行时将 `dp` 值转换为\
  \ `px` 值，并考虑设备屏幕的密度。因此，为了将 `EditText` 视图的宽度设置为 200dp，需要在类中添加以下代码：\n\n```java\npackage\
  \ com.ebookfrenzy.javalayout;\n\nimport android.content.res.Resources;\nimport android.util.TypedValue;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private int convertToPx(int\
  \ value) {\n        Resources r = getResources();\n        int px = (int) TypedValue.applyDimension(\n\
  \            TypedValue.COMPLEX_UNIT_DIP, value,\n            r.getDisplayMetrics());\n\
  \        return px;\n    }\n\n    private void configureLayout() {\n        Button\
  \ myButton = new Button(this);\n        myButton.setText(getString(R.string.press_me));\n\
  \        myButton.setBackgroundColor(Color.YELLOW);\n        myButton.setId(R.id.myButton);\n\
  \        EditText myEditText = new EditText(this);\n        myEditText.setId(R.id.myEditText);\n\
  \        int px = convertToPx(200);\n        myEditText.setWidth(px);\n    }\n}\n\
  ```\n\n再次编译并运行应用程序，并注意 `EditText` 字段在按钮上方居中，并有 70dp 的间距。\n\n## 24.8 总结\n\n运行应用程序测试应显示\
  \ `EditText` 字段在按钮上方居中，并有 70dp 的间距。\n\n在本章中，我们学习了如何在 `ConstraintLayout` 中使用 `Button`\
  \ 和 `EditText` 小组件。我们还学习了如何使用 `ConstraintSet` 定义视图之间的约束。最后，我们学习了如何将 `dp` 转换为 `px`。\n\
  \n### 25.1 引入 Apply Changes\n\n在 Android Studio 的早期版本中，每次需要更改时，Android Studio 都会编译代码、将其转换为\
  \ Dex 格式、生成 APK 包并安装到设备上。\n\n### 25.2 理解 Apply Changes 选项\n\nAndroid Studio 提供了三种形式的对运行中的应用应用更改选项：\n\
  \n-   **运行应用 (Run App)**：停止当前运行的应用程序并重启它。如果自启动以来项目未发生任何更改，此选项将简单地重启应用程序。另一方面，如果项目已发生更改，Android\
  \ Studio 将重新构建并安装应用程序。\n-   **应用更改 (Apply Changes)**：当对项目的唯一更改涉及修改现有方法的体或添加了新类或方法时，可以使用此选项。选中后，更改将应用于运行中的应用程序，而无需重启应用程序或当前运行的活动。然而，当对布局文件等任何项目资源进行更改时，无法使用此模式。其他限制还包括删除方法、更改方法签名、重命名类以及其他结构性代码更改。如果对项目清单进行了更改，无法使用此选项。\n\
  -   **应用更改并重启活动 (Apply Changes and Restart Activity)**：选中后，此模式将动态应用项目内做的任何代码或资源更改，并重启活动，而无需重新安装或重启应用程序。\n\
  \n### 25.3 使用 Apply Changes\n\n在涵盖了 Android 开发的一些概念后，现在是引入 Apply Changes 的好时机。\n\
  \n\n\n\n\n当项目已加载到 Android Studio 但尚未在设备或模拟器上运行时，可以像往常一样使用位于工具栏上的运行（在图 25-1 中标记为\
  \ A）或调试（B）按钮来启动：\n\n![](img/as_3.6_run_debug_toolbar_buttons.jpg)\n\n图 25-1\n\n\
  应用启动并运行后，运行按钮上的图标将发生更改，表示应用正在运行，并且 `Apply Changes`（应用更改）、`Restart Activity`（重启活动）和\
  \ `Apply Code Changes`（应用代码更改）按钮将启用，如下方的图 25-2 所示：\n\n![](img/as_3.5_apply_changes_labelled_buttons.jpg)\n\
  \n图 25-2\n\n如果在选择其中一个 `Apply Changes` 按钮时无法应用更改，Android Studio 将显示一条指示失败的消息并附带说明。例如，图\
  \ 25-3 显示了在对资源文件进行更改后选择 `Apply Code Changes`选项时 Android Studio 显示的消息：\n\n![](img/as_apply_changes_resource_error.jpg)\n\
  \n图 25-3\n\n在这种情况下，解决方案是使用 `Apply Changes` 和 `Restart Activity` 选项（提供了相应的链接）。同样，当尝试应用涉及方法的添加或删除的更改时，将出现以下消息：\n\
  \n![](img/as_apply_changes_method_error.jpg)\n\n图 25-4\n\n在这种情况下，唯一的选项是点击 `Run App`\
  \ 按钮以重新安装并启动应用。作为在这些情况下手动选择正确选项的替代方案，Android Studio 可以配置为自动回退到执行 `Run App` 操作。\n\
  \n### 25.4 配置 Apply Changes 回退设置\n\n`Apply Changes` 回退设置位于 Android Studio 的 `Preferences`（偏好设置）窗口中，通过选择\
  \ `File`（文件）-> `Settings`（设置）菜单显示（macOS 为 Android Studio -> `Preferences`）。在 `Preferences`\
  \ 对话框中，选择左侧面板中的 `Build, Execution, Deployment`（构建、执行、部署）项，然后选择图 25-5 所示的 `Deployment`：\n\
  \n![](img/as_3.5_apply_changes_preferences.jpg)\n\n图 25-5\n\n一旦启用了所需的选项，点击 `Apply`（应用）然后点击\
  \ `OK` 按钮提交更改并关闭对话框。启用这些默认设置后，Android Studio 将需要需要自动重新安装并重启应用。\n\n### 25.5 Apply\
  \ Changes 教程\n\n启动 Android Studio，从欢迎界面选择 `New Project`（新建项目）选项，并在弹出的新项目对话框中，点击\
  \ `Next`（下一步）按钮之前选择 `Basic Activity (Material3)` 模板。\n\n在 `Name`（名称）字段中输入 `ApplyChanges`\
  \ 并指定 `com.ebookfrenzy.applychanges` 为包名。在点击 `Finish`（完成）按钮之前，将 `Minimum API level`（最低\
  \ API 级别）设置改为 `API 26`：Android 8.0 (Oreo)，并将 `Language`（语言）菜单更改为 `Java`。\n\n###\
  \ 25.6 使用 Apply Code Changes\n\n首先点击 `run` 按钮并选择合适的模拟器或物理设备作为 `run target`（运行目标）。点击\
  \ `run` 按钮后，跟踪示例应用出现在设备或模拟器上之前的时间。\n\n运行后，点击操作按钮（位于屏幕右下角的显示信封图标的按钮）。注意会出现一个 `Snackbar`\
  \ 实例显示内容为“Replace with your own action”的文本，如图 25-6 所示：\n\n![](img/as_apply_changes_snackbar.jpg)\n\
  \n图 25-6\n\n一旦应用运行，`Apply Changes` 按钮应该是启用，表示某些项目更改可以在无需重新安装和重启应用的情况下应用。要查看此效果，编辑\
  \ `MainActivity.java` 文件，找到 `onCreate` 方法并修改操作代码，以便在选择操作按钮时显示不同的消息：\n\n```\nbinding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n    @Override\n    public void onClick(View view) {\n\
  \        Snackbar.make(view, \"Apply Changes is Amazing!\", Snackbar.LENGTH_LONG)\n\
  \                 .setAction(\"Action\", null).show();\n    }\n});\n```\n\n实现代码更改后，点击\
  \ `Apply Code Changes` 按钮，注意几秒钟内会出现一条消息指示应用已更新。点击操作按钮并注意现在 `Snackbar` 中显示了新消息。\n\
  \n### 25.7 使用 Apply Changes 和 Restart Activity\n\n任何资源更改都要求使用 `Apply Changes` 和\
  \ `Restart Activity` 选项。在 Android Studio 中，选择 `app` -> `res` -> `layout` -> `fragment_first.xml`\
  \ 布局文件。在 `Design` 模式下使用 `Layout Editor` 工具，选择默认的 `TextView` 组件，并在属性工具窗口中将 `text`\
  \ 属性更改为“Hello Android”。\n\n点击 `Apply Code Changes` 按钮之前，确保上述“Configuring Apply Changes\
  \ Fallback Settings”中概述的回退选项已关闭。注意由于此更改涉及项目资源，请求是失败的。点击 `Apply Changes` 和 `Restart\
  \ Activity` 按钮，并验证活动已重启并在 `TextView` 中显示。\n\n### 25.8 使用 Run App\n\n如前所述，方法的更改都需要重新安装并启动应用。为了体验这一点，编辑\
  \ `MainActivity.java` 文件并在 `onCreate` 方法之后添加新方法：\n\n```java\npublic void demoMethod()\
  \ {\n}\n```\n\n使用 `Apply Code Changes` 按钮，并注意请求失败。在更改后运行应用程序的唯一方法是点击 `Run App` 按钮。\n\
  \n### 25.9 总结\n\n`Apply Changes` 是 Android Studio 的一项功能，旨在加速开发应用时的代码、构建和运行周期。`Apply\
  \ Changes` 功能可以在许多情况下无需重新安装甚至重启应用即可将更改推送到运行应用。\n\n# 26. 事件处理概述与示例\n\n在之前的章节中已经涵盖了大量的\
  \ Android 用户界面设计。然而，尚未涵盖的一个领域涉及用户与界面的交互如何触发底层活动执行任务。换句话说，通过之前的章节知道如何创建一个用户界面，但不知道当用户触摸时会发生什么。因此，本章的主要目标是提供\
  \ Android 事件处理的概述，并提供一个基于 Android Studio 的示例项目。\n\n## 26.1 理解事件\n\nAndroid 事件有多种形式，但通常是响应外部动作产生的。Android\
  \ 框架维护一个事件队列，事件在发生时被放入队列中。然后按照先入先出（FIFO）的原则从队列中移除。对于输入事件（如触摸屏幕），事件将传递给位于屏幕上触摸位置的视图。除了事件通知外，视图还会接收有关事件性质的范围（取决于事件类型）的信息。\n\
  \n\n\n\n为了能够处理传递过的事件，视图（view）必须配备事件监听器。所有用户界面组件都派自 `View` 类，该类包含一系列事件监听器接口，每个接口都包含一个回调方法的抽象声明。为了能够响应特定类型的事件，视图必须注册相应的事件监听器并实现相应的回调。例如，如果按钮要响应点击事件（等同于用户触摸并释放按钮视图，就像点击物理按钮一样），它必须同时注册\
  \ `View.onClickListener` 事件监听器（通过调用目标视图的 `setOnClickListener()` 方法）并实现相应的 `onClick()`\
  \ 回调方法。如果在屏幕上按钮视图的位置检测到“点击”事件，Android 框架将在该事件从事件队列中被移除时，调用该视图的 `onClick()` 方法。当然，任何应该在响应按钮点击时执行的任务或应调用的其他方法，都应该在\
  \ `onClick()` 回调方法的实现中完成。\n\n对不起，翻译如下：\n\n## 26.2 使用 android:onClick 资源\n\n在详细探索事件监听器之前，值得注意的是，当仅需在用户在用户界面“点击”按钮视图时调用回调方法时，可以使用一种快捷方式。考虑一个包含名为\
  \ `button1` 的按钮视图的用户界面布局，其要求是当用户触摸按钮时，调用在 activity 类中声明的名为 `buttonClick()` 方法。实现此行为只需要编写\
  \ `buttonClick()` 方法（该方法接收触发点击事件的视图引用作为参数），并在 XML 文件中按钮视图的声明中添加一行即可。例如：\n\n```xml\n\
  <Button\n    android:id=\"@+id/button1\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"\n    android:onClick=\"buttonClick\"\
  \n    android:text=\"Click me\" />\n```\n\n这提供了一种捕获点击事件的简单方法。然而，它没有提供事件处理器所提供的范围选项，而事件处理器是本章其余部分的主题。正如后续章节概述的，`onClick`\
  \ 属性在涉及片段（fragments）的布局中也有局限性。在 Android Studio 布局编辑器中工作时，当设备屏幕布局中选择合适的视图类型时，可以在属性（Attributes）面板中找到并配置\
  \ `onClick` 属性。\n\n## 26.3 事件监听器和回调方法\n\n在本章稍后概述的示例 activity 中，将详细介绍注册事件监听器和实现回调方法的涉及步骤。但在在此之前，值得花一些时间概述\
  \ Android 框架中提供的事件监听器以及每个监听器相关的回调方法。\n\n- `onClickListener` – 用于检测点击样式事件，即用户触摸然后释放由视图占据的设备显示区域。对应于\
  \ `onClick()` 回调方法，该方法将接收事件的视图引用作为参数传递。\n- `onLongClickListener` – 用于检测用户是否在视图上长时间触摸。对应于\
  \ `onLongClick()` 回调方法，该方法将接收事件的视图作为参数传递。\n- `onTouchListener` – 用于检测与触摸屏的任何形式的接触，包括单个或多次触摸以及手势动作。对应\
  \ `onTouch()` 回调，此主题将在题为 [Android Touch and Multi-touch Event Handling] 的章节中进行详细介绍。回调方法将接收事件的视图和一个\
  \ `MotionEvent` 对象作为参数传递。\n- `onCreateContextMenuListener` – 监听由于长按产生的上下文菜单创建。对应于\
  \ `onCreateContextMenu()` 回调方法。回调将接收菜单、接收事件的视图和一个菜单上下文对象。\n- `onFocusChangeListener`\
  \ – 检测由于与轨迹球或导航键交互导致焦点移离当前视图。对应于 `onFocusChange()` 回调方法，该方法将接收事件的视图和一个用于指示焦点获得或丢失的\
  \ `Boolean` 值。\n- `onKeyListener` – 用于检测当视图拥有焦点时按了设备上的按键。对应于 `onKey()` 回调方法。传递接收事件的视图、所按物理键的\
  \ `KeyCode` 和一个 `KeyEvent` 对象作为参数。\n\n## 26.4 事件处理示例\n\n在本章的剩余部分中，我们将完成一个 Android\
  \ Studio 项目的创建，该项目旨在演示监听器和相应回调方法的实现，以检测用户何时点击按钮。回调方法中的代码将更新文本视图，以指示事件已处理。\n\n从欢迎屏幕上选择“New\
  \ Project”选项，在出现的新项目对话框中，在点击“Next”按钮之前选择“Empty Activity”模板。\n\n在 `Name` 字段中输入 `EventExample`，并指定\
  \ `com.ebookfrenzy.eventexample` 为包名。在点击“Finish”按钮之前，将最低 API 级别设置设置为 `API 26: Android\
  \ 8.0 (Oreo)`，并将语言菜单更改为 `Java`。按照章节 [11.8 Migrating a Project to View Binding] 中概述的步骤将项目转换为使用视图绑定（view\
  \ binding）。\n\n## 26.5 设计用户界面\n\n示例中 `MainActivity` 类的用户界面布局由一个 `ConstraintLayout`、一个\
  \ `Button` 和一个 `TextView` 组成，如图 [26-1] 所示。\n\n![](img/as_4.1_event_example_ui.jpg)\n\
  图 26-1\n\n找到并选择 Android Studio 创建的 `activity_main.xml` 文件（位于 Project 窗口的 `app ->\
  \ res -> layouts`），并双击它将其加载到布局编辑器中。\n\n确保已启用 `Autoconnect`，然后从调板中拖入一个 `Button` 组件并移动它，使其位于布局的水平中心，并在现有\
  \ `TextView` 组件的下方。当位置正确时，将组件释放到位，以便 autoconnect 系统添加相应的约束。\n\n选择“Hello World!”\
  \ `TextView` 组件，并使用属性面板将 ID 设置为 `statusText`。重复此步骤将 `Button` 组件的 ID 更改为 `myButton`。\n\
  \n通过点击布局编辑器工具栏中的 `Infer Constraints` 按钮添加任何缺失的约束。\n\n选中 `Button` 组件，使用属性面板将文本属性设置为\
  \ `Press Me`。使用位于布局编辑器右上角的黄色警告按钮（图 [26-2]）显示警告列表，并点击 “Fix” 按钮将按钮上的文本字符串提取到名为 `press_me`\
