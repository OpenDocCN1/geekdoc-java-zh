  \ 31-9\n\n在继续下一步之前，选择布局中的 `TextFragment` 实例，并在 Attributes 工具窗口中，将 fragment 的 ID\
  \ 更改为 `text_fragment`。\n\n## 31.7 让 Toolbar Fragment 与 Activity 通信\n\n当用户触摸 toolbar\
  \ fragment 中的按钮时，fragment 类需要从 `EditText` 视图获取文本以及 `SeekBar` 的当前值，并将它们发送到文本 fragment。如“Android\
  \ Fragments 简介” 所述，fragment 之间不应直接通信，而是应该使用嵌入它们的 activity 作为中介。\n\n此过程的第一步是确保 toolbar\
  \ fragment 对按钮点击事件有响应。我们还需要实现一些代码来跟踪 `SeekBar` 视图的值。为了本示例，我们将在 `ToolbarFragment`\
  \ 类中实现这些监听器。选择 `ToolbarFragment.java` 文件并对其修改，使其内容如下列表所示：\n\n```java\npackage com.ebookfrenzy.fragmentexample;\n\
  \n.\n\n.\n\nimport android.content.Context;\n\nimport android.widget.SeekBar;\n\n\
  public class ToolbarFragment extends Fragment implements SeekBar.OnSeekBarChangeListener\
  \ {\n\n    private static int seekvalue = 10;\n\n.\n\n.\n\n    @Override\n    public\
  \ void onViewCreated(@NonNull View view, @Nullable Bundle savedInstanceState) {\n\
  \        super.onViewCreated(view, savedInstanceState);\n        binding.seekBar1.setOnSeekBarChangeListener(this);\n\
  \        binding.button1.setOnClickListener(new View.OnClickListener() {\n     \
  \       public void onClick(View v) {\n                buttonClicked(v);\n     \
  \       }\n        });\n    }\n\n    public void buttonClicked(View view) {\n  \
  \  }\n\n    @Override\n    public void onProgressChanged(SeekBar seekBar, int progress,\
  \ boolean fromUser) {\n        seekvalue = progress;\n    }\n\n    @Override\n \
  \   public void onStartTracking(SeekBar arg0) {\n    }\n\n    @Override\n    public\
  \ void onStopTracking(SeekBar arg0) {\n    }\n}\n```\n\n在继续之前，我们需要花时间解释上述代码。首先，该类被声明实现了\
  \ `OnSeekBarChangeListener` 接口。这是因为用户界面包含一个 `SeekBar` 实例，且 fragment 需要在用户滑动滑条以更改字体大小时接收通知。实现\
  \ `OnSeekBarChangeListener` 接口要求实现 `onProgressChanged()`、`onStartTracking()` 和 `onStopTracking()`\
  \ 方法。这些方法已经实现，但实际上只需要 `onProgressChanged()` 方法来执行任务，在此情况下，即将新值存储在类开头声明的名为 `seekvalue`\
  \ 的变量中。此外（代码中未完全显示）还声明了一个变量用于存储对 `EditText` 对象的引用。添加 `onViewCreated()` 方法是为了在按钮上设置\
  \ `OnClickListener`，它被配置为在检测到点击事件时调用名为 `buttonClicked()` 的方法。该方法也已实现，尽管此时它没有做任何事情。\n\
  \n此过程的下一阶段是设置监听器，允许 fragment 在按钮被点击时调用 activity。这遵循上一章概述的机制：\n\n```java\npublic\
  \ class ToolbarFragment extends Fragment implements SeekBar.OnSeekBarChangeListener\
  \ {\n    private static int seekvalue = 10;\n    ToolbarListener activityCallback;\n\
  \n    public interface ToolbarListener {\n        public void onButtonClick(int\
  \ position, String text);\n    }\n\n    @Override\n    public void onAttach(Context\
  \ context) {\n        super.onAttach(context);\n        try {\n            activityCallback\
  \ = (ToolbarListener) context;\n        } catch (ClassCastException e) {\n     \
  \       throw new ClassCastException(context.toString() + \" must implement ToolbarListener\"\
  );\n        }\n    }\n.\n\n.\n\n    public void buttonClicked (View view) {\n  \
  \      activityCallback.onButtonClick(seekvalue, binding.editText1.getText().toString());\n\
  \    }\n}\n```\n\n上述实现将导致在用户点击按钮时，属于 activity 的 `onButtonClick()` 方法被调用。因此，剩下的工作是声明\
  \ activity 类实现了 `ToolbarListener` 并实现 `onButtonClick()` 方法。\n\n由于早期版本使用 Android\
  \ 支持库来支持 fragment，activity 还需要更改为继承 `FragmentActivity` 而不是 `AppCompatActivity`。将这些要求结合起来得到了如下\
  \ `MainActivity.java` 文件：\n\n```java\npackage com.ebookfrenzy.fragmentexample;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport androidx.fragment.app.FragmentActivity;\n\
  import android.os.Bundle;\n\npublic class MainActivity extends FragmentActivity\
  \ implements ToolbarFragment.ToolbarListener {\n\n.\n\n.\n\n    public void onButtonClick(int\
  \ fontsize, String text) {\n    }\n}\n```\n\n## 31.8 让 Activity 与 Text Fragment\
  \ 通信\n\n如“Android Fragments 简介”所述，activity 可以获取 fragment 类实例的引用并调用对象上的公共方法来与 fragment\
  \ 通信。因此，现在现在 `TextFragment` 类中实现一个名为 `changeTextProperties()` 的公共方法，该方法将字体大小整数和要显示的新文本字符串作为参数。该方法将使用这些值来修改\
  \ `TextView` 对象。在 Android Studio 编辑面板中，找到并修改 `TextFragment.java` 文件以添加此新方法：\n\n\
  ```java\npackage com.ebookfrenzy.fragmentexample;\n\n.\n\n.\n```\n\n\n\n\n```java\n\
  public class TextFragment extends Fragment {\n\n.\n\n.\n\n    public void changeTextProperties(int\
  \ fontsize, String text)\n    {\n        binding.textView2.setTextSize(fontsize);\n\
  \        binding.textView2.setText(text);\n    }\n}\n```\n\n当 `TextFragment` 片被放置在\
  \ activity 的布局中时，它被赋予了 ID `text_fragment`。通过使用此 ID，activity 现在可以获取片段实例的引用，并在该对象上调用\
  \ `changeTextProperties()` 方法。编辑 `MainActivity.java` 文件并按如下修改 `onButtonClick()`\
  \ 方法：\n\n```java\npublic void onButtonClick(int fontsize, String text) {\n   TextFragment\
  \ textFragment =\n   (TextFragment)\n     getSupportFragmentManager().findFragmentById(R.id.text_fragment);\n\
  \   textFragment.changeTextProperties(fontsize, text);\n}\n```\n\n## 31.9 测试应用程序\n\
  \n该项目的编码工作已经完成，最后一个剩下的任务是运行应用程序。当应用程序启动时，主活动将启动，并创建创建显示两个片段。当用户触摸工具栏片段中的按钮时，activity\
  \ 的 `onButtonClick()` 方法将被工具栏片段调用，并传递来自 `EditText` 视图的文本和 `SeekBar` 的当前值。然后 activity\
  \ 将调用第二个片段的 `changeTextProperties()` 方法，该方法将修改 `TextView` 以反映新的文本和字体大小：\n\n![](img/as_fragment_example_running.jpg)\n\
  \n图 31-10\n\n## 31.10 总结\n\n本章的目标是创建一个示例项目，专门演示在 Android 应用中使用片段的步骤。涵盖的主题包括：使用 Android\
  \ Support Library 以兼容在引入片段之前的 Android 版本、在 activity 布局中包含片段，以及片段间通信的实现。\n\n### 32.\
  \ 结使用 Jetpack 的现代 Android 应用架构\n\n直到最近，Google 并没有推荐构建 Android 应用的特定方法，而是提供工具和开发工具包，让开发者自行决定什么方法最适合特定的项目或个人编程风格。这种情况在\
  \ 2017 年随着 Android 架构组件的引入发生了改变，这些组件在 2018 年发布后成为了 Android Jetpack 的一部分。\n\n本章的目的是提供\
  \ Jetpack 概念、Android 应用架构建议以及一些关键架构组件的概述。一旦涵盖了基础知识，这些主题将在后续章节中进行更详细的介绍，并通过实际示例进行演示。\n\
  \n## 32.1 什么是 Android Jetpack？\n\nAndroid Jetpack 由 Android Studio、Android 架构组件和\
  \ Android Support Library，以及一组建议如何构建 Android 应用的指南组成。Android 架构组件的设计是为了在开发 Android\
  \ 应用时更快、更方便地执行常用任务，同时符合架构指南的核心原则。\n\n虽然本书将涵盖所有的 Android 架构组件，但本章的目标是介绍关键架构指南，以及\
  \ `ViewModel`、`LiveData`、`Data Binding` 和 `Repositories`。在继续之前，理解 `ViewModel`、`LiveData`、`Data\
  \ Binding` 和 `Repositories` 是重要的。\n\n## 32.2 “旧”架构\n\n在标题为`在 Android Studio 中创建示例\
  \ Android 应用`的章节中，章节的目标是介绍关键架构指南以及 `ViewModel`、`LiveData`、`Data Binding` 和 `Repositories`。这种方法导致了许多与\
  \ UI 控制器生命周期相关的问题。例如，用户每次旋转设备时，activity 都会销毁，导致任何未保存到持久化存储形式的数据丢失，并且导航效率低下。\n\n\
  ## 32.3 现代 Android 架构\n\n在最基础层面，Google 现在提倡将不同的责任领域划分到完全独立的模块中（Google 称为关注点分离）。这种方法的关键之一是\
  \ `ViewModel`。\n\n## 32.4 ViewModel 组件\n\n`ViewModel` 的目的是将与用户界面相关的数据模型和逻辑与实际显示用户界面的代码分离。实际上，`ViewModel`\
  \ 只感知数据模型，而不尝试直接访问或响应用户界面。当 UI 控制器需要数据进行显示时，它只需请求 `ViewModel` 提供。同样，当用户在视图中输入数据时，UI\
  \ 控制器将其传递给 `ViewModel` 进行处理。\n\n这种职责分离解决了与 UI 控制器生命周期相关的问题。无论 UI 控制器在应用生命周期内被重建多少次，`ViewModel`\
  \ 实例都会保留在内存中。例如，activity 使用的 `ViewModel` 将一直留在内存中，直到 activity 完全结束。\n\n![](img/jetpack_diagram_1.jpg)\n\
  \n图 32-1\n\n## 32.5 LiveData 组件\n\n考虑一个显示实时数据（如股票当前价格）的应用程序。应用程序可能会使用某种形式的股票价格 Web\
  \ 服务，用最新信息持续更新 `ViewModel` 内部的数据模型。显然，除非及时显示给用户，否则这些实时数据几乎没有用处。UI 控制器只有两种方式可以确保在用户界面上显示最新数据。一种方案是控制器持续检查\
  \ `ViewModel` 以确定数据自上次显示以来是否发生了变化。\n\n更好的解决方案是让 UI 控制器在 `ViewModel` 中的特定数据项更改时接收通知。这是通过使用\
  \ `LiveData` 组件实现的。`LiveData` 是一个数据持有者，允许一个值变得可观察。\n\n\n\n\n\n这意味着，例如，感兴趣某个 `ViewModel`\
  \ 值的 UI 控制器可以设置一个观察者，该观察者会在值发生变化时接收通知。在我们假设的应用程序中，例如股票价格将被封装在 `ViewModel` 中的 `LiveData`\
  \ 对象中，而 UI 控制器将为该值分配一个观察者，声明在值发生变化时调用的方法。当该方法由数据更改触发时，它将从 `ViewModel` 读取更新后的值并使用它来更新用户界面。\n\
  \n![](img/Jetpack_diagram_2.jpg)\n图 32-2\n\n`LiveData` 实例也可以被声明为可变的（mutable），允许观察实体更新\
  \ `LiveData` 对象中持有的底层值。例如，用户可能会在用户界面中输入一个需要覆盖存储在 `ViewModel` 中的值的值。\n\n使用 `LiveData`\
  \ 的另一个关键优势是它可以感知观察者的生命周期状态。例如，如果一个 activity 包含 `LiveData` 观察者，相应的 `LiveData` 对象将知道\
  \ activity 生命周期周期状态的变化并做出相应响应。如果 activity 处于挂起（可能是应用进入了后台），`LiveData` 对象将停止向观察者发送事件。如果\
  \ activity 刚刚启动或在挂起后恢复，`LiveData` 对象将向观察者发送一个 `LiveData` 事件，以便 activity 拥有最新的值。同样，`LiveData`\
  \ 实例将知道 activity 被销毁，并移除观察者以释放资源。\n\n到为止，我们只讨论了 UI 控制器使用观察者的情况。但在实践中，观察者可以在任何符合\
  \ Jetpack 生命周期管理方法的对象内部使用。\n\n## 32.6 ViewModel 状态保存\n\nAndroid 允许用户将运行中的应用置于后台，并在在设备上执行其他任务（包括运行其他应用）后返回该应用。当设备资源不足时，操作系统将通过终止后台应用进程来纠正此问题，从最久未使用的应用程序开始。然而，当用户返回到被终止的后台应用时，它应该显示为与进入后台时相同的状态，无论它是否曾被终止。在与\
  \ `ViewModel` 关联的数据方面，可以通过利用 `ViewModel Saved State` 模块来实现。该模块允许值存储在应用的保存状态（saved\
  \ state）中，并在系统启动的进程终止时恢复，该主题将在本章后续标题为 “Android ViewModel 保存状态教程” 中介绍。\n\n## 32.7\
  \ LiveData 与数据绑定\n\nAndroid Jetpack 包含了数据绑定库（Data Binding Library），允许 `ViewModel`\
  \ 中的数据直接映射到 XML 用户界面布局文件中的特定视图。在之前创建的 `AndroidSample` 项目中，必须编写代码来获取 `EditText` 和\
  \ `TextView` 视图的引用，并设置和获取文本属性以反映数据更改。数据绑定允许存储在 `ViewModel` 中的 `LiveData` 值在 XML\
  \ 布局文件中直接被引用，避免了编写代码来保持布局视图更新。\n\n![](img/Jetpack_diagram_3.jpg)\n图 32-3\n\n数据绑定将在标题为\
  \ “Android Jetpack 数据绑定概览” 的章节开始进行更详细介绍。\n\n## 32.8 Android 生命周期\n\n从 Android 组件创建到其被销毁的时间被称为生命周期。在这个生命周期期间，组件将在不同的生命周期状态之间切换，这通常受操作系统的控制并响应用户操作。例如，一个\
  \ activity 将从初始化状态开始，然后过渡到创建状态。一旦 activity 开始运行，它将切换到启动状态，并从该状态循环经过创建、启动、恢复和销毁在内的各种状态。\n\
  \n许多 Android Framework 类和组件允许其他对象访问它们的当前状态。生命周期观察者（Lifecycle observers）也可以使用，以便对象在另一个对象的生命周期状态变化时接收通知。这是\
  \ `ViewModel` 组件在后台使用的技术，用于识别观察者何时重启或被销毁。此功能不仅限于 Android 框架和架构组件，也可以构建在任何使用架构组件包含的生命周期组件的其他类中。\n\
  \n能够检测并响应其他对象生命周期状态变化的对象被称为生命感知（lifecycle-aware），而提供其生命周期状态访问的对象被称为生命所有者（lifecycle-owners）。生命将在标题为\
  \ “使用 Android 生命周期感知组件” 的章节中进行更详细介绍。\n\n## 32.9 Repository 模块\n\n如果 `ViewModel`\
  \ 从一个或多个外部源（如数据库或网络服务）获取数据，那么将处理这些数据源的代码与 `ViewModel` 类分离是非常重要的。否则，这会违反关注点分离（separation\
  \ of concerns）的指南。为了避免将此功能与 `ViewModel` 混合在一起，Google 的架构指南建议将此代码放在单独的 `Repository`（仓库）模块中。\n\
  \n仓库并不是一个 Android 架构组件，而是由应用开发者创建的 `Java` 类，负责与各种数据源衔接。该类为 `ViewModel` 提供一个接口，允许将数据存储在模型中。\n\
  \n![](img/Jetpack_diagram_4.jpg)\n图 32-4\n\n## 32.10 总结\n\n最近，Google 倾向于不推荐任何特定的构建\
  \ Android 应用的方法。随着 Android Jetpack 的推出，情况现在发生了变化，Android Jetpack 由一套工具、组件、库和架构指南组成。Google\
  \ 现在建议将应用项目划分为不同的模块，每个模块负责特定的功能区域，即所谓的“关注点分离”。\n\n特别是，指南建议将应用的视图数据模型与处理用户界面的代码分离。此外，负责从网络服务或数据库等数据源收集的代码应该构建在单独的模块模块，而不是与视图模型捆绑。\n\
  \nAndroid Jetpack 包含了 Android 架构组件，这些组件专门设计用于更易地开发符合推荐指南的应用程序。本章引入了 `ViewModel`、`LiveData`\
  \ 和生命周期组件。这些内容将从下一章开始进行更详细的介绍。本章未提到的其他架构组件将在书中后部分介绍。\n\n### 33. Android Jetpack\
  \ ViewModel 教程\n\n上一章引入了 Android Jetpack 的核心概念并概述了现代 Android 应用架构的基础。Jetpack 本质上定义了一套建议，描述了如何构建\
  \ Android 应用项目，同时提供了一套库和组件，使其更容易符合这些指南，目标是用更少的代码和更少的错误开发可靠的应用。\n\n为了帮助强化和澄清上一章提供的信息，本章将逐步引导创建一个使用\
  \ `ViewModel` 组件的示例应用项目。该示例将在下一章通过引入 `LiveData` 和数据绑定支持进行进一步增强。\n\n## 33.1 关于项目\n\
  \n\n\n\n\n在标题为在 Android Studio 中创建一个 Android 应用程序的章节中，创建了一个名为 `AndroidSample` 的项目，该应用的所有代码都封装在主\
  \ `Activity` 类文件中。在随后的章节中，我们创建了一个 `AVD` 模拟器并使用它来运行该应用。在应用运行时，我们亲身经历了以这种方式开发应用时会发生的问题：当设备旋转时，显示在\
  \ `TextView` 控件上的数据会丢失。\n\n本章将实现相同的货币转换器应用，但这次将使用 `ViewModel` 组件并遵循 Google 应用架构指南，以避免\
  \ `Activity` 周期管理带来的复杂性。\n\n## 33.2 创建 ViewModel 示例项目\n\n此练习的第一步是创建一个新项目。首先启动 Android\
  \ Studio，如有必要，使用 `File -> Close Project` 菜单选项关闭当前打开的项目，以便显示欢迎界面。\n\n在创建 `AndroidSample`\
  \ 项目时，选择了 `Empty Activity` 模板作为项目的的基础。然而，对于此项目，将使用 `Fragment + ViewModel` 模板。这将生成一个符合架构指南结构的\
  \ Android Studio 项目。\n\n从欢迎界面选择 `New Project` 选项，在出现的新项目对话框中，点击 `Next` 按钮之前选择 `Fragment\
  \ + ViewModel` 模板。\n\n在 `Name` 字段中输入 `ViewModelDemo`，并指定 `com.ebookfrenzy.viewmodeldemo`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单更改为 `Java`。编辑 `build.gradle (Module: ViewModelDemo.app)` 文件，启用 view\
  \ binding 并点击编辑器面板顶部的 `Sync Now` 链接：\n\n```android\nandroid {\n    buildFeatures\
  \ {\n        viewBinding true\n    }\n}\n```\n\n## 33.3 查看项目\n\n当使用 `Fragment +\
  \ ViewModel` 模板创建项目时，其结构在许多方面都与创建 `AndroidSample` 项目时使用的 `Empty Activity` 有不同。项目的关键组件如下：\n\
  \n### 33.3.1 主 Activity\n\n需要注意的第一点是，主 activity 的用户界面结构经过了处理，允许单个 activity 作为最终完成的应用中所需的所有屏幕的容器。\
  \ activity 的主用户界面布局位于 `app -> res -> layout -> main_activity.xml` 文件中，并以 `FrameLayout`\
  \ 的形式提供空容器空间（在图 33-1 中突出），屏幕内容将显示其中：\n\n![](img/android_studio_view_model_container_area.jpg)\n\
  \n图 33-1\n\n### 33.3.2 内容 Fragment\n\n`FrameLayout` 容器只是一个占位符，将在运行时替换应用启动时第一个屏幕的内容。这些内容通常以\
  \ `Fragment` 的形式存在，由 XML 布局资源文件和相应的类文件组成。事实上，在创建项目时，Android Studio 为此目的创建了一个初始 fragment。该\
  \ fragment 的布局资源文件可以在 `app -> res -> layout -> fragment_main.xml` 找到，加载到布局编辑器时，它将如图\
  \ 33-2 所示：\n\n![](img/as_3.5_viewmodel_main_fragment.jpg)\n\n图 33-2\n\n默认情况下，该 fragment\
  \ 仅包含一个显示文本“MainFragment”的 `TextView`，但其他已准备好进行修改以包含应用第一个屏幕的布局。此时值得花些时间查看 Android\
  \ Studio 已经生成的用于在 activity 容器区域显示此 fragment 的代码。\n\n将 `FrameLayout` 占位符替换为 fragment\
  \ 的过程始 `MainActivity` 类文件（`app -> java -> <package name> -> MainActivity`）中。关键代码出现在该类的\
  \ `onCreate()` 方法中，并将容器 ID（已分配给 `FrameLayout` 占位符视图）的对象替换为 `MainFragment` 类：\n\n\
  ```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.main_activity);\n    if (savedInstanceState == null)\
  \ {\n        getSupportFragmentManager().beginTransaction()\n            .replace(R.id.container,\
  \ MainFragment.newInstance())\n            .commitNow();\n    }\n}\n```\n\n伴随 fragment\
  \ 代码可以在 `MainFragment.java` 文件（`app -> <package name> -> ui.main -> MainFragment`）中找到。该文件中包含\
  \ `onCreateView()` 方法，该方法在 fragment 创建时被调用。此方法膨胀 `fragment_main.xml` 布局文件，使其显示在主\
  \ activity 布局的容器区域：\n\n```java\n@Override\npublic View onCreateView(@NonNull LayoutInflater\
  \ inflater, @Nullable ViewGroup container, @Nullable Bundle savedInstanceState)\
  \ {\n    return inflater.inflate(R.layout.main_fragment, container, false);\n}\n\
  ```\n\n### 33.3.3 ViewModel\n\nactivity 的 `ViewModel` 位于 `app -> java -> ui.main\
  \ -> MainViewModel` 的 `MainViewModel.java` 文件中。它被声明为 `ViewModel` 架构类的子类，并准备好修改以存储应用的数据模型：\n\
  \n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\nimport androidx.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n    // TODO\n}\n```\n\n## 33.4\
  \ 设计 Fragment\n\n下一步是设计 fragment 的布局。在项目窗口中找到 `fragment_main.xml` 文件并双击它将其加载到布局编辑器。布局加载后，选择现有\
  \ `TextView` 并使用属性窗口将其 id 更改为 `resultText`。\n\n从调色板中拖入 `Number (Decimal)` 视图并将其置于\
  \ `TextView` 之上。选中该视图后引用属性窗口并将 id 更改为 `dollarText`。\n\n将一个 `Button` 控件拖到布局中使其位于\
  \ `TextView` 下方，并将文本属性更改为“Convert”。在仍选中按钮时，将 id 属性更改为 `convertButton`。此时，布局应如图 33-3\
  \ 所示（注意三个视图已使用垂直链进行约束）：\n\n![](img/as_4.2_viewmodel_ui.jpg)\n\n图 33-3\n\n最后，点击布局编辑器右上角的警告图标并将硬编码字符串转换为资源。\n\
  \n## 33.5 实现 View Model\n\n用户界面布局完成后，需要在视图模型创建应用的数据模型。在项目窗口中找到 `MainViewModel.java`\
  \ 文件，双击它将其加载到代码编辑器并修改类如下所示：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  import androidx.lifecycle.ViewModel;\n\npublic class MainViewModel extends ViewModel\
  \ {\n    private static final Float rate = 0.74F;\n    private String dollarText\
  \ = \"\";\n    private Float result = 0F;\n\n    public void setAmount(String value)\
  \ {\n        this.dollarText = value;\n        result = Float.parseFloat(dollarText)*rate;\n\
  \    }\n\n    public Float getResult()\n    {\n        return result;\n    }\n}\n\
  ```\n\n\n\n\n该类声明了变量用于存储当前的美元字符串值以及转换后的金额，并提供了 getter 和 setter 方法以提供对这些数据值的访问。当调用\
  \ `setAmount()` 方法时，它会将当前的美元金额作为参数并将其存储在本地变量 `dollarText` 中。美元字符串值被转换为浮点数，乘以一个虚构的汇率，并将得到的欧元值存储在\
  \ `result` 变量中。另一方面，`getResult()` 方法直接返回赋值给 `result` 变量的当前值。\n\n## 33.6 将片段（Fragment）与视图模型（View\
  \ Model）关联\n\n显然，片段片段通过某种方式来获取 `ViewModel` 的引用，以便能够访问模型并观察数据变化。`Fragment` 或 `Activity`\
  \ 使用 `ViewModelProvider` 类的实例来维护其赖以获取数据的 `ViewModels` 引用。\n\n在 `Fragment` 内部使用 `ViewModelProvider`\
  \ 类创建 `ViewModelProvider` 实例。调用时，类初始化器会接收一个当前 `Fragment` 或 `Activity` 的引用，并如下所示返回一个\
  \ `ViewModelProvider` 实例：\n\n```java\nViewModelProvider viewModelProvider = new\
  \ ViewModelProvider(this);\n```\n\n一旦创建了 `ViewModelProvider` 实例，就可以在该实例上调用 `get()`\
  \ 方法，并传递所需的特定 `ViewModel` 类。提供程序将创建该 `ViewModel` 类的新实例，或者返回一个已存在的实例：\n\n```java\n\
  ViewModel viewModel = viewModelProvider.get(MainViewModel.class);\n```\n\n编辑 `MainFragment.java`\
  \ 文件并验证 Android Studio 是否已经在 `onActivityCreated()` 方法中包含了此步骤（尽管为了简洁，该操作是在单行代码中完成的）：\n\
  \n```java\nviewModel = new ViewModelProvider(this).get(MainViewModel.class);\n```\n\
  \n由于由于已经可以访问模型视图，现在可以向 `Fragment` 中添加代码以开始处理数据模型。\n\n## 33.7 修改片段\n\n片段类现在需要更新以响应按钮点击，并与存储在\
  \ `ViewModel` 中的数据值进行交互。该类还需要对用户界面布局中三个视图的引用，以便响应按钮点击、提取当前的美元值并显示转换后的货币金额。\n\n在题为\
  \ 在 Android Studio 中创建一个 Android 示例 的章节中，使用了 `Button` 控件的 `onClick` 属性来指定用户点击按钮时要调用的方法。遗憾的是，此属性只能调用\
  \ `Activity` 的方法，而不能用于调用 `Fragment` 中的方法。为了绕过这一限制，我们需要向 `Fragment` 类中添加一些代码，以在按钮上设置\
  \ `onClick` 监听器。执行此操作的代码可以按文所示添加到 `MainFragment.java` 文件的 `onActivityCreated()`\
  \ 方法中。在进行这些更改的同时，我们还将转换片段使用视图绑定（view binding）：\n\n```java\nimport com.ebookfrenzy.viewmodeldemo.databinding.MainFragmentBinding;\n\
  \npublic class MainFragment extends Fragment {\n\n    private MainViewModel mViewModel;\n\
  \n    private MainFragmentBinding binding;\n\n    public static MainFragment newInstance()\
  \ {\n        return new MainFragment();\n    }\n\n    @Nullable\n    @Override\n\
  \    public View onCreateView(@NonNull LayoutInflater inflater,\n              \
  \               @Nullable ViewGroup container,\n                             @Nullable\
  \ Bundle savedInstanceState) {\n        return inflater.inflate(R.layout.main_fragment,\
  \ container, false);\n        binding = MainFragmentBinding.inflate(inflater, container,\
  \ false);\n        return binding.getRoot();\n    }\n\n    @Override\n    public\
  \ void onDestroyView() {\n        super.onDestroyView();\n        binding = null;\n\
  \    }\n\n    @Override\n    public void onActivityCreated(@Nullable Bundle savedInstanceState)\
  \ {\n        super.onActivityCreated(savedInstanceState);\n        mViewModel =\
  \ new ViewModelProvider(this).get(MainViewModel.class);\n        binding.convertButton.setOnClickListener(new\
  \ View.OnClickListener() {\n            @Override\n            public void onClick(View\
  \ v) {\n                // 稍后实现逻辑\n            }\n        });\n    }\n}\n```\n\n\
  添加监听器后，每当点击按钮时，放置 `onClick()` 方法中的任何代码都会被调用。\n\n## 33.8 访问 ViewModel 数据\n\n当点击按钮时，`onClick()`\
  \ 方法需要从 `EditText` 读取值，确认该字段为空，然后调用 `ViewModel` 的 `setAmount()` 方法。提供程序将创建该 `ViewModel`\
  \ 类的新实例，或者返回一个已存在的实例。\n\n由于项目尚未使用 `LiveData`，因此在每次创建 `Fragment` 时，都有必要从 `ViewModel`\
  \ 获取结果值。在 `MainFragment.java` 文件中实现这些需求：\n\n```java\nimport java.util.Locale;\n\n\
  @Override\npublic void onActivityCreated(@Nullable Bundle savedInstanceState) {\n\
  \    super.onActivityCreated(savedInstanceState);\n    mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n\
  \    binding.convertButton.setOnClickListener(new View.OnClickListener() {\n   \
  \     @Override\n        public void onClick(View v) {\n            if (!binding.dollarText.getText().toString().equals(\"\
  \")) {\n                mViewModel.setAmount(String.format(Locale.ENGLISH, \"%s\"\
  , binding.dollarText.getText().toString()));\n                binding.resultText.setText(String.format(Locale.ENGLISH,\
  \ \"%.2f\", mViewModel.getResult()));\n            } else {\n                binding.resultText.setText(\"\
  No Value\");\n            }\n        }\n    });\n}\n```\n\n## 33.9 测试项目\n\n完成项目的此开发阶段后，在模拟器或物理设备上构建并运行应用程序，输入美元值并点击转换按钮。转换后的金额应显示在\
  \ TextView 上，表明 UI 控制器和 ViewModel 的重构是有效的。\n\n当运行原始的 AndroidSample 应用时，旋转设备会导致 `resultText`\
  \ TextView 控件上显示的值丢失。现在用 ViewModelDemo 应用重复此测试，并注意旋转后当前的欧元值被保留了。这是因为当 Fragment 被销毁并重建时，ViewModel\
  \ 仍然留在内存中，并且我们在 `onActivityCreated()` 方法中添加了代码，每次 Fragment 重新启动都会使用 ViewModel 的结果值更新\
  \ TextView。\n\n## 33.10 总结\n\n在本章中，我们回顾了书中之前创建 AndroidSample 项目，并创建了一个符合 Android\
  \ Jetpack 架构指南的项目版本。章节概述了 Fragment + ViewModel 项目模板的结构，并解释了基于单一 Activity 使用 Fragment\
  \ 在单个 Activity 布局中显示不同屏幕的概念。示例项目还演示了使用 ViewModel 将数据处理与用户界面相关代码分离。\n\n34. Android\
  \ Jetpack LiveData 教程\n\n\n\n\n上一章开始了设计符合推荐 Jetpack 架构指南的 App 过程。这些初始步骤涉及选择 `Fragment+ViewModel`\
  \ 项目模板，并在 `ViewModel` 实例中实现应用用户界面的数据模型。\n\n本章将通过使用 `LiveData` 架构组件来进一步增强应用设计。一旦在本章中为项目添加了\
  \ `LiveData` 支持，接下来的章节（从 \"Android Jetpack 数据绑定概述\" 开始）将利用 Jetpack Data Binding\
  \ 库从项目中消除更多代码。\n\n## 34.1 LiveData - 回顾\n\nLiveData 在此前的章节标题为 \"使用 Jetpack 构建现代\
  \ Android 应用架构\" 的章节中介绍过。如之前所述，`LiveData` 组件可以用 ViewModel 中数据值的包装器。一旦包含在 `LiveData`\
  \ 实例中，这些变量对于对应用中的其他对象（通常是 UI 控制器，如 `Activities` 和 `Fragments`）是可观测的。这允许 UI 控制器在底层\
  \ `LiveData` 值发生变化时接收通知。通过创建一个 `Observer` 类的实例并定义一个在 `LiveData` 值变化时调用的 `onChange()`\
  \ 方法来设置观察者。一旦创建了 `Observer` 实例，通过调用 `LiveData` 对象的 `observe()` 方法将其附加到 `LiveData`\
  \ 对象上。\n\n`LiveData` 实例可以使用 `MutableLiveData` 类声明为可变的，从而允许 `ViewModel` 和 UI 控制器对底层数据值进行更改。\n\
  \n## 34.2 为 ViewModel 添加 LiveData\n\n启动 Android Studio，打开上一章创建的 `ViewModelDemo`\
  \ 项目，并打开 `MainViewModel.java` 文件，该文件目前的内容应如下：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport androidx.lifecycle.ViewModel;\n\npublic class MainViewModel extends ViewModel\
  \ {\n    private static final Float rate = 0.74F;\n    private String dollarText\
  \ = \"\";\n    private Float result = 0F;\n\n    public void setAmount(String value)\
  \ {\n        this.dollarText = value;\n        result = Float.parseFloat(dollarText)*rate;\n\
  \    }\n\n    public Float getResult() {\n        return result;\n    }\n}\n```\n\
  \n本章此阶段的目标是将 `result` 变量封装在 `MutableLiveData` 实例中（该对象需要是可变的，以便在每次用户请求货币转换时都能更改值）。从修改类开始，使其内容如下所示，请注意在使用\
  \ `LiveData` 时需要额外导入包：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport androidx.lifecycle.MutableLiveData;\nimport androidx.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n    private static final Float\
  \ rate = 0.74F;\n    private String dollarText = \"\";\n    private Float result\
  \ = 0F;\n    private MutableLiveData<Float> result = new MutableLiveData<>();\n\n\
  \    public void setAmount(String value) {\n        this.dollarText = value;\n \
  \       result = Float.valueOf(dollarText)*rate;\n    }\n\n    public Float getResult()\
  \ {\n        return result;\n    }\n}\n```\n\n现在 `result` 变量已包含在可变的 `LiveData` 实例中，需要修改\
  \ `setAmount()` 和 `getResult()` 方法。在 `setAmount()` 方法中，不能再使用赋值运算符（`=`）为 `result`\
  \ 变量赋值。相反，必须调用 `LiveData.setValue()` 方法，并将新值作为参数传递。按照目前的实现，`getResult()` 方法被声明为返回\
  \ `Float` 值，现在需要更改为返回 `MutableLiveData` 对象。完成这些剩余更改后将得到如下类文件：\n\n```java\npackage\
  \ com.ebookfrenzy.viewmodeldemo.ui.main;\n\nimport androidx.lifecycle.MutableLiveData;\n\
  import androidx.lifecycle.ViewModel;\n\npublic class MainViewModel extends ViewModel\
  \ {\n    private static final Float rate = 0.74F;\n    private String dollarText\
  \ = \"\";\n    private MutableLiveData<Float> result = new MutableLiveData<>();\n\
  \n    public void setAmount(String value) {\n        this.dollarText = value;\n\
  \        result = Float.valueOf(dollarText)*rate;\n        result.setValue(Float.parseFloat(dollarText)*rate);\n\
  \    }\n\n    public MutableLiveData<Float> getResult() {\n        return result;\n\
  \    }\n}\n```\n\n## 34.3 实现观察者\n\n现在转换结果已包含在 `LiveData` 实例中，下一步是在 UI 控制器（在本例中为\
  \ `MainFragment` 类）中配置观察者。找到 `MainFragment.java` 类（`app` -> `<package>` -> `MainFragment`），双击将其加载到编辑器中并修改\
  \ `onActivityCreated()` 方法以创建一个名为 `resultObserver` 的新 `Observer` 实例：\n\n```java\n\
  package com.ebookfrenzy.viewmodeldemo.ui.main;\n\nimport androidx.lifecycle.Observer;\n\
  \n@Override\npublic void onActivityCreated(@Nullable savedInstanceState) {\n   \
  \ binding.resultText.setText(String.format(Locale.ENGLISH,\"%.2f\", mViewModel.getResult()));\n\
  \    final Observer<Float> resultObserver = new Observer<Float>() {\n        @Override\n\
  \        public void onChanged(@Nullable Float result) {\n            binding.resultText.setText(String.format(Locale.ENGLISH,\
  \ \"%.2f\", result));\n        }\n    };\n```\n\n`resultObserver` 实例定义了 `onChanged()`\
  \ 方法，该方法被调用时会接收当前结果，然后将其转换为字符串并显示在 `resultText` 对象上。下一步是将观察者添加到 `result` `LiveData`\
  \ 对象中，可以通过调用 `ViewModel` 对象的 `getResult()` 方法获取该引用。由于更新 `resultText` 现在是 `onChanged()`\
  \ 回调的职责，现在可以删除执行此任务的现有代码：\n\n```java\n@Override\npublic void onActivityCreated(@Nullable\
  \ savedInstanceState) {\n    super.onActivityCreated(savedInstanceState);\n    mViewModel\
  \ = new ViewModelProvider(this).get(MainViewModel.class);\n    binding.resultText.setText(String.format(Locale.ENGLISH,\"\
  %.2f\", mViewModel.getResult()));\n    final Observer<Float> resultObserver = new\
  \ Observer<Float>() {\n        @Override\n        public void onChanged(@Nullable\
  \ Float result) {\n            binding.resultText.setText(String.format(Locale.ENGLISH,\
  \ \"%.2f\", result));\n        }\n    };\n    mViewModel.getResult().observe(getViewLifecycleOwner(),\
  \ resultObserver);\n    binding.convertButton.setOnClickListener(new View.OnClickListener()\
  \ {\n        @Override\n        public void onClick(View v) {\n            if (!binding.dollarText.getText().toString().equals(\"\
  \")) {\n                mViewModel.setAmount(String.format(Locale.ENGLISH,\"%s\"\
  , binding.dollarText.getText()));\n                binding.resultText.setText(String.format(Locale.ENGLISH,\
  \ \"%.2f\", mViewModel.getResult()));\n            } else {\n                binding.resultText.setText(\"\
  No Value\");\n            }\n        }\n    });\n}\n```\n\n\n\n\n注意在上述 `onActivityCreated()`\
  \ 方法的实现中，负责在每次调用该方法时显示当前结果值的代码行已被删除。最初这样做是为了确保当 `Fragment` 出任何原因被重建时，所显示的值不会丢失。由于\
  \ `LiveData` 会监控其观察者的生命周期状态，这一步已不再是必要的。当 `LiveData` 检测到 UI 控制器被重建时，它会自动触发任何相关的观察者并提供最新数据。请在\
  \ `TextView` 对象上显示欧元数值时旋转设备，并确认该值没有丢失以验证这一点。\n\n在继续后续章节之前，请关闭项目，复制 `ViewModelDemo`\
  \ 项目文件夹并将其保存为 `ViewModelDemo_LiveData`，以便稍后查看保存 `ViewModel` 状态时使用。\n\n## 34.4 总结\n\
  \n本章演示了如何使用 Android `LiveData` 组件来确保显示给用户的数据始终与存储在 `ViewModel` 中的数据一致。这一简单的过程包括将\
  \ `ViewModel` 数据值封装在 `LiveData` 对象中，并在 UI 控制器中设置一个订阅该 `LiveData` 值的观察者。每当 `LiveData`\
  \ 值发生变化时，观察者就会收到通知，并调用 `onChanged()` 方法传递更新后的值。\n\n为项目添加 `LiveData` 支持在很大程度上简化了项目设计。通过使用数据绑定库（Data\
  \ Binding Library），还可以实现额外且重大的改进，细节将在下一章中介绍。\n\n## 35. Android Jetpack Data Binding\
  \ 概述\n\n在题为“Modern Android App Architecture with Jetpack`的章节中，我们引入了 Android 数据绑定（Data\
  \ Binding）的概念，并简要解释了如何使用它直接将用户界面布局中的视图连接到应用中其他对象中的方法和数据，而无需编写代码。本章将提供更多关于数据绑定的细节，重点解释数据绑定是如何在\
  \ Android Studio 项目中实现的的。下一章的教程（“An Android Jetpack Data Binding Tutorial”）将提供一个数据绑定运行的实际示例。\n\
  \n## 35.1 数据绑定概览\n\n数据绑定支持由 Android Jetpack Data Binding 库提供，其主要目的是提供一种简单的方法，将用户界面布局中的视图连接到存储在应用代码中（通常在\
  \ `ViewModel` 实例中）的数据。数据绑定还提供了一种方便的方法，将用户界面控件（如 `Button` 控件映射到其他对象（如 UI 控制器和 `ViewModel`\
  \ 实例）中的事件和监听器方法。\n\n当与 `LiveData` 组件结合使用时，数据绑定变得特别强大。例如，考虑一个使用数据绑定绑定到 `ViewModel`\
  \ 中 `LiveData` 变量的 `EditText` 视图。通过这种方式连接，`ViewModel` 中数据值的任何变化将自动出现在 `EditText`\
  \ 视图中，当使用双向绑定时，输入到 `EditText` 中的任何数据都将自动用于更新 `LiveData` 值。最令人印象深刻的是，这可以在初始设置绑定所需的代码之外无需任何额外代码来实现。\n\
  \n传统上，将交互式视图（如 `Button` 控件）连接到 UI 控制器中的方法需要开发人员编写代码来实现监听器方法，以便在点击按钮时调用。数据绑定使得这变得非常简单，只需在布局\
  \ XML 文件的 `Button` 元素中引用要调用的方法即可。\n\n### 35.2 数据绑定的关键组件\n\n默认情况下，Android Studio\
  \ 项目未配置数据绑定支持。事实上，在应用开始使用数据绑定之前，需要组合许多不同的元素。这些涉及项目构建配置、布局 XML 文件、数据绑定类以及数据绑定表达式语言的使用。虽然初初看起来可能有些复杂，但如果分开来看，这些实际上是非常简单的步骤，一旦完成，在节省编码工作方面是非常值得的。在本章的剩余部分中，将详细介绍这些每一个元素。在涵盖这些基础知识后，下一章将通过详细的教程通过实际操作演示这些步骤。\n\
  \n#### 35.2.1 项目构建配置\n\n在项目可以使用数据绑定之前，必须首先配置使用 Android Data Binding 库，并启用对数据绑定类和绑定表达式语法的支持。幸运的是，这只需在模块级\
  \ `build.gradle` 文件（项目工具窗口中 Gradle Scripts 下列出的 `build.gradle (Module: app)`）中添加几行即可实现。以下列出了启用了数据绑定的部分构建文件：\n\
  \n```gradle\nandroid {\n    buildFeatures {\n        dataBinding = true\n    }\n\
  }\n```\n\n#### 35.2.2 数据绑定布局文件\n\n正如我们在之前的章节中所，应用的用户界面通常包含在 XML 布局文件中。在这些布局文件之一中的视图可以利用数据绑定之前，布局文件必须先转换为数据绑定布局文件。\n\
  \n正如书前面所述，XML 布局文件定义了布局中组件的层次结构，从顶层或根视图开始。该根视图总是布局容器的形式，例如 `ConstraintLayout`、`FrameLayout`\
  \ 或 `LinearLayout` 实例，如 `ViewModelDemo` 项目中的 `main_fragment.xml` 文件所示：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/main\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
  match_parent\"\n    tools:context=\".ui.main.MainFragment\">\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n为了可以使用数据绑定，布局结构必须有一个布局组件作为根节点，它反过来成为当前视图的父级。在上述示例的情况下，这将需要对布局文件进行以下更改：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <androidx.constraintlayout.widget.ConstraintLayout\n        xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n        xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n        xmlns:tools=\"http://schemas.android.com/tools\"\n        android:id=\"\
  @+id/main\"\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        tools:context=\".ui.main.MainFragment\">\n\n    </androidx.constraintlayout.widget.ConstraintLayout>\n\
  </layout>\n```\n\n#### 35.2.3 布局文件数据元素\n\n数据绑定布局文件需要某种方式来声明要与布局中的视图绑定的项目中的类（例如 `ViewModel`\
  \ 或 UI 控制器）。在声明这些类之后，布局文件还需要一个变量名称，以便在绑定表达式引用这些实例。\n\n这是通过使用 `data` 元素实现的，示例所示：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\">\n```\n\n\n\n\n\n```xml\n\
  <layout xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <data>\n\
  \        <variable\n            name=\"myViewModel\"\n            type=\"com.ebookfrenzy.myapp.ui.main.MainViewModel\"\
  \ />\n    </data>\n    <androidx.constraintlayout.widget.ConstraintLayout\n    \
  \    android:id=\"@+id/main\"\n        android:layout_width=\"match_parent\"\n \
  \       android:layout_height=\"match_parent\"\n        tools:context=\".ui.main.MainFragment\"\
  >\n\n</layout>\n```\n\n`data` 元素声明了一个名为 `myViewModel` 的新变量，类型为 `MainViewModel`（注意，在声明变量时，必须声明\
  \ `MyViewModel` 类的完整包名）。\n\n`data` 元素还可以导入其他类，这些类可以在布局文件的其他地方绑定表达式中引用。例如，如果你有一个类，其中包含一个在显示给用户之前需要对某个值调的方法，可以如下所示导入该类：\n\
  \n```xml\n<data>\n    <import type=\"com.ebookfrenzy.MyFormattingTools\" />\n  \
  \  <variable\n        name=\"viewModel\"\n        type=\"com.ebookfrenzy.myapp.ui.main.MainViewModel\"\
  \ />\n</data>\n```\n\n### 35.2.4 绑定类\n\n对于绑定布局文件中 `data` 元素中引用的每个类，Android Studio\
  \ 自动生成对应的绑定类。该类是 `AndroidDataBinding` 类的子类，并将根据布局文件名使用单词首字母大写并添加 `Binding` 后缀进行命名。因此，对于名为\
  \ `main_fragment.xml` 的布局文件，绑定类将命名为 `MainFragmentBinding`。绑定类包含布局文件中指定的绑定，并将它们映射到绑定对象中的变量和方法。\n\
  \n尽管绑定类是自动生成的，但仍需要编写代码来根据相应的数据绑定布局文件创建该类的实例。坦率地说，这可以通过利用 `DataBindingUtil` 类来实现。\n\
  \n`Activity` 或 `Fragment` 的初始化代码通常会设置内容视图或“膨胀”（inflate）用户界面布局文件。这简单意味着代码打开布局文件、解析\
  \ XML 并在内存中创建并配置所有的视图对象。对于现有的 `Activity` 类，实现此点的代码可以在 `onCreate()` 方法中找到，其内容如下：\n\
  \n```java\nsetContentView(R.layout.activity_main);\n```\n\n在 `Fragment` 的情况下，这发生在\
  \ `onCreateView()` 方法中：\n\n```java\nreturn inflater.inflate(R.layout.main_fragment,\
  \ container, false);\n```\n\n在 `Activity` 类中创建绑定类实例只需将此初始化代码修改如下：\n\n```java\nActivityMainBinding\
  \ binding;\nbinding = DataBindingUtil.setContentView(this, R.layout.activity_main,\
  \ false);\n```\n\n在 `Fragment` 的情况下，代码如下：\n\n```java\nMainFragmentBinding binding;\n\
  binding = DataBindingUtil.inflate(\n    inflater, R.layout.main_fragment, container,\
  \ false);\nbinding.setLifecycleOwner(this);\nView view = binding.getRoot();\nreturn\
  \ view;\n```\n\n### 35.2.5 数据绑定变量配置\n\n如上所述，数据绑定布局文件包含 `data` 元素，该元素包含变量元素，这些元素由变量名和要建立绑定的类类型。例如：\n\
  \n```xml\n<data>\n    <variable\n        name=\"viewModel\"\n        type=\"com.ebookfrenzy.viewmodeldemo.ui.main.MainViewModel\"\
  \ />\n    <variable\n        name=\"uiController\"\n        type=\"com.ebookfrenzy.viewmodeldemo_databinding.ui.main.MainFragment\"\
  \ />\n</data>\n```\n\n在上面的示例中，第一个变量知道它将绑定到类型为 `MainViewModel` 的 `ViewModel` 类实例，但尚未连接到实际的\
  \ `MainViewModel` 对象实例。这需要额外的步骤，将应用内部使用的 `MainViewModel` 实例分配给布局文件中声明的变量。这是通过调用数据绑定实例的\
  \ `setVariable()` 方法实现的，我们在上一章中已获取该实例的引用：\n\n```java\nMainViewModel mViewModel =\
  \ new ViewModelProvider(this).get();\nbinding.setVariable(mViewModel);\n```\n\n\
  在这种情况下，第二个变量 `uiController` 引用了 `Fragment`：\n\n```java\nbinding.setVariable(uiController);\n\
  ```\n\n### 35.2.6 绑定表达式（单向）\n\n绑定表达式定义了视图如何与绑定对象交互。绑定表达式以 `@` 符号开头，随后是花括号 `{}` 包裹的表达式。例如，考虑一个包含名为\
  \ `result` 变量的 `ViewModel` 实例。假设此值被存储为 `String`，则它在 `TextView` 中的声明如下：\n\n```xml\n\
  <TextView\n    android:id=\"@+id/resultText\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"\n    android:text=\"@{viewModel.result}\"\
  \n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n在上面的 XML 中，`text` 属性被设置为存储在 `viewModel` 的 `LiveData` 属性中的值。\n\
  \n然而，考虑 `result` 在模型中存储为 `Float` 值而不是 `String`。如果是这样，上面的表达式将导致编译错误。显然，在 `TextView`\
  \ 显示它之前，`Float` 值需要转换为字符串。为了解决此类问题，绑定表达式可以使用标准的 Java 类包含完成转换所需的步骤：\n\n```xml\nandroid:text=\"\
  @{String.valueOf(viewModel.result)}\"\n```\n\n在此更改后运行应用时，需要注意 Android Studio 控制台可能会出现以下警告：\n\
  \n`warning: myViewModel.result.getValue() is a boxed field but needs to be unboxed\
  \ to execute String.valueOf(viewModel.result()).`\n\nJava 值可以以原始值的形式存在，例如 `boolean`\
  \ 类型（称为拆箱），也可以封装在 Java 对象中，例如 `Boolean` 类型，并通过对该对象的引用进行访问（即装箱）。拆箱的过程是从对象中拆出原始值。\n\
  \n为了避免此消息，如下所示将错误的操作封装在 `safeUnbox()` 调用中：\n\n```xml\nandroid:text=\"@{String.valueOf(safeUnbox(myViewModel.result))}\"\
  \n```\n\n也可以使用字符串拼接。例如，为了在结果字符串值后包含“dollars”单词，将使用以下表达式：\n\n```xml\nandroid:text='@{String.valueOf(safeUnbox(myViewModel.result))\
  \ + \" dollars\"}'\n```\n\n\n\n\n注意，由于附加的结果字符串被包裹在双引号中，因此表达式现在使用单引号封装以避免语法错误。\n\n\
  表达式语法还允许声明三元语句。在下面的表达式中，视图将根据结果值是否大于 10 显示不同的文本。\n\n```\n@{myViewModel.result >\
  \ 10 ? \"Out of range\" : \"In range\"}\n```\n\n表达式还可以被构造用于访问数据数组中的特定元素：\n\n```\n\
  @{myViewModel.resultsArray[3]}\n```\n\n### 35.2.7 绑定表达式（双向）\n\n到目前为止涵盖的表达式类型被称为单向绑定。换句话说，布局会随着对应值的变化而不断更新，但从布局内部对值的更改不会更新存储的值。\n\
  \n另一方面，双向绑定允许数据模型响应布局的变化而进行更新。例如，一个 `EditText` 视图可以配置为双向绑定，这样当用户输入不同的值时，该值将用于用于更新对应的数据模型值。在声明双向表达式时，语法与单向表达式相似，不同在于它以\
  \ `@=` 开头。例如：\n\n```\nandroid:text=\"@={myViewModel.result}\"\n```\n\n### 35.2.8\
  \ 事件和监听器绑定\n\n绑定表达式还可以用于响应视图上的事件来触发方法调用。例如，`Button` 视图可以配置为在点击时调用一个方法。在标题为“在 Android\
  \ Studio 中创建一个 Android 应用”的章节中，例如，按钮的 `onClick` 属性被配置为调用应用主 Activity 中名为 `convertCurrency()`\
  \ 的方法。在 XML 文件中，该表示表示如下：\n\n```\nandroid:onClick=\"convertCurrency\"\n```\n\n`convertCurrency()`\
  \ 方法在以下行进行了声明：\n\n```java\npublic void convertCurrency(View view) {\n\n.\n.\n}\n\
  ```\n\n注意，这种类型的方法调用始终会传递一个发生事件的视图的引用。在数据绑定中，可以使用以下表达式实现相同的效果（假设布局已绑定到一个变量名为 `uiController`\
  \ 的类）：\n\n```\nandroid:onClick=\"@{uiController::convertCurrency}\"\n```\n\n另一个选项，也是一个提供向方法传递参数能力的选项，被称为监听器绑定。下面的表达式使用这种方法在同一个\
  \ `viewModel` 实例上调用一个无参数的方法：\n\n```\nandroid:onClick='@{() -> myViewModel.methodOne()}'\n\
  ```\n\n下面的表达式调用了一个需要三个参数的方法：\n\n```\nandroid:onClick='@{() -> myViewModel.methodTwo(viewModel.result,\
  \ 10, \"A String\")}'\n```\n\n绑定表达式提供了一种丰富且灵活的语言，可以将用户界面视图绑定到其他对象的数据和方法，本章仅涵盖了最常见的用例。要了解更多关于绑定表达式的信息，请查看\
  \ Android 在线文档：\n\nhttps://developer.android.com/topic/libraries/data-binding/expressions\n\
  \n### 35.3 总结\n\nAndroid 数据绑定提供了一个系统，可以在用户界面布局中的视图与应用架构中其他对象的数据和方法之间建立连接，而无需编写代码。一旦完成了初始配置步骤，数据绑定只需涉及在布局文件的视图元素中使用绑定表达式。这些绑定表达式可以是单向的，也可以是双向的，还可以用于绑定响应用户界面内按钮点击等事件而调的方法。\n\
  \n### 36. Android Jetpack 数据绑定教程\n\n到目前为止，我们在书中涵盖了现代 Android 应用架构的基本概念，并更详细地查看了\
  \ `ViewModel` 和 `LiveData` 组件。数据绑定的概念在上一章也涵盖了，现在它将在本章用于进一步修改 `ViewModelDemo` 应用。\n\
  \n## 36.1 移除冗余代码\n\n如果你还没有这样做，请复制 `ViewModelDemo` 项目文件夹并将其保存为 `ViewModelDemo_LiveData`，以便在下一章中可以使用。复制完成后，打开原始的\
  \ `ViewModelDemo` 项目，准备实现数据绑定。\n\n在 `ViewModelDemo` 应用中实现数据绑定之前，将通过删除项目内到本章结束时不再需要的代码来演示数据绑定的威力。\n\
  \n启动 Android Studio，打开 `ViewModelDemo` 项目，编辑 `MainFragment.java` 文件并按如下所示修改代码：\n\
  \n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\n.\n.\nimport android.arch.lifecycle.Observer;\n\
  \n.\n.\npublic class MainFragment extends Fragment {\n    private MainViewModel\
  \ mViewModel;\n.\n.\n    @Override\n    public void onActivityCreated(@Nullable\
  \ Bundle savedInstanceState) {\n        super.onActivityCreated(savedInstanceState);\n\
  \        mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n  \
  \      final Observer<Float> resultObserver = new Observer<Float>() {\n        \
  \    @Override\n            public void onChanged(@Nullable final Float result)\
  \ {\n                binding.resultText.setText(String.format(Locale.ENGLISH, \"\
  %.2f\", result));\n            }\n        };\n        mViewModel.getResult().observe(getViewLifecycleOwner(),\
  \ resultObserver);\n        binding.convertButton.setOnClickListener(new View.OnClickListener()\
  \ {\n            @Override\n            public void onClick(View v) {\n        \
  \        if (!binding.dollarText.toString().equals(\"\")) {\n                  \
  \  mViewModel.setAmount(String.format(Locale.ENGLISH,\"%s\", binding.dollarText.getText()));\n\
  \                } else {\n                    binding.resultText.setText(\"No Value\"\
  );\n                }\n            }\n        });\n    }\n}\n```\n\n接下来，编辑 `MainViewModel.java`\
  \ 文件并继续如下操作（注意 `dollarText` 变量转换为 `LiveData`）：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport android.arch.lifecycle.MutableLiveData;\nimport android.arch.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n    private static final Float\
  \ rate = 0.74F;\n    public MutableLiveData<String> dollarValue = new MutableLiveData<>();\n\
  \    private String dollarText = \"\";\n    public MutableLiveData<Float> result\
  \ = new MutableLiveData<>();\n    public void setAmount(String value) {\n      \
  \  this.dollarText = value;\n        result.setValue(Float.valueOf(dollarText)*rate);\n\
  \    }\n    public MutableLiveData<Float> getResult()\n    {\n        return result;\n\
  \    }\n}\n```\n\n虽然我们在实现数据绑的过程中会添加额外的代码，但显然数据绑定显著减少了需要编写的代码。\n\n### 36.2 启用数据绑定\n\
  \n使用数据绑定的第一步是在 Android Studio 中启用它。这需要在 Gradle Scripts -> `build.gradle (Module:\
  \ ViewModelDemo.app)` 文件中添加新属性。\n\n在 `build.gradle` 文件中添加下面的元素以启用项目中的数据绑定：\n\n```gradle\n\
  plugins {\n    id 'com.android.application'\n}\n\nandroid {\n    buildFeatures {\n\
  \        viewBinding true\n        dataBinding true\n    }\n}\n```\n\n一旦添加了该项，编辑器顶部将出现一个带有\
  \ “Sync Now”（立即同步）链接的黄色条。点击此处以新的构建配置设置同步项目。\n\n### 36.3 添加布局元素\n\n正如“Android Jetpack\
  \ 数据绑定概览”所述，为了能够使用数据绑定，布局层次结构必须有一个布局组件作为根视图。这需要对 `main_fragment.xml` 布局文件（app ->\
  \ res -> layout -> main_fragment.xml）进行以下更改。在布局编辑器工具中打开此文件，切换到 Code 模式并进行这些更改：\n\
  \n\n\n\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <androidx.constraintlayout.widget.ConstraintLayout\n\
  \        xmlns:android=\"http://schemas.android.com/apk/res/android\"\n        xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n        xmlns:tools=\"http://schemas.android.com/tools\"\
  \n        android:id=\"@+id/main\"\n        android:layout_width=\"match_parent\"\
  \n        android:layout_height=\"match_parent\"\n        tools:context=\".ui.main.MainFragment\"\
  >\n    </androidx.constraintlayout.widget.ConstraintLayout>\n</layout>\n```\n\n\
  完成这些更改后，切换回设计（Design）模式。注意新的根视图虽然在布局画布上不可见，但现在已列在组件树中，如图 36-1 所示：\n\n![](img/as_3.5_databinding_layout.jpg)\n\
  \n图 36-1\n\n构建并运行应用，以验证布局元素的添加没有以任何方式改变用户界面的外观。\n\n## 36.4 在布局文件中添加数据元素\n\n将布局文件转换为数据绑定布局文件的下一步是添加数据（data）元素。在本例中，布局将绑定到\
  \ `MainViewModel`，因此请编辑 `main_fragment.xml` 文件并按照如下所示添加数据元素：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <data>\n        <variable\n            name=\"myViewModel\"\n           \
  \ type=\"com.ebookfrenzy.viewmodeldemo.ui.main.MainViewModel\" />\n    </data>\n\
  \    <androidx.constraintlayout.widget.ConstraintLayout\n        android:id=\"@+id/main\"\
  \n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        tools:context=\".ui.main.MainFragment\">\n    </androidx.constraintlayout.widget.ConstraintLayout>\n\
  </layout>\n```\n\n再次构建并运行应用，以确保这些更改生效。\n\n## 36.5 使用绑定类\n\n下一步是修改 `MainFragment.java`\
  \ 文件中的代码以膨胀数据绑定。最有效的方法是重写 `onCreateView()` 方法：\n\n```java\nimport androidx.databinding.DataBindingUtil;\n\
  \npublic class MainFragment extends Fragment {\n    public View onCreateView(@NonNull\
  \ LayoutInflater inflater, @Nullable ViewGroup container,\n                    \
  \         @Nullable Bundle savedInstanceState) {\n        binding = MainFragmentBinding.inflate(inflater,\
  \ container, false);\n        binding = DataBindingUtil.inflate(inflater, R.layout.main_fragment,\
  \ container, false);\n        binding.setLifecycleOwner(this);\n        return binding.getRoot();\n\
  \    }\n}\n```\n\n旧代码只是膨胀了 `main_fragment.xml` 文件（换句话说，创建了包含所有视图对象的布局）并返回了根（顶层容器）的引用。数据绑定库包含一个工具类，它提供了一个特殊的膨胀方法，该方法在构建\
  \ UI 的同时，还会返回布局数据类的实例。新代码调用此方法并将绑定类的引用存储在变量中：\n\n```java\nbinding = DataBindingUtil.inflate(inflater,\
  \ R.layout.main_fragment, container, false);\n```\n\n`binding` 对象只需要在 fragment 存在期间保留在内存中。为了确保在\
  \ fragment 消失时销毁实例，将当前 fragment 声明绑定的生命周期所有者：\n\n```java\nbinding.setLifecycleOwner(this);\n\
  return binding.getRoot();\n```\n\n## 36.6 将 ViewModel 实例分配数据绑定变量\n\n此时，数据绑定知道它将绑定到类型为\
  \ `MainViewModel` 的类实例，但尚未连接到实际的 `MainViewModel` 对象。这需要额外的步骤，将应用内部使用的 `MainViewModel`\
  \ 实例赋值给布局文件中声明的 `viewModel`。由于 `ViewModel` 的引用是在 `onActivityCreated()` 方法中获取的，在此处进行赋值是合理的：\n\
  \n```java\nimport static com.ebookfrenzy.viewmodeldemo.BR.myViewModel;\n\n@Override\n\
  public void onActivityCreated(@Nullable savedInstanceState) {\n    super.onActivityCreated(savedInstanceState);\n\
  \    mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n    binding.setVariable(myViewModel,\
  \ mViewModel);\n}\n```\n\n如果 Android Studio 报告 `myViewModel` 未定义，请使用 `Build -> Make\
  \ Project` 选项重新构建项目以强制生成类。完成这些更改后，下一步是开始在数据绑定文件的视图元素中插入绑定表达式。\n\n## 36.7 添加绑定表达式\n\
  \n第一个绑定表达式将 `resultText` `TextView` 绑定到模型中的结果值。编辑 `main_fragment.xml` 文件，找到 `resultText`\
  \ 元素并修改 `text` 属性，使元素内容如下所示：\n\n```xml\n<TextView\n    android:id=\"@+id/resultText\"\
  \n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:text=\"MainFragment\"\n    android:text='@{safeUnbox(myViewModel.result)\
  \ == 0.0 ? \"Enter value\" : String.valueOf(safeUnbox(myViewModel.result)) + \"\
  \ euros\"}'\n    android:layout_constraintBottom_toBottomOf=\"parent\"\n    android:layout_constraintEnd_toEndOf=\"\
  parent\"\n    android:layout_constraintStart_toStartOf=\"parent\"\n    android:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n表达式首先检查结果是否为零，如果是，则显示提示。如果结果不是零，则将其转换为字符串并拼接“euros”单词后显示给用户。\n\
  \n结果值只需要单向绑定，因为布局不需要更新存储在 `ViewModel` 中的值。相反，`dollarValue` `EditText` 视图需要双向绑定，以便可以使用最新值更新数据模型，并在生命周期事件（例如设备旋转）时在视图中重新显示当前值。`dollarText`\
  \ 元素现在应声明如下：\n\n```xml\n<EditText\n    android:id=\"@+id/dollarText\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginTop=\"\
  96dp\"\n    android:ems=\"10\"\n    android:importantForAutofill=\"no\"\n    android:inputType=\"\
  numberDecimal\"\n    android:text=\"@={myViewModel.dollarValue}\"\n    android:layout_constraintEnd_toEndOf=\"\
  parent\"\n    android:layout_constraintHorizontal_bias=\"0.502\"\n    android:layout_constraintStart_toStartOf=\"\
  parent\"\n    android:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n现在添加了初始绑定表达式后，需要编写一个方法在用户点击\
  \ `Button` 组件时执行转换。\n\n## 36.8 添加转换方法\n\n当点击 `Convert` 按钮时，它将调用 `ViewModel` 上的方法执行转换计算，并将欧元值放入\
  \ `result` `LiveData` 变量。在 `MainViewModel.java` 文件中添加此方法：\n\n```java\npublic class\
  \ MainViewModel extends ViewModel {\n    private static final Float usd_to_eu_rate\
  \ = 0.74F;\n    public MutableLiveData<String> dollarValue = new MutableLiveData<>();\n\
  \    public MutableLiveData<Float> result = new MutableLiveData<>();\n    public\
  \ void convertValue() {\n        if ((dollarValue.getValue() != null) &&\n     \
  \       (!dollarValue.getValue().equals(\"\"))) {\n            result.setValue(Float.parseFloat(dollarValue.getValue())\
  \ * usd_to_eu_rate);\n        }\n    }\n}\n```\n\n\n\n```\n        rate);\n\n  \
  \      } else {\n            result.setValue(0F);\n        }\n    }\n}\n```\n\n\
  请注意，在没有有效的美元数值的情况下，`result` `LiveData` 变量将被赋值为零值。这确保了赋值给 `resultText` `TextView`\
  \ 的绑定表达式在用户未输入任何值时会显示“Enter value”（输入值）消息。\n\n### 36.9 添加监听器绑定\n\n在测试项目之前的最后一步是在布局文件中的\
  \ `Button` 元素添加监听器绑定表达式，以便在点击按钮时调用 `convertValue()` 方法。再次在 Code 模式下编辑 `main_fragment.xml`\
  \ 文件，找到 `convertButton` 元素并如下所示添加 `onClick` 条目：\n\n```xml\n<Button\n    android:id=\"\
  @+id/convertButton\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_marginTop=\"77dp\"\n    android:onClick=\"@{()\
  \ -> myViewModel.convertValue()}\"\n    android:text=\"Convert\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toBottomOf=\"\
  @+id/resultText\" />\n```\n\n### 36.10 测试应用\n\n编译并运行应用，测试在美元字段中输入数值并点击 `Convert`\
  \ 按钮是否会在 `TextView` 上显示正确的结果（连同“euros”后缀），以及在美元字段为空时尝试转换时是否会出现“Enter value”提示。此外，还要验证用户界面中显示的信息在设备旋转后是否仍能保留。\n\
  \n### 36.11 总结\n\n本章的主要目标是完成设置项目使用数据绑定的步骤，并演示单向绑定、双向绑定和监听器绑定表达式的使用。本章还提供了一个实际示例，说明了通过使用数据绑定结合\
  \ `LiveData` 将用户界面视图与应用的后端数据和逻辑连接起来可以节省多少代码编写。\n\n# 37. Android ViewModel 状态保存教程\n\
  \n应用状态的保留与恢复关键在于：在应用置于后台后，能够从外观和行为上为用户提供连续性。用户已经习惯了可以在不同应用之间切换，并在返回原始应用时，发现它处于切换发生前的精确状态。\n\
  \n正如“理解 Android 应用和 Activity 生命周期”章节中所概述的，当用户将应用置于后台时，如果资源受限，该应用将符合操作系统终止的条件。当用户尝试将已终止的应用返回前台时，Android\
  \ 仅仅会在新进程中重新启动应用。由于这一切对用户来说是不可见的，因此应用有责任将其恢复到最初置于后台时的相同状态，而不是以“初始启动”状态呈现。对于基于 `ViewModel`\
  \ 的应用，这种行为很大程度上可以通过 `ViewModel Saved State` 模块来实现。\n\n### 37.1 理解 ViewModel 状态保存\n\
  \n如前面的章节所述，`ViewModel` 为应用开发带来了许多好处，包括在设备旋转等配置更改时恢复 UI 状态。要看到这一实际效果，请运行 `ViewModelDemo`\
  \ 应用（如果你尚未创建项目，请从随书的示例代码下载中加载 Android Studio 的 `ViewModelDemo_LiveData` 项目）。\n\n\
  运行后，输入一个美元数值并将其转换为欧元。在美元和欧元数值都显示的情况下，旋转设备或模拟器，并注意一旦应用响应了方向变化，两个值仍然可见。\n\n但遗憾的是，这种行为并不适用于后台应用进程的终止。在应用仍在运行时，点击设备主页按钮将\
  \ `ViewModelDemo` 应用置于后台，然后通过打开 Android Studio 中的 `Logcat` 工具窗口并点击图 37-1 所示的高亮的\
  \ `terminate` 按钮来终止它（不要点击 Android Studio 工具栏上的停止按钮）：\n\n![](img/as_3.5_logcat_terminate.jpg)\n\
  \n图 37-1\n\n一旦应用被终止，返回设备或模拟器并从启动器选择该应用（不要直接从 Android Studio 内部重新运行应用）。一旦应用出现，它看起来就像刚刚启动的一样，之前的美元和欧元数值都丢失了。然而，从用户的角度来看，应用仅仅是从后台恢复的，理应仍然包含原始数据。在这种情况下，应用未能提供用户预期的连续性。\n\
  \n### 37.2 实现 ViewModel 状态保存\n\n基础的 `ViewModel` 状态保存通过 `ViewModel Saved State` 库实现。该库扩展了\
  \ `ViewModel` 类，使其包含进程终止及后续重新启动时的状态。\n\n保存状态的关键是 `SavedStateHandle` 类，它用于保存和恢复视图的状态。为了支持保存状态，需要声明一种不同的\
  \ `ViewModel` 子类，在这种情况下，它需要包含一个 `SavedStateHandle` 实例。考虑以下来自标准 `ViewModel` 声明的代码片段：\n\
  \n```java\npackage com.ebookfrenzy.viewmodeldemo.main;\n\nimport androidx.lifecycle.ViewModel;\n\
  import androidx.lifecycle.MutableLiveData;\n\npublic class MainViewModel extends\
  \ ViewModel {\n\n}\n```\n\n创建此类类实例的代码可能如下所示：\n\n```java\nprivate MainViewModel mViewModel;\n\
  mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n```\n\n另一方面，设计用于支持保存的\
  \ ViewModel 子类需要如下声明：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.main;\n\n\
  import android.util.Log;\nimport androidx.lifecycle.ViewModel;\nimport androidx.lifecycle.MutableLiveData;\n\
  import androidx.lifecycle.SavedStateHandle;\n\npublic class MainViewModel extends\
  \ ViewModel {\n    private SavedStateHandle savedStateHandle;\n\n    public MainViewModel(SavedStateHandle\
  \ savedStateHandle) {\n        this.savedStateHandle = savedStateHandle;\n    }\n\
  }\n```\n\n在创建上述 `ViewModel` 实例时，必须向 `ViewModelProvider` 类初始化器传递一个 `SavedStateViewModelFactory`\
  \ 实例，如下：\n\n```java\nSavedStateViewModelFactory factory = new SavedStateViewModelFactory(getActivity().getApplication(),this);\n\
  mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n```\n\n### 37.3\
  \ 保存和恢复状态\n\n可以在 `ViewModel` 内部通过传递 `SavedStateHandle` 实例的 `set()` 方法来保存对象或数值，并提供检索时引用的键字符串：\n\
  \n```java\nprivate static final String NAME_KEY = \"Customer Name\";\nsavedStateHandle.set(NAME_KEY,\
  \ customerName);\n```\n\n当配合 `LiveData` 对象时，可以使用 `SavedStateHandle` 实例的 `getLiveData()`\
  \ 方法恢复之前的值，再次引用相应的键：\n\n```java\nMutableLiveData<String> restoredName = savedStateHandle.getLiveData(NAME_KEY);\n\
  ```\n\n要恢复普通（非 LiveData）对象，只需使用 `SavedStateHandle` 的 `get()` 方法：\n\n```java\nString\
  \ restoredName = savedStateHandle.get(NAME_KEY);\n```\n\n其他有用的 `SavedStateHandle`\
  \ 方法包括：\n\n\n\n\n\n- `contains(String key)` - 返回一个布尔值，表示保存的状态是否包含指定键的值。\n- `remove(String\
  \ key)` - 从保存的状态中移除该值和键。返回被移除的值。\n- `keys()` - 返回一个包含保存状态中所有键的 String 集合。\n\n##\
  \ 37.4 为 ViewModelDemo 项目添加已保存状态支持\n\n在涵盖了 ViewModel 已保存状态的基础知识后，可以扩展 `ViewModelDemo`\
  \ 应用以包含此支持。首先，将“An Android Jetpack LiveData Tutorial”中创建的 `ViewModelDemo_LiveData`\
  \ 项目加载到 Android Studio（示例代码下载中也有该项目的副本），打开 `build.gradle`（Module: `ViewModelDemo.app`）文件并添加\
  \ Saved State 库依赖（像既往一样，检查是否有更新的库版本）：\n\n```gradle\ndependencies {\n    implementation\
  \ \"androidx.savedstate:savedstate:1.1.0\"\n    implementation \"androidx.lifecycle:lifecycle-viewmodel-savedstate:2.4.0\"\
  \n}\n```\n\n接下来，修改 `MainViewModel.java` 文件，使构造函数接受并存储 `SavedStateHandle` 实例。同时导入\
  \ `androidx.lifecycle.SavedStateHandle`，声明一个键字符串常量并修改结果 `LiveData` 变量，以便值现在从构造函数中的保存状态获取：\n\
  \n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\nimport androidx.lifecycle.ViewModel;\n\
  import androidx.lifecycle.MutableLiveData;\nimport androidx.lifecycle.SavedStateHandle;\n\
  \npublic class MainViewModel extends ViewModel {\n    private static final String\
  \ RESULT_KEY = \"Euro Value\";\n    private static final Float rate = 0.74F;\n \
  \   private String dollarText = \"\";\n    private SavedStateHandle savedStateHandle;\n\
  \    private MutableLiveData<Float> result = new MutableLiveData<>();\n\n    public\
  \ MainViewModel(SavedStateHandle savedStateHandle) {\n        this.savedStateHandle\
  \ = savedStateHandle;\n        result = savedStateHandle.getLiveData(RESULT_KEY);\n\
  \    }\n}\n```\n\n在 `MainViewModel.java` 文件中继续，修改 `setAmount()` 方法，在每次计算新的欧元金额时都包含保存结果值的代码：\n\
  \n```java\npublic void setAmount(String value) {\n    this.dollarText = value;\n\
  \    result.setValue(Float.valueOf(dollarText)* rate);\n    Float convertedValue\
  \ = Float.parseFloat(dollarText)* rate;\n    result.setValue(convertedValue);\n\
  \    savedStateHandle.set(RESULT_KEY, convertedValue);\n}\n```\n\n完成对 `ViewModel`\
  \ 的更改后，打开 `MainFragment.java` 文件进行以下更改，以便在创建 ViewModel 过程中包含 Saved State 工厂实例：\n\
  \n```java\nimport androidx.lifecycle.SavedStateViewModelFactory;\n\n@Override\n\
  public void onActivityCreated(@Nullable Bundle savedInstanceState) {\n    super.onActivityCreated(savedInstanceState);\n\
  \    SavedStateViewModelFactory factory =\n        new SavedStateViewModelFactory(\n\
  \            getActivity().getApplication(),this);\n    mViewModel = new ViewModelProvider(this,\
  \ factory).get(MainViewModel.class);\n}\n```\n\n完成更改后，构建并运行应用进行货币转换。当屏幕 UI 填充了美元和欧元值时，将应用置于后台，从\
  \ Logcat 工具窗口中终止它，然后从设备或模拟器屏幕重新启动它。重启后，之前的货币金额应该仍然显示在 `TextView` 和 `EditText` 组件中，证实状态已成功保存并恢复。\n\
  \n## 37.5 总结\n\n一个设计良好的应用程序在从后台回到前台时，应该始终向用户呈现相同的状态，无论期间包含应用程序的进程是否被操作系统终止。在处理 `ViewModels`\
  \ 时，可以通过利用 `ViewModel` Saved State 模块来实现这一点。这涉及修改 `ViewModel` 构造函数以接受 `SavedStateHandle`\
  \ 实例，反之，该实例可以通过一系列方法调用来保存和恢复数据值。当创建 `ViewModel` 实例时，必须传递一个 `SavedStateViewModelFactory`\
  \ 实例。一旦实现了这些步骤，应用将在后台终止期间自动保存并恢复状态。\n\n## 38. 使用 Android 生命周期感知感知组件\n\n之前标题为“Understanding\
  \ Android Application and Activity Lifecycles”的章节描述了使用生命周期方法来跟踪 UI 控制器（如 activity\
  \ 或 fragment）内部生命周期状态的变化。这些方法的主要问题之一是它们将负担放在 UI 控制器上。本章将引入能够将生命周期感知构建到 Android 应用中的术语和关键组件。\n\
  \n### 38.1 生命周期感知\n\n如果一个对象能够检测并响应应用内其他对象生命周期状态的变化，则称它是生命周期感知的。某些 Android 组件（`LiveData`\
  \ 是一个很好的例子）已经是生命周期感知的。通过实现 `LifecycleObserver` 接口，也可以配置任何类为生命周期感知。\n\n### 38.2 生命周期所有者\
  \ (Lifecycle Owners)\n\n生命周期感知组件只能观察生命所有者对象的状态。生命所有者实现 `LifecycleOwner` 接口，并分配一个伴的\
  \ `Lifecycle` 对象，该对象负责存储组件当前的状态并向生命周期观察者提供状态信息。大多数 Android Framework 组件（如 `activity`\
  \ 和 `fragment` 类）都是生命所有者。自定义类也可以使用 `LifecycleRegistry` 类并实现 `LifecycleObserver`\
  \ 接口配置为生命所有者。例如：\n\n```java\npublic class SampleOwner implements LifecycleOwner\
  \ {\n    private LifecycleRegistry lifecycleRegistry;\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        lifecycleRegistry = new LifecycleRegistry(this);\n    }\n\n    @NonNull\n\
  \    @Override\n    public Lifecycle getLifecycle() {\n        return lifecycleRegistry;\n\
  \    }\n}\n```\n\n除非生命所有者是另一个生命周期感知组件的子类，否则该类需要通过调用 `LifecycleRegistry` 类的方法来自己触发生命周期状态的变化。`markState()`\
  \ 方法可以通过传递新的状态值来触发生命周期状态更改：\n\n```java\npublic void resuming() {\n    lifecycleRegistry.markState(Lifecycle.State.RESUMED);\n\
  }\n```\n\n\n\n\n上述调用将导致对相应事件处理程序的调用。或者，也可以调用 `LifecycleRegistry.handleLifecycleEvent()`\
  \ 方法并传递要触发的生命周期事件（这将导致生命周期状态改变）。例如：\n\n```\nlifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_START);\n\
  ```\n\n## 38.3 生命周期周期观察者 (Lifecycle Observers)\n\n为了让生命周期感知组件能够观察生命周期所有者（lifecycle\
  \ owner）的状态，它必须实现 `DefaultLifecycleObserver` 接口，并对它需要观察的任何生命周期变化事件重写方法。\n\n```java\n\
  public class SampleObserver implements DefaultLifecycleObserver {\n    // 在此处重写生命周期事件方法\n\
  }\n```\n\n随后创建该观察者类的实例并添加到 Lifecycle 对象维护的观察者列表中。\n\n```\ngetLifecycle().addObserver(new\
  \ SampleObserver());\n```\n\n如果观察者不再需要跟踪生命周期状态，也可以随时从 `Lifecycle` 对象中移除。\n\n图 38-1\
  \ 展示了提供生命周期感知能力的关键元素之间的关系：\n\n![](img/lifecycle_component_diagram.jpg)\n\n图 38-1\n\
  \n## 38.4 生命周期状态与事件 (Lifecycle States and Events)\n\n当生命周期所有者的状态发生变化时，分配的 `Lifecycle`\
  \ 对象将更新为状态。在任何时刻，生命周期所有者都处于以下五个状态之一：\n\n- `Lifecycle.State.INITIALIZED`\n- `Lifecycle.State.CREATED`\n\
  - `Lifecycle.State.STARTED`\n- `Lifecycle.State.RESUMED`\n- `Lifecycle.State.DESTROYED`\n\
  \n随着组件在不同状态之间转换，`Lifecycle` 对象将在已添加到列表的任何观察者上触发事件。在生命周期观察者中可以重写以下事件方法：\n\n- `onCreate()`\n\
  - `onResume()`\n- `onPause()`\n- `onStop()`\n- `onStart()`\n- `onDestroy()`\n\n\
  例如，以下代码重写了 `DefaultLifecycleObserver.onResume()` 方法：\n\n```java\n@Override\npublic\
  \ void onResume(@NonNull LifecycleOwner owner) {\n    // 响应 Resume 状态事件执行任务\n}\n\
  ```\n\n图 38-2 中的流程图说明了生命周期所有者的状态变化序列，以及在每个状态转换之间触发在观察者上的生命周期事件：\n\n![](img/android_lifecycle_states_diagram.jpg)\n\
  \n图 38-2\n\n## 38.5 总结\n\n本章介绍了生命周期感知的基础，以及包含在 Android Jetpack 中的 Android `Lifecycle`\
  \ 包的类和接口。该包包含了许多创建生命周期所有者、生命周期观察者和生命周期感知组件的类和接口。生命周期所有者分配了一个 `Lifecycle` 对象，维护所有者的状态记录和订阅观察者列表。当所有者的状态发生变化时，会通过生命周期事件方法通知观察者，以便响应变化。\n\
  \n下一章将创建一个 Android Studio 项目，演示如何使用和创建生命周期感知组件，包括创建生命周期观察者和所有者，以及处理生命周期状态变化和事件。\n\
  \n## 39. Android Jetpack 生命周期感知教程\n\n上一章概述了生命周期感知的概念，并概述了在 Android 应用项目中实现此点的关键类和接口。本章将在此知识的基础上，构建一个\
  \ Android Studio 项目，旨在突出生命周期感知的实际应用。\n\n### 39.1 创建示例生命周期项目\n\n从欢迎屏幕选择 `New Project`\
  \ 快速启动选项，在生成的新项目对话框中，点击 `Next` 按钮之前选择 `Fragment + ViewModel` 模板。\n\n在 `Name` 字段中输入\
  \ `LifecycleDemo`，并指定包名为 `com.ebookfrenzy.lifecycledemo`。在点击 `Finish` 按钮之前，将 `Minimum\
  \ API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单改为 `Java`。\n\n###\
  \ 39.2 创建生命周期观察者\n\n如前所述，activity 和碎片已经实现了 `LifecycleOwner` 接口，并准备好被其他对象观察。为了在实践中这一点，教程的下一步是在项目中添加一个新类，该类能够观察\
  \ `MainFragment` 实例。\n\n要添加新类，在 Project 工具窗口中右键点击 `app` -> `java` -> `com` -> `ebookfrenzy`\
  \ -> `lifecycledemo`，并从菜单中选择 `New` -> `Java Class...`。在 `New Class` 对话框中，将类命名为 `DemoObserver`\
  \ 并按键盘 `Return` 键创建 `DemoObserver.java` 文件。新文件应自动在编辑器中打开，其内容如下：\n\n```java\npackage\
  \ com.ebookfrenzy.lifecycledemo;\n\npublic class DemoObserver {\n\n}\n```\n\n保持在编辑器中，修改类文件以声明它将实现\
  \ `DefaultLifecycleObserver` 接口：\n\n```java\npackage com.ebookfrenzy.lifecycledemo;\n\
  \nimport androidx.lifecycle.DefaultLifecycleObserver;\n\npublic class DemoObserver\
  \ implements DefaultLifecycleObserver {\n}\n```\n\n下一步是重写 `DefaultLifecycleObserver`\
  \ 类的生命周期方法。在本示例中，所有的事件都将被处理，每个事件向 `Logcat` 面板输出一条显示事件类型的消息。按照以下列表更新观察者类：\n\n```java\n\
  package com.ebookfrenzy.lifecycledemo;\n\nimport android.util.Log;\n\nimport androidx.lifecycle.Lifecycle;\n\
  \n...\n\npublic class DemoObserver implements LifecycleObserver {\n    private String\
  \ LOG_TAG = \"DemoObserver\";\n\n    @Override\n    public void onCreate(@NonNull\
  \ LifecycleOwner owner) {\n        Log.i(LOG_TAG, \"onCreate\");\n    }\n\n    @Override\n\
  \    public void onResume(@NonNull LifecycleOwner owner) {\n        Log.i(LOG_TAG,\
  \ \"onResume\");\n    }\n\n    @Override\n    public void onPause(@NonNull LifecycleOwner\
  \ owner) {\n        Log.i(LOG_TAG, \"onPause\");\n    }\n\n    @Override\n    public\
  \ void onStart(@NonNull LifecycleOwner owner) {\n        Log.i(LOG_TAG, \"onStart\"\
  );\n    }\n\n    @Override\n    public void onStop(@NonNull LifecycleOwner owner)\
  \ {\n        Log.i(LOG_TAG, \"onStop\");\n    }\n\n    @Override\n    public void\
  \ onDestroy(@NonNull LifecycleOwner owner) {\n        Log.i(LOG_TAG, \"onDestroy\"\
  );\n    }\n}\n```\n\n完成 `DemoObserver` 类后，下一步是将其作为观察者添加到 `MainFragment` 中。\n\n###\
  \ 39.3 添加观察者\n\n观察者通过调用所有者 `Lifecycle` 对象的 `addObserver()` 方法被添加到生命周期所有者中，该引用是通过调用\
  \ `getLifecycle()` 方法获取的。编辑 `MainFragment.java` 类文件，并在 `onActivityCreated()` 方法中添加代码以添加观察者：\n\
  \n```java\n...\nimport com.ebookfrenzy.lifecycledemo.DemoObserver;\n...\n\n@Override\n\
  public void onActivityCreated(@Nullable Bundle savedInstanceState) {\n    super.onActivityCreated(savedInstanceState);\n\
  \    mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n    getLifecycle().addObserver(new\
  \ DemoObserver());\n}\n```\n\n创建观察者类并将其添加到生命周期所有者的 `Lifecycle` 对象后，应用已准备好进行测试。\n\
  \n### 39.4 测试观察者\n\n由于 `DemoObserver` 类向 `Logcat` 控制台输出诊断信息，如果配置了过滤器仅显示 `DemoObserver`\
  \ 消息，将将更容易看到输出。使用之前在 “Android Activity 状态变化示例” 中概述的步骤，在运行应用之前为与 `DemoObserver` 标签的消息配置过滤器。\n\
  \n成功启动应用后，Logcat 输出应显示以下生命周期状态变化和事件：\n\nonCreate\n\nonStart\n\nonResume\n\n在应用运行期间，执行设备旋转以触发碎片的销毁和重建，从而产生以下额外输出：\n\
  \n\n\n\n\n`onPause`\n`onStop`\n`onDestroy`\n`onCreate`\n`onStart`\n`onResume`\n\n\
  在进入本章的下一节之前，请花些时间将应用的输出结果与上一章图 38-2 中的流程图进行对比。\n\n## 39.5 创建一个 Lifecycle Owner\n\
  \n本章的最后一个任务是创建一个自定义的生命 owner 类，并演示如何从该类内部触发事件并修改生命周期状态。\n\n在 Project 工具窗口中，右键点击\
  \ app -> `java` -> `com` -> `ebookfrenzy` -> `lifecycledemo` 条目，选择 `New` -> `Java\
  \ Class...` 菜单选项。在 `Create Class` 对话框中将类命名为 `DemoOwner`，按回车键。当新的 `DemoOwner.java`\
  \ 文件加载到编辑器后，对其进行如下修改：\n\n```java\npackage com.ebookfrenzy.lifecycledemo;\n\nimport\
  \ androidx.lifecycle.Lifecycle;\n\nimport androidx.lifecycle.LifecycleOwner;\nimport\
  \ androidx.lifecycle.LifecycleRegistry;\nimport org.jetbrains.annotations.NotNull;\n\
  \npublic class DemoOwner implements LifecycleOwner {\n\n}\n```\n\n该类需要一个用自身引用初始化的\
  \ `LifecycleRegistry` 实例，以及一个配置为返回该 `LifecycleRegistry` 实例的 `getLifecycle()` 方法。声明一个变量来存储\
  \ `LifecycleRegistry` 引用，编写一个构造函数来初始化该实例并添加 `getLifecycle()` 方法：\n\n```java\npublic\
  \ class DemoOwner implements LifecycleOwner {\n\n    private final LifecycleRegistry\
  \ lifecycleRegistry;\n\n    public DemoOwner() {\n        lifecycleRegistry = new\
  \ LifecycleRegistry(this);\n    }\n\n    @NotNull\n    @Override\n    public Lifecycle\
  \ getLifecycle() {\n        return lifecycleRegistry;\n    }\n}\n```\n\n接下来，该类需要通知注册表生命周期状态的变化。可以通过\
  \ `LifecycleRegistry` 对象的 `markState()` 方法标记状态，也可以通过使用 `handleLifecycleEvent()`\
  \ 方法触发生命周期事件。自定义类中什么构成状态更改取决于该类的用途。在本示例中，我们将添加一些在调用时简单触发生命周期事件的方法：\n\n```java\n\
  private LifecycleRegistry lifecycleRegistry;\n\n    public void startOwner() {\n\
  \        lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_START);\n   \
  \ }\n\n    public void stopOwner() {\n        lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_STOP);\n\
  \    }\n\n    @NotNull\n    @Override\n    public Lifecycle getLifecycle() {\n \
  \       return lifecycleRegistry;\n    }\n```\n\n`DemoOwner` 类中的最后一个更改是添加 `DemoObserver`\
  \ 类作为观察者。此调用将在构造函数中如下执行：\n\n```java\npublic DemoOwner() {\n    lifecycleRegistry\
  \ = new LifecycleRegistry(this);\n    getLifecycle().addObserver(new DemoObserver());\n\
  }\n```\n\n将 `MainFragment.java` 文件加载到编辑器，找到 `onActivityCreated()` 方法并添加代码创建 `DemoOwner`\
  \ 类的实例，并调用 `startOwner()` 和 `stopOwner()` 方法。同时注意，添加 `DemoObserver` 作为观察者的调用已被移除。虽然一个观察者可以用于多个\
  \ owner，但在情况下将其移除是为了避免在 Logcat 工具窗口中产生重复且混淆的输出：\n\n```java\nimport com.ebookfrenzy.lifecycledemo.DemoOwner;\n\
  \nprivate DemoOwner demoOwner;\n\n@Override\npublic void onActivityCreated(@Nullable\
  \ Bundle savedInstanceState) {\n    super.onActivityCreated(savedInstanceState);\n\
  \    mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n    demoOwner\
  \ = new DemoOwner();\n    demoOwner.startOwner();\n    demoOwner.stopOwner();\n\
  \    getLifecycle().addObserver(new DemoObserver());\n}\n```\n\n## 39.6 测试自定义 Lifecycle\
  \ Owner\n\n最后一次构建并运行应用，参考 Logcat 工具窗口并确认观察者按照以下顺序检测到创建、启动和停止生命周期事件：\n\n`onCreate`\n\
  `onStart`\n`onStop`\n\n注意，尽管没有在 `DemoOwner` 类中添加代码来手动执行此操作，“已创建”状态更改仍被触发了。事实上，这些是在\
  \ owner 实例首次创建时以及随后的处理 `ON_STOP` 事件时自动触发的。\n\n## 39.7 总结\n\n本章 Practical 演示了在 Android\
  \ 应用中实现生命周期感知所涉及的步骤。这包括创建生命周期观察者以及基础生命周期 owner 类的设计与实现。\n\n## 40. 导航架构组件概览\n\n如今很少有\
  \ Android 应用仅由单个屏幕组成。实际上，大多数应用包含多个屏幕，用户通过这些屏幕进行导航。然而，随着支持导航图的 Android 导航组件的引入，这种情况得到了显著改善。\n\
  \n### 40.1 了解导航\n\n每个应用都有一个在应用启动后显示的主屏幕（启动页页是应用加载时显示的品牌屏幕）。从这个主屏幕开始，用户通常会执行会导致其他屏幕出现的任务。这些屏幕通常以\
  \ activity 和 fragment 的形式存在。例如，消息应用可能有一个列出当前消息的主屏幕，用户可以从那里导航到另一个屏幕以访问联系人列表或设置屏幕。联系人列表屏幕反过来允许用户导航到其他屏幕，在其中可以添加新用户或更新现有联系人。在图形上，应用的导航图可以如图\
  \ 40-1 所示：\n\n(image/jetpack_navigation_graph.jpg)\n\n图 40-1\n\n构成应用的每个屏幕（包括主屏幕）被称为目的地（destination），通常是一个\
  \ fragment 或 activity。Android 导航架构使用导航栈来跟踪用户通过目的地的路径。应用首次启动时，主屏幕是第一个放入栈中的目的地，并成为当前目的地。当用户导航到另一个目的地时，该屏幕成为当前目的地并推入栈中。随着用户导航到其他屏幕，它们也会被推入栈中。图\
  \ 40-2 例如，显示了假设消息应用在用户启动应用并导航到“添加联系人”屏幕后的导航栈状态：\n\n(image/jetpack_navigation_stack_diagram.jpg)\n\
  \n图 40-2\n\n当用户使用系统返回键返回屏幕时，每个目的地都会从栈中弹出，直到主屏幕再次成为栈上的唯一目的地。在图 40-3 中，用户已从添加联系人屏幕返回，将其从栈中弹出并使联系人列表屏幕成为当前目的地：\n\
  \n(image/jetpack_navigation_stack_pop_diagram.jpg)\n\n图 40-3\n\n在目的地之间导航和管理导航栈的所有工作都由导航控制器处理，该控制器由\
  \ `NavController` 类表示。\n\n\n\n\n使用 Navigation Architecture 组件为 Android 项目添加导航是一个简单的过程，涉及导航宿主（navigation\
  \ host）、导航图（navigation graph）、导航动作（navigation actions）以及少量代码编写，以便获取与导航控制器（navigation\
  \ controller）实例的交互。\n\n## 40.2 声明导航宿主\n\n导航宿主就是一个特殊的 fragment（`NavHostFragment`），它嵌入到\
  \ activity 的用户界面布局中，作为用户将导航的目的地的占位符。例如，图 40-4 显示了一个典型的 activity 屏幕，并突出了由导航宿主 fragment\
  \ 代表的区域：\n\n![](img/jetpack_navigation_navhost.jpg)\n\n图 40-4\n\n可以在 Android Studio\
  \ 布局编辑器中通过从调色板的 Containers 部分拖入实例，或者通过以下手动编辑 XML，将 `NavHostFragment` 放入 activity\
  \ 布局中：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<FrameLayout xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:id=\"@+id/container\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\" >\n    <androidx.fragment.app.FragmentContainerView\n\
  \        android:id=\"@+id/demo_nav_host_fragment\"\n        android:name=\"androidx.navigation.fragment.NavHostFragment\"\
  \n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        app:defaultNavHost=\"true\"\n        app:navGraph=\"@navigation/navigation_graph\"\
  \ />\n</FrameLayout>\n```\n\n上述导航宿主 fragment 元素的注意点是 `name` 属性中对 `NavHostFragment`\
  \ 的引用、将 `defaultNavHost` 设置为 `true` 以及将包含导航图的文件分配给 `navGraph` 属性。\n\n当 activity\
  \ 启动时，此导航宿主 fragment 被导航图中指定的首页目的地替换。当用户在应用屏幕之间导航时，宿主 fragment 将被对应目的地的 fragment\
  \ 替换。\n\n## 40.3 导航图\n\n导航图是一个 XML 文件，包含了将包含在应用导航中的目的地。除了这些目的地，该文件还包含了定义目的地之间导航的导航动作，以及用于从一个目的地传递数据到另一个目的可选参数。Android\
  \ Studio 包含一个导航图编辑器，可以使用可视化方式或手动编辑 XML 来设计图表并实现动作。\n\n图 40-5 显示了 Design 模式下的 Android\
  \ Studio 导航图编辑器：\n\n![](img/as_4.1_navigation_graph_editor.jpg)\n\n图 40-5\n\n目的地列表\
  \ (A) 提供了图中当前包含的所有目的地的列表。从列表中选择一个将定位并选中图中的相应目的地（这对于在大型图中定位特定目的地特别有用）。导航图面板 (B) 包含每个目的地的对话框，显示了用户界面布局的表示。在此例中，此图表包含两个名为\
  \ `mainFragment` 和 `secondFragment` 的目的地。目的地之间的箭头 (C) 代表导航动作连接。可以通过将鼠标指针悬停在起点边缘直到出现圆圈，然后从圆圈拖动到目的地来添加动作。属性面板\
  \ (D) 允许查看和修改当前选中目的地或动作连接的属性。在上面的图中，显示了动作的属性。通过点击标记为 E 的按钮并从菜单中选择选项来添加新目的地。可以选择现有的\
  \ fragment 或 activity 作为目的地，也可以创建新的空白 fragment 目的地。组件树面板 (F) 提供了导航图的层级概述。\n\n可以通过将编辑器切换到\
  \ Code 模式来查看和修改导航图的底层 XML。以下 XML 列表代表了 图 40-5 所示目的地和动作连接的导航图：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:id=\"@+id/navigation_graph\"\n \
  \   app:startDestination=\"@id/mainFragment\">\n    <fragment\n        android:id=\"\
  @+id/mainFragment\"\n        android:name=\"com.ebookf.navigation.demo.MainFragment\"\
  \n        android:label=\"main_fragment\"\n        tools:layout=\"@layout/fragment_main\"\
  >\n        <action\n            android:id=\"@+id/mainToSecond\"\n            app:destination=\"\
  @id/secondFragment\" />\n    </fragment>\n    <fragment\n        android:id=\"@+id/secondFragment\"\
  \n        android:name=\"com.ebookf.navigation.demo.SecondFragment\"\n        android:label=\"\
  fragment_second\"\n        tools:layout=\"@layout/fragment_second\" />\n</navigation>\n\
  ```\n\n如有必要，导航图也可以拆分到多个文件中以改进组织并促进重用。当以这种结构组织时，嵌套图（nested graphs）会被嵌入到根图中。要创建嵌套图，只需对要嵌套的目的地按\
  \ Shift+点击，右键点击第一个目的地并选择“Move to Nested”（移动到嵌套图）。嵌套图将作为图中的新节点出现。要访问嵌套图，只需双击嵌套图节点加载图。\n\
  \n## 40.4 获取导航控制器\n\n从一个目的地导航到另一个目的地通常响应应用内的某种事件，例如按钮点击或菜单选择。在触发导航动作之前，代码必须首先获取控制器的引用。这需要调用\
  \ `Navigation` 或 `NavHostFragment` 类的 `findNavController()` 方法。例如，以下代码可用于访问 activity\
  \ 的导航控制器。注意，为了让代码工作，activity 必须包含导航宿主 fragment\n\n```java\nNavController controller\
  \ = Navigation.findNavController(activity, R.id.demo_nav_host_fragment);\n```\n\n\
  在这种情况下，方法调用传递了 activity 的引用和嵌入 activity 布局的 `NavHostFragment` 的 ID。\n\n另一种方法是通过将任何视图传递给方法来识别与其关联的导航控制器：\n\
  \n```java\nNavController controller = Navigation.findNavController(binding.button);\n\
  ```\n\n最后的选项是通过传递 fragment 的引用来查找该 fragment 的导航控制器：\n\n```java\nNavController controller\
  \ = NavHostFragment.findNavController(fragment);\n```\n\n## 40.5 触发导航动作\n\n一旦找到导航控制器，就可以通过控制器的\
  \ `navigate()` 方法并传递要执行动作的资源 ID 来触发导航动作。例如：\n\n```java\ncontroller.navigate(R.id.goToContactsList);\n\
  ```\n\n当选择动作连接时，在导航图编辑器的属性面板中定义动作的 ID。\n\n## 40.6 传递参数\n\n\n\n\n在导航操作期间，可以使用导航图文件中声明的参数将数据从一个目的地传递到另一个目的地。一个参数由名称、类型以及一个可选的默认值组成，可以在\
  \ XML 中手动添加，也可以在图中选择动作箭头或目的地时使用属性（Attributes）面板添加。例如，在图 40-6 中，声明了一个名为 `contactsCount`\
  \ 的整数型参数，其默认值为 0：\n\n![](img/jetpack_navigation_action.jpg)\n\n图 40-6\n\n一旦添加，参数将放置在接收目的地的\
  \ XML 元素中，例如：\n\n```xml\n<fragment\n    android:id=\"@+id/secondFragment\"\n   \
  \ android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\n    android:label=\"\
  fragment_second\"\n    tools:layout=\"@layout/fragment_second\" >\n    <argument\n\
  \        android:name=\"contactsCount\"\n        android:defaultValue=0\n      \
  \  app:type=\"integer\" />\n</fragment>\n```\n\n导航架构组件提供了两种在目的地之间传递数据的技术。一种方法是将数据放入\
  \ `Bundle` 对象中，在动作期间将其传递给目的地，然后在该处进行解包并提取参数。\n\n这种特定方法的主要缺点是它不是“类型安全”的。换句话说，如果接收目的地将参数视为与其声明的类型不同的类型（例如将字符串处理为整数），此错误不会被编译器捕获，并可能在运行时引发问题。\n\
  \n更好的选择（也是本书中所采用的方法）是使用 `safeargs`。`safeargs` 是 Android Studio Gradle 构建系统的一个插件，它能够自动生成特殊类，允许以类型安全的方式传递参数。`safeargs`\
  \ 参数传递方法将在下一章中进行描述和演示（“Android Jetpack 导航组件教程”）。\n\n## 40.7 总结\n\n在 Android 应用用户界面的背景下，“导航”（Navigation）一词指的是用户在不同屏幕之间来回移动。曾经实现这种功能非常耗时且难以组织，而现在\
  \ Android Studio 和导航架构组件使得在 Android 应用项目中实现和管理导航变得更加简单。\n\n应用中的不同屏幕被称为目的地（destinations），通常由碎片（fragments）或活动（activities）表示。所有应用都有一个主目的地，包含应用首次加载时显示的屏幕。该布局的内容区域被一个导航主机碎片（navigation\
  \ host fragment）取代，当用户导航应用时，该碎片会切换为其他目的地碎片。导航路径由导航图文件定义，该文件由目的地以及连接它们的动作（以及要在目的地之间传递的参数）组成。导航由导航控制器（navigation\
  \ controllers）处理，它们除了管理导航栈外，还提供了从应用代码启动导航动作的方法。\n\n## 41. Android Jetpack 导航组件教程\n\
  \n上一章描述了 Android Jetpack 导航组件以及它如何与 Android Studio 的导航图表功能集成，从而为在 Android 应用屏幕之间实现导航提供简单的方法。在本章中，将创建一个新的\
  \ Android Studio 项目，该将利用这些导航功能来实现一个包含多个屏幕的示例应用。除了演示 Android Studio 导航图编辑器的用法外，示例项目还将实现使用类型安全的参数在源屏幕和目的地屏幕之间传递数据。\n\
  \n### 41.1 创建 NavigationDemo 项目\n\n从欢迎界面上选择“New Project”（新建项目）选项，在弹出的新项目对话框中，点击“Next”（下一步）按钮之前选择“Fragment\
  \ + ViewModel”模板。\n\n在 `Name` 字段中输入 `NavigationDemo`，并指定 `com.ebookfrenzy.navigationdemo`\
  \ 为包名。在点击“Finish”（完成）按钮之前，将 Minimum API level（最低 API 级别）设置为 `API 26`：Android 8.0\
  \ (Oreo)，并将 Language（语言）菜单设置为 `Java`。\n\n### 41.2 向构建配置添加导航\n\n默认情况下，新的 Android\
  \ Studio 项目在构建文件中不包含导航组件库。因此，在执行任何其他任务之前，第一步是修改应用级的 `build.gradle` 文件。在项目工具窗口找到该文件（`Gradle\
  \ Scripts` -> `build.gradle (Module: NavigationDemo.app)`），双击它将其加载到代码编辑器中，并修改 `dependencies`\
  \ 部分以添加导航库。同时，利用此机会为此模块启用视图绑定（view binding）：\n\n```gradle\nandroid {\n    buildFeatures\
  \ {\n        viewBinding true\n    }\n}\n\n.\n\ndependencies {\n    implementation\
  \ 'androidx.navigation:navigation-fragment:2.4.2'\n    implementation 'androidx.navigation:navigation-ui:2.4.2'\n\
  }\n.\n```\n\n注意，自本书出版以来，这些库可能已发布更新版本。要识别并使用更新版本的库，请将上述行添加到构建文件中，然后打开 Project Structure（项目结构）对话框（`File`\
  \ -> `Project Structure...`）。在 Project Structure 对话框中，选择 `Suggestions`（建议）选项显示可用更新。如果有新的库版本，点击\
  \ `Update`（更新）按钮，确保在点击 `Apply`（应用）按钮之前在 `build.gradle` 文件中使用这些最新版本：\n\n![](img/as_3.4_project_structure_suggestions.jpg)\n\
  \n图 41-1\n\n在文件中添加导航依赖后，点击 `Sync Now`（立即同步）链接以重新同步构建配置。\n\n### 41.3 创建导航图文件\n\n\
  在构建配置中添加导航库后，现在可以向项目添加导航图资源文件了。正如“导航组件概述”概述，这是一个 XML 文件，包含了用户可以导航的碎片和活动，以及执行转换的动作和目的地之间传递的任何数据。\n\
  \n在项目工具窗口中，定位到 `res` 文件夹（`app` -> `res`），右键点击它并选择 `New` -> `Android Resource File`\
  \ 选项：\n\n![](img/as_3.2_navigation_menu.jpg)\n\n图 41-2\n\n选择菜单项后，将出现 New Resource\
  \ File 对话框。在此对话框中，将文件命名为 `navigation_graph`，并将 Resource type 菜单更改为 `Navigation`（图\
  \ 41-3\n\n图 41-3\n\n导航图资源文件添加到项目后，它将出现在主面板中，准备添加目的地。将编辑器切换到 Code 模式并在添加任何目的地之前检查图的\
  \ XML：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<navigation xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    android:id=\"@+id/navigation_graph\">\n\n</navigation>\n```\n\n切换回编辑器的 Design\
  \ 模式，注意 Destinations 面板的 Host 部分显示项目中未检测到任何导航主机碎片：\n\n![](img/as_4.1_navigation_no_hosts.jpg)\n\
  \n图 41-4\n\n在向导航图添加任何目的地之前，下一步是向项目添加一个导航主机碎片。\n\n### 41.4 声明导航主机\n\n\n\n\n对于此项目，导航宿片段（navigation\
  \ host fragment）将包含在主 Activity 的用户界面布局中。这意味着导航图中的目标片段将出现在主活动的内容区域，该区域目前由 `main_fragment.xml`\
  \ 布局占据。在 Project 工具窗口（`app -> res -> layout -> main_activity.xml`）中找到主活动布局文件，并将其加载到布局编辑器中。\n\
  \n在布局编辑器的设计（Design）模式下，从调面板（Palette）的容器（Containers）部分拖入 `NavHostFragment` 元素，将其将其到活动布局的容器区域，如图\
  \ 41-5 箭头所示：\n\n![](img/as_3.6_add_navhostfragment.jpg)\n\n图 41-5\n\n在弹出的导航图（Navigation\
  \ Graphs）对话框中，选择在上节中创建的 `navigation_graph.xml` 文件并点击 OK 按钮。\n\n在布局中选中新添加的 `NavHostFragment`\
  \ 实例，使用属性（Attributes）工具窗口将元素的 ID 更改为 `demo_nav_host_fragment`。\n\n将布局编辑器切换到代码（Code）模式并检查\
  \ XML 文件。注意编辑器已正确配置了导航图属性以引用 `navigation_graph.xml` 文件，并且 `defaultNavHost` 属性已设置为\
  \ `true`：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<FrameLayout xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:id=\"@+id/container\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\" >\n    <androidx.fragment.app.FragmentContainerView\n\
  \        android:id=\"@+id/demo_nav_host_fragment\"\n        android:name=\"androidx.navigation.fragment.NavHostFragment\"\
  \n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        app:defaultNavHost=\"true\"\n        app:navGraph=\"@navigation/navigation_graph\"\
  \ />\n</FrameLayout>\n```\n\n在主活动布局文件中配置好 `NavHostFragment` 后，需要从 `MainActivity.java`\
  \ 类文件中删除一些代码，以防止活动在运行时加载 `main_fragment.xml` 文件。将此文件加载到代码编辑器，找到 `onCreate()` 方法并删除负责显示主片段的代码：\n\
  \n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n   \
  \ super.onCreate(savedInstanceState);\n    setContentView(R.layout.main_activity);\n\
  \    if (savedInstanceState == null) {\n        getSupportFragmentManager().beginTransaction()\n\
  \            .replace(R.id.container, MainFragment.newInstance())\n            .commitNow();\n\
  \    }\n}\n```\n\n返回 `navigation_graph.xml` 文件并确认已检测到 `NavHostFragment` 实例（可能需要在更改出现之前需要关闭并重新打开文件）：\n\
  \n![](img/as_4.1_navigation_host_added.jpg)\n\n图 41-6\n\n## 41.5 添加导航目标\n\n继续留在导航图中，现在是添加第一个目标的时间了。由于项目已经有一个用于第一个屏幕的片段（`main_fragment.xml`），它将成为添加到图中的第一个目标。点击如图\
  \ 41-7 所示的新目标按钮，以选择或创建目标：\n\n![](img/as_4.1_navigation_add_destination.jpg)\n\n\
  图 41-7\n\n选择 `main_fragment` 作为目标，使其显示在导航图中：\n\n![](img/as_4.1_navigation_first_fragment_added.jpg)\n\
  \n图 41-8\n\n位于目标节点上方的首页图标表示这是起始目标（start destination）。这意味着当包含 `NavHostFragment` 的活动创建时，该目标将是第一个显示的界面。要将起始目标更改为另一个目标，请选择图中的该节点并点击工具栏上的主页按钮。\n\
  \n通过将编辑器切换到代码模式来检查导航图的 XML 内容：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\n \
  \   xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    app:startDestination=\"@id/main_fragment\">\n    <fragment\n        android:id=\"\
  @+id/main_fragment\"\n        android:name=\"com.example.app.MainFragment\"\n  \
  \      android:label=\"main\"\n        tools:layout=\"@layout/main_fragment\" />\n\
  </navigation>\n```\n\n在执行任何导航之前，图至少还需要另外一个目标。切换回设计（Design）模式并点击新目标（New Destination），将新片段命名为\
  \ `SecondFragment` 并点击完成（Finish）。在项目重新构建的简短延迟后，新片段将作为另一个目标显示，如图 41-9 所示：\n\n![](img/as_3.2_navigation_destination.jpg)\n\
  \n图 41-9\n\n## 41.6 设计目标布局\n\n在添加用于在目标之间跳转的动作之前，现在是为两个目标片段添加一些用户界面组件的好时机。首先双击 `mainFragment`\
  \ 目标，使 `main_fragment.xml` 加载到布局编辑器中。选择并删除当前的 `TextView`，然后将 `Button` 和 `EditText`\
  \ 控件拖放到布局中，使其看起来像图 41-10 所示：\n\n![](img/as_4.1_navigation_demo_ui.jpg)\n\n图 41-10\n\
  \n一旦视图位置正确，点击工具栏上的“推断约束”（Infer constraints）按钮为布局添加任何缺失的约束。选择 `EditText` 视图并使用属性（Attributes）工具窗口删除默认的“Name”文本并将控件的\
  \ ID 更改为 `userText`。\n\n返回 `navigation_graph.xml` 文件并双击 `secondFragment` 目标将 `fragment_second.xml`\
  \ 文件加载到布局编辑器中，然后选择并删除默认的 `TextView` 实例。在组件树（Component Tree）面板中，右键点击 `FrameLayout`\
  \ 项并选择“从 FrameLayout 转换为 ConstraintLayout...”（Convert from FrameLayout to ConstraintLayout...）菜单选项，在生成的转换对话框中接受默认设置：\n\
  \n![](img/as_3.2_navigation_convert_framayout.jpg)\n\n图 41-11\n\n使用属性工具窗口将 `ConstraintLayout`\
  \ 的 ID 更改为 `constraintLayout`。由于片段的父布局管理器现在已转换为更灵活的 `ConstraintLayout`，拖放一个新的 `TextView`\
  \ 控件使其位于布局中心，并点击“推断约束”按钮添加任何缺失的约束。选中新的 `TextView` 后，使用属性面板将 ID 更改为 `argText`。\n\n\
  ## 41.7 为导航图添加动作\n\n现在两个目标已经添加到图中，并设计了相应的用户界面布局，项目现在需要一种让用户从主片段导航到第二个片段的方法。这将通过向图添加动作（action）来实现，然后可以在应用程序代码中引用它。\n\
  \n要建立以主片段为起点、第二个片段为目标的动作连接，打开导航图并将鼠标指针悬停在 `mainFragment` 目标右边缘的垂直中心上，会出现如图 41-12\
  \ 中高亮显示的圆：\n\n![](img/as_4.1_navigation_connection_circle.jpg)\n\n图 41-12\n\n\n\n\
  \n在圆内点击并拖动生成的线条到 `secondFragment` 目标：\n\n![](img/as_4.1_navigation_connecting.jpg)\n\
  \n图 41-13\n\n释放线条以建立起点和终点之间的操作连接，此时线条将变为一个箭头，如如图 41-14 所示：\n\n![](img/as_4.1_navigation_connected.jpg)\n\
  \n图 41-14\n\n随时可以通过选中操作连接并按下键盘上的 `Delete` 键来删除操作连接。选中箭头后，检查 `Attributes` 工具窗口中可用的属性，并将\
  \ `ID` 改为 `mainToSecond`。该 ID 是代码中引用该操作的标识。将编辑器切换到 `Code` 模式，注意该操作现在已包含在 XML 中：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<navigation xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:id=\"@+id/navigation_graph\"\
  \n    app:startDestination=\"@id/mainFragment\">\n    <fragment\n        android:id=\"\
  @+id/mainFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.ui.main.MainFragment\"\
  \n        android:label=\"main_fragment\"\n        tools:layout=\"@layout/main_fragment\"\
  \ >\n        <action\n            android:id=\"@+id/mainToSecond\"\n           \
  \ app:destination=\"@id/secondFragment\" />\n    </fragment>\n    <fragment\n  \
  \      android:id=\"@+id/secondFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\
  \n        android:label=\"fragment_second\"\n        tools:layout=\"@layout/fragment_second\"\
  \ />\n</navigation>\n```\n\n 41.8 实现 `OnFragmentInteractionListener`\n\n在添加代码以触发操作之前，需要修改\
  \ `MainActivity` 类以实现 `OnFragmentInteractionListener` 接口。该接口是在导航图编辑器中创建空白片段时，在 `SecondFragment`\
  \ 类中生成的。为了符合该接口，活动需要实现一个名为 `onFragmentInteraction()` 的方法，该方法用于实现片段与活动之间的通信。\n\n\
  编辑 `MainActivity.java` 文件并进行修改，如下：\n\n```java\nimport android.net.Uri;\n\npublic\
  \ class MainActivity extends AppCompatActivity implements SecondFragment.OnFragmentInteractionListener\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        setContentView(R.layout.main_activity);\n\
  \    }\n    @Override\n    public void onFragmentInteraction(Uri uri) {\n    }\n\
  }\n```\n\n如果 Android Studio 报告 `OnFragmentInteractionListener` 未定义（某些版本的 Android\
  \ Studio 会自动添加，而另一些则不会），请编辑 `SecondFragment.java` 文件并按如下添加：\n\n```java\nimport android.net.Uri;\n\
  \npublic interface OnFragmentInteractionListener {\n    // TODO: Update argument\
  \ type and name\n    void onFragmentInteraction(Uri uri);\n}\n```\n\n### 41.9 为目标片段添加\
  \ View Binding 支持\n\n由于我们需要访问片段布局中的某些视图，我们需要修改当前代码以启用视图绑定支持。首先编辑 `MainFragment.java`\
  \ 文件并进行以下更改：\n\n```java\nimport com.ebookfrenzy.navigationdemo.databinding.MainFragmentBinding;\n\
  \npublic class MainFragment extends Fragment {\n    private MainViewModel mViewModel;\n\
  \    private MainFragmentBinding binding;\n    public static MainFragment newInstance()\
  \ {\n        return new MainFragment();\n    }\n    @Nullable\n    @Override\n \
  \   public View onCreateView(@NonNull LayoutInflater inflater, @Nullable ViewGroup\
  \ container,\n                             @Nullable Bundle savedInstanceState)\
  \ {\n        return inflater.inflate(R.layout.main_fragment, container, false);\n\
  \        binding = MainFragmentBinding.inflate(inflater, container, false);\n  \
  \      return binding.getRoot();\n    }\n    @Override\n    public void onDestroyView()\
  \ {\n        super.onDestroyView();\n        binding = null;\n    }\n}\n```\n\n\
  对 `SecondFragment.java` 重复上述步骤，这次引用 `SecondBinding`。\n\n### 41.10 触发操作\n\n现在操作已添加到导航图中，下一步是在主片段中添加代码，以便在点击\
  \ `Button` 时触发该操作。找到 `MainFragment.java` 文件，将其加载到编辑器中并修改 `onCreated()` 方法以获取按钮的引用并配置\
  \ `OnClickListener` 实例：\n\n```java\nimport android.widget.Button;\nimport androidx.navigation.Navigation;\n\
  \npublic class MainFragment extends Fragment {\n    @Override\n    public void onCreated(@Nullable\
  \ Bundle savedInstanceState) {\n        super.onCreated(savedInstanceState);\n \
  \       mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n   \
  \     button.setOnClickListener(new View.OnClickListener() {\n            @Override\n\
  \            public void onClick(View view) {\n                Navigation.findNavController(view).navigate(R.id.mainToSecond);\n\
  \            }\n        });\n    }\n}\n```\n\n编译并运行应用，验证点击主片段中的按钮是否跳转到第二个片段。作为设置监听器方法的替代方案，`Navigation`\
  \ 类还包含一个名为 `createNavigateOnClickListener()` 的方法，提供了更高效的方法来设置监听器并导航。因此，可以使用以下单行代码实现相同的结果：\n\
  \n```java\nbutton.setOnClickListener(Navigation.createNavigateOnClickListener(R.id.mainToSecond,\
  \ null));\n```\n\n### 41.11 使用 Safeargs 传递数据\n\n下一个目标是将主片段中 `EditText` 视图输入的文本传递到第二个片段，并在那里显示在\
  \ `TextView` 上上。如上一章所述，Android Navigation 组件支持两种传递数据的方法。本章将使用类型安全的传递。\n\n使用 `safeargs`\
  \ 的第一步是在 Gradle 构建配置中添加插件。使用 `Project` 工具窗口，定位并编辑项目级 `build.gradle` 文件（`Gradle Scripts\
  \ -> build.gradle (Project: NavigationDemo)`），如下所示添加插件依赖（再次提醒可能有更更新的版本）：\n\n```gradle\n\
  // 顶层构建文件，可为所有子项目/模块添加配置选项\nbuildscript {\n    dependencies {\n        classpath(\"\
  androidx.navigation:navigation-safe-gradle-plugin:2.5.0-rc01\")\n    }\n}\n\nplugins\
  \ {\n    id 'com.android.application' version '7.2.0' apply false\n    id 'com.android.library'\
  \ version '7.2.0' apply false\n    id 'org.jetbrains.kotlin.android' version '1.6.10'\
  \ apply false\n}\n```\n\n接下来，编辑模块级 `build.gradle` 文件（`Gradle Scripts -> build.gradle\
  \ (Module: App)`）按如下所示应用插件，并在提示时同步项目：\n\n```gradle\nplugins {\n    id 'com.android.application'\n\
  \    id 'androidx.navigation.safeargs'\n}\n```\n\n\n\n\n\n下一步是定义目标将接收的任何参数，在本例中，目标是第二个片段（fragment）。编辑导航图，选择\
  \ `secondFragment` 目标，并在属性（Attributes）工具窗口中找到 `Arguments` 部分。点击 `+` 按钮（在图 41-15\
  \ 中突出显示）为目标添加新参数：\n\n![](img/as_3.6_nav_graph_add_argument.jpg)\n\n图 41-15\n\n点击\
  \ `+` 按钮后，会弹出一个对话框，需要在其中输入参数名称、类型和默认值。将参数命名为 `message`，将类型设置为 `String`，并在默认值字段输入\
  \ `No Message`：\n\n![](img/as_3.6_nav_graph_add_argument_dialog.jpg)\n\n图 41-16\n\
  \n新配置的参数将显示在 `navigation_graph.xml` 文件的 `secondFragment`元素中，所示：\n\n```xml\n<fragment\n\
  \    android:id=\"@+id/secondFragment\"\n    android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\
  \n    android:label=\"fragment_second\"\n    tools:layout=\"@layout/fragment_second\"\
  \ >\n    <argument\n        android:name=\"message\"\n        app:argType=\"string\"\
  \ />\n        android:defaultValue=\"No Message\"\n</fragment>\n```\n\n下一步是向 `MainFragment.java`\
  \ 文件添加代码，以从 `EditText` 视图提取文本并在导航动作期间将其传递给第二个片段。这将涉及使用一些由 `safeargs` 插件自动生成的特殊导航类。目前，导航涉及\
  \ `MainFragment` 类、`SecondFragment` 类、一个名为 `mainToSecond` 的导航动作以及名为 `message` 的参数。\n\
  \n当构建项目时，`safeargs` 插件将生成以下额外的类，用于在导航期间传递和接收参数：\n\n- `MainFragmentDirections`：此类表示导航动作的起点（使用导航源类名命名，并在末尾附加“Directions”），并提供对动作对象的访问。\n\
  - `ActionMainToSecond`：表示执行转换的动作类（根据导航图文件中分配给动作的 ID 命名，前缀为“Action”）。该类包含目标上配置的每个参数的\
  \ setter 方法。例如，由于第二个片段目标包含一个名为 `message` 的参数，该类包含一个名为 `setMessage()` 的方法。一旦配置，该类的实例将传递给导航控制器的\
  \ `navigate()` 方法以导航到目标。\n- `SecondFragmentArgs`：在目标片段中用于访问从起点传递的参数的类（使用导航目标类名命名，并在末尾附加“Args”）。此类包含传递给目标的每个参数的\
  \ getter 方法（即 `getMessage()`）。\n\n使用这些类，可以如下所示修改 `MainFragment.java` 文件 `onActivityCreated()`\
  \ 方法中的 `OnClickListener` 代码，以从 `EditText` 小部件提取当前文本，将其应用于动作并启动到第二个片段的转换：\n\n```java\n\
  binding.button.setOnClickListener(new View.OnClickListener() {\n    @Override\n\
  \    public void onClick(View view) {\n        Navigation.findNavController(view).navigate(\n\
  \                            R.id.mainToSecond);\n        MainFragmentDirections.MainToSecond\
  \ action =\n                               MainFragmentDirections.mainToSecond();\n\
  \        action.setMessage(binding.userText.getText().toString());\n        Navigation.findNavController(view).navigate(action);\n\
  \    }\n});\n```\n\n上述代码获取动作对象的引用，使用 `setMessage()` 方法设置消息参数字符串，然后调用导航控制器的 `navigate()`\
  \ 方法并传递动作对象。如果 Android Studio 报告 `MainFragmentDirections` 未定义，请使用 `Build -> Make\
  \ Project` 选项重新构建项目以生成该类。\n\n只需修改 `SecondFragment.java` 类文件，在执行导航后接收参数并将其显示在 `TextView`\
  \ 小部件上。对于此示例，实现这些任务的代码将使用 `onStart()` 生命周期方法进行添加。编辑 `SecondFragment.java` 文件并添加此方法，使其读取如下：\n\
  \n```java\n@Override\npublic void onStart() {\n    super.onStart();\n    SecondFragmentArgs\
  \ args = SecondFragmentArgs.fromBundle(getArguments());\n    String message = args.getMessage();\n\
  \    binding.text.setText(message);\n}\n```\n\n上述方法中的代码首先获取 args 的引用。接下来，调用 `SecondFragmentArgs`\
  \ 的 `fromBundle()` 方法提取消息。然后将此字符串显示在 TextView 上。编译并运行应用，并在点击按钮之前输入文本。当第二个片段出现时，`TextView`\
  \ 现在应该显示输入的文本。\n\n## 总结\n\n本章提供了一个如何使用 Navigation Component 结合 Android Studio 图表编辑器实现\
  \ Android 导航的实用示例。涵盖主题包括创建包含现有和新目标片段的导航图、在 Activity 中嵌入导航宿主片段、编写触发导航事件的代码以及使用 Gradle\
  \ 插件在目标之间传递参数。\n\n## MotionLayout 导论\n\n`MotionLayout` 类为布局中的视图添加动画效果提供了一种简单的方法。本章将首先提供\
  \ `MotionLayout` 的概览，并介绍 `MotionScenes`（运动场景）、`Transitions`（过渡）和 `Keyframes`（关键帧）的概念。在涵盖这些基础之后，接下来的两个章节（标题为\
  \ Android MotionLayout 教程 和 MotionLayout 关键帧教程）将提供 `MotionLayout` 动画的更多细节和示例。\n\n\
  ### MotionLayout 概览\n\n`MotionLayout` 是一种布局容器，其主要目的是对布局内视图从一个状态到另一个状态的转换进行动画处理。`MotionLayout`\
  \ 可以例如对一个 `ImageView` 实例在指定时间内从屏幕左上角到右下角的运动进行动画。除了视图的位置，其他属性的变化也可以进行动画处理，例如颜色、大小或旋转角度。这些状态变化也可以进行插值。\n\
  \n使用 `MotionLayout` 的视图运动可以在两点之间的直线执行，也可以通过位于起点和终点之间不同位置点的路径来实现。`MotionLayout` 还支持使用触摸和滑动来启动和控制动画。\n\
  \n`MotionLayout` 动画完全在 XML 中声明，通常不需要编写任何代码。这些 XML 声明可以在 Android Studio 代码编辑器中手动实现、使用\
  \ MotionLayout 编辑器进行视觉化实现，或者结合这两种方法。\n\n\n\n\n在实现动画时，用户界面中常用的 `ConstraintLayout`\
  \ 容器必须首先转换为 `MotionLayout` 实例（此任务可以通过在布局编辑器中右键点击 `ConstraintLayout` 并选择 `Convert\
  \ to MotionLayout` 菜单选项来实现）。`MotionLayout` 还需要至少 2.0.0 版本的 `ConstraintLayout` 库。\n\
  \n意乎意料的是，作为 `ConstraintLayout` 的子类，`MotionLayout` 支持 `ConstraintLayout` 的所有布局功能。因此，对于任何不需要动画的视图，在使用\
  \ `MotionLayout` 时可以使用完全相同的方式设计用户界面布局。\n\n对于需要动画的视图，需要声明两个 `ConstraintSets` 来定义视图在动画开始和结束时的外观和位置。`transition`\
  \ 定义了关键帧，用于在这些开始和结束状态之间对目标视图应用额外效果，以及用于启动和控制动画的点击和滑动处理程序。\n\n开始和结束的 `ConstraintSets`\
  \ 以及过渡（transitions）都声明在一个 `MotionScene` XML 文件中。\n\n## 42.3 MotionScene\n\n正如我们在前面的章节中看到的，XML\
  \ 布局文件包含了配置呈现给用户的静态视图的外观和布局行为所需的信息，在 ways `MotionLayout` 时也是如此。对于非静态视图（即要进行动画的视图），这些视图仍然声明在布局文件中，但与这些视图相关的开始、结束和过渡声明存储在一个单独的\
  \ XML 文件中，称为 `MotionScene`（之所以如此是因为所有声明都定义在一个 `MotionScene` 元素内）。该文件被导入到布局 XML 文件中，包含开始和结束的\
  \ `ConstraintSets` 以及 `Transition` 声明（文件可以包含多个 `ConstraintSet` 对和 `Transition` 声明，允许针对用户界面布局中的特定视图实现不同的动画）。\n\
  \n下面的列表显示了 `MotionScene` 文件的模板：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<MotionScene\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:motion=\"http://schemas.android.com/apk/res-auto\">\n    <Transition\n\
  \        motion:constraintSetEnd=\"@+id/end\"\n        motion:constraintSetStart=\"\
  @id/start\"\n        motion:duration=\"1000\">\n        <KeyFrameSet>\n        </KeyFrameSet>\n\
  \    </Transition>\n    <ConstraintSet android:id=\"@+id/start\">\n    </ConstraintSet>\n\
  \    <ConstraintSet android:id=\"@+id/end\">\n    </ConstraintSet>\n</MotionScene>\n\
  ```\n\n在上面的 XML 中，声明了名为 `start` 和 `end` 的 `ConstraintSets`（尽管可以使用任何名称），它们此时尚未包含任何约束元素（constraint\
  \ elements）。`Transition` 元素定义了这些 `ConstraintSets` 代表动画的开始和结束点，并包含一个空的 `KeyFrameSet`\
  \ 元素，准备填充额外的动画关键帧条目。`Transition` 元素还包含一个毫秒持续时间属性，用于控制动画的运行时间。\n\n`ConstraintSets`\
  \ 并不意味着视图的移动。例如，可以使开始和结束集声明屏幕上的相同位置，然后使用过渡来动画其他属性的变化，如缩放和旋转角度。\n\n## 42.4 配置 ConstraintSets\n\
  \n`MotionScene` 文件中的 `ConstraintSets` 允许在定位、尺寸以及与父视图和其他视图的关系方面，将全套 `ConstraintLayout`\
  \ 设置应用于视图。此外，在 `ConstraintSet` 声明中还可能包含以下属性：\n\n* `alpha`\n* `visibility`\n* `elevation`\n\
  * `rotation`\n* `rotationX`\n* `rotationY`\n* `translationX`\n* `translationY`\n\
  * `translationZ`\n* `scaleX`\n* `scaleY`\n\n例如，为了在动画期间将视图旋转 180°，可以在开始和结束约束中声明以下内容：\n\
  \n```xml\n<ConstraintSet android:id=\"@+id/start\">\n    <Constraint\n        .\n\
  \        .\n        motion:layout_constraintStart_toStartOf=\"parent\"\n       \
  \ android:rotation=\"0\">\n    </Constraint>\n</ConstraintSet>\n\n<ConstraintSet\
  \ android:id=\"@+id/end\">\n    <Constraint\n        .\n        .\n        motion:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        android:rotation=\"180\">\n    </Constraint>\n</ConstraintSet>\n\
  ```\n\n上述更改告诉 `MotionLayout` 视图将从 0° 开始，然后在动画过程中旋转完整的 180°，最后在倒置状态停止。\n\n## 42.5\
  \ 自定义属性\n\n除了上面列出的标准属性外，还可以指定范围内的自定义属性（使用 `CustomAttribute` ）。事实上，视图类型上提供的几乎任何属性都可以指定为自定义属性以包含在动画中。要识别属性的名称，请从目标视图找到\
  \ `getter/setter` 名称，删除前缀并将首字母转为小写。例如，为了在代码中更改 `Button` 的背景颜色，我们可能会调用 `setBackgroundColor()`。在约束集中设置此属性时，其名称将为\
  \ `backgroundColor`。除了名称外，必须使用适当类型声明值：\n\n* `motion:Boolean`\n* `motion:Color`\n\
  * `motion:Dimension`\n* `motion:Float`\n* `motion:Integer`\n* `motion:String`\n\n\
  例如，下面来自 `MotionScene` 文件的片段声明了一个视图的开始和结束约束，同时将背景颜色从绿色改为红色：\n\n```xml\n<ConstraintSet\
  \ android:id=\"@+id/start\">\n    <Constraint\n        android:layout_width=\"wrap_content\"\
  \n        android:layout_height=\"wrap_content\"\n        motion:layout_absoluteX=\"\
  21dp\"\n        android:id=\"@+id/button\"\n        motion:layout_constraintTop_toTopOf=\"\
  parent\"\n        motion:layout_constraintStart_toStartOf=\"parent\">\n        <CustomAttribute\n\
  \            motion:attributeName=\"backgroundColor\"\n            motion:customValue=\"\
  #33CC33\" />\n    </Constraint>\n</ConstraintSet>\n\n<ConstraintSet android:id=\"\
  @+id/end\">\n    <Constraint\n        android:layout_width=\"wrap_content\"\n  \
  \      android:layout_height=\"wrap_content\"\n        motion:layout_absoluteY=\"\
  21dp\"\n        android:id=\"@+id/button\"\n        motion:layout_constraintEnd_toEndOf=\"\
  parent\"\n        motion:layout_constraintBottom_toBottomOf=\"parent\">\n      \
  \  <CustomAttribute\n            motion:attributeName=\"backgroundColor\"\n    \
  \        motion:customValue=\"#F80A1F\" />\n    </Constraint>\n</ConstraintSet>\n\
  ```\n\n## 42.6 触发动画\n\n如果没有某种形式的事件告诉 `MotionLayout` 启动动画，`MotionScene` 文件中的任何设置都不会对布局产生任何影响（视图根据开始\
  \ `ConstraintSet` 中的设置进行定位除外）。\n\n\n\n\n\n动画可以配置为响应屏幕点击（`OnClick`）或滑动（`OnSwipe`）手势来启动。`OnClick`\
  \ 处理器会导致动画开始并运行直到完成，而 `OnSwipe` 则将同步动画，使其沿着时间轴来回移动，以匹配触摸动作。`OnSwipe` 处理器还会响应屏幕上的“飞掷（flinging）”动作。`OnSwipe`\
  \ 处理器还提供了选项，用于配置动画对不同方向拖拽的反应，以及滑动锚定的目标视图的侧边。这允许例如通过向左的拖拽动作使视图向相应方向移动，同时防止向上运动导致视图向侧移动（除非这确实是所需的行为）。\n\
  \n`OnSwipe` 和 `OnClick` 声明包含在 `MotionScene` 文件的 `Transition` 元素中。在这两种情况下，必须指定视图\
  \ ID。例如，为了实现一个响应锚定在名为 `button` 的视图底部的向下拖拽动作的 `OnSwipe` 处理器，应将以下 XML 放在 `Transition`\
  \ 元素中：\n\n```xml\n<Transition\n    motion:constraintSetEnd=\"@+id/end\"\n    motion:constraintSetStart=\"\
  @id/start\"\n    motion:duration=\"1000\">\n    <KeyFrameSet>\n    </KeyFrameSet>\n\
  \    <OnSwipe\n        motion:touchAnchorId=\"@+id/button\"\n        motion:dragDirection=\"\
  dragDown\"\n        motion:touchAnchorSide=\"bottom\" />\n</Transition>\n```\n\n\
  或者，在同一个按钮上添加一个 `OnClick` 处理器：\n\n```xml\n<OnClick motion:targetId=\"@id/button\"\
  \n    motion:clickAction=\"toggle\" />\n```\n\n在上面的示例中，动作被设置为 `toggle` 模式。这种模式和其他可用选项可以总结如下：\n\
  \n* `toggle`: 动画到相反状态。例如，如果视图当前处于过渡起始点，它将过渡到结束点，反之亦然。\n* `jumpToStart`: 立即切换到起始状态，没有动画。\n\
  * `jumpToEnd`: 立即切换到结束状态，没有动画。\n* `transitionToStart`: 通过动画过渡到起始状态。\n* `transitionToEnd`:\
  \ 通过动画过渡到结束状态。\n\n### 42.7 弧形运动\n\n默认情况下，视图位置的移动将在起始点和结束点之间直线运行。要将运动更改为弧形路径，只需在起始约束中使用所示的\
  \ `pathMotionArc` 属性，并配置 `startHorizontal` 或 `startVertical` 设置来定义弧形是凹还是凸的：\n\n\
  ```xml\n<ConstraintSet android:id=\"@+id/start\">\n    <Constraint\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        motion:layout_editor_absoluteX=\"\
  21dp\"\n        android:id=\"@+id/button\"\n        motion:layout_constraintTop_toTopOf=\"\
  parent\"\n        motion:layout_constraintStart_toStartOf=\"parent\"\n        motion:pathMotionArc=\"\
  startVertical\" >\n```\n\n图 42-1 展示了 `startVertical` 和 `startHorizontal` 弧形与默认直线运动的对比：\n\
  \n![](img/motionlayout_arcMotion_three.jpg)\n\n图 42-1\n\n### 42.8 关键帧\n\n到为止概述的所有\
  \ `ConstraintSet` 属性仅适用于动画的起始点和结束点。换句话说，如果旋转属性在结束点被设置为 180°，则旋转将在动画开始时开始并在到达结束点时完成。因此，无法配置旋转在动画进行到\
  \ 50% 处达到完全 180°，然后在动画结束时旋转回原始方向。幸运的是，这种效果可以使用关键帧（Keyframes）来实现。\n\n关键帧用于定义动画过程中的中间点，在这些点上会发生状态变化。例如，可以声明关键帧，使得视图的背景颜色在动画进行到\
  \ 50% 处过渡为蓝色，在 75% 处变为绿色，并在动画结束时恢复原始颜色。关键帧实现在 `MotionScene` 文件的 `Transition` 元素中，嵌入在\
  \ `KeyFrameSet` 元素内。\n\n`MotionLayout` 支持以下几种类型的关键帧：\n\n#### 42.8.1 属性关键帧\n\n属性关键帧（使用\
  \ `KeyAttribute` 声明）允许在动画时间轴的中间点更改视图属性。`KeyAttribute` 支持上方 `ConstraintSets` 中列出的相同属性集，并结合了指定更改在动画时间轴中何处生效的能力。例如，以下关键帧声明将导致按钮视图在水平（`scaleX`）和垂直（`scaleY`）方向上逐渐增大倍：\n\
  \n```xml\n<Transition\n    motion:constraintSetEnd=\"@+id/end\"\n    motion:constraintSetStart=\"\
  @id/start\"\n    motion:duration=\"1000\">\n    <KeyFrameSet>\n        <KeyAttribute\n\
  \            motion:targetId=\"@+id/button\"\n            motion:framePosition=\"\
  50\"\n            android:scaleX=\"2.0\" />\n        <KeyAttribute\n           \
  \ motion:targetId=\"@+id/button\"\n            motion:framePosition=\"50\"\n   \
  \         android:scaleY=\"2.0\" />\n    </KeyFrameSet>\n</Transition>\n```\n\n\
  #### 42.8.2 位置关键帧\n\n位置关键帧（`KeyPosition`）用于修改视图在起始位置和结束位置之间移动时遵循的路径。通过在时间轴上的不同点放置位置，可以对动画应用任何复杂程度的路径。位置使用\
  \ `x` 和 `y` 坐标声明，并相对于以下系统之一：\n\n* `parentRelative`: `x` 和 `y` 坐标相对于父容器，坐标以百分比表示：\n\
  ![](img/motionlayout_parentRelative.jpg)\n图 42-2\n\n* `deltaRelative`: 不再相对于父容器，`x`\
  \ 和 `y` 坐标相对于起始和结束位置。例如，起始点为 (0,0)，结束点为 (1,1)。\n![](img/motionlayout_deltaRelative.jpg)\n\
  图 42-3\n\n* `pathRelative`: `x` 和 `y` 坐标相对于路径，起始点和结束点之间的直线作为图表的 X 轴。再次，坐标以百分比表示（0.0\
  \ 到 1.0）。这与 `deltaRelative` 坐标空间相似，但考虑了路径的角度。再次，坐标可以是负数：\n![](img/motionlayout_pathRelative.jpg)\n\
  图 42-4\n\n\n\n\n上述元素使用 `pathRelative` 坐标系在路径的 25% 和 75% 处创建了关键帧位置点。第一个位置放置在坐标 (0.25,\
  \ 0.3)，第二个位置在 (0.75, -0.3)。这些位置关键帧可以视觉化，如下方的 图 42-7 所示：\n\n![](img/motionlayout_curve_path.jpg)\n\
  \n图 42-7\n\n## 42.9 时间线线性度\n\n在没有任何额外设置的情况下，上述的动画将以恒定速度执行。要更改动画的速度（例如，使其加速后减速），可以在\
  \ `ConstraintSet` 或 `Keyframe` 中使用过渡缓动属性 `transitionEasing`。\n\n对于复杂的缓动需求，可以通过在三次贝塞尔曲线（cubic\
  \ Bézier curve）上绘制点来定义线性度，例如：\n\n```xml\nmotion:layout_constraintBottom_toBottomOf=\"\
  parent\"\nmotion:transitionEasing=\"cubic(0.2, 0.7, 0.3, 1)\"\nandroid:rotation=\"\
  360\"\n```\n\n如果你不熟悉贝塞尔曲线，可以考虑使用以下 URL 中的在线曲线生成器：[`cubic-bezier.com/`](https://cubic-bezier.com/)\n\
  \n然而，对于大多数需求，可以使用内置的标准、加速（accelerate）和减速（decelerate）值来指定缓动：\n\n```xml\nmotion:layout_constraintBottom_toBottomOf=\"\
  parent\"\nmotion:transitionEasing=\"decelerate\"\nandroid:rotation=\"360\"\n```\n\
  \n## 42.10 KeyTrigger\n\n触发关键帧 `KeyTrigger` 允许在动画到达时间线内指定帧位置时调用视图上的方法。这还考虑了动画的方向。例如，根据动画是正向运行还是反向运行可以调用不同的方法。考虑一个按钮，当动画移动超过时间线的\
  \ 20% 时显示为可见。`KeyTrigger` 将在 `Transition` 元素的 `KeyFrameSet` 中如下所示实现，并使用 `onPositiveCross`\
  \ 属性：\n\n```xml\n<KeyFrameSet>\n    <KeyTrigger\n        motion:framePosition=\"\
  20\"\n        motion:onPositiveCross=\"show\"\n        motion:motionTarget=\"@id/button\"\
  />\n</KeyFrameSet>\n```\n\n同样，如果同一个按钮在动画反向运行并降至 10% 以下时隐藏，可以使用 `onNegativeCross`\
  \ 属性添加第二个触发器：\n\n```xml\n<KeyTrigger\n    motion:framePosition=\"20\"\n    motion:onNegativeCross=\"\
  show\"\n    motion:motionTarget=\"@id/button2\"/>\n```\n\n如果动画使用切换动作（toggle action），仅需使用\
  \ `onCross` 属性即可：\n\n```xml\n<KeyTrigger\n    motion:framePosition=\"20\"\n    motion:onCross=\"\
  show\"\n    motion:motionTarget=\"@id/button2\"/>\n```\n\n## 42.11 Cycle 和 Time\
  \ Cycle 关键帧\n\n虽然位置关键帧可以用于向动画添加中间状态变化，但如果需要实现大量的重复位置和变化，这将很快变得繁琐。对于需要重复执行具有可预测变化的状态变化，`MotionLayout`\
  \ 包含了 `Cycle` 和 `Time Cycle` 关键帧，该主题将在“MotionLayout KeyCycle 教程”章节中详细介绍。\n\n## 42.12\
  \ 从代码启动动画\n\n在本章到目前为止，我们只查看了如何使用 `OnSwipe` 和 `OnClick` 处理程序来控制动画。也可以通过调用 `MotionLayout`\
  \ 实例上的方法从代码内部启动动画。例如，以下代码为名为 `motionLayout` 的布局运行耗时为 2000ms 的从开始到结束的过渡：\n\n```java\n\
  motionLayout.setTransitionDuration(2000);\nmotionLayout.transitionToEnd();\n```\n\
  \n在没有额外设置的情况下，用于动画的起始状态和结束状态将是 `MotionScene` 文件中 `Transition` 声明中声明的那些。要使用特定的起始和结束约束集，只需在调用\
  \ `MotionLayout` 实例的 `setTransition()` 方法时通过 id 引用它们即可：\n\n```java\nmotionLayout.setTransitionDuration(2000);\n\
  motionLayout.transitionToEnd();\n```\n\n要在动画运行时监控其状态，请如下所示为 `MotionLayout` 实例添加一个过渡监听器：\n\
  \n```java\nmotionLayout.setTransitionListener(transitionListener);\n\nMotionLayout.TransitionListener\
  \ transitionListener =\n    new MotionLayout.TransitionListener() {\n        @Override\n\
  \        public void onTransitionStarted(MotionLayout motionLayout, int startId,\
  \ int endId) {\n            // 当过渡开始时调用\n        }\n        @Override\n        public\
  \ void onTransitionChange(MotionLayout motionLayout, int startId, int endId) {\n\
  \            // 每次属性更改时调用。跟踪进度\n        }\n        @Override\n        public void\
  \ onTransitionCompleted(MotionLayout motionLayout, int currentId) {\n          \
  \  // 当过渡完成时调用\n        }\n        @Override\n        public void onTransitionTrigger(MotionLayout\
  \ motionLayout, int triggerId, boolean positive, float progress) {\n           \
  \ // 当跨越触发关键帧时调用\n        }\n    };\n```\n\n## 42.13 总结\n\n`MotionLayout` 是 `ConstraintLayout`\
  \ 的子类，专门设计用于用户界面布局添加动画效果。`MotionLayout` 通过在由起始和结束约束集定义的状态之间进行动画来工作。可以使用关键帧在起始和结束点之间添加额外的动画效果。可以通过\
  \ `OnClick` 或 `OnSwipe` 处理程序触发动画，也可以通过对 `MotionLayout` 实例的方法调用进行触发。\n\n## 43 Android\
  \ 编辑器教程\n\n现在涵盖了 `MotionLayout` 的基础，本章将提供在示例项目中尝试 `MotionLayout` 的机会。除了继续探索 `MotionLayout`\
  \ 的主要功能外，本章还将引入 MotionLayout 编辑器并探索如何使用它来可视化构建和修改动画。在本章创建的项目将使用起始和结束 `ConstraintSets`、手势处理程序以及属性关键帧。\n\
  \n### 43.1 创建 MotionLayout 项目\n\n在欢迎屏幕上点击 `New Project` 按钮，在新项目对话框中选择 `Empty Activity`\
  \ 模板，然后点击 `Next` 按钮。\n\n在 `Name` 字段输入 `MotionLayoutDemo` 并指定 `com.ebookrenzy.motionlayoutdemo`\
  \ 为包名。点击 `Finish` 按钮之前，将 `Minimum API` 设置为 `API 26: Android 8.0 (Oreo)`并将 `Language`\
  \ 菜单设置为 `Java`。\n\n### 43.2 ConstraintLayout 转换为 MotionLayout\n\n按照习惯，Android Studio\
  \ 在 `activity_main.xml` 布局文件中将 `ConstraintLayout` 容器作为父视图。下一步是将此容器转换为 `MotionLayout`\
  \ 实例。在组件树（Component Tree）中，右键点击 `ConstraintLayout` 项并选择 `Convert to MotionLayout`\
  \ 选项：\n\n![](img/as_4.0_motionlayout_conversion.jpg)\n\n图 43-1\n\n做出选择后，点击确认对话框中的\
  \ `Convert` 按钮。转换完成后，MotionLayout 编辑器将出现在 Android Studio 主窗口中，如 图 43-2 所示：\n\n![](img/as_4.0_motionlayout_editor.jpg)\n\
  \n图 43-2\n\n作为转换过程的一部分，Android Studio 还会创建一个名为 `res -> xml` 的新文件夹，并在其中放置名为 `activity_main_scene.xml`\
  \ 的 `MotionLayout` 场景文件：\n\n![](img/as_4.0_motionlayout_scene_file.jpg)\n\n图 43-3\n\
  \n\n\n\n此文件包含一个顶层 `MotionScene` 元素，其中包含 `ConstraintSet` 和 `Transition` 条目，这些项将定义在主布局中执行的动画。默认情况下，该文件将包含起始和结束约束集的空元素以及一个初始过渡：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\n<MotionScene\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:motion=\"http://schemas.android.com/apk/res-auto\"\
  >\n    <Transition\n        motion:constraintSetEnd=\"@+id/end\"\n        motion:constraintSetStart=\"\
  @id/start\"\n        motion:duration=\"1000\">\n        <KeyFrameSet>\n        </KeyFrameSet>\n\
  \    </Transition>\n    <ConstraintSet android:id=\"@+id/start\">\n    </ConstraintSet>\n\
  \    <ConstraintSet android:id=\"@+id/end\">\n    </ConstraintSet>\n</MotionScene>\n\
  ```\n\n在 `MotionLayout` 编辑器中进行的任何更改都将存储在此文件中。同样，也可以直接编辑此文件，以便在 `MotionLayout` 编辑器之外实现和修改动画设置。在本教程中，将主要使用\
  \ `MotionLayout` 编辑器界面来实现动画。然而，在每个阶段，我们将花时间回顾这些更改是如何反映在底层 `MotionScene` 文件中的。随着章节的进行，你会发现\
  \ `MotionScene` 的 XML 语法实际上非常简单且易学习。\n\n本教程的第一阶段将演示如何使用 `MotionLayout` 对 `Button`\
  \ 对象进行动画处理，包括运动（包括跟随路径）、旋转和缩放。\n\n### 43.3 配置起始和结束约束\n\n当 `activity_main.xml` 文件加载到\
  \ `MotionLayout` 编辑器后，确保选中了 Motion Layout 框（在下方的 图 43-5 中被标记为 E），然后在从调色板将 `Button`\
  \ 视图拖动并放置到布局画布的左上角之前，删除默认的 `TextView`，如 图 43-4 所示：\n\n![](img/as_4.1_motion_layout_button_added.jpg)\n\
  \n图 43-4\n\n选中按钮后，使用 Attributes 工具窗口将 id 更改为 `myButton`。\n\n如上一节所述，`MotionLayout`\
  \ 动画主要是上指定视图如何在两个状态之间转换用例。因此，实现动画的第一步是定义这些状态的约束。对于此示例，起始点将是布局视图的顶部中心。要配置这些约束，请在编辑器窗口中选择起始约束集条目（在\
  \ 图 43-5 中被标记为 A）：\n\n![](img/as_4.0_motionlayout_editor_start_labeled.jpg)\n\n\
  图 43-5\n\n当选中起始框时，所有的约束和布局更改都将应用于起始点约束集。要返回整个布局的标准约束和属性，请点击 Motion Layout 框 (E)。\n\
  \n接下来，在 `ConstraintSet` 列表中选择 `myButton` 条目 (B)。注意，Source 列显示按钮是根据布局文件中的约束进行定位的。相反，我们希望按钮根据起始约束集进行定位。在\
  \ `myButton` 条目仍被选中的情况下，点击 Edit 按钮 (C) 并从菜单中选择 `Create Constraint`，之后按钮条目将指示视图将根据起始约束集进行定位：\n\
  \n![](img/as_4.0_motionlayout_editor_start_set.jpg)\n\n图 43-6\n\n起始约束集需要将按钮置在布局的顶部，带有\
  \ 8dp 的偏移并水平居中。在 `myButton` 仍被选中的情况下，使用 Attributes 工具窗口为视图的顶部、左侧和右侧设置约束，如下：\n\n\
  ![](img/as_4.0_motionlayout_start_constraints.jpg)\n\n图 43-7\n\n选择结束约束集条目（在下方的 图\
  \ 43-5 中被标记为 D），并重复步骤创建一个新约束，这次将按钮放置在布局的水平中心，但距离布局底部有 8p 的偏移：\n\n![](img/as_4.0_motionlayout_end_constraints.jpg)\n\
  \n图 43-8\n\n配置好起始和结束约束后，打开 `activity_main_scene.xml` 文件并注意约束已添加到文件中：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<MotionScene\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:motion=\"http://schemas.android.com/apk/res-auto\">\n    \n    <ConstraintSet\
  \ android:id=\"@+id/start\">\n        <Constraint\n            android:id=\"@+id/myButton\"\
  \n            android:layout_width=\"wrap_content\"\n            android:layout_height=\"\
  wrap_content\"\n            motion:layout_constraintTopTopOf=\"parent\"\n      \
  \      motion:layout_constraintStart_toStartOf=\"parent\"\n            motion:layout_constraintEnd_toRightOf=\"\
  parent\"\n            motion:layout_marginTop=\"8dp\"\n            motion:layout_toBottomOf=\"\
  parent\" />\n    </ConstraintSet>\n\n    <ConstraintSet android:id=\"@+id/end\"\
  >\n        <Constraint\n            android:id=\"@+id/myButton\"\n            android:layout_width=\"\
  wrap_content\"\n            android:layout_height=\"wrap_content\"\n           \
  \ motion:layout_constraintTopTopOf=\"parent\"\n            motion:layout_constraintStart_toStartOf=\"\
  parent\"\n            motion:layout_constraintEnd_toRightOf=\"parent\"\n       \
  \     motion:layout_marginTop=\"6dp\"\n            motion:layout_marginBottom=\"\
  8dp\" />\n    </ConstraintSet>\n</MotionScene>\n```\n（注：上面的 XML 结构是根据源文本重建的）\n\n\
  同样注意 `Transition` 元素已预配置为在 1000 毫秒内动画起始和结束点。尽管我们尚未为过渡添加操作，但仍然可以在 `MotionLayout`\
  \ 编辑器中预览动画。\n\n### 43.4 预览 MotionLayout 动画\n\n要在不构建和运行应用程序的情况下预览动画，请选择 MotionLayout\
  \ 编辑器中下方 图 43-9 标记为 A 的过渡箭头。这将显示动画面板（标记为 B）：\n\n![](img/as_4.0_motionlayout_labeled_timeline.jpg)\n\
  \n图 43-9\n\n要测试动画，点击并拖动滑动块 (C)。随着滑动块移动，布局画布中的按钮将沿虚线 (D) 移动。使用工具栏按钮 (E) 执行完整动画，以不同的速度重复动画（正向、反向或来回）。\n\
  \n### 43.5 添加 OnClick 手势\n\n尽管已经创建了简单的 `MotionLayout` 动画过渡，但我们仍然需要一种在运行的应用内部启动动画的方法。这可以通过分配点击或滑动处理程序来实现。对于此示例，我们将配置在点击按钮时启动动画。在\
  \ `MotionLayout` 编辑器中，如果时间轴动画正在循环设置运行，请先暂停。接下来，选择过渡箭头（在上方 图 43-9 中标记为 A），在 Attributes\
  \ 工具窗口中找到 `OnClick` 属性部分，并点击 图 43-10 中箭头所示的 `+` 按钮：\n\n![](img/as_4.0_motionlayout_onclick_add.jpg)\n\
  \n图 43-10\n\n`OnClick` 面板将为第一个属性出现空行。对于属性名称，输入 `targetId`，对于值字段输入按钮的 id (`@id/myButton`)。再次点击\
  \ `+` 按钮，这次在属性名称字段中输入 `app:clickAction`。在值字段中，点击向下箭头显示有效选项菜单：\n\n\n\n\n\n在此示例中，选择切换操作（toggle\
  \ action）。这将导致视图在被点击时动画到相反的位置。一旦输入了这些设置，它们应该与 图 43-12 所示的内容匹配：\n\n![](img/as_4.0_motionlayout_onclick_added.jpg)\n\
  图 43-12\n\n再次打开 `activity_main_scene.xml` 文件并检查 `Transition` 节点中定义的 `OnClick` 属性：\n\
  \n```xml\n<Transition\n    motion:constraintSetEnd=\"@+id/end\"\n    motion:constraintSetStart=\"\
  @id/start\"\n    motion:duration=\"1000\">\n    <KeyFrameSet>\n    </KeyFrameSet>\n\
  \    <OnClick motion:targetId=\"@id/myButton\"\n        motion:clickAction=\"toggle\"\
  \ />\n</Transition>\n```\n\n在设备或模拟器上编译并运行应用，确认点击按钮会导致它在 `MotionScene` 文件中定义的起始点和结束点之间来回切换。\n\
  \n### 43.6 为 Transition 添加属性关键帧\n\n到目前，示例项目仅演示了按钮视图从屏幕上一个位置到另一个位置的动画。属性关键帧（`KeyAttribute`）提供了一种方法，用于在过渡时间轴内指定其他属性更改生效的点。例如，可以定义一个\
  \ `KeyAttribute`，使得当视图移动到时间轴 30% 处时，其尺寸必须增加了 50%。对于此示例，我们将在动画的中间点添加一个旋转效果。\n\n首先，在\
  \ MotionLayout 编辑器中打开 `activity_main.xml` 文件，选择过渡连接器箭头以显示时间轴，然后点击 图 43-13 中突出显示的按钮：\n\
  \n![](img/as_4.0_motionlayout_timeline_add_key_button.jpg)\n图 43-13\n\n从菜单中，选择 `KeyAttribute`\
  \ 选项：\n\n![](img/as_4.0_motionlayout_timeline_add_key_attribute_menu.jpg)\n图 43-14\n\
  \n选中后，将出现 图 43-15 所示的对话框。在对话框中，确保选中了 `ID` 选项并引用了 `myButton`。在位置字段中，输入 50（这以百分比指定，0\
  \ 是起始点，100 是结束点）。最后在点击 `Add` 按钮之前，从属性（Attribute）下拉菜单中选择旋转（rotation）项：\n\n![](img/as_4.0_motionlayout_timeline_key_attr_dialog.jpg)\n\
  图 43-15\n\n添加 `KeyAttribute` 后，时间轴内会出现一个该属性的行。点击该行将其高亮显示，然后点击该行最左侧的展开箭头以展开属性过渡图。注意，时间轴上出现了一个微小的菱形标记（如下方的\
  \ 图 43-16 所示所示），表示关键帧的位置。图表表示效果的线性度。在这种情况下，按钮将平稳地旋转到指定的度数，并在关键帧位置处达到最大旋转。当它到达结束点时，按钮将旋转回\
  \ 0 度：\n\n![](img/as_4.0_motionlayout_timeline_graph.jpg)\n图 43-16\n\n要更改 `KeyAttribute`\
  \ 的属性，在时间轴上选中它，然后参考 `Attributes` 工具窗口。在 `KeyAttribute` 面板中，将 `rotation` 属性更改为 360\
  \ 度：\n\n![](img/as_4.0_motionlayout_timeline_key_attr_rotation_angle.jpg)\n图 43-17\n\
  \n通过来移动滑动块并观察按钮在遍历布局画布中的动画路径时的旋转情况，来检查该属性是否生效。参考 `activity_main_scene.xml` 文件，它现在应该如下所示：\n\
  \n```xml\n<Transition\n    motion:constraintSetEnd=\"@+id/end\"\n    motion:constraintSetStart=\"\
  @id/start\"\n    motion:duration=\"1000\">\n    <KeyFrameSet>\n        <KeyAttribute\n\
  \            motion:motionTarget=\"@+id/myButton\"\n            motion:framePosition=\"\
  50\"\n            android:rotation=\"360\" />\n    </KeyFrameSet>\n    <OnClick\
  \ motion:targetId=\"@+id/myButton\"\n        motion:clickAction=\"toggle\" />\n\
  </Transition>\n```\n\n使用过渡滑动块或通过编译并运行应用来测试动画，验证按钮现在会旋转。\n\n### 43.7 为 Transition\
  \ 添加自定义属性（CustomAttribute）\n\n`KeyAttribute` 属性仅限于内置效果，如调整大小和旋转。通过声明 `CustomAttributes`\
  \ 也可以实现额外的更改。与存储在 `Transition` 元素中的 `KeyAttributes` 不同，`CustomAttributes` 位于起始和结束集（sets）中。因此，这些属性只能声明在起始点和结束点生效（也就是说，你无法在时间轴的中途部分指定属性关键帧）。\n\
  \n对于此示例，我们将配置按钮使其颜色从红色逐渐变为绿色。首先选择 图 43-18 中标记为 A 的起始框，然后是 `myButton` 约束集（B）：\n\n\
  ![](img/as_4.0_motionlayout_start.jpg)\n图 43-18\n\n参考 `Attributes` 工具窗口，点击 `CustomAttributes`\
  \ 部分的 `+` 按钮：\n\n![](img/as_4.0_motionlayout_timeline_custom_attr_add.jpg)\n图 43-19\n\
  \n在显示的对话框中（图 43-20 所示），将属性类型更改为 `Color` 并在 Attribute 字段中输入 `backgroundColor`。最后将值设置为\
  \ `#F0A1F`：\n\n![](img/as_4.0_motionlayout_custom_attr_color.jpg)\n图 43-20\n\n点击\
  \ `OK` 提交更改，然后选择结束约束集（如图 43-18 所示），重复上述步骤添加自定义属性，这次指定颜色值为 `#3CC33`。\n\n使用时间轴滑动块或运行应用，确保按钮在动画期间更改颜色。`CustomAttributes`\
  \ 的添加将反映在 `activity_main_scene.xml` 文件中如下：\n\n```xml\n<ConstraintSet id=\"@+id/start\"\
  >\n    <Constraint>\n        <CustomAttribute\n            motion:attributeName=\"\
  backgroundColor\"\n            motion:customColorValue=\"#F0A1F\" />\n    </Constraint>\n\
  </ConstraintSet>\n<ConstraintSet id=\"@+id/end\">\n    <Constraint>\n        <CustomAttribute\n\
  \            motion:attributeName=\"backgroundColor\"\n            motion:customColorValue=\"\
  #3CC33\" />\n    </Constraint>\n</ConstraintSet>\n```\n\n### 43.8 添加位置关键帧（Position\
  \ Keyframes）\n\n本教程的最后一个任务是向动画路径添加两个位置关键帧（`KeyPosition`），以引入一些水平移动。在 MotionLayout\
  \ 编辑器中显示过渡时间轴，点击按钮创建一个如上方 图 43-13 中突出显示的关键帧，并从下方 图 43-21 所示的菜单中选择 `KeyPosition`\
  \ 选项：\n\n![](img/as_4.0_motionlayout_add_keyposition.jpg)\n图 43-21\n\n在生成的对话框中，按照\
  \ 图 43-22 所示设置属性：\n\n![](img/as_4.0_motionlayout_keyposition_1.jpg)\n图 43-22\n\n\
  点击 `Add` 按钮提交更改，然后重复上述步骤添加第二个配置如下的的位置关键帧：\n\n- Position: 75\n- Type: parentRelative\n\
  - PercentX: 0.85\n- PercentY: 0.75\n\n完成这些更改后，`activity_main_scene.xml` 文件中的 `transition`\
  \ 元素将添加以下关键帧项：\n\n```xml\n<KeyFrameSet>\n    <KeyPosition\n        motion:motionTarget=\"\
  @+id/myButton\"\n        motion:framePosition=\"25\"\n        motion:keyPositionType=\"\
  parentRelative\" />\n</KeyFrameSet>\n```\n\n\n\n\n\n```xml\nmotion:percentX=\"0.15\"\
  \nmotion:percentY=\"0.25\" />\n<KeyPosition\n    motion:motionTarget=\"@+id/myButton\"\
  \n    motion:framePosition=\"75\"\n    motion:keyPositionType=\"parentRelative\"\
  \n    motion:percentX=\"0.85\"\n    motion:percentY=\"0.75\" />\n</KeyFrameSet>\n\
  ```\n\n最后一次测试应用，验证按钮现在是否遵循下方所示的路径，同时保持旋转并改变颜色：\n\n![](img/as_4.0_motionlayout_zig_zag.jpg)\n\
  图 43-23\n\n位置关键帧由预览画布中代表运动路径的虚线上的菱形标记表示，如图 43-24 所示所示（如果标记不可见，请确保在预览中选中了 `Button`\
  \ 视图）：\n\n![](img/as_4.1_motion_layout_position_markers.jpg)\n图 43-24\n\n要视觉化地调整关键帧的位置，只需点击标记并将其拖到新位置。随着标记移动，Motion\
  \ Layout 编辑器将显示网格以及当前的 `x` 和 `y` 坐标：\n\n![](img/as_4.1_motion_layout_position_marker_drag.jpg)\n\
  图 43-25\n\n### 43.9 总结\n\n本章介绍了 Android Studio 内置的 `MotionLayout` 编辑器，并探索了如何使用它在无需手动编写\
  \ XML 的情况下为 Android 应用的用户界面添加动画。本章涵盖的示例包括将 `ConstraintLayout` 容器转换为 `MotionLayout`、在\
  \ `MotionScene` 文件中创建开始和结束约束集以及过渡，以及添加 `OnClick` 处理器。还涵盖了动画预览器、自定义属性和位置关键帧的使用。\n\
  \n### 44. MotionLayout 关键帧循环教程\n\n之前的章节介绍并演示了如何结合 `MotionLayout` 容器和 Android Studio\
  \ `MotionLayout` 编辑器的功能，将动画集成到 Android 应用的用户界面中的概念。标题为“MotionLayout 简介”的章节简要提到了循环（`KeyCycle`）和时间循环（`KeyTimeCycle`）关键帧，并解释了如何使用它们来实现涉及大量重复状态更改的动画。\n\
  \n本章将更详细地介绍循环关键帧，然后演示如何在使用 Android Studio 和循环编辑器的示例项目中使用它们。\n\n#### 44.1 循环关键帧概述\n\
  \n显然，位置关键帧可以用于在动画时间轴中添加中间状态更改。虽然这对于较少数量的状态更改效果良好，但在数量较多时实现起来会非常繁琐。例如，要让按钮在点击时抖动\
  \ 50 次以表示发生错误，将涉及手动创建 100 个位置关键帧来执行微小的顺时针和反时针旋转。同样，在视图跨屏幕移动时实现弹跳效果也是一项同样耗时的任务。\n\
  \n对于需要重复执行状态更改的情况，MotionLayout 包含了 `Cycle` 和 `Time Cycle` 关键帧。两者都执行相同的任务，区别在于 `KeyCycle`\
  \ 帧基于动画路径中的帧位置，而 `KeyTimeCycles` 则是基于每秒循环次数（Hz）的时间为基准的。\n\n使用这些 `KeyCycle` 帧，动画时间轴本质上被划分为子部分（称为循环），每个部分包含一个或多个波形，定义了如何在整个时间轴上修改视图的属性。创建一个\
  \ `KeyCycle` 循环，需要以下信息：\n\n- `target view` - 要进行更改的视图的 id。\n- `frame position` -\
  \ 循环开始在时间轴上的位置。\n- `wave period` - 循环中包含的波形数量。\n- `attribute` - 被波形修改的视图属性。\n- `wave\
  \ offset` - 从关键帧基准按指定量偏移循环。\n- `wave shape` - 波形的形状（正弦、余弦、锯齿波、方波、三角形波、弹跳或反锯齿波）。\n\
  \n考虑以下循环关键帧集：\n\n```xml\n<KeyFrameSet>\n    <KeyCycle\n        motion:framePosition=\"\
  0\"\n        motion:motionTarget=\"@+id/button\"\n        motion:wavePeriod=\"1\"\
  \n        motion:waveOffset=\"0dp\"\n        motion:waveShape=\"sin\"\n        android:translationY=\"\
  50dp\"/>\n    <KeyCycle\n        motion:framePosition=\"25\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"1\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"\n        android:translationY=\"50dp\"/>\n  \
  \  <KeyCycle\n        motion:framePosition=\"50\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"1\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"\n        android:translationY=\"50dp\"/>\n  \
  \  <KeyCycle\n        motion:framePosition=\"75\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"1\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"\n        android:translationY=\"50dp\"/>\n  \
  \  <KeyCycle\n        motion:framePosition=\"100\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"1\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"\n        android:translationY=\"50dp\"/>\n</KeyFrameSet>\n\
  ```\n\n上述关键帧集将时间轴划分为四个相等的循环。每个循环配置为包含一个正弦波，调整按钮的 `translationY` 属性。执行时，此动画将导致按钮在指定范围内振荡。如图\
  \ 44-1 所示，其中五个点代表关键帧位置：\n\n![](img/as_4.0_keycycle_simple.jpg)\n图 44-1\n\n目前实现的情况下，每个循环包含一个波形。假设在这些均匀分布的波形，我们需要在最后一个循环中四个波形。可以通过增加最后一个\
  \ `KeyCycle` 元素的 `wavePeriod` 属性轻松实现：\n\n```xml\n<KeyCycle\n    motion:framePosition=\"\
  75\"\n    motion:motionTarget=\"@+id/button\"\n    motion:wavePeriod=\"4\"\n   \
  \ motion:waveOffset=\"0dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"\
  50dp\"/>\n```\n\n进行此更改后，帧集可以如下波形的形式渲染：\n\n![](img/as_4.0_keycycle_sin_waveperiod.jpg)\n\
  图 44-2\n\n到目前为止，本章的示例一直使用正弦波。事实上，在 MotionLayout 中使用循环关键帧时有许多不同的波形。例如，图 44-3 说明了将所有循环关键帧的\
  \ `waveShape` 属性更改为锯齿波的效果：\n\n![](img/as_4.0_keycycle_sawtooth.jpg)\n图 44-3\n\n\
  除了正弦和锯齿波，MotionLayout 还支持三角形波、方波、弹跳波和反锯齿波波形。\n\n在上述示例中，每个循环都沿 Y 轴在相同范围内移动按钮。然而，假设我们需要第二个循环沿正\
  \ Y 轴移动更大的距离。这涉及对第二个循环的 `waveOffset` 属性进行调整：\n\n```xml\n<KeyCycle\n    motion:framePosition=\"\
  25\"\n    motion:target=\"@+id/button\"\n    motion:wavePeriod=\"1\"\n    motion:waveOffset=\"\
  100dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"50dp\"/>\n```\n\
  \n通过此此更改，我们得到一个类似于图 44-4 的时间轴：\n\n![](img/as_4.0_keycycle_sin_waveoffset.jpg)\n\
  图 44-4\n\n在第二个循环期间，按钮的运动现在在 Y 轴上的范围大约在 0 到 150dp 之间。如果我们仍然需要范围的下端与其他波形匹配，我们当然可以为\
  \ `translationY` 值增加 100dp：\n\n\n\n\n\n```xml\nmotion:framePosition=\"25\"\nmotion:target=\"\
  @+id/button\"\nmotion:wavePeriod=\"1\"\nmotion:waveOffset=\"100dp\"\nmotion:waveShape=\"\
  sin\"\nandroid:translationY=\"150dp\"/>\n```\n\n此更改现在为我们提供了以下波形：\n\n![](img/as_4.0_keycycle_sin_waveoffset_flat.jpg)\n\
  \n图 44-5\n\n## 44.2 使用周期编辑器 (Cycle Editor)\n\n尽管并不复杂，但通过直接在 `MotionScene` 文件中编辑\
  \ XML `KeyCycle` 条目来获取你所需的精确周期配置可能花费一些时间。考虑到这一点，Google 的 Android 工程师开发了 `Cycle Editor`（周期编辑器）。这是一个独立的\
  \ Java 的实用工具，尚未成为 Android Studio 的一部分。`Cycle Editor` 允许你视觉化地设计和测试周期关键帧集。\n\n`Cycle\
  \ Editor` 工具以 Java 归档（`.jar`）文件的形式提供，这要求你的开发系统中安装 Java 运行时环境。安装 Java 的步骤取决于你的操作系统。\n\
  \n一旦安装了 Java，即可从以下 URL 下载 `CycleEditor.jar` 文件：\n\n[https://github.com/googlesamples/android-ConstraintLayoutExamples/releases/download/1.0/CycleEditor.jar]\n\
  \n下载完成后，打开命令提示符或终端窗口，切换目录到 jar 文件所在位置并运行以下命令：\n\n```bash\njava -jar CycleEditor.jar\n\
  ```\n\n一旦工具加载，将出现如图 44-6 所示的屏幕：\n\n![](img/as_4.0_keycycle_editor_main.jpg)\n\n\
  图 44-6\n\n上图中标记为 A 的面板显示了关键帧集的 XML，可以直接进行编辑，也可以使用 B 面板中的控件进行编辑。C 面板显示了波形形式的周期渲染。遗憾的是，在进行更改时，它并不会实时重绘。相反，必须通过选择\
  \ `File -> Parse XML` 菜单选项来刷新。当点击 B 面板中的播放按钮时，标记为 D 的面板将显示周期动画的实时渲染。`Examples` 菜单提供了一个示例关键帧集集合，既可以用于学习，也可以作为你自己动画的基础。\n\
  \n为了演示周期关键帧和 `Cycle Editor` 的用法，本章的剩余部分将创建一个实现基于 `KeyCycle` 动画效果的项目。\n\n## 44.3\
  \ 创建 KeyCycleDemo 项目\n\n从欢迎界面选择 `New Project` 选项，在弹出的新项目对话框中，点击 `Next` 按钮之前选择 `Empty\
  \ Activity` 模板。\n\n在 `Name` 字段中输入 `KeyCycleDemo`，并指定 `com.ebookfrenzy.keycycledemo`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单更改为 Java。\n\n在布局编辑器处于 Design 模式并打开了 `activity_main.xml` 文件的情况下，右键点击\
  \ `ConstraintLayout` 条目并选择 `Convert to MotionLayout` 菜单选项：\n\n![](img/as_4.0_motionlayout_conversion1.jpg)\n\
  \n图 44-7\n\n做出选择后，点击确认对话框中的 `Convert` 按钮。\n\n## 44.4 配置起始和结束约束\n\n本教程的目标是制作按钮从设备屏幕一侧移动到另一侧的动画，包括导致视图沿\
  \ Y 轴上下移动的 `KeyCycle` 效果。第一步是配置起始和结束约束。\n\n将 `activity_main.xml` 文件加载到 `MotionLayout`\
  \ 编辑器后，选择并删除默认的 `TextView` 组件。在从调色板拖放 `Button` 视图之前，确保 `Motion Layout` 框（如下方图 44-9\
  \ 所示，标记为 E）被选中，使其在垂直方向上居中，并放置在布局画布的左边缘：\n\n![](img/as_4.1_keycycledemo_button_added.jpg)\n\
  \n图 44-8\n\n要配置起始点的约束，在编辑器窗口中选择起始约束集条目（如图 44-9 所示，标记为 A）：\n\n![](img/as_4.0_keycycle_motionlayout_editor_labelled.jpg)\n\
  \n图 44-9\n\n接下来，在 `ConstraintSet` 列表中选择按钮条目 (B)。在按钮条目仍被选中的，点击编辑按钮 (C) 并从菜单中选择 `Create\
  \ Constraint`。\n\n在按钮仍被选中的情况下，使用 `Attributes` 工具窗口为视图的顶部、左侧和底部设置约束如下：\n\n![](img/as_4.0_keycycle_start_constraint.jpg)\n\
  \n图 44-10\n\n选择结束约束集条目（如上方图 44-9 所示，标记为 D），并重复这些步骤创建一个新约束，这次在按钮的顶部、底部和右侧边缘设置约束：\n\
  \n![](img/as_4.0_keycycle_end_constraint.jpg)\n\n图 44-11\n\n## 44.5 创建周期 (Cycles)\n\
  \n下一步是使用 `Cycle Editor` 为动画生成周期关键帧。参考下方图 44-12 所示的面板，在 `MotionLayout` 模式下：\n\n![](img/as_4.0_keycycle_editor_main.jpg)\n\
  \n图 44-12\n\n在 `Cycle Editor` 运行期间，为了看到如图 44-13 所示的更改，将属性从 `rotation` 更改为 `translationY`。\n\
  \n![](img/as_4.0_keycycle_editor_main.jpg)\n\n图 44-13\n\n为了在图中看到如 44-1 所示的更改，使用\
  \ `Cycle Editor` (B) 面板以选择周期 0：\n\n| KeyCycle 0 | KeyCycle 1 | KeyCycle 2 | KeyCycle\
  \ 3 | KeyCycle 4 |\n| :--- | :--- | :--- | :--- | :--- |\n| Position | 0 | 25 |\
  \ 50 | 75 | 100 |\n| Period | 1 | 2 | 3 | 1 |\n| translationY | 60 | 60 | 150 |\
  \ 60 | 60 |\n\n为了在图中看到如 44-10 所示的更改，选择 `File -> Parse XML` 选项。使用 44-11 所示的数值配置关键帧\
  \ 1 到 4 的设置，请记住你已经配置了周期 0：\n\n完成这些更改后，关键帧 XML 如下：\n\n```xml\n<KeyFrame>\n  <KeyCycle\n\
  \    motion:framePosition=\"0\"\n    motion:target=\"@+id/button\"\n    motion:wavePeriod=\"\
  1\"\n    motion:waveOffset=\"0dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"\
  60dp\"/>\n  <KeyCycle\n    motion:framePosition=\"25\"\n    motion:target=\"@+id/button\"\
  \n    motion:wavePeriod=\"2\"\n    motion:waveOffset=\"0dp\"\n    motion:waveShape=\"\
  sin\"\n    android:translationY=\"60dp\"/>\n  <KeyCycle\n    motion:framePosition=\"\
  50\"\n    motion:target=\"@+id/button\"\n    motion:wavePeriod=\"3\"\n    motion:waveOffset=\"\
  0dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"150dp\"/>\n  <KeyCycle\n\
  \    motion:framePosition=\"75\"\n    motion:target=\"@+id/button\"\n    motion:wavePeriod=\"\
  2\"\n    motion:waveOffset=\"0dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"\
  60dp\"/>\n  <KeyCycle\n    motion:framePosition=\"100\"\n    motion:target=\"@+id/button\"\
  \n    motion:wavePeriod=\"1\"\n    motion:waveOffset=\"0dp\"\n    motion:waveShape=\"\
  sin\"\n    android:translationY=\"60dp\"/>\n</KeyFrame>\n```\n\n为了查看带有周期的图表，选择 `File\
  \ -> Parse XML` 菜单选项以刷新波形，波形现在应该如图 44-14 所示：\n\n![](img/as_4.0_keycycle_editor_cyclekeys_complete.jpg)\n\
  \n图 44-14\n\n## 44.6 预览动画\n\n\n\n\n\n现在可以在 Cycle Editor（循环编辑器）工具内部预览循环动画。点击播放按钮（在图\
  \ 44-15 中标记为 A）开始运行动画。要将循环与水平移动相结合，将第二个菜单（B）从“静态”（Stationary）改为“从西到东”（West to East）。此外，花些时间实验时间和线性度设置（C\
  \ 和 D）。\n\n![](img/as_4.0_keycycle_play_buttons.jpg)\n\n图 44-15\n\n### 44.7 向 MotionScene\
  \ 中添加 KeyFrameSet\n\n在 Cycle Editor 中，从 XML 面板选中并复制 `KeyCycle` 元素，然后将其粘贴到 Android\
  \ Studio 中 `res -> xml -> activity_main_scene.xml` 文件的 `Transition` 部分，使其被放置于现有的\
  \ `KeyFrameSet` 标记之间。请注意增加的持续时间设置以及为了启动动画而添加的 `OnClick` 处理程序：\n\n```xml\n<Transition\n\
  \    motion:constraintSetEnd=\"@+id/end\"\n    motion:constraintSetStart=\"@id/start\"\
  \n    motion:duration=\"7000\">\n    <KeyFrameSet>\n        <KeyCycle\n        \
  \    motion:framePosition=\"0\"\n            motion:motionTarget=\"@+id/button\"\
  \n            motion:wavePeriod=\"1\"\n            motion:waveOffset=\"0dp\"\n \
  \           motion:waveShape=\"sin\"\n            android:translationY=\"60dp\"\
  />\n        <KeyCycle\n            motion:framePosition=\"25\"\n.\n.\n    </KeyFrameSet>\n\
  \    <OnClick motion:targetId=\"@id/button\"\n              motion:clickAction=\"\
  toggle\" />\n.\n.\n``` 在继续之前，请检查每个目标属性是否正确声明。在编写时，Cycle Editor 仍使用过时的 `motion:target`\
  \ 标签。例如：\n\n`motion:target=\"@+id/button\"`\n\n需要将五个 `KeyCycle` 条目中的每一个都更改如下内容：\n\
  \n`motion:motionTarget=\"@+id/button\"`\n\n完成这些更改后，编译并在设备或模拟器上运行应用，点击按钮开始并查看动画。\n\
  \n请注意，`KeyCycle` 的波形也可以在 Android Studio MotionLayout 编辑器中查看，如下方的图 44-16 所示：\n\n\
  ![](img/as_4.0_keycycle_motionlayout_timeline_waves.jpg)\n\n图 44-16\n\n`KeyFrameSet`\
  \ 组并不限制为每个动画只有一个。例如，将以下 `KeyFrameSet` 添加到 `activity_main_scene.xml` 文件的 `Transition`\
  \ 部分，以便为按钮在移动时添加一些旋转效果：\n\n```xml\n<KeyFrameSet>\n    <KeyCycle\n        motion:framePosition=\"\
  0\"\n        motion:motionTarget=\"@+id/button\"\n        motion:wavePeriod=\"1\"\
  \n        motion:waveOffset=\"0dp\"\n        motion:waveShape=\"sin\"\n        android:translationY=\"\
  60dp\"\n        android:rotation=\"45\"/>\n    <KeyCycle\n        motion:framePosition=\"\
  25\"\n        motion:motionTarget=\"@+id/button\"\n        motion:wavePeriod=\"\
  2\"\n        motion:waveOffset=\"0dp\"\n        motion:waveShape=\"sin\"\n     \
  \   android:translationY=\"60dp\"\n        android:rotation=\"80\"/>\n    <KeyCycle\n\
  \        motion:framePosition=\"50\"\n        motion:motionTarget=\"@+id/button\"\
  \n        motion:wavePeriod=\"3\"\n        motion:waveOffset=\"0dp\"\n        motion:waveShape=\"\
  sin\"\n        android:translationY=\"150dp\"\n        android:rotation=\"45\"/>\n\
  \    <KeyCycle\n        motion:framePosition=\"75\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"2\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"\n        android:translationY=\"60dp\"\n    \
  \    android:rotation=\"80\"/>\n    <KeyCycle\n        motion:framePosition=\"100\"\
  \n        motion:motionTarget=\"@+id/button\"\n        motion:wavePeriod=\"1\"\n\
  \        motion:waveOffset=\"0dp\"\n        motion:waveShape=\"sin\"\n        android:translationY=\"\
  60dp\"\n        android:rotation=\"45\"/>\n</KeyFrameSet>\n```\n\n### 44.8 总结\n\n\
  循环关键帧提供了一种实用的方法，用于构建涉及大量匹配波形模式的状态变化的动画。正如本章概述的，通过使用 Cycle Editor 可以显著简化生成这些循环帧的过程。\n\
  \n### 45 使用悬浮操作按钮和 Snackbar\n\n本章的目标之一是提供 Material Design（材料设计）概念的概述。Material 设计最初作为\
  \ Android 5.0 的一部分引入，是一套设计指南，规定了 Android 用户界面以及运行在 Android 上的应用的外观和行为。作为 Material\
  \ 设计概念实施的一部分，Google 还引入了 Android Design Support Library（Android 设计支持库）。该库包含许多不同的组件，允许将\
  \ Material 设计的许多功能构建到 Android 应用中。这些组件中的两个——悬浮操作按钮和 Snackbar 也将在本章中介绍，并在随后的章节中介绍许多其他组件。\n\
  \n## 45.1 Material 设计\n\nAndroid 环境的整体外观由 Material 设计原则定义。Material 设计由 Google 的\
  \ Android 团队创建，它规定了构成 Android 用户界面以及运行在上面的应用上的元素在行为、动画和样式方面的显示和行为方式。Material 设计的一个原则是用户界面元素具有物理深度，并且感觉像是由物理层构建的。例如，通过通过阴影效果，按钮似乎位于其所在的布局表面之上。按下按钮时，按钮会变形并抬起，仿佛由薄材料制。\n\
  \nMaterial 设计还规定了许多标准用户界面元素的布局和行为。一个关键示例是屏幕顶部的应用栏应该如何显示，以及它相对于活动内容内滚动活动的行为。\n\n\
  事实上，Material 设计涵盖了从推荐颜色样式到对象动画方式的广泛领域。Material 设计概念和指南的完整描述可以通过以下链接在线找到，是所有 Android\
  \ 开发者的推荐阅读：[`material.io/design/introduction`](https://material.io/design/introduction)\n\
  \n## 45.2 设计库\n\n实现采用 Material 设计原则的 Android 应用所需的许多构建块包含在 Design Support Library\
  \ 中。该库包含一组用户界面组件，可以包含在 Android 应用中以实现 Material 设计的大观、感觉和行为。该库中的两个组件——悬浮操作按钮和 Snackbar\
  \ 将在本章中介绍，其他组件将在后续章节中介绍。\n\n#### 45.3 悬浮操作按钮 (FAB)\n\n悬浮操作按钮是一个浮于应用界面之上的按钮，通常用于促进中最常见的操作。例如，悬浮操作按钮可能会放置在屏幕上，允许用户向联系人列表添加条目或从应用内发送电子邮件。图\
  \ 45-1，例如，突出了允许用户在标准 Android 电话应用中显示键盘的悬浮操作按钮：\n\n\n\n\n为了符合材料设计（Material Design）指南，在使用悬浮操作按钮时应遵循多条规则。悬浮操作按钮必须是圆形的，尺寸可以是\
  \ 56 x 56dp（默认）或 40 x 40dp（小型）。在手机上，按钮距离屏幕边缘至少 16dp，在桌面电脑和平板设备上至少 24dp。无论尺寸如何，按钮必须包含一个大小为\
  \ 24x24dp 的内部图标，并且建议每个用户界面只手机悬浮操作按钮。\n\n悬浮操作按钮可以带有动画，或者设计为触摸时变形为其他项目。例如，悬浮操作按钮可以在点击时旋转，或者变形为其他元素，如工具栏或相关操作列表面板。\n\
  \n## 45.4 Snackbar\n\n`Snackbar` 组件提供了一种以面板形式向用户展示信息的方法，如图 45-2 所示。`Snackbar` 实例包含一条简短的文本消息和一个可选的操作按钮，用户点击该按钮后将执行相应任务。一旦显示，`Snackbar`\
  \ 将自动超时，也可以由用户通过滑动操作手动移除。在 `Snackbar` 显示期间，应用将继续运行并以正常方式响应用户交互。\n\n![](img/Image2434.jpg)??\n\
  \n图 45-2\n\n在本章的剩余部分中，将创建一个示例应用程序，利用悬浮操作按钮和 `Snackbar` 的基本功能向项目列表添加条目。\n\n## 45.5\
  \ 创建示例项目\n\n从欢迎界面选择 `New Project` 选项，在弹出的新项目对话框中，点击 `Next` 按钮之前选择 `Basic Activity\
  \ (Material3)` 模板。\n\n在 `Name` 字段中输入 `FabExample`，并指定 `com.ebookfrenzy.fabexample`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单设置为 `Java`。\n\n## 45.6 检查项目\n\n由于选择了 `Basic Activity` 模板，该 Activity\
  \ 包含了四个布局文件。`activity_main.xml` 文件由一个 `CoordinatorLayout` 布局管理器组成，包含应用栏（app bar）、`Material\
  \ toolbar` 和悬浮操作按钮的项。\n\n`content_main.xml` 文件代表 Activity 内容区域的布局，包含一个 `NavHostFragment`\
  \ 实例。该文件通过以下 include 指令嵌入到 `activity_main.xml` 文件中：\n\n```xml\n<include layout=\"\
  @layout/content_main\" />\n```\n\n`activity_main.xml` 文件中的悬浮操作按钮元素如下：\n\n```xml\n\
  <com.google.android.material.floatingactionbutton.FloatingActionButton\n    android:id=\"\
  @+id/fab\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_gravity=\"bottom|end\"\n    android:layout_marginEnd=\"\
  @dimen/fab_margin\"\n    android:layout_marginBottom=\"16dp\"\n    app:srcCompat=\"\
  @android:drawable/ic_dialog_email\" />\n```\n\n这声明按钮将出现在屏幕右下角，边距由 `values/dimens.xml`\
  \ 文件中的 `fab_margin` 标识符表示（在此情况下设置为 16dp）。XML 进一步声明按钮的内部图标将采用标准的内置邮件图标 drawable 。\n\
  \n空白模板还配置了悬浮操作按钮，当用户点击时会显示 `Snackbar` 实例。实现此功能的代码可以在 `MainActivity.java` 文件的 `onCreate()`\
  \ 方法中找到，如下：\n\n```java\nbinding.fab.setOnClickListener(new View.OnClickListener()\
  \ {\n    @Override\n    public void onClick(View view) {\n        Snackbar.make(view,\
  \ \"Replace with your own action\", Snackbar.LENGTH_LONG)\n              .setAction(\"\
  Action\", null).show();\n    }\n});\n```\n\n该代码通过视图绑定 访问悬浮操作按钮，并为其添加了一个 `OnClickListener`\
  \ 处理器，在点击按钮时调用。该方法简单地显示了一个配置了消息但没有操作的 `Snackbar` 实例。\n\n当项目编译并运行时，悬浮操作按钮将出现在屏幕底部，如图\
  \ 45-3 所示：\n\n![](img/as_default_fab.jpg)\n\n图 45-3\n\n点击悬浮操作按钮将触发 `OnClickListener`\
  \ 处理器方法，导致 `Snackbar` 显示在屏幕底部：\n\n![](img/as_default_fab_snackbar.jpg)\n\n图 45-4\n\
  \n## 45.7 移除导航功能\n\n如“Android Studio 布局编辑器工具指南”所述概述，`Basic Activity` 模板包含多个 fragment\
  \ 和按钮，用于在不同 fragment 之间导航。对于本教程而言，这些功能是不必要的，如果不移除，稍后会导致问题。在继续教程之前，按照以下方式修改项目：\n\n\
  1. 在 `Project` 窗口中，导航并双击 `app -> res -> nav_graph.xml` 将其加载到编辑器。\n2. 在编辑器中，在 `Component`\
  \ 面板中选择 `SecondFragment` 并按下删除键将其移除。\n3. 定位并删除 `SecondFragment.java` (`app -> java\
  \ -> SecondFragment`) 和 `fragment_second.xml` (`app -> res -> layout -> fragment_second`)。\n\
  4. 定位 `FirstFragment.java` 文件，双击加载它，从 `onViewCreated()` 方法中删除代码如下：\n\n```java\n\
  binding.fab.setOnClickListener(new View.OnClickListener() {\n    @Override\n   \
  \ public void onClick(View view) {\n        NavHostFragment.findNavController(FirstFragment.this)\n\
  \              .navigate(R.id.action_FirstFragment_to_SecondFragment);\n    }\n\
  });\n```\n\n## 45.8 更改悬浮按钮\n\n由于此示例的目标是配置悬浮按钮向列表添加条目，因此需要更改按钮显示的图标以指示执行的操作。按钮使用的图标为\
  \ `ic_add_entry.png`，可以从以下 URL 下载的示例代码 `project_icons` 文件夹中找到：\n\n[www.ebookfrenzy.com/retail/chipjava/index.php](https://www.ebookfrenzy.com/retail/chipjava/index.php)\n\
  \n在文件系统中定位此图像并复制。右键点击 `Project` 窗口中的 `app -> res -> drawable` 项，从菜单中选择 `Paste` 将文件添加到文件夹中：\n\
  \n![](img/as_default_added.jpg)\n\n\n\n\n\n接下来，编辑 `activity_main.xml` 文件，将图标源从 `@android:drawable/ic_dialog_email`\
  \ 更改为 `@drawable/ic_add_entry`，如下：\n\n```xml\n<com.google.android.material.floatingactionbutton.FloatingActionButton\n\
  \    android:id=\"@+id/fab\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_gravity=\"bottom|end\"\n    android:layout_marginEnd=\"\
  @dimen/fab_margin\"\n    android:layout_marginBottom=\"16dp\"\n    app:srcCompat=\"\
  @drawable/ic_add_entry\" />\n```\n\n在布局预览中，按钮的内部图标已更改为加号。\n\n我们也可以通过向 `OnClickListener`\
  \ 添加代码，让悬浮操作按钮在点击时执行任何操作。例如，`MainActivity.java` 文件的以下更改将在每次点击按钮时调用名为 `displayMessage()`\
  \ 的方法来显示 toast 消息：\n\n```java\n.\n.\nimport android.widget.Toast;\n.\n.\nbinding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n    @Override\n    public void onClick(View view) {\n\
  \        displayMessage(\"Fab clicked\");\n        Snackbar.make(view, \"Replace\
  \ with your own action\", Snackbar.LENGTH_LONG)\n              .setAction(\"Action\"\
  , null).show();\n    }\n});\n```\n\n\n\n\n```java\npublic void displayMessage(String\
  \ message) {\n    Toast.makeText(this,message,Toast.LENGTH_SHORT).show();\n}\n```\n\
  \n## 45.9 为 Snackbar 添加操作\n\n也可以为 `Snackbar` 添加操作（Action），该操作会在用户点击时执行特定任务。编辑 `MainActivity.java`\
  \ 文件并修改 `Snackbar` 的创建代码，添加一个标题为“My Action”的操作，并配置命名为 `actionOnClickListener` 的\
  \ `onClickListener`，后者将显示 toast 消息：\n\n```java\nbinding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n    @Override\n    public void onClick(View view) {\n\
  \        Snackbar.make(view, \"Replace with your own action\", Snackbar.LENGTH_LONG)\n\
  \                .setAction(\"My Action\", actionOnClickListener).show();\n    }\n\
  });\n```\n\n在 `MainActivity.java` 文件中添加监听器处理器：\n\n```java\nView.OnClickListener\
  \ actionOnClickListener = new View.OnClickListener() {\n    @Override\n    displayMessage(\"\
  Action clicked\");\n    public void onClick(View view) {\n        Snackbar.make(view,\
  \ \"Action Complete\", Snackbar.LENGTH_LONG)\n                .setAction(\"Action\"\
  , null).show();\n    }\n};\n```\n\n运行应用并点击悬浮动作按钮（FAB），此时 toast 消息和 `Snackbar` 都应该出现。当\
  \ `Snackbar` 可见时，点击 `Snackbar` 中的“My Action”按钮，并验证 `Snackbar` 上的文字已变为“Action Complete”：\n\
  \n![](img/as_fab_action_clicked.jpg)\n\n图 45-6\n\n## 45.10 总结\n\n本章在通过一个使用这些功能的示例项目之前，对\
  \ Material Design、悬浮动作按钮和 Snackbar 进行了总体概述。\n\n悬浮动作按钮和 `Snackbar` 都是 Android 中实现用户界面的\
  \ Material Design 方法的一部分。悬浮动作按钮提供了一种在 Android 应用特定屏幕内推广最常用操作的方法。`Snackbar` 则为应用程序提供了一种既向用户展示信息并允许用户对该信息采取行动的方法。\n\
  \n## 46. 使用 TabLayout 组件创建标签页界面\n\n上一章概述了 Android 中 Material Design 的概念，并引入了设计支持库提供的两个组件：悬浮动作按钮和\
  \ `Snackbar`。本章将演示如何使用设计库的另一个组件 `TabLayout`，它可以与 `ViewPager` 类结合，在 Android Activity\
  \ 中创建一个基于标签页的界面。\n\n## 46.1 ViewPager2 简介\n\n虽然 `ViewPager2` 并不是设计支持库的一部分，但在与 `TabLayout`\
  \ 组件配合使用实现标签页用户界面时，它是一个非常有用的辅助类。`ViewPager2` 的主要作用是允许用户翻阅不同的信息页面，每个页面通常由一个布局片段（layout\
  \ fragment）表示。与 `ViewPager2` 关联片段由 `FragmentPagerAdapter` 类的实例管理。\n\n至少分配给 `ViewPager2`\
  \ 的分页器适配器必须实现两个方法。第一个方法名为 `getItemCount()`，必须返回可向用户显示的所有页面片段总数。第二个方法 `createFragment()`\
  \ 接收一个页码，并必须返回一个准备呈现给用户的相应片段对象。\n\n## 46.2 TabLayout 组件概述\n\n如前所述，`TabLayout` 是作为\
  \ Material Design 的一部分引入的组件之一，并包含在设计支持库中。`TabLayout` 的目的是向用户提供一行标签，可以通过选择这些标签来向用户显示不同的页面。标签可以是固定的也可以是可滚的，用户可以向左或向右滑动以查看比当前屏幕显示更多的标签。标签上显示的信息可以是文本、图像或文本与图像的组合。例如，图\
  \ 46-1 显示了一个包含四个显示图像标签的 App 标签栏：\n\n![](img/Image24251.jpg)\n\n图 46-1\n\n另一方面，图\
  \ 46-2 显示了一个 `TabLayout` 配置，包含四个以滚动配置显示文本的标签：\n\n![](img/Image24341.jpg)\n\n图 46-2\n\
  \n本章的剩余部分将通过创建一个示例项目，该项目将演示如何将 `TabLayout` 组件配合 `ViewPager2` 和四个片段使用。\n\n### 46.3\
  \ 创建 TabLayoutDemo 项目\n\n从欢迎界面选择“New Project”（新建项目）选项，在生成的新项目对话框中，在点击“Next”（下一步）按钮之前，选择“Basic\
  \ Activity (Material3)”模板。\n\n在 `Name` 字段中输入 `TabLayoutDemo`，并指定包名为 `com.ebookfrenzy.tablayoutdemo`。在点击“Finish”（完成）按钮之前，将\
  \ Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将语言菜单更改为 Java。\n\n项目创建完成后，将\
