  \ clicked”文本。\n\n## 26.7 消费事件\n\n对视图上的标准点击（而非长点击）的检测是事件处理的一个非常简单的情况。现在将扩展示例以包含对长点击事件的检测，长点击事件发生在用户点击并按住屏幕上的视图时，由此涵盖了事件消费的主题。\n\
  \n考虑本章上部分 `onClick()` 方法的代码。该回调被声明为 `void`，因此在执行完成后它不会向 Android 框架返回值。\n\n另一方面，赋值给\
