  ## 77.6 设计用户界面布局\n\n如果尚未加载 `content_main.xml` 布局资源文件，将其加载到 `Layout Editor` 工具中，并在\
  \ `Design` 模式下选择并删除 `nav_host_fragment_content_main` 对象。从调色板的 `Widgets` 部分将 `WebView`\
  \ 对象拖放到设备屏幕布局的中心位置。点击 `Infer constraints` 工具栏按钮，并使用 `Attributes` 工具窗口更改 `WebView`\
  \ 的 `layout_width` 和 `layout_height` 属性以匹配约束，使其如[图 77-2]所示填充整个布局画布。\n\n![](img/as_3.6_webprint_ui.jpg)\n\
  图 77-2\n\n选择新添加的 `WebView` 实例并将视图的 `ID` 改为 `myWebView`。在继续下一步之前，需要向项目添加额外的权限以允许\
  \ `WebView` 访问互联网。通过在 `Project` 窗口中找到 `AndroidManifest.xml` 文件并双击它添加此权限。加载后，编辑 XML\
  \ 添加以下内容：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy\">\n\
  \    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <application\n\
  \        android:allowBackup=\"true\">\n</manifest>\n```\n\n## 77.7 从 Activity 访问\
  \ WebView\n\n正如“Android RecyclerView 和 CardView”所示，我们需要使用 `binding` 来访问 `content_main.xml`\
  \ 中的组件（在本例中为 `WebView`）。为了能够访问 `content_main.xml` 中的视图，我们首先需要在包含它时分配一个 `id`。编辑 `activity_main.xml`\
  \ 并修改 `include` 元素如下：\n\n```xml\n<include android:id=\"@+id/content\" layout=\"\
  @layout/content_main\" />\n```\n\n## 77.8 加载网页\n\n在打印网页之前，需要将其加载到 `WebView` 中。对于本教程，这将通过调用\
  \ `WebView` 实例的 `loadUrl()` 方法来实现，该调用将放在命名为 `configureWebView()` 的方法中，并在 `MainActivity`\
  \ 类的 `onStart()` 方法中调用。编辑 `MainActivity.java` 文件如下：\n\n```java\npackage com.ebookfrenzy.webprint;\n\
  \nimport android.view.Menu;\nimport android.view.MenuItem;\nimport android.webkit.WebView;\n\
  import android.webkit.WebViewClient;\nimport android.webkit.WebResourceRequest;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private WebView myWebView;\n\
  \n    @Override\n    protected void onStart() {\n        super.onStart();\n    \
  \    configureWebView();\n    }\n\n    private void configureWebView() {\n     \
  \   myWebView = findViewById(R.id.myWebView);\n        myWebView.setWebViewClient(new\
  \ WebViewClient(){\n            @Override\n            public boolean shouldOverrideLoading(WebView\
  \ view, WebResourceRequest request) {\n                return super.shouldOverrideLoading(view,\
  \ request);\n            }\n        });\n        myWebView.loadUrl(\"https://www.answertopia.com\"\
  );\n    }\n}\n```\n\n## 77.9 添加打印菜单选项\n\n现在将使用“在 Android 上创建和管理溢出菜单”章节概述的技术将打印选项添加到溢出菜单中。第一个要求是用于标记菜单选项的字符串资源。在\
  \ `Project` 窗口中，找到 `app -> res -> values -> strings.xml` 文件，双击它将其加载到编辑器并修改它以添加一个新的字符串资源：\n\
  \n[content]\n<resources>\n\n[/content]\n\n\n\n\n```xml\n<string name=\"app_name\"\
  >WebPrint</string>\n<string name=\"action_settings\">Settings</string>\n<string\
  \ name=\"print_string\">Print</string>\n</resources>\n```\n\n接下来，加载应用 -> `res` ->\
  \ `menu` -> `menu_main.xml` 文件到菜单编辑器中，切换到代码模式并将设置菜单选项替换为打印选项：\n\n```xml\n<menu xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    tools:context=\"com.ebookfrenzy.webprint.MainActivity\">\n    <item android:id=\"\
  @+id/action_settings\"\n        android:title=\"@string/action_settings\"\n    \
  \    android:orderInCategory=\"100\"\n        app:showAsAction=\"never\" />\n  \
  \  <item\n        android:id=\"@+id/action_print\"\n        android:orderInCategory=\"\
  100\"\n        app:showAsAction=\"never\"\n        android:title=\"@string/print_string\"\
  />\n</menu>\n```\n\n在菜单选项配置方面，剩下的就是修改 `MainActivity.java` 文件中的 `onOptionsItemSelected()`\
  \ 处理方法了：\n\n```java\n@Override\npublic boolean onOptionsItemSelected(MenuItem item)\
  \ {\n    int id = item.getItemId();\n    if (id == R.id.action_print) {\n      \
  \  createWebPrintJob(myWebView);\n        return true;\n    }\n    return super.onOptionsItemSelected(item);\n\
  }\n```\n\n实现 `onOptionsItemSelected()` 方法后，当从溢出菜单中选择打印选项时，该活动将调用名为 `createWebPrintJob()`\
  \ 的方法。该方法的实现方式与之前的 HTMLPrint 项目中使用的相同，现在可以将其添加到 `MainActivity.java` 文件中，内容如下：\n\n\
  ```java\npackage com.ebookfrenzy.webprint;\n\nimport android.print.PrintAttributes;\n\
  import android.print.PrintDocumentAdapter;\nimport android.print.PrintManager;\n\
  import android.content.Context;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private WebView myWebView;\n\n    private void createWebPrintJob(WebView\
  \ webView) {\n        PrintManager printManager = (PrintManager) this\n        \
  \    .getSystemService(Context.PRINT_SERVICE);\n        PrintDocumentAdapter printAdapter\
  \ =\n            webView.createPrintDocumentAdapter(\"MyDocument\");\n        String\
  \ jobName = getString(R.string.app_name) +\n            \" Print Test\";\n     \
  \   printManager.print(jobName, printAdapter,\n            new PrintAttributes.Builder().build());\n\
  \    }\n}\n```\n\n完成代码更改后，在物理 Android 设备或运行 Android 5.0 或更高版本的模拟器上运行应用程序。一旦成功启动，WebView\
  \ 应该可见，并加载了指定的网页。页面加载后，从溢出菜单（ ) ）中选择打印选项，并使用生成的打印面板将网页打印到合适的目标。\n\n## 77.10 总结\n\
  \nAndroid 打印框架包含了对 `WebView` 类的扩展，使得在 Android 内部打印基于 HTML 的内容成为可能。这些内容可以是应用程序在运行时动态创建的\
  \ HTML 形式，也可以加载到 `WebView` 实例中的现有网页。在动态创建 HTML 的情况下，使用 `WebViewClient` 实例非常重要，以确保在\
  \ HTML 完全加载到 `WebView` 之前不会开始打印。\n\n# 78 Android 自定义打印指南\n\n正如我们在前面的章节中所看到的，只要内容是图像或\
  \ HTML 标记的形式，Android 打印框架就可以很容易地在应用程序中构建打印支持。通过使用打印框架的自定义文档打印功能，可以满足更高级打印的需求。\n\n\
  ### 78.1 Android 自定义文档打印概述\n\n简单来说，自定义文档打印使用画布（Canvas）来表示页面。虽然这听起来很简单，但实际上有很多需要执行的步骤，可以总结如下：\n\
  \n- 实现子自 `PrintDocumentAdapter` 的自定义打印适配器\n- 获取 `PrintManager` 的引用\n- 创建 `PdfDocument`\
  \ 实例\n- 向 `PdfDocument` 中添加页面\n- 获取 `Canvas` 对象\n- 在画布上绘制内容\n- 将 PDF 文档写入目标地\n-\
  \ 通知打印框架文档已准备就绪\n\n在本章中，将提供这些步骤的概述，随后将提供一个详细的教程来演示自定义文档打印的实现。\n\n### 78.1.1 自定义适配器\n\
  \n打印适配器的作用是为打印框架提供要打印的内容，并确保其根据用户的偏好（如纸张大小和方向）进行正确格式化。在打印 HTML 和图像时，大部分工作由打印框架提供的打印适配器完成。例如，在打印网页时，当调用\
  \ `WebView` 实例的 `createPrintDocumentAdapter()` 方法时，会为我们创建一个打印适配器。\n\n然而，在自定义文档打印的情况下，设计打印适配器并实现绘制和格式化内容的代码是应用程序开发者的责任。\n\
  \n## 78.2 准备自定义文档项目\n\n\n\n\n\n从欢迎屏幕选择 `New Project` 选项，在弹出的新项目对话框中，在点击 `Next` 按钮之前，选择\
  \ `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `CustomPrint` 并指定 `com.ebookfrenzy.customprint`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置更改为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单设置为 `Java`。\n\n将 `activity_main.xml` 布局文件加载到 `Layout Editor` 工具中，并在\
  \ `Design` 模式下选择并删除“Hello World!” `TextView` 对象。从调色板的 `Form Widgets` 部分拖入一个 `Button`\
  \ 视图并放置在布局视图的中心。选中 `Button` 视图，将 `text` 属性更改为“Print Document”，并将该字符串提取到新资源中。完成后，用户界面布局应与图\
  \ 78-1 所示所示：\n\n![](img/as_4.1_custom_print_ui.jpg)\n\n图 78-1\n\n当在应用程序中选中按钮时，需要调用一个方法来启动文档打印过程。留在\
  \ `Attributes` 工具窗口中，将 `onClick` 属性设置为调用名为 `printDocument` 的方法。\n\n### 78.3 创建自定义打印适配器\n\
  \n在 Android 应用程序打印自定义文档的大部分工作都涉及自定义打印适配器的实现。此示例需要一个实现了 `onLayout()` 和 `onWrite()`\
  \ 回调方法的打印适配器。在 `MainActivity.java` 文件中，添加此新类的模板，使其内容如下：\n\n```java\npackage com.ebookfrenzy.customprint;\n\
  \n.\n\n.\n\nimport android.os.CancellationSignal;\nimport android.os.ParcelFileDescriptor;\n\
  import android.print.PageRange;\nimport android.print.PrintAttributes;\nimport android.print.PrintDocumentAdapter;\n\
  import android.content.Context;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    public static class MyPrintDocumentAdapter extends PrintDocumentAdapter\n\
  \    {\n        Context context;\n        MyPrintDocumentAdapter(Context context)\n\
  \        {\n            this.context = context;\n        }\n        @Override\n\
  \        public void onLayout(PrintAttributes oldAttributes,\n                 \
  \            PrintAttributes newAttributes,\n                             CancellationSignal\
  \ cancellationSignal,\n                             LayoutResultCallback callback,\n\
  \                             Bundle metadata) {\n        }\n        @Override\n\
  \        public void onWrite(final PageRange[] pageRanges,\n                   \
  \         final ParcelFileDescriptor destination,\n                            final\
  \ CancellationSignal\n                            cancellationSignal,\n        \
  \                    final WriteResultCallback callback) {\n        }\n    }\n.\n\
  \n.\n}\n```\n\n目前该新类包含一个构造函数方法，该构造方法会在创建类的新实例时被调用。构造函数接收调用活动体的 `context` 作为参数，并将其存储，以便稍后在两个回调方法中引用。\n\
  \n建立类的大纲后，下一步是开始实现两个回调方法，从 `onLayout()` 开始。\n\n### 78.4 实现 `onLayout()` 回调方法\n\n\
  留在 `MainActivity.java` 文件中，首先添加一些 `onLayout()` 方法中的代码所需的导入指令：\n\n```java\npackage\
  \ com.ebookfrenzy.customprint;\n\n.\n\n.\n\nimport android.print.PrintDocumentInfo;\n\
  import android.print.pdf.PrintedPdfDocument;\nimport android.graphics.pdf.PdfDocument;\n\
  \npublic class MainActivity extends AppCompatActivity {\n.\n\n.\n}\n```\n\n接下来，修改\
  \ `MyPrintDocumentAdapter` 类，声明在 `onLayout()` 方法中使用的变量：\n\n```java\npublic static\
  \ class MyPrintDocumentAdapter extends PrintDocumentAdapter\n{\n    Context context;\n\
  \    int pageHeight;\n    int pageWidth;\n    PdfDocument myPdfDocument;\n    int\
  \ pages = 4;\n.\n}\n```\n\n注意，在本示例中，将打印一个四页的文档。在更复杂的情况下，应用程序可能需要根据用户纸张尺寸和方向的数量，动态计算需要打印的页数。在声明变量后，按照以下代码概述实现\
  \ `onLayout()` 方法：\n\n```java\n@Override\npublic void onLayout(PrintAttributes oldAttributes,\n\
  \                     PrintAttributes newAttributes,\n                     CancellationSignal\
  \ cancellationSignal,\n                     LayoutResultCallback callback,\n   \
  \                  Bundle metadata) {\n    myPdfDocument = new PrintedPdfDocument(context,\
  \ newAttributes);\n    pageHeight = newAttributes.getMediaSize().getHeightMils()/1000\
  \ * 72;\n    pageWidth = newAttributes.getMediaSize().getWidthMils()/1000 * 72;\n\
  \    if (cancellationSignal.isCanceled() ) {\n        callback.onLayoutCancelled();\n\
  \        return;\n    }\n    if (pages > 0) {\n        PrintDocumentInfo.Builder\
  \ builder = new PrintDocumentInfo.Builder(\"print_output.pdf\")\n            .setContentType(PrintDocumentInfo.CONTENT_DOCUMENT).setPageCount(pages);\n\
  \        PrintDocumentInfo info = builder.build();\n        callback.onLayoutFinished(info,\
  \ true);\n    } else {\n        callback.onLayoutFailed(\"Page count is zero.\"\
  );\n    }\n}\n```\n\n显然，该方法正在执行许多任务，每项任务都需要详细的解释。\n\n首先，以 `PdfDocument` 实例的形式创建一个新的\
  \ PDF 文档。打印框架调用 `onLayout()` 方法时传入的参数之一 `PrintAttributes` 对象，包含了用户选择的纸张尺寸、分辨率和颜色设置。这些设置在创建\
  \ PDF 文档时会结合我们通过构造函数存储的活动 `context` 使用：\n\n`myPdfDocument = new PrintedPdfDocument(context,\
  \ newAttributes)`\n\n该方法随后使用 `PrintAttributes` 对象提取文档页的高度和宽度值。这些维度在对象中以英寸千分之一的形式存储。由于本示例中稍后使用这些值的方法是以\
  \ 1/72 英寸为单位，因此在存储之前对其进行了转换：\n\n`pageHeight = newAttributes.getMediaSize().getHeightMils()/1000\
  \ * 72`\n\n`pageWidth = newAttributes.getMediaSize().getWidthMils()/1000 * 72`\n\
  \n当 `onLayout()` 被调用时，会传递一个 `LayoutResultCallback` 对象。该对象提供了一种通过一组方法向打印框架通信状态机制。例如，如果用户取消了打印过程，`onLayout()`\
  \ 方法就会被调用。过程已取消通过 `CancellationSignal` 参数中的一个设置来指示。如果检测到取消，`onLayout()` 方法必须调用 `LayoutResultCallback`\
  \ 对象的 `onLayoutCancelled()` 方法，以通知打印框架已收到取消请求且布局任务已取消：\n\n```java\nif (cancellationSignal.isCanceled()\
  \ ) {\n    callback.onLayoutCancelled();\n    return;\n}\n```\n\n\n\n\n\n当布局工作完成后，需要调用\
  \ `LayoutResultCallback` 对象的 `onLayoutFinished()` 方法，并传递两个参数。第一个参数采用 `PrintDocumentInfo`\
  \ 对象的格式，包含要打印文档的信息。这些信息包括用于 PDF 文档的名称、内容类型（在此情况下是文档而非图像）以及页数。第二个参数是一个 `Boolean`\
  \ 值，表示自上一次调用 `onLayout()` 方法以来布局是否发生了变化：\n\n```java\nif (totalpages > 0) {\n   \
  \ PrintDocumentInfo.Builder builder = new PrintDocumentInfo\n            .Builder(\"\
  print_output.pdf\")\n            .setContentType(\n                PrintDocumentInfo.CONTENT_TYPE_DOCUMENT)\n\
  \            .setPageCount(totalpages);\n    PrintDocumentInfo info = builder.build();\n\
  \    callback.onLayoutFinished(info, true);\n} else {\n    callback.onLayoutFailed(\"\
  Page count is zero.\");\n}\n```\n\n如果页数为 0，代码将通过调用 `LayoutResultCallback` 对象的 `onLayoutFailed()`\
  \ 方法向打印框架（Printing framework）报告此项失败。调用 `onLayoutFinished()` 方法将通知打印框架布局工作已完成，从而触发对\
  \ `onWrite()` 方法的调用。\n\n### 78.5 实现 onWrite() 回调方法\n\n`onWrite()` 回调方法负责渲染文档页面，然后通知打印框架文档已准备好打印。完成后，`onWrite()`\
  \ 方法的读取如下：\n\n```java\npackage com.ebookfrenzy.customprint;\n\nimport java.io.FileOutputStream;\n\
  import java.io.IOException;\n.\n.\nimport android.graphics.pdf.PdfDocument.PageInfo;\n\
  .\n.\n\n@Override\npublic void onWrite(final PageRange[] pageRanges,\n         \
  \           final ParcelFileDescriptor destination,\n                    final CancellationSignal\
  \ cancellationSignal,\n                    final WriteResultCallback callback) {\n\
  \    for (int i = 0; i < totalpages; i++) {\n        if (pageInRange(pageRanges,\
  \ i)) {\n            PageInfo newPage = new PageInfo.Builder(pageWidth,\n      \
  \              pageHeight, i).create();\n            PdfDocument.Page page =\n \
  \                   myPdfDocument.startPage(newPage);\n            if (cancellationSignal.isCanceled())\
  \ {\n                callback.onWriteCancelled();\n                myPdfDocument.close();\n\
  \                myPdfDocument = null;\n                return;\n            }\n\
  \            drawPage(page, i);\n            myPdfDocument.finishPage(page);\n \
  \       }\n    }\n    try {\n        myPdfDocument.writeTo(new FileOutputStream(\n\
  \                destination.getFileDescriptor()));\n    } catch (IOException e)\
  \ {\n        callback.onWriteFailed(e.toString());\n        return;\n    } finally\
  \ {\n        myPdfDocument.close();\n        myPdfDocument = null;\n    }\n    callback.onWriteFinished(pageRanges);\n\
  }\n```\n\n`onWrite()` 方法开始时遍历文档中的每一页。然而，重要的是，用户可能并没有请求打印构成文档的所有页面。事实上，打印框架的 UI 面板提供了一个选项，可以指定打印特定的页面或页码范围。例如，78-2\
  \ 显示打印面板被配置为打印文档的第 1-4 页、第 9 页以及第 11-13 页。\n\n![](img/Image24365.jpg)\n图 78-2\n\n\
  在将页面写入 PDF 文档时，`onWrite()` 方法必须采取措施，确保只打印用户指定的页面。为了实现这一点，打印框架会将一个 `PageRange` 对象数组作为参数传递，指示要打印的页码范围。在上面的\
  \ `onWrite()` 实现中，对每个页面都会调用一个名为 `pagesInRange()` 的方法，以验证该页面是否在指定的范围内。`pagesInRange()`\
  \ 方法的代码将在本章稍后部分实现。\n\n```java\nfor (int i = 0; i < totalpages; i++) {\n    if (pageInRange(pageRanges,\
  \ i)) {\n```\n\n对于位于任何指定范围内的每一页，都会创建一个新的 `PdfDocument.Page` 对象。在创建新页面时，之前由 `onLayout()`\
  \ 方法存储的高度和宽度值将作为参数传递，以便页大小与用户选择的打印选项相匹配：\n\n```java\nPageInfo newPage = new PageInfo.Builder(pageWidth,\
  \ pageHeight, i).create();\nPdfDocument.Page page = myPdfDocument.startPage(newPage);\n\
  ```\n\n与 `onLayout()` 方法一样，`onWrite()` 方法需要响应取消请求。在这种情况下，代码在关闭并取消引用 `myPdfDocument`\
  \ 变量之前，通知打印框架取消已执行：\n\n```java\nif (cancellationSignal.isCanceled()) {\n    callback.onWriteCancelled();\n\
  \    myPdfDocument.close();\n    myPdfDocument = null;\n    return;\n}\n```\n\n\
  只要打印过程没有取消，方法就会调用一个方法在当前页面上绘制内容，然后调用 `myPdfDocument` 对象的 `finishPage()` 方法：\n\n\
  ```java\ndrawPage(page, i);\nmyPdfDocument.finishPage(page);\n```\n\n当所需的页面已添加到\
  \ PDF 文档后，通过作为 `onWrite()` 参数传递的文件描述写入文档。如果由于任何原因写入操作失败，方法将通过调用 `WriteResultCallback`\
  \ 对象的 `onWriteFailed()` 方法通知框架。\n\n```java\ntry {\n    myPdfDocument.writeTo(new\
  \ FileOutputStream(\n            destination.getFileDescriptor()));\n} catch (IOException\
  \ e) {\n    callback.onWriteFailed(e.toString());\n    return;\n} finally {\n  \
  \  myPdfDocument.close();\n    myPdfDocument = null;\n}\n```\n\n最后，调用 `WriteResultCallback`\
  \ 对象的 `onWriteFinished()` 方法通知打印框架文档已准备好打印。\n\n## 78.6 检查页码在范围内\n\n如之前所述，调用 `onWrite()`\
  \ 方法时，它接收一个 `PageRange` 对象数组，指示要打印的文档页码范围。`PageRange` 类设计用于存储页范围的起始和结束页，反之可以通过类的\
  \ `getStart()` 和 `getEnd()` 方法访问。\n\n在上一节实现 `onWrite()` 方法时，调用了一个名为 `pageInRange()`\
  \ 的方法，该方法将 `PageRange` 对象数组和页码作为参数。`pageInRange()` 方法的作用是识别指定的页码是否在指定的范围内，可以在 `MainActivity.java`\
  \ 类中的 `MyPrintDocumentAdapter` 类中如下实现：\n\n```java\npublic class MyPrintDocumentAdapter\
  \ extends PrintDocumentAdapter {\n.\n.\n    private boolean pageInRange(PageRange[]\
  \ pageRanges, int page) {\n        for (PageRange pageRange : pageRanges) {\n  \
  \          if ((page >= pageRange.getStart()) &&\n                (page <= pageRange.getEnd()))\
  \ {\n                return true;\n            }\n        }\n        return false;\n\
  \    }\n.\n.\n}\n```\n\n## 78.7 在页面画布上绘制内容\n\n\n\n\n\n我们现在到了这一阶段，需要编写一些代码来在页面上绘制内容，以便准备好打印。所绘制的内容完全取决于具体的应用程序，并且仅限于使用\
  \ `Android Canvas` 类能够实现的功能。不过，为了本示例的目的，我们将在画布上绘制一些简单的文本和图形。\n\n`onWrite()` 方法被设计为调用名为\
  \ `drawPage()` 的方法，该方法接收两个参数：代表当前页面的 `PdfDocument.Page` 对象和一个代表页码的整数。在 `MainActivity.java`\
  \ 文件中，该方法现在应如下所示实现：\n\n```java\npackage com.ebookfrenzy.customprint;\n\n.\n\n.\n\
  \nimport android.graphics.Canvas;\n\nimport android.graphics.Color;\n\nimport android.graphics.Paint;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n.\n\n.\n\n    public\
  \ static class MyPrintDocumentAdapter extends\n\n                              \
  \       PrintDocumentAdapter\n\n{\n.\n\n.\n\n            private void drawPage(PdfDocument.Page\
  \ page,\n                                 int pagenumber) {\n                  Canvas\
  \ canvas = page.getCanvas();\n                  pagenumber++; // 确保页码从 1 开始\n\n\
  \            int titleBaseLine = 72;\n                  int leftMargin = 54;\n \
  \                 Paint paint = new Paint();\n                  paint.setColor(Color.BLACK);\n\
  \                  paint.setTextSize(40);\n                  canvas.drawText(\n\
  \                      \"Test Print Document Page \" + pagenumber,\n           \
  \                                                  leftMargin,\n               \
  \                                              titleBaseLine,\n                \
  \                                             paint);\n            paint.setTextSize(14);\n\
  \                  canvas.drawText(\"This is some test content to verify that custom\
  \ document printing works\", leftMargin, titleBaseLine + 35, paint);\n         \
  \         if (pagenumber % 2 == 0)\n                    paint.setColor(Color.RED)\
  \ \n                  else\n                    paint.setColor(Color.GREEN) \n \
  \                 PageInfo pageInfo = page.getInfo();\n                  canvas.drawCircle(pageInfo.getPageWidth()/2,\n\
  \                                     pageInfo.getPageHeight()/2,\n            \
  \                         150,\n                                     paint);\n \
  \           }\n.\n}\n```\n\n代码中的页码从 `0` 开始。由于文档传统上从 `1` 开始，该方法的第一步是增加存储的页码。然后获取与页面相关的\
  \ `Canvas` 对象的引用，并声明一些边距和基线：\n\n```java\nCanvas canvas = page.getCanvas();\npagenumber++;\n\
  int titleBaseLine = 72;\nint leftMargin = 54;\n```\n\n接下来，代码创建了用于绘制的 `Paint` 和 `Color`\
  \ 对象，设置字体大小并绘制页面标题，包括当前的页码：\n\n```java\nPaint paint = new Paint();\npaint.setColor(Color.BLACK);\n\
  paint.setTextSize(40);\ncanvas.drawText(\"Test Print Document Page \" + pagenumber,\n\
  \                               leftMargin,\n                               titleBaseLine,\n\
  \                               paint);\n```\n\n然后减小字体大小并在标题下方绘制一些正文：\n\n```java\n\
  paint.setTextSize(14);\ncanvas.drawText(\"This is some test content to verify that\
  \ custom document printing works\", leftMargin, titleBaseLine + 35, paint);\n```\n\
  \n该方法执行的最后一个任务是绘制一个圆（偶数页为红色，奇数页为绿色）。在确定页面是奇还是偶数后，该方法获取页的高度和宽度，然后使用这些信息将圆置在页面中心：\n\
  \n```java\nif (pagenumber % 2 == 0)\n    paint.setColor(Color.RED);\nelse\n    paint.setColor(Color.GREEN);\n\
  PageInfo pageInfo = page.getInfo();\ncanvas.drawCircle(pageInfo.getPageWidth()/2,\n\
  \                  pageInfo.getPageHeight()/2,\n                  150, paint);\n\
  ```\n\n在画布上绘制完成后，该方法将控制权交回给 `onWrite()` 方法。\n\n### 78.8 启动打印任务\n\n当用户点击“Document”按钮时，将调用\
  \ `printDocument()` 事件处理器。在开始测试之前，剩下的工作是将此方法添加到 `MainActivity.java` 中，特别注意确保将其放置在\
  \ `PrintDocumentAdapter` 类之外：\n\n```java\npackage com.ebookfrenzy.customprint;\n\
  ... imports ...\n\npublic class MainActivity extends AppCompatActivity {\n\n   \
  \ public void printDocument(View view) {\n        PrintManager printManager = (PrintManager)\
  \ this.getSystemService(Context.PRINT_SERVICE);\n        String jobName = this.getString(R.string.app_name)\
  \ + \" Document\";\n        printManager.print(jobName, new MyPrintDocumentAdapter(this),\
  \ null);\n    }\n}\n```\n\n### 78.9 测试应用程序\n\n在运行 Android 4 或更高版本的 Android 设备或模拟器上编译并运行该应用程序。当应用程序加载后，点击\
  \ Document 按钮启动打印任务，并为输出选择合适的目标（“保存为 PDF”选项是避免纸张和打印机墨水的有用选项）。\n\n检查打印输出，它应该包含四页的文本和图形。例如，图\
  \ 78-3 显示了作为准备保存的 PDF 文件查看的文档四页。尝试其他的打印配置选项，例如更改打印面板中的纸张大小、方向和页面设置。每项设置更改都应反映在打印输出中，表明自定义文档适配器正在正常工作。\n\
  \n![](img/as_4.1_custom_print_running.jpg)\n\n图 78-3\n\n### 78.10 总结\n\n虽然自定义文档打印比\
  \ Android 打印框架的 HTML 和图像打印选项复杂，但它为从 Android 内部打印复杂内容提供了极大的灵活性。实现自定义文档打印的大部分工作涉及创建一个自定义打印适配器类，使其不仅能在文档页面上绘制内容，还能在用户更改纸张大小和页面范围等打印设置时做出正确响应。\n\
  \n### 79. Android App Links 简介\n\n随着技术的发展，网页和移动内容之间的传统区别开始变得模糊。这种情况在渐进式 Web 应用日益流行的领域尤为突出，这种应用在外观和行为上类似于传统的移动应用。\n\
  \n另一个趋势是让移动应用中的内容可以通过网页搜索和 URL 链接被发现。在 Android 应用开发背景下，App Links 功能专门设计用于让用户即使没有安装应用程序，也能更容易发现并访问存储在\
  \ Android 应用中的内容。\n\n## 79.1 Android App Links 概述\n\n\n\n\n\n应用链接（App link）是一种标准的\
  \ HTTP URL，旨在提供从网站或应用等外部源直接链接到应用内特定位置的便捷方式。应用链接（也称为深度链接，deep links）主要用于鼓励用户与应用交互，并允许用户分享应用内容。\n\
  \n应用链接的实现是一个多步骤过程，涉及在项目清单（manifest）中添加意图过滤器（intent filters）、在关联的应用活动（activities）中实现链接处理代码，以及使用数字资产链接文件（digital\
  \ asset links files）来将应用与网页内容关联。\n\n这些步骤既可以通过在项目内进行更改来手动完成，也可以使用 Android Studio\
  \ 应用链接助手（App Links Assistant）自动完成。\n\n本章的剩余部分将从需要对项目进行的更改的角度，概述应用链接的实现。下一章（“Android\
  \ Studio 应用链接教程”）将将如何如何使用应用链接助手来实现相同的效果。\n\n## 79.2 App Link 意图过滤器\n\n应用链接 URL 需要映射到应用项目中的特定活动。这是通过向项目的\
  \ `AndroidManifest.xml` 文件中添加意图过滤器来实现的，这些过滤器设计用于响应 `android.intent.action.VIEW`\
  \ 动作并启动活动。意图过滤器声明在要启动的活动元素内，并且包含概述应用链接 URL 的方案（scheme）、主机（host）和路径（path）的数据。例如，下面的清单片段声明了一个意图过滤器，当检测到匹配\
  \ `http://www.example.com/welcome` 的应用链接时启动名为 `MyActivity` 的活动：\n\n```xml\n<activity\
  \ android:name=\"com.ebookfrenzy.myapp.MyActivity\">\n    <intent-filter android:autoVerify=\"\
  true\">\n        <action android:name=\"android.intent.action.VIEW\" />\n      \
  \  <category android:name=\"android.intent.category.DEFAULT\" />\n        <category\
  \ android:name=\"android.intent.category.BROWSABLE\" />\n        <data\n       \
  \     android:scheme=\"http\"\n            android:host=\"www.example.com\"\n  \
  \          android:pathPrefix=\"/welcome\" />\n    </intent-filter>\n</activity>\n\
  ```\n\n处理歧义意图过滤器的顺序可以使用意图过滤器标签的 `order` 属性进行指定，如下所示：\n\n```xml\n<application>\n\
  \    <activity android:name=\" com.ebookfrenzy.myapp.MyActivity\">\n        <intent-filter\
  \ android:autoVerify=\"true\" android:order=\"1\">\n....\n```\n\n意图过滤器将导致应用链接启动正确的活动，但仍需要在目标活动内部实现代码以适当处理该意图。\n\
  \n## 79.3 处理 App Link 意图\n\n在大多数情况下，启动的活动需要获取应用链接 URL 的权限，并根据 URL 的结构采取特定操作。延续上面的示例，当活动通过包含\
  \ `/welcome/newuser` 路径的 URL 启动时，其显示的内容可能与路径设置为 `/welcome/existinguser` 的 URL 启动时不同。\n\
  \n当活动通过链接启动时，它会接收到的一个 `intent` 对象，该对象包含了启动活动的动作数据，包括一个包含应用链接 URL 的 `Uri` 对象。在活动的初始化阶段，可以添加代码按如下方式提取这些数据：\n\
  \n```java\nIntent appLinkIntent = getIntent();\nString appLinkAction = appLinkIntent.getAction();\n\
  Uri appLinkData = appLinkIntent.getData();\n```\n\n获取应用链接的 `Uri` 后，可以使用构成 URL 路径的各种组件对在活动内要执行的操作做出决策。在下面的代码示例中，使用\
  \ URL 的最后一个组件来识别是否应为新用户或现有用户显示内容：\n\n```java\nString userType = appLinkData.getLastPathSegment();\n\
  if (userType.equals(\"newuser\")) {\n    // 显示新用户内容\n} else {\n    // 显示现有用户内容\n\
  }\n```\n\n## 79.4 将应用与网站关联\n\n在应用链接生效之前，应用链接 URL 需要与该应用链接所在的网站进行关联。这是通过创建一个名为 `assetlinks.json`\
  \ 的数字资产链接文件并将其安装在网站的 `.well-known` 文件夹内实现的。注意，数字资产链接仅适用于基于 https 的网站。\n\n数字资产链接文件包含一个关系声明（relation\
  \ statement），用于授权目标应用使用网站的链接 URL 启动，以及一个目标声明（target statement），声明该项目的配套应用包名和 SHA-256\
  \ 证书指纹。例如，一个典型的链接文件内容可能如下：\n\n```json\n[{\n    \"relation\": [\"delegate_permission/common.handle_all_urls\"\
  ],\n    \"target\" : { \"namespace\": \"android_app\",\n      \"package_name\":\
  \ \"<app package name here>\",\n      \"sha256_cert_fingerprints\": [\"<app certificate\
  \ here>\"] }\n}]\n```\n\n`assetlinks.json` 文件可以包含多个数字资产链接，可能允许单个网站与多个配套应用关联。\n\n\
  ## 79.5 总结\n\nAndroid App Links 允许通过来自外部网站和其他应用的 URL 链接来启动应用活动。应用链接的实现结合了项目清单文件中的意图过滤器和启动活动中的意图处理代码。此外，通过使用数字资产链接文件，可以将应用链接中使用的域名与相应的网站关联。一旦建立关联，在使用应用链接时，Android\
  \ 不再需要用户选择目标应用。\n\n## 80. Android Studio 应用链接教程\n\n本章的目标是提供应用链接和 Android Studio\
  \ 应用链接助手的实用演示。\n\n本章将为现有的 Android 应用添加链接支持，允许通过 URL 活动。除了启动活动外，显示的内容将路径指定。\n\n###\
  \ 80.1 关于示例应用\n\n本章使用的项目名为 `AppLink`，是一个旨在让用户查询地标信息的基础应用。该应用通过标准内容提供者（content provider）访问\
  \ SQLite 数据库。应用提供了一些关于伦敦旅游景点的现有记录。除了提供的数据库条目外，应用还允许用户添加和删除地标描述。\n\n在目前的形式下，应用允许对现有记录进行搜索。\n\
  \n项目由两个活动组成，分别是 `AppLinkActivity` 和 `LandmarkActivity`。`AppLinkActivity` 是启动时启动的主活动。该活动允许用户输入搜索标准并向数据库添加新记录。当搜索找到匹配记录时，会启动\
  \ `LandmarkActivity` 显示相关信息。\n\n本章的目标增强增强应用添加链接支持，可以使用 URL 在应用内显示特定的地标记录。\n\n###\
  \ 80.2 数据库架构\n\n应用的数据包含在名为 `landmarks.db` 的文件中，位于项目层级的 app -> assets -> databases\
  \ 文件夹。数据库包含一个名为 `locations` 的表，其结构如表 80-1](#App_Links_Tutorial.xhtml__idTextAnchor1505）所示：\n\
  \n| 列名 | 类型 | 描述 |\n| :--- | :--- | :--- |\n| _id | String | 主索引，此列包含唯一标识数据库中地标的字符串值。\
  \ |\n| title | String | 地标名称（例如：伦敦桥）。 |\n| description | String | 地标的描述。 |\n| personal\
  \ | Boolean | 表示记录是私人的还是公共的。用户添加的所有记录此值值均设置为 true。数据库提供的现有记录设置为 false。 |\n\n表 80-1\n\
  \n\n\n\n\n# 80.3 加载并运行项目\n\n项目包含在示例源码下载包的 `AppLinking` 文件夹中，下载地址如下：\n\n[`www.ebookfrenzy.com/retail/chipmunkjava/index.php`](https://www.ebookfrenzy.com/retail/chipmunkjava/index.php)\n\
  \n找到文件夹后，在 Android Studio 中打开它，并在设备或模拟器上运行应用。一旦应用启动，将显示下方图 80-1 所示的屏幕：\n\n![](img/as_applinking_ui_home.jpg)\n\
  \n图 80-1\n\n按照目前的实现，地标是通过位置 ID 进行定位的。默认数据库配置目前包含由 ID `londonbridge` 和 `toweroflondon`\
  \ 引用的两条记录。在 ID 字段中输入 `londonbridge` 并点击 Find 按钮，即可测试搜索功能。当找到匹配的记录时，将启动第二个 Activity（`LandmarkActivity`）并传递有关要显示记录的信息。这些信息以添加到\
  \ `Intent` 对象中的额外数据的形式存在。`LandmarkActivity` 使用这些信息从数据库中提取记录，并使用图 80-2 所示的屏幕显示给用户。\n\
  \n![](img/as_applinking_ui_london_bridge.jpg)\n\n图 80-2\n\n# 80.4 添加 URL 映射\n\n\
  现在应用已加载到 Android Studio 并通过测试，项目已准备好添加应用链接（app link）支持。目标是让 `LandmarkActivity` 屏幕响应应用链接点击并启动并显示信息。这是通过将\
  \ URL 映射到 `LandmarkActivity` 实现的。在本示例，URL 的格式如下：\n\n`http://<website domain>/landmarks/<landmarkId>`\n\
  \n完成所有步骤后，对应的 URL 使应用显示伦敦塔的信息：\n\n`http://www.yourdomain.com/landmarks/toweroflondon`\n\
  \n要向项目添加 URL 映射，首先通过 `Tools -> App Links Assistant` 菜单打开 App Links 助手。打开后，助手将如图\
  \ 80-3 所示：\n\n![](img/as_4.1_app_links_assistant.jpg)\n\n图 80-3\n\n点击 `Open URL\
  \ Mapping Editor` 按钮开始将 URL 映射到 Activity。在映射屏幕中，点击 `+` 按钮（图 80-4 高亮显示）添加新 URL：\n\
  \n![](img/Image2473.jpg)\n\n图 80-4\n\n在 Add URL Mapping 对话框的 `Host` 字段中，输入你自己的网站的\
  \ URL。如果你没有供本教程使用的自己的网站，仍然可以使用 `http://www.example.com` 遵循本章的大部分内容，但无法测试需要存在 Digital\
  \ Asset Links 文件的功能。\n\n`Path` 字段（见下方图 80-5 中的标记为 A）是声明 URL 路径组件的地方。路径必须以 `/` 开头，因此在此字段中输入\
  \ `/landmarks`。\n\n`Path` 菜单 (B) 提供了三种路径匹配选项：\n\n- `path` – URL 必须与 URL 的路径组件完全匹配才能启动\
  \ Activity。例如，如果路径设置为 `/landmarks`，则 `http://www.example.com/landmarks` 将被视为匹配。然而，`http://www.example.com/landmarks/londonbridge`\
  \ URL 则不被视为匹配。\n- `pathPrefix` – 指定的路径仅被视为前缀。在 `/landmarks` 组件之后可以包含额外的路径组件（例如 `http://www.example.com/landmarks/londonbridge`\
  \ 仍被视为匹配）。\n- `pathPattern` – 允许使用基本正则表达式和通配符形式的模式匹配来指定路径，例如 `landmarks/*/[l-L]ondon/*`\n\
  \n由于此示例中的路径是地标 ID 组件的前缀，请选择 `pathPrefix` 菜单选项。\n\n最后，使用 `Activity` 菜单 (C) 选择 `LandmarkActivity`\
  \ 作为响应应用链接启动的 Activity：\n\n![](img/Image24811.jpg)\n\n图 80-5\n\n完成对话框中的设置后，点击 `OK`\
  \ 按钮提交更改。通过在映射屏幕的 `Check URL Mapping` 字段中输入以下 URL（其中 `<your domain>` 设置为上方 `Host`\
  \ 字段中指定的域名），检查 URL 格式是否正确并已分配给相应的 Activity：\n\n`http://<your domain>/landmarks/toweroflondon`\n\
  \n如果配置正确，`LandmarkActivity` 将被列为映射的 Activity：\n\n![](img/Image2489.jpg)\n\n图 80-6\n\
  \n最新版本的 Android 要求 App Links 必须同时为 HTTP 和 HTTPS 协议声明，即使只使用了其中一种。因此，在进行下一步之前，重复上述步骤将\
  \ HTTPS 版本的 URL 添加列表中。\n\n下一步也将在 App Links 助手的 URL 映射屏幕中执行，因此保持该屏幕选中状态。\n\n# 80.5\
  \ 添加 Intent Filter\n\n如上一章所述，需要一个意图过滤器（intent filter）来允许目标 Activity 响应应用链接点击启动。事实上，当添加\
  \ URL 映射时，意图过滤器已自动添加到项目中。在 App Links 助手选中 URL 映射的情况下，向下滚动屏幕直到意图过滤器进入视野。预览应包含 `AndroidManifest.xml`\
  \ 文件：\n\n![](img/Image2496.jpg)\n\n图 80-7\n\n虽然 App Links 添加意图过滤器，但可能没有包含处理应用链接所需的\
  \ `autoVerify` 设置。打开 `AndroidManifest.xml` 文件并向意图过滤器添加此设置：\n\n```xml\n<intent-filter\
  \ autoVerify=\"true\">\n<data scheme=\"http\" host=\"www.example.com\" pathPrefix=\"\
  /landmarks\" />\n</intent-filter>\n<intent-filter autoVerify=\"true\">\n<data scheme=\"\
  https\" host=\"www.example.com\" pathPrefix=\"/landmarks\" />\n</intent-filter>\n\
  ```\n\n# 80.6 添加 Intent 处理代码\n\n到为止的步骤确保了响应格式正确的应用链接 URL 启动 Activity。下一步是在 `LandmarkActivity`\
  \ 类中处理意图，以便从数据库中提取记录并显示给用户。在修改 `LandmarkActivity.java` 文件中的代码之前，查看现有代码的某些区域是有意义的。在代码编辑器中打开\
  \ `LandmarkActivity.java` 文件，并找到目前的 `onCreate()` 和 `handleIntent()` 方法：\n\n```java\n\
  @Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    binding = ActivityLandmarkBinding.inflate(getLayoutInflater());\n    View view\
  \ = binding.getRoot();\n    setContentView(view);\n    handleIntent(getIntent());\n\
  }\n\nprivate void handleIntent(Intent intent) {\n    String landmarkId = intent.getStringExtra(AppLinkingActivity.LANDMARK_ID);\n\
  \    displayLandmark(landmarkId);\n}\n```\n\n目前，代码期望在 `Intent` 数据包中查找地标 ID。由于 Activity\
  \ 现在也可以通过应用链接启动，因此代码需要更改以处理这两种情况。首先删除 `onCreate()` 方法中对 `handleIntent()` 的调用：\n\n\
  ```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    binding = ActivityLandmarkBinding.inflate(getLayoutInflater());\n    View view\
  \ = binding.getRoot();\n    setContentView(view);\n    // handleIntent(getIntent());\n\
  }\n```\n\n\n\n\n要添加初始应用链接（App link）意图处理代码，返回 App Links 助手面板并点击步骤 2 下列出的 `Select\
  \ Activity` 按钮。在活动选择对话框中，点击 `Insert Code` 按钮之前，选择 `LandmarkActivity` 条目：\n\n![](img/Image2504.jpg)\n\
  \n图 80-8\n\n返回 `LandmarkActivity.java` 文件并注意以下代码已插入到 `onCreate()` 方法中（注意，如果 Android\
  \ Studio 无法完成此请求，你可以手动添加此代码）：\n\n```java\n// ATTENTION: This was auto-generated\
  \ to handle app links.\n\nIntent appLinkIntent = getIntent();\n\nString appLinkAction\
  \ = appLinkIntent.getAction();\n\nUri appLinkData = appLinkIntent.getData();\n```\n\
  \n这段代码访问 `Intent` 对象并提取 `Action` 字符串和 `Uri`。如果活动启动是应用链接的结果，则 action 字符串将设置为 `android.intent.action.VIEW`，这与添加到清单文件（manifest）中的意图过滤器（intent\
  \ filter）中声明的 action 相匹配。相反，如果是通过主活动 `findLandmark()` 方法中的标准意图启动代码启动的活动，则 action\
  \ 字符串将为 null。通过检查赋值给 action 字符串的值，可以编写代码来识别活动启动的方式并采取适当的操作：\n\n```java\nimport android.net.Uri;\n\
  \n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \n    // ATTENTION: This was auto-generated to handle app links.\n    Intent appLinkIntent\
  \ = getIntent();\n    String appLinkAction = appLinkIntent.getAction();\n    Uri\
  \ appLinkData = appLinkIntent.getData();\n    String landmarkId = appLinkData.getLastPathSegment();\n\
  \    if (landmarkId != null) {\n        displayLandmark(landmarkId);\n    }\n}\n\
  ```\n\n剩下的工作是在该方法中添加一些额外代码以识别应用链接 URL 路径中的最后一个组件，并在查询数据库时将其作为地标 ID：\n\n```java\n\
  @Override\nprotected void onCreate(Bundle savedInstanceState) {\n\n    // ATTENTION:\
  \ This was auto-generated to handle app links.\n    Intent appLinkIntent = getIntent();\n\
  \    String appLinkAction = appLinkIntent.getAction();\n    Uri appLinkData = appLinkIntent.getData();\n\
  \    if (appLinkAction != null) {\n        if (appLinkAction.equals(\"android.intent.action.VIEW\"\
  )) {\n            String landmarkId = appLinkData.getLastPathSegment();\n      \
  \      if (landmarkId != null) {\n                displayLandmark(landmarkId);\n\
  \            }\n        }\n    } else {\n        handleIntent(appLinkIntent);\n\
  \    }\n}\n```\n\n如果 action 字符串不为空，则会检查其是否被设置为 `android.intent.action.VIEW`，然后提取\
  \ `Uri` 路径的最后一个组件。该组件随后被用作进行数据库查询时的地标 ID。相反，如果 action 字符串为 null，则调用现有的 `handleIntent()`\
  \ 方法从意图数据中提取 ID。\n\n## 80.7 测试应用\n\n在设备或模拟器上运行应用，确保仍然可以搜索示例地标。我们现在已成功为应用添加了应用链接支持。如果你为应用链接指定了了自己的网站\
  \ URL，我们现在可以通过创建并安装数字资产链接文件（Digital Asset Links file）来更进一步进行示例。\n\n## 80.8 创建数字资产链接文件\n\
  \n正如“Android 意图概述”章节所述，为了完全支持应用链接，我们需要在应用链接引用的网站上安装数字资产链接文件。首先按照“Android 意图概述”中列出的步骤找到你的\
  \ `debug.keystore` 文件并识别你的 `SHA256` 指纹。\n\n接下来，在网络浏览器中打开以下页面：\n\n`https://developers.google.com/digital-asset-links/tools/generator`\n\
  \n页面加载后，将你的网站 URL 输入到 Hosting site domain 字段，将 `com.ebookfrenzy.applinking` 输入到\
  \ App package name 字段，并将你的 `SHA256` 指纹输入到 App package fingerprint (SHA256) 字段：\n\
  \n![](img/asset_file_generator.jpg)\n\n图 80-9\n\n点击 `Generate` 按钮显示生成的语句，并将其放在 Web\
  \ 服务器上名为 `.well-known` 的文件夹中。返回生成页面并点击 `Test` 按钮。当提示输入测试 URL 时，输入该 URL（使用应用链接中引用的域名）：\n\
  \n![](img/2513.jpg)\n\n图 80-10\n\n假设测试成功，我们现在准备好尝试应用链接了。\n\n## 80.10 总结\n\n本章演示在\
  \ Android 项目中实现应用链接支持的步骤。本章涵盖的内容包括在 Android Studio 中使用 App Link 助手、应用链接映射、意图过滤器、使用数字资产链接文件处理网站关联以及应用链接测试。\n\
  \n## 81 生物识别认证教程\n\n许多 Android 设备现在已内置触控传感器，用以识别用户并提供功能访问权限。指纹识别当然是多种不同认证方法之一，还包括密码、PIN\
  \ 码以及最近的面部识别。\n\n尽管目前市场上只有少数 Android 设备提供面部识别，但很可能在不久的将来变得更加常见。为了此此，Google 已开始从以指纹为中心的应用认证方法转向一种不具特定性的方法，称为生物识别认证。在\
  \ Android 8 的初始版本中，这些生物识别功能仅涵盖指纹认证，但随着 Android 操作系统和 SDK 的未来发布和更新，这将发生变化。\n\n##\
  \ 81.1 生物识别概述\n\n生物识别认证的关键组件是 `BiometricPrompt` 类。该类执行了许多在早期 Android 版本中通过编写代码完成的工作，包括显示标准对话框引导用户完成认证过程、执行认证并将结果报告给应用。该类还处理了多次认证失败的情况，并在用户再次尝试之前强制超时。\n\
  \n`BiometricPrompt` 类包含一个伴侣类 `Builder`，用于配置和创建 `BiometricPrompt` 实例，包括定义在生物识别认证对话框中文本以及对对话框中出现的取消按钮（也称为负按钮）进行自定义。\n\
  \n`BiometricPrompt` 实例还分配了一组认证回调，这些回调将被调用以向应用提供认证操作的结果。`CancellationSignal` 实例允许应用在认证进行期间将其取消。\n\
  \n\n\n\n\n在涵盖了这些基础后，本章的剩余部分将在一个示例项目中实现基于指纹的生物识别认证。\n\n## 81.2 创建生物识别认证项目\n\n从欢迎界面选择\
  \ `New Project`（新建项目）选项，在弹出的新项目对话框中，点击 `Next`（下一步）按钮之前选择 `Empty Activity`（空活动）模板。\n\
  \n在`Name`字段中输入 `BiometricDemo`，并指定 `com.ebookfrenzy.biometricdemo` 为包名。在点击 `Finish`（完成）按钮之前，将\
  \ `Minimum API level` 设置为 `API 29: Android 9.0 (Pie)`，并将 `Language`菜单设置为 `Java`。\n\
  \n## 81.3 配置设备指纹认证\n\n指纹认证仅适用于包含触摸传感器的设备，并且这些设备已采取了适当的配置步骤来保护设备并注册了至少一个指纹。有关配置模拟器会话以测试指纹认证的步骤，请参阅标题为使用和配置\
  \ Android Studio AVD 模拟器”的章节。\n\n要在物理设备上配置指纹认证，首先打开`Settings`（设置）应用并选择`Security`（安全）选项。在安全设置屏幕内，选择`Fingerprint`（指纹）选项。在弹出的信息屏幕上，点击`Next`按钮进入指纹设置屏幕。在启用指纹安全功能之前，必须配置一种备用的锁屏解锁方法（例如\
  \ PIN 码）。如果锁屏尚未加密，请按照步骤配置 `PIN`、`pattern`（图案）或 `password`（密码）安全。\n\n锁屏加密后，继续进入指纹检测屏幕，并在提示时触摸传感器（图\
  \ 81-1），如有需要重复此过程以添加额外的指纹。\n\n![](img/Image24256.jpg)\n图 81-1\n\n## 81.4 在清单文件中添加生物识别权限\n\
  \n生物识别认证要求应用在项目清单文件中请求 `USE_BIOMETRIC` 权限。在 Android Studio 项目工具窗口中找到并编辑 `app ->\
  \ manifests -> AndroidManifest.xml` 文件，按照如下方式添加权限请求：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.biometricdemo\">\n    <uses-permission\n       \
  \ android:name=\"android.permission.USE_BIOMETRIC\" />\n```\n\n## 81.5 设计用户界面\n\n\
  为了保持示例尽可能简单，用户界面中的视觉元素元素是一个 `Button`（按钮）视图。找到并选择 `activity_main.xml` 布局资源文件，将其加载到`Layout\
  \ Editor`（布局编辑器）工具中。\n\n删除示例 `TextView` 对象，从调色板的`Common`类别中拖入 `Button` 对象并放置在布局画布的中心。使用`Attributes`（属性）工具窗口，将按钮的`text`属性更改为“Authenticate”，并将字符串提取到资源中。最后，配置`onClick`\
  \ 属性以调用名为 `authenticateUser` 的方法。\n\n完成上述步骤后，布局应与图 81-2 所示所示：\n\n![](img/as_4.1_biometric_demo_ui.jpg)\n\
  图 81-2\n\n## 81.6 添加一个 Toast 便利方法\n\n在示例代码的各个位置，应用将被设计为通过 `Toast` 消息向用户显示信息。为了避免多次重复相同的\
  \ `Toast` 代码，将在主活动中添加一个名为 `notifyUser()` 的便利方法。该方法将接受单个 `String` 值，并以 `Toast` 消息的形式显示给用户。现在编辑\
  \ `MainActivity.java` 文件并如下所示添加此方法：\n\n```java\nimport android.widget.Toast;\n\n\
  private void notifyUser(String message) {\n    Toast.makeText(this,\n          \
  \        message,\n                  Toast.LENGTH_LONG).show();\n}\n```\n\n## 81.7\
  \ 检查安全设置\n\n在本章前面的部分，已采取了步骤在要测试应用的设备或模拟器上配置了锁屏并注册指纹。然而，重要的是要在应用中包含防御性代码，以确保在尝试请求指纹认证之前已满足这些要求。这些步骤将在\
  \ `MainActivity.java` 文件中的 `onCreate` 方法中执行，并利用 `Keyguard` 和 `PackageManager` 管理服务。请注意，还添加了代码来验证是否已为应用配置了\
  \ `USE_BIOMETRIC` 权限：\n\n```java\npackage com.ebookfrenzy.biometricdemo;\n\nimport\
  \ androidx.appcompat.app.AppCompatActivity;\nimport androidx.core.app.ActivityCompat;\n\
  import android.widget.Toast;\nimport android.Manifest;\nimport android.content.pm.PackageManager;\n\
  import android.app.KeyguardManager;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_biometric_demo);\n\
  \        checkBiometricSupport();\n    }\n\n    private Boolean checkBiometricSupport()\
  \ {\n        KeyguardManager keyguardManager = (KeyguardManager) getSystemService(KEYGUARD_SERVICE);\n\
  \        PackageManager packageManager = this.getPackageManager();\n        if (!keyguardManager.isKeyguardSecure())\
  \ {\n            notifyUser(\"Lock security not enabled\");\n            return\
  \ false;\n        }\n        if (ActivityCompat.checkSelfPermission(this, Manifest.permission.USE_BIOMETRIC)\
  \ != PackageManager.PERMISSION_GRANTED) {\n            notifyUser(\"Finger authentication\
  \ permission not enabled\");\n            return false;\n        }\n        if (packageManager.hasSystemFeature(PackageManager.FEATURE_FINGERPRINT))\
  \ {\n            return true;\n        }\n        return true;\n    }\n}\n```\n\n\
  上述代码通过使用 `Keyguard` 管理器验证是否配置了备用的锁屏解锁方法（也就是说，可以使用 PIN 或其他方法作为指纹认证的替代方案解锁屏幕）。如果锁屏未加密，代码将向用户报告问题并退出方法。在使用包管理器验证指纹认证可用之前，该方法会检查用户是否已启用生物识别权限。\n\
  \n## 81.8 配置认证回调\n\n在配置生物识别对话框时，需要为其分配一组认证回调方法，这些方法可以通知应用认证过程的成功或失败。这些方法需要封装在 `BiometricPrompt.AuthenticationCallback`\
  \ 实例中。留在 `MainActivity.java` 文件中，添加一个方法来创建并返回该类的实例并实现相应的方法：\n\n```java\nimport android.hardware.biometrics.BiometricPrompt;\n\
  \nprivate BiometricPrompt.AuthenticationCallback getAuthenticationCallback() {\n\
  \    return new BiometricPrompt.AuthenticationCallback() {\n        @Override\n\
  \        public void onAuthenticationError(int errorCode, CharSequence errString)\
  \ {\n            notifyUser(\"Authentication error: \" + errString);\n         \
  \   super.onAuthenticationError(errorCode, errString);\n        }\n        @Override\n\
  \        public void onAuthenticationHelp(int helpCode, CharSequence helpString)\
  \ {\n            super.onAuthenticationHelp(helpCode, helpString);\n        }\n\
  \        @Override\n        public void onAuthenticationFailed() {\n           \
  \ super.onAuthenticationFailed();\n        }\n    };\n}\n```\n\n\n\n\n\n```java\n\
  public void onAuthenticationSucceeded(\n    BiometricPrompt.AuthenticationResult\
  \ result) {\n    notifyUser(\"Authentication Succeeded\");\n    super.onAuthenticationSucceeded(result);\n\
  };\n```\n\n### 81.9 添加取消信号 (CancellationSignal)\n\n一旦启动，生物识别身份验证过程将独立于应用程序运行。为了应用程序提供取消操作的方法，可以创建一个\
  \ `CancellationSignal` 类的实例并将其传递给生物识别身份验证过程。随后可以使用此 `CancellationSignal` 实例在需要时取消过程。取消信号实例可以配置一个监听器，该监听器会在取消完成后被调用。在活动类中添加一个新方法来配置并返回\
  \ `CancellationSignal` 对象，如下：\n\n```java\nimport android.os.CancellationSignal;\n\
  \nprivate CancellationSignal cancellationSignal;\n\nprivate CancellationSignal getCancellationSignal()\
  \ {\n    cancellationSignal = new CancellationSignal();\n    cancellationSignal.setOnCancelListener(new\n\
  \        CancellationSignal.OnCancelListener() {\n        @Override\n        public\
  \ void onCancel() {\n            notifyUser(\"Cancelled via signal\");\n       \
  \ }\n    });\n    return cancellationSignal;\n}\n```\n\n### 81.10 启动生物识别提示 (Biometric\
  \ Prompt)\n\n剩下的只需要在 `authenticateUser()` 方法中添加代码，创建并配置 `BiometricPrompt` 实例并启动验证。所示添加\
  \ `authenticateUser()` 方法：\n\n```java\nimport android.view.View;\nimport android.content.DialogInterface;\n\
  \npublic void authenticateUser(View view) {\n    BiometricPrompt biometricPrompt\
  \ = new BiometricPrompt.Builder(this)\n            .setTitle(\"Biometric Demo\"\
  )\n            .setSubtitle(\"Authentication is required to continue\")\n      \
  \      .setDescription(\"This app uses biometric authentication to protect your\
  \ data.\")\n            .setNegativeButton(\"Cancel\", this.getMainExecutor(),\n\
  new DialogInterface.OnClickListener() {\n                @Override\n           \
  \     public void onClick(DialogInterface dialogInterface, int i) {\n          \
  \          notifyUser(\"Authentication cancelled\");\n                }\n      \
  \      })\n            .build();\n    biometricPrompt.authenticate(getCancellationSignal(),\
  \ getMainExecutor(),\n        getAuthenticationCallback());\n}\n```\n\n`BiometricPrompt.Builder`\
  \ 类用于创建一个配置了 `title`、`subtitle` 和 `description` 的 `BiometricPrompt` 实例。`setNegativeButton`\
  \ 方法配置了 `Cancel` 文本和一个监听器。调用 `authenticate()` 方法时传递了 `getCancellationSignal()`、`getMainExecutor()`\
  \ 和 `getAuthenticationCallback()`。\n\n## 81.11 测试项目\n\n项目完成后，在物理设备或模拟器上运行应用程序，以测试生物识别身份验证，如图\
  \ 81-3 所示。要测试错误处理，请使用模拟器模拟失败。提示对话框将指示显示：\n\n`Authentication error: failed`\n\n通过点击\
  \ `Cancel` 按钮验证错误处理是否正常工作。提示对话框将消失并显示。最后，尝试使用未注册的指纹多次身份验证，并注意在尝试几次后提示对话框指示：\n\n\
  ## 81.12 总结\n\n本章概述了如何将生物识别身份验证集成到 Android 项目中。这涉及到 `BiometricPrompt` 类的使用，它一旦配置了消息文本，就会自动处理大部分过程。\n\
  \n### 82 创建、测试和上传 Android App 包 (Android Bundle)\n\n一旦完成 Android 应用程序的开发工作，并在各种\
  \ Android 设备上通过了测试，下一步是准备应用程序提交到 Google Play。\n\n#### 82.1 发布准备流程\n\n在本书的目前为止，我们一直是以适用于测试和调试的模式构建应用程序项目。另一方面，为了通过\
  \ Google Play 向客户发布应用程序包，需要采取一些额外的步骤。第一个要求是应用程序必须以发布模式而非调试模式编译。其次，应用程序必须使用私钥进行签名，该密钥将唯一标识您作为应用程序的开发者。最后，应用程序必须打包成\
  \ Android App Bundle。\n\n虽然这些任务中的每一个都 Android Studio 环境之外执行，但使用本章其余部分概述的 Android\
  \ Studio 构建机制可以更方便地完成这些操作。然而，进一步了解一下 Android App Bundles 是重要的。\n\n#### 82.2 Android\
  \ App Bundles\n\n当用户从 Google Play 安装应用时，应用以 APK 文件的形式下载。该文件包含了在用户设备上安装和运行应用所需的所有内容。在\
  \ Android Studio 3.2 引入之前，开发者会使用 Android Studio 生成一个或多个 APK 文件并将其上传到 Google Play。为了支持多种设备类型、屏幕尺寸和语言，这需要为每个目标设备和语言创建并上传多个自定义的\
  \ APK 文件，或者生成一个包含所有不同配置资源和平台二进制的大型通用 APK。\n\n\n\n\n通用 APK 选项虽然减轻了开发者的负担，但导致了一个完全出乎意料的问题。通过分析应用安装指标，Google\
  \ 发现安装 APK 文件越大（导致下载时间变长和设备存储占用增加），应用收到的转化率就越低。转化率的计算方式为：在 Google Play 上查看该应用后完成安装的用户所占的百分比。事实上，Google\
  \ 估计 APK 文件大小每增加 6MB，应用的转化率就会下降 1%。\n\nAndroid App Bundles（Android 应用包）通过提供一种方式解决了这两个问题：它允许开发者在\
  \ Android Studio 内部创建一个单一包，并让 Google Play 为每个单独支持的配置自动生成自定义的 APK 文件（这一概念被称为“动态交付”，Dynamic\
  \ Delivery）。\n\nAndroid App Bundle 本质上是一个 ZIP 文件，包含了为应用项目内已支持的设备和语言区域构建 APK 文件所需的所有文件。例如，项目可能包含针对不同屏幕尺寸的资源和图像。当用户安装应用时，Google\
  \ Play 会收到有关用户设备的信息，包括显示器、处理器架构和语言。使用这些信息，将预先生成的适当 APK 文件传输到用户的设备上。\n\n动态交付的另一个额外益处是将应用拆分为多个模块（称为动态功能模块），每个模块包含应用内特定功能区域的代码和资源。每个动态功能模块都包含在与基础模块分离的\
  \ APK 文件中，并且仅在用户需要该功能时才下载到设备上。动态交付和应用包还允许创建即时动态功能模块，这些模块可以在设备上立即运行，无需安装整个应用。这些主题将在名为\"\
  Android 动态功能模块概述\"的章节中进行更详细介绍。\n\n尽管仍然可以从 Android Studio 生成 APK 文件，但应用包现在是向 Google\
  \ Play 上传应用的的推荐方式。\n\n## 82.3 注册 Google Play 开发者控制台账户\n\n提交应用的第一步是创建一个 Google Play\
  \ 开发者控制台账户。要此操作，请访问 `https://play.google.com/apps/publish/signup/` 并按照指示完成注册过程。注意，注册需要支付一次性\
  \ 25 美元的费用。一旦应用开始销售，Google 将保留与应用相关的所有收入的 30%。\n\n账户创建后，下一步是收集有关应用的信息。为了将您的应用推向市场，需要以下信息：\n\
  \n* **标题** – 应用的标题。\n* **简短描述** – 最多 80 个单词的应用描述。\n* **完整描述** – 最多 4000 个单词的应用描述。\n\
  * **截图** – 最多 8 张应用运行的截图（至少需要两个）。Google 建议提交应用在 7 英寸或 10 英寸平板电脑上运行的截图。\n* **语言**\
  \ – 应用的语言（默认为美国英语）。\n* **推广文本** – 当您的应用出现在 Google Play 环境内的特殊推广活动中时使用的文本。\n* **应用类型**\
  \ – 您的应用被视为游戏还是应用程序。\n* **类别** – 最能描述您的应用的类别（例如：金融、健康与健身、教育、体育等）。\n* **地区** – 您希望您的应用可以购买的地理位置。\n\
  * **联系详情** – 用户可以通过哪些方式与您联系以获取应用支持。选项包括网页、电子邮件和电话。\n* **定价与发布** – 关于应用价格以及要在哪些地理位置进行营销和销售的信息。\n\
  \n收集上述信息后，点击 Google Play Console 中的 `Create app`（创建应用）按钮开始创建过程。\n\n## 82.4 在控制台中配置应用\n\
  \n当首次点击 `Create app` 按钮时，将出现应用详情和声明屏幕，如下图 82-1 所示：\n\n![](img/as_4.1_play_create_app.jpg)\n\
  图 82-1\n\n一旦应用条目完全配置完成，点击 `Create app` 按钮（在上图中突出显示）以添加应用并显示仪表板屏幕。在仪表板中，找到 `Initial\
  \ setup`（初始设置）部分并展开步骤列表以配置应用商店列表：\n\n![](img/as_4.1_play_app_initial_steps.jpg)\n\
  图 82-2\n\n按照链接列表操作，并为您的应用提供所需的信息，确保在每一步都保存更改。\n\n## 82.5 启用 Google Play 应用签名\n\n\
  直到最近，Google Play 的上传是在 Android Studio 内部使用发布应用签名密钥进行签名，然后上传到 Google Play 控制台。虽然此选项仍然可用，但现在上传文件的推荐方式是使用称为“Google\
  \ Play 应用签名”的过程。对于新创建的应用，这涉及选择 Google Play 应用签名，然后生成一个在 Android Studio 内部用于签名应用包文件的上传密钥。当上传\
  \ Android Studio 生成的应用包文件时，Google Play 控制台会移除上传密钥，然后使用安全存储在 Google Play 服务器中的应用签名密钥对文件进行签名。对于现有应用，需要额外的步骤来启用\
  \ Google Play 签名，这些将在章节末尾介绍。\n\n在 Google Play 控制台中，从 `All Apps`（所有应用）屏幕（通过左侧导航面板顶部的选项访问）选择新添加的应用条目，展开\
  \ `Setup` 部分（如图 82-3 中的 A 所示），并选择 `App Signing`（B）。\n\n![](img/as_4.1_play_signing.jpg)\n\
  图 82-3\n\n点击 `Create release`（创建发布）按钮（C）启用 Google Play 应用签名。控制台现在准备好创建您的应用的第一个发布版本。在此之前，下一步是在\
  \ Android Studio 内部生成上传密钥。这是生成签名应用包过程的一部分。请保持当前 Google Play 控制台页面在浏览器中打开，我们将在稍后返回。\n\
  \n## 82.6 创建密钥库文件\n\n要创建密钥库文件，选择 Android Studio 中的 `Build -> Generate Signed Bundle\
  \ / APK…` 菜单选项，显示生成签名包或 APK 对话，如图 82-4 所示：\n\n![](img/android_studio_3.2_select_app_bundle.jpg)\n\
  图 82-4\n\n在点击 `Next` 按钮之前，确认已选择 `Android App Bundle` 选项。\n\n如果您已有发布密钥库文件，请在下一个屏幕上点击\
  \ `Choose existing…` 按钮并选择该文件。如果您尚未创建密钥库文件，请点击 `Create new…` 按钮显示 `New Key Store`\
  \ 对话（图 82-5）。点击 `Key store path` 字段右侧的按钮，导航到文件系统中的合适位置，为密钥库文件命名（例如 `release.keystore.jks`），并点击\
  \ `OK` 按钮。\n\n\n\n\n“新建密钥库”（New Key Store）对话框分为两个部分。上半部分与密钥库文件有关。在此部分中，请在 `Password`（密码）和\
  \ `Confirm`（确认）字段中输入一个强密码来保护密钥库文件。对话框的下半部分与存储在密钥库文件中的上传密钥有关。\n\n![](img/Image2483.jpg)\n\
  \n图 82-5\n\n在新建密钥库对话框的 `Certificate`（证书）部分中，输入以下详细信息：\n\n*   引用密钥的别名（alias）。可以是任何字符序列，但系统仅使用前\
  \ 8 个字符。\n*   一个足够强力的密码来保护密钥。\n*   密钥的有效年数（Google 建议时长超过 25 年）。\n\n此外，必须为剩余字段中的至少一个提供信息（例如，您的姓和名，或组织名称）。\n\
  \n![](img/Image24921.jpg)\n\n图 82-6\n\n输入信息后，点击 `OK` 按钮继续创建包（bundle）。\n\n## 82.7\
  \ 创建 Android App Bundle\n\n下一步是指令 Android Studio 以发布模式构建应用程序 app bundle 文件，然后用新创建的私钥对其进行签名。此时，`Generate\
  \ Signed Bundle or APK` 对话框应仍然显示，并且密钥库路径、密码和密钥别名字段已填充信息：\n\n![](img/android_studio_3.2_keystore_info.jpg)\n\
  \n图 82-7\n\n确保 `Export Encrypted Key`（导出加密密钥）选项已启用，在假设其他设置正确的情况下，点击 `Next` 按钮进入\
  \ app bundle 生成屏幕（参见图 82-8）。在此屏幕中，检查 `Destination Folder:`（目标文件夹：）设置，以验证生成 app bundle\
  \ 文件的位置是否可以。如果倾向于其他位置，请点击文本字段右侧的按钮并导航到所需的文件系统位置。\n\n![](img/android_studio_3.2_generate_app_bundle.jpg)\n\
  \n图 82-8\n\n点击 `Finish` 按钮并等待 `Gradle` 系统构建 app bundle。构建完成后，将出现一个对话框，提供在资源资源管理器窗口中打开包含\
  \ app bundle 文件的文件夹的选项，或者将文件加载到 `APK Analyzer` 中：\n\n![](img/android_studio_3.2_app_bundle_generated.jpg)\n\
  \n图 82-9\n\n此时，应用程序已准备好提交到 Google Play。点击 `locate` 链接打开文件浏览器窗口。除非指定了其他位置，否则文件应命名为\
  \ `bundle.aab` 并位于项目文件夹的 `app/release` 子目录下。\n\n在此过程中生成的私钥应在签名和发布未来的应用程序时使用，因此应放在安全的地方并进行安全备份。\n\
  \n## 82.8 生成测试 APK 文件\n\n此阶段的一个可选步骤是从 app bundle 生成 APK 文件，并在设备或模拟器会话上安装并运行。Google\
  \ 提供了一个名为 `bundletool` 的命令行工具，专门为此目的设计，可以通过以下 URL 下载：\n\n[`github.com/google/bundletool/releases`](https://github.com/google/bundletool/releases)\n\
  \n在编写时，`bundletool` 以 `.jar` 格式提供，可以如下所示从命令行执行（注意自自本书出版以来，版本号可能已经发生变化）：\n\n```\n\
  java -jar bundletool-all-0.9.0.jar\n```\n\n运行上述命令将列出工具中所有可用选项。要从 app bundle 生成 APK\
  \ 文件，将使用 `build-apks` 选项。要生成可以安装到设备或模拟器上的 APK 文件，这些文件也需要签名。为了实现这一点，请包含 `--ks` 选项以指定在本章之前创建的密钥库文件路径，以及\
  \ `--ks-key-alias` 选项以指定生成密钥时提供的别名。\n\n最后，必须使用 `--output` 标志来指定生成 APK 文件的路径（称为 APK\
  \ Set/集合）。该文件不能已存在，并且需要具有 `.apks` 文件扩展名。将这些要求结合起来得到如下命令行（考虑到您的操作系统路径结构可能差异）：\n\n\
  ```\njava -jar bundletool-all-0.9.0.jar build-apks --bundle=/tmp/MyApps/app/release/bundle.aab\
  \ --output=/tmp/MyApks.apks --ks=/MyKeys/release.keystore.jks --ks-key-alias=MyReleaseKey\n\
  ```\n\n执行此命令时，在向指定的 APK Set 文件生成 APK 文件之前，将弹出提示请求输入密钥库密码。APK Set 文件只是一个包含从 app bundle\
  \ 生成的所有 APK 文件的 ZIP 文件。\n\n要在连接的设备或模拟器上安装适当的 APK 文件，请使用类似下面的命令：\n\n```\n\njava -jar\
  \ bundletool-all-0.9.0.jar install-apks --apks=/tmp/MyApks.apks\n```\n\n此命令将指示工具识别适用于连接设备的适当\
  \ APK 文件并安装它们，以便启动和测试应用程序。\n\n也可以从连接设备的 APK Set 中提取 APK 文件而不安装它们。此过程的第一步是按照如下方式获取连接设备的规范：\n\
  \n```bash\njava -jar bundletool-all-0.9.0.jar get-device-spec --output=/tmp/device.json\n\
  ```\n\n上述命令将生成如下的 JSON 文件：\n\n```json\n{\n  \"supportedAbis\": [\"x86\"],\n  \"\
  supportedLocales\": [\"en-US\"],\n  \"screenDensity\": 420,\n  \"sdkVersion\": 27\n\
  }\n```\n\n接下来，使用此规范从 APK Set 中提取 APK 文件：\n\n```\njava -jar bundletool-all-0.9.0.jar\
  \ extract-apks --apks=/tmp/MyApks.apks --output-dir=/tmp/nexus5 --device-spec=/tmp/device.json\n\
  ```\n\n执行后，`output-dir` 指定目录将包含正确的 APK 文件。\n\n将 Android 应用程序投放市场的下一步是提交到 Google\
  \ Play 以进行测试。\n\n## 82.9 将 App Bundle 上传到 Google Play Console\n\n返回 Google Play\
  \ Console 并在导航面板的“测试”（Testing）部分（参见图 82-10），点击“创建新发布”（Create new release）按钮（B）：\n\
  \n![](img/as_4.1_play_create_new_release.jpg)\n\n图 82-10\n\n在结果屏幕上，点击“继续”（Continue）按钮以确认使用\
  \ Google Play 签名，然后将 Android Studio 生成的 bundle 文件拖放到上传点（B）：\n\n![](img/as_4.1_play_upload_bundle.jpg)\n\
  \n图 82-11\n\n上传完成后，滚动屏幕输入发布名称和可选的发布说明。发布名称可以是帮助您识别发布版本的任何信息，用户不可见。\n\n在 app bundle\
  \ 文件上传后，Google Play 将生成所有必要的 APK 文件以便测试。APK 文件生成后，滚动到屏幕底部点击“保存”（Save）按钮。设置保存后，点击“审核发布”（Review\
  \ release）按钮。\n\n## 82.10 探索 App Bundle\n\n在审核屏幕上，点击上传包右侧的箭头，如图 82-12 所示\n\n![](img/as_4.1_play_app_bundle_review.jpg)\n\
  \n图 82-12\n\n在结果面板中，点击“探索包”（Explore bundle）链接加载 app bundle 浏览器。这提供了有关 app bundle\
  \ 支持的 API 级别、屏幕布局和平台的摘要信息：\n\n![](img/as_4.1_play_app_bundle_explorer.jpg)\n\n图\
  \ 82-13\n\n点击“转到设备目录”（Go to device catalog）链接将显示支持 APK 文件的设备：\n\n![](img/as_4.1_play_device_catalog.jpg)\n\
  \n图 82-14\n\n\n\n\n\n此时，该应用已准备好进行测试，但在控制台中设置好测试人员之前，无法发布。\n\n## 82.11 管理测试人员\n\n\
  如果应用仍处于内部测试（Internal）、Alpha 或 Beta 测试阶段，可以通过以下步骤指定授权测试人员列表：在 Google Play 控制台中选择应用，点击导航面板中的\
  \ `Internal testing`（内部测试），并选择 `Testers`（测试人员）选项卡，如图 82-15\n\n图 82-15\n\n要添加测试人员，点击\
  \ `Create email list`（创建电子邮件列表）按钮，为列表命名并手动或通过上传 `CSV` 文件指定测试用户的电子邮件地址。\n\n现在可以从屏幕复制\
  \ `Join on the web`（网页加入）URL 并提供给测试用户，以便他们接受测试邀请并下载应用。\n\n## 82.12 发布应用进行测试\n\n\
  现在已创建内部版本并添加了测试人员列表，应用已准备好发布进行测试。在内部测试界面中，选择 `Releases`（发布）选项卡，然后点击最近创建版本的 `Edit`（编辑）按钮：\n\
  \n![](img/as_4.1_play_ready_for_rollout.jpg)\n\n图 82-16\n\n在审核界面上，滚动到底部并点击 `Start\
  \ rollout to Internal testing`（开始发布到内部测试）按钮。在版本处理期间经过短时间延迟后，应用将可以供指定用户下载和测试。\n\n\
  ## 82.13 上传新的 App Bundle 版本修订\n\n为您的应用程序上传的第一个 app bundle 文件版本号始终为 `1`。如果尝试上传具有相同版本号的另一个\
  \ bundle 文件，控制台将通过以下错误信息拒绝该文件：\n\n`You need to use a different version code for\
  \ your APK because you already have one with version code 1.`\n\n要解决这个问题，需要增加嵌入到\
  \ bundle 文件中的版本号。这在项目的模块级 `build.gradle` 文件中进行，如图 82-17 中高亮所示：\n\n![](img/Image2561.jpg)\n\
  \n图 82-17\n\n默认情况下，该文件通常读取如下：\n\n```gradle\nplugins {\n    id 'com.android.application'\n\
  }\n\nandroid {\n    compileSdkVersion 31\n    defaultConfig {\n        applicationId\
  \ \"com.example.myapplication\"\n        minSdkVersion 26\n        targetSdkVersion\
  \ 31\n        versionCode 1\n        versionName \"1.0\"\n    }\n}\n```\n\n要更改版本号，只需更改\
  \ `versionCode` 旁边声明的数字。要同时更改显示给应用用户的版本名称，请更改 `versionName` 字符串。例如：\n\n```gradle\n\
  versionCode 2\nversionName \"2.0\"\n```\n\n完成这些更改后，重新构建 APK 文件并再次上传。\n\n## 82.14\
  \ 分析 App Bundle 文件\n\nAndroid Studio 提供了分析 app bundle 文件内容的能力。要分析 bundle 文件，选择 `Android\
  \ Studio Build -> Analyze APK…` 菜单选项，并导航到选择要审查的 bundle 文件。加载到工具后，将将显示有关包的原始大小和下载大小的信息，以及包的文件结构列表，如图\
  \ 82-18 所示：\n\n![](img/android_studio_3.2_bundle_analyzer.jpg)\n\n图 82-18\n\n选择\
  \ `classes.dex` 文件将在下面板中显示该文件的类结构。在此面板中，可以探索单个类的详细信息，深入到类中方法的级别：\n\n![](img/Image2583.jpg)\n\
  \n图 82-19\n\n同样，在文件列表中选择资源或图像文件将在下面板中显示文件内容。可以通过点击 `Compare with previous APK…`（与之前的\
  \ APK 比较……）按钮并选择第二个 bundle 文件来查看两个 bundle 文件之间的大小差异。\n\n## 82.15 总结\n\n一旦应用项目完成或准备好进行用户测试，即可将其上传到\
  \ Google Play 控制台并发布用于生产、内部、Alpha 或 Beta 测试。在应用应用之前，必须在控制台中创建一个应用条目，包括应用信息以及用于 Play\
  \ 商店的截图。随后，在 Android Studio 中生成并使用上传密钥签名发布版 Android App Bundle 文件。bundle 文件上传后，Google\
  \ Play 将移除上传密钥并将其替换为安全存储的应用签名密钥，应用即可准备好发布。\n\n可以随时将 bundle 文件加载到 Android Studio\
  \ APK Analyzer 工具中查看其文件内容。\n\n## 83. Android 应用内计费概述\n\n在 Android 和 iOS 等操作系统的移动应用早期，最常见的盈利方法是收取下载和安装应用程序的预付费。不久后，通过在应用中嵌入广告引入了另一种收入机会。现在最常见且利润丰厚的选项可能是安装应用后向用户收取购买应用内项目的费用。这通常表现为访问游戏中的高级别、获取虚拟商品或货币，或者订阅杂志或报纸中的高级内容。\n\
  \nGoogle 通过 Google Play Billing API 和 Play Console 支持集成应用内计费。本章将提供应用内计费的概述，并概述将应用内计费集成到\
  \ Android 项目中的步骤。探索这些主题后，下一章将引导您创建一个包含应用内计费功能的示例应用。\n\n### 83.1 为应用内计费准备项目\n\n在应用中构建应用内计费需要\
  \ Google Play Console 账号，其细节在之前的创建、测试和上传 App Bundle 章节中涵盖过。您还需要注册 Google 商家账号并配置您的付款设置。这些设置可以通过导航到\
  \ Play Console 中的 `Setup -> Payments profile` 找到。注意，商家注册并非在所有国家可用。详情请参考以下页面：\n\n\
  https://support.google.com/googleplay/android-developer/answer/9306917\n\n随后需要将应用上传到控制台并启用应用内计费。除非在模块级\
  \ `build.gradle` 文件中如下添加 Google Play Billing Library，否则控制台不会为应用激活应用内计费支持：\n\n```gradle\n\
  dependencies {\n    implementation 'com.android.billingclient:billing:<latest version>'\n\
  }\n```\n\n添加库并将应用上传到控制台后，下一步是添加用户购买的应用内产品或订阅。\n\n### 83.2 创建应用内产品和订阅\n\n产品和订阅是通过\
  \ Play Console 导航面板 `Monetize`（变现）部分下的选项进行创建和管理的，如图 83-1 所示：\n\n![](img/play_console_monetization.jpg)\n\
  \n图 83-1\n\n每个产品或订阅都需要一个 ID、标题、描述和定价信息。购买分为消耗性（用户每次需要时都必须购买，例如游戏中的虚拟货币）、非消耗性（用户只需购买一次，例如内容访问）和订阅制。消耗性和非消耗性产品统称为托管产品。\n\
  \n\n\n\n\n订阅适用于销售需要按定期计划续费的项目，例如新闻内容的访问权限或 App 高级功能。在创建订阅时，会定义一个基础方案，指定价格、续费周期（按月、按年等）以及是否自动续订。还可以为用户提供优惠信息，并提供预购订阅的选项。\n\
  \n### 83.3 计费客户端初始化\n\n应用与 Google Play 计费库之间的通信由 `BillingClient` 实例处理。此外，`BillingClient`\
  \ 包含一组可以调的方法，用于执行同步和异步的计费相关活动。在初始化计费客户端时，需要为它提供一个 `PurchasesUpdatedListener` 回调处理句的引用。客户端将调用此处理程序来通知您的应用任何购买活动的结果。为了避免重复通知，建议每个应用仅保留\
  \ `BillingClient` 实例。\n\n可以使用 `newBuilder()` 方法创建 `BillingClient` 实例，传入当前的 activity\
  \ 或 fragment 上文。然后通过 `setListener()` 方法将购买更新处理程序分配给客户端：\n\n```java\nprivate final\
  \ PurchasesUpdatedListener purchasesUpdatedListener =\n    new PurchasesUpdatedListener()\
  \ {\n        @Override\n        public void onPurchasesUpdated(BillingResult billingResult,\n\
  \                List<Purchase> purchases) {\n            if (billingResult.getResponseCode()\
  \ ==\n                    BillingClient.BillingResponseCode.OK\n               \
  \     && purchases != null) {\n                // 购买成功\n                for (Purchase\
  \ purchase : purchases) {\n                    // 处理购买\n                }\n    \
  \        } else if (billingResult.getResponseCode() ==\n                    BillingClient.BillingResponseCode.USER_CANCELED)\
  \ {\n                // 用户取消购买\n            } else {\n                // 在处处理错误\n\
  \            }\n        }\n    };\n\nprivate BillingClient billingClient = BillingClient.newBuilder(context)\n\
  \    .setListener(purchasesUpdatedListener)\n    .enablePendingPurchases()\n   \
  \ .build();\n```\n\n### 83.4 连接到 Google Play 计费库\n\n在成功创建计费客户端后，下一步是初始化与 Google\
  \ Play 计费库的连接。要建立此连接，需要调用计费客户端实例的 `startConnection()` 方法。由于连接是异步进行的，需要实现一个 `BillingClientStateListener`\
  \ 处理程序以接收指示连接是否成功的回调。还应该添加代码来重写 `onBillingServiceDisconnected()` 方法。当与计费库的连接丢失时会调用此方法，并用于向用户报告问题以及重试连接。\n\
  \n一旦设置和连接任务完成，`BillingClient` 实例将调用 `onBillingSetupFinished()` 方法，该方法可以检查客户端是否就绪：\n\
  \n```java\nbillingClient.startConnection(new BillingClientStateListener() {\n  \
  \  @Override\n    public void onBillingSetupFinished(\n            @NonNull BillingResult\
  \ billingResult) {\n        if (billingResult.getResponseCode() ==\n           \
  \     BillingClient.BillingResponseCode.OK) {\n            // 连接成功\n        } else\
  \ {\n            // 连接失败\n        }\n    }\n    @Override\n    public void onBillingServiceDisconnected()\
  \ {\n        // 连接丢失\n    }\n});\n```\n\n### 83.5 显示可用产品\n\n一旦计费环境初始化并准备就绪，下一步是请求可购买的或或订阅的详细信息。这是通过调用\
  \ `BillingClient` 的 `queryProductDetailsAsync()` 方法实现的，并传入一个适当配置的 `QueryProductDetailsParams`\
  \ 实例，该实例包含产品 ID 和类型（订阅使用 `ProductType.SUBS`，托管产品使用 `ProductType.INAPP`）：\n\n```java\n\
  billingClient.queryProductDetailsAsync(queryProductDetailsParams,\n    new ProductDetailsListener()\
  \ {\n        public void onProductDetailsResponse(\n                @NonNull BillingResult\
  \ billingResult,\n                @NonNull List<ProductDetails> productDetailsList)\
  \ {\n            if (!productDetailsList.isEmpty()) {\n                // 处理产品列表\n\
  \            } else {\n                // 无匹配产品\n            }\n        }\n    }\n\
  });\n```\n\n`queryProductDetailsAsync()` 方法传递了一个 `ProductDetailsListener` 处理程序，该处理程序反过来会被调用并传入一个包含匹配产品信息的\
  \ `ProductDetail` 对象列表。例如，我们可以调用这些对象的方法来获取如产品名称、标题、价格和优惠详情等信息。\n\n### 83.6 启动购买流程\n\
  \n一旦用户查询并选择了产品或订阅，购买流程就可以启动了。我们通过调用 `BillingClient` 的 `launchBillingFlow()` 方法来实现，并传入当前\
  \ activity 以及一个配置了所购项目 `ProductDetail` 对象的 `BillingFlowParams` 实例：\n\n```java\n\
  BillingFlowParams billingFlowParams =\n    BillingFlowParams.newBuilder()\n    \
  \    .setProductDetailsParams(\n            ImmutableList.of(\n                BillingFlowParams.ProductDetailsParams.newBuilder()\n\
  \                    .setProductDetails(productDetails)\n                    .build()\n\
  \            ))\n        .build();\nbillingClient.launchBillingFlow(this, billingFlowParams);\n\
  ```\n\n购买操作的成功与否将通过本章之前概述的 `PurchasesUpdatedListener` 回调处理程序报告。\n\n### 83.7 完成购买\n\
  \n当购买成功时，`PurchasesUpdatedListener` 处理程序将收到一个包含每个项目 `Purchase` 对象的列表。你可以通过调用 `Purchase`\
  \ 实例的 `getPurchaseState()` 方法来验证项目是否已购买：\n\n```java\nif (purchase.getPurchaseState()\
  \ == Purchase.PurchaseState.PURCHASED) {\n    // 购买完成\n} else if (purchase.getPurchaseState()\
  \ == Purchase.PurchaseState.PENDING) {\n    // 待付款\n}\n```\n\n注意，只有在初始化期间调用 `enablePendingPurchases()`\
  \ 方法，您的应用才会支持待付款购买。待付款购买将一直持续直到用户完成支付流程。\n\n当非消耗性项目的购买完成后，需要对其进行确认，以防止向用户退款。这需要项目的购买令牌，该令牌通过调用\
  \ `Purchase` 对象的 `getPurchaseToken()` 方法获取。该令牌结合 `AcknowledgeResponseListener` 处理程序一起用于\
  \ `AcknowledgePurchaseParams` 实例。托管产品购买和订阅通过调用 `BillingClient` 的 `acknowledgePurchase()`\
  \ 方法进行确认：\n\n```java\nAcknowledgePurchaseParams acknowledgePurchaseParams =\n  \
  \  AcknowledgePurchaseParams.newBuilder()\n        .setPurchaseToken(purchase.getPurchaseToken())\n\
  \        .build();\n\nAcknowledgeResponseListener acknowledgePurchaseResponseListener\
  \ =\n    new AcknowledgeResponseListener() {\n        @Override\n        public\
  \ void onAcknowledgePurchaseResponse(\n                @NonNull BillingResult billingResult)\
  \ {\n            // 检查确认结果\n        }\n    };\n\nbillingClient.acknowledgePurchase(acknowledgePurchaseParams,\
  \ acknowledgePurchaseResponseListener);\n```\n\n\n\n\n对于消耗性商品，你需要在商品被消耗后通知 Google\
  \ Play，以便用户可以再次购买。这需要一个配置好的 `ConsumeParams` 实例，其中包含购买令牌（purchase token）、一个 `ConsumeResponseListener`\
  \ 以及对结算客户端的 `consumeAsync()` 方法：\n\n```java\nConsumeParams consumeParams =\n   \
  \ ConsumeParams.newBuilder()\n        .setPurchaseToken(purchase.getPurchaseToken())\n\
  \        .build();\nConsumeResponseListener listener = new ConsumeResponseListener()\
  \ {\n    @Override\n    public void onConsumeResponse(BillingResult billingResult,\n\
  \                                  @NonNull String purchaseToken) {\n        if\
  \ (billingResult.getResponseCode() ==\n                    BillingClient.BillingResponseCode.OK)\
  \ {\n            // 购买消耗成功\n        }\n    }\n};\n\nbillingClient.consumeAsync(consumeParams,\
  \ listener);\n```\n\n###83.8 查询之前的购买\n\n在处理应用内购买时，一个常见的需求是检查用户是否已经购买了某个产品或订阅。通过调用\
  \ `BillingClient` 实例的 `queryPurchasesAsync()` 方法并实现 `PurchaseResponseListener`，可以生成用户特定类型（非消耗性或活跃订阅）的所有之前的购买列表。例如，以下代码获取了所有之前购买过的非消耗性商品列表：\n\
  \n```java\nQueryPurchasesParams queryPurchasesParams =\n    QueryPurchasesParams.newBuilder()\n\
  \        .setProductType(BillingClient.ProductType.INAPP)\n        .build();\nbillingClient.queryPurchasesAsync(queryPurchasesParams,\n\
  \    new PurchasesResponseListener() {\n        @Override\n        public void onQueryPurchasesResponse(@NonNull\
  \ BillingResult billingResult,\n                                             @NonNull\
  \ List<Purchase> list) {\n            // 处理购买列表\n        }\n    });\n```\n\n要获取活跃订阅列表，请将\
  \ `ProductType` 值从 `INAPP` 改为 `SUBS`。\n\n另一种，要获取过去的购买记录列表（包括活跃、过期、取消和已消耗的商品），请调用\
  \ `BillingClient` 的 `queryPurchaseHistoryAsync()` 方法：\n\n```java\nQueryPurchaseHistoryParams\
  \ queryPurchaseHistoryParams =\n    QueryPurchaseHistoryParams.newBuilder()\n  \
  \      .setProductType(BillingClient.ProductType.INAPP)\n        .build();\nbillingClient.queryPurchaseHistoryAsync(queryPurchaseHistoryParams,\n\
  \    new PurchaseHistoryResponseListener() {\n        @Override\n        public\
  \ void onPurchaseHistoryResponse(@NonNull BillingResult billingResult,\n       \
  \                                      @NonNull List<PurchaseHistoryRecord> list)\
  \ {\n            // 处理购买历史\n        }\n    });\n```\n\n###83.9 总结\n\n应用内购买通过向用户出售虚拟产品和订阅，提供了从\
  \ Android 应用内部产生收入的方式。在本章中，我们探索了托管商品和订阅，并解释了消耗性商品与非消耗性商品之间的区别。使用 Google Play 应用内购买库为应用添加应用内购买支持，这涉及创建和初始化结算客户端，并在其上调用方法来执行诸如购买、列出可用产品和消耗现有购买等任务。下一章将包含一个演示如何在\
  \ Android Studio 中添加应用内购买的教程。\n\n###84. 应用内购买教程\n\n应用内购买通过向用户出售虚拟产品和订阅，提供了从 Android\
  \ 应用内部产生收入的方式。在本章中，我们探索了托管商品和订阅，并解释了消耗性商品与非消耗性商品之间的区别。使用 Google Play 应用内购买库为应用添加应用内购买支持，这涉及创建和初始化结算客户端，并在其上调用方法来执行诸如购买、列出可用产品和消耗现有购买等任务。下一章将包含一个演示如何在\
  \ Android Studio 中添加应用内购买的教程。\n\n####84.1 关于应用内购买\n\n该项目的简单概念是一个必须购买应用内购买的应用。在初始化时，该应用将连接到商店并显示商品详情。一旦应用确认该商品可用，用户就可以点击按钮。本章还将展示如何添加应用内商品。\n\
  \n####84.2 创建 InAppPurchase 项目\n\n此练习的第一步是创建一个新项目。首先启动 Android Studio，在欢迎界面上选择“New\
  \ Project”（新项目）。在新项目对话框中，选择“Empty Activity”（空活动）模板。在 Name（名称）字段中输入 `InAppPurchase`，并指定在\
  \ Google 生态系统中唯一标识您的应用的包名（例如 `com.company.InAppPurchase`）。在点击“Finish”（完成）按钮之前，将\
  \ Minimum API 设置为 API 26: Android 8.0 (Oreo)，并将 Language 菜单设置为 Java。\n\n####84.3\
  \ 向项目添加库\n\n在我们开始编写代码之前，需要在项目配置中添加一些库，其中之一是 Android 结算客户端库。在项目的后续部分，我们还需要使用来自 Google\
  \ Guava Java 库的 `ImmutableList` 类。现在通过修改 `Gradle Scripts` -> `build.gradle (Module:\
  \ InAppPurchase.app)` 文件进行以下更改来添加这些库：\n\n```gradle\ndependencies {\n    implementation\
  \ 'com.android.billingclient:billing:5.0.0'\n    implementation 'com.google.guava:guava:24.1-jre'\n\
  \    implementation 'com.google.guava:guava:27.0.1-android'\n}\n```\n\n添加库后，点击编辑器面板顶部的“Sync\
  \ Now”（立即同步）链接以提交更改。\n\n####84.4 设计用户界面\n\n用户界面将由现有的 `TextView` 和两个 `Button` 组成。在编辑器加载\
  \ `activity_main.xml` 文件，拖放两个 `Button` 视图到布局中，使一个位于 `TextView` 上方，另一个位于下方。选择 `TextView`\
  \ 并将 id 更改更改 `statusText`。\n\n点击工具栏上的“Clear Constraints”（清除约束）按钮并按 Shift 键选择所有视图。右键点击最顶部的\
  \ `Button` 视图，选择“Center -> Horizontally in Parent”（水平居中父布局）菜单选项。再次重复此步骤，这次选择“Chains\
  \ -> Create Vertical Chain”（创建垂直链）。更改顶部按钮的文本属性显示为“Consume Purchase”（消耗购买），id 设置为\
  \ `consumeButton`，并将 enabled 属性设置为 false。此外，配置 `onClick` 属性以调用名为 `consumePurchase`\
  \ 的方法。\n\n选择底部按钮并重复上述步骤，这次将文本设置为“Buy Product”（购买产品），id 设置为 `buyButton`，`onClick`\
  \ 回调设置为 `makePurchase`，并将 enabled 属性设置为 false。完成后，布局应如图 84-1 所示：\n\n![](img/in_app_billing_ui.jpg)\n\
  \n图 84-1\n\n####84.5 将应用添加到 Google Play 商店\n\n\n\n\n按照标题为创建、测试和上传 Android App Bundle\
  \ 的章节中概述的步骤，登录 Play Console，创建一个新应用，并设置一个新的内部测试轨道，包括指定测试人员的电子邮件地址。返回 Android Studio\
  \ 并为项目生成一个已签名的发布版 App 包（app bundle）。一旦生成了包文件，将其上传到内部测试轨道并发布进行测试。\n\n现在应用已经在 Google\
  \ Play 商店中上线了，我们准备好为该项目创建一个应用内商品了。\n\n## 84.6 创建应用内商品\n\n在 Play Console 中选中应用后，向下滚动左侧面板中的选项列表，直到“Monetize”（变现）部分进入视野。在该部分中，如图\
  \ 84-2 所示，选择“Products”（产品）下的“In-app products”（应用内商品）选项：\n\n![](img/play_console_monetization1.jpg)\n\
  \n图 84-2\n\n在应用内商品页面上，点击“Create product”（创建产品）按钮：\n\n![](img/play_console_create_product.jpg)\n\
  \n图 84-3\n\n在新产品屏幕上，保存新产品之前输入以下信息：\n\n- **Product ID**：`one_button_click`\n- **Name（名称）**:\
  \ `A Button Click`\n- **Description（描述）**: 这是一个测试应用内商品，允许点击一次按钮。\n- **Default price（默认价格）**:\
  \ 设置为你你偏好货币的最低可用价格。\n\n## 84.7 启用许可测试人员\n\n在测试应用内计费时，能够在不花费任何资金的情况下进行测试购买是有用的。这可以通过为内部轨道的测试人员启用许可测试来实现。许可测试人员在购买时可以使用测试支付卡，这样他们就不会被收费。\n\
  \n在 Play Console 中，返回主屏幕并选择`Setup -> License testing`（设置->许可测试）选项：\n\n![](img/play_console_license_testing.jpg)\n\
  \n图 84-4\n\n在许可测试屏幕内，添加为内部测试轨道添加的测试人员，将 License response（许可响应）设置更改为`RESPOND_NORMALLY`（正常响应），并保存更改：\n\
  \n![](img/play_console_license_testing_screen.jpg)\n\n图 84-5\n\n现在应用和应用内商品都在 Play\
  \ Console 中设置完毕，我们可以开始向项目中添加代码了。\n\n## 84.8 初始化计费客户端\n\n编辑`MainActivity.java` 文件并进行以下更改，以开始实现应用内购买功能：\n\
  \n```java\nimport androidx.annotation.NonNull;\nimport android.util.Log;\nimport\
  \ com.android.billingclient.api.*;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private ActivityMainBinding binding;\n    private BillingClient billingClient;\n\
  \    private ProductDetails productDetails;\n    private Purchase purchase;\n  \
  \  static final String TAG = \"InAppPurchaseTag\";\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        billingSetup();\n\
  \    }\n\n    private void billingSetup() {\n        billingClient = BillingClient.newBuilder(this)\n\
  \            .setListener(purchasesUpdatedListener)\n            .enablePendingPurchases()\n\
  \            .build();\n        billingClient.startConnection(new BillingClientStateListener()\
  \ {\n            @Override\n            public void onBillingSetupFinished(@NonNull\
  \ BillingResult billingResult) {\n                if (billingResult.getResponseCode()\
  \ == BillingClient.BillingResponseCode.OK) {\n                    Log.i(TAG, \"\
  OnBillingSetup connected\");\n                    queryProduct();\n            \
  \    } else {\n                    Log.i(TAG, \"OnBillingSetup failed\");\n    \
  \            }\n            }\n            @Override\n            public void onBillingDisconnected()\
  \ {\n                Log.i(TAG, \"OnBillingSetup connection lost\");\n         \
  \   }\n        });\n    }\n```\n\n当应用启动时，`onCreate()` 方法现在将调用`billingSetup()`，反过来这将创建一个新的计费客户端并尝试连接到\
  \ Google Play 计费库。连接完成后将调用`onBillingSetupFinished()` 监听，并输出指示连接尝试成功或失败的 Logcat 信息。最后，我们还实现了`onBillingDisconnected()`\
  \ 回调，如果 Google Play 计费连接丢失，将将被调用。如果连接成功，将调用名为`queryProduct()` 的方法。此方法和分配给计费客户端的`purchasesUpdatedListener`都需要添加。\n\
  \n## 84.9 查询商品\n\n为了确保商品可以购买，我们需要创建一个带有在 Play Console 中指定的 product ID 的`QueryDetailsParams`\
  \ 实例，并将其传递给计费客户端的`queryDetailsAsync()` 方法。这要求我们添加`onProductDetails()` 回调方法，在其中我们将检查商品是否存在、提取商品名称并将其显示在状态栏上。现在我们已经获取了商品详情，可以安全地启用购买按钮。在`MainActivity.java`\
  \ 文件中，添加`queryProduct()`方法，其内容如下：\n\n```java\nimport com.google.common.collect.ImmutableList;\n\
  import java.util.List;\n\nprivate void queryProduct() {\n    QueryDetailsParams\
  \ queryDetailsParams =\n        QueryDetailsParams.newBuilder()\n            .setProductList(\n\
  \                ImmutableList.of(\n                    QueryDetailsParams.Product.newBuilder()\n\
  \                        .setProductId(\"one_button_click\")\n                 \
  \       .setProductType(BillingClient.ProductType.INAPP)\n                     \
  \   .build()))\n            .build();\n    billingClient.queryDetailsAsync(\n  \
  \      queryDetailsParams,\n        new ProductDetailsListener() {\n           \
  \ @Override\n            public void onProductDetails(@NonNull BillingResult billingResult,\
  \ @NonNull List<ProductDetails> productDetails) {\n                if (!productDetails.isEmpty())\
  \ {\n                    productDetails = productDetails.get(0);\n             \
  \       runOnUiThread(() -> {\n                        binding.buyButton.setEnabled(true);\n\
  \                        binding.statusText.setText(productDetails.getName());\n\
  \                    });\n                } else {\n                    Log.i(TAG,\
  \ \"onProductDetails: No products\");\n                }\n            }\n      \
  \  }\n    );\n}\n```\n\n这里使用的很多代码在上一章中都很熟悉。监听代码检查是否找到了匹配查询条件的商品。然后从第一个匹配的商品中提取`ProductDetails`对象，存储在`productDetails`变量中，并将商品名称属性显示在状态上。\n\
  \n需要注意的是的是，当我们启用购买按钮并在状态`TextView`上显示商品名称时，是通过调用`runOnUiThread()`来实现的。这是因为监听器不在主线程运行，因此无法安全地更改用户界面。\n\
  \n## 84.10 启动购买流程\n\n当用户点击购买按钮时，将调用名为`makePurchase()`的方法来启动购买流程。我们现在按照以下方式添加此方法：\n\
  \n```java\npublic void makePurchase(View view) {\n    BillingFlowParams billingFlowParams\
  \ =\n        BillingFlowParams.newBuilder()\n            .setProductDetailsParamsList(\n\
  \                ImmutableList.of(\n```\n\n\n\n\n\n```java\n            BillingFlowParams.ProductDetailsParams.newBuilder()\n\
  \                .setProductDetails(productDetails)\n                .build()\n\
  \        )\n    .build();\n    billingClient.launchBillingFlow(this, billingFlowParams);\n\
  }\n```\n\n## 84.11 处理购买更新\n\n购买过程的结果将通过在初始化阶段分配给 `billingClient` 的 `PurchaseUpdatedListener`\
  \ 报告给应用。现在按照如下方式添加此处理程序：\n\n```java\nprivate final PurchasesUpdatedListener purchasesUpdatedListener\
  \ = new PurchasesUpdatedListener() {\n    @Override\n    public void onPurchasesUpdated(BillingResult\
  \ billingResult,\n                                List<Purchase> purchases) {\n\
  \        if (billingResult.getResponseCode() ==\n                            BillingClient.BillingResponseCode.OK\n\
  \                    && purchases != null) {\n            for (Purchase purchase\
  \ : purchases) {\n                completePurchase(purchase);\n            }\n \
  \       } else if (billingResult.getResponseCode() ==\n                    BillingClient.BillingResponseCode.USER_CANCELED)\
  \ {\n            Log.i(TAG, \"onPurchasesUpdated: Purchase Canceled\");\n      \
  \  } else {\n            Log.i(TAG, \"onPurchasesUpdated: Error\");\n        }\n\
  \    }\n};\n```\n\n如果用户取消购买或发生其他错误，处理程序将输出日志消息。然而，成功的购买将调用一个名为 `completePurchase()`\
  \ 的方法，并向其传递当前的 `Purchase` 对象。下文所示添加此方法：\n\n```java\nprivate void completePurchase(Purchase\
  \ item) {\n    purchase = item;\n    if (purchase.getPurchaseState() == Purchase.PurchaseState.PURCHASED)\n\
  \        runOnUiThread(() -> {\n            binding.consumeButton.setEnabled(true);\n\
  \            binding.statusText.setText(\"Purchase Complete\");\n        });\n}\n\
  ```\n\n此方法在验证产品确实已购买且支付尚未处于挂起状态之前存储购买记录。随后启用“消耗”（consume）按钮并通知用户购买成功。\n\n## 84.12\
  \ 消耗产品\n\n现在用户能够点击“消耗”按钮了，下一步是确保产品已被消耗，这样在购买另一个按钮点击之前，只能执行一次点击。这要求我们现在编写 `consumePurchase()`\
  \ 方法：\n\n```java\npublic void consumePurchase(View view) {\n    ConsumeParams consumeParams\
  \ =\n            ConsumeParams.newBuilder()\n                .setPurchaseToken(purchase.getPurchaseToken())\n\
  \                .build();\n    ConsumeResponseListener listener = new ConsumeResponseListener()\
  \ {\n        @Override\n        public void onConsumeResponse(BillingResult billingResult,\n\
  \            @NonNull String purchaseToken) {\n            if (billingResult.getResponseCode()\
  \ ==\n                            BillingClient.BillingResponseCode.OK) {\n    \
  \            runOnUiThread(() -> {\n                    binding.consumeButton.setEnabled(false);\n\
  \                    binding.statusText.setText(\"Purchase consumed\");\n      \
  \          });\n            }\n        }\n    };\n    billingClient.consumeAsync(consumeParams,\
  \ listener);\n}\n```\n\n此方法创建了一个 `ConsumeParams` 实例并使用当前购买的购买令牌（从 `completePurchase()`\
  \ 方法保存的 `Purchase` 对象获取）对其进行配置。声明了一个处理程序，以便消耗成功后禁用消耗按钮并更新状态文本。最后，调用 `billing client`\
  \ 的 `consumeAsync()` 方法，并传递消耗参数和监听器的引用。\n\n## 84.13 测试应用\n\n在测试应用之前，我们需要将此最新版本上传到\
  \ Play Console。由于我们已经有了版本 1，首先需要增加 `build.gradle` (Module: `InAppPurchase`) 文件中的版本号：\n\
  \n```gradle\ndefaultConfig {\n    applicationId \"com.ebookrenzy.inapppurchase\"\
  \n    minSdk 26\n    targetSdk 32\n    versionCode 2\n    versionName \"2.0\"\n\
  }\n```\n\n同步构建配置，然后按照“创建、测试和上传 Android App Bundle”中的步骤生成新的应用包包，将其上传到内部测试轨道并推发给测试人员。使用测试轨道链接，在登录了其中一个测试账户的设备或模拟器上安装该应用。\n\
  \n应用启动后，经过简短的延迟，它应该在 `TextView` 上显示产品名称并启用购买按钮。点击购买按钮将开始购买流程，如图 84-6 所示：\n\n![](img/in_app_billing_test_purchase.jpg)\n\
  图 84-6\n\n点击购买按钮使用测试卡片完成购买，并等待“消耗购买”（Consume Purchase）按钮启用。在点击此按钮之前，尝试再次购买该产品，并验证无法这样做，因为你已经拥有该产品。\n\
  \n点击“消耗购买”按钮，等待 `TextView` 上出现“购买已消耗”（Purchase consumed）消息。产品消耗后，现在应该可以再次购买。\n\n\
  ## 84.14 故障排除\n\n如果在购买过程中遇到问题，请确保设备已通过 USB 线缆或 WiFi 连接到 Android Studio，并在 Logcat\
  \ 面中选择它。在 Logcat 搜索栏中输入 `InAppPurchaseTag` 并检查诊断输出，必要时在代码中添加额外的 `Log` 调用。关于失败的更多信息，一个实用的技巧是访问\
  \ `BillingResult` 实例的调试消息，例如：\n\n```java\n} else if (billingResult.getResponseCode()\n\
  \            == BillingClient.BillingResponseCode.USER_CANCELED) {\n    Log.i(TAG,\
  \ \"onPurchasesUpdated: Purchase Canceled\");\n} else {\n    Log.i(TAG, billingResult.getDebugMessage());\n\
  }```\n\n注意，只要你不更改模块级 `build.gradle` 文件中的应用版本号，你现在应该可以在设备或模拟器上直接运行修改后的应用，而无需重新打包和上传。\n\
  \n如果没有显示测试支付卡，请确保设备上的用户账户已添加到许可测试人员列表中。如果所有方法都无效，你可以输入有效的支付方式进行测试购买，然后通过 Play Console\
  \ 首页访问的订单管理界面进行退款。\n\n## 84.15 总结\n\n在本章中，我们创建了一个演示如何向 Android 应用添加应用内产品的项目。这包括在\
  \ Google Play Console 中创建产品，以及编写用于初始化和连接计费客户端、查询可用产品以及最终购买和消耗产品的代码。我们还解释了如何向 Play\
  \ Console 添加许可测试人员，以便在测试时无需花费费用即可购买。\n\n# 85 Android 动态功能模块概述\n\n正如上一章所述，App Bundle\
  \ 和动态交付的引入显著减少了用户在 Android 设备上安装应用时需要下载的应用包大小。最初目的是针对每种可能的设备配置自动生成单独的包，但动态交付的另一个关键优势是将应用拆分为多个按需安装的动态功能模块。\n\
  \n在本章中，我们将开始探索动态功能模块的基本概念，为下一章的详细实践示例做准备。\n\n## 85.1 动态功能模块概述\n\n\n\n\n\n动态交付的主要目标是减少从应用商店安装应用所需的时间和带宽，同时确保应用在安装后仅占用最少的存储空间。\n\
  \n动态功能模块（也称为按需模块）允许将构成 Android 应用的不同功能打包到单独的模块中，这些模块只有在用户需要时，才会被下载并安装到设备上。例如，一个应用可能包含新闻和讨论功能。在这种情况下，该应用默认可能只安装新闻功能，并将讨论功能分离成一个动态功能模块。当用户尝试访问讨论功能时，应用将从\
  \ Google Play 商店下载该功能模块并启动它。如果用户从未访问过该功能，该模块将永远不会被安装，从而确保应用仅使用最少量的存储空间。\n\n使用动态功能模块的应用对模块的安装方式和安装时间具有完全控制权。事实上，应用还可以监控用户访问特定功能的频率，并临时移除任何不常使用的功能。\n\
  \n一个动态功能还可能被指定为“即时”（instant）模块。这取代了早期 Android 版本中的即时应用（Instant App）概念，并允许在不安装应用的情况下在设备上运行动态功能模块。这使得应用可以在\
  \ Google Play 商店中带有“立即尝试”（Try Now）按钮出现，或者通过点击网络 URL 在设备上立即启动。\n\n## 85.2 动态功能模块架构\n\
  \nAndroid 从一开始开始设计时就考虑了模块化，特别是在意图（Intents）和活动（Activities）的概念方面。动态功能将这种哲学推向了逻辑终，允许应用在用户需要的时候安装用户需要的内容。鉴于这种能力的灵活性和强大，动态功能模块的实现相对简单。\n\
  \n简单来说，动态功能模块使用拆分 APK 文件（split APK files）构建的，这些文件允许多个 APK 文件组合成一个单一应用。\n\n正如我们在创建、测试和上传\
  \ Android App 包\n\n图 85-1\n\n## 85.3 创建动态功能模块\n\n可以通过添加全新的模块或迁移现有模块来向项目添加动态功能。要添加新模块，只需选择\
  \ Android Studio 的 `File -> New -> New Module...` 菜单选项。在弹出的对话框中，根据要创建的动态功能类型，在左侧面板选择动态功能模块（Dynamic\
  \ Feature Module）或即时动态功能模块（Instant Dynamic Feature Module）：\n\n![](img/as_4.2_add_dynamic_feature.jpg)\n\
  \n图 85-2\n\n选择合适的动态功能选项后，命名模块并更改最小 API 设置，使其与基础模块选择的 API 级别匹配（如果版本不匹配，项目将无法编译）。\n\
  \n点击 Next Next 配置按需（On-Demand）选项：\n\n![](img/as_4.2_dynamic_feature_options.jpg)\n\
  \n图 85-3\n\n当启用 Fusing 选项时，在运行旧版本 Android（Android 4.4 API `20` 或更早版本）的设备上，该模块将与基础\
  \ APK 一起下载，这些版本早于动态交付的引入。Module Title 字符串长度可达 50 个字符，Google Play 将在消息和通知中向用户描述该功能时使用它。\n\
  \n安装时包含（Install-time inclusion）菜单提供了控制模块在何时按需安装，而不是包含在用户设备上的初始安装中的选项。该菜单提供以下选项：\n\
  \n- 安装时不包含模块（仅按需） - 无论设备配置和用户国家如何，在应用请求之前，模块将不会被安装。\n- 安装时包含模块 - 禁用所有设备和用户国家的按需动态安装。模块将在安装应用的同时被安装。\n\
  - 仅对具有指定功能的设备在安装时包含 - 模块将在符合特定标准的设备配置和用户国家安装时包含。所有其他国家和设备配置将使用动态安装。选择此选项时，会出现额外选项允许输入设备功能。如[图\
  \ 85-4#Dynamic_Feature_Modules.xhtml__idTextAnchor1608]所示，该模块将在具有麦克风和指纹识别器的设备上安装时包含。在所有其他设备上，该模块将按需安装：\n\
  \n![](img/as_4.2_dynamic_feature_features.jpg)\n\n图 85-4\n\n其他标准（如国家和 API 级别）必须在项目清单（AndroidManifest.xml）文件中声明。例如，以下条将禁用法国用户和运行比\
  \ API `21` 旧的 Android 版本的动态按需功能安装：\n\n```xml\n<dist:conditions>\n <dist:user-countries\
  \ exclude=\"true\">\n <dist:country code=\"FR\"/>\n </dist:user-countries>\n <dist:min-sdk\
  \ value=\"21\"/>\n</dist:conditions>\n```\n\n## 85.4 将现有模块转换为动态交付\n\n如果应用包含一个适合动态交付的现有功能，可以通过几个基本步骤将其转换为动态功能。例如，考虑以下项目结构：\n\
  \n![](img/andorid_dynamic_feature_convert_tree.jpg)\n\n图 85-5\n\n在此项目中，app 模块将作为基础模块，而\
  \ secondfeature 模块是转换为动态功能模块的理想候选者。\n\n\n\n\n将应用中的现有模块转换为动态功能模块（dynamic feature\
  \ module），首先编辑模块层级的 `build.gradle` 文件（在上述示例中为 Gradle Scripts -> `build.gradle (Module:\
  \ secondfeature)`），并将其修改为使用 `com.android.dynamic-feature` 替 `com.android.application`\
  \ 插件，同时更改依赖，使模块仅依赖于基础（app）模块。例如：\n\n```gradle\napply plugin: 'com.android.application'\n\
  \napply plugin: 'com.android.dynamic-feature'\n\ndependencies {\n    implementation\
  \ fileTree(dir: 'libs', include: ['*.jar'])\n    api 'androidx.appcompat:appcompat:1.0.2'\n\
  \    api 'androidx.constraintlayout:constraintlayout:1.1.3'\n    testImplementation\
  \ 'junit:junit:4.12'\n    androidTestImplementation 'androidx.test.ext:junit:1.1.1'\n\
  \    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'\n  \
  \  implementation project(':app')\n}\n```\n\n接下来，编辑该模块的 `AndroidManifest.xml` 文件并按如下方式进行修改（注意在本示例中，这是一个按需模块，而不是即时模块）：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:dist=\"http://schemas.android.com/apk/distribution\"\
  \n    package=\"com.ebookfrenzy.mymodule\">\n    <dist:module\n        dist:instant=\"\
  false\"\n        dist:onDemand=\"true\"\n        dist:title=\"@string/title_my_dynamic_feature\"\
  >\n        <dist:fusing dist:include=\"true\" />\n    </dist:module>\n    <application\n\
  \        android:allowBackup=\"true\">\n```\n\n注意 `title` 属性引用的是一个字符串资源，该资源也需要在\
  \ `strings.xml` 文件中声明。该属性强制使用字符串资源，而不是硬编码字符串。\n\n接下来，需要修改基础模块的 `build.gradle` 文件（`build.gradle\
  \ (Module: app)`）以引用动态功能模块，并添加 Play Core Library 作为依赖项：\n\n```gradle\napply plugin:\
  \ 'com.android.application'\n\nandroid {\n    compileSdkVersion 29\n    }\n\n  \
  \  dynamicFeatures = [\":secondfeature\"]\n}\n\ndependencies {\n    api 'com.google.android.play:core:1.5.0'\n\
  }\n```\n\n最后，编辑基础模块的 `AndroidManifest.xml` 文件，将该模块声明为继承 `SplitCompatApplication`\
  \ 的子类：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.mydemoapp\"\
  >\n    <application\n        android:name=\"com.google.android.play.core.splitcompat.SplitCompatApplication\"\
  \n        android:allowBackup=\"true\">\n```\n\n## 5.5 使用动态功能模块\n\n一旦应用项目添加或多个动态功能模块，就需要编写代码来安装和管理这些模块。这将涉及执行任务，例如检查模块是否已安装、安装模块、跟踪安装进度以及删除不再需要的已安装模块。所有这些任务都使用\
  \ Play Core Library 提供的 API 完成，大部分这些 API 调用涉及使用 `SplitInstallManager` 实例，可以如下创建：\n\
  \n```java\nprivate SplitInstallManager manager;\nmanager = SplitInstallManagerFactory.create(this);\n\
  ```\n\n通常，在允许用户启动动态功能之前，第一步是检查相应的模块是否已经安装。例如，以下代码获取已安装模块的列表并检查特定模块是否安装：\n\n```java\n\
  if (manager.getInstalledModules().contains(\"my_dynamic_feature\")) {\n    // 模块已安装\n\
  }\n```\n\n可以通过构建 `SplitInstallRequest` 对象并将其传递给 `SplitInstallManager` 实例的 `startInstall()`\
  \ 方法来安装一个或多个模块：\n\n```java\nprivate int mySessionID = 0;\n\nSplitInstallRequest\
  \ request =\n        SplitInstallRequest\n            .newBuilder()\n          \
  \  .addModule(\"my_dynamic_feature\")\n            .addModule(\"my_dynamic_feature2\"\
  )\n            .build();\nmanager.startInstall(request)\n    .addOnSuccessListener(new\
  \ OnSuccessListener<Integer>() {\n        @Override\n        public void onSuccess(Integer\
  \ sessionId) {\n            mySessionID = sessionId;\n        }\n    })\n    .addOnFailureListener(new\
  \ FailureListener() {\n        @Override\n        public void onFailure(Exception\
  \ exception) {\n        }\n    });\n```\n\n当执行上述代码时，模块安装将开始。或者，也可以通过将功能名称数组传递给 `deferredInstall()`\
  \ 方法执行延迟安装：\n\n```java\nmanager.deferredInstall(Arrays.asList(\"my_dynamic_feature\"\
  , \"my_dynamic_feature2\"));\n```\n\n延迟下载由操作系统决定在后台执行。虽然无法跟踪延迟安装的状态，但后可以通过向 `manager`\
  \ 添加监听器来跟踪非延迟安装的状态：\n\n```java\nSplitInstallStateUpdatedListener listener = new\
  \ SplitInstallStateUpdatedListener() {\n    @Override\n    public void onStateUpdate(SplitInstallState\
  \ state) {\n        if (state.sessionId() == mySessionID) {\n            switch\
  \ (state.status()) {\n                case SplitInstallStatus.DOWNLOADING:\n   \
  \                 // 正在下载\n                    break;\n                case SplitInstallStatus.INSTALLING:\n\
  \                    // 正在安装模块\n                    break;\n                case\
  \ SplitInstallStatus.DOWNLOADED:\n                    // 下载已完成\n               \
  \     break;\n                case SplitInstallStatus.INSTALLED:\n             \
  \       // 模块已安装\n                    break;\n                case SplitInstallStatus.CANCELED:\n\
  \                    // 用户取消了安装\n                    break;\n                case\
  \ SplitInstallStatus.PENDING:\n                    // 安装已延迟\n                  \
  \  break;\n                case SplitInstallStatus.FAILED:\n                   \
  \ // 安装失败\n                    break;\n                case SplitInstallStatus.REQUIRES_USER_CONFATION:\n\
  \                    // 模块需要用户权限\n                    break;\n            }\n  \
  \      }\n    }\n};\n```\n\n一旦实现了监听器，需要将其注册到 `SplitInstallManager` 中，并在不再需要时注销。\n\
  \n```java\nmanager.registerListener(listener);\nmanager.unregisterListener(listener);\n\
  ```\n\n## 5.6 处理大型功能模块\n\nAndroid 交付系统在未请求用户许可的情况下下载大于 10MB 的动态功能。当请求下载大型功能时，监听器将被调用并传递\
  \ `REQUIRES_USER_CONFATION` 状态。此时，应用负责显示确认对话框，并可选地实现 `onActivityResult()` 方法以识别用户是批准还是拒绝了下载。\n\
  \n```java\nstatic final int REQUEST_CODE = 101;\n\nSplitInstallStateUpdatedListener\
  \ listener = new SplitInstallStateUpdatedListener() {\n    @Override\n    public\
  \ void onStateUpdate(SplitInstallState state) {\n        if (state.sessionId() ==\
  \ mySessionID) {\n            switch (state.status()) {\n                case SplitInstallStatus.REQUIRES_USER_CONFATION:\n\
  \                    try {\n                        manager.startConfirmationForResult(state,\
  \ MainActivity.this, REQUEST_CODE);\n                    } catch (IntentSender.SendIntentException\
  \ ex) {\n                        // 请求失败\n                    }\n              \
  \      break;\n            }\n        }\n    }\n};\n```\n\n\n\n上述代码启动了一个意图（intent），随后会显示内置的确认对话框。该意图将向\
  \ `onActivityResult()` 方法返回结果代码，其实现可能如下：\n\n```java\n@Override\npublic void onActivityResult(int\
  \ requestCode, int resultCode, Intent data) {\n    if (requestCode == REQUEST_CODE)\
  \ {\n        if (resultCode == RESULT_OK) {\n            // 用户批准了安装\n        } else\
  \ {\n            // 用户拒绝了安装\n        }\n    }\n}\n```\n\n如果用户批准了请求，动态特性模块将自动下载并安装。\n\
  \n## 85.7 总结\n\n动态特性模块允许 Android 应用程序被划多个独立的功能，这些功能在用户需要时按需下载。动态特性模块还可以被配置为即时功能（instant\
  \ features）。即时功能可以在无需在设备上安装应用的情况下运行，用户可以通过应用商店页面上的“立即尝试”按钮或通过 Web URL 访问。\n\n动态特性的实现涉及将应用拆分为一个基础模块（base\
  \ module）和一个或多个动态特性模块。可以在 Android Studio 中创建新的动态特性模块，也可以通过对项目配置进行少量更改，将现有模块转换为动态特性模块。\n\
  \n一旦动态特性模块被添加到应用中，这些模块的下载和管理将由应用通过 Play Core Library 的 `SplitInstall` 类处理。\n\n#\
  \ 86. Android Studio 动态特性教程\n\n在前章介绍了 Android 动态交付和动态特性的基本概念后，本章将以示例项目的形式将这些理论付实践。在本章创建的应用将包含两个活动（activity），第一个将作为应用的基础模块，第二个将指定为从运行中的应用内部按需下载的动态特性。本教程将包括在\
  \ Android Studio 内部创建动态模块的步骤、将应用包上传到 Google Play 商店进行测试，以及使用 Play Core Library 下载和管理动态特性的方法。本章还将探索延迟动态特性安装的使用。\n\
  \n## 86.1 创建 DynamicFeature 项目\n\n从欢迎界面选择 New Project（新建项目）选项，在弹出的新项目对话框中，点击 Next（下一步）按钮之前选择\
  \ `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `DynamicFeature`，并指定一个在 Google Play 生态系统中唯一标识您的应用的包名（例如\
  \ `com.<your company>.dynamicfeature`）。在点击 Finish（完成）按钮之前，将 Minimum API level 设置更改为\
  \ `API 26: Android 8.0 (Oreo)`，并将语言菜单更改为 `Java`。\n\n## 86.2 为项目添加动态特性支持\n\n在开始实现应用之前，需要对项目进行两个更改以添加对动态特性的支持。由于项目将大量使用\
  \ Play Core Library，需要在构建配置中添加指令以包含此库。在 Android Studio 中，打开应用 级别的 `build.gradle`\
  \ 文件（`Gradle Scripts` -> `build.gradle (Module: DynamicFeature.app)`），找到 dependencies\
  \ 部分并按如下所示添加 Play Core Library（请记住，一如既往，现在可能有更新版本的库）：\n\n```gradle\ndependencies\
  \ {\n    implementation 'com.google.android.play:core:1.10.3'\n}\n```\n\n一旦下载了动态特性模块，用户可能需要立即访问组成该特性的代码和资源资产。但默认情况下，新安装的特性模块在应用重启之前对应用的其他部分不可用。幸运的是，通过在项目中启用\
  \ `SplitCompat` 库可以避免这一缺陷。目前实现此点的简单方法是在主 `AndroidManifest.xml` 文件（也称为基础模块清单文件）中将应用程序声明为类的\
  \ `SplitCompatApplication`，如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n   \
  \ package=\"com.ebookfrenzy.dynamicfeature\">\n    <application\n        android:name=\"\
  com.google.android.play.core.splitcompat.SplitCompatApplication\"\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher_round\">\n```\n\n## 86.3 设计基础\
  \ Activity 用户界面\n\n此时，项目包含一个活动，它将作为应用基础模块的入口。该基础模块将负责请求、安装和管理动态特性模块。\n\n为了演示动态特性的使用，基础活动将由一系列按钮组成，允许安装、启动和移除动态特性模块。用户界面还将包含一个\
  \ `TextView` 用于显示与动态特性相关的状态信息。根据这些要求，将 `activity_main.xml` 文件加载到布局编辑器中，删除默认的 `TextView`\
  \ 对象，并实现设计，将 `id` 属性设置为 `status_text`。开始应用布局约束：选择所有对象，右键点击 `TextView` 并从菜单中选择 `Center\
  \ -> Horizontally` 选项，从而将四个对象都约束在水平中心。\n\n在所有对象仍被选的情况下，再次右键点击 `TextView` 并选择 `Chains\
  \ -> Vertical Chain`。在继续之前，将所有按钮文本字符串提取到资源中，并配置三个按钮分别调用命名为 `launchFeature`、`installFeature`\
  \ 和 `deleteFeature` 方法。\n\n## 86.4 添加动态特性模块\n\n要向项目添加动态特性模块，选择 `File -> New -> New\
  \ Module...` 菜单选项，并在弹出的对话框中，从左侧面板选择 `Dynamic Feature`。在主面板中，将模块命名为 `my_dynamic_feature`，并将\
  \ API 设置为 `API 26: Android 8.0 (Oreo)`，以便与基础模块选择的 API 级别匹配。\n\n再次点击 Next 按钮配置按需选项，确保启用\
  \ `Fusing` 选项。在 `Module Title` 字段中输入文本“My Example Dynamic Feature”。在点击 Finish 按钮提交更改并将动态特性模块添加到项目之前，将安装时包含菜单设置为\
  \ `Do not include module at install time (on-demand only)`。\n\n在继续之前，值得花时间回顾 Android\
  \ Studio 对项目所做的更改。了解这些更改对于解决问题以及将现有应用功能转换为动态特性都非常有用。\n\n首先参考 Project 工具窗口，那里将出现一个新项，代表包含新动态特性模块的文件夹。\n\
  \n\n\n\n注意，该功能拥有自己的子结构，包括一个清单文件、一个可以添加代码和资源的包以及一个 `res` 文件夹。打开并查看 `AndroidManifest.xml`\
  \ 文件，该文件应包含在创建功能过程中所选的属性设置，包括按需（on-demand）、融合（fusing）和功能标题值：\n\n```xml\n<manifest\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:dist=\"\
  http://schemas.android.com/apk/distribution\"\n    package=\"com.ebookfrenzy.my_dynamic_feature\"\
  >\n    <dist:module\n        dist:instant=\"false\"\n        dist:title=\"@string/title_my_dynamic_feature\"\
  >\n        <dist:delivery>\n            <dist:on-demand />\n        </dist:delivery>\n\
  \        <dist:fusing dist:include=\"true\" />\n    </dist:module>\n</manifest>\n\
  ```\n\n特别特别感兴趣的一点是，模块标题字符串被存储为字符串资源，而不是直接输入在清单文件中。这是标题字符串的前提，可以在基础模块的 `strings.xml`\
  \ 文件（`app -> res -> values -> strings.xml`）中找到，并在需要时进行修改。\n\n动态功能模块的构建配置可以在 Gradle\
  \ Scripts -> `build.gradle` (Module: DynamicFeature.my_dynamic_feature) 文件中找到，内容如下：\n\
  \n```gradle\nplugins {\n    id 'com.android.dynamic-feature'\n}\n\nandroid {\n \
  \   compileSdkVersion 32\n}\n\ndependencies {\n    implementation project(\":app\"\
  )\n}\n```\n\n该文件中的关键条目是应用 `com.android.dynamic-feature` 插件，这确保了模块被视为动态功能，以及实现行表示该功能依赖于基础（app）模块。\n\
  \n基础模块的 `build.gradle` 文件（Gradle Scripts -> `build.gradle` (Module: DynamicFeature.app））包含包含列出动态功能模块的新条目。在查看该文件时，添加启用视图绑定（view\
  \ binding）支持的指令：\n\n```gradle\nplugins {\n    id 'com.android.application'\n}\n\n\
  android {\n    buildFeatures {\n        viewBinding true\n    }\n    dynamicFeatures\
  \ = [':my_dynamic_feature']\n}\n```\n\n向项目中添加的任何额外动态功能也在此处引用，例如：`dynamicFeatures\
  \ = [\":my_dynamic_feature\", \":my_second_feature\", ...]`\n\n## 86.6 添加动态功能 Activity\n\
  \n从上方的图 86-4 所示的 Project 工具窗口中可以清楚地看到，此时动态功能模块几乎只有一个一个清单文件。下一步是向模块添加一个 activity，以便该功能在从基础模块内部启动时能够实际执行操作。在\
  \ Project 工具窗口中，右键点击位于 `my_dynamic_feature -> java` 下的包名，并选择 `New -> Activity ->\
  \ Empty Activity` 菜单。将 activity 命名为 `MyFeatureActivity` 并启用 `Generate Layout File`\
  \ ，但在点击 `Finish` 按钮之前禁用 `Launcher Activity` 选项。\n\n![](img/as_4.2_add_dynamic_feature_activity.jpg)\n\
  图 86-5\n\n一旦 activity 添加到模块中，编辑 `AndroidManifest.xml` 文件并进行修改以添加意图过滤器（intent filter），这将允许基础模块启动该\
  \ activity（将 `<com.yourcompany>` 替换为为您在 Google Play 上使应用唯一的包包名）：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:dist=\"http://schemas.android.com/apk/distribution\"\n    package=\"\
  com.ebookfrenzy.my_dynamic_feature\">\n    <dist:module\n        dist:instant=\"\
  false\"\n        dist:title=\"@string/title_my_dynamic_feature\">\n        <dist:delivery>\n\
  \            <dist:on-demand />\n        </dist:delivery>\n        <dist:fusing\
  \ dist:include=\"true\" />\n    </dist:module>\n    <application>\n        <activity\
  \ android:name=\".MyFeatureActivity\" android:exported=\"true\">\n            <intent-filter>\n\
  \                <action android:name=\"android.intent.action.VIEW\" />\n      \
  \          <action android:name=\"com.yourcompany.my_dynamic_feature.MyFeatureActivity\"\
  \ />\n                <category android:name=\"android.intent.category.DEFAULT\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n接下来，编辑 `build.gradle` (Module: DynamicFeature.my_dynamic_feature) 文件的 `dependencies`\
  \ 部分以包含 Google Play 库：\n\n```gradle\ndependencies {\n    implementation 'com.google.android.play:core:1.10.1'\n\
  }\n```\n\n为了从动态模块内部访问资源，需要在 `FeatureActivity` 中调用 `SplitCompat.install()` 方法。编辑\
  \ `MainActivity.java` 文件并按如下修改 `onCreate()` 方法，包括添加视图绑定的更改：\n\n```java\nimport android.view.View;\n\
  import com.google.android.play.core.splitcompat.SplitCompat;\nimport <com.yourcompany>.dynamicfeature.databinding.ActivityMainBinding;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_feature);\n\
  \        SplitCompat.install(this);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n    }\n\
  }\n```\n\n未执行此步骤通常会导致应用程序在启动动态功能时崩溃，错误类似于：\n`AndroidRuntime: java.lang.RuntimeException:\
  \ Unable to start activity ComponentInfo{com.ebookfrenzy.dynamicfeature/MyFeatureActivity}:\
  \ android.content.res.NotFoundException: Resource ID #0x80020000`\n\n通过布局编辑器加载 `activity_feature.xml`\
  \ 文件并添加显示“My Dynamic Feature”的 `TextView` 对象来完成该功能：\n\n![](img/as_3.4_dynamic_feature_activity.jpg)\n\
  图 86-6\n\n## 86.7 实现 launchFeature 方法\n\n现在可以使用 Play Core 库开始处理动态功能模块。第一步是实现 `launchFeature()`\
  \ 方法，其目的是使用意图（intent）启动动态功能 activity。然而，启动尚未安装的动态功能模块中的 activity 会导致应用程序崩溃。因此，`launchFeature()`\
  \ 方法需要包含防御代码以确保动态功能已安装。为了实现这一点，我们需要创建 `SplitInstallManager` 类的实例并调用该对象的 `getInstalledModules()`\
  \ 方法来检查 `my_dynamic_feature` 模块是否已安装。如果已安装，就可以安全地启动包含的 activity，否则需要在状态 `TextView`\
  \ 上向用户显示消息。在 `MainActivity.java` 文件中，对类进行以下更改：\n\n```java\nimport android.content.Intent;\n\
  import com.google.android.play.core.splitinstall.SplitInstallManager;\nimport com.google.android.play.core.splitinstall.SplitInstallManagerFactory;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    private SplitInstallManager manager;\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        SplitCompat.install(this);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ manager = SplitInstallManagerFactory.create(this);\n    }\n\n    public void launchFeature(View\
  \ view) {\n        if (manager.getInstalledModules().contains(\"my_dynamic_feature\"\
  )) {\n```\n\n\n\n```java\nIntent i = new Intent(\"<com.yourcompany>.my_dynamic_feature.MyFeatureActivity\"\
  );\nstartActivity(i);\n} else {\n    binding.statusText.setText(\"Feature not yet\
  \ installed\");\n}\n}\n.\n.\n}# 86.8 上传 App Bundle 进行测试\n\n该项目现在已准备好进行第一阶段测试。这涉及生成一个发布版\
  \ app bundle 并将其上传到 Google Play Console。实现这一点的步骤已在[创建、测试和上传 Android App Bundle]章节中进行了概述，但可以总结如下：\n\
  \n1. 登录 `Google Play Console` 并创建一个新应用程序。\n2. 按照步骤在标题、描述、分类和图像资源方面配置应用（示例图像资源可以在随随书附带的示例代码下载包的\
  \ `image_assets` 文件夹中找到），并保存草稿设置。此外，确保为该 bundle 启用 Google Play 应用束签名。\n3. 使用 `Android\
  \ Studio` 的 `Build` -> `Generate Signed App Bundle / APK...` 菜单生成一个带签名的发布版 app bundle。\n\
  4. 在 `Google Play Console` 中，从左侧导航面板中选择 `Testing` -> `Internal testing` 选项。\n5.\
  \ 在 `Internal test` 界面，点击 `Create Release` 按钮并点击 `Continue` 以接受让 Google 管理密钥签名任务的选项。将上方生成的\
  \ app bundle 文件拖放到上传框中并点击 `Save`。\n6. 切换到内部测试界面中的 `Testers` 标签卡，添加将用于在一个或多个物理设备上测试应用的账户邮箱地址。\n\
  7. 返回 `Releases` 标签卡并点击 `Edit` 按钮。滚动到生成页底部并点击 `Review release` 按钮。\n8. 在确认屏幕上，点击\
  \ `Start rollout to Internal testing` 按钮。该应用将列为 `Pending publication`（等待发布）。\n\n\
  一旦发布用于测试，将向通知发送给内部测试轨道上的所有用户，要求他们加入该应用的测试轨道。或者，复制 `Testers` 屏幕上列出的 URL 并将其发送给测试用户。一旦用户加入，将提供一个链接，在设备上打开该链接时，将启动\
  \ Play Store 应用并打开 `DynamicFeature` 应用的下载页面，如图 86-7 所示：\n\n![](img/as_3.6_install_dynamic_feature_app.jpg)\n\
  \n图 86-7\n\n点击按钮安装应用，然后打开它并点击 `Launch Feature` 按钮。动态功能尚未安装的事实应该反映在状态文本中。\n\n# 86.9\
  \ 实现 installFeature() 方法\n\n`installFeature()` 方法将为 `my_dynamic_feature` 模块创建一个\
  \ `SplitInstallRequest` 对象，然后使用 `SplitInstallManager` 实例启动安装过程。还将实现监听器以显示指示安装请求状态的\
  \ `Toast` 消息。在 `MainActivity.java` 文件中，按所示添加 `installFeature()` 方法：\n\n```java\n\
  import android.widget.Toast;\nimport com.google.android.play.core.splitinstall.SplitInstallRequest;\n\
  import com.google.android.play.core.tasks.OnFailureListener;\nimport com.google.android.play.core.tasks.OnSuccessListener;\n\
  \npublic void installFeature(View view) {\n    SplitInstallRequest request = SplitInstallRequest\n\
  \            .newBuilder()\n            .addModule(\"my_dynamic_feature\")\n   \
  \         .build();\n    manager.startInstall(request)\n        .addOnSuccessListener(new\
  \ OnSuccessListener<Integer>() {\n            @Override\n            public void\
  \ onSuccess(Integer sessionId) {\n                Toast.makeText(MainActivity.this,\n\
  \                        \"Module installation started\",\n                    \
  \    Toast.LENGTH_SHORT).show();\n            }\n        })\n        .addOnFailureListener(new\
  \ FailureListener() {\n            @Override\n            public void onFailure(Exception\
  \ exception) {\n                Toast.makeText(MainActivity.this,\n            \
  \            \"Module installation failed\" + exception.toString(),\n          \
  \              Toast.LENGTH_SHORT).show();\n            }\n        });\n}\n```\n\
  \n编辑 `Gradle Scripts` -> `build.gradle` (Module: `DynamicFeature.app`) 文件并增加 `versionCode`\
  \ 和 `versionName` 的值，以便将新版本的应用 bundle 上传进行测试：\n\n```gradle\nandroid {\n    versionCode\
  \ 2\n    versionName \"2.0\"\n}\n```\n\n重复此步骤，在 `Gradle Scripts` -> `build.gradle`\
  \ (Module: `DynamicFeature.my_dynamic_feature`) 中声明一个匹配的版本号。\n\n生成一个包含更改的新 app bundle，然后返回\
  \ `Google Play Console` 中该应用的 `Testing` -> `Internal testing` 页面，如图 86-8 所示点击 `Create\
  \ new release` 按钮：\n\n![](img/as_4.1_dynamic_feature_new_release.jpg)\n\n图 86-8\n\
  \n按照步骤上传新的 app bundle 并将其推向内部测试。在测试设备上，打开 `Google Play Store` 应用并确保 `Install` 按钮已变为\
  \ `Update` 按钮（如果没有变成，请关闭应用商店并在等待几分钟后重试）并更新到新版本。一旦更新完成，运行应用，点击 `Install Feature`\
  \ 按钮并检查 `Toast` 消息以确保安装成功开始。在下载功能时，屏幕顶部的状态栏将短暂出现下载图标。一旦下载完成，点击 `Launch Feature`\
  \ 按钮。\n\n如果安装失败或应用程序崩溃，可以通过 `LogCat` 输出确定原因。要查看此输出，请将设备连接到开发计算机，打开终端或命令行窗口并执行以下命令：\n\
  \n```bash\nadb logcat\n```\n\n此 `adb` 命令将实时显示 `LogCat` 输出，包括应用程序遇到问题或崩溃时生成的任何异常或诊断错误。\n\
  \n# 86.10 添加更新监听器\n\n为了更详细地跟踪动态功能的安装进度，可以在应用中添加 `SplitInstallStateListener` 的实例。由于可以同时安装多个功能模块，需要添加代码来跟踪分配给安装过程的\
  \ `session ids`。首先添加一些导入，在 `MainActivity.java` 文件中声明包含当前 `sessionId` 的变量，并修改 `installFeature()`\
  \ 方法，以便每次成功启动安装时存储 `sessionId` 并注册监听器：\n\n```java\nimport com.google.android.play.core.splitinstall.SplitInstallState;\n\
  import com.google.android.play.core.splitinstall.SplitInstallStateUpdatedListener;\n\
  import com.google.android.play.core.splitinstall.model.SplitInstallStatus;\nimport\
  \ java.util.Locale;\n\npublic class MainActivity extends AppCompatActivity {\n \
  \   private MyHomePage binding;\n    private SplitInstallManager manager;\n    private\
  \ int sessionId = 0;\n\n    public void installFeature(View view) {\n        manager.registerListener(listener);\n\
  \        manager.startInstall(request)\n            .addOnSuccessListener(new OnSuccessListener<Integer>()\
  \ {\n                @Override\n                public void onSuccess(Integer sessionId)\
  \ {\n                    sessionId = sessionId;\n                    Toast.makeText(MainActivity.this,\n\
  \                            \"Module installation started\",\n                \
  \            Toast.LENGTH_SHORT).show();\n                }\n            })\n  \
  \          // ...\n    }\n}\n```\n\n\n\n\n接下来，实现监听器代码，如下如下：\n\n```java\nSplitInstallStateUpdatedListener\
  \ listener = new SplitInstallStateUpdatedListener() {\n    @Override\n    public\
  \ void onStateUpdate(SplitInstallSessionState state) {\n        if (state.sessionId()\
  \ == mySessionId) {\n            switch (state.status()) {\n                case\
  \ SplitInstallSessionStatus.DOWNLOADING:\n                    long size = state.totalBytesToDownload();\n\
  \                    long downloaded = state.bytesDownloaded();\n              \
  \      binding.statusText.setText(String.format(Locale.getDefault(),\n         \
  \                   \"%d of %d bytes downloaded.\", downloaded, size));\n      \
  \              break;\n                case SplitInstallSessionStatus.INSTALLING:\n\
  \                    binding.statusText.setText(\"Installing feature\");\n     \
  \               break;\n                case SplitInstallSessionStatus.DOWNLOADED:\n\
  \                    binding.statusText.setText(\"Download Complete\");\n      \
  \              break;\n                case SplitInstallSessionStatus.INSTALLED:\n\
  \                    binding.statusText.setText(\"Installed - Feature is ready\"\
  );\n                    break;\n                case SplitInstallSessionStatus.CANCELED:\n\
  \                    binding.statusText.setText(\"Installation cancelled\");\n \
  \                   break;\n                case SplitInstallSessionStatus.PENDING:\n\
  \                    binding.statusText.setText(\"Installation pending\");\n   \
  \                 break;\n                case SplitInstallSessionStatus.FAILED:\n\
  \                    binding.statusText.setText(\"Installation Failed. Error code:\
  \ \" + state.errorCode());\n                    break;\n            }\n        }\n\
  \    }\n};\n```\n\n该监听器捕获许多常见的安装状态并相应更新状态文本，提供有关下载大小和已下载字节总数的信息。在继续之前，添加 `onPause()`\
  \ 和 `onResume()` 生命周期方法，以确保在应用处于非活动状态时注销监听器：\n\n```java\n@Override\npublic void\
  \ onResume() {\n    manager.registerListener(listener);\n    super.onResume();\n\
  }\n\n@Override\npublic void onPause() {\n    manager.unregisterListener(listener);\n\
  \    super.onPause();\n}\n```\n\n通过增加模块级 `build.gradle` 文件中的版本号、生成并上传新的应用 bundle\
  \ 并进行发布来测试监听器是否工作正常。如果设备上已经安装了动态功能模块，`Play Core Library` 类将忽略再次下载该模块的尝试。因此，为了充分测试监听器，必须在安装更新后的版本之前从\
  \ Play Store 内部卸载应用。当然，在移除应用后，将没有“更新”按钮来通知我们新版本已就绪。向下滚动应用页面到“关于应用”，选择它，并检查图 8-9\
  \ 所示的“应用信息”部分中的“版本”字段。如果仍列出之前的版本，退出应用并等待几分钟后再再次检查。一旦列出新版本，完成安装，打开应用并检查在下载动态功能模块时状态文本是否适当地更新。\n\
  \n### 使用延迟安装 (Deferred Installation)\n\n延迟安装会导致动态功能模块在后台下载，并将根据操作系统的决定完成。当启动延迟安装时，监听器将以挂起状态被调用，但除了检查模块是否已安装外，无法跟踪安装进度。要尝试延迟安装，请修改\
  \ `installFeature()` 方法如下所示：\n\n```java\npublic void installFeature(View view) {\n\
  \    manager.deferredInstall(Arrays.asList(\"my_dynamic_feature\"));\n}\n```\n\n\
  注意，`deferredInstall()` 方法传递了一个数组，允许对多个模块进行延迟安装。\n\n### 移除动态模块 (Removing a Dynamic\
  \ Module)\n\n本项目的最后一个任务是在 `MainActivity.java` 文件中实现 `deleteFeature()` 方法如下：\n\n\
  ```java\nimport java.util.Collections;\n\npublic void deleteFeature(View view) {\n\
  \    manager.deferredUninstall(Collections.singletonList(\"my_dynamic_feature\"\
  ));\n}\n```\n\n该功能的移除将由操作系统在需要额外存储空间时在后台执行。与 `deferredInstall()` 方法一样，可以在单次调用中调度多个功能的移除计划。\n\
  \n### 总结 (Summary)\n\n本章通过创建一个示例应用，演示了如何在 Android 应用中使用动态功能模块。涵盖的主题包括动态功能模块的创建，以及如何使用\
  \ `Play Core Library` 的类和方法来安装和管理动态功能模块。\n\n# 战：使用 Material Design 3 主题 (Working\
  \ with Material Design 3 Theming)\n\nAndroid 应用的外观旨在符合 Material Design 定义的一系列指南。Material\
  \ Design 由 Google 开发，旨在为不同应用之间提供设计上的一致性，同时允许应用开发者在颜色、排版和形状选择方面包含自己的品牌形象（这一概念被称为\
  \ Material 主题）。除了设计指南外，Material Design 还包含了一套用于设计用户界面布局的 UI 组件，我们在本书中一直在使用其中的许多。在本章中，我们将概述\
  \ Android Studio 项目中主题化是如何运作的，并探索如何修改为新创建的项目提供的默认设计配置，以满足您的品牌需求。\n\n### Material\
  \ Design 2 与 Material Design 3\n\n在开始之前，重要的是，Google 目前正在从 Material Design 2 过渡到\
  \ Material Design 3，使用 Android Studio Chipmunk 创建的项目除非在创建新项目时选择“Basic Activity (Material3)”模板，否则默认切换到\
  \ Material Design 2。Material Design 3 为 Material You 提供了基础，Material You 是 Android\
  \ 12 中引入的一项功能，允许应用自动调整主题元素以匹配用户在设备上配置的偏好。例如，Material Design 3 提供的动态颜色支持允许应用中使用的颜色自动适应以辅补用户的壁纸选择。\n\
  \n### 理解 Material Design 主题 (Understanding Material Design Theming)\n\n我们当然知道 Android\
  \ 应用的用户界面是通过组装布局、文本字段和按钮等组件创建的。除非我们在 XML 布局资源文件中或通过编写代码专门覆盖颜色属性，否则所有这些组件都使用默认颜色显示。这些默认颜色由项目的主题定义。主题由一组颜色槽（在\
  \ `themes.xml` 文件中声明）组成，并为其分配了颜色值（在 `colors.xml` 文件中声明）。每个 UI 组件在内部编程时使用主题颜色槽作为特定属性的默认颜色（例如\
  \ `Text` 小部件的前景和背景颜色）。因此，我们可以通过更改分配给特定主题槽的颜色来简单地更改应用的主题。当应用运行时，在渲染用户界面时，新的默认颜色将作为所有组件的默认值。\n\
  \n### Material Design 2 主题 (Material Design 2 Theming)\n\n\n\n\n在探索 Material Design\
  \ 3 之前，我们首先需要查看 Material Design 2 如何在 Android Studio 项目中使用。应用程序项目使用的主题被声明为 `AndroidManifest.xml`\
  \ 文件中 `application` 元素的属性，例如：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n   \
  \ package=\"com.ebookfrenzy.themedemo\">\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher_round\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/Theme.MyDemoApp\">\n        <activity\n.\n\
  .\n.\n```\n\n正如之前之前讨论的，所有与项目主题相关的文件都包含在 `res -> values` 文件夹下的 `colors.xml` 和 `themes.xml`\
  \ 文件中，如图图 87-1 所示：\n\n![](img/as_theme_files_in_project_tool_window.jpg)\n\n图 87-1\n\
  \n主题本身位于位于 `themes` 文件夹下的两个 `themes.xml` 文件中。这些资源文件声明了不同的色板，包含 Material 主题颜色槽，用于设备处于浅色模式或深色模式时。请注意，每个文件中的\
  \ `style` 名称属性必须与 `AndroidManifest.xml` 文件中引用的名称匹配：\n\n```xml\n<resources xmlns:tools=\"\
  http://schemas.android.com/tools\">\n    <!-- Base application theme. -->\n    <style\
  \ name=\"Theme.MyDemoApp\" parent=\"Theme.MaterialComponents.DayNight.DarkActionBar\"\
  >\n        <!-- Primary brand color. -->\n        <item name=\"colorPrimary\">@color/purple_500</item>\n\
  \        <item name=\"colorPrimaryVariant\">@color/purple_700</item>\n        <item\
  \ name=\"colorOnPrimary\">@color/white</item>\n        <!-- Secondary brand color.\
  \ -->\n        <item name=\"colorSecondary\">@color/teal_200</item>\n.\n.\n```\n\
  这些颜色槽（也称为颜色属性）被 Material 组件用于在屏幕上渲染时设置颜色。例如，`colorPrimary` 颜色槽被用作 Material Button\
  \ 组件的背景颜色。分配给槽的实际颜色声明在 `colors.xml` 资源文件中，如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<resources>\n    <color name=\"purple_200\">#FFBB86FC</color>\n    <color\
  \ name=\"purple_500\">#FF6200EE</color>\n    <color name=\"purple_700\">#FF3700B3</color>\n\
  \    <color name=\"teal_200\">#FF03DAC5</color>\n    <color name=\"teal_700\">#FF018786</color>\n\
  \    <color name=\"black\">#FF000000</color>\n    <color name=\"white\">#FFFFFFFF</color>\n\
  </resources>\n```\n\n例如，`colorPrimary` 槽被分配了颜色 `purple_500`，而该颜色反过来分配了 RGB 颜色值 `FF6200EE`。\n\
  \n创建自定义主题仅需编辑这些文件以使用不同的颜色设置。这些更改将由 Material 组件用作默认颜色。\n\n## 87.4 Material Design\
  \ 3 主题\n\nMaterial Design 3 (MD3) 仍然使用 `colors.xml` 和 `themes.xml` 文件，但为 MD3 组件提供了更广泛的颜色槽供使用。事实上，MD3\
  \ 提供了超过 25 个颜色槽用于自定义应用程序主题。颜色的名称也不同，因为它们描述的是颜色的用途，而不是颜色本身。在 Material Design 2 中，例如，我们有一个命名为\
  \ `purple_500` 的颜色：\n\n```xml\n<color name=\"purple_500\">#FF6200EE</color>\n```\n\
  \n这反过来被用于浅色模式下 `themes.xml` 文件中的 `colorPrimary` 主题槽：\n\n```xml\n<item name=\"colorPrimary\"\
  >@color/purple_500</item>\n```\n\n假设我们需要将 `colorPrimary` 从紫色改为红色。当然，我们只需要将一种红色的\
  \ RGB 值分配给 `purple_500` 颜色声明即可。不幸的是，我们现在有了一个名称暗示它是紫色的红色颜色声明。唯一的选项是在 `colors.xml`\
  \ 文件为红色颜色添加新条目，然后将其分配给 `themes.xml` 文件中的 `colorPrimary` 槽。这种方法虽然可行，但为了实现这一点，我们必须同时编辑颜色和主题文件。在\
  \ MD3 中，颜色名称不再引用它们所代表的实际颜色。MD3 主题文件中的 `colorPrimary` 槽声明如下：\n\n```xml\n<item name=\"\
  colorPrimary\">@color/md_theme_light_primary</item>\n```\n\n该颜色随后在 `colors.xml`\
  \ 文件中声明：\n\n```xml\n<color name=\"md_theme_light_primary\">#B82000</color>\n```\n\
  \n我们现在可以更改此颜色的 RGB 颜色值，同时保持 `themes.xml` 文件不变，且无需创建新的颜色元素。\n\n现在我们可以在更改此颜色的 RGB\
  \ 颜色值的同时保持 `themes.xml` 文件不变，且无需创建新的颜色元素。\n\n在 MD3 主题文件中，`colorPrimary` 槽的声明如下：\n\
  \n```xml\n<item name=\"colorPrimary\">@color/md_theme_light_primary</item>\n```\n\
  \n该颜色随后在 `colors.xml` 文件中声明：\n\n```xml\n<color name=\"md_theme_light_primary\">#B82000</color>\n\
  ```\n\n我们现在可以更改此颜色的 RGB 颜色值，同时保持 `themes.xml` 文件不变，且无需创建新的颜色元素。\n\n在 MD3 主题文件中，`colorPrimary`\
  \ 槽的声明如下：\n\n```xml\n<item name=\"colorPrimary\">@color/md_theme_light_primary</item>\n\
  ```\n\n该颜色随后在 `colors.xml` 文件中声明：\n\n```xml\n<color name=\"md_theme_light_primary\"\
  >#B82000</color>\n```\n\n我们现在可以更改此颜色的 RGB 颜色值，同时保持 `themes.xml` 文件不变，且无需创建新的颜色元素。\n\
  \n在 MD3 主题文件中，`colorPrimary` 槽的声明如下：\n\n```xml\n<item name=\"colorPrimary\">@color/md_theme_light_primary</item>\n\
  ```\n\n该颜色随后在 `colors.xml` 文件中声明：\n\n```xml\n<color name=\"md_theme_light_primary\"\
  >#B82000</color>\n```\n\n我们现在可以更改此颜色的 RGB 颜色值，同时保持 `themes.xml` 文件不变，且无需创建新的颜色元素。\n\
  \n在 MD3 主题文件中，`colorPrimary` 槽的声明如下：\n\n```xml\n<item name=\"colorPrimary\">@color/md_theme_light_primary</item>\n\
  ```\n\n该颜色随后在 `colors.xml` 文件中声明：\n\n```xml\n<color name=\"md_theme_light_primary\"\
  >#B82000</color>\n```\n\n我们现在可以更改此颜色的 RGB 颜色值，同时保持 `themes.xml` 文件不变，且无需创建新的颜色元素。\n\
  \n在 MD3 主题文件中，`colorPrimary` 槽的声明如下：\n\n```xml\n<item name=\"colorPrimary\">@color/md_theme_light_primary</item>\n\
  ```\n\n在 `themes.xml` 文件中，`Base.Material3` 代替 `MaterialComponents`。例如，以下是摘自 `themes.xml`\
  \ 文件：\n\n```xml\n<resources>\n    <style name=\"Theme.MyApp\" parent=\"Theme.Material3.DarkActionBar\"\
  >\n        <item name=\"colorPrimary\">@color/md_theme_light_primary</item>\n  \
  \      <item name=\"colorOnPrimary\">@color/md_theme_light_onPrimary</item>\n  \
  \      <item name=\"colorPrimaryContainer\">@color/md_theme_light_primaryContainer</item>\n\
  \        <item name=\"colorOnPrimaryContainer\">@color/md_theme_light_onPrimaryContainer</item>\n\
  \        <item name=\"colorSecondary\">@color/md_theme_light_secondary</item>\n\
  \    </style>\n</resources>\n```\n\n在 `themes.xml` 文件中，`Base.Material3` 代替 `MaterialComponents`。例如，以下是摘自\
  \ `themes.xml` 文件：\n\n```xml\n<resources>\n    <style name=\"Theme.MyApp\" parent=\"\
  Theme.Material3.DarkActionBar\">\n        <item name=\"colorPrimary\">@color/md_theme_light_primary</item>\n\
  \        <item name=\"colorOnPrimary\">@color/md_theme_light_onPrimary</item>\n\
  \        <item name=\"colorPrimaryContainer\">@color/md_theme_light_primaryContainer</item>\n\
  \        <item name=\"colorOnPrimaryContainer\">@color/md_theme_light_onPrimaryContainer</item>\n\
  \        <item name=\"colorSecondary\">@color/md_theme_light_secondary</item>\n\
  \    </style>\n</resources>\n```\n\n在 `themes.xml` 文件中，`Base.Material3` 代替 `MaterialComponents`。例如，以下是摘自\
  \ `themes.xml` 文件：\n\n```xml\n<resources>\n    <style name=\"Theme.MyApp\" parent=\"\
  Theme.Material3.DarkActionBar\">\n        <item name=\"colorPrimary\">@color/md_theme_light_primary</item>\n\
  \        <item name=\"colorOnPrimary\">@color/md_theme_light_onPrimary</item>\n\
  \        <item name=\"colorPrimaryContainer\">@color/md_theme_light_primaryContainer</item>\n\
  \        <item name=\"colorOnPrimaryContainer\">@color/md_theme_light_onPrimaryContainer</item>\n\
  \        <item name=\"colorSecondary\">@color/md_theme_light_secondary</item>\n\
  \    </style>\n</resources>\n```\n\n在 `themes.xml` 文件中，`Base.Material3` 代替 `MaterialComponents`。例如，以下是摘自\
  \ `themes.xml` 文件：\n\n```xml\n<resources>\n    <style name=\"Theme.MyApp\" parent=\"\
  Theme.Material3.DarkActionBar\">\n        <item name=\"colorPrimary\">@color/md_theme_light_primary</item>\n\
  \        <item name=\"colorOnPrimary\">@color/md_theme_light_onPrimary</item>\n\
  \        <item name=\"colorPrimaryContainer\">@color/md_theme_light_primaryContainer</item>\n\
  \        <item name=\"colorOnPrimaryContainer\">@color/md_theme_light_onPrimaryContainer</item>\n\
  \        <item name=\"colorSecondary\">@color/md_theme_light_secondary</item>\n\
  \    </style>\n</resources>\n```\n\n在 `themes.xml` 文件中，`Base.Material3` 代替 `MaterialComponents`。例如，以下是摘自\
  \ `themes.xml` 文件：\n\n```xml\n<resources>\n    <style name=\"Theme.MyApp\" parent=\"\
  Theme.Material3.DarkActionBar\">\n        <item name=\"colorPrimary\">@color/md_theme_light_primary</item>\n\
  \        <item name=\"colorOnPrimary\">@color/md_theme_light_onPrimary</item>\n\
  \        <item name=\"colorPrimaryContainer\">@color/md_theme_light_primaryContainer</item>\n\
  \        <item name=\"colorOnPrimaryContainer\">@color/md_theme_light_onPrimaryContainer</item>\n\
  \        <item name=\"colorSecondary\">@color/md_theme_light_secondary</item>\n\
  \    </style>\n</resources>\n```\n\n在 `themes.xml` 文件中，`Base.Material3` 代替 `MaterialComponents`。例如，以下是摘自\
  \ `themes.xml` 文件：\n\n```xml\n<resources>\n    <style name=\"Theme.MyApp\" parent=\"\
  Theme.Material3.DarkActionBar\">\n        <item name=\"colorPrimary\">@color/md_theme_light_primary</item>\n\
  \        <item name=\"colorOnPrimary\">@color/md_theme_light_onPrimary</item>\n\
  \        <item name=\"colorPrimaryContainer\">@color/md_theme_light_primaryContainer</item>\n\
  \        <item name=\"colorOnPrimaryContainer\">@color/md_theme_light_onPrimaryContainer</item>\n\
  \        <item name=\"colorSecondary\">@color/md_theme_light_secondary</item>\n\
  \    </style>\n</resources>\n```\n\n在 `themes.xml` 文件中，`Base.Material3` 代替 `MaterialComponents`。例如，以下是摘自\
  \ `themes.xml` 文件：\n\n```xml\n<resources>\n    <style name=\"Theme.MyApp\" parent=\"\
  Theme.Material3.DarkActionBar\">\n        <item name=\"colorPrimary\">@color/md_theme_light_primary</item>\n\
  \        <item name=\"colorOnPrimary\">@color/md_theme_light_onPrimary</item>\n\
  \        <item name=\"colorPrimaryContainer\">@color/md_theme_light_primaryContainer</item>\n\
  \        <item name=\"colorOnPrimaryContainer\">@color/md_theme_light_onPrimaryContainer</item>\n\
  \        <item name=\"colorSecondary\">@color/md_theme_light_secondary</item>\n\
  \    </style>\n</resources>\n```\n\n在 `themes.xml` 文件中，`Base.Material3` 代替 `MaterialComponents`。例如，以下是摘自\
  \ `themes.xml` 文件：\n\n```xml\n<resources>\n    <style name=\"Theme.MyApp\" parent=\"\
  Theme.Material3.DarkActionBar\">\n        <item name=\"colorPrimary\">@color/md_theme_light_primary</item>\n\
  \        <item name=\"colorOnPrimary\">@color/md_theme_light_onPrimary</item>\n\
  \        <item name=\"colorPrimaryContainer\">@color/md_theme_light_primaryContainer</item>\n\
  \        <item name=\"colorOnPrimaryContainer\">@color/md_theme_light_onPrimaryContainer</item>\n\
  \        <item name=\"colorSecondary\">@color/md_theme_light_secondary</item>\n\
  \    </style>\n</resources>\n```\n\n在 `themes.xml` 文件中，`Base.Material3` 代替 `MaterialComponents`。例如，以下是摘自\
  \ `themes.xml` 文件：\n\n```xml\n<resources>\n    <style name=\"Theme.MyApp\" parent=\"\
  Theme.Material3.DarkActionBar\">\n        <item name=\"colorPrimary\">@color/md_theme_light_primary</item>\n\
  \        <item name=\"colorOnPrimary\">@color/md_theme_light_onPrimary</item>\n\
  \        <item name=\"colorPrimaryContainer\">@color/md_theme_light_primaryContainer</item>\n\
  \        <item name=\"colorOnPrimaryContainer\">@color/md_theme_light_onPrimaryContainer</item>\n\
  \        <item name=\"colorSecondary\">@color/md_theme_light_secondary</item>\n\
  \    </style>\n</resources>\n```\n\nMD3 中的颜色槽被分为 Primary、Secondary、Tertiary、Error、Background\
  \ 和 Surface。这些槽通常由一个基础颜色和一个“on”颜色组成对。这通常对应于 Material 组件的背景和前景颜色。\n\n特定的颜色组会根据组件而不同。例如，Material\
  \ Button 组件将使用 `colorPrimary` 基础颜色作为背景，使用 `colorOnPrimary` 用于内容（即文本或图标）。FloatingActionButton\
  \ 组件则使用 `colorPrimaryContainer` 作为背景，`colorPrimaryContainer` 作为前景。\n\nMD2 和 MD3\
  \ 之间最大的区别是支持动态颜色和 Material You，这两者都将在下一章中介绍。\n\n## 87.5 构建自定义主题\n\n正如我们目前所见，实现主题的代码工作相对简单。然而，困难的部分通常是选择一组组成主题的颜色。幸运的是，Google\
  \ 开发了一个工具，可以为应用程序设计自定义颜色主题。该工具被称为 Material Theme Builder，可以在：\n\n[`material-foundation.github.io/material-theme-builder`](https://material-foundation.github.io/material-theme-builder)\n\
  \n在工具内部，选择 Custom 标签（如图 87-2 中的 A），通过点击颜色矩形显示颜色选择框为主颜色键（B）进行颜色选择。一旦选择了颜色，主题面板（C）将更改以反映所有\
  \ MD3 颜色槽的推荐颜色。生成的 Secondary、Neutral 和 Neutral 颜色可以通过点击圆形（D）并在颜色面板中选择不同的颜色来覆盖。\n\
  \n要将主题整合到设计中，点击 Export 按钮（E）并选择 Android View（XML）选项。下载后，可以使用 `colors.xml` 和 `themes.xml`\
  \ 文件替换项目中的现有文件。请注意，导出的两个 `themes.xml` 文件中的主题名称需要更改以匹配您的项目。\n\n## 87.6 总结\n\n\n\n\
  \nMaterial Design 提供了定义 Android 应用外观和呈现方式的指南和组件。通过设计主题可以为应用应用个人品牌化，这些主题指定了应用显示时应使用的颜色、字体和形状。Google\
  \ 目前正在引入 Material Design 3，它取代了 Material Design 2，并支持包括动态颜色在内的 Material You 新功能。为了设计您自己的主题，Google\
  \ 还提供了 Material Theme Builder，它可以轻松地完成选择互补主题颜色的任务。一旦使用此工具设计好主题，就可以导出相应的文件并在 Android\
  \ Studio 项目中使用。\n\n# 88. 从 Material Design 2 迁移到 Material Design 3\n\n本章将演示如何将 Android\
  \ Studio 项目从 Material Design 2 迁移到 Material Design 3，并集成使用 Material Theme Builder\
  \ 工具生成的自定义主题。教程还将演示如何为应用添加对 Material You 动态主题颜色的支持和测试。\n\n## 88.1 创建迁移 项目\n\n在欢迎界面选择\
  \ `New Project`（新建项目）选项，在弹出的新项目对话框中，点击 `Next`（下一步）按钮之前选择 `Empty Activity`（空活动）模板。\n\
  \n在 `Name`（名称）字段中输入 `ThemeMigration`，并指定包名为 `com.ebookfrenzy.thememigration`。在点击\
  \ `Finish`（完成）按钮之前，将 `Minimum API level`（最低 API 级别）设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language`（语言）菜单更改为 `Java`。\n\n## 88.2 设计界面\n\n主活动将包含一个简单的布局，其中包含一些界面组件，这些组件将让我们看到切换到\
  \ Material Design 3 以及本章之后进行主题工作的效果。有关 MD3 组件的信息，请参考以下网页：\n\n[`material.io/blog/migrating-material-3`](https://material.io/blog/migrating-material-3)\n\
  \n布局将在 `activity_main.xml` 文件中设计，该文件目前包含一个 `Text` 视图。在布局编辑器中打开此文件，删除 `Text` 视图，禁用\
  \ `Autoconnect`（自动连接）模式（在[图 88-1]中标记为 A），并点击按钮以清除布局中的所有约束（B）。\n\n![](img/as_theme_demo_disable_autoconnect.jpg)\n\
  图 88-1\n\n从调色板的 `Buttons`（按钮）部分将 `Chip`、`CheckBox`、`Switch` 和 `Button` 视图拖到布局画布上。接下来，将\
  \ `FloatingActionButton` 拖到布局画布上，使其位于 `Button` 组件下方。当提示选择显示在 `FloatingActionButton`\
  \ 上的图标时，从资源工具窗口内选择 `ic_lock_power_off` 图标，如图[图 88-2]所示：\n\n![](img/as_theme_demo_select_icon.jpg)\n\
  \n图 88-2\n\n将 `Chip` 组件的 `text` 属性更改为“This is my chip”，并将 `chipIcon` 属性设置为 `@android:drawable/ic_btn_speak_now`，以便布局看起来像[图\
  \ 88-3]左侧所示的：\n\n![](img/as_theme_demo_layout.jpg)\n图 88-3\n\n要设置图中蓝图视图中所示的约束，选择所有组件，右键点击\
  \ `Chip` 视图，从生成的菜单中选择 `Chains -> Create Vertical Chain`（链 -> 创建垂直链）。重复此步骤，这次选择 `Center\
  \ -> Horizontally in Parent`（在父布局中水平居中）菜单选项。\n\n在设备或模拟器上编译并运行应用，验证用户界面是否与上述[图 88-3]所示。该布局使用了\
  \ Material Design 2 组件。下一步是将主题迁移到 Material Design 3。\n\n## 88.3 迁移到 Material Design\
  \ 3\n\n要切换到 Material Design 3 组件，我们只需要编辑位于 `app -> res -> values -> themes` 下的两个\
  \ `themes.xml` 文件。第一个 `themes.xml` 中 `style` 元素的 `name` 属性需要更改如下：\n\n```xml\n<resources\
  \ xmlns:tools=\"http://schemas.android.com/tools\">\n    <!-- Base application theme.\
  \ -->\n    <style name=\"Theme.ThemeMigration\" parent=\"Theme.Material3.Light\"\
  >\n```\n\n同样，对 `themes.xml (night)` 文件进行以下更改，以便将深色模式迁移到 MD3：\n\n```xml\n<resources\
  \ xmlns:tools=\"http://schemas.android.com/tools\">\n    <!-- Base application theme.\
  \ -->\n    <style name=\"Theme.ThemeMigration\" parent=\"Theme.Material3.Dark\"\
  >\n```\n\n做出更改后，再次运行应用，并注意 MD2 和 MD3 之间的外观差异，如下方的[图 88-4]所示\n\n![](img/as_theme_demo_md2_vs_md3.jpg)\n\
  图 88-4\n\n现在我们已经将项目迁移到 MD3，下一步是创建一个自定义主题并将其应用到项目中。\n\n## 88.4 构建新主题\n\n项目的主题将使用\
  \ Material Theme Builder 设计并生成。打开浏览器窗口并导航到以下 URL 以访问构建器：\n\n[`material-foundation.github.io/material-theme-builder/`](https://material-foundation.github.io/material-theme-builder/)\n\
  \n一旦加载了构建器，点击屏幕顶部的 `Custom`（自定义）按钮，然后点击 `Core` 部分中的 `Primary` 圆形以显示颜色选择器。从颜色选择器中选择任何颜色作为主题的基础：\n\
  \n![](img/as_theme_builder_change_color.jpg)\n图 88-5\n\n在 `Your Theme`（您的主题）面板中查看颜色方案，并进行任何必要的颜色调整，直到您对颜色满意。一旦主题就绪，点击右上角的\
  \ `Export`（导出）按钮并选择 `Android (XML)` 。在提示时，将文件保存到计算机上的合适位置。主题将保存为名为 `material-theme.zip`\
  \ 的压缩文件。\n\n使用适用于操作系统的工具解压主题文件，它应包含以下内容：\n\n- `values/colors.xml`: 颜色定义。\n- `values/themes.xml`:\
  \ 亮模式的主题。\n- `values-night/themes.xml`: 深色模式的主题。\n\n现在主题文件已经生成，需要将它们集成到 Android\
  \ Studio 项目中。\n\n## 88.5 将主题添加到项目\n\n在我们将新主题添加到项目之前，我们需要删除旧的 MD2 主题文件。如果 `Project`\
  \ 工具窗口处于 `Project` 模式，这样做更容易。使用 `Project` 工具窗口顶部的菜单如下所示，并选择 `Project Files` ：\n\n\
  ![](img/as_theme_demo_project_files_menu_option.jpg)\n图 88-6\n\n在选择 `Project Files`\
  \ 模式的情况下，导航到 `app -> src -> main -> res -> values` 文件夹，选择并删除 `colors.xml` 和 `themes.xml`\
  \ 文件。此外，删除 `values-night` 文件夹中的 `themes.xml` 文件。\n\n打开操作系统的文件导航工具，找到新主题 `values`\
  \ 文件夹中的 `colors.xml` 和 `themes.xml` 文件，并将它们复制到 `Project` 工具窗口的 `values` 文件夹中。重复此步骤复制\
  \ `values-night` 文件夹中的 `themes.xml` 文件，这次粘贴到 `values-night` 文件夹中。\n\n将 `Project`\
  \ 工具窗口切换回 `Android` 模式，此时值资源部分应与[图 88-7]匹配：\n\n![](img/as_theme_demo_vales_resources_tree.jpg)\n\
  图 88-7\n\n检查两个 `themes.xml` 文件，如果 `colorInversePrimary` 和 `colorShadow` 项显示为红色（表示未解析），请在继续之前从文件中删除这些行。\n\
  \n接下来，修改亮色 `themes.xml` 文件以匹配当前项目如下：\n\n```xml\n<resources>\n    <style name=\"\
  Base.Theme.ThemeMigration\" parent=\"Theme.Material3.Light.NoActionBar\">\n```\n\
  \n\n\n\n\n```xml\n<item name=\"colorPrimary\">@color/md_theme_light_primary</item>\n\
  <item name=\"colorOnPrimary\">@color/md_theme_light_onPrimary</item>\n</style>\n\
  <style name=\"Theme.ThemeMigration\" parent=\"Base.Theme.ThemeMigration\" />\n</resources>\n\
  ```\n\n重复这些步骤以对 `themes.xml (night)` 文件进行相同的修改。\n\n返回 `activity_main.xml` 文件或再次运行应用程序，以确认用户界面现在已使用自定义主题颜色渲染。\n\
  \n## 88.6 启用动态颜色支持\n\n为了测试动态颜色，应用程序需要在运行 Android 12 或更高版本且设置了正确壁纸设置的设备或模拟器上运行。在设备或模拟器上，启动\
  \ `Settings`（设置）应用并在选项列表中选择 `Wallpaper & style`（壁纸和样式）。在壁纸设置屏幕上点击更改壁纸的选项（在图 88-8\
  \ 中标记为 A），并选择一张包含与你的主题颜色显著不同的壁纸图像。选择后，将壁纸分配到主屏幕。\n\n返回“壁纸和样式”屏幕，在尝试不同的颜色方案按钮（C）之前，确保选中了\
  \ `Wallpaper colors`（壁纸颜色）选项（B）。每点击一个选项，壁纸示例将更改以反映选择：\n\n![](img/compose_theme_wallpaper_and_styles.jpg)\n\
  \n图 88-8\n\n要启用动态颜色，我们需要调用 `DynamicColors` 类的 `applyToActivitiesIfAvailable()` 方法。为了为整个应用程序启用动态颜色支持，这需要在自定义\
  \ `Application` 实例的 `onCreate()` 方法内部调用它。首先，在项目的 `app -> java -> com -> ebookfrenzy\
  \ -> thememigration` 下添加一个新的 Java 类文件，命名为 `ThemeMigrationApplication.java` 并对其进行如下修改：\n\
  \n```java\npackage com.ebookfrenzy.thememigration;\n\nimport android.app.Application;\n\
  import com.google.android.material.color.DynamicColors;\n\npublic class ThemeMigrationApplication\
  \ extends Application {\n    @Override\n    public void onCreate() {\n        super.onCreate();\n\
  \        DynamicColors.applyToActivitiesIfAvailable(this);\n    }\n}\n```\n\n创建自定义的\
  \ `Application` 类后，我们现在需要配置项目使用此类而不是默认的 `Application` 实例。执行此操作，编辑 `AndroidManifest.xml`\
  \ 文件并添加引用新类的 `android:name` 元素：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n   \
  \ package=\"com.ebookfrenzy.thememigation\">\n    <application\n        android:name=\"\
  .ThemeMigrationApplication\"\n        android:allowBackup=\"true\">\n```\n\n构建并运行应用程序，并注意布局现在使用与壁纸颜色匹配的主题。将\
  \ `ThemeMigration` 应用程序放入后台，返回“壁纸和样式”设置屏幕并选择不同的壁纸。再次将 `ThemeMigration` 应用程序带到前台，此时它将动态适应以匹配新的壁纸。\n\
  \n## 88.7 总结\n\n在本章中，我们演示了如何将 Android Studio 项目从 Material Design 2 迁移到 Material\
  \ Design 3。该项目还利用 Material Theme Builder 设计了自定义主题，并解释了将生成的主题文件集成到旧留项目的步骤。最后，本章演示了如何实现和使用\
  \ Android 12 的 Material You 动态颜色功能。\n\n## 89. Android Studio 中的 Gradle 概述\n\n到此为止，人们在很大程度上认为，Android\
  \ Studio 会自动采取必要的步骤来编译和运行创建的应用程序项目。Android Studio 一直通过一个名为 `Gradle` 的系统在后台实现这一点。现在是查看如何使用\
  \ `Gradle` 来编译和打包应用程序项目中的各种元素，并开始探索当在 Android Studio 中构建项目有更高级需求时如何配置此系统了。\n\n###\
  \ 89.1 Gradle 概述\n\n`Gradle` 是一个自动化构建工具包，它允许通过一组构建配置文件来配置和管理项目的构建方式。这包括定义如何构建项目、为了成功构建项目需要满足哪些依赖项，以及构建过程的最终结果（或结果）应该是什么。\n\
  \n`Gradle` 的优势在于它为开发者提供的灵活性。`Gradle` 系统是一个自包含的、基于命令行的环境，可以通过使用插件集成到其他环境中。在 Android\
  \ Studio 的情况下，`Gradle` 集成是通过经过适当命名的 Android Studio 插件提供的。\n\n尽管 Android Studio 插件允许从\
  \ Android Studio 内部启动和管理 `Gradle` 任务，但仍可以使用 `Gradle` 命令行包装器来构建基于 Android Studio\
  \ 项目，包括在未安装 Android Studio 的系统上。\n\n构建项目的配置规则声明在基于 Groovy 编程语言的 `Gradle` 构建文件和脚本中。\n\
  \n### 89.2 Gradle 与 Android Studio\n\n`Gradle`为构建 Android 应用程序项目带来了许多强大功能。一些关键功能如下：\n\
  \n#### 89.2.1 合理默认值\n\n`Gradle` 实现了一种被称为“约定优于配置”（convention over configuration）的概念。这简单意味着\
  \ `Gradle` 拥有一套预定义的合理默认配置设置，除非被构建文件中的设置覆盖，否则将使用它们。这意味着可以使用所需的极少配置执行构建。只有当默认配置不满足你的构建需求时，才需要修改构建文件。\n\
  \n#### 89.2.2 依赖项\n\n`Gradle` 的另一个关键领域是依赖项。例如，考虑 Android Studio 项目中的一个模块触发了加载另一个模块的意图。第一个模块实际上对第二个模块有依赖，因为如果无法找到并启动第二个模块，应用程序将失败。这种依赖关系可以在第一个模块的\
  \ Gradle 构建文件中声明，以便将第二个模块包含在构建中，或者在无法找到或构建第二个模块时标记错误。其他依赖项示例是项目编译和运行所需的库和 JAR 文件。\n\
  \n`Gradle` 依赖项可以分类为本地或远程。本地依赖项引用正在构建的计算机系统本地文件系统上的项。远程依赖项指向远程服务器（通常称为仓库）上的项。\n\n\
  Android Studio 项目使用另一个名为 Maven 的项目管理工具来处理远程依赖项。如果在 Gradle 构建文件中使用 Maven 语法声明了远程依赖项，则该依赖项将从指定的仓库自动下载并包含在构建过程中。例如，以下依赖声明会将\
  \ AppCompat 库从 Google 仓库添加到项目中：\n\n```gradle\nimplementation 'androidx.appcompat:appcompat:1.2.0'\n\
  ```\n\n#### 89.2.3 构建变体\n\n\n\n\n\n除了依赖项，`Gradle` 还为 Android Studio 项目提供了构建变体（build\
  \ variant）支持。这允许从单个项目中构建应用程序的多个变体。Android 运行在许多设备上，涵盖了多种处理器类型和屏幕尺寸。为了尽可能覆盖广泛的设备类型和尺寸，通常需要为应用程序构建多个不同的变体（例如，一个适用于手机的用户界面，另一个则适用于平板电脑大小的屏幕）。通过使用\
  \ `Gradle`，这在 Android Studio 中是可以实现的。\n\n### 89.2.4 Manifest 条目\n\n每个 Android Studio\
  \ 项目都关联有一个 `AndroidManifest.xml` 文件，其中包含了有关应用程序的配置细节。在 `Gradle` 构建文件中可以指定许多清单条目，这些条目会在项目构建时自动生成到清单文件中。此功能与构建变体功能互补，允许为每个构建变体对应用版本号、应用\
  \ ID 和 SDK 版本信息等元素进行差异化配置。\n\n### 89.2.5 APK 签名\n\n名为“创建、测试和上传 Android App Bundle”\
  \ 的章节介绍了如何使用 Android Studio 环境创建带签名的发布 APK 文件。也可以将通过 Android Studio 用户界面输入的签名信息包含在\
  \ `Gradle` 构建文件中，以便可以从命令行生成带签名的 APK 文件。\n\n### 89.2.6 ProGuard 支持\n\n`ProGuard`\
  \ 是 Android Studio 自带的一个工具，它可以优化、收缩和混淆 Java 字节码，使其更高效且更难被反向工程（即他人通过分析编译后的 Java 字节码来识别应用程序逻辑的方法）。`Gradle`\
  \ 构建文件提供了控制在构建应用程序时是否对其运行 `ProGuard` 的能力。\n\n### 89.3 属性（Property）与设置 Gradle 构建文件\n\
  \n`gradle` 构建配置由一组配置、属性和设置文件组成。例如，`gradle.properties` 文件主要包含与 Java 虚拟机（`JVM`）使用的命令行标志相关的特殊设置、项目是否使用\
  \ `AndroidX` 库以及 Kotlin 编码风格支持。作为一名典型用户，你可能不需要更改此文件中的任何设置。\n\n另一方面，`settings.gradle`\
  \ 文件定义了当构建系统需要下载和安装构建项目所需的任何额外库和插件时，应该搜索哪些在线仓库，以及项目名称。一个典型的 `settings.gradle` 文件内容如下：\n\
  \n```gradle\npluginManagement {\n    repositories {\n        gradlePluginPortal()\n\
  \        google()\n        mavenCentral()\n    }\n}\n\ndependencyResolutionManagement\
  \ {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories\
  \ {\n        google()\n        mavenCentral()\n    }\n}\n\nrootProject.name = \"\
  AndroidSample\"\n\ninclude ':app'\n```\n\n与 `gradle.properties` 文件一样，可能不需要对此文件进行更改。\n\
  \n### 89.4 顶层 Gradle 构建文件\n\n一个完整的 Android Studio 项目包含了构建 Android 应用程序所需的所有内容，并由模块、库、清单文件和\
  \ `Gradle` 构建文件组成。\n\n每个项目包含一个顶层 `Gradle` 构建文件。该文件被列为 `build.gradle`（Project: `<project\
  \ name>`），并可以在项目工具窗口中找到，如图 89-1 所示：\n\n![](img/as_4.1_project_gradle_file.jpg)\n\
  \n图 89-1\n\n默认情况下，顶层 `Gradle` 构建文件的内容如下：\n\n```gradle\n// 顶层构建文件，可以在此处添加所有子项目/模块通用的配置选项。\n\
  \nplugins {\n    id 'com.android.application' version '7.1.0-rc01' apply false\n\
  \    id 'com.android.library' version '7.1.0-rc01' apply false\n}\n\ntask clean(type:\
  \ Delete) {\n    delete rootProject.buildDir\n}\n```\n\n目前，该文件仅声明了使用 `jcenter` 仓库获取远程库，并且构建依赖于\
  \ `Gradle` 的 Android 插件。在大多数情况下，没有对此构建文件进行任何更改。\n\n### 89.5 模块级 Gradle 构建文件\n\n\
  Android Studio 应用程序项目由一个或多个模块组成。例如，假设有一个名为 `GradleDemo` 的应用程序项目，它包含两个分别名为 `Module1`\
  \ 和 `Module2` 的模块。在这种情况下，每个模块都需要自己的 `Gradle` 构建文件。从项目结构的角度来看，它们的位置如下：\n\n- `Module1/build.gradle`\n\
  - `Module2/build.gradle`\n\n默认情况下，`Module1/build.gradle` 文件将类似于下方列表所示：\n\n```gradle\n\
  plugins {\n    id 'com.android.application'\n}\n\nandroid {\n    compileSdk 32\n\
  \    defaultConfig {\n        applicationId \"com.ebookfrenzy.demoapp\"\n      \
  \  minSdkVersion 26\n        targetSdkVersion 32\n        versionCode 1\n      \
  \  versionName \"1.0\"\n        testInstrumentationRunner \"androidx.test.runner.AndroidJUnitRunner\"\
  \n    }\n    buildTypes {\n        release {\n            minifyEnabled false\n\
  \            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),\
  \ 'proguard-rules.pro'\n        }\n    }\n    compileOptions {\n        sourceCompatibility\
  \ JavaVersion.VERSION_1_8\n        targetCompatibility JavaVersion.VERSION_1_8\n\
  \    }\n}\n\ndependencies {\n    implementation 'androidx.appcompat:4.1'\n    implementation\
  \ 'com.google.android.material:1.5.0'\n    implementation 'androidx.constraintlayout:2.1.3'\n\
  \    testImplementation 'junit:4.13+'\n    androidTestImplementation 'androidx.test.ext:junit:1.1.3'\n\
  \    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'\n}\n\
  ```\n\n从文件内容可见，构建文件首先声明使用 Android 插件：\n\n```gradle\nplugins {\n    id 'com.android.application'\n\
  }\n```\n\n`android` 部分规定了构建 `Module1` 时使用的 SDK 版本。\n\n```gradle\nandroid {\n   \
  \ compileSdk 32\n```\n\n`defaultConfig` 节定义的元素将在构建期间生成到模块的 `AndroidManifest.xml`\
  \ 中。这些设置可以在构建文件中修改，它们源自创建模块时在 Android Studio 中输入的设置：\n\n```gradle\ndefaultConfig\
  \ {\n    applicationId \"com.ebookfrenzy.demoapp\"\n    minSdkVersion 26\n    targetSdkVersion\
  \ 32\n    versionCode 1\n    versionName \"1.0\"\n    testInstrumentationRunner\
  \ \"androidx.test.runner.AndroidJUnitRunner\"\n}\n```\n\n`buildTypes` 节包含了在构建应用程序发布版本时是否以及如何对\
  \ APK 文件运行 `ProGuard` 的指令：\n\n```gradle\nbuildTypes {\n    release {\n         \
  \   minifyEnabled false\n            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),\
  \ 'proguard-rules.pro'\n        }\n}\n```\n\n按照当前配置，构建 `Module1` 时不会运行 `ProGuard`。要启用\
  \ `ProGuard`，需要将 `minifyEnabled` 条目从 `false` 改为 `true`。`proguard-rules.pro` 文件可以在模块目录下找到。\n\
  \n由于此文件中没有声明 `debug` `buildType`，将使用默认值（不带 `ProGuard`，使用调试密钥签名，并启用调试符号）。\n\n模块构建文件中还可以包含一个名为\
  \ `productFlavors` 的额外节，以便创建多个构建变体。\n\n\n\n\n\n```gradle\ntargetCompatibility JavaVersion.VERSION_1_8\n\
  }\n```\n\n最后，`dependencies` 部分列出了模块所依赖的任何本地和远程依赖。上面示例文件依赖行指定了需要从 Android 仓库中包含的\
  \ Android 库：\n\n```gradle\nimplementation 'androidx.core:core-ktx:1.7.0'\nimplementation\
  \ 'androidx.appcompat:appcompat:1.4.1'\n```\n\n注意，依赖声明包含了版本号，以指示应该包含哪个版本的库。\n\n\
  ## 89.6 在构建文件中配置签名设置\n\n本书的“创建、测试和上传 Android App Bundle” 章节涵盖了使用 Android Studio\
  \ 用户界面设置密钥和生成签名发布版 APK 文件的步骤。这些设置也可以在 `build.gradle` 文件的 `signingSettings` 部分中声明。例如：\n\
  \n```gradle\ndefaultConfig {\n\n}\n\nsigningConfigs {\n    release {\n        storeFile\
  \ file(\"keystore.release\")\n        storePassword \"your keystore password here\"\
  \n        keyAlias \"your key alias here\"\n        keyPassword \"your key password\
  \ here\"\n    }\n}\n\nbuildTypes {\n\n}\n```\n\n上面的示例将密钥密码信息直接嵌入到构建文件中。这种方法的另一种替代方案是从系统环境变量中提取这些值：\n\
  \n```gradle\nsigningConfigs {\n    release {\n        storeFile file(\"keystore.release\"\
  )\n        storePassword System.getenv(\"KEYSTOREPASSWD\")\n        keyAlias \"\
  your key alias here\"\n        keyPassword System.getenv(\"KEYPASSWD\")\n    }\n\
  }\n```\n\n另一种方法是配置构建文件，让 Gradle 在构建过程中提示输入密码：\n\n```gradle\nsigningConfigs {\n \
  \   release {\n        storeFile file(\"keystore.release\")\n        storePassword\
  \ System.console().readLine(\"\\nEnter Keystore password: \")\n        keyAlias\
  \ \"your key alias here\"\n        keyPassword System.console().readLIne(\"\\nEnter\
  \ Key password: \")\n    }\n}\n```\n\n## 89.7 从命令行运行 Gradle 任务\n\n每个 Android Studio\
  \ 项目都包含一个 Gradle 器工具，用于从命令行调用 Gradle 任务。该工具位于每个项目文件夹的根目录下。虽然该包装器在 Windows 系统上是执行的，但在\
  \ Linux 和 macOS 上使用之前，需要启用执行权限。要启用执行权限，请打开终端窗口，进入需要该包装器的项目文件夹，并执行以下命令：\n\n```bash\n\
  chmod +x gradlew\n```\n\n一旦文件具有了执行权限，则需要将文件路径添加到你的 `$PATH` 环境变量中，或者在运行名前缀加上 `./`\
  \ 来运行。例如：\n\n```bash\n./gradlew tasks\n```\n\nGradle 通过许多不同的任务来看待项目构建。可以通过在项目目录下运行以下命令来获取当前项目可用任务的完整列表（如果在\
  \ macOS 或 Linux 上运行，请记住在命令前加上 `./`）：\n\n```bash\ngradlew tasks\n```\n\n要构建适用于设备或模拟器测试的项目调试发布版，请使用\
  \ `assembleDebug` 选项：\n\n```bash\ngradlew assembleDebug\n```\n\n或者，构建应用程序的发布版本：\n\
  \n```bash\ngradlew assembleRelease\n```\n\n## 89.8 总结\n\n在大多数情况下，Android Studio\
  \ 在后台执行应用构建，无需开发人员干预。此构建过程是使用 Gradle 处理的，Gradle 是一种自动化构建工具包，旨在允许通过一组构建配置文件来配置和管理项目的构建方式。虽然\
  \ Gradle 的默认行为对于许多基础项目构建需求已经足够，但在更复杂的项目中，配置构建过程的需求是不可避免的。本章在 Android Studio 项目的背景概述了\
  \ Gradle 构建系统和配置文件。\n\n### 索引\n\n### 符号\n- `<application>` 475\n- `<fragment>` 237\n\
