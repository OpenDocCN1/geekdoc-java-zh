  \ web view 传递网页 URL 而不是动态创建的 HTML，例如：\n\n```java\nmyWebView.loadUrl(\"https://developer.android.com/index.html\"\
  );\n```\n\n同样重要的是，`WebViewClient` 配置只有在网页加载后自动打印时才是必要的。如果打印是由用户在页面加载后选择菜单启动的，则只需要在应用程序代码中包含上述的\
  \ `createWebPrintJob()` 方法。\n\n### 76.7.4 打印自定义文档\n\n虽然引入的 HTML 和图像打印功能为从 Android\
  \ 应用程序打印内容提供了便利，但显然这些选项对于更高级的打印需求过于简单。对于更复杂的打印任务，打印框架还提供了自定义文档打印支持。这允许将文本和图形形式的内容绘制在画布上并打印。\n\
  \n与可以相对容易实现的 HTML 和图像打印不同，自定义文档打印是一个更复杂的多阶段过程，该过程将在本书的“Android 自定义打印指南”章节中进行概述。这些步骤可以总结如下：\n\
  \n- 连接到 Android 打印管理器\n- 创建继承自 `PrintDocumentAdapter` 类的自定义打印适配器\n- 创建 `PdfDocument`\
  \ 实例来表示文档页\n- 获取 `PdfDocument` 实例的页的引用，每个页都关联有一个 `Canvas` 实例\n- 在页面画布上绘制内容\n- 通知打印框架文档已准备好打印\n\
  \n\n\n\n\n上述步骤中概述的自定义打印适配器需要实现若干方法，Android 系统将在打印过程中调用这些方法来执行特定任务。其中最重要的是`onLayout()`\
  \ 方法，它负责根据用户对纸张大小或页面方向等设置的更改来重新排列文档布局；以及`onWrite()` 方法，它负责渲染要打印的页面。本主题将在题为“Android\
  \ 自定义文档打印指南”的章节中详细介绍。\n\n## 76.8 总结\n\nAndroid SDK 包含了从运行中的应用程序内部打印内容的能力。打印输出可以定向到配置适当的打印机、本地\
  \ PDF 文件或通过 Google Drive 传输到云端。从 Android 应用程序开发者的角度来看，通过使用打印框架（Printing framework），可以在应用程序中使用这些功能。目前，最易实现的打印选项是涉及图像和\
  \ HTML 格式的内容。然而，更高级的打印可以使用该框架的自定义文档打印功能来实现。\n\n## 77. 一个 Android HTML 和 Web 内容打印示例\n\
  \n正如上一章（标题为“使用 Android 打印框架进行打印”）中所述的，Android 打印框架可以用于打印网页和动态创建的 HTML 内容。虽然这两种打印方法有许多相似之处，但也存在一些需要考虑的细微差别。本章将通过创建两个示例应用程序来对这两种打印选项提供清晰的说明。\n\
  \n## 77.1 创建 HTML 打印示例应用程序\n\n从欢迎界面选择“New Project”（新建项目）选项，在出现的新项目对话框中，点击“Next”（下一步）按钮之前选择“Empty\
  \ Activity”模板。\n\n在`Name`字段中输入`HTMLPrint`并指定`com.ebookfrenzy.htmlprint`为包名。在点击“Finish”（完成）按钮之前，将\
  \ Minimum API level（最低 API ）设置为`API 26`：Android 8.0 (Oreo)，并将 Language（语言）菜单设置为\
  \ Java。\n\n## 77.2 打印动态 HTML 内容\n\n本教程的第一阶段是在项目中添加代码以创建一些 HTML 内容，并以打印作业的形式将其到打印框架。\n\
  \n首先找到`MainActivity.java`文件（位于 Project 工具窗口的`app -> java -> com -> ebookfrenzy ->\
  \ htmlprint` 下），并将其加载到编辑面板。加载后，修改代码使其如下列表所示读取：\n\n```java\npackage com.ebookfrenzy.htmlprint;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\n\nimport android.os.Bundle;\n\
  \nimport android.webkit.WebView;\nimport android.webkit.WebViewClient;\n\nimport\
  \ android.webkit.WebResourceRequest;\n\nimport android.print.PrintAttributes;\n\n\
  import android.print.PrintDocumentAdapter;\n\nimport android.print.PrintManager;\n\
  \nimport android.content.Context;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n\n    private WebView myWebView;\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_htmlprint);\n\
  \        printWebView();\n    }\n\n    private void printWebView() {\n        WebView\
  \ webView = new WebView(this);\n        webView.setWebViewClient(new WebViewClient()\
  \ {\n            public boolean shouldOverrideUrlLoading(WebView view,\n       \
  \                                            WebResourceRequest request) {\n   \
  \             return false;\n            }\n            @Override\n            public\
  \ void onPageFinished(WebView view, String url) {\n                createWebPrintJob(view);\n\
  \                myWebView = null;\n            }\n        });\n        String htmlDocument\
  \ = \"<html><body><h1>Android Test</h1><p>This is sample content.</p></body></html>\"\
  ;\n        webView.loadDataWithBase(null, htmlDocument, \"text/html\", \"UTF-8\"\
  , null);\n        myWebView = webView;\n    }\n}\n```\n\n\n\n从欢迎屏幕选择 `New Project`\
  \ 选项，在出现的新项目对话框中，点击 `Next` 按钮之前，选择 `Basic Activity` 模板。\n\n在 `Name` 字段中输入 `WebPrint`，并指定\
  \ `com.ebookfrenzy.webprint` 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API\
  \ 26`：Android 8.0 (Oreo)，并将 `Language` 菜单更改为 `Java`。\n\n## 77.4 悬浮操作按钮\n\n选择 `Basic\
  \ Activity` 模板提供了一个上下文菜单和一个悬浮操作按钮。由于应用不需要悬浮操作按钮，因此可以在继续之前将其移除。将 `activity_main.xml`\
  \ 布局文件加载到 `Layout Editor` 中，选择悬浮操作按钮并按键盘 `Delete` 键将对象从布局中删除。编辑 `MainActivity.java`\
  \ 文件，按照如下所示从 `onCreate` 方法中移除悬浮操作按钮的代码：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ ActivityMainBinding.inflate(getLayoutInflater());\n    setContentView(binding.getRoot());\n\
  \    setSupportActionBar(binding.toolbar);\n\n    binding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n        @Override\n        public void onClick(View\
  \ view) {\n            Snackbar.make(view, \"Replace with your own action\",\n \
  \                   Snackbar.LENGTH_LONG)\n                .setAction(\"Action\"\
  , null).show();\n        }\n    });\n}\n```\n\n## 77.5 移除导航功能\n\n正如“Android Studio\
  \ 布局编辑器工具指南”所示，`Basic Activity` 模板包含多个片段和按钮，用于从一个片段导航到另一个片段。对于本教程而言，这些功能是不必要的，如果不移除，稍后会导致问题。在继续教程之前，按照如下方式修改项目：\n\
  \n1. 在 `Project` 工具窗口中，导航并双击 `app -> res -> navigation -> nav_graph.xml` 文件，将其加载到导航编辑器中。\n\
  2. 在编辑器中，选择图表面板中的 `SecondFragment` 项，并按键盘删除键将其从图中移除。\n3. 找到并删除 `SecondFragment.java`\
  \ (`app -> java -> <package name> -> SecondFragment`) 和 `fragment_second.xml` (`app\
  \ -> res -> layout -> fragment_second.xml`) 文件。\n4. 找到 `FirstFragment.java` 文件，双击它将其加载到编辑器，并移除\
  \ `onViewCreated()` 方法中的代码，使其内容如下：\n\n```java\npublic void onViewCreated(@NonNull\
  \ View view, Bundle savedInstanceState) {\n    super.onViewCreated(view, savedInstanceState);\n\
  \    binding.buttonFirst.setOnClickListener(new View.OnClickListener() {\n     \
  \   @Override\n        public void onClick(View view) {\n            NavHostFragment.findNavController(FirstFragment.this)\n\
  \                    .navigate(R.id.action_FirstFragment_to_SecondFragment);\n \
  \       }\n    });\n}\n```\n5. 编辑 `MainActivity.java` 文件并移除以下导航代码：\n\n```java\n\
  @Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    binding = ActivityMainBinding.inflate(getLayoutInflater());\n    setContentView(binding.getRoot());\n\
