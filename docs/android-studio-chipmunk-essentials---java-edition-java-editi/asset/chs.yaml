  android.permission.INTERNET\" />\n\n    <application\n        android:allowBackup=\"\
  true\"\n        ...\n    </application>\n</manifest>\n```\n\n## 51.9 运行应用程序\n\n\
  在模拟器或连接的设备上编译并运行应用程序。根据显示尺寸，主列表应以详情模式出现，如图 51-6 所示：\n\n![](img/as_detail_flow_running.jpg)\n\
  \n图 51-6\n\n## 51.10 总结\n\n主/详情用户界面由一个主列表组成，选中列表时会在详情面板中显示额外信息。主/详情模式是 Android 提供的一个模板，允许快速、方便地创建此类布局。本章所示，通过对模板文件进行细微修改，就可以实现广泛的主/详情功能。\n\
  \n\n\n\n\n显式意图（Explicit intent）通过引用目标 Activity 的组件名称（实际上是类名）来请求启动特定的 Activity。当发送\
  \ Activity 的 Activity 位于同一个应用程序时，这种方法最为常见（因为开发者知道该类名）。\n\n显式意图是通过创建 `Intent` 类的实例发出的，并传入\
  \ Activity 上下（context）和要启动的 Activity 的组件名称。然后调用 `startActivity()` 方法并将 `intent`\
  \ 对象作为参数传递。例如，以下代码段为启动类名为 `ActivityB` 的 Activity 发出了意图：\n\n```java\nIntent i = new\
  \ Intent(this, ActivityB.class);\nstartActivity(i);\n```\n\n在启动 `intent` 对象之前，可以通过调用\
  \ `intent` 对象的 `putExtra()` 方法将数据添加到其中，从而将数据传输给接收的 Activity。数据必须以键值对的形式添加。以下代码扩展了之前的示例，分别为\
  \ `intent` 添加了键名为 `\"myString\"` 和 `\"myInt\"` 的字符串值和整数值：\n\n```java\nIntent i =\
  \ new Intent(this, ActivityB.class);\ni.putExtra(\"myString\", \"This is a message\
  \ for ActivityB\");\ni.putExtra(\"myInt\", 100);\nstartActivity(i);\n```\n\n数据作为\
  \ `Bundle` 对象的一部分被目标 Activity 接收，可以通过调用 `getIntent().getExtras()` 获取。`Activity`\
  \ 类的 `getIntent()` 方法返回启动该 Activity 的意图，而 `Intent` 类的 `getExtras()` 方法返回一个包含数据的\
  \ `Bundle` 对象。例如，提取传递给 `ActivityB` 的数据值：\n\n```java\nBundle extras = getIntent().getExtras();\n\
  if (extras != null) {\n    String myString = extras.getString(\"myString\");\n \
  \   int myInt = extras.getInt(\"myInt\");\n}\n```\n\n当使用意图启动同一应用程序内的其他 Activity\
  \ 时，必须将这些 Activity 列在应用程序清单文件（application manifest file）中。以下 `AndroidManifest.xml`\
  \ 内容对于包含名为 `ActivityA` 和 `ActivityB` 的 Activity 的应用程序是正确的：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.intent1.intent1\" >\n    <application\n        android:icon=\"\
  @mipmap/ic_launcher\"\n        android:label=\"@string/app_name\" >\n        <activity\n\
  \            android:label=\"@string/app_name\"\n            android:name=\"com.ebookfrenzy.intent1.intent1.ActivityA\"\
  \ >\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"\
  \ />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n        <activity\n   \
  \         android:name=\"ActivityB\"\n            android:label=\"ActivityB\" >\n\
  \        </activity>\n    </application>\n</manifest>\n```\n\n## 52.3 从 Activity\
  \ 返回数据\n\n正如上一节示例所示，虽然数据传输到了 `ActivityB`，但没有办法将数据返回给第一个 Activity（我们将其称为 `ActivityA`）。然而，可以通过启动\
  \ `ActivityB` 启动 `ActivityA` 的子 Activity（sub-activity）来实现这一点。通过创建 `ActivityResultLauncher`\
  \ 实例来启动 Activity 作为子 Activity。通过调用 `registerForActivityResult()` 方法创建 `ActivityResultLauncher`\
  \ 实例，并以 lambda 形式传递回调处理器。当子 Activity 返回时，该处理器将被调用并传递返回的数据。一旦创建了 `ActivityResultLauncher`\
  \ 实例，就可以带有意图参数调用它来启动子 Activity。创建 `ActivityResultLauncher` 实例的代码通常如下所示：\n\n```java\n\
  ActivityResultLauncher<Intent> startForResult = registerForActivityResult(\n   \
  \ new ActivityResultContracts.StartActivityForResult(),\n    new ActivityResultCallback<ActivityResult>()\
  \ {\n        @Override\n        public void onActivityResult(ActivityResult result)\
  \ {\n            if (result.getResultCode() == Activity.RESULT_OK) {\n         \
  \       Intent data = result.getData();\n                // 处理返回数据的代码\n        \
  \    }\n        }\n    });\n```\n\n一旦启动器准备绪，就可以如下方式调用它并传递要启动的意图：\n\n```java\nIntent\
  \ i = new Intent(this, ActivityB.class);\nstartForResult.launch(i);\n```\n\n要向父\
  \ Activity 返回数据，子 Activity 必须实现 `finish()` 方法，其目的是创建一个包含数据的新意图，然后调用封装 Activity 的\
  \ `setResult()` 方法，传递结果代码和包含数据的意图。结果代码通常是 `RESULT_OK` 或 `RESULT_ANCELED`，但也可以根据开发者的需求自定义值。如果子\
  \ Activity 崩溃，父 Activity 将接收到 `RESULT_ANCELED` 代码。以下代码说明了典型的子 Activity `finish()`\
  \ 方法：\n\n```java\npublic void finish() {\n    Intent data = new Intent();\n    data.putExtra(\"\
  returnString\", \"Message to parent activity\");\n    setResult(RESULT_OK, data);\n\
  \    super.finish();\n}\n```\n\n\n## 52.4 隐式意图（Implicit Intents）\n\n与引用启动 Activity\
  \ 类名的显式意图不同，隐式意图通过指定要执行的操作（action）和接收 Activity 处理的数据类型来识别要启动的 Activity。例如，`ACTION_VIEW`\
  \ 操作类型配合 `URI` 对象形式的网页 URL 将指示 Android 系统搜索并启动一个支持浏览器的 Activity。以下隐式意图在 Android\
  \ 设备上执行时，会导致指定的网页出现在浏览器 Activity 中：\n\n```java\nIntent intent = new Intent(Intent.ACTION_VIEW,\
  \ Uri.parse(\"https://www.ebookfrenzy.com\"));\nstartActivity(intent);\n```\n\n\
  当上述隐式意图由 Activity 发出时，Android 系统将使用称为意图解析（intent resolution）的过程搜索设备上能够处理 `http`\
  \ 请求数据的 Activity。在使用隐式意图启动 Activity 之前，该 Activity 必须经过验证或由用户启用。如果未满足这些条件之一，该 Activity\
  \ 将无法启动。在探索这两个选项之前，我们先讨论意图过滤器（intent filters）。\n\n## 52.5 使用意图过滤器\n\n意图过滤器是 Activity\
  \ 向意图解析过程“宣告支持的操作和数据处理能力的机制。这些声明还包含了执行链接验证所需的设置。以下 `AndroidManifest.xml` 文件展示了名为\
  \ `MyWebView` 的应用中名为 `WebActivity` 的 Activity 的配置，其包含了相应的意图过滤器：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<application\n    android:allowBackup=\"\
  true\"\n    android:icon=\"@mipmap/ic_launcher\"\n    android:label=\"@string/app_name\"\
  \n    android:roundIcon=\"@mipmap/ic_launcher_round\"\n    android:supportsRtl=\"\
  true\"\n    android:theme=\"@style/Theme.MyWebView\">\n    <activity\n        android:name=\"\
  WebActivity\"\n        android:exported=\"true\">\n        <intent-filter android:autoVerify=\"\
  true\">\n            <action android:name=\"android.intent.action.VIEW\" />\n  \
  \          <category android:name=\"android.intent.category.BROWSABLE\" />\n   \
  \         <category android:name=\"android.intent.category.DEFAULT\" />\n      \
  \      <data android:scheme=\"https\" />\n            <data android:host=\"www.ebookfrenzy.com\"\
  />\n        </intent-filter>\n    </activity>\n</application>\n```\n\n\n\n\n\n此清单文件配置了\
  \ `WebActivity` 活动，使其能够响应来自另一个后续的隐式意图（implicit intent），前提是该意图包含 `https://www.ebookfrenzy.com`\
  \ 这种。例如，以下代码将启动 `WebActivity` 活动（假设 `MyWebView` 应用已通过用户验证或启用为支持链接）：\n\n```java\n\
  Intent intent = new Intent(Intent.ACTION_VIEW,\n        Uri.parse(\"https://www.ebookfrenzy.com\"\
  ));\n\nstartActivity(intent);\n```\n\n## 52.6 自动链接验证\n\n在 Android 设备上使用 Web 链接启动活动被认为是一种潜在的安全风险。为了尽地降低这种风险，用于启动意图的链接必须要么经过自动验证，要么由用户在设备上手动添加为支持的链接。要启用自动验证，必须在目标活动中相应的意图声明中将\
  \ `autoVerify` 设置为 `true`，如下所示：\n\n```xml\n<intent-filter android:autoVerify=\"\
  true\">\n\n.\n\n.\n</intent-filter>\n```\n\n接下来，链接 URL 需要与应用链接所基于的网站关联。这是通过创建一个名为\
  \ `assetlinks.json` 的数字资产链接文件并将其安装网站的 `.well-known` 文件夹中实现的。\n\n数字资产链接文件包含一个关系声明（用于授予目标应用使用网站链接\
  \ URL 启动的权限）以及一个目标声明（用于声明同伴应用的包名和该项目的 SHA-256 证书指纹）。一个典型的资产链接文件例如，其内容如下：\n\n```json\n\
  [{\n  \"relation\": [\"delegate_permission/common.handle_all_urls\"],\n  \"target\"\
  : {\n    \"namespace\": \"android_app\",\n    \"package_name\": \"com.ebookfrenzy.mywebview\"\
  ,\n    \"sha256_cert_fingerprints\":\n    [\"<在此处输入您的证书指纹>\"]\n  }\n}]\n```\n\n\
  注意，你可以手动创建此文件，也可以使用以下 URL 提供的在线工具生成：[`developers.google.com/digital-asset-links/tools/generator`](https://developers.google.com/digital-asset-links/tools/generator)\n\
  \n在开发 Android 时，`namespace` 值始终设置为 `android_app`，而 `package_name` 对应于由意图启动的应用包。最后，证书指纹是构建应用时使用的哈希值。当测试应用时，这将是包含在\
  \ `debug.keystore` 文件中的调试证书。在 Windows 系统上，Android Studio 将此文件存储在以下位置：\n\n`\\Users\\\
  <用户名>\\.android\\debug.keystore`\n\n在 macOS 和 Linux 系统上，可以在此处找到该文件：\n\n`$HOME/.android/debug.keystore`\n\
  \n一旦找到该文件，可以在终端或命令提示窗口中运行以下命令获取 SHA 256 指纹：\n\n```bash\nkeytool -list -v -keystore\
  \ <在此处输入 debug.keystore 路径>\n```\n\n当提示密码时，输入 `android`，随后将出现包含 SHA 256 指纹的输出：\n\
  \n```text\n.\n\n.\nCertificate fingerprints:\nSHA1: 11:E8:66:11:B6:94:3D:AA:7E:50:63:99:77:B8:6A:90:FF:B6:9C:6D\n\
  SHA256: 7F:EE:E3:C8:38:41:C3:EA:11:56:83:94:2A:4C:D2:EA:A0:69:F8:96:D1:17:77:02:46:EC:AD:6E:3C:64:A9:29\n\
  .\n\n.\n```\n\n当你准备好构建应用的发布版版本时，你需要确保已将发布版的 SHA 256 指纹添加到资产文件中。生成发布版密钥库文件（release\
  \ keystore files）的详情参见“创建、测试和上传 Android App Bundle” 章节。获取发布版密钥库文件后，对其运行上述 `keytool`\
  \ 命令以获取指纹。\n\n一旦你将数字资产文件放置在网站上的正确位置，在设备或模拟器上安装应用并等待 30 秒以进行链接验证。要检查验证状态，请在命令行或终端提示符中运行以下命令：\n\
  \n```bash\nadb shell pm get-app-links --user cur com.example.mywebview\n```\n\n\
  输出结果应包含链接已验证的确认信息：\n\n```text\ncom.example.mywebview:\n    ID: 0e399bca-bf58-4cfc-8c7b-d1a6c3b065ec\n\
  \    Signatures: [7F:EE:E3:C8:38:41:C3:EA:11:56:83:94:2A:4C:D2:EA:A0:69:F8:96:D1:17:77:02:46:EC:AD:6E:3C:64:A9:29]\n\
  \    Domain verification state:\n      www.ebookfrenzy.com: verified\n    User 0:\n\
  \      Verification link handling allowed: true\n      Selection state:\n```\n\n\
  \n\n\n\n意（Intent）是一个 Android Activity 启动另一个 Activity 的消息机制。显式意（Explicit intent）通过类名引用接收的\
  \ Activity 来启动特定的 Activity。显式意通常（但不仅限于）用于启动同一应用程序内的 Activity。隐式意（Implicit intent）指定要执行的操作和处理的数据类型，并让\
  \ Android 运行时找到匹配的 Activity 进行启动。隐式意通常用于启动位于不同应用程序的 Activity。\n\n在使用隐式意时，安全限制要求在启动意图之前，包含意图目标\
  \ Activity 的应用 必须经过自动验证或由用户手动启用。自动验证涉及在与链接 URL 对应的网站上放置数字资产链接（Digital Assets Link）文件。\n\
  \nActivity 可以以键值对的形式将数据封装在意对象中，从而向接收 Activity 发数据。只有当 Activity 作为发送 Activity 的子\
  \ Activity 启动时，才能从其返回数据。\n\nActivity 通过在应用清单文件中指定意过滤器（intent-filters），向 Android\
  \ 意图解析过程声明功能。发送和接收 Activity 也必须请求适当的权限以执行如访问设备联系人数据库或互联网等任务。\n\n在涵盖了意的理论后，接下来的几章节将在\
  \ Android Studio 中创建一些示例，将显式和隐式意投入运行。\n\n# 53. Android 显式意 – 实例详解\n\n标题为 \"Android\
  \ 意概述\" 的章节涵盖了使用意启动 Activity 的理论。本章将通过创建一个示例应用程序将该理论付诸实践。\n\n在本章中创建 Android Studio\
  \ 项目将演示使用显式意启动 Activity，包括发送和接收 Activity 之间的数据传递。下一章 (Android 隐式意 – 实例详解) 将演示隐式意的使用。\n\
  \n## 53.1 创建显式意示例应用程序\n\n从欢迎界面选择 New Project（新建项目）选项，在弹出的新项目对话框中，点击 Next（下一步）按钮之前，选择\
  \ Empty Activity 模板。\n\n在 Name 字段中输入 `ExplicitIntent`，并指定 `com.ebookfrenzy.explicitintent`\
  \ 为包名。在点击 Finish（完成）按钮之前，将 Minimum API level 设置更改为 API 26: Android 8.0 (Oreo)，并将\
  \ Language（语言）菜单更改为 Java。按照章节 11.8 将项目迁移到 View Binding 中列出的步骤，将项目转换为使用 view binding。\n\
  \n## 53.2 设计 MainActivity 的用户界面布局\n\n`MainActivity` 的用户界面将由一个 `ConstraintLayout`\
  \ 视图组成，其中包含 EditText（纯文本）、TextView 和分别命名为 `editText1`、`textView1` 和 `button1` 的\
  \ Button 视图。使用 Project 工具窗口，找到 `MainActivity` 的 `activity_main.xml` 资源文件（位于 `app\
  \ -> res -> layout` 下），并双击它将其加载到 Android Studio 布局编辑器工具中。选择并删除默认的“Hello World!”TextView。\n\
  \n从调板中拖入一个 TextView 小部件并将其放置在布局的中心位置，使用 Attributes（属性）工具窗口为其分配 ID `textView1`。\n\
  \n从调板中拖入一个 Button 对象并将其位置置为水平居中并位于 TextView 底部边缘下方。更改 text 属性使其显示为“Send Text”，并配置\
  \ `onClick` 属性以调用名为 `sendText` 的方法。\n\n接下来，添加一个 Plain Text 对象，使其水平居中并置于 TextView\
  \ 顶部边缘上方。使用 Attributes 工具窗口移除分配给 text 属性的“Name”字符串，并将 ID 设置为 `editText1`。布局完成后，点击工具栏上的\
  \ Infer constraints（推断约束）按钮以添加适当的约束：\n\n![](img/Image24342.jpg)\n\n图 53-1\n\n最后，点击布局编辑器窗口右上角的红色警告按钮，并使用生成的面板将“Send\
  \ Text”字符串提取到名为 `send_text` 的资源中。一旦布局完成，用户界面应该类似于图 53-2 中所示所示：\n\n![](img/as_4.1_explicit_intent_ui.jpg)\n\
  \n图 53-2\n\n## 53.3 创建第二个 Activity 类\n\n当用户触摸“Send Text”按钮时，将发出一个意图，请求启动第二个 Activity，用户可以在该\
  \ Activity 中输入响应。因此，下一步是创建第二个 Activity。在 Project 工具窗口中，右键点击位于 `app -> java` 下的 `com.ebookfrenzy.explicitintent`\
  \ 包名，选择 New -> Activity -> Empty Activity 菜单选项，显示如图 53-3 所示的 New Android Activity\
  \ 对话：\n\n![](img/as_4.2_intent_new_java_activity.jpg)\n\n图 53-3\n\n在 Activity Name\
  \ 和 Title 字段中输入 `SecondActivity`，并将布局文件命名为 `activity_second`，将 Language 菜单更改为 Java。由于此\
  \ Activity 不会在应用程序启动时启动（它将在点击按钮时通过 MainActivity 的意启动），在点击 Finish 按钮之前确保 Launcher\
  \ Activity（启动器 Activity）选项已禁用。\n\n## 53.4 设计 SecondActivity 的用户界面布局\n\n第二个 Activity\
  \ 用户界面所需的元素是 Plain Text EditText、TextView 和 Button 视图。根据这些要求，将 `activity_second.xml`\
  \ 布局加载到布局编辑器中并添加视图。\n\n在设计过程中，注意按钮视图上的 `onClick` 属性已配置为调用名为 `returnText` 的方法，TextView\
  \ 和 EditText 视图分别分配了 ID `textView2` 和 `editText2`。完成后，布局应类似于图 53-4 所示。注意按钮上的文本（显示为“Return\
  \ Text”）已提取到名为 `return_text` 的字符串资源。\n\n布局完成后，点击 Infer constraints 工具栏按钮为布局添加必要的约束：\n\
  \n![](img/as_4.1_explicit_intent_ui_2.jpg)\n\n图 53-4\n\n## 53.5 检查应用清单文件\n\n为了让\
  \ `MainActivity` 能够通过意启动 `SecondActivity`，`AndroidManifest.xml` 文件中必须存在 `SecondActivity`\
  \ 条目。在 Project 工具窗口中定位该文件（app -> manifests），双击打开并验证 Android Studio 已自动添加了该 Activity\
  \ 条目：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.explicitintent\"\
  >\n    <application\n        android:allowBackup=\"true\"\n        android:icon=\"\
  @mipmap/launcher\"\n        android:label=\"@string/app_name\"\n        android:roundIcon=\"\
  @mipmap/launcher_round\"\n        android:supportsRtl=\"true\"\n        android:theme=\"\
  @style/AppTheme\">\n        <activity\n            android:name=\".SecondActivity\"\
  \n            android:exported=\"true\" />\n        <activity\n            android:name=\"\
  .MainActivity\"\n            android:exported=\"true\">\n            <intent-filter>\n\
  \                <action android:name=\"android.intent.action.MAIN\" />\n      \
  \          <category android:name=\"android.intent.category.LAUNCHER\" />\n    \
  \        </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n\n\n\n\n在清单文件（manifest file）创建并列出第二个活动后，现在是时候在 `MainActivity` 类中编写代码来发布意（intent）了。\n\
  \n### 53.6 创建意\n\n`MainActivity` 的目标是在用户点击“发送文本”（Send Text）按钮时创建并启动一个意。在创建意的过程中，用户在\
  \ `EditText` 视图中输入的字符串字符串将作为键值对添加到意对象中。当为 `MainActivity` 创建用户界面布局时，按钮对象被配置为在用户“点击”时调用名为\
  \ `sendText()` 的方法。现在需要将该方法添加到 `MainActivity` 类的源文件 `MainActivity.java` 中，如下所示：\n\
  \n```java\npackage com.ebookfrenzy.explicitintent;\n\n.\n.\n\nimport android.content.Intent;\n\
  \n.\n.\n\npublic class MainActivity extends AppCompatActivity {\n.\n.\n    public\
  \ void sendText(View view) {\n        Intent i = new Intent(this, SecondActivity.class);\n\
  \        String myString = binding.editText1.getText().toString();\n        i.putExtra(\"\
  qString\", myString);\n        startActivity(i);\n    }\n}\n```\n\n`sendText()`\
  \ 方法的代码遵循了“Android Intent 概述”中概述的技术。首先，创建一个新的 `Intent` 实例，并将当前活动和 `SecondActivity`\
  \ 的类名作为参数传递。接下来，将输入到 `EditText` 对象中的文本作为键值对添加到意对象中，并通过调用 `startActivity()` 启动意，并将意对象作为参数传递。\n\
  \n编译并运行应用程序，点击“发送文本”按钮启动 `SecondActivity`，然后点击返回按钮（位于显示器底部工具栏中）返回到 `MainActivity`。\n\
  \n### 53.7 提取意数据\n\n现在 `SecondActivity` 已经从 `MainActivity` 启动，下一步是提取意中包含的 `String`\
  \ 数据值，并将其赋值给 `SecondActivity` 用户界面中的 `TextView` 对象。这涉及到 `SecondActivity.java` 源文件的\
  \ `SecondActivity` 的 `onCreate()` 方法中添加一些代码，并调整活动以使用视图绑定（view binding）：\n\n```java\n\
  package com.ebookfrenzy.explicitintent;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.content.Intent;\nimport android.view.View;\n\
  import com.ebookfrenzy.explicitintent.databinding.ActivitySecondBinding;\n\npublic\
  \ class SecondActivity extends AppCompatActivity {\n    private ActivitySecondBinding\
  \ binding;\n\n    public void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.SecondActivity);\n        binding = ActivitySecondBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ Bundle extras = getIntent().getExtras();\n        if (extras == null) {\n    \
  \        return;\n        }\n        String qString = extras.getString(\"qString\"\
  );\n        binding.textView2.setText(qString);\n    }\n}\n```\n\n在模拟器或物理 Android\
  \ 设备上编译并运行应用程序。在点击“发送文本”按钮之前，在 `MainActivity` 的文本框中输入一些文本。现在消息应该出现在 `SecondActivity`\
  \ 用户界面的 `TextView` 组件上。\n\n### 53.8 将 SecondActivity 作为子活动启动\n\n为了让 `SecondActivity`\
  \ 能够向 `MainActivity` 返回数据，`SecondActivity` 必须作为 `MainActivity` 的子活动启动。这意味着我们需要调用\
  \ `registerForActivityResult()` 并声明一个回调处理器，在 `SecondActivity` 返回时调用。该回调将提取 `SecondActivty`\
  \ 返回的数据并显示在 `textView1` 上。\n\n对 `registerForActivityResult()` 的调用返回一个 `ActivityResultLauncher`\
  \ 实例，可以在 `sendText()` 内部调用它来启动意。编辑 `MainActivity.java` 文件使其内容如下：\n\n```java\n.\n\
  .\n\nimport androidx.activity.result.ActivityResult;\nimport androidx.activity.result.ActivityResultCallback;\n\
  import androidx.activity.result.ActivityResultLauncher;\nimport androidx.activity.result.contract.ActivityResultContracts;\n\
  .\n.\n\npublic class MainActivity extends AppCompatActivity {\n.\n.\n    ActivityResultLauncher<Intent>\
  \ startForResult = registerForActivityResult(\n            new ActivityResultContracts.StartActivityForResult(),\n\
  \            new ActivityResultCallback<ActivityResult>() {\n                @Override\n\
  \                public void onActivityResult(ActivityResult result) {\n       \
  \             if (result.getResultCode() == Activity.RESULT_OK) {\n            \
  \            Intent data = result.getData();\n                        String returnString\
  \ = data.getExtras().getString(\"returnData\");\n                        binding.textView1.setText(returnString);\n\
  \                    }\n                }\n            });\n\n    public void sendText(View\
  \ view) {\n        Intent i = new Intent(this, SecondActivity.class);\n        String\
  \ myString = binding.editText1.getText().toString();\n        i.putExtra(\"qString\"\
  , myString);\n        startForResult.launch(i);\n    }\n}\n.\n```\n\n### 53.9 从子活动返回数据\n\
  \n`SecondActivity` 现在作为 `MainActivity` 的子活动启动，而 `MainActivity` 反之也已修改以处理从 `SecondActivity`\
  \ 返回的数据。剩下的只需修改 `SecondActivity.java` 以实现 `finish()` 方法并为 `returnText()` 方法添加代码，该方法在点击“返回文本”（Return\
  \ Text）按钮时被调用：\n\n```java\npublic void returnText(View view) {\n    finish();\n\
  }\n\n@Override\npublic void finish() {\n    Intent data = new Intent();\n    String\
  \ returnString = binding.editText2.getText().toString();\n    data.putExtra(\"returnData\"\
  , returnString);\n    setResult(RESULT_OK, data);\n    super.finish();\n}\n```\n\
  \n`finish()` 方法需要做的是创建一个意，将返回的数据作为键值对添加，然后调用 `setResult()` 方法传递结果代码和意对象。`returnText()`\
  \ 方法只需调用 `finish()` 方法。\n\n### 53.10 测试应用程序\n\n编译并运行应用程序，在 `MainActivity` 中输入一个问题并点击“发送文本”按钮。当\
  \ `SecondActivity` 出现时，在 `EditText` 视图中输入文本并使用返回按钮或“返回文本”按钮返回到 `MainActivity`，响应应该出现在文本视图对象中。\n\
  \n### 53.11 总结\n\n在上一节中涵盖了意的基础知识后，本节的目标是在 Android Studio 中创建一个应用程序项目，该项目用于演示显式意的用法以及父级活动与子活动之间数据传输的概念。\n\
  \n下一节将通过一个示例演示隐式意的操作。\n\n\n\n\n\n# 54.1 创建 Android Studio 隐式意示例项目\n\n从欢迎界面选择 `New\
  \ Project` 选项，在弹出的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入\
  \ `ImplicitIntent`，并指定包名为 `com.ebookfrenzy.implicitintent`。由于此示例将使用仅适用于最新 Android\
  \ 版本的功能，在点击 `Finish` 按钮之前，将 `Minimum API level` 设置更改为 `API 31: Android 12.0 (S)`，并将\
  \ `Language` 菜单更改为 `Java`。\n\n## 54.2 设计界面\n\n`MainActivity` 类的用户界面非常简单，仅由 `ConstraintLayout`\
  \ 和两个 `Button` 对象组成。在 Project 工具窗口中，找到 `app -> res -> layout -> activity_main.xml`\
  \ 文件并双击它将其加载到 Layout Editor 工具中。\n\n删除默认的 `TextView`，并在启用 `Autoconnect` 模式的情况下，在布局中放置\
  \ `Button` 控件，使其显示如下：\n\n![](img/as_implicit_intent_ui.jpg)\n\n图 54-1\n\n将按钮上的文本分别设置为\
  \ `Open Web Page` 和 `Enable Links`，并将文本提取到字符串资源中。\n\n依次选择每个 `Button`，使用 `Attributes`\
  \ 工具窗口配置 `onClick` 属性，分别调用名为 `showWebPage` 和 `enableLink` 的方法。\n\n# 54.3 创建隐式意图\n\
  \n如所示，隐式意图将在名为 `showWebPage()` 的方法内部创建并发布，该方法需要在 `MainActivity` 类中实现，其代码位于 `MainActivity.java`\
  \ 源文件中。在 Project 工具窗口中找到该文件并双击它将其加载到编辑面板中。加载后，修改代码添加 `showWebPage()` 和 `enableLink()`\
  \ 方法以及一些必要的导入：\n\n```java\npackage com.ebookfrenzy.implicitintent;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\nimport android.net.Uri;\nimport android.content.Intent;\n\
  import android.view.View;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \    }\n\n    public void showWebPage(View view) {\n        Intent intent = new\
  \ Intent(Intent.ACTION_VIEW,\n                    Uri.parse(\"https://www.ebookfrenzy.com\"\
  ));\n        startActivity(intent);\n    }\n\n    public void enableLink(View view)\
  \ {\n    }\n}\n```\n\n`showWebPage()` 方法执行的任务非常简单。首先创建一个新的意图对象。然而，代码并没有指定意图的类，而是使用\
  \ `ACTION_VIEW` 指定意图的性质（向用户显示内容）。意图对象包含要显示的 `URI`。这告诉 Android 意图解析系统请求显示网页。然后通过调用\
  \ `startActivity()` 方法发布该意图。\n\n在模拟器或物理 Android 设备上编译并运行应用程序，一旦点击 `Show Web Page`\
  \ 按钮，就会出现网络浏览器并加载由 URL 指定的网页。隐式意图已成功执行。\n\n## 54.4 添加匹配的 Activity\n\n本章的剩余部分将演示设备上安装了多个匹配隐式意图要求的\
  \ Activity 的效果。为了实现这一点，将在 Android Studio 中创建一个新项目，应用程序名称设置为 `MyWebView`，使用在本章早期创建\
  \ `ImplicitIntent` 项目时相同的 SDK 配置，再次选择 `Empty Activity`。\n\n如果你有一个 Digital Asset\
  \ Links 网站并尝试自动验证，请在指定包名时使用网站 URL。例如，如果你的网站托管在 `www.mycompany.com`，包名需要设置为：\n\n\
  `com.mycompany.webview`\n\n如果没有网站或不计划使用自动验证，请使用以下包名：\n\n`com.ebookfrenzy.webview`\n\
  \n点击 `Finish` 创建项目，然后按照 1.8 Migrating a Project 部分将项目转换为 View Binding。\n\n# 54.5\
  \ 为 UI 添加 WebView\n\n`MyWebView` 项目中唯一的 Activity 用户界面将由 Android `WebView` 控件实例组成。在\
  \ Project 工具窗口中，找到包含 Activity 用户界面描述的 `activity_main.xml` 文件，双击将其加载到 Layout Editor\
  \ 工具中。\n\n在 Layout Editor 的 Design 模式下，选择默认的 `TextView` 控件从布局中移除。\n\n从面板的 Widgets\
  \ 部分拖放 `WebView` 对象到现有的 `ConstraintLayout` 视图上，如图：\n\n![](img/as_implicit_intent_ui.jpg)\n\
  \n图 54-2\n\n在继续之前，将 `WebView` 的 ID 更改为 `webView1` 并使用约束。\n\n# 54.6 获取 Intent\n\n\
  当创建显示网络浏览器的隐式意图时，网页的 URL 将封装在意图对象中。MainActivity` 类的任务是从意图中提取此 `Uri`，将其转换为字符串并赋值给\
  \ `WebView`。为了实现这一点，修改 `MainActivity.java` 文件如下：\n\n```java\npackage com.mycompany.webview;\n\
  \nimport java.net.URL;\nimport android.net.Uri;\nimport android.content.Intent;\n\
  import android.webkit.WebView;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private ActivityMainBinding binding;\n\n    @Override\n    protected void\
  \ onCreate(Bundle savedInstanceState) {\n        handleIntent();\n    }\n\n    private\
  \ void handleIntent() {\n        Intent intent = getIntent();\n        Uri data\
  \ = intent.getData();\n        URL url = null;\n        try {\n            url =\
  \ new URL(data.getScheme(),\n                    data.getHost(),\n             \
  \       data.getPath());\n        } catch (Exception e) {\n            e.printStackTrace();\n\
  \        }\n        binding.webView1.loadUrl(url.toString());\n    }\n}\n```\n\n\
  添加到 `onCreate()` 方法的新代码执行了以下操作：\n\n- 获取导致此 Activity 启动的 `intent` \n- 从 `intent`\
  \ 中提取 `Uri` 数据\n- 将 `Uri` 数据转换为 `URL` 对象\n- 将 `URL` 加载到视图，在此过程中将 `URL` 转换为 `String`\n\
  \n`MyWebView` 项目的代码部分现在已完成。剩下的只是修改清单文件。\n\n# 54.7 修改 MyWebView 项目清单文件\n\n在测试之前，必须对\
  \ `MyWebView` 的清单文件进行若干更改。首先，Activity 需要寻求访问互联网的权限（因为它需要加载网页）。这通过在清单文件中添加相应的权限行来实现：\n\
  \n```xml\n<uses-permission android:name=\"android.permission.INTERNET\" />\n```\n\
  \n此外，检查 `MyWebView` 项目的 `AndroidManifest.xml` 文件中 intent filter 部分的内容，将发现以下设置：\n\
  \n```xml\n<intent-filter>\n    <action android:name=\"android.intent.action.MAIN\"\
  \ />\n    <category android:name=\"android.intent.category.LAUNCHER\" />\n</intent-filter>\n\
  ```\n\n\n\n\n在上面的 XML 中，`android.intent.action.MAIN` 条目表示该 activity 在在没有任何数据输入的情况下启动时，是应用程序的入口。另一方面，`android.intent.category.LAUNCHER`\
  \ 指令表示该 activity 应该列在设备的应用程序启动器屏幕上。\n\n由于该 activity 不需要作为应用程序的入口点启动，无法在没有数据输入（在此情况下为\
  \ URL）的情况下运行，且不需要出现在启动器中，因此清单文件中不需要为该 activity 配置 `MAIN` 或 `LAUNCHER` 指令。\n\n然而，`MainActivity`\
  \ activity 的意图过滤器需要进行修改，以指示它能够处理针对 `http` 数据方案的 `ACTION_VIEW` 意图动作。\n\nAndroid 还要求，任何能够处理隐式意图且不包含\
  \ `MAIN` 和 `LAUNCHER` 条目的 activity，还必须在意图过滤器中包含所谓的 `browsable` 和 `default` 类别。因此，修改后的意图过滤器部分应如下，其中\
  \ `<website url>` 替换为你的网站地址或 `www.ebookfrenzy.com`，具体取决于你在创建 `MyWebView` 项目时使用的包名：\n\
  \n```xml\n<intent-filter android:autoVerify=\"true\">\n    <action android:name=\"\
  android.intent.action.VIEW\" />\n    <category android:name=\"android.intent.category.BROWSABLE\"\
  \ />\n    <category android:name=\"android.intent.category.DEFAULT\" />\n    <data\
  \ android:scheme=\"https\" />\n    <data android:host=\"<website url>\"/>\n</intent-filter>\n\
  ```\n\n将这些要求整合在一起得到了完整的 `AndroidManifest.xml` 文件：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.mywebview\">\n    <uses-permission android:name=\"\
  android.permission.INTERNET\" />\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher_round\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/Theme.MyWebView\">\n        <activity\n \
  \           android:name=\".MainActivity\"\n            android:exported=\"true\"\
  >\n            <intent-filter android:autoVerify=\"true\">\n                <action\
  \ android:name=\"android.intent.action.VIEW\" />\n                <category android:name=\"\
  android.intent.category.BROWSABLE\" />\n                <category android:name=\"\
  android.intent.category.DEFAULT\" />\n                <data android:scheme=\"https\"\
  \ />\n                <data android:host=\"<website url>\"/>\n            </intent-filter>\n\
  \        </activity>\n    </application>\n</manifest>\n```\n\n在 Project 工具窗口中双击文件名，将\
  \ `AndroidManifest.xml` 文件加载到清单编辑器中。一旦加载完成，修改 XML 以匹配上述更改，记得输入正确的网站 URL。\n\n对清单文件进行适当修改后，新的\
  \ activity 已准备好安装到设备上。\n\n## 54.8 在设备上安装 MyWebView 包\n\n在 `MyWebView` 主 activity\
  \ 可以作为隐式意图的接收者之前，它必须先安装到设备上。这通过正常方式运行应用程序来实现。由于清单文件既不包含 `android.intent.action.MAIN`\
  \ 也不包含 `android.intent.category.LAUNCHER` 设置，因此需要指示 Android Studio 只安装但不启动应用。要配置此行为，如[图\
  \ 54] 所示，从工具栏中选择应用 -> `Edit configurations…` 菜单。\n\n## 54.9 测试应用程序\n\n在 Project\
  \ 工具窗口中双击文件名，将 `AndroidManifest.xml` 文件加载到清单编辑器中。一旦加载完成，修改 XML 以匹配上述更改，记得输入正确的网站\
  \ URL。\n\n对清单文件进行适当修改后，新的 activity 已准备好安装到设备上。\n\n## 54.10 手动启用链接\n\n在 `MainActivity`\
  \ activity 中，需要修改意图过滤器，以指示它能够处理针对 `http` 数据方案的 `ACTION_VIEW` 意图动作。\n\nAndroid 还要求，任何能够处理隐式意图且不包含\
  \ `MAIN` 和 `LAUNCHER` 条目的 activity，还必须在意图过滤器中包含所谓的 `browsable` 和 `default` 类别。因此，修改后的意图过滤器部分应如下，其中\
  \ `<website url>` 替换为你的网站地址或 `www.ebookfrenzy.com`，具体取决于你在创建 `MyWebView` 项目时使用的包名：\n\
  \n```xml\n<intent-filter android:autoVerify=\"true\">\n    <action android:name=\"\
  android.intent.action.VIEW\" />\n    <category android:name=\"android.intent.category.BROWSABLE\"\
  \ />\n    <category android:name=\"android.intent.category.DEFAULT\" />\n    <data\
  \ android:scheme=\"https\" />\n    <data android:host=\"<website url>\"/>\n</intent-filter>\n\
  ```\n\n将这些要求整合在一起得到了完整的 `AndroidManifest.xml` 文件：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.mywebview\">\n    <uses-permission android:name=\"\
  android.permission.INTERNET\" />\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher_round\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/Theme.MyWebView\">\n        <activity\n \
  \           android:name=\".MainActivity\"\n            android:exported=\"true\"\
  >\n            <intent-filter android:autoVerify=\"true\">\n                <action\
  \ android:name=\"android.intent.action.VIEW\" />\n                <category android:name=\"\
  android.intent.category.BROWSABLE\" />\n                <category android:name=\"\
  android.intent.category.DEFAULT\" />\n                <data android:scheme=\"https\"\
  \ />\n                <data android:host=\"<website url>\"/>\n            </intent-filter>\n\
  \        </activity>\n    </application>\n</manifest>\n```\n\n## 54.11 自动链接验证\n\n\
  如果你选择为 `MyWebView` 包名使用自己的网站 URL，现在可以采取自动链接验证的额外步骤。首先从你测试的设备或模拟器上卸载 `MyWebView`\
  \ 应用。在数字资产链接文件放置于网站之后，我们将重新安装应用。\n\n按照“Android Intent 概述”章节中列出的步骤，找到你的 `debug.keystore`\
  \ 文件，并使用 `keytool` 工具如下获取你的 SHA-256 指纹：\n\n```bash\nkeytool -list -v -keystore <path\
  \ to debug.keystore file>\n```\n\n接下来，在网络浏览器中打开以下页面：\n\nhttps://developers.google.com/digital-asset-links/tools/generator\n\
  \n页面加载后，将你的网站 URL 输入到 Hosting site domain 字段，将 `com.<domain here>.mywebview` 作为\
  \ App 包名，并将你的 SHA-256 指纹输入到 App package fingerprint (SHA256) 字段。\n\n点击 Generate\
  \ 按钮显示生成的语句，并放置在名为 `assetlinks.json` 的文件中，该文件位于你 Web 服务器上名为 `.well-known` 的文件夹中。返回生成页面并点击\
  \ Test statement 以验证该文件是否有效且位于正确位置。\n\n假设测试成功，我们现在准备好尝试应用链接，在设备上重新安装 `MyWebView`\
  \ 应用，并使用设置应用导航到 `MyWebView` 的“默认打开”页面。该页面应显示链接已通过验证。\n\n## 54.12 总结\n\n\n\n\n隐式意图（Implicit\
  \ intents）提供了一种机制，允许一个活动请求另一个活动的服务，只需指定操作类型，以及可选的对该操作要执行的数据。然而，要成为隐式意图的目标候选者，活动必须配置为从传入的意图对象中提取适当的数据，并包含在配置正确的清单文件中，包括适当的权限和意图过滤器。包含目标活动的应用程序还必须通过数字资产链接（Digital\
  \ Asset Links）文件进行验证，或者由用户手动启用。\n\n在本章中，创建了一个示例来演示隐式意图的发送、能够处理此类意图的示例活动的创建，以及链接验证过程。\n\
  \n# 55. Android 广播意图与广播接收器\n\n意图（intents）除了提供启动应用程序活动的机制外，还被用于向系统的其他组件广播系统级消息。这涉及广播意图（Broadcast\
  \ Intents）和广播接收器（Broadcast Receivers）的实现，两者都是本文的主题。\n\n## 55.1 广播意图概述\n\n广播意图是 `Intent`\
  \ 对象，通过调用 `Activity` 类的 `sendBroadcast()`、`sendStickyBroadcast()` 或 `sendOrderedBroadcast()`\
  \ 方法进行广播（后者用于需要广播结果的情况）。广播意图不仅在应用程序组件之间提供了消息和事件系统，还被 Android 系统用来通知感兴趣的应用程序有关关键系统事件（例如外部电源或耳机的连接或断开）。\n\
  \n当创建广播意图时，除了可选的数据和类别字符串外，它还必须包含一个操作字符串（action string）。与标准意图一样，数据是使用意图对象的 `putExtra()`\
  \ 方法结合键值对被添加到广播意图中的。可选的类别字符串可以通过调用 `addCategory()` 方法分配给广播意图。\n\n用于标识广播事件的操作字符串必须是唯一的，通常使用应用程序的包名语法。例如，以下代码段创建并发送了一个包含唯一操作字符串和数据的广播意图：\n\
  \n```java\nIntent intent = new Intent();\n\nintent.setAction(\"com.example.Broadcast\"\
  );\n\nintent.putExtra(\"MyData\", 1000);\n\nsendBroadcast(intent);\n```\n\n上述代码将在运行早于\
  \ 3.0 的 Android 版本的设备上成功启动相应的广播接收器。然而，在较新版本的 Android 内部，该意图将不会被广播接收器接收。这是因为 Android\
  \ 3.0 引入了一种启动控制安全措施，防止通过意图启动停止状态应用程序的组件。如果应用程序刚刚安装且尚未启动过，或者被用户使用设备上的应用程序管理器手动停止，则该应用程序被认为处于停止状态。但为了解决这个问题，可以在发送意图之前添加一个标记，以指示允许该意图启动停止应用程序的组件。该标记是\
  \ `FLAG_INCLUDE_STOPPED_PACKAGES`，并将按照此处对之前代码段的适配进行使用：\n\n```java\nIntent intent\
  \ = new Intent();\n\nintent.addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES);\n\n\
  intent.setAction(\"com.example.Broadcast\");\n\nintent.putExtra(\"MyData\", 1000);\n\
  \nsendBroadcast(intent);\n```\n\n## 55.2 广播接收器概述\n\n应用程序通过注册广播接收器来监听特定的广播意图。广播接收器通过扩展\
  \ `Android BroadcastReceiver` 类并重写 `onReceive()` 方法来实现。然后，广播接收器可以在代码中注册（例如在活动内部），也可以在清单文件中注册。注册实现的一部分涉及创建意图过滤器（intent\
  \ filters），以指示接收器需要监听的特定广播意图。这是通过引用广播意图的操作字符串来实现的。当检测到匹配的广播时，会调用广播接收器的 `onReceive()`\
  \ 方法，此时该方法有 5 秒钟的时间来执行任何必要的任务然后返回。需要注意的是，广播接收器不需要一直运行。如果检测到匹配的意图，Android 运行时系统会在调用\
  \ `onReceive()` 方法之前自动启动广播接收器。\n\n以下代码概述了一个模板广播接收器子类：\n\n```java\npackage com.example.broadcastdetector;\n\
  \nimport android.content.BroadcastReceiver;\n\nimport android.content.Context;\n\
  \nimport android.content.Intent;\n\npublic class MyReceiver extends BroadcastReceiver\
  \ {\n\n    public MyReceiver() {\n\n    }\n\n    @Override\n    public void onReceive(Context\
  \ context, Intent intent) {\n        // 在此处实现检测到 \n        // 广播时要执行的代码\n    }\n\
  }\n```\n\n在清单文件中注册广播接收器时，必须为接收器添加一个 `<receiver>` 条目。\n\n以下示例清单文件注册了上述示例广播接收器：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.example.broadcastdetector.broadcastdetector\"\n    android:versionCode=\"\
  1\"\n    android:versionName=\"1.0\" >\n    <uses-sdk android:minSdkVersion=\"17\"\
  \ />\n    <application android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"\
  @string/app_name\" >\n        <receiver android:name=\"MyReceiver\" >\n    </application>\n\
  </manifest>\n```\n\n在早于 8.0 的 Android 版本上运行时，与接收器关联的意图过滤器可以放在清单文件的接收元素中，如下：\n\n\
  ```xml\n<receiver android:name=\"MyReceiver\" >\n    <intent-filter>\n        <action\
  \ android:name=\"com.example.Broadcast\" >\n    </intent-filter>\n</receiver>\n\
  ```\n\n在 Android 8.0 或更高版本上，必须使用 `Activity` 类的 `registerReceiver()` 方法结合适当配置的 `IntentFilter`\
  \ 对象在代码中注册接收器：\n\n```java\nIntentFilter filter = new IntentFilter(\"com.example.Broadcast\"\
  );\nMyReceiver receiver = new MyReceiver();\nregisterReceiver(receiver, filter);\n\
  ```\n\n当代码中注册的广播接收器不再需要时，可以通过调用活动类的 `unregisterReceiver()` 方法对其进行注销，并传递接收器对象的引用作为参数。例如，以下代码将注销上述广播接收器：\n\
  \n```java\nunregisterReceiver(receiver);\n```\n\n需要注意的是，某些系统广播意图只有在代码中注册而非在清单文件中注册时才能被广播接收器检测到。请检查\
  \ Android `Intent` 类文档以获取系统广播意图的详细概述以及相应的在线：\n\n[`developer.android.com/reference/android/content/Intent`](https://developer.android.com/reference/android/content/Intent)\n\
  \n## 55.3 从广播获取结果\n\n当使用 `sendBroadcast()` 方法发送广播意图时，发起的活动无法从接收该广播的任何广播接收器获取结果。如果需要返回结果，则必须使用\
  \ `sendOrderedBroadcast()` 方法。当使用此方法发送广播意图时，它将顺序传递给每个注册感兴趣的广播接收器。\n\n\n\n\n\n`sendOrderedBroadcast()`\
  \ 方法在调用时传入了多个参数，其中包含另一个广播接收器的引用（称为结果接收器），当所有其他广播接收器处理完意图后，该接收器将被通知；同时还有一组数据引用，这些接收器可以将结果数据放入其中。当所有广播接收器都获得了机会处理广播后，结果接收器的\
  \ `onReceive()` 方法会被调用并传递结果数据。\n\n## 55.4 粘性广播意图 (Sticky Broadcast Intents)\n\n\
  默认情况下，广播意图一旦发送并被任何感兴趣的广播接收器处理，就会消失。然而，广播意图可以定义为“粘性”。粘性意图及其包含的数据在执行完成后仍保留在系统系统中。存储在粘性广播意图中的数据可以通过调用\
  \ `registerReceiver()` 方法的返回值获取，并使用通常的参数（广播接收器引用和意图过滤器对象）。许多 Android 系统广播都是粘性的，一个典型的例子是与电量状态相关的广播。\n\
  \n可以通过调用 `removeStickyBroadcast()` 方法随时移除粘性广播，该方法通过参数传递要移除的广播意图引用。\n\n## 55.5 广播意图示例\n\
  \n本章的剩余部分将详细介绍一个基于 Android Studio 的广播意图运行示例。在第一个实例中，将创建一个简单的应用程序用于发送自定义广播意图。随后将创建一个相应的广播接收器，当检测到广播时，它将在\
  \ Android 设备的屏幕上显示消息。最后，将修改广播接收器，以检测系统关于外部电源已从设备断出的通知。\n\n## 55.6 创建示例应用程序\n\n从欢迎界面选择\
  \ `New Project`（新建项目）选项，在出现的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Activity`（空活动）模板。\n\n\
  在 `Name` 字段中输入 `SendBroadcast`，并指定 `com.ebookfrenzy.sendbroadcast` 为包名。在点击 `Finish`\
  \ 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单设置为\
  \ `Java`。\n\n一旦创建了新项目，在 Project 工具窗口的 `app -> res -> layout` 下找到并加载 `activity_main.xml`\
  \ 布局文件，并在 Design 模式下的 Layout Editor 工具中，将 `TextView` 对象替换为 `Button` 视图，并设置 `text`\
  \ 属性显示为“Send Broadcast”。一旦设置了文本值，按照通常步骤将字符串提取到名为 `send_broadcast` 的资源中。\n\n在布局仍选中按钮的情况下，在\
  \ Attributes 面板中找到 `onClick` 属性并将其配置为调用名为 `broadcastIntent` 的方法。\n\n## 55.7 创建并发送广播意图\n\
  \n创建了 `SendBroadcast` 应用程序的框架后，现在是时候实现发送广播意图的代码了。这涉及实现之前指定的作为用户界面 `Button` 视图 `onClick`\
  \ 目标的 `broadcastIntent()` 方法。找到并双击 `MainActivity.java` 文件，并修改它以添加创建和发送广播意图的代码。修改后，该类的源代码如下：\n\
  \n```java\npackage com.ebookfrenzy.sendbroadcast;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport android.content.Intent;\n\nimport android.view.View;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n.\n\n.\n\n    public\
  \ void broadcastIntent(View view)\n    {\n\n        Intent intent = new Intent();\n\
  \        intent.setAction(\"com.ebookfrenzy.sendbroadcast\");\n        intent.addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES);\n\
  \        sendBroadcast(intent);\n    }\n}\n```\n\n注意，在此实例中意图的 action 字符串为 `com.ebookfrenzy.sendbroadcast`。在本章后续章节创建广播接收器类时，意图过滤器声明必须匹配此\
  \ action 字符串。\n\n至此完成发送广播意图的应用程序创建。剩下的就是构建一个匹配的广播接收器。\n\n## 55.8 创建广播接收器\n\n要创建广播接收器，需要创建一个继承自\
  \ `BroadcastReceiver` 超类的新类。在 Project 工具窗口中，导航到 `app -> java` 并右键点击包名。在出现的菜单中，选择\
  \ `New -> Other -> Broadcast Receiver` 选项，将类命名为 `MyReceiver`，并确保选择了 `Exported` 和\
  \ `Enabled` 选项。这些设置允许 Android 系统在需要时启动接收器，并确保该类能够接收设备上其他应用程序发送的消息。配置好类后，点击 `Finish`。\n\
  \n一旦创建，Android Studio 将自动将新的 `MyReceiver.java` 类文件加载到编辑器中，其内容如下：\n\n```java\npackage\
  \ com.ebookfrenzy.sendbroadcast;\n\nimport android.content.BroadcastReceiver;\n\n\
  import android.content.Context;\n\nimport android.content.Intent;\n\npublic class\
  \ MyReceiver extends BroadcastReceiver {\n\n    @Override\n    public void onReceive(Context\
  \ context, Intent intent) {\n        // TODO: This method is called when the BroadcastReceiver\
  \ is receiving\n        // an Intent broadcast.\n\n        throw new UnsupportedOperationException(\"\
  Not yet implemented\");\n    }\n}\n```\n\n如代码所示，Android Studio 为新类生成了一个模板，并为 `onReceive()`\
  \ 方法生成了一个存根。现在需要对类进行一些更改以实现所需的行为。因此，在 `MyReceiver.java` 文件中，修改代码如下：\n\n```java\n\
  package com.ebookfrenzy.sendbroadcast;\n\nimport android.content.BroadcastReceiver;\n\
  \nimport android.content.Context;\n\nimport android.content.Intent;\n\nimport android.widget.Toast;\n\
  \npublic class MyReceiver extends BroadcastReceiver {\n\n    @Override\n    public\
  \ void onReceive(Context context, Intent intent) {\n        // TODO: This method\
  \ is called when the BroadcastReceiver is receiving\n        // an Intent broadcast.\n\
  \n        throw new UnsupportedOperationException(\"Not yet implemented\");\n  \
  \      Toast.makeText(context, \"Broadcast Detected.\", Toast.LENGTH_LONG).show();\n\
  \    }\n}\n```\n\n广播接收器的代码现在完成了。\n\n## 55.9 注册广播接收器\n\n项目需要公示广播接收器的存在，并包含一个意图过滤器以指定接收器感兴趣的广播意图。当在上一节创建\
  \ `BroadcastReceiver` 类时，Android Studio 已自动在文件中添加了 `<receiver>` 元素。因此，剩下的就是在 `MainActivity.java`\
  \ 文件中添加代码创建意图过滤器并注册接收器：\n\n```java\npackage com.ebookfrenzy.sendbroadcast;\n\n.\n\
  \n.\n\nimport android.content.BroadcastReceiver;\n\nimport android.content.IntentFilter;\n\
  \n.\n\n.\n\npublic class MainActivity extends AppCompatActivity {\n\n    BroadcastReceiver\
  \ receiver;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        configureReceiver();\n    }\n\n    private void configureReceiver() {\n\
  \        IntentFilter filter = new IntentFilter();\n        filter.addAction(\"\
  com.ebookfrenzy.sendbroadcast\");\n        receiver = new MyReceiver();\n      \
  \  registerReceiver(receiver, filter);\n    }\n\n.\n\n.\n}\n```\n\n在不再需要广播接收器时，注销它也是重要的：\n\
  \n```java\n@Override\nprotected void onDestroy() {\n    super.onDestroy();\n   \
  \ unregisterReceiver(receiver);\n}\n```\n\n## 55.10 测试广播示例\n\n\n\n\n要测试广播发送端和接收端，请在设备或\
  \ AVD 上运行 `SendBroadcast` 应用，并等待它显示在屏幕上。运行后点击按钮，此时应该弹出一个显示“Broadcast Intent Detected”（检测到广播意图）的吐司消息，持续几秒后消失。\n\
  \n## 55.11 监听系统广播\n\n此示例的最后一个阶段是修改广播接收器的意图过滤器（intent filter），使其也监听外部电源从设备断开时广播的系统意图。该操作是\
  \ `android.intent.action.ACTION_POWER_DISCONNECTED`。修改 `MainActivity.java` 文件中的\
  \ `configureReceiver()` 方法以添加此额外的过滤器：\n\n```java\nprivate void configureReceiver()\
  \ {\n    IntentFilter filter = new IntentFilter();\n    filter.addAction(\"com.ebookfrenzy.sendbroadcast\"\
  );\n    filter.addAction(\n            \"android.intent.action.ACTION_POWER_DISCONNECTED\"\
  );\n    receiver = new MyReceiver();\n    registerReceiver(receiver, filter);\n\
  }\n```\n\n由于 `MyReceiver.java` 文件中的 `onReceive()` 方法现在将监听两种广播意图，因此有必要修改代码，将当前意图的动作字符串也显示在吐司消息中。该字符串可以通过调用作为参数传递给\
  \ `onReceive()` 方法的意图对象的 `getAction()` 方法获取：\n\n```java\npublic void onReceive(Context\
  \ context, Intent intent) {\n    String message = \"Broadcast intent detected \"\
  \n                    + intent.getAction();\n    Toast.makeText(context, message,\n\
  \            Toast.LENGTH_LONG).show();\n}\n```\n\n重新安装修改后的 `SendBroadcast` 包来测试接收器。在\
  \ `SendBroadcast` 应用程序中点击按钮现在应该产生一个包含自定义动作字符串的新消息：\n\n`Broadcast intent detected\
  \ com.ebookfrenzy.sendbroadcast`\n\n接下来，移除当前为 Android 设备供电的 USB 连接器，此时接收器将在吐司消息中报告以下内容。如果应用运行在模拟器上，请显示扩展控制，选择\
  \ Battery（电池）选项并将 Charger（充电器）连接设置为 None（无）。\n\n`Broadcast intent detected android.intent.action.ACTION_POWER_DISCONNECTED`\n\
  \n为了避免设备每次断开电源时都出现此消息，请启动设备上的 Settings（设置）应用并选择 Apps（应用）选项。从结果列表中选择 `SendBroadcast`\
  \ 应用并点击 Uninstall（卸载）按钮。\n\n## 55.12 总结\n\n广播意图（Broadcast intents）是一种机制，可以通过发布意图来供\
  \ Android 系统上的多个组件消费。广播通过注册 `Broadcast Receiver`（广播接收器）来检测，接收器反过来被配置为监听匹配特定动作字符串的意图。通常情况下，广播接收器保持休眠状态，直到检测到匹配的意图时被系统唤醒。Android\
  \ 系统还使用广播意图来发布事件通知，例如低电量警告或外部电源与设备的连接或断开通知。\n\n本章在提供广播意图和接收器概述外，还通过了一个发送广播意图的示例，以及用于监听自定义和系统广播意图的广播接收器的实现。\n\
  \n## 56. Java 线程、Handlers 和 Executors 的基本概述\n\n下一章将是系列章节的第一章，旨在介绍使用 Android Service\
  \ 在后台执行应用任务。然而，如果不首先 get 理解 Android 应用程序中线程的概念，就不可能理解实现服务涉及的步骤。因此，线程、线程处理器（Handlers）和执行服务（Executors）是本章的主题。\n\
  \n### 56.1 线程概述\n\n线程是任何多任务操作系统的基石，可以被认为是运行在主进程中的微进程，其目的是使应用程序内部至少出现并行执行路径的。\n\n\
  ### 56.2 应用主线程\n\n当 Android 应用程序首次启动时，运行时系统会创建一个单线程，所有应用组件默认将在该线程中运行。该线程通常被称为主线程（main\
  \ thread）。主线程的主要作用是在事件处理方面处理用户界面，并与用户界面进行交互。在应用程序内部启动的任何额外组件默认也会运行在主线程上。\n\n应用程序中任何使用主线程执行耗时任务的组件都会导致整个应用程序看起来像卡住了一，直到任务完成。这通常会导致操作系统向用户显示“应用未响应”（Application\
  \ is not responding）的警告。显然，这远不是任何应用程序想要的行为。这可以通过简单将要执行的任务在单独线程中启动来避免，允许主线程不受干扰地继续处理其他任务。\n\
  \n### 56.3 线程处理器 (ThreadHandlers)\n\n显然，Android 开发的关键规则之一是永远不要在应用的主线程上执行耗时操作。第二个同样重要的规则是，在单独线程中的代码在任何情况下都绝不能直接更新用户界面的任何部分。\n\
  \n对用户界面的任何更改必须在主线程内部执行。此的原因是 Android UI 工具包不是线程安全的。在多个线程内部尝试处理非线程安全的代码通常会导致间歇性问题和不可预测的应用程序行为。\n\
  \n如果在线程中执行的代码需要与用户界面交互，它必须通过与主线程同步来实现。这是通过在主线程中创建一个 handler 实现的，该 handler 反过来接收来自另一个线程的消息并更新用户界面。\n\
  \n### 56.4 线程示例\n\n本章的剩余部分将通过简单的示例来对线程提供基础介绍。第一步将强调在主线程之外的单独线程中执行耗时任务的重要性。启动 Android\
  \ Studio，从欢迎界面选择 New Project（新建项目）选项，并在结果的新项目对话框中选择 Empty Activity（空活动）模板，然后点击 Next（下一步）按钮。\n\
  \n在 Name 字段输入 `ThreadExample`，并将包名为 `com.ebookfrenzy.threadexample`。在点击 Finish（完成）按钮之前，将\
  \ Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将 Language（语言）菜单设置为 Java。将项目转换为使用\
  \ view binding。\n\n### 56.5 构建应用\n\n将项目的 `activity_main.xml` 文件加载到 Layout Editor（布局编辑器）工具中。选择默认的\
  \ TextView 组件并在 Properties 工具窗口将视图 ID 更改为 `myTextView`。\n\n在用户界面添加一个 Button 视图，位于现有\
  \ TextView 对象下方，如图 56-1 所示。添加按钮后，点击工具栏上的 Infer Constraints（推断约束）按钮以添加缺失的约束。\n\n\
  将文本更改为“Press Me”，并将其提取为名为 `press_me` 的资源。当按钮视图在布局中仍选中时，找到 `onClick` 属性并输入 `buttonClick`\
  \ 作为方法名。\n\n![](img/as_4.2_threadexample_ui.jpg)\n\n图 56-1\n\n\n\n\n接下来，将 `MainActivity.java`\
  \ 文件加载到编辑面板中，并为 `buttonClick()` 方法添加代码，该方法会在用户点击 `Button` 视图时调用。由于这里的目标是演示在主线程上执行耗时任务的问题，代码将在在\
  \ `TextView` 对象上显示不同文本之前简单的暂停 20 秒：\n\n```java\npublic void buttonClick(View view)\
  \ {\n    long endTime = System.currentTimeMillis() + 20 * 1000;\n    while (System.currentTimeMillis()\
  \ < endTime) {\n        synchronized (this) {\n            try {\n             \
  \   wait(endTime - System.currentTimeMillis());\n            } catch (Exception\
  \ e) {\n            }\n        }\n    }\n    binding.myTextView.setText(\"Button\
  \ Pressed\");\n}\n```\n\n完成代码更改后，在物理设备或模拟器上运行应用程序。一旦应用程序运行，点击按钮，此时应用程序将表现为处于冻结状态。例如，你将无法第二次点击按钮，在某些情况下，操作系统将报告应用程序无响应，如图\
  \ 56-2 所示。\n\n![](img/as_4.2_threadexample_not_responding.jpg)\n\n图 56-2\n\n显然，在\
  \ `buttonClick()` 方法中任何需要时间完成的任务都需要在单独的线程中执行。\n\n## 56.6 创建新线程\n\n要创建一个新线程，需要将在该线程中执行的代码放置在\
  \ `Runnable` 实例的 `run()` 方法中。然后需要创建一个新的 `Thread` 对象，并将 `Runnable` 实例引用传递给构造函数。最后，需要调用线程对象的\
  \ `start()` 方法来启动线程运行。因此，为了在 `buttonClick()` 方法中执行任务，需要进行以下更改：\n\n```java\npublic\
  \ void buttonClick(View view) {\n    Runnable runnable = new Runnable() {\n    \
  \    public void run() {\n            long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n            while (System.currentTimeMillis() < endTime) {\n   \
  \             synchronized (this) {\n                    try {\n               \
  \         wait(endTime - System.currentTimeMillis());\n                    } catch\
  \ (Exception e) {\n                    }\n                }\n            }\n   \
  \         binding.myTextView.setText(\"Button Pressed\");\n        }\n    };\n \
  \   Thread myThread = new Thread(runnable);\n    myThread.start();\n}\n```\n\n事实上，如果需要，可以使用\
  \ Lambda 表达式简化 `runnable` 的声明。进行此更改将导致如下声明：\n\n```java\nRunnable runnable = () ->\
  \ {\n    long endTime = System.currentTimeMillis() + 20 * 1000;\n    while (System.currentTimeMillis()\
  \ < endTime) {\n        synchronized (this) {\n            try {\n             \
  \   wait(endTime - System.currentTimeMillis());\n            } catch (Exception\
  \ e) {\n            }\n        }\n    }\n};\nThread myThread = new Thread(runnable);\n\
  myThread.start();\n```\n\n现在运行应用程序时，触摸按钮会导致延迟在新线程中执行，从而留出主线程继续处理用户界面，包括响应对额外按钮点击的响应。事实上，每次触摸按钮时，都会创建一个新线程，允许任务被多次执行。\n\
  \n仔细检查 `buttonClick()` 方法的更新代码会发现更新 `TextView` 的代码已被移除。正如之前提到的，从主线程以外的线程更新用户界面元素违反了\
  \ Android 开发的一项关键规则。因此，为了更新用户界面，有必要为线程实现一个 `Handler`。\n\n## 56.7 实现线程 Handler\n\n\
  线程 Handler 在应用程序的主线程中实现，主要用于响应运行在应用程序进程内的其他线程发送的消息来更新用户界面。\n\nHandlers 继承自 Android\
  \ 的 `Handler` 类，可以通过两种方式使用：指定一个在线程需要执行的 `Runnable`，或者重写 `Handler` 子类中的 `handleMessage()`\
  \ 回调方法，该方法会在线程向 handler 发送消息时被调用。\n\n为了本示例，将实现一个 handler 以便从之前创建的线程内部更新用户界面。将 `MainActivity.java`\
  \ 文件加载到 Android Studio 编辑器中并修改代码，为 activity 添加一个 `Handler` 实例：\n\n```java\nimport\
  \ android.os.Handler;\nimport android.os.Message;\nimport android.os.Looper;\n\n\
  public class MainActivity extends AppCompatActivity {\n    Handler handler = new\
  \ Handler(Looper.getMainLooper()) {\n        @Override public void handleMessage(Message\
  \ msg) {\n            binding.myTextView.setText(\"Message Received\");\n      \
  \  }\n    };\n}\n```\n\n上述代码更改声明了一个 handler 并在该 handler 中实现了 `handleMessage()` 回调，当线程向\
  \ handler 发送消息时将调用该方法。在此实例中，代码简单地在 `TextView` 上显示一个字符串。\n\n剩下的就是修改 `buttonClick()`\
  \ 方法向 handler 发送消息：\n\n```java\npublic void buttonClick(View view) {\n    Runnable\
  \ runnable = () -> {\n        long endTime = System.currentTimeMillis() + 20 * 1000;\n\
  \        while (System.currentTimeMillis() < endTime) {\n            synchronized\
  \ (this) {\n                try {\n                    wait(endTime - System.currentTimeMillis());\n\
  \                } catch (Exception e) {\n                }\n            }\n   \
  \     }\n        handler.sendMessage(0);\n    };\n    Thread myThread = new Thread(runnable);\n\
  \    myThread.start();\n}\n```\n\n注意，唯一的更改是调用了 `sendMessage()` 方法。由于 handler 目前对接收到的消息不做任何操作，因此它发送了一个空消息。编译并运行应用程序，触摸一次按钮。20\
  \ 秒后，新文本将出现在界面上。\n\n## 56.8 向 Handler 传递消息\n\n虽然之前的示例触发了 `handleMessage()` 回调，但它没有利用消息对象向\
  \ handler 发送数据。在教程的阶段，将进一步修改示例以便在线程和 handler 之间传递数据。首先，`buttonClick()` 方法中更新的线程将从系统获取字符串格式的日期和时间，将其存储在\
  \ `Bundle` 对象中。然后调用 handler 的 `obtainMessage()` 方法从池中获取一个消息。最后在通过调用 handler 的 `sendMessage()`\
  \ 方法发送之前，将 bundle 添加到消息中：\n\n```java\npublic void buttonClick(View view) {\n   \
  \ Runnable runnable = () -> {\n        long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n        while (System.currentTimeMillis() < endTime) {\n       \
  \     synchronized (this) {\n                try {\n                    wait(endTime\
  \ - System.currentTimeMillis());\n                } catch (Exception e) {\n    \
  \            }\n            }\n        }\n        Message msg = handler.obtainMessage();\n\
  \        Bundle bundle = new Bundle();\n        bundle.putString(\"myKey\", \"Thread\
  \ Completed\");\n        msg.setData(bundle);\n        handler.sendMessage(msg);\n\
  \    };\n    Thread myThread = new Thread(runnable);\n    myThread.start();\n}\n\
  ```\n\n\n\n接下来，更新处理器的 `handleMessage()` 方法，从消息的 `bundle` 对象中提取日期和时间字符串，并将其显示在 `TextView`\
  \ 对象上：\n\n```java\nHandler handler = new Handler(Looper.getMainLooper()) {\n   \
  \ @Override\n    public void handleMessage(Message msg) {\n        Bundle bundle\
  \ = msg.getData();\n        String string = bundle.getString(\"myKey\");\n     \
  \   binding.myTextView.setText(string);\n    }\n};\n```\n\n最后，编译并运行应用程序，测试点击按钮现在是否会在线程完成后在\
  \ `TextView` 对象上显示“Thread Complete”消息。\n\n# 56.9 Java 执行器并发 (Java Executor Concurrency)\n\
  \n在本章中目前为止，我们一直关注的是直接创建和管理 Java 线程。虽然对于简单的多线程任务来说是可以接受的，但在处理涉及大量线程的复杂情况时，这被证明是不够的。例如，启动和停止线程涉及到系统开销。因此，创建和销毁大量线程的应用程序面临性能下降的风险。基础线程\
  \ API 也没有为调度或重复执行任务、或从任务返回结果提供预定义的选项。\n\n通过使用 Java 并发框架（`java.util.concurrent` 包的一部分）的\
  \ `Executor` 类，可以克服直接与线程操作的缺点。该框架允许创建活动线程池，并管理如何将任务分配给这些线程。这使得现有线程可以重用于其他任务，而无需不断创建新线程。\n\
  \n该框架还提供了额外功能，包括在任务完成后返回结果的能力（称为 `Callable` 任务）、检查线程状态，以及调度任务在超时后或按重复的时间间隔运行。\n\n\
  ## 56.10 使用 Runnable 任务\n\n探索该框架的第一步是修改 `buttonClicked()` 方法，使用并发框架 `Executor` 在单独线程中运行任务：\n\
  \n```java\nimport java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\n\
  \npublic void buttonClick(View view) {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n\
  \    executor.submit(new Runnable(){\n        public void run(){\n            long\
  \ endTime = System.currentTimeMillis() + 10 * 1000;\n            while (System.currentTimeMillis()\
  \ < endTime) {\n                synchronized (this) {\n                    try {\n\
  \                        wait(endTime - System.currentTimeMillis());\n         \
  \           } catch (Exception e) {\n                    }\n                }\n\
  \            }\n            Message msg = handler.obtainMessage();\n           \
  \ Bundle bundle = new Bundle();\n            bundle.putString(\"myKey\", \"Button\
  \ Pressed\");\n            msg.setData(bundle);\n            handler.sendMessage(msg);\n\
  \        }\n    });\n    executor.shutdown();\n}\n```\n\n当执行上述代码时，超时操作将像以前一样在单独的线程上执行。然而，对方法所做的更改需要一些解释。首先，从\
  \ `Executors` 实例获取一个 `ExecutorService` 实例的引用：\n\n`ExecutorService executor = Executors.newSingleThreadExecutor();`\n\
  \n在这种情况下，请求了一个只包含一个线程的池。可以通过以下方式请求具有指定数量线程的池：\n\n`ExecutorService executor = Executors.newThreadPool(10);`\n\
  \n接下来，通过调用执行器实例的 `submit()` 方法，在线程上启动一个 `Runnable` 任务：\n\n`executor.submit(new Runnable(){\
  \ long endTime = System.currentTimeMillis() + 20 * 1000; });`\n\n注意，上面的声明可以通过将其转换为\
  \ lambda 表达式来简化：\n\n`executor.submit(() -> { long endTime = System.currentTimeMillis()\
  \ + 20 * 1000; });`\n\n从现在起，任务将一直运行直到完成。然而，一旦完成，执行器服务将继续运行。如果你不再需要该服务，应该将其关闭。\n\n\
  ### 6.1 关闭一个 ExecutorService 服务\n\n`ExecutorService` 提供了几种启动关闭的技术。要通知服务在当前运行的任务完成后自动关闭，应像如下所示调用\
  \ `shutdown()` 方法：\n\n`executor.shutdown();`\n\n另一方面，调用 `shutdownNow()` 方法将停止所有在服务上运行的任务，并取消对待处理任务的处理：\n\
  \n`executor.shutdownNow();`\n\n### 6.2 使用 Callable 任务和 Futures\n\n如前文所述，`ExecutorService`\
  \ 支持所谓的 `Callable` 任务，该任务能够在任务完成后返回结果。运行在单独线程上的任务预计需要一些时间才能完成（否则它们最初可能就不需要运行在单独的线程中了）。这引出了问题：如何将结果返回给启动任务的线程中的代码。这是通过使用\
  \ `Future` 类型实现的，它代表未来某个时刻将提供的值。\n\n当执行可调用任务时，它会返回一个 `Future` 实例，随后应用程序可以使用该实例在任务完成后获取结果。要看到这一操作，首先开始编辑\
  \ `activity_main.xml` 文件，添加一个标记为“Status”的额外按钮，并将 `onClick` 属性配置为调用名为 `statusClick`\
  \ 方法：\n\n![](img/as_4.2_threadexample_status_button.jpg) 图 56-3\n\n接下来，修改 `buttonClick()`\
  \ 方法以执行一个 `Callable` 任务，该任务配置为通过 `Future` 变量返回一个 `String` 值：\n\n```java\nimport\
  \ java.util.concurrent.Callable;\nimport java.util.concurrent.Future;\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n    Future<String> future;\n\n\
  \    public void buttonClick(View view) {\n        ExecutorService executor = Executors.newSingleThreadExecutor();\n\
  \        future = executor.submit(new Callable<String>() {\n            public String\
  \ call() {\n                long endTime = System.currentTimeMillis() + 10 * 1000;\n\
  \                while (System.currentTimeMillis() < endTime) {\n              \
  \      synchronized (this) {\n                        try {\n                  \
  \          wait(endTime - System.currentTimeMillis());\n                       \
  \ } catch (Exception e) {\n                        }\n                    }\n  \
  \              }\n                return \"Task Completed\";\n            }\n  \
  \      });\n        executor.shutdown();\n    }\n}\n```\n\n注意，除了导入 `java.util.concurrent.Future`\
  \ 包并声明一个存储字符串值的 `Future` 变量外，对启动任务的方式也进行了一些更改：\n\n`future = executor.submit(new\
  \ Callable<String>() { ... });`\n\n这里的关键点是，我们不再向执行器服务提交 `Runnable` 任务，而是传递一个 `Callable`\
  \ 任务（声明返回 `String` 值）。同样注意任务的结果被赋值给了 `Future` 变量。此外，使用 `call()` 代替之前提交 `Runnable`\
  \ 任务时使用的 `run()` 方法。最后，添加了返回语句以返回字符串值：\n\n`return \"Task Completed\"`\n\n`buttonClick()`\
  \ 方法现在配置为启动 `Callable` 任务，并将返回值赋值给 `Future` 变量。应用程序现在需要知道任务何时完成以及结果何时可用。一种方案是调用\
  \ `Future` 变量的 `get()` 方法。由于该方法在执行失败或被中断时可能会抛出异常，必须在 `try/catch` 语句中执行，如下所示：\n\n\
  ```java\nString result = null;\n\ntry {\n```\n\n\n\n\n\n```java\nresult = future.get();\n\
  \n} catch (ExecutionException | InterruptedException e) {\n    e.printStackTrace();\n\
  }\n```\n\n遗憾的是，`get()` 方法会阻塞当前线程，直到该线程中运行的任务完成，从而违背了最初在在独立线程中运行任务的初衷。另一个选项是为 `get()`\
  \ 方法调用提供一个超时时间，到那时它会将控制权交回当前线程。例如，以下代码将导致 `get()` 调用在 3 秒后超时：\n\n```java\nresult\
  \ = future.get(3, TimeUnit.SECONDS);\n```\n\n然而，更好的替代方案是调用 `Future` 实例的 `isDone()`\
  \ 方法来检查线程状态，并且在任务完成后再调用 `get()` 方法。为了实现此行为，请如下所示向 `MainActivity.java` 文件添加 `statusClick()`\
  \ 方法：\n\n```java\nimport java.util.concurrent.ExecutionException;\nimport java.util.concurrent.TimeUnit;\n\
  import java.util.concurrent.TimeoutException;\n\npublic void statusClick(View view)\
  \ {\n    if (future.isDone()) {\n        String result = null;\n        try {\n\
  \            result = future.get(3, TimeUnit.SECONDS);\n        } catch (ExecutionException\
  \ | InterruptedException | TimeoutException e) {\n            e.printStackTrace();\n\
  \        }\n        binding.myTextView.setText(result);\n    } else {\n        binding.myTextView.setText(\"\
  Waiting\");\n    }\n}\n```\n\n完成更改后，运行应用并点击“Press Me”按钮。在任务运行期间，点击“Status”按钮。只要任务仍在运行，`TextView`\
  \ 中就会显示“Waiting”消息。然而，一旦任务完成，`isDone()` 方法将返回 `true` 值，将调用 `get()` 方法，并将任务返回的字符串（“Task\
  \ Complete”）显示在 `TextView` 上。\n\n## 56.14 调度调度\n\n\n\n最后一个涵盖的领域涉及使用 `ExecutorService`\
  \ 来调度任务执行。这涉及到使用 `ScheduledExecutorService` 实例，在该实例上需要调用 `schedule()` 方法，传递要执行的\
  \ `Runnable` 任务以及一个时间延迟。`schedule()` 调用将返回一个 `ScheduledFuture` 实例，该实例可用于识别任务启动前的剩余时间。\n\
  \n例如，以下代码调度了一个任务在 30 秒后运行，并访问剩余的延迟时间：\n\n```java\nScheduledExecutorService executor\
  \ = Executors.newScheduledThreadPool(1);\nRunnable task = () -> {\n    // 在此处执行任务的代码\n\
  };\nScheduledFuture<?> future = executor.schedule(task, 30, TimeUnit.SECONDS);\n\
  long delayRemaining = future.getDelay(TimeUnit.SECONDS);\n```\n\n同样，`ScheduledExecutorService`\
  \ 可用于在可选的初始延迟后，以固定的间隔重复执行任务。例如，以下代码会导致任务在初始 30 秒延迟后，每隔 10 秒执行一次：\n\n```java\nexecutor.scheduleAtFixedRate(task,\
  \ 30, 10, TimeUnit.SECONDS);\n```\n\n`scheduleAtFixedRate()` 方法无论之前之前调度的任务是否完成，都会启动任务的下一个实例。若要指定一个任务执行结束与下一次执行开始之间的固定时间间隔，请使用\
  \ `scheduleWithFixedDelay()` 方法。在接下来的示例中，第一个任务在延迟 0 秒后调度，随后的每次执行都在上一个任务完成 10 秒后发生：\n\
  \n```java\nexecutor.scheduleWithFixedDelay(task, 0, 10, TimeUnit.SECONDS);\n```\n\
  \n## 56.15 总结\n\n本章的目标是提供 Android 应用中多线程的概述。当应用程序首次在进程启动时，运行时系统会创建一个主线程，所有随后启动的应用组件默认都会在该线程中运行。主线程的主要作用是处理用户界面，因此在该线程中执行的任何耗时任务都会导致应用出现卡死的现象。因此，将可能需要时间完成的任务在独立线程中启动是至关重要的。\n\
  \n由于 Android 用户界面工具包不是线程安全的，因此不应在主线程之外的任何线程对用户界面进行更改。可以通过在主线程中创建一个 `handler` 来用户界面更改，并从其他非主线程向其发送消息。\n\
  \n线程可以直接创建，也可以使用 Java 并发框架的执行器服务。对于更复杂的线程线程需求，该框架提供了线程池的自动管理、任务结果返回以及执行调度。\n\n##\
  \ 57. Android Service 概述\n\n`Service` 类专门设计用于允许应用程序启动并执行后台任务。与旨在快速执行任务并退出的广播接收器不同，服务的设计是为了执行需要长时间才能完成的任务（例如通过互联网连接下载文件或向用户流式传输音乐），但不需要用户界面。在本章中，将涵盖可用不同类型服务的概述，包括启动服务（started\
  \ services）、绑定服务（bound services）和意图服务（intent services）。在涵盖这些基础之后，后续章节将通过多个服务的运行示例。\n\
  \n### 57.1 启动服务\n\n启动服务由其他组件（如 Activity 或广播接收器）启动，并可能无限运行，直到服务停止或被 Android 系统销毁以释放资源。如果启动它的应用程序不再处于前台，即使启动它的组件被销毁，该服务也会继续运行。\n\
  \n默认情况下，服务将在启动它的应用程序相同的主线程中运行（称为本地服务）。因此，将任何 CPU 密集型任务在新线程中执行是非常重要的。要指示服务在单独进程中运行（因此被称为远程服务），需要在清单文件中进行配置。除非服务被专门配置为私有（再次通过清单文件中的设置），否则同一\
  \ Android 设备上的其他组件都可以启动它。这是通过使用 `Intent` 机制实现的，就像一个 Activity 可以启动另一个一样。\n\n启动服务通过调用\
  \ `startService()` 方法启动，传递一个标识要启动服务的 `Intent` 对象。当启动服务完成任务后，它应该通过调用 `stopSelf()`\
  \ 停止自己。或者，运行中的服务可以通过另一个组件通过调用 `stopService()` 方法停止，传递一个匹配的用于停止服务的 `Intent`。Android\
  \ 系统赋予服务高优先级，它们通常是释放资源时最后被终止的项之一。\n\n### 57.2 Intent Service\n\n如前所述，服务默认在启动它的组件相同的主线程中运行。因此，需要由服务执行的任何\
  \ CPU 密集型任务都应该在新线程中进行，从而避免影响调用应用程序的性能。\n\n`JobIntentService` 类是一个便利类（子自 `Service`\
  \ 类），它设置了一个工作线程来处理后台任务，并以异步方式处理每个请求。一旦服务处理了所有队列中的请求，它就会直接退出。使用 `JobIntentService`\
  \ 类仅需要实现 `onHandleWork()` 方法，并在其中包含每个请求要执行的代码。\n\n\n\n\n\n对于不需要同步处理请求的服务，`JobIntentService`\
  \ 是推荐的选项。然而，需要同步处理请求的服务则需要继承自 `Service` 类，并手动实现和管理线程，以高效地处理任何 CPU 密集型任务。\n\n## 57.3\
  \ 绑定型服务 (Bound Service)\n\n绑定服务与启动服务（started service）类似，不同之处在于启动服务通常不会返回结果，也不允许与启动它的组件进行交互。相反，绑定服务允许启动组件与服务进行交互，并从服务处接收结果。通过进程间通信（IPC）的实现，这种交互也可以跨进程边界进行。例如，一个\
  \ Activity 可以启动一个服务来处理音频播放。该 Activity 可能会包含一个用户界面，为用户提供暂停播放或跳到下一曲目的控制控件。同样，服务很可能需要向调用它的\
  \ Activity 通信信息，指示当前音频轨道已完成，并提供即将开始播放的下一曲目的详细信息。\n\n组件（在此文中也称为客户端）通过调用 `bindService()`\
  \ 方法启动并绑定到绑定服务。此外，多个组件可以同时绑定到一个服务。当客户端不再需要服务绑定时，应调用 `unbindService()` 方法。当最后一个绑定的客户端从服务取消绑定时，Android\
  \ 运行时系统将终止该服务。需要注意的是，绑定服务也可以通过调用 `startService()` 来启动。一旦启动，组件随后可以通过 `bindService()`\
  \ 调用绑定到它。当绑定服务通过调用 `startService()` 启动时，即使在最后一个客户端从它处取消绑定后，它也会继续运行。\n\n绑定服务必须包含\
  \ `onBind()` 方法的实现，该方法在服务最初创建时以及其他客户端随后绑定到运行中的服务时都会被调用。该方法的目的是向绑定的客户端返回一个类型为 `IBinder`\
  \ 的对象，该对象包含了客户端与服务通信所需的信息。\n\n在实现客户端与绑定服务之间的通信方面，推荐的技术取决于客户端和服务是否处于同一个进程或不同的进程中，以及该服务对于客户端而言是否是私有的。本地通信可以通过扩展\
  \ `Binder` 类并从 `onBind()` 方法返回一个实例来实现。另一方面，进程间通信则需要 `Messenger` 和 `Handler` 的实现。这两种方法的详细细节将在随后的章节中介绍。\n\
  \n## 57.4 服务的结构剖析 (The Anatomy of a Service)\n\n如前所述，服务必须创建为 Android `Service` 类（更具体说是\
  \ `android.app.Service`）或其子类（如 `android.app.IntentService`）。在子类化过程中，根据所创建服务的具体性质，必须重写以下一个或多个父类回调方法：\n\
  \n* `onStartCommand()` – 当另一个组件通过调用 `startService()` 方法启动服务时会调用此方法。对于绑定服务，不需要实现此方法。\n\
  * `onBind()` – 当组件通过调用 `bindService()` 方法绑定到服务时被调用。在实现绑定服务时，此方法必须返回一个 `IBinder`\
  \ 对象以促进与客户端的通信。对于启动服务，此方法必须实现并返回一个 `NULL` 值。\n* `onCreate()` – 意用于执行初始化任务的地方，此方法在调用\
  \ `onStartCommand()` 或第一次调用 `onBind()` 方法之前立即被调用。\n* `onDestroy()` – 当服务被销毁时调用。\n\
  * `onHandleWork()` – 仅适用于 `JobIntentService` 子类。此方法被用于处理服务的逻辑。它在独立于主线程的线程中执行。\n\n\
  注意，`IntentService` 类包含了它自己的 `onStartCommand()` 和 `onBind()` 回调方法的实现，因此在子类中不需要实现它们。\n\
  \n## 57.5 控制已销毁服务的重启选项\n\n`onStartCommand()` 回调方法要求返回一个整数值，以定义服务被 Android 运行时系统销毁时应该发生什么。这些方法可能的返回值如下：\n\
  \n* `START_NOT_STICKY` – 告知系统，在服务由于被销毁的情况下，除非有等待交付的意图（pending intents），否则不应重启服务。\n\
  * `START_STICKY` – 表明如果销毁发生在 `onStartCommand()` 方法返回之后，则应在销毁后尽快重启服务。如果没有等待交付的意图，则调用\
  \ `onStartCommand()` 回调方法并传入一个 `NULL` 意 值。服务被销毁时正在处理的 intent 将丢弃。\n* `START_REDELIVER_INTENT`\
  \ – 表明如果服务在从 `onStartCommand()` 回调方法返回后销毁，则应该重启服务，并将当前的 intent 重新传递给 `onStartCommand()`\
  \ 方法，随后是任何待处理的 intent。\n\n## 57.6 在 Manifest 文件中声明服务\n\n为了使服务可用，必须首先在 manifest 文件中声明。这涉及在现有的\
  \ `<application>` 条目中嵌入一个配置适当的 `<service>` 元素。至少，`<service>` 元素必须包含一个声明服务类名的属性，如下\
  \ XML 片段所示：\n\n```xml\n<application\n    android:icon=\"@mipmap/ic_launcher\"\n\
  \    android:label=\"@string/app_name\" >\n    <activity\n        android:label=\"\
  @string/app_name\"\n        android:name=\".MainActivity\" >\n        <intent-filter>\n\
  \            <action android:name=\"android.intent.MAIN\" />\n            <category\
  \ android:name=\"android.intent.category.LAUNCHER\" />\n        </intent-filter>\n\
  \    </activity>\n    <service android:name=\".MyService\" />\n</application>\n\
  ```\n\n默认情况下，服务是公开的，这意味着可以通过包之外的组件访问。要将服务设为私有，必须在 `<service>` 元素中将 `android:exported`\
  \ 属性声明为 `false`。例如：\n\n```xml\n<service android:name=\"MyService\"\n    android:exported=\"\
  false\">\n</service>\n```\n\n在使用 `JobIntentService` 时，manifest 服务声明还必须请求 `BIND_JOB_SERVICE`\
  \ 权限，如下：\n\n```xml\n<service\n    android:name=\".MyJobIntentService\"\n    android:permission=\"\
  android.permission.BIND_JOB_SERVICE\" />\n```\n\n如前，服务默认在调用组件相同的进程中运行。要强制服务在自己的进程中运行，请向\
  \ `<service>` 元素添加 `android:process` 属性，并声明一个带有冒号(:) 前缀的进程名称：\n\n```xml\n<service\
  \ android:name=\".MyService\"\n    android:exported=\"false\"\n    android:process=\"\
  :myprocess\">\n</service>\n```\n\n冒号前缀表示新进程对于本地应用程序是私有的。然而，如果进程名称是以小字母而不是冒号开头，该进程将是全局的供其他组件使用。\n\
  \n最后，通过对于 Activity 所述的意过滤器机制，服务还可以向设备上运行的其他应用程序发布其功能。有关意过滤器的更多信息，请参阅“Android Intent\
  \ 概述”章节。\n\n\n\n\n\n# 57.7 在系统启动时启动服务\n\n由于服务具有后台性质，在 Android 系统首次启动时需要启动服务并不罕见。这可以通过创建一个广播接收器（broadcast\
  \ receiver），并配置意图过滤器（intent filter）监听系统的 `android.intent.action.BOOT_COMPLETED`\
  \ 意图来实现。当检测到此类意图时，广播接收器只需调用必要的服务然后返回。请注意，为了运行，此类广播接收器需要请求 `android.permission.RECEIVE_BOOT_COMPLETED`\
  \ 权限。\n\n## 57.8 总结\n\nAndroid 服务是一项强大的机制，允许应用程序在后台执行任务。服务一旦启动，无论调用它的应用程序是否处于前台状态，即使启动服务的组件被销毁，它都将继续运行。\n\
  \n服务继承自 `Service` 类，分为启动服务（started services）和绑定服务（bound services）。启动服务会一直运行，直到被停止或销毁为止，并且它们本身不提供与其他组件进行交互或数据交换的机制。相比之下，绑定服务为其他客户端组件提供了通信接口，通常一直运行到最后一个客户端从服务中解绑为止。\n\
  \n默认情况下，服务在与调用应用程序相同的进程和主线程中运行。因此，应该在服务内部创建一个新线程，用于处理 CPU 密集型任务。远程服务可以通过对应用程序清单文件（manifest）中相应的\
  \ `<service>` 条目进行小的配置更改，在独立的进程中启动。\n\n`IntentService` 类（本身是 `Service` 类的子类）提供了一种方便的机制，用于在独立的辅助线程中处理异步服务请求。\n\
  \n# 58. 实现一个 Android 启动服务 – 实例演示\n\n上一章涵盖了大量关于 Android 服务的相关信息，到此时，服务的概念可能看起来有些无从下手。为了加强上一章的内容，本章将通过一个\
  \ Android Studio 教程，旨在逐步介绍启动服务实现的概念。\n\n在本章中，将创建一个示例应用程序并将其作为实现 Android 服务的的基础。在第一个实例中，将使用\
  \ `IntentService` 类创建服务。随后，将扩展此示例以演示如何 `Service` 类的用法。最后，将实现使用 `Service` 类时在独立线程中执行任务的步骤。在本章学习了启动服务后，下一章题为“Android\
  \ 本地绑定服务 – 实例演示”，将侧重于绑定服务的实现和客户端与服务之间的通信。\n\n## 58.1 创建示例项目\n\n从欢迎界面选择 `New Project`\
  \ 选项，在出现的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `ServiceExample`，并指定\
  \ `com.ebookfrenzy.serviceexample` 为包名。在点击 `Finish` 按钮之前，将 Minimum API level 设置为\
  \ `API 26`：Android 8.0 (Oreo)，并将语言菜单设置为 `Java`。按照章节 [11.8 Migrating a Project to\
  \ View Binding] 中概述的方法修改项目以支持 view binding。\n\n## 58.2 设计用户界面\n\n在 Project 工具窗口中找到并加载\
  \ `activity_main.xml` 文件（app -> res -> layout -> `activity_main.xml`）。右键点击“Hello\
  \ World!” `TextView`，并在弹出的菜单中选择 `Convert view...`选项。在转换对话框中，点击 `Apply` 之前选择 `Button`\
  \ 视图。选择新按钮，将文本更改为“Start Service”，并将字符串提取到命名为 `start_service` 的资源中。在仍选中 `Button`\
  \ 的情况下，在 Attributes 面板中找到 `onClick` 属性，为其分配一个名为 `buttonClick` 的方法。\n\n## 58.3 创建服务类\n\
  \n在编写任何代码之前，第一步是在项目中添加一个新类来包含该服务。本教程中演示的第一种服务将基于 `JobIntentService` 类。正如前章（“Android\
  \ 服务概述”）所述，`JobIntentService` 类的目的是为开发者提供一种方便的机制，用于创建在调用应用程序独立线程中异步执行任务的服务。\n\n\
  在 Project 工具窗口中右键点击 app -> java 下的 `com.ebookfrenzy.serviceexample` 包名，选择 `New ->\
  \ Java Class` 菜单选项以添加新类。在结果对话框中，将新类命名为 `MyJobIntentService`。最后，创建新类。\n\n在 Android\
  \ Studio 编辑器中查看新的 `MyJobIntentService.java` 文件，其内容如下：\n\n```java\npackage com.ebookfrenzy.serviceexample;\n\
  \npublic class MyJobIntentService {\n\n}\n```\n\n需要修改该类使其继承 `JobIntentService` 类。在继承\
  \ `JobIntentService` 时，类必须重写 `onHandleWork()` 方法。因此，修改 `MyJobIntentService.java`\
  \ 文件中的代码，使其如下：\n\n```java\npackage com.ebookfrenzy.serviceexample;\n\nimport android.content.Intent;\n\
  \nimport androidx.core.app.JobIntentService;\nimport androidx.annotation.NonNull;\n\
  \npublic class MyIntentService extends JobIntentService {\n\n    @Override\n   \
  \ protected void onHandleWork(@NonNull Intent intent) {\n\n    }\n}\n```\n\n此时只需在\
  \ `onHandleWork()` 方法中实现一些代码，以便服务在被调用时实际执行某些操作。通常，这将涉及执行需要一些时间完成的任务，例如下载大文件或播放音频。出于本示例的需要，处理器将睡眠\
  \ 3 秒，并向 Android Log 输出消息：\n\n```java\npackage com.ebookfrenzy.serviceexample;\n\
  \nimport android.util.Log;\n\npublic class MyIntentService extends JobIntentService\
  \ {\n    private final String TAG = \"Service\";\n    @Override\n    protected void\
  \ onHandleWork(@NonNull intent) {\n        Log.i(TAG, \"Job started\");\n      \
  \  int i = 0;\n        while (i <= 3) {\n            try {\n                Thread.sleep(1000);\n\
  \                i++;\n            } catch (Exception e) {\n            }\n    \
  \    }\n        Log.i(TAG, \"Service running\");\n    }\n}\n```\n\n## 58.4 在清单文件中添加服务\n\
  \n在调用服务之前，必须将其添加到所属的应用程序清单文件中。至少涉及添加 `<service>` 元素以及服务的类名 `BIND_JOB_SERVICE` 权限请求。\n\
  \n双击当前项目的 `AndroidManifest.xml` 文件（app -> manifests）将其加载到编辑器中，并按所示修改 XML 添加服务元素：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.example.serviceexample\"\
  \ >\n\n    <application\n        android:allowBackup=\"true\"\n        android:icon=\"\
  @mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\n        android:roundIcon=\"\
  @mipmap/ic_launcher_round\"\n        android:supportsRtl=\"true\"\n        android:theme=\"\
  @style/Theme.ServiceExample\" >\n\n        <activity\n            android:name=\"\
  .MainActivity\"\n            android:exported=\"true\">\n            <intent-filter>\n\
  \                <action android:name=\"android.intent.action.MAIN\" />\n      \
  \      </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n\n\n\n\n```xml\n            <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n\n        </intent-filter>\n      </activity>\n      <service\n          android:name=\"\
  .MyJobIntentService\"\n          android:permission=\"android.permission.BIND_JOB_SERVICE\"\
  \ />\n    </application>\n</manifest>\n```\n\n## 58.5 启动服务\n\n现在服务已经实现并在清单文件中进行了声明，下一步是添加代码以便在点击按钮时启动服务。找到并将\
  \ `MainActivity.java` 文件加载到编辑器中，并实现 `buttonClick()` 方法以添加启动服务的代码：\n\n```java\npackage\
  \ com.ebookfrenzy.serviceexample;\n\n.\n\n.\n\nimport android.content.Intent;\n\n\
  import static androidx.core.app.JobIntentService.enqueueWork;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    static final int SERVICE_ID = 1001;\n.\n\n  \
  \  public void buttonClick(View view) {\n        Intent intent = new Intent();\n\
  \        enqueueWork(this, MyJobIntentService.class, SERVICE_ID, intent);\n    }\n\
  }\n```\n\n该代码声明了一个服务 ID（此可以是任何整数值），用于标识该服务。接下来，实现了 `buttonClick()` 方法，调用 `JobIntentService`\
  \ 类的 `enqueueWork()` 方法来提交服务进行执行。\n\n## 58.6 测试 IntentService 示例\n\n这个基于 `IntentService`\
  \ 的服务示例现在已经完成并准备好进行测试。由于服务显示的消息将出现在 Logcat 面板中，因此在 Android Studio 环境中配置此项至关重要。\n\
  \n首先，在点击面板右上角的菜单之前，显示 Logcat 工具窗口（该菜单目前可能显示为 `Show only selected application`）。从此菜单中，选择\
  \ `Edit Filter Configuration`（编辑过滤器配置）选项。\n\n在 `Create New Logcat Filter` 对话框中，将过滤器命名为\
  \ `ServiceExample`，并在 `Log Tag` 字段中输入在 `MyIntentService.java` 中声明的 `TAG` 值（在上面的代码示例中为\
  \ `ServiceExample`）。\n\n更改完成后，点击 `OK` 按钮创建过滤器并关闭对话框。新创建的过滤器现在应该已经在 Android 工具窗口中被选中。\n\
  \n配置好过滤器后，在物理设备或 AVD 模拟器会话上运行应用程序，点击 `Start Service` 按钮。注意 Logcat 面板中出现了“Job Service\
  \ Started”消息。注意，在应用程序启动后，可能需要将过滤器设置改回 `ServiceExample`：\n\n```\n2021-01-14 14:20:05.630\
  \ 7193-7265/com.example.serviceexample I/ServiceExample: Job Service started\n```\n\
  \n在接下来的 30 秒内，`Service Running` 将每隔 10 秒出现一次。需要注意的是，此执行是在与主线程不同的线程上进行的，这使得应用程序能够自由响应用户并执行其他任务。\n\
  \n## 58.7 使用 Service 类\n\n虽然 `JobIntentService` 类允许用最少的代码实现服务，但在某些情况下，需要 `Service`\
  \ 类的灵性和同步特性。正如本章将变得显而易见的，这涉及到一些额外的编程工作来实现。\n\n为了避免一次性引入过多的概念，并作为对在调用程序的同一线程中执行耗时服务任务的固有风险的演示，此处的示例服务将不会在新线程中运行服务任务，而是依赖应用程序的主线程。在服务内部创建和管理新线程将在教程的下一阶段进行介绍。\n\
  \n## 58.8 创建新服务\n\n为了本示例，将在项目中添加一个继承自 `Service` 类的新类。因此，在 Project 工具窗口中右键点击 `app\
  \ -> java` 下列出的包名，选择 `New -> Service -> Service` 菜单选项。创建一个名为 `MyService` 的新类，并勾选\
  \ `Exported`（导出）和 `Enabled`（启用）选项。\n\n创建一个运行服务的最低要求是实现 `onStartCommand()` 回调方法，该方法会在服务启动时被调用。此外，`onBind()`\
  \ 方法必须返回 `null` 值，以向 Android 系统表明这不是绑定服务。为了本示例，`onStartCommand()` 方法将循环 3 次，每次循环迭代时睡眠\
  \ 10 秒。为了完整性，新的 `MyService.java` 文件中还将实现 `onCreate()` 和 `onDestroy()` 方法的存根版本，如下：\n\
  \n```java\npackage com.ebookfrenzy.serviceexample;\n\nimport android.app.Service;\n\
  \nimport android.content.Intent;\n\nimport android.os.IBinder;\n\nimport android.util.Log;\n\
  \npublic class MyService extends Service {\n    public MyService() {\n    }\n  \
  \  private final String TAG = \"ServiceExample\";\n    @Override\n    public void\
  \ onCreate() {\n        Log.i(TAG, \"onCreate\");\n    }\n    @Override\n    public\
  \ int onStartCommand(Intent intent, int flags, int startId) {\n        Log.i(TAG,\
  \ \"onStartCommand \" + startId);\n        int i = 0;\n        while (i <= 3) {\n\
  \            try {\n                Thread.sleep(10000);\n                i++;\n\
  \            } catch (Exception e) {\n                Log.i(TAG, \"Service running\"\
  );\n            }\n        }\n        return Service.STICKY;\n    }\n    @Override\n\
  \    public IBinder onBind(Intent intent) {\n        Log.i(TAG, \"onBind\");\n \
  \       return null;\n    }\n    @Override\n    public void onDestroy() {\n    \
  \    Log.i(TAG, \"onDestroy\");\n    }\n}\n```\n\n服务实现后，将 `AndroidManifest.xml`\
  \ 文件加载到编辑器中，验证 Android Studio 已为新服务添加了相应的项目，如下：\n\n```xml\n<service\n    android:name=\"\
  .MyService\"\n    android:enabled=\"true\"\n    android:exported=\"true\" >\n```\n\
  \n## 58.9 启动服务\n\n编辑 `MainActivity.java` 文件并修改 `buttonClick()` 方法以启动 `MyService`\
  \ 服务：\n\n```java\npublic void buttonClick(View view) {\n    Intent intent = new\
  \ Intent(this, MyService.class);\n    startService(intent);\n}\n```\n\n`buttonClick()`\
  \ 方法所做的只是为服务创建一个 `intent` 对象并启动它。\n\n## 58.10 运行应用程序\n\n运行应用程序并在加载后触摸 `Start Service`\
  \ 按钮。在 Logcat 工具窗口（使用之前创建的 ServiceExample 过滤器）中，将显示 `buttonClick()` 方法已被调用以及 `onStartCommand()`\
  \ 方法中的循环正在执行。\n\n在最后一个循环消息之前，尝试再次触摸 Start Service 。注意按钮没有响应。大约 20 秒后，系统可能会显示一个包含“ServiceExample\
  \ isn’t responding”消息的警告对话框。这是因为应用程序的主线程当前正被执行循环任务的服务所阻塞。\n\n## 58.11 为服务添加线程\n\n\
  正如“Java 线程、处理器和执行器的基本概述”#Java_Threads.xhtml__idTextAnchor1108) 中所述，当 Android 应用程序首次启动时，运行时系统会创建一个线程，所有应用程序组件都将在其中运行。该线程通常被称为主线程。主线程的主要作用是处理用户界面，包括事件处理和与用户界面视图的交互。应用程序中启动的任何额外组件默认都会运行在主线程上。\n\
  \n\n\n\n如上一节所示，任何在主线程上执行耗时操作的组件都会导致应用程序在任务完成之前处于无响应状态。因此，Android 提供了一个允许应用程序创建并使用额外线程的\
  \ API，这并不意外。在主线程之外的线程中执行的任何任务上都是在后台执行。此类线程通常被称为后台线程或工作线程。\n\n修改 `MyService.java`\
  \ 文件中的 `onStartCommand()` 方法，如下所示在独立线程中执行任务：\n\n```java\n@Override\npublic int onStartCommand(Intent\
  \ intent, int flags, int startId) {\n    Log.i(TAG, \"Service onStartCommand \"\
  \ + startId);\n    Runnable runnable = () -> {\n        int i = 0;\n        while\
  \ (i <= 3) {\n            try {\n                Thread.sleep(10000);\n        \
  \        i++;\n            } catch (Exception e) {\n            }\n            Log.i(TAG,\
  \ \"Service running \" + startId);\n        }\n    };\n    Thread serviceThread\
  \ = new Thread(runnable);\n    serviceThread.start();\n    return Service.START_STICKY;\n\
  }\n```\n\n现在运行应用程序时，应该多次点击“启动服务”（Start Service）按钮。这样做时，Logcat 输出应显示有多个任务同时运行：\n\n\
  I/ServiceExample: Service onStartCommand 1\nI/ServiceExample: Service onStartCommand\
  \ 2\nI/ServiceExample: Service onStartCommand 3\nI/ServiceExample: Service running\
  \ 1\nI/ServiceExample: Service running 2\nI/ServiceExample: Service running 3\n\n\
  由于服务现在在主线程之外处理请求，应用程序对用户和 Android 系统都保持响应状态。\n\n### 58.12 总结\n\n本章通过示例介绍了使用 `IntentService`\
  \ 和 `Service` 类实现 Android 启动服务的实现。该示例还演示了在服务内部使用异步任务，以避免使应用程序的主线程处于无响应状态。\n\n##\
  \ 59. Android 本地绑定服务 – 实例示例\n\n正如在前几章中详细概述的，绑定服务（bound services）与启动服务不同，它们提供了一种实现\
  \ Android 服务与一个或多个客户端组件之间通信的机制。本章的目标是在[“Android 服务概览”(#Started_Service.xhtml__idTextAnchor1127)]中提供的绑定服务概述的基础上，开始对本地绑定服务的实际实例实现。\n\
  \n### 59.1 理解绑定服务\n\n与启动服务一样，提供绑定服务是为了允许应用程序在后台执行任务。然而，与启动服务不同，多个客户端组件可以绑定到一个绑定服务上，并且一旦绑定，就可以可以使用不同的机制与该服务进行交互。\n\
  \n绑定服务作为 `Service` 类的子类创建，并且至少必须实现 `onBind()` 方法。客户端组件通过调用 `bindService()` 方法绑定到服务。对绑定服务的第一个绑定请求将导致调用该服务的\
  \ `onBind()` 方法（后续的绑定请求不会触发 `onBind()` 调用）。想要绑定到服务的客户端还必须实现一个 `ServiceConnection`\
  \ 子类，该子类包含 `onServiceConnected()` 和 `onServiceDisconnected()` 方法，这两个方法分别会在客户端-服务器连接建立或断开后被调用。在\
  \ `onServiceConnected()` 方法中，将将传递一个 `IBinder` 对象，该对象包含了客户端与服务进行交互所需的信息。\n\n### 59.2\
  \ 绑定服务的交互选项\n\n实现客户端组件与绑定服务之间交互有两种推荐的机制。如果绑定服务是本地的，且与客户端组件属于同一个应用程序（换句话说，它在同一个进程中运行，对其他应用程序中的组件不可用），推荐的方法是创建一个\
  \ `Binder` 类的子类并扩展它以为服务提供接口。`onBind()` 方法将返回此 `Binder` 对象的实例，随后供客户端组件用于直接访问服务中持有的方法和数据。\n\
  \n在绑定服务不是本地应用程序的情况下（换句话说，它在与客户端组件不同的进程中运行），最佳交互方式是使用 `Messenger/Handler` 实现。\n\n\
  在本章的剩余部分，将创建一个示例，旨在演示创建、启动和与本地私有绑定服务交互的步骤。\n\n### 59.3 本地绑定服务示例\n\n在本章剩余部分创建的示例应用程序将由一个\
  \ Activity 和一个绑定服务组成。绑定服务的目的是从系统获取当前时间，并将该信息返回到显示它的 Activity。\n\n从欢迎屏幕选择“新项目”（New\
  \ Project），在新项目对话框中选择“空 Activity”（Empty Activity）。在 Name 字段中输入 `LocalBound` 并指定\
  \ `com.ebookrenzy.localbound` 为包名。在点击“完成”（Finish）按钮之前，将最低 API 级别更改为 `26: Android\
  \ 8.0 (Oreo)`并将语言更改为 Java。使用[11.8 将项目迁移到 View Binding(#View_Overview.xhtml__idText271)]中的步骤将项目迁移到\
  \ view binding。项目创建后，下一步是添加一个新类作为服务。\n\n### 59.4 向项目添加绑定服务\n\n要向项目添加新类，在 Project\
  \ 窗口中右键点击包名（`app -> java -> com -> ebookrenzy -> localbound`）并选择 New -> Service\
  \ -> Service。指定 `BoundService` 为类名，并在点击 Finish 创建类之前，确保选中了 Exported（导出）和 Enabled（启用）选项。Android\
  \ Studio 将 `BoundService.java` 文件加载到编辑器，内容如下：\n\n```java\npackage com.ebookrenzy.localbound;\n\
  \nimport android.app.Service;\n\nimport android.content.Intent;\n\nimport android.os.IBinder;\n\
  \npublic class BoundService extends Service {\n    public BoundService() {\n   \
  \ }\n\n    @Override\n    public IBinder onBind(Intent intent) {\n        // TODO:\
  \ 返回指向服务的通信通道。\n        throw new UnsupportedException(\"Not yet implemented\");\n\
  \    }\n}\n```\n\n### 59.5 实现 Binder\n\n如前所述，本地绑定服务通过向客户端传递配置适当的 `Binder` 对象来与绑定客户端通信。这通过在绑定服务类内部创建一个\
  \ `Binder` 子类并添加一个或多个供客户端调用的新方法来实现。在大多数情况下，这只需实现一个返回绑定服务实例的方法。有了此实例的引用，客户端就可以直接访问绑定服务内部的数据并调用方法。\n\
  \n因此，为了示例，需要对上一节创建的模板 `BoundService` 类进行修改。首先，需要声明一个 `Binder` 子类。该类将包含一个名为 `getService()`\
  \ 的方法，该方法将简单返回当前服务的实例引用（使用 `this` 关键字）。根据这些要求，编辑 `BoundService.java` 文件并修改如下：\n\n\
  ```java\npackage com.ebookrenzy.localbound;\n\nimport android.app.Service;\n\nimport\
  \ android.content.Intent;\n\nimport android.os.IBinder;\n\nimport android.os.Binder;\n\
  \npublic class BoundService extends Service {\n```\n\n\n\n\n\n```java\n    private\
  \ final IBinder myBinder = new MyLocalBinder();\n\n    public BoundService() {\n\
  \    }\n\n    @Override\n    public IBinder onBind(Intent intent) {\n        //\
  \ TODO: 向服务返回通信通道。\n        throw new UnsupportedOperationException(\"Not yet implemented\"\
  );\n    }\n\n    public class MyLocalBinder extends Binder {\n        BoundService\
  \ getService() {\n            return BoundService.this;\n        }\n    }\n}\n```\n\
  \n在对类进行更改后，值得花一点时间回顾一下这里所执行的步骤。首先，声明了 `Binder` 的一个新子类（命名为 `MyLocalBinder`）。该类包含一个方法，唯一目的是返回\
  \ `BoundService` 类当前实例的引用。创建了 `MyLocalBinder` 类的新实例并将其赋值给 `myBinder` `IBinder` 引用（由于\
  \ `Binder` 是 `IBinder` 的子类，因此此类赋值不存在类型不匹配）。\n\n接下来，需要修改 `onBind()` 方法以返回 `myBinder`\
  \ 对象的引用，并实现了一个新的公共方法，以便在任何绑定到服务的客户端调用时返回当前时间：\n\n```java\npackage com.ebookfrenzy.localbound;\n\
  \nimport java.text.SimpleDateFormat;\nimport java.util.Date;\nimport java.util.Locale;\n\
  import android.app.Service;\nimport android.content.Intent;\nimport android.os.IBinder;\n\
  import android.os.Binder;\n\npublic class BoundService extends Service {\n    private\
  \ final IBinder myBinder = new MyLocalBinder();\n\n    public BoundService() {\n\
  \    }\n\n    @Override\n    public IBinder onBind(Intent intent) {\n        return\
  \ myBinder;\n    }\n\n    public String getCurrentTime() {\n        SimpleDateFormat\
  \ dateformat =\n            new SimpleDateFormat(\"HH:mm:ss MM/dd/yyyy\",\n    \
  \                           Locale.US);\n        return (dateformat.format(new Date()));\n\
  \    }\n\n    public class MyLocalBinder extends Binder {\n        BoundService\
  \ getService() {\n            return BoundService.this;\n        }\n    }\n}\n```\n\
  \n此时，绑定服务已完成，并准备好添加到项目清单文件中。在 Project 工具窗口中找到 LocalBound 项目的 `AndroidManifest.xml`\
  \ 文件并双击它，一旦加载到 Manifest 编辑器，请验证 Android Studio 是否已按照如下所示为服务添加 `<service>` 条目：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.localbound.localbound\" >\n    <application\n  \
  \      android:allowBackup=\"true\"\n        android:icon=\"@mipmap/ic_launcher\"\
  \n        android:label=\"@string/app_name\"\n        android:theme=\"@style/AppTheme\"\
  \ >\n        <service\n            android:name=\".BoundService\"\n            android:enabled=\"\
  true\"\n            android:exported=\"true\" >\n        </service>\n        <activity\n\
  \            android:name=\".MainActivity\" >\n            <intent-filter>\n   \
  \             <action android:name=\"android.intent.action.MAIN\" />\n         \
  \       <category android:name=\"android.intent.category.LAUNCHER\" />\n       \
  \     </intent-filter>\n        </activity>\n    </application>\n</manifest>\n```\n\
  \n下一阶段是在 activity 中实现必要的代码，以绑定到服务并调用 `getCurrentTime()` 方法。\n\n### 5.6 将客户端绑定到服务\n\
  \n对于本教程而言，客户端是运行应用程序的 `MainActivity` 实例。如前所述，要成功绑定到服务并接收服务 `onBind()` 方法返回的 `IBinder`\
  \ 对象，有必要创建一个 `ServiceConnection` 子类并实现 `onServiceConnected()` 和 `onServiceDisconnected()`\
  \ 回调方法。编辑 `MainActivity.java` 文件并进行如下修改：\n\n```java\npackage com.ebookfrenzy.localbound;\n\
  import androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\nimport\
  \ android.os.IBinder;\nimport android.content.Context;\nimport android.content.Intent;\n\
  import android.content.ComponentName;\nimport android.content.ServiceConnection;\n\
  import com.ebookfrenzy.localbound.BoundService.MyLocalBinder;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    BoundService myService;\n    boolean isBound\
  \ = false;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \    }\n\n    final ServiceConnection myConnection = new ServiceConnection() {\n\
  \        @Override\n        public void onServiceConnected(ComponentName className,\
  \ IBinder service) {\n            MyLocalBinder binder = (MyLocalBinder) service;\n\
  \            myService = binder.getService();\n            isBound = true;\n   \
  \     }\n\n        @Override\n        public void onServiceDisconnected(ComponentName\
  \ name) {\n            isBound = false;\n        }\n    };\n}\n```\n\n当客户端成功绑定到服务时，将调用\
  \ `onServiceConnected()` 方法。该方法将服务的 `onBind()` 方法返回的 `IBinder` 对象作为参数传递。该参数被转换为\
  \ `MyLocalBinder` 类型的对象，然后调用 binder 对象的 `getService()` 方法以获取服务实例的引用，该引用随后赋值给 `myService`。使用一个布尔标志位来表示连接已建立。\n\
  \n当连接结束时，`onServiceDisconnected()` 方法会被调用，并将布尔标志设置为 `false`。\n\n建立连接后，下一步是修改 activity\
  \ 以绑定到服务。这涉及创建 `intent` 并调用 `bindService()` 方法，这些操作可以在 activity 的 `onCreate()` 方法中执行：\n\
  \n```java\n@Override\npublic void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_main);\n    Intent intent = new Intent(this,\
  \ BoundService.class);\n    bindService(intent, myConnection, Context.BIND_AUTO_CREATE);\n\
  }\n```\n\n### 5.7 完成示例\n\n最后只需实现调用 `getCurrentTime()` 方法并用户显示结果的机制。按照惯例，Android\
  \ Studio 已为 activity 创建了一个包含 `TextView` 的 `activity_main.xml` 文件。将此文件加载到布局编辑器，使用设计模式选择\
  \ `TextView` 组件并将 ID 更改为 `myTextView`。在 `TextView` 下方添加 `Button` 视图并将文本更改为“Show\
  \ Time”，将其提取为名为 `show_time` 的字符串资源。完成这些更改后，布局应类似于图 59-1 所示。如果缺少任何约束，点击布局编辑器中的推约束（Infer\
  \ Constraints）按钮。\n\n通过选择 `Button` 并配置 `onClick` 属性调用 `showTime` 方法来完成用户界面设计。\n\n\
  最后，编辑 `MainActivity.java` 文件中的代码来实现 `showTime()` 方法。该方法只需调用服务的 `getCurrentTime()`\
  \ 方法（得益于 `onServiceConnected()` 方法，现在可以通过 `myService` 引用从 activity 内部调用），并将结果字符串赋值给\
  \ `TextView`：\n\n\n\n\n\n```java\nTextView myTextView = findViewById(R.id.myTextView);\n\
  myTextView.setText(currentTime);\n```\n\n## 59.8 测试应用程序\n\n代码更改完成后，对应用程序进行测试运行。一旦界面可见，点击按钮并注意文本视图将更改为显示当前日期和时间。该示例已成功启动并绑定到一个服务，然后调用了该服务的方法来执行任务并将结果返回给活动（activity）。\n\
  \n## 59.9 总结\n\n当绑定的服务是本地的且对应用程序私有时，该应用程序内的组件可以与服务进行交互，而无需诉诸进程间通信（IPC）。通而言之，服务的\
  \ `onBind()` 方法返回一个 `IBinder` 对象，该对象包含指向运行中服务实例的引用。客户端组件实现 `ServiceConnection` 子类，其中包含在服务连接和断开连接时调用的回调方法。前一个方法将接收由\
  \ `onBind()` 方法返回的 `IBinder` 对象，允许调用服务中的公共方法。\n\n在涵盖了本地绑定服务的实现后，下一章将重点关注使用 IPC 与远程绑定服务进行交互。\n\
  \n## 60 Android 远程绑定服务 – 实例示例\n\n在本章（关于 Android 服务的最后一章）中，将开发一个示例应用程序，演示使用 `messenger`\
  \ 和 `handler` 配置来促进客户端与远程绑定服务之间的交互。\n\n### 60.1 客户端到远程服务的通信\n\n正如上一章所述，客户端与本地服务之间的交互可以通过向客户端返回一个包含指向服务对象引用的\
  \ `IBinder` 对象来实现。然而，对于远程服务，这种方法是不可通的，因为远程服务运行在不同的进程中，因此无法从客户端直接访问。\n\n对于远程服务，必须创建一个\
  \ `Messenger` 和 `Handler` 配置，允许消息在客户端和服务之间的进程边界上进行传递。\n\n具体而言，服务会创建一个 `Handler`\
  \ 实例，该实例会在接收到来自客户端的消息时被调用。在初始化方面，由 `Handler` 任务是创建一个 `Messenger` 对象，该对象反过来创建一个 `IBinder`\
  \ 对象，并在 `onBind()` 方法中返回给客户端。客户端使用此 `IBinder` 对象创建 `Messenger` 对象的实例，随后将消息发送给服务处理器（handler）。每当客户端发送一条消息时，处理器的\
  \ `handleMessage()` 方法就会被调用，并传递消息对象。\n\n本章创建的示例将包含一个在单独进程中运行的活动和一个绑定服务。`Messenger/Handler`\
  \ 机制将用于向服务发送一个字符串，服务随后将在 `Toast` 消息中显示该字符串。\n\n### 60.2 创建示例应用程序\n\n从欢迎界面选择 `New\
  \ Project` ，在生成新项目对话框中，点击 `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段输入 `RemoteBound`\
  \ 并指定 `com.ebookfrenzy.remotebound` 为包名。在点击 `Finish` 按钮之前，将 Minimum API 级别设置为 `API\
  \ 26`：Android 8.0 (Oreo)，并将语言菜单设置为 `Java`。\n\n### 60.3 设计用户界面\n\n在 Project 工具窗口中找到\
  \ `activity_main.xml` 文件，并双击它将其加载到 Layout Editor 工具中。在 Layout Editor 工具的 Design\
  \ 模式下，右键点击默认的 `TextView` 实例，选择 `Convert view...` 菜单，从生成的对话框中选择 `Button` 并点击 `Apply`。将按钮的文本属性更改为“Send\
  \ Message”，并将该字符串提取到名为 `send_message` 的新资源。\n\n最后，配置 `onClick` 属性以调用名为 `sendMessage`\
  \ 的方法。\n\n### 60.4 实现远程绑定服务\n\n为了实现此示例的远程绑定服务，在 Project 工具窗口中右键点击包名（位于 `app -> java`\
  \ 下），向项目添加新类，并选择 `New -> Service -> Service` 菜单。指定 `RemoteService` 为类名，并在点击 `Finish`\
  \ 创建类之前，确保 `Exported` 和 `Enabled` 选项均已选中。\n\n下一步为新服务实现处理器类。这通过扩展 `Handler` 类并实现\
  \ `handleMessage()` 方法来实现。该方法会在收到来自客户端的消息时被调用。它将接收一个 `Message` 对象作为参数，包含客户端需要传递给服务的任何数据。在本例中，这将是一个包含要显示给用户的字符串的\
  \ `Bundle` 对象。实现此后，`RemoteService.java` 文件中修改后的类应如下：\n\n```java\npackage com.ebookfrenzy.remotebound;\n\
  \nimport android.app.Service;\nimport android.content.Intent;\nimport android.os.IBinder;\n\
  import android.os.Bundle;\nimport android.os.Handler;\nimport android.os.Message;\n\
  import android.widget.Toast;\nimport android.os.Messenger;\n\npublic class RemoteService\
  \ extends Service {\n\n    public RemoteService() {\n\n    }\n\n    class IncomingHandler\
  \ extends Handler {\n\n        @Override\n        public void handleMessage(Message\
  \ msg) {\n            Bundle data = msg.getData();\n            String dataString\
  \ = data.getString(\"MyString\");\n            Toast.makeText(getApplicationContext(),\
  \ dataString, Toast_SHORT).show();\n        }\n    }\n\n    @Override\n    public\
  \ IBinder onBind(Intent intent) {\n        // TODO: Return the communication\n \
  \       throw new UnsupportedOperationException();\n    }\n}\n```\n\n实现处理器后，服务代码中的唯一任务是修改\
  \ `onBind()` 方法，使其返回一个包含 `Messenger` 的 `IBinder` 对象，而 `Messenger` 反又包含一个指向处理器的引用：\n\
  \n```java\nfinal Messenger myMessenger = new Messenger(new Handler());\n\n@Override\n\
  public IBinder onBind(Intent intent) {\n    return myMessenger.getBinder();\n}\n\
  ```\n\n上述代码的第一行创建了处理器的新实例，并将其传递给 `Messenger` 对象的构造函数。在 `onBind()` 方法中，调用 messenger\
  \ 的 `getBinder()` 方法以返回 `IBinder` 对象。\n\n### 60.5 在 Manifest 中配置远程服务\n\n为了准确描述客户端与远程服务之间的通信，有必要将服务配置为在与应用程序部分的单独进程中运行。这通过在清单文件中服务的\
  \ `<service>` 标签内添加 `android:process` 属性来实现。为了启动远程服务，还需要为服务提供意图过滤器（intent filter）。要实现此更改，请修改\
  \ `AndroidManifest.xml` 文件以添加所需的条目：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.remotebound\">\n\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:supportsRtl=\"true\"\n        android:theme=\"@style/AppTheme\"\
  >\n\n        <service\n            android:name=\".RemoteService\"\n           \
  \ android:enabled=\"true\"\n            android:exported=\"true\"\n            android:process=\"\
  :my_process\">\n        </service>\n\n        <activity\n            android:name=\"\
  .MainActivity\">\n            <intent-filter>\n                <action android:name=\"\
  android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n\n\n\n\n</application>\n</manifest>\n\n# 60.6 启动并绑定到远程服务\n\n与本地绑定服务一样，客户端组件需要实现\
  \ `ServiceConnection` 类的实例，并包含 `onServiceConnected()` 和 `onServiceDisconnected()`\
  \ 方法。同样，与本地服务相同，`onServiceConnected()` 方法将接收由远程服务的 `onBind()` 方法返回的 `IBinder` 对象，该对象将用于向服务器处理器发送消息。在本例中，客户端是\
  \ `MainActivity`，其代码位于 `MainActivity.java` 中。加载此文件并进行修改，以添加 `ServiceConnection`\
  \ 类以及一个用于存储接收到的 `Messenger` 对象引用的变量，以及一个用于指示连接是否建立的 `Boolean` 标志位：\n\n```java\n\
  package com.ebookfrenzy.remotebound;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.os.IBinder;\nimport android.os.Message;\n\
  import android.os.Messenger;\nimport android.os.RemoteException;\nimport android.content.ComponentName;\n\
  import android.content.Context;\nimport android.content.Intent;\nimport android.content.ServiceConnection;\n\
  import android.view.View;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    Messenger myService = null;\n    boolean isBound;\n\n    @Override\n  \
  \  protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_main);\n    }\n\n    final private ServiceConnection\
  \ myConnection =\n            new ServiceConnection() {\n                public\
  \ void onServiceConnected(\n                            ComponentName className,\n\
  \                            IBinder service) {\n                    myService =\
  \ new Messenger(service);\n                    isBound = true;\n               \
  \ }\n                public void onServiceDisconnected(\n                      \
  \      ComponentName className) {\n                    myService = null;\n     \
  \               isBound = false;\n                }\n            };\n}\n```\n\n\
  接下来，需要添加一些代码来绑定到远程服务。这涉及到创建一个 `intent`，以匹配清单文件中声明的服务的意图过滤器（intent filter），然后调用 `bindService()`\
  \ 方法，并将 `intent` 和 `ServiceConnection` 实例引用作为参数传递。为了本例的目的，此代码将在 Activity 的 `onCreate()`\
  \ 方法中实现：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_remote_bound);\n\
  \    Intent intent = new Intent(getApplicationContext(),\n                     \
  \          RemoteService.class);\n    bindService(intent, myConnection, Context.BIND_AUTO_CREATE);\n\
  }\n```\n\n# 60.7 向远程服务发送消息\n\n在测试应用程序之前，最后剩下的工作是在 `MainActivity` 类中实现 `sendMessage()`\
  \ 方法，该方法被配置为在用户触摸用户界面上的按钮时调用。此方法需要检查服务是否已连接，创建一个包含服务器要显示的字符串的 `bundle` 对象，将其添加到\
  \ `Message` 对象中并发送到服务器：\n\n```java\npublic void sendMessage(View view) {\n    if\
  \ (!isBound) return;\n    Message msg = Message.obtain();\n    Bundle bundle = new\
  \ Bundle();\n    bundle.putString(\"MyString\", \"Message Received\");\n    msg.setData(bundle);\n\
  \    try {\n        myService.send(msg);\n    } catch (RemoteException e) {\n  \
  \      e.printStackTrace();\n    }\n}\n```\n\n代码更改完成后，编译并运行应用程序。一旦加载，触摸用户界面上的按钮，此时应该出现一个显示“Message\
  \ Received”的 Toast 消息。\n\n## 60.8 总结\n\n为了实现客户端与远程绑定服务之间的交互，有必要实现处理器/消息框架。该技术背的基本概念在本章中已经涵盖，并实现了一个示例应用程序，该程序旨在演示客户端与绑定服务之间的通信，它们分别运行在独立的进程中。\n\
  \n# 61. 通知教程\n\n通知提供了一种让应用程序在运行或当前处于后台时向用户传达消息的方式。例如，消息应用可能会发布通知让用户知道新消息已到达。通知可以分为本地通知和远程通知。本地通知是由运行的设备上的应用程序本身触发的。相反，远程通知由远程服务器启动并递送到设备上展示给用户。\n\
  \n通知显示在从屏幕状态栏向拉出的通知栏中，每条通知都可以包含某些操作，例如打开发送通知的应用程序的按钮。Android 还支持直接回复（Direct Reply）通知，此功能允许用户在通知面板中直接输入并提交对通知的回复。\n\
  \n本章的目标是概述并演示在 Android 应用程序中实现本地通知。下一章（“Android 直接回复教程”）将涵盖直接回复通知的实现。\n\n## 61.1\
  \ 通知概述\n\n当在 Android 设备上启动通知时，它会以图标的形式出现在状态栏中。例如，图 61-1 了一个了一个包含多个通知图标的状态栏：\n\n\
  ![](img/Image24253.jpg)\n图 61-1\n\n要查看通知，用户从状态栏开始做一个向下滑动的动作，以拉下通知栏，如图 61-2 所示：\n\
  \n![](img/as_4.1_android_11_notifications.jpg)\n图 61-2\n\n在运行 Android 8 或更高版本的设备上，长按应用程序图标将显示与应用关联的所有挂起通知，如图\
  \ 61-3 所示：\n\n![](img/Image2442.jpg)\n图 61-3\n\nAndroid 8 及更高版本还支持通知点，当有通知等待查看时，它出现在应用程序图标上。典型的通知只需简单显示消息，并在点击后启动发布该通知的应用程序。通知还可以包含操作按钮，点击后可以执行对应应用程序的特定任务。图\
  \ 61-4 示例显示了一个包含两个操作按钮的通知，允许用户删除或保存收到的消息。\n\n![](img/Image2450.jpg)\n图 61-4\n\n\
  用户还可以在通知中输入内联文本回复并发送给应用程序，如下图 61-5 所示。这允许用户无需将相应的应用程序切换到前台即可回复通知。\n\n![](img/Image2458.jpg)\n\
  图 61-5\n\n本章的剩余部分将介绍创建和发布带有操作简单通知的步骤。直接回复支持的主题将在下一章介绍。\n\n## 61.2 创建 NotifyDemo\
  \ 项目\n\n在欢迎界面上选择 New Project（新建项目）选项，并在出的的新项目对话框中选择 Empty Activity 模板，然后点击 Next（下一步）按钮。\n\
  \n\n\n\n\n在 Name 字段中输入 `NotifyDemo`，并将 `com.ebookfrenzy.notifydemo` 指定为包名。在点击 Finish\
  \ 按钮之前，将 Minimum API level 设置更改为 `API 26: Android 8.0 (Oreo)`，并将 Language 菜单更改为\
  \ `Java`。\n\n## 61.3 设计用户界面\n\n主 Activity 将包含一个按钮，其目的是创建并发出意图（intent）。在 Layout Editor\
  \ 工具中找到并加载 `activity_main.xml` 文件，并删除默认的 `TextView` 部件。\n\n在启用 Autoconnect（自动连接）的情况下，从面板中将\
  \ `Button` 对象拖放到到布局画布的中心，如图图 61-6 所示。\n\n在布局中选中 `Button` 部件后，使用 Attributes 面板配置\
  \ `onClick` 属性以调用名为 `sendNotification` 的方法。\n\n![](img/as_4.1_notify_demo_ui.jpg)\n\
  图 61-6\n\n选择 `Button` 部件，在 Attributes 工具窗口中将 text 属性更改为“Notify”，并将该属性值提取为字符串资源。\n\
  \n## 61.4 创建第二个 Activity\n\n为了本示例，应用将包含第二个 Activity，该 Activity 将由用户从通知内部启动。通过右键点击\
  \ `app -> java` 下的 `com.ebookfrenzy.notifydemo` 包名向项目添加此新 Activity，选择 `New -> Activity\
  \ -> Empty Activity` 菜单选项显示 New Android Activity 对话框。\n\n在 Activity Name 字段中输入 `ResultActivity`，并将布局文件命名为\
  \ `activity_result`。由于此 Activity 在应用程序启动时不会启动（而是通过通知内部的意图启动），因此在点击 Finish 按钮之前确保禁用\
  \ Launcher Activity 选项非常重要。使用 11.8 将项目迁移到 View Binding 节中的步骤为 `build.gradle` 和 `ResultActivity.java`\
  \ 文件添加 view binding 支持（注意绑定名称将是 `ActivityResultBinding` 而不是 `ActivityMainBinding`）。\n\
  \n打开第二个 Activity 的布局（`app -> res -> layout -> activity_result.xml`），并拖放一个 `TextView`\
  \ 部件使其位于布局中心。编辑 `TextView` 的文本，使其显示为“Result Activity”，并将该属性值提取为字符串资源。\n\n## 61.5\
  \ 创建通知通道\n\n在应用能够发送通知之前，它必须先创建一个通知通道。通知通道由三部分组成：一个在应用内唯一标识通道的 ID、一个通道名称和一个通道描述（只有后两个会被用户可见）。通道是通过配置\
  \ `NotificationChannel` 实例，然后将该对象传递给 `NotificationManager` 类的 `createNotificationChannel()`\
  \ 方法来创建的。对于此示例，应用将包含一个名为“NotifyDemo News”的单一通知通道。编辑 `MainActivity.java` 文件并实现在应用启动时创建通道的代码：\n\
  \n```java\nimport android.app.NotificationManager;\nimport android.app.NotificationChannel;\n\
  import android.content.Context;\nimport android.graphics.Color;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    NotificationManager notificationManager;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        notificationManager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);\n\
  \        createNotificationChannel(\n            \"com.ebookfrenzy.notifydemo.news\"\
  ,\n            \"NotifyDemo News\",\n            \"Example News Channel\"\n    \
  \    );\n    }\n\n    protected void createNotificationChannel(String id, String\
  \ name, String description) {\n        int importance = NotificationManager.IMPORTANCE_LOW;\n\
  \        NotificationChannel channel = new NotificationChannel(id, name, importance);\n\
  \        channel.setDescription(description);\n        channel.enableLights(true);\n\
  \        channel.setLightColor(Color.RED);\n        channel.enableVibration(true);\n\
  \        channel.setVibration(new long[]{100, 200, 300, 400, 500, 400, 300, 400});\n\
  \        notificationManager.createNotificationChannel(channel);\n    }\n}\n```\n\
  \n该代码声明并初始化了一个 `NotificationManager` 实例，然后使用名称和描述属性以低优先级级别（其他为高、最小和无）创建新通道。通道还还添加了一些可选设置，以自定义用户接收通知到达的方式。最后，通过将通知通道传递给通知管理器的\
  \ `createNotificationChannel()` 方法来创建通道。\n\n代码完成后，在运行 Android 10 或更高版本的设备或模拟器上编译并运行应用。应用启动后，将其置于后台并打开\
  \ 设置 应用。在设置 应用中，选择 Apps & notifications 选项，然后 App info。在 App info 屏幕上找到并选择 Demo\
  \ 项目，在后续屏幕上点击 Notifications。通知屏幕应显示 Demo News 类别对用户处于激活状态：\n\n![](img/as_3.5_notifications_enabled.jpg)\n\
  图 6-7\n\n在继续之前，检查 Advanced settings（高级设置）以确保为应用启用了通知点（notification dots）和气泡（bubbles）。虽然这不是本示例的节点，但值得注意的是，可以通过调用通知管理器的\
  \ `deleteNotificationChannel()` 方法从应用内部删除通道，传递要删除的通道 ID：\n```java\nString channelID\
  \ = \"com.ebookfrenzy.notifydemo.news\";\nnotificationManager.deleteNotificationChannel(channelID);\n\
  ```\n\n## 6.6 创建并发布通知\n\n通知使用 `Notification.Builder` 类创建，并且包含图标、标题和内容。打开 `MainActivity.java`\
  \ 文件并按如下方式实现 `sendNotification()` 方法以构建基础通知：\n\n```java\nimport android.app.Notification;\n\
  import android.view.View;\n\npublic void sendNotification(View view) {\n    String\
  \ channelID = \"com.ebookfrenzy.notifydemo.news\";\n    Notification notification\
  \ = new Notification.Builder(MainActivity.this, channelID)\n        .setContentTitle(\"\
  Example Notification\")\n        .setContentText(\"This is an example notification.\"\
  )\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n        .setChannelId(channelID)\n\
  \        .build();\n}\n```\n\n一旦构建了通知，就需要使用 `NotificationManager` 实例的 `notify()`\
  \ 方法将其发布。访问 `NotificationManager` 并发布通知的代码需要如下所示添加到 `sendNotification()` 方法中：\n\n\
  ```java\nprotected void sendNotification(View view) {\n    int notificationID =\
  \ 101;\n    String channelID = \"com.ebookfrenzy.notifydemo.news\";\n    Notification\
  \ notification = new Notification.Builder(MainActivity.this, channelID)\n      \
  \  .setContentTitle(\"New Message\")\n        .setContentText(\"You've received\
  \ new messages.\")\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n \
  \       .setChannelId(channelID)\n        .build();\n    notificationManager.notify(notificationID,\
  \ notification);\n}\n```\n\n注意，当发布通知时，它会被分配一个通知 ID。该 ID 可以任意整数，并稍后用于更新通知。\n\n\n\n\
  \n\n编译并运行应用，点击主活动上的按钮。当通知图标出现在状态栏中时，从状态栏向下拖动以查看完整通知：\n\n![](img/Image2481.jpg)\n\
  图 61-8\n\n点击并向右滑动通知，然后选择设置齿轮图标以查看有关通知的更多信息：\n\n![](img/as_3.5_notification_settings.jpg)\n\
  \n图 61-9\n\n接下来，将应用置于后台，导航到显示所有应用启动器图标的主屏幕，并注意到 `NotifyDemo` 启动器图标上出现了一个通知点，如图 61-10\
  \ 中的箭头所示：\n\n![](img/Image24991.jpg)\n\n图 61-10\n\n如果没有出现圆点，请在 `Settings`（设置）应用中检查\
  \ `NotifyDemo` 的通知选项，以确认已按照本章前面的所述启用了通知点。如果圆点仍然未出现，请长按设备主屏幕的空白区域，从弹出的菜单中选择 `Home\
  \ Settings`（主屏幕设置）选项，并启用 `Notification dots`（通知点）选项。\n\n长按启动器图标将显示包含通知的弹出窗口：\n\n\
  ![](img/as_3.5_notifydemo_long_press_popup.jpg)\n\n图 61-11\n\n如果一个应用有多个待处理通知，长按菜单弹出窗将包含通知数量（如上图高亮显示）。此数字可以在构建通知时通过调用\
  \ `setNumber()` 方法在应用内部进行配置：\n\n```java\nNotification notification = new Notification.Builder(MainActivity.this,\
  \ CHANNEL_ID)\n        .setContentTitle(\"Example Notification\")\n        .setContentText(\"\
  This is an example notification.\")\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \        .setChannelId(CHANNEL_ID)\n        .setNumber(10)\n        .build();\n\
  ```\n\n按照目前的实现方式，无论从何处访问，点击通知都不会产生效果。下一步是配置通知以便在点击时启动一个活动。\n\n## 61.7 从通知启动活动\n\n\
  理想情况下，通知应该允许用户执行某些形式的操作，例如启动相应的应用，或响应通知采取其他形式的操作。一个常见的需求是当用户点击通知时，简单启动属于该应用的活动。\n\
  \n这种方法需要启动一个活动并配置一个 `Intent` 来启动该活动。假设一个应用包含一个名为 `ResultActivity` 的活动，该意图创建如下：\n\
  \n```java\nIntent resultIntent = new Intent(this, ResultActivity.class);\n```\n\n\
  然后需要将此 `intent` 封装在 `PendingIntent` 实例中。`PendingIntent` 对象的设计允许将 `intent` 传递其他应用程序，实质上授予这些应用程序在未来某个时刻执行该\
  \ `intent` 的权限。在这种情况下，`PendingIntent` 对象被用于为通知系统提供在用户点击通知面板时启动 `ResultActivity`\
  \ 活动的方法：\n\n```java\nPendingIntent pendingIntent =\n    PendingIntent.getActivity(\n\
  \        this,\n        0,\n        resultIntent,\n        PendingIntent.FLAG_UPDATE_CURRENT\n\
  \    );\n```\n\n剩下的工作是在构建通知过程中使用 `setContentIntent()` 方法分配 `PendingIntent` 对象。\n\
  \n将这些更改整合在一起得到了修改后的 `sendNotification()` 方法，其内容如下：\n\n```java\n.\nimport android.app.PendingIntent;\n\
  import android.content.Intent;\nimport android.graphics.drawable.Icon;\n.\nprotected\
  \ void sendNotification(View view) {\n    int notificationId = 101;\n    Intent\
  \ resultIntent = new Intent(this, ResultActivity.class);\n    PendingIntent pendingIntent\
  \ =\n            .Intent.getActivity(\n                this,\n                0,\n\
  \                resultIntent,\n                PendingIntent.FLAG_UPDATE_\n   \
  \         );\n    String CHANNEL_ID = \"com..ren..\";\n    Notification notification\
  \ = = new.Builder(MainActivity.this,,_ID)\n            .setContentTitle(\"Example\
  \ Notification\")\n            .setContentText(\"This is an example notification.\"\
  )\n            .setSmallIcon(android.R.drawable.ic_dialog_info)\n            .setChannelId(channelID)\n\
  \            .setContentIntent(pendingIntent)\n            .build();\n    notificationManager.notify(notification);\n\
  }\n```\n\n```编译再次再次应用，点击应用并显示通知栏。然而，这次点击通知将启动 `ResultActivity`。\n\n## 61.8 为通知添加操作\n\
  \n为通知添加交互性的另一种方法是创建操作。这些操作以通知下方的按钮形式出现，并在用户点击时触发意图。以下代码如果添加到 `sendNotification()`\
  \ 方法中，将添加一个标记为“打开”的操作：\n\n```java\nfinal Icon icon = Icon.createWithResource(MainActivity.this,\
  \ android.R.drawable.ic_dialog_info);\nNotification.Action action =\n    new Notification.Action.Builder(icon,\
  \ \"Open\", pendingIntent)\n    .build();\nNotification notification = new Notification.Builder(MainActivity.this,\
  \ CHANNEL_ID)\n        .setContentTitle(\"Example Notification\")\n        .setContentText(\"\
  This is an example notification.\")\n        .setSmallIcon(R.drawable.ic_24dp)\n\
  \        .setChannelId(channelID)\n        .setContentIntent(pendingIntent)\n  \
  \      .setActions(action)\n        .build();\nnotificationManager.notify(notification);\n\
  ```\n\n将上述代码添加到方法并运行应用。发布通知并注意通知内的打开操作（取决于 Android 版本，可能需要下拉通知面板）：\n\n![](img/as_3.5_notification_with_action.jpg)\n\
  图 61-12\n\n点击操作将触发 `pending intend` 并启动 `ResultActivity`。\n\n## 61.9 汇总通知\n\n如果一个应用于经常发布通知，可能会出现这些通知迅速占用状态栏和通知栏的情况，为用户提供欠佳的体验。这对于新闻或消息应用尤为如此，每当有突发新闻或来自联系人的新消息时就会发送通知。考虑一下图\
  \ 61-13 中的通知：\n\n![](img/as_3.2_unbundled_notifications.jpg)\n图 61-13\n\n现在想象如果有十甚至二十条新消息。为了避免这类问题，Android\
  \ 允许将通知合并。\n\n要合并通知，必须通过 `setGroup()` 方法指定每个通知属于同一个组，并发布且配置额外的通知作为摘要通知。例如，以下代码创建并发布了上方图\
  \ 61-13](#Notifications.xhtml__idTextAnchor193)所示的三个通知，但将它们合并到同一个组。代码还发布了一个作为摘要的通知：\n\
  \n```java\nfinal String GROUP_KEY_NOTIFY = \"group_key_notify\";\nNotification.Builder\
  \ builderSummary =\n    new Notification.Builder(this, channelID)\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \        .setContentTitle(\"A Bundle Example\")\n        .setContentText(\"You have\
  \ 3 new messages\")\n        .setGroup(GROUP_KEY_NOTIFY)\n        .setGroupSummary(true);\n\
  Notification.Builder builder1 =\n    new Notification.Builder(this, channelID)\n\
  \        .setSmallIcon(android.R.drawable.ic_dialog_info);\n```\n\n\n\n\n\n```java\n\
  .setContentTitle(\"New Message\")\n    .setContentText(\"You have a new message\
  \ from Kassidy\")\n    .setGroup(GROUP_KEY_NOTIFY);\n\nNotification.Builder builder2\
  \ =\n    new Notification.Builder(this, channelID)\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \        .setContentTitle(\"New Message\")\n        .setContentText(\"You have a\
  \ new message from Caitlyn\")\n        .setGroup(GROUP_KEY_NOTIFY);\n\nNotification.Builder\
  \ builder3 =\n    new Notification.Builder(this, channelID)\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \        .setContentTitle(\"New Message\")\n        .setContentText(\"You have a\
  \ new message from Jason\")\n        .setGroup(GROUP_KEY_NOTIFY);\n\nint notificationId0\
  \ = 100;\nint notificationId1 = 101;\nint notificationId2 = 102;\nint notificationId3\
  \ = 103;\n\nnotificationManager.notify(notificationId1, builder1.build());\nnotificationManager.notify(notificationId2,\
  \ builder2.build());\nnotificationManager.notify(notificationId3, builder3.build());\n\
  notificationManager.notify(notificationId0, builderSummary.build());\n```\n\n当代码执行时，尽管应用实际上发布了四条通知，状态栏中只会出现一个通知图标。在通知栏中，会显示一条摘要汇总通知，列出每个组包通知中的信息：\n\
  \n![](img/Image2528.jpg)\n图 61-14\n\n进一步向下拖动通知条目可以展开面板，显示每个组包通知的详细信息：\n\n![](img/Image2536.jpg)\n\
  图 61-15\n\n## 61.10 总结\n\n通知为应用程序提供了一种在未运行或处于后台时向用户传递消息的方法。通知显示在状态栏和通知栏中。本地通知由运行的应用在设备上触发，而远程通知由远程服务器启动并递送到设备。本地通知使用\
  \ `NotificationCompat.Builder` 类创建，并使用 `NotificationManager` 服务发布。\n\n正如本章所示，可以通过利用动作（actions）、意图（intents）和\
  \ `PendingIntent` 类来配置通知，为用户提供选项（如启动活动或保存消息）。通知组包（Notification bundling）提供了一种合并通知的机制，为发布大量的应用提供了更好的体验。\n\
  \n### 62. Android 直接回复通知教程\n\n直接回复（Direct reply）是 Android 7 中引入的一个功能，允许用户在通知中输入文本并发送到与该通知关联的应用。这允许用户直接在通知中回复消息，而无需在应用内启动活动。本章将基于上一章学到的知识，创建一个使用此通知特性的示例应用。\n\
  \n#### 62.1 创建 DirectReply 项目\n\n从欢迎界面选择“New Project”（新建项目）选项，在弹出的新项目对话框中，点击“Next”（下一步）之前选择\
  \ Empty Activity 模板。\n\n在“Name”字段中输入 `DirectReply`，并指定 `com.ebookfrenzy.directreply`\
  \ 为包名。在点击“Finish”（完成）按钮之前，将“Minimum API level”（最低 API 级别）设置改为 `API 31: Android 12`，并将“Language”（语言）菜单设置为\
  \ `Java`。按照章节 11.8 迁移项目到 View Binding 中概述步骤修改项目以支持 view binding。\n\n### 62.2 设计用户界面\n\
  \n将 `activity_main.xml` 布局文件加载到布局工具中。在启用 Autoconnect（自动连接）的情况下，在现有“Hello World!”标签下方添加一个\
  \ `Button` 对象，如图 62-1\n图 62-1\n\n#### 62.3 创建通知通道\n\n与上一章的示例一样，在发送通知之前必须创建一个通道。编辑\
  \ `MainActivity.java` 文件并添加代码来创建一个新通道，如下所示：\n\n```java\nimport android.app.NotificationChannel;\n\
  import android.app.NotificationManager;\nimport android.content.Context;\nimport\
  \ android.graphics.Color;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private ActivityMainBinding binding;\n    private NotificationManager notificationManager;\n\
  \    private final String channelID = \"com.ebookfrenzy.directreply.news\";\n\n\
  \    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n     \
  \   notificationManager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);\n\
  \        createNotificationChannel(channelID, \"DirectReply News\", \"Example Channel\"\
  );\n    }\n\n    protected void createNotificationChannel(String id, String name,\
  \ String description) {\n        int importance = NotificationManager.IMPORTANCE_HIGH;\n\
  \        NotificationChannel channel = new NotificationChannel(id, name, importance);\n\
  \        channel.setDescription(description);\n        channel.enableLights(true);\n\
  \        channel.setLightColor(Color.RED);\n        channel.enableVibration(true);\n\
  \        channel.setVibrationPattern(new long[]{100, 200, 300, 400, 500, 400, 300,\
  \ 200, 400});\n        notificationManager.createChannel(channel);\n    }\n}\n```\n\
  \n### 62.4 构建 RemoteInput 对象\n\n使通知内直接回复成为的关键元素是 `RemoteInput` 类。之前的章节引入了 `PendingIntent`\
  \ 类，并解释了它如何允许应用程序创建一个意图，然后授予其他应用程序或服务从外部启动该意图的能力。在名为“Android Notifications”的章节中，创建了一个允许从通知内部启动原始应用的活动。`RemoteInput`\
  \ 类允许将输入请求包含在 `PendingIntent` 对象中。当 `PendingIntent` 对象中的意图被触发时（例如启动活动），该活动也会接收到用户提供的输入。\n\
  \n在通知中实现直接回复的第一步是创建 `RemoteInput` 对象。这通过使用 `RemoteInput.Builder()` 方法实现。构建 `RemoteInput`\
  \ 对象需要一个键字符串，用于从结果意图中提取输入。该对象还需要一个标签字符串，显示在通知的输入字段中。编辑 `MainActivity.java` 文件并开始实现\
  \ `sendNotification()` 方法。同时注意添加一些导入指令和变量，它们将在本章节后续内容中用到：\n\n```java\npackage com.ebookfrenzy.directreply;\n\
  \nimport android.view.View;\nimport android.app.PendingIntent;\nimport android.app.RemoteInput;\n\
  import android.content.Intent;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private ActivityMainBinding binding;\n    private static final int notificationId\
  \ = 101;\n    private static final String KEY_TEXT_REPLY = \"key_text_reply\";\n\
  \    private NotificationManager notificationManager;\n    private static final\
  \ String channelID = \"com.ebookfrenzy.directreply.news\";\n\n    public void sendNotification(View\
  \ view) {\n```\n\n\n\n\n\n```java\nString replyLabel = \"Enter your reply here\"\
  ;\n\nRemoteInput remoteInput =\n    new RemoteInput.Builder(KEY_TEXT_REPLY)\n  \
  \      .setLabel(replyLabel)\n        .build();\n}\n\n}\n```\n\n现在 `RemoteInput`\
  \ 对象已经创建并使用键和标签字符串进行了初始化，它需要被放置在通知操作对象中。然而，在执行该步骤之前，需要创建 `PendingIntent` 实例。\n\n\
  ## 62.5 创建 PendingIntent\n\n创建 `PendingIntent` 的步骤与“Android 通知教程”章节中概述的步骤相同，不同之处该意图将配置为启动\
  \ `MainActivity`。在 `MainActivity.java` 文件中，添加以下代码来创建 `PendingIntent`：\n\n```java\n\
  public void sendNotification(View view) {\n    String replyLabel = \"Enter your\
  \ reply here\";\n    RemoteInput remoteInput =\n            new RemoteInput.Builder(KEY_TEXT_REPLY)\n\
  \                .setLabel(replyLabel)\n            .build();\n    Intent resultIntent\
  \ = new Intent(this, MainActivity.class);\n    PendingIntent resultPendingIntent\
  \ =\n            PendingIntent.getActivity(\n                this,\n           \
  \     0,\n                resultIntent,\n                PendingIntent.FLAG_MUTABLE\n\
  \            );\n}\n```\n\n## 62.6 创建回复操作\n\n内联回复可以通过通知中的操作按钮在通知内访问。现在需要创建此操作，并使用图标、显示在按钮上的标签、`PendingIntent`\
  \ 对象和 `RemoteInput` 对象进行配置。修改 `sendNotification()` 方法以添加创建此操作的代码：\n\n```java\nimport\
  \ android.graphics.drawable.Icon;\nimport android.app.Notification;\nimport android.graphics.Color;\n\
  import androidx.core.content.ContextCompat;\n\npublic void sendNotification(View\
  \ view) {\n    String replyLabel = \"Enter your reply here\";\n    RemoteInput remoteInput\
  \ =\n            new RemoteInput.Builder(KEY_TEXT_REPLY)\n                .setLabel(replyLabel)\n\
  \            .build();\n    Intent resultIntent = new Intent(this, MainActivity.class);\n\
  \    PendingIntent resultPendingIntent =\n            PendingIntent.getActivity(\n\
  \                this,\n                0,\n                resultIntent,\n    \
  \            PendingIntent.FLAG_UPDATE_CURRENT\n            );\n    final Icon icon\
  \ =\n        Icon.createWithResource(MainActivity.this,\n        android.R.drawable.ic_dialog_info);\n\
  \    Notification.Action replyAction =\n            new Notification.Action.Builder(\n\
  \                icon,\n                \"Reply\", resultPendingIntent)\n      \
  \      .addRemoteInput(remoteInput)\n            .build();\n}\n```\n\n在教程的这一阶段，我们已经构建了并准备好使用的\
  \ `RemoteInput`、`PendingIntent` 和 `Notification` 对象。下一阶段是构建通知并发布它：\n\n```java\n\
  public void sendNotification(View view) {\n    String replyLabel = \"Enter your\
  \ reply here\";\n    RemoteInput remoteInput =\n        new RemoteInput.Builder(KEY_TEXT_REPLY)\n\
  \            .setLabel(replyLabel)\n        .build();\n    Intent resultIntent =\
  \ new Intent(this, MainActivity.class);\n    PendingIntent resultPendingIntent =\n\
  \        PendingIntent.getActivity(\n            this,\n            0,\n       \
  \     resultIntent,\n            PendingIntent.FLAG_UPDATE_CURRENT\n        );\n\
  \    final Icon icon =\n        Icon.createWithResource(MainActivity.this,\n   \
  \     android.R.drawable.ic_dialog_info);\n    Notification.Action replyAction =\n\
  \        new Notification.Action.Builder(\n            icon,\n            \"Reply\"\
  , resultPendingIntent)\n            .addRemoteInput(remoteInput)\n            .build();\n\
  \    Notification newMessageNotification =\n        new Notification.Builder(this,\
  \ channelID)\n            .setColor(ContextCompat.getColor(this,\n            R.color.design_default_color_primary))\n\
  \            .setSmallIcon(\n            android.R.drawable.ic_dialog_info)\n  \
  \          .setContentTitle(\"My Notification\")\n            .setContentText(\"\
  This is a test message\")\n            .addAction(replyAction).build();\n    NotificationManager\
  \ notificationManager =\n        (NotificationManager)\n        getSystemService(Context.NOTIFICATION_SERVICE);\n\
  \    notificationManager.notify(notificationId, newMessageNotification);\n}\n```\n\
  \n完成更改后，编译并运行应用，然后测试点击按钮是否成功发布了通知。当查看通知栏时，通知应该如图 62-2 所示：\n\n![](img/as_4.1_direct_reply_notification.jpg)\n\
  图 62-2\n\n点击“回复”（Reply）操作按钮，会出现文本输入字段，并显示创建 `RemoteInput` 对象时嵌入的回复标签。\n\n![](img/as_4.1_direct_reply_enter.jpg)\n\
  图 62-3\n\n输入一些文本并点击输入字段末尾的发送箭头。\n\n## 62.7 接收直接回复输入\n\n现在通知已成功向用户获取输入，应用需要对该输入进行处理。本教程的目标是让用户在通知中输入的文本出现在\
  \ Activity 界面上的 `TextView` 小部件上。\n\n当用户输入文本并点击发送按钮时，`MainActivity` 将通过 `PendingIntent`\
  \ 对象中包含的 `intent` 启动。该意图中包含了用户通过通知输入的文本。在 Activity 的 `onCreate()` 方法中，调用 `getIntent()`\
  \ 方法将返回启动 Activity 的意图。`MainActivity.java` 文件修改后的 `onCreate()` 方法如下：\n\n```java\n\
  @Override\nprotected void onCreate(Bundle savedInstanceState) {\n    createNotificationChannel(channelID,\
  \ \"DirectReply News\",\n    \"Example News Channel\");\n    handleIntent();\n}\n\
  \nprivate void handleIntent() {\n    Intent intent = this.getIntent();\n    Bundle\
  \ remoteInput = RemoteInput.getResultsFromIntent(intent);\n    if (remoteInput !=\
  \ null) {\n        String inputString = remoteInput.getCharSequence(\n         \
  \   KEY_TEXT_REPLY).toString();\n        binding.textView.setText(inputString);\n\
  \    }\n}\n```\n\n进行这些更改后，再次构建并运行应用。点击按钮发布通知，并在通知面板输入并发送文本。注意 `MainActivity` 中的\
  \ `TextView` 小部件已更新，显示输入的内联文本。\n\n## 62.8 更新通知\n\n在通知中发送回复后，你可能注意到如图 62-4 所示，指示器在通知面板中继续旋转：\n\
  \n![](img/Image24491.jpg)\n图 62-4\n\n通知显示此指示是因为正在等待 Activity 的响应以确认收到发送的文本。执行此任务的建议方法更新通知，使用新消息指示回复已接收并处理。由于原始通知在发布时已分配了\
  \ ID，因此可以再次使用它进行更新。向 `handleIntent()` 方法添加以下代码以执行此任务：\n\n```java\nprivate void handleIntent()\
  \ {\n    Intent intent = this.getIntent();\n```\n\n\n\n\n\n```java\nBundle remoteInput\
  \ = RemoteInput.getResultsFromIntent(intent);\n\nif (remoteInput != null) {\n  \
  \  String inputString = remoteInput.getCharSequence(KEY_TEXT_REPLY).toString();\n\
  \    binding.myTextView.setText(inputString);\n    Notification repliedNotification\
  \ =\n            new Notification.Builder(this, channelID)\n                .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \                .setContentText(\"Reply received\")\n                .build();\n\
  \    notificationManager.notify(notificationId, repliedNotification);\n}\n```\n\n\
  最后一次测试该应用程序，并验证在发送内联回复文本后，进度指示器是否消失，并且出现了一个新的面板表示回复已收到：\n\n![](img/Image2457.jpg)\n\
  \n图 62-5\n\n## 62.9 总结\n\n直接回复通知功能允许用户在通知内输入文本，并通过 `intent` 将其传递给相应应用程序的活动。直接回复是通过\
  \ `RemoteInput` 类实现的，该类的实例可以嵌入到操作（action）中并与通知打包在一起。在处理直接回复通知时，让 `NotificationManager`\
  \ 服务知道回复已接收并处理至关重要。实现这一点的最佳方法是使用首次发布通知时提供的 `notification ID` 直接更新通知消息。\n\n## 63.\
  \ 折叠设备与多窗口支持\n\n无论我们是否准备好，折叠设备都会到来（或者，对于第一代三星 Galaxy Fold 来说，可能在设备本身准备好之前就出现了）。为了准备这一类新设备，了解一些应该采取的额外步骤很重要，以确保你的应用程序在折叠设备上运行时运行正常。\n\
  \n幸运的是，支持折叠设备的大部分行为已经以多窗口支持的形式存在于 Android 中。\n\n## 63.1 折叠屏与多窗口支持\n\n当应用程序在折叠设备上运行时，它可能会与其他应用程序共享屏幕，并遇到重大的配置更改（例如，用户折叠或展开显示器时屏幕尺寸的变化）。如果你的应用程序已经设计为可以处理设备方向的变化，那么它很可能也能处理由折叠引起的变化，尽管建议进行彻底测试。\n\
  \n多窗口支持最初是在 Android 7 中引入的。与之前的 Android 版本不同，Android 7 中的多窗口支持允许在设备屏幕上同时显示多个活动。\n\
  \nAndroid 中的多窗口支持提供了三种不同的窗口支持形式。**分屏模式**适用于大多数手机、折叠设备和平板电脑，提供了一个分屏环境，其中两个活动并排或一个在上在上显示。它提供了一个可移动的分隔符，用户拖动它即可调整分配给每个相邻活的屏幕百分比：\n\
  \n![](img/Image24272.jpg)\n\n图 63-1\n\n**自由窗口模式**为具有较大屏幕的设备提供窗口化环境，并且目前由设备制造商决定是否启用。自由窗口模式与分屏模式的区别在于，它允许每个活动在独立的、可调整大小的窗口中出现，并且不限于同时显示两个活动。例如，图\
  \ 63-2 显示了一个处于自由窗口模式的设备，其中计算器和第二个应用程序显示在独立的窗口中：\n\n![](img/Image24362.jpg)\n\n图\
  \ 63-2\n\n**画中画支持**，如名所示，允许用户在执行其他任务时视频播放在较小的窗口中继续进行，该主题将从“Android 画中画模式”章节开始介绍。\n\
  \n## 63.2 使用折叠屏模拟器\n\n虽然在编写本文时市场上还没有可以进行应用程序测试的折叠设备，但 Android SDK 包含了折叠屏模拟器。要创建一个折叠模拟器，请选择\
  \ Android Studio Tools -> `AVD Manager` 菜单选项，点击 `Create Virtual Device` 按钮。\n\n\
  ## 63.3 进入多窗口模式\n\n可以通过显示概览（Overview）屏幕、长按工具栏中的应用图标并选择如图 63-5 所示的“分屏”选项进入分屏模式：\n\
  \n![](img/3.5_split_button.jpg)\n\n图 63-5\n\n一旦进入分屏模式，概览按钮将更改为显示两个矩形（在图 63-6 中标记为\
  \ A），当前活动将占据屏幕部分 (B)，而概览屏幕将出现在屏幕的相邻部分，允许选择第二个活动 (C)：\n\n![](img/3.5_select_app.jpg)\n\
  \n图 63-6\n\n一旦选择了第二个应用程序，屏幕将像之前图 63-1 所示被均匀划分。要退出分屏模式，只需将分离两个活动的分隔符拖到远端，使一个活动占据整个屏幕，或者长按概览按钮直到它恢复为单窗口。\n\
  \n### 63.4 启用并使用自由窗口支持\n\n虽然在所有设备上都没有获得官方支持，但在大型设备和模拟器上启用自由窗口多窗口模式。要启用此模式，在模拟器运行时或设备连接时运行以下\
  \ `adb` 命令：\n\n```\nadb shell settings put global enable_freeform_support 1\n```\n\
  \n在进行此更改后，可能需要重启设备以使设置生效。\n\n一旦启用，在概览屏幕中长按应用图标时会出现一个额外选项，如图 63-7 所示：\n\n![](img/3.5_freeform_button.jpg)\n\
  \n图 63-7\n\n## 63.5 检查自由窗口支持\n\n正如本章早期概述，Google 将是否启用自由窗口多窗口模式交给了各个 Android 设备制造商。由于只有在较大的设备上使用自由窗口才有意义，因此无法保证在可能运行程序的每个设备上都提供自由窗口。幸运的是，如果设备上不可用自由窗口，系统会忽略所有自由窗口特定的方法和属性，因此使用这些方法不会导致应用程序在非自由窗口设备上崩溃。然而，在某些情况下，可能需要检测设备是否支持自由窗口多窗口。幸运的是，可以通过检查包管理器中的自由窗口管理功能来实现。以下代码示例检查自由窗口多窗口支持，并根据测试结果返回\
  \ `Boolean` 值：\n\n```java\npublic Boolean checkFreeform() {\n    return getPackageManager().hasSystemFeature(\n\
  \        PackageManager.FEATURE_FREEFORM_WINDOW_MANAGEMENT);\n}\n```\n\n\n\n\n\n\
  `android:resizableActivity` 清单文件设置用于控制应用是否支持多窗口行为。此设置可以在应用程序级别或单个活动（activity）级别进行。例如，下面的片段配置了名为\
  \ `MainActivity` 的活动以同时支持分屏和自由形多窗口模式：\n\n```xml\n<activity\n    android:name=\"\
  .MainActivity\"\n    android:resizeableActivity=\"true\"\n    android:label=\"@string/app_name\"\
  \n    android:theme=\"@style/AppTheme.NoActionBar\">\n    <intent-filter>\n    \
  \    <action android:name=\"android.intent.action.MAIN\" />\n        <category android:name=\"\
  android.intent.category.LAUNCHER\" />\n    </intent-filter>\n</activity>\n```\n\n\
  将该属性设置为 `false` 将防止该活动出现在分屏模式或自由形模式下，且相应的按钮将不会出现在该应用的概览（Overview）菜单中。在分屏配置中，选择一个禁用了多窗口支持的活动作为第二个活动，系统将显示一条消息，指示该应用可能不支持多窗口模式。\n\
  \n## 63.7 指定多窗口属性\n\n`<layout>` 元素提供了若干属性，用于指定活动在多窗口模式下启动时的尺寸和位置。当活动在自由形模式下启动时，可以使用以下属性指定其初始高度、宽度和位置：\n\
  \n- `android:defaultWidth` – 指定活动的默认宽度。\n- `android:defaultHeight` – 指定活动的默认高度。\n\
  - `android:gravity` – 指定活动的初始位置（start、end、left、right、top 等）。\n\n请注意，上述属性仅在活动于自由形模式下显示时生效。下面的示例配置了活动以特定的高度和宽度在屏幕起始边缘的顶部出现：\n\
  \n```xml\n<activity android:name=\".MainActivity \">\n    <layout android:defaultHeight=\"\
  350dp\"\n             android:defaultWidth=\"450dp\"\n             android:gravity=\"\
  start|end\" />\n</activity>\n```\n\n可以使用以下 `<layout>` 属性来指定活动在分屏或自由形模式下可以缩减的最小宽度和高度：\n\
  \n- `android:minimalHeight` – 指定活动在分屏或自由形模式下可以缩减的最小高度。\n- `android:minimalWidth`\
  \ - 指定活动在分屏或自由形模式下可以缩减的最小宽度。\n\n当用户将分屏分割线滑动到最小高度或宽度边界之外，系统将停止调整收缩中活动的布局，并简单地裁剪用户界面以为相邻活动留出空间。\n\
  \n下面的清单文件片段为活动实现了最小宽度和高度属性：\n\n```xml\n<activity android:name=\".MainActivity \"\
  >\n    <layout android:minimalHeight=\"400dp\"\n             android:minimalWidth=\"\
  290dp\" />\n</activity>\n```\n\n## 63.8 在活动中检测多窗口模式\n\n在某些情况下，活动可能需要检测当前是否正以多窗口模式向用户显示。可以通过调用\
  \ `Activity` 类的 `isInMultiWindowMode()` 方法获取当前状态。当调用该方法时，它将根据该活动当前是否处于全屏状态返回 `true`\
  \ 或 `false` 值：\n\n```java\nif (this.isInMultiWindowMode()) {\n    // 活动正在多窗口模式下运行\n\
  } else {\n    // 活动未处于多窗口模式\n}\n```\n\n## 63.9 接收多窗口通知\n\n如果活动重写了 `onMultiWindowModeChanged()`\
  \ 回调方法，它将接收进入或退出多窗口模式的通知。传递给方法的第一个参数在进入多窗口模式时为 `true`，在活动退出该模式时为 `false`。新的配置设置包含在作为第二个参数传递的\
  \ `Configuration` 对象中\n\n```java\n@Override\npublic void onMultiWindowModeChanged(boolean\
  \ isInMultiWindowMode, Configuration newConfig) {\n    super.onMultiWindowModeChanged(isInMultiWindowMode,\
  \ newConfig);\n    if (isInMultiWindowMode) {\n        // 活动已进入多窗口模式\n    } else\
  \ {\n        // 活动已退出多窗口模式\n    }\n}\n```\n\n正如“处理 Android 活动状态变化”章节概述的，为了跟踪活动获取和失去状态的过程，可以实现\
  \ `onMultiWindowModeChanged()` 方法：\n\n```java\n@Override\npublic void onMultiWindowModeChanged(boolean\
  \ isInMultiWindowMode, Configuration newConfig) {\n    super.onMultiWindowModeChanged(isInMultiWindowMode,\
  \ newConfig);\n    if (isInMultiWindowMode) {\n        // 活动已进入多窗口模式\n    } else\
  \ {\n        // 活动已退出多窗口模式\n    }\n}\n```\n\n在某些运行 Android 9 的设备上，通过在清单文件中启用以下属性，也可以利用多恢复（multi-resume）功能：\n\
  \n```xml\n<meta-data android:name=\"allow_multiple_resumed\" android:value=\"true\"\
  \ />\n```\n\n## 63.10 在多窗口模式下启动活动\n\n在本书的“显式 Intent——实例演示”章节中，创建了一个示例应用，其中活动使用 intent\
  \ 启动第二个活动。默认情况下，通过 intent 启动的活动被认为与源活动位于同一个任务栈（task stack）中。然而，通过传递适当的标志（flags），可以将活动启动到新的任务栈中。\n\
  \n当多窗口模式下的活动在同一任务栈中启动另一个活动时，新活动将在分屏或自由形窗口中替换源活动。然而，在分屏模式下启动新的任务栈时，第二个活动将出现在原活动的相邻窗口中。在自由形模式下，启动的活动将出现在独立的窗口中。\n\
  \n要将活动启动到新的任务栈，必须在 intent 中设置以下标志：\n\n- `Intent.FLAG_ACTIVITY_ADJACENT`\n- `Intent.FLAG_ACTIVITY_MULTIPLE_TASK`\n\
  - `Intent.FLAG_ACTIVITY_NEW_TASK`\n\n下面的代码配置并启动了一个设计在独立窗口中第二个活动：\n\n```java\nIntent\
  \ i = new Intent(this, SecondActivity.class);\ni.addFlags(Intent.FLAG_ACTIVITY_ADJACENT\
  \ | \n          Intent.FLAG_ACTIVITY_MULTIPLE_TASK | \n          Intent.FLAG_ACTIVITY_NEW_TASK);\n\
  startActivity(i);\n```\n\n## 63.11 配置自由形活动的尺寸和位置\n\n默认情况下，在自由形模式下启动到不同任务栈的活动将位于系统指定的屏幕中心。通过\
  \ `ActivityOptions` 类向 intent 传递边界设置可以控制此窗口的位置和尺寸。此过程的第一步是创建一个 `Rect` 对象，配置表示活动窗口的矩形的左侧（X）、顶部（Y）、右侧（X）和底部（Y）坐标。下面的代码创建了一个\
  \ `Rect` 对象，其左上角位于坐标 (0, 0)，右下角位于 (100, 100)：\n\n```java\nRect rect = new Rect(100,\
  \ 800, 900, 700);\n```\n\n下一步是创建一个 `ActivityOptions` 类的基本实例，并通过 `setLaunchBounds()`\
  \ 方法使用 `Rect` 设置对其初始化。\n\n\n\n\n\n```java\nActivityOptions options = ActivityOptions.makeBasic();\n\
  \nActivityOptions bounds = options.setLaunchBounds(rect);\n```\n\n最后，`ActivityOptions`\
  \ 实例被转换为 `Bundle` 对象，并与 `Intent` 对象一起传递给 `startActivity()` 方法：\n\n```java\nstartActivity(i,\
  \ bounds.toBundle());\n```\n\n结合这些步骤，得到的代码序列如下：\n\n```java\nIntent i = new Intent(this,\
  \ SecondActivity.class);\n\ni.addFlags(Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT|\n \
  \          Intent.FLAG_ACTIVITY_MULTIPLE_TASK|\n           Intent.FLAG_ACTIVITY_NEW_TASK);\n\
  \nRect rect = new Rect(100, 800, 900, 700);\n\nActivityOptions options = ActivityOptions.makeBasic();\n\
  \nActivityOptions bounds = options.setLaunchBounds(rect);\n\nstartActivity(i, bounds.toBundle());\n\
  ```\n\n当源 Activity 处于自由窗口（freeform）模式时，通过 `intent` 启动第二个 Activity，新 Activity 窗口将按照\
  \ `Rect` 对象中定义的位置和尺寸出现。\n\n## 63.12 总结\n\nAndroid 7 引入了多窗口支持，该系统允许屏幕上同时显示多个 Activity。此功能现在已成为支持折叠屏设备的基础。多窗口支持提供了三种模式：分屏模式、自由窗口和画中模式。在分屏模式下，屏幕被水平或垂直划分为两个窗格，每个窗格显示一个\
  \ Activity。自由窗口模式仅在某些 Android 设备上支持，允许每个 Activity 显示在独立的、可移动且可调整大小的窗口中。如本章概述，Android\
  \ SDK 提供了许多方法和属性设置，用于检测、响应和控制应用内部的多窗口行为。\n\n## 64. Android SQLite 数据库概览\n\n不需要存储至少某些持久化数据的移动应用寥寥无几。数据库的使用是大多数应用程序的一个基本方面，其范围从几乎完全由数据驱动的应用，到只需要存储少量数据（如游戏的当前得分）的应用不等。\n\
  \n考虑到典型 Android 应用具有瞬态的生命周期，持久化数据存储的重要性变得更加显现。由于 Android 运行时系统随时存在终止应用程序组件以释放资源的风险，制定一个全面的数据存储策略以避免数据丢失，是任何应用开发策略设计和实现的关键因素。\n\
  \n本章将提供 Android 操作系统自带的 SQLite 数据库管理系统的概述，并概述提供的 Android SDK 类，以便于在 Android 应用内部实现基于\
  \ SQLite 的持久化数据库存储。然而，在深入探讨 Android 开发背景下的 SQLite 细节之前，将对数据库和 SQL 进行简要概述。\n\n##\
  \ 64.1 理解数据库表\n\n数据库表（Database Tables）提供了数据库中最基础层的数据结构。每个数据库可以包含多个表，每个表都设计用于持有特定类型的信息。例如，数据库可以包含一个客户表，其中包含特定业务每个客户的名称、地址和电话号码。同一个数据库还可以包含一个\
  \ `products` 表，用于存储该业务销售商品的描述以及相关的产品代码。\n\n数据库中的每个表都分配有一个名称，该名称在特定数据库中必须是唯一的。表名一旦分配给某个数据库中的表，除非在另一个数据库范围内，否则不能用于另一个表。\n\
  \n## 64.2 引入数据库模式（Schema）\n\n数据库模式（Database Schemas）定义了存储在数据库表数据的特征。例如，客户数据库表的模式可能会定义客户名称为长度不超过\
  \ 20 个字符的字符串，客户电话号码为特定格式的数值数据字段。\n\n模式还用于定义整个数据库的结构以及每个数据库中包含各种表之间的关系。\n\n## 64.3\
  \ 列和数据类型\n\n在此阶段，将数据库表看作类似于电子表格是有帮助的，数据存储在行和列中。\n\n每一列（Column）代表对应表中的一个数据字段。例如，表的名称、地址和电话数据字段都是列。\n\
  \n每一列反过来被定义为包含特定类型的数据。因此，一个设计用于存储数字的列将会被定义为包含数值数据。\n\n## 64.4 数据库行\n\n保存到表中的每条新记录都存储在某行（Row）中。每一行反过来由与保存记录关联的数据列组成。\n\
  \n再次考虑本章前面描述的电子表格类比。客户表中的每个条目等同于电子表格中的行，每一列都包含每个客户的数据（名称、地址、电话等）。当向表中添加新客户时，会创建一个新行，并将该客户的数据存储在新行的对应列中。\n\
  \n行有时也被称为记录（records）或条目（entries），这些术语通常可以互换使用。\n\n## 64.5 引入主键\n\n每个数据库表都应该包含一个或多个列，用于唯一地标识表中的每一行。这在数据库术语中被称为主键（Primary\
  \ Key）。例如，一个表可以使用银行账户列作为主键。或者，客户表可以使用客户的社会安全号码作为主键。\n\n主键允许数据库管理系统唯一地识别表中的特定行。如果没有主键，将无法检索或删除表中的特定行，因为无法确定是否选择了正确的行。例如，假设一个表将客户的姓氏定义为主键。请想象一下，如果数据库中记录了多个姓“Smith”的客户，可能会出现什么问题。如果没有某种可靠的方法来标识特定行，就无法确保访问的是正确的数据。\n\
  \n主键可以由表中的单列或多列组成。要作为单列主键，任意行不能包含相同的主键值。当使用多个列构造主键时，单个列的值不需要唯一，但所有列值的组合必须是唯一的。\n\
  \n## 64.6 什么是 SQLite？\n\nSQLite 是一种嵌入式关系数据库管理系统（RDBMS）。大多数关系型数据库（Oracle、SQL Server\
  \ 和 MySQL 是主要示例）是独立的服务器进程，它们与需要数据库访问的应用程序独立运行并协作运行。SQLite 被称为嵌入式，是因为它以库的形式被链接到应用程序中。因此，没有独立的数据库服务器在后台运行。所有的数据库操作都通过调用\
  \ SQLite 库包含的函数在应用程序内部处理。\n\nSQLite 的开发者已将该技术投入公有领域，结果它现在已成为广泛部署的数据库解决方案。\n\nSQLite\
  \ 使用 C 语言编写，因此 Android SDK 为底层数据库接口提供了一个基于 Java 的“封装”。这本质上由一组类组成，可以在应用程序的 Java 或\
  \ Kotlin 代码中创建并管理基于 SQLite 的数据库。\n\n有关 SQLite 的更多信息，请参阅 [`www.sqlite.org`](http://www.sqlite.org)。\n\
  \n## 64.7 结构化查询语言 (SQL)\n\n\n\n\n\nSQLite 数据库使用名为结构化查询语言（Structured Query Language）的高级语言访问数据。这通常缩写为\
  \ `SQL`，读作 sequel。`SQL` 是大多数关系型数据库管理系统使用的标准语言。`SQLite` 基本上符合 `SQL-92` 标准。\n\n`SQL`\
  \ 本质上是一种非常简单且易于使用的语言，专门设计用于读写数据库数据。由于 `SQL` 包含一组较小的关键字，因此可以快速学习。此外，大多数 DBMS 实现之间的\
  \ `SQL` 语法在多大程度上是相同的，因此在为某个特定系统学习了 `SQL` 后，你的技能很可能会迁移到其他数据库管理系统中。\n\n虽然本章将使用一些基本的\
  \ `SQL` 语句，但 `SQL` 的详细概述超出了本书的范围。然而，还有许多其他资源可以提供比我们在本章节中能提供的好得多的 `SQL` 概述。\n\n##\
  \ 64.8 在 Android 虚拟设备 (AVD) 上尝试 SQLite\n\n对于对通用数据库（尤其是 `SQLite`）不熟悉的读者来说，直接开始创建一个使用\
  \ `SQLite` 的 Android 可能看起来有些令人畏畏。幸运的是，Android 预装了 `SQLite`，包括一个交互式环境，可以通过连接到运行中的\
  \ Android AVD 模拟器实例的 `adb shell` 会话发布 `SQL` 命令。这既是学习 `SQLite` 和 `SQL` 的有效方法，也是识别运行在模拟器中的应用程序所创建的数据库问题的无价工具。\n\
  \n要启动一个交互式 `SQLite` 会话，首先运行 AVD 会话。这可以通过在 Android Studio 中启动 Android 虚拟设备管理器（`Tools`\
  \ -> `AVD Manager`）来实现，选择一个之前配置过的 AVD 并点击启动按钮。\n\n一旦 AVD 启动运行，打开终端（Terminal）或命令提示符窗口，并使用\
  \ `adb` 命令行工具如下连接到模拟器（注意 `-e` 标志指示工具查找要连接的模拟器，而不是物理设备）：\n\n```bash\nadb –e shell\n\
  ```\n\n连接后，shell 环境将提供一个命令提示符，可以在其中输入命令。首先使用 `su` 命令获取超级用户权限：\n\n```bash\nGeneric_x86:/\
  \ su\nroot@android:/ #\n```\n\n如果出现显示不允许超级用户权限的消息，可能是因为 AVD 实例包含了 Google Play 支持。要解决这个问题，请创建一个新的\
  \ AVD，并在“Choose a device definition”屏幕上选择一个在“Play Store”列中没有标记的设备。\n\n存储在 `SQLite`\
  \ 数据库中的数据实际上存储在运行应用程序的 Android 设备的文件系统的数据库文件中。默认情况下，这些数据库文件的文件系统路径如下：\n\n`/data/data/<package\
  \ name>/databases/<database filename>.db`\n\n例如，如果包名为 `com.example.MyDBApp` 的应用程序创建一个名为\
  \ `mydatabase.db` 的数据库，则设备上的文件路径将如下：\n\n`/data/data/com.example.MyDBApp/databases/mydatabase.db`\n\
  \n因此，为了进行练习，请在 `adb shell` 中切换目录到 `/data/data` 并创建一个适用于某些 `SQLite` 实验的子目录结构：\n\n\
  ```bash\ncd /data/data\nmkdir com.example.dbexample\ncd com.example.dbexample\n\
  mkdir databases\ncd databases\n```\n\n为数据库文件创建合适的位置后，如下如下启动交互式 `SQLite` 工具：\n\n\
  ```bash\nroot@android:/data/data/databases # sqlite3 ./mydatabase.db\nsqlite3 ./mydatabase.db\n\
  SQLite version 3.8.10.2 2015-05-20 18:17:19\nEnter \".help\" for usage hints.\n\
  sqlite>\n```\n\n在 `sqlite>` 提示符下，可以输入命令来执行诸如创建表、插入和检索数据等任务。例如，要在我们的数据库中创建一个包含存储\
  \ ID、名称、地址和电话号码字段的新表，需要以下语句：\n\n```sql\ncreate table contacts (_id integer primary\
  \ key autoincrement, name text, address text, phone text);\n```\n\n注意，表中的每行都应该有一个对该行唯一的主键。在上面的示例中，我们把\
  \ `ID` 字段指定为主键，将其声明为 `integer` 类型，并要求 `SQLite` 在每次添加新行时自动增加数字。这是确保每行都有一个唯一主键的常用方法。在大多数其他平台上，主键名称的选择是任意的。但在\
  \ Android 的案例中，必须将键命名为 `_id`，以便使用所有 Android 数据库相关类来完全访问数据库。其余字段每个都声明为 `text` 类型。\n\
  \n要列出当前选择数据库中的表，使用 `.tables` 语句：\n\n```sql\nsqlite> .tables\ncontacts\n```\n\n向表中插入记录：\n\
  \n```sql\nsqlite> insert into contacts (name, address, phone) values (\"Bill Smith\"\
  , \"123 Main Street, California\", \"123-555-2323\");\nsqlite> insert into contacts\
  \ (name, address, phone) values (\"Mike Parks\", \"10 Upping Street, Idaho\", \"\
  444-444-1212\");\n```\n\n从表中检索所有行：\n\n```sql\nsqlite> select * from contacts;\n\
  1|Bill Smith|123 Main Street, California|123-555-2323\n2|Mike Parks|10 Upping Street,\
  \ Idaho|444-444-1212\n```\n\n提取符合特定标准的行：\n\n```sql\nsqlite> select * from contacts\
  \ where name=\"Mike Parks\";\n2|Mike Parks|10 Upping Street, Idaho|444-444-1212\n\
  ```\n\n要退出 `sqlite3` 交互式环境：\n\n```sql\nsqlite> .exit\n```\n\n## 64.9 Android Room\
  \ 持久库\n\n如之前所述，`SQLite` 使用 C 语言编写，而 Android 应用程序主要使用 Java 或 Kotlin 开发。为了弥补过去的“语言鸿沟”，Android\
  \ SDK 包含了一组类，作为 SQLite 数据库管理系统的层。虽然这些类在 SDK 中仍然可用，但使用它们仍然需要编写大量代码，并且没有利用新的架构指南和功能（如\
  \ LiveData 和生命周期管理）。为了解决这些问题，Android 架构组件包含了 Room 持久库。该库在 SQLite 数据库系统之上提供了一个高级接口，使其能够以最少的代码在\
  \ Android 设备上存储数据，同时符合现代应用程序架构的建议。\n\n## 64.10 总结\n\n`SQLite` 是一种轻量级的嵌入式关系型数据库管理系统，作为\
  \ Android 框架的一部分包含，为 Android 应用程序实现组织的持久化数据存储提供了机制。与 Room 持久库结合时，Android 提供了一种在应用程序内部实现数据存储的现代方式。\n\
  \n\n\n\n\n# 65. Android Room 持久库\n\nRoom 持久库包含在 Android 架构组件中，专门设计用于方便为 Android\
  \ 应用添加数据库存储支持，并且这种方式符合 Android 架构指南。在上一章中涵盖了 `SQLite` 数据库的基础知识后，本章将探索基于 Room 的数据库管理的基本概念、在\
  \ Android 应用中共同工作以实现 Room 支持的关键要素元素，以及这些元素在架构和编码方面是如何实现的。在涵盖这些主题后，接下来的两个章节将通过示例\
  \ Room 数据库项目的形式将这些理论付诸实践。\n\n## 65.1 回顾现代应用架构\n\n标题为使用 Jetpack 构建现代 Android 应用架构的章节介绍了现代应用架构的概念，并强调了分离应用内不同职责区域的重要性。图\
  \ 65-1 所示的图表概述了典型 Android 应用的推荐架构：\n\n![](img/room_diagram_1.jpg)\n\n图 65-1\n\n\
  在本书之前的章节中已经详细介绍了该架构的顶三个级别，现在是时候在 Room 持久库的范围内开始探索仓库和数据库架构层了。\n\n## 65.2 Room 数据库持久的关键要素\n\
  \n在章节后续部分进行更详细讨论之前，首先值得总结一下使用 Room 持久库操作 `SQLite` 数据库涉及的关键要素：\n\n### 65.2.1 仓库 (Repository)\n\
  \n如之前所述，仓库模块包含了直接处理应用所用所有数据源所需代码。这避免了 UI 控制器和 `ViewModel` 需要直接访问数据库或网络服务等源的代码。\n\
  \n### 65.2.2 Room 数据库 (Room Database)\n\nroom 数据库对象提供了底层 `SQLite` 数据库的接口。它还为仓库提供了访问数据访问对象\
  \ (`DAO`) 的权限。应用应该只有一个 `room-database` 实例，该实例可以用来访问多个数据库表。\n\n### 65.2.3 数据访问对象\
  \ (DAO)\n\n`DAO` 包含了仓库在 `SQLite` 数据库中插入、检索和删除数据所需的 SQL 语句。这些 SQL 语句映射到方法，然后从仓库内部调用这些方法来执行相应的查询。\n\
  \n### 65.2.4 实体 (Entities)\n\n实体是一个定义数据库中表结构的类，它定义了表名、列名和数据类型，并标识哪一列是主键。除了声明表结构外，实体类还包含提供访问这些数据字段的\
  \ getter 和 setter 方法。`DAO` 响应 SQL 查询方法调用返回给仓库的数据将以这些实体类实例的形式存在。随后将调用 getter 方法从实体对象中提取数据。类似地，当仓库需要向数据库写入新记录时，它会创建一个实体实例，通过\
  \ setter 调用在对象上配置值，然后调用 `DAO` 中声明的 `insert` 方法，并传递要保存的实体实例。\n\n### 65.2.5 SQLite\
  \ 数据库\n\n实际的 `SQLite` 数据库负责存储和提供对数据的访问。应用代码（包括仓库）绝不应直接访问此底层数据库。所有的数据库操作都是通过 `room\
  \ database`、`DAOs` 和实体的结合来完成的。\n\n图 65-2 中的架构图说明了这些不同元素如何通过种方式相互作用，从而在 Android 应用中提供基于\
  \ Room 的数据库存储：\n\n![](img/room_architecture_diagram.jpg)\n\n图 65-2\n\n上述架构图中的编号连接可以总结如下：\n\
  \n1. 仓库与 `Room Database` 交互以获取数据库实例，该实例反过来被用于获取 `DAO` 实例的引用。\n2. 仓库创建实体实例并配置数据，然后将它们传递给\
  \ `DAO` 用于搜索和插入操作。\n3. 仓库调用 `DAO` 上的方法并传递要插入数据库的实体，并在响应搜索查询时接收回实体实例。\n4. 当 `DAO`\
  \ 有结果要返回给仓库时，它将这些结果封装成实体对象。\n5. `DAO` 与 `Room Database` 交互以启动数据库操作并处理结果。\n6. `Room\
  \ Database` 处理所有与底层 `SQLite` 数据库的底层交互，提交查询并接收结果。\n\n在涵盖了使用 Room 持久库访问数据库的关键要素的基本大纲后，现在是时候更详细地探索实体、`DAOs`、`room\
  \ databases` 和仓库了。\n\n## 65.3 理解实体 (Entities)\n\n每个数据库表都将关联一个实体类。该类定义了表的结构，并以散杂了一些特殊\
  \ Room 注解的标准 Java 类的形式呈现。一个声明存储在数据库表内数据的 Java 类示例可能读取如下：\n\n```java\npublic class\
  \ Customer {\n\n    private int id;\n    private String name;\n    private string\
  \ address;\n\n    public Customer(String name, String address) {\n        this.id\
  \ = id;\n        this.name = name;\n        this.address = address;\n    }\n\n \
  \   public int getId() {\n        return this.id;\n    }\n\n    public String getName()\
  \ {\n        return this.name;\n    }\n\n    public int getAddress() {\n       \
  \ return this.address;\n    }\n\n    public void setId(int id) {\n        this.id\
  \ = id;\n    }\n\n    public void setName(String name) {\n        this.name = name;\n\
  \    }\n\n    public void setAddress(int address) {\n        this.address = address;\n\
  \    }\n}\n```\n\n按照目前的实现方式，上述代码声明了一个包含若干表示数据库字段变量以及 getter/setter 方法的基础 Java 类。然而，该类还不是实体。为了使该类成为实体并使其在\
  \ SQL 语句中可用，需要添加如下 Room 注解：\n\n```java\n@Entity(tableName = \"customers\")\npublic\
  \ class Customer {\n\n    @PrimaryKey(autoGenerate = true)\n    @NonNull\n    @ColumnInfo(name\
  \ = \"customerId\")\n    private int id;\n\n    @ColumnInfo(name = \"customerName\"\
  )\n    private String name;\n\n    private String address;\n\n    public Customer(String\
  \ name, String address) {\n        this.id = id;\n        this.name = name;\n  \
  \      this.address = address;\n    }\n\n    public int getId() {\n        return\
  \ this.id;\n    }\n\n    public String getName() {\n        return this.name;\n\
  \    }\n\n    public String getAddress() {\n        return this.address;\n    }\n\
  \n    public void setId(@NonNull int id) {\n        this.id = id;\n    }\n\n   \
  \ public void setName(String name) {\n        this.name = name;\n    }\n\n    public\
  \ void setAddress(int address) {\n        this.address = address;\n    }\n}\n```\n\
  \n上述注解首先声明该类表示一个实体，并分配了表名为“customers”。每个数据库表都需要一个列作为主键。在这种情况下，客户 ID 被声明为主主键。id 值还被配置为自动生成。这意味着分配给新记录的\
  \ id 将由系统自动生成，以避免主键冲突。\n\n\n\n\n\n```java\n@ColumnInfo(name = \"customerId\")\n\
  private int id;\n```\n\n客户名称（customer name）字段也分配了一个列名。但注意，地址（address）字段没有分配列名。这意味着地址数据仍然存储在数据库中，但在\
  \ SQL 语句中不需要被引用。如果实体中的某个字段不需要存储在数据库中，只需使用 `@Ignore` 注解即可：\n\n```java\n@Ignore\n\
  private String myString;\n```\n\n最后，对 `id` 变量的 setter 方法进行了修改，以防止分配空值：\n\n```java\n\
  public void setId(@NonNull int id) {\n    this.id = id;\n}\n```\n\n实体类中还可以包含注解，以便使用关系型数据库中称为“外键”（foreign\
  \ keys）的概念与其他实体建立关系。外键允许一个表引用另一个表中的主键。例如，可以在名为 `Purchase` 的实体与现有的 `Customer` 实体之间建立如下关系：\n\
  \n```java\n@Entity(foreignKeys = {@ForeignKey(entity = Customer.class,\n      parentColumns\
  \ = \"customerId\",\n      childColumns = \"buyerId\",\n      onDelete = ForeignKey.CASCADE,\n\
  \      onUpdate = ForeignKey.RESTRICT})\npublic class Purchase {\n    @PrimaryKey(autoGenerate\
  \ = true)\n    @ColumnInfo(name = \"purchaseId\")\n    private int purchaseId;\n\
  \    @ColumnInfo(name = \"buyerId\")\n    private int buyerId;\n}\n```\n\n注意，外键声明还指定了当父记录被删除或更新时要采取的操作。可用选项有\
  \ `CASCADE`、`NO_ACTION`、`RESTRICT`、`SET_DEFAULT` 和 `SET_NULL`。\n\n## 65.4 数据访问对象\n\
  \n数据访问对象（Data Access Object）提供了访问存储在 SQLite 数据库中的数据的方法。DAO 被声明为标准的 Java 接口，并带有一些额外的注解，将特定的\
  \ SQL 语句映射到方法，这些方法可以被仓库（repository）调用。\n\n第一步是创建接口并使用 `@Dao` 注解将其声明为 DAO：\n\n```java\n\
  @Dao\npublic interface CustomerDao {\n}\n```\n\n接下来，添加 SQL 语句和相应方法名的条目。例如，下面的声明允许通过调用名为\
  \ `getAllCustomers()` 的方法检索 `customers` 表中的所有行：\n\n```java\n@Dao\npublic interface\
  \ CustomerDao {\n    @Query(\"SELECT * FROM customers\")\n    LiveData<List<Customer>>\
  \ getAllCustomers();\n}\n```\n\n注意，`getAllCustomers()` 方法返回一个 `List` 对象，其中包含从数据库表中检索到的每条记录对应的\
  \ `Customer` 实体对象。DAO 还使用了 `LiveData`，以便仓库能够观察数据库的变化。\n\n参数也可以传递到方法中，并在相应的 SQL 语句中引用。考虑以下\
  \ DAO 声明，它搜索与客户名称匹配的数据库记录（注意 `WHERE` 条件中引用的列名是实体类中分配给该列的名称）：\n\n```java\n@Query(\"\
  SELECT * FROM customers WHERE name = :customerName\")\nList<Customer> findCustomer(String\
  \ customerName);\n```\n\n在此示例中，传递给方法的是字符串值，该值随后通过在变量名前前加冒号（`:`）包含在 SQL 语句中。\n\n\
  可以使用 `@Insert` 方便注解按如下声明基础的插入操作：\n\n```java\n@Insert\nvoid addCustomer(Customer\
  \ customer);\n```\n\n这被称为方便注解，因为 Room 持久库可以推导出传递给 `addCustomer()` 方法的 `Customer`\
  \ 实体要插入数据库，而无需提供 SQL 插入语句。也可以在一个事务中插入多条数据库记录，如下：\n\n```java\n@Insert\npublic void\
  \ insertCustomers(Customer... customers);\n```\n\n下面的 DAO 声明删除所有与提供的客户名称匹配的记录：\n\
  \n```java\n@Query(\"DELETE FROM customers WHERE name = :name\")\nvoid deleteCustomer(String\
  \ name);\n```\n\n除了使用 `@Query` 注解执行删除外，还可以使用 `@Delete` 方便注解。在以下示例中，所有与传递给 `deleteCustomers()`\
  \ 方法的实体集匹配的 `Customer` 将从数据库删除：\n\n```java\n@Delete\npublic void deleteCustomers(Customer...\
  \ customers);\n```\n\n`@Update` 方便注解在更新记录时提供类似的行为：\n\n```java\n@Update\npublic void\
  \ updateCustomers(Customer... customers);\n```\n\n这些类型数据库操作的 DAO 方法也可以声明返回一个 `int`\
  \ 值，表示受事务影响的行数，例如：\n\n```java\n@Delete\npublic int deleteCustomers(Customer... customers);\n\
  ```\n\n## 65.5 Room 数据库\n\nRoom 数据库类通过扩展 `RoomDatabase` 类创建，并作为嵌入 Android 操作系统的实际\
  \ SQLite 数据库之上的层。该类负责创建并返回新的 Room 数据库实例，并提供与数据库关联的 DAO 实例的访问。\n\nRoom 持久库提供了一个数据库构建器来创建数据库实例。每个\
  \ Android 应用都应该只有一个 Room 数据库实例，因此最好在类内部实现防御性代码，以防止创建多个实例。\n\n下面的代码列表列出了与示例客户表配合使用的\
  \ Room 数据库实现：\n\n```java\nimport android.content.Context;\nimport android.arch.persistence.room.Database;\n\
  import android.arch.persistence.room.Room;\nimport android.arch.persistence.room.RoomDatabase;\n\
  \n@Database(entities = {Customer.class}, version = 1)\npublic class CustomerRoomDatabase\
  \ extends RoomDatabase {\n    public abstract CustomerDao dao();\n    private static\
  \ CustomerRoomDatabase INSTANCE;\n    static CustomerRoomDatabase getDatabase(Context\
  \ context) {\n        if (INSTANCE == null) {\n            synchronized (CustomerRoomDatabase.class)\
  \ {\n                if (INSTANCE == null) {\n                    INSTANCE = Room.databaseBuilder(context.getApplicationContext(),\n\
  \                          CustomerRoomDatabase.class, \"customer_database\")\n\
  \                        .build();\n                }\n            }\n        }\n\
  \        return INSTANCE;\n    }\n}\n```\n\n上述示例中重要的区域是：类声明上方的声明数据库运行实体的注解、检查是否已创建类实例的代码，以及为实例分配的\
  \ `customer_database` 名称。\n\n## 65.6 仓库\n\n仓库负责获取 Room 数据库实例、使用该实例访问关联的 DAO，然后调用\
  \ DAO 方法执行数据库操作。一个为 Room 数据库设计的典型构造函数如下：\n\n```java\npublic class CustomerRepository\
  \ {\n    private CustomerDao customerDao;\n    private CustomerRoomDatabase db;\n\
  \    public CustomerRepository(Application application) {\n        db = CustomerRoomDatabase.getDatabase(application);\n\
  \        customerDao = db.dao();\n    }\n}\n```\n\n一旦仓库访问了 DAO，它就可以调用数据访问方法。例如，下面的代码调用了\
  \ `getAllCustomers()` DAO 方法：\n\n```java\nprivate LiveData<List<Customer>> allCustomers;\n\
  allCustomers = customerDao.getAllCustomers();\n```\n\n在调用 DAO 方法时，需要注意的是，除非方法返回\
  \ `LiveData` 实例（它会自动在单独线程上运行查询），否则不能在应用程序的主线程上执行该操作。事实上，尝试这样做会导致应用程序崩溃，并产生如下诊断输出：\n\
  \n```\nCannot access database on the main thread since it may potentially lock the\
  \ UI for a long period of time\n```\n\n\n\n\n\n由于某些数据库事务可能需要较长时间才能完成，在单独线程上运行操作可以避免应用出现假死状态。正如“Android\
  \ Room 数据库和存储库教程”章节所示，这个问题可以通过使用 Java 线程来轻松解决（如需更多信息或复习如何使用线程，请参阅“Java 线程、Handlers\
  \ 和执行器基础概览”` 方法，而不是 `Room.databaseBuilder()`。以下代码显示了这两个方法调用之间的区别（注意，内存数据库不需要数据库名称）：\n\
  \n```java\n// 创建一个基于文件存储的数据库\nINSTANCE = Room.databaseBuilder(context.getApplicationContext(),\n\
  \                                 CustomerRoomDatabase.class, \"customer_database\"\
  )\n                                   .build();\n\n// 创建一个内存数据库\nINSTANCE = Room.inMemoryDatabaseBuilder(context.getApplicationContext(),\n\
  \                                         CustomerRoomDatabase.class)\n        \
  \                             .build();\n```\n\n## 65.8 数据库检查器\n\nAndroid Studio\
  \ 包含一个数据库检查器（Database Inspector）工具窗口，允许对与运行应用相关的 Room 数据库进行查看、搜索和修改，如图 65-3 所示：\n\
  \n![](img/as_database_inspector_window.jpg)\n\n图 65-3\n\n数据库检查器的用法将在“Android Room\
  \ 数据库和存储库教程”章节中介绍。\n\n## 65.9 总结\n\nAndroid Room 持久化库包含在 Android 架构组件中，并作为底层 SQLite\
  \ 数据库之上的抽象层。该库的设计是为了在符合 Android 架构指南的同时，使数据库操作变得简单。本章介绍了在 Android 应用项目中构建基于 Room\
  \ 的数据库存储的各种交互元素，包括实体（entities）、存储库（repositories）、数据访问对象（daos）、注解和 Room 实例。\n\n在涵盖了\
  \ SQLite 和 Room 架构组件的基础知识后，下一步是创建一个将这些理论付诸的示例应用。由于示例应用程序的用户界面需要基于表单的布局，下一章“Android\
  \ TableLayout 和 TableRow 教程”将稍微偏离核心主题，介绍 TableLayout 和 TableRow 视图的基础知识。\n\n## 66.\
  \ Android TableLayout 和 TableRow 教程\n\n在开始编写本书的下一章（“Android Room 数据库和存储库教程”）时，最初计划是包含为\
  \ Room 数据库示例应用设计用户界面布局的步骤。然而，显而易见的是，实现用户界面的方法是使用 Android 的 `TableLayout` 和 `TableRow`\
  \ 视图，而且该主题值得作为一个独立的章节。因此，本章将专门关注下一章要完成的数据库应用程序的用户界面设计，并在此过程中花时间介绍 Android Studio\
  \ 中表格布局的基本概念。\n\n## 66.1 TableLayout 和 TableRow 布局视图\n\n`TableLayout` 容器视图的目的是允许用户界面元素以行和列组成的表格格式组织在屏幕上。`TableLayout`\
  \ 中的每一行都由一个 `TableRow` 实例占据，而 `TableRow` 又被划分为单元格，每个单元格包含一个子视图（该子视图本身可以是包含多个子视图的容器）。\n\
  \n表格的列数由列数最多的一行决定，默认情况下，每列的宽度由该列中最宽的单元格定义。列可以配置为可收缩或可伸伸（或两者兼有），使其相对于父级 `TableLayout`\
  \ 改变大小。此外，单个单元格可以配置为跨越多个列。\n\n考虑图 66-1 所示的用户界面布局：\n\n![](img/as_4.1_room_demo_ui.jpg)\n\
  \n图 66-1\n\n从布局的视觉外观来看，很难识别出用于设计它的 `TableLayout` 结构。然而，图 66-2 中的层级树使得结构变得稍微容易理解一些：\n\
  \n![](img/as_4.1.jpg)\n\n图 66-2\n\n显然，该布局由一个父级 `LinearLayout` 视图带有 `TableLayout`\
  \ 和 `RecyclerView` 子视图组成。`TableLayout` 包含三个 `TableRow` 子，代表表格中的三行。`TableRow` 包含子视图，每个子视图代表表格单元格的内容。`LinearLayout`\
  \ 子视图包含三个 `Button` 子视图。\n\n图 66-2 所示的布局正是下一章将完成的数据库示例所需的确切布局。因此，本章的剩余部分将用于通过 Android\
  \ Studio 编辑器逐步完成设计。\n\n## 66.2 创建 Room 数据库项目\n\n从欢迎界面选择 New Project（新建项目）选项，并在生成的新建项目对话框中选择\
  \ Fragment + ViewModel 模板，然后点击 Next（下一步）按钮。\n\n在 Name 字段输入 `RoomDemo` 并指定 `com.ebookrenzy.roomdemo`\
  \ 为包名。在点击 Finish（完成）按钮之前，将 Minimum API 设置为 `API 26: Android 8.0 (Oreo)`并将 Language（语言）菜单改为\
  \ Java。\n\n### 66.3 转换为 LinearLayout\n\n在 Project 窗口（app -> res -> layout）找到 `main_fragment.xml`\
  \ 文件并双击将其加载到 Layout Editor 工具。默认情况下，Android Studio 使用 `ConstraintLayout` 作为根布局元素。这需要将其转换为垂直方向的\
  \ `LinearLayout`。在 Layout Editor 的 Design（设计）模式下，在 Component Tree 中找到主 `ConstraintLayout`\
  \ 组件并右键点击，显示如图 66-3 所示的菜单，并选择 `Convert view...`（转换视图...）选项：\n\n![](img/as_4.1_room_demo_convert_view.jpg)\n\
  \n图 66-3\n\n在对话（图 66-4）中选择转换为 `LinearLayout` 的选项，然后点击 Apply（应用）按钮：\n\n![](img/as_4.1.room_demo_convert_linear.jpg)\n\
  \n图 66-4\n\n默认情况下，布局编辑器会将 `ConstraintLayout` 转换为水平的 `LinearLayout`，因此在 Component\
  \ Tree 窗口中选择布局组件，参考 Attributes（属性）窗口并将 `orientation`（方向）属性更改为 `vertical`（垂直）：\n\n\
  ![](img/as_3.4_linearlayout_change_orientation.jpg)\n\n图 66-5\n\n转换完成后，从布局中删除默认的\
  \ `TextView` 。\n\n### 66.4 向用户界面添加 TableLayout\n\n留在 `main_fragment.xml` 文件中并参考\
  \ Palette 中的 Layouts 类别，拖放一个 `TableLayout` 视图，使其位于 `LinearLayout` 画布区域的顶部。\n\n\n\
  \n\n完成这些初始步骤后，布局的 `Component Tree`（组件树）应该类似于 图 66-6 所示。\n\n![](img/as3.2_tablelayout_in_tree.jpg)\n\
  \n图 66-6\n\n显然，Android Studio 已经自动向 `TableLayout` 添加了四个 `TableRow` 实例。由于此示例只需要三行，请选择并删除第四个\
  \ `TableRow` 实例。你可以随时通过从调板中拖动 `TableRow` 对象并将其释放到 `Component Tree` 工具窗口中的 `TableLayout`\
  \ 条目上，向 `TableLayout` 添加更多行。\n\n在选中 `TableLayout` 的情况下，使用 `Attributes`（属性）工具窗口将\
  \ `layout_height` 属性更改为 `wrap_content`并将 `layout_width` 更改为 `match_parent`。\n\n\
  ## 66.5 配置 TableRows\n\n从调板的 `Text` 部分中，将两个 `TextView` 对象拖放到 `Component Tree` 中最顶部的\
  \ `TableRow` 条目上（图 66-7）：\n\n![](img/as3.2_tablerow_textviews.jpg)\n\n图 66-7\n\n\
  选择屏幕布局中最左侧的 `TextView`，并在 `Attributes` 工具窗口中将 `text` 属性更改为“Product ID”。对右侧的 `TextView`\
  \ 重复此步骤，这次将 `text` 更改为“Not assigned”，并指定 `ID` 值为 `productID`。\n\n将另一个 `TextView`\
  \ 控件拖放到 `Component Tree` 中的第二个 `TableRow` 条目上，并将视图上的 `text` 更改为“Product Name”。在调板中找到\
  \ `Plain Text` 对象并将其拖放，使其在 `Component Tree` 中置于 Product Name `TextView` 下方，如 图 66-8\
  \ 所示。在选中 `EditText` 对象的情况下，将 `inputType` 属性从 `textPersonName` 更改为 `none`，从 `text`\
  \ 属性中删除“Name”字符串，并将 `ID` 设置为 `productName`。\n\n![](img/as_3.6_tablelayout_produnt_name_row.jpg)\n\
  \n图 66-8\n\n将另一个 `TextView` 和一个 `Number (Decimal) Text Field` 拖放到第三个 `TableRow`\
  \ 中，使 `TextView` 在层级中位于 `EditText` 上方。将 `TextView`  `text` 更改为 Product Quantity，并将\
  \ `EditText` 对象的 `ID` 更改为 `productQuantity`。\n\n按住 Shift 选择布局中的所有控件（如下所示 图 66-9\
  \ 所示），并使用 `Attributes` 工具窗口将所有对象的 `textSize` 属性设为 `18sp`：\n\n![](img/as_4.1_room_demo_views_selected.jpg)\n\
  \n图 66-9\n\n在继续之前，请确保将上述步骤中添加的所有 `text` 属性提取到字符串资源中。\n\n## 66.6 向布局中添加按钮栏\n\n下一步是在父\
  \ `LinearLayout` 视图中添加一个 `LinearLayout (Horizontal)`（水平布局）视图，位置紧邻 `TableLayout`\
  \ 视图下方。首先点击 `Component Tree` 中 `TableLayout` 条目左侧的小展开箭头，使 `TableRows` 折叠隐藏。从 `Layout\
  \ Editor` 调板的 `Layouts` 部分拖动一个 `LinearLayout (horizontal)` 实例，将其释放到 `Component Tree`\
  \ 面板中 `TableLayout` 条目的正下方，并将 `layout_height` 属性更改为 `wrap_content`：\n\n![](img/as3.2_tablelayout_add_linearlayout.jpg)\n\
  \n图 66-10\n\n将三个 `Button` 对象拖放到新的 `LinearLayout` 中，并为每个按钮分配对应“Add”、“Find”和“Delete”的字符串资源。此类按钮栏布局中的按钮通常应以无边框样式显示。对于每个按钮，使用\
  \ `Attributes` 工具窗口将样式设置为 `Widget.AppCompat.Button.Borderless`，并将 `textColor` 属性设置为\
  \ `@color/black`。将按钮的 `ID` 分别更改为 `addButton`、`findButton` 和 `deleteButton`。\n\n\
  ![](img/as_3.4_change_button_style.jpg)\n\n图 66-11\n\n在 `Component Tree` 中选中新的水平\
  \ `LinearLayout` 视图，将 `gravity` 属性更改为 `center_horizontal`，以便按钮在显示区域水平居中。\n\n## 66.7\
  \ 添加 RecyclerView\n\n在 `Component Tree` 中，点击新添加的水平 `LinearLayout` 条目右侧的展开箭头以折叠所有子项。\n\
  \n从调板的 `Containers` 部分拖动一个 `RecyclerView` 实例并释放到 `Component Tree` 中，使其位于按钮栏 `LinearLayout`\
  \ 下方，如 图 66-12 所示。注意确保 `RecyclerView` 是作为父垂直 `LinearLayout` 视图的直接子项添加，而不是水平按钮栏 `LinearLayout`\
  \ 的子项。\n\n![](img/as_3.6_tablelayout_recyclerview.jpg)\n\n图 66-12\n\n在布局中选中 `RecyclerView`，将视图的\
  \ `ID` 更改为 `product_recycler`并将 `layout_height` 属性设置为 `match_parent`。在继续之前，检查布局的层级是否如下所示：\n\
  \n![](img/as_4.1_room_demo_views.jpg)\n\n图 66-13\n\n## 66.8 调整布局间距\n\n最后只需调整一些布局设置。首先点击\
  \ `Component Tree` 面板中的第一个 `TableRow` 条目使其选中。按住键盘上的 `Cmd/Ctrl` 键并点击第二个、三个 `TableRow`、水平\
  \ `LinearLayout` 以及 `RecyclerView`。在 `Attributes` 面板中找到 `layout_margin` 类别，找到后将其更改为\
  \ `10dp`，如 图 66-14 所示：\n\n![](img/as_3.4_layout_margin.jpg)\n\n图 66-14\n\n间距设置后，用户界面应如\
  \ 图 66-1 所示。\n\n## 66.9 总结\n\nAndroid `TableLayout` 容器提供了按行列排列视图的方法。`TableLayout`\
  \ 中的行通过 `TableRow` 实现。在本章中，我们设计了用户界面。下一章将为该用户界面添加功能，以实现数据库能力。\n\n## 67. Room 数据库与仓库教程\n\
  \n本章将结合 Room Persistence Library 章节中的知识与上一章创建的初始项目，提供实现 SQLite 存储的详细教程。遵循 Android\
  \ 架构指南，项目将使用 ViewModel 和仓库。教程将使用 Room Persistence Library 中涵盖的所有元素，包括实体、数据访问对象（DAO）、Room\
  \ 数据库和异步数据库查询。\n\n### 67.1 关于 RoomDemo 项目\n\n之前创建的用户界面是创建一个简单库存应用程序的第一步，该程序用于存储名称和数量。完成后，应用程序将提供添加、删除和搜索数据库条目的功能，同时显示数据库中当前所有产品的滚动列表。当添加或删除数据库条目时，此产品列表将自动更新。\n\
  \n### 67.2 修改构建配置\n\n首先启动 Android Studio 并打开上一章开始的 RoomDemo 项目。在项目中添加任何新类之前，第一步是向构建配置添加一些额外的库。现在也是在时候\
  \ build.gradle` 文件中启用视图绑定的好时。定位并编辑模块级 `build.gradle` 文件（app -> Gradle Scripts ->\
  \ `build.gradle` (Module: RoomDemo.app)）并按如下所示修改：\n\n```gradle\nandroid {\n    buildFeatures\
  \ {\n```\n\n\n\n\n```gradle\n    viewBinding true\n}\n\ndependencies {\n    implementation\
  \ \"androidx.recyclerview:recyclerview:1.2.1\"\n    implementation \"androidx.room:room-runtime:2.4.1\"\
  \n    implementation \"androidx.fragment:fragment-ktx:1.4.1\"\n    annotationProcessor\
  \ \"androidx.room:room-compiler:2.4.1\"\n}\n```\n\n## 67.3 构建实体 (Entity)\n\n该项目将从创建实体开始，实体定义了数据库表的结构（schema）。实体将包含一个用于产品\
  \ ID 的整数、一个用于存储产品名称的字符串列以及另一个存储数量的整数值。`productid` 列将作为主键并自动生成。表 67-1 总结了实体的结构：\n\
  \n| 列名 | 数据类型 |\n| :--- | :--- |\n| productid | Integer / 主键 / 自动递增 |\n| productname\
  \ | String |\n| productquantity | Integer |\n\n表 67-1\n\n在 Project 工具窗口中右键点击 `app`\
  \ -> `java` -> `com` -> `ebookfrenzy` -> `roomdemo` 项，选择 `New -> Java Class` 菜单选项为实体添加一个类文件。在新建类对话框中，将类命名为\
  \ `Product`，在列表中选择 `Class` 项并按键盘回车键生成文件。\n\n当 `Product.java` 文件在编辑器中打开时，对其进行修改如下：\n\
  \n```java\npackage com.ebookfrenzy.roomdemo;\n\npublic class Product {\n    private\
  \ int id;\n    private String name;\n    private int quantity;\n\n    public Product(String\
  \ name, int quantity) {\n        this.name = name;\n        this.quantity = quantity;\n\
  \    }\n\n    public int getId() {\n        return this.id;\n    }\n\n    public\
  \ String getName() {\n        return this.name;\n    }\n\n    public int getQuantity()\
  \ {\n        return this.quantity;\n    }\n\n    public void setId(int id) {\n \
  \       this.id = id;\n    }\n\n    public void setName(String name) {\n       \
  \ this.name = name;\n    }\n\n    public void setQuantity(int quantity) {\n    \
  \    this.quantity = quantity;\n    }\n}\n```\n\n该类现在包含了对应数据库列的变量以及相应的 getter 和\
  \ setter 方法。当然，在对类添加注解之前，它不会成为一个实体。在编辑器仍打开该类文件的情况下，添加注解和相应的导入语句：\n\n```java\npackage\
  \ com.ebookfrenzy.roomdemo;\n\nimport androidx.annotation.NonNull;\nimport androidx.room.ColumnInfo;\n\
  import androidx.room.Entity;\nimport androidx.room.PrimaryKey;\n\n@Entity(tableName\
  \ = \"products\")\npublic class Product {\n    @PrimaryKey(autoGenerate = true)\n\
  \    @ColumnInfo(name = \"productId\")\n    private int id;\n\n    @ColumnInfo(name\
  \ = \"productName\")\n    private String name;\n    private int quantity;\n}\n```\n\
  \n这些注解声明该类为名为 `products` 表的实体，并为 `id` 和 `name` 变量分配了列名。`id` 列也被配置为主键并自动生成。由于主键永远不能为空，因此应用了\
  \ `@NonNull` 注解。由于在 SQL 查询中不需要引用 `quantity` 列，因此没有为 `quantity` 变量分配列名。\n\n## 67.4\
  \ 创建数据访问对象 (DAO)\n\n定义好产品实体后，下一步是创建 DAO 接口。再次参考 Project 工具窗口，右键点击 `app` -> `java`\
  \ -> `com` -> `ebookfrenzy` -> `roomdemo` 项并选择 `New -> Java Class` 菜单选项。在新建类对话框中，在\
  \ `Name` 字段中输入 `ProductDao`，并如图 67-1 所示，从列表中选择 `Interface`：\n\n![](img/as_4.1_room_demo_new_interface.jpg)\n\
  \n图 67-1\n\n点击 OK 生成新接口，并在 `ProductDao.java` 文件加载到代码编辑器后，进行以下更改：\n\n```java\npackage\
  \ com.ebookfrenzy.roomdemo;\n\nimport androidx.lifecycle.LiveData;\nimport androidx.room.Dao;\n\
  import androidx.room.Insert;\nimport androidx.room.Query;\nimport java.util.List;\n\
  \n@Dao\npublic interface ProductDao {\n    @Insert\n    void insertProduct(Product\
  \ product);\n\n    @Query(\"SELECT * FROM products WHERE productName = :name\")\n\
  \    List<Product> findProduct(String name);\n\n    @Query(\"DELETE FROM products\
  \ WHERE productName = :name\")\n    void deleteProduct(String name);\n\n    @Query(\"\
  SELECT * FROM products\")\n    LiveData<List<Product>> getAllProducts();\n}\n```\n\
  \n`DAO` 实现了从 `products` 数据库中插入、查找和删除记录的方法。插入方法传递一个包含存储数据的 `Product` 对象，而查找和删除记录的方法则传递一个包含产品名称的字符串以执行操作。`getAllProducts()`\
  \ 方法返回一个包含数据库中所有记录的 `LiveData` 对象。此方法将用于保持界面中 `RecyclerView` 产品列表与数据库同步。\n\n## 67.5\
  \ 添加 Room 数据库\n\n在将仓库（repository）添加到项目之前，最后一个任务是实现 Room 实例。向项目中添加一个名为 `ProductRoomDatabase`\
  \ 的新类，这次选择 `Class` 选项。文件生成后，使用“Android 持久库”中概述的步骤对其进行修改：\n\n```java\npackage com.ebookfrenzy.roomdemo;\n\
  \nimport android.content.Context;\nimport androidx.room.Database;\nimport androidx.room.Room;\n\
  import androidx.room.RoomDatabase;\n\n@Database(entities = {Product.class}, version\
  \ = 1)\npublic abstract class ProductRoomDatabase extends RoomDatabase {\n    public\
  \ abstract ProductDao productDao();\n    private static ProductRoomDatabase INSTANCE;\n\
  \n    static ProductRoomDatabase getDatabase(final Context context) {\n        if\
  \ (INSTANCE == null) {\n            synchronized (ProductRoomDatabase.class) {\n\
  \                if (INSTANCE == null) {\n                    INSTANCE = Room.databaseBuilder(\n\
  \                        context.getApplicationContext(),\n                    \
  \    ProductRoomDatabase.class,\n                        \"product_database\").build();\n\
  \                }\n            }\n        }\n        return INSTANCE;\n    }\n\
  }\n```\n\n## 67.6 添加仓库 (Repository)\n\n向项目添加名为 `ProductRepository` 的新类，选择 `Class`\
  \ 选项。\n\n仓库类负责代表 `ViewModel` 与 Room 数据库交互，并需要提供使用 `DAO` 插入、删除和查询产品记录的方法。除了返回 `LiveData`\
  \ 对象的 `getAllProducts()` 方法外，这些数据库操作都需要在主线程线程中执行。\n\n在 `ProductRepository.java`\
  \ 文件中，添加用于将搜索结果返回给仓库线程的处理器（handler）代码：\n\n```java\npackage com.ebookfrenzy.roomdemo;\n\
  \nimport android.os.Handler;\nimport android.os.Looper;\nimport android.os.Message;\n\
  import java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\n\
  import androidx.lifecycle.MutableLiveData;\nimport java.util.List;\n\npublic class\
  \ ProductRepository {\n    private final MutableLiveData<List<Product>> searchResults\
  \ = new MutableLiveData<>();\n    private List<Product> results;\n\n    Handler\
  \ handler = new Handler(Looper.getMainLooper()) {\n        @Override\n        public\
  \ void handleMessage(Message msg) {\n            searchResults.setValue(results);\n\
  \        }\n    };\n}\n```\n\n上述代码声明了一个名为 `searchResults` 的 `MutableLiveData` 变量，当异步搜索任务完成时，会将搜索结果存储其中（在后续教程中，ViewModel\
  \ 的观察者将监控此活动数据对象）。\n\n\n\n\n\n`repository` 类现在需要提供一些可以供 `ViewModel` 调用以启动这些操作的方法。然而，为了实现这一点，仓库需要通过\
  \ `ProductRoomDatabase` 实例获取 `DAO` 引用。为 `ProductRepository` 类添加一个构造方法来执行这些任务：\n\n\
  ```java\nimport android.app.Application;\n\npublic class ProductRepository {\n \
  \   private final MutableLiveData<List<Product>> searchResults = new MutableLiveData<>();\n\
  \    private List<Product> results;\n    private final ProductDao productDao;\n\n\
  \    public ProductRepository(Application application) {\n        ProductRoomDatabase\
  \ db;\n        db = ProductRoomDatabase.getDatabase(application);\n        productDao\
  \ = db.productDao();\n    }\n}\n```\n\n在存储了 `DAO` 引用后，就可以按照所示方法添加到 `ProductRepository`\
  \ 类文件中：\n\n```java\npublic void insertProduct(Product newproduct) {\n    ExecutorService\
  \ executor = Executors.newSingleThreadExecutor();\n    executor.submit(() -> {\n\
  \            productDao.insertProduct(newproduct);\n    });\n    executor.shutdown();\n\
  }\n\npublic void deleteProduct(String name) {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n\
  \    executor.submit(() -> {\n            productDao.deleteProduct(name);\n    });\n\
  \    executor.shutdown();\n}\n\npublic void findProduct(String name) {\n    ExecutorService\
  \ executor = Executors.newSingleThreadExecutor();\n    executor.submit(() -> {\n\
  \            results = productDao.findProduct(name);\n            handler.sendEmptyMessage(0);\n\
  \    });\n    executor.shutdown();\n}\n```\n\n在插入和删除方法中，创建并使用了适当的新线程来执行相应的数据库操作。在\
  \ `findProduct()` 方法中，会向 `handler` 发送消息，指示有新结果可用。\n\n完成仓库类还剩最后一个任务。用户界面布局中的 `RecyclerView`\
  \ 需要能够更新存储在数据库中的当前产品列表。`ProductDao` 类已经包含一个名为 `getAllProducts()` 的方法，该方法使用 SQL 查询来所有数据库记录，并将它们封装在\
  \ `LiveData` 对象中返回。仓库需要在初始化时调用此方法一次，并将结果存储在一个 `LiveData` 对象中，该对象可以被 `ViewModel`\
  \ 观察，进而被 UI 控制器观察。一旦设置完成，每当数据库表发生变化时，UI 控制器的观察者就会收到通知，`RecyclerView` 就可以更新最新的产品列表。在\
  \ `ProductRepository.java` 文件中，为构造函数添加 `LiveData` 变量并调用 DAO 的 `getAllProducts()`\
  \ 方法：\n\n```java\nimport androidx.lifecycle.LiveData;\n\npublic class ProductRepository\
  \ {\n    private final MutableLiveData<List<Product>> searchResults = new MutableLiveData<>();\n\
  \    private List<Product> results;\n    private final LiveData<List<Product>> allProducts;\n\
  \    private final ProductDao productDao;\n\n    public ProductRepository(Application\
  \ application) {\n        ProductRoomDatabase db;\n        db = ProductRoomDatabase.getDatabase(application);\n\
  \        productDao = db.productDao();\n        allProducts = productDao.getAllProducts();\n\
  \    }\n}\n```\n\n为了完成仓库，添加 `ViewModel` 可以调用的获取 `allProducts` 和 `searchResults`\
  \ Live 数据对象引用的方法：\n\n```java\npublic LiveData<List<Product>> getAllProducts() {\n\
  \    return allProducts;\n}\n\npublic MutableLiveData<List<Product>> getSearchResults()\
  \ {\n    return searchResults;\n}\n```\n\n## 67.7 修改 ViewModel\n\n`ViewModel` 负责创建仓库的实例，并提供方法和\
  \ `LiveData` 对象，供 UI 控制器使用以保持用户界面与底层数据库同步。正如在 `ProductRepository.java` 中实现的那样，仓库构造函数需要访问应用程序上下文以便获取\
  \ `Room Database` 实例。为了在 `ViewModel` 中能够访问应用程序上下文，`ViewModel` 需要继承 `AndroidViewModel`。因此，首先开始编辑\
  \ `MainViewModel.java` 文件（位于 `app` -> `java` -> `com` -> `ebookfrenzy` -> `roomdemo`\
  \ -> `ui`），并将类更改为 `AndroidViewModel` 并实现默认构造函数：\n\n```java\npackage com.ebookfrenzy.roomdemo.ui.main;\n\
  \nimport android.app.Application;\nimport androidx.lifecycle.AndroidViewModel;\n\
  import androidx.lifecycle.LiveData;\nimport androidx.lifecycle.MutableLiveData;\n\
  import com.ebookfrenzy.roomdemo.Product;\nimport com.ebookfrenzy.roomdemo.ProductRepository;\n\
  import java.util.List;\n\npublic class MainViewModel extends AndroidViewModel {\n\
  \    private ProductRepository repository;\n    private LiveData<List<Product>>\
  \ allProducts;\n    private MutableLiveData<List<Product>> searchResults;\n\n  \
  \  public MainViewModel(Application application) {\n        super(application);\n\
  \        repository = new ProductRepository(application);\n        allProducts =\
  \ repository.getAllProducts();\n        searchResults = repository.getSearchResults();\n\
  \    }\n}\n```\n\n构造函数本质上创建了一个仓库实例，然后使用它获取结果和 LiveData 对象的引用，以便它们被 UI 控制器观察。现在 `ViewModel`\
  \ 中剩下的所有工作就是实现从 UI 控制器中响应对 `LiveData` 对象设置观察者时调用的方法：\n\n```java\nMutableLiveData<List<Product>>\
  \ getSearchResults() {\n    return searchResults;\n}\n\nLiveData<List<Product>>\
  \ getAllProducts() {\n    return allProducts;\n}\n\npublic void insertProduct(Product\
  \ product) {\n    repository.insertProduct(product);\n}\n\npublic void findProduct(String\
  \ name) {\n    repository.findProduct(name);\n}\n\npublic void deleteProduct(String\
  \ name) {\n    repository.deleteProduct(name);\n}\n```\n\n## 67.8 创建产品项布局\n\n数据库中的每个产品名称将显示在\
  \ `RecyclerView` 列表中。这将一个包含 `TextView` 的布局资源文件用于每一行。现在通过右键点击 `app` -> `res` -> `layout`\
  \ 项并选择 New -> Layout resource file 来添加此文件。将文件命名为 `product_item`，并在点击之前将根元素更改为 `LinearLayout`，将其加载到布局编辑器。在设计模式下，从调色板拖出一个\
  \ `TextView` 对象到布局中，它将默认出现在布局顶部：\n\n![](img/as_3.5_roomdemo_item_layout.jpg)\n图\
  \ 67-2\n\n选中布局中的 `TextView`，使用属性窗口将视图 ID 设置为 `product_row` 并将 `layout_height` 设置为\
  \ `30dp`。在组件树窗口中选择 `LinearLayout` 并 `layout_height` 属性设置为 `wrap_content`。\n\n##\
  \ 67.9 添加 RecyclerView 适配器\n\n正如使用 RecyclerView 和 CardView 组件章节详细概述所示，`RecyclerView`\
  \ 实例需要一个适配器类来提供要显示的数据。现在通过右键点击 `app` -> `java` -> `com` -> `ebookfrenzy` -> `roomdemo`\
  \ -> `ui.main` 项并选择 New -> Java Class... 来添加此类。在对话框中，将类命名为 `ProductListAdapter`\
  \ 并从列表中 `Class` 然后按下回车键。当生成的 `ProductListAdapter.java` 类加载到编辑器后，按所示实现该类：\n\n```java\n\
  package com.ebookfrenzy.roomdemo.ui.main;\n\nimport android.view.LayoutInflater;\n\
  import android.view.View;\nimport android.view.ViewGroup;\nimport android.widget.TextView;\n\
  // ... 实现继续\n```\n\n\n\n\n\n## 67.10 准备主 Fragment\n\n最后一个需要修改的组件是 `MainFragment`\
  \ 类，它需要对 `Button` 视图配置点击监听器，并对位于 `ViewModel` 类中的 live 数据对象配置观察者。在添加这些代码之前，需要进行一些准备工作，添加一些导入包、变量并获取视图\
  \ ID 的引用。我们还需要修改 fragment 以使用视图绑定（view binding）。编辑 `MainFragment.java` 文件并进行如下修改：\n\
  \n```java\nimport com.ebookfrenzy.roomdemo.databinding.MainFragmentBinding;\n\n\
  public class MainFragment extends Fragment {\n    private MainViewModel mViewModel;\n\
  \    private MainFragmentBinding binding;\n    private ProductListAdapter adapter;\n\
  \n    @Nullable\n    @Override\n    public View onCreateView(@NonNull LayoutInflater\
  \ inflater,\n                            @Nullable ViewGroup container,\n      \
  \                      @Nullable Bundle savedInstanceState) {\n        return inflater.inflate(R.layout.main_fragment,\
  \ container, false);\n        binding = MainFragmentBinding.inflate(inflater, container,\
  \ false);\n        return binding.getRoot();\n    }\n\n    @Override\n    public\
  \ void onDestroyView() {\n        super.onDestroyView();\n        binding = null;\n\
  \    }\n\n    @Override\n    public void onActivityCreated(@Nullable Bundle savedInstanceState)\
  \ {\n        super.onActivityCreated(savedInstanceState);\n        mViewModel =\
  \ new ViewModelProvider(this).get(MainViewModel.class);\n        listenerSetup();\n\
  \        observerSetup();\n        recyclerViewSetup();\n    }\n}\n```\n\n在代码的不同阶段，应用需要清除用户界面中的产品信息。为了避免重复代码，添加\
  \ `clearFields()` 函数：\n\n```java\nprivate void clearFields() {\n    binding.productID.setText(\"\
  \");\n    binding.productName.setText(\"\");\n    binding.productQuantity.setText(\"\
  \");\n}\n```\n\n在构建和测试应用之前，需要将从 `onActivityCreated()` 方法调用的三个设置方法添加到类中。\n\n## 67.1\
  \ 添加按钮监听器\n\n主 fragment 的界面布局包含三个按钮，当用户点击时，它们需要执行特定的任务。编辑 `MainFragment.java` 文件并添加\
  \ `listenerSetup()` 方法：\n\n```java\nimport com.ebookfrenzy.roomdemo.Product;\n\n\
  private void listenerSetup() {\n    binding.addButton.setOnClickListener(new View.OnClickListener()\
  \ {\n        @Override\n        public void onClick(View view) {\n            String\
  \ name = binding.productName.getText().toString();\n            String quantity\
  \ = binding.productQuantity.getText().toString();\n            if (!name.equals(\"\
  \") && !quantity.equals(\"\")) {\n                Product product = new Product(name,\
  \ Integer.parseInt(quantity));\n                mViewModel.insertProduct(product);\n\
  \                clearFields();\n            } else {\n                binding.productID.setText(\"\
  Incomplete information\");\n            }\n        }\n    });\n    binding.findButton.setOnClickListener(new\
  \ View.OnClickListener() {\n        @Override\n        public void onClick(View\
  \ view) {\n            mViewModel.findProduct(binding.productName.getText().toString());\n\
  \        }\n    });\n    binding.deleteButton.setOnClickListener(new View.OnClickListener()\
  \ {\n        @Override\n        public void onClick(View view) {\n            mViewModel.deleteProduct(binding.productName.getText().toString());\n\
  \            clearFields();\n        }\n    });\n}\n```\n\n`addButton` 监听器执行了一些验证，以确保用户已输入了名称和数量，并使用这些数据创建一个新的\
  \ `Product` 实体（注意：数量字符串被转换为整数以匹配实体数据）。在清除字段之前，会调用 `insertProduct()` 方法。`findButton`\
  \ 和 `deleteButton` 则将产品名称传递给 `findProduct()` 或 `deleteProduct()` 方法。\n\n## 67.2\
  \ 添加 LiveData 观察者\n\n用户界面现在需要添加观察者，以便与 `ViewModel` 中的 `searchResults` 和 `allProducts`\
  \ live 数据保持同步。在 `Mainfragment.java` 文件中，按照如下方式实现 `observerSetup` 方法：\n\n```java\n\
  import androidx.lifecycle.Observer;\nimport java.util.List;\nimport java.util.Locale;\n\
  \nprivate void observerSetup() {\n    mViewModel.getAllProducts().observe(getViewLifecycleOwner(),\
  \ new Observer<List<Product>>() {\n        @Override\n        public void onChanged(@Nullable\
  \ List<Product> products) {\n            adapter.setProductList(products);\n   \
  \     }\n    });\n    mViewModel.getSearchResults().observe(getViewLifecycleOwner(),\
  \ new Observer<List<Product>>() {\n        @Override\n        public void onChanged(@Nullable\
  \ List<Product> products) {\n            if (products.size() > 0) {\n          \
  \      binding.productID.setText(String.format(Locale.US, \"%d\", products.get(0).getId()));\n\
  \                binding.productName.setText(products.get(0).getName());\n     \
  \           binding.productQuantity.setText(String.format(Locale.US, \"%d\", products.get(0).getQuantity()));\n\
  \            } else {\n                binding.productID.setText(\"No Match\");\n\
  \            }\n        }\n    });\n}\n```\n\n“所有产品”观察者仅将当前产品列表传递给 `RecyclerViewAdapter`\
  \ 的 `setProductList()` 方法，从而更新显示的列表。\n\n“搜索结果”观察者检查数据库中是否至少有一个匹配的结果，从列表中提取第一个匹配的\
  \ `Product` 实体对象，从对象中获取数据，在必要时进行转换并将其赋值给布局中的 `TextView` 和 `EditText` 视图。如果产品搜索失败，将通过显示在产品\
  \ ID `TextView` 上的消息通知用户。\n\n\n\n\n\n```java\nprivate void recyclerSetup() {\n \
  \   adapter = new ProductListAdapter(R.layout.product_list_item);\n    binding.productRecycler.setLayoutManager(\n\
  \                new LinearLayoutManager(getContext()));\n    binding.productRecycler.setAdapter(adapter);\n\
  }\n```\n\n### 67.14 测试 RoomDemo 应用\n\n在设备或模拟器上编译并运行应用，添加一些产品，并确保它们自动出现在 `RecyclerView`\
  \ 中。对现有的产品进行搜索，并验证产品 ID 和数量字段是否相应更新。最后，输入一个现有产品的名称，将其从数据库中删除它，并确认它已从 `RecyclerView`\
  \ 产品列表中移除。\n\n### 67.15 使用数据库检查器\n\n正如之前在“Android Room 持久化库” 中概述的那样，可以使用 `Database\
  \ Inspector` 工具来检查与运行应用相关的 `Room` 数据库的内容，并进行细微的数据更改。在使用 `RoomDemo` 应用添加了一些数据库记录后，使用\
  \ `View -> Tool Windows -> App Inspection` 菜单选项显示 `Database Inspector` 工具：\n\n在检查器窗口中，从下方图\
  \ 67-3 中标记为 `A` 的菜单中选择正在运行的应用：\n\n![](img/as_database_inspector.jpg)\n\n图 67-3\n\
  \n从 `Databases` 面板 (`B`) 双击 `products` 表查看当前存储在数据库中的行。启用 `Live updates` 选项 (`C`)\
  \ 然后使用运行的应用向数据库添加更多记录。`Database Inspector` 更新 (`D`) 实时更新表数据。\n\n关闭 `Live updates`\
  \ 以便表变为只读，双击 `quantity` 单元格并按 `Enter` 键。返回运行的应用并搜索产品以确认保存到数据库的 `quantity` 更改。最后，点击下方图\
  \ 67-4 中箭头指示的查询按钮以显示新查询 (`A`)，确保选中了 `product_database` (`B`) 并在查询框输入 SQL 语句 (`C`)\
  \ 然后点击 `Run` 按钮 (`D`)：\n\n![](img/as_database_inspector_query.jpg)\n\n图 67-4\n\n\
  行列表更新以反映 SQL 查询的结果 (`E`)。\n\n### 67.16 总结\n\n本章演示了使用 `Room` 持久化库在 `SQLite` 数据库中存储数据。完成的项目使用了\
  \ `repository` 将 `ViewModel` 与所有数据库操作分离，演示了 `entities` 的创建、`DAO` 以及执行某些数据库操作时的异步任务使用。\n\
  \n### 68 使用 Android Storage Access Framework 访问云存储\n\n近年来，远程存储服务（称为“云存储”）被广泛采用，以存储用户文件和数据。驱动这一增长的两个因素是：一是大多数移动设备现在提供持续的互联网连接，使得数据传输变得快速且便宜；二是与计算机系统（如台式机和笔记本电脑）相比，移动设备在内部存储资源方面受到限制。例如，如今的平板电脑通常带有\
  \ 128GB 的存储容量，与具有 750GB 硬盘的笔记本系统相比，无缝存储文件是许多移动应用程序的需求。\n\n由于这一事实，Google 在 Android\
  \ 4.4 SDK 中引入了 `Storage Access Framework`。本章将提供存储访问框架的高级概述，更详细的教程将在下一章节“Android\
  \ Storage Access Framework 示例`。\n\n#### 68.1 Storage Access Framework\n\n从用户的角度来看，`Storage\
  \ Access Framework` 提供了一个直观的用户界面，允许从 Android 内部浏览、选择和删除由存储服务（也称为 `document providers`）托管的文件。使用此浏览界面（也称为\
  \ `picker`），用户可以浏览所选文档提供者托管的文件（如文档、音频和视频）。例如图 68-1 显示选择器界面显示由文档提供者服务托管的文件集：\n\n\
  ![](img/as3.0_storage_demo_picker.jpg)\n\n图 68-1\n\n文档提供者可以是云端，也可以是运行在客户端相同设备上的本地。在编写时，兼容\
  \ `Storage Access Framework` 的主要文档提供者是 `Box` 和意不意外的 `Google Drive`。其他云存储提供者和应用程序开发者很快也会提供符合\
  \ Android `Storage Access Framework` 的服务。\n\n除了云文档提供者外，选择器还提供了对设备内部存储的访问，为应用程序用户提供一系列文件存储选项。\n\
  \n通过一组 `Intents`，Android 应用程序开发者只需几行代码即可将这些存储功能整合到应用程序中。从开发者的角度来看，`Storage Access\
  \ Framework` 特吸引人的方面是用户选择的底层文档提供者对应用程序是完全透明的。一旦在应用程序中使用框架实现了存储功能，它就可以与任何文档提供者协同工作。\n\
  \n#### 68.2 使用 Storage Access Framework\n\nAndroid 包含一组 `Intents`，旨在将 `Storage Access\
  \ Framework` 的功能集成到 Android 应用程序中。这些意向用户显示 `Storage Access Framework` 选择器界面，并通过调用启动意向\
  \ activity 的 `onActivityResult()` 方法将交互结果返回给应用程序。当调用 `onActivityResult()` 方法时，会传递选中文件的\
  \ `Uri` 以及指示操作成功与否的值。\n\n`Storage Access Framework` `intents` 总结如下：\n\n- `ACTION_OPEN_DOCUMENT`:为用户提供选择器用户界面，以便从设备上配置的文档提供者选择文件。选中的文件以\
  \ `Uri` 对象的格式传回应用程序。\n- `ACTION_CREATE_DOCUMENT`:允许用户选择文档提供者、该提供者存储器上的位置以及新文件的文件名。一旦选择，文件将由\
  \ `Storage Access Framework` 创建，并将文件的 `Uri` 返回给应用程序进行进一步处理。\n\n#### 68.3 过滤选择器文件列表\n\
  \n启动意向时，选择器用户界面中列出的文件可以使用多种选项进行过滤。例如，考虑以下配置 `ACTION_OPEN_DOCUMENT` 意向的代码：\n\n```java\n\
  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n```\n\n\n\n\n\n启动上述意图（intent）将显示选择器用户界面，允许用户浏览并选择由可用文档提供者托管的任何文件。一旦用户选择了某个文件，应用程序将以\
  \ `Uri` 对象的形式获得该文件的引用。随后，应用程序可以使用 `openFileDescriptor(Uri, String)` 方法打开该文件。然而，存在某种风险，并非所有文档提供者列出的文件都能通过这种方式打开。可以通过使用\
  \ `CATEGORY_OPENABLE` 选项修改意图，从而在选择器中排除此类文件。例如：\n\n```\nIntent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n\
  intent.addCategory(Intent.CATEGORY_OPENABLE);\n```\n\n当现在显示意图时，无法使用 `openFileDescriptor()`\
  \ 方法打开的文件将被列出，但用户无法选择它们。\n\n另一种实用的过滤方法允许按文件类型限制可选选择的文件。这涉及到指定应用程序能够处理的文件类型。例如，图像编辑应用程序可能只想为用户提供从文档提供者处选择图像文件的选项。这是通过配置意图对象以便用户可选选择文件的\
  \ MIME 类型来实现的。例如，以下代码指定了只有图像文件适用于在选择器中选择：\n\n```\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  intent.setType(\"image/*\");\n```\n\n这可以进一步完善以将选择限制为 JPEG 图像：\n\n```\nintent.setType(\"\
  image/jpeg\");\n```\n\n或者，音频播放应用可能只能处理音频文件：\n\n```\nintent.setType(\"audio/*\");\n\
  ```\n\n音频应用可能会被进一步限制为仅支持播放基于 MP4 格式的音频文件：\n\n```\nintent.setType(\"audio/mp4\");\n\
  ```\n\n在处理存储器访问框架（Storage Access Framework）时，可以使用多种 MIME 类型设置，其中更常见的可以在网上找到以下列表：\n\
  \nhttps://en.wikipedia.org/wiki/Internet_media_type#List_of_common_media_types\n\
  \n## 68.4 处理意图结果\n\n由于我们启动了将返回结果的意图，因此需要使用 `registerForActivityResult()` 方法（在 Android\
  \ 显式意图 – 实例示例章节中介绍）来创建一个启动器并声明一个 lambda 表达式来处理返回的数据，例如：\n\n```\nActivityResultLauncher<Intent>\
  \ startOpenForResult = registerForActivityResult(\n    new ActivityResultContracts.StartActivityForResult(),\n\
  \    new ActivityResultCallback<ActivityResult>() {\n        @Override\n       \
  \ public void onActivityResult(ActivityResult result) {\n            if (result.getResultCode()\
  \ == Activity.RESULT_OK) {\n                Intent data = result.getData();\n  \
  \              // 在此处从 Uri 读取文件内容\n            }\n        }\n    });\n```\n\n一旦声明，就可以按照如下方式配置并启动意图：\n\
  \n```\nIntent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  intent.setType(\"text/plain\");\nstartOpenForResult.launch(intent);\n```\n\n## 68.5\
  \ 读取文件内容\n\n读取文档提供者托管的文件内容的具体步骤很大程度上取决于文件的类型。例如，从文本文件中读取行的步骤与读取图像或音频文件的步骤不同。\n\n\
  可以通过从 `Uri` 对象中提取文件描述符，然后将图像解码为 `BitmapFactory` 实例，并将图像文件分配给 `Bitmap` 对象。例如：\n\n\
  ```\nParcelFileDescriptor pFileDescriptor = getContentResolver().openFileDescriptor(uri,\
  \ \"r\");\nFileDescriptor fileDescriptor = pFileDescriptor.getFileDescriptor();\n\
  Bitmap image = BitmapFactory.decodeFileDescriptor(fileDescriptor);\npFileDescriptor.close();\n\
  myImageView.setImageBitmap(image);\n```\n\n注意，文件描述符是以 `\"r\"` 模式打开的。这表示文件将为了读取而打开。其他选项包括\
  \ `\"w\"`（写访问）和 `\"rwt\"`（读写访问），其中文件中的现有内容将被新内容截断。\n\n读取文本文件的内容需要稍多的工作，并使用 `Inpustream`\
  \ 对象。例如，以下代码从文本文件中读取行：\n\n```\nInputStream inputStream = getContentResolver().openInputStream(uri);\n\
  BufferedReader reader = new BufferedReader(new InputStreamReader(inputStream));\n\
  String readline;\nwhile ((readline = reader.readLine()) != null) {\n    // 对行进行某些操作\n\
  }\ninputStream.close();\n```\n\n## 68.6 写入文件\n\n向文档提供者托管的打开文件写入内容与读取类似，不同在于使用了输出流（output\
  \ stream）。例如，以下代码向输出流写入文本：\n\n```\ntry {\n    ParcelFileDescriptor pFileDescriptor\
  \ = getContentResolver().openFileDescriptor(uri, \"w\");\n    FileOutputStream fileOutputStream\
  \ = new FileOutputStream(pFileDescriptor.getFileDescriptor());\n    String textContent\
  \ = \"Some text\";\n    fileOutputStream.write(textContent.getBytes());\n    fileOutputStream.close();\n\
  \    pFileDescriptor.close();\n} catch (FileNotFoundException e) {\n    e.printStackTrace();\n\
  } catch (IOException e) {\n    e.printStackTrace();\n}\n```\n\n首先，从 `Uri` 中提取文件描述符，这次请求对目标文件的写入权限。随后使用该文件描述符获取文件输出流的引用。\n\
  \n## 68.7 删除文件\n\n是否可以从存储器中删除文件取决于文件提供者是否支持删除文件。假设允许删除，可以对指定的 `Uri` 执行以下操作：\n\n\
  ```\nif (DocumentsContract.delete(getContentResolver(), uri)) {\n    // 删除成功\n}\
  \ else {\n    // 删除失败\n}\n```\n\n## 68.8 获取文件的持久访问权限\n\n当应用程序通过存储器访问框架获取文件访问时，该访问将一直有效直到运行应用程序的\
  \ Android 设备重启。可以通过“获取” `Uri` 的必要权限来获得特定文件的持久访问权限。例如，以下代码为 `fileUri` 实例的文件持久化读取和写入权限：\n\
  \n```\nfinal int takeFlags = intent.getFlags() & (Intent.FLAG_GRANT_READ_URI_PERMISSION\
  \ | Intent.FLAG_GRANT_WRITE_PERMISSION);\ngetContentResolver().takePersistableUriPermission(fileUri,\
  \ takeFlags);\n```\n\n一旦应用程序获取了文件的权限，并且应用程序已保存了 `Uri`，用户在设备重启后应该继续访问该文件，而无需从选择器界面重新选择文件。\n\
  \n如果在以后任何时候不再需要持久权限，可以通过调用内容解析器的 `releasePersistableUriPermission()` 方法来释放：\n\n\
  ```\nfinal int releaseFlags = intent.getFlags() & (Intent.FLAG_GRANT_READ_URI_PERMISSION\
  \ | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);\ngetContentResolver().releasePersistableUriPermission(fileUri,\
  \ releaseFlags);\n```\n\n## 68.9 总结\n\n\n\n\n\n思考近年来人们对“存储”的感知发生了变化是一件趣事。“存储”一词曾是大容量内置硬盘的同义词，但现在它同样可能指代托管在云端并通过互联网连接访问的存储空间。随着资源受限、内部存储容量最小的“始终连接”移动设备的广泛普及，这种情况变得日益普遍。\n\
  \n`Android Storage Access Framework` 为用户和应用开发者提供了一种简单的机制，使其能够无缝访问存储在云端的文件。通过使用一组\
  \ intents 以及一个用于选择文档提供程序和文件的内置用户界面，现在可以用极少的代码将全面的云存储集成到 Android 应用程序中。\n\n# 69.\
  \ Android Storage Access Framework 示例\n\n如前所述，`Storage Access Framework` 极大地简化了将云存储访问集成到\
  \ Android 应用程序中的过程。它由一个选择器用户界面和一组新的 intents 组成，现在可以相对地在 Android 应用程序中构建对 `Google\
  \ Drive` 和 `Box` 等文档提供程序上文件的访问。在上一节介绍了 `Android Storage Access Framework` 的基础知识后，本章将演示创建一个示例应用程序，该程序使用\
  \ `Storage Access Framework` 来存储和管理文件。\n\n## 69.1 关于 Storage Access Framework 示例\n\
  \n在本章创建的 Android 应用程序将以原始文本编辑器的形式存在，旨在将文本文件创建并远程存储到云服务中。在实践中，该示例适用于任何兼容 `Storage\
  \ Access Framework` 的云端文档存储提供程序，但为了本示例的演示，假设使用 `Google Drive`。\n\n在功能方面，该应用程序将向用户展示一个多行文本视图，可以在其中输入和编辑文本，并带有一允许创建、打开和保存存储的文本文件的按钮。\n\
  \n## 69.2 创建 Storage Access Framework 示例\n\n从欢迎界面选择 `New Project` 选项，在生成的新项目对话中，点击\
  \ `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `StorageDemo` 并指定 `com.ebookfrenzy.storagedemo`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单设置为 `Java`。按照第 [11.8 Migrating a Project to View Binding] 节中的常用步骤为项目添加\
  \ view binding 支持。\n\n## 69.3 设计用户界面\n\n用户界面需要包含三个 `Button` 视图和一个 `EditText` 视图。在\
  \ `Project` 工具窗口中，导航到位于 `app -> res -> layout` 的 `activity_main.xml` 布局文件并双击它将其加载到\
  \ `Layout Editor` 工具中。在工具的 `Design` 模式下，选择并删除 `Hello World!` `TextView` 对象。\n\n\
  在布局的左上角拖动并放置 `Button` 组件，在放置组件之前显示左侧和顶部的虚线边距指南。放置第二个 `Button`，使中心和顶部边距指南出现。第三个 `Button`\
  \ 组件应放置在使顶部和右侧边距指南出现的位置。\n\n将三个按钮的文本属性分别更改为“New”、“Open”和“Save”。接下来，放置一个 `Plain Text`\
  \ 组件，使其水平居中并位于中间按钮下方，以便使用户界面布局与[图 69-1]所示匹配。使用 `Layout Editor` 工具栏中的 `Infer Constraints`\
  \ 按钮添加任何缺失的约束。\n\n选择布局中的 `Plain Text` 组件，删除当前的文本属性设置使该字段初始为空，并将 `ID` 设置为 `fileText`，记住将所有字符串属性提取到资源值：\n\
  \n![](img/as_4.1_storage_demo_ui.jpg)\n\n*图 69-1*\n\n使用 `Attributes` 工具窗口，配置 `Button`\
  \ 组件上的 `onClick` 属性以分别调用命名为 `newFile()`、`openFile()` 和 `saveFile()` 的方法。\n\n## 69.4\
  \ 添加 Activity Launcher\n\n按照[“Android Explicit Intents – A Worked Example”]章节概述的步骤进行，我们需要开始注册\
  \ activity 启动器以处理文件内容的创建、打开和保存。在 `MainActivity.java` 文件中，如下如下分别为每个操作添加一个启动器：\n\n\
  ```java\nimport androidx.activity.result.ActivityResult;\nimport androidx.activity.result.ActivityResultCallback;\n\
  import androidx.activity.result.ActivityResultLauncher;\nimport androidx.activity.result.contract.ActivityResultContracts;\n\
  import android.app.Activity;\nimport android.content.Intent;\nimport android.net.Uri;\n\
  import java.io.IOException;\n\nActivityResultLauncher<Intent> startOpenForResult\
  \ =\n    registerForActivityResult(\n        new ActivityResultContracts.StartActivityForResult(),\n\
  \        new ActivityResultCallback<ActivityResult>() {\n            @Override\n\
  \            public void onActivityResult(ActivityResult result) {\n           \
  \     if (result.getResultCode() == Activity.RESULT_OK) {\n                    Intent\
  \ data = result.getData();\n                    if (data != null) {\n          \
  \              Uri currentUri = data.getData();\n                        try {\n\
  \                            String content = readFileContent(currentUri);\n   \
  \                         binding.fileText.setText(content);\n                 \
  \       } catch (IOException e) {\n                            // Handle error\n\
  \                        }\n                    }\n                }\n         \
  \   }\n        }\n    );\n\nActivityResultLauncher<Intent> startSaveForResult =\n\
  \    registerForActivityResult(\n        new ActivityResultContracts.StartActivityForResult(),\n\
  \        new ActivityResultCallback<ActivityResult>() {\n            @Override\n\
  \            public void onActivityResult(ActivityResult result) {\n           \
  \     if (result.getResultCode() == Activity.RESULT_OK) {\n                    Intent\
  \ data = result.getData();\n                    if (data != null) {\n          \
  \              Uri currentUri = data.getData();\n                        try {\n\
  \                            writeFileContent(currentUri);\n                   \
  \     } catch (IOException e) {\n                            // Handle error\n \
  \                       }\n                    }\n                }\n          \
  \  }\n        }\n    );\n\nActivityResultLauncher<Intent> startCreateForResult =\n\
  \    registerForActivityResult(\n        new ActivityResultContracts.StartActivityForResult(),\n\
  \        new ActivityResultCallback<ActivityResult>() {\n            @Override\n\
  \            public void onActivityResult(ActivityResult result) {\n           \
  \     if (result.getResultCode() == Activity.RESULT_OK) {\n                    Intent\
  \ data = result.getData();\n                    if (data != null) {\n          \
  \              binding.fileText.setText(\"\");\n                    }\n        \
  \        }\n            }\n        }\n    );\n```\n\n# 69.5 创建新的存储文件\n\n\n\n\n\n\
  当选中“New”（新建）按钮时，应用程序需要触发一个配置好的 `ACTION_CREATE_DOCUMENT` 意图，用于创建一个具有纯文本 MIME 类型的文件。在设计用户界面时，“New”按钮被配置为调用名为\
  \ `newFile()` 的方法。需要在该方法内部启动相应的意图。\n\n在 `MainActivity.java` 文件中，按照如下方式实现该方法：\n\n\
  ```java\npackage com.ebookfrenzy.storagedemo;\n\npublic class MainActivity extends\
  \ AppCompatActivity {\n\n.\n\n.\n\n    public void newFile(View view)\n    {\n \
  \       Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);\n        intent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  \        intent.setType(\"text/plain\");\n        intent.putExtra(Intent.EXTRA_TITLE,\
  \ \"newfile.txt\");\n        startCreateForResult.launch(intent);\n    }\n\n.\n\n\
  .\n}\n```\n\n此代码创建了一个新的 `ACTION_CREATE_INTENT` `Intent` 对象。随后对该意图进行配置，以便仅返回可以使用文件描述符打开的文件（通过\
  \ `Intent.CATEGORY_OPENABLE` 类别设置）。\n\n接下来，代码指定要打开的文件应具有纯文本 MIME 类型，并提供了一个占位符文件名（用户可以在选择器界面中更改它）。\n\
  \n当执行此方法且意图完成分配的任务时，将调用 `startCreateForResult()` lambda 表达式，并传入新创建文档的 `Uri`。\n\n\
  编译并运行应用程序，选择“New”按钮。存储访问框架（Storage Access Framework）随后应如图 69-3 所示显示下载用户界面：\n\n![](img/as_3.5_storage_downloads_screen.jpg)\n\
  \n图 69-2\n\n选择上方显示的菜单按钮，选择“Drive”选项，然后选择“My Drive”，导航到您的 Google Drive 存储上的某个合适位置以保存文件。在选择器界面底部的文本框中，选择“Save”（保存）选项之前，将名称从“newfile.txt”更改为合适的名称（但保留\
  \ `.txt` 扩展）。\n\n![](img/as_3.5_storage_destination_.jpg)\n\n图 69-3\n\n一旦创建了新文件，应用程序应返回到主活动，并且通知面板中可能会出现显示为“1\
  \ file uploaded”（已上传 1 文件）的通知。\n\n![](img/as_3.5_storage_upload_notification.jpg)\n\
  \n图 69-4\n\n此时，可以在浏览器窗口登录您的 Google Drive 账号并在请求的位置找到新创建的文件。如果文件丢失，请运行应用程序的 Android\
  \ 设备已连接到网络。也可以通过运行设备上的 Google Drive 应用（许多 Android 设备预装了该应用，也可从 Google Play 商店下载）来验证设备对\
  \ Google Drive 的访问权限。\n\n### 69.6 保存到存储文件\n\n现在应用程序已经能够创建新的存储基础文件，下一步是添加能够将用户输入的任何文本保存到文件的功能。用户界面被配置为在用户选中“Save”（保存）按钮时调用\
  \ `saveFile()` 方法。该方法将负责启动一个类型为 `ACTION_OPEN_DOCUMENT` 的新意图，这将导致选择器用户界面出现，使用户可以选择存储文本的文件。由于我们只处理纯文本文件，因此需要配置意图以将用户的选择选项限制为匹配\
  \ `text/plain` MIME 类型的现有文件。在确定了 `saveFile()` 方法要执行的操作后，现在可以将其如下所示添加到 `MainActivity.java`\
  \ 类文件中：\n\n```java\npublic void saveFile(View view)\n{\n    Intent intent = new\
  \ Intent(Intent.ACTION_OPEN_DOCUMENT);\n    intent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  \    intent.setType(\"text/plain\");\n    startSaveForResult.launch(intent)\n}\n\
  ```\n\n分配给 `startSaveForResult()` 的 lambda 调用了一个名为 `writeFileContent()` 的方法，并传入要写入文本的文件\
  \ `Uri`。继续留在 `MainActivity.java` 文件中，现在实现该方法，其读取如下：\n\n```java\npackage com.ebookfrenzy.storagedemo;\n\
  \nimport java.io.FileOutputStream;\nimport android.os.ParcelFileDescriptor;\n\n\
  public class MainActivity extends AppCompatActivity {\n\n.\n\n.\n\n    private void\
  \ writeFileContent(Uri uri) throws IOException\n    {\n        try{\n          \
  \  ParcelFileDescriptor pfd =\n                this.getContentResolver().\n    \
  \            openFileDescriptor(uri, \"w\");\n            FileOutputStream fileOutputStream\
  \ =\n                new FileOutputStream(pfd.getFileDescriptor());\n          \
  \  String textContent =\n                binding.fileText.getText().toString();\n\
  \            fileOutputStream.write(textContent.getBytes());\n            fileOutputStream.close();\n\
  \            pfd.close();\n        } catch (IOException e) {\n            e.printStackTrace();\n\
  \        }\n    }\n\n.\n\n.\n}\n```\n\n该方法首先从用户选择的文件 `Uri` 获取并打开文件描述符。由于代码需要向文件写入，因此描述符以写入模式（`\"\
  w\"`）打开。然后使用该文件描述符作为创建输出流的基础，从而允许应用程序写入文件。\n\n用户输入的文本从编辑框对象中提取，并在关闭文件描述符和流之前写入输出流。代码还包含了处理文件写入过程中任何\
  \ `IO` 异常。\n\n添加新方法后，编译并运行应用程序，在视图中输入一些文本并选择“Save”按钮。从选择器界面找到之前创建的文件以保存文本到该文件。返回浏览器窗口中的\
  \ Google Drive 账号并选择文本文件以显示内容。该文件现在应该包含 Android 设备上 StorageDemo 程序输入的文本。\n\n###\
  \ 69.7 打开并读取存储文件\n\n在编写了创建和保存文件的代码后，最后的任务是添加从存储打开并读取文件的功能。这涉及编写 `openFile()` 点击事件处理方法并实现它以启动\
  \ `ACTION_OPEN_DOCUMENT` 意图：\n\n```java\npublic void openFile(View view)\n{\n  \
  \  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n    intent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  \    intent.setType(\"text/plain\");\n    startOpenForResult.launch(intent);\n}\n\
  ```\n\n下一个任务是实现由 `startOpenForResult()`调用的 `readFileContent()` 方法：\n\n```java\n\
  package com.ebookfrenzy.storagedemo;\n\n.\n\n.\n\nimport java.io.BufferedReader;\n\
  import java.io.InputStream;\nimport java.io.InputStreamReader;\n\n.\n\n.\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n\n.\n\n.\n\n    private String\
  \ readFileContent(Uri uri) throws IOException {\n        InputStream inputStream\
  \ =\n            getContentResolver().openInputStream(uri);\n        BufferedReader\
  \ reader =\n            new BufferedReader(new InputStreamReader(\n            inputStream));\n\
  \        StringBuilder stringBuilder = new StringBuilder();\n        String currentline;\n\
  \        while ((currentline = reader.readLine()) != null) {\n            stringBuilder.append(currentline).append(\"\
  \\n\");\n        }\n        inputStream.close();\n        return stringBuilder.toString();\n\
  \    }\n\n.\n\n.\n}\n```\n\n\n\n\n\n该方法首先提取所选文本文件的文件描述符并以读取模式打开它。随后打开与 `Uri` 关联的输入流，并将其作为\
  \ `BufferedReader` 实例的输入源。然后读取文件中的每一行并将其存储在 `StringBuilder` 对象中。在读取完所有行后，输入流和文件描述符均会被关闭，并将文件内容作为\
  \ `String` 对象返回。\n\n## 69.8 测试存储访问应用程序\n\n编码阶段完成后，应用程序现在已准备好进行全面测试。首先，在配置了 Google\
  \ 账户身份的 Android 设备或 AVD 上启动应用程序，并选择“新建”（New）按钮。在弹出的存储选择器界面中，选择一个 Google Drive 位置，并将文本文件命名为\
  \ `storagedemo.txt`，然后选择文件名字段右侧的保存（Save）选项。\n\n当控制权返回到应用程序时，寻找文件上传通知，然后在文本区域中输入一些文本，最后再选择“保存”（Save）按钮。从选择器中选择之前创建的\
  \ `storagedemo.txt` 文件将内容保存到文件中。返回应用程序后，删除文本并选择“打开”（Open）按钮，再次选择 `storagedemo.txt`\
  \ 文件。当控制权返回到应用程序时，文本视图应该已填充文本文件的内容。\n\n需要注意的是，如果 Android 设备缺少活跃的互联网连接，存储访问框架（Storage\
  \ Access Framework）会将存储文件本地缓存。然而，一旦重新连接，任何缓存数据都将与远程存储服务同步。因此，作为应用程序的最终测试，请在浏览器窗口中登录\
  \ Google Drive 账户，导航到 `storagedemo.txt` 文件并点击它查看内容，如果一切顺利，内容应包含应用程序保存的文本。\n\n##\
  \ 69.9 总结\n\n本章讲解了如何创建一个示例 Android Studio 应用程序，该程序的形式为一个非常原始的文本编辑器，旨在使用 Android\
  \ 存储访问框架利用云存储创建、保存和打开文件。\n\n## 70. 使用 VideoView 和 MediaController 类在 Android 上进行视频播放\n\
  \n智能手机和平板电脑的主要用途之一是提供在线内容的访问。一种被广泛使用的内容形式（特别是在平板设备上）是视频。\n\nAndroid SDK 包含了两个类，它们在开发应用程序时使得在\
  \ Android 设备上实现视频播放变得极其简单。本章将在创建视频播放应用程序之前，概述这两个类：`VideoView` 和 `MediaController`。\n\
  \n### 70.1 介绍 Android VideoView 类\n\n到目前为止，在 Android 应用程序中显示视频简单的方法是使用 `VideoView`\
  \ 类。这是一个视觉组件，当它被添加到 Activity 的布局中时，它提供了一个可以播放视频的表面。Android 目前支持以下视频格式：\n\n* H.263\n\
  * H.264 AVC\n* H.265 HEVC\n* MPEG-4 SP\n* VP8\n* VP9\n\n`VideoView` 类拥有许多可以调用以管理视频播放的方法。以下是一些较常用的常用的方法：\n\
  \n* `setVideoPath(String path)` – 指定要播放的视频媒体的路径（字符串格式）。这可以是远程视频文件的 URL，也可以是设备本地的视频文件。\n\
  * `setVideoUri(Uri uri)` – 执行与 `setVideoPath()` 方法相同的任务，但接受一个 `Uri` 对象作为参数而不是字符串。\n\
  * `start()` – 启动视频播放。\n* `stopPlayback()` – 停止视频播放。\n* `pause()` – 暂停视频播放。\n* `isPlaying()`\
  \ – 返回一个布尔值，指示视频当前是否正在播放。\n* `setOnPreparedListener(MediaPlayer.OnPreparedListener)`\
  \ – 允许在视频准备好播放时调用回调方法。\n* `setOnErrorListener(MediaPlayer.OnErrorListener)` - 允许在视频播放期间发生错误时调用回调方法。\n\
  * `setOnCompletionListener(MediaPlayer.OnCompletionListener)` – 允许在视频结束时调用回调方法。\n\
  * `getDuration()` – 返回视频时长。除非从 `OnPreparedListener()` 回调方法内部调用，否则通常会返回 -1。\n* `getCurrentPosition()`\
  \ – 返回一个指示当前播放位置的整数。\n* `setMediaController(MediaController)` – 指定一个 `MediaController`\
  \ 实例，允许向用户显示播放控件。\n\n### 70.2 介绍 Android MediaController 类\n\n如果仅使用 `VideoView`\
  \ 类播放视频，用户将无法对播放进行任何控制，视频将一直运行到视频结束。通过将 `MediaController` 类的一个实例挂载到 `VideoView`\
  \ 实例上可以解决这个问题。`MediaController` 将提供一组控件，允许用户管理播放（例如暂停以及在视频时间轴上后退/向前查找）。\n\n控件的位置通过将控制器实例锚定到用户界面布局中的特定视图来指定。一旦挂载并锚定，控件将在播放开始时短暂出现，随后用户可以通过点击实例所锚定的视图在任何时间点重新恢复它们。\n\
  \n该类的一些关键方法如下：\n\n* `setAnchorView(View view)` – 指定控制器要锚定的视图。这决定了控件在屏幕上的位置。\n* `show()`\
  \ – 显示控件。\n* `show(int timeout)` – 控件在指定的持续时间（毫秒）内显示。\n* `hide()` – 向用户隐藏控制器。\n\
  * `isShowing()` – 返回一个布尔值，指示控件是否对用户可见。\n\n### 70.3 创建视频播放示例\n\n本章的剩余部分将创建一个旨在 `VideoView`\
  \ 和 `MediaController` 类播放视频文件的示例应用程序。\n\n在欢迎界面选择 New Project 选项，并在弹出的新项目对话框中选择 Empty\
  \ Activity 模板，然后点击 Next 按钮。\n\n在 Name 字段输入 VideoPlayer，并指定 `com.ebookfrenzy.videoplayer`\
  \ 为包名。在点击 Finish 按钮之前，将 Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将 Language\
  \ 菜单改为 Java。使用第 11.8 节项目迁移到 View Binding 的步骤为项目启用视图绑定。\n\n### 70.4 设计 VideoPlayer\
  \ 布局\n\n主 Activity 的界面将仅由 `VideoView` 类的实例组成。使用 Project 工具窗口找到 `app -> res -> layout\
  \ -> activity_main.xml` 文件，双击它，将 Layout Editor 工具切换到 Design 模式并删除默认的 `TextView`\
  \ 。\n\n从 Palette 面板的 Widgets 类别将 `VideoView` 实例拖放到到布局中，使其填充可用画布区域，如图 70-1 所示。使用\
  \ Attributes 面板，将 `layout_width` 和 `layout_height` 属性分别改为 `match_constraint` 和 `wrap_content`。此外，移除连接\
  \ `VideoView` 底到父容器 `ConstraintLayout` 底部的约束。最后，将组件的 ID 改为 `videoView1`。\n\n![](img/as_3.5_videoplayer_ui.jpg)\n\
  \n图 70-1\n\n### 70.5 下载视频文件\n\nVideoPlayer 应用播放的视频是用 MPEG-4 格式编码的短动画电影片段。使用网络浏览器，导航到以下\
  \ URL 以播放视频：\n\nhttps://www.ebookfrenzy.com/android_book/movie.mp4\n\n\n\n\n\n在浏览器窗口内，右键点击视频播放界面，选择保存或下载视频到本地文件的选项，并选择一个合适的临时文件系统位置，将文件命名为\
  \ `movie.mp4`。\n\n在 Android Studio 中，在 Project（项目）工具窗口中找到 `res` 文件夹，右键点击它并选择 `New`\
  \ -> `Directory` 菜单，在名称字段中输入 `raw`，然后点击 `OK` 按钮。使用操作系统的文件系统导航器找到上述下载的 `movie.mp4`\
  \ 文件并复制。返回 Android Studio，右键点击新创建的 `raw` 目录并选择 `Paste`（粘贴）选项，将视频文件复制到项目中。添加完成后，Project\
  \ 工具窗口中的 `raw` 文件夹应该与图 70-2 所示一致：\n\n![](img/as_3.6_video_player_raw_file_added.jpg)\n\
  \n图 70-2\n\n## 70.6 配置 VideoView\n\n下一步是为 `VideoView` 配置要播放的视频路径，然后开始播放。这将在主活动（activity）初始化时执行，因此将\
  \ `MainActivity.java` 文件加载到编辑器中并按照以下代码列表进行修改：\n\n```java\npackage com.ebookfrenzy.videoplayer;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\n\
  import android.widget.VideoView;\nimport android.net.Uri;\n\n.\n.\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private ActivityMainBinding binding;\n\
  \    private VideoView videoView;\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        binding\
  \ = ActivityMainBinding.inflate(getLayoutInflater());\n        View view = binding.getRoot();\n\
  \        setContentView(view);\n        configureVideoView();\n    }\n\n    private\
  \ void configureVideoView() {\n        binding.videoView1.setVideoURI(Uri.parse(\"\
  android.resource://\"\n                    + getPackageName() + \"/\" + R.raw.movie));\n\
  \        binding.videoView1.start();\n    }\n}\n```\n\n这段代码的作用是获取布局中 `VideoView`\
  \ 实例的引用，为其分配一个指向位于 `raw` 资源目录中的电影文件的 `URI` 对象，然后开始播放视频。\n\n通过在物理 Android 设备上运行应用程序来测试。应用程序启动后，在视频开始播放之前，缓冲内容可能会出现短暂的延迟（图\
  \ 70-3）。\n\n![](img/as_3.6_video_player_playing.jpg)\n\n图 70-3\n\n这说明了将视频播放集成到 Android\
  \ 应用程序中多么简单。在本示例中到目前为止的所有内容都是通过一个 `VideoView` 实例和三行代码实现的。\n\n## 70.7 为 Video View\
  \ 添加 MediaController\n\n按照 VideoPlayer 应用程序目前的状况，用户没有办法控制播放。如前所述，可以使用 `MediaController`\
  \ 类来实现。要为 `VideoView` 添加控制器，请再次修改 `configureVideoView()` 方法：\n\n```java\npackage\
  \ com.ebookfrenzy.videoplayer;\n\n.\n.\n\nimport android.widget.MediaController;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    private VideoView videoView;\n    private MediaController mediaController;\n\
  \n.\n.\n\n    private void configureVideoView() {\n        binding.videoView1.setVideoURI(Uri.parse(\"\
  android.resource://\"\n                    + getPackageName() + \"/\" + R.raw.movie));\n\
  \        mediaController = new MediaController(this);\n        mediaController.setAnchorView(videoView);\n\
  \        binding.videoView1.setMediaController(mediaController);\n        binding.videoView.start();\n\
  \    }\n}\n```\n\n当应用这些更改后应用程序时，点击 `VideoView` 画布将使媒体控件出现在视频播放上方。这些控件应该包含一个进度条以及快进、后退和播放/暂停按钮。控件从视图中消失后，可以通过再次点击\
  \ `VideoView` 画布随时恢复。只需多三行代码，我们的视频播放器现在就有了如图 70-4 所示的媒体控件：\n\n![](img/as_3.6_video_player_media_controls.jpg)\n\
  \n图 70-4\n\n## 70.8 设置 onPreparedListener\n\n作为视频媒体工作的最后一个示例，活动现在将进一步扩展，以演示配置监听器的机制。在这种情况下，将实现一个监听器，旨在将视频时长作为消息在\
  \ Android `Logcat` 面板中输出。该监听器还将配置视频播放为播放：\n\n```java\npackage com.ebookfrenzy.videoplayer;\n\
  \n.\n.\n\nimport android.util.Log;\nimport android.media.MediaPlayer;\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    private VideoView videoView;\n    private MediaController mediaController;\n\
  \    String TAG = \"VideoPlayer\";\n\n    private void configureVideoView() {\n\
  \        binding.videoView1.setVideoURI(Uri.parse(\"android.resource://\"\n    \
  \                + getPackageName() + \"/\" + R.raw.movie));\n        MediaController\
  \ mediaController = new MediaController(this);\n        mediaController.setAnchorView(videoView);\n\
  \        binding.videoView1.setMediaController(mediaController);\n        binding.videoView1.setOnPreparedListener(new\
  \ MediaPlayer.OnPreparedListener() {\n            @Override\n            public\
  \ void onPrepared(MediaPlayer mp) {\n                mp.setLooping(true);\n    \
  \            Log.i(TAG, \"Duration = \" + binding.videoView1.getDuration());\n \
  \           }\n        });\n        binding.videoView.start();\n    }\n}\n```\n\n\
  现在在视频开始播放之前，Android `Logcat` 面板中将出现所示的消息，视频在结束后将重启：\n\n`11-05 10:27:52.256 12542-12542/com.ebookfrenzy.videoplayer\
  \ I/VideoPlayer: Duration = 13504`\n\n## 70.9 总结\n\nAndroid 设备是交付内容的优秀平台，特别是视频媒体形式。如本章所述，Android\
  \ SDK 提供了两个类（`VideoView` 和 `MediaController`），使得视频集成到 Android 应用程序中变得快速简单，通常只需要几行代码。\n\
  \n## 71 Android 画中画模式\n\n在之前的章节中讨论 Android 的多任务处理时，简单提到了画中画（PiP）模式，但没有进行详细介绍。PiP\
  \ 模式主要用于视频播放，它允许缩小活动屏幕并将其放置在屏幕上的任何位置。在这种状态下，活动继续运行，并且无论设备上运行任何其他活动，窗口都保持可见。这允许用户例如在检查电子邮件或处理电子表格等任务时继续观看视频播放。\n\
  \n本章将提供画中画模式的概述，然后在下一章中为 VideoPlayer 项目添加画中画支持。\n\n### 71.1 画中画功能\n\n正如本章后面部分解释以及下一章演示的那样，通过运行应用程序内部的\
  \ API 调用进入 PiP 模式。进入 PiP 模式时，可以指定配置选项来控制 PiP 窗口的宽高比例，并定义包含在窗口中的活动屏幕区域。例如，图 71-1\
  \ 显示了画中画模式的视频播放活动：\n\n![](img/Image24273.jpg)\n\n图 71-1\n\n\n\n\n\n图 71-2 显示了用户点击后的画中画（PiP）模式窗口。在此模式下，窗口显示得更大，并在中心包含一个全屏操作按钮，点击该按钮会将窗口恢复到全屏模式；右上角有一个退出按钮，用于关闭窗口并将应用程序置于后台。添加到\
  \ PiP 窗口的任何自定义操作在显示此模式时也会显示在屏幕上。如图图 71-2 所示，PiP 窗口包含了自定义的播放和暂停操作按钮：\n\n![](img/Image24363.jpg)\n\
  \n图 71-2\n\n本章剩余部分将概述如何在 Android 应用内部启用和管理 PiP 模式。\n\n## 71.2 启用画中画模式\n\nPiP 模式目前仅支持运行\
  \ `API 26`：Android 8.0（Oreo）或更高版本的设备。实现 PiP 模式的第一步是在项目的清单文件（manifest）中启用它。通过向每个需要支持\
  \ PiP 的 activity 元素添加以下行，可以按 activity 配置 PiP 模式：\n\n```xml\n<activity android:name=\"\
  .MyActivity\"\n    android:supportsPictureInPicture=\"true\"\n    android:configChanges=\n\
  \        \"screenSize|smallestScreenSize|screenLayout|orientation\"\n    <intent-filter>\n\
  \        <action android:name=\"android.intent.action.MAIN\" />\n        <category\
  \ android:name=\"android.intent.category.LAUNCHER\" />\n    </intent-filter>\n</activity>\n\
  ```\n\n`android:supportsPictureInPicture` 条启用了 activity 的 PiP 功能，而 `android:configChanges`\
  \ 属性通知 Android 该 activity 能够处理布局配置更改。如果没有此设置，每次当 activity 进入或退出 PiP 模式时，activity\
  \ 都会重启，导致切换期间视频从头重新播放。\n\n## 71.3 配置画中画参数\n\nPiP 行为通过使用 `PictureInPictureParams`\
  \ 类定义，可以使用 `Builder` 类如下所示创建其实例：\n\n```java\nPictureInPictureParams params =\n \
  \   new PictureInPictureParams.Builder().build();\n```\n\n上述代码创建了一个定义了特殊参数的默认 `PictureInPictureParams`\
  \ 实例。还可以使用以下可选方法调用来自定义参数：\n\n- `setActions()` – 用于定义当 activity 处于 PiP 模式时从 PiP 窗口内可以执行的操作。操作将在本章稍后部分详细介绍。\n\
  - `setAspectRatio()` – 声明 PiP 窗口显示的首选宽高比。此方法接受一个 `Rational` 对象作为参数，该对象包含高度/宽度的比例。\n\
  - `setSourceRectHint()` – 接收一个 `Rect` 对象作为参数，定义要在 PiP 窗口中显示的 activity 屏幕区域。\n\n\
  例如，以下代码在 `PictureInPictureParams` 对象中配置了宽高比和操作参数。在宽高比的情况下，它是使用 `VideoView` 实例的宽度和高度维度定义的：\n\
  \n```java\nRational rational = new Rational(videoView.getWidth(),\n            \
  \                        videoView.getHeight());\nPictureInPictureParams params\
  \ =\n    new PictureInPictureParams.Builder()\n              .setAspectRatio(rational)\n\
  \              .setActions(actions)\n              .build();\n```\n\n一旦定义，可以使用 `setPictureInPictureParams()`\
  \ 方法随时设置 PiP 参数，如下所示：\n\n```java\nsetPictureInPictureParams(params);\n```\n\n在进入\
  \ PiP 模式时也可以指定参数。\n\n## 71.4 进入画中画模式\n\n通过调用 `enterPictureInPictureMode()` 方法并传递\
  \ `PictureInPictureParams` 对象，可以将 activity 进入画中画模式：\n\n```java\nenterPictureInPictureMode(params);\n\
  ```\n\n如果不需要参数，只需按照上一节所述创建一个默认的 `PictureInPictureParams` 对象即可。如果之前已使用 `setPictureInPictureParams()`\
  \ 方法设置了参数，则这些参数将与调用 `enterPictureInPictureMode()` 方法时指定的参数进行合并。\n\n## 71.5 检测画中画模式变化\n\
  \n当 activity 进入 PiP 模式时，隐藏任何不必要的视图非常，以确保只有视频可见。当 activity 重新进入屏幕模式时，需要恢复任何隐藏的界面组件。这些以及其他模式切换任务可以通过重写\
  \ `onPictureInPictureChanged()` 方法来完成。当该方法添加到 activity 时，它在每次 activity 在 PiP 和屏幕模式之间切换时都会被调用，并传递一个布尔值，表示\
  \ activity 当前是否处于 PiP 模式：\n\n```java\n@Override\npublic void onPictureInPictureChanged(boolean\
  \ isInPictureMode) {\n    super.onPictureInPictureChanged(isInPictureMode);\n  \
  \  if (isInPictureMode) {\n        // 进入画中画模式\n    } else {\n        // 进入全屏模式\n\
  \    }\n}\n```\n\n## 71.6 添加画中画操作\n\n当用户点击 PiP 窗口时，画中画操作将以图标的形式出现。PiP 的实现是一个多步骤过程，从实现一种让\
  \ PiP 窗口通知 activity 已选择操作的方法开始。通过设置广播接收器（broadcast receiver），然后创建 `Intent` 和 `PendingIntent`\
  \ 对象来实现。以下代码演示了 `Intent`、`PendingIntent` 和 `RemoteAction` 对象的创建，以及随后应用于 activity\
  \ 的 `PictureInPictureParams` 实例：\n\n```java\nArrayList<RemoteAction> actions = new\
  \ ArrayList<>();\nIntent actionIntent = new Intent(\"MY_PIP_ACTION\");\nfinal PendingIntent\
  \ pendingIntent =\n    PendingIntent.getBroadcast(MyActivity.this, REQUEST_CODE,\
  \ actionIntent, FLAG_IMMUTABLE);\n\nfinal Icon icon = Icon.createResource(MyActivity.this,\
  \ R.drawable.action_icon);\n\nRemoteAction remoteAction = new RemoteAction(icon,\n\
  \    \"My Action Title\",\n    \"My Description\",pendingIntent);\n\nactions.add(remoteAction);\n\
  \nPictureInPictureParams params =\n    new PictureInPictureParams.Builder()\n  \
  \            .setActions(actions)\n              .build();\n\nsetPictureInPictureParams(params);\n\
  ```\n\n## 71.7 总结\n\n画中画模式是 Android 8.0 引入的一项多任务功能，专门设计用于用户在其他应用程序和 activity 中执行任务时，视频可以在小窗口中继续播放。在使用\
  \ PiP 模式之前，必须先在清单文件中为支持 PiP 的 activity 启用它。\n\nPiP 模式行为通过 `PictureInPictureParams`\
  \ 类的实例进行配置，并在 activity 内部调用 `enterPictureInPictureMode()` 方法启动。在 PiP 模式下，应只有视频播放可见，因此需要隐藏其他用户界面元素，直到选择全屏模式。\n\
  \n\n\n\n当用户点击 PiP 窗口时，PiP 操作将以图标的形式叠加在窗口上。选择这些操作时，它们会触发 activity 内部的行为。PiP 窗口通过广播接收器和等待意图（pending\
  \ intents）通知 activity。\n\n# 72. Android 画中画教程\n\n延续上一章节，本章将对现有的 VideoPlayer 项目进行增强，添加对画中画（PiP）的支持，包括检测\
  \ PiP 模式变化以及添加一个用于显示当前正在播放视频信息的 PiP 操作。\n\n## 72.1 在 Manifest 中添加画中画支持\n\n在 Android\
  \ 应用项目单元添加 PiP 支持的第一步是在项目的 Manifest 文件中启用它。打开 `manifests` -> `AndroidManifest.xml`\
  \ 文件并修改 `activity` 元素以启用 PiP 支持：\n\n```xml\n<activity android:name=\".MainActivity\"\
  \n  android:supportsPictureInPicture=\"true\"\n  android:configChanges=\"screenSize|smallestScreenSize|screenLayout|orientation\"\
  \n  android:exported=\"true\">\n    <intent-filter>\n        <action android:name=\"\
  android.intent.action.MAIN\" />\n        <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n    </intent-filter>\n</activity>\n```\n\n## 72.2 添加画中画按钮\n\n按照目前的设计，VideoPlayer\
  \ activity 的布局仅包含一个 VideoView 实例。现在将向布局中添加一个按钮，用于切换到 PiP 模式。将 `activity_main.xml`\
  \ 文件加载到布局编辑器中，从调色板拖入一个 `Button` 对象到布局中，使其位置如图 72-1 所示：\n\n![](img/as_4.1_video_plater_pip_ui.jpg)\n\
  图 72-1\n\n更改按钮上的文本显示为“Enter PiP Mode”（进入 PiP 模式），将其提取为名为 `enter_pip_mode` 的资源。在继续下一步之前，将按钮的\
  \ ID 改为 `pipButton` 并配置按钮调用名为 `enterPipMode` 的方法。\n\n## 72.3 进入画中画模式\n\n现在需要将 `enterPipMode`\
  \ onClick 回调方法添加到 `MainActivity.java` 类文件中。找到该文件，在代码编辑器中打开并按如下添加此方法：\n\n```java\n\
  import android.app.PictureInPictureParams;\nimport android.util.Rational;\n\npublic\
  \ void enterPipMode(View view) {\n    Rational rational = new Rational(binding.videoView1.getWidth(),\n\
  \            binding.videoView1.getHeight());\n    PictureInPictureParams params\
  \ =\n            new PictureInPictureParams.Builder()\n                .setAspectRatio(rational)\n\
  \                .build();\n    binding.pipButton.setVisibility(View.INVISIBLE);\n\
  \    binding.videoView1.setMediaController(null);\n    enterPictureInPictureMode(params);\n\
  }\n```\n\n该方法首先获取 `Button` 视图的引用，然后创建一个包含 `VideoView` 宽度和高的 `Rational` 对象。接着使用 `PictureInPictureParams.Builder`\
  \ 创建一组画中画参数，并将 `Rational` 对象作为视频播放的宽高比传递。由于视频在 PiP 模式下不需要显示按钮，因此将其设置为不可见。视频播放控件也会被隐藏，以确保视频视图在\
  \ PiP 模式下不会被遮挡。\n\n在运行 Android 版本 8 或更高版本的设备或模拟器上编译并运行应用，并在视频开始播放前点击 PiP 模式按钮。视频播放应该缩小并显示在\
  \ PiP 窗口中，如图 72-2 所示：\n\n![](img/as_3.6_video_player_action_bar.jpg)\n图 72-2\n\n\
  尽管视频现在于 PiP 窗口中播放，但大部分视图被标准的 Android  遮挡了。要移除它需要更改 activity 的应用程序主题样式。在 Android\
  \ Studio 中，找到并编辑 `app` -> `res` -> `values` -> `themes.xml` 文件，修改 `AppTheme` 元素使用\
  \ `NoActionBar` 主题：\n\n```xml\n<resources xmlns:tools=\"http://schemas.android.com/tools\"\
  >\n    <!-- Base application theme. -->\n    <style name=\"Theme.VideoPlayer\" parent=\"\
  Theme.MaterialComponents.DayNight.NoActionBar\">\n        <!-- Primary brand color.\
  \ -->\n        <item name=\"colorPrimary\">@color/purple_500</item>\n        <item\
  \ name=\"colorPrimaryVariant\">@color/purple_700</item>\n    </style>\n</resources>\n\
  ```\n\n对 `themes.xml (night)` 资源重复此步骤。编译并运行应用，将视频播放进入 PiP 模式，并注意操作栏不再出现在窗口中：\n\n\
  ![](img/as_3.6_video_player_action_bar.jpg)\n图 3-点击 PiP 窗口使其放大，然后点击窗口中心出现的全屏标记内。尽管\
  \ activity 回到了全屏模式，但请注意按钮和媒体控件仍然处于隐藏状态。显然，需要在项目中添加一些代码来检测 activity 内部何时发生了 PiP 模式切换。\n\
  \n## 72.4 检测画中画模式\n\n如上一节所述，PiP 模式的变化是通过重写 activity 内部的 `onPictureInPicture()` 方法来检测的。在这种情况下，需要编写一个方法来检测\
  \ activity 进入或退出 PiP 模式，并采取相应行动重新激活 PiP 按钮和播放控件。在 `MainActivity.java` 文件中添加此方法：\n\
  \n```java\n@Override\npublic void onPictureInPicture(boolean isInPictureMode) {\n\
  \    super.onPictureInPicture(isInPictureMode);\n    if (isInPictureMode) {\n  \
  \  } else {\n        binding.pipButton.setVisibility(View.VISIBLE);\n        binding.videoView1.setController(mediaController);\n\
  \    }\n}\n```\n\n当方法被调用时，会传入一个指示是否处于 PiP 模式的布尔值。上述方法通过检查此值来决定是否显示按钮。\n\n## 72.5\
  \ 添加广播接收器\n\n项目的最后一步是为 PiP 窗口添加一个操作。该操作的目的是显示包含正在播放视频名称的 Toast 。这需要在 PiP 窗口与 activity\
  \ 之间进行通信。实现这一目标的最简单方法之一是在 activity 内部实现广播接收器，并使用等待意图从 PiP 窗口向 activity 发送消息。每次 activity\
  \ 进入 PiP 模式时都需要执行这些步骤，因此需要在 `onPictureInPicture()` 方法中添加代码。现在找到该方法，开始添加一些代码来创建意图过滤器并初始化广播接收器：\n\
  \n```java\nimport android.content.BroadcastReceiver;\nimport android.content.Context;\n\
  import android.content.IntentFilter;\nimport android.widget.Toast;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private BroadcastReceiver receiver;\n\
  \n    @Override\n    public void onPictureInPicture(boolean isInPictureMode) {\n\
  \        super.onPictureInPicture(isInPictureMode);\n        if (isInPictureMode)\
  \ {\n            IntentFilter filter = new IntentFilter();\n            filter.addAction(\"\
  com.ebookfrenzy.videoplayer.VIDEO_INFO\");\n            receiver = new BroadcastReceiver()\
  \ {\n                @Override\n                public void onReceive(Context context,\
  \ Intent intent) {\n                    Toast.makeText(context, \"Favorite Home\
  \ Movie Clips\", Toast.LENGTH_LONG).show();\n                }\n            };\n\
  \            registerReceiver(receiver, filter);\n        } else {\n```\n\n\n\n\n\
  ```java\nbinding.pipButton.setVisibility(View.VISIBLE);\nbinding.videoView1.setMediaController(mediaController);\n\
  if (receiver != null) {\n    unregisterReceiver(receiver);\n}\n```\n\n## 72.6 添加\
  \ PiP 动作\n\n在实现广播接收器后，下一步是创建一个 `RemoteAction` 对象，并配置一个图像来表示 PiP 窗口内的动作。在本示例的目的下，将使用一个名为\
  \ `ic_info_24dp.xml` 的图像图标文件。该文件可以在从以下 URL 下载的源码压缩包的 `project_icons` 文件夹中找到：\n\n\
  [`www.ebookfrenzy.com/retail/chipmunkjava/index.php`](https://www.ebookfrenzy.com/retail/chipmunkjava/index.php)\n\
  \n找到此图标文件，将其复制并粘贴到 Project 工具窗口中的 `app -> res -> drawables` 文件夹内：\n\n![](img/Image24492.jpg)\n\
  \n图 72-4\n\n下一步是创建一个将发送给广播接收器的 `Intent`。然后，需要将此意 封装在 `PendingIntent` 对象中，以便在用户点击\
  \ PiP 窗口中的动作按钮时触发该意图。\n\n编辑 `MainActivity.java` 文件，添加一个用于创建 `Intent` 和 `PendingIntent`\
  \ 对象的方法如下：\n\n```java\nimport android.app.PendingIntent;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private static final int REQUEST_CODE = 101;\n\
  \n    private void createPipAction() {\n        Intent actionIntent =\n        \
  \    new Intent(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\");\n        final PendingIntent\
  \ pendingIntent =\n            PendingIntent.getBroadcast(MainActivity.this,\n \
  \               REQUEST_CODE, actionIntent, FLAG_IMMUTABLE);\n    }\n}\n```\n\n\
  现在 `Intent` 对象和包含它的 `PendingIntent` 实例都已创建，需要创建一个 `RemoteAction` 对象，其中包含在 PiP 窗口中显示的图标以及\
  \ `PendingIntent` 对象。在 `createPipAction()` 方法中继续添加以下代码：\n\n```java\nimport android.app.RemoteAction;\n\
  import android.graphics.drawable.Icon;\nimport java.util.ArrayList;\n\nprivate void\
  \ createPipAction() {\n    final ArrayList<RemoteAction> actions = new ArrayList<>();\n\
  \    Intent actionIntent =\n        new Intent(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\"\
  );\n    final PendingIntent pendingIntent = PendingIntent.getBroadcast(\n      \
  \  MainActivity.this,\n        REQUEST_CODE, actionIntent, FLAG_IMMUTABLE);\n  \
  \  final Icon icon =\n        Icon.createWithResource(MainActivity.this,\n     \
  \       R.drawable.ic_info_24dp);\n    RemoteAction remoteAction = new RemoteAction(icon,\
  \ \"Info\",\n        \"Video Info\", pendingIntent);\n    actions.add(remoteAction);\n\
  }\n```\n\n现在需要创建一个包含该动作的 `PictureInPictureParams` 对象并应用参数，以便该动作出现在 PiP 窗口内显示：\n\n\
  ```java\nprivate void createPipAction() {\n    final ArrayList<RemoteAction> actions\
  \ = new ArrayList<>();\n    Intent actionIntent =\n        new Intent(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\"\
  );\n    final PendingIntent pendingIntent = PendingIntent.getBroadcast(\n      \
  \  MainActivity.this,\n        REQUEST_CODE, actionIntent, FLAG_IMMUTABLE);\n  \
  \  final Icon icon =\n        Icon.createWithResource(MainActivity.this,\n     \
  \       R.drawable.ic_info_24dp);\n    RemoteAction remoteAction = new RemoteAction(icon,\
  \ \"Info\",\n        \"Video Info\", pendingIntent);\n    actions.add(remoteAction);\n\
  \    PictureInPictureParams params =\n        new PictureInPictureParams.Builder()\n\
  \            .setActions(actions)\n            .build();\n    setPictureInPictureParams(params);\n\
  }\n```\n\n在测试动作之前的最后一个任务是在当 activity 进入 PiP 模式时调用 `createPipAction()` 方法：\n\n```java\n\
  @Override\npublic void onPictureInModeChanged(boolean isInPictureInMode) {\n   \
  \ super.onPictureInModeChanged(isInPictureInMode);\n    registerReceiver(receiver,\
  \ filter);\n    createPipAction();\n} else {\n    binding.pipButton.setVisibility(View.VISIBLE);\n\
  \    binding.videoView1.setMediaController(mediaController);\n}\n```\n\n## 72.7\
  \ 测试画中画动作\n\n再次构建并运行应用，将 activity 于 PiP 模式。点击 PiP 窗口，使新的动作按钮如图 72-5 所示出现：\n\n![](img/as_3.6_video_player_action_button.jpg)\n\
  \n图 72-5\n\n点击动作按钮并等待 Toast 消息出现显示视频名称：\n\n![](img/as_3.6_video_player_action_toast.jpg)\n\
  \n图 72-6\n\n## 72.8 总结\n\n本章演示了如何在 Android Studio 应用项目中添加画中画支持，包括启用和进入 PiP 模式以及\
  \ PiP 动作的实现。这包含了使用广播接收器和待处理意图来实现 PiP 窗口与 activity 之间的通信。\n\n## 73. 在 Android 中请求运行时权限\n\
  \n在前面的章节中创建的许多示例项目中，已对 `AndroidManifest.xml` 文件进行了修改，以请求执行任务所需的权限。在某些情况下，为了允许应用下载并显示网页，请求了网络访问权限。在此之前的每个案例中，只需在清单文件中添加权限即可让用户执行指定任务。\n\
  \n然而，在 Android 6.0 或更高版本上，某些权限需要额外的步骤才能运行应用。其中第一个所谓的“危险”权限将在下一章中遇到。在此点之前，本章将概述在最新版本的\
  \ Android 上请求此类权限的步骤。\n\n### 73.1 理解普通权限和危险权限\n\nAndroid 通过要求用户授予应用执行某些任务的权限来强制安全性。在引入\
  \ Android 6 之前，权限始终是在应用安装时寻求的。图 73-1 显示了通过 Google Play 安装应用时寻求各种权限的典型界面。\n\n![](img/Image2454.jpg)\n\
  \n图 73-1\n\n许多类型的权限这种场景对于 Android 6.0 或更高版本的应用仍然适用。这些权限被称为 `普通权限`，在安装时由用户接受。第二类型权限被称为\
  \ `危险权限`，也必须以相同的方式在清单文件中声明，但必须在应用程序首次运行时请求用户。当发出此类请求时，它将以图 73-2 所示的对话框形式出现：\n\n\
  ![](img/Image24343.jpg)\n\n图 73-2\n\n危险权限完整列表包含在表 73-1 中：\n\n| 权限组 | 权限 |\n| :---\
  \ | :--- |\n| 日历 | `READ_CALENDARWRITE_CALENDAR` |\n| 相机 | `CAMERA` |\n| 联系人 | `READ_CONTACTSWRITE_CONTACTSGET_ACCOUNTS`\
  \ |\n| 位置 | `ACCESS_FINE_LOCATIONACCESS_COARSE_LOCATION` |\n| 麦克风 | `RECORD_AUDIO`\
  \ |\n| 电话 | `READ_PHONE_STATECALL_PHONEREAD_CALL_LOGWRITE_CALL_LOGADD_VOICEMAILUSE_SIPPROCESS_OUTGOING_CALLS`\
  \ |\n| 传感器 | `BODY_SENSORS` |\n| 短信 | `SEND_SMSRECEIVE_SMSREAD_SMSRECEIVE_WAP_PUSHRECEIVE_MMS`\
  \ |\n| 存储 | `READ_EXTERNAL_STORAGEWRITE_EXTERNAL_STORAGE` |\n\n表 73-1\n\n## 73.2\
  \ 创建权限示例项目\n\n\n\n\n\n从欢迎屏幕上选择 New Project 选项，在弹出的新项目对话框中，点击 Next 按钮之前选择 Empty Activity\
  \ 模板。\n\n在 `Name` 字段中输入 `PermissionDemo`，并指定 `com.ebookfrenzy.permissiondemo` 为包包名。在点击\
  \ `Finish` 按钮之前，将 `Minimum API level` 设置更改为 `API 26: Android 8.0 (Oreo)`，并将 `Language`\
  \ 菜单更改为 `Java`。\n\n## 7.3 检查权限\n\nAndroid Support Library 包含许多方法，用于在 Android 应用的代码中查找和管理危险权限。无论应用运行在哪个版本的\
  \ Android 上，这些 API 调用都将安全地进行，但只有在 Android 6.0 或更高版本的系统上执行时，它们才会执行有意义的任务。\n\n在应用尝试使用需要批准危险权限的功能之前，无论之前是否已授予权限，代码都必须检查该权限是否已授予。可以通过调用\
  \ `ContextCompat` 类的 `checkSelfPermission()` 方法来实现，并将当前活动的引用和请求的权限作为参数传递。该方法将检查权限之前是否已授予，并返回与\
  \ `PackageManager.PERMISSION_GRANTED` 或 `PackageManager.PERMISSION_DENIED` 匹配的整数值。\n\
  \n在示例项目的 `MainActivity.java` 文件中，修改代码以检查是否已授予应用录音的权限：\n\n```java\npackage com.ebookfrenzy.permissiondemoactivity;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport androidx.core.content.ContextCompat;\n\
  import android.os.Bundle;\nimport android.Manifest;\nimport android.content.pm.PackageManager;\n\
  import android.util.Log;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private static final String TAG = \"PermissionDemo\";\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_permission_demo);\n        setupPermissions();\n\
  \    }\n\n    private void setupPermissions() {\n        int permission = ContextCompat.checkSelfPermission(this,\n\
  \                Manifest.permission.RECORD_AUDIO);\n\n        if (permission !=\
  \ PackageManager.PERMISSION_GRANTED) {\n            Log.i(TAG, \"Permission to record\
  \ denied\");\n        }\n    }\n}\n```\n\n在运行早于 Android 6.0 版本的设备或模拟器上运行应用，并检查 Android\
  \ Studio 中的 Logcat 输出。应用启动后，Logcat 输出应包含“Permission to record denied”消息。\n\n编辑 `AndroidManifest.xml`\
  \ 文件（位于 Project 工具窗口的 `app -> manifests` 路径下），并添加以下行来请求录音权限：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.permissiondemoactivity\" >\n    <uses-permission\
  \ android:name=\"android.permission.RECORD_AUDIO\" />\n    <application\n      \
  \  android:allowBackup=\"true\"\n        android:icon=\"@mipmap/ic_launcher\"\n\
  \        android:label=\"@sxtring/app_name\"\n        android:supportsRtl=\"true\"\
  \n        android:theme=\"@style/AppTheme\" >\n        <activity android:name=\"\
  .MainActivity\" >\n            <intent-filter>\n                <action android:name=\"\
  android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n再次编译并运行应用，注意这次没有出现权限被拒绝的消息。显然，在旧版本 Android 上请求此权限需要完成的所有工作都已完成。在运行 Android\
  \ 6.0 或更高版本的设备或模拟器上运行应用，并注意，尽管在 manifest 中添加了权限，检查仍然报告权限被拒绝。这是因为 Android 6 及以后的版本要求应用也必须手动请求危险权限。\n\
  \n## 7.4 在运行时请求权限\n\n权限请求是通过调用 `ActivityCompat` 类的 `requestPermissions()` 方法发出的。当调用此方法时，权限请求将进行异步处理，并在任务完成后调用一个名为\
  \ `onRequestPermissions()` 的方法。`requestPermissions()` 方法将当前活动的引用连同所请求权限的标识符以及一个请求码作为参数。请求码可以是任何整数，并将用于标识是哪个请求触发了对\
  \ `onRequestPermissions()` 方法的调用。修改 `MainActivity.java` 文件以声明一个请求码，并在权限检查失败时请求录音权限：\n\
  \n```java\nimport androidx.core.app.ActivityCompat;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private static final String TAG = \"PermissionDemo\"\
  ;\n    private static final int RECORD_REQUEST_CODE = 101;\n\n    @Override\n  \
  \  private void setupPermissions() {\n        int permission = ContextCompat.checkSelfPermission(this,\n\
  \                Manifest.permission.RECORD_AUDIO);\n        if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n            Log.i(TAG, \"Permission to record denied\");\n            makeRequest();\n\
  \        }\n    }\n\n    protected void makeRequest() {\n        ActivityCompat.requestPermissions(this,\n\
  \                new String[]{Manifest.permission.RECORD_AUDIO},\n             \
  \   RECORD_REQUEST_CODE);\n    }\n}\n```\n\n接下来，实现 `onRequestPermissions()` 方法，其内容如下：\n\
  \n```java\n@Override\npublic void onRequestPermissionsResult(int requestCode,\n\
  \        String permissions[], int[] grantResults) {\n    super.onRequestPermissionsResult(requestCode,\
  \ permissions, grantResults);\n    switch (requestCode) {\n        case RECORD_REQUEST_CODE:\
  \ {\n            if (grantResults.length == 0\n                    || grantResults[0]\
  \ != PackageManager.PERMISSION_GRANTED) {\n                Log.i(TAG, \"Permission\
  \ has been denied by user\");\n            } else {\n                Log.i(TAG,\
  \ \"Permission has been granted by user\");\n            }\n        }\n    }\n}\n\
  ```\n\n在 Android 6 或更高版本的模拟器或设备上编译并运行应用，注意会出现一个请求录音权限的对话框，如图 73-3 所示\n\n![](img/as_permission_dialog.jpg)\n\
  \n图 73-3\n\n点击“While the app”按钮，检查 Logcat 面板是否出现了“Permission has been granted by\
  \ user”消息。\n\n一旦用户授予了请求的权限，在后续的应用调用中，`checkSelfPermission()` 方法将返回 `PERMISSION_GRANTED`\
  \ 结果，直到用户卸载并重新安装应用，或在设置中更改了应用的权限。\n\n\n\n\n\n最好将解释包含在一个独立的对话框中，该对话框可以在向用户展示请求对话框之前显示。这引发了一个问题：何时显示此解释对话框？Android\
  \ 文档建议，只有在用户之前拒绝过权限时才显示解释对话框，并提供一种方法来识别这种情况。\n\n调用 `ActivityCompat` 类的 `shouldShowRequestPermissionRationale()`\
  \ 方法，如果用户之前拒绝过对指定权限的请求，将返回 `true`；如果之前未请求过请求，则返回 `false`。在结果为 `true` 的情况下，应用应该显示一个包含权限需求说明的对话框，一旦用户阅读并关闭了对话框，就应该重复权限请求。\n\
  \n要向示例应用中添加此功能，请修改 `onCreate()` 方法使其内容如下：\n\n```java\nimport android.app.AlertDialog;\n\
  import android.content.DialogInterface;\n\nprivate void setupPermissions() {\n \
  \   int permission = ContextCompat.checkSelfPermission(this,\n            Manifest.permission.RECORD_AUDIO);\n\
  \    if (permission != PackageManager.PERMISSION_GRANTED) {\n        Log.i(TAG,\
  \ \"Permission to record denied\");\n        if (ActivityCompat.shouldShowRequestPermissionRationale(this,\n\
  \                Manifest.permission.RECORD_AUDIO)) {\n            AlertDialog.Builder\
  \ builder =\n                    new AlertDialog.Builder(this);\n            builder.setMessage(\"\
  Permission to access the microphone is required for this app to record audio.\"\
  )\n                    .setTitle(\"Permission required\");\n            builder.setPositiveButton(\"\
  OK\",\n                    new DialogInterface.OnClickListener() {\n           \
  \             public void onClick(DialogInterface dialog, int id) {\n          \
  \                  makeRequest();\n                        }\n                 \
  \   });\n            AlertDialog dialog = builder.create();\n            dialog.show();\n\
  \        } else {\n            makeRequest();\n        }\n    }\n}\n```\n\n该方法仍然检查权限是否已授予，但现在还会识别是否需要显示说明。如果用户之前拒绝了请求，则会显示一个包含说明和\
  \ OK 按钮的对话框，并在按钮上配置了一个监听器，当点击按钮时调用 `makeRequest()` 方法。如果之前没有请求，代码将直接跳转到请求权限。\n\n\
  ### 73.6 测试权限应用\n\n在执行测试的 Android 6 或更高版本的设备或模拟器会话上，启动“设置”应用，选择“应用”选项，并滚动到选择 PermissionDemo\
  \ 应用。在应用设置屏幕上，点击“卸载”按钮从设备中移除该应用。\n\n再次运行应用，当权限请求对话框出现时，点击“拒绝”按钮。停止并重启应用，并验证说明对话框是否出现。点击“确定”按钮，当权限请求对话框出现时，点击“在使用应用期间”按钮。\n\
  \n返回“设置”应用，选择“应用”选项，并再次从列表中选择 PermissionDemo 应用。一旦列出应用设置，验证“权限”部分是否列出了“麦克风”权限：\n\
  \n![](img/as_permission_microphone.jpg)\n\n*图 73-4*\n\n## 73.7 总结\n\n在 Android 6.0\
  \ 引入之前，应用请求访问某些功能的权限所需的唯一步骤是在应用程序的 manifest 文件中添加适当的行。用户将在安装应用时被提示批准该权限。\n\n###\
  \ 74. 使用 MediaPlayer 和 MediaRecorder 进行 Android 音频录制和播放\n\n#### 74.1 播放音频\n\n`MediaPlayer`\
  \ 类为实现音频播放提供了一个更简单的接口。与 `MediaPlayer` 类相关的某些方法子如下：\n\n- `create()`：调用以创建该类的新实例，并传递要播放音频的\
  \ Uri。\n- `setDataSource()`：设置要播放音频的源。\n- `prepare()`：指示播放器准备开始播放。\n- `start()`：开始播放。\n\
  - `pause()`：暂停播放。可以通过 `resume()` 继续播放。\n- `stop()`：停止播放。\n- `setVolume()`：接受两个浮点参数，指定左、右通道的音量。\n\
  - `resume()`：恢复之前暂停的播放会话。\n- `reset()`：重置媒体播放器的状态。本质上是将实例重置为未初始化状态。至少，重置后的播放器需要重新设置数据源并调用\
  \ `prepare()` 方法。\n- `release()`：在不再需要播放器实例时调用。此方法确保播放器持有的任何资源都被释放。\n\n在典型的实现中，应用将实例化\
  \ `MediaPlayer` 类的实例，设置音频源，然后调用 `prepare()` 之后调用 `start()`。例如：\n\n```java\nMediaPlayer\
  \ mediaPlayer = new MediaPlayer();\nmediaPlayer.setDataSource(\"https://www.yourcompany.com/myaudio.mp3\"\
  );\nmediaPlayer.prepare();\nmediaPlayer.start();\n```\n\n#### 74.2 使用 MediaRecorder\
  \ 类录制音频和视频\n\n与音频播放一样，录制可以使用多种技术进行。一种方案是使用 `MediaRecorder` 类，它与 `MediaPlayer` 类一样，提供了许多用于录制音频的方法：\n\
  \n- `setAudioSource()`：指定录制音频的源（对于设备麦克风，这通常是 `MediaRecorder.AudioSource.MIC`）。\n\
  - `setVideoSource()`：指定录制视频的源（例如 `MediaRecorder.VideoSource.CAMERA`）。\n- `setOutputFormat()`：指定录制的音频或视频存储的格式（例如\
  \ `MediaRecorder.OutputFormat.AAC_ADTS`）。\n- `setAudioEncoder()`：指定用于录制音频的音频编码器（例如\
  \ `MediaRecorder.AudioEncoder.AAC`）。\n- `setOutputFile()`：配置录制音频或视频存储的文件路径。\n- `prepare()`：准备\
  \ `MediaRecorder` 实例以开始录制。\n- `start()`：开始录制过程。\n\n\n\n\n\n- `stop()` – 停止录制过程。一旦录制机停止，在重新启动之前需要对其完全重新配置和准备。\n\
  - `reset()` – 重置录制机。实例在重新启动之前需要进行完全重新配置和准备。\n- `release()` – 当录制机实例不再需要时调用此方法。此方法确保实例持有的所有资源都被释放。\n\
  \n使用此类的典型实现将设置源、输出、编码格式以及输出文件。然后将调用 `prepare()` 和 `start()` 方法。当录制结束时，将调用 `stop()`\
  \ 方法，随后调用 `reset()` 方法。当应用程序不再需要录制机实例时，建议调用 `release()` 方法：\n\n```java\nMediaRecorder\
  \ mediaRecorder = new MediaRecorder();\n\nmediaRecorder.setAudioSource(MediaRecorder.AudioSource.MIC);\n\
  \nmediaRecorder.setOutputFormat(MediaRecorder.OutputFormat.AAC_ADTS);\n\nmediaRecorder.setAudioEncoder(MediaRecorder.AudioEncoder.AAC);\n\
  \nmediaRecorder.setOutputFile(audioFilePath);\n\nmediaRecorder.prepare();\n\nmediaRecorder.start();\n\
  \nmediaRecorder.stop();\n\nmediaRecorder.reset();\n\nmediaRecorder.release();\n\
  ```\n\n要录制音频，应用程序的清单文件必须包含 `android.permission.RECORD_AUDIO` 权限：\n\n```xml\n<uses-permission\
  \ android:name=\"android.permission.RECORD_AUDIO\" />\n```\n\n正如标题为 \"在 Android\
  \ 中请求运行时权限”的章节所述，访问麦克风属于危险权限类别。因此，为了支持 Android 6，在应用程序启动时必须对麦克风访问进行特定请求，其步骤将在本章稍后介绍。\n\
  \n## 74.3 关于示例项目\n\n本章的剩余部分将创建一个示例应用程序，旨在演示如何使用 `MediaPlayer` 和 `MediaRecorder`\
  \ 类在 Android 设备上实现音频的录制和播放。\n\n在开发使用特定硬件功能的应用程序（以麦克风为例）时，在尝试代码尝试访问之前检查该功能的可用性至关重要。因此，本章创建的应用程序还将包含检测设备是否存在麦克风的代码。\n\
  \n完成后，该应用程序将提供一个非常简单的界面，旨在允许用户录制和播放音频。录制的音频需要存储在设备上的音频文件中。既然如此，本教程还将简要探讨使用 SD 卡存储的机制。\n\
  \n## 74.4 创建 AudioApp 项目\n\n从欢迎屏幕选择新项目（New Project）选项，在弹出的新项目对话框中，在点击下一步（Next）按钮之前选择空活动（Empty\
  \ Activity）模板。\n\n在 `Name` 字段输入 `AudioApp` 并指定 `com.ebookfrenzy.audioapp` 为包名。在点击完成（Finish）按钮之前，将最小\
  \ API 级别设置改为 `API 26`：Android 8.0 (Oreo)，并将语言菜单设置为 `Java`。按照节 11.8 将项目迁移到视图绑定 中概述的步骤为项目添加视图绑定支持。\n\
  \n## 74.5 设计用户界面\n\n创建新项目后，从 Project 工具窗口中选择 `activity_main.xml` 文件，并在 Design 模式下的\
  \ Layout 编辑器工具中选择“Hello World!” `TextView` 并将其从布局中删除。\n\n将三个 `Button` 视图拖放到布局中。按钮的位置对于本示例并不重要，图\
  \ 74-1 显示了一个使用垂直链的建议布局。\n\n配置按钮以显示 Play、Record 和 Stop 的字符串资源，并分别为它们分配 ID：`playButton`、`recordButton`\
  \ 和 `stopButton`。\n\n选择 Play 按钮，并在属性（Attributes）面板中配置 `onClick` 属性，以便在用户选择时调用名为\
  \ `playAudio` 的方法。重复这些步骤以配置其余按钮，分别调用名为 `recordAudio` 和 `stopAudio` 的方法。\n\n![](img/as_3.5_audio_ui.jpg)\n\
  图 74-1\n\n## 74.6 检查麦克风\n\n在没有麦克风的设备上尝试录制音频会导致 Android 系统抛出异常。因此，代码在进行此类尝试之前检查麦克风的存在至关重要。有多种方法可以实现，包括检查设备的物理存在。一种更容易且可能在不同设备上生效的方法是询问\
  \ Android 系统是否具有特定功能。这涉及创建一个 `PackageManager` 类的实例，然后调用该对象的 `hasSystemFeature()`\
  \ 方法。`PackageManager.FEATURE_MICROPHONE` 是本例中关注的功能。\n\n为了本示例，我们将创建一个名为 `hasMicrophone()`\
  \ 的方法，在检查麦克风是否存在时调用它。在 Project 窗口中，双击 `MainActivity.java` 并修改它添加此方法：\n\n```java\n\
  package com.ebookfrenzy.audioapp;\n\nimport android.content.pm.PackageManager;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    protected boolean hasMicrophone()\
  \ {\n        PackageManager manager = this.getPackageManager();\n        return\
  \ manager.hasSystemFeature(PackageManager.FEATURE_MICROPHONE);\n    }\n}\n```\n\
  图 74-2\n\n## 74.7 初始化 Activity\n\n下一步是修改活动以执行若干初始化任务。留在 `MainActivity.java` 文件中，修改代码如下：\n\
  \n```java\npackage com.ebookfrenzy.audioapp;\n\nimport java.io.IOException;\nimport\
  \ android.media.MediaRecorder;\nimport android.os.Environment;\nimport android.media.MediaPlayer;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    private static MediaRecorder mediaRecorder;\n    private static\
  \ MediaPlayer mediaPlayer;\n    private static String audioFilePath;\n    private\
  \ boolean isRecording = false;\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        binding\
  \ = ActivityMainBinding.inflate(getLayoutInflater());\n        View view = binding.getRoot();\n\
  \        setContentView(view);\n        audioSetup();\n    }\n\n    private void\
  \ audioSetup() {\n        if (!hasMicrophone()) {\n            binding.stopButton.setEnabled(false);\n\
  \            binding.playButton.setEnabled(false);\n            binding.recordButton.setEnabled(false);\n\
  \        } else {\n            binding.playButton.setEnabled(false);\n         \
  \   binding.stopButton.setEnabled(false);\n        }\n        audioFilePath = this.getExternalFilesDir(Environment.DIRECTORY_MUSIC).getAbsolutePath()\
  \ + \"/myaudio.3gp\";\n    }\n}\n```\n\n\n\n\n这段代码目的是识别设备上外部存储的位置（尽管在许多 Android\
  \ 设备上它是内部存储，但仍被称为外部存储），并利用该位置创建一个名为 `myaudio.3gp` 的文件，将音频录制存储其中。`getExternalFilesDir()`\
  \ 方法接收所需的存储类型作为参数（在本例中，我们请求音乐目录的路径，尽管也有播客、有声书、电影、图片等选项可用）。\n\n在处理外部存储操作时，要意识到应用程序的此类活动需要在应用程序清单文件（manifest\
  \ file）中请求权限。例如：\n\n```xml\n<uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"\
  \ />\n```\n\n## 74.8 实现 recordAudio() 方法\n\n当用户点击录制（Record）按钮时，将调用 `recordAudio()`\
  \ 方法。该方法需要启用和禁用相应的按钮，并配置 `MediaRecorder` 实例，提供有关音频源、输出格式和编码以及音频存储文件位置的信息。最后，需要调用\
  \ `MediaRecorder` 对象的 `prepare()` 和 `start()` 方法。这些要求共同构成了 `MainActivity.java` 文件中的以下方法实现：\n\
  \n```java\npublic void recordAudio (View view)\n{\n    isRecording = true;\n   \
  \ binding.stopButton.setEnabled(true);\n    binding.playButton.setEnabled(false);\n\
  \    binding.recordButton.setEnabled(false);\n    try {\n      mediaRecorder = new\
  \ MediaRecorder();\n      mediaRecorder.setAudioSource(MediaRecorder.AudioSource.MIC);\n\
  \      mediaRecorder.setOutputFormat(\n              MediaRecorder.OutputFormat.THREE_GPP);\n\
  \      mediaRecorder.setOutputFile(audioFilePath);\n      mediaRecorder.setAudioEncoder(MediaRecorder.AudioEncoder.AMR_NB);\n\
  \      mediaRecorder.prepare();\n    } catch (Exception e) {\n          e.printStackTrace();\n\
  \    }\n    mediaRecorder.start();\n}\n```\n\n## 74.9 实现 stopAudio() 方法\n\n`stopAudio()`\
  \ 方法负责启用播放（Play）按钮、禁用停止（Stop）按钮，然后停止并重置 `MediaRecorder` 实例。实现这一点的代码如下列表所示，并应添加到\
  \ `MainActivity.java` 文件中：\n\n```java\npublic void stopAudio (View view)\n{\n  \
  \  binding.stopButton.setEnabled(false);\n    binding.playButton.setEnabled(true);\n\
  \    if (isRecording)\n    {\n      binding.recordButton.setEnabled(false);\n  \
  \    mediaRecorder.stop();\n      mediaRecorder.release();\n      mediaRecorder\
  \ = null;\n      isRecording = false;\n    } else {\n      mediaPlayer.release();\n\
  \      mediaPlayer = null;\n      binding.recordButton.setEnabled(true);\n    }\n\
  }\n```\n\n## 74.10 实现 playAudio() 方法\n\n`playAudio()` 方法将创建一个新的 `MediaPlayer` 实例，将位于\
  \ SD 卡上的音频文件分配为数据源，然后准备并开始播放：\n\n```java\npublic void playAudio (View view) throws\
  \ IOException\n{\n    binding.playButton.setEnabled(false);\n    binding.recordButton.setEnabled(false);\n\
  \    binding.stopButton.setEnabled(true);\n    mediaPlayer = new MediaPlayer();\n\
  \    mediaPlayer.setDataSource(audioFilePath);\n    mediaPlayer.prepare();\n   \
  \ mediaPlayer.start();\n}\n```\n\n## 74.11 配置和请求权限\n\n在测试应用程序之前，必须在应用程序的清单文件中请求适当的权限。具体而言，应用程序需要录制音频和访问外部存储（SD\
  \ 卡）的权限。在 Project（项目）工具窗口中，找到并双击 `AndroidManifest.xml` 文件将其加载到编辑器中，并修改 XML 添加两个权限标签：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\npackage=\"com.ebookrenzy.audioapp\"\
  \ >\n<uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"\
  \ />\n<uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n<application>\n\
  ```\n\n上述步骤将足以确保当应用安装在运行 Android 6.0 以前版本的设备上时，用户会启用这些权限。在 Android 中，麦克风和外部存储访问被归类为“危险权限”（dangerous\
  \ permissions），因为它们让应用具有损害用户隐私的可能。因此，为了让示例应用在 Android 6 或更高版本的设备上运行，需要添加代码在运行时专门请求这两种权限。编辑\
  \ `MainActivity.java` 文件，并开始添加一些导入指令和常量，作为所请求权限的请求码：\n\n```java\nimport androidx.core.app.ActivityCompat;\n\
  import androidx.core.content.ContextCompat;\nimport android.widget.Toast;\nimport\
  \ android.Manifest;\n\npublic class MainActivity extends AppCompatActivity {\n \
  \   private static int RECORD_REQUEST_CODE = 101;\n    private static int STORAGE_REQUEST_CODE\
  \ = 102;\n```\n\n接下来，需要向类中添加一个方法，其目的是将要请求的权限和对应的标识码作为参数。在 `MainActivity.java` 类中按如下方式实现此方法：\n\
  \n```java\nprotected void requestPermission(String permissionType, int requestCode)\
  \ {\n    int permission = ContextCompat.checkSelfPermission(this, permissionType);\n\
  \    if (permission != PackageManager.PERMISSION_GRANTED) {\n        ActivityCompat.requestPermissions(this,\
  \ new String[]{permissionType}, requestCode);\n    }\n}\n```\n\n使用本书[在 Android 中运行时请求]章节概述的步骤，上述方法在发出请求之前验证指定的权限尚未授予，并将标识码作为参数传递。当请求处理完成后，将在\
  \ Activity 上调用 `onRequestPermissionsResult()` 方法传递标识码和请求结果。因此，下一步是在 `MainActivity.java`\
  \ 文件中按如下所示实现此方法：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int\
  \ requestCode, String permissions[], int[] grantResults) {\n    super.onRequestPermissionsResult(requestCode,\
  \ permissions, grantResults);\n    switch (requestCode) {\n      case RECORD_REQUEST_CODE:\
  \ {\n        if (grantResults.length == 0 || grantResults[0] != PackageManager.PERMISSION_GRANTED)\
  \ {\n          binding.recordButton.setEnabled(false);\n          Toast.makeText(this,\
  \ \"Record permission required\", Toast.LENGTH_LONG).show();\n        } else {\n\
  \          requestPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE, STORAGE_REQUEST_CODE);\n\
  \        }\n        return;\n      }\n      case STORAGE_REQUEST_CODE: {\n     \
  \   if (grantResults.length == 0 || grantResults[0] != PackageManager.PERMISSION_GRANTED)\
  \ {\n          binding.recordButton.setEnabled(false);\n          Toast.makeText(this,\
  \ \"External Storage permission required\", Toast.LENGTH_LONG).show();\n       \
  \ }\n      }\n    }\n}\n```\n\n\n\n\n上述代码通过检查请求标识符代码来识别哪个权限请求已返回，在此之后检查相应的权限是否已获得授予。如果用户授予了访问麦克风的权限，代码将继续请求访问外部存储。如果任何一个权限被拒绝，将向用户显示一条消息，指示应用程序将无法运行。在这两种情况下，录制按钮都会被禁用。\n\
  \n在测试应用程序之前，最后需要的工作是在应用启动时调用新添加的 `requestPermission()` 方法请求麦克风访问。在 `MainActivity.java`\
  \ 文件中，按照如下方式修改 `audioSetup()` 方法：\n\n```java\nprivate void audioSetup(){\n    binding.recordButton\
  \ = findViewById(R.id.recordButton);\n    binding.playButton = findViewById(R.id.playButton);\n\
  \    binding.stopButton = findViewById(R.id.stopButton);\n    if (!hasMicrophone())\n\
  \    {\n        stopButton.setEnabled(false);\n        playButton.setEnabled(false);\n\
  \        recordButton.setEnabled(false);\n    } else {\n        playButton.setEnabled(false);\n\
  \        stopButton.setEnabled(false);\n    }\n    audioFilePath =\n           \
  \ Environment.getExternalStorageDirectory()\n                .getAbsolutePath()\n\
  \                + \"/myaudio.3gp\";\n    requestPermission(Manifest.permission.RECORD_AUDIO,\n\
  \            RECORD_REQUEST_CODE);\n}\n```\n\n### 74.12 测试应用程序\n\n在带有麦克风的 Android\
  \ 设备上编译并运行应用程序，允许请求的权限并点击录制（Record）按钮。录制后，点击停止（Stop）然后点击播放（Play），此时录制的音频应通过通过设备扬声器播放。如果在\
  \ Android 6.0 或更高版本上运行，请注意应用程序在首次启动时会请求使用外部存储和录制音频的权限。\n\n## 74.13 总结\n\nAndroid\
  \ SDK 提供了多种实现音频录制和播放的机制。本章以 `MediaPlayer` 和 `MediaRecorder` 类的形式查看了其中的两种。在涵盖了使用这些技术的理论后，本章详细介绍了如何创建一个旨在录制并回放音频的示例应用程序。在与\
  \ Android 中处理音频的过程中，本章还研究了在尝试录制音频之前，确保运行应用程序的设备具有麦克风的步骤。此外还涵盖了以 SD 卡形式使用外部存储的内容。\n\
  \n# 75. 在 Android Studio 中使用 Google Maps Android API\n\n当 Google 在许多年前决定引入地图服务时，很难说他们是否预见到过会有可以集成到移动应用程序中的版本。当最终被称为\
  \ Google Maps 的第一个 Web 版本在 2005 年推出时，iPhone 尚未引发智能手机革命，而开发 Android 操作系统的公司在六个月个月后才被\
  \ Google 收购。无论 Google 对 Google Maps 的未来有什么抱负，值得关注的是，现在可以通过 Google Maps Android API\
  \ 直接在 Android 应用程序中访问 Google Maps 的所有功能。\n\n本章旨在提供 Google Maps 系统和 Google Maps Android\
  \ API 的概述。本章将概述构成 API 的不同元素，详细说明配置用于与 Google Maps 工作的开发环境的必要步骤，然后通过一些代码示例演示 Google\
  \ Maps Android 集成的一些基础知识。\n\n### 75.1 Google Maps Android API 元素\n\nGoogle Maps\
  \ Android API 由一组核心类组成，这些类结合在一起为 Android 应用程序提供地图绘制功能。地图的关键元素如下：\n\n-   `GoogleMap`\
  \ – Google Maps Android API 的主类。该类负责下载和显示地图瓦片，并显示和响应地图控制控件。`GoogleMap` 对象不是由应用程序直接创建的，而是在创建\
  \ `MapView` 或 `MapFragment` 实例时创建的。在应用程序代码中可以通过调用 `MapView`、`MapFragment` 或 `SupportMapFragment`\
  \ 实例的 `getMap()` 方法获取 `GoogleMap` 对象的引用。\n-   `MapView` - `View` 类的子类，该类提供了视图画布，`GoogleMap`\
  \ 对象在其上绘制地图，允许将地图放置在活动（activity）的用户界面布局中。\n-   `SupportMapFragment` – `Fragment`\
  \ 类的子类，该类允许将地图放置在 Android 布局的 `Fragment` 中。\n-   `Marker` – `Marker` 类的目的是允许在地图上标记位置。通过获取与地图关联的\
  \ `GoogleMap` 对象引用，然后调用该对象实例的 `addMarker()` 方法向地图上添加标记。标记的位置通过 `Longitude`（经度）和\
  \ `Latitude`（纬度）定义。标记可以通过多种方式进行配置，包括指定标题、文本和图标。标记还可以被设置为可拖拽的，允许用户将标记移动到不同的位置。\n\
  -   `Shapes` – 在地图上绘制线条和形状是通过使用 `Polyline`、`Polygon` 和 `Circle` 类实现的。\n-   `UiSettings`\
  \ – `UiSettings` 类提供了从应用程序内部对地图上显示的界面控件进行控制的。例如，使用该类，应用程序可以控制缩放、当前位置和罗指南控制控件是否显示在地图上。该类还可以用于配置地图识别哪些触摸屏手势。\n\
  -   `My Location Layer`（我的位置层） – 启用后，我的位置层会在地图上显示一个按钮，用户选择该按钮会将地图中心置于用户的当前位置。如果用户静止，该位置在地图上用蓝色标记表示。如果用户正在移动，该位置由一个指示用户方向的箭头表示。\n\
  \n熟悉 Google Maps Android API 的最佳方法是通过示例。本章其余部分将创建一个基于 Google Maps 的应用程序，同时突出 API\
  \ 的关键区域。\n\n### 75.2 创建 Google Maps 项目\n\n在欢迎界面选择 New Project（新建项目）选项，并在新项目对话框中选择\
  \ Google Maps 模板，然后点击 Next（下一步）按钮。\n\n在 Name 字段中输入 `MapDemo`，并将 `com.ebookrenzy.mapdemo`\
  \ 指定为包名。在点击 Finish（完成）按钮之前，将 Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将\
  \ Language 菜单设置为 Java。\n\n### 75.3 获取您的开发者签名\n\n在应用程序可以使用 Google Maps Android API\
  \ 之前，必须先在 Google APIs 控制台中进行注册。在注册应用程序之前，必须识别与您的开发环境相关的开发者签名（称为 SHA-1 指纹）。它包含位于主目录下的\
  \ `.android` 子目录中的密钥库文件中，并可以使用 Java SDK 提供的 `keytool` 工具获取。然而，为了简化过程，当在项目创建过程中选择\
  \ Google Maps Activity 时，Android Studio 会向项目添加一些额外的文件。其中一个文件名为 `google_maps_api.xml`，位于项目的\
  \ `app -> res -> values` 文件夹。\n\n`google_maps_api.xml` 文件包含指向 Google 开发者控制台的链接。复制此链接并粘贴到浏览器窗口中。加载后，将显示所示页面：\n\
  \n![](img/Image24274.jpg)\n\n图 75-1\n\n\n\n在点击继续（Continue）按钮之前，请确保菜单设置为“创建新项目”（Create\
  \ a new project）。一旦启用 API，点击“创建 API 密钥”（Create API Key）按钮。稍等片，新项目将被创建并出现一个面板（图 75-2），为应用程序提供\
  \ API 密钥。\n\n![](img/Image24364.jpg)\n\n图 75-2\n\n复制此密钥，返回 Android Studio 并 API\
  \ 密钥粘贴到文件的 `YOUR_KEY_HERE` 部分：\n\n```xml\n<string name=\"google_maps_key\"\ntemplateMergeStrategy=\"\
  preserve\" translatable=\"false\">YOUR_KEY_HERE</string>\n```\n\n## 75.4 添加 Apache\
  \ HTTP 遗留库需求\n\n由于此示例项目将针对 Android 9.0 或更高版本进行构建使用，因此需要在 `AndroidManifest.xml` 文件的\
  \ `<application>` 部分内添加如下声明：\n\n```xml\n<application\n    android:allowBackup=\"\
  true\"\n    android:icon=\"@mipmap/ic_launcher\"\n    android:label=\"@string/app_name\"\
  \n    android:roundIcon=\"@mipmap/ic_launcher_round\"\n    android:supportsRtl=\"\
  true\"\n    android:theme=\"@style/Theme.MapDemo\">\n    <uses-library\n       \
  \ android:name=\"org.apache.http.legacy\"\n        android:required=\"false\" />\n\
  </application>\n```\n\n## 75.5 测试应用程序\n\n对应用程序进行测试运行以验证 API 密钥是否配置正确。假设配置正确，应用程序将运行并在屏幕上显示地图。\n\
  \n如果未显示地图，请检查以下区域：\n\n*   如果应用程序在模拟器上运行，请确保模拟器运行的 Android 版本包含 Google APIs。可以通过选择\
  \ `Tools` -> `AVD Manager` 菜单，点击 AVD Actions 列中的铅笔图标，然后点击当前 Android 版本旁边的 Change\
  \ 按钮来更改 AVD 的操作系统。在系统镜像对话框中，选择包含 Google APIs 的目标。\n*   检查 `Logcat` 输出，查看任何与 Google\
  \ Maps API 身份验证问题相关的区域。这通常意味着 API 密钥输入错误，或者在生成 API 密钥时应用程序包名不匹配。\n*   在 Google API\
  \ 控制台中验证 Google Maps Android API 是否已在 Services 中。\n\n## 75.6 理解地理编码和反向地理编码\n\n如果不先涵盖地理编码主题，就无法讨论地图和地理位置。地理编码（Geocoding）可以描述为将文本地理位置（如街道地址）转换为\
  \ `longitude`（经度）和 `latitude`（纬度）地理坐标的过程。\n\n可以使用 `Geocoder` 类实现地理编码。例如，可以向 `Geocoder`\
  \ 类实例传递一个表示位置的字符串，如城市名称、街道地址或机场代码。`Geocoder` 将尝试查找位置的匹配项，并返回可能与位置字符串匹配的 `Address`\
  \ 对象列表，按匹配程度排序，最接近的匹配项位于列表的索引 `0`。随后可以从 `Address` 对象中提取各种信息，包括潜在匹配项的 `longitude`\
  \ 和 `latitude`。\n\n例如，以下代码请求位于华盛顿特区的国家航空航天博物馆的位置：\n\n```java\nimport java.io.IOException;\n\
  import java.util.List;\nimport android.location.Address;\nimport android.location.Geocoder;\n\
  \ndouble latitude;\ndouble longitude;\nList<Address> geocodeMatches = null;\ntry\
  \ {\n    geocodeMatches = new Geocoder(this).getFromLocationName(\"600 Independence\
  \ Ave SW, Washington, DC 20560\", 1);\n} catch (IOException e) {\n    // TODO Auto-generated\
  \ catch block\n    e.printStackTrace();\n}\nif (!geocodeMatches.isEmpty()) {\n \
  \   latitude = geocodeMatches.get(0).getLatitude();\n    longitude = geocodeMatches.get(0).getLongitude();\n\
  }\n```\n\n注意，值 `1` 是作为第二个参数传递给 `getFromLocationName()` 方法的。这仅仅是告诉 `Geocoder` 在数组中只返回一个结果。鉴所提供的地址具有特定性，应该只有一个潜在的匹配项。然而，对于更模糊的位置名称，可能需要请求更多潜在匹配项并允许用户选择正确的那个。\n\
  \n上面的代码是正向地理编码（forward-geocoding）的示例，即坐标是基于文本位置计算的。反向地理编码（Reverse-geocoding）正如其名，涉及将地理坐标翻译为人类可读的地址字符串。例如，考虑以下代码：\n\
  \n```java\nimport java.io.IOException;\nimport java.util.List;\nimport android.location.Address;\n\
  import android.location.Geocoder;\n\nList<Address> geocodeMatches = null;\nString\
  \ Address1;\nString Address2;\nString State;\nString Zipcode;\nString Country;\n\
  try {\n    geocodeMatches = new Geocoder(this).getFromLocation(38.8874245, -77.020729,\
  \ 1);\n} catch (IOException e) {\n    // TODO Auto-generated catch block\n    e.printStackTrace();\n\
  }\nif (!geocodeMatches.isEmpty()) {\n    Address1 = geocodeMatches.get(0).getAddressLine(0);\n\
  \    Address2 = geocodeMatches.get(0).getAddressLine(1);\n    State = geocodeMatches.get(0).getAdminArea();\n\
  \    Zipcode = geocodeMatches.get(0).PostalCode();\n    Country = geocodeMatches.get(0).getCountryName();\n\
  }\n```\n\n在此情况下，`Geocoder` 对象通过 `getFromLocation()` 方法使用 `latitude` 和 `longitude`\
  \ 值初始化。再次请求单个匹配结果。随后从得到的 `Address` 对象中提取文本的地址信息。\n\n应该注意的是，地理编码并非实际上在 Android 设备上执行，而是在设备需要翻译时连接的服务器上执行，并在完成后返回结果。\n\
  \n## 75.7 为应用程序添加地图\n\n向应用程序添加地图简单的方法是在用户界面文件中指定它。以下布局文件显示了在 Android Studio 创建的\
  \ `activity_maps.xml` 文件中添加的 `SupportMapFragment` 实例：\n\n```xml\n<fragment xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    android:id=\"@+id/map\"\n    tools:context=\".MapsActivity\"\n    android:name=\"\
  com.google.android.gms.maps.SupportMapFragment\"/>```\n\n## 75.8 请求当前位置权限\n\n正如[在\
  \ Android 中进行运行时权限请求]章节中概述的，某些权限被归类为危险权限，对于 Android 6.0 或更高版本需要特殊处理。其中一种权限允许应用程序识别用户的当前位置。默认情况下，Android\
  \ Studio 已在 `AndroidManifest.xml` 文件中放置了位置权限请求。找到位于 Project 工具窗口中 app -> manifests\
  \ 下的文件，并找到以下权限行：\n\n```xml\n<uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"\
  \ />\n```\n\n这将确保在在旧版本的 Android 上安装应用程序时，应用程序获得提供位置信息权限的机会，但为了完全支持 Android 6.0 或更高版本，应用程序必须在运行时专门请求此权限。为了实现这一点，需要在\
  \ `MapsActivity.java` 文件中添加一些代码。\n\n首先添加一些导入指令和一个作为权限请求代码的常量：\n\n```java\npackage\
  \ com.ebookfrenzy.mapdemo;\n```\n\n\n\n\n```java\nimport androidx.core.content.ContextCompat;\n\
  import androidx.core.app.ActivityCompat;\nimport android.Manifest;\nimport android.widget.Toast;\n\
  import android.content.pm.PackageManager;\n\npublic class MapsActivity extends FragmentActivity\
  \ implements OnMapReadyCallback {\n    private static final int LOCATION_REQUEST_CODE\
  \ = 101;\n    private GoogleMap mMap;\n}\n```\n\n接下来，需要在类中添加一个方法，以向用户请求特定的权限。继续留在\
  \ `MapsActivity.java` 类文件中，按照如下代码实现该方法：\n\n```java\nprotected void requestPermission(String\
  \ permissionType, int requestCode) {\n    ActivityCompat.requestPermissions(this,\n\
  \        new String[]{permissionType}, requestCode\n    );\n}\n```\n\n当用户对权限请求做出响应时，Activity\
  \ 将会调用 `onRequestPermissionsResult()` 方法。继续留在 `MapsActivity.java` 文件中，现在实现该方法，使其内容如下：\n\
  \n```java\n@Override\npublic void onRequestPermissionsResult(int requestCode, String\
  \ permissions[], int[] grantResults) {\n    super.onRequestPermissionsResult(requestCode,\
  \ permissions, grantResults);\n    switch (requestCode) {\n        case LOCATION_REQUEST_CODE:\
  \ {\n            if (grantResults.length == 0\n                    || grantResults[0]\
  \ != PackageManager.PERMISSION_GRANTED) {\n                Toast.makeText(this,\n\
  \                    \"Unable to show location - permission required\",\n      \
  \              Toast.LENGTH_LONG).show();\n            } else {\n              \
  \  SupportMapFragment mapFragment =\n                    (SupportMapFragment) getSupportFragmentManager()\n\
  \                        .findFragmentById(R.id.map);\n                mapFragment.getMapAsync(this);\n\
  \            }\n        }\n    }\n}\n```\n\n如果用户未授予权限，应用将显示一条消息，指示无法显示当前位置。相反，如果权限已授予，地图将进行刷新，以便提供显示位置标记的机会。\n\
  \n## 75.9 显示用户的当前位置\n\n一旦授予了适当的权限，可以通过获取与显示的地图相关的 `GoogleMap` 对象的引用，并调用该实例的 `setMyLocationEnabled()`\
  \ 方法（传入 `true` 值），在地图上显示用户的当前位置。\n\n当地图准备好显示时，Activity 的 `onMapReady()` 方法会被调用。当地图在上述\
  \ `onRequestPermissionsResult()` 方法中刷新时，该方法也会被调用。默认情况下，Android Studio 已经实现了此方法并添加了一些代码，将地图对准澳大利亚，并在悉尼市上方放置了一个标记。请在\
  \ `MapsActivity.java` 文件中定位并编辑 `onMapReady()` 方法，移除这些模板代码，并添加代码在启用显示用户当前位置之前检查位置权限是否已授予。如果未授予权限，将通过调用之前添加的\
  \ `requestPermission()` 方法向用户请求：\n\n```java\n@Override\npublic void onMapReady(GoogleMap\
  \ googleMap) {\n    mMap = googleMap;\n    // 在悉尼添加一个标记并移动相机\n    LatLng sydney\
  \ = new LatLng(-34, 151);\n    mMap.addMarker(new MarkerOptions().position(sydney).title(\"\
  Marker in Sydney\"));\n    mMap.moveCamera(CameraUpdateFactory.newLatLng(sydney));\n\
  \    if (mMap != null) {\n        int permission = ContextCompat.checkSelfPermission(this,\
  \ Manifest.permission.ACCESS_LOCATION);\n        if (permission == PackageManager.PERMISSION_GRANTED)\
  \ {\n            mMap.setMyLocationEnabled(true);\n        } else {\n          \
  \  requestPermission(Manifest.permission.ACCESS_LOCATION, LOCATION_REQUEST_CODE);\n\
  \        }\n    }\n}\n```\n\n现在运行应用时，将出现图 75-3 所示的对话框请求权限。如果授予了权限，地图上将出现一个蓝点表示设备的当前位置。\n\
  \n## 75.10 更改地图类型\n\n通过调用相应 `GoogleMap` 对象的 `setMapType()` 方法并传入以下值之一，可以动态修改显示的地图类型：\n\
  \n- `GoogleMap.MAP_TYPE_NONE`：没有任何地图瓦片的空网格。\n- `GoogleMap.MAP_TYPE_NORMAL`：由经典地图组成的标准视图。\n\
  - `GoogleMap.MAP_TYPE_SATELLITE`：显示地图区域的卫星图像。\n- `GoogleMap.MAP_TYPE_HYBRID`：显示带有道路地图的卫星图像。\n\
  - `GoogleMap.MAP_TYPE_TERRAIN`：显示等线等地形信息。\n\n例如，对 `onMapReady()` 方法进行以下代码更改可以将地图切换到卫星模式：\n\
  \n```java\nif (mMap != null) {\n    int permission = ContextCompat.checkSelfPermission(this,\
  \ Manifest.permission.ACCESS_LOCATION);\n    if (permission == PackageManager.PERMISSION_GRANTED)\
  \ {\n        mMap.setMyLocationEnabled(true);\n    } else {\n        requestPermission(Manifest.permission.ACCESS_LOCATION,\
  \ LOCATION_REQUEST_CODE);\n    }\n    mMap.setMapType(GoogleMap.MAP_TYPE_SATELLITE);\n\
  }\n```\n\n或者，可以在嵌入地图的 XML 布局文件中指定地图类型，使用 `map:mapType` 属性结合 `none`、`normal`、`hybrid`、`satellite`\
  \ 或 `terrain` 值。例如：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<fragment\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n      xmlns:map=\"\
  http://schemas.android.com/apk/res-auto\"\n      android:id=\"@+id/map\"\n     \
  \ android:layout_width=\"match_parent\"\n      android:layout_height=\"match_parent\"\
  \n      map:mapType=\"hybrid\"\n      android:name=\"com.google.android.gms.maps.SupportMapFragment\"\
  />\n```\n\n## 75.11 向用户显示地图控件\n\nGoogle Maps Android API 提供了许多可以可选显示给用户的控件，包括缩放放大和缩小按钮、“我的位置”按钮和指南针。\n\
  \n是否显示缩放和指南针控件可以通过编程方式或在 XML 资源中控制。要通过编程方式配置控件，必须获取与 `GoogleMap` 对象相关的 `UiSettings`\
  \ 对象的引用：\n\n```java\nimport com.google.android.gms.maps.UiSettings;\n\nUiSettings\
  \ mapSettings;\nmapSettings = mMap.getUiSettings();\n```\n\n缩放控件通过调用 `UiSettings`\
  \ 对象的 `setZoomControlsEnabled()` 方法来启用或禁用。例如：\n\n```java\nmapSettings.setZoomControlsEnabled(true);\n\
  ```\n\n或者，可以在 XML 资源文件的 map 元素中设置 `map:uiZoomControls` 属性：\n\n```xml\nmap:uiZoomControls=\"\
  false\"\n```\n\n指南针可以通过调用 `UiSettings` 实例的 `setCompassEnabled()` 方法，或者通过 XML 资源使用\
  \ `map:uiCompass` 属性来显示。请注意，指南针图标仅在地图相机倾斜或旋转偏离默认方向时出现。\n\n“我的位置”按钮只有在在本章前面介绍的启用“我的位置”模式时才会出现。即使在这种模式下，也可以通过调用\
  \ `UiSettings` 实例的 `setPrototypeOfButtonEnabled()` 方法防止按钮显示。\n\n## 75.12 处理地图手势交互\n\
  \nGoogle Maps Android API 能够响应许多不同的用户交互。这些交互可以用于更改显示的地图区域、缩放级别，甚至是视角（对于某些城市会显示地图区域的\
  \ 3D 表示）。\n\n### 75.12.1 地图缩放手势\n\n\n\n\n\n可以使用与 `GoogleMap` 实例关联的 `UiSettings`\
  \ 对象的 `setZoomGesturesEnabled()` 方法来启用或禁用地图缩放相关的手势。例如，以下代码禁用了示例地图的缩放手势：\n\n```java\n\
  UiSettings mapSettings;\nmapSettings = map.getUiSettings();\nmapSettings.setZoomGesturesEnabled(false);\n\
  ```\n\n在 XML 资源文件中通过将 `map:uiZoomGestures` 属性设置为 `true` 或 `false` 也可以相同的结果。\n\n\
  当启用时，当用户在屏幕上进行双指捏合动作时，将发生缩放。同样地，双击会放大，而双指轻点会缩小。另一方面，单指缩放手势是通过双击但不松开第二次点击，然后在屏幕上上下滑动手指来分别放大或缩小地图来完成的。\n\
  \n## 75.12.2 地图滚动/平移手势\n\n滚动或平移手势允许用户通过单指在屏幕上拖动地图，从而移动地图。可以通过调用 `UiSettings` 实例的\
  \ `setScrollGesturesEnabled()` 方法在代码中启用滚动手势：\n\n```java\nUiSettings mapSettings;\n\
  mapSettings = mMap.getUiSettings();\nmapSettings.setScrollGesturesEnabled(true);\n\
  ```\n\n或者，可以在 XML 资源布局文件中使用 `map:uiScrollGestures` 属性启用地图实例上的滚动功能。\n\n## 75.12.3\
  \ 地图倾斜手势\n\n倾斜手势允许用户通过在屏幕上放置两个手指并上下移动来调整倾斜角度，从而改变地图投影的角度。可以通过调用 `UiSettings` 实例的\
  \ `setTiltGesturesEnabled()` 方法启用或禁用倾斜手势，例如：\n\n```java\nUiSettings mapSettings;\n\
  mapSettings = mMap.getUiSettings();\nmapSettings.setTiltGesturesEnabled(true);\n\
  ```\n\n也可以使用 XML 布局资源文件中的 `map:uiTiltGestures` 属性启用或禁用倾斜手势。\n\n## 75.12.4 地图旋转手势\n\
  \n在屏幕上放置两个手指并进行圆形运动，当启用地图旋转手势时，用户可以旋转地图的朝向。这种手势支持通过调用 `UiSettings` 实例的 `setRotateGesturesEnabled()`\
  \ 方法在代码中启用或禁用，例如：\n\n```java\nUiSettings mapSettings;\nmapSettings = mMap.getUiSettings();\n\
  mapSettings.setRotateGesturesEnabled(true);\n```\n\n也可以使用 XML 布局资源文件中的 `map:uiRotateGestures`\
  \ 属性启用或禁用旋转手势。\n\n## 75.13 创建地图标记\n\n标记（Markers）用于通知用户地图上的位置，其形式为标准图标或自定义图标。标记还可以包含一个标题（title）和可选文本（称为摘要，snippet），并可以配置为允许用户将其拖动到地图上的不同位置。当用户点击标记时，将弹出一个信息窗口（info\
  \ window），显示关于标记位置的额外信息。\n\n标记由 `Marker` 类的实例表示，并通过调用相应 `GoogleMap` 对象的 `addMarker()`\
  \ 方法添加到地图中。传递给该方法的参数是一个 `MarkerOptions` 类的实例，它包含了标记所需的各种选项，如标题和摘要文本。标记的位置通过指定经度和纬度值来定义，这些值也包含在\
  \ `MarkerOptions` 实例中。例如，以下代码在地图的特定位置添加了一个包含标题、摘要和位置的标记：\n\n```java\nimport com.google.android.gms.maps.model.Marker;\n\
  import com.google.android.gms.maps.model.LatLng;\nimport com.google.android.gms.maps.model.MarkerOptions;\n\
  \nLatLng position = new LatLng(38.8874245, -77.0200729);\nMarker museum = mMap.addMarker(new\
  \ MarkerOptions()\n                .position(position)\n                .title(\"\
  Museum\")\n                .snippet(\"National Air and Space Museum\"));\n```\n\n\
  执行上述代码将将标记指定的的位置，点击该位置时，将显示一个包含标题和摘要的信息窗口，如图图 75-4 所示：\n\n![](img/Image24513.jpg)\n\
  \n图 75-4\n\n## 75.14 控制地图相机\n\n由于 Android 设备屏幕是平面的，而地球是球形的，Google Maps Android API\
  \ 使用墨卡托投影在平面表面上表示地球。地图的默认视图呈现给用户，就好像通过一个悬挂在地图上方并直接向下俯视的相机一样。Google Maps Android\
  \ API 允许在应用程序内部实时更改相机的目标（target）、缩放（zoom）、方位角（bearing）和倾斜（tilt）：\n\n- **目标 (Target)**\
  \ – 地图在设备显示器中心的位置，以经纬度表示。\n- **缩放 (Zoom)** – 以级别指定的相机缩放级别。缩放级别增加 1.0 会导致显示的地图宽度翻倍。\n\
  - **倾斜 (Tilt)** – 相机的视角角度，以跨越可视地图区域中心正上方弧线上的位置表示，从弧顶开始以度测量。\n- **方位角 (Bearing)**\
  \ – 地图的朝向，以从北方向顺时针的角度表示。\n\n为了在相机变化时获得平滑的动画效果，可以调用 `animateCamera()` 方法而不是 `moveCamera()`。`CameraUpdate`\
  \ 方法的摘要如下：\n\n- `CameraUpdateFactory.zoomIn()`：提供放大一级的 `CameraUpdate` 实例。\n- `CameraUpdateFactory.zoomOut()`：提供缩小一级的\
  \ `CameraUpdate` 实例。\n- `CameraUpdateFactory.zoomTo(float)`：将缩放级别更改为指定的值。\n- `CameraUpdateFactory.zoomBy(float)`：按指定量增加或减少缩放的\
  \ `CameraUpdate` 实例。\n- `CameraUpdateFactory.zoomBy(float, Point)`：按指定值增加或减少缩放的\
  \ `CameraUpdate` 实例。\n- `CameraUpdateFactory.newLatLng(LatLng)`：更改相机经纬度的 `CameraUpdate`\
  \ 实例。\n- `CameraUpdateFactory.newLatLngZoom(LatLng, float)`：更改相机经纬度和缩放的 `CameraUpdate`\
  \ 实例。\n- `CameraUpdateFactory.newCameraPosition(CameraPosition)`：返回移动到指定位置的 `CameraUpdate`\
  \ 实例。可以使用 `CameraPosition.Builder()` 获取 `CameraPosition` 实例。\n\n例如，以下代码使用动画放大相机一级：\n\
  \n```java\nmMap.animateCamera(CameraUpdateFactory.zoomIn());\n```\n\n相反，以下代码将相机移动到新位置并将缩放级别调整为\
  \ 10，且没有动画：\n\n```java\nprivate static final LatLng position = new LatLng(38.8874245,\
  \ -77.0200729);\nmMap.moveCamera(CameraUpdateFactory.newLatLngZoom(position, 10));\n\
  ```\n\n最后，下一个代码示例使用 `CameraPosition.Builder()` 创建带有目标、缩放、方位角和倾斜变化的 `CameraPosition`\
  \ 对象。然后通过动画将此更改到相机：\n\n```java\nimport com.google.android.gms.maps.model.CameraPosition;\n\
  import com.google.android.gms.maps.CameraUpdateFactory;\n\nCameraPosition cameraPosition\
  \ = new CameraPosition.Builder()\n        .target(position)\n        .zoom(50)\n\
  \        .bearing(70)\n        .tilt(25)\n        .build();\n\nmMap.animateCamera(CameraUpdateFactory.newCameraPosition(cameraPosition));\n\
  ```\n\n## 75.15 总结\n\n\n\n\n\n本章概述了构成 Google Maps Android API 的关键类和方法，并概述了准备开发环境和应用项目以使用该\
  \ API 的各个步骤。\n\n# 76. 使用 Android 打印框架进行打印\n\n随着 Android 4.4 KitKat 的发布，从 Android\
  \ 应用程序内部打印内容已成为可能。后续章节将更详细地探讨为自己的应用程序添加打印支持的选项，而本章将重点关注 Android 现提供的各种打印选项以及启用这些选项的步骤。在涵盖这些初始主题后，本章将概述\
  \ Android 开发者在为应用程序构建打印支持时，可使用的各种打印功能。\n\n## 76.1 Android 打印架构\n\nAndroid 打印是由打印框架（Printing\
  \ framework）提供的。简单来说，该框架由一个 `Print Manager`（打印管理器）和若干打印服务插件组成。`Print Manager` 的职责是处理设备上应用程序的打印请求，并与设备上安装的打印服务插件进行交互，从而确保打印请求完成。默认情况下，许多\
  \ Android 设备都安装了打印服务插件，以便使用 Google Cloud Print 和 Google Drive 服务进行打印。其他打印机类型的打印服务插件（如果尚未安装）也可以从\
  \ Google Play 商店获取。打印服务插件目前适用于 HP、爱普、三星和佳能打印机，其他打印机制造商的插件可能在未来发布，尽管 Google Cloud\
  \ Print 服务插件也可用于从 Android 设备打印到几乎任何类型和模型的打印机。为了本书起，我们将使用 `HP Print Services Plugin`\
  \ 作为参考示例。\n\n## 76.2 打印服务插件\n\n打印服务插件的目的是允许应用程序打印到通过局域无线网络或蓝牙对 Android 设备可见的兼容打印机。\n\
  \n可以通过加载 Google Play 应用并搜索“Print Service Plugin”（打印服务插件）来验证 Android 设备上是否存在打印服务插件。一旦插件出现在\
  \ Play 商店的列表中，如果该插件尚未安装，可以通过选择“安装”按钮进行安装。例如，图 76-1 显示了 Google Play 中的 HP 打印服务插件。\n\
  \n打印服务插件将自动检测 Android 设备当前连接的网络上的兼容打印机，并在从应用程序进行打印时将它们列为选项。\n\n![](img/as_4.1_hp_printer_plugin.jpg)\n\
  \n图 76-1\n\n## 76.3 Google Cloud Print\n\nGoogle Cloud Print 是 Google 提供的一服务，允许您从任何具有互联网连接的地方通过网络将内容打印到您自己的打印机上。Google\
  \ Cloud Print 以云就型（Cloud Ready）和经典型（Classic）打印机的形式支持广泛设备和打印机型号。云就打印机内置了通过网络进行打印的技术。提供云就打印机的制造商包括博世、佳能、戴、爱普、HP、柯达和三星。要识别您的打印机是否既支持云就又受\
  \ Google Cloud Print 支持，请查看以下 URL 中的打印机列表：\n\n`https://www.google.com/cloudprint/learn/printers.html`\n\
  \n对于经典非云就型打印机，Google Cloud Print 通过在连接到经典打印机的计算机系统（直接连接或通过家庭或办公室网络）上安装软件来实现云打印支持。\n\
  \n要设置 Google Cloud Print，请访问以下网页并使用登录 Android 设备时相同的 Google 账户 ID 登录：\n\n`https://www.google.com/cloudprint/learn/index.html`\n\
  \n一旦打印机添加到您的 Google Cloud Print 账户，当您从设备上的 Android 应用程序内部打印时，它们将作为打印目标选项列出。\n\n\
  ## 76.4 打印到 Google Drive\n\n除了支持物理打印机外，还将打印输出保存到您的 Google Drive 账户。当从设备打印时，选择打印面板中的“保存到\
  \ Google Drive”（Save to Google Drive）选项。打印内容将被转换为 PDF 文件，并保存到设备上当前活动 Google 账户 ID\
  \ 关联的 Google Drive 云存储中。\n\n## 76.5 保存为 PDF\n\nAndroid 提供的最后一个打印选项允许将打印内容作为 PDF\
  \ 文件本地保存到 Android 设备上。一旦被选中，该选项将请求指定 PDF 文件名以及在设备上保存文档的位置。\n\n在测试您自己的 Android 应用程序的打印功能时，“保存为\
  \ PDF”和“Google Drive”选项在节约张方面可能是极具价值的。\n\n## 76.6 从 Android 设备打印\n\nGoogle 建议提供打印内容能力的应用程序应将打印选项放置在溢出菜单（Overflow\
  \ menu）中。与 Android 捆带的许多应用程序现在都包含了“打印...”（Print…）菜单选项。例如，图 76-2 显示了通过选择 Chrome 浏览器应用程序溢出菜单中的“共享...”（Share…）选项访问打印选项：\n\
  \n![](img/as_3.5_chrome_print_option.jpg)\n\n图 76-2\n\n一旦在应用程序内选择了打印选项，将出现标准的 Android\
  \ 打印屏幕，显示要打印内容的预览，如图 76-3 所示：\n\n![](img/as_3.5_chrome_print_panel.jpg)\n\n图 76-3\n\
  \n点击屏幕顶部的面板将显示完整的打印选项：\n\n![](img/as_3.5_save_as_pdf.jpg)\n\n图 76-4\n\nAndroid 打印面板提供了通常的打印选项，如纸张大小、颜色、方向和份数。通过点击当前打印机或\
  \ PDF 输出可以访问其他打印目标选项。\n\n## 76.7 在 Android 应用中构建打印支持的选项\n\n打印框架为在 Android 应用中集成打印支持提供了多种选项。这些选项分类如下：\n\
  \n### 76.7.1 打印\n\n顾其实，此选项允许将图像打印到 Android 应用程序中。在应用程序中添加此功能时，第一步是创建一个 `PrintHelper`\
  \ 类的实例：\n\n```\nPrintHelper imagePrinter = new PrintHelper(context);\n```\n\n接下来，可以通过调用\
  \ `PrintHelper` 实例的 `setScaleMode()` 方法指定打印图像的缩放模式。选项如下：\n\n- `SCALE_MODE_FIT`：图像适应纸张尺寸，而不进行任何裁剪或更改宽高比例。这通常会在一个维度上产生空白。\n\
  - `SCALE_MODE_FILL`：图像将填充纸张尺寸，并在必要时进行裁剪以避免打印输出出现空白。\n\n在没有设置缩放模式的情况下，系统默认使用 `SCALE_MODE_FILL`。例如，以下代码为之前声明的\
  \ `PrintHelper` 实例设置了缩放模式：\n\n```\nimagePrinter.setScaleMode(PrintHelper.SCALE_MODE_FIT);\n\
  ```\n\n同样，也可以配置颜色模式以指示打印输出是彩色还是黑白。这是通过向 `PrintHelper` 实例的 `setColorMode()` 方法传递以下选项之一实现的：\n\
  \n- `COLOR_MODE_COLOR`：表示图像将以彩色打印。\n- `COLOR_MODE_MONO`：表示图像将以黑白打印。\n\n\n\n\n\n\
  • `COLOR_MODE_MONOCHROME` – 表示图像将以黑白格式打印。\n\n打印框架将默认使用彩色打印，除非如下所示指定了单色选项：\n\n```java\n\
  imagePrinter.setColorMode(PrintHelper.COLOR_MODE_MONOCHROME);\n```\n\n完成打印操作仅需要一个待打印的图像并调用\
  \ `PrintHelper` 实例的 `printBitmap()` 方法，该方法需要传递一个代表分配给打印任务名称的字符串，以及图像的引用（以 `Bitmap`\
  \ 对象或图像的 `Uri` 引用的形式存在）：\n\n```java\nBitmap bitmap = BitmapFactory.decodeResource(getResources(),\n\
  \                R.drawable.oceanscene);\n\nimagePrinter.printBitmap(\"My Test Print\
  \ Job\", bitmap);\n```\n\n一旦启动打印任务，打印框架将显示打印对话框，并处理后续与用户的交互以及在用户选择的打印目标上打印图像。\n\n\
  ## 76.7.2 创建和打印 HTML 内容\n\nAndroid 打印框架还提供了一种在应用程序内部打印基于 HTML 的内容的简单方法。这种内容既可以是由托管在网站上的页面\
  \ URL 引用的 HTML 形式，也可以是可以在应用程序内动态创建的 HTML 内容。\n\n为了启用 HTML 打印，`WebView` 类已经过扩展，支持以极少的代码要求进行打印。\n\
  \n在动态创建 HTML 内容时（与加载和打印现有网页相比），该过程涉及一个 `WebView` 对象的创建，并与其关联一个 `WebViewClient` 实例。然后配置该\
  \ web view 客户端，在 HTML 加载到 `WebView` 之后启动打印任务。在配置好 web view 客户端后，HTML 将被加载到 `WebView`\
  \ 中，此时便会触发打印过程。\n\n例如，考虑以下代码：\n\n```java\npublic void printContent()\n{\n    WebView\
  \ webView = new WebView(this);\n    webView.setWebViewClient(new WebViewClient()\
  \ {\n        public boolean shouldOverrideUrlLoading(WebView view,\n           \
  \         String url)\n        {\n            return false;\n        }\n       \
  \ @Override\n            public void onPageFinished(WebView view, String url) {\n\
  \                createWebPrintJob(view);\n                myWebView = null;\n \
  \           }\n    });\n    String htmlDocument =\n            \"<html><body><h1>Android\
  \ Print Test</h1><p>\"\n            + \"This is some sample content.</p></body></html>\"\
  ;\n    webView.loadDataWithBaseURL(null, htmlDocument,\n                \"text/HTML\"\
  , \"UTF-8\", null);\n    myWebView = webView;\n}\n```\n\n该方法中的代码首先声明了一个名为 `myWebView`\
  \ 的变量，其中将存储方法中创建的 `WebView` 实例的引用。在 `printContent()` 方法中，创建了一个 `WebView` 类的实例，并为其分配了一个\
  \ `WebViewClient` 实例。\n\n分配给 web 对象的 `WebViewClient` 被配置为指示 HTML 内容加载将由 `WebView`\
  \ 实例处理（通过从 `shouldOverrideUrlLoading()` 方法返回 `false`）。更重要的是，声明并实现了一个 `onPageFinished()`\
  \ 处理方法，用以调用名为 `createWebPrintJob()` 的方法。\n\n该方法中的代码首先声明了一个名为 `myWebView` 的变量，其中将存储方法中创建的\
  \ `WebView` 实例的引用。在 `printContent()` 方法中，创建了一个 `WebView` 类的实例，并为其分配了一个 `WebViewClient`\
  \ 实例。\n\n分配给 web 对象的 `WebViewClient` 被配置为指示 HTML 内容加载将由 `WebView` 实例处理（通过从 `shouldOverrideUrlLoading()`\
  \ 方法返回 `false`）。更重要的是，声明并实现了一个 `onPageFinished()` 处理方法，用以调用名为 `createWebPrintJob()`\
  \ 的方法。\n\n该方法中的代码首先声明了一个名为 `myWebView` 的变量，其中将存储方法中创建的 `WebView` 实例的引用。在 `printContent()`\
  \ 方法中，创建了一个 `WebView` 类的实例，并为其分配了一个 `WebViewClient` 实例。\n\n分配给 web 对象的 `WebViewClient`\
  \ 被配置为指示 HTML 内容加载将由 `WebView` 实例处理（通过从 `shouldOverrideUrlLoading()` 方法返回 `false`）。更重要的是，声明并实现了一个\
  \ `onPageFinished()` 处理方法，用以调用名为 `createWebPrintJob()` 的方法。\n\n该方法中的代码首先声明了一个名为\
  \ `myWebView` 的变量，其中将存储方法中创建的 `WebView` 实例的引用。在 `printContent()` 方法中，创建了一个 `WebView`\
  \ 类的实例，并为其分配了一个 `WebViewClient` 实例。\n\n分配给 web 对象的 `WebViewClient` 被配置为指示 HTML 内容加载将由\
