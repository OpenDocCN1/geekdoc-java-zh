  \            android:id=\"@+id/toolbar\"\n            android:layout_width=\"match_parent\"\
  \n            android:layout_height=\"?attr/actionBarSize\"/>\n    <com.google.android.material.tabs.TabLayout\n\
  \        android:id=\"@+id/tab\"\n        android:layout_width=\"match_parent\"\n\
  \        android:layout_height=\"wrap_content\"/>\n    <androidx.viewpager2.widget.ViewPager2\n\
  \        android:id=\"@+id/view\"\n        android:layout_width=\"match_parent\"\
  \n        android:layout_height=\"match_parent\"\n        app:layout_behavior=\"\
  @string/appbar_scrolling_view_behavior\"/>\n</androidx.coordinatorlayout.widget.CoordinatorLayout>\n\
  ```\n\n## 4.7 创建 Pager 器\n\n此示例将使用 `ViewPager2` 方法来处理分配给 `TabLayout` 的片段。为了管理用户选择的片段，在项目窗口中右键点击\
  \ `com.ebookfrenzy.tablayoutdemo` 并选择 `New -> Java Class`。在类对话框中，在 `Name:` 字段中输入\
  \ `TabPagerAdapter` 并点击 `OK`。编辑 `TabPagerAdapter.java` 文件如下如下：\n\n```java\npackage\
  \ com.ebookfrenzy.tablayoutdemo;\n\nimport androidx.annotation.NonNull;\nimport\
  \ androidx.fragment.app.Fragment;\nimport androidx.fragment.app.FragmentActivity;\n\
  import androidx.viewpager2.adapter.FragmentStateAdapter;\n\npublic class TabPagerAdapter\
  \ extends FragmentStateAdapter {\n    int tabCount;\n\n    public TabPagerAdapter(@NonNull\
  \ FragmentActivity fragmentActivity, int numberOfTabs) {\n        super(fragmentActivity);\n\
  \        this.tabCount = numberOfTabs;\n    }\n\n    @NonNull\n    @Override\n \
  \   public Fragment createFragment(int position) {\n        switch (position) {\n\
  \            case 0:\n                return new Tab1Fragment();\n            case\
  \ 1:\n                return new Tab2Fragment();\n            case 2:\n        \
  \        return new Tab3Fragment();\n            case 3:\n                return\
  \ new Tab4Fragment();\n            default:\n                return null;\n    \
  \    }\n    }\n\n    @Override\n    public int getItemCount() {\n        return\
  \ tabCount;\n    }\n}\n```\n\n## 4.8 执行初始化任务\n\n剩余的任务涉及初始化 `TabLayout`、`ViewPager2`\
  \ 和 `TabPagerAdapter` 实例，并让主活动类实现每个片段的交互监听器。编辑 `MainActivity` 文件如下：\n\n```java\n\
  package com.ebookfrenzy.tablayoutdemo;\n\nimport android.os.Bundle;\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import com.ebookfrenzy.tablayoutdemo.databinding.ActivityMainBinding;\nimport com.google.android.material.tabs.TabLayoutMediator;\n\
  \npublic class MainActivity extends AppCompatActivity implements\n    Tab1Fragment.OnFragmentInteractionListener,\n\
  \    Tab2Fragment.OnFragmentInteractionListener,\n    Tab3Fragment.OnFragmentInteractionListener,\n\
  \    Tab4Fragment.OnFragmentInteractionListener {\n\n    private ActivityMainBinding\
  \ binding;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        setContentView(binding.getRoot());\n\n        setupTabLayout();\n    }\n\
  \n    private void setupTabLayout() {\n        new TabLayoutMediator(binding.tab,\
  \ binding.viewPager, (tab, position) -> {\n            tab.setText(\"Tab \" + (position\
  \ + 1));\n        }).attach();\n    }\n}\n```\n\n\n\n\n```java\nnew TabLayoutMediator(binding.tabLayout,\
  \ binding.viewPager,\n    (tab, position) -> tab.setText(\"Tab \" + (position +\
  \ 1) + \" Item\")).attach();\n}\n\n@Override\npublic void onFragmentInteraction(Uri\
  \ uri) {\n\n}\n\n}\n```\n\n代码首先创建了四个标签，并将它们添加到 `TabLayout` 实例中，如下：\n\n```java\n\
  for (int i = 0; i < 4; i++) {\n    binding.tabLayout.addTab(binding.tabLayout.newTab());\n\
  }\n```\n\n接下来，创建一个 `TabPagerAdapter` 类的实例。注意，创建 `TabPagerAdapter` 实例的代码传递了分配给 `TabLayout`\
  \ 组件的标签数量。然后将 `TabPagerAdapter` 实例赋值为 `ViewPager2` 实例的适配器：\n\n```java\nfinal TabPagerAdapter\
  \ adapter = new TabPagerAdapter\n    (this, binding.tabLayout.getTabCount());\n\
  binding.viewPager.setAdapter(adapter);\n```\n\n最后，使用 `TabLayoutMediator` 类的实例来连接\
  \ `TabLayout` 和 `ViewPager2` 对象：\n\n```java\nnew TabLayoutMediator(binding.tabLayout,\
  \ binding.viewPager,\n    (tab, position) -> tab.setText(\"Tab \" + (position +\
  \ 1) + \" Item\")).attach();\n```\n\n该类确保 `TabLayout` 标签与当前选中的碎片（fragment）保持同步。此过程的一部分是确保每个标签上显示正确的文本。在这种情况下，文本被配置为读取“Tab\
  \ <n> Item”，其中 `<n>` 被替换为当前选中标签的编号。\n\n## 46.9 测试应用程序\n\n在设备或模拟器上编译并运行应用，确保选择一个标签会导致相应的碎片显示在屏幕的内容区域：\n\
  \n![](img/as_tablayout_running.jpg)\n\n图 46-6\n\n## 46.10 自定义 TabLayout\n\n此示例项目中的\
  \ `TabLayout` 是使用固定模式（fixed mode）配置的。这种模式适用于标签数量少且标题较短的情况。当使用固定模式时，较数量的标签或较长的标题可能会迅速变成问题，正如图\
  \ 46-7 所示：\n\n![](img/as_tablayout_running_clipped.jpg)\n\n图 46-7\n\n为了让标签适应可用的显示宽度，`TabLayout`\
  \ 使用了多行文本。尽管如此，第二行明显被截断了，导致无法看到完整标题。解决此问题的方案是将 `TabLayout` 切换到可滚动模式（scrollable mode）。在这种模式下，标题以全长度单行格式显示，允许用户通过滑动来水平滚动可用项目，如图\
  \ 46-8 所示：\n\n![](img/as_tablayout_running_scrollable.jpg)\n\n图 46-8\n\n要将 `TabLayout`\
  \ 切换到可滚动模式，只需将 `activity_main.xml` 布局资源文件中的 `app:tabMode` 属性从“fixed”更改为“scrollable”即可：\n\
  \n```xml\n<android.support.design.widget.TabLayout\n    android:id=\"@+id/tabLayout\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"wrap_content\"\
  \n    app:tabMode=\"scrollable\"\n    app:tabGravity=\"fill\"/>\n</android.support.design.widget.AppBarLayout>\n\
  ```\n\n在固定模式下，可以配置 `TabLayout` 以控制标签项的显示方式，以占据屏幕上的可用空间。这通过 `app:tabGravity` 属性控制，其结果在较宽显示器（如横屏下的平板电脑）上更为明显。例如，设置为“fill”时，项目将均匀分布在\
  \ `TabLayout` 的宽度上，如图 46-9 所示：\n\n![](img/as_tablayout_fill.jpg)\n\n图 46-9\n\n将属性值更改为“center”会导致项目相对于标签栏的中心进行定位：\n\
  \n![](img/as_tablayout_center.jpg)\n\n图 46-10\n\n## 46.11 总结\n\n`TabLayout` 是 Android\
  \ Material 设计实现的一部分引入的组件之一。`TabLayout` 组件的目的是展示一系列标签项，这些项在被选中时会向用户显示不同的内容。标签项可以显示文本、图像或两者的结合。与\
  \ `ViewPager2` 类和碎片结合时，可以轻松地创建标签布局，每个标签项的选择都会显示不同的碎片。\n\n## 47. 使用 RecyclerView\
  \ 和 CardView 组件\n\n`RecyclerView` 和 `CardView` 组件共同工作，为用户提供可滚动的信息列表，其中信息以单个卡片的形式呈现。在进行示例项目的设计和实现之前，本章将介绍这两个类的详细信息。\n\
  \n## 47.1 RecyclerView 概述\n\n与“使用操作按钮和 Snackbar”中概述的 `ListView` 类类似，`RecyclerView`\
  \ 的目的是允许向用户展示信息。然而，`RecyclerView` 相比 `ListView` 具有许多优势。特别是 `RecyclerView` 在管理视图方面要高效得多，它会在列表滚动出屏幕时复用构成列表的现有视图，而不是创建新视图（这就是“recycler”回收器命名的由来），这既提升了性能又减少了列表使用的资源。\n\
  \n与 `ListView` 不同，`RecyclerView` 还提供了三种内置布局管理器来控制列表向用户展示的方式：\n\n- `LinearLayoutManager`：列表以水平或垂直滚动的形式呈现。\n\
  \n![](img/Image427.jpg)\n\n图 47-1\n\n- `GridLayoutManager`：列表以网格形式呈现。当列表项具有统一大小时，最适合使用此管理器。\n\
  \n![](img/Image436.jpg)\n\n图 47-2\n\n- `StaggeredGridLayoutManager`：列表以交错网格形式呈现。当列表项大小不统一时，最适合使用此管理器。\n\
  \n![](img/Image443.jpg)\n\n图 47-3\n\n对于三种内置管理器都无法提供所需布局的情况，可以通过扩展 `RecyclerView.LayoutManager`\
  \ 类来实现自定义布局管理器。\n\n`RecyclerView` 中显示的每个列表项都创建为 `ViewHolder` 类的实例。`ViewHolder` 实例包含了\
  \ `RecyclerView` 显示项目所需的所有内容，要显示的信息和显示它的视图布局。\n\n与 `ListView`一样，`RecyclerView` 依赖适配器（adapter）作为\
  \ `RecyclerView` 实例与要显示的数据之间的中间媒介。适配器被创建为 `RecyclerView.Adapter` 的子类，并至少实现以下方法，这些方法会被分配适配器的\
  \ `RecyclerView` 对象在不同点调用：\n\n- `getItemCount()`：此方法必须返回要显示的项目数量。\n- `onCreateViewHolder()`：此方法创建并返回一个带有用于显示数据的视图的\
  \ `ViewHolder` 对象。该视图通常通过填充 XML 布局文件创建。\n- `onBindViewHolder()`：此方法接收由 `onCreateViewHolder()`\
  \ 创建的 `ViewHolder` 对象以及一个指示即将显示的列表项的整数值。`ViewHolder` 对象包含了 `onCreateViewHolder()`\
  \ 方法分配的布局。`onBindViewHolder()` 方法负责向布局中的视图填充对应项目对应的文本和图形，并将对象返回给 `RecyclerView`\
  \ 展示给用户。\n\n\n\n\n\n在布局中添加 `RecyclerView` 只需要在在其要显示的 Activity 的 XML 布局布局文件中添加相应的元素即可。例如：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    app:layout_behavior=\"@string/appbar_scrolling_view_behavior\"\n    tools:context=\"\
  .MainActivity\"\n    tools:showIn=\"@layout/activity_card_demo\">\n    <androidx.recyclerview.widget.RecyclerView\n\
  \        android:id=\"@+id/recycler_view\"\n        android:layout_width=\"0dp\"\
  \n        android:layout_height=\"0dp\"\n        app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        app:layout_constraintEnd_toEndOf=\"parent\"\n        app:layout_constraintStart_toStartOf=\"\
  parent\"\n        app:layout_constraintTop_toTopOf=\"parent\"\n        tools:listItem=\"\
  @layout/card_layout\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n在上面的示例中，`RecyclerView` 被嵌入到主 Activity 布局文件的 `CoordinatorLayout` 中，并与 `AppBar`\
  \ 和 `Toolbar` 在一起。这提供了一些额外功能，例如配置 `Toolbar` 和 `AppBar`，当用户在 `RecyclerView` 中向上滚动时它们会滚出屏幕（该主题在“使用\
  \ AppBar 和折叠 Toolbar 布局]”章节中有更详细的介绍）。\n\n## CardView 概述\n\n`CardView` 类是一种用户界面视图，允许使用卡片比喻来分组显示信息。卡片通常使用\
  \ `RecyclerView` 实例以列表形式呈现，并可以配置为带有阴影效果和圆角。例如[图 47-4]显示了三个配置好的 `CardView` 实例，它们显示一个由一个\
  \ `ImageView` 和两个 `TextView` 组成的布局：\n\n![](img/Image24512.jpg)\n\n图 47-4\n\n使用 `CardView`\
  \ 实例呈现的用户界面布局定义在 XML 布局资源文件中，并在运行时加载到 `CardView` 中。`CardView` 布局可以使用标准布局管理器（如 `RelativeLayout`\
  \ 和 `LinearLayout`）包含任何复杂性的布局。下面的 XML 布局文件表示了一个由 `RelativeLayout` 和单个 `ImageView`\
  \ 组成的卡片视图布局。卡片被配置为提升以创建阴影效果，并带有圆角显示：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<androidx.cardview.widget.CardView\n    xmlns:card_view=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    android:id=\"\
  @+id/card_view\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_margin=\"5dp\"\n    card_view:cardCornerRadius=\"\
  12dp\"\n    card_view:cardElevation=\"3dp\"\n    card_view:contentPadding=\"4dp\"\
  >\n    <RelativeLayout\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  wrap_content\"\n        android:padding=\"16dp\" >\n        <ImageView\n       \
  \     android:layout_width=\"100dp\"\n            android:layout_height=\"100dp\"\
  \n            android:id=\"@+id/item_image\"\n            android:layout_alignParentLeft=\"\
  true\"\n            android:layout_alignParentTop=\"true\"\n            android:layout_marginRight=\"\
  16dp\" />\n    </RelativeLayout>\n</androidx.cardview.widget.CardView>\n```\n\n\
  当与 `RecyclerView` 结合创建一个滚动的卡片列表时，适配 的 `onCreateViewHolder()` 方法会膨胀卡片的布局文件，将其分配给\
  \ `ViewHolder` 实例并返回给 `RecyclerView` 实例。\n\n## 总结\n\n本章介绍了 Android `RecyclerView`\
  \ 和 `CardView` 组件。`RecyclerView` 提供了一种资源高效的方式，在 Android 应用中显示可滚动视图列表。当以卡片形式呈现分组数据（例如姓名和地址列表）时，`CardView`\
  \ 非常有用。正如之前概述，并在下一章的教程中演示的那样，`RecyclerView` 和 `CardView` 结合使用时特别有用。\n\n## RecyclerView\
  \ 和 CardView 教程\n\n在本章中将创建一个示例项目，该项目将利用 `CardView` 和 `RecyclerView` 组件来创建一个滚动的卡片列表。完成后的应用将显示包含图像和文本的卡片列表。除了显示卡片列表外，项目还将实现为：选择卡片将向用户显示消息。\n\
  \n### 创建 CardDemo 项目\n\n从欢迎界面选择 `New Project` 选项，在结果的项目对话框中，点击 `Next` 按钮之前选择 `Basic\
  \ Activity (Material3)` 模板。在 `Name` 字段中输入 `CardDemo` 并指定 `com.ebookrenzy.carddemo`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将语言菜单设置为\
  \ `Java`。\n\n### 修改 Basic Activity\n\n由于选择了 `Basic Activity`，布局包含了一个此项目并不需要的悬浮按钮。将\
  \ `activity_main.xml` 布局文件加载到布局编辑器中，选择悬浮按钮并按删除键从布局中移除。编辑 `MainActivity.java` 文件，在\
  \ `onCreate` 方法中移除悬浮按钮代码，如下：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ ActivityMainBinding.inflate(getLayoutInflater());\n    setContentView(binding.getRoot());\n\
  \    setSupportActionBar(binding.toolbar);\n    NavController navController = Navigation.findNavController(this,\
  \ R.id.nav_host_fragment_main);\n    appBarConfiguration = new AppBarConfiguration.Builder(navController.getGraph()).build();\n\
  \    NavigationUI.setupActionBarWithNavController(this, navController, appBarConfiguration);\n\
  \    binding.fab.setOnClickListener(new View.OnClickListener() {\n        @Override\n\
  \        public void onClick(View view) {\n            Snackbar.make(view, \"替换为你自己的操作\"\
  , Snackbar.LENGTH_LONG)\n                .setAction(\"Action\", null).show();\n\
  \        }\n    });\n}\n```\n\n此外，移除 `onSupportNavigateUp()` 方法，然后打开 `content_main.xml`\
  \ 文件并从布局中删除 `nav_host_fragment_main` 对象，只保留 `ConstraintLayout` 父容器。\n\n### 设计 CardView\
  \ 布局\n\n卡片内部包含视图布局将定义在一个独立的 XML 布局文件中。在项目窗口中右键点击 `app -> res -> layout` 项，选择 `New\
  \ -> Layout Resource File` 菜单选项。在新资源对话框中，在 `File name:` 字段中输入 `card_layout`并在 `root\
  \ element` 字段中输入 `androidx.cardview.widget.CardView`，然后点击 `OK` 按钮。\n\n将 `card_layout.xml`\
  \ 文件加载到布局编辑器中，切换到代码模式并修改布局如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<androidx.cardview.widget.CardView\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"wrap_content\"\n    android:id=\"@+id/card_view\"\
  \n    android:layout_margin=\"5dp\"\n    app:cardBackgroundColor=\"#81C784\"\n \
  \   app:cardCornerRadius=\"12dp\"\n    app:cardElevation=\"3dp\"\n    app:contentPadding=\"\
  4dp\" >\n```\n\n\n\n\n\n```xml\n<androidx.cardview.widget.CardView \n    android:id=\"\
  @+id/relativeLayout\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
  wrap_content\"\n    android:padding=\"16dp\">\n\n    <androidx.constraintlayout.widget.ConstraintLayout>\n\
  \        <ImageView\n            android:id=\"@+id/itemImage\"\n            android:layout_width=\"\
  100dp\"\n            android:layout_height=\"100dp\"\n            app:layout_constraintLeft_toLeftOf=\"\
  parent\"\n            app:layout_constraintStart_toStartOf=\"parent\"\n        \
  \    app:layout_constraintTop_toTopOf=\"parent\" />\n        <TextView\n       \
  \     android:id=\"@+id/itemTitle\"\n            android:layout_width=\"236dp\"\n\
  \            android:layout_height=\"39dp\"\n            android:layout_marginStart=\"\
  16dp\"\n            android:textSize=\"30sp\"\n            app:layout_constraintLeft_toRightOf=\"\
  @+id/itemImage\"\n            app:layout_constraintStart_toEndOf=\"@+id/itemImage\"\
  \n            app:layout_constraintTop_toTopOf=\"parent\" />\n        <TextView\n\
  \            android:id=\"@+id/itemDetail\"\n            android:layout_width=\"\
  236dp\"\n            android:layout_height=\"16dp\"\n            android:layout_marginStart=\"\
  16dp\"\n            android:layout_marginTop=\"8dp\"\n            app:layout_constraintLeft_toRightOf=\"\
  @+id/itemImage\"\n            app:layout_constraintStart_toEndOf=\"@+id/itemImage\"\
  \n            app:layout_constraintTop_toBottomOf=\"@+id/itemTitle\" />\n    </androidx.constraintlayout.widget.ConstraintLayout>\n\
  </androidx.cardview.widget.CardView>\n```\n\n## 48.4 添加 RecyclerView\n\n选择 `content_main.xml`\
  \ 布局文件，并将调色板中“容器”（Containers）部分中的 `RecyclerView` 对象拖放并放置到布局中，使其位于屏幕中心，此时它将自动调整大小以填充整个屏幕。使用“推断约束”（Infer\
  \ constraints）工具栏按钮为该视图添加任何缺失的布局约束。使用属性（Attributes）工具窗口，将 `RecyclerView` 实例的 ID\
  \ 更改为 `recyclerView`，并将 `layout_width` 和 `layout_height` 属性更改为 `match_constraint`。\n\
  \n## 48.5 添加图片\n\n除了两个 `TextView` 之外，卡片布局还包含一个 `ImageView`，该视图已配置了适配器以显示图片。在测试项目之前，必须添加这些图片。项目将使用的图片命名为\
  \ `android_image_<n>.jpg`，可以在以下 URL 下载的示例代码的 `project_icons` 文件夹中找到：\n\nhttps://www.ebookfrenzy.com/retail/chipmunkjava/index.php\n\
  \n在你的操作系统的文件系统导航器中找到这些图片，选择并复制这 8 张图片。在项目工具窗口中，右键点击 `app` -> `res` -> `drawable`\
  \ 项，并选择“粘贴”（Paste）将文件添加到文件夹中：\n\n![](img/Image2422.jpg)\n图 48-1\n\n## 48.6 创建 RecyclerView\
  \ 适配器\n\n如上一节所述，`RecyclerView` 需要一个适配器来处理列表项的创建。在项目窗口中，右键点击 `app` -> `com` -> `ebookfrenzy`\
  \ -> `demo` 项，选择 `New` -> `Java Class` 向项目添加此新类。在新类对话框中，在 `Name` 字段中输入 `RecyclerAdapter`，并在列表中选择\
  \ `Class`，然后按回车创建新的 Java 文件。\n\n编辑新的 `RecyclerAdapter.java` 文件以添加一些导入语句并声明该类继承自\
  \ `RecyclerView.Adapter`。与其创建一个单独类来提供要显示的数据，不如向适配器中添加一些基础数组作为应用的数据：\n\n```java\n\
  package com.frenzy.demo;\n\nimport android.view.LayoutInflater;\nimport android.view.View;\n\
  import android.view.ViewGroup;\nimport android.widget.ImageView;\nimport android.widget.TextView;\n\
  import androidx.recyclerview.widget.RecyclerView;\n\npublic class RecyclerAdapter\
  \ extends RecyclerView.Adapter<RecyclerAdapter.ViewHolder> {\n    private String[]\
  \ titles = {\"Chapter One\", \"Chapter Two\", \"Chapter Three\", \"Chapter Four\"\
  , \"Chapter Five\", \"Chapter Six\", \"Chapter Seven\", \"Chapter Eight\"};\n  \
  \  private String[] details = {\"Item one details\", \"Item two details\", \"Item\
  \ three details\", \"Item four details\", \"Item five details\", \"Item six details\"\
  , \"Item seven details\", \"Item eight details\"};\n    private int[] images = {R.drawable.android_image_1,\
  \ R.drawable.android_image_2, R.drawable.android_image_3, R.drawable.android_image_4,\
  \ R.drawable.android_image_5, R.drawable.android_image_6, R.drawable.android_image_7,\
  \ R.drawable.android_image_8 };\n}\n```\n\n现在我们在 `RecyclerAdapter` 类中需要对 `ViewHolder`\
  \ 类进行我们自己的实现，并配置以引用 `card_layout.xml` 文件中的视图元素。保持在 `RecyclerAdapter.java` 文件中，按如下实现此类：\n\
  \n```java\npublic class RecyclerAdapter extends RecyclerView.Adapter<RecyclerAdapter.ViewHolder>\
  \ {\n\n    static class ViewHolder extends RecyclerView.ViewHolder {\n        ImageView\
  \ itemImage;\n        TextView itemTitle;\n        TextView itemDetail;\n\n    \
  \    ViewHolder(View itemView) {\n            super(itemView);\n            itemImage\
  \ = itemView.findViewById(R.id.itemImage);\n            itemTitle = itemView.findViewById(R.id.itemTitle);\n\
  \            itemDetail = itemView.findViewById(R.id.itemDetail);\n        }\n \
  \   }\n}\n```\n\n`ViewHolder` 类包含一个 `ImageView` 和两个 `TextView` 变量，并有一个构造方法来初始化这些变量以引用\
  \ `card_layout.xml` 中的项。\n\n`RecyclerAdapter.java` 的下一项是 `onCreateViewHolder()`\
  \ 方法的实现：\n\n```java\n@NonNull\n@Override\npublic ViewHolder onCreateViewHolder(ViewGroup\
  \ viewGroup, int i) {\n    View v = LayoutInflater.from(viewGroup.getContext())\n\
  \            .inflate(R.layout.card_layout, viewGroup, false);\n    return new ViewHolder(v);\n\
  }\n```\n\n此方法由 `RecyclerView` 调用以获取 `ViewHolder` 对象。它加载 `card_layout.xml` 视图层级并创建一个\
  \ `ViewHolder` 实例，然后将其返回。\n\n`onBindViewHolder()` 方法的作用是用显示的数据填充 `ViewHolder` 对象中的视图层级。它接收\
  \ `ViewHolder` 对象和一个表示要显示列表项的整数值。现在应该添加该方法，使用项目索引访问数据数组：\n\n```java\n@Override\n\
  public void onBindViewHolder(ViewHolder viewHolder, int i) {\n    viewHolder.itemTitle.setText(titles[i]);\n\
  \    viewHolder.itemDetail.setText(details[i]);\n    viewHolder.itemImage.setImageResource(images[i]);\n\
  }\n```\n\n适配器类的最后一个要求是实现 `getItemCount()` 方法，在这种情况下，它简单返回 `titles` 数组的长度：\n\n```java\n\
  @Override\npublic int getItemCount() {\n    return titles.length;\n}\n```\n\n##\
  \ 48.7 初始化 RecyclerView 组件\n\n到此时，项目包含一个 `RecyclerView` 实例、`CardView` 实例的 XML 布局文件以及一个\
  \ `RecyclerView` 适配器。在测试目前进展之前的最后一步是使用布局管理器初始化 `RecyclerView`，创建适配器实例并将将其分配给 `RecyclerView`\
  \ 对象。对于此示例，`RecyclerView` 将配置为使用 `LinearLayoutManager` 布局选项。\n\n\n\n\n这里稍微有点复杂，因为我们需要能够使用视图绑定（view\
  \ binding）从 `MainActivity` 类内部访问 `recyclerView` 组件。问题是 `recyclerView` 包含在 `content_main.xml`\
  \ 布局文件中，而该文件又包含在 `activity_main.xml` 文件中。为了能够访问 `content_main.xml` 文件，我们需要在它被包含时为其分配一个\
  \ id。要对此操作，请编辑 `activity_main.xml` 文件并修改 `include` 元素，使其如下所示：\n\n```xml\n<include\n\
  \    android:id=\"@+id/contentMain\"\n    layout=\"@layout/content_main\" />\n```\n\
  \n为被包含的文件分配 id 之后，可以使用以下绑定访问 `recyclerView` 组件：\n\n现在编辑 `MainActivity.java` 文件并修改\
  \ `onCreate()` 方法以实现初始化代码：\n\n```java\npackage com.ebookfrenzy.carddemo;\n\nimport\
  \ androidx.appcompat.app.AppCompatActivity;\nimport androidx.appcompat.widget.Toolbar;\n\
  import androidx.recyclerview.widget.LinearLayoutManager;\nimport androidx.recyclerview.widget.RecyclerView;\n\
  import android.view.View;\nimport android.view.Menu;\nimport android.view.MenuItem;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private RecyclerView\
  \ recyclerView;\n    private RecyclerView.LayoutManager layoutManager;\n    private\
  \ RecyclerView.Adapter adapter;\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        setSupportActionBar(toolbar);\n        layoutManager\
  \ = new LinearLayoutManager(this);\n        binding.contentMain.recyclerView.setLayoutManager(layoutManager);\n\
  \        adapter = new RecyclerAdapter();\n        binding.contentMain.recyclerView.setAdapter(adapter);\n\
  \    }\n}\n```\n\n## 48.8 测试应用程序\n\n在物理设备或模拟器会话上编译并运行应用，滚动列表中的不同卡片项：\n\n![](img/as_card_demo_running.jpg)\n\
  \n图 48-2\n\n## 48.9 响应卡片选择\n\n此项目的最后一个阶段是使列表中的卡片变为可选，这样点击卡片时就会触发应用内的事件。对于此示例，卡片将被配置为在用户点击时在屏幕上显示消息。为了响应点击，需要修改\
  \ `ViewHolder` 类，为每个项目视图分配一个 `onClickListener`。编辑 `RecyclerAdapter.java` 文件并修改 `ViewHolder`\
  \ 类声明，使其如下所示：\n\n```java\nimport com.google.android.material.snackbar.Snackbar;\n\
  \nclass ViewHolder extends RecyclerView.ViewHolder {\n    ImageView itemImage;\n\
  \    TextView itemTitle;\n    TextView itemDetail;\n\n    ViewHolder(View itemView)\
  \ {\n        super(itemView);\n        itemImage = itemView.findViewById(R.id.item_image);\n\
  \        itemTitle = itemView.findViewById(R.id.item_title);\n        itemDetail\
  \ = itemView.findViewById(R.id.item_detail);\n        itemView.setOnClickListener(new\
  \ View.OnClickListener() {\n            @Override public void onClick(View v) {\n\
  \            }\n        });\n    }\n}\n```\n\n在 `onClick` 处理程序的体内部，现在可以添加代码来显示指示卡片已被点击的消息。鉴于点击后执行的操作可能取决于点击了哪张卡片，因此识别所选的卡片也很重要。此信息可以通过调用\
  \ `RecyclerView.ViewHolder` 类的 `getAdapterPosition()` 方法获取。留在 `RecyclerAdapter.java`\
  \ 文件中，向 `onClick` 处理程序中添加代码，使其如下所示：\n\n```java\n@override\npublic void onClick(View\
  \ v) {\n    int position = getAdapterPosition();\n    Snackbar.make(v, \"Click detected\
  \ on item \" + (position + 1),\n            Snackbar.LENGTH_LONG)\n            .setAction(\"\
  Action\", null).show();\n}\n```\n\n最后一个任务是启用点击时的 Material Design 涟波效果（ripple effect）。这仅涉及向\
  \ `card_layout.xml` 中的 `CardView` 实例中添加一些属性：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<androidx.cardview.widget.CardView\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    android:id=\"@+id/card_view\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    android:layout_margin=\"5dp\"\n    app:cardBackgroundColor=\"#81C784\"\n \
  \   app:cardRadius=\"12dp\"\n    app:cardElevation=\"3dp\"\n    android:contentPadding=\"\
  4dp\"\n    android:clickable=\"true\"\n    android:foreground=\"?selectableItemBackground\"\
  >\n```\n\n## 48.10 总结\n\n本章介绍了了结合 `CardView` 和 `RecyclerView` 组件以显示可滚动列表的步骤。示例还涵盖了对列表项目的点击检测，包括识别所选项目以及启用涟波效果视觉反馈。\n\
  \n# 49 布局编辑器教程\n\n在用户界面布局的设计阶段，`RecyclerView` 实例（图 49-1）与在上一章末尾测试的运行应用几乎没有相似之处。当用户界面中要显示的内容只有在应用安装后才生成或获取时，这是一个经常发生的问题。\n\
  \n长期以来，Android Studio 布局编辑器一直提供指定仅在设计布局时激活的简单属性的功能。例如，可以将仅设计时的字符串资源分配给布局编辑器中的 `TextView`，而它在应用运行时不会显示。随着\
  \ Android 布局编辑器中引入示例数据支持，这一功能得到了显著扩展，并在本章中使用它。\n\n## 49.1 为项目添加示例数据\n\n为了演示示例数据的使用，现在将对项目进行修改，以便在布局编辑器中让完整填充的卡片出现在\
  \ `RecyclerView` 中。在此之前，值得注意的是，布局编辑器有一组预配置的示例数据模板，可以在设计用户界面时使用。要查看这些效果，请加载 `content_main.xml`\
  \ 布局文件到布局编辑器并选择 `RecyclerView` 实例。右键点击 `RecyclerView` 并选择 `Set Sample Data` 菜单选项以显示设计时视图属性面板：\n\
  \n![](img/as_3.2_design_time_attributes.jpg)\n\n图 49-2\n\n将模板更改为电子邮件客户端（Email Client）选项并将项目计数改为\
  \ 12，注意 `RecyclerView` 会变化以显示来自模板的数据：\n\n![](img/as_3.6_recyclerview_sample_data_email.jpg)\n\
  \n图 49-3\n\n\n\n\n这些模板可以用于在无需任何额外工作的情况下显示示例数据，并且通常足够完成布局设计。然而，在本示例中，将使用示例数据来显示 `RecyclerView`\
  \ 中的卡片，就像它们在应用中预期显示一样。在布局编辑器中仍加载 `content_main.xml` 文件的情况下，切换到代码（Code）模式并找到 `RecyclerView`\
  \ 元素，其内容如下：\n\n```xml\n<androidx.recyclerview.widget.RecyclerView\n    android:id=\"\
  @+id/recyclerView\"\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  0dp\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    tools:itemCount=\"12\"\n    tools:listitem=\"@layout/recycler_view_item\"\
  \ />\n```\n\n注意当前配置的两个 `tools` 属性，它们用于在列表中显示 12 个项目，每个项目都使用名为 `recycler_view_xml`\
  \ 文件中包含的布局。布局编辑器提供了一系列可以在布局文件中配置的 `tools` 选项。虽然对所有这些设置的介绍超出了本书的范围，但可以在以下 URL 找到每个设置的描述：https://developer.android.com/studio/tools#attributes\n\
  \n上述引用的 `recycler_view_item.xml` 文件是在选择示例数据模板时由布局编辑器自动生成的，可以在项目（Project）窗口中找到。切换回设计（Design）模式，在选中\
  \ `RecyclerView` 时，使用设计时视图属性（Design-time View Attributes）面板将模板切换回默认值。`recycler_view_item.xml`\
  \ 文件将从项目中删除，同时 `content_main.xml` 文件中的 `tools` 属性行也会被删除（如果 Android Studio 未能删除它们，可以从代码视图中手动删除）。\n\
  \n要切换到使用卡片布局显示示例数据，请添加 `tools:listitem` 属性以引用 `card_layout.xml` 文件。在布局中选中 `RecyclerView`\
  \ 后，在属性（Attributes）窗口中搜索 `tools:listitem` 属性，并在字段中输入 `@layout/card_layout`，如图 49-4\
  \ 所示：\n\n![](img/as_4.1_sample_data_list_item.jpg)\n\n切换回设计模式，注意每个项目现在都显示了卡片布局，尽管没有任何图像且使用的是示例文本：\n\
  \n![](img/as_3.6_recyclerview_sample_data_car_layout.jpg)\n\n下一步是在卡片布局的视图中显示一些图像和不同的文本。这既可以是布局编辑器提供的示例数据形式，也可以是专门为此项目添加的自定义数据。将\
  \ `card_layout.xml` 文件加载到布局编辑器中，选中 `ImageView` 并按照本章早些时候显示设计时视图属性面板。从 `srcCompat`\
  \ 菜单中选择内置背景图像集，如图 49-6 所示：\n\n![](img/as_3.6_recyclerview_sample_data_background_images.jpg)\n\
  \n接下来，右键点击 `itemTitle` `TextView` 对象，选择“示例数据”（Sample Data）菜单选项，并在设计时属性面板中选择 `cities`\
  \ 文本。对 `itemDetail` 视图重复此步骤，这次如图 49-7 所示选择 `full_names` 选项：\n\n![](img/as_3.6_recyclerview_sample_data_full_names.jpg)\n\
  \n在设计模式下打开 `content_main.xml` 文件，注意 `RecyclerView` 现在正在使用内置图像和示例数据：\n\n![](img/as_3.6_recyclerview_sample_data_cities.jpg)\n\
  \n## 49.2 使用自定义示例数据\n\n本章的最后一步是演示如何在布局编辑器中使用自定义示例数据和图像。这需要创建一个示例数据目录并添加一些文本和图像文件。在项目（Project）窗口中，右键点击\
  \ `app` 条目并选择 `New -> Sample Data Directory`（新建示例数据目录）选项，此时项目窗口中将一个名为 `sampledata`\
  \ 的新目录。如果看不到新文件夹，请将项目窗口从 Android 模式切换到 Project 模式，并在 `CardDemo -> app` 下找到该文件夹，如图\
  \ 49-9 所示：\n\n![](img/as_4.2_sample_data_folder.jpg)\n\n再次右键点击 `sampledata` 目录，创建一个名为\
  \ `images` 的子目录，并按照上一章概述的步骤将 Android 图像复制并粘贴到新文件夹中。再次显示 `ImageView` 的设计时视图属性面板，这次点击\
  \ `Browse`（浏览）链接并在资源（Resources）对话框中选择新添加的 Android 图像（如果没有图像文件夹，请尝试重建项目）：\n\n![](img/as_4.1_sample_data_pick_drawing.jpg)\n\
  \n再次右键点击 `sampledata` 目录，选择 `New -> File`（新建文件）选项，将文件命名为 `chapters`，在注册新类型（Register\
  \ New File Type）对话框中选择 `Text`，并输入以下内容：\n\n```\nChapter One\nChapter Two\nChapter\
  \ Three\nChapter Four\nChapter Five\nChapter Six\nChapter Seven\nChapter Eight\n\
  ```\n\n接下来创建一个名为 `items` 的第二个文本文件，内容如下：\n\n```\nItem one details\nItem two details\n\
  Item three details\nItem four details\nItem five details\nItem six details\nItem\
  \ seven details\nItem eight details\n```\n\n创建示例数据文本文件后，剩下的就是在 `card_layout.xml`\
  \ 文件的视图元素中引用它们，如下：\n\n```xml\n<TextView\n    android:id=\"@+id/itemTitle\"\n   \
  \ android:layout_width=\"236dp\"\n    android:layout_height=\"39dp\"\n    android:layout_marginStart=\"\
  16dp\"\n    android:textSize=\"30sp\"\n    app:layout_constraintLeft_toRightOf=\"\
  @+id/itemImage\"\n    app:layout_constraintStart_toEndOf=\"@+id/itemImage\"\n  \
  \  app:layout_constraintTop_toTopOf=\"parent\"\n    tools:text=\"@chapters\" />\n\
  \n<TextView\n    android:id=\"@+id/itemDetail\"\n    android:layout_width=\"236dp\"\
  \n    android:layout_height=\"39dp\"\n    android:layout_marginStart=\"16dp\"\n\
  \    android:textSize=\"30sp\"\n    app:layout_constraintLeft_toRightOf=\"@+id/itemImage\"\
  \n    app:layout_constraintStart_toEndOf=\"@+id/itemImage\"\n    app:layout_constraintTop_toBottomOf=\"\
  @+id/itemTitle\"\n    tools:text=\"@items\" />\n```\n\n返回 `content_main.xml` 文件的布局设计，自定义示例数据和图像现在应该显示在\
  \ `RecyclerView` 中：\n\n![](img/as_3.6_sample_data_running.jpg)\n\n与其使用两个文本文件和图像集的引用，另一种选项是在\
  \ JSON 文件中声明示例数据。例如\n\n```json\n{\n  \"mydata\": [\n    {\n      \"chapter\": \"\
  Chapter One\",\n      \"details\": \"Item one details\",\n      \"image\": \"@sample/images\"\
  \n    },\n    {\n      \"chapter\": \"Chapter Two\",\n      \"details\": \"Item\
  \ two details\",\n      \"image\": \"@sample/images\"\n    }\n  ]\n}\n```\n\n##\
  \ 49.3 总结\n\n本章演示了在布局编辑器中使用示例数据，以提供用户界面运行时外观的更真实表示。本教程涵盖的步骤包括使用现有的示例数据模板以及集成自定义示例数据。\n\
  \n\n\n\n在本章中，我们将探索如何自定义 Activity 布局中的应用栏（app bar），使其对屏幕上其他视图发生的滚动事件做出响应。通过结合使用 `CoordinatorLayout`\
  \ 与 `AppBarLayout` 以及 `CollapsingToolbarLayout` 容器，可以配置应用栏显示图像，并使其在视图中淡入淡出动画效果。例如，可以配置列表的向上滚动动作，使应用栏从视图中退回，并在执行向下滚动动作时重新出现。\n\
  \n本章将从概述组成应用栏的元素开始，然后介绍各种应用栏配置的示例。\n\n## 50.1 AppBar 的结构分析\n\n应用栏是应用运行时显示在屏幕顶部的区域，它可以配置为包含各种不同的项目，包括状态栏（status\
  \ bar）、工具栏（toolbar）、标签栏（tab bar）和灵活空间区域。例如，图 50-1 显示了一个包含状态栏、工具栏和标签栏的应用栏：\n\n![](img/Image24271.jpg)\n\
  \n图 50-1\n\n灵活空间区域可以使用空白背景色填充，或者如图 50-2 所示，在 `ImageView` 对象上显示图像：\n\n![](img/Image24361.jpg)\n\
  \n图 50-2\n\n正如本章剩余部分将演示的，如果 Activity 用户界面布局的主内容区域包含可滚动的内容，当屏幕内容滚动时，应用栏的元素可以配置为展开和收缩。\n\
  \n## 50.2 示例项目\n\n为了本示例，将对前面的章节中创建的 `CardDemo` 项目进行修改，该项目标题为“Android RecyclerView\
  \ 和 CardView 教程”。首先启动 Android Studio 并加载此项目。\n\n项目加载后，运行应用，并注意当向上滚动列表时，工具栏如图 50-3\
  \ 所示保持可见的：\n\n![](img/as_card_demo_app_bar.jpg)\n\n图 50-3\n\n第一步是进行一些配置更改，使工具栏在向上滚动过程中收缩，并在向下滚动时展开。\n\
  \n## 50.3 协调 RecyclerView 和工具栏\n\n将 `activity_main.xml` 文件加载到 Layout Editor 工具中，切换到\
  \ Code 模式并查看 XML 布局设计，其层级结构如图 50-4 中的图所示：\n\n![](img/as3.0_appbar_coordinatorlayout_tree.jpg)\n\
  \n图 50-4\n\n层级结构的顶层是 `CoordinatorLayout`，正如其名称所示，它协调其包含的各种子视图元素之间的交互。例如在“使用浮动按钮和\
  \ Snackbar”中提到的，`CoordinatorLayout` 会在 `Snackbar` 出现时自动将浮动按钮向上滑动以腾纳其出现，然后在状态栏消失后将按钮向下移动。\n\
  \n`CoordinatorLayout` 同样可以用于根据视图层级中某些视图的滚动动作，使应用栏的元素滑入或滑出视图。在图 50-4 所示的布局层级中，其中一个元素是\
  \ `ConstraintLayout`。为了实现这种协调行为，需要在发生滚动的元素以及与滚动协调的元素上都设置属性。\n\n在滚动元素上（在本例中为 `RecyclerView`），必须将\
  \ `android:layout_behavior` 属性设置为 `appbar_scrolling_view_behavior`。在 `content_main.xml`\
  \ 文件中，找到顶层 `ConstraintLayout` 元素，并注意该属性已设置默认值：\n\n```xml\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    app:layout_behavior=\"@string/appbar_scrolling_view_behavior\" >\n```\n\n\
  接下来，在布局编辑器中打开 `activity_main.xml` 文件，切换到 Code 模式并找到 `AppBarLayout` 元素。注意视图层级中 `AppBarLayout`\
  \ 的唯一子元素是 `Toolbar`。为了让工具栏对 `RecyclerView` 中发生的滚动事件做出响应，必须在该元素上设置 `app:layout_scrollFlags`\
  \ 属性。分配给此属性的值取决于所需的交互性质，并且必须由以下一个或多个值组成：\n\n- `scroll` – 表示视图将被滚出屏幕。如果不设置此项，视图在滚动事件期间将固定固定在屏幕顶部。\n\
  - `enterAlways` – 与 `scroll` 选项结合使用时，向上滚动动作会导致视图收回。在此模式下，任何向下滚动动作都会导致视图重新出现。\n-\
  \ `enterAlwaysCollapsed` – 设置在视图上时，在向下滚动动作达到列表限制之前，该视图将不会从折叠状态展开。如果设置了 `minHeight`，该视图在向下滚动达到列表限制之前不会从折叠状态展开。\n\
  - `exitUntilCollapsed` – 设置后，视图在向上运动期间折叠直到达到最小高度，此时将保持在该高度，直到滚动方向发生变化。例如：`app:layout_scrollFlags=\"\
  scroll|enterAlwaysCollapsed\"` `android:minHeight=\"20dp\"`\n\n为了本示例，将在 `Toolbar`\
  \ 上设置 `scroll` 和 `enterAlways` 选项如下：\n\n```xml\n<com.google.android.material.appbar.MaterialToolbar\n\
  \    android:id=\"@+id/toolbar\"\n    android:layout_width=\"match_parent\"\n  \
  \  android:layout_height=\"?attr/actionBarSize\"\n    app:layout_scrollFlags=\"\
  scroll|enterAlways\" />\n```\n\n设置好属性后，再次运行应用并在 `RecyclerView` 中进行向上滚动动作。这会导致工具栏折叠出视图（参见图\
  \ 50-5）。向下滚动动作将使工具栏重新出现。\n\n![](img/as_collapsed_toolbar.jpg)\n\n图 50-5\n\n## 50.4\
  \ 引入折叠工具栏布局 (CollapsingToolbarLayout)\n\n`CollapsingToolbarLayout` 容器通过提供更广泛的选项和对响应协调滚动动作的折叠控制水平，增强了标准工具栏。`CollapsingToolbarLayout`\
  \ 类旨在作为 `AppBarLayout` 的子添加，并提供了如在工具栏折叠和展开时自动调整工具栏标题字体的功能。视差模式（parallax mode）允许应用栏中的指定内容在折叠时从视图中消失，而固定模式（pin\
  \ mode）允许应用栏元素在收缩期间保持固定位置。\n\n还可用 scrim 选项来指定在折叠序列期间工具栏应过渡的颜色。\n\n为了演示这些功能，将修改 `activity_main.xml`\
  \ 文件中包含的应用栏，以使用 `CollapsingToolbarLayout` 类，并添加一个 `ImageView` 以更好地演示视差模式的效果。使用 `CollapsingToolbarLayout`\
  \ 的新视图层级如图 50-6 中的图所示：\n\n![](img/as3.0_appbar_collapsing_tree.jpg)\n\n图 50-6\n\n\
  \n\n将 `activity_main.xml` 文件加载到布局编辑器（Layout Editor）的代码模式中，并修改布局使其内容如下：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.coordinatorlayout.widget.CoordinatorLayout\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    android:fitsSystemWindows=\"true\"\n    tools:context=\".MainActivity\">\n\
  \    <com.google.android.material.appbar.AppBarLayout\n        android:layout_width=\"\
  match_parent\"\n        android:layout_height=\"wrap_content\"\n        android:fitsSystemWindows=\"\
  true\">\n        <com.google.android.material.appbar.CollapsingToolbarLayout\n \
  \           android:id=\"@+id/collapsing_toolbar\"\n            android:layout_width=\"\
  match_parent\"\n            android:layout_height=\"match_parent\"\n           \
  \ app:layout_scrollFlags=\"scroll|enterAlways\"\n            android:fitsSystemWindows=\"\
  true\"\n            app:expandedTitleMarginBottom=\"30dp\"\n            app:expandedTitleMarginStart=\"\
  15dp\"\n            app:expandedTitleMarginEnd=\"64dp\">\n            <ImageView\n\
  \                android:id=\"@+id/backdrop\"\n                android:layout_width=\"\
  match_parent\"\n                android:layout_height=\"200dp\"\n              \
  \  android:scaleType=\"centerCrop\"\n                android:fitsSystemWindows=\"\
  true\"\n                app:layout_collapseMode=\"parallax\"\n                android:src=\"\
  @drawable/appbar_image\" />\n            <com.google.android.material.appbar.MaterialToolbar\n\
  \                android:id=\"@+id/toolbar\"\n                android:layout_width=\"\
  match_parent\"\n                android:layout_height=\"?attr/actionBarSize\"\n\
  \                app:layout_scrollFlags=\"scroll|enterAlways\"\n               \
  \ app:layout_collapseMode=\"pin\" />\n        </com.google.android.material.appbar.CollapsingToolbarLayout>\n\
  \    </com.google.android.material.appbar.AppBarLayout>\n    <include\n        android:id=\"\
  @+id/contentMain\"\n        layout=\"@layout/content_main\" />\n</androidx.coordinatorlayout.widget.CoordinatorLayout\n\
  ```\n\n除了向上述布局添加新元素外，还移除了背景颜色设置。此更改的优点是提供了一个透明的工具栏，允许应用程序中显示更多的图像。\n\n使用你操作系统的文件系统，在书籍代码示例的\
  \ `project_icons` 文件夹中找到 `appbar_image.jpg` 文件并复制。在 Project 窗口中右键点击 `res -> drawable`\
  \ 项并选择“粘贴”。运行时，应用栏显示应如图 50-7 (image/as_card_demo_app_image.jpg) 所示。\n\n向上滚动列表将导致应用栏逐渐折叠。在收缩过程中，图像将淡出为\
  \ `scrim` 属性定义的颜色，同时标题字体大小将按相应比例缩小，直到只看到工具栏：image/as_card_demo_app_image_collapsed.jpg\
  \ 图 50-8。\n\n在滚动动作的初始阶段，工具栏保持可见（如果继续向上滚动，工具栏也将移出视图），因为 `activity_main.xml` 文件中的工具栏元素被配置为使用\
  \ `app:layout_collapseMode=\"pin\"`。如果将折叠模式设置为 `parallax`，工具栏将与图像视图一起收回。继续向上滚动动作会导致工具栏也折叠，只留状态栏可见：image/as_card_demo_app_image_hidden.jpg\
  \ 图 50-9。\n\n由于 `CollapsingToolbarLayout` 元素的 `scrollFlags` 属性包含了 `enterAlways`\
  \ 选项，向下滚动动作将导致应用栏再次展开。要固定工具栏使其在向上滚动过程中不再移出视图，请将 `activity_main.xml` 文件中 `CollapsingToolbarLayout`\
  \ 元素的 `layout_scrollFlags` 属性将 `enterAlways` 替换为 `exitUntilCollapsed`，如下所示：\n\n\
  ```xml\n<com.google.android.material.appbar.CollapsingToolbarLayout\n    android:id=\"\
  @+id/collapsing_toolbar\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
  match_parent\"\n    app:layout_scrollFlags=\"scroll|exitUntilCollapsed\"\n    android:fitsSystemWindows=\"\
  true\"\n    app:expandedTitleMarginBottom=\"30dp\"\n    app:expandedTitleMarginStart=\"\
  15dp\"\n    app:expandedTitleMarginEnd=\"64dp\">\n```\n\n## 50.5 更改标题和遮罩（Scrim）颜色\n\
  \n作为最后一项任务，编辑 `MainActivity.java` 文件并在 `onCreate()` 方法中添加一些代码，以更改折叠布局实例上的标题文本并设置不同的遮罩颜色（注意，遮罩颜色也可以在布局资源文件中设置）：\n\
  \n```java\npackage com.ebookrenzy.carddemo;\n\nimport com.google.android.material.appbar.CollapsingToolbarLayout;\n\
  import android.graphics.Color;\n\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \    setContentView(binding.getRoot());\n    setSupportActionBar(binding.toolbar);\n\
  \    binding.collapsingToolbar.setTitle(\"My Toolbar Title\");\n    binding.collapsingToolbar.setContentScrimColor(Color.GREEN);\n\
  \    layoutManager = LinearLayoutManager(this);\n    binding.contentMain.recyclerView.setLayoutManager(layoutManager);\n\
  \    adapter = newyclerAdapter();\n    binding.contentMain.recyclerView.setAdapter(adapter);\n\
  }\n```\n\n最后运行一次应用程序，注意新标题出现在应用栏中，并且滚动现在会导致工具栏在移出视图时变为绿色。\n\n## 50.6 总结\n\n大多数 Android\
  \ 应用顶部的应用栏由许多不同的元素组成，包括工具栏、标签布局甚至图像视图。当嵌入 `CoordinatorLayout` 父运行时，有许多选项可以控制应用栏响应活动内容滚动事件的方式。为了获得更大的控制，`CollapsingToolbarLayout`\
  \ 管理器提供了一系列额外的控制级别，用于控制应用栏内容相对于滚动的展开和收缩。\n\n# 51 Android Studio 主/详情流教程\n\n本章将解释主/详情流用户界面设计概念，然后详细探讨\
  \ Android Studio 包含的主/详情流模板中的元素。随后将创建一个示例应用程序，演示修改模板以满足应用程序开发者特定需求的步骤。\n\n## 51.1\
  \ 主/详情流\n\n主/详情流是一种界面设计概念，其中向用户显示一组项目（称为主列表）。当选择列表中的某项项目时，与该项目相关的附加信息将在详情窗格中呈现给用户。\n\
  \n\n\n\n\n在平板电脑尺寸的 Android 设备显示器的横屏模式下，主列表出现在屏幕左边缘的狭窄垂直面板中。显示器的其余部分用于详情面板，这种布局被称为“双窗格模式”（two-pane\
  \ mode）。例如，图 51-1 展示了主/详情双窗格布局，其中列出了主项目，并在详情面板中显示项目一的内容：\n\n![](img/as_detail_flow_tablet.jpg)\n\
  \n图 51-1\n\n在较小的手机尺寸的 Android 设备上，主列表占据整个屏幕，而详情面板显示在独立的屏幕上，当从主列表中进行选择时，该屏幕就会出现。在这种模式下，详情屏幕包含一个用于返回主列表的操作操作栏条目。例如，图\
  \ 51-2 展示了在 4 英寸手机屏幕上针对同一项目列表的主屏幕和详情屏幕：\n\n![](img/as_detail_flow_phone.jpg)\n\n\
  图 51-2\n\n## 51.2 创建主/详情流 Activity\n\n在本章的下一节中，将详细介绍组成主/详情流模板的各个元素。实现这一点的最佳方法是使用主/详情流模板创建一个项目，并在学习这些信息时使用它。该项目随后将作为本章末尾教程的基础。\n\
  \n尽管项目创建向导包含了选择主/详情流模板的选项，但在项目创建后添加活动（activity）在配置模板方面可以获得更大的灵活性。\n\n从欢迎界面选择 New\
  \ Project（新建项目）选项，在随后出现的新项目对话框中，在点击 Next（下一步）按钮之前选择 `No Activity` 模板。\n\n在 Name（名称）字段中输入\
  \ `PrimaryDetailFlow`，并指定 `com.ebookfrenzy.primarydetailflow` 为包名。在点击 Finish（完成）按钮之前，将\
  \ Minimum API level（最低 API 级别）设置更改为 `API 26`：Android 8.0 (Oreo)，并将 Language（语言）菜单设置为\
  \ `Java`。\n\n项目创建完成后，在 Project 工具窗口中，右键点击 `app` -> `java` -> `com` -> `ebookfrenzy`\
  \ -> `primarydetailflow` 项，并选择 `New` -> `Activity` -> `Primary/Detail Flow` 菜单选项。\n\
  \nNew Android Activity 屏幕（图 51-3）提供了配置在主/详情活动中显示的对象的机会。在本章稍后的教程中，主列表将包含许多网站名称，选中这些名称后，会将选定的网站加载到详情面板中的\
  \ web view 中。考虑到这些需求，将 `Object Kind`（对象类型）字段设置为“Website”，并将 `Object Kind Plural`（对象复数）设置为“Websites”。\n\
  \n![](img/as_4.2_primary_detail_flow_new_activity.jpg)\n\n图 51-3\n\n在点击 Finish 按钮之前，务必启用\
  \ Launcher Activity（启动活动）选项并将 Source Language（源语言）菜单设置为 `Java`。\n\n## 51.3 修改主/详情流模板\n\
