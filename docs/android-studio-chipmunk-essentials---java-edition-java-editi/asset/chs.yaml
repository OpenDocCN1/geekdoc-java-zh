  \n## 27.1 拦截触摸事件\n\n视图对象可以通过注册 `onTouchListener` 事件监听器并实现相应的 `onTouch()` 回调方法来拦截触摸事件。例如，下面的代码确保了在名为\
  \ `myLayout` 的 `ConstraintLayout` 视图实例上的任何触摸操作都会调用 `onTouch()` 方法：\n\n```java\n\
  binding.myLayout.setOnTouchListener(\n    new ConstraintLayout.OnTouchListener()\
  \ {\n        public boolean onTouch(View v, MotionEvent m) {\n            // 在此处执行任务\n\
  \            return true;\n        }\n    }\n);\n```\n\n如代码示例所示，`onTouch()` 回调需要返回一个\
  \ `Boolean` 值，用于指示 Android 运行时系统是否应该将事件传递给在同一视图上注册的其他事件监听器，还是将其丢弃。该方法传递了触发事件的视图引用以及一个类型为\
  \ `MotionEvent` 的对象。\n\n## 27.2 MotionEvent 对象\n\n传递给 `onTouch()` 回调方法的 `MotionEvent`\
  \ 对象是获取事件信息的关键。对象中包含的信息包括触摸在视图中的位置以及所执行的操作类型。`MotionEvent` 对象也是处理多点触摸的关键。\n\n##\
  \ 27.3 理解触摸动作\n\n触摸事件处理的一个重要方面是能够识别用户执行的操作类型。与事件关联的操作类型可以通过调用传递给 `onTouch()` 回调方法的\
  \ `MotionEvent` 对象的 `getActionMasked()` 方法来获取。当视图上发生第一次触摸时，`MotionEvent` 对象将包含一个类型为\
  \ `ACTION_DOWN` 的动作类型以及触摸的坐标。当该触摸从屏幕上抬起时，会生成一个 `ACTION_UP` 事件。在 `ACTION_DOWN` 和\
  \ `ACTION_UP` 事件之间的任何触摸运动将由 `ACTION_MOVE` 事件表示。\n\n当在视图上同时进行多一次触摸时，这些触摸被称为指针（pointers）。在多点触摸场景下，指针的开始和结束分别对应于类型为\
  \ `ACTION_POINTER_DOWN` 和 `ACTION_POINTER_UP` 的事件动作。要识别触发事件的指针索引，必须调用 `MotionEvent`\
  \ 对象的 `getActionIndex()` 回调方法。\n\n## 27.4 处理多点触摸\n\n标题为“Android 事件处理概述与示例”的章节从单次触摸事件的狭窄范围开始探索事件处理。在实践中，大多数\
  \ Android 设备都具有响应多个连续触摸的能力（尽管需要注意的是，可以检测到的同时触摸数量取决于设备）。\n\n正如之前讨论的，在多点触摸情况下，每次触摸都被\
  \ Android 框架认为是一个指针。每个指针反过来通过一个索引值被引用，并分配一个 ID。当前指针的数量可以通过调用当前 `MotionEvent` 对象的\
  \ `getPointerCount()` 方法获取。当前指针列表中特定索引处的指针的 ID 可以通过调用 `MotionEvent` 的 `getPointerId()`\
  \ 方法获取。例如，下面的代码段获取了指针计数以及索引为 0 的指针的 ID：\n\n```java\npublic boolean onTouch(View\
  \ v, MotionEvent m) {\n    int pointerCount = m.getPointerCount();\n    int pointerId\
  \ = m.getPointerId(0);\n    return true;\n}\n```\n\n请注意，当 `onTouch` 监听器被触发时，指针计数始终大于或等于\
  \ 1（因为必须至少发生过一次触摸，回调才会触发）。\n\n视图上的触摸，特别是涉及跨屏幕运动的触摸，会在接触屏幕点抬起之前产生一系列事件。因此，应用程序可能需要在多个触摸事件期间跟踪单个触摸。虽然特定触摸手势的\
  \ ID 不会从一个事件变为另一个事件而改变，但重要的是记住，索引值会随着其他触摸事件的到来和离开而改变。因此，在跨多个事件处理触摸手势时，务必使用 ID 值作为触摸引用，以确保跟踪的是同一次触摸。在调用需要索引值的方法时，应通过调用\
  \ `MotionEvent` 对象的 `findPointerIndex()` 方法将触摸的 ID 转换为对应的索引值来获取。\n\n## 27.5 多点触摸应用程序示例\n\
  \n在本章剩余部分创建的示例应用程序将跟踪在布局视图上移动的最多两个触摸手势。随着每个触摸的事件被触发，每个触摸的坐标、索引和 ID 将显示在屏幕上。\n\n\
  从欢迎界面选择 New Project（新建项目），并在新项目对话框中选择 Empty Activity 模板。在 Name 字段中输入 `MotionEvent`，并指定\
  \ `com.ebookrenzy.motionevent` 为包名。在点击 Finish 按钮之前，将 Minimum API level 设置为 26：Android\
  \ 8.0 (Oreo)，并将 Language 菜单更改为 Java。按照概述调整项目使用视图绑定（view binding）。\n\n## 27.6 设计\
  \ Activity 用户界面\n\n应用程序唯一 Activity 的界面将由一个包含两个 `TextView` 对象的 `ConstraintLayout`\
  \ 组成。在 Project 窗口中，导航 `app` -> `layout` 并双击 `activity_main.xml` 资源文件将其加载到 Android\
  \ 编辑器。\n\n选择并删除默认的“Hello World!” `TextView` 组件，然后在开启自动连接（autoconnect）的情况下，拖放一个新的\
  \ `TextView` 组件，使其水平居中并位于布局顶部边缘的 16dp 边距线处。\n\n拖入第二个 `TextView` 组件，并对其进行约束，使其与第一个组件底部保持\
  \ 32dp 的间距。\n\n使用 Attributes 工具窗口，将 `TextView` 组件的 ID 分别更改为 `textView1` 和 `textView2`。将组件上显示的文本改为“Touch\
  \ One Status”和“Touch Two Status”，并使用布局编辑器右上角的警告按钮提取字符串到资源文件中。\n\n在 Component Tree\
  \ 中选择 `ConstraintLayout`，并使用 Attributes 面将 ID 更改为 `activity_main`。\n\n## 27.7 实现触摸事件监听器\n\
  \n为了接收触摸事件通知，有必要在 `MainActivity` Activity 类的 `onCreate()` 方法中为布局注册触摸监听器。注册触摸监听器并实现代码，在这种情况下代码将调用一个名为\
  \ `handleTouch()` 的第二个方法，并向其传递 `MotionEvent` 对象：\n\n```java\npackage com.ebookrenzy.motionevent;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\n\nimport androidx.constraintlayout.widget.ConstraintLayout;\n\
  \nimport android.os.Bundle;\n\nimport android.view.MotionEvent;\n\nimport android.view.View;\n\
  \nimport com.ebookrenzy.motionevent.databinding.ActivityMainBinding;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n\n    private ActivityMainBinding binding;\n\
  \n    @Override\n```\n\n\n\n\n\n```java\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \    View view = binding.getRoot();\n    setContentView(view);\n    binding.activityMain.setOnTouchListener(\n\
  \        new ConstraintLayout.OnTouchListener() {\n            public boolean onTouch(View\
  \ v, MotionEvent m) {\n                handleTouch(m);\n                return true;\n\
  \            }\n        }\n    );\n}\n```\n\n测试应用程序之前的最后一个任务是实现由监听器调用的 `handleTouch()`\
  \ 方法。该方法的代码如下：\n\n```java\nvoid handleTouch(MotionEvent m) {\n    int pointerCount\
  \ = m.getPointerCount();\n    for (int i = 0; i < pointerCount; i++)\n    {\n  \
  \      int x = (int) m.getX(i);\n        int y = (int) m.getY(i);\n        int id\
  \ = m.getPointerId(i);\n        int action = m.getActionMasked();\n        int actionIndex\
  \ = m.getActionIndex();\n        String actionString;\n        switch (action)\n\
  \        {\n            case MotionEvent.ACTION_DOWN:\n                actionString\
  \ = \"DOWN\";\n                break;\n            case MotionEvent.ACTION_UP:\n\
  \                actionString = \"UP\";\n                break;\n            case\
  \ MotionEvent.ACTION_POINTER_DOWN:\n                actionString = \"PNTR DOWN\"\
  ;\n                break;\n            case MotionEvent.ACTION_POINTER_UP:\n   \
  \             actionString = \"PNTR UP\";\n                break;\n            case\
  \ MotionEvent.ACTION_MOVE:\n                actionString = \"MOVE\";\n         \
  \       break;\n            default:\n                actionString = \"\";\n   \
  \     }\n        String touchStatus = \"Action: \" + actionString + \" Index: \"\
  \ + actionIndex + \" ID: \" + id + \" X: \" + x + \" Y: \" + y;\n        if (id\
  \ == 0)\n            binding.textView1.setText(touchStatus);\n        else\n   \
  \         binding.textView2.setText(touchStatus);\n    }\n}\n```\n\n在编译和运行应用程序之前，值得花时间系统地梳理这段代码，以突出所执行的任务。代码首先获取用户界面中\
  \ `TextView` 对象的引用，并识别当前视图上有多少个活跃的指针：\n\n`textView1 = findViewById(R.id.textView1);`\n\
  `textView2 = findViewById(R.id.textView2);`\n`pointerCount = m.getPointerCount();`\n\
  \n接下来，使用 `pointerCount` 变量启动一个 `for` 循环，为每个活跃的指针执行一组任务。循环的前几行获取了触摸的 `X` 和 `Y` 坐标，以及相应的\
  \ `ID`、动作类型和动作索引。最后，声明了一个 `string` 变量：\n\n```java\nfor (int i = 0; i < pointerCount;\
  \ i++)\n{\n    int x = (int) m.getX(i);\n    int y = (int) m.getY(i);\n    int id\
  \ = m.getPointerId(i);\n    int action = m.getActionMasked();\n    int actionIndex\
  \ = m.getActionIndex();\n    String actionString;\n```\n\n由于动作类型对应整数值，因此使用 `switch`\
  \ 语句将动作类型转换为更有意义的字符串值，并将其存储在 `actionString` 变量中：\n\n```java\nswitch (action)\n{\n\
  \    case MotionEvent.ACTION_DOWN:\n        actionString = \"DOWN\";\n        break;\n\
  \    case MotionEvent.ACTION_UP:\n        actionString = \"UP\";\n        break;\n\
  \    case MotionEvent.ACTION_POINTER_DOWN:\n        actionString = \"PNTR DOWN\"\
  ;\n        break;\n    case MotionEvent.ACTION_POINTER_UP:\n        actionString\
  \ = \"PNTR UP\";\n        break;\n    case MotionEvent.ACTION_MOVE:\n        actionString\
  \ = \"MOVE\";\n        break;\n    default:\n        actionString = \"\";\n}\n```\n\
  \n最后，使用 `actionString` 值、动作索引、触摸 `ID` 以及 `X` 和 `Y` 坐标构建字符串消息。然后使用 `ID` 值来决定字符串应该显示在第一个还是第二个\
  \ `TextView` 对象上：\n\n`String touchStatus = \"Action: \" + actionString + \" Index:\
  \ \" + actionIndex + \" ID: \" + id + \" X: \" + x + \" Y: + y;`\n`if (id == 0)`\n\
  `    binding.textView1.setText(touchStatus);`\n`else`\n`    binding.textView2.setText(touchStatus);`\n\
  \n### 27.8 运行示例应用程序\n\n编译并运行应用程序，一旦启动，在屏幕上尝试单次和多次触摸，并注意文本视图的更新以反映事件，如图图 27-3](#Multitouch_Events.xhtml__idTextAnchor635）所示。在模拟器上运行时，可以通过按住\
  \ `Ctrl` 键（macOS 上为 `Cmd`）同时点击鼠标按钮来模拟多点（注意，如果模拟器在工具窗口中运行，模拟多点可能不起）：\n\n![](img/as_4.1_motion_event_running.jpg)\n\
  \n图 27-3\n\n## 27.9 总结\n\nActivity 通过注册 `onTouchListener` 来接收触摸事件通知。本章通过了一个示例，该示例旨在显示多达同时触摸的坐标和动作类型。\n\
  \n\n\n\n检测常见手势的基本步骤如下：\n\n1. 定义一个实现 `GestureDetector.OnGestureListener` 接口的类，包括所需的\
  \ `onFling()`、`onDown()`、`onScroll()`、`onShowPress()`、`onSingleTapUp()` 和 `onLongPress()`\
  \ 回调方法。注意，这可以是一个全新的类，也可以是所属的 Activity 类。如果需要检测双击手势，该类还必须实现 `GestureDetector.OnDoubleTapListener`\
  \ 接口并包含相应的 `onDoubleTap()` 方法。\n\n2. 创建 `GestureDetectorCompat` 类的实例，并将步骤 1 中创建的类实例作为参数传递。。\n\
  \n3. 可选调用 `GestureDetectorCompat` 实例的 `setOnDoubleTapListener()` 方法，以便根据需要启用双击检测。\n\
  \n4. 在所属的 Activity 中实现 `onTouchEvent()` 回调方法，该方法必须调用 `GestureDetectorCompat` 实例的\
  \ `onTouchEvent()` 方法，并将当前的运动事件对象作为参数传递给该方法。\n\n一旦实现，应用程序代码中的一组方法，当检测到特定类型的手势时，这些方法将被调用。随后可以实现这些方法中的代码，以执行响应相应手势需要执行的任何任务。\n\
  \n在本章的剩余部分，我们将创建一个示例项目，并将上述步骤付诸实践。\n\n## 28.2 创建示例手势检测项目\n\n该项目的目标是检测 `GestureDetectorCompat`\
  \ 类目前支持的所有常见手势，并向用户显示状态信息以指示检测到的手势类型。\n\n从欢迎界面选择 `New Project`选项，在出现的新项目对话框中点击 `Next`\
  \ 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `CommonGestures`，并指定 `com.ebookfrenzy.commongestures`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`并将`Language`\
  \ 菜单设置为 `Java`。\n\n按照第 11.8 Migrating a Project to View Binding 节所述调整项目以使用 view\
  \ binding。\n\n一旦了新项目，在 Project 工具窗口中导航到 `app -> res -> layout -> activity_main.xml`\
  \ 文件并双击它以将其加载到 Layout Editor 工具中。\n\n在 Layout Editor 工具中，选择“Hello, World!” `TextView`\
  \ 组件，并在 `Attributes` 工具窗口中输入 `gestureStatusText` 作为 `ID`。\n\n## 28.3 实现监听器类\n\n\
  如前所述，有创建一个实现 `GestureDetector.OnGestureListener` 接口的类，如果需要双击检测，还需要实现 `GestureDetector.OnDoubleTapListener`\
  \ 接口。虽然这可以是一个全新的类，但在当前 Activity 类中实现也是完全有效的。因此，为了本示例，我们将修改 `MainActivity` 类来实现这些监听器接口。编辑\
  \ `MainActivity.java` 文件使其内容如下：\n\n```java\npackage com.ebookfrenzy.commongestures;\n\
  \nimport android.view.GestureDetector;\n\n.\n.\n\npublic class MainActivity extends\
  \ AppCompatActivity\n        implements GestureDetector.OnGestureListener,\n   \
  \     GestureDetector.OnDoubleTapListener\n{\n\n.\n.\n}\n```\n\n声明类实现了监听器接口意味着要求在类中也实现相应的方法：\n\
  \n```java\npackage com.ebookfrenzy.commongestures;\n\n.\n.\n\nimport android.view.MotionEvent;\n\
  \npublic class MainActivity extends AppCompatActivity\n        implements GestureDetector.OnGestureListener,\n\
  \        GestureDetector.OnDoubleTapListener {\n.\n.\n\n    @Override\n    public\
  \ boolean onDown(MotionEvent event) {\n        binding.gestureStatusText.setText\
  \ (\"onDown\");\n        return true;\n    }\n\n    @Override\n    public boolean\
  \ onFling(MotionEvent event1, MotionEvent event2,\n                            \
  \       float velocityX, float velocityY) {\n        binding.gestureStatusText.setText(\"\
  onFling\");\n        return true;\n    }\n\n    @Override\n    public void onLongPress(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onLongPress\");\n    }\n\
  \n    @Override\n    public boolean onScroll(MotionEvent e1, MotionEvent e2,\n \
  \                                  float distanceX, float distanceY) {\n       \
  \ binding.gestureStatusText.setText(\"onScroll\");\n        return true;\n    }\n\
  \n    @Override\n    public void onShowPress(MotionEvent event) {\n        binding.gestureStatusText.setText(\"\
  onShowPress\");\n    }\n\n    @Override\n    public boolean onSingleTapUp(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onSingleTapUp\");\n    \
  \    return true;\n    }\n\n    @Override\n    public boolean onDoubleTap(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onDoubleTap\");\n      \
  \  return true;\n    }\n\n    @Override\n    public boolean onDoubleEvent(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onDoubleEvent\");\n    \
  \    return true;\n    }\n\n    @Override\n    public boolean onTapConfirmed(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onTapConfirmed\");\n   \
  \     return true;\n    }\n\n.\n.\n}\n```\n\n注意这些方法中的许多都返回 `true`。这向 Android 框架表示事件已被方法消费，不需要传递给下一个处理器。\n\
  \n## 28.4 创建 GestureDetectorCompat 实例\n\n更新 Activity 类以实现监听器后，下一步是创建 `GestureDetectorCompat`\
  \ 实例。由于只需要在 Activity 创建时执行一次，最佳位置是 `onCreate()` 方法。由于我们还想检测双击，代码还需要调用 `GestureDetectorCompat`\
  \ 实例的 `setOnDoubleTapListener()` 方法：\n\n```java\npackage com.ebookfrenzy.commongestures;\n\
  \n.\n.\n\nimport androidx.core.view.GestureDetectorCompat;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private ActivityMainBinding binding;\n    private\
  \ GestureDetectorCompat gDetector;\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        binding\
  \ = ActivityMainBinding.inflate(getLayoutInflater());\n        View view = binding.getRoot();\n\
  \        setContentView(view);\n        this.gDetector = new GestureDetectorCompat(this,this);\n\
  \        gDetector.setOnDoubleTapListener(this);\n    }\n\n.\n.\n}\n```\n\n## 28.5\
  \ 实现 onTouchEvent 方法\n\n此时编译并运行应用程序，即使在设备屏幕上执行手势也不会发生任何事情。这是因为还没有添加代码来拦截触摸事件并传递给\
  \ `GestureDetectorCompat` 实例。为了实现这一点，需要在 Activity 类中重写 `onTouchEvent()` 方法并实现它，使其调用\
  \ `GestureDetectorCompat` 实例的 `onTouchEvent()` 方法。因此，留在 `MainActivity.java` 文件中，实现该方法使其内容如下：\n\
  \n```java\n@Override\npublic boolean onTouchEvent(MotionEvent event) {\n    this.gDetector.onTouchEvent(event);\n\
  \    // 确保调用了父类实现\n    return super.onTouchEvent(event);\n}\n```\n\n## 28.6 测试应用程序\n\
  \n\n\n\n在物理 Android 设备或 AVD 模拟器上编译并运行该应用程序。启动后，尝试滑动、按下、滚动动作以及双击和单击。请注意，文本视图会更新以反映这些事件，如图\
  \ 28-1 所示：\n\n![](img/Image2425.jpg)\n\n图 28-1\n\n## 28.7 总结\n\n用户与设备触摸屏显示之间的任何物理接触都可以被视为“手势”。由于缺乏传统计算机系统的物理键盘和鼠标指针，手势被广泛用作用户与应用程序之间交互的方法。虽然一个手势可以由任何序列的动作组成，但有一套触摸屏设备用户已经熟悉的常用手势集。通过使用\
  \ `Android Gesture Detector` 类，可以在应用程序中轻松检测到许多所谓的“常用手势”。在本章中，我们从理论和示例项目实现两个方面概述了该技术的使用。\n\
  \n在本章介绍了常用手势之后，下一章将介绍如何检测更广泛的手势类型，包括设计和检测您自定义手势的能力。\n\n## 29. 在 Android 上实现自定义手势和缩放识别\n\
  \n上一章涵盖了如何在 Android 应用程序内部检测所谓的“常用手势”。然而，在实践中，一个手势设想上可以涉及 Android 设备显示屏上几乎任何序列的触摸动作。由于这一事实，`Android\
  \ SDK` 允许应用程序开发者定义几乎任何性质的自定义手势，并在用户执行时触发事件。这是一个多阶段的过程，其细节是本章的主题。\n\n## 29.1 Android\
  \ Gesture Builder 应用程序\n\n`Android SDK` 允许开发者设计自定义手势，然后将这些手势存储在与 Android 应用程序包捆绑的手势文件中。这些自定义手势文件最简单的创建方法是使用\
  \ `Gesture Builder` 应用程序，它是作为 `Android SDK` 提供的示例包的一部分提供的。创建手势文件涉及在物理设备或模拟器上启动 `Gesture\
  \ Builder` 应用程序，并“绘制”应用程序需要检测的手势。一旦设计好手势，就可以将包含手势数据的文件从设备或模拟器的 SD 卡中提取出来并添加到应用程序项目中。在应用程序代码中，该文件会被加载到\
  \ `GestureLibrary` 类的实例中，并在那里可以用于搜索与用户在设备显示屏上执行的任何手势相匹配的结果。\n\n### 29.2 GestureOverlayView\
  \ 类\n\n为了方便在应用程序中检测手势，`Android SDK` 提供了 `GestureOverlayView` 类。这是一个透明视图，可以放置在用户界面的其他视图之上，唯一目的是检测手势。\n\
  \n## 29.3 检测手势\n\n通过加载使用 `Gesture Builder` 应用创建的手势文件，然后在 `GestureOverlayView` 类的实例上注册一个\
  \ `GesturePerformedListener` 事件监听器来检测手势。然后声明外围类实现 `OnGesturePerformedListener` 接口以及该接口所需的相应\
  \ `onGesturePerformed` 回调方法。如果监听器检测到手势，Android 运行时系统将触发对 `onGesturePerformed` 回调方法的调用。\n\
  \n## 29.4 识别特定手势\n\n当检测到手势时，会调用 `onGesturePerformed` 回调方法，并将参数传递检测到手势的 `GestureOverlayView`\
  \ 对象的引用以及一个包含手势信息的 `Gesture` 对象。\n\n通过访问 `Gesture` 对象，可以使用 `GestureLibrary` 将检测到的手势与之前加载到应用程序的手势文件中的包含的手势进行比较。`GestureLibrary`\
  \ 通过为每个手势计算预测分，报告用户执行的手势与手势文件中的条目匹配的概率。通常认为预测分达到 `1.0` 或更高即为文件文件中存储的手势与用户在设备显示屏上执行的手势之间的良好匹配。\n\
  \n### 29.5 安装并运行 Gesture Builder 应用程序\n\n创建手势文件最简单的方法是使用一个允许捕获并保存手势动作的应用程序。虽然 Google\
  \ 最初提供了一个用于此目的的应用程序，但它在较新的 Android 版本上没有得到充分维护。幸运的是，可以通过 `Gesture Builder Tool`\
  \ 应用程序作为替代方案，该程序可以通过以下 URL 从 Google Play 商店获取：\n\n[`play.google.com/store/apps/details?id=migueldp.runeforge`](https://play.google.com/store/apps/details?id=migueldp.runeforge)\n\
  \n## 29.6 创建手势文件\n\n`Gesture Builder Tool` 加载后，点击设备屏幕底部的 `Create New Gesture` 按钮，并在灰色画布上使用圆形动作“绘制”手势，如图\
  \ 29-1 所示。假设手势显示正确（由设备屏幕上的黄色线条表示），点击保存按钮将手势添加到手势文件中，在提示输入名称时输入“Circle Gesture”：\n\
  \n![](img/as_gesture_builder_app.jpg)\n\n图 29-1\n\n手势保存后，`Gesture Builder Tool`\
  \ 将显示当前定义的手势列表，此时列表将仅包含新的 `Circle Gesture`。\n\n## 29.7 创建示例项目\n\n从欢迎界面选择 `New Project`\
  \ 选项，并在生成的新项目对话框中，在点击 `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `CustomGestures`，并指定包名为\
  \ `com.ebookrenzy.customgestures`。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置 `API\
  \ 26`: Android 8.0 (Oreo)，并将 `Language` 菜单改为 `Java`。按照 11.8 将项目迁移到视图绑定节中的步骤，修改项目以使用视图绑定。\n\
  \n## 29.8 从 SD 卡提取手势文件\n\n由于每个手势都在 `Gesture Builder` 应用程序内部创建的，它们被添加到名为 `gesture.txt`\
  \ 的文件中，位于运行应用程序的模拟器或设备的存储中。然而，在此文件添加到 Android Studio 项目之前，必须先将其从设备存储中复制并保存到本地文件系统中。最简单的方法是使用\
  \ Android Studio `Device File Explorer` 工具窗口。使用 `View -> Tool Windows -> Device\
  \ File Explorer` 选项显示此工具。显示后，从下拉菜单中选择创建手势文件的设备或模拟器，然后导航到以下文件夹：\n\n`/storage/emulated/0/Android/data/migueldp.runeforge/files/gestures.txt`\n\
  \n在此文件夹中找到 `gesture.txt` 文件，右键点击它，选择 `Save As…` 菜单选项并将文件命名为 `gestures` 保存到临时位置。\n\
  \n![](img/as_gesture_file_in_explorer.jpg)\n\n图 29-2\n\n一旦手势文件已创建并从设备存储中提取出来，就可以作为资源文件添加到\
  \ Android Studio 项目中了。\n\n## 29.9 将手势文件添加到项目\n\n\n\n\n\n在 Android Studio 的 Project（项目）窗口中，找到并右键点击\
  \ `res` 文件夹（位于 `app` 下），从弹出的菜单中选择 `New` -> `Directory`（新建目录）。在 `New Directory` 对话框中，输入\
  \ `raw` 作为文件夹名称并按下键盘回车键。使用适用于你操作系统的适当文件管理器工具，找到之前从设备存储中提取的 `gestures` 文件，将其复制并粘贴到\
  \ Project 窗口中新的 `raw` 文件夹中。\n\n## 29.10 设计用户界面\n\n此示例应用需要一个用户界面，其由一个 `ConstraintLayout`\
  \ 视图组成，在其上方层叠一个 `GestureOverlayView`，用于拦截用户执行的任何手势。找到 `app -> res -> layout -> activity_main.xml`\
  \ 文件，双击将其加载到 Layout Editor（布局编辑器）工具中，选择并删除默认的 `TextView` 组件。\n\n切换到布局编辑器的 Code 模式并修改\
  \ XML，使其内容如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\" >\n    <android.gesture.GestureOverlayView\n\
  \        android:id=\"@+id/gOverlay\"\n        android:layout_width=\"0dp\"\n  \
  \      android:layout_height=\"0dp\"\n        app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        app:layout_constraintEnd_toEndOf=\"parent\"\n        app:layout_constraintStart_toStartOf=\"\
  parent\"\n        app:layout_constraintTop_toTopOf=\"parent\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n## 29.11 加载手势文件\n\n现在手势文件已添加到项目中，下一步是编写一些代码以便在 启动时加载该文件。为了项目的目的，实现此功能的代码将如下所示添加到\
  \ `MainActivity.java` 源文件中的 `MainActivity` 类中：\n\n```java\npackage com.ebookfrenzy.customgestures;\n\
  \n...\n\nimport android.gesture.GestureLibraries;\nimport android.gesture.GestureLibrary;\n\
  import android.gesture.GestureOverlayView;\nimport android.gesture.GestureOverlayView.OnGesturePerformedListener;\n\
  \npublic class MainActivity extends AppCompatActivity\n        implements OnGesturePerformedListener\
  \ {\n\n    private ActivityMainBinding binding;\n    private GestureLibrary gLibrary;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ gestureSetup();\n    }\n\n    private void gestureSetup() {\n        gLibrary\
  \ =\n                GestureLibraries.fromRawResource(this,\n                  \
  \             R.raw.gestures);\n        if (!gLibrary.load()) {\n            finish();\n\
  \        }\n    }\n...\n}\n```\n\n除了必要的导入指令外，上述代码还创建了一个名为 `gLibrary` 的 `GestureLibrary`\
  \ 实例，然后将 raw 资源文件夹中的手势文件内容加载到其中。Activity 类也经过了修改实现了 `OnGesturePerformedListener`\
  \ 接口，这需要实现 `onGesturePerformed` 回调方法（该方法将在本章稍后的部分创建）。\n\n## 29.12 注册事件监听器\n\n为了让\
  \ Activity 接收到用户在屏幕上执行手势的通知，必须在 `gLayout` 视图上注册 `OnGesturePerformedListener` 事件监听器，如后续代码所示，可以使用\
  \ `findViewById` 方法获取其引用：\n\n```java\nprivate void gestureSetup() {\n    gLibrary\
  \ =\n            GestureLibraries.fromRawResource(this,\n                      \
  \     R.raw.gestures);\n    if (!gLibrary.load()) {\n        finish();\n    }\n\
  \    GestureOverlayView gOverlay = findViewById(R.id.gOverlay);\n    gOverlay.addOnGesturePerformedListener(this);\n\
  }\n```\n\n# 29.13 实现 onGesturePerformed 方法\n\n在首次运行应用程序之前，剩下的就是实现 `onGesturePerformed`\
  \ 回调。当在 `GestureOverlayView` 实例上执行手势时，就会调用此方法：\n\n```java\npackage com.ebookfrenzy.customgestures;\n\
  \n...\n\nimport android.gesture.Prediction;\nimport android.widget.Toast;\nimport\
  \ android.gesture.Gesture;\nimport java.util.ArrayList;\n\npublic class MainActivity\
  \ extends AppCompatActivity implements OnGesturePerformedListener {\n    private\
  \ GestureLibrary gLibrary;\n\n...\n\n    public void onGesturePerformed(GestureOverlayView\
  \ overlay, Gesture gesture) {\n        ArrayList<Prediction> predictions = gLibrary.recognize(gesture);\n\
  \        if (predictions.size() > 0 && predictions.get(0).score > 1.0) {\n     \
  \       String action = predictions.get(0).name;\n            Toast.makeText(this,\
  \ action, Toast.LENGTH_SHORT).show();\n        }\n    }\n...\n}\n```\n\n当 Android\
  \ 运行时检测到手势叠加对象上的手势时，就会调用 `onGesturePerformed` 方法。传递的参数是检测到手势的 `GestureOverlayView`\
  \ 对象引用，以及类型为 `Gesture` 的对象。`Gesture` 类设计用于定义特定的手势（本质上是屏幕上的点序列）。\n\n`Gesture` 对象传递给\
  \ `gLibrary` 实例的 `recognize()` 方法，其目的是将当前手势与从手势文件中加载的每个手势进行比较。完成此任务后，`recognize()`\
  \ 方法返回一个包含 `Prediction` 对象的 `ArrayList`。该列表从最佳匹配（数组位置 0）到最差进行排序。每个预测对象中包含了手势文件中对应的手势名称以及指示与当前手势匹配程度的预测分数。\n\
  \n因此，上述方法获取位置 0 的预测，确保其分数大于 1.0，然后显示 `Toast` 消息（一种用于向用户显示弹出窗口 Android 类），显示匹配的手势名称。\n\
  \n## 29.14 测试应用程序\n\n在模拟器或物理 Android 设备上构建并运行应用程序，并在屏幕上执行圆形手势。执行后，应该出现包含到的手势名称的\
  \ toast 通知。注意，当手势被识别时，它会在屏幕上用亮黄色勾勒，而不确定的手势显示为淡黄色线条。这在开发期间很有用，但对于现实应用可能并不理想。因此，显然还有一些配置工作要做。\n\
  \n## 29.15 配置 GestureOverlayView\n\n默认情况下，`GestureOverlayView` 配置为在手势期间显示黄色线条。用于绘制识别和未识别手势的颜色可以通过\
  \ `android:gestureColor` 和 `android:uncertainGestureColor` 属性定义。例如，要隐藏手势线条，如下所示示例项目中的\
  \ `activity_main.xml` 文件：\n\n```xml\n<android.gesture.GestureOverlayView\n    android:id=\"\
  @+id/gOverlay\"\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  0dp\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    android:gestureColor=\"#00000000\"\n    android:uncertainGestureColor=\"\
  #00000000\" />\n```\n\n\n\n\n\n重新运行应用程序后，手势现在应该是不可见的（因为它们被绘制在 `ConstraintLayout`\
  \ 视图的白色背景上）。\n\n## 29.16 拦截手势\n\n正如前所述，`GestureOverlayView` 是一个透明的覆盖层，可以放置在其他视图的上方。这引出了一个问题：当识别出手势时，被手势覆盖层拦截的事件是否应该传递给底层视图？这通过\
  \ `GestureOverlayView` 实例的 `android:eventsInterceptionEnabled` 属性进行控制。当其设置为 `true`\
  \ 时，当识别出手势，手势事件将不会传递给底层视图。在可能配置为响应特定手势滚动的视图上执行手势时，此设置特别有用。将此属性设置为 `true` 可以避免手势同时被解释为底层视图向特定方向滚动的指令。\n\
  \n## 29.17 检测缩放手势\n\n在离开通用触摸处理和特定的手势识别之前，本章的最后一个主题是处理缩放手势（pinch gestures）。虽然可以使用本章之前节中概述的步骤创建并检测各种手势，但实际上，使用目前讨论的技术无法检测缩放手势（即使用两个手指进行拉伸和捏合动作，通常用于放大或缩小视图或图像）。\n\
  \n检测缩放手势的最简单方法是使用 Android `ScaleGestureDetector` 类。简单来说，检测缩放手势涉及以下三个步骤：\n\n1. 声明实现\
  \ `SimpleOnScaleGestureListener` 接口的新类，包括所需的 `onScale()`、`onScaleBegin()` 和 `onScaleEnd()`\
  \ 回调方法。\n2. 创建 `ScaleGestureDetector` 类实例，并将步骤 1 中创建的类实例作为参数传递。\n3. 在外层 activity\
  \ 中实现 `onTouchEvent()` 回调方法，该方法反过来调用 `ScaleGestureDetector` 类的 `onTouchEvent()`\
  \ 方法。\n\n在本章的剩余部分，我们将创建一个示例，用于演示缩放手势识别的实现。\n\n## 29.18 缩放手势示例项目\n\n从欢迎屏幕选择 New Project（新建项目）选项，在出现的新项目对话框中，点击\
  \ Next（下一步）按钮之前选择 Empty Activity 模板。\n\n在 Name 字段中输入 `PinchExample`，并指定 `com.ebookfrenzy.pinchexample`\
  \ 为包名。在点击 Finish（完成）按钮之前，将 Minimum API level 设置为 `API 26`：Android 8.0 (Oreo)，并将\
  \ Language 菜单设置为 `Java`。按照 11.8 Migrating a Project to View Binding 中的步骤将项目转换为使用\
  \ view binding。\n\n在 `activity_main.xml` 文件中，选择默认的 `TextView` 对象，并使用 Attributes\
  \ 工具窗口将 ID 设置为 `myTextView`。\n\n找到并加载 `MainActivity.java` 文件到 Android Studio 编辑器中并如下所示修改文件：\n\
  \n```java\npackage com.ebookfrenzy.pinchexample;\n\n.\n.\n\nimport android.view.MotionEvent;\n\
  \nimport android.view.ScaleGestureDetector;\n\nimport android.view.ScaleGestureDetector.SimpleOnScaleGestureListener;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n\n    ScaleGestureDetector scaleGestureDetector;\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        scaleGestureDetector\
  \ =\n            new ScaleGestureDetector(this,\n                new MyOnScaleGestureListener());\n\
  \    }\n\n    @Override\n    public boolean onTouchEvent(MotionEvent event) {\n\
  \        scaleGestureDetector.onTouchEvent(event);\n        return true;\n    }\n\
  \n    public class MyOnScaleGestureListener extends\n            SimpleOnScaleGestureListener\
  \ {\n        @Override\n        public boolean onScale(ScaleGestureDetector detector)\
  \ {\n            float scaleFactor = detector.getScaleFactor();\n            if\
  \ (scaleFactor > 1) {\n                binding.myTextView.setText(\"Zooming Out\"\
  );\n            } else {\n                binding.myTextView.setText(\"Zooming In\"\
  );\n            }\n            return true;\n        }\n\n        @Override\n  \
  \      public boolean onScaleBegin(ScaleGestureDetector detector) {\n          \
  \  return true;\n        }\n\n        @Override\n        public void onScaleEnd(ScaleGestureDetector\
  \ detector) {\n        }\n    }\n}\n```\n\n## 29.19 总结\n\n手势本质上是触摸上接触点的运动，涉及一个或多个笔画，可以作为用户与应用程序之间的通信方法。Android\
  \ 允许使用 Gesture Builder 应用设计手势。一旦创建，手势可以保存到手势文件中，并在运行时使用 `GestureLibrary` 加载到活动中。\n\
  \n通过在现有视图上叠加透明的 `GestureOverlayView` 实例并实现 `OnGesturePerformed` 事件监听器，可以在显示区域上检测手势。使用\
  \ `GestureLibrary` 可以生成用户执行的手势与存储在手势文件中的手势之间的排序列表，并使用预测分来判断手势是否足够匹配。\n\n可以通过实现 `ScaleGestureDetector`\
  \ 类来检测缩放手势，本章也提供了一个示例。\n\n## 30. Android Fragments 简介\n\n随着你对本书章节的深入，你将越来越发现，Android\
  \ 系统背后的许多设计概念其构思目标是促进构成应用程序的不同元素之间的复用和交互。本章将探索的此类领域涉及 Fragment 的使用。\n\n本章将提供 Fragment\
  \ 基础概述，介绍它们是什么以及如何在应用程序中创建和使用。下一章将通过教程演示在 Android Studio 中开发应用程序时 Fragment 的实际效果，包括\
  \ Fragment 之间的通信实现。\n\n## 30.1 什么是 Fragment？\n\n\n\n\n\nFragment（片段）是应用程序用户界面及其相应行为的一个自包含、模块化部分，可以嵌入到\
  \ activity（活动）中。在应用程序设计阶段，可以将 Fragment 组合成 activity，并在应用程序运行时将其添加到或从 activity 中移除，以创建动态变化的用户界面。\n\
  \nFragment 只能作为 activity 的一部分使用，而不能作为独立的应用程序元素进行实例化。尽管如此，Fragment 可以被认为是一个功能性的“子活动”，其生命周期与完整\
  \ activity 的生命周期相似。\n\nFragment 以 XML 布局文件的形式存储，可以通过在 activity 的布局文件中放置适当 `<fragment>`\
  \ 元素，或者直接通过 activity 类实现中的代码将其添加到 activity 中。\n\n## 30.2 创建 Fragment\n\n构成 Fragment\
  \ 的两个组件都是一个 XML 布局文件和一个对应的 Java 类。Fragment 的 XML 布局文件格式与任何其他 activity 布局的格式相同，可以包含布局管理器和视图的任何组合和复杂度。例如，下面的\
  \ XML 布局用于一个 Fragment，该片段由一个具有红色背景的 `ConstraintLayout` 组成，其中包含一个白色前景的单个 `TextView`：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/constraintLayout\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    android:background=\"@android:color/holo_red_dark\"\
  \n    tools:context=\".FragmentOne\">\n    <TextView\n        android:id=\"@+id/textView1\"\
  \n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
  wrap_content\"\n        android:text=\"My First Fragment\"\n        android:textAppearance=\"\
  @style/TextAppearance.AppCompat.Large\"\n        android:textColor=\"@color/white\"\
  \n        app:layout_constraintBottom_toBottomOf=\"parent\"\n        app:layout_constraintEnd_toEndOf=\"\
  parent\"\n        app:layout_constraintStart_toStartOf=\"parent\"\n        app:layout_constraintTop_toTopOf=\"\
  parent\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n与布局对应的类必须是\
  \ Android `Fragment` 类的子类。该类至少应该重写 `onCreateView()` 方法，该方法负责加载 fragment 布局。例如：\n\
  \n```java\npackage com.example.myfragmentdemo;\n\nimport android.os.Bundle;\nimport\
  \ android.view.LayoutInflater;\nimport android.view.View;\nimport android.view.ViewGroup;\n\
  import androidx.fragment.app.Fragment;\n\npublic class FragmentOne extends Fragment\
  \ {\n    @Override\n    public View onCreateView(LayoutInflater inflater,\n    \
  \                         ViewGroup container,\n                             Bundle\
  \ savedInstanceState) {\n        // Inflate the layout for this fragment\n     \
  \   binding = FragmentTextBinding.inflate(inflater, container, false);\n       \
  \ return binding.getRoot();\n    }\n}\n```\n\n除了 `onCreateView()` 方法外，该类还可以重写标准的生命周期方法。一旦\
  \ fragment 布局和类创建完成，fragment 就可以就可以应用程序活动中使用。\n\n## 30.3 使用布局 XML 文件将 Fragment 添加到\
  \ Activity\n\n可以通过编写 Java 代码或将 fragment 嵌入到 activity 的 XML 布局文件中将其纳入 activity 中。无论使用哪种方法，需要注意的一个关键点是，当使用支持库兼容旧版\
  \ Android 版本时，任何使用 fragment 的 activity 必须实现为 `FragmentActivity` 的子类，而不是 `AppCompatActivity`\
  \ 类：\n\n```java\npackage com.example.myfragmentdemo;\n\nimport android.os.Bundle;\n\
  import androidx.fragment.app.FragmentActivity;\nimport android.view.Menu;\n\npublic\
  \ class MainActivity extends FragmentActivity {\n// ...\n}\n```\n\nFragment 使用 `FragmentContainerView`\
  \ 类嵌入到 activity 布局文件中。接面的示例布局嵌入了上一节中创建的 fragment：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    tools:context=\"\
  .MainActivity\">\n    <androidx.fragment.app.FragmentContainerView\n        android:id=\"\
  @+id/fragment2\"\n        android:layout_width=\"0dp\"\n        android:layout_height=\"\
  0dp\"\n        android:name=\"com.example.myfragmentdemo.FragmentOne\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n`<fragment>` 元素中的关键属性是 `android:name`（必须引用与 fragment 关联的类）和 `tools:layout`（它必须引用包含布局的\
  \ XML 文件）。一旦添加到 activity 布局中，可以在 Android Studio 编辑器中查看并操作 fragment：图 30-1\n\n##\
  \ 30.4 在代码中添加和管理 Fragment\n\n通过 activity 布局文件向 activity 添加 fragment 虽然方便，但代价是 activity\
  \ 无法在运行时移除 fragment。为了实现在运行时对 fragment 进行完全动态控制，必须通过代码添加这些 activity。这样做的好处是可以在运行时添加、移除甚至替换\
  \ fragment。\n\n当使用代码管理 fragment 时，fragment 本身仍然由 XML 布局文件和一个对应的类组成。区别在于宿主 activity\
  \ 中操作 fragment。使用代码向 activity 添加 fragment 有一套标准的步骤序列：\n\n1. 创建 fragment 类的实例。\n\
  2. 将任何额外的意 参数传递给类实例。\n3. 获取 `FragmentManager` 实例引用。\n4. 在 fragment manager 实例上调用\
  \ `beginTransaction()` 方法。这将返回一个 `FragmentTransaction` 实例。\n5. 调用 fragment transaction\
  \ 实例的 `add()` 方法，将要包含 fragment 的视图资源 ID 和 fragment 类实例作为参数传递。\n6. 调用 fragment transaction\
  \ 实例的 `commit()` 方法。\n\n例如，下面的代码添加了 `FragmentOne` 类定义的 fragment，使其显示在 ID 为 `LinearLayout1`\
  \ 的容器中：\n\n```java\nFragmentOne firstFragment = new FragmentOne();\nfirstFragment.setArguments(getIntent().getExtras());\n\
  FragmentManager fragManager = getSupportFragmentManager();\nFragmentTransaction\
  \ transaction = fragManager.beginTransaction();\ntransaction.add(R.id.LinearLayout1,\
  \ firstFragment);\ntransaction.commit();\n```\n\n上述代码将每个步骤拆分为独立的语句，以便于清晰。然而，最后四行可以缩减为一行代码：\n\
  \n```java\ngetSupportFragmentManager().beginTransaction().add(R.id.LinearLayout1,\
  \ firstFragment).commit();\n```\n\n\n\n\n一旦 fragment 添加到容器中，后续可以通过调用片段事务实例的 `remove()`\
  \ 方法将其移除，该方法需要传递要移除的 fragment 实例的引用：\n\n```\ntransaction.remove(firstFragment);\n\
  ```\n\n同样，可以通过调用片段事务实例的 `replace()` 方法将一个 fragment 替换为另一个。该方法接收的参数是包含该 fragment\
  \ 的视图的 ID 以及一个新 fragment 的实例。被替换的 fragment 也可以被放置于所谓的“回退栈”（back stack）中，这样当用户导航回该\
  \ fragment 时，可以快速恢复。这通过在调用 `commit()` 方法之前，调用片段事务对象的 `addToBackStack()` 方法来实现：\n\
  \n```\nFragmentTwo secondFragment = new FragmentTwo();\n\ntransaction.replace(R.id.LinearLayout1,\
  \ secondFragment);\n\ntransaction.addToBackStack(null);\n\ntransaction.commit();\n\
  ```\n\n## 30.5 处理 fragment 事件\n\n如前所述，fragment 非常地像一个子 activity，它有自己的布局、类和生命生命周期。fragment\
  \ 内部的视图组件（如按钮和文本视图）能够像普通 activity 一样产生事件。这产生了一个问题：哪个类来接收来自 fragment 视图的事件？是 fragment\
  \ 本身，还是嵌入该 fragment 的 activity？这个问题的答案取决于事件处理器是如何声明的。\n\n在标题为 \"Android 事件处理概述与示例\"\
  \ 的章节中，讨论了两种处理事件的方法。第一种方法涉及在 activity 的代码中配置事件监听器和回调方法。例如：\n\n```\nbinding.button.setOnClickListener(\n\
  \    new Button.OnClickListener() {\n        public void onClick(View v) {\n   \
  \         // 当按钮被点击时\n            // 要执行的代码\n        }\n    }\n);\n```\n\n在截获点击事件的情况下，第二种方法涉及在\
  \ XML 布局文件中设置 `android:onClick` 属性：\n\n```xml\n<Button\n    android:id=\"@+id/button1\"\
  \n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:onClick=\"onClick\"\n    android:text=\"Click me\" />\n```\n\nfragment\
  \ 视图生成的事件的通用规则是：如果事件监听器是在 fragment 类中使用事件监听器和回调方法的方法声明的，那么事件将首先由 fragment 处理。然而，如果使用了\
  \ `android:onClick` 资源，事件将直接传递给包含 fragment 的 activity。\n\n## 30.6 实现 fragment 间的通信\n\
  \n一旦一个或多个 fragment 被嵌入到 activity 中，很可能需要在 fragment 与 activity 之间、以及两个 fragment 之间进行某种形式的通信。事实上，良好的实践要求\
  \ fragment 之间不要进行直接通信。所有通信都应该通过封装它们的 activity 进行。\n\n为了让 activity 与 fragment 通信，activity\
  \ 必须通过分配给它的 ID 来标识 fragment 对象。一旦获得了该引用，activity 就可以调用 fragment 对象的公共方法。\n\n反向通信（从\
  \ fragment 到 activity）要稍微复杂一些。首先，fragment 必须定义一个监听器接口，然后在 activity 类中实现该接口。例如，以下代码在名为\
  \ `ToolbarFragment` 的 fragment 类上声明了一个名为 `ToolbarListener` 的接口。代码还声明了一个变量，稍后将存储\
  \ activity 的引用：\n\n```java\npublic class ToolbarFragment extends Fragment {\n  \
  \  ToolbarListener activityCallback;\n\n    public interface ToolbarListener {\n\
  \        public void onButtonClick(int position, String text);\n    }\n.\n.\n}\n\
  ```\n\n上述代码规定，任何实现 `ToolbarListener` 接口的类都必须实现一个名为 `onButtonClick` 的回调方法，该方法反接受一个整数和一个\
  \ `String` 作为参数。\n\n接下来，需要重写并实现 fragment 类的 `onAttach()` 方法。当 fragment 初始化并与 activity\
  \ 关联时，Android 系统会自动调用此方法。该方法被传递了包含 fragment 的 activity 的引用。该方法必须存储对该 activity 的本地引用，并验证它实现了\
  \ `ToolbarListener` 接口：\n\n```java\n@Override\npublic void onAttach(Context context)\
  \ {\n    super.onAttach(context);\n    try {\n        activityCallback = (ToolbarListener)\
  \ activity;\n    } catch (ClassCastException e) {\n        throw new ClassCastException(activity.toString()\
  \ + \" must implement ToolbarListener\");\n    }\n}\n```\n*（注：提供的 `onAttach` 原文是片段化/不完整的；我根据提供的上下文重构了标准逻辑以保持语义的完整性）。*\n\
  \n下一步是从 fragment 调用回调方法。例如，以下代码调用了 activity 上的回调方法：\n\n```java\npublic void buttonClicked(View\
  \ view) {\n    activityCallback.onButtonClick(arg1, arg2);\n}\n```\n\n剩下的只是修改 activity\
  \ 以使其实现 `ToolbarListener` 接口。例如：\n\n```java\npublic class MainActivity extends FragmentActivity\
  \ implements ToolbarFragment.ToolbarListener {\n    public void onButtonClick(String\
  \ arg1, int arg2) {\n        // 实现回调方法的代码\n    }\n}\n```\n\n## 30.7 总结\n\nfragment\
  \ 提供了一句强大的机制，用于创建可重用的用户界面布局和应用程序行为模块，这些模块一旦创建，就可以嵌入到 activity 中。一个 fragment 由一个用户界面布局文件和一个类组成。可以通过向\
  \ activity 的布局文件添加 fragment，或者通过编写代码在运行时管理 fragment 来在 activity 利用 fragment。在代码中添加到\
  \ activity 的 fragment 可以在运行时被移除和替换。\n\n\n\n在本章创建的应用将包含一个活动（activity）和两个片段（fragment）。第一个片段的用户界面将包含一个类似于工具栏，由一个\
  \ `EditText` 视图、一个 `SeekBar` 和一个 `Button` 组成，它们都包含在一个 `ConstraintLayout` 视图中。第二个片段仅包含一个\
  \ `TextView` 对象，同样包含在一个 `ConstraintLayout` 视图中。\n\n这两个片段将嵌入应用程序的主活动中，并实现通信功能：使得当点击第一个片段中的按钮时，输入到\
  \ `EditText` 视图中的文本将显示在第二个片段的 `TextView` 上，且其字体大小由第一个片段中 `SeekBar` 的位置决定。\n\n由于此应用程序旨在在较早版本的\
  \ Android 上运行，因此有必要使用适当的 Android 支持库（support library）。\n\n## 31.2 创建示例项目\n\n从欢迎界面选择\
  \ `New Project`（新建项目）选项，在弹出的新项目对话框中，点击 `Next`（下一步）按钮之前选择 `Empty Activity`模板。\n\n\
  在 `Name`（名称）字段中输入 `FragmentExample`，并指定 `com.ebookfrenzy.fragmentexample` 为包名。在点击\
  \ `Finish`（完成）按钮之前，将 `Minimum API level`（最低 API 级别）设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language`（语言）菜单改为 `Java`。按照 11.8 迁移项目到 View Binding 节列出的步骤，修改项目以使用视图绑定（view binding）。\n\
