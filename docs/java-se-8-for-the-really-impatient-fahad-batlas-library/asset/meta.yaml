    的变体 `NY`。
- - '##'
  - 5. 可选的，扩展（extension）。扩展描述了对日历（如日本历法）、数字（泰国数字）等的本地偏好。Unicode 标准规定了其中一些扩展。此类扩展以
    `u-` 开头，并跟着一个两个字母的代码，指定该扩展处理的是日历（`ca`）、数字（`nu`）等。例如，扩展 `u-nu-thai` 表示使用泰国数字。其他扩展完全任意，并以
    `x-` 开头，例如 `x-java`。
