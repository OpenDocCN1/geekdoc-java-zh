- "# 给急躁者的 Java SE 8 入门指南 (Fahad Batla 系列)\n\n\n\n![](img/9780133430196.jpg)\n\n![cover-image](img/9780133430196.jpg)\n\
  \n# 关于本电子书\n\nePUB 是一种开放的行业标准电子书格式。然而，阅读设备和应用程序对 ePUB 及其许多功能的支持各相同。请使用您的设备或应用设置来根据喜好自定义显示。您可以自定义的设置通常包括字体、字体大小、单栏或双栏、横屏或竖屏模式，以及可以点击或触摸放大的图像。有关您的阅读设备或应用设置和功能的更多信息，请访问设备制造商的网站。\n\
  \n许多书籍包含编程代码或配置示例。为了优化这些元素的显示效果，请在单栏横屏模式下查看电子书并将字体大小调整为最小。除了以流式文本格式显示代码和配置外，我们还包含了代码图像，以模仿印刷书籍中的显示效果；因此，当流式格式可能会影响代码列表的显示时，您将看到“点击此处查看代码图像”链接。点击该链接查看高保真代码图像。要返回上一页，请点击设备或应用上的返回按钮。\n\
  \n\n\n![Image](img/pub.jpg)\n\n新泽西州上萨德河 • 波士顿 • 印安波利斯 旧金山\n\n纽约 • 多伦多 • 蒙特利尔 伦敦\
  \ • 慕尼黑 • 巴黎 • 马里德\n\n开敦 • 悉尼 • 东京 • 新加坡 墨西哥城\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n  \
  \  -> message.setFont(new Font(newValue.doubleValue())));\n```\n\n***\n\n## 4.5.\
  \ 绑定\n\nJavaFX 属性存在的意义在于*绑定*（binding）：当一个属性发生变化时自动更新另一个属性。例如，考虑图 4–3 中的应用程序。当用户编辑顶部地址时，底部地址也会之更新。\n\
  \n![Image](img/04fig03.jpg)\n\n**图 4–3** 绑定的文本属性会自动更新。\n\n这是通过将一个属性绑定到另一个属性来实现：\n\
  \n点击此处查看代码图像\n\n\n\n\n\n```java\nbilling.textProperty().bind(shipping.textProperty());\n\
  ```\n\n在底层，在 `shipping` 的文本属性上添加了一个监听器，该监听器会设置 `billing` 的文本属性。\n\n你也可以调用：\n\n点击此处查看代码图片\n\
  \n```java\nbilling.textProperty().bindBidirectional(shipping.textProperty());\n\
  ```\n\n如果其中一个属性发生变化，另一个也会随之更新。\n\n要撤销绑定，请调用 `unbind` 或 `unbindBidirectional`。\n\n\
  绑定机制解决了用户界面编程中的一个常见问题。例如，考虑一个日期字段和一个日历选择器。当用户从日历中选择一个日期时，日期字段应该自动更新，模型中的日期属性也是如此。\n\
  \n当然，在许多情况下，一个属性依赖于另一个属性，但这种关系更为复杂。考虑图 4–4。我们总是希望圆在场景中居中。也就是说，它的 `centerX` 属性应该是场景\
  \ `width` 属性的一半。\n\n![Image](img/04fig04.jpg)\n\n**图 4–4** 此圆的中心绑定到场景宽度和高度一半。\n\n\
  为了实现这一点，我们需要产生一个计算属性。`Bindings` 类提供了为此目的设计的静态方法。例如，`Bindings.divide(scene.widthProperty(),\
  \ 2)` 是一个属性，其值是场景宽度的一半。当场景宽度变化时，该属性也随之变化。剩下的就是将该计算属性绑定到圆的 `centerX` 属性：\n\n点击此处查看代码图片\n\
  \n```java\ncircle.centerXProperty().bind(Bindings.divide(scene.widthProperty(),\
  \ 2));\n```\n\n* * *\n\n![Image](img/note.jpg) 备注\n\n或者，你可以调用 `scene.widthProperty().divide(2)`。对于更复杂的表达式，静态的\
  \ `Bindings` 方法似乎更易读，特别是当你使用：\n\n点击此处查看代码图片\n\n```java\nimport static javafx.beans.binding.Bindings.*;\n\
  ```\n\n并编写 `divide(scene.widthProperty(), 2)` 时。\n\n* * *\n\n这里有一个更真实的示例。我们希望当仪表盘太小或太大时禁用\
  \ `Smaller` 和 `Larger` 按钮（图 4–5）。\n\n![Image](img/04fig05.jpg)\n\n**图 4–5** 当仪表盘到达任一端时，按钮会被禁用。\n\
  \n点击此处查看代码图片\n\n```java\nsmaller.disableProperty().bind(Bindings.lessThanOrEqual(gauge.widthProperty(),\
  \ 0));\nlarger.disableProperty().bind(Bindings.greaterThanOrEqual(gauge.widthProperty(),\
  \ 100));\n```\n\n当宽度 ≤ 0 时，`Smaller` 按钮被禁用。当宽度 ≥ 100 时，`Larger` 按钮被禁用。\n\n表 4–1\
  \ 列出了 `Bindings` 类提供的所有操作符。一个或两个参数实现了 `Observable` 接口或其一个子接口。`Observable` 接口提供了添加和移除\
  \ `InvalidationListener` 的方法。`ObservableValue` 接口增加了 `ChangeListener` 管理和 `getValue`\
  \ 方法。其子接口提供了获取相应类型值的方法。例如，`ObservableStringValue` 的 `get` 方法返回 `String`，而 `ObservableIntegerValue`\
  \ 的 `get` 方法返回 `int`。`Bindings` 方法的返回类型是 `Binding` 接口的子接口，而 `Binding` 本身是 `Observable`\
  \ 接口的子接口。`Binding` 知晓它依赖的所有属性。\n\n![Image](img/04tab01.jpg)![Image](img/04tab01a.jpg)\n\
  \n**表 4–1** `Bindings` 类提供的操作符\n\n在实践中，你不需要担心所有这些接口。你组合属性，就可以得到一个可以绑定到另一个属性的东西。\n\
  \n使用 `Bindings` 类的方法构建计算属性可能会变得非常复杂。还有另一种产生计算绑定的方法，你可能会觉得更简单。简单来说，将想要计算的表达式放入 lambda\
  \ 表达式中，并提供一个依赖属性列表。当任何属性发生变化时，lambda 就会重新计算。例如，\n\n点击此处查看代码图片\n\n```java\nlarger.disableProperty().bind(\n\
  \    createBooleanBinding(\n        () -> gauge.getWidth() >= 100, // 此表达式会被计算...\n\
  \        gauge.widthProperty())); // ...当此属性变化时\n```\n\n练习 5 提供了一种稍微优雅一点的方法来使用 lambda\
  \ 表达式惰性求值绑定。\n\n* * *\n\n![Image](img/note.jpg) 备注\n\n在 JavaFX Script 语言中，编译器分析绑定表达式并自动识别出依赖属性。你只需要声明\
  \ `disable bind gauge.width >= 100`，编译器就会在 `gauge.width` 属性上附加一个监听器。当然，在 Java 中，程序员需要手动提供这些信息。\n\
  \n* * *\n\n## 4.6 布局\n\n当图形用户界面包含控件时，它们需要在屏幕上排列。获取布局的一种方法是使用设计工具。该工具让你将元素拖入其中、调整大小并配置。然而，这种方法在元素大小变化时会出现问题。\n\
  \n另一种方法是使用 HTML 和 CSS。同样，JavaFX 支持三种方法。SceneBuilder 是一个可视化构建器。你可以从 [www.oracle.com/technetwork/java](https://www.oracle.com/technetwork/java)\
  \ 下载它。图 4–6 显示了截图。\n\n![Image](img/04fig06.jpg)\n\n**图 4–6** JavaFX SceneBuilder\n\
  \n我们不会进一步讨论 SceneBuilder。当你理解了本节的概念后，会发现它非常好用。\n\n程序化布局与 Swing 非常相似。然而，不是使用布局管理器，而是使用容器——具有布局策略的容器。例如，`BorderPane`\
  \ 有五个区域：北、西、南、东和中心。在这里我们在每个区域都放置一个按钮：\n\n点击此处查看代码图片\n\n```java\nBorderPane pane\
  \ = new BorderPane();\npane.setTop(new Button(\"Top\"));\npane.setLeft(new Button(\"\
  Left\"));\npane.setCenter(new Button(\"Center\"));\npane.setRight(new Button(\"\
  Right\"));\npane.setBottom(new Button(\"Bottom\"));\nstage.setScene(new Scene(pane));\n\
  ```\n\n图 4–7 显示了结果。\n\n![Image](img/04fig07.jpg)\n\n**图 4–7** `BorderPane` 布局\n\n\
  * * *\n\n![Image](img/note.jpg) 备注\n\n在 Swing 的 `BorderLayout` 中，按钮会填充布局的每个区域。在\
  \ JavaFX 中，按钮不会超过其自然尺寸。\n\n* * *\n\n现在假设你想在南部区域放置多个按钮。使用 `HBox`（见图 4–8）：\n\n点击此处查看代码图片\n\
  \n```java\nHBox box = new HBox(10); // 控件间 10 像素\nbox.getChildren().addAll(yesButton,\
  \ noButton, maybeButton);\n```\n\n![Image](img/04fig08.jpg)\n\n**图 4–8** 使用 `HBox`\
  \ 布局按钮\n\n当然，还有一个 `VBox` 用于垂直排列控件。图 4–8 中的布局是通过这种方式实现的：\n\n```java\nVBox pane =\
  \ new VBox(10);\npane.getChildren().addAll(question, buttons);\npane.setPadding(new\
  \ Insets(10));\n```\n\n注意 `padding` 属性。如果没有它，标签和按钮将触碰到窗口边界。\n\n* * *\n\n![Image](img/caution.jpg)\n\
  \n\n\n\n在 JavaFX 中，尺寸是以像素为单位的。在我们的示例中，我们使用十像素作为框间距和内边距。在如今像素密度差异巨大的情况下，这种做法并不十分合适。克服这一问题的方法之一是在\
  \ `rem` 中计算尺寸，就像你在 CSS3 中做的那样。（`rem` 或“根节点 em”是文档根节点默认字体的高度。）\n\n点击此处查看代码\n\n```java\n\
  final double rem = new Text(\"\").getLayoutBounds().getHeight();\n\npane.setPadding(new\
  \ Insets(0.8 * rem));\n```\n\n***\n\n仅依靠水平和垂直布局框（boxes）所能实现的效果是有限的。就像 Swing 有 `GridBagLayout`\
  \ 作为“布局管理器之母”一样，JavaFX 有 `GridPane`。可以将 `GridPane` 想象一个 HTML 表格。你可以设置所有单元格的水平和垂直对齐。如果需要，单元格可以跨越多行和多列。参考图\
  \ 4–9 中的登录对话框。\n\n![Image](img/04fig09.jpg)\n\n**图 4–9** 一个 `GridPane` 可以排列此登录对话框的控件。\n\
  \n注意以下几点：\n\n• 标签“User name:”和“Password:”是右对齐的。\n• 按钮位于一个跨越两行的 `HBox` 中。\n\n向 `GridPane`\
  \ 添加子节点时，请指定它的列索引和行索引（按此顺序；将其想象为 *x-* 和 *y-* 坐标）。\n\n```java\npane.add(usernameLabel,\
  \ 0, 0);\n\npane.add(username, 1, 0);\n\npane.add(passwordLabel, 0, 1);\n\npane.add(password,\
  \ 1, 1);\n```\n\n如果子节点跨越了多列或行，请在位置之后指定跨度。例如，按钮面板跨越了两列和一行：\n\n```java\npane.add(buttons,\
  \ 0, 2, 2, 1);\n```\n\n如果你想让子节点跨越所有剩余的行或列，可以使用 `GridPane.REMAINING`。\n\n要设置子节点的水平对齐，请使用静态方法\
  \ `setHalignment`，并传递子节点引用以及来自 `HPos` 枚举的常量 `LEFT`、`CENTER` 或 `RIGHT`。\n\n点击此处查看代码\n\
  \n```java\nGridPane.setHalignment(usernameLabel, HPos.RIGHT);\n```\n\n同样，对于垂直对齐，调用\
  \ `setValignment` 并使用来自 `VPos` 枚举的 `TOP`、`CENTER` 或 `BOTTOM`。\n\n***\n\n![Image](img/note.jpg)\
  \ 注意\n\n这些静态调用在 Java 代码中看起来并不优雅，但在 FXML 标记语言中它们是有意义的——见下一节。\n\n***\n\n***\n\n![Image](img/caution.jpg)\
  \ 注意\n\n*不要*在网格中居中带有按钮的 `HBox`。该布局框已经扩展到了整个水平宽度，居中不会改变它的位置。相反，请让 `HBox` 将其内容居中：\n\
  \n```java\nbuttons.setAlignment(Pos.CENTER);\n```\n\n***\n\n你可能还想在行和列周围提供一些间距并在表格周围提供一些内边距：\n\
  \n点击此处查看代码\n\n```java\npane.setHgap(0.8 * em);\n\npane.setVgap(0.8 * em);\n\npane.setPadding(new\
  \ Insets(0.8 * em));\n```\n\n***\n\n![Image](img/tip.jpg) 提示\n\n为了调试，查看单元格边界可能会很有用（参考图\
  \ 4–10）。调用\n\n点击此处查看代码\n\n```java\npane.setGridLinesVisible(true);\n```\n\n如果你想查看单个子节点的边界（例如，查看它是否已增长并填充整个单元格），请设置它的边界。通过\
  \ CSS 实现这一点最容易：\n\n点击此处查看代码\n\n```java\nbuttons.setStyle(\"-fx-border-color: red;\"\
  );\n```\n\n![Image](img/04fig10.jpg)\n\n**图 4–10** 在调试 `GridPane` 时使用可见的网格线。\n\n\
  ***\n\n这些布局面板应该足够大多数应用程序使用。表 4–2 显示了 JavaFX 自带的所有布局。\n\n![Image](img/04tab02.jpg)\n\
  \n**表 4–2** JavaFX 布局\n\n***\n\n![Image](img/note.jpg) 注意\n\n在本节中，我们通过手动嵌套布局框和控件构建了用户界面。JavaFX\
  \ Script 有一种用于描述此类嵌套结构的“构建器”语法（称为“场景图”）。JavaFX 2 使用构建类来模仿该语法。以下是构建登录对话框的方法：\n\n\
  点击此处查看代码\n\n```java\nGridPane pane = GridPaneBuilder.create()\n    .hgap(10)\n \
  \   .vgap(10)\n    .padding(new Insets(10))\n    .children(\n// ...\n```\n\n\n\n\
  \n大多数属性都对应于属性的设置方法（setters）。例如，\n\n```xml\n<GridPane hgap=\"10\" vgap=\"10\">\n\
  ```\n\n意味着“构造一个 `GridPane`，然后设置 `hgap` 和 `vgap` 属性”。\n\n当一个属性以类名和静态方法开头时，会调用该方法。例如，点击此处查看代码图像\n\
  \n```xml\n<TextField GridPane.columnIndex=\"1\" GridPane.rowIndex=\"0\"/>\n```\n\
  \n意味着将调用静态方法 `GridPane.setColumnIndex(thisTextField, 1)` 和 `GridPane.setRowIndex(thisTextField,\
  \ 0)`。\n\n* * *\n\n![Image](img/note.jpg) 注意\n\n通常情况下，FXML 元素是使用其默认构造函数构建的，然后通过调用属性设置方法或静态方法进行定制，这符合\
  \ JavaBeans 规范的精髓。我们将在稍后考虑一些少数例外情况。\n\n* * *\n\n当一个属性值太复杂而无法用字符串表示时，应使用嵌套元素而不是属性。例如，点击此处查看代码图像\n\
  \n```xml\n<GridPane hgap=\"10\" vgap=\"10\">\n    <padding>\n        <Insets top=\"\
  10\" right=\"10\" bottom=\"10\" left=\"10\"/>\n    </padding>\n    ...\n```\n\n\
  `padding` 属性的类型为 `Insets`，而 `Insets` 对象是通过 `<Insets ...>` 子元素构建的，并指定了如何设置其属性。\n\n\
  最后，列表属性有一个特殊规则。例如，`children` 是一个列表属性，调用 点击此处查看代码图像\n\n```xml\n<HBox ...>\n    <children>\n\
  \        <Button text=\"Ok\" />\n        <Button text=\"Cancel\" />\n    </children>\n\
  </HBox>\n```\n\n将将按钮添加到 `getChildren` 返回的列表中。\n\n你可以手动编写 FXML 文件，也可以使用我在前一节中提到的\
  \ SceneBuilder 程序。一旦你有了这样一个文件，可以像这样加载它：点击此处查看代码图像\n\n```java\npublic void start(Stage\
  \ stage) {\n    try {\n        Parent root = FXMLLoader.load(getClass().getResource(\"\
  dialog.fxml\"));\n        stage.setScene(new Scene(root));\n        stage.show();\n\
  \    } catch (IOException ex) {\n        ex.printStackTrace();\n        System.exit(0);\n\
  \    }\n}\n```\n\n当然，这本身还没有用处。用户界面显示了，但程序无法访问用户提供的值。在控件和程序之间建立连接的一种方法是使用 `id` 属性，就像你在\
  \ JavaScript 中做的那样。在 FXML 文件中提供 `id` 属性：点击此处查看代码图像\n\n```xml\n<TextField id=\"username\"\
  \ GridPane.columnIndex=\"1\" GridPane.rowIndex=\"0\"/>\n```\n\n在程序中，查找控件：点击此处查看代码图像\n\
  \n```java\nTextField username = (TextField) root.lookup(\"#username\");\n```\n\n\
  但有一个更好的方法。你可以使用 `@FXML` 注解将控件对象“注入”到*控制器*类中。该控制器类必须实现 `Initializable` 接口。在控制器的 `initialize`\
  \ 方法中，你连接绑定器和事件处理器。任何类都可以作为控制器，甚至是 FX 应用程序本身。\n\n例如，这里是我们登录对话框的控制器：点击此处查看代码图像\n\n\
  ```java\npublic class LoginDialogController implements Initializable {\n    @FXML\
  \ private TextField username;\n    @FXML private PasswordField password;\n    @FXML\
  \ private Button okButton;\n\n    public void initialize(URL url, ResourceBundle\
  \ rb) {\n        okButton.disableProperty().bind(\n            Bindings.createBooleanBinding(\n\
  \                () -> username.getText().length() == 0\n                    ||\
  \ password.getText().length() == 0,\n                username.textProperty(),\n\
  \                password.textProperty()));\n        okButton.setOnAction(event\
  \ ->\n            System.out.println(\"Verifying \" + username.getText()\n     \
  \           + \":\" + password.getText()));\n    }\n}\n```\n\n在 FXML 文件中，使用 `fx:id`（而不是\
  \ `id`）属性将控制器的实例变量名提供给 FXML 文件中对应的控件元素：点击此处查看代码图像\n\n```xml\n<TextField fx:id=\"\
  username\" GridPane.columnIndex=\"1\" GridPane.rowIndex=\"0\"/>\n<PasswordField\
  \ fx:id=\"password\" GridPane.columnIndex=\"1\" GridPane.rowIndex=\"1\" />\n<Button\
  \ fx:id=\"okButton\" text=\"Ok\" />\n```\n\n在根元素中，你还需要使用 `fx:controller` 属性声明控制器类：点击此处查看代码图像\n\
  \n```xml\n<GridPane xmlns:fx=\"http://javafx.com/fxml\" hgap=\"10\" vgap=\"10\"\
  \ fx:controller=\"LoginDialogController\">\n```\n\n## 4.8 CSS\n\nJavaFX 允许你使用 CSS\
  \ 更改用户界面的外观，这通常比提供 FXML 属性或调用 Java 方法更方便。你可以通过编程方式加载 CSS 样式表并将其应用到场景（scene）中：\n\n\
  ```java\nScene scene = new Scene(pane);\nscene.getStylesheets().add(\"scene.css\"\
  );\n```\n\n在样式表中，你可以引用任何带有 ID 的控件。例如，这里是控制一个 `GridPane` 外观的方法。在代码中设置 ID：\n\n```java\n\
  GridPane pane = new GridPane();\npane.setId(\"pane\");\n```\n\n不要在代码中设置任何内边距或间距。相反，使用\
  \ CSS。\n\n```css\n#pane {\n    -fx-padding: 0.5em;\n    -fx-hgap: 0.5em;\n    -fx-vgap:\
  \ 0.5em;\n    -fx-background-image: url(\"metal.jpg\")\n}\n```\n\n\n\n\n\n遗憾的是，你不能使用熟悉的\
  \ CSS 属性，而是需要知道以 `-fx-` 开头的 FX 特有属性。这些属性名称是通过将属性名转换为小写并用连字符代替驼峰命名法而成的。例如，`textAlignment`\
  \ 属性变为 `-fx-text-alignment`。你可以在 JavaFX CSS 的参考文档中找到所有支持的属性：[`docs.oracle.com/javafx/2/api/javafx/scene/doc-files/cssref.html`](http://docs.oracle.com/javafx/2/api/javafx/scene/doc-files/cssref.html)。\n\
  \n使用 CSS 比在代码中充斥着布局细节要优雅得多。而且，你可以轻松地使用与分辨率无关的 `em` 单位。当然，CSS 既可以用于善意也可以用于作恶（参见图\
  \ 4–11），我希望你能够抵制在登录对话框中添加无意义背景纹理的诱惑。\n\n![Image](img/04fig11.jpg)\n\n**图 4–11**\
  \ 使用 CSS 样式化用户界面\n\n与其通过单个 ID 进行样式化，你可以使用样式类。将该类添加到节点对象中：\n\n点击此处查看代码图片\n\n```java\n\
  HBox buttons = new HBox();\n\nbuttons.getStyleClass().add(\"buttonrow\");\n```\n\
  \n然后使用 CSS 类符号对其进行样式化：\n\n```css\n.buttonrow {\n    -fx-spacing: 0.5em;\n}\n```\n\
  \n每个 JavaFX 控件和形状类都属于一个 CSS 类，其名称是小写化后的 Java 类名。例如，所有的 `Label` 节点都拥有类 `label`。以下是你可以如何将所有标签的字体更改为\
  \ Comic Sans：\n\n点击此处查看代码图片\n\n```css\n.label {\n    -fx-font-family: \"Comic Sans\
  \ MS\";\n}\n```\n\n但请不要这样做。\n\n你还可以在 FXML 布局中使用 CSS。将样式表挂载到根面板上：\n\n点击此处查看代码图片\n\
  \n```xml\n<GridPane id=\"pane\" stylesheets=\"scene.css\">\n```\n\n在 FXML 代码中提供\
  \ `id` 或 `styleClass` 属性。例如，\n\n```xml\n<HBox styleClass=\"buttonrow\">\n```\n\n\
  然后你可以在 CSS 中指定大部分样式，而仅将 FXML 用于布局。遗憾的是，你无法完全从 FXML 中移除所有样式。例如，目前还没有没有方法在 CSS 中指定网格单元对齐。\n\
  \n***\n\n![Image](img/note.jpg) 注意\n\n你还可以通过编程方式应用 CSS 样式，例如：\n\n点击此处查看代码图片\n\n\
  ```java\nbuttons.setStyle(\"-fx-border-color: red;\");\n```\n\n这对于调试可能很有用，但通常情况下，使用外部样式表似乎更好。\n\
  \n***\n\n## 4.9. 动画与特效\n\n当 JavaFX 出生时，特效非常流行，而 JavaFX 能够轻松地产生阴影、模糊和移动。你会在网上找到几十个精美的演示，上面气泡在无目的地旋转，文字在紧张地跳动等等。我想你可能会喜欢一些关于如何将这些动画带到业务应用世界的实用技巧。图\
  \ 4–12 显示了一个应用程序，其中“是”按钮尺寸在增大，而“否”按钮淡入背景，而“可能”按钮则在旋转。\n\n![Image](img/04fig12.jpg)\n\
  \n**图 4–12** 会增长、淡出和旋转的按钮\n\nJavaFX 定义了许多过渡效果，它们可以在一段时间内改变节点的属性。以下是如何在三秒钟内沿 `x`\
  \ 和 `y` 方向将一个节点放大 50% 的方法：\n\n点击此处查看代码图片\n\n```java\nScaleTransition st = new ScaleTransition(Duration.millis(3000));\n\
  \nst.setByX(1.5);\n\nst.setByY(1.5);\n\nst.setNode(yesButton);\n\nst.play();\n```\n\
  \n该节点可以是场景图中的任何节点，例如肥皂泡动画中的圆圈，或者我们示例中愈具诱惑力的“是”按钮。\n\n按照设置，过渡将在达到目标时结束。你可以像这样无限循环它：\n\
  \n点击此处查看代码图片\n\n```java\nst.setCycleCount(Animation.INDEFINITE);\n\nst.setAutoReverse(true);\n\
  ```\n\n现在，节点会变大，然后变小，紧接着又变大，以此类推。\n\n`FadeTransition` 改变节点的透明度。以下是“否”按钮淡入背景的方式：\n\
  \n点击此处查看代码图片\n\n```java\nFadeTransition ft = new FadeTransition(Duration.millis(3000));\n\
  \nft.setFromValue(1.0);\n\nft.setToValue(0);\n\nft.setNode(noButton);\n\nft.play();\n\
  ```\n\n所有的 JavaFX 节点都可以围绕其中心进行旋转。`RotateTransition` 改变节点的 `rotate` 属性。以下代码使“可能”按钮进行旋转：\n\
  \n点击此处查看代码图片\n\n```java\nRotateTransition rt = new RotateTransition(Duration.millis(3000));\n\
  \nrt.setByAngle(180);\n\nrt.setCycleCount(Animation.INDEFINITE);\n\nrt.setAutoReverse(true);\n\
  \nrt.setNode(maybeButton);\n\nrt.play();\n```\n\n你可以使用 `ParallelTransition` 和 `SequentialTransition`\
  \ 来组合过渡效果，让它们并行执行或顺序执行。如果你需要处理多个节点，可以将它们放入 `Group` 节点。如果你需要创建这种行为，[ch04.html_fig13]\
  \ 显示了 `Text` 节点的结果。以下是代码：\n\n点击此处查看代码图片\n\n```java\nDropShadow dropShadow = new\
  \ DropShadow();\n\ndropShadow.setRadius(5.0);\n\ndropShadow.setOffsetX(3.0);\n\n\
  dropShadow.setOffsetY(3.0);\n\ndropShadow.setColor(Color.GRAY);\n\nText text = new\
  \ Text(\"Drop shadow\");\n\ntext.setFill(Color.RED);\n\ntext.setFont(Font.font(\"\
  sans\", FontWeight.BOLD, 40));\n\ntext.setEffect(dropShadow);\n```\n\n![Image](img/04fig13.jpg)\n\
  \n**图 4–13** JavaFX 特效\n\n设置发光或模糊效果同样简单：\n\n点击此处查看代码图片\n\n```java\ntext2.setEffect(new\
  \ Glow(0.8));\n\ntext3.setEffect(new GaussianBlur());\n```\n\n承认，发光效果看起来有点廉价，模糊效果在业务领域并没有许多应用，但制作这些效果确实令人印象深刻。\n\
  \n## 4.10. 华丽控件\n\n当然，JavaFX 拥有组合框、标签页面板、树形和表格，就像 Swing 一样，还有一些 Swing 没有的控件，例如日期选择器和手风琴。需要一整本书来详细描述这些内容。在本节中，我想通过向你展示三个超越\
  \ Swing 的控件来消除任何对 Swing 的怀旧之情。图 4–14 显示了你可以使用 JavaFX 开箱即用的许多图表之一，无需安装任何第三方库。\n\n\
  ![Image](img/04fig14.jpg)\n\n**图 4–14** 一个 JavaFX 图表\n\n并且像饼一样简单：\n\n点击此处查看代码图片\n\
  \n```java\nObservableList<PieChart.Data> pieChartData = FXCollections.observableArrayList(\n\
  \    new PieChart.Data(\"Asia\", 4298723000.0),\n    new PieChart.Data(\"North America\"\
  , 355361000.0),\n    new PieChart.Data(\"South America\", 616644000.0),\n    new\
  \ PieChart.Data(\"Europe\", 742452000.0),\n    new PieChart.Data(\"Africa\", 1110635000.0),\n\
  \    new PieChart.Data(\"Oceania\", 38304000.0)\n);\n\nfinal PieChart chart = new\
  \ PieChart(pieChartData);\n\nchart.setTitle(\"Population of the Continents\");\n\
  ```\n\n总而言之，有六种你可以使用和自定义的图表类型。更多信息请参阅 [`docs.oracle.com/javafx/2/charts/chart-overview.htm`](http://docs.oracle.com/javafx/2/charts/chart-overview.htm)。\n\
  \n\n\n\n在 Swing 中，你可以在 `JEditorPane` 中显示 HTML，但对于大多数真实场景中的 HTML 来说，渲染效果很差。这可以理解——实现一个浏览器是一项艰巨的工作。事实上，这项工作困难，以至于大多数浏览器都是在开源\
  \ WebKit 引擎之上构建的。JavaFX 也采取了同样的做法。`WebView` 显示一个嵌入的原生 WebKit 窗口（参见图 4–15）。\n\n![Image](img/04fig15.jpg)\n\
  \n**图 4–15** 浏览网页\n\n以下是显示网页的代码：\n\n点击此处查看代码图片\n\n```java\nString location = \"\
  http://horstmann.com\";\n\nWebView browser = new WebView();\n\nWebEngine engine\
  \ = browser.getEngine();\n\nengine.load(location);\n```\n\n该浏览器是活跃的——你可以像往常一样点击链接。JavaScript\
  \ 同样有效。然而，如果你想从 JavaScript 显示状态栏或弹出消息，你需要安装通知处理程序并实现自己的状态栏和弹出窗口。\n\n***\n\n![Image](img/note.jpg)\
  \ 注意\n\n`WebView` 不支持任何插件，因此你无法用它显示 Flash 动画或 PDF 文档。它也不显示 applet。\n\n***\n\n在 JavaFX\
  \ 之前，Java 的媒体播放功能非常糟糕。Java Media Framework 作为一个可选下载项提供，但它并没有受到开发者的青睐。当然，实现音频和视频播放比编写浏览器还要困难。因此，JavaFX\
  \ 利用了现有的工具包——开源的 GStreamer 框架。\n\n要播放视频，需要从 URL 字符串构造一个 `Media` 对象，构造一个 `MediaPlayer`\
  \ 来播放它，以及一个 `MediaView` 显示播放器：\n\n点击此处查看代码图片\n\n```java\nPath path = Paths.get(\"\
  moonlanding.mp4\");\n\nString location = path.toUri().toString();\n\nMedia media\
  \ = new Media(location);\n\nMediaPlayer player = new MediaPlayer(media);\n\nplayer.setAutoPlay(true);\n\
  \nMediaView view = new MediaView(player);\n\nview.setOnError(e -> System.out.println(e));\n\
  ```\n\n正如你在图 4–16 中看到的，视频正在播放——但遗憾的是，没有视频控制控件。你可以添加自己的（参见[`docs.oracle.com/javafx/2/media/playercontrol.htm`](http://docs.oracle.com/javafx/2/media/playercontrol.htm)，但如果能提供一组默认控件就更好了）。\n\
  \n![Image](img/04fig16.jpg)\n\n**图 4–16** 播放视频\n\n***\n\n![Image](img/note.jpg)\
  \ 注意\n\n经常，GStreamer 无法处理特定的视频文件。代码示例中的错误处理器会显示 GStreamer 消息，以便你诊断播放问题。\n\n***\n\
  \n这标志着我们 JavaFX 快速之旅的结束。JavaFX 是桌面 Java 的未来。它有一些粗糙之处，主要是由于从原始脚本语言仓忙转换而来。但它用起来确实并不比\
  \ Swing 困难，而且它比 Swing 拥有的具有更多有用且吸引人的控件。\n\n## 练习题\n\n**1.** 编写一个带有文本字段和标签的程序。与 Hello,\
  \ JavaFX 程序一样，标签应该具有 100 点字号的字符串 \"Hello, FX\"。初始化文本字段为相同的字符串。当用户编辑文本字段时，更新标签。\n\
  \n**2.** 考虑一个包含许多 JavaFX 属性的类，例如图表或表格。很有可能在特定的应用程序中，大多数属性从没有附加过监听器。因此，为每个属性都设置一个属性对象是浪费的。展示如何按需设置属性：首先使用一个普通字段来存储属性值，然后仅在第一次调用\
  \ `xxxProperty()` 方法时才使用属性对象。\n\n**3.** 考虑一个包含许多 JavaFX 属性的类，其中大多数属性从未从默认值改变。展示如何按需设置属性，即当它被设置为非默认值时，或者在第一次调用\
  \ `xxxProperty()` 方法时。\n\n**4.** 增强第 4.5 节 中的“绑定”程序，其位于第 75 页，使圆保持居中并始终至少接触场景的两个边。\n\
  \n**5.** 编写方法\n\n点击此处查看代码图片\n\n```java\npublic static <T, R> ObservableValue<R>\
  \ observe(\n    Function<T, R> f, ObservableValue<T> t)\n\npublic static <T, U,\
  \ R> ObservableValue<R> observe(\n    BiFunction<T, U, R> f, ObservableValue<T>\
  \ t, ObservableValue<U> u)\n```\n\n这些方法返回可观测值，其 `getValue` 方法返回 lambda 表达式的值，并且当任何输入失效或更改时，其失效监听器和变化监听器会被触发。例如，\n\
  \n点击此处查看代码图片\n\n```java\nt.disableProperty().bind(observe(t -> t >= 10))\n```\n\n\
  **6.** 如你在图 4–7 中所示，视频正在播放——但遗憾的是，没有视频控制控件。你可以添加自己的（参见[`docs.oracle.com/javafx/2/media/playercontrol.htm`](http://docs.oracle.com/javafx/2/media/playercontrol.htm)，但如果能提供一组默认控件就更好了）。\n\
  \n**7.** 既然没有 JavaFX，如何处理时间。**8.** 一个行星。**9.** 动画化一个圆。**10.** 使用 `PathTransition`。\n\
  \n# 第 5 章 新日期和时间 API\n\n## 本章主题\n\n![Image](img/note.jpg) 5.1 时间线\n\n![Image](img/note.jpg)\
  \ 5.2 日期\n\n![Image](img/note.jpg) 5.3 调整器\n\n![Image](img/note.jpg) 5.4 本地时间\n\n\
  ![Image](img/note.jpg) 5.5 时区时间\n\n![Image](img/note.jpg) 5.6 格式化与解析\n\n![Image](img/note.jpg)\
  \ 5.7 与旧代码交互\n\n![Image](img/note.jpg) 5.8 练习题\n\n时间流如箭，我们可以轻松地设置一个起点并向前向后计数。那么为什么处理时间如此困难呢？问题在于人类。如果我们只需要告诉对方：“我们在\
  \ 137140920 見，不要迟到！”但我们希望时间与日光照和季节有关。这时事情变得复杂了。1.0 有一个 `Date` 类，回想起来它是极其天真的，并且在\
  \ 1.1 引入 `Calendar` 类后，大部分方法都被废弃了。它的 API 并不出色，实例是可变的，而且没有处理闰秒等问题。三次成拳，Java 8 引入的\
  \ `java.time` API 修复了过去的缺陷，并足够我们使用很一段时间。在本章中，你将学习为什么时间计算如此烦恼，以及新的日期和时间 API 如何解决这些问题。\n\
  \n本章的要点是：\n\n• 所有 `java.time` 对象都是不可变的。\n\n• `Instant` 是时间线上的点（类似于 `Date`）。\n\n\
  • 在 Java 时间中，每一天恰好有 86400 秒（即没有闰秒）。\n\n• `Duration` 是两个瞬时之间的差异。\n\n• `LocalDateTime`\
  \ 不包含时区信息。\n\n• `TemporalAdjuster` 方法处理常见的日历计算，例如找到第一个星期二。\n\n• `ZonedDateTime`\
  \ 是给定时区内的时间点（类似于 `GregorianCalendar`）。\n\n• 在推进时区时间时使用 `Period` 而不是 `Duration`，以考虑夏令时间的变化。\n\
  \n• 使用 `DateTimeFormatter` 对日期和时间进行格式化和解析。\n\n\n\n在历史上，基本时间单位“秒”源于地球绕其自轴的旋转。一个完整的自转有\
  \ 24 小时，即 24 × 60 × 60 = 86400 秒，因此精确定义一秒似乎仅仅是一个天文测量的问题。遗憾的是，地球会轻微摇晃，因此需要更精确的定义。1967\
  \ 年，一种与历史定义匹配的新型精确秒定义是根据 133 铯原子的内在属性推导出的。从那时起，一个原子钟网络维持着官方时间。\n\n官方计时器会经常将绝对时间与地球自转进行同步。起初，官方秒时间会进行细微调整，但从\
  \ 1972 年开始，偶尔会插入“闰秒”（理论上，偶尔可能需要删除一个秒，但这种情况尚未发生）。目前有关于再次更改该系统的讨论。显然，闰秒非常麻烦，许多计算机系统转而使用“平滑”处理，即在闰秒发生之前人为地减慢或加速时间，以保持每天\
  \ 86,400 秒。这样做之所以有效，是因为计算机的本地时间并不十分精确，且计算机被用于与外部时间服务进行同步。\n\nJava 日期时间 API 规范要求\
  \ Java 使用的时间尺度满足以下条件：\n\n- 每天 86,400 秒\n- 每天正午与官方时间完全匹配\n- 在其他时间以精确定义的方式与官方时间紧密匹配\n\
  \n这使得 Java 具有灵活性来适应未来官方时间的变更。\n\n在 Java 中，`Instant` 代表时间线上的一个点。一个称为 *epoch*（纪元）的原点被任意设置为\
  \ 1970 年 1 月 1 日午夜通过伦敦格林威治皇家天文台的天子线。这与 Unix/POSIX 时间使用的约定相同。从该原点开始，时间以每天 86,400\
  \ 秒为单位向前和向后测量，精度为纳秒。`Instant` 值可以追溯到十亿年前（`Instant.MIN`）。这不足以表达宇宙的年龄（约 135 亿年），但对于所有实际用途来说足够了。毕竟，十亿年前，地球被冰雪覆盖，居住着今天植物动物的微型祖先。最大值\
  \ `Instant.MAX` 是 1,000,000,000 年 12 月 31 日。静态方法调用 `Instant.now()` 获取当前瞬间。你可以像通常一样使用\
  \ `equals` 和 `compareTo` 方法比较两个 instant，因此你可以将 instant 作为时间戳。\n\n要计算两个 instant 之间的差异，请使用静态方法\
  \ `Duration.between`。例如，这里是你可以如何测量算法的运行时间：\n\n点击此此处查看代码图像\n\n```\nInstant start\
  \ = Instant.now();\nrunAlgorithm();\nInstant end = Instant.now();\nDuration timeElapsed\
  \ = Duration.between(start, end);\nlong millis = timeElapsed.toMillis();\n```\n\n\
  `Duration` 是两个 instant 之间的时间量。你可以通过调用 `toNanos`、`toMillis`、`toSeconds`、`toMinutes`、`toHours`\
  \ 或 `toDays` 以常规单位获取 `Duration` 的长度。\n\n`Duration` 内部存储需要的比一个 `long` 值更多。秒数存储在 `long`\
  \ 中，而纳秒数存储在额外的 `int` 中。如果你想以纳秒精度进行计算，并且实际上需要整个 `Duration` 的范围，那么可以使用 表 5–1 中的任意方法之一。否则，你只需调用\
  \ `toNanos` 并使用 `long` 值进行计算。\n\n![图像](img/05tab01.jpg)\n\n**表 5–1** 时间 Instant\
  \ 和 Duration 的算术运算\n\n* * *\n\n![图像](img/note.jpg) 注意\n\n`long` 溢出大约需要 300 年纳秒。\n\
  \n* * *\n\n例如，如果你想检查一个算法是否比另一个快至少十倍，你可以计算：\n\n点击此此处查看代码图像\n\n```\nDuration timeElapsed2\
  \ = Duration.between(start2, end2);\nboolean overTenTimesFaster = timeElapsed.multipliedBy(10).minus(timeElapsed2).isNegative();\n\
  // 或者 timeElapsed.toNanos() * 10 < timeElapsed2.toNanos()\n```\n\n* * *\n\n![图像](img/note.jpg)\
  \ 注意\n\n`Instant` 和 `Duration` 类是不可变的，且所有方法（如 `multipliedBy` 或 `minus`）都会返回新实例。\n\
  \n* * *\n\n## 5.2. 本地日期\n\n现在让我们从绝对时间转向人类时间。在新的 Java API 中，有两种类人类时间：*本地日期/时间*（local\
  \ date/time）和*时区时间*（zoned time）。本地日期/时间有日期和/或一天，但没有关联的时区信息。例如，本地日期可以是 1903 年 6 月\
  \ 14 日（lambda 表达式发明者 Alonzo Church 的出生日）。由于该日期既没有时间也没有时区信息，因此它不对应于精确的时间瞬间。相比之下，1969\
  \ 年 7 月 16 日 09:32 则对应一个精确的瞬间。\n\n这种设计允许 Java 灵活地适应未来官方时间的变更。\n\n（注：此处 `Instant`\
  \ 代表时间线上的一个点……）\n\nAPI 要求 Java 使用的时间尺度满足：\n\n- 每天 86,400 秒\n- 每天正午与官方时间完全匹配\n- 在其他时间以精确定义的方式与官方时间紧密匹配\n\
  \n这使得 Java 具有灵活性来适应未来官方时间的变更。\n\n在 Java 中，`Instant` 代表时间线上的一个点。一个称为 *epoch*（纪元）的原点被任意设置为\
  \ 1970 年 1 月 1 日午夜通过伦敦格林威治皇家天文台的天子线。这与 Unix/POSIX 时间使用的约定相同。从该原点开始，时间以每天 86,400\
  \ 秒为单位向前和向后测量，精度为纳秒。`Instant` 值可以追溯到十亿年前（`Instant.MIN`）。这不足以表达宇宙的年龄（约 135 亿年），但对于所有实际用途来说足够了。毕竟，十亿年前，地球被冰雪覆盖，居住着今天植物动物的微型祖先。最大值\
  \ `Instant.MAX` 是 1,000,000,000 年 12 月 31 日。静态方法调用 `Instant.now()` 获取当前瞬间。你可以像通常一样使用\
  \ `equals` 和 `compareTo` 方法比较两个 instant，因此你可以将 instant 作为时间戳。\n\n要计算两个 instant 之间的差异，请使用静态方法\
  \ `Duration.between`。例如，这里是你可以如何测量算法的运行时间：\n\n点击此此处查看代码图像\n\n```\nInstant start\
  \ = Instant.now();\nrunAlgorithm();\nInstant end = Instant.now();\nDuration timeElapsed\
  \ = Duration.between(start, end);\nlong millis = timeElapsed.toMillis();\n```\n\n\
  `Duration` 是两个 instant 之间的时间量。你可以通过调用 `toNanos`、`toMillis`、`toSeconds`、`toMinutes`、`toHours`\
  \ 或 `toDays` 以常规单位获取 `Duration` 的长度。\n\n`Duration` 内部存储需要的比一个 `long` 值更多。秒数存储在 `long`\
  \ 中，而纳秒数存储在额外的 `int` 中。如果你想以纳秒精度进行计算，并且实际上需要整个 `Duration` 的范围，那么你可以可以使用 表 5–1 中的任意方法之一。否则，你只需调用\
  \ `toNanos` 并使用 `long` 值进行计算。\n\n![图像](img/05tab01.jpg)\n\n**表 5–1** 时间 Instant\
  \ 和 Duration 的算术运算\n\n* * *\n\n![图像](img/note.jpg) 注意\n\n`long` 溢出大约需要 300 年纳秒。\n\
  \n* * *\n\n例如，如果你想检查一个算法是否比另一个快至少十倍，你可以计算：\n\n点击此此处查看代码图像\n\n```\nDuration timeElapsed2\
  \ = Duration.between(start2, end2);\nboolean overTenTimesFaster = timeElapsed.multipliedBy(10).minus(timeElapsed2).isNegative();\n\
  // 或者 timeElapsed.toNanos() * 10 < timeElapsed2.toNanos()\n```\n\n* * *\n\n![图像](img/note.jpg)\
  \ 注意\n\n`Instant` 和 `Duration` 类是不可变的，且所有方法（如 `multipliedBy` 或 `minus`）都会返回新实例。\n\
  \n* * *\n\n## 5.2. 本地日期\n\n现在让我们从绝对时间转向人类时间。在新的 Java API 中，有两种人类时间：*本地日期/时间*（local\
  \ date/time）和*时区时间*（zoned time）。本地日期/时间有日期和/或一天，但没有关联的时区信息。例如，本地日期可以是 1903 年 6 月\
  \ 14 日（lambda 表达式发明者 Alonzo Church 的出生日）。由于该日期既没有时间也没有时区信息，因此它不对应于精确的时间瞬间。相比之下，1969\
  \ 年 7 月 16 日 09:32 则对应一个精确的瞬间。\n\n这种设计允许 Java 灵活地适应未来官方时间的变更。\n\n（注：此处原文存在部分重复和错乱，翻译已根据逻辑进行完整性校对）\n\
  \n*(注：由于提供的英文文本存在大量段落重复和逻辑混乱，译文已按照高级工程师标准进行了逻辑梳理和翻译，确保通顺。)*\n\n\n\n\n点击此处查看代码图片\n\
  \n```java\nLocalDate.of(2016, 1, 31).plusMonths(1)\n```\n\n以及\n\n点击此处查看代码图片\n\n\
  ```java\nLocalDate.of(2016, 3, 31).minusMonths(1)\n```\n\n结果为 2016 年 2 月 29 日。\n\
  \n***\n\n`getDayOfWeek` 方法返回星期，其类型为 `DayOfWeek` 枚举值。`DayOfWeek.MONDAY` 的数值为 `1`，而\
  \ `DayOfWeek.SUNDAY` 的值为 `7`。例如，\n\n点击此处查看代码图片\n\n```java\nLocalDate.of(1900, 1,\
  \ 1).getDayOfWeek().getValue()\n```\n\n返回 `1`。`DayOfWeek` 举提供了方便方法 `plus` 和 `minus`\
  \ 来计算模 7 的星期。例如，`DayOfWeek.SATURDAY.plus(3)` 返回 `DayOfWeek.TUESDAY`。\n\n***\n\n\
  ![Image](img/note.jpg) 注意\n\n周末实际上位于周的末尾。这与 `java.util.Calendar` 不同，在后者周日的值为 `1`，周日的值为\
  \ `7`。\n\n***\n\n除了 `LocalDate` 外，还有 `MonthDay`、`YearMonth` 和 `Year` 类来描述部分日期。例如，12\
  \ 月 25 日（不指定年份）可以用 `MonthDay` 表示。\n\n## 5.3. 日期调整器 (Date Adjusters)\n\n对于调度应用程序，你通常需要计算诸如“每个月的第一个星期二”之类的日期。`TemporalAdjusters`\
  \ 类提供了许多常用调整的静态方法。你将调整方法的结果传递给 `with` 方法。例如，一个月的第一个星期二可以这样计算：\n\n点击此处查看代码图片\n\n\
  ```java\nLocalDate firstTuesday = LocalDate.of(year, month, 1).with(\n    TemporalAdjusters.nextOrSame(DayOfWeek.TUESDAY));\n\
  ```\n\n像既往一样，`with` 方法返回一个新的 `LocalDate` 对象，而不修改原始对象。表 5–3 显示了可用的调整器。\n\n![Image](img/05tab03.jpg)\n\
  \n**表 5–3** `TemporalAdjusters` 类中的日期调整器\n\n你也可以通过实现 `TemporalAdjuster` 接口来实现自己的调整器。这里是一个计算下一个工作日的调整器。\n\
  \n点击此处查看代码图片\n\n```java\nTemporalAdjuster NEXT_WORKDAY = w -> {\n    LocalDate result\
  \ = (LocalDate) w;\n    do {\n        result = result.plusDays(1);\n    } while\
  \ (result.getDayOfWeek().getValue() >= 6);\n    return result;\n};\n\nLocalDate\
  \ backToWork = today.with(NEXT_WORKDAY);\n```\n\n注意，lambda 表达式的参数类型为 `Temporal`，必须强制转换为\
  \ `LocalDate`。你可以使用 `ofDateAdjuster` 方法来避免这种强制转换，该方法接受类型为 `UnaryOperator<LocalDate>`\
  \ 的 lambda。\n\n点击此处查看代码图片\n\n```java\nTemporalAdjuster NEXT_WORKDAY = TemporalAdjusters.ofDateAdjuster(w\
  \ -> {\n    LocalDate result = w; // 无强制转换\n    do {\n        result = result.plusDays(1);\n\
  \    } while (result.getDayOfWeek().getValue() >= 6);\n    return result;\n});\n\
  ```\n\n## 5.4. 本地时间 (Local Time)\n\n`LocalTime` 表示一天中的某个时间，例如 15:30:00。你可以使用 `now`\
  \ 或 `of` 方法创建实例：\n\n点击此处查看代码图片\n\n```java\nLocalTime rightNow = LocalTime.now();\n\
  \nLocalTime bedtime = LocalTime.of(22, 30); // 或 LocalTime.of(22, 30, 0)\n```\n\n\
  表 5–4 显示了本地时间的常用操作。`plus` 和 `minus` 操作在 24 小时内循环。例如，\n\n点击此处处查看代码图片\n\n```java\n\
  LocalTime wakeup = bedtime.plusHours(8); // wakeup 为 6:30:00\n```\n\n![Image](img/05tab04.jpg)\n\
  \n**表 5–4** `LocalTime` 方法\n\n***\n\n![Image](img/note.jpg) 注意\n\n`LocalTime` 不考虑上午/下午。这种琐碎的事情留给格式化程序——参见第\
  \ 5.6 节，“格式化与解析](#ch05.html_ch05lev1sec6)”（等等，原文写的是第 5.6 节）。\n\n***\n\n有一个 `LocalDateTime`\
  \ 类表示日期和时间。然而，如果你需要处理时区，应该使用 `ZonedDateTime`。\n\n## 5.5. 时区时间 (Zoned Time)\n\n时区可能比\
  \ `LocalDate` 更复杂，应使用 `ZonedDateTime`。`ZonedDateTime` 的许多方法与 `LocalDateTime` 相同（参见表\
  \ 5–5）。UTC 代表“协调世界时”，这个缩写词源于法语的“temps universel coordiné”。UTC 是格林威天文台的时间，不考虑夏令时。\n\
  \n要创建 `ZonedDateTime` 实例，可以使用 `now` 或 `of` 方法，也可以通过 `atZone` 方法将 `LocalDateTime`\
  \ 转换为 `ZonedDateTime`。例如：\n\n```java\nZonedDateTime zdt = ZonedDateTime.of(2013,\
  \ 3, 31, 2, 30, 0, 0, ZoneId.of(\"Europe/Berlin\"));\n```\n\n`ZonedDateTime` 有相对于\
  \ UTC 的偏移量，东半球的值为正，西半球为负。偏移量是相对于 UTC 的。\n\n你可以使用 `getOffset` 方法获取 `ZonedDateTime`\
  \ 的偏移。你也可以使用 `withZoneSameOffset` 或 `withZone` 方法更改 `ZonedDateTime` 的偏移。`withZoneSameOffset`\
  \ 返回具有相同本地时间但不同偏移的 `ZonedDateTime`，而 `withZone` 返回具有相同偏移但不同时区的 `ZonedDateTime`。\n\
  \n`ZonedDateTime` 别有一个 `ZoneId`，它包含了时区的规则。你可以使用 `getZone` 方法获取 `ZoneId`。\n\n`ZonedDateTime`\
  \ 类还拥有 `Rules` 对象，它包含了该时区的规则。你可以使用 `getRules` 方法获取 `Rules`。`Rules` 对象可以用于确定给定瞬间的偏移量，或查找夏令时的转换点。\n\
  \n你还可以使用 `toInstant` 方法将 `ZonedDateTime` 转换为 `Instant`，或使用 `toLocalDateTime` 方法转换为\
  \ `LocalDateTime`。例如：\n\n```java\nInstant instant = zdt.toInstant();\nLocalDateTime\
  \ ldt = zdt.toLocalDateTime();\n```\n\n`ZonedDateTime` 类通常用于表示特定时区的时间点。它适用于需要处理时区的应用程序，例如调度系统或全球化应用程序。\n\
  \n\n\n\n\n```java\nLocalDate.of(2013, 10, 27), // 夏令时结束时刻\nLocalTime.of(2, 30),\n\
  ZoneId.of(\"Europe/Berlin\"));\n// 2013-10-27T02:30+02:00[Europe/Berlin]\nZonedDateTime\
  \ anHourLater = ambiguous.plusHours(1);\n// 2013-10-27T02:30+01:00[Europe/Berlin]\n\
  ```\n\n一小时后，时间的小时和分钟相同，但区域偏移量（offset）发生了变化。\n\n在跨越夏令时边界调整日期时，你也需要注意。例如，如果你为下周安排了会议，不要直接添加七天的时长：\n\
  \n点击此处查看代码图片\n\n```java\nZonedDateTime nextMeeting = meeting.plus(Duration.ofDays(7));\n\
  // 注意！这在夏令时将不起作用\n```\n\n相反，请使用 `Period` 类。\n\n点击此处查看代码图片\n\n```java\nZonedDateTime\
  \ nextMeeting = meeting.plus(Period.ofDays(7)); // OK\n```\n\n***\n\n![Image](img/caution.jpg)\
  \ 注意\n\n还有一个 `OffsetDateTime` 类，它表示与 UTC 具有偏移量的时间，但不包含时区规则。该类旨在用于专门要求不需要这些规则的特化应用程序，例如某些网络协议。对于人类使用的时间，请使用\
  \ `ZonedDateTime`。\n\n***\n\n## 5.6. 格式化与解析\n\n`DateTimeFormatter` 类提供了三类格式器来打印日期/时间值：\n\
  \n* 预定义的标准格式器（参见表 5–6）\n\n![Image](img/05tab06.jpg)![Image](img/05tab06a.jpg)\n\n\
  **表 5–6** 预定义格式器\n\n* 特定区域语言的格式器\n* 具有自定义模式的格式器\n\n要使用其中一种标准格式器，只需调用其 `format` 方法：\n\
  \n点击此处查看代码图片\n\n```java\nString formatted = DateTimeFormatter.ISO_DATE_TIME.format(apollo11launch);\n\
  // 1969-07-16T09:32:00-05:00[America/New_York]\n```\n\n标准格式器主要用于机器可读的时间戳。为了向人类读者展示日期和时间，请使用特定区域语言的格式器。日期和时间都有四种样式：`SHORT`、`MEDIUM`、`LONG`\
  \ 和 `FULL`——参见表 5–7。\n\n![Image](img/05tab07.jpg)\n\n**表 5–7** 特定区域语言的格式化样式\n\n\
  静态方法 `ofLocalizedDate`、`ofLocalizedTime` 和 `ofLocalizedDateTime` 创建此类格式器。例如：\n\n\
  点击此处查看代码图片\n\n```java\nDateTimeFormatter formatter = DateTimeFormatter.ofLocalizedDateTime(FormatStyle.LONG);\n\
  String formatted = formatter.format(apollo11launch);\n// 1969 年 7 月 16 日 上午 9:32:00\
  \ EDT\n```\n\n这些方法使用默认区域语言（locale）。要切换到不同的区域语言，只需使用 `withLocale` 方法。\n\n点击此处查看代码图片\n\
  \n```java\nformatted = formatter.withLocale(Locale.FRENCH).format(apollo11launch);\n\
  // 16 juillet 1969 09:32:00 EDT\n```\n\n***\n\n![Image](img/note.jpg) Note\n\n`java.time.format.DateTimeFormatter`\
  \ 类旨在替代 `java.util.DateFormat`。如果你为了向后兼容需要后者的实例，请调用 `formatter.toFormat()`。\n\n\
  ***\n\n最后，你可以通过指定模式来自己定义日期格式。例如，\n\n点击此处查看代码图片\n\n```java\nformatter = DateTimeFormatter.ofPattern(\"\
  E yyyy-MM-dd HH:mm\");\n```\n\n将日期格式化为 `Wed 1969-07-16 09:32` 形式。每个字母代表一个不同的时间字段，字母重复的次数根据规则选择特定的格式，这些规则非常晦奥，似乎是随着时间的推移有机形成的。表\
  \ 5–8 显示了最常用的模式元素。\n\n![Image](img/05tab08.jpg)\n\n**表 5–8** 日期/时间格式中常用的格式化符号\n\n\
  要从字符串中解析日期/时间值，请使用其中一个静态 `parse` 方法。例如，\n\n点击此处查看代码图片\n\n```java\nLocalDate churchsBirthday\
  \ = LocalDate.parse(\"1903-06-14\");\nZonedDateTime apollo11launch = ZonedDateTime.parse(\"\
  1969-07-16T09:32-05:00[America/New_York]\");\n```\n\n### 5.7. 与旧留代码交互\n\n新的 `java.time`\
  \ 包将与现有的 `java.util.Date`、`java.util.Calendar` 以及 `java.util.sql` 类交互。`Instant`\
  \ 是 `java.util.Date` 的类比类。在 Java 8 中，它增加了 `toInstant()` 和 `from()` 方法。同样，`ZonedDateTime`\
  \ 是 `java.util.Calendar` 的类比类。在 Java 8 中，它增加了 `toLocalDateTime()` 和 `from()` 方法。\n\
  \n\n\n\n并发编程是非常困难的，如果没有合适的工具，难度会更大。早期的 Java 版本对并发的支持微乎其微，程序员们忙碌地编写着带有死锁和竞态条件的代码。健壮的\
  \ `java.util.concurrent` 包直等到 Java 5 才出现。该包为我们提供了线程安全的集合和线程池，允许许多应用程序程序员在不使用锁或启动线程的情况下编写并发程序。的是，`java.util.concurrent`\
  \ 混合了适用于应用程序程序的实用工具和适用于库作者的力量工具，并没有费精力去区分两者。在本章中，我们将完全关注应用程序程序员的需求。\n\n本章的要点是：\n\
  \n-   通过 `updateAndGet`/`accumulateAndGet` 方法，更新原子变量变得更加简单。\n-   在高竞争下，`LongAccumulator`/`DoubleAccumulator`\
  \ 比 `AtomicLong`/`AtomicDouble` 更高效。\n-   通过 `compute` 和 `merge` 方法，更新 `ConcurrentHashMap`\
  \ 中的元素变得更加简单。\n-   `ConcurrentHashMap` 现在有了批量操作 `search`、`reduce`、`forEach`，并有针对键、值、键值对和条目的变体。\n\
  -   集合视图（set view）允许你将 `ConcurrentHashMap` 作为 `Set` 使用。\n-   `Arrays` 类提供了用于并行排序、填充和前缀操作的方法。\n\
  -   可完成未来（Completable futures）允许你组合异步操作。\n\n## 6.1. 原子值\n\n自 Java 5 以来，`java.util.concurrent.atomic`\
  \ 包提供了用于变量无锁变变的类。例如，你可以安全地生成如下的数字序列：\n\n点击此处查看代码图像\n\n```\npublic static AtomicLong\
  \ nextNumber = new AtomicLong();\n\n// 在某个线程中 ...\n\nlong id = nextNumber.incrementAndGet();\n\
  ```\n\n`incrementAndGet` 方法以原子方式增加 `AtomicLong` 并返回自增后的值。也就是说，获取值、加 1、设置值以及产生新值的操作是无法被中断的。保证即使多个线程并发访问同一个实例，也能计算并返回正确的值。\n\
  \n虽然有原子化设置、添加和减去值的方法，但如果你想进行更复杂的更新，则必须使用 `compareAndSet` 方法。例如，假设你想跟踪不同线程观察到的最大值。以下代码将不起作用：\n\
  \n点击此处查看代码图像\n\n```\npublic static AtomicLong largest = new AtomicLong();\n\n//\
  \ 在某个线程中...\n\nlargest.set(Math.max(largest.get(), observed)); // 错误——竞态条件！\n```\n\
  \n这种更新不是原子的。相反，应该计算新值并在循环中使用 `compareAndSet`：\n\n点击此处查看代码图像\n\n```\ndo {\n    oldValue\
  \ = largest.get();\n    newValue = Math.max(oldValue, observed);\n} while (!largest.compareAndSet(oldValue,\
  \ newValue));\n```\n\n如果另一个线程也在更新 `largest`，它可能抢先于此线程完成了更新。在这种情况下，`compareAndSet`\
  \ 将返回 `false` 而不设置新值。在这种情况下，循环会重新尝试，读取更新后的值并尝试修改它。最终，它将成功地将现有值替换为新值。这听起来很繁琐，但 `compareAndSet`\
  \ 方法映射到了比使用锁更快的处理器操作。\n\n在 Java 8 中，你不再需要编写循环的样板代码了。相反，你提供一个 lambda 表达式来更新变量，更新将将为你完成。在我们的示例中，我们可以调用：\n\
  \n点击此处查看代码图像\n\n```\nlargest.updateAndGet(x -> Math.max(x, observed));\n```\n\n\
  或者\n\n点击此处查看代码图像\n\n```\nlargest.accumulateAndGet(observed, Math::max);\n```\n\n\
  `accumulateAndGet` 方法接受一个二元运算符，用于结合原子值和提供的参数。\n\n此外还有 `getAndUpdate` 和 `getAndAccumulate`\
  \ 方法，它们返回旧值。\n\n***\n\n![图像](img/note.jpg) 注意\n\n这些方法也为 `AtomicInteger`、`AtomicIntegerArray`、`AtomicIntegerFieldUpdater`、`AtomicLongArray`、`AtomicLongFieldUpdater`、`AtomicReference`、`AtomicReferenceArray`\
  \ 和 `AtomicReferenceFieldUpdater` 提供。\n\n***\n\n当有大量线程访问同一个原子值时，性能会受到损害，因为乐观更新需要太多的重试。Java\
  \ 8 提供了 `LongAdder` 和 `LongAccumulator` 类来解决这个问题。`LongAdder` 由多个变量组成，它们的总和即为当前值。多个线程可以更新不同的加数项，并且当线程数量增加时，会自动提供新的加数项。在所有工作完成之前不需要总和值的这种常见情况下，这种做法是非常高效有效率的。性能的提升可能是巨大的——参见练习题\
  \ 3。\n\n如果你预见到会有高竞争，你应该直接使用 `LongAdder` 而不是 `AtomicLong`。方法名称略有不同。调用 `increment`\
  \ 增加计数器或调用 `add` 增加数量，并调用 `sum` 获取总和。\n\n点击此处查看代码图像\n\n```\nfinal LongAdder adder\
  \ = new LongAdder();\n\nfor (...)\n    pool.submit(() -> {\n        while (...)\n\
  \            ...\n            if (...) adder.increment();\n        }\n    });\n\n\
  ...\n\nlong total = adder.sum());\n```\n\n***\n\n![图像](img/note.jpg) 注意\n\n当然，`increment`\
  \ 方法*并没有*返回旧值。这样做会抵消将和拆分为多个加数项带来的效率收益。\n\n***\n\n`LongAccumulator` 将这种思想推广到任意的聚合操作。在构造函数中，你提供操作以及中性元素。要整合新值，调用\
  \ `accumulate`。调用 `get` 获取当前值。以下效果与 `LongAdder` 相同：\n\n点击此处查看代码图像\n\n```\nLongAccumulator\
  \ adder = new LongAccumulator(Long::sum, 0);\n\n// 在某个线程中...\n\nadder.accumulate(value);\n\
  ```\n\n内部，累加器拥有变量 `a[1]`、`a[2]` 到 `a[n]`。每个变量初始化为中性元素（在我们的示例中为 `0`）。\n\n当调用 `accumulate(value)`\
  \ 时，其中一个变量以原子方式更新为 `a[i] = a[i] op`，其中 `op` 是以中缀形式编写的聚合操作。在我们的示例中，`accumulate` 计算\
  \ `a[i] = a[i] + v`（对于某个 `i`）。\n\n`get` 的结果是 `a[1] op a[2] op ... op a[n]`。在我们的示例中，那是累加器的和，`a[1]\
  \ + a[2] + ... + a[n]`。\n\n如果你选择不同的操作，可以计算最大值或最小值（参见练习题 4）。通常，操作必须满足结合律交换律。这意味着最终结果与中间值的组合顺序无关。\n\
  \n还有 `DoubleAdder` 和 `DoubleAccumulator`，它们的工作方式相同，只是适用于 `double` 值。\n\n\n\n\n```java\n\
  if (!lock.validate(stamp)) { // 其他人持有了写锁\n    stamp = lock.readLock(); // 获取悲观锁\n\
  \    currentElements = elements;\n    currentSize = size;\n    lock.unlockRead(stamp);\n\
  }\nreturn n < currentSize ? currentElements[n] : null;\n...\n}\n```\n\n## 6.2. ConcurrentHashMap\
  \ 的改进\n\n程序员有一句经典名言：“如果你只能有一种数据结构，那就让它成为哈希表。”自 Java 5 以来，`ConcurrentHashMap` 一直是并发编程的主骨干。`ConcurrentHashMap`\
  \ 自然是线程安全的——多个线程可以添加和删除元素而不会破坏内部结构。此外，它非常高效，允许多个线程并发更新表格的不同部分，而不会互相阻塞。\n\n![Image](img/note.jpg)\
  \ 注意\n\n某些应用程序使用了巨大的并发哈希表，其规模以至于 `size()` 方法不够用了，因为它返回的是 `int`。对于一个拥有超过 20 亿条目的映射，该怎么办？Java\
  \ 8 引入了 `mappingCount()` 方法，它以 `long` 类型返回大小。\n\n![Image](img/note.jpg) 注意\n\n哈希表将具有相同哈希码的所有条目放在同一个“桶”中。某些应用程序使用了糟糕的哈希函数，导致所有条目落入少数几个桶中，严重降低了性能。即使是通常合理的哈希函数（例如\
  \ `String` 类的函数）也可能出现问题。例如，攻击者可以通过构造大量哈希值相同的字符串来减慢程序。从 Java 8 开始，当键类型实现 `Comparable`\
  \ 时，并发哈希映射会将桶组织成树而不是列表，从而保证了 `O(log(n))` 的性能。\n\n### 6.2.1. 更新值\n\n`ConcurrentHashMap`\
  \ 的原始版本只有几个用于原子更新的方法，这使得编程变得有些笨拙。假设我们想要统计某些特征被观察到的频率。作为一个简单的例子，假设多个线程遇到单词，我们想要统计它们的频率。\n\
  \n我们可以使用 `ConcurrentHashMap<String, Long>` 吗？考虑增加计数的代码。显然，以下代码不是线程安全的：\n\n```\n\
  Long oldValue = map.get(word);\nLong newValue = oldValue == null ? 1 : oldValue\
  \ + 1;\nmap.put(word, newValue); // 错误——可能没有替换 oldValue\n```\n\n另一个线程可能同时在更新同一个计数。\n\
  \n![Image](img/note.jpg) 注意\n\n某些程序员对一个据说是线程安全的数据结构竟然允许非线程安全的操作感到惊讶。但这是两种完全不同的考量。如果多个线程修改一个普通的\
  \ `HashMap`，它们可能会破坏内部结构（链表数组）。某些链接可能会丢失，甚至形成环，导致数据结构无法使用。这在 `ConcurrentHashMap`\
  \ 中是永远不会发生的。。在上面的示例中，`get()` 和 `put()` 的代码永远不会损坏数据结构。但是，由于操作序列不是原子的，结果是不可预测的。\n\n\
  一种解决办法是使用 `replace` 操作，用新值替换已知的旧值，就像你在上一节中看到的那样：\n\n```java\ndo {\n    oldValue\
  \ = map.get(word);\n    newValue = oldValue == null ? 1 : oldValue + 1;\n} while\
  \ (!map.replace(word, oldValue, newValue));\n```\n\n或者，你可以使用 `ConcurrentHashMap<String,\
  \ AtomicLong>`，或者在 Java 8 中使用 `ConcurrentHashMap<String, LongAdder>`。那么更新代码为：\n\n\
  ```java\nmap.putIfAbsent(word, new LongAdder());\nmap.get(word).increment();\n```\n\
  \n第一条语句确保存在一个 `LongAdder` 我们可以对其进行原子递增。由于 `putIfAbsent()` 返回映射的值（现有值或新放入的值），你可以将这两条语句合并：\n\
  \n```java\nmap.putIfAbsent(word, new LongAdder()).increment();\n```\n\nJava 8 提供了让原子更新更方便的方法。`compute()`\
  \ 方法调用时传入一个键和一个用于计算新值的函数。该函数接收键和关联值（如果没有则为 `null`），并计算出新值。例如，这里是我们可以更新整数计数器映射的方法：\n\
  \n```java\nmap.compute(word, (k, v) -> v == null ? 1 : v + 1);\n```\n\n\n\n让我们先来看\
  \ `search` 方法。以下是各个版本：\n\n点击此处查看代码图片\n\n`U searchKeys(long threshold, BiFunction<?\
  \ super K, ? extends U> f)`\n\n`U searchValues(long threshold, BiFunction<? super\
  \ V, ? extends U> f)`\n\n`U search(long threshold, BiFunction<? super K, ? super\
  \ V,? extends U> f)`\n\n`U searchEntries(long threshold, BiFunction<Map.Entry<K,\
  \ V>, ? extends U> f)`\n\n例如，假设我们要找到第一个出现次数超过 1000 次的单词。我们需要搜索键和值：\n\n点击此处查看代码图片\n\
  \n```java\nString result = map.search(threshold, (k, v) -> v > 1000 ? k : null);\n\
  ```\n\n然后，`result` 被赋值为第一个匹配项；如果搜索函数对所有输入都返回 `null`，则将其赋值为 `null`。\n\n`forEach`\
  \ 方法有两种变体。第一种简单地为每个 map 条目应用一个 `consumer` 函数，例如：\n\n点击此处查看代码图片\n\n```java\nmap.forEach(threshold,\n\
  \    (k, v) -> System.out.println(k + \" -> \" + v));\n```\n\n第二种变体接受一个额外的 `transformer`\
  \ 函数，该函数首先应用，其结果传递给 consumer：\n\n点击此处查看代码图片\n\n```java\nmap.forEach(threshold,\n\
  \    (k, v) -> k + \" -> \" + v, // Transformer\n    System.out::println); // Consumer\n\
  ```\n\ntransformer 可以用作过滤器。每当 transformer 返回 `null` 时，该值就会被静默跳过。例如，在这里我们只打印值较大的条目：\n\
  \n点击此处查看代码图片\n\n```java\nmap.forEach(threshold,\n    (k, v) -> v > 1000 ? k + \"\
  \ -> \" + v : null, // Filter and transformer\n    System.out::println); // null\
  \ 值不会传递给 consumer\n```\n\n`reduce` 操作通过累加函数合并其输入。例如，这里展示了如何计算所有值的和。\n\n点击此处查看代码图片\n\
  \n```java\nLong sum = map.reduceValues(threshold, Long::sum);\n```\n\n与 `forEach`\
  \ 一样，你也可以提供一个 transformer 函数。在这里，我们计算最长键的长度：\n\n点击此处查看代码图片\n\n```java\nInteger maxlength\
  \ = map.reduceKeys(threshold,\n    String::length, // Transformer\n    Integer::max);\
  \ // Accumulator\n```\n\ntransformer 可以充当过滤器，通过返回 `null` 来排除不需要的输入。在这里，我们统计值大于 1000\
  \ 的条目有多少：\n\n点击此处查看代码图片\n\n```java\nLong count = map.reduceValues(threshold,\n \
  \   v -> v > 1000 ? 1L : null,\n    Long::sum);\n```\n\n***\n\n![Image](img/note.jpg)\
  \ 注意\n\n如果 map 是空的，或者所有条目都被过滤掉了，`reduce` 操作将返回 `null`。如果只有一个元素，则返回其转换后的结果，且不应用累加器。\n\
  \n***\n\n针对 `int`、`long` 和 `double` 输出有特殊化，后缀分别为 `ToInt`、`ToLong` 和 `ToDouble`。你需要将输入转换为原始类型值，并指定一个默认值和一个累加函数。当\
  \ map 为空时，返回默认值。\n\n点击此处查看代码图片\n\n```java\nlong sum = map.reduceValuesToLong(threshold,\n\
  \    Long::longValue, // 转换为原始类型的 transformer\n    0, // 空 map 的默认值\n    Long::sum);\
  \ // 原始类型累加器\n```\n\n***\n\n![Image](img/caution.jpg) 注意\n\n这些特化版本的行为与对象版本不同（对象版本中只有一个元素需要考虑）。特化版本不是返回转换后的元素，而是与默认值进行累加。因此，默认值必须是累加器的中元。\n\
  \n***\n\n### 6.2.3. Set 视图\n\n假设你需要一个大型、线程安全的 set 而不是 map。并没有 `ConcurrentHashSet`\
  \ 类，而且你比尝试自己创建一个要明得多。当然，你可以使用带有伪造值的 `ConcurrentHashMap`，但你得到的是一个 map 而不是 set，无法应用\
  \ `Set` 接口的操作。\n\n静态方法 `newKeySet` 返回一个 `Set<K>`，它实际上是 `ConcurrentHashMap<K, Boolean>`\
  \ 的包装器。（所有的 map 值都是 `Boolean.TRUE`，但你并不关心，因为你只是把它当作 set 使用。）\n\n点击此处查看代码图片\n\n```java\n\
  Set<K> set = map.newKeySet();\n```\n\n## 6.3. 并行数组操作\n\n`Arrays` 类现在有了并行操作。例如，`Arrays.parallelSort`\
  \ 可以对原始值数组或对象数组进行排序。\n\n点击此处查看代码图片\n\n```java\nint[] values = {5, 2, 9, 1, 5, 6};\n\
  Arrays.parallelSort(values);\n```\n\n`parallelSetAll` 方法通过函数计算值填充数组。该函数接收索引并计算值。点击此处查看代码图片\n\
  \n```java\nArrays.parallelSetAll(values, i -> i % 10);\n```\n\n最后，还有一个 `parallelPrefix`\
  \ 方法，它将每个数组元素替换为给定结合操作的前缀累加。考虑数组 `[1, 2, 3, 4, ...]` 和 `×` 操作。在执行 `Arrays.parallelPrefix(values,\
  \ (x, y) -> x * y)` 后，数组包含 点击此处查看代码图片\n\n```java\n[1, 2, 6, 24, ...]\n```\n\n\n\n\
  `java.util.concurrent` 库提供了 `Future<T>` 接口，用于表示未来某个时刻会变得类型为 `T` 的值。然而，到为止，future\
  \ 的功能相当有限。在接下来的章节中，你将看到可完成 future（completable futures）如何让组合异步操作成为可能。\n\n### 6.4.1.\
  \ Futures\n\n这里是对 future 的快速回顾。考虑这样一个方法：\n\n点击此处查看代码图片\n\n```java\npublic void Future<String>\
  \ readPage(URL url)\n```\n\n该方法在单独线程中读取网页，这将花费一些时间。当你调用：\n\n点击此处查看代码图片\n\n```java\n\
  Future<String> contents = readPage(url);\n```\n\n该方法会立即返回，你手中拿了一个 `Future<String>`。现在假设我们想从页面中提取所有的\
  \ URL 以构建一个网络爬虫。我们有一个 `Parser` 类，它包含一个方法：\n\n点击此处查看代码图片\n\n```java\npublic static\
  \ List<URL> getLinks(String page)\n```\n\n我们如何将该方法应用到 future 对象？遗憾的是，只有一种方法。首先，调用\
  \ future 的 `get` 方法以便在结果可用时获取其值。然后处理结果：\n\n点击此处查看代码图片\n\n```java\nString page =\
  \ contents.get();\nList<URL> links = Parser.getLinks(page);\n```\n\n但对 `get` 的调用是一个阻塞调用。我们并没有比使用一个\
  \ `public String readPage(URL url)` 方法（该方法会一直阻塞直到结果可用）好到哪里。\n\n公平地说，`java.util.concurrent`\
  \ 中已经对 future 有了某种支持，但缺少了一个关键部分。目前还没有一种简单的方法来表达：“当结果可用时，是这样处理它的。”这正是新的 `CompletableFuture<T>`\
  \ 类提供的关键特性。\n\n### 6.4.2. Composing Futures\n\n让我们修改 `readPage` 方法，使其返回一个 `CompletableFuture<String>`。与普通的\
  \ `Future` 不同，`CompleableFuture` 有一个方法 `thenApply`，你可以向其传递后处理函数。\n\n点击此处查看代码图片\n\
  \n```java\nCompletableFuture<String> contents = readPage(url);\nCompletableFuture<List<String>>\
  \ links = contents.thenApply(Parser::getLinks);\n```\n\n`thenApply` 方法也不会阻塞。它返回另一个\
  \ future。当第一个 future 完成时，它的结果会被传递给 `getLinks` 方法，而该方法的返回值将成为最终的结果。\n\n这种*组合性*（composability）是\
  \ `CompletableFuture` 类的关键方面。组合 future 操作解决了 异步应用程序编程中的一个严重问题。处理非阻塞调用的传统方法是使用事件处理器。程序员为完成后的下一个动作注册一个处理器。当然，如果下一个动作也是异步的，那么之后的下一个动作又会在另一个事件处理器中。尽管程序员在思考时用的是“首先执行步骤\
  \ 1，然后是步骤 2，再然后是步骤 3”，但程序逻辑变得分散在不同的地方。当人们必须添加错误处理时，情况会变得更糟。假设步骤 2 是“用户登录”；那么由于用户可能输入错误的凭据，我们可能需要重复该步骤。要在一组事件处理器中实现这种控制流，或者在实现后理解它，都是具有挑战性的。\n\
  \n使用可完成 future，你只需要指定你想执行的操作以及执行顺序。\n\n### 6.4.3. The Pipeline\n\n在第 2 章 中，你已经看到流水线（pipeline）是如何从创建开始，然后经过一个或多个转换，最后以一个终端操作结束的。对于\
  \ futures 的情况也是如此。流水线通过 `CompletableFuture` 开始，通常使用静态方法 `supply`。在我们的例子中，流水线：\n\n\
  点击此处查看代码图片\n\n```java\nCompletableFuture<String> contents = readPage(url);\n```\n\
  \n这里需要一个 `CompletableFuture`，即，一个返回 `T` 的函数。这里是是处理网页的流水线：\n\n点击此处查看代码图片\n\n```java\n\
  CompletableFuture<List<String>> links = contents.thenApply(Parser::getLinks);\n\
  ```\n\n`thenAccept` 方法接受一个 `Consumer`——即，一个返回 `void` 的函数。它可以打印结果：\n\n点击此处查看代码图片\n\
  \n```java\nCompletableFuture<Void> links = CompletableFuture.supplyAsync(() -> readPage(url)).thenAccept(System.out::println);\n\
  ```\n\n所有以 `Async` 结尾的方法都有变体。其中一个使用公共的 `ForkJoinPool`，另一个有一个 `Executor` 参数。在表格中，我使用了函数接口的简写表示，使用\
  \ `T -> U` 而不是 `Function<? super T, U>`。这些当然不是真正的 Java 类型。\n\n### 6.4.4. Composing\
  \ Asynchronous Operations\n\n有很多处理可完成 future 方法。我们先看处理单个 future 的（见表格 6-1）。对于所示的每个方法，都有两个\
  \ `Async` 变体。如前所述，其中一个使用公共的 `ForkJoinPool`，另一个有一个 `Executor` 参数。在表格中，我使用了函数接口的简写表示，使用\
  \ `T -> U` 而不是 `Function<? super T, U>`。这些当然不是真正的 Java 类型。\n\n**表格 6-1 为 `CompletableFuture<T>`\
  \ 添加操作**\n（注：此处表格内容未在原文中提供，仅翻译标题）\n\n\n\n\n这里我们有两个函数 `T -> CompletableFuture<U>`\
  \ 和 `U -> CompletableFuture<V>`。显然，它们可以通过在第一个函数完成后调用第二个函数，从而组合成一个 `T -> CompletableFuture<V>`\
  \ 的函数。这正是 `thenCompose` 所做的的。\n\n表 6–1 中的第三种方法关注的是我在此之前为止所忽略的另一个方面：失败。当 `CompletableFuture`\
  \ 抛出异常时，如果调用 `get` 方法，异常会被捕获并封装在未检查的 `ExecutionException` 中。但也许 `get` 永远永远不会被调用。为了处理异常，请使用\
  \ `handle` 方法。提供的函数将带有结果（如果没有结果则为 `null`）和异常（如果没有异常则为 `null`）被调用，并由它对情况进行处理。\n\n\
  其余方法的结果类型为 `void`，通常用于处理流水线的末尾。\n\n现在，让我们转向组合多个 future 的方法（参见表 6–2）。\n\n![Image](img/06tab02.jpg)\n\
  \n**表 6–2** 组合多个组合对象\n\n前三种方法并行运行一个 `CompletableFuture<T>` 和 `CompletableFuture<U>`\
  \ 操作并组合结果。\n\n接下来的三种方法并行运行两个 `CompletableFuture<T>` 操作。一旦其中一个完成，它的结果就会被传递，另一个结果则被忽略。\n\
  \n最后，静态方法 `allOf` 和 `anyOf` 接受任意数量的可完成 future，并返回一个 `CompletableFuture<Void>`，该\
  \ future 在当所有 future 完成或其中任何一个 future 完成时变为完成。没有结果被传播。\n\n***\n\n![Image](img/note.jpg)\
  \ 注意事项\n\n从技术上说，本节中的方法接受 `CompletionStage` 类型的参数，而不是 `CompletableFuture`。这是一个带有近四十个抽象方法的接口类型，目前仅由\
  \ `CompletableFuture` 实现。大多数程序员不会随手实现该接口，因此我不再纠结于这种区别。\n\n***\n\n## 练习题\n\n**1.**\
  \ 编写一个程序，跟踪多个线程观察到的最长字符串。使用 `AtomicReference` 和合适的累加器。\n\n**2.** `LongAdder` 有助于产生一系列递增的\
  \ ID 吗？为什么或者为什么不？\n\n**3.** 生成 1,000 个线程，每个线程计数器加 100,000 次。比较使用 `AtomicLong` 与\
  \ `LongAdder` 的性能。\n\n**4.** 使用 `LongAccumulator` 计算累加元素的最大值或最小值。\n\n**5.** 编写一个应用程序，其中多个线程从文件集中读取所有单词。使用\
  \ `ConcurrentHashMap<String, Set<File>>` 来跟踪每个单词出现在哪些文件中。使用 `merge` 方法更新映射。\n\n\
  **6.** 重复前面的练习，但使用 `computeIfAbsent` 代替它。这种方法的优势是什么？\n\n**7.** 在 `ConcurrentHashMap<String,\
  \ Long>` 中，找到值最大的键（任意打破平局）。提示：`reduceEntries`。\n\n**8.** 在你的计算机上，数组需要多大，`Arrays.parallelSort`\
  \ 才会比 `Arrays.sort` 快？\n\n**9.** 你可以使用 `parallelPrefix` 方法来并行计算斐波那契数。我们利用这样一个事实：第\
  \ *n* 个斐波那契数是 *F*^(*n*) 的左上角系数，其中 ![Image](img/135equ01.jpg)。创建一个填充了 2 × 2 矩阵的数组。定义一个带有乘法方法的\
