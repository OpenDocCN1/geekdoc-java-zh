  \n在上一节中，你看到了 Nashorn 脚本的一个用例：在 `jjs` REPL 中实验 Java API。另一个用例是允许你的程序用户运行脚本。在桌面世界中，这非常常见。例如，所有的\
  \ Microsoft Office 都可以使用一种名为 VB Script 的语言进行脚本，它是 Basic 语言的后代。有许多人编写此类脚本，这种能力导致了某种形式的供应商锁定。很难采用另一个不能运行这些脚本的办公套件。如果你想锁定你的\
  \ Java 桌面或服务器应用的用户，你可以提供相同的能力。\n\n从 Java 运行 Nashorn 脚本使用了 Java 6 中引入的脚本引擎机制。你可以使用该机制在任何带有脚本引擎的\
  \ JVM 语言中执行脚本，例如 Groovy、JRuby 或 Jython。还有运行在 JVM 之外的语言的脚本引擎，例如 PHP 或 Scheme。\n\n\
  要运行脚本，你需要获取一个 `ScriptEngine` 对象。如果引擎已注册，你可以直接通过名称获取它。Java 8 包含一个名为 `\"nashorn\"\
  ` 的引擎。以下是其使用方法：\n\n点击此处查看代码图片\n\n```java\nScriptEngineManager manager = new ScriptEngineManager();\n\
  ScriptEngine engine = manager.getEngineByName(\"nashorn\");\nObject result = engine.eval(\"\
  'Hello, World!'.length\");\nSystem.out.println(result);\n```\n\n你也可以从 `Reader` 读取脚本：\n\
  \n点击此处查看代码图片\n\n```java\nObject result = engine.eval(Files.newBufferedReader(path));\n\
  ```\n\n要让 Java 对象对脚本可用，使用 `ScriptEngine` 接口的 `put` 方法。例如，你可以让 JavaFX stage 可见，以便你可以使用\
  \ JavaScript 代码填充它：\n\n点击此处查看代码图片\n\n```java\npublic void start(Stage stage) {\n\
  \    engine.put(\"stage\", stage);\n    engine.eval(script); // 脚本代码可以访问该对象\n}\n\
  ```\n\n## 7.3. 调用方法\n\n在上一节中，你看到了 `jjs` 是如何工作的。当你按下 `Tab` 键时，你会得到当前表达式可能的补全列表。诚承认，对于\
