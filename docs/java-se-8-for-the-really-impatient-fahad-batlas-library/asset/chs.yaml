  \ 循环：\n\n```javascript\nfor (var key in scores) { ... }\nfor (var value in scores)\
  \ { ... }\n```\n\n如果你想同时处理键和值，只需遍历条集：\n\n```javascript\nfor (var e in scores.entrySet())\
  \ {\n    // 处理 e.key 和 e.value\n}\n```\n\n## 7.9. Lambda 表达式\n\nJavaScript 有匿名函数，例如\n\
