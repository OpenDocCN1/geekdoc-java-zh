  \ `rlwrap` 并运行 `rlwrap jjs`。或者，你可以在 Emacs 内部运行 `jjs`。别担心——这没有害。启动 Emacs 并按下 M-x（即\
  \ Alt+x 或 Esc x），`shell` 回车，然后输入 `jjs`。照常输入表达式。使用 `M-p` 和 `M-n` 回溯上一行或下一行，并使用左右箭头键在行内移动。编辑命令，然后按回车执行它。\n\
  \n## 7.4. 构建对象\n\n当你想要在 JavaScript 中构建对象时（而不是由脚本引擎交给你），你需要知道如何访问 Java 包。有两种机制。\n\
  \n有全局对象 `java`、`javax`、`javafx`、`com`、`org` 和 `edu`，通过点符号产生包和类对象。例如：\n\n```javascript\n\
  var javaPackage = java.net // 一个 JavaPackage 对象\nvar URL = java.net.URL // 一个 JavaClass\
  \ 对象\n```\n\n如果你需要访问一个不以上述标识符开头的包，你可以在 `Package` 对象中找到它，例如 `Package.ch.cern`。\n\n\
  或者，调用 `Java.type` 函数：\n\n```javascript\nvar URL = Java.type('java.net.URL')\n```\n\
  \n这比 `java.net.URL` 快一点点，并且你可以获得更好的错误检查。（如果你犯拼写错误，如 `java.net.Url`，Nashorn 会认为它是一个包。）但如果你想要速度和良好的错误处理，你可能不应该使用脚本语言。\n\
  \n\n\n\n![Image](img/note.jpg) 笔记\n\nNashorn 文档建议将类对象定义在脚本文件的顶部，就像你在 Java 文件中将 `import`\
  \ 语句放在顶部一样：\n\n点击此处查看代码图片\n\n```javascript\nvar URL = Java.type('java.net.URL')\n\
  var JMath = Java.type('java.lang.Math')\n// 避免与 JavaScript Math 对象产生冲突\n```\n\n\
  * * *\n\n一旦你有了类对象，就可以调用静态方法：\n\n```javascript\nJMath.floorMod(-3, 10)\n```\n\n要构造一个对象，将类对象传递给\
  \ JavaScript 的 `new` 运算符。按照通常的方式传递任何构造函数参数：\n\n点击此处查看代码图片\n\n```javascript\nvar\
  \ URL = java.net.URL\nvar url = new URL('http://horstmann.com')\n```\n\n如果你不在乎效率，也可以调用\n\
  \n点击此处查看代码图片\n\n```javascript\nvar url = new java.net.URL('http://horstmann.com')\n\
  ```\n\n* * *\n\n![Image](img/caution.jpg) 注意\n\n如果你在配合 `new` 使用 `Java.type`，你需要额外一组括号：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar url = new (Java.type('java.net.URL'))('http://horstmann.com')\n\
  ```\n\n* * *\n\n如果你需要指定一个内部类，可以使用点符号法：\n\n点击此处查看代码图片\n\n```javascript\nvar entry\
  \ = new java.util.AbstractMap.SimpleEntry('hello', 42)\n```\n\n或者，如果你使用 `Java.type`，请使用\
  \ `$`，就像 JVM 执行的那样：\n\n点击此处查看代码图片\n\n```javascript\nvar Entry = Java.type('java.util.AbstractMap$SimpleEntry')\n\
  ```\n\n## 7.5. 字符串\n\nNashorn 中的字符串当然是 JavaScript 对象。例如，考虑以下调用\n\n点击此处查看代码图片\n\n\
  ```javascript\n'Hello'.slice(-2) // 产生 'lo'\n```\n\n在这里，我们调用了 JavaScript 方法 `slice`。Java\
  \ 中没有这种方法。\n\n但以下调用\n\n```javascript\n'Hello'.compareTo('World')\n```\n\n同样有效，尽管在\
  \ JavaScript 中没有 `compareTo` 方法。（你只需要使用 `<` 运算符即可。）\n\n在这种情况下，JavaScript 字符串被转换为\
  \ Java 字符串。通常情况下，每当 JavaScript 字符串被传递给 Java 方法时，它就会转换为 Java 字符串。\n\n还要注意，当*任何* JavaScript\
  \ 对象被传递给带有 `String` 参数的 Java 方法时，它都会转换为字符串。考虑\n\n点击此处查看代码图片\n\n```javascript\nvar\
  \ path = java.nio.file.Paths.get(/home/)\n// 一个 JavaScript RegExp 被转换成了 Java String!\n\
  ```\n\n在这里，`/home/` 是一个正则表达式。`Paths.get` 方法需要一个 `String`，它确实得到了一个，尽管在在这种情况下这没有意义。不应该埋怪\
  \ Nashorn。它遵循了通用的 JavaScript 行为，即在期望字符串时将任何内容转换为字符串。数字和布尔值也会发生同样的转换。例如，`'Hello'.slice('-2')`\
  \ 是完全有效的。字符串 `'-2'` 被静默转换为数字 `-2`。正是像这样的特性让在动态类型语言中编程变成了一场令人兴奋的冒险。\n\n## 7.6. 数字\n\
  \nJavaScript 不对整数有显式支持。它的 `Number` 类型与 Java 的 `double` 类型相同。当数字被传递给期望 `int` 或 `long`\
  \ 的 Java 代码时，任何小数部分都会被静默移除。例如，'Hello'.slice(-2.99)` 等同于 `'Hello'.slice(-2)`。\n\n\
  为了效率，Nashorn 会尽可能将计算保持为整数，但这种差异通常是透明的。这里有一种它不透明的情况：\n\n点击此处查看代码图片\n\n```javascript\n\
  var price = 10\njava.lang.String.format('Price: %.2f', price)\n// Error: f format\
  \ not valid for java.lang.Integer\n```\n\n`price` 的值恰好是一个整数，并且被赋值给 `Object`，因为 `format`\
  \ 方法有一个 `Object...` 变长参数。因此，Nashorn 产生了一个 `java.lang.Integer`。这导致 `format` 方法失败，因为\
  \ `f` 格式是用于浮点数的。在这种情况下，你可以通过调用 `Number` 函数来强制转换为 `java.lang.Double`：\n\n点击此处查看代码图片\n\
  \n```javascript\njava.lang.String.format('Unit price: %.2f', Number(price))\n```\n\
