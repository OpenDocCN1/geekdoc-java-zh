  \ .', 'grep -v class', 'sort')`。只需反复调用 `$EXEC` 即可。\n\n**7.** 上一个练习的解决方案并没有 Unix\
  \ 管道好，因为第二个命令只有在第一个命令完成后才会启动。使用 `ProcessBuilder` 类解决这个问题。\n\n**8.** 编写一个打印所有环境变量值的脚本。\n\
