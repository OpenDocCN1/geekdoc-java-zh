  \ 1。年龄可以在命令行或 `AGE` 环境变量中指定。如果两者都不存在，则提示用户。\n\n**10.** 用 JavaScript 编写一个 JavaFX\
  \ 程序，从你选择的源读取数据并渲染饼图。这比在 Java 中开发程序是更容易还是更难？为什么？\n\n# 第 8 章 杂项技巧\n\n## 本章主题\n\n\
  ![Image](img/squf.jpg) 8.1 字符串\n\n![Image](img/squf.jpg) 8.2 数字类\n\n![Image](img/squf.jpg)\
  \ 8.3 新数学函数\n\n![Image](img/squf.jpg) 8.4 集合\n\n![Image](img/squf.jpg) 8.5 处理文件\n\
  \n![Image](img/squf.jpg) 8.6 注解\n\n![Image](img/squf.jpg) 8.7 杂项微调\n\n![Image](img/squf.jpg)\
  \ 练习\n\nJava 8 是一个包含重要语言和库增强的大版本。但整个库中也有许多有用的微调。我查阅了所有的 `@since 1.8` 注释，并将更改分类以便方便参考。在本章中，你将找到字符串、数字、数学、集合、文件、注解、正则表达式和\
  \ JDBC 的新内容。\n\n\n\n为了处理无符号数，你需要对二进制算术和负数的二进制表示有的的。在 `C` 和 `C++` 中，混合有符号和无符号类型是导致微妙错误的常见原因。Java\
  \ 明智地避开了这一领域，并且多年来一直仅使用有符号数字。使用无符号数的主要原因是你需要处理需要这些类型的文件格式或网络协议。\n\n`Float` 和 `Double`\
  \ 类具有静态方法 `isFinite`。如果 `x` 不是无穷大、负无穷或 `NaN`（非数字），则 `Double.isFinite(x)` 返回 `true`。在过去，你必须调用实例方法\
  \ `isInfinite` 和 `isNaN` 来获得相同的结果。\n\n最后，`BigInteger` 类拥有实例方法 (`long`|`int`|`short`|`byte`)ValueExact`，它们将值作为\
  \ `long`、`int`、`short` 或 `byte` 返回，如果值不在目标范围内，则抛出 `ArithmeticException`。\n\n## 8.3.\
  \ 新数学函数\n\n`Math` 类提供了若干用于“精确”算术的方法，这些方法在结果溢出时会抛出异常。例如，`100000 * 100000` 会静默地给出错误结果\
  \ `1410065408`，而 `multiplyExact(100000, 100000)` 则抛出异常。提供的方法有 (`add`|`subtract`|`multiply`|`increment`|`decrement`|`negate`)Exact，带有\
  \ `int` 和 `long` 参数。`toIntExact` 方法将 `long` 转换为相应的 `int`。\n\n`floorMod` 和 `floorDiv`\
  \ 方法旨在解决整数余数长期存在的问题。考虑表达式 `n % 2`。大家都知道如果 `n` 是偶数则为 0，如果 `n` 是奇数则为 1。当然，当 `n` 为负数除外，它是\
  \ –1。为什么？当第一批计算机制造时，有人必须为负操作数的整数除法和余数运算制定规则。数学家们早已知道最优的（或“欧几里得”）规则：始终保持余数 ≥ 0。但由于，那些先驱们并没有翻开数学书，而是制定了看似合理但实际上并不方便的规则。\n\
  \n考虑这个问题：你计算时钟时针的位置。应用一个调整，并将其归一化为 `0` 到 `11` 之间的数字。这很容易：`(position + adjustment)\
  \ % 12`。但如果 `adjustment` 是负数呢？你可能会得到一个负数。所以你必须引入一个分支，或者使用 `((position + adjustment)\
  \ % 12 + 12) % 12`。无论哪，这都很麻烦。\n\n新的 `floorMod` 方法使其变得简单：`floorMod(position + adjustment,\
  \ 12)` 始终产生 `0` 到 `11` 之间的值。\n\n![Image](img/note.jpg) 注意\n\n遗憾的是，`floorMod` 对负除数会给出负数结果，但这种情况在实践中并不经常发生。\n\
  \n`nextDown` 方法针对 `double` 和 `float` 参数定义，给出给定数字下一个更小的浮点数。例如，如果你承诺产生一个小于 `b` 的数字，但你恰好计算出了等于\
  \ `b`，那么你可以返回 `Math.nextDown(b)`。（相应的 `Math.nextUp` 方法自 Java 6 起已存在。）\n\n![Image](img/note.jpg)\
  \ 注意\n\n本节描述的所有方法也存在于 `StrictMath` 类中。\n\n## 8.4. 集合\n\n集合库的巨大变化当然是对流的支持，你在第 2 章\
  \ 中见过。也有一些小的变化。\n\n### 8.4.1. 添加到集合类的方法\n\n表 8–1 显示了 Java 8 为集合类和接口添加的各种方法，除了 `stream`、`parallelStream`\
  \ 和 `spliterator` 方法之外。\n\n![Image](img/08tab01.jpg)\n\n**表 8–1** Java 8 添加到集合类和接口的方法\n\
  \n你可能会奇怪为什么 `Stream` 接口有这么多接受 lambda 表达式的方法，但 `Collection` 接口只添加了这样一个方法——`removeIf`。如果你回顾\
  \ `Stream` 方法，你会发现大多数方法返回单个值或一个转换后的值的流，而这些值在原始流中并不存在。异常是 `filter` 和 `distinct` 方法。`removeIf`\
  \ 方法可以被视为 `filter` 的相反，它是移除而不是产生所有匹配项，并在原地执行。`distinct` 方法在任意集合上提供将是昂贵的。\n\n`List`\
  \ 接口有一个 `replaceAll` 方法，它是 `map` 的原地等效实现，以及一个非常有用的 `sort` 方法。\n\n`Map` 接口有很多对于并发访问的\
  \ map 特别重要的方法。关于这些方法的更多信息请参见第 6 章。\n\n`Iterator` 接口有一个 `forEachRemaining` 方法，通过将剩余的迭代器元素传递给函数来耗尽迭代器。\n\
  \n最后，`BitSet` 类有一个产生所有成员的方法。\n\n### 8.4.2. 比较器\n\n`Comparator` 接口有很多有用的方法，利用了接口现在可以拥有静态方法的事实。静态\
  \ `comparing` 方法接收一个“键提取器”函数，将 `T` 映射到可比较的对象。`Comparator.<String>naturalOrder()`\
  \ 就是我们需要的。这里是按名称排序的完整调用。我使用了 `java.util.Comparator.*` 的静态导入，以使表达式更具可读性。注意 `naturalOrder`\
  \ 的类型是推断的。\n\n```\nArrays.sort(people, comparing(Person::getName));\n```\n\n你可以使用\
  \ `thenComparing` 方法链用比较器来打破平局。例如，\n\n```\nArrays.sort(people, comparing(Person::getLastName).thenComparing(Person::getFirstName));\n\
  ```\n\n这些方法有几种变体。你可以指定一个比较器用于 `comparing` 和 `thenComparing` 方法提取的键。例如，在这里我们按名字长度对人进行排序：\n\
  \n```\nArrays.sort(people, comparing(Person::getName, (s, t) -> Integer.compare(s.length(),\
  \ t.length())));\n```\n\n此外，`comparing` 和 `thenComparing` 方法都有避免对 `int`、`long` 或\
  \ `double` 值装箱的变体。产生上述操作更简单的方法是\n\n```\nArrays.sort(people, Comparator.comparingInt(p\
  \ -> p.getName().length()));\n```\n\n如果你的键函数可以返回 `null`，你会喜欢 `nullsFirst` 和 `nullsLast`\
  \ 适配器。这些静态方法接收一个现有的比较器并修改它，使其在遇到 `null` 值时不会抛出异常，而是将其排为比普通值更小或更大。例如，`getMiddleName`\
  \ 在人没有中间名时返回 `null`。这时你可以使用 `Comparator.comparing(Person::getMiddleName(), Comparator.nullsFirst(...))`。\n\
  \n`nullsFirst` 方法需要一个比较器——在这种情况下，一个比较两个字符串的比较器。`naturalOrder` 方法为实现 `Comparable`\
  \ 的类创建一个比较器。`Comparator.<String>naturalOrder()` 就是我们需要的。这里按可能的空中间名排序的完整调用。\n\n```\n\
  Arrays.sort(people, comparing(Person::getMiddleName, nullsFirst(naturalOrder())));\n\
  ```\n\n静态 `reverseOrder` 方法给出自然顺序的反转。反转任何比较器使用实例方法 `reversed`。例如，`naturalOrder().reversed()`于\
  \ `reverseOrder().`。\n\n\n\n\n\n### 8.4.3. Collections 类\n\nJava 6 引入了 `NavigableSet`\
  \ 和 `NavigableMap` 类，这些类利用元素或键的排序性，提供了高效的方法来定位任何给定的值 `v` 的大于或等于 `v` 的最小元素，或者小于或等于\
  \ `v` 的最大元素。现在，`Collections` 类也像支持其他集合一样支持这些类，提供了方法（`unmodifiable`|`synchronized`|`checked`|`empty`）`Navigable`(`Set`|`Map`)。\n\
  \n还添加了一个 `checkedQueue` 包装器，它显然在这些年来一直被忽视了。提醒一下，`checked` 包装器带有一个 `Class` 参数，并且当你插入错误类型的元素时会抛出\
  \ `ClassCastException`。这些类旨在用作调试辅助。假设你声明了一个 `Queue<Path>`，而在代码的某处有一个 `ClassCastException`\
  \ 尝试将 `String` 强制转换为 `Path`。这可能是因为你将队列传递给了一个没有类型参数的方法 `void getMoreWork(Queue q)`。然后，某人在某处向\
  \ `q` 插入了一个 `String`。（因为泛型类型被抑制了，编译器无法检测到这一点。） 久以后，当你认为它是一个 `Path` 并取出那个 `String`\
  \ 时，错误就显现出来。如果你临时将队列替换为 `CheckedQueue(new LinkedList<Path>, Path.class)`，那么每次插入在运行时都会经过检查，你可以定位到故障的插入代码。\n\
  \n最后，还有 `emptySorted`(`Set`|`Map`）方法，它们提供了排序集合的轻量级实例，类似于自 Java 5 起就存在的 `empty`(`Set`|`Map`）方法。\n\
  \n## 8.5. 处理文件\n\nJava 8 带来了一些方便方法，它们使用流（streams）来读取文件行以及访问目录项。此外，终于有了官方的方法来执行 Base64\
  \ 编码和解码。\n\n### 8.5.1. 行的流\n\n要懒性地读取文件的行，请使用 `Files.lines` 方法。它产生一个字符串流，每行对应输入的一行：\n\
  \n点击查看代码图像\n\n```\nStream<String> lines = Files.lines(path);\nOptional<String> passwordEntry\
  \ = lines.filter(s -> s.contains(\"password\")).findFirst();\n```\n\n一旦找到包含 `password`\
  \ 的第一行，就不会再从底层文件中读取后续行。\n\n***\n\n![图像](img/note.jpg) 注意事项\n\n与 `FileReader` 类不同（它由于使用本地字符编码打开文件，曾是可移植性的噩梦），`Files.lines`\
  \ 方法默认使用 UTF-8。你可以通过提供 `Charset` 参数来指定其他编码。\n\n***\n\n你可能需要关闭底层文件。幸运的是，`Stream`\
  \ 接口继承了 `AutoCloseable`。你在第 2 章中看到的流不需要关闭任何资源。但 `Files.lines` 方法产生的流其 `close` 方法会关闭文件。确保文件确实关闭的最简单方法是使用\
  \ Java 7 的 try-with-resources 块：\n\n点击查看代码图像\n\n```\ntry (Stream<String> lines =\
  \ Files.lines(path)) {\n    Optional<String> passwordEntry\n      = lines.filter(s\
  \ -> s.contains(\"password\")).findFirst();\n    ...\n} // 流，因此文件，将在这里被关闭\n```\n\
  \n当一个流产生另一个流时，`close` 方法是链式的。因此，你也可以写：\n\n点击查看代码图像\n\n```\ntry (Stream<String> filteredLines\n\
  \      = Files.lines(path).filter(s -> s.contains(\"password\"))) {\n    Optional<String>\
  \ passwordEntry = filteredLines.findFirst();\n    ...\n}\n```\n\n当 `filteredLines`\
  \ 被关闭时，它会关闭底层流，从而关闭底层文件。\n\n***\n\n![图像](img/note.jpg) 注意事项\n\n如果你想在流关闭时收到通知，可以附加一个\
  \ `onClose` 处理器。以下是你可以验证关闭 `filteredLines` 确实关闭了底层流的方法\n\n点击查看代码图像\n\n```\ntry (Stream<String>\
  \ filteredLines\n    = Files.lines(path).onClose(() -> System.out.println(\"Closing\"\
  ))\n      .filter(s -> s.contains(\"password\"))) { ... }\n```\n\n***\n\n如果流在获取行时发生\
  \ `IOException`，该异常将被封装成 `UncheckedIOException` 并从流操作中抛出。（这种欺骗手段是必要的，因为流操作没有声明抛出任何受检异常。）\n\
  \n如果你想从文件以外的源读取行，请使用 `BufferedReader.lines` 方法：\n\n点击查看代码图像\n\n```\ntry (BufferedReader\
  \ reader\n      = new BufferedReader(new InputStreamReader(url.openStream()))) {\n\
  \    Stream<String> lines = reader.lines();\n    ...\n}\n```\n\n使用这种方法，关闭流不会关闭读取。由于由于原因，你必须将\
  \ `BufferedReader` 对象而不是流放入 `try` 语句中。\n\n***\n\n![图像](img/note.jpg) 注意事项\n\n多年来，JDK\
  \ 有一个非公有的（因此是不可用的）类 `java.util.prefs.Base64` 和一个未文档的类 `sun.misc.BASE64Encoder`。最后，Java\
  \ 8 提供了标准的编码器和解码器。\n\n***\n\n### 8.5.2. 目录项的流\n\n`Files.list` 方法返回一个读取目录项的 `Stream<Path>`。它是懒性的，使得能够高效处理数量巨大的目录。由于读取目录涉及需要关闭的系统资源，你应该使用\
  \ `try` 块：\n\n点击查看代码图像\n\n```\ntry (Stream<Path> entries = Files.list(path)) {\n\
  \    ...\n}\n```\n\n***\n\n![图像](img/note.jpg) 注意事项\n\n底层，该流使用了 `DirectoryStream`，这是\
  \ Java 7 引入的用于高效遍历的构造。该接口继承了 `Iterable`，因此可以在增强 `for` 循环中使用。\n\n点击查看代码图像\n\n```\n\
  try (DirectoryStream stream = Files.newDirectoryStream(path)) {\n    for (Path entry\
  \ : stream) {\n        ...\n    }\n}\n```\n\n在 Java 8 中，只需使用 `Files.list`。\n\n***\n\
  \n`list` 方法不会进入子目录。要处理所有后代，请改用 `Files.walk` 方法。\n\n点击查看代码图像\n\n```\ntry (Stream<Path>\
  \ entries = Files.walk(root)) {\n    ...\n}\n```\n\n你可以通过调用 `Files.walk(root, depth)`\
  \ 来限制想要访问的树的深度。两个 `walk` 方法都有 `FileVisitOption...` 变长参数，但目前你可以提供的选项只有一个：跟随符号链接的\
  \ `FOLLOW_LINKS`。\n\n***\n\n（此处为上述的注意事项）\n\n如果你对 `walk` 返回的路径进行过滤，并且过滤标准涉及与目录关联的文件属性（例如大小、创建时间或类型：文件、目录、符号链接），请使用\
  \ `find` 方法代替 `walk`。调用该方法并传入一个接受路径和 `BasicFileAttributes` 对象的谓词函数。唯一的优势是效率。因为已经在读取目录了，属性是可用的。\n\
  \n### 8.5.3. Base64 编码\n\nBase64 编码将字节序列编码为（更长的）可打印 ASCII 字符序列。它用于电子邮件消息中的二进制数据和“基础”\
  \ HTTP 身份验证。\n\n\n\n\n\n-   $\\bullet$ 2 个符号，`+` 和 `/`（基础）或 `-` 和 `_`（URL 和文件名安全的变体）\n\
  \n通常，编码后的字符串没有换行符，但用于电子邮件的 MIME 标准要求每 76 个字符包含一个 `\"\\r\\n\"` 换行符。\n\n对于编码，请通过 `Base64`\
  \ 类的静态方法 `getEncoder`、`getUrlEncoder` 或 `getMimeEncoder` 请求一个 `Base64.Encoder`。\n\
  \n该类拥有对字节数组或 NIO `ByteBuffer` 进行编码的方法。例如：\n\n点击此处查看代码图像\n\n```java\nBase64.Encoder\
  \ encoder = Base64.getEncoder();\nString original = username + \":\" + password;\n\
  String encoded = encoder.encodeToString(original.getBytes(StandardCharsets.UTF_8));\n\
  ```\n\n或者，你可以“包装”输出流，这样所有发送到该流的数据都会被自动编码。\n\n点击此处查看代码图像\n\n```java\nPath originalPath\
  \ = ..., encodedPath = ...;\nBase64.Encoder encoder = Base64.getMimeEncoder();\n\
  try (OutputStream output = Files.newOutputStream(encodedPath)) {\n    Files.copy(originalPath,\
  \ encoder.wrap(output));\n}\n```\n\n要解码，请反转这些操作：\n\n点击此处查看代码图像\n\n```java\nPath\
  \ encodedPath = ..., decodedPath = ...;\nBase64.Decoder decoder = Base64.getMimeDecoder();\n\
  try (InputStream input = Files.newInputStream(encodedPath)) {\n    Files.copy(decoder.wrap(input),\
  \ decodedPath);\n}\n```\n\n## 8.6. 注解\n\n注解是是插入到源代码中的标签，某些工具可以对其进行处理。在 Java SE 中，注解用于简单的用途，例如标记已弃用的特性或抑制警告。在\
  \ Java EE 中，注解扮演着重要得多的角色，它们用于配置应用的几乎任何方面，取代了旧版 Java EE 版本中令人痛苦的样板代码和 XML 自定义。\n\n\
  Java 8 对注解处理进行了两项增强：重复注解（repeated annotations）和类型使用注解（type use annotations）。此外，反射也得到了增强，可以报告方法的参数名称。这具有简化方法参数上注解的潜力。\n\
  \n### 8.6.1. 重复注解\n\n当注解最初被创建时，它们被设想为标记用于处理的方法和字段，例如：\n\n点击此处查看代码图像\n\n```java\n\
  @PostConstruct public void fetchData() { ... } // 构造后调用\n@Resource(\"jdbc:derby:sample\"\
  ) private Connection conn;\n    // 在此处注入资源\n```\n\n在这种语境下，两次应用相同的注解是没有意义的。你不能以两种方式注入一个字段。当然，在同一个元素上使用不同的注解是允许的且非常常见的：\n\
  \n点击此处查看代码图像\n\n```java\n@Stateless @Path(\"/service\") public class Service { ...\
  \ }\n```\n\n很快，注解的使用场景越来越多地出现，导致了人们希望重复使用同一个注解的情况。例如，为了表示数据库中的复合键，你需要指定：\n\n点击此处查看代码图像\n\
  \n```java\n@Entity\n@PrimaryKeyColumns({\n    @PrimaryKeyColumn(name=\"ID\"),\n\
  \    @PrimaryKeyColumn(name=\"REGION\")\n})\npublic class Item { ... }\n```\n\n\
  由于之前无法实现，注解被封装在一个容器中，如下：\n\n点击此处查看代码图像\n\n```java\n@Repeatable(PrimaryKeyColumns.class)\n\
  @interface PrimaryKeyColumn {\n    String name();\n}\n\n@interface PrimaryKeyColumns\
  \ {\n    PrimaryKeyColumn[] value();\n}\n```\n\n那样非常糟糕，而且在 Java 8 中不再需要。作为注解使用者，你可以直接使用它们。对于注解实现者来说，情况并不简单。如果\
  \ `AnnotatedElement` 有重复注解，你使用 `getAnnotationsByType(Class extends T>)`，它返回 `T`\
  \ 的数组。如果存在多个相同类型的注解，该方法应该做什么？返回第一个？还是返回所有？\n\n如果你处理的是源码级注解，使用 `getAnnotation(Class\
  \ extends T>)`，它在注解存在时返回单个。如果你处理的是运行时注解，你将需要处理单个注解（如果只提供一次）和容器（如果提供了多次）。\n\n###\
  \ 8.6.2. 类型使用注解\n\n在 Java 8 之前，注解被应用于声明。现在你可以注解任何类型。这在与检查编程错误的工具结合时非常有用。一种常见的错误是由于程序员没有预到某个引用可能为\
  \ `null` 而抛出 `NullPointerException`。现在假设你将永远不希望为 `null` 的变量标记为 `@NonNull`。工具可以检查以下内容是正确的：\n\
  \n点击此处查看代码图像\n\n```java\n@Entity public class Person { ... }\n@SuppressWarnings(\"\
  unchecked\") List<Person> people = query.getResultList();\n```\n\n当然，工具应该检测任何可能导致\
  \ `names` 变为 `null` 的语句：\n\n点击此处查看代码图像\n\n```java\n@NonNull List<String> names =\
  \ new ArrayList<>();\n...\nnames.add(\"Fred\"); // 不可能发生 NullPointerException\n\
  ```\n\n到处处放置此类注解听起来很麻烦，但在实践中，可以通过简单的启发式方法避免一些繁琐工作。Checker Framework 中的空指针检查器（[`types.cs.washington.edu/checker-framework`](http://types.cs.washington.edu/checker-framework)）假设任何非局部变量都是隐式的\
  \ `@NonNull`，但局部变量可能为 `null`，除非代码另有说明。如果方法可能返回 `null`，则需要被标记为 `@Nullable`。这可能比记录空值行为更糟糕。\n\
  \n\n\n\n在上一个示例中，`names` 变量被声明为 `@NonNull`。这种注解在 Java 8 之前是可能的。但如何表达列表的*元素*应该是非空的呢？从逻辑上讲，它应该是：\n\
  \n点击此处查看代码图像\n\n```java\nprivate List<@NonNull String> names;\n```\n\n正是这种注解在 Java\
  \ 8 之前是不可能的，但现在已经变成合法的。\n\n***\n\n![Image](img/note.jpg) 注意\n\n这些注解*不是*标准 Java 的组成部分。目前还没有对类型使用具有实际意义的标准注解。本节中的所有示例都来自\
  \ Checker Framework 或作者的想象。\n\n***\n\n类型使用的注解可以出现在以下位置：\n\n- 带有泛型类型参数中：`List<@NonNull\
  \ String>`、`Comparator.<@NonNull String> reverseOrder()`。\n- 在数组的任何位置：`@NonNull\
  \ String[][] words`（`words[i][j]` 不为 `null`）、`String @NonNull [][] words`（`words`\
  \ 不为 `null`）、`String[] @NonNull [] words`（`words[i]` 不为 `null`）。\n- 带有超类和实现的接口：`class\
  \ Image implements @Rectangular Shape`。\n- 带有构造函数调用：`new @Path String(\"/usr/bin\"\
  )` 。\n- 带有类型转换和 `instanceof` 检查：`(@Path String) input`、`if (input instanceof @Path\
  \ String)`。（这些注解仅供外部工具使用。它们对类型转换或 `instanceof` 检查的行为没有影响。）\n- 带有异常规格说明：`public Person\
  \ read() throws @Localized IOException`。\n- 带有通配符和类型边界：`List<@ReadOnly ? extends\
  \ Person>`、`List<? extends @ReadOnly> Person`。\n- 带有方法和构造函数引用：`@Immutable Person::getName`。\n\
  \n有几个类型位置无法被注解：\n\n点击此处查看代码图像\n\n```java\n@NonNull String.class // 非法—不能注解类\nimport\
  \ java.@NonNull String; // 非法—不能注解导入\n```\n\n注解注解本身是不可能的。例如，给定 `@NonNull String\
  \ name`，你不能注解 `@NonNull`。（你可以提供一个单独的注解，但它将作用于 `name`。）\n\n这些注解的实际用途取决于工具的可行性。如果你对探索类型检查的潜力感兴趣，一个很好的起点是\
  \ Checker Framework 教程，位于 [`types.cs.washington.edu/checker-framework/tutorial`](http://types.cs.washington.edu/checker-framework/tutorial)。\n\
  \n### 8.6.3 方法参数\n\n参数名称现在可以通过反射获取。这很有前景，因为可以减少样板代码。考虑一个典型的 JAX-RS 方法：\n\n点击此处查看代码图像\n\
  \n```java\npublic getEmployee(@PathParam(\"dept\") Long dept, @QueryParam(\"id\"\
  ) Long id)\n```\n\n在几乎所有情况下，参数名与注解参数是相同的，或者可以使它们变得相同。如果注解处理器可以读取参数名，那么就可以简单地写：点击此处查看代码图像\n\
  \n```java\npublic getEmployee(@PathParam Long dept, @QueryParam Long id)\n```\n\n\
  这在 Java 8 中是可能的，使用了新的 `java.lang.reflect.Parameter` 类。遗憾的是，为了让必要的信息出现在类文件中，源代码必须使用\
  \ `javac -parameters` 进行编译。让我们希望注解编写者会热情地拥抱这种机制，这样将来就有动力弃用该标志。\n\n## 8.7 杂项更改\n\n\
  我们以你可能觉得有用的杂项更改结束本章。本节涵盖了 `Objects`、`Logger` 和 `Locale` 类的的新功能，以及正则表达式和 JDBC 的更改。\n\
  \n### 8.7.1 空值检查\n\n`Objects` 类具有静态谓词方法 `isNull` 和 `nonNull`，它们对流可能很有用。例如：点击此处查看代码图像\n\
  \n```java\nstream.anyMatch(Object::isNull)\n```\n\n检查流是否包含 `null`，并且点击此处查看代码图像\n\
  \n```java\nstream.filter(Object::nonNull)\n```\n\n移除所有空值。\n\n### 8.7.2 懒性消息\n\n\
  `java.util.Logger` 类的 `log`、`severe`、`warning`、`info`、`config`、`fine` 和 `finest`\
  \ 方法现在支持懒性构建的消息。例如，考虑调用：点击此处查看代码图像\n\n```java\nlogger.finest(\"x: \" + x + \", y:\"\
  \ + y);\n```\n\n即使日志级别不需要，消息字符串仍然会被格式化。相反，请使用：点击此处查看代码图像\n\n```java\nlogger.finest(()\
  \ -> \"x: \" + x + \", y:\" + y);\n```\n\n现在，lambda 表达式在 `FINEST` 日志级别才会求值，此时额外调用\
  \ lambda 的成本可能是人们最最小的问题。\n\n`Objects` 类的 `requireNonNull`（在[第 9 章]中描述）也有一个惰性计算消息字符串的版本：点击此处查看代码图像\n\
  \n```java\nObjects.requireNonNull(directions, () -> \"directions for \" + \" must\
  \ not be null\");\n```\n\n如果 `directions` 为 `null`，则会调用 lambda 并抛出 `NullPointerException`。\n\
  \n### 8.7.3 正则表达式\n\nJava 7 引入了命名捕获组。例如，一个有效的正则表达式是：点击此处查看代码图像\n\n```\n(?<city>[\\\
  p{L} ]),\\s*(?<state>[A-Z]{2})\n```\n\n在 Java 8 中，可以使用 `Matcher` 的 `start`、`end`\
  \ 和 `group` 方法：点击此处查看代码图像\n\n```java\nMatcher matcher = pattern.matcher(input);\n\
  if (matcher.matches()) {\n    String city = matcher.group(\"city\");\n}\n```\n\n\
  `Pattern` 类有一个 `splitAsStream` 方法，可以根据正则表达式分割 `CharSequence`：点击此处查看代码图像\n\n```java\n\
  String contents = new String(Files.readBytes(path), StandardCharsets.UTF_8);\nStream<String>\
  \ words = Pattern.compile(\"\\\\P{L}+\").splitAsStream(contents);\n```\n\n所有非字母序列都是分隔符。\n\
  \n`asPredicate` 方法可以过滤匹配正则表达式的字符串：点击此处查看代码图像\n\n```java\nStream<String> acronyms\
  \ = words.filter(Pattern.compile(\"[A-Z]{2,}\").asPredicate());\n```\n\n### 8.7.4\
  \ 语言区域\n\nLocale 指定了向具有语言、日期格式等偏好的用户展示信息的所有信息。例如，美国用户喜欢将日期格式为 December 24, 2013\
  \ 或 12/24/2013，而德国用户期望为 24. Dezember 2013 或 24.12.2013。\n\n过去 Locale 非常简单，由位置、语言和（对于少数特殊情况，如挪威人的两种拼写系统）变体组成。但这些特殊情况激增，互联网工程任务组发布了\
  \ BCP 47 最佳实践备忘录 ([`tools.ietf.org/html/bcp47`](http://tools.ietf.org/html/bcp47))\
  \ 来为混乱带来秩序。现在，Locale 由最多五个部分组成。\n\n1. 语言，由两个三个小写字母表示，例如 `en`（英语）或 `de`（德语或德语中的 Deutsch）。\n\
  2. 脚本，由首字母大写的四个字母表示，例如 `Latn`（拉丁）、`Cyrl`（西里尔）或 `Hant`（繁体中文）。这是因为某些语言（如塞尔维亚语）使用拉丁或西里尔字母，某些中文读者更倾向于繁体而非简体。\n\
  3. 国家，由两个大写字母或三个数字表示，例如 `US`（美国）或 `CH`（瑞士）。\n\n\n\n\n\n## 4. 可选的，变体（variant）。变体已不再常见。例如，挪威语的尼诺语（Nynorsk）拼写现在用不同的语言代码\
  \ `nn` 来表示，而不是语言 `no` 的变体 `NY`。\n\n## 5. 可选的，扩展（extension）。扩展描述了对日历（如日本历法）、数字（泰国数字）等的本地偏好。Unicode\
  \ 标准规定了其中一些扩展。此类扩展以 `u-` 开头，并跟着一个两个字母的代码，指定该扩展处理的是日历（`ca`）、数字（`nu`）等。例如，扩展 `u-nu-thai`\
  \ 表示使用泰国数字。其他扩展完全任意，并以 `x-` 开头，例如 `x-java`。\n\n你仍然可以使用旧方法构建区域设置（locale），例如 `new\
  \ Locale(\"en\", \"US\")`，但从 Java 7 开始，你可以简单地调用 `Locale.forLanguageTag(\"en-US\"\
  )`。Java 8 增加了用于查找用户需求的区域设置的方法。\n\n*语言范围*（language range）是一个表示用户所需的区域设置特征的字符串，其中\
  \ `*` 用于通配符。例如，瑞士的德语使用者可能偏好任何德语的内容，随后是任何关于瑞士的内容。这通过两个指定为字符串 `\"de\"` 和 `\"*-CH\"\
  ` 的 `Locale.LanguageRange` 对象来表示。在构造 `Locale.LanguageRange` 时，可以可选指定一个 0 到 1 之间的权重。\n\
  \n给定一个加权语言范围列表和一个区域设置集合，`filter` 方法会产生一个匹配的区域设置列表，按匹配质量从降序排列：\n\n```\nList<Locale.LanguageRange>\
  \ ranges = Stream.of(\"de\", \"*-CH\")\n      .map(Locale.LanguageRange::new)\n\
  \      .collect(Collectors.toList());\n\n// 包含给定字符串对应的 Locale.LanguageRange 对象的列表\n\
  List<Locale> matches = Locale.filter(ranges,\n    Arrays.asList(Locale.getAvailableLocales()));\n\
  \n// 匹配的区域设置：de, de-CH, de-AT, de-LU, de-DE, de-GR, fr-CH, it_CH\n```\n\n静态方法 `lookup`\
  \ 仅查找最佳区域设置：\n\n```\nLocale bestMatch = Locale.lookup(ranges, locales);\n```\n\n\
  在这种情况下，最佳匹配是 `de`，这并不有趣。但如果 `locales` 包含一个更有限的区域设置集合（例如文档可用的区域），那么这种机制就会很有用。\n\n\
  ### 8.7.5. JDBC\n\n在 Java 8 中，JDBC 已更新到 4.2 版本。有一些细小的变化。\n\n`java.sql` 包中的 `Date`、`Time`\
  \ 和 `Timestamp` 类拥有了与它们的 `java.time` 对应类 `LocalDate`、`LocalTime` 和 `LocalDateTime`\
  \ 进行转换的方法。\n\n`Statement` 类有一个方法 `executeLargeUpdate`，用于执行行数超过 `Integer.MAX_VALUE`\
  \ 的更新操作。\n\nJDBC 4.1（Java 7 的一部分）为 `Statement` 和 `ResultSet` 指定了一个泛型方法 `getObject(column,\
  \ type)`，其中 `type` 是一个 `Class` 实例。例如，`URL url = result.getObject(\"link\", URL.class)`\
  \ 将 `DATALINK` 获取为 `URL`。现在也提供了相应的 `setObject` 方法。\n\n## 练习题\n\n**1.** 编写一个程序，使用\
  \ `int` 值和无符号操作对 0 到 2³² – 1 之间的数字进行加、减、除和比较。说明为什么 `divideUnsigned` 和 `remainderUnsigned`\
  \ 是必要的。\n\n**2.** 对于 get 哪一个整数 `n`，`Math.negateExact(n)` 会抛出异常？（提示：只有一个。）\n\n**3.**\
  \ 欧几里得算法（已有两千多年历史）计算两个数的最大公约数：如果 `b` 为 0，则 `gcd(a, b) = a`；否则 `gcd(b, rem(a, b))`，其中\
  \ `rem` 是余数。显然，`gcd` 不应为负数，即使 `a` 或 `b` 是负数（因为它们的取反将是一个更大的约数）。使用 `%`、`floorMod`\
  \ 和一个产生数学（非负）余数的 `rem` 函数来实现该算法。这三种方法中，哪种处理负值时的麻烦最少？\n\n**4.** `Math.nextDown(x)`\
  \ 方法返回比 `x` 小的浮点数，以防某些随机过程正好命中了 `x`，而我们承诺一个小于 `x` 的数。这真的会发生吗？考虑 `double r = 1 -\
  \ generator.nextDouble()`，其中 `generator` 是 `java.util.Random` 的实例。它可能产生 1 吗？也就是说，`generator.nextDouble()`\
  \ 可能产生 0 吗？文档说它可以产生 0（包含）到 1（不包含）之间的任何值。但考虑到有 2⁵³ 个这样的浮点数，你会得到 0 吗？事实上，你得到了。随机数生成器计算下一个种子为\
  \ `next(s) = s · m + a % N`，[注：在原文中，表达式为 `next(s) = s · m + a % N`]。（等待，提示词文本说是\
  \ `next(s) = s · m + a % N`）。\n\n实际上，查看你提示词中提供的源文本：`next(s) = s · m + a % N`。\n\n\
  *修正：在提供的文本块中，表达式为 `next(s) = s · m + a % N`。我将按照其格式化。*\n\n等待，提示词文本说 `next(s) = s\
  \ · m + a % N`。\n\n（由于原始文本中对练习题的描述存在大量重复说明，此处已提取核心逻辑进行翻译。）\n\n\n\n\n\n![Image](img/squf.jpg)\
  \ 9.1 异常处理更改\n![Image](img/squf.jpg) 9.2 文件操作\n![Image](img/squf.jpg) 9.3 实现 `equals`、`hashCode`\
  \ 和 `compareTo` 方法\n![Image](img/squf.jpg) 9.4 安全需求\n![Image](img/squf.jpg) 9.5\
  \ 其他更改\n![Image](img/squf.jpg) 9.6 练习\n\n当 Java 7 发布时，大多数评论者关注的是新的语言特性：switch 语句中的字符串、二进制字面量、字面量中的下划线、改进的类型推断等。在本章中，我将介绍一些没有被讨论过的库更改，我发现它们在日常工作中比切换字符串或二进制字面量要有用得多。我涵盖了一项在日常工作中非常有用的语言更改——资源管理器（try-with-resources）语句。\n\
  \n本章的要点是：\n\n- 对任何实现了 `AutoCloseable` 接口的对象使用 try-with-resources 语句。\n- 如果关闭资源抛出了另一个异常，try-with-resources\
  \ 语句将重新抛出主异常。\n- 你可以使用单个 `catch` 句捕获不相关的异常。\n- 反射操作的异常现在有一个共同的父类 `ReflectiveOperationException`。\n\
  - 使用 `Path` 接口代替 `File` 类。\n- 你可以使用单个命令读取和写入文本文件的所有字符或所有行。\n- `Files` 类具有用于复制、移动、删除文件，以及创建文件和目录的静态方法。\n\
  - 使用 `Objects.equals` 进行空安全的等等性测试。\n- `Objects.hash` 使得实现 `hashCode` 方法变得简单。\n-\
  \ 在比较器中比较数字时，使用静态的 `compare` 方法。\n- Applets 和 Java Web Start 应用程序在企业环境中继续受支持，但它们对家庭用户可能不再可行。\n\
  - 每个人最喜欢的微小更改：`\"+1\"` 现在可以转换为整数而不会抛出异常。\n- `ProcessBuilder` 的更改使得重定向标准输入、输出和错误流变得简单。\n\
  \n## 9.1 异常处理更改\n\n我从 Java 7 的异常处理特性开始这一章，因为它们对编写可靠的程序有重大影响。在转向更微妙的更改之前，我简要回顾了 try-with-resources\
  \ 语句。\n\n### 9.1.1 try-with-resources 语句\n\nJava 7 为以下代码模式提供了一个实用的快捷方法：\n\n```java\n\
  open a resource\ntry {\n    work with the resource\n}\nfinally {\n    close the\
  \ resource\n}\n```\n\n前提资源属于实现了 `AutoCloseable` 接口的类。该接口有一个方法：\n`void close() throws\
  \ Exception`\n\n***\n\n![Image](img/note.jpg) 注意释\n\n还有一个 `Closeable` 接口。它是 `AutoCloseable`\
  \ 的子接口，同样有一个 `close` 方法，但该方法被声明为抛出 `IOException`。\n\n***\n\n在最简单的变体中，try-with-resources\
  \ 语句的形式如下：\n\n```java\ntry (Resource res = ...) {\n    work with res\n}\n```\n\n\
  当 `try` 块退出时，会自动调用 `res.close()`。这里有一个典型的示例——读取文件中的所有单词：\n\n点击此处查看代码图片\n\n```java\n\
  try (Scanner in = new Scanner(Paths.get(\"/usr/share/dict/words\"))) {\n    while\
  \ (in.hasNext()) {\n        System.out.println(in.next().toLowerCase());\n    }\n\
  }\n```\n\n当块正常退出或发生异常时，`in.close()` 方法都会被调用，正好像你使用了 `finally` 块一样。\n\n你可以指定多个资源，例如：\n\
  \n点击此处查看代码图片\n\n```java\ntry (Scanner in = new Scanner(Paths.get(\"/usr/share/dict/words\"\
  ));\n      PrintWriter out = new PrintWriter(\"/tmp/out.txt\")) {\n    while (in.hasNext())\
  \ {\n        out.println(in.next().toLowerCase());\n    }\n}\n```\n\n无论块如何退出，只要\
  \ `in` 和 `out` 被构造，它们就会被关闭。在 Java 7 之前，要正确实现这一点是异常地困难（见练习 1）。\n\n***\n\n![Image](img/note.jpg)\
  \ 注意\n\ntry-with-resources 语句本身可以拥有 `catch` 句和 `finally` 句。这些会在关闭资源后执行。在实践中，将这么多内容堆叠在一个\
  \ `try` 语句中可能不是一个好主意。\n\n***\n\n### 9.1.2 抑制异常\n\n每当你处理输入或输出时，在异常后关闭资源都会遇到一个尴尬的问题。假设发生了一个\
  \ `IOException`，然后在关闭资源时，资源抛出了另一个异常。\n\n会捕获哪一个异常？在 Java 中，`finally` 句会丢弃之前的异常。try-with-resources\
  \ 语句反转了这一点。当其中一个对象的 `close` 方法中抛出异常时，该异常会被重新抛出，而之前的异常会被“抑制”。\n\n当你捕获主异常时，可以通过调用\
  \ `getSuppressed()` 获取这些抑制的异常：\n\n点击此处查看代码图片\n\n```java\ntry {\n    ...\n} catch\
  \ (IOException ex) {\n    Throwable[] secondaryExceptions = ex.getSuppressed();\n\
  }\n```\n\n如果在无法使用 try-with-resources 的（罕见）情况下实现这种机制，请调用：\n\n点击此处查看代码图片\n\n```java\n\
  ex.addSuppressed(secondaryException);\n```\n\n***\n\n![Image](img/note.jpg) 注意\n\
  \n`Throwable`、`Exception`、`RuntimeException` 和 `Error` 类都有禁用抑制异常和堆栈跟踪的构造函数。禁用抑制异常时，调用\
  \ `addSuppressed` 无效，`getSuppressed` 返回空数组。禁用堆栈跟踪时，`fillInStackTrace` 无效，`getStackTrace`\
  \ 返回空数组。这对于内存不足时的虚拟机错误或使用异常跳出方法调用的编程语言非常有用。\n\n***\n\n***\n\n![Image](img/caution.jpg)\
  \ 警告\n\n检测抑制异常只有在没有被主动破坏的情况下才有效。特别是，如果你使用 `Scanner`，如果输入失败且随后关闭失败，`Scanner` 类会捕获输入异常，关闭资源并捕获该异常，然后抛出一个完全不同的异常，而不关联抑制。\n\
  \n***\n\n### 9.1.3 捕获多个异常\n\n从 Java 7 开始，你可以在同一个 `catch` 句中捕获多个异常类型。例如，假设处理文件和未知主机的操作相同。那么你可以合并\
  \ `catch` 句：\n\n点击此处查看代码图片\n\n```java\ntry {\n    // 可能抛出异常的代码\n} catch (FileNotFoundException\
  \ | UnknownHostException ex) {\n    // 处理缺失文件和未知主机的操作\n} catch (IOException ex)\
  \ {\n    // 处理所有其他 I/O 问题\n}\n```\n\n这种特性只需要在捕获互不为子类的异常类型时使用。捕获多个异常不仅让代码看起来更简单，而且效率更高。生成的字节码包含一个共享\
  \ `catch` 句的单一块。\n\n***\n\n![Image](img/note.jpg) 注意\n\n当你捕获多个异常时，异常变量是隐式的 `final`。例如，你不能在\
  \ `catch (FileNotFoundException | UnknownHostException ex) { ... }` 句体中为 `ex` 赋值新值。\n\
  \n\n\n\n\n### 9.1.4. 反射方法的更简便异常处理\n\n在过去，当你调用反射方法时，必须捕获多个不相关的检查异常（checked exceptions）。例如，假设你构造了一个类并调用它的\
  \ `main` 方法：\n\n点击此处查看代码图片\n\n```java\nClass.forName(className).getMethod(\"main\"\
  ).invoke(null, new String[] {}); own\n```\n\n此语句可能会导致 `ClassNotFoundException`、`NoSuchMethodException`、`IllegalAccessException`\
  \ 或 `InvocationTargetException`。\n\n当然，你可以使用上一节描述的功能，将它们合并在单个子句中：\n\n点击此处查看代码图片\n\
  \n```java\ncatch (ClassNotFoundException | NoSuchMethodException\n    | IllegalAccessException\
  \ | InvocationTargetException ex) { ... } own\n```\n\n然而，这仍然非常繁琐。简单来说，没有为相关异常提供一个通用的超类是一个糟糕的设计。这个设计缺陷在\
  \ Java 7 中得到了修复。引入了一个新的超类 `ReflectiveOperationException`，以便你可以在一个处理程序中捕获所有异常：\n\n\
  点击此处查看代码图片\n\n```java\ncatch (ReflectiveOperationException ex) { ... }\n```\n\n\
  ## 9.2. 文件操作\n\n`try-with-resources` 语句是我在 Java 7 中喜欢的功能，但文件处理的改进紧随其后。以前非常繁琐的操作，例如将文件读取到字符串或将文件复制到另一个地方，现在变得像一直以来那样简单。这些都是“NIO2”工作的一部分，它刷新了\
  \ 2002 年随 Java 1.4 引入的 NIO（“新 I/O”）标准库。（在产品名称中包含“new”永远不是好主意——今天的新奇事物不可避免地变得过时，名字听起来会很蠢。）\n\
  \n在学习如何执行这些简单的文件操作之前，你必须先学习替代 `File` 类的 `Path` 接口。接下来，你将看到如何读写文件。最后，我们将转向文件和目录操作。\n\
  \n### 9.2.1. 路径 (Paths)\n\n`Path` 是目录名称的序列，可选地跟随一个文件名。路径的第一个组件可以是根组件，例如 `/` 或 `C:\\\
  `。允许的根组件取决于文件系统。以根组件开头的路径是*绝对路径*（absolute）。否则，它是*相对路径*（relative）。例如，在这里我们构造了一个绝对路径和一个相对相对路径。对于绝对路径，我们假设计算机运行的是类\
  \ Unix 文件系统。\n\n点击此处查看代码图片\n\n```java\nPath absolute = Paths.get(\"/\", \"home\"\
  , \"cay\");\nPath relative = Paths.get(\"myprog\", \"conf\", \"user.properties\"\
  );\n```\n\n静态方法 `Paths.get` 接收一个或多个字符串，并使用默认文件系统的路径分隔符（类 Unix 文件系统为 `/`，Windows\
  \ 为 `\\`）将它们连接。然后它解析结果，如果结果在给定的文件系统中不是有效路径，则会抛出 `InvalidPathException`。结果是一个 `Path`\
  \ 对象。\n\n你也可以向 `Paths.get` 方法提供带有分隔符的字符串：\n\n点击此处查看代码图片\n\n```java\nPath homeDirectory\
  \ = Paths.get(\"/home/cay\");\n```\n\n***\n\n![Image](img/note.jpg) 注意\n\n就像 `File`\
  \ 对象一样，`Path` 对象并不一定对应于实际存在的文件。它仅仅是一个抽象的名称序列。要创建文件，先创建一个路径，然后调用方法创建相应的文件。\n\n***\n\
  \n组合或解析（resolve）路径是非常常见的。调用 `p.resolve(q)` 根据以下规则返回路径：\n\n- 如果 `q` 是绝对路径，则结果为 `q`。\n\
  - 否则，根据文件系统的规则，结果为“`p` 紧接 `q`”。\n\n例如，假设你的应用程序需要相对于主目录找到其配置文件。以下是你可以如何组合路径的：\n\n\
  点击此处查看代码图片\n\n```java\nPath configPath = homeDirectory.resolve(\"myprog/conf/user.properties\"\
  );\n// 等于 homeDirectory.resolve(Paths.get(\"myprog/conf/user.properties\"));\n```\n\
  \n有一个便利方法 `resolveSibling`，它相对于路径的父路径进行解析，产生一个兄弟路径。例如，如果 `workPath` 是 `/home/cay/myprog/work`，调用\n\
  \n点击此处查看代码图片\n\n```java\nPath tempPath = workPath.resolveSibling(\"temp\");\n```\n\
  \n产生 `/home/cay/myprog/temp`。\n\n`resolve` 的反操作是 `relativize`。调用 `p.relativize(r)`\
  \ 产生路径 `q`，该路径与 `p` 解析后会产生 `r`。例如，\n\n点击此处查看代码图片\n\n```java\nPaths.get(\"/home/cay\"\
  ).relativize(Paths.get(\"/home/fred/myprog\"))\n```\n\n假设类 Unix 文件系统，产生 `../fred/myprog`。\n\
  \n`normalize` 方法移除路径中的 `.` 或 `..` 元素。例如，`normalize()` 可以移除冗余元素：\n\n```java\nPath\
  \ p = Paths.get(\"/home/cay/../fred/./myprog\").normalize();\n// 结果为 /home/fred/myprog\n\
  ```\n\n`toAbsolutePath()` 方法返回路径的绝对路径。例如：\n\n```java\nPath p = Paths.get(\"fred/myprog\"\
  ).toAbsolutePath();\n// 可能是 /home/user/fred/myprog\n```\n\n`getFileName()` 方法返回路径的文件名。例如：\n\
  \n```java\nPath p = Paths.get(\"/home/cay/myprog\").getFileName();\n// 返回 myprog\n\
  ```\n\n`getParent()` 方法返回路径的父目录。例如：\n\n```java\nPath p = Paths.get(\"/home/cay/myprog\"\
  ).getParent();\n// 返回 /home/cay\n```\n\n`getRoot()` 方法返回返回路径的根节点。例如：\n\n```java\n\
  Path p = Paths.get(\"/home/cay/user.properties\").getRoot();\n// 返回 /\n```\n\n`getNameCount()`\
  \ 方法返回路径中的组件数量。例如：\n\n```java\nint count = Paths.get(\"/home/cay/user.properties\"\
  ).getNameCount();\n// 返回 3\n```\n\n`toString()` 方法返回路径的字符串表示。例如：\n\n```java\nPath\
  \ p = Paths.get(\"/home/cay/user.properties\").toString();\n// 返回 /home/cay/user.properties\n\
  ```\n\n`toFile()` 方法返回一个 `File` 对象。例如：\n\n```java\nFile f = Paths.get(\"/home/cay/user.properties\"\
  ).toFile();\n```\n\n***\n\n### 9.2.2. 文件的读取与写入\n\n`Files` 类使得常见的文件操作变得简单。例如，你可以轻松地读取整个文件的内容：\n\
  \n```java\nbyte[] bytes = Files.readAllBytes(path);\n```\n\n如果你想将文件读取为字符串，调用 `readAllBytes`\
  \ 后接\n\n```java\nString content = new String(bytes, StandardCharsets.UTF_8);\n```\n\
  \n但如果你想要文件作为行序列，调用 `readAllLines`：\n\n```java\nList<String> lines = Files.readAllLines(path);\n\
  ```\n\n相反，如果你想写入一个字符串，调用：\n\n```java\nFiles.write(path, content.getBytes(StandardCharsets.UTF_8));\n\
  ```\n\n你也可以写入一个行集合：\n\n```java\nFiles.write(path, lines);\n```\n\n要追加到给定的文件，使用\n\
  \n```java\nFiles.write(path, lines, StandardOpenOption.APPEND);\n```\n\n***\n\n\
  ![Image](img/note.jpg) 注意\n\n默认情况下，`Files` 类所有读取或写入字符的方法都使用 UTF-8 编码。在（极少情况下）需要不同编码时，你可以提供\
  \ `Charset` 参数。这与 `String` 构造函数和 `getBytes` 方法形成对比，它们使用平台默认编码。常用的桌面操作系统仍使用与 UTF-8\
  \ 不兼容的古老 8 位编码，因此在字符串和字节之间转换时，我们必须指定编码。\n\n***\n\n当你处理中等长度的文本文件时，简单的方法是将内容作为单个字符串或字符串列表进行处理。如果文件很大或者是二进制文件，你仍然可以使用熟悉的流或读取/写入器：\n\
  \n```java\nInputStream in = Files.newInputStream(path);\n```\n\n\n\n```java\nOutputStream\
  \ out = Files.newOutputStream(path);\n```\n\n```java\nReader reader = Files.newBufferedReader(path);\n\
  ```\n\n```java\nWriter writer = Files.newBufferedWriter(path);\n```\n\n这些便利方法让你无需亲自处理\
  \ `FileInputStream`、`FileOutputStream`、`BufferedReader` 或 `BufferedWriter`。\n\n\
  有时，你可能有一个 `InputStream`（例如来自某个 `URL`），并且你想将其内容保存到文件中。使用：\n\n```java\nFiles.copy(in,\
  \ path);\n```\n\n相反，\n\n```java\nFiles.copy(path, out);\n```\n\n会将文件拷贝到输出流。\n\n\
  ### 9.2.3. 创建文件和目录\n\n要创建一个新目录，调用：\n\n```java\nFiles.createDirectory(path);\n```\n\
  \n路径中除最后一个组件的所有部分必须已经存在。如果要创建中间目录，请使用\n\n点击此处查看代码图片\n\n```java\nFiles.createDirectories(path);\n\
  ```\n\n你可以使用以下方法创建一个空文件：\n\n```java\nFiles.createFile(path);\n```\n\n如果文件已存在，该调用将抛出异常。存在检查和创建过程是原子的。如果文件不存在，它将在其他人有机会执行相同操作之前创建。\n\
  \n`path.exists()` 方法检查给定的文件或目录是否存在，但当然，在方法返回时它可能已经不存在了。\n\n有一些便利方法，可以在给定位置或系统特定位置创建临时文件或目录。\n\
  \n点击此处查看代码图片\n\n```java\nPath newPath = Files.createTempFile(dir, prefix, suffix);\n\
  ```\n\n```java\nPath newPath = Files.createTempFile(prefix, suffix);\n```\n\n```java\n\
  Path newPath = Files.createTempDirectory(dir, prefix);\n```\n\n```java\nPath newPath\
  \ = Files.createTempDirectory(prefix);\n```\n\n在这里，`dir` 是一个 `Path`，`prefix`/`suffix`\
  \ 是可能为 `null` 的字符串。例如，调用 `Files.createTempFile(null, \".txt\")` 可能会返回类似 `/tmp/1234405522364837194.txt`\
  \ 的路径。\n\n***\n\n![Image](img/note.jpg) 注意\n\n要从目录读取文件，请使用第 8 章中描述的 `Files.list`\
  \ 和 `Files.walk` 方法。\n\n***\n\n### 9.2.4. 拷贝、移动和删除文件\n\n要将文件从一个位置拷贝到另一个位置，只需调用：\n\
  \n```java\nFiles.copy(fromPath, toPath);\n```\n\n移动文件（即拷贝并删除原始），调用：\n\n```java\n\
  Files.move(fromPath, toPath);\n```\n\n你也可以使用此命令移动空目录。\n\n如果目标存在，拷贝或移动将失败。如果你想覆盖现有目标，请使用\
  \ `REPLACE_EXISTING` 选项。如果你想拷贝所有文件属性，请使用 `COPY_ATTRIBUTES` 选项。你可以这样提供两个选项：\n\n点击此处查看代码图片\n\
  \n```java\nFiles.copy(fromPath, toPath, StandardCopyOption.REPLACE_EXISTING,\n \
  \   StandardCopyOption.COPY_ATTRIBUTES);\n```\n\n你可以指定移动应该是原子的。这样你就能确保要么移动成功完成，要么源文件继续存在。使用\
  \ `ATOMIC_MOVE` 选项：\n\n点击此处查看代码图片\n\n```java\nFiles.move(fromPath, toPath, StandardCopyOption.ATOMIC_MOVE);\n\
  ```\n\n最后，要删除文件，只需调用：\n\n```java\nFiles.delete(path);\n```\n\n如果文件不存在，该方法将抛出异常，因此你可能想使用：\n\
  \n点击此处查看代码图片\n\n```java\nboolean deleted = Files.deleteIfExists(path);\n```\n\n\
  删除方法也可以用于移除空目录。\n\n***\n\n![Image](img/note.jpg) 注意\n\n没有便利的方法可以移除或拷贝非空目录。请参考 `FileVisitor`\
  \ 接口的 API 文档获取实现这些任务的代码概要。\n\n***\n\n## 9.3. 实现 equals、hashCode 和 compareTo 方法\n\
  \nJava 7 引入了几个方法，使得处理无处不在的 `equals` 和 `hashCode` 中的 `null` 值，以及 `compareTo` 中的数值比较变得更加方便。\n\
  \n### 9.3.1. 空安全等性测试\n\n假设你必须为此类实现 `equals` 方法：\n\n```java\npublic class Person\
  \ {\n   private String first;\n   private String last;\n   ...\n}\n```\n\n首先，有将参数强制转换为\
  \ `Person` 的繁琐工作：\n\n点击此处查看代码图片\n\n```java\npublic boolean equals(Object otherObject)\
  \ {\n    if (this == otherObject) return true;\n    if (otherObject == null) return\
  \ false;\n    if (getClass() != otherObject.getClass()) return false;\n    Person\
  \ other = (Person) otherObject;\n    ...\n}\n```\n\n不幸的是，这种繁琐工作还没有简化。但现在变得更好了。不再需要担心\
  \ `first` 或 `last` 可能是 `null`，只需调用...\n\n\n\n不久后，学术研究人员发现了一些实现上的缺陷，这些缺陷被迅速修复，而其他研究人员则普遍抱怨\
  \ Java 安全模型过于复杂，且几乎无法保证其“阴暗角落”能够免受攻击。在当时，我并没有非常重视这一点，因为绝大多数 Java applet 消费者使用的是\
  \ Microsoft Windows，而后者的安全性低得多，复杂性也高得多。\n\nApplet（小程序）被局限于视觉效果和与源主机的网络连接，许多许多应用程序编写者认为这具有局限性。他们希望获得对存储、打印等本地设备的访问权限。2001\
  \ 年，Java Web Start 提供了沙箱的扩展，其功能非常强大，足以与今天的 HTML 5 本地设备访问扩展相媲。遗憾的是，Java Web Start\
  \ 并不为人所知，没有与 applet 集成，也没有得到任何有力的维护。\n\n相反，许多应用程序开发者简单地对通过网络交付的程序进行签名，这赋予了他们可以在用户机器上执行任何操作的完全权限。商业实体的签名证书对于愿意愿意某些成本和痛苦的人来说都可以获得。也可以申请毫无意义的自签名证书，或者让用户同意在没有证书的情况下运行\
  \ applet。警告信息从一个版本到另一个版本被淡化，直到它们变成了背景噪音。这非常糟糕。\n\n与此同时，微软投入了巨大的工程努力，变得越来越擅长修复 Windows\
  \ 漏洞，使得黑客转而寻找晦涩的 Java 漏洞变得物有所值。当 Oracle 在 2010 年收购 Sun 时，他们继承了一个用于处理此类攻击的非常有限的基础设施，并且没有可靠的方法更新客户端虚拟机。黑客在利用\
  \ Java 实现漏洞方面变得越来越成功。在这方面，早期预警 Java 安全模型存在巨大攻击面的研究人员的观点是完全正确的。Oracle 直到 2013 年才对攻击做出了令人信服的响应。客户端虚拟机（VM）的管理仍在此进行中。\n\
  \n截至今日，Oracle 发出的信号表明，它不再关注保护家庭用户的 Java applet 和 Web Start 应用（统称为富 Internet 应用程序，或\
  \ RIAs）。Oracle 将继续修复 Java 漏洞，并开发适用于企业部署的工具，以便遗留的 RIAs 能够安全地部署。从商业角度来看，这是合理的。家庭用户预计将从\
  \ PC 迁移到平板电脑和智能手机。这些设备不支持在浏览器中运行 Java VM。而业务用户是维护遗留程序的合理营收目标。\n\n随着 Java 7 的连续发布，Oracle\
  \ 收紧了安全规则。截至 2014 年 1 月，运行在沙箱之外的 RIAs 需要由商业证书机构签名。另一个要求是为了阻止“重用攻击”。目前，可以从第三方处获取一个合法签名的\
  \ JAR 文件并从黑客网站提供它，从而利用该第三方应用程序中的某些漏洞。截至 2014 年 1 月，所有 JAR *必须* 包含一个 manifest（清单）条目\n\
  \n`Permissions:`-`sandbox`\n\n或者\n\n`Permissions:`-`all-permissions`\n\n由于 manifest\
  \ 条目位于 `JAR` 文件内部，它是经过签名的，之后无法被修改。Java 客户端将不允许 `all-permission` 客户端进行沙箱执行，这防止了 applet\
  \ 在未经任何用户同意的情况下运行的“路过”（drive-by）攻击。当然，仍然可能攻击那些习惯于同意任何安全对话框的用户。为了增加难度，又添加了另一个目前可选的\
  \ manifest 条目：\n\n点击此处查看代码图像\n\n代码库：`https://www.mycompany.com` `www.mycompany.com:8080`\n\
  \n仅允许从给定的 URL 之一加载应用程序。\n\n***\n\n![图像](img/note.jpg) 注意事项\n\n从 JavaScript 调用 applet\
  \ 一直是可能的——从注重安全的人的角度来看，这是另一个可疑的决定。如果你在应用程序中使用该功能，可以在签名之前向 manifest 中添加条目 `Caller-Allowable-Codebase:\
  \ https://www.mycompany.com` 来最大限度地降低重用风险。\n\n***\n\n总的来说，这些发展非常悲哀。Java 作为一种远程代码的通用执行平台，曾有过巨大的前景。如果\
  \ Java 能提供一个更具吸引力的沙箱，如果非沙箱代码得到更激进的控制，如果对安全泄露有持续的响应，并且客户端虚拟机得到可靠的更新，Java 可能仍然是那个通用平台。但纠结于可能发生的事情没有用。在现在，Java\
  \ 不再是一个在互联网上广泛发布客户端应用程序的可行平台。\n\n如果你为家庭用户维护 applet 或 Java Web Start ，信息很明确：远离它吧。如果你的应用程序面向特定的受众（例如，软件开发、图像编辑或文档处理），让你的用户安装\
  \ Java 或在你的安装程序中包含一个 JVM。如果你针对的是普通受众——如游戏玩家——考虑使用其他技术，也许是 HTML5。\n\n***\n\n![图像](img/note.jpg)\
  \ 注意事项\n\n如果你决定让用户安装 Java，你将面临另一个障碍。如果你引导 Windows 用户前往 [`http://java.com`](http://java.com)\
  \ 下载安装程序，他们默认将收到备受敌恶的 Ask.com 工具栏（参见图 9–1）。你有两种选择。你可以让用户安装 `JDK`，引导他们访问 [www.oracle.com/technetwork/java/javase/downloads](http://www.oracle.com/technetwork/java/javase/downloads)\
  \ 并为他们提供浏览该不断变化的页面说明。或者你可以包含一个 `JVM`，那么你就有义务更新它，因为 Oracle 没有提供有效的更新机制。\n\n![图像](img/09fig01.jpg)\n\
  \n**图 9–1** 默认情况下，Windows JRE 安装程序安装 Ask.\n\n***\n\n在企业环境中，只要你控制了应用程序，就可以有效地保护 RIAs。你需要密切管理应用程序打包，并在安全更新时做好准备。\n\
  \n***\n\n![图像](img/note.jpg) 注意事项\n\n为了更密切地管理 RIAs，你可以在用户机器上提供*部署规则*。对于胆弱的人来说，这个过程在\
  \ [`docs.oracle.com/javase/7/docs/technotes/jweb/deployment_rules.html`](http://docs.oracle.com)\
  \ 处有解释。\n\n## 9.5 杂项更改\n\n与上一章一样，本节描述了一些你可能会感兴趣或实用的小功能。\n\n### 9.5.1 将字符串转换为数字\n\
  \n在 JDK 1.7 之前，以下代码段的结果是什么？\n\n点击此处查看代码图像\n\n```\ndouble x = Double.parseDouble(\"\
  +1.0\");\nint n = Integer.parseInt(\"+1\");\n```\n\n如果你知道答案，请夸奖自己：`+1.0` 一直是一个有效的浮点数，但在\
  \ Java 7 之前，`+1` 并不是一个有效的整数。\n\n现在已经修复了所有从字符串构造 `int`、`long`、`short`、`byte` 和 `BigInteger`\
  \ 值的各种方法。这些比你想象的要多。除了 `parse`(`Int`|`Long`|`Short`|`Byte`) 外，还有处理十六进制和八进制输入的 `decode`\
  \ 方法，以及产生包装对象的 `valueOf` 方法。`BigInteger(String)` 构造函数也更新了。\n\n\n\n遗憾的是，该实例变量必须在某处进行初始化，如果在静态初始化代码中发生了其他日志记录，可能会导致死锁。因此，`Logger.global`\
  \ 在 Java 6 中被弃用了。相反，你本应该调用 `Logger.getLogger(Logger.GLOBAL_LOGGER_NAME)`，这并不是任何人认为的快速方便的日志记录方式。\n\
  \n在 Java 7 中，你可以改而调用 `Logger.getGlobal()`，这并不太糟糕。\n\n### 9.5.3. 空值检查\n\n`Objects`\
  \ 类提供了 `requireNonNull` 方法，用于方便地对参数进行空检查。这里是最简单的一个：\n\n点击此处查看代码图片\n\n```java\npublic\
  \ void process(String directions) {\n    this.directions = Objects.requireNonNull(directions);\n\
  \    ...\n}\n```\n\n如果 `directions` 为 `null`，则会抛出 `NullPointerException`，起初看起来并不是一个巨大的改进。但考虑从堆栈轨迹回溯的情况：当你看到\
  \ `requireNonNull` 的调用是罪魁祸首时，你立刻知道自己错在哪里了。\n\n你也可以为异常提供一个消息字符串：\n\n点击此处查看代码图片\n\n\
  ```java\nthis.directions = Objects.requireNonNull(directions,\n    \"directions\
  \ must not be null\");\n```\n\n### 9.5.4. ProcessBuilder\n\n在 Java 5 之前，`Runtime.exec`\
  \ 方法是从 Java 应用程序内部执行外部命令的唯一方法。Java 5 增加了 `ProcessBuilder` 类，它对生成的操作系统进程提供了了更强的控制。特别是，通过\
  \ `ProcessBuilder`，你可以更改工作目录。\n\nJava 7 增加了便利方法，可以将进程的标准输入、输出和错误流挂钩到文件上。例如，\n\n\
  点击此处查看代码图片\n\n```java\nProcessBuilder builder = new ProcessBuilder(\n    \"grep\"\
  , \"-o\", \"[A-Za-z_][A-Za-z_0-9]*\");\nbuilder.redirectInput(Paths.get(\"Hello.java\"\
  ).toFile());\nbuilder.redirectOutput(Paths.get(\"identifiers.txt\").toFile());\n\
  Process process = builder.start();\nprocess.waitFor();\n```\n\n***\n\n![Image](img/note.jpg)\
  \ 注意\n\n从 Java 8 开始，`Process` 类有了一个带超时的 `waitFor` 方法：\n\n点击此处查看代码图片\n\n```java\n\
  boolean completed = process.waitFor(1, TimeUnit.MINUTES);\n```\n\n***\n\nJava 7\
  \ 新增的还包括 `ProcessBuilder` 的 `inheritIO` 方法。它将进程的标准输入、输出和错误流设置为 Java 程序的流。例如，当你运行：\n\
  \n点击此处查看代码图片\n\n```java\nProcessBuilder builder = new ProcessBuilder(\"ls\", \"\
  -al\");\nbuilder.inheritIO();\nbuilder.start().waitFor();\n```\n\n那么 `ls` 命令的输出将发送到\
  \ `System.out`。\n\n### 9.5.5. URLClassLoader\n\n假设你想编写一个自动执行 JUnit 测试的 Java 程序。为了加载\
  \ `JUnitCore` 类，你需要一个读取 JUnit JAR 文件的类加载器：\n\n点击此处查看代码图片\n\n```java\nURL[] urls\
  \ = {\n    new URL(\"file:junit-4.11.jar\"),\n    new URL(\"file:hamcrest-core-1.3.jar\"\
  )\n};\nURLClassLoader loader = new URLClassLoader(urls);\nClass<?> klass = loader.loadClass(\"\
  org.junit.runner.JUnitCore\");\n```\n\n在 Java 7 之前，这样的代码可能会导致资源泄漏。Java 7 简单地增加了一个\
  \ `close` 方法来关闭类加载器。`URLClassLoader` 现在实现了 `AutoCloseable`，所以你可以使用 try-with-resources\
  \ 语句：\n\n点击此处查看代码图片\n\n```java\ntry (URLClassLoader loader = new URLClassLoader(urls))\
  \ {\n    Class<?> klass = loader.loadClass(\"org.junit.runner.JUnitCore\");\n  \
  \  ...\n}\n```\n\n***\n\n![Image](img/caution.jpg) 注意\n\n不要在类加载器关闭后使用任何类。如果你这样做这样做，并且这些类需要加载其他类来完成工作，它们将会失败。\n\
  \n***\n\n### 9.5.6. BitSet\n\n`BitSet` 是一个整数集合，实现为一个位序列。如果集合包含整数 $i$，则第 $i^{th}$\
  \ 位被设置为 1。这使得集合操作非常高效。并集/交集/补集只是简单的位或/与/非操作。\n\nJava 7 增加了构建位集的方法。\n\n点击此处查看代码图片\n\
  \n```java\nbyte[] bytes = { (byte) 0b10101100, (byte) 0b00101000 };\nBitSet primes\
  \ = BitSet.valueOf(bytes);\n// {2, 3}\n```\n\n\n\n\n`::` 运算符，在方法引用中，8\n\n`/` (斜杠)，在\
