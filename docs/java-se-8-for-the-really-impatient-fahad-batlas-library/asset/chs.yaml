  \ `f` 格式是用于浮点数的。在这种情况下，你可以通过调用 `Number` 函数来强制转换为 `java.lang.Double`：\n\n点击此处查看代码图片\n\
  \n```javascript\njava.lang.String.format('Unit price: %.2f', Number(price))\n```\n\
  \n## 7.7. 数组操作\n\n要构造 Java 数组，首先创建一个类，然后\n\n*(注：原文在 7.7 节后出现大量重复字符，此处翻译至原文可见逻辑结束)*\n\
  \n## 7.8. 列表与映射\n\nNashorn 为 Java 列表和映射提供了“语法糖”。你可以使用括号运算符对任何 Java `List` 来调用 `get`\
  \ 和 `set` 方法：\n\n```javascript\nvar names = java.util.Arrays.asList('Fred', 'Wilma',\
  \ 'Barney')\nvar first = names[0]\nnames[0] = 'Duke'\n```\n\n括号运算符也适用于 Java 映射：\n\
  \n```javascript\nvar scores = new java.util.HashMap()\nscores['Fred'] = 10 // 调用\
  \ scores.put('Fred', 10)\n```\n\n要访问映射中的所有元素，你可以使用 JavaScript 的 `for` 循环：\n\n```javascript\n\
  for (var key in scores) { ... }\nfor (var value in scores) { ... }\n```\n\n如果你想同时处理键和值，只需遍历条集：\n\
  \n```javascript\nfor (var e in scores.entrySet()) {\n    // 处理 e.key 和 e.value\n\
  }\n```\n\n## 7.9. Lambda 表达式\n\nJavaScript 有匿名函数，例如\n\n\n\n\n\n点击此处查看代码图像\n\n```javascript\n\
  var square = function(x) { return x * x }\n// 右侧是一个匿名函数\n\nvar result = square(2)\n\
  // `()` 运算符调用了该函数\n```\n\n在语法上，这种匿名函数与 Java 的 lambda 表达式非常相似。在参数列表后不是使用箭头，而是使用 `function`\
  \ 关键字。\n\n你可以将匿名函数作为 Java 方法的函数式接口参数，就像在 Java 中使用 lambda 表达式一样。例如：\n\n点击此处查看代码图像\n\
  \n```javascript\njava.util.Arrays.sort(words,\n   function(a, b) { return java.lang.Integer.compare(a.length,\
  \ b.length) })\n// 按长度递序排序数组\n```\n\nNashorn 支持对正体为单个表达式的函数进行简写。对于此类函数，你可以省略大括号和\
  \ `return` 关键字：\n\n点击此处查看代码图像\n\n```javascript\njava.util.Arrays.sort(words,\n \
  \  function(a, b) java.lang.Integer.compare(a.length, b.length))\n```\n\n再次注意它与\
  \ Java lambda 表达式 `(a, b) -> Integer.compare(a.length, b.length)` 的相似性。\n\n***\n\
  \n![Image](img/note.jpg) **注意** 这种简写符号（被称为“表达式闭包”）并不是 JavaScript 官方标准（ECMAScript\
  \ 5.1）的一部分，但 Mozilla 的 JavaScript 实现支持它。\n\n***\n\n## 7.10. 扩展 Java 类和实现 Java 接口\n\
  \n要扩展 Java 类或实现 Java 接口，请使用 `Java.extend` 函数。提供父类或接口的类对象，以及一个包含你想覆盖或实现的 JavaScript\
  \ 对象。\n\n例如，这是一个产生无限随机数序列的迭代器。我们重写两个方法：`next` 和 `hasNext`。对于每个方法，我们都提供了一个匿名 JavaScript\
  \ 函数作为实现：\n\n点击此处查看代码图像\n\n```javascript\nvar RandomIterator = Java.extend(java.util.Iterator,\
  \ {\n   next: function() Math.random(),\n   hasNext: function() true\n}) // RandomIterator\
  \ 是一个类对象\n\nvar iter = new RandomIterator() // 使用它来构造实例\n```\n\n***\n\n![Image](img/note.jpg)\
  \ **注意** 在调用 `Java.extend` 时，你可以指定任意数量的超接口以及父类。将所有类对象放置在实现方法的对象之前。\n\n***\n\n另一个\
  \ Nashorn 语法扩展允许你定义接口或抽象类的匿名子类。当 `new` `JavaClassObject` 后面跟着一个 JavaScript 对象时，将返回该扩展类的对象。例如：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar iter = new java.util.Iterator {\n   next: function()\
  \ Math.random(),\n   hasNext: function() true\n}\n```\n\n如果父类型是抽象的且只有一个抽象方法，你甚至不需要提供方法名。相反，像传递构造函数参数一样传递函数：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar task = new java.lang.Runnable(function() { print('Hello')\
  \ })\n// task 是实现 Runnable 的匿名类对象\n```\n\n***\n\n![Image](img/caution.jpg) **注意**\
  \ 在扩展具体类时，不能使用那种构造函数语法。例如，`new java.lang.Thread(function() { print('Hello') })`\
  \ 调用的是 `Thread` 构造函数，在这种情况下是 `Thread(Runnable)` 构造函数。对 `new` 的调用返回的是 `Thread` 类的对象，而不是\
  \ `Thread` 子类的对象。\n\n***\n\n如果你想在子类中使用实例变量，请将它们添加到 JavaScript 对象中。例如，这是一个产生十个随机数的迭代器：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar iter = new java.util.Iterator {\n   count: 10,\n\
  \   next: function() { this.count--; return Math.random() },\n   hasNext: function()\
  \ this.count > 0\n}\n```\n\n注意，JavaScript 方法 `next` 和 `hasNext` 通过 `this.count`\
  \ 引用实例变量。\n\n在重写方法时调用父类方法是可能的，但非常麻烦。`Java.super(obj)` 调用返回一个对象，可以通过该对象调用 `obj` 所属类的父类方法，但你必须拥有该对象。是一种实现该的方法：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar arr = new (Java.extend(java.util.ArrayList))\
  \ {\n   add: function(x) {\n      print('Adding ' + x);\n      Java.super(obj).add(x)\n\
  \   }\n}\n```\n\n\n\n\n它并不像管道（pipe）那么漂亮，但如果你需要，可以轻松实现一个管道——参见练习 6。\n\n## 7.12.2\
  \ 字符串插值\n\n`${...}` 内部的表达式会在双引号字符串和反引号字符串中被求值。这被称为“字符串插值”。例如，\n\n点击此处查看代码图片\n\n\
  ```\nvar cmd = \"javac -classpath ${classpath} ${mainclass}.java\"\n$EXEC(cmd)\n\
  ```\n\n或者简单的：\n\n点击此处查看代码图片\n\n```\n`javac -classpath ${classpath} ${mainclass}.java`\n\
  ```\n\n将变量 `classpath` 和 `mainclass` 的内容注入到命令中。\n\n你可以在 `${...}` 中使用任意表达式：\n\n点击此处查看代码图片\n\
  \n```javascript\nvar message = \"The current time is ${java.time.Instant.now()}\"\
  \n// 将 message 设置为类似 The current time is 2013-10-12T21:48:58.545Z 的字符串\n```\n\n\
  与 bash shell 一样，字符串插值在单引号字符串内部不起作用。\n\n点击此处查看代码图片\n\n```javascript\nvar message\
  \ = 'The current time is ${java.time.Instant.now()}'\n// 将 message 设置为 The current\
  \ time is ${java.time.Instant.now()}\n```\n\n字符串也会在“此处文档”（here documents）中进行插值——即脚本中的内联文档。当命令从标准输入读取多行，且脚本作者不想将输入放在单独的文件时，这些内联文档非常有用。例如，这里展示了如何向\
  \ GlassFish 管理工具传递命令：\n\n```bash\nname='myapp'\ndir='/opt/apps/myapp'\n$EXEC(\"\
  asadmin\", <<END)\nstart-domain\nstart-database\ndeploy ${name} ${dir}\nexit\nEND\n\
  ```\n\n`<<END` 结构意味着：“插入从下一行开始并以 `END` 行结束的字符串。”（除了 `END`，你可以使用任何未出现在字符串内部的标识符。）\n\
  \n注意应用程序的名称和位置是被插值的。\n\n字符串插值和此处文档仅在脚本模式下可用。\n\n## 7.12.3 脚本输入\n\n你可以为脚本提供命令行参数。由于在\
  \ `jjs` 命令行上可以包含多个脚本文件，你需要用 `--` 来分隔脚本文件和参数：\n\n点击此处查看代码图片\n\n```bash\njjs script1.js\
  \ script2.js -- arg1 arg2 arg3\n```\n\n![Image](img/note.jpg) 注意\n\n这看起来有点丑。如果你只有一个脚本文件，可以运行：\n\
  \n点击此处查看代码图片\n\n```bash\njrunscript -f script.js arg1 arg2 arg3\n```\n\n![Image](img/tip.jpg)\
  \ 提示\n\n脚本的第一行可以是“shebang”，即符号 `#!` 后面跟着脚本解释器的位置。例如，\n\n```bash\n#!/opt/java/bin/jjs\n\
  ```\n\n或者\n\n```bash\n#!/opt/java/bin/jrunscript -f\n```\n\n然后你就可以将脚本文件设置为可执行，并简单通过\
  \ `/script.js` 运行它。\n\n当脚本以 shebang 开时，脚本模式会自动激活。\n\n![Image](img/caution.jpg) 注意\n\
  \n如果你的脚本有参数，并且你在 shebang 中使用了 `jjs`，脚本用户将需要提供 `--`：`/script.js -- arg1 arg2 arg3`。用户不会因为这样而喜欢你。请改用\
  \ `jrunscript`。\n\n在脚本文件中，你通过 `arguments` 数组接收命令行参数：\n\n点击此处查看代码图片\n\n```javascript\n\
  var deployCommand = \"deploy ${arguments[0]} ${arguments[1]}\"\n```\n\n使用 `jjs`（但不用\
  \ `jrunscript`），你可以使用 `$ARG` 代替 `arguments`。如果你在字符串插值中使用该变量，需要两个美元符号：\n\n点击此处查看代码图片\n\
  \n```javascript\nvar deployCommand = \"deploy ${$ARG[0]} ${$ARG[1]}\"\n```\n\n在你的脚本中，你可以通过\
  \ `ENV` 对象获取 shell 的环境变量：\n\n点击此处查看代码图片\n\n```javascript\nvar javaHome = $ENV.JAVA_HOME\n\
  ```\n\n在脚本模式下，你可以使用 `readLine` 函数提示用户输入：\n\n点击此处查看代码图片\n\n```javascript\nvar username\
  \ = readLine('Username: ')\n```\n\n![Image](img/caution.jpg) 注意\n\n要提示密码，请调用\n\n\
  点击此处查看代码图片\n\n```javascript\nvar password = java.lang.System.console().readPassword()\n\
  ```\n\n最后，退出脚本时使用 `exit` 函数。你可以提供可选的代码。\n\n```javascript\nif (username.length ==\
  \ 0) exit(1)\n```\n\n## 7.13 Nashorn 和 JavaFX\n\nNashorn 提供了一种启动 Java 应用程序的便捷方法。使用\
  \ `-fx` 选项，你甚至不需要子类 `Application`。例如，这里是：\n\n```javascript\nvar message = new javafx.scene.control.Label(\"\
  Hello!\");\nmessage.font = new javafx.scene.text.Font(100);\n$STAGE.scene = new\
  \ javafx.scene.Scene(message);\n$STAGE.title = \"Hello\";\n```\n\n运行脚本：\n\n```bash\n\
  jjs -fx myJavaApp.js\n```\n\n这些就是全部。显示一个 100 点字号的“Hello!”标签——参见图 7–1。\n\n现在让我们看看事件处理。正如你在第\
  \ 4 章所示，大多数 FX 事件都是通过属性的监听器处理的。记住，一个 FX 属性有两个监听接口：`InvalidationListener` 和 `ChangeListener`，都通过\
  \ `addListener` 方法添加。在 Java 中，你可以带 lambda 表达式调用 `addListener`编译器能够根据参数类型判断是哪一个。但在\
  \ JavaScript 中，函数参数没有类型。假设我们有一个滑块来控制字体大小。我们想添加一个在滑块值变化时更新大小的监听器：\n\n点击此处查看代码图片\n\
  \n```javascript\nslider.valueProperty().addListener(function(property)\n    message.font\
  \ = new Font(slider.value)) // 错误——Nashorn 无法确定添加哪种监听器类型\n```\n\n这不起作用。Nashorn 不知道你想添加\
  \ `InvalidationListener` 还是 `ChangeListener`，它也不知道你其实不在乎。\n\n要修复这个问题，你需要做出选择：\n\n\
  ```javascript\nslider.valueProperty().addListener(\n    new javafx.beans.InvalidationListener(function(property)\n\
  \        message.font = new Font(slider.value)))\n```\n\n这比 Java 的等效实现要重得多——不是人们在轻量级脚本语言中希望看到的。对于这一点，没有人可以怪罪。JavaFX\
  \ 设计者做出了重载 `addListener` 方法的决定，这在 Java 7 的背景下是完全合理的，并且与 Java 8 lambda 表达式大部分兼容。脚本语言的兼容性可能不是他们关注的问题，特别是他们刚刚放弃了另一种脚本语言。\n\
  \n\n\n但这应该是一个警示。当你设计 Java API 时，请记住阿特伍德法则（Atwood’s law）：“任何可以用 JavaScript 编写的应用最终都会用\
  \ JavaScript 编写。”设计你的 API，使其能够从 JavaScript 优雅地访问。\n\nNashorn 对 JavaFX 的支持还有另一个悲伤的方面。回想在\
  \ JavaFX Script 的年代，可以这样轻松地描述场景的布局：\n\n点击此处查看代码图像\n\n```java\nFrame {\n    title:\
  \ \"Hello\"\n    content: Label {\n        text: \"Hello, World!\"\n    }\n}\n```\n\
  \n这看起来难道不像像 JavaScript 吗？好吧，Nashorn/JavaFX 的开发者们，拆掉那道墙，把它变成 JavaScript 吧！这样我们就可以用\
  \ JavaScript 同时编写 UI 布局和事件处理，阿特伍德法则也就实现了。\n\n## 练习\n\n**1.** 选择一些你想要探索的 Java API\
  \ 部分——例如，`ZonedDateTime` 类。在 `jjs` 中运行一些实验：构建对象、调用方法并观察返回值。你觉得这比在 Java 中编写测试程序容易吗？\n\
  \n**2.** 运行 `jjs` 并使用流库交互式地解决以下问题：按排序顺序打印文件中所有唯一的长单词（大于 12 个字符）。首先读取单词，然后过滤出长单词，以此此类推。这种交互式方法与你通常的工作流相比如何？\n\
  \n**3.** 运行 `jjs`。调用\n\n点击此处查看代码图像\n\n```javascript\nvar b = new java.math.BigInteger('1234567890987654321')\n\
  ```\n\n然后显示 `b`（只需输入 `b` 并按回车）。你得到了什么？`b.mod(java.math.BigInteger.TEN)` 的值是多少？为什么\
  \ `b` 的显示得如此奇怪？你该如何显示 `b` 的实际值？\n\n**4.** 通过从另一个字符串中提取子字符串来构造非字面量的 JavaScript 字符串，并调用\
  \ `getClass()` 方法。你得到了什么类？然后将该对象传递给 `java.lang.String.class.cast`。发生了什么？为什么？\n\n\
  **5.** 在 第 7.10 节 位于第 [146] 页的“扩展 Java 类和实现 Java 接口”末尾，你看到了如何扩展 `ArrayList` 以使得每次调用\
  \ `add()` 都被记录。但这只对单个对象有效。编写一个 JavaScript 函数作为此类对象的工厂，这样就可以生成任意数量的日志列表。\n\n**6.**\
