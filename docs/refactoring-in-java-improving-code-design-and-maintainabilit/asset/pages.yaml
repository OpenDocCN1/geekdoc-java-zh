  md: 'GitFlow is a bit hard to understand at first. On the MAIN branch, we have the
    stable version, and on the DEVELOP branch, we have the “next” version. Each FEATURE
    branch hosts a specific feature that is being developed:


    ![](img/413a83eb121d9ef596d0d310811a5be2_192_0.png)


    Figure 8.10 – GitFlow schema


    Here’s the detailed workflow:


    +   1. Start working on a branch called develop. Use this branch for your current
    development; this branch must be created from the main branch.

    2. Then, when you begin working on something new (or on a bug fix), create feature
    branches; these must be created starting from the develop branch.

    3. When you’ve finished working on your feature, merge your feature branch into
    develop.

    4. When it’s time to prepare for a new release, create a release branch from the
    develop branch. Assign a clear and descriptive name, incorporating the version
    number, such as “release/1.0.” Test it deeply to identify and address any bugs,
    ensuring its readiness for production.

    5. When the release is ready, combine it with the main part and mark it with a
    version number. Use a pull request to have the code checked and approved by other
    team members.

    6. Start over again. Once the release is done, go back to the develop branch and
    start over with a new feature branch.


    Some critical problems may arise due to something that is in the main branch;
    in this case, we want to follow a faster procedure, and not risk deploying the
    feature we’re still developing.'
