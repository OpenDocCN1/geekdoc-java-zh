    But let''s start slowly, trying to agree on what we mean by the term that gives
    the title to this book.


    In this chapter, we''ll cover these topics:


    +   - What do we mean by refactoring?

    - Why you should consider refactoring

    - When you should refactor

    - What you should refactor


    # What do we mean by refactoring?


    If we give a strict definition of refactoring, we could be in some trouble, because
    it is often interpreted in different ways. The most common meaning, is related
    to code rewriting. Refactoring is the process of restructuring and improving existing
    code without changing its behavior. Code is rewritten so that it is easier to
    understand and easier to modify.


    We could also give a "recursive" definition of refactoring: a series of refactorings
    applied to the software without changing its behavior.


    Let me highlight this again because it''s very important: the software will return
    the very same results as before, and no less. It will just written differently.
    The main (maybe the only) target you have to achieve is to make your code easier
    to understand, and this is one of the most important yet most difficult tasks
    to accomplish.


    Refactoring could also be bounded with another couple of concepts.


    It can be viewed as a way of iteratively improving the design of a software system.
    As the system evolves, its design can degrade and become outdated, leading to
    issues as increased complexity, reduced maintainability, and reduced flexibility.
    Refactoring helps address these issues by making incremental changes to the system,
    improving its overall quality and maintainability. Moreover, refactoring can be
    used as a technique for discovering the underlying design of a system. By identifying
    patterns and commonalities in the code, developers can gain insights into the
    design of the system and identify areas for improvement. We''ll deepen this concept
    in the following paragraph.


    # Refactoring and clean code


    Refactoring is also closely tied to the concept of clean code. We''ll go into
    the details in the next chapter, but we can briefly say that code needs is easy
    to read, understand, and maintain. Refactoring is one of the primary ways in which
    developers can ensure that their code remains clean. By continuously improving
    the design of their code through refactoring, developers can eliminate code smells
    (a code smell is a sign of a potential problem in the source code – we''ll deep
    dive into'
