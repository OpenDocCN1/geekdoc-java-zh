    # # The builder pattern


    A builder is a design pattern commonly used in object-oriented programming to
    construct complex objects by step. It provides a flexible and readable way to
    create objects with multiple optional parameters or configurations. The builder
    pattern separates the construction of an object from its representation, allowing
    the same construction process to create different representations of the object.
    It provides a clear and intuitive API for constructing objects by providing methods
    to set values for various properties or parameters. Typically, a builder class
    is created for each object, and it contains methods to set individual properties
    or configurations of the object. The builder accumulates these settings and finally
    constructs the object when requested. This approach allows for more readable and
    maintainable code, especially when dealing with objects that have many optional
    parameters or configurations. It promotes the idea of fluent or chainable method
    calls,'
