  md: 'details are hidden in the methods beneath the composed method; this allows
    us to read our logic, code, at a high level – I dare say, “in prose.”


    When refactoring your code, the process typically involves extracting code from
    the original method. If you find it challenging to come up with meaningful names
    for the extracted methods, it''s a clear sign that the chunk you were to extract
    may be too extensive. Another case I''ve come across is when (myself) suggested
    naming a method that contained the conjunctions “and” or “or...” also in this
    situation, it''s clear the method we are working on has too many responsibilities
    and is doing too many things. In such cases, try to identify a smaller, more focused
    portion for extraction. Often, in longer methods, you may notice that certain
    sections are already marked with the same class; these labeled sections can be
    refactored into new methods.


    You might find yourself after applying this technique, having many methods within
    the same class; in this, it is already an improvement. However, it might be desirable
    to further shorten the class by extracting a dedicated method.


    Here are some guidelines you can follow when how to compose methods:


    +   **The shorter, the better:** Lean toward brevity and conciseness in your code.
    Smaller functions and code blocks are generally preferred, as they enhance readability
    and maintainability.


    +   **Minimize redundancy:** When employing the composing pattern, pay close attention
    to eliminating duplicate code fragments. This practice not only trims down your
    code base also prevents inconsistencies and simplifies future updates.


    +   **Show your purpose:** To foster code clarity and adopt a naming convention
    that leaves no room for ambiguity. Every variable, and method should be named
    in a way that succinctly conveys its role and function.


    +   **Strive for simplification:** Simplification is a guiding principle in code
    improvement. The removal of unnecessary complexities, streamlining logic, and
    adhering to best practices. Simplified code is not only more elegant but also
    more maintainable.


    +   **Maintain consistent detail levels:** When applying the composing pattern,
    it''s essential to harmonize the complexity level of the methods you call. Avoid
    mixing simple, straightforward getters with functions that perform resource-intensive
    computations. Consistency in detail levels fosters fosters comprehension.


    There are many ways to achieve these goals; next, we will see some of them.


