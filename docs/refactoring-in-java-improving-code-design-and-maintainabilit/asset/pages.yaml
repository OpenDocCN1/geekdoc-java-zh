  md: '# 5


    # Refactoring Techniques


    We''re now getting into the meat of the subject: how to do refactoring. It would
    be a bit silly to focus cram all the refactoring techniques ever known into one
    chapter. So, we''ve decided to focus on the most common and more interesting ones.
    Our main source of wisdom comes from Martin Fowler''s fantastic work in his book,
    Refactoring: Improving the Design of Existing Code. He teamed up with Kent Beck
    to explain, step by step, how to do refactoring, from the simplest to the trickiest
    cases. For each one, we provide a kind of how-guide so that you won''t miss things
    upon. Here, we''re offering a selection of the most important refactoring techniques,
    an importance that we consider largely on our own experience.


    # TIP


    For those who don''t know, Martin Fowler and Kent Beck are influential figures
    in software development. Martin Fowler is known for his contributions to software
    design, refactoring, and agile methodologies, while Kent Beck is the creator of
    Extreme Programming (XP) and the JUnit testing framework. Both have a significant
    impact on shaping agile practices and improving software development processes.


    We''ve tried to simplify every more Fowler wrote and sprinkle in a bit of our
    own work background. If you haven''t already, we suggest you read the chapter
    on code smells (Chapter 3 before you dive into this.


    In this chapter, we''ll cover the following:


    +   * Techniques for making well-structured methods


    +   * Moving features from one object to another


    +   * Making your data more organized


    +   * Simplifying those tricky if-else blocks


    +   * Cleaning up your method calls


    +   * Some tips on using generalization


    +   * A nudge to use them when they make sense


    But let''s cut to the chase, starting with the basics: composing methods.


    # Writing better methods


    Composing methods is a fundamental skill that should be a part of every developer''s
    refactoring toolkit. To put it simply, almost bluntly, it''s about breaking your
    code into smaller pieces, each of which just does one thing in a very readable
    way, in a very procedural manner; you could almost think of it as a recipe (please
    forgive me; I''m Italian, so I always bring everything back to food). The'
