    # Use simple sources of truth for data and logic


    Last piece of advice: use a single source of truth for data and a single source
    of truth for logic. I might admit that the concepts of a single source of truth
    are often straightforward to explain but less easy to implement.


    Let me illustrate what I have in mind with an example. Once again, let''s imagining
    a flight search system. Typically, the data can be divided into primary and derived
    data. Primary data is essentially the information without our system couldn''t
    find, while derived data refers to all the other information. In our flight search
    example, let''s say we need to provide, other details, of a trip from Milan to
    San Francisco. The trip consists of two flights: one from Milan to Copenhagen
    and another from Copenhagen to San Francisco. In this example, we can consider
    the departure and arrival times of each individual flight as primary data. From
    this, we can derive information about the duration of the trip and potentially
    the duration of the lay. Managing derived data as primary data, by storing it
    in the database, could lead to inconsistencies. Especially when delivering from
    a large volume of data – or when the complexity is complex or involves some external
    system – the computational cost of such calculations could be high. I would advise
    you to exercise caution and implementing a mechanism called lazy calculation.
    Essentially, this approach involves calculating the derived data only when it
    is needed, rather than in advance, and saving it in a cache so it is readily available
    for future use. In our flight example, we would calculate the journey duration
    using the flight''s departure and arrival times (we have also to consider the
    airport locations and their time zones) without storing it in a database, but
    at most in a short-term cache or something like that. If we stored in a database,
    we would have to recalculate it every the flight departure/arrival times change
    (in industry jargon), every time there is a “schedule change” and we might get
    inconsistencies.


    Just having a single source of truth is a good practice, having a single source
    of logic is also beneficial. In the aforementioned case, for instance, we need
    to calculate the duration of a flight from Milan to San Francisco. While it may
    not be rocket science, it''s not a trivial calculation either, as it involves
    different times and the so-called daylight saving time. It is one of things that
    is easy to underestimate and, more easily than you might think, lead to bugs in
    production (and there are many flight search websites that have this bug in production
    at the moment I''m writing). In this case, it is very helpful to write the function
    once, thoroughly test it, and then consistently use it throughout our code base.
    This way, we do not stray from the old principle of Don’t Repeat Yourself (DRY).
    In this case, you could write a library, a service, or just a class in your project
    that deals with the journey duration and every time you need it.


    # Good code is modular'
