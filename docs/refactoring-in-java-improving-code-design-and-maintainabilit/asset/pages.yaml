- img_proc: true
  md: 'these events, one or more components will be listening and responding to the
    event itself. But let''s try to be a bit more formal in our definition.


    An event refers to a change in state or more expansively, any observable occurrence
    that can be detected and documented by an application or device. These events
    can then be communicated and exchanged with other applications and devices. Within
    your enterprise, every incident—be it customer requests, updates in inventory,
    sensor readings, and the like—constitutes an event.


    An event-driven architecture is a way for decoupled services to talk to each other
    using events, which are like little messages about changes or updates. This is
    a pretty common approach in modern apps with microservices.


    In this setup, there are three main parts:


    +   1. Event producers: These are the creators of events and publish them to the
    router; for example, "a purchase is completed."


    +   2. Event routers or brokers: These are the organizers who decide where each
    event should go. For example, you can imagine something like "a completed purchase
    should result in sending an email to the customer."


    +   3. Event consumers: These are the parts of the system that want to know about
    certain events; for example, a component that receives some data about a completed
    purchase and reacts by sending an email to the customer.


    The cool thing is these different parts don''t have to know too much about each
    other. They just send out these little event messages, and the other parts choose
    to listen and react or not. In our examples, the component that completes the
    purchase doesn''t know what will happen next; it publishes an event. The consumer,
    who is in charge of sending an email, doesn''t have to know anything about the
    purchase completion process. This makes things flexible because, for instance,
    you can update the payment system works without messing up the mailing system
    works. They are like separate teams that can do their own thing without checking
    with each other. They can often translate into two different teams more or less
    separately.


    Sometimes an event can also be referred as a message; the terms are often interchangeable.
    A bit more specific is the concept of a command: unlike an event that defines
    a change of state in some data or entity within the domain, a command explicitly
    requires something to be done. The implicit aspect is that in this case, the one
    carrying out the action and publishing the event is aware of something that is
    supposed to happen afterward. Technologically, however, almost nothing changes.


