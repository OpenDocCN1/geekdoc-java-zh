  md: '# Naming conventions


    Naming conventions play a vital role in enhancing program comprehension and improving
    code readability. They serve as a set of guidelines that, when followed, make
    code more accessible and easier to grasp. These conventions not only contribute
    to readability but also convey essential information about the purpose of an identifier.
    This additional context helps developers understand the role of the identifier,
    whether it represents a constant, package, class, or other entity within the code.
    These conventions are essential for effective code communication and can significantly
    aid in the comprehension and maintenance of software systems.


    Both Google''s and Oracle''s conventions define in-depth rules for naming the
    various components and they have many touchpoints:


    +   - Google''s style guide specifies identifiers that are made of ASCII letters
    and digits, and occasionally, underscores, as specified by the we expression.
    Special prefixes or suffixes such as `model_`, `cModel`, and `c_name` are not
    used in identifiers.


    +   - Class and interface names are usually in UpperCase, which means the first
    letter of each word is capitalized. Class names are typically related to things
    and are usually nouns, such as Student or ImmutableList. Interface names can also
    be nouns or noun phrases, as as Set, or they might sometimes be adjective phrases,
    as Serializable. When it comes to naming annotation, there aren''t specific rules
    or widely accepted conventions. Google''s style guide also specifies that for
    test classes, names end with Test. If a test class covers a single class, it takes
    the name of that class and adds Test to the end.


    +   - Method names are usually written in lowerCamel, where the first letter is
    lowercase and subsequent words are capitalized, such as sendMessage or stop. Method
    names are typically related to actions or what the method does, and they are like
    verbs or phrases, such as sendNotification or initialize. Google''s style guide
    also specifies that method names in the Unit test help separate different parts
    of the name. Each part is written in lowerCase - for example, publishTranslateUserLanguage.
    There is not a single correct way to name test methods, so you have some flexibility.


    +   - Constant names follow UPPER_SNAKE_CASE, meaning they are written in all
    uppercase letters with words separated by an underscore. Constants are not unchanging
    values in your code. They are represented as static final fields, which means
    they never change once they are set. Constants are deeply immutable, meaning they
    can''t be modified in any way, and they don''t have methods that cause any noticeable
    side effects. Examples of constants include simple data types such as numbers,
    text (strings), unchanging value types, and even sets to null. But here the key
    is: if anything about this value can change or be observed differently over time,
    it''s not a constant (you could have guessed that).


    +   - Parameter names are typically written in lowerCamelCase, where the first
    letter is lowercase, and subsequent words are capitalized. When it comes to naming
    parameters in public methods,'
