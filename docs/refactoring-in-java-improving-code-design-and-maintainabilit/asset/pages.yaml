    # # Technical documentation


    Technical documentation covers a lot of stuff, and it even includes architectural
    documentation. But in this case, I wanted to point out the nitty-gritty details,
    such as code, modules, APIs, microservices, and other low-level stuff. It''s way
    more detailed than what you''d usually find in architectural documentation.


    Documentation can come in various shapes and sizes, ranging from elaborate design
    documents to straightforward README files. The choice of format depends on the
    specific product, system, or service being described. Regardless of the form,
    the primary goal of technical documentation is to assist developers in resolving
    issues without requiring them to undertake additional research.


    Even if it is disregarded, technical documentation is crucial; unfortunately,
    it''s also very hard to do and very time-consuming. It''s the very first thing
    that is ignored when your time runs out. "We''ll do it" and never will. So, our
    suggestion here is to include the writing of the documentation in your daily work;
    in other words, in your software development life cycle. For example, you could
    agree on a "definition of done" (a checklist or set of criteria that determines
    when a task or project is completed and meets the required quality standards)
    that includes documentation.


    There are various types of documentation you should take care of.


    +   - **SDK documentation:** SDK documentation provides instructions for integrating
    new software into an existing application. It covers software usage, capabilities,
    and interactions with other applications, making it essential for developers to
    enhance app features.

    - **Source code documentation:** Source code documentation includes examples to
    guide developers in software usage. Focus on explaining necessary parts rather
    than everything in the code.

    - **Release notes:** Release notes are technical documents detailing changes in
    a new product release, such as new features, bug fixes, and known issues. Developers
    and testers use this to grasp what''s new.

    - **Knowledge base documentation:** This document houses knowledge that developers
    use for software development and maintenance. It covers tools, languages, methods,
    design principles, how-to guides, troubleshooting, and FAQs, fostering knowledge
    sharing and efficiency in software development.'
