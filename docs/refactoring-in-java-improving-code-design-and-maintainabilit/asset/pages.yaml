  md: '# # Preface


    In a time it seems there is no other topic but artificial intelligence, it may
    seem strange to write a book that gathers the key practices for writing good,
    maintainable, and, in a world, clean code. As I write this, tools are becoming
    well-known – perhaps they are already well-known – that assist the developer and
    help write code, suggesting how to complete the line of code they are writing
    or writing some short methods. Opinions at the moment are very polarized, between
    who fear becoming obsolete in a few weeks and those who believe their natural
    intelligence is superior to any artificial intelligence.


    As often happens, we will probably find ourselves in the middle. While it’s true
    that AI can assist us in, very specific tasks, analyzing small portions of code
    around the line we are writing and completing the work for, there is still quite
    some time to write all the code that is, scalable, maintainable, and expandable,
    without bugs – if that moment arrives, by the way. Writing good code involves
    making decisions that go beyond syntax and involve understanding the specific
    requirements and nuances of a problem, which no AI can assist.


    Well-written code is clear, readable, and easy to understand. This is crucial
    for collaboration in a team, as other developers (or even yourself in the future)
    need to comprehend and modify the code. AI can assist in generating code, but
    it might not always produce code that is easy to maintain.


    Bugs are inevitable in software development. Writing clean and well-organized
    code can significantly increase the cost of debugging. Clear code is easier to
    navigate, making it simpler to identify and fix issues. AI tools can help with
    debugging, but they may not catch every type of error or understand the specific
    logic of your code as well as a human can.


    The technical skills of a programmer are still very important and will be for
    a long time; writing clean code and refactoring one’s codebase are pivotal qualities,
    that will make us better and more valuable professionals.


    # ## Who this book is for


    This book is primarily for those who write code; we believe it is particularly
    useful for those who have been doing it for a short time, even experienced professionals
    forget how to do things – or perhaps the context doesn’t allow for alternative
    approaches. We bring no secrets, no magic formula, just a compendium of the main
    techniques and tricks for refactoring your code, writing clean code, and above
    all, understanding if something is wrong and fixing it. We also try to avoid ending
    up in unpleasant situations with small adjustments to implement every day. All
    in one book.


    Our job is very complex, more than it seems, and this complexity is challenging
    to convey to those who don’t speak ours; there are many aspects to consider, and
    there are several variables at play, both technical and not. Even after the end
    of a course of study, one often begins to face the world of work having to learn
    many other new things.'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'This is a book that I would have wanted when I started my career: a sort of
    map of a very vast and, for many, still unexplored territory.


    # What this book covers


    +   Chapter 1, What is Refactoring?, starts with the fundamental concepts, explaining
    what is meant by refactoring and why it is important. Faced with many possible
    opportunities for refactoring, let''s learn how to give each opportunity the right
    importance, i.e., which one to refactor first. Also understand when it is not
    necessary to refactor.


    +   Chapter 2, Good Coding Habits, covers the topic of writing high-quality code
    by day-to-day habits. What is good code? What is bad code? We will delve into
    this and briefly explore the concept of clean code. We will about the SOLID principles
    of software design, and also about the importance of (not using) side effects
    and mutability and common causes of bad code.


    +   Chapter 3, Code Smells, is about the most frequent "red flags" that you can
    step into going through your code; those flags should immediately catch the eye
    of a professional. Recognizing them (and avoiding them) is a crucial part of our
    skills.


    +   Chapter 4, Testing, is about the importance of the testing phase. Why is it
    important and why do you have to test as often as you can? We will learn unit
    testing and how we can be sure that our codebase is covered by tests. We go into
    Test Driven Development.


    +   Chapter 5, Refactoring Techniques, is an overview of the most "tricks" that
    we can adopt to get rid of the code smells in Chapter 3. We will learn to write
    better methods and move code when necessary; we''ll organize data and simplify
    both conditional logic and method calls. We''ll also discuss generalization.


    +   Chapter 6, Metaprogramming, is about... not writing code! In other terms,
    we can use well-tested and well-grounded frameworks and libraries to write the
    code for us, avoiding reinventing the wheel.


    +   Chapter 7, Static and Dynamic Analysis, talks about how we can be sure we''re
    on the right path. The chapter delves into the concept of code analysis and program
    analysis, also exploring some tools that can be very useful in understanding how
    far we are from the quality threshold we want to set.


    +   Chapter 8, Crafting Quality, tells us about the small and big actions that
    we can put in our day-to-day work routine. From code versioning to code formatting,
    from code reviews to pair programming, we can incorporate a lot of small effort
    to keep our codebase clean and maintainable.


    +   Chapter 9, Mastering Software Architecture, lifts our gaze and talks about
    the architecture of a software project. It explains what architecture is and what
    it is made of; it tells us about the main architectural patterns. Just as we do
    for individual pieces of code, we discussed which are the main architectural red
    flags to avoid.


    # To get the most out of this book'
