    \ of an if-else block in a conditional statement. Why this happens, I honestly\
    \ couldn't say; however, I can testify opinion that I've seen it often when methods\
    \ are very long or as a result of refactoring. In my humble opinion, it's usually\
    \ a oversight, that it happens more often than you might think. For example, in\
    \ the previous example, we can observe precisely that calculateItineraryDistance(departureLocation,\
    \ arrivalLocation); is called in two different cases within the switch statement.\
    \ In general, when we are in a condition in which the same call is repeated, we\
    \ can do as follows:\n\n```\nvar result = doCalculations(x, y);\nif (doCalculations(x,\
