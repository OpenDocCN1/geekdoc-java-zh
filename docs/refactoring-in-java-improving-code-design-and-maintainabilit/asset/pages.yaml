  md: '![](img/413a83eb121d9ef596d0d310811a5be2_231_0.png)


    # Figure 9.3 – Event-driven architecture


    There are several advantages to embracing an event-driven architecture:


    +   - The first is probably **independent scaling and fault isolation**: by adopting
    an event-driven architecture, the ability to scale and manage faults independently
    becomes a key benefit. As already mentioned, there are also benefits of microservices.
    Through the decoupling of services, each service interacts solely with the event
    router, rendering them agnostic to the existence of other services. Consequently,
    in the event of a failure the rest can continue to function seamlessly. The event
    router serves as an elastic buffer, adept at handling surges in workloads and
    ensuring overall system stability.


    +   - The **development is more agile** because the event-driven model eliminates
    the need for custom code to poll, and route events. Instead, the event router
    manages these tasks, automatically filtering and pushing events to consumers.
    This streamlined process significantly accelerates development cycles by minimizing
    the heavy coordination traditionally required between producer and consumer services.
    Developers can focus more on implementing business logic than dealing with event-handling
    intricacies..


    +   - When you have an event router acting as a centralized hub for auditing applications
    and establishing policies, you get **effortless auditing**. These policies limit
    who can publish and subscribe to the router and specifying permissions for users
    and resources to access data. Additionally, the event router facilitates the encryption
    of events both during transit and at rest, enhancing data security measures.


    +   - You usually have some **cost reductions**: event-driven architectures operate
    on a push-based model, triggering actions only when an event is present in the
    router. This contrasts with continuous polling, reduced network bandwidth consumption,
    lower CPU utilization, decreased idle fleet capacity, fewer SSL/TLS handshakes.
    The result is a more cost-effective system that maximizes resource efficiency
    by minimizing unnecessary operations, providing both economic and operational
    benefits.'
