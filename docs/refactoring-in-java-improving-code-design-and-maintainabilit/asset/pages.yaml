  md: '# 1


    # # What is Refactoring?


    Picture this. It''s your first day at a new job, and you''re filled with excitement
    and eager to showcase your skills. Your new colleagues are enjoyable to be around,
    the company seems fine, and you''re itching to get started. Your "onboarding buddy"
    showing you the project that you''ll be working for the next several months or
    years. The concepts behind it are promising, and the business itself is stable.
    However, the code base is an excessive, chaotic mess—like a smoking, tangled plate
    of spaghetti. Well perhaps you don''t need to imagine it. It''s likely you''ve
    been in that situation before. Maybe you''re even experiencing it now.


    As soon as you open your IDE, you''re faced with a plethora of modules with very
    similar names. Once you enter a module, you''re met with a daunting number of
    classes, some of which run hundreds of lines. These classes often house methods
    with vague names like "manageThis" or "processThat," and they tend to be burdened
    with an excessive number of parameters. Suffice to say, this isn''t the conducive
    environment for growing the inner workings of your project. Brace yourself for
    a few challenging weeks—or months—of work, the code base and architecture of the
    project are far from optimal. Lack of documentation or poor commenting can make
    things even more challenging when dealing with code issues. However if the code
    itself is well written and follows good architecture practices, it can compensate
    for the lack of documentation (which is definitely not something desirable) and
    minimize the need for excessive comments (we''ll delve into this in book).


    Let me be clear: it''s not about blaming. Every one of us — and by "us," I mean
    a large group of people I call "Software Development Community”—has a slightly
    different way of solving the very same problem. And everyone, at least once in
    their life, you thought "I would do it better." But again, every one of us knows—or
    will know—that''s a lot of circumstances. If a particular module or piece of code
    was completed quickly or poorly, it is because someone requested it to be completed
    quickly. Sometimes, we come into situations where contradictory requirements are
    due or when priorities change due to internal or external events that take place.
    This may have been made due to a valid business reason, a critical security concern,
    or any other reason that they deemed important. No one (almost) mostly works poorly.
    It''s a matter of circumstances. We''ve all felt pressure.


    The techniques and concepts that fall under the broad umbrella of "refactoring"
    help prevent you from ending up in that, ensuring that your code doesn''t become
    that place of spaghetti. These techniques, and, more importantly, the mindset
    associated with refactoring, can also assist you in improving the code base, gracefully
    navigating the swamp you find yourself in, without feeling overwhelmed. In this
    chapter, we will explore the meaning of refactoring and, in reality, how elusive
    it can be. I will try to narrate, also based on my experience, the motivations
    behind refactoring—motivations that will probably be familiar to you. I will then
    give you some advice on'
  merge: -1
