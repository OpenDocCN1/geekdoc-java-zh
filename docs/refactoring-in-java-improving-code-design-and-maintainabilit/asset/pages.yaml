    \ do the magic:\n\n```\n@Mapper\npublic interface PersonMapper {\n    PersonMapper\
    \ INSTANCE = Mappers.getMapper(PersonMapper.class);\n    @Mapping(source=\"name\"\
    , target=\"username\")\n    Person personDtoToPerson(PersonDto personDto);\n}\n\
    ```\n\nThe presence of the @Mapper annotation designates the interface as a mapping\
    \ interface and triggers the MapStruct processor to engage during the compilation\
    \ process. In the mapping method itself, you can freely select its name, and it\
    \ should accept the source object as a parameter returning the target object.\n\
    \nTo handle attributes with distinct names in the source and target objects, you\
    \ can employ the @Mapping annotation to specify the desired configuration. When\
    \ necessary and feasible, type conversions will be carried out for attributes\
    \ with differing types in the source and target objects. For an enumeration, imputation\
    \ may be transformed into a string.\n\nIt's worth noting that a single interface\
    \ can handle multiple mapping methods, each of which will have an implementation\
    \ auto-generated by MapStruct. You can obtain an instance of the interface's implementation\
    \ through the Mappers class. As convention, the interface includes a member named\
    \ INSTANCE, offering clients a means to access the mapping implementation.\n\n\
    You might have noticed that we're missing the mapping from birthdate to age; this\
    \ cannot be done automatically by MapStruct a little bit of logic is involved\
    \ (to calculate the current age from the birth date). In any case, if we need\
    \ it - we can implement specific mappings; also, in this case, the method names\
    \ are not important since MapStruct will choose the right one based on the parameter\
    \ and return types:\n\n```\n@Mapper\npublic interface PersonMapper {\n    PersonMapper\
    \ INSTANCE = Mappers.getMapper(PersonMapper.class);\n    @Mapping(source=\"name\"\
    , target=\"username\")\n    @Mapping(source=\"birthdate\", target=\"age\")\n \
    \   Person personDtoToPerson(PersonDto personDto);\n    default Integer calculateCurrentAge(LocalDate\
    \ birthDate) {\n        return Period.between(birthDate, LocalDate.now()).getYYears();\n\
    \    }\n}\n```\n\nIn the auto-generated implementation of the method, MapStruct\
