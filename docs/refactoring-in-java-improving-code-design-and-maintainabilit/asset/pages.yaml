  md: '![](img/413a83eb121d9ef596d0d310811a5be2_67_0.png)


    Figure 2.3 – The project management triangle


    It''s like an equilateral triangle with sides representing the **Scope**, **Cost**,
    and **Time** of a project. These three dimensions are interconnected, and changing
    one of them will affect the overall shape of the triangle, which represents the
    quality. Furthermore, since the triangle needs to remain equilateral, it is clear
    that modifying the available time will decrease the cost, and vice versa. By extending
    the time available, you can increase the project scope, but the costs will also
    go up accordingly. It''s a neat metaphor for how projects, including software
    projects, work.


    # # The Broken Window theory


    Here''s another thing to consider: the Broken Window theory. Philip Zimbardo,
    a psychologist from Stanford, did a very interesting study: he parked a car in
    a fancy neighborhood for a couple of days and just watched it. Surprisingly, nothing
    happened. He waited and waited, but nobody touched the car. Then, he decided to
    break a small window to see if things would change. Within just a few hours, the
    car was completely stripped; everything was gone – tires, wheels, electronics,
    steering wheel, seats, mats, even the engine.


    Now, the same kind of thing can happen with code. You start off with a clean situation;
    everything''s looking good. But as soon as you introduce one bit of bad code,
    things can quickly get out of control. For instance, you code duplication in a
    few places, leave inconsistent formatting, and tolerate inconsistent variable
    naming. Again, you can start adding code without the proper test coverage, or
    avoid upgrading your project''s dependencies due to fear of issues sneaking in.


    Initially, these may seem like minor problems, and developers prioritize adding
    new features or fixing critical bugs instead. Other team members notice these
    issues but also follow suit, assuming they are not a high priority. As developers,
    we''re already making some mistakes, so why bother doing it right in this case?
    Taking shortcuts and doing things the easier, faster way seems'
