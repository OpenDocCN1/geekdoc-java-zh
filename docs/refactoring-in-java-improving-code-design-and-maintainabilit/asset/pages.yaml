  md: 'With that, we''ve taken a quick look at static analysis, focusing on what to
    look for and how to look for it. Unfortunately, static analysis alone is not enough.
    Clean code is one thing – efficient code is another. It is strictly necessary
    to analyze the code while it is running.


    # What is dynamic analysis?


    While static analysis is done on the code, its complementary version, **dynamic
    analysis**, is done on the program while it is running. This approach involves
    analyzing the code during execution, rather than just inspecting the source code,
    or performing static analysis, which examines code without executing it. Dynamic
    analysis provides insights into how a program behaves in real-world scenarios
    and identifies issues that might not be apparent through static analysis.


    If you have done some unit testing or debugging, well, you do some kind of dynamic
    analysis. But there is much more to do. Dynamic program analysis collects diverse
    insights about a program''s behavior, which includes variable assignments, the
    sequence and timing of function calls, data structure manipulations and modifications,
    memory allocation and usage, utilization of system resources, and the detection
    of encountered errors. This information is essential for purposes such as bug
    and vulnerability identification, program performance enhancement, verification
    of program adherence to its requirements, and gaining a deeper understanding of
    the program''s operational principles.


    There are many examples of dynamic program analysis; let the journey begin.


    # Debugging


    As trivial as it may seem, **debugging** is the most widely used technique for
    dynamic program analysis; it''s the simplest activity we do in our industry –
    yes, certainly much more than writing the code or designing the architectures.
    And, we know that by implementing some good habits in testing (such as **test-driven
    development (TDD)**) the need for debugging should be minimal, ideally zero, but
    in the real world, it''s not always possible to do.


    Since it''s a popular activity, we won''t dwell too much on debugging. However,
    I would like to draw attention to some aspects that people might underestimate,
    especially at the beginning of their professional careers.


    For effective debugging, to reproduce the bug first; from experience, this can
    be a difficult phase, sometimes more difficult than the resolution itself. It
    involves having to explain you what was done to that bug (if you haven''t noticed
    it) and reproducing the same input that generated the problem or at least one
    of the same type. It is not even granted that you can use a debugger; for example,
    if you can''t reproduce the problem in an environment where you can use the debugger
    (for example, your local host), you''ll need to use other technique, such as logging.
    By logging the program''s state at key points, you can track down the source of
    the error more easily. As we already know – and it''s the key target of this whole
    book – refactoring can help you debug. Sometimes, it could just look like a game,
    but refactoring your code and making it cleaner will likely help you understand
    what''s happening.'
