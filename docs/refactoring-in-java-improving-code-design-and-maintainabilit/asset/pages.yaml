  md: 'A prioritization matrix (also known as the Eisenhower Matrix) is a tool used
    in software refactoring to help developers prioritize their efforts and make informed
    decisions about refactoring projects to tackle first. It typically involves a
    matrix with two axes, one representing the level of urgency given to a project
    and the other representing the potential impact on the system.


    Each project is evaluated based on these two factors and then plotted on the matrix
    accordingly. Projects that require the least effort and the greatest potential
    impact are considered the highest priority, while those that require more effort
    and have a lower potential impact are considered lower priority.


    Using a prioritization matrix can help developers make strategic decisions about
    which projects to tackle first, based on the potential benefits and costs of each
    project. By focusing on the highest priority projects, first developers can make
    the most efficient use of their time and resources, and ensure that they are addressing
    the most critical issues in the code base:


    ![](img/413a83eb121d9ef596d0d310811a5be2_36_0.png)


    Figure 1.6 – You should put your activities in a prioritization matrix in order
    to choose the right priority for execution


    The higher priority should be assigned to activities that have high urgency and
    impact. Lower priority (or no importance at all) should be given to activities
    that are not urgent and will have no impact.


    # Further considerations'
