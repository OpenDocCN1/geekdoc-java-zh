  md: 'The Clean Code principle YAGNI (short for You Aren''t Gonna Need It) follows
    this simple idea: a developer should only add extra functionality to code when
    it''s needed. YAGNI is closely associated with Agile software development approaches.
    According to the YAGNI principle, instead of starting with a grand plan, you should
