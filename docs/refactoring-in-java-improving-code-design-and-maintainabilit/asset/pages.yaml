    # Direct communication


    One of the primary motivations behind designing good architecture is the desire
    for improved flexibility and easier maintenance of the overall system. This flexibility
    is crucial for accommodating changes within the application, including modifications
    to the API of individual services or adjustments to the communication protocols
    between services.


    However, a challenge arises when clients communicate directly with different services.
    This direct communication model diminishes some of the benefits of a good architectural
    design, particularly regarding flexibility. When clients are tightly coupled to
    the specific addresses of other services, the ability to relocate or split these
    services becomes problematic. In essence, the address of a service becomes a fixed
    point, making it difficult to make structural changes to the system without impacting
    its clients. Additionally, when a service is publicly exposed, there is a constant
    need to maintain backward compatibility in its API to avoid disrupting existing
    clients. This is usually considered an anti-pattern, and we''re going to represent
    it with the following diagram, where you can see different types of devices connecting
    directly to the exposed services:'
  merge: -1
  pgno: 242
- img_proc: true
  md: '![](img/413a83eb121d9ef596d0d310811a5be2_243_0.png)


    Figure 9.6 – Different clients for different devices directly call the services


    There are many possible solutions to avoid this anti-pattern. Let''s see a couple
    of them.


    # API gateway


    API gateway is a server or service that acts as an entry point for a collection
    of services. Its primary role is to provide a centralized and unified point of
    entry for clients (such as mobile apps, web applications, or other services) to
    interact with various components. It basically sits between the client and server,
    providing other essential functions. Here is a diagram of an API gateway:'
  merge: -1
  pgno: 243
- img_proc: true
  md: '![](img/413a83eb121d9ef596d0d310811a5be2_244_0.png)


    Figure 9.7 – All of the clients of the different devices pass through the same
    API gateway


    For example, API gateways usually provide request routing: an API gateway routes
    incoming requests from clients to the appropriate service(s). It acts as a traffic
    cop, directing requests to the relevant service based on factors such as the endpoint,
    version, or other criteria.


    The API gateway can aggregate multiple requests from clients into a single request
    to reduce the number of round trips between the client and the service. This is
    beneficial for optimizing performance and reducing latency. Similarly, the API
    gateway can aggregate responses from multiple services before sending them back
    to the client. This can reduce the number of requests needed from the client and
    enhance overall system efficiency.


    Load balancing distributes incoming requests across multiple instances of a service
    to ensure optimal resource utilization and prevent overload on any single instance.
    The API gateway can handle this load balancing to enhance the system''s scalability
    and reliability.


    The API gateway usually centralizes authentication and authorization processes.
    It can enforce security measures by validating API keys, handling user authentication,
    and ensuring that authorized clients can access specific services.


    To improve performance, the API gateway can implement caching strategies. It can
    store and retrieve responses from services in a cache, reducing the need to recompute
    or fetch the same data repeatedly.


    The API gateway often includes monitoring and analytics tools to track the performance
    and usage of microservices. This information can be valuable for identifying bottlenecks,
    optimizing resource allocation, and ensuring the overall health of the system.


    An API gateway can enforce rate limits on incoming API requests to prevent abuse
    or overof of resources. This involves setting a maximum number of requests a user
    or client can make within a specified time frame.'
