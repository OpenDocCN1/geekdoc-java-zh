  md: '# 4 Testing


    When we talk about refactoring, or "better", as we have already mentioned, we
    essentially rewriting the

    code in a better way (where "better" can have various meanings) without changing
    its behavior. This

    last point is crucial, and we have not yet delved enough into it. To ensure that
    the behavior does

    not change, and in general, to approach every refactoring with a high level of
    confidence, it is

    necessary to be covered by an adequate set of tests.


    It may sound obvious, but a test is nothing more than a way to verify the functionality
    of certain

    software (whether it is a piece of code, a module, or an entire architecture)
    against a set of

    requirements. In practice, we are saying: "Check that my code, given a certain
    input X, produces a

    certain Y." We''re much complex than that, for now, let''s settle with this

    explanation.


    There can be various types of tests, as well as different approaches to writing
    them, as we will see

    during the course of this chapter. Before discussing the "how," we will look why
    testing is

    essential, especially when it comes to refactoring. Within the context of refactoring,
    I would say

    testing is a fundamental condition.


    Fortunately, there are methodologies and tools that can assist us, as the famous
    JUnit

    framework. In terms of methodologies, it is certainly worth mentioning Test-Driven
    Development

    (TDD), which serves refactoring and simultaneously uses refactoring – you will
    see what I mean by

    this somewhat cryptic statement. But to be truly safe, it is also necessary to
    ensure that most of the

    implemented functionalities have been rigorously tested; also, for this, we have
    tools that can save us\quite a bit of headaches.


    In this chapter, we''ll cover the following topics:


    +   * Why you should test, and why you should do it often

