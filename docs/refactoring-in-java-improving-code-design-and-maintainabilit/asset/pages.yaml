  md: "```\nreturn new PersonBuilder(taxCode);\n}\n} public PersonBuilder(String name)\
    \ {\n    this.name = name;\n    return this;\n}\n\npublic Person build(taxCode)\
    \ {\n    Person person = new Person(taxCode);\n    person.setName(name);\n   \
    \ return person;\n}\n```\n\nYou can clearly see a builder method that instantiates\
    \ the builder itself, taking taxCode as its only parameter, which is mandatory.\
    \ The name method is just a setter of the name attribute; you can have one for\
    \ each field of your class. The build method creates and returns an instance of\
    \ Person. Using the builder pattern on type is meaningful as you do not provide\
    \ any other method to instantiate that type; for example, you can use the constructor\
    \ of the Person private type and create builder as an inner class.\n\nThe usage\
    \ of PersonBuilder is straightforward:\n\n```\nPerson p = PersonBuilder.builder(\"\
    4598308JKFLD3424243\")\n    .name(\"John Doe\")\n    .build();\n```\n\nOnce the\
    \ object has been built (instantiated), you cannot modify its fields. In this\
    \ example, the builder method (in this instance, the builder, in fact, and not\
    \ the Person class) takes as a parameter taxCode, which is mandatory.\n\nThere\
    \ are tools to automate the creation of builder classes, which we will discuss\
    \ later in the book.\n\n# Using generalization\n\nGeneralization is one of the\
