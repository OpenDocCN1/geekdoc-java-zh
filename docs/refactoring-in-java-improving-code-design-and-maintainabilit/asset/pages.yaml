  md: '# 3


    # # Code Smells


    The title of this chapter should be self-explanatory or perhaps sounds disgusting,
    but I think it''s important to explain what is meant by the term code smell. The
    sensation is similar to when you open the refrigerator and a strange odor hits
    your nose, something that shouldn''t be there. A bad smell doesn''t necessarily
    indicate a problem, but it''s worth taking a look, just in case. There might be
    an issue, or there might not, but ignoring it is not a good idea.


    In our code base, it''s the same. A code smell is a potential problem, a situation
    in the code that makes us wrinkle noses. They are very tangible and observable
    situations, recurring patterns in our projects. They indicate that there is or
    something that needs to be fixed as soon as possible before the problem becomes
    even bigger. widespread inefficiency, limited code extensibility, and comprehension,
    as well as performance issues and potential bugs.


    We need to learn how to recognize and avoid code smells; it''s much easier to
    produce than we might think, how we are absorbed in tasks and deadlines. The important
    thing is, once again, to take the time to review our work and identify problems
    the bad smells that arise from lines of code. Our time, with practice and experience,
    you''ll build a mental compass that points out coding pitfalls like a seasoned
    treasure hunter unearthing gems. It will guide you before you''ve finished crafting
    your code.


    There are plenty of code smells that have already been cataloged by our developers:
    I don''t think it''s appropriate to list all here. I''ll tell you about the ones
    that I believe are the most common to encounter and produce. The selection has
    been made on purely subjective criteria, so feel free - in fact, I recommend it
    to delve deeper into the Further reading section. Many of these code smells are
    related to clean code and the SOLID principles. If you happened to skip the previous
    chapter, it be a good idea to go back and take a look.


    We''ll start with duplicated code, the nuisance of all bad code. It''s often caused
    by the developer''s temptation to deade deadlines by using the ultimate shortcut:
    copy and paste. We''ll move on to methods and large classes. It''s truly disheartening
    when you encounter a bug on line number 4215 of class, not because of the bug
    itself, but due to the huge number of lines the class contains!


    Then, I will show you switch statements can also be a problem when they are repeated;
    a typical situation that object-oriented programming can easily solve! When discussing
    object-oriented programming, which not represent the concepts of our domain through
    objects rather than rely on language primitives? There''s an anti-pattern called
    Primitive Obsession and we''ll tackle it.


    In addition to large classes, there are classes or methods that rely heavily on
    the methods of others; in other words, they just''t mind their own business! We''ll
    explore what feature envy methods are and how to address the potential harm they
    cause. We will also discuss two anti-patterns closely related'
