    \ like this:\n\n```\nOrder order = orderRepository.findById(\n    (paymentRequest.getOrderId());\n\
    ```\n\nVery likely, a user will be needed too. After fetching the order, we'll\
    \ probably add a line in which we also retrieve the order, because we need some\
    \ information about them:\n\n```\nUser user = userRepository.findById(\n    (paymentRequest.getUserId()));\n\
    ```\n\nFrom these objects, we're going to take some specific properties that we\
    \ need to complete the payment. For instance, we'll write something like the following:\n\
    \n```\norder.getItems();\norder.getOrderDate();\nuser.getLevel();\n```\n\nOnce\
    \ again, we're faced with a ton of getter/setter methods of other objects being\
    \ called. It's very common to find methods using tons of getter of other objects\
    \ to retrieve or calculate some value. In this case, it's also likely that your\
    \ Java class, will have a lot of collaborators, that is, a lot of other classes\
    \ injected into your constructor.\n\nIn the basic scenario, you can transfer the\
    \ method from one class to another (and modify its name, if necessary). If only\
    \ a portion of the method requires access to another object's data, you can extract\
    \ that specific part into another separate method. However, not all cases are\
    \ straightforward; sometimes, a function relies on features from multiple modules,\
    \ so it becomes a question of which module it belongs to. A rule of thumb (as\
    \ suggested by Martin Fowler) is to determine the module that possesses most of\
    \ the data and place the function there. This process"
