  md: '![](img/413a83eb121d9ef596d0d310811a5be2_185_0.png)


    Figure 8.3 – Merging a branch into a tree (a merge commit is created)


    When merges happen, the graph stops being a tree, as points can have more than
    one parent. Instead, it becomes a rooted directed acyclic graph (DAG). This graph
    doesn''t have cycles “by definition” because parents always existed in the past,
    it''s rooted because it has a starting node given by the very first commit and
    it''s directed because you can navigate through it only in a given direction (we
    could say the direction of time) and never in the opposite direction. If there''s
    a trunk, merges branches are like “external” additions to the tree. The changes
    in the branch are merged as a bundle, and applied to the HEAD of the trunk, creating
    a new version without mentioning the branch and keeping the tree structure. even
    though the actual relationships are a DAG, you can think of it as a tree with
    merges, and the trunk itself is a straight path.


    In addition to performing the MERGE operation, code versioning systems also offer
    the option to perform the so-called rebase. This action shifts the whole branch
    of changes to start from the latest point in the main branch. It includes all
    the changes in the main branch. However, instead of making a MERGE commit, rebasing
    rewrites the project history by making entirely new commits for each original
    commit in the branch. Putting it more simply, it''s like you take the whole branch
    and “attach” it at the end of the main one:


    ![](img/413a83eb121d9ef596d0d310811a5be2_185_1.png)


    Figure 8.4 – Rebase operation


    Rebasing has a big advantage because it makes your project history cleaner. It
    does this by removing the extra merge commits that git merge creates. Additionally,
    rebasing creates a completely straight-line project history, allowing you to trace
    the development from the latest feature to the very start of the project without
    diverging paths.


