    Figure 4.12 – The TDD cycle


    I think that by this point, you will understand how cool this TDD technique is;
    however, with all things, there are not just advantages. Let''s take a closer
    look at the pros and cons of this methodology so that you can form your own opinion.
    As usual, don''t expect an exhaustive list; even though I tried to refer to the
    existing literature on the subject, much of it is influenced by my personal experience.


    # Advantages of TDD


    Here are some advantages of TDD:


    +   * **Only write code that''s needed:** According to the principles, it''s important
    to avoid writing production code right after you tests pass. Instead, when your
    project requires a new feature, you should create a first test to guide the implementation
    process. The code you should write be the most straightforward and minimal necessary
    to fulfill the feature''s requirements. In this way, only the essential code to
    implement the features will end up in the final product.

    * **Fast failing:** The distinctive aspect of TDD is its ability to facilitate
    rapid failure. This shortens the feedback loop, allowing the development team
    to quickly determine whether the code is correct. Developers can conduct self-assessments
    and manual acceptance tests, while also engaging in peer-to-peer reviews. The
    outcome is a reduced turnaround time, leading to minimal defects during testing.

    * **Continuous change:** As usual, most developers collaborate on the same code
    base. Whenever an individual developer starts working, CI tools detect the changes
    and promptly execute the unit tests, assessing the code within a few minutes.
    If any failures occur, they are promptly reported to'
  merge: -1
  pgno: 111
- img_proc: true
  md: 'the developers, resolve the issues before proceeding to manual or integrated
    testing, ensuring that users do not encounter these problems.


    +   * **Easy to maintain and refactor the code base:** Decoupling and clear interfaces
    make code more manageable. You can replace microfeature implementations without
    affecting other modules and rewrite the entire application with preserved tests.
    Thorough testing for each feature eliminates the fear of making changes. A complete
    test suite allows confident code improvements without breaking the application.


    +   * **Clear documentation:** TDD uses units tests, which act as effective documentation,
    sparing the need for time-consuming and difficult-to-maintain written documentation.
    This aspect is a key characteristic of good test coverage. TDD significantly contributes
    to achieving comprehensive test coverage.


    +   * **Nudge to refactoring:** There is a dedicated Refactor step as part of
    the Red-Green-Refactor cycle, ensuring that developers think about improvements
    in the design for every single line of code they write.


    # # Development speed – a note


    Specifically at the beginning, the feeling is that progressing very slowly. TDD
    is more focused on delivering quality code rather than delivering code. People
    might also write many tests that are similar or redundant, or perhaps tests that
    are too simple or trial tests of the code. Until the midst is well within the
    team, it may take some time to proceed at a decent pace.


    Anyway, when developers delay the creation of tests, it may initially appear to
    expedite the development process. However, this approach frequently results in
    tightly coupled code, rendering certain portions untestable. In the event of discovering
    bugs, the debugging phase can become aconsuming and unpredictable task. Consequently,
    choosing to replace the uncertain and variable debugging process with a more predictable
    and structured testing procedure is often a better idea.


    To summarize, TDD is a software development methodology in which developers create
    automated tests before writing the actual code. This process involves three main
    steps: writing a failing test that defines the desired functionality, the minimum
    code required to pass the test, and then refining the code while ensuring all
    tests continue to pass. It can be implemented over unit tests and other kind of
    tests, such as integration tests. TDD encourages iterative development, improves
    code quality, and helps catch bugs early in the development process.


    # # Summary


    I hope I have conveyed the importance of testing, not only as a necessary condition
    for refactoring but also a cornerstone of quality code. In this chapter, we have
    understood why testing is crucial and why it is beneficial to do it frequently,
    allowing us to fail as early as possible – this may appear like a paradox, but
    it isn''t.'
