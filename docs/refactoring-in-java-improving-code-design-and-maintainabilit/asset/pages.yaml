    # Architecture documentation


    Architecture documentation, also known as software architecture description, is
    a unique form of design document. If design documents derive directly from the
    code, architecture documents are a step forward (someone says they''re the third
    derivative, starting from the first one, which is the code). Documents contain
    very little information that is specific to the code itself; the nittiness of
    the implementation must be kept away. They don''t explain how to code a particular
    function or why a specific function is designed the way it is. Instead, they outline
    the general requirements and reasons that lead to the creation of such functions.
    A well-crafted architecture document is concise in details but rich in explanations
    – also rich in images and graphs, I might offer suggestions for lower-level design
    but delegates the actual exploration and trade studies to other documents.


    Architectural documentation is probably the first thing that a new member of your
    team would read. That''s one of reasons why we''re saying it''s crucial: software
    architecture helps different people involved in a project to have a common understanding
    of how the systems work.


    One way to document your architecture is the typical one: just draw a bunch of
    boxes on a whiteboard and connect them with arrows and lines! Or... there''s a
    more structured approach called C4.


    The C4 approach, also known as the C4 model, is a framework for visualizing and
    documenting software architecture. It was created by Simon Brown and is designed
    to provide a clear and concise way to represent and communicate the architecture
    of a system. C4 stands for Context, Containers, Components, and Code, which are
    the four levels of abstraction in this model:


    +   1. Context diagram (C1): This is the highest level and provides an overview
    of the entire system, showing its interactions with external entities and systems.
    It helps establish the system''s boundaries and its place in the broader ecosystem.


    +   2. Container diagram (C2): The next level, the container diagram, focuses
    on the high-level building blocks within the system. It represents containers,
    such as web servers, databases, mobile apps, and more, shows how they interact
    with each other.


    +   3. Component diagram (C3): Below containers, the component diagram delves
    into the internal structure of each container, breaking them down into individual
    components or services. This level provides more detail about how each container
    works internally.


    +   4. Code (C4): At the lowest level, you have the actual source code, where
    the details of the individual components are documented. This level includes class
    diagrams, code snippets, and other fine-grained details.'
