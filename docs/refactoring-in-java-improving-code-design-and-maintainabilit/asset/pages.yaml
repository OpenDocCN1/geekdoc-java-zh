    In this chapter, we''ll learn about the following topics:


    +   * Duplicated code

    * Long methods

    * Large classes

    * Switches

    * Primitive Obsession

    * Middle Man

    * Message Chains

    * Feature envy methods

    * Divergent change

    * Shotgun Surgery

    * God object


    As mentioned before, code smells are, at the end of the day, smells. Just as a
    bad odor in the fridge

    does''t necessarily indicate a problem with your food (think of gorgonzola cheese!),
    a bad smell in

    your code doesn''t necessarily indicate a problem. However, there is a potential
    problem that is worth

    considering. In my view, the most important thing is to be aware of what we have
    in our code bases.

    We shouldn''t perceive every code smell as the most urgent in the world because
    it probably

    is''t. However, it is crucial not to underestimate these by ignoring one code
    smell after

    another, we end up with code bases that are either unmaintainable or maintainable
    at an excessively

    high cost. This applies not only in economic terms but also to personal frustration.


    # Duplicated code


    Let''s start with what Martin Fowler calls the stink parade (I can''t help but
    mention it because the

    term cracks me up) with duplicated code. Duplicated code is intuitively a bad
    smell, and our software

    engineer instincts will soon learn to reject it as something that harms us. Let''s
    try to list a few

    asons why duplicated code is harmful to the health of our code bases.'
