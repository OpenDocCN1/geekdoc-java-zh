    debt. Technical debt happens when you prioritize speed over long-term benefits
    in your design or implementation choices. Just like a loan, it accumulates over
    time, making it harder to maintain and improve the software later. Constant refactoring
    improves design and quality; a better design reduces debt.


    # Maintainability and scalability


