  md: '# Beyond Code – Mastering Software Architecture


    At this point, everything should be crystal clear why and how to constantly refactor
    your code; in general, why it''s important to have a clean, readable, and easily
    maintainable code base. But in today''s development world, it''s highly unlikely
    that we''ll have one application, one component; it''s much more realistic to
    have various components interacting with each other. If it''s true, as it is,
    that to Conway''s Law, a company is structured and organized in a way that mirrors
    its software systems, it''s crucial to have a cohesive yet scalable ecosystem
    – not just robust but resilient and, frequently mentioned, clean. Because even
    clean code can lead to epic disasters if interactions between various services
    are poorly managed.


    In this chapter, we''ll tackle the following topics:


    +   * What is an architecture?

    * Architectural patterns

    * Monolith in microservices

    * Bad smells in the microservices architecture


    # What is an architecture?


    Coming from this, we''ve realized that writing code is just a small part of our
    job. We need to focus on writing code that not only works but is easy to read
    and maintain. We''ve learned that there are many small adjustments we can make
    to make our work simpler and smoother. Now, let''s take a step back and think
    further: Is our job really about code? Writing good code (whether that means)
    any thing, even though it''s broad and complex, and what do we need to do? If
    we''re asking this question, you can get an answer: not at all! Just in the movie
    Ratatouille where Chef Gustau says, “Anyone can cook,” here, we can paraphrase
    his words and say that anyone can cook. It takes a little, to learn to write some
    lines of Java or maybe even in some other language. Recent months, technologies
    related to artificial intelligence (AI) have exploded, which can literally write
    code for us. But what is really challenging is not just writing code or even software
    that work together too. As Robert C. Martin says, “Getting software right is hard.”


    Software architecture is like the blueprint for a software system. It''s the plan
    that outlines how different parts of the software work together. This involves
    making decisions about how to design to meet specific goals. It includes elements
    such as the different pieces of software, how we connect to each other, and the
    rules for organizing them. So, software architecture is basically the high-level
    design that guides the creation of a software system.'
  merge: -1
  pgno: 222
- img_proc: true
  md: 'The architecture of a software system is like the design or structure created
    by the people building it. It''s determined by how the system is divided into
    parts (components), how these parts are organized, and how they talk to each other.
    In simpler terms, it''s how the different pieces of the software are put together
    and work together. This is only one definition of architecture, shaped by the
    Clean Architecture by Robert C. Martin. Reading Martin Fower''s works, instead,
    gives us another (funnier) definition of what architecture is: the collective
    knowledge that experienced developers have about design a system and the set of
    decisions they hope to make correctly at the beginning of a project.


    We hope it''s a bit clearer what we mean by software architecture, but maybe it
    will be even clearer when we''ve explained our goals. On goals, the ideas seem
    quite clear in literature: good architecture makes things work better. The reason
    for creating a good architecture is to make it easier to develop, deploy, operate,
    and maintain the system it holds.


    # Development


    As long as there''s a small, single team handling the entire project, people may
    think that architecture isn''t important; in fact, it''s seen as an obstacle.
    This is why many projects, especially in the startup phase, often don''t have
    a proper architecture. However, as the project expands, rush to the rescue as
    soon as possible! In fact, it''s challenging to work with different teams on the
    same project, on the same module; it becomes necessary to divide the module into
    well-defined parts (“how” is a whole story). Simply dividing the initial component
    into multiple components is not enough. It needs to be done carefully, how these
    components will interact with each other. Otherwise, there''s a risk that from
    a single component, different ones may develop independently, each doing its own
    thing. And if everyone goes their own way, it''s difficult to work on new features
    or fix existing problems. If a software system is difficult to develop, it''s
    unlikely to have a long and healthy lifespan. Therefore, the system''s architecture
    should be designed to make development easy for the team or working on it.


    # Deployment


    Deployability means how easily and reliably software can be set up and run in
    a reasonable amount of time (ideally, with a single click). If there''s a problem
    with the new setup, it should be possible to go back to the previous one without
    too much trouble. With the rise of virtualization and cloud systems, and as software
    systems get bigger, it''s the architect''s job to make setting up the software
    is done efficiently and predictably, reducing the overall risk for the system.


    Unfortunately, many people, dont think about how to set up a system when they''re
    building it. This can result in designs that make the system easy to create but
    really hard to get up and running.


    For example, when starting to build a system, developers might opt for an architecture
    that includes a certain number of services and components. It might seem like
    a good idea for various reasons, such as smoother development and each piece working
    independently. However, during deployment,'
  merge: -1
  pgno: 223
- img_proc: true
  md: 'team realizes that some of these services are interconnected and rely on each
    other to function properly. Deployment becomes challenging, as you may need to
    deploy not only one service but also interconnected ones. If architects had considered
    the system setup from the beginning, they might have chosen fewer services, a
    combination of services and in-house components, and a more integrated approach
    to managing connections.


    # System operation


    System operation involves the day-to-day management and execution of a computer
    system or software application. It includes tasks such as running the software,
    performing, updates and fixes, ensuring security, handling backups, assisting
    users, and addressing issues as they arise. Essentially, it’s the ongoing effort
    to keep the system running smoothly and meeting user needs.


    The influence of architecture on system operation is generally considered not
    as significant as its impact on development, deployment, and maintenance. Operational
    challenges can be addressed by increasing the system hardware resources without
    causing major changes to the software architecture; this scenario is quite common.
    Inefficient software architectures can often be made functional by merely adding
    storage and servers. The affordability of hardware compared to the cost of human
    resources means that architectures causing obstacles in operation are not expensive
    as those hindering development, deployment, and maintenance.


