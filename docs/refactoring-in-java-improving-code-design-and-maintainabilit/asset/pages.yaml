    no one-size-fits-all rule for every situation. You need to consider each case
    individually. In general, it could be that it''s worth creating a shared library
    whenever you need to write code that doesn''t depend on the specific subject of
    the module you''re working on. The examples mentioned earlier (logging, security,
    monitoring, and so on) are things that can be used in different situations, no
    matter what area you''re working in.


    There are different ways to handle your shared libraries. You could either set
    up a repository for each needed library or use a single repository (referred to
    as a *monorepo*; more on this in the *Further reading section*) that houses multiple
    libraries. The crucial point is to have some form of separation. For instance,
    you could have a single repository covering monitoring, security, and logging
    projects. Each project would be self-contained, except for any necessary dependencies.


    It''s really important to keep the user''s logic inside a kind of protective bubble;
    this is crucial in programming and encapsulation is like a shield that stops unwanted
    access and keeps data safe from being leaked. That''s why you''re building shared
    libraries. Let''s imagine you''re making a library with specific to a certain
    company, as a tool to pull files into storage. The part that users work needs
    to be designed in a general way, avoiding names such as S3FileUpload (because
    S3 is Amazon''s storage service). But why these names? Well, think about this:
    what if in the future you want to switch to Azure Blob (which is like Microsoft''s
    version of Amazon S3)? If you had named things specifically to Amazon, all your
    users would have to change their ways of doing things. So, it''s better to use
    generic names, such as FileUploader. Believe me, it will save you a bunch of time
    and in the long haul.


    Keep your library code clean. Even many people might contribute to the shared
    library, turning it into a bit, complicated thing! Before adding a new library,
    think about it like. When you do add one, think about how it might change and
    who will use it. Don''t make it for your own needs; that makes it hard for others
    to use or add to.


