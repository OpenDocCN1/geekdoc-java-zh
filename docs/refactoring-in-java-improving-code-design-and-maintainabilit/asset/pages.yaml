    • Excessive layering: Sometimes, our application tends to be too layered. For
    example, imagine a basic CRUD that goes all with multiple layers, including data
    transfer objects, data access objects, and domain objects. Every time you want
    to add a table to the database, you not only have to add stuff to all four layers
    but also deal with the property bag objects within those layers. It''s another
    case of Shotgun Surgery. (But the world isn''t all black or white; there are many
    shades of grey. Sometimes, an application with well-defined layers helps to isolate
    concepts and responsibilities. So, be careful; I''m not saying that designing
    multiple layers in an architecture is inherently bad. You have to find the right
    balance, just like in life!)


    • Limited layering: Just as there are too many layers in the design of an application,
    there are also many responsibilities that are excessively separated: one for constants,
    another for variables, and so on. When you need to make a change, you find yourself
