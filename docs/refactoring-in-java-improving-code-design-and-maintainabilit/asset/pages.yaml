  md: 'In the world of event-driven setups, there are two main ways things work: the
    pub/sub model and the event streaming model.


    # Pub/sub model


    Pub/sub stands for publish/subscribe or publisher/subscriber. This system functions
    using a messaging framework built on event stream subscriptions. Once an event
    takes place or is published, it is sent to subscribers who have expressed interest
    in that particular information. This method guarantees timely notification of
    relevant parts regarding unfolding events.


    # Event streaming


    Unlike the pub/sub model, the event streaming involves the recording of events
    in a log. Here, event consumers do not subscribe to an event stream; instead,
    they have the flexibility to read from any segment of the stream and can join
    the stream at their convenience.


    There are some different types of event streaming, the main ones being:


    +   * **Event processing**: Leverages a data streaming platform such as Apache
    Kafka to intake events and handle the processing or transformation of the event
    stream

    * **Simple processing**: An action is triggered in the generic consumer as soon
    as an event occurs


    # APACHE KKA


    The widely used tool for event streaming is Apache Kafka. Apache Kafka stands
    out as a powerful distributed data streaming platform, widely recognized as a
    top-tier solution for event processing. Renowned for its versatility, this platform
    excels in managing the seamless flow of event streams in real-time, encompassing
    tasks such as publishing, subscribing, storing, and processing data. Designed
    to meet the demands of diverse use cases, Apache Kafka particularly shines in
    scenarios where high throughput and scalability are paramount.


    One of the distinctive features of Apache Kafka is its ability to efficiently
    handle a spectrum of data-sharing tasks without the need for intricate point-to-point
    integrations. This characteristic not only streamlines the overall architecture
    but also plays a pivotal role in reducing latency to an impressive millisecond
    scale. By offering a robust framework for real-time data processing, Apache Kafka
    empowers organizations to harness the potential of timely insights and responsive
    analytics.


    In essence, Apache Kafka emerges as an indispensable tool for industries and applications
    where rapid exchange of information is critical. Its architecture not only supports
    the simultaneous handling of numerous events but also ensures that the system
    can effortlessly scale to accommodate growing demands. This combination of flexibility,
    scalability, and low-latency processing positions Apache Kafka as a preferred
    choice for businesses seeking a reliable and efficient solution for their data
    streaming and event processing needs.


    The natural evolution of an event-driven architecture, especially one that adopts
    the event streaming pattern, is reactive architecture.


    # Reactive architecture'
