    focuses on the consumer''s perspective. Contracts are written to ensure that the
    provider''s behavior aligns with the contract. These tests are typically managed
    by the consumer''s team. Provider tests, on the other hand, are written by the
    provider''s team. They verify that the provider complies with the contract. Automated
    contract tests run continuously as part of the build and deployment process. They
    help detect issues early whenever changes occurs in the consumer or provider service.
