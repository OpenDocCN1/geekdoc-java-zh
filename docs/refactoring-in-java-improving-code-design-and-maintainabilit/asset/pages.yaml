  md: "Method calls are essential in OOP, as they enable objects to perform specific\
    \ tasks or actions. There are many techniques intended to simplify the way objects\
    \ interact with each other; we're going to explore some of the most interesting\
    \ ones.\n\n# # Avoiding side effects\n\nWe already discussed the side effects\
    \ and mutability of objects in Chapter 3, explaining why they are not ideal in\
    \ a software project. A typical side effect occurs when you mix a query, which\
    \ is a part of the code that simply retrieves information, and a modifier, which\
    \ is code that performs an action on some data or state. Here's an example of\
    \ this:\n\n```\npublic Price getTotalItineraryPrice(User user, Itinerary itinerary)\
    \ {\n    Price totalPrice = calculateTotalPrice(itinerary);\n    emailService.sendPriceRecap(user);\n\
    \    return totalPrice;\n}\n```\n\nIn this example, the method calculates the\
    \ price for a specific itinerary and simultaneously sends a summary to the customer.\
    \ We have several issues here. First (but this is the least of them), the name\
    \ is misleading because it is not consistent with the actual behavior of the method.\
    \ Furthermore, the method does more than one thing; particularly, it retrieves\
    \ information on one hand, but on the other, it changes the state of things by\
    \ notifying the user. It's better to separate these concerns, like so:\n\n```\n\
    public Price getTotalItineraryPrice(Itinerary itinerary) {\n    return calculateTotalPrice(itinerary);\n\
    }\n\npublic void sendEmailRecap(User user) {\n    emailService.sendPriceRecap(user);\n\
    }\n```\n\nWe now have two distinct methods, one that requests information and\
    \ another that modifies the system's state. It's worth noting that a query method\
    \ can be called many times as desired without affecting the system's state. The\
    \ code is cleaner, and we have also removed a parameter from the getTotalItineraryPrice\
    \ method.\n\n# # Removing setter methods\n\nActually, this section should also\
    \ be a continuation of the previous one. Removing so-called setter methods, which\
    \ allow you to set the value of an object's field, makes them immutable, removing\
    \ undesirable side effects.\n\nWe've already discussed this in this chapter, but\
    \ we'd like to go into a bit more detail. Let's consider a very simple class representing\
    \ a person; let's include only two fields for simplicity:\n\n```\nclass Person\
    \ {\n    private String hashCode;\n    private String name;\n    public String\
    \ getTaxCode() {\n        return hashCode;\n    }\n}\n```"
