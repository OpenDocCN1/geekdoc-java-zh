    # Exploring compile-time metaprogramming tools


    Compile-time metaprogramming involves code transformations and generation that
    occur during the compilation phase. In other words, operations, transformations,
    or code generation are performed on a program during the compilation process —
    that is, before the program is executed. Macros, code generators, and annotation
    processors are common tools for compile-time metaprogramming in Java. Given the
    subject of this book, compile-time metaprogramming will be our main focus since
    we think that the instruments and frameworks under this definition are the best
    ways to keep your code clean. In particular, we''ll focus on code generator: programming
    languages and tools that provide facilities for generating code based on certain
    specifications or models (in the following section, we will focus specifically
    on Lombok and MapStruct). The code generated by these tools can be customized
    according to the specific requirements of the program.


    # Lombok


    Project Lombok (born in 2009) is a popular Java library that simplifies Java development
    by reducing boilerplate code and making the code for the record cleaner and more
    concise.


    In Java (at least version 14 with the introduction of the record keyword), there
    is often a significant amount of boilerplate code that needs to be written for
    basic tasks such as defining and setter methods, constructors, and the toString(),
    equals(), and hashCode() methods. This boilerplate code can be time-consuming
    to write, making the code base longer and harder to read.


    Lombok addresses this by providing annotations that automatically generate this
    boilerplate code during compilation. This means developers do not have to write
    these repetitive code elements, reducing the likelihood of errors and making the
    code base more concise.


    Lombok functions as an annotation processor that enhances your classes by introducing
    additional code during compilation phase. Annotation processing was introduced
    to the Java compiler in version 5. The concept involves placing annotation processors,
    whether self-authored or obtained from third-party dependencies such as Lombok,
    in the build classpath. During the compilation process, as the compiler encounters
    an annotation, it effectively inquires, "Anyone in the class with this @Annotation?"
    For processors answering yes, the compiler delegates control to them, along with
    the compilation context, allowing them to perform their respective tasks.


    Lombok''s annotation processing involves making adjustments to the compiler''s
    data structures that represent the code, specifically the abstract syntax tree
    (AST). Think of the AST as a roadmap for the computer program. It shows all the
    necessary steps that must be taken to create the final program. In Java, it is
    created before the actual program code (bytecode). The cool thing is that you
    can change and work with this AST in Java. Through these modifications to the
    compiler''s AST,'
