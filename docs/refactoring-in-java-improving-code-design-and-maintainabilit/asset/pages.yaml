  md: 'These days, IDEs are perfectly capable of flagging duplicate code (for example,
    in IntelliJ IDEA, it''s a built-in feature) and suggesting a small refactoring
    to extract the method. We will discuss how to get the most out of IDEs and other
    tools later in the book.


    We''ll move on to long methods.


    # Long methods


    This is a very typical code smell, sneaky, and often underestimated. Even though
    it may seem like a trivial topic to address, I''d like to share some thoughts.


    Code is read much more than it''s written, so taking a little extra time to shorten
    a method can pay off big time. When you have to modify a long method, you have
    to read and comprehend every single line of code to make the change safely. In
    this case, we'' burdened with loading all the work into our brains just to understand
    what''s happening, let alone have the ability to modify any part of it.


    Long code is likely doing more than one thing: according to the Single Responsibility
    Principle, a method should ideally focus on doing just one thing. It''s almost
    impossible to achieve when you have many lines of code.


    It would be useful to know when "long" becomes "too long." 10 lines? 20? 100?
    It''s hard to establish a fixed rule. It''s a bit like saying when a cake is too
    sweet or pasta is salty; we instinctively recognize the excesses, but probably
    wouldn''t agree on the exact numbers.


    My advice here is to follow your gut and, also reach a consensus with the team.
    For example, you can decide that 20 lines are the maximum limit and that it shouldn''t
    exceed one screen height (of course, it depends on screen resolution, font size,
    etc.). Another cool thing would be to use for formatting, even through the use
    of automatic tools that take care of it; more on later in the book. In short,
    it depends. It could also be the case that a method is long but contains only
    configurations, that are very readable and don''t require much effort to understand.
    In that case, you might not have enough about it.


    Furthermore, I want to bring a heuristic tip from Martin Fowler''s Refactoring:
    whenever you feel the need to insert a comment in the code to explain it, write
    a method instead. The method will contain the code you intended to comment on,
    but the name of function itself will reveal the intention behind the code, rather
    than its functionality.


