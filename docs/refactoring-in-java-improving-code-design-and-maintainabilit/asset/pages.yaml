    # Manual protocol mutation testing


    Manual protocol mutation testing is even less sophisticated than random fuzzing.
    It doesn''t involve an automated fuzzer; instead, the tester tests the fuzzer.
    By entering inappropriate data into the target application, the goal is to crash
    the server or provoke undesired behavior. It''s straightforward, cost-effective
    approach that''s often applied to web applications, allowing the analyst to rely
    on experience and intuition during the audit.


    We think this approach is sometimes referred to as hallway usability testing,
    even though a usability test is different than testing the program''s correctness.
    If you''re interested in what usability testing is, take a look at the Further
    reading section.


    # Mutation or brute-force testing


    Brute-force testing involves taking a valid sample of a protocol or data format
    and continuously modifying every byte, word, or string within data packet or file.
    While this approach requires minimal effort and is relatively easy to implement,
    it''s somewhat inconvenient because it may waste CPU cycles on data that cannot
    be interpreted. Nevertheless it can be fully automated, and it relies on a collection
    of known good packets or files for testing. Examples of brute-force format fuzzers
    include FileFuzz for Windows and SPIKEfile for Linux.


    # Automatic protocol generation testing


    In automatic protocol generation, the tester studies and understands the protocol
    specification or file definition. Instead of creating hard-coded test cases, a
    grammar is developed to describe the protocol. Static and fuzzable variables are
    identified within the packet or file. The fuzzer works by looking at templates,
    creating fuzzy data, and then sending the changed data to the target. Well this
    works depends on the tester''s skills in finding the parts of the specification
    that are likely to cause problems during the parsing process. Examples are SPIKE
    and SPIKEfile. However, this method demands time to create the grammar or definition
    upfront.


    We just want to give you a general smattering of concepts that we have often seen
    in place without a real "structurization" of what was being done. As usual, we
    do not pretend to be exhaustive but simply wish to poke some curiosity in regarding
    this subject.


    # Symbolic execution


    Symbolic execution stands as a program analysis method in which programs are run
    with symbolic inputs rather than concrete ones. Simultaneously, it preserves a
    path condition (such as the Cyclomatic complexity to learn what a path is) that
    evolves each time a branch instruction is encountered, encapsulating the constraints
    on the inputs that lead to that specific point within the program. In other words,
    it works by replacing data with symbolic values as input and describing program
    variables as expressions. This way, the program''s results are expressed as functions
    of these symbolic inputs.'
