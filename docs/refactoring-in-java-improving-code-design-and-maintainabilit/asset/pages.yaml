    # A SMALL DRESSION – WHAT IS SQL INJECTION?


    Even if it is not strictly related to taint tracking, we think it is worth knowing
    SQL injection is.


    SQL injection is a common and dangerous type of cyber-attack where an attacker
    can manipulate a web application''s SQL query by injecting malicious SQL code.
    This can potentially lead to unauthorized access, data theft, or even data manipulation.
    But how can this happen? Suppose you have a web application that uses user input
    to search for a specific user in a database using the following SQL query:


    ```

    SELECT * FROM WHERE username = ''input''

    ```


    Here, the input is taken directly from user input, and the application does not
    properly validate or sanitize this input.


    An attacker can exploit this vulnerability by inputting the following as username:


    ```

    '' OR ''1''=''1''

    ```


    The SQL query would look like this:


    ```

    SELECT * FROM users username = '''' OR ''1''=''1'';

    ```


    The ''1''=''1'' condition is always true, so the query effectively selects all
    rows in the table, allowing the attacker to bypass authentication and access all
    user data.'
