  md: 'often facilitated by extracting methods to break down the function into smaller
    pieces that can be placed in different locations.


    Sometimes, even when this guideline is not applicable, you have the option to
    use the Strategy or Visitor patterns described in the book by the Gang of Four.
    However, providing a detailed explanation of these patterns is beyond our scope.
    For more in-depth explanations, you can refer to the Further reading section.
    The fundamental principle remains unchanged: grouping elements that undergo changes.
    Typically, data and the corresponding behavior that relies on data tend to change
    simultaneously, though exceptions exist. In such scenarios, relocating the behavior
    ensures that changes are consolidated in a single location. Strategies and Visitors
    offer a practical means of modifying behavior by isolating specific portions that
    require overriding, even though this approach introduces some additional indirection.


    # Divergent change


    As engineers, we know our product is soft and flexible. Once, a professor at university
    told us, "We’re the only engineers who are asked to change the project times,
    even when it’s due. Imagine doing that with a bridge. This is our strength and
    curse."


    As we know from the Agile philosophy, change is good, but it needs to be controlled
    and managed. Going back to code smells, we have divergent changes when we need
    to modify a certain class, even though we’re touching seemingly unrelated aspects.
    Think of a class that handles the results of a search for transportation options
    like a travel booking website (where you put when you want to leave, when you
    return, where you want to go and they give you a bazillion options to choose from—planes,
    trains, buses and so on). At some point, we need to change the database application
    rules again. Then, we need to integrate a new type of transportation, and we must
    modify class X again. New payment method? Again, class X needs modification.


    All these are unrelated, but class X is always in the middle! Divergent change
    happens when a module (a class, or a project) is frequently modified for various
    reasons, resulting in a mixing of different contexts in a single location. To
    enhance our programming experience, we can improve it by segregating these contexts
    into separate modules.


    The most likely reason is that the Single Responsibility Principle has been violated.
    In general, we either have a flawed programming structure or we’ve gone overboard
    with copy and paste. it becomes necessary to create appropriate modules and move
    the methods accordingly. Sometimes it may be necessary to extract ad methods (perhaps
    relocate them) or even intend to extract classes.


    Sometimes we come across a special situation where two aspects, mistakenly tangled
    up in a single class, a classic example is when we fetch data from the database,
    process, and then feed it to a function that uses it. In cases like these, we
    use a refactoring technique called split phase. In this refactoring, we break
    down a complex computation into phases (or more). During the first phase, we calculate
    a result, and then we pass this result, along with some intermediate data structure,
    to the second phase for further processing.'
