  md: 'There''s more to think about when it comes to bit refactoring. I''ll jot it
    down here just to cover all the bases, honestly, it might be bit beyond the scope
    of this chapter. Once you''ve figured out which parts of your code base to prioritize
    for refactoring, the next step is to create a detailed plan that includes the
    scope, goals, steps, and timeline for the project. It''s also crucial to communicate
    this to everyone involved, such as your team, manager, clients, and users. You
    need to explain why you''re refactoring, what you''ll be doing, how you''ll be
    doing it, and when it''ll be done. It''s important to clear expectations and manage
    them through the refactoring process.


    The final step is to execute the plan with discipline and diligence. Stick to
    best practices such as making small and frequent changes, running tests before
    and after each change, committing and documenting each change, and reviewing and
    verifying each change. Keep an eye on the refactoring is affecting things such
    as code quality, system performance, and user feedback. Measure the outcomes and
    compare them with your goals and expectations.


    # Refactor or rewrite?


    There are various opinions on this matter, which I have observed to be a common
    source of disputes among teammates and colleagues. The truth is no simple answer.
    It''s just one of those things where there are a ton of conflicting opinions out
    there, and it''s tough to figure out what to believe. But I''ll do my best to
    share some of those opinions with you and offer some advice, for whatever it''s
    worth.


    There are situations when it''s not justifiable to refactor your code. Perhaps
    it''s plagued with too many bugs, the design is overly complicated, and comprehending
    it is nearly impossible. Going through it is like trying to solve the Rubik''s
    Cubefolded—or quoting a former colleague of mine, counting money with a fan blowing.
    In such cases, rewriting it from the ground could be the better option, and it''s
    something that software developers find enjoyable. After all, it''s often more
    comfortable to create something new than take small, incremental steps that are
    still tied to what was previously done.


    On the other hand, we often fall into the trap of wanting to rewrite everything,
    thinking that what''s already there is true, in reality, we may not put in the
    effort to fully understand it. It''s important to remember one of the fundamental
    rules of programming, easier to read than to write. Let''s not immediately denigrate
    the legacy code we use in our code bases, especially (our own code is, of course.
    Legacy code has a history; it has been thoroughly tested and integrated with all
    necessary use cases and often demonstrated good performance. We should respect
    legacy code.


    It''s a really complicated decision, and as I said, there''s no general rule.
    Perhaps, a very simple rule to adopt could be to evaluate the cost (in terms of
    time and complexity) of rewriting and refactoring code and choose the option that
    seems best to you. Note that I didn''t say "the option that costs less," because
    it''s an investment. Another useful thing could be to break the part under examination
    into smaller parts (the good old "divide and conquer") and choose to refactor
    (or rewrite) only that part, so as not to be "stuck" for too long.'
