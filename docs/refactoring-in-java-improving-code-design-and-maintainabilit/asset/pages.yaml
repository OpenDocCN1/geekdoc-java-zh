    Figure 8.8 – In trunk-based development, each commit is done on the main branch


    Here''s how the trunk-based branching model works in detail:


    +   1. Work in the main code: Instead of making separate branches, work directly
    in the MAIN (trunk) branch.


    +   2. Make small, frequent updates: Make small and regular changes to the code.
    This makes it easier to check and reduces the chances of problems.


    +   3. Use continuous integration (CI): Frequently combine and test the code to
    catch issues early, prevent conflicts, and keep the code ready for release.'
