  md: "```\npublic class Person {\n    private Address address;\n    public City getCity()\
    \ {\n        return address.getCity();\n    }\n    public Address getAddress()\
    \ {\n        return address;\n    }\n}\n```\n\nA \"client\" would use it in the\
    \ following way:\n\n```\nPerson person = getPerson();\nvar person = person.getCity();\n\
    ```\n\nYou can easily see that the getCity() method serves as a proxy to the other\
    \ class. So why not use the other class directly? Our example would then become:\n\
    \n```\nvar city = person.getAddress().getCity();\n```\n\nAnd so, we can eliminate\
    \ the middle man of the getCity() method in the Person class.\nHowever, this refactoring\
    \ can paradoxically lead to another code smell, the message chain!\n\n# # Message\
    \ chains\n\nMessage chain occurs when a client requests an object, which then\
    \ requests another object, and so on. This makes all the objects dependent on\
    \ the structure of the called objects, and a change in these objects would necessarily\
    \ impact the entire chain of calls, at any point where they are made.\nBuilding\
    \ the example from the previous section, we could have something like:\n\n```\n\
    var cityName = person.getLocation().getAddress().getCity().getName();\n```\n\n\
    The solution to hide the \"delegate\", is that the method calling the other one(s).\
    \ We could transform the previous example into:\n\n```\nvar cityName = person.getCityName();\n\
    ```\n\nWhere the chain of calls is hidden in the getClassName() method.\nTaken\
    \ to the extreme, however, this refactoring can lead to the middle man smell!\
    \ We ended up in a time loop like Christopher Nolan! The truth is, it depends.\
    \ These refactorings must be properly weighted, attempting to choose the lesser\
    \ evil (also considering the possibility that the class modeling itself is flawed\
    \ and might require changes in some way).\nOpting for middle instead of message\
    \ chains offers the advantage of requiring fewer mocks during unit testing. Testing\
    \ classes becomes challenging when you have to provide mocks not just for their\
    \ immediate and indirect dependencies. Additionally, it aids in the separation\
    \ of concerns. A code that possesses an A component and requires a C component\
    \ should ideally remain unaware of the involvement of a B component. This contributes\
    \ to modularity. While the primary argument for message chains is the avoidance\
    \ of writing boilerplate in the middle, and there might be cases where it makes\
    \ sense, the general guideline should lean towards preferring the middle man."
