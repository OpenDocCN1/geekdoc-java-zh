    \ should return null but cannot: error in the execution flow; some exceptional\
    \ cases. Java and many other languages allowing null, but it is preferable not\
    \ to do so for various reasons – among, avoiding a NullPointerException in the\
    \ caller or forcing it to check every time, that the method’s result is not null.\n\
    \nTIP\n\nTony Hoare introduced Null references in ALGOL W back in 1965 \"simply\
