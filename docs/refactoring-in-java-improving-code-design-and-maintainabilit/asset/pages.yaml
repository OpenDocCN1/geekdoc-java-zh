    # # Clean Code


    The well-known book on Clean Code is called *Clean Code* by Robert C. Martin.
    Surprisingly, even Martin himself struggles to come with a single definition for
    Clean Code. It seems like there are multiple definitions floating around us developers.
    In fact, in his book, Martin says several developers to provide their own “custom”
    definitions, and he includes all of them that we can create our own understanding
    of what Clean Code means.


    Clean is about writing code that''s easy to understand and follows a logical and
    disciplined approach. The main goal is to create software efficiently and effectively
    while ensuring that the code is readable, adaptable, expandable, and easy to maintain.


    You could argue that this definition is not objective, and you would be right!
    For example, “readable” is something very personal (and depends on the seniority
    and the skillset of those who are approaching the code). More often than you might
    think, we judge code by our guns. Can I understand it? Then it''s readable! Rephrasing
    the “*Fundamental Theorem of Readability*” book by Bouswell and Foucher, code
    should be crafted in a way that reduces the amount of time someone would need
    to comprehend it.


    And when we use the “understand,” we set a very high standard. To truly comprehend
    your code, someone should possess the ability to make modifications, identify
    bugs, and grasp how it interacts with the rest of your code. Clean Code is not
    a set of laws or a set of rules; it is an attitude, a mindset that we should follow.


    As already mentioned, refactoring and clean code are strictly related, since they
    both improve the quality and maintainability of software.


