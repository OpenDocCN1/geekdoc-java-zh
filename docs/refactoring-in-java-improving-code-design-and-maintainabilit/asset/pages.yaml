    before they are used in the project.


    Sometimes, if a task takes a long a developer might create a separate branch from
    the main code, make changes, and then bring those changes back to the main part
    when they''re done. But the main idea in trunk-based development is to use separate
    branches as little as possible and have everyone work together on the main part
    of the code most of the time. The following diagram represents a simple sequence
    of commits (a graph made by only one, linear path) that have been done on a single
