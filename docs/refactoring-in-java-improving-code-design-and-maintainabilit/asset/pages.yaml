  md: 'In a security context, the most valuable input to fuzz is often data that traverses
    a trust boundary. A trust boundary is a point where data or program execution
    transitions between different trust levels or where data and commands are exchanged
    with entities with varying privileges. Trust boundaries can be found at distinct
    locations in a system where all subsystems and their data have equal trust. For
    instance, an execution boundary occurs when an application elevated privileges,
    such as root access. Data trust boundary occurs when data originates from an untrusted
    source, such as user input or a network socket. it’s more critical to fuzz code
    that crosses a trust boundary, than code dealing with a configuration file accessible
    by any user, or only to privileged users.


    Every fuzzer can be put into one of two categories:


    +   * **Mutation-based fuzzers**: These fuzzers use existing data samples and
    make changes to create new test cases. They take an initial input or test case
    and modify it in various ways, such as changing random bits or values, to see
    if modifications trigger unexpected behavior or vulnerabilities in the software
    being tested. Mutation-based fuzzers are good at finding types of bugs or vulnerabilities,
    especially when they have an initial set of valid inputs to work.


    +   * **Generation-based fuzzers**: These fuzzers build test cases by understanding
    the structure and rules of the target protocol or file format. Instead of modifying
    existing data samples, they generate new data that follows the specific format
    and logic required for testing. These fuzzers are good at exploring different
    aspects of a program or system because they can create a wide range of test cases
    based on their knowledge of the protocol or file format.


    Now, we’ll delve into subcategories within these two groups. There’s no universally
    agreed-upon list of fuzzing categories, but I liked the approaches in the book
    *Fuzzing: Brute Force Vulnerability Discovery (see Further reading)*, so I’ll
    try to resume them.


    # Pre-generated test cases


    As mentioned earlier, the **pre-generated test cases** method involves understanding
    supported data structures and acceptable value ranges. Test cases are then crafted
    as hard-coded packets or files, designed to test boundary conditions or challenge
    the specification itself. These test cases prove valuable for assessing how accurately
    the specification has been implemented on various systems. While this method requires
    substantial upfront effort in test case creation, its advantage lies in its reusability
    across multiple implementations of the same protocol or file format. A limitation,
    however, is that fuzzing is finite as there’s no random element; once the list
    of test cases is exhausted, fuzzing concludes.


    # Random


    The **random approach** is the simplest yet effective method. It involves hurling
    pseudo-random data at the target while hoping for the best (or worst, depending
    on your perspective). Surprisingly, vulnerabilities in critical software have
    been uncovered using this technique. The challenging part is identifying the cause
    of an exception or a server crash from tons of random bytes. Capturing'
