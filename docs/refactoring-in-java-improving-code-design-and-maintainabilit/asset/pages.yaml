    # # Bad smells in the microservices architecture


    Just as there are bad smells in code - issues that hide between methods and classes
    – there are also problems related to how software components work together in
    a software architecture. These are recurring patterns or, rather, anti-patterns,
    and when we see them, we should be suspicious and take action if needed. Let''s
    take a look at some of the most common ones.


    # # Shared persistence


    > “Don''t cross the streams,” as the Ghostbusters used to say. It''s a bit like
    what happens with shared persistence. We talked about shared persistence when
    two or more microservices share the same persistent data, such as a database,
    Redis instance, or a cache. This can cause a few problems. First, if services
    A and B try to read and write to the same data layer at the same time, synchronization
    problems can occur. When one service might have been written by another, and vice
    versa.


    The most significant issue, in my opinion, is the interdependence that arises
    when you need to make changes to the data structure itself. For example, simply
    changing, adding, or removing a column from a database table could become a big
    problem and require modifying both microservices, even if one of them isn''t affected
    by the change. If we wanted to represent this situation in a simple yet effective
    way, we would have a diagram like this:'
  merge: -1
  pgno: 238
- img_proc: true
  md: '![](img/413a83eb121d9ef596d0d310811a5be2_239_0.png)


    Figure 9.4 – Two (micro) services rely on the same data storage


    The most obvious solution is to maintain a separate data storage layer for each
    microservice. This means that each microservice owns its data, and it''s responsible
    for providing functions to access that data. When someone needs to use that data,
    they''ll use the microservice as a kind of data abstraction. They won''t need
    to know where or how the data is stored. Data owned by a specific microservice
    should not be duplicated elsewhere.


    However, it''s essential to note that having a non-shared data storage layer doesn''t
    necessarily mean having a separate database for each microservice. It depends
    on the granularity of the service. For example, if you have a microservice that
    handles customers and their shipping addresses (such as in an e-commerce platform),
    you might have a database specific to this service. Customers and addresses are
    likely interconnected, so you might have relational tables linked; for example,
    by a foreign key. If you want to make your microservices more granular, say, a
    customer service and an address service, you can''t completely separate and unrelated
    databases. However, you can ensure that the customer service writes to the CUSTOM
    table and the address service writes to the ADDRESS table. These tables will be
    linked by a foreign key but will remain distinct. Data integrity is guaranteed
    by the properties of the relational database (ACID properties);


    | CUSTOMER table |

    | ID | NAME | SURNAME | ... |

    | --- | --- | --- | --- |

    | 31284 | JOHN | DOE | ... |


    | ADDRESS table |

    | ID | CUSTOMER_ID | CITY | COUNTRY | ... |

    | --- | --- | --- | --- | --- |

    | 361224 | 31284 | BRUGES | BELGIUM | ... |'
