  md: '3. Unused variables or functions: If variables or functions are defined but
    not used anywhere in the program, they are considered dead code.


    You don''t want dead code in your project: it makes it harder to understand, increases
    maintenance costs, and potentially introduces bugs.


    So, please, if you are aware of dead code in your project – and modern IDEs are
    now perfectly capable of doing that – please remove it. No – don''t comment it
    out! Get rid of it; if you want to recover it, you''re be using a version control
    system (such as Git or Subversion) that will do the trick.


    Watch out also for so-called dead comments. As mentioned before, our view on comments
    is that there should be as few as possible and focused on explaining why/what
    something is doing. In an ideal and fantastic world, the code itself should be
    able to explain without extra comments. What often – very often – happens is comments
    don''t get along with the code, becoming not only irrelevant but also sometimes
    misleading. Even if you''re taught to add lots of comments to code (at least,
    I was), please try to keep it to a minimum.


    What we''ve said about dead code of course can be applied to modules, services,
    or even individual features. It''s quite common to see the proliferation of modules
    and services deployed in production that are not actually used, and their only
    effect is to consume precious (expensive) resources. Typically, everyone forgets
    about them until it''s time to update them (for example, due to a discovered vulnerability
    among their dependencies) or when someone realizes they''re costing a lot of money
    in hardware resources! In the case of features, it''s similar: why keep unused
    features that make the code more complex without any real benefit? Get rid of
    them at the first opportunity, and you won''t regret it!


