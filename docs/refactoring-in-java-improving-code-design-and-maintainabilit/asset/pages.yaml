  md: 'wondered is: why does bad code exist? Assuming it is not due to laziness or
    incompetence of individuals, let''s quickly explore some contingent causes that
    contribute to the situation we are trying to address.


    # Causes of bad code


    As mentioned in the previous chapter, I don''t have the intention of blaming those
    who write bad code. It has happened in the past, it still happens, and it will
    happen again (I can already imagine my colleagues nodding as they read these lines!).
    In the vast majority of cases, those who write bad code do so without realizing
    it we are human and can only handle a certain number of tasks at once. In our
    hearts, we have the desire to do a good job, something to be proud of, but in
    our minds, we have deadlines, pressure, and we generally work within an ecosystem
    that we don''t fully control. Very often, companies are complex systems that may
    have clear rules (for example, regulating the methodologies to follow), but they
    have to deal with increasingly hectic world, with time-to-market pressures, and
    the need to compete fiercely. There are ways things should be the way they actually
    are. As software engineers, we guide or support the work of the company and often
    find ourselves interacting with mentalities and needs that are very different
    from our own. Sometimes, the result is sacrificing quality and experiencing a
    bit of frustration. Almost always, this leads to having a bad code base. But why
    does this happen? If we could identify some common causes of bad code, maybe we''d
    be able to recognize them and avoid them.


    # Deadlines


    This is definitely going to be a controversial point. For many, blaming deadlines
    as the cause of bad code is just an excuse to hide laziness or incompetence. It''s
    not true that you don''t want to put in the effort to think and do things properly.
    In some cases, that may very well be true. Over the years, I''ve often observed
    – although I must say, not always and to a lesser extent we go on – a disconnect
    between management and engineers. There''s often a tendency to "sell" the solution
    without paying much attention to how long it will take to implement it. As a result,
    developers end up not negotiating a deadline but simply being subjected to it.
    So they take shortcuts, may cut back on testing, documentation, and overall quality
    (violating some of the principles seen so far, such as keeping code readable or
    without repetitions).


    On this matter, I advise you to take a look at what''s called the project management
    triangle:'
