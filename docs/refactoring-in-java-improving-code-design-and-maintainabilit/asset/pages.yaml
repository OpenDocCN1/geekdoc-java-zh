    # Architectural patterns


    In software, we can organize things in different ways, and these organized structures
    are called software architecture patterns. Many of them have been proven and to
    work well for solving different problems. Each pattern arranges them in a specific
    way to fix particular issues in software.


    But let''s keep it interesting and not dive into a super long list of these patterns.
    Instead, we''ll look at a few of the most important and commonly used ones. This
    way, we can understand the main ideas without getting overwhelmed by all the possibilities.


    # Layered architecture


    The layered architecture pattern (also called the n-tier architecture pattern)
    is probably the most widely used design approach. It''s the go-to for many Java
    Enterprise Edition (EE) applications, and it''s well-known among architects, designers,
    and developers. This pattern aligns with typical communication and organizational
    setups in most companies, making it a logical and common choice for developing
    business applications.


    In the layered architecture, components are organized into horizontal layers,
    each with a specific role in the application (such as presentation or business
    logic). While the pattern doesn''t prescribe a fixed number of layers, common
    setups have four: presentation, business, persistence, and database. Sometimes,
    the business and persistence layers are coupled for simplicity. Smaller apps have
    three layers, while larger ones could have five or more.


    Each layer has a distinct responsibility. For instance, the presentation layer
    handles user interfaces and communication, while the business layer executes business
    abstractions. Layers simplify tasks. The presentation layer focuses on displaying
    information, not retrieving it. Similarly, the business layer concentrates on
    business logic, leaving data retrieval to the persistence layer, which then passes
    data to the business layer for processing and onward to the presentation layer
    for display:'
