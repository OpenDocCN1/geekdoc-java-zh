    # Moving features between objects


    As we have already mentioned several times, and as those who have been in this
    profession for a few years know organizing our code is one of the most challenging
    parts. Personally, I believe I have never managed to get the design of a software
    project on the first try. But, once again, the software is fortunately (or unfortunately!)
    malleable, so with the right limits and a good amount of refactoring, we can move
    methods and fields from one class to another without too much difficulty. We can
    decide to extract a class or remove one and inline it. Above all, we can eliminate
    the so-called dead code. But let''s start something.


    # Moving a method or field


    This refactoring is quite basic (Martin Fowler calls the "bread and butter" of
    refactorings), but it is one of the most frequently performed ones. This is because,
    as we have already mentioned, it is good practice to maintain a certain modularity
    in your software project so that classes, packages, and so on are grouped closely
    by the context in which they operate. For example, in one package, we may place
    all classes responsible for managing user information, while in another, we may
    gather all clients for external services. There is no single criterion, but rather,
    often, a certain subjectivity. This is why it often happens that methods or individual
    fields are moved from one class to another. This movement, guided by the principle
    of keeping related things together and separating things that must be separate,
    simplifies the code.


    This is one of those cases where doing it is simpler and more intuitive than explaining
    it, but I''ll try to give you Martin Fowler''s "recipe" for it, perhaps simplifying
    it a bit.


    Transferring the method from the source class to the target class involves several
    steps that must be followed to ensure a successful refactoring process:


    +   1. Examine the dependencies and other class members that the method utilizes.
    Determine if it''s necessary to relocate them to the new class as.


    +   2. Check whether the method is referenced by a superclass or subclass. If
    it''s being used by these classes, it may not be feasible to move the method.


    +   3. Establish the method in the target class and replicate existing code into
    it. If the relocated method relies on an instance of the original class, you can
    pass it as a method parameter.


    +   4. Delete the code within the old method and direct the call to the new method.
    (This is optional, you could also use a feature toggle.)'
