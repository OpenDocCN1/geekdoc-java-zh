    # Good code is reusable


    As engineers, we often solve big problems by breaking them down into smaller ones
    (the good old divide et impera). Guess what? We keep running into the same small
    problems over and over across different projects. So, if we or other engineers
    have already figured out a solution to one of these recurring problems, it makes
    sense to reuse it. It saves time and reduces the chances of introducing bugs because
    we know the solution has already been tried and tested.


    The concept of reusability is tied to two key practices: establishing clear layers
    of abstraction and developing modular code. By implementing clean layers of abstraction
    and modularizing our code, we naturally break down solutions into separate code
    components that are loosely interconnected. This approach significantly enhances
    the ease and safety of code reuse and generalization.


    # Don''t make assumptions while writing your code


    Don''t make assumptions is a good piece of advice for life in general – but I
    don''t want to be your life coach here, so don''t worry.


    There is no specific definition for an assumption, but I can provide you with
    a recent example I encountered. Imagine you are responsible for managing an e-commerce
    system and need to maintain records of purchases. Each purchase is characterized
    by a set of properties, and each purchase has a unique identifier called the ID
    It is important to note that this ID is a numeric value that increases sequentially.
    For instance, if a purchase has x, the subsequent purchase will be identified
    as x+1, and so on.


    Alongside the purchase management system, there is a typical component found in
    most companies called a reporting system (in my mind, I can hear a noise rising,
    as in the movie Frankenstein Junior). The reporting system relies on determining
    the relative recency of purchases. The logical basis for this comparison is typically
    a field such as created_on or a similar attribute. However, the reporting system
    in this case assumes that the ordering of purchases is solely dependent on the
    id field. It assumes that the lower the id, the more the purchase.


    Now, let''s consider a scenario where the maintenance of the purchase management
    system needs to migrate data. It becomes convenient to change the ID generation
    process to use random alphanumeric strings instead of numeric increments. The
    reporting system, which had assumed the IDs were numeric and sequentially incremental,
    ceased to function correctly.


    Assumptions can lead to bugs when code is reused because the reused code may rely
    on certain conditions or behaviors that are not met or consistent in the new context.
    These bugs may kick in many different ways, including the following:


    +   - Contextual differences: When code is reused in a different context or environment,
    the assumptions made during the original implementation may not hold true anymore.
    The'
