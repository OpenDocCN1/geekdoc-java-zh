  md: 'When you work on a project, a task, or anything else, always keep in mind why
    you chose to do it. Ask yourself, “Why am I doing this?” It’s not just about staying
    motivated; there’s more to it that.


    First of all, this will help you avoid feeling like a random monkey hitting keys
    on a keyboard. It will also help you understand how your work contributes to the
    development of a project or a company. Having clear goals for your work, whether
    they’re short-term, medium-term, or long-term, will keep you focused on your task
    without getting distracted by other things. If your work has a specific purpose,
    and even better, if that purpose is something you believe in, your productivity
    will increase, and your work will be better.


    Knowing why you’re doing something, and understanding the purpose behind it, will
    lead to better decision-making. When faced with doubts or uncertainties, having
    a clear goal in mind will guide your choices and prevent future disappointments.
    When we have detailed plans for actions at both upcoming milestones and our ultimate
    goals, every decision will align seamlessly.


    One of the decisions you’ll have to make includes prioritizing tasks within a
    project. Should you do one before the other? Which task will take more time compared
    to the value it will generate? Well, if you know what you’re doing — in other
    words, if you have a clear goal — this will likely assist your decision-making
    and set a smoother path toward project completion.


    If you know your goal, you can possibly understand how far you are from reaching
    it. In other words, knowing your “why” helps you measure your progress. Imagine
    a team or a developer who is simply to do that, completely disconnected from the
    context, saying “Write a method that returns your output input” — I don’t think
    this happens much after school, but let’s say it does. A person wouldn’t have
    the slightest idea of how their work is contributing and where they stand on the
    journey toward the final goal. This person would do a worse job.


    In a book on refactoring, it’s important to mention that understanding the “why”
    behind things helps in writing better code, and when necessary, refactoring it
    more effectively. When writing the reasons for something, perhaps in a comment
    alongside complex code, can assist developers in rewriting it more efficiently.
    This, along with good test coverage and everything we’ve already discussed in
    the previous chapters, greats aids the comprehension of the current code and any
    potential rewriting efforts.


    Ask questions, and keep asking yourself and others. If you’re in a position where
    a manager or a partner is guiding you on task prioritization — for instance, if
    you work within a framework that involves a product owner — ask why why one thing
    chosen over another. What benefits will it bring? How much will it cost, and how
    much will it earn for the company? Is there data to support this decision? I’m
    not saying to start a war, absolutely not, but always try to “challenge” your
    colleagues in this.


