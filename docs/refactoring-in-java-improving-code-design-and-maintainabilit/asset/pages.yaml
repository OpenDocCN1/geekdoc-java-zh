    was taken, why certain information was sourced from a particular location, or
    why one solution was chosen over other. One of the most frequent questions I ask
    myself when dealing with legacy code is, “Is this mistake or is it intentional?”
    readable code (coupled with the correct amount of tests, code comments, and coding
