  md: 'God objects are hardly testable. A class is easily testable, in general, when
    it is small, focused, and independent of other types. On the contrary, a god class
    operates in the opposite manner. Being a large, all-encompassing entity that controls
    numerous other objects, it becomes tightly coupled to those objects. Consequently,
    testing the god class becomes a daunting task due to its intricate setup and the
    necessity to stub or mock dependencies just to instantiate it for testing purposes.
    You can often become aware when you are writing a god object when it has too many
    collaborators, that is, too many objects need the class itself to work.


    Finally, the main pain point. We always end up with this. A god object makes your
    code harder to read and understand. It is no wonder that the code within these
    classes becomes complex, considering their extensive responsibilities and interactions
    with several you; for example, I am (not) talking about cyclomatic complexity
    here; relying on external dependencies that cause side effects and mutability.
    The cumulative effect of these complexities contributes to the overall complexity
    of the code, creating obstacles in understanding and reducing engineers'' productivity
    and performance.


    The solution is not unique, but the approach can be. It is quite easy to create
    a god object (especially in object-oriented programming) but it can be extremely
    hard to undo them. So, use the god old etpera tecnica (again, the Single Responsibility
    Principle) and split the class into smaller pieces; be guided by your domain and
    the common methods and properties in a class while keeping the classes loosely
    coupled. If classes or methods have a lot of code or functionality in them, break
    them into simple, manageable, testable classes and methods. Finally, delete the
    god object.


    # Summary


    In this chapter, we learned how to spot some – not all – code smells. We covered
    the ones that are the most common. Some of them you will pick up instinctively
    and avoid them as you write code, We tackled duplicated code, long methods, large
    classes, and repeated switches. We also learned to avoid our obsession with primitive
    types (using string for everything is a strong temptation!) and looked at feature
    methods. Finally, we talked about divergent change and its opposite, Shotgun Surgery.
    Oh, let''s not forget about the god object. This is just a partial selection of
    all the existing code smells out there, but I believe it''s a good starting point
    to clear of them.


    A crucial decision to perform any kind of refactoring, especially god object refactoring,
    is good test coverage. In the next chapter, we are going to tackle this extremely
    important matter.


