  md: '![](img/413a83eb121d9ef596d0d310811a5be2_184_0.png)


    Figure 8.1 – A very basic sequence of revisions


    When there is branching (that is, there are different paths) or we have to get
    back to to an older revision, creating a situation where a revision depends on
    one older than the one just before it, the graph changes into a directed tree.
    In this tree, each point may have more than one next point. This creates multiple
    endpoints, representing revisions without any changes (the “latest revision on
    each branch”). In theory, the tree may not have a favorite endpoint (the “main”
    latest revision), usually, one endpoint is chosen as the HEAD. If a new revision
    is based on the HEAD, it either becomes the new HEAD or starts a new BRANCH:


    ![](img/413a83eb121d9ef596d0d310811a5be2_184_1.png)


    Figure 8.2 – Branching from the trunk


    The list of revisions from the starting point to the HEAD, called the trunk or
    mainline in graph theory, makes a simple straight-line graph. If a revision can
    be based on more than one previous revision (when a point can have more than one
    parent), it’s called a MERGE. This is one of the trickiest parts of revision control.
    It often happens when changes occur in different branches (usually two), and these
    changes are combined into one branch that includes both sets of changes. If these
    changes overlap, it can be hard or even impossible to merge them without manual
    help or rewriting (these situations are known as conflicts):'
