    # Trunk-based development


    Trunk-based development is a way of working where all developers make their changes
    directly in the main part of the code, which we call the trunk. This is the part
    of the code that''s ready to be used in the project. Developers are encouraged
    to save their work often and use special techniques to manage changes that aren''t
