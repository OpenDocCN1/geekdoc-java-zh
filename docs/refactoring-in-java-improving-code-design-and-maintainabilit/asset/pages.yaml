  md: '# Static and Dynamic Analysis


    On our way to clean, robust, and maintainable code, we''ll often need to "take
    a look" at how our software works and how it''s written. After identifying the
    code smells and doing some refactoring steps (in fact, we should never stop doing
    this!), it can be useful to scan our code for design flaws, security vulnerabilities,
    and more.


    This analysis can be carried out directly on the code – that is, static analysis
    – or on the running program – that is, (without too much imagination) dynamic
    analysis.


    Static and dynamic analysis tools scrutinize code to identify issues and inefficiencies.
    Their insights provide the foundation for improvements, and this is where refactoring
    comes into play.


    In this chapter, we''re going to talk about the following topics:


    +   * What is static analysis?

    * Why do we need static analysis?

    * Some static analysis tools

    * What is dynamic analysis?

    * Some dynamic analysis techniques


    # What is static analysis?


    As the name may suggest, **static analysis** in the context of Java (or any programming
    language, actually) refers to the process of analyzing source code without running
    it. It is a technique that''s used to find issues, potential bugs, security vulnerabilities,
    and other issues in the code before it is run or compiled. Static analysis tools
    are used for this purpose (we''ll jump into that shortly).


    There are lots of reason to perform static analysis; let''s see some of them.


    # Code errors or bad practices


