    \n# True immutability – the builder pattern\n\nTo make an object truly immutable\
    \ in each of its fields, we recommend using the **builder pattern**.\n\nThe builder\
    \ pattern is a design pattern used to construct complex objects by step. It separates\
    \ the construction of an object from its representation, allowing you to create\
    \ different representations of the same object.\n\nHere's how the builder pattern\
    \ works:\n\n+   * **Create a builder class**: First, you create a separate builder\
    \ class for constructing an object. This builder class has methods for setting\
    \ the various attributes of the object you want to create.\n\n+   * **Set attributes**:\
    \ You use the methods in the builder class to set the attributes of the object.\
    \ Each method typically returns the builder object itself, allowing you to chain\
    \ method calls (this is known as method chaining).\n\n+   * **Build**: When you\
    \ have all the desired attributes, you call a **build** method on the builder\
    \ object, which constructs and returns the final object with the specified configuration.\n\
    \nA builder class for the **Person** class would look like this:\n\n```\npublic\
    \ final class PersonBuilder {\n    private String name;\n    private final String\
    \ taxCode;\n    private PersonBuilder(String taxCode) {\n        this.taxCode\
    \ = taxCode;\n    }\n    public static PersonBuilder builder(String taxCode) {\n\
    ```"
