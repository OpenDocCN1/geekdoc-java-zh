  md: '# Good code is reliable


    If I have to think of a definition for “reliable,” it brings to mind a friend
    of mine who, when they say they will do something, they do it and only that. Nothing
    more, nothing less. So, think of reliable code as your friend who always agrees
    to help you you in the best possible way—no surprises, as Radiohead used to sing.
    I could give you an example of unreliable code not so far from certain things
    I have encountered in the past. For instance, imagine you have an entity in your
    domain represented like this:


    ![](img/413a83eb121d9ef596d0d310811a5be2_42_0.png)


    Table 2.1 – Example entity


    Both id and taxCode are of type String and are unique within the domain. That
    means there cannot be two students with the same id or the same taxCode.


    I also have an exposed method from the Student interface that is written like
    this:


    ```

    public String getUniqueIdentifier();

    ```


    Apparently, this signature of method is correct, because it does not expose the
    internal structure of the object. The object, it also has been named getId() or
    getTaxCode() and that is exactly the point. While looking at the implementation,
    we don’t know if we will get taxCode or id when using it. When we use getUniqueIdentifier(),
    we realize that the behavior is variable and depends on the specific implementation.
    If we were to use this method within a payment and invoicing system where we specifically
    need taxCode, this method would be unreliable. One possible solution could to
    expose two separate methods that we know exactly which information we are reading
    at that moment. Alternatively, another solution could be to expose an additional
    method called getTaxIdentifier() that specifically returns taxCode. This way,
    you would have separate methods providing clear and unambiguous access to each
    piece of information without exposing the internal structure.'
