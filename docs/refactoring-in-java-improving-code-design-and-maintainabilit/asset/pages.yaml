    # Comments and documentation


    You can comment on Java code in three ways:


    +   * Use Javadoc comments (/* ... */) for describing classes, interfaces, methods,
    and fields (these are sometimes called documentation comments)

    * Use single-line comments (//) for brief explanations, clarifications, or marking
    TODOs (there are sometimes called implementation comments)

    * Use block comments (/* ... */) for more extended explanations, especially when
    explaining intricate algorithms


    The Java Style Guide has a specific section for Javadoc''s comments only since
    they are the most important ones. Documentation (Javadoc) is crucial to explain
    to others how to use your code, and that''s why it is important to write it when
    you write it, right?

    Since we''ve already discussed everything about the form that comments should
    take in code, let me say a few words about the substance of comments. Comments
    for generating Javadoc are crucial, no doubt about it. They don''t explain how
    the code works but rather the behavior of the method. They clarify any specifies
    among the parameters and the situations in which exceptions are raised.

    Hower, I''ve often seen comments being missed. First and foremost, commenting
    out code that is considered unnecessary is not a good practice. If the code is
    unnecessary, please delete it. If you''re concerned about making mistakes, remember
    that VCSs act as a safety net, allowing you to retrieve deleted code with minimal
    effort.


    At times, I come across comments related to the implementation. In the case of
    particularly complex code that is hard to follow, a comment can be helpful. However,
    it should never be seen as a substitute for cleaning the code to make it more
    understandable. If the code isn''t written well, don''t think you can fix it by
    adding comments. Rewrite the code. Additionally, it is common for some comments
    not to get updated when the logic of the method changes. The method does one thing
    but the comment says something else, leading to confusion.


    Other types of comments I don''t find particularly useful, except for rare exceptions,
    are the infamous TODO and FIXME. If you need to fix something, just fix it. If
    you can''t do it away, record the task in your task management system (for example,
    Jira) and move on. Putting FIXME in the code only adds confusion. When someone
    sees that FIXME in 2 years, they''ll wonder, "Why hasn''t it been fixed yet? Maybe
    it''s not important." The same goes for TODO.


    In summary, advise to write as few comments as possible in your code. Instead,
    focus on explaining why you''re making a particular choice and the reasons that
    led you down one path of another. As Robert Martin says in Clean Code, you have
    to explain your intent.'
