  md: "Choosing middle man over message chains aligns with the principles of the Law\
    \ of Demeter, often summarized as \"only talk to your direct dependencies.\" This\
    \ guideline encapsulates a design philosophy advocating for encapsulation and\
    \ reduced coupling in object-oriented systems. We talked about the Law of Demeter\
    \ in Chapter 2.\n\n# Feature envy methods\n\nWhen we try to break down our code\
    \ into components that make sense based on our use case and domain, we're basically\
    \ dividing the code into zones. One of the keys we need to be careful about is\
    \ maximizing interactions within the zones and, conversely, minimizing interactions\
    \ between different zones. Feature envy is a warning sign in the code, describing\
    \ when another object's fields to perform an operation simply instructing the\
    \ object on what to do. As a simple example, let's consider a method that calculates\
    \ a price based on a payment request:\n\n```\npublic Double calculatePrice(PaymentRequest\
    \ paymentRequest);\n```\n\nEverything seems fine until we realize that we need\
    \ the order and some user information to calculate the price. When we start writing\
