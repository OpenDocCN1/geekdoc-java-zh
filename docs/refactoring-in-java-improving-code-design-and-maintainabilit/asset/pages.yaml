    # # The Actor Model


    I think it''s worth mentioning the Actor Model because it''s truly interesting,
    serving as the foundation for reactive systems. The Actor Model is nothing new;
    it was introduced by Carl Hewitt in 1973 as a theoretical model for managing concurrent
    computation. Its practical relevance became evident as the software industry recognized
    the challenges associated with implementing concurrent and distributed applications.
    In other words: managing threads is not suitable anymore and we do not have faster
    CPUs; we only have CPUs with more cores!


    An actor is a self-contained computational unit, embodying several crucial characteristics
    that distinguish it within the Actor Model:


    +   1. **Encapsulation of state and logic:** An actor encapsulates both its state
    and a portion of the application logic. This encapsulation ensures that an actor''s
    internal workings are shielded from direct external access, promoting modular
    and maintainable code.


    +   2. **Asynchronous message interaction:** Actors communicate exclusively through
    asynchronous messages, avoiding direct method calls. This design choice enhances
    the responsiveness of the system, as actors can continue processing messages independently
    without waiting for immediate responses.


    +   3. **Unique address and mailbox:** Each actor possesses a unique address and
    maintains a mailbox for incoming messages. The address serves as a distinct identifier
    in the system, while the mailbox provides a mechanism for other actors to deliver
    messages asynchronously.


    +   4. **Sequential message processing:** Messages in an actor''s mailbox are
    processed sequentially in the order of their arrival. The default implementation
    of the mailbox model often adopts a First-In-First-Out (FIFO) queue, ensuring
    predictable and ordered execution of messages.


    +   5. **Tree-like hierarchy:** The actor system is organized in a hierarchical,
    tree-like structure. This hierarchy facilitates the organization of actors, with
    each actor having a specific place and role within the larger system.'
