  md: 'tempting. As time goes on, more developers join the project, and the code base
    grows larger and more complex. The neglected issues start to accumulate, making
    the code harder to understand and maintain. The lack of consistent conventions
    leads to confusion, reduces code readability, and introduces errors. Additionally,
    because the existing issues were not addressed, developers may feel less motivated
    to maintain code quality. They might think, "If there are already duplicated snippets,
    the code base becomes a tangled mess of poorly organized, duplicated, and hard-to-read
    code. New developers joining the project struggle to make sense of it and find
    it increasingly difficult to change without introducing bugs or breaking functionality.


    It''s like a snowball effect, and things can get pretty messy in no time. And
    this kind of mess produces debt; you re-pay technical debt with developing in
    new features.


    # No code review process


    When we started programming, maybe back in school, it often happened that we did
    it alone. You wrote the code, tested it in some way, and that was it. The code
    and the design only needed to make sense to us and no one else.


    When working in a team, it''s a good idea to implement code review mechanisms.
    A code review is the process of reviewing and examining code to improve its quality,
    identify issues, and ensure adherence to standards – we''ll deliver that in Chapter
    8. Code reviews are also useful to make the code we write "consistent" and clear
    for all team members. When code reviews are absent, the code can become subject
    to personal preferences, may contain errors, or have room for improvement in terms
    of performance. Some people see the process as a distraction from business activities;
    some developers see it as a hindrance to their own tasks. Sometimes, of course,
    even reviews cannot address deep-rooted problems. However, they at help identify
    major "issues" that may have slipped the individual developer, who was focused
    on solving complex problems. It happens more often than you might think.


    In Chapter 8, we will introduce the Pair Programming practice, which can be used
    as a substitute for code reviews.


    # Insufficient domain or technical knowledge


    Sometimes, the reason behind bad code is simply that the people who worked on
    it were not aware of the application domain or the technologies being used. These
    are different aspects but somewhat related.


    When lacking domain knowledge, it''s easy to misinterpret requirements or write
    the logic in the wrong place (maybe not knowing that it already exists elsewhere).
    The situation gets worse when the code is already messy, and we have to work on
    it without really knowing what we''re doing. In this situation, even with the
    purest of intentions, an apparently unused if statement or changing how an object
    is created requires careful consideration (and adequate test coverage, something
    else we''ll tackle later).'
