    # Graph structure


    In graph theory, think of revisions like a tree growing from a main line. Picture
    branches coming out of this main line, forming a shape. Even though it''s more
    complex and looks like a graph, you can simplify it in your mind as a "tree with
    merges" for practical use.


    Revisions happen one after another over time and can be put in a specific order,
    either by revision number or the time they were made. Each revision is based on
    the ones before it, sometimes, you can completely replace an earlier revision
    by getting rid of it and putting in new stuff. In the simplest case, with no extras
    or undoing, each revision is only connected to the one just before. The latest
    version is called the HEAD revision. In graph theory, if you think of each revision
    as a point and each connection between revisions like an arrow (usually going
    from older to newer, following the timeline), this setup makes a straight-line
    graph:'
