    # Event-driven architecture


    This is another common type of architectural pattern that can also be seen as
    a nuance of microservices. To put it simply, it involves designing a structure
    that recognizes events happening in the system—something that occurs—and making
    it real by producing some kind of result. The examples of “things that can happen”
    are potentially endless: a user signs up for the platform, a thirdparty system
    calls one of our webhooks, and an error occurs during some kind of process. For
    each of'
