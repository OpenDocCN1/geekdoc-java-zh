  md: "JaCoCo offers various types of code coverage analysis, including line coverage,\
    \ branch coverage, and method coverage. It instruments the Java bytecode during\
    \ the build process to collect execution data, which is then used to generate\
    \ coverage reports.\n\nJaCoCo primarily provides three significant metrics:\n\n\
    +   1. **Line coverage** indicates the extent of code that has been executed based\
    \ on the number of Java bytecode instructions called by the tests\n\n+   2. **Branches\
    \ coverage** shows the percentage of exercised branches in the code, usually associated\
    \ with if/else and switch statements\n\n+   3. **Cyclomatic complexity** reflects\
    \ the code's complexity by quantifying the number of paths required to cover all\
    \ the possible paths through a linear combination\n\nTo illustrate with a simple\
    \ example, if the code contains no if or switch statements, the cyclomatic complexity\
    \ will be 1, as only one path is needed to cover the entire. In general, the cyclomatic\
    \ complexity represents the number of test cases required to achieve full coverage.\n\
    \nTo illustrate how JaCoCo works, let's start with a very simple example. It is\
    \ not my intention to create a tutorial on this tool - there are plenty of them\
    \ online - but I would like to show you its main features so that you get a rough\
    \ idea of how it works.\n\nLet's suppose we have a project consisting of only\
    \ one class named Calculator, defined as:\n\n```\npublic class Calculator {\n\
    \    public Integer sum(Integer a, Integer b) {\n        return a + b;\n    }\n\
    \    public Integer subtract(Integer a, Integer b) {\n        return a - b;\n\
    \    }\n    public Integer multiply(Integer a, Integer b) {\n        return a\
    \ * b;\n    }\n}\n```\n\nAs you can see, the Calculator class exposes three simple\
    \ methods that take two integers as input and return, their sum, difference, and\
    \ product. Let's proceed to write the corresponding test class, which we will\
    \ define as:\n\n```\nclass CalculatorTest {\n    private final Calculator calculator\
    \ = new Calculator();\n    @Test\n    void sum() {\n        var sum = calculator.sum(1,\
    \ 4);\n        assertEquals(5, sum);\n    }\n    @Test\n    void subtract() {\n\
    \        var sum = calculator.subtract(10, 4);\n        assertEquals(6, sum);\n\
    \    }\n}\n```"
