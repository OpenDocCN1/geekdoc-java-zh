  md: 'Knowledge gaps can also be purely technological. It may be some of us are new
    and don''t yet have a clear understanding of the technology stack. This often
    leads to overly complex solutions or, on the contrary, workarounds and hacks.
    It can happen that the developer lacks discipline and the habitual use of good
    practices that we''ve tried to explain in this chapter. These practices – contrary
    to what it may seem – exist to slow us down, but actually enables us to produce
    high-quality code quickly and consistently.


    We have tried to investigate some of the most common causes of bad code. I realize
    I have relied on my own experience to some extent, but I believe that some of
    the concepts expressed here are universal and worth considering, such as the Broken
    Window theory or the project management triangle. The next manager asks you to
    do something well and in less time, you will hopefully have an additional argument
    on your side!


    # Summary


    Speaking of refactoring, it is crucial to understand what needs to be refactored;
    in other words, it is necessary to distinguish good code from bad code. In this
    chapter, we have shown what is typically meant by bad code, providing an overview
    of its characteristics. When these characteristics are lacking, it is likely that
    refactoring is needed. When discussing good code, we also talk about Clean Code;
    which this topic learned how to recognize and, hopefully, write it. Good code
    is also SOLID code, and we briefly touched upon the meaning of as well. Lastly,
    after understanding what good code is, we investigated some causes of bad code;
    the hope is that you will alert if you find yourself in one of the described situations.


    In the upcoming chapter, we will address a set of warning signs—elements in your
    code that should alert you and prompt contemplation on refactoring your code.


    # Further reading


    +   * mscharhag, ISO 8601 durations in Java: https://www.mscharhag.com/java/iso8601-durations

    * Tom Long, Good Code, Bad Code, Manning

    * Stop calling bad code, by Joel Polski: https://blog.pragmaticengineer.com/bad-code/

    * The law of leaky abstraction, by Joel Polski: https://www.joelonsoftware.com/2002/11/11/the-law-of-leaky-abstractions/

