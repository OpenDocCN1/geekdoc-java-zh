    Writing less code (or rather, and having it written by tools) is a good thing:
    it means less code to maintain, trivially, and it means those portions of code
    are in charge of dedicated tools that will then write that code in the best possible
    way.


    In this chapter, we’re going to cover the following main topics:


    +   - What is metaprogramming?


