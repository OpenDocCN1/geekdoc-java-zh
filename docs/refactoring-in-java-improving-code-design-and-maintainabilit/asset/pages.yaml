  md: 'Figure 8.9 – In branching, each new feature is developed on a dedicated branch


    Again, let''s see the workflow in detail:


    +   1. **Set up feature branches:** For each of the tasks you''re working on,
    create a dedicated branch.

    Each of these branches should originate from the MAIN branch.


    +   2. **Develop the feature:** Implement your feature into the Feature branch
    and commit as many times as you need. This branch must contain only commits related
    to that particular feature and nothing (when I say nothing, I mean nothing: remember
    that this change set will go straight to production day – you don''t want to mix
    things up).


    +   3. **Initiate a pull request:** When your feature is complete and you''ve
    tested everything and you''re happy with that, you can create a pull request to
    merge your changes into the MAIN branch.


    +   4. **Examine and approve:** The changes are checked by other developers, who
    will give their approval or some modifications (basically, they can start a conversation).
    In this way, potential issues and errors can be caught before the code becomes
    part of the MAIN branch.


    +   5. **Merge the feature branch:** Now that your feature has been implemented,
    and the pull request has been examined and approved, the Feature branch can be
    merged back into the MAIN branch.


    +   6. **Tidy up:** Delete the Feature branch.


    As you can see, we have raised a bit the complexity of getting the MAIN branch
    to stay as clean as possible. The primary goal is to maintain the stable version
    on the MAIN branch while supporting concurrent development. In general, the code
    can be well-organized and tested (no merges into the MAIN branch until all tests
    are passed). Change tracking is improved. Using this strategy, we can insert code
    reviews in our workflow (see the next section).


    On the other hand, new challenges arise when we are managing and updating multiple
    branches, with potential delays in merging changes into the MAIN branch due to
    lengthy reviews. Of course, having multiple branches can create conflicts.


    Now, let''s look at a very, very popular branching strategy.


    # GitFlow


    **GitFlow** is a way of managing branches in Git. It uses two long-lasting branches,
    MAIN and DEVELOP, which throughout use short-lived branches such as FEATURE, RELEASE,
    and HOTFIX. These are created when needed and removed once they''ve done their
    job.


    The MAIN branch holds the stable, ready-to-use code, while the DEVELOP branch
    is where all the active development happens. FEATURE branches are for working
    on new features or changes, RELEASE branches for for getting ready for a new release,
    and HOTFIX branches are for quickly fixing critical problems in the production
    code.'
