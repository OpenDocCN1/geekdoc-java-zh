  md: 'underlying dependencies, data structures, system configurations may be different,
    causing the code to behave unexpectedly or produce incorrect results.


    +   - **Implicit dependencies**: Reused code may have implicit dependencies on
    external factors, such as specific data formats, database schemas, or API responses.
    If these dependencies are not properly understood or communicated, using the code
    in a different context can result in issues and unexpected failures.


    +   - **Assumed constraints**: The reused code might make assumptions about the
    limitations or constraints of the original system. These assumptions could include
    factors like data size, frequency of operations, or expected usage patterns. If
    these constraints are exceeded or not satisfied in the new context, the reused
    code may not handle the situations correctly, leading to bugs or system failures.


    +   - **Compatibility issues**: Reuse often involves integrating different components
    or libraries. If the reused code relies on specific versions or configurations
    of these components, it may not work as intended when used with different versions
    or alternative implementations. Incompatible interactions between reused code
    and other components can introduce bugs or cause instability.


    +   - Limited validation**: Assumptions may not have been thoroughly validated
    during the original implementation. When code is reused, there is a risk that
    the assumptions were only valid in the original case but not in other scenarios.
    Insufficient validation of assumptions can result in bugs that arise when the
    code is reused in a different context.


    # If you make assumptions, identify them clearly


    I am a man who lives by his contradictions, and now I tell you: making assumptions
    is crucial! The important thing is to do it at the right time, in the right amount,
    and for the right things. For example, when we find ourselves working on a completely
    unfamiliar code, it is vital to make assumptions; otherwise, we would be navigating
    through every single line, searching for our countless questions. Another example
    is debugging: when it comes to fixing bugs, by making lots of assumptions, especially
    if you''re familiar with the code. Trust your feeling. Most of the time, when
    someone starts explaining the problem to you, you will already know where the
    bug is hiding. Also, when creating new code, assumptions can be crucial in order
    to build quickly and effectively. Otherwise, we may end up stuck trying to create
    code to handle every possible case, even the ones that are not going.


    At times, making assumptions becomes necessary or simplify the code significantly,
    outweighing any drawbacks. However, when we make assumptions in our code, it is
    crucial to remember that other engineers might not be aware of them. To prevent
    them from inadvertently affected by our assumptions, we need to enforce them.
    There are generally two approaches we can adopt to this:


    +   - Making the assumption “impossible to break”: If we structure the code in
    such a way that it won''t compile if an assumption is violated, we ensure that
    the assumption always remains'
