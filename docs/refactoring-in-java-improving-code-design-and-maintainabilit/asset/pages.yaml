  md: 'As the name suggests, test-driven development, abbreviated as TDD, is a widely
    used software development practice in Agile methodologies, especially in Extreme
    Programming. It is widely regarded as a fundamental technique for achieving higher-quality
    software.


    As the name itself suggests, development is driven by tests, not the other way
    around. The classic development cycle involves the following:


    ![](img/413a83eb121d9ef596d0d310811a5be2_110_0.png)


    Figure 4.10 – The classic development cycle involves designing, coding, and then
    testing. This is flipped around. We start with the tests to arrive at defining
    the design; of course, writing the code in:


    ![](img/413a83eb121d9ef596d0d310811a5be2_110_1.png)


    Figure 4.11 – The TDD cycle starts with the tests


    Attention is given to the functional aspects of the code, specifically the method
    signatures, before the actual implementation of the code. To start with the tests,
    you need to take the perspective of the “client” of your code and primarily consider
    the public methods:


    +   1. The methodology involves immediately writing a test; by executing this
    test (which requires defining an input, invoking a method, and asserting the result),
    the outcome will inevitably be a failure since the implementation does not exist
    yet. This phase is called Red (the color that commonly indicates a failure of
    a unit test in many IDEs).


    +   2. The next step is to implement the missing functionality by writing the
    bare minimum to make the test pass as quickly as possible. When the tests pass,
    you are in the so-called Green phase. Don''t worry if the code you wrote is not
    perfect or if you think it could be improved; that will be addressed in the next
    phase.


    +   3. The third and final phase of TDD is Refactor, which allows you to transform
    your code by adapting, simplifying, streamlining, and removing duplicates. In
    this phase, you do not add new features, as it is purely a refactoring process.
    If you want to add new features, you must go back to the Red phase and start again
    from there.


    Here is a diagram of the TDD process:'
