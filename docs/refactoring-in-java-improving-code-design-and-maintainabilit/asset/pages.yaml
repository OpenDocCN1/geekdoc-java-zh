  md: 'Primitive Obsession is when the code becomes too dependent on basic data types.
    It means that a simple value takes charge of the class logic and lacks type safety.
    In simpler terms, it''s a bad habit of using basic types to represent an object
    in a specific area of focus.


    Let''s take the example of representing a website''s URL. Usually, we store it
    as a string. However, the problem arises because URL has more details and distinct
    characteristics than just being a simple string. It includes elements such as
    the scheme, query parameters, and protocol. When we store it as a string, we lose
    the ability to directly access URL-specific components (the essential parts of
    the URL) without writing additional code. We could use `java.net.URL` instead.


    Strings are often breeding grounds for this kind of issue. Take a telephone number,
    for example. It''s more than just a random assortment of characters. In many cases,
    a proper data type can provide display logic when it needs to be shown in an array.
    Representing such types as strings creates a problem so common that they are referred
    to as string variables.


    If you think about it, it is simple to solve the problem; it is necessary to replace
    the primitive(s) with objects. Take the following example:


    ```

    String url = "https://www.packpub.com/";

    String protocol = extractProtocol(url);

    String host = extractHost(url);

    ```


    This can become however:


    ```

    URL url = new URL("https://www.packpub.com/");

    String protocol = url.getProtocol();

    String host = url.getHost();

    ```


    If you''re curious about how the URL class works, look at its documentation (the
    `java.net.URL` class is included in the Standard Java Library).


    If you have a group of primitives that can go together, you can group them by
    extracting a class, like in the address example we covered in the *Large* sections.


    Now that we''ve dealt with Primitive Obsession, let''s tackle all those classes
    that have little desire to work and make others do it. This is such a playful
    way to say that we will talk about a smell called **middle man**.


    # Middle man


    The middle man is a small smell that occurs when we have a class, or in general,
    an object that does only one thing, and that thing is... delegating the work to
    someone else. We are not suggesting that a class should have only one method to
    be considered a "middle man". Rather, each of its methods should only invoke others.
    So, the question arises spontaneously; why a class in our codebase does nothing?
    In fact, there is (almost never) a reason. Let''s define this class or method
    and ensure that the client calls the "destination" directly. This way, we will
    eliminate unnecessary complexity and ensure that, when we modify or add features
    to the destination objects, we are not forced to modify their middle man.


    To give an example, suppose we have a class structured like this:'
