  md: 'In recent years, a new way of thinking in the Java world has become popular,
    and it is called the reactive paradigm. Let us try to understand the basic ideas.
    As usual, we don''t expect you to fully grasp the reactive paradigm in just one
    part of a book. The Further reading section is there for you, so you can explore
    more about it!


    The reactive is employed in the realm of reactive systems (not only in Java),
    and it was coined in the 2014 Reactive Manifesto, a collective effort by the community
    to develop responsive and distributed systems. The manifesto emphasizes the creation
    of systems that must be:


    +   * Responsive: The system properly responds with minimal and predictable delays
    to inputs to enhance user experience. For example, in a web application following
    reactive principles, user interface components are designed to update quickly
    in response to user interactions. For instance, when a user clicks a button, the
    system responds immediately, providing feedback without noticeable delays.


    +   * Resilient: In the face of a component failure, the system gracefully handles,
    minimizing the impact on overall availability and responsiveness. For example,
    consider a microservices architecture where one service fails due to a temporary
    issue. A resilient system would handle this failure gracefully, by rerouting requests
    to an alternative instance of the service, ensuring that the overall system remains
    operational (Circuit Breaker pattern).


    # CIRCUIT BREAKER PATTERN


    Connecting to the concept of resilience, it''s worth talking about the Circuit
    Breaker pattern; it is a design pattern to improve the resilience of a system.
    It is used in a distributed or remote service by detecting and preventing repeated
    failures. The pattern is inspired by the electrical circuit breaker, which automatically
    interrupts the flow of electricity when a fault is detected to prevent damage
    to the electrical system.


    A circuit breaker operates by wrapping a function call (such as a remote service
    call) and monitoring for failures. When a threshold of failures is reached, the
    circuit breaker "trips" and stops allowing calls to that function for a specified
    period. During this time, the system can take alternative actions, such as returning
    a fallback response or retrying the operation after a delay. This prevents the
    system from repeatedly trying to call a failing service, which could lead to degraded
    performance or system failure.


    If you implement a circuit breaker in your Java application, the most used libraries
    are Hystrix and Resilience4j. Developed by Netflix, Hystrix is a widely used library
    for implementing the Circuit Breaker pattern in Java. It provides fault tolerance
    (FT) and latency tolerance (LT) features for distributed systems. Resilience4j
    is a lightweight, modular library for handling failures in Java 8+ and functional
    programming styles. It provides several resilience patterns, including Circuit
    Breaker, Rate Limiter, Retry, and Bulkhead. If you''re using Spring Cloud Breaker
    offers a unified abstraction layer for various circuit breaker implementations.
    This framework provides a uniform API that developers can use within their applications,
    granting the flexibility to select the circuit breaker implementation that aligns
    most effectively with their specific application requirements. The supported implementations
    at the moment of writing are Resilience4j and Spring Retry.


    +   * Elastic: The system can adapt to varying workloads, maintaining consistent
    response times. For example, an elastic system could automatically scale its resources
    up or down based on demand.'
