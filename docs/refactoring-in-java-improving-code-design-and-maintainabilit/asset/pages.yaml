- img_proc: true
  md: 'Figure 9.5 – Two services use different tables of the same database, which
    are related by the idcustomer_id foreign key relationship


    Now, we''ve told you how it should be, but we also need to tell you that this
    doesn''t always happen, especially during the transition from a monolithic to
    microservices. You may have to share the data storage layer for a while. However,
    our advice is to avoid this situation as much as possible and resolve this issue
    as soon as you can.


    # Shared libraries


    Shared persistence (data storage) leads to coupling problems, and the same goes
    for sharing libraries. One of the first things we discussed in this book, and
    generally emphasized in studies and work, is the principle of Don''t Repeat Yourself
    (DRY). Do things once, do them well, and reuse your code as much as possible.
    This is certainly a mantra to follow, but in the case of architecture (especially
    microservices architecture), one must be very cautious.


    Let''s imagine having two services – components that use the same shared library,
    always written and managed by. If we need to make a change to this library, we
    will not only have to handle the change in the library itself but also update
    the dependency in the microservices, and perhaps change the code if it needs (this
    depends on whether we change the method signatures or not).


    The example we are discussing involves only two microservices and one library.
    However, within an architecture, there are many interrelated components: component
    A is connected to component B, which is connected to component C, and so on. Modifying
    a library can potentially lead to a difficult-control ripple effect, triggering
    a chain of restarting, rebuilding, and redeploying can be quite costly.


    I''m not saying here to not use shared libraries. Shared libraries are crucial
    for avoiding code duplication across software components. Take logging, for instance.
    Custom logic, such as formatting or concealing sensitive data such as customer
    details, is often required. Now, picture each component with its unique implementation.
    Consideration the wasted developer hours if it''s not identical across components.
    Aggregating logs becomes challenging, and slight implementation differences lead
    to inconsistent labeling.


    Something like the log4j vulnerability poses a significant challenge if this implementation
    is shared around all the code. Fixing it per microservice or component demands
    effort. With a custom logging library using log4j internally, addressing the vulnerability
    would only require action at a single point. Logging is a universal feature in
    microservices, making it an excellent candidate for a shared library. Other examples
    include security, monitoring, async communication, and handling exceptions.


    Also, adding a middle layer between the code and external tools is really helpful.
    It protects the main part of the program from changes in those tools. This makes
    it easier to put new features in or fix problems. It also makes the code easier
    to read and work with a team. After a year of doing this, it''s clear that it
    makes our software stronger and more flexible.'
