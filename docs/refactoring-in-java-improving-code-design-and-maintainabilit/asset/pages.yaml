    # Driver and navigator


    This is the classic pair programming style. The driver is the individual in control
    of the keyboard, concentrating on accumulating the current small task while temporarily
    setting broader concerns. They are encouraged to vocalize their actions as they
    perform. The navigator, who''s positioned as an observer while the driver operates
    the keyboard, actively assesses the code in real time, provides guidance, and
    communicates their thoughts. The navigator maintains awareness of larger issues
    and potential bugs, taking note of next actions or obstacles as they arise.


    A typical workflow follows these steps:


    +   1. Start with a well-defined, preferably small task.

    2. Reach a consensus on a singular, manageable objective at a time. This can be
    defined by a unit test, for example.

    3. Regularly interchange roles and the keyboard. This shared, active participation
    maintains energy levels and enhances comprehension. What does “regularly” mean?
    We''ll see shortly.

    4. In the role of the navigator, refrain from getting lost in the immediate tactical
    details of coding since the driver focuses on them. Your responsibility is to
    step back and complement your partner''s tactical approach with medium-term thinking.
    Jot down upcoming tasks, potential roadblocks, and ideas on sticky notes. Discuss
    them after the completion of the current tiny goal to avoid disrupting the driver''s
    workflow.


    # Ping-pong pairing


    The ping-pong pairing technique is closely aligned with TDD and is particularly
    effective when you have a well-defined task that can be approached in a test-driven
    manner:


    +   1. “Ping”: Developer A initiates by creating a failing test.

    2. “Pong”: Developer B responds by writing the code necessary to make the test
    pass.

    3. Developer B takes the lead by initiating the next “ping,” which involves creating
    the next failing test.

    4. After each “pong,” it’s a common practice to collaboratively refactor the code.
    This step aligns with the “Red – Green – Refactor” approach, which we encountered
    in the previous chapters.


