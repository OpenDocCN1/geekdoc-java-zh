  md: 'If you decide to rewrite a piece of code, a module, or an entire component,
    let give you a heartfelt piece of advice: don''t get attached to what has already
    been done. Let me explain. Surely, it will be useful to try and understand what
    the code does and the individual steps that make up the logical flow. It will
    equally useful to understand how users currently behave and what business cases
    are currently implemented. However, I have often found that what is present does
    not correspond to the needs of users; perhaps never did, or perhaps needs have
    changed over time. Perhaps half of that software is no longer needed. So, it''s
    fine to read what exists and try to rewrite it better, but often this reverse-engineering
    process can be quite complicated, time-consuming, and also, error-prone. Instead,
    to identify what users need, with the help of the Product Owner (to know what
    PO exactly is, you can refer to https://www.scrum.org/resources/what-is-a-product-owner).


    This actually may encounter some resistance, which depends on the mentality of
    the company you are working for. Many times, I have been: Must have the same logic
    as before, but it almost never leads to effective results. It forces engineers
    to do over one''s best at reverse-engineering work, which in light of (often)
    changing user needs be partially useless; it does not allow the team (both the
    so-called part and the called product part, such differentiation makes sense)
    to focus on the importance of individual features, in order to prioritize activities
    and avoid unnecessary ones. So, I suggest you always start from the needs – the
    why, before the how. Think about the goal before how to get there.


    # Summary


