    # Code should be readable, not concise


    Code needs to do its job and be interpreted correctly by the machine. But it''s
    not just the machine that needs to understand it—other developers should be able
    to comprehend the code too, especially in collaborative projects. That''s why
    readability is always prioritized over brevity in software development. Writing
    concise code is pointless if it becomes incomprehensible to others. A prime of
    producing clean and readable code lies in variable naming.


    A variable should have a name that clearly conveys its purpose. Take the following
    variable, for instance, which is cryptic without the requisite background knowledge
    and explanation:


    ```

    int x;

    ```


    But also, this somewhat more precisely named variable still leaves some doubt:


    ```

    int elapsed;

    ```


    It should be elapsed—time, OK, but what''s the measurement unit? By using the
    following name for the same variable, its purpose becomes evident:


    ```

    int elapsedTimeInMillis;

    ```


    Our opinion on the length of variable names is that I prefer them to be longer
    than too short. It would be ideal to find a middle ground, but it''s not always
    possible. Between the two extremes, I leans towards longer names as they enhance
    readability. However, it''s important to note that length names can sometimes
    indicate underlying issues.


    To summarize, we quickly reviewed what Clean Code is. There are entire books,
    online courses, and company workshops dedicated to this topic—in short, there
    is a whole world around it, and I don''t expect these few to cover everything.
    My invitation is, to delve into it as much as possible. There are still people
    who consider Clean Code as an accessory, something that wastes time when code
    works even when not. I hope I conveyed the concept that things don''t work that
    way and that good clean code brings numerous advantages with relatively low effort
    if approached meticulously. In the next section, we will add another adjective
    to our code: after good and clean, we will see what is meant SOLID code!


