  md: '# 2


    # Good Coding Habits


    In a book about refactoring, I believe it''s necessary to talk about well-written
    code. These are two obviously closely related aspects that almost overlap. The
    lack of good code or solid architecture are among the reasons for refactoring;
    refactoring is the means through which we aim to improve the writing of a method,
    a class, a project, or an architecture.


    To understand clearly what we''re talking about, it''s important to try to explain
    what good code is and, by exclusion, what is poorly written code. It may seem
    excessive to define in reality, it should be – or be treated as – something intuitive.
    We should almost have spider senses that tangle when we see code that is hard
    to understand or overly complicated. If you don''t have spider senses developed
    yet, don''t worry! We will grow with experience (and this could help you get there).


    Nowadays, good code is often synonymous with Clean Code, that is, a collection
    of informal rules gathered in the book of the same name by Robert C. Martin (we''re
    going to speak about Clean Code a lot). In this chapter, we''ll summarize in broad
    terms what Clean Code means, what fundamental principles are, and why we should
    all strive for Clean Code every day of our professional lives.


    Clean Code is often accompanied by closely related to the so-called SOLID principles,
    for which the computer science community has shown great inventiveness regarding
    acronyms. But they also provide solid (do software developers love dad jokes?)
    foundations for writing excellent code.


    In this chapter, we''ll cover the following topics:


    +   - What is good code?


    +   - Clean Code


    +   - Write SOLID code


    +   - Side effects and mutability


    +   - Causes of bad code


    # A SMALL DISCLAIMER


    I don''t claim to present the ultimate truth about anything. I know that some
    of what I''ll write is the subject of debate, and there are plenty of programmers
    out ready to question everything (and I say that as a good thing). The intention
    is to share what I believe are healthy habits to practice every day, to avoid
    getting stuck and, most importantly, to find joy in our beautiful craft as artisans.


    # Characteristics of good code'
