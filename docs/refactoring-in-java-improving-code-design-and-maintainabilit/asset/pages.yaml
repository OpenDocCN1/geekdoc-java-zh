    # The “Rule of Three”


    The Rule of Three suggests that code should not be duplicated more than twice
    and once duplication occurs for the third time, it should be extracted into a
    reusable module or function. It is unclear who originated this principle as it
    has been widely used and adopted by various software developers and teams over
    the years (it was popularized by Martin Fowler, who credits it to Don Roberts).
    A more effective way to state the same is three strikes and you refactor.


    # Preparatory refactoring for smooth feature implementation


    When adding a new feature to your code base, it is often helpful to engage in
    preparatory refactoring. This means taking the time to analyze parts of your code
    base that will be affected by the new feature and making necessary changes beforehand.
    I’ll borrow Martin Fowler’s excellent analogy for refactoring: it’s like taking
    off electrical sockets, door frames, and skirting boards when painting a wall.
    The taping itself isn’t painting, but it makes the process quicker and easier.


    During the analysis phase of preparatory refactoring, you may notice areas where
    a small change in the code could lead to significant improvements in speed or
    efficiency. For example, you may realize that using a method parameter instead
    of a literal or a class hierarchy instead of a switch statement would improve
    the flexibility and adaptability of your code. By making these changes through
    refactoring, you can make your code more open to change in the future and ultimately
    make development easier overall.


    # Refactoring for bug fixing


    It is often overlooked, but fixing a bug can present a great opportunity for a
    refactor. This is because a significant portion of bug-fixing-related refactoring
    is improved at improving the readability of your code. By making your code more
    understandable, you can identify the root cause of the bug sooner and fix it more
    efficiently. The bug had been present all along, but it unnoticed due to the lack
    of readability in your code. So, it’s always a good practice to take the time
    to refactor when fixing bugs to prevent them from happening again in the future.


    # IMPORTANT NOTE


    Let me be a bit clearer: refactoring and bug fixing are two different things.
    It’s important to fix the bug first and focus on improving the code. They may
    be related but separate steps, and one doesn’t automatically include the other.'
