  \ Files` 目录以外的地方。\n\n![Image](img/afig03.jpg)\n\n![Image](img/c.jpg) 选择 `XAMPP`\
  \ 。由于权限问题，不要将其安装在 `Program Files`。我建议将 `XAMPP` 安装在根目录（例如 `C:\\xampp`）。\n\n5. 安装完成后\
  \ ![Image](img/d.jpg)，选择启动 `XAMPP`。\n\n![Image](img/afig04.jpg)\n\n![Image](img/d.jpg)\
  \ `XAMPP` 控制面板。\n\n6. 使用 `XAMPP` 控制面板 ![Image](img/e.jpg) 启动、停止和配置 `XAMPP`。\n\n\
  ![Image](img/afig05.jpg)\n\n![Image](img/e.jpg) 用于管理软件的 `XAMPP` 控制面板。每一章都需要运行 `Apache`。第\
  \ 13 章需要运行 `MySQL`。`Mercury` 是 `XAMPP` 安装的邮件服务器。在使用 `PHP` 发送电子邮件时需要运行它（见第八章）。\n\n\
  7. 立即为 `root` 用户设置密码。\n\n## 在 Mac OS 上安装\n\nMac OS X 本质上是一个 Unix 版本，由于 `PHP` 和 `MySQL`\
  \ 最初是为 Unix 系统编写的，因此安装它们有多种选择。事实上，Mac OS X 已经安装了 `Apache`，为你节省了那个步骤。\n\n资深开发者和熟悉\
  \ `Terminal` 的人员可能想使用包安装程序（如 [`php-osx.liip.ch/`](http://php-osx.liip.ch/) 和 `Homebrew`\
  \ ([`brew.sh/`](http://brew.sh/))）来安装 `PHP` 和 `MySQL`。但对于初学者，我建议使用合一安装程序，例如：\n\n\
  ![Image](img/squf.jpg) XAMPP ([www.apachefriends.org](http://www.apachefriends.org))\n\
  \n![Image](img/squf.jpg) AMPPS ([www.ampps.com](http://www.ampps.com))\n\n![Image](img/squf.jpg)\
  \ Bitnami ([www.bitnami.com](http://www.bitnami.com)), 它也与 XAMPP 合作\n\n![Image](img/squf.jpg)\
  \ MAMP ([www.mamp.info](http://www.mamp.info))\n\n\n\n\n\n不仅这些安装程序非常简单不易出错，而且当操作系统更新覆盖了你的\
  \ Apache 配置时，它们也不会让你手忙脚乱。在本附中，我将使用 `XAMPP`，它运行在 Mac OS X 10.6 及更高版本上。\n\n除了 Apache、`PHP`\
  \ 和 `MySQL`，`XAMPP` 还安装了以下内容：\n\n![Image](img/squf.jpg) `phpMyAdmin`，MySQL 服务器的\
  \ Web 界面\n\n![Image](img/squf.jpg) `OpenSSL`用于安全连接\n\n![Image](img/squf.jpg) 几个实用的扩展\n\
  \n截至本书，`XAMPP`（版本 7.0.6）安装了 `PHP` 7.0.6、`Apache` 2.4.18 和 `phpMyAdmin` 4.5.1。不过，有一个例外！\n\
  \n从 `XAMPP` 5.5.30 开始，安装程序包含了 `MariaDB` ([www.mariadb.com](http://www.mariadb.com))\
  \ 而不是 `MySQL`。`MariaDB` 是 `MySQL` 的开源分支，功能上完全等。尽管 `XAMPP` 安装的是 `MariaDB` 而不是 `MySQL`，但在遵循本书中所有针对\
  \ `MySQL` 的指令或代码时，你不应该遇到任何问题。\n\n我将在接下来的步骤中介绍安装过程。请注意，如果你遇到任何问题，可以使用本书的支持论坛（[www.LarryUllman.com/forums/](http://www.LarryUllman.com/forums/)），但你转向\
  \ `XAMPP` 官网可能会更有收获（毕竟那是他们的产品）。此外，该安装程序运行得非常好，并不并不难使用，因此我不会详细说明过程中的每一个步骤，而是会重点介绍最重要的考虑因素。\n\
  \n### 在 Mac OS X 上安装 XAMPP：\n\n**1.** 从 [www.apachefriends.org](http://www.apachefriends.org)\
  \ 下载适用于 Mac OS X 的最新版 `XAMPP` ![Image](img/a.jpg)。\n\n![Image](img/afig07.jpg)\n\
  \n![Image](img/a.jpg) 从 Apache Friends 网站获取适用于 Mac OS X 的最新安装程序。\n\n我建议你获取可用的最新\
  \ `PHP` 版本，虽然如果你使用 `PHP` 5 版本，使用本书的内容也是没有问题的。\n\n**2.** 在你的电脑上，双击已下载的文件以挂载磁盘镜像。\n\
  \n**3.** 在挂载的磁盘镜像中，双击包安装程序以开始安装过程。\n\n**4.** 当出现提示时 ![Image](img/b.jpg)，安装所有组件。\n\
  \n![Image](img/afig08.jpg)\n\n![Image](img/b.jpg) 可以安装的 `XAMPP` 组件。\n\n你只会看到两个宽泛的选项；请全部安装。\n\
  \n**5.** 在安装过程完成后 ![Image](img/c.jpg)，选择启动 `XAMPP`。\n\n![Image](img/afig09.jpg)\n\
  \n![Image](img/c.jpg) `XAMPP` 安装完成！\n\n**6.** 要启动、停止和配置 `XAMPP`，请使用 `XAMPP 控制面板`\
  \ ![Image](img/d.jpg)。\n\n![Image](img/afig10.jpg)\n\n![Image](img/d.jpg) 用于管理软件的\
  \ `XAMPP 控制面板`。\n\n本书中的每一章都需要 `Apache` 运行。第 12 章和第 13 章 必须运行 `MySQL`。你可能永远不需要 FTP\
  \ 应用程序，因为你可以直接移动文件。\n\n**7.** 立即为 root `MySQL` 用户设置密码。\n\n具体操作将在本附录后半部分的“管理 MySQL\
  \ 用户”节中解释。\n\n* * *\n\n提示\n\n查看“配置 PHP”部分以了解如何通过编辑 `php.ini` 文件来配置 `PHP`。\n\n* *\
  \ *\n\n* * *\n\n提示\n\n每当你重启电脑时，都需要重新启动 `XAMPP` 服务。\n\n* * *\n\n* * *\n\n提示\n\n你的\
  \ Web 根目录——为了测试你的 `PHP` 脚本，你应该将它们放置在该的地方——是 `XAMPP` 安装目录下的 `htdocs` 文件夹。这应该是 `/Applications/XAMPP/xamppfiles/htdocs`。\n\
  \n* * *\n\n## 配置 PHP\n\n在自己的电脑上安装 `PHP` 的好处之一是你可以按照自己的喜好进行配置。`PHP` 的运行方式由 `php.ini`\
  \ 文件决定，该文件通常在安装 `PHP` 时创建。\n\n你可能想要调整的两个最重要的设置是 `display_errors` 和 `error_reporting`（两者在第\
  \ 3 章“HTML 表单与 PHP](#ch03.html_ch03)”中均有讨论）。要更改任何设置，打开 `PHP` 配置文件，根据需要进行编辑，然后保存并重启\
  \ Web 服务器。\n\n更改 `PHP` 的配置：\n\n**1.** 在浏览器中执行一个调用 `phpinfo()` 函数的脚本 ![Image](img/a.jpg)。\n\
  \n![Image](img/afig11.jpg)\n\n![Image](img/a.jpg) 调用 `phpinfo()` 函数（在第 1 章“开始学习\
  \ PHP](#ch01.html_ch01)”中讨论）显示关于 `PHP` 的信息。\n\n**2.** 在浏览器中查找 `Loaded Configuration\
  \ File`（已加载的配置文件）。\n\n该值类似于 `C:\\xampp\\php\\php.ini` 或 `/Applications/XAMPP/xamppfiles/etc/php.ini`。\n\
  \n**3.** 在任何文本编辑器中打开 `php.ini` 文件。\n\n**4.** 根据需要更改设置。行首有分号表示已注释（使其失效）。\n\n**5.**\
  \ 保存 `php.ini` 文件。\n\n* * *\n\n### 启用邮件\n\n`mail()` 函数只有在运行 `PHP` 的计算机可以使用 sendmail\
  \ 时有效。启用 `mail()` 函数的一种方法是在 `php.ini` 文件中设置 `smtp` 值（仅适用于 Windows）。如果你的 ISP SMTP\
  \ 服务器需要身份验证，这种方法有效。\n\n对于 Windows，有很多免费的 SMTP 服务器，如 Mercury。它们与 `XAMPP` 一起安装，也可以手动安装。\n\
  \nMac OS X 自带需要启用的邮件服务器——postfix 和/或 sendmail。搜索 Google 在 Mac OS X 上手动启用邮件服务器的说明。\n\
  \n* * *\n\n**6.** 重启你的 Web 服务器。\n\n你不需要重启整个电脑，只需重启 Web 服务器（例如 Apache）。在 `XAMPP`\
  \ 中，只需点击 Apache 的停止然后启动。\n\n* * *\n\n提示\n\n你可以使用 `phpinfo()` 函数来确认你的配置更改已生效。\n\n\
  * * *\n\n* * *\n\n提示\n\n如果你编辑了 `php.ini` 文件并重启了 Web 服务器但更改未生效，请确保你编辑的是正确的 `php.ini`\
  \ 文件（你的电脑上可能有多个）。\n\n* * *\n\n### MySQL 接口\n\n在第 12 章和第 13 章中，将使用 PHP 脚本与 MySQL\
  \ 数据库交互。正如我在第 12 章中所解释的，独立于 PHP 脚本与 MySQL 交互是有价值的调试工具。因此，了解如何使用 MySQL 接口是非常关重要的。我将快速介绍两种最常用的方法。\n\
  \n#### 使用 MySQL 客户端\n\nMySQL 软件带有一个重要的工具称为 MySQL 客户端。该应用程序提供了与 MySQL 服务器通信的简单界面。它是一个命令行工具，在\
  \ Linux 和 Mac OS X 上通过终端应用程序访问，或者在 Windows 上通过命令（DOS）提示符访问。\n\n使用 MySQL 客户端：\n\n\
  **1.** 确保 MySQL 服务器正在运行。\n\n如果你在 Windows 上使用 XAMPP，你可以在那里启动 MySQL，然后直接跳到第 3 步。\n\
  \n**2.** 找到 MySQL bin 目录。\n\n\n\n\n\n要连接到客户端，你需要知道它所在的位置。MySQL 客户端位于安装目录下的 `bin`\
  \ 文件夹（`bin` 是“binary”的缩写，意味着可执行文件）。我将列出常见的情况。\n\n如果你是手动安装的 MySQL，客户端的位置取决于你安装软件的位置，但最可能的是：\n\
  \n`C:\\mysql\\bin\\mysql` (Windows)\n\n或者\n\n`/usr/local/mysql/bin/mysql` (Mac OS\
  \ X 和 Unix)\n\n### 使用分号\n\n在 MySQL 客户端中，分号表示要执行的语句已完成。这允许你跨行编写复杂的命令或 SQL 查询，MySQL\
  \ 在遇到分号之前不会尝试运行该命令。不过，这仅是 MySQL 客户端内部的一的一项要求。通过 PHP 脚本或 `phpMyAdmin` 运行的查询不需要用分号结束。而且在退出\
  \ MySQL 客户端时，`exit` 后面不需要使用分号。\n\n如果你在 Windows 上使用 XAMPP，路径为 `C:\\xampp\\mysql\\\
  bin\\mysql`（假设你将 XAMPP 安装在 `C:\\`）。如果你在 Mac OS X 上安装了 XAMPP，路径为 `/Applications/XAMPP/xamppfiles/bin`。\n\
  \n### 3. 命令提示符\n\n在 Mac OS X 和 Unix 上，你可以通过运行 `Terminal` 应用程序来实现。在 Mac OS X 上，它位于\
  \ `/Applications/Utilities` 文件夹中。\n\n在 Windows 上，按下 `Command+R` 打开运行对话框，在提示符处输入\
  \ `cmd` 并回车或点击 OK ![Image](img/a.jpg)。\n\n![Image](img/afig12.jpg)\n\n![Image](img/a.jpg)\
  \ 使用运行对话框在 Windows 上访问控制台。\n\n如果你在 Windows 上使用 XAMPP，点击控制面板中的 `Shell` 按钮 ![Image](img/b.jpg)\
  \ 来访问命令提示符。\n\n![Image](img/afig13.jpg)\n\n![Image](img/b.jpg) XAMPP 控制面板中的 `Shell`\
  \ 按钮将直接进入命令提示符。\n\n### 4. 尝试连接到 MySQL 服务器\n\n要建立连接，请输入步骤 2 中确定的路径加上 `-u username\
  \ -p`。因此，命令可能是：\n\n`C:\\mysql\\bin\\mysql -u username -p` (Windows)\n\n或者\n\n`/usr/local/mysql/bin/mysql\
  \ -u username -p` (Unix 和 Mac OS X)\n\n或者\n\n`/Applications/XAMPP/xamppfiles/bin/mysql\
  \ -u username -p` (Mac OS X)\n\n对于 Windows 版 XAMPP，你可以直接使用 `mysql -u username -p`（假设你已经在步骤\
  \ 3 中点击了 `Shell` 按钮）。\n\n将 `username` 替换为你想使用的用户名。如果你还没有创建其他用户，这里将是 `root`（`root`\
  \ 是 MySQL 的超级用户）。如果你还没有设置 root 用户密码（XAMPP 的默认行为），可以省略 `-p` 标记。\n\n### 5. 在提示符处输入密码\
  \ ![Image](img/c.jpg)。\n\n![Image](img/afig14.jpg)\n\n![Image](img/c.jpg) 在 Windows\
  \ 上成功访问 MySQL 客户端。\n\n请求的密码是连接时指定的 way 用户的 MySQL 密码。只有当你在步骤 4 中使用了 `-p` 选项时，才会看到此提示。\n\
  \n如果你在 Mac OS X 上安装了 MAMP，root 用户的密码将是 `root`。如果你在 Windows 上安装了 XAMPP，初始没有设置密码。\n\
  \n### 6. 列出可用数据库 ![Image](img/d.jpg):\n\n```\nSHOW DATABASES;\n```\n\n![Image](img/afig15.jpg)\n\
  \n![Image](img/d.jpg) 在新安装 MySQL 后，将只有几个数据库。\n\n`SHOW DATABASES` 命令是一个 SQL 查询，用于列出该\
  \ MySQL 安装上连接用户可见的所有数据库。\n\n### 7. 退出 MySQL 客户端。\n\n要退出，请输入 `exit` 或 `quit`。\n\n\
  > **提示**：如果你看到 `Can’t connect to local MySQL server through socket...` 错误消息，通常意味着\
  \ MySQL 没有运行。\n\n> **提示**：MySQL 客户端是调试处理 MySQL 的 PHP 脚本的最佳工具之一。你可以使用 MySQL 客户端检查用户权限，并在\
  \ PHP 脚本之外运行查询。\n\n### 使用 phpMyAdmin\n\n`phpMyAdmin` ([www.phpmyadmin.net](http://www.phpmyadmin.net))\
  \ 是一个用于与 MySQL 服务器交互的 Web 界面，允许你创建表、导入和导出记录等许多操作，而无需使用命令行界面。它可能是用 PHP 编写的最流行的 Web\
  \ 软件，因为每个 PHP 托管公司都提供它。事实上，全功能 XAMPP 安装程序也包含了它。`phpMyAdmin` 文档齐全且易于使用，但我将重点介绍几个要点。\n\
  \n使用 `phpMyAdmin`：\n\n**1. 在浏览器中访问 phpMyAdmin ![Image](img/e.jpg)。**\n\n![Image](img/afig16.jpg)\n\
  \n![Image](img/e.jpg) phpMyAdmin 首页。\n\n使用 XAMPP 时，`phpMyAdmin` 位于 `http://localhost/phpmyadmin/`。在\
  \ Windows 上，你也可以通过控制面板中的 MySQL admin 链接进入此页面。\n\n**2. 点击左列中的数据库名称以选择该数据库。**\n\n\
  **3. 点击左列中的表名称以选择该表 ![Image](img/f.jpg)。**\n\n![Image](img/afig17.jpg)\n\n![Image](img/f.jpg)\n\
  \n**4. 使用标签页执行常用任务。**\n\n**5. 使用 SQL 标签页执行任何查询。**\n\n\n\n\n\n请记住 MySQL 中的密码是区分大小写的，因此\
  \ `Kazan` 和 `kazan` 是不可相互替换的。在实际引号密码之前的 `PASSWORD` 术告诉 MySQL 使用 `MySQL PASSWORD()`\
  \ 函数对该字符串进行加密。在 `PASSWORD` 和左括号之间不能有空格。\n\n### 3. 退出 MySQL 客户端：\n\n```\nexit\n```\n\
  \n### 4. 重新登录 MySQL 客户端以测试新密码。\n\n现在已经建立了密码，你需要在连接命令中添加 `-p` 标志。你会看到一个输入密码的提示，在其中输入刚刚创建的密码。\n\
  \n### 通过 phpMyAdmin 为 root 用户分配密码：\n\n### 1. 在浏览器中打开 phpMyAdmin。\n详细的说明请参阅“使用 phpMyAdmin”章节中的一系列操作步骤。\n\
  \n### 2. 在主页上，点击“用户账户”（User accounts）选项卡。\n你可以随时点击左上角的主页图标回到 phpMyAdmin 主页。\n\n\
  #### 3. 在用户列表中，点击 root 用户行上的“编辑权限”（Edit Privileges）图标。![Image](img/b.jpg)\n![Image](img/afig19.jpg)\n\
  ![Image](img/b.jpg) 在 phpMyAdmin 中显示的 MySQL 用户列表。\n\n### 4. 在下一页，点击“修改密码”（Change\
  \ Password）。\n\n#### 5. 使用结果页面下方的修改密码表单 ![Image](img/c.jpg) 来更改密码。\n![Image](img/afig20.jpg)\n\
  ![Image](img/c.jpg) 在 phpMyAdmin 中更新 MySQL 用户密码的表单。\n\n#### 6. 如必要，在 phpMyAdmin\
  \ 的配置文件更改 root 用户的密码。\n\n更改 root 用户密码的结果可能会导致 phpMyAdmin 被拒绝访问 MySQL 服务器。这是因为本地服务器上的\
  \ phpMyAdmin 通常以 root 用户身份连接到 MySQL，并将 root 用户密码硬编码在配置文件中。按照步骤 1-4 操作后，在 phpMyAdmin\
  \ 目录找到 `config.inc.php` 文件——可能是 `/Applications/XAMPP/xamppfiles/phpmyadmin`（带有 XAMPP\
  \ 的 Mac OS X）或 `C:\\xampp\\phpMyAdmin`（带有 XAMPP 的 Windows）。使用任何文本编辑器或 IDE 打开该文件，并将下行更改为使用新密码：\n\
  \n```php\n$cfg['Servers'][$i]['password'] = 'thepassword';\n```\n\n然后保存文件，并在浏览器中刷新\
  \ phpMyAdmin。\n\n## 创建数据库、用户和权限\n\n在 MySQL 成功运行并为 root 用户建立密码后，你就可以添加其他用户。这通常是在创建新数据库时完成的：为了提高数据库的安全性，你应该始终创建新用户来访问数据库，而不是一直使用\
  \ root 用户。\n\n要创建一个数据库，只需运行 `CREATE DATABASE` 命令：\n\n```sql\nCREATE DATABASE database_name\n\
  ```\n\n数据库名称可以包含数字、字母、美元符号 $ 和下划线，但不能包含空格。只有当你以具有 `CREATE DATABASE` 权限的用户身份连接时，你才能运行此命令。\n\
  \nMySQL 权限系统设计用于确保某些命令在特定数据库上具有适当权限。这种技术允许 Web 主机例如让多个用户在无需担心的情况下访问多个数据库。MySQL 系统中的每个用户都可以从特定主机（计算机）对特定数据库拥有特定的能力。root\
  \ 用户（是 MySQL 的 root 用户，而不是系统的 root 用户）拥有最高权限，并用于创建子用户，尽管可以给子用户类似于 root 的权限（尽管不建议这样做）。\n\
  \n当用户尝试对 MySQL 服务器进行某些操作时，MySQL 首先检查该用户是否有权连接服务器（基于用户名、用户主机、用户密码以及 mysql 数据库用户表中的信息）。其次，MySQL\
  \ 检查该用户是否有权在特定数据库上运行特定的 SQL 语句——例如，选择数据、插入数据或创建新表。**[表 A.1]** 列出了你可以按用户逐个设置的大多数各种权限。\n\
  \n![Image](img/atab01.jpg)\n\n**表 A.1 MySQL 权限**\n\n你可以通过几种方式在 MySQL 中设置用户和权限，但我将从讨论\
  \ `GRANT` 命令开始。语法如下：\n\n```sql\nGRANT privileges ON database.* TO 'username'@'hostname'\
  \ IDENTIFIED BY 'password'\n```\n\n对于此语句的 `privileges` 部分，你可以从 **[表 A.1]** 中列出特定的权限，或者使用\
  \ `ALL` 允许所有权限（这并不明智）。语句的 `database.*` 部分指定了用户可以操作的哪些和哪些表。你可以使用 `database.tablename`\
  \ 语法指定特定表，或使用 `*.*` 允许所有数据库（再次，并不明智）。最后，你可以指定用户名、主机名和密码。\n\n用户名最大长度为 32 个字符（截至 MySQL\
  \ 5.7.8；早期版本为 16 个）。在创建用户名时，务必避免空格——用下划线代替，并注意用户名是区分大小写的。\n\n主机名是允许用户连接的计算机。这可以是域名，例如\
  \ `www.example.com`，也可以 IP 地址。通常指定 `localhost` 为主机名，这意味着 MySQL 用户必须从运行 MySQL 相同的同一台计算机连接。要允许任何主机，请使用通配符\
  \ `%`：\n\n```sql\nGRANT privileges ON database.* TO 'username'@'%' IDENTIFIED BY\
  \ 'password'\n```\n\n省略 `IDENTIFIED BY 'password'` 子会导致用户不需要输入密码（再次应避免）。\n\n作为此过程的示例，你将在名为\
  \ `myblog` 的新数据库上创建具有特定权限的用户。请记住，你只能对现有数据库授予权限。接下来的序列还将显示如何创建数据库。\n\n使用 GRANT 创建新用户：\n\
  \n#### 1. 以 root 用户登录 MySQL 客户端。\n使用已说明的步骤执行此操作。你必须以能够创建数据库和其他用户的用户身份登录。\n\n####\
  \ 2. 创建新数据库 ![Image](img/d.jpg):\n\n```sql\nCREATE DATABASE myblog;\n```\n\n![Image](img/afig21.jpg)\n\
  ![Image](img/d.jpg) 创建新数据库。\n\n这个特定的数据库将在第 12 章中使用。\n\n#### 3. 为 myblog 数据库创建一个具有管理员权限的用户\
  \ ![Image](img/e.jpg):\n\n```sql\nGRANT SELECT, INSERT, UPDATE, DELETE, CREATE,\
  \ DROP, ALTER, INDEX ON myblog.* TO 'llama'@ 'localhost' IDENTIFIED BY 'camel';\n\
  ```\n\n![Image](img/afig22.jpg)\n![Image](img/e.jpg) 为单个数据库创建管理员用户。\n\n该用户 `llama`\
  \ 可以在临时数据库上创建表、修改表、插入数据、更新数据等。这本质上包含了除了创建新用户以外的所有管理员级能力。务必使用密码——也许比这里使用的更聪明。\n\n\
  #### 4. 为数据库创建一个具有基本访问的用户 ![Image](img/f.jpg):\n\n```sql\nGRANT SELECT, INSERT,\
  \ UPDATE, DELETE ON myblog.* TO 'webuser'@ 'localhost' IDENTIFIED BY 'BroWs1ng';\n\
  ```\n\n![Image](img/afig23.jpg)\n![Image](img/f.jpg) 该用户对同一数据库拥有更受限的权限。\n\n\n\n\n\
  现在，通用的 `webuser` 可以浏览记录（从 `tables` 中进行 `SELECT` 操作），还可以添加、编辑和删除它们，但该用户无法更改数据库的结构。在建立用户和权限时，请从下到上进行操作，始终允许最少的权限。\n\
  \n### 5. 应用更改 ![Image](img/g.jpg):\n\n```\nFLUSH PRIVILEGES;\n```\n\n![Image](img/afig24.jpg)\n\
  \n![Image](img/g.jpg) 在你尝试使用新创建的用户访问 MySQL 之前，不要忘记这一步。\n\n刚刚所做的更改在告诉 MySQL 重置可接受的用户和权限列表之前将不会生效，这正是该命令的作用。忘记这一步并导致无法使用新创建的用户访问数据库，是一个常见的错误。\n\
  \n> **提示**\n任何名称以 `test_` 开头的数据库都可以由任何有连接到 MySQL 权限的用户修改。因此，除非它确实是实验性的，否则不要以这种方式创建数据库。\n\
  \n> **提示**\n`REVOKE` 命令用于移除用户和权限。\n\n## B. 资源与后续步骤\n\n编写这本书的目的是为初学者 PHP 程序员提供一个良好的学习基础。某些主题被省略或一略带过，因为这本书侧重于涵盖绝对的基础知识。本附录列出了许多有用资源，简要讨论了从哪里获取数据库以及某些未涵盖主题的信息，并包含了几个旧表格。\n\
  \n除了这里包含的网站外，你还应该查看本书的配套网站 [www.LarryUllman.com](http://www.LarryUllman.com)。在那里，你可以找到书中的所有代码、支持论坛、勘误页面等内容。\n\
  \n### PHP 手册\n\n所有 PHP 程序员在开始使用该语言之前，都应该熟悉并可能获取某个版本的 PHP 手册。手册可以在 PHP 官方网站——[www.php.net/docs.php](http://www.php.net/docs.php)\
  \ 以及其他许多地方获得。\n\n你可以下载近十种语言、不同格式的手册。官方网站还提供了一个注释版的手册，地址为 [www.php.net/manual/en/](http://www.php.net/manual/en/)（英文），用户在那里添加了有用的笔记和注释。如果你在某个特定函数上遇到问题，阅读手册中该函数的页面可能会提供答案。\n\
  \n第 1 章 中的“开始学习 PHP”中提到的一个技巧是，你可以通过访问 www.php.net/*函数名* 来快速访问任何特定函数的文档页面。例如，`number_format()`\
  \ 函数的页面是 www.php.net/number_format。\n\n### 数据库资源\n\n哪些资源对你最有用显然取决于你正在使用哪种数据库管理系统\
  \ (DBMS)。PHP 最常用的数据库可能是 MySQL，但 PHP 支持所有标准的数据库应用程序。\n\n要了解更多关于使用 MySQL 的知识，请从 MySQL\
  \ 官方网站 ([www.mysql.com](http://www.mysql.com)) 开始。你可以下载 MySQL 手册并在工作时参考。\n\n如果你在使用\
  \ MySQL，不要忘记下载并安装 phpMyAdmin ([www.phpmyadmin.net](http://www.phpmyadmin.net))。它是用\
  \ PHP 编写的，是处理数据库的宝贵工具，对于初学者来说比其他一些界面更容易上手。\n\n你应该深入研究另一个数据库资源领域是 SQL。讨论 SQL（每个数据库应用程序都使用的语言）的网站包括：\n\
  \n![Image](img/squf.jpg) SQL Course ([www.sqlcourse.com](http://www.sqlcourse.com))\n\
  \n![Image](img/squf.jpg) A Gentle Introduction to SQL ([www.sqlzoo.net](http://www.sqlzoo.net))\n\
  \n![Image](img/squf.jpg) W3Schools’ SQL Tutorial ([www.w3schools.com/sql/](http://www.w3schools.com/sql/))\n\
  \n![Image](img/squf.jpg) SQL.org ([www.sql.org](http://www.sql.org))\n\n（以上所有内容的界面有些过时，但内容仍然适用。）\n\
  \n我的 *PHP and MySQL for Dynamic Web Sites: Visual QuickPro Guide* (Peachpit Press,\
  \ 2012) 也比这本书更详细地讨论了 SQL 和 MySQL。\n\n### 前 10 常见问题（或问题解答）\n\n调试是一项需要时间和经验才能充分开发的宝贵技能。但我不想在装备不足的情况下就让你踏上这段旅程，因此我列出了\
  \ PHP 脚本中最常见的 10 个问题以及最可能的原因。不过，在调试问题方面，这里有我五条最好的建议：\n\n![Image](img/squf.jpg) **了解你运行的\
  \ PHP 版本。**\n\n某些问题是特定于 PHP 版本的每当你第一次使用服务器时，使用 `phpinfo()` 函数来测试正在使用的版本。此外，确保你知道正在使用哪个版本的\
  \ MySQL（如果适用）；操作系统；以及 Web 服务器（例如 Apache 2.4）。\n\n![Image](img/squf.jpg) **通过 URL\
  \ 运行所有 PHP 脚本。**\n\n如果你不通过 URL 运行 PHP 脚本——这包括将表单提交到 PHP 脚本——Web 服务器将无法处理请求。\n\n\
  ![Image](img/squf.jpg) **信任错误信息！**\n\n许多初学者在解决问题时遇到比更大的困难，是因为他们不关注看到的错误信息。尽管 PHP\
  \ 的某些错误信息很晦涩，甚至具有误导性，但如果 PHP 说第 22 行有问题，问题可能就在第 22 行。\n\n![Image](img/squf.jpg)\
  \ **避免“尝试”来修复问题！**\n\n如果你不确定什么导致了问题以及正确的修复方法，请避免盲目尝试。这样做可能会产生新问题，并进一步混淆原始问题。\n\n\
  ![Image](img/squf.jpg) **休息一下！**\n\n我能提供的最好的建议是离开电脑休息一下。我通过这种方式解决了许多问题。有时你需要一个清醒的头脑。\n\
  \n接下来，这里是你可能会遇到的前 10 个可能的问题：\n\n![Image](img/squf.jpg) **空白页面**\n\n如果你在提交表单或加载 PHP\
  \ 脚本后在浏览器中看到空白屏幕，可能是发生了错误终止了页面执行。首先检查 HTML 源代码查看是否是 HTML 问题。然后在你的 `php.ini` 配置或\
  \ PHP 脚本中开启 `display_errors` 以查看可能发生了 PHP 问题。\n\n![Image](img/squf.jpg) ***Undefined\
  \ variable 或 undefined index 错误** ![Image](img/a.jpg)\n\n![Image](img/bfig01.jpg)\n\
  \n![Image](img/a.jpg) 关于未定义变量或索引的错误通常来自拼写或大小写错误。\n\n这些错误在错误报告设置为最高级别时出现，它们可能可能不表示问题。检查每个变量或数组索引的拼写以确保其正确。然后确保在引用它们之前对它们进行了初始化。当然，还要确保应该有值的变量确实有值！\n\
  \n![Image](img/squf.jpg) **没有值的变量**\n\n也许你用错误的名称引用了变量。双检变量名称的大小写和拼写，然后确保根据情况使用 `$_GET`、`$_POST`、`$_COOKIE`\
  \ 和 `$_SESSION`。如果需要，使用 `print_r()` 函数查看任何变量的值。\n\n![Image](img/squf.jpg) ***Call\
  \ to undefined function... 错误**\n\n\n\n\n此类错误信息意味着你正尝试使用一个 PHP 不具备的函数。这个问题可能是由函数名拼写错误、在调用之前未定义自定义函数，或使用了你的\
  \ PHP 版本中不可用的函数导致的。请检查你的拼写，并查阅 PHP 手册中关于非用户定义函数的说明以找到问题。\n\n![Image](img/squf.jpg)\
  \ **`Headers already sent`（头部已发送）错误错误** ![Image](img/b.jpg)\n\n![Image](img/bfig02.jpg)\n\
  \n![Image](img/b.jpg) 如果在错误的时间调用，某些函数会导致 `headers already sent` 错误。\n\n此错误信息表明你在浏览器接收到\
  \ HTML 甚至是一个空格之后，使用了 HTTP 头部相关的函数——`header()`、`setcookie()` 或 `session_start()`。在调用这些任何函数之前，请双检脚本中发生了了什么。你也可以使用输出缓冲（output\
  \ buffering）来防止这些错误的发生。\n\n![Image](img/squf.jpg) **`Access denied`（拒绝访问）错误错误**\
  \ ![Image](img/c.jpg)\n\n![Image](img/bfig03.jpg)\n\n![Image](img/c.jpg) 如果 MySQL\
  \ 访问信息错误，你将看到显示数据库访问被拒绝的消息。\n\n如果你在尝试操作数据库时看到此消息，说明你使用的用户名、密码和主机组合没有访问数据库的权限。这通常不是\
  \ PHP 问题。确认使用的值，并尝试使用不同的接口（如 MySQL 客户端）连接数据库。\n\n![Image](img/squf.jpg) **`Supplied\
  \ argument is not a valid MySQL result resource`提供的参数不是有效的 MySQL 结果资源错误**\n\n这是另一个与数据库相关的错误信息。该信息意味着查询结果被使用不当。最常见的原因是你正尝试从没有返回任何记录的查询中获取行，这通常是因为\
  \ SQL 格式不正确。要解决这个问题，请打印出运行的查询，并使用其他工具（如 MySQL 客户端或 phpMyAdmin）进行测试。同时检查你的变量名是否一致。\n\
  \n![Image](img/squf.jpg) **预设的 HTML 表单值被截断**\n\n你必须将 HTML 表单输入的 `value` 属性放在双引号内。如果你没有这样做，只有值中第一个空格之前的部分会被设置为该输入的值。\n\
  \n![Image](img/squf.jpg) **条件语句或循环的行为不可预测**\n\n这些逻辑错误非常常见。检查你是否使用了错误的运算符（例如使用 `=`\
  \ 而不是 `==`）以及你是否引用了正确的变量。然后使用 print 语句让你了解脚本正在执行的操作。\n\n![Image](img/squf.jpg) **解析错误（Parse\
  \ errors）** ![Image](img/d.jpg)\n\n![Image](img/bfig04.jpg)\n\n![Image](img/d.jpg)\
  \ 解析错误非常常见，并且会阻止脚本执行。\n\n解析错误是你将遇到的最普遍的问题。即使是经验最丰富的 PHP 程序员偶尔也会遇到它们。检查每条语句是否都以分号结尾，以及所有的引号、圆括号、大括号和中括号是否成对。如果你仍然找不到解析错误，请使用\
  \ `/*` 和 `*/` 字符注释掉脚本的大部分。一次取消一个部分，直到你再次看到解析错误。这时你就知道问题出在脚本的哪个位置（或最可能的位置）了。\n\n\
  ## 下一步工作\n\n本书将帮助你开始使用 PHP，但你可能想进一步研究几个主题。不过，在承担更多主题之前，你应该获得更多经验。如果你需要一个良好的问题库来练习，请查看\
  \ Project Euler ([`projecteuler.net/archives`](https://projecteuler.net/archives))。\n\
  \n### 安全\n\nWeb 服务器、操作系统、数据库和 PHP 安全都是值得专门编写书籍的主题。虽然本书演示了如何编写安全的 Web 应用程序，但在这个领域你一直更多的学习空间。从查看这些网站开始：\n\
  \n![Image](img/squf.jpg) A Study in Scarlett ([www.securereality.com.au/studyinscarlett/](http://www.securereality.com.au/studyinscarlett/))\n\
  \n`www.securereality.com.au/studyinscarlett/` 是一篇关于编写安全 PHP 代码的文章。它很老了，但仍然包含基础概念。\n\
  \n![Image](img/squf.jpg) 开源 Web 应用安全项目 (OWASP) ([www.owasp.org](http://www.owasp.org))\n\
  \n`www.owasp.org` 是 Web 安全的标准资源，其十大列表 ([www.owasp.org/index.php/Category:OWASP_Top_Ten_Project](http://www.owasp.org/index.php/Category:OWASP_Top_Ten_Project))\
  \ 是必读的。\n\n你还应该阅读 PHP 手册以及你使用的数据库手册的相关章节。在互联网上搜索 `PHP` 和 `security` 也会找到许多有趣的文章。不过，请注意你阅读的文章日期，以免养成过时的习惯！\n\
  \n### 面向编程\n\n对象和面向对象编程 (OOP) 主题在书中未涵盖，原因有两个：\n\n![Image](img/squf.jpg) 它已超出了入门指南的范畴。\n\
  \n![Image](img/squf.jpg) 不理解对象并不会限制你在 PHP 中能做什么。\n\n当你决定学习这个主题时，可以搜索 PHP 网站、查看框架，或者阅读\
  \ *PHP Advanced and Object-Oriented Programming: Visual Quick Guide* (Peach Press,\
  \ 2013)。书中用了大约 150 页专门讲解 OOP。\n\n### 框架\n\n框架是一个用于开发复杂应用程序的成熟代码库。通过重用经过验证的代码，你可以快速构建网站的部分或全部。\n\
  \n有很多 PHP 框架可用，例如 Zend Framework ([`framework.zend.com`](http://framework.zend.com))。该框架由\
  \ PHP 背后的关键人物创建，并且文档完备。\n\n我个人的 PHP 框架是 Yii ([www.yiiframework.com](http://www.yiiframework.com))。我在我的网站上详细介绍了\
  \ Yii。许多开发者都是 Laravel ([`laravel.com/`](https://laravel.com/)) 的粉丝，你应该考虑一下。本书尊敬的技术编辑\
  \ Paul Reinheimer 是微框架（如 Slim (`www.slimframework.com)）的大实粉丝。\n\n### JavaScript\n\
  \nJavaScript 是一种在浏览器中运行的客户端技术。它可以为网站添加各种动态功能，从简单的视觉效果到交互菜单和表单。因为它在浏览器中运行，JavaScript\
  \ 提供了一些 PHP 无法实现的功能。和 PHP 一样，JavaScript 相对容易学习和使用。更多信息请参见：\n\n![Image` JavaScript.com\
  \ ([www.javascript.com](http://www.javascript.com))\n\n![Image](img/squf.jpg) Mozilla\
  \ 开发者网络 (MDN) ([`developer.mozilla.org/en-US/docs/Web/JavaScript`](https://developer.mozilla.org/en-US/docs/Web/JavaScript))\n\
  \n![Image](img/squf.jpg) W3School 的 JavaScript 页面 ([www.w3schools.com/js/](http://www.w3schools.com/js/))\n\
  \n我强烈建议你考虑学习 jQuery ([www.jquery.com](http://www.jquery.com)) 来帮助你的 JavaScript 需求。jQuery\
  \ 是一个易用、强大且文档相当齐全的 JavaScript 框架。它处于被过度使用的边缘，但它是入门 JavaScript 的一种非常可靠的方式。\n\n###\
  \ 其他书籍\n\n\n\n\n我希望在读完这本书后，你会对学习更多关于 PHP 以及通用的 Web 开发感兴趣。虽然我可以推荐其他作者的书籍，但其中存在着内在的冲突，作为一名竞争作者，我的观点与你作为读者的观点可能不同。因此，我将简单介绍一下我的其他几本书，以及它们与本书的区别。\n\
  \n`PHP and MySQL for Dynamic Web Sites: Visual QuickPro Guide, Fourth Edition` (Peachpit\
  \ Press, 2012) 算是本书的伴读物。内容上会有一些重叠，特别是在前几章，但示例是不同的，而且节奏也更快。特别是 `MySQL` 和 `SQL` 的涵盖范围大得多，并且三个三个示例章节：多语言论坛、用户注册与登录系统，以及电子商务设置。\n\
  \n我的 `PHP Advanced and Object-Oriented Programming: Visual QuickPro Guide, Third\
  \ Edition` (Peachpit Press, 2013) 算是上述 `PHP` 和 `MySQL` 书籍的伴读物。这本书要高级得多，花费了大量时间在\
  \ `OOP` 等主题上。它并不打算像这本书这样线性地阅读，而是每一章都关注一个特定的主题。\n\n我的书籍 `Effortless E-Commerce with\
  \ PHP and MySQL` (New Riders, 2014) 涵盖了创建全功能电子商务网站所需的所有知识。书中使用了两个特定的示例来实现，并结合了两个不同的支付系统。然而，它假设你已经完全熟悉\
  \ `PHP` 和 `MySQL`。\n\n最后，我的 `Modern JavaScript: Develop and Design` (New Riders,\
  \ 2012) 使用当今现代技术教你这种非常重要的编程语言。甚至有一章专门介绍如何一起使用 `PHP` 和 `JavaScript`！\n\n## 表格\n\n\
