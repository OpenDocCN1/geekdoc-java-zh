  ### 5. 创建一个标记变量：\n\n```php\n$problem = false;\n```\n\n`$problem` 变量将用于指示是否发生了错误。具体来说，你希望在正式注册用户之前确保每个表单输入都已填写。最初，此变量被设置为\
  \ `FALSE`，因为还没有发生任何问题。\n\n这与第 6 章 中“控制结构”使用的方法相同。\n\n### 6. 检查是否输入了名字：\n\n点击此处查看代码图片\n\
  \n```php\nif (empty($_POST['first_name']))\n{\n  $problem = true;\n  print '<p class=\"\
  text-- error\">请输入您的名字!</p>';\n}\n```\n\n判断用户是否输入了简单测试是检查变量是否为空。（该技术在第 6 章中首次讨论过）。如果变量为空，则通过将该变量设置为\
  \ `TRUE` 并打印错误消息来指示问题。错误消息的类类型为 `text--error`，以便应用 CSS 格式。（该类定义在 Concise CSS 框架中。）\n\
  \n### 7. 重复对姓和邮箱地址的验证：\n\n点击此处查看代码图片\n\n```php\nif (empty($_POST['last_name']))\
  \ {\n  $problem = true;\n  print '<p class=\"text-- error\">请输入您的姓!</p>';\n}\n\n\
  if (empty($_POST['email'])) {\n  $problem = true;\n  print '<p class=\"text-- error\"\
  >请输入您的邮箱地址!</p>';\n}\n```\n\n这两个检查都是用户名验证例程的变体。\n\n### 8. 验证密码：\n\n点击此处查看代码图片\n\n\
  ```php\nif (empty($_POST['password1'])) {\n  $problem = true;\n  print '<p class=\"\
  text-- error\">请输入密码!</p>';\n}\n\nif ($_POST['password1'] != $_POST['password2'])\
  \ {\n  $problem = true;\n  print '<p class=\"text-- error\">您的密码与确认密码不匹配!</p>';\n\
  }\n```\n\n密码验证需要两个条件判断。第一个检查 `$_POST['password1']` 变量是否为空。第二个检查 `$_POST['password1']`\
  \ 变量是否等于 `$_POST['password2']` 变量。你不需要检查 `$_POST['password2']` 是否为空，因为如果为空而 `$_POST['password1']`\
  \ 不为空，第二个条件将捕捉该问题。如果 `$_POST['password1']` 和 `$_POST['password2']` 都为空，第一个条件将捕捉该错误。\n\
  \n### 9. 检查是否发生了问题：\n\n点击此处查看代码图片\n\n```php\nif (!$problem) {\n  print '<p class=\"\
  text-- success\">你现在注册成功了！<br>好的，你还没有真正注册，但是...</p>';\n  $_POST = [];\n```\n\n如果没有问题，$problem`\
  \ 变量仍然为 `FALSE`，这里的初始条件为 `TRUE`（条件是 `$problem` 的值为 `FALSE`）。在这种情况下，注册过程将会发生。正式注册过程（将数据存储在文件或数据库中）尚未开发，因此在这里用一条简单的消息代替之。\n\
  \n接下来，使用短数组语法为 `$_POST` 变量赋值一个空数组值。此行代码的作用是清空 `$_POST` 变量的内容（即将其重置为空数组）。只有在成功（理论上）注册后才执行此步骤，以确保这些值不会在注册表单中再次显示（例如，参见第\
  \ 12 步）。\n\n### 10. 完成条件判断：\n\n点击此处查看代码图片\n\n```php\n} else {\n  print '<p class=\"\
  text-- error\">请重试!</p>';\n}\n```\n\n（注：第 10 步提供的文本是碎片化的；我根据提供的周围上下文重构了逻辑流。）\n\n\
