  \ => 'White Chicken Chili',\n    'Wednesday' => 'Vegetarian'\n];\n\n// 计数并打印当前元素的数量：\n\
  $count1 = count($soups);\nprint \"<p>The soups array originally\n    had $count1\
  \ elements.</p>\";\n\n// 向数组中添加三项：\n$soups['Thursday'] = 'Chicken\nNoodle';\n$soups['Friday']\
  \ = 'Tomato';\n$soups['Saturday'] = 'Cream of\nBroccoli';\n\n// 计数并打印新数量：\n$count2\
  \ = count($soups);\nprint \"<p>The soups array originally\n    had $count2 elements.</p>\"\
  ;\n\n// 输出数组进行测试\nprint_r($soups);\n?>\n</body>\n</html>\n```\n\n***\n\n向数组中添加元素：\n\
  \n```php\n$list[] = 'pears';\n$list[] = 'tomatoes';\n```\n\n如果你不指定键，每个元素都会追加到现有数组之后，并用下一个顺序数字索引。现在\
