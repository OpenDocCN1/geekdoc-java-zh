  \n\n\n\n此基础查询告诉数据库，你想获取 `entries` 表中每一行的每一列。返回的记录应该根据 `ORDER BY` 子句的指示，按照它们输入的顺序（记录在\
  \ `date_entered` 列中）进行排序，从最近的记录开始。最后这个选项由 `DESC` 设置，它是 *descending*（降序）的缩写。如果查询是\
  \ `ORDER BY date_entered ASC`，则最近添加的记录将最后被检索。\n\n### 4. 运行查询：\n\n点击此处查看代码图像\n\n\
  ```php\nif ($r = mysqli_query($dbc, $query)) {\n```\n\n`SELECT` 查询的运行方式与其他任何查询一样。然而，查询结果被赋值给变量\
  \ `$result`（或更简洁地赋值为 `$r`），该变量稍后会被引用。\n\n### 5. 打印返回的结果：\n\n点击此处查看代码图像\n\n```php\n\
  while ($row = mysqli_fetch_array($r)) {\n  print \"<p><h3>{$row['title']} </h3>\n\
