  Jessica，感谢你所做和能做的一切。\n\n## 处理文件上传 (#ch11.html_ch11lev1sec5)\n## 目录目录 (#ch11.html_ch11lev1sec6)\n\
  ## 创建目录 (#ch11.html_ch11lev1sec7)\n## 增量读取文件 (#ch11.html_ch11lev1sec8)\n## 复习与进\
  \ (#ch11.html_ch11lev1sec9)\n\n\n\n本书假设读者仅具备 HTML 基础知识，尽管你越是在没有 `Dreamweaver` 等\
  \ WYSIWYG 应用程序辅助处理原始 HTML 代码时越熟练，过渡到使用 PHP 就就会越容易。每个程序员最终都会某个时候查阅 HTML 参考资料，无论你了解多少，因此我鼓励你身边放一本良好的\
  \ HTML 书。其中一本此类 HTML 的介绍类书籍是 Elizabeth Castro 和 Bruce Hyslop 写的 *HTML, XHTML, and\
  \ CSS: Visual QuickStart Guide*（Peachpit Press, 2014）。\n\n2.  在 `ini_set()` 行之后，添加以下内容（**第\
  \ 3.5 节**）：\n\n```php\nerror_reporting(E_ALL);\n```\n\n调整脚本的显示错误级别以显示更多问题。\n\n*\
  \ * *\n\n* * *\n\n### 手动向页面发送数据\n\n本章的最后一个示例是对其他主题的一个小插曲，但它利用了用 PHP 处理表单的想法。正如在前面的节“选择表单方法”中提到的，如果表单使用\
  \ GET 方法，生成的 URL 类似于\n\n点击此处查看代码图像\n\n`http://example.com/page.php?var=value&age=20&...`\n\
  \n接收页面（在此处为 `page.php`）接收一系列 name=value 对。\n\n```html\n<!doctype html>\n<html lang=\"\
  en\">\n<head>\n    <meta charset=\"utf-8\">\n    <title>Your Feedback</title>\n\
  </head>\n<body>\n<?php\n// 以这种方式学习\nini_set('display_errors', 1); // 显示所有错误\nerror_reporting(E_ALL);\n\
  \n// 接收变量：\n$title = $_GET['title'];\n$name = $_GET['name'];\n$response = $_GET['response'];\n\
  $comments = $_GET['comments'];\n\n// 打印接收的数据：\necho \"<p>感谢 $title, $name, 的反馈。</p>\"\
  ;\necho \"<p>你说了 $response</p>\";\necho \"<p>$comments</p>\";\n?>\n</body>\n</html>\n\
  ```\n\n\n\n\n\n要亲身尝试这一点，接下来的两个脚本将通过一个硬编码的 HTML 页面来轻松演示这一概念。\n\n### 要创建 HTML 页面：\n\
  \n**1.** 在你的文本编辑器或 IDE 中创建一个新文档，命名为 `hello.html`（脚本 3.6`）：\n\n点击此处查看代码图片\n\n```html\n\
  <!doctype html\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Greetings!</title>\n\
  </head>\n<body>\n<!-- Script 3.6 - hello.html -->\n\n**脚本 3.6** 此 HTML 页面使用链接在 URL\
  \ 中将值传递给 PHP 脚本（从而模拟一个使用 GET 方法的表单）。\n\n\n\n点击此处查看代码图片\n\n```html\n1   <!doctype\
  \ html\n2   <html lang=\"en\">\n3   <head>\n4      <meta charset=\"utf-8\">\n5 \
  \     <title>Greetings!</title>\n6   </head>\n7   <body>\n8   <!-- Script 3.6 -\
  \ hello.html -->\n9   <div><p>Click a link to say hello:</p>\n10\n11  <ul>\n12 \
  \     <li><a href=\"hello.php?name=Michael\">Michael</a></li>\n13      <li><a href=\"\
  hello.php?name=Celia\">Celia</a></li>\n14      <li><a href=\"hello.php?name=Jude\"\
  >Jude</a></li>\n15      <li><a href=\"hello.php?name=Sophie\">Sophie</a></li>\n\
  16  </ul>\n17\n18  </div>\n19 </body>\n20 </html>\n```\n*(注：此处代码中 body 标签缺少闭合括号，翻译已保持原样)*\n\
  \n**2.** 创建指向 PHP 脚本的链接，并在 URL 中传递相应值：\n\n点击此处查看代码图片\n\n```html\n<ul>\n  <li><a\
  \ href=\"hello.php?name= Michael\">Michael</a></li>\n  <li><a href=\"hello.php?name=\
  \ Celia\">Celia</a></li>\n  <li><a href=\"hello.php?name= Jude\">Jude</a></li>\n\
  \  <li><a href=\"hello.php?name= Sophie\">Sophie</a></li>\n</ul>\n```\n\n这里的原理是用户将看到一个链接列表，每个链接都关联一个名称。当用户点击链接时，该名称将通过\
  \ URL 传递给 `hello.php`。这个简单的 HTML 页面包含四个指向 PHP 脚本的链接。页面的 HTML 源码显示了值是如何在这四个链接中传递的。如果你想使用不同的名称，那是可以，但请坚持使用带空格或标点的单单词名称，否则它们将无法正确传递给\
  \ PHP 脚本。\n\n**3.** 完成 HTML 页面：\n\n```html\n</div>\n</body>\n</html>\n```\n\n**4.**\
  \ 将脚本保存为 `hello.html`，并将其放置在启用 PHP 的服务器的正确目录中。**5.** 通过 URL 加载 HTML 页面。虽然你可以不通过\
  \ URL 直接查看 HTML 页面，但你将点击此页面中的链接来访问 PHP 脚本，因此你需要开始在此使用 URL。先不要点击任何链接，因为 PHP 脚本还不存在！\n\
  \n### 要创建 PHP 脚本：\n\n**1.** 在你的文本编辑器或 IDE 中创建一个新文档，命名为 `hello.php`（脚本 3.7`）：\n\n\
  ```html\n<!doctype html\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n\
  \  <title>Greetings!</title>\n  <style type=\"text/css\">\n    .bold {\n      font-weight:\
  \ bolder;\n    }\n  </style>\n</head>\n<body>\n```\n\n**脚本 3.7** 此 PHP 页面引用 URL\
  \ 中传递的名称值来打印问候语。\n\n点击此处查看代码图片\n\n```php\n1   <!doctype html\n2   <html lang=\"\
  en\">\n3   <head>\n4      <meta charset=\"utf-8\">\n5      <title>Greetings!</title>\n\
  6   <style type=\"text/css\">\n7      .bold {\n8        font-weight: bolder;\n9\
  \      }\n10   </style>\n11 </head>\n12 <body>\n13   <?php // Script 3.7 - hello.php\n\
  14\n15   ini_set('display_errors', 1); // 让我从错误中学习！\n16   error_reporting(E_ALL);\
  \ // 显示所有可能的问题！\n17\n18   // 此页面应该在 URL 中接收一个名称值。\n19\n20   // 打印“Hello”：\n21  \
  \ $name = $_GET['name'];\n22   print \"<p>Hello, <span class=\\\"bold\\\">$name</span></p>\"\
  ;\n23\n24  ?>\n25 </body>\n26 </html>\n```\n\n**2.** 开始 PHP 代码：\n\n点击此处查看代码图片\n\n\
  ```php\n<?php // Script 3.7 - hello.php\n```\n\n**3.** 如果需要，处理错误管理：\n\n```php\n\
  ini_set('display_errors', 1);\nerror_reporting(E_ALL);\n```\n\n这两行配置了 PHP 如何响应错误，在这一节之前的页面中已进行了解释。它们对于你的情况来说可能是必要的，也可能不需要，但会有帮助。\n\
  \n**4.** 使用 URL 中传递的名称值创建问候语：\n\n点击此处查看代码图片\n\n```php\n$name = $_GET['name'];\n\
  print \"<p>Hello, <span class=\\\"bold\\\">$name</span></p>\";\n```\n\n`name` 变量通过\
  \ URL 发送到页面（请参见 脚本 3.6）。要访问该值，请参考 `$_GET['name']`。同样，你会使用 `$_GET`（而不是 `$_POST`），因为该值来自\
  \ GET 请求。与早期的 PHP 脚本一样，预定义变量 `$_GET` 中的值首先被赋值给另一个变量，以简化 `print` 语句中的语法。\n\n**5.**\
  \ 完成 PHP 代码和 HTML 页面：\n\n```php\n?>\n</body>\n</html>\n```\n\n**6.** 将脚本保存为 `hello.php`，并将其放置在启用\
  \ PHP 的服务器的正确目录中。因为 `hello.php` 从 URL 读取值，所以它独立于 `hello.html` 运行。例如，你可以直接编辑 `hello.php`\
  \ 的 URL 来问候任何人，即使 `hello.html` 中没有为他们的链接。\n\n\n\n\n\n![Image](img/squf.jpg) 在什么情况下，在脚本中启用\
  \ `display_errors` 的尝试会失败？为什么在上线网站上启用 `display_errors` 的安全性较低？\n\n### 探索\n\n![Image](img/squf.jpg)\
  \ 在不通过 URL 的情况下，直接在浏览器中加载 `feedback.html`（这意味着地址栏可能会以 `file://` 开头）。填写并提交表单。观察结果，以便在将来以后看到类似的结果时，能够识别出此问题并理解其原因。\n\
  \n![Image](img/squf.jpg) 如果你还没有开启，并且在可以的情况下，请确保在你的开发环境中已启用了 `display_errors`。\n\n\
  ![Image](img/squf.jpg) 如果你还没有设置，并且在可以的情况下，请确保在你的开发环境中将 `error_reporting` 已设置为 `E_ALL`（在较早的\
  \ PHP 版本中为 `E_ALL | E_STRICT`）。\n\n![Image](img/squf.jpg) 尝试在 PHP 脚本中引入不同的错误——通过不正确地配对引号、缺少分号、不当引用引用变量等——来查看结果。\n\
  \n![Image](img/squf.jpg) 尝试通过 `hello.html` 和 `hello.php` 页面，通过 URL 向 PHP 脚本发送不同的值（包括数字）。\n\
  \n![Image](img/squf.jpg) 创建 `hello.html` 的变体，向 PHP 脚本发送多个 `name=value` 键对。让 PHP\
  \ 脚本打印所有接收到的值。\n\n![Image](img/squf.jpg) 如果你是一个好奇型且不介意等待答案，尝试通过 URL 向页面传递更复杂的值。尝试使用空格和标点符号看看会发生什么。\n\
  \n![Image](img/squf.jpg) 创建一个新的 HTML 表单，执行你认为自己需要的任务（或该功能的轻量版本）。然后创建一个处理表单的 PHP\
  \ 脚本，仅打印接收到的数据。\n\n## 4. 数字\n\n在本章\n- 创建表单\n- 执行算术运算\n- 数字格式化\n- 理解优先级\n- 数字的递增与减少\n\
  - 生成随机数\n- 复与探索\n\n第 2 章 “变量”简要讨论了各种类型的变量、如何为它们赋值以及它们通用法。在本章中，你将专门处理数字变量——包括整数（整数）和浮点数（也称为\
  \ floats 或小数）。\n\n你将从创建一个用于生成数字变量的 HTML 表单开始。然后学习如何执行基本算术运算、如何格式化数字以及如何处理运算符优先级。本章最后两个部分涵盖了数字的递增和减少以及随机数的生成。在整个章节中，你还将学习其他与其他数字相关的\
  \ PHP 函数。\n\n### 创建表单\n\n本章中的大多数 PHP 示例将基于电子商务假设执行各种计算。表单将接收价格、数量、折扣金额、税率和运费 ![Image](img/a.jpg)，处理表单的\
  \ PHP 脚本将返回总成本。该成本还将根据用户想要支付的次数进行拆分，以生成每月成本值 ![Image](img/b.jpg)。\n\n![Image](img/04fig01.jpg)\n\
  \n![Image](img/a.jpg) 此表单从用户处接收数字并发送到 PHP 页面。\n\n![Image](img/04fig02.jpg)\n\n![Image](img/b.jpg)\
  \ PHP 脚本对提交的数据进行一系列计算并输出结果。在本章结束时，结果将如下所示。\n\n首先，让我们创建一个允许用户输入值的 HTML 页面。\n\n创建\
  \ HTML 表单：\n\n**1.** 在你的文本编辑器或 IDE 中开始一个一个新的 HTML 文档，命名为 `calculator.html`（**脚本\
  \ 4.1**）：\n\n点击此处查看代码图像\n\n```\n<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta\
  \ charset=\"utf-8\">\n  <title>Product Cost Calculator</title>\n</head>\n<body><!--\
  \ Script 4.1 - calculator.html -->\n<div><p>填写此表单以计算总成本：</p>\n```\n\n**脚本 4.1**\
  \ 此基础 HTML 表单将为多个 PHP 脚本中的各种数学计算提供数字。\n\n点击此处查看代码图像\n\n```\n1   <!doctype html>\n\
  2   <html lang=\"en\">\n3   <head>\n4       <meta charset=\"utf-8\">\n5       <title>Product\
  \ Cost Calculator</title>\n6   </head>\n7   <body><!-- Script 4.1 - calculator.html\
  \ -->\n8   <form action=\"handle_calc.php\" method=\"post\">\n9   <div><p>填写此表单以计算总成本：</p>\n\
  10  <p>价格：<input type=\"text\" name=\"price\" size=\"5\"></p>\n11  <p>数量：<input\
  \ type=\"number\" name=\"quantity\" size=\"5\" min=\"1\"></p>\n12  <p>折扣：<input\
  \ type=\"text\" name=\"discount\" size=\"5\"></p>\n13  <p>税率：<input type=\"text\"\
  \ name=\"tax\" size=\"5\"> (%)</p>\n14  <p>运费：<select name=\"shipping\">\n15  <option\
  \ value=\"5.00\">慢工稳打</option>\n16  <option value=\"8.95\">尽快送达</option>\n17  <option\
  \ value=\"19.36\">立即送达</option>\n18  </select></p>\n19  <p>支付次数：<input type=\"number\"\
  \ name=\"payments\" size=\"5\" min=\"1\" value=\"1\"></p>\n20  <input type=\"submit\"\
  \ name=\"submit\" value=\"Calculate!\">\n21  </form>\n22 </div>\n23 </body>\n24</html>\n\
  ```\n\n**2.** 创建初始表单标签：\n\n点击此处查看代码图像\n\n```\n<form action=\"handle_calc.php\" method=\"\
  post\">\n```\n\n此标签开始了 HTML 表单。其 `action` 属性指示数据将提交到名为 `handle_calc.php` 的页面。`method`\
  \ 属性告诉页面使用 `POST` 方法发送数据。请参第 3 章 “HTML 表单与 PHP”了解选择方法。\n\n**3.** 为价格、数量、折扣和税率创建输入框：\n\
  \n点击此处查看代码图像\n\n```\n<p>价格：<input type=\"text\" name=\"price\" size=\"5\"></p>\n\
  <p>数量：<input type=\"number\" name=\"quantity\" size=\"5\" min=\"1\"></p>\n<p>折扣：<input\
  \ type=\"text\" name=\"discount\" size=\"5\"></p>\n<p>税率：<input type=\"text\" name=\"\
  tax\" size=\"5\"> (%)</p>\n```\n\n尽管 HTML5 有数字输入类型，但它并不总是解决方案，因为它更自然地适合获取整数值。因此，数量输入将是数字类型，而其他将是文本类型。\n\
  \n为了引导用户，括号指示税率应以百分比输入。\n\n记住用于插入 `names` 应该对应有效的 PHP 变量名：仅使用字母、数字和下划线；不要以数字开头；等等。\n\
  \n**4.** 添加一个允许用户选择运费方式的字段：\n\n点击此处查看代码图像\n\n```\n<p>运费：<select name=\"shipping\"\
  >\n<option value=\"5.00\">慢工稳打</option>\n<option value=\"8.95\">尽快送达</option>\n\
  <option value=\"19.36\">立即送达</option>\n</select></p>\n```\n\n运费选择通过下拉菜单进行。选中选项的值是该选项的成本。如果用户选择了（例如）*尽快送达*选项，则\
  \ `handle_calc.php` 中的 `$_POST['shipping']` 值将为 *8.95*。\n\n**5.** 完成 HTML 表单：\n\n\
  点击此处查看代码图像\n\n```\n<p>支付次数：<input type=\"number\" name=\"payments\" size=\"5\" min=\"\
  1\" value=\"1\"></p>\n<input type=\"submit\" name=\"submit\" value=\"Calculate!\"\
  >\n```\n\n\n\n\n最后两个输入类型接收一个数字，表示所需的付款次数，然后创建一个提交按钮（标记为 `Calculate!`）。闭合的表单标签标记了页面表单部分的结束。\n\
  \n### 6. 完成 HTML 页面：\n\n```html\n</div>\n</</body>\n</</html>\n```\n\n### 7. 将脚本保存为\
  \ `calculator.html`，并在浏览器中查看它。\n\n由于这是一个 HTML 页面，你可以直接在浏览器中查看它。\n\n## 执行算术运算\n\n\
  正如你在小学学过的那样，基础数学涉及加、减、乘、除的原理。这些运算在 PHP 中通过最直观的运算符来完成：\n\n![Image](img/squf.jpg)\
  \ 加法 (`+`)\n![Image](img/squf.jpg) 减法 (`-`)\n![Image](img/squf.jpg) 乘法 (`*`)\n![Image](img/squf.jpg)\
  \ 除法 (`/`)\n\n为了使用这些运算符，你将创建一个 PHP 脚本，计算销售某些小部件的总成本。这个处理脚本可以作为购物车应用程序的基础——这是一个非常实用的网页功能（尽管在这种情况下，相关的数值将来自\
  \ `calculator.html`）。\n\n当你编写此脚本时，务必注意注释（脚本 4.2），这些注释解释了不同的代码行及其后的逻辑。\n\n**脚本 4.2**\
  \ 此 PHP 脚本使用表单提交的数字执行所有标准的数学计算。\n\n点击此处查看代码图像\n\n```php\n<!doctype html>\n<html\
  \ lang=\"en\">\n<head>\n    <meta charset=\"utf-8\">\n    <title>Product Cost Calculator</title>\n\
  \    <style type=\"text/css\">\n        .number { font-weight: bold; }\n    </style>\n\
  </head>\n<body>\n<?php // Script 4.2 - handle_calc.php\n/* 此脚本从\n    calculator.html\
  \ 获取值并执行\n    总成本和每月付款\n    计算。 */\n\n// 如果需要，处理错误处理。\n\n// 从 $_POST 数组中获取值：\n$price\
  \ = $_POST['price'];\n$quantity = $_POST['quantity'];\n$discount = $_POST['discount'];\n\
  $tax = $_POST['tax'];\n$shipping = $_POST['shipping'];\n$payments = $_POST['payments'];\n\
  \n// 计算总额：\n$total = $price * $quantity;\n$total = $total + $shipping;\n$total =\
  \ $total - $discount;\n\n// 确定税率：\n$taxrate = $tax / 100;\n$taxrate = $taxrate +\
  \ 1;\n\n// 考虑税率：\n$total = $total * $taxrate;\n\n// 计算每月付款：\n$monthly = $total /\
  \ $payments;\n\n// 输出结果：\nprint \"<p>您选择购买：<br>\n<span class=\\\"number\\\">$quantity</span></span>\
  \ 个小部件，单价为 <br>\n$<span class=\\\"number\\\">$price</span></span>，另加 <br>\n$<span\
  \ class=\\\"number\\\">$shipping</span></span> 的运费和 <br>\n<span class=\\\"number\\\
  \">$tax</span></span> 的税率。<br>\n在享受 $<span class=\\\"number\\\">$discount</span></span>\
  \ 折扣后，总成本为\n$<span class=\\\"number\\\">$total</span></span>。<br>\n分摊到 <span class=\\\
  \"number\\\">$payments</span></span> 期每月付款，每期为\n$<span class=\\\"number\\\">$monthly</span></span>。</p>\"\
  ;\n?>\n</body>\n</html>\n```\n\n## 创建你的销售计算器：\n\n**1.** 在你的文本编辑器或 IDE 中创建一个新文档，并命名为\
  \ `handle_calc.php`（脚本 4.2）：\n\n```html\n<!doctype html>\n<html lang=\"en\">\n<head>\n\
  \    <meta charset=\"utf-8\">\n    <title>Product Cost Calculator</title>\n    <style\
  \ type=\"text/css\">\n        .number {font-weight:bold;}\n    </style>\n</head>\n\
  <body>\n```\n文档头部定义了一个 CSS 类 `number`。页面中任何带有该类名的元素都将获得额外的字体权重。换句话说，当表单中的数字以及各种计算结果在脚本的输出中打印出来时，它们将变得更加明显。\n\
  \n**2.** 插入 PHP 标签并根据需要处理错误处理：\n\n```php\n<?php // Script 4.2 - handle_calc.php\n\
  ```\n取决于你的 PHP 配置，你可能想或不想添加几行来开启 `display_errors` 并调整错误报告级别。具体细节请参阅 第 3 章。（不过，正如该章节提到的，最好在\
  \ PHP 的主文件中进行这些调整。）\n\n**3.** 将 `$_POST` 元素分配给本地变量：\n\n```php\n$price = $_POST['price'];\n\
  $quantity = $_POST['quantity'];\n$discount = $_POST['discount'];\n$tax = $_POST['tax'];\n\
  $shipping = $_POST['shipping'];\n$payments = $_POST['payments'];\n```\n脚本将在预定义的\
  \ `$_POST` 变量中接收所有表单数据。为了访问单个值，我们在这里将这些值分配给局部变量，以便在脚本的其他部分使用。\n\n**4.** 开始计算总额：\n\
  \n```php\n$total = $price * $quantity;\n$total = $total + $shipping;\n$total = $total\
  \ - $discount;\n```\n星号 (`*`) 在 PHP 中表示乘法，因此总额首先是购买数量 (`$quantity`) 乘以单价。然后，运费被加到总额中（请记住运费对应于\
  \ `option` 标签的 `value`），最后减去折扣。\n\n**5.** 计算税率和新总额：\n\n```php\n$taxrate = $tax /\
  \ 100;\n$taxrate = $taxrate + 1;\n$total = $total * $taxrate;\n```\n税率应以百分比输入——例如\
  \ `8` 或 `5`。该数字随后除以 `100` 以得到百分比的等值（`.08` 或 `.05`）。最后，通过将该税率加上 `1` 然后乘以总额来计算物品的税费（例如，$100\
  \ 的 5% 税为 $5，这等同于 `$100` 乘以 `1.05`）。\n\n**6.** 计算每月付款：\n\n```php\n$monthly = $total\
  \ / $payments;\n```\n作为除法的示例，假设小部件可以在几个月内付清。因此，你将总额除以付款次数以得出每月付款。\n\n**7.** 输出结果：\n\
  \n```php\nprint \"<p>您选择购买：<br>\n<span class=\\\"number\\\">$quantity</span></span>\
  \ 个小部件，单价为 <br>\n$<span class=\\\"number\\\">$price</span></span>，另加 <br>\n$<span\
  \ class=\\\"number\\\">$shipping</span></span> 的运费和 <br>\n<span class=\\\"number\\\
  \">$tax</span></span> 的税率。<br>\n在享受 $<span class=\\\"number\\\">$discount</span></span>\
  \ 折扣后，总成本为\n$<span class=\\\"number\\\">$total</span></span>。<br>\n分摊到 <span class=\\\
  \"number\\\">$payments</span></span> 期每月付款，每期为\n$<span class=\\\"number\\\">$monthly</span></span>。</p>\"\
  ;\n```\n`print` 语句将每个值连同一些文本发送到浏览器。为了方便阅读，增加了 `<br>` 标签以格式化浏览器结果；此外，`print` 函数跨行操作以使\
  \ PHP 代码更整洁。每个变量的值将通过封装在带有 `class` 属性为 `number` 的 `span` 标签中在浏览器中突出显示（见第 1 步）。\n\
