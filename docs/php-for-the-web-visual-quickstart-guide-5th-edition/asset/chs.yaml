  \ Cookie 都提示你。参见侧边栏“调试 Cookies”。\n\n### 12. 在浏览器中运行脚本 ![Image](img/e.jpg) 和 ![Image](img/f.jpg)。\n\
  \n![Image](img/09fig07.jpg)\n\n![Image](img/e.jpg) 当首次调用 `setcookie()` 时，如果用户选择了在接受\
