  \n* * *\n\n提示\n\n现在不再要求确认密码已变得越来越普遍，而是在用户出错或忘记输入过的内容时依赖于密码重置功能。我显然倾向于不需要确认密码（尽管无论如何我都会使用密码管理应用程序），但你会在网上看到这两种方法。\n\
  \n* * *\n\n* * *\n\n提示\n\n大多数注册页面使用昵称或邮箱地址作为用户名。如果你使用邮箱地址作为用户名，对你的用户来说，记住注册信息会更容易（用户可能只有几个邮箱地址，但在网络上不同的网站有数不尽的用户名）。此外，邮箱地址从本质上对个人是唯一的，而用户名并非如此。\n\
  \n* * *\n\n### if 条件语句\n\n基础的编程条件是标准的 `if`（以前被称为 `if-then` 条件——现在的 `then` 是隐含的）。这种条件的语法非常简单：\n\
  \n```php\nif (condition) {\n  statement(s);\n}\n```\n\n`condition` 必须放在括号内；然后 `statement(s)`\
  \ 放在大括号内（你也会看到这些被称为“curly braces”或“curly brackets”）。这些语句是待执行的命令——例如，打印字符串或将两个数字相加。每个独立的语句都必须有自己的分号表示行的结束，但与条件语句关联的语句数量没有限制。\n\
  \n语句通常会相对于初始的 `if` 行缩进，以表示它们是条件判断的结果，但这种格式在语法上并不是强制要求的。你还会看到人们使用这种语法：\n\n```php\n\
  if (condition)\n{\n  statement(s);\n}\n```\n\n如何排列大括号取决于个人喜好——这也是网上微小争论的来源。只需选择一种你喜欢的风格并坚持下去即可。\n\
  \n在每个语句后没有使用分号、遗漏左或右括号或大括号，或者在大括号之后使用分号，都会导致错误发生。在编写条件语句代码时，请注意你的语法！\n\nPHP 使用布尔概念\
  \ `TRUE` 和 `FALSE` 来确定是否执行语句。如果条件为 `TRUE`，则执行语句；如果为 `FALSE`，则不执行![Image](img/a.jpg)\n\
  \n![Image](img/06fig03.jpg)\n\n![Image](img/a.jpg) if 条件语句如何影响脚本程序流。\n\n在本章中，将开发一个\
  \ PHP 脚本直到它能够完全验证 `register.html` 表单数据。首先，这个第一个版本的脚本将只创建验证过程的基本框架，定义并使用一个布尔值变量来跟踪验证过程的成功情况。\n\
  \n要创建一个 if 条件语句：\n\n**1.** 在你的文本编辑器或 IDE 中新建一个文档，命名为 `handle_reg.php` (**脚本 6.2**)：\n\
