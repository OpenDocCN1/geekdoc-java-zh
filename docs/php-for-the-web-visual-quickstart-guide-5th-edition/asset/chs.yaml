  \ 等）。\n\n### 5. 完成 `is_array()` 条件：\n\n点击此处查看代码图像\n\n```php\n} else {\n  print '请为此事件至少选择一个星期几!';\n\
  }\n```\n\n如果没有选择任何星期几，那么 `isset()` 和 `is_array()` 条件即为假，并打印出此消息。\n\n### 6. 完成主段落、PHP\
