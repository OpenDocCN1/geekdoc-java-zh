  ## 在 Windows 上安装\n\n虽然你可以在 Windows 计算机上单独安装 Web 服务器（如 `Apache`、`Nginx` 或 `IIS`）、`PHP`\
  \ 和 `MySQL`，但我强烈建议你使用合一安装程序。这样做更简单、更可靠。\n\nWindows 上有多种合一安装程序。我看到提到频率最高的四种是：\n\n\
  ![Image](img/squf.jpg) XAMPP ([www.apachefriends.org](http://www.apachefriends.org))\n\
  \n![Image](img/squf.jpg) WAMP ([www.wampserver.com](http://www.wampserver.com))\n\
  \n![Image](img/squf.jpg) AMPPS ([www.ampps.com](http://www.ampps.com))\n\n![Image](img/squf.jpg)\
  \ Bitnami ([www.bitnami.com](http://www.bitnami.com)), 它也与 XAMPP 合作\n\n对于本附录，我将使用\
  \ `XAMPP`，它运行在 Windows 2008、2012、Vista、7 和 8。（XAMPP 网站没有提到 Windows 10，但你应该也能在该版本的\
  \ Windows 上使用 `XAMPP`。）\n\n## 关于防火墙\n\n防火墙通过多种方式阻止通信，最常见的是通过`端口`：即计算机的访问点。从 XP Service\
  \ Pack 2 开始的 Windows 版本包含内置防火墙。你也可以下载并安装第三方防火墙。防火墙可以提高计算机的安全性，但它们可能会干扰你运行 `Apache`、`MySQL`\
  \ 以及 `XAMPP` 使用的其他工具，因为它们都使用了端口。\n\n首次在安装过程中，如果看到安全提示显示防火墙正在拦截 `Apache`、`MySQL`\
  \ 等程序，请选择“取消阻止（Unblock）”或“允许（Allow access）”。否则，你可以通过操作系统设置手动配置防火墙。\n\n需要开放的端口如下：`Apache`\
  \ 使用 `80`，`MySQL` 使用 `3306`，`Mercury` 邮件服务器使用 `25`。如果你在启动或访问其中任何一个程序时遇到问题，请禁用防火墙查看是否恢复正常。如果是这样，你就知道问题出在防火墙，需要重新配置。\n\
  \n说明一下，防火墙并不只存在于 Windows，但就本附录的指令而言，防火墙的存在比任何其他因素都更容易让 Windows 用户遇到麻烦。\n\n除了 `Apache`、`PHP`\
  \ 和 `MySQL` 之外，`XAMPP` 还安装了以下内容：\n\n![Image](img/squf.jpg) `phpMyAdmin`，基于 Web 的\
  \ `MySQL` 器器界面\n\n![Image](img/squf.jpg) `OpenSSL`，用于安全连接\n\n![Image](img/squf.jpg)\
  \ 一个邮件服务器（用于发送电子邮件）\n\n![Image](img/squf.jpg) 几个实用的扩展程序\n\n截至本文写作时，`XAMPP`（版本 7.0.6）安装了\
  \ `PHP` 7.0.6、`Apache` 2.4.18 和 `phpMyAdmin` 4.5.1。不过，有一个陷阱！\n\n从 `XAMPP` 5.5.30\
  \ 开始，安装程序包含了 `MariaDB` ([www.mariadb.com](http://www.mariadb.com)) 而不是 `MySQL`。`MariaDB`\
  \ 是 `MySQL` 的开源分支，功能上等同。尽管 `XAMPP` 安装的是 `MariaDB` 而不是 `MySQL`，但在遵循书中所有针对 `MySQL`\
  \ 的特定指令或代码时，你应该遇到任何问题。\n\n我将在接下来的步骤中介绍安装过程。请注意，如果你遇到任何问题，可以使用书的支持论坛（[www.LarryUllman.com/forums/](http://www.LarryUllman.com/forums/)），但你转向\
  \ `XAMPP` 网站可能会更有收获（毕竟那是他们的产品）。此外，安装程序运行得非常好，并不很难使用，因此我不会详细说明过程中的每一个步骤，而是将重点介绍最重要的考虑因素。\n\
  \n### 在 Windows 上安装 XAMPP：\n\n1. 从 [www.apachefriends.org](http://www.apachefriends.org)\
  \ 下载最新的 Windows 版 `XAMPP` 发布版 ![Image](img/a.jpg)。\n\n![Image](img/afig01.jpg)\n\
  \n![Image](img/a.jpg) 从 Apache Friends 网站获取最新的 Windows 安装程序。我建议你获取可用的最新 `PHP` 版本，尽管如果你使用\
  \ `PHP` 5 版本，使用书中的内容也没有问题。\n\n2. 在你的计算机上，双击下载的文件开始安装过程。\n\n3. 当提示时 ![Image](img/b.jpg)，安装所有组件。\n\
