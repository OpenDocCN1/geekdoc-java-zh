  \ 2016 年之前。\n\n**提示**\n在长且复杂的条件判断中，很容易漏掉一个括号或大括号，这会导致错误消息或意外结果。找到一种方法（如调整间距和使用注释）来帮助理代码。另一种良好的技巧是先创建条件的完整结构，然后再回来添加细节。\n\
  \n**提示**\n如果你在让 `if-else` 语句执行时遇到困难，请打印变量的值以帮助调试问题。条件判断可能不是真或假，是因为变量的值并不是你认为的那个。\n\
  \n## 合并运算符\nPHP 7 新引入了合并运算符，这是一个听起来很高大但非常实用的快捷方式。你通常会检查一个变量是否有值，如果没有，则给它分配一个默认值。在\
  \ PHP 7 之前，可以使用如下代码来实现：\n```php\nif (isset($_POST['var'])) {\n    $var = $_POST['var'];\n\
  } else {\n    $var = 'default value';\n}\n```\n得益于合并运算符 `??`，这段代码可以简化为：\n```php\n\
  $var = $_POST['var'] ?? 'default value';\n```\n结果在语义上是相同的，但后者仅需四分之一的代码量。\n\n## 使用\
  \ elseif\n与 `if-else` 条件判断类似的是 `if-elseif`（或 `if-elseif-else`）。这种条件判断像一个运行中的 `if`\
  \ 语句，可以扩展到所需的任何复杂度：\n```php\nif (condition1) {\n    statement(s);\n} elseif (condition2)\
  \ {\n    other_statement(s);\n} else {\n    other_other_statement(s);\n}\n```\n\n\
  \n\n\n\n如果存在 `else`，你必须始终将其作为条件判断的最后部分，因为除非在此之前满足了其中一个条件，否则它就会执行（再次强调，`else` 代表默认行为）。然而，你可以在一个\
  \ `if` 条件判断中根据需要继续使用多少次 `elseifs`。如果你不需要默认结果，也可以省略 `else` 子句。\n\n为了说明这一点，让我们创建一个根据所选颜色值打印消息的条件判断。\n\
  \n### 要使用 elseif 句句：\n\n1.  在你的文本编辑器或 IDE 中打开 `handle_reg.php`（脚本 6.6），如果它尚未打开的话。\n\
  \n2.  在 `$okay` 条件判断之前，开始一个新的条件判断（**脚本 6.7**）：\n\n点击此处查看代码图片\n\n```php\nif ($_POST['color']\
  \ == 'red') {\n  $color_type = 'primary';\n}\n```\n\n**脚本 6.7** 此多行 `if-elseif-else`\
  \ 条件判断验证了提交的颜色是否具有允许的值，并用于确定所选颜色的类型。\n\n点击此处查看代码图片\n\n```html\n1   <!doctype html>\n\
  2   <html lang=\"en\">\n3   <head>\n4       <meta charset=\"utf-8\">\n5       <title>Registration</title>\n\
  6       <style type=\"text/css\" media=\"screen\">\n7           .error { color:\
  \ red; }\n8       </style>\n9   </head>\n10 <<body>\n11 <h1>Registration Results</h1>h>\n\
  12  <?php // Script 6.7 - handle_reg.php #6\n13   /* 此脚本从 register.html\n14    \
  \ 接收七个值：\n15     email, password, confirm, year, terms,\n16     color, submit */\n\
