  \ PHP 的脚本也会通过 URL 运行。\n\n> **提示**\n你可以使用连接符连接任意数量的字符串。你甚至可以将数字连接到字符串：\n\n点击此处查看代码图片\n\
  \n```php\n$new_string = $s1 . $s2 . $number;\n```\n\n这之所以有效是因为 PHP 是弱类型的，这意味着它的变量不会锁定在特定的格式上。在这里，$number`\
  \ 变量将被转换为字符串并附加到 `$new_string` 变量的值之后。\n\n> **提示**\n连接可以用多种方式，即使在向函数传递参数时也是如此。一个不常见但有效的示例是\n\
  \n点击此处查看代码图片\n\n```php\n$text = nl2br($heading . $body);\n```\n\n`nl2br()` 函数首次在第\
  \ 1 章“PHP 入门”中提到，将在将在文中详细讨论。\n\n> **提示**\n如果你在表单中使用了任何类型的引号，并在打印结果中看到多余的斜杠，请参阅第\
  \ 3 章中的侧边栏“Magic Quotes”以获取原因说明和修复方法。这在当前的 PHP 版本中并不常见。\n\n> **提示**\n提醒一下，理解 PHP\
  \ 中单引号和双引号之间的区别非常重要。单引号内的字符被视为字面量；双引号内的字符会被解析（例如，变量名将被替换为它的值）。请参第 3 章进行复习。\n\n>\
  \ **提示**\n将姓和名作为单独输入是一个很好的连接示例。然而，并不是每个人都只有两个名字，在你自己的注册表单中最好不要做这样的假设。更具包容性的示例是为用户的姓名提供单个输入框。\n\
  \n### 处理换行\n\n开发者经常的一个常见问题涉及处理字符串中的换行。`textarea` 元素允许用户通过按 `Enter` 键输入多行。每次使用 `Enter`\
  \ 都等同于字符串中的一个换行。`textarea` 中的换行有效，但对渲染后的页面没有影响。要创建等同于换行的效果，你需要使用 `<br>` 标签：幸运的是，PHP\
  \ 有 `nl2br()` 函数，它可以自动将换行转换为换：\n\n```php\n$posting = nl2br($_POST['posting'], false);\n\
  ```\n\n现在，$posting` 将分配 `$_POST['posting']` 的值，并将任何换行转换为 HTML 换行标签。该函数的第二个参数——布尔值\
  \ `false`——表示你不想创建符合 XHTML 标准的换行标签。换言之，该函数的默认行为是将换行替换为 `<br />`。在 HTML5 中，通常使用 `<br>`。\n\
  \n\n\n\n\n如目前为止多次提到的那样，PHP 是一种经常用于向浏览器发送数据的服务器端技术。这些数据可以是纯文本、HTML 代码的形式存在，或者更常见的是，两者兼具。\n\
  \n在本章的主要示例中，数据在 HTML 表单中输入，然后使用 PHP 打印回浏览器。一个潜在的问题是用户可以在表单中输入 HTML 字符，这可能会影响结果页的格式\
  \ ![Image](img/a.jpg) ![Image](img/b.jpg)——更糟糕的是，会导致安全问题。\n\n![Image](img/05fig08.jpg)\n\
  \n![Image](img/a.jpg) 如果用户在发布中输入了 HTML 代码...\n\n![Image](img/05fig09.jpg)\n\n![Image](img/b.jpg)\
  \ ...它在重新打印时会被浏览器渲染。\n\n你可以使用几个 PHP 函数来处理 PHP 字符串变量中的 HTML 标签：\n\n![Image](img/squf.jpg)\
  \ `htmlspecialchars()` 将某些 HTML 标签转换为它们的实体版本。\n\n![Image](img/squf.jpg) `htmlentities()`\
  \ 将所有 HTML 标签转换为它们的实体版本。\n\n![Image](img/squf.jpg) `strip_tags()` 移除所有 HTML 和 PHP\
  \ 标签。\n\n前两个函数将 HTML 标签（例如 `<span>`）转换为类似 `&lt;span&gt;` 的实体版本。实体版本出现在输出中但不会被渲染。如果你想显示代码而不执行它，可以使用其中任何一个函数。第三个函数\
  \ `strip_tags()` 则完全移除 HTML 和 PHP 标签。\n\n出于两个原因，你应该留意用户提供的数据中的特殊标签。首先，正如提到的，提交的\
  \ HTML 可能会影响渲染的页面（例如弄乱表格、调整 CSS 或仅在不该有的地方添加格式）。第二个担心更为重要。因为 JavaScript 被放置在 HTML\
  \ 脚本标签中，恶意用户可能会提交 JavaScript，这些代码在页面上重新显示时会被执行 ![Image](img/c.jpg)。这就是跨站脚本 (XSS)\
  \ 攻击的原理。\n\n![Image](img/05fig10.jpg)\n\n![Image](img/c.jpg) 在浏览器中显示用户提交的 HTML 可能会导致严重后果，例如执行\
  \ JavaScript。\n\n为了看到这些函数的影响，接下来的对 `handle_post.php` 的重写将使用每一个函数并显示各自的结果。\n\n###\
  \ 在 PHP 中处理 HTML：\n\n**1.** 在你的文本编辑器或 IDE 中打开 `handle_post.php` (脚本 5.3)，如果它尚未打开。\n\
  \n**2.** 在 print 行之前，添加以下内容（**脚本 5.4**）：\n\n点击此处查看代码图像\n\n```php\n$html_post = htmlentities\
  \ ($_POST['posting']);\n\n$strip_post = strip_tags ($_POST['posting']);\n```\n\n\
  **脚本 5.4** 此版本的 PHP 脚本通过两种不同的方式处理 HTML 标签。\n\n点击此处查看代码图像\n\n* *\n\n```php\n1   <!doctype\
  \ html>\n2   <html lang=\"en\">\n3   <head>\n4       <meta charset=\"utf-8\">\n\
  5       <title>Forum Posting</title>\n6   </head>\n7   <body>\n8   <?php // Script\
  \ 5.4 - handle_post.php #3\n9   /* This script receives five values from\n10   \
  \ posting.html:\n11    first_name, last_name, email, posting,\n12    submit */\n\
  13\n14  // Address error management, if you\n15    want.\n16\n17  // Get the values\
  \ from the $_POST array:\n18  $first_name = $_POST['first_name'];\n19  $last_name\
  \ = $_POST['last_name'];\n20  $posting = nl2br($_POST['posting']);\n21\n22  // Create\
  \ a full name variable:\n23  $name = $first_name . ' ' . $last_name;\n24\n25  //\
  \ Adjust for HTML tags:\n26  $html_post =\n    htmlentities($_POST['posting']);\n\
  27  $strip_post =\n    strip_tags($_POST['posting']);\n28\n29  // Print a message:\n\
  30  print \"<div>Thank you, $name, for\n    your posting:\n31  <p>Original: $posting</p>\n\
  32  <p>Entity: $html_post</p>\n33  <p>Stripped: $strip_post</p></div>\";\n34\n35\
  \  ?>\n36 </body>\n37 </html>\n```\n\n* *\n\n为了弄清这两个函数工作方式的区别，将它们都应用到 `posting`\
  \ 上。\n\n**3.** 将 print 语句改为：\n\n```php\nprint \"<div>Thank you, $name, for\n  your\
  \ posting:<p>Original: $posting</p>\n<p>Entity: $html_post</p>\n<p>Stripped: $strip_post</p></div>\"\
  ;\n```\n\n**4.** 保存文件，将其放在目录中，并测试三个版本。第一个是原始版本，下一个是 `htmlentities()` 版本，最后是 `strip_tags()`\
  \ 版本。\n\n### 字符串的编码与解码\n\n在第 3 章 结束，“手动向页面发送数据”部分演示了如何使用 GET 表单方法的思路向页面发送数据。在那个示例中，没有使用实际表单，而是将数据附加到\
  \ URL 中，使接收脚本可以使用它。我小心地说明了单个单词可以通过这种方式传递。但如果你想将多个单词作为一个变量值传递，或者使用特殊字符怎么办？\n\n为了通过\
  \ URL 安全地向 PHP 脚本传递任何值，请使用 `urlencode()` 函数。如其名称所示，该函数接收字符串并对其进行*编码*（更改其格式），以便可以作为\
  \ URL 的部分正确传递。除此之外，该函数会将空格替换为加号 (+)，并将特殊字符（例如单引号）转换为问题较少的版本。你可以这样使用该函数：\n\n```php\n\
  $string = urlencode($string);\n```\n\n为了演示 `urlencode()` 的一种应用，让我们更新 `handle_post.php`\
  \ 页面，使其也创建一个链接，将用户的姓名和电子邮件地址传递到第三个页面。\n\n\n\n\n\n## 1. 在文本编辑器或 IDE 中打开 `handle_post.php`\
  \ (`脚本 5.4`)，如果尚未打开。\n\n## 2. 删除在上一组步骤中添加的 `htmlentities()` 和 `strip_tags()` 行（**脚本\
  \ 5.5**）。\n\n### 脚本 5.5\n该脚本在将变量添加到链接之前对它们进行编码。这样，值就可以成功地传递到另一个页面。\n\n点击此处查看代码图片\n\
  \n***\n\n```php\n<!doctype html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"\
  utf-8\">\n    <title>Forum Posting</title>\n</head>\n<body>\n    <?php // Script\
  \ 5.5 - handle_post.php #4\n    /* 此脚本从\n    posting.html: 接收五个值：\n    first_name,\
  \ last_name, email, posting,\n    submit */\n\n    // 如果需要，处理地址错误。\n\n    // 从 $_POST\
  \ 数组中获取值：\n    $first_name = $_POST['first_name'];\n    $last_name = $_POST['last_name'];\n\
  \    $posting = nl2br($_POST['posting']);\n\n    // 创建全名变量：\n    $name = $first_name\
  \ . ' ' . $last_name;\n\n    // 打印消息：\n    print \"<div>Thank you, $name, for your\n\
  \    posting:\n    <p>$posting</p></div>\";\n\n    // 创建指向另一个页面的链接：\n    $name =\
  \ urlencode($name);\n    $email = urlencode($_POST['email']);\n    print \"<p>Click\
  \ <a href=\\\"thanks.php?\n    name=$name&email=$email\\\">here</a> to\n    continue.</p>\"\
  ;\n\n    ?>\n</body>\n</html>\n```\n\n***\n\n## 3. 回到旧版本的 print 调用：\n\n点击此处查看代码图片\n\
  \n```php\nprint \"<div>Thank you, $name, for your posting:\n<p>$posting</p></div>\"\
  ;\n```\n\n## 4. 在 print 语句之后，添加以下内容：\n\n点击此处查看代码图片\n\n```php\n$name = urlencode($name);\n\
  $email = urlencode($_POST ['email']);\n```\n\n此脚本将这两个变量传递到第二个页面。为了实现这一点，它们都必须经过编码。\n\
  \n由于脚本之前没有引用或使用 `$email` 变量，第二行代码在一步中同时从 `$_POST` 数组中获取电子邮件值并对其进行编码。这与以下两行分开的代码相同：\n\
  \n```php\n$email = $_POST['email'];\n$email = urlencode($email);\n```\n\n## 5. 添加另一个创建链接的\
  \ print 语句：\n\n点击此处查看代码图片\n\n```php\nprint \"<p>Click <a href=\\\"thanks.php?name=$name&email=\
  \ $email\\\">here</a> to continue.</p>\";\n```\n\n该 print 语句的主要目的是在网页中创建一个 HTML\
  \ 链接，其源代码类似于：\n\n点击此处查看代码图片\n\n```html\n<a href=\"thanks.php?name= Larry+Ullman&email=\
  \ larry%40example.com\">here</a>\n```\n\n要实现这一点，首先硬编码大部分 HTML，然后包含适当的变量名。由于 HTML\
  \ 代码要求链接的 URL 必须位于双引号——而 print 语句已经使用了双引号——因此你必须对它们进行转义（在前面加反斜杠），以便它们能够被打印。\n\n\
  ## 6. 保存文件，将其放在启用了 PHP 服务器的相应目录下，并在浏览器中再次测试。\n\n![Image](img/a.jpg) ![Image](img/b.jpg)。\n\
