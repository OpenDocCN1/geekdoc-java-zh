  \n\n\n\n\n# 11. 文件与目录\n\n本章\n- 文件权限\n- 写入文件\n- 锁定文件\n- 读取文件\n- 处理文件上传\n- 遍历目录\n\
  - 创建目录\n- 增量读取文件\n- 回顾与进阶\n\n将你的 Web 提升到新的高度需要一种存储和检索数据的方法。在 PHP 中，你有两种主要选择：使用文件系统或数据库。本章将讨论前者，下一章将介绍后者。学习这两种方法都是值得的。虽然数据库可能比基于文件的系统更强大、更安全，但你可能会对在服务器上读写简单文本文档所能实现的功能感到惊讶。\n\
  \n在本章中，你将学习文件权限，这是一个必须首先掌握的主题。然后，你将学习如何写入、读取和锁定文件。之后，你将看到如何用 PHP 处理文件上传、如何创建目录，以及一种从文件中读取数据的替代方法。最后两个示例还将演示一个简单的基于文件的注册和登录系统，你可以将其用于你的\
  \ Web 应用程序中。\n\n### 文件权限\n\n在尝试写入和从文件中读取之前，你必须了解`file permissions`。这个主题足够大，你可能想要进一步深入研究，但这个简短的介绍可以让你入门。首先我要说的是，本章中的大多数信息仅适用于非\
  \ Windows 用户。根据我的经验，在 Windows 计算机上运行 PHP 时，不需要采取某些准备步骤（尽管这些内容可能会随着操作系统版本的更新而变化）。尽管如此，整体了解权限是一个好主意，特别是如果你以后可能在非\
  \ Windows 服务器上运行 PHP 脚本时。\n\n权限标识了谁对文件或目录执行什么操作。选项有 `read`（读）、`write`（写）和 `execute`（执行，实际上，文件可以被标记为`可执行`，而目录被设为`可搜索`）。这些每个选项都可以为三类型的用户设置：\n\
  \n![Image](img/squf.jpg) 文件的`owner`（创建它或将其放在服务器上的人）\n\n![Image](img/squf.jpg) 特定`group`（组）的成员，该组由服务器管理员确定并包含所有者\n\
  \n![Image](img/squf.jpg) `Others`（不属于上述两类的人）\n\n还有一个隐含的 `everyone`（所有人）级别，它包含了所有三种用户类型。\n\
  \n例如，如果你使用 FTP 将文件传输到服务器，则传输文件的所有者将是连接到服务器时使用的账户。默认文件权限可能是所有人都可以读取该文件，但只有所有者可以修改它（例如，写入它）。\n\
  \n### Web 根目录\n\n在讨论文件、目录和安全性时，一个重要的概念是`web root directory`（Web 根目录）。为了理解这个概念，首先考虑\
  \ Web 服务器上的文件可以通过两种方式进行访问。首先，它存在于文件系统中。例如，在你自己的电脑上，这可能是 `C:\\inetpub\\wwwroot\\\
  filename.php`，或者在远程服务器上，可能是 `/var/web/sitename/htdocs/filename.php`（该路径适用于类 Unix\
  \ 系统）。\n\n其次，放置在 Web 服务器适当目录中的文件也可以通过 HTTP 访问，例如 `http://www.example.com/filename.php`\
  \ 或 `http://localhost/filename.php`。\n\n考虑到这一点，Web 根目录是文件系统中指向基础 URL（如 `www.example.com`）的文件夹。在没有额外限制的情况下，浏览器可以访问\
  \ Web 根目录内及其内部（即子文件夹中）中找到的所有文件。然而，浏览器无法访问位于 Web 根目录之外的文件。\n\n在创建可写的文件和目录时，将它们放在\
  \ Web 目录之外更安全。换句话说，如果你的 Web 页面位于 `C:\\inetpub\\wwwroot` 或 `/Users/username/Sites`，那么如果你将项目放置在\
  \ `C:\\inetpub` 或 `/Users/username` 中，它们应该允许本地运行的 PHP 访问，但互联网上的其他人无法访问。本章中的示例遵循这一结构，你也应该这样做。\n\
  \n通常情况下，这里的安全考虑对目录比对文件更重要。\n\n有一个问题是，在大多数情况下，PHP 将通过 Web 服务器应用程序运行，这被视为一个不同的服务器用户。因此，PHP\
  \ 和 Web 服务器能够读取你放置在服务器上的文件（并使它们能够在浏览器中查看），但 PHP 默认无法修改这些文件。\n\n对于本章中的示例，PHP 需要能够向某些文件和目录写入内容。这意味着你必须知道如何操作，并能够调整文件或目录拥有的权限。尽管如此，将文件或目录设为可写（即降低权限的限制性）可能会引发安全问题，应该只在绝对必要时才这样做。\n\
  \n最后，一个常见的困惑点与到底什么是 `user`（用户）有关。`user` 是服务器上的一个账户。在你自己的电脑上，可能只有一个 `user`——或者多个。服务器通常有多个用户，尽管用户账户并不是与登录的人相关，而是与运行在服务器上的不同程序相关。让一个文件或目录对任何用户可写并不意味着它对互联网可见。例如，在本章的第一个示例中，我们将处理一个位于服务器上的文本文件\
  \ `quotes.txt`。如果文件没有足够的权限执行你的 PHP 脚本的操作，你可能会看到错误信息 ![Image](img/a.jpg)。在继续之前，你应该在服务器上创建\
  \ `quotes.txt` 并建立其权限。\n\n![Image](img/11fig01.jpg)\n\n![Image](img/a.jpg) `...failed\
  \ to open stream: Permission denied...` 消息是尝试对不允许的文件的操作的结果。这里服务器拒绝了为了写入 `quotes.txt`\
  \ 的 `fopen()` 函数。\n\n要创建 `quotes.txt`：\n\n1. 打开你的文本编辑器或 IDE，创建一个空白文档。\n2. 在不在文件中输入任何内容的情况下，将其保存为\
  \ `quotes.txt`。\n3. 将文件移动到启用 PHP 的服务器的根目录之外 ![Image](img/b.jpg)。\n\n![Image](img/11fig02.jpg)\n\
  \n![Image](img/b.jpg) `quotes.txt` 文件应该放置在与 Web 文相同的目录下（即不在包含实际 Web 文的目录中）。\n\n\
  侧边栏“Web 根目录”解释了相对于你的 Web 目录应该如何放置文件。\n\n`file_exists()` 函数如果提供的文件或目录在服务器上存在，则返回\
  \ TRUE。这可以用于在对文件进行任何操作之前测试其是否存在：\n\n点击此处查看代码图片\n\n```\nif (file_exists('somefile.ext'))\
  \ { ... }\n```\n\n假设 PHP 对目录具有写入权限，你可以直接在 PHP 中在该目录内创建一个空白文档。这是通过 `touch()` 函数实现的：\n\
  \n```\ntouch('somefile.ext');\n```\n\n\n\n\n前面的序列看起来像是一系列奇特的步骤，但为了给文件设置权限，该文件必须先存在。不过，你确实希望该文件是空的，因为你稍后将使用\
  \ `PHP` 向其中写入数据。\n\n此示例的预期结果是赋予*其他人*（others）或*所有人*（everyone）quotes.txt` 的*读取*和*写入*（但不能*执行*）权限。实现这一目标取决于\n\
  \n![Image](img/squf.jpg) 你是在自己的电脑上运行 `PHP` 还是在远程服务器上运行\n\n![Image](img/squf.jpg)\
  \ 启用 `PHP` 的计算机的操作系统\n\n遗憾的是，无法提供每个用户在任何情况下应如何设置权限的步骤，但这里有一些粗略的指南和步骤可以帮助你开始。\n\n\
  ## 在远程服务器上设置文件权限：\n\n![Image](img/squf.jpg) 大多数 ISP 为用户提供一个基于网页的控制面板，他们可以在那里设置文件权限\
  \ ![Image](img/c.jpg) 以及设置其他托管参数。\n\n![Image](img/11fig03.jpg)\n\n![Image](img/c.jpg)\
  \ 这个由托管公司提供的控制面板允许用户调整文件的权限。\n\n![Image](img/squf.jpg) 你可能可以使用你的 FTP 客户端更改文件的权限\
  \ ![Image](img/d.jpg)。\n\n![Image](img/11fig04.jpg)\n\n![Image](img/d.jpg) Transmit\
  \ FTP 应用程序使用此弹出窗口允许你设置文件的权限。\n\n## 在你的电脑上设置文件权限：\n\n![Image](img/squf.jpg) 如果你是在自己的\
  \ Windows 电脑上工作，你可能不需要更改权限。为了测试这个理论，请先尝试每个示例。如果 `PHP` 脚本无法写入所涉及的文件或目录，请使用下一个建议来重新处理权限。\n\
  \n![Image](img/squf.jpg) 需要更改权限的 Windows 用户可以通过查看文件或目录的属性来实现。生成的面板会根据每个 Windows\
  \ 版本而不同，但基本上，你只需要调整谁可以访问文件以及如何访问。\n\n![Image](img/squf.jpg) Mac OS X 用户必须在访达 中选择文件，并从“文件”菜单中选择“显示简介”（Get\
  \ Info）。从那里，使用“所有权与权限”子面板来调整文件的权限 ![Image](img/e.jpg)。\n\n![Image](img/11fig05.jpg)\n\
  \n![Image](img/e.jpg) Mac OS X 的简介面板允许你调整文件的所有权和权限等。\n\n![Image](img/squf.jpg) 在\
  \ Unix（包括 Linux 和 Mac OS X 用户）上，你也可以在终端窗口命令行 `chmod 0666 quotes.txt`，假设你有权限这样做。\n\
  \n> 提示\n大多数操作系统没有 `PHP` 用户。相反，`PHP` 用户本质上是运行 Web 服务器应用程序（例如 Apache 或 IIS）的用户的用户。在\
  \ Unix 族中，Apache 通常以 `nobody` 身份运行。在 Windows 上，Web 服务器通常以登录用户（可能就是创建该文件的用户）相同的身份运行，这意味着不需要更改文件的权限。\n\
  \n> 提示\n如果你已经熟悉 SSH 和 `chmod`，你可能也理解 `0666` 数字的含义，但对于那些不熟悉它的人来说，这里有一个解释。`0` 只是一个前缀，表示该数字是以*八进制*格式编写的。每个\
  \ `6` 对应于*读取* (4) 加上*写入* (2) 权限——先分配 6 给所有者，然后给组，最后给其他人。相比之下，`0777` 允许所有三类型的用户拥有*读取*\
  \ (4)、*写入* (2) 和*执行* (1) 权限。这种编号适用于 Unix 变体操作系统（Linux、Solaris 和 Mac OS X）。\n\n>\
  \ 提示\n`PHP` 有几个用于更改文件或目录权限的函数，包括 `chgrp()`、`chmod()` 和 `chown()`。然而，只有当 `PHP` 已经拥有修改所涉及的文件或目录的权限时，它们才会生效。\n\
  \n> 提示\n运行在共享托管环境上的网站比运行在专用服务器上的网站具有更高的安全风险，因为物理上用户更多。例如，如果你让文件或目录对每个用户都可写，那么任何访问该服务器的人都可以操作该文件（假设他们知道它的存在且没有其他限制）。\n\
  \n## 文件路径\n\n引用电脑上的任何文件或目录有两种两种方法：使用*绝对*路径或*相对*路径。绝对路径从计算机的根目录开始：\n\n![Image](img/squf.jpg)\
  \ `C:\\somedir\\somefile.txt` (Windows)\n\n![Image](img/squf.jpg) `/Users/username/somefile.txt`\
  \ (Mac OS X)\n\n相对路径不会从计算机的根目录——`C:\\` 或 `/` 开始。相反，它相对于当前工作目录：\n\n![Image](img/squf.jpg)\
  \ `fileA.txt`（在同一目录下）\n\n![Image](img/squf.jpg) `./fileA.txt`（在同一目录下）\n\n![Image](img/squf.jpg)\
  \ `dirB/fileB.txt`（在 dirB 内部）\n\n![Image](img/squf.jpg) `../fileC.txt`（在父目录中）\n\n\
  ![Image](img/squf.jpg) `dirD/fileD.txt`（在 dirD 内部）\n\n![Image](img/squf.jpg) `../fileE.txt`（在父目录）\n\
  \n两个点代表父目录。单个点代表当前目录。\n\n## 写入文件\n\n由于你需要向文件写入内容才能从中读取，因此本章将探讨写入操作。向文件写入内容最简单的方法是使用\
  \ `file_put_contents()` 函数：\n\n```php\nfile_put_contents($file, $data);\n```\n\n\
  此函数将打开文件并写入数据。第一个参数是文件名。第二个参数是数据，可以是字符串、数字或数组。文件或数据不需要由变量表示，但通常这样做。\n\n如果文件不存在，函数将尝试创建它。如果文件已存在，内容将被新数据替换。如果你希望将新数据追加到现有内容之后，请将常量\
  \ `FILE_APPEND` 作为第三参数：\n\n```php\nfile_put_contents($file, $data, FILE_APPEND);\n\
  ```\n\n在追加数据时，你通常希望每条数据都单独成行，因此每次提交都应该以运行 `PHP` 的操作系统的相应换行符结束。这将\n\n![Image](img/squf.jpg)\
  \ Unix 和 Mac OS X 上的 `\\n`\n\n![Image](img/squf.jpg) Windows 上的 `\\r\\n`\n\n与任何有意义的转义序列一样，这些必须放在双引号内才能生效。\n\
  \n或者，你可以使用特殊的 PHP 常量 `PHP_EOL`，它代表当前操作系统的（例如 `\\n` 或 `\\r\\n`）正确的行结束序列：\n\n```php\n\
  file_put_contents($file, $data . PHP_EOL, FILE_APPEND);\n```\n\n\n\n\n![Image](img/a.jpg)\
  \ 这种简单的表单允许用户提交一个引言，该引言将被写入文本文件中。\n\n```php\nif (is_writable($file)) {...\n```\n\
  \n在尝试写入文件（或目录）之前调用此函数是避免权限错误的一种简单方法。\n\n## 遗留文件写入\n\n虽然你会在书中书中看到这些示例，但你也应该熟悉写入文件的遗留方法。首先，打开文件；其次，向文件写入你的数据；第三，关闭文件：\n\
  \n```php\n$fp = fopen($file, mode);\nfwrite($fp, $data . PHP_EOL);\nfclose($fp);\n\
  ```\n\n使用这种遗留方法写入文件时，你必须在打开文件时创建一个指针。`fopen()` 函数返回的文件指针将由 PHP 用于引用已打开的文件。\n\n打开文件时最重要的考虑因素是你使用的模式（mode）。根据你打算对文件进行的操作，模式决定了如何打开它。最宽容的模式是\
  \ `a+`，它允许你对文件进行读取或写入。如果文件不存在，它会创建文件，并自动将新数据追加到文件末尾（因此为 `a`）。相反，`r` 只允许你从文件中读取内容。表\
  \ 11.1 列出了所有可能的模式。每个模式还可以附加一个 `b` 标志，强制文件以二进制模式打开。对于可能在多个操作系统上进行读取的文件，这是一个更安全的选项。\n\
  \n![Image](img/11tab01.jpg)\n\n**表 11.1 fopen() 模式**\n\n尝试在文件不存在时创建文件的模式只有在 PHP\
  \ 脚本有权限在目标目录中创建文件时才能生效。\n\n`fwrite()` 函数根据所选模式将新数据（作为函数调用中的第二个参数发送）写入文件。\n\n作为写入过程的最后一步，通过再次引用文件指针并调用\
  \ `fclose()` 函数来关闭文件：\n\n```php\nfclose($fp);\n```\n\n## 要写入外部文件：\n\n**1. 在你的文本编辑器或\
