  \n***\n\n## 声明参数类型\n\nPHP 7 支持声明参数类型，以指示必须传递什么类型的值。要使用此功能，请在参数名称之前提供类型——`bool`、`float`、`int`\
  \ 或 `string`：\n\n点击此处查看代码图像\n\n```php\nfunction make_full_name(string $first, string\
  \ $last) {\n```\n\n编写了这些代码后，如果在提供非字符串参数的情况下调用函数，PHP 将返回错误：\n\n点击此处查看代码图像\n\n```php\n\
  make_full_name(12, true); // 错误！\n```\n\n早期的 PHP 版本支持*类型提示*（type hinting），这与此相似，但不支持\
  \ `string` 和 `int` 等标量变量类型。当你想要保证传递给函数的值类型时，这种更严格的函数定义是最好的。\n\n***\n\n### 11. 完成\
