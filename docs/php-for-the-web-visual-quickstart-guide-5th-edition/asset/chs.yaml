  \ for Dynamic Sites Fourth Edition* (Peach Press, 2012)。\n\n## 字符串拼接\n\n*拼接 (Concatenation)*\
  \ 是一个晦涩的术语，但非常有用的概念。它指的是将一个项目附加到另一个上。具体来说，在编程中，你拼接 *字符串*。点（`.`）是执行此操作的运算符，如下：\n\n\
  ```php\n$s1 = 'Hello, ';\n$s2 = 'world!';\n$greeting = $s1 . $s2;\n```\n\n拼接的结果是\
  \ `$greeting` 值为 `Hello, world!`。由于 PHP 处理变量的方式，可以使用双引号实现相同的效果：\n\n```php\n$greeting\
  \ = \"$s1$s2\";\n```\n\n但是，使用点来拼接更为常见且推荐。另一种拼接方式涉及*拼接赋值运算符*：\n\n```php\n$greeting\
  \ = 'Hello, ';\n$greeting .= 'world!';\n```\n\n这第二行大致意味着“将 `$greeting` 赋值为其当前值加上\
  \ `world!` 的拼接”。\n\n`posting.html` 脚本将多个字符串变量发送到 `handle_post.php` 页。在这些变量中，名和姓逻辑上可以进行拼接。我们将这种思路编写\
  \ PHP 脚本。\n\n要使用拼接：\n\n**1.** 在你的文本编辑器或 IDE 中开始一个新的文档，命名为 `handle_post.php`（**脚本\
  \ 5.2**）：\n\n点击此处查看代码图片\n\n```html\n<!doctype html>\n<html lang=\"en\">\n<head>\n\
  \  <meta charset=\"utf-8\">\n  <title>Forum Posting</title>\n</head>\n<body>\n```\n\
  \n**脚本 5.2** 此 PHP 脚本演示了拼接，字符串变量最常见的操作之一。你可以将其想象为字符串的加法。\n\n点击此处查看代码图片\n\n```php\n\
  1   <!doctype html\n2   <html lang=\"en\">\n3   <head>\n4      <meta charset=\"\
  utf-8\">\n5      <title>Forum Posting</title>\n6   </head>\n7   <body>\n8   <?php\
  \ // 脚本 5.2 - handle_post.php\n9   /* 此脚本从 posting.html 接收五个值：\n10  first_name,\
  \ last_name, email, posting,\n     submit */\n11\n12  // 如果需要，处理错误管理。\n13  want。\n\
  14\n15  // 从 $_POST 数组获取值：\n16  $first_name = $_POST['first_name'];\n```\n\n\n\n\
  \n\n```php\n$last_name = $_POST['last_name'];\n$posting = $_POST['posting'];\n\n\
  // Create a full name variable:\n$name = $first_name . ' ' . $last_name;\n\n// Print\
  \ a message:\nprint \"<div>Thank you, $name, for your posting: <p>$posting</p></div>\"\
  ;\n\n?>\n</</body>>\n</html>\n```\n\n### 2. 创建初始 PHP 标签，并在必要时处理错误管理：\n\n点击此处查看代码图片\n\
