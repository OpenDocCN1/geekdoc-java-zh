  \ [尚不存在]。\n\n## 7. 查看 `thanks.php` 的源代码：\n\n![Image](img/d.jpg)\n\n![Image](img/05fig14.jpg)\n\
  \n![Image](img/c.jpg) 处理脚本现在显示指向另一个页面的链接。\n\n注意，点击该链接将导致服务器错误，因为 `thanks.php` 脚本\
  \ [尚不存在]。\n\n## 8. 字符串的加密与解密\n\n通常，为了保护数据，程序员会对其进行加密——将其状态转换为难以察觉的内容。密码就是你可能想要加密的数据示例。\n\
  \n你可以使用 `password_hash()` 函数来加密数据，但请注意没有解密选项（这被称为单向加密）。因此，密码可以使用此函数加密，但永远无法获取解密后的值。在\
  \ Web 应用程序中使用此函数，你可以在注册时加密用户密码；当用户登录时，输入的密码也会被加密，然后对加密后的版本进行比较。使用 `password_hash()`\
  \ 的语法如下：\n\n点击此处查看代码图片\n\n```php\n$data = password_hash($data, PASSWORD_DEFAULT);\n\
  ```\n\n第二个参数表示使用默认加密算法（决定加密执行的速度和安全性）。\n\n如果数据存储在数据库中，你还可以使用数据库应用程序（例如 MySQL、PostgreSQL、Oracle\
  \ 或 SQL Server）内置函数来执行加密和解密。取决于你使用的技术，它通常提供单向和双向加密工具。\n\n## 比较字符串\n\n要比较两个字符串，你始终可以使用等运算符，我们将在下一章学习。否则，你可以使用\
  \ `strcmp()` 函数。它通过返回一个整数来指示两个字符串的比较情况：相同返回 0，如果一个“大于”另一个则返回正数或负数。\n\n查看子字符串是否包含在另一个字符串中（即在干字符串中寻找针），你将使用这些函数：\n\
  \n*   `strstr()` 返回从第一次出现针开始到结束的干字符串。\n*   `strpos()` 在干字符串中搜索并返回特定针的数字位置。\n\n这两个函数也都有对应的不区分大小写的替代方案，分别为\
  \ `stristr()` 和 `stripos()`。这些函数每个通常用于条件判断，以测试是否找到了子字符串。\n\n\n\n\n\n# 查找子字符串\n\n\
  PHP 提供了几个函数可以用来拆分字符串、对其进行搜索以及执行比较。虽然这些函数通常与条件语句配合使用（在第 6 章“控制结构”中讨论过），但它们非常重要，在这里在这里介绍；后续章节将更正式地使用它们。\n\
  \n在本章的开头，你学习了如何使用连接符连接字符串。除了将小片段组合成更大的字符串外，PHP 还能轻松地让你从字符串中提取子部分。使用任何方法提取字符串子部分的技巧在于，你必须对字符串本身了解一些信息，以便知道如何拆分它。\n\
  \n`strtok()` 函数通过使用预定义的分隔符（如逗号或空格）从较大的字符串中创建一个被称为 `token`（标记）的子字符串。例如，如果你让用户在一个字段中输入他们的全名（假设他们的姓和名之间用空格分隔），你可以使用以下代码提取他们的名：\n\
  \n点击此处查看代码图像\n\n```php\n$first = strtok($_POST['name'], ' ');\n```\n\n该行告诉 PHP 从\
  \ `$_POST['name']` 的开始提取所有内容，直到遇到空格。\n\n如果你让用户以 `姓, 名` 的格式输入全名，你可以通过编写以下代码找到他们的姓：\n\
  \n点击此处查看代码图像\n\n```php\n$last = strtok($_POST['name'], ', ');\n```\n\n提取字符串部分的另一种方法是引用字符串内字符的`索引位置`。字符串的索引位置是字符的数字位置，从开头开始计数。然而，PHP\
  \ 与大多数编程语言一样，所有索引都从 0 开始。例如，为了索引字符串 `Larry`，你从位置 0 的 `L` 开始，接着是位置 1 的 `a`、2 的 `r`、3\
  \ 的第二个 `r` 以及 4 的 `y`。尽管 `Larry` 的字符串长度为 5，但它的索引范围是从 0 到 4。简而言之，索引始终从 0 到长度减 1。\n\
  \n考虑到这一点，你可以调用 `substr()` 函数根据子字符串字符的索引位置来创建一个子字符串：\n\n点击此处查看代码图像\n\n```php\n$sub\
  \ = substr($string, 0, 10);\n```\n\n第一个参数是派生子字符串的主字符串。第二个参数指定子字符串开始的位置，即其索引位置（0\
  \ 表示从第一个字符开始）。第三个参数指定从该开始点子字符串应该包含多少字符（10）。如果主字符串没有足够的字符，生成的子字符串将延伸到主字符串的结尾。此参数是可选的；如果省略，子字符串也将延伸到主字符串的结尾。\n\
  \n你还可以使用负数从字符串末尾倒数计数：\n\n点击此处查看代码图像\n\n```php\n$string = 'aardvark';\n$sub = substr($string,\
  \ -3, 3); // ark\n```\n\n第二行表示从末尾倒数第三个字符开始返回三个字符。对于那个特定的示例，你可以再次省略第三个参数并获得相同的结果：\n\
  \n点击此处查看代码图像\n\n```php\n$sub = substr($string, -3); // ark\n```\n\n要查看字符串中有多少个字符，使用\
  \ `strlen()`：\n\n点击此处查看代码图像\n\n```php\nprint strlen('Hello, world!'); // 13\n```\n\
  \n计数将包含空格和标点符号。要查看字符串中有多少个`words`（单词），使用 `str_word_count()`。该函数与 `substr()` 将将在下一次修订的\
  \ `handle_post.php` 脚本中使用。\n\n创建子字符串：\n\n1. 在你的文本编辑器或 IDE 中打开 `handle_post.php`（脚本\
  \ 5.5），如果尚未打开。\n2. 在 `print` 语句之前添加以下内容（**脚本 5.6**）：\n\n点击此处查看代码图像\n\n```php\n$words\
  \ = str_word_count ($posting);\n```\n\n**脚本 5.6** 此版本的 `handle_post.php` 统计帖子中的单词数，并将显示的帖子裁剪为仅前\
  \ 50 个字符。\n\n点击此处查看代码图像\n\n```html\n1  <!doctype html>\n2  <html lang=\"en\">\n\
  3    <head>\n4      <meta charset=\"utf-8\">\n5      <title>Forum Posting</title>\n\
  6    </head>\n7    <body>\n8    <?php // Script 5.6 - handle_post.php #5\n9    /*\
  \ 此脚本从\n10    posting.html: 接收五个值：\n11    first_name, last_name, email, posting,\n\
  12    submit */\n13\n14    // 如果需要，可以处理错误管理。\n15    .\n16\n17    // 从 $_POST 数组中获取值：\n\
  18    $first_name = $_POST['first_name'];\n19    $last_name = $_POST['last_name'];\n\
  20    $posting = nl2br($_POST['posting']);\n21\n22    // 创建一个全名变量：\n23    $name\
  \ = $first_name . ' ' . $last_name;\n24\n25    // 获取单词计数：\n26    $words = str_word_count($posting);\n\
  27\n28    // 获取帖子的片段：\n29    $sub = substr($posting, 0, 50);\n30\n31    // 打印一条消息：\n\
  32    print \"<div>Thank you, $name, for your posting:\n33    <p>$sub...</p>\n34\
  \    <p>($words words)</p></div>\";\n35\n36    ?>\n37  </body>\n38</html>\n```\n\
  \n\n\n\n由于全球范围内姓名的差异性，没有一种完美的方法可以使用 PHP（或任何编程语言）自动格式化姓名。事实上，除非你有充分的理由，否则我不认为更改用户提供的数据的大小写。\n\
  \n***\n\n### 替换字符串的局部\n\n正如上一节讨论的，你不仅是在字符串中查找子字符串，你可能发现自己需要用新值`替换子字符串`。你可以使用 `str_ireplace()`\
  \ 函数来实现这一点：\n\n点击此处查看代码图片\n\n```php\n$string = str_ireplace($needle, $replacement,\
  \ $haystack);\n```\n\n该函数将 `$haystack` 中找到每个 `$needle` 出现处替换为 `$replacement`。例如：\n\
  \n点击此处查看代码图片\n\n```php\n$me = 'Larry E. Ullman';\n\n$me = str_ireplace('E.', 'Edward',\
  \ $me);\n```\n\n变量 `$me` 现在现在的值为 `Larry Edward Ullman`。\n\n该函数执行`不区分大小写`的搜索。为了进行严格限制，你可以使用\
  \ `str_replace()` 执行`区分大小写`的搜索。在接下来的脚本中，`str_ireplace()` 将用于消除提交文本中的“脏词”。\n\n我还有一个想要讨论的最后一个字符串相关函数：`trim()`。该函数会移除字符串开头和结尾的任何空白——空格、换行符和制表符。字符串变量中添加额外的空格是非常常见的，这可能是因为用户输入信息时不小心，也可能是由于\
  \ HTML 代码粗糙。为了清晰性、数据完整性和网页设计的考虑，在使用这些字符串之前删除这些空格是值得的。发送到浏览器的额外空格可能会让页面看起来很，而发送到数据库或\
  \ cookie 的空格在以后可能会产生不利后果（例如，如果密码有一个多余的空格，那么在不带空格输入时可能无法匹配）。\n\n`trim()` 函数会自动删除字符串开头和结尾的任何额外空格（但不包括中间）。使用\
  \ `trim()` 的格式如下：\n\n点击此处查看代码图片\n\n```php\n$string = ' extra space before and after\
  \ text ';\n\n$string = trim($string);\n\n// $string 现在等于 'extra space before and\
  \ after text'\n```\n\n要使用 `str_ireplace()` 和 `trim()`：\n\n**1.** 在你的文本编辑器或 IDE 中打开\
  \ `handle_post.php` (脚本 5.6)，如果它尚未打开。\n\n**2.** 对表单数据应用 `trim()` (**脚本 5.7**)：\n\
  \n点击此处查看代码图片\n\n```php\n$first_name = trim($_POST ['first_name']);\n\n$last_name\
  \ = trim($_POST ['last_name']);\n\n$posting = trim($_POST ['posting']);\n```\n\n\
  **脚本 5.7** 这个处理脚本的最终版本应用 `trim()` 函数，然后将 badword 替换为多个 X。\n\n点击此处查看代码图片\n\n***\n\
  \n```html\n1   <!doctype html>\n2   <html lang=\"en\">\n3   <head>\n4       <meta\
  \ charset=\"utf-8\">\n5       <title>Forum Posting</title>\n6   </head>\n7   <body>\n\
  8   <?php // Script 5.7 - handle_post.php #6\n9   /* 此脚本从\n10   posting.html: 接收五个值：\n\
  11   first_name, last_name, email, posting,\n12   submit */\n13\n14   // 如果你需要，处理错误管理。\n\
  15.\n16\n17   // 从 $_POST 数组获取值。\n18   // 使用 trim() 移除额外空格：\n19   $first_name =\n\
  20     trim($_POST['first_name']);\n21   $last_name =\n22     trim($_POST['last_name']);\n\
  23   $posting = trim($_POST['posting']);\n24\n25   // 创建全名变量：\n26   $name = $first_name\
  \ . ' ' . $last_name;\n27\n28   // 获取字数：\n29   $words = str_word_count($posting);\n\
  30\n31   // 剔除脏词：\n32   $posting = str_ireplace('badword',\n33     'XXXXX', $posting);\n\
  34\n35   // 打印消息：\n36   print \"<div>Thank you, $name, for your\n37     posting:\n\
  38   <p>$posting</p>\n39   <p>($words words)</p></div>\";\n40\n41   ?>\n42 </body>\n\
  43 </html>\n```\n\n为了以防输入的数据在开头或结尾有额外的空白，应用了 `trim()` 函数。\n\n**3.** 移除对 `substr()`\
  \ 的使用：\n\n点击此处查看代码图片\n\n```php\n$posting = substr($posting, 0, 50);\n```\n\n你想看到此示例的完整帖子，因此请移除对\
  \ `substr()` 的调用。\n\n**4.** 在打印语句之前，添加\n\n点击此处查看代码图片\n\n```php\n$posting = str_ireplace\
  \ ('badword', 'XXXXX', $posting);\n```\n\n此特定示例通过划掉的方式标记了帖子中脏词的使用。与其使用真正的脏话，代码使用了\
  \ `badword`。\n\n***\n\n### 复习与探索\n\n如果你对复习问题或探索提示有任何疑问，请访问书籍的官方论坛 ([www.Ullman.com/forums/](http://www.Ullman.com/forums/))。\n\
