  ;\n```\n\n如果 `$okay` 变量仍具有值 TRUE，则说明提交的数据通过了验证程序。这意味着用户的年龄已经计算出来（在用户在今年某个时候会多大的意义上），并且可以打印出来。\n\
  \n6. 保存你的脚本，将其放在与 `register.html` 相同的目录中（在你启用了 PHP 的服务器上），并在浏览器中再次测试它。如果用户为他们的出生年份提供了数值，现在用户的年龄将会被计算并打印出来（假设也提供了电子邮件地址和密码）。\n\
  \n提示\n另一个很好的验证函数是 `checkdate()`，你可以用它来确认日期是否存在（或在过去存在过）。你可以这样使用它：\n\n点击此处查看代码图片\n\
  \n```php\nif (checkdate($month, $day, $year))\n```\n\n### 更多运算符\n\n这些运算符包括加法 `+`、减法\
  \ `-`、乘法 `*` 和除法 `/`，以及用于递增 `++` 和递减 `--` 的简写。\n\n在创建条件判断时，你经常需要查看变量是否等于某个特定值，使用相等运算符\
  \ `==`，而不是赋值运算符 `=`。\n\n下一个比较运算符是不等于由感叹号配合等号 `!=` 表示。剩余的比较运算符与它们的数学运算符相同：小于 `<`、大于\
  \ `>`、小于等于 `<=` 和大于等于 `>=`。\n\n此外还有字符串连接运算符 `.`，可以将一个字符串连接到另一个。\n\n表格 6.1 列出了你已经学过的这些运算符。\n\
  \n### 比较\n\n在编写条件判断时，你可能需要检查用户的出生年份是否在 2016 年之前，以及确认密码是否匹配原始密码。\n\n赋值\n\n运算符 `=`\
  \ 用于设置变量的值。\n\n\n\n\n\n```php\n// 地址错误管理，如果需要的话。\n\n// 用于跟踪成功的标记变量：\n$okay = true;\n\
  \n// 验证邮箱地址：\nif (empty($_POST['email'])) {\n    print '<p class=\"error\">请输入您的邮箱地址。</p>';\n\
  \    $okay = false;\n}\n\n// 验证密码：\nif (empty($_POST['password'])) {\n    print\
  \ '<p class=\"error\">请输入您的密码。</p>';\n    $okay = false;\n}\n\n// 检查两个密码是否相等：\n\
  if ($_POST['password'] != $_POST['confirm']) {\n    print '<p class=\"error\">确认确认密码与原始密码不符。</p>';\n\
  \    $okay = false;\n}\n\n// 验证出生年份：\nif (is_numeric($_POST['year'])) {\n    $age\
  \ = 2016 - $_POST['year']; // 计算今年的年龄。\n} else {\n    print '<p class=\"error\"\
  >请输入四位数的出生年份。</p>';\n    $okay = false;\n}\n\n// 检查是否出生在今年之前：\nif ($_POST['year']\
  \ >= 2016) {\n    print '<p class=\"error\">您输入的出生年份错误，或者您来自未来！</p>';\n    $okay\
  \ = false;\n}\n\n// 如果没有错误，打印成功消息：\nif ($okay) {\n    print '<p>您已注册成功（但并非如此）。</p>';\n\
  \    print \"<p>您今年将满 $age 岁。</p>\";\n}\n?>\n</body>\n</html>\n```\n\n要比较这两个字符串值，请使用不等运算符。或者，你也可以使用其中一个字符串比较函数（请参阅\
  \ 第 5 章 中的“[使用字符串]”），但 `!=` 就完全足够了。\n\n**3. 在年份验证之后，如果年份大于或等于 2016，则报告错误：\n\n点击此处查看代码图片\n\
  \n```php\nif ($_POST['year'] >= 2016) {\n  print '<p class=\"error\">您输入的出生年份错误，或者您来自未来！</p>';\n\
  \  $okay = false;\n}\n```\n\n如果用户输入的出生年份为 2016 或更晚，这可能是一个错误。（如果你在 2016 年之后阅读此书，请相应更改年份）。\n\
  \n**4. 保存你的脚本，将其放在与 register.html 相同的目录中（在启用了 PHP 的服务器上），并在浏览器中再次测试 ![Image](img/a.jpg)\
