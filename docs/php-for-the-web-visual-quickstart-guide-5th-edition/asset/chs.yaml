  \n### 发送邮件\n使用 PHP 发送邮件在*理论上*是简单的，只需要 PHP 的 `mail()` 函数。该函数使用服务器的电子邮件应用程序（如 Unix\
  \ 或 Mac OS X  `sendmail`）或 SMTP（简单邮件传输协议）服务器来发送消息。该函数的的基本用法如下：\n\n```php\nmail(to,\
  \ subject, body);\n```\n\n第一个参数是要发送邮件的电子邮件地址（或用逗号分隔的 `addresses`）。第二个参数建立消息的主题行，第三个参数创建消息的内容。\n\
  \n该函数还可以接收另一个参数，通过它你可以向邮件添加更多详细信息（`additional headers`），包括发件人件地址、邮件优先级和抄送（CC）地址：\n\
  \n点击此处查看代码图片\n\n```php\nmail('someone@example.com', 'Test Email', 'This is a test\
  \ email', 'From: 'email@example.com');\n```\n\n尽管在理论上这样做很容易，但在实际代码中使用此函数可能会复杂得多。首先，设置你自己的电脑来发送邮件可能是一项挑战（请参阅侧边栏“配置你的服务器以发送邮件`”）。\n\
  \n其次，你应该采取措施防止恶意人员利用你的表单发送垃圾邮件。在接下一个示例中，邮件将发送到提供的电子邮件地址。如果一个狡猾的用户提供了多个地址 ![Image](img/a.jpg)，邮件将发送到每一个地址。你可以通过许多方式来防止这种情况。对于本书的难度来说，一个简单的选项是确认提供的地址中只存在一个\
  \ `@` 符号（即它只有一个邮件地址）。你可以使用命名恰当的 `substr_count()` 函数来计算子字符串在字符串中出现的次数：\n\n点击此处查看代码图片\n\
  \n```php\nif (substr_count($_POST ['email'],'@') == 1) {...\n```\n\n![Image](img/08fig25.jpg)\n\
  \n![Image](img/a.jpg) 用户可以很容易地尝试通过此类表单向多个收件者发送邮件。\n\n考虑到这些注意事项，让我们在注册页面中添加 `mail()`\
  \ 函数调用，以便你了解该函数可能是如何被使用的。\n\n#### 使用 PHP 发送邮件：\n\n**1.** 在你的文本编辑器或 IDE 中打开 `register.php`\
  \ (脚本 8.9)。\n\n**2.** 修改邮件验证部分，使其也检查单个“at”符号（**脚本 8.10**）：\n\n点击此处查看代码图片\n\n```php\n\
  if (empty($_POST['email']) || (substr_count($_POST['email'], '@') != 1) ) {\n```\n\
