  \ `includes` 目录中。\n\n***\n\n### 提示\n\n检查具有特定值的特定 cookie 的存在是一个相当低的安全水平，尽管对于这样的网站并不完全不恰。为了更好的安全，创建一个反映管理员状态的会元素：\n\
