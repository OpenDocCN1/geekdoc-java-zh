  \ ![Image](img/b.jpg)。\n\n\n\n\n\n### 字符串的编码与解码\n\n# 查找子字符串\n\n# 替换字符串部分\n\n# 复习与后续\n\
  \n正如第 2 章介绍过的“变量”，PHP 使用的第二类变量是字符串——这是一组被单引号或双引号括起来的字符。字符串变量的值可以是一个字母、一个单词、一个句子、一个段落、HTML\
  \ 代码，甚至是一堆杂乱无意义字母、数字和符号（这可能代表密码）。字符串可能是 PHP 中最常用的变量类型。\n\n本章涵盖了 PHP 用于处理字符串数据的最基本的内置函数和运算符，无论字符串是源于表单还是最初在脚本中声明的。我们将介绍一些常用技术：合并字符串、修剪字符串和编码字符串。字符串的其他用途将在后续章节中说明。\n\
  \n### 创建 HTML 表单\n\n正如第 3 章所示的“HTML 表单与 PHP”，让我们从创建一个 HTML 表单开始，将不同的值（以字符串变量的形式）发送给\
