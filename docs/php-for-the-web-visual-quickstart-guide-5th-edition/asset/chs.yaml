  ```\n\n与 `file()` 函数不同，`fgetcsv()` 函数需要一个文件指针。因此，必须使用 `fopen()` 函数配合适当模式打开 `users.txt`\
  \ 文件。这里的模式是 `rb`，意味着以二进制安全的模式打开文件进行读取。\n\n首先，为了安全起见，启用了 PHP 的 `auto_detect_line_endings`\
  \ 设置。从风格上来说，某些开发者倾向于将设置作为脚本的第一行代码，如果你愿意，可以随地将其向上移动。\n\n## 6. 遍历文件的每一行：\n\n点击此处查看代码图片\n\
  \n```php\nwhile ( $line = fgetcsv($fp, 200, \"\\t\") ) {\n```\n\n此 `while` 循环每次迭代读取文件的另外\
  \ 200 字节或一行（以先到者为准）。所读取的数据被拆分为数组，并使用制表符来指示不同的元素。\n\n由于 `users.txt` 文件以 `用户名制表 密码制表\
  \ 目录换行符`的格式存储数据，`$line` 数组包含三个元素，索引分别为 0 (`username`)、1 (`password`) 和 2 (`directory`)。\n\
  \n## 7. 将提交的值与检索到的值进行比对：\n\n点击此处查看代码图片\n\n```php\nif ( ($line[0] == $_POST ['username'])\
  \ AND ($line[1] == sha1(trim($_POST ['password']))) {\n```\n\n这个双部分条件检查提交的用户名是否匹配存储的用户名\
  \ (`$line[0]`)并检查提交的密码是否匹配存储的密码 (`$line[1]`)。然而，由于存储的密码使用了 `sha1()` 进行加密，因此对提交的值应用\
  \ `sha1()` 后进行比较。\n\n## 8. 如果找到匹配项，将 $loggedin 设置为 TRUE 并退出 while 循环：\n\n```php\n\
  $loggedin = TRUE;\nbreak;\n```\n\n如果条件为 `TRUE`，则提交的用户名和密码与文件中的内容匹配。在这种情况下，标记 `$loggedin`\
  \ 被设置为 `TRUE`，并使用 `break` 语句退出 `while` 循环。该系统的优点是只需要读取文件的大部分即可找到匹配项。\n\n## 9. 关闭条件判断、while\
  \ 循环和文件：\n\n```php\n}\nfclose($fp);\n```\n\n## 10. 向用户打印消息：\n\n点击此处查看代码图片\n\n```php\n\
  if ($loggedin) {\n    print '<p>You are now logged in.</p>';\n} else {\n    print\
  \ '<p style=\"color: red;\">The username and password you entered do not match those\
  \ on file.</p>';\n}\n```\n\n使用 `$loggedin` 标记，脚本现在可以判断用户是否已“登录”。你可以通过将用户目录存储在会话中然后将其发送到文件上传页面来为此过程添加一些功能。\n\
  \n## 11. 继续主条件判断并退出 PHP：\n\n```php\n} else {\n?>\n```\n\n## 12. 创建 HTML 表单：\n\n\
  点击此处查看代码图片\n\n```html\n<form action=\"login.php\" method=\"post\">\n    <p>Username:\
  \ <input type=\"text\" name=\"username\" size=\"20\"></p>\n    <p>Password: <input\
  \ type=\"password\" name=\"password\" size=\"20\"></p>\n    <input type=\"submit\"\
  \ name=\"submit\" value=\"Login\">\n</form>\n```\n\n## 13. 返回 PHP 完成主条件判断：\n\n点击此处查看代码图片\n\
  \n```php\n<?php } // 结束提交 IF。 ?>\n```\n\n## 14. 完成 HTML 页面：\n\n```html\n</body>\n\
  </html>\n```\n\n## 15. 将文件保存为 login.php，将其放在启用 PHP 的目录中并在浏览器中进行测试。登录表单接受用户名和密码。如果提交的用户名和密码与记录匹配，用户将看到此消息。如果提交的用户名/密码组合与文件内容不匹配，则显示此提示。\n\
  \n> **提示**: 从 PHP 5.3 开始，`fgetcsv()` 函数接受另一个可选参数：用于转义字符的字符。默认转义字符是反斜杠。\n\n> **提示**:\
  \ 如果行为空，`fgetcsv()` 返回一个包含单个空值的数组。\n\n### 复习与探索\n\n如果你对复习问题或探索提示有任何疑问，请访问书籍的支持论坛（[www.Ullman.com/forums/](http://www.Ullman.com/forums/)\
