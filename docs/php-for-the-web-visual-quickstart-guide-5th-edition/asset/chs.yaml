  \n***\n\n**提示**\n\n`id` 是主键，意味着它的值永远不应该改变。通过在表中使用主键，你可以更改记录中的其他所有值，但仍可以使用该列引用该行。\n\
  \n***\n\n**提示**\n\n`mysqli_real_escape_string()` 函数不需要应用于查询中使用的 `ID` 值，因为 `is_numeric()`\
  \ 测试确认了它们不包含单引号或其他问题字符。\n\n***\n\n**提示**\n\n更详尽的编辑和删除页面会在条件判断中使用 `mysqli_num_rows()`\
  \ 函数，以确认 `SELECT` 查询在获取数据之前是否返回了行：\n\n点击此处查看代码图片\n\n```php\nif (mysqli_num_rows($r)\
  \ == 1) {...\n```\n\n***\n\n**提示**\n\n如果你对表执行了 `update` 操作但没有更改记录的值，`mysqli_affected_rows()`\
  \ 将返回 0。\n\n***\n\n**提示**\n\n在 `UPDATE` 查询中添加 `LIMIT 1` 分句并无害，这可以确保最多有一行受影响。\n\n\
  ***\n\n**提示**\n\n初学者常见的错误是使用以下错误的语法：\n\n点击此处查看代码图片\n\n```sql\nUPDATE tablename SET\
