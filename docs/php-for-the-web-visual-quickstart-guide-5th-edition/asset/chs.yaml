  ![Image](img/09fig08.jpg)\n\n![Image](img/f.jpg) Chrome 开发者工具显示了浏览器接收到的 Cookie。PHP\
  \ 脚本发送的第二个 Cookie 名 `font_color`，值为 `c00`，代表灰色。\n\n***\n\n> **提示**：Cookie 是 PHP\
  \ 中少数会根据浏览器或操作系统的不同而表现不同的区域之一。你应该在尽可能浏览器和操作系统上测试基于 Cookie 的应用程序。\n\n***\n\n> **提示**：如果你使用了第\
  \ 8 章中教授的输出缓冲技术，那么你可以将 `setcookie()` 调用放在脚本中的任何位置（因为在调用 `ob_end_flush()` 函数之前，浏览器不会接收数据）。\n\
  \n***\n\n> **提示**：Cookie 被限制为约为 4 KB 的总数据。这对于大多数应用程序来说绰绰有余。\n\n***\n\n> **提示**：要测试发送\
  \ Cookie 是否安全，请使用 `headers_sent()` 函数。它会报告 HTTP 头部是否已发送到网络浏览器。\n\n## 从 Cookie 中读取\n\
  \n正如表单数据存储在 `$_POST` 数组中（假设使用了 POST 方法），URL 中传递给脚本的值存储在 `$_GET` 数组中一样，`setcookie()`\
  \ 函数将 Cookie 数据放在 `$_COOKIE` 数组中。要从 Cookie 中检索值，只需将 Cookie 名称作为该数组的索引即可。例如，要检索通过以下行建立的\
  \ Cookie 值：\n\n```php\nsetcookie('user', 'trout');\n```\n\n你将使用变量\n\n`$_COOKIE['user']`。\n\
  \n除非你更改 Cookie 的参数（你将在本章稍后的部分看到），否则 Web 应用程序中的其他页面都可以访问该 Cookie。然而，你应该理解，Cookie\
  \ 在发送后立即是无法被脚本访问的。无法这样做：\n\n```php\nsetcookie('user', 'trout');\nprint $_COOKIE['user'];\
  \ // 无值。\n```\n\n其原因是 Cookie 被读取和发送的顺序（参见本章第一部分的 ![Image](img/ash_b.jpg)）。为了看到访问\
  \ Cookie 值有多么简单，让我们写一个脚本，使用 `customize.php` 中设置的偏好来指定页面的文字大小和颜色。该脚本依赖 CSS 来实现。使用\
  \ PHP 检索 Cookie 数据：\n\n1. 在你的文本编辑器或 IDE 中新建一个 PHP 文档，命名为 `view_settings.php` (**脚本\
  \ 9.2**）：\n\n```html\n<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"\
  utf-8\">\n  <title>View Your Settings</title>\n```\n\n脚本 9.2 使用存储在 Cookie 中的值在 CSS\
  \ 中设置字体大小和颜色。\n\n```html\n<! html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"\
  utf-8\">\n  <title>View Your Settings</title>\n  <style type=\"text/css\">\n  body\
  \ {\n  <?php // Script 9.2 - view_settings.php\n\n    // 检查 font_size 值：\n    if\
  \ (isset($_COOKIE['font_size'])) {\n      print \"\\t\\tfont-size: \" . htmlentities($_COOKIE['font_size'])\
  \ . \";\\n\";\n    } else {\n      print \"\\t\\tfont-size: medium;\";\n    }\n\n\
  \    // 检查 font_color 值：\n    if (isset($_COOKIE['font_color'])) {\n      print\
  \ \"\\t\\tcolor: #\" . htmlentities($_COOKIE['font_color']) . \";\\n\";\n    } else\
  \ {\n      print \"\\t\\tcolor: #000;\";\n    }\n\n  ?>\n  }\n</style>\n</head>\n\
  <body>\n  <p><a href=\"customize.php\">Customize Your Settings</a></p>\n  <p><a\
  \ href=\"reset.php\">Reset Your Settings</a></p>\n  <p>yadda yadda yadda yadda yadda\
  \ yadda yadda yadda yadda yadda yadda yadda yadda yadda yadda yadda yadda yadda\
  \ yadda yadda yadda yadda yadda yadda yadda</p>\n</body>\n</html>\n```\n\n2. 开始\
  \ CSS 部分： \n\n```css\n<style type=\"text/css\">\nbody {\n```\n\n该页面将使用 CSS 来执行用户的偏好。目标是创建如下代码：\n\
  \n```css\nbody {\n  font-size: x-large;\n  color: #999;\n}\n```\n\n这两个值将根据用户在 `customize.php`\
  \ 页面上的选择而不同。在这一步中，你创建了初始 CSS 标签。\n\n3. 打开 PHP 代码段：\n\n```php\n<?php // Script 9.2\
  \ - view_settings.php\n```\n\n脚本现在将使用 PHP 根据 Cookie 打印剩余的 CSS。\n\n4. 使用字体大小 Cookie\
  \ 值（如果它存在）：\n\n```php\nif (isset($_COOKIE ['font_size])) {\n  print \"\\t\\tfont-size:\
  \ \" . htmlentities($_COOKIE ['font_size']) . \";\\n\";\n} else {\n  print \"\\\
  t\\tfont-size: medium;\";\n}\n```\n\n如果脚本可以访问名为 `font_size` 的 Cookie，它将把该 Cookie\
  \ 的值作为 CSS 字体大小值打印。`isset()` 函数足够检查 Cookie 是否存在。如果不存在此类 Cookie，PHP 将打印出默认大小，*medium*。\n\
  \n\n\n\n\n出于安全考虑，cookie 的值不会被直接打印。相反，它会通过 `htmlentities()` 函数进行处理，该函数在第 5 章 的“使用字符串”节中讨论过。如果用户操纵了\
  \ cookie 的值（这很容易），该函数将防止不良情况的发生。\n\n另外注意，在打印语句中添加了两个制表符（`\\t`）和一个换行符（`\\n`），以便使生成的\
  \ CSS 代码格式正确。这不会影响页面的功能，但是……\n\n### 5. 对字体颜色 cookie 重复此过程：\n\n点击此处查看代码图片\n\n```php\n\
  if (isset($_COOKIE ['font_color'])) {\n  print \"\\t\\tcolor: #\" . htmlentities($_COOKIE\
  \ ['font_color']) . \";\\n\";\n} else {\n  print \"\\t\\tcolor: #000;\";\n}\n```\n\
  \n在这里，CSS 的颜色属性（color）被赋予赋值。cookie 本身的使用方法与步骤 4 相同。\n\n### 6. 关闭 PHP 部分，完成 CSS 代码，并完成\
  \ HTML 头部：\n\n```php\n?>\n  }\n  </style>\n</head>\n```\n\n### 7. 开始 HTML 身体，并创建指向另外两个页面的链接：\n\
  \n点击此处查看代码图片\n\n```html\n<body>\n<p><a href=\"customize.php\">自定义您的设置</a></p>\n\
  <p><a href=\"reset.php\">重置您的设置</a></p>\n```\n\n这两个链接将用户带到另外两个 PHP 页面。第一个页面 `customize.php`\
  \ 已经编写完成，允许用户定义他们的设置。第二个页面 `reset.php` 将在本章节后部分编写，允许用户删除他们自定义的设置。\n\n### 8. 添加一些文本：\n\
  \n点击此处查看代码图片\n\n```html\n<p>yadda yadda yadda yadda yadda\nyadda yadda yadda yadda\
  \ yadda\nyadda yadda yadda yadda yadda\nyadda yadda yadda yadda yadda\nyadda yadda\
  \ yadda yadda yadda</p>\n```\n\n这段文本的存在仅仅是为了显示 cookie 变化的效果。\n\n### 9. 完成 HTML 页面：\n\
  \n```html\n</body>\n</html>\n```\n\n### 10. 将文件保存为 `view_settings.php`，将其置于与 `customize.php`\
  \ 相同的目录下，并通过点击 `customize.php` 上的链接在浏览器中测试 ![Image](img/a.jpg)。\n\n![Image](img/09fig09.jpg)\n\
  \n![Image](img/a.jpg) 此页面反映了使用另一个 PHP 脚本所制作的自定义字体选择。\n\n### 11. 查看页面源代码以查看生成的 CSS\
  \ 代码 ![Image](img/b.jpg)。\n\n![Image](img/09fig10.jpg)\n\n![Image](img/b.jpg) 通过查看页面源代码，你还可以跟踪\
  \ CSS 值的变化。\n\n### 12. 使用自定义页面更改您的设置并返回此脚本。\n\n每次提交表单都会创建两个新的 cookie 来存储表单值，从而替换现有的\
  \ cookie。\n\n***\n\n**提示：** cookie 的值在发送时会自动编码，并在被 PHP 页面接收时被解码。HTML 表单发送的值也是如此。\n\
  \n***\n\n### 为 Cookie 添加参数\n\n尽管向 `setcookie()` 函数仅传递 name 和 value 参数就足够满足你大多数的\
  \ cookie 用途了，但你应该意识到其他可用的参数。该函数可以接受多达五个额外的参数，每个参数都会限制 cookie 的操作：\n\n点击此处查看代码图片\n\
  \n```php\nsetcookie(name, value, expiration, path, domain, secure, httponly);\n\
  ```\n\n`expiration` 参数用于设置 cookie 存在的特定时长。如果没有指定，cookie 将一直有效，直到用户关闭浏览器。通常，你通过在当前时间加上特定的分钟或小时数来设置过期时间。你可以通过\
  \ `time()` 函数在 PHP 中获取当前时间（它返回一个时间戳；参见第 8 章）。因此，此行代码将 cookie 的过期时间设置为从当前时刻起一小时（60\
  \ 秒乘以 60 分钟）：\n\n点击此处查看代码图片\n\n```php\nsetcookie(name, value, time()+3600);\n```\n\
  \n由于过期时间将计算为 `time()` 的值加上 `3600`，因此该参数没有放在引号中（你不想字面上地传递 `time() + 3600` 作为过期时间，而是传递该计算的结果）。\n\
  \n`path` 和 `domain` 参数用于将 cookie 限制在网站的特定文件夹（`path`）或特定域名。使用 `path` 选项，你可以限制 cookie\
  \ 仅在用户位于域名的特定子文件夹时存在：\n\n点击此处查看代码图片\n\n```php\nsetcookie(name, value, time()+3600,\
  \ '/subfolder/');\n```\n\nCookie 已经是特定域名的，因此 `domain` 参数可能用于将 cookie 限制在子域名，例如 `example.com`：点击此处查看代码图片\n\
  \n```php\nsetcookie(name, value, time()+3600, '', 'example.com');\n```\n\n`secure`\
  \ 值规定 cookie 应该通过安全连接发送。值为 `1` 表示必须使用安全连接，而 `0` 表示没有必要。对于电子商务网站：点击此处查看代码图片\n\n```php\n\
  setcookie(name, value, time()+3600, '', 'example.com', 1);\n```\n\n最后一个参数——`httponly`\
  \ 是在 PHP 5 中添加的。它可以用于限制对 cookie 的访问（例如使用 JavaScript），但并不是所有浏览器都支持。\n\n设置 cookie\
  \ 的过期日期：\n1. 在文本编辑器中打开 `customize.php`。\n2. 将两个 `setcookie()` 行更改如下：点击此处查看代码图片\n\
  \n```php\nsetcookie('font_size', $_POST['font_size'], time()+3600, '/', 0);\nsetcookie('font_color',\
  \ $_POST['font_color'], time()+3600, '/', 0);\n```\n\n当你添加了过期时间，cookie 在用户关闭浏览器后仍然存在。\n\
  \n```php\n<?php\n// 如果表单已提交则处理表单\nif (isset($_POST['font_size'], $_POST['font_color']))\
  \ {\n  // 发送 cookie：\n  setcookie('font_size', $_POST['font_size'], time()+3600,\
  \ '/', 0);\n  setcookie('font_color', $_POST['font_color'], time()+3600, '/', 0);\n\
  \n  // 后打印的消息：\n  $msg = '<p>您的设置已输入！现在查看 <a href=\"view_settings.php\">它们</a>。</p>';\n\
  } // 提交结束\n?>\n<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
  >\n  <title>自定义您的设置</title>\n</head>\n<body>\n<?php\n// 如果发送了 cookie，则打印消息。\nif\
  \ (isset($msg)) {\n  print $msg;\n}\n?>\n<p>使用此表单设置您的偏好：</p>\n<form action=\"customize.php\"\
  \ method=\"post\">\n  <select name=\"font_size\">\n    <option value=\"\">字体大小</option>\n\
  \    <option value=\"xx-small\">极极小</option>\n    <option value=\"x-small\">特极小</option>\n\
  \    <option value=\"small\">小</option>\n    <option value=\"medium\">中</option>\n\
  \    <option value=\"large\">大</option>\n  </select>\n... (继续)\n```\n\n\n\n\n\n\
  ```html\n<option value=\"x-large\">x-large</option>\n<option value=\"xx-large\"\
  >xx-large</option>\n</select>\n<select name=\"font_color\">\n<option value=\"\"\
  >Font Color</option>\n<option value=\"999\">Gray</option>\n<option value=\"0c0\"\
  >Green</option>\n<option value=\"00f\">Blue</option>\n<option value=\"c00\">Red</option>\n\
  <option value=\"000\">Black</option>\n</select>\n<input type=\"submit\" name=\"\
  submit\" value=\"Set My Preferences\">\n</form>\n</body>\n</html>\n```\n\n为了让这些\
  \ cookie 持久存在（具体来说，持续几个月），请将过期时间设置为现在起 10,000,000 秒。同时，将 `path` 参数设置为网站根目录（`/`）。这样做可能会提高在不同浏览器之间发送这些\
  \ cookie 的一致性。\n\n由于由于 cookie 的过期日期被设置在几个月之后，存储在 cookie 中的用户偏好在用户关闭并重新打开浏览器后仍然有效。如果没有这个过期日期，用户将看到默认字体大小和颜色，并且在每个新的浏览器会话中都要重新分配偏好。\n\
  \n**3.** 保存文件，将其放置在启用 PHP 的服务器的相应目录下，并在浏览器中再次测试 ![Image](img/a.jpg) 和 ![Image](img/b.jpg)。\n\
  \n![Image](img/09fig11.jpg)\n\n![Image](img/a.jpg) 浏览器的 cookie 报告工具（此处为 Chrome 开发工具）现在反映了\
  \ cookie 的过期日期。\n\n![Image](img/09fig12.jpg)\n\n![Image](img/b.jpg) 新的 cookie 参数不会应用程序的功能产生不利影响。\n\
  \n### 提示\n当 cookie 从自己的电脑（即来自 `localhost`）发送时，并不是所有浏览器都会承认调整后的 cookie 过期时间。通常来说，浏览器在处理本地\
  \ cookie 方面可能存在差异。\n\n### 提示\n关于在 cookie 中使用什么类型的过期日期，这里有一些通用指南：如果 cookie 应该在用户浏览网站期间持续有效，则不要设置过期时间。如果\
  \ cookie 在用户关闭并重新打开浏览器后仍继续存在，请设置一个几周或几个月后的过期时间。如果 cookie 可能会构成安全风险，请将过期时间设置为一小时或其部分，以便在用户离开浏览器后\
  \ cookie 不会持续太久。\n\n### 提示\n出于安全考虑，你可以为 cookie 设置 5 或 10 分钟的过期时间，并在用户访问每个新页面时重新发送\
  \ cookie。这样，只要用户处于活跃状态，cookie 就会持续存在，但在用户最后操作 5 或 10 分钟后会自动过期。\n\n### 删除 Cookie\n\
  关于 cookie 需要的最后一点是如何删除它们。虽然 cookie 在用户关闭浏览器或到达过期日期/时间时会自动过期，但有时你可能也想手动删除 cookie。例如，具有注册用户和登录功能的网站会在用户注销时删除任何创建的\
  \ cookie。\n\n`setcookie()` 函数可以接受最多七个参数，但只需要一个——名称。如果你发送一个只有名称而没有值的 cookie，其效果与删除同名的现有\
  \ cookie 相同。例如，要创建 cookie `username`，你使用这行代码：\n\n点击此处查看代码图像\n\n```php\nsetcookie('username',\
  \ 'Larry');\n```\n\n要删除 `username` cookie，你编写：\n\n```php\nsetcookie('username',\
  \ '');\n```\n\n或者\n\n```php\nsetcookie('username', FALSE);\n```\n\n作为额外的预防措施，你还可以设置一个过去的过期日期\
  \ ![Image](img/a.jpg)：\n\n点击此处查看代码图像\n\n```php\nsetcookie('username', FALSE, time()\
  \ - 6000);\n```\n\n![Image](img/09fig13.jpg)\n\n![Image](img/a.jpg) 当发送删除 cookie\
  \ 时，Firefox 开发版如何显示 cookie 信息。\n\n删除 cookie 的唯一注意事项是除了值和过期时间外，你必须使用最初设置 cookie 时相同的参数值。例如，如果你在设置\
  \ cookie 时提供了域名，那么在删除 cookie 时也必须提供该值。为了演示这一功能，让我们添加名为 `reset.php` 的新脚本。该脚本将销毁发送到浏览器的\
  \ cookie：\n\n```php\nsetcookie('font_size', '', time() - 6000, '/');\nsetcookie('font_color',\
  \ '', time() - 6000, '/');\n```\n\n\n\n\n\n就像创建 cookie 在访问另一个页面之前不会生效一样，删除 cookie\
  \ 在访问另一个页面之前也不会生效。换句话说，你可以在某个页面上删除一个 cookie，但仍然可以在该页面上访问该 cookie（因为该页面在发送删除 cookie\
  \ 指令之前接收了该 cookie）。\n\n### 提示\n就像在不同浏览器中使用创建 cookie 的结果不相同，删除 cookie 也是如此。请在许多浏览器上测试您的脚本，并尝试\
  \ `setcookie()` 设置以确保最佳的全面兼容性。\n\n### 提示\n作为不同浏览器处理 cookie 的一个示例，Firefox 开发者版会将任何已过期的\
  \ cookie 视为在 Unix 时间戳（epoch）之后过期 ![Image](img/ash_b.jpg)。\n\n## 什么是会话（Sessions）？\n\
  \n会话和 cookie 一样提供了一种让你在一系列页面中跟踪用户数据的方法。它们的区别（这非常重要）是 cookie 将数据存储在客户端（浏览器）中，而会话数据存储在服务器上。由于这种差异，会话相比\
  \ cookie 有许多优势：\n\n![Image](img/squf.jpg) 会话通常更安全，因为数据不需要在客户端和服务器之间反复传输。\n\n![Image](img/squf.jpg)\
  \ 会话允许你存储比 cookie 更多的信息。\n\n![Image](img/squf.jpg) 即使使用户在浏览器中不接受 cookie，会话也可以工作。\n\
  \n![Image](img/squf.jpg) 你更容易在会话中存储其他类型的数据，例如数组和布尔值。\n\n当你启动会话时，PHP 会生成一个随机会话 ID。每个用户的会话都有自己的会话\
  \ ID，对应于服务器上存储用户会话数据的文本（脚本 9.5）。\n\n**脚本 9.5** 会话数据如何存储在服务器的文件中。\n\n点击此处查看代码图像\n\
  \n```\nemail|s:14:\"me@example.com\";loggedin|i:1292883103;\n```\n\n为了让网站上的每个 PHP\
  \ 脚本都能将相同的会话数据与特定用户关联，还必须跟踪会话 ID。默认情况下，此会话 ID 会作为 cookie 发送到浏览器 ![Image](img/a.jpg)。随后的\
  \ PHP 页面将使用此 cookie 获取会话 ID 并访问会话信息。\n\n![Image](img/09fig17.jpg)\n\n![Image](img/a.jpg)\
  \ 发送到浏览器的会话 cookie。\n\n在接下来的几页中，你将看到在 PHP 中使用会话有多简单。\n\n## 在会话和 cookie 之间选择\n\n\
  会话相比 cookie 有许多优势，但仍然有使用后者的理由。cookie 相比会话有以下优势：\n\n![Image](img/squf.jpg) 稍微更容易创建和检索\n\
  \n![Image](img/squf.jpg) 对服务器的工作要求略少\n\n![Image](img/squf.jpg) 通常持续时间更长\n\n作为一个经验法则的准则，在安全问题不那么严重且只存储最少数据的情况下，你应该使用\
  \ cookie。如果考虑安全问题，并且有大量信息需要记忆，那么使用会话是最好的。不过，请理解，使用会话可能在编写脚本时需要花费更多的精力。\n\n## 创建会话\n\
  \n创建、访问或删除会话都从 `session_start()` 函数开始。该函数会在第一次启动会话时尝试发送一个 cookie，因此它必须在向浏览器发送任何\
  \ HTML 或空白字符之前调用。因此，在使用会话的页面上，你应该将 `session_start()` 函数作为脚本最早几行之一：\n\n```php\n<?php\n\
  session_start();\n```\n\n第一次启动会话时，会生成一个随机会话 ID，并向网络浏览器发送一个名为 `PHPSESSID`（会话名称）且值如\
  \ `mo7puk861tm60tbm4b8coh0og2` 的 cookie。\n\n一旦启动会话，你就可以通过给 `$_SESSION` 数组赋值来向其中记录数据：\n\
  \n点击此处查看代码图像\n\n```php\n$_SESSION['first_name'] = 'Sam';\n$_SESSION['age'] = 10;\n\
  ```\n\n与你在 PHP 中可能使用的其他数组不同，你应该始终将此数组视为关联数组。换句话说，你应该显式使用字符串作为键，例如 `first_name` 和\
  \ `age`。\n\n每当给 `$_SESSION` 数组分配值时，PHP 都会将该数据写入存储在服务器上的临时文件（参见 脚本 9.5）。\n\n首先，你将重写\
  \ 第 8 章 中的登录脚本，这次将电子邮件地址存储在会话中。\n\n创建会话：\n\n1. 在你的文本编辑器或 IDE 中打开 `login.php` (脚本\
  \ 8.13)。\n2. 在 `ob_end_clean()` 行之前，添加以下内容（[脚本 9.6]）：\n\n```php\nsession_start();\n\
  $_SESSION['email'] = $_POST['email'];\n$_SESSION['loggedin'] = time();\n```\n此脚本将两个值存储在会话中，然后将用户重定向到可以访问会话值的页面。\n\
  \n```php\n<?php // 脚本 9.6 - login.php 让人们进入网站（几乎如此）。\n\n// 设置页面标题并包含头文件：\ndefine('TITLE',\
  \ 'Login');\ninclude('templates/header.html');\n\n// 打印介绍性文本\nprint '<h2>Login</h2>';\n\
  print '<p>登录的用户可以使用像这个、那个以及其他的功能。</p>';\n\n// 检查表单是否提交\nif ($_SERVER['REQUEST_METHOD']\
  \ == 'POST') {\n    // 处理表单：\n    if (!empty($_POST['email']) && (!empty($_POST['password'])))\
  \ {\n        if ((strtolower($_POST['email']) == 'me@example.com') && ($_POST['password']\
  \ == 'pass')) { // 正确！\n            // 执行会话操作：\n            session_start();\n \
  \           $_SESSION['email'] = $_POST['email'];\n            $_SESSION['loggedin']\
  \ = time();\n\n            // 将用户重定向到欢迎页！\n            ob_end_clean(); // 销毁缓冲区！\n\
  \            header('Location: welcome.php');\n            exit();\n        } else\
  \ { // 错误！\n            print '<p class=\"text--error\">提交的电子邮件和密码与不匹配！<br>返回重试。</p>';\n\
  \        }\n    } else { // 漏掉了字段。\n        print '<p class=\"text--error\">请确保输入了电子邮件和密码！</p>';\n\
  \    }\n} else { // 显示表单。\n    print '<form action=\"login.php\" method=\"post\"\
  \ class=\"form--inline\">\n        <p><label for=\"email\">电子邮件地址:</label><input\
  \ type=\"email\" name=\"email\" size=\"20\"></p>\n        <p><label for=\"password\"\
  >密码:</label><input type=\"password\" name=\"password\" size=\"20\"></p>\n      \
  \  <p><input type=\"submit\" name=\"submit\" value=\"登录!\" class=\"button--pill\"\
  ></p>\n    </form>';\n}\n\ninclude('templates/footer.html'); // 需要页脚。\n?>\n```\n\
  \n\n\n\n该会话首先将用户提交的电子邮件地址存储在 `$_SESSION['email']` 中。然后，将用户登录的时间戳赋值给 `$_SESSION['loggedin']`。该值通过调用\
  \ `time()` 函数确定，该函数返回自 `epoch`（1970 年 1 月 1 日午夜）以来经过的秒数。\n\n### 3. 将文件保存为 `login.php`，并将其放置在启用\
  \ PHP 的计算机的相应目录中。\n\n此脚本应该放置在第 8 章中使用的目录中，因为它需要其中一些其他文件。\n\n### 4. 在浏览器中加载表单，以确保其没有错误\
  \ ![Image](img/a.jpg)。\n\n![Image](img/09fig18.jpg)\n\n![Image](img/a.jpg) ![Image](img/a.jpg)\
  \ 登录表单。\n\n先不要完成并提交登录表单，因为登录之前需要更新欢迎页面。\n\n***\n\n**提示**\n\n`php.ini` 配置包含许多与会话相关的设置，如果你对服务器拥有管理员级权限，可以对其进行调整。用文本编辑器打开\
  \ `php.ini` 文件并查看手册以获取更多信息。\n\n***\n\n***\n\n**提示**\n\n你也可以使用 `ini_set()` 函数更改某些会话设置。\n\
  \n***\n\n***\n\n**提示**\n\n`session_name()` 函数允许你更改会话名称（而不是使用默认的 `PHPSESSID`）。它必须在每次调用\
  \ `session_start()` 之前，如下：\n\n```\nsession_name('YourVisit');\nsession_start();\n\
  ```\n\n***\n\n***\n\n**提示**\n\n`session_set_cookie_params()` 函数更改会话 cookie 设置，例如过期时间、路径和域。\n\
  \n***\n\n***\n\n**提示**\n\n常量 `SID` 是 Session ID 的缩写，它存储格式为 `name=ID` 的字符串。例如 `PHPSESSID=\
  \ mo7puk861tm60tbm4b8coh0og2`。\n\n***\n\n***\n\n**提示**\n\n你可以在会话中存储任何类型的值——数字、字符串、数组或对象，或者它们的任何组合。\n\
  \n***\n\n## 访问会话变量\n\n现在你已经在会话中存储了值，你需要知道如何访问它们。第一步是调用 `session_start()` 函数。对于每个使用会话的页面，这都是必要的，无论是创建新会话还是访问现有的会话。\n\
  \n从那里，只需像引用其他数组一样引用 `$_SESSION` 变量即可。记住，你要编写另一个欢迎页面——类似于第 8 章中的那个——访问存储的电子邮件和 `loggedin`\
  \ 值。\n\n访问会话变量：\n\n**1.** 在你的文本编辑器或 IDE 中创建一个新的 PHP 文档，命名为 `welcome.php`（**脚本 9.7**）：\n\
  \n点击此处查看代码图像\n\n```php\n<?php // Script 9.7 - welcome.php\n```\n\n**脚本 9.7** 只要你的脚本先使用\
  \ `session_start()`，你就可以使用 `$_SESSION` 数组访问存储的会话值。\n\n点击此处查看代码图像\n\n***\n\n```php\n\
  1   <?php // Script 9.7 - welcome.php #2\n2   /* 这是欢迎页面。用户在\n3   成功登录后\n4   会被重定向到这里。\
  \ */\n5\n6   // 需要会话：\n7   session_start();\n8\n8   // 设置页面标题并包含\n9     页头文件：\n\
  10  define('TITLE', 'Welcome to the J.D.\n11     Salinger Fan Club!');\n12  include('templates/header.html');\n\
  13\n14  // 打印问候语：\n15  print '<h2>Welcome to the J.D. Salinger\n16     Fan Club!</h2>';\n\
  17  print '<p>Hello, ' . $_\n18     SESSION['email'] . '!</p>';\n19\n20  // 打印他们登录了多久：\n\
  21     in:\n22  date_default_timezone_set('America/\n23     New_York');\n24  print\
  \ '<p>You have been logged\n25     in since: ' . date('g:i a', $_\n26     SESSION['loggedin'])\
  \ . '.</p>';\n27\n28  // 创建一个注销链接：\n29  print '<p><a href=\"logout.php\">Logout\n\
  30     </a></p>';\n31\n32  include('templates/footer.html'); //\n33     需要页脚。\n\
  34  ?>\n```\n\n***\n\n**2.** 开始会话：\n\n```php\nsession_start();\n```\n\n当你访问值时，首先使用\
  \ `session_start()`，就像在第 8 章中开发的脚本一样。\n\n**3.** 定义标题并包含页头：\n\n```php\ndefine('TITLE',\
  \ 'Welcome to the J.D. Salinger Fan Club!');\ninclude('templates/header.html');\n\
  ```\n\n**4.** 问候用户：\n\n```php\nprint '<h2>Welcome to the J.D. Salinger Fan Club!</h2>';\n\
  print '<p>Hello, ' . $_SESSION['email'] . '!</p>';\n```\n\n**5.** 显示他们登录了多久：\n\n\
  ```php\ndate_default_timezone_set('America/New_York');\nprint '<p>You have been\
  \ logged in since: ' . date('g:i a', $_SESSION['loggedin']) . '</p>';\n```\n\n**6.**\
  \ 完成内容：\n\n```php\nprint '<p><a href=\"logout.php\">Logout</a></p>';\n```\n\n**7.**\
  \ 包含页脚：\n\n```php\ninclude('templates/footer.html');\n?>\n```\n\n**8.** 将文件保存为 `welcome.php`，将其放置在启用\
  \ PHP 的计算机的相应目录中，并进行测试 ![Image](img/a.jpg)。\n\n![Image](img/09fig18.jpg)\n\n![Image](img/a.jpg)\
  \ 在成功登录（使用表单中的 *me@example.com* 和 *testpass*）后，用户被重定向到此页面，该页面使用会话值欢迎他们。\n\n***\n\
  \n**提示** 要检查特定的会话变量是否存在，使用 `isset($_SESSION['var'])`，就像检查任何变量是否设置一样。\n\n***\n\n\
  ***\n\n**提示** 更安全的脚本版本会在打印值之前先检查它们是否存在（于会话中），并对值运行转义函数。\n\n***\n\n***\n\n**提示**\
  \ 始终记住存储在会话中的数据是以明文形式存储在开放读取的文本文件中的。不要随意存储会话中的内容，永远不要将敏感信息（如信用卡数据）存储在那里。\n\n***\n\
  \n***\n\n**提示** 为了增加安全性，可以在存储到会话之前对其进行加密，并在检索时解密。但这需要加密库和更高级的 PHP 知识。\n\n## 删除会话\n\
  \n知道如何删除会话很重要，就像知道如何删除 cookie 一样：你最终需要删除存储的数据。会话数据存在两个地方——脚本执行期间的数组和文本文件——因此你需要删除这两者。但首先你必须像常一样从\
  \ `session_start()` 函数开始：\n\n```php\nsession_start();\n```\n\n然后，你通过重置 `$_SESSION`\
  \ 数组来清除会话变量：\n\n```php\n$_SESSION = []; // 或 = array();\n```\n\n最后，从服务器上删除会话数据（它存储在临时文件中）。这样做使用\n\
  \n```php\nsession_destroy();\n```\n\n\n\n\n# 1. 在你的文本编辑器或 IDE 中创建一个新的 PHP 脚本，命名为\
  \ `logout.php` (脚本 9.8)。\n\n点击此处查看代码\n\n```php\n<?php // Script 9.8 - logout.php\n\
  ```\n\n**脚本 9.8** 删除会话分三个步骤：启动会话、重置数组以及销毁会话数据。\n\n点击此处查看代码\n\n```php\n25  <?php\
  \ // Script 9.8 - logout.php\n26  /* 这是登录页面。它销毁\n    会话信息。 */\n27\n28  // 需要会话：\n\
  29  session_start();\n30\n31  // 重置会话数组：\n32  $_SESSION = [];\n33\n34  // 销毁服务器上的\n\
  \    会话数据：\n35  session_destroy();\n36\n37  // 定义页面标题并包含\n    头部文件：\n38  define('TITLE',\
  \ 'Logout');\n39  include('templates/header.html');\n40\n41  ?>\n42\n43  <h2>欢迎来到\
  \ J.D. Salinger 粉丝俱乐部！</h2>\n44  <p>你现在已经注销。</p>\n45  <p>感谢使用本站。我们\n    希望你喜欢这里。<br>\n\
  \    啦，啦，啦...<br>\n    啦，啦，啦...</p>\n48\n49  <?php include('templates/footer.html');\n\
  50    ?>\n```\n\n### 2. 开启/启动会话：\n\n```php\nsession_start();\n```\n\n请记住，在使用此函数激活会话之前，你无法删除会话。\n\
  \n### 3. 重置会话数组：\n\n```php\n$_SESSION = [];\n```\n\n如第 7 章中的“使用数组”所示，短数组语法（等同于 `array()`\
  \ 函数）会创建一个新的空数组。通过将此函数调用的结果赋值给 `$_SESSION`，`$_SESSION` 中所有现有 `key-value` 对都将被擦除。\n\
  \n### 4. 销毁服务器上的会话数据：\n\n```php\nsession_destroy();\n```\n\n这一步告诉 PHP 删除服务器上的实际会话文件。\n\
  \n### 5. 包含 HTML 头部并完成此 PHP 部分：\n\n点击此处查看代码\n\n```php\ndefine('TITLE', 'Logout');\n\
  include('templates/header.html');\n?>\n```\n\n### 6. 制作页面内容：\n\n点击此处查看代码\n\n```html\n\
  <h2>欢迎来到 J.D. Salinger 粉丝俱乐部！</h2>\n<p>你现在已经注销。</p>\n<p>感谢使用本站。我们希望你喜欢这里。<br />\n\
  啦，啦，啦...<br />\n啦，啦，啦...</p>\n```\n\n### 7. 包含 HTML 页脚：\n\n点击此处查看代码\n\n```php\n\
  <?php include('templates/footer.html'); ?>\n```\n\n### 8. 将文件保存为 `logout.php`，将其置于支持\
  \ PHP 的服务器相应目录中，并通过点击 `welcome.php` 中的链接 ![Image](img/a.jpg) 在浏览器中测试。\n\n![Image](img/09fig20.jpg)\n\
  \n![Image](img/a.jpg) 注销页面销毁了会话数据。\n\n**提示**\n\n要删除单个会话值，请使用\n\n```php\nunset($_SESSION['var']);\n\
  ```\n\n一个额外的步骤是同时也删除会话 cookie。\n\n**提示**\n\n服务器上的 PHP 模块将根据配置中的设置自动执行垃圾回收。PHP 使用垃圾回收手动删除服务器上的会话文件，前提是这些文件不再被需要。\n\
  \n## 复习与进\n\n如果你在复习题或深入提示中遇到任何问题，请访问书籍的支持论坛（[www.LarryUllman.com/forums/](http://www.LarryUllman.com/forums/)））。\n\
  \n### 复习\n\n![Image](img/squf.jpg) Cookie 在哪里存储数据？会话在哪里存储数据？哪种通常更安全？\n\n![Image](img/squf.jpg)\
  \ 在尝试解决涉及 cookie 的问题时列举两种调试技术。\n\n![Image](img/squf.jpg) `setcookie()` 函数的 `path`\
  \ 和 `domain` 参数如何影响 cookie 的可用性？\n\n![Image](img/squf.jpg) 如何删除 cookie？\n\n![Image](img/squf.jpg)\
  \ 如果页面需要分配或访问会话数据，每个页面必须调用哪个函数？\n\n### 深入\n\n![Image](img/squf.jpg) Cookie 在哪里存储数据？会话在哪里存储数据？哪种通常更安全？\n\
  \n![Image](img/squf.jpg) 在尝试解决涉及 cookie 的问题时列举两种调试技术。\n\n![Image](img/squf.jpg)\
  \ `setcookie()` 函数的 `path` 和 `domain` 参数如何影响 cookie 的可用性？\n\n![Image](img/squf.jpg)\
  \ 如何删除 cookie？\n\n![Image](img/squf.jpg) 如果页面需要分配或访问会话数据，每个页面必须调用哪个函数？\n\n\n\n\n\
  你可以对函数使用与变量相似的命名规范，只是不需要去掉开头的美元符号 `$`。其次是建议你创建具有`意义的`的函数名，就像你应该编写具有代表性的变量名一样。例如，`create_header`\
  \ 比 `function1` 是更好的函数名。但请记住不要在名称中使用空格——这样做会导致函数名被视为两个独立的单词，从而导致错误信息。下划线 `_` 是空格的逻辑替代方案。与变量不同，PHP\
  \ 中的函数名**不**区分大小写，但你仍然应该保持一致的命名方案。\n\n任何有效的 PHP 代码都可以放在函数的语句区域内，包括对其他函数的调用。函数所包含的语句数量没有限制，但请确保每条语句都以分号\
  \ `;` 结尾，就像你在 PHP 脚本的其他部分做的那样。函数还可以包含任何控制结构的组合：条件判断和循环。\n\n函数的具体格式并不重要，只要包含必要的元素即可。这些元素包括\
  \ `function` 关键字、函数名、左和右括号 `()`、左和右大括号 `{}` 以及语句。为了清晰起见，通常会将函数的语句相对于 `function`\
  \ 关键字行进行缩进，就像你处理循环或条件语句一样。无论如何，请选择一种你喜欢的格式风格——既在语法上正确又在逻辑上合理——并坚持下去。\n\n你通过引用函数来调用（或触发）它，就像调用任何内置函数一样。这行代码\n\
  \n```php\nwhatever();\n```\n\n将导致之前定义的函数的语句部分——打印命令——被执行。\n\n让我们从创建一个函数开始，该函数为表单\
  \ ![Image](img/a.jpg) 生成月份、日期和年份的下拉菜单。\n\n![Image](img/10fig01.jpg)\n\n![Image](img/a.jpg)\
  \ 这些下拉菜单是由用户定义的 PHP 函数创建的。\n\n### 要创建并调用基本函数：\n\n**1.** 在你的文本编辑器或 IDE 中新建一个 PHP\
  \ 文档，命名为 `menus.php` (脚本 10.1)：\n\n```html\n<!doctype html>\n<html lang=\"en\">\n\
  <head>\n  <meta charset=\"utf-8\">\n  <title>Date Menus</title>\n</head>\n<body>\n\
