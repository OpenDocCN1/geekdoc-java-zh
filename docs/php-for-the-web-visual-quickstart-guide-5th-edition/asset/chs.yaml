  \ PHP 手册页面。使用该页面上的链接检查 PHP 拥有的其他几个字符串相关的函数。\n\n\n\n\n![Image](img/squf.jpg) 查看专门针对\
  \ `substr()` 函数的 PHP 手册页。阅读该页面上的其他示例，以更好地直观地了解 `substr()` 如何使用。\n\n![Image](img/squf.jpg)\
  \ 编写与脚本 5.5 配套的 `thanks.php` 脚本。如果你需要帮助，可以重新查看第 3 章中的 `hello.php` 脚本（脚本 3.7）。\n\n\
  ![Image](img/squf.jpg) 重写 `handle_post.php` 最终版本（脚本 5.7）中的打印语句，使其使用单引号和字符串拼接，而不是双引号。\n\
  \n![Image](img/squf.jpg) 创建另一个 HTML 表单来接收字符串值。然后创建一个接收表单数据的 PHP 脚本，处理任何 HTML 或 PHP\
  \ 代码，对数据进行某种处理，并打印结果。\n\n## 6. 控制结构\n\n在本章\n- 创建 HTML 表单\n- if 条件判断\n- 验证函数\n- 使用\
  \ else\n- 更多运算符\n- 使用 elseif\n- Switch 条件判断\n- for 循环\n- 回顾与进阶\n\n控制结构——条件判断和循环——是编程语言的基础。PHP\
  \ 有两种条件语句——`if` 和 `switch`——你将在本章中掌握这两个者。条件判断允许你建立一个测试，然后根据结果执行操作。此功能提供了让网站更加动态的能力。\n\
