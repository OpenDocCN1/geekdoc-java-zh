  \ PHP 服务器的相应目录下，并在浏览器中测试。![Image](img/c.jpg)\n\n![Image](img/10fig10.jpg)\n\n![Image](img/c.jpg)\
  \ 现在该函数能够根据参数更改输入框的大小。如果未为该参数提供值，则将使用默认尺寸（第一个输入框）。\n\n**提示**\n\n若要为函数的特定参数传递空值，请使用空字符串（''`）或单词\
  \ `NULL`（不带引号）。如果建立了默认值，这两个值中的任何一个都会覆盖默认值。\n\n**提示**\n\n正如在第 1 章中提到的，“PHP 入门”中所示，PHP\
  \ 手册使用方括号标记可选的函数参数。例如，当你使用 `number_format()` 函数时，要舍入的小数点位数是可选的：\n\n点击此处查看代码图片\n\n\
  ```php\nstring number_format(float number [, int decimals = 0])\n```\n\n### 创建和使用返回值的函数\n\
  \n函数不仅接收参数，还可以返回结果。这只需要多两个步骤：首先，你在函数内部使用 `return` 语句。其次，在调用函数时以某种方式使用输出结果。通常情况下，你会将返回值赋值给一个变量，但你也可以（例如）直接打印输出。这是一个接收两个参数并返回值的函数的基本格式：\n\
  \n点击此处查看代码图片\n\n```php\nfunction make_full_name ($first, $last) {\n  $name = $first\
  \ . ' ' . $last;\n  return $name;\n}\n```\n\n该函数可以像这样使用：\n\n点击此处查看代码图片\n\n```php\n\
  $full_name = make_full_name ($fn, $ln);\n```\n\n在这里，函数的返回值被赋值给一个变量。而在这里，它被直接打印了：\n\
  \n```php\nprint make_full_name($fn, $ln)\n```\n\n为了演示这个概念，让我们创建一个执行简单计算并格式化结果的函数。此脚本将显示一个\
  \ HTML 表单，用户可以在其中输入数量和价格。当表单提交（返回此页面）时，将计算并打印总值。这个简单的表单接收两个值进行计算。计算结果发生在用户定义的函数内部。\n\
  \n要创建并使用返回值的函数：\n\n**1. 在你的文本编辑器或 IDE 中创建一个新的 PHP 文档，命名为 `calculator1.php`（脚本 10.4）：**\
  \ 点击此处查看代码图片\n\n```html\n<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"\
  utf-8\">\n<title>Cost Calculator</title>\n</head>\n<body>\n<?php // 脚本 10.4 – calculator1.php\n\
  /* 此脚本显示并处理一个 HTML 表单。\n它使用函数根据数量和价格计算总额。 */\n\n// 此函数执行计算。\nfunction calculate_total($quantity,\
  \ $price) {\n  $total = $quantity * $price; // 计算\n  $total = number_format($total,\
  \ 2); // 格式化\n  return $total; // 返回值\n}\n\n// 检查表单提交：\nif ($_SERVER['REQUEST_METHOD']\
  \ == 'POST') {\n  // 检查值：\n  if ( is_numeric($_POST['quantity']) AND is_numeric($_POST['price'])\
  \ ) {\n    // 调用函数并打印结果：\n    $total = calculate_total($_POST['quantity'], $_POST['price']);\n\
  \    print \"<p>总计为 $<span style=\\\"font-weight: bold;\\\">$total</span>。</p>\"\
  ;\n  } else { // 输入了不适当的值\n    print '<p style=\"color: red;\">请输入有效的数量和价格!</p>';\n\
  \  }\n}\n?>\n<form action=\"\" method=\"post\">\n  <p>数量：<input type=\"text\" name=\"\
  quantity\" size=\"3\"></p>\n  <p>价格：<input type=\"text\" name=\"price\" size=\"\
  5\"></p>\n  <input type=\"submit\" name=\"submit\" value=\"计算!\">\n</form>\n</body>\n\
  </html>\n```\n\n**2. 开始 PHP 代码：**\n\n```php\n<?php // 脚本 10.4 – calculator1.php\n\
  ```\n\n**3. 定义函数：** 点击此处查看代码图片\n\n```php\nfunction calculate_total ($quantity, $price)\
  \ {\n  $total = $quantity * $price;\n  $total = number_format ($total, 2);\n  return\
  \ $total;\n}\n```\n\n该函数接收两个参数——数量和价格——并将它们相乘得到总和。总值在返回之前会经过格式化处理。\n\n虽然这样使用函数看起来很傻，但将即使是单步计算放入函数有两好处：首先，由于函数位于脚本开头而不是隐藏在其他代码中，以后更容易查找和修改；其次，如果你想在脚本中再次执行该操作，无需重复编写代码。\n\
  \n**4. 开始检查表单是否已提交的条件判断：** 点击此处查看代码图片\n\n```php\nif ($_SERVER['REQUEST_METHOD']\
  \ == 'POST') {\n```\n\n**5. 验证表单数据并使用函数：** 点击此处查看代码图片\n\n```php\nif ( is_numeric($_POST['quantity'])\
  \ AND is_numeric($_POST['price']) ) {\n```\n\n\n\n\n\n```php\n$total = calculate_total($_POST['quantity'],\
  \ $_POST['price']);\n\nprint \"<p>Your total comes to $<span style=\\\"font-weight:\
  \ bold;\\\">$total</span>.</p>\";\n```\n\n这段 PHP 代码部分——处理表单提交后的逻辑——首先检查是否输入了数字数量和价格。如果是，则通过调用\
  \ `calculate_total()` 函数并将结果赋值给 `$total` 变量来确定总额。然后打印出该结果。\n\n### 6. 完善条件判断：\n\n\
  点击此处查看代码图片\n\n```php\n} else {\n    print '<p style=\"color: red;\">Please enter\
  \ a valid quantity and price!</p>';\n  }\n}\n```\n\n如果表单变量中的任何一个没有被正确提交，将打印一条消息提示这种情况。最后一个大括号关闭了表单提交的条件判断。\n\
  \n对两个打印的消息（这里以及第 5 步中）都应用了简单的 CSS。\n\n### 7. 显示 HTML 表单：\n\n点击此处查看代码图片\n\n```php\n\
  ?>\n\n<form action=\"\" method=\"post\">\n  <p>Quantity: <input type=\"text\" name=\"\
  quantity\" size=\"3\"></p>\n  <p>Price: <input type=\"text\" name=\"price\" size=\"\
  5\"></p>\n  <input type=\"submit\" name=\"submit\" value=\"Calculate!\">\n</form>\n\
  ```\n\n表单本身非常简单，向用户请求两个不同的值 ![Image](img/ash_a.jpg)。因为这个表单是在主提交条件之外创建的，所以页面将始终显示该表单\
  \ ![Image](img/ash_b.jpg)。\n\n### 8. 完善 HTML 页面：\n\n```html\n</body>\n</html>\n\
  ```\n\n***\n\n## 返回多个值\n\n用户定义的函数通常只返回单个值，但可以使用数组返回多个值。以下是实现方法：\n\n点击此处查看代码图片\n\n\
  ```php\nfunction some_function($p1, $p2)\n{\n  // Do whatever.\n  return [$a, $b];\n\
  \  // Or: return array($v1, $v2);\n}\n```\n\n然后，要调用此函数，使用 `list()` 函数将数组元素赋值给单独变量：\n\
  \n点击此处查看代码图片\n\n```php\nlist($v1, $v2) = some_function ($a1, $a2);\n```\n\n结果是函数中的\
  \ `$a` 被赋值给 PHP 脚本中的 `$v1`，函数中的 `$b` 被赋值给 `$v2`。\n\n***\n\n***\n\n## 声明返回类型\n\n\
  PHP 7 支持声明函数返回值的类型。要使用此功能，在函数名后跟一个冒号和返回类型：\n\n点击此处查看代码图片\n\n```php\nfunction make_full_name\
  \ ($first, $last): string {\n```\n\n或者\n\n点击此处查看代码图片\n\n```php\nfunction calculate_total\
  \ ($quantity, $price): float {\n```\n\n当你想要保证函数返回值的类型时，这种类型更严格的函数定义是最好的。\n\n***\n\
  \n### 9. 将页面保存为 calculator1.php，将其放置在启用 PHP 的服务器的相应目录下，并在浏览器中进行测试 ![Image](img/ash_b.jpg)。\n\
  \n***\n\n### 提示\n\n一个函数中只能有一个*执行* return 语句，但同一个函数可以有多个 return 语句。例如，你可能想写一个检查条件并返回指示该条件是否满足的值的函数。在这种情况下，函数可能包含：\n\
  \n```php\nif (condition) {\n  return true;\n} else {\n  return false;\n}\n```\n\n\
  ***\n\n***\n\n### 提示\n\n函数返回的结果是 TRUE 或 FALSE，表示是否满足了指定的条件。\n\n***\n\n### 理解变量作用域\n\
  \n`variable scope`（变量作用域）概念在前面的章节中没有引入，因为如果没有对函数的理解，作用域几乎没有意义。现在你已经熟悉了函数，这一部分将重新回顾变量主题，并详细讨论了变量和函数是如何协同工作的。\n\
  \n正如你在本章的第二部分看到的“带参数的函数的创建和调用”，你可以通过将变量作为参数传递给函数。然而，你也可以使用 `global` 语句从函数内部引用外部变量。这是由于变量作用域的原因。变量的\
  \ `scope`（作用域）是它存在的范围。\n\n默认情况下，你在脚本中编写的变量在整个脚本生命周期内存在。相反，环境变量（如 `$_SERVER['PHP_SELF']`）存在于服务器上的每个\
  \ PHP 脚本中。\n\n但是，函数创建了一个新的作用域级别。函数变量——函数的参数以及在函数内部定义的任何变量——仅存在于该函数内部，无法从外部访问。换句话说，函数变量是具有\
  \ `local scope`（局部作用域）的 `local variables`（局部变量）。同样，函数外部的变量在函数内部不可用 ![Image](img/a.jpg)。\n\
  \n*(此处后续为重复内容，已按要求处理核心逻辑)*\n\n\n\n\n\n为了演示变量的作用域，让我们使用 `global` 语句重新编写 `calculator1.php`\
  \ 脚本。\n\n### 使用 `global` 语句：\n\n1. 在你的文本编辑器或 IDE 中打开 `calculator1.php`（脚本 10.4），如果尚未打开。\n\
  2. 在函数定义之前，添加以下内容（**脚本 10.5**）：\n\n```php\n$tax = 8.75;\n```\n\n**脚本 10.5** 此脚本中的函数可以使用\
  \ `$tax` 变量——尽管它没有被传递给函数——这得益于 `global` 语句。\n\n点击此处查看代码图片\n\n```php\n<!doctype html>\n\
  <html lang=\"en\">\n<head>\n    <meta charset=\"utf-8\">\n    <title>Cost Calculator</title>\n\
  </head>\n<body>\n<?php // Script 10.5 - calculator2.php\n    #2\n/* 此脚本显示并处理一个\n\
  HTML 表单。\n它使用一个函数根据数量、价格和税率来\n计算总额。 */\n\n// 定义税率：\n$tax = 8.75;\n\n// 此函数执行\n计算。\n\
  function calculate_total ($quantity, $price) {\n\n    global $tax;\n\n    $total\
  \ = $quantity * $price; // 计算\n    $taxrate = ($tax / 100) + 1;\n    $total = $total\
  \ * $taxrate; // 添加税。\n    $total = number_format ($total, 2); // 格式化\n\n    return\
  \ $total; // 返回值。\n} // 函数结束。\n\n// 检查表单提交：\nif (isset($_POST['submitted'])) {\n\
  \n    // 检查值：\n    if ( is_numeric($_POST['quantity']) AND is_numeric($_POST['price'])\
  \ ) {\n        // 调用函数并打印结果：\n        $total = calculate_total($_POST['quantity'],\
  \ $_POST['price']);\n        print \"<p>您的总额为 $<span style=\\\"font-weight: bold;\\\
  \">$total</span>, 包括 $tax 百比的税率。</p>\";\n    } else { // 输入了不的值。\n        print\
  \ '<p style=\"color: red;\">请输入有效的数量和价格!</p>';\n    }\n}\n?>\n<form action=\"\"\
  \ method=\"post\">\n    <p>数量: <input type=\"text\" name=\"quantity\" size=\"3\"\
  ></p>\n    <p>价格: <input type=\"text\" name=\"price\" size=\"5\"></p>\n    <input\
  \ type=\"submit\" name=\"submit\" value=\"计算!\">\n    <input type=\"hidden\" name=\"\
  submitted\" value=\"true\">\n</form>\n</body>\n</html>\n```\n\n这一行创建了一个带有设定值的 `$tax`\
  \ 变量，该值将用于计算。它在函数外部被赋予了一个值，因为它稍后会在主体部分中使用。\n\n3. 在函数定义内部，添加 `global` 语句：\n```php\n\
  global $tax;\n```\n该语句告诉函数引入与函数外部相同的同一个 `$tax` 变量。\n\n4. 在函数中的 `$total` 经过格式化之前，使用税率重新计算该值：\n\
  ```php\n$taxrate = ($tax / 100) + 1;\n$total = $total * $taxrate;\n```\n要将税率添加到总额中，首先将税率除以\
  \ `100` 以创建一个百分比。然后在该值上加 `1` 以得到一个乘数。然后将此结果乘以 `total` 以得到新的、最终的总额。注意，你使用 `$taxrate`\
  \ 变量（基于 `$tax`）来执行这些计算。这是因为你稍后会打印出 `$tax` 的值，对它所做的任何更改都将反映在这里（因为它是一个全局变量）。\n\n5.\
  \ 修改主 `print` 行（在函数调用之后），使其也打印税率：点击此处查看代码图片\n```php\nprint \"<p>您的总额为 $<span=\\\"\
  font-weight: bold;\\\">$total</span>, 包括 $tax 百比的税率。</p>\";\n```\n在脚本开头定义的 `$tax`\
  \ 变量在末尾被打印出来。如果你在函数内部内部没有使用 `$taxrate` 变量，而是直接对 `$tax` 进行了修改，那么这些计算将反映在这里。\n\n6.\
  \ 保存脚本，将其放在你启用了 PHP 的服务器相应目录下，并在浏览器中进行测试 ![Image](img/d.jpg) 和 ![Image](img/e.jpg)。再次运行表单……现在计算使用了全局\
  \ `$tax` 变量。\n\n**提示**\n常量和超全局数组（`$_GET`、`$_POST`、`$_COOKIE` 和 `$_SESSION`）的额外好处是，它们在函数内部始终可用，而不需要使用\
  \ `global` 语句。这就是为什么它们被称为超全局变量。\n\n**提示**\n每个函数都有其自己的、独立的局部作用域。\n\n### 函数设计理论\n\
  理解定义自定义函数的语法是重要的，但你还需要理解良好的函数设计理论。一个良好的用户定义函数应该是易于重用的，并且很可能被重用（也就是说，如果一个网站只调用它一次）。\n\
  \n应该对函数保持“黑盒”：程序员不需要知道函数的内部实现就能正确地使用它。\n\n为了支持“黑盒”方法，良好的函数设计应该传递其所需的信息，而不是依赖全局变量。\n\
  \n函数不应该依赖全局变量，也不应该做出假设，例如 `make_text_input()`，它假设表单是通过 `POST` 方法提交的。\n\n通过编写不依赖全局变量也不做假设的函数，你可以让函数更加独立和可移植。设计函数是一种通过实践学习的技能。\n\
