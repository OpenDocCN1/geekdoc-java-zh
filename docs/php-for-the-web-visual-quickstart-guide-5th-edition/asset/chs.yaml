  \ = 'Tomato';\n$soups['Saturday'] = 'Cream of\nBroccoli';\n\n// 计数并打印新数量：\n$count2\
  \ = count($soups);\nprint \"<p>The soups array originally\n    had $count2 elements.</p>\"\
  ;\n\n// 输出数组进行测试\nprint_r($soups);\n?>\n</body>\n</html>\n```\n\n***\n\n## 合并数组\n\
  \nPHP 有一个函数允许你将一个数组追加到另一个数组之后。将其视为数组的拼接。该函数，`array_merge()`，工作如下：\n\n点击此处查看代码图片\n\
  \n```php\n$new_array = array_merge($array1, $array2);\n```\n\n你也可以用这种方式编写 soups2.php\
  \ ：\n\n点击此处查看代码图片\n\n```php\n$soups2 = [\n    'Thursday' => 'Chicken Noodle',\n\
  \    'Friday' => 'Tomato',\n    'Saturday' => 'Cream of Broccoli'\n];\n\n$soups\
  \ = array_merge($soups, $soups2);\n```\n\n你甚至可以使用加号来来实现这种结果（从而将两个数组相加）：\n\n```php\n\
  $soups = $soups + $soups2;\n```\n\n或\n\n```php\n$soups += $soups2;\n```\n\n使用 `array_merge()`\
  \ 和加号之间的区别是，`array_merge()` 会重新索引数组中的数组，而加号保持现有索引。此外，在数组相加中，只有第二个数组中位于新位置索引的元素会被添加。第二个数组中与第一个数组元素具有相同索引的元素将被忽略。\n\
  \n\n\n\n\n点击此处查看代码图像\n\n```php\nprint \"The first item is $array[0]\";\n```\n\n\
  如果数组使用字符串作为索引，你必须给索引加上引号，这会导致在你尝试打印单个数组元素时产生一个问题的语法错误 ![Image](img/a.jpg):\n\n点击此处查看代码图像\n\
  \n```php\nprint \"<p>Monday's soup is $soups['Monday'].</p>\";\n```\n\n![Image](img/07fig04.jpg)\n\
  \n![Image](img/a.jpg) 在双引号内引用关联数组中的特定元素会导致解析错误。\n\n为了解决这个问题，请将整个数组结构包裹在大括号（也称为大括号）内\
  \ ![Image](img/b.jpg):\n\n点击此处查看代码图像\n\n```php\nprint \"<p>Monday's soup is {$soups['Monday']}.</p>\"\
  ;\n```\n\n![Image](img/07fig05.jpg)\n\n![Image](img/b.jpg) 将数组元素引用在大括号内是避免解析错误的方法之一。\n\
  \n讽刺的是，让数组如此实用的特性——在一个变量中存储多个值——也让它具有了其他变量类型不具备的局限性：你必须知道数组的键才能访问其元素。如果数组是用字符串设置的（例如\
  \ `$soups` 数组），那么引用 `$soups[1]` 将指向任何内容 ![Image](img/c.jpg)。此外，由于*索引是区分大小写的*，`$soups['monday']`\
  \ 是没有意义，因为蛤蜊汤的索引是 `$soups['Monday']`。\n\n![Image](img/07fig06.jpg)\n\n![Image](img/c.jpg)\
  \ 引用不存在的数组索引将产生 *Undefined offset*（未定义的偏移量）或 *Undefined Index*（未定义的索引）通知。\n\n访问数组所有值最快最简单的方法是使用\
  \ `foreach` 循环。该结构会遍历数组的每一个元素：\n\n点击此处查看代码图像\n\n```php\nforeach ($array as $key\
  \ => $value) {\n  print \"<p>Key is $key. Value is $value</p>\";\n}\n```\n\n在循环的每次迭代中，当前数组元素的键将被赋值给变量\
  \ `$key`，值将被赋值给 `$value`。注意，你在这里可以使用任何变量名：`$k` 和 `$v` 可能也是不错的选择。\n\n你现在可以编写一个新的汤脚本来使用这些知识了。\n\
