  \ (function_exists ('some_function')){ ...\n```\n\n***\n\n### 提示\n虽然不是强制要求的，但我建议你养成在脚本开头（或在包含的文件中）定义函数的习惯，而不是在脚本末尾。\n\
  \n***\n\n### 提示\n有些人更倾向于使用这种语法来布局他们的函数：\n\n```php\nfunction function_name()\n{\n\
  \  statement(s);\n}\n```\n\n***\n\n### 提示\n用户自定义函数会为你的 PHP 脚本增加额外的内存需求，因此你应该审慎地使用它们。如果你发现你的函数仅仅调用了另一个\
  \ PHP 函数或者只有一行代码，那么这可能不是使用该功能的最佳方式。\n\n***\n\n### 创建和调用带参数的函数\n\n虽然创建一个简单的函数很有用，但编写一个能够接收输入并对该输入进行处理的函数会更好。传递给函数的输入被称为\
  \ `argument`（参数）。这是一个你以前见过的概念：`sort()` 函数接收一个数组作为参数，然后函数对该数组进行排序。\n\n编写带参数函数的语法如下：\n\
  \n点击此处查看代码图片\n\n```php\nfunction function_name ($arg1,$arg2, ...) {\n  statement(s);\n\
  }\n```\n\n函数通过 `parameters`（形式参）进行定义：这些变量在调用函数时，会被赋值为发送给函数的值。这些变量的定义遵循与 PHP 中任何其他变量相同的命名规则：\n\
  \n点击此处查看代码图片\n\n```php\nfunction make_full_name($first, $last) {\n  print $first\
  \ . ' ' . $last;\n}\n```\n\n接收输入的函数的调用方式与不接收输入的函数非常相似——你只需要记住传递必要的值。你可以通过传递变量来实现：\n\
  \n```php\nmake_full_name($fn, $ln);\n```\n\n或者通过发送字面量，如下所示：\n\n点击此处查看代码图片\n\n```php\n\
  make_full_name('Larry', 'Ullman');\n```\n\n或者两者的组合：\n\n```php\nmake_full_name('Larry',\
  \ $ln);\n```\n\n需要注意的是，参数是完全字面地传递的：函数定义中的第一个变量被赋值为调用行中的第一个值，第二个函数变量被赋值为第二个调用值，依此类推\
  \ ![Image](img/a.jpg)。函数并不足够智能，无法直观地理解你想要如何关联这些值。如果你没有传递某个值，也是如此，在这种情况下函数将假设该值为\
  \ `null`（`null` 并不是数学上的 0，0 实际上是一个值，但接近“无”这个词的概念）。如果一个函数接受两个参数而你只传递了一个，第二个参数将是 `null`，这可能会产生错误\
  \ ![Image](img/b.jpg)。\n\n![Image](img/10fig04.jpg)\n\n![Image](img/a.jpg) 函数调用中的值是如何赋值给函数参数的。\n\
  \n![Image](img/10fig05.jpg)\n\n![Image](img/b.jpg) 与任何函数（用户自定义或 PHP 内置）一样，在调用时传递错误数量的参数会产生警告。\n\
  \n（为了澄清一个小点，函数定义中的变量被称为 `parameters`（形式参）；在调用时传递给函数的值被称为 `arguments`（实参）。尽管如此，交替使用这两个术语也是很的。）\n\
