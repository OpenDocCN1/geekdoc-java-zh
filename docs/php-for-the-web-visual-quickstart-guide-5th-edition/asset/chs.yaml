  \ 函数将数组值赋值给单独的变量。有一个示例：\n\n```php\n$date = ['Thursday', 23, 'October'];\nlist($weekday,\
  \ $day, $month) = $date;\n```\n\n使用 `list()` 有注意事项：首先，`list()` 只适用于索引从 0 开始的数组。其次，当你使用\
  \ `list()` 时，必须承认数组元素。你可以不能这样做：\n\n```php\nlist($weekday, , $month) = $date;\n```\n\
  \n但你可以忽略空元素：\n\n```php\nlist($weekday, , $month) = $date;\n```\n\n`list()` 有两个注意事项：首先，`list()`\
  \ 只适用于索引从 0 开始的数组。其次，当你使用 `list()` 时，必须承认数组元素。尝试使用 `foreach` 处理非数组变量会产生错误 ![Image](img/b.jpg)。\n\
  \n![Image_07fig15.jpg![Image](img/b.jpg) 尝试对非数组变量使用 foreach 是常见的错误原因。\n\n### 4.\
