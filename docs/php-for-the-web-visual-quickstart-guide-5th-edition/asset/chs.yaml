  尽管在功能上编写 `$taxrate = $taxrate + 1;` 还是简写为 `$taxrate++;` 没有区别，但后者（使用自增运算符）更专业且更常见。\n\
  \n### 提示\n在第 6 章中，你将看到自增运算符如何结合循环使用。\n\n### 算术赋值运算符\n\nPHP 还支持数学运算符与赋值运算符的组合。这些是\
  \ `+=`、`-=`、`*=` 和 `/=`。每个运算符都会对变量进行计算并为其赋值。例如，下面两行代码都向变量加 5：\n\n```php\n$num =\
  \ $num + 5;\n$num += 5;\n```\n\n这意味着 `handle_calc.php` 脚本可以使用这种方法确定税率：\n\n点击此处查看代码图片\n\
  \n```php\n$tax = $_POST['tax']; // 假设为 5\n$tax /= 100; // 现在 $tax 是 .05\n$tax +=\
  \ 1; // 1.05\n```\n\n你经常会看到这些执行算术的简写方式。\n\n### 创建随机数\n\n在本章中学习的最后一个函数是 `mt_rand()`，它是一个随机数生成器。它的作用仅仅输出一个随机数：\n\
  \n```php\n$n = mt_rand(); // 31\n$n = mt_rand(); // 87\n```\n\n`mt_rand()` 函数还可以接受最小值参数，如果你希望将生成的数字限制在特定范围内：\n\
  \n```php\n$n = mt_rand(0, 10);\n```\n\n这些值是*包含边界的*，因此在这种情况下，0 和 10 都是可能的返回值。\n\n\
  作为生成随机数的一个示例，让我们创建一个简单的“幸运数字”脚本。\n\n要生成随机数：\n\n**1.** 在你的文本编辑器或 IDE 中新建一个文档，命名为\
  \ `random.php`（**脚本 4.6**）：\n\n点击此处查看代码图片\n\n```html\n<!doctype html>\n<html lang=\"\
  en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Lucky Numbers</title>\n</head>\n\
