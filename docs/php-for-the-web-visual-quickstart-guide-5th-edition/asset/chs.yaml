  \ 11.3**；请注意，尽管这看起来可能很奇怪，但并没有错误代码 5）。\n\n![Image](img/11tab03.jpg)\n\n### 表 11.3\
  \ 文件错误代码\n\n当上传文件时，服务器首先将其放置在临时目录中。然后，您应该使用 `move_uploaded_file()` 函数将文件移动到最终目标位置：\n\
  \n点击此处查看代码图片\n\n```\nmove_uploaded_file($_FILES ['picture']['tmp_name'], '/path/to/dest/filename');\n\
  ```\n\n第一个参数是服务器上的文件临时名称，位于 `$_FILES['input_name']['tmp_name']` 中。第二个参数是目标地的完整路径和名称。\n\
  \n为了让 PHP 能够执行这些步骤，您必须在 `php.ini` 文件中设置若干配置（参见“配置 PHP 以进行文件上传”侧边栏），并且 Web 服务器需要对临时目录和最终目标目录具有写入权限。（PHP\
  \ 默认应该具有临时目录的写入权限。）\n\n接下来，您将编写一个基础脚本来上传文件并将其存储在服务器上。与 `add_quote.php` 脚本一样，此示例同时也创建\
  \ HTML 表单 ![Image](img/c.jpg) 并处理它，所有操作都在一个页面中完成。不过，首先您将创建一个可写目录作为目标点。\n\n![Image](img/11fig17.jpg)\n\
  \n![Image](img/c.jpg) 此 HTML 表单允许用户选择其计算机上的文件并上传到服务器。\n\n#### 创建可写目录：\n\n1. 在 Web\
  \ 目录根目录之外创建一个名为 `uploads` 的新文件夹 ![Image](img/d.jpg)。\n\n![Image](img/11fig18.jpg)\n\
  \n![Image](img/d.jpg) 对于此示例，必须存在一个可写的 `uploads` 目录。在这里，它被放在与 Web 根文件夹相同的目录中。因此，`uploads`\
  \ 位于 `upload_file.php` 脚本所在目录之上，且无法通过 HTTP 访问。\n\n2. 使用本章第一节概述的步骤“文件权限”，设置权限以使每个人都能对该目录进行写入、读取和搜索（Unix\
  \ 术语为 0777）。\n\n***\n\n### 配置 PHP 以进行文件上传\n\n为了使文件上传正常工作，必须设置 `php.ini` 配置文件中的若干设置。这些设置在您的配置中可能启用也可能未启用，因此您应该通过查看\
  \ `php.ini` 文件或运行 `phpinfo()` 脚本来检查它们。\n\n首先，`file_uploads` 必须开启。其次，`upload_tmp_dir`\
  \ 的值必须设置为服务器上的某个目录，PHP 可以在其中放置文件（换句话说，该目录必须存在并允许 Web 服务器修改）。如果此设置没有值，可能没问题（这意味着将使用专门为此类目的而创建的隐藏目录）。\n\
  \n`upload_max_filesize` 和 `post_max_size` 设置规定了可以发送的大小，例如 512 KB 或 2 MB。虽然 `MAX_FILE_SIZE`\
  \ 隐藏表单输入是对浏览器的建议，但这两个设置控制了文件是否被上传。\n\n最后，如果上传非常大的文件（许多兆字节或更大），您可能需要增加 `memory_limit`\
  \ 和 `max_execution_time` 设置，以为 PHP 提供的时间和资源来完成任务。\n\n***\n\n再次，如果您运行的是 Windows，可能不需要做任何事情（尝试下一个脚本以确定）。如果您运行其他操作系统，请检查本章第一节中的项目列表，找到适用于您情况的建议。\n\
