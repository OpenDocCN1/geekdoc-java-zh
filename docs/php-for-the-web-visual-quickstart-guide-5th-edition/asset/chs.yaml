  \ 这封邮件是由 PHP 脚本在伪注册成功发送的。\n\n* *\n\n**提示**\n\n本章末尾的“回顾与追求”部分为你介绍了一个验证电子邮件地址的优秀工具，只要你使用的是\
  \ PHP 5.2 或更高版本。\n\n* *\n\n* *\n\n**提示**\n\nHTML5 电子邮件输入类型限制用户只能输入单个电子邮件地址，但这很容易被绕过。\n\
  \n* *\n\n* *\n\n**提示**\n\n在我的*PHP and MySQL for Dynamic Web Sites: Visual QuickPro\
  \ Guide》（Peachpit Press）以及我的在线论坛（[www.LarryUllman.com/forums/](http://www.LarryUllman.com/forums/)）中，我讨论了保护\
  \ PHP 脚本发送的电子邮件的其他方法。\n\n* *\n\n* *\n\n**提示**\n\n如果你在接收 PHP 发送的邮件遇到问题，请先确认邮件服务器在不涉及\
  \ PHP 的情况下是否独立工作。然后，确保你使用的是有效的 `from` 地址。最后，尝试使用不同的收件人地址，并留意垃圾邮件箱，确保消息没有被放入其中（如果适用）。\n\
  \n* *\n\n* *\n\n**提示**\n\n发送带附件的邮件或 HTML 电子邮件是，尽管这需要更复杂的代码（通常涉及类和对象）。幸运的是，许多程序员已经开发了可用的解决方案。请参见附录\
  \ B“资源和后续”，获取可能有所帮助的网站。\n\n* *\n\n* *\n\n**提示**\n\n`mail()` 函数返回一个值（1 或 0），表示其使用成功。该值仅指示\
  \ PHP 是否能够尝试发送电子邮件（通过使用现有的任何邮件系统）。目前没有简单的方法可以使用 PHP 来检查电子邮件地址是否有效，或者最终用户是否收到了消息。\n\
  \n* *\n\n* *\n\n**提示**\n\n要向多个地址发送邮件，可以使用 `CC` 参数，或者用逗号隔开每个 `TO` 地址。\n\n* *\n\n\
  * *\n\n**提示**\n\n为了在邮件正文中创建新行，可以跨多行创建消息，或者在双引号内使用换行符 `\\n`。\n\n* *\n\n* *\n\n**提示**\n\
  \n如果你想在发送 `From` 地址外再发送多个标头，请使用 `\\r\\n` 的组合将它们分隔：\n\n点击此处查看代码图像\n\n```php\nmail\
  \ ('email@example.com', 'Testing', $body, \"From: email@example.org\\r\\nBcc: hidden@example.net,\
  \ third@example.com\");\n```\n\n* *\n\n* *\n\n## 配置您的服务器发送电子邮件\n\n使用 PHP 发送电子邮件非常简单，只要你的\
  \ Web 服务器（或计算机）已设置好发送电子邮件。如果你使用网络托管服务或你自己的 Unix 计算机（如 Linux），这通常不是问题。如果你确实遇到问题，请联系托管公司寻求支持。\n\
  \n如果你正在运行自己的服务器（例如，如果你在本地开发），发送电子邮件的能力可能会成为障碍。如果你使用合一式安装程序，如 MAMP 或 XAMPP（参见附录 A），软件包中也包含一个邮件服务器。如果你在注册后没有收到邮件，请检查相关软件的文档，了解你可能需要做什么来启用它。\n\
  \n### 输出缓冲\n\n在这一章和下一章中，你使用的某些函数只有在没有发送任何内容的情况下才能调用。这些函数包括 `header()`、`setcookie()`\
  \ 和 `session_start()`。如果你在浏览器接收任何文本、HTML 甚至是空格后使用这些函数，将得到 dreaded“headers sent”（头部已发送）错误消息\
  \ ![Image](img/a.jpg)。\n\n![Image](img/08fig26.jpg)\n\n![Image](img/a.jpg) 如果在调用\
  \ header() 之前收到了任何 HTML，你将看到此错误。\n\n我建议初学者使用的一种解决方案是利用*输出缓冲*（也称为输出控制）。在普通的 PHP 脚本中，PHP\
  \ 标签之外的任何 HTML 都会立即发送。执行任何打印语句时也是如此。通过输出缓冲，HTML 和打印数据——即输出将被放入缓冲区（即内存）。在脚本结束时，缓冲区将发送到浏览器，或者如果合适，可以清除缓冲区而不发送。要开始输出缓冲，请在页面顶端调用\
  \ `ob_start()` 函数。一旦调用它，每个 print 和类似函数都将数据发送到缓冲区而不是浏览器。相反，HTTP 调用（如 `header()` 和\
  \ `setcookie()`）不会被缓冲，并将按常运行。为了更明确，它必须在任何打印语句或任何 HTML 发送到浏览器之前调用。\n\n\n\n\n\n从程序员的角度来看，输出缓冲允许你以更线性的形式组织脚本，而无需担心\
  \ HTTP 请求头。让我们重构 `header.html` 和 `footer.html`，让每个页面都使用输出缓冲。你现在可能还体会它的好处，但在本书的剩余部分中，你*不会看到*的错误数量将极大有助于保持你的编程理智。\n\
