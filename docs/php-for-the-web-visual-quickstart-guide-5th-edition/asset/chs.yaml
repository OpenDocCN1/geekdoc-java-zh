  \ 和 `password_verify()` 函数。\n\n# 12. 数据库简介\n\n* * *\n\n### 本章内容\n\n- SQL 简介\n- 连接到\
  \ MySQL\n- MySQL 错误处理\n- 创建表\n- 向数据库插入数据\n- 安全查询数据\n- 从数据库检索数据\n- 在数据库中删除数据\n- 在数据库中更新数据\n\
  - 回顾与后续\n\n* * *\n\n如果没有数据库的存在，互联网就不会是今天的样子。事实上，如果不是 PHP 内置支持许多类型的数据库，PHP 可能不会如此流行或实用。本章将使用\
  \ MySQL 作为示例数据库管理系统（DBMS）。虽然 MySQL（适用于大多数平台）可能没有顶级的商业数据库服务器那样强大，但它对于大多数用途来说已经足够的速度和功能。而且它的价格——对于大多数用途是免费的——使其成为网页开发的常用选择。\n\
  \n本章将介绍用于运行基础博客的简单数据库的开发。虽然你在这里学到的知识足够让你开始使用数据库，但在完成本章后，你可能想访问附录 B，“资源与后续(#app02.html_app02)”，寻找一些可以进一步学习该主题的参考资料。\n\
  \n### SQL 简介\n\n*数据库*是存储信息的表集合（由列和行组成）。大多数数据库的创建、更新和读取都是使用 SQL（结构化查询语言）完成的。SQL 的命令少得惊人（**表\
  \ 12.1** 列出了最重要的七个），这既是幸运也是诅咒。\n\n![Image](img/12tab01.jpg)\n\n**表 12.1 常用 SQL 命令**\n\
  \nSQL 的设计非常像英语，这使得它非常用户友好。但尽管仅凭少数可用术语创建更复杂的 SQL 语句需要花费一些思考，但 SQL 仍然非常强大。在本章中，你将学习如何执行所有的基础\
  \ SQL 命令。\n\n对于初学 PHP 的人来说，困惑可能源于 PHP 与 HTML 的关系（即 PHP 可生成 HTML，但 PHP 代码永远不会在浏览器中执行）。当你引入数据库时，这种关系可能会变得更加模糊。这个过程非常简单：使用\
  \ PHP 将 SQL 语句发送到数据库应用程序，并在那里执行它们。执行结果——创建表、插入记录、检索某些记录、甚至是错误——将由数据库返回给 PHP 脚本 ![Image](img/a.jpg)。\n\
  \n![Image](img/12fig01.jpg)\n\n![Image](img/a.jpg) PHP 将用于向 MySQL 发送 SQL 语句。MySQL\
  \ 将执行该语句并将结果返回给 PHP 脚本。\n\n考虑到这一点，PHP 的 `mysqli_query()` 函数将是本中最常用的工具。它向 MySQL 发送\
  \ SQL 命令：\n\n点击此处查看代码图像\n\n```\n$result = mysqli_query(database connection, SQL\
  \ command);\n```\n\n* * *\n\n## PHP 对 MySQL 的支持\n\n必须在 PHP 中内置对 MySQL 数据库的支持，以便使用\
  \ PHP 特有的 MySQL 函数。对于大多数 PHP 安装，这应该是已经实现的。你可以通过调用 `phpinfo()` 函数来确认对 MySQL 的支持。\n\
  \n在学习本章时，如果你看到类似 *undefined function mysqli_** 的错误消息，这意味着你使用的 PHP 版本不支持 MySQL（或者你拼错了名称）。\n\
  \n启用对 MySQL 的支持需要一些努力，但如果你对服务器拥有管理级权限，就可以完成。欲需更多信息，请参阅 PHP 手册。\n\n* * *\n\n\n\n\n\
  \n当你在第 11 章的“文件和目录”中处理文本文件时，你会发现像 `fwrite()` 和 `fgets()` 这样的函数需要你先使用 `fopen()` 创建一个文件指针。该指针随后作为对该已打开文件的引用。在处理数据库时，你也会使用类似的过程。首先，你必须与数据库服务器（在此例中\
  \ MySQL）建立连接。该连接将作为后续任何命令的访问点。连接数据库的语法如下：\n\n点击此处查看代码图像\n\n```php\n$dbc = mysqli_connect(hostname,\
  \ username, password, database_name);\n```\n\n数据库连接——在本例中分配给 `$dbc`——通常使用至少四个参数建立：主机名（几乎总是\
  \ `localhost`）；用户名；该用户名的密码；以及数据库名称。\n\n如果你通过托管公司使用数据库，该公司公司很可能会向你提供所有这些值。如果你在自己的电脑上运行\
  \ MySQL，请参阅附录 A 以学习在继续之前如何创建用户和数据库。\n\n一旦完成对数据库的操作，你可以关闭连接，就像关闭已打开的文件一样：\n\n```php\n\
  mysqli_close($dbc);\n```\n\nPHP 脚本在终止时会自动关闭数据库连接，但在连接不再需要时正式关闭它被认为是一种良好的良好的编程习惯。\n\
  \n对于本章的第一个示例，你将编写一个简单的脚本来尝试连接到 MySQL 数据库。一旦该连接可用，你就可以继续学习本章的其余内容。再次强调，执行此示例之前，你需要已经知道正确的主机名、用户名、密码和数据库值。而且该数据库必须已经创建完毕！\n\
  \n### 如何连接到 MySQL 数据库：\n\n**1.** 在你的文本编辑器或 IDE 中新建 PHP 文档，命名为 `mysqli_connect.php`（**脚本\
  \ 12.1**）：\n\n点击此处查看代码图像\n\n```html\n<!doctype html>\n<html lang=\"en\">\n<head>\n\
  \  <meta charset=\"utf-8\">\n  <title>Connect to MySQL</title>\n</head>\n<body>\n\
  **脚本 12.1** 能够连接到 MySQL 数据库是最重要的一步。此脚本测试了该过程。\n```\n\n点击此处查看代码图像\n\n* * *\n\n```php\n\
  1   <!doctype html\n2   <html lang=\"en\">\n3   <head>\n4       <meta charset=\"\
  utf-8\">\n5       <title>Connect to MySQL</title>\n6   </head>\n7   <<body>\n8 \
  \  <?php // Script 12.1 - mysqli_connect.\n9     php\n10   /* This script connects\
  \ to the MySQL\n11     database. */\n12\n13   // Attempt to connect to MySQL and\
  \ print\n14     out messages:\n15   if ($dbc = mysqli_connect('localhost', 'username',\n\
  16   'password', 'myblog')) {\n17\n18     print '<p>Successfully connected to\n\
  19       the database!</p>';\n20\n21     mysqli_close($dbc); // Close the\n22  \
  \     connection.\n23\n24   } else {\n25\n26     print '<p style=\"color: red;\"\
  >Could\n27       not connect to the database.</p>';\n28\n29   }\n30\n31   ?>\n32\
  \ </body>\n33 </html>\n```\n* * *\n\n**2.** 启动 PHP 代码段：\n\n点击此处查看代码图像\n\n```php\n\
  <?php // Script 12.1 - mysqli_connect.php\n```\n\n**3.** 连接到 MySQL 并报告结果：\n\n点击此处查看代码图像\n\
  \n```php\nif ($dbc = mysqli_connect('localhost', 'username', 'password', 'myblog'))\
  \ {\n  print '<p>Successfully connected to the database!</p>';\n  mysqli_close($dbc);\n\
  } else {\n  print '<p style=\"color:red;\"> Could not connect to the database.</p>';\n\
  }\n```\n\n通过将连接尝试作为 `if-else` 语句中的条件，你可以轻松地报告连接是否成功。\n\n\n\n\n\n![Image](img/squf.jpg)\
  \ 数据未插入到表中\n\n经验会告诉你为什么这些错误通常会发生，但在运行脚本时能立即看到问题所在，可以为你节省大量的调试时间。为了让你的脚本对发生的错误提供具有信息量的报告，请使用\
  \ `mysqli_error()` 函数。该函数返回 MySQL 服务器返回的错误的文本版本。它需要提供数据库连接：在本章中标识为 `$dbc`：\n\n```php\n\
  print mysqli_error($dbc);\n```\n\n然而，连接错误略有不同。要报告这些错误，请调用 `mysqli_connect_error()`。该函数不接受任何参数：\n\
  \n```php\nprint mysqli_connect_error();\n```\n\n除了这些函数之外，你可能还想使用一些 PHP 工具来处理错误。对于初，你可以从错误抑制符\
  \ `@` 开始。当在函数名前之前使用时，它会抑制该函数可能触发任何错误消息或警告：\n\n```php\n@function_name();\n```\n\n\
  ***\n\n## 数据库权限\n\n数据库权限比文件权限稍微复杂一点，但你需要理解这一点：不同类型的用户可以分配不同的数据库权限。例如，一个 DBMS 用户可能能够创建新数据库并删除现有数据库（你的\
  \ DBMS 中可能有几十个数据库），但低层级的用户可能只能在单个数据库内创建和修改表。最基础的用户可能只能读取而不能修改表。\n\n如果你正在使用 PHP 和\
  \ MySQL 运行一个托管网站，托管公司很可能会给你提供第二种访问权限——对单个数据库的控制权，但对 DBMS 本身没有控制权——并为你建立初始数据库。如果你在自己的自己的服务器上工作或拥有管理员权限，你应该具备创建新用户和数据库的能力。\n\
  \n***\n\n注意，这个操作符并不会阻止错误的发生；它只是防止消息被立即显示。当你打算自己处理错误（如果发生的话）时，你会使用它。这是一个重要的点：错误仍然会发生，所以只有当你通过其他方式处理错误时，才使用错误抑制符。\n\
  \n要使用错误处理：\n\n1. 在你的文本编辑器或 IDE 中打开 `mysqli_connect.php` (脚本 12.1)。\n2. 通过如下方式更改\
  \ `if` 条件，抑制由 `mysqli_connect()` 函数创建的任何 PHP 错误（**脚本 12.2**）：\n\n点击此处查看代码图像\n\n\
  ```php\nif ($dbc = @mysqli_connect ('localhost', 'username', 'password', 'myblog'))\
  \ {\n```\n\n**脚本 12.2** 通过向脚本添加错误控制（`@` 符号和 `mysqli_error()` 函数），你可以更有针对性地解决发生的问题。\n\
  \n点击此处查看代码图像\n\n***\n\n```html\n1   <!doctype html>\n2   <html lang=\"en\">\n3 \
  \  <head>\n4       <meta charset=\"utf-8\">\n5       <title>Connect to MySQL</title>\n\
  6   </head>\n7   <body\n8   <?php // Script 12.2 - mysqli_connect.\n9     php #2\n\
  10    /* This script connects to the MySQL\n11    database. */\n12\n13    // Attempt\
  \ to connect to MySQL and print\n14    out messages:\n15    if ($dbc = @mysqli_connect('localhost',\
  \ 'username',\n16    'password', 'myblog')) {\n17\n18      print '<p>Successfully\
  \ connected to\n19      the database!</p>';\n20\n21      mysqli_close($dbc); //\
  \ Close the\n22      connection.\n23\n24    } else {\n25\n26      print '<p style=\"\
  color:\n27      red;\">Could not connect to the\n28      database:<br>' . mysqli_connect_error()\
  \ . '.</p>';\n29\n30    }\n31\n32  ?>\n33  </body>\n34  </html>\n```\n\n***\n\n\
  与其让 PHP 在 `mysqli_connect()` 函数像上一节中那样失效（![Image](img/Image 在“连接到 MySQL”）时打印出错误消息，在这里将使用\
  \ `@` 符号抑制该消息。错误仍然发生，但它们将通过下一步所做的更改来处理。\n\n**3.** 在 else 部分的 print 语句中添加 `mysqli_error()`\
  \ 函数：\n\n点击此处查看代码图像\n\n```php\nprint '<p style=\"color:red;\">Could not connect\
  \ to the database:<br>' . mysqli_connect_error() . '</p>';\n```\n\n在 else 部分的 print\
  \ 语句中添加 `mysqli_error()` 函数：\n\n```php\nif ($dbc = @mysqli_connect ('localhost',\
  \ 'username', 'password', 'myblog')) {\n    // ...\n} else {\n    print '<p style=\"\
  color:red;\">Could not connect to the database:<br>' . mysqli_connect_error() .\
  \ '</p>';\n}\n```\n\n4. 保存文件并测试它 ![Image](img/squf.jpg) 数据未插入到表中\n\n\n\n\n你可以访问\
  \ MySQL 网站获取有关 SQL、列定义和字符集的更多信息。不过，通过遵循本节的指示，你应该能够完成一些基本的数据库任务。在本示例中创建的表由表 12.2\
  \ 所示。\n\n![Image](img/12tab_01.jpg)\n\n#### 表 12.2 ENTRIES 表\n\n在本示例中，你将创建一个用于存储通过\
  \ HTML 表单提交信息的数据库表。在章的下一节中，你将编写脚本，将提交的数据插入到此处创建的表中。\n\n使用 PHP 创建表，你需要使用 `mysqli_query()`\
  \ 函数来执行 `CREATE TABLE` SQL 命令：\n\n点击此处查看代码图像\n\n```\nmysqli_query($dbc, 'CREATE\
  \ TABLE entries...');\n```\n\n或者，你也可以通过其他界面执行相同的 SQL 命令，例如命令行 MySQL 客户端或基于 Web 的\
  \ phpMyAdmin。\n\n要创建一个新表：\n\n1. 在你的文本编辑器或 IDE 中开始一个新的 PHP 文档，命名为 `create_table.php`\
  \ (脚本 12.3)：\n\n点击此处查看代码图像\n\n```html\n<!doctype html>\n<html lang=\"en\">\n<head>\n\
  \  <meta charset=\"utf-8\">\n  <title>Create a Table</title>\n</head>\n<body>\n\
