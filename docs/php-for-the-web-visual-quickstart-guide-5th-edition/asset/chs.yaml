  \n***\n\n### 提示\n正如你一定会注意到的，计算器得出的数字与真实的美元金额并不对应（参见 ![Image](img/ash_b.jpg) 和 ![Image](img/ash_c.jpg)）。在下一节“\
  \ 格式化数字”中，你将学习如何解决这个问题。\n\n***\n\n***\n\n### 提示\n如果你想打印税前或折扣前（或两者都）的总金额，可以通过两种方式实现。你可以在确定了正确的值之后、\
  \ `$total` 变量再次更改之前，立即插入相应的打印语句。或者，你可以使用新变量来表示后续计算的值（例如`$total_with_tax` 和 `$total_less_discount`）。\n\
  \n***\n\n***\n\n### 提示\n尝试打印美元符号后跟变量的值，例如 `$10`（其中 10 来自一个变量），必须小心处理。你不能使用 `$$variable`\
  \ 语法，因为两个美元符号的组合创建的变量类型过于复杂，无法在本书中讨论。一种解决方案是在美元符号和变量名之间放置某些内容——一个空格或 HTML 标签，如示例所示。另一种选项是转义第一个美元符号：\n\
  \n点击此处查看代码图片\n\n```php\nprint \"The total is \\$$total\";\n```\n\n第三种选项是使用字符串拼接，这将在下一章中介绍。\n\
  \n***\n\n***\n\n### 提示\n此脚本的运行取决于各个字段是否被提交。唯一真正成问题的字段是每月付款期数：如果遗漏了该项，你将看到除以零的警告。\
  \ 第 6 章，“ 控制结构”将涵盖在使用表单数据之前对其进行验证。\n\n***\n\n### 格式化数字\n\n虽然计算器正趋于实用，但它仍然有一个正当的问题：你不能要求某人支付\
  \ $10.13183333！为了创建更实用的数字，你需要对它们进行格式化。\n\n有两个函数适用于此目的。第一个函数 `round()` 将值舍入到指定的小位数。该函数的第一个参数是需要舍入的数字。这可以是数字，也可以是具有数值结果的变量。第二个参数是可选的；它代表要舍入的小位数。如果省略，数字将被舍入到最近的整数。例如：\n\
  \n```php\nround(4.30); // 4\nround(4.289, 2); // 4.29\n$num = 236.26985;\nround($num);\
  \ // 236\n```\n\n在这种情况下，你可以使用的另一个函数是 `number_format()`。它的工作方式与 `round()` 类似，接收一个数字（或具有数值的变量）和一个可选的小数位指定符。该函数的额外好处是用逗号对数字进行格式化，就像通常写法一样：\n\
  \n点击此处查看代码图片\n\n```php\nnumber_format(428.4959, 2); // 428.50\nnumber_format(428,\
  \ 2); // 428.00\nnumber_format(1234567); // 1,234,567\n```\n\n让我们重写 PHP 脚本以适当地格式化数字。\n\
  \n要格式化数字：\n\n1. 在你的文本编辑器或 IDE 中打开 `handle_calc.php`，如果它尚未打开（脚本 4.2）。\n\n2. 在所有计算之后、打印语句之前，添加以下内容（**脚本\
  \ 4.3**）：\n\n点击此处查看代码图片\n\n```php\n$total = number_format($total, 2);\n$monthly\
  \ = number_format ($monthly, 2);\n```\n\n脚本 4.3 `number_format()` 函数被应用于两个变量的值上，因此它们更适合此示例。点击此处查看代码图片\n\
  \n```html\n<!doctype html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"utf-8\"\
  >\n    <title>产品计算器</title>\n    <style type=\"text/css\">\n        .number { font-weight:\
  \ bold;}\n    </style>\n</head>\n<body>\n<?php // 脚本 4.3 - handle_calc.php\n/* 此脚本从\
  \ calculator.html 获取值并执行总成本和每月付款的计算。 */\n\n// 如果需要，处理地址。\n\n// 从 $_POST 数组中获取值：\n\
  $price = $_POST['price'];\n$quantity = $_POST['quantity'];\n$discount = $_POST['discount'];\n\
  $tax = $_POST['tax'];\n$shipping = $_POST['shipping'];\n$payments = $_POST['payments'];\n\
  \n// 计算总额：\n$total = $price * $quantity;\n$total = $total + $shipping;\n$total =\
  \ $total - $discount;\n\n// 确定税率：\n$taxrate = $tax/100;\n$taxrate = $taxrate + 1;\n\
  \n// 计入税率：\n$total = $total * $taxrate;\n\n// 计算每月付款：\n$monthly = $total / $payments;\n\
  \n// 应用正确的格式化：\n$total = number_format($total, 2);\n$monthly = number_format($monthly,\
  \ 2);\n\n// 打印结果：\nprint \"<p>您选择了购买 <span class=\\\"number\\\">$quantity</span>\
  \ 件产品，单价为 <span class=\\\"number\\\">$price</span>，加上 <span class=\\\"number\\\"\
  >$shipping</span> 运费和 <span class=\\\"number\\\">$tax</span>% 的税率。在您的 <span class=\\\
  \"number\\\">$discount</span> 折扣后，总成本为 <span class=\\\"number\\\">$total</span>。分摊到\
  \ <span class=\\\"number\\\">$payments</span> 期付款，每月金额为 <span class=\\\"number\\\
  \">$monthly</span>。</p>\";\n?>\n</body>\n</html>\n```\n\n\n\n\n在 PHP 中，函数名与其括号之间可以有空格，也可以没有。这两种方式都是可以的：\n\
  \n```php\nround ($num);\nround($num);\n```\n\n### 提示\n`number_format()` 函数接受另外两个可选参数，允许你指定使用什么字符来表示小数点和千分位分隔符。这非常有用，例如，对于那些将\
  \ 1,000.89 写为 1.000,89 的文化。如果你想使用此选项，请参阅 PHP 手册获取正确的语法。\n\n### 理解优先级\n\n不可避免的是，在讨论了各种类型的数学运算符后，将会讨论优先级。`Precedence`（优先级）指的是一系列计算执行的顺序。例如，以下变量的值是多少是多少？\n\
  \n```php\n$number = 10 – 4 / 2;\n```\n\n`$number` 的值是 3（10 减 4 等于 6，除以 2 等于 3）还是\
  \ 8（4 除以 2 等于 2，从 10 中减去等于 8）？答案是 8，因为除法的优先级高于减法。\n\n附录 B，“资源和后续步骤”显示了 PHP 运算符优先级的完整列表（包括尚未涵盖的运算符）。然而，你不需要尝试背诵一个包含特殊字符的大表格，通过使用括号可以跳过任何思考。括号的优先级总是高于任何其他运算符。因此：\n\
  \n```php\n$number = (10 – 4) / 2; // 3\n$number = 10 – (4 / 2); // 8\n```\n\n在计算中使用括号可以确保你永远不会因为优先级问题而看到奇怪的结果。括号还可以用于用更少的代码行来重写复杂的计算。让我们重写\
  \ `handle_calc.php` 脚本，通过使用括号将多行合并为一行，同时保持准确性。\n\n要管理优先级：\n\n1. 在你的文本编辑器或 IDE 中打开\
  \ `handle_calc.php`，如果它尚未打开（请参考 脚本 4.3）。\n2. 将最初计算订单总的三行替换为以下内容（**脚本 4.4**）：\n\n\
  点击此处查看代码图像\n\n```php\n$total = (($price * $quantity) + $shipping) - $discount;\n\
  ```\n\n**脚本 4.4** 通过使用括号，可以压缩多行的计算（对比 脚本 4.3），而不会影响脚本的数学准确性。\n\n点击此处查看代码图像\n\n```html\n\
