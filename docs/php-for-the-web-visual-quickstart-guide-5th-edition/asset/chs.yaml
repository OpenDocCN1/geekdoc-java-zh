  \ 如果电子邮件地址或密码与脚本中的信息不匹配，用户将看到此错误消息。\n\n### 提示\n这种检查隐藏输入是否存在的技巧可能会让人困惑。它之所以有效，是因为用户会两次访问同一个脚本——`login.php`。第一次访问时表单尚未提交，因此检查\
  \ `$_POST['submitted']` 是否设置的条件判断为 FALSE，并显示表单。然后，在用户点击提交后会再次访问页面，此时该条件将变为 TRUE。\n\
  \n提示\n如果你想让页面处理表单并立即再次显示该表单，请使用以下代码：\n\n点击此处查看代码图片\n\n```php\nif ($_SERVER['REQUEST_METHOD']\
  \ == 'POST') {\n  // Handle the form.\n}\n// Display the form.\n```\n\n### 使持久化表单（Sticky\
  \ Forms）\n*持久化*表单会记住输入到其中的值。一个常见的例子是搜索引擎，它即使在显示搜索结果时，通常也会在搜索框中显示你的搜索词。你可能也需要在用户未能准确完成表单并因此必须重新提交的情况下使用持久化表单\
  \ ![Image](img/a.jpg)。\n\n![Image](img/08fig20.jpg)\n\n![Image](img/a.jpg) 创建持久化表单让用户更容易纠正不完整表单提交中的遗漏信息。\n\
  \n从技术角度来看，持久化表单的工作原理是预设其表单元素的值。你可以通过设置文本输入框 `value` 属性来实现这一点：\n\n点击此处查看代码图片\n\n\
  ```html\n<input type=\"text\" name=\"first_name\" value=\"Stephanie\">\n```\n\n\
  若要让 PHP 预设该值，请在引号之间打印相应的变量：\n\n点击此处查看代码图片\n\n```html\n<input type=\"text\" name=\"\
  first_name\" value=\"<?php print $_POST['first_name']; ?>\">\n```\n\n表单第一次运行时，PHP\
  \ 代码不会打印任何内容（因为变量没有值）。如果表单在提交后再次显示，用户最初在表单输入中输入的值将自动显示在那里。这就是基本思想，但一个更专业的实现会处理两个问题。\n\
  \n首先，最好不要引用不存在的变量。这样做会产生 PHP 警告，而且由于 PHP 代码被埋在表单元素的属性中，警告本身只有在 HTML 源代码中才能完全可见 ![Image](img/b.jpg)。为了避免这种情况，请在打印之前检查该变量是否已设置：\n\
  \n点击此处查看代码图片\n\n```html\n<input type=\"text\" name=\"first_name\" value=\"<?php\
  \ if (isset($_POST ['first_name'])) { print $_POST ['first_name']; } ?>\">\n```\n\
  \n![Image](img/08fig21.jpg)\n\n![Image](img/b.jpg) 页面的 HTML 源代码显示了由于引用不存在的变量而引起的\
  \ PHP 错误。\n\n其次，提交值中的某些字符如果作为表单元素的值打印将会导致问题。为了防止此类问题，请应用 `htmlspecialchars()` 函数（在第\
  \ 5 章 中的“使用字符串”中讨论过）。考虑到这一点，此代码较长但更好的版本如下：\n\n点击此处查看代码图片\n\n```html\n<input type=\"\
  text\" name=\"first_name\" value=\"<?php if (isset($_POST ['first_name'])) { print\
  \ htmlspecialchars($_POST ['first_name']); } ?>\">\n```\n\n为了演示这一概念，你将创建一个注册表单的框架\
  \ ![Image](img/c.jpg)。\n\n![Image](img/08fig22.jpg)\n\n![Image](img/c.jpg) 用户首次看到的注册表单。\n\
