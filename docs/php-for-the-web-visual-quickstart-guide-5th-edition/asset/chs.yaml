  \n点击此处查看代码图片\n\nFirst Name：<input type=\"text\" name=\"first_name\" size=\"20\"\
  \ value=\"<?php if (isset ($_POST ['first_name'])) { print htmlspecialchars ($_POST\
  \ ['first_name']); } ?>\">\n\n由于许多表单（例如来自 `register.php` 的表单）...（此处原文不完整）\n\n\n\n\
  \n点击此处查看代码图像\n\n```php\nprint '<p><label>' . $label . ': ';\n```\n\n此函数生成的代码基本上与所示的相同（在第\
  \ 8 章 中），但它会被封装在`<p>` 标签中，并且输入的标签将正式地放置在`<label>` 标签内。当调用该函数时，标签的值（例如，*First Name*）将传递给该函数。\n\
  \n### 5. 开始文本输入：\n\n点击此处查看代码图像\n\n```php\nprint '<input type=\"text\" name=\"' .\
  \ $name . '\" size=\"20\" ';\n```\n\nPHP `print` 语句只是创建了 HTML `input` 标签，但标签的 `name`\
  \ 属性值将来自 `$name` 变量。当调用函数时，该变量会被赋予一个值，例如 *first_name*。\n\n### 6. 如果适用，添加输入的预设值：\n\
