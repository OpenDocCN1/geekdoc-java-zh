  ***\n\n**提示**\n你可以定义任意数量的函数，而不像本章示例所示的那样每个脚本只定义。\n\n***\n\n**提示**\n函数对其可以接受的参数数量没有限制。\n\
  \n***\n\n**提示**\n一旦你定义了这样的自己的函数，你可以将它们放置在外部文件中，并在需要访问这些函数时 `require` 该文件。\n\n***\n\
  \n### 设置默认参数值\n\nPHP 允许函数具有*默认参数值*：只需在函数定义中为参数赋值值即可：\n\n点击此处查看代码图像\n\n```php\nfunction\
  \ greeting($who = 'world') {\n  print \"Hello, $who!\";\n}\n```\n\n除非接收到覆盖它的值，否则该函数将使用默认值。换句话说，通过为参数设置默认值，你在调用函数时使该参数变为可选的：\n\
  \n```php\ngreeting(); // 输出：Hello, world!\ngreeting('Zoe'); // 输出：Hello, Zoe!\n\
  ```\n\n\n\n\n\n```php\n$name . '\" size=\"' . $size . '\" ';\n\n// 添加值：\nif (isset($_POST[$name]))\
  \ {\n    print ' value=\"' .\n    htmlspecialchars($_POST[$name]) . '\"';\n}\n\n\
  // 完成输入框、标签和段落：\nprint '></label></p>';\n\n} // make_text_input() 函数的结束。\n\n// 创建表单：\n\
  print '<form action=\"\" method=\"post\">';\n\n// 创建一些文本输入框：\nmake_text_input('first_name',\
  \ 'First Name');\nmake_text_input('last_name', 'Last Name', 30);\nmake_text_input('email',\
  \ 'Email Address', 50);\n\nprint '<input type=\"submit\" name=\"submit\" value=\"\
  Register!\"></form>';\n\n?>\n</</body>\n</</html>\n```\n\n虽然我喜欢所有文本输入框大小一致的整洁感，但人的姓氏和电子邮件地址通常比名字长，因此使用可调整的大小会更好。通过将输入的尺寸作为参数传递，可以实现这一点。但该尺寸将有一个默认值，使其成为一个可选参数。如果向函数发送了三个参数，那么\
  \ `$size` 将设置为第三个值而不是默认值。\n\n### 3. 修改输入的创建方式以使用 `$size` 变量：\n\n点击此处查看代码图片\n\n```php\n\
  print '<input type=\"text\" name=\"' . $name . '\" size=\"' . $size . '\" ';\n```\n\
  \n### 4. 修改函数调用以改变不同的尺寸：\n\n点击此处查看代码图片\n\n```php\nmake_text_input('first_name',\
