  \ 中都添加验证条件，在在使用提交的表单值之前对其检查。\n\n## 8. 创建 Web \n\n### 本章内容\n- 创建模板\n- 使用外部文件\n- 使用常量\n\
  - 处理日期和时间\n- 重新使用 PHP 处理 HTML 表单\n- 让表单持久化\n- 发送电子邮件\n- 输出缓冲\n- 操作 HTTP 头部\n- 复习与进\n\
  \n到目前，本书已经涵盖了 PHP 编程的基础；现在是时候将它们整合到实际的 Web 中了。在本章中，你将学习许多让你的网站更加专业、功能更丰富且更容易维护的函数和技巧。\n\
  \n首先，将学习如何使用外部文件将页面拆分为各个部分，允许你将逻辑与呈现分离。然后你将研究常量，这是 PHP 中的特殊数据类型。之后，你将接触 PHP 内置的一些与日期和时间相关的函数。\n\
  \n本章有两个主题讨论技巧而非函数：让同一个页面既显示又处理 HTML 表单，以及让表单记住用户提交的值。之后，你将看到从 PHP 发送电子邮件是多么简单。本章以稍为高级的主题输出缓冲和\
  \ HTTP 头部结束。\n\n### 创建模板\n到为止，每个示例都是一个处理 HTML 表单、排序数组、执行计算等的单页脚本。当你开始开发多页面网站（即 Web\
  \ 应用程序）时，在多个页面上重复共同元素很快就会变得不切实际。\n\n在更复杂的网站上，许多功能（如 HTML 设计）将在网站内的每个（或几乎每个）页面中使用。你可以将这些元素放入每个页面中，但当你需要进行更改时，你将不得不反复进行该更改。通过创建模板将重复内容与页面分离，可以节省时间。例如，一个网站可能在多个页面上使用导航、版权和其他功能![Image](img/a.jpg)\
  \ 和 ![Image](img/b.jpg)。本书第五版的首页在右侧列![Image](img/08fig.jpg) 使用了这些元素，这些模板。\n\n当你刚开始进行\
  \ Web 开发时，创建和使用模板可能会令人生畏。关键是从一个基础原型开始，就像你创建一个静态网页一样，然后将其拆分为可重用的部分。通过在本节介绍的 PHP 函数，你可以轻松地在每个页面中包含这些重复部分，而新内容是逐页生成的。\n\
  \n为了创建本章示例使用的模板，让我们从原型开始。此示例的布局使用 Concise CSS 框架 (`concisss.com`) 创建的。Concise CSS\
  \ 是许多框架之一，它让非设计师也能轻松创建精美且响应式的网页![Image](img/08fig3.jpg)。本章示例的设计是一个静态 HTML 页面。\n\n\
  创建布局模型：\n**1.** 在你的文本编辑器或 IDE 中开始一个新的 HTML 文档，命名为 `template.html` (脚本 8.1)：\n\n\
  ```html\n<!doctype html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta http-equiv=\"\
  UA-Compatible\" content=\"IE=edge,chrome\">\n  <meta name=\"viewport\" content=\"\
  width=device-width, initial-scale=1.0\">\n  <meta name=\"HandheldFriendly\" content=\"\
  True\">\n  <title>Raise the Roof Beam!</title>\n  <link rel=\"stylesheet\" type=\"\
  text/css\" href=\"css/concise.min.css\" />\n  <link rel=\"stylesheet\" type=\"text/css\"\
  \ href=\"css/masthead.css\" />\n</head>\n<body>\n  <header class=\"siteHeader\"\
  >\n    <div row>\n      <h1 column=\"4\" class=\"logo\"><a href=\"index.php\">Raise\
  \ High the Roof Beam!</a>\n      <nav column=\"8\" class=\"nav\">\n        <ul>\n\
  \          <li><a href=\"books.php\">Books</a></li>\n```\n\n脚本 8.1 代表了每个页面应该具有的基础外观。\n\
  \n\n\n\n\n开发任何模板系统的第一步都是创建一个模型文档——即基础页面样子的示例。一旦创建了这个文档，你就可以将其拆分为各个部分。此模板从 Concise\
  \ CSS Framework 推荐的标签开始。\n\n### 2. 添加 CSS 代码\n```html\n<link rel=\"stylesheet\"\
  \ type=\"text/css\" media=\"screen\" href=\"css/concise.min.css\" />\n<link rel=\"\
  stylesheet\" type=\"text/css\" media=\"screen\" href=\"css/masthead.css\" />\n```\n\
  此示例使用 CSS 进行格式和布局控制。CSS 本身存储在外部文件中，通过 `link` 标签引入页面。这些文件是 `concise.min.css` 和 `masthead.css`，存储在名为\
  \ `css` 的文件夹中。注意，你需要从相应的网站（`www.laracasts.com`）下载 CSS 文件。你可以在下载的代码中找到它们。\n\n###\
  \ 3. 关闭 HTML head，并开始 body\n```html\n</head>\n<body>\n```\n\n### 4. 创建页面页眉\n```html\n\
  <header class=\"siteHeader\">\n  <div>\n    <h1 class=\"logo\"><a href=\"index.php\"\
  >Raise High the Roof!</a></h1>\n    <nav class=\"8\" class=\"nav\">\n      <ul>\n\
  \        <li><a href=\"books.php\">Books</a></li>\n        <li><a href=\"#\">Stories</a></li>\n\
  \        <li><a href=\"#\">Quotes</a></li>\n        <li><a href=\"login.php\">Login</a></li>\n\
  \        <li><a href=\"register.php\">Register</a></li>\n      </ul>\n    </nav>\n\
  \  </div>\n</header>\n```\n`header` 区域（在 CSS 代码中也有定义）创建了横幅以及指向 Web 应用程序其他页面的主导航链接。特定链接引用\
  \ PHP 脚本，这些脚本都将在本章中开发。\n\n### 5. 开始并标记页面特定内容的开始\n```html\n<main class=\"siteContent\"\
  >\n<!-- BEGIN CHANGEABLE CONTENT. -->\n```\n直到此注释之前的所有内容对于 Web 应用程序中的每个页面都将保持不变。为了指示页面特定内容的开始（为了你自己的方便），请包含一个\
  \ HTML 注释。在做选择时，宁可对你的 HTML 和 PHP 代码进行过度注释！在注释正之前，`siteContent` 区域开始。该区域在 CSS 代码中定义，并正确格式化了页面的主体内容部分。换句话说，在每个页面，该页面的内容将位于类名为\
  \ `siteContent` 的 `main` 标签内。\n\n### 6. 创建页面内容\n```html\n<h2>Welcome to a J.D. Salinger\
  \ Fan Club</h2>\n<p>Lorem ipsum dolor sit amet...</p>\n```\n对于原型而言，内容只是一个标题和大量的文本（实际脚本中的内容比我在此步包含的要多）。\n\
  \n### 7. 标记可变内容的结束\n```html\n<!-- END CHANGEABLE CONTENT. -->\n</div>\n```\n步骤 6\
  \ 中的代码是唯一随页面变化的文本。正如 HTML 注释指示该部分的开始位置一样，这里的注释指示了它的结束位置。\n\n### 8. 添加页脚\n```html\n\
  <footer class=\"siteFooter\">\n  <p>Design uses <a href=\"http://concisecss.com/\"\
  >Concise CSS Framework</a></p>\n</footer>\n```\n页脚包含版权信息。\n\n### 9. 完成 HTML 页面\n\
  ```html\n</body>\n</html>\n```\n\n### 10. 将文件保存为 template.html 并在浏览器中测试。\n一旦你完成了一个你满意的原型，就可以将其拆分为各个部分以生成模板系统。\n\
  \n#### 创建页眉文件：\n1. 在文本编辑器或 IDE 中打开 `template.html`（`Script 8.1`），如果它尚未打开。\n2. 选择从初始\
  \ HTML 代码到 `<!-- BEGIN CHANGEABLE CONTENT -->` HTML 注释的所有内容。\n3. 使用编辑菜单或键盘快捷键（Windows\
  \ 上的 Ctrl+C，Mac 上的 Command+C）复制此代码。\n4. 在文本编辑器或 IDE 中创建一个新的空白文档，命名为 `header.html`。\n\
  5. 将复制的文本粘贴到文档中（`Script 8.2`）。这是一个页眉文件，用于创建 HTML head、包含 CSS 文件并开始 body。\n\n```html\n\
  <!doctype html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta http-equiv=\"\
  X-UA-Compatible\" content=\"IE=edge\">\n  <meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1.0\">\n  <meta name=\"headerFriendly\" content=\"True\">\n  <title>Raise\
  \ High the Roof!</title>\n  <link rel=\"stylesheet\" type=\"text/css\" media=\"\
  screen\" href=\"css/concise.min.css\" />\n  <link rel=\"stylesheet\" type=\"text/css\"\
  \ media=\"screen\" href=\"css/masthead.css\" />\n</head>\n<body>\n  <header class=\"\
  siteHeader\">\n    <div>\n      <h1 class=\"logo\"><a href=\"index.php\">Raise High\
  \ the Roof!</a></h1>\n      <nav class=\"8\" class=\"nav\">\n        <ul>\n    \
  \      <li><a href=\"books.php\">Books</a></li>\n          <li><a href=\"#\">Stories</a></li>\n\
  \          <li><a href=\"#\">Quotes</a></li>\n          <li><a href=\"login.php\"\
  >Login</a></li>\n          <li><a href=\"register.php\">Register</a></li>\n    \
  \    </ul>\n      </nav>\n    </div>\n  </header>\n  <main class=\"siteContent\"\
  >\n<!-- BEGIN CHANGEABLE CONTENT. -->\n```\n\n\n\n\n\n既然头部文件已经创建，你将使用相同的流程创建页脚文件。\n\
  \n要创建页脚文件：\n\n1. 在你的文本编辑器或 IDE 中打开 `template.html`（脚本 8.1），如果它还没有打开的话。\n2. 从 `<!--\
  \ END CHANGEABLE CONTENT -->` HTML 注释到脚本末尾选择所有 ![Image](img/e.jpg)。\n\n![Image](img/08fig05.jpg)\n\
  \n![Image](img/e.jpg) 再次使用原型文件，选择并复制页脚的结束代码。\n3. 复制这段代码。\n4. 在你的文本编辑器中创建一个新的空白文档，命名为\
  \ `footer.html`。\n5. 将复制的文本粘贴到文档中（**脚本 8.3**）。\n\n### 脚本 8.3\n这是一个基础页脚文件，用于结束 HTML\
  \ 页面。\n\n点击此处查看代码图像\n\n***\n\n```\n1          <!-- Script 8.3 - footer.html -->\n\
  2      <!-- END CHANGEABLE CONTENT. -->\n3      </main>\n4\n5      <footer container\
  \ class=\"siteFooter\">\n6          <p>Design uses <a href=\"http://concisecss.com/\"\
  >Concise CSS Framework</a></p>\n7      </footer\n8\n9    </body\n10  </html\n```\n\
  \n***\n\n6. 将文件保存为 `footer.html`。\n\n***\n\n### 提示\n在 PHP 中可以使用许多更复杂的模板系统来将设计与逻辑分离。其中最著名的可能是\
  \ Smarty（[www.smarty.net](http://www.smarty.net)）。\n\n***\n\n# CSS 模板\n级联样式表（CSS）长期以来一直是\
  \ Web 中日益重要的部分。它们最初的使用侧重于美化（字体大小、颜色等），但现在 CSS 像本章一样，常用于控制页面布局。\n\n此示例定义了页面的三个区域——`header`、`main`（即内容）和\
  \ `footer`。`main` 区域会随着每个页面而变化。其他区域包含标准项目（例如导航链接），这些项目会出现在网站的每个页面。\n\n为了明确起见：PHP\
  \ 与 CSS 之间的关系与 PHP 与 HTML 之间的关系相同——PHP 在服务器上，而 HTML 和 CSS 对浏览器很重要。与 HTML 一样，你可以可以使用\
  \ PHP 来生成 CSS，但在本示例中，CSS 被硬编码在一个单独的文件。\n\n***\n\n## 使用外部文件\n如前节所述，你可以通过为特定元素创建单独页面，然后使用特定函数将其整合到主页面中来节省时间。其中两个函数是\
  \ `include()` 和 `require()`：\n\n```\ninclude('file.php');\nrequire('file.html');\n\
  ```\n\n这两个函数的工作方式相同，但有一个关键区别：如果 `include()` 函数失败，PHP 脚本会生成警告 ![Image](img/a.jpg)\
  \ 但继续运行。相反，如果 `require()` 失败，它将终止执行 ![Image](img/b.jpg)。\n\n当 `include()` 失败时，会发出警告但脚本继续。当\
  \ `require()` 失败时，会发出警告和错误且脚本停止。`include()` 和 `require()` 都会将引用的文件整合到主文件中（为了清晰起见，包含\
  \ `include()` 或 `require()` 行的文件被称为“包含者文件”或“父文件”）。结果与被包含的代码原本就是父文件的一部分一样。\n\n理解这个基本概念是充分利用外部文件的关键：包含一个文件就好像该文件的内容最初就在父脚本中。这意味着被包含文件中任何不在\
  \ PHP 标签内的代码都将视为 HTML。而且无论被包含的文件具有什么扩展名，这一点都是 true，因为起作用的是包含者文件的扩展名。\n\n使用包含包含的文件有许多原因。你可以将定义的函数放在一个公共文件中（有关编写自定义函数的信息，请参阅\
  \ 第 10 章，“创建函数”）。你可能可能还想将你的数据库访问信息放在配置文件中。但是，首先，让我们包含本章前面的节中创建的模板文件，以使页面遵循一致的设计。\n\
  \n要使用外部文件：\n1. 在你的文本编辑器或 IDE 中创建一个新文档，命名为 `index.php`。\n2. 从初始 PHP 标签开始，并添加任何注释（**脚本\
  \ 8.4](#ch08.html_ch08scr04)**）：\n\n```\n<?php // Script 8.4 - index.php\n/* 这是该网站的首页。\n\
  它使用模板来创建布局。 */\n```\n\n**脚本 8.4** 一旦创建了两个被包含的文件，`include()` 函数就会将它们整合到父文件中，从而动态创建完整的\
  \ HTML 页面。\n\n```\n1   <?php // Script 8.4 - index.php\n2   /* 这是该网站的首页。\n3   它使用模板来创建布局。\n\
  4   */\n5\n6   // 包含头部：\n7   include('templates/header.html');\n8   // 保留 PHP 部分以显示大量\
  \ HTML：\n9   ?>\n10  ... consectetur adipisicing elit, sed do eiusmod tempor incididunt\
  \ ut labore et dolore magna aliqua. Ut enim ad minim veniam, quisrud exercitation\
  \ ullamco nisi ut aliquip ex commodo consequat. Duis aute irure reprehenderit in\
  \ voluptate velit esse fugiat pariatur. Excepteur sint occaecat non proident, sunt\
  \ in culpa deserunt mollit anim id laborum.</p>\n11\n12  <?php // 返回 PHP。\n13  include('templates/footer.html');\n\
  14   // 包含页脚。\n15  ?>\n```\n\n注意，有了模板系统，脚本的第一行是 PHP 标签。不需要从初始 HTML 开始，因为那现在存储在 `header.html`\
  \ 中。\n\n3. 如果必要，处理错误管理。\n此主题在 第 3 章，“HTML 表单与 PHP](#ch03.html_ch03)”中讨论过，你可能需要在脚本中处理它。查看该章节更多信息；这将是我在本章中最后一次提到它。\n\
  \n***\n\n## 文件导航与站点结构\n为了能够使用外部文件，你需要了解计算机或服务器上的文件导航。就像必须在 HTML 链接中正确引用其他页面或在网站中引用图像一样，你必须正确让父文件指向包含的脚本。你可以通过*绝对*路径或*相对*路径来实现。\n\
  \n绝对路径是完整的、特定的地址，如下：\n\n```\ninclude('C:\\inetpub\\wwwfiles\\file.php');\ninclude('/Users/larry/Sites/file.php');\n\
  ```\n\n只要包含包含的文件移动，绝对路径将始终有效。\n\n相对路径表示被包含文件相对于父文件的位置。这些示例假设它们都在同一个目录下：\n\n```\n\
  include('file.php');\ninclude('./file.php');\n```\n\n被包含的文件也可以位于父文件的子目录中，正如本章的示例所示（另参见\
  \ ![Image](img/b_ash_c.jpg)）：\n\n```\ninclude('templates/header.html');\n```\n\n\
  或者，包含的文件可能位于父目录的上一级：\n\n```\ninclude('../file.php');\n```\n\n\n\n\n最后，关于网站结构的一点说明：一旦你将你的\
  \ Web 应用程序拆分成多个部分，就应该开始考虑将文件安排在合适的文件夹中。复杂的网站可能会有一个主文件夹，另一个用于存放图像，一个用于存放管理文件，以及一个用于模板和包含文件的特殊目录。只要你在\
  \ `include()` 或 `require()` 语句中正确引用了文件，结构化你的应用程序就能正常运行，并带来易于维护的额外好处。\n\n### 4. 包含头文件：\n\
  \n点击此处查看代码图像\n\n```php\ninclude('templates/header.html');\n```\n\n要使用模板系统，你在这里通过调用\
  \ `include()` 函数来包含头文件。由于头文件只包含 HTML，因此它的所有内容都将立即发送到浏览器，就像它们是该文件的一部分一样。这一行使用`相对路径`来引用被包含的文件（参见“文件导航与网站结构”侧边栏），并假设该文件存储在\
  \ `templates` 目录。\n\n### 5. 关闭 PHP 部分，并创建页面特定内容：\n\n点击此处查看代码图像\n\n```php\n?>\n\n\
  <h2>Welcome to a J.D. Salinger Fan Club</h2>\n\n<p>Lorem ipsum dolor sit amet...</p>\n\
  ```\n\n由于此页面的大部分是标准 HTML，因此直接退出 PHP 部分然后添加 HTML 比使用 `print` 将其发送到浏览器要简单。同样，实际脚本中的废话比我在这里包含的要多。\n\
  \n### 6. 创建另一个 PHP 部分，并包含页脚文件：\n\n点击此处查看代码图像\n\n```php\n<?php\n\ninclude('templates/footer.html');\n\
  \n?>\n```\n\n要完成页面，你需要包含页脚文件，该文件会显示页脚并关闭 HTML 代码。为了做到这一点，你创建一个新的 PHP 部分——你可以在脚本中拥有多个\
  \ PHP 代码部分——并再次调用 `include()` 函数。\n\n### 7. 将文件保存为 `index.php`。\n\n### 8. 在你启用了\
  \ PHP 的计算机或服务器的主 Web 文档目录中创建一个名为 `templates` 的文件夹。\n\n为了进一步将设计元素与主内容分离，头部和页脚文件放在它们自己的目录中。\n\
  \n### 9. 将 `header.html` 和 `footer.html` 放在你刚刚创建的 `templates` 目录。\n\n### 10. 将 `index.php`\
  \ 放在与 `templates` 文件夹相同的目录下。\n\n计算机上索引页与两个 HTML 页面之间的相对位置必须正确，代码才能运行。两个 HTML 页面位于\
  \ `templates` 文件夹内，而 `templates` 文件夹和 `index.php` 位于同一个文件夹（例如 Web 根目录）。\n\n### 11.\
  \ 在启用了 PHP 的计算机或服务器的主 Web 文档目录中创建一个名为 `css` 的文件夹。\n\nCSS 脚本需要存放在此目录。\n\n### 12.\
  \ 将 `concise.min.css` 和 `masthead.css` 脚本（作为书籍可下载代码的一部分）放在 `css` 目录![Image](img/c.jpg)。\n\
  \n![Image](img/08fig08.jpg)\n\n![Image](img/c.jpg) 文件和文件夹在启用了 PHP 的服务器上应有的组织方式。\n\
  \n尽管头文件包含了 CSS 脚本，但对该脚本的引用必须相对于 `index.php`。毕竟，是那个页面将包含 `header.html`。\n\n### 13.\
  \ 在你的浏览器中运行 `index.php` ![Image](img/d.jpg)。\n\n![Image](img/08fig09.jpg)\n\n![Image](img/d.jpg)\
  \ 此页面是使用包含的文件动态生成的。\n\n生成的页面看起来应该与原始布局完全相同（参见本章上一节中的 !(Image）。\n\n### 14. 在浏览器中查看页面源代码。\n\
  \n源代码应该与 `template.html` 脚本的源代码（脚本 8.1）完全一致，除了增加了用于脚本名称和编号的注释外。\n\n---\n\n**提示**\n\
  \n此模板系统中的三个文件——`header.html`、`footer.html` 和 `index.php`——必须使用相同的`encoding` 以避免出现问题（关于编码的更多信息，请参见\
  \ 第 1 章，“开始使用 PHP](#ch01.html_ch01)”）。每个文件的编码也必须与 HTML 代码中建立的编码匹配。\n\n---\n\n**提示**\n\
  \n`require()` 和 `include()` 函数可以带括号也可以带：\n\n```php\nrequire 'filename.html';\n```\n\
  \n---\n\n**提示**\n\n你有时可能会使用一个存储要包含的文件名的变量：\n\n```php\nrequire $filename;\n```\n\n\
  ---\n\n**提示**\n\n`include()` 和 `require()` 都有变体：`include_once()` 和 `require_once()`。每种都与其对应的版本相同，只是它们确保了同一个文件只能被包含一次（在父脚本中）。你通常应该避免使用这些，因为它们会对脚本的性能产生不利影响。\n\
  \n---\n\n**提示**\n\n如果 PHP 部分只执行一个命令，通常会将该命令和 PHP 标签放在同一行：\n\n点击此处查看代码图像\n\n```php\n\
  <?php include('header.html'); ?>\n```\n\n---\n\n**提示**\n\n如果你看到类似 ![Image](img/a.jpg)\
  \ 和 ![Image](img/b.jpg) 的错误信息，说明父脚本找不到该文件。这个问题可能是由于文件名或路径拼写错误（例如 `templates/header.html`）。\n\
  \n---\n\n**提示**\n\n引用常量通常很简单：\n\n```php\nprint CURRENCY;\n\nnumber_format(PI, 1);\n\
  ```\n\n但在引号中使用常量会更复杂。你不能在单引号或双引号内打印常量，就像这样 ![Image](img/a.jpg)：\n\n```php\nprint\
  \ \"The cost is 468 CURRENCY\";\n\nprint 'The cost is 468 CURRENCY';\n```\n\n###\
  \ 使用常量\n\nPHP 的许多数据类型已经在书中讨论过了，主要是：数字、字符串和数组*常量*是另一种数据类型，但与变量不同，它的值不能改变。\n\n变量通过赋值运算符\
  \ (=) 赋值，而常量则使用 `define()` 函数赋值：\n\n```php\ndefine('CONSTANT_NAME', value);\n```\n\
  \n注意到——按照经验——常量通常使用全大写字母命名，尽管这不是强制要求的。重要的是，常量不使用变量那样的初始美元符号，因为常量不是变量。这里是两个常量：\n\n\
  ```php\ndefine('PI', 3.14);\n\ndefine('CURRENCY', 'euros');\n```\n\n\n\n\n![Image](img/a.jpg)\
  \ 常量的值不能通过引号内的常量名来打印。\n\n相反，需要使用字符串拼接或多个 print 语句：\n\n点击此处查看代码图片\n\n```\nprint 'The\
  \ cost is 468 ' . CURRENCY;\n```\n\n或者\n\n```php\nprint 'The cost is 468 ';\n\n\
  print CURRENCY;\n```\n\n与用于创建常量的 `define()` 函数相对应的是 `defined()` 函数（注意末尾的“d”）。如果提交的常量已定义，该函数将返回\
  \ `TRUE`。它通常被用作条件判断的基础：\n\n点击此处查看代码图片\n\n```php\nif (defined('CONSTANT_NAME')) {\
  \ ...\n```\n\n作为使用常量的一个示例，你将赋予示例程序为每个页面显示不同标题（显示在浏览器窗口顶部）的能力。为了实现这一点，你将在父脚本中定义一个常量，然后由头文件进行打印。这种技术之所以有效，是因为在调用\
  \ `include()` 或 `require()` 之前存在于父文档中的任何变量或常量对于包含的文件都是可用的（就像包含的文件是父文件的一部分一样）。\n\n\
  ### 使用常量：\n\n**1.** 在你的文本编辑器或 IDE 中创建一个新的 PHP 文档，命名为 `books.php`（**脚本 8.5**）：\n\n\
  点击此处查看代码图片\n\n```php\n<?php // Script 8.5 - books.php\n```\n\n**脚本 8.5** 此脚本使用了与\
  \ `index.php` 相同的模板系统（脚本 8.4），但同时也使用常量来识别页面标题。\n\n点击此处查看代码图片\n\n***\n\n```php\n\
  1   <?php // Script 8.5 - books.php\n2   /* 此页面列出了 J.D. Salinger 的\n3     参考文献。\
  \ */\n4\n5   // 设置页面标题并包含\n6     头文件：\n7   define('TITLE', 'Books by J.D.\n8   \
  \  Salinger');\n9   include('templates/header.html');\n10\n11  // 保留 PHP 部分以显示大量\n\
  12  的 HTML:\n13  ?>\n14\n15  <h2>J.D. Salinger's Books</h2>\n16  <ul>\n17      <li>The\
  \ Catcher in the Rye（捕手记）</li>\n18      <li>Nine Stories（九个故事）</li>\n19      <li>Franny\
  \ and Zooey（弗妮与齐伊）</li>\n20      <li>Raise High the Roof Beam,\n21        Carpenters\
  \ and Seymour: An\n22        Introduction（木工入门）</li>\n23  </ul>\n24\n25  <?php include('templates/footer.html');\n\
  26    ?>\n```（稍一下，正在修复上面的代码块格式）\n\n***\n\n**2.** 将页面标题定义为常量：\n\n点击此处查看代码图片\n\n```php\n\
  define('TITLE', 'Books by J.D. Salinger');\n```\n\n这里定义了一个常量，名为 `TITLE`，并赋值为 *Books\
  \ by J.D. Salinger*。\n\n**3.** 包含头文件：\n\n点击此处查看代码图片\n\n```php\ninclude('templates/header.html');\n\
  ```\n\n此脚本使用了与其他所有文件相同的头文件，尽管你稍后将修改该文件以考虑该常量。\n\n**4.** 关闭 PHP 部分并创建 HTML：\n\n点击此处查看代码图片\n\
  \n```html\n?>\n\n<h2>J.D. Salinger's Books</h2>\n<ul>\n  <li>The Catcher in the\
  \ Rye</li>\n  <li>Nine Stories</li>\n  <li>Franny and Zooey</li>\n  <li>Raise High\
  \ the Roof Beam, Carpenters and Seymour: An Introduction</li>\n</ul>\n```\n\n这里的内容虽然简单，但很好地实现了页面的目的。\n\
  \n**5.** 创建一个新的包含页脚文件的 PHP 部分：\n\n点击此处查看代码图片\n\n```php\n<?php include('templates/footer.html');\
  \ ?>\n```\n\n正如之前的提示中提到的，由于剩余的 PHP 代码仅包含一行，因此所有内容都可以写在一行中，包括 PHP 的开始结束标签。只需确保在执行的代码——`include()`——与标签之间留有空格。\n\
  \n**6.** 将文件保存为 `books.php`。\n\n为了利用常量，你现在需要修改 `header.html` 文件。\n\n### 打印常量：\n\n\
  **1.** 在你的文本编辑器或 IDE 中打开 `header.html`（脚本 8.2）。\n\n**2.** 删除标题标签之间的 *Raise High\
  \ the Roof Beam!* 文本。\n\n现在标题将根据常量的是否存在来确定，你不需要将其硬编码到页面中。**3.** 在标题标签处添加以下内容（**脚本\
  \ 8.6**）：\n\n```php\n<?php\nif (defined('TITLE')) {\n  print TITLE;\n} else {\n\
  \  print 'Raise High the Roof Beam!';\n}\n?>\n```\n\n**脚本 8.6** `header.html` 文件经过修改，以便根据常量设置页面标题。\n\
  \n```html\n<!doctype html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta\
  \ http-equiv=\"UA-Compatible\" content=\"edge\">\n  <meta name=\"viewport\" content=\"\
  width=device-width,initial-scale=1.0\">\n  <title><?php // 打印标题\nif (defined('TITLE'))\
  \ {\n  print TITLE;\n} else {\n  print 'Raise High the Roof Beam!';\n}\n></title>\n\
  \  <link rel=\"stylesheet\" type=\"text/css\" href=\"css/concise.min.css\" />\n\
  \  <link rel=\"stylesheet\" type=\"text/css\" href=\"css/head.css\" />\n</head>\n\
  <body>\n<header class=\"siteHeader\">\n  <div>\n    <h1 class=\"logo\"><a href=\"\
  index.php\">Raise High the Roof Beam!</a></h1>\n    <nav class=\"nav\">\n      <ul>\n\
  \        <li><a href=\"books\">Books</a></li>\n        <li><a href=\"#\">Stories</a></li>\n\
  \        <li><a href=\"#\">Quotes</a></li>\n        <li><a href=\"login.php\">Login</a></li>\n\
  \        <li><a href=\"register.php\">Register</a></li>\n      </ul>\n    </nav>\n\
  \  </div>\n</header>\n\n  <main class=\"siteContent\">\n    <!-- BEGIN CHANGEABLE\
  \ CONTENT. -->\n    <!-- Script 8.6 - header.html -->\n```\n\n为了让 PHP 创建页面标题，你需要首先在标题标签之间开始一段\
  \ PHP 代码。然后使用一个条件判断来检查 `TITLE` 常量是否已定义。如果是，则打印它的值作为页面标题。如果 `TITLE` 未定义，则打印一个默认标题。\n\
  \n**4.** 将文件保存为 `header.html`。\n\n**5.** 将 `books.php` 和 `header.html` 上传到支持 PHP\
  \ 的服务器。新的 PHP 脚本 `books.php` 应该放在与 `index.php` 相同的目录下；`header.html` 应该替换与 footer.html\
  \ 相同目录（templates）下的旧版本。\n\n**6.** 在浏览器中运行 `books.php`。\n\n\n\n\n在第 9 章“Cookies 与会话”中，你将学习另一个常量\
  \ `SID`（代表会话 ID）。\n\n**提示**\n使用常量的额外好处是它们具有全局作用域。在读完第 10 章中的“理解变量作用域”之后，这个概念对你将更有意义。\n\
  \n**提示**\n常量的值永远无法更改，而且常量不能删除（技术上是 `unset`）。\n\n**提示**\n从 PHP 5.6 开始，常量可以包含一个值数组。在语言的较早版本中，常量是标量的：它只能存储单个值。\n\
  \n### 处理日期和时间\n\nPHP 有几个用于处理日期和时间的函数，其中最重要的是 `date()`。`date()` 函数唯一的作用是根据其输入的参数返回格式化的日期和时间信息，但你会对它有多么用感到惊讶。`date()`\
  \ 函数的基本用法如下：\n\n```php\ndate('formatting');\n```\n\n在表 8.1 中列出了许多可能的格式选项（PHP 手册还列出了更多）。这些参数也可以组合——例如，`date('l\
  \ F j, Y')` 返回 *2017 年 1 月 26 日，星期四*。\n\n![Image](img/08tab01.jpg)\n\n**表 8.1 date()\
  \ 函数格式**\n\n`date()` 函数可以接受第二个参数，命名为 `timestamp`。时间戳是一个数字，代表自 1970 年 1 月 1 日午夜以来过的秒数——这一时刻被称为纪元（epoch）。\n\
  \n`time()` 函数返回当前时刻的时间戳。`mktime()` 函数可以返回特定日期时间的时间戳：\n\n点击此处查看代码图片\n\n```php\nmktime(hour,\
  \ minute, second, month, day, year);\n```\n\n因此，代码\n\n点击此处查看代码图片\n\n```php\n$ts\
  \ = mktime(12, 30, 0, 11, 5, 2016);\n```\n\n将从纪元到 2016 年 11 月 5 日 12:30 的秒数赋值给 `$ts`。该数字可以这样输入\
  \ `date()` 函数：\n\n```php\ndate('D', $ts);\n```\n\n这返回 *Sat*，这是该星期几的三字母格式。\n\n需要理解的一个重要点是，时间戳和纪元使用的是协调世界时（奇简写为\
  \ UTC），它等同于格林威治时间（GMT）。\n\n从 PHP 5.1 开始，你应该在调用任何日期或时间相关的函数之前建立服务器的时区。要这样做，请使用：\n\
  \n点击此处查看代码图片\n\n```php\ndate_default_timezone_set(timezone);\n```\n\n`timezone`\
  \ 值是一个像 *America/New_York 或 Pacific/Auckland* 这样的字符串。这里列不完（仅非洲就有 50 多个），但请参阅 PHP\
  \ 手册查看。如果你不采取这一步，可能会看到关于在未设置时区的情况下使用日期或时间函数的错误。\n\n最后，意识到至少涉及三个时区然后：\n\n![Image](img/squf.jpg)\
  \ UTC\n![Image](img/squf.jpg) 服务器时区\n![Image](img/squf.jpg) 用户时区\n\n由于 PHP 是一种服务端技术，这些函数反映的是\
  \ UTC 或服务器上的日期和时间。要获取客户端的时间（换句话说，即查看页面的浏览器所在的计算机），必须使用 JavaScript。\n\n为了演示 `date()`\
  \ 函数，让我们更新 `footer.html` 文件，使其在侧边栏显示当前日期和时间 ![Image](img/a.jpg)。这是该函数的一个简单用法，但足以让你入门了。\n\
  \n![Image](img/08fig13.jpg)\n![Image](img/a.jpg) 得益于 `date()` 函数，网站现在在页脚显示日期和时间。\n\
