  ```sql\nINSERT INTO tablename (column1_name, column2_name) VALUES (value1, value2),\
  \ (value3, value4);\n```\n\n然而，大多数其他数据库应用程序不支持这种结构。\n\n### 安全查询数据\n\n正如我在章节“向数据库中插入数据”的引言中所提到的，所编写的代码存在一个相当严重的安全漏洞。目前，如果有人提交包含单引号的文本，该数据将破坏\
  \ SQL 查询 ![Image](img/a.jpg) （撇开安全问题不谈，这也是很严重的错误）。结果显然是不如意的，但为什么它不安全呢？\n\n![Image](img/12fig13.jpg)\n\
  \n![Image](img/a.jpg) 对单引号的处理不当允许用户破坏查询，因为单引号（或单引号标记）被用于界定查询中的字符串。\n\n如果恶意用户知道他们可以通过输入单引号来破坏查询，他们可能会尝试利用这个漏洞运行自己的查询。如果有人提交\
  \ `‘;DROP TABLE entries;` 作为博客文章标题，生成的查询将是：\n\n点击此处查看代码图像\n\n```sql\nINSERT INTO\
  \ entries (id, title, entry, date_entered) VALUES (0, '';DROP TABLE entries;', '<entry\
  \ text>', NOW())\n```\n\n提供的文章标题开头的第一个单引号的作用是完成查询中博客标题的值部分。随后，分号终止了 `INSERT` 查询本身。这将导致原始查询在语法上无效。然后，数据库将获得第二个查询——`DROP\
  \ TABLE entries`，并希望在原始 `INSERT` 查询失败时执行它。这被称为 SQL 注入攻击，但幸运的是它是很容易防止的。\n\n要做到这一点，通过\
  \ `mysqli_real_escape_string()` 函数发送可能用于查询的潜在不安全数据。该函数将对任何潜在有害的字符进行转义（在前面加上反斜杠），使数据在查询中使用时是安全的：\n\
  \n点击此处查看代码图像\n\n```php\n$var = mysqli_real_escape_string ($dbc, $var);\n```\n\n\
  为了让此函数正常工作，需要为通信建立字符集：\n\n点击此处查看代码图像\n\n```php\nmysqli_set_charset($dbc, 'utf8')\n\
  ```\n\n这段代码的作用与 HTML 中的 `charset` 元数据实际上相同：指示后续数据的字符集（或字符编码）。之前的代码确实假设你的 PHP 脚本、数据库和表都是\
  \ UTF-8，它们在默认情况下确实应该是这样的（并且在创建表时已经专门设置了，以防万一）。让我们将此函数应用于先前的脚本。由于 `mysqli_real_escape_string()`\
  \ 和 `mysqli_set_charset()` 都需要数据库连接，脚本的逻辑必须经过微调。\n\n#### 显示错误\n\n即使 MySQL 不执行注入的命令（通常\
  \ MySQL 仅通过 `mysqli_query()` 函数运行单条 SQL 查询），黑客也会在表单数据中提供坏字符，希望语法上错误的查询能生成数据库错误。通过查看数据库错误，黑客试图获取有关数据库的知识，这些知识可以被用于恶意目的。出于如此，上线网站绝不能泄露真实的错误或查询语句。本章中的脚本这样做仅用于你的调试。\n\
  \n#### 要安全查询数据：\n\n1. 在文本编辑器或 IDE 中打开 `add_entry.php` (`Script 2.4`)，如果尚未打开的话。\n\
  2. 如下更新 `$title` 和 `$entry` 变量（`Script 12.5`）：\n\n\n\n\n```php\nerror($dbc) . '</p><p>正在运行的查询为:\
  \ ' . $query . '</p>';\n\n}\n} // 没有问题！\n\nmysqli_close($dbc); // 关闭连接。\n\n} //\
  \ 表单提交 IF 语句结束。\n\n// 显示表单：\n?>\n<form action=\"add_entry.php\" method=\"post\"\
  >\n    <p>条目标题：<input type=\"text\" name=\"title\" size=\"40\" maxsize=\"100\"></p>\n\
  \    <p>正文：<textarea name=\"entry\" cols=\"40\" rows=\"5\"></textarea></p>\n   \
  \ <input type=\"submit\" name=\"submit\" value=\"发布此条目!\">\n</form>\n</body>\n</html>\n\
  ```\n\n这两行代码将极大地提高脚本的安全性和功能。对于两个提交的变量，它们的值首先会被修剪并去除标签，然后通过 `mysqli_real_escape_string()`\
  \ 处理。结果将可以安全地用在查询中。\n\n如果对一个变量应用三个函数让你感到太困惑，你可以将代码拆分为离散步骤：\n\n点击此处查看代码图片\n\n```php\n\
  $title = $_POST['title'];\n$title = trim(strip_tags ($title));\n$title = mysqli_real_escape_string($dbc,\
  \ $title);\n```\n\n**3.** 将数据库连接代码——即 脚本 12.4 中的第 27 行——移动到验证行上方。\n\n数据库连接应该在表单处理代码中建立，但在\
  \ `$problem = FALSE;` 之前。\n\n**4.** 将数据库关闭代码——即 脚本 12.4 中的第 39 行——移动到表单提交条件语句结束之前的紧位置。\n\
