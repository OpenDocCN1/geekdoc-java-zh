  **脚本 11.7**\n`users.txt` 文件列出了三个制表符分隔的字段：用户名、加密后的密码以及用户关联目录。\n\n点击此处查看代码图像\n\n```\n\
  1   larry\n2   john\n3   paul\n4   george\n5   ringo\n```\n\n> **提示**\n> 你也可以通过查看\
