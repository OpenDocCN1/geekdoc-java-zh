  \ `for` 循环的语法是什么？\n\n### 练习\n\n![Image](img/squf.jpg) 查看 PHP 手册中各种运算符的页面。\n\n![Image](img/squf.jpg)\
  \ 重写 `handle_reg.php`，使其使用变量来表示当前年份，而不是硬编码该值。\n\n![Image](img/squf.jpg) 为了调试目的，在\
  \ `handle_reg.php` 的开头添加代码，打印出接收到的值。提示：有一种简单的方法这样做。\n\n![Image](img/squf.jpg) 重写\
  \ `handle_reg.php` 的一个版本，使其打印用户喜欢的颜色选择。提示：你会使用连接。\n\n![Image](img/squf.jpg) 更新 `handle_reg.php`，通过查看月、日、年三个表单元素来验证用户的生日。创建一个表示\
  \ `XX/DD/YYYY` 格式生日变量（再次，你会使用连接）。\n\n# 7 使用数组\n\n本章内容\n- 什么是数组？\n- 创建数组\n- 向数组添加项\n\
  - 访问数组元素\n- 创建多维数组\n- 排序数组\n- 在字符串和数组之间转换\n- 从表单创建数组\n- 复习与练习\n\n你在书中学习的下一个最后一个变量类型是数组。数组与数字或字符串显著不同，如果不理解它们就无法充分编程。\n\
  \n由于它们的独特性，本章将比其他类型更仔细、更缓慢地介绍数组。本章从数组的概念开始，以及创建和使用数组的基础。然后介绍了多维数组和一些数组相关的函数。本章以数组字符串转换以及如何从\
  \ HTML 表单创建数组的演示结束。\n\n数组是一个复杂但实用的概念。数字和字符串是标量变量——意味着它们只有一个值——而数组是组合在一个变量中的多个值。数组由数字、字符串和其他数组组成，允许该变量持有比简单字符串或数字多得的信息。例如，如果你想使用字符串创建一个购物列表，你的代码看起来像这样：\n\
  \n```\n$item1 = 'apples';\n$item2 = 'bananas';\n$item3 = 'oranges';\n```\n\n对于每个添加的项，你都需要创建一个新字符串。这种方法很繁琐，并且使得在代码后面引用整个列表或特定值变得困难。你可以通过将整个列表放入一个数组（例如，\
  \ `$items`）来大大简化问题（表 7.1）。\n\n![Image](img/07tab01.jpg)\n\n**表 7.1 购物列表数组**\n\n\
  作为一个数组，你的列表可以被添加、排序、搜索等。在此背景下，让我们看看数组的语法。\n\n## 全局变量与你\n\n在书中你处理了一些数组：`$_SERVER`、`$_GET`\
  \ 和 `$_POST`。这些都是被称为全局变量的特殊数组，还有 `$_COOKIE`、`$_SESSION` 和 `$_ENV`。\n\n正如你所知，`$_POST`\
  \ 数组接收来自使用 POST 方法表单的所有数据。它的索引是表单元素的名称，值是这些表单元素的值。因此，`$_POST['name']` 指代码创建的表单输入中输入的值：\n\
  \n```\n<input type=\"text\" name=\"name\">\n```\n\n同样，`$_GET` 指从使用 GET 方法的表单发送或其他通过\
  \ URL 传递的数据。`$_COOKIE` 指存储在 cookie 中的数据，`$_SESSION` 指存储在会中的数据（你将在第 9 章，“Cookies\
  \ 和 Sessions”中遇到这两个）。`$_ENV` 类似于 `$_SERVER`，包含有关 PHP 运行计算机的值。\n\n### 数组的语法规则\n\n\
  你处理过的其他变量类型——数字和字符串都有变量名和对应的值（例如，$first_name` 可以等于 Larry）。数组也有名称，使用相同的约定：\n\n- 它们以美元符号开头。\n\
  - 以字母或下划线继续。\n- 以字母、数字或下划线的任意组合结束。\n\n但数组的不同之处在于它们包含多个元素。将表 7.1 中的每一行视为一个元素。元素由一个索引或键（这两个词可以互换使用）和一个值组成。在表\
  \ 7.1 中，项目编号是键，项目是值。\n\n\n\n\n陣列索引被用作值的參考點。陣列可以使用數字或字符串作為鍵，或兩者兼具，取決於你的設置。\n\n通常，當你使用陣列時，它看起來與任何變數相同，除了在括號中包含鍵（`[]`，有稱為方括號）來引用特定值。`$items`\
  \ 代表整個陣列，而 `$items[1]` 指向陣列中的特定元素（在此例中為 `apples`）。\n\n### 建立陣列\n\n建立陣列的正式方法是使用 `array()`\
  \ 函數。其語法如下：\n\n點擊此處查看圖片\n\n```php\n$list = array('apples', 'bananas', 'oranges');\n\
  ```\n\n除非另有指定，否則陣列自動從 0 開始索引。在範例中（未指定元素指定索引），第一個項目 `apples` 自動索引為 0，第二個項目為 1，第三個項目為\
  \ 2。\n\n如果你需要，可以在使用 `array()` 時分配索引：\n\n點擊此處查看圖片\n\n```php\n$list = array(1 => 'apples',\
  \ 2 => 'bananas', 3 => 'oranges');\n```\n\n因為 PHP 對代碼中的空白非常寬鬆，你可以透過分行寫寫來讓此結構更易讀：\n\
  \n```php\n$list = array(\n  1 => 'apples',\n  2 => 'bananas',\n  3 => 'oranges'\n\
  );\n```\n\n（為了提高可讀性，通常會像這裡一樣縮進陣列元素，雖然這並非必須。）\n\n從 PHP 5.4 開始，你也可以使用短格式陣列語法（short\
  \ array syntax）建立陣列。只需使用括號代替 `array()` 調用：\n\n點擊此處查看圖片\n\n```php\n$list = ['apples',\
  \ 'bananas', 'oranges'];\n```\n\n自然地，你也可以用這種語法設置索引：\n\n```php\n$list = [\n  1 =>\
  \ 'apples',\n  2 => 'bananas',\n  3 => 'oranges'\n];\n```\n\n最後，你指定的索引值不一定是數字——你可以使用字符串。例如，你可以建立一個陣列來記錄每週每天的例湯，如下腳本所示。此範例還將演示你如何以及如何不能打印出陣列（雖然之前已經演示過，但值得重申一下）。\n\
  \n要建立一個陣列：\n\n**1.** 在你的文本編輯器或 IDE 中建立一個新文件，命名為 `soups1.php`（**腳本 7.1**）：\n\n點擊此處查看圖片\n\
  \n```html\n<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
  >\n  <title>No Soup for You!</title>\n</head>\n<body>\n<h1>Mmm...soups</h1>\n```\n\
  \n**腳本 7.1** `$soups` 陣列包含三個個元素，並使用字符串作為其鍵。\n\n點擊此處查看圖片\n\n***\n\n```php\n1   <!doctype\
  \ html>\n2   <html lang=\"en\">\n3   <head>\n4      <meta charset=\"utf-8\">\n5\
  \      <title>No Soup for You!</title>\n6   </head>\n7   <body>\n8   <h1>Mmm...soups</h1>\n\
  9   <?php // Script 7.1 - soups1.php\n10  /* 此腳本建立並打印出一個\n11    陣列。 */\n12  // 如果你需要，請處理地址錯誤。\n\
  13    管理。\n14 \n15  // 建立陣列：\n16  $soups = [\n17    'Monday' => 'Clam Chowder',\n\
  18    'Tuesday' => 'White Chicken Chili',\n19    'Wednesday' => 'Vegetarian'\n20\
  \  ];\n21 \n22  // 嘗試打印陣列：\n23  print \"<p>$soups</p>\";\n24 \n25  // 打印陣列內容：\n\
  26  print_r($soups);\n27 \n28  ?>\n29  </body>\n30 </html>\n```\n\n***\n\n**2.**\
  \ 開始腳本的 PHP 部分，並在必要時處理錯誤緩用：\n\n點擊此處查看圖片\n\n```php\n<?php // Script 7.1 - soups1.php\n\
  ```\n\n如果 `error_reporting` 被設置為 `E_ALL`，請妥善處理錯誤。\n\n**3.** 建立一個陣列：\n\n點擊此處查看圖片\n\
  \n```php\n$soups = [\n  'Monday' => 'Clam Chowder',\n  'Tuesday' => 'White Chicken\
  \ Chili',\n  'Wednesday' => 'Vegetarian'\n];\n```\n\n你指定的索引值不一定是數字——你可以使用字符串。例如，你可以建立一個陣列來記錄每週每天的例湯，如下腳本所示。此範例還將演示你如何以及如何不能打印出陣列（雖然之前已經演示過，但值得重申一下）。\n\
  \n**4.** 嘗試打印陣列：\n\n```php\nprint \"<p>$soups</p>\";\n```\n\n**5.** 打印陣列內容：\n\n\
  ```php\nprint_r($soups);\n```\n\n**6.** 關閉 PHP 部分：\n\n```php\n?>\n```\n\n**7.**\
  \ 將你的文件儲存為 `soups1.php`。\n\n\n\n要向该数组添加两个项，你可以写：\n\n```php\n$list[] = 'pears';\n\
  $list[] = 'tomatoes';\n```\n\n如果你不指定键（key），每个元素都会追加到现有数组之后，并用下一个顺序数字索引。现在 `pears`\
  \ 位于位置 4，`tomatoes` 位于位置 5。\n\n如果你指定了索引（index），值将被分配给该位置。该处已索引的任何现有值都将被覆盖，如下所示：\n\
  \n```php\n$list[3] = 'pears';\n$list[4] = 'tomatoes';\n```\n\n现在，数组中第四个位置元素的值是 `tomatoes`，并且\
  \ `$list` 中没有一个元素等于 `oranges`（该值被 `pears` 覆盖了）。考虑到这一点，除非你打算覆盖任何现有数据，否则在向数组中添加值时，不命名特定的键会更好。然而，如果数组使用字符串作为索引，你可能希望指定键，以避免出现字符串键和数字键的奇特组合。\n\
  \n***\n\n## 删除数组和数组元素\n\n你可能并不经常从数组中删除单个元素，但可以使用 `unset()` 函数来实现这一操作。该函数会删除变量并释放它所使用的内存。当它应用于数组元素时，该元素会被删除：\n\
  \n```php\nunset($array[4]);\nunset($array['key']);\n```\n\n然而，删除单个元素不会重新索引数组。代码删除了一个元素，现在没有元素被索引为\
  \ 4，而其他所有元素继续在它们原来的位置被索引。\n\n如果你对整个数组或任何其他变量类型应用 `unset()`，整个变量都将被删除：\n\n```php\n\
  unset($array);\nunset($string);\n```\n\n你还可以使用 `array()` 函数或短数组语法来 `reset` 数组（即在不完全删除变量的情况下清空它）：\n\
  \n```php\n$array = array();\n$array = [];\n```\n\n这样做的效果是初始化变量：使其存在并定义其类型，但不分配值。\n\
  \n***\n\n为了测试这个过程，在接下来的任务中，你将重写 `soups1.php` 以向数组中添加更多元素。为了看到添加更多元素带来的变化，你将在添加新元素之前之后打印数组元素的数量。就像你可以通过\
  \ `strlen()` 字符串的长度——它包含多少个字符——一样，你可以通过 `count()` 来确定数组中元素的数量：\n\n```php\n$how_many\
  \ = count($array);\n```\n\n向数组中添加元素：\n\n1. 在你的文本编辑器或 IDE 中打开 `soups1.php`（如果它尚未打开）。\n\
  2. 在第 14 到 18 行初始化数组后，添加以下内容（**脚本 7.2**，命名为 `soups2.php`）：\n\n点击此处查看代码图片\n\n```php\n\
  $count1 = count($soups);\nprint \"<p>The soups array originally had $count1 elements.</p>\"\
  ;\n```\n\n**脚本 7.2** 你可以通过使用赋值运算符为每个元素赋值，从而一次一次直接向数组中添加元素。`count()` 函数将帮助你跟踪数组包含多少个元素。\n\
  \n点击此处查看代码图片\n\n***\n\n```html\n<!doctype html>\n<html lang=\"en\">\n<head>\n  \
  \  <meta charset=\"utf-8\">\n    <title>No Soup for You!</title>\n</head>\n<body>\n\
  <h1>Mmm...soups</h1>\n<?php // 脚本 7.2 - soups2.php\n/* 此脚本创建并打印一个\n   数组. */\n//\
