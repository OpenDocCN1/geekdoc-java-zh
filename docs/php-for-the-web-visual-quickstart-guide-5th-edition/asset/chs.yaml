  \ Cookie 出现之前，在 Cookie 出现之前，在 Cookie 出现之前，在 Cookie 出现之前\n\n## 9. Cookies 和 Sessions\n\
  \n***\n\n### 本章内容\n\n* 什么是 Cookie？\n* 创建 Cookie\n* 从 Cookie 中读取\n* 向 Cookie 添加参数\n\
  * 删除 Cookie\n* 什么是 Session？\n* 创建 Session\n* 访问 Session 变量\n* 删除 Session\n* 回顾与进阶\n\
  \n***\n\n第 8 章，“创建 Web 应用程序](#ch08.html_ch08)”涵盖了许多开发更完善网站的技术。缺失的一个部分——也是本章的重点——是在用户跨越多页网站时如何维持“状态”。超文本传输协议（HTTP）是一种无状态技术，这意味着它没有内置方法来跟踪用户或记住从应用程序一个页面到下一个页面的数据。这是一个严重的问题，因为电子商务应用程序、用户注册登录系统以及常用的在线服务依赖于能够跟踪同一个用户从页面到页面。幸运的是，使用\
  \ PHP 维持状态非常简单。\n\n本章讨论了跟踪数据的两种主要方法：cookies 和 sessions。你将开始学习如何创建、读取、修改和删除 cookies。然后你将看到掌握\
  \ sessions 是多么容易，它是维持状态的一种更强大的选项。\n\n### 什么是 Cookie？\n\n在 Cookie 出现之前，浏览网站就像是一次没有历史的旅行。虽然浏览器会跟踪你访问的页面，允许你使用后退按钮返回之前访问的页面，并用不同颜色标记已过的链接，但服务器并不会跟踪单个用户看到和所做的。对于不使用\
  \ cookie 的网站，以及在网页浏览器中禁用了 cookie 的用户，情况依然如此 ![Image](img/a.jpg)。\n\n![Image](img/a.jpg)\
  \ 在 Cookie 出现之前，浏览网站就像是一次没有历史的旅行。虽然浏览器会跟踪你访问的页面，允许你使用后退按钮返回之前访问的页面，并用不同颜色标记已过的链接，但服务器并不会跟踪单个用户看到和所做的。对于不使用\
  \ cookie 的网站，以及在网页浏览器中禁用了 cookie 的用户，情况依然如此。\n\n### 调试 Cookie (Debugging Cookies)\n\
  \n当你在开始处理 cookie 时，你不可避免地需要知道如何这样做，因此该主题在侧边栏“调试 Cookie”中讨论。三个区域可能会导致问题：\n\n* 发送\
  \ cookie\n* 接收 cookie\n* 访问 cookie\n\n在处理 cookie 时，你通常需要知道如何调试，因此该主题在 Cookie 选项中讨论。在\
  \ Cookie           之前，在 Cookie 出现之前，在 Cookie 出现之前，在 Cookie 出现之前，在 Cookie 出现之前，在\
  \ Cookie 出现之前，在 Cookie 出现之前，在 Cookie 出现之前，在 Cookie 出现之前，在 Cookie 之前，在 Cookie 出现之前，在\
  \ Cookie 出现之前，在 Cookie 出现之前，在 Cookie 出现之前，在 Cookie 出现之前，在 Cookie 出现之前\n\n（注：由于输入文本中存在大量重复的乱码字符，翻译时已根据“不要重复输出原文”的原则，仅对核心内容进行了处理。）\n\
  \n\n\n\n关于 Cookie 的一个重要理解点是：*它们必须在任何其他信息之前从服务器发送到客户端*。这意味着脚本应该在任何 `print` 语句之前、在包含包含\
  \ HTML 的外部文件之前等地方发送 Cookie。\n\n如果服务器在网页浏览器已经接收到 HTML（即使只是一个多余的空格）之后尝试发送 Cookie，将导致错误信息且\
  \ Cookie 无法被发送 ![Image](img/a.jpg)。这是目前为止最常见的 Cookie 相关错误。\n\n![Image](img/09fig03.jpg)\n\
  \n![Image](img/a.jpg) 如果 `setcookie()` 函数在有任何内容（即使是空行或空格）发送到浏览器之后被调用，你将会看到这样的消息。\n\
  \n使用 `setcookie()` 函数发送 Cookie：\n\n点击此处查看代码图片\n\n```\nsetcookie(name, value);\n\
  setcookie('CookieName', 'This is the cookie value.');\n```\n\n该行代码向浏览器发送了一个名为 `CookieName`\
  \ 值为 `This is the cookie value` 的 Cookie ![Image](img/b.jpg)。\n\n![Image](img/09fig04.jpg)\n\
  \n![Image](img/b.jpg) 如果浏览器设置为提示用户处理 Cookie，则每个发送的 Cookie 都会出现类似这样的消息。（注意，从 Internet\
  \ Explorer 11 开始，窗口以 URL 编码格式显示值。）\n\n你可以通过后续使用 `setcookie()` 函数继续向浏览器发送更多 Cookie，尽管浏览器对同一个站点可以发送的\
  \ Cookie 数量有限制：\n\n点击此处查看代码图片\n\n```\nsetcookie('name2', 'some value');\nsetcookie('name3',\
  \ 'another value');\n```\n\n浏览器对从一个站点接受的 Cookie 数量没有通用的硬性限制，但你应该将该数量保持到最低。\n\n最后，在创建\
  \ Cookie 时，你可以像本示例所示——使用变量作为 Cookie 的 `name` 或 `value` 属性：\n\n点击此处查看代码图片\n\n```\n\
  setcookie($cookie_name, $cookie_value);\n```\n\n关于设置 Cookie 的示例，你将创建一个脚本，允许用户指定页面的默认字体大小和颜色。页面显示一个用于选择这些值的表单\
  \ ![Image](img/c.jpg)，然后处理表单提交 ![Image](img/d.jpg)。在本章下一节创建的独立页面将使用这些设置。\n\n![Image](img/09fig05.jpg)\n\
  \n![Image](img/c.jpg) 此表单用于选择另一个 PHP 页面使用的字体大小和颜色。\n\n![Image](img/09fig06.jpg)\n\
  \n![Image](img/d.jpg) 提交表单后，页面将显示一条消息和指向另一个页面的链接（用户偏将在那里）。你接下来将创建该页面。\n\n## 发送 cookies\n\
  \n### 1. 在你的文本编辑器或 IDE 中创建一个新的 PHP 文档，命名为 `customize.php` (**脚本 9.1**)：\n\n点击此处查看代码图片\n\
  \n```php\n<?php // Script 9.1 - customize.php\n```\n\n**脚本 9.1** 将使用两个 Cookie 来存储用户对字体大小和颜色的选择。此页面既显示又处理表单。\n\
  \n点击此处查看代码图片\n\n```php\n1   <?php // Script 9.1 - customize.php\n2\n3   // 如果表单已提交，则处理它：\n\
  4   if (isset($_POST['font_size'],\n5   $_POST['font_color'])) {\n6\n7       //\
  \ 发送 cookie：\n8       setcookie('font_size',\n9       $_POST['font_size']);\n10\
  \      setcookie('font_color',\n11      $_POST['font_color']);\n12\n13      // 稍后打印的消息：\n\
  14      $msg = '<p>您的设置已输入！现在来 <a href=\"view_settings.php\">查看效果</a>。</p>';\n15\n\
  16  } // 提交的 IF 结束。\n17?<!doctype html>\n18  <html lang=\"en\">\n19  <head>\n20\
  \      <meta charset=\"utf-8\">\n21      <title>自定义您的设置</title>\n22  </head>\n23\
  \  <body>\n24      <?php // 如果发送了 cookie，则打印一条消息。\n25      if (isset($msg)) {\n\
  26      print $msg;\n27      }\n28  ?>\n29\n30  <p>使用此表单设置您的偏好：</p>\n31\n32  <form\
  \ action=\"customize.php\" method=\"post\">\n33    <select name=\"font_size\">\n\
  34      <option value=\"\">字体大小</option>\n35      <option value=\"xx-small\">xx-small</option>\n\
  36      <option value=\"x-small\">x-small</option>\n37      <option value=\"small\"\
  >small</option>\n38      <option value=\"medium\">medium</option>\n39      <option\
  \ value=\"large\">large</option>\n40      <option value=\"x-large\">x-large</option>\n\
  41      <option value=\"xx-large\">xx-large</option>\n42    </select>\n43    <select\
  \ name=\"font_color\">\n44      <option value=\"\">颜色</option>\n45      <option\
  \ value=\"black\">黑色</option>\n46      <option value=\"red\">红色</option>\n47   \
  \   <option value=\"green\">绿色</option>\n48      <option value=\"blue\">蓝色</option>\n\
  49      <option value=\"orange\">橙色</option>\n50      <option value=\"purple\">紫色</option>\n\
  51      <option value=\"brown\">棕色</option>\n52      <option value=\"pink\">粉色</option>\n\
  53      <option value=\"gray\">灰色</option>\n54    </select>\n55    <input type=\"\
  submit\" value=\"提交\">\n56  </form>\n57</body>\n58</html>\n```\n\n### 2. 检查表单是否提交：\n\
  \n点击此处查看代码图片\n\n```php\nif (isset($_POST['font_size'],\n$_POST['font_color'])) {\n\
  ```\n\n此页面既显示又处理表单。这种方法检查 `$_SERVER['REQUEST_METHOD']` 变量是否为 `POST`。在更完善的应用程序中，你应该先确认这些变量具有可接受的值。\n\
  \n### 3. 创建 cookie：\n\n点击此处查看代码图片\n\n```php\nsetcookie('font_size', $_POST['font_size']);\n\
  setcookie('font_color', $_POST['font_color']);\n```\n\n这两行代码创建了两个 Cookie。一个名为 `font_size`，另一个名为\
  \ `font_color`。它们的值将基于 HTML 表单的选择，存储在 `$_POST['font_size']` 和 `$_POST['font_color']`\
  \ 变量中。\n\n### 4. 创建消息并完成条件判断和 PHP 部分：\n\n点击此处查看代码图片\n\n```php\n  $msg = '<p>您的设置已输入！现在来\
  \ <a href=\"view_settings.php\">查看效果</a>。</p>';\n} // 提交的 IF 结束。\n?>\n```\n\n当表单提交时，cookie\
  \ 将被发送，并且 `$msg` 变量将被赋值一个字符串值。该变量将在脚本后部分用于打印消息。这种方法是必要的；此时你还无法打印消息，因为甚至 HTML 头部都没有创建。\n\
  \n### 5. 创建 HTML 头部和 body 标签：\n\n点击此处查看代码图片\n\n```html\n<!doctype html>\n<html lang=\"\
  en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>自定义您的设置</title>\n</head>\n<body>\n\
  ```\n\n所有这些代码必须在 `setcookie()` 行之后。不是不强调这一点，但在调用 `setcookie()` 之前不能向浏览器发送任何文本、HTML\
  \ 或空格。\n\n### 6. 创建另一个 PHP 部分来报告正在发送的 cookie：\n\n```php\n<?php\nif (isset($msg))\
  \ {\n  print $msg;\n}\n?>\n```\n\n\n\n\n如果已发送 Cookie，此代码将打印一条消息。当用户首次访问页面时，尚未尚未\
  \ Cookie，因此 `$msg` 未被设置，导致该条件为假，且此打印调用不会执行。一旦提交了表单，此时 `$msg` 已经被设置，因此该条件为真 ![Image](img/ash_d.jpg)。\n\
  \n### 7. 开始编写 HTML 表单：\n\n点击此处查看代码图片\n\n<p>使用此表单设置您的偏好设置：</p>\n\n```html\n<form\
  \ action=\"customize.php\" method=\"post\">\n  <select name=\"font_size\">\n   \
  \ <option value=\"\">Font Size</option>\n    <option value=\"xx-small\">x-small</option>\n\
  \    <option value=\"x-small\">x-small</option>\n    <option value=\"small\">small</option>\n\
  \    <option value=\"medium\">medium</option>\n    <option value=\"large\">large</option>\n\
  \    <option value=\"x-large\">x-large</option>\n    <option value=\"xx-large\"\
  > xx-large</option>\n  </select>\n```\n\nHTML 表单本身非常简单 ![Image](img/ash_c.jpg)。\n\
  \n用户被提供了一个下拉菜单来选择字体大小。每个值都对应于设置文档字体大小的 CSS 代码：从 `xx-small` 到 `xx-large`。\n\n由于此脚本既显示又处理该表单，因此表单的\
  \ `action` 属性指向同一个文件。\n\n### 8. 完成 HTML 表单：\n\n点击此处查看代码图片\n\n```html\n  <select\
  \ name=\"font_color\">\n    <option value=\"\">Font Color</option>\n    <option\
