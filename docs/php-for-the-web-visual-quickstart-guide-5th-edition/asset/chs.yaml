  > 当使用制表符等字符分隔存储的值时，你应该额外采取措施转义或删除该字符。\n\n## 加密密码\n\n`sha1()` 函数创建一个*哈希*：字符串经过数学计算的表示。因此，注册脚本并没有实际存储密码，而是存储密码的表示（理论上，没有两个字符串会有相同的\
  \ `sha1()` 值）。你很快就会看到如何使用哈希后的密码。\n\n尽管如此，`sha1()` 并不是安全的密码表示。对于现代计算机来说，破解 `sha1()`\
  \ 所需计算太简单。目前最安全的解决方案是使用 PHP 内置的 `password_hash()` 和 `password_verify()` 函数。尽管并不复杂，但对初学者来说有些困难，特别是如果你的\
  \ PHP 版本低于 5.5。\n\n## 增量读取文件\n\n在 `view_php` 脚本（脚本 11.3）中，`file()` 函数将整个文件读取到数组中。但只想一次读取文件的一部分？你需要使用\
  \ `fgets()` 函数。\n\n`fgets()` 函数读取指定长度的字符串。它通常被放置在 `while` 循环中，使用 `feof()` 函数确保尚未到达文件结束。例如：\n\
  \n```php\n$fp = fopen($file, 'rb');\nwhile (!feof($fp)) {\n  $string = fgets($fp,\
  \ 1024);\n}\nfclose($fp);\n```\n\n使用该代码时，每次将读取 1023 字节的数据，因为 `fgets()` 总是比你指定的长度少\
  \ 1 字节。一旦到达行尾就会停止读取。第二个参数是可选的，但如果存在，应该大于文件的单行。如果你只想读到行尾，省略长度：\n\n```php\n$string\
  \ = fgets($fp);\n```\n\n在数据以分隔格式（通常是逗号，即 CSV 格式）存储的示例中，你可以使用 `fgetcsv()` 函数。它使用分隔符分解字符串并返回数组：\n\
  \n```php\n$array = fgetcsv($fp, length, delimiter);\n$array = fgetcsv($fp, 1024);\n\
  ```\n\n同样，前面的函数调用返回 1023 字节的数据，但它使用默认分隔符（逗号）作为元素位置指示将字符串拆分为数组。此函数等同于同时使用 `fgets()`\
  \ 和 `explode()`。如果你提供 `delimiter` 参数，可以更改用于分隔数据的字符。\n\n最后，由于这些函数依赖于识别行尾，因此启用 PHP\
  \ 的 `auto_detect_line_endings` 设置是一个明智的额外。你可以使用 `ini_set()` 函数来实现：\n\n```php\nini_set('auto_detect_line_endings',\
  \ 1);\n```\n\n例如，让我们创建一个使用前一个示例创建的 `users.txt` 文件的登录脚本。它将继续读取文件，直到找到匹配的用户名/密码组合。增量读取文件：\n\
  \n**1.** 在文本编辑器或 IDE 中开始一个新的 PHP 文档，命名为 `login.php`（脚本 11.8）：\n\n```html\n<!doctype\
  \ html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Login</title>\n\
  </head>\n<body>\n<h1>Login</h1>\n```\n\n**脚本 11.8** `login.php` 脚本使用存储在 `users.txt`\
  \ 中的信息（由 脚本 11.6 创建）来验证用户。\n\n点击此处查看代码图像\n\n```php\n1   larry\n2   john\n3   paul\n\
  4   george\n5   ringo\n```\n\n\n\n\n```php\n$loggedin = TRUE; // 正确的用户名/密码组合。\n\n\
  // 停止循环文件：\nbreak;\n\n} // 结束 IF。\n} // 结束 WHILE。\n\nfclose($fp); // 关闭文件。\n\n//\
  \ 打印消息：\nif ($loggedin) {\n    print '<p>You are now logged in.</p>';\n} else {\n\
  \    print '<p style=\"color: red;\">The username and password you entered do not\
  \ match those on file.</p>';\n}\n\n} else { // 显示表单。\n\n// 退出 PHP 并显示表单：\n?>\n\n\
  <form action=\"login.php\" method=\"post\">\n    <p>Username: <input type=\"text\"\
  \ name=\"username\" size=\"20\"></p>\n    <p>Password: <input type=\"password\"\
  \ name=\"password\" size=\"20\"></p>\n    <input type=\"submit\" name=\"submit\"\
  \ value=\"Login\">\n</form>\n\n<?php } // 结束提交 IF。 ?>\n\n</body>\n</html>\n```\n\
