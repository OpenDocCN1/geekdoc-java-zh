  \ `$_POST['something']` 中接收到每个选择。\n\n## 复习与进\n\n如果你对复习题或进阶提示有任何问题，请访问书籍的辅助论坛（[www.LarryUllman.com/forums/](http://www.LarryUllman.com/forums/)\
