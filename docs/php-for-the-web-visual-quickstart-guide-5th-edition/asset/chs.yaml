  \ 后都追加了 `?id=X`。\n\n***\n\n**提示**\n\n`mysqli_fetch_array()` 函数接收另一个参数，该常量指示指示应该返回什么种类型的数组。`MYSQLI_ASSOC`\
  \ 返回关联数组，而 `MYSQLI_NUM` 返回数字索引数组。\n\n***\n\n**提示**\n\n`mysqli_num_rows()` 函数返回 `SELECT`\
  \ 查询返回的记录数。\n\n***\n\n**提示**\n\n可以对返回的记录进行分页处理，以便每页显示 10 或 20 条（就像 Google 的工作方式一样）。不过，这样做需要比书中教授的高高级的代码。请参阅我的书籍\
  \ *PHP and MySQL for Dynamic Web Sites: Visual QuickPro Guide* (Peachpit Press,\
  \ 2012)，或者在线查找代码示例和教程。\n\n***\n\n### 在数据库中删除数据\n\n有时你可能也想在数据库上运行 `DELETE` 查询。此类查询会从数据库中删除记录。删除查询的语法为：\n\
  \n点击此处查看代码图像\n\n```sql\nDELETE FROM tablename WHERE column=value\n```\n\n`WHERE`\
  \ 子句不是必须的，但如果省略，你将删除表中的所有记录。你应该理解，一旦删除了记录，就没有办法恢复它（除非你有数据库的备份）。\n\n作为安全措施，如果你只想从表中删除单条记录，请向查询添加\
  \ `LIMIT` 子句：\n\n点击此处查看代码图像\n\n```sql\nDELETE FROM tablename WHERE column=value\
  \ LIMIT 1\n```\n\n该子句确保最多只删除一条记录。一旦你定义了查询，它将再次像其他任何查询一样使用 `mysqli_query()` 函数执行。\n\
  \n要查看 `DELETE` 查询是否生效，你可以使用 `mysqli_affected_rows()` 函数。该函数返回受 `INSERT`、`DELETE`\
  \ 或 `UPDATE` 查询影响的行数。它接受数据库连接作为参数。\n\n例如，让我们编写 `delete_entry.php` 脚本，它从 `view_blog.php`\
  \ 链接。此页面在 URL 中接收数据库记录。然后它显示该条目以确认用户想要删除它。如果用户点击按钮，记录将被删除。当用户到达此页面时，会显示博客条目，用户必须确认它。如果删除查询正常工作，用户将看到此结果。\n\
  \n从数据库中删除数据：\n\n**1. 在你的编辑器或 IDE 中开始一个新的 PHP 文档，命名为 `delete_entry.php` (脚本 12.7):**\n\
  \n点击此处查看代码图像\n\n```html\n<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"\
  utf-8\">\n  <title>Delete a Blog Entry</title>\n</head>\n<body>\n<h1>Delete an Entry</h1>\n\
  ```\n\n**脚本 12.7** `DELETE` SQL 命令从表中永久删除一条（或多条）记录。\n\n点击此处查看代码图像\n\n```php\n<!doctype\
  \ html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Delete\
  \ a Blog Entry</title>\n</head>\n<body>\n  <h1>Delete an Entry</h1>\n  <?php //\
  \ Script 12.7 - delete_entry.php\n  /* 此脚本删除博客条目。 */\n\n  // 连接并选择：\n  $dbc = mysqli_connect('localhost',\
  \ 'username', 'password', 'myblog');\n\n  if (isset($_GET['id']) && is_numeric($_GET['id']))\
  \ { // 在表单中显示条目：\n\n    // 定义查询：\n    $query = \"SELECT title, entry FROM entries\
  \ WHERE id={$_GET['id']}\";\n    if ($r = mysqli_query($dbc, $query)) { // 执行查询。\n\
  \      $row = mysqli_fetch_array($r); // 获取信息。\n\n      // 构建表单：\n      print '<form\
  \ action=\"delete_entry.php\" method=\"post\">\n        <p>你确定要删除这条条目吗？</p>\n  \
  \      <p><h3>' . $row['title'] . '</h3>' .\n        $row['entry'] . '<br>\n   \
  \     <input type=\"hidden\" name=\"id\" value=\"' . $_GET['id'] . '\">\n      \
  \  <input type=\"submit\" name=\"submit\" value=\"Delete this Entry!\"></p>';\n\
  \    } else { // 未获取信息。\n      print '<p style=\"color: red;\">无法检索博客条目因为:<br>'\
  \ . mysqli_error($dbc) . '</p><p>正在运行的查询为: ' . $query . '</p>';\n    }\n  } elseif\
  \ (isset($_POST['id']) && is_numeric($_POST['id'])) { // 处理表单。\n\n    // 定义查询：\n\
  \    $query = \"DELETE FROM entries WHERE id={$_POST['id']} LIMIT 1\";\n    $r =\
  \ mysqli_query($dbc, $query); // 执行查询。\n\n    // 报告结果：\n```\n\n\n\n\n```php\nif\
  \ (mysqli_affected_rows($dbc) == 1) {\n    print '<p>The blog entry has been deleted.</p>';\n\
  } else {\n    print '<p style=\"color: red;\">Could not delete the blog entry because:<br>'\
  \ .\n    mysqli_error($dbc) . '</p><p>The query being run was: ' . $query . '</p>';\n\
  }\n} else { // No ID received.\n    print '<p style=\"color: red;\">This page has\
  \ been accessed in error.</p>';\n} // End of main IF.\n\nmysqli_close($dbc); //\
  \ Close the connection.\n\n?>\n</body>\n</html>\n```\n\n### 2. 启动 PHP 代码并连接到数据库：\n\
  \n点击此处查看代码图片\n\n```php\n<?php // Script 12.7 - delete_entry.php\n\n$dbc = mysqli_connect\
  \ ('localhost', 'username', 'password', 'myblog');\n```\n\n### 3. 如果 URL 中接收到有效的条目\
  \ ID，定义并执行 SELECT 查询：\n\n点击此处查看代码图片\n\n```php\nif (isset($_GET['id']) && is_numeric\
  \ ($_GET['id']) ) {\n  $query = \"SELECT title, entry FROM entries WHERE id={$_GET['id']}\"\
  ;\n  if ($r = mysqli_query($dbc, $query)) {\n```\n\n为了显示博客条目，页面必须确认接收到了一个数字 ID。因为该值最初应该出现在\
  \ URL 中（当用户点击 `view_blog.php` 中的链接时，参见前一节中的 `![Image](img/ash_c.jpg)`，“从数据库中检索数据`），因此你引用了\
  \ `$_GET['id']`。在这里使用 `is_numeric()` 的作用不仅仅是确保可以检索记录；它是一项重要的安全措施。由于 `$_GET['id']`\
  \ 的值直接用于查询中（且没有引号），通过对该值进行 `is_numeric()` 测试可以防止查询崩溃或被用于攻击。\n\n该查询与前面的示例中使用的 `SELECT`\
  \ 查询相似，不同之处在于添加了 `WHERE` 子句来检索特定的记录。此外，由于只需要两个存储的值——标题和条目本身——因此只选择了这两个字段。\n\n随后，使用\
  \ `mysqli_query()` 函数执行该查询。\n\n### 4. 检索记录并在表单中显示条目：\n\n点击此处查看代码图片\n\n```php\n$row\
  \ = mysqli_fetch_array($r);\n\nprint '<form action=\"delete_entry.php\" method=\"\
  post\">\n<p>Are you sure you want to delete this entry?</p>\n<p><h3>' . $row['title']\
  \ . '</h3>' .\n$row['entry'] . '<br>\n<input type=\"hidden\" name=\"id\" value=\"\
  ' . $_GET['id'] . '\">\n<input type=\"submit\" name=\"submit\" value=\"Delete this\
  \ Entry!\"></p>\n</form>';\n```\n\n不要像你在上一个示例中那样使用 `while` 循环检索所有记录，而是使用调用一次 `mysqli_fetch_array()`\
  \ 函数将返回的记录赋值给 `$row` 变量。使用此数组，就可以显示要删除的记录。\n\n表单首先显示博客条目的详情，就像 `view_entries.php`\
  \ 脚本中显示的那样。当用户点击按钮时，表单将提交回此页面，此时应该删除记录。为了实现这一点，必须将作为 `$_GET['id']` 传递给脚本的博客标识数字存储在隐藏输入框中，以便它在提交时存在于\
  \ `$_POST` 数组中（因为到那时 `$_GET['id']` 将不再有值）。\n\n### 5. 如果查询失败，则报告错误：\n\n点击此处查看代码图片\n\
  \n```php\n} else { // Couldn't get the information.\n  print '<p style=\"color:\
  \ red;\"> Could not retrieve the blog entry because:<br>' . mysqli_error($dbc) .\
  \ '</p> <p>The query being run was: ' .\n  $query . '</p>';\n}\n```\n\n如果 `SELECT`\
  \ 查询运行失败，将打印 MySQL 错误和查询本身。\n\n### 6. 检查表单的提交：\n\n点击此处查看代码图片\n\n```php\n} elseif\
  \ (isset($_POST['id']) && is_numeric($_POST['id'])) { // Handle the form.\n```\n\
  \n此 `elseif` 子句是步骤 3 开始的条件判断的一部分。它对应于此脚本的第二次用法（表单被提交）。如果此条件为真，则应该删除记录。\n\n### 7.\
  \ 定义并执行查询：\n\n点击此处查看代码图片\n\n```php\n$query = \"DELETE FROM entries WHERE id={$_POST['id']}\
  \ LIMIT 1\";\n$r = mysqli_query($dbc, $query);\n```\n\n该查询删除 id 值为 `$_POST['id']`\
  \ 的记录。该 ID 值来自表单，它被存储在隐藏输入框中。通过在查询中添加 `LIMIT 1` 子句，你可以确保最多删除一条记录。\n\n### 8. 检查查询结果：\n\
  \n点击此处查看代码图片\n\n```php\nif (mysqli_affected_rows($dbc) == 1) {\n  print '<p>The\
  \ blog entry has been deleted.</p>';\n} else {\n  print '<p style=\"color: red;\"\
  > Could not delete the blog entry because:<br>' . mysqli_error($dbc) . '</p> <p>The\
  \ query being run was: ' .\n  $query . '</p>';\n}\n```\n\n`mysqli_affected_rows()`\
  \ 函数返回影响的行数。如果查询正常运行，则删除了一行。否则，将打印 `mysqli_error()` 和查询本身。\n\n### 9. 完成条件判断：\n\n\
  点击此处查看代码图片\n\n```php\n} else { // No ID received.\n    print '<p style=\"color:\
  \ red;\">This page has been accessed in error.</p>';\n} // End of main IF.\n```\n\
  \n如果向页面传递了 `$_GET['id']` 值，则报告错误。\n\n### 10. 关闭数据库连接：\n\n```php\nmysqli_close($dbc);\n\
