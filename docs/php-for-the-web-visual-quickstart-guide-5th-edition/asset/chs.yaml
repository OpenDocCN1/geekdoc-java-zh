  \n### 13. 如果你想的话，可以在文本编辑器中打开 `quotes.txt` 文件，以确认数据已写入其中。\n\n***\n\n**提示**\n注意，所有与文件和目录相关的函数只能用在运行\
  \ PHP 的同一台计算机（即服务器）上的文件和目录上。服务器上的 PHP 脚本无法访问客户端计算机上的文件（直到文件被上传到服务器之前）。\n\n***\n\n\
  **提示**\n如果你在运行此脚本时 ![Image](img/ash_b.jpg) 收到权限错误，要么是权限设置不当，要么是 PHP 脚本无法访问数据文件。后者可能在你拼错文件名或在服务器上错误地引用文件路径时发生。\n\
  \n***\n\n**提示**\n如果你的 PHP 版本运行在安全模式（safe mode）下或设置了 `open_basedir` 指令，你使用 PHP 访问文件和目录可能会受到限制。检查你的\
  \ `phpinfo()` 脚本以查看服务器的这些设置。\n\n***\n\n### 锁定文件\n\n虽然上一个示例运行良好（希望如此），但它还可以改进。如果一次只有一个用户提交表单，那么就不会有问题。但如果有两个或多个用户同时提交不同的引言怎么办？在这种情况下，当多个\
  \ PHP 脚本实例尝试同时写入同一个文本文件时，可能会出现问题。文件可能会损坏。\n\n当存在多个脚本同时写入同一个文件的风险时，解决方案是在 PHP 写入文件时临时锁定文件。要做到这一点，请将\
  \ `LOCK_EX` 常量作为第三参数添加到 `file_put_contents()` 中：\n\n点击此处查看代码图片\n\n```php\nfile_put_contents($file,\
  \ $data, LOCK_EX);\n```\n\n要同时使用 `LOCK_EX` 和 `FILE_APPEND` 常量，请使用按位 OR 运算符 (`|`)\
  \ 将它们分开：\n\n点击此处查看代码图片\n\n```php\nfile_put_contents($file, $data, FILE_APPEND |\
  \ LOCK_EX);\n```\n\n你提供这两个常量的顺序并不重要（请参见侧边栏“按位运算符”）。\n\n不同的锁定类型由 **表 11.2** 中列出的常量表示。共享锁\
  \ `LOCK_SH` 用于从文件中读取，这意味着如果多个文件同时使用该文件（且都带有共享锁）是可以的。相反，排斥锁 `LOCK_EX` 意味着只有被锁定的文件应该访问权限。\n\
  \n![Image](img/11tab02.jpg)\n\n**表 11.2 flock() 锁定类型**\n\n`LOCK_UN` 常量用于释放任何类型的锁。它被提供给\
  \ `flock()` 函数，在本章中未使用（更多信息请参阅 PHP 手册）。\n\n***\n\n## 按位运算符\n\n一组较少为人知但通常非常有用的运算符是按位运算符。初学者最可能在常量作为参数传递的情况下使用它们，例如文件锁定的示例。\n\
  \n按位运算符对位（bits）操作——位是最小的数据类型，也称为二进制数字。运算符的外观和功能与标准运算符相似：按位 `&` 代替 `&&`，按位 `|` 代替\
  \ `||`。\n\n按位运算符通常与 `LOCK_EX` 和 `FILE_APPEND` 等常量一起使用，因为每个常量都代表一个数值。而该数值反过来是一种指示允许操作的标志。代码\
  \ `FILE_APPEND | LOCK_EX` 表明了哪些允许的操作。\n\n\n\n\n\n![Image](img/11fig11.jpg)\n\n![Image](img/a.jpg)\
  \ 再次使用该形式...\n\n![Image](img/11fig12.jpg)\n\n![Image](img/b.jpg) ...引用仍然无问题地存储。\n\
  \n***\n\n### 提示\n从技术上讲，如果文件是以追加模式打开的（如示例所示），即使多个脚本同时向文件写入内容，不锁定它可能也没有问题。尽管如此，还是无一无然！\n\
  \n***\n\n***\n\n### 提示\n为了确保文件锁定可靠，每个向文件写入数据的脚本都必须使用锁定。\n\n***\n\n### 从文件中读取\n\n\
  现在你已经创建了一个向文件写入数据的脚本，现在是时候创建一个可以读取这些信息的脚本了。读取文件有多种方法；采用哪种方法取决于你的需求。要将整个文件作为一个字符串读取进来，请使用\
  \ `file_get_contents()`：\n\n点击此处查看代码图片\n\n```php\n$data = file_get_contents($file);\n\
  ```\n\n或者，如果文件的每行都有某些数据（如 `quotes.txt` 所示），那么使用 `file()` 函数会更好：\n\n```php\n$data\
  \ = file($file);\n```\n\n`file()` 函数是 PHP 中一个非常有用的内置工具。它读取文件中的所有内容，与 `file_get_contents()`\
  \ 不同，它将这些信息以数组的形式返回。每个数组元素包含文件的一行，每行以换行符（`\\n` 或 `\\r\\n`）结束。\n\n如果 `$file` 代表的文档包含两行信息，且每行都以换行符结束，那么相应的数组将包含两个元素。第一个元素将等于\
  \ `$file` 的第一行，第二个元素将等于 `$file` 的第二行。一旦数据存储在数组，你就可以轻松地对其进行操作或打印，就像你在第 7 章中中学到的“使用数组”那样样。\n\
  \n接下来，让我们利用这些知识创建一个随机显示存储的引言之一的脚本。\n\n从文件中读取：\n\n**1.** 在你的文本编辑器或 IDE 中创建一个新的 PHP\
  \ 文档，命名为 `view_quote.php` (**脚本 11.3**)：\n\n点击此处查看代码图片\n\n```html\n<!doctype html>\n\
  <html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>View A Quotation</title>\n\
  </head>\n<body>\n<h1>Random Quotation</h>\n```\n\n**脚本 11.3** `view_quote.php` 文件从文本文件中检索所有引言并随机显示其中之一。\n\
