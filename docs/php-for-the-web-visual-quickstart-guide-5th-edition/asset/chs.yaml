  ```\n\n\n\n为了正确使用 `switch` 条件语句，你必须理解它的工作原理。在关键字 `switch` 之后，圆括号内会标识一个变量。随后，PHP\
  \ 将按顺序检查每个 `case`，尝试寻找匹配的值。请注意，与 PHP 中处理任何其他字符串和数字的方式一样，数值值不需要加引号；而字符串值则需要加上。在 `case`\
  \ 值部分之后，用冒号 `:`（而不是分号 `;`）来引出相关的语句，这些语句通常从下一行开始缩进。\n\n一旦 PHP 找到一个与条件变量值匹配的 `case`，它就会执行随后的语句。棘手的地方在于：一旦\
  \ PHP 找到了匹配的 `case`，它将继续执行 `switch` ，直到遇到 `switch` 条件语句的结束（右大括号 `}`）或遇到一个 `break`\
  \ 语句，在此时，它将退出 `switch` 结构。因此，你必须用 `break` 结束每个 `case` —— 为了一致性考虑，即使是 `default` 情况也是如此（侧边栏的“Break,\
  \ Exit, Die, and Continue”更详细讨论了该关键字）。\n\n上一个 `switch` 条件语句类似于以下代码的重写：\n\n点击此处查看代码图像\n\
  \n```php\nif ($var == value1) {\n  statement(s)1;\n} elseif ($variable == value2)\
  \ {\n  statement(s)2;\n} else {\n  statement(s)3;\n}\n```\n\n由于 `switch` 条件语句使用\
  \ `$var` 的值作为其条件，它会首先检查 `$var` 是否等于 `value1`，如果是，则执行 `statement(s)1`。如果不是，它会检查 `$var`\
  \ 是否等于 `value2`，如果是，则执行 `statement(s)2`。如果两个条件都不满足，`switch` 条件语句的 `default` 动作将执行\
  \ `statement(s)3`。\n\n考虑到这一点，让我们把颜色条件语句重写为 `switch`。\n\n### 如何使用 switch 条件语句：\n\n\
  1. 在你的文本编辑器或 IDE 中打开 `handle_reg.php`（脚本 6.7），如果它尚未打开。\n2. 删除扩展的颜色条件语句（**脚本 6.8**）。\n\
  \n**脚本 6.8** `switch` 条件语句可以简化复杂的 `if-elseif` 条件语句。\n\n点击此处查看代码图像\n\n* * *\n\n```html\n\
  <!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Registration</title>\n\
  \  <style type=\"text/css\" media=\"screen\">\n    .error { color: red; }\n  </style>\n\
  </head>\n<body>\n<h1>Registration Results</h1>\n<?php // Script 6.8 - handle_reg.php\
  \ #7\n/* 此脚本从 register.html 接收了七个值：\n   email, password, confirm, year, terms,\n\
  \   color, submit */\n\n// 如果你想，可以处理错误管理。\n\n// 用于跟踪成功的标志变量：\n$okay = true;\n\n\
  // 验证电子邮件地址：\nif (empty($_POST['email'])) {\n  print '<p class=\"error\">请输入您的电子邮件地址。</p>';\n\
  \  $okay = false;\n}\n\n// 验证密码：\nif (empty($_POST['password'])) {\n  print '<p\
  \ class=\"error\">请输入您的密码。</p>';\n  $okay = false;\n}\n\n// 检查两个密码是否相等：\nif ($_POST['password']\
  \ != $_POST['confirm']) {\n  print '<p class=\"error\">您确认的密码与原始密码不符。</p>';\n  $okay\
  \ = false;\n}\n\n// 验证年份：\nif (is_numeric($_POST['year']) && (strlen($_POST['year'])\
  \ == 4)) {\n  // 检查是否在 2016 年之前。\n  if ($_POST['year'] < 2016) {\n    $age = 2016\
  \ - $_POST['year']; // 计算年龄。\n  } else {\n    print '<p class=\"error\">输入的出生年份错误，或者你来自未来！</p>';\n\
  \    $okay = false;\n  } // 第二个条件结束。\n} else { // 第一个条件的 else。\n  print '<p class=\"\
  error\">请以四位数输入您的出生年份。</p>';\n  $okay = false;\n} // 第一个条件结束。\n\n// 验证条款：\nif (!isset($_POST['terms']))\
  \ {\n  print '<p class=\"error\">您必须接受条款。</p>';\n  $okay = false;\n}\n\n// 验证颜色：\n\
  switch ($_POST['color']) {\n  case 'red':\n    $color_type = 'primary';\n    break;\n\
  \  case 'yellow':\n    $color_type = 'primary';\n    break;\n  case 'green':\n \
  \   $color_type = 'secondary';\n    break;\n  case 'blue':\n    $color_type = 'primary';\n\
  \    break;\n  default:\n    print '<p class=\"error\">请选择您喜欢的颜色。</p>';\n    $okay\
  \ = false;\n    break;\n} // switch 结束。\n\n// 如果没有错误，打印成功消息：\nif ($okay) {\n  print\
  \ '<p>注册成功！</p>';\n}\n?>\n</body>\n</html>\n```\n\n* * *\n\n3. 开始 switch：\n```php\n\
  switch ($_POST['color']) {\n```\n如前所述，`switch` 接受一个变量：`$_POST['color']`。\n\n4. 创建第一个\
  \ case：\n```php\n  case 'red':\n    $color_type = 'primary';\n```\n第一个 case  `$_POST['color']`\
  \ 是否为 `red`。如果是，则执行该语句。\n\n5. 为第二个颜色添加 case：\n```php\n  case 'yellow':\n    $color_type\
  \ = 'primary';\n    break;\n```\n`break` 用于退出 switch。\n\n6. 为剩余颜色添加 case：\n```php\n\
  \  case 'green':\n    $color_type = 'secondary';\n    break;\n  case 'blue':\n \
  \   $color_type = 'primary';\n    break;\n```\n* * *\n\n### Break, Exit, Die, and\
  \ Continue\n\nPHP 包含了许多语言结构——它们不是函数但在脚本中仍起作用。例如，`print` 是一个语言结构。另一个例子是 `break`，它可以退出当前的结构，无论是\
  \ `switch`、`if-else` 条件语句还是循环。\n\n与其相似的是 `continue`，它终止循环的当前迭代。循环内的剩余语句不会执行，但会再次检查循环条件判断是否继续。\n\
  \n`exit` 和 `die` 是 `break` 更强大的版本（且它们是同义词）。这两个结构不是退出当前的结构，而是终止 PHP 脚本的执行。因此，`exit`\
  \ 或 `die` 之后的任何 PHP 代码都不会执行。同样，这些结构之后的任何 HTML 都不会发送到浏览器。你会看到 `die` 最被用作粗暴的错误处理工具。`exit`\
  \ 通常与 `header()` 函数配合使用。你可以在第 8 章“创建 Web 应用](#ch08.html_ch08)”中看到相关的例子。\n\n* * *\n\
  \n7. 添加默认情况并完成 switch：\n点击此处查看代码图像\n\n```php\n  default:\n    print '<p class=\"\
  error\">请选择您喜欢的颜色。</p>';\n    $okay = false;\n    break;\n} // switch 结束。\n```\n\
  这个 `default` 情况相当于原始条件语句中使用的 `else` 子句。\n\n8. 保存你的脚本，将其放在与 `register.html` 相同的目录下（在启用了\
  \ PHP 的服务器上），并在浏览器中再次测试。\n\n* * *\n\nTip\n\n`default` 情况在你的 `switch` 条件语句中不是必须的，但如果使用了，它应该是最后一个\
  \ case。你可以设置一个 `switch`，使得如果值没有被任何 `case` 显式匹配，则什么都不会发生。\n\n* * *\n\nTip\n\n* *\
  \ *\n\n\n\n\n如果你在 `switch` 条件语句中使用字符串作为 `case` 值，请记住它是区分大小写的，这意味着 `Value` 不会匹配 `value`。\n\
  \n***\n\n### 提示\n你可以构建 `switch` 条件结构，使得多个 `case` 具有相同的结果。然而，这种需要对 PHP 行为有深厚理解的编程方式对于初学者来说显得过于“小聪明”了。\n\
  \n***\n\n### for 循环\n循环是本章讨论的最后一种控制结构。正如前面提到的，循环用于重复执行一段代码。你可能想按特定次数打印某些内容，也可能想对\
  \ `array`（数组是一个值列表）中的每个值进行某些操作。对于这两种情况以及许多其他情况，你都可以使用循环。（后一种示例示例将在下一章中演示。）\n\nPHP\
  \ 支持三种循环：`for`、`while` 和 `foreach`。`while` 循环与 `for` 相似，但在从数据库检索值或从文本文件中读取内容时使用最频繁（它在侧边栏“The\
  \ while Loop”中介绍过，并在下一章进行详细介绍）。`foreach` 循环与使用 `arrays` 相关，将在下一章介绍。\n\n`for` 循环设计用于执行指定次数迭代的一个或多个语句（与\
  \ `while` 不同，后者运行到条件为 FALSE 为止——这两者的概念相似但有显著区别）。你通常在循环中使用一个哑变量来实现此目的：\n\n```php\n\
  for (initial expression; condition; closing expression) {\n  statement(s);\n}\n\
  ```\n\n初始表达式执行一次：即在第一次调用循环时执行。然后使用条件来决定是否执行语句。结束表达式在每次发现条件为 TRUE 时都会执行，但仅在语句执行之后才执行。\n\
  \n此流程图表示了 `for` 循环在 PHP 中的执行方式。\n\n这里有一个打印 1 到 10 数字的简单循环：\n\n```php\nfor ($i =\
  \ 1; $i <= 10; $i++) {\n  print $i;\n}\n```\n\n为了练习 `for` 循环，让我们扩展注册表单，让用户输入完整的出生日期。可以使用\
  \ `for` 循环轻松地在 HTML 表单中创建一个日期的下拉菜单。\n\n编写一个 `for` 循环：\n\n1. 在你的文本编辑器或 IDE 中打开 `register.html`\
  \ (Script 6.1)，如果它尚未打开。\n2. 删除现有的出生年份提示和输入框（Script 6.9**）。\n\n**Script 6.9** 此脚本使用\
  \ PHP `for` 循环动态生成每月日的下拉菜单。\n\n```html\n<!doctype html>\n<html lang=\"en\">\n<head>\n\
  \  <meta charset=\"utf-8\">\n  <title>Registration Form</title>\n</head>\n<body>\n\
  \  <!-- Script 6.9 - register.php -->\n  <div><p>Please complete this form to register:</p>\n\
  \  <form action=\"handle_reg.php\" method=\"post\">\n    <p>Email Address: <input\
  \ type=\"text\" name=\"email\" size=\"30\"></p>\n    <p>Password: <input type=\"\
  password\" name=\"password\" size=\"20\"></p>\n    <p>Confirm Password: <input type=\"\
  password\" name=\"confirm\" size=\"20\"></p>\n    <p>Date Of Birth:\n      <select\
  \ name=\"month\">\n        <option value=\"\">Month</option>\n        <option value=\"\
  1\">January</option>\n        <option value=\"2\">February</option>\n        <option\
  \ value=\"3\">March</option>\n        <option value=\"4\">April</option>\n     \
  \   <option value=\"5\">May</option>\n        <option value=\"6\">June</option>\n\
  \        <option value=\"7\">July</option>\n        <option value=\"8\">August</option>\n\
  \        <option value=\"9\">September</option>\n        <option value=\"10\">October</option>\n\
  \        <option value=\"11\">November</option>\n        <option value=\"12\">December</option>\n\
  \      </select>\n      <select name=\"day\">\n        <option value=\"\">Day</option>\n\
  \        <?php\n        for ($i = 1; $i <= 31; $i++) {\n          print \"<option\
  \ value=\\\"$i\\\">$i</option>\\n\";\n        }\n        ?>\n      </select>\n \
  \   </p>\n    <p>Favorite Color:\n      <select name=\"color\">\n        <option\
  \ value=\"\">Pick One</option>\n        <option value=\"red\">Red</option>\n   \
  \     <option value=\"yellow\">Yellow</option>\n        <option value=\"green\"\
  >Green</option>\n        <option value=\"blue\">Blue</option>\n        <option value=\"\
  orange\">Orange</option>\n        <option value=\"purple\">Purple</option>\n   \
  \   </select>\n    </p>\n    <input type=\"text\" name=\"year\" size=\"4\">\n  \
  \  <p><input type=\"checkbox\" name=\"terms\"> I agree to the terms.</p>\n    <input\
  \ type=\"submit\" name=\"submit\">\n  </form>\n  </div>\n</body>\n</html>\n```\n\
  \n\n\n\n![Image](img/c.jpg) 如果你查看表单的 HTML 源代码，你会看到由 循环生成的数据。\n\n> 提示\n在 for 循环中使用简单的变量作为计数器是惯例：`$i`、`$j`、`$k`\
  \ 等。\n\n> 提示\n就像如果你只有一个语句时可以将 `if` 条件写在一行一样，你对 `while` 和 `for` 循环也可以这样做。但再次强调，这并不建议这样做。\n\
  \n> 提示\n循环可以相互嵌套。你也可以将条件语句放在循环中，循环放在条件语句中，以此类推。\n\n> 提示\n请密切关注你的循环条件，以便循环在某个时刻结束。否则，你将创建一个死循环，脚本将一直运行下去。\n\
  \n# while 循环\n\nPHP 中存在的三种类型循环的第二种——`while` 循环，其设计为只要你建立的条件为 TRUE，它就会继续工作。和 `for`\
  \ 循环一样，它在每次迭代之前都会检查条件的值。一旦条件变为 FALSE，`while` 循环就会退出：\n\n```\nwhile (condition) {\n\
  \  statement(s);\n}\n```\n\n`for` 和 `while` 的主要区别在于 `while` 不包含设置初始条件或执行结束表达式的系统。\n\
  \n你也可以选择使用 `do...while` 循环，它保证语句至少被执行一次（这对于 `while` 循环并不一定成立）：\n\n```\ndo {\n  statement(s);\n\
  } while (condition);\n```\n\n虽然在何时可以使用两种主要循环结构（`while` 和 `for`）方面存在相当重叠，但在编程过程中你会发现，有时其中一种比另一种更符合逻辑。`while`\
  \ 循环经常用于从数据库检索数据（参见第 12 章，“数据库简介”）。\n\n## 复习与练习\n\n如果你在复习题或练习提示中遇到任何问题，请访问本书的辅助论坛（[www.LarryUllman.com/forums/](http://www.LarryUllman.com/forums/)））。\n\
