  \ 设置了错误的级别，请参阅第 3 章查看在此处需要包含的行，以更改这些设置。\n```\n\n### 3. 将表单数据赋值给本地变量：\n\n点击此处查看代码图片\n\
  \n```php\n$first_name = $_POST['first_name'];\n$last_name = $_POST['last_name'];\n\
  $posting = $_POST['posting'];\n```\n\n表单使用了 `POST` 方法，因此所有表单数据都可以在 `$_POST` 中可用。\n\
  \n此示例没有包含电子邮件地址的行，因为你还没有使用它，但你可以复制此代码来引用该值。\n\n### 4. 使用连接符创建一个新的 $name 变量：\n\n\
  ```php\n$name = $first_name . ' ' . $last_name;\n```\n\n这种连接操作将两个变量加上一个空格并连接在一起，创建一个名为\
