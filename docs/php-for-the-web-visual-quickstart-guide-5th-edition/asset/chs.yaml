  \n![Image](img/06fig13.jpg) ...现在新增了两个新的验证检查。\n\n***\n\n**提示**\n\n在比较来自表单的两个字符串值（例如密码和确认密码）之前，对两者都应用\
  \ `trim()` 函数是一个好主意。我在这里没有这样做是为了避免让问题复杂化。对于用户名或邮箱地址等使用的值，应用 `trim()` 也是明智的。\n\n\
  ***\n\n**提示**\n\n检查文本输入是否已填充（而不是使用 `empty()` 函数）的另一种方法是这种：\n\n```php\nif (strlen($var)\
  \ > 0 ) { // $var 是好的\n```\n\n***\n\n**提示**\n\nPHP 7 新增了“宇宙”运算符：`<=>`。如果左操作数小于右操作数，该运算符返回\
  \ -1；如果左操作数大于右操作数，返回 1；如果两者相等，则返回 0。密码条件可以这样写：\n\n点击此处查看代码图片\n\n```php\nif ($_POST['password']\
  \ <=> $_POST['confirm']) == 0 { // 只是这没必要那么复杂！\n```\n\n***\n\n### 逻辑\n\n在 PHP 中编写条件归结为识别真（TRUE）或假（FALSE）。你可以通过已经见过的函数和比较运算符来实现这一点。逻辑运算符——本章讨论的最后一种运算符——可以帮助你创建更复杂或显而易见的结构。\n\
  \n***\n\n### 嵌套条件语句\n\n除了使用逻辑运算符创建复杂条件外，你还可以使用嵌套来实现此目的（将一个控制结构放在另一个结构内部的过程）。其关键是将内部条件放置在外部语句的语句部分。例如：\n\
  \n```php\nif (condition1) {\n    if (condition2) {\n        // statement2\n    }\
  \ else {\n        // other_statement2\n    } // 结束 2\n} else {\n    // other_statement1\n\
  } // 结束 1\n```\n\n从这个示例中可以看出，你可以通过缩进和注释来减少这些结构的复杂性。只要每个条件在语法上是正确的，对于嵌套多少层级没有规定，无论你是否使用\
  \ `else` 子句，甚至无论子条件是主条件的 `if` 部分还是 `else` 部分。\n\n***\n\n在 PHP 中，TRUE 条件的一个示例是具有非零、非空字符串或\
  \ FALSE 值的变量，例如：\n\n```php\n$var = 5;\nif ($var) { ... }\n```\n\n在处理 PHP 脚本时使用的\
  \ `$okay` 变量。如果一个条件满足逻辑，那么它也是 TRUE：\n\n```php\nif ($okay) { ... }\n```\n\n在 PHP\
  \ 中，`!` 是非运算符。可以使用它来反转语句的 TRUE/FALSE 状态。例如：\n\n```php\n$var = 'value';\nif (!$var)\
  \ { ... }\n```\n\n此外，还可以使用 `isset()` 和 `empty()` 函数来检查变量是否设置以及是否为空：\n\n```php\n\
  if (isset($var)) { ... }\nif (!empty($var)) { ... }\n```\n\n为了超出简单的单部分条件，PHP 支持更多种类型的逻辑运算符：`and`\
  \ 的两个版本（`AND` 和 `&&`），`or` 的两个版本（`OR` 和 `||`——一个双管道符号），以及逻辑异或 `XOR`。当你有两个选项时（如使用\
  \ `and` 和 `or`），它们之间的区别仅在于优先级。在大多数情况下，你可以交替使用 `and` 或 `or` 的版本。\n\n通过括号和逻辑运算符，你可以创建更复杂的条件。对于\
  \ `AND` 条件，每个连接部分都为 TRUE，整个条件才为 TRUE。对于 `OR`，至少有一个部分为 TRUE，整个条件就为 TRUE。以下条件是 TRUE：\n\
  \n点击此处查看代码图片\n\n```php\nif ( (5 <= 3) || (5 >= 3) ) { ... }\nif ( (5 > 3) && (5\
  \ < 10) ) { ... }\n```\n\n以下条件是 FALSE：\n\n点击此处查看代码图片\n\n```php\nif ( (5 != 5) &&\
  \ (5 > 3) ) { ... }\nif ( (5 != 5) || (5 < 3) ) { ... }\n```\n\n当你构造条件语句时，请记住两个重要点：第一，为了执行条件结果的语句，整个条件必须具有\
  \ TRUE 值；其次，通过括号，你可以忽略优先级，并确保按照你选择的顺序处理运算符。\n\n为了演示逻辑运算符，让我们为 `handle_reg.php` 添加更多条件。你还将把一个年份条件嵌套在另一个条件内部（更多请参阅侧边栏“嵌套条件语句”）。\n\
  \n使用逻辑运算符：\n\n**1.** 在你的文本编辑器或 IDE 中打开 `handle_reg.php` (脚本 6.5)，如果它尚未打开。\n\n**2.**\
  \ 删除现有的年份验证（**脚本 6.6](#ch06.html_ch06scr06)**）。\n\n**脚本 6.6** 这里处理 PHP 脚本被更改，使得年份验证程序使用了多个和嵌套条件。此外，服务条款复选框现在也经过验证。\n\
  \n点击此处查看代码图片\n\n```html\n<!doctype html>\n<!doctype html>\n```\n\n\n\n\n\n```html\n\
  <html lang=\"en\">\n<head>\n    <meta charset=\"utf-8\">\n    <title>注册</title>\n\
  \    <style type=\"text/css\" media=\"screen\">\n        .error { color: red; }\n\
  \    </style>\n</head>\n<body>\n<h1>注册结果</h1>\n<?php // 脚本 6.6 - handle_reg.php\
  \ #5\n/* 此脚本从 register.html \n   接收七个值：\n   email, password, confirm, year, terms,\n\
  \   color, submit */\n\n// 地址错误管理，如果你需要的话。\n\n// 用于跟踪成功的标志位变量：\n$okay = true;\n\n\
  // 验证邮箱地址：\nif (empty($_POST['email'])) {\n    print '<p class=\"error\">请输入您的电子邮件地址。</p>';\n\
  \    $okay = false;\n}\n\n// 验证密码：\nif (empty($_POST['password'])) {\n    print\
  \ '<p class=\"error\">请输入您的密码。</p>';\n    $okay = false;\n}\n\n// 检查两个密码是否相等：\n\
  if ($_POST['password'] != $_POST['confirm']) {\n    print '<p class=\"error\">您的确认密码与原始密码不符。</p>';\n\
  \    $okay = false;\n}\n\n// 验证年份：\nif ( is_numeric($_POST['year']) AND (strlen($_POST['year'])\
  \ == 4) ) {\n    // 检查是否出生在 2016 年之前。\n    if ($_POST['year'] < 2016) {\n      \
  \  $age = 2016 - $_POST['year'];\n        // 计算今年的年龄。\n    } else {\n        print\
  \ '<p class=\"error\">要么您输入的出生年份错误，要么您来自未来！</p>';\n        $okay = false;\n    }\
  \ // 第二条件判断结束。\n} else { // 第一个条件对应的 else。\n    print '<p class=\"error\">请以四位数字输入您的出生年份。</p>';\n\
  \    $okay = false;\n} // 第一个条件判断结束。\n\n// 验证条款：\nif ( !isset($_POST['terms']))\
  \ {\n    print '<p class=\"error\">您必须接受条款。</p>';\n    $okay = false;\n}\n\n// 如果没有错误，则打印成功消息：\n\
  if ($okay) {\n    print '<p>您注册成功（但并非如此）。</p>';\n    print \"<p>您将是 $age 岁了。</p>\"\
  ;\n}\n?>\n</body>\n</html>\n```\n\n你将完全重写这些条件判断为一个嵌套的条件判断，因此最好是弃弃旧版本。\n\n### 3.\
  \ 检查年份变量是否为四位数字：\n```php\nif ( is_numeric($_POST['year']) AND (strlen($_POST['year'])\
  \ == 4) )\n```\n这个条件判断包含两个部分。第一部分你已经见过——它测试是否为数值。第二部分使用 `strlen()` 获取年份变量的长度，并检查长度是否等于\
  \ `4`。由于 `AND` 逻辑的存在，只有当两个条件都满足时，该条件才为真（TRUE）。\n\n### 4. 创建一个子条件来检查年份值是否在 2016 年之前：\n\
  ```php\nif ($_POST['year'] < 2016) {\n    $age = 2016 - $_POST['year'];\n} else\
  \ {\n    print '<p class=\"error\">要么您输入的出生年份错误，要么您来自未来！</p>';\n    $okay = false;\n\
  } // 第二条件判断结束\n```\n这个 `if-else` 条件判断作为主条件判断的一部分，因此只有在该主条件为真（TRUE）时才会被执行。这个 `if-else`\
  \ 检查年份变量是否小于 `2016`（即用户必须出生在当前年份之前）。如果该条件为真，则计算 `$age`。否则，将打印错误消息并将 `$okay` 变量设置为假（FALSE），表示发生了问题。注意，这个条件判断与上一个版本完全相反：是验证一个值小于某个数字，而不是大于或等于该数字。\n\
  \n### 5. 完成主年份的条件判断：\n```php\nelse { // 第一个条件对应的 else。\n    print '<p class=\"error\"\
  >请以四位数字输入您的出生年份。</p>';\n    $okay = false;\n} // 第一个条件判断结束。\n```\n这个 `else` 完成了在步骤\
  \ 3 中开始的条件判断。如果所列出的条件中至少有一个为假（FALSE），就会打印此消息，并将 `$okay` 设置为假（FALSE）。\n\n### 6. 确认条款复选框没有被忽略：\n\
  ```php\nif (!isset($_POST['terms'])) {\n    print '<p class=\"error\">您必须接受条款。</p>';\n\
  \    $okay = false;\n}\n```\n如果 `$_POST['terms']` 变量未设置，则用户未能勾选该框，应该报告错误。更准确地说，这个条件判断可以是：\n\
  ```php\nif ( !isset($_POST['terms']) AND ($_POST['terms'] != 'Yes') ) {\n```\n\n\
  ### 7. 这些是对脚本的唯一修改，你现在可以再次保存它，将其放在与 `register.html` 相同的目录下（在你启用 PHP 的服务器上），并在浏览器中再次测试。PHP\
