  \ 更新 `login.php`，使其在登录失败时也显示表单。\n\n## 9. Cookies 和 Sessions\n\n***\n\n### 本章内容\n\
  \n* 什么是 Cookie？\n* 创建 Cookie\n* 从 Cookie 中读取\n* 向 Cookie 添加参数\n* 删除 Cookie\n* 什么是\
  \ Session？\n* 创建 Session\n* 访问 Session 变量\n* 删除 Session\n* 回顾与进阶\n\n***\n\n第 8 章，“创建\
  \ Web 应用程序](#ch08.html_ch08)”涵盖了许多开发更完善网站的技术。缺失的一个部分——也是本章的重点——是在用户跨越多页网站时如何维持“状态”。超文本传输协议（HTTP）是一种无状态技术，这意味着它没有内置方法来跟踪用户或记住应用程序页面之间的数据。这是一个严重的问题，因为电子商务应用程序、用户注册登录系统以及常用的在线服务依赖于能够跟踪同一个用户。幸运的是，使用\
  \ PHP 维持状态非常。\n\n本章讨论了跟踪数据的两种主要方法：cookies 和 sessions。你将开始学习如何创建、读取、修改和删除 cookies。然后你将看到掌握\
  \ sessions 是多么容易，它是维持状态的一种更强大的选项。\n\n### 什么是 Cookie？\n\n在 Cookie 出现之前，浏览网站就像就像是一次没有历史的旅行。虽然浏览器会跟踪你访问的页面，允许你使用后退按钮返回之前访问的页面，并用不同颜色标记已过的链接，但服务器并不会跟踪单个用户看到和所做的。对于不使用\
  \ cookie 的网站，以及在网页浏览器中禁用了 cookie 的用户，情况依然如此 ![Image](img/a.jpg)。\n\n![Image](img/a.jpg)\
