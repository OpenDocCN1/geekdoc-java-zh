  \ 类似，但安全性远不如后者。\n\n### 从数据库中检索数据\n\n本章演示的下一个过程是从已填充的表中检索数据。你仍然使用 `mysqli_query()`\
  \ 函数来运行查询，但检索数据与插入数据稍有不同——你需要将查询结果赋值给变量，然后使用另一个函数来获取数据。\n\n检索数据的基本语法是 `SELECT` 查询：\n\
  \n点击此处查看代码图片\n\n```sql\nSELECT 什么列 FROM 什么表\n```\n\n从表中读取数据最简单的查询是：\n\n```sql\n\
  SELECT * FROM tablename\n```\n\n星号等同于说*所有列*。如果你只需要返回某些列，可以像这样限制你的查询：\n\n```sql\n\
  SELECT name, email FROM users\n```\n\n该查询请求仅收集来自两个列（`name` 和 `email`）的信息。请记住，这种结构并没有限制返回的行（或记录），只是限制了这些行对应的列。\n\
  \n另一种修改查询的方法是添加一个限制条件，以限制返回的行，这通过使用 `WHERE` 子句来实现：\n\n点击此处查看代码图片\n\n```sql\nSELECT\
  \ * FROM users WHERE name= 'Larry'\n```\n\n你想要获取表中每一列的信息，但只需要 name 列等于 Larry 的行。这是\
  \ SQL 如何有效且灵活地使用少数术语的良好示例。\n\n从数据库中检索数据与向数据库插入数据的主要区别在于，你需要不同的方式处理查询。你应该首先将查询结果赋值给一个变量：\n\
  \n点击此处查看代码图片\n\n```php\n$result = mysqli_query($dbc, $query);\n```\n\n正如 `$dbc`\
  \ 是已打开数据库连接的引用，`$result` 是查询结果集的引用。然后将此变量提供给 `mysqli_fetch_array()` 函数，该函数检索查询结果：\n\
  \n点击此处查看代码图片\n\n```php\n$row = mysqli_fetch_array($result);\n```\n\n该函数每次从结果集中获取一行，并在此过程中创建一个数组。该数组将使用选定的列名作为索引：`$row['name']`、`$row['email']`\
  \ 等。与任何数组一样，你必须按照定义时的精确方式来引用列。正如 `$dbc` 是已打开数据库连接的引用，`$result` 是查询结果集的引用。然后将此变量提供给\
  \ `mysqli_fetch_array()` 函数，该函数检索查询结果：\n\n点击此处查看代码图片\n\n```php\n$row = mysqli_fetch_array($result);\n\
