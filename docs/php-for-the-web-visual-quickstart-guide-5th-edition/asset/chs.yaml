  ## 13. 整合\n\n***\n\n本章内容\n\n* 入门\n* 连接数据库\n* 编写自定义函数\n* 创建模板\n* 登录\n* 退出\n* 添加引用\n\
  * 列出引用\n* 编辑引用\n* 删除引用\n* 创建首页\n* 复习与进阶\n\n***\n\n到目前为止，前 12 章涵盖了使用 PHP 进行开发的基础知识。在本章中，我们将学习如何创建一个功能应用程序。\n\
  \n### 入门\n\n任何项目的第一步都是确定目标。本章的重点是应用目前所学的内容。\n\n### 连接数据库\n\n建立数据库连接的 `mysqli_connect.php`\
  \ 脚本应存储在 Web 根目录之外。如果这种情况不允许，你可以将其放在 `includes` 文件夹中，然后相应修改其他脚本。\n\n### 编写自定义函数\n\
  \n网站将使用一个包含在文件中自定义函数。\n\n### 创建模板\n\n网站将使用模板为每个页面提供一致的外观，由 CSS 处理格式。\n\n### 登录\n\
  \n网站将有一个管理员。\n\n### 退出\n\n非管理员被拒绝访问页面。\n\n### 添加引用\n\n数据库将命名为 `myquotes`（或其他你喜欢的名称）。你可以使用\
  \ SQL 命令创建此表：\n\n```sql\nCREATE TABLE quotes (\n  id INT UNSIGNED NOT NULL AUTO_INCREMENT,\n\
  \  quote TEXT NOT NULL,\n  source VARCHAR(100) NOT NULL,\n  favorite TINYINT(1)\
  \ UNSIGNED NOT NULL,\n  date_entered TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,\n\
  \  PRIMARY KEY (id)\n) CHARACTER SET utf8\n```\n\n### 列出引用\n\n`id` 是主键，每次新提交时都会自动递增到下一个逻辑值。`quote`\
  \ 字段存储引用本身，`source` 字段存储来源（与第 11 章将引用和来源存储在一起不同）。`favorite` 字段存储 1 或 0，标记该引用是否为收藏内容。最后，`date_entered`\
  \ 列是一个时间戳，在创建新记录时自动设置为当前时间戳。\n\n### 编辑引用\n\n你可以使用 PHP 脚本（例如 `Script 12.3`）或第三方应用程序（如\
  \ MySQL 客户端或 phpMyAdmin）来创建此表。\n\n### 删除引用\n\n## 创建首页\n\n网站将有一个首页。\n\n\n\n\n\n![Image](img/c.jpg)\
  \ 服务器上文件的结构和组织。\n\n一旦你创建了数据库、数据库表以及必要的文件夹，就可以开始编码了。\n\n***\n\n### 提示\n\n如果你愿意，你也可以将\
  \ `templates` 和 `includes` 文件夹移动到 Web 根目录之外。如果是这样的话，你需要更改代码中所有对它们的引用以反映这种替代结构。\n\
  \n***\n\n### 连接到数据库\n\n与第 12 章中的脚本不同（那些脚本在每个脚本中使用重复的代码来连接到数据库），本网站将使用更常见的做法，即将重复的代码放置于一个独立文件中。每个与数据库交互的脚本——这将是大多数但不是所有的脚本——都将包含此文件。正如你在上一节的![Image](img/ash_c.jpg)\
  \ 在“入门指南”中所示，此文件应该存储在 Web 根目录之外，或者如果不可能，则存储在 `includes` 文件夹内。\n\n要创建 `mysqli_connect.php`：\n\
  \n**1.** 在你的文本编辑器或 IDE 中开始编写一个新的 PHP 脚本，命名为 `mysqli_connect.php` (**脚本 13.1**)：\n\
  \n```php\n<?php\n\n// Script 13.1 mysqli_connect.php 脚本连接到数据库服务器并选择要使用的数据库。\n```\n\
  \n点击此处查看代码图片\n\n***\n\n```php\n1   <?php // Script 13.1 - mysqli_connect.php\n2\
  \   /* 此脚本连接到数据库\n3   并为通信建立字符集。 */\n4\n5   // Connect:\n6   $dbc = mysqli_connect('localhost',\
  \ 'username', 'password', 'myquotes');\n\n7\n8   //Set the character set:\n9   mysqli_set_charset($dbc,\
  \ 'utf8');\n```\n\n***\n\n**2.** 连接到数据库：\n\n点击此处查看代码图片\n\n```php\n$dbc = mysqli_connect('localhost',\
  \ 'username', 'password', 'myquotes');\n```\n\n自然地，你需要更改此处使用的值，以适应你的服务器。\n\n**3.**\
  \ 设置字符集：\n\n点击此处查看代码图片\n\n```php\nmysqli_set_charset($dbc, 'utf8');\n```\n\n为交互建立正在使用的字符集是一种最佳实践。此外，当在使用\
  \ `mysqli_real_escape_string()` 时这也是一项要求，正如本章将这样做。\n\n**4.** 将文件保存为 `mysqli_connect.php`。\n\
  \n你可能会注意到脚本没有包含结束合的 PHP 标签。PHP 允许这种省略，并且通常对于像这样被包含的文件会这样做。（这样做可以帮助防止*头部已发送* 错误的发生。）\n\
  \n### 编写自定义函数\n\n该网站将有一个自定义函数。正如在第 10 章中讨论过的样，“创建函数”，创建你自己的函数的最佳时机是脚本或网站可能有重复代码时。在本网站中有几个这样的实例，但最明显的一个是：许多脚本将需要检查当前用户是否为管理员。在下一个脚本中，你将创建自己的函数，返回一个布尔值，指示用户是否为管理员。但管理员状态的测试是什么呢？\n\
  \n成功登录后，将向管理员的浏览器发送一个 cookie，名称为 `Samuel`，值为 `Clemens` ![Image](img/a.jpg)。这看起来可能很奇怪或随机，事实确实如此。当使用像\
  \ cookie 这样简单的工具进行身份验证时，最好对于什么构成了验证保持模糊。如果你选择更明显的东西，例如名称为 `admin` 且值为 `true`，那么对任何人来说都很容易猜到并伪造。考虑到这个\
  \ cookie，下一个函数简单地检查是否存在一个名为 `Samuel` 且值为 `Clemens` 的 cookie。\n\n![Image](img/13fig04.jpg)\n\
  \n![Image](img/a.jpg) 这个 cookie 将用于识别管理员。\n\n要创建 `functions.php`：\n\n**1.** 在你的文本编辑器或\
