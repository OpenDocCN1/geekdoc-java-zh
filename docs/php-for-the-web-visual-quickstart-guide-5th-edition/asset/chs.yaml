  \ => $value) {\n  print \"<p>Key is $key. Value is $value</p>\";\n}\n```\n\n在循环的每次迭代中，当前数组元素的键将被赋值给变量\
  \ `$key`，值将被赋值给 `$value`。注意，你在这里可以使用任何变量名：`$k` 和 `$v` 可能也是不错的选择。\n\n你现在可以编写一个新的汤脚本来使用这些知识了。\n\
