  \n## 8.8 鼠标事件\n\nSR 8.28 鼠标事件是用户以各种方式操作鼠标时产生的事件。在特定情况下，可能对几种类型的鼠标事件感兴趣，包括鼠标移动、按下鼠标按钮、鼠标进入特定组件以及拖动鼠标。\n\
