  `，然后创建一个新的 `JLabel` 作为 `label1` 并传递字符串 `\"Question authority,\"`）。\nd. 两个主要的 `add`\
  \ 语句的顺序反转（即首先将 `label2` 添加到 `primary` 面板，然后添加 `label1`）。\n\n## 3.10 嵌套面板\n\n上一节中，我们看到了一个示例，其中两个标签包含在一个面板中，而该面板又包含在一个框架中。这种关系构成了界面的\
  \ `containment hierarchy`（包含层次结构），它可以根据需要变得复杂，以创建所需的视觉效果。\n\n特别是，通常会有多层嵌套面板来以各种方式组织和分组组件。虽然\
  \ `Panels` 可以嵌套以创建复杂的包含层次结构，但你不应该在层次结构中包含不必要的组件，不要在组件中包含额外的脚手架以帮助实现你想要。\n\n**3.10\
  \ 嵌套面板**\n\n**175**\n\n代码 3.8 中的程序 `NestedPanels` 创建了两个子面板，每个面板包含一个标签。两个子面板都被放入另一个面板中，然后该面板被添加到框架的内容面板中。\n\
  \n**代码 3.8**\n\n```java\n//********************************************************************\n\
  // NestedPanels.java Author: Lewis/Loftus\n//\n// 展示基础的组件层次结构。\n//********************************************************************\n\
  import java.awt.*;\nimport javax.swing.*;\n\npublic class NestedPanels\n{\n\n//-------------------------------------------------\n\
  // 在第三个面板内嵌套展示两个彩色面板。\n//----------------------------------------------------------------\n\
  public static void main(String[] args)\n{\n    JFrame frame = new JFrame(\"Nested\
  \ Panels\"); frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n    // 设置第一个子面板\n\
  \    JPanel subPanel1 = new JPanel();\n    subPanel1.setPreferredSize(new Dimension(150,\
  \ 100)); subPanel1.setBackground(Color.green);\n    JLabel label1 = new JLabel(\"\
  One\");\n    subPanel1.add(label1);\n    // 设置第二个子面板\n    JPanel subPanel2 = new\
  \ JPanel();\n    subPanel2.setPreferredSize(new Dimension(150, 100)); subPanel2.setBackground(Color.red);\n\
  \    JLabel label2 = new JLabel(\"Two\");\n    subPanel2.add(label2);\n    // 设置主面板\n\
  \    JPanel primary = new JPanel();\n    primary.setBackground(Color.blue);\n  \
  \  primary.add(subPanel1);\n    primary.add(subPanel2);\n    frame.getContentPane().add(primary);\n\
  \    frame.pack();\n    frame.setVisible(true);\n}\n}\n```\n\n![](img/index-177_1.png)\n\
