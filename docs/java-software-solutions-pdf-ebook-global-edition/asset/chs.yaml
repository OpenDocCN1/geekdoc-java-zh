  \ `music` 数组中设置当前音频片段。\n\n## 11.9 滚动面板 (Scroll Panes)\n\nSR 11.27 滚动面板可以在右侧有一个垂直滚动条，并/或在底部有一个水平滚动条。程序员可以在第\
