  ); frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE); StyleOptionsPanel panel\
  \ = new StyleOptionsPanel();\nframe.getContentPane().add(panel);\nframe.pack();\n\
  frame.setVisible(true);\n}\n\n}\n\n```\n![](img/index-280_1.png)\n![](img/index-280_2.png)\n\
  \n## 5.8 复选框与单选按钮\n## 279\n### 列表 5.14 *续*\n\n### 显示\n### 列表 5.15\n```java\n//********************************************************************\n\
  // StyleOptionsPanel.java Author: Lewis/Loftus\n//\n\n// 展示了复选框的使用。\n//********************************************************************\n\
  import javax.swing.*;\nimport java.awt.*;\nimport java.awt.event.*;\n\npublic class\
  \ StyleOptionsPanel extends JPanel\n{\nprivate JLabel saying;\nprivate JCheckBox\
  \ bold, italic;\n\n//-----------------------------------------------------------------\n\
  // 设置一个包含标签和一些复选框的面板，\n// 控制标签的字体。\n//-----------------------------------------------------------------\n\
  public StyleOptionsPanel()\n{\nsaying = new JLabel(\"Say it with style!\"); saying.setFont(new\
  \ Font(\"Helvetica\", Font.PLAIN, 36)); bold = new JCheckBox(\"Bold\");\nbold.setBackground(Color.cyan);\n\
  italic = new JCheckBox(\"Italic\");\nitalic.setBackground(Color.cyan);\nStyleListener\
  \ listener = new StyleListener();\nbold.addItemListener(listener);\nitalic.addItemListener(listener);\n\
  add(saying);\nadd(bold);\nadd(italic);\nsetBackground(Color.cyan);\nsetPreferredSize(new\
  \ Dimension(300, 100));\n}\n\n//*****************************************************************\n\
  // 代表两个复选框的监听器。\n//*****************************************************************\n\
  private class StyleListener implements ItemListener\n{\n//--------------------------------------------------------------\n\
  // 更新标签字体的字体样式。\n//--------------------------------------------------------------\n\
  public void itemStateChanged(ItemEvent event)\n{\nint style = Font.PLAIN;\nif (bold.isSelected())\n\
  style = Font.BOLD;\nif (italic.isSelected())\nstyle += Font.ITALIC;\nsaying.setFont(new\
  \ Font(\"Helvetica\", style, 36));\n}\n\n}\n\n}\n\n```\n## 280\n# 第 5 章 条件语句与循环\n\
  \n该程序还使用了 `Font` 类，该类表示特定的*字符*字体*。`Font` 对象由字体名称、字体样式和字体大小定义。\n\n\n\n\n\n字体名称确定了字符的整体视觉特征。我们在此程序中使用\
  \ `Helvetica` 字体。Java 字体的样式可以是普通、粗体、斜体，或者是粗体与斜体的结合。\n\n![](img/index-282_1.png)\n\
  ![](img/index-282_2.png)\n\n## 5.8 复选框与单选按钮\n\n我们 GUI 中的复选框被设置为更改我们字体样式的特征。\n\n\
  字体的样式用整数表示，并且在 `Font` 类中定义的整数常量用于表示样式的各个方面。常量 `PLAIN` 用于表示普通样式。常量 `BOLD` 和 `ITALIC`\
  \ 分别表示粗体和斜体。`BOLD` 和 `ITALIC` 常数之和表示既是粗体又是斜体的样式。\n\n监听器的 `itemStateChanged` 方法决定了当其中一个复选框状态改变时，修订后的样式应该是什么。它最初将样式设置为普通。然后，使用\
  \ `isSelected` 方法轮询查询每个复选框，该方法返回一个布尔值。首先，如果选中了粗体复选框（勾选），则将样式设置为粗体。然后，如果选中了斜体复选框，则将\
  \ `ITALIC` 常量添加到 `style` 变量中。最后将标签的字体设置为带有修订后样式的新字体。\n\n请注意，由于此程序中监听器的编写方式，点击哪个复选框来生成事件并不重要。两个复选框都由同一个监听器处理。改变的复选框是从选中变为未选中还是反之也不重要。只要其中一个发生变化，就会检查两个复选框的状态。\n\
  \n### 单选按钮\n\n`radio button` 与单选按钮一起使用，提供一组互斥的选项。与复选框不同，单选按钮本身并没有特别用。只有当它与一个或多个其他单选按钮一起使用时才有意义。\n\
  \n组只有一个选项是有效的。在任何时刻，单选按钮组只有一个按钮被选中（开启）。当按下组中的某个单选按钮时，单选按钮将作为一个组运行，组中当前开启的另一个按钮会自动关闭。\n\
  \n“radio buttons（单选按钮）”一词源于老式汽车收音机上按钮的工作方式。在任何时候，按下一个按钮来指定当前的电台选择；当按下另一个按钮时，当前的按钮会自动弹出。\n\
  \n列表 5.16 显示的 `QuoteOptions` 程序显示了一个标签和一组单选按钮。单选按钮决定在标签中显示哪条引言。因为一次只能显示一条引言，所以使用\
  \ `VideoNote` 单选按钮是合适的。例如，如果选中了 `Comedy` 单选按钮，标签中将显示使用喜剧引言的示例。如果接着按下 `Philosophy`\
  \ 按钮，`Comedy` 单选按钮会自动关闭，喜剧引言将被哲学引言所替换。\n\n![](img/index-283_1.png)\n![](img/index-283_2.png)\n\
