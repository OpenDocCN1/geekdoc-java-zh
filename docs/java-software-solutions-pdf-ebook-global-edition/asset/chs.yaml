  \n```java\n//********************************************************************\n\
  // FoodItem.java 作者: Lewis/Loftus\n//\n// 表示一种食物。用作派生类的父类，以展示\n//间接引用。\n//********************************************************************\n\
  public class FoodItem\n{\nfinal private int CALORIES_PER_GRAM = 9;\nprivate int\
  \ fatGrams;\nprotected int servings;\n//-----------------------------------------------------------------\n\
