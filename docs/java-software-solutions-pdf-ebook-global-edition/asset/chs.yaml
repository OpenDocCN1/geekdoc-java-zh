  - 实验手册——实验活动旨在配合书中的主题演进。\n\n## 特性\n\n### 核心概念\n在全文中，“核心概念”框突出了基本思想和重要指南。这些概念在每章末尾会有总结。\n\
  \n### 代码列表\n所有的编程示例都以清晰标记的列表形式呈现，随后附有程序输出、示例运行或屏幕截图。代码经过颜色处理，以区分注释和关键字。\n\n### 语法图\n\
  在书中合适的位置，Java 语言的语法元素将在特别标记的章节中讨论，并配图标识语句或结构的有效形式。整个 Java 语言的语法图见附录 L。\n\n### 图形轨道\n\
  所有涉及图形和图形用户界面的处理将在每章末尾的一个或两个章节中讨论，我们统称为“图形轨道”。跳过这些内容不会影响连续性，也可以根据需要重点关注。任何图形轨道的内容与其所在章节的主题相关。图形轨道通过页面边缘的棕色框指示。\n\
  \n### 核心概念总结\n贯穿章节的核心概念将在章末尾进行总结。\n\n### 自测练习题与答案\n这些简答题回顾了前述节建立的基本思想和术语。它们旨在让学生评估自己对内容的掌握程度。这些问题的答案可以在书末的附录\
  \ N 中找到。\n\n\n\n\n\n## 练习\n这些中级问题需要进行计算、分析或编写代码片段，并彻底掌握本章节的内容。虽然练习可能涉及代码，但通常不需要进行任何在线活动。\n\
  \n## 编程项目\n这些问题要求设计并实现 `Java` 程序。它们的难度程度各不相同。\n\n## 视频笔记 (VideoNotes)\n由作者制作的 `VideoNotes`\
  \ 通过易于跟的非正式视频，以视觉化的方式解释相关主题，为学生理解重要概念提供额外的帮助。请寻找此视频笔记图标，查看哪些章节主题和章末的编程项目提供了 `VideoNotes`\
  \ 版本。\n\n## 软件故障\n这些章节之间的小插曲讨论了软件设计中的现实缺陷，鼓励学生从一开始就采用良好的设计实践。\n\n## 致谢\n我非常感谢来自全球的教师和学生，他们对本书的之前的版本提供了反馈。我很高兴看到教师们对学生的关注以及学生对知识的渴求。随时欢迎你们的意见和问题。\n\
