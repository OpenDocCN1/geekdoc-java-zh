  ![](img/index-382_2.png)\n\n每个按钮的大小都被调整到足够容纳放在上面的标签的大小。正如我们之前提到的，流式布局将这些按钮尽可能放在面板内的一行中，然后开始在另一行放置组件。当框架的大小变宽时（例如用鼠标拖动右下角），面板也会随之增大，一行可以容纳更多按钮。当调整框架大小时，会咨询布局管理器并自动重新组织组件。请注意，默认情况下，每行的组件在窗口中居中对齐。\n\
  \n\n\n\n`FlowLayout` 类的构造函数被重载，允许程序员定制化布局管理器的特征。在每一行中，组件可以是居中、左对齐或右对齐。默认对齐方式为居中。在创建布局管理器时，还可以指定组件之间的水平和垂直间隙大小。`FlowLayout`\
  \ 类还具有在布局管理器创建后设置对齐方式和间隙大小的方法。\n\n## 边框布局布局 (border layout)\n\n`border layout` 有五个区域可以添加组件的区域：北（North）、南（South）、东（East）、西（West）和中心（Center）。这些区域之间具有特定的位置关系，如图\
  \ 7.8 所示。\n\n四个外部区域会根据需要增大以容纳其包含的组件。如果没有向 `North`、`South`、`East` 或 `West` 区域添加组件，这些区域将不会占用整体布局中的任何空间。`Center`\
  \ 区域将扩展填充任何可用空间。\n\n特定的容器可能会根据系统的功能仅使用少数区域。例如，一个程序可能只使用 `Center`、`South` 和 `West`\
  \ 区域。这种灵活性使得 `border layout` 成为一种非常有用的布局管理器。\n\n受 `border layout` 支配的容器的 `add` 方法其第一个参数是要待添加的组件。第二个参数指示其被添加的区域。该区域使用\
  \ `BorderLayout` 类中定义的常量指定。列表 7.21 显示了 `LayoutDemo` 程序用于演示边框布局的面板。\n\n北\n西\n中心\n\
  东\n南\n\n**图 7.8** 边框布局将组件组织在五个区域中\n\n**7.11** 布局管理器\n\n**383**\n\n**列表 7.21**\n\n\
