  \ 100) 的新填充多边形。\ne. 最后绘制一个坐标为 (0, 100), (200, 200) 的新填充多边形。\n\n## 8.8 鼠标事件\n\n445\n\
  \n让我们检查使用鼠标时生成的事件。Java 将这些分为两类：*鼠标事件*和*运动事件*。8.7 节中的表格定义了这些事件。\n\n你在 GUI 组件上点击鼠标按钮时，会产生三个事件：当鼠标按钮按下时产生一个（*鼠标按下*），当松开时产生两个（*鼠标释放*和*鼠标点击*）。\n\
  \n**鼠标事件**\n\n| 事件 | 描述 |\n| :--- | :--- |\n| mouse pressed | 鼠标按钮按下。 |\n| mouse\
  \ released | 鼠标按钮释放。 |\n| mouse clicked | 鼠标按钮按下并释放且未移动。 |\n| mouse entered | 鼠标指针移动到组件上方。\
  \ |\n| mouse exited | 鼠标指针移出组件。 |\n\n**鼠标运动事件**\n\n| 事件 | 描述 |\n| :--- | :--- |\n\
  | mouse moved | 鼠标移动。 |\n| mouse dragged | 在按下鼠标按钮时移动鼠标。 |\n\n**图 8.7** 鼠标事件与运动事件\n\
  \n当鼠标指针进入其图形空间时，组件会产生 *mouse entered* 事件。同样，当离开时会产生 *mouse exited* 事件。\n\n鼠标运动事件正如其名，在鼠标移动时发生。*mouse\
  \ moved* 事件仅表示鼠标正在移动。*mouse dragged* 事件在用户按下鼠标但未释放时移动鼠标时产生。鼠标移动时会非常快速地产生多次运动事件。\n\
