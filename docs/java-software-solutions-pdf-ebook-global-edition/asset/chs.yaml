  \nPP 3.12 修改 NestedPanels 程序，使其在第五个面板内显示四个面板，每个面板都有不同的颜色和标签。\n\n\n\n\n\n\n回想对象与类之间的基本关系：类是对象的蓝图。类表示了对象的概念，而从该类创建的任何对象都是该概念的实现。\n\
  \n例如，从第 3 章我们知道，`String` 类表示字符字符串的概念，而每个 `String` 对象都代表一个包含特定字符的特定字符串。\n\n让我们考虑另一个例子。假设有一个名为\
  \ `Student` 的类代表大学的一名学生。从 `Student` 类创建的对象将代表一个特定的学生。`Student` 类表示了学生的通用概念，而从该类创建的每个对象都代表一个在该校就学的真实学生。在一个帮助管理大学业务的系统中，我们有一个\
  \ `Student` 类和数千个 `Student` 对象。\n\n回想一下，对象有一个 `state`（状态），它由与该对象相关的 `attributes`（属性）的值定义。一个学生的属性可能包括学生的姓名、地址、专业和平均学点（GPA）。`Student`\
  \ 类规定了每个学生都拥有这些属性。每个 `Student` 对象存储某个特定学生的这些属性的值。在 Java 中，对象的属性是在类内部声明的变量定义的。\n\n\
  对象还具有 `behaviors`（行为），它们由与该对象相关的 `operations`（操作）定义。学生的操作将包括更新该学生地址以及计算该学生当前平均学点的能力。`Student`\
  \ 类定义了这些操作，例如如何计算平均学点的细节。这些操作可以在特定的 `Student` 对象上（或通过对象）执行。\n\n注意，对象的行为可能会修改该对象的状态。在\
  \ Java 中，对象的操作是在类内部声明的方法（methods）定义的。\n\n图 4.1 列出了一些类的示例，以及可能为这些类的对象定义的某些属性和操作。确定需要哪些属性和操作取决于程序设计者，这取决于程序的目的以及特定对象在在该目的中所扮演的角色。\n\
