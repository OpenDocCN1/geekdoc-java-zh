  \n**优先级—precedence—** *参见* 优先级（operator precedence）。\n\n**提示—prompt—** 用于向用户请求信息的消息或符号。\n\
  \n**前缀运算符—prefix operator—** 在 Java 中，位于单个操作数前面的运算符，其求值结果为操作执行后的值。递增（++`）和递减（--`）运算符都可以作为前缀使用。*参见*\
  \ 后缀运算符。\n\n**传播—propagation—** *参见* 异常传播（exception propagation）。\n\n**protected—protected—**\
  \ 一个 Java 关键字，作为内部类以及方法和变量的可见性修饰符。受保护的内部类对相同包中的类以及所有扩展该类的其他包中的类可见。受保护的方法和变量对相同包中的所有类以及扩展该类的包外类可见。\n\
  \n**随机访问设备—random access device—** 可以可以直接访问信息的内存设备。*参见* 顺序随机访问存储器（random access\
  \ memory, sequential）。\n\n**随机访问存储器（RAM）—random access memory (RAM)—** 一个与主内存基本可以通用的术语。应该被称为读写内存，以区别于只读内存。\n\
  \n**原型—prototype—** 用于探索构想或证明特定方法可行性的程序。\n\n**随机数生成器—random number generator—**\
  \ 通过基于种子值（seed value）的计算产生伪随机数的软件。*参见* 程序设计语言（Program Design Language）。\n\n**伪代码—pseudocode—**\
  \ 用于表示程序算法步骤的结构化且简记的自然语言。\n\n**伪随机数—pseudorandom number—** 由软件根据初始种子值通过大量计算生成的值。该结果不是真正的随机，因为它基于计算，但对于大多数用途来说，它通常足够随机了。\n\
