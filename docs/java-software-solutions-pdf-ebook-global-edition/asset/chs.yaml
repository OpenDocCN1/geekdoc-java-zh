  \n**SR 2.13** 简述在程序中使用常量代替字面值的三个理由。\n\n## 2.3 原始数据类型\n\nJava 中有八种`原始数据类型`（primitive\
  \ data types）：四种整数子集、两个浮点数子集、一个字符数据类型和一个布尔数据类型。其他所有内容都使用对象表示。让我们详细检查一下这八种原始数据类型。\n\
  \n#### 整数和浮点数\n\nJava 有两种基本的数值类型：整数（没有小数部分）和浮点数（有）。有四种整数数据类型（`byte`、`short`、`int`\
  \ 和 `long`）和两种浮点数据类型（`float` 和 `double`）。所有数值类型的区别在于存储该类型的值所用的内存空间，这决定了可以表示的值范围。\n\
  \n所有硬件平台。所有数值类型都是`有符号的`（signed），这意味着可以存储正值和负值。图 2.2 总结了数值原始类型。\n\n回想我们在第 1 章中的讨论，一个位可以是\
  \ `1` 也可以是 `0`。由于每个位可以表示两种不同的状态，一个 `N` 位的字符串可以表示 `2^N` 个不同的值。附录 B 详细描述了数制和这类关系。\n\
  \n在设计程序时，我们有时需要选择选择大小合适的变量，以免浪费内存空间。这发生在内存空间特别受限的情况下，例如 PDA。在大多数情况下，内存空间并不是严格的限制，我们通常可以负担得起慷慨的假设。\n\
  \n| 类型 | 存储 | 最小值 | 最大值 |\n| :--- | :--- | :--- | :--- |\n| `byte` | 8 位 | –128\
  \ | 127 |\n| `short` | 16 位 | –32,768 | 32,767 |\n| `int` | 32 位 | –2,147,483,648\
  \ | 2,147,483,647 |\n| `long` | 64 位 | –9,223,372,036,854,775,808 | 9,223,372,036,854,775,807\
  \ |\n| `float` | 32 位 | –3.4E+38 | 3.4E+38 |\n| `double` | 64 位 | –1.7E+308 | 1.7E+308\
  \ |\n\n注意，尽管 `float` 值支持极大或极小的数字，但它只有七位有效数字。因此，如果要准确维护如 `50341.2077` 这样的值，我们需要使用\
  \ `double`。\n\n正如我们已经讨论过的，字面量（literal）是程序中显式的数据值。Facts 和 PianoKeys 等程序中使用的各种数字都是整数字面量。Java\
  \ 假设所有整数字面量都是 `int` 类型，除非在值的末尾加上 `L` 或 `l` 表明其应视为 `long` 类型字面量，例如 `45L`。\n\n同样，Java\
  \ 假设所有浮点数字面量都是 `double` 类型。如果我们需要将浮点数字面量视为 `float`，则在值的末尾加上 `F` 或 `f`，如 `2.718F`\
  \ 或 `123.45f`。如果需要，`double` 类型的数值字面量可以跟一个 `D` 或 `d`。\n\n#### 十进制整数字面量\n\n整数字面量由一系列数字组成，后面跟一个可选的后缀，以指明其应被视为整数。字面量的否定被视为一个独立的操作。\n\
  \n示例：\n- `5`\n- `2594`\n- `4920328L`\n\n以下是 Java 中数值变量声明的示例：\n```java\nint answer\
  \ = 42;\n```\n\n\n\n\n\n```java\nbyte smallNumber1, smallNumber2;\n\nlong countedStars\
