  \n---\n\n## 第 13 章集合 (Collections)\n\n### 本章目标\n\n- 探索集合（collection）的概念。\n- 强调接口与实现分离的重要性。\n\
  - 固定实现与动态实现之间的区别。\n- 定义并使用动态链表。\n- 介绍经典的线性数据，如队列和栈。\n- 介绍经典的非线性数据结构，如树和图。\n- 讨论\
  \ Java Collections API。\n- 定义泛型类型的使用及其在集合类中的应用。\n\n解决问题通常需要组织和管理信息的技术。本章将探索存储信息的对象，称为“集合”，以及实现它们的各种方法。\n\
  \n多年来人们开发了许多集合，其中一些已经成为经典。本章解释了如何使用引用将一个对象链接到另一个对象来来实现集合。\n\n## 13.1 集合与数据结构\n\n\
  `collection`（集合）是一个作为其他对象仓库的对象。它是一个通用术语，可以适用于许多情况，但我们通常在讨论特定角色是提供添加、删除及其他管理其中元素服务的对象时使用它。例如，`ArrayList`\
  \ 类（在第 5 章中讨论过）代表一个集合。它提供了将元素添加到列表末尾或根据索引值添加到列表特定位置的方法。它还提供了需要时删除特定元素的方法。\n\n某些集合按特定顺序维护元素，而另一些则不然。\n\
  \n某些集合是`homogeneous,`（同质的），意味着它们可以包含所有相同类型的对象；其他集合是`heterogeneous,`（异质的），意味着它们可以包含各种类型的对象。一个没有指定明确元素类型的\
  \ `ArrayList` 可以被认为是异质的，因为它可以持有任何类型的对象。它的异质性源于 `ArrayList` 存储的是 `Object` 引用，由于继承和多态，它可以存储任何对象。\n\
  \n### 分离接口与实现\n\n集合的一个至关重要的方面是它们可以用多种方式实现。也就是说，存储对象的底层 `data structure`（数据结构）可以使用各种技术来实现。例如，Java\
  \ 标准库中的 `ArrayList` 类是使用数组实现的。对 `ArrayList` 的所有操作都是通过调用对底层数组执行相应操作的方法完成的。\n\n`abstract\
  \ data type`（抽象数据类型， ADT）是数据的集合以及允许在该数据上执行的特定操作。一个 ADT 有一个名称、一个值域和一组可以执行的操作。ADT\
  \ 被认为是抽象的，因为你可以在上面执行的操作与底层实现是分离的。也就是说，ADT 如何存储数据以及完成其方法的细节与它所体现的概念是分离的。本质上说，`collection`\
  \ 和 `abstract data type` 术语是可以互换的。\n\n对象非常适合定义集合。根据定义，对象有一个定义良好的接口，其实现隐藏在 `class`（类）中。数据表示方式以及管理数据的操作封装在对象内部。这种类型的对象接口是实现集合的完美机制。它是可重用且可靠的，因为它与系统其余部分的交互是受的。\n\
  \n## 13.2 动态表示\n\n### 自测习题\n\n- SR 13.1 什么是集合？\n- SR 13.2 `ArrayList` 类提供抽象数据类型吗？\n\
  - SR 13.3 为什么对象特别适合实现抽象数据类型？\n\n### 动态表示\n\n数组仅仅是列表的一种表示方式。数组在某种意义上是有局限性的，因为它们在整个生命周期内具有固定的大小。有时我们不知道数组应该设得多大，因为我们不知道将存储多少信息。`ArrayList`\
  \ 类通过在需要时创建一个更大的数组并把所有内容复制过去来处理这个问题。这并不一定是一种高效的实现。\n\n`dynamic data structure`（动态数据结构）是通过链接实现的。通过使用引用作为对象之间的链接，我们可以创建任何适合这种情况的类型结构。如果实现得当，该结构在搜索和修改时可以非常高效。动态数据结构的大小根据需要增长和缩小。这样创建的结构被认为是动态的，因为它们的大小是在使用过程中动态决定的，而不是通过声明。\n\
  \n### 动态结构\n\n回想，用于跟踪对象的变量实际上是该对象的引用，这意味着它存储了对象的地址。像 `home = new House(\"602 Greenbriar\
  \ Court\");` 这样的声明实际上完成了两件事：将 `home` 声明为 `House` 对象的引用，并实例化 `House` 类的对象。现在考虑一个包含相同类型对象引用的对象。例如：\n\
  \n```java\nclass Node {\n    int info;\n    Node next;\n}\n```\n\n该类的两个对象可以实例化并链联在一起，让一个\
  \ `Node` 对象的 `next` 引用指向另一个 `Node` 对象。第二个对象的 `next` 引用可以指向第三个 `Node` 对象，依此类推，从而创建一个`linked\
  \ list.`（链表）。列表中的第一个节点可以使用单独的变量进行引用。列表中的最后一个节点其 `next` 引用为 `null`，表示列表的结束。图 13.1\
  \ 描述了这种情况。\n\n动态链表通过存储和更新对象引用来管理。\n\n在这个示例中，每个 `Node` 类中存储的信息是一个简单的整数，但请记住，我们可以定义一个类来包含任何数量、任何类型的信息。\n\
  \n### 动态链表\n\n列表 13.1 程序设置了一个 `Magazine` 对象的列表，然后打印该列表。杂志列表封装在列表 13.2 所示的 `MagazineList`\
  \ 类内部，并作为动态链表进行维护。\n\n\n\n\n\n`MagazineList` 类代表杂志列表。从类的外部（外部视图）来看，我们并不关注列表是如何实现的。例如，我们并不知道杂志列表是存储在数组中还是链表表中。`MagazineList`\
  \ 类提供了一组方法，允许用户维护杂志列表。这组方法，特别是 `add` 和 `toString`，定义了对 `MagazineList` ADT（抽象数据类型）的操作。\n\
  \n`MagazineList` 类使用一个名为 `MagazineNode` 的内部类来表示链表中的节点。每个节点包含一个指向某个杂志的引用，以及一个指向列表中下一个节点的\
  \ `VideoNote` 引用。由于 `MagazineNode` 是一个内部类，允许类中的数据值为公有（public）是合理的。因此，`MagazineList`\
  \ 类中的代码直接引用了这些数据值。\n\n列表 13.3 所示的 `Magazine` 类封装得良好，所有数据都声明为 `private`，并提供了相应的方法来完成任何必要的更新。\n\
  \n请注意，由于我们使用一个独立的类来表示列表中的节点，`Magazine` 类本身不需要包含指向列表中下一份杂志的链接。这使得 `Magazine` 类能够避免任何关于其在列表中包含性的问题。\n\
  \n![](img/index-648_1.png)\n\n## 13.2 动态表示\n\n647\n\n#### LISTING 13.1\n```java\n\
