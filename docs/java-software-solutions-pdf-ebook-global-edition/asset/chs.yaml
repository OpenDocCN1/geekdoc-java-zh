  c. 假设 `num1` 为 5 `num2` 为 27？\n\n5.12 写一个表达式，根据 `temperature` 变量的值打印一条消息。如果 `temperature`\
  \ 等于或小于 50，打印“天气很凉”并“穿暖一点”。如果 `temperature` 大于 80，打印“天气很热”并“穿凉一点”。如果 `temperature`\
  \ 在 50 到 80 之间，打印“天气宜人”并“穿舒适”。\n\n## 5.3 比较数据\n\n在使用布尔表达式比较数据时，理解根据所检查的数据类型产生的某些微妙差别。让我们来看几个关键情况。\n\
  \n### 比较浮点数\n在比较浮点数据时会出现一种有趣的情况。根据 `==` 运算符，两个浮点值只有在它们的底层表示的所有二进制位完全匹配时才是相等的。如果比较的值是计算的结果，即使它们对于特定情况来说已经足够接近，它们可能是不相等的。因此，在比较浮点值时，你应该很少使用相等运算符\
  \ (`==`)。\n\n检查浮点相等性的更好方法是计算两个值之间的绝对值，并将结果与某个容差水平进行比较。例如，我们可以选择 `0.00001` 作为容差水平。如果两个浮点值足够接近，它们的差异小于容差，那么我们就认为它们是相等的。比较两个浮点值\
  \ `f1` 和 `f2`可以通过以下方式实现：\n```java\nif (Math.abs(f1 - f2) < TOLERANCE)\n    System.out.println(\"\
  本质相等.\");\n```\n常量 `TOLERANCE` 的值应该适用于这种情况。\n\n**比较字符**\n\n\n\n\n\n当我们说一个数字小于另一个数字时知道这意味着什么，但一个字符小于另一个字符又意味着什么？正如我们在第\
  \ 2 章中所讨论的，Java 中的字符基于 Unicode 字符集，该字符集定义了所有可用字符的顺序。因为字符 'a' 在字符集中位于字符 'b' 之前，所以我们可以说\
  \ 'a' 小于 'b'。\n\n我们可以对字符数据使用等值运算符和关系运算符。例如，如果两个字符变量 `ch1` 和 `ch2` 存储了两个字符，我们可以使用\
  \ `if` 语句根据 Java 定义的 Unicode `char`字符集确定它们的相对顺序：\n\n```java\nif (ch1 > ch2)\n  \
  \  System.out.println(ch1 + \" is greater than \" + ch2); \nelse\n    System.out.println(ch1\
  \ + \" is NOT greater than \" + ch2);\n```\n\n**核心概念**：Unicode 字符集的结构使得所有小写字母（'a'\
  \ 到 'z'）都是连续的，并按字母顺序排列。大写字母（'A' 到 'Z'）以及代表数字的字符（'0' 到 '9'）也是如此。数字在大写字母之前，大写字母在小写字母之前。在这些组之前、之后和之间还有其他字符。详情参见附录\
  \ C 中的表格。\n\n记住，字符和字符字符串是两种不同类型的信息。`char` 是表示一个字符的原始值。字符字符串在 Java 中以对象的形式表示，由 `String`\
  \ 类定义。虽然比较字符串是基于比较字符串中的字符，但这种比较受比较对象的规则支配。\n\n### 比较对象\n\n字符之间的 Unicode 关系使得排序字符和字符字符串变得简单。例如，如果你有一个姓名列表，你可以根据字符集中字符之间的内在关系将其按字母顺序排列。\n\
  \n然而，你不应该使用等值运算符或关系运算符来比较 `String` 对象。`String` 类包含一个名为 `equals` 的方法，该方法返回一个布尔值：如果比较的两个字符串包含完全相同的字符，则返回\
  \ true，否则返回 false。例如：\n\n```java\nif (name1.equals(name2))\n    System.out.println(\"\
  The names are the same.\"); \nelse\n    System.out.println(\"The names are not the\
  \ same.\");\n```\n\n**核心概念**：假设 `name1` 和 `name2` 是 `String` 对象，此条件决定它们所包含的字符是否完全匹配。\n\
  \n`compareTo` 方法可以确定字符串的相对顺序。因为两个对象都是从 `String` 类创建的，所以它们都响应 `equals` 消息。因此，该条件可以写成\
  \ `name2.equals(name1)`，结果将是相同的。\n\n测试条件 `(name1 == name2)` 是有效的，但它实际上测试的是两个引用变量是否指向同一个\
  \ `String` 对象。对于任何对象，`==` 运算符测试测试的是两个引用变量是否为彼此的别名（即它们是否包含相同的地址）。这与测试两个不同的 `String`\
  \ 对象是否包含相同的字符是不同的。\n\n记住，字符串字面量（如 \"Nathan\"）是一种便利手段，实际上是创建 `String` 对象的简写技术。与字符串比较相关的一个有趣问题是，Java\
  \ 仅在需要时才会为字符串字面量创建一个唯一对象。也就是说，如果在一个方法中多次使用字符串字面量 \"Hi\"，则只会创建一个 `String` 对象来表示它。因此，以下代码中两个\
  \ `if` 语句的条件都是真的：\n\n```java\nString str = \"software\";\nif (str == \"software\"\
  )\n    System.out.println(\"References are the same\"); \nif (str.equals(\"software\"\
  ))\n    System.out.println(\"Characters are the same\");\n```\n\n第一次使用字符串字面量 \"\
  software\" 时，会创建一个 `String` 对象来表示它，并将引用变量 `str` 设置为它的地址。之后每次使用该字面量，都会引用原始对象。\n\n\
  ## 5.3 比较数据\n\n要确定两个字符串的相对顺序，使用 `String` 类的 `compareTo` 方法。`compareTo` 方法比 `equals`\
  \ 方法更通用。`compareTo` 方法不返回布尔值，而是返回一个整数。如果调用方法的 `String` 对象在传入的字符串之前（小于），则返回值为负。如果两个字符串包含相同的字符，则返回值为零。\n\
  \n如果调用方法的 `String` 对象在作为参数的字符串之后（大于），则返回值为正。例如：\n\n```java\nint result = name1.compareTo(name2);\n\
  if (result < 0)\n    System.out.println(name1 + \" comes before \" + name2); \n\
  else if (result == 0)\n    System.out.println(\"The names are equal.\"); \nelse\n\
  \    System.out.println(name1 + \" follows \" + name2);\n```\n\n记住，比较字符和字符串是基于 Unicode\
  \ 字符集的（见附录 C）。这被称为*字典序排序*（lexicographic ordering）。如果所有字母都是相同的大小（大写或小写），则字典序也将是字母顺序。然而，在比较两个字符串时（例如\
  \ \"able\" 和 \"Baker\"），`compareTo` 方法会认为 \"Baker\" 排在前面，因为在 Unicode 字符集中，所有大写字母都在所有小写字母之前。作为另一个长字符串的前缀字符串被认为在长字符串之前。例如，在比较\
  \ \"horse\" 和 \"horsefly\" 时，`compareTo` 方法会认为 \"horse\" 在前面。\n\n## 5.4 while 语句\n\
  \n正如我们在本章引言中讨论的，重复语句（或循环）允许我们多次执行另一个语句。*while 语句*是一种循环，它评估布尔条件的方式与 `if` 语句一样，如果条件为真，则执行一个语句（称为循环的*体*）。然而，与\
  \ `if` 语句不同，在执行体之后，会再次评估条件。如果仍然为真，则再次执行体。这种重复一直持续到条件变为假；然后继续执行 while 循环体之后的语句。图\
  \ 5.7 展示了这一点。只要布尔表达式为真，while 循环就会执行指定的语句。首先评估表达式；因此语句可能一次都不执行。在每次执行语句后，都会再次评估表达式，直到表达式变为假。\n\
  \n示例：\n\n```java\nwhile (total > max)\n{\n    total = total / 2;\n    System.out.println(\"\
  Current total: \" + total);\n}\n```\n\n\n\n\n重复相同的语句直到其条件为假。\n\n```java\nint count\
  \ = 1;\n\nbecomes false.\n\nwhile (count <= 5)\n{\n    System.out.println(count);\n\
  \    count++;\n}\n```\n\n注意 `while` 循环体是一个包含两个语句的块。整个块在循环的每次迭代中都会重复。\n\n让我们来看另一个使用\
  \ `while` 循环的程序。列表 `5.7` 显示的 `Average` 程序从用户处读取一系列整数值，对它们求和并计算平均值。\n\n我们不知道用户可能会输入多少个值，因此我们需要一种方法来指示用户已完成数字输入。在这个程序中，我们将零指定为`哨兵值`（sentinel\
  \ value），表示输入的结束。`while` 循环继续处理输入值，直到用户输入零为止。这假设零不是应该应该计入平均值的有效数字之一。哨兵值必须始终处于输入值的正常范围之外。\n\
  \n### 列表 5.7\n\n```java\n//********************************************************************\n\
  // Average.java Author: Lewis/Loftus\n//\n// 展示了 while 循环、哨兵值和\n// 运行和的使用。\n//********************************************************************\n\
  import java.text.DecimalFormat;\nimport java.util.Scanner;\n\npublic class Average\n\
  {\n    //-----------------------------------------------------------------\n   \
  \ // 计算用户输入的一组值的平均值。\n    // 随着数字的输入，打印运行和。\n    //-----------------------------------------------------------------\n\
  \    public static void main(String[] args)\n    {\n        int sum = 0, value,\
  \ count = 0;\n        double average;\n        Scanner scan = new Scanner(System.in);\n\
  \n        System.out.print(\"Enter an integer (0 to quit): \");\n        value =\
  \ scan.nextInt();\n        while (value != 0) // 哨兵值 0 用于终止循环\n        {\n     \
  \       count++;\n            sum += value;\n            System.out.println(\"The\
  \ sum so far is \" + sum);\n            System.out.print(\"Enter an integer (0 to\
  \ quit): \");\n            value = scan.nextInt();\n        }\n\n        System.out.println\
  \ ();\n        if (count == 0)\n            System.out.println(\"No values were\
  \ entered.\");\n        else\n        {\n            average = (double)sum / count;\n\
  \            DecimalFormat fmt = new DecimalFormat(\"0.###\");\n            System.out.println(\"\
  The average is \" + fmt.format(average));\n        }\n    }\n}\n```\n\n**输出**\n\
  ```\nEnter an integer (0 to quit): 25\nThe sum so far is 25\nEnter an integer (0\
  \ to quit): 164\nThe sum so far is 189\nEnter an integer (0 to quit): -14\nThe sum\
  \ so far is 175\nEnter an integer (0 to quit): 84\nThe sum so far is 259\nEnter\
  \ an integer (0 to quit): 12\nThe sum so far is 271\nEnter an integer (0 to quit):\
  \ -35\nThe sum so far is 236\nEnter an integer (0 to quit): 0\nThe average is 39.333\n\
  ```\n\n## 5.4 while 语句\n\n注意在 `Average` 程序中，使用一个名为 `sum` 的变量来维护`运行和`（running sum），这意味着它是到目前为止输入值的和。变量\
  \ `sum` 被初始化为零，读取的每个值都会被相加并存回 `sum` 中。\n\n我们还需要统计输入值的个数，以便在循环结束后，我们可以除以适当的值来计算平均值。\n\
  \n注意哨兵值是不计入入数的。考虑一种特殊情况：用户在输入任何有效值之前立即输入了哨兵值。程序末尾的 `if` 语句避免了除零错误。\n\n让我们再检查另一个使用\
  \ `while` 循环的程序。列表 `5.8` 显示的 `WinPercentage` 程序根据胜场数计算运动队伍的获胜率。\n\n我们在 `WinPercentage`\
  \ 程序中使用 `while` 循环来`验证输入`（validate the input），这意味着我们保证用户输入的是我们认为是有效的值。\n\n在这个例子中，这意味着胜场数必须大于或等于零，且小于或等于比赛总数。`while`\
  \ 循环将继续执行，反复提示用户输入有效值，直到输入的数字确实有效为止。\n\n### 列表 5.8\n\n```java\n//********************************************************************\n\
  // WinPercentage.java Author: Lewis/Loftus\n//\n// 展示了使用 while 循环进行输入验证。\n//********************************************************************\n\
  import java.text.NumberFormat;\nimport java.util.Scanner;\n\npublic class WinPercentage\n\
  {\n    //-----------------------------------------------------------------\n   \
  \ // 计算队伍获胜的百分比。\n    //-----------------------------------------------------------------\n\
  \    public static void main(String[] args)\n    {\n        final int NUM_GAMES\
  \ = 12;\n        int won;\n        double ratio;\n\n        Scanner scan = new Scanner(System.in);\n\
  \        System.out.print(\"Enter the number of games won (0 to \" + NUM_GAMES +\
  \ \"): \");\n        won = scan.nextInt();\n        while (won < 0 || won > NUM_GAMES)\n\
  \        {\n            System.out.print(\"Invalid input. Please reenter: \");\n\
  \            won = scan.nextInt();\n        }\n\n        ratio = (double)won / NUM_GAMES;\n\
  \        NumberFormat fmt = NumberFormat.PercentInstance();\n        System.out.println();\n\
  \        System.out.println(\"Winning percentage: \" + fmt.format(ratio));\n   \
  \ }\n}\n```\n\n**输出**\n```\nEnter the number of games won (0 to 12): -5\nInvalid\
  \ input. Please reenter: 13\nInvalid input. Please reenter: 7\nWinning percentage:\
  \ 58%\n```\n\n\n\n\n再次，循环控制变量的值似乎正在朝着正确的方向移动。事实上，`num` 似乎最终会取值 `0.0`。然而，这个循环是无限循环的（至少在大多数系统上），因为\
  \ `num` 的值永远不会*恰好*等于 `0.0`。这种情况与我们在本章早期讨论过的类似，当时我们探索了在 `if` 语句的条件中比较浮点值的想法。由于值在二进制中的表示方式，内部会产生微小的计算误差，这使得比较两个浮点值是否相等变得很有问题。\n\
  \n# 第 5 章：条件与循环\n\n### 嵌套循环\n\n循环体中可以包含另一个循环。这种情况被称为*嵌套*循环。记住，对于外层循环的每一次迭代，内层循环都会完整执行。考虑以下代码段。字符串\
  \ \"Here again\" 被打印了多少？\n\n```java\nint count1, count2;\ncount1 = 1;\nwhile (count1\
  \ <= 10)\n{\n    count2 = 1;\n    while (count2 <= 50)\n    {\n        System.out.println(\"\
  Here again\");\n        count2++;\n    }\n    count1++;\n}\n```\n\n`println` 语句位于内层循环内部。外层循环执行\
  \ 10 次，因为 `count1` 在 1 到 10 之间迭代。内层循环执行 50 次，因为 `count2` 在 1 到 50 之间迭代。对于外层循环的每一次迭代，内层循环都会完整执行。因此`println`\
  \ 语句执行了 500 次。\n\n与任何循环情况一样，我们必须仔细检查循环的条件和变量的初始化。让我们考虑对这段代码的一些微调。如果外层循环的条件是 `(count1\
  \ < 10)` 而不是 `(count1 <= 10)` 会怎样？这将如何改变打印的总行数？外层循环将执行 9 次而不是 10 次，因此 `println`\
  \ 语句将执行 450 次。如果外层循环保持原始定义，但在内层循环开始之前将 `count2` 初始化为 11 而不是 1 会怎样？那么内层循环将执行 40 次而不是\
  \ 50 次，因此打印的总行数将是 400。\n\n让我们来看另一个使用嵌套循环的例子。*回文*（palindrome）是一个正读和反读都相同的字符字符串。例如，以下字符串都是回文：\n\
  * radar\n* drab bard\n* ab cde xxxx edc ba\n* kayak\n* deified\n* able was I ere\
  \ I saw elba\n\n## 5.4 while 语句\n\n注意，某些回文的字符数是偶数，而另一些是奇数。列表 5.9 所示的 `PalindromeTester`\
  \ 程序用于测试一个字符串是否为回文。用户可以根据需要测试任意数量的字符串。\n\n`PalindromeTester` 代码包含两个循环，一个在另一个内部。外层循环控制测试多少字符串，内层循环逐字符地扫描\
  \ `Listing 5.9` 中的每一个字符串，直到确定该字符串是否为回文。\n\n```java\n//********************************************************************\n\
  // PalindromeTester.java Author: Lewis/Loftus\n//\n// 展示了嵌套 while 循环的使用。\n//********************************************************************\n\
  \nimport java.util.Scanner;\n\npublic class PalindromeTester\n{\n//-----------------------------------------------------------------\n\
  // 测试字符串以检查它们是否为回文。\n//-----------------------------------------------------------------\n\
  public static void main(String[] args)\n{\n    String str, another = \"y\";\n  \
  \  int left, right;\n    Scanner scan = new Scanner(System.in);\n    while (another.equalsIgnoreCase(\"\
  y\")) // 允许 y 或 Y\n    {\n        System.out.println(\"Enter a potential palindrome:\"\
  ); \n        str = scan.nextLine();\n        left = 0;\n        right = str.length()\
  \ - 1;\n        while (str.charAt(left) == str.charAt(right) && left < right)\n\
  \        {\n            left++;\n            right--;\n        }\n        System.out.println();\n\
  \n        if (left < right)\n            System.out.println(\"That string is NOT\
  \ a palindrome.\"); \n        else\n            System.out.println(\"That string\
  \ IS a palindrome.\"); \n        System.out.println();\n        System.out.print(\"\
  Test another palindrome (y/n)? \"); \n        another = scan.nextLine();\n    }\n\
  }\n}\n```\n\n**输出**\n```\nEnter a potential palindrome:\nradar\nThat string IS a\
  \ palindrome.\nTest another palindrome (y/n)? y\nEnter a potential palindrome:\n\
  able was I ere I saw elba\nThat string IS a palindrome.\nTest another palindrome\
  \ (y/n)? y\nEnter a potential palindrome:\nabcddcba\nThat string IS a palindrome.\n\
  Test another palindrome (y/n)? y\nEnter a potential palindrome:\nabracadabra\nThat\
  \ string is NOT a palindrome.\nTest another palindrome (y/n)? n\n```\n\n变量 `left`\
  \ 和 `right` 存储两个字符的索引。它们最初指向字符串两端的字符。内层循环的每次迭代都会比较由 `left` 和 `right` 指出的两个字符。当字符不匹配（意味着字符串不是回文）或者当\
  \ `left` 的值等于或大于 `right` 时，我们跳出内层循环。\n\n### break 和 continue 语句\n\nJava 包含了两个影响条件和循环的语句。\n\
  \n当执行 `break` 语句时，执行流立即转移到循环后的语句。例如，如果在循环体内执行 `break` 语句，循环将停止并执行循环后的语句。它“跳出”了循环。\n\
  \n在第 6 章中我们将看到，在编写 `switch` 语句时通常需要 `break` 语句。然而，在循环中永远不需要使用 `break` 语句。等效的循环总是可以不用它的。由于\
  \ `break` 语句会导致程序从一个地方跳转到另一个地方，在循环中使用 `break` 不是良好的做法。\n\n*continue 语句*对循环处理有影响。`continue`\
  \ 语句类似于 `break`，但它会重新评估循环条件，如果仍然为真则再次执行循环体。和 `break` 语句一样，循环中总是可以避免使用 `continue`。\n\
  \n## 自测题（答案见附录 N）\n\nSR 5.17 什么是无限循环？具体是什么导致了它？\n\nSR 5.18 下列代码段的输出是什么？\n```java\n\
  int low = 0, high = 10;\nwhile (low < high)\n{\n    System.out.println(low);\n \
  \   low++;\n}\n```\n\nSR 5.19 下列代码段的输出是什么？\n```java\nint low = 10, high = 0;\nwhile\
  \ (low <= high)\n{\n    System.out.println(low);\n    low++;\n}\n```\n\nSR 5.20\
  \ 下列代码段的输出是什么？\n```java\nint low = 0, high = 10;\nwhile (low <= high)\n{\n    System.out.println(low);\n\
  \    high = high - low;\n}\n```\n\nSR 5.21 下列代码段的输出是什么？\n```java\nint low = 0, high\
  \ = 10, mid;\nwhile (low <= high)\n{\n    mid = low;\n    while (mid <= high)\n\
  \    {\n        System.out.print(mid + \" \");\n        mid++;\n    }\n    System.out.println();\n\
  \    low++;\n}\n```\n\n\n\n\n\n# SR 5.22 假设 int 类型变量 `value` 已初始化为一个正整数。编写一个 `while`\
  \ 循环，打印 `value` 的所有正因数。\n\n例如，如果 `value` 为 28，它将打印 28 的因数：1 2 4 7 14 28\n\n![](img/index-268_1.png)\n\
  ![](img/index-268_2.png)\n\n![](img/index-268_3.png)\n\n## 5.5 迭代器\n\n**267**\n\n\
  # SR 5.23 假设 int 类型变量 `value` 已初始化为一个正整数。编写一个 `while` 循环，打印从 1 到 `value` 每个数字的所有正因数。例如，如果\
  \ `value` 为 4，它将打印：1 的因数：1\n\n2 的因数：1 2\n\n3 的因数：1 3\n\n4 的因数：1 2 4\n\n## 5.5 迭代器\n\
  \n`iterator`（迭代器）是一个对象，它包含的方法允许你一次处理一个项目集合。也就是说，`iterator` 允许你逐个遍历项目并根据需要与其进行交互。例如，你的\
  \ `iterator` 是一个帮助你处理一组相关目标的对象，这些目标可能是计算俱乐部每个成员的费用，或者打印项目（如 URL 的不同部分）。关键在于，`iterator`\
  \ 提供了一种一致且简单的机制，用于系统地处理一组项目。由于这本质上是一个重复过程，因此它与循环的概念紧密相关。\n\n从技术上讲，Java 中的 `iterator`\
  \ 对象是使用 `Iterator` 接口定义的，该接口将在第 7 章中讨论。目前，只需知道此类对象存在并且它们可以使项目集合的处理变得简单就有帮助了。\n\n\
  每个 `iterator` 对象都有一个名为 `hasNext` 的方法，它返回一个布尔值，表示是否至少还有一个项目待处理。因此，`hasNext` 方法可以作为循环的条件，以控制每个项目的处理。`iterator`\
  \ 还有一个名为 `next` 的方法，用于获取集合中下一个要处理的的项目。\n\nJava 标准类库中有几个类定义了 `iterator` 对象。其中之一是\
  \ `Scanner` 类，我们在之前的示例中多次使用过该类，来帮助我们从用户处读取数据。`Scanner` 类的 `hasNext` 方法在存在另一个输入标记待处理时返回\
  \ true。而且正如我们之前看到的，它有一个 `next` 方法，可以将下一个输入标记作为字符串返回。\n\n`Scanner` 类还具有 `hasNext`\
  \ 方法的变体，例如 `hasNextInt` 和 `hasNextDouble` 方法，允许你判断下一个输入标记是否为特定类型。同样，正如我们看到的，`next`\
  \ 方法也有变体，例如 `nextInt` 和 `nextDouble`，它们获取特定类型的值。\n\n当从标准输入流交互式读取输入时，`Scanner` 类的\
  \ `hasNext` 方法将等待输入可用，然后返回 true。也就是说，从键盘读取的交互式输入始终被认为有数据要处理——只是在用户输入之前，它尚未到达。这就是为什么在之前的示例中，我们使用了特殊的哨兵值来确定交互式输入的结束。\n\
  \n然而，当 `Scanner` 对象是一个 `iterator` 时，当扫描器用于处理来自具有特定终点的源的输入时，这一点特别有用，例如处理数据文件的行或处理字符字符串的各个。让我们来看这种类型处理的示例。\n\
  \n**268**\n\n**第 5 章 条件判断与循环**\n\n### 读取文本文件\n\n假设我们有一个名为 `urls.inp` 的输入文件，其中包含我们想要以某种方式处理的\
  \ URL 列表：\n\nwww.google.com\nwww.linux.org/info/gnu.html\nthelyric.com/calendar/\n\
  www.cs.vt.edu/undergraduate/about\nyoutube.com/watch?v=EHCRimwRGLs\n\nListing 5.10\
  \ 的程序从该文件中读取 URL 并对其进行剖析，以显示路径的不同部分。它使用一个 `Scanner` 对象来处理输入。事实上，它使用了多个 `Scanner`\
  \ 对象——一个用于读取数据文件的行，另一个用于处理每个 URL 字符串。\n\n#### Listing 5.10\n\n```java\n//********************************************************************\n\
  // URLDissector.java 作者: Lewis/Loftus\n//\n// 展示了使用 Scanner 读取文件输入并使用\n// 替代分隔符进行解析。\n\
  //********************************************************************\nimport java.util.Scanner;\n\
  import java.io.*;\n\npublic class URLDissector {\n    //----------------------------------------------------\n\
  \    // 从文件读取并打印它们的组件。\n    //----------------------------------------------------\n\
  \    public static void main(String[] args) throws IOException {\n        String\
  \ url;\n        Scanner fileScan, urlScan;\n        fileScan = new Scanner(new File(\"\
  urls.inp\"));\n\n        // 处理文件的每一行\n        while (fileScan.hasNext()) {\n   \
  \         url = fileScan.nextLine();\n            System.out.println(\"URL: \" +\
  \ url);\n\n            urlScan = new Scanner(url);\n            urlScan.useDelimiter(\"\
  /\");\n\n            // 打印 url 的每个部分\n            while (urlScan.hasNext()) {\n\
  \                System.out.println(\" \" + urlScan.next());\n            }\n  \
  \      }\n    }\n}\n```\n\n**输出**\n\n```\nURL: www.google.com\nURL: www.linux.org/info/gnu.html\n\
  \  info\n  gnu.html\nURL: thelyric.com/calendar/\n  calendar\nURL: www.cs.vt.edu/undergraduate/about\n\
  \  undergraduate\n  about\nURL: youtube.com/watch?v=EHCRimwRGLs\n  watch?v=EHCRimwRGLs\n\
  ```\n\n**269**\n\n**5.5 迭代器**\n\n此程序中有两个 `while` 循环，一个在另一个内部。外层循环处理每一行，内部循环处理每个标记。变量\
  \ `fileScan` 被创建一个操作输入文件的扫描器。与其将 `System.in` 传递给 `Scanner` 构造函数，我们实例化了一个代表输入文件的\
  \ `File` 对象并将其传递进去。此时，`fileScan` 对象已准备好读取并处理输入文件。\n\n如果由于某些原因找不到或打开输入文件，创建 `File`\
  \ 对象的尝试将抛出 `IOException`，这就是为什么我们在 main 方法中添加了 `throws IOException` 子句。（处理 I/O 异常将在第\
  \ 11 章进一步讨论。）\n\n只要输入文件扫描器的 `hasNext` 方法返回 true，外层 `while` 循环体就会执行——也就是说，循环每次迭代都会从输入文件中读取一行（一个\
  \ URL）并将其打印。\n\n对于每个 URL，都会设置一个新的 `Scanner` 对象来解析 URL 的片段，这在实例化 `urlScan` 对象时传递给\
  \ `Scanner` 构造函数。内部 `while` 循环将 URL 的每个标记打印在单独的一行。\n\n记住，默认情况下，`Scanner` 对象假设空白区域（空格、制表符和换行符）用输入标记的分隔符。这对于读取输入文件中每行标记的扫描器来说是有效的。然而，如果默认分隔符不能满足需求，可以更改它们。\n\
  \n在这种情况下，我们对由斜杠（ / ）字符分隔的路径部分感兴趣。调用扫描器的 `useDelimiter` 方法可以在处理 URL 字符串之前将分隔符设置为斜杠。\n\
  \n如果你想使用多个替代分隔符字符，或者想以更复杂的方式解析输入，`Scanner` 类可以处理称为*正则表达式*的模式，这些模式将在附录 H 中讨论。\n\n\
