  \ \"Starship Troopers\"，其长度为 208 页。\n\n## 8.4 命令行参数\n\nJava 应用程序 `main` 方法的形式参数始终是一个\
  \ `String` 对象的数组。我们在之前的示例中忽略了该参数，但现在我们可以讨论它偶尔可能有用之处。\n\n当应用程序提交给解释器时，Java 运行时环境会调用\
  \ `main` 方法。`String[] param`-命令行参数（我们通常称之为 `args`）代表在调用解释器时提供的命令行参数，并传递给 `main`\
  \ 方法。调用解释器时命令行上的任何额外信息都存储在 `args` 数组中供程序使用。这种技术是为程序提供输入的另一种方式。\n\n列表 8.10 显示的程序使用命令行参数打印名字标签。它假设第一个参数代表某种问候语，第二个参数代表人的名字。\n\
  \n如果命令行上没有为 `NameTag` 程序提供两个字符串，`args` 数组将不包含足够的（或任何）元素，程序中的引用将导致抛出 `ArrayIndexOutOfBoundsException`。如果命令行上包含了额外信息，它将存储在\
  \ `args` 数组中，但会被程序忽略。\n\n**列表 8.10**\n```java\n//********************************************************************\n\
  // NameTag.java Author: Lewis/Loftus\n//\n// 演示命令行参数的使用。\n//********************************************************************\n\
  public class NameTag\n{\n    //-----------------------------------------------------------------\n\
