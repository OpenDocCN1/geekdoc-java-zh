  \ (Recursion)\n\n### 12.1 递归思维 (Recursive Thinking)\n\nSR 12.1 递归是一种编程技术，其中方法调用其自身，每次解决一个较小规模的问题，直到达到终止条件。\n\
  \nSR 12.2 `List` 定义中的递归部分使用了 9 次来定义一个包含 10 个数字的列表。基准情况使用了一次。\n\nSR 12.3 当没有作为终止条件的基准情况，或者基准情况指定不当时，就会发生无限递归。递归路径将无限持续下去。在递归程序中，无限递归通常会导致指示可用内存已耗尽的错误。\n\
  \nSR 12.4 始终需要一个基准情况来终止递归并开始通过调用层次结构返回的过程。没有基准情况会导致无限递归。\n\nSR 12.5 如果 `n = 1`，则\
  \ `5 * n = 5`；如果 `n > 1`，则 `5 * n = 5 + (5 * (n − 1))`\n\n### 12.2 递归编程 (Recursive\
  \ Programming)\n\nSR 12.6 递归并不是必要的。每个递归算法都可以以迭代的方式编写。然而，某些问题的解决方案在用递归编写时会变得更加优雅和简单直观。\n\
  \n811 附录自测题答案\n\nSR 12.7 当迭代解决方案更简单、更容易理解和编程时，应避免递归。递归具有多次方法调用的开销，并且并不总是直观的。\n\n\
  SR 12.8 如果 `n < 0` 则返回 `-1`；否则返回整数 `n` 的位数。\n\nSR 12.9 下面的递归解决方案比迭代版本更复杂，因此通常不会这样处理。\n\
  \n```java\n// 返回 5 * num，假设 num > 0\nprivate static int multByFive(int num) {\n\
  \    int result = 5; // 当 num == 1\n    if (num > 1)\n        result = 5 + multByFive(num\
  \ - 1);\n    return result;\n}\n```\n\nSR 12.10 间接递归发生在一个方法调用另一个方法，后者调用另一个方法，以此此类推，直到其中一个被调用的方法调用原始方法。间接递归通常比直接递归（方法调用自身）更难追踪。\n\
  \n### 12.3 使用递归 (Using Recursion)\n\nSR 12.11 `MazeSearch` 程序递归处理与“当前”位置相邻的四个位置每一个，除非\
  \ (1) 当前位置位于游戏网格之外或 (2) 到达目标位置。\n\nSR 12.12 a. 迷宫在网格数组声明并初始化时定义。\nb. 检查是否到达终点的测试发生在\
