  \n### 其他动态表示\n\n你可以根据正在设计的程序的特定需求使用不同的列表实现。例如，在某些情况下，实现一个双向链表可能会使处理更容易，每个节点不仅有列表中下一个节点的引用，还有一个指向列表中上一个节点的引用。我们的通用\
  \ `Node` 类可以声明如下：\n\n```java\nclass Node\n{\n    int info;\n    Node next, prev;\n\
