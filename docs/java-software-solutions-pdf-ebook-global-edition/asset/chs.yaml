  \n播放和停止按钮同时通过文本标签和图像图标显示。它们还被赋予了快捷键（mnemonics），以便可以通过键盘部分控制点唱机。\n\n每当用户从组合框框做出选择时，组合框框就会产生一个动作事件。JukeBox\
  \ 程序为组合框框使用了一个动作监听器类，为两个推按钮使用了另一个。它们本可以合并，并使用代码来区分是哪个组件触发了事件。\n\n`ComboListener`\
  \ 类的 `actionPerformed` 方法在从组合框框中进行选择时执行。如果当前正在播放音频选择，它将会被停止。然后更新当前剪辑以反映新的选择。\n\n\
  请注意，音频片段在此时并不会立即播放。根据该程序的设计，用户必须按下播放按钮才能听到新的选择。\n\n`ButtonListener` 类的 `actionPerformed`\
  \ 方法在任意一个按钮被按下时执行。如果当前正在播放音频选择，它将会被停止。如果按下停止按钮，则任务完成。如果按下的是播放按钮，则将从头再次播放当前的音频选择。\n\
  \n**自测题**（答案见附录 N）\n- SR 11.23 什么是组合框框（combo box）？\n- SR 11.24 JukeBox 程序如何确保不会尝试播放与“Make\
  \ a Selection. ....”组合框框选项相关的歌曲？\n- SR 11.25 JukeBox 程序中定义了多少个动作监听器，它们分别监听什么？\n\
  - SR 11.26 详细描述 JukeBox 程序如何将用户在组合框框中的选择与特定的音频剪辑关联。\n\n### 11.9 滚动面板\n\n有时我们需要处理大到无法容纳在合理区域内的图像或信息。在这种情况下，`scroll\
  \ pane`（滚动面板）通常很有帮助。`scroll pane` 是提供组件受限视图的容器，并提供垂直或水平滚动条来更改该视图。当界面空间有限或所查看的组件很大或可以动态变化时，滚动条很有用。\n\
  \n列表 11.13 中的程序展示了一个包含单个滚动面板的框架。该滚动面板用于查看一张相当大的地图。大型对象或大量图像被放在标签中，并将标签添加到滚动面板中（使用了\
  \ `JScrollPane` 构造函数）。\n\n**列表 11.13**\n\n```java\n//****************************************************\n\
  // TransitMap.java 作者: Lewis/Loftus\n//\n// 展示滚动面板的使用。\n//****************************************************\n\
  import java.awt.*;\nimport javax.swing.*;\n\npublic class TransitMap\n{\n//----------------------------------------------------------------\n\
  // 展示一个包含滚动面板的框架，用于查看\n//纽约交通系统的地图。\n//-------------------------------------------------\n\
  public static void main(String[] args)\n{\nJFrame frame = new JFrame(\"纽约交通地图\"\
  );\nframe.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\nImageIcon image = new\
  \ ImageIcon(\"newyork.jpg\");\nJLabel imageLabel = new JLabel(image);\nJScrollPane\
  \ sp = new JScrollPane(imageLabel);\nsp.setPreferredSize(new Dimension(450, 400));\n\
  frame.getContentPane().add(sp);\nframe.pack();\nframe.setVisible(true);\n}\n}\n\
  ```\n\n### 显示\n\n滚动面板可以在容器右侧有一个垂直滚动条，并在底部有一个水平滚动条。对于每一个，程序员都可以指定滚动条是始终使用、从不使用，还是根据需要查看底层组件。默认情况下，垂直和水平滚动条都根据需要使用。TransitMap\
  \ 程序依赖这些默认值，由于图像在高度和宽度上都很大，因此两个滚动条都会出现。\n\n\n\n\n\n要移动滚动条，用户可以点击并拖动滚动条中称为 `knob`（滑块）的框，该框指示其在当前维度（向上/向下或向左/向右）的位置。或者，用户点击滑块右侧或左侧的栏，或者点击滚动条两端的箭头来调整位置。程序员可以确定这些操作中每一个改变可视区域程度。\n\
  \n请注意，以这种方式使用滚动面板时不需要设置事件监听器。滚动面板会自动对其滚动条的调整做出响应。\n\n### 自测习题\n*（答案见附录 N）*\n\nSR\
  \ 11.27 描述滚动面板上滚动条的使用。\n\nSR 11.28 如果你将 `TransitMap` 程序中传递给 `Dimension` 构造函数的第一个参数改为\
  \ 1000，会发生什么？请解释。\n\n### 11.10 分割面板 (Split Panes)\n`split pane`（分割面板）是一个容器，显示两个由可移动分割条隔开的组件。根据分割面板的设置，两个组件可以并排显示，也可以一个在另一个上方，如图\
  \ 11.3 所示。\n\n在 Java 中，我们可以使用 `JSplitPane` 类创建一个分割面板。\n\n**图 11.3** 分割面板的配置\n（可移动分割条：顶部组件\
  \ 左 右组件， 底部组件）\n![](img/index-600_1.png)\n\n分割面板的取向使用 `JSplitPane` 类中的常量进行设置，可以在创建容器时设置，也可以稍后显式设置。常量\
  \ `HORIZONTAL_SPLIT` 指定组件并排显示。相比之下，`VERTICAL_SPLIT` 指定组件一个在另一个上方显示。\n\n分割条的位置决定了分割面板中每个组件分配了多少可视区域。可以使用鼠标在容器区域上跨越式地拖动分割条。随着它的移动，一个组件的可视空间会增加，而另一个组件的会减少。只有当整个分割面板的大小改变时，分配给两个组件的总空间才会改变。\n\
  \n`JSplitPane` 尊重为其其显示的组件所设置的最小尺寸。因此，分割条可能不允许某部分尺寸缩小到某个特定点以下。要调整这一点，可以更改所显示组件的最小尺寸。\n\
  \n`JSplitPane` 对象的分割条可以设置成只需点击一下鼠标即可向一个或另一个方向扩展。默认情况下，分割条没有此功能，只能通过拖动来移动。如果启用此功能，分割条将出现两个指向相反方向的小箭头。点击这些箭头中的任意一个会导致分割条完全向该方向移动，从而使分配给其中一个组件的空间最大化。此功能通过\
  \ `setOneTouchExpandable` 方法设置，该方法接受一个 `boolean` 参数。分割条的大小和分割条的初始位置也可以显式设置。\n\n\
  在 `JSplitPane` 上可以设置的另一个功能是：在移动分割条时，组件是否会持续调整并重绘。如果未设置此功能，组件的布局管理器将只有在分割条停止移动后才被调用。此功能默认关闭，并可以在创建\
  \ `JSplitPane` 对象时或通过使用 `setContinuousLayout` 方法开启。\n\n可以通过将一个分割面板放入另一个分割面板的一侧或两侧来嵌套分割面板。例如，我们可以通过将一个分割面板放入另一个分割面板的顶部组件中，从而将一个容器分为三个部分。这样就会有两个分割条：一个将总区域分为两个主要部分，另一个将其中一个部分再分为另外两个部分。每个部分显示多少可视区域取决于分割条放置的位置。\n\
  \n代码列表 11.14 所示的程序向用户展示图像文件名列表。当选择其中一个文件名时，相应的图像显示在分割面板的右侧。\n\n分割面板在 `main` 方法中创建并添加到框架中显示。分割面板使用\
  \ `HORIZONTAL_SPLIT` 常量进行定向，使得包含列表的面板和包含要显示图像的标签并排。调用 `setOneTouchExpandable` 方法会导致分割面板的分割条显示箭头，允许用户通过点击鼠标将面板向一个方向或另一个方向扩展。\n\
  \n**代码列表 11.14**\n```java\n//********************************************************************\n\
  // PickImage.java Author: Lewis/Loftus\n//\n// 演示分割面板和列表的使用。\n//********************************************************************\n\
  import java.awt.*;\nimport javax.swing.*;\n\npublic class PickImage\n{\n    //-----------------------------------------------------------------\n\
  \    // 创建并显示一个包含分割面板的框架。\n    // 用户从列表中选择一个要显示的图像名称。\n    //-----------------------------------------------------------------\n\
  \    public static void main(String[] args)\n    {\n        JFrame frame = new JFrame(\"\
  Pick Image\");\n        frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \        JLabel imageLabel = new JLabel();\n        JPanel imagePanel = new JPanel();\n\
  \        imagePanel.add(imageLabel);\n        imagePanel.setBackground(Color.white);\n\
  \        ListPanel imageList = new ListPanel(imageLabel);\n        JSplitPane sp\
  \ = new JSplitPane(JSplitPane.HORIZONTAL_SPLIT, imageList, imagePanel);\n      \
  \  sp.setOneTouchExpandable(true);\n        frame.getContentPane().add(sp);\n  \
  \      frame.pack();\n        frame.setVisible(true);\n    }\n}\n```\n![](img/index-602_1.png)\n\
  \n### 显示\n列表 11.15 中的 `ListPanel` 类 定义了包含列表的面板。我们使用由 `JList` 类定义的 `list` 组件来显示文件名列表。列表内容设置为\
  \ `String` 对象的数组，并传递给 `JList` 构造函数。\n\n**代码列表 11.15**\n```java\n//********************************************************************\n\
  // ListPanel.java Author: Lewis/Loftus\n//\n// 代表 PickImage 程序的图像列表。\n//********************************************************************\n\
  import java.awt.*;\nimport javax.swing.*;\nimport javax.swing.event.*;\n\npublic\
  \ class ListPanel extends JPanel\n{\n    private JLabel label;\n    private JList\
  \ list;\n\n    //-----------------------------------------------------------------\n\
  \    // 将文件名加载到列表中。\n    //-----------------------------------------------------------------\n\
  \    public ListPanel(JLabel imageLabel)\n    {\n        label = imageLabel;\n \
  \       String[] fileNames = { \"circuit.gif\", \"duke.gif\", \"hammock.gif\", \"\
  justin.jpg\", \"kayla.jpg\", \"tiger.jpg\", \"toucan.gif\", \"worldmap.gif\" };\n\
  \        list = new JList(fileNames);\n        list.addListSelectionListener(new\
  \ ListListener());\n        list.setSelectionMode(ListSelectionModel.SINGLE_SELECTION);\n\
  \        add(list);\n        setBackground(Color.white);\n    }\n\n    //*****************************************************************\n\
  \    // 代表图像列表的监听器。\n    //*****************************************************************\n\
  \    private class ListListener implements ListSelectionListener\n    {\n      \
  \  public void valueChanged(ListSelectionEvent event)\n        {\n            if\
  \ (list.isSelectionEmpty())\n                label.setIcon(null);\n            else\n\
  \            {\n                String fileName = (String)list.getSelectedValue();\n\
  \                ImageIcon image = new ImageIcon(fileName);\n                label.setIcon(image);\n\
  \            }\n        }\n    }\n}\n```\n\n\n\n通常情况下，`JList` 组件中的所有选项都是可见的。当用户使用鼠标选择某项时，该项会被高亮。当选择新项时，之前选中的项会自动取消高亮。\n\
  \n`JList` 的内容可以使用传递给构造函数的对象数组来指定。`JList` 类的方法用于以各种方式管理列表，包括获取当前选中的项。\n\n注意组合框（在第\
  \ 11.8 节描述）与 `JList` 对象之间的相似之处和不同。两者都允许用户从一组选项中选择一个项目。然而，列表上的选项始终始终的，并高亮当前选择项；而组合框仅在用户用鼠标点击它时才显示选项。组合框中始终显示的唯一项是当前选择项。\n\
  \n当列表的当前选择发生变化时，`JList` 对象会生成一个*列表选择事件*。`ListSelectionListener` 接口包含一个名为 `valueChanged`\
  \ 的方法。在该程序中，名为 `ListListener` 的私有内部类定义了文件名列表的监听器。\n\n监听器的 `valueChanged` 方法调用 `JList`\
  \ 对象的 `isSelectionEmpty` 方法来确定当前是否有任何选中的值。如果没有，则将标签图标设置为 `null`。如果有，则使用 `getSelectedValue`\
  \ 方法获取文件名。然后创建相应的图像图标并将其显示在标签中。\n\n`JList` 对象可以设置为允许同时选择多个项。*列表选择模式*可以是三个选项之一，如图\
  \ 11.4 所示的表格所示。\n\n列表选择模式由 `ListSelectionModel` 对象定义。默认情况下，列表允许多项间隔选择。通过使用 `ListSelectionModel`\
  \ 类中定义的常量调用 `setSelectionMode` 方法，可以显式地设置列表选择模式。\n\n在 `PickImage` 程序中，我们将列表选择模式设置为单选，因为由于一次只能显示一张图像。然而，即使在该程序中允许多个`列表选择模式`，`getSelectedValue`\
  \ 方法也会返回第一个被选中的项，因此该项将是显示的图像。一个名为 `getSelectedValues` 的类似方法返回一个表示在允许多项选择时选中项的对象数组。\n\
  \n`JList` 构造函数可以传递 `String` 对象的数组，而是传递一个 `ImageIcon` 对象的数组。在这种情况下，图像将显示在列表中。\n\n\
  ### 图 11.4 列表选择模式\n\n| 模式 | 说明 |\n| :--- | :--- |\n| 单选 | 一次只能选择一个项。 |\n| 单项间隔选择\
  \ | 一次可以选择多个连续的项。 |\n| 多项间隔选择 | 可以选择任意组合的项。 |\n\n### 自测习题（答案见附录 N）\n- **SR 11.29**:\
  \ 描述拆分窗（split pane）上分割条的作用。\n- **SR 11.30**: 组合框（第 11.8 节）的显示方式与 `JList` 对象的显示方式有什么区别？\n\
  \n### 核心概念总结\n- 错误和异常是表示异常或无效处理的对象。\n- 抛出异常时打印的消息提供了方法调用堆栈跟踪。\n- 每个 `catch` 子句处理\
  \ `try` 块内可能抛出的特定类型异常。\n- `finally` 子句无论 `try` 块是正常退出还是因为抛出异常而退出，都会被执行。\n- 如果异常在发生发生处没有被捕获和处理，它将传播到调用它的方法。\n\
  - 程序员必须仔细考虑何时以及何地处理异常（如果处理的话）。\n- 新异常通过从 `Exception` 类或其一个子类派生一个新类来定义。\n- 对于在方法中未捕获和处理的受检异常，方法头中必须包含\
  \ `throws` 子句。\n- 流是字节的顺序序列；它可以作为输入源或输出目标。\n- `System` 类中的三个公共引用变量代表标准 I/O 流。\n\
  - 输出文件流应该被显式关闭，否则它们可能无法正确地保留写入它们的数据。\n- Java 类库包含许多用于定义具有各种特征的 I/O 流的类。\n- 提示（Tool\
  \ tips）和记忆符（mnemonics）可以增强图形用户界面的功能。\n- 当组件的使用不合适时，应该禁用它们。\n- 组合框为用户提供下拉菜单。\n- 滚动面板（scroll\
  \ pane）对于查看大型对象或大量数据很有用。\n- 拆分窗（split pane）并排显示两个组件或上下显示两个组件。\n\n## 练习\n- **EX 11.1**:\
