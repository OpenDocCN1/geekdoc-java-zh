  \ Isaac, and Dévi Loftus*\n\n*本页特意留白。*\n\n# 前言\n欢迎阅读《Java 软件解决方案：程序设计基础》第八版。我们很高兴多年来这本书一直满足许多学生和教员的需求。本版经过进一步定制，以改进对入门计算中关键主题的覆盖。\n\
  \n## 本版新内容\n本版最大的更新包括：\n- 更新了所有图形截图。\n- 添加了额外的截图以显示界面选项。\n- 修订了章末练习和编程项目。\n- 修订了所有代码中的空格一致性问题。\n\
  - 改进了对 Java 翻译、文本文件 I/O 等主题的讨论。\n\n来自教师和学生的反馈不断表明，我们在书籍整体愿景上是正确的。重点仍然是以清晰、循序渐进的方式呈现核心概念。每章中的“图形轨道（Graphics\
  \ Track）”部分仍然将图形和图形用户界面的涵盖分开，为这些材料的讲解提供了极大的灵活性。\n\n轻松的写作风格和趣味性的示例仍然占据主导地位。\n\n图形程序（包括带有图形用户界面的程序）的截图已全部更新。之前的版本在视觉效果上有些过时。我们根据需要对部分内容进行了更新。\n\
  \n在某些图形程序中，我们添加了额外的截图，以显示程序在不同情况下的外观。\n\n我们在修订中还关注了章末练习和编程项目。我们对这些内容进行了增删修改，以提供合适且更新的版本。\n\
  \n整本书示例在空格使用上变得不一致。我们仔细检查了每个示例和代码片段，以确保采用一致且适当的风格。\n\n最后，一如既往，我们改进了书中的讨论，有时是微小的，其中几处是重大改进。特别是\
  \ Java 翻译的讨论在第一章及全文中进行了更新，专注于 `JVM` 而不是不实用的“解释器”。与翻译过程相关的图表也已更新。文本文件 I/O 的讨论及其示例也进行了更新。\n\
  \n## 本书核心\n本书基于以下基本理念，我们认为这些理念构建了良好的入门教材：\n\n- **真正的面向对象：** 一本真正教授坚实面向对象方法的教材必须使用我们所说的“对象语言”。也就是说，所有处理都应该用面向对象的术语进行讨论。然而，这并不意味着学生看到的第一个程序就讨论编写多个类和方法。学生在学习编写对象之前先学习使用对象。本书采用了自然的进展，最终使具备设计真实的面向对象解决方案的能力。\n\
  - **良好的编程实践：** 学生不应该被教如何编程，而应该被教如何编写良好的软件。两者是有区别。编写软件不是一套菜谱式的动作，良好的程序不仅仅是语句的集合。本书整合了作为良好编程基础的实践。这些实践应用于所有示例中，并在讨论中得到了加强。\n\
  \n学生学习如何解决问题，以及如何实现解决方案。我们在书中引入并整合了基础软件工程技术。“**软件失败（Software Failure）**”案例通过展示不遵循这些良好实践的危险，重申了这些教训。\n\
  \n\n\n\n\n# 示例\n学生通过示例进行学习。本文包含了许多完整实现的示例，用于演示特定的概念。我们将短小、易于理解的示例与更大、更贴的示例交织在一起。在图形化和非图形化程序之间取得了平衡。\n\
  \n`VideoNotes`（视频笔记）以现场演示的形式提供了额外的示例。\n\n# 图形与 GUI\n图形可以成为学生极佳的动力，它们的使用可以作为面向对象编程的优秀示例。因此，我们在全书中通过一组定义良好的章节来使用它们，我们称这些章节为“图形轨道”（Graphics\
  \ Track）。这些内容涵盖了事件处理和 GUI 的使用。学生将通过主题的自然演进学习如何以正确的方式构建 GUI。对于不选择使用图形的学生，可以完全跳过“图形轨道”。\n\
  \n## 章节详解\n\n### 第 1 章（引言）\n介绍了通用的计算机系统，包括基础体系和硬件、网络、编程和语言转换。本章介绍了 Java，并讨论了通用程序开发的基础以及面向对象编程的基础。本章包含了广泛的介绍性材料，可以在学生熟悉开发环境时涵盖这些内容。\n\
  \n### 第 2 章（数据与表达式）\n探索了 Java 程序中用到的一些基本数据类型以及使用表达式进行计算。它讨论了数据从一种类型到另一种类型的转换，以及如何借助标准\
  \ `Scanner` 类从用户处交互式读取输入。\n\n### 第 3 章（使用类和对象）\n探索了预定义类的使用以及从这些类创建的对象。类和对象被用于处理字符串、生成随机数、执行复杂计算和格式化输出。还讨论了枚举类型。\n\
  \n### 第 4 章（编写类）\n探索了与编写类和方法相关的各种问题。主题包括实例数据、可见性、作用域、方法参数和返回类型。还涵盖了封装和构造函数。一些较复杂的课题推迟到了第\
  \ 6 章或在后续中重新回顾。\n\n### 第 5 章（条件语句与循环）\n涵盖了使用布尔表达式进行决策。然后详细探讨了 `if` 语句和 `while` 循环。一旦建立了循环，就引入了迭代器概念，并重新回顾了\
  \ `Scanner` 类用于额外的输入解析和文本文件的读取。最后引入了 `ArrayList` 类，它提供了管理大量对象的选项。\n\n### 第 6 章（更多条件语句与循环）\n\
  检查了 Java 其余条件（`switch`）和循环（`do`, `for`）语句。讨论了所有与条件和循环相关的语句，包括增强版的 `for` 循环。`for-each`\
  \ 循环也用于处理迭代器和 `ArrayList` 对象。\n\n### 第 7 章（面向对象设计）\n强化并扩展了与类设计相关问题的覆盖。讨论了识别问题所需的类和对象以及它们之间关系的技术。本章还涵盖了静态成员、接口。\n\
  \n### 第 8 章（数组）\n包含了数组的广泛覆盖。内容包括命令行参数、变量长度和多维数组。\n\n### 第 9 章（继承）\n涵盖了类层次结构、重写和可见性，这些是关于类设计的主题。本章还讨论了方法重载。\n\
  \n### 第 10 章（多态）\n探索了绑定的概念。然后讨论了如何通过继承或接口来实现多态。与多态相关的设计问题也得到了讨论。\n\n### 第 11 章（异常）\n\
  探索了 Java 标准库中的异常。我们还讨论了处理输入输出时的异常对象。\n\n### 第 12 章（递归）\n涵盖了递归的概念、实现。通过不同领域的示例演示了递归技术。\n\
  \n### 第 13 章（集合）\n介绍了集合的概念及其底层数据结构。本章作为对泛型介绍的背景回顾。\n\n## 补充材料\n\n### 学生在线资源\n这些学生资源可以通过配套网站\
