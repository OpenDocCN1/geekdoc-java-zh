  \n## 3.11 图像\n图像在基于图形的软件中通常起着重要作用。Java 能够多种方式使用 JPEG 和 GIF 图像。`Graphics` 类包含一个 `drawImage`\
  \ 方法，允许你像绘制形状或字符字符串一样绘制图像。图像也可以被包含在标签（label）组件中。让我们更详细地探索图像与标签之间的关系。\n\n正如我们在之前的章节中看到的，由核心概念\
  \ `JLabel` 类定义的标签可以用于向用户提供信息。标签可以包含文本、图像，或者描述界面中的其他组件。`JLabel` 或两者都可以包含一个图像。也就是说，一个标签可以由文本、图像或两者共同组成。\n\
  \n`ImageIcon` 类用于表示包含在标签中的图像。`ImageIcon` 构造函数接收图像文件的名称并将其加载到对象中。`ImageIcon` 对象可以使用\
  \ JPEG 或 GIF 图像创建。\n\n标签内部文本和图像的对齐方式可以通过 `JLabel` 构造函数或特定方法显式设置。同样，我们可以设置文本相对于图像的位置。\n\
  \n列表 3.9 显示的 `LabelDemo` 程序显示了几个标签。每个标签以不同的方向显示其文本和图像。\n\n传递给 `JLabel` 构造函数的第三个参数定义了标签在面板允许标签的空间内的水平位置。`SwingConstants`\
  \ 接口包含了多个被各种 Swing 组件使用的常量，这使得引用它们变得容易。\n\n标签文本和图像的方向通过 `setHorizontalTextPosition`\
  \ 和 `setVerticalTextPosition` 方法显式设置。如第一个标签所示，文本的默认水平位置在右侧（图像在左侧），文本的默认垂直位置相对于图像垂直居中。\n\
  \n不要将容器中标签的水平位置与文本与图像之间方向的设置混淆。构造函数的第三个参数决定前者，而显式方法调用决定后者。\n\n通过将图像放入标签中，它就成了与容器中所有其他组件一起布局的组件的一部分，而不是在特定位置绘制。这是一个恰当的设计决策：是使用\
  \ `Graphics` 类的 `drawImage` 方法绘制图像，还是使用标签来显示图像。\n\n# 178\n# 第 3 章 使用类和对象\n\n## 列表\
  \ 3.9\n*继续*\n\n```java\n//********************************************************************\n\
