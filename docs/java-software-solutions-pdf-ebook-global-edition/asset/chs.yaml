  \n在 `Direction` 程序中，用户可以按住方向键并观察图像快速穿过屏幕。\n\n生成键事件的组件是当前具有`键盘焦点`的组件。通常，键盘焦点由主要的“活动”组件持有。当用户用鼠标点击组件时，该组件通常会获得键盘焦点。面板构造函数中对\
  \ `setFocusable` 方法的调用将键盘焦点设置为面板。\n\n`Direction` 程序没有为箭头图像设置边界，因此它可以被移动到可见窗口之外，然后根据需要再次移回来。你可以向监听器添加代码，当图像到达窗口任一边界时停止其移动。这一修改被留作为一个编程项目。\n\
