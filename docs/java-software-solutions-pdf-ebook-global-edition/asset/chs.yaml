  \nPP 13.7 设计并实现一个计算后缀表达式的应用程序，该表达式对整数操作数使用运算符 `+`、`-`、`*`、`/` 和 `%`。我们已经熟悉运算符位于两个操作数之间的表达式。后缀表达式将运算符放在操作数之后。请记住，操作数可以是另一个操作的结果。例如，以下中缀表达式：\n\
  `(5 + 2) * (8 − 5)`\n等同于以下后缀表达式：\n`5 2 + 8 5 − *`\n\n后缀表达式可以使用 `stack`。从左到右处理后缀表达式时，你会遇到操作数运算符。如果遇到操作数，将其\
  \ `push` 入栈。如果遇到运算符，从栈中 `pop` 出操作数，执行操作并将结果 `push` 回栈。处理完整个表达式后，栈上有一个值即整个表达式的结果。\n\
  \n你可能需要使用 `StringTokenizer` 对象辅助解析表达式。你可以假设表达式是有效的后缀格式。\n\nPP 13.8 设计并实现一个程序，提示用户输入字符串，然后进行两次回文测试。第一个使用单个\
  \ `stack` 测试字符串是否为回文。第二个使用两个 `stack` 测试在忽略大小写、空格、标点符号和其他非字母数字字符的情况下字符串是否为回文。程序应打印两次测试的结果。\n\
  \nPP 13.9 设计并实现一个名为 `StringTree` 的类，它是按字母顺序存储 `String` 对象的二叉树。树中的每个节点应由 `Node` 类表示，该类存储字符串值以及指向左右子节点的指针。对于树中的任何节点值，其左子节点的值应在该值之前，右子节点的值应在该值之后。`StringTree`\
  \ 类应包含一个向树中添加字符串的方法和一个按字母顺序打印树值的方法。编写一个驱动程序，从文件（每行一个）读取字符串并将其添加到树中。处理输入后，打印树值。\n\
  \nPP 13.10 设计并实现一个应用程序，支持主持的问答环节，其中观众成员向 `queue` 提交问题。`queue` 头部的问题可以由演讲者或小组回答，并且随时可以检索已回答或未回答的问题的列表。\n\
  \n程序应接受以下简单命令：\n\n\n\n'Q' 允许观众成员提交一个问题以及他们的姓名；'A' 允许演讲者对当前队列顶端的问题输入答案；'P' 允许演讲者跳过一个问题，将其从队列头部移动到末尾；'R'\
  \ 允许演讲者将某个问题标记为拒绝，并将其从队列中移除；'LA' 将打印已回答问题的编号列表及其答案；'LU' 将打印未回答问题的编号列表；最后，'X' 将打印已回答和未回答问题的编号列表，然后退出程序。\n\
  \n你应当创建一个 `Question` 类来存储每个问题、其答案以及任何其他问题状态信息。已回答队列和未回答队列应该使用 `java.util.LinkedList`\
  \ 类来实现。你必须且仅使用该类中提供 `Queue` 功能的方法：移除第一个元素、在末尾添加元素、获取队列大小以及遍历列表。\n\n# 术语表\n\n###\
