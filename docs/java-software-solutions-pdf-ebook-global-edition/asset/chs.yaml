  \ 2.21 写一个显示带有八个不同切片的饼图的 Applet。\n\n# 第 2 章 数据与表达式\n\n# 火星轨道探测器与极地着陆器软件故障\n\n###\
  \ 发生了什么？\n\n作为探索火星系列任务的一部分，NASA 于 1998 年 12 月发射了火星轨道探测器，并于 1999 年 1 月发射了极地着陆器。这项双探测器任务的设计目的是观察火星每个季节的状况。轨道探测器和着陆器将收集温度、水蒸气、云以及火星极地区增加和减少二氧化碳的数据。\n\
  \n在经历了九个月旅行后，轨道探测器于 1999 年 9 月到达火星，并启动了主引擎以建立轨道。轨道探测器五分钟后按照计划出现在行星后方（从地球视角看），但 NASA\
  \ 未能与其重新联系。数据审查显示，轨道探测器进入轨道时的高度仅为 57 公里，而计划高度为 140 公里。最小生存高度在 85 到 100 公里之间。NASA\
  \ 得出的结论是其被大气摩擦破坏了。\n\n极地着陆器于 1999 年 12 月到达火星，所有数据表明它将在火星南极目标地点 10 公里内实现软着陆。然而，NASA\
  \ 在其进入大气层后不久失去了与着陆器的联系。在随后的几周和几个月里，多次尝试联系均未成功。\n\n轨道探测器和着陆器的项目总成本为 3.276 亿美元。\n\n\
  ### 是什么造成的？\n\n轨道探测器问题的根源是一个尴尬的通信问题。引导航器导航的软件使用的是制单位（磅力），而航器本身期望的是公制单位（牛顿）。因此，预期的导航变化与实际效果偏差了\
  \ 4.45 倍。这种不匹配在部分是因为一个位于科罗拉多州的团队负责航器工作，而另一个位于加利福尼亚州的团队负责导航问题。\n\n\n\n\n\n# 第 3 章\
  \ 使用类和对象\n\n着陆器通信问题的原因尚未明确，但据认为与轨道器的问题无关。调查结论认为，最可能的原因是一个软件错误，该错误将着陆器支腿的部署误认为是已着陆在行星表面。这会导致引擎在着陆器仍距离地面\
  \ 40 米高时就关闭。然而，也存在其他可能性。\n\n## 经验教训\n\n火星探测器的单位不匹配表明，显而易见的问题可能会被忽视。错误是不可避免的，但必须建立相应的流程来捕获它们。调查得出结论，在这种情况下，子系统之间元素的跟踪和双重检查系统不够健壮。此外，团队对新成员的培训不一致，某些通信渠道过于非正式。单位不匹配发现得太晚了。这强调了进行更多评估和测试的必要性。\n\
  \n来源：nasa.gov\n\n## 类与对象\n\n- 讨论对象的创建和引用变量的使用。\n- 探索 `String` 类提供的服务。\n- 描述 Java\
  \ 标准库如何组织成包。\n- 探索 `Random` 和 `Math` 类提供的服务。\n- 讨论使用 `NumberFormat` 和 `DecimalFormat`\
  \ 类格式化输出的方法。\n- 引入枚举类型。\n- 包装类（wrapper classes）和自动装箱（autoboxing）概念。\n- 介绍图形界面使用的组件。\n\
  - 描述预定义类的使用。\n\n使用类和对象及其提供的服务是面向对象软件的基础部分，并为编写程序奠基础。在本章中，我们使用类和对象来处理字符串、执行计算并格式化输出。本章还引入了枚举类型的概念（这是一种特殊的\
  \ Java 类型），并讨论了包装类。\n\n## 3.1 创建对象\n\n在第 1 章结束时，我们介绍了面向对象概念的概述，包括类和对象之间的基本关系。在第\
  \ 2 章，除了讨论原始数据类型外，我们提供了一些使用对象来提供服务的示例。本章将进一步探索这些思想。在之前的示例中，我们多次使用了 `println` 方法。正如第\
  \ 2 章提到的，`println` 方法是由 `System.out` 提供的服务，它代表标准输出流。更准确地说，标识符 `out` 是存储在 `System`\
  \ 类中的对象变量。我们可以直接使用它。\n\n在第 2 章中，我们还使用了 `Scanner` 类，它代表一个允许我们从键盘或文件读取输入的对象。我们使用 `new`\
  \ 操作符创建了一个 `Scanner` 对象。一旦对象创建，我们就可以使用它调用它的方法。让我们仔细检查创建对象的想法。在 Java 中，变量代表一个原始值或一个对象。与持有原始类型的变量一样，引用对象的变量也必须声明。用于定义对象的类可以被视为对象的类型。对象变量的声明结构与原始变量的声明结构相似。\n\
  \n考虑以下两个声明：\n\n```\nint num;\nString name;\n```\n\n第一个声明创建了一个持有整数值的变量，正如我们之前多次看到的。。第二个声明创建了一个\
  \ `String` 变量，它持有指向一个 `String` 对象的引用。对象变量本身并不持有对象；它持有的是对象的地址。\n\n最初，上面声明的两个变量不包含任何数据。我们称它们是未初始化的（uninitialized），可以如下所示所示：\n\
  \n`num` – `name` –\n\n正如我们在第 2 章中指出的，在使用变量之前确保其已初始化始终是重要的。对于对象变量，这意味着我们必须在使用之前确保它指向一个有效对象。在大多数情况下，如果你尝试在初始化之前使用一个变量，编译器将抛出错误。\n\
  \n对象变量也可以设置为 `null`，这是 Java 中的一个保留字。`null` 引用特别表示变量没有引用对象。注意，尽管我们声明了一个 `String`\
  \ 引用变量，但实际上还没有 `String` 对象。使用 `new` 操作符创建对象的被称为实例化（instantiation）。对象被称为特定类的实例（instance）。要实例化对象，我们可以使用\
  \ `new` 操作符，它返回新对象的地址。以下两个赋值语句为声明的变量赋值：\n\n```\nnum = 42;\nname = new String(\"\
  James Gosling\");\n```\n\n在 `new` 操作符创建对象后，会调用构造函数（constructor）进行初始化。构造函数是一个与类名相同的特殊方法。在这个示例中，构造函数的参数是一个字符串字面量，指定了新创建的\
  \ `string` 对象将持有的字符。`new` 操作符返回引用。执行这些赋值后，变量可以描述为：\n\n`num` = 42\n`name` = \"James\
  \ Gosling\"\n\n由于对象引用变量持有对象的地址，它可以被视为内存中存储对象位置的指针（pointer）。我们可以显示数值地址，但实际地址值是无关的——重要的是该变量指向一个特定的对象。\n\
  \n对象实例化后，我们使用点操作符（dot operator）来访问它的方法。我们已经多次使用点操作符，例如在调用 `System.out.println` 时。点操作符直接附加在对象引用之后，后面跟着要调用的方法。例如，为了调用\
  \ `String` 类定义的 `length` 方法，我们可以在 `name` 引用变量上使用点操作符：\n\n```\ncount = name.length()\n\
  ```\n\n`length` 方法不接受任何参数，但括号仍然必要的，以表示正在调用方法。某些方法会产生一个方法完成后返回（returned）的值。`String`\
  \ 类 `length` 方法的作用确定并返回字符串的长度（包含的字符数）。在这个示例中，返回的值被赋值给变量 `count`。对于字符串 \"James Gosling\"\
  ，长度方法返回 13，这包含了姓名之间的空格。\n\n\n\n\n\n声明对象引用变量和创建对象本身的操作可以通过在声明时初始化变量来合并为一个步骤，就像我们处理原始数据类型一样：\n\
  \n```java\nString title = new String(\"Java Software Solutions\");\n``` 即使字符串不是原始数据类型，但它们是如此基础且使用频繁，以至于\
  \ Java 定义了由双引号分隔的字符串字面量，正如我们在各种示例中看到的那样。这是一个简写符号。每当字符串字面量出现时，都会自动创建一个 `String` 对象。因此，以下声明是有效的：\n\
  \n```java\nString city = \"London\";\n```\n\n也就是说，对于 `String` 对象，可以消除显式地使用 `new`\
  \ 运算符和对构造函数的调用。在大多数情况下，我们将使用这种简化的语法。\n\n### 别名 (aliases)\n\n由于对象引用变量存储的是地址，因此程序员在管理对象时必须小心。首先，让我们回顾赋值对原始类型值的影响。假设我们有两个整数变量\
  \ `num1` 初始化为 `5`，`num2` 初始化为 `12`：\n\n```\nnum1 = 5\nnum2 = 12\n```\n\n在接下来的赋值语句中，存储在\
  \ `num1` 中的值被存储到 `num2` 中：\n\n```java\nnum2 = num1;\n```\n\n`num2` 中的原始值 `12` 被值\
  \ `5` 覆盖。变量 `num1` 和 `num2` 仍然指向内存中的不同位置，而这两个位置现在都包含值 `5`：\n\n```\nnum1 = 5\nnum2\
  \ = 5\n```\n\n![](img/index-144_1.png)\n\n## 3.1 创建对象\n\n**143**\n\n现在考虑以下对象声明：\n\
  \n```java\nString name1 = \"Ada, Countess of Lovelace\"; String name2 = \"Grace\
  \ Murray Hopper\";\n```\n\n最初，引用 `name1` 和 `name2` 指向两个不同的 `String` 对象：\n\n```\n\
  name1 = \"Ada, Countess of Lovelace\"\nname2 = \"Grace Murray Hopper\"\n```\n\n\
  现在假设执行以下赋值语句，将 `name1` 中的值复制到 `name2`：\n\n```java\nname2 = name1;\n```\n\n此赋值的操作与整数赋值相同——`name1`\
  \ 值的副本被存储在 `name2` 中。但记住，对象变量持有的是对象的地址，被复制的是地址。最初，两个引用指向不同的对象。赋值后，`name1` 和 `name2`\
  \ 均包含相同的地址，因此指向同一个对象：\n\n```\nname1 = \"Ada, Countess of Lovelace\"\nname2 = \"\
  Ada, Countess of Lovelace\"\n```\n\n`name1` 和 `name2` 引用变量现在是彼此的**别名 (aliases)**，因为它们是指向同一个对象的两个名称。所有多个引用变量都可以指向同一个对象。原本由\
  \ `name2` world 的引用现在已消失；该对象在程序中无法再次被使用。\n\n别名的一个重要影响是，当我们使用一个引用来更改对象时，另一个引用对应的对象也会随之改变，因为实际上只有一个对象。除非仔细管理，否则别名可能会产生不良后果。\n\
  \n与对象的所有交互都通过引用变量进行，因此只有当我们拥有该对象的引用时，才能使用它。当对一个对象的所有引用都丢失时（可能是通过重新赋值），该对象将无法再对程序做出贡献。程序无法再次调用它的方法或使用它的变量。此时，该对象被称为`垃圾\
  \ (garbage)`，因为它不再具有任何用处。\n\nJava 执行`自动垃圾回收 (automatic garbage collection)`。当对对象的最后一个引用丢失时，它就变成了垃圾回收的候选对象。有时，Java\
  \ 环境会在后台执行“收集”并将内存返回给系统。\n\n**144**\n**第 3 章 类和对象**\n\n自复习：\n- 什么是 `null` 引用？\n\
  - `new` 运算符实现了什么功能？\n- 什么是`别名 (alias)`？\n- 它与垃圾回收有什么关系？\n- 为 `String` 变量 `author`\
