  \ 显示此文档的一个页。侧边的链接允许你查看特定的包并跳转到特定的类。花点时间\n\n**import 声明**\n\n\n\n\n`java.lang` 包中的类在编写\
  \ Java 程序时是可以自动使用的。然而，要使用任何其他包中的类，我们必须使用`完全限定`（fully qualify）引用或使用 `import declaration`（导入声明）。请记住，使用\
  \ `Scanner` 类的示例程序包含一个导入声明。\n\n当你想要在程序中使用类库中的类时，可以在每次引用它时都使用它的完全限定名（包括包名）。例如，每当你想要引用定义在\
  \ `java.util` 包中的 `Scanner` 类时，你可以写 `java.util.Scanner`。\n\n然而，每次需要都完全指定包名和类名很快就会变得非常累。Java\
  \ 提供了 import 声明来简化这些引用。\n\n![](img/index-152_1.png)\n\n## 3.3 包\n\n151\n\nimport\
  \ 声明指定了程序将使用的包和类，这样在每次引用时就不需要完全限定名。正如我们所看到的，下面是一个 import 声明的示例：`import java.util.Scanner;`\n\
  \n此声明断言 `java.util` 包中的 `Scanner` 类可以在程序中使用一旦一旦此 import 声明，在程序中引用该类时，使用简单名称 `Scanner`\
  \ 就足够了。\n\n如果来自两个包的两个类具有相同的名称，import 声明是不够的，因为编译器无法确定代码流中引用的是哪一个类。当出现这种情况时（这种情况很少），应该在代码中使用完全限定名。\n\
  \nimport 声明的另一种形式使用星号（`*`）表示包内的任何类都可能在程序中使用。因此，以下声明允许 `java.util` 包中的所有类在程序中被引用，无需对每个引用进行限定：\n\
  \n`import java.util.*;`\n\n如果程序只使用特定包的一个类，通常在 import 声明中指定该类会更好。然而，如果将使用两个或多个类，通常使用\
  \ `*` 表示法就可以了。\n\n`java.lang` 包中的类是自动导入的，**核心概念**，因为它们是基础性的，可以被看作是语言的基础扩展。因此，`java.lang`\
  \ 包中的任何类（如 `System` 和 `String`）在每个程序中都可以无需显式声明直接使用。这就像是所有的程序文件自动包含了以下声明：\n\n`import\
  \ java.lang.*;`\n\n**自测问题** *(答案见附录 N)*\nSR 3.10 什么是 Java 包？\n\nSR 3.11 `java.net`\
