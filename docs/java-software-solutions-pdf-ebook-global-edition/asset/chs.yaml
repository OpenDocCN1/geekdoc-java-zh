  \n![](img/index-100_1.png)\n\n## 2.3 基本数据类型\n\n99\n\n### 字符\n\n字符是计算机中用于和管理的另一种基本数据类型。单个字符可以被视为单独的数据项，正如我们在几个示例中看到的，它们可以组合成字符字符串。\n\
  \n*字符字面量*（character literal）在 Java 程序中使用单引号表示，例如 `'b'`、`'J'` 或 `';'`。你可能记得*字符串字面量*（string\
  \ literals）是使用双引号界定的，而且 `String` 类型不是 Java 中的基本数据类型；它是一个类名。我们将在下一章中详细讨论 `String`\
  \ 类。\n\n请注意作为字符的数字（或字符串的一部分）与作为数字的数字（或更大数字的一部分）之间的区别。数字 `602` 是可以用于算术计算的数值。但在字符串\
  \ `\"602 Greenbriar Court\"` 中，`6`、`0` 和 `2` 是字符，就像组成字符串的其余字符一样。\n\n我们可以管理的字符由*字符集*（character\
  \ set）`*` 定义，它仅仅是按特定顺序排列字符列表。每种编程语言都支持特定的字符集，定义了该语言字符变量的有效值。虽然提出了多种字符集，但多年来只有少数被经常使用。*ASCII\
  \ 字符集*是一个流行的选择。`ASCII` 代表美国信息交换标准代码。基础 ASCII 集每个字符使用七位，提供了支持 128 个不同字符的空间，包括：\n\n\
  - 大写字母，例如 `'A'`、`'B'` 和 `'C'`\n- 小写字母，例如 `'a'`、`'b'` 和 `'c'`\n- 标点符号，例如句号（`.`）、分号（`;`）和逗号（`,`）\n\
  - 数字 `'0'` 到 `'9'`\n- 空格字符 `' '`\n- 特殊符号，例如安培符（`'&'`）、竖线（`'|'`）和反斜杠（`'\\'`）\n- 控制字符，如回车符、空字符和文本结束标记。*控制字符*有时被称为非打印字符或不可见字符，因为它们没有特定的表示符号。然而，它们与其他任何字符一样有效，并以相同的方式存储和使用。许多控制字符对某些软件应用程序具有特殊含义。\n\
  \n随着计算成为全球性事务，用户需要包含其他语言字母表的更灵活的字符集。`ASCII` 被扩展为每个字符使用八位，集合中的字符数量翻倍到 256。扩展 ASCII\
  \ 包含许多重音符号，Java 使用 16 位的 `Unicode` 字符集来表示英语其他语言使用的变符号。\n\n100\n\n# 第 2 章 数据与表达式\n\
  \n然而，即使有 256 个字符，`ASCII` 字符集也无法表示世界的字母，特别是考虑到各种亚洲字母及其数以千计的意字。因此，Java 编程语言的开发者选择了*Unicode\
  \ 字符集*，它每个字符使用 16 位，支持 65,536 个唯一字符（以及允许使用多个字节表示更多字符的技术）。许多语言的字符和符号都包含在 `Unicode`\
  \ 定义中。`ASCII` 是 `Unicode` 字符集的子集，包含前 256 个字符。附录 C 详细讨论了 `Unicode` 字符集。\n\n字符集为每个字符分配一个数字，因此根据定义，字符处于特定的顺序。这被称为字典序。\n\
  \n在 `ASCII` 和 `Unicode` 排序中，数字字符 `'0'` 到 `'9'` 是连续的（没有其他字符插插）且有序的。同样，小写字母字符 `'a'`\
  \ 到 `'z'` 是连续且有序的，大写字母字符 `'A'` 到 `'Z'` 也是如此。这些特性使得按字母顺序排列变得相对容易。\n\n在 Java 中，数据类型\
  \ `char` 表示单个字符。以下是 Java 中字符变量声明的一些示例：\n\n```java\nchar topGrade = 'A';\nchar symbol1,\
  \ symbol2, symbol3;\nchar terminator = ';', separator = ' ';\n```\n\n### 布尔值\n\n\
  Java 中使用保留字 `boolean` 定义的布尔值只有两个有效值：`true` 和 `false`。布尔变量通常用于指示特定条件是否为真，但它也可以用于表示任何两种状态的情况，例如灯泡的开启或关闭。\n\
  \n布尔值不能转换为任何其他数据类型，任何其他数据类型也不能转换为布尔值。`true` 和 `false` 单词在 Java 中保留为*布尔字面量*（boolean\
  \ literals），在此上下文之外无法使用。\n\n以下是 Java 中布尔变量声明的一些示例：\n\n```java\nboolean flag = true;\n\
  boolean tooHigh, tooSmall, tooRough;\nboolean done = false;\n```\n\n**自测题** *(答案见附录\
  \ N)*\nSR 2.14 什么是基本数据？基本数据类型与对象有什么区别？\n\n![](img/index-102_1.png)\n\n## 2.4 表达式\n\
  \n101\n\nSR 2.15 整数变量中可以存储多少值？\n\nSR 2.16 Java 中有四种整数数据类型？它们有什么区别？\n\nSR 2.17 Java\
  \ 自动为整数字面量分配类型？如何指示整数字面量被视为不同的类型？\n\nSR 2.18 Java 自动为浮点字面量分配类型？如何指示浮点字面量被视为不同的类型？\n\
  \nSR 2.19 什么是字符集？\n\nSR 2.20 ASCII 字符集、扩展 ASCII 字符集和 Unicode 字符集支持多少个字符？\n\n*表达式*是一个或多个运算符和操作数的组合，通常执行计算。计算值不必是数字，但通常是。表达式中的操作数是字面量、常量、变量或其他数据的组合。表达式的求值方式是编程的基础。现在我们关注使用数值操作数并产生数值结果的算术表达式。\n\
  \n### 算术运算符\n\n通常算术运算对整数和浮点类型都有定义，包括加法（`+`）、减法（`–`）、乘法（`*`）和除法（`/`）。Java 还有另一种算术操作：剩余运算符（`%`）返回第一个操作数除以第二个操作数的余数。剩余运算符有时称为模运算。剩余结果符号与分子符号一致。因此：\n\
  \n| 运算 | 结果 |\n| :--- | :--- |\n| 17 % 4 | 1 |\n| -20 % 3 | -2 |\n| 10 % -5 | 0\
  \ |\n| 3 % 8 | 3 |\n\n![](img/index-103_1.png)\n\n102\n\n正如你预期的那样，如果任何数值运算符的任一或操作数是浮点值，结果就是浮点值。然而，除法运算符产生的结果不那么直观，取决于操作数的类型。如果两个操作数都是整数，`/`\
  \ 运算符执行*整数除法*，这意味着结果的任何小数部分都会丢弃。\n\n如果一个、另一个或两个操作数都是浮点值，`/` 运算符执行*浮点除法*，并保留结果的小数部分。\n\
  \n例如，`10/4` 的结果是 `2`，但 `10.0/4`、`10/4.0` 和 `10.0/4.0` 的结果均为 `2.5`。\n\n*一元运算符*只有一个操作数，而*二元运算符*有两个操作数。这\n\
  \n\n\n\n\n`++` 和 `-` 算术运算符可以是单元的或二元的。二元版本执行加法和减法，而单元版本表示正、负数。例如，`-1` 就是使用单元否定运算符使值变为负数的一个示例。单元\
  \ `+` 运算符很少使用。\n\nJava 没有内置用于将值提升为幂的运算符。\n\n然而，`Math` 类提供了执行幂运算以及许多其他数学函数的方法。`Math`\
  \ 类将在第 3 章中讨论。\n\n### 运算符优先级\n\n运算符可以组合以创建更复杂的表达式。例如，考虑以下赋值语句：\n\n```java\nresult\
  \ = 14 + 8 / 2;\n```\n\n赋值语句的整个右侧会被求值，然后**核心概念（Key CONCept）**将结果存储在变量中。但结果是什么？如果加法遵循一组定义良好的优先级规则（这些规则规定了表达式中运算符求值的顺序），则结果为\
  \ `11`；如果先执行除法操作，结果为 `18`。运算符的求值顺序影响很大。在这种情况下，除法在加法之前执行，得到结果 `18`。\n\n注意，在本例及后续示例中，我们使用字面量而非变量来简化表达式。如果操作数是变量或任何其他数据源，运算符的求值顺序是相同的。\n\
  \n所有表达式都根据*运算符优先级层次结构*进行求值，该层次结构规定了操作求值的顺序。算术运算符通常遵循你在代数中学习的规则。乘法、除法和取余运算符的优先级相同，且在加法和减法之前执行（优先级高于它们）。加法和减法的优先级相同。\n\
  \n## 2.4 表达式\n\n任何相同优先级的算术运算符都从左到右执行。因此，我们说算术运算符具有*从左到右结合性*。\n\n然而，可以使用括号在表达式中强制规定优先级。例如，如果我们真的希望在上一个例子中先执行加法，我们可以这样写表达式：\n\
  \n```java\nresult = (14 + 8) / 2;\n```\n\n任何括号内的表达式都会先求值。在复杂的表达式中，即使不是严格必要的，使用括号也是一种良好的习惯，可以清晰表达式表达式是如何求值的。\n\
  \n括号可以嵌套，最内层的嵌套表达式最先求值。考虑以下表达式：\n\n```java\nresult = 3 * ((18 – 4) / 2);\n```\n\n\
  在这个示例中，结果是 `21`。首先，由于内层括号的强制执行减法。然后，尽管乘法和除法的优先级相同且通常从左到右求值，但由于外层括号的存在，先执行除法。最后执行乘法。\n\
  \n在算术操作完成后，计算出的结果存储在赋值运算符 `=` 左侧的变量中。换句话说，赋值运算符的优先级低于任何算术运算符。\n\n特定表达式的求值可以使用*表达式树*来表示，如图\
  \ 2.3 所示。运算符从底向上执行，创建出用于表达式其余部分的值。因此，树中位置较低的操作优先级高于上面的操作，或者它们被括号强制更早执行。\n\n```\n\
  \      +\n     / \\\n    a   /\n       / \\\n      –   d\n     / \\\n    b   c\n\
  (求值中)\n```\n**图 2.3** 表达式树\n\n### 优先级\n\n| 等级 | 运算符 | 操作 | 结合性 |\n| :--- | :---\
  \ | :--- | :--- |\n| 1 | + | 单元加 | 从右到左 |\n| | – | 单元减 | 从右到左 |\n| 2 | * | 乘法 |\
  \ 从左到右 |\n| | / | 除法 | 从左到右 |\n| | % | 取余 | 从左到右 |\n| 3 | + | 加法 | 从左到右 |\n| | –\
  \ | 减法 | 从左到右 |\n| | + | 字符串连接 | 从左到右 |\n| 4 | = | 赋值 | 从右到左 |\n\n**图 2.4** 运算符之间的优先级\n\
  \n表达式中的括号本身也是运算符。括号的优先级高于任何其他运算符。图 2.4 显示了算术运算符、括号和赋值运算符 `=` 之间的关系。\n\n为了使表达式语法正确，左右括号的数量必须匹配且必须正确嵌套。\n\
  \n以下示例是*无效*的：\n```java\nresult = ((19 + 8) % 3); // 无效\nresult = (19 (+ 8 %) 3);\
  \ // 无效\n```\n\n请记住，当在表达式引用变量时，其当前值被用于计算。在下面的赋值语句中，变量 `count` 的当前值与 `total` 的当前值相加，结果存储在变量\
  \ `sum` 中：\n\n```java\nsum = count + total;\n```\n\n赋值前 `sum` 中的原始值会被计算出的值覆盖。`count`\
  \ 和 `total` 的值不会改变。\n\n同一个变量可以出现在赋值语句的左侧和右侧。假设执行以下赋值语句时，变量 `count` 的值为 `15`：\n\n\
  ```java\ncount = count + 1;\n```\n\n由于右侧表达式先求值，获取 `count` 的原始值并加上 `1`，产生结果 `16`。该结果随后存储在变量\
  \ `count` 中，覆盖了原始值 `15`。因此，该赋值语句递增（即给变量 `count` 加 1）。\n\n###  2.7\n\n```java\n//************************************\n\
  // TempConverter.java 作者: Lewis/Loftus\n//\n// 演示了基本数据类型和算术\n// 表达式的使用。\n//************************************\n\
  public class TempConverter\n{\n    //------------------------------------------------\n\
  \    // 使用公式 F = (9/5)C + 32 计算\n    // 摄氏度的华氏度等值。\n    //------------------------------------------------\n\
  \    public static void main(String[] args)\n    {\n        final int BASE = 32;\n\
  \        final double CONVERSION_FACTOR = 9.0 / 5.0;\n\n        double fahrenheitTemp;\n\
  \        int celsiusTemp = 24; // 要转换的值\n\n        fahrenheitTemp = celsiusTemp\
  \ * CONVERSION_FACTOR + BASE;\n        System.out.println(\"Celsius Temperature:\
  \ \" + celsiusTemp);\n        System.out.println(\"Fahrenheit Equivalent: \" + fahrenheitTemp);\n\
  \    }\n}\n```\n**输出**\n```\nCelsius Temperature: 24\nFahrenheit Equivalent: 75.2\n\
  ```\n\n\n\n\n\n还有两个实用的算术运算符。`自增运算符` (`++`) 可向任何整数或浮点值加 1。组成该运算符的两个加号之间不能有空格隔开。`自减运算符`\
  \ (`--`) 与其相似，不同之处是从值中减去 1。它们都是一元运算符，因为它们只作用于一个操作数。以下语句会导致 `count` 的值增加：\n\n```\n\
  count++;\n```\n\n结果被存储回变量 `count` 中。因此，它在功能上等于我们在上一节中讨论的以下语句：`count = count + 1;`\n\
  \n自增和自减运算符可以应用于变量之后（例如 `count++` 或 `count--`），产生所谓的运算符的`后置形式`。它们也可以应用于变量之前（例如 `++count`\
  \ 或 `--count`），即所谓的`前缀形式`。当单独在语句中使用时，前缀和后置形式在功能上是等价的。也就是说，写成\n\n```\ncount++;\n\
  ```\n\n或者\n\n```\n++count;\n```\n\n并没有区别。\n\n然而，当这种形式单独作为一个语句书写时，通常以其后置形式书写。\n\n\
  当自增或自减运算符用于较大的表达式时，根据所使用的形式，可能会产生不同的结果。例如，如果变量 `count` 当前包含值 15，以下语句将值 15 赋值给 `total`，将值\
  \ 16 赋值给 `count`：\n\n```\ntotal = count++;\n```\n\n然而，以下语句将值 16 同时赋值给 `total` 和\
  \ `count`：`total = ++count;`\n\n在两种情况下 `count` 的值都增加了，但在较大的表达式中使用的值取决于使用的是自增运算符的前缀还是后置形式。\n\
  \n由于自增和自减运算符的前缀与后置形式之间存在细微差异，使用时应格外谨慎。一如既往，优先考虑可读性。\n\n### 赋值运算符\n\n为了方便起见，Java\
  \ 定义了几个`赋值运算符`，它们将基本操作与赋值结合。例如，`+=` 运算符可以如下使用：\n\n```\ntotal += 5;\n```\n\n这执行的操作与以下语句相同：`total\
  \ = total + 5;`\n\n赋值运算符的右侧可以是一个完整的表达式。运算符右侧的表达式先求值，然后将该结果加上左侧变量的当前值，并将该值存储在变量中。因此，以下语句：`total\
  \ += (sum - 12) / count;`\n\n等于：\n\n`total = total + ((sum - 12) / count);`\n\n\
  Java 中定义了许多类似的赋值运算符，包括执行减法 (`-=`)、乘法 (`*=`)、除法 (`/=`) 和取余 (`%=`) 的运算符。\n\n所有的 Java\
  \ 运算符将在附录 D 中讨论。\n\n所有的赋值运算符都会首先求右侧整个表达式的值，然后将结果作为另一个操作的右操作数。\n\n因此，以下语句：\n\n```\n\
  result *= count1 + count2;\n```\n\n等于：\n\n`result = result * (count1 + count2);`\n\
  \n同样，以下语句：\n\n```\nresult %= (highest - 40) / 2;\n```\n\n等于：\n\n`result = result\
  \ % ((highest - 40) / 2);`\n\n某些赋值运算符根据操作数的类型执行特定功能，正如其对应的普通运算符一样。例如，如果 `+=` 运算符的操作数是字符串，则赋值运算符执行字符串拼接。\n\
