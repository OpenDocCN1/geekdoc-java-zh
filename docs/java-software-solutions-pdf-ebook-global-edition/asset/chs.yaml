  \ Garden\nGQ\n\n其他方法也可以包含在 `MagazineList` ADT 中。例如，除了提供的 `add` 方法（该方法始终向列表末尾添加新杂志）外，还可以定义另一个名为\
  \ `insert` 的方法，将节点添加到列表的任何位置（例如为了保持排序）。`insert` 的参数可以指示在哪个节点之后（`insert` 和 `delete`\
  \ 操作之后）应该插入新节点的值。图 13.2 显示了如何通过仔细操作对象引用来更新引用，以插入新节点。\n\n648\n\n第 13 章 集合\n\n####\
  \ LISTING 13.2\n```java\n//*******************************************************************\n\
  // MagazineList.java Author: Lewis/Loftus\n//\n// 表示一个杂志集合。\n//*******************************************************************\n\
  public class MagazineList\n{\n    private MagazineNode list;\n\n    //----------------------------------------------------------------\n\
  \    // 初始化一个空的杂志列表。\n    //----------------------------------------------------------------\n\
  \    public MagazineList()\n    {\n        list = null;\n    }\n\n    //----------------------------------------------------------------\n\
  \    // 创建一个新的 MagazineNode 对象并将其添加到\n    // 链表的末尾。\n    //----------------------------------------------------------------\n\
  \    public void add(Magazine mag)\n    {\n        MagazineNode node = new MagazineNode(mag);\n\
  \        MagazineNode current;\n        if (list == null)\n            list = node;\n\
  \        else\n        {\n            current = list;\n            while (current.next\
  \ != null)\n                current = current.next;\n            current.next =\
  \ node;\n        }\n    }\n\n    //----------------------------------------------------------------\n\
  \    // 将此杂志列表作为字符串返回。\n    //----------------------------------------------------------------\n\
  \    public String toString()\n    {\n        String result = \"\";\n        MagazineNode\
  \ current = list;\n        while (current != null)\n        {\n            result\
  \ += current.magazine + \"\\n\";\n            current = current.next;\n        }\n\
  \        return result;\n    }\n\n    //*****************************************************************\n\
  \    // 一个表示杂志列表中节点的内部类。\n    // 公有变量由 MagazineList 类访问。\n    //*****************************************************************\n\
  \    private class MagazineNode\n    {\n        public Magazine magazine;\n    \
  \    public MagazineNode next;\n\n        //--------------------------------------------------------------\n\
  \        // 设置节点\n        //--------------------------------------------------------------\n\
  \        public MagazineNode(Magazine mag)\n        {\n            magazine = mag;\n\
  \            next = null;\n        }\n    }\n}\n```\n649\n\n13.2 动态表示\nLISTING 13.2（续）\n\
