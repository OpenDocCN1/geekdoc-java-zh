  ## 13.3 线性数据结构\n\n**SR 13.7** 假设 `first` 是一个 `Node` 对象的引用，且它指向链表中的第一个节点。用伪代码显示计算并返回列表节点数量的步骤。\n\
  \n**SR 13.8** 什么是双向链表？\n\n**SR 13.9** 链表的头部节点是什么？\n\n## 13.3 线性数据结构\n\n除了列表之外，某些数据结构已经变得非常经典，因为它们代表了计算中经常发生的的重要通用情况。与列表一样，`queue`（队列）和\
  \ `stack`（栈）都是`linear data structures`，这意味着它们所代表的数据是以线性方式组织的。本节将更详细地探讨一些线性数据结构。\n\
  \n### 队列 (Queues)\n\n`queue` 与列表相似，不同之处它对放入和取出项目的方式有限制。具体来说，`queue` 使用 `first-KeY\
  \ CONCept`：`in, first-out`（FIFO，先进先出）处理。也就是说，第一个放入列表的项目是第一个离开列表的项目。队列是一种以先进先出的方式管理数据的线性数据结构。图\
  \ 13.6 描绘了队列的 FIFO 处理。\n\n任何等待队都是队列。想象一下在银行等柜员员的人群。客户从队列尾部进入，并随着较早客户的接受服务而向前移动。最终，每个客户都会到达队列的前端以接受处理。\n\
  \n请注意，队列的处理是概念性的。我们可能会说人们向前移动直到到达队列前端，但现实可能是随着元素的离开，队列的头部在移动。项目从尾部进入队列（`enqueue`），项目从头部离开队列（`dequeue`）。\n\
  \n**图 13.6 队列数据结构**\n\n![](img/index-655_1.png)\n\n此时不考虑客户队列是向柜台员移动，还是在客户接受服务时由柜台员移动而保持不动。\n\
  \n### 视频笔记：实现队列\n\n队列数据结构通常具有以下操作：\n- `enqueue`——向队列尾部添加一个项目\n- `dequeue`——从队列头部移除一个项目\n\
  - `empty`——如果队列为空，则返回 true\n\n### 栈 (Stacks)\n\n`stack` 与队列相似，不同之处是它的元素在同一个端部进入和离开。最后一个进入栈的项目是第一个离开栈的项目，就像橱子里的一叠盘子或谷仓的一堆干草一样。因此，栈以\
  \ `last-in, first-out`（LIFO，后进先出）的方式处理信息，如图 13.7 所示。\n\n一个典型的栈 ADT 包含以下操作：\n- `push`——将一个项目推入栈顶\n\
  - `pop`——从栈顶移除一个项目\n- `peek`——从栈顶项目检索信息，而不将其移除\n- `empty`——如果栈为空，则返回 true\n\nAPI\
  \ 的 `java.util` 包包含一个名为 `Stack` 的类，它实现了一个栈数据结构。该包含包含了与标准栈操作对应的方法，以及一个在栈中搜索特定对象的方法。\n\
  \n`Stack` 类有一个 `search` 方法，它返回一个与特定对象在栈中位置对应的整数。这种搜索通常不被认为是经典栈 ADT 的部分。\n\n最后一个进入的必须是栈上第一个进入（`push`）离开（`pop`）的项目。\n\
  \n**图 13.7 栈数据结构**\n\n与 `ArrayList` 操作一样，`Stack` 操作对 `Object` 引用进行。由于所有对象都派自 `Object`，因此任何对象都可以推入栈中。如果要存储基本类型，必须使用相应的包装类将其视为对象。与\
  \ `Stack` 类不同，没有实现队列的类定义在 Java 中。\n\n让我们来看使用栈来解决问题的示例。13.4 中的程序接受一个代表秘密消息的字符串。程序解码并打印该消息。\n\
  \n**13.4 列表**\n\n```java\nimport java.util.*;\n\n// Decode.java Author: Lewis/Loftus\n\
  // 展示了栈的使用\n// 通过反转字符串中的每个单词来解码。\npublic class Decode {\n    public static void\
  \ main(String[] args) {\n        Scanner scan = new Scanner(System.in);\n      \
  \  Stack word = new Stack();\n        String message;\n        int index = 0;\n\n\
  \        System.out.println(\"Enter the coded message:\");\n        message = scan.nextLine();\n\
  \n        System.out.println(\"The decoded message is:\");\n        while (index\
  \ < message.length()) {\n            // 将单词推入栈\n            while (index < message.length()\
  \ && message.charAt(index) != ' ') {\n                word.push(new Character(message.charAt(index)));\n\
  \                index++;\n            }\n            // 反向打印单词\n            while\
  \ (!word.empty()) {\n                System.out.print(((Character)word.pop()).charValue());\n\
  \            }\n            System.out.print(\" \");\n            index++;\n   \
  \     }\n        System.out.println();\n    }\n}\n```\n\n**输出**\nEnter the coded\
  \ message:\nartxE esaelp\nThe decoded message is:\nExtra cheese please\n\n13.4 非线性数据结构\n\
  \n**SR 13.10** 队列与列表有什么不同？\n\n**SR 13.11** 显示执行以下操作后队列的内容。假设队列初始为空。\n`enqueue(5);`\n\
  `enqueue(21);`\n`dequeue();`\n`enqueue(72);`\n`enqueue(37);`\n`enqueue(15);`\n`dequeue();`\n\
  \n**SR 13.12** 什么是栈？\n\n**SR 13.13** 显示执行以下操作后栈的内容。假设栈初始为空。\n`push(5);`\n`push(21);`\n\
  `pop();`\n`push(72);`\n`push(37);`\n`push(15);`\n`pop();`\n\n**SR 13.14** `Stack`\
  \ 类是什么？\n\n\n\n\n\n某些数据结构被认为是非线性数据结构，因为它们的数据不是线性组织的。本节将研究两种类型的非线性结构：树和图。\n\n###\
  \ 树\n\n`tree`（树）是一种非线性数据结构，由一个`root node（根节点）和可能存在的若干层形成层级结构的额外节点组成。除根节点以外的所有节点都称为`internal\
  \ nodes（内部节点）。没有子节点的节点称为`leaf nodes（叶子节点）。图 13.8 展示了一棵树。注意，我们是倒画树，根节点在顶部，叶子节点在底部。\n\
  \n在像图 13.8 所示的普通树中，每个节点可以有许多子节点。正如我们在第 9 章中提到的，类之间的继承关系可以使用普通树结构来表示。\n\n在`binary\
  \ tree（二叉树）中，每个节点最多有两个子节点。二叉树在各种编程场景中非常有用，而且通常比普通树更容易实现。从技术上讲，二叉树是普通树的子集，但它们在计算世界中如此重要，以至于通常被视为独立的数据结构。\n\
  \n树和二叉树的操作各不相同，但至少包括从树或二叉树中添加和删除节点。由于它们的非线性特性，树和二叉树可以使用引用作为动态链接很好地实现。然而，也可以使用数组等固定表示法来实现树数据结构。\n\
  \n![](img/index-659_1.png)\n\n**658**\n**第 13 章** 集合\n根节点\n叶子节点\n**图 13.8** 树数据结构\n\
  \n### 图\n\n与树一样，`graph（图）`也是非线性数据结构。与树不同，图没有像树的根节点那样的主入口。\n\n在图中，节点通过称为`edge（边）`的连接到另一个节点，该连接使用通用边连接节点。通常，图中节点之间可以建立边的数量没有限制。图\
  \ 13.9 展示了一个图的数据结构。\n\n在表示线性路径和严格层级结构不足以描述的关系时，图是非常有用的。例如，地图上连接城市的公路网系统和机场之间的航空公司连接，比目前讨论的任何其他数据结构都更适合用图来表示。\n\
  \n在普通图中，边是双向的，这意味着连接节点 A 和 B 的边可以从 A 到 B 遵循，也可以从 B 到 A。在`directed graph（有向图）`或`digraph`中，每条边都有特定的方向。图\
  \ 13.10 显示了一个有向图，其中每条边使用箭头指示方向。\n\n有向图可能用于表示机场之间的航班。与在几乎所有情况下都是双向的公路系统不同，从一个城市到另一个城市的航班并不并不意味着一定有相应的返回航班。或者，如果有的话，我们可能还想为它关联不同的信息，例如成本。\n\
  \n**13.4** 非线性数据结构\n**659**\n**图 13.9** 图的数据结构\n**图 13.10** 有向图\n![](img/index-661_1.png)\n\
  **660**\n**第 13 章** 集合\n\n像树一样，图通常使用动态链接实现，尽管它们也可以使用数组实现。\n\n**自测题** *(答案见附录 N )*\n\
