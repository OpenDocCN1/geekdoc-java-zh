  \n以下是基于你提供内容的翻译：\n\n[content]\n由大括号 (`{ }`) 包围。当使用初始化列表时，不使用 `new` 运算符。数组的大小由初始化列表中项的数量决定。例如，以下声明将数组\
  \ `scores` 实例化为一个包含八个整数的数组，索引从 0 到 7，并带有指定的初始值：\n\n```java\nint[] scores = {87,\
  \ 98, 69, 87, 65, 76, 99, 83};\n```\n\n初始化列表只能在首次声明数组时使用。\n\n初始化列表中每个值的类型必须与数组元素的类型相匹配。让我们来看另一个例子：\n\
  \n```java\nchar[] vowels = {'A', 'E', 'I', 'O', 'U'};\n```\n\n在这种情况下，变量 `vowels`\
  \ 被声明为包含五个字符的数组，初始化列表包含字符字面量。\n\n列表 8.4 所示程序演示了如何使用初始化列表来实例化数组。\n\n### 数组作为参数\n\n\
  整个数组可以作为参数传递给方法。由于数组是一个对象，当将整个数组作为参数传递时，传递的是原始数组引用的拷贝，从而传递了整个数组。我们在第 7 章中讨论过参数问题，使形式参数成为原始参数的别名。这个问题适用于所有对象。\n\
  \n接收数组作为参数的方法可以永久地更改数组的元素，因为它是引用原始元素值的。但该方法无法永久地更改数组本身的引用，因为发送到方法的是原始引用的拷贝。这些规则与适用于任何对象类型的规则是一致的。\n\
  \n数组的元素也可以作为参数传递给方法。如果元素类型是基本类型（primitive type），则传递的是值的拷贝。如果该元素是引用对象的引用，则传递的是对象引用的拷贝。一如既往，在方法内部对参数所做的更改产生的影响取决于参数的类型。我们将在下一节中进一步讨论对象数组。\n\
