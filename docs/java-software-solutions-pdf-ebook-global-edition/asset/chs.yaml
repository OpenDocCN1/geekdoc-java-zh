  // DVDCollection.java 作者: Lewis/Loftus\n//\n// 代表一个 DVD 电影集合。\n//********************************************************************\n\
  import java.text.NumberFormat;\n\npublic class DVDCollection\n{\n    private DVD[]\
  \ collection;\n    private int count;\n    private double totalCost;\n\n    //-----------------------------------------------------------------\n\
  \    // 构造函数：创建一个初始空集合。\n    //-----------------------------------------------------------------\n\
