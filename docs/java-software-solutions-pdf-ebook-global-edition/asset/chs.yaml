  \ 微笑的脸每次“撞击”窗口边缘时，它都会加速。\n\n506\n# 第 9 章 继承\n\n### 核心概念总结\n\n- 继承是从现有类派生出新类的过程。\n\
  - 继承的目的之一是重用现有软件。\n- 继承在父类和子类之间创建了“是一个”（is-a）的关系。\n- `protected` 可见性提供了允许继承的最优封装。\n\
  - 可以使用 `super` 引用调用父类的构造函数。\n- 子类可以重写（重定义）父类对被继承方法的定义。\n- 一个类的子类可以是一个或多个类的父类，从而创建类层次结构。\n\
  - 共同特征应该在合理范围内位于类层次结构中的高位置。\n- 所有的 Java 类都直接或间接地派生自 `Object` 类。\n- `toString` 和\
  \ `equals` 方法被每个 Java 程序中的每个类继承。\n- 抽象类不能被实例化。它代表一个概念，其他类可以在此基础上构建它们的定义。\n- 派生自抽象父类的类必须重写其父类所有的抽象方法，否则该派生类也将被视为抽象类。\n\
  - 继承可以应用于接口，使得一个接口可以派生另一个接口。\n- 私有成员（private members）被子类继承，但不能通过名称直接引用。然而，它们可以间接地使用。\n\
  - 软件设计必须仔细且具体地处理继承。\n- `final` 修饰符可以限制继承。\n- 表示 Java GUI 组件的类组织成类层次结构。\n- 监听器类可以通过派生自事件适配器类（event\
  \ adapter class）来创建。\n- `Timer` 对象定期生成动作事件，并用于控制动画。\n\n507\n## 练习\n\n- EX 9.1 绘制一个\
