  \ 3 章 使用类和对象\n\n### 3.4 Random 类\n\n在编写软件时，经常需要随机数。游戏通常使用随机数来代表骰子的点数或洗牌。飞行模拟器可能会使用随机数来决定模拟飞行发生引擎故障的频率。设计用于帮助高中生准备\
  \ SAT 考试的程序可能会使用随机数来选择下一个问的问题。\n\n`Random` 类是 `java.util` 类的一部分，代表一个`伪随机数生成器`。随机数生成器从一个值范围内随机选取一个数字。承担此角色的程序在技术上是伪随机的，因为程序没有实际上随机选取数字的方法。伪随机数生成器根据初始`种子值`（seed\
  \ value）执行一系列复杂的计算并产生一个数字。尽管它们在技术上不是随机的（因为它们是计算出来的），伪随机数生成器产生的值通常看起来是随机，至少对于大多数情况来说足够随机。\n\
  \n图 3.4 列出了 `Random` 类的一些方法。**核心概念** `nextInt` 方法可以不带参数调用，也可以向它传递单个整数值。不带参数的版本执行复杂的计算以营造随机的幻象，在整个\
  \ `int` 值范围（包括负数）内生成随机数。通常，我们需要一个更特定范围内的随机数。例如，为了模拟掷骰子，我们可能想要 1 到 6 范围内的随机数。`nextInt`\
  \ 方法返回一个范围从 0 到参数减 1 的值。\n\n```\nRandom()\n构造函数：：创建一个新的伪随机数生成器。\n\nfloat nextFloat()\n\
  返回 0.0（包含）和 1.0（不包含）之间的随机数。\n\nint nextInt()\n返回一个范围覆盖所有可能的 int 值（正和负）的随机数。\n\n\
  int nextInt(int num)\n返回 0 到 num-1 范围内的随机数。\n```\n**图 3.4** `Random` 类的一些方法\n\n\
