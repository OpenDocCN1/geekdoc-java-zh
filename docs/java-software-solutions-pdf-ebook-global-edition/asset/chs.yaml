  \ height=\"300\">\n</applet>\n```\n\n## 2.9 绘制形状\n\nJava 标准类库提供了许多类，允许我们呈现和操纵图形信息。`Graphics`\
  \ 类是所有此类处理的基础。\n\n### Graphics 类\n\n`Graphics` 类定义在 `java.awt` 包中。\n\n**核心概念**：它包含了各种方法，允许我们绘制形状。大多数形状都可以进行填充绘制，包括线条、矩形和椭圆。图\
  \ 2.12 列出了 `Graphics` 类的一些基础绘制方法，有些是不透明的（填充的），有些是不透明的（未填充的，作为轮廓）。\n\n注意，这些方法还允许我们绘制圆和正方形，它们分别是椭圆和矩形的特定类型。我们将在书后的适当位置进一步讨论\
  \ `Graphics` 类的其他绘制方法。\n\n`Graphics` 类的方法允许我们指定是想要填充形状还是不填充形状。不填充的形状只显示形状的轮廓，并且在其他地方是透明的（你可以看到任何底层的图形）。填充的形状在边界之间是实心的，并会覆盖任何底层的图形。\n\
  \n所有这些方法都依赖于 Java 坐标系，这是我们在在本章早期讨论过的**核心概念**。回想点 `(0,0)` 位于左上角，随着向右移动，`x` 值增大；随着向下移动，`y`\
  \ 值增大，从而定义边界矩形的位置和大小。\n\n在可见区域之外坐标处绘制的任何形状都将无法看到。\n\n许多 `Graphics` 绘制方法是自而易懂的，但有些需要进一步的讨论。例如，注意由\
  \ `drawOval` 方法绘制的椭圆是由左上角的坐标以及指定宽度和高度的*边界矩形*尺寸定义的。\n\n```java\nvoid drawLine(int\
  \ x1, int y1, int x2, int y2)\n// 从点 (x1, y1) 绘制到点 (x2, y2) 的直线。\n\nvoid drawRect(int\
  \ x, int y, int width, int height)\n// 绘制一个左上角为 (x, y)、尺寸为 width 和 height 的矩形。\n\
  \nvoid drawOval(int x, int y, int width, int height)\n// 绘制一个由左上角为 (x, y)、尺寸为 width\
  \ 和 height 的矩形所边界的椭圆。\n\nvoid drawString(String str, int x, int y)\n// 在点 (x, y)\
  \ 处绘制字符串 str，并向右延伸。\n\nvoid drawArc(int x, int y, int width, int height, int startAngle,\
  \ int arcAngle)\n// 沿着 x, y, width, height 定义的矩形绘制弧。弧从 startAngle 开始，延伸到 arcAngle\
  \ 定义的距离。\n```\n\n**图 2.12** `Graphics` 类的一些方法，如椭圆，通常是由它们的边界定义的。\n\n圆弧可以被认为是椭圆的一部分。要绘制圆弧，我们指定圆弧所属的椭圆以及我们感兴趣的椭圆部分。圆弧的起点由*起始角*定义，终点由*弧角*定义。弧角并不指示圆弧的结束的位置，而是它的范围。\n\
  \n起始角和弧角是以度为单位的。起始角的起始点是穿过椭圆中心的虚拟水平线，可以称为 0°，如图 2.14 所示。\n\n每个图形上下文都有当前的*前景颜色*，在绘制任何形状或字符串时使用。任何可以绘制的表面都有*背景颜色*。前景颜色通过\
  \ `Graphics` 类的 `setColor` 方法设置，背景颜色通过我们正在绘制的组件（如 applet）的 `setBackground` 方法设置。\n\
  \n```java\nColor getColor()\n// 返回此图形上下文的前景颜色。\n\nvoid setColor(Color color)\n//\
  \ 将此图形上下文的前景颜色设置为指定的颜色。\n```\n\n\n\n\n```java\n// Snowman.java Author: Lewis/Loftus\n\
