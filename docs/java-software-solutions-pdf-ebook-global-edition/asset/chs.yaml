  170\n\n## 第 3 章 使用类和对象\n\n到目前为止，我们看到的大多数示例程序都是 Java 应用程序。具体来说，它们是*命令行应用程序*，仅通过简单的文本提示与用户交互。Java\
  \ 应用程序也可以拥有图形化组件。在书的其余部分，在每章末尾的图形轨道章节中，我们将探索 Java 创建具有图形用户界面（GUI）程序的能力。在本章中，我们将建立关于图形化应用程序的基础问题。\n\
  \nGUI `component`（组件）是一个表示屏幕元素的对象，用于显示信息或允许用户以某种特定方式与程序进行交互。GUI 组件包括标签、按钮、文本框、滚动条和菜单。\n\
  \nJava 组件和其他与 GUI 相关的类主要定义在两个包中：`java.awt` 和 `javax.swing`。（注意 `javax.swing` 中的\
  \ x）。*抽象窗口工具包*（Abstract Windowing Toolkit，简称 AWT）是最初的 Java GUI 包。它仍然包含许多重要的类，例如在我们在第\
  \ 2 章中使用的 `Color` 类。*Swing* 包是后来添加的，它提供了比 `AWT` 包更通用的组件。GUI 开发需要这两个包，但只要有选择，我们都将使用\
  \ `Swing` 组件。\n\n`container`（容器）是一种特殊的组件，用于存放和组织其他组件。帧（Frames）和面板（Panels）是 Java\
  \ 容器的两个例子。让我们详细地探索它们。\n\n### 帧与面板 (frames and panels)\n\n`frame`（帧）是一种用于显示基于 GUI\
  \ 的 Java 程序的容器。帧显示为一个带有单独标题栏的独立窗口。可以通过鼠标拖动它在屏幕上重新定位，并根据需要调整大小。它在帧的角上有小按钮，允许帧进行最小化、最大化和关闭。帧由\
  \ `JFrame` 类定义。\n\n`panel`（面板）也是一种容器。然而，与帧不同，它不能独立显示。面板必须添加到另一个容器中才能显示。通常，除非你移动它所在的容器，否则面板不会移动。它的主要作用是帮助组织\
  \ GUI 中的其他组件。面板仅作为另一个容器的一部分，由 `JPanel` 类定义。\n\n我们可以将容器分类为重量级或轻量级。*重量级容器*（heavyweight\
  \ container）是由运行程序的底层操作系统管理的的，而*轻量级容器*（lightweight container）则是由 Java 程序管理的。在我们探索\
  \ GUI 开发时，这种区别有时是重要的。帧是重量级组件，而面板是轻量级组件。\n\n\n\n\n标签是通过实例化 `JLabel` 类创建的，并将标签的传递传递其构造函数。在这个程序中，创建了两个独立的标签组件。\n\
  \n容器有一个 `add` 方法，允许将其他组件添加到它们。两个标签都被添加到主面板（primary panel），从那时起，它们被视为该面板的一部分。组件添加到容器的顺序通常很重要。在这种情况下，它决定了哪个标签出现在另一个标签上方。\n\
  \n最后，使用 `getContentPane` 方法获取框架（frame）的内容面板，紧接着调用内容面板的 `add` 方法来添加面板。\n\n![](img/index-173_1.png)\n\
  \n![](img/index-173_2.png)\n\n**172**\n\n**第 3 章 使用类和对象**\n\n**代码 3.7**\n\n```java\n\
  //********************************************************************\n// Authority.java\
  \ Author: Lewis/Loftus\n//\n// 展示了框架（frames）、面板和标签的使用。\n//********************************************************************\n\
  import java.awt.*;\nimport javax.swing.*;\n\npublic class Authority\n{\n\n//-------------------------------------------------\n\
  // 显示一些格言。\n//-----------------------------------------------------------------\n\
  public static void main(String[] args)\n{\n    JFrame frame = new JFrame(\"Authority\"\
  );\n    frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE); \n    JPanel primary\
  \ = new JPanel();\n    primary.setBackground(Color.yellow);\n    primary.setPreferredSize(new\
  \ Dimension(250, 75));\n    JLabel label1 = new JLabel(\"Question authority,\");\
  \ \n    JLabel label2 = new JLabel(\"but raise your hand first.\"); \n    primary.add(label1);\n\
  \    primary.add(label2);\n    frame.getContentPane().add(primary);\n    frame.pack();\n\
  \    frame.setVisible(true);\n}\n}\n```\n\n**D i s p l a Y**\n\n![](img/index-174_1.png)\n\
  \n**3.9 组件与容器**\n\n**173**\n\n框架的 `pack` 方法根据其内容恰当地设置其大小——在这种情况下，框架的大小调整为容纳其包含的面板的大小。这比显式地设置框架的大小要好，因为框架的大小应该随着框架内组件的变化而改变。调用\
  \ `setVisible` 方法会导致框架显示在显示器屏幕上。\n\n`Authority` 程序不是交互式的。通常，标签并不允许用户与程序进行交互。我们将在下一章检查交互式\
  \ GUI 组件。\n\n然而，你可以通过各种方式与框架本身进行交互。你可以通过按住框架的标题栏用鼠标拖动将整个框架移动到桌面的另一个点。你还可以通过拖动框架的右下角来调整框架的大小。注意看当框架变宽时发生了什么：第二个标签会出现在第一个标签旁边。\n\
  \n每个容器都由一个名为 `layout manager`（布局管理器）的对象管理，该对象决定了容器中组件的布局方式。当界面发生重要变化时（例如框架被调整大小时），程序会咨询布局管理器。\n\
  \n除非你另有指定，否则面板中的组件将尝试在行中相邻排列，只有当面板宽度无法容纳某个组件时，该组件才会移动到下一行。尝试这个程序，看看随着窗口大小的改变，布局管理器是如何改变标签的组织结构的。布局管理器将在第\
  \ 7 章的图形轨道（Graphics Track）部分进行更详细的讨论。\n\n**自习题（答案见附录 N）**\n\nSR 3.36 框架（frame）和面板（panel）之间的区别是什么？\n\
