  SR 4.4 正确还是错误？解释。\na. 在编写程序时，我们应该只使用 Java 标准类库中的类——不需要定义或使用其他类。\nb. 对象上的操作可以改变对象的状态。\n\
  c. 对象的当前状态会影响在该对象的操作的结果。\nd. 在 Java 中，对象的状态是由它的方法表示的。\n\n### 4.2 类的构造分析\n\n在我们之前所有的示例中，我们都写了一个包含单个\
  \ `main` 方法的类。这些类代表了小型但完整的程序。这些程序通常使用 Java 类库中预定义的类来实例化对象，并使用这些对象提供它们提供的服务。那些预定义的类也是程序的一部分，但我们从并不真正关心它们，只需知道如何与它们交互。我们只需信任它们会提供它们承诺的服务。\n\
  \n让我们来看另一个类似的示例。如列表 4.1 所示的 `RollingDice` 类包含一个 `main` 方法，该方法实例化了两个 `Die` 对象（dice\
  \ 的单数形式）。然后它投掷骰子并打印结果。它还调用了 `Die` 类提供的几个其他方法，例如显式设置和获取骰子当前点数的能力。\n\n**代码列表 4.1**\n\
  ```java\n//********************************************************************\n\
  // RollingDice.java Author: Lewis/Loftus\n//\n// 展示了用户定义类的创建和使用。\n//********************************************************************\n\
  public class RollingDice\n{\n//-----------------------------------------------------------------\n\
  // 创建两个 Die 对象并多次投掷。\n//-----------------------------------------------------------------\n\
  \    public static void main(String[] args)\n    {\n        Die die1, die2;\n  \
  \      int sum;\n        die1 = new Die();\n        die2 = new Die();\n        die1.roll();\n\
  \        die2.roll();\n        System.out.println(\"Die One: \" + die1 + \", Die\
  \ Two: \" + die2); \n        die1.roll();\n        die2.setFaceValue(4);\n     \
  \   System.out.println(\"Die One: \" + die1 + \", Die Two: \" + die2); \n      \
  \  sum = die1.getFaceValue() + die2.getFaceValue();\n        System.out.println(\"\
  Sum: \" + sum);\n        sum = die1.roll() + die2.roll();\n        System.out.println(\"\
  Die One: \" + die1 + \", Die Two: \" + die2); \n        System.out.println(\"New\
  \ sum: \" + sum);\n    }\n}\n```\n\n**输出**\n```\nDie One: 5, Die Two: 2\nDie One:\
  \ 1, Die Two: 4\nSum: 5\nDie One: 4, Die Two: 2\nNew sum: 6\n```\n\n这个例子与之前示例的主要区别在于\
  \ `Die` 类不是 Java 类库的预定义部分。我们必须自己编写 `Die` 类，定义我们希望 `Die` 对象执行的服务，以便程序能够编译和运行。\n\n\
  每个类都可以包含数据声明和方法声明，如图 4.2 所示。数据声明表示存储在每个对象中的数据。方法声明定义了这些对象提供的服务。总来说，类的数据和方法被称为类的*成员*（members）。\n\
  \n我们将继续定义这样的类，例如 `RollingDice` 类，用以定义程序的起点。\n\n然而，真正的面向对象编程来自于定义具有良好状态和行为对象的类。例如，在任何时刻，一个\
  \ `Die` 对象都显示一个特定的点数，我们可以将其称为骰子的状态。一个 `Die` 对象还具有我们可以对其调用的各种方法，例如投掷骰子或获取其点数的方法。\n\
  \n**图 4.2** 类的成员：数据和方法声明\n代码列表 4.2 显示了 `Die` 类。它包含两个数据值：一个表示骰子最大点数的整数常量 (`MAX`)\
  \ 和一个表示骰子当前点数的整数变量 (`faceValue`)。它还包含一个名为 `Die` 的构造函数和四个普通方法：`roll`、`setFaceValue`、`getFaceValue`\
  \ 和 `toString`。\n\n\n\n\n你可能在第 2 章和第 3 章中记得，构造函数是与类名相同的特殊方法。当使用 `new` 操作符创建 `Die`\
  \ 类的新实例时，就会调用 `Die` 构造函数。`Die` 类其余的方法定义了 `Die` 对象提供的各种服务。\n\n我们使用文档头块（header block）来解释类中每个方法的作用。这种做法不仅对于任何试图理解软件的人来说至关重要，而且在视觉上将代码分离，使得眼睛在阅读代码时\
  \ `VideoNote`-轻松地从一个方法跳转到下一个方法。\n\n### 剖析 `Die` 类。\n\n图 4.3 列出了 `Die` 类的方法。从这个角度来看，它与我们在之前的示例中使用的任何其他类都没有区别。唯一的区别是，`Die`\
  \ 类并不是由 Java API 提供的，而是我们自己编写的。\n\n`Die` 类的方法包括掷骰子的能力，产生一个新的随机点数。`roll` 方法将新的点数返回给调用它的方法，但你也可以使用\
  \ `getFaceValue` 方法随时获取当前点数。`setFaceValue` 方法显式地设置点数，就像你伸手过去并将骰子转到你想要的任何点数一样。任何对象的\
  \ `toString` 方法每当你将对象传递给 `print` 或 `println` 方法以获取用于打印的对象的字符串描述时，都会被调用。因此，为大多数类定义一个\
  \ `toString` 方法通常是一个好主意。这些方法的定义包含多个部分，我们将在本章后续中对其进行剖析。\n\n对于书中的示例，我们通常将每个类存储在自己的文件中。Java\
  \ 允许将多个类存储在一个文件中。例如，类 `Die` 存储在 `Die.java` 中。\n\n## 4.2 类的结构\n\n191\n**l i s t i\
  \ n g 4 . 2**\n\n```java\n//********************************************************************\n\
  // Die.java Author: Lewis/Loftus\n//\n// 表示一个骰子（dice 的单数），其面值在\n// 1 到 6 之间。\n//********************************************************************\n\
  public class Die\n{\n    private final int MAX = 6; // 最大点数\n    private int faceValue;\
  \ // 骰子当前显示的点数\n\n    //-----------------------------------------------------------------\n\
  \    // 构造函数：设置初始点数。\n    //-----------------------------------------------------------------\n\
  \    public Die()\n    {\n        faceValue = 1;\n    }\n\n    //-----------------------------------------------------------------\n\
  \    // 掷骰子并返回结果。\n    //-----------------------------------------------------------------\n\
  \    public int roll()\n    {\n        faceValue = (int)(Math.random() * MAX) +\
  \ 1;\n        return faceValue;\n    }\n\n    //-----------------------------------------------------------------\n\
  \    // 点数修改器。\n    //-----------------------------------------------------------------\n\
  \    public void setFaceValue(int value)\n    {\n        faceValue = value;\n  \
  \  }\n\n    //-----------------------------------------------------------------\n\
  \    // 点数访问器。\n    //-----------------------------------------------------------------\n\
  \    public int getFaceValue()\n    {\n        return faceValue;\n    }\n\n    //-----------------------------------------------------------------\n\
  \    // 返回此骰子的字符串表示形式。\n    //-----------------------------------------------------------------\n\
  \    public String toString()\n    {\n        String result = Integer.toString(faceValue);\n\
  \        return result;\n    }\n}\n```\n\n192\n**第 4 章** 类\n**l i s t i n g 4 .\
  \ 2** *续*\n\n**figure 4.3** `Die` 类的一些方法\n\n注意，在 `Die` 类中，常量 `MAX` 和变量 `faceValue`\
  \ 是在类级别声明的（而不是任何方法内部）。变量的作用域是类中引用它的区域。通过在类级别声明，这些变量可以在任何方法中被引用。像诸如变量 `faceValue`\
  \ 的属性被称为 `实例数据`（instance data）。Java 会自动初始化任何在类级别声明的变量。例如，所有 `int` 和 `double` 等数值类型的变量都会初始化为零。然而，尽管语言执行了这种自动初始化，但显式地初始化变量（通常在构造函数中）是一个良好的习惯，这样任何阅读代码的人都能清楚地理解意图。\n\
  \n- `Die()`：构造函数：将初始点数设置为 1。\n- `roll()`：通过设置一个范围内的随机数来掷骰子。\n- `setFaceValue(int\
  \ value)`：将点数设置为指定的值。\n- `getFaceValue()`：返回骰子的当前点数。\n- `toString()`：返回骰子的字符串表示形式。\n\
  \n### UML 类图\n\n在整书中，我们使用 UML 图来视觉化类和对象之间的关系。UML 代表 `Unified Modeling Language`（统一建模语言），它已成为表示面向对象程序设计最流行的符号。\n\
  \n存在多种类型的 UML 图，每种都旨在展示面向对象程序的特定方面。我们在本书中主要关注 UML `class diagrams`（类图），用于展示类的内容以及它们之间的关系。\n\
  \n**figure 4.4** 一个显示 RollingDice 程序中涉及类的 UML 类图\n\n```\n---------------------------------------\n\
  |             RollingDice             |\n---------------------------------------\n\
  | +main(args: String[]) : void       |\n---------------------------------------\n\
  \            |\n            | (uses)\n            v\n---------------------------------------\n\
  |                  Die                  |\n---------------------------------------\n\
  | - MAX : int                         |\n| - faceValue : int                   |\n\
  ---------------------------------------\n| + Die()                             \
  \ |\n| + roll() : int                       |\n| + setFaceValue(int value) : void\
  \    |\n| + getFaceValue() : int              |\n| + toString() : String       \
  \         |\n---------------------------------------\n```\n\n图 4.4 中连接 `RollingDice`\
  \ 和 `Die` 类的箭头表示类之间存在关系。虚线箭头表示一个类*使用*了另一个类的方法。类之间其他类型的面向对象关系用不同类型的线条和箭头表示。我们将在书中探索相应主题时讨论这些其他关系。\n\
  \n请记住，UML 并不是专门为 Java 程序员设计的。它是与语言无关的。因此，U 中使用的语法\n\n\n\n\n图并不一定等同于 Java。例如，变量的类型显示在变量名之后，用冒号分隔。方法的返回类型也以相同的方式显示。\n\
  \nUML 图是多功能的。根据特定图表的目标，我们可以包含任何所需的适当信息。例如，如果某些细节对特定图表不相关，我们可以省略类的数据部分和方法部分。\n\n\
  UML 图允许你将程序设计可视化。随着程序变得越来越大，包含越来越多的类，这些可视化工具将变得越来越有用。我们将根据情况探索 UML 图的新新方面。\n\n**自测复习题**（答案见附录\
  \ N）\n\nSR 4.5 对象和类之间的区别是什么？\n\nSR 4.6 描述 `Die` 类的实例数据。\n\nSR 4.7 为 `Die` 类定义的方法中，哪些可以改变\
  \ `Die` 对象的状态——也就是说，哪些方法可以为实例数据赋值？\n\n![](img/index-196_1.png)\n\n## 4.3 封装\n\n\
  SR 4.8 当你将一个对象传递给 `print` 或 `println` 方法时会发生什么？\n\nSR 4.9 变量的作用域是什么？\n\nSR 4.10\
  \ UML 图的设计目的是什么？\n\n我们在第 1 章关于面向对象概念的概述中提到，对象应该是`自管理`的。这意味着，对象的实例数据应该只由该对象本身修改。例如，`Die`\
  \ 类的方法应该专门负责改变 `faceValue` 变量的值。我们应该让类外部的代码难以（如果不是不可能的话）“伸入”并更改在该类内部声明的变量的值。这种特性被称为`封装`。\n\
  \n对象应该与系统的其余部分封装开。\n\n### **核心概念**\n\n它应该通过一组特定的方法与程序的其他部分交互，这些方法定义了该对象提供的服务，从而保护其数据免受不当访问。这些方法定义了该对象与使用它的程序之间的`接口`。\n\
  \n封装在图 4.5 中以图形表示。使用对象的代码（有时称为对象的`客户端`）不应允许直接访问变量。客户端应该调用对象的方法，然后由这些方法与封装在对象内部的数据交互。例如，`RollingDice`\
  \ 程序中的 `main` 方法调用了 `Die` 对象的 `roll` 方法。\n\n`main` 方法不应该（实际上也无法）直接访问 `faceValue`\
  \ 变量。\n\n对象\n接口\n客户端\n方法\n数据\n\n**图 4.5** 客户端与对象的方法交互\n\n![](img/index-197_1.png)\n\
  \n# 第 4 章 编写类\n\n在 Java 中，我们使用`修饰符`来实现对象封装。修饰符是 Java 的保留字，用于指定编程语言构造的特定特征。在第 2 章中，我们讨论了\
  \ `final` 修饰符，它用于声明常量。Java 有多种可以以各种方式使用的修饰符。某些修饰符可以组合，但某些组合是无效的。\n\n我们将在本书的适当位置讨论各种\
  \ Java 修饰符，所有修饰符都总结在附录 E 中。\n\n### 可见性修饰符\n\n某些 Java 修饰符被称为`可见性修饰符`，因为它们控制对类成员的访问。保留字\
  \ `public` 和 `private` 是可以应用于类和方法的可见性修饰符。如果类的成员具有`public 可见性`，则可以从对象外部直接引用它。如果类的成员具有`private\
  \ 可见性`，则可以在类定义内部任何地方使用，但不能从外部引用。第三种可见性修饰符 `protected` 只在继承上下文中相关。我们将在第 9 章讨论它。\n\
  \n`public` 变量违反了封装。它们允许定义数据的类外部代码“伸入”并访问或修改数据。因此，实例数据应该声明为`private 可见性`以促进封装。声明为\
  \ `private` 的数据只能通过类的方法访问。\n\n我们应用到方法上的可见性取决于该方法的目的。\n\n为客户端提供服务的方法必须声明为`public\
  \ 可见性`，以便客户端可以调用它们。这些方法有时被称为`服务方法`。`private` 方法不能从类外部调用。`private` 方法的唯一目的是帮助类的其他方法完成工作。因此，它们有时被称为`支持方法`。\n\
  \n图 4.6 中的表格总结了 `public` 和 `private` 可见性对变量和方法的影响。\n\n给常量赋予 `public` 可见性通常被认为是可以的，因为尽管它们的值可以被直接访问，但由于它们是使用\
  \ `final` 修饰符声明的，因此无法更改。请记住，封装意味着数据值不应被代码的其他部分直接`更改`。因为常量根据定义是不可变的，所以封装问题在很大程度上不复存在。\n\
  \nUML 类图可以通过在类成员前面加上特定字符来显示其可见性。具有`public 可见性`的成员前面带有一个加号（`+`），具有`private 可见性`的成员前面带有减号（`-`）。\n\
  \n![](img/index-198_1.png)\n\npublic\nprivate\n违反\n强制\n封装\n变量\n提供服务\n支持其他\n方法\n\
  给客户端\n类\n**图 4.6** public 和 private 可见性的影响\n\n### 访问器（Accessors）和修改器（Mutators）\n\
  \n**核心概念**\n\n由于实例数据通常声明为 `private` 可见性，因此类通常提供访问和修改数据的服务。大多数对象都包含访问器方法和修改器方法。\n\
  \n`getFaceValue` 被称为`访问器方法`，因为它提供了对特定值的只读访问。同样，`setFaceValue` 被称为`修改器方法`，因为它改变了特定值。\n\
  \n通常，访问器方法的命名的形式为 `getX`，其中 `X` 是它提供访问的值。同样，修改器方法的形式为 `setX`，其中 `X` 是它们正在设置的值。因此，这些类型的方法有时被称为“getter”和“setter”。\n\
  \n例如，如果一个类包含实例变量 `height`，它可能还会包含 `getHeight` 和 `set` 方法。注意这种命名约定在方法名中使用变量的首字母大写，这与通用的方法命名方式是一致的。\n\
  \n某些方法可能作为其主要目的的副作用提供访问和/或修改器功能。例如，`Die` 类的 `roll` 方法改变了骰子的 `faceValue` 并同样返回该新值。因此，`roll`\
  \ 也是一个修改器方法。\n\n注意 `roll` 方法的代码非常小心地将点数保持在有效范围内（1 到 `MAX`）。服务方法必须经过仔细设计，以仅允许适当的访问和有效的更改。这指出了\
  \ `Die` 类设计的一个缺陷：`setFaceValue` 方法没有限制——客户端可以使用它将骰子值设置为 20 等超出范围的数字。`setFaceValue`\
  \ 方法的代码应该只允许对骰值的有效修改。我们将在下一章探讨如何实现这种控制。\n\n\n\n\n\n## 自测题（答案见附录 N）\n\n- SR 4.11\
  \ 对象应该是自治的。请解释。\n- SR 4.12 对象的接口是什么？\n- SR 4.13 什么是修饰符？\n- SR 4.14 为什么可以给常量赋予公共可见性？\n\
  - SR 4.15 描述下述每一项：\n    a. 公有方法 (public method)\n    b. 私有方法 (private method)\n\
  \    c. 公有变量 (public variable)\n    d. 私有变量 (private variable)\n\n## 4.4 方法的结构\n\
  \n我们已经看到类是由数据声明和方法声明组成的。让我们详细地检查方法声明。\n\n正如我们在第 1 章中所说的，方法是一组被命名的编程语言语句。`method\
  \ declaration`（方法声明）指定了方法被调用时执行的代码。Java 程序中的每个方法都是特定类的一部分。\n\n当方法被调用时，控制流会转移到该方法。该方法的各个语句会被逐个执行。当该方法执行完成后，控制返回到调用发生的位置并继续执行。\n\
  \n`被调用方法`（被调用的方法）可能与调用它的`调用方法`属于同一个类。如果被调用方法属于同一个类，则只需要方法名即可调用它。如果它属于不同的类，则正如我们多次看到的那样，它是通过该另一个类的对象名称调用的。图\
  \ 4.7 显示了方法被调用时的执行流。\n\n我们在之前的示例中多次定义了程序的 `main` 方法。它的定义与所有方法遵循相同的语法。方法的头部包括返回值的类型、方法名以及该方法接受的参数列表。构成方法体的语句定义在由花括号限定的块中。本节的其余部分将更详细地讨论与方法声明相关的问题。\n\
  \n### 方法声明 (Method Declaration)\n\n```\nType\nIdentifier\nParameters\nThrows Clause\n\
  Method Body\nModifier\nvoid\nparameters\n( )\nType\nIdentifier\n,\n```\n\n方法由可选的修饰符定义，随后是返回类型\
  \ `Type`，接着是确定方法名的 `Identifier`（标识符），然后是 `Parameters`（参数）列表，最后是 `Method Body`（方法体）。返回\
  \ `Type` 表示方法将返回的值的类型，该可以是 `void`。`Method Body` 是在方法被调用时执行的语句块。`Throws Clause`（异常声明）是可选的，表示此方法可能抛出的异常。\n\
  \n示例：\n```java\npublic void instructions(int count)\n{\n    System.out.println(\"\
  Follow all instructions.\"); \n    System.out.println(\"Use no more than \" + count\
  \ + \" turns.\");\n}\n```\n\n```\nmain\ndoThis\nhelpMe\nobj.doThis();\nhelpMe();\n\
  ```\n**图 4.7** 方法调用后的控制流\n![](img/index-201_1.png)\n\n### 返回语句 (the return statement)\n\
  \n方法头部中指定的返回类型可以是基本数据类型、类名或保留字 `void`。当方法不返回任何值时，使用 `void` 作为返回类型，这在 `main` 方法中总是这样做的。`Die`\
  \ 类的 `setFaceValue` 方法的返回类型也是 `void`。\n\n返回值的方法必须有一个 `return statement`（返回语句）。当执行\
  \ `return statement` 时，控制会立即返回到调用方法中的语句处，并在那里继续处理。`return statement` 由保留字 `return`\
  \ 以及一个决定要返回值的表达式组成。该表达式必须与方法头部中的返回类型一致。\n\n`Die` 类的 `getFaceValue` 方法返回一个 `int`\
  \ 值，代表骰子的当前值。`roll` 方法也执行同样的操作，返回 `faceValue` 刚刚随机设置的新值。`toString` 方法返回一个 `String`\
  \ 对象。\n\n不返回值的方法通常不包含 `return statement`。当到达方法末尾时，方法会自动返回到调用它的方法。此类方法可以包含一个不带表达式的\
  \ `return statement`。从方法返回的值必须与方法头部中指定的返回类型一致。\n\n在方法中使用多个一个 `return statement`\
  \ 通常不是一个良好的习惯，尽管这样做是可行的。通常情况下，一个方法应该有一个 `return statement` 作为方法体的最后一行，除非这会使方法变得过于复杂。\n\
  \n从方法返回的值可以在调用方法中被忽略。例如，在 `RollingDice` 类的 `main` 方法中，返回的值被忽略了：\n```java\nreturn;\n\
  ```\n`return statement` 由 `return` 保留字加上一个可选的 `Expression`（表达式）组成。执行时，控制会立即返回到调用方法，并返回由\
  \ `Expression` 定义的值。\n\n示例：\n```java\nreturn;\nreturn distance * 4;\n```\n![](img/index-202_1.png)\n\
  \n`roll` 方法返回的值在某些调用中被忽略了，而在另一些调用中，返回值被用于计算。\n\n构造函数没有返回类型（甚至没有 `void`），因此不能返回值。我们将在本章的晚些部分详细讨论构造函数。\n\
  \n### 参数 (parameters)\n\n正如我们在第 2 章中定义的，参数是方法被调用时传递到方法的值。方法头部的 `parameter list`（参数列表）指定了传递的值的类型，以及调用方法引用这些值的名称。\n\
  \n方法声明中的参数名称被称为 `formal parameters`（形式参数）。在调用中，传递进去的值被称为 `actual parameters`（实际参数）。\n\
  \n方法调用和定义始终会在方法名后的括号中给出参数列表。如果没有参数，则使用空括号，如 `roll` 和 `getFaceValue` 方法所示。`Die` 构造函数也不接受参数，尽管构造函数通常。\n\
  \n`formal parameters` 是方法内部作为变量的标识符，其初始值来自调用中的 `actual parameters`。当方法被调用时，每个 `actual\
  \ parameter` 中的值会被复制并存储在相应的 `formal parameter` 中。`actual parameters` 可以是字面量、变量或完整的表达式。如果表达式作为\
  \ `actual parameter`，它会在方法调用之前完全求值，结果作为参数传递。\n\n`Die` 类中唯一接受任何参数的方法是 `setFaceValue`\
  \ 方法，它接受一个 `int` 参数。形式参数名为 `value`。在 `main` 方法中，值 `4` 作为 `actual parameter` 传递给它。\n\
  \n调用和方法声明中的参数列表必须匹配。也就是说，第一个 `actual parameter` 的值被复制到第一个 `formal parameter`，第二个\
  \ `actual parameter` 到第二个 `formal parameter`，依此类推，如图 4.8 所示。`actual parameters`\
  \ 的类型必须与指定的 `formal parameters` 类型一致。\n\n关于参数传递的其他细节将在第 7 章讨论。\n\n### 局部数据 (local\
  \ Data)\n\n正如我们在本章前面所述，变量或常量的作用范围是对该变量进行有效引用的程序部分。一个变量\n![](img/index-203_1.png)\n\
  \n```java\nch = obj.calc (25, count, \"Hello\");\n\nchar calc (int numl, int num2,\
  \ String message)\n{\n    int sum = numl + num2;\n    char result = message.charAt\
  \ (sum);\n    return result;\n}\n```\n**图 4.8** 从方法调用到声明的参数传递可以在方法内部声明，使其成为相对于于实例数据的\
  \ `local data`。\n\n\n\n\n\n回想一下实例数据是在类中声明的，但在任何特定方法之外。\n\n局部数据的作用范围仅限于声明它的 `Key\
  \ Concept`（核心概念）方法。在 `Die` 类 `toString` 方法中声明的变量 `result` 就是局部数据。在该方法的任何其他方法中对 `result`\
  \ 的引用都仅是该方法局部的，且不能在方法之外使用。在 `Die` 类的方法中声明的变量将导致编译器发出错误信息。局部变量在声明它的方法之外简单地不存在。另一方面，在类级别声明的实例数据其作用范围涵盖整个类；该类的任何方法都可以引用它。\n\
  \n由于局部数据和实例数据在不同的作用域层次上运行，因此可以在方法内部声明一个与类级别声明的实例变量同名的局部变量。在方法中引用该名称将引用该变量的本地版本。这种命名习惯显然具有混淆任何阅读代码的人的可能，因此应该被避免。\n\
  \n方法头中的形式参数名称用作该方法的局部数据。它们在方法被调用之前不存在，在方法退出时也不复存在。例如，`setFaceValue` 方法中的形式参数值在方法被调用时产生，在方法执行结束时消失。\n\
  \n### 银行账户示例\n\n让我们来看另一个类及其使用的示例。列表 4.3 显示的 `Transactions` 类包含一个 `main` 方法，该方法创建了几个\
  \ `Account` 对象并调用了它们的服务。\n\n## 4.4 方法的结构\n\n#### 列表 4.3\n```java\n//********************************************************************\n\
  // Transactions.java Author: Lewis/Loftus\n//\n// 展示多个 Account 对象的创建和使用。\n//********************************************************************\n\
  public class Transactions\n{\n    //-----------------------------------------------------------------\n\
  \    // 创建一些银行账户并请求各种服务。\n    //-----------------------------------------------------------------\n\
  \    public static void main(String[] args)\n    {\n        Account acct1 = new\
  \ Account(\"Ted Murphy\", 72354, 102.56); \n        Account acct2 = new Account(\"\
  Jane Smith\", 69713, 40.00); \n        Account acct3 = new Account(\"Edward Demsey\"\
  , 93757, 759.32);\n        acct1.deposit(25.85);\n\n        double smithBalance\
  \ = acct2.deposit(500.00);\n        System.out.println(\"Smith balance after deposit:\
  \ \" + smithBalance);\n        System.out.println(\"Smith balance after withdrawal:\
  \ \" + acct2.withdraw(430.75, 1.50));\n\n        acct1.addInterest();\n        acct2.addInterest();\n\
  \        acct3.addInterest();\n\n        System.out.println();\n        System.out.println(acct1);\n\
  \        System.out.println(acct2);\n        System.out.println(acct3);\n    }\n\
  }\n```\n\n**输出**\n```\nSmith balance after deposit: 540.0\nSmith balance after withdrawal:\
  \ 107.75\n72354 Ted Murphy $132.90\n69713 Jane Smith $111.52\n93757 Edward Demsey\
  \ $785.90\n```\n\n列表 4.4 显示的 `Account` 类代表一个基础银行账户。它包含代表账户号码、账户当前余额和账户所有者名称的实例数据。注意，实例数据可以是一个\
  \ `VideoNote` 对象引用变量（而不仅仅是基本类型），例如账户所有者的名称，它是对 `String` 对象的引用。账户的利率被存储为常量。`Account`\
  \ 类的构造函数接受三个参数，用于初始化实例数据。`deposit` 和 `withdraw` 方法在账户上执行基础交易，根据参数调整余额。还有一个 `addInterest`\
  \ 方法通过加上赚取的利息来更新余额。这些方法代表了改变余额的有效方式，因此没有提供如 `setBalance`get 经典的修改器（mutator）。\n\n\
  #### 列表 4.4\n```java\n//********************************************************************\n\
  // Account.java Author: Lewis/Loftus\n//\n// 代表一个具有基础服务（如存款\n// 取款）的银行账户。\n//********************************************************************\n\
  import java.text.NumberFormat;\n\npublic class Account\n{\n    private final double\
  \ RATE = 0.035; // 3.5%的利率\n    private long acctNumber;\n    private double balance;\n\
  \    private String name;\n\n    //-----------------------------------------------------------------\n\
  \    // 通过定义所有者、账户号码和\n    // 余额来设置账户。\n    //-----------------------------------------------------------------\n\
  \    public Account(String owner, long account, double initial)\n    {\n       \
  \ name = owner;\n        acctNumber = account;\n        balance = initial;\n   \
  \ }\n\n    //-----------------------------------------------------------------\n\
  \    // 将指定金额存入账户。返回\n    // 新余额。\n    //-----------------------------------------------------------------\n\
  \    public double deposit(double amount)\n    {\n        balance = balance + amount;\n\
  \        return balance;\n    }\n\n    //-----------------------------------------------------------------\n\
  \    // 从账户中取出指定金额并收取\n    // 手续费。返回新余额。\n    //-----------------------------------------------------------------\n\
  \    public double withdraw(double amount, double fee)\n    {\n        balance =\
  \ balance - amount - fee;\n        return balance;\n    }\n\n    //-----------------------------------------------------------------\n\
  \    // 通过加上赚取的利息更新余额。\n    //-----------------------------------------------------------------\n\
  \    public double addInterest()\n    {\n        balance += (balance * RATE);\n\
  \        return balance;\n    }\n\n    //-----------------------------------------------------------------\n\
  \    // 返回账户的余额。\n    //-----------------------------------------------------------------\n\
  \    public double getBalance()\n    {\n        return balance;\n    }\n\n    //-----------------------------------------------------------------\n\
  \    // 返回账户的单行描述。\n    //-----------------------------------------------------------------\n\
  \    public String toString()\n    {\n        NumberFormat fmt = NumberFormat.getCurrencyInstance();\n\
  \        return acctNumber + \"\\t\" + name + \"\\t\" + fmt.format(balance);\n \
  \   }\n}\n```\n\n在 `Transactions` 程序中创建后，三个 `Account` 对象的状态如下：\n\n`acct1`: 72354,\
  \ `balance`: 102.56, `name`: \"Ted Murphy\"\n`acct2`: 69713, `balance`: 40.00, `name`:\
  \ \"Jane Smith\"\n`acct3`: 93757, `balance`: 759.32, `name`: \"Edward Demsey\"\n\
  \n更新账户余额的各种方法可以设计得更严谨。应该进行检查以确保参数有效，例如防止提取负数（这实际上是存款）。这种处理将在下一章中讨论。\n\n### 自测习题（见附录\
