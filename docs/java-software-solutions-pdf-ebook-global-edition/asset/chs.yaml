  \ 搜索\n\n与排序一样，查找一个项目是另一个经典的计算问题，也适用于多态解决方案。`Searching` 是在一组项目内寻找 `target element`\
  \ 的过程。例如，我们可能需要在俱乐部成员列表中查找名为 Vito Andolini 的人。\n\n要搜索的项目组有时被称为 `search pool`（搜索池）。搜索池通常组织成某种对象的集合，例如数组。每当我们执行搜索时，必须考虑目标不在组中的可能性。此外，我们希望高效地执行搜索。我们不想进行任何不必要的比较。\n\
  \n#### 线性 own\n\n如果可以按任何顺序一次一个元素检查搜索池，那么执行搜索的一种简单方法是从列表开始，并逐个将每个值与目标元素进行比较。最终，要么找到目标元素，要么到达列表末尾并得出目标不存在于组中的结论。\n\
  \n这种方法被称为 `linear search`，因为它从一端开始并以线性方式扫描搜索池。这个过程如图 10.4 所示。当项目存储在数组中，线性搜索相对简单。\n\
  \nListing 10.11 所示的程序与上一节的 `PhoneList` 程序相似。它从相同的、未排序的 `Contact` 对象数组开始。然后它对联系人进行线性搜索并打印结果。接着它调用了上一节中讨论过的\
  \ `selectionSort` 方法对联系人进行排序。然后它使用二分查找查找另一个联系人，二分查找在本节后面会讨论。\n\n**图 10.4** 线性搜索\n\
