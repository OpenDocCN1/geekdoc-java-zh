  \ 255。\n\n558\n**第 10 章** 多态\n\n滑块产生一个更改事件，指示滑块的位置及其所代表的值已更改。`ChangeListener` 接口包含一个名为\
  \ `stateChanged` 的方法。在 SlideColor 程序中，三个滑块使用同一个监听器对象。在 `stateChanged` 方法中（每当调整任何滑块时都会调用该方法），获取每个滑块的值，更新所有三个标签，并修订显示面板的背景颜色。实际上，只需要更新一个标签（发生变化的滑块对应的标签）。但是，确定是哪个滑块被调整的精力是不必要的。每次更新三个标签更为简单且可能更高效。另一种方案是为每个滑块创建一个唯一的监听器，尽管这种额外的代码工作也是需要的。\n\
  \n当范围很大且两端都有限制时，滑块通常是一个很好的选择。与字段等替代方案相比，滑块向用户传递了更多信息并消除了输入错误。\n\n练习\n\n559\n**核心概念总结**\n\
  \n■ 多态引用可以随时间指向不同类型的对象。\n■ 对于多态引用，方法调用到定义的绑定是在运行时完成的。\n■ 引用变量可以指向任何与其通过继承关系相关的类所创建的对象。\n\
  ■ 使用对象的类型而不是引用的类型来确定调用哪个版本的方法。\n■ 接口名称可以声明对象引用变量。\n\n\n\n\n# 第 10 章 多态\n\n- 接口引用可以指向实现该接口的任何类的任何对象。\n\
  - 方法的参数可以是多态的，使方法能够对其参数进行灵活的控制。\n- 以多态方式实现排序算法可以使其对任何可比较的对象集合进行排序。\n- 多态允许我们对不一致的行为采用一致的方法。\n\
  - 我们应该磨炼设计直觉，以识别适合采用多态解决方案的情况。\n- 建立监听器与它监听的组件之间的关系是通过使用多态实现的。\n- 文件选择器（file chooser）允许用户浏览磁盘并选择要处理的文件。\n\
  - 颜色选择器（color chooser）允许用户从调色板中选择颜色或使用 RGB 值。\n- 滑块（slider）允许用户在限定范围内指定一个数值。\n\n\
