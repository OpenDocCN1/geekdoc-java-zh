  \n**384**\n\n**第 7 章** 对象化设计\n\n**列表 7.21**\n*续*\n\n### 显示\n\n在 `BorderPanel` 类构造函数中，面板的布局管理器被显式设置为边框布局。然后创建按钮并将它们添加到面板的特定区域。默认情况下，每个按钮的宽度都足够容纳其标签，高度也足够填充它被分配的区域。随着框架（以及面板）的大小进行调整，每个按钮的大小都会根据需要进行调整，位于\
  \ `Center` 区域的按钮将填充任何未使用的空间。\n\n边框布局中的每个区域只显示一个组件。也就是说，给定边框布局的每个区域只添加一个组件。常见的错误是向边框布局的特定区域添加两个组件，在这种情况下，先添加的组件会被第二个组件替换，并且在显示容器时只能看到第二个组件。要向边框布局中的区域内添加多个组件，我们首先将这些组件添加到另一个容器（例如\
  \ `JPanel`）中，然后将该面板添加到区域中。\n\n**7.11** 布局管理器\n\n**385**\n\n注意，尽管用于显示按钮的面板具有绿色背景，但在列表\
  \ 7.21 的显示中并没看到绿色。默认情况下，边框布局的区域之间没有水平或垂直间隙。这些间隙可以使用重载的构造函数或 `BorderLayout` 类的显式方法设置。如果增加了间隙，底层面板将显示出来。\n\
  \n## 网格布局 (grid layout)\n\n`grid layout` 以行和列的矩形网格形式呈现容器的组件。每个网格单元格中放置一个组件，所有单元格的大小相同。\n\
  \n图 7.9 显示了网格布局的般结构。\n\n网格布局中的行数和列数是在创建布局管理器时通过构造函数的参数确定的。列表 7.22 中的类显示了 `LayoutDemo`\
  \ 程序用于演示网格布局的面板。它指定面板应使用二行三列的网格进行管理。\n\n随着按钮被添加到容器中，它们会（默认情况下）从左到右、从上到下填充网格。除了它们添加到容器的顺序外，没有办法可以显式将组件分配到网格中的特定位置。\n\
  \n每个单元格的大小由容器的整体大小决定。当调整容器大一时，所有单元格的大小都会按比例变化以填充容器。\n\n如果用于指定行数或列数的值为零，则网格在该维度上按需要扩展，以容纳添加到容器的组件数量。行数和列数的值不能同时为零。\n\
