  \n# 第 11 章异常\n\n## 11.1 异常处理\n\n### SR 11.1 异常是一个定义了异常情况或错误情况的对象。\n\n错误（Error）与之类似，不同之处错误通常表示不可恢复的情况，且不应该被捕获。\n\
  \n### SR 11.2 抛出的异常可以通过三种方式之一处理：可以被忽略，这会导致程序终止；可以在异常发生的地方使用 `try` 语句进行处理；或者可以在方法调用层次结构中的更高处进行捕获并处理。\n\
  \n## 11.2 未捕获的异常\n\n### SR 11.3 a. 错误 – 异常和错误之间相关联，但并不总是同一事物。\n\nb. 正确 – 除以零是无效的，因此会抛出异常。\n\
  \nc. 错误 – 异常必须被处理或被抛出。\n\nd. 正确 – 如果异常未被处理，程序将终止并显示消息。\n\ne. 正确 – 这就是调用栈轨迹的用途。\n\
  \n## 11.3 try-catch 语句\n\n### SR 11.4 `try` 语句的 `catch` 语句句定义了处理特定类型异常的代码。\n\n###\
  \ SR 11.5 `try` 语句的 `finally` 子句无论 `try` 块以何方式退出都会执行。如果没有抛出异常，则在 `try` 块完成后执行 `finally`\
  \ 子句。如果抛出了异常，则执行相应的 `catch` 子句；然后执行 `finally` 子句。\n\n# 附录 n 自测题答案 807\n\n### SR\
  \ 11.6 生成的输出为：\n\na.\n```\nfinally\nthe end\n```\n\nb. one caught\nfinally\nthe\
  \ end\n\nc. two caught\nfinally\nthe end\n\nd. finally\n\n## 11.4 异常传播\n\n### SR\
  \ 11.7 如果异常在抛出时没有立即被捕获，它将开始向上通过生成该点时调的方法进行传播。异常可以在传播过程中的任何一点被捕获并处理。如果它传播到 `main`\
  \ 方法之外，程序将终止。\n\n### SR 11.8 如果将生成异常的代码被添加到 `level2` 方法中，且在调用 `level3` 方法之前，那么输出将不包含任何关于“Level\
