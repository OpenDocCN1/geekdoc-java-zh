  \     final int TOP = 50;\n        setBackground(Color.cyan);\n        page.setColor(Color.blue);\n\
  \        page.fillRect(0, 175, 300, 50); // ground\n        page.setColor(Color.yellow);\n\
  \        page.fillOval(-40, -40, 80, 80); // sun\n        page.setColor(Color.white);\n\
  \        page.fillOval(MID-20, TOP, 40, 40); // head\n        page.fillOval(MID-35,\
  \ TOP+35, 70, 50); // upper torso\n        page.fillOval(MID-50, TOP+80, 100, 60);\
  \ // lower torso\n        page.setColor(Color.black);\n        page.fillOval(MID-10,\
  \ TOP+10, 5, 5); // left eye\n        page.fillOval(MID+5, TOP+10, 5, 5); // right\
  \ eye\n        page.drawArc(MID-10, TOP+20, 20, 10, 190, 160); // smile\n      \
  \  page.drawLine(MID-25, TOP+60, MID-50, TOP+40); // left arm\n        page.drawLine(MID+25,\
  \ TOP+60, MID+55, TOP+60); // right arm\n        page.drawLine(MID-20, TOP+5, MID+20,\
  \ TOP+5); // brim of hat\n        page.fillRect(MID-15, TOP-20, 30, 25); // top\
  \ of hat\n    }\n}\n```\n\n![](img/index-130_1.png)\n\n### 2.9 绘制形状\n\n**129**\n\
