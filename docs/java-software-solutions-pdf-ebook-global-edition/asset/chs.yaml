  \n`main` 方法实例化了一个 `SplatPanel` 对象并将其添加到框架中。\n\n`SplatPanel` 类位于 `Listing 4.8` 中。与上一个示例中的\
  \ `SmilingFacePanel` 类一样，`SplatPanel` 类派自 `JPanel`。它包含五个 `Circle` 对象作为实例数据，这些对象在构造函数中被实例化。\n\
  \n## 4.6 图形对象\n\n```java\n//********************************************************************\n\
  // SplatPanel.java Author: Lewis/Loftus\n//\n// Demonstrates the use of graphical\
  \ objects.\n//********************************************************************\n\
  import javax.swing.*;\nimport java.awt.*;\n\npublic class SplatPanel extends JPanel\n\
  {\n    private Circle circle1, circle2, circle3, circle4, circle5;\n\n    //-----------------------------------------------------------------\n\
  \    // Constructor: Creates five Circle objects.\n    //-----------------------------------------------------------------\n\
  \    public SplatPanel()\n    {\n        circle1 = new Circle(30, Color.red, 70,\
  \ 35);\n        circle2 = new Circle(50, Color.green, 30, 20);\n        circle3\
  \ = new Circle(100, Color.cyan, 60, 85);\n        circle4 = new Circle(45, Color.yellow,\
  \ 170, 30);\n        circle5 = new Circle(60, Color.blue, 200, 60);\n        setPreferredSize(new\
  \ Dimension(300, 200));\n        setBackground(Color.black);\n    }\n\n    //-----------------------------------------------------------------\n\
  \    // Draws this panel by requesting that each circle draw itself.\n    //-----------------------------------------------------------------\n\
  \    public void paintComponent(Graphics page)\n    {\n        super.paintComponent(page);\n\
  \        circle1.draw(page);\n        circle2.draw(page);\n        circle3.draw(page);\n\
  \        circle4.draw(page);\n        circle5.draw(page);\n    }\n}\n```\n\n`SplatPanel`\
  \ 类中的 `paintComponent` 方法通过调用每个圆的 `draw` 方法来绘制面板。本质上，`SplatPanel` 类是要求每个圆自己绘制自己。\n\
  \n`Circle` 类位于 `Listing 4.9`。它定义了实例数据来存储圆的大小、它的 (`x`, `y`) 位置以及它的颜色。这些值通过构造函数设置，该类包含了所有适当访问器和变变器方法。`Circle`\
  \ 类的 `draw` 方法仅根据其实例数据的值（其当前状态）绘制圆。\n\n```java\n//********************************************************************\n\
  // Circle.java Author: Lewis/Loftus\n//\n// Represents a circle with a particular\
  \ position, size, and color.\n//********************************************************************\n\
  import java.awt.*;\n\npublic class Circle\n{\n    private int diameter, x, y;\n\
  \    private Color color;\n\n    //-----------------------------------------------------------------\n\
  \    // Constructor: Sets up this circle with the specified values.\n    //-----------------------------------------------------------------\n\
  \    public Circle(int size, Color shade, int upperX, int upperY)\n    {\n     \
  \   diameter = size;\n        color = shade;\n        x = upperX;\n        y = upperY;\n\
  \    }\n\n    //-----------------------------------------------------------------\n\
  \    // Draws this circle in the specified graphics context.\n    //-----------------------------------------------------------------\n\
  \    public void draw(Graphics page)\n    {\n        page.setColor(color);\n   \
  \     page.fillOval(x, y, diameter, diameter);\n    }\n\n    //-----------------------------------------------------------------\n\
  \    // Diameter mutator.\n    //-----------------------------------------------------------------\n\
  \    public void setDiameter(int size)\n    {\n        diameter = size;\n    }\n\
  \n    //-----------------------------------------------------------------\n    //\
  \ Color mutator.\n    //-----------------------------------------------------------------\n\
  \    public void setColor(Color shade)\n    {\n        color = shade;\n    }\n\n\
  \    //-----------------------------------------------------------------\n    //\
  \ X mutator.\n    //-----------------------------------------------------------------\n\
  \    public void setX(int upperX)\n    {\n        x = upperX;\n    }\n\n    //-----------------------------------------------------------------\n\
  \    // Y mutator.\n    //-----------------------------------------------------------------\n\
  \    public void setY(int upperY)\n    {\n        y = upperY;\n    }\n\n    //-----------------------------------------------------------------\n\
  \    // Diameter accessor.\n    //-----------------------------------------------------------------\n\
  \    public int getDiameter()\n    {\n        return diameter;\n    }\n\n    //-----------------------------------------------------------------\n\
  \    // Color accessor.\n    //-----------------------------------------------------------------\n\
  \    public Color getColor()\n    {\n        return color;\n    }\n\n    //-----------------------------------------------------------------\n\
  \    // X accessor.\n    //-----------------------------------------------------------------\n\
  \    public int getX()\n    {\n        return x;\n    }\n\n    //-----------------------------------------------------------------\n\
  \    // Y accessor.\n    //-----------------------------------------------------------------\n\
  \    public int getY()\n    {\n        return y;\n    }\n}\n```\n\n`Splat` 程序体现了基本的面向对象思维。每个圆都管理自己，并在传递给它的任何图形环境中绘制自己。\n\
  \n每个 `Circle` 对象都维护自己的状态。`Circle` 类的定义方式可以在其他情况和程序中使用。\n\n**自习题（答案见附录 N）**\n\nSR\
  \ 4.26 在 `SmilingFace` 程序中，面板的“内容”在哪里定义的？\n\nSR 4.27 在 `SmilingFace` 程序中，面板对象的 `paintComponent`\
  \ 方法何时以及如何被调用的？\n\nSR 4.28 编写代码为笑笑脸添加一副眼镜。\n\nSR 4.29 重写 `Circle` 类的构造函数，使其为其设置的\
  \ `Circle` 对象生成一个直径在 20 到 200 之间的随机直径。圆的其他属性应作为参数传递给构造函数。\n\n### 4.7 图形用户界面\n\n\
  在第 2 章和第 3 章中，我们介绍了一些有助于设计图形程序的关键组件。现在我们需要的是真正的用户交互，这是图形用户界面（GUI）的核心。本节介绍了创建交互式\
  \ GUI 程序所需的概念。它为全书中后续所有的 GUI 讨论奠定了基础。\n\n在 Java 中创建图形用户界面至少需要三种对象：\n\n- 组件（components）\n\
  - 事件（events）\n- 监听器（listeners）\n\n\n\n\n正如我们在第 3 章中提到的，GUI `component`（组件）是一个定义屏幕元素的对象，用于显示信息或允许用户以特定方式与程序进行交互。GUI\
  \ 组件的示例包括推按钮、文本字段、标签、滚动条和菜单。`container`（容器）是一种特殊的组件，用于包含和组织其他组件。我们已经使用过框架（frames）和面板（panels）等容器，并探索了标签（labels）的使用。\n\
  \n`event`（事件）是一个代表我们可能感兴趣的发生的对象。通常，事件对应于用户操作，例如按下鼠标按钮或在键盘上输入按键。大多数 GUI 组件都会生成事件以指示与该组件相关的用户操作。例如，按钮组件会生成一个事件来表示按钮已被按下。以\
  \ GUI 为核心并响应用户事件的程序被称为 `event-driven`（事件驱动的）。\n\n`listener`（监听器）是一个“等待”事件发生的对象**核心概念**，并在事件发生时以某种方式做出响应。我们必须仔细地建立监听器、它所监听的事件以及生成该事件的组件之间的关系。\n\
  \nGUI 由组件、代表用户操作的事件以及响应这些事件的监听器组成。在大多数情况下，我们将使用 Java 类库中类预定义的组件和事件。我们将定制组件的行为，但它们的基本角色已经确定。然而，我们将编写监听器类以便在事件发生时执行我们所需的任何操作。\n\
  \n具体而言，要创建一个使用 GUI 的 Java 程序，我们必须：\n* 实例化并设置必要的组件，\n* 实现监听器类，定义当特定事件发生时发生什么，以及\n\
  **视频笔记**\n* 建立监听器与生成感兴趣事件的组件之间的关系。\n\n# GUI 开发概述\n\n## 第 4 章 类编写\n\n在某些方面，一旦你对事件驱动编程有了基本的理解，剩下的只是细节了。你可以使用许多类型的组件，它们会产生你可能想要确认的许多类型的事件。但它们的工作原理都是相同的。它们之间具有相同的核心关系。\n\
  \n接下来的章节将介绍更多组件，并展示允许真实用户交互的 GUI 程序示例。\n\n### 自测习题 *（答案见附录 N）*\nSR 4.30 事件和监听器之间是什么关系？\n\
  SR 4.31 我们可以向任何组件添加任何类型的监听器吗？请解释。\n\n## 4.8 按钮\n\n列表 4.10 显示的 `PushCounter` 程序向用户提供了一个单推按钮（标记为“Push\
  \ Me!”）。每次按下按钮时，计数器就会更新并显示。\n\n### 列表 4.10\n```java\n//********************************************************************\n\
  // PushCounter.java 作者: Lewis/Loftus\n//\n// 展示了图形化用户界面和事件监听器。\n//********************************************************************\n\
  import javax.swing.JFrame;\n\npublic class PushCounter\n{\n//-----------------------------------------------------------------\n\
  // 创建主程序框架。\n//-----------------------------------------------------------------\n\
  public static void main(String[] args)\n{\nJFrame frame = new JFrame(\"Push Counter\"\
  ); \nframe.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\n![](img/index-220_1.png)\n\
  \nframe.getContentPane().add(new PushCounterPanel());\nframe.pack();\nframe.setVisible(true);\n\
  }\n}\n```\n\n### 显示\n此程序中使用的组件包括一个按钮、一个显示计数的标签、一个组织 GUI 的面板以及一个显示面板的框架。面板由 `PushCounterPanel`\
  \ 类定义，如列表 4.11 所示。\n\n推按钮是一种允许用户通过点击鼠标启动操作的组件。在随后的章节中，我们将探索其他类型的按钮组件。推按钮由 `JButton`\
  \ 类定义。\n\n### 列表 4.11\n```java\n//********************************************************************\n\
  // PushCounterPanel.java 作者: Lewis/Loftus\n//\n// 展示了图形化用户界面和事件监听器。\n//********************************************************************\n\
  import java.awt.*;\nimport java.awt.event.*;\nimport javax.swing.*;\n\npublic class\
  \ PushCounterPanel extends JPanel\n{\nprivate int count;\nprivate JButton push;\n\
  private JLabel label;\n\n//-----------------------------------------------------------------\n\
  // 构造函数：设置 GUI。\n//-----------------------------------------------------------------\n\
  public PushCounterPanel()\n{\ncount = 0;\npush = new JButton(\"Push Me!\");\npush.addActionListener(new\
  \ ButtonListener());\nlabel = new JLabel(\"Pushes: \" + count);\nadd(push);\nadd(label);\n\
  setPreferredSize(new Dimension(300, 40));\nsetBackground(Color.cyan);\n}\n//*****************************************************************\n\
  // 代表按钮按下（动作）事件的监听器。\n//*****************************************************************\n\
  private class ButtonListener implements ActionListener\n{\n//--------------------------------------------------------------\n\
  // 当按钮被按下时更新计数器和标签。\n//--------------------------------------------------------------\n\
  public void actionPerformed(ActionEvent event)\n{\ncount++;\nlabel.setText(\"Pushes:\
  \ \" + count);\n}\n}\n}\n```\n\n`PushCounterPanel` 构造函数设置了 GUI。对 `JButton` 构造函数的调用接收一个\
  \ `String` 参数，指定按钮上显示的文本。\n\n按钮和标签被添加到面板中。\n\n此程序中感兴趣的事件发生在按钮按下时。为了响应该事件，我们必须为该事件创建一个监听器对象，因此我们必须编写一个表示监听器的类。\n\
  \n![](img/index-222_1.png)\n\n`JButton` 在被按下时会生成 `action event`（动作事件）。因此我们编写的监听器类将是一个动作监听器。在本程序，我们定义了一个名为\
  \ `ButtonListener` 的类来表示该事件的监听器。\n\n**核心概念**\n我们可以将 `ButtonListener` 类写在单独的文件中，或者在同一个文件中但\
  \ `PushCounterPanel` 类之外。然而，这样我们必须建立一种方式，在监听器与它更新的 GUI 组件之间进行通信。相反，我们在内部定义 GUI 组件。\n\
  \n我们将 `ButtonListener` 类定义为 `inner class`（内部类），它是定义在另一个类内部的类。因此，它可以自动访问包含它的类的成员。只有当两个类之间存在密切的关系且内部类不被任何其他类访问时，你应该创建内部类。监听器与其\
  \ GUI 之间的关系是适用于内部类的情况之一。\n\n监听器类通过实现 `interface`（接口）来编写，接口是实现类必须定义的方法列表。Java 标准类库包含许多类型事件的接口。动作监听器是通过实现\
  \ `ActionListener` 接口创建的；因此我们在 `ButtonListener` 类中包含了 `implements` 子句。接口将在第 7 章中更详细地讨论。\n\
  \n\n\n\n\n`ActionListener` 接口中列出的唯一方法是 `actionPerformed` 方法，因此这是 `ButtonListener`\
  \ 类必须实现的方法。产生动作事件的组件（在本例中为按钮）在事件发生时会调用 `actionPerformed` 方法，并传入一个代表该事件的 `ActionEvent`\
  \ 对象。有时我们会使用该事件对象，而其他时候只需要知道事件发生了就足够了。在这种情况下，我们不需要与事件对象进行交互。当事件发生时，监听器会增加计数，并使用\
  \ `setText` 方法重置标签的文本。\n\n请记住，我们不仅要为事件创建一个监听器，还要设置监听器与产生事件的组件之间的关系。要做到这一点，我们通过调用适当的方法将监听器添加到组件中。在\
  \ `PushCounterPanel` 构造函数中，我们调用了 `addActionListener` 方法，并传入一个新实例化的 `ButtonListener`\
  \ 对象。\n\n仔细检查这个示例，注意它是如何完成创建交互式 GUI 程序的三个关键步骤的：它创建并设置了 GUI 组件，为感兴趣的事件创建了相应的监听器，并设置了监听器与产生事件的组件之间的关系。\n\
  \n## 222\n# 第 4 章 编写类\n\n**自测题** *(答案见附录 N)*\n\nSR 4.32 推送按钮（一个 `JButton` 对象）产生什么种类型的事件？\n\
  \nSR 4.33 你将如何修改 `PushCounterPanel` 类，使其不再显示按钮被点击的次数，而是显示一个计数轨迹（trail）？点击一次后，显示\
  \ \"01\"；点击两次后，显示 \"012\"；点击五次后，显示 \"012345\"，以此此类推。\n\n## 4.9 文本字段\n\n让我们看看使用另一个组件的示例：文本字段。列表\
  \ 4.12 显示的华氏温度程序展示了一个包含文本字段的 GUI，用户可以在其中输入华氏度温度。当用户按下 Enter（回车）或 Return 键时，程序将显示等效的摄氏度温度。\n\
  \n华氏温度程序的界面在 `FahrenheitPanel` 类中设置。文本字段是 `JTextField` 类的对象。`JTextField` 构造函数接收一个整数参数，根据当前默认字体指定字段的字符数大小。\n\
  \n文本字段和各种标签被添加到面板中进行显示。\n\n请记住，面板由一个称为流布局（flow layout）的布局管理器管理，它会在一行中放置尽可能多的组件。因此，如果你调整了框架的大小，标签和文本字段的方向可能会发生变化。我们将在第\
  \ 7 章详细检查布局管理器，提供更多控制组件布局的选项。\n\n如果光标当前位于文本字段中，那么当按下 Enter 或 Return 键时，文本字段组件会产生动作事件。因此，我们需要设置一个监听器对象来响应动作事件。正如我们在上一节的\
  \ PushCounter 程序中所做过的，我们将监听器定义为实现 `ActionListener` 接口的内部类。\n\n当用户按下 Enter 键时，文本字段组件调用\
  \ `actionPerformed` 方法。该方法首先通过调用 `getText` 方法从文本字段获取文本，返回一个字符串。使用 `Integer` 包装类的\
  \ `parseInt` 方法将文本转换为整数。然后该方法执行计算以确定等效的摄氏度温度，并将结果设置在相应标签的文本中。\n\n注意，按钮和文本字段产生相同类型的事件：动作事件。因此，华氏温度程序设计的替代方案是在\
  \ GUI 中添加一个 `JButton` 对象，当用户使用鼠标按下按钮时触发转换。至于这一点，同一个监听器对象可以\n\n![](img/index-224_1.png)\n\
