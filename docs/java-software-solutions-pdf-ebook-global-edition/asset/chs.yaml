  \n---\n\n# 第 11 章 异常\n\n## 章节目标\n\n- 讨论异常的用途。\n- 检查异常消息和调用栈跟踪（call stack trace）。\n\
  - 检查用于处理异常的 `try-catch` 语句。\n- 探索异常传播的概念。\n- 描述 Java 标准类库中的异常类体系。\n- 探索 I/O 异常和写入文本文件的能力。\n\
  - 使用记忆（mnemonics）和工具提示（tool tips）创建 GUI。\n- 探索额外的 GUI 组件和容器。\n\n异常处理是面向对象软件系统的重要部分。异常代表程序中可能出现的问题或异常情况。Java\
  \ 提供了在异常发生时处理它们的各种方法。我们探索了用于定义异常的 Java 标准库类层次结构，以及定义自定义异常对象的能力。本章还讨论了处理输入输出时使用异常，并检查了一个写入文本文件的示例。本章的图形轨道（Graphics\
  \ Track）探索了 Swing 组件的一些特殊特性，以及一些额外的组件和容器。\n\n## 11.1 异常处理\n\n正如我们在其他部分简单讨论过的，Java\
  \ 程序中出现的问题可能会产生异常或错误。*异常*（exception）是一个定义了异常或错误情况的对象。异常由程序或运行时环境抛出，并在需要时被适当地捕获。*错误*（error）与异常类似，不同之处错误通常代表一种不可恢复的情况，且不应被捕获。Java\
  \ 定义了一组在程序执行期间可能发生的预定义异常和错误。\n\n由异常和错误表示的问题可能有各种根源。以下是导致抛异常的情况：\n\n- 尝试除以零。\n- 数组索引越界。\n\
  - 找不到指定的文件。\n- 请求的 I/O 操作无法正常完成。\n- 尝试跟从空引用。\n- 尝试执行违反某种安全措施的操作。\n\n这些只是几个例子。还有几十种针对非常特定情况的情况。\n\
  \n正如许多这些示例所示，异常可以代表一种真正的错误情况。但正如其名称所示，它们可能仅仅代表一种特殊情况。也就是说，异常可能代表在通常情况下不会发生的情况。异常处理被设定为处理此类情况的一种有效方式，特别是考虑到它们并不频繁发生。\n\
  \n在处理异常时我们有几种选择。程序可以设计以三种方式之一处理异常。它可以：\n\n- 完全不处理异常，\n- 在异常发生的地方处理异常，或\n- 在程序的其他点处理异常。\n\
  \n我们将在接后的章节中探索每种方法。\n\n## 自测题 *(答案见附录 N)*\n\n**SR 11.1** 错误和异常之间的区别是什么？\n\n**SR\
  \ 11.2** 抛出的异常可以通过哪些方式进行处理？\n\n\n\n\n如果程序完全没有处理异常，它将异常终止并产生一条描述发生了什么异常以及在何处产生的消息。与异常相关的信息通常对于追踪问题产生很有帮助。\n\
  \n让我们来看异常的输出。列表 11.1 所示的程序在尝试进行无效的算术运算时会抛出 `ArithmeticException`。\n\n在这种情况下，程序尝试除以零。\n\
  \n由于此程序中没有显式处理异常的代码，它在异常发生时会终止，并打印有关该异常的特定信息。请注意，程序中的最后一个 `println` 语句永远不会执行，因为异常先发生了。\n\
  \n### 列表 11.1\n\n```java\n//********************************************************************\n\
  // Zero.java Author: Lewis/Loftus\n//\n// 展示一个未捕获的异常。\n//********************************************************************\n\
  public class Zero\n{\n    //-----------------------------------------------------------------\n\
  \    // 故意除以零以产生异常。\n    //-----------------------------------------------------------------\n\
  \    public static void main(String[] args)\n    {\n        int numerator = 10;\n\
  \        int denominator = 0;\n        System.out.println(numerator / denominator);\n\
  \        System.out.println(\"This text will not be printed.\");\n    }\n}\n```\n\
  \n**输出**\n```\nException in thread \"main\" java.lang.ArithmeticException: / by\
  \ zero at Zero.main(Zero.java:17)\n```\n![](img/index-567_1.png)\n\n**566 第 11 章\
  \ 异常**\n\n异常输出的第一行指示抛出了什么异常，并提供有关为何抛出异常的信息。其余行是*调用堆栈跟踪*（call stack trace）；它们指示了异常发生的位置。在这种情况下，调用堆栈跟踪中只有一行，但取决于异常的来源，可能会有几行。第一条跟踪行指示了异常发生的方法、文件和行号。其他跟踪行（如果存在的话）指示了为了到达产生异常的方法而调用的其他方法。在这个程序中，只有一个方法，并且它产生了异常；因此，跟踪中只有一行。\n\
  \n通过调用正在抛出的异常类的方法，也可以获取调用堆栈跟踪信息。`getMessage()` 方法返回一个解释抛出异常的字符串。`printStackTrace()`\
  \ 方法打印调用堆栈跟踪。\n\n**自测复习题（见附录 N 中的答案）**\nSR 11.3 判断对错。请解释。\na. 异常和错误是同一件事。\nb. 尝试除以零会导致抛出异常。\n\
  c. 如果程序不处理抛出的异常，该异常将被忽略且什么都不会发生。\nd. 如果程序不处理异常，将产生与异常相关的消息。\ne. 调用堆栈跟踪显示了通向异常发生代码的方法调用序列。\n\
  \n## 11.3 try-catch 语句\n\n现在让我们检查当异常被抛出时，我们是如何捕获并处理它的。*try-catch 语句*识别可能抛出异常的语句块。跟随\
  \ `try` 块的*catch 子句*（catch clause）定义了如何处理特定类型的异常。一个 `try` 块可以关联多个几个 `catch` 子句。每个\
  \ `catch` 子句被称为*异常处理器*（exception handler）。\n\n当执行 `try` 语句时，会执行 `try` 块中的语句。如果在执行\
  \ `try` 块执行期间没有抛出异常，处理将继续执行 `try` 语句之后的语句（在所有 `catch` 子句之后）。这种情况是正常的执行流，并且大多数情况下都会发生。\n\
  \n![](img/index-568_1.png)\n\n**11.3 try-catch 语句 567**\n\n如果在执行 `try` 块期间的任何点抛出了异常，如果存在相应的\
  \ catch 处理器，控制将立即转移到那里。也就是说，控制将转移到第一个异常类与 `try` 块内抛出的异常相匹配的 `catch` 子句。在执行完 `catch`\
  \ 子句中的语句后，控制转移到整个 `try-catch` 语句之后的语句。\n\n让我们来看一个例子。假设一家公司使用代码来表示它的各种产品。产品代码除了其他信息外，还包括第十位的字符，代表制造该产品的区域，以及第\
  \ 4 到 7 位的四位整数，代表销售的地区。由于某些重组，来自 R 区域的产品被禁止在标记为 2000 或更高的地区销售。\n\n列表 11.2 所示的程序从用户处读取产品代码，并计算输入的被禁代码数量。\n\
  \n**try 语句**\n```\ntry 块\ncatch (类型 标识符) 块\nfinally 块\n```\n一个 `try` 语句包含一个代码块，后跟一个或多个\
  \ `catch` 子句。如果在 `try` 块中发生异常，将执行相应的 `catch` 子句的代码。如果存在 `finally` 子句，无论如何退出 `try`\
  \ 块，它都会被执行。\n\n**示例：**\n```java\ntry\n{\n    System.out.println(Integer.parseInt(numString));\n\
  }\ncatch (NumberFormatException exception)\n{\n    System.out.println(\"Caught an\
  \ exception.\");\n}\nfinally\n{\n    System.out.println(\"Done.\");\n}\n```\n\n\
  **568 第 11 章 异常**\n\n### 列表 11.2\n\n```java\n//********************************************************************\n\
  // ProductCodes.java Author: Lewis/Loftus\n//\n// 展示 try-catch 块的使用\n//********************************************************************\n\
  import java.util.Scanner;\n\npublic class ProductCodes\n{\n    //-----------------------------------------------------------------\n\
