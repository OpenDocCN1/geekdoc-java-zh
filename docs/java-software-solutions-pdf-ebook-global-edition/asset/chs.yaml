  \     int answer, guess;\n        Scanner scan = new Scanner(System.in);\n     \
  \   Random generator = new Random();\n        answer = generator.nextInt(MAX) +\
  \ 1;\n        System.out.print(\"I'm thinking of a number between 1 and \" + MAX\
  \ + \". Guess what it is: \");\n        guess = scan.nextInt();\n        if (guess\
  \ == answer)\n            System.out.println(\"You got it! Good guessing!\");\n\
  \        else {\n            System.out.println(\"That is not correct, sorry.\"\
  );\n            System.out.println(\"The number was \" + answer);\n        }\n \
  \   }\n}\n```\n\n**输出**\n我正在想一个 1 到 10 之间的数字。猜猜它是几：7\n不正确，抱歉。\n数字是 5\n\n## 5.2 if\
  \ 语句\n\n块语句（block statement）可以用于 Java 语法中任何需要调用单个语句的地方。例如，if-else 语句的 `if` 部分可以是一个块，或者\
  \ `else` 部分可以是一个块（正如我们在 `Guessing` 程序中看到的），或者两部分都是块语句。例如：\n\n```java\nif (boxes\
  \ != warehouse.getCount())\n{\n    System.out.println(\"Inventory and warehouse\
  \ do NOT match.\");\n    System.out.println(\"Beginning inventory process again!\"\
  );\n    boxes = 0;\n}\nelse\n{\n    System.out.println(\"Inventory and warehouse\
  \ MATCH.\");\n    warehouse.ship();\n}\n```\n\n在这个 if-else 语句中，`boxes` 的值将与通过调用\
  \ `warehouse` 对象的 `getCount` 方法获得的值（无论该值是什么）进行比较。如果它们不完全匹配，将执行两个 `println` 语句和一个赋值语句。如果它们完全匹配，则会打印一条不同的消息并调用\
  \ `warehouse` 的 `ship` 方法。\n\n### 嵌套 if 语句\n作为 `if` 语句结果执行的语句可以是另一个 `if` 语句。这种情况被称为\
  \ `嵌套 if`（nested if）。它允许我们在确定了上一个决定的结果后做出另一个决定。列表 5.6 中的程序名为 `MinOfThree`，它使用嵌套\
  \ `if` 语句来确定用户输入的三个整数值中的最小值。\n\n请仔细跟踪 `MinOfThree` 程序的逻辑，使用在三个位置上都具有最小值的各种输入集，用以观察它是如何确定最低值的。\n\
  \n嵌套 `if` 语句中出现了一个重要的情况。嵌套 `if` 之后的 `else` 子句似乎可以适用于任何一个 `if` 语句。例如：\n\n```java\n\
  if (code == 'R')\n    if (height <= 20)\n        System.out.println(\"Situation\
  \ Normal\")\n    else\n        System.out.println(\"Bravo!\");\n```\n\n**第 5 章**\
  \ 条件判断与循环\n\n### 列表 5.6\n```java\n//********************************************************************\n\
  // MinOfThree.java 作者: Lewis/Loftus\n//\n// 展示了嵌套 if 语句的使用。\n//********************************************************************\n\
  import java.util.Scanner;\n\npublic class MinOfThree {\n    //-----------------------------------------------------------------\n\
  \    // 从用户处读取三个整数并确定最小\n    // 的值。\n    //-----------------------------------------------------------------\n\
  \    public static void main(String[] args) {\n        int num1, num2, num3, min\
  \ = 0;\n        Scanner scan = new Scanner(System.in);\n        System.out.println(\"\
  Enter three integers: \");\n        num1 = scan.nextInt();\n        num2 = scan.nextInt();\n\
  \        num3 = scan.nextInt();\n        if (num1 < num2)\n            if (num1\
  \ < num3)\n                min = num1;\n            else\n                min =\
  \ num3;\n        else\n            if (num2 < num3)\n                min = num2;\n\
  \            else\n                min = num3;\n        System.out.println(\"Minimum\
  \ value: \" + min);\n    }\n}\n```\n\n**输出**\n输入三个整数：\n45 22 69\n最小值：22\n\n`else`\
  \ 子句是匹配到内部的 `if` 语句还是外部的 `if` **核心概念** 语句？此示例中的缩进意味着它是内部 `if` 语句的一部分，这是正确的。在嵌套 `if`\
  \ 语句中， `else` 子句始终匹配到其之前最近的、未匹配的 `if`。然而，如果我们不小心，很容易在脑海中对其产生错误匹配并导致缩进对齐错误。这也是为什么准确、一致的缩进至关重要的另一个原因。\n\
  \n可以使用大括号来指定 `else` 子句属于哪个 `if` 语句。例如，如果上一个示例应该构造为当 `code` 不等于 'R' 时打印字符串 \"Bravo!\"\
  ，我们可以如下强制建立这种关系（并正确缩进）：\n\n```java\nif (code == 'R')\n{\n    if (height <= 20)\n\
  \        System.out.println(\"Situation Normal\");\n}\nelse\n    System.out.println(\"\
  Bravo!\");\n```\n\n通过在第一个 `if` 语句中使用块语句，我们确立了 `else` 子句属于它。\n\n**自习题** *(答案见附录 N)*\n\
