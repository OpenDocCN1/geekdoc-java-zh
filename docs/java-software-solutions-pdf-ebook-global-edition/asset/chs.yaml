  \ || (!c1 && c2)`\n\n## 5.2 the if 语句\n\n在本章之前的示例中，我们已经使用了基础的 if 语句。现在让我们详细探索它。\n\
  \n一个 *if 语句*由关键字 `if` 后跟一个**核心概念**——布尔表达式，以及一个语句。条件被包含在括号内并必须求值为 true 或 false。如果条件为\
  \ true，则执行该语句并继续处理；可读性显示了一个语句与下一个语句之间的关系。如果条件为 false，该语句被跳过，并立即继续处理下一个语句。图 5.6 显示了这种处理过程。\n\
  \n考虑以下 if 语句的示例：\n\n```\nif (total > amount)\ntotal = total + (amount + 1);\n```\n\
  \n在这个示例中，如果 `total` 中的值大于 `amount` 中的值，则执行赋值语句；否则，跳过赋值语句。\n\n注意，示例中的赋值语句在 if 语句的标题行下方进行了缩进。这传达了赋值语句是\
  \ if 语句的一部分；它意味着 if 语句控制赋值语句是否会被执行。虽然这种缩进对于人类读者来说极其重要，但编译器会忽略它。\n\n**240**\n\n**第\
  \ 5 章** 条件判断和循环\n\ncondition\nevaluated\ntrue\nfalse\nstatement\n\n**图 5.6** if\
  \ 语句的逻辑\n\n列表 5.1 中的示例读取了用户的年龄，然后根据输入的年龄决定是否打印特定的句子。Age 程序在所有情况下都会回显输入的年龄值。如果年龄小于常量\
  \ `MINOR` 的值，则将打印关于青少年的语句。如果年龄大于或等于 `MINOR` 的值，则跳过 `println` 语句。在任何情况下，最后关于年龄是一种心态的句子都会被打印。\n\
