  \n# 第 7 章 对象面向设计\n\n## 7.1 软件开发活动\n\nSR 7.1 软件开发的四个基本活动是需求分析（决定程序应该做什么）、设计（决定如何做）、实现（用源代码编写解决方案）和测试（验证实现）。\n\
  \nSR 7.2 通常情况下，客户会提供一组初始需求或对他们想要解决的问题描述。软件开发人员的责任与客户合作，确保需求或问题陈述是正确且无歧义的。\n\nSR\
  \ 7.3 软件开发是一项解决问题的活动。因此，本节提出的四个基本开发活动与第 1.6 节中提出的五个通用解决问题步骤本质上是相同的，这并不意外。“建立需求”直接对应于“理解问题”。“设计解决方案”和“考虑替代设计”合在一起对应于“创建设计”——在软件的情况下，设计就是解决方案。最后，在这两种方法中我们都包含了“实现”和“测试”阶段。\n\
  \n## 7.2 识别类和对象\n\nSR 7.4 识别问题规范中的名词可以帮助你在开发问题的面向面向对象的解决方案时，识别出可能使用的类。规范中的名词通常对应于解决方案中应该表示的对象。\n\
  \nSR 7.5 在问题解决方案设计的早期阶段，识别并定义类将包含的所有方法并不是至关重要的。通常只需识别那些提供类主要职责的方法就足够了。当你演进并增加设计的细节时，根据需要向类中添加额外的方法。\n\
