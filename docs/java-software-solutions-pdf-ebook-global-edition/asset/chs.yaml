  ## 5.8 复选框与单选按钮\n## 277\n### 列表 5.13 *续*\n\n我们可以创建两个独立的监听器类，一个用于监听左按钮，另一个用于监听右按钮。在这种情况下，`actionPerformed`\
  \ 方法就不需要确定事件的源。是使用多个监听器还是在事件发生时确定事件源，是一个取决于具体情况的设计决。。\n\n请注意，这两个按钮被放在同一个名为 `buttonPanel`\
  \ 的面板上，该面板与 `LeftRightPanel` 类表示的面板是分开的。通过将两个按钮放在一个面板上，我们可以确保即使窗口以各种方式调整大小时，它们之间的视觉关系依然保持。对于标记为\
  \ `Left` 和 `Right` 的按钮，这可能非常重要。\n\n## 5.8 复选框和单选按钮\n由 `JButton` 类定义的推按钮只是我们可以在 Java\
  \ GUI 中使用的按钮类型。另外两种类型是复选框和单选按钮。让我们详细查看这些内容。\n\n### 复选框\n*复选框*（check box）是一种可以使用鼠标切换开启或关闭的按钮，表示特定的布尔条件是否被设置或取消。例如，标记为\
  \ `Collate`（装订）的复选框可能用于指示打印作业输出是否应该装订。尽管你可能有一组复选框表示一组选项，但每个复选框都是独立运行。也就是说，每个复选框都可以设置为开启或关闭，其中一个的状态不会影响其他。\n\
  \n列表 5.14 中的程序显示了两个复选框和一个标签。复选框决定了标签文本是以粗体、斜体、两者兼有还是都不带的方式显示。任何粗体和斜体的组合都是有效的。例如，两个复选框都可以被选中（开启），在这种情况下，文本将以粗体和斜体显示。如果两个都没有被选中，标签文本将以普通样式显示。\n\
  \n`StyleOptions` 程序的 GUI 体现在列表 5.15 显示的 `StyleOptionsPanel` 类中。复选框由 `JCheckBox`\
  \ 类表示。\n\n当复选框的状态从选中（勾选）变为未选中（未勾选），或反之时，它会产生一个*项目事件*（item event）。`ItemListener`\
  \ 接口包含一个名为 `itemStateChanged` 的方法。在这个示例中，我们使用同一个监听器对象来处理两个复选框。\n\n### 列表 5.14\n\
  ```java\n//********************************************************************\n\
