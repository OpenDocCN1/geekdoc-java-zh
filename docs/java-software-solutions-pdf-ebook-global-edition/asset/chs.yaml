  \ 11.4 异常传播\n\n如果异常在发生的地方没有被捕获和处理，控制将立即返回到调用产生异常的方法。我们可以设计软件，使异常在更外层级被捕获并处理。如果在那里没有被捕获，控制将返回到调用它的方法。这个过程被称为*异常传播*。这种传播会一直持续，直到异常被捕获并处理，或者它被传递到\
  \ `main` 方法之外，这将终止程序并产生异常消息。要在外层级捕获异常，产生异常的方法必须在具有处理异常的 `catch` 子句的 `try` 块内部被调用。\n\
  \n列表 11.3 所示的 `Propagation` 程序简明地演示了异常传播的过程。`main` 方法调用了 `ExceptionScope` 类中的 `level1`\
  \ 方法（参见列表 11.4），该方法调用了 `level2`，`level2` 调用了 `level3`，最后由 `level3` 产生了一个异常。`level3`\
  \ 方法没有捕获并处理该异常，因此控制传回了 `level2`。\n\n`level2` 方法也没有捕获并处理该异常，因此控制传回了 `level1`。由于 `level2`\
  \ 的调用是在 `try` 块中（在方法 `level1` 中）进行的，异常在该处被捕获并处理。\n\n请注意，输出并不包含指示 `level3` 和 `level2`\
  \ 方法正在结束的消息。这些 `println` 语句永远不会执行，因为发生了异常且异常尚未被捕获。然而，在 `level1` 方法处理异常后，处理将从正确的点继续进行，打印出表示方法\
  \ `level1` 和程序正在结束的消息。\n\n同样注意，处理异常的 `catch` 子句使用 `getMessage` 和 `printStackTrace`\
  \ 方法来输出这些信息。堆栈跟踪显示了异常发生时被调用的方法。\n\n572\n\n第 11 章：异常\n\n### 列表 11.3\n```java\n//********************************************************************\n\
  // Propagation.java 作者: Lewis/Loftus\n//\n// 演示异常传播。\n//********************************************************************\n\
  public class Propagation\n{\n    //-----------------------------------------------------------------\n\
  \    // 调用 level1 方法以开始异常演示。\n    //-----------------------------------------------------------------\n\
  \    public static void main(String[] args)\n    {\n        ExceptionScope demo\
  \ = new ExceptionScope();\n        System.out.println(\"Program beginning.\");\n\
  \        demo.level1();\n        System.out.println(\"Program ending.\");\n    }\n\
  }\n```\n\n**输出**\n```\nProgram beginning.\nLevel 1 beginning.\nLevel 2 beginning.\n\
