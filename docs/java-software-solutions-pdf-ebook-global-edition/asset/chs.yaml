  \ Java 中，所有参数都是*按值传递*的（by value）。也就是说，实际参数（在调用时）的当前值被复制到方法头中的形式参数中。我们在第 4 章中提到过这个问题；现在让我们详细地检查它。\n\
  \n本质上，参数传递就像赋值语句，将实际参数中存储的值赋值给形式参数。我们在第 4 章中提到过这个问题；在方法内部对形式参数进行更改时必须考虑这一点。形式参数是实际参数存储的值的副本，因此对它进行的任何更改对实际参数都没有影响。当返回到调用方法后，实际参数的值将与调用之前相同。\n\
  \n然而，当我们把对象传递给方法时，我们实际上传递的是该对象的引用。被复制的是对象的地址。因此，形式参数和实际参数变成了别名。如果我们在方法内部通过形式参数更改对象的状态，那么我们正在更改实际参数所引用的对象。相反，如果我们更改形式参数引用本身（例如使其指向新对象），我们并没有改变实际参数仍然指向原始对象的事实。\n\
