  \ + 2 (;`\nd. `result = ( 5 + 2 ( 4 ) );`\n\n## 2.5 数据转换\n\nSR 2.27 在执行以下一系列语句后，整数变量\
  \ `result` 包含什么值？\n\n```\nresult = 27;\nresult = result + 3;\nresult = result /\
  \ 7;\nresult = result * 2;\n```\n\nSR 2.28 在执行以下一系列语句后，整数变量 `result` 包含什么值？\n\n\
  ```java\nint base;\nint result;\nbase = 5;\nresult = base + 3;\nbase = 7;\n```\n\
  \nSR 2.29 什么是赋值运算符？\n\nSR 2.30 如果整数变量 `weight` 当前持有值 100，执行以下语句后，它的值是多少？请解释。\n\n\
  ```\nweight -= 17;\n```\n\n因为 Java 是一种强类型语言，每个数据值与特定类型相关。有时有助于或需要将一种类型转换为另一种类型，但我们必须注意不要丢失重要信息。例如，假设持有数字\
  \ 1000 的 `short` 变量转换为 `byte`。\n\n基本类型之间的转换分为两类：宽转换和窄转换。*宽转换*是最安全的，因为它们不会丢失信息。它们被称为宽转换，是因为它们从一种数据类型转换为另一个使用相同或更多存储空间的类型。图\
  \ 2.5 列出了 Java 的宽转换。\n\n例如，从 `byte` 转换为 `short` 是安全的，因为 `byte` 存储在 8 位，而 `short`\
  \ 存储在 16 位。没有信息丢失。所有从整数类型到另一种整数类型，或从浮点类型到另一种浮点类型的宽转换都能完整保留数值。\n\n尽管宽转换不会丢失关于数值大小的信息，但产生浮点值的宽转换可能会丢失精度。当从\
  \ `int` 或 `long` 转换为 `float`，或从 `long` 转换为 `double` 时，可能会丢失一些有效位。在这种情况下，得到的浮点值将是整数值的舍入版本，遵循\
  \ IEEE 754 浮点标准定义的舍入技术。\n\n*窄转换*比宽转换更有可能丢失信息。它们通常从一种类型转换为另一个存储值空间较小的类型，因此，部分信息可能会受到损害。窄转换可能会同时丢失数值大小和精度。因此，通常应该避免使用它们。图\
  \ 2.6 列出了 Java 的窄转换。\n\n窄转换中空间缩减情况有一个例外，当我们把 `byte`（8 位）或 `short`（16 位）转换为 `char`（16\
  \ 位）时。这些仍然是窄转换。\n\n\n\n\n\n`byte`, `short`, `char`, `int`, `long`, 或 `float`\n\n\
  **图 2.6** Java 窄类型转换\n\n## 2.5 数据转换\n\n**111** 被视为收窄类型转换，因为符号位被包含在新的字符中。由于字符值是无符号的，负整数将转换为一个与原始整数数值没有特定关系的字符。\n\
  \n请注意，在宽类型转换或收窄类型转换中均未提到布尔值（boolean values）。布尔值不能转换为任何其他原始数据类型，反之亦然。\n\n### 转换技术\n\
  \n在 Java 中，转换可以通过三种方式发生：\n\n- 赋值转换（assignment conversion）\n- 自动提升（promotion）\n-\
  \ 强制类型转换（casting）\n\n当将一种类型的值赋值给另一种类型的变量时，就会发生`赋值转换`，在此期间，值会被转换为新类型。只有宽类型转换可以通过赋值来完成。例如，如果\
  \ `money` 是一个 `float` 变量而 `dollars` 是一个 `int` 变量，那么下面的赋值语句会自动将 `dollars` 中的值转换为\
  \ `float`：`money = dollars;`\n\n因此，如果 `dollars` 包含值 `25`，赋值后，`money` 包含值 `25.0`。然而，如果我们尝试将\
  \ `money` 赋值给 `dollars`，编译器将发出错误信息，提醒我们正在尝试一种可能会丢失信息的收窄类型转换。如果我们真的想执行此赋值，就必须使用强制类型转换来显式地进行转换。\n\
  \n当某些运算符为了执行操作需要修改其操作数时，通过`自动提升`的转换会自动发生。例如，当一个名为 `sum` 的浮点值除以名为 `count` 的整数值时，在除法之前，`count`\
  \ 的值会自动提升为浮点值，从而产生浮点数结果：`result = sum / count;`\n\n当数字与字符串拼接时，也会发生类似的转换。该数字首先转换为（提升为）字符串，然后将两个字符串拼接在一起。\n\
  \n`强制类型转换`是 Java 中最通用的转换形式。如果 Java 程序中可以完成某种转换，就可以使用强制类型转换来实现。强制类型转换是一种 Java 运算符，由括号中的类型名称指定。它被放在\n\
  \n要转换的值之前。\n\n**112** **第 2 章** 数据与表达式\n\n例如，为了将 `money` 转换为整数值，我们可以在它前面加上强制类型转换：\n\
  \n`dollars = (int) money;`\n\n强制类型转换返回 `money` 中的值，并截断任何小数部分。如果 `money` 包含值 `84.69`，那么赋值后，`dollars`\
  \ 将包含值 `84`。但注意，强制类型转换不会改变 `money` 中的值。\n\n在赋值操作完成后，`money` 仍然包含值 `84.69`。\n\n在许多我们需要将一个值临时视为另一种类型的情下，强制类型转换非常有帮助。例如，如果我们想将\
  \ `total` 除以 `count` 并得到浮点数结果，我们可以这样做：\n\n`result = (float) total / count;`\n\n\
  首先，`float` 强制类型转换作用于 `total`。如果没有包含该强制转换，该操作将执行整数除法。\n\n**复习收窄转换**（见附录）\n\n识别以下各项是宽类型转换还是收窄类型转换：\n\
  \n- `int` 转换为 `long`\n- `double` 转换为 `int`\n- `float` 转换为 `double`\n- `short` 转换为\
  \ `int`\n- `byte` 转换为 `short`\n- `char` 转换为 `int`\n- `long` 转换为 `float`\n- `double`\
  \ 转换为 `long`\n- `short` 转换为 `char`\n- `int` 转换为 `char`\n- `float` 转换为 `int`\n- `byte`\
  \ 转换为 `char`\n\n给定以下赋值语句，结果是什么？\n\n```\nint x = 10.5f;\n```\n\n**2.6 交互式程序**\n\n\
  设计一个从用户那里交互式读取数据的程序通常是很有用的。\n\n### Scanner 类\n\n`Scanner` 类是 Java API 的一部分，提供了读取各种类型输入的方便方法。输入可能来自用户，也可能存储在文件中。Scanner\
  \ 类可以将字符串解析成片段。\n\n我们必须先创建一个 `Scanner` 对象才能调用其方法。对象使用 `new` 运算符创建。下面的声明创建一个从键盘读取的\
  \ `Scanner` 对象：\n\n```\nScanner scan = new Scanner(System.in);\n```\n\n该声明创建了一个代表\
  \ `Scanner` 对象的变量 `scan`。对象本身是由 `new` 运算符创建的。\n\n**114** **第 2 章** 数据与表达式\n\n`Scanner(InputStream\
  \ source)`\n`Scanner(File source)`\n`Scanner(String source)`\n构造函数：设置扫描器从指定的源扫描值。\n\
  \n`String next()`\n返回下一个令牌作为字符串。\n\n`String nextLine()`\n返回当前行的剩余输入作为字符串。\n\n`boolean\
  \ nextBoolean()`\n`byte nextByte()`\n`double nextDouble()`\n`float nextFloat()`\n\
  `int nextInt()`\n`long nextLong()`\n`short nextShort()`\n返回下一个令牌。如果令牌与类型不一致，则抛出\
  \ `InputMismatchException`。\n\n`boolean hasNext()`\n如果扫描器的输入中还有令牌，则返回 true。\n\n\
  `Scanner useDelimiter(String pattern)`\n`Scanner useDelimiter(Pattern pattern)`\n\
  设置扫描器的分隔符模式。\n\n`Pattern delimiter()`\n当前用于匹配分隔符的模式。\n\n`String findInLine(String\
  \ pattern)`\n`String findInLine(Pattern pattern)`\n尝试找到指定模式的下一次出现，忽略分隔符。\n\n**图\
  \ 2.7** Scanner 类的一些方法\n\n**2.6 交互式程序**\n\n**115**\n\n被称为“构造函数”，用于设置对象。`Scanner`\
  \ 构造函数接受一个指示输入源的参数。`System.in` 对象表示标准输入流，默认情况下是键盘。使用 `new` 运算符创建对象将在下一章详细讨论。\n\n\
  除非另有说明，`Scanner` 对象假设空白字符（空格字符、制表符和换行符）用于分隔输入元素（称为“令牌”）。这些字符被称为输入分隔符。如果输入令牌由非空白字符分隔，则可以更改分隔符集。\n\
  \n\n\n\n\n`Scanner` 类的下一个方法将下一个输入标记作为字符串读取并返回它。因此，如果输入由一系列用空格分隔的单词组成，则每次调用 `next()`\
  \ 都会返回下一个单词。`nextLine()` 方法读取所有输入，直到找到行尾，并将其作为一个字符串返回。\n\n如列表 2.8 所示的 `Echo` 程序简单地读取用户输入的一行文本，将其存储在一个持有字符字符串的变量中，然后将其回显到屏幕上。\n\
  \n`Echo` 类定义上面的 `import` 语句告诉程序，我们将在该程序中使用 `Scanner` 类。`Scanner` 类是 `java.util`\
  \ 类库的一部分。`import` 语句的使用将在第 3 章中进行进一步讨论。\n\n程序提供了多种 `Scanner` 方法，如 `nextInt()` 和\
  \ `nextDouble()`，用于读取特定类型的数据。如列表 2.9 所示的 `GasMileage` 程序将行驶的的里数作为整数读取，将消耗的燃料加仑作为双精度浮点数读取，然后计算油耗。\n\
  \n### 列表 2.8\n\n```java\n//********************************************************************\n\
  // Echo.java Author: Lewis/Loftus\n//\n// 演示如何使用 Scanner 类的 nextLine 方法\n// 从用户处读取字符串。\n\
  //********************************************************************\nimport java.util.Scanner;\n\
  \npublic class Echo\n{\n    //-----------------------------------------------------------------\n\
  \    // 从用户处读取一个字符字符串并打印。\n    //-----------------------------------------------------------------\n\
  \    public static void main(String[] args)\n    {\n        String message;\n  \
  \      Scanner scan = new Scanner(System.in);\n        System.out.println(\"Enter\
  \ a line of text:\");\n        message = scan.nextLine();\n        System.out.println(\"\
  You entered: \\\"\" + message + \"\\\"\");\n    }\n}\n```\n\n**输出**\nEnter a line\
  \ of text:\nSet your laser printer on stun!\nYou entered: \"Set your laser printer\
  \ on stun!\"\n\n正如你通过 `GasMileage` 程序的输出看到的，计算产生了一个精确到几位小数的浮点结果。在下一章中，我们将讨论帮助我们以各种方式格式输出的类，包括将浮点值四舍入到特定的小数位数。\n\
  \n### 列表 2.9\n\n```java\n//********************************************************************\n\
  // GasMileage.java Author: Lewis/Loftus\n//\n// 演示如何使用 Scanner 类来读取数值数据。\n//********************************************************************\n\
  import java.util.Scanner;\n\npublic class GasMileage\n{\n    //-----------------------------------------------------------------\n\
  \    // 根据用户输入的值计算燃油效率。\n    //-----------------------------------------------------------------\n\
  \    public static void main(String[] args)\n    {\n        int miles;\n       \
  \ double gallons, mpg;\n        Scanner scan = new Scanner(System.in);\n       \
  \ System.out.print(\"Enter the number of miles: \");\n        miles = scan.nextInt();\n\
  \        System.out.print(\"Enter the gallons of fuel used: \");\n        gallons\
  \ = scan.nextDouble();\n        mpg = miles / gallons;\n        System.out.println(\"\
  Miles Per Gallon: \" + mpg);\n    }\n}\n```\n\n**输出**\nEnter the number of miles:\
  \ 328\nEnter the gallons of fuel used: 11.2\nMiles Per Gallon: 29.28571428571429\n\
  \n`Scanner` 对象根据用于读取数据的方法以及用于分隔输入值的分隔符，一次处理一个输入标记。因此，根据实际情况，可以将多个值放在同一行输入中，也可以也可以跨越多行进行分隔。\n\
