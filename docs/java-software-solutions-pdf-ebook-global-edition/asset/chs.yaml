  \ && (count > MAX))\n    System.out.println(\"Completed.\");\n```\n\n什么情况下会执行 `println`\
  \ 语句？布尔变量 `done` 的值为真或假，非运算符会反转该值。`count` 的值要么大于 MAX 要不是。图 5.5 中的真值表分解了所有可能性。\n\n\
  `&&` 和 `||` 运算符的一个重要特性是它们是“短路的”（short-circuited）。也就是说，如果它们的左操作数足以`核心概念` 决定操作的布尔结果，则不评估右操作数。这种情况可能发生在两种运算符中，但对于\
  \ **a** 逻辑运算符通常用于构建复杂的条件。\n\n\n\n\n`!done && (count > MAX)`\n\nfalse\n\nfalse\n\n\
  true\n\nfalse\n\nfalse\n\ntrue\n\ntrue\n\ntrue\n\ntrue\n\nfalse\n\nfalse\n\nfalse\n\
  \ntrue\n\ntrue\n\nfalse\n\nfalse\n\n**图 5.5** 特定条件的不同原因的真值表。如果 `&&` 运算符的左侧操作数为 false，那么无论右侧操作数的值是什么，操作的结果都为\
  \ false。\n\n同样，如果 `||` 的左侧操作数为 true，那么无论右侧操作数的值是什么，操作的结果都为 true。\n\n有时你可以利用操作具有短路路特性的这一事实。\n\
  \n例如，在接下来的 if 语句的条件中，如果左侧操作数为 false，它将不会尝试除以零。如果 `count` 的值为 0，则 `&&` 操作的左侧为 false；因此，整个表达式为\
  \ false，右侧不会被求值。\n\n```\nif (count != 0 && total/count > MAX)\nSystem.out.println(\"\
  Testing.\");\n```\n\n你应该仔细考虑是否要依赖这些微妙的编程语言特性。并不是所有的编程语言工作方式都相同。正如我们之前强调的，你应该优先考虑可读性，而不是巧妙的编程技巧。始终让代码的任何读者都能清楚你的程序逻辑是如何工作的。\n\
