  );` // 打印 hello\n\nSR 1.23 你预测 Java 程序中下一行代码的结果是什么？\n// 打印 hello `System.out.println(\"\
  Hello\");`\n\nSR 1.24 下列哪些不是有效的 Java 标识符？为什么？\na. `RESULT`\nb. `result`\nc. `12345`\n\
  d. `x12345y`\ne. `black&white`\nf. `answer_7`\n\nSR 1.25 假设程序需要一个标识符来表示一个班测试成绩的总和。对于以下每个名称，说明每个是否是良好的标识符名称。解释你的答案。\n\
  a. `x`\nb. `scoreSum`\nc. `sumOfTheTestScoresOfTheStudents`\nd. `smTstScr`\n\nSR\
  \ 1.26 什么是空白符？它如何影响程序的执行？它如何影响程序的可读性？\n\n# 1.5 程序开发\n让程序运行涉及各种活动。程序必须用适当的编程语言（如\
  \ `Java`）编写。该程序必须被翻译成计算机可以执行的形式。在此过程的各个阶段都可能发生错误，并且必须予以。各种软件工具也可以用于帮助开发过程的所有部分。让我们详细探讨这些问题。\n\
  \n### 编程语言层级\n假设某人正在给朋友提供路线指南。这个人可以使用几种语言中的任何一种（如英语、俄语或意大利语）来解释这些路线。无论使用哪种语言解释，路线都是相同的，但表达路线的方式是不同的。\n\
  \n朋友必须能够理解使用的语言才能遵循路线。\n\n同样，可以通过许多编程语言之一（如 `Java`、`Ada`、`C`、`C++`、`C#`、`Pascal`\
  \ 和 `Smalltalk`）编写程序来解决问题。无论使用哪种语言，程序的目的都是相同的，但用于表达指令的特定语句以及这些指令的整体结构随语言而异。计算机必须能够理解这些指令才能执行它们。\n\
  \n编程语言可以分为四类。这些类别基本上反映了计算机语言的历史发展。\n\n- 机器语言\n- 汇编语言\n- 高级语言\n- 四代语言\n\n为了让程序在计算机上运行，它必须以计算机的机器语言表示。每种类型的\
  \ `CPU` 都有自己的语言。因此，我们无法在带有 `Intel` 处理器的 Dell PC 上运行专门为带有 `Sparc` 处理器的 Sun 工作站编写的程序。\n\
  \n每条机器指令只能完成一个简单的任务。例如，单条机器指令可能会将一个值复制到寄存器中，或将一个值与零进行比较。可能需要四条特定的 `CPU` 机器语言指令才能将两个数字相加并存储结果。然而，计算机每秒可以执行数百万这样的指令，因此可以快速执行许多简单命令来完成复杂任务。\n\
  \n机器语言代码是一系列二进制数字，对人类来说极难阅读和编写。最初，程序是通过开关或某些类似的枯燥方法输入计算机的。早期的程序员发现这些技术耗时且容易出错。\n\
  \n这些问题促成了汇编语言的使用，汇编语言用助记符代替二进制数字，助记符是代表命令或数据的短英语单词。对于程序员来说，处理单词比处理二进制数字容易得多。然而，汇编语言程序无法直接在计算机上执行。它必须首先翻译成机器语言。\n\
  \n通常，每条汇编指令都对应一条等效的机器指令。因此，与机器语言类似，每条汇编指令只完成一个简单的操作。尽管从程序员的角度来看，汇编语言是机器码的改进，但使用起来仍然很枯燥。汇编语言和机器语言都被认为是低级语言。\n\
  \n#### 高级语言\n今天，大多数程序员使用高级语言来编写软件。高级语言用类英语的短语表示，这使得高级语言更容易阅读和编写。单条高级语言编程语句就可以完成等同于许多——也许是数百条——机器指令的任务。“高级”一词是指编程语句的表达方式与最终执行的机器语言相差甚。\n\
  \n`Java` 是一种高级语言，`Ada`、`C++`、`Smalltalk` 以及其他许多语言也是如此。\n\n图 1.19 显示了高级语言、汇编语言和机器语言中的等效表达式。这些表达式将两个数字相加。示例中的汇编语言和机器语言针对特定的\
  \ `Sparc`处理器。\n\n```\na + b\n1d [%fp–20], %o0\n1d [%fp–24], %o1\nadd %o0, %o1, %o0\n\
  1101 0000 0000 0111\n...（图 1.19 中所示的二进制代码）\n```\n\n图 1.19 中的高级语言表达式对程序员来说是可读且直观的。它类似于代数式。等的汇编代码具有可读性，但更冗长且不直观。机器语言基本上不可读，且长得多。事实上，图\
  \ 1.19 中仅显示了两个数字相加的二进制机器码的一小部分。该特定表达式的完整机器语言代码超过 400 位。\n\n高级语言使程序员不需要了解他们正在工作的处理器的底层机器语言。但高级语言代码必须被翻译成机器语言才能执行。\n\
  \n\n\n\n某些编程语言被认为运行在比高级语言更高的层次上。它们可能包含自动生成报告或与数据库交互的特殊功能。这些语言被称为`第四代语言`，或简单称为 `4GLs`，因为它们遵循了计算机编程的前三代：机器语言、汇编语言和高级语言。\n\
  \n# 1.5 程序开发\n\n**图 1.20** 编辑和运行程序\n- 编辑并保存程序\n- 将程序翻译成可执行形式\n- 执行程序并评估结果\n- 错误\n\
  \n### 编辑器、编译器和解释器\n需要几个特殊用途程序来帮助开发新程序的流程。它们有时被称为软件工具，因为它们被用于构建程序。基础软件工具的示例包括`editor`（编辑器）、`compiler`（编译器）和`interpreter`（解释器）。\n\
  \n，当你向计算机输入程序并将其存储在文件中时，你会使用`editor`。有很多不同的编辑器，具有许多不同的功能。你应该熟悉你经常使用的编辑器，因为它会极大地影响你输入和修改程序的速度。\n\
  \n图 1.20 显示了程序开发过程的基本视图。在编辑并保存程序后，你尝试将其从高级代码翻译成可以执行的形式。这种翻译可能会导致错误，在这种情况下，你需要返回`editor`对代码进行修改以修复问题。\n\
  \n一旦翻译成功，你就可以执行程序并评估结果。如果结果不是你想要的，或者你想增强现有的程序，你再次返回`editor`进行修改。\n\n将源代码翻译成针对特定类型\
  \ CPU 的（最终）机器语言可以通过多种方式进行。`compiler`是一个将一种语言的代码翻译成另一种语言等等代码的程序。原始代码被称为`source code`（源代码），被翻译到的语言被称为`target\
  \ language`（目标语言）。对于许多传统编译器，源代码被直接翻译成特定的机器语言。在这种情况下，翻译过程发生一次，生成的可执行程序可以在任何使用该类型\
  \ CPU 的计算机上运行。\n\n`interpreter`与编译器类似，但有一个重要的区别。`interpreter`将翻译和执行活动交织在一起。源代码的一部分（例如一条语句）被翻译并执行。然后另一条语句被翻译并执行，依此类推。这种技术的一个优点是它消除了单独编译阶段的需求。然而，程序运行速度通常较慢，因为翻译过程发生在每次执行期间。\n\
  \n**图 1.21** Java 翻译和执行过程\n- Java 源代码\n- Java 编译器\n- Java 字节码\n- Java 虚拟机 (JVM)\n\
  \n**核心概念**\n通常用于翻译和执行 Java 程序的流程结合了编译器和解释器的使用。这一过程如图 1.21 所示。Java `compiler`将`Java\
  \ source code`翻译成`Java bytecode`（Java 字节码），这是一种低级的、体系无关的程序表示，形式类似于机器语言代码的低级形式。称为`Java\
  \ Virtual Machine`（`JVM`）的 Java `interpreter`执行`Java bytecode`。\n\n`Java bytecode`与真正的机器语言代码之间的区别在于`Java\
  \ bytecode`不绑定到任何特定的处理器类型。这种方法的明显优势是使 Java 具有`架构无关性`，因此可以从从一种机器类型移植到另一种。唯一的限制是每台机器上都必须有一个`JVM`。\n\
  \n由于编译过程将高级`Java source code`翻译成低级表示，`JVM`的解释过程比直接解释高级代码要高效得多。通过解释其`bytecode`来执行程序仍然比直接执行机器代码慢，但对于大多数应用程序来说已经足够快了。\n\
  \n### 开发环境\n软件`development environment`（开发环境）是创建、测试和修改程序的工具集。某些开发环境是免费的，而另一些具有高级功能的环境必须购买。某些环境被称为`集成开发环境`（`IDEs`），因为它们将各种工具集成到一个软件程序中，并提供方便的图形用户界面。\n\
  \n任何开发环境都会包含某些关键工具，例如 Java `compiler`和解释器。某些将包含`debugger`（调试器），它可以帮助你发现程序中的错误。可能包含的工具还包括文档生成器、归档工具以及帮助你可视化程序结构的工具。\n\
  \nJava 标准版的下载包中包含了 Java `Software Development Kit`（`SDK`，Java 开发工具包），它有时被简单地称为`Java\
  \ Development Kit`（`JDK`）。Java `SDK`包含了让 Java 程序运行所需的内核开发工具，但它不是一个集成环境。编译和解释的命令在命令行执行。。，`SDK`没有\
  \ GUI（图形用户界面）。它也不包含编辑器，尽管任何可以将文档保存为纯文本的编辑器都可以使用。\n\n最流行的 Java IDE 之一是`Eclipse`（见\
  \ www.eclipse.org）。Eclipse 是`open source`（开源）项目，这意味着它是由广泛的程序员开发的，并且免费提供。其他流行的 Java\
  \ IDE 包括`jEdit` (www.jedit.org)、`DrJava` (drjava.sourceforge.net)、`jGRASP` (www.jgrasp.com)\
  \ 和 `BlueJ` (www.bluej.org)。\n\n还有其他各种 Java 开发环境。网络搜索可以发现几十种。选择使用哪种开发环境是非常重要的。你对环境能力的了解越多，你编写\
  \ Java 程序的效率就越高。\n\n### 语法和语义\n每种编程语言都有其独特的`syntax`（语法）。语言的`syntax`规则规定了语言的词汇元素具体如何组合成语句。为了创建程序，必须遵循这些规则。我们已经讨论了几个\
  \ Java `syntax` 规则。例如，标识符不能以数字开头是一个`syntax rule`。使用大括号开始和结束类和方法也是`syntax rule`。附录\
  \ L 正式定义了 Java 编程语言的基本`syntax rules`，并在文中强调了特定的规则。\n\n在编译期间，会检查所有的`syntax rules`。如果程序语法不正确，编译器将发出错误信息且不产生字节码。编程语言中语句的`semantics`（语义）定义了执行该语句时会发生什么。编程语言通常\n\
  \n\n\n无歧义性，意味着程序的语义是良好定义的。也就是说，每条语句都有且仅有一种解释。另一方面，人类用于交流的自然语言（如英语和意大利语）充满了歧义性。一个句子往往可以有两种或多种不同的含义。例如，考虑以下句子：Time\
  \ flies like an arrow.（光阴如箭。）\n\n普通人可能会将这句话解释为一个通用的 `KeY COnCept` 观察结果：时间移动得很快，正如箭头的\
  \ Syntax 规则规定了它快速移动的形式一样。然而，如果我们将 `time` 一词解释为动词（正如程序中，语义决定了程序语句的含义，“跑 50 米冲刺，我为你计时”），并将\
  \ `flies` 一词解释为名词（fly 的复数），那么解释就完全改变了。我们知道箭是不会给某物体计时的，所以我们通常不会那样解释这个句子，但这确实是句子中词汇的一种有效解释。计算机在试图确定想要哪种含义时会非常困难。此外，这个句子可能描述一种被称为“时间蝇”的奇特昆虫的偏好，这种昆虫可能出现在射箭场附近。毕竟，果蝇喜欢香蕉。\n\
  \n问题的点在于，一个特定的英语句子可以有多个有效的含义。编程语言不允许此类歧义性的存在。如果一条编程语言指令可以有两个不同的含义，计算机将无法确定应该执行哪一个。\n\
  \n### 错误\n\n软件中可能会发生几种不同的问题，特别是在程序开发期间。“计算机错误（computer error）”一词经常被误用，其含义随情况而异。从用户的角度来看，在与机器交互时发生的任何故障都可以称为计算机错误。例如，假设你用信用卡支付了一个价值\
  \ 23 美元的物品，但当你收到账单时，该物品列出的价格是 230 美。在你解决问题后，信用卡公司对“计算机错误”表示了。是计算机随机在数字末尾添加了一个零，还是它可能将该值乘以了\
  \ 10？当然不是 `KeY COnCept`。计算机遵循我们给它的命令，并根据我们提供的数据进行操作。如果我们的程序是错误的或数据是不准确的，我们就不能期望结果是正确的。描述这种情况的常用短语是“垃圾进，垃圾出（garbage\
  \ in, garbage out）”。\n\n在开发程序时，你会遇到三种错误：\n\n- 编译时错误（compile-time error）\n- 运行时错误（run-time\
  \ error）\n- 逻辑错误（logical error）\n\n![](img/index-70_1.png)\n\n# 1.5 程序开发\n\n**69**\n\
  \n编译器检查你是否使用了正确的语法。如果你有任何不符合语言语法规则的语句，编译器将产生 `syntax error.`（语法错误）。否则编译器不会产生字节码。编译器还会尝试寻找其他问题，例如使用不完整的数据类型。语法在技术上可能是正确的，但你可能正在尝试某些语言语义上不允许的操作。编译器识别的任何错误被称为\
  \ `compile-time error.`（编译时错误）。如果发生编译时错误，就不会创建程序的可执行版本。\n\n第二类问题发生在程序执行期间。它被称为 `run-time\
  \ error`（运行时错误），并会导致程序异常终止。例如，如果我们尝试除以零，程序将“崩溃”并在该处停止执行。由于请求的操作是未定义的，系统将直接放弃继续处理你的程序的尝试。最好的程序是\
  \ `robust`（健壮的）；也就是说，它们尽可能地避免所有的运行时错误。例如，程序代码可以防止除以零的可能性，并在发生这种情况时恰当地处理。在 Java 中，许多运行时问题被称为\
  \ `exceptions`（异常）。各种异常错误类型的示例，它们可以被捕获并进行相应的处理。\n\n第三类软件问题是 `logical error.`（逻辑错误）。在这种情况下，软件可以编译并执行而没有任何报错，但它产生了错误的结果。例如，当计算值错误或图形按钮没有出现在正确的位置时，就会发生逻辑错误。程序员必须彻底测试程序，将预期结果与实际发生的结果进行比较。\n\
  \n当发现缺陷时，必须追溯到代码中的问题源并进行。在程序中发现并修正缺陷的过程被称为 `debugging.`（调试）。逻辑错误可以通过许多方式表现出来，实际根源可能很难发现。\n\
