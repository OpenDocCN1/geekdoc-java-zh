  彩色图片被划分为像素，就像黑白图片一样。\n\n然而，由于每个像素可以是许多可能颜色中的一种，因此仅用一个位（bit）来表示每个像素是不够的。表示像素颜色有多种方法。让我们简要讨论一种流行的技术。\n\
  \n每种颜色都可以表示为三种原色**核心概念**的混合\n\n*颜色*：红、绿、蓝。在 Java 中，与许多其他计算机语言中一样，颜色由三个数字指定，这三个 RGB\
  \ 值——即代表原色贡献的三个值——统称为 *RGB 值*。RGB 代表红（Red（绿--））。每个数字代表一种原色的贡献。使用一个字节（八位）来存储这三个数字中的每一个，数字的范围可以从\
  \ 0 到 255。每种原色的水平决定了整体颜色。例如，红色和绿色的高值结合低水平的蓝色会产生一种黄色。\n\n### 颜色对象与 RGB 值\n\n| 颜色\
  \ | 对象 | RGB 值 |\n| :--- | :--- | :--- |\n| 黑色 black | `Color.black` | 0, 0, 0 |\n\
  | 蓝色 blue | `Color.blue` | 0, 0, 255 |\n| 青色 cyan | `Color.cyan` | 0, 255, 255 |\n\
  | 灰色 gray | `Color.gray` | 128, 128, 128 |\n| 深灰色 dark gray | `Color.darkGray` |\
  \ 64, 64, 64 |\n| 浅灰色 light gray | `Color.lightGray` | 192, 192, 192 |\n| 绿色 green\
  \ | `Color.green` | 0, 255, 0 |\n| 品红色 magenta | `Color.magenta` | 255, 0, 255 |\n\
  | 橙色 orange | `Color.orange` | 255, 200, 0 |\n| 粉色 pink | `Color.pink` | 255, 175,\
  \ 175 |\n| 红色 red | `Color.red` | 255, 0, 0 |\n| 白色 white | `Color.white` | 255,\
  \ 255, 255 |\n| 黄黄色 yellow | `Color.yellow` | 255, 255, 0 |\n\n**图 2.10** `Color`\
