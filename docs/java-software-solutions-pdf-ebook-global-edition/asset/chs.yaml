  ## printf 方法\n\n除了 `print` 和 `println` 之外，`System` 类还有另一个名为 `printf` 的输出方法，它允许用户打印包含数据值的格式化字符串。方法的第一个参数表示格式字符串，其余参数指定插入到格式字符串中的值。\n\
  \n例如，下面行代码打印了 ID 号和名称：`System.out.printf(\"ID: %5d\\tName: %s\", id, name);`。第一个参数指定输出的格式，并包含标记输出值的字面量字符以及转义字符（如\
  \ `\\t`）。\n\n模式 `%5d` 表示相应的数值（`id`）应在五个字符的字段中打印。模式 `%s` 匹配字符串参数\n\n162\n\n### 列表\
  \ 3.5\n\n```java\n//********************************************************************\n\
  // CircleStats.java 作者: Lewis/Loftus\n//\n// 展示了如何使用 DecimalFormat 类对小数进行格式化。\n\
  //********************************************************************\nimport java.util.Scanner;\n\
  import java.text.DecimalFormat;\n\npublic class CircleStats\n{\n//-----------------------------------------------------------------\n\
