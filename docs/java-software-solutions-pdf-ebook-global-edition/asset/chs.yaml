  \n## 11.10 分割面板 (Split Panes)\n\nSR 11.29 分隔条将分割面板划分为不同的右/左或上/下部分。这些条可以被拖动以使一部分变大而另一部分变小，以便用户可以控制他们看到的内容。\n\
