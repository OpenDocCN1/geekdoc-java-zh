  \n**多态—polymorphism—** 一种面向对象的技术，通过一个调用方法的引用可以在不同时间调用不同的方法。所有的 Java 方法调用都可能是多态的，因为它们调用的是对象类型而非引用类型的方法。\n\
  \n**可移植性—portability—** 程序无需更改即可移动到另一个硬件平台的能力。由于 Java 字节码与特定的硬件环境无关，Java 程序被认为是可移植的。*参见*\
  \ 架构中立。\n\n**处理流—processing stream—** 一种对流中的数据进行某种操作的 I/O 流。有时称为过滤流。\n\n**正无穷—positive\
  \ infinity—** 一种特殊的浮点值，表示“最高可能”的值。*参见* 负无穷。\n\n**可打印字符—printable characters—** 任何具有可以在显示器上显示或打印机上打印的符号表示的字符。*参见*\
  \ 不打印字符。\n\n**程序—program—** 由硬件按顺序执行的一系列指令。\n\n**嵌套 if 语句—nested if statement—**\
