  \ 中。\n\n### 2. 图形\n\n图形在计算机系统中起着至关重要的作用。在本书中，我们探索了图形的各个方面并讨论了如何实现它们。事实上，每章的最后一两个部分都致力于图形主题。我们将此称为贯穿本书的*图形轨道*（Graphics\
  \ Track）。这些章节可以跳过而不影响后续正文的连贯性，也可以整合到章节的**核心概念**（Key Concept）常规流程中，或者作为一个整体进行探索。\n\
  \n图形数据由图像表示，就像计算机上存储的所有其他信息一样，它必须通过将其拆分为许多部分并将这些部分表示为数字来数字化。在图片的情况下，我们将图片拆分为*像素*（pixels，即图像元素）。像素是代表图片中极小部分的微小区域。整个图像通过存储每个独立像素的颜色来存储。\n\
  \n数字化的图像可以在需要时通过重新组合像素来重现。表示图像的像素越多，重现时看起来就越真实。表示图像的像素数量被称为*图像分辨率*（picture resolution）。显示器可以显示的像素数量被称为*显示器分辨率*（monitor\
  \ resolution）。黑白图片可以使用单个位来表示每个像素并存储。如果位为 0，该像素为白色；如果位为 1，则为黑色。图 2.8 显示了一幅数字化存储的黑白图片以及该图片的局部放大，显示了单个像素。\n\
  \n### 坐标系\n\n绘制时，图片的每个像素都会映射到显示器屏幕上的像素。每个计算机系统和编程语言都定义了一个坐标系，以便引用特定的像素。传统的二维笛卡尔坐标系有两个交于原点的轴。轴上的值可以是正数也可以是负数。Java\
  \ 编程语言有一个相对简单的坐标系，其中所有可见坐标都是正数。\n\n正如我们在之前的示例中看到的，如果存在，程序中的每个图形组件都有其 x-y 坐标。任何 Java\
  \ 绘制区域的左上角均为 (0, 0)。*x*-轴坐标向右移动而增大，而*y*-轴坐标向下移动而增大。图 2.9 比较了传统的坐标系和 Java 坐标系。\n\n\
