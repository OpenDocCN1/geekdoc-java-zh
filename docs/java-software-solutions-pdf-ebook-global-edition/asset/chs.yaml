  \ `showOptionDialog` 方法来创建结合了三种基本格式特征的对话框，以实现更复杂的交互。\n\n320\n\n第 6 章 更多条件语句和循环\n\
  \n### 关键概念总结\n\n*   `switch` 语句将字符或整数值匹配到多个可能情况之一。\n*   `break` 语句通常用于 `switch`\
  \ 语句中每个 `case` 变体的末尾。\n*   条件运算符根据布尔条件求值为两个可能值之一。\n*   `do` 语句至少会执行一次其循环体体。\n* \
  \  `for` 语句通常用于执行固定次数的循环。\n*   `for-each` 版本的 `for` 循环简化了对 `Iterable` 对象中所有元素的处理。\n\
  *   循环语句在功能上是对等的。使用哪种取决于情况。\n*   对话框是一种弹出窗口，允许简短、特定的用户交互以提供信息或验证操作。\n\n**练习**\n\n\
