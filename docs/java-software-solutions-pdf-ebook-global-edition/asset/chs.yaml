  \n**按值传递—pass by value—** 复制一个值并将副本传递给方法的过程。因此，在方法内部对值进行的任何更改都不会反映在原始值上。所有 Java\
  \ 基本类型都是按值传递的。\n\n**运算符优先级—operator precedence—** 按照定义的层级结构，在表达式中运算符的求值顺序。\n\n**阶—order—**\
