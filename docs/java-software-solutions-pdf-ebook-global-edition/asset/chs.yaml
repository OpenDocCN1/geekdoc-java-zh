  \ 语句，使其输出与显示的内容完全相同（包括换行符和引号）。\n“I made this letter longer than usual because I\
  \ lack the time to make it short.”\nBlaise Pascal\n\n## 2.2 变量与赋值\n我们在程序中管理的大部分信息都由变量表示。让我们看看如何在程序中声明和使用它们。\n\
  \n### 变量\n变量（variable）是内存中用于存储数据值的位置的名称。变量声明指示编译器留出足够大的主内存空间，以容纳特定类型的值，并指定我们用来引用该位置的名称。\n\
  \n考虑列表 2.5 所示的 `PianoKeys` 程序。`main` 方法的第一行声明了一个名为 `keys` 的变量，该变量存储一个整数（`int`）值。该声明还为\
  \ `keys` 赋了一个初始值 `88`。如果没有为变量指定初始值，则该值是未定义的。如果你尝试在显式赋值之前使用变量，大多数 Java 编译器会给出错误或警告。\n\
  \n变量 `keys` 及其其值可以想象如下：`keys = 88`\n\n### 局部变量声明\n类型 | 变量声明符 | ; |\n| :--- | :---\
  \ | :--- |\n| `final` | `Identifier` = `Expression` `Array Initializer` | |\n\n\
  变量声明由一个 `Type` 后跟一个变量列表组成。每个变量都可以在声明中初始化为指定 `Expression` 的值。如果 `final` 修饰符位于声明之前，则标识符被声明为命名常量，其值一旦设定就无法更改。\n\
  \n**示例：**\n```java\nint total;\ndouble num1, num2 = 4.356, num3;\nchar letter =\
  \ 'A', digit = '7';\nfinal int MAX = 45;\n```\n\n### 列表 2.5\n```java\n//********************************************************************\n\
  // PianoKeys.java 作者: Lewis/Loftus\n//\n// 展示整数变量的声明、初始化和使用。\n//********************************************************************\n\
  public class PianoKeys\n{\n    //-----------------------------------------------------------------\n\
  \    // 打印钢琴按键的数量。\n    //-----------------------------------------------------------------\n\
  \    public static void main(String[] args)\n    {\n        int keys = 88;\n   \
  \     System.out.println(\"A piano has \" + keys + \" keys.\");\n    }\n}\n```\n\
  ### 输出\n```\nA piano has 88 keys.\n```\n在 `PianoKeys` 程序中，调用 `println` 方法时使用了两部分信息。第一个是字符串，第二个是变量\
  \ `keys`。当引用变量时，会使用当前存储在其中的值。\n\n因此，当执行 `println` 调用时，会获取 `keys` 的值，即 `88`。因为该值是一个整数，它会自动转换为字符串并与初始字符串拼接。拼接后的字符串被传递给\
  \ `println` 并打印。\n\n一个变量声明可以包含同一类型的多个变量。每个变量可以在声明时带有初始化值，也可以不带。例如：\n```java\nint\
  \ count, minimum = 0, result;\n```\n\n### 赋值语句\n让我们查看一个改变变量值的程序。列表 2.6 显示了一个名为 `Geometry`\
  \ 的程序。该程序首先声明了一个整数变量 `sides` 并将其初始化为 `7`。然后它打印 `sides` 的当前值。\n\n`main` 方法中的下一行改变了存储的值：`sides\
  \ = 10;`。这被称为*赋值语句*，因为它为变量分配值。执行时，赋值运算符（`=`）右侧的表达式被求值，结果存储在左侧变量指示的内存中。在这个例子中表达式简单的数字\
  \ `10`。我们将在下一节讨论更复杂的表达式。\n\n![](img/index-95_1.png)\n\n### 列表 2.6\n```java\n//********************************************************************\n\
  // Geometry.java 作者: Lewis/Loftus\n//\n// 展示使用赋值语句改变变量的值。\n//********************************************************************\n\
  public class Geometry\n{\n    //-----------------------------------------------------------------\n\
  \    // 打印几个几何形状的边数。\n    //-----------------------------------------------------------------\n\
  \    public static void main(String[] args)\n    {\n        int sides = 7;\n   \
  \     // 带有初始化的声明\n        System.out.println(\"A heptagon has \" + sides + \" sides.\"\
  ); sides = 10;\n        // 赋值语句\n        System.out.println(\"A decagon has \" +\
  \ sides + \" sides.\"); sides = 12;\n        System.out.println(\"A dodecagon has\
  \ \" + sides + \" sides.\");\n    }\n}\n```\n### 输出\n```\nA heptagon has 7 sides.\n\
  A decagon has 10 sides.\nA dodecagon has 12 sides.\n```\n变量只能存储一个其声明类型的值。新的**核心概念**值会覆盖旧值。在这种情况下，当将\
  \ `10` 分配给 `sides` 时，原始值 `7` 被覆盖并永久丢失。\n\n访问数据会保持其在内存中完整，但赋值语句会永久覆盖旧数据，如下：\n\n初始化后：\n\
  `sides = 7`\n\n第一次赋值后：\n`sides = 10`\n\n![](img/index-96_1.png)\n![](img/index-96_2.png)\n\
  \n### 基础赋值\n`Identifier` = `Expression`;\n\n基础赋值语句使用赋值运算符（`=`）将 `Expression` 的结果存储到指定的\
  \ `Identifier`（通常是变量）中。\n\n**示例：**\n```java\ntotal = 57;\ncount = count + 1;\nvalue\
  \ = (min / 2) * lastValue;\n```\n\n\n\n\n\n当引用一个变量时（例如打印它时），变量的值不会发生改变。这是计算机内存的本质：访问（读取）数据会保持内存中的值不变，但写入数据则会用新数据替换旧数据。\n\
  \nJava 语言是`强类型`（strongly typed），这意味着我们不允许`核心概念`（Key Concept）将与其声明类型不一致的值赋值给变量。我们不能将一种类型的值赋值给另一种类型。当你尝试编译程序时，组合不兼容的类型将产生错误。因此，赋值语句右侧的表达式必须出一个与左侧变量类型兼容的值。\n\
  \n### 常量\n\n有时，我们会使用在整个程序中保持不变的数据。例如，我们可能会编写一个处理容纳人数不超过 427 人的剧院的程序。给常量值赋予一个名称（例如\
  \ `MAX_OCCUPANCY`）比在整个代码中使用字面量（如 `427`）通常更有帮助。对于阅读代码的人来说，`427` 等字面值的目的和意义往往令人困惑。通过给该值命名，你可以帮助解释它在程序中的作用。\n\
  \n常量是标识符，与变量相似，不同之处在于它们在存在期间始终保持一个特定的值。\n\n### 核心概念\n\n用单词的字面意思来说，常量不是变量。\n- 常量在它们存在期间始终保持一个特定的值。\n\
  - 它们的值不会改变。\n\n在 Java 中，如果你在声明前面加上保留字 `final`，该标识符就会变成一个常量。按照惯例，在命名常量时使用大写字母以与普通变量区分开，并使用下划线分隔单个单词。例如，描述剧院最大容量人数的常量可以声明如下：`final\
  \ int MAX_OCCUPANCY = 427;`。\n\n如果你尝试在常量被赋予初始值后更改其值，编译器将产生错误信息。这是使用常量的另一个良好理由。常量可以防止无意的编码错误，因为更改其值的唯一合法位置是初始赋值。\n\
  \n使用常量的还有第三个良好理由。如果一个常量在整个程序中使用并且需要修改其值，那么你只需要在一个地方对其进行修改。例如，如果剧院的容量（因为装修）从 `427`\
  \ 变为 `535`，你只需要更改一个声明，所有对 `MAX_OCCUPANCY` 的使用都会自动反映这一变化。如果在代码中到处使用了字面量 `427`，则必须找到并更改每一个使用处。如果你遗漏了任何对字面值的使用，问题肯定会产生。\n\
