  \ 方法的作用是什么？\n\n## 11.7 工具提示和助记符（Mnemonics）\n\n让我们来看一些可以应用于任何 Swing 组件的特殊功能。适当应用这些功能可以增强用户界面并方便组件的使用。本节描述了工具提示（tool\
  \ tips）和助记（mnemonics）的使用，以及禁用组件的能力，然后探讨了一个使用这些功能的示例。\n\n任何 Swing 组件都可以分配一个 `tool\
  \ tip`（工具提示），其**核心概念**是：当光标短暂停留在组件上方时，会显示的一行短文本。工具提示和助记可以增强组件的功能，告知用户组件的信息，例如按钮在图形用户界面中的目的。\n\
  \n可以使用 Swing 组件的 `setToolTipText` 方法分配工具提示。例如：\n\n```\nJButton button = new JButton(\"\
  Compute\");\nbutton.setToolTipText(\"Calculates the area under the curve.\");\n\
  ```\n\n![](img/index-585_1.png)\n\n**584**\n### 第 11 章 异常\n\n当按钮被添加到容器并显示时，它会正常显示。当用户将鼠标指针悬停在按钮上并短暂停留时，工具提示文本就会弹出。当用户将鼠标指针移出按钮时，工具提示文本就会消失。\n\
  \n`mnemonic`（助记）是一个字符，允许用户在使用鼠标的同时还可以使用键盘按下按钮或做出菜单选择。例如，当为按钮定义了助记后，用户可以按住 `ALT`\
  \ 键并按下助记字符来激活按钮。使用助记激活按钮时，系统的行为将与用户使用鼠标按下按钮完全相同。\n\n助记字符应该从按钮或菜单项的标签中选择。一旦使用 `setMnemonic`\
  \ 方法建立了助记，标签中的该字符将会有**下划线**，以指示它可以被作为快捷键使用。\n\n如果选择的字母不在标签中，则没有任何字符会被加上下划线，用户将不知道如何使用快捷键。你可以按照以下方式设置助记：\n\
  \n```\nJButton button = new JButton(\"Calculate\");\nbutton.setMnemonic('C');\n\
  ```\n\n当按钮显示时，`Calculate` 中的字母 `C` 在按钮标签上会有下划线。当用户按下 `ALT-C` 时，按钮会被激活，就像用鼠标按下它一样。\n\
  \n如果某些组件不应该被使用，可以将其 `disabled`（禁用）。被禁用的组件将显示为“灰色”，如果用户尝试与其交互将不会发生任何事情。要禁用和启用组件，我们调用组件的\
  \ `setEnabled` 方法，传递一个布尔值来指示该组件应该是禁用（`false`）还是启用（`true`）。例如：\n\n```\nJButton button\
  \ = new JButton(\"Do It\");\nbutton.setEnabled(false);\n```\n\n当用户不应使用组件的功能时，禁用组件是一个好主意。禁用组件的灰色外观表明在当前情况下使用该组件是不合适的（事实上也是不可能的）。禁用组件不仅能告知用户哪些操作是合适的，哪些是不合适的，还能防止错误情况的发生。\n\
  \n让我们来看一个使用工具提示、助记和禁用组件的示例。`Listing 11.8` 中的程序展示了一个灯泡的图像，并提供了一个开启灯泡的按钮，以及在开启不合适时一个关闭灯泡的按钮。\n\
