  在十进制中，我们仅用一个数字来表示 `0` 到 `9` 的值。为了表示任何大于 `9` 的值，我们必须使用多个数字。每个数字的位置都有一个`位值`（place\
  \ value），它表示该数字对总数值的贡献。在十进制中，我们称之为个位、十位、百位，以此类推。\n\n## 691\n## 692\n\n## 附录 b 进制系统\n\
  \n**位值：** `10³`\n`10²`\n`10¹`\n`10⁰`\n\n**十进制数：**\n8\n4\n2\n7\n\n**十进制数：**\n`8 *\
  \ 10³ + 4 * 10² + 2 * 10¹ + 7 * 10⁰ =`\n`8 * 1000 + 4 * 100 + 2 * 10 + 7 * 1`\n\
  `= 8427`\n\n**图 b.1** 十进制系统中的位值。每个位值由数字系统的`基`（base）决定，从右向左移动时幂次逐渐增加。在十进制系统中，最右侧数字的位值是\
  \ `10⁰`，或 `1`。下一个数字的位值是 `10¹`，或 `10`。从右起第三个数字的位值是 `10²`，或 `100`，以此类推。图 B.1 显示了十进制中的每个数字是如何贡献数值的。\n\
  \n二进制系统的工作原理相同，只是我们会更快用尽可用的数字。我们可以用一个位表示 `0` 和 `1`，但为了表示任何大于 `1` 的值，我们必须使用多个位。\n\
  \n二进制中的位值是由从右向左基数的增加幂次决定的，这与十进制系统相同。然而，在二进制中，基值为 `2`。因此，最右侧位的位值是 `2⁰`，或 `1`。下一个位的位值是\
  \ `2¹`，或 `2`。从右起第三个位的位值是 `2²`，或 `4`，以此类推。图 B.2 显示了一个二进制数及其位值。\n\n数字 `1101` 是一个有效的二进制数，但它也是一个有效的十进制数。有时为了清楚正在使用的是哪种数字系统，**位值：**\n\
  \n`2³`\n`2²`\n`2¹`\n`2⁰`\n\n**二进制数：**\n1\n1\n0\n1\n\n**十进制数：**\n`1 * 2³ + 1 * 2²\
  \ + 0 * 2¹ + 1 * 2⁰ =`\n`1 * 8 + 1 * 4 + 0 * 2 + 1 * 1`\n`= 13`\n\n**图 b.2** 二进制系统中的位值\n\
  \n## 附录 b 进制系统\n## 693\n\n基值作为下标附加在数字的末尾。因此，你可以区分 `1101²`（它在十进制中等同于 `13`）和 `110110`（千一百一十），后者在二进制中表示为\
  \ `10001001101²`。\n\n基为 `N` 的数字系统有 `N` 个数字（`0` 到 `N−1`）。正如我们所看到的，十进制系统有 10 个数字（`0`\
  \ 到 `9`），二进制系统有两个数字（`0` 和 `1`）。它们的工作原理都是相同的。例如，五进制系统有五个数字（0 到 4）。\n\n注意，在任何数字系统中，最右侧数字的位值都是\
  \ `1`，因为任何基数的 0 次幂都是 `1`。还要注意，数值 `10`（在十进制中我们称之为“十”）在任何数字系统中始终代表该系统的基值。在 10 进制中，`10`\
  \ 是一个 `10` 和零 `1`。在 2 进制中，`10` 是一个 `2` 和零 `1`。在 5 进制中，`10` 是一个 `5` 和零 `1`。\n\n##\
  \ 大于 10 的基\n\n由于所有基为 `N` 的数字系统都有 `N` 个数字，因此 16 进制有 16 个数字。\n\n但它们是什么呢？我们习惯了 `0`\
  \ 到 `9` 的数字，但在大于 10 的基中，我们需要一个单一数字、一个符号来表示十进制值 10。\n\n事实上，在也称为`十六进制`（hexadecimal）的\
  \ `base 16` 中，我们需要表示十进制值 10 到 15 的数字。\n\n对于大于 10 的数字系统，我们使用字母作为大于 `9` 数值的单一数字。十六进制数字为\
  \ `0` 到 `F`，其中 `0` 到 `9` 代表前 10 个数字，`A` 代表十进制值 10，`B` 代表 11，`C` 代表 12，`D` 代表 13，`E`\
  \ 代表 14，`F` 代表 15。\n\n因此，数字 `2A8E` 是一个有效的十六进制数。位值的确定方法与十进制和二进制相同，使用基数的增加幂次。因此，在十六进制中，位值是通过基数的增加幂次确定的。图\
  \ B3 显示了十六进制数中的每个数字是如何贡献数值的。\n\n**位值：**\n`16³`\n`16²`\n`16¹`\n`16⁰`\n\n**十六进制数：**\n\
  2\nA\n8\nE\n\n**十进制数：**\n`2 * 16³ + A * 16² + 8 * 16¹ + E * 16⁰ =`\n`2 * 4096 +\
  \ 10 * 256 + 8 * 16 + 14 * 1`\n`= 10862`\n\n**图 b.3** 十六进制系统中的位值\n\n## 694\n## 附录\
  \ b 进制系统\n\n所有基大于 10 的数字系统都使用字母作为数字。例如，12 进制使用 `0` 到 `B`。。请记住，当我们改变数字系统时，改变的是表示数值的方式。基越大，需要的数字就越少。\n\
  \n**二进制**\n1100\n\n**八进制**\n44\n\n**十进制**\n100\n\n**十六进制**\n64\n\n**图 b.4** 各种系统\n\
  \n## 695\n## 附录 b 进制系统\n\n## 转换\n\n我们已经看到了如何通过确定位值并计算结果将另一种进制转换为十进制。此过程也可用于将十进制值转换为另一种进制。首先，找到新系统中小于等于原始数值的最大位值。将原始数值除以该位值得到该位置的数字。余数需要在剩余的位置中表示。重复此过程，直到表示整个数值。\n\
  \n例如，图 B.5 显示了将十进制值 180 转换为二进制的过程。二进制中小于或等于 180 的最大位值是 `128`（或 `2⁷`），这是从右数起第八位。180\
  \ 除以 128 得到 `1`，余 `52`。因此第一位是 `1`，十进制值 52 需要在剩下的七位中表示。52 除以 `64`（下一个位值 `2⁶`）得到 `0`，余\
  \ `52`。因此第二位是 `0`。52 除以 `32` 得到 `1`，余 `20`。因此第三位是 `1`，剩下的五个位需要表示数值 20。20 除以 `16`\
  \ 得到 `1`，余 `4`。4 除以 `8` 得到 `0`，余 `4`。4 除以 `4` 得到 `1`，余 `0`。\n\n由于数值已被完全表示，其余位均为\
  \ 0。\n\n因此，`180¹⁰` 等于二进制的 `10110100`。通过以下方式可以确认：**位值：**\n**数字**\n**数字**\n\n`128`\n\
  `180`\n`1`\n`64`\n`52`\n`0`\n`32`\n`52`\n`1`\n`180¹⁰ = 10110100²`\n`16`\n`20`\n\
  `1`\n`8`\n`4`\n`0`\n`4`\n`1`\n`2`\n`0`\n`0`\n`1`\n`0`\n`0`\n\n**图 b.5** 十进制值转换为二进制\n\
  \n## 696\n## 附录 b 进制系统\n\n**位**\n**值**\n**数字**\n**数字**\n\n`256`\n`1967`\n`7`\n`16`\n\
  `175`\n`A`\n`1967¹⁰ = 7AF¹⁶`\n\n`1`\n`15`\n`F`\n\n**图 b.6** 十进制值转换为十六进制，将新的二进制数转换回十进制以确保我们得到原始数值。\n\
  \n\n\n此过程可以将任何十进制值转换为任何目标基数。对于每个目标进制，位值和可能的数字都会发生变化。如果你从正确的位值开始，每次除法操作都将产生新进制中的一个有效数字。\n\
  \n在图 B.5 的示例中，每次除法操作可能产生的数字只有 `1` 或 `0`，因为我们正在将其转换为二进制。\n\n然而，当我们转换为其他基数时，新进制中的任何有效数字都可能产生。例如，图\
  \ B.6 显示了将十进制值 `1967` 转换为十六进制的过程。\n\n`256` 的位值（`16²`）是小于等于原始数字的最大位值，因为下一个更高的位值是\
  \ `16³` 或 `4096`。\n\n将 `1967` 除以 `256` 得到 `7`，余 `175`。将 `175` 除以 `16` 得到 `10`，余\
  \ `15`。记住，十进制的 `10` 可以表示为十六进制中的单个数字 `A`。剩余的 `15` 可以表示为数字 `F`。\n\n因此，`1967_10` 等于十六进制的\
  \ `7AF`。\n\n### 快速转换\n\n我们已经建立了将任何基数中的任何值转换为其十进制等效表示，以及从十进制转换为任何其他基数的技术。\n\n因此，你现在可以通过通过十进制将任何基数的数字转换为任何其他基数。然而，在作为\
  \ 2 的幂的基数（例如二进制、八进制和十六进制）之间存在一种有趣的关系，这允许它们之间进行非常快速的转换。\n\n例如，从二进制转换为十六进制，你只需要将原始值的位从右侧开始四位一组进行分组，然后将每组四位转换为单个十六进制数字。图\
  \ B.7 中的示例演示了这一过程。\n\n### 附录 b：数制\n\n**697**\n\n```\n101111110110011\n101\n1111\n\
  1011\n0011\n101111110110011_2 = 5FB3_16\n5\nF\nB\n3\n5FB3\n```\n\n**图 b.7** 从二进制到十六进制的快速转换\
  \ `40C6`\n\n```\n0100\n0000\n1100\n0110\n40C6_16 = 100000011000110_2\n100000011000110\n\
  ```\n\n**图 b.8** 从十六进制到二进制的快速转换。从十六进制到二进制，我们反转这一过程，将每个十六进制数字扩展为四个二进制位。注意，如果必要为了凑四个二进制位，你可能需要为每个扩展后的十六进制数字的二进制版本添加导零。图\
  \ B.8 显示了十六进制值 `40C6` 转换为二进制。\n\n为什么从二进制转换为十六进制时我们将位分为四位一组？快速转换适用于二进制和任何作为 2 的幂的基数之间。我们将位按该幂次进行分组。由于\
  \ `2⁴ = 16`，我们按四位一组分组。\n\n从二进制转换为八进制的过程相同，只是位被分为三位一组，因为 `2³ = 8`。同样，当从八进制转换为二进制时，我们将每个八进制数字扩展为三位。\n\
  \n现在，在例如十六进制和八进制之间进行转换变成了一个执行两次快速转换的过程。首先将十六进制转换为二进制，然后取该结果执行从二进制到八进制的快速转换。\n\n\
  顺便说一下，这类快速转换可以在任何基数 `B` 和任何作为 `B` 的幂的基数之间进行。例如，基数 `3` 和基数 `9` 之间的转换可以使用快速分组技术，将数字分组或扩展为二位一组，因为\
  \ `3² = 9`。\n\n*本页特意留白。*\n\n# Unicode 字符集\n\nJava 编程语言使用 Unicode 字符集来管理文本。*字符集*简单来说字符的有序列表，每个字符对应于特定的数值。Unicode\
  \ 是一种国际字符集，包含了世界各国语言的字母、符号和表意文字。每个字符都表示为一个 16 位的无符号数值值。因此，Unicode 可以支持超过 65,000\
  \ 个唯一字符。目前，这些值中只有大约一半分配了字符。随着各种语言字符的加入，Unicode 字符集在不断完善。\n\n许多编程语言仍然使用 ASCII 字符集。ASCII\
  \ 代表美国信息交换标准代码。8 位扩展 ASCII 集合非常小，因此 Java 开发者选择使用 Unicode 以支持国际用户。然而，ASCII 本质上是 Unicode\
  \ 的子集，包括相应的数值，所以习惯于 ASCII 的程序员在使用 Unicode 时不应该有任何问题。\n\n图 C.1 显示了常用字符及其 Unicode\
  \ 数值的列表。这些字符也恰好是 ASCII 字符。图 C.1 中的所有字符都被称为*可打印字符*，因为它们具有可以在显示器上显示或由打印机打印的符号表示。\n\
  \n其他字符被称为*不可打印字符*，因为它们没有那样的符号表示。请注意，空格字符（数值 `32`）被认为是打印字符，尽管在显示时没有打印出任何符号。不可打印字符有时被称为*控制字符*，因为其中许多字符可以通过按下键盘上的某些键生成。\n\
