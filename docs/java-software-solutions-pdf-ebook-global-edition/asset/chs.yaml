  JButton b5 = new JButton(\"BUTTON 5\");\nadd(b1, BorderLayout.CENTER);\nadd(b2,\
  \ BorderLayout.NORTH);\nadd(b3, BorderLayout.SOUTH);\nadd(b4, BorderLayout.EAST);\n\
