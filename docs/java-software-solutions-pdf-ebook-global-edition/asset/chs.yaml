  // TowersOfHanoi.java 作者: Lewis/Loftus\n//\n// 表示汉诺塔游戏。\n****************************************************\n\
  public class TowersOfHanoi\n{\n    private int totalDisks;\n\n    //-------------------------------------------------\n\
  \    // 用指定的盘子数量设置游戏。\n    //-------------------------------------------------\n\
  \    public TowersOfHanoi(int disks)\n    {\n        totalDisks = disks;\n    }\n\
  \n    //-------------------------------------------------\n    // 执行 moveTower 的初始调用以解决游戏。\n\
  \    // 将盘子从 1 号柱移动到 3 号柱，使用 2 号柱。\n    //-------------------------------------------------\n\
  \    public void solve()\n    {\n        moveTower(totalDisks, 1, 3, 2);\n    }\n\
  \n    //-------------------------------------------------\n    // 通过将 n-1 个盘子的子栈移开，移动一个\n\
  \    // 盘子，从一个柱子移动到另一个，\n    // 再将子栈移回。1 个盘子的基准情况。\n    //-------------------------------------------------\n\
  \    private void moveTower(int numDisks, int start, int end, int temp)\n    {\n\
  \        if (numDisks == 1)\n            moveOneDisk(start, end);\n        else\n\
  \        {\n            moveTower(numDisks-1, start, temp, end);\n            moveOneDisk(start,\
  \ end);\n            moveTower(numDisks-1, temp, end, start);\n        }\n    }\n\
  \n    //-------------------------------------------------\n    // 打印从指定的起始柱移动到一个\n\
  \    // 目标柱的指令。\n    //-------------------------------------------------\n    private\
  \ void moveOneDisk(int start, int end)\n    {\n        System.out.println(\"Move\
  \ one disk from \" + start + \" to \" + end);\n    }\n}\n```\n\n注意 `moveTower` 描述柱子的参数会根据移动部分栈的需求进行交换。这段代码遵循了我们的通用策略，并使用\
  \ `moveTower` 方法移动所有的部分栈。请针对三个盘子的情况仔细追踪代码，以理解处理过程。将处理步骤与图 12.6 进行对比。\n\n**核心概念**\n\
  \n与其简洁优雅的实现相反，汉诺塔游戏的解决方案效率极低。为了解决这种指数级复杂度，这种\n\n\n\n\n一个叠有 `N` 个盘子的谜题，我们必须进行 `2\
  \ N − 1` 次非常低效的单独移动。然而，解决方案却极其短且优雅。这种情况是解决方案指数级复杂性的一个例子。随着盘子数量的增加，所需的移动次数呈指数级增长。\n\
  \n传说中，梵的祭司们正在世界中心的一座寺庙里研究这个谜题。他们正在使用 64 个金盘子，在纯钻石制成的柱之间移动它们。缺点是，当祭司们完成谜题时，世界将会结束。优点是，即使他们每天每秒都移动一个盘子，也需要超过\
  \ 584 亿年才能完成。而这仅仅是 64 个盘子！这充分说明了指数级算法复杂度是多么难以处理。\n\n### 自我检测问题 *(答案见附录 N )*\n\n\
