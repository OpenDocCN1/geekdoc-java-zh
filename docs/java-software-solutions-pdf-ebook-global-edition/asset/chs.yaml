  \n**SR 3.31** 为什么要使用上一个问题中定义的枚举类型 `CardSuit`？为什么不直接使用 `String` 变量并给它们赋值如 \"hearts\"\
  \ 等值？\n\n## 3.8 包装类\n\n正如我们之前讨论过的，Java 使用基本数据类型（如 `int`、`double`、`char` 和 `boolean`）以及类和对象来表示数据。管理两类数据（基本类型值和对象引用）在某些情况下会带来挑战。例如，我们可能会创建一个作为持有各种类型的对象。包装类表示特定的基本数据类型。例如，`Integer`\
  \ 类表示简单的整数值。\n\n**核心概念**\n包装类允许将基本值作为对象管理。\n\n包装类的构造函数接收要存储的基本值。然而，在特定情况下，我们可能希望它持有一个简单的整数值。在这些情况下，我们需要将基本值“包装”成对象。例如：\n\
  \n```java\nInteger ageObj = new Integer(40);\n```\n\n一旦完成了此声明和实例化，`ageObj` 对象实际上表示了整数\
  \ `40`。它可以在需要对象而非基本类型的地方使用。\n\n对于 Java 中的每个基本类型，在 Java 类库中都存在对应的包装类。所有包装类都定义在 `java.lang`\
  \ 包中。注意，甚至有一个表示 `void` 类型的包装类。然而，与其他包装类不同，`Void` 类不能被实例化。它仅仅表示 void 引用的概念。\n\n|\
  \ 基本类型 | 包装类 |\n| :--- | :--- |\n| byte | Byte |\n| short | Short |\n| int | Integer\
  \ |\n| long | Long |\n| float | Float |\n| double | Double |\n| char | Character\
  \ |\n| boolean | Boolean |\n| void | Void |\n\n包装类还提供了与关联基本类型相关的各种方法。例如，`Integer`\
  \ 类包含返回存储在对象中的 `int` 值以及将存储的值转换为其他基本类型的方法。图 3.9 列出了 `Integer` 类中找到的一些方法。其他包装类具有类似的方法。\n\
  \n- `Integer(int value)`：构造函数：创建一个存储指定值的 `Integer` 对象。\n- `byteValue()`\n- `doubleValue()`\n\
  - `floatValue()`\n- `intValue()`\n- `longValue()`：将此 `Integer` 的值作为对应的基本类型返回。\n\
  - `static int parseInt(String str)` 返回与指定字符串存储的值对应的 `int`。\n- `static String toBinaryString(int\
  \ num)`\n- `static String toHexString(int num)`\n- `static String toOctalString(int\
  \ num)`：返回指定整数值在相应进制下的字符串表示。\n\n\n\n\n注意，包装类也包含静态方法，这些方法可以独立于任何实例化对象被调用。例如，`Integer`\
  \ 类包含一个名为 `parseInt` 的静态方法，用于将存储在 `String` 中的整数转换为对应的 `int` 值。如果 `String` 对象 `str`\
  \ 持有字符串 `\"987\"`，则以下代码行将字符串转换为整数值 987 并将该值存储在 `int` 变量 `num` 中：\n\n```\nnum = Integer.parseInt(str);\n\
  ```\n\nJava 包装类通常还包含非常有用的静态常量。例如，`Integer` 类包含两个常量 `MIN_VALUE` 和 `MAX_VALUE`，它们分别持有最小和最大的\
  \ `int` 值。其他包装类对于其类型也有类似的常量。\n\n![](img/index-170_1.png)\n\n## 3.9 组件与容器\n\n169\n\
  \n### 自动装箱 (autoboxing)\n\n自动装箱是基本类型与对应的包装对象之间的自动转换。例如，在以下代码中，一个 `int` 值被赋值给 `Integer`\
  \ 对象引用变量：\n\n```java\nInteger obj1;\nint num1 = 69;\nobj1 = num1;\n// 自动创建一个 Integer\
  \ 对象\n```\n\n反向转换称为自动拆箱，在需要时也会自动发生。\n\n例如：\n\n```java\nInteger obj2 = new Integer(69);\n\
  int num2;\nnum2 = obj2;\n// 自动提取 int 值\n```\n\n基本类型与对象类型之间的赋值通常是不兼容的。自动装箱的能力仅发生在基本类型和与其对应的包装类之间。在任何其他情况下，尝试将基本类型赋值给对象引用变量，或者反过来，在对应的包装对象之间进行操作，都将导致编译时错误。\n\
