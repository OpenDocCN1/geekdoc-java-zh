  \ 项目\n\n图 J.3 显示了一个类图，代表了 `PaintBox` 项目第一次细化中至重要的类。请注意，它并不包含所有可能需要的类，也没有处理需求之外的任何内容。\n\
  \n## 细化 (733)\n\n### 描述\n呈现基础图形用户界面，包括主框架、按钮、菜单、菜单项和绘图区域。`select`（选择）和 `shape`（形状）按钮作为单选按钮组共同工作（一次只能选择一个）。目前不包含这些界面元素的任何功能。退出程序仅通过框架窗口的关闭按钮提供。\n\
  \n添加对绘制四种基本形状的支持：直线、椭圆、矩形和多折线。选中的形状按钮决定了绘制何种形状。`stroke color`（描边颜色）按钮可用于设置下一个绘制形状的描边颜色。`color`（颜色）按钮将弹出一个独立的对话框以允许选择颜色。\n\
  \n添加对保存和加载图形的支持。这包括 `File` 菜单项 `open`（打开）、`save`（保存）和 `save as`（另存为）的功能。当选择 `File`\
  \ 菜单的 `open`、`new` 或 `exit` 选项时，检查当前图形自上次保存以来是否被修改过，如果是提示用户是否要保存图形。\n\n提供在绘图表面上选择和移动形状的能力。\n\
  \n在形状的轮廓上应显示简单的图形选择块，以指示当前选中的形状。一旦选中，可以使用鼠标将形状拖动到绘图表面的另一个位置。\n\n添加 `Edit` 菜单项 `cut`（剪切）、`copy`（复制）和\
  \ `paste`（粘贴）的功能。选中后，可以剪切或复制一个形状。一旦形状被剪切或复制，就可以将其（可能多次）粘贴到绘图表面上，相对于原始位置有固定偏移。在任何给定时刻无效的\
  \ `Edit` 菜单项将被禁用。例如，除非选中了形状，否则无法选择 `cut` 和 `copy` 菜单项。\n\n添加对填充和重塑形状的支持。一旦选中了形状，可以使用\
  \ `fill color`（填充颜色）按钮来确定其填充颜色。`Edit` 菜单上的菜单项可用于移除任何已填充对象的填充（使其透明）。当前选中的形状现在将有一个重塑句柄，用于更改形状的尺寸。\n\
  \n为程序添加一些额外功能。这些新增包括系统初始执行时出现的启动界面、一个 `about`（关于）对话框、所有菜单项的键盘快捷键以及将应用程序打包成可执行的 `JAR`\
  \ 文件。\n\n**图 J.2** 本次细化对 `PaintBox` 项目的功能性细化。随着进一步细化的开发，我们将创建额外的图表来增强我们对系统设计的理解。\n\
  \n界面细化的详细设计和实现可能与我们在之前章节中开发的其他图形项目类似地进行。\n\n## 界面细化 (734)\n\n`JFrame`\n`PaintBox`\n\
