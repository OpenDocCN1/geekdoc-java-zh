  \nPP 4.18 开发一个程序，实现一个编写电子邮件消息的原型用户界面。该应用程序应包含 `To`、`CC`、`Bcc` 地址列表、主题行以及正文文本字段。包含一个标记为\
  \ `Send` 的按钮。当按下 `Send` 按钮时，程序应使用 `println` 语句将所有字段的内容打印到标准输出。\n\n## 软件失败：丹佛机场行李处理系统\n\
  \n### 发生了什么？\n\n丹佛国际机场的设计师曾对行李处理自动化有宏大计划。由于航站口和终端楼之间的距离长达一英里，他们希望开发一种系统，用最少的人工干预将行李从值机台运送到出发飞机，并从到达飞机运送到行李收集处。他们认为该系统将减少航班延误、缩短在行李提取道的等待时间并降低劳动力成本。\n\
  \n该系统设计于 20 世纪 80 年代后期和 90 年代初。建造了约 26 英里的轨道，在中央计算机的控制下，通过灰色推车在坡道移动自动行李。\n\n然而，由于行李系统的故障，原定于\
  \ 1994 年 3 月开放的机场持续延迟。在测试期间，行李出现了错装、损坏和路径错误。行李在转弯时从推车上掉落。系统将行李放入已经满的推车中，并卸到已经堵塞行李的传送带上。行李因卡在推车下或掉在水泥地上而破损。\n\
  \n机场最终于 1995 年 2 月开放营业。当时，只有一家航空公司——美联航空——同意使用该自动系统。这是该系统的简化版本，仅用于出发航班。没有其他航空公司完全使用该系统。他们选择由人工驾驶行李车，就像今天的大多数机场一样。美联航空最终在\
  \ 2005 年放弃了该系统。\n\n该系统的原始成本为 1.86 亿美元。延误每天损失 100 万美元，超过了原始成本。当美联航空在 2005 年选择放弃系统时，尽管他们拥有到\
  \ 2025 年的租赁合同，每年费用 6000 万。\n\n### 是什么原因导致的？\n\n这个项目代表的惨剧被认为是历史上最严重的软件工程和整体系统设计失败之一。许多个人问题导致了这些故障，但总的来说，设计师们对他们所使用的技术过度信任。他们没有考虑到复杂系统中总是会错误和效率低下。\n\
  \n具体问题包括软件误读了光电眼睛的数据，因此没有检测到一堆已存在的行李。当系统崩溃后重启时，丢失了推车的状态信息，不知道哪些推车是满的。传送带的速度没有正确考虑尖角处，导致推车翻倒。\n\
  \n一种被称为“蜥蜴舌”的伸缩式装载带——设计用于进入飞机货舱并在无人工帮助的情况下提取行李——完全失效了。\n\n### 经验训\n\n对于这种规模的项目，在没有对所用技术进行大量本地测试的情况下，不应尝试。失败往往是系统整体运行时多个变量共同导致的。\n\
  \n当该系统在 20 世纪 80 年代后期设计时，它依赖中央主机来控制系统。这种方法在当今分布式处理的世界中似乎是荒谬的，但它是一个大型系统可能在开发完成时就已经过时的很好的例子。\n\
  \n## 第 5 章：条件判断与循环\n\n### 目标\n\n* 定义通过方法的控制流。\n* 探索可用于决策的布尔表达式。\n* 使用 `if` 语句执行基础决策。\n\
  * 讨论与数据比较相关的问题。\n* 使用 `while` 循环重复执行语句。\n* 讨论迭代器对象的概念并使用它读取文本文件。\n* 引入 `ArrayList`\
  \ 类。\n* 探索更多的 GUI 组件和事件。\n\n## 5.1 布尔表达式\n\n在运行程序中执行语句的顺序被称为控制流。除非另有说明，程序的执行以线性方式进行。也就是说，运行程序从第一条语句开始，一次一条向下移动，直到程序完成。\n\
  \nJava 从 `main` 方法的第一行开始执行，逐步进行，直到 `main` 方法结束。\n\n调用方法会改变控制流。当方法被调用时，控制权跳转到定义该方法的代码处。当方法完成后，控制权返回到调用方法的位置，并从那里继续处理。\n\
  \n\n\n\n\n使用特定类型的编程语句编写代码。\n\n控制方法执行流的语句分为两类：条件语句和循环。\n\n### 条件与循环允许我们\n\n`条件语句`（conditional\
  \ statement）有时被称为`选择语句`（selection statement），因为它允许我们选择下一步将执行哪条语句。Java 中的条件语句包括 `if`\
  \ 语句、`if-else` 语句和 `switch` 语句。在本章中我们将探索 `if` 语句和 `if-else` 语句，并在第 6 章中介绍 `switch`\
  \ 语句。\n\n每个决策都基于一个`布尔表达式`（boolean expression，也称为`条件`，condition），这是一个评估结果为真或假的表达式。表达式的结果决定了下一步执行哪条语句。以下是一个\
  \ `if` 语句的示例：\n\n```\nif (count > 20)\n    System.out.println(\"Count exceeded\"\
  );\n```\n\n该语句中的条件是 `count > 20`。该表达式 `核心概念` 会评估出一个布尔结果（真或假）。`if` 语句中存储的值允许程序变量\
  \ `count` 大于 20，或者不是。如果是，则选择是否执行特定的 `println` 语句。如果不是，则跳过 `println` 语句并继续处理后续的代码。\n\
  \n这种决策的需求在编程场景中随可见。例如，人寿保险的费用可能取决于被保险人是否抽烟。如果该人抽烟，我们使用特定公式计算费用；如果不抽烟，我们使用另一个公式计算。条件语句的作用是评估布尔条件（人是否抽烟），然后根据此执行相应的计算。\n\
  \n![](img/index-236_1.png)\n\n## 5.1 布尔表达式\n\n**235**\n\n`循环`（loop）或`重复语句`（repetition\
  \ statement）允许我们反复执行程序语句。与条件语句类似，循环允许程序根据布尔表达式执行，该表达式决定了语句执行的次数。\n\n例如，假设我们要计算班级中每个学生的平均学分。每个学生的计算方法都是相同的，只是在不同的数据上执行。我们将设置一个循环，对每个学生重复计算，直到没有更多需要处理的学生。\n\
  \nJava 有三种类型的循环语句：`while` 语句、`do` 语句和 `for` 语句。每种循环语句都有与其他语句不同的独特特性。我们在本章中介绍 `while`\
  \ 语句，并在第 6 章中探索 `do` 循环和 `for` 循环。\n\n条件和循环基于的布尔表达式使用相等运算符、关系运算符和逻辑运算符来做出决策。在详细讨论条件语句和循环语句之前，让我们先探索这些运算符。\n\
  \n#### 等等运算符和关系运算符\n\n`==` 和 `!=` 运算符被称为`相等运算符`（equality operators）。它们分别测试两个值是否相等或不相等。注意，相等运算符由两个并列的等号组成，不应将其误认为是使用单个等号的赋值运算符。\n\
  \n以下 `if` 语句仅在变量 `total` 和 `sum` 包含相同值时才会打印一条语句：\n\n```\nif (total == sum)\n   \
  \ System.out.println(\"total equals sum\");\n```\n\n同样，以下 `if` 语句仅在变量 `total` 和\
  \ `sum` *不* 包含相同值时才会打印一条语句：\n\n```\nif (total != sum)\n    System.out.println(\"\
  total does NOT equal sum\");\n```\n\nJava 还有几个`关系运算符`（relational operators），允许我们决定值之间的相对顺序。在本节较早部分，我们使用大于运算符（`>`）来判断一个值是否大于另一个值。我们可以使用各种运算符询问类似的问题。在\
  \ Java 中，关系运算符有大于（`>`）、小于（`<`）、大于等于（`>=`）和小于等于（`<=`）。图 5.1 列出了 Java 的相等和关系运算符。\n\
  \n**236**\n**第 5 章** 条件与循环\n\n| 运算符 | 含义 |\n| :--- | :--- |\n| `==` | 等于 |\n| `!=`\
  \ | 不等于 |\n| `<` | 小于 |\n| `<=` | 小于等于 |\n| `>` | 大于 |\n| `>=` | 大于等于 |\n\n**图 5.1**\
  \ Java 相等和关系运算符。相等和关系运算符的优先级低于算术运算符。因此，首先评估算术运算，然后是相等和关系运算。一如既往，可以使用括号来显式指定评估顺序。\n\
  \n在我们在本章检查条件语句和循环语句时，我们将看到更多关系运算符的示例。\n\n#### 逻辑运算符\n\n除了相等和关系运算符外，Java 还有三种产生布尔结果的`逻辑运算符`（logical\
  \ operators）。它们也接受布尔操作数。图 5.2 列出了描述了逻辑运算符。\n\n`!` 运算符用于执行`逻辑非`（logical NOT）操作，也称为`逻辑取反`（logical\
  \ complement）。布尔值的逻辑取反产生其相反的值。也就是说，如果一个名为 `found` 的布尔变量值为 `false`，那么 `!found` 为真。同样，如果\
  \ `found` 为真，则 `!found` 为假。逻辑非操作不会改变存储在 `found` 中的值。\n\n逻辑操作可以通过`真值表`（truth table）来描述，该表列出了表达式中涉及变量的所有可能的值组合。\n\
  \n| 运算符 | 描述 | 示例 | 结果 |\n| :--- | :--- | :--- | :--- |\n| `!` | 逻辑非 | `!a` | 如果\
  \ `a` 为假则为真 |\n| `&&` | 逻辑与 | `a && b` | 如果 `a` 和 `b` 都为真则为真 |\n| `||` | 逻辑或 | `a\
  \ \\| b` | 如果 `a` 或 `b` 或两者都为真则为真 |\n\n**图 5.2** Java 逻辑运算符\n\n![](img/index-238_1.png)\n\
  \n**5.1 布尔表达式\n\n**237**\n\n| **a** | **!a** |\n| :--- | :--- |\n| false | true\
  \ |\n| true | false |\n\n**图 5.3** 描述逻辑非运算符的真值表。非运算符是一元运算符，其操作数只有两个可能的值：真或假。\n\n\
  `&&` 运算符执行`逻辑与`（logical AND）操作。如果两个操作数都为真，结果为真，否则为假。将其与`逻辑或`运算符（`||`）的结果对比，如果其中一个或两个操作数为真，结果为真，否则为假。\n\
  \n与和或运算符都是二元运算符，因为每个都使用两个操作数。因此，有四种可能的组合：两个操作数都为真、都为假、一个一假、反之亦然。图 5.4 展示了 `&&` 和\
  \ `||` 运算符的真值表。\n\n逻辑非在三个逻辑运算符中优先级最高，接下来是逻辑与，然后是逻辑或。\n\n| **a** | **b** | **a &&\
  \ b** | **a || b** |\n| :--- | :--- | :--- | :--- |\n| false | false | false | false\
