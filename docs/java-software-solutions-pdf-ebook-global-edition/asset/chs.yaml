  \n# 第 10 章 多态\n\n## 10.1 晚绑定\n\nSR 10.1 多态是指引用变量在不同时间指向不同对象的能力。通过此类引用调用的方法根据所引用对象的类型在不同时间绑定到不同的方法定义。\n\
