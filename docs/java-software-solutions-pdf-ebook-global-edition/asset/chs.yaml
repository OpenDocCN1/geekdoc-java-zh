  \ `for` 循环也可以用于数组，数组将在第 8 章中讨论。在书的其余部分，我们将根据情况适时使用 `for-each` 循环。\n\n## 比较循环\n\n\
  三个基本的循环语句（`while`、`do` 和 `for`）在功能上是等价的。使用一种类型循环编写的任何特定循环都可以使用另外两种类型的循环来编写。我们使用哪种类型的循环取决于具体情况。\n\
  \n正如我们之前提到的，`while` 循环和 `do` 循环的主要区别在于评估条件的时机。如果我们知道至少要执行一次循环体，那么 `do` 循环通常是更好的选择。另一方面，如果初始条件为假（false），`while`\
  \ 循环的体可能完全不会被执行。因此，我们说 `while` 循环的体执行零次或多次，而 `do` 循环的体执行一次或多次。\n\n`for` 循环类似于 `while`\
  \ 循环，其特点在于条件在执行循环体之前就会进行**核心概念**评估。当我们想要循环遍历的次数是固定的或可以很容易计算出来时，我们通常使用 `for` 循环。在许多情况下，将设置和控制循环迭代的代码放在\
  \ `for` 循环头部，与循环体分离会更加方便。\n\n## 6.5 使用循环和条件绘图\n\n### 311 自测练习题（答案见附录 N）\n\n- **SR\
