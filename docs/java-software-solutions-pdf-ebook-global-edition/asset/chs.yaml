  \ 描述二分查找的基本概念。\n\nSR 10.19 给定以下数字列表，二分查找算法需要检查列表中的多少元素，以确定指定的每个目标元素在列表中？\n\n1 4\
  \ 7 8 12 15 16 17 21 22 25 27 43 53 57\n\na. 17\nb. 15\nc. 57\nd. 45\n\n## 10.6\
  \ 为多态设计\n\n在本书中，我们一直在完善良好软件设计的基础概念。对于对象软件的每一个方面，我们都应该有意识且仔细地做出决策，形成结构良好、灵活且优雅的代码。\n\
  \n我们希望定义合适的类和对象，并进行良好的封装。我们希望在类和对象之间定义适当的关系，包括尽可能地利用继承的强大特性。现在，我们可以将多态加入我们思考软件设计的思维工具箱中。\n\
  \n![](img/index-547_1.png)\n![](img/index-547_2.png)\n\n**546**\n**第 10 章** 多态\n\
  \n多态为我们的软件提供了一种创建优雅多变性的手段。它允许我们用一致的方法处理不一致但相关的行为。我们应该尝试在软件系统中那些不一致但需要一致处理的地方寻找机会，使其适用于多态解决方案。\n\
  \n在开始编写代码之前，我们应该积极且刻意地寻找这些机会。\n\n每当你发现不同类型的对象执行相同类型的行为时，就存在多态解决方案的机会。你积累的经验越多，就越容易检测到此类情况。看看你是否能在以下情况下识别出多态的机会：\n\
  \n*   不同类型的车辆以不同的方式移动。\n*   所有的所有的交易都必须记录。\n*   公司生产的所有产品必须符合某些质量标准。\n*   酒店需要为每个房间规划装修工作。\n\
  *   赌场想要分析其游戏的利润率。\n*   调度员必须根据任务大小安排搬运车和人员。\n*   一个绘图程序允许用户绘制各种形状。\n\n这些示例的共同点是，相同的基本行为适用于多个对象，而这些行为的实现方式取决于对象的具体类型。我们应该磨炼自己的设计感官，以识别适用于多态解决方案的情况。每个圆都使用相同的基本技术和信息进行绘制，这与绘制矩形所需的信息和采取的步骤不同。然而，两种形状都被绘制了。不同但相似。\n\
  \n绘图程序的示例在附录 J 中的 `PaintBox` 案例中进行了更详细的探讨。它遵循了一个大型程序通过开发各个阶段的完善。其设计的核心是处理用户可以绘制的各种形状的多态方法。\n\
  \n一旦确定了多态情况，就可以处理设计的细节了。特别是，你应该使用继承还是接口作为定义多态引用的机制？问题的答案在于所涉及的不同类型对象之间的关系。如果这些对象可以通过继承自然地关联，具有真正的“是”（is-a）关系，那么通过继承实现多态可能是可行的方法。但如果这些对象的主要共同点是它们需要以特定的方式进行处理，那么使用接口来创建多态引用可能是更好的解决方案。\n\
  \n## 10.7 事件处理\n\n**547**\n**自测题** *(（答案见附录 N）*\n\nSR 10.20 假设你正在为一个与银行相关的系统设计类。支票账户和储蓄账户都需要存款和取款操作。你决定使用多态来提供这些行为。哪种多态机制（继承或接口）最适合这种情况？请为你的选择提供理由。\n\
  \nSR 10.21 假设你正在设计类来帮助创建水族屏保。有时，你希望某些水族对象从任何地方“漂浮”到鱼缸顶部。你决定使用多态来提供这种行为。哪种多态机制（继承或接口）最适合这种情况？请为你的选择提供理由。\n\
  \nSR 10.22 假设你正在设计类来支持雨林环境建模。动物对象（如蝴蝶和猴子）需要定期变老。你决定使用多态来提供这种行为。哪种多态机制（继承或接口）最适合这种情况？请为你的选择提供理由。\n\
  \n## 10.7 事件处理\n\n让我们重新回顾 Java GUI 中事件处理的概念，并看看它是如何与多态相关的。正如我们在之前的示例中多次看到的，为了响应事件，我们必须在事件监听对象和可能触发事件的特定组件之间建立关系。我们通过调用一个方法将监听器添加到组件中，从而建立监听器与其监听的组件之间的关系。\n\
  \n例如，假设有一个名为 `MyButtonListener` 的类表示动作监听器。为了设置一个响应 `JButton` 对象的监听器，我们可能会执行以下操作：\n\
  \n```java\nJButton button = new JButton();\nbutton.addActionListener(new MyButtonListener());\n\
  ```\n\n一旦建立了这种关系，当按钮触发动作事件时（因为用户点击了它），监听器就会响应。现在仔细考虑 `addActionListener` 方法。它是 `JButton`\
  \ 类的方法，是由太阳微系统公司的人多年前编写的。另一方面，我们可能是今天编写了 `MyButtonListener` 类。那么，多年前编写的方法如何能接受一个刚刚编写的类的参数呢？\n\
  \n![](img/index-549_1.png)\n![](img/index-549_2.png)\n\n**548**\n**第 10 章** 多态\n\
  \n答案是多态。如果你检查 `addActionListener` 方法的源代码，你会发现它接受一个类型为 `ActionListener` 接口的参数。监听器与其监听的组件之间关系的建立是通过多态实现的。\n\
  \n因此，`addActionListener` 方法不再只接受一种类型的参数，而是可以接受实现 `ActionListener` 接口的任何类的对象。所有其他添加监听器的方法都类似类似。\n\
  \n`JButton` 对象对传递给 `addActionListener` 方法的对象一无所知，除了它实现了 `ActionListener` 接口之外（否则代码将无法编译）。`JButton`\
  \ 对象简单地存储监听器对象，并在事件发生时调用它的 `actionPerformed` 方法。\n\n在第 9 章中，我们讨论过也可以通过扩展适配器类（adapter\
  \ class）来创建监听器。事实证明，使用适配器类并不是创建监听器的新方法。每个适配器类的编写都是为了实现相应的监听器接口，为所有事件处理器提供空方法。因此，通过扩展适配器类，新的监听器类会自动实现相应的监听器接口。这才是真正使其成为监听器的原因，使其可以传递给相应的添加监听器方法。\n\
  \n因此，无论如何创建监听器对象，我们都是通过接口使用多态来建立监听器与其对应的组件之间的关系。GUI 事件是多态所提供的力量和多变性的极佳示例。\n\n\n\n\
  \n\n## 10.8 文件选择器\n\n`JOptionPane` 类用于创建多个对话框，以显示文件选择器，允许用户获取信息、接受输入并确认操作、浏览磁盘并选择要处理的文件。\n\
  \n`JFileChooser` 类表示另一个专门的对话框，即*文件选择器*，它允许用户从硬盘或其他存储介质中选择文件。你可能运行过许多允许你使用类似对话框打开文件的程序。\n\
  \n列表 10.13 所示的程序使用 `JFileChooser` 对话框来选择文件。该程序还演示了另一个 GUI 组件——*文本区域*（text area），它与文本字段类似，但可以一次显示多行文本。当用户使用文件选择器对话框选择文件后，该文件中包含的文本将显示在文本区域中。\n\
  \n### 列表 10.13\n\n```java\n//********************************************************************\n\
  // DisplayFile.java Author: Lewis/Loftus own//\n// 演示了文件选择器和文本区域的使用。\n//********************************************************************\n\
  import java.util.Scanner;\nimport java.io.*;\nimport javax.swing.*;\n\npublic class\
  \ DisplayFile\n{\n//-----------------------------------------------------------------\n\
  // 打开文件选择器对话框，读取所选文件并\n//其加载到文本区域。\n//-----------------------------------------------------------------\n\
  public static void main(String[] args) throws IOException\n{\n    JFrame frame =\
  \ new JFrame(\"Display File\"); \n    frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\
  \ \n    JTextArea ta = new JTextArea(20, 30);\n    JFileChooser chooser = new JFileChooser();\n\
  \    int status = chooser.showOpenDialog(null);\n    if (status != JFileChooser.APPROVE_OPTION)\n\
  \        ta.setText(\"No File Chosen\");\n    else\n    {\n        File file = chooser.getSelectedFile();\n\
  \        Scanner scan = new Scanner(file);\n        String info = \"\";\n      \
  \  while (scan.hasNext())\n            info += scan.nextLine() + \"\\n\";\n    \
  \    ta.setText(info);\n    }\n    frame.getContentPane().add(ta);\n    frame.pack();\n\
  \    frame.setVisible(true);\n}\n}\n```\n\n当调用 `showOpenDialog` 方法时，会显示文件选择器对话框。它会自动呈现特定目录中包含的文件列表。用户可以使用对话框上的控件导航到其他目录，更改文件的查看方式，并指定显示的文件类型。\n\
  \n`showOpenDialog` 方法返回一个表示操作状态的整数，可以与 `JFileChooser` 类中定义的常量进行比对。在程序中，如果未选择文件（可能是通过点击取消按钮），则在文本区域中显示一条默认消息。如果用户选择了文件，则会打开该文件并使用\
  \ `Scanner` 类读取其内容。注意，此程序假设所选文件包含文本。它没有捕获任何异常，因此如果用户选择了不适当的文件，程序将在抛出异常时终止。\n\n文本区域组件由\
  \ `JTextArea` 类定义。在程序中，我们向其构造函数传递了两个参数，根据文本区域应该显示的字符数（行和列）来指定文本区域的大小。使用 `setText`\
  \ 方法设置要显示的文本。\n\n## 10.9 颜色选择器\n\n文本区域组件像文本字段一样，可以设置为可编辑或不可编辑。用户可以通过点击文本区域并使用键盘打字来更改可编辑文本区域的内容。如果文本区域是不可编辑的，则仅用于显示文本。默认情况下，`JTextArea`\
  \ 组件是可编辑的。\n\n`JFileChooser` 组件使用户指定特定文件变得方便。下一节将讨论另一个专门的对话框——允许用户选择颜色的对话框。\n\n\
  在许多情况下，我们可能希望赋予程序用户选择颜色的能力。我们可以通过多种方式实现这一点。例如，我们可以使用一组单选按钮提供颜色列表。然而，由于颜色种类众多，如果有一种更简单、更灵活的技术来完成这项常见任务就好了。通常被称为*颜色选择器*（color\
  \ chooser）的专用对话框是一种用于此目的图形组件。\n\n`JColorChooser` 类表示颜色选择器。它可以显示一个对话框，让用户从为此目的调色板中点击选择的颜色。用户还可以使用\
  \ RGB 值或其他颜色表示技术指定颜色。\n\n列表 10.14 所示的程序使用颜色选择器对话框来指定显示在独立帧中的面板的颜色。\n\n选择颜色后，新颜色将显示在主帧中，另一个对话框（此框是使用第\
  \ 6 章讨论过的 `JOptionPane` 创建的）用于判断用户是否想再次更改颜色。如果是，则显示另一个颜色选择器对话框。只要用户愿意，这种循环就可以持续下去。\n\
  \n### 列表 10.14\n\n```java\n//********************************************************************\n\
  // DisplayColor.java Author: Lewis/Loftus\n//\n// 演示了颜色选择器的使用。\n//********************************************************************\n\
  import javax.swing.*;\nimport java.awt.*;\n\npublic class DisplayColor\n{\n//-----------------------------------------------------------------\n\
  // 呈现一个带颜色面板的帧，然后允许用户\n// 使用颜色选择器多次更改颜色。\n//-----------------------------------------------------------------\n\
  public static void main(String[] args)\n{\n    JFrame frame = new JFrame(\"Display\
  \ Color\"); \n    frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE); \n    JPanel\
  \ colorPanel = new JPanel();\n    colorPanel.setBackground(Color.white);\n    colorPanel.setPreferredSize(new\
  \ Dimension(300, 100)); \n    frame.getContentPane().add(colorPanel);\n    frame.pack();\n\
  \    frame.setVisible(true);\n\n    Color shade = Color.white;\n    int again;\n\
  \    do\n    {\n        shade = JColorChooser.showDialog(frame, \"Pick a Color!\"\
  , shade);\n        colorPanel.setBackground(shade);\n        again = JOptionPane.showConfirmDialog(null,\
  \ \"Display another color?\");\n    }\n    while (again == JOptionPane.YES_OPTION);\n\
  }\n}\n```\n\n## 10.10 滑块\n\n*滑块*（slider）是一种允许用户在边界范围内指定数值的组件。滑块可以以垂直或水平的方式呈现，并可以带有可选的刻度线和标签，以指示值范围。\n\
