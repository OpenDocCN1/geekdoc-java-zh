  \n一种名为对话框（dialog box）的组件对于辅助 GUI 关键概念的处理非常有帮助。`对话框`是一个弹出在任何当前活动窗口之上的图形窗口，使用户可以对其进行简短、特定的用户交互。对话框可以服务于多种用途，例如提供信息或传递某些信息、确认操作，或允许用户输入某些信息。通常，对话框只有一个单一的目的，用户与其的交互是短暂的。\n\
  \nJava 类库的 `Swing` 包包含一个名为 `JOptionPane` 的类，它简化了基本对话框的创建和使用。图 6.3 列出了 `JOptionPane`\
  \ 的一些方法。\n\n*   `static String showInputDialog(Object msg)`: 显示一个包含指定消息和输入文本框的对话框。返回文本框的内容。\n\
  *   `static int showConfirmDialog(Component parent, Object msg)`: 显示一个包含指定消息和是/否按钮选项的对话框。如果父组件为\
  \ `null`，则对话框将居于屏幕中央。\n*   `static void showMessageDialog(Component parent, Object\
  \ msg)`: 显示一个包含指定消息的对话框。如果父组件为 `null`，则对话框将居于屏幕中央。\n\n**图 6.3** `JOptionPane` 类的一些方法\n\
  \n318\n\n第 6 章 更多条件语句和循环\n\n`JOptionPane` 对话框的基本格式分为三类。`消息对话框`简单地显示输出字符串。`输入对话框`呈现一个提示和一个单一输入文本框，用户可以在其中输入一个数据字符串。`确认对话框`向用户提出一个简单的“是或否”的问题。\n\
  \n让我们来看一个使用这些类型对话框的程序。列表 6.9 显示了一个程序，该程序首先向用户显示一个输入对话框，要求用户输入一个整数。在用户点击输入对话框上的 OK\
  \ 按钮后，会出现第二个对话框（这次是消息对话框），告知用户输入的数字是偶数还是奇数。在用户关闭该对话框后，将出现第三个对话框，以确定用户是否想要测试另一个数字。如果用户点击标记为“是”的按钮，这一系列对话框将重复。否则，程序终止。\n\
  \n### 列表 6.9\n\n```java\n//********************************************************************\n\
  // EvenOdd.java 作者: Lewis/Loftus\n//\n// 展示了 JOptionPane 类的使用。\n//********************************************************************\n\
  import javax.swing.JOptionPane;\n\npublic class EvenOdd\n{\n    //-----------------------------------------------------------------\n\
  \    // 判断用户输入的值是偶数还是奇数。\n    // 使用多个对话框进行用户交互。\n    //-----------------------------------------------------------------\n\
  \    public static void main(String[] args)\n    {\n        String numStr, result;\n\
  \        int num, again;\n        do\n        {\n            numStr = JOptionPane.showInputDialog(\"\
  Enter an integer: \");\n            num = Integer.parseInt(numStr);\n          \
  \  result = \"That number is \" + ((num%2 == 0) ? \"even\" : \"odd\");\n       \
  \     JOptionPane.showMessageDialog(null, result);\n            again = JOptionPane.showConfirmDialog(null,\
  \ \"Do Another?\");\n        }\n        while (again == JOptionPane.YES_OPTION);\n\
  \    }\n}\n```\n\n319\n\n![](img/index-320_1.png) ![](img/index-320_2.png) ![](img/index-320_3.png)\n\
