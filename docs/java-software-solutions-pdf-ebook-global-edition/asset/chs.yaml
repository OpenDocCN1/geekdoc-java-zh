  \nSR 1.35 支持面向对象编程的主要概念有哪些？\n\n## 第 1 章 引言\n\n### 核心概念总结\n\n- 计算机系统由硬件和软件组成，它们协同工作帮助我们解决问题。\n\
  - CPU 从主内存中读取程序指令，一个接一个地执行，直到程序结束。\n- 操作系统提供用户界面并管理计算机资源。\n- 对于用户来说，界面*就是*程序。\n\
  - 数字计算机通过将信息拆分为部分并将每个部分表示为数字来存储信息。\n- 二进制被用于在计算机中存储和移动信息，因为用于存储和处理二进制数据的设备廉价且可靠。\n\
  - $N$ 位二进制恰好有 $2^N$ 种排列。因此，$N$ 位可以表示最多 $2^N$ 个唯一项目。\n- 计算机的核心由主内存（存储程序和数据）和 CPU（一个接一个地执行程序指令）组成。\n\
  - 地址是与内存位置相关的唯一数字。\n- 主内存是易失的，这意味着只有在供电时，存储的信息才会保持。\n- CD 的表面既有平滑区域也有小凹槽。凹槽代表二进制\
  \ 1，平滑区域代表二进制 0。\n- 可重写 CD 使用根据需要制成非晶态或晶态的涂层，模拟普通 CD 的凹槽和平滑区域。\n- 取取-解码-执行周期（fetch-decode-execute\
  \ cycle）构成了计算机处理的基础。\n- 网络由两个或多个连接在一起的计算机组成，以便它们交换信息。\n- 共享通信线路会产生延迟，但具有成本效益并简化了向网络添加新计算机的过程。\n\
  - 局域网（`LAN`）是整个组织共享信息和资源的有效方法。\n- 互联网是跨越全球广域网（`WAN`）。\n- 连接到互联网的每台计算机都有唯一标识它的 IP\
  \ 地址。\n- 万维网（World Wide Web）是一种让类能够跨网络共享信息的软件。\n- `URL` 唯一指定了 Web 上的文档或其他信息，供浏览器获取和显示。\n\
  - 本书重点关注面向对象编程的原理。\n- 注释不影响程序的处理；而是便于人类理解。\n- 内联文档应该提供对代码的洞察。它不应该是模糊的，也不应该把显而易见。\n\
  - Java 是大小敏感的。字母的大写和小写版本是不同的。\n- 标识符名称应该具有描述性且可读性。\n- 适当使用空格使程序更容易阅读和理解。\n- 你应该遵守一套建立你格式化和记录程序方法的指南。\n\
  - 所有程序必须翻译成特定 CPU 的机器语言才能执行。\n- 高级语言允许程序员忽略机器语言的底层细节。\n- Java 编译器将 Java 源代码翻译成 Java\
  \ 字节码，这是一种低级的、体系无关的程序表示。\n- 存在许多不同的开发环境帮助你创建和修改 Java 程序。\n- 语法规则规定程序的形式。语义规定程序语句的含义。\n\
  - 程序员对程序的准确性和可靠性负责。\n- Java 程序必须在语法上是正确的，否则编译器将不会产生字节码。\n- 面向对象编程帮助我们解决问题，这正是编写程序的目的。\n\
  - 程序设计涉及将解决方案拆分为易于管理的部分。\n- 每个对象都有状态（由其属性定义）和一组行为（由其方法定义）。\n- 类是蓝蓝图\n\n## 练习题\n\n\
