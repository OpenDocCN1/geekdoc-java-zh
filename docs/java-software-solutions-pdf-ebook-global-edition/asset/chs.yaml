  \n# 第 4 章 编写类 (Writing Classes)\n\n## 4.1 复习类与对象 (Classes and Objects Revisited)\n\
  \nSR 4.1 属性（attribute）是存储在对象中的数据值，定义了该对象的特定特征。例如，`Student` 对象的的一个属性可能是该学生当前的平均点分。\n\
  \n对象属性的值共同决定了该对象的当前状态。\n\nSR 4.2 操作（operation）是一个可以对对象执行或由对象执行的函数。例如，`Student` 对象的的一个操作可能是计算该学生当前的平均点分。对象的操作统称为行为（behaviors）。\n\
  \nSR 4.3 为代表图书馆书籍的 `Book` 类定义的属性和操作：\n属性：`idNumber`, `onShelfStatus`, `isAvailable`\n\
  操作：`checkOut`, `dueDate`\n\nSR 4.4 答案为：\na. 错误——识别类是解决问题的关键。除了识别已存在的类，我们还设计并实现新类。b\
  \ 正确——我们调用此类修改器（mutators）。\nc. 正确——许多操作的结果取决于操作对象的状态。\nd. 错误——在 Java 中，对象的状态由实例数据表示。\n\
  \n**778**\n\n**附录** 自测习题\n\n### 4.2 类的结构 (anatomy of a Class)\n\nSR 4.5 类是对象的蓝图。它定义了每个实例化对象将拥有的变量和方法。但类并不为变量保留内存空间。每个对象都有的数据空间，因此都有自己的状态。\n\
  \nSR 4.6 `Die` 类的实例数据是 `MAX`（一个等于 6 的整数常量，代表骰子的面数以及骰子的最大值）和 `faceValue`（一个整数变量，代表骰子当前朝上的点数）。\n\
  \nSR 4.7 `Die` 类定义的可以改变 `Die` 对象状态的方法有 `roll` 和 `setFaceValue`。\n\nSR 4.8 当将对象传递给\
  \ `print` 或 `println` 方法时，会自动调用对象的 `toString` 方法来获取对象的字符串描述。如果对象没有定义 `toString`\
  \ 方法，则使用默认字符串。因此，在定义类时定义 `toString` 方法通常是一个好主意。\n\nSR 4.9 变量的作用（scope）是程序中可以引用变量的区域。在类级别定义的实例变量可以在类的任何方法中引用。在特定方法内定义的局部变量（包括形式参数）只能在该方法内引用。\n\
  \nSR 4.10 UML 图帮助我们可视化程序中的实体（类和对象）以及它们之间的关系。UML 图是我们在编写代码之前帮助捕捉设计的工具。\n\n### 4.3\
  \ 封装 (encapsulation)\n\nSR 4.11 自主对象是指控制其自身数据值的对象。\n\n封装对象不允许外部客户端进入并更改其数据，因此它们是自主的。\n\
  \n\n\n\n\n### SR 4.13\n修饰符是 Java 保留字，可以用于变量或方法的定义，并专门定义了其使用的某些特性。例如，通过声明一个具有私有（private）可见性的变量，该变量无法在定义它的对象之外被直接访问。\n\
  \n**附录 n** 自测习题答案 **779**\n\n### SR 4.14\n常量可以声明为具有公有（public）可见性，因为这不会违反封装性。由于常量的值无法更改，因此另一个对象直接访问它通常不是问题。\n\
  \n### SR 4.15 \n修饰符以以下方式影响方法和变量：\na. 公有（public）方法被称为对象的服务方法，因为它定义了对象所提供的的服务。\nb.\
  \ 私有（private）方法被称为支持方法，因为它无法从对象外部调用，并用于支持类中其他方法的活动。\nc. 公有（public）变量是可以被客户端直接访问和修改的变量。这显式地违反了封装原则，因此应该被避免。\n\
  d. 私有（private）变量是只能从类内部访问和修改的变量。变量几乎总是声明为私有（private）可见性。\n\n## 4.4 方法的结构\n\n###\
  \ SR 4.16\n虽然方法定义在类中，但它是通过特定的对象被调用的，以指示该类的哪一个对象正受到影响。例如，`Student` 类可能定义计算学生平均学点数（GPA）的操作，但该操作是通过特定的\
  \ `Student` 对象调用的，用以计算该学生的 GPA。此规则的例外是静态（static）方法的调用（见第 3 章），它是通过类名执行的，且不影响任何特定的对象。\n\
  \n### SR 4.17\n被调用的方法可能会返回一个值，这意味着它计算了一个值并将该值提供给调用方法。调用方法通常将该调用以及其返回值作为较大表达式的一部分使用。\n\
  \n### SR 4.18\n使用显式返回语句（return）来指定从方法返回的值。返回值的类型必须与方法定义中指定的返回类型匹配。\n\n### SR 4.19\n\
  对于返回类型非 `void` 的方法，需要返回语句。不返回值的方法可以使用不带表达式的返回语句，但这不是必须的。一个方法中应只使用一个返回语句。\n\n###\
  \ SR 4.20\n实际参数（actual parameter）是在调用方法时发送给方法的值。\n\n形式参数（formal parameter）是方法声明头中对应的变量；它获取实际参数的值，以便在方法内部使用。\n\
