  \n## 8.6 二维数组\n\n我们到目前为止检查的数组在意义上都是一维数组，因为它们表示一个简单的值列表。正如名称所暗示，二维数组在两个维度上都有值，这些维度通常被认为是表格的行和列。图\
  \ 8.4 形象地比较了一维数组和二维数组。我们必须使用两个索引来引用二维数组中的一个值，一个指定行，另一个指定列。\n\n方括号用于表示数组的每个维度。因此，存储整数的二维数组类型为\
  \ `int[][]`。从技术上讲，Java 将二维数组表示为数组的数组。二维整数数组实际上是一个指向一维整数数组引用的一维数组。\n\n列表 8.13 所示的\
  \ `TwoDArray` 程序实例化了一个二维整数数组。与一维数组一样，维度的尺寸是在创建数组时指定的。维度的尺寸可以是不同的。\n\n`TwoDArray`\
  \ 程序中使用嵌套的 for 循环来向数组加载值，并以表格格式打印这些值。仔细跟踪处理过程，查看嵌套循环如何访问二维数组中的每个元素。注意，外层循环由 `table.length`\
  \ 控制（这代表行数），内层循环由 `table[row].length` 控制。\n\n**图 8.4** 一维数组与二维数组\n\n#### 列表 8.13\n\
