  \ 组合框\n\n*组合框*（combo box）允许用户从“下拉”菜单中选择多个选项之一。**核心概念**：当用户使用鼠标点击组合框时，会显示一个选项列表，用户从中进行选择。当前选择将显示在组合框中。组合框为用户提供了一个选项选项菜单，并由\
  \ `JComboBox` 类定义。\n\n组合框可以是*可编辑的*（editable）也可以是*不可编辑的*（uneditable）。默认情况下，组合框是不可编辑的。更改不可编辑组合框的值，只能通过从列表中选择一个项来实现。然而，如果组合框是可编辑的，用户可以通过从列表中选择一个项或通过在组合框区域输入特定值来更改值。\n\
  \n组合框列表中的选项可以通过两种方式之一建立。我们可以创建一个字符串数组并将其传递给 `JComboBox` 类的构造函数。或者，我们可以使用 `addItem`\
  \ 方法在创建组合框后向其添加项。`JComboBox` 还可以将 `ImageIcon` 对象作为选项显示。\n\nListing 11.11 中的 JukeBox\
  \ 程序演示了组合框的使用。用户使用组合框选择一首歌播放，然后按下 Play 按钮开始播放歌曲。可以随时按下 Stop 按钮停止歌曲。在歌曲播放时选择新歌曲也会停止当前歌曲。\n\
  \nListing 11.12 显示的 `JukeBoxControls` 类是一个面板，包含了组成点唱机 GUI 的组件。该类的构造函数还加载了将播放的音频片段。首先通过创建一个与定义片段的\
  \ `wav` 或 `au` 文件相对应的 `URL` 对象来获取音频片段。如果音频片段存储在执行程序的同一机器上，则 `URL` 构造函数的前两个参数应分别为\
  \ `\"file\"` 和 `\"localhost\"`。创建 `URL` 对象可能会抛出受检异常；因此它们在 `try` 块中创建。然而，此程序假设音频片段将成功加载，因此如果抛出异常则什么都不做。\n\
