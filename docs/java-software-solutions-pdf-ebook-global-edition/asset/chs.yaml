  \n## 5.6 ArrayList 类\n\n271\n\n### 5.6 ArrayList 类\n\n现在我们已经在编程语句的武器库中拥有了循环，让我们引入一个用于管理对象集合的非常有用的类。`ArrayList`\
  \ 类是 Java 标准类库中 `java.util` 包的一部分。`ArrayList` 对象存储一个对象列表，并允许你通过整数索引 `index` 值来引用每一个对象。我们经常会使用循环来扫描列表中的对象并以某种方式或另一种方式处理它们。\n\
  \n在内部，`ArrayList` 类使用一种名为 `array`（数组，因此得此名）的编程结构来管理列表。数组将在第 8 章中详细讨论，但我们不需要了解数组的细节。`ArrayList`\
  \ 对象存储一个对象列表，并让你访问它们以使用 `ArrayList` 对象。`ArrayList` 类是使用 Java 集合 API 的，它是一组用于组织和管理其他对象的类。我们将在第\
  \ 13 章进一步讨论集合类。\n\n图 5.8 列出了 `ArrayList` 类的几种方法。你可以以各种方式添加和删除元素，判断列表是否为空，并获取当前列表中元素数量，以及其他几种操作。\n\
  \n注意，`ArrayList` 类指的是具有类型为 `E` 的元素。也就是说，这是一个*泛型**类型*（`E` 代表 element，元素），它是在创建 `ArrayList`\
  \ 对象时确定的。因此，你不仅仅是创建一个 `ArrayList` 对象，而是创建一个将存储特定类型对象的 `ArrayList` 对象。对于给定对象的类型参数写在类名后的角括号中。因此，我们可以讨论管理\
  \ `String` 对象列表的 `ArrayList<String>` 对象，或者管理 `Book` 对象列表的 `ArrayList<Book>` 对象。\n\
  \n你可以在不指定元素类型的情况下创建一个 `ArrayList`，在这种情况下，`ArrayList` 存储 `Object` 引用，这意味着你可以将任何类型的对象放入列表中。这通常不是一个好主意。你应该指定将存储在列表中元素类型。能够承诺在指定的\
  \ `ArrayList` 对象中存储特定类型的意义在于，可以让编译器帮助你检查只有适当类型的对象被存储在对象。\n\n`ArrayList` 的索引值从 0\
  \ 开始，而不是 1。因此从概念上讲，例如，一个 `String` 对象的 `ArrayList` 可能会管理以下列表：\n0 \"Bashful\"\n1 \"\
  Sleepy\"\n2 \"Happy\"\n3 \"Dopey\"\n4 \"Doc\"\n\n另外注意，`ArrayList` 存储的是对象的引用。你不能创建一个存储\
  \ `int` 等原始值的 `ArrayList`。但这时包装类再次出现来救场了。例如，你可以根据需要创建 `ArrayList<Integer>` 或 `ArrayList<Double>`。\n\
