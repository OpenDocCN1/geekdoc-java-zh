  \n![](img/index-294_1.jpg)\n![](img/index-294_2.png)\n\n### 软件故障：Therac-25\n\n###\
  \ 发生了什么？\nTherac-25 是一种放射治疗设备，用于投送定向电子或 X 射线束以破坏癌症组织。在使用期间，数百名患者在该设备接受了适当的治疗。但在\
  \ 1985 年至 1987 年记录的六个案例中，Therac-25 交付了过量辐射，导致严重残疾和死亡。\n\n在典型的治疗中，患者躺下，操作员调整机器针对目标身体区域。操作员在机器计算机控制台上设置治疗参数并按下按钮交付辐射。患者被告知典型的副作用是轻微的皮肤不适，类似于晒伤。\n\
  \n在事故案例中，一些患者报告感到“巨大的热力”或“电击刺刺感”。在一个案例中，患者失去了肩膀和手臂的功能，并由于辐射损伤不得不切除左乳房。其他人则死于放射中毒。\n\
  \n辐射量以 rad（戈瑞）为单位。标准治疗约为 200 rad。估计这些事故导致了 20,000 rad 的剂量被入。\n\n### 原因是什么？\n操作员被告知这台机器具有如此多的安全措施，以至于“几乎不可能”导致患者过量辐射。但\
  \ Therac-25 使用的部分软件重用了早期型号的软件，而该版本包含了许多基于硬件的安全措施。因此，硬件特性掩盖了底层软件的问题。\n\n结果证明，如果操作员错误输入参数并以特定方式进行纠正，软件将允许机器在不适当扩散的情况下交付最大辐射剂量。这是一个非常奇怪的错误，测试机器的技术人员未能重现该问题。在某一点，一台显然导致过过量辐射的机器在技术人员未能发现问题后被重新投入使用。\n\
  \n\n\n分析师认为，软件问题只是事故发生的原因之一。虽然存在基础性的编程错误，但对整体安全问题的关注也不足。此外，机器被长时间使用的的一个原因在于，对这些问题的报告没有如预期的那样准确和彻底。\n\
  \n## 经验训\n\n软件安全是本案例中的核心问题。当人的生命悬于一线时，很难想象自己为什么不竭尽全力去确保你的软件尽可能健壮。这归结为风险分析：你会在多大程度上愿意承担你正在开发的某个特定软件仍包含错误的风险？对于许多应用程序来说，问题可能会给用户带来不便并可能产生业务影响，但其他应用程序则直接关乎人的性命。\n\
  \n本案例也是定位问题困难性的一个例子。对于数百名患者来说，`ac-25`提供了卓越的治疗。最初的投诉之一在没有经过适当调查或报告的情况下被忽略了。后来，当问题确实发生时，却又无法重现。这是一个非常特殊的情况——这种情况通常不会在正常情况下发生。\n\
  \n*来源：*computingcases.org, IEEE Computer\n\n## 章节目标\n\n- 检查使用 `switch` 语句的条件处理。\n\
  - 讨论条件运算符。\n- 检查替代的重复语句：`do` 和 `for` 循环。\n- 借助条件和循环绘制图形。\n- 探索对话框的使用。\n\n在第 5 章中，我们检查了用于决策的\
  \ `if` 语句和用于循环的 `while` 语句。本章探索了 Java 中执行类似任务的几条额外语句。特别在本章中，我们将探索 `switch` 语句，它允许我们根据特定值在多个执行路径之间进行选择。我们还将探索\
  \ `do` 和 `for` 循环，它们提供了区别于 `while` 循环的逻辑处理和/或语法。\n\n这些替代语句在关键细节上有所不同，任何特定情况都可能适合其中一种而非另一种。本章的“图形轨迹”部分探索了如何使用条件和循环来控制图形，并检查了对话框的目的和用途。\n\
  \n## 第 6 章：更多条件和循环\n\n## 6.1 switch 语句\n\nJava 中的另一种条件语句被称为 `switch` 语句，它导致执行程序根据单个值遵循几条执行路径中的之一。\n\
  \n使用多个 `if` 语句也可以构建类似的逻辑，但在需要的情况下，`switch` 语句通常会让代码更易读。\n\n`switch` 语句评估一个表达式以确定一个值，然后将该值与几个可能的\
  \ `cases` 之一进行匹配。每个 `case` 都有与其相关的语句。评估表达式后，控制将跳转到与匹配值的第一个 `case` 关联的语句。考虑以下示例：\n\
  \n```java\nswitch (idChar)\n{\n    case 'A':\n        aCount = aCount + 1;\n   \
  \     break;\n    case 'B':\n        bCount = bCount + 1;\n        break;\n    case\
  \ 'C':\n        cCount = cCount + 1;\n        break;\n    default:\n        System.out.println(\"\
  Error in Identification Character.\");\n}\n```\n\n首先，评估表达式。在这个示例中，表达式是一个简单的名为 `idChar`\
  \ 的字符 类型变量。执行随后转移到与表达式结果匹配的 case 值之后的第一个语句。\n\n**核心概念**：如果 `idChar` 包含 'A'，则变量 `aCount`\
  \ 加 1。如果 `idChar` 包含 'B'，则跳过 'A' 的 case 并继续处理到 `bCount` 加 1 的地方。同样，如果 `idChar` 包含\
  \ 'C'，则处理该 case。\n\n如果没有 case 值与表达式匹配，执行将继续执行可选的 `default case`，由保留字 `default` 指明。如果不存在\
  \ `default` case，则 `switch` 语句中的语句都不会执行，处理将继续到 `switch` 语句之后的语句。包含一个 `default` case\
  \ 通常是一个好习惯，即使你不预计它会被执行。\n\n当遇到 `break` 语句时，处理跳转到 `switch` 语句之后的语句。`break` 语句通常用于退出\
  \ `switch` 语句的每个 `case`。如果没有 `break` 语句，处理将进入 `switch` 的下一个 `case`。因此，如果上一个示例中 'A'\
  \ case 结尾没有 `break` 语句，那么当 `idChar` 包含 'A' 时，`aCount` 和 `bCount` 变量都会加 1。\n\n**核心概念**：通常我们只想执行一个\
  \ case，因此几乎总是会使用 `break` 语句。然而，`switch` 语句中 case 备选项的“穿透”功能偶尔也会派上用场。\n\n你可能记得第 5\
  \ 章简要提到过 `break` 语句，因为它可以用于其他类型的循环和条件语句。我们当时警告过，这种处理通常是没有必要的，许多开发者认为这种用法是坏习惯。`switch`\
  \ 语句是这一准则的例外。使用 `break` 语句是确保只执行一个 case 代码的唯一方法。\n\n#### switch 语句\n```java\nswitch\
  \ (Expression)\n{\n}\n```\n#### switch case\n```java\ncase Expression: Block Statement\n\
  default:\n```\n`switch` 语句评估初始 `Expression` 并将其值与 `cases` 之一匹配。处理继续执行与该 case 对应的\
  \ `Statement`。如果没有其他 case 匹配，则将执行可选的 `default` case。\n\n示例：\n```java\nswitch (numValues)\n\
  {\n    case 0:\n        System.out.println(\"No values were entered.\"); break;\n\
  \    case 1:\n        System.out.println(\"One value was entered.\"); break;\n \
  \   case 2:\n        System.out.println(\"Two values were entered.\"); break;\n\
  \    default:\n        System.out.println(\"Too many values were entered.\");\n\
  }\n```\n`switch` 语句开头评估的表达式必须是 `char`、`byte`、`short` 或 `int` 类型。从 Java 7 开始，`switch`\
  \ 也可以对 `String` 执行。但 `switch` 表达式不能是布尔或浮点值。此外，每个 `case` 的值必须是常量；不能是变量或其他表达式。这限制了\
  \ `switch` 语句适用的情况。但在适用的情况下，它通常会让代码更容易阅读和理解。\n\n还要注意，`switch` 语句的隐含布尔条件是基于相等性的。语句开头的表达式与每个\
  \ `case` 值比较，以确定它等于哪。`switch` 语句不能用于确定其他关系操作（如小于），除非先进行预处理。例如，列表 6.1 中的 `GradeReport`\
  \ 程序根据用户输入的数值成绩打印注释。\n\n#### 列表 6.1\n```java\n/************************************\n\
  // GradeReport.java Author: Lewis/Loftus\n//\n// 展示了 switch 语句的使用。\n//************************************\n\
  import java.util.Scanner;\n\npublic class GradeReport\n{\n    //-----------------------------------------------------\n\
  \    // 从用户处读取成绩并打印相应的注释。\n    //-----------------------------------------------------\n\
  \    public static void main(String[] args)\n    {\n        int grade, category;\n\
  \        Scanner scan = new Scanner(System.in);\n```\n\n\n\n\n\n```java\nSystem.out.print(\"\
  Enter a numeric grade (0 to 100): \"); grade = scan.nextInt();\n\ncategory = grade\
  \ / 10;\n\nSystem.out.print(\"That grade is \");\n\nswitch (category)\n{\n    case\
  \ 10:\n        System.out.println(\"a perfect score. Well done.\"); break;\n   \
  \ case 9:\n        System.out.println(\"well above average. Excellent.\"); break;\n\
  \    case 8:\n        System.out.println(\"above average. Nice job.\"); break;\n\
  \    case 7:\n        System.out.println(\"average.\");\n        break;\n    case\
  \ 6:\n        System.out.println(\"below average. You should see the\"); \n    \
  \    System.out.println(\"instructor to clarify the material \" + \"presented in\
  \ class.\");\n        break;\n    default:\n        System.out.println(\"not passing.\"\
  );\n}\n```\n\n## 6.1 switch 语句\n\n**列表 6.1 (续)**\n\n**输出**\nEnter a numeric grade\
  \ (0 to 100): 86\nThat grade is above average. Nice job.\n\n在 `GradeReport` 中，成绩的类别通过使用整数除法将\
  \ `grade` 除以 10 来确定，得到 0 到 10 之间的整数值（假设输入了有效成绩）。该结果被用 `switch` 的表达式，为 60 分及以上的成绩打印各种消息，并对所有其他值打印默认语句。\n\
  \n注意，任何 `switch` 语句都可以实现为一组嵌套的 `if` 语句。然而，嵌套的 `if` 语句会让人类阅读者难以理解，并且在实现和调试时容易出错。但由于\
  \ `switch` 只能评估相等性，有时嵌套的 `if` 语句是必要的。这取决于具体情况。\n\n**自测习题（答案见附录 N）**\n- SR 6.1 当\
  \ Java 程序运行时，如果为 `switch` 语句评估的表达式与该语句关联的任何 `case` 值都不匹配，会发生什么？\n- SR 6.2 如果 `switch`\
  \ 语句中的 `case` 不以 `break` 语句结束，会发生什么？\n- SR 6.3 如果用户输入 72，`GradeReport` 程序的输出是什么？如果用户输入\
  \ 46 呢？如果用户输入 123 呢？\n\n**第 6 章 更多条件与循环**\n\nSR 6.4 将以下嵌套的 `if` 语句转换为等效的 `switch`\
  \ 语句。\n\n```java\nif (num1 == 5)\n    myChar = 'W';\nelse\n    if (num1 == 6)\n\
  \    myChar = 'X';\nelse\n    if (num1 == 7)\n    myChar = 'Y';\nelse\n    myChar\
  \ = 'Z';\n```\n\n## 6.2 条件运算符\n\nJava 的 `条件运算符`（conditional operator）在某些方面与 `if-else`\
  \ 语句相似。它是一个`三元运算符`（ternary operator），因为它需要三个操作数。条件运算符的符号通常写为 `?:`，但它与其他运算符的区别在于，组成它的两个符号总是分开分开的。下面是一个包含条件运算符的表达式示例：`(total\
  \ > MAX) ? total + 1 : total * 2;`。\n\n`?` 之前是一个布尔条件。`?` 之后是两个用 `:` 符号隔开的表达式。如果条件为真，整个条件表达式返回第一个表达式的值；如果条件为假，则返回第二个表达式的值。\n\
  \n**核心概念**\n请记住，这个示例是一个返回值的表达式。条件运算符仅仅是一个运算符，而不是一个独立存在的、基于语句的两个可能值之一的状态。通常我们希望对该值进行某些操作，例如将其赋值给变量：`total\
  \ = (total > MAX) ? total + 1 : total * 2;`。\n\n条件运算符和条件语句之间的区别可能是细微的。在许多方面，`?:`\
  \ 运算符允许我们形成简洁的逻辑，作为简写的 `if-else` 语句。前一个语句在功能上与以下代码等效，但有时比后者更方便：\n\n```java\nif (total\
  \ > MAX)\n    total = total + 1;\nelse\n    total = total * 2;\n```\n\n让我们再看两个例子。考虑以下声明：`int\
  \ larger = (num1 > num2) ? num1 : num2;`。\n\n如果 `num1` 大于 `num2`，则返回 `num1` 的值并用于初始化变量\
  \ `larger`。如果没有，则返回 `num2` 的值并用于初始化 `larger`。同样，下面的语句打印两个值中的较小：`System.out.println(\"\
  Smaller: \" + ((num1 < num2) ? num1 : num2));`。\n\n条件运算符有时有助于评估短条件并返回结果。然而，它不是 `if-else`\
  \ 语句的替代，因为 `?:` 运算符的操作数是表达式，而不一定是完整的语句。即使条件运算符是一个行的替代方案，你也应该谨慎地使用它，因为它可能比 `if-else`\
  \ 语句更易读。\n\n**自测习题（答案见附录 N）**\n- SR 6.5 条件运算符和条件语句之间的区别是什么？\n- SR 6.6 写一个声明，如果布尔变量\
