  \ 方法呢？请解释。\n\n## 9.5 为继承设计\n\n作为面向对象软件的一个主要特征，继承这一**核心概念**在软件设计期间必须仔细且具体地处理。软件设计必须仔细且具体地处理继承。对继承关系稍加思考可以导致一个更加优雅的设计，这在长期来看将产生巨大的回报。\n\
  \n![](img/index-494_1.png)\n\n## 9.5 为继承设计\n\n在本章中，通过对 Java 继承细节的讨论，已经解决了几个设计问题。以下列表总结了您在程序设计阶段应该记住的某些继承问题：\n\
  \n- 每一个派生都应该是一个 `is-a`（是一个）关系。子类应该是父类的更具体的版本。\n- 设计类层次结构以利用目前的重用以及未来的潜在重用。\n- 当在问题领域中确定类和对象时，寻找它们的共同点。根据一致性和易于维护的需要，将共同特征推到类层次结构中合适的位置。\n\
  - 适时地重写方法，以定制或更改子类的功能。\n- 根据需要向子类添加新变量，但不要遮蔽（重新定义）任何已继承的变量。\n- 允许每个类管理自己的数据。因此，使用\
  \ `super` 引用来调用父类的构造函数，并在适当的情况下调用重写的方法版本。\n- 使用接口创建一个承担多重角色的类（模拟多继承）。\n- 设计类层次结构以适应应用程序的需求，并注意其在未来的用途。\n\
  - 即使目前没有使用，也要在子类中重写 `toString` 和 `equals` 等通用方法，以防继承的版本引起意外问题。\n- 使用抽象类为层次结构下方的具体类指定通用的类接口。\n\
  - 仔细使用可见性修饰符，在不破坏封装的情况下提供派生类所需的访问。\n\n## 限制继承\n\n我们多次看到在声明中使用 `final` 修饰符来创建常量。`final`\
  \ 修饰符的其他用法涉及继承并对软件设计产生显著影响。具体来说，`final` 修饰符可以限制与继承有关的能力。\n\n在本章前面，我们提到过方法可以声明为 `final`，这意味着它在扩展它的类中不能被重写。`final`\
  \ 方法通常用于强制要求在所有子类中使用特定的功能。\n\n## 第 9 章 继承\n\n`final` 修饰符也可以应用于整个类。`final` 类完全不能被扩展。考虑以下声明：\n\
  \n```java\npublic final class Standards\n{\n// 任意内容\n}\n```\n\n给定此声明，`Standards`\
  \ 类不能用于另一个类的 `extends` 子句中。在这种情况下，编译器将生成错误信息。`Standards` 类可以正常使用，但它不能作为另一个类的父类。\n\
  \n\n\n\n使用 `final` 修饰符来限制继承能力是一项关键的设计决策。在某些情况下，如果子类可能被用来更改你（设计者）特别希望以特定方式处理的功能，就应该使用这种限制。\n\
  \n这个问题在第 10 章讨论多态时会再次出现。\n\n### 自测习题\n*(答案见附录 N)*\n\n- `SR 9.18` 继承派生表示 `is-a`（是一个...）关系意味着什么？\n\
  - `SR 9.19` 类的共同特征应该出现在类层次体系的什么位置？为什么？\n- `SR 9.20` 如何定义一个具有多个角色的类？\n- `SR 9.21`\
