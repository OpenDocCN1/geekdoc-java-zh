  \n*类库*是一组支持程序开发**核心概念**的类。编译器或开发环境通常会带有一个类库。类库在开发程序时提供用的支持。类库也可以通过第三方供应商单独获取。类库中的类包含许多方法，这些方法对程序员来说通常非常有价值，因为它们提供了特殊功能。事实上，程序员往往会依赖类库中的方法，并开始将它们视为语言的一部分。然而，从技术上讲，它们并不属于语言本身。\n\
  \n例如，`String` 类并不是 Java 语言的固有部分。它是 Java 标准类库的一部分，可以在任何 Java 开发环境中找到。构成该库的类是由 Sun\
  \ Microsystems 的员工创建的，他们也是 Java 语言的创建者。\n\n类库由几个相关的类簇组成，通常称为 Java APIs，全称为*应用程序编程**接口*。例如，当我们谈论帮助我们编写与数据库交互的程序的类集时，我们可以提到\
  \ Java 数据库 API。API 的另一个例子是 Java Swing API，它指的是一组定义了图形用户界面中使用的特殊图形组件的类。通常，整个标准库被通泛称为\
  \ Java API。\n\nJava 标准类库的类也被**核心概念**地组织成*包*（packages）。每个类都是某个特定包的一部分。例如，`String`\
  \ 类是 `java.lang` 包的一部分。`System` 类也是 `java.lang` 包的一部分。我们在第 2 章中提到，`Scanner` 类是 `java.util`\
  \ 包的一部分。包的组织比 API 名称更基础。虽然包和 API 名称之间存在通用对应关系，但构成给定 API 的类可能会跨越包。\n\n## 3.3 包\n\n\
