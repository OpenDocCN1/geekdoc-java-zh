  在第 1 章中，我们讨论了 Java 程序的 Basic 结构，包括注释、标识符和空白的使用，并以 Lincoln 程序作为示例。第 1 章还涵盖了对象、方法等概念。如有必要，请回顾这些思想。\n\
  \n字符字符串是 Java 中由 `String` 类定义的对象。由于字符串对编程至关重要，Java 提供了使用双引号限定的字符串字面量的功能，正如我们在之前的示例所示。以下是字符串字面量的示例：\n\
  \n\"The quick brown fox jumped over the lazy dog.\"\n\"602 Greenbriar Court, Chalfont\
  \ PA 18914\"\n\"x\"\n\"\"\n\n**注意：** 最后一个示例没有任何字符。\n\n### print 和 println 方法\n\n\
  在第 1 章的 Lincoln 程序中，我们调用了 `println` 方法：`System.out.println(\"Whatever you are, be\
  \ a good one.\");` 该语句演示了对象。`System.out` 对象代表输出设备或文件，默认是显示器。更准确地说，该对象的名称为 `out`并存储在\
  \ `System` 类中。\n\n`println` 方法是 `System.out` 对象为我们提供的服务。每当我们请求时，它都会打印字符字符串。我们可以说将\
  \ `println` 消息发送给 `System.out` 对象以便打印某些文本。\n\n我们发送给方法的每个数据单元被称为参数。在这种情况下，`println`\
  \ 方法只接受一个参数：要打印的字符字符串。\n\n![](img/index-86_1.png)\n\n`System.out` 对象还提供了我们可以使用的另一种服务：**核心概念**。`print`\
  \ 和 `println` 之间的区别很小但很重要。`println` 方法打印发送它的信息，然后移动到下一行的开头。`print` 方法与 `println`\
  \ ，但在完成后不会跳转到下一行。\n\n列表 2.1 所示的程序被称为 `Countdown`，它调用了 `print` 和 `println` 方法。仔细比较\
  \ `Countdown` 程序的输出（位于程序列表底部）与程序代码。注意 \"Liftoff\" 一词与前几个单词在同一行，尽管它是使用 `println`\
  \ 方法打印的。记住，`println` 方法在传递给它的信息打印*之后*才会移动到下一行的开头。\n\n```java\n//****************************************************\n\
  //\n\nCountdown.java\n\nAuthor: Lewis/Loftus\n\n//\n\n// 演示 print 和 println 的区别。\n\
  ```\n\n\n\n\n```java\n//********************************************************************\n\
  public class Countdown\n{\n    //-----------------------------------------------------------------\n\
  \    // 输出两行代表火箭倒计的输出。\n    //-----------------------------------------------------------------\n\
  \    public static void main(String[] args)\n    {\n        System.out.print(\"\
  Three... \");\n        System.out.print(\"Two... \");\n        System.out.print(\"\
  One... \");\n        System.out.print(\"Zero... \");\n        System.out.println(\"\
  Liftoff!\");\n        // 显示在第一行输出\n        System.out.println(\"Houston, we have\
  \ a problem.\");\n    }\n}\n```\n\n**输出**\nThree... Two... One... Zero... Liftoff!\n\
  Houston, we have a problem.\n\n# 86\n# 第 2 章 数据与表达式\n\n### 字符串拼接\n\n字符串字面量在程序中不能跨多行。以下程序语句语法是错误的，在尝试编译时会产生错误：\n\
  \n```java\n// 以下语句将无法编译\nSystem.out.println(\"The only stupid question is the one\
  \ that is not asked.\");\n```\n\n当我们想要打印一个长到无法在程序一行中显示的字符串时，可以依靠*字符串拼接*（string concatenation）将一个字符串附加到另一个字符串的末尾。\n\
  \n字符串拼接运算符是加号（`+`）。以下表达式将一个字符字符串与另一个字符串拼接，产生一个较长的字符串：\n\n`\"The only stupid question\
  \ is \" + \"the one that is not asked.\"`\n\n列表 2.2 所示的 `Facts` 程序包含几个 `println`\
  \ 语句。第一个语句打印了一句较长的句子，无法放入程序的一行中。由于字符字面量在程序中不能跨行，我们将字符串拆分为两部分，并使用字符串拼接将它们连接。因此，第一个\
  \ `println` 语句中的字符串拼接操作产生一个大字符串，并将其传递给该方法进行打印。\n\n注意，我们不需要向 `println` 方法传递任何信息，如\
  \ `Facts` 程序的第二行所示。此调用不会打印任何可见字符，但它会移动到输出的下一行。因此，在这种情况下，调用不带参数的 `println` 效果是打印一个空行。\n\
  \n`Facts` 程序中的最后三次 `println` 调用展示了关于字符串拼接的另一个有趣现象：字符串可以与数字拼接。注意这些行中的数字没有包含在双引号中，因此它们不是字符字符串。在这些情况下，数字会自动转换为字符串，然后将两个字符串进行拼接。\n\
  \n由于我们正在打印特定的值，我们完全可以将数值作为字符串字面量的一部分包含，例如：\n\n`\"Speed of ketchup: 40 km per year\"\
  `\n\n数字是字符，可以根据需要包含在字符串中。我们在 `Facts` 程序中将它们分开是为了演示拼接字符串和数字的能力。这种技术在接下来的示例将非常有用。\n\
  \n你可以想象的，`+` 运算符也用于算术加。\n\n因此，`+` 运算符的作用取决于它所操作的数据类型。如果 `+` 运算符的操作数中有一个或两个都是字符串，就会执行字符串拼接。\n\
  \n## 2.1 字符字符串\n# 87\n# 列表 2.2\n\n```java\n//********************************************************************\n\
  // Facts.java 作者：Lewis/Loftus\n//\n// 展示了字符串拼接运算符的使用以及\n// 到字符串的自动转换。\n//********************************************************************\n\
  public class Facts\n{\n    //-----------------------------------------------------------------\n\
  \    // 打印各种事实。\n    //-----------------------------------------------------------------\n\
  \    public static void main(String[] args)\n    {\n        // 字符串可以拼接成一个长字符串\n\
  \        System.out.println(\"We present the following facts for your \"\n     \
  \   + \"extracurricular edification:\");\n        System.out.println();\n      \
  \  // 字符串可以包含数字\n        System.out.println(\"Letters in the Hawaiian alphabet:\
  \ 12\");\n        // 数值可以拼接到字符串上\n        System.out.println(\"Dialing code for\
  \ Antarctica: \" + 672); \n        System.out.println(\"Year in which Leonardo da\
  \ Vinci invented \"\n        + \"the parachute: \" + 1515);\n        System.out.println(\"\
  Speed of ketchup: \" + 40 + \" km per year\");\n    }\n}\n```\n\n**输出**\nWe present\
  \ the following facts for your extracurricular edification:\nLetters in the Hawaiian\
  \ alphabet: 12\nDialing code for Antarctica: 672\nYear in which Leonardo da Vinci\
  \ invented the parachute: 1515\nSpeed of ketchup: 40 km per year\n\n# 88\n# 第 2\
  \ 章 数据与表达式\n\n列表 2.3 所示的 `Addition` 程序演示了字符串拼接与算术加之间的区别。`Addition` 程序使用了四次 `+` 运算符。在第一次调用\
  \ `println` 时，两个 `+` 操作都执行了字符串拼接，因为运算符是从左到右执行的。第一个运算符将字符串与第一个数字（`24`）拼接，创建一个更大的字符串。然后，该字符串又与第二个数字（`45`）拼接，创建一个更大的字符串，并被打印出来。\n\
  \n在第二次调用 `println` 时，我们使用括号将 `+` 操作与两个数值操作数分组。这强制让该操作先发生。\n\n由于两个操作数都是数字，在算术运算 `LISTING\
  \ 2.3` 中，数字被相加。\n\n```java\n//********************************************************************\n\
  // Addition.java 作者：Lewis/Loftus\n//\n// 展示了加法运算符与字符串\n//拼接运算符之间的区别。\n//********************************************************************\n\
  public class Addition\n{\n    //-----------------------------------------------------------------\n\
  \    // 拼接并加两个数字并打印结果。\n    //-------------------------------------------------\n\
  \    public static void main(String[] args)\n    {\n        System.out.println(\"\
  24 and 45 concatenated: \" + 24 + 45); \n        System.out.println(\"24 and 45\
  \ added: \" + (24 + 45));\n    }\n}\n```\n\n**输出**\n24 and 45 concatenated: 2445\n\
  24 and 45 added: 69\n\n# 90\n感，产生结果 `69`。然后该数字与字符串拼接，产生一个更大的字符串并被打印出来。\n\n我们将在本章稍后形式化优先级规则时，再次讨论这种情况。\n\
  \n由于双引号字符（`\"` ）在 Java 语言中用于指示字符串的开始和结束，我们必须使用一种特殊技术来打印引号字符。如果我们简单地将其放入字符串中（ `\"\
  \"\"` ），编译器会困惑，因为它认为第二个双引号字符是字符串的结束，并且不知道如何处理第三个字符。这会导致编译时错误。\n\n为了解决这个问题，Java 定义了若干种*转义序列*（escape\
  \ sequences）。转义序列以反斜杠字符（`\\` ）开头，该字符指示随后的字符或字符序列应以特殊方式解释，否则会导致编译问题。图 2.1 列出了 Java\
  \ 转义序列。\n\n列表 2.4 中的程序名为 `Roses`，它打印类似于诗歌的文本。尽管这首诗有多行，但它只使用了一个 `println` 语句来实现这一目标。注意整个字符串中使用的转义序列。`\\\
  n` 转义序列强制输出到新行，而 `\\t` 转义序列表示制表符字符。`\\\"` 转义序列确保引号字符被视为字符串的一部分，而不是字符串的终止，从而使其能够作为输出的一部分被打印。\n\
  \n\n\n\n\n# 含义\n\n- `\\b`: 退格格\n- `\\t`: 制表符\n- `\\n`: 换行\n- `\\r`: 回车\n- `\\\"\
  `: 双引号\n- `\\'`: 单引号\n- `\\\\`: 反斜杠\n\n**图 2.1** Java 转义序列\n\n# 第 2 章 数据与表达式\n\n\
  ## 列表 2.4\n```java\n//********************************************************************\n\
  // Roses.java 作者: Lewis/Loftus\n//\n// 展示转义序列的使用。\n//********************************************************************\n\
  public class Roses\n{\n    //-----------------------------------------------------------------\n\
  \    // 在多行上打印一首（某种）诗。\n    //-----------------------------------------------------------------\n\
  \    public static void main(String[] args)\n    {\n        System.out.println(\"\
  Roses are red,\\n\\tViolets are blue,\\n\" +\n        \"Sugar is sweet,\\n\\tBut\
  \ I have \\\"commitment issues\\\",\\n\\t\" +\n        \"So I'd rather just be friends\\\
  n\\tAt this point in our \" +\n        \"relationship.\");\n    }\n}\n```\n\n###\
  \ 输出\n```\nRoses are red,\nViolets are blue,\nSugar is sweet,\nBut I have \"commitment\
