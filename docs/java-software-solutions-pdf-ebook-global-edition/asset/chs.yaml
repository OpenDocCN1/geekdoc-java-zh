  \ 类 `payday` 方法中的以下行代码调用了哪个 `pay` 方法？\n```java\namount = staffList[count].pay();\n\
  ```\n\n\n\n\n# 528\n# 第 10 章 多态\n\n## 10.3 通过接口实现多态\n\n现在让我们来看看如何使用 `Key Concept`\
  \ 接口创建多态引用。正如我们多次看到的那样，类名可以用来声明对象引用变量的类型。同样，接口名也可以用作引用变量的类型。接口引用变量可以指向任何实现了该接口的任何类的对象。\n\
  \n假设我们如下定义一个名为 `Speaker` 的接口：\n\n```java\npublic interface Speaker\n{\n    public\
  \ void speak();\n    public void announce(String str);\n}\n```\n\n现在，接口名 `Speaker`\
  \ 可以用来声明一个对象引用变量：\n\n```java\nSpeaker current;\n```\n\n引用变量 `current` 可以指向任何实现了\
  \ `Speaker` 接口的任何类的对象。例如，如果我们定义了一个名为 `Philosopher` 的类并使其实现了 `Speaker` 接口，那么我们就可以如下所示将一个\
  \ `Philosopher` 对象赋值给 `Speaker` 引用：\n\n```java\ncurrent = new Philosopher();\n```\n\
  \n这种赋值是有效的，因为 `Philosopher` 是一个 `Speaker`。从这个意义上说，类与其接口之间的关系与子类与其父类之间的关系相同。这是一种“是”（is-a）的关系。这种关系构成了多态的基础。\n\
  \n接口引用的灵活性允许我们创建多态引用。正如我们在在本章早期看到的，通过继承，我们可以创建多态引用，只要这些对象之间存在继承关系，就可以指向对象集合中的任何一个。使用接口，我们可以在实现相同接口的对象之间创建类似的多态引用。\n\
  \n例如，如果我们创建一个名为 `Dog` 的类，它也实现了 `Speaker` 接口，那么它也可以被赋值给 `Speaker` 引用变量。事实上，同一个引用变量可以在某一点指向一个\
  \ `Philosopher` 对象，稍后又指向一个 `Dog` 对象。接下来的代码说明了这一点：\n\n![](img/index-530_1.png)\n\n\
  # 529\n## 10.3 通过接口实现多态\n\n```java\nSpeaker guest;\nguest = new Philosopher();\n\
  guest.speak();\nguest = new Dog();\nguest.speak();\n```\n\n在这段代码中，第一次调用 `speak`\
  \ 方法时，它调用了在 `Philosopher` 类中定义的 `speak` 方法。第二次调用时，它调用了 `Dog` 类的 `speak` 方法。与通过继承实现多态引用一样，决定调用哪个方法的不是引用的类型，而是在调用瞬间引用所指向的对象的类型。\n\
  \n请注意，当我们使用接口引用变量时，我们只能调用接口中定义的方法，即使它所引用的对象有其他它可以响应的方法。例如，假设 `Philosopher` 类还定义了一个名为\
  \ `pontificate` 的公有方法。那么以下代码的第二行将产生编译错误，尽管该对象实际上可以响应 `pontificate` 方法：\n\n```java\n\
  Speaker special = new Philosopher();\nspecial.pontificate(); // 产生编译错误\n```\n\n\
  问题在于，编译器只能确定该对象是一个 `Speaker`，因此只能保证该对象可以响应 `speak` 和 `announce` 方法。因为引用变量 `special`\
  \ 可能会指向一个 `Dog` 对象（该对象不能执行 `pontificate`），所以它不允许进行该调用。如果我们在特定情况下知道这种调用是有效的，我们可以将对象强制转换为适当的引用，以便让编译器接受它，如下所示：\n\
  \n```java\n((Philosopher)special).pontificate();\n```\n\n正如我们可以对基于继承的多态引用所做的那样，接口名可以用作方法参数的类型。方法的参数可以是接口类型，任何实现了该多态接口的任何类的对象都可以传递给方法，从而允许方法对其参数进行灵活的控制。例如，以下方法接受一个\
  \ `Speaker` 对象作为参数。因此，在不同的调用中，`Dog` 对象和 `Philosopher` 对象都可以传递给它：\n\n```java\npublic\
  \ void sayIt(Speaker current)\n{\n    current.speak();\n}\n```\n\n# 530\n# 第 10\
  \ 章 多态\n\n将多态引用作为方法的形式参数是一项强大的技术。它允许方法控制传递给参数的类型，同时赋予了方法接受各种类型参数的灵活性。\n\n**自测复习题（答案见附录\
  \ N）**\nSR 10.10 如何使用接口实现多态？\nSR 10.11 假设 `Speaker` 接口以及 `Philosopher` 和 `Dog` 类如本节所述。以下语句序列是否合法？请解释原因。\n\
  a. `Speaker current = new Speaker();`\nb. `Speaker current = new Dog();`\nc. `Speaker\
  \ first, second; first = new Dog(); second = new Philosopher(); first.speak(); first\
  \ = second;`\nd. `Speaker first = new Dog(); Philosopher second = new Philosopher();\
  \ second.pontificate(); first = second;`\ne. `Speaker first = new Dog(); Philosopher\
  \ second = new Philosopher(); first = second; second.pontificate(); first.pontificate();`\n\
  \n## 10.4 排序\n\n让我们来看一个适合多态解决方案的问题。*排序*是按照定义良好的顺序对项目列表进行排列的过程。例如，你可能对姓名列表按字母顺序排序，或将调查结果列表按数字降序排列。多年来，人们已经开发并改进了许多排序算法。事实上，排序被认为是计算机科学中的一个经典研究领域。\n\
  \n本节研究了两种排序算法：选择排序和插入排序。对各种排序技术的全面涵盖超出了本书的范围。相反，我们介绍了该主题并建立了一些基本思想。\n\n# 531\n##\
  \ 10.4 排序\n\n### 选择排序\n\n*选择排序*算法通过不断将值放在其最终的排序位置来对值列表进行排序。换句话说，对于列表中的每个位置，算法都选择应该放在该位置的值并将其放在那里。让我们考虑将一个数值列表按升序排列的问题。\n\
  \n选择排序的通用策略是：扫描整个列表以找到最小值。将该值与列表第一个位置的值交换。扫描列表的剩余部分（除第一个值以外的所有值）找到最小值，然后将其与列表第二个位置的值交换。扫描列表的剩余部分（除前两个值以外的所有值）找到最小值，然后将其与列表第三个位置的值交换。继续这个过程，直到列表最后一个位置（该位置最终将包含最大值）。\n\
  \n当过程完成后，列表就被排序了。图 10.2 展示了选择排序算法的使用。\n\n```text\n3 9 6 1 2\n从 3 开始向右扫描。\n1 是最小值。交换\
  \ 1 和 3。\n1 9 6 3 2\n从 9 开始向右扫描。\n2 是最小值。交换 9 和 2。\n1 2 6 3 9\n从 6 开始向右扫描。\n3 是最小值。交换\
  \ 6 和 3。\n1 2 3 6 9\n从 6 开始向右扫描。\n6 是最小值。交换 6 和 6。\n1 2 3 6 9\n```\n\n**图 10.2**\
  \ 选择排序处理\n\n![](img/index-533_1.png)\n\n# 532\n# 第 10 章 多态\n\n让我们来看一个例子。列表 10.8\
  \ 所示程序使用选择排序将 `Contact` 对象列表按升序排列。\n\n列表 10.9 显示了 `Sorting` 类。它包含了两个静态排序算法。\n\n\n\
  \n\n\n`PhoneList` 程序仅使用了 `selectionSort` 方法。另一种方法将在本节的后部分进行讨论。\n\n`selectionSort`\
  \ 方法接收一个 `Comparable` 对象的数组进行排序。\n\n请记住，`Comparable` 是一个接口，它只包含一个方法 `compareTo`。该方法的设计用于返回一个整数：如果执行对象小于、等于或大于所比较的对象，则分别返回小于零、零或大于零的整数。\n\
  \n任何实现 `Comparable` 接口的类都必须定义 `compareTo` 方法。因此，任何此类对象都可以与另一个对象进行比较，以确定它们的相对顺序。\n\
  \n`selectionSort` 方法是多态的。注意，它完全没有引用 `Contact` 对象，但被用于对 `Contact` 对象的数组进行排序。`selectionSort`\
  \ 方法被设置为对任何对象数组排序，只要这些对象可以通过比较来确定它们的顺序。你可以多次调用 `selectionSort` 并传入不同类型的对象数组，只要它们都实现了\
  \ `Comparable` 即可。\n\n每个 `Contact` 对象代表一个具有姓、名和电话号码的人。列表 10.10 显示了 `Contact` 类。\n\
  \n### 实现排序算法\n\n`Contact` 类实现了 `Comparable` 接口，并以多态方式允许对该可比较对象集中的任何对象进行排序，因此提供了\
  \ `compareTo` 方法定义。在这种情况下，联系人按姓排序；如果两个联系人的姓相同，则使用他们的名。\n\n`selectionSort` 方法的实现使用了两个\
  \ `for` 循环来对数组排序。外层循环控制数组中存储下一个最小值的位置。内层循环通过扫描所有大于或等于外层循环指定索引的位置，在剩余列表中找到最小值。当确定了最小值后，将其与存储在索引处的值进行交换。这种交换通过使用一个名为\
  \ `temp` 的额外变量通过三条赋值语句完成。这种交换操作通常被称为“交换（swapping）”。\n\n注意，由于该算法在每次迭代中都会寻找最小值，因此结果是一个升序排列的数组（即从小到大）。该算法可以很容易更改为通过每次寻找最大值来将值按降序排列。\n\
  \n同样注意，我们设置的排序方法是为对象数组排序的。因此，如果你的目标是对基本类型的数组进行排序（例如整数值数组），则必须将其放入 `Integer` 对象数组中才能进行处理。所有的包装类都实现了\
  \ `Comparable` 接口。\n\n## 10.4 排序\n\n**533**\n\n#### 列表 10.8\n```java\n//********************************************************************\n\
