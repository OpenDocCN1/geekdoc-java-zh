  \ne. `arrowRight.gif`\n\n# 附录 n 自测题答案 799\n\n# 第 9 章 继承\n\n## 9.1 创建子类\n\nSR 9.1\
  \ 子类通过继承派自父类。父类方法和变量会自动成为子类的一部分，但须取决于声明它们时使用的可见性修饰符规则。\n\nSR 9.2 因为新类可以派生自现有类，所以可以重用父类的特性，而无需经历易出错的代码复制和修改过程。\n\
  \nSR 9.3 每次继承派生都应该表示一种 `is-a`（是一个）的关系：子类父类的一个更具体的版本。如果这种关系不成立，则说明继承的使用不当。\n\nSR\
  \ 9.4 `protected` 修饰符建立了一个考虑继承的可见性级别（类似于 public 和 private）。用 `protected` 可见性声明的变量或方法可以在派生类中通过名称进行引用，同时保留了某种程度的封装。`protected`\
  \ 可见性允许从同一包中的任何类访问。\n\nSR 9.5 `super` 引用可以调用父类的构造函数，构造函数不能直接通过名称调用。它还可以用于调用父类中重写方法的版本。\n\
  \nSR 9.6 \n\n```java\npublic class SchoolBook2 extends Book2\n{\n    private int\
  \ ageLevel;\n    //---------------------------------------------------\n    // 构造函数：根据指定的页数和年龄段\n\
  \    // 设置教科书（假设在 4 到 16 岁之间）。\n    //---------------------------------------------------\n\
  \    public SchoolBook2(int numPages, int age)\n    {\n        super(numPages);\n\
  \        ageLevel = age;\n    }\n    //---------------------------------------------------\n\
  \    // 返回描述年龄段的字符串。\n    //---------------------------------------------------\n\
  \    public String level()\n    {\n        if (ageLevel <= 6)\n            return\
  \ \"Pre-school\";\n        else\n            if (ageLevel <= 9)\n              \
  \  return \"Early\";\n        else\n            if (ageLevel <= 12)\n          \
  \      return \"Middle\";\n            else\n                return \"Upper\";\n\
  \    }\n}\n```\n\nSR 9.7 在单继承中，类仅派生自一个父类；而在多继承中，类可以派生自多个父类，继承每个父类的属性。多继承的问题在于，当两个或多个父类都提供了同名的属性或方法时，必须解决冲突。Java\
  \ 只支持单继承。\n\n## 9.2 重写方法\n\nSR 9.8 子类可能倾向于使用自己的方法定义，而不是父类提供的定义。在这种情况下，子类用自己的定义重写（重定义）父类的定义。\n\
  \nSR 9.9 答案是：\n\na. 正确 – 如果两个方法具有相同的签名，则子类“重写”了父类的方法定义。\n\nb. 错误 – 构造函数是一个没有返回类型的特殊方法，其名称与类名相同。如果你尝试重写父类的构造函数，将产生语法错误，因为除构造函数外所有方法都有返回类型。\n\
  \nc. 错误 – `final` 方法不能被重写（这就是为什么它是“final”的）。\n\nd. 错误 – 反之，在用继承时，经常需要重写父类的方法。\n\n\
  e. 正确 – 这种变量被称为 `shadow`（隐影）变量。你可以这样做，但这可能会导致混淆，且不建议这样使用。\n\n## 9.3 类层次结构\n\nSR\
  \ 9.10 这个问题有许多可能的答案。\n\nSR 9.11 Java 中的所有类都直接或间接地派生自 `Object` 类。因此，`Object` 的所有公共方法（如\
  \ `equals` 和 `toString`）对所有对象都可用。\n\n# 附录 n 自测题答案 801\n\nSR 9.12 Java 中没有父类的类是 `Object`\
  \ 类。\n\n正如上一个答案所述，所有类都派生自 `Object`。`Object` 是 Java 继承树的根。\n\nSR 9.13 抽象类是通用概念的表示。公共特性和方法签名可以在抽象类中定义，以便派出的子类继承。\n\
  \nSR 9.14 将抽象类定义为 `final` 是自矛盾的。抽象类因为包含抽象方法是不完整的。通常这些方法的定义由扩展抽象类的类来完成。但 `final`\
  \ 类不能被扩展，因此没有办法完成其定义。\n\nSR 9.15 新接口可以通过继承派生自现有接口，正如新类可以派生自现有类一样。\n\n## 9.4 可见性\n\
  \nSR 9.16 如果类成员具有 `private` 可见性，则不会继承，这意味着在子类中无法通过名称引用。然而，这些成员对子类仍然存在，并且可以间接引用。\n\
  \nSR 9.17 `Pizza` 类可以显式引用 `servings` 变量，因为它被声明为 `protected` 可见性。然而，它不能显式引用 `calories`\
  \ 方法，因为 `calories` 方法被声明为 `private`。\n\n## 9.5 为继承设计\n\nSR 9.18 当子类表示父类的一个更具体的版本时，继承派生表示一种\
