  \ bluray)\n    {\n        if (count == collection.length)\n        {\n         \
  \   increaseSize();\n        }\n        collection[count] = new DVD(title, director,\
  \ year, cost, bluray);\n        totalCost += cost;\n        count++;\n    }\n\n\
  \    //-----------------------------------------------------------------\n    //\
  \ 返回描述集合的报告。\n    //-----------------------------------------------------------------\n\
  \    public String toString()\n    {\n        NumberFormat fmt = NumberFormat.getCurrencyInstance();\n\
  \        String report = \"~~~~~~~~~~~~~~~~~~~~~~~~~\\n\";\n        report += \"\
