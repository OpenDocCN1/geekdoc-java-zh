  ## 8.5 变长列表\n\n假设我们想设计一个在每次调用之间处理不同数据的方法。例如，设计一个名为 `average` 的方法，它接受一些整数并返回它们的平均值。在方法的一次调用中，我们传递三个整数：`mean1\
  \ = average(42, 69, 37);`\n\n在方法的另一个调用中，我们传递七个整数：`mean2 = average(35, 43, 93, 23,\
  \ 40, 21, 75);`\n\n为了实现这一点，我们可以定义 `average` 方法的重载版本，但这我们需要可能的可能的参数数量并为每种情况创建一个单独的版本。或者，我们可以定义方法接受一个整数数组，该数组的每次调用的大小不同。但这需要在调用方法中将整数封装成数组并传递参数。\n\
  \nJava 提供了一种定义接受变长参数列表的方法。通过在方法的形式参数列表中使用特殊语法，我们可以定义方法接受任意数量的参数。这些参数被自动放入一个数组中以便在方法中处理。例如，`average`\
  \ 方法可以写成：\n\n```java\npublic double average(int ... list)\n{\n    double result\
  \ = 0.0;\n    if (list.length != 0)\n    {\n        int sum = 0;\n        for (int\
  \ num : list)\n            sum += num;\n        result = (double)sum / list.length;\n\
  \    }\n    return result;\n}\n```\n\n注意形式参数定义的方式。省略号（三个点）表示方法接受可数量的参数。在这种情况下，方法接受任意数量的\
  \ `int` 参数，并将其自动放入一个名为 `list` 的数组中。在方法中，我们正常地处理该数组。\n\n\n\n\n现在我们可以向 `average` 方法传递任意数量的\
  \ `int` 参数，甚至可以一个都不传递。这就是为什么在计算平均值之前，我们需要检查数组的长度是否为零。\n\n多个参数的类型可以是任何原始类型或对象类型。例如，下面的方法接受并打印多个\
  \ `Grade` 对象（我们在本章稍早之前定义了 `Grade` 类）：\n\n```java\npublic void printGrades(Grade\
  \ ... grades)\n{\n    for (Grade letterGrade : grades)\n        System.out.println(letterGrade);\n\
  }\n```\n\n接受可变数量参数的方法也可以接受其他参数。例如，下面的方法接受一个 `int`、一个 `String` 对象，以及若干任意数量的 `double`\
  \ 值，这些值将存储在一个名为 `nums` 的数组中：\n\n```java\npublic void test(int count, String name,\
  \ double ... nums)\n{\n    // whatever\n}\n```\n\n可变参数必须位于形式参数列表的最后。一个方法不能接受两组可变参数。\n\
  \n构造函数也可以设置为设置为接受可变数量的参数。\n\n列表 8.11 所示的程序创建了两个 `Family` 对象，向 `Family` 构造函数传递了任意数量的字符串（代表家庭成员姓名）。\n\
