  District is not numeric: TRL2k74A5R-11\nEnter product code (XXX to quit): TRQ2949A6M-04\n\
  Enter product code (XXX to quit): TRV2105A2\nImproper code length: TRV2105A2\nEnter\
  \ product code (XXX to quit): TRQ2778A7R-19\nEnter product code (XXX to quit): XXX\n\
  # of valid codes entered: 4\n# of banned codes entered: 2\n```\n\n在 `try` 块中的编程语句尝试提取区域和地区信息，然后判断它们是否代表被禁的产品代码。如果在提取区域和地区信息时出现任何问题，该产品代码将被视为无效的且不再进一步处理。\n\
  \n\n\n例如，`charAt` 或 `substring` 方法都可能抛出 `StringIndexOutOfBoundsException`。此外，如果\
  \ `substring` 不包含有效的整数，`parseInt` 方法可能会抛出 `NumberFormatException`。程序将根据抛出的异常类型打印特定的消息。在任何情况下，由于异常被捕获并处理，处理将继续进行。\n\
  \n请注意，对于检查的每段代码，只有在没有抛出异常时，整数 `valid` 才会增加。如果抛出了异常，控制将立即转移到相应的 `catch` 子句。同样，`if`\
  \ 语句只有在没有抛出异常时会对 `zone` 和 `district` 进行测试。\n\n![](img/index-571_1.png)\n\n`finally`\
  \ 子句通常用于无论 `try` 块是正常退出还是因为抛出异常而退出，用于管理资源或确保算法的特定部分被执行。\n\n如果没有生成异常，`finally` 子句中的语句将在\
  \ `try` 块完成后执行。如果在 `try` 块中生成了异常，控制将首先转移到相应的 `catch` 子句。在执行异常处理代码后，控制将转移到 `finally`\
  \ 子句并执行其语句。如果存在 `finally` 子句，它必须列在 `catch` 子句之后。\n\n注意，`try` 块完全不需要 `catch` 子句。如果没有\
  \ `catch` 子句，如果情况允许，可以单独使用 `finally` 子句。\n\n## 自复习题（答案见附录 N）\n\nSR 11.4 什么是 `catch`\
