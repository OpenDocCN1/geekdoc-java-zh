  \ `value` 属性设置为零。\n\n## 7.9 测试\n\n“测试”一术可以以多种方式应用于软件开发。测试无疑包含了它的传统定义：即通过各种输入运行已完成的程序以发现问题。但它也包括由人类或机器执行的任何评估，以评估演进系统的质量。这些评估在编写单行代码之前就应该发生。\n\
  \n测试的目标是发现错误。通过发现并修复错误，我们提高了程序的质量。很可能在以后，其他人会发现开发过程中仍然隐藏的错误。错误发现得越早，修复起来就越容易、越便宜。花时间尽早发现问题几乎总是值得的。\n\
  \n![](img/index-373_1.png)\n\n**372**\n\n## 第 7 章 面对象设计\n\n使用特定输入运行程序并产生正确的**核心概念**结果，只能证明程序对于该特定输入是有效的。程序永远无法保证没有错误。随着越来越多的测试用例执行而未发现错误，我们对程序的信心会增加，但我们永远无法真正确定所有错误都已消除。可能一直存在另一个未被发现的错误。因此，以尽可能多的方式和设计良好的测试用例对程序进行彻底测试是非常重要的。\n\
  \n证明程序是正确的可能的，但这种技术对于大型系统来说极其复杂，且证明本身也可能出错错误。\n\n因此，我们通常依赖测试来确定程序的质量。\n\n在确定错误存在后，我们确定错误的原因并修复它。问题修复后，我们应该重新运行之前的测试，以确保在修复问题时没有引入另一个错误。这种技术被称为回归测试。\n\
  \n## 评审\n\n用于评估设计或代码的技术称为评审（review），这是一种会议，其中几个人仔细检查设计文档或代码段。向他人展示我们的设计或代码使我们更仔细地思考它，并允许他人与我们分享建议。参与者讨论其优点和问题，并创建一个必须解决的问题列表。\n\
  \n评审的目标是识别问题，而不是解决问题（解决问题通常需要多得的时间）。\n\n设计评审应该确定需求是否已落实。它还应该评估系统被分解为类和对象的方式。代码评审应该确定设计在多大程度上满足了需求，以及实现在多大程度上代表了设计。它应该识别任何可能导致设计或实现无法履行其职责的特定问题。\n\
  \n有时评审被称为步检（walkthrough），因为其目标是仔细遍历文档并评估每个章节。\n\n## 缺陷测试\n\n由于测试的目标是发现错误，因此它经常被称为缺陷测试（defect\
  \ testing）。\n\n带着这一目标，一个好的测试是能够发现程序中任何缺陷的测试。这听起来可能很奇怪，因为我们最终并不希望系统中出现问题。但请记住，错误几乎肯定存在。我们的测试工作应该尽一切发现它们。我们希望通过发现并修复存在的错误来提高程序的可靠性，这是**核心概念**，而不是让用户去发现它们。\n\
  \n![](img/index-374_1.png)\n![](img/index-374_2.png)\n\n**7.9** 测试\n\n**373**\n\n\
  一个好的测试是能够发现错误的测试。\n\n一个测试用例由一组输入、用户操作或其他初始条件以及预期输出组成。测试用例应该被妥善记录，以便以后根据需要重复执行。\n\
  \n开发者经常创建一个完整的测试套件（test suite），这是一组涵盖了系统各个方面的测试用例。\n\n由于程序在大量可能的输入上运行，因此为所有可能的输入或用户操作创建测试用例是不行的。通常也没有必要测试每一种情况。两个特定的测试用例可能如此相似以至于没有测试程序的独特方面。这样做将是白费精力。我们宁愿执行一个以某种新方式压力程序的测试用例。因此，我们希望仔细选择测试用例。为此，让我们检查两种缺陷测试的方法：黑盒测试和白盒测试。\n\
  \n\n\n\n等价类具有定义的边界。由于一个等价类中的所有值本质上是在测试程序的相同特征，因此在等价边界内部只需要一个测试用例。然而，由于编程经常会产生“差一错误”（off\
  \ by one errors），因此应该对边界上及周围的值进行详尽测试。对于整数边界，一个良好的测试套件应至少包含边界的精确值、边界减 1 的值以及边界加 1\
  \ 的值。还应该定义使用这些情况的测试用例，再加上来自该类别通用区域的至少一个测试用例。\n\n让我们来看一个例子。考虑一个方法，其目的是验证某个特定的整数值是否在\
  \ `0` 到 `99` 范围内（包含边界）。在这种情况下，有三个等价类：`0` 以下的值、`0` 到 `99` 范围内的值以及 `99` 以上的值。黑盒测试要求我们使用位于边界周围和落在边界上的测试值，以及来自等价类的一些通用值。因此，针对这种情况的一组黑盒测试用例可能是：`-500`、`-1`、`0`、`1`、`50`、`98`、`99`、`100`\
  \ 和 `500`。\n\n白盒测试也称为玻璃盒测试，它测试方法的内部结构和实现。白盒测试用例基于代码的逻辑。其目标是确保程序中的每条路径至少执行一次。白盒测试映射了代码中可能的所有路径，并确保测试用例会导致每条路径的执行。这种测试通常被称为`statement\
  \ coverage`。\n\n代码中的路径由各种使用条件表达式（如 `if` 语句）的控制流语句控制。为了确保程序的每条路径至少执行一次，测试用例的输入数据值需要控制条件表达式的值。一个或多个测试用例的输入数据应促使\
  \ `if` 语句的条件在至少一种情况下求为 `true`，在至少另一种情况下求为 `false`。在 `if` 语句中同时覆盖真值和假值可以保证通过 `if`\
  \ 语句的两条路径都会被执行。循环和其他结构也可以创建类似的情况。\n\n在黑盒测试和白盒测试中，在运行测试之前，都应该建立每个测试的预期输出。如果你没有先仔细确定结果应该是什么，很容易就会被测试结果是合理的所说服。\n\
