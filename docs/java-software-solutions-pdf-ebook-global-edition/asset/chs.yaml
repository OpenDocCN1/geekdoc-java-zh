  \n## 4.5 重温构造函数\n\n正如我们在第 2 章中所说的，构造函数类似于在对象实例化时被调用的方法。当我们定义一个类时，通常会定义一个构造函数来帮助我们设置类。特别是，我们经常使用构造函数来初始化与每个相关的变量。\n\
  \n构造函数与普通方法有两点不同。首先，构造函数的名称与类名相同。因此，`Die` 类中构造函数的名称是 `Die`，`Account` 类中构造函数的名称是\
  \ `Account`。其次，构造函数不能返回值，且在方法头中没有指定的返回类型。\n\n程序员经常犯的一个常见错误是在构造函数上加上一个**核心概念**——`void`\
  \ 返回类型。对于编译器来说，在构造函数上放置任何返回类型（即使是 `void`）都会将其变成一个恰好与类名同名的普通方法。因此，它不能作为构造函数被调用。这会导致有时难以读懂的错误信息。\n\
  \n通常，构造函数用于初始化新实例化的对象。例如，`Die` 类的构造函数最初将骰子的面值设置为 1。\n\n`Account` 类的构造函数将实例变量的值设置为作为构造函数参数传入的值。\n\
  \n我们不需要为每个类都定义构造函数。每个类都有一个不带参数的*默认构造函数*。如果我们不提供自己的构造函数，就会使用默认构造函数。这个默认构造函数通常对新创建的对象没有影响。\n\
  \n**自我复习题**（答案见附录 N）\nSR 4.24 构造函数是做什么的？\n\nSR 4.25 构造函数是如何定义的？\n\n## 4.6 图形对象\n\
  \n某些对象具有图形表示，这意味着它们的状态和行为包含了关于对象视觉上看起来什么样的信息。例如，一个图形对象可能包含关于其尺寸和颜色的数据，并可能包含绘制它的方法。\n\
  \n在第 3 章中，我们实例化并使用了如框架（frames）、面板（panels）、标签（labels）和图像（images）等图形组件。这些组件当然可以被认为是图形对象。本节将更详细地检查其中的一些组件，并探索如何定义我们具有图形特征的自定义对象。\n\
  \n列表 4.5 中的程序显示了一个笑脸和一个文本说明。然而，`SmilingFace` 类中的 `main` 方法并没有处理所有这些细节。\n\n相反，`main`\
  \ 方法为程序设置了框架，并使用它来显示 `SmilingFacePanel` 类的实例化。\n\n列表 4.6 显示了 `SmilingFacePanel`\
  \ 类。它定义了两个用于绘图的常量（`BASEX` 和 `BASEY`）、一个设置面板关键部分的构造函数，以及一个名为 `paintComponent` 的方法，该方法负责程序执行时我们看到的脸。在这种情况下，我们并没有向此面板添加\
  \ GUI 组件，而是直接在其上绘图。\n\n注意，`SmilingFacePanel` 类继承了 `JPanel` 类。正如我们在第 2 章讨论 applet\
  \ 时提到的，`extends` 子句建立了继承关系。`SmilingFacePanel` 类继承了 `JPanel` 类的特性。也就是说，一个 `SmilingFacePanel`\
  \ *是一个* `JPanel`。到目前，这就是你对继承真正需要知道的所有内容了，将在第 9 章进行详细讨论。\n\n`SmilingFacePanel` 类的构造函数设置了面板的背景颜色和首选尺寸，还设置了面板的默认字体。注意，这些调用不是对其他对象进行的（就像我们在第\
  \ 3 章创建单独的 `JPanel` 对象那样）。当一个方法在没有扩展 `JPanel` 的情况下通过特定对象被调用时，你可以将其认为对象在“自言自语”。构造函数中的调用是针对\
  \ `SmilingFacePanel` 类所代表的对象进行的。\n\n#### 列表 4.5\n```java\n//********************************************************************\n\
