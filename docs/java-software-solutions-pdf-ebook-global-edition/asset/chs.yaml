  \n![](img/index-404_2.png)\n\n![](img/index-404_3.png)\n\n## 软件故障\n\n## 2003 年东北停电\n\
  \n### 发生了什么？\n\n2003 年 8 月 14 日，美国历史上最大的停电事件袭击了美国东北部和加拿大部分。多个大都市受到此影响，包括纽约、克利夫兰、底特律、多伦多和渥太华。在三分钟内，21\
  \ 家发电厂停止运行，影响了约 5000 万人。\n\n### 东北部停电\n\n典型问题导致了停电区域的情况。交通灯缺失导致了美国的交通问题。火车和电梯被困住。机场航班延误。依赖水泵的供前后供水系统失效。手机使用受到干扰（有线电话仍可用，但在紧急情况下负载过重）。由于服务器宕机和尝试重新路由消息，互联网流量变慢。报告了若干起抢劫事件。\n\
  \n据估计，这次停电的总财务损失在 40 亿到 80 亿美元之间。有 9 人死于与停电相关的各种原因。\n\n### 是什么导致的？\n\n在停电后的几个小时和几天内，许多来源被指为问题的根源。由于\
  \ 2001 年 9 月 11 日袭击后人们意识提高，当局迅速排除了恐怖主义的可能性。整个影响区域的树倒和雷击被归咎为祸首。官员甚至考虑过——但很快排除了——当时正在传播的“Blaster”计算机病毒。\n\
  \n在接下来的几个月里，一个工作小组理了这些问题。确定最初原因是俄亥俄州的阿克隆，那里`FirstEnergy Corp.` 未能对电力线附近的树木进行适当修剪。2003\
  \ 年 8 月 14 日，树枝导致三条电源线同时故障。当此类故障发生时，电力控制中心的操作员负责保持负载平衡。在这种情况下，他们未能做到，因为本该通知他们该问题的计算机报警系统没有正常运行。负载不平衡迅速蔓延到邻的发电厂，导致了连锁停电。\n\
  \n因此，尽管有各种影响因素，但问题的很大一部分是报警系统的故障。这个问题最终被追溯到通用电气公司用于监控报警的计算机中的一个竞态漏洞（race condition\
  \ bug）。\n\n## 403 404 软件故障\n\n计算机程序中的竞态发生在两个或多个并发运行的进程访问某些共享数据时。一个进程在另一个进程读取后对其进行修改，而它们都在错误的假设下继续处理。在这种情况下，三条电源线同时故障导致了竞态，进而导致报警系统失效，而操作员并未察觉到此。产生的问题导致整个系统在不久后崩溃。备份系统由于相同的原因也崩溃了。发现漏洞后，GE\
  \ 发布了一个补丁来修复它。\n\n## 经验教训\n\n这次事件的问题源不在于电力不足，而是由于无法将电力输送到需要的地方。这次停电凸显了现有电力线基础设施的落后，以及依赖自愿规则来维护电网可靠性的危险性。\n\
  \n在软件责任方面，竞态是并发系统中已知的故障源，必须对其进行彻底测试。在像这样涉及重大的情况下，有必要进行形式化分析。\n\n*来源：* CNN.com, WashingtonPost.com\n\
  \n![](img/index-406_1.png)\n\n# 第 8 章 数组\n\n## 本章目标\n\n* 定义并使用数组进行基础数据组织。\n* 讨论边界检查和管理容量的技术。\n\
  * 讨论与数组对象以及对象数组相关的问题。\n* 探索命令行参数的使用。\n* 描述变长参数列表的语法用法。\n* 讨论多维数组的创建和使用。\n* 探索鼠标和键盘事件。\n\
  \n在编程工作中，我们经常希望以易于访问和修改的形式组织对象或原始数据。在第 5 章探索的 `ArrayList` 类正是为了这个目的而使用的。正如类名所示，`ArrayList`\
  \ 是使用数组实现的，数组是数据数据分组为列表的编程结构。在本章中，我们将探索数组的细节，数组是大多数高级语言的基础组成部分。在本章的图形跟踪（Graphics\
  \ Track）部分，我们探索了允许我们绘制复杂多边形的方法，并检查了鼠标和键盘生成的事件。\n\n## 405 406\n\n![](img/index-407_1.png)\n\
  \n## 8.1 数组元素\n\n`array`是一种简单但强大的编程语言结构，用于分组和组织数据。在编写管理大量信息（如 100 个名字的列表）的程序时，为每条数据声明单独的变量是不现实的。数组通过允许声明一个包含多个可单独访问值的值的变量来解决这个问题。\n\
  \n数组是值的列表。每个值都存储在数组中特定的、带有编号的位置。每个位置对应的数字称为索引（`index`）或下标（`subscript`）。图 8.1 显示了一个整数数组以及每个位置对应的索引。该数组名为\
  \ `height`；它包含代表几个英寸高度的整数。\n\n在 Java 中，数组索引始终从 0 开始。因此，存储在索引 5 处的值实际上是数组中的第六个值。图\
  \ 8.1 所示数组有 11 个值，索引从 0 到 10。\n\n要访问数组中的值，我们使用数组名后跟方括号索引。例如，以下表达式引用数组中的第九个值：\n\n\
  核心概念：大小为 N 的数组索引从 0 到 N–1。\n\nheight[8]\n\n根据图 8.1，`height[8]`（读音为 height-sub-eight）包含值\
  \ 79。不要混淆索引的值（在此例中为 8）与存储在该索引处数组的值（在此例中为 79）。\n\n```\nheight\n0 69\n1 61\n2 70 索引\n\
  3 74\n4 62\n5 69 height[5 的值\n6 66\n7 73\n8 79\n9 62\n10 70\n```\n**图 8.1** 一个名为\
  \ height 的包含整数值的数组\n\n## 8.2 声明和使用数组\n\n表达式 `height[8]` 指向存储在特定内存位置的单个整数。它可以在任何可以使用整数变量的地方使用。因此，你可以对其赋值、在计算中使用它、打印它的值等。此外，由于数组索引是整数，你可以使用整数表达式来指定用于访问数组的索引。这些概念在以下代码行中得到了演示：\n\
  \n```\nheight[2] = 72;\nheight[count] = feet * 12;\naverage = (height[0] + height[1]\
  \ + height[2]) / 3;\n```\n\n\n\n\n\n`System.out.println(\"The middle value is \"\
  \ + height[MAX/2]); pick = height[rand.nextInt(11)];`\n\n数组在内存中连续存储，这意味着元素在内存中的存储方式正如我们在概念上构想的那样，一个紧接一个。这使得数组通过索引访问任何特定元素变得极其高效。在内部，为了确定任何特定元素的地址，会将索引乘以每个元素的大小，并加到数组起始点的内存地址上。这就是为什么数组索引从\
  \ 0 开始而不是 1——为了让该计算尽可能简单。因此，从效率的角度来看，访问数组中的第 500 个元素与访问第一个元素一样简单。\n\n### 自我测验（答案见附录\
  \ N）\n\nSR 8.1 什么是数组？\n\nSR 8.2 数组的每个元素是如何被引用的？\n\nSR 8.3 根据图 8.1 所示的数组，以下各项是什么？\n\
  a. `height[1]`\nb. `height[2] + height[5]`\nc. `height[2 + 5]`\nd. 存储在索引 8 处的值\n\
  e. 第四个值\nf. `height.length`\n\n## 8.2 声明和使用数组\n\n在 Java 中，数组是对象。要创建一个数组，必须先声明数组的引用。然后可以使用\
  \ `new` 操作符实例化数组，这会分配内存空间来存储值。以下代码表示图 8.1 所示数组的声明：\n\n```java\nint[] height = new\
  \ int[11];\n```\n\n![](img/index-409_1.png)\n\n**第八章** 数组\n\n变量 `height` 被声明为整数数组，其**核心概念**类型写为\
  \ `int []`。数组中存储的所有值具有相同的类型（或至少是兼容的）。例如，我们可以创建一个存储整数的数组，也可以创建一个存储字符串的数组，但不能创建一个同时存储整数和字符串的数组。存储在数组中的值有时称为*数组元素*，数组所包含的值类型称为数组的*元素类型*。\n\
  \n**列表 8.1**\n\n```java\n//********************************************************************\n\
  // BasicArray.java\n// Author: Lewis/Loftus\n//\n// 演示数组的基本声明和使用。\n//********************************************************************\n\
  public class BasicArray\n{\n    //-----------------------------------------------------------------\n\
  \    // 创建一个数组，填充各种整数值，\n    // 修改其中一个值，然后打印它们。\n    //-----------------------------------------------------------------\n\
  \    public static void main(String[] args)\n    {\n        final int LIMIT = 15,\
  \ MULTIPLE = 10;\n        int[] list = new int[LIMIT];\n        // 初始化数组值\n    \
  \    for (int index = 0; index < LIMIT; index++)\n            list[index] = index\
  \ * MULTIPLE;\n        list[5] = 999;\n\n        // 修改一个数组值\n        // 打印数组值\n\
  \        for (int value : list)\n            System.out.print(value + \" \");\n\
  \    }\n}\n```\n\n**输出**\n0 10 20 30 40 999 60 70 80 90 100 110 120 130 140\n\n\
  注意，数组变量的类型（`int[]`）不包含数组的大小。使用 `new` 操作符实例化 `height` 会预留内存空间来存储索引从 0 到 10 的 11 个整数。一旦数组声明为特定大小的**视频笔记**，它能包含的值数量就无法更改。\n\
  \n### 数组概述\n\n列表 8.1 中的示例创建了一个名为 `list` 的数组，它可以存储 15 个整数，并以每次 10 的增量加载。然后它更改了数组中第六个元素（索引为\
  \ 5）的值。最后，它打印了数组中存储的所有值。图 8.2 显示了数组在 `BasicArray` 程序执行期间的变化。在处理数组时，使用 `for` 循环通常很方便，因为数组中的位置数量是固定的。注意，`BasicArray`\
  \ 程序中的多处使用了一个名为 `LIMIT` 的常量。该常量用于声明数组的大小，并控制初始化数组值的 `for` 循环。\n\n使用 `for` 循环的迭代器版本来打印数组中的值。\n\
  \n回想第 5 章，这个版本的 `for` 循环提取数组中的每个值。\n\n数组创建时有 15 个元素，索引从 0 到 14。\n在第一次循环迭代三次后，`list[5]`\
  \ 的值发生了变化。\n完成第一次循环后，`list[5]` 的值变为 999。\n\n(图 8.2：BasicArray 程序中变化过程中的数组)\n\n###\
  \ 边界检查\n\n索引操作符会执行*边界检查*，这确保索引在数组的范围内。每当引用数组中的特定元素（例如 `prices[count]`）时，都会检查索引值。如果它在数组的有效索引范围内（0\
  \ 到 24），则执行该引用。如果索引无效，则会抛出一个名为 `ArrayIndexOutOfBoundsException` 的异常。\n\n当然，在我们的程序中，我们会希望执行自己的边界检查。也就是说，我们希望小心留在数组边界内，并处理我们想要过的每个元素。由于数组索引从\
  \ 0 开始并到比大小小 1 结束，程序中很容易产生*差一错误*，这是一种由于处理掉一个元素或尝试访问多一个元素而产生的问题。\n\n检查数组边界的一种方法是使用长度常量，该常量存储在数组对象并存储数组的大小。它是一个公共常量，因此可以直接引用。例如，在\
  \ `prices` 数组创建了 25 个元素后，常量 `prices.length` 包含值 25。它的值在数组首次创建时设置，无法更改。当需要数组大小而无需单独创建常量时，长度常量作为每个数组不可分割的一部分可以使用。\n\
  \n让我们看另一个示例。列表 8.2 中的程序将 10 个整数读入一个名为 `numbers` 的数组中，然后按倒序打印它们。\n\n\n\n\n\n注意在 `ReverseOrder`\
  \ 程序中，数组 `numbers` 被声明为包含 10 个元素，因此其索引从 `0` 到 `9`。索引范围在 `for` 循环中通过数组对象的 `length`\
  \ 字段进行控制。你应该仔细地设置循环控制变量的初始值以及终止循环的条件，以确保所有预期的元素都得到处理，并且仅使用有效索引引用数组元素。\n\n## 8.2\
  \ 数组的声明与使用\n\n###  8.2\n```java\n//********************************************************************\n\
  // ReverseOrder.java 作者: Lewis/Loftus\n//\n// 展示了数组索引处理。\n//********************************************************************\n\
  import java.util.Scanner;\n\npublic class ReverseOrder\n{\n    //-----------------------------------------------------------------\n\
  \    // 从用户处读取一组数字，将其存储在数组\n    // 中，然后以相反顺序打印它们。\n    //-----------------------------------------------------------------\n\
  \    public static void main(String[] args)\n    {\n        Scanner scan = new Scanner(System.in);\n\
  \        double[] numbers = new double[10];\n        System.out.println(\"数组的大小:\
  \ \" + numbers.length); \n        for (int index = 0; index < numbers.length; index++)\n\
  \        {\n            System.out.print(\"输入数字 \" + (index+1) + \": \"); \n   \
  \         numbers[index] = scan.nextDouble();\n        }\n        System.out.println(\"\
  反序排列的数字:\"); \n        for (int index = numbers.length-1; index >= 0; index--) \n\
  \            System.out.print(numbers[index] + \" \");\n        }\n    }\n}\n```\n\
  \n**输出**\n```\n数组的大小: 10\n输入数字 1: 18.36\n输入数字 2: 48.9\n输入数字 3: 53.5\n输入数字 4: 29.06\n\
  输入数字 5: 72.404\n输入数字 6: 34.8\n输入数字 7: 63.41\n输入数字 8: 45.55\n输入数字 9: 69.0\n输入数字 10:\
  \ 99.18\n反序排列的数字:\n99.18 69.0 45.55 63.41 34.8 72.404 29.06 53.5 48.9 18.36\n```\n\
  \n示例 8.3 所示的 `LetterCount` 示例使用了两个数组和一个 `String` 对象。名为 `upper` 的数组用于存储字符串中每个大写字母字母出现的次数。名为\
  \ `lower` 的数组对小写字母起到相同的作用。\n\n由于英语字母表中有 26 个字母，`upper` 和 `lower` 数组都声明为 26 个元素。每个元素都包含一个初始值为\
  \ 0 的整数。`for` 循环逐个字符扫描字符串。对于字符串中找到每个字符，相应数组中对应的计数器都会加 1。\n\n### 示例 8.3\n```java\n\
