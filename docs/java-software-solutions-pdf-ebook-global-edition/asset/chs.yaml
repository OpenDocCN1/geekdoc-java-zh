  \n```java\npublic void stop()\n```\n停止 applet。在 applet 变为非激活状态立即调用。\n\n```java\n\
  public void destroy()\n```\n销毁 applet。在退出浏览器时调用。\n\n```java\npublic URL getCodeBase()\n\
  ```\n返回此 applet 字节码所在的 URL。\n\n```java\npublic URL getDocumentBase()\n```\n返回包含此\
  \ applet 的 HTML 文档所在的 URL。\n\n```java\npublic AudioClip getAudioClip(URL url, String\
  \ name)\n```\n从指定的 URL 获取音频剪。\n\n```java\npublic Image getImage(URL url, String\
  \ name)\n```\n从指定的 URL 获取图像。\n\n**图 g.1** Applet 类的某些方法 **719**\n\n**720**\n\n**附录\
  \ g** Java Applets\n\n`init` 方法在 applet 首次加载时执行一次，例如当浏览器或 `appletviewer` 首次查看 applet\
  \ 时。因此，`init` 方法是初始化 applet 环境和持久性数据的地方。\n\n`start` 和 `stop` 方法分别在 applet 变为激活或非激活状态时被调用。例如，在我们使用浏览器初始加载一个\
  \ applet 后，会调用 applet 的 `start` 方法。随后我们可能会离开该页面去访问另一个页面，此时 applet 变为非激活状态并调用 `stop`\
  \ 方法。如果我们返回 applet 页面，applet 将再次变为激活状态并再次调用 `start` 方法。\n\n注意，`init` 方法在 applet\
  \ 加载时调用一次，但 `start` 在页面被反复访问时可能会被调用多次。如果 applet 积极使用 CPU 时间（例如显示动画时），则为 applet 实现\
  \ `start` 和 `stop` 是一个良好的做法，这样 CPU 时间就不会浪费在不可见的 applet 上。\n\n另外注意，在浏览器中重新加载 Web\
  \ 页面并不一定会重新加载 applet。为了强制 applet 重新加载，大多数浏览器提供了某些按键组合。例如，在 Netscape Navigator 中，按住\
  \ `Shift` 键同时点击鼠标刷新按钮不仅会重新加载 Web 页面，还会重新加载（并初始化）该页面链接的所有 applet。\n\n`getCodeBase`\
  \ 和 `getDocumentBase` 方法对于确定 applet 字节码或 HTML 文档的位置非常有用。applet 可以使用适当的 `URL` 获取额外的资源，例如通过\
  \ applet 方法 `getImage` 或 `getAudioClip` 分别获取图像或音频剪。\n\n安全性是 applet 的一个问题。当你浏览 Web\
  \ 页面时，可能会打开一个包含 applet 的页面，突然你的机器上就会执行一个未知程序。由于该过程固有的危险性，applet 对它可以执行的操作类型受到了限制。例如，applet\
  \ 不能向本地驱动器写入数据。\n\n在本书的图形轨迹章节中，我们探索了与使用图形用户界面（GUI）的程序开发相关的问题。这些章节中的示例以 Java 的形式呈现，使用\
  \ `JFrame` 组件作为主要的重量级容器。applet 也可以用于演示 GUI 程序。与 `JFrame` 类似，`JApplet` 也是一个重量级容器。\n\
  \napplet 适用于小型、独立的程序，例如游戏或计算器。\n\n由于安全限制和处理开销，它们并不被频繁用于大型系统。通常，会使用其他技术来支持完全集成的动态\
  \ Web 网站。\n\n## 正则表达式\n\n在整本书中，我们使用 `Scanner` 类来从用户处读取交互式输入并将字符串解析为单个标记（如单词）。在第\
  \ 5 章中，我们还使用它从数据文件中读取输入。通常我们在扫描器输入中使用默认的空白分隔符作为标记的分隔符。\n\n`Scanner` 类还可以根据正则表达式解析其输入，正则表达式是表示模式的字符字符串。正则表达式可以用于设置提取标记时使用的分隔符，也可以可以用于\
  \ `findInLine` 等方法来匹配特定字符串。\n\n构建正则表达式的一些通用规则包括：\n\n-   点字符 `.` 匹配任何单个字符。\n-   `*`\
  \ 字符（称为 Kleene 步）匹配零或多个字符。\n-   方括号 `[ ]` 中的字符字符串匹配该字符串中的任何单个字符。\n-   `\\` 字符后跟一个特殊字符（如列表中的字符）匹配字符本身。\n\
  -   `\\` 字符后跟一个字符匹配由该字符指定的模式（见下表）。\n\n例如，正则表达式 `B.b*` 匹配 Bob、Bubba 和 Baby。正则表达式\
  \ `T[aei]*ing` 匹配 Taking、Tickling 和 Telling。\n\n这些示例只是许多中的几个。图 H.1 指定了可以匹配的某些模式，尽管该列表是不完整的。\n\
  \n**721**\n\n**722**\n\n**附录 H** 正则表达式\n\n| 正则表达式 | 匹配 |\n| :--- | :--- |\n| `x`\
  \ | 字符 x |\n| `.` | 任意字符 |\n| `[abc]` | a、b 或 c |\n| `[^abc]` | 除 a、b、c 以外的任意字符\
  \ |\n\n...（完整列表见 `Pattern` 类的在线文档。）\n\n## Javadoc\n\n| Javadoc | 文档 | 生成器 |\n|---|---|---|\n\
  \n*Javadoc* 是一种从 Java 源代码创建 HTML 格式文档的工具。该工具检查源代码，提取标记的文档信息，然后生成总结软件的网页。*文档注释*（称为\
  \ doc 注释）指定了 javadoc 处理的注释格式。特殊标签（tags）也被 javadoc 解析。文档注释和标签可以用于构造完整的 Java 接口（API）规范。\n\
  \nJava API 是关于如何使用类的规范。\n\nJavadoc 可以对包或单独的文件（或两者）运行。它每次都会生成一个结构良好的文档。然而，Javadoc\
  \ 不支持增量添加。\n\nJavadoc 是 Java 开发工具包（SDK）的标准部分。\n\n工具执行文件 `javadoc.exe` 位于安装目录的 bin\
  \ 文件夹，与 `javac` 编译器和 `java` 执行工具一起。因此，如果你可以使用命令行编译并执行代码，javadoc 也应该工作。\n\n基本形式使用\
  \ javadoc 非常简单，非常类似于编译 java 源文件。例如：\n\n```\njavadoc myfile.java\n```\n\njavadoc\
  \ 命令还可以指定选项和包名。源文件名必须包含 .java 扩展名。\n\n\n\n\n\n# 附录 I：Javadoc 文档生成器\n\n## 文档注释\n\n\
  文档注释分为描述（descriptions）和标签（tags）。描述部分应提供所解释代码的功能概述。标签则处理功能的具体细节，例如代码版本（针对类或接口）或返回类型（针对方法）。\n\
  \nJavadoc 处理放置在 `/**`（开始标签）和 `*/`（结束标签）之间的代码注释。注释允许跨行，每行都以 `*` 字符开头，这些字符以及它们之前的任何空白字符会被工具丢弃。这些注释允许包含\
  \ HTML 标签。\n\n例如：\n\n```java\n/**\n* 这是一个 <strong>示例</strong> 文档注释。\n*/\n```\n\n\
  注释的位置应该仔细考虑。javadoc 工具会自动将每个文档注释的第一句复制到 HTML 文档顶部的摘要中。该句子紧跟 `*` 字符之后的任何空白字符之后开始，在第一个句号处结束。随后的描述应当简洁且完整。只有当文档注释直接放置在类、构造函数、方法、接口或字段的声明之前时，它们才会被识别为文档注释。\n\
  \n在描述中使用 HTML 的情况应限制在适当的注释分离和显示上，而不是样式设计。Javadoc 自动使用某些标签结构化文档——例如标题标签。适当使用段落标签或列表标签（有序/无序）可以提供满意的格式化。\n\
  \n## 标签\n\n标签包含在文档注释中。每个标签必须单独起一行，因此其前面必须有一个 `*` 字符。标签对大小写敏感，并以 `@` 符号开头。\n\n在某些情况下，某些标签是必须的。每个参数都必须提供\
  \ `@param` 标签，用于描述参数的作用。对于每个返回 `void` 以外内容的的方法，必须提供 `@return` 标签，以描述方法返回的内容。`@author`\
  \ 类和 `@version` 标签仅适用于类和接口。\n\n图 I.1 列出了 javadoc 注释中使用的各种标签。注意图 I.1 中列出的两种不同类型的标签。*块标签（block\
  \ tags）*以 `@` 符号开头（例如 `@author`），必须放置在主描述之后的标签部分。*内联标签（inline tags）*包含在 `{` 和 `}`\
  \ 分隔符中，可以放置在描述部分的任何位置或块标签的注释中。例如：\n\n```java\n/**\n* 这是一个 <strong>示例</strong> 文档注释。\n\
  * {@link 表} 提供了所用类型的定义。\n*\n* @author Sebastian Niezgoda\n*/\n```\n\n### 图 i.1：javadoc\
  \ 注释中各种标签\n\n| 标签名称 | 描述 |\n| :--- | :--- |\n| `@author` | 插入带有指定文本的“作者（Author）”项。\
  \ |\n| `{ @code}` | 等于 `<code>{@literal}</code>`。 |\n| `@deprecated` | 插入带有指定文本的粗体“已弃（Deprecated）”项。\
  \ |\n| `{ @docRoot}` | 指向文档根的相对链接。 |\n| `@exception` | 参见 `@throws`。 |\n| `{ @inheritDoc}`\
  \ | 从使用处最近的继承类或实现的接口复制文档，允许对层级更高的类的更通用的注释进行重用。 |\n| `{ @link}` | 插入指向 HTML 文档的超链接。用法：`{@link\
  \ name url}`。 |\n| `{ @linkPlain}` | 与 `{@link}` 相同，但以纯文本形式显示。用法：`{@linkPlain link\
  \ label}`。 |\n| `{ @literal}` | 标签中的文本以字面意思表示，因为它包含任何 HTML。例如，`{@literal <td> TouchDown`\
  \ 将显示为 `<td> TouchDown`（`<td>` 不会被解释为表格单元格）。 |\n| `@param` | 插入“参数（Parameters）”部分，列出并描述特定构造函数/方法的参数。\
  \ |\n| `@return` | 插入“返回（Returns）”部分，列出并描述特定构造函数/方法的任何返回值。用法：`@return description`。如果包含返回类型为\
  \ `void` 的注释中，将抛出错误。 |\n| `@see` | 包含“参见（See Also）”注释，带有指向包含更多信息的文档链接。用法：`@see link`。\
  \ |\n| `@serial` | 用于可序列化字段。用法：`@serial text`。 |\n| `@serialData` | 用于描述由 `writeObject`、`readObject`、`writeExternal`\
  \ 和 `readExternal` 方法写入的数据。用法：`@serialdata text`。 |\n| `@serialField` | 用于注释 `ObjectStreamField`。用法：`@serialField\
  \ name type description`。 |\n| `@since` | 插入新的“自（Since）”标题，用于标记特定功能首次引入的时间。用法：`@since\
  \ text`。 |\n| `@throws` | 包含“抛出（Throws）”标题。用法：`@throws name description`。 |\n| `{\
  \ @value}` | 返回其所引代码元素的值。用法：`@value code-member label`。 |\n| `@version` | 当使用 `-version`\
  \ 命令行选项时添加“版本（Version）”标题。用法：`@version text`。 |\n\n## 生成的文件\n\njavadoc 工具分析 Java\
  \ 源文件或包，并为每个类生成一个三部分的 HTML 文档。该 HTML 文件通常被称为文档文件。它包含了从代码中包含的文档注释推导出的关于类文件的组织整齐的信息。\n\
  \n文档的第一部分包含类的总体描述。类名首先出现，然后是继承关系的图形表示。接下来显示一个通用描述，该描述是从每个文档注释实体的第一句中提取的（如前所述）。\n\
  \n接下来，提供构造函数和方法列表。源文件中的所有构造函数和方法的签名将列出，并带有单句描述。构造函数/方法的名称是指向文档第三部分详细描述的超链接。\n\n\
  最后，提供方法的完整描述。同样，首先提供签名，然后是实体的解释，但这次没有单句限制，是从文档注释获取的。如果适用，将在相应部分提供参数和返回值的列表。\n\n\
  HTML 文档广泛使用超链接提供必要的附加信息（例如使用 `@see` 标签），并用于导航。页面的头部和页脚是导航栏，带有以下链接：\n\n*   *Package（包）*：提供包内类列表以及每个类的简短目的和描述。\n\
  *   *Tree（树）*：展示包内类的视觉层次结构。每个类名都是指向相应 HTML 文件的链接。\n*   *Deprecated（已弃用）*：列出任何类文件中使用的被认为弃用的功能。\n\
  *   *Index（索引）*：提供包内类、构造函数和方法的字母顺序列表。类名也与类的简短目的和描述相关。类名的每次出现都是指向相应 文档的链接。每个构造函数和方法的签名都是指向相应详细描述的链接。签名旁边的单句描述将构造函数/方法与相应的类关联。\n\
  *   *Help（帮助）*：加载有关如何使用和导航 HTML 文档的帮助页面。\n\n所有页面都可以在带框架或不带框架的情况下查看。每个类摘要都有链接，可以快速访问文档的任何部分。\n\
  \n输出内容可以通过执行 javadoc 工具时使用的命令行选项（见上文）进行部分生成。默认情况下，如果没有指定选项，返回的输出等同于使用 `-protected`\
  \ 选项。选项包括：\n\n*   `-private`：显示所有类、方法和变量。\n*   `-public`：仅显示公共类、方法和变量。\n\n\n\n\n\
  \n- `protected` 仅显示保护的和公共的类、方法和变量。\n- `help` 显示在线帮助。\n- `keywords` 在生成的输出文件中包含 HTML\
  \ 元数据标签，用以辅助搜索。\n\n*本页特意留白。*\n\n# PaintBox 项目\n\nJ\n\n在本附录中，我们将研究一个比本文描述的任何其他项目都大的软件开发项目。我们的示例程序允许用户使用各种形状和颜色创建图形。这类项目涵盖了大型软件开发中常见的各种问题，并为探索我们的开发模型提供了良好的基础。我们将此示例称为\
  \ `PaintBox` 项目。\n\n## PaintBox 需求\n\n假设客户提供了以下初始需求。该程序将：\n\n- 提供一个主要由鼠标驱动的图形界面用于所有的用户操作。\n\
  - 允许用户绘制线条、椭圆、圆形、矩形和正方形。\n- 允许用户更改绘制颜色。\n- 显示当前的绘制颜色。\n- 允许用户为形状（线条除外）填充颜色。\n- 允许用户选择形状以移动它、修改颜色或重塑形状。\n\
  - 允许用户对图形中的单个形状进行剪切、复制和粘贴。\n- 允许用户将图形保存到文件中，并从文件中加载以前存储的图形以便进一步编辑。\n- 允许用户随时开始绘制新图形。\n\
  \n在检查这些通用需求后，我们可能会与客户坐下来讨论一些细节，以确保没有误解。我们可能会创建一个新的需求文档，对涉及的问题描述得具体。\n\n在与客户的这些交互过程中，我们可能会为系统的用户界面创建一个草图，如图\
