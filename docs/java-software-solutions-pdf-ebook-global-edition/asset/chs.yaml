  boolean contains(Object obj)\n如果此列表包含指定的对象，则返回 true。\n\nboolean isEmpty()\n如果此列表不包含元素，则返回\
  \ true。\n\nint size()\n返回此列表中元素的数量。\n```\n**图 5.8** `ArrayList<E>` 类的一些方法。\n\nListing\
