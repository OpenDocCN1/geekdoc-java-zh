  \    count++;\n    System.out.println(count);\n}\nwhile (count < 5);\n```\n注意 `do`\
  \ 循环直接以关键字 `do` 开始。\n\n**核心概念**\n`do` 循环体始终至少执行一次。图 6.1 显示了这种处理过程。\n\n**do 语句**\n\
