  \n![](img/index-243.png)\n\n**242**\n\n**第 5 章** 条件判断和循环\n\n这段代码选择胜者的概率基于 `CHANCE`\
  \ 常量的值。也就是说，如果 `CHANCE` 为 20，获胜的概率是 1/20。条件寻找返回值为 0 是任意的；0 到 `CHANCE-1` 之间的任何值都可以工作。\n\
  \n**if-else 语句**\n\n有时我们希望在条件为 true 时做某事，在条件为 false 时做另一件事。我们可以向 if 语句添加一个 *else\
  \ 子句*，使其成为 *if-else 语句*，以处理这种情况。以下是 if-else 语句的示例：\n\n```java\nif (height <= MAX)\n\
  adjustment = 0;\nelse\nadjustment = MAX - height;\n```\n\n如果条件为 true，执行第一个赋值语句；**核心概念**如果条件为\
  \ false，则执行第二个赋值语句。\n\nif-else 语句允许程序员在条件为 true 时做某事，在条件求值为 true 或 false 时做另一件事。注意，再次使用了正确的缩进来传达这些语句是该\
  \ if 语句的一部分。\n\n只有其中一个会被执行，因为布尔条件只能求值为 true 或 false。\n\n**if 语句**\n\n```\nif\n(表达式)\n\
  语句\nelse\n语句\n```\n\nif 语句测试布尔表达式，如果为真，则执行第一个语句。可选的 else 子句指定了如果表达式为假时应该执行的语句。\n\
  \n示例：\n\n```java\nif (tal < 7)\nSystem.out.println(\"总和小于 7。\");\n\nif (firstCh\
  \ != 'a')\ncount++;\nelse\ncount = count / 2;\n```\n\n**5.2** if 语句\n\n**243**\n\
  \n\n\n\nListing 5.2 所示的 Wages 程序使用 `if-else` 语句来计算员工的正确支付金额。\n\n在 Wages 程序中，如果员工某周工作时间超过\
  \ 40 小时，支付金额将考虑加班小时。使用一个 `if-else` 语句来判断用户输入的时数是否大于 40。如果是，额外的时数将按正常费率的一点五倍率支付。\n\
  \n如果没有加班小时，总支付金额将简单地基于工作小时数和标准费率。\n\n让我们来看 `if-else` 语句的另一个示例：`if (roster.getSize()\
  \ == FULL)`\n\n```\nroster.expand();\nelse\nroster.addName(name);\n```\n\n**Listing\
  \ 5.2**\n\n```java\n//********************************************************************\n\
  // Wages.java Author: Lewis/Loftus\n//\n// 演示了 if-else 语句的使用。\n//********************************************************************\n\
  import java.text.NumberFormat;\nimport java.util.Scanner;\n\npublic class Wages\n\
  {\n    //-----------------------------------------------------------------\n   \
