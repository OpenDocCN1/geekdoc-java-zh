  \n还要注意，复选框和单选按钮产生不同类型的事件。\n\n复选框产生项目事件，而单选按钮产生动作事件。\n\n不同类型事件的使用与按钮功能的差异有关。复选框在被选中或取消选择时产生事件，监听器可以需要进行区分。另一方面，单选按钮仅在被选中时产生事件（组中当前选中的按钮会自动取消选中）。\n\
  \n# 286\n\n# 第 5 章 条件语句与循环\n\n### 核心概念总结\n\n- 条件语句和循环允许我们控制方法内部的执行流。\n- `if` 语句允许程序选择是否执行特定的语句。\n\
  - 循环允许程序多次执行某语句。\n- 逻辑运算符通常用于构建复杂的条件。\n- 适当的缩进对于人类可读性很重要；它展示了语句与语句之间的关系。\n- `if-else`\
  \ 语句允许程序在条件为真时执行一个操作，条件为假时执行另一个操作。\n- 在嵌套的 `if` 语句中，`else` 子句与最近的未匹配 `if` 匹配。\n\
  - Java 中字符的相对顺序由 Unicode 字符集定义。\n- `compareTo` 方法可以确定字符串的相对顺序。\n- `while` 语句持续执行相同的语句，直到其条件变为假。\n\
  - 我们必须仔细设计程序，以避免无限循环。\n- `iterator`（迭代器）是一个帮助你处理一组相关项的对象。\n- `Scanner` 对象中用于分隔标记的边界符可以根据需要显式设置。\n\
  - `ArrayList` 对象存储对象列表，并允许你使用整数索引访问它们。\n- 当创建 `ArrayList` 对象时，你指定了将存储在列表中的元素类型。\n\
  - 单选按钮作为一个组运行，提供了一组互斥的选项。\n\n## 练习题\n\n**EX 5.1** 在 `MinOfThree` 程序中，如果两个或多个值相等会发生什么？如果恰好有两个值相等，这些相等值比第三个值低还是高是否重要？\n\
