  \ CPU。\n\n主内存存储当前活跃的程序和数据。CPU 从主内存中一次一次地提取单个程序指令并执行它们。\n\nSR 1.11 内存地址是一个数字，用于唯一地标识存储某个值的特定内存位置。\n\
  \nSR 1.12 主内存是易失的，这意味着如果关闭计算机电源，存储在内存中的信息将会丢失。\n\n辅助存储设备是非易失的；因此，即使掉电，存储在它们上的信息也会保留。\n\
  \nSR 1.13 最匹配的单词是\na. 外设 b. 控制器 c. 调制解调器 d. 主内存或 RAM\ne. 辅助或 ROM f. RAM g. CPU\n\
  \n# 1.3 网络\nSR 1.14 文件服务器是一种专用的网络计算机，用于存储和提供许多网络用户所需的程序和数据。\n\nSR 1.15 数一下图 1.16\
  \ 中的唯一连接数量，完全连接一个五台计算机的点对点网络需要 10 条通信线。在网络中增加第六台计算机将需要它与原始的五台计算机连接，使总数达到 15 条通信线。\n\
  \nSR 1.16 让网络上的计算机共享通信线是有成本效益的，因为它减少了所需的连接数量，并且更容易向网络中添加新计算机。然而，如果网络繁忙，共享线路可能意味着通信延迟。\n\
  \nSR 1.17 Internet 一词源于 internetworking（网络互联），这是一个与广域网（WAN）相关的概念。互联将一个网络连接到另一个网络。Internet\
  \ 是一个广域网。\n\nSR 1.18 TCP 代表传输控制协议（Transmission Control Protocol）。IP 代表互联网协议（Internet\
  \ Protocol）。协议是一组规定两个事物如何通信的规则。\n\nSR 1.19 分解每个 URL 的部分：\na. `duke` 是 `villanova.edu`\
  \ 域名下 `csc` 子域名（计算机科学系）中的计算机名称，该域名代表诺瓦瓦大学。`edu` 顶级域名表示它是一个教育机构。该 URL 正在从名为 `jss`\
  \ 的子目录请求名为 `examples.html` 的文件。\nb. `java` 是 `sun.com` 域名下的一台计算机（Web 服务器）的名称，该域名代表太阳公司。`com`\
  \ 顶级域名表示它是一个商业实体。该 URL 正在从名为 `products` 的子目录请求名为 `index.html` 的文件。\n\n# 1.4 Java\
  \ 编程语言\nSR 1.20 Java 编程语言由 James Gosling 在 20 世纪 90 年代初在太阳公司开发。它于 1995 年向推出。\n\n\
  SR 1.21 Java 程序的处理从 `main` 方法开始。\n\nSR 1.22 字符“Hello”将打印在计算机屏幕上。\n\nSR 1.23 整行代码都是注释，因此没有结果。\n\
  \nSR 1.24 显示的所有标识符都是有效的，`12345` 除外（因为标识符不能以数字开头），以及 `black&white` 除外（因为标识符不能包含字符\
  \ &）。标识符 `RESULT` 和 `result` 都是有效的，但不应在程序中一起使用，因为它们仅大小写上不同。下划线字符（如 `answer_7`）是标识符的有效部分。\n\
  \nSR 1.25 虽然列出的任何名称都可以用作所需的标识符，但唯一“良好”的选择是 `scoreSum`。标识符 `x` 没有描述性且毫无意义，标识符 `sumOfTheTestScoresOfTheStudents`\
  \ 过于冗，而标识符 `smTstScr` 不够清晰。\n\nSR 1.26 空白（White space）是指程序中分隔单词和符号的空格、制表符和换行符。编译器忽略额外的空白；因此，它不影响执行。然而，适当使用空白对于使程序人类可读至关重要。\n\
  \n# 1.5 程序开发\nSR 1.27 在最底层，计算机的指令只执行简单任务，例如复制值或比较两个数字。然而，通过每秒组合数百万这样的简单指令，计算机可以执行复杂的任务。\n\
  \nSR 1.28 高级语言允许程序员以类似于英语的术语表达一系列程序指令，这些术语相对易读和使用。然而，为了执行，程序必须以特定计算机的机器语言表示，这由一系列位组成，人类基本上是无法读取的。高级语言程序在运行之前必须翻译成机器语言。\n\
  \nSR 1.29 Java 字节码是 Java 源代码程序的低级表示。Java 编译器将源代码翻译成字节码，然后可以使用 Java 解释器执行。字节码在被 Web\
  \ 浏览器中的 Java 解释器执行之前，可能会跨 Web 传输。\n\nSR 1.30 最匹配的单词是\na. 机器 b. 汇编 c. 高级 d. 高级 e.\
  \ 编译器 f. 解释器\n\nSR 1.31 语法规则定义了编程语言的符号和单词如何组合。编程语言指令的语义决定了执行该指令时会发生什么。\n\nSR 1.32\
  \ a. 编译错误 b. 运行时错误（你不能除以零） c. 逻辑错误\n\n# 1.6 面向对象编程\nSR 1.33 1. 理解问题。2. 设计解决方案。3.\
  \ 考虑解决方案的替代方案和改进方案。4. 实现解决方案。5. 测试解决方案。\n\nSR 1.34 我们想到的问题的第一个解决方案可能不是好的方案。在花费过多精力实现我们的第一个想法之前，考虑替代方案，我们通常可以节省精力和时间。\n\
  \nSR 1.35 支持面向对象编程的主要元素是对象、类、封装和继承。对象由类定义，类包含了定义对这些对象的操作的方法（它们执行的服务）。对象被封装起来，以便它们存储和管理自己的数据。继承是一种重用技术，其中一个类可以从另一个类派生。\n\
  \n# 2 数据与表达式\n## 2.1 字符字符串\nSR 2.1 字符串字面量是由双引号界定的字符序列序列。\n\nSR 2.2 `System.out`\
