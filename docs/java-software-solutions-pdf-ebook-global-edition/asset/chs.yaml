  \n# 第 2 章：数据与表达式\n\n## 使用 Web 运行 applet\n\n为了让 applet 能够通过 Web 传输并由浏览器执行，它必须在超文本标记语言（HTML）文档中引用。HTML\
  \ 文档包含 `tags`，用于指定格式化指令并识别要包含在文档中的特殊媒体类型。Java 程序被视为一种特定的媒体类型，就像文本、图形和声音一样。\n\nHTML\
  \ 标签包含在角括号中。以下是 applet 标签的示例：\n\n```html\n<applet code=\"Einstein.class\" width=\"\
  350\" height=\"175\">\n</applet>\n```\n\n该标签规定存储在文件 `Einstein.class` 中的字节码应该通过网络传输，并在想要查看此特定\
  \ HTML 文档的机器上执行。applet 标签还指示了 applet 的宽度和高度。\n\n其他标签也可以用于在 HTML 文件中引用 applet，包括\
  \ `<object>` 标签和 `<embed>` 标签。根据世界维网联盟（W3C）的规定，实际上`<object>` 标签才是应该使用的标签。\n\n然而，浏览器对\
  \ `<object>` 标签的支持并不一致。目前，最可靠的解决方案是使用 `<applet>` 标签。\n\n注意，applet 标签引用的是 `Einstein`\
  \ applet 的字节码文件，而不是源代码文件。在通过 Web 传输 applet 之前，必须将其编译成字节码格式。然后，如图 2.11 所示，可以使用 Web\
  \ 浏览器加载文档，浏览器将自动解释并执行该 applet。\n\nJava 源代码 -> Java 编译器 -> 字节码 -> Java Web 浏览器 ->\
  \ 带有 JVM (JVM) 的虚拟机 -> 远程计算机\n\n**图 2.11** Java 的翻译与执行过程，包括 applets\n\n![](img/index-126_1.png)\n\
