  \ J.7\n完成后的 PaintBox 程序\n\n*本页特意留空。*\n\n## GUI 事件\n\n在本书的图形轨迹章节中，我们讨论了组件可能生成的各种事件。本附录的目的是将事件/组件关系置于上下文中。\n\
  \n图 K.1 中列出的事件由每个 Swing 组件生成。也就是说，我们可以在任何组件上为这些事件中的任何一个设置监听器。\n\n某些事件由特定组件生成。图 K.2\
  \ 中的表格将组件与其能生成的事件映射起来。请记住，这些事件是所有组件生成的事件之外的。如果某个组件不产生特定类型的事件，则无法为该组件添加该事件的监听器。\n\
  \n我们已经在文中适当的地方讨论了图 K.1 和 K.2 中的某些事件；而将另一些内容留给您独立探索。应用组件/事件/监听器交互的基本概念，通常只需要知道在什么情况下、哪些组件会生成哪些事件即可。\n\
  \n当然，GUI 中发生的许多事件与当前程序无关。例如，每当鼠标跨越组件移动时，都会产生许多鼠标移动事件。然而，这并不意味着我们必须监听它们。GUI 的定义在某种取决于我们选择对其响应的事件。尽管我们在书中对\
  \ GUI 开发进行了详尽介绍，但仍然仅是触皮一角。以下列表描述了本文未深入介绍的其他 Java GUI 容器和组件：\n\n| 事件 | 代表 |\n| :---\
  \ | :--- |\n| 组件事件 | 更改组件的大小、位置或可见性。 |\n| 焦点事件 | 获取或失去键盘焦点。 |\n| 键事件 | 按下、释放和点击键盘键。\
  \ |\n| 鼠标事件 | 点击鼠标按钮并将鼠标移入组件的绘制区域。 |\n| 鼠标移动事件 | 在组件上移动或拖动鼠标。 |\n\n### 图 K.1\n每个\
