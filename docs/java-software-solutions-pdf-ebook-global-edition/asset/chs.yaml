  \ applets\n\nJava 程序有两种：Java applet 和 Java application（应用程序）。Java *applet* 是一种旨在嵌入\
  \ HTML 文档的 Java 程序，通常通过网络传输，并使用 Web 浏览器执行。Java *application* 是一个可以使用 Java 解释器执行的独立程序。本书到为止介绍的所有程序都是\
  \ Java 应用程序。\n\nWeb 使户户可以使用极其方便且易于使用的点点点击界面来发送和接收各种类型的媒体，如文本、图形和声音。Java applet 是第一种可以使用\
  \ Web 软件检索的可执行程序。Java applet 被认为是可以通过 Web 交换的另一种媒体。尽管 Java applets 通常旨在跨网络传输，但它们并不一定如此。可以使用\
  \ Java 开发工具包中的 *appletviewer* 工具查看并执行 applets。\n\n**122**\n\n**第 2 章** 数据与表达式\n\n\
