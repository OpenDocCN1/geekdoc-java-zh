  ### 图 K.2\n特定组件生成的特定事件\n\n- 工具栏是一个容器，它将多个组件分组成一行或一列。工具栏通常包含按钮，这些按钮对应于也可以通过其他方式完成的任务。工具栏可以从它们最初所在的容器中拖出，进入自己的窗口中。\n\
  - 内部帧（internal frame）是一个操作方式类似于普通帧但仅限于另一个窗口的容器。内部帧可以在窗口内移动并与其他内部帧重叠。内部帧可以创建 GUI\
  \ 桌面的感觉，用户可以根据意愿安排组件。\n- 分层面板（layered pane）是一个考虑了第三个维度（深度）来组织其包含的组件的容器。当组件被添加到分层面板时，会指定其深度。如果组件重叠，每个组件的深度值将决定哪一个在最上面。\n\
  - 进度条（progress bar）可以用于指示特定活动的进度。用户通常不会与进度条进行交互，除了查看它以确定任务（如加载图像）进展了多少。\n- 表格（table）是一种以表格格式显示数据的\
  \ Java GUI 组件。Java 表格可以完全定制，以提供精确的组织和展示。它还可以允许用户编辑数据。Java 表格实际上并不包含或存储数据；它只是以组织化的方式向用户展示数据。\n\
  - 树（tree）是一种呈现数据分级视图的组件。与表格一样，它并不存储数据；它提供了从根节点到各个分支的组织化视图。Java 提供了丰富的支持，但我们鼓励您深入探索这些问题。\n\
