  \ 方法根据硬币当前的 `face` 值返回一个布尔值。`toString` 方法使用 `if-else` 语句来确定返回哪个字符字符串来描述硬币。当 `myCoin`\
  \ 对象传递给 `main` 方法中的 `println` 时，`toString` 方法会被自动调用。\n\n### 使用块语句 (block statements)\n\
  \n作为评估布尔条件的结果，我们可能想要执行多一项操作。在 Java 中，我们可以将任何单个语句替换为*块语句*。\n\n**246**\n**第 5 章**\
  \ 条件与循环\n**Listing 5.4**\n\n```java\n//********************************************************************\n\
  // Coin.java Author: Lewis/Loftus\n//\n// 代表一个可以翻转的双面硬币。\n//********************************************************************\n\
  public class Coin\n{\n    private final int HEADS = 0;\n    private final int TAILS\
  \ = 1;\n    private int face;\n\n    //-----------------------------------------------------------------\n\
  \    // 通过初始翻转来设置硬币。\n    //-----------------------------------------------------------------\n\
  \    public Coin()\n    {\n        flip();\n    }\n\n    //-----------------------------------------------------------------\n\
  \    // 通过随机选择一个值来翻转硬币。\n    //-----------------------------------------------------------------\n\
  \    public void flip()\n    {\n        face = (int) (Math.random() * 2);\n    }\n\
  \n    //-----------------------------------------------------------------\n    //\
  \ 如果硬币当前为正面，则返回 true。\n    //-----------------------------------------------------------------\n\
  \    public boolean isHeads()\n    {\n        return (face == HEADS);\n    }\n\n\
  \    //-----------------------------------------------------------------\n    //\
  \ 以字符串形式返回硬币的状态。\n    //-----------------------------------------------------------------\n\
  \    public String toString()\n    {\n        String faceName;\n        // 5.2 if\
  \ 语句\n        // 247\n        // Listing 5.4 继续\n        if (face == HEADS)\n  \
  \          faceName = \"Heads\";\n        else\n            faceName = \"Tails\"\
  ;\n        return faceName;\n    }\n}\n```\n\n块语句是用括号包含的语句集合。我们在之前的示例中多次使用了这些括号来包含方法和类定义。\n\
  \nListing 5.5 所示的 Guessing 程序使用了一个 `if-else` 语句，其中 `else` 部分的语句是一个块语句。\n\n如果用户输入的猜测与随机选择答案相等，则打印相应的确认。然而，如果答案错误，则会打印两条语句，一个是说明猜测错误的，另一个打印实际答案。本章末的编程项目会将此示例的概念扩展为\
  \ Hi-Lo 游戏。\n\n注意，如果不使用块括号，说明答案错误的句子会在错误时打印，但揭示正确答案的句子将在所有情况下都打印。也就是说，只有第一个语句会被视为\
  \ `else` 子句的一部分。\n\n记住，缩进对于人类读者之外没有任何意义。没有正确块的语句会导致程序员对代码执行方式做出错误的假设。例如，以下代码具有误导性：\n\
  \n```java\nif (depth >= UPPER_LIMIT)\n    delta = 100;\nelse\n    System.out.println(\"\
  WARNING: Delta is being reset to ZERO\");\n    delta = 0; // 不是 else 子句的一部分！\n```\n\
  \n缩进（考虑到代码逻辑）意味着变量 `delta` 仅在小于 `UPPER_LIMIT` 时被重置。然而，如果不使用块，重置 `delta` 为零的赋值语句完全不受\
  \ `if-else` 语句的控制。它在任何情况下都会执行，这显然不是预期的。\n\n\n\n\n\n```java\n//********************************************************************\n\
  import java.util.*;\n\npublic class Guessing {\n    //-----------------------------------------------------------------\n\
  \    // Plays a simple guessing game with the user.\n    //-----------------------------------------------------------------\n\
