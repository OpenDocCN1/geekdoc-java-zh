  \n\n\n\n\n# 附录 A 术语表\n\n**非易失性—nonvolatile—** 存储器设备在关闭电源后仍能保留其存储信息的数值关系。次级存储设备是非易失性的。*参见*\n\
  \n**NaN—** “非易变数字”（not a volatile number）的缩写，用于表示不适当或未定义的数值。\n\n**null—** 一个 Java\
  \ 保留字，是一个引用字面量，用于指示该引用当前未指向任何对象。\n\n**窄转换—narrowing conversion—** 两个不同但兼容的数据类型之间的转换。窄转换可能会丢失信息，因为转换后的类型通常可用的位位数较少，且内部表示空间小于原始存储空间。*参见*\
  \ 宽转换。\n\n**数字系统—number system—**一组由特定基值定义的数值和操作，该基值决定了每个数字位的值。\n\n**对象—object—**\
  \ (1) 面向对象范式中的主要软件结构。(2) 封装的数据变量和方法的集合。(3) 类的实例。\n\n**原生—native—** 一个 Java 保留字，用作方法的修饰符。原生方法用另一种编程语言实现。\n\
  \n**自然语言—natural language—** 人类用于通信的语言，例如英语或法语。\n\n**对象图—object diagram—** 程序在特定时间点内对象的视觉化表示。\n\
  \n**负无穷—negative infinity—** 一种特殊的浮点值，通常用于显示表示“最低可能”值的实例数据状态。*参见* 正无穷大。\n\n**面向对象编程—object-oriented\
  \ programming—** 一种以对象和类为中心的软件设计和实现方法，旨在便于实现和过程化编程。\n\n**嵌套类—nested class—** 在另一个类内部声明的类，用于限制访问权限。*参见*\
  \ 类。\n\n**八进制—octal—** 基数 8 数字系统，有时用于缩写二进制字符串。*参见* 二进制、十六进制。\n\n**网络—network—**\
  \ 两个或多个连接在一起的，以便它们可以交换数据并共享资源。\n\n**网络地址—network address—** *参见* 地址。\n\n**差一错误—off-by-one\
