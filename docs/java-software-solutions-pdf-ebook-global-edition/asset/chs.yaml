  \ 逻辑行。\n\n**像素—pixel—** 图像元素。数字化图像由许多像素组成。\n\n**重写—overriding—** 修改继承方法的定义以适应子类目的的过程。*参见*\
  \ 变量。\n\n**位值—place value—** 数字中每个数字位置的值，决定了该数字的总值。\n\n**包—package—** 一个 Java 保留字，用于指定一组相关的类。\n\
  \n**包可见性—package visibility—** * *参见* 默认可见性。\n\n**指针—pointer—** 一个可以存储内存地址的变量。Java\
  \ 使用引用代替指针，引用提供了本质上与指针相同的功能，但不需要显式的解引用。\n\n**基本数据类型—primitive data type—** 在编程语言中预定义的数据类型。\n\
