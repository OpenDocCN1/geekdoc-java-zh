  \n绘制线条的面板由列表 8.20 所示的 `RubberLinesPanel` 类表示。\n\n**核心概念** 橡皮筋效应（Rubberbanding）是在拖动鼠标时，形状似乎在扩张的视觉效果，给人线条正在固定点和移动点之间拉伸的错。这种效果被称为*橡皮筋效应*，在图形程序中很常见。\n\
  \n注意，在 `RubberLinesPanel` 构造函数中，监听器对象被添加到面板两次：一次作为鼠标监听器，一次作为鼠标移动监听器。用于添加监听器的方法必须与作为**视频**参数的对象对应。在这种情况下，我们有一个对象作为两类事件的监听器。如果需要，我们可以有两个监听器类：一个监听鼠标事件，另一个监听鼠标移动事件。组件可以对各种事件类别拥有多个监听器。\n\
  \n此外注意此程序每次只画一条线。也就是说，当用户用新的点击开始画另一条线时，之前的线就会消失。这是因为 `paintComponent` 方法会重绘背景，每次都消除了线条。为了看到之前的线条，我们需要跟踪它们，也许像在\
  \ Dots 程序中那样使用 `ArrayList`。对 `RubberLines` 程序的这种修改留作为一个编程项目。\n\n![](img/index-451_1.png)\n\
