  \n25\n\n*本页特意留白。*\n\n![](img/index-28_1.png)\n\n1\n\n# 引言\n\n## 章节目标\n\n* 描述硬件与软件之间的关系。\n\
  * 定义各种类型的软件及其用途。\n* 识别计算机的核心硬件组件并解释它们的作用。\n* 解释硬件组件如何相互作用以执行程序和管理数据。\n* 描述计算机如何连接到网络以共享信息。\n\
  * 介绍 Java 编程语言。\n* 描述程序编译和执行涉及的步骤。\n* 介绍面向对象原则概述。\n\n本书关于如何编写设计良好的软件。要理解软件，我们必须首先从了解它在计算机系统中的作用。硬件和软件在计算机系统中协作以完成复杂任务。各种硬件组件的作用以及这些组件连接到网络的方式，是学习软件开发的重要前提。本章首先讨论了基本的计算机处理，然后通过介绍\
  \ Java 编程语言和面向对象编程原则，开始我们对软件开发的探索。\n\n27\n\n![](img/index-29_1.png)\n\n28\n\n# 第\
  \ 1 章 引言\n\n## 1.1 计算机处理\n\n所有的计算机系统，无论是台式机、笔记本电脑、平板电脑、智能手机、游戏机还是汽车导航系统等特殊设备，都具有某些特征。细节各异，但它们都以类似的方式处理数据。虽然本书的大部分涉及软件开发，但我们将从计算机处理的概述开始，以建立背景。建立一些基础术语并观察计算机系统的关键部分如何相互作用是重要的。\n\
  \n计算机系统由硬件和软件组成。计算机系统的`hardware` 组件是支持计算工作的物理实体。它们包括芯片、机箱、电线、键盘、扬声器、磁盘、内存卡、USB 闪存驱动（也称为优盘）、电缆、插头、打印机、鼠标、显示器、路由器等。如果你能物理上接触它并且它可以认为是计算机系统的一部分，那么它就是计算机硬件。\n\
  \n如果没有指令告诉它们做什么，计算机的硬件组件基本上是无用的。`program` 是一系列硬件顺序执行的指令。`Software` 由程序和这些程序使用的数据组成。软件是物理硬件组件的虚拟对应物。它们共同构成了一个我们可以利用来帮助解决问题的工具。\n\
  \n计算机系统中的关键硬件组件是：\n* 中央处理器 (CPU)\n* 输入/输出 (I/O) 设备\n* 主内存\n* 辅助存储设备\n\n下一节将详细介绍这些每一个硬件组件。现在，我们只需检查它们的基本作用。`central\
  \ processing unit`（`CPU`）是执行程序单个命令的设备。`Input/output`（`I/O`）设备（如键盘、鼠标和显示器）允许人类与计算机交互。\n\
  \n程序数据存储在称为内存的存储设备中，分为两类：主内存和辅助内存。`Main memory` 是在 CPU 处理软件时持有软件的存储设备。`Secondary\
  \ memory` 设备以相对永久的方式存储软件。典型计算机系统最重要的辅助内存设备是位于主计算机机箱内的硬盘。USB 闪存驱动器也是一种重要的辅助内存设备。典型的\
  \ USB 闪存驱动器存储的信息几乎没有硬盘那么多。USB 闪存驱动器的优点是便携性；它们可以根据需要临时移除或在计算机之间移动。另一种便携式辅助内存设备是光盘\
  \ (CD)。\n\n![](img/index-30_1.png)\n![](img/index-30_2.png)\n![](img/index-30_3.png)\n\
  \n## 1.1 计算机处理\n\n29\n\n**图 1.1** 计算机系统的简化视图图 1.1 显示了信息如何在基本硬件组件之间移动。假设你有一个想要运行的可执行程序。\n\
  \n程序存储在某些辅助内存设备上（如硬盘）。\n\n当你指示计算机执行你的程序时，程序的副本从辅助内存调入并存储在主内存中。CPU 从主内存读取各个程序指令。CPU\
  \ 然后逐个执行这些指令，直到程序结束。\n\n**核心概念**\n\n指令使用的数据（例如要相加的两个数字）也存储在主内存中。它们要么是主内存中的指令（从辅助内存调入的），要么是从输入设备读取的，并逐个执行直到程序结束。\n\
  \n诸如键盘。在执行期间，程序可以将信息显示到显示器等输出设备。\n\n执行程序的过程是计算机运行的基础。所有计算机系统基本上以相同的方式工作。\n\n## 软件分类\n\
  \n软件可以根据各种标准分为许多类。在此，我们简单地区分系统程序和应用程序。\n\n\n\n\n\n`operating system` 是计算机的核心软件。它执行着两个重要的功能：首先，它提供了一个\
  \ `user interface`，让用户能够与机器进行交互。其次，操作系统管理着 CPU 和主内存等计算机资源。它决定了程序何时允许运行、被加载到内存的哪个位置，以及硬件设备如何通信。让计算机易于使用并确保其高效运行是操作系统的职责。\n\
  \n### 核心概念\n\n如今有几种流行的操作系统正在使用。Windows 操作系统是由微软公司为个人计算机开发的，它提供了用户界面并管理计算机资源，这占据了操作系统市场的大多数份额。\n\
  \n![](img/index-31_1.png)\n\n# 第 1 章：引言\n\n各种版本的 Unix 操作系统也非常流行，特别是在大型计算机系统中。一种名为\
  \ Linux 的 Unix 版本是作为一个开源项目开发的，这意味着许多人对它的开发做出了贡献，并且其代码是免费获取的。正因如此，Linux 成为某些用户的特别宠爱。Mac\
  \ OS X 是苹果公司开发的用于计算系统的操作系统。\n\n操作系统通常是为智能手机和平板电脑等移动设备定制的。苹果的 iOS 操作系统用于 iPhone、iPad\
  \ 和 iPod Touch。它在功能和外观上与桌面级 Mac OS 相似，但针对较小的设备进行了定制。同样，Windows Phone 是微软用于手机的 Windows\
  \ 操作系统版本。Android 是由谷歌开发的基于 Linux 的移动操作系统，用于许多手机。\n\n`application`（在会话中通常缩短为“app”）是除操作系统之外的任何软件的通用术语。文字处理器、导弹控制系统、数据库管理器、Web\
  \ 浏览器和游戏都可以被视为应用程序。每个应用程序都有其自己的用户界面，允许用户与该特定程序进行交互。\n\n大多数现代操作系统和应用程序的用户界面是 `graphical\
  \ user interface`（GUI，读作“gooey”），正如名称所示，它利用了图形屏幕元素。在许多元素中，这些元素包括：\n\n- `windows`（窗口）：用于将屏幕分为不同的工作区域\n\
  - `icons`（图标）：代表计算机资源（如文件）的小图像\n- `menus, checkboxes, and radio buttons`菜单、复选框和单选按钮）：为用户提供可选选项\n\
  - `sliders`（滑动条）：允许用户从范围内范围内值\n- `buttons`（按钮）：可以通过鼠标点击“按下”以表示用户的选择\n\n鼠标是用于 GUI\
  \ 的主要输入设备；因此，GUI 有时被称为 `point-and-click interfaces`（点点接口）。图 1.2 中的截图显示了一个 GUI 示例。\n\
  \n应用程序或操作系统的接口是软件的重要部分，因为它是程序中用户直接交互的唯一部分。对于用户来说，界面就是程序。对用户来说，界面就是程序。在整本书中，我们将讨论图形用户界面的设计和实现。本书的重点是开发高质量的应用程序。我们探索如何设计和编写能够执行计算、做出决策并以文本或图形形式呈现结果的软件。我们在全文中将使用\
  \ Java 编程语言来演示各种计算概念。\n\n![](img/index-32_1.png)\n![](img/index-32_2.png)\n\n##\
  \ 1.1 计算机处理\n\n**图 1.2** 图形用户界面 (GUI) 示例\n\n存储和管理信息使用了两种基本技术：模拟和数字。`Analog`（模拟）信息是连续的，与信息的源直接成正比。例如，酒精温度计是测量温度的模拟设备。酒精在管中的上升与管外的温度直接成正比。另一个模拟信息的例子是用于表示声波振动的电子信号。信号的电压与原始声波直接成正比。立体声放大器将这种电子信号发送到扬声器，扬声器通过振动重现声音。\n\
  \n我们使用模拟一词是因为信号与它代表的信息直接类比。图 1.3 描绘了代表声波的电子信号。\n\n### 核心概念\n\n`Digital`（数字）技术将信息分解为离散的片段，数字计算机通过将这些片段表示为数字来存储信息。音乐带以数字形式存储，是通过将其分解为片段并将每个片段表示为数字。\n\
  \n图 1.3 声波和电子信号\n\n特定实例的电压电平在短时间内进行了多次测量，也许每秒 44,000 次。每秒的测量次数被称为 `sampling rate`（采样率）。如果采样足够频繁，离散的电压测量值就可以生成一个连续的模拟信号。在大多数情况下，目标是创建一个足以人类感官的原始信号再现。\n\
  \n图 1.4 显示了模拟信号的采样。当模拟信息通过分解为片段转换为数字格式时，我们说它被数字化了。\n\n图 1.4 通过采样数字化模拟信号\n\n![](img/index-34_1.png)\n\
  ![](img/index-34_2.png)\n![](img/index-34_3.png)\n\n**图 1.5** 通过将字符映射到数字存储文本\n\n\
  采样之间可能会丢失信息\n\nH i , H e t e r .\n72 105 44 32\n72 101 97 116\n104 101 114\n\n##\
  \ 二进制数\n\n数字计算机以数字存储信息，但这些数字不是以十进制值存储的。计算机中的所有信息都以二进制值存储和管理。与具有 10 个数字（0 到 9）的十进制系统不同，二进制系统只有两个数字（0\
  \ 和 1）。单个二进制位被称为 `bit`。\n\n\n\n\n所有的数字系统都按照相同的规则运行。数字系统的`base value`（基值）决定了我们可以使用的位数，并指示了数字中每个数字的位值。十进制系统的**核心概念**是\
  \ 10 进制，而二进制系统是 2 进制。见附录 B。\n\n二进制用于在计算机中存储和移动信息，因为文中对数字系统进行了详细讨论。\n\n现代计算机使用二进制数，是因为存储和移动信息的设备成本更低且更可靠。如果二进制数据只需要表示两个可能值之一，那么这些数据就是廉价且可靠的。除了这个特性外，二进制系统并没有特殊之处。\n\
  \n虽然已经创建了使用其他数字系统存储和移动信息的计算机，但它们并不如方便。\n\n某些计算机内存设备（如硬盘）本质上是磁性的。磁性材料很容易被极化为其中一个极端，但中间水平很难区分。因此，磁性设备可以非常有效地表示二进制值——磁化区域代表二进制\
  \ 1，去磁化区域代表二进制 0。其他计算机内存设备由微小的电子电路组成。如果这些设备只需要在两个状态之间切换，那么它们更容易制造，而且不太可能故障。与其创建更少、更复杂的设备，我们再复制数百万这种简单设备会更好。\n\
  \n二进制值和数字电子信号紧密相分的。它们提高了我们沿着电线可靠地传输信息的能力。正如我们所看到的，模拟信号具有连续变化的电压和无限多的状态，而数字信号是`discrete`（离散的），这意味着电压在一个极端（如\
  \ +5 伏）和另一个极端（如 –5 伏）之间发生剧烈变化。在任何一点，数字信号的电压都被视为“高”（代表二进制 1）或“低”（代表二进制 0）。图 1.6 对比了这两种信号。\n\
  \n当信号沿着电线移动时，由于环境的影响会变弱并衰化。这意味着原始信号的电压水平发生了轻微变化。\n\n模拟信号的问题在于，随着它的波动，会丢失原始信息。由于信息与信号直接对应，信号的任何变化都会改变信息。模拟信号的变化无法恢复，因为衰化的信号与原始信号一样有效。数字信号的衰化程度与模拟信号一样，但由于数字信号最初处于两个极端之一，在任何信息丢失之前可以对其进行增强。电压可能会与其原始值发生轻微变化，但它仍然可以被正确地解释为高或低。\n\
  \n我们在任何特定情况下使用的位数决定了我们可以表示的唯一项目数量。单个位（bit）有两个可能的值：0 和 1，因此可以表示两个可能的项目或或情况。如果我们想表示灯泡的状态（关闭或开启），一个位就足够了，因为我们可以将\
  \ 0 解释为灯泡关闭，将 1 解释为灯泡开启。如果我们想表示两个两个以上的东西，就需要多于一个位。\n\n两个位组合在一起可以表示四种可能的项目，因为两个位恰好有四种排列：00、01、10\
  \ 和 11。假设我们想表示汽车所处的档位（P 档、D 档、倒车档或空档）。我们只需要两个位，就可以在位排列和档位之间建立映射。例如，我们可以说 00 代表 P\
  \ 档，01 代表 D 档，10 代表倒车档，11 代表空档。在这种情况下，交换该映射没有关系，尽管在某些情况下，位排列与它们所表示的内容之间的关系是重要的。\n\
  \n三个位可以表示八个唯一项目，因为三位有**核心概念**八种排列。同样，四位可以表示 16 个项目，五位可以表示 32 个项目，以此此类推。图 1.7 显示了\
  \ `N` 位。因此，`N` 位可以表示多达 `2^N` 个唯一项目。使用的位数与它们能表示的项目数之间存在这种关系。通常情况下，`N` 位可以表示 `2^N`\
  \ 个唯一项目。每增加一个位，可以表示的项目数量就会增加一倍。\n\n**1 位**\n**2 位**\n**3 位**\n**4 位**\n**5 位**\n\
  \n**2 个项目**\n**4 个项目**\n**8 个项目**\n**16 个项目**\n**32 个项目**\n\n```\n0\n00\n000\n0000\n\
  00000\n10000\n1\n01\n001\n0001\n00001\n10001\n10\n010\n0010\n00010\n10010\n11\n\
  011\n0011\n00011\n10011\n100\n0100\n00100\n10100\n101\n0101\n00101\n10101\n110\n\
  0110\n00110\n10110\n111\n0111\n00111\n10111 \n```\n\n模拟信号\n数字信号\n\n**图 1.6** 模拟信号对比数字信号\n\
  \n![](img/index-36_1.png)\n\n**1.1 计算机处理**\n\n**35**\n\n我们已经看到如何通过将字符映射到数值来在计算机上存储文本句子。这些数值以二进制数的形式存储。假设我们想表示一种包含\
  \ 256 个字符的语言中的字符。我们需要使用八位，因为八位有 256 种排列（2⁸）。每个位排列都映射到一个字符。表示世界上 195 个国家需要多少位？七位是不够的，因为\
  \ 2⁷ 等于 128。八位是足够的，但 256 种排列中将没有所有都映射到一个国家。最终，在计算机上表示信息归结为要表示的项目以及将其映射到二进制值的方式。\n\
