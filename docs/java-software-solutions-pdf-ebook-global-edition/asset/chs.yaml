  \ 华氏度 = 106 摄氏度”，而不是“Temperature in Celsius: 106”。\n\n## 226\n# 第 4 章 编写类\n### 核心概念总结\n\
  \n■ 面对象编程的核心是定义具有良好状态和行为的类。\n\n■ 变量的作用域（决定了可以在哪里被引用）取决于它声明的位置。\n\n■ UML 类图帮助我们可视化程序中类的内容以及类之间的关系。\n\
  \n\n\n\n\n- 对象应该被封装，以保护其数据免受不当访问。\n- 实例变量应声明为 `private` 可见性以促进封装。\n- 大多数对象包含访问器方法（accessor）和修改器方法（mutator），以允许客户端以受控的方式管理数据。\n\
  - 方法返回的值必须与方法头中指定的返回类型一致。\n- 当调用方法时，实际参数会被复制到形式参数中。\n- 在方法中声明的变量是该方法的局部变量，不能在方法外部外部使用。\n\
  - 构造函数不能有任何返回类型，即使是 `void`。\n- GUI（图形用户界面）由组件、代表用户操作的事件以及响应这些事件的监听器组成。\n- 监听器通常定义为内部类，因为监听器与\
  \ GUI 组件之间存在着紧密的关系。\n\n## 练习\n\nEX 4.1 对于以下每一对项，请识别哪一个代表类，哪一个代表该类的对象？\na. `Weekdays`,\
