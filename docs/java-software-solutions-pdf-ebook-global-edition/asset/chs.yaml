  \n*本页特意留白。*\n\n![](img/index-610_1.png)\n\n12\n\n# 递归\n\n## 第 12 章目标\n\n- 解释递归的底层概念。\n\
  - 探索促进递归思维的示例。\n- 检查递归方法并剖析其处理步骤。\n- 定义无限递归并讨论避免它的方法。\n- 解释何时应该以及何时不应该使用递归。\n- 演示使用递归解决问题。\n\
  - 探索递归在图形程序中的应用。\n- 定义分形概念及其与递归的关系。\n\n递归是一种强大的编程技术，为某些问题提供了优雅的解决方案。本章介绍了递归处理的介绍。它包含了对递归基础概念的解释，然后探索了递归在编程中的应用。通过递归解决了几个几个特定问题，展示了它的多功能性、简单性和优雅性。\n\
  \n609\n\n![](img/index-611_1.png)\n\n610\n\n# 第 12 章 递归\n\n## 12.1 递归思维\n\n在之前的示例中，我们多次看到一个方法可以调用另一个方法来实现目标。但我们还没有看到的是，递归作为一种编程技术——一个方法可以调用它自己。递归是一种方法通过调用自身来实现其目的的编程技术。能够递归编程的关键在于能够进行递归思维。但在深入研究如何在程序中递归地使用递归细节之前，我们需要探索递归的通用概念。\n\
  \n递归思维的能力对于将递归作为一种编程技术至关重要。\n\n通常，递归是根据自身来定义某物的过程。例如，考虑单词 *decoration*（装饰）的以下定义：decoration\
  \ : n. 用于装饰某物的任何装饰品或点缀。*decorate*（装饰）一词被用来定义 *decoration* 一词。你可能记得小学老师告诉过你在解释单词含义时要避免这种递归定义。然而，在许多情况下，递归是表达思想或定义的恰当方式。例如，假设我们想要正式定义一个由一个或多个数字组成、逗号分隔的列表。这样的列表可以递归地定义为一个数字，或者为一个数字后跟着逗号，再跟着列表。这种定义可以表示为：一个\
  \ *List* 是：数字或一个：数字 逗号 *List*。\n\n这种对 *List* 的递归定义定义了以下每个数字列表：24, 88, 40, 37, 96,\
  \ 43, 14, 64, 21, 69, 32, 93, 47, 81, 28, 45, 81, 52, 69, 70。\n\n无论列表有多长，递归定义都能描述它。单元素列表（如上一个示例所示）完全由定义的第一个（非递归）部分定义。对于任何多于一个元素的列表，定义中的递归部分（引用自身的部分）将根据需要使用若干次，直到达到最后一个元素为止。列表中的最后一个元素始终由定义的非递归部分定义。图\
  \ 12.1 显示了一个特定的数字列表如何对应于 *List* 的递归定义。\n\n### 无限递归\n\n注意，*List* 的定义包含一个递归选项和一个非递归选项。定义中的非递归部分称为*基准*（base）。\n\
  \n![](img/index-612_1.png)\n\n12.1 递归思维\n\n**列表: 数字 逗号列表**\n24, 88, 40, 37\n**数字\
  \ 逗号列表**\n88, 40, 37\n**数字 逗号列表**\n40, 37\n**数字**\n37\n\n**图 12.1** 追踪 *List* 递归定义的案例。如果所有选项都有递归组件，递归将永远不会。例如，如果\
  \ *List* 的定义仅仅是“一个数字后跟着逗号，再跟着一个 *List*”，那么任何列表都无法结束。\n\n这个问题被称为*无限递归*。它类似于无限循环，无限循环允许递归最终结束，区别在于这个“循环”发生在定义本身中。\n\
  \n与无限循环问题一样，程序员必须小心设计算法以避免无限递归。任何递归定义都必须有一个不会产生递归选项的基准情况。*List* 定义的基准情况是一个单一数字，后面没有跟随内容。换句话说，当到达列表中的最后一个数字时，基准选项会终止递归路径。\n\
  \n### 数学中的递归\n\n让我们来看一个数学中递归的例子。`N!`（读作 *N 阶乘*）的值对于任何正整数 `N` 都定义为 1 到 `N` 之间所有整数的乘积。因此，`3!`\
  \ 定义为：`3! = 3*2*1 = 6`，而 `5!` 定义为：`5! = 5*4*3*2*1 = 120`。\n\n数学公式通常递归地表示。`N!` 的定义可以递归地表示为：\n\
  `N! = N * (N-1)!` `N > 1`\n\n![](img/index-613_1.png)\n\n612\n\n**第 12 章 递归**\n\n\
  定义的基准情况是 `1!`，定义为 1。所有其他的 `N!` 值（当 `N > 1` 时）都递归地定义为 `N` 乘以 `(N-1)!`。因为 `N!` 只对正整数定义，所以这个定义是完整的并将以基准情况结束。下一节描述如何在程序中实现递归。\n\
  \n### 自测（答案见附录）\n\nSR 12.1 什么是递归？\nSR 12.2 *List* 定义的递归部分使用了多少次来定义一个十数字列表？基准情况使用了多少次？\n\
  SR 12.3 什么是无限递归？\nSR 12.4 递归处理何时需要基准情况？\nSR 12.5 为 `5 * n`（整数乘法）编写递归定义，`n > 0`。用整数相加定义乘法过程。例如，`5\
  \ * 7` 等于 7 次 5 加。\n\n## 12.2 递归编程\n\n让我们使用一个简单的数学运算演示递归编程的概念。考虑 1 到 `N` 之间值的和，其中\
  \ `N` 是任何正整数。从 1 到 `N` 的值的和可以表示为 `N` 加上从 1 到 `N-1` 的值的和。该和可以以类似的方式表示，如图 12.2 所示。\n\
  \n*N*\n*N–1*\n*N–2*\n∑ *i* = *N* + ∑ *i* = *N* + *N* – 1 + ∑ *i*\n*i* = 1\n*i* =\
  \ 1\n*i* = 1\n*N–3*\n= *N* + *N* – 1 + *N* – 2 + ∑ *i*\n..\n= *N* + *N* – 1 + *N*\
  \ – 2 + . . . + 2 + 1\n\n**图 12.2** 1 到 *N* 的数字的和，通过递归定义\n\n\n\n\n例如，1 到 20 之间数值的和等于\
  \ 20 加上 1 到 19 之间数值的和。继续这种方法，1 到 19 之间数值的和等于 19 加上 1 到 18 之间数值的和。\n\n这听起来可能是解决这个问题很奇怪的方法，但这是一个直观的例子，可以用来演示如何编写递归。\n\
  \n正如我们之前提到的，在 `Java` 中，与许多其他编程语言中一样，方法可以调用自己。每次调用该方法都会创建一个新的工作环境。也就是说，每调用一次方法，所有局部变量和参数都会重新定义，并拥有它们自己独特的数据空间。每个参数都会根据新的调用赋予一个初始值。每当一个方法终止时，处理就会返回到调用它的方法（这可能是对方法的每次递归调用都是该方法的早先调用）。这些规则与管理任何“普通”方法调用的规则没有区别。\n\
  \n核心概念\n求和问题的递归解决方案由以下名为 `sum` 的递归方法定义：\n\n```java\n// 此方法返回 1 到 num 的和\npublic\
  \ int sum(int num)\n{\n    int result;\n    if (num == 1)\n        result = 1;\n\
  \    else\n        result = num + sum(num-1);\n    return result;\n}\n```\n\n注意，该方法本质上体现了我们的递归定义，即\
  \ 1 到 `N` 之间数字的和等于 `N` 加上 1 到 `N −1` 之间数字的和。`sum` 方法是递归的，因为 `sum` 调用了自己。每次调用 `sum`\
  \ 时，传递给 `sum` 的参数都会递减，直到达到 1 的基本情况。递归方法总是包含一个 `if-else` 语句，其中一个分支（通常是第一个）代表基本情况，如本例所示。\n\
  \n假设 `main` 方法调用 `sum` 并向其传递初始值 1，该值存储在参数 `num` 中。由于 `num` 等于 1，结果 1 返回给 `main`，且没有发生递归。\n\
  \n现在让我们追踪一下 `sum` 方法在传递初始值 2 时的执行情况。由于 `num` 不等于 1，将再次使用参数 `num1`（即 1）调用 `sum`。这是对方法\
  \ `sum` 的新调用，具有新的参数 `num` 和新的局部变量 `result`。由于在这次调用中 `num` 等于 1，结果直接返回，不再进行进一步的递归调用。控制返回到第一个被调用的\
  \ `sum` 版本。返回值 1 被加到该 `sum` 调用中 `num` 的初始值（即 2）上。因此，`result` 被赋值为 3，并返回给 `main`\
  \ 方法。对递归过程的仔细追踪可以让我们深入了解它是如何用于解决问题的。从 `main` 调的方法正确计算了从 1 到 2 的整数的和，并返回结果 3。\n\n\
  求和示例中的基本情况是 `N` 等于 1，此时不再进行进一步的递归调用。递归开始回溯到 `sum` 方法的早先版本，每次都返回适当的值。每个返回值都对更高层求和的计算做出贡献。\n\
  \n如果没有基本情况，就会导致无限递归。每次方法调用都需要额外的内存空间；因此，无限递归通常会导致指示内存已耗尽的运行时错误。\n\n使用不同的 `num` 初始值追踪\
  \ `sum` 函数，直到对这种处理变得熟悉。图 12.3 展示了 `main` 调用 `sum` 来确定从 1 到 4 的整数之时的递归调用。每个框代表方法被调用时的副本，表示分配了用于存储形式参数和任何局部变量的空间。调用用实线表示，`main`\
  \ 调用和返回用虚线表示。每一步都显示了返回值 `result`。完全遵循递归路径直到到达基本情况；然后调用开始沿着链链向上返回其结果。\n\n```\nresult\
  \ = 10\nsum(4)\nresult = 6\nsum(3)\nresult = 3\nsum(2)\nresult = 1\nsum(1)\n```\n\
  **图 12.3** 对 `sum` 方法的递归调用\n\n### 递归 vs 迭代\n\n当然，我们刚刚探索的求和问题有一个非递归的解决方案。以迭代方式计算\
  \ 1 到 `num`（包含）之间数字和的一种方法如下：递归是解决某些问题最优雅、合适的方法，但对于其他问题，它没有迭代解决方案那么直观。\n\n```java\n\
  sum = 0;\nfor (int number = 1; number <= num; number++)\n    sum += number;\n```\n\
  \n这个解决方案显然比递归版本更直接。我们使用求和问题来演示递归是因为它简单，而不是因为在正常情况下你会使用递归来解决它。递归具有多次方法调用的开销，并且在这种情况下，它提供了一个比其迭代对应方案更复杂的解决方案。\n\
  \n程序员必须学习何时使用递归，何时不使用递归。确定哪种方法最好取决于正在解决的问题。所有问题都可以以迭代的方式解决，但在某些情况下，迭代版本要复杂得多。\n\n\
  ### 直接递归 vs 间接递归\n\n*直接递归*发生在方法调用自身时，例如当 `sum` 调用 `sum`。\n\n*间接递归*发生在方法调用另一个方法时，最终导致原始方法被再次调用。例如，如果方法\
  \ `m1` 调用 `m2`，而 `m2` 调用 `m1`，我们可以说 `m1` 是间接递归的。间接深度可能达到几层，例如 `m1` 调用 `m2`，`m2`\
  \ 调用 `m3`，`m3` 调用 `m4`，`m4` 调用 `m1`。图 12.4 描绘了一个带有间接递归的情况。方法调用用实线表示，返回用虚线表示。遵循整个调用路径，然后递归开始展开。\n\
  \n间接递归对基本情况的关注与直接递归的要求完全相同。此外，由于中间插入的方法调用，间接递归可能更难追踪。因此，在设计或评估间接方法时需要格外小心。确保间接性是绝对必要的，并在文档中进行了清晰的解释。\n\
  \n**图 12.4** 间接递归\n\n**自习题** *(请参见附录 N 中的答案)*\nSR 12.6 递归是必要的吗？\nSR 12.7 何时应该避免递归？\n\
