  \    public static void main(String[] args)\n    {\n        System.out.println();\n\
  \        System.out.println(\" \" + args[0]);\n        System.out.println(\"My name\
  \ is \" + args[1]);\n    }\n}\n```\n**输出**\n```\n> java NameTag Howdy John\nHowdy\n\
  My name is John\n\n> java NameTag Hello Bill\nHello\nMy name is Bill\n```\n\n记住\
  \ `main` 方法的参数始终是一个 `String` 对象的数组。如果你想让数字信息作为命令行参数输入，程序需要将其转换。你应当注意，在某些程序开发环境中，不使用命令行提交程序。在这种情况下，命令行信息可以通过其他方式指定。查阅文档了解这些细节。\n\
