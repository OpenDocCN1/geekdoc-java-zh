  \ Demo\");\n    frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n    ImageIcon\
  \ icon = new ImageIcon(\"devil.gif\");\n    JLabel label1, label2, label3;\n   \
  \ label1 = new JLabel(\"Devil Left\", icon, SwingConstants.CENTER);\n    label2\
  \ = new JLabel(\"Devil Right\", icon, SwingConstants.CENTER);\n    label2.setHorizontalTextPosition(SwingConstants.LEFT);\n\
  \    label2.setVerticalTextPosition(SwingConstants.BOTTOM);\n    label3 = new JLabel(\"\
  Devil Above\", icon, SwingConstants.CENTER);\n    label3.setHorizontalTextPosition(SwingConstants.CENTER);\n\
  \    label3.setVerticalTextPosition(SwingConstants.BOTTOM);\n    JPanel panel =\
  \ new JPanel();\n    panel.setBackground(Color.cyan);\n    panel.setPreferredSize(new\
  \ Dimension(200, 250));\n    panel.add(label1);\n    panel.add(label2);\n    panel.add(label3);\n\
  \    frame.getContentPane().add(panel);\n    frame.pack();\n    frame.setVisible(true);\n\
  }\n}\n```\n![](img/index-180.png)\n\n## 3.11 图像\n# 179\nSR 3.44 在 `LabelDemo` 程序中声明了多少个窗口、面板、图像图标和标签？\n\
