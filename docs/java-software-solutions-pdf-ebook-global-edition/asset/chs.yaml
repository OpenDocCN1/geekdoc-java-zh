  \ `RIGHT`。\nc. 将 `label2` 的水平文本位置从 `LEFT` 改为 `BOTTOM`。\nd. 将 `label3` 的垂直文本位置从 `BOTTOM`\
  \ 改为 `CENTER`。\n\n### 核心概念总结\n# 181\n### 核心概念总结\n- `new` 运算符返回新对象的引用。\n- 多个引用变量可以指向同一个对象。\n\
  - 方法通常在特定对象上执行，这会影响结果。\n- 类库为开发提供了帮助。\n- Java 标准类库按包组织。\n- `java.lang` 包中的所有类对每个程序都会自动导入。\n\
  - 伪随机数生成器通过复杂的计算产生随机错觉。\n- `Math` 类的所有方法都是静态的，这意味着它们通过类名调用。\n- 添加 `printf` 方法是为了支持旧系统的迁移。\n\
  - 枚举类型是类型安全的，确保不会无效值。\n- 包装类允许将基本类型作为对象进行管理。\n- 自动装箱提供了基本类型与相应包装对象之间的自动转换。\n- 容器是存放和组织其他组件的特殊\
  \ GUI 组件。\n\n\n\n\n\n- 帧（Frame）作为单独窗口显示，但面板（Panel）只能作为另一个容器的一部分显示。\n- 每个容器都由布局管理器（Layout\
  \ Manager）管理。\n- 面板可以嵌套，以创建复杂的组件包含层次结构。\n- 标签（Label）可以包含文本、图像或两者。\n\n## 练习\n\nEX\
