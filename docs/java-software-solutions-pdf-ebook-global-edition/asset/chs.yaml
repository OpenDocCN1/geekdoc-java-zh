  \n## 7.12 边框\n\n**391**\n\n**自习题** *(答案见附录 N )*\nSR 7.28 什么时候会咨询布局管理器？\nSR 7.29\
  \ 流布局管理器的行为如何？\nSR 7.30 描述边框布局的区域。\nSR 7.31 箱布局中的胶水组件起什么作用？\n\n## 7.12 边框\n\nJava\
  \ 提供了在任何 Swing 组件周围放置`边框（border）`的能力。边框本身不是一个组件，而是定义了任何组件边缘应该如何绘制，对 GUI 设计有重要影响。边框提供了有关\
  \ GUI 组件如何组织的视觉提示，并可用于为组件添加标题。图 7.11 列出了 Java 标准类库中预定义的边框。\n\n`BorderFactory` 类用于为组件创建边框。它有许多方法来创建特定类型的边框。通过使用组件对对象分组并使用组件的\
  \ `setBorder` 方法来集中注意力，可以将边框应用于组件。\n\n列表 7.24 中的程序演示了多种类型的边框。它只是创建了几个面板，为每个面板设置了不同的边框，然后使用网格布局在一个较大的面板中显示它们。\n\
  \n| 边框 | 说明 |\n| :--- | :--- |\n| 空边框 (Empty Border) | 在组件边缘留留缓冲区，但在其他方面没有视觉效果。\
  \ |\n| 线边框 (Line Border) | 包围组件的简单线条。 |\n| 刻蚀边框 (Etched Border) | 在组件周围创建凹槽的效果。\
  \ |\n| 斜角边框 (Bevel Border) | 创建组件高于表面或凹于表面的效果。 |\n| 标题边框 (Titled Border) | 在边框上或周围包含文本标题。\
  \ |\n|哑光边框 (Matte Border) | 允许指定每个边缘的大小。使用实色或图像。 |\n| 复合边框 (Compound Border) | 两个边框的组合。\
  \ |\n\n**图 7.11** 组件边框\n\n**392**\n**第 7 章** 面对象设计\n\n**listing 7.24**\n\n```java\n\
  //********************************************************************\n// BorderDemo.java\
  \ 作者: Lewis/Loftus\n//\n// 演示各种类型边框的使用。\n//********************************************************************\n\
  \nimport java.awt.*;\nimport javax.swing.*;\nimport javax.swing.border.*;\n\npublic\
  \ class BorderDemo\n{\n//-----------------------------------------------------------------\n\
  // 创建几个带边框的面板并显示它们。\n//-----------------------------------------------------------------\n\
  \    public static void main(String[] args)\n    {\n        JFrame frame = new JFrame(\"\
  Border Demo\");\n        frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \        JPanel panel = new JPanel();\n        panel.setLayout(new GridLayout(0,\
  \ 2, 5, 10));\n        panel.setBorder(BorderFactory.createEmptyBorder(8, 8, 8,\
  \ 8));\n\n        JPanel p1 = new JPanel();\n        p1.setBorder(BorderFactory.createLineBorder(Color.red,\
  \ 3));\n        p1.add(new JLabel(\"Line Border\"));\n        panel.add(p1);\n\n\
  \        JPanel p2 = new JPanel();\n        p2.setBorder(BorderFactory.createEtchedBorder());\n\
  \        p2.add(new JLabel(\"Etched Border\"));\n        panel.add(p2);\n\n    \
  \    JPanel p3 = new JPanel();\n        p3.setBorder(BorderFactory.createRaisedBevelBorder());\n\
  \        p3.add(new JLabel(\"Raised Bevel Border\"));\n        panel.add(p3);\n\n\
  \        JPanel p4 = new JPanel();\n        p4.setBorder(BorderFactory.createLoweredBevelBorder());\n\
  \        p4.add(new JLabel(\"Lowered Bevel Border\"));\n        panel.add(p4);\n\
  \n        JPanel p5 = new JPanel();\n        p5.setBorder(BorderFactory.createTitledBorder(\"\
  Title\"));\n        p5.add(new JLabel(\"Titled Border\"));\n        panel.add(p5);\n\
  \n        JPanel p6 = new JPanel();\n        TitledBorder tb = BorderFactory.createTitledBorder(\"\
  Title\");\n        tb.setTitleJustification(TitledBorder.RIGHT);\n        p6.setBorder(tb);\n\
  \        p6.add(new JLabel(\"Titled Border(right)\"));\n        panel.add(p6);\n\
  \n        JPanel p7 = new JPanel();\n        Border b1 = BorderFactory.createLineBorder(Color.blue,\
  \ 2);\n        Border b2 = BorderFactory.createEtchedBorder();\n        p7.setBorder(BorderFactory.createCompoundBorder(b1,\
  \ b2));\n        p7.add(new JLabel(\"Compound Border\"));\n        panel.add(p7);\n\
  \n        JPanel p8 = new JPanel();\n        Border mb = BorderFactory.createMatteBorder(1,\
  \ 5, 1, 1, Color.red);\n        p8.setBorder(mb);\n        p8.add(new JLabel(\"\
  Matte Border\"));\n        panel.add(p8);\n\n        frame.getContentPane().add(panel);\n\
  \        frame.pack();\n        frame.setVisible(true);\n    }\n}\n```\n\n**393**\n\
  **listing 7.24**\n*续*\n\n让我们看看此程序创建的每种类型的边框。`空边框`应用于包含所有其他面板的大面板，以便在框架的外边缘留出缓冲区空间。空边框的顶部、左、底部和右边缘的大小以像素为单位。`线边框`使用特定的颜色创建，并以像素指定线条厚度（此处为\
  \ 3）。如果没有指定，线条厚度默为 1 像素。此程序创建的`刻蚀边框`使用默认颜色作为高亮和阴影，但如果需要，可以显式设置两者。\n\n\n\n\n`bevel\
  \ border`（斜角框）可以是凸起的也可以是凹的。本程序使用了默认颜色，但根据需要对斜角框每个部分的颜色进行定制，包括外高亮、内高亮、外阴影和内阴影。如果需要，这些每个部分都可以采用不同的颜色。\n\
  \n![](img/index-395_1.png)\n\n`titled border`（有标题框）在边框上或周围放置一个标题。标题的默认位置位于边框左上。使用\
  \ `TitledBorder` 类的 `setTitleJustification` 方法，可以将此位置设置为边框上方、下方、内部、左侧、右侧或中心等许多位置。\n\
  \n`compound border`（复合框）是两个或多个边框的组合。程序中的示例创建了一个使用线框和蚀刻框组合的复合框。`createCompoundBorder`\
  \ 方法接受两个边框作为参数，并将第一个参数设置为外边框，第二个参数设置为内框。三个或更多边框的组合可以通过先使用两个边框创建一个复合框，然后使用它和另一个边框创建另一个复合框来实现。\n\
  \n![](img/index-396_1.png)\n\n## 7.13 包含层次结构\n\n`matte border`（留白框）指定了边框上、左、下、右边缘的尺寸（像素）。这些边缘可以由单一颜色组成（如本示例所示），也可以使用图像图标。\n\
  \n使用边框时应谨慎。它们有助于引起对 GUI 相关部分的关注，并在概念上将相关项分组在一起。\n\n然而，如果使用不当，它们也会损害呈现的优雅性。边框应该增强界面，而不是使其复杂化或与其竞争。\n\
  \n**自测习题**（答案见附录 N）\n- **SR 7.32** `BorderFactory` 类的作用是什么？\n- **SR 7.33** 列出并简述本节介绍的每种边框类型。\n\
  \n## 7.13 包含层次结构\n\n组件分组到容器中的方式，以及这些容器相互嵌套的方式，确定了 GUI 的 `containment hierarchy`（包含层次结构）。\n\
  \n我们在第 3 章中引入了这个概念。通过仔细设计包含层次结构，可以对 GUI 进行定制以获得精确的视觉效果。\n\n对于任何 Java 程序，通常会有一个主容器，称为\
  \ `top-level container`（顶层容器），例如框架或 applet。程序的顶层容器通常包含一个或多个其他容器，例如面板。这些面板可能包含其他面板，以根据需要组织其他组件。\n\
  \n每个容器都可以有它自己的布局管理器。GUI 的最终外观是为每个容器选择的布局管理器以及包含层次结构设计的函数。可以有许多组合，很少有单一的最佳选择。一如既往，我们应该遵循预期的系统目标和通用的\
  \ GUI 设计指南。\n\n图 7.12 显示了一个 GUI 应用，并进行了标注以描述其包含层次结构。程序中使用的几个组件在文中之前讨论过；其他组件将在后面的章节中讨论。\n\
  \n注意，在许多情况下，仅通过观察 GUI 无法看出某些容器的用途。特别是 `panel`（面板），除非我们以某种方式引起注意（例如给它一个边框），否则它是不可见的。我们还可以使用不可见组件在组件之间提供特定的间距。这些元素都是包含层次结构的一部分，尽管它们对用户是不可见的。\n\
  \n![](img/index-397_1.png)\n\n**图 7.12** GUI `JFrame` 的包含层次结构\n（注：该图描述了一个包含北、西、中、东、南区域的\
  \ Border Layout，其中包含各种 `JPanel`、`JLabel`、`JCheckBox`、`JButton`、`JSlider`、`JTextField`\
  \ 和 `JComboBox` 组件。）\n\n特定程序的包含层次结构可以表示为树结构，如图 7.13 所示。树的根是顶层容器。树的每一层显示了上一层容器中所包含容器和组件。\n\
  \n当发生可能影响程序中组件视觉布局的更改时，会轮询每个容器的布局管理器。其中一个的变化可能会影响另一个。这些更改根据需要通过包含层次结构进行传递。\n\n**自测习题**（答案见附录\
  \ N）\n- **SR 7.34** GUI 的包含层次结构是什么？\n- **SR 7.35** 为第 5 章所示的 `LeftRight` 应用 GUI\
  \ 画出包含层次结构树。\n\n### 关键概念总结\n- 设计上的投入既至关重要又具有成本效益。\n- 问题描述中的名词可能指示程序中需要的某些类和对象。\n\
  - 静态变量在类的所有实例之间共享。\n- 聚合对象由其他对象组成，形成“有一个”（has-a）的关系。\n- 接口是抽象方法的集合，因此不能实例化。\n- 枚举类型的值是该类型的静态变量。\n\
  - 可以在枚举类型的定义中添加属性和方法。\n- 对象提供的复杂服务可以被分解以利用私有方法。\n- 当将对象传递给方法时，实际参数和形式化参数成为别名。\n\
  - 重载方法的版本通过参数的数量、类型和顺序来区分。\n- 测试程序永远无法保证没有错误。\n- 一个好的测试是能够发现错误的测试。\n- 对程序进行所有可能的输入和用户操作的穷尽测试是不可行的。\n\
  - 任何 GUI 设计都应遵循关于一致性和易用性的基本指南。\n- 容器的布局管理器决定了组件如何在视觉上呈现。\n- 当发生更改时，容器中的组件将根据布局管理器的策略重新组织。\n\
  - 每个容器的布局管理器都可以显式设置。\n- 边框可以应用于 Swing 组件以对对象分组并集中注意力。\n- GUI 的外观是包含层次结构和每个容器布局管理器的函数。\n\
