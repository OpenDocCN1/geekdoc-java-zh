  537\n\n### 插入排序\n\n`Sorting` 类还包含一个对 `Comparable` 对象数组执行插入排序的方法。如果用它对 `PhoneList`\
  \ 程序中的 `Contact` 对象数组进行排序，它将产生与选择排序相同的结果。\n\n然而，用于将对象顺序排列的逻辑是不同的。\n\n`插入排序`算法通过重复地将一个特定值插入到列表中已经排序的子集中，从而对一组值列表进行排序。每个未排序的元素一个接一个地插入到该排序子集的适当位置，直到整个列表都按顺序排列。\n\
  \n插入排序的通用策略是：从一个只包含一个值的“已排序”列表开始。在必要时通过交换它们对列表的前两个值进行相对排序。将列表的第三个值插入到相对于前两个（已排序）值的适当位置。然后，将第四个值插入到其相对于列表中前三个值的正确位置。每进行一次插入，已排序子集中的值数量就会增加一个。继续这个过程，直到所有值都插入到它们正确的位置，此时列表就完全排序了。\n\
  \n插入过程要求数组中的其他值移动以为插入的元素留出空间。图 10.3 展示了整数插入排序算法的行为。\n\n3 已排序。\n3 9 6 1 2\n不移动。插入\
  \ 9。\n3 和 9 已排序。\n将 9 向右移动。插入 6。\n3 9 6 1 2\n3, 6 和 9 已排序。\n3 6 9 1 2\n将 9, 6 和\
  \ 3 向右移动。插入 1。\n1, 3, 6 和 9 已排序。\n1 3 6 9 2\n将 9, 6 和 3 向右移动。插入 2。\n所有值都已排序。\n1\
  \ 2 3 6 9\n\n**图 10.3** 插入排序处理\n\n538\n\n## 第 10 章 多态\n\n与选择排序的实现类似，`insertionSort`\
  \ 方法使用两个 `for` 循环对数组进行排序。然而，在插入排序中，外层循环控制数组中下一个插入值的索引。内层循环将当前插入的值与存储在较低索引处的值（这些值组整个列表的排序子集）进行比较。如果当前插入的值小于该位置的值，则该值向右移动。持续移动，直到打开一个适当的位置来接受插入值。外层循环的每次迭代都会向列表的排序子集增加一个值，直到整个列表排序完毕。\n\
  \n### 比较排序算法\n\n选择一种排序算法而不是另一种算法有多种原因，包括算法的简单性、效率水平以及它所占的内存。更容易理解的算法也更容易实现和调试。然而，最简单的排序算法往往是效率最低的。\n\
  \n效率通常被认为是比较排序算法的首要标准。通常情况下，如果一个排序算法执行的比较次数比另一个多，那么它的效率就较低。有几种算法比我们检查的两种算法更高效，但它们也更复杂。\n\
  \n选择排序和插入排序在本质上具有相同的效率。它们都有一个外层循环和一个内层循环，具有相似的属性（尽管目的不同）。外层循环为列表中的每个值执行一次，而内层循环将外层循环中的值与列表中其余部分的大部分（如果全部）值进行比较。因此，两种算法都执行大约\
  \ `n²` 次比较，其中 `n` 是列表中值的数量。我们说选择排序和插入排序都是 `order n²` 阶的算法。更高效的排序执行的比较较少，且阶较小，例如\
  \ `n log2 n`。\n\n由于选择排序和插入排序具有相同的通用效率，在它们之间的选择几乎是随机的。然而，还有一些额外的问题需要考虑。选择排序通常易于理解，在许多情况下也足够。此外，每个值都恰好移动一次到达它在列表中的最终位置。也就是说，虽然选择排序和插入排序在比较次数上（通常）是等的，但选择排序的交换次数更少。\n\
