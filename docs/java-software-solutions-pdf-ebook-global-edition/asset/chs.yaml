  \n**PDL—** *参见* 程序设计语言。\n\n**面板—panel—** 图形用户界面 (GUI) 遵循其用于包含和组织其他 GUI 组件的容器。\n\n\
  \n\n\n# 附录 A 术语表\n\n**后缀表达式—postfix expression—** 运算符位于其操作数之后的表达式。*参见* 中间表达式（infix\
  \ expression）。\n\n**后缀运算符—postfix operator—** 在 Java 中，位于单个操作数后面的运算符，其求值结果为操作执行之前的值。递增（++`）和递减（--`）运算符都可以作为后缀使用。*参见*\
