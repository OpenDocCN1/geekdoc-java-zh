  \ `PaintBox` 程序。\n\n## PaintBox 细化 #2\n\n下一个细化是处理绘制基本形状的能力，因为所有操作都以某种方式使用形状。因此，在这次细化中，我们关注提供绘制形状背后的按钮功能。\n\
  \n我们在细化中预期的其他类可以考虑使用 Java 标准库，但通过进一步调查，我们发现使用 `Rectangle` 类与我们的目标并不一致。因此，正如我们在架构设计中构想的那样，为每种形状考虑一个类：`Line`、`Oval`、`Rect`\
  \ 和 `Poly`。记住，圆和正方形将分别是 `Oval` 和 `Rect` 类的特定实例。每个形状类将有一个在屏幕上绘制该形状的 `draw` 方法。\n\n\
  现在考虑每个形状需要存储哪些信息以便绘制自身。直线需要两个点：起点和终点。\n\n另一方面，多折线需要点列表来定义每个线段的起点和终点。椭圆和矩形都由边界框定义，存储左上角以及宽度高度。\n\
  \n这种分析得出结论：`Oval` 和 `Rect` 对象具有可以使用继承利用的特性。例如，它们都可以继承自名为 `BoundedShape` 的类。此外，由于所有形状都必须存储用于跟踪整个图形的\
  \ `ArrayList` 对象中，拥有一个通用 `Shape` 类将简化细化过程。\n\n`DrawingPanel`\n`*`\n`Shape`\n`– strokeColor\
  \ : Color`\n`+ draw() : void`\n`ArrayList`\n`Line`\n`BoundedShape`\n`Poly`\n`– firstPoint\
