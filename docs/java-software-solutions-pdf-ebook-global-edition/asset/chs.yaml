  \n## 1.6 面向对象编程正如正如本章早期提到的，Java 是一种面向对象的（OO）语言。正如名称所示，`object`（对象）是 Java 程序中的基本实体。本书重点关注通过定义相互作用的对象来开发软件的思想。\n\
  \n面向对象软件开发的原理已经存在很多年，基本上和高级编程语言的使用一样久。20 世纪 60 年代的编程语言 Simula 具有定义现代面向对象开发方法的许多特征。\n\
  \n在 20 世纪 80 年代和 90 年代，由于 `C++` 和 `Java` 等编程语言的发展，面向对象编程变得极其流行。现在它是商业软件开发的主流方法。\n\
  \n面向对象方法吸引人的特点之一是对象可以非常有效地表示现实世界的实体。例如，我们可以使用软件对象来代表公司的一名员工。我们会为每个员工创建一个对象，每个对象都具有我们需要表示的行为和特征。通过这样，面向对象编程允许我们将程序映射到\n\
  \n![](img/index-72_1.png)\n\n![](img/index-72_2.png)\n\n**71**\n\n程序所代表的现实情况中。这就是那个\
  \ `KeY COnCept`\n\n\n\n\n\n面向对象的方法使得问题解决变得更容易。面向对象编程帮助我们解决问题，而这正是我们编写程序的初衷。\n\n\
  让我们讨论一下与问题解决相关的通用问题，然后讨论编写程序的目的。探索面向对象的方法中帮助我们解决这些问题的特定特质（characteristics）。\n\n\
  ### 问题解决\n\n通常情况下，问题解决包含多个步骤：\n1. 理解问题。\n2. 设计解决方案。\n3. 考虑解决方案的替代方案并完善解决方案。\n4.\
  \ 实现解决方案。\n5. 测试解决方案并修复任何存在的问题。\n\n尽管这种方法适用于任何类型的问题解决，但在开发软件时效果尤为显著。这些步骤并非纯线性的。也就是说，某些活动会与其他活动重叠。但在某个时刻，所有这些步骤都应该被仔细处理。\n\
  \n第一步理解问题听起来似乎显而易见，但对这一步的忽视是许多软件开发工作误入方向的原因。如果我们尝试解决一个我们并不完全理解的问题，往往最终会解决错误的问题，或者至少偏离了不恰的主题。每个问题都有一个`问题领域`（problem\
  \ domain），即对我们的解决方案关键的现实世界问题。例如，如果我们要写一个程序来记录球赛得分，那么问题领域就包含了保龄球规则。为了开发出良好的解决方案，我们必须彻底理解问题领域。\n\
  \n设计问题解决方案的关键在于将其分解为易于管理的部分。任何问题的解决方案很少能被表达为一个巨大的任务。相反，它是一系列相互协作的小任务。程序设计涉及将相互交互的任务分解，以执行一个更大的任务。在开发软件时，我们并不是写一个巨大的程序。我们设计出负责解决方案某些部分的独立单元，然后将它们与其他部分集成在一起。\n\
  \n我们对解决方案的首选直觉可能不是最好的。我们必须始终考虑替代方案，并在必要时完善解决方案。我们越早考虑替代方案，修改方法的方法就越容易。\n\n实现解决方案是将设计并将其转化为可用形式的行为。在为问题开发软件解决方案时，实现阶段实际上是实际编写程序的过程。编程往往被认为是编写代码。但在大多数情况下，设计程序的行为应该比在特定编程语言中实现设计的过程要有趣得多且更具创造性。\n\
  \n在开发过程的许多节点，我们都应该测试自己的解决方案以发现任何存在的错误，以便修复它们。测试不能保证没有尚未被发现的问题，但它可以增强我们对拥有可行解决方案的信心。\n\
  \n在本文中，我们将探索允许我们设计和实现优雅程序的技术。尽管我们经常沉浸在这些细节中，但我们永远不要忘记，我们的要目标是解决问题。\n\n### 面向对象原则\n\
  \n面向对象编程最终要求对以下术语有深入理解：\n- 对象 (object)\n- 属性 (attribute)\n- 方法 (method)\n- 类 (class)\n\
  - 封装 (encapsulation)\n- 继承 (inheritance)\n- 多态 (polymorphism)\n\n除了这些术语，还有许多相关概念允许我们以无数方式定制解决方案。本书旨在帮助你逐渐自然地进化对这些概念的理解。本节提供了这些思想的高层次概述，以建立术语并提供大局。\n\
  \n我们之前提到过`对象`是程序中的基本元素。软件对象通常代表我们问题领域中的真实对象，例如银行账户。每个对象都有`状态`（state）和一组`行为`（behaviors）。我们所说的“状态”是指状态——当前定义对象的根本特征。例如，银行账户状态的一部分是它的当前余额。对象的行为是与对象相关的活动。与银行账户行为可能包括存款和取款的能力。\n\
  \n除了对象之外，`Java`程序还管理原始数据。`Primitive data`包括数字和字符等基本值。对象通常代表更有趣或更复杂的实体。\n\n对象的`attributes`（属性）是它在内部存储的值，这些值可以表示为原始数据或其他对象。例如，银行账户对象可能会存储一个代表账户余额的浮点数（一个原始值/primitive\
  \ value）。它还可能包含其他属性，例如账户持有者的姓名。对象属性的所有值共同定义了它的当前状态。\n\n正如本章前面提到的，`method`（方法）是一组被赋予了名称的编程语句。当一个方法被调用时，它的语句就会被执行。一组方法与一个对象相关。对象的方法定义了它的潜在行为。为了定义向银行账户存款的能力，我们定义了一个包含编程语句的方法，这些语句将相应地更新账户余额。\n\
  \n对象由`class`（类）定义。类是创建对象的模型或蓝图。考虑一下建筑师在设计房屋时创建的蓝图。蓝图定义了房子的重要特征——墙壁、窗户、门、电源插座等。一旦创建了蓝图，就可以用它建造几栋房子，如图\
  \ 1.22 所示。\n\n从某种意义上说，从蓝图建造的房子是不同的。它们位于不同的位置，有不同的地址，包含不同的家具，并居住着不同的人。然而在许多方面，它们是“同一”栋房子。\n\
  \n`class`是对象的蓝图。它确立了该类型的对象将持有的数据类型，并定义了代表此类对象行为的方法。然而，类不是对象，就像蓝图不是房子一样。通常情况下，类不包含存储数据的空间。每个对象都有存储自己数据的空间，这就是为什么每个对象都可以有自己的状态。\n\
  \n一旦定义了类，就可以从该类创建多个对象。例如，一旦我们定义了一个表示银行账户概念的类，我们就可以创建多个代表特定、个人银行账户的对象。每个银行账户对象都会跟踪它自己的余额。\n\
  \n对象应该是被`encapsulated`（封装）的，这意味着它保护并管理自己的信息。也就是说，对象应该是自律的。对对象状态的任何更改都应该通过该对象的方法来实现。\n\
  \n我们应该设计对象，使得其他对象无法“伸入”内部改变它们的状态。\n\n\n\n\n可以使用`inheritance`（继承）从其他类创建新类。也就是说，一个类的定义可以基于另一个已经存在的类。继承是`software\
  \ reuse`（软件复用）的形式，它利用了我们想要创建的不同类之间的相似性。一个类可以用来派生出几个新类。派生类又可以用来派生出更多的类。这创建了一个类的层次结构，其中在一个类中定义的属性和方法会被子类继承，子类又会将它们传递给自己的子类，以此此类推。\n\
  \n例如，我们可能会创建一个代表各种类型账户的类层次结构。共同特征在高类中定义，特定的差异在派生类中定义。\n\n`Polymorphism`（多态）是指我们可以用一致的方式随时间引用多个相关对象的类型。它使我们能够为处理多个对象的问题设计强大且优雅的解决方案。\n\
