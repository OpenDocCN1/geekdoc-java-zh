  \na. 0 到 30\n\nb. 10 到 19\n\nc. −5 到 5\n\n## 3.5 Math 类\n\n`Math` 类提供了大量的基础数学函数，这些函数在进行计算时非常有帮助。`Math`\
  \ 类定义在 Java 标准类库的 `java.lang` 包中。图 3.5 列出了它的其中几个方法。\n\n## `Math` 类中的所有方法都是**静态方法**（也称为类方法），这意味着它们可以通过它们所定义的类名来调用，而无需先实例化该类的对象。静态方法将在第\
