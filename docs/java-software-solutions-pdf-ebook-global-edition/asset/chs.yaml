  \ 4 到 6 岁，返回“Pre-school”如果是 7 到 9 岁，返回“Early”，“如果是 10 到 12 岁，返回“Middle”，“如果是 13\
  \ 到 16 岁，返回“Upper”。\n- SR 9.7 单继承和多重继承之间的区别是什么？\n\n## 9.2 方法重写\n\n当子类定义了一个与父类中方法相同名称和签名的方法时，我们说子类的版本`覆盖`（overrides）了父类的版本，以使用自己的版本。在继承情况下，重写的需求经常发生，此时子类可以覆盖（重新定义）父类对继承方法的定义。\n\
  \n列表 9.7 中的程序提供了 Java 中方法重写的简单演示。`Messages` 类包含一个 `main` 方法，该方法实例化两个对象：一个来自 `Thought`\
  \ 类，另一个来自 `Advice` 类。`Thought` 类是 `Advice` 类的父类。\n\n```java\n//****************************************************\n\
  // Messages.java 作者: Lewis/Loftus\n//\n// 展示重写方法的使用。\n//****************************************************\n\
  public class Messages\n{\n    //-------------------------------------------------\n\
  \    // 创建两个对象并在每个对象调用 message 方法。\n    //-------------------------------------------------\n\
  \    public static void main(String[] args)\n    {\n        Thought parked = new\
  \ Thought();\n        Advice dates = new Advice();\n        parked.message();\n\
  \        dates.message();\n    }\n}\n```\n\n**输出**\n```\nI feel like I'm diagonally\
  \ parked in a parallel universe.\nWarning: Dates in calendar are closer than they\
  \ appear.\nI feel like I'm diagonally parked in a parallel universe.\n```\n\n用于调用方法的对象决定了实际执行哪个版本的方法。当使用列表\
  \ 9.8 中的 `parked` 对象调用 `message` 时：\n\n```java\n//****************************************************\n\
  // Thought.java 作者: Lewis/Loftus\n//\n// 代表一个杂乱的想法。作为派生类的父类\n// 用于展示重写方法的使用。\n//****************************************************\n\
  public class Thought\n{\n    //-------------------------------------------------\n\
  \    // 打印消息。\n    //-------------------------------------------------\n    public\
  \ void message()\n    {\n        System.out.println(\"I feel like I'm diagonally\
  \ parked in a \" +\n                          \"parallel universe.\");\n       \
  \ System.out.println();\n    }\n}\n```\n\n`Thought` 类（见列表 9.8）和 `Advice` 类（见列表 9.9）都包含名为\
  \ `message` 方法定义。`Thought` 类定义的 `message` 版本被 `Advice` 继承，但 `Advice` 使用一个替代版本对其进行了重写。新版本的方法打印出完全不同的消息，然后使用\
  \ `super` 引用调用父类的方法版本。\n\n**列表 9.9**\n\n\n\n\n\n```java\n//********************************************************************\n\
  // Advice.java 作者: Lewis/Loftus\n//\n// 表示一些深思熟虑的建议。用于演示重写\n// 方法的使用\n//********************************************************************\n\
  public class Advice extends Thought\n{\n    //-----------------------------------------------------------------\n\
  \    // 打印消息。此方法覆盖了父类版本。\n    //-----------------------------------------------------------------\n\
  \    public void message()\n    {\n        System.out.println(\"警告: 日历中的日期比\"\n\
  \        \"看起来的要近\");\n        System.out.println();\n        super.message(); //\
  \ 显式调用父类版本\n    }\n}\n```\n\n在 `main` 方法中，执行的是 `Thought` 版本的 `message`。当使用日期对象调用\
  \ `message` 时，执行的是 `Advice` 版本的 `message`。\n\n可以使用 `final` 修饰符定义方法。子类不能重写 `final`\
  \ 方法。这种技术用于确保派生类使用方法的特定定义。\n\n方法重写是面向对象设计中的核心元素。它允许通过继承关系相关的两个对象使用相同的命名约定，以不同的方式完成相同的通用任务。当涉及到多态（将在第\
  \ 10 章中讨论）时，重写变得更加重要。\n\n### 变量遮蔽 (shadowing variables)\n\n虽然不建议，但子类可以声明一个与从父类继承的同名的变量。注意重新声明变量与仅仅为继承的变量赋予特定值之间的区别。如果在子类中声明了同名的变量，它被称为`shadow\
  \ variable”（遮蔽变量）。它在概念上与重写方法的过程相似，但会产生混淆的细微差别。\n\n![](img/index-485_1.png)\n\n**484**\n\
  \n**第 9 章** 继承\n\n由于继承的变量对子类是可用的，因此通常没有好的理由重新声明它。阅读带有遮蔽变量代码的人会发现两个不同的声明，它们似乎都适用于子类中使用的变量。这种混淆会导致问题且没有任何实际用处。\n\
  \n对特定变量名进行重新声明可能会改变其类型，但这通常是没有必要的。通常情况下，应该避免变量遮蔽。\n\n### 自测习题（seLF-revieW QuestiONs\
  \ 答案见附录 N）\n\nSR 9.8 为什么子类要重写其父类的一个或多个方法？\n\nSR 9.9 真或错？请解释。\n\na. 子类可以定义一个与父类中方法同名的方法。\n\
  \nb. 子类可以重写父类的构造函数。\n\nc. 子类可以重写父类的 `final` 方法。\n\nd. 子类重写来自父类的方法被认为是糟糕的设计。\n\n\
  e. 子类可以定义一个与父类中变量同名的变量。\n\n### 9.3 类层次结构 (Class hierarchies)\n\n派生自一个父类的子类可以作为其自己的子类的父类。此外，多个类可以派生自同一个父类。因此，继承关系往往会发展为*类层次结构*（class\
  \ hierarchies）。创建一个类层次结构。图 9.3 显示了一个 `Animal` 类。\n\n**爬爬行动物**\n**鸟类**\n**哺乳动物**\n\
  **蛇**\n**蜥蜴**\n**鹦鹉**\n**马**\n**蝙蝠**\n\n**图 9.3** 显示类层次结构的 UML 类图\n\n![](img/index-486_1.png)\n\
  \n**9.3** 类层次结构\n\n**485**\n\n包含了 `Mammal` 和 `Horse` 类之间继承关系的层次结构。\n\n一个类可以拥有的子类数量没有限制，类层次结构延伸的层级也没有限制。同一个父类的两个子类被称为`siblings`兄弟类）。虽然兄弟类共享共同父类传递的特征，但它们之间没有继承关系，因为其中一个并没有被用来派生出另一个。\n\
  \n在类层次结构中，公共特征应该尽可能地保持在层次结构的高层。这样，子类中显式建立的唯一特征就是那些使该类与其父类以及兄弟类区分开来的特征。这种方法最大限度地了类重用的潜力。它也便于维护工作，因为当父类发生更改时，这些更改会自动反映在后代中。在构建类层次结构时，始终要记住维护“is-a”关系。\n\
  \n继承机制是传递的。也就是说，父类将一种特征传递给子类，该子类又将其传递给它的子类，依此类推。一个继承的特征可能起源于类层次结构中尽可能的高层：直接父类中，或者可能在更远的祖先类中高几层。\n\
  \n对于所有情况，并没有单一的最佳层次结构组织方式。你在设计类层次结构时做出的决策限制并引导了更详细的设计决策和实现方案，因此你必须仔细做出这些决策。\n\n\
  在本章的前面，我们讨论了一种根据其主要生物分类组织动物的类层次结构，例如 `Mammal`、`Bird` 和 `Reptile`。然而，在不同的情况下，相同的动物可能在逻辑上以不同的方式组织。例如，如图\
  \ 9.4 所示，类层次结构可以围绕动物的功能进行组织，例如它们飞行的能力。在这种情况下，`Parrot` 类和 `Bat` 类将是派生自通用的 `FlyingAnimal`\
  \ 类的兄弟类。这种类层次结构与原始的层次结构一样有效且合理。使用这些类的程序需求将决定哪种结构最适用于特定情况。\n\n**飞行动物**\n**鹦鹉**\n\
  **蝙蝠**\n**蚊**\n\n**图 9.4** 组织动物的另一种层次结构\n\n![](img/index-487_1.png)\n\n![](img/index-487_2.png)\n\
  \n**486**\n\n**第 9 章** 继承\n\n**Object 类**\n\n在 Java 中，所有的类最终都派自 `Object` 类。如果一个类定义没有使用\
  \ `extends` 子句派生自另一个类，那么该类默认自动派生自 `Object` 类。\n\n因此，以下两个类定义是等价的：\n\n```java\nclass\
  \ Thing {\n    // 内容\n}\n```\n\n和\n\n```java\nclass Thing extends Object\n{\n  \
  \  // 内容\n}\n```\n\n由于所有类都派自 `Object`，`Object` 的所有公共方法都被每个 Java 类继承。可以通过任何 Java\
  \ 程序中创建的对象调用它们。`Object` 类定义在 Java 标准类库的 `java.lang` 包中。图 9.5 列出了 `Object` 类的一些方法。\n\
  \n公共特征应该位于层次结构中。事实证明，我们在示例中经常使用 `Object` 方法。例如，`toString` 方法定义在 `Object` 类中，因此可以在任何对象上调用\
  \ `toString` 方法。正如我们多次看到的，当带有对象参数调用 `println` 方法时，会调用 `toString` 来确定打印的内容。\n\n`toString`\
  \ 和 `equals` 方法\n\n因此，当我们在类中定义 `toString` 方法时，我们实际上是在重写一个继承的定义。`Object` 类提供的 `toString`\
  \ 定义返回一个包含以下内容的字符串 `boolean equals(Object obj)`\n\n如果此对象是指定对象的别名，则返回 true。\n\n`String\
  \ toString()`\n\n返回对象的字符串表示。\n\n`Object clone()`\n\n创建并返回此对象的副本。\n\n**图 9.5** `Object`\
  \ 类的一些方法\n\n![](img/index-488_1.png)\n\n**487**\n\n\n\n\n对象的类名，后跟一个对该对象唯一的数值值。通常，我们会重写\
  \ `Object` 版本的 `toString` 以适应我们自己的需求。`String` 类已经重写了 `toString` 方法，使其返回其存储的字符串值。\n\
  \n当我们为一个类定义 `equals` 方法时，我们也在重写一个继承的方法。正如我们之前讨论过的，`equals` 方法的目的是判断两个对象是否相等。`Object`\
  \ 类提供的 `equals` 方法的定义是：如果两个对象引用实际上指向同一个对象（即，如果它们是别名），则返回 true。类通常会重写继承的 `equals`\
  \ 方法定义，以采用更适当的定义。例如，`String` 类重写了 `equals`，只有当两个字符串包含相同顺序的相同字符时，它才返回 true。\n\n###\
  \ 抽象类\n\n`abstract class` 表示类层次级中的一个通用概念。`abstract class`不能被实例化，并且通常包含一个或多个`abstract\
  \ methods`，这些方法没有具体定义。我们在第 7 章中讨论过抽象方法，当时它们被用于定义 Java `interface`（接口）。抽象类在某些方面与接口相似。然而，与接口不同，抽象类可以包含非抽象的方法。它还可以包含常量以外的数据声明。\n\
  \n通过在类头中包含 `abstract` 修饰符，可以将一个类声明为抽象类。任何包含一个或多个抽象方法的类必须声明为抽象类。在抽象类中（与接口不同），`abstract`\
  \ 修饰符必须应用于每个抽象方法。声明为抽象的类不必得包含定义。\n\n抽象类在类层次级中充当占位符。正如其名称所示，抽象类表示一个抽象实体，该实体本身通常定义不足，无法单独发挥作用。相反，抽象类可能包含一个部分描述，该描述会被其类层次级中的所有后类继承。它的子类更具体，会填补这些空白。\n\
  \n考虑图 9.6 所示的类层次结构。层次结构顶部的 `Vehicle` 类对于特定应用程序可能太通用了。因此，我们可能选择将其实现为抽象类。在 UML 图中，抽象类名用斜体表示。\n\
  \n适用于所有车辆的概念可以在 `Vehicle` 类中表示，并被其后类继承。这样，它的每个后类就不需要冗余地（可能是不一致地）定义相同的概念了。例如，我们可以说所有车辆都有特定的速度。因此，我们在\
  \ `Vehicle` 类中声明了一个 `speed` 变量，由于继承，层次结构中其下方的所有特定车辆自动拥有该变量。我们对车辆速度表示所做的任何更改都会自动反映在所有后代类中。\n\
  \n![](img/index-489_1.png)\n\n**488**\n**第 9 章** 继承\n\n***Vehicle***\n**Car**\n\
  **Boat**\n**Plane**\n\n**图 9.6** 车辆类层次结构\n\n类似，我们可能会声明一个名为 `fuelConsumption` 的抽象方法，其目的是计算特定车辆消耗燃料的速度。`fuelConsumption`\
  \ 方法的细节必须由每种车辆定义，但 `Vehicle` 类建立了所有车辆都消耗燃料的概念，并提供了一种计算该值的一致方法。\n\n某些概念并不适用于所有车辆，因此我们不会在\
  \ `Vehicle` 级别表示这些概念。例如，我们不会在 `Vehicle` 类中包含名为 `numberOfWheels` 的变量，因为并不是所有车辆都有轮子。适合轮子的子类可以在层次结构中的适当层级添加该概念。\n\
  \n抽象类可以在类层次级中的任何位置定义，没有任何限制。通常，它们位于类层次级的上层。然而，也可以从非抽象父类派生出抽象类。\n\n通常，抽象类的子类将为其从父类继承的抽象方法提供具体的定义。请注意，这只是重写方法的一种特殊情况，它给出了与父类提供的定义不同的定义。如果抽象类的子类没有为它从父类继承的每个抽象方法提供定义，那么该子类也被视为抽象类。\n\
  \n派生自抽象父类的类也将被视为抽象类。\n\n请注意，将抽象方法修改为 `final` 或 `static` 是自矛盾的。因为 `final` 方法不能在子类中被重写，因此\
  \ `abstract final` 方法将无法在子类中被赋予定义。`static` 方法可以使用类名调用而无需声明该类的对象。由于抽象方法没有实现，`abstract\
  \ static` 方法将毫无意义。\n\n选择哪些类和方法设为抽象是设计过程中的重要部分。你应该在仔细考虑之后才做出此类选择。通过明智地使用抽象类，你可以创建灵活、可扩展的软件设计。\n\
  \n![](img/index-490_1.png)\n![](img/index-490_2.png)\n\n## 9.4 可见性\n\n**489**\n\n\
  ### 接口层次结构\n\n继承的概念不仅适用于类，也适用于接口。也就是说，一个接口可以派生自另一个接口。这些关系可以形成 `interface hierarchy`（接口层次结构），它类似于类层次结构。接口之间的继承关系派生自另一个接口。它们在\
  \ UML 图中使用与类相同的连接方式（带有一个空心箭头的箭头）来表示。\n\n当使用一个父接口来派生一个子接口时，子接口继承了父接口的所有抽象方法和常量。任何实现子接口的类都必须实现所有方法。在处理接口之间的继承时，没有可见性问题（就像处理类的\
  \ `protected` 和 `private` 成员时那样），因为接口的所有成员都是 `public` 的。\n\n类层次结构和接口层次结构之间是不重叠的。也就是说，接口不能用于派生类，类不能用于派生接口。类和接口只有在类被设计为实现特定接口时才会交互。\n\
