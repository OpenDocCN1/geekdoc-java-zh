  c. 一群人之间的“朋友”关系。\nd. 公司中的“上司”关系。\n\n### 13.5 Java 集合 API\n\nJava 标准类库包含了几个表示各种类型集合的类。这些通常被称为`Java\
  \ Collections API（Java 集合 API）`（应用程序接口）。\n\n该集合中大多数类名都指示了集合类型和底层实现。一个例子是 `ArrayList`\
  \ 类，它在第 5 章中被详细讨论过。它代表一个列表集合，使用底层数组实现。\n\n同样，`LinkedList` 类表示一个具有动态链接内部实现的列表集合。\n\
  \n`Vector` 类和 `Stack` 类继承自早期的 Java 版本，这 true 为什么它们的名称与较新的集合类不一致。\n\n使用了几个接口来定义集合操作本身。这些接口包括\
  \ `List`、`Set`、`SortedSet`、`Map` 和 `SortedMap`。`Set` 与其正常解释（不包含重复元素的集合）一致。`Map`\
  \ 是一组可以通过键值对进行引用的元素。\n\n#### 泛型\n\n正如我们在第 5 章讨论 `ArrayList` 类时提到的，Java Collections\
  \ API 中的类是实现为`generic types（泛型类型）`的，这意味着集合所管理的对象类型可以在实例化该集合类型的对象时确定。\n\n![](img/index-662_1.png)\n\
  ![](img/index-662_2.png)\n**13.5** Java 集合 API\n**661**\n\n例如，要创建一个 `String` 对象的\
  \ `LinkedList`，我们将以以下方式实例化集合对象：\n\n```\nLinkedList<String> myList = new LinkedList<String>();\n\
  ```\n\n同样，要创建一个 `Book` 对象的 `LinkedList`，我们将如下实例化集合：\n\n```\nLinkedList<Book> myList\
  \ = new LinkedList<Book>();\n```\n\n通过指定存储在集合中的类型，我们获得了两个优势：\n- 只有相应类型的对象可以添加到集合中。\n\
  - 从集合中删除对象时，其类型已经确定，无需对其进行强制类型转换。\n\n`myList` 对象只能存储 `String` 对象，而 `myList` 集合只能存储\
  \ `Book` 对象。请记住，泛型类通过继承确保了指定类型对象之间的类型安全。例如，如果 `Dictionary` 类派自 `Book`，那么我们就可以在 `myList`\
  \ 集合中存储 `Dictionary` 对象。毕竟，如果我们正确使用继承，`Dictionary` 就是一个 `Book`。\n\n如果在创建集合对象时没有指定特定类型，则集合被定义为包含\
  \ `Object` 类引用，这意味着它可以存储任何对象。这使得集合的使用能够包含泛型规范的早期 Java 版本。集合类的细节和定义泛型类的技术超本书的范围，因此在此不再深入探讨。\n\
  \n**自测题** *(答案见附录 N )*\nSR 13.17 什么是 Java 集合 API？\nSR 13.18 什么是泛型？它与 Java 集合 API\
  \ 有什么关系？\n\n**662**\n**第 13 章** 集合\n\n**核心概念总结**\n- 定义良好的接口是实现集合的完美机制。\n- 动态数据结构的大小根据需要增长和缩小。\n\
  - 动态链接列表通过存储和更新引用来管理。\n- 通过仔细操作引用可以实现插入和删除操作。\n- 可以定义动态链接列表的许多变体。\n- 队列是一种以先入先出的方式管理数据的线性数据结构。\n\
  \n\n\n\n-   `stack`（栈）是一种线性数据结构，以后进先出的方式管理数据。\n-   `tree`（树）是一种非线性数据结构，将数据组织成层次级结构。\n\
  -   `graph`（图）是一种非线性数据结构，使用通用边连接节点。\n-   `Java Collections API` 定义了若干以多种方式实现的集合类。\n\
  -   `Java Collections API` 的类是以泛型类型实现的的。\n-   泛型类确保了集合所存储的对象之间的类型兼容性。\n\n## 练习题\n\
