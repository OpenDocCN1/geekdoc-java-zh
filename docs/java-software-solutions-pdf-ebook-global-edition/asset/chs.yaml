  \n## 6.4 for 语句\n## 305\n## 6.4 for 语句\n当你最初并不知道想要执行循环体多少次时，`while` 和 `do` 语句是好用的。\n\
  \n### 核心概念\n`for 语句` 是另一种重复语句，特别适用于执行特定次数的循环体，而这些次数可以在循环执行之前确定。`for 语句` 通常用于循环一个\n\
  \n以下代码使用 `for` 循环打印从 1 到 5 的数字，正如我们在之前的示例中使用其他循环语句所的那样：\n```java\nfor (int count=1;\
  \ count <= 5; count++)\n    System.out.println(count);\n```\n\n`for` 循环的头部包含三个由分号隔开的部分。在循环开始之前，头部的第一部分称为“初始化（initialization）”，会被执行。\n\
  \n头部的第二部分是布尔条件，它在循环体执行之前求值（类似于 `while` 循环）。如果为真，则执行循环体，然后执行头部的第三部分，该部分称为“增量（increment）”。注意，初始化部分只执行一次，但增量部分在循环的每次迭代后执行。图\
  \ 6.2 显示了这种处理过程。\n\n初始化 | 条件（求值：真/假） | 语句 | 增量\n\n**图 6.2** for 循环的逻辑\n\n# 306\n\
  ## 第 6 章 更多条件和循环\n`for` 循环在你习惯它之前可能有点难读。代码的执行并不遵循“从上到下，从左到右”的阅读顺序。增量代码虽然位于头部，但会在循环体之后执行。\n\
  \n### 视频笔记：使用 for 循环的示例\n在此示例中，`for` 循环头部的初始化部分被用于声明变量 `count` 并给它一个初始值。我们并不被要求在那里声明变量，但在变量在循环外部不需要的情况下，这是一种常见做法。由于\
  \ `count` 在 `for` 循环头部中声明，它只存在于循环体内部，不能在其他地方引用。\n\n循环控制变量通过循环头部的操作进行设置、检查和修改。它可以在循环体内部被引用，但除了循环头部定义的动作外，它不应被修改。\n\
  \n```\nfor (For Init; Expression; For Update) { Statement }\n```\nfor init | for\
  \ Update | 局部变量声明 | 语句表达式\n\n`for` 语句只要布尔 `Expression` 为真，就会反复执行指定的 `Statement`。头部的\
  \ `For Init` 部分在循环开始前只执行一次。`For Update` 部分在每次执行 `Statement` 后执行。\n\n示例：\n```java\n\
  for (int value=1; value < 25; value++)\n    System.out.println(value + \" squared\
  \ is \" + value*value); \nfor (int num=40; num > 0; num-=3)\n    sum = sum + num;\n\
  ```\n\n`for` 循环头部的增量部分尽管名为增量，但可以减少一个值而不是增加它。例如，下面的循环打印从 100 开始递减的值：\n```java\nfor\
  \ (int num = 100; num > 0; num--)\n    System.println(num);\n```\n\n## 6.4 for 语句\n\
  ## 307\n事实上，`for` 循环的增量部分可以执行任何计算，而不仅仅是增减。考虑示例 6.3 所示的打印到 `limit` 的 `value` 的倍数。`for`\
  \ 循环的增量部分在每次迭代后加上用户输入的 `value`。每行打印的数值由 `count` 是否能被 `PERLINE` 整除来控制。\n\n**L i s\
  \ t i N G 6 . 3**\n************************************\n// Multiples.java     \
  \                                :\n****************************************************\n\
  // Author: Lewis/Loftus                               :\n****************************************************\n\
  // Demonstrates the use of for loop.\n//------------------------------------\n//\
  \ Prints multiples of user-specified\n// up to limit.\n//------------------------------------\n\
  import java.util.Scanner;\n\npublic class Multiples\n{\n    //------------------------------------\n\
  \    public static void main(String[] args)\n    {\n        //------------------------------------\n\
  \        final int PERLINE = 5;\n        int value, limit, count = 0;\n        Scanner\
  \ scan = new Scanner(System.in);\n\n        System.out.print(\"Enter a positive\
  \ value: \"); value = scan.nextInt();\n        System.out.print(\"Enter an upper\
  \ limit: \"); limit = scan.nextInt();\n        System.out.println(\"The multiples\
  \ of \" + value + \" between \" + limit + \" are:\");\n\n        for (int mult =\
  \ value; mult <= limit; mult += value)\n        {\n            //------------------------------------\n\
  \            System.out.print(mult + \"\\t\");\n            //------------------------------------\n\
  \            // Print a specific number of\n            // values per line\n   \
  \         count++;\n            if (count % PERLINE == 0)\n                System.out.println();\n\
  \        }\n    }\n}\n```\n\n### 输出\n输入一个正整数: 7\n输入一个上限: 400\n7 到 400 之间（包含）的 7\
  \ 的倍数有：\n7\t14\t21\t28\t35\n42\t49\t56\t63\t70\n77\t84\t91\t98\t105\n112\t119\t\
  126\t133\t140\n147\t154\t161\t168\t175\n182\t189\t196\t203\t210\n217\t224\t231\t\
  238\t245\n252\t259\t266\t273\t280\n287\t294\t301\t308\t315\n322\t329\t336\t343\t\
  350\n357\t364\t371\t378\t385\n392\t399\n\n示例 6.4 中的 `Stars` 程序展示了嵌套 `for` 循环的使用。输出是一个由星号字符组成的三角形。外层循环执行\
  \ 10 次。外层循环的每次迭代打印输出行。\n\n内部循环根据外层循环控制的行值执行不同次数的迭代。内部循环的每次迭代在当前行打印一个星。打印这种配置变体的程序包含在章节末尾的编程项目中。\n\
  \n### for-each 循环\n`for` 语句的一种变体，通常称为 `for-each loop`，在涉及迭代器的情况下特别有帮助。在第 5 章中我们讨论过某些\n\
  \n\n\n\n\n```java\n//********************************************************************\n\
  \n// Stars.java 作者: Lewis/Loftus\n\n//\n\n// 展示了嵌套 for 循环的使用。\n\n//********************************************************************\n\
  public class Stars\n{\n//-----------------------------------------------------------------\n\
  // 使用星号（star）字符打印一个三角形。\n//-----------------------------------------------------------------\n\
  \    public static void main(String[] args)\n    {\n        final int MAX_ROWS =\
  \ 10;\n        for (int row = 1; row <= MAX_ROWS; row++)\n        {\n          \
  \  for (int star = 1; star <= row; star++)\n                System.out.print(\"\
  *\");\n            System.out.println();\n        }\n    }\n}\n```\n\n### 输出\n\n\
  ```\n* *\n\n***\n****\n*****\n******\n*******\n********\n*********\n**********\n\
  ```\n\n对象被视为迭代器，它们拥有 `hasNext` 和 `next` 方法来处理来自组中的每个项。如果一个对象实现了 `Iterable` 接口，那么我们就可以使用\
  \ `for` 循环的变体通过简化的语法来处理项。\n\n![](img/index-311_1.png)\n![](img/index-311_2.png)\n\
  \n# 310 第 6 章 更多条件与循环\n\n`ArrayList` 对象是一个 `Iterable` 对象。因此，**核心概念**，例如，如果 `library`\
  \ 是一个 `ArrayList<Book>` 对象（即 `for-each`  `for` 循环是一个管理 `Book` 对象的 `ArrayList`），我们可以通过\
  \ `for` 循环简化对 `Iterable` 对象中所有元素的处理，以处理集合中的每个 `Book` 对象，如下：\n\n```java\nfor (Book\
  \ myBook : library)\n    System.out.println(myBook);\n```\n\n这段代码可以读作：对于 `library`\
  \ 中的每个 `Book`，打印该书籍对象。变量 `myBook` 轮流获取集合中每个 `Book` 对象的值，循环体可以对其进行适当处理。那个简洁的 `for-each`\
  \ 循环本质上等同于以下代码：\n\n```java\nBook myBook;\nwhile (bookList.hasNext())\n{\n    myBook\
  \ = bookList.next();\n    System.out.println(myBook);\n}\n```\n\n这种版本的 `for` 循环也可以用于数组，数组将在第\
  \ 8 章中讨论。在书的其余部分，我们将根据情况适时使用 `for-each` 循环。\n\n## 比较循环\n\n三个基本的循环语句（`while`、`do`\
  \ 和 `for`）在功能上是等价的。使用一种类型循环编写的任何特定循环都可以使用另外两种类型的循环来编写。我们使用哪种类型的循环取决于具体情况。\n\n正如我们之前提到的，`while`\
  \ 循环和 `do` 循环的主要区别在于评估条件的时机。如果我们知道至少要执行一次循环体，那么 `do` 循环通常是更好的选择。另一方面，如果初始条件为假（false），`while`\
  \ 循环的体可能完全不会被执行。因此，我们说 `while` 循环的体执行零次或多次，而 `do` 循环的体执行一次或多次。\n\n`for` 循环类似于 `while`\
  \ 循环，其特点在于条件在执行循环体之前就会进行**核心概念**评估。当我们想要循环遍历的次数是固定的或可以很容易计算出来时，我们通常使用 `for` 循环。在许多情况下，将设置和控制循环迭代的代码放在\
  \ `for` 循环头部，与循环体分离会更加方便。\n\n## 6.5 使用循环和条件绘图\n\n### 311 自测练习题（答案见附录 N）\n\n- **SR\
