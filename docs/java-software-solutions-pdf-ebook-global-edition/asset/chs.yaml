  \n164\n\n# 第 3 章 使用类和对象\n\n## 3.7 枚举类型\n\nJava 提供了定义*枚举类型*的能力，然后该类型可以作为声明变量时的类型。枚举类型通过列出（或枚举）值来建立该类型变量的所有可能值。这些值是标识符，可以是任何内容。\n\
  \n例如，下面的声明定义了一个名为 `Season` 的枚举类型，其可能值为 `winter`、`spring`、`summer` 和 `fall`：`enum\
  \ Season {winter, spring, summer, fall}`\n\n\n\n\n\n变量 `time` 现在其取值范围被了限制。\n\n###\
  \ 核心概念\n\n它可以包含四个 `Season` 值之一，但不能包含其他任何值。Java 枚举类型（Enumerated types）是类型安全的，确保了不会使用无效值。枚举类型被认为是类型安全的，这意味着任何尝试使用枚举值之外的值的尝试都会导致编译时错误。\n\
  \n通过类型的名称来访问这些值。例如：`time = Season.spring`。\n\n当变量可以取用的一组较少且不同的值时，枚举类型会非常有帮助。例如，假设我们想表示学生可能获得的各种字母等级。我们可以声明如下枚举类型：\n\
  \n```java\nenum Grade {A, B, C, D, F}\n```\n\n任何持有 `Grade` 的初始化变量都保证具有其中一个有效等级。这比使用简单的字符或字符串变量来表示等级要好，因为字符或字符串变量可以取任何值。\n\
  \n假设我们还想表示加分和减分等级，例如 `A–` 和 `B+`。我们不能将 `A–` 或 `B+` 作为值，因为它们不是有效的标识符（在 Java 中，`-`\
  \ 和 `+` 字符不能作为标识符的一部分）。然而，可以使用标识符 `Aminus`、`Bplus` 等来表示相同的值。\n\n在内部，枚举类型中的每个值都存储为一个整数，这被称为它的序值（ordinal\
  \ value）。枚举类型中的第一个值的序值为 `0`，第二个值的序值为 `1`，第三个为 `2`，依此类推。\n\n序值仅在内部使用。你不能给枚举类型赋值数值，即使该数值对应于一个有效的序值。\n\
  \n### 3.7 枚举类型\n\n枚举类型是一种特殊的类，枚举类型的变量是对象变量。因此，所有枚举类型都关联有几个方法。`ordinal()` 方法返回与特定枚举值相关的数值。`name()`\
  \ 方法返回该值的名称，该名称与定义该值的标识符相同。\n\n列表 3.6 显示了一个名为 `IceCream` 的程序，它声明了一个枚举类型并练习了它的一些方法。由于枚举类型是特殊的类，因此它们不是定义在方法内部。它们既可以在类级别定义（在类内部但方法之外），如本例所示），也可以在最外层定义。\n\
  \n我们将在第 6 章中进一步探讨枚举类型。\n\n#### 列表 3.6\n\n```java\n//********************************************************************\n\
  // IceCream.java 作者: Lewis/Loftus\n//\n// 展示枚举类型的使用。\n//********************************************************************\n\
  public class IceCream\n{\n    enum Flavor {vanilla, chocolate, strawberry, fudgeRipple,\
  \ coffee, rockyRoad, mintChocolateChip, cookieDough}\n\n    //-----------------------------------------------------------------\n\
  \    // 创建并使用 Flavor 变量。\n    //-----------------------------------------------------------------\n\
  \    public static void main(String[] args)\n    {\n        Flavor cone1, cone2,\
  \ cone3;\n        cone1 = Flavor.rockyRoad;\n        cone2 = Flavor.chocolate;\n\
  \        System.out.println(\"cone1 value: \" + cone1); \n        System.out.println(\"\
  cone1 ordinal: \" + cone1.ordinal()); \n        System.out.println(\"cone1 name:\
  \ \" + cone1.name()); \n        System.out.println();\n\n        System.out.println(\"\
  cone2 value: \" + cone2); \n        System.out.println(\"cone2 ordinal: \" + cone2.ordinal());\
  \ \n        System.out.println(\"cone2 name: \" + cone2.name());\n\n        cone3\
  \ = cone1;\n        System.out.println();\n        System.out.println(\"cone3 value:\
  \ \" + cone3); \n        System.out.println(\"cone3 ordinal: \" + cone3.ordinal());\
  \ \n        System.out.println(\"cone3 name: \" + cone3.name());\n    }\n}\n```\n\
  \n**输出**\n```\ncone1 value: rockyRoad\ncone1 ordinal: 5\ncone1 name: rockyRoad\n\
  cone2 value: chocolate\ncone2 ordinal: 1\ncone2 name: chocolate\ncone3 value: rockyRoad\n\
  cone3 ordinal: 5\ncone3 name: rockyRoad\n```\n\n### 自测习题\n\n**SR 3.29** 编写一个表示电影分级的枚举类型的声明。\n\
  \n**SR 3.30** 假设定义了一个名为 `CardSuit` 的枚举类型如下：\n```java\nenum CardSuit {clubs, diamonds,\
  \ hearts, spades}\n```\n以下代码序列的输出是什么？\n```java\nCardSuit card1, card2;\ncard1 =\
