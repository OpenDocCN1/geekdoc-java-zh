  h. 采用这种测试方法时，测试用例基于程序的内部工作机制。\n\n## 7.10 GUI 设计\n当我们关注允许我们创建 GUI 的细节时，有时可能会忽视大局。随着我们继续探索\
  \ GUI 的构建，我们应该记住，我们的目标是解决问题。具体来说，我们想要创建实用的软件。了解组件、事件和其他语言元素的细节为我们提供了组装 GUI 的工具，但我们必须用以下良好\
  \ GUI 设计的基本构理念来指导这些知识：\n\n- 了解用户。\n- 防止用户错误。\n- 优化用户能力。\n- 保持一致性。\n\n任何 GUI 的设计都应该遵循关于一致性和可用性的基本准则。\n\
  \n软件设计人员必须理解用户的需求和潜在活动，以便开发能够良好服务该用户的界面。\n\n请记住，对用户来说，界面就是软件。它是用户与系统交互的唯一方式。因此，界面必须满足用户的需求。\n\
  \n只要可能，我们应该设计界面，让用户尽可能少犯错。在许多情况下，我们有灵活选择多个组件中的一个来完成特定任务。我们应该始终尝试选择能够防止不当操作并避免无效输入的组件。例如，如果输入值必须是某个特定值中的一个，我们应该使用允许用户仅做出有效选择的组件。也就是说，通过例如单选按钮（radio\
  \ buttons）将用户限制在几个有效选择中，比允许用户在文本框中输入任意且可能无效的数据要好。\n\n在本章中，我们将涵盖适用于特定情况的其他组件。\n\n\
  并不是所有用户都是一样的。有些人比其他人更擅长使用特定的 GUI 或一般的 GUI 组件。我们不应该只考虑最低公约数进行设计。例如，只要合理，我们就应该提供快捷键。也就是说，除了允许用户完成任务的一系列正常操作外，我们还应该提供完成相同任务的冗余方法。使用键盘快捷键（mnemonics）就是一个很好的例子。有时这些额外的机制可能不太直观，但对于经验丰富的的用户来说可能更快。\n\
  \n最后，在处理大型系统或共同环境中的多个系统时，一致性至关重要。用户会熟悉特定的组织或颜色方案；这些不应该被随意更改。\n\n### 自我检查问题（答案见附录\
  \ N）\nSR 7.26 本节介绍了哪些 GUI 设计的通用准则？\nSR 7.27 为什么良好的用户界面设计如此重要？\n\n### 7.11 布局管理器\n\
  除了构成 GUI 骨干的组件、事件和监听器之外，GUI 设计中最重要的活动是使用布局管理器（layout managers）。布局管理器是一个管理如何在容器中排列组件的对象。它决定了每个组件的大小和位置，并在过程中可能考虑许多因素。每个容器都有一个默认的布局管理器，如果我们偏好另一个，也可以替换它。\n\
  \n每当容器内容的视觉外观可能需要更改时，容器的布局管理器就会被咨询。例如，当容器的大小调整时，布局管理器会被咨询，以确定容器中的所有组件在调整大小后应该如何视觉呈现。每当向容器添加组件时，布局管理器都会确定该添加对所有现有组件的影响。\n\
  \n每个布局管理器本身根据管理组件布局的布局和规则具有其特定的属性。对于某些管理器的策略。\n\n\n\n\n布局管理器\n\n布局管理器中，添加组件的顺序会影响它们的布局，而另一些布局管理器则提供更具体的控制。某些布局管理器会考虑组件的优选尺寸或对齐方式，而另一些则不会。在\
  \ Java 中开发良好的 GUI，熟悉各种布局管理器的功能和特征是非常重要的。\n\n我们可以使用容器的 `setLayout` 方法来更改其布局管理器。我们在之前的示例中已经做过几次了。例如，如下：\n\
  \n![](img/index-378_1.png)\n\n## 7.11 布局管理器\n\n### 布局管理器\n\n#### 描述\n\n- **Border\
  \ Layout（边界布局）**：将组件组织为五个区域（北、南、东、西和中心）。\n- **Box Layout（箱布局）**：将组件组织为单行或单列。\n-\
  \ **Card Layout（卡片布局）**：将组件组织在一个区域内，使得任何时候只有一个组件可见。\n- **Flow Layout（流式布局）**：从左到右组织组件，必要时开始新行。\n\
  - **Grid Layout（网格布局）**：将组件组织为行和列组成的网格。\n- **GridBag Layout（网格包布局）**：将组件组织为单元格网格，允许组件跨越多个单元格。\n\
  \n**图 7.6** 某些预定义的 Java 布局管理器代码设置了 `JPanel` 的布局管理器，它默认使用流式布局，因此这里将其改为边界布局：\n\n```java\n\
  JPanel panel = new JPanel();\npanel.setLayout(new BorderLayout());\n```\n\n让我们更详细地探索这些布局管理器。我们将重点关注**核心概念**中最流行的布局管理器：流式、边界、箱和网格。每个容器的布局管理器类可以显式设置。\n\
  \n列表 7.18 包含一个应用程序的 main 方法，该程序演示了这些布局管理器的用法效果。\n\n`LayoutDemo` 程序引入了 `tabbed pane`（标签页面板）的使用，这是一种允许用户（通过点击标签页）选择多个面板中当前可见面板的容器。标签页面板由\
  \ `JTabbedPane` 类定义。`addTab` 方法创建一个标签页，指定显示在标签上的名称以及当该面板通过“置于顶层”获得焦点并对用户可见时要在此的组件。\n\
  \n有趣的是，标签页面板提供的功能与卡片布局管理器之间存在重叠。与标签页面板类似，卡片布局允许定义多个层，在任何给定时刻只显示其中一层。然而，由卡片布局管理的容器只能在程序控制下进行调整，而标签页面板允许用户直接指示应该显示哪个标签页。\n\
  \n在例示例中，标签页面板的每个标签页都包含一个由不同布局管理器控制的面板。第一个标签页仅包含一个带有介绍消息的面板，如列表 7.19 所示所示当我们详细探索每个布局管理器时，我们将检查定义该程序对应面板的类，并讨论其视觉效果。\n\
