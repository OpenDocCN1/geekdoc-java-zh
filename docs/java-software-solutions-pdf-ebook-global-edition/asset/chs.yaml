  \n列表 8.8 显示了 `DVDCollection` 类。它包含一个由 `DVD` 对象组成的数组，代表该集合。它维护了集合中 `DVDs` 的计数以及它们的总价值。它还跟踪了集合数组的当前大小，以便在向集合中添加过多的\
