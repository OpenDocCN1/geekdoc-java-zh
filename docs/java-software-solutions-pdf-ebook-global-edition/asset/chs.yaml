  \n房屋的架构定义了它的结构。同样，我们使用*计算机架构*术语来描述计算机的硬件组件是如何组合在一起的。图 1.9 展示了通用计算机系统的基本架构。\n\n信息通过一组称为*总线*的电线在组件之间进行传输。\n\
  \n**图 1.9** 基础计算机架构\n\n![](img/index-39_1.png)\n\n**38**\n\n\n\n\n# 第 1 章 引言\n\n\
  CPU 和内存构成了计算机的核心。\n\n### 核心概念\n\n正如我们之前提到的，内存存储程序和数据。计算机的核心由内存（存储程序和数据）和 CPU（按条不紊地执行程序指令）组成。\n\
  \n假设我们有一个计算数字列表平均值的程序。在程序运行期间，程序和数字必须驻留在内存中。CPU 从内存中读取一条程序指令并执行它。如果某条指令需要数据（例如列表中的某个数字）来完成任务，CPU\
  \ 也会读取该信息。这个过程不断重复直到程序结束。计算出的平均值将存储在内存中，等待进一步的处理或长期存储在辅助内存中。\n\n在计算机系统中，除了 CPU 和内存外，几乎所有设备都称为`外设设备`；它们在系统的边缘或外围运行（尽管它们可能位于同一个箱体内）。用户并不直接与\
  \ CPU 或内存交互。尽管 CPU 和内存构成了机器的本质，但如果没有外设设备，它们将无用武处。\n\n`控制器`是协调特定外设活动的设备。每种设备都有其独特的数据格式化和通信方式，控制器的作用之一就是处理这些特殊性，并将它们与计算机的其他部分隔离开。此外，控制器通常处理大部分的实际信息传输，允许\
  \ CPU 专注于其他活动。\n\n输入/输出（I/O）设备和辅助内存设备被视为外设。另一类外设是`数据传输设备`，它们允许在计算机之间发送和接收信息。图 1.8\
  \ 中指定的计算机包含网卡，也称为无线网络接口控制器（`WNIC`），它可以连接到基于无线的计算机网络。\n\n在某些方面，辅助内存设备和数据传输设备可以被视为\
  \ I/O 设备，因为它们代表了信息的来源（输入）和发送信息的地方（输出）。然而，我们将 I/O 设备定义为允许用户与计算机交互的设备。\n\n## 输入/输出设备\n\
  \n让我们详细检查一些 I/O 设备。常见的输入设备是键盘和鼠标或触摸板。其他设备包括：\n\n- `条码器`，例如零售店收银台使用的设备\n- `麦克风`，用于解释语音命令的语音识别系统\n\
  - `虚拟现实设备`，例如解释用户手部动作的手持设备\n- `扫描仪`，将文本、照片和图形转换为机器可读的形式\n\n![](img/index-40_1.png)\n\
  \n- `摄像头`，捕捉静态图像和视频，也可以用于处理特殊输入，如 `QR 代码`\n\n显示器和打印机是最常见的输出设备。其他设备包括：\n\n- `绘图仪`，在大幅纸上移动画笔（或反之）\n\
  - `扬声器`，用于音频输出\n- `眼镜`，用于虚拟现实显示\n\n某些设备可以同时提供输入输出功能。`触摸屏`系统可以检测触摸。图 1.8 描述的台式计算机包含一个\
  \ 17 英角的对角区域。它由液晶显示（`LCD`）组成，不像不可便携的旧阴射线管（`CRT`）显示器。触摸屏已变得普及。\n\n## 1.2 硬件组件\n\n\
  ### 内存和辅助内存\n\n**核心概念**\n\n内存由一系列小的`字节`组成。当数据存储在内存位置时，它会覆盖该位置之前存储的任何信息。然而，从内存位置读取数据的过程不会影响它。\n\
  \n每个位置都是一个唯一的数字，称为`地址`。如图 1.10 所示，设备的存储容量是它能容纳的`字节`总数。因为计算机基于二进制系统，所有存储单位都是 2 的幂。`千字节`（`KB`）是\
  \ 1024 `字节`，`兆字节`（`MB`）是 1,048,576 `字节`，`吉字节`（`GB`）是 1,073,741,824 `字节`，`太字节`（`TB`）是\
  \ 1,099,511,627,776 `字节`，`拍字节`（`PB`）是 1,125,899,906,842,624 `字节`。\n\n通常通过舍入来考虑这些容量更容易。例如，大多数计算机用户认为千字节大约是一千字节，兆字节大约一百万，以此类推。\n\
  \n许多个人电脑拥有 4GB 的内存，即 `RAM`，例如图 1.8 描述的系统（我们将在本章稍后详细讨论 `RAM`）。内存是`易失的`，这意味着只要有供电，存储的信息就会保持。较大的内存允许大型程序或多个程序高效运行，因为它们不需要频繁从辅助内存中检索信息。\n\
  \n### 计量单位\n\n| **单位** | **符号** | **字节数** |\n| :--- | :--- | :--- |\n| `byte` |\
  \ | |\n| `kilobyte` | | |\n| `megabyte` | | |\n| `gigabyte` | | |\n| `terabyte`\
  \ | | |\n| `petabyte` | | |\n\n**图 1.10** 存储单位\n\n\nUSB 闪存由一个小型打印电路板组成，上面承载着电路元件和一个\
  \ USB 接口。它们封装在塑料、金属或橡胶外壳内，并经过绝缘处理。例如，它可以放在口袋里或挂在钥匙上。\n\n磁盘是一种磁性介质，位在以磁化颗粒的形式表示。读写头在旋转的磁盘上方移动，根据需要读取或写入信息。硬盘驱动器实际上可能包含垂直排列的几块磁盘，并配有多个读写头，如图\
  \ 1.12 所示。\n\n为了直观地感受这些设备可以存储多少信息，请考虑一下书中的所有信息（包括图片和格式）大约需要 7 MB 的存储空间。\n\n`磁带`也曾用作次级存储，但由于访问信息的方式，其速度远慢于硬盘和\
  \ USB 闪存。硬盘是一种`直接访问设备`，因为读写头通常可以直接移动到所需信息处。USB 闪存也是直接访问读写头，但没有机械部件移动。`直接访问`和`随机访问`这两个术语通常互换使用。然而，磁带上的信息只有在跳过中间的数据后才能访问。磁带必须回带或快进到适当的位置。因此，磁带被认为是一种`顺序访问设备`。由于这些原因，磁带作为计算机存储设备已基本被淘汰，就像音频磁带被光盘取代一样。\n\
  \n### 磁盘\n\n**图 1.12** 带有多个磁盘和读写头的硬盘驱动器\n\n![](img/index-43_1.png)\n![](img/index-43_2.png)\n\
  \n**42**\n\n**第 1 章** 引言\n\n还有两个术语描述内存设备：`随机存内存`（`RAM`）和`只读存储`（`ROM`）。理解这些术语很重要，因为它们被频繁使用且名称可能具有误导性。`RAM`\
  \ 和`主内存`基本上可以互换，描述存储活动程序和数据的内存。`ROM` 可以指计算机主板上的芯片，也可以指光盘等便携存储设备。\n\n`ROM` 芯片通常存储名为\
  \ `BIOS`（基本输入输出系统）的软件，它提供了计算机最初启动时所需的初步指令。在信息存储到 `ROM` 之后，在典型的计算机使用期间，通常不会被更改（正如“只读”一词所示）。`RAM`\
  \ 和 `ROM` 都是直接（或随机）访问设备。\n\n`CD-ROM` 是一种便携式次级存储设备。`CD` 是**核心概念**紧凑型（compact disc）。它之所以被称为\
  \ `ROM`，是因为信息在 `CD` 创建时是永久存储的且无法更改。`CD` 的表面既有光滑区域也有小凹槽。凹槽代表二进制 1，光滑区域代表二进制 0。其音乐\
  \ CD 对应的 CD-ROM 以二进制格式存储信息。在 CD 初次创建时，一个微细的凹槽被压入圆片中以表示二进制 1，而圆片保持光滑以表示二进制 0。位通过将低强度激光束投射到旋转的磁盘上来读取。激光束从磁盘上的光滑区域强烈反射，但从凹槽区域反射较弱。接收反射光的传感器据此判断每个位是\
  \ 1 还是 0。一个典型的 `CD-ROM` 存储容量在 650 到 900 MB 之间。\n\n基础 CD 技术的变体很快出现。大多数个人电脑都配备了 `CD\
  \ 刻录光`（`CD-R`）驱动器。`CD-R` 可用于创建音乐或通用计算机存储的 `CD`。一旦创建，你可以在标准的 CD 播放器中使用 `CD-R` 光盘，但一旦\
  \ `CD-R` 光盘被“刻录”，你就无法更改其信息。你购买的音乐 CD 是通过模具压制的，而 `CD-Rs` 则是用激光刻录的。\n\n`CD 可重写`（`CD-RW`）光盘可以擦除并重复使用。它可以重复使用是因为普通\
  \ `CD` 的凹槽和平整表面在 `CD-RW` 上通过在磁盘表面涂层一种材料来模拟的：这种材料在加热到特定温度时会变成无形态（因此不反射）且光滑，而普通 `CD`\
  \ 的光滑区域在加热到不同温度时会变成晶态（通过使用可变为反射性的涂层）。`CD-RW` 介质并非在所有播放器中工作，但根据需要变为无形态或晶态。`CD-RW`\
  \ 驱动器可以同时创建 `CD-R` 和 `CD-RW` 光盘。\n\n**核心概念**\n可重写 CD 模拟了凹槽\n\n### 1.2 硬件组件\n\n**43**\n\
  \nCD 最初是音乐的流行格式；后来演变为用作通用计算机存储设备。同样，`DVD` 格式最初是为视频设计的，现在正作为计算机数据的通用格式取得进展。`DVD`\
  \ 曾代表数字视频盘（digital video disc）或数字多功能盘（digital versatile disc），但现在缩写通常独立使用。`DVD`\
  \ 的格式比 `CD` 更致密（每平方英寸位更多），因此可以存储更多信息。`DVD-ROMs` 最终可能会完全取代 `CD-ROMs`，因为存在兼容迁移路径，这意味着\
  \ `DVD` 驱动器可以读取 `CD-ROM`。类似于 `CD-R` 和 `CD-RW`，还有 `DVD-R` 和 `DVD-RW` 光盘。图 1.8 中列出的驱动器允许用户读写\
  \ `CD-RW` 光盘并读取 `DVD-ROM`。\n\n\n\n将程序指令和数据共同存储在主内存中的概念是计算机设计中`冯·诺依曼架构`的基础原理，以约翰·冯·诺依曼（John\
  \ von Neumann）命名，他是一位匈牙利美国数学家，于 1945 年首次提出了这种编程概念。这些计算机持续地遵循图 1.14 所示的`取指-译码-执行`循环。\n\
  \n根据`程序计数器`中存储的地址从主内存中取出，并放入`指令寄存器`中。此时，`程序计数器`会增加（**核心概念**），以为下一个循环做准备。然后，对指令进行电子解码，以确定执行何种操作。最后，控制单元激活正确的电路来执行指令处理，例如，将一个数据值加载到寄存器中或将两个值相加。\n\
  \nCPU 构建在一个名为`微处理器`的芯片上，该设备是计算机主电路板的一部分。该主板还包含 `ROM` 芯片和通信插座，设备控制器（如管理视频显示的控制器）可以连接到这些插座上。\n\
  \n```\nFigure 1.14 连续的取指-译码-执行循环\n从主内存取指指令\n解码指令并增加程序计数器\n执行指令\n```\n\n## 1.2 硬件组件\n\
  \n主电路板的另一个关键组件是`系统时钟`。时钟定期产生电子脉冲，从而同步 CPU 的各个事件。脉冲发生的速率称为`时钟频率`，它根据处理器而异。图 1.8 描述的计算机包含一个\
  \ `Intel Core i7` 处理器，其运行频率为 3.07 吉赫兹 (GHz)，或每秒约 31 亿次脉冲。系统时钟的速度提供了 CPU 执行指令快慢的粗略衡量。与存储容量一样，处理器的速度随着技术的进步而不断增加。\n\
  \n**自测题** *(答案见附录 N)*\n\nSR 1.7 下述各项各包含多少个字节？\na. 3 KB\nb. 2 MB\nc. 4 GB\n\nSR 1.8\
  \ 下述各项各有多少比特位？\na. 8 bytes\nb. 2 KB\nc. 4 MB\n\nSR 1.9 CD 上的音乐使用每秒 44,000 次测量的采样率创建。每次测量都存储为一个表示特定电压电平的数字。假设这些数字每个都需要两个字节的存储空间。表示一小时的音乐需要多少\
  \ MB？\n\nSR 1.10 计算机中两个主要的硬件组件是什么？它们是如何相互作用的？\n\nSR 1.11 什么是内存地址？\n\nSR 1.12 易失（volatile）是什么意思？哪些内存设备是易失的，哪些是非易失的？\n\
  \nSR 1.13 从以下列表中选择与每个短语最匹配的词：`controller`、`CPU`、`main`、`network card`、`peripheral`、`RAM`、`register`、`ROM`、`secondary`\n\
  a. 计算机系统中除 `CPU` 和主内存外的几乎所有设备都归类。\nb. 协调`外设`活动的设备。\nc. 允许信息的发送和接收。\nd. 这种内存通常是易失的。\n\
  e. 这种内存通常是非易失的。\nf. 这个术语基本上可以与“主内存”术语互换。\ng. 计算机的基础处理发生的地方。\n\n## 1.3 网络\n\n单台计算机可以完成很多，但将几台计算机连接成网络可以极大提高生产力并促进信息共享。`网络`由两个或多个连接在一起的计算机组成，以便它们交换信息。使用网络已成为商业计算机运行的标准模式。每天都有新技术（**核心概念**）出现，以利用现代计算机系统的连接环境。\n\
  \n图 1.15 显示了一个简单的计算机网络。网络设备之一是打印机，它允许连接到网络的任何计算机在该打印机上打印文档。网络上的其中一台计算机被指定为`文件服务器`，专门存储许多网络用户需要的程序和数据。`文件服务器`通常有大量的`次级存储`。当网络有文件服务器时，每台独立的计算机就不需要自己的程序副本。\n\
  \n```\nFigure 1.15 简单的计算机网络\n文件服务器\n共享打印机\n```\n\n如果两台计算机直接连接，它们通信的方式基本上与信息在单台机器内部通过导线移动的方式相同。在连接两台地理位置的计算机时，这种方案效果良好，被称为`点点连接`。然而，考虑跨远距离连接许多计算机的任务。如果使用`点点连接`，网络中的每台计算机都通过导线与网络中的其他所有计算机直接连接。为每个连接准备单独的导线并不是可行方案，因为每当向网络添加一台新计算机时，都必须为网络中已有的每个计算机安装新的通信线。此外，单台计算机只能处理少数的直接连接。\n\
  \n图 1.16 显示了多个点点连接。考虑如果向网络中增加两或三台额外的计算机，需要多少通信线。如今，局域网（如单个建筑内的网络）通常使用无线连接，最大限地减少了对导线的需求。\n\
  \n比较 1.15 和 1.16 中的图。1.15 中显示的所有计算机共用单条通信线。网络上的每台计算机都有自己的`网络地址`，用于唯一标识它。这些地址在概念上与主内存中的地址相似，区别在于它们识别网络上的单个计算机，而不是单台计算机内部的位置。通过指定目标计算机的`网络地址`，消息可以在线路上之间发送。\n\
  \n共享通信线具有成本效益，并使得向网络添加新计算机变得容易。然而，共享线路（**核心概念**）会引入延迟。网络上的计算机无法同时使用通信线。它们必须轮流发送信息，这意味着当线路繁忙时它们必须等待。改进网络延迟的一种技术是将大消息分割成段`数据包`，然后将这些数据包与其他用户发送的消息片段混合发送到网络中。数据包在目的地被收集并重组为原始消息。\n\
  \n这种情况类似于一组人使用传送带将箱从一个地方移动到另一个地方。如果只允许一个人一次使用传送带，而这个人有大量的箱要移动，其他人将等待很长时间才能使用它。通过轮流，每个人每次可以放一个箱，这样他们都能完成工作。\n\
  \n这并不像拥有自己的传送带那么快，但也不像等所有人完成后那么慢。\n\n```\nFigure 1.16 点点连接\n```\n\n\n\n一个*局域网*（LAN）设计用于跨越短距离并连接较少数量的计算机。通常局域网只连接一个大楼或一个房间内的机器。局域网易于安装和管理，且可靠性很高。随着计算机变得越来越小且\
  \ `KeY COnCept` 多样化，局域网为整个组织的信息共享提供了一种廉价的方式。然而，拥有局域网就像拥有了一个有效的信息共享方式——电话系统只允许你拨打自己小镇上的电话。我们需要能够跨越更远距离共享信息。\n\
  \n*广域网*（WAN）连接两个或多个局域网，通常跨越远距离。通常，每个局域网上有一台计算机专门处理跨广域网的通信。这种技术减轻了局域网内其他计算机执行远距离通信细节的负担。图\
  \ `1.17` 显示多个局域网连接到一个广域网。通过广域网连接的局域网通常由不同的公司或组织所有，甚至可能位于不同的国家。\n\n### LAN\n局域网中的某台计算机\n\
  远距离连接\n**图 1.17** 连接到广域网的局域网\n![](img/index-50_1.png)\n![](img/index-50_2.png)\n\
  ![](img/index-50_3.png)\n![](img/index-50_4.png)\n\n## 1.3 网络\n**49**\n\n网络对计算机系统的影响是巨大的。现在计算资源可以在许多用户之间共享，基于计算机的全球范围内通信已成为常态。事实上，现在网络的使用已无处不在，以至于某些计算机需要网络资源才能运行。\n\
  \n### 互联网\n在整个 20 世纪 70 年代，国防部一个名为高级研究计划局（ARPA）的机构资助了几个项目来探索网络技术。这些努力的成果之一是 ARPANET，这是一个最终被称为互联网的广域网。*互联网*是网络的网络。Internet\
  \ 一术语源于广域网的*互联*（internetworking）概念——将许多较小的网络连接在一起。\n\n从 20 世纪 80 年代后期至今，互联网 `KeY\
  \ COnCept` 急速增长。1983 年，计算机少于 600 台。互联网是一个连接到互联网的广域网。目前，互联网为全球数十亿用户提供服务。随着越来越多的计算机连接到互联网，跟上更多用户和更沉重流量的任务变得非常困难。自最初开发以来，新技术已多次替换了\
  \ ARPANET，每次都提供了更大的容量和更快的处理速度。\n\n*协议*（protocol）是一组规定两个事物如何通信的规则。控制消息在互联网上移动的软件必须符合一组被称为\
  \ `TCP/IP` 的协议（通过拼写字母读作 `T-C-P-I-P`）。TCP 代表*传输控制协议*（Transmission Control Protocol），IP\
  \ 代表*互联网协议*（Internet Protocol）。IP 软件定义了信息如何格式化并从源传输到目的地。TCP 软件处理诸如信息片段到达顺序与原始顺序不同或信息丢失的问题，这在过量信息同时汇聚在某处时可能会发生。\n\
  \n每台连接到互联网的计算机都有一个*IP 地址*，它在互联网上所有其他计算机中唯一地标识自己。IP 地址的一个示例是 `204.192.116.2`。幸运的是，互联网用户很少需要处理\
  \ IP 地址。互联网允许每台计算机被 `KeY COnCept` 赋予名称。像 IP 地址一样，这些名称必须是唯一的。计算机的名称通常被称为其*互联网地址*。互联网地址的一个示例是\
  \ `hector.vt.edu`。\n\n互联网地址的第一部分是特定计算机的本地名称。地址的其余部分是*域名*（domain name），指示该计算机所属的组织。例如，`vt.edu`\
  \ 是弗吉尼亚理工大学（Virginia Tech）计算机网络的域名，而 `hector` 是该校园内某台特定计算机的。\n\n![](img/index-51_1.png)\n\
  ![](img/index-51_2.png)\n![](img/index-51_3.png)\n\n由于域名是唯一的，许多组织可以拥有名为 hector 的计算机而不会产生混乱。各个部门可能会被分配*子域名*（subdomains），子域名被添加到基本域名，以便在较大的组织内唯一地区分它们的计算机组。例如，`cs.vt.edu`\
  \ 子域名专门用于弗吉尼亚理工大学计算机科学系。\n\n每个域名的最后部分称为*顶级域名*（TLD），通常指示计算机所属的组织类型。顶级域名 `edu` 通常表示教育机构。顶级域名\
  \ `com` 通常指商业实体。另一个常见的顶级域名是 `org`，通常用于非营利组织。其他顶级域名包括 `biz`、`info`、`jobs` 和 `name`。许多计算机，尤其是美国以外的计算机，使用国家代码顶级域名来表示原产国，例如英国的\
  \ `uk` 或澳大利亚的 `au`。\n\n当引用一个互联网地址时，它会被翻译为相应的 IP 地址，从那时起使用该地址。进行这种翻译的软件被称为*域名系统*（DNS）。每个连接到互联网的组织都运行一个*域名服务器*，该服务器维护着该组织内所有计算机及其\
  \ IP 地址的列表。它的工作方式有点像电话目录查询，你提供名称，域名服务器返回一个数字。如果本地域名服务器没有该名称的 IP 地址，它会联系另一个域名服务器。\n\
  \n**第 1 章** 引言\n**50**\n\n### 世界维网\n互联网改变了计算机处理。最初，互联计算机的主要用途是发送电子邮件，但互联网能力仍在不断提高。互联网最重要的用途之一是世界维网。\n\
  \n互联网赋予我们交换信息的能力。*世界维网*（World Wide Web，也称为 `WWW` 或简称为 Web）让人类的信息交换变得简单。\n\nWeb 基于超文本和超媒体的概念。*超文本*术语由特德·尼尔于\
  \ 1965 年创造。它描述了一种组织信息的方式，使思想的流动不受限于线性进展。保罗·奥特（Paul Otlet，1868–1944）被某些认为是信息科学之父，他预想了这一概念用于管理大量信息。基本思想是文档可以根据自然关系在各个点链接，以便读者可以从一个文档跳转到另一个文档，遵循符合该读者需求的路径。当整合了其他媒体组件（如图形、声音、动画和视频）时，产生的组织被称为*超媒体*（hypermedia）。\n\
  \n![](img/index-52_1.png)\n**51**\n\n\n\n\n\n“互联网”（Internet）和“万维网”（World Wide Web）这两个术有时会被通用，但它们之间存在重要的区别。互联网使得全球计算机之间的通信成为可能。万维网让这种通信变得简单且愉快。万维网本质上是一种分布式信息服务，基于一组软件应用程序。它并不是一个网络。尽管它与互联网配合使用，但它在本质上并不与其绑定。万维网可以在未连接到任何其他网络的局域网（LAN）上甚至在单台机器上显示\
  \ HTML 文档。\n\n`browser`（浏览器）是一种用于加载和格式化 Web 文档以便的软件工具。`Mosaic` 是第一个 Web 图形界面浏览器，于\
  \ 1993 年发布。Web 文档的设计者定义了可能位于互联网任何地方的其他 Web 信息。开发 Mosaic 的人员中，有些人后来创立了 Netscape 通信公司并创建了\
  \ `scape Navigator` 浏览器。目前流行的浏览器包括 Internet Explorer、Mozilla Firefox、Apple Safari、Google\
  \ Chrome 和 Opera。\n\n专门用于提供 Web 文档访问的计算机被称为 `Web server`（Web 服务器）。浏览器加载并解释由 `Web\
  \ server` 提供的文档。\n\n许多此类文档使用 `HyperText Markup Language`（`HTML`）进行格式化。Java 编程语言与\
  \ Web 处理有密切的关系，因为指向 Java 程序的链接可以嵌入 `HTML` 文档中并通过 Web 浏览器执行。我们在第 2 章中将详细探讨这种关系。\n\
  \n### 统一资源定位符 (Uniform Resource Locators)\n\nWeb 上的信息通过识别 `Uniform Resource Locator`（`URL`，读作字母\
  \ U-R-L）来找到。`URL` 唯一地指定了浏览器获取和显示的文档和其他信息。以下是一个 URL 示例：\n\n```\nhttp://www.google.com\n\
  ```\n\n该特定 URL 的网站是著名的 Google `search engine`（搜索引擎）的所在地，它允许你使用特定的单词或短语在 Web 上搜索信息。\n\
  \n`URL` 包含几部分信息。第一部分是 `KeY COnCept`——一种协议，它决定了浏览器传输和处理信息的方式。第二部分是存储文档的机器的互联网地址以及在该上的其他信息。第三部分是浏览器获取和显示的感兴趣的文件名或资源。如果没有提供文件名（如\
  \ Google URL 所示），Web 服务器通常会提供默认页面（如 `index.html`）。\n\n**第 1 章介绍**\n\n让我们来看另一个 URL\
  \ 示例：\n\n```\nhttp://www.whitehouse.gov/photos-and-video/photogallery/photo-day\n\
  ```\n\n在这个 URL 中，协议是 `http`，代表 `HyperText Transfer Protocol`（超文本传输协议）。所引用的机器是 `www`（对\
  \ `Web server` 的典型引用），位于域名 `whitehouse.gov`。最后，`photos-and-video/photogallery/photo-day`\
  \ 代表要传输到浏览器进行查看的文件（或生成文件的引用）。URL 还有许多其他形式，但这种形式是最常见的。\n\n**自测复习题**（答案见附录 N）\n\n\
  SR 1.14 什么是文件服务器？\n\nSR 1.15 五台计算机构成的全连接点对点网络共需要多少条通信线？六台计算机需要多少条？\n\nSR 1.16 描述在网络上的计算机共享通信线的好处。描述共享通信线的成本/缺点。\n\
  \nSR 1.17 Internet（互联网）一词的词源是什么？\n\nSR 1.18 `TCP/IP` 协议族描述了使用互联网软件的通信规则。`TCP` 代表什么？`IP`\
  \ 代表什么？\n\nSR 1.19 解释以下 URL 的部分：\n\na. `duke.csc.villanova.edu/jss/examples.html`\n\
  \nb. `java.sun.com/products/index.html`\n\n# 1.4 Java 编程语言\n\n现在让我们把注意力到让计算机系统实用的软件上。程序是用特定的\
  \ `programming language`（编程语言）编写的，该语言使用特定的单词和符号来表达解决方案。编程语言定义了一组规则，决定了程序员如何如何将语言的单词和符号组合成\
  \ `programming statements`（编程语句），这些语句是程序执行时运行的指令。\n\n自从计算机诞生以来，已经有了许多编程语言。我们在本书中使用\
  \ Java 语言来演示各种编程概念和技术。尽管我们的主要目标是学习这些底层的软件开发概念，但一个重要的副作用将精通 Java 程序开发。\n\n与许多其他语言相比，Java\
  \ 是一种相对新的编程语言。它由 James Gosling 在 1991 年在 Sun Microsystems 发起，作为他的许多机顶盒项目之一。该语言最初被称为\
  \ `Oak`，然后是 `Green`，最终称为 `Java`。Java 于 1995 年向公众推出，从那时获得了巨大的普及。2010 年，Sun Microsystems\
  \ 被 `Oracle` 收购。\n\nJava Platform 有多个变，包括 `Standard Edition`（标准版），它是该语言的主流及相关工具；`Enterprise\
  \ Edition`（企业版），包含了支持大型系统开发的额外库；以及 `Micro Edition`（微版），专门用于为手机等便携设备开发软件。本书侧重于 `Standard\
  \ Edition`。\n\n此外，`Java Standard Edition` 在多年来经历了多次修订，扩展了其功能并对其某些方面进行了更改。下表列出了版本和一些新功能。注意，它们从版本\
  \ 5 开始更改了编号技术。本书的内容适用于版本 5 或更高版本。\n\n| 版本 | 年份 | 新功能 |\n| :--- | :--- | :--- |\n\
  | 1.0 | 1996 | 初始部署 |\n| 1.1 | 1997 | 内部类 |\n| 1.2 | 1998 | 集合框架，Swing 图形 |\n| 1.3\
  \ | 2000 | 音频框架 |\n| 1.4 | 2002 | 断言、XML 支持、正则表达式、泛型、for-each 循环、自动装箱、枚举、注解 |\n\
  | 1.5 | 2004 | 可变参数列表 |\n| 1.6 | 2006 | GUI 改进，各种库更新 |\n| 1.7 | 2010 | switch 中使用字符串，其他语言更改\
  \ |\n| 1.8 | 2014 | Lambda 表达式、日期时间 API |\n\n早期 Java 技术的一些部分已被 `deprecated`（弃用），这意味着它们被认为过时且不应使用。在重要时，我们会指出弃用的元素并讨论其首选替代方案。\n\
  \nJava 最初吸引关注的原因之一是因为它是第一个刻意采用编写可以使用 Web 执行的程序（称为 applet）的编程语言。从那时起创建具有动态功能 Web\
  \ 页面的技术已大大扩张。\n\nJava 是一种 `object-oriented programming language`（面向对象的编程语言）。对象是组成程序的根本元素。面向对象软件开发的原则是本书的基石\
  \ 本书侧于面向对象编程的原则。我们在本章后面及本书的其余部分探索面向对象编程概念。\n\n**listing 1.1**\n\n```java\n/****************************************************\n\
  // Lincoln.java Author: Lewis/Loftus\n//\n// 展示 Java 应用程序的基本结构。\n//****************************************************\n\
  public class Lincoln\n{\n    //-----------------------------------------------------------------\n\
  \    // 打印总统格言。\n    //-----------------------------------------------------------------\n\
  }\n```\n\n\n\n\n\n```java\npublic static void main(String[] args)\n{\n    System.out.println(\"\
  A quote by Abraham Lincoln:\"); \n    System.out.println(\"Whatever you are, be\
  \ a good one.\");\n}\n```\n\n### 输出\n亚伯拉罕·林肯的一句名言：\n无论你做什么，都要做好。\n\nJava 语言附带了一个额外的软件库，我们可以在开发程序时使用它们。这些软件被称为\
  \ `Java API`，全称是应用程序编程接口（Application Programmer Interface），或简称为`标准类库`。`Java API`\
  \ 提供了创建图形、通过网络通信以及与数据库交互等许多功能。`Java API` 极其庞大且功能强大。虽然我们无法涵盖该库的所有方面，但我们将探索其中的几个部分。\n\
  \nJava 被应用于全球的商业环境中。它是历史以来增长最快的编程技术之一。因此，它不仅是一个学习编程概念的好门语言，也是一门在未来对你大有益的实用语言。\n\n\
  ### 一个 Java 程序\n\n让我们来看一个简单但完整的 Java 程序。列表 1.1 中的程序在屏幕上打印了两个句子。这个特定的程序打印了亚伯拉罕·林肯的一句名言。输出位于程序列表下方。\n\
  \n![](img/index-56_1.png)\n![](img/index-56_2.png)\n![](img/index-56_3.png)\n\n\
  #### 1.4 Java 语言\n\n所有的 Java 都具有类似的基本结构。尽管这个程序规模小且目的简单，但它包含了几个重要的特性。让我们仔细剖析并检查它的组成部分。\n\
  \n程序的前几行是注释，它们以 `//` 符号开头并持续到行尾。注释不会影响程序的运行，但包含它们是为了让人类更容易理解程序。程序员可以并且应该促进人类的理解；在程序的任何需要的地方包含注释，以清楚地标识程序的目的并描述任何特殊处理。任何书面注释或文档，包括用户指南和技术参考，都称为`文档`。包含在程序中的注释被称为`内联文档`。\n\
  \n程序的其余部分是一个`类定义`（class definition）。这个类被称为 `Lincoln`，尽管我们也可以给它起任何想要的名字。类定义从第一个左大括号（`{`）运行到程序元素最后一行的右大括号（`}`）。所有的\
  \ Java 程序都是使用类定义定义的。\n\n类定义内部还有一些注释，描述了 `main` 方法的作用，该方法直接定义在注释下方。`方法`（method）是一组被赋予名称的编程语句。在这种情况下，方法的名称是\
  \ `main`，它只包含两个编程语句。与类定义一样，方法也由大括号分隔。\n\n所有的 Java 都有一个 `main 方法`（main method），这是处理开始的地方。\n\
  \n`main method` 中的每条编程语句都会按顺序逐一执行，直到方法结束。然后程序结束或`终止`（terminates）。Java 程序中的 `main\
  \ method` 定义之前总是会有 `public`、`static` 和 `void` 这几个单词，我们将在稍后的文中检查这些词。`String` 和 `args`\
  \ 的使用在这个特定的程序中并没有发挥作用。我们稍后也会描述这些内容。\n\n`main method` 中的两行代码调用了另一个名为 `println`（读作\
  \ print line）的方法。当我们想要执行某个方法时，我们就`调用`（invoke）或`调用`（call）它。`println` 方法将指定的字符打印到屏幕上。\n\
  \n要打印的字符表示为`字符字符串`（character string），并包含在双引号（`\"`）中。当程序执行时，它调用 `println` 方法打印第一条语句，再次调用它打印第二条语句，然后因为这是\
  \ `main method` 的最后一行，程序终止了。\n\n调用 `println` 方法时执行的代码在该程序中并未定义。`println` 方法是 `System.out`\
  \ 对象的一部分，而该对象是 Java 标准类库的一部分。它在技术上不属于 Java 语言，但在任何 Java 程序中始终可用。我们将在第 2 章中详细详细探讨\
  \ `println` 方法。\n\n#### 第 1 章 引言\n\n### 注释\n\n让我们更详细地检查注释。注释是允许程序员独立于代码编写和交流想法的语言特性。注释应该提供对程序员原始意图的见解。一个程序通常会使用多年，随着时间的推移，往往对其进行多次修改。当在未来的某时刻需要进行修改时，原始程序员往往会忘记某个特定程序的细节。此外，原始程序员并不总是能出现来进行更改；因此，完全不熟悉程序的人将需要理解它。因此，良好的文档是至关重要的。\n\
  \n就 Java 编程语言而言，注释的内容可以是任何文本。计算机会忽略注释；它们不会影响程序的执行方式。\n\n`Lincoln` 程序中的注释代表了 Java\
  \ 允许的两种注释类型之一。`Lincoln` 中的注释形式如下：\n\n`// This is a comment.`\n\n这种类型的注释以双斜杠（`//`）开头并持续到结尾。你不能在两个斜杠之间放置任何字符。计算机忽略从双斜杠到行尾的任何文本。注释可以跟在同一行的代码后面，以记录该特定行，如下所示：\n\
  \n`System.out.println(\"Monthly Report\"); // always use this title`\n\nJava 注释可能具有的第二种形式如下：\n\
  \n`/* This is another comment. */`\n\n这种类型的注释不使用行尾来指示注释的结束。起始斜杠-星号（`/*`）和终止星号-斜杠（`*/`）之间的任何内容都是注释的一部分，包括代表行结束的不可见`换行`（newline）字符。因此，这种类型的注释可以跨多行。斜杠和星号之间不能有空格。\n\
  \n如果注释开头的 `/*` 后面有第二个星号，则可以使用注释的内容通过名为 `javadoc` 的工具自动生成关于你的程序的外部文档。关于 `javadoc`\
  \ 的更多信息见附录 I。\n\n这两种基本的注释类型可以创建各种文档样式，例如：\n\n![](img/index-58_1.png)\n\n```java\n\
  // This is a comment on a single line.\n//-------------------------------------------\n\
  // 像上面方法或类之上的注释\n// 应该被隔离起来，以便对你代码的\n// 特定方面给予特别关注。注意这些\n// 每一行在技术上都是一个独立的注释。\n\
  //-------------------------------------------\n\n/*\n这是一条跨越\n几行的注释。\n*/\n```\n\n\
  程序员往往把太多精力集中在编写代码上，以至于对文档的关注太少。你应该养成良好的注释习惯并习惯成章遵循它们。注释应该写得良好，通常是完整的句子。\n\n它们不应该解释显而易见的事实，而应该对代码的意图提供适当见解。以下示例*不是*良好的注释：\n\
  \n`System.out.println(\"hello\");`\n`// prints hello`\n\n`System.out.println(\"\
  test\");`\n`// change this later`\n\n第一条注释重复了该行显而易见的目的，没有为语句增加任何价值。最好没有注\n\n\n\n\
  \n比一个无用的要好。第二条注释具有歧义。这对你的代码有什么见解。它不应该\n\n以后修改吗？以后是什么时候？为什么要修改？\n\n具有歧义或解释显而易见。\n\
  \n## 标识符和保留字\n\n编写程序时使用的各种单词被称为`identifiers`。`Lincoln`程序中的标识符有`class`、`Lincoln`、`public`、`static`、`void`、`main`、`String`、`args`、`System`、`out`和`println`。它们分为三类：\n\
  \n- 我们编写程序时自定义的单词（`Lincoln`和`args`）\n- 其他程序员选择的单词（`String`、`System`、`out`、`println`和`main`）\n\
  - 语言中为特殊目的保留的单词（`reserved`）\n\n在编写程序时，我们简单选择将类命名为`Lincoln`，但我们可以使用许多其他可能性之一。例如，我们可以将其命名为`Quote`、`Abe`或`GoodOne`。标识符`args`（`arguments`的缩写）通常用于我们在`Lincoln`\
  \ 中使用的方式，但我们可以在该位置使用任何其他标识符。\n\n标识符`String`、`System`、`out`和`println`是由其他程序员选择的。这些单词不是\
  \ Java 语言的一部分。它们是 Java 标准库预定义代码的一部分，这是一组别人已经为我们写好的类和方法。这些代码的作者选择了这些代码中的标识符——我们只是在利用它们。\n\
  \n`Reserved words`（保留字）是在编程语言中具有特殊含义且只能以预定义方式使用的标识符。保留字不能用于任何用途，例如命名类或方法。在`Lincoln`程序中，使用的保留字有`class`、`public`、`static`和`void`。在本书中，我们用蓝色字体显示\
  \ Java 保留字。图 1.18 按字母顺序列出了所有的 Java 保留字。标记有星号的单词已被保留，但目前在 Java 中没有意义。\n\n我们为程序自定义的标识符可以由字母、数字、下划线字符（`_`）和美元符号（`$`）的任意组合组成，但不能以数字开头。标识符可以是任意长度。\n\
  \n因此，`total`、`label7`、`nextStockItem`、`NUM_BOXES`和 `$amount`都是有效的标识符，但`4th_word`和`coin#value`不是有效的。\n\
  \n标识符可以使用大写和小写字母，这种区别非常重要。Java 是`case sensitive`（大小写敏感的），这意味着两个仅字母大小写不同的标识符名称被认为是不同的标识符。\n\
  \n因此，`total`、`Total`、`ToTaL`和`TOTAL`都是不同的标识符。你可以想象，使用多个仅大小写不同的标识符并不是一个好主意，因为它们很容易被混淆。\n\
  \n## 标识符\n\n标识符是一个字母，后面跟着零或多个字母和数字。\n\n`Java Letter`（Java 字母）包括大写和小写的 26 个英语字母、`$`字符和`_`（下划线）字符，以及其他语言的字母。`Java\
  \ Digit`（Java 数字）包括数字`0`到`9`。\n\n示例：\n- `total`\n- `MAX_HEIGHT`\n- `num1`\n- `Keyboard`\n\
  - `System`\n\n虽然 Java 语言没有要求，但为每种标识符使用一致的`case format`（大小写格式）会让你的标识符更容易理解。关于标识符有各种\
  \ Java 规范——例如字母的大写和小写版本是不同的——这些规范应该遵循，尽管从技术上来说不必。例如，我们对类名使用`title case`（每个单词的首字母大写）。在全文中，当我们第一次遇到每个类型的标识符时，都会描述其首选的大小写样式。\n\
  \n虽然标识符可以是任意长度，但你应该仔细地选择你的名称。它们应该是描述性的，但不应该是冗长的。你应该避免诸如`a`或`x`这样没有意义的名称。如果短名称实际上具有描述性，可以对规则进行例外，例如使用`x`和`y`来表示二维网格上的（`x`,\
  \ `y`）坐标。同样，你不应该使用不必要的长名称，例如标识符`theCurrentItemBeingProcessed`。使用`currentItem`的效果一样。正如你可以想象的，使用冗长的标识符比使用不具描述性的名称问题要常见得多。\n\
  \n你应该始终努力让你的程序尽可能易读。\n\n因此，在缩写单词时你应该始终保持小心。你可能认为`curStVal`是一个代表当前股票价值的好名字，但另一个试图理解代码的人可能很难弄清楚你的意思。即使在编写代码几个月后，它对你来说可能都不清晰。\n\
  \n```\nabstract\nassert\nboolean\nbreak\nbyte\ncase\nchar\nclass\nconst\ncontinue\n\
  do\ndouble\nenum\nextends\nelse\nfalse\nfinal\nfloat\nfor\ngoto\nif\nimplements\n\
  import\ninstanceof\nint\ninterface\nlong\nnull\nnative\nnew\npackage\nprivate\n\
  protected\npublic\nreturn\nshort\nstrictfp\nsuper\nsynchronized\nthrow\nthis\ntransient\n\
  true\nvolatile\nwhile\n```\n**图 1.18** Java 保留字\n\n```java\n/****************************************************\n\
  // Lincoln2.java Author: Lewis/Loftus\n// 展示了一个格式不佳但有效的程序。\n/****************************************************\n\
  public class Lincoln2{\n    public static void main(String[]args){\n        System.out.println(\"\
  A quote by Abraham Lincoln:\");\n        System.out.println(\"Whatever you are,\
  \ be a good one.\");\n    }\n}\n```\n**列表 1.18** `Lincoln2.java`\n\n**输出**\nA quote\
  \ by Abraham Lincoln:\nWhatever you are, be a good one.\n\n### 空格\n\n所有 Java 程序都使用*white\
  \ space*（空白）来分隔程序中单词和符号。空白由空格、制表符和换行符组成。“空白”一词是指，在有黑色打印内容的白纸上，单词和符号之间的空间是白色的。程序员使用空白的方式很重要，因为它可以用来强调代码的部分，并使程序更易读。\n\
  \n除了用于分隔单词外，计算机会忽略空白。它不会影响程序的执行。这一事实为程序员在格式化程序方面提供了极大的灵活性。程序的行应该在逻辑位置进行划分，某些行应该进行缩进和对齐，以便使程序的底层结构清晰可见。\n\
  \n由于空白被忽略，我们可以以许多不同的方式编写程序。例如，将空白推向极端，我们可以在每行放置尽可能多的单词。列表 1.2 中的代码（`Lincoln2`程序）的格式与`Lincoln`完全不同，但打印出的消息相同。\n\
  \n将空白推向另一个极端，我们可以将几乎每个单词和符号写在不同的行，并带有不同数量的空间。Lincoln 的三个版本在技术上都是有效的，并将以相同的方式执行，但从读者的角度来看，它们是完全不同的。后两个示例都显示了糟糕的风格，并使记录程序变得困难。\n\
  \n```java\n/****************************************************\n// Lincoln3.java\n\
  /****************************************************\npublic\nclass\nLincoln3\n\
  {\npublic\nstatic\nvoid\nmain(\nString[]\nargs\n)\n{\nSystem.out.println(\n\"A\n\
  quote\nby\nAbraham\nLincoln:\"\n);\nSystem.out.println(\n\"Whatever\nyou\nare,\n\
  be\na\ngood\none.\");\n);\n}\n```\n**列表 1.13** `Lincoln3.java`\n\n\n\n\n\n```java\n\
  // Lincoln3.java Author: Lewis/Loftus\n\n//\n\n// 展示了另一个格式不规范的有效程序。\n\n//********************************************************************\n\
  \npublic class Lincoln3 {\n    public static void main(String[] args) {\n      \
  \  System.out.println(\"A quote by Abraham Lincoln:\");\n        System.out.println(\"\
  Whatever you are, be a good one.\");\n    }\n}\n```\n\n### 输出\n亚伯拉罕·林肯的一言：\n无论你是什么，要做优秀的。\n\
  \n该程序难以理解。在编写程序时，你可能被要求遵守特定的指南。软件开发公司通常有一套要求其程序员遵守的编程风格策略。\n\n在任何情况下，你都应该采用并一致地使用一套风格指南，以提高代码的可读性。\n\
  \n### 自测问题（答案见附录 N）\nSR 1.20 Java 编程语言是什么时候开发的？由谁开发的？它是什么时候向公众推出的？\n\nSR 1.21 Java\
