  java.lang.ArithmeticException: / by zero\nat ExceptionScope.level3(ExceptionScope.java:54)\n\
  at ExceptionScope.level2(ExceptionScope.java:41)\nat ExceptionScope.level1(ExceptionScope.java:18)\n\
  at Propagation.main(Propagation.java:17)\nLevel 1 ending.\nProgram ending.\n```\n\
  \n## 11.4 异常传播\n\n573\n\n### 列表 11.4\n```java\n//********************************************************************\n\
  // ExceptionScope.java 作者: Lewis/Loftus\n//\n// 演示异常传播。\n//********************************************************************\n\
  public class ExceptionScope\n{\n    //-----------------------------------------------------------------\n\
  \    // 捕获并处理 level3 抛出的异常。\n    //-----------------------------------------------------------------\n\
  \    public void level1()\n    {\n        System.out.println(\"Level 1 beginning.\"\
  );\n        try\n        {\n            level2();\n        }\n        catch (ArithmeticException\
  \ problem)\n        {\n            System.out.println();\n            System.out.println(\"\
  The exception message is: \" + problem.getMessage());\n            System.out.println();\n\
  \            System.out.println(\"The call stack trace:\");\n            problem.printStackTrace();\n\
  \            System.out.println();\n        }\n        System.out.println(\"Level\
  \ 1 ending.\");\n    }\n\n    //-----------------------------------------------------------------\n\
  \    // 作为中间层级。异常通过此方法传播\n    // 回 level1。\n    //-----------------------------------------------------------------\n\
  \    public void level2()\n    {\n        System.out.println(\"Level 2 beginning.\"\
  );\n        level3();\n        System.out.println(\"Level 2 ending.\");\n    }\n\
  \n    //-----------------------------------------------------------------\n    //\
  \ 执行计算以产生异常。异常在此层级\n    // 未被捕获和处理。\n    //-----------------------------------------------------------------\n\
  \    public void level3()\n    {\n        int numerator = 10, denominator = 0;\n\
  \        System.out.println(\"Level 3 beginning.\");\n        int result = numerator\
  \ / denominator;\n        System.out.println(\"Level 3 ending.\");\n    }\n}\n```\n\
  \n\n\n应当被处理，如果需要的话。\n\n有时候，正确的方法是根本不捕获异常，而是让程序终止。\n\n### 自测问题（参见附录 N 中的答案）*\n\n\
