  ```java\nint num = 10, den = 0;\nint res = num / den;\n```\n\n## 11.5 异常类层次结构\n\n\
  575\n\n11.5 异常类层次结构\n\n定义各种异常的类通过继承关系相关，形成了一个类层次结构，图 11.1 显示了该结构的部分。\n\n`Throwable`\
  \ 类是 `Error` 类和 `Exception` 类的父类。许多类型的异常派生自 `Exception` 类，这些类也有许多子类。虽然这些高层类定义在 `java.lang`\
  \ 包中，但许多定义特定异常的子类属于其他几个包。继承关系可以跨越包的边界。\n\n- `Object`\n- `Throwable`\n- `Error`\n\
  - `Exception`\n- `RuntimeException`\n- `LinkageError`\n- `ThreadDeath`\n- `ArithmeticException`\n\
  - `VirtualMachineError`\n- `IndexOutOfBoundsException`\n- `AWTError`\n- `NullPointerException`\n\
  - `IllegalAccessException`\n- `NoSuchMethodException`\n- `ClassNotFoundException`\n\
  \n**图 11.1** Error 和 Exception 类层次结构的一部分\n\n![](img/index-577_1.png)\n\n576\n\n\
  第 11 章 异常\n\n我们可以通过派生 `Exception` 或其一个后代类来定义自己的异常。我们选择哪个类作为父类取决于新异常所代表的情况或条件。\n\n\
  列表 11.5 中的程序实例化了一个异常对象并将其抛出。该异常是由 `OutOfRangeException` 创建的。新异常通过派生类定义，如列表 11.6\
  \ 所示。注意，此异常并不是从 `Exception` 类或其后代类（Java 标准类库的一部分）中派生的类。它的创建是为了表示值在特定有效范围之外的情况。\n\
  \n**列表 11.5**\n\n```java\n//********************************************************************\n\
  // CreatingExceptions.java 作者: Lewis/Loftus\n//\n// 演示了通过继承定义异常的能力。\n//********************************************************************\n\
  import java.util.Scanner;\n\npublic class CreatingExceptions\n{\n    //-----------------------------------------------------------------\n\
  \    // 创建一个异常对象并可能将其抛出。\n    //-----------------------------------------------------------------\n\
  \    public static void main(String[] args) throws OutOfRangeException\n    {\n\
  \        final int MIN = 25, MAX = 40;\n        Scanner scan = new Scanner(System.in);\n\
  \        OutOfRangeException problem = new OutOfRangeException(\"Input value is\
  \ out of range.\");\n        System.out.print(\"Enter an integer value between \"\
  \ + MIN + \" and \" + MAX + \", inclusive: \");\n        int value = scan.nextInt();\n\
  \        // Determine 是否应该抛出异常\n        if (value < MIN || value > MAX)\n      \
  \      throw problem;\n        System.out.println(\"End of main method.\"); // 可能永远无法到达\n\
  \    }\n}\n```\n\n11.5 异常类层次结构\n\n577\n\n列表 11.5 *续*\n\n**输出**\n```\nEnter an integer\
  \ value between 25 and 40, inclusive: 69\nException in thread \"main\" OutOfRangeException:\
  \ Input value is out of range.\nat CreatingExceptions.main(CreatingExceptions.java:20)\n\
  ```\n\n读入输入值后，`main` 方法会评估该值以检查它是否在有效范围内。如果没有，则执行 `throw` 语句。`throw` 语句用于开始异常传播。由于\
  \ `main` 方法没有捕获并处理该异常，如果抛出了异常，程序将终止，并打印与异常相关的消息。\n\n我们通过扩展 `Exception` 类来创建 `OutOfRangeException`\
  \ 类。通常，一个新异常仅仅是我们在示例中看到的这些：列表 11.6。\n\n```java\n//********************************************************************\n\
  // OutOfRangeException.java 作者: Lewis/Loftus\n//\n// 表示值超出某些\n// 特殊范围的异常情况。\n//********************************************************************\n\
  public class OutOfRangeException extends Exception\n{\n    //-----------------------------------------------------------------\n\
  \    // 使用特定消息设置异常对象。\n    //-----------------------------------------------------------------\n\
  \    OutOfRangeException(String message)\n    {\n        super(message);\n    }\n\
  }\n```\n\n![](img/index-579_1.png)\n\n578\n\n第 11 章 异常\n\n它是对某些现有异常类的扩展，存储了一个描述其所代表情况的特定消息。关键点是，该类最终是\
  \ `Exception` 类和 `Throwable` 类的后代，这使其能够使用 `throw` 语句被抛出。\n\n此程序处理的情境类型（即值超出范围）不需要表示为异常。我们之前使用条件判断处理了此类情况。是使用异常处理这种情况还是在程序的流程中处理，是一个重要的设计决策。\n\
  \n### 检异常与未检异常\n\n某些异常是受检的，而另一些是未检的。*检异常*必须被方法捕获，或者在可能抛出它的方法的 *throws 子句* 中列出。未检异常不需要\
  \ `throws 子句`。\n\nJava 中唯一的未检异常是 `RuntimeException` 类型或其任何后代的对象。所有其他异常都被视为检异常。`CreatingExceptions`\
  \ 程序的 `main` 方法有一个 `throws 子`，表示它可能抛出 `OutOfRangeException`。这是因为 `OutOfRangeException`\
  \ 派生自 `Exception` 类，使其成为检异常。\n\n### 自测问题（参见附录 N 中的答案）*\n\nSR 11.10 什么是检异常？\n\nSR\
  \ 11.11 对还是错？请解释。\n\na. `ArithmeticException` 是 `Exception`。\nb. `ArithmeticException`\
  \ 是 `Throwable`。\nc. `ArithmeticException` 是检异常。\nd. `NoSuchMethodException` 是检异常。\n\
  e. 我们可以通过扩展 `Exception` 类创建自己的异常。\nf. 如果方法可能抛出 `ArithmeticException`，则必须在方法定义头部附加\
  \ `throws 子`。\n\nSR 11.12 如果 `CreatingExceptions` 程序的输入是 42，会发生什么？如果是 -3，会发生什么？\n\
  \n![](img/index-580_1.png)\n\n![](img/index-580_2.png)\n\n## 11.6 I/O 异常\n\n579\n\
  \n11.6 I/O 异常\n\n处理输入输出的任务往往产生不可预见的情况，导致异常的抛出。让我们探索一些 I/O 问题以及可能出现的问题。\n\n*流*是字节的有序序列。“流”一词源于这种类比：当我们读写信息时，数据从源头流向目的地（或\
  \ *汇* ），就像水流动一样。流是字节的顺序序列；它可以作为流的源。\n\n\n\n\n流，而目的地就像一个水流汇入洞穴。\n\n在程序中，我们将流视为 `input\
  \ stream`（输入流），从中读取信息，或者视为 `output stream`（输出流），向其写入信息。一个程序可以同时处理多个输入和输出流。特定的数据存储单元（如文件）可以作为程序的输入流，也可以作为输出流，但通常它们不能同时兼任这两者。\n\
  \n有三个流被称为 `standard I/O`（标准输入/输出）流。它们如图 11.2 所示。\n\n### 核心概念\n`System` 类包含三个对象变量（即\
  \ `in`、`out` 和 `err` 中的三个公共引用变量），代表三个标准 I/O 流。这些引用被声明为 `public` 且为 `static`，这允许通过\
  \ `System` 类直接访问它们。\n\n在整本书中，我们一直在使用标准输出流，例如调用 `System.out.println`。当我们想要处理从用户处交互读取的输入时，我们还使用了标准输入流创建一个\
  \ `Scanner` 对象。`Scanner` 类以多种方式管理从标准输入流读取的输入，这使得我们的编程任务变得简单。它还在内部处理了各种 I/O 异常，并在需要时创建\
  \ `InputMismatchException`。\n\n标准 I/O 流默认代表特定的 I/O 设备。`System.in` 通常代表键盘输入，而 `System.out`\
  \ 和 `System.err` 通常代表显示器屏幕上的特定窗口。`System.out` 和 `System.err` 流默认向同一个窗口写入输出内容，尽管它们可以被设置为写入不同的地方。`System.err`\
  \ 流通常是发送错误消息的地方。\n\n### 描述\n| 对象 | 描述 |\n| :--- | :--- |\n| `System.in` | 标准输入流。\
  \ |\n| `System.out` | 标准输出流。 |\n| `System.err` | 标准错误流（错误消息的输出） |\n\n**图 11.2**\
  \ 标准 I/O 流。\n\n除了标准输入流外，Java API 的 `java.io` 包提供了许多类，允许我们定义具有特定特征的流。某些类处理文件，另一些处理内存，还有处理字符串。某些类假设它们处理的数据由字符组成，而另一些类则假设数据是由原始二进制信息的字节组成的。\n\
  \n某些类提供了以某种方式操作流中数据的方法，例如对信息进行缓冲或编号。通过以适当的方式组合类，我们可以创建定义 I/O 流的类，这些对象代表信息流，并具有我们为特定情况所需的各种特征。\n\
  \n### I/O 异常\nJava I/O 这一宽泛的主题加上 `java.io` 包中海量的类，使我们无法在书中详细介绍。我们目前的关注点是 I/O 异常。\n\
  \nI/O 类执行的许多操作都可能抛出 `IOException`。`IOException` 类是几个异常类的父类，这些异常代表了尝试执行 I/O 时出现的问题。`IOException`\
  \ 是一个检查异常（checked exception）。正如本章前面描述的，这意味着要么必须捕获异常，要么所有传播该异常的方法必须在方法头部的 `throws`\
  \ 子句中列出它。\n\n由于 I/O 经常涉及外部资源，在尝试执行 I/O 操作的程序可能会出现许多问题。例如，我们想要读取的文件可能不存在；当我们尝试打开该文件时，会抛出一个异常，因为找不到该文件。通常，我们应该尽量在处理潜在问题时设计尽可能健壮的程序。\n\
  \n我们在之前的示例中已经看到如何使用 `Scanner` 类来读取和处理从文本文件中读取的输入。现在，让我们探索一个将数据写入文本输出文件的示例。\n\n假设我们想要测试正在编写的程序，但没有可用的真实数据。我们可以编写一个程序生成一个包含随机值的测试数据文件。列表\
  \ 11.7 中的程序将生成一个包含特定范围内随机整数值的文件。它还会输出一行标准输出，以确认数据文件已写入。\n\n#### 列表 11.7\n```java\n\
  //********************************************************************\n// TestData.java\
  \ Author: Lewis/Loftus\n//\n// 演示了 I/O 异常以及字符文件\n// 输出流的使用。\n//********************************************************************\n\
  import java.util.Random;\nimport java.io.*;\n\npublic class TestData\n{\n//-----------------------------------------------------------------\n\
  // 创建一个测试数据文件，该文件包含十行，\n// 每行包含 10 到 99 之间的十个整数值。\n//-----------------------------------------------------------------\n\
  public static void main(String[] args) throws IOException\n{\n    final int MAX\
  \ = 10;\n    int value;\n    String fileName = \"test.txt\";\n    PrintWriter outFile\
  \ = new PrintWriter(fileName);\n    Random rand = new Random();\n    for (int line=1;\
  \ line <= MAX; line++)\n    {\n        for (int num=1; num <= MAX; num++)\n    \
  \    {\n            value = rand.nextInt (90) + 10;\n            outFile.print (value\
  \ + \" \");\n        }\n        outFile.println ();\n    }\n\n    outFile.close();\n\
  \    System.out.println(\"Output file has been created: \" + fileName);\n}\n```\n\
  \n`PrintWriter` 类的构造函数接受一个表示要打开的文件字符串。像 `System.out` 一样，`PrintWriter` 对象拥有 `print`\
  \ 和 `println` 方法，可写入文件。运行 `TestData` 程序后，`test.txt` 文件中包含的数据可能如下：\n`Output file\
  \ has been created: test.txt`\n\n必须显式关闭输出文件以确保数据能够被保留。通常，在不再需要时显式关闭所有文件流是一个良好的习惯。\n\
