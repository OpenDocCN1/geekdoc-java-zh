  \n### 12.4 图形中的递归 (Recursion in Graphics)\n\nSR 12.16 `TiledPictures` 程序的基准情况是图像的最小尺寸。递归终止。SR\
  \ 12.17 分形是由不同比例和角度的相同形状组成的几何形状。递归可以用于重复绘制。\n\n## 第 13 章 集合 (Collections)\n\n###\
  \ 13.1 集合与数据结构 (Collections and data Structures)\n\nSR 13.1 集合是一个用于存储和组织原始数据或其他对象的对象。某些集合是对解决问题非常有帮助的数据结构。\n\
  \nSR 13.2 是的，`ArrayList` 类提供了抽象数据类型。`ArrayList` 类提供了信息的集合。它提供了存储信息的操作。实现细节对我们是隐藏的——也就是说，使用\
  \ `ArrayList` 对象不需要知道信息是如何存储的或操作是如何实现的。\n\nSR 13.3 抽象数据类型（ADT）是数据以及对该数据执行的操作的集合。对象在本质上是同样的，因为我们将相关的变量和方法封装在对象中。对象隐藏了\
  \ ADT 的底层实现，将接口与实现分离，允许在不影响接口的情况下更改实现。\n\n### 13.2 动态表示 (dynamic Representations)\n\
  \nSR 13.4 动态数据结构通过引用将各种对象连接到特定的组织中。它是动态的，可以根据需要增长和缩小。可以在运行时添加新对象，并通过调整对象之间的引用从结构中移除失效的对象。\n\
  \nSR 13.5 向列表中插入节点，首先找到新节点之前的节点（将其命名为 `beforeNode`）。然后将新节点的 `next` 指针设置为 `beforeNode`\
  \ 的 `next` 指针。然后将 `beforeNode` 的 `next` 指针指向新节点。在列表开头处插入节点时存在特殊情况。\n\nSR 13.6 从列表中删除节点，首先找到要删除节点之前的节点（将其命名为\
  \ `beforeNode`）。然后将 `beforeNode` 的 `next` 指针设置为被删除节点的 `next` 指针。在删除列表第一个节点时存在特殊情况。\n\
  \nSR 13.7\n```java\nset count = 0;\ncurrent = first;\nwhile current != null\n  \
  \  count++;\n    current = current.next;\nreturn count;\n```\n\nSR 13.8 双向链表中的每个节点都有指向列表中其之前的节点和之后节点的引用。\n\
  \n\n\n\n\n# 数据结构\n\n这种组织允许在列表中方便地向后移动，并简化了某些操作。\n\n## 13.3 线性数据结构\n\nSR 13.9 链表的头节点是一个特殊的节点，它存储了有关列表的信息，例如指向列表头部和尾部的引用，以及用于跟踪列表中当前节点数量的整数。\n\
  \nSR 13.10 队列是一种类似于列表的线性数据结构，但它对使用有更多的限制。普通列表可以通过在列表的任何位置插入或删除节点来修改，但队列只在一端添加节点（`enqueue`）并在另一端取出节点（`dequeue`）。因此，队列使用先进先出（FIFO）的方法。\n\
