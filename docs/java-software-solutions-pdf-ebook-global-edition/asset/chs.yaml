  \n## 软件故障\n## 航空交通管制\n\n### 发生了什么？\n2004 年 9 月 14 日（周二）下午 5 点左右，洛杉矶航空交通管制中心突然失去了与与其在美西南部追踪的\
  \ 400 架飞机的语音联系。由位于佛罗里达州梅尔堡恩的 Harris 公司设计的语音切换控制系统（`VSCS`）意外关闭了。随后，设计用于发生此类故障时接管的备份系统在激活后一分钟内也崩溃了。在没有管制员的指导的情况下，飞机开始危险地相互靠近，导致了数次险些碰撞。\n\
  \n碰撞之所以被避免，部分归功于一些管制员的机敏反应，他们使用手机向正在使用交通管制中心和航空公司的其他管制员警报。但该事件没有演变成灾难的主要原因是由于现在商用客机上配备的机载避障系统。这些系统跟踪附近飞机的应应器，并向飞行员发出紧急指令，在最后时刻爬升或下降。如果该问题发生在\
  \ 10 到 15 年前（在飞机拥有此类避障系统之前），很可能会发生多次空中碰撞。\n\n### 产生原因是什么？\n官方认为，该事件被归咎于人为失误。联邦航空管理局（FAA）报告说，该问题“不是系统可靠性的结果”，如果遵循\
  \ FAA 的程序本可以避免的。此例中的关键程序要求每 30 天重启一次语音切换系统。\n\n然而，根源被追溯到一个软件问题。`VSCS` 依赖于一个定期运行内置测试的子系统。子系统中的倒计时计时器用于确定何时运行测试。计时器以毫秒为单位倒计时，从系统能处理的最大数值\
  \ `232` 开始。这超过了 40 亿毫秒。计时器从 `232` 减到零需要不到 50 天。遗憾的是，当计时器归零时，测试无法运行，系统就会关闭。通过每 30\
  \ 天重启一次系统，计时器会在过期前大约三周被重置。\n\n**467**\nFAA 首次在对现场系统进行测试时发现了这个问题问题。该系统运行了 49.7 天，然后崩溃了。重启后，一切似乎都正常。当另一个系统发生类似的崩溃时，FAA\
  \ 实施了 30 天重启一次的程序。\n\n在洛杉矶事件发生后，问题被追踪到了，并创建了软件补丁来修复问题。现在系统会定期重置计数器，无需人工干预。\n\n###\
  \ 汲取的教训\n在这种情况下，问题（即使不是其影响）是预先已知的。Harris（制造商）知道计时器可能过期的风险，但尚未确定它对系统可能产生的影响。FAA 在测试期间发现了这个问题——尽管不是根源。他们没有进一步挖掘，而是实施了基于人的手工解决方案——终极的“有疑就重启”情景。\n\
  \n诚然，如果遵循了 FAA 程序，问题是可以避免的，但当软件可以让此类程序变得不再必要时，这种安慰是微小的。同样，如果备份系统没有故障，该事件也将是微不足道的。拥有冗余的备份系统会减少完全失败的可能性。但在这种情况下，底线是彻底的测试和调查会将问题暴露出来。在安全关键型系统中，不应接受任何低于此标准的。\n\
  \n来源：IEEE Spectrum，2004 年 11 月\n\n**468**\n\n# 9 继承\n## 9.1 创建子类\n在第 1 章介绍面向对象的概念时，我们提出了这样的类比：类之于对象就像蓝图之于房屋。在随后的章节中，我们强化了这个想法，编写了定义一组相似对象的类。类建立了对象的特征和行为，但没有为变量留内存空间（除非这些变量被声明为\
  \ `static` ）。\n\n\n\n\n许多房屋可以根据同一个蓝图创建。它们本质上是位于不同位置的相同房屋，居住着不同的人。现在假设你想要一间与另一个房屋相似但具有某些不同或额外功能的房屋。你希望从同一个基础蓝图开始，但对其进行修改以适应新的、略有不同的需求。许多住宅区就是这样创建的。开发区中的房屋具有相同的核心布局，但它们拥有独特的特征。例如，它们可能都是具有相同基本房间配置的分层式住宅，但某些带有壁炉或完整的地下室，而另一些没有，或者拥有升级版的豪华厨房而不是标准版本。\n\
  \n房屋开发商可能会委托一位首席建筑师创建一张单一蓝图，以建立开发区所有房屋的基本设计，然后创建一系列包含变体以吸引不同买家的新蓝图。创建这一系列蓝图的过程被简化了，因为它们都从相同的底层结构开始，而变体赋予了它们独特的特征，这些特征对潜在所有者可能很重要。\n\
  \n# 继承\n\n基于现有蓝图 `KeY Concept` 创建新蓝图比比面向对象编程中的 `inheritance`（继承）概念。继承是从现有类派生新类的过程。\n\
  \n继承是一种强大的软件开发技术，也是面向对象编程的定义特性。\n\n通过继承，新类自动包含原始类中的变量和方法。然后，根据需要定制该类，程序员可以在派生类中添加新的变量和方法，或修改继承的成员。\n\
  \n通常，通过继承创建新类比从头开始写更快、更容易、更符合 `KeY Concept`。继承的一个目的是支持 `software reuse`（软件重用）的想法。通过使用现有的软件组件创建新组件，我们可以利用在现有软件的设计、实现和测试上投入的精力。\n\
  \n记住，`class`（类）一词源于对具有相似特征的对象进行分类。分类方案通常使用相互相关的类级。例如，所有哺乳动物都有某些特征：它们是温血动物，有毛，并产生牛奶喂养幼崽。\n\
  \n![](img/index-472_1.png)\n\n## 9.1 创建子类\n\n现在考虑哺乳动物的一个子，例如马。所有的马都是哺乳动物，具有哺乳动物的所有特征，但它们也具有独特的特征，使它们与狗等哺乳动物区别来。\n\
  \n我们将这一想法翻译成软件术语，一个名为 `Mammal` 的现有类将具有描述哺乳动物状态和行为的某些变量和方法。`Horse` 类可以从现有的 `Mammal`\
  \ 类派生，自动继承 `Mammal` 中包含的变量和方法。`Horse` 类可以引用继承的变量和方法，就像它们在该类中局部声明的一样。然后可以在派生类中添加新的变量和方法，以将马与其他哺乳动物开来。\n\
  \n用于派生新类的原始类被称为 `parent class`（父类）、`superclass`（超类）或 `base class`（基类）。派生类被称为 `child\
  \ class`（子类）或 `subclass`。继承在父类和子类之间建立了一个 `is-a relation`（“是一个”的关系）。Java 使用关键字 `extends`\
  \ 表示一个新类正从一个现有类派生。\n\n继承的过程应该在两个类之间建立 `is-a relationship`。也就是说，子类应该是父类的更具体的版本。例如，马是哺乳动物。并不是所有的哺乳动物都是马，但所有的马都是哺乳动物。对于任何从类\
  \ `Y` 派生的类 `X`，你都应该说“X 是一个 Y”。如果这种说法不通，那么这种关系可能不是继承的适当用法。\n\n让我们来看一个例子。列表 9.1 显示的程序实例化了一个\
  \ `Dictionary` 类对象，该类派生自名为 `Book` 的类。在 `main` 方法中，通过 `Dictionary` 对象调用了三个方法：两个是在\
  \ `Dictionary` 类中局部声明的，一个是继承自 `Book` 类。\n\n`Book` 类（参见列表 9.2）用于通过 `Dictionary` 头部关键字\
  \ `extends` 派生 `Dictionary` 类（参见列表 9.3）。\n\n`Dictionary` 类自动继承 `setPages` 和 `getPages`\
  \ 方法的定义，以及 `pages` 变量。仿佛这些方法和 `pages` 变量是声明在 `Dictionary` 类内部一样。注意，在 `Dictionary`\
  \ 类中，`computeRatio` 方法显式引用了 `pages` 变量，尽管该变量是在 `Book` 类中定义的。\n\n还要注意，尽管创建 `Dictionary`\
  \ 的定义需要 `Book` 类，但程序中从未实例化过 `Book` 对象。子类的实例不依赖于父类的实例。\n\n继承是单行道。`Book` 类不能使用在 `Dictionary`\
  \ 类中显式定义的变量或方法。例如，如果我们从 `Book` 类创建了一个对象，它不能被用来调用 `setDefinitions` 方法。这种限制是有意义的，因为子类是父类的更具体的版本。\n\
  \n**第 9 章 继承**\n\n**列表 9.1**\n\n```\n//********************************************************************\n\
  // Words.java Author: Lewis/Loftus\n//\n// 展示了继承方法的使用。\n//********************************************************************\n\
  public class Words\n{\n\n//-----------------------------------------------------------------\n\
  // 实例化一个派生类并调用其继承的\n// 局部方法。\n//-----------------------------------------------------------------\n\
  \    public static void main(String[] args)\n    {\n        Dictionary webster =\
  \ new Dictionary();\n        System.out.println(\"Number of pages: \" + webster.getPages());\n\
  \        System.out.println(\"Number of definitions: \" + webster.getDefinitions());\n\
  \        System.out.println(\"Definitions per page: \" + webster.computeRatio());\n\
  \    }\n}\n```\n\n**输出**\nNumber of pages: 1500\nNumber of definitions: 52500\n\
  Definitions per page: 35.0\n\n继承关系通常在 UML 类图中表示。图 9.1 显示了 `Book` 和 `Dictionary`\
  \ 类之间的继承关系。带有空箭头的箭头用于在 UML 图表示继承，箭头从子类指向父类。\n\n**列表 9.2**\n\n```\n//********************************************************************\n\
  // Book.java Author: Lewis/Loftus\n//\n// 代表一本书。作为派生类的父类用于\n// 展示继承。\n//********************************************************************\n\
  public class Book\n{\n\n    protected int pages = 1500;\n\n    //-----------------------------------------------------------------\n\
  \    // Pages 变异器。\n    //-----------------------------------------------------------------\n\
  \    public void setPages(int numPages)\n    {\n        pages = numPages;\n    }\n\
  \n    //-----------------------------------------------------------------\n    //\
  \ Pages 访问器。\n    //-----------------------------------------------------------------\n\
  \    public int getPages()\n    {\n        return pages;\n    }\n}\n```\n\n**protected\
  \ 修饰符**\n\n\n\n\n正如我们所看到的，可见性修饰符用于控制类成员的访问。这种效果也延伸到了继承过程中。父类中的任何公共（public）方法或变量都可以在子类中通过名称以及该子类的对象显式引用。另一方面，父类的私有（private）方法和变量无法在子类中或通过子类对象被引用。\n\
  \n然而，如果我们声明一个具有公共可见性的变量以便让派生类引用它，那么我们就违反了封装原则。因此，Java 提供了第三种可见性修饰符：`protected`。注意，变量\
  \ `pages` 在 `Book` 类中被声明为 `protected` 可见性。当变量或方法被声明为 `protected` 可见性时，派生类可以引用它。而\
  \ `protected` 可见性允许类保留某些封装属性。使用 `protected` 可见性的封装虽然没有将变量或方法声明为 `private` 那么严密，但比声明为\
  \ `public` 要好。\n\n## 9.1 创建子类\n\n```java\n//********************************************************************\n\
  // Dictionary.java Author: Lewis/Loftus\n//\n// 表示一个字典，即一本书。用于演示\n// 继承。\n//********************************************************************\n\
  public class Dictionary extends Book\n{\n    private int definitions = 52500;\n\n\
  \    //-----------------------------------------------------------------\n    //\
  \ 使用本地和继承的值打印消息。\n    //-----------------------------------------------------------------\n\
  \    public double computeRatio()\n    {\n        return (double) definitions/pages;\n\
  \    }\n\n    //----------------------------------------------------------------\n\
  \    // Definitions 的修改器。\n    //----------------------------------------------------------------\n\
  \    public void setDefinitions(int numDefinitions)\n    {\n        definitions\
  \ = numDefinitions;\n    }\n\n    //----------------------------------------------------------------\n\
  \    // Definitions 的访问器。\n    //----------------------------------------------------------------\n\
  \    public int getDefinitions()\n    {\n        return definitions;\n    }\n}\n\
  ```\n\n`protected` 可见性可以被同一个包中的任何类访问，同时也可以被任何派生类访问。`protected` 可见性提供了提供了允许继承范围内最好的封装。\n\
  \n在 UML 图中，`protected` 可见性可以通过在受保护成员前加一个哈希标记（`#`）来表示。图 9.1 中 `Book` 类的 `pages` 变量就有此注解。每个变量或方法都保留其原始可见性修饰符的效果。例如，`setPages`\
  \ 方法在 `Dictionary` 类中的继承形式中仍被认为是 `public` 的。\n\n#### 继承概览\n\n让我们明确一下我们的术语。所有方法和变量，即使是声明为\
  \ `private` 可见性的，也会被子类继承。也就是说，它们的定义存在，并且为这些变量留有了内存空间。只是它们不能通过名称进行引用。这个问题将在 9.4 节中进行更详细探讨。\n\
  \n然而，构造函数是不被继承的。构造函数是用于设置特定对象的特殊方法，因此，一个名为 `Dictionary` 的类拥有名为 `Book` 的构造函数是没有意义的。但你可以想象，子类可能想要引用父类的构造函数，这就是后面将描述的\
  \ `super` 引用的原因之一。\n\n### super 引用\n\n关键字 `super` 可以在类中使用以引用其父类。通过 `super` 引用，我们可以访问父类的成员。与\
  \ `this` 引用一样，`super` 单词所指的内容取决于调用 `super` 引用的位置——即使用它的类。\n\n`super` 引用的一个用途是调用父类的构造函数。让我们来看一个例子。列表\
  \ 9.4 显示了对列表 9.1 中原始 `Words` 程序的修改。与原始相似，我们使用了一个名为 `Book2` 的类。\n\n```java\n//********************************************************************\n\
  // Words2.java Author: Lewis/Loftus\n//\n// 演示 super 引用的使用。\n//********************************************************************\n\
  public class Words2\n{\n    //-----------------------------------------------------------------\n\
  \    // 实例化派生类并调用其继承的\n    // 本方法。\n    //-----------------------------------------------------------------\n\
  \    public static void main(String[] args)\n    {\n        Dictionary2 webster\
  \ = new Dictionary2(1500, 52500);\n        System.out.println(\"Number of pages:\
  \ \" + webster.getPages()); \n        System.out.println(\"Number of definitions:\
  \ \" + webster.getDefinitions());\n        System.out.println(\"Definitions per\
  \ page: \" + webster.computeRatio());\n    }\n}\n```\n**输出：**\nNumber of pages:\
  \ 1500\nNumber of definitions: 52500\nDefinitions per page: 35.0\n\n```java\n//********************************************************************\n\
  // Book2.java Author: Lewis/Loftus\n//\n// 表示一本书。作为派生类的父类，用于演示\n// 继承和 super 引用的使用。\n\
  //********************************************************************\npublic class\
  \ Book2\n{\n    protected int pages;\n\n    //----------------------------------------------------------------\n\
  \    // 构造函数：用指定的页数 \n    // 设置书。\n    //----------------------------------------------------------------\n\
  \    public Book2(int numPages)\n    {\n        pages = numPages;\n    }\n\n   \
  \ //----------------------------------------------------------------\n    // Pages\
  \ 的修改器。\n    //----------------------------------------------------------------\n\
  \    public void setPages(int numPages)\n    {\n        pages = numPages;\n    }\n\
  \n    //----------------------------------------------------------------\n    //\
  \ Pages 的访问器。\n    //----------------------------------------------------------------\n\
  \    public int getPages()\n    {\n        return pages;\n    }\n}\n```\n\n然而，与这些类的早期版本不同，`Book2`\
  \ 和 `Dictionary2` 具有用于初始化实例变量的显式构造函数。`Words2` 程序的输出与原始 `Words` 程序相同。\n\n```java\n\
  //********************************************************************\n// Dictionary2.java\
  \ Author: Lewis/Loftus\n//\n// 表示一个字典，即一本书。用于演示\n// super 引用的使用。\n//********************************************************************\n\
  public class Dictionary2 extends Book2\n{\n    private int definitions;\n\n    //-----------------------------------------------------------------\n\
  \    // 构造函数：用指定的页数和\n    // 定义数量设置字典。\n    //-----------------------------------------------------------------\n\
  \    public Dictionary2(int numPages, int numDefinitions)\n    {\n        super(numPages);\n\
  \        definitions = numDefinitions;\n    }\n}\n```\n\n\n\n\n```java\n// Prints\
  \ a message using both local and inherited values.\n\n//-----------------------------------------------------------------\n\
  \npublic double computeRatio()\n{\n    return (double) definitions/pages;\n}\n\n\
  //----------------------------------------------------------------\n\n// Definitions\
  \ mutator.\n\n//----------------------------------------------------------------\n\
  \npublic void setDefinitions(int numDefinitions)\n{\n    definitions = numDefinitions;\n\
  }\n\n//----------------------------------------------------------------\n\n// Definitions\
  \ accessor.\n\n//----------------------------------------------------------------\n\
  \npublic int getDefinitions()\n{\n    return definitions;\n}\n\n}\n```\n\n## 9.1\
  \ 创建子类\n\n479\n\n**列表 9.6** (*续*)\n\n`Dictionary2` 构造函数接收两个整数值作为参数，代表书中的页数和定义数量。由于\
  \ `Book2` 类已经有一个构造函数来执行设置被继承的字典部分的工作，因此我们依赖于该构造函数来完成这些工作。然而，由于构造函数是不被继承的，我们无法直接调用它，因此我们使用\
  \ `super` 引用来访问父类中的该构造函数。随后，`Dictionary2` 构造函数初始化它的 `definitions` 变量。\n\n在这种情况下，直接在\
  \ `Dictionary2` 构造函数里显式设置 `pages` 变量与使用 `super` 调用 `Book2` 构造函数同样简单。然而，让每个类“自理”是一种良好的做法。如果我们选择改变\
  \ `Book2` 构造函数设置 `pages` 变量的方式，我们也必须记住在 `Dictionary2` 中进行相应的更改。通过使用 `super` 引用，在\
  \ `Book2` 中进行的更改会自动反映在 `Dictionary2` 中。\n\n子类的构造函数负责调用其父类的构造函数。通常，构造函数的第一行应该使用 `super`\
  \ 引用调用父类的构造函数。如果没有这样的调用，Java 将在构造函数的开头自动调用 `super()`。这条规则确保了父类在子类构造函数开始执行之前初始化了它的变量。使用\
  \ `super` 引用调用父构造函数只能在子类的构造函数中进行，并且如果包含，它必须是构造函数的第一行。\n\n`super` 引用也可以用于引用父类中定义的其他变量和方法。我们将在本章的后续章节中使用这种技术。\n\
  \n## 多重继承\n\nJava 的继承方法被称为`单继承`。这个术语意味着派生类只能有一个父类。某些面向对象的语言允许派生类拥有多个父类。这种方法被称为`多重继承`，有时用于描述介于两个类别或类之间的对象。例如，假设我们有一个\
  \ `Car` 类和一个 `Truck` 类，并且想要创建一个名为 `PickupTruck` 的新类。皮卡车在某种程度上像汽车，在某种程度上像卡车。使用单继承，我们必须决定是从\
  \ `Car` 还是从 `Truck` 派生这个新类更好。而在多重继承中，它可以从两者中都派生，如图 9.2 所示。\n\n多重继承在某些情况下运行良好，但它是有代价的。如果\
  \ `Truck` 和 `Car` 都有同名方法怎么办？Java 的设计者显式地决定不支持多重继承。相反，我们可以依靠接口来提供多重继承的最佳特性，而不会增加额外的复杂性。尽管一个\
  \ Java 类只能派生自一个父类，但它可以实现多个接口。\n\n因此，我们可以在继承一个父类的核心信息的同时，以特定的方式与特定的类进行交互。\n\n## 自测题（答案见附录\
