  \ 修饰符来限制继承？为什么要这样做？\n\n## 9.6 组件类层次结构\n\n所有定义 GUI 组件的 Java 类都是类层次结构的一部分，图 9.7 显示了部分内容。几乎所有表示\
  \ Java Swing GUI 组件的类都派生自 `JComponent`，它们被组织在一个定义了所有组件通用工作的类层次结构中。\n\n`JComponent`\
  \ 派生自 `Container` 类，而 `Container` 又派生自 `Component` 类。\n\n你可能记得 Java 中使用了两个主要的 GUI\
  \ API：抽象窗口工具包 (`AWT`）和 `Swing` 类。`AWT` 是 Java 中原始的图形类集合。`Swing` 类后来引入的，增加了提供了比其\
  \ `AWT` 对应组件多得功能的组件。我们在书中的示例使用了 `Swing` 组件。在组件类层次结构中，某些 `Swing` 类最终派生自 `AWT` 类。\n\
  \n`Container` 和 `Component` 都是原始的 `AWT` 类。`Component` 类包含了适用于所有 GUI 组件的通用功能，例如基础绘制和事件处理。因此，尽管我们可能倾向于使用某些特定的\
  \ `Swing` 组件，但它们基于核心的 `AWT` 概念，并响应与 `AWT` 组件相同的事件。由于它们派生自 `Container`，许多 `Swing`\
  \ 组件可以作为容器，尽管在大多数情况下这些能力被削弱了。例如，我们已经看到 `JLabel` 对象可以包含图像，但它不能用作通用容器向其中添加任何组件。\n\n\
  许多适用于所有 `Swing` 组件的功能定义在 `JComponent` 类中，并继承到其后代中。例如，我们有能力为任何 `Swing` 组件添加边框（正如我们在第\
  \ 6 章中看到的样）。这种能力在 `JComponent` 类中定义一次，并被任何直接或间接派生自它的类继承。\n\n某些组件类（如 `JPanel` 和 `JLabel`）直接派生自\
  \ `JComponent`。其他组件类嵌套在继承层次结构的更深层中。例如，`AbstractButton` 类是一个抽象类，定义了适用于所有类型 GUI 按钮的功能。`JButton`\
  \ 直接派生自它。然而，请注意 `JCheckBox` 和 `JRadioButton` 都派生自一个名为 `JToggleButton` 的类，该类体现了可以在两种状态之间切换的按钮的共同特征。定义\
  \ GUI 按钮的类集合再次展示了如何将共同特征放在类层次结构中适当的高层，而不是在多个类中重复。\n\n文本组件的世界也证明了这一点。我们在之前的示例中使用的\
  \ `JTextField` 类是许多支持文本数据管理的 Java GUI 组件之一。它们被组织在一个名为 `JTextComponent` 的类下。请记住，图\
  \ 9.7 的图中没有显示许多 GUI 组件类。\n\n在之前的章节中，我们通过继承定义自己的 `panel` 和 `applet` 类进一步扩展了组件类层次结构。通过扩展\
  \ `JPanel` 或 `JApplet` 类，我们创建了了自己的类，这些类自动具有相应组件的所有特征。有时，我们会重写方法的定义（例如 `paintComponent`\
  \ 方法），使其以特定的方式运行。\n\n创建我们自己的面板和 applet 类是继承的经典用法，允许父类承担适用于所有后代的责任。例如，`JApplet` 类已经设计为处理所有关于\
  \ applet 创建和执行的细节。applet 与浏览器交互，可以通过 HTML 代码接受参数，并受到某些安全限制的约束。`JApplet` 类已经以适用于所有\
  \ applet 的通用方式处理了这些细节。我们写的 applet 类（派生自 `JApplet` 的类）准备好专注于该特定程序的目的。换句话说，我们在 applet\
  \ 代码中解决的问题只有那些使它与其他 applet 不同的问题。\n\n### 自测习题\n*(答案见附录 N)*\n\n`SR 9.23` 根据本节显示的\
  \ GUI 组件类层次结构图，判断对错：\na. 一个 `JCheckBox` 对象是一个 `JToggleButton`。\nb. 一个 `JCheckBox`\
  \ 对象是一个 `AbstractButton`。\nc. 一个 `JTextField` 对象是一个 `JLabel`。\nd. 一个 `JComponent`\
  \ 对象是一个 `JPanel`。\ne. 一个 `JToggleButton` 对象是一个 `JButton`。\nf. `JRadioButton` 是一个\
  \ `Component`。\n\n`SR 9.24` 让你的 applet 类扩展 Java 库的 `Applet` 类有什么好处？\n\n\n\n\n\n\
  监听器类被实现为 `OffCenterPanel` 类的内部类，如列表 9.14 所示。我们没有像之前的示例中那样直接实现 `MouseListener` 接口，而是让这个监听器继承\
  \ `MouseAdapter` 类，该类定义在 Java 标准类库的 `java.awt.event` 包中。`MouseAdapter` 类实现了 `MouseListener`\
  \ 接口，并包含了所有鼠标事件方法的空定义。在我们的监听器类中，我们重写重写了 `mouseClicked` 方法的定义以适应我们的需求。由于我们继承了对应其他鼠标事件的空方法，因此我们就不需要提供自己的空定义了。\n\
  \n由于继承的存在，我们现在在创建事件监听器时有了选择。我们可以实现一个事件监听器接口，也可以扩展一个事件适配器类。这是一个应该仔细考虑的设计决策。最佳技术取决于情况。\n\
