  \ 方法随后调用 `drawPictures` 方法，该方法接收一个定义显示区域的参数。它使用 `drawImage` 方法绘制三张图片，并将其缩放到正确的尺寸和位置。\n\
  \n![](img/index-631_1.png)\n\n**630**\n**第 12 章** 递归\n`drawPictures` 方法被递归调用以绘制左上象限。在每次调用中，如果绘制区域足够大，再次调用\
  \ `drawPictures` 方法，使用较小的绘制区域。最终，绘制区域变得非常小，不再执行递归调用。这就是为什么最小版本的左上角是空的。\n\n#### 分形\n\
  *分形*（fractal）是由不同比例和方向重复的相同图案组成的几何形状。分形是以递归方式定义的几何形状。近年来对分形的兴趣极大，这在很大程度上归功于 1924\
  \ 年生的波兰数学家本努·曼德尔博（Benoit Mandelbrot）。他证明了分形出现在数学的许多地方。计算机使得分形的生成和研究变得容易得多。在过去的四世纪里，用分形创建的明亮有趣的图像已被认为是一种艺术形式。\n\
  \n分形的一个特殊例子被称为科赫雪花，以瑞典数学家海尔格·科赫（Helge von Koch）命名。它从等边三角形开始，被认为是一阶科赫分形。更高阶的形形是通过反复修改形状中的所有线段来构建的。\n\
  \n要创建更高一阶的科赫分形，形状中的每条线段都通过将其中间三分之一替换为两个线段组成的尖锐突出部分，每个线段的长度与被替换的部分相同。对于整个形状而言，任何线段上的突出部分始终向外。图\
  \ 12.7 显示了几阶的分形。随着阶数的增加，形状开始像雪花。\n\n列表 12.6 所示的 Applet 绘制了不同阶数的科赫雪花。Applet 顶部的按钮允许用户增加和减少分形的阶。每次按下按钮，分形图像都会重绘。Applet\
  \ 充当按钮的监听器。\n\n**631**\n**图 12.7** 科赫雪花的几阶 **l i s t i n g 1 2 . 6**\n\n\n\n\n\n\
  ```java\n//********************************************************************\n\
  // KochSnowflake.java Author: Lewis/Loftus\n//\n// 演示了递归的使用。\n//********************************************************************\n\
  import java.awt.*;\nimport java.awt.event.*;\nimport javax.swing.*;\n\npublic class\
  \ KochSnowflake extends JApplet implements ActionListener\n{\n    private final\
  \ int APPLET_WIDTH = 400;\n    private final int APPLET_HEIGHT = 440;\n    private\
  \ final int MIN = 1, MAX = 9;\n    private JButton increase, decrease;\n    private\
  \ JLabel titleLabel, orderLabel;\n    private KochPanel drawing;\n    private JPanel\
  \ appletPanel, tools;\n\n    //-----------------------------------------------------------------\n\
  \    // 设置 applet 的组件。\n    //-----------------------------------------------------------------\n\
  \    public void init()\n    {\n        tools = new JPanel();\n        tools.setLayout(new\
  \ BoxLayout(tools, BoxLayout.X_AXIS));\n        tools.setBackground(Color.yellow);\n\
  \        tools.setOpaque(true);\n\n        titleLabel = new JLabel(\"科赫雪花\");\n\
  \        titleLabel.setForeground(Color.black);\n        increase = new JButton(new\
  \ ImageIcon(\"increase.gif\"));\n        increase.setPressedIcon(new ImageIcon(\"\
  increasePressed.gif\"));\n        increase.setMargin(new Insets(0, 0, 0, 0));\n\
  \        increase.addActionListener(this);\n        decrease = new JButton(new ImageIcon(\"\
  decrease.gif\"));\n        decrease.setPressedIcon(new ImageIcon(\"decreasePressed.gif\"\
  ));\n        decrease.setMargin(new Insets(0, 0, 0, 0));\n        decrease.addActionListener(this);\n\
  \        orderLabel = new JLabel(\"Order: 1\");\n        orderLabel.setForeground(Color.black);\n\
  \        tools.add(titleLabel);\n        tools.add(Box.createHorizontalStrut(20));\n\
  \        tools.add(decrease);\n        tools.add(increase);\n        tools.add(Box.createHorizontalStrut(20));\n\
  \        tools.add(orderLabel);\n        drawing = new KochPanel(1);\n        appletPanel\
  \ = new JPanel();\n        appletPanel.add(tools);\n        appletPanel.add(drawing);\n\
  \        getContentPane().add(appletPanel);\n        setSize(APPLET_WIDTH, APPLET_HEIGHT);\n\
  \    }\n\n    //-----------------------------------------------------------------\n\
  \    // 确定哪个按钮被按下，如果在范围内则设置\n    //新的阶（order）。\n    //-----------------------------------------------------------------\n\
  \    public void actionPerformed(ActionEvent event)\n    {\n        int order =\
  \ drawing.getOrder();\n        if (event.getSource() == increase)\n            order++;\n\
  \        else\n            order--;\n\n        if (order >= MIN && order <= MAX)\n\
  \        {\n            orderLabel.setText(\"Order: \" + order);\n            drawing.setOrder(order);\n\
  \            repaint();\n        }\n    }\n}\n```\n\n### 第 12 章 递归\n\n**列表 12.6（续）**\n\
  \n分形图像绘制在由列表 12.7 所示的 `KochPanel` 类定义的画布上。`paint` 方法对递归方法 `drawFractal` 发出初始调用。`paint`\
  \ 方法中对 `drawFractal` 的三次调用代表了等边三角形的三个边，它们构成了阶数为 1 的科赫分形。\n\n**列表 12.7**\n\n```java\n\
  //********************************************************************\n// KochPanel.java\
  \ Author: Lewis/Loftus\n//\n// 表示一个可以在上面绘制科赫雪花的绘制表面。\n//********************************************************************\n\
  import java.awt.*;\nimport javax.swing.JPanel;\n\npublic class KochPanel extends\
  \ JPanel\n{\n    private final int PANEL_WIDTH = 400;\n    private final int PANEL_HEIGHT\
  \ = 400;\n    private final double SQ = Math.sqrt(3.0) / 6;\n    private final int\
  \ TOPX = 200, TOPY = 20;\n    private final int LEFTX = 60, LEFTY = 300;\n    private\
  \ final int RIGHTX = 340, RIGHTY = 300;\n    private int current; // 当前阶数\n\n  \
  \  //-----------------------------------------------------------------\n    // 将初始分形阶设置为指定的值。\n\
  \    //-----------------------------------------------------------------\n    public\
  \ KochPanel(int currentOrder)\n    {\n        current = currentOrder;\n        setBackground(Color.black);\n\
  \        setPreferredSize(new Dimension(PANEL_WIDTH, PANEL_HEIGHT));\n    }\n\n\
  \    //-----------------------------------------------------------------\n    //\
  \ 递归地绘制分形。基本情况是阶数为 1，\n    // 绘制一条简单的直线。否则，计算三个\n    // 中间点，并将每个线段作为分形绘制。\n    //-----------------------------------------------------------------\n\
  \    public void drawFractal(int order, int x1, int y1, int x5, int y5, Graphics\
  \ page)\n    {\n        int deltaX, deltaY, x2, y2, x3, y3, x4, y4;\n        if\
  \ (order == 1)\n            page.drawLine(x1, y1, x5, y5);\n        else\n     \
  \   {\n            deltaX = x5 - x1; // 之间的距离\n            deltaY = y5 - y1;\n \
  \           x2 = x1 + deltaX / 3; // 三分之一\n            y2 = y1 + deltaY / 3;\n \
  \           x3 = (int) (x2 + (deltaY * SQ) / 6); // 投影的顶点\n            y3 = (int)\
  \ (y2 - (deltaX * SQ) / 6);\n            x4 = x1 + 2 * deltaX / 3; // 三分之\n    \
  \        y4 = y1 + 2 * deltaY / 3;\n\n            drawFractal(order - 1, x1, y1,\
  \ x2, y2);\n            drawFractal(order - 1, x2, y2, x3, y3);\n            drawFractal(order\
  \ - 1, x3, y3, x4, y4);\n            drawFractal(order - 1, x4, y4, x5, y5);\n \
  \       }\n    }\n\n    //-----------------------------------------------------------------\n\
  \    // 执行 drawFractal 的初始调用。\n    //-----------------------------------------------------------------\n\
  \    public void paintComponent(Graphics page)\n    {\n        super.paintComponent(page);\n\
  \        page.setColor(Color.green);\n        drawFractal(current, TOPX, TOPY, LEFTX,\
  \ LEFTY);\n        drawFractal(current, LEFTX, LEFTY, RIGHTX, RIGHTY);\n       \
  \ drawFractal(current, RIGHTX, RIGHTY, TOPX, TOPY);\n    }\n\n    //-----------------------------------------------------------------\n\
  \    // 将分形阶设置为指定的值。\n    //-----------------------------------------------------------------\n\
  \    public void setOrder(int order)\n    {\n        current = order;\n    }\n\n\
  \    //-----------------------------------------------------------------\n    //\
  \ 返回当前阶数。\n    //-----------------------------------------------------------------\n\
  \    public int getOrder()\n    {\n        return current;\n    }\n}\n```\n\n###12.4\
  \ 图形学中的递归\n\n科赫雪花的一个有趣的数学特性是它具有无限的周长，但面积是有限的。随着分形阶数的增加，周长呈指数级增长，其极限为无穷大。然而，一个足以容纳科赫雪花二阶分形的矩形，足以包含所有更高阶阶的分形。该形状在面积上被永远限制，但其周长会变得无限长。\n\
  \n\n\n\n\n**图 12.8** 科赫雪花每条线段的变换 **自测习题** *(答案见附录 N)*\n\nSR 12.16 `TiledPictures`\
  \ 程序的基准情况是什么？\n\nSR 12.17 什么是分形？它与递归有什么关系？\n\n# 第 12 章 递归\n\n### 核心概念总结\n\n- 递归是一种编程技术，其中方法调用其自身。能够递归编程的关键在于能够递归地思考。\n\
  - 任何递归定义都必须包含一个非递归部分，称为 `base case`（基准情况），它允许递归最终结束。\n- 数学问题和公式通常以递归方式表示。\n- 方法的每次递归调用都会创建新的局部变量和参数。\n\
  - 对递归处理过程进行细致追踪，可以深入理解其用于解决问题的方式。\n- 递归是解决某些问题最优雅、合适的方法，但对于其他问题，它不如迭代解决方案那么直观。\n\
  - 汉诺塔问题的解具有指数复杂度，效率非常低。然而，该解决方案的实现却非常短且优雅。\n- 分形是以递归方式自然定义的几何形状。\n\n## 练习\n\n- EX\
