  \ 中显示的 `Splat` 类包含一个 `main` 方法，用于创建并显示程序的窗口。从视觉上看，这个 `listing 4.7`\n\n```java\n\
  //********************************************************************\n// Splat.java\
  \ Author: Lewis/Loftus\n//\n// Demonstrates the use of graphical objects.\n//********************************************************************\n\
  import javax.swing.*;\nimport java.awt.*;\n\npublic class Splat\n{\n    //-----------------------------------------------------------------\n\
