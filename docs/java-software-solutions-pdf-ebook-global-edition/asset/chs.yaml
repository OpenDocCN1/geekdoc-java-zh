  \n# 面对象设计\n\n## 第 7 章目标\n\n- 建立与面向对象软件设计相关的关键问题。\n- 探索识别程序所需的类和对象的技术。\n- 讨论类之间的关系。\n\
  - 描述 `static` 修饰符对方法和数据的影响。\n- 讨论正式对象接口的创建。\n- 进一步探索枚举类型的定义。\n- 讨论与方法设计相关的问题，包括方法重载。\n\
  - 探索与图形用户界面设计相关的问题，包括布局管理器。\n\n本章扩展了对面向对象软件设计的讨论。我们首先关注软件开发阶段以及在问题领域中识别类和对象的流程。\n\
  \n然后，我们讨论了影响类设计的各种问题，包括 `static` 成员、类关系、接口和枚举类型。我们还探索了方法层面的设计问题，并引入了方法重载的概念。对测试策略的讨论完成了这些问题的介绍。在本章的“图形轨道”章节中，我们关注\
  \ GUI 设计概念，包括布局管理器和包含层次结构。\n\n**327**\n**328**\n\n## 第 7 面对象设计\n\n## 7.1 软件开发活动\n\
  \n创建软件涉及的远比编写代码得多。随着你处理的问题变得越来越大，解决方案包含更多的类，仔细思考软件的设计变得至关重要。任何恰当的软件开发工作都由四个基本的 `开发活动`组成：\n\
  \n- 建立需求\n- 创建设计\n- 实现设计\n- 测试\n\n如果这些活动能按照这种顺序定义一种开发软件的逐步方法，那就太好了。然而，尽管它们看起来是顺序的，但在现实中它们几乎从不是完全线性的。它们相互重叠并相互作用。让我们简要讨论每个开发活动。\n\
  \n`软件需求` 规定了程序必须完成*什么*。它们指出了程序应该执行的任务，而不是如何执行这些任务。通常，需求是在名为`功能规范`的文档中表达的。\n\n我们在第\
  \ 1 章中讨论过一个基本前提：编程实际上是关于解决问题的；我们创建一个程序是为了解决特定问题。需求是该问题的清晰表达。在真正知道我们正在尝试解决什么问题之前，我们无法真正解决它。\n\
  \n想要开发软件产品的人或小组（`客户`）通常会提供一组初始需求。然而，这些初始需求通常是不完整的、含义的，甚至可能是矛盾的。软件开发人员必须与客户合作完善需求，直到关于系统将做什么的所有关键决策都得到解决。\n\
  \n需求通常涉及用户界面问题，如输出格式、屏幕布局和图形界面组件。本质上，需求建立了使程序对终端用户实用的特征。它们也可能对你的程序施加限制，例如任务必须执行得有多快。\n\
  \n`软件设计` 指明了程序将*如何*完成其需求。\n\n设计规定了程序所需的类和对象，并定义了它们如何交互。它还规定了类之间的关系。低级设计问题处理单个方法如何完成其任务。\n\
  \n土木工程师绝不会在不先设计的情况下考虑建造桥梁。软件的设计同样重要。软件中发生的许多问题直接归于缺乏良好的设计工作。事实反复证明，在程序设计上花费的精力是非常值得的，从远来看节省了时间和金钱。\n\
  \n![](img/index-330_1.png)\n![](img/index-330_2.png)\n\n### 7.2 识别类和对象\n\n**329**\n\
  \n在软件设计期间，需要考虑替代方案并探索**关键概念**。通常，设计的第一次尝试并不是最佳解决方案。投入设计的精力既至关重要又具有成本效益。幸运的是，在设计阶段更改是相对容易的。\n\
  \n`实现` 是编写将解决问题的源代码的过程。更准确地说，实现是将设计翻译成特定编程语言的行为。许多程序员只关注实现，而实际上，它应该是所有开发活动中创造力最低的的一项。重要的决策应该在建立需求和创建设计时做出。\n\
  \n`测试` 是确保程序在它必须执行的所有约束条件下能够解决预设问题的行为。测试包括使用各种输入多次运行程序，并仔细检查结果。但它所代表的意义远不止于此。我们将在\
  \ 7.9 节中重新讨论与测试相关的问题。\n\n**自测习题** *(答案见附录 N )*\n\nSR 7.1 列出涉及软件开发过程四个基本活动。\n\nSR\
  \ 7.2 谁创建/指定需求？客户还是开发人员？讨论。\n\nSR 7.3 将本节介绍的四个基本开发活动与第 1 章（第 1.6 节）中的五个通用问题解决步骤进行比较和对比。\n\
  \n### 7.2 识别类和对象\n\n面向对象软件设计的一个基本部分是确定对程序贡献的类。我们必须仔细考虑想要如何表示组成整体解决方案的各种元素。这些类决定了我们在系统中管理的对象。\n\
  \n识别潜在类的一种方法是识别程序需求中讨论的对象。对象通常是名词。你实际上可能需要仔细检查问题描述，或者如果有功能规范的话，以识别其中发现的名词。例如，图 7.1\
  \ 显示了问题描述的一部分，并圈出了其中的名词。\n\n**关键概念**\n\n当然，问题规范中的每个名词都不会对应于程序中的一个类。这项活动只是一个起点，允许你思考程序将管理的对象类型。问题描述中的名词可能指示程序所需的某些类和对象。\n\
  \n**330**\n**第 7 面对象设计**\n\n用户必须允许通过其主要特征来指定每个产品，包括其名称和产品编号。如果条码不匹配\n\n\n\n\n产品，此时应向消息窗口生成错误并录入错误日志中。所有事务的汇总报告必须按照第\
  \ 7.A 节规定的结构进行组织。\n\n**图 7.1** 圈出名词的部分问题描述。请记住，一个类表示一组具有相似行为的对象。规范中的复数名词（例如 `products`）可能表示需要一个表示其中某项物品的类，例如\
  \ `Product`。即使你的系统中只需要一种特定类型的对象，它也可能最好被表示为一个类。\n\n表示对象的类通常应该使用单数名词进行命名，例如 `Coin`、`Student`\
  \ 和 `Message`。一个类代表一个单项，我们可以根据意愿从该类创建任意数量的实例。\n\n另一个关键决策是将某个内容表示为对象，还是表示为另一个对象的原始类型属性。例如，我们最初可能认为员工的薪水应该表示为整数，这对于系统的大部分处理工作可能是有效的。但经过进一步的反思，我们可能会意识到薪水取决于个人的职级，而职级有上限和下限工资范围，必须小心管理。因此，最终的结论可能是，我们认为将所有数据和相关行为表示为一个独立的类会更好。\n\
  \n考虑到特定程序的需求，我们希望在过于通用的类和过于具体的类之间取得良好的平衡。例如，为房子中存在的每种家电创建一个单独的类可能会不必要地增加设计的复杂性。拥有一个\
  \ `Appliance` 类可能足够了，其中或许有一个实例数据来指示它是哪种类型的家电。但另一方面，这可能也不够。这一切取决于软件旨在实现什么目标。\n\n\
  除了表示问题领域对象的类外，我们可能还需要支持完成工作所需工作的类。例如，除了 `Member` 对象之外，我们可能还需要一个单独的类来帮助我们管理俱乐部的所有成员。\n\
  \n请记住，在构建真实系统时，我们在设计过程中识别出的某些类可能已经存在了。即使没有完全匹配的，也可能有一个与我们相似的旧类，可以作为我们新类的基础。现有的类可能是\
  \ Java 标准类库的一部分，可能是我们以前解决过的问题的解决方案的一部分，也可能是从第三方购买的库的一部分。这些都是软件重用的示例。\n\n## 7.3 静态类成员\n\
  \n**分配职责**\n\n在识别程序所需的类的过程中，有一部分工作是为每个类分配职责。每个类表示一个具有某些行为的对象，这些行为由类的方法定义。程序必须完成的任何活动都必须在类的行为某处表示出来。也就是说，每个类负责执行某些活动，这些职责必须在设计程序时被分配。\n\
  \n类的行为执行了构成程序功能的操作。因此，我们通常使用动词来命名行为以及实现这些行为的方法。\n\n有时，要确定哪一个类是执行特定职责的最佳类是具有挑战性的。考虑多种可能性。有时这种分析会让你意识到，定义另一个类来承担该职责可能会让你受益。\n\
  \n在设计的早期阶段，没有必要识别一个类所包含的所有方法。\n\n**复习题**\n- 7.4 识别规范中的名词如何帮助你设计解决方案？\n- 7.5 定义类所包含的所有方法重要吗？\n\
  \n### 探索静态\n\n到目前为止，我们已经看到了两类变量：在方法内部声明的局部变量和在类中声明的实例变量。使用*实例变量*（instance variable）一词是因为每个对象都有其自己的变量版本。**静态变量**（static\
  \ variables）一种*静态变量*（有时称为*类变量*）由该类的所有实例共享。对于该类的所有对象，静态变量只有一个副本。因此，更改一个对象中静态变量的值会改变所有对象的值。关键字\
  \ `static` 用作修饰符来声明静态变量，如下：\n\n```java\nprivate static int count = 0;\n```\n\n当包含静态变量的类第一次被引用时，就会为静态变量建立内存空间。在方法内部声明的局部变量不能是静态的。使用\
  \ `final` 修饰符声明的常量通常使用 `static` 修饰符来声明。因为常量的值不能改变，那么在类的所有对象中只保留一个值的副本也是一样的。\n\n\
  ### 静态方法\n\n在第 3 章中，我们简要地介绍了*静态方法*（static method，也称为*类方法*）的概念。静态方法可以通过类名调用。我们不需要实例化类的对象即可调用该方法。在第\
  \ 3 章中，我们注意到 `Math` 类的所有方法都是静态方法。例如，在下面的行代码中，`sqrt` 方法是通过 `Math` 类名调用的：\n\n```java\n\
  System.out.println(\"Square root of 27: \" + Math.sqrt(27));\n```\n\n`Math` 类中的方法根据传递的参数的值执行基础计算。在这些情况下，没有需要维护的对象状态；因此，没有理由为了请求这些服务而创建一个对象。\n\
  \n通过在方法声明中使用 `static` 修饰符可以将方法设为静态的。由于静态方法不是在特定对象的上下文中运行，它们不能引用实例变量（实例变量只存在于类的实例中）。然而，静态方法可以引用静态变量，因为静态变量独立于特定对象。如果静态方法尝试使用非静态变量，编译器将发出错误。\n\
  \n\n\n\n列表 7.1 中的程序实例化了多个 `Slogan` 类对象，并依次打印每一个。在程序结束时，它通过类名调用了一个名为 `getCount` 的方法，该方法返回程序中实例化的\
  \ `Slogan` 对象的数量。\n\n### Listing 7.1\n\n```java\n//********************************************************************\n\
  // SloganCounter.java Author: Lewis/Loftus\n//\n// 展示了 static 关键字的使用。\n//********************************************************************\n\
  public class SloganCounter\n{\n//-----------------------------------------------------------------\n\
  // 创建几个 Slogan 对象并打印创建\n//对象的数量。\n//-----------------------------------------------------------------\n\
  \    public static void main(String[] args)\n    {\n        Slogan obj;\n      \
  \  obj = new Slogan(\"Remember the Alamo.\");\n        System.out.println(obj);\n\
  \        obj = new Slogan(\"Don't Worry. Be Happy.\"); System.out.println(obj);\n\
  \        obj = new Slogan(\"Live Free or Die.\");\n        System.out.println(obj);\n\
  \        obj = new Slogan(\"Talk is Cheap.\");\n        System.out.println(obj);\n\
  \        obj = new Slogan(\"Write Once, Run Anywhere.\"); System.out.println(obj);\n\
  \n        System.out.println();\n        System.out.println(\"Slogans created: \"\
  \ + Slogan.getCount());\n    }\n}\n```\n\n**输出**\n```\nRemember the Alamo.\nDon't\
  \ Worry. Be Happy.\nLive Free or Die.\nTalk is Cheap.\nWrite Once, Run Anywhere.\n\
  Slogans created: 5\n```\n\nListing 7.2 展示了 `Slogan` 类。`Slogan` 的构造函数会增加一个名为 `count`\
  \ 的静态变量，该变量在声明时初始化为零。\n\n因此，`count` 用于跟踪已创建的 `Slogan` 实例数量。\n\n`Slogan` 的 `getCount`\
  \ 方法也被声明为 `static`，这允许它在 `main` 方法中通过类名被调用。注意，`getCount` 方法中引用的唯一数据是整数变量 `count`，它是\
  \ `static` 的。\n\n作为静态方法，`getCount` 不能引用任何非静态数据。`getCount` 方法可以在不带 `static` 修饰符的情况下声明，但那样的话在\
  \ `main` 方法中的调用就必须通过 `Slogan` 类的实例而不是类本身来完成。\n\n### Listing 7.2\n\n```java\n//********************************************************************\n\
  // Slogan.java Author: Lewis/Loftus\n//\n// 表示单个口号字符串。\n//********************************************************************\n\
  public class Slogan\n{\n    private String phrase;\n    private static int count\
  \ = 0;\n\n//-----------------------------------------------------------------\n\
  // 构造函数：设置口号并统计创建\n//实例的数量。\n//-----------------------------------------------------------------\n\
  \    public Slogan(String str)\n    {\n        phrase = str;\n        count++;\n\
  \    }\n//-----------------------------------------------------------------\n//\
  \ 将此口号作为字符串返回。\n//-----------------------------------------------------------------\n\
  \    public String toString()\n    {\n        return phrase;\n    }\n//-----------------------------------------------------------------\n\
  // 返回此类已创建的实例的数量。\n//-----------------------------------------------------------------\n\
  \    public static int getCount()\n    {\n        return count;\n    }\n}\n```\n\
  \n## 7.3 静态类成员\n\n**自测题**（参见附录 N 中的答案）\n- **SR 7.6** 静态变量和实例变量之间的区别是什么？\n- **SR\
  \ 7.7** 假设你正在定义一个 `BankAccount` 类，其每个对象代表一个独立的银行账户。编写一个类变量声明，该变量将存储该类表示的所有银行账户的总余额。\n\
  - **SR 7.8** 假设你正在定义一个 `BankAccount` 类，其每个对象代表一个独立的银行账户。编写一个类变量声明，该变量将存储每个账户都必须维持的最低余额。\n\
  - **SR 7.9** 任何程序的 `main` 方法可以引用哪些类型的变量？为什么？\n\n### 7.4 类关系\n\n软件系统中的类之间存在各种类型的关系。三种最常见的关系是依赖（dependency）、聚合（aggregation）和继承（inheritance）。\n\
  \n我们在许多示例中都见过依赖关系，即其中一个类“使用”另一个类。本节将重新回顾依赖关系，并探索类依赖于自身的情况。然后我们探索聚合关系，在聚合中，一个类的对象包含另一个类的对象，创建了一种“拥有”（has-a）的关系。我们在第\
  \ 1 章中引入了继承，它在类之间创建了“是”（is-a）的关系。我们将继承的详细检查推到第 9 章。\n\n### 依赖\n\n在之前的许多示例中，我们见过一个类依赖于另一个类的概念。这意味着一个类在某种程度上依赖另一个类。通常，一个类的方法会调用另一个类的方法。这建立了一种“使用”的关系。\n\
  \n通常，如果类 `A` 使用类 `B`，那么类 `A` 的一个或多个方法会调用类 `B` 的一个或多个方法。如果调用的方法是 `static`，那么 `A`\
  \ 只通过名称引用 `B`。如果调用的方法不是 `static`，则 `A` 必须能够访问类 `B` 的特定实例才能调用该方法。也就是说，`A` 必须拥有指向类\
  \ `B`对象的引用。\n\n一个对象获取另一个对象访问权限的方式是一个重要的设计决策。当一个类实例化另一个类的对象时，通常是聚合关系的基础。访问也可以通过将一个对象作为参数传递给另一个对象来实现。通常而言，我们希望减少类之间的依赖关系。类之间的依赖程度越低，变化和错误对系统的影响就越小。\n\
  \n#### 同类对象之间的依赖\n\n在某些情况下，一个类依赖于自身。也就是说，一个类的对象与同类的另一个对象进行交互。为了实现这一点，类的一个方法可以接受同类的对象作为参数。这种设计强化了“类表示特定对象”的思想。\n\
  \n`String` 类的 `concat` 方法就是这种情况的例子。它通过一个 `String` 对象执行，并接收另一个 `String` 对象作为参数。例如：\n\
  \n`str3 = str1.concat(str2)`\n\n执行方法的 `String` 对象 (`str1`) 将其字符追加到作为参数的 `String`\
  \ 对象 (`str2`) 之后。返回一个新的 `String` 对象作为结果并存储在 `str3` 中。\n\n列表 7.3 所示所示 `RationalTester`\
  \ 程序展示了类似的情况。有理数可以是两个整数比例的值（分数）。`RationalTester` 程序创建了两个有理数的对象，然后对它们进行各种操作以产生新的有理数。\n\
  \n\n\n\n\n```java\nSystem.out.println(\"r1 and r2 are equal.\"); else\n\nSystem.out.println(\"\
  r1 and r2 are NOT equal.\"); r3 = r1.reciprocal();\nSystem.out.println(\"The reciprocal\
  \ of r1 is: \" + r3);\n```\n\n# 338\n## 第 7 章 面面向设计\n\n## 列表 7.3\n*继续*\n\n```java\n\
  r4 = r1.add(r2);\nr5 = r1.subtract(r2);\nr6 = r1.multiply(r2);\nr7 = r1.divide(r2);\n\
  \nSystem.out.println(\"r1 + r2: \" + r4);\nSystem.out.println(\"r1 - r2: \" + r5);\n\
  System.out.println(\"r1 * r2: \" + r6);\nSystem.out.println(\"r1 / r2: \" + r7);\n\
  \n}\n}\n```\n\n### 输出\n第一个有理数: 3/4\n第二个有理数: 1/3\nr1 and r2 are NOT equal.\nThe reciprocal\
  \ of r1 is: 4/3\nr1 + r2: 13/12\nr1 - r2: 5/12\nr1 * r2: 1/4\nr1 / r2: 9/4\n\n`RationalNumber`\
  \ 类如列表 7.4 所示。在检查此类时，请记住，从 `RationalNumber` 类创建的每个对象都代表一个单一的有理数。`RationalNumber`\
  \ 类包含了对有理数的各种操作，例如加法和减法。\n\n## 列表 7.4\n```java\n//********************************************************************\n\
  // RationalNumber.java 作者: Lewis/Loftus\n//\n// 表示一个带有分子和分母的有理数。\n//********************************************************************\n\
  public class RationalNumber\n{\n    private int numerator, denominator;\n```\n\n\
  # 7.4 类关系\n## 339\n## 列表 7.4\n*继续*\n```java\n//-----------------------------------------------------------------\n\
  // 构造函数：通过确保分母不为零且仅使分子带有符号来设置该有理数。\n//-----------------------------------------------------------------\n\
  public RationalNumber(int numer, int denom)\n{\n    if (denom == 0)\n        denom\
  \ = 1;\n    // 让分子“存储”符号\n    if (denom < 0)\n    {\n        numer = numer * -1;\n\
  \        denom = denom * -1;\n    }\n    numerator = numer;\n    denominator = denom;\n\
  \    reduce();\n}\n\n//-----------------------------------------------------------------\n\
  // 返回此有理数的分子。\n//-----------------------------------------------------------------\n\
  public int getNumerator()\n{\n    return numerator;\n}\n\n//-----------------------------------------------------------------\n\
  // 返回此有理数的分母。\n//-----------------------------------------------------------------\n\
  public int getDenominator()\n{\n    return denominator;\n}\n\n//-----------------------------------------------------------------\n\
  // 返回此有理数的倒数。\n//-----------------------------------------------------------------\n\
  public RationalNumber reciprocal()\n{\n    return new RationalNumber(denominator,\
  \ numerator);\n}\n```\n\n# 340\n## 第 7 章 面向设计\n## 列表 7.4\n*继续*\n```java\n//-----------------------------------------------------------------\n\
  // 将此有理数加到作为参数传递的有理数上\n\n// 公分母通过相乘分母找到。\n//-----------------------------------------------------------------\n\
  public RationalNumber add(RationalNumber op2)\n{\n    int commonDenominator = denominator\
  \ * op2.getDenominator();\n    int numerator1 = numerator * op2.getDenominator();\n\
  \    int numerator2 = op2.getNumerator() * denominator;\n    int sum = numerator1\
  \ + numerator2;\n    return new RationalNumber(sum, commonDenominator);\n}\n\n//-----------------------------------------------------------------\n\
  // 将作为参数传递的有理数从此\n// 有理数减去。\n//-----------------------------------------------------------------\n\
  public RationalNumber subtract(RationalNumber op2)\n{\n    int commonDenominator\
  \ = denominator * op2.getDenominator();\n    int numerator1 = numerator * op2.getDenominator();\n\
  \    int numerator2 = op2.getNumerator() * denominator;\n    int difference = numerator1\
  \ - numerator2;\n    return new RationalNumber(difference, commonDenominator);\n\
  }\n\n//-----------------------------------------------------------------\n// 将此有理数乘以作为参数\n\
  // 传递的有理数。\n//-----------------------------------------------------------------\n\
  public RationalNumber multiply(RationalNumber op2)\n{\n    int numer = numerator\
  \ * op2.getNumerator();\n    int denom = denominator * op2.getDenominator();\n \
  \   return new RationalNumber(numer, denom);\n}\n\n//-----------------------------------------------------------------\n\
  // 通过乘以第二个数的倒数\n// 将此有理数除以作为参数传递的有理数。\n//-----------------------------------------------------------------\n\
  public RationalNumber divide(RationalNumber op2)\n{\n    return multiply(op2.reciprocal());\n\
  }\n```\n\n# 7.4 类关系\n## 341\n## 列表 7.4\n*继续*\n```java\n//-----------------------------------------------------------------\n\
  // 判断此有理数是否与作为参数传递的\n// 有数相等。假设两者已约分。\n//-----------------------------------------------------------------\n\
  public boolean isLike(RationalNumber op2)\n{\n    return numerator == op2.getNumerator()\
  \ &&\n           denominator == op2.getDenominator();\n}\n\n//-----------------------------------------------------------------\n\
  // 将此有理数作为字符串返回。\n//-----------------------------------------------------------------\n\
  public String toString()\n{\n    String result;\n    if (numerator == 0)\n     \
  \   result = \"0\";\n    else if (denominator == 1)\n        result = numerator\
  \ + \"\";\n    else\n        result = numerator + \"/\" + denominator;\n    return\
  \ result;\n}\n\n//-----------------------------------------------------------------\n\
  // 通过将分子和分母除以它们的最大公约数来约此有理数。\n//-----------------------------------------------------------------\n\
  private void reduce()\n{\n    if (numerator != 0)\n    {\n        int common = gcd(Math.abs(numerator),\
  \ denominator);\n        numerator = numerator / common;\n        denominator =\
  \ denominator / common;\n    }\n}\n```\n\n![](img/index-343.png)\n\n# 342\n## 第\
  \ 7 章面向设计\n## 列表 7.4\n*继续*\n//-----------------------------------------------------------------\n\
  // 计算并返回两个正参数的最大公约数。\n// 使用欧几里得算法。\n//-----------------------------------------------------------------\n\
  private int gcd(int num1, int num2)\n{\n    while (num1 != num2)\n        if (num1\
  \ > num2)\n            num1 = num1 - num2;\n        else\n            num2 = num2\
  \ - num1;\n    return num1;\n}\n}\n```\n\n`RationalNumber` 类的方法（如 `add`、`subtract`、`multiply`\
  \ 和 `divide`）使用执行方法的 `RationalNumber` 对象作为第一个（左）操作数，并将作为参数传递的 `RationalNumber` 对象作为第二个（右）操作数。\n\
  \n`RationalNumber` 类的 `isLike` 方法用于判断两个有理数是否相等。因此很容易命名为 `equals`，类似于比较 `String`\
  \ 对象的方法（在第 5 章中讨论）。然而，在第 9 章中，我们将讨论由于继承 `equals` 方法非常特殊，以及它应该以特定的方式实现。为了避免混淆，我们现在将此方法命名为\
  \ `isLike`。\n\n注意 `RationalNumber` 类中的某些方法包括 `reduce` 和 `gcd` 被声明为 `private` 可见性。这些方法是私有的，因为我们不希望从\
  \ `RationalNumber` 对象外部直接执行它们。\n\n它们存在是为了支持该对象的其他服务。\n\n**聚合**\n\n某些对象是由其他对象组成的。例如，汽车是由它的发动机、底盘、轮子和许多部分组成的。这些**核心概念**每个部分都可以被视为独立的对象。因此，我们可以说汽车是一个*聚合*——它至少部分由其他对象组成，形成了一种“拥有”（has-a）关系。聚合有时被描述为一种*拥有关系*。\n\
  \n\n\n\n\n## 7.4 类关系\n\n例如，汽车有一个底盘。\n\n在软件世界中，我们将 `aggregate object`（聚合对象）定义为任何以实例数据形式包含其他对象引用的对象。例如，一个\
  \ `Account`（账户）对象包含一个代表账户所有者名字的 `String` 对象（此外）。我们有时会忘记字符串也是对象，但从技术上说，这使得每个 `Account`\
  \ 对象都是一个聚合对象。\n\n聚合（Aggregation）是一种特殊的依赖关系。也就是说，一个类部分是由另一个类定义的，它就依赖于该类。聚合对象的方法通常会调用构成该对象的对象的那些对象的方法。\n\
  \n让我们考虑另一个例子。列表 `7.5` 所示的程序 `StudentBody` 创建了两个 `Student` 对象。每个 `Student` 对象部分由两个\
  \ `Address` 对象组成，一个用于学生在学校的地址，另一个用于学生的家庭地址。`main` 方法所做的无非创建了 `Student` 对象并将它们打印出来。我们再次将对象传递给\
  \ `println` 方法，依靠自动调用 `toString` 方法来创建一个适用于打印的有效对象表示。\n\n列表 `7.6` 所示的 `Student`\
  \ 类代表单个学生。如果该类要代表学生的所有方面，它将必须大幅扩展。\n\n我们现在刻意保持其简单，以便清晰地展示对象聚合。`Student` 类的实例数据包括两个对\
  \ `Address` 对象的引用。在创建创建的字符串表示时，我们在 `toString` 方法中引用了这些对象。通过将一个 `Address` 对象连接到另一个字符串上，`Address`\
  \ 类中的 `toString` 方法会被自动调用。\n\n### 列表 7.5\n\n```java\n//********************************************************************\n\
  // StudentBody.java Author: Lewis/Loftus\n//\n// 展示了聚合类的使用。\n//********************************************************************\n\
  public class StudentBody\n{\n//-----------------------------------------------------------------\n\
  // 创建一些 Address 和 Student 对象并打印它们。\n//-----------------------------------------------------------------\n\
  public static void main(String[] args)\n{\nAddress school = new Address(\"800 Lancaster\
  \ Ave.\", \"Villanova\",\n\"PA\", 19085);\nAddress jHome = new Address(\"21 Jump\
  \ Street\", \"Blacksburg\",\n\"VA\", 24551);\n\nStudent john = new Student(\"John\"\
  , \"Smith\", jHome, school); \nAddress mHome = new Address(\"123 Main Street\",\
  \ \"Euclid\", \"OH\", 44132);\nStudent marsha = new Student(\"Marsha\", \"Jones\"\
  , mHome, school); \nSystem.out.println(john);\nSystem.out.println();\nSystem.out.println(marsha);\n\
  }\n}\n```\n\n**输出**\n```\nJohn Smith\nHome Address:\n21 Jump Street\nBlacksburg,\
  \ VA 24551\nSchool Address:\n800 Lancaster Ave.\nVillanova, PA 19085\nMarsha Jones\n\
  Home Address:\n123 Main Street\nEuclid, OH 44132\nSchool Address:\n800 Lancaster\
  \ Ave.\nVillanova, PA 19085\n```\n\n### 列表 7.6\n\n```java\n//********************************************************************\n\
  // Student.java Author: Lewis/Loftus\n//\n// 代表一个大学学生。\n//********************************************************************\n\
  public class Student\n{\nprivate String firstName, lastName;\nprivate Address homeAddress,\
  \ schoolAddress;\n\n//-----------------------------------------------------------------\n\
  // 构造函数：用指定的值设置此学生。\n//-----------------------------------------------------------------\n\
  public Student(String first, String last, Address home, Address school)\n{\nfirstName\
  \ = first;\nlastName = last;\nhomeAddress = home;\nschoolAddress = school;\n}\n\n\
  //-----------------------------------------------------------------\n// 返回此 Student\
  \ 对象的字符串描述。\n//-----------------------------------------------------------------\n\
  public String toString()\n{\nString result;\nresult = firstName + \" \" + lastName\
  \ + \"\\n\"; \nresult += \"Home Address:\\n\" + homeAddress + \"\\n\"; \nresult\
  \ += \"School Address:\\n\" + schoolAddress; \nreturn result;\n}\n}\n```\n\n`Address`\
  \ 类如列表 `7.7` 所示。它代表一个街道地址。注意，`Address` 类中没有任何地方表明它是 `Student` 对象的一部分。`Address` 类在设计上保持了通用性，因此可以被用于任何需要街道地址的情况。\n\
  \n### 列表 7.7\n\n```java\n//********************************************************************\n\
  // Address.java Author: Lewis/Loftus\n//\n// 代表一个街道地址。\n//********************************************************************\n\
  public class Address\n{\nprivate String streetAddress, city, state;\nprivate long\
  \ zipCode;\n\n//-----------------------------------------------------------------\n\
  // 构造函数：用指定的数据设置此地址。\n//-----------------------------------------------------------------\n\
  public Address(String street, String town, String st, long zip)\n{\nstreetAddress\
  \ = street;\ncity = town;\nstate = st;\nzipCode = zip;\n}\n\n//-----------------------------------------------------------------\n\
  // 返回此 Address 对象的描述。\n//-----------------------------------------------------------------\n\
  public String toString()\n{\nString result;\nresult = streetAddress + \"\\n\";\n\
  result += city + \", \" + state + \" \" + zipCode; \nreturn result;\n}\n}\n```\n\
  \n对象越复杂，越可能需要被表示为一个聚合对象。在 UML 中，聚合用两个类之间的连接来表示，在靠近聚合类的末端有一个空心菱形。图 7.2 显示了 `StudentBody`\
  \ 程序的 UML 类图。注意，在之前的 UML 图表示例和 7.2 中，字符串没有被表示为具有聚合关系的独立类，尽管从技术上讲它们是可以的。字符串对于编程来说是如此基础，以至于在\
  \ UML 图中通常被表示得像原始类型。\n\n### this 引用\n\n在我们离开类之间关系的话题之前，我们应该检查 Java 程序中使用的另一个特殊引用，称为\
  \ `this` 引用。`this` 单词是 Java 中的一个保留字。它允许对象引用自己。正如我们所讨论过的，非静态方法是通过（或由）特定对象被调用的。\n\n\
  图 7.2 显示显示聚合或类的 UML 类图。\n\n```\n**StudentBody**\n**Student**\nfirstName : String\n\
  lastName : String\nhomeAddress : Address\n+ main (args : String[]) : void\nschoolAddress\
  \ : Address\n+ toString() : String\n\n**Address**\nstreetAddress : String\ncity\
  \ : String\nstate : String\nzipCode : long\n+ toString() : String\n```\n\n在该方法内部，`this`\
  \ 引用可以指向当前正在执行的对象。例如，在一个名为 `ChessPiece` 的类中可能有一个名为 `move` 的方法，它可以包含以下行：\n\n```java\n\
  if (this.position == piece2.position)\nresult = false;\n```\n\n在这种情况下，`this` 引用被用来明确所引用的哪个位置。`this`\
  \ 引用指向调用方法的对象。因此，当使用以下行来调用方法时，`this` 引用指向 `bishop1`：\n\n```java\nbishop1.move();\n\
  ```\n\n然而，当使用另一个对象来调用方法时，`this` 引用指向该对象。因此，当使用以下调用时，`move` 方法中的 `this` 引用指向 `bishop2`：\n\
  \n```java\nbishop2.move();\n```\n\n\n\n\n\n通常，`this` 引用用于区分构造函数的参数与与其同名的实例变量。例如，第\
  \ 4 章中介绍的 `Account` 类的构造函数如下：\n\n```java\npublic Account(String owner, long account,\
  \ double initial)\n{\n    name = owner;\n    acctNumber = account;\n    balance\
  \ = initial;\n}\n```\n\n在编写该构造函数时，我们刻意为参数使用了不同的名称，以将其与实例变量 `name`、`acctNumber` 和\
  \ `balance` 区分开。这种区分是任意的。可以使用 `this` 引用将构造函数写如下：\n\n```java\npublic Account(String\
  \ name, long acctNumber, double balance)\n{\n    this.name = name;\n    this.acctNumber\
  \ = acctNumber;\n    this.balance = balance;\n}\n```\n\n在这个版本的构造函数中，`this` 特指对象的实例变量。赋值语句右侧的变量指的是形式参数。这种方法避免了寻找不同但等效名称的需要。这种情况有时出现在其他方法中，但在构造函数中经常出现。\n\
  \n### 自测题（答案见附录 N）\n- **SR 7.10** 描述两个类之间的依赖关系。\n- **SR 7.11** 解释类如何与自身产生关联。\n-\
  \ **SR 7.12** 什么是聚合对象？\n- **SR 7.13** `this` 引用指的是什么？\n\n## 7.5 接口 (Interfaces)\n\
  \n我们使用 `interface` 一词来指代我们用于与对象交互的公共方法集合。该定义与我们在本节中的用法一致，但现在我们将使用 Java 中一种特定的语言结构将这一概念形式化。\n\
  \n![](img/index-350_1.png)\n\n#### 列表 7.8\n```java\n//********************************************************************\n\
  // Complexity.java Author: Lewis/Loftus\n//\n// 表示一个可以被分配显式复杂\n// 对象的接口。\n//********************************************************************\n\
  public interface Complexity\n{\n    public void setComplexity(int complexity);\n\
  \    public int getComplexity();\n}\n```\n\nJava `interface` 是常量和抽象方法的集合。\n\n**核心概念**\n\
  `abstract method`（抽象方法）是不具有实现的方法。也就是说，抽象方法没有定义代码体。方法的头部（包括其参数列表）后面仅跟一个分号。`interface`\
  \ 无法被实例化。\n\n列表 7.8 显示了一个名为 `Complexity` 的接口。它包含两个抽象方法：`setComplexity` 和 `getComplexity`。\n\
  \n抽象方法可以可以带有保留关键字 `abstract`，尽管在接口中通常不需要。接口中的方法默认具有 `public` 可见性。\n\n类通过为接口中定义的每个抽象方法提供方法实现，来\
  \ `implements`（实现）一个 `interface`。实现接口的类在类头部使用关键字 `implements` 后跟接口名称。如果一个类断言它实现了某个特定接口，则它必须为接口中的所有方法提供定义。如果接口中的任何方法没有在类中给出定义，编译器将产生错误。\n\
  \n列表 7.9 所示的 `Question` 类实现了 `Complexity` 接口。`setComplexity` 和 `getComplexity` 方法都得到了实现。它们的声明签名必须与接口中对应的抽象方法相同。在\
  \ `Question` 类中，这些方法的定义仅是为了设置或返回一个数值，该数值代表对象所代表的问题的复杂度水平。\n\n注意 `Question` 类还实现了不属于\
  \ `Complexity` 接口的其他方法。具体来说，它定义了名为 `getQuestion`、`getAnswer`、`answerCorrect` 和 `toString`\
  \ 的方法，这些方法与接口无关。接口保证类实现了某些方法，但并没有限制它拥有额外的方法。\n\n#### 列表 7.9\n```java\n//********************************************************************\n\
  // Question.java Author: Lewis/Loftus\n//\n// 表示一个问题（及其答案）。\n//********************************************************************\n\
  public class Question implements Complexity\n{\n    private String question, answer;\n\
  \    private int complexityLevel;\n\n    //-----------------------------------------------------------------\n\
  \    // 构造函数：使用默认复杂度设置问题。\n    //-----------------------------------------------------------------\n\
  \    public Question(String query, String result)\n    {\n        question = query;\n\
  \        answer = result;\n        complexityLevel = 1;\n    }\n\n    //-----------------------------------------------------------------\n\
  \    // 设置此问题的复杂度水平。\n    //-----------------------------------------------------------------\n\
  \    public void setComplexity(int level)\n    {\n        complexityLevel = level;\n\
  \    }\n\n    //-----------------------------------------------------------------\n\
  \    // 返回此问题的复杂度水平。\n    //-----------------------------------------------------------------\n\
  \    public int getComplexity()\n    {\n        return complexityLevel;\n    }\n\
  \n    //-----------------------------------------------------------------\n    //\
  \ 返回问题。\n    //-----------------------------------------------------------------\n\
  \    public String getQuestion()\n    {\n        return question;\n    }\n\n   \
  \ //-----------------------------------------------------------------\n    // 返回此问题的答案。\n\
  \    //-----------------------------------------------------------------\n    public\
  \ String getAnswer()\n    {\n        return answer;\n    }\n\n    //-----------------------------------------------------------------\n\
  \    // 如果候选答案与答案匹配，则返回 true。\n    //-----------------------------------------------------------------\n\
  \    public boolean answerCorrect(String candidateAnswer)\n    {\n        return\
  \ answer.equals(candidateAnswer);\n    }\n\n    //-----------------------------------------------------------------\n\
  \    // 以字符串形式返回此问题（及其答案）。\n    //-----------------------------------------------------------------\n\
  \    public String toString()\n    {\n        return question + \"\\n\" + answer;\n\
  \    }\n}\n```\n\n实现接口的类拥有其他方法是常见的。列表 7.10 显示了一个名为 `MiniQuiz` 的程序，它使用了一些 `Question`\
  \ 对象。\n\n接口及其与实现它的类的关系可以在 UML 类图中表示。接口的表示方法与类节点相似，但在接口名称上方插入了 `<<interface>>` 标记。一条带有实心箭头的虚线从类指向它实现的接口。图\
  \ 7.3 显示了 `MiniQuiz` 程序的 UML 类图。\n\n多个类可以实现同一个接口，为方法提供替代性定义。例如，我们可以实现一个名为 `Task`\
  \ 的类，它也实现了 `Complexity` 接口。在类中，我们可以选择以不同的方式管理任务的复杂度（尽管它仍然必须实现所有方法）。\n\n一个类可以实现多个接口。在这种情况下，该类必须为列出的所有接口中的所有方法提供实现。为了演示这一点\n\
  \n#### 列表 7.10\n```java\n//********************************************************************\n\
  // MiniQuiz.java Author: Lewis/Loftus\n//\n// 展示实现接口的类的用法。\n//********************************************************************\n\
  import java.util.Scanner;\n\npublic class MiniQuiz\n{\n```\n\n\n\n\n```java\n//-----------------------------------------------------------------\n\
  \n// Presents a short quiz.\n\n//-----------------------------------------------------------------\n\
  \npublic static void main(String[] args)\n{\n    Question q1, q2;\n    String possible;\n\
  \    Scanner scan = new Scanner(System.in);\n\n    q1 = new Question(\"What is the\
  \ capital of Jamaica?\",\n    \"Kingston\");\n    q1.setComplexity(4);\n\n    q2\
  \ = new Question(\"Which is worse, ignorance or apathy?\",\n    \"I don't know and\
  \ I don't care\");\n    q2.setComplexity(10);\n\n    System.out.print(q1.getQuestion());\n\
  \    System.out.println(\" (Level: \" + q1.getComplexity() + \")\");\n    possible\
  \ = scan.nextLine();\n\n    if (q1.answerCorrect(possible))\n        System.out.println(\"\
  Correct\");\n    else\n        System.out.println(\"No, the answer is \" + q1.getAnswer());\n\
  \    System.out.println();\n\n    System.out.print(q2.getQuestion());\n    System.out.println(\"\
  \ (Level: \" + q2.getComplexity() + \")\");\n    possible = scan.nextLine();\n\n\
  \    if (q2.answerCorrect(possible))\n        System.out.println(\"Correct\");\n\
  \    else\n        System.out.println(\"No, the answer is \" + q2.getAnswer());\n\
  }\n}\n```\n\n### output\n牙买加的首都是是什么？（等级: 4）\n金斯顿\n正确\n无知还是冷漠更糟糕？（等级: 10）\n冷漠\n不，答案是：我也不知道也不乎\n\
  \n### 接口 (Interfaces)\n一个类可以实现多个接口，这些接口在 `implements` 子句中列出，并用逗号分隔。例如：\n\n```java\n\
  class ManyThings implements Interface1, Interface2, Interface3\n{\n    // 包含所有接口的方法\n\
  }\n```\n\n除了或或代替抽象方法，接口还可以包含常量，这些常量使用 `final` 修饰符定义。当一个类实现一个接口时，它就可以访问接口中定义的所有常量。\n\
  \n接口结构从形式上定义了我们与类交互的方式。它还作为一种名为“多态性”的强大编程技术的基础，我们将在第 10 章中讨论这种技术。\n\n### Comparable\
  \ 接口\nJava 标准类库包含了接口也包含了类。例如，`Comparable` 接口定义在 `java.lang` 包中。`Comparable` 接口只包含一个方法\
  \ `compareTo`，它接受一个对象作为参数并返回一个整数。\n\n该接口的意图是提供一种比较对象与其他对象的通用机制。一个对象调用该方法并将另一个对象作为参数传递如下：\n\
  \n```java\nif (obj1.compareTo(obj2) < 0)\n    System.out.println(\"obj1 is less\
  \ than obj2\");\n```\n\n**第 7 章 面对象设计**\n\n**图 7.3** `MiniQuiz` 程序的 UML 类图。根据接口文档的规定，如果\
  \ `obj1` 小于 `obj2`，则 `compareTo` 方法返回的整数应该是负数；如果它们相等则为 0；如果 `obj1` 大于 `obj2` 则为正数。每个类的设计者负责决定该类的一个对象小于、等于或大于另一个对象意味着什么。\n\
  \n在第 5 章中，我们提到 `String` 类包含一个以这种方式运行的 `compareTo` 方法。现在我们可以明确，`String` 类之所以拥有此方法是因为它实现了\
  \ `Comparable` 接口。`String` 类对该方法的实现是基于 Unicode 字符集定义的字典顺序进行比较的。\n\n### Iterator\
  \ 接口\n`Iterator` 接口是另一个作为 Java 标准类库一部分定义的接口。它被表示对象集合类使用，提供了一种一次移动一个对象遍历集合的方法。\n\n\
  #### 复习枚举类型 (Enumerated Types)\n在第 5 章中，我们定义了迭代器的概念，使用循环处理集合中的所有元素。大多数迭代器（包括 `Scanner`\
  \ 类的对象）都是使用 `Iterator` 接口定义的。\n\n`Iterator` 接口中的两个主要方法是返回布尔结果的 `hasNext` 和返回一个对象的\
  \ `next`。这两个方法都不接受任何参数。如果还有剩余项目待处理，`hasNext` 返回 `true`，`next` 返回下一个对象。实现 `Iterator`\
  \ 接口的类设计者负责决定 `next` 方法交付对象的顺序。\n\n我们应该注意到，根据接口的精神，`next` 方法不会从底层集合中移除对象；它只是返回该对象的引用。`Iterator`\
  \ 接口还有一个名为 `remove` 的方法，它不接受参数且返回类型为 `void`。调用 `remove` 方法会从底层集合中移除最近由 `next` 方法返回的对象。\n\
  \n#### 自测复习题\n- **SR 7.14** 类和接口之间的区别是什么？\n- **SR 7.15** 定义一个名为 `Nameable` 的 Java\
  \ 接口。实现此接口的类必须提供一个 `setName` 方法，该方法需要单个 `String` 参数且没有返回值，以及一个没有参数且返回 `String` 的\
  \ `getName` 方法。\n- **SR 7.16 判断对对错？**\n    - a. 接口可以只包含抽象方法。\n    - b. 抽象方法是不具有实现的方法。\n\
  \    - c. Java 接口定义中的所有方法都必须是抽象的。\n    - d. 实现接口的类只能定义接口中包含的方法。\n    - e. 多个类可以实现同一个接口。\n\
  \    - f. 一个类可以实现多个接口。\n    - g. 所有实现接口的类必须为接口中包含的方法提供完全相同的定义。\n\n\n\n\n\n## 7.6\
  \ 复习枚举类型\n\n```java\nenum Season\n{\n    winter (\"December through February\"),\n\
  \    spring (\"March through May\"),\n    summer (\"June through August\"),\n  \
  \  fall (\"September through November\");\n\n    private String span;\n\n    //-----------------------------------------------------------------\n\
  \    // 构造函数：为每个值设置关联的字符串。\n    //-----------------------------------------------------------------\n\
  \    Season(String months)\n    {\n        span = months;\n    }\n\n    //-----------------------------------------------------------------\n\
  \    // 返回此值的跨度消息。\n    //-----------------------------------------------------------------\n\
  \    public String getSpan()\n    {\n        return span;\n    }\n}\n```\n\n`SeasonTester`\
  \ 类的 `main` 方法打印了 `Season` 枚举类型的每个值，以及每个值的跨度语句。每个枚举类型都包含一个名为 `values` 的静态方法，该方法返回该类型所有可能值的列表。该列表是一个迭代器，因此我们可以使用增强型的\
  \ `for` 循环来处理每个值。\n\n**列表 7.12**\n\n```java\n//********************************************************************\n\
  // SeasonTester.java Author: Lewis/Loftus\n//\n// 演示完整枚举类型的用法。\n//********************************************************************\n\
  public class SeasonTester\n{\n    //-----------------------------------------------------------------\n\
  \    // 遍历 Season 枚举类型的值。\n    //-----------------------------------------------------------------\n\
  \    public static void main(String[] args)\n    {\n        ![](img/index-359_1.png)\n\
  \        ![](img/index-359_2.png)\n\n        for (Season time : Season.values())\n\
  \        {\n            System.out.println(time + \"\\t\" + time.getSpan());\n \
  \       }\n    }\n}\n```\n\n**输出**\n```\nwinter December through February\nspring\
  \ March through May\nsummer June through August\nfall September through November\n\
  ```\n\n**核心概念**\n除了每个枚举类型中定义的可能值列表外，我们还可以在定义枚举类型时包含任何根据我们需要选择的任意数量的属性或方法。这为创新的类设计提供了各种机会。\n\
  \n**自测题**（答案见附录 N）\nSR 7.17 使用本节定义的枚举类型 `Season`，以下代码序列的输出是什么？\n\n```java\nSeason\
  \ time1, time2;\ntime1 = Season.winter;\ntime2 = Season.summer;\nSystem.out.println(time1);\n\
  System.out.println(time2.name());\nSystem.out.println(time1.ordinal());\nSystem.out.println(time2.getSpan());\n\
  ```\n\n## 7.7 方法设计\n\n一旦你确定了类并分配了基本职责，每个方法的设计将决定该类具体如何定义其行为。有些方法是直观的，不需要过多思考；另一些则更有趣，需要仔细的规划。\n\
  \n`algorithm`（算法）是解决问题的逐步过程。食谱就是算法的示例。旅行路线也是算法的一个例子。每个方法都实现了一个决定该方法如何实现其目标的算法。\n\
  \n![](img/index-360_1.png)\n\n算法通常使用 `pseudocode`（伪代码）来描述，它是代码语句和英语短语的混合。伪代码提供了足够的结构来展示代码将如何运行，而不会陷入特定编程语言的语法细节中，也不会过早地受到特定编程结构特征的限制。\n\
  \n本节讨论了方法层面程序设计的两个重要方面：方法分解和将对象作为参数传递的影响。\n\n#### 方法分解\n\n有时，对象提供的服务非常复杂，以至于无法通过一个方法合理实现。因此，我们有时需要将一个方法分解为多个方法，以创建一个更易理解的设计。例如，让我们检查一个将英语句子翻译成皮丁语（Pig\
  \ Latin）的程序中对私有辅助方法的用法。\n\n皮丁语是一种虚构语言，句子中的每个单词通常通过将单词的初始音素移动到末尾并添加“ay”音来修改。例如，单词\
  \ *happy* 将被写成并读作 *appyhay*，单词 *birthday* 将变成 *irthdaybay*。以元音开头的单词只需在末尾加上“yay”音，将单词\
  \ *enough* 变成 *enoughyay*。单词开头的“ch”和“st”等辅音字母组合在添加“ay”音之前一起移动到末尾。因此，单词 *grapefruit*\
  \ 变成 *apefruitgray*。\n\n列表 7.13 显示的 PigLatin 程序读取一个或多个句子，并将每个句子翻译成皮丁语。PigLatin 程序背后的核心部分是列表\
  \ 7.14 显示的 `PigLatinTranslator` 类。`PigLatinTranslator` 类提供了一个基本服务：一个名为 `translate`\
  \ 的静态方法，它接受一个字符串将其翻译成皮丁语。注意，`PigLatinTranslator` 类不包含构造函数，因为它不需要。\n\n**列表 7.13**\n\
  \n```java\n//********************************************************************\n\
  // PigLatin.java Author: Lewis/Loftus\n//\n// 演示方法分解的概念。\n//********************************************************************\n\
  import java.util.Scanner;\n\npublic class PigLatin\n{\n    //-----------------------------------------------------------------\n\
  \    // 读取句子并将其翻译成皮丁语。\n    //-----------------------------------------------------------------\n\
  \    public static void main(String[] args)\n    {\n        String sentence, result,\
  \ another;\n        Scanner scan = new Scanner(System.in);\n        do\n       \
  \ {\n            System.out.println();\n            System.out.println(\"Enter a\
  \ sentence (no punctuation):\");\n            sentence = scan.nextLine();\n    \
  \        System.out.println();\n            result = PigLatinTranslator.translate(sentence);\n\
  \            System.out.println(\"That sentence in Pig Latin is:\");\n         \
  \   System.out.println(result);\n            System.out.println();\n           \
  \ System.out.print(\"Translate another sentence (y/n)? \");\n            another\
  \ = scan.nextLine();\n        } while (another.equalsIgnoreCase(\"y\"));\n    }\n\
  }\n```\n\n**输出**\n```\nEnter a sentence (no punctuation):\nDo you speak Pig Latin\n\
  That sentence in Pig Latin is:\noday ouyay eakspay igpay atinlay\nTranslate another\
  \ sentence (y/n)? y\nEnter a sentence (no punctuation):\nPlay it again Sam\nThat\
  \ sentence in Pig Latin is:\nayplay ityay againyay amsay\nTranslate another sentence\
  \ (y/n)? n\n```\n\n**列表 7.14**\n\n```java\n//********************************************************************\n\
  // PigLatinTranslator.java Author: Lewis/Loftus\n//\n// 代表从英语到皮丁语的翻译器。演示\n//方法分解。\n\
  //********************************************************************\nimport java.util.Scanner;\n\
  \npublic class PigLatinTranslator\n{\n    //-----------------------------------------------------------------\n\
  \    // 将单词句子翻译成皮丁语。\n    //-----------------------------------------------------------------\n\
  \    public static String translate(String sentence)\n    {\n        String result\
  \ = \"\";\n        sentence = sentence.toLowerCase();\n        Scanner scan = new\
  \ Scanner(sentence);\n        while (scan.hasNext())\n        {\n            result\
  \ += translateWord(scan.next());\n            result += \" \";\n        }\n    \
  \    return result;\n    }\n\n    //-----------------------------------------------------------------\n\
  \    // 将一个单词翻译成皮丁语。如果单词以元音开头，\n    // 则在单词末尾加上“yay”。否则，\n    // 将第一个或两个字母移动到单词末尾，\n\
  ```\n\n\n\n\n\n```java\n// 并且追加 \"ay\"。\n\nprivate static String translateWord(String\
  \ word)\n{\n    String result = \"\";\n    if (beginsWithVowel(word))\n        result\
  \ = word + \"yay\";\n    else\n        if (beginsWithBlend(word))\n            result\
  \ = word.substring(2) + word.substring(0,2) + \"ay\";\n        else\n          \
  \  result = word.substring(1) + word.charAt(0) + \"ay\";\n    return result;\n}\n\
  \n//-----------------------------------------------------------------\n// 确定指定的单词是否以元音开头。\n\
  //-----------------------------------------------------------------\nprivate static\
  \ boolean beginsWithVowel(String word)\n{\n    String vowels = \"aeiou\";\n    char\
  \ letter = word.charAt(0);\n    return (vowels.indexOf(letter) != -1);\n}\n\n//-----------------------------------------------------------------\n\
  // 确定指定的单词是否以特定的\n// 双字母辅音组合开头。\n//-----------------------------------------------------------------\n\
  private static boolean beginsWithBlend(String word)\n{\n    return ( word.startsWith(\"\
  bl\") || word.startsWith(\"sc\") ||\n    word.startsWith(\"br\") || word.startsWith(\"\
  sh\") ||\n    word.startsWith(\"ch\") || word.startsWith(\"sk\") ||\n    word.startsWith(\"\
  cl\") || word.startsWith(\"sl\") ||\n    word.startsWith(\"cr\") || word.startsWith(\"\
  sn\") ||\n    word.startsWith(\"dr\") || word.startsWith(\"sm\") ||\n    word.startsWith(\"\
  dw\") || word.startsWith(\"sp\") ||\n    word.startsWith(\"fl\") || word.startsWith(\"\
  sq\") ||\n    word.startsWith(\"fr\") || word.startsWith(\"st\") ||\n    word.startsWith(\"\
  gl\") || word.startsWith(\"sw\") ||\n    word.startsWith(\"gr\") || word.startsWith(\"\
  th\") ||\n    word.startsWith(\"kl\") || word.startsWith(\"tr\") ||\n    word.startsWith(\"\
  ph\") || word.startsWith(\"tw\") ||\n    word.startsWith(\"pl\") || word.startsWith(\"\
  wh\") ||\n    word.startsWith(\"pr\") || word.startsWith(\"wr\") );\n}\n```\n\n\
  ## 7.7 方法设计\n\n将整个句子翻译成皮格语（Pig Latin）并非易事。如果写在一个大方法中，它将变得非常长且难以理解。更好的解决方案正如在 `PigLatinTranslator`\
  \ 类中所实现的那样，分解 `translate` 方法并使用其他几个辅助方法来帮助完成这项任务。\n\n`translate` 方法使用 `Scanner`\
  \ 对象将字符串拆分为单词。\n\n回想 `Scanner` 类（在第 3 章中讨论过）的作用之一是将字符串拆分为称为令牌（tokens）的较小元素。在这种情况下，令牌是通过空格字符分隔的，因此我们可以使用默认的空白分隔符。皮格语程序假设输入中不包含标点符号。\n\
  \n`translate` 方法将每个单词传递给私有辅助方法 `translateWord`。即使是翻译一个单词的工作也有些复杂，因此 `translateWord`\
  \ 方法利用了另外两个私有方法：`beginsWithVowel` 和 `beginsWithBlend`。\n\n`beginsWithVowel` 方法返回一个布尔值，指示作为参数传递的单词是否以元音开头。注意，该方法的代码并没有单独检查每个元音，而是声明了一个包含所有元音的字符串，然后调用\
  \ `String` 的方法 `indexOf` 来判断单词的第一个字符是否在元音字符串中。如果找不到指定的字符，`indexOf` 方法将返回值 21。\n\n\
  `beginsWithBlend` 方法也返回一个布尔值。该方法体只包含一个带有大型表达式的语句，该表达式对 `String` 类的 `startsWith`\
  \ 方法进行了多次调用。如果其中任何调用返回 true，那么 `beginsWithBlend` 方法也会返回 true。\n\n注意，`translateWord`、`beginsWithVowel`\
  \ 和 `beginsWithBlend` 方法都声明为 `private` 可见性。它们的目的不是直接为类外部的客户端提供服务。相反，它们的存在是为了帮助 `translate`\
  \ 方法（该方法是类中唯一的真正的服务方法）完成它的工作。通过将它们声明为 `private` 可见性，无法从类外部调用它们。例如，如果 `PigLatin`\
  \ 类的 `main` 方法尝试调用 `translateWord` 方法，编译器将发出错误信息。\n\n图 7.4 显示了皮格语程序的 UML 类图。注意显示各种方法可见性的符号。\n\
  \n每当一个方法变得庞大或复杂时，我们应该考虑将其分解为多个方法，以创建一个更易理解的类设计。然而，首先我们必须考虑如何定义其他类和对象以创建更好的整体系统设计。在面向对象的设计中，方法分解必须从于对象分解。\n\
