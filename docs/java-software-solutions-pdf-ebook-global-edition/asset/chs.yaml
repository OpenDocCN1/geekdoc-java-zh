  \ 中抛出。`level2` 中的新代码没有执行。\n\n## 11.5 异常类层次结构\n\n### SR 11.10 检查异常（checked exception）是指必须被\
  \ (1) 捕获并处理或 (2) 在任何可能抛出或传播它的方法的 `throws` 子句中列出的异常。这建立了一组必须在程序以某种方式被正式确认的异常。\n\n\
  未检查异常（unchecked exceptions）可以根据需要在代码中完全忽略。\n\n### SR 11.11 a. 正确 – 它继承自 `RunException`，而该类又继承自\
  \ `Exception`。\n\nb. 正确 – 它通过 `RunException` 和 `Exception` 继承自 `Throwable`。\n\n\
  c. 错误 – 它继承自 `RunException`，所以它是未检查的。\n\nd. 正确 – 它没有继承自 `RunException`。\n\ne. 正确\
  \ – 例如参见本节定义的 `OutOfRangeException`。\n\nf. 错误 – `ArithmeticException` 是未检查异常。\n\n\
