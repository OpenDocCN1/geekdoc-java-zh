  \ 布局管理器\n\n**387**\n\n### 显示\n\n默认情况下，网格单元格之间没有水平间隙或垂直间隙。这些间隙大小可以使用重载的构造函数或相应的 `GridLayout`\
  \ 方法设置。\n\n## 盒布局 (box layout)\n\n`box layout` 以垂直或水平方向组织组件，以单行或单列的形式，如图 7.10 所示。它很容易使用，但当与其他盒布局结合时，它可以产生类似于通过\
  \ `GridBagLayout` 实现的复杂 GUI 设计，而通常 `GridBagLayout` 要要难掌握得多。\n\n在创建 `BoxLayout` 对象时，我们指定它将遵循\
  \ `X` 轴（水平）或 `Y` 轴（垂直），使用 `BoxLayout` 类中定义的常量。与其他布局管理器不同，`BoxLayout` 的构造函数其参数为\n\
  \n组件\n1\n组件\n2\n组件\n组件\n1\n2\n组件 3\n组件 3\n\n**图 7.10** 盒布局以垂直或水平方向组织组件。\n\n\n\n\n\
  该组件第一个参数是它将管理的组件。因此，必须为每个组件创建一个新的 `BoxLayout` 对象。列表 7.23 显示了 `LayoutDemo` 程序用于演示箱布局的面板。\n\
  \n由箱形布局（box layout）管理的容器中的组件是按照它们被添加到容器的顺序（从上到下或从左到右）排列的。\n\n箱布局中的组件之间没有间隙。与我们之前探索过的布局管理器不同，箱形布局没有可以为整个容器指定的特定垂直或水平间隙。相反，我们可以向容器中添加`不可见组件`，它们占据其他组件之间的空间。`Box`\
  \ 类也是 Java 标准类库的一部分，它包含了用于创建这些不可见组件的静态方法。\n\n`BoxPanel` 类中使用的两种不可见组件是`刚性区域（rigid\
  \ areas）`（具有固定大小）和`胶水（glue）`，后者指定了容器中多余空间的去向。刚性区域使用 `Box` 类的 `createRigidArea` 方法创建，并接受\
  \ `Dimension` 对象作为参数来定义不可见区域的大小。胶水则根据需要使用 `createHorizontalGlue` 方法或 `createVerticalGlue`\
  \ 方法创建。\n\n注意，在我们的示例中，由刚性区域分隔的按钮之间的空间在容器调整大小时仍然保持不变。另一方面，胶水会根据需要扩展或收缩以填满空间。\n\n\
  箱布局——比大多数其他布局管理器更尊重它所管理的组件的对齐方式以及最小、最大和首选尺寸。因此，设置放入容器的组件的特性是定制视觉效果的另一种方法。\n\n###\
  \ 7.11 布局管理器\n\n**389**\n\n**listing 7.23**\n\n```java\n//********************************************************************\n\
