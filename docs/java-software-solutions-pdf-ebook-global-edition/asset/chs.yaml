  \n*本页特意留。*\n\n# Java 运算符\n\nJava 运算符根据图 D.1 所示的优先级层次进行求值。低优先级运算符在高优先级运算符之前求值。同一优先级的运算符根据指定的结合性（从右到左\
  \ R to L 或从左到右 L to R）进行求值。\n\n相同优先级的运算符没有按照特定顺序列出。\n\n始终可以通过括号强制规定运算符的求值顺序。即使在不需要时使用括号通常也是一个好主意，这可以向人类阅读者明确地说明表达式是如何求值的。\n\
  \n对于某些运算符，操作数的类型决定了执行什么操作。例如，如果在两个字符串上使用 `+` 运算符，则执行字符串拼接；但如果将其应用于两个数值类型，则在算术意义上进行相加。如果操作数中只有一个是字符串，另一个将转换为字符串并执行字符串拼接。同样，运算符\
  \ `&`、`^` 和 `|` 对数值型操作数执行位运算，而对布尔型操作数执行布尔逻辑运算。\n\n布尔运算符 `&` 和 `|` 与逻辑运算符 `&&` 和\
  \ `||` 有细微的区别。逻辑运算符具有“短路”特性，即如果表达式的结果可以通过求值左侧操作数来确定，则右侧操作数就不会被求值。布尔版本总是求值表达式的两个边。没有执行执行异或（XOR）操作的逻辑运算符。\n\
  \n## Java 位运算符\n\nJava 位运算符在原始类型值内部的单个位上进行操作。它们仅针对整数（integer）和字符（character）定义。它们在所有\
  \ Java 运算符中是独一无的，因为它们让我们能够在二进制存储的最底层进行工作。图 D.2 列出了 Java 位运算符。\n\n三个位运算符与逻辑运算符 `!`、`&&`\
  \ 和 `||` 相似。位非、位与、位或操作的工作原理与其逻辑对应基本相同，区别在于它们作用于值的每一个位。\n\n# 附录 d Java 运算符\n\n###\
