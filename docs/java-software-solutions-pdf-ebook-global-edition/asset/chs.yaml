  \ `Timer` 类来控制秒表的计时。\n\n# 第 9 章 继承\n\n## 软件故障：Ariane 5 501 号飞行\n\n### 发生了什么事？\n\
  Ariane 5 是由欧洲空间局 (ESA) 设计的废弃式发射系统，用于将载荷送入地球轨道。1996 年 6 月 4 日，该火箭的首次飞行（`Flight 501`）在起飞\
  \ 37 秒后发生爆炸。控制系统发生故障，导致火箭偏离轨道。强大的空气动力学力导致火箭主体破碎。机载监控器检测到破碎并启动自动销毁系统以在空中销毁飞行器。\n\n\
  `Flight 501` 携带了四个无人探测器，用于研究地球磁场。火箭的爆炸导致载荷完全损失，估计损失金额为 3.7 亿美元。\n\n*注：Ariane 5 火箭的首次飞行在起飞后不久爆炸。*\n\
  \n### 原因是什么？\nAriane 5 火箭重用了部分用于控制其前身 Ariane 4 的软件。该软件包含一个将浮点数转换为符号 16 位整数的段。在 `Flight\
  \ 501` 上，此值超出了 16 位整数能表示的范围，导致溢出错误。在 Ariane 4 中，转换后的值始终小到可以避免这种情况。溢出错误本应由异常处理器捕获，但该部分系统出于效率考虑被禁用。错误在主计算机和备份计算机中几乎同时发生，导致它们关闭。这导致火箭偏离轨道并被毁。\n\
  \n### 吸取的教训\nAriane 4 的成功让 Ariane 5 的设计者对软件充满信心。因此，对系统的某些部分只进行了极少测试。潜在问题在之前的系统中一直存在，但数据（代表测量值）总是很小。新系统的变化参数没有被考虑在内。因此，虽然根源是软件漏洞，但失败源于系统及其环境的变化。这是设计和测试的失败——不仅仅是软件漏洞。\n\
  \n\n\n\n\n本章讨论了多态，这是面向对象软件另一个基本原理。我们首先探讨了绑定（binding）的概念，并讨论了它与多态的关系。然后我们研究了如何使用继承或接口来实现多态引用。探讨了与多态有关的设计问题。本章的图形章节讨论了图形用户界面中的事件处理是如何多态的一个示例。我们还检查了几个新的\
  \ GUI 组件。\n\n# 第 10 章 多态\n\n## 10.1 晚绑定\n\n通常，引用变量的类型与其所引用的对象的类完全匹配。例如，考虑以下引用：`ChessPiece\
  \ bishop;`\n\n`bishop` 变量可以指向一个通过实例化 `ChessPiece` 类而创建的对象。然而，并非必须如此。变量类型与其所引用的对象必须兼容，但它们的类型不需要完全相同。引用变量与其所引用的对象之间的关系比这更灵活。\n\
  \n`polymorphism`（多态）一词可以定义为“具有多种形式”。\n\n### 核心概念\n`polymorphic reference`（多态引用）是指在不同时间可以引用不同类型对象的引用变量。通过多态引用调用的方法可以在当前调用和下一次调用之间发生变化。\n\
  \n考虑以下代码行：\n\n```\nobj.doIt();\n```\n\n如果引用 `obj` 是多态的，它可以在不同的时间引用不同类型的对象。因此，如果该行代码在一个循环中，或者它在一个被调用多次的方法中，那么该行代码每次被调用时都可能调用\
  \ `doIt` 方法的不同版本。\n\n在某个点，会做出执行某些代码以执行方法调用的承诺。这种承诺被称为将方法调用 `binding`（绑定）到方法定义上。在许多情况下，方法调用到方法定义的绑定可以在编译时发生。然而，对于多态引用，该决策直到运行时才能做出。所使用的方法定义是基于引用变量此时所引用的对象的。这种延迟的承诺被称为\
  \ `late binding`（晚绑定）或 `dynamic binding`（动态绑定）。它比编译时绑定效率低，因为必须在程序执行期间做出决定。考虑到多态引用提供的灵活性，这种开销通常是可以接受的。\n\
  \n我们可以在 Java 中通过两种方式创建多态引用：使用继承和使用接口。让我们逐一查看。\n\n## 10.2 通过继承实现的多态\n\n### 自测题（答案见附录\
  \ N）\n- SR 10.1 什么是多态？\n- SR 10.2 为什么编译时绑定被认为比动态绑定高效？\n\n当我们使用特定的类名声明引用变量时，它可以被用于引用该类的任何对象。此外，它还可以引用任何与其声明类型通过继承关系相关的任何类的任何对象。例如，如果\
  \ `Mammal` 类是 `Horse` 类的父类，那么 `Mammal` 引用就可以用来引用 `Horse` 类的任何对象。这种能力在下面的代码段中得到了：\n\
  \n### 核心概念\n引用变量可以引用从与其通过继承关系相关的任何类创建的任何对象。\n\n```\nMammal pet;\nHorse secretariat\
  \ = new Horse();\npet = secretariat; // 一个有效的赋值\n```\n\n反向操作，将 `Mammal` 对象赋值给 `Horse`\
  \ 引用也可以完成，但它需要显式的强制转换。在这个方向上赋值通常用处较小，并且更有可能引起问题，因为虽然马具有哺乳动物的所有功能（因为马*是一个*哺乳动物），但反之则一定成立。\n\
  \n这种关系贯穿整个类层次结构。如果 `Mammal` 类派生自一个名为 `Animal` 的类，那么下面的赋值也是有效的：\n\n```\nAnimal creature\
  \ = new Horse();\n```\n\n将此推向极限，`Object` 引用可以用来引用任何对象，因为所有类最终都是 `Object` 类的后代。例如，`ArrayList`\
  \ 使用了多态，因为它被设计为持有 `Object` 引用。这就是为什么一个没有指定元素类型的 `ArrayList` 可以用来存储任何类型的对象。事实上，一个特定的\
  \ `ArrayList` 可以同时持有几种不同类型的对象，因为根据继承，它们都是 `Object` 对象。\n\n### 核心概念\n引用变量 `creature`\
  \ 可以是多态的，因为在任何时间点，它都可以引用 `Animal` 对象、`Mammal` 对象或 `Horse` 对象。是对象的类型而不是引用的类型被用来决定调用哪个版本的方法。假设这这三个类都拥有一个名为\
  \ `move` 的方法，并且该方法以不同的方式实现（因为子类重写了它继承的定义）。下面的调用执行了 `move` 方法，但它所调用的特定版本是在运行时决定的：\n\
  \n```\ncreature.move();\n```\n\n当执行这一行代码时，如果 `creature` 当前指向一个 `Animal` 对象，则调用 `Animal`\
  \ 类的 `move` 方法。同样，如果 `creature` 当前指向一个 `Mammal` 对象，则调用 `Mammal` 版本的 `move` 方法。同样，如果它当前指向一个\
  \ `Horse` 对象也是。\n\n当然，由于 `Animal` 和 `Mammal` 代表通用概念，它们可能被定义为抽象类。这种情况并不能消除拥有多态引用的能力。假设\
  \ `Mammal` 类中的 `move` 方法是抽象的，并在 `Horse`、`Dog` 和 `Whale` 类中给出了唯一的定义（都派生自 `Mammal`）。`Mammal`\
  \ 引用变量可以用来引用从 `Horse`、`Dog` 和 `Whale` 类创建的任何对象，并可以用于执行其中任何对象的 `move` 方法。\n\n让我们来看另一种情况。考虑图\
  \ 10.1 所示的类层次结构。其中的类代表了可能在特定公司的各种类型的员工。让我们探索一个使用该层次结构来支付各种类型员工的示例。\n\n列表 10.1 所示的\
  \ `Firm` 类包含一个主驱动程序，它创建一个员工 `Staff` 并调用 `payday` 方法来支付他们。程序输出包含了每个员工的信息以及他们获得的工资金额（如果有）。\n\
  \n列表 10.2 所示的 `Staff` 类维护了一个表示各种类型员工的对象数组。注意，该数组被声明为持有 `StaffMember` 引用，但它实际上是由几个其他类（如\
  \ `Executive` 和 `Employee`）创建的对象填充的。这些类都是 `StaffMember` 类的后代，因此赋值是有效的。`staffList`\
  \ 数组填充了多态引用。\n\n`Staff`  `payday` 方法扫描员工列表，打印它们的信息并调用它们的 `pay` 方法以确定每个员工应该支付多少工资。`pay`\
  \ 方法的调用是多态的，因为每个类都有自己的版本的 `pay` 方法。\n\n\n\n\n列表 10.3 所示的 `StaffMember` 类是抽象类。它不代表特定类型的员工，也不打算被实例化。相反，它作为所有员工类的祖先，并包含了适用于所有员工的信息。每位员工都有姓名、地址和电话号码，因此存储这些值的变量在\
  \ `StaffMember` 类中进行声明，并被所有后代类继承。\n\n## 10.2 通过继承实现多态\n\n**图 10.1 员工的类层级结构**\n\n\
