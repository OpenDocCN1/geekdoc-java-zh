  \n![](img/index-439_1.png)\n\n## 8.6 二维数组\n\n`SodaSurvey` 程序计算并打印了每种汽水和每个受访者的平均响应。每种汽水和每个人的总和首先存储在整数的一维数组中。然后计算并打印平均值。\n\
  \n### 多维数组\n\n数组可以有一、二、三甚至更多维度。任何超过一个维度的数组被称为`多维数组`。\n\n将二维数组想象成表格是非常容易的。三维数组可以画成立方体。然而，一旦超过三个维度，多维数组可能看起来很难可视化。尽管如此，请考虑随后的每个维度仅仅是前一个维度的细分。对于较大的多维数组，通常用这种方式思考是最好的。\n\
  \n例如，假设我们想要存储全美大学的就读学生人数，并以有意义的方式进行分类。我们可以将其表示为四维整型数组。第一维度代表州。第二维度代表各州的大学。第三维度代表每所大学的学院。最后，第四维度代表每个学院的系部。每个位置存储的值是特定系的学生人数。图\
  \ 8.5 显示了这些细分。\n\n二维数组相当常见。然而，在决定程序中创建多维数组时，应当注意**核心概念**。在处理大量数据时，如果维度在多层级管理的对象中很少见，则可能需要额外的信息以及管理这些信息所需的方法。例如，在之前的示例中，更有可能的是每个州都由一个对象表示，该对象可能包含一个存储每所大学信息的数组等等。\n\
  \nJava 数组还有另一个重要特征需要考虑。正如我们之前确定的那样，Java 不直接支持多维数组。相反，它们被表示为指向数组对象的引用数组。\n\n**图 8.5**\
  \ 四维数组的可视化\n州\n大学\n学院\n系部\n\n![](img/index-440_1.png)\n\n这些数组本身可以包含指向其他数组的引用。这种分层会持续到所需的任意维度。由于这种表示每个维度的技术，任何一个维度中的数组长度可以不同。这些有时被称为`不规则数组`（ragged\
  \ arrays）。例如，二维数组每行的元素数量可能不相同。在这种情况下，必须小心确保数组得到恰当的管理。\n\n**自测复习题**（答案见附录 N）\n\n\
  SR 8.23 Java 中是如何实现多维数组的？\n\nSR 8.24 一个名为 `scores` 的二维数组存储了一个班级学生在一个学期的测试成绩。编写代码，打印一个表示数组中分数范围的单一值。它打印最高分的值减去最低分的值。每个测试分值都表示为一个整数。\n\
  \n## 8.7 多形形与折线\n\n数组在绘制复杂形状时非常有用。例如，多形形是一个多边形，在 Java 中使用一系列 (x, y) 点定义，这些点指示多形形的顶点。多形形使用\
  \ `Graphics` 类的方法绘制，类似于我们绘制矩形和椭圆的方式。与这些形状一样，多形形可以是填充的也可以是不填充的。\n\n多形形总是闭合的。总是会从最后一个点到第一个点绘制一条线段。\n\
  \n与多形形类似，`折线`（polyline）包含一系列由线段连接的点。折线与多形形的不同在于，在绘制时第一个和最后一个坐标不会自动连接。由于折线不是闭合的，因此无法被填充。因此，只有一个方法称为\
  \ `drawPolyline` 用于绘制折线。\n\n与 `drawPolygon` 方法一样，`drawPolyline` 方法的前两个参数都是整数数组。合并来看，前两个参数代表折线段端点的\
  \ (x, y) 坐标。第三个参数是坐标列表中的点数。\n\n列表 8.15 所示的程序使用多形形绘制火箭。在列表 8.16 所示的 `RocketPanel`\
  \ 类中，名为 `xRocket` 和 `yRocket` 的数组定义了构成火箭主体多形形点。数组中的第一个点是火箭顶部，从那里开始顺时针推进。`xWindow`\
  \ 和 `yWindow` 数组指定了形成火箭窗口的多形形点。火箭和窗口都是作为填充多形形绘制的。\n\n\n\n\n```java\n//-----------------------------------------------------------------\n\
  // 创建程序的主框架。\n//-----------------------------------------------------------------\n\
  public static void main(String[] args)\n{\n    JFrame frame = new JFrame(\"Rocket\"\
  );\n    frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n    RocketPanel panel\
  \ = new RocketPanel();\n    frame.getContentPane().add(panel);\n    frame.pack();\n\
  \    frame.setVisible(true);\n}\n}\n```\n\n![](img/index-442_1.png)\n\n## 8.7 多边形与多折线\n\
