  \n\n\n\n## 图 13.5 带有头部和尾部引用的列表\n\n链表的另一种实现方式可以为列表包含一个`header node`（头部节点），它包含一个指向列表头部的引用和另一个指向列表尾部的引用。尾部引用使得向列表末尾添加新节点变得更容易。头部节点可以包含其他信息，例如当前列表中节点数量的计数。头部节点的声明如下：\n\
  \n```java\nclass ListHeader\n{\n    int count;\n    Node front, rear;\n}\n```\n\n\
  请注意，头部节点的类与它所引用的 `Node` 类不是同一个类。图 13.5 描绘了一个使用头部节点实现的链表。\n\n还可以创建其他的链表实现方式。例如，可以将头部的使用与双向链表结合，或者以排序顺序维护列表。实现方式应该满足所需的处理类型。如果为了维护更复杂的数据结构可以使该结构上的常用操作更高效，那么付出一些额外努力可能是值得的。\n\
