  \ 总结 键元素数组\n## 459\n## 关键概念总结\n\n- 尺寸为 `N` 的数组索引从 `0` 到 `N-1`。\n- 在 Java 中，数组是一个必须实例化的对象。\n\
  - 边界检查确保了用于引用数组元素的索引在范围内。\n- 可以使用初始化列表来实例化数组对象，而不是使用 `new` 运算符。\n- 整个数组可以作为参数传递，这使得形式参数成为原始数组的别名。\n\
  - 实例化对象数组只预留了存储引用的空间。存储在每个元素中的对象必须单独实例化。\n- 命令行参数存储在 `String` 对象数组中，并传递给 `main`\
  \ 方法。\n- 可以定义一个 Java 方法来接受任意数量的参数。\n- 在面向对象的系统中，使用超过两个维度的数组是罕见的。\n- 折线与多边形相似，区别在于折线不是闭合形状。\n\
  - 移动鼠标和点击鼠标按钮会生成程序可以对其响应的事件。\n- 监听器为了满足接口，可能需要为未处理的事件提供空方法定义。\n- 橡皮带（Rubberbanding）是形状在被拖动时似乎扩展的视觉效果。\n\
  - 键事件允许程序对用户按键做出响应。\n\n## 练习题\nEX 8.1 哪些声明是有效的？哪些实例化了数组对象？\n`int primes = {2, 3,\
