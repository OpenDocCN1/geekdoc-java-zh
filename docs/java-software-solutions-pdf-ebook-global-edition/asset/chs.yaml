  \nb. \"hello\"\nc. \"We are the champions\"SR 7.21 对象是如何作为参数传递的？\n\n## 7.8 方法重载\n\
  正如我们所讨论的，当方法被调用时，控制流转移到定义方法的代码。\n\n通常，方法名就足以指示调用的是哪个方法。但在 Java 中，与其他面向对象的语言一样，你可以为相同的方法名使用不同的参数列表。这种技术被称为*方法重载*。当你需要对不同类型的数据执行相似的方法时，这非常有用。\n\
  \n编译器仍然能够将每次调用关联到特定的方法声明。例如，我们可以定义如下名为 `sum` 的方法：\n```java\npublic int sum(int num1,\
  \ int num2)\n{\nreturn num1 + num2;\n}\n```\n370\n第 7 章 面对象设计\n\n然后我们可以在同一个类中定义另一个名为\
  \ `sum` 的方法：\n```java\npublic int sum(int num1, int num2, int num3)\n{\nreturn num1\
  \ + num2 + num3;\n}\n```\n\n现在，当进行调用时，编译器通过参数的数量来确定调用哪个版本的 `sum` 方法。例如，以下调用将调用 `sum`\
  \ 方法的第二个版本：`sum(25, 69, 13);`\n\n方法名加上参数的数量、类型和顺序，被称为方法的*签名*（signature）。编译器使用完整的方法签名将方法调用*绑定*到相应的定义。\n\
  \n编译器必须检查方法调用以确定正在调用哪个特定方法。如果你尝试指定两个签名相同的方法，编译器将发出相应的错误信息且不会创建可执行程序。不能存在歧义。\n\n\
  注意，方法的返回类型不是方法签名的一部分。也就是说，两个重载方法不能仅通过返回类型来区分。这是因为方法的返回值可以被调用忽略。在这种情况下，编译器无法区分引用的是哪个重载方法。\n\
  \n`println` 方法是一个被重载了多次示例，每次接受一种类型。以下是其各种签名的部分列表：**视频笔记**\n\n■ `println(String s)`\n\
  方法重载的示例。\n\n■ `println(int i)`\n■ `println(double d)`\n■ `println(char c)`\n\n\n\
  \n\n\n# `println(boolean b)`\n\n以下两行代码实际上调用了同名的不同方法：\n\n```java\nSystem.out.println(\"\
  Number of students: \"); System.out.println(count);\n```\n\n第一行调用了接受字符串的 `println`\
  \ 版本。第二行假设 `count` 是一个整数变量，调用了接受整数的 `println` 版本。\n\n## 7.9 测试\n\n**371**\n\n我们经常使用\
  \ `println` 语句来打印几种不同类型的内容，例如：`System.out.println(\"Number of students: \" + count);`。请记住，在这种情况下，加号（`+`）是字符串拼接运算符。首先，变量\
  \ `count` 中的值被转换为字符串表示形式，然后将两个字符串拼接成一个更长的字符串，最后调用接受单个字符串的 `println` 定义。\n\n构造函数可以被重载，而且通常都是经过重载的。通过提供多个版本的构造函数，我们为设置对象提供了多种方法。\n\
