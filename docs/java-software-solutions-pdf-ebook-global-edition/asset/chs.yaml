  \n#### 瓦片式图片\n仔细观察列表 12.5 所示 `TiledPictures` Applet 的显示。\n\n在这个系列中实际上有三张独特的图像。整个区域被分为四个等象限。右下象限显示了一张世界地图（用圆圈表示喜马拉雅山地区）。左下象限包含一张珠穆朗玛峰的照片。右上象限是一张山羊的照片。\n\
  \n图片中有趣的部分是左上象限。它包含了整个拼贴的副本，包括它自己。在这个较小的版本中，你可以看到三个象限中的三个简单图片。再次，在左上角，图片重复了（包括它自己）。这种重复持续了几个层次。这类似于当你从另一面镜子的反射中看镜子时可以产生的效果。\n\
