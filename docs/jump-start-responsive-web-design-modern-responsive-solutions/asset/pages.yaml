  md: '# Geolocation


    The HTML5 Geolocation API allows you to detect the rough latitude and longitude
    of a user''s current location.


    As well providing great video content, RWDFlix also likes to recommend shows that
    might interest a user. This example will use the current location of the user
    to highlight shows that contain content about that location.


    ![](img/bd4041c3e441a42781fa04a5cb5b773b_147_0.png)


    6-3. Shows highlighted that match user location


    In index.js, replace the existing contents of the file with the following code
    that checks if the browser supports geolocation, informing the user if it doesn''t:'
  merge: -1
  pgno: 147
- img_proc: true
  md: "```\nwindow.addEventListener(\"load\",function(event) {\n  if (\"geolocation\"\
    \ in navigator) {\n\n  } else {\n    alert(\"RWDflix uses geolocation to recommend\
    \ shows that may\nbe relevant to you.\")\n  }\n},false);\n```\n\nIf the browser\
    \ does support geolocation, get the current position of the user and pass the\
    \ values to a new function:\n\n```\nif (\"geolocation\" in navigator) {\n  navigator.geolocation.getCurrentPosition(getPosition);\n\
    } else {\n  alert(\"RWDflix uses geolocation to recommend shows that may\nbe relevant\
    \ to you.\")\n}\n```\n\nThe API method returns the current latitude and longitude,\
    \ which is not useful to us, as we really want to know the current country of\
    \ a user. Use the Google Maps API to turn it into a more useful code:\n\n```\n\
    function getPosition(position) {\n  // Define the URL with the current latitude\
    \ and longitude\n  var url =\n    \"http://maps.googleapis.com/maps/api/geocode/json?latlng=\"\
    \ +\n    position.coords.latitude + \",\" + position.coords.longitude +\n    \"\
    &sensor=false\";\n  // Create a request and send the URL\n  var xmlHttpRequest\
    \ = new XMLHttpRequest();\n  xmlhttp.open(\"GET\", url, true);\n  xmlhttp.send();\n\
    \  // When the request returns, process the response\n  xmlhttp.addEventListener(\"\
    readstatechange\", processRequest,\nfalse);\n```"
  merge: -1
  pgno: 148
- img_proc: true
