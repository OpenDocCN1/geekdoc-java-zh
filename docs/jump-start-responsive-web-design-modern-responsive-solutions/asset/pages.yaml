  md: '# The Building Blocks of Responsive Design 39


    # The Viewport Meta Element


    In the last section, I covered making the demo page mobile first with media queries.
    If I try the example in your desktop browser and resize the window, everything
    looks as you would expect. But if you try it in a mobile browser, or with an emulated
    mobile browser, you''ll probably see something like the screenshot below and be
    disappointed. Aren''t media queries supposed to make pages better in a mobile
