  md: "# Mobile First\n\nIn Chapter 1. I introduced the “mobile first” concept. Currently,\
    \ the page works on different device sizes but not mobile first, because the “default”\
    \ styles—that is, those not inside media queries—are really designed for larger\
    \ devices. So let’s do some rearranging and refactoring to make the design mobile\
    \ first. This won’t involve too much work.\n\nMake the following changes to the\
    \ classes outside of the media queries:\n\n```\naside {\n  display: none;\n}\n\
    \nsection.showlisting {\n  margin-bottom: 25px;\n  width: 100%;\n}\n\n.showdescription\
    \ {\n  display: none;\n}\n```\n\nYou can now remove the corresponding classes\
    \ from inside the @media only screen and (min-width: 320px) media query.\n\nThat's\
    \ it! In essence, all “mobile first” means is to make the default styles relevant\
    \ to mobile devices and older browsers that don’t support media queries and add\
    \ more specific styles (via media queries) from there.\n\nThere's another, more\
    \ hidden advantage to the mobile first approach. While modern browsers now support\
    \ media queries, some older versions (Internet Explorer 8, for example) don’t,\
    \ and in this case, the default CSS styles will still be loaded."
