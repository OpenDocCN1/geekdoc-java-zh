    \ Getting Oriented\n\nIf you're interested in learning more about the three-rotation\
    \ axis that exist in the Orientation API, I recommend reading \"Using Device Orientation\
    \ in HTML5\".\n\n# Responding to All\n\nIn this chapter, we've seen hypothetical\
    \ examples of how we can change the contents of our pages to respond to the variety\
    \ of sensors found in modern devices. These are always evolving, and I encourage\
    \ you to keep up to date on the new APIs you can take advantage of in your designs\
    \ to deliver tailored experiences to users.\n\nThis brings us to the end of our\
    \ journey with this book. Responsive design is fundamentally about crafting pages\
    \ that are usable by anyone, no matter what device or circumstances. Whether it\
    \ be screen size, performance or other factors, it's our responsibility to ensure\
    \ that the user's experience is as good as it can be.\n\nYou're beginning your\
    \ responsive adventure at a great time. There have never been better features\
    \ available and soon to arrive in the HTML and CSS specifications—features for\
    \ crafting experiences to suit the ever-changing landscape of modern web design.\
    \ Some of these features are in flux, and their final orders undecided, but this\
    \ also means you have the opportunity to test and shape their future. Get involved,\
