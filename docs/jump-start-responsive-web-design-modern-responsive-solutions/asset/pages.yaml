    \ and (min-width: 992px) {\n  ...\n  section.showlisting.column-8 {\n    width:\
    \ 66%;\n  }\n  ...\n}\n```\n\nBut this is a poor solution, and you'll soon lose\
    \ track of what class equals what size.\n\nYou could change the class applied\
    \ to the div with JavaScript, and in the past, this was a solution to the problem.\
    \ But instead, I'll show you some more modern (and better) options that will make\
    \ the principle of grids more useful for responsive design.\n\n# Flexbox\n\nWhile\
    \ the \"column method\" above isn't that hard to understand and implement, as\
    \ your layouts become more complex you can start to introduce a lot of nested\
    \ divs and CSS styles to support them. The example above used float to position\
    \ elements into the desired position. As the example was simple, it wasn't too\
    \ hard to achieve this, but as grids get more complex, especially nested grids,\
    \ floats quickly become messy, and the solutions to cope with aren't ideal.\n\n\
    The CSS Flexible Box (\"flexbox\") Layout Module is a recent part of the CSS spec\
    \ and already enjoys good browser support. It was designed to provide a better\
    \ and more modern solution for this type of layout, offering you specific functionality\
    \ for the task.\n\nAfter an initial page restructure and learning new concepts,\
    \ you'll find that using flexbox for your page components will drastically simplify\
    \ your HTML structure and CSS classes."
