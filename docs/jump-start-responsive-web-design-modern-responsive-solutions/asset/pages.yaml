- img_proc: true
  md: "sees. That's about it; there isn't much particularly responsive about the video\
    \ element, except that it loads suitable video files with controls for them.\n\
    \nThere are a few tricks you can try to make videos more responsive, but let's\
    \ start simply by making the video player controls visible, adding a poster image\
    \ (a thumbnail shows before the video plays), and removing the manual size.\n\n\
    ```\n<video controls poster=\"../images/show1-medium.jpg\">\n  <source src=\"\
    ../videos/show1.ogv\" type=\"video/ogg\">\n  <source src=\"../videos/show1.mp4\"\
    \ type=\"video/mp4\">\n  Your browser does not support the video tag.\n</video>\n\
    ```\n\nEarly proposals for the video element included having its own media queries\
    \ (like the picture element, as we have saw). But the idea was dropped, meaning\
    \ that different video files can't be swapped out for different devices. The only\
    \ real way to make the video responsive in any way is to use percentage widths,\
    \ for example:\n\n```\nvideo {\n  width: 100%;\n  height: auto;\n}\n```\n\nThis\
    \ will make the video scale to fit its containing element, and you could use a\
    \ max-width property to limit the dimensional size it could grow to, or a smaller\
    \ value, as 50%. However at larger screen sizes it won't prevent upscaling of\
    \ the video, meaning it could look pixelated if too large.\n\nUnless you specify\
    \ otherwise, a video will start to download to your browser once the page is loaded\
    \ (so that it's ready to view if a user chooses to watch it). Notice the potential\
    \ network overhead with a video, which isn't great for mobile users:"
