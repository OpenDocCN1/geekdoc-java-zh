    paragraphs than set spaces between them.

    - text-align-last: sets the alignment of the last line of text to block. Again,
    at different sizes, you may want to handle this differently.

    - white-space: defines the behavior of white space and wrapping in a block of
    text.

    - word-wrap: specifies if words are allowed to break over lines. This could be
    useful for optimizing text based on display size.


