  md: "# Jump Start Responsive Web Design\n\nscreen space. The example site is for\
    \ browsing and watching videos, so it makes sense to make the visual content prominent\
    \ and easy to see as possible.\n\nTo show how to use responsive images, we'll\
    \ change the demo site to have different image sizes and layouts suited to each\
    \ use case at the breakpoints defined in Chapter 3.\n\nFirst, change the CSS and\
    \ HTML to better accommodate the images we'll be adding. Let's give the main content\
    \ area more space and reduce the size of the aside menu:\n\n```\n@media only screen\
    \ and (min-width: 992px) {\n  aside {\n    width: 15%;\n    display: block;\n\
    \  }\n\nsection.showlisting {\n    width: 75%;\n  }\n}\n```\n\nAdd the mobile\
    \ first styles for the divs that contain details about a show. This sets a maximum\
    \ width of 480px, centered, with an ideal width of most of the screen:\n\n```\n\
    section.tvshow {\n  width: 90%;\n  max-width: 480px;\n  margin: 0 auto;\n  display:\
    \ block;\n}\n```\n\nNext, add a media query for the same div when displayed on\
    \ larger screens—still centered and filling most of the screen:"
  merge: -1
  pgno: 118
- img_proc: true
  md: "```\n@media only screen and (min-width: 480px) {\n  section.tvshow {\n    max-width:\
    \ 768px;\n  }\n}\n```\n\nAs we jump to a larger screen, let's start showing more\
    \ than one thumbnail in a row. This actually means that images will now be smaller,\
    \ and the max-width of each div should be half the maximum screen size for this\
    \ media query:\n\n```\n@media only screen and (min-width: 768px) {\n  section.tvshow\
    \ {\n    width: 46%;\n    margin-right: 15px;\n    display: inline-block;\n  \
    \  max-width: 496px; /* The next break point divided by 2*/\n  }\n```\n\nNext\
    \ is the media query for larger screens, where we now show four items per row\
    \ and adjust the div and image sizes accordingly:\n\n```\n@media only screen and\
    \ (min-width: 992px) {\n  section.tvshow {\n    width: 22%;\n    margin-right:\
    \ 15px;\n    display: inline-block;\n  }\n```\n\nFinally, change the media query\
    \ for TV and larger screens:"
