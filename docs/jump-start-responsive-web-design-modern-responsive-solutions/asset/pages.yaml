  md: '# Making Grids Easier with Frameworks


    In many cases, creating a grid in the way described in this chapter isn''t too
    much work, but developers and designers like to do repetitive tasks as much possible.
    A simple solution is to create your own grid system that works for you and reuse
    it your projects. By course, other developers and designers have thought the same
    thing and provided their grid systems (or frameworks) on the internet. I will
    present two of the popular ones, but it''s a topic where opinions are many and
    change. My aim here is to show you how frameworks may be able to help you save
    time on repetitive tasks, rather than go into detail over which one is “better”
    (a decision you''ll have to make for yourself). Many of these frameworks supply
    more than responsive grids, providing other responsive elements such as fonts,
    icons, and reusable widgets. You may prefer one framework over another because
    it gives you better options for other aspects of your web pages.


    # Bootstrap


    While not the first framework for responsive design, Bootstrap is the most widely
    used. You''ve probably seen it in action without realizing. Released in 2011 by
    Twitter, it uses a 12-column grid, offers flexbox layout, and has periodically
    had one of the most popular repositories on GitHub.


    Popularity is Bootstrap''s biggest advantage and disadvantage. It''s easy to use,
    encourages positive layout and CSS practices, and has plenty of documentation
    and community help. But your site can easily end looking a lot like other Bootstrap-powered
    site.


    # Installing Bootstrap


    The default download of Bootstrap can add a lot to the weight of your page, so
    I recommend you take a good look at instructions to ensure you get a copy that''s
    best optimized for your use. For this example, I''ll use the CDN option, as it''s
    the simplest. If you want to follow along, add the lines provided on the Bootstrap
    page, and remove the link to the current CSS file.'
  merge: -1
