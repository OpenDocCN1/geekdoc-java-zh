  md: '# 116 Jump Start Responsive Web Design


    # The video Element


    Many years ago, I made a site of music videos. This was prior to the widespread
    availability of broadband, and I spent a long time optimizing videos as much as
    possible to make them viewable on slow connections. I also had to decide what
    video plugin to use to display the video. It would be best with Quicktime?RealPlayer?
    Or the tool everyone loves to hate now (but was popular at the time), Flash?


    Those video formats were largely over now, replaced by a series of standard formats
    and HTML5, making a designer''s life much easier, and also reducing user-experience-killing
    process of having to download a plugin to view a video. The video element has
    a wider support than picture, with only IE8 and early Android versions likely
    to cause you problems.


    However, the file formats supported by the video element still present problems,
    mostly thanks to vendors'' differing attitudes to DRM and to which format is the
    "best" to use (each user preferring the format it supports or helped to develop).
    All browsers that support the video element support MPEG-4/H.264, which is a compressed
    format. But it''s also proprietary, which means browser manufacturers must pay
    a license to use it. Support for the WebM and Ogg/Theora formats (which are open
    formats) is less common, with really Chrome, Firefox, and Opera supporting them.


    Here''s an example of the video element in:


    ```

    <video width="320" height="240" autoplay>

    <source src="file.mp4" type="video/mp4">

    <source src="file.ogg" type="video/ogg">

    Your browser does not support the video tag.

    </video>

    ```


    It''s much simpler and consolidated HTML element than the options that existed
    before. It loads whichever video format is supported by the user''s browser, or
    a default string of text if the video element or the file formats it contains
    aren''t supported. The source elements are processed in the order presented. So,
    in the example above, if the browser supports both formats, it will load the first
    one it'
  merge: -1
