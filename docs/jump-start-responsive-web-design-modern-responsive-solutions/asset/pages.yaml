- img_proc: true
  md: "# Jump Start Responsive Web Design\n\nEverything that you want flexbox to manage\
    \ is contained within a “flex container”. Much like earlier examples, begin with\
    \ the code from the start of this chapter and continue to use a containing div:\n\
    \n```\n<div class=\"container\">\n...\n</div>\n```\n\nAnd the CSS for this container:\n\
    \n3-14. Chapter3/flexbox/layout.css (excerpt)\n```css\n.container {\n  display:\
    \ flex;\n  flex-flow: row wrap;\nn```\n\nThe display property is set to flex to\
    \ enable flexbox layout. The flex-flow property is shorthand for two other properties.\n\
    \nThe first of these properties is flex-direction, which defines how the individual\
    \ items inside a flex container will be placed. The two most common values are\
    \ row and column. Using row will place items horizontally (left to right or right\
    \ to left, depending on your preference). Column works similarly, but instead\
    \ places elements from top to bottom. You can reverse the direction by appending\
    \ with -reverse.\n\nThe flex display mode is one-dimensional (running either horizontally\
    \ or vertically) and will attempt to keep fitting items on one line. The flex-wrap\
    \ property determines what will happen if the container can’t fit all items on\
    \ one line. The items can be set to wrap to the next line or be forced into one\
    \ line with nowrap.\n\nNext, let’s handle the header, nav, and footer page elements,\
    \ which fill the entire width of the page container. Replace any existing styles\
    \ with the following:"
  merge: -1
  pgno: 78
- img_proc: true
  md: "# Better Responsive Structures with Grid Systems 67\n\n```\nheader, nav, footer\
    \ {\n  flex: 100%;\n}\n```\n\nflex is shorthand for three combined properties,\
    \ in the following order:\n\n+   - flex-grow determines how much space an item\
