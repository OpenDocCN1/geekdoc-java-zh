  md: '# The Building Blocks of Responsive Design 43


    # The Viewport


    Viewport is an old term in computer graphics to define the (typically rectangular)
    screen area used to render the elements that users see in a browser. When web
    browsing was limited to desktop browsers, the viewport still existed but was rarely
    changed by designers. With the increasing variety of browser dimensions, HTML5
    introduced a viewport attribute to the meta element allowed designers to set and
    manipulate this area.


    The meta element was initially proposed by Apple to set the initial state of the
    page to the correct size and was later introduced as part of the HTML5 standard.


    Generally, you set the viewport to the width of the current device with width=device-width
    and leave the content unscaled (with initial-scale=1.0).


    The width attribute is a pixel value, and the device-width detects the current
    device width, meaning you don''t need to handle the myriad sizes that may be available;
    the meta element will take care of it for you. The same applies for different
    screen orientations: changes between landscape and portrait are also handled for
    you. There''s still a lot more work needed to make a design fully responsive,
    but media queries plus this viewport setting give you a fantastic start.


    ![](img/bd4041c3e441a42781fa04a5cb5b773b_55_0.png)


    2-12. Demo page with viewport'
  merge: -1
  pgno: 55
- img_proc: true
