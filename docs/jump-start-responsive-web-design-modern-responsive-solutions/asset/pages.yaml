  md: '# Better Responsive Structures with Grid Systems 51


    This is a common way to set up containing element for page content. It sets a
    maximum width of 1180px, a width of 95% of the browser window, and centers the
    container in the window using the handy left and right auto margins.


    # Why 1180px?


    Why is the max-width set to 1180px? This is an arbitrary value and based on current
    trends in desktop screen sizes; it''s added to make sure the page doesn''t get
    too wide on giant screens. For a long time, it was 960px, reflecting that most
    screen widths were at most 1024px. As screen dimensions and resolutions have grown,
    this maximum width has become larger, but is still open to different opinions.
    Media queries (covered in Chapter 2) have made this maximum width less relevant
    than it used to be. For now, stick with this 1180px value.


