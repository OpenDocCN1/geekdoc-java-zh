  md: '# Preface


    The pixel-perfect web is dead. The days of positioning elements on a web page
    and expecting them to always display how we wanted a distant memory; we now cope
    with the constant barrage of new and varied devices that our designs need to look
    fantastic on.


    This book aims to get you started understanding and using the suite of CSS and
    HTML tools for responding to this new world of devices. It will introduce you
    to the building blocks that help your pages adapt to different devices, take this
    a step further with grids, show you how to make text and images readable on all
    devices, and in the final chapter, cover how to utilize more esoteric capabilities.


    Let’s get started.


    # Who Should Read This Book


    This book is for web designers and front-end developers. You''ll need to be familiar
    with HTML and CSS, but no previous responsive web design experience is required.
    Some JavaScript familiarity is useful for the latter parts of the book.


    # Conventions Used


    You''ll notice that we''ve used certain typographic and layout styles throughout
    this book to signify different types of information. Look out for the following
    items.


    # Code Samples


    Code in this book is displayed using a fixed-width font, like so:


    ```

    <h1>A Perfect Summer''s Day</h1>

    <p>It was a lovely day for a walk in the park. The

    ```'
