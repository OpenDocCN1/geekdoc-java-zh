    2-13. Manually setting HTML width


    This is still a better result than a page without the viewport, but as you can
    see,

    t page content is wider than the width you define, it will continue anyway. One

    case for setting a manual width is if you’re certain of screen dimensions,

    and that your page content will fit perfectly—for example, if you’re only

    targeting one device, like an eReader, or kiosk application.


    There are other, less frequently used attributes for the viewport meta element

    have limited use, but which you might need for more fine-grained control over

    your page layout:'
  merge: -1
  pgno: 57
- img_proc: true
  md: '+   - minimum-scale: the minimum zoom level, or how much the user can zoom
    out.

    - maximum-scale: the maximum zoom level, or how much the user can zoom in.

    - user-scalable=no: disables zooming. While this has a limited number of cases,
    it significantly reduces the accessibility of your page.


    # Any Queries?


    The selective nature of media queries makes them an essential tool in your responsive
    toolbox, and in this chapter, we''ve learned how to create and use them.


    Every modern browser now supports them, and they offer the potential to target
    any specific environments you need to design for.


    In coming chapters, we''ll leverage the responsive foundation that media queries
    and the viewport offer to add polish and shine to our responsive designs.'
  merge: -1
