  md: "# The Building Blocks of Responsive Design\n\n```\nsection.showlisting {\n\
    \  width: 66%;\n}\n\n.showdescription {\n  white-space: normal;\n  width: 125px;\n\
    }\n\n/* Large Devices, for example large monitors and TVs */\n@media only screen\
    \ and (min-width: 1200px) {\n}\n```\n\nThe media queries should now be self-explanatory.\
    \ They define queries for a selection of devices, defined using screen sizes.\
    \ As the C in CSS implies, the media queries cascade: you can build styles defined\
