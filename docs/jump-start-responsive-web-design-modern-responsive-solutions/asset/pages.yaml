  md: '# Chapter 1


    # # The Meaning and Purpose of Responsive Web Design


    It used to be so simple: you''d design a website or application for a 15-inch
    monitor, and—incompatibilities between browsers aside—you were done.


    Then mobile phones with web browsers came aside and ruined our easy lives. Worst
    of all, people loved browsing the Web on them!


    > > The Rise of Mobile


    In 2016, browsing the web on mobile devices overtook desktop browsing for the
    first time.


    *\u2622\*\u2622* Just as developers and designers got used to building websites
    for phones, along came tablets, watches, TVs, cars, glasses, larger desktop screens,
    high-resolution'
  merge: -1
