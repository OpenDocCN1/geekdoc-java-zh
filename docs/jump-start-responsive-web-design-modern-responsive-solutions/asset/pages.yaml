- img_proc: true
  md: '# Jump Start Responsive Web Design


    A grid is a series of columns and rows. The number of rows is more clear: it''s
    as many as you need to fit your header, navigation, content, footer etc. What
    about columns? Well, with other topics in this book (and technology generally),
    there are different opinions on this. It''s typically an even number, because
    this makes it easier to divide the page. Numbers divisible by three are most used.
    (If you''re interested in knowing why, the Wikipedia article on the golden ratio
    provides a nice explanation). Popular column value values are 12, 16 and 24, and
    I''ll focus on the 12-column grid system here. 12 is popular, as it can be divided
    into a variety of commonly used sizes, such as a half, a third, and a quarter.


    # Creating Your Own Grid


    You may be wondering how a 12-column layout helps you create a 3-column layout
    like our example page—and yes, it''s confusing at first.


    The columns are more used as structural underpinnings, and through CSS you define
    how many columns you want your elements to span. To make this clearer, here''s
    an example of the 12-column 1180px grid:'
  merge: -1
  pgno: 66
