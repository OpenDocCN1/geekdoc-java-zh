  md: "# 2 Jump Start Responsive Web Design\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_104_0.png)\n\
    \n# Percent\n\nSetting a percentage value for a font size means making it a percentage\
    \ of the default font size, so if a user has the font size of their browser set\
    \ at 16px, then font-size: 100%; will still equal 16px, and font-size: 50% will\
    \ equal 8px.\n\nAs an example, let's try applying percentage sizing to the demo\
    \ site, again with a mobile first approach, setting the base font size for users\
    \ of devices with smaller screens.\n\n> We're Assuming a Base Font Size of 16px\n\
    \nFor these examples, I'll assume that the base font size is the default 16px.\
    \ If it's different in your browser, then the sizes stated will differ.\n\nAdd\
    \ a base font size to the body element that sets the default font size to 75%\
    \ of 16px, which is 12px:\n\n```\nbody {\n  font-size: 75%;\n}\n```\n\nThen, in\
    \ the tablet and desktop media queries, add font sizes for the larger screen sizes."
  merge: -1
  pgno: 104
- img_proc: true
  md: "```\n@media only screen and (min-width: 768px) {\n  body {\n    font-size:\
    \ 100%;\n  }\n}\n@media only screen and (min-width: 992px) {\n  body {\n    font-size:\
    \ 125%;\n  }\n}\n```\n\nThis results in a subtly more pixelated font rendering\
    \ on larger screens than on medium-sized screens.\n\n# Em\n\nDespite its recent\
    \ rise in popularity with web designers, the em unit is an old typographical unit\
    \ named after the letter “M”. The base value of an em unit is equal to the current\
    \ typeface size in points. For example, one em in a 16-point typeface is 16 points.\n\
    \nIn practice, it works in a similar way to percentage sizing, the units are smaller.\
    \ So, for example, assuming a default font size of 16px, font-size: 1em will still\
    \ equal 16px, and font-size: 0.5em will equal 8px.\n\nThe unit values are smaller\
    \ with ems, but it’s easy for styles to result in large font sizes accidentally.\
    \ For example, consider font-size: 4em: while the number doesn’t look large, it\
    \ actually equals 64px. Of course, you could set your default font size to something\
    \ smaller, and then increasing ems won’t result in large variations.\n\nAs an\
    \ example, let’s try applying em sizing to the demo site, again with a mobile\
    \ first approach."
  merge: -1
  pgno: 105
