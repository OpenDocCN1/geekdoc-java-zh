  md: "# Better Responsive Structures with Grid Systems 57\n\n3-9. Chapter 3/vanilla_final/layout.css\
    \ (excerpt)\n\n```\n.row,\n.column {\n  box-sizing: border-box;\n}\n\n.row:before\
    \ {\n  content: \" \";\n  display: table;\n}\n\n.row:after {\n  clear: both;\n\
    }\n\n.column {\n  position: relative;\n  float: left;\n}\n\n.row + .column {\n\
    \  margin-left: 1.6%;\n}\n```\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_69_0.png)\n\
    \n# Using the Adjacent Sibling Selector\n\n> The adjacent sibling selector (+)\
    \ above is a useful CSS trick that adds a margin only to the matching element\
    \ following another matching element. In our case, it means that the first column\
    \ won't have a left margin.\n\nThe first step is to define the width of one column,\
    \ not forgetting the margin between each column.\n\nA single column width is equal\
    \ to 100 (as we're working with percentages) minus the margin value, multiplied\
    \ by the number of columns minus 1 (you don't need a left margin in the first\
    \ column), all divided by the number of columns."
  merge: -1
  pgno: 69
- img_proc: true
  md: 'If you prefer to look at formulas:


    ```

    SingleColumnWidth = (100 - (MarginValue * (NumberOfColumns - 1))) / NumberOfColumns

    ```


    ![](img/bd4041c3e441a42781fa04a5cb5b773b_70_0.png)


    3-10. An explanation of the formula


    This should give the nice, memorable result of 6.86666666667% ... but don''t worry:
    a number like this is what''s expected, and after the initial setup, you won''t
    need to remember these values.


    Next, apply this number into a new formula for each of the columns. You want to
    know the width values of column *spans*—that is, how to spread content across
    more than one column.


    A column width is equal to the *SingleColumnWidth* value multiplied by the current
    column, added to the margin value multiplied by the number of columns minus 1.


    Or as a formula:'
  merge: -1
  pgno: 70
- img_proc: true
  md: "# Better Responsive Structures with Grid Systems 59\n\n```\nColumnWidth = (SingleColumnWidth\
    \ * CurrentColumn) + \n(MarginValue * (CurrentColumn - 1))\n```\n\nAs an example,\
    \ here's how to find the value required to span two columns:\n\n```\n(SingleColumnWidth\
    \ * CurrentColumn)\n6.866666666667 * 2 = 13.7333333333\n\n(CurrentColumn - 1)\n\
    2 - 1 = 1\n\n(MarginValue * (CurrentColumn - 1))\n1.6 * 1 = 1.6\n\n(SingleColumnWidth\
    \ * CurrentColumn) + (MarginValue *\n(CurrentColumn - 1))\n13.7333333333 + 1.6\
    \ = 15.3333333333\n```\n\nThis will result in the following column styles, with\
    \ the column-n class representing the number of columns you want to span. Add\
    \ these to layout.css:"
