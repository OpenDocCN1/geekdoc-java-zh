- img_proc: true
  md: '# Chapter 3


    # Better Responsive Structures with Grid Systems


    So far, we''ve looked at the underlying principles of responsive design and the
    power of media queries to build page structures optimized for different devices.
    In this chapter, we''ll see how grid systems can supplement and even replace some
    of the techniques we''ve covered so far, providing more flexibility for how pages
    display across different devices.


    While flexibility in design is endless in theory, a common design ethic in print
    and digital design has been to use horizontal and vertical grids for element layout.
    They help break up sections of a page into logical areas that are easier to manage,
    and our brains like to see items in a composition in predictable lines. Composition
    in artwork and photos is a long-standing field of study, and many of its theories
    continue into web design.'
  merge: -1
  pgno: 59
- img_proc: true
  md: 'If you look at the current demo page on a desktop, it''s effectively a grid
    consisting of four rows and two columns:


    ![](img/bd4041c3e441a42781fa04a5cb5b773b_60_0.png)


    3-1. The initial page grid


    When you resize the page, the media queries added in the last chapter take care
    of changing the row and column layouts to fit accordingly.


    This is because the current layout is a simple example of what''s called a **fluid
    grid**. The main sections of the page have widths that are percentages of the
    viewport width, and thus will resize accordingly.


    On a desktop, the main listing of the TV shows takes up 66% (or two thirds) of
    the web page, and the menu 33% (or one third).'
