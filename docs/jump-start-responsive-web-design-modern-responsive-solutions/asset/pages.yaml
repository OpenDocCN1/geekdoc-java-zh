    > 5–4. The effect of the changed image styles


    This will set the image width to 100% of its container''s width, and setting image''s
    height to auto allows the image to occupy as much vertical space needed to maintain
    its natural proportions. You''ll notice that this means the images don''t currently
    have all the same height, which affects the layout. You could swap these verses
    to instead fill 100% of the height and fill the width automatically. Attempting
    to make images always fix precision dimensions can be a compromising challenge
    that depends on a lot on the source of the images. If you''re able, it might be
