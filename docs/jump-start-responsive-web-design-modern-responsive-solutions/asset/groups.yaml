    \ content=\"width=device-width,initial-scale=1.0\">\n</head>\n```\n\n刷新页面：\n\n\
    # 快速快速上手：响应式网页设计\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_54_0.png)\n\n好多了！\n\
    \n# 响应式设计的构建模块 43\n\n# 视口 (The Viewport)\n\n视口是计算机图形中的一个旧术语，用于定义（通常是矩形的）用于渲染用户在浏览器看到的元素的屏幕区域。当浏览局限于桌面浏览器时，视口仍然存在，但很少由设计师更改。随着浏览器尺寸多样性的增加，HTML5\
    \ 在 `meta` 元素中引入了 `viewport` 属性，允许设计师设置并操作该区域。\n\n`meta` 元素最初由 Apple 提出，用于将页面状态设置为正确尺寸，后来作为\
    \ HTML5 标准的一部分引入。\n\n通常，你通过 `width=device-width` 将视口设置为当前设备的宽度，并保持内容不缩放（使用 `initial-scale=1.0`）。\n\
    \n`width` 属性是一个像素值，`device-width` 检测当前设备的宽度，这意味着你不需要处理可能存在的无数尺寸；`meta` 元素会为你处理好。对于不同的屏幕方向情况也是如此：横屏和竖屏之间的切换也会为你处理好。要让一个设计完全响应式，仍然需要很多工作，但媒体查询加上这个视口设置为你提供了一个绝佳的开始。\n\
    \n![](img/bd4041c3e441a42781fa04a5cb5b773b_55_0.png)\n\n2-12. 带有视口的演示页面\n\n标签的\
    \ `content` 属性也接受设置宽度的标准方法。例如：\n\n```html\n<head>\n...\n  <meta name=\"viewport\"\
    \ content=\"width=500,initial-scale=1.0\">\n...\n</head>\n```\n\n这将导致：\n\n# 响应式设计的构建模块\
    \ 45\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_57_0.png)\n\n2-13. 手动设置宽度\n\n\
    这比没有视口的页面仍然好得多，但正如你看到的，手动设置宽度的案例是当你针对特定设备（如电子阅读器）。视口还有其他不常用的属性你可能会需要：\n\n- `minimum-scale`:\
    \ 最小缩放比例，或用户可以放小的程度。\n- `maximum-scale`: 最大缩放比例，或用户可以放大的程度。\n- `user-scalable=no`:\
    \ 禁止缩放。虽然这种情况的情况有限，但它会显著降低页面的可访问性。\n\n# 任何查询？ (Queries?)\n\n媒体查询的选择性使其成为你工具箱中的必备工具，在本章中，我们学习了如何创建和使用它们。每个现代浏览器现在都支持它们，并且提供了针对你需要设计的任何特定环境的潜力。在接下来的章节中，我们将利用媒体查询和视口提供的响应式基础，为我们的响应式设计增添色彩。\n\
    \n# 第3章\n\n# 使用网格系统更好的响应式结构\n\n到目前为止，我们查看了响应式设计的底层原理，以及使用媒体查询构建针对设备优化页面结构的力量。在本章中，我们将看到网格系统如何补充甚至取代我们迄为止涵盖的一些技术，为页面在不同设备上的显示提供更多灵活性。\n\
    \n虽然设计的灵活性在理论上是无限的，但平面和数字设计中常见的设计规范一直是使用水平和垂直网格进行元素布局。它们有助于将页面划分以便于管理的逻辑区域，而且我们大脑喜欢在构图中以可预测的线条查看项目。\n\
    \n如果你在桌面上查看当前的演示页面，它实际上是一个由四行两列组成的网格：\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_60_0.png)\n\
    \n3-1. 初始页面网格\n\n当你调整页面大小时，上一节添加的媒体查询会处理更改行和列布局以适应。\n\n这是因为当前布局是所谓的**流网格**（fluid\
    \ grid）的一个简单示例。页面的主要部分的宽度是视口宽度的百分比，因此会相应调整。\n\n在桌面上，电视节目的主列表占据了网页的 66%（或二分之），而菜单占据\
    \ 33%（或三分之一）。\n\n"
