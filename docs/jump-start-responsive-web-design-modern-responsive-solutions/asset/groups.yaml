    # 4 Jump Start Responsive Web Design


    Sound good to you? To begin, let''s go back in time a few years.


    # History


    “Responsive” design is not necessarily new and is a term that can mean different
    things to different people, making its exact history hard to track down.


    In theory, developers have been creating responsive designs since there was more
    than one browser. Browsers always have subtle (and not subtle) rendering differences
    between them, and developers have learning how to cope with these quirks for decades.
    If you''re new(er) to web development, be thankful the dominance of Internet Explorer''s
    earlier versions is mostly over. The days of dealing with their quirks were dark.


    Since 2004, responsive design has adopted the more specific meaning of adapting
    your designs to a user''s device of choice—typically based on screen size, but
    also other capabilities. The concepts for responsive design solidified in 2008,
    and the term is also referred to as “flexible”, “liquid”, and “elastic” design.


    It was the inclusion of media queries in the CSS3 specification that fully gave
    responsive design the potential it needed to be a genuine and more usable concept.
    We''ll cover media queries in detail Chapter 2, but in summary, they allow you
    to show what you want in a web page based on pre-defined screen sizes or types.
    Ethan Marcotte coined the term “responsive web design” in an article for A List
    Apart in 2010.


    This led to a growth and consolidation of other techniques and technologies alongside
    media queries, as flexible images and grids, all of which we''ll cover in this
    book.


    To me, “responsive design” is something of a combination of all these ideas and
    principles. It''s not just adapting to screen sizes, but also to other factors
    such as color depth, media type (say, a laptop screen, or an eReader), or location.'
