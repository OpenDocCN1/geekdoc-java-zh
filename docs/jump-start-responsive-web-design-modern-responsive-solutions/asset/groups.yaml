    \ 320px 的移动设备上，视口设置就会生效。但这里有一个巨大的陷阱。默认情况下，许多设备（如手机和平板电脑）表现就像它们的屏幕比实际要宽得多。\n\n\
    为了解释这里发生了什么，让我们看看这种行为的源地 iPhone。第一代 iPhone 的屏幕/视口宽度为 320px。然而，大多数为桌面设计的网站比这宽得多。为了避免在初始加载时只看到这些网站的左上角，Apple\
    \ 开发了“虚拟视口”（virtual viewport）或“布局视口”（layout viewport）的概念。网站被加载到这个宽得多的视口中，然后被缩小以适应屏幕。大多数网站在\
    \ iPhone 上的渲染结果字体非常小，你必须缩放才能阅读。\n\nApple 的虚拟视口被设置为 980px，因此只要网站宽度不大于 980px，整个布局就会显示在屏幕上。任何宽度超过\
    \ 980px 的布局都会在右侧部分隐藏，需要横向滚动。今天依然如此。其他设备制造商也采纳了虚拟视口的理念，尽管默认宽度各不相同。\n\n在设计响应式网站时，我们真的不希望移动设备上出现这种默认行为。我们希望知道自己操作的画布是每个设备的实际屏幕区域。坦率地说，有一种简单的方法可以告诉这些设备不要以默认方式运行。我们所需要的是在每个页面的\
    \ `head` 中添加一个特殊的 meta 元素。这里有一个典型的示例：\n\n```\n<meta name=\"viewport\" content=\"\
    width=device-width,\n     initial-scale=1\">\n```\n\n作为常规，上面的那行代码就是确保你的媒体查询在移动设备上按预期运行所需的全部内容。`name`\
    \ 属性指定了我们的目标是虚拟视口，而 `content` 属性指定了我们希望设备如何运行。在上面的示例中，我们指定虚拟视口应该匹配屏幕的实际宽度，并且对内容不应用缩放。\n\
    \n一旦有了视口声明，你就可以确保针对 320px 设备的媒体查询实际上会被该设备识别。\n\n让我们修改演示网站以添加视口声明。在你的当前 `head`\
