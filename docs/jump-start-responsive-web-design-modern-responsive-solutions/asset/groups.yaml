    \ == country ||\n          tvShow.classList[2] == country) {\n        tvShows[j].classList.add('highlight');\n\
    \      }\n    }\n  }\n}\n```\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_149_0.png)\n\
    \n## Modifying the HTML\n\nI added country classes to the tvshow sections. Go\
