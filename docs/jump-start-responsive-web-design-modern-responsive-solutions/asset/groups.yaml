    \nLorem ipsum dolor sit amet, consectetur adipiscing elit.\n\n### 3-23. Sub-elements\
    \ not yet added\n\nThe grid display layout has two interesting methods for defining\
    \ where you can place an item\n\n1. The first is similar to flexbox, allowing\
    \ you to specify an order number.\n2. The second lets you place items at named\
    \ locations. To use this method, you need to define what are called line names.\n\
    \nThe code below sets the display style to grid, then defines the columns and\
    \ rows you need. For the columns, this is a column left that's 66% of the page\
    \ width, and a column right that fills 33%. For the rows, define three with a\
    \ fixed height (header, main-nav and footer) and shows will automatically fill\
    \ any remaining space.\n\n```\n.container {\n  display: grid;\n  grid-template-columns:\
    \ [left] 66% [right] 33%\n  grid-template-rows: [header] 80px [main-nav] 40px\
    \ [shows]\n  auto [footer] 20px;\n```\n\nAt this point, now you understand what's\
    \ going on, it's time to make this mobile first. Change the current container\
    \ class to the following: \n\n```\n.container {\n  display: grid;\n  grid-template-columns:\
    \ [left] 100%;\n  grid-template-rows: [header] 80px [main-nav] 40px [shows]\n\
    \  auto [footer] 20px;\n}\n```\n\nAnd for larger screen sizes:\n\n```\n@media\
    \ only screen and (min-width: 992px) {\n  .container {\n    grid-template-columns:\
    \ [left] 66% [right] 33%;\n  }\n}\n```\n\nIf you've ever created tables in a desktop\
    \ publishing application (or remember using tables for layout in the dark days\
    \ of web design), you'll know that you need to define how an item spans across\
    \ multiple cells or rows. The technique is the same with the grid display. Take\
    \ the header as an example:\n\n```\nheader {\n  grid-column-start: left;\n  grid-column-end:\
    \ right;\n  grid-row-start: header;\n  grid-row-end: header;\n}\n```\n"
