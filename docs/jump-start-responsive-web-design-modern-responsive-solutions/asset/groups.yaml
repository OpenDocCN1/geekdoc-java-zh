    \ 'no' && tvShow.classList[2] !==\n    'mature') {\n}\n}\n```\n\n由于所有 Cookie 都存储在同一个属性中，你可以使用正则表达式来查找并读取你需要的\
    \ Cookie：\n\n```\nfunction getCookie(name) {\n  var regexp = new RegExp(\"(?:^|\\\
    \\s)\" + name + \"|\\\\s*)=(.+?)(?:;|$)\", \"g\");\n  var result = regexp.exec(document.cookie);\n\
    \  return (result === null) ? null : result[1];\n}\n```\n\n# 环境光\n\n将 Ambient\
    \ Light Sensor API 与时间检测相结合，可能是根据一天的时间和观众可用的光线调整页面或视频亮度的极方法。在许多移动设备上，这现在由操作系统处理，但你可以为电脑用户提供增强或添加类似的功能。\n\
    \n![](img/bd4041c3e441a42781fa04a5cb5b773b_152_0.png)\n\n# 安全担忧\n\n> 最近 Ambient\
    \ Light Sensor API 暴出了安全问题。我建议你阅读 W3C 规范以检查它的未来。\n\n让我们创建一个根据当前环境光亮度（或周围区域的亮度）更改页面颜色的示例。\n\
