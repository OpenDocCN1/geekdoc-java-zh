    One solution is to override the percentage width of the column-8 class at relevant
    breakpoints. For example:'
  - "[PAGE 77]\n\n```\nsection.showlisting.column-8 {\n  width: 100%;\n}\n...\n@media\
    \ only screen and (min-width: 992px) {\n  ...\n  section.showlisting.column-8\
    \ {\n    width: 66%;\n  }\n  ...\n}\n```\n\nBut this is a poor solution, and you'll\
    \ soon lose track of what class equals what size.\n\nYou could change the class\
    \ applied to the div with JavaScript, and in the past, this was a solution to\
    \ the problem. But instead, I'll show you some more modern (and better) options\
    \ that will make the principle of grids more useful for responsive design.\n\n\
    # Flexbox\n\nWhile the \"column method\" above isn't that hard to understand and\
    \ implement, as your layouts become more complex you can start to introduce a\
    \ lot of nested divs and CSS styles to support them. The example above used float\
    \ to position elements into the desired position. As the example was simple, it\
    \ wasn't too hard to achieve this, but as grids get more complex, especially nested\
    \ grids, floats quickly become messy, and the solutions to cope with aren't ideal.\n\
    \nThe CSS Flexible Box (\"flexbox\") Layout Module is a recent part of the CSS\
    \ spec and already enjoys good browser support. It was designed to provide a better\
    \ and more modern solution for this type of layout, offering you specific functionality\
    \ for the task.\n\nAfter an initial page restructure and learning new concepts,\
    \ you'll find that using flexbox for your page components will drastically simplify\
    \ your HTML structure and CSS classes."
  - "[PAGE 78]\n\n# Jump Start Responsive Web Design\n\nEverything that you want flexbox\
    \ to manage is contained within a “flex container”. Much like earlier examples,\
    \ begin with the code from the start of this chapter and continue to use a containing\
    \ div:\n\n```\n<div class=\"container\">\n...\n</div>\n```\n\nAnd the CSS for\
    \ this container:\n\n3-14. Chapter3/flexbox/layout.css (excerpt)\n```css\n.container\
    \ {\n  display: flex;\n  flex-flow: row wrap;\nn```\n\nThe display property is\
    \ set to flex to enable flexbox layout. The flex-flow property is shorthand for\
    \ two other properties.\n\nThe first of these properties is flex-direction, which\
    \ defines how the individual items inside a flex container will be placed. The\
    \ two most common values are row and column. Using row will place items horizontally\
    \ (left to right or right to left, depending on your preference). Column works\
    \ similarly, but instead places elements from top to bottom. You can reverse the\
    \ direction by appending with -reverse.\n\nThe flex display mode is one-dimensional\
    \ (running either horizontally or vertically) and will attempt to keep fitting\
    \ items on one line. The flex-wrap property determines what will happen if the\
    \ container can’t fit all items on one line. The items can be set to wrap to the\
    \ next line or be forced into one line with nowrap.\n\nNext, let’s handle the\
    \ header, nav, and footer page elements, which fill the entire width of the page\
    \ container. Replace any existing styles with the following:"
  - "[PAGE 79]\n\n# Better Responsive Structures with Grid Systems 67\n\n```\nheader,\
    \ nav, footer {\n  flex: 100%;\n}\n```\n\nflex is shorthand for three combined\
    \ properties, in the following order:\n\n+   - flex-grow determines how much space\
    \ an item is allowed to use in a container, and the sizes are relative to each\
    \ other. If every item in a container has a flex-grow value of 1, then each item\
    \ is evenly distributed. If one item has a value of 2, it will take up twice as\
    \ much space as the other items.\n- flex-shrink determines whether or not an item\
    \ can shrink to less than its flex-shrink value, and so, to which value. The default\
    \ is 1, so if you want to keep proportions no matter what, leave the value empty.\n\
    - flex-basis allows you to set a default item size before space is distributed,\
    \ any of the typical CSS sizing units.\n\nMoving to the main content area, again\
    \ replacing replacing any existing styles, you can also remove any of the previous\
    \ methods for resizing elements inside media queries:"
  - "[PAGE 80]\n\n# 68 Jump Start Responsive Web Design\n\n```\nmain {\n  flex-grow:\
    \ 2;\n  flex-basis: 66%;\n}\naside {\n  flex-grow: 1;\n  flex-basis: 33%;\n}\n\
    ...\n@media only screen and (min-width: 320px) {\n  aside {\n    display: none;\n\
