    \ 150\n\n# Preface\n\nThe pixel-perfect web is dead. The days of positioning elements\
    \ on a web page and expecting them to always display how we wanted is a distant\
    \ memory; we now cope with the constant barrage of new and varied devices that\
    \ our designs need to look fantastic on.\n\nThis book aims to get you started\
    \ understanding and using the suite of CSS and HTML tools for responding to this\
    \ new world of devices. It will introduce you to the building blocks that help\
    \ your pages adapt to different devices, take this a step further with grids,\
    \ show you how to make text and images readable on all devices, and in the final\
    \ chapter, cover how to utilize more esoteric capabilities.\n\nLet’s get started.\n\
    \n# Who Should Read This Book\n\nThis book is for web designers and front-end\
    \ developers. You'll need to be familiar with HTML and CSS, but no previous responsive\
    \ web design experience is required. Some JavaScript familiarity is useful for\
    \ the latter parts of the book.\n\n# Conventions Used\n\nYou'll notice that we've\
    \ used certain typographic and layout styles throughout this book to signify different\
    \ types of information. Look out for the following items.\n\n# Code Samples\n\n\
    Code in this book is displayed using a fixed-width font, like so:\n\n```html\n\
    <h1>A Perfect Summer's Day</h1>\n<p>It was a lovely day for a walk in the park.\
    \ The\n```\n\nbirds were singing and the kids were all back at school.</p>\n\n\
    If the code is to be found in the book's code archive, the name of the file will\
    \ appear at the top of the program listing, like this:\n\n```css\n0-1. example.css\n\
    .footer {\n  background-color: #CCC;\n  border-top: 1px solid #333;\n}\n```\n\n\
    If only part of the file is displayed, this is indicated by the word *excerpt*:\n\
    \n```css\n0-2. example.css (excerpt)\n.footer {\n  background-color: #CCC;\n \
    \ border-top: 1px solid #333;\n}\n```\n\nIf additional code is to be inserted\
    \ into an existing example, the new code will be displayed in bold:\n\n```javascript\n\
    function animate() {\n  new_variable = \"Hello\";\n}\n```\n\nWhere existing code\
    \ is required for context, rather than repeat all of it, will be displayed:\n\n\
    ```javascript\nfunction animate() {\n  :\n  new_variable = \"Hello\";\n}\n}\n\
    ```\n\nSome lines of code should be entered on one line, but we've had to wrap\
    \ them—because of page constraints. An ↩ indicates a line break that exists for\
    \ formatting purposes only, and should be ignored:\n\n```javascript\nURL.open(\"\
    http://www.sitepoint.com/responsive-web-design-real-user-testing/?responsive1\"\
    );\n```\n\n# Tips, Notes, and Warnings\n\n> Hey, You!\n> Tips provide helpful\
    \ little pointers.\n\n> Ahem, Excuse Me ...\n> Notes are useful aside that are\
    \ related—but not critical—to the topic at hand. Think of them as extra tidbits\
    \ of information.\n\n> Make Sure You Always ...\n> pay attention to these important\
    \ points.\n\n> Watch Out!\n> Warnings highlight any gotchas that are likely to\
    \ trip you up along the way.\n\n# Supplementary Materials\n\n- The book's code\
    \ archive contains downloadable code and sample videos to accompany the examples\
    \ presented.\n- https://www.sitepoint.com/community/ are SitePoint's forums, for\
    \ help on any tricky web problems.\n- books@sitepoint.com is our email address,\
    \ should you need to contact us to report a problem, or for any other reason.\n\
    \n# Chapter 1\n\n## The Meaning and Purpose of Responsive Web Design\n\nIt used\
    \ to be so simple: you'd design a website or application for a 15-inch monitor,\
    \ and—incompatibilities between browsers aside—you were done.\n\nThen mobile phones\
    \ with web browsers came aside and ruined our easy lives. Worst of all, people\
    \ loved browsing the Web on them!\n\n> The Rise of Mobile\n> In 2016, browsing\
    \ the web on mobile devices overtook desktop browsing for the first time.\n"
