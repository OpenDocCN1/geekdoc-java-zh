    \n> 5–4. The effect of the changed image styles\n\nThis will set the image width\
    \ to 100% of its container's width, and setting image's height to auto allows\
    \ the image to occupy as much vertical space needed to maintain its natural proportions.\
    \ You'll notice that this means the images don't currently have all the same height,\
    \ which affects the layout. You could swap these verses to instead fill 100% of\
    \ the height and fill the width automatically. Attempting to make images always\
    \ fix precision dimensions can be a compromising challenge that depends on a lot\
    \ on the source of the images. If you're able, it might be best to edit them first\
    \ so they all have the same dimensions.\n\nUsing width: 100% can mean that images\
    \ will scale larger than their original size and render pixelated. To prevent\
    \ this, try using max-width or max-height on the thumbnail styles relevant to\
    \ each breakpoint.\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_122_3.png)\n\n\
    So that's it, you're done, right? Unfortunately, no. Inspect one of the images\
    \ in your web inspector and you'll notice that all we're resizing a very large\
    \ image. Even though it looks small, the actual file is still large, adding a\
    \ lot of page weight. Look at the network requests: these five images nearly 4MB,\
    \ which is a lot of data for a mobile user to load. To make your images fully\
    \ responsive, you need to make the right file is to the device right.\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_123_0.png)\n\
    \n5-5. Image sizes\n\n## The Right Image for the Right Device\n\nThere are two\
    \ methods for handling images responsive. One is srcset, an attribute to the img\
    \ tag you already know, and the other is the new HTML5 picture element. Both methods\
    \ use media query syntax to select the image most suited to the device capabilities,\
    \ but srcset allows the browser to make the final decision on what image to render,\
    \ and picture explicitly tells the browser which image to render. For most cases,\
    \ srcset will be all you need, but for design heavy sites when you want more control\
    \ over how a browser renders (e.g. cropping an image instead of resizing it) then\
    \ the picture tag will suit you better.\n\nMuch like the CSS rules loaded by your\
    \ media queries, what image sizes you use and support is up to you and your use\
    \ case. The example project is moderately optimized, but could be better. For\
    \ example, we could reduce the maximum size of images loaded on smaller screens.\
    \ The queries can take the same format as those outlined in Chapter 2.\n\nI created\
    \ each of the images needed for the design manually, giving them a width roughly\
    \ matching the maximum width the image will be displayed at:\n\n- Small Image:\
    \ 320px wide.\n- Medium Image: 480px wide.\n- Large Image: 768px wide.\n\nCreating\
    \ different versions of images manually is tedious, but gives you control over\
    \ what gets shown in each image size. If you'd rather automate the generation\
    \ of these images, there are several options, such as:\n\n- batch processing in\
    \ an image editor like Photoshop or XView (Windows).\n- batch processing with\
    \ a build tool such as Gulp.\n- using a plugin for your CMS or static site generator,\
    \ which is likely a wrapper around the popular imagagick or OptiPNG libraries.\n\
    \n```\nsrcset\n```\n\nReplace the existing image element with the following:\n\
    \n```html\n<section class=\"tshow\">\n  <h3>show1-medium.jpg</h3>\n  <img src=\"\
    ../images/show1-medium.jpg\"\n       srcset=\"../images/show1-small.jpg 320w,\n\
    \            ../images/show1-large.jpg 768w\"\n       sizes=\"(max-width: 768px)\
    \ 480px,\n            (max-width: 1800px) 320px, 768px\"\n       class=\"thumbnail\"\
    \ />\n  <p class=\"showdescription\">Lorem dolor sit amet, consectetur adipiscing\
