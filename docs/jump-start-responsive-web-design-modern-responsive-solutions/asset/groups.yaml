    \ flexbox layout\n\nOne other cool flexbox trick is to set the order of elements\
    \ using the order property, and a number that defines its position. For example,\
    \ you could use the following to rearrange page elements on a mobile device:\n\
    \n```\nnav { order: 1;}\nheader { order: 2;}\nmain { order: 3;}\nfooter { order:\
    \ 4;}}\n```\n\n## Better Responsive Structures with Grid Systems 71\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_83_0.png)\n\
    \nBut if you wanted to remove page elements, you'd still need to use media queries.\n\
    \nThis has been a brief example of how to use flexbox, but as you can see, once\
    \ you've restructured your page, flexbox handles a lot of the manual page reflowing\
    \ for you.\n\n## CSS Grid Layout\n\nComplementary to flexbox is the CSS Grid Layout\
    \ Module, which helps you define and lay out the regions of a page. In the past,\
    \ the main option open to web\n\n> 19. Setting the order of page elements\n\n\
    ## 72 Jump Start Responsive Web Design\n\ndevelopers for flexible (I use this\
    \ term loosely) page layouts was using HTML tables to define page areas with rows\
    \ and columns, but these were terrible for accessibility. The grid layout is something\
    \ of a modern re-interpretation of concept.\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_84_0.png)\n\
    \n## Browser Support for Grid Layout\n\nGrid shipped for all the newest versions\
    \ of the major browsers in early 2017, so a fallback strategy is required if your\
    \ layouts needs to be supported in older browsers. You can check online for details\
    \ on which browser versions do and don't Grid.\n\nLet's try applying the grid\
    \ layout to the demo site, starting with the code from the beginning of this chapter.\n\
    \nAgain, make a container div inside the body to contain the layout:\n\n```\n\
    ...\n<div class=\"container\">\n...\n</div>\n...\n```\n\nMove the aside from inside\
    \ main to outside of it. This lets you treat it like a proper column in its own\
    \ right:\n\n```\n3-20. Chapter3/grid/index.html (excerpt)\n...\n</main>\n<aside\
    \ class=\"left\">\n<ul>\n<li>one</li>\n<li>two</li>\n<li>three</li>\n</ul>\n</aside>\n\
    ```\n\n## Better Responsive Structures with Grid Systems 73\n\nIn the CSS, change\
    \ the display type to grid:\n\n```\n.container {\n  display: grid;\n}\n```\n\n\
    Now the grid display gets really cool. Add the following:\n\n3-21. Chapter 3/grid/layout.css\
    \ (excerpt)\n\n```\n.container {\n  display: grid;\n  grid-template-columns: 66%\
    \ 33%;\n}\n```\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_85_0.png)\n\nWith the\
    \ flexbox layout, you can also take this opportunity to remove all the other sizing\
    \ overrides in media queries. In one simple CSS property, you've removed the need\
    \ for classes. The grid-template-columns property gives you more possibilities.\
    \ For example:\n\n- You can use any standard sizing unit for defining the column,\
    \ including auto to fill remaining space.\n- You can use fr (\"fractional units\"\
    ) to let the grid proportionally space. So you could rewrite this grid as grid-template-columns:\
    \ 2fr 1fr; which means that the first column will fill two-thirds of the space,\
    \ and the second third.\n\nGreat, but if you look at the demo site, you'll notice\
    \ that the rows in the design don't have a 66/33 split look right. This is because\
    \ you also need to define the rows with similar syntax:\n\n## 74 Jump Start Responsive\
    \ Web Design\n\n```\n.container {\n  display: grid;\n  grid-template-columns:\
    \ 66%;\n  grid-template-rows: 80px 80px auto 20px;\n}\n```\n\n## How Many Rows?\n\
    \nThis is the first example where we've needed to explicitly define rows, and\
    \ there are a couple of ways you could do it. I suggest there are four rows: the\
    \ title, the top menu, the introductory text and the footer. If you want to change\
    \ these divisions (for example, splitting the description and shows), feel free\
    \ to do so.\n\nThe syntax specifies a set height for three elements and then lets\
    \ the remaining element fill the empty space.\n\nBut again, if you load the page\
    \ in the browser, little has changed. In fact, the footer has now jumped up the\
    \ page. This is because there's one more step—to add the sub-elements into the\
    \ grid:\n\n## Better Responsive Structures with Grid Systems\n\n## Site Name\n\
