  - "[PAGE 142]\n\n# Battery Level\n\nThe HTML5 Battery Status API allows you to check\
    \ the current battery level of a device and respond accordingly.\n\n# Security\
    \ Concerns\n\nThere have been recent security concerns surrounding the Battery\
    \ Status API, so read the W3C specification for news on its future.\n\nMobile\
    \ devices (and laptops) are prone to running out of battery power when you need\
    \ it, so for this (mostly illustrative) example, let's help our users by noticing\
    \ when their battery level is low and making the page less responsive.\n\nDarker\
    \ colors can reduce the battery impact on certain device screens (especially AMOLED\
    \ screens), so the colors for the page are already reasonably battery friendly,\
    \ but let's see how we can react to the battery level.\n\nA JavaScript method\
    \ is available to get a variety of information about a device's battery.\n\nAdd\
    \ the following code inside the index.js file to check if the browser supports\
    \ the feature. If it does, then get the battery level, which is a value between\
    \ 0 (empty) and 1 (full):\n\n```\nnavigator.getBattery().then(function (battery)\
    \ {\n  var level = battery.level;\n  console.log(level);\n});\n```\n\nIf it's\
    \ less than 20% (0.2), add a CSS class that reduces color brightness, and remove\
    \ images from the DOM (since loading and displaying images can impact battery\
    \ life, and every little bit less):\n\n```\nif (level < 0.2) {\n  body = document.getElementsByTagName('body');\n\
    ```"
