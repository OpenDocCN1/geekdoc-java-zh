  mdcn: "\n\n# 媒体类型\n\n你可以通过多种方式调用依赖媒体查询的样式，最常见的方法是使用 HTML `link` 元素链接一个或多个 CSS 文件，或者直接在\
    \ CSS 文件中使用 `@import`。\n\n在 HTML 中，此示例如果查询为真将加载 `style.css` 文件，这在所有设备类型上都是真的：\n\
    \n```\n<link rel=\"stylesheet\" media=\"all\" href=\"/style.css\">\n```\n\n在下面的示例中，`@import`\
    \ 作用相同，但在 CSS 文件内部实现：\n\n```css\n@import url(\"/style.css\");\n```\n\n在下面的示例中，`@media`\
    \ 规则包含一组特定的选择器，如果查询为真则将加载它们：\n\n```css\n@media all {\n  ...\n}\n```\n\n这些查询中的\
    \ `all` 是媒体类型。目前有四种可用的媒体类型（编写时）：\n\n- print：用于页面的打印版本\n- screen：用于电脑、平板和手机屏幕\n\
    - speech：用于向用户读取页面的屏幕阅读器\n- all：用于以上所有类型\n\n# 响应式设计的构建模块 23\n\n添加媒体类型允许你指定查询适用于哪些类型的设备。这些是宽泛的，无法提供很多控制。为了更具体地针对某些设备，你可以向这些媒体类型添加表达式。\n\
    \n# 创建查询\n\n让我们尝试一些实用的东西。RWDflix 中主内容侧的 `aside` 设计用于显示公告和新闻。手机和平板电脑访问者可能只想专注于看节目，而不想要其他，所以让我们为较小屏幕设备的用户隐藏此元素。\n\
