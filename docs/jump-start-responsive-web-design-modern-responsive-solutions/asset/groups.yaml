  mdcn: "\n\n# 快速上手响应式网页设计\n\n| 站点名称 |\n| :--- |\n| 菜单项 | 菜单项 | 菜单项 |\n| 站点介绍 |\n\
    | Lorem ipsum dolor sit amet, consectetur adipiscing elit. Septem autem illum\
    \ non nonip, sed popularum suffragio omnium nominati sunt. Eaque assail rutrum\
    \ id etione serus non reliquit. Vidimus (ugit ut consequer non tantas posuere.\
    \ Quod iam a me expectare noi. |\n\n显示 2\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_122_0.png)\n\
    \n显示 1\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_122_1.png)\n\nLorem ipsum dolor\
    \ sit amet, consectetur adipiscing elit.\n\nLorem ipsum dolor sit amet, consectetur\
    \ adipiscing elit.\n\n显示 3\n\n显示 4\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_122_2.png)\n\
    \n> 5–4. 更改图像样式的效果\n\n这将把图像宽度设置为其容器宽度的 100%，并将图像高度设置为 `auto`，从而允许图像占据保持其自然比例所需的任何垂直空间。你会注意到，这意味着图像目前没有具有相同的高度，这影响了布局。你可以调换这些段落，转而填充\
    \ 100% 的高度并自动填充宽度。尝试让图像始终固定精确尺寸可能是一个折中的的挑战，这在很大程度上取决于图像的来源。如果可以，最好先编辑它们，让它们具有相同的尺寸。\n\
    \n使用 `width: 100%` 可能意味着图像将放大到比原始尺寸更大并导致像素化。为了防止这种情况，请尝试在与每个断点相关的缩略图样式上使用 `max-width`\
    \ 或 `max-height`。\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_122_3.png)\n\n就那样，你完成了，对吧？遗憾的是，并没有。在你的网页检查器中检查一张图像，你会发现我们只是在调整一张非常大的图像。尽管它看起来很小，但实际文件仍然很大，增加了大量的页面权重。查看网络请求：这五张图像几乎有\
    \ 4MB，对于移动用户加载来说是大量的数据。要让你的图像完全完全响应式，你需要为正确的设备提供正确的文件。\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_123_0.png)\n\
    \n5-5. 图像尺寸\n\n## 为正确的设备选择正确的图像\n\n处理响应式图像有两种方法。一种是 `srcset`，你已经知道的 `img` 标签的一个属性，另一种是新的\
    \ HTML5 `picture` 元素。这两种方法都使用媒体查询语法来选择最适合设备能力的图像，但 `srcset` 允许浏览器对渲染哪张图像做出最终决定，而\
    \ `picture` 则明确告诉浏览器渲染哪张图像。对于大多数情况，`srcset` 就是你需要的所有，但对于设计密集型网站，如果你希望对浏览器渲染方式有更多控制权（例如裁剪图像而不是缩放图像），那么\
    \ `picture` 标签会更适合你。\n\n就像通过媒体查询加载的 CSS 规则一样，你使用和支持的图像尺寸取决于你和你的用例。示例项目经过了优化，但还可以更好。例如，我们可以减少在较小屏幕上加载的图像的最大尺寸。查询可以采用与第二章概述的相同的格式。\n\
    \n我手动创建了设计所需的每张图像，并提供的宽度大致匹配图像显示时的最大宽度：\n\n- 小图像：320px 宽。\n- 中等图像：480px 宽。\n-\
    \ 大图像：768px 宽。\n\n手动创建不同版本的图像很枯燥，但它让你控制在每个图像尺寸下显示的内容。如果你倾向于自动生成这些图像，有几种选择，例如：\n\
