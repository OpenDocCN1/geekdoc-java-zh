    \ column, added to the margin value multiplied by the number of columns minus\
    \ 1.\n\nOr as a formula:\n```\nSingleColumnWidth = (100 - (MarginValue * (NumberOfColumns\
    \ - 1))) / NumberOfColumns\n```\n"
