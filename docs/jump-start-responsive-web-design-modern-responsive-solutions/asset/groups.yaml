  - "[PAGE 150]\n\n# Based on Network\n\nThe example site is a video site, and while\
    \ we currently have the clickable images allowing a viewer to only load a video\
    \ file when they wish too, we could make this more flexible based on the device's\
    \ network connection. Or even better, we could create a preference that users\
    \ set if they want this feature.\n\nThe Network Information API is not widely\
    \ supported (currently only Chrome on Android), but browser manufacturers move\
    \ quickly, so it may be better supported by the time you decide to implement it.\n\
    \nFirst, the easiest (and most supported) check is to see if the user is online\
    \ at all:\n\n```\nif (navigator.onLine) {\n  // Do something\n}\n```\n\nGranted,\
    \ this has limited use in the example, unless you want to check if the user has\
    \ become disconnected before attempting to play a video. Still, it's a good idea\
    \ to cover all bases.\n\nWhile the Network Information API lets you check all\
    \ sorts of values, it's not much use right now. There are third-party (paid) services\
    \ for checking internet speeds, but currently, the \"best\" solution is using\
    \ complex code to check how long an image takes to load, and calculate speed from\
    \ that. I won't reproduce it here, but if you're interested, there's some helpful\
    \ information on Stack Overflow.\n\n> Browser Support\n\nWhile the Network Information\
    \ API is still in a draft state, it's an active proposal, so by the time of reading\
    \ it may be better supported. You can find out its current status on the API's\
    \ community group site."
  - "[PAGE 151]\n\n# User Preference\n\nYou have likely experienced cookies in your\
    \ day-to-day web browsing. Cookies are typically used to retain state as preferences.\
    \ They can be set or read by the client or server and are transmitted within every\
    \ HTTP request. This example will read user preferences and display page elements\
    \ accordingly.\n\nOften the browser will write a cookie when a user submits a\
    \ form or undertakes some other action. For this example, we'll write a setting\
    \ manually:\n\n```\nwindow.addEventListener(\"load\",function(event) {\n  document.cookie\
    \ = \"mature=no\";\n\n},false);\n```\n\nThis determines if the user wants to see\
    \ videos \"mature\" content. Using this value, we can use the same technique for\
