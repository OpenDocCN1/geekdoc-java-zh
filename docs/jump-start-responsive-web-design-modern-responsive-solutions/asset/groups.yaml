  - "[PAGE 71]\n\n# Better Responsive Structures with Grid Systems 59\n\n```\nColumnWidth\
    \ = (SingleColumnWidth * CurrentColumn) + \n(MarginValue * (CurrentColumn - 1))\n\
    ```\n\nAs an example, here's how to find the value required to span two columns:\n\
    \n```\n(SingleColumnWidth * CurrentColumn)\n6.866666666667 * 2 = 13.7333333333\n\
    \n(CurrentColumn - 1)\n2 - 1 = 1\n\n(MarginValue * (CurrentColumn - 1))\n1.6 *\
    \ 1 = 1.6\n\n(SingleColumnWidth * CurrentColumn) + (MarginValue *\n(CurrentColumn\
    \ - 1))\n13.7333333333 + 1.6 = 15.3333333333\n```\n\nThis will result in the following\
    \ column styles, with the column-n class representing the number of columns you\
    \ want to span. Add these to layout.css:"
  - "[PAGE 72]\n\n```\n.column-1 {\n  width: 6.86666666667%;\n}\n.column-2 {\n  width:\
    \ 15.33333333333%;\n}\n.column-3 {\n  width: 23.8%;\n}\n.column-4 {\n  width:\
    \ 32.26666666667%;\n}\n.column-5 {\n  width: 40.73333333333%;\n}\n.column-6 {\n\
    \  width: 49.2%;\n}\n.column-7 {\n  width: 57.66666666667%;\n}\n.column-8 {\n\
    \  width: 66.13333333333%;\n}\n.column-9 {\n  width: 74.6%;\n}\n.column-10 {\n\
    \  width: 83.06666666667%;\n}\n```"
  - "[PAGE 73]\n\n```\n.column-11 {\n  width: 91.53333333333%;\n}\n\n.column-12 {\n\
    \  width: 100%;\n}\n```\n\nAgain, don't worry about remembering what these values\
    \ are. Once they're defined, all that's needed is to use the CSS class.\n\n# Saving\
    \ Some Legwork\n\nYou could also use a CSS preprocessor—such as Sass or Less—that\
    \ provides an extra framework to help generate repetitive and complex CSS for\
    \ you. Among other features, this includes making the calculations above for you.\n\
    \nNow you want the header and nav bar to always take 12 columns to better fit\
    \ into the grid model, so let's rearrange the header and navigation elements into\
    \ rows and add appropriate column classes. These are the base column class and\
    \ column-12 to fill 12 columns:\n\n```\n<header class=\"row\">\n<h1 class=\"column\
    \ column-12\">Site Name</h1>\n</header>\n<nav class=\"row\">\n<ul class=\"column\
    \ column-12\">\n<li><a href=\"#\">Menu Item</a>/</li>\n<li><a href=\"#\">Menu\
    \ Item</a>/</li>\n<li><a href=\"#\">Menu Item</a>/</li>\n</ul>\n</nav>\n```\n\n\
    The left content area needs to be nine columns wide, and the three columns, so\
    \ add these classes:"
  - "[PAGE 74]\n\n```\n<section class=\"showlisting column column-9\">\n...\n</section>\n\
    \n<aside class=\"column column-3\">\n...\n</aside>\n```\n\nNow add column classes\
    \ to the TV shows inside the content area:\n\n```\n<section class=\"tvshow column\
    \ column-2\">\n--\n</section>\n```\n\nIn the tvshow class you can now remove the\
    \ width and display properties and change the height to auto for more responsive\
