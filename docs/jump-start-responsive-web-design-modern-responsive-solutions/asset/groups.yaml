    \ 3/vanilla_final/layout.css (excerpt)\n\n```\n.row,\n.column {\n  box-sizing:\
    \ border-box;\n}\n\n.row:before {\n  content: \" \";\n  display: table;\n}\n\n\
    .row:after {\n  clear: both;\n}\n\n.column {\n  position: relative;\n  float:\
    \ left;\n}\n\n.row + .column {\n  margin-left: 1.6%;\n}\n```\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_69_0.png)\n\
    \n# Using the Adjacent Sibling Selector\n\n> The adjacent sibling selector (+)\
    \ above is a useful CSS trick that adds a margin only to the matching element\
    \ following another matching element. In our case, it means that the first column\
    \ won't have a left margin.\n\nThe first step is to define the width of one column,\
    \ not forgetting the margin between each column.\n\nA single column width is equal\
    \ to 100 (as we're working with percentages) minus the margin value, multiplied\
    \ by the number of columns minus 1 (you don't need a left margin in the first\
    \ column), all divided by the number of columns."
