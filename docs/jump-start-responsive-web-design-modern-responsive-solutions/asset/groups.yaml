    # Get Visual


    And there you have it: in this chapter, we''ve added a lot to flesh out the sample
    site with images and video, making it feel much more like a proper web page. As
    you can see, pictures are now a lot easier to make responsive. New tools and libraries
    have made responsive images much simpler and comprehensive than they used to be.
    Videos still require more work, but at least the days of complex media plugins
    are behind us.


    In the next chapter, we''ll polish the page with techniques for reacting to the
    capabilities of a user''s browser, location, data and other “adaptive” techniques.'
  - '[PAGE 139]


    # Chapter 6


    # Responding to User Context


    Our example page is now responsive, and will work well on a wide variety of devices—scaling
    layout, images, media and text to suit.


    In this final chapter, we''ll look at techniques for adjusting user experience
    based based on user context or preference. A real-world application would react
    to a lot of these situations from the back end, serving appropriate content to
    suit each case. Still, it''s interesting to understand the different ways and
    reasons an interface can change, and I hope this chapter gives an idea of what''s
    possible.


    # An API for Everything


    Modern HTML and JavaScript let you check for a wide variety of parameters and
    then adapt what users see. The media-heavy nature of our demo site gives a lot
    of'
  - '[PAGE 140]


    # Jump Start Responsive Web Design


    potential to vary how content is served to users. For example, family-friendly
    shows can be served before a certain time of day, and more adult shows afterward;
    users can be offered the choice to play a video only if there''s an appropriate
    internet connection available.


    # Based on Time


    Some of the TV shows listed contain more adult content than others, and we should
    highlight them in the listings if it''s earlier than 7.00 p.m. in the user''s
    location, to indicate they shouldn''t be watched by younger members of the family.


    +   Modifying the HTML


    I added the evening class to a couple of the tvshow sections. Go ahead and add
    the class to several of the section elements before adding the JavaScript below.


    In index.js, add the following code to get the local time, and then extract the
    hour:


    ```

    var localNow = new Date();

    var localTime = localNow.getHours();

    ```


    Now, build an array of all the elements with the tvshow class:


    ```

    tvShows = document.getElementsByClassName(''tvshow'');

    ```


    Loop through the array of TV shows and add the highlight class to any show if
    the time is earlier than 7.00 p.m. and it has the evening class:'
  - "[PAGE 141]\n\n```\nvar j;\nfor (j = 0; j < tvShows.length; j++) {\n  if ((localTime\
    \ <= j) &&\n    (tvShows[j].classList.contains('evening'))) {\n      tvShows[j].classList.add('highlight')\n\
    \  }\n}\n```\n\nNext, write a CSS rule that adds a subtle highlight to shows you\
    \ might want to exercise caution over:\n\n```\nsection.tvshow.highlight {\n  background:\
    \ rgba(255, 0, 0, 0.2);\n}\n```\n\nAdd a new div to index.html to let users know\
    \ what the highlight means:\n\n```\n<section class=\"showlisting left\">\n  <h2>Welcome</h2>\n\
    \  <p>RWNetflix brings you the best videos where and when you want them.<i>You\
    \ are advised that shows highlighted contain more mature content.</i></p>\n```\n\
    \nAnother idea for responding to the time of day is to filter the level of blue\
    \ light in the site to reduce eye strain or aid sleep, and the example later in\
    \ this chapter that covers the Ambient Light Sensor API does something similar.\
    \ You may have used applications like Flux that perform this function on a system\
    \ level. If you offer this option, it should be something a user opts into and\
    \ that doesn't happen automatically."
- md: "\n## Battery Level\n\nThe HTML5 Battery Status API allows you to check the\
    \ current battery level of a device and respond accordingly.\n\n## Security Concerns\n\
    \nThere have been recent security concerns surrounding the Battery Status API,\
    \ so read the W3C specification for news on its future.\n\nMobile devices (and\
    \ laptops) are prone to running out of battery power when you need it, so for\
    \ this (mostly illustrative) example, let's help our users by noticing when their\
    \ battery level is low and making the page less responsive.\n\nDarker colors can\
    \ reduce the battery impact on certain device screens (especially AMOLED screens),\
    \ so the colors for the page are already reasonably battery friendly, but let's\
    \ see how we can react to the battery level.\n\nA JavaScript method is available\
    \ to get a variety of information about a device's battery.\n\nAdd the following\
    \ code inside the index.js file to check if the browser supports the feature.\
    \ If it does, then get the battery level, which is a value between 0 (empty) and\
    \ 1 (full):\n\n```javascript\nnavigator.getBattery().then(function (battery) {\n\
    \  var level = battery.level;\n  console.log(level);\n});\n```\n\nIf it's less\
    \ than 20% (0.2), add a CSS class that reduces color brightness, and remove images\
    \ from the DOM (since loading and displaying images can impact battery life, and\
    \ every little bit less):\n\n```javascript\nif (level < 0.2) {\n  body = document.getElementsByTagName('body');\n\
    \  images = document.getElementsByName('img');\n  var i;\n  for (i = 0; i < images.length;\
    \ i++) {\n    images[i].remove();\n  }\n  body.classList.add('battery-save');\n\
    }\n```\n\nAdd the new battery-save styling to your CSS, reducing the brightness\
    \ of the page text:\n\n```css\n.battery-save {\n  color: gray;\n}\n```\n\nWhether\
    \ color schemes actually save battery life is a controversial topic that depends\
    \ a lot on the device screen, but it might be worth experimenting. Other, more\
    \ definite ideas for helping users save battery are:\n\n- reducing network calls\
    \ and traffic\n- reducing the amount of client-side processing by removing less\
    \ essential JavaScript.\n- reducing animations and effects\n\nAlthough we removed\
    \ images from the DOM with JavaScript, they're still loaded before being hidden.\
    \ This contradicts the maxim of reducing network calls. As JavaScript only allows\
    \ you to change an already existing page structure, you need to change what gets\
    \ delivered to the browser in the first place. To make this work, you need to\
    \ rethink the page structure to make it more mobile friendly.\n\nAdd classes to\
    \ the current HTML to identify each TV show:\n\n```html\n<section class=\"show1\"\
    >\n...\n</section>\n<section class=\"show2\">\n...\n</section>\n```\n\nNow remove\
    \ all the picture and video tags from each tvshow section, massively reducing\
    \ the HTML file. Back in index.js, replace what is already there with the following\
    \ code, which takes concepts we’ve already used in previous chapters (clicking\
    \ the image for a video) and consolidates it:\n\n```javascript\nwindow.addEventListener(\"\
    load\",function(event) {\n  navigator.getBattery().then(function(battery) {\n\
    \    // Get the battery level, and load images if enough\n    var level = battery.level;\n\
    \    if (level > 0.2) {\n      // Find all 'tvshow' divs and loop through them\
    \ all\n      tvShows = document.getElementsByClassName(\"tvshow\");\n      var\
    \ i;\n      for (i = 0; i < tvShows.length; i++) {\n        tvShow = tvShows[i];\n\
    \        // Get the show name\n        showName = tvShow.classList[1];\n     \
    \   // Create a picture element\n        var newPictureNode = document.createElement(\"\
    picture\");\n        // Set the source and classes for the picture, but the show\
    \ name is passed to\n        // identical to examples, and generate for each\n\
    \        var pictureInnerHTML = '<source src=\"../images/' + showName + '-small.jpg\"\
    \ media=\"max-width:320px)\" class=\"thumbnail\"><source src=\"../images/' + showName\
    \ + '-medium.jpg\" media=\"(min-width:320px) and (max-width:480px)\" class=\"\
    thumbnail\"><source src=\"../images/' + showName + '-large.jpg\" media=\"(min-width:480px)\"\
    \ class=\"thumbnail\"><img src=\"../images/' + showName + '-medium.jpg\" class=\"\
    thumbnail\">';\n        newPictureNode.innerHTML = pictureInnerHTML;\n       \
    \ // Add an event listener to the picture\n        newPictureNode.addEventListener('click',\n\
    \        toggle_visibility, false);\n\n        // Also generate the video HTML\
    \ in the same way\n        var newVideoNode = document.createElement(\"video\"\
    );\n        var videoInnerHTML = '<source src=\"../videos/' + showName + '.mp4\"\
    \ type=\"mp4\"><source src=\"../videos/' + showName + '.ogv\" type=\"video/ogg\"\
    >Your browser does not support HTML5 video tag>';\n        newVideoNode.setAttribute(\"\
    controls\", \"controls\");\n        newVideoNode.setAttribute(\"poster\", \"../images/\"\
    \n        showName + '-medium.jpg');\n        newVideoNode.setAttribute(\"preload\"\
    , \"none\");\n        newVideoNode.innerHTML = videoInnerHTML;\n\n        // Insert\
    \ the new image and video in the correct place\n        var nextNode =\n     \
    \     tvShow.getElementsByClassName('showdescription');\n        tvShow.insertBefore(newVideoNode,\
    \ nextNode[0]);\n        tvShow.insertBefore(newPictureNode, newVideoNode);\n\
    \      }\n    },false);\n\nfunction toggle_visibility(id) {\n  var e = this;\n\
    \  var v = e.nextSibling\n  v.style.display = 'block';\n  v.play();\n  e.style.display\
    \ = 'none';\n}\n```\n\nWhen the page loads, it checks to see if the battery level\
    \ is above 20%. If so, image and video nodes (elements inside the DOM) are added\
    \ inside each tvshow class, using the class name for the TV show to ensure the\
    \ correct media files are loaded. If the battery is below 20%, only text is displayed.\
    \ Ideally, you should add this functionality to a preference setting, so that\
    \ users don't get an unwanted surprise.\n\nThis took some reorganizing, but now\
    \ the page starts in a mobile friendly state, only loading the heaviest elements\
    \ when the device is in a good state to do so. For the rest of the examples in\
    \ this chapter, we'll use this concept to show how to add different detection\
    \ capabilities. In fact,\n\n## Geolocation\n\nThe HTML5 Geolocation API allows\
    \ you to detect the location of the user. The API can return the latitude and\
    \ longitude of the device, as well as its altitude and accuracy.\n\nThe Geolocation\
    \ API also checks to see if the battery level is above 20%. If so, image and video\
    \ nodes (elements inside the DOM) are added inside each tvshow class, using the\
    \ class name for the TV show to ensure the correct media files are loaded. If\
    \ the battery is below 20%, only text is displayed. Ideally, you should add this\
    \ functionality to a preference setting, so that users don't get an unwanted surprise.\n\
    \nThis took some reorganizing, but now the page starts in a mobile friendly state,\
    \ only loading the heaviest elements when the device is in a good state to do\
    \ so. For the rest of the examples in this chapter, we'll use this concept to\
