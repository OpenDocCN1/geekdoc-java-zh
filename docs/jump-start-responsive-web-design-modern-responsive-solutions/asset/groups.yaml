  - '[PAGE 17]


    # Schools of Thought Within Responsive Design


    There are as many schools of thought about how to use responsive design as there
    are interpretations of it. Some have come and gone, and others have stuck. We
    won''t cover any detail explicitly in this book, but we''ll touch upon their practical
    applications. Let''s quickly cover a few of them now.


    # Progressive Enhancement


    When following the more traditional principle of progressive enhancement, your
    primary focus is on making the site content available to all users, however simple
    their device or slow their connection. Then extra features—such as more sophisticated
    design and functionality—are added for devices that can utilize them.


    # Graceful Degradation


    The proliferation of mobile browsing has reversed the more traditional path of
    design. In the past, you started a design on the platform you worked on (typically
    a computer) and then stripped away style and functionality to support devices
    with smaller screens or less support for certain features.


    While graceful degradation is typically applied to the lack of browser support
    for particular features, you can also think of it more generally. Its principle
    is that you start with a fully featured version of a site, running on your ideal
    device and browser, while also ensuring that essential functionality will work
    for any user on any (supported) device, even if they lose out on nice-to-have
    features.


    # Mobile First


    Mobile first is similar to progressive enhancement, but more specific to responsive
    design. It proposes that you start with your smallest or least capable device
    (typically a phone when the principle was created) and then add functionality
    and style as you increase the device scale.'
  - '[PAGE 18]


    # Mobile First


    As a term, "mobile first" can be confusing, especially to non-designer/developer
    audiences, giving a skewed impression of the priority that mobile will receive
    in a project.


    In theory, the practice ensures that smaller devices don''t end up getting best—that
    all devices are treated with equal importance.


    # What Do You Need to Support?


    Before starting or enhancing any web-based project, it''s important to know if
    it''s worthwhile, and to assess the (potential) userbase for all your hard work.


    If you have an existing website, it may be worth analyzing traffic to see what
    types of devices your visitors are using to access your website. If 90% of visitors
    have consistently visited on a desktop machine, this shows that either your mobile
    experience is poor, or that your visitors are not big device users. You could
    embark on extensive research to find out the exact answer, or simply use responsive
    design techniques to build a mobile-friendly site that may attract new visitors.


    If you''re working on a new project, analyzing the needs of your potential users
    is equally important. This can be done by using traditional market research techniques,
    creating simple test sites, or looking at your competitors to build a picture
    of who your customers will be.


    # Computers


    Despite the slow decline in sales, there are still lots of desktop and laptop
    computers out there, and lots of web browsers running on them. These computers
    include everything from low-quality (and low-resolution) 11-inch netbooks to high-powered
    desktops with 28-inch, high-resolution monitors in a variety of proportions and
    orientations, all of which greatly affect the screen area you have to work with.'
  - '[PAGE 19]


    # The Meaning and Purpose of Responsive Web Design 7


    # Mobile Phones


    The percentage of people browsing websites on mobile phones has now reached parity
    with desktop browsing, so catering for users of mobile browsers is of equal (and
    likely, growing) importance.


    > ### Mobile Browsing Stats


    For more details on the rise of mobile web browsing, I recommend the Smart Insights
    report on Mobile Marketing Statistics and Statcounter''s desktop and mobile usage
    comparison


    On iOS, this is generally through just one browser, and the device''s sizes are
    more consistent.


    Android has a wide variety of browsers and screen dimensions available. Increasing
    numbers of devices running mobile operating systems also have high-density screens
    of varying resolutions.


    You also need to consider that users are largely browsing with touch and not point-and-click
    devices, which affects behavior a great deal.


    # Tablets


    Tablet sales may be shrinking, but there will still be a significanthbase for
    the foreseeable future, and you shouldn''t think of tablets as large mobile phones
    or small desktops. Also, users may be using touch screens or mice to interact
    with your site.


    # Hybrid Devices


    If handling computers and tablets wasn''t enough for you, there are now hybrid
    devices, such as Microsoft''s Surface Pro, that can switch between being a computer
    and a tablet. While each mode can be treated discretely, it''s worth noting that
    users may switch context while using your site.'
  - '[PAGE 20]


    # Jump Start Responsive Web Design


    # Wearables


    Most wearables are yet to gain a web browser, but it may happen. In the meantime,
    it''s still possible to re-purpose parts of your content on wearables, and these
    will need to be delivered in short bursts with an easy follow-up action.


    # TV


    Smart TVs and related devices such as Apple TV come with simplified browsers,
    and users will generally use them for browsing particular sites, but they''re
    likely to become increasingly popular. TVs have very large screens, often with
    low resolution, so sites viewed on them need to be clear enough to see properly
    and also usable from a distance.


    # Cars


    Really? Yes, really. This is new territory, but an increasing number of cars now
    have dashboards with access to the internet in some form or another. For the time
    being, sites rendered on car dashboards will need to present information clearly
    on a small screen, and be designed not to overwhelm a driver and thus cause an
    accident. However, many cars now have screens for passengers, who will have much
    fuller access to the web and content.


    # Game Consoles


    Most modern game consoles spend some of their time connected to the internet,
    and some of that time with a web browser. This is typically for media consumption
    and social networks. Browsers on these devices will likely be limited, and a physical
    keyboard may not be available. For home consoles, design principles from TV will
    apply, and for handhelds, a limited mobile experience.


    In summary, you can''t predict how and where anyone will view your website, so
    build it to be adaptable, flexible, and responsive.'
  - '[PAGE 21]


    # The Meaning and Purpose of Responsive Web Design 9


    # Print


    Print? Isn''t this a web design book? Yes, print versions of your web pages will
    still be frequently accessed, whether for actual physical printing or for rendering
    your content on offline readers such as Instapaper or Pocket. For certain content,
    "print" is still relevant.


    ![](img/bd4041c3e441a42781fa04a5cb5b773b_21_0.png)


    Books, Too

    The page you''re reading was also rendered with HTML and CSS. Yes, even the dead
    tree version.


    # Sample Application


    In my experience, learning by example is always the best way to learn, so for
    this book, we''ll create a demo website and optimize it for the wide range of
    devices it might be accessed on. In each chapter, we''ll build upon the same website
    to illustrate the topic under discussion.


    # Introducing RWDFlux


    RWDFlux is a fictional video streaming service that contains local, national and
    global TV shows for people to watch online. Which shows a user can watch will
    depend on their location and the time of day.


    # Computer Version


    The layout of the site for desktop computers will show image thumbnails, a video
    player, a title of the program, the length of the video, and a description of
    the show. While network speeds vary less for desktop users, this version will
    check for sufficient bandwidth before letting the user play a video.'
