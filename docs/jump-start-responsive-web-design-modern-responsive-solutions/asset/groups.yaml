  - "[PAGE 132]\n\n# Using a Larger Image as a Poster\n\nReplacing the poster image\
    \ with the large variant will mean the poster image scales across all file sizes,\
    \ but it does mean that we're loading an unnecessarily large file at certain breakpoints.\n\
    \nIf you want to style the poster element further (to change the dimensions or\
    \ add padding), you can target it directly with the following selector:\n\n```\n\
    video[poster] {\n  ...\n}\n```\n\n# Background Image\n\nA way to create a responsive\
    \ image representation of the video is to remove the poster image and instead\
    \ set a background image for the video, allowing use media queries to load the\
    \ appropriate image.\n\nYou'll need to set a background image inline within the\
    \ video tag, or create a CSS style for each video image because each video needs\
    \ a different image set as a background.\n\nWith an inline style:\n\n```\n<video\
    \ controls preload=\"none\"\nstyle=\"background: transparent url('../images/show-1-large.jpg')\n\
    0 0 / cover no-repeat;\">\n  ...\n</video>\n```\n\nAnd with a CSS class:"
  - "[PAGE 133]\n\n```\n<video controls preload=\"none\" class=\"show1\">\n··\n</video>\n\
    ```\n\n```\n.show1 {\n  background: transparent url(\"../images/show1-large.jpg\"\
    )\n  0 0 / cover no-repeat;\n}\n```\n\nUsing specific styles isn’t the scalable\
    \ option as you add more content, but for our example it’s the best option. To\
    \ avoid repeated typing on a production site, you’d probably use a templating\
    \ system such as Twig or Mustache, which would loop through the videos you want\
    \ to display and populate the various file names as required.\n\nIf you don’t\
    \ want to inline styles you could use a CSS pre-processor such as Less or Sass,\
    \ which allows you to use functions and arguments (in this case, the background\
    \ image) to generate the necessary CSS classes for you, but this will result in\
    \ a lot of CSS classes.\n\nTo demonstrate the principle, let’s take an approach\
    \ somewhere between the two mentioned above, without using any new dependencies.\
    \ Add a class to each video, and then create the styles needed for the background\
    \ image at each breakpoint. First, remove all the poster attributes from the video\
    \ tags and add the class. For example:\n\n```\n<video controls preload=\"none\"\
    \ class=\"show1\">\n··\n</video>\n```\n\nAnd the CSS for the mobile-first layout:\n\
    \n```\n.show1 {\n  background: transparent url(\"../images/show1-medium.jpg\"\
    )\n}\n```"
