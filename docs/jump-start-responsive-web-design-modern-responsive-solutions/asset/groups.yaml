- md: "\n# The Building Blocks of Responsive Design 39\n\n# The Viewport Meta Element\n\
    \nIn the last section, I covered making the demo page mobile first with media\
    \ queries. If I try the example in your desktop browser and resize the window,\
    \ everything looks as you would expect. But if you try it in a mobile browser,\
    \ or with an emulated mobile browser, you'll probably see something like the screenshot\
    \ below and be disappointed. Aren't media queries supposed to make pages better\
    \ in a mobile browser?\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_51_0.png)\n\
    \n2-9. Mobile first with no viewport\n\n# 40 Jump Start Responsive Web Design\n\
    \nMedia queries allow us to set different styles for different screen sizes. So,\
    \ if your desktop browser's viewport is 1200px wide, any media query targeting\
    \ that screen width will apply. If you're on a mobile device with a viewport width\
    \ of 320px wide, the viewport viewport would kick into action. There's a very\
    \ big catch. By default, many devices, such as mobile phones and tablets, act\
    \ as if they had a wider screen than they really do.\n\nTo explain what's going\
    \ on here, let's look at the iPhone, where this behavior originated. The first\
    \ iPhone had a screen/viewport width of 320px. However, most websites designed\
    \ for desktops were much wider than that. To avoid seeing the top left corner\
    \ of these sites on initial load, Apple developed the concept of a \"virtual viewport\"\
    \ or \"layout viewport\". Websites were loaded onto this much wider viewport,\
    \ which was then scaled down to fit on the screen. Most sites got rendered on\
    \ iPhones with tiny text that you had to zoom to be able to read.\n\nApple's virtual\
    \ viewport was set at 980px, so as long as a website was no wider than that, the\
    \ whole layout would appear on screen. Any layouts wider than 980px would be partially\
    \ hidden to the right, requiring sideways scrolling. And that's still the case\
    \ today. The virtual viewport idea has been adopted by other device makers as\
    \ well, though the default width varies.\n\nWhen designing a responsive site,\
    \ we really don't want this default behavior on mobile devices. We want to know\
    \ that the canvas we're working with is the actual screen area of each device.\
    \ Frankly, there's a simple way to tell these devices not to behave in the default\
    \ way. All we need to do is add a special meta element to the head of each page.\
    \ Here's a typical example:\n\n```\n<meta name=\"viewport\" content=\"width=device-width,\n\
    \     initial-scale=1\">\n```\n\nAs a general rule, the line above is all you\
    \ need to ensure your media queries do what you expect on mobile devices. The\
    \ name attribute specifies that we're targeting the virtual viewport, and the\
    \ content attribute specifies how we want the device to behave. In the example\
    \ above, we're specifying that the virtual viewport should match the actual width\
    \ of the screen, and that there should be no zoom applied to the content.\n\n\
    With the viewport declaration in place, you can be sure that media queries targeting\
    \ a device that's 320px will actually be recognized by that device.\n\nLet's modify\
    \ our demo site to add a viewport declaration. Add the following meta tag inside\
    \ your current head element:\n\n```\n2-10. Chapter2/demo_viewport/index.html (excerpt)\n\
    <head>\n  <meta charset=\"UTF-8\">\n  <title>App Name</title>\n  <link rel=\"\
    stylesheet\" type=\"text/css\" media=\"all\" href=\"layout.css\">\n  <meta name=\"\
    viewport\" content=\"width=device-width,initial-scale=1.0\">\n</head>\n```\n\n\
    Refresh the page:\n\n# Jump Start Responsive Web Design\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_54_0.png)\n\
    \nMuch better!\n\n# The Building Blocks of Responsive Design 43\n\n# The Viewport\n\
    \nViewport is an old term in computer graphics to define the (typically rectangular)\
    \ screen area used to render the elements that users see in a browser. When web\
    \ browsing was limited to desktop browsers, the viewport still existed but was\
    \ rarely changed by designers. With the increasing variety of browser dimensions,\
    \ HTML5 introduced a viewport attribute to the meta element allowed designers\
    \ to set and manipulate this area.\n\nThe meta element was initially proposed\
    \ by Apple to set the initial state of the page to the correct size and was later\
    \ introduced as part of the HTML5 standard.\n\nGenerally, you set the viewport\
    \ to the width of the current device with width=device-width and leave the content\
    \ unscaled (with initial-scale=1.0).\n\nThe width attribute is a pixel value,\
    \ and the device-width detects the current device width, meaning you don't need\
    \ to handle the myriad sizes that may be available; the meta element will take\
    \ care of it for you. The same applies for different screen orientations: changes\
    \ between landscape and portrait are also handled for you. There's still a lot\
    \ more work needed to make a design fully responsive, but media queries plus this\
    \ viewport setting give you a fantastic start.\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_55_0.png)\n\
    \n2-12. Demo page with viewport\n\nThe content attribute of the tag also accepts\
    \ standard methods for setting the width. For example:\n\n```html\n<head>\n...\n\
    \  <meta name=\"viewport\" content=\"width=500,initial-scale=1.0\">\n...\n</head>\n\
    ```\n\nWhich will result in:\n\n# The Building Blocks of Responsive Design 45\n\
    \n![](img/bd4041c3e441a42781fa04a5cb5b773b_57_0.png)\n\n2-13. Manually setting\
    \ width\n\nThis is still a better result than a page without the viewport, but\
    \ as you can see, one case for setting a manual width is if you’re targeting one\
    \ device, like an eReader. There are other, less frequently used attributes for\
    \ the viewport which you might need:\n\n- minimum-scale: the minimum zoom level,\
    \ or how much the user can zoom out.\n- maximum-scale: the maximum zoom level,\
    \ or how much the user can zoom in.\n- user-scalable=no: disables zooming. While\
    \ this has a limited number of cases, it significantly reduces the accessibility\
    \ of your page.\n\n# Any Queries?\n\nThe selective nature of media queries makes\
    \ them an essential tool in your toolbox, and in this chapter, we've learned how\
    \ to create and use them. Every modern browser now supports them, and they offer\
    \ the potential to target any specific environments you need to design for. In\
    \ coming chapters, we'll leverage the responsive foundation that media queries\
    \ and the viewport offer to add polish and shine to our responsive designs.\n\n\
    # Chapter 3\n\n# Better Responsive Structures with Grid Systems\n\nSo far, we've\
    \ looked at the underlying principles of responsive design and the power of media\
    \ queries to build page structures optimized for different devices. In this chapter,\
    \ we'll see how grid systems can supplement and even replace some of the techniques\
    \ we've covered so far, providing more flexibility for how pages display across\
    \ different devices.\n\nWhile flexibility in design is endless in theory, a common\
    \ design ethic in print and digital design has been to use horizontal and vertical\
    \ grids for element layout. They help break up sections of a page into logical\
