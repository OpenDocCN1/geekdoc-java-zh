    For these reasons, it''s best to ignore actual device pixels and focus on CSS—the
    pixel values you set in your CSS file. The CSS pixel value is a more accurate
    number, which takes into account the factors outlined above. Browsers also handle
    a lot of the scaling issues for you.


    The pixel (px) sizing unit theoretically represents the size of one pixel of a
    screen. In relation to text, this means that when setting text to 16px, the length
    of the lowest point in the text (such as the bottom of a lowercase ''g'') to the
    highest point (such as the top of a lowercase ''h'') is 16px.'
  - '[PAGE 103]


    # Responsive Text 91


    ![](img/bd4041c3e441a42781fa04a5cb5b773b_103_0.png)


    4-5. Text height includes ascenders and descenders


    For other properties, such as letter-spacing, this literally means the number
    of pixels between characters at their widest point.


    Points


    As you saw in the earlier screenshot in InDesign, the point (pt) sizing unit has
    its heritage in print text and is more confusing to understand. It represents
    a similar size to the pixels example, but as different operating systems and screens
    represent pixels to points in different ways, they are best reserved for print
    styles.


    # Relative Sizing


    Relative sizing is more suited to web and responsive design, as sizes will change
    relative to a base size. But it''s useful to understand fixed sizing (at least
    pixels) to appreciate how these sizing methods work. The most popular units for
    relative font sizing are the %, em, and rem values.


    The first important fact to know when using relative sizes is what these sizes
    relative to. By default in all browsers, it''s 16px, but if a user has changed
    this default—for example, to compensate for low vision—then relative sizes will
    still scale up and down proportionally.'
- md: "\n# 2 Jump Start Responsive Web Design\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_104_0.png)\n\
    \n# Percent\n\nSetting a percentage value for a font size means making it a percentage\
    \ of the default font size, so if a user has the font size of their browser set\
    \ at 16px, then font-size: 100%; will still equal 16px, and font-size: 50% will\
    \ equal 8px.\n\nAs an example, let's try applying percentage sizing to the demo\
    \ site, again with a mobile first approach, setting the base font size for users\
    \ of devices with smaller screens.\n\n> We're Assuming a Base Font Size of 16px\n\
    \nFor these examples, I'll assume that the base font size is the default 16px.\
    \ If it's different in your browser, then the sizes stated will differ.\n\nAdd\
    \ a base font size to the body element that sets the default font size to 75%\
    \ of 16px, which is 12px:\n\n```\nbody {\n  font-size: 75%;\n}\n```\n\nThen, in\
    \ the tablet and desktop media queries, add font sizes for the larger screen sizes.\n\
    \n```\n@media only screen and (min-width: 768px) {\n  body {\n    font-size: 100%;\n\
    \  }\n}\n@media only screen and (min-width: 992px) {\n  body {\n    font-size:\
    \ 125%;\n  }\n}\n```\n\nThis results in a subtly more pixelated font rendering\
    \ on larger screens than on medium-sized screens.\n\n# Em\n\nDespite its recent\
    \ rise in popularity with web designers, the em unit is an old typographical unit\
    \ named after the letter “M”. The base value of an em unit is equal to the current\
    \ typeface size in points. For example, one em in a 16-point typeface is 16 points.\n\
    \nIn practice, it works in a similar way to percentage sizing, the units are smaller.\
    \ So, for example, assuming a default font size of 16px, font-size: 1em will still\
    \ equal 16px, and font-size: 0.5em will equal 8px.\n\nThe unit values are smaller\
    \ with ems, but it’s easy for styles to result in large font sizes accidentally.\
    \ For example, consider font-size: 4em: while the number doesn’t look large, it\
    \ actually equals 64px. Of course, you could set your default font size to something\
    \ smaller, and then increasing ems won’t result in large variations.\n\nAs an\
    \ example, let’s try applying em sizing to the demo site, again with a mobile\
    \ first approach.\n\n# Jump Start Responsive Web Design\n\nAdd a base font size\
    \ to the body element that sets the default font size to .75em of 16px, which\
    \ is 12px:\n\n```\nbody {\n  font-size: 0.75em;\n}\n```\n\nThen, in the tablet\
    \ and desktop media queries, add font sizes for the larger screen sizes:\n\n```\n\
    @media only screen and (min-width: 768px) {\n  body {\n    font-size: 1em;\n \
    \ }\n}\n@media only screen and (min-width: 992px) {\n  body {\n    font-size:\
    \ 1.25em;\n  }\n}\n```\n\nI won't add screenshots, as the results should look\
    \ exactly the same as with the percentage examples.\n\nOne neat trick with ems\
    \ is that the relative sizing cascades down nested elements. For example, modify\
    \ the page's aside element to have some nested list items:\n\n```\n<aside class=\"\
    left\">\n<ul>\n  <li>one\n    <ul>\n      <li>sub item</li>\n      <li>sub item</li>\n\
    \    </ul>\n  </li>\n</ul>\n```\n\n```html\n  </li>\n  <li>two\n    <ul>\n   \
    \   <li>sub item </li>\n      <li>sub item </li>\n    </ul>\n  </li>\n  <li>three\n\
    \    <ul>\n      <li>sub item </li>\n      <li>sub item </li>\n    </ul>\n  </li>\n\
    \  </ul>\n</aside>\n```\n\nThen add the following:\n\n```css\naside ul {\n  font-size:\
    \ 0.75em;\n}\n```\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_107_0.png)\n\n#7.\
    \ Em cascade example\n\nYou'll see that the font size for the outer ul is .75em\
    \ (15px) of the current size (in the screenshot this is 20px), and the inner ul\
    \ is .75em of that size (11.25px). While this technique allows for a fantastic\
    \ shorthand way of creating responsive sizes that cascade through your page, it\
    \ requires careful planning, as elements may end up smaller or larger than you\
    \ expect.\n\n# Rem\n\nThe rem unit stands for \"root\", and the sizing representation\
    \ of the unit is the same as em. But \"root\" implies that the relative sizing\
    \ is calculated from one base element—rather than the immediate containing element.\
    \ This gives you a more predictable alternative to em, as it's easier to tell\
    \ what the size is relative to.\n\nAs an example, let's try rem sizing to the\
    \ demo site. Add a base font size to the html of 12px (assuming a default of 16px):\n\
    \n```css\nhtml {\n  font-size: 75%;\n}\n```\n\nThen inside the tablet and desktop\
    \ media queries, add font sizes for the larger screens:\n\n```css\n@media only\
    \ screen and (min-width: 768px) {\n  html {\n    font-size: 1rem;\n  }\n}\n@media\
    \ only screen and (min-width: 992px) {\n  html {\n    font-size: 1.25rem;\n  }\n\
    }\n```\n\nNot much changes when applied to the demo site, as it's effectively\
    \ the same. Now add the following styles to the nested list from above:\n\n```css\n\
    aside {\n  font-size: 0.75rem;\n}\n```\n\nNow the sizing is 3/4 of the current\
    \ base size.\n\n# Site Name\n\n## Site Introduction\nLorem ipsum dolor sit amet,\
    \ consectetur adipiscing elit. Septem autem illi non, sed ullamcorper omnis nominatat\
    \ sunt. Itaque risus ratione adiunct et effecta non reliquit. Vividimus igitur\
    \ quisere ne infantes possint. Quod laiam me optare non.\n\n- one\n  - sub item\n\
    - two\n  - sub item\n- three\n  - sub item\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_109_0.png)\n\
    \nLorem dolor sit amet, consectetur adipiscing elit. Lorem dolor sit amet, consectetur\
    \ adipiscing elit. Lorem dolor sit amet, consectetur adipiscing elit. Lorem dolor\
    \ sit amet, consectetur adipiscing elit.\n\n#8. Rem cascade example\n\nSizes based\
    \ on percentages, ems and rems are not the only options available to you. There\
    \ are actually nine in total. Some are quite obscure, or not really necessary,\
    \ but others are more useful after an initial learning curve. Take, for example,\
    \ the vw and v units, which are a percentage of the width and height of the viewport\
    \ respectively.\n\nThere is also vmin (based on which is smallest of the viewport\
    \ height and width) and vmax (based on which is largest of the viewport height\
    \ and width). These are amazingly flexible, as the size will automatically react\
    \ to the size of the viewport, but you can lose track of what size fonts actually\
    \ are.\n\nTake a viewport that's 1000px wide and 800px:\n\n- 1vw is 1% of the\
    \ total width, i.e. 10px\n- 100vw is 100% of the width, i.e. 1000px\n- 50vw is\
    \ 50% of the width, i.e. 500px\n- 1vh is 1% of the height, i.e. 8px\n- 1vmin is\
    \ 1% of the smallest of the two sizes, i.e. 1% of 800px, which is 8px\n- 1vmax\
    \ is 1% of the largest of the two sizes, i.e. 1% of 1000px, which is 100px\n\n\
    Try adding the following to the body element:\n\n```css\nbody {\n  font-size:\
    \ 1.5vw;\n}\n```\n\nYour base font size will now be 1.5% of your body width, which\
    \ will depend on the width of your browser window.\n\nAt first, it looks like\
    \ viewport sizing is the answer to your responsive dreams, but you'll notice that,\
    \ as you shrink the browser window, the font size becomes unreadable, as 1.5%\
    \ of a small viewport width is a tiny font size.\n\nOf course, you could fix this\
    \ with breakpoints, but then defeats the purpose of using this sizing unit in\
    \ the first place. There's a clever workaround for this, thanks to Zell Liew and\
    \ Mike Reithmuller:\n\n```css\nbody {\n  font-size: calc(16px + 0.25vw);\n}\n\
    /* The above won't work in Safari, but the below does */\nbody {\n  font-size:\
    \ calc(100% + 0.25vw);\n}\n```\n"
  mdcn: "\n\n# 2 快速上手响应式网页设计\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_104_0.png)\n\
    \n# 百分比 (Percent)\n\n为字体大小设置百分比值意味着将其设置为默认字体大小的百分比。因此，如果用户的浏览器字体大小设置为 16px，那么\
    \ `font-size: 100%` 仍然等于 16px，而 `font-size: 50%` 将等于 8px。\n\n作为一个示例，让我们尝试在演示网站上应用百分比尺寸，同样采用移动优先的方法，为屏幕较小的设备设备用户设置基础字体大小。\n\
    \n> 我们假设基础字体大小为 16px\n\n在这些示例中，我假设基础字体大小是默认的 16px。如果你的浏览器中设置不同，那么所述的尺寸也会有所不同。\n\
    \n为 `body` 元素添加一个基础字体大小，将默认字体大小设置为 16px 的 75%，即 12px：\n\n```css\nbody {\n  font-size:\
    \ 75%;\n}\n```\n\n然后，在平板和桌面端的媒体查询中，为更大的屏幕尺寸添加字体大小。\n\n```css\n@media only screen\
    \ and (min-width: 768px) {\n  body {\n    font-size: 100%;\n  }\n}\n@media only\
    \ screen and (min-width: 992px) {\n  body {\n    font-size: 125%;\n  }\n}\n```\n\
    \n这导致在大屏幕上的字体渲染比中等屏幕上略微像素化。\n\n# em\n\n尽管 `em` 单位最近在网页设计师中变得流行，但 `em` 是一种古老的排版单位，它是以字母“M”命名的。`em`\
    \ 单位的基础值等于当前字体大小的磅（points）数。例如，在 16 磅的字体中，1 em 等于 16 磅。\n\n在在实践中，它的工作方式与百分比尺寸类似，但单位数值更小。例如，假设默认字体大小为\
    \ 16px，`font-size: 1em` 仍然等于 16px，而 `font-size: 0.5em` 将等于 8px。\n\n使用 `em` 时单位值较小，但样式很容易无意中导致巨大的字体大小。例如，考虑\
    \ `font-size: 4em`：虽然数字看起来并不大，但它实际上等于 64px。当然，你可以将默认字体大小设置为较小的值，这样增加 `em` 就不会产生巨大的变化。\n\
    \n作为一个示例，让我们尝试尝试在演示网站上应用 `em` 尺寸，同样采用移动优先的方法。\n\n# 快速上手响应式网页设计\n\n为 `body` 元素添加一个基础字体大小，将默认字体大小设置为\
    \ 16px 的 .75em，即 12px：\n\n```css\nbody {\n  font-size: 0.75em;\n}\n```\n\n然后，在平板和桌面端的媒体查询中，为更大的屏幕尺寸添加字体大小：\n\
    \n```css\n@media only screen and (min-width: 768px) {\n  body {\n    font-size:\
    \ 1em;\n  }\n}\n@media only screen and (min-width: 992px) {\n  body {\n    font-size:\
    \ 1.25em;\n  }\n}\n```\n\n我不会添加截图，因为结果应该与百分比示例完全相同。\n\n使用 `em` 的一个巧妙技巧是，相对尺寸会级联到嵌套元素。例如，修改页面的\
    \ `aside` 元素以包含一些嵌套列表项：\n\n```html\n<aside class=\"left\">\n<ul>\n  <li>one\n\
    \    <ul>\n      <li>sub item</li>\n      <li>sub item</li>\n    </ul>\n  </li>\n\
    </ul>\n```\n\n```html\n  </li>\n  <li>two\n    <ul>\n      <li>sub item </li>\n\
    \      <li>sub item </li>\n    </ul>\n  </li>\n  <li>three\n    <ul>\n      <li>sub\
    \ item </li>\n      <li>sub item </li>\n    </ul>\n  </li>\n  </ul>\n</aside>\n\
    ```\n\n然后添加以下内容：\n\n```css\naside ul {\n  font-size: 0.75em;\n}\n```\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_107_0.png)\n\
    \n#7. em 级联示例\n\n你会发现外层 `ul` 的字体大小是当前尺寸的 .75em (15px，在截图中为 20px)，而内层 `ul` 是该尺寸的\
    \ .75em (11.25px)。虽然这种技术允许创建跨页面级联响应尺寸的极佳快捷方式，但它需要仔细的规划，因为元素的尺寸可能会比你预期的要小或大。\n\n\
    # rem\n\n`rem` 单位代表“root”（根），该单位的尺寸表示与 `em` 相同。但“root”意味着相对尺寸是从一个基础元素计算的——而不是从直接包含它的元素。这为你提供了一个比\
    \ `em` 更可预测的替代方案，因为更容易看出尺寸是相对于什么的。\n\n作为一个示例，让我们尝试在演示网站上使用 `rem` 尺寸，假设基础字体大小为\
    \ 16px，将根字体大小设置为 75%：\n\n```css\nhtml {\n  font-size: 75%;\n}\n```\n\n然后，在平板和桌面端的媒体查询中，为更大的屏幕尺寸添加字体大小：\n\
    \n```css\n@media only screen and (min-width: 768px) {\n  body {\n    font-size:\
    \ 100%;\n  }\n}\n@media only screen and (min-width: 992px) {\n  body {\n    font-size:\
    \ 125%;\n  }\n}\n```\n\n这导致在大屏幕上的字体渲染比中等屏幕上略微像素化。\n\n"
