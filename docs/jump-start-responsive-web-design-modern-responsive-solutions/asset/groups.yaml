  mdcn: "\n# 支持旧版浏览器\n\n如果你想对旧版浏览器提供更好的支持，可以使用“polyfill”（一个用于填补缺失功能的库的术语）。具体来说，在这种情况下，可以使用\
    \ Scott Jehl 的 picturefill。\n\n`picture` 元素的另一个有用应用（通过其内部的 `source` 元素实现）是加载不同的图像格式，例如可缩放矢量图像\
    \ (SVGs)：\n\n```html\n<picture>\n  <source srcset=\"logo.svg\" type=\"image/svg+xml\"\
    >\n  <img src=\"logo.png\" alt=\"Logo\">\n</picture>\n```\n\n如果浏览器不支持 SVG 图像，它将加载\
    \ PNG。\n\n另一个选项是为高分辨率屏幕加载更高分辨率图像：\n\n```html\n<picture>\n  <source srcset=\"../images/show1-2x.jpg\"\
    \n  media=\"(min-resolution: 120dpi)\" class=\"thumbnail\">\n  <img src=\"../images/show1-medium.jpg\"\
    \nclass=\"thumbnail\">\n</picture>\n```\n\n# 响应式视频\n\n继续 HTML5 语义化元素的主题，视频和音频对应的元素分别是\
    \ `video` 和 `audio`。由于我们在书中正在构建一个视频网站，我不会过分关注 `audio` 元素，但我认为在使用 `picture` 和 `video`\
    \ 元素之后，你将理解如何使用它。\n\n# 116 快速上手：响应式网页设计\n\n## `video` 元素\n\n很多年前，我制作过一个音乐视频网站。那在宽带普及之前，我花费了大量时间尽可能优化视频，以便它们在慢连接上可以查看。我还必须决定使用哪种视频插件来显示视频。是用\
    \ Quicktime 更好？RealPlayer？还是用那个现在大家又爱又恨（但在当时很流行）的 Flash？\n\n那些视频格式现在很大程度上已经过时了，被一系列标准格式和\
    \ HTML5 所代之，这让设计师的生活变得简单得多，同时也减少了由于为了查看视频而必须下载插件这种杀伤用户体验的过程。`video` 元素的支持范围比 `picture`\
    \ 更广，只有 IE8 和早期的 Android 版本可能会给你带来麻烦。\n\n然而，`video` 元素支持的文件格式仍然存在问题，这很大程度上归功于厂商对\
    \ DRM（数字版权管理）的不同态度，以及对哪种格式是“最佳”选择的分歧（每个用户都倾向于使用它支持或帮助开发的格式）。所有支持 `video` 元素的浏览器都支持\
    \ MPEG-4/H.264，这是一种压缩格式。但它是专有的，这意味着浏览器制造商必须支付许可费才能使用它。对 WebM 和 Ogg/Theora 格式（开放格式）的支持并不常见，只有\
    \ Chrome、Firefox 和 Opera 支持它们。\n\n这里是 `video` 元素的一个示例：\n\n```html\n<video width=\"\
    320\" height=\"240\" autoplay>\n<source src=\"file.mp4\" type=\"video/mp4\">\n\
    <source src=\"file.ogg\" type=\"video/ogg\">\n您的浏览器不支持视频标签。\n</video>\n```\n\n\
    与以前的选项相比，它是一个简单且整合的 HTML 元素。它会加载用户浏览器支持的任何视频格式，或者如果 `video` 元素或其包含的文件格式不受支持，则显示一段默认文本。`source`\
    \ 元素按照呈现顺序进行处理。因此，在上面的示例中，如果浏览器同时支持两种格式，它将加载看到的第一个。仅此如此；`video` 元素并没有特别的响应式之处，除了它可以加载带有控制控件的相应视频文件。\n\
    \n有一些技巧可以尝试让视频更具响应性，但让我们先从简单的开始：让视频播放器控件可见、添加海报图像（在视频播放前显示的缩略图），并移除手动尺寸。\n\n```html\n\
    <video controls poster=\"../images/show1-medium.jpg\">\n  <source src=\"../videos/show1.ogv\"\
    \ type=\"video/ogg\">\n  <source src=\"../videos/show1.mp4\" type=\"video/mp4\"\
    >\n  您的浏览器不支持视频标签。\n</video>\n```\n\n`video` 元素的早期提案包括包含它自己的媒体查询（正如我们看到的 `picture`\
    \ 元素那样）。但这个主意被放弃了，这意味着无法为不同的设备更换不同的视频文件。让视频具有任何响应性的唯一真正方法是使用百分比宽度，例如：\n\n```css\n\
    video {\n  width: 100%;\n  height: auto;\n}\n```\n\n这将使视频缩放以适应其容器元素，你可以使用 `max-width`\
    \ 属性来限制它可以增长的尺寸，或者使用一个较小的值，如 50%。然而，在较大的屏幕尺寸下，它无法阻止视频的放大，这意味着如果太大，它可能会看起来像素化。\n\
    \n除非另有指定，否则一旦页面加载，视频将开始下载到你的浏览器（这样如果用户选择观看，它就准备就绪）。注意视频潜在的带宽开销，这对于移动用户并不友好：\n\n\
    # 快速上手：响应式网页设计\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_130_0.png)\n\n5-8.\
    \ 网页检查器中显示的视频文件大小\n\n针对这个问题，有一个部分解决方案：在 `video` 标签上添加 `preload=\"none\"`：\n\n\
    ```html\n<video controls poster=\"../images/show1-medium.jpg\"\n  ...\n  preload=\"\
    none\">\n</video>\n```\n"
