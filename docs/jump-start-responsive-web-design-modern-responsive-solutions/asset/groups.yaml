  - '[PAGE 125]


    The first part of the element is normal, as is the last class property, the second
    and third lines are the new syntax. srcset is designed to allow the browser to
    make the best decisions about what image to display based on information you provide
    it. Each pair in the second line defines the images available and tells the browser
    width, appended with a w. The third line defines the viewport sizes you want to
    load a large image, and what image to load.


    The example above declares:


    +   - Up to a viewport width of 768px, load an image of 480px width.

    - Between a viewport width of 768 and 1800px, load an image of 320px width.

    - If no other rule applies, then load an image of 768px.


    You can be subtle with these declarations, for example:


    ```

    <img src="../images/show1-medium.jpg"

    srcset="../images/show1-medium.jpg 480w,

    ../images/show1-small.jpg 320w,

    ../images/show1-large.jpg 768w"

    sizes="max-width: 768px) 90vw,

    (max-width:1800px) 24vw, 50vw"

    class="thumbnail" />

    ```


    This instead declares that the different viewport sizes pick an image that suits
    a certain viewport width (vw) size. For this design, they are essentially the
    same, but it gives you an idea of how smart can let your browser be. It is worth
    noting that this 스마트 can actually cause confusion when testing: I have frequently
    found myself wondering why the tag wasn''t working when I expected it to, only
    to realize that it was due to the browser holding on cached version of the images,
    or optimizing for a retina screen, and again caching images. To debug what''s
    happening while figuring out your srcsets, I recommend using incognito / private
    windows, double-checking your screen resolution, and keeping developer tools open
    to see what files the browser is actually loading.


    If this smartness is too unpredictable for you and find yourself needing more
    control, then the picture is for you.'
