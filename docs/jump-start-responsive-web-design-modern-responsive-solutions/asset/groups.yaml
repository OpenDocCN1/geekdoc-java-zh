    \ the CSS and HTML to better accommodate the images we'll be adding. Let's give\
    \ the main content area more space and reduce the size of the aside menu:\n\n\
    ```\n@media only screen and (min-width: 992px) {\n  aside {\n    width: 15%;\n\
