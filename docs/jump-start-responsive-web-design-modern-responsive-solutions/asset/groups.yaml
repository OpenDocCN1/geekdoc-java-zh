  mdcn: "\n\n## 电池电量\n\nHTML5 Battery Status API 允许你检查设备的当前电量水平并此做出响应。\n\n## 安全考量\n\
    \n最近围绕 Battery Status API 出现了一些安全担忧，因此请阅读 W3C 规范以获取其未来的动态。\n\n移动设备（以及笔记本电脑）在需要你时可能会电量耗尽，因此在这个（主要是为了说明的）示例中，让我们通过注意用户电量低的情况并降低页面的响应速度来帮助他们。\n\
    \n较暗的颜色可以减少对某些设备屏幕的电量影响（特别是 AMOLED 屏幕），因此页面的颜色已经相当对电池友好了，但让我们看看如何对电量水平做出反应。\n\n\
    可以使用一个 JavaScript 方法来获取有关设备电池的各种信息。\n\n在 `index.js` 文件中添加以下代码以检查浏览器是否支持该功能。如果支持，则获取电量水平，这是一个位于\
    \ 0（空）到 1（满）之间的值：\n\n```javascript\nnavigator.getBattery().then(function (battery)\
    \ {\n  var level = battery.level;\n  console.log(level);\n});\n```\n\n如果电量小于 20%\
    \ (0.2)，则添加一个 CSS 类来降低颜色亮度，并从 DOM 中移除图像（因为加载和显示图像会影响电池寿命，每减少一点点都好）：\n\n```javascript\n\
    if (level < 0.2) {\n  body = document.getElementsByTagName('body');\n  images\
    \ = document.getElementsByName('img');\n  var i;\n  for (i = 0; i < images.length;\
    \ i++) {\n    images[i].remove();\n  }\n  body.classList.add('battery-save');\n\
    }\n```\n\n在你的 CSS 中添加新的 `battery-save` 样式，降低页面文本的亮度：\n\n```css\n.battery-save\
    \ {\n  color: gray;\n}\n```\n\n颜色方案是否真的能节省电量是一个争议性的话，这很大程度上取决于设备屏幕，但可能值得尝试。帮助用户节省电量的其他更确定的想法包括：\n\
    \n- 减少网络调用和流量\n- 通过移除不重要的 JavaScript 来减少客户端处理量。\n- 减少动画和效果\n\n尽管我们用 JavaScript\
    \ 从 DOM 中移除了图像，但它们在隐藏之前仍然被加载了。这与减少网络调用的原则相矛盾。由于 JavaScript 只允许你更改已有的页面结构，因此你需要从根本上更改传递给浏览器的内容。为了让这生效，你需要重新思考页面结构，使其更符合移动友好。\n\
    \n在当前的 HTML 中添加类来识别每个电视节目：\n\n```html\n<section class=\"show1\">\n...\n</section>\n\
    <section class=\"show2\">\n...\n</section>\n```\n\n现在从每个 tvshow section 中移除所有\
    \ `picture` 和 `video` 标签，大幅减少 HTML 文件的大小。回到 `index.js`，将现有内容替换为以下代码，该代码利用了我们在之前章节中使用过的概念（点击图像播放视频）并对其进行了整合：\n\
    \n```javascript\nwindow.addEventListener(\"load\",function(event) {\n  navigator.getBattery().then(function(battery)\
    \ {\n    // 获取电量水平，如果电量足够则加载图像\n    var level = battery.level;\n    if (level\
    \ > 0.2) {\n      // 找到所有的 'tvshow' div 并遍历它们\n      tvShows = document.getElementsByClassName(\"\
    tvshow\");\n      var i;\n      for (i = 0; i < tvShows.length; i++) {\n     \
    \   tvShow = tvShows[i];\n        // 获取节目名称\n        showName = tvShow.classList[1];\n\
    \        // 创建 picture 元素\n        var newPictureNode = document.createElement(\"\
    picture\");\n        // 设置 picture 的源和类，但节目名称传递方式\n        // 与示例相同，并为每个生成\n \
    \       var pictureInnerHTML = '<source src=\"../images/' + showName + '-small.jpg\"\
    \ media=\"max-width:320px)\" class=\"thumbnail\"><source src=\"../images/' + showName\
    \ + '-medium.jpg\" media=\"(min-width:320px) and (max-width:480px)\" class=\"\
    thumbnail\"><source src=\"../images/' + showName + '-large.jpg\" media=\"(min-width:480px)\"\
    \ class=\"thumbnail\"><img src=\"../images/' + showName + '-medium.jpg\" class=\"\
    thumbnail\">';\n        newPictureNode.innerHTML = pictureInnerHTML;\n       \
    \ //为 picture 添加事件监听器\n        newPictureNode.addEventListener('click',\n    \
    \    toggle_visibility, false);\n\n        // 以同样的方式生成 video HTML\n        var\
    \ newVideoNode = document.createElement(\"video\");\n        var videoInnerHTML\
    \ = '<source src=\"../videos/' + showName + '.mp4\" type=\"mp4\"><source src=\"\
    ../videos/' + showName + '.ogv\" type=\"video/ogg\">您的浏览器不支持 HTML5 视频标签>';\n \
    \       newVideoNode.setAttribute(\"controls\", \"controls\");\n        newVideoNode.setAttribute(\"\
    poster\", \"../images/\"\n        showName + '-medium.jpg');\n        newVideoNode.setAttribute(\"\
    preload\", \"none\");\n        newVideoNode.innerHTML = videoInnerHTML;\n\n  \
    \      // 将新图像和视频插入到正确的位置\n        var nextNode =\n          tvShow.getElementsByClassName('showdescription');\n\
    \        tvShow.insertBefore(newVideoNode, nextNode[0]);\n        tvShow.insertBefore(newPictureNode,\
    \ newVideoNode);\n      }\n    },false);\n\nfunction toggle_visibility(id) {\n\
    \  var e = this;\n  var v = e.nextSibling\n  v.style.display = 'block';\n  e.style.display\
    \ = 'none';\n}\n```\n\n"
