- md: "\n# Supporting Older Browsers\n\nIf you want to add better support for older\
    \ browsers, you can use a \"polyfill\" (a term for a library that plugs missing\
    \ functionality). Specifically, in this case, that's Scott Jehl's picturefill.\n\
    \nOther useful application of the picture element, enabled through its inner source\
    \ element, is to load different image formats, such as scaleable vector images\
    \ (SVGs):\n\n```\n<picture>\n  <source srcset=\"logo.svg\" type=\"image/svg+xml\"\
    >\n  <img src=\"logo.png\" alt=\"Logo\">\n</picture>\n```\n\nIf the browser doesn't\
    \ support SVG images, then it will load the PNG instead.\n\nAnother option is\
    \ to load higher resolution images for high resolution screens:\n\n```html\n<picture>\n\
    \  <source srcset=\"../images/show1-2x.jpg\"\n  media=\"(min-resolution: 120dpi)\"\
    \ class=\"thumbnail\">\n  <img src=\"../images/show1-medium.jpg\"\nclass=\"thumbnail\"\
    >\n</picture>\n```\n\n# Responsive Video\n\nContinuing the theme of semantic elements\
    \ in HTML5, the respective elements for video and audio are video and audio. Since\
    \ we're building a video site in this book, I won't focus too much on the audio\
    \ element, but I think after using the picture and video elements, you'll understand\
    \ how to use it.\n\n# 116 Jump Start Responsive Web Design\n\n## The video Element\n\
    \nMany years ago, I made a site of music videos. This was prior to the widespread\
    \ availability of broadband, and I spent a long time optimizing videos as much\
    \ as possible to make them viewable on slow connections. I also had to decide\
    \ what video plugin to use to display the video. It would be best with Quicktime?RealPlayer?\
    \ Or the tool everyone loves to hate now (but was popular at the time), Flash?\n\
    \nThose video formats were largely over now, replaced by a series of standard\
    \ formats and HTML5, making a designer's life much easier, and also reducing user-experience-killing\
    \ process of having to download a plugin to view a video. The video element has\
    \ a wider support than picture, with only IE8 and early Android versions likely\
    \ to cause you problems.\n\nHowever, the file formats supported by the video element\
    \ still present problems, mostly thanks to vendors' differing attitudes to DRM\
    \ and to which format is the \"best\" to use (each user preferring the format\
    \ it supports or helped to develop). All browsers that support the video element\
    \ support MPEG-4/H.264, which is a compressed format. But it's also proprietary,\
    \ which means browser manufacturers must pay a license to use it. Support for\
    \ the WebM and Ogg/Theora formats (which are open formats) is less common, with\
    \ really Chrome, Firefox, and Opera supporting them.\n\nHere's an example of the\
    \ video element in:\n\n```html\n<video width=\"320\" height=\"240\" autoplay>\n\
    <source src=\"file.mp4\" type=\"video/mp4\">\n<source src=\"file.ogg\" type=\"\
    video/ogg\">\nYour browser does not support the video tag.\n</video>\n```\n\n\
    It's much simpler and consolidated HTML element than the options that existed\
    \ before. It loads whichever video format is supported by the user's browser,\
    \ or a default string of text if the video element or the file formats it contains\
    \ aren't supported. The source elements are processed in the order presented.\
    \ So, in the example above, if the browser supports both formats, it will load\
    \ the first one it sees. That's about it; there isn't much particularly responsive\
    \ about the video element, except that it loads suitable video files with controls\
    \ for them.\n\nThere are a few tricks you can try to make videos more responsive,\
    \ but let's start simply by making the video player controls visible, adding a\
    \ poster image (a thumbnail shows before the video plays), and removing the manual\
    \ size.\n\n```html\n<video controls poster=\"../images/show1-medium.jpg\">\n \
    \ <source src=\"../videos/show1.ogv\" type=\"video/ogg\">\n  <source src=\"../videos/show1.mp4\"\
    \ type=\"video/mp4\">\n  Your browser does not support the video tag.\n</video>\n\
    ```\n\nEarly proposals for the video element included having its own media queries\
    \ (like the picture element, as we have saw). But the idea was dropped, meaning\
    \ that different video files can't be swapped out for different devices. The only\
    \ real way to make the video responsive in any way is to use percentage widths,\
    \ for example:\n\n```css\nvideo {\n  width: 100%;\n  height: auto;\n}\n```\n\n\
    This will make the video scale to fit its containing element, and you could use\
    \ a max-width property to limit the dimensional size it could grow to, or a smaller\
    \ value, as 50%. However at larger screen sizes it won't prevent upcaling of the\
    \ video, meaning it could look pixelated if too large.\n\nUnless you specify otherwise,\
    \ a video will start to download to your browser once the page is loaded (so that\
    \ it's ready to view if a user chooses to watch it). Notice the potential network\
