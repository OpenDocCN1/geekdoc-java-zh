    The Building Blocks of Responsive Design


    # Chapter 2


    # # The Building Blocks of Responsive Design


    There are two main building blocks at the heart of responsive web design: media
    queries and viewports.


    **Media queries** represent the glue that joins a lot of other responsive concepts
    and tools. They''re a simple but powerful concept, allowing you to detect device
    properties, define rules, and load different CSS properties based on them. For
    example, you can optimize a navigation menu for different devices, converting
    a full horizontal menu on desktop browsers to the “hamburger” menu encountered
    on mobile devices.


    **Viewport** are less complex, allowing you to define the size and scaling factor
    of a web page appropriately, no matter what the size of the device being used
    to view the page is. Without them, media queries would only be partially useful.'
- md: "\n# Media Types\n\nYou can invoke media query dependent styles in several ways,\
    \ most commonly with the HTML link element linking to one or more CSS files, or\
    \ from directly within a CSS file with @import.\n\nIn HTML, this example will\
    \ load the style.css file if the query is true, which it will be on all device\
    \ types:\n\n```\n<link rel=\"stylesheet\" media=\"all\" href=\"/style.css\">\n\
    ```\n\nIn the following example, @import does the same, but from within a CSS\
    \ file:\n\n```css\n@import url(\"/style.css\");\n```\n\nIn the example below,\
    \ the @media CSS rule contains a specific set of selectors that will load if the\
    \ query is true:\n\n```css\n@media all {\n  ...\n}\n```\n\nThe all in these queries\
    \ is the media type. There are four media types available (at the time of writing):\n\
    \n- print: for print versions of pages\n- screen: for computer, tablet and phone\
    \ screens\n- speech: for screen readers that read pages to the user\n- all: for\
    \ all of the above\n\n# The Building Blocks of Responsive Design 23\n\nAdding\
    \ a media type allows you to specify what types of devices the query applies to.\
    \ These are broad and don't allow for lot of control. To target devices more specifically,\
    \ you add expressions to these media types.\n\n# Creating a Query\n\nLet's try\
    \ something useful. The aside to the main content in RWDflix is designed to show\
    \ announcements and news. Mobile and tablet visitors probably want to focus on\
    \ watching shows and nothing else, so let's hide this element for users of smaller\
    \ screened devices.\n\n# Method Used in This Book\n\n> For the remainder of this\
    \ chapter, I'll use the @media method shown above for media queries. It's a personal\
    \ preference, and as an experiment, you might like to try re-writing the examples\
    \ using other methods.\n\nRemove the current aside CSS class and replace it with\
    \ the following media queries:\n\n```css\n@media screen and (min-width: 680px)\
    \ {\n  aside\n    width: 33%;\n}\n\n@media screen and (max-width: 680px) {\n \
    \ aside\n    display: none;\n}\n```\n\nThis pair of media queries sets the aside\
    \ element to a width of 33% if the screen is wider than 680px (by asking the screen\
    \ is at least 680px wide with min-width), and hides it if the screen is narrower\
