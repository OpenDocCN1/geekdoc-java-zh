    \ i.e. 1% of 1000px, which is 100px\n\nTry adding the following to the body element:\n\
    \n```\nbody {\n  font-size: 1.5vw;\n}\n```\n\nYour base font size will now be\
    \ 1.5% of your body width, which will depend on the width of your browser window.\n\
    \nAt first, it looks like viewport sizing is the answer to your responsive dreams,\
    \ but you'll notice that, as you shrink the browser window, the font size becomes\
    \ unreadable, as 1.5% of a small viewport width is a tiny font size."
  - "[PAGE 111]\n\nOf course, you could fix this with breakpoints, but then defeats\
    \ the purpose of using this sizing unit in the first place. There's a clever workaround\
    \ for this, thanks to Zell Liew and Mike Reithmuller:\n\n```\nbody {\n  font-size:\
    \ calc(16px + 0.25vw);\n}\n/* The above won't work in Safari, but the below does\
    \ */\nbody {\n  font-size: calc(100% + 0.25vw);\n}\n```\n\nThis works by using\
    \ the CSS3 calc function to calculate a base font size (16px or 100%) and adding\
    \ 0.25% of the viewport width to it, reducing the amount of variation between\
    \ sizes as the viewport dimensions change. You're free to change the values in\
    \ the calculation to suit your needs.\n\n> Browser Support\\ Some viewport sizing\
    \ and the calc functions are not fully supported in all browsers, with even recent\
    \ versions of Internet Explorer and Edge not supporting the vmax property, and\
    \ older versions of the Android browser not supporting all calculation types in\
    \ calc.\n\nFor the remainder of this chapter, I'll use the em unit, but before\
    \ refactoring the demo site text, let's return to typography and optimizing it\
    \ for the web.\n\n# Creating Readable Text\n\nYou can use all the typographical\
    \ properties outlined earlier in this chapter in conjunction with the sizing units\
    \ also discussed, allowing for fine-grained tweaking of text to make it the most\
    \ readable on any device.\n\nThere are, of course, many schools of thought on\
    \ what “good text” looks like, and it depends on how much text your pages show\
    \ and how important it is to those pages. The example site in this book has a\
    \ small amount of text, so it's relatively"
- md: "\n# Jump Start Responsive Web Design\n\neasy to make it readable. Text-heavy\
    \ sites such as a blog will need more thought and consideration.\n\nYou should\
    \ consider what font faces, styles, sizes and layouts suit various screen sizes\
    \ and resolutions and balance this with any style guides your project may have.\n\
    \nLet's start overhauling the text of the demo site by tweaking the base properties:\n\
    \n```\nbody {\n  font-size: 1em;\n}\n```\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_112_0.png)\n\
    \nThis sets the default font size to be the browser default, likely 16px as discussed\
    \ earlier.\n\nFor the small-screen version of the page (that is, the default styles)\
    \ the show description text is actually hidden, so we needn't worry about formatting\
    \ it. However, the main site description is taking up too much space when screen\
    \ real estate is limited, so use a :not pseudo-class to reduce the default font\
    \ size and exclude the show descriptions:\n\n```\nsection.showlisting p:not(.showdescription)\
    \ {\n  font-size: 0.8em;\n}\n```\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_113_0.png)\n\
