- md: "# Better Responsive Structures with Grid Systems 59\n\n```\nColumnWidth = (SingleColumnWidth\
    \ * CurrentColumn) + \n(MarginValue * (CurrentColumn - 1))\n```\n\nAs an example,\
    \ here's how to find the value required to span two columns:\n\n```\n(SingleColumnWidth\
    \ * CurrentColumn)\n6.866666666667 * 2 = 13.7333333333\n\n(CurrentColumn - 1)\n\
    2 - 1 = 1\n\n(MarginValue * (CurrentColumn - 1))\n1.6 * 1 = 1.6\n\n(SingleColumnWidth\
    \ * CurrentColumn) + (MarginValue *\n(CurrentColumn - 1))\n13.7333333333 + 1.6\
    \ = 15.3333333333\n```\n\nThis will result in the following column styles, with\
    \ the column-n class representing the number of columns you want to span. Add\
    \ these to layout.css:\n\n```css\n.column-1 {\n  width: 6.86666666667%;\n}\n.column-2\
    \ {\n  width: 15.33333333333%;\n}\n.column-3 {\n  width: 23.8%;\n}\n.column-4\
    \ {\n  width: 32.26666666667%;\n}\n.column-5 {\n  width: 40.73333333333%;\n}\n\
    .column-6 {\n  width: 49.2%;\n}\n.column-7 {\n  width: 57.66666666667%;\n}\n.column-8\
