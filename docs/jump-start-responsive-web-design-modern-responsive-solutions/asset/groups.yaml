    ```\n\n![](img/bd4041c3e441a42781fa04a5cb5b773b_40_0.png)\n\n2-4. The aside removed\
    \ from landscape device orientation\n\n# Logical Queries with Only and Not\n\n\
    You can also make precise media queries using only and not. For example, this\
    \ media query will match devices that are at least 640px wide and exclude the\
    \ print media type:\n\n```css\n@media not print and (min-width: 640px) {\n  ...\n\
    }\n```\n\nIn contrast, this query will only apply to screen devices that are at\
    \ least 640px wide:\n\n```css\n@media only screen and (min-width: 640px) {\n \
    \ ...\n}\n```\n\n# The Building Blocks of Responsive Design 29\n\n# Query Features\n\
    \nThe width and height queries we've looked at so far are some of the most widely\
    \ used, but there are several other media features that are also useful for checking\
    \ against device features. These include color capabilities, aspect ratio, orientation,\
    \ resolution, and vendor-specific features for Mozilla- and WebKit-based browsers.\
    \ Most of these accept min- and max- prefixes that work in a similar way to the\
    \ dimension queries above.\n\naspect-ratio\n\nThe aspect-ratio feature allows\
    \ you to check the ratio of horizontal pixels to vertical pixels, separated by\
    \ a slash. For example:\n\n```css\n@media screen and (min-aspect-ratio: 1/1) {\n\
    \  ...\n}\n```\n\nThe above rule will match a device where the screen's width\
