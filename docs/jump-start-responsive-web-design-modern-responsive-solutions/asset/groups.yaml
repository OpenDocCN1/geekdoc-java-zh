    \ aside\n    display: none;\n}\n```\n\n这一对媒体查询在屏幕宽 680px 时（通过 `min-width` 询问屏幕至少有\
    \ 680px 宽）将 `aside` 元素的宽度设置为 33%，并在屏幕窄于 680px 时（通过 `max-width` 询问屏幕最多有 680px 宽）将其隐藏。\n\
    \n# 站点名称\n\n菜单项 菜单项 菜单项\n\n# 站点介绍\n\nLorem ipsum dolor sit amet, consectetur adipiscing\
    \ elit. Septem autem illum non, sed popularum nulla ullamcorper namchti erat sunt.\
