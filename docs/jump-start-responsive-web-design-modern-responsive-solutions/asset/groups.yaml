  mdcn: "\n\n# 基于网络\n\n示例网站是一个视频网站，虽然我们目前已经有了可点击的图片，允许观众在他们想要时才加载视频文件，但我们可以根据设备的网络连接使其更具灵活性。或者更好，我们可以创建一个用户偏好，让用户决定是否开启此功能。\n\
    \nNetwork Information API 尚未被广泛支持（目前仅支持 Android 上的 Chrome），但浏览器厂商的进展很快，所以当你决定实现它时，可能会获得更好的支持。\n\
    \n首先，最简单（支持率最高）的检查是查看用户是否在线：\n\n```\nif (navigator.onLine) {\n  // 执行某些操作\n}\n\
    ```\n\n诚然，这在示例中的用途有限，除非你想在尝试播放视频之前检查用户是否已经断开连接。尽管如此，考虑到所有情况仍然是一个好主意。\n\n虽然 Network\
    \ Information API 允许你检查各种值，但它目前并没有什么用。有第三方（付费）服务可以检查网络速度，但目前“最佳”解决方案是使用复杂的代码来检查图像加载所需的时间，并以此计算速度。我不会在这里重复这些代码，但如果你感兴趣，Stack\
    \ Overflow 上有一些很有用的信息。\n\n> 浏览器支持\n\n虽然 Network Information API 仍处于草稿阶段，但它是一个活跃的提案，所以当你阅读它时，可能会获得更好的支持。你可以在\
    \ API 的社区小组网站查询它的当前状态。\n\n# 用户偏好\n\n你可能在日常网页浏览中遇到过 Cookie。Cookie 通常用于保留偏好等状态。它们可以由客户端或服务器设置或读取，并在每个\
    \ HTTP 请求中传输。此示例将读取用户偏好并相应地显示页面元素。\n\n通常浏览器会在用户提交表单或执行其他操作时写入 Cookie。在本示例中，我们将手动写入一个设置：\n\
    \n```\nwindow.addEventListener(\"load\",function(event) {\n  document.cookie =\
    \ \"mature=no\";\n\n},false);\n```\n\n这决定了用户是否想看“成人”内容视频。使用此值，我们可以使用相同的技术来选择性地渲染电视节目。\n\
