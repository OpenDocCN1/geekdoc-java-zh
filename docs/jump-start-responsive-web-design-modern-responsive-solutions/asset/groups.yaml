  mdcn: "\n\n# 响应式设计的构建模块 39\n\n# 视口 meta 元素 (Viewport Meta Element)\n\n在上一节中，我介绍了如何通过媒体查询让演示页面实现移动优先。如果我在桌面浏览器中尝试该示例并调整窗口大小，一切看起来都如你预期的那样。但如果你在移动浏览器中尝试，或者使用模拟的移动浏览器，你可能会看到类似下方截图的内容，并感到失望。媒体查询难道不应该让页面在移动浏览器中表现得更好吗？\n\
