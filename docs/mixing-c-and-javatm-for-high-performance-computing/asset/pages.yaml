  md: "# 3.2.4 Parallelism Using the Parallel Java Library\n\nThe Parallel Java¹³\
    \ (PJ) library was developed as an all-Java library for parallel programming on\
    \ a single node or multiple nodes. PJ was developed by Alan Kaminsky and Luke\
    \ McComber at the Rochester Institute of Technology.\n\nPJ provides a number of\
    \ classes that simplify the syntax and legibility of parallel code. An example\
    \ for executing a parallel loop-for is shown in Listing 3-5. There are a variety\
    \ of constructs with similarities to concepts found in OpenMP. There are ParallelTeam,\
    \ ParallelRegions, ParallelSections, ParallelLoops, and ParallelIterations. See\
    \ the PJ documentation for their descriptions. Performance is shown in Figure\
    \ 3-12 and all the concurrency mechanisms designed so far, this has the best performance.\
    \ This also requires the finest lines of code.\n\nListing 3-5. Example of Parallel\
    \ Execution Using the Parallel Java Library\n\n```\nimport edu.rit.pj.IntegerLoop;\n\
    import edu.rit.pj.ParallelRegion;\nimport edu.rit.pj.ParallelTeam;\n\nclass ParallelJavaExample\
    \ {\n\n    ParallelTeam parallelThreads = \n        new ParallelTeam(Runtime.getRuntime().availableProcessors());\n\
    \n    int loopIndexBegin = 0;\n    int loopIndexEnd = 99;\n\n    void work() throws\
    \ Exception {\n\n        parallelThreads.execute(new ParallelRegion() {\n    \
    \        @Override\n            public void run() throws Exception {\n       \
    \         executeLoop(loopIndexBegin, loopIndexEnd, new IntegerLoop() {\n    \
    \                @Override\n                    public void run(int first, int\
    \ last) {\n                        // work for a range of loop indexes done here\n\
    \                    }\n                });\n            }\n        });\n    }\n\
    n}\n```"
