  md: '# 2.6 Iterative Computation – Fast Fourier Transform


    Fast Fourier Transform (FFT) code was used to compare Java and C on greater complexity
    than the matrix multiply of the previous section. Since the goal was to compare
    identical implementations, simple code that could be easily translated to multiple
    languages was chosen. An un-optimized FFT implementation from Columbia University
    was used and adapted to the testing. It was originally implemented in C13 and
    translated to Java. It uses complex data and implements an in-place, radix-2-decimation
    algorithm.


    FFT transforms for data lengths from 26 to 218 (262,144) were computed. For every
    data length, thousands of transforms are timed to collect execution time statistics.
    Java and C performance is shown in Figure 2-5. Jitter is shown in Figure 2-6.
    For those curious and familiar with FFTs the figure also shows the results of
    optimized, single-threaded, Fastest Fourier Transform in the West (FTTW)14 code
    on the same hardware. The FFTW helps establish the limits of the hardware but
    should not be compared otherwise. From the figure, it is clear that neither the
    C or Java FFT implementation is effective as FFT.


