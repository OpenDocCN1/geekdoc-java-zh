- pgno: 19
  md: 'compute-grid frameworks to understand what they have to offer and what kind
    of performance one might obtain.


    The point of this report is not to displace C but to address the still persisting
    notion that Java is summarily slow. A crafted mix of Java, C and native libraries
    can exploit the productivity and code safety of Java as well as the speed of C
    to build solutions that perform well and make good use of increasingly scarce
    development dollars and available Java-talent.


    # 1.2 About High Performance Embedded Computing Systems


    Embedded systems are characterized by running only few applications that are well
    known at design time—in a turnkey production. As production systems, repetitively
    run accredited applications, and end users are not permitted to reprogram or change
    them. They have fixed runtime requirements or least defined bounds on input rates,
    processing load, and output rates. They are embedded in the sense that they are
    collocated with or are part of a larger-oriented system or sensor. Embedded systems
    can be small, such as a cellphone, or they can consist of multiple processor nodes
    in multiple racks of equipment. This study is more concerned with the moderate
    sized systems.


    # 1.3 Why Java?


    Java was designed by Sun Microsystems (now Oracle) starting in the early 1990s
    as a way to develop software for small embedded devices that connected to each
    other. In 1995 Java was popularly released and quickly captured the attention
    of the developer community. By comparison with C, Java offers:


    +   * similar syntax for flow of control

    * leak-free memory management with automatic garbage collection, buffer overflow/under
    safety

    * an object structure. The community has accepted objects as a key to work with
    complex data structures and large modular software designs.

    * an intrinsic threading model with language constructs for cross-thread synchronization
    and locking

    * standard support for network communication and data structure serialization
    that is processing and operating system independent

    * standard lengths for numerical types

    * package, class, file, variable naming conventions that have been well accepted
    and generally implemented by the developer community

    * a processor and operating system independent byte-code format that facilitates
    code build, deployment, and movement across development, test, deployment, and
    distributed systems (including heterogeneous compute systems)

    * availability of many tools for development (including free)


    The last point is reaching benefits for some projects where the developer does
    not have to be “on” the exact target hardware for much of the development. HPEC
    hardware can often be specialized for form factor and power needs. The ability
    to develop and test the code on almost any machine can free many projects from
    the bottleneck imposed by a number of specially configured systems.'
