  md: '#  Java One Node


    This section presents the findings of several tests performed in C and Java, using
    "identical" code. A four-core system 64-bit system described below was used. The
    tests have been made available on the Internet so that readers may test their
    platforms.⁴


    The next section describes how the tests designed for this study were prepared.


    # 2.1 Approach


    This study designed benchmarks that:


    +   * test the same implementations in Java and C

    * collect performance metrics to try to characterize what performs best in which
    language

    * compare alternatives when they exist.


    Much time was spent to make sure that the tests were equivalently implemented
    in the two languages to avoid skewing the results differences. If one compared
    an algorithm that used a Java HashMap with a "similar" C program that used a standard
    template library HashMap, one would be left wondering the impact of implementation
    differences and whether they were significant.


    Since Java is object oriented and has garbage collection and C is not, it is easier
    to take a code implemented in C and translate it to Java the other way around.
    C data types, structs, and methods can be translated directly to Java. This study
    searched the open source for algorithms implemented in C and translated into Java.
    Some minor changes were made. For example, an integer flag in C being used as
    a true/false condition is implemented as a Boolean variable in Java.


    Embedded compute applications often run modally for a long time. Once input sources
    and output sinks are identified, a processing flow is often reapplied at a certain
    rate continuously for a long time. Long-term steady-state throughput over hours
    is more important than start-up time and initialization. The tests and metrics
    collected in the benchmarks in this study focus on post-warm Java behavior.


    Java and C have nanosecond resolution timing programming interfaces (API)—although
    the platform may not necessarily have clocks with nanosecond accuracy. It can
    be tedious to interact with these APIs, when one is looking to repeatedly compute
    timing statistics for elapsed time, average time, and standard deviation of time.
    For this reason, a higher-level utility was developed so that when the C code
    was translated to Java, the timing instrumentation could also be translated.


    # 2.2 About the Test Platform


    The results presented throughout this study were run on a four-core Intel Core
    2 Quad Q9650 @ 2.99 GHzertz. The operating system was Linux with kernel version
    2.6.32-220.17.1.el6x86. The C code is compiled with option "-O3" using GCC version
    4.4.6. The machine is run without a graphical desktop to minimize interference.
    The test platform had a


