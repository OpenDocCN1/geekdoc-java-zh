    # 3.4 A Summary of Java Parallelism for Numerical Computation


    Tests were performed on a four-core Linux system to see how effectively Java could
    parallelize a simple workload. Linux can run applications using default scheduling
    but also has provisions to run applications using real-time scheduling at real-time
    priorities.


    Various Java classes were tested to see how they performed at 50 percent loading
    and 100 percent loading. With Default scheduling, there were various cases of
    “thread-thrashing,” which led to erratic execution times. In one, the thread-thrashing
    was severe with the effect that adding a third or fourth core provided no computing
    gain. It is possible that the problem is related to the way the tests repeatedly
    launch multiple workloads “simultaneously” also completed simultaneously. However,
    the student did not have the resources to investigate if this was the root of
    the problem. Note, that the C version of the tests did not have this problem.


    The way that Java thread-thrashing was completely eliminated to schedule the application
    using Linux round-robin scheduling at real-time priority.


    At 50 percent loading, a C four-core load split was able to achieve the “perfect”
    execution-time reduction of 25 percent. At 100 percent loading, this increased
    to 27 percent. The best Java parallelization approach was 4 percent to 5 percent
    less effective.


    Five mechanisms for Java parallelism were compared. The three standard mechanisms
    were the Timer, ExecutorService, and the ForkJoinPool. The two third-party mechanisms
    were the use of the ParallelJava library and the Javolution library. ParallelJava
    obtained the best throughput consistently. Javolution and a Timer-based approach
    were next in overall performance. The ForkJoinPool obtained the poorest throughput
    consistently.'
