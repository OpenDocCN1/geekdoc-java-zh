- pgno: 120
  md: '# Appendix A Scala


    Scala is a relatively new language released in 2003. It can run on a Java Virtual
    Machine (JVM) though it features a more powerful and more concise syntax. It retains
    an object design and brings many powerful lessons from the world of functional
    programming to coexist with the object design. It has strict type checking but
    does not require the many type declarations that make Java feel "bloated". Since
    it runs on the JVM and is concise, the question as to whether it might retain
    sufficient performance to be considered an even attractive addition to the high
    performance toolbox Java might be.


    Scala can run on the JVM and easily use Java''s libraries. Much work has been
    put into making it easy to mix Java and Scala collection types and iterators within
    an application. Scala has power, flexibility, and the ability to define type-aware
    operators that are somewhat like operator overloading. Scala''s power comes at
    the cost of a bit more language intricacy that requires more learning than one
    might want.


    However, Scala is also concise without sacrificing strong type checking. The investigator''s
    experience with Scala suggests that the same Java function can be coded with about
    three-quarters of the number of lines of code.


    The first experiment with Scala was an implementation of the red-black tree insertion
    test described in Section 2.8. In Scala, everything can be treated as an object
    including numbers. The red-black tree algorithm used in this report was based
    on generic objects making this easy for translation to Scala. But the language
    also has a provision that allows specialized/faster code to be generated if certain
    classes are instantiated for primitive types instead of objects. This creates
    multiple versions of the generic class (such as the red-black tree) but should
    provide better performance. Thus, the red-black tree tests for Scala were both
    ways, with specialization and without.


    Figure A-1 compares the Java insert and tests for four-byte content with a Scala
    version and a Scala version with the @specialized annotation on the keys of the
    red-black tree and red-black node. The unspecialized Scala implementation was
    a little slower than the Java version, though still faster than the C version
    documented earlier in this report. The specialized version did a little better
    than the Java version.'
