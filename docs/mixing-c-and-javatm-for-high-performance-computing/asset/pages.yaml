  md: 'The fastest way to call C from Java is to manually code a JNI proxy class that
    accepts the Java call and mediates the call to the C method. JNA is well known
    to be slow and the findings here confirm that HawJNI performs better than JNA
    but not as well as Bridj and SWIG.


    Bridj and SWIG are the fastest overall. Bridj is faster and is platform independent
    within the platforms supported by Bridj. SWIG is slower, and more difficult to
    learn and work with, but yields interfaces that can be compiled for any platform
    that has C. SWIG, however, has great potential for customization, which means
    that with sufficient work it could ultimately be faster than Bridj.


    If an application is being developed on a platform supported by Bridj, the best
    strategy may be to generate the Bridj-based glue using JNArator. If call times
    are too slow and if the data (either arrays or structs) is native, then the developer
    can modify the Java proxy to utilize Bridj’s @Ptr mechanism.


    If the platform is not supported by Bridj then there are two options. If the data
    is primarily array data, JNI can be used "by rote" which yields the ultimate in
    speed. If there are C structures involved, then SWIG facilitates working with
    those.


    Table 4-2 summarizes the pros and cons of these technologies along with this investigator’s
    assessment of ease of use for working with array-based data.'
