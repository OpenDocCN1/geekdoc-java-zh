    # ## 6.5 Java Framework Summary and Observations


    This study was motivated by the desire to more quickly depict intricate performance
    and HPEC applications including multi-node applications. In this section we examined
    5 Java compute-grid frameworks to understand capabilities, architectural models,
    and expected performance. Pi³³, JPPF⁵⁴, GridGain⁵⁵, Storm⁵⁶, and Akka⁵⁷ were tested
    on a 10 giga-byte Ethernet cluster. The frameworks have different architectures,
    deployment models, ease of setup, and ease of use. There are different options
    for method invocation, distributed task and job queuing, multimode synchronization,
    actor communication, data flow processing, and failure recovery. GridGain has
    the most built-in features and was the easiest to set up and for distributed method
    invocation though it was not the fastest. The actor and dataflow of Akka and Storm
    may be more “natural” for some types of problems.


    It was expected that performance would be less than that of the high performance
    community’s Message Interface (MPI) since several of the Java frameworks offer
    greater capability and flexibility than MPI which often comes at the cost of lower
    performance. None of the Java frameworks performed comparable to MPI for small
    message sizes. Java serialization overhead increases the payload to exchange messages
    and remove remote methods. If the data size is just a few bytes longer than the
    developer who needs more performance will want to write a custom serializer to
    avoid the default serialization overhead.


