    As a final note, the Java Runtime API includes a class, java.lang.Compiler, with
    methods to direct the Runtime to compile the specified classes. However, implementation
    of the behavior is optional. JVMs may implement these as “no-ops.” Oracle Java
    7, Standard Edition, in particular seems to implement these as no-ops.


    # 2.4 Reasons for Jitter


    A C application running in a non real-time operating system will be subject to
    clock interrupts, I/O interrupts, other operating system interrupts, scheduling
    irregularities, and more. Real-time operating systems have facilities for suppressing
    those while the application threads are running/or ensuring that interrupts are
    served by cores that are not dedicated to the application. Note that the Linux
    kernel has to restrict the general system to certain cores and ways to attach
    specific processes to cores.


    Java applications are subject to the source plus additional ones. As described,
    dynamic loading and initialization will cause initial loads to take a long time.
    Code running under interpreted mode may have initial jitter even between successive
    executions of the same code. Code compiled by the JIT can change speed as increasing
    optimization is applied to frequently used code. There are real-time run-time
    environments that forgo the ultimate speed potential so they can achieve execution
    time repeatability. Finally, work by the garbage collector may require the executing
    thread to temporarily halt the garbage collector is competing with the current
    thread for needed CPU time.'
