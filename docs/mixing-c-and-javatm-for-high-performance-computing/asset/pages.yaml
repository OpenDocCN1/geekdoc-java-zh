    The phrase "Java warming" captures the fact that Java runs faster beyond the loading
    and initial processing stages. In this study, the statistics collected and presented
    are either post warm-up or both the non-warmed and warmed results are presented.
    Warm-up time can be tolerated for applications that run for a long time if subsequent
    performance is good.


    The effect of warming is illustrated in Figure 2-1. The figure shows the execution
    time for sequential iterations of a pure memory-based algorithm that has no I/O.
    In each iteration empty-black tree is created and filled using a series of key-value
    insertions. A series of gets are executed and timed. The first iteration takes
    so long that to avoid "saturating" the vertical axis. Iterations 2 to 26 take
    from 0.16 to 0.3 microseconds (µs). At iterations 27, 46, 94, and 301 this changes
    to 0.08, 0.22, 0.020, and 0.010 µ respectively. The final speed is much faster
    than the earlier iterations. Table 2-1 shows the computed speedup factors, depending
    which one is empty to compare to the final.


