    \ class will initially allocate character arrays and reallocate bigger ones if\
    \ required. Appending to an existing instance simply allocates space within the\
    \ object's internal array. The instance of the StringBuilder can also be reset\
    \ to zero length and reused avoiding the overhead of memory allocation and potentially\
    \ adding garbage collector.\n\nIt is best to estimate how the StringBuilder should\
    \ be when it is instantiated to reduce intermediate reallocation of internal arrays.\
