    Based on these tests this investigator''s opinion is that Scala can be used in
    the performance environment provided that the ScalaCL plugin is used to expedite
    the speed of simple integer-based for-comprehension loops. Much performance code
    relies on existing libraries and algorithms that have their roots in old Fortran
    code with for-loops. Converting these to while-loops by hand would be too burdensome
    and error prone. Scala''s conciseness compared to Java is a great win for the
    JVM.'
