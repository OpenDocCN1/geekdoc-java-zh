- pgno: 116
  md: '# #9 Conclusions


    This study sought to show that Java 7 Standard and C could be mixed in a hybrid
    high performing application. The motivation was to offload the C compute intensive
    work to Java where development is usually faster and safer and where there are
    intricate infrastructure and grid-computing frameworks.


    A hybrid application would likely use Java for communication, logging, resource
    scheduling, etc., and leave the heavy computation to C-based code. Nonetheless,
    the study explored Java performance to get comfortable with Java performance overall.
    The study compared several libraries and approaches for invoking native C code
    from Java. It collected metrics showing how the choice of Java-side or native-side
    data limited counted rates. It investigated third-party libraries to facilitate
    native memory allocation and management. It also measured the overhead of Java
    background threads. FFT code optimization for execution in GPUs to compare C and
    Java utilization of GPUs. The study also looked the boundary of a single node
    and investigated the characteristics and performance of 5 Java-grid frameworks.
    Finally, in the appendices, data was presented on the scale of Scala, a modern
    language that runs on the JVM, and Jython, a version of Python suitable for scripting
    on the JVM.


    The investigation of Java-based computation showed that for some computations
    Oracle 7 Standard was as fast as GCC compiled code that was translated to Java.
    Bit-twaddling and matrix multiplication were faster in Java. Allocating, manipulating,
    and accessing the red-black tree structures were also faster when the size of
    the data structures and inserted into the tree was less than a few hundred bytes.
    It was seen that the speed of dynamic memory allocation was better for smaller
    allocation sizes than for larger ones. Performing FFTs, using the non-optimized,
    radix-two kernel, was faster in C. It is hypothesized that the Java compiler and
    JIT runtime optimizations do a good job with small loops and simple array indexes.
    FFT "butterflies" have multiple array indices with intricate sequence of array
    indices.


    The investigation on concurrent computation showed that the latest libraries and
    APIs for parallelized "for-loop" are third-party libraries. The Parallel Java
    library provided the best performance followed by the Java library. They fell
    3 to 5 percent short of C''s performance on the same tests. The investigation
    also revealed that there can be adverse interactions between Java thread scheduling
    and Linux default scheduling that can be detected by measuring application execution.
    Using Linux round-robin real-time scheduling.


    The investigation on Java overhead showed that in the absence of garbage collector,
    there was no measurable overhead for computation and in-memory manipulation. On
    the other hand, a poorly tuned, memory allocation/deallocation-intensive task
    with approximately seven garbage collector activations per second caused a 15
    percent decrease in throughput. A well-designed and tuned-application would have
    much fewer garbage collector activations and imperceptible garbage collector activity.


    A mixed Java-C compute application may want to use the graphics units, GPUs, under
    control of Java. The investigation compared the ability of Java and C to invoke
    a GPU. Data was allocated natively using BridJ. JavaCL was used to access the
    OpenCL service, which provided access to GPU functions. Java took about 2 microseconds
    longer than C''s 20 microseconds to set up and queue an OpenCL kernel computation.
    But that did not result in a 20'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'percent decrease in GPU throughput because kernel setup and queuing proceeds
    in parallel with GPU execution. There was no more than a 2 percent difference
    in the effective GPU throughput for most data sizes between 64 and 524,288.


    Regarding invoking native libraries, the investigations showed that when native
    data is used SWIG and Bridj can perform comparably to hand JNI (which is the low
    level Java call mechanism). Bridj, which is supported on many platforms, makes
    it very easy to locate and manage the native data. This includes garbage collection
    of the native data when it is no longer referenced by the Java code. SWIG is powerful
    but has more complexity and requires more learning. However, if the target platform
    is not one of the supported ones, SWIG may be then the best choice.


    Five computer-grid frameworks, ³¹¹ JPPF, GridGain, Storm, and Akka, were tested
    on a 10-gigabyte Ethernet cluster. Collectively the frameworks offer such as auto-discovery,
    auto-failover, inter-node data synchronization, data serialization, multi-node
    queuing, active monitoring and load balancing which can save significant developer
    time. They were compared with each other and to MPI, which is the benchmark for
    performance computing.


    With greater flexibility and features, the more sophisticated frameworks were
    not expected to perform as well as MPI. Only MPI and low-level Java I/O could
    handle small data sizes at rates of 10,000 synchronous round-trip exchanges per
    second. On the other hand Akka and Storm achieved 10,000 asynchronous round-trip
    exchanges per second. For many applications with lower requirements, other frameworks,
    such as GridGain and JPPF, could be used as well. Even a C framework offering
    enhanced flexibility and features would be expected to have poorer performance
    than MPI.


    Two investigations were conducted and presented in the appendices. One looked
    at Scala because some have thought it might be a successor to Java. It is potentially
    attractive for embedded high performance computing because it is more concise
    but only if it retains Java''s throughput. On matrix-multiply and FFTs the investigation
    found that for-loops need to be implemented as while-loops because of increased
    overhead in Scala''s for-based looping statements.


    The second language investigation presented in the appendices is use of Python
    for scripting. Python was found to have more performance comparable to CPython
    than Java or C. It was faster to call out native libraries than CPython though
    slower at numerical computation. PyPy, a faster implementation of Python was found
    to be slower than Java by a factor of two for matrix multiplication.


    Java, and the JVM, can be part of the performance tool chest for applications
    that run long enough to allow Java 7 Hotspot warmup optimizations to “kick in”.
    Dynamic memory allocation should be minimized by preallocating working storage.
    Other practices for good performance were also discussed in the body of this study.


    A crafted mix of Java and C can exploit the productivity and code safety of Java
    as well as the speed of C to build solutions that perform well and make use of
    increasingly scarce developer dollars and available Java-talent. It is hoped that
    the developer will find this report and its findings helpful in making quantitative
    trade-offs leading to good, hybrid applications.'
  merge: -1
  img_proc: true
