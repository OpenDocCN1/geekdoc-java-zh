  md: '# # Writing Java Code for Performance


    This section describes coding practices to help get the best performance from
    Java applications. The practices are based on the investigator''s experience and
    those of his peers.


    # ## 7.1 Minimize Memory Allocation within Repeated Processing Paths


    A memory intensive test described in a previous section found a 15 percent overhead
    due to garbage collector activity on that test. Other tests show execution jitter
    due to memory allocation/deallocation. One clear way to improve Java performance
    for Oracle''s Java 7 Standard Edition is to minimize memory allocation, especially
    on repeated paths.


    Garbage collection is a great benefit but its convenience and transparency can
    lead developers to overuse dynamic memory. The garbage collector has been the
    focus of continued development for many years not by Oracle/Sun, but also by vendors
    of JVMs. Oracle''s Java 7 collector, G1, the latest in the Oracle/Sun line of
    improvements.


    On the positive side, the developer is free of keeping track of unused memory
    structures. On the negative side, the garbage collector is an additional thread
    that must periodically run to recover the memory of unused structures. The scanning
    takes time that detracts from the main processes. When the times the garbage collector
    runs are unpredictable from the point of view of the application, contributing
    to execution jitter.


    Note that some data structures allocated in a limited scope of code may not cause
    extra garbage collector work. If it is detected at run that an object instantiation
    is not used outside of the scope the object may be allocated on the stack. If
    the object is simple enough, it may not even be created. In Java 6, this escape
    analysis was off, but in Java 7 it is enabled by default.


    # ## 7.2 Preallocate Working Buffers and Structures


    For non-real time the best thing to do is to give the garbage collector as little
    to do as possible. Preallocating buffers and structures helps accomplish this.
    This includes double buffers used to separate threads to move data and process
    simultaneously.


    Since preallocation tends to "break" encapsulation, it is not typically done in
    Java code. Under the object philosophy, an object manages its own allocation of
    working structures without regard for reuse, relying on the memory mechanism to
    clean up. Thus, "performance" Java coding has to take exception to this design
    practice in favor of the more efficient practice of preallocation.


    > 65 The Garbage-First Garbage Collector, <http://www.oracle.com/technetwork/java/javase/tech/g1-intro-jsp-135488.html>.


    > 66 [Choi] Jong-Deok Choi, Manish Gupta, Mauricio Stefano, Vugraman C. Sreedhar,
    Sam Midriff, "Escape Analysis for Java," Proceedings of ACM SIGPLAN OOPSLA Conference,
    November 1, 1999


    > 67 Goetz, Brian, "Java tech and practice: Urban performance legends, revisited,"
    2005, <http://www.ibm.com/developers/java/library/jip09275/index.html>.'
