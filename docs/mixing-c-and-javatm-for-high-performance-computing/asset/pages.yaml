- pgno: 20
  md: '# 1.4 Why Not Java?


    Java application start-up can be slower than that of other languages for reasons
    discussed in the body of this report. On the other hand, high performance codes
    are often long running. The longer it runs, the less significant start-up time
    is.


    Java leads to variable execution times. Vendors of real-time Java systems have
    Java compilers and run-time environments to address this. The typical desktop
    Java (perhaps one used for development) may have variable execution time but the
    target-run environment can have more predictable execution times. The author’s
    experience, however, is that while some real-time Java systems can achieve significant
    predictability, they do so at the expense of overall speed.


    Java is more succinct than C largely due to the absence of C include files, which
    are typically used to define structures and method signatures. Java is less succinct
    than other languages such as Ruby, Python, and Scala. Languages such as MATLAB¹
    are more succinct for many types of numerical processing.


    Succinctness is desirable but code safety and these are often at odds with one
    another. At least one language² shows that the defect rate in code is more dependent
    on the number of lines of code written by an individual programmer than on the
    language. The author’s experience with Scala suggests that the same function can
    be coded with three-quarters of the number of lines of code. In one experiment³
    Ruby also required about three-quarters the amount of code, though Python required
    approximately half of the amount of code.


    # 1.5 Study Goal


    This study is not a comprehensive comparison of languages or frameworks. The focus
    is on showing that Java (and a little more generally the Java Virtual Machine
    (JVM)) can have a good role in performance processing. The goal is to understand
    how well by quantifying performance of different types of code. With a quantitative
    understanding, the developer can then make better engineering trade-offs as how
    to mix Java and C. The next section starts the analysis looking at Java performance
    on different algorithms.


    > ¹ MATLAB is a trademark of The MathWorks, Inc.

    ² Hatton, Les. "Why is the defect density curve U-shaped with component size?"
    for IEEE Software, April 27, 1996.<http://www.leshatton.org/wp-content/uploads/2012/01/Ubend_IS697.pdf>

    ³ Nene, Dhananjay. "Performance Comparison - C++ / Java / Python / Ruby / Jython
    / JRuby / Groovy.\<http://blog.dhananjaynene.com/2008/07/performance-comparison-c-java-python-ruby-jython-jruby-groovy/>'
