    # 2.9 Java Overhead


    This section attempts to quantify how much processor is consumed by the JVM and
    how much of that is due to garbage collection. This can be done for any specific
    case but one cannot generalize the findings because so much depends on what the
    application is doing. Notwithstanding the caution, tests were designed for two
    cases. One has no dynamically allocated memory. The other case has a lot of dynamically
    allocated and free memory and forces a lot of collector activity by picking small
    Java heaps to force frequent garbage collection.


