    C code was approximately 18 nanoseconds.


    Java is run under Oracle''s Java SE 7—Runtime Environment (build 1.7.0_02-b13);
    Java HotSpot(TM) 64-Bit Server VM (build 22.0-b10, mixed mode). Other versions
    and vendors'' JVMs were selectively used to verify the consistency of the observations
    others have not reported. For most tests, the following Java command line flags
    were used:


    -Xms500m -Xmx1500m -Xincgc -XX:+UseCompressoops -XX:+UseNUMA -server


    Since there are several versions, one must be careful to catch the findings of
    this report as applying to Oracle Java 7. Other vendors'' JVMs have different
    execution characteristics especially with regard to the trade-offs between jitter,
    speed, and garbage collector predictability/behavior.


    # 2.3 Java Initialization and Warming


    It is widely known that Java Standard Edition start-up is slow. To be fair, it
    is recognized that there are vendors who precompile and significantly reduce start-up
    time. However, the following discussion will be limited to the Oracle, Java 7
    Standard Edition.


    The first execution of code under Standard Edition is slow in comparison to future
    executions for several reasons. One reason is to class loading. Java classes are
    loaded one-by-one as needed at time. In C, entire code are pulled together by
    the linker as a unit. In Java, individual classes are loaded as needed, which
    can require more input/output (I/O). The specification additionally requires various
    class validations and verifications as classes are loaded.


    A reason for start-up slow is due to static initialization. The compiled Java
    code, which is platform independent, is not memory image that can be loaded into
    memory. A memory image is platform dependent. Thus, initializations, as static
    integer variables that are initially non-zero, actually require code to be executed
    at their run time.


    After loading, execution is monitored by an just-in-time (JIT) compiler—HotSpot.
    Hotspot actively gathers statistics while the code is running. Hotspot may decide
    that the code that is running in an interpreted fashion should be recompiled into
    native code for better performance. Method calls that can be safely in-lined have
    their code moved into other methods to avoid the overhead of putting arguments
    on the stack and


    > ¹ Some JVM''s such as IBM® J9 have options to improve initial load time. They
    used ahead-of-compilers (AOT) and they compiled class caches to reduce the need
    for code in interpreted mode. They speed up execution time, the code can get faster
    with time if they use active profiling and runtime optimization and memory recompilation.


    > ² Java SE HotSpot at a Glance. Oracle Technology Network. <http://www.oracle.com/technology/java/javase/index/jsp-136373.html>


    > ³⁷ Toshio Sugano, Takashi Yuki, Motohiro Kawahito, Hideaki Katamoto, and Toshio
