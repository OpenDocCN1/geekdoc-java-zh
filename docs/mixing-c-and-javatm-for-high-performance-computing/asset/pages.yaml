- pgno: 67
  md: '“Lets you call C, C++ and Objective-C libraries from Java as if you were writing
    native code. It is a recent alternative to JNA. With the help of [the tool] JNAerator*,
    it provides clear and unambiguous mappings to C/C++ and a very straightforward
    and highly typed API to manipulate pointers, classes, structs, unions...”


    With JNAerator, a Java jar file can be generated that has all the necessary glue
    logic prebuilt and can include the native library inside for ease of use. With
    Bridge, Java code can be used to allocate structures in native memory, eliminating
    the need to convert Java data into C with the associated overhead. Also, Bridge
    creates Java objects that can be called on the C-side when the Java objects are
    reclaimed. Thus, Bridge allows the developer to leverage the Java garbage collector
    to keep C data properly collected as well. The code that JNAerator generates is
    pure-Java, which means the resulting Java classes will run on any machine and
    operating system that Bridge already runs on.


    SWIG²;


    > “Is a software development tool that connects programs written in C and C++
    with a variety of high-level languages. SWIG is used with different types of target
    languages using common scripting languages as Perl, PHP, Python, Tcl and Ruby
    [and Java ] ... SWIG is typically used to parse C/C++ interfaces and generate
    the ‘glue code'' required for the target languages to call into the C/C++.”


    To generate this code requires that the developer a SWIG-specific interface file
    that identifies a variety of structure mapping options and the API that is to
    be exposed. SWIG generates proxy Java and code. The code must be compiled and
    linked for the target machine and operating system.


    Finally, HawtJNI³;


    > “HawtJNI is a code generator that produces the JNI code needed to implement
    Java native methods. It is based on the jenigen code generator that is part of
    the SWT Tools project which is used to generate all the JNI code which powers
    the eclipse platform.”


    HawtJNI lets the developer write a Java source class with methods that match the
    C methods and it generates the required JNI code proxy. For those like Maven⁴,
    it is well integrated into Maven.


    # 4.1 Generating Bridge Code for Java to Invocation


    Each of the bridging tools/libraries has its own way to create the bridge code
    to C. For the experiments performed here, the targeted C code is shown in Listing
    4-1 and Listing 4-2. The code is shown in twos for clarity.


    ³⁸JNAerator - Native C / C++ / Objective-C Libraries Come to Java! <http://code.google.com/p/jnaerator//>


    ³⁹SWIG. <http://www.swig.org/>


    ⁴⁰HawtJNI. <http://fusesource.com/sites/hawtjni/>


    ⁴¹Apache Maven Project. <http://maven.apache.org/>'
