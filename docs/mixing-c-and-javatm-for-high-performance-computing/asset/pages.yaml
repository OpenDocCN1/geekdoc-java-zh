  md: 'generation, and, red-black sorting. These exercise the processor in different
    ways. The matrix multiply has nested loops with small compute bodies and sequential
    array indexes. The FFT has bigger loops and non-sequential array indexes. The
    LFSR sequence requires integer-based masking and Boolean operations. The red-black
    tree is highly recursive and requires significant dynamic object creation and
    cleanup.


    The testing was performed using Oracle Java 7 Standard Edition on Intel four-core
    x86 system running Linux operating. All data was collected after the application
    allowed to exercise the processing paths Java execution is faster after warmup.
    The Java matrix multiply faster than the C version that was compiled with a GNU
    compiler at its highest level of optimization. The Java FFT performance was 20
    to 40 percent slower than C''s. This is likely due to the more complex and non-sequential
    use of array indexes as compared with the matrix multiplication. On the LFSR sequence
    the Java implementation 30 percent faster than the one in C.


    These three tests require no memory allocation for computation. In contrast, the
    red-black tree sorting requires heavy use of memory allocation to allocate space
    for keys and values to be inserted into the tree. The entire tree and its contents
    are deposited between iterations, requiring the garbage collection system to recover
    unused memory. For small and moderate allocations Java was a little faster for
    insertion and a slower than C for retrieval. The faster insertion degraded poorer
    as the allocation increased.


    The fact that sometimes the Java computation is fast and sometimes slower suggests
    that:


    +   - Hardware architecture, such as cache size, instruction pipeline depth, and
    throughput of floating point integer arithmetic logic units may impact these findings.


    +   - The quite designer should test the kernels to really know what the interaction
    of the code and the target hardware will. It should not be assumed that C code
    would be faster.


    +   - Even if the heavy computation is done in C, incidental computation might
    be handled by Java. In the end the bigger consideration may be whether the data
    is located in Java or the native side and how many times it has to move back and
    forth.


    The findings confirm that the overall performance of Java can be comparable to
    C''s–after Java warmup. Typically


    The Java application will always utilize multiple threads for runtime maintenance
    even if the user code does not start threads. In a multicore machine the maintenance
    work can have little impact on the main work thread(s) if the main threads are
    not sharing the same cores. A test was designed to measure the maintenance load.
    FFT and red-black tests were instrument to measure work computation time as the
    number of processor cores varied. This was confirmed that there is no dynamic
    memory allocation there is no measurable overhead. On the other hand, the red-black
    tree test was intentionally run with very limited memory to force about garbage
    collector operations per second. The impact was a 15 percent decrease in throughput.
    A well-tuned application would significantly less garbage collector activity.
