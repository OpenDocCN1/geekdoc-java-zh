  md: "# ### 3.2.5 Parallelism Using the Javolution Library\n\nThe Javolution¹⁴ library\
    \ is an open-source library developed for real-time and embedded systems. It was\
    \ developed by Jean-Marie Dautelle to provide deterministic execution times. It\
    \ has facilities for concurrent execution of code blocks and facilities to facilitate\
    \ interfacing with C. It also provides Java structures as Maps and Lists that\
    \ were designed to minimize memory allocation, which helps reduce garbage collector\
    \ interruption.\n\nAn example using Parallel Jave is shown in Listing 3-6. Benchmark\
    \ performance is shown in Figure 3-14 and jitter in Figure 3-15. Normalized execution\
    \ time is shown in Table 3-1. In this test, execution evaluated the smallest two-way\
    \ crossover point making it better suited than alternative approaches for parallelizing\
    \ small workloads.\n\n# Listing 3-6. Example of Parallel Execution Using the Javolution\
    \ Library\n\n```\nimport javolution.context.ConcurrentContext;\n\npublic class\
    \ JavolutionExample {\n\n    void work(final int nThreads, final int length) throws\
    \ InterruptedException {\n        // This increment may be off by a little\n \
    \       // The last thread but is good enough for this example\n        final\
    \ int increment = length/nThreads;\n        ConcurrentContext context = new ConcurrentContext();\n\
    \        try {\n            int baseIndex = 0;\n            for (int j = 0; j\
    \ < nThreads; j++) {\n                final int startIndex = baseIndex;\n    \
    \            ConcurrentContext.execute(new Runnable(){\n                    @Override\n\
    \                    public void run() {\n                        doWorkFragment(startIndex,\
    \ increment);\n                    }\n                });\n                baseIndex\
    \ += increment;\n            }\n        } finally {\n            context.exit();\n\
    \        }\n    }\n\n    void doWorkFragment(int startIndex, int numberOfIterations)\
    \ {\n        // work done here\n    }\n}\n```"
