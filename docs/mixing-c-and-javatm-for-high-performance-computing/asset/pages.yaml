  md: 'The absence of language features to simplify parallel for-loops iteration will
    frustrate some with a traditional computing background. Parallel Java has the
    most concise way to do this. On the other hand, this investigation viewed very
    narrowly on for-loop-based numerical computation. The reader may decide that one
    of the other methods is more appropriate for other types of concurrency.


    There is a key lesson here. Given that there are a variety of concurrency techniques
    available to the Java developer, the developer should instrument their application
    and compare the parallelized and unparallelized versions of their application
    to ensure they are obtaining the expected behavior.'
