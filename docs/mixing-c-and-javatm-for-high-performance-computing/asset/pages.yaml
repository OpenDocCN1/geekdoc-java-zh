    main part of framework latencies which were higher than that. The observed Java
    framework latencies, ranged from 236 to 1320 microseconds. While we could not
    analyze why, we must assume that the large framework latencies are due to some
    combination of the grid/data models, framework software architecture and perhaps
    un-optimized design implementation. For example, with Storm, data must be “wrapped”
