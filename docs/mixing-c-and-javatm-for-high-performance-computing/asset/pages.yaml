  md: '# # Appendix D CPU Loading for Tested Frameworks


    Data on central processing unit (CPU) loading was collected for the synchronous
    and asynchronous framework tests presented in Section 6.4. Tables D-1 and D-2
    show the data. The percentage shown is the total of CPU loading between the two
    nodes. The two numbers in parenthesis are the percentages at each node. The data
    was collected in the hope that it would provide some insight into the CPU time
    "cost" of running the framework.


    It is difficult to generalize conclusions from the findings. MPI displays pretty
    similar loading for different sizes in both synchronous and asynchronous tests.
    The similarity between the synchronous and asynchronous tests can be explained
    by the only difference that the asynchronous version of the test had a round-robin
    buffer system that allows up to 4 outstanding buffers to be in transit. The majority
    of the test is spent transmitting or receiving the (albeit delayed) buffer. On
    the other hand the Parallel test used the same round-robin buffering scheme and
    does not exhibit consistent behavior.


    Storm exhibits very low CPU loading for synchronous data exchange even compared
    to MPI. Its load increased with the asynchronous tests.


    Other than JPPF, the Java frameworks used less CPU than MPI for the synchronous
    tests but higher CPU than MPI for the asynchronous tests.


    The findings have been presented here for future reference.


