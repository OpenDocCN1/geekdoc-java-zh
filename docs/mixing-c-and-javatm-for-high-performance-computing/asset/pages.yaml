- pgno: 18
  md: '# # 1 Introduction


    # ## 1.1 Motivation and Intended Audience


    This work is intended for delivers improvements of high performance computing,
    especially those of high performance embedded computing (HPEC) applications. HPEC
    can cover a range from smaller read-only memory (ROM)-based devices to larger
    multi-board, disk-based, turn-key systems. This study is focused on the latter.


    HPEC software includes not just computational browse but also management and infrastructure
    software for communication, processor/core allocation, task management, job scheduling,
    fault detection, fault handling, and logging. HPEC software development has required
    extensive software development to get the highest performance relative to limitations
    on size, weight, and power dissipation. In the past, limitations often drove the
    choice between dedicated logic or programmable processors.


    There have been significant improvements in processing capabilities relative to
    these limitations as processor features have shrunk over time and additional cores
    have become available in commodity processors—resulting in the trend to move away
    from dedicated logic and specialty processors to commodity-based processors. As
    the hardware and run-time executives of sensor platform are updated, software
    is often discarded and new versions are redesigned and reimplemented. As a result
    of this additional processing capability, it is now possible to apply more robust
    software options for HPEC—ranging from fuller-featured operating systems to Java.
    Java frameworks support portability between multiple hardware and operating system
    platforms. Utilizing Java frameworks would reduce redesign and implementation.
    There exist numerous commercial and open Java frameworks that provide hardware-independent,
    ready solutions to multi-processor infrastructure needs. Java''s potential for
    fewer defects, enhanced code safety, and code spanning an Internet-scale repository
    of frameworks, libraries, and tools cannot be dismissed. There is also a large
    talent pool of Java developers that could be tapped for development.


    The premise of this research is that it is possible to mix Java and C (and optimized
    native libraries) and maintain good performance. The question is how to mix these?
    Does Java perform well by itself? Are there algorithms that are implemented in
    one or the other? If Java calls C or native libraries is the overhead? What are
    the best ways to code Java? How much of a performance "hit" should one expect
    due to dynamic memory allocation and the garbage collector''s atomic cleanup?


    To mix Java and C, the design engineer will want to make trade-offs based on initial
    quantitative expectations of what those trade-offs mean to performance. This report
    attempts to quantify some of these expectations by testing Oracle HotSpot-based
    Java in different ways and comparing the results to for equivalent C. This report
    also documents coding patterns that lead to good performing Java.


    Today''s processor systems usually include graphics processing units (GPU) that
    can be invoked from the main central processing unit (CPU). Again this report
    provides results of quantitative experiments to determine how much Java overhead
    one might expect when using GPUs.


    Embedded turn-key systems often utilize more than one processor to handle the
    load and to provide redundancy and/or failover capabilities the capabilities of
    Java'
