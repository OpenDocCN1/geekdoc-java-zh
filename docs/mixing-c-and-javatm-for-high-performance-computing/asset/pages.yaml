  md: '# Java and Scala Compared on Red-Black Tree Tests


    ![](img/81c9dc4f446215f3827ad5c523130d89_121_0.png)


    Figure A-1. Java and Scala Red-Black Insert and Get Performance


    The matrix multiply requires three nested loops. This makes a good test to understand
    the performance of Scala loops. Scala''s for-comprehensions are also “syntactic
    sugar” for higher-order methods. The for-comprehension is a general construct
    that can be used for iteration over a variety of types and can include filtering
    of iterated types as well. This results in a very compact syntax for a sequence
    of more complex operations, but it has the downside effect that a simple sequential
    integer-based iteration is not as simple as a byte-code loop.


    There has been much discussion of this issue.¹ The compiler, as of Scala 2.10.2,
    still generates code with the slower for-comprehension for integer-based looping.
    However, there is a Scala compiler addition targeted for Scala 2.11 which will
    perform the desired optimization.²


    Figure A-2 compares the Java matrix multiply test described in the body of this
    report to its Scala counterpart. A test was run using a for-comprehension and
    by converting the loop into a while-loop. For Scala, the for-comprehension had
    poor performance for N < 18. On the other hand, the Scala while-loop-based implementation
    performed nearly the same as the Java implementation.


    > ¹See two of many discussions at <http://stackoverflow.com/questions/6146182/how-to-optimize-for-comprehensions-and-loops-in-scala>
    and <https://groups.google.com/forum/#topic/scala-user/hq20XLvRjg>.


    > ²See the ticket, <http://issues.scala-lang.org/browse/SI-1338>.


    > ³ScalaCLPlugin, <http://code.google.com/p/scalacl/wiki/ScalaCLPlugin >'
