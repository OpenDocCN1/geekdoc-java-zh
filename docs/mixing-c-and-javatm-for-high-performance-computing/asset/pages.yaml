  md: '# Table 5-2. Java-Based OpenCL Libraries, JavaCL and LWJGL


    | Library | Summary |

    |---|---|n| JavaCL and OpenCL4Java (nativeLibs4Java) | * OpenCL 1.2

    * JavaCL is an abstraction tier built over OpenCL4Java which contains thelevel
    bindings that closely match the OpenCL API.

    * Kernel execution is handled via the com.native.opencl.kernel class. This class
    has multiple setArgs() overloads to facilitate passing scalar values and isolate
    the memory pointer ambiguities.

    * Automatically checks error codes and converts them to Java exceptions

    * Adds thread safety if running on OpenCL 1.0

    * No platform-specific OpenCL native libraries like BridJ has platform-specific
    native libraries for MacOS X (x86, x64, ppc), Linux (x64, x86), Solaris x86 (32,
    64), Android |

    | The Lightweight Game Library (LWJGL) | * http://www.lwjgl.org/

    * OpenCL 1.2

    * OpenCL support is part of a larger library targeted to game developers on small
    (J2ME) devices. OpenCL support is found in the org.lwjgl.org package.

    * Setting kernel arguments is done via the org.lwjgl.opencl.CLKernel class. This
    class has multiple setArgs() overloads to facilitate passing scalar values and
    isolate the developer from memory pointer ambiguities. Queuing a kernel is done
    via one of the classes; CL10, CL11, CL12. These implement the constants and methods
    of the corresponding OpenCL specifications 1.0, 1.1, and 1.2.

    * The developer must check return error codes that occur with native OpenCL.

    * Platform dependent JNI native libraries for Linux(x86, x64), MacOS X(x86, Solaris)(x86,
    x64), Windows(32) |


    JavaCL, from the nativeLibs4Java project, was chosen for testing. JavaCL has a
    primitive mechanism for allocating and deallocating native storage based on the
    capabilities of BridJ. BridJ provides a general ability to interface with C structures,
    not just arrays. This capability could make it ideal for use in a multi-Java environment
    that includes GPUs as other types of native access. JavaCL also checks OpenCL
    return status and converts them to Java exceptions when errors occur. This allows
    the Java developer to use try-catch blocks, which may be more appropriate for
    multi-scoped error catching.


    There was a concern about the performance impact of additions such as the conversion
    of errors to exceptions. A test was designed to compare the rates at which Java
    (using JavaCL) and C can invoke kernels for FFTs using a variety of data sizes.
    Optimized FFT kernels developed by'
