    import java.util.concurrent.RecursiveAction;\n\nclass ForkJoinExample {\n    int\
    \ nThreads = Runtime.getRuntime().availableProcessors();\n    ForkJoinPool forkJoinPool\
    \ = new ForkJoinPool(nThreads);\n    List<RecursiveAction> forks = new ArrayList<RecursiveAction>(nThreads);\n\
    \n    void work() {\n        int startIndex = 0;\n        int totalIterations\
    \ = 1000;\n        // this increment is not exactly correct, but ok for illustration\n\
    \        final int increment = totalIterations/nThreads;\n        forkJoinPool.invoke(new\
    \ RecursiveAction() {\n            int baseIndex = 0;\n            @Override\n\
    \            protected void compute() {\n                forks.clear();\n    \
    \            for (int j = 0; j < nThreads; j++) {\n                    final int\
    \ startIndex = baseIndex;\n                    RecursiveAction subComputation\
    \ = new RecursiveAction(){\n                        @Override\n              \
    \          protected void compute() {\n                            doWorkFragment(startIndex,\
    \ increment);\n                        }\n                    };\n           \
    \         forks.add(subComputation);\n                    baseIndex += increment;\n\
    \                }\n                invokeAll(forks);\n            }\n       \
    \ });\n    }\n\n    void doWorkFragment(int startIndex, int numberOfIterations)\
    \ {\n        // work done here\n    }\n}\n```"
