- pgno: 8
  md: 'iterators are used because they can inadvertently result in much dynamic memory
    allocation if used carelessly.


    +   * If running long, parallel, compute tasks in Java, beware if fully loading
    all cores on the CPU for sustained periods. Performance can degrade unless real-time
    scheduling is used.

    * Allow for Java warm-up time. Design the code to allow key code paths to be exercised
    as part of start-up.


    Java, and the JVM, can be part of the high performance tool chest for applications
    that run long enough to allow Java 7 Hotspot warm-up optimizations to “kick in.”
    A hybrid Java/C development can exploit the productivity and code safety of Java
    and the speed of C to build solutions that perform well, make good use of scarce
    development dollars, and leverage extensive Java resources.'
