    investigation. Factors for future investigation include:


    +   - network load – how much overhead a grid framework requires to support features
    such as auto-discovery of peer node participants and to communicate node status

    - memory load – how much processor memory is required when a framework runs

    - scalability with increased number of nodes – how effectively additional nodes
    can be used to distribute the load and how busy nodes can be maintained for busy
    applications

