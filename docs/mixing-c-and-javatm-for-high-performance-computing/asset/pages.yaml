- pgno: 90
  md: '# 6 Java Frameworks for Multi-Node Work


    Code that handles inter-node communication can be tedious and error-prone to write.
    There are various Java frameworks that can be used in an compute cluster to simplify
    this. This section investigates various of these and presents performance results.
    Results are compared with the Message Passing Interface (MPI) which is the “workhorse”
    of high computing.


    # 6.1 Comparing Grid Computing Frameworks Capabilities in the Abstract


    For the purpose of this report the term “grid computing” is used to describe the
    use of tightly coupled nodes working over a problem. Both large-scale compute
    problems such as weather prediction and smaller HPEC-scale problems have the need
    to serialize, buffer, transmit, verify delivery, and re-buffer, and de-serialize
    data. When comparing different compute grid frameworks there will be differences
    in how physical assets are identified, how messages are managed, and how communication
    links are utilized. Figure 6-1 depicts these areas for comparison.


    ![](img/81c9dc4f446215f3827ad5c523130d89_90_0.png)


    Figure 6-1. Considerations When Comparing Compute Grid Frameworks


    Physical assets refer to how a framework provides information about the processors
    and other hardware characteristics of a node. It is often necessary to know the
    capabilities of the physical assets to make best use of the cluster. For example,
    a particular node may not contain a GPU. Such a node might not be used for high
    performance calculations in favor of the faster node with a GPU. The implementer
    can always build custom structures that decorate the operating system, CPU, and
    GPU environments, and use the communication facilities to convey that to other
    nodes. However, the greatest developer productivity is achieved if the framework
    already collects and propagates that information and allows the developer to add
    meta-data as needed.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'Communications refers to the mechanisms and models provided by the framework
    to exchange information between the nodes. At the lowest level this includes the
    ability to send and receive a sequence of bytes. Other considerations include:


    +   - Whether synchronous send/receive is supported. Synchronous communications
    allow data to be "copied" directly to/from application but requires the sender
    and receiver block until communication is complete.


    +   - Whether asynchronous send/receive is supported. Here sender and receive
    do not wait but must make additional framework calls to test communication. The
    greatest flexibility is often achieved if a separate communication thread is used,
    but then additional queues and buffers will be used. A framework that provides
    asynchronous communication as well as the needed queuing and buffering will serve
    the user much development time.


    Job/work control refers to facilities the framework may provide for concurrent
    execution of code in a distributed fashion. This includes:


    +   - How jobs are specified and invoked. Each job, in general, have some metadata
    that identifies a name or id, what the inputs are, and may also include what the
    outputs. One of them is simply remote method invocation that allows code on a
    remote node to be invoked. The methods arguments are serialized, sent to the remote
    node, the method is activated, and method results are serialized and returned
    to the caller.

    - Coordination/synchronization. A more sophisticated form of job control will
    provide a local queue onto which job descriptors (or job objects) are placed.
    Jobs on the local queue are distributed to other nodes and executed. Framework
    facilities may allow conditions to be set up that one job start might require
    other job completions as a precondition.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '+   - Job status monitoring. The ability to inspect job queues to determine
    what work is pending may allow data throttling and adaptive job distribution.
    This is not as important for applications that have a fixed input and output rate,
    but is very useful for applications whose processing load may depend on the data
    content.


    +   - Job failure detection. Similar to communication failure detection, this
    may simply mean tracking job completion with indicator of whether the job completed
    normally or abnormally. A more sophisticated framework might automatically retry
    the job on a different node.


    +   - Logical topology. Since the framework works with some sort of abstraction
    of work, the logical topology provides an easy way to specify that the output
    of one job becomes the input to one or more jobs. The timesaving however is that
    the framework that supports this will automatically configure the communication
    paths that are required between work units freeing the developer from this tedious
    coding.


    The previous paragraphs have outlined attributes for analyzing frameworks. One
    additional consideration is to what degree advanced framework features are manual
    or automated to what degree, are they statically or dynamically configured. For
    example, topology may be described statically, by configuration files that are
    read by a framework at runtime, or it may be programmatically specified by the
    application as part of application initialization, or it may be heuristically
    determined by the framework in response to network load.


    # 6.2 Five Java Compute Grid Frameworks


    Five frameworks were chosen. The frameworks have different models of work, data,
    the compute grid, and the communications. They also represent open-source and
    commercial offerings. The frameworks are:


    +   - PJ^53


    +   - Java Parallel Processing Framework^54 (JPPF)


    +   - GridGain^55


    +   - Storm^56


    +   - Akka^57


    Additionally, MPI^58 was chosen as a performance baseline. MPI has been developed
    over many years and is the facto workhorse for high performance computing. It
    has optimized support for basic cluster communication over Ethernet and low latency
    communications as Infiniband^59.


    > 54 Java Parallel Processing Framework, < http://www.jppf.org >n55 GridGain,
    < http://www.gridgain.com >n56 Storm, < http://storm-project.net >n57 Akka, <
    http://akka.io >n58 MPI, < http://www.mcs.anl.gov/research/projects/mpi/index.html
    >n59 Infiniband Trade Association - < http://www.infiniband.org >'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# 6.2.1 Message Passing Interface


    MPI focuses on reliable message transmission among a number of nodes. MPI 2.2
    was used in these studies. MPI programs are launched from the command-line in
    which the user specifies how many copies of the process should be launched. The
    copies are launched using a grid topology specification file identifies candidate
    nodes as well as how many processes may be launched at each node. From the point
    of view of MPI all nodes can connect to all other nodes.


    The same application is launched at all nodes. An MPI execute communicates with
    a daemon or job controller running on each node to instantiate the application
    copies at that node. Each instance is identified by a unique integer. It leaves
    it to the developer to write code to edit the id and decide which ids should handle
    and how they should communicate using each other ids. Synchronous and asynchronous
    communications are supported. The developer must write any necessary queuing and
    buffering. The developer must specify what then uses programmatic specification
    to do the serialization and deserialization as needed. There is no notion of a
    job. There are attributes that can be associated with different contexts. Facilities
    exist for synchronization process flow across multiple nodes. There is no automated
    behavior to handle communication failures. There are commercial and open-source
    implementations of MPI that are available. OpenMPI 1.6.4 was used here.


    # 6.2.2 Parallel Java


    PJ is an all-Java framework for cluster computing. Parts of PJ have many similarities
    to MPI. PJ is distributed under a General Public License (GPL). The distribution
    includes a cluster communication API that is very similar to MPI. It also includes
    functionality for in-process multi-threading that is similar to Concept MPI and
    was partially discussed in Section 3.2.4. Finally, PJ includes a variety of other
    support functions and utilities that are used at RIT.


    PJ applications are also usually launched from the command-line. There is a scheduler
    running on a node that communicates with Secure Shell (SSH) daemons running on
    other nodes to start the required number of instances of the application on the
    other nodes. The startup interactions are a little different than those of MPI
    though often the instances of the application are running the developer must handle
    many of the same software design issues related to buffers and queues that face
    the MPI developer. Serialization is a bit more capable than MPI because Java objects
    can be serialized with much less work due to general support in Java for object
    serialization.


    PJ is fairly easy to use and also the framework has problems maintaining connections
    between nodes when large data sizes were being exchanged. Version 20120620 was
    used here.


    # 6.2.3 Java Parallel Processing Framework


    While MPI and PJ have basic facilities for cluster communication based on message
    exchange, JPPF has different model. In JPPF, work is distributed as jobs and tasks.
    A job is a list of tasks that may be executed in parallel. A task is a Java object
    that is either Runnable, Callable, or a subclass of JPPFTask. A task may also
    be designated as the JPPF annotation JPPFRunnable. A task has inputs and a result
    that is serialized and available upon task completion.'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'Unlike MPI and PJ the entire application is not run at each node. Instead only
    the tasks are run when needed on selected nodes. The JPPF model of the grid is
    as one big queue that accepts tasks. The topology of the grid is less important.
    The applications classes can be installed on all nodes, JPPF dynamically serialize
    and deploy the classes when running. This simplifies development and makes it
    easier to configure clusters that can join or leave the cluster dynamically.


    Jobs are submitted synchronously or asynchronously. JPPF has some tolerance to
    failures because a node becomes unavailable it will not be used for subsequent
    task execution. Furthermore, each job has an expiration time that could be used
    to detect work that has already been dispatched but failed to complete. JPPF uses
    heartbeats to detect when node fails and can automatically re-queue a task to
    a different node than the one that failed.


    The JPPF deployment architecture has at least one JPPF server and one JPPF compute
    node. Nodes get their work from a server and there may be multiple nodes connected
    to the same server. There may be multiple servers that are connected to each other
    which will distribute work between them. The topology is configured by a configuration
    file and can be a mix of predefined connections and automatically discovered.
    Predefined connections use Transmission Control Protocol/Internet Protocol (TCP/IP).
    Discovered connections use Datagram Protocol [UDP] multicast.


    When the main application runs, it makes a connection to a server and is able
    to submit work to the grid. Regardless of the connection relationships between
    servers and compute nodes, a client enters the grid as a single queue. Jobs are
    distributed from the queue using one of several available load-balancing algorithms.
    It is also possible to write a custom load-balancing algorithm.


    JPPF is available as open-source under an Apache 2 license. Version 3.3.4 was
    tested in this investigation.


    # 6.2.4 GridGain


    GridGain is a commercial product that evolved from an earlier open-source development
    by the same principal developers. It is available for three different types of
    grids—compute grids, data grids, and map-reduce grids. The compute grid was used
    for this study.


    GridGain is a very flexible framework that allows work to be distributed to an
    abstract grid. The grid is attracted to a greater degree than JPPF does. Grid
    nodes are not logical peers to each other and have attributes that can be used
    when work is dispatched. Use code can attach attributes to nodes some grid attributes
    are automatically added by the system including environment variables, JVM Runtime
    properties, and operating system name/machine architecture/version.


    Node attributes are also dynamically updated with 50 metrics including:


    +   - average CPU load

    - average number of waiting jobs

    - garbage collection CPU load

    - amount of file free space

    - memory usage metrics'
  merge: -1
  img_proc: true
- pgno: 95
  md: '+   * communication message counts

    * available number of CPUs.


    GridGain joins jobs. This is opposite to JPPF in jobs which contain tasks. A task
    is an object that can be created as a subclass of one of several predefined base
    classes. GridGain tasks are submitted to the entire grid or a subset of the grid.
    A grid subset can be created by the client application by using node attributes
    to select candidate nodes.


    Work can also be submitted as a proxy of calling methods that have been compiled
    with the Gridify annotation. This is very attractive for development and maintenance
    of more intricate applications because method calls are easy to write and understand.
    The framework covers the complexities of argument and return value serialization
    as well as dispatch to the grid.


    The previous frameworks utilized daemons to initiate the instantiation or its
    workers processes at various nodes. With GridGain an instance of GridGain is run
    at each network node. Each instance participates in the grid and can run tasks
    directly—additional operating system (OS) processes are not required. Client code
    can be run as part of one node''s GridGain instance, or the GridGain instance
    can access via its local grid. Furthermore, it is possible to have client at any
    node—each client can invoke distributed services executed among all other nodes.
    This is very attractive for fault tolerant computing because there does not need
    to be an explicit master node. The user could detect when the current active master
    node fails and then assume those responsibilities at another already active node.
    The algorithm for this is, of course, up to the user.


    GridGain can autopdeploy to any node that needs it. Job arguments and return results
    are auto-serialized. The user can create custom serializers if desired. There
    are various types of loadbalancing available including factors that a node''s
    CPU load into the distribution algorithm. The work distribution algorithm can
    also be customized. Custom the handler for failures are already provided that
    will resubmit work to a different node if needed.


    GridGain was the easiest to install and use of all the frameworks tested. As a
    commercial product it also has the most extensive documentation. Version 4.3.1e
    used for testing.


    # 6.2.5 Storm


    Storm is focused on distributed streaming computation. In this model, client work
    is decomposed into several small computation tasks that are interconnected. The
    input stages are called “spouts” and the others are called “bolts.”. The client
    application is implemented as a dataflow network with sprouts and bolts interconnected
    in a topology that is submitted as part of a small application. Data are represented
    as n-tuples. The n-tuple components are composed of serializable Java objects
    and can be simple or complex as needed.


    The I/O relationships between the spouts and bolts define a topology that is specified
    by a “starting” application that submits the topology to special framework daemon
    named “Nimbus.” Nimbus then communicates with the Storm compute node daemons (supervisors)
    that will instantiate sprouts and bolts as needed. The sprouts and bolts are instantiated
    as OS processes with socket connection to each other.'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'One unique aspect of Storm relative to the other frameworks investigated is
    that the framework can easily create multiple instances of the same spouts and
    bolts to implement parallel processing. Stream tuples that are directed to a parallelized
    bolt will be automatically “stripped” across the bolts to distribute the load.


    Storm spouts and bolts can be directed with or without tuple delivery acknowledgment.
    Failures can cause tuples to be resent although this is by user code upon detection
    of missing acknowledgments. Spouts and bolts should maintain a state and are capable
    of being quickly restarted.


    Storm is early in its development life. There is an assumption that all the processing
    nodes are equally capable when parallelized bolts are instantiated. This leaves
    it to the developer to write specialized shaders to handle more processor-aware
    assignment of bolt instances. There is no single queue onto which can be queued.
    One-of-a-kind processing has to be done in response to a “trigger” tuple to a
    node.


    Storm is open-source and is available under an Eclipse Public License. Storm is
    relatively new and lacks some of the “polish” of the older frameworks. Storm runs
    on the JVM but is written in Java and Closure. It requires the use of Apache Zookeeper⁶,
    ZeroMQ⁷ and the Java bindings for ZeroMQ all be installed and configured separately.
    Storm version 0.8.2 was used for testing.


    # 6.2.6 Akka


    Akka presents a more evolved message distribution model known as an actor model.
    With MPI and Pj, messages are sent to compute elements based on an integer id.
    With actors, a reference to an actor is looked up by unique identifier assigned
    by the developer. The reference is used for subsequent delivery. Unlike MPI and
    Pj’s integer id, the actor’s symmetric identifier does not depend on the grid
    size. The referencing mechanism is used whether the actor is local to the sending
    process or remote. This allows an application to be written initially as a number
    of inter-communicating actors that can later be easily instantiated at different
    nodes.


    Message sending is asynchronous. Any serializable Java object (including tuples
    of Java objects) can be sent as a message. Actors may maintain state and change
    their behavior as needed. Unlike Storm, the I/O relationships between the actors
    are not captured in a static topology—each sender demands the receiver for every
    message when it is sent.


    Akka supports cluster operation that the user can write some code to recognize
    cluster events such as nodes joining or leaving the cluster. Akka supports message
    distribution to parallel instances of actors on different nodes. The framework
    provides defined actors as routers that are very useful for distributing messages
    to parallel instances of actors. However, using these takes a little more developer
    work and understanding than non-router distribution.


    > ⁶⁰ Apache Zookeeper, < http://zookeeper.apache.org >


    > ⁶¹ Carl Hewitt, Peter Bishop, and Richard Steiger. 1973. A universal modular
    ACTOR formalism for artificial intelligence. In Proceedings of the 3rd international
    conference on Artificial Intelligence (IJCAI73). Morgan Kaufmann Publishers Inc.,
    San Francisco, CA, USA, 235-245'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'Akka has various types of routers including an adaptive load balancing router
    that uses runtime CPU metrics to determine which workers to route messages to.
    The metrics include memory utilization, load average, CPU utilization, or mixes
    of these. Version 2.1.2 was used for testing.


    # # 6.3 Feature Comparisons


    The previous section provided an introductory description for each framework.
    Table 6-1 and Table 6-2 compare aspects of these frameworks that are of interest
    to those designing multi-node compute applications.


    Architecture refers to the relationships between nodes. In some of the frameworks
    there is a master node, for example, may launch other nodes or take a special
    role in I/O. Node and worker topologies may be fixed for the duration of the framework
    or they may support ad hoc entry/exit of compute nodes. In the latter case, the
    worker code is typically distributed dynamically whatever prevails nodes are available.


    Distribution model refers to whether messages or work is distributed. To distribute
    work the framework has move data but the details of the messaging are handled
    by the framework. In the case of Storm, data tuples are explicitly emitted from
    sprouts and bolts the target of tuples is not known by the sprout or the bolt.
    The target has been identified by the topology that was submitted to the framework
    for execution. In contrast, Akka, the sending actor explicitly identifies the
    actor that will receive the message.


    Frameworks may or not separate OS processes to perform work. GridGain and Akka
    are the only ones that do not this.


    Load balancing refers to a framework''s ability to distribute work across available
    nodes. Simple algorithms will just distribute the load in round-robin fashion
    to available resources. More sophisticated algorithms will factor in execution
    time to predict the loading impact of current distribution decisions. Other algorithms
    will also factor in the node''s current CPU and memory loading. JPPF, GridGain,
    and Akka all provide various forms of load balancing as well as provisions for
    user provided load balancing algorithms.


    Recovery from node failure describes whether the framework facilitates recovery
    from node failure without imposing much work on the developer to detect and take
    corrective action. MPI and PJ are at a disadvantage because their integer id-based
    process identification makes it hard to easily recover when a specific id is down,
    requiring the user to do some intricate reassignment of the work to other nodes.'
  merge: -1
  img_proc: true
