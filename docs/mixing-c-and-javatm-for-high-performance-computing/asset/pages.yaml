  md: '# 3.2 Parallelism at “Half” Load With Linux Real-Time Scheduling


    # 3.2.1 Parallelism with Timers


    The java.util.Timer and the java.util.TimerTask can be used for concurrency. These
    have been available since Java 1. The example in Listing 3-2 shows one way to
    break up a “for-loop” onto multiple timer threads using a CountDownLatch to coordinate
    work completion. The example:


    +   * uses as many Timers as there are available processors


    +   * creates a CountDownLatch used to wait for all threads to complete


    +   * declares final outer loop variables that are referenced within the inner
    Runnable so the value can be accessed from a different thread


    +   * signals when each inner thread is complete


    +   * has the outer wait for the inner thread completion.'
