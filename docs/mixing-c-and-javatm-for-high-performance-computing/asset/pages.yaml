- pgno: 113
  md: '# 7.12 “Warm” Key Code Paths


    Applications running on JVMs that use JIT compiler optimizations will typically
    get faster after a while. A satisfactory number of iterations depends on the code
    details especially when nested loops and multiple levels of method calls are involved.
    The best thing is to structure the application to allow separate warming of key
    code paths, then the warming after a certain number of iterations.


    This works well for “server” style applications that start and wait for an external
    event to trigger processing or a response. This is also appropriate for applications
    that need to achieve a certain throughput before the application is fully “up.”


    # 7.13 Share the Central Processing Cores


    One learned the hard way by this investigator the unpredictability of a fully
    loaded processor. If an application is running multiple compute-bound threads,
    it is easy to demand too much of the available cores. In some of the initial tests
    on parallelism, a four-way load split performed more poorly than a three-way load
    split even when not running at real-time priority. Most likely was not only the
    operating system starved, but also the garbage collector was starved.


    There are two approaches that can be taken. One is to intentionally add monitoring
    code to compute heavy tasks such that if computations have been going for too
    long the code will intentionally yield time to other threads. Commanding an entire
    core for the operating system does not completely solve the problem because it
    leaves the garbage collector competing with compute threads on the remaining cores.
    Furthermore, the operating system most likely will need all the horsepower of
    an entire core. This means that compute bound threads may have no choice but to
    implement the second option.


    Of course, usually there is some form of I/O involved, and compute-bound tasks
    are usually broken up by I/O. But it is worth keeping this issue in mind because
    the application is instrumented to measure execution times and unless comparisons
    are performed under different load-splitting alternatives, the developer may not
    realize that performance is worse than it should be.'
