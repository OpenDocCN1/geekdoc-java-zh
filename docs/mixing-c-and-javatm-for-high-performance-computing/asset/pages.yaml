  md: '# 7.8 Avoid Allocating Java-Data If It Is Repeatedly Passed to Native Libraries


    Converting data so it is natively accessible by C libraries takes time. If there
    is a sequence of native processing operations it is better to use BridJ or SWIG
    to allocate buffer space natively to avoid this conversion. Of course, there are
    many considerations here such as data should be allocated natively, which should
    be allocated in Java, which should be duplicate, to copy it back and forth. But
    these are application-specific considerations that have to be addressed specifically.


    # 7.9 Use Lazy Instantiation and Deferred Initialization If Application Needs
    Expediting


    Application initialization will generally be longer for Java than for C as discussed
    in a previous section. Different vendors have different ways to expedite loading
    including class head-of-time (AOT) compilation and caching. The developer can
    code classes to do minimal initialization at class loading and instantiation.
    These can be deferred until the first time a class is used, though then adds to
    the time for the first execution. When the instantiation of singleton classes
    might be deferred until first needed.


    # 7.10 Cache Read-Only References to Instance and Class Fields


    When accessing read-only class and instance fields from a method, it is generally
    faster to retrieve once within the method then use the local variable throughout
    the rest of the method. This also applies within inner classes where access to
    a final variable is really access to an anonymous instance variable.


    # 7.11 Alternatives to Conditional Compilation


    A standard though underutilized Java feature is the use of assertions. In Java,
    an assertion is a Boolean expression expected to return true. The expression can
    be a function invocation that returns a Boolean result. Java assertions are disabled
    by default. If they are disabled, the condition of the assertion is never actually
    evaluated. When disabled, assertions have a very small run time impact.


    In C, one might accomplish selective use of development-time assertions using
    C macros. But that requires recompilation for deployment to remove them from the
    executable code. Using Java assertions for development can help detect problems
    sooner and contribute to development productivity.


    > Java assertions for development with little performance impact in deployment.


    Another helpful mechanism is the use of static final variables (set to false)
    to bracket out code that might be used as the condition in an if-statement. This
    will not generate code if the variable is used


    > Use "static final boolean" variables to conditionally compile/elide development-only
    code.'
