    The great improvement of the LFSR kernel suggests that the gain measured for the
    Java implementation is actually due to improved execution of the bit-tiddling
    parts of the code, not just the test-jig’s looping code. Of course, it should
    be possible to match and exceed Java’s performance in test with tuned C code.
    But the fact that “generic” Java code can match the key C’s performance is significant.
    One should not conclude that Java is always faster in this kind of code. On different
    hardware, the actual relative performance will depend on the detailed interaction
    of the CPU’s integer logic units, address pre-fetch logic, and memory speeds.
    This investigator’s conclusion is that only the Java performance is comparable.


    # 2.8 In-Memory Data Structure Creation


    A benchmark was designed to compare C and Java on an algorithm that involved creating
    memory structures and “walking” through the structures repeatedly. The algorithm
    chosen was a red-black tree structure. The red-black tree is a binary search tree
    that maintains a mapping of keys to values that are sorted by key. As keys are
    added the old structure must be traversed to find the right place to insert key-value
    pairs. Occasionally portions of the structure must be rebalanced.


    An existing implementation of a red-black tree by Emin Martian¹¹. The C code was
    written to handle keys and values of any type and length. To accommodate keys
    of any type and length, the algorithm allows the user to provide a comparator
    function that matches the key type. For this test 4-byte integer keys were used.
    The algorithm was translated as directly as possible to Java. A test driver was
    written to pseudo-random generate keys and use them for


    > ¹¹ Martian, Emin, “Red-Black Tree C Code.” <http://web.mit.edu/~emin/www/source_code/red_black_tree/index.html>'
