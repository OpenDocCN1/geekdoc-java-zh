    \ 机制创建了运行在 `ForkJoinPool` 上的轻级任务。列表 3-4 是其工作原理的示例。\n\nForkJoinPool 并行化图如图 3-10\
    \ 和图 3-11 所示。表 3-1 列出了归一化的执行时间。总体而言，其性能与 `ExecutorService` 大相当，尽管存在略微开销，导致四线程线的执行时间更长。fork/join\
    \ 机制在并行化循环时提供了极大的灵活性，但更适用于更复杂的“分治法”算法。\n\n关于 `ForkJoinPool` 的一点是，一些人发现它在多核心机器上的扩展性并不良好。Doug\
    \ Lea 注意到了这个问题，并发布了超越于 Java 7 实现的池化扩展性更新。该版本的 `ForkJoinPool` 已在 JSR-166 中通过了测试，被发现在几个核心上提供了显著的性能提升。出于这个原因，这里展示了标准的\
    \ Java 7 ForkJoinPool 数据。\n\n¹ Scalability of Fork Join Pool, http://letitcrash.com/post/1760272326/scalability-of-fork-pool\n\
    \n² Doug Lea, Fork updates, http://cs.oswego.edu/pipermail/concurrency-interest/2012-January/00897.html\n\
    \n## 列表 3-4. 使用 Fork/Join 进行并行执行的示例\n\n```java\nimport java.util.ArrayList;\n\
    import java.util.List;\nimport java.util.concurrent.ForkJoinPool;\nimport java.util.concurrent.RecursiveAction;\n\
    \nclass ForkJoinExample {\n    int nThreads = Runtime.getRuntime().availableProcessors();\n\
