    Apple, Inc.⁵³ were used as the basis of the C test. The test code was translated
    as directly as possible in Java for the Java test. (The Converted code is available
    as part of the benchmark code released to the public domain⁴).


    FFT processing can be decomposed as a chain of processing stages. Each stage is
    further decomposed as a set of transformations that can be performed in parallel
    on subsets of data. The number of steps in the chain and the architecture of each
    subset of the processing is optimized by the data size, whether the data is in-place
    or out-of-place, whether the real and imaginary parts are in separate arrays or
    interleaved, Apple''s C generates and sequences the OpenCL kernel. The C-based
    and Java-based tests generate the same OpenCL kernels and sequence them in the
    same way. There be no difference in the execution time of the FFT kernel but the
    rate at which the Java code can set up kernel arguments, compute kernel group
    sizes, and queue kernel executions needed testing.


    The key performance metrics in the test are the per-FFT setup time and the net
    FFT throughput. These were measured for data sizes ranging from 64 to 52,288 complex
    points. For each data size throughput was measured for two cases. In the synchronous
    case, the code waits at the end of each FFT chain (by invoking clFinish()). In
    the asynchronous case, there is no wait and all the thousands of FFT iterations
    are queued as quickly as possible.


    Figure 5-1 shows the effective FFT throughput in giga-flops. JavaCL is used for
    the Java test. The C version is only a little faster than the Java version in
    a few cases. At N=11 the C sync case is 2 percent faster. This plot shows the
    combined effect of the CPU code, the GPU throughput, and the FFT optimization
    strategy used for the different lengths. It does not provide insight on what the
    differences are due to.


    At the larger data sizes, the total processing time is limited by the time that
    the GPU computes. At smaller data sizes the total processing time is throttled
    by the time to queue many OpenCL operations for small data lengths. This is shown
    in Figure 5-2 for the synchronous case. For the small data sizes, Java using JavaCL,
    spends about 5 percent more on setup relative to the total processing time.


