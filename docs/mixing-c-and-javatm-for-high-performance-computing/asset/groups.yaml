  mdcn: "\n\n## 7.3 使用 StringBuilder 进行重复拼接\n\n某些 Java 应用因为过度使用 `String` 类进行解析和拼接而导致速度变慢。Java\
    \ 字符串是不可变的。拼接两个字符串意味着必须创建第三个字符串，并从两个组成字符串中复制内容到其中。\n\n`StringBuilder` 类起初会分配字符数组，并在需要时重新分配更大的数组。在现有实例上进行追加（Appending）只是在对象的内部数组中分配空间。`StringBuilder`\
    \ 实例还可以被重置为长度为零并重用，从而避免内存分配的开销并可能减轻垃圾回收器的负担。\n\n最好的做法是在实例化 `StringBuilder` 时估算其长度，以减少内部数组的中间重新分配。请注意，`StringBuffer`\
    \ 与其类似，但它提供了线程同步的方法，这可能会增加开销。\n\n## 7.4 使用 SLF4J 获得良好的日志性能和简洁语法\n\n无意中分配对象的一个常见来源是调试（debug）语句。考虑以下使用\
    \ Log4j 库的代码片段：\n\n```java\nfor (i = 0; i<10000; i++) {\n  cum += i;\n  log.debug(\"\
    Iteration \"+i+\" cumulative == \"+cum);\n}\n```\n\n这种形式的调试方法接受一个参数，迫使开发者通过拼接来构建调试所需的正确信息。如果调试语句没有被记录，那么拼接就是浪费。另一方面，使用\
    \ Log4j 避免了这种拼接。使用 SLF4J，这可以写为：\n\n```java\nfor (i = 0; i<10000; i++) {\n  cum\
    \ += i;\n  log.debug(\"Iteration {} == {}\",i, cum);\n}\n```\n\n如果有很多针对未使用信息的调试语句，那么在部署代码时可以节约的时间将是显著的。我们设计了一个简单的实验来衡量这一点。禁用日志记录，并按照上段代码片段记录了\
    \ 10,000 条语句。Log4j（带拼接）需要 3.5 ms，而 SLF4J 仅需要 1.3 ms。当然，如果启用了控制台日志，记录字符串开销会大幅反转这些数字。\n\
    \n为了完整起见，应该提到另外两种日志选项：Apache commons logging⁶⁸ 和标准日志⁷¹。日志包的详细比较超出了本研究的范围。注意，Apache\
    \ Commons logging 也“深受”其调试方法中只有一个参数的影响，迫使开发者进行\n\n> ⁶⁸ <http://logging.apache.org/log4j/\n\
    > ⁶⁹ <http://www.slf4j.org/>\n> ⁷⁰ <http://commons.apache.org/logging/>\n> ⁷¹\
    \ 标准日志是 J2SE 分发版的一部分，可以在 java.util.logging 包中找到。\n\n不必要的字符串拼接。Java 标准日志没有这个问题，但其方法参数的用法用起来更加别扭（在作者看来）。这导致开发者不愿使用它。如果使用内置日志，等效代码将如下所示：\n\
    \n```java\nfor (int i = 0; i<10000; i++) {\n    cum += i;\n    log.log(Level.FINE,\
    \ \"Iteration cumulative == {}\", new Object[]{i,cum});\n}\n```\n\n这避免了字符串拼接，但需要创建一个对象数组，这仍然会导致效率低下。在禁用日志的情况下，执行上述循环的耗时为\
    \ 2.5 ms。\n\nSLF4J 的优势在于它是 Log4j、Java 日志或 Commons logging 之上的细粒度封装。开发者的优势在于可以使用方便的\
    \ API 进行编码并获得良好的性能，同时在底层日志基础设施上为其“对冲了风险”。\n\n## 7.5 最小化迭代器创建以减少抖动和垃圾回收器活动\n\n\
    `java.util.Iterator` 接口在 Java 集合类中广泛使用。创建迭代器需要对象实例化和未来的垃圾回收。虽然开发者无法更改标准库的设计，但如果满足以下条件，开发者可能可以为自己的类减少迭代器的创建：\n\
