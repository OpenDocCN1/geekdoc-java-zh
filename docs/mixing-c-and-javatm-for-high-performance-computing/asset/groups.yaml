    # Executive Summary


    Developers of performance computing software, especially high performance embedded
    computing (HPEC) software, develop code not just for computational processing
    but also for management and infrastructure tasks such as communication, processor/core
    allocation, task management, job scheduling, fault detection, fault handling,
    and logging. HPEC software development has required extensive software development
    to get the highest performance relative to limitations on size, weight, and power
    dissipation. In the past, these limitations drove the choice between dedicated
    logic and programmable processors.


    There have been significant improvements in processing capabilities relative to
    these limitations as processor features have shrunk over time and additional processor
    cores have become available in commodity HPEC processors—resulting in the trend
    to move away from dedicated logic and specialty programmable processors to commodity-based
    processors. As the hardware and runtime executives of the sensor platform are
    updated, such software is often discarded and redesigned and re-implemented. As
    a result of this additional capability, it is now possible to enable more robust
    software options for HPEC—ranging from fuller-featured operating systems to Java™
    frameworks support portability between multiple hardware and operating system
    platforms. Utilizing Java frameworks would reduce redundancy and re-implementation.
    There exist numerous commercial and open source Java frameworks that provide hardware-independent
    solutions to multi-processor infrastructure needs.


    There are those who question whether a Java application can provide the requisite
    performance. The goal is not to replace C and optimized assembly libraries but
    to mix Java, C, and the libraries. A hybrid approach allows the design engineer
    to explore each component''s strengths with the expected overall benefit of Java''s
    enhanced code safety, maintainability, and expedited development. Investigations
    were performed to characterize what performance one might obtain from Java. The
    goal was to be able to design a hybrid application backed by engineering tradeoffs
    based on quantitative data. This study has collected data on an initial set of
    characteristics.


    The following aspects were investigated:


    +   - How does Java perform on various computation algorithms?

    - What is the overhead of the Java Runtime?

    - How do the various technologies by Java can invoke native C compare in performance
    and ease of use? What is the performance impact of data in Java memory versus
    data in C memory?

    - How would one implement concurrent multi-core computation in Java and how effective
    is

    - How would one employ the processing power of graphical processing units (GPUs)
    from Java? How does the performance compare to doing that from C?

    - Given that Java performance is dependent on the Java Virtual Machine (JVM),
    is the performance of other JVM languages similar to Java''s?


    Four types of algorithms that were initially implemented in C were converted to
    Java—matrixmultiply, Fast Fourier Transforms (FFTs), linear feedback shift register
    (LFSR) sequence'
