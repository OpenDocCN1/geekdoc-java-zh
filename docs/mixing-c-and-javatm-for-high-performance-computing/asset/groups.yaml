    In a hybrid application, Java could be used for communication, processor/core
    allocation, task management, work sequencing, fault detection, fault handling,
    and logging. Calling from Java into native computation is key. Using the low-level
    Java Native Interface (JNI) is the fastest, but also the most tedious and error-prone,
    way to do this. Java Native Access (JNA) is easy to use and platform independent.
    If call is required, overhead splits a few hundred microseconds per second. Tens
    or thousands of times per second, Brid and the Simplified Wrapper and Interface
    Generator (SWIG) are the likely choices. Swid is easier to use (the investigators
    opinion) and can be used without external native libraries on hardware and operating
    system platforms. SWIG is more work to do, that it generates C code that a SWIG-based
    native library to be compiled for any target.


    Regarding computational concurrency, Java does not have a simple syntax for concurrent
    looping. Testing on a four-core machine with various workloads and showing that
    the best parallel concurrency techniques fell shy of C''s performance by 4 to
    5 percent. The fastest Java concurrency mechanisms were not the ones built into
    the Java 7 standard. The third-party libraries, Juvenile and Parallel Java, had
    the best concurrency for the pure-compute test used. This does not diminish the
    value of the built-in concurrency mechanisms. They have features for scheduled,
    periodic, delayed, and recursive task which are necessary for many types of tasks.
    Testing also showed that there was erratic performance on Linux when adding more
    processor cores did not reduce the overall time. However, this was mitigated by
    using Linux round-robin scheduling.


    GPUs can be effectively injected from Java. The approach investigated utilized
    a Java library that invokes an underlying OpenCL interface to the GPU. Thus a
    Java application can never be faster than a C application that utilize the OpenCL
    interface directly. However, the goal was to get performance given this constraint.


    There are only a few Java libraries for OpenCL. JavaCL was used here. It was developed
    by the same open-source developer that developed the BridJ call mentioned above.
    Using GPU-optimized kernels originally developed by Apple, showed that Java took
    about 2 microseconds longer to set up and invoke a kernel than C. The C code required
    about 9 milliseconds. However, since GPU computation proceeds in parallel with
    kernel, the net impact on GPU throughput was typically less than 2 percent. But
    with these kinds of setup times GPU interactions exceeding thousands per second
    are reasonable answer.


    Five compute-grid frameworks, Parallel Java, Java Parallel Processing Framework,
    GridGain, Storm, and Akka were tested on a 10-gigabit Ethernet cluster. Collectively
    the frameworks offer features such as auto-discovery, auto-failover, inter-node
    data synchronization, automatic data serialization, multi-node work queuing, active
    load monitoring and adaptive load balancing that can save significant developer
    time. They were compared with each other and to the high performance community''s
    Message Passing Interface (MPI), which is the workhorse for performance computing.


    With greater flexibility and features, the more sophisticated frameworks were
    not expected to perform as well as MPI. Indeed only MPI and low-level Java socket
    input/output(I/O) could'
  - '[PAGE 7]


    handle small data sizes at rates of 10,000 synchronous round-trip exchanges per
    second. On the other hand Akka and Storm achieved 10,000 asynchronous round-trip
    exchanges per second and outperformed MPI in some cases. GridGain was the easiest
    to set up, and in the investigators opinion. The tradeoff''s between throughput,
    productivity, and life-cycle costs are complex and must be addressed for each
    application.


    Other JVM languages were tested to understand how their performance compares to
    Java and C. Python is used in the performance-computing world for scalability,
    conciseness, and ease of use in part due to untyped variables. Python has various
    implementations such as CPython which is interpreted, PyPy which is compiled,
    and Jython which runs on the JVM. Jython 2.7.0 was a little faster than CPython
    2.6 for the memory structures (red-black tree), though showed about 30 percent
    slower on pure computation (multiply). Python was a bit faster than CPython at
    calling out to native code. CPython would not typically be used for computation
    but neither would Python. PyPy 1.9 was 120 times faster than Jython over


    Scala is a new language that runs on the JVM. It is scalable and concise. It has
    strong type variable are easier to write than Java. It also has features for functional
    coding including the ability to declare operators (such as add, multiply) for
    user data types (such as vectors and matrices). This is potentially of interest
    to the performance developer. Testing showed that Scala had the performance of
    Java. However, integer for loops need to be replaced with while-loops Scala’s
    “for-based” looping mechanism does not currently optimize as well as it could
    for simple integer loops. The problem is expected to be fixed in the forthcoming
    Scala 2.11. On the 4-byte red-black tree insertion and retrieval trials, Scala
    performed better than Java due to a unique language feature that allows generalized
    algorithms to be optimized for primitive data types.


    Performance always needs to be tested and statistics need to be gathered to compare
    and evaluate operating systems other than the Oracle Java 7 standard edition and
    Linux combination used here. The benchmarks have been released as open source
    at http://jbench.sourceforge.net. The timings developed here have been made available
    at http://jimeandprofile.sourceforge.org. A tool to simplify calling from C to
    Java has been released at http://cismtojava.sourceforge.org.


    The overall conclusion is that Java start-up time is longer than C’s, long-running
    applications can be reasonably mix Java and C and expect good performance, provided
    a few basic design guidelines are followed:


    +   * Allocate data vectors, matrices, and images on the native side to avoid
    the overhead of Java-to-native conversion if repeated native processing accesses
    the data. For most of today’s commodity platforms, BridgJ provides an easy-to-use
    way to do that per performs well.


    +   * Design interactions between the two at an appropriate level of method-call
    granularity. Thousands of calls per second can be implemented effectively but
    a design that requires too much interaction be questioned.


    +   * Minimize dynamic memory allocation by preallocating working data structures
    and buffers. Keeping Java’s garbage quiet is key. Beware of how strings'
  - '[PAGE 8]


    iterators are used because they can inadvertently result in much dynamic memory
    allocation if used carelessly.


    +   * If running long, parallel, compute tasks in Java, beware if fully loading
    all cores on the CPU for sustained periods. Performance can degrade unless real-time
    scheduling is used.

    * Allow for Java warm-up time. Design the code to allow key code paths to be exercised
    as part of start-up.


    Java, and the JVM, can be part of the high performance tool chest for applications
    that run long enough to allow Java 7 Hotspot warm-up optimizations to “kick in.”
    A hybrid Java/C development can exploit the productivity and code safety of Java
    and the speed of C to build solutions that perform well, make good use of scarce
    development dollars, and leverage extensive Java resources.'
