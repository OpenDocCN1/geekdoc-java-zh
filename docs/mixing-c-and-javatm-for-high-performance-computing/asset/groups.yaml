    ## 6.5 Java 框架总结与观察


    这项研究的动机是希望更快速地描述复杂的性能和 HPEC 应用（包括多节点应用）。在本节中，我们检查了 5 个 Java 计算网格框架，以理解其能力、架构模型和预期性能。Pi³,
    JPPF⁵⁴、GridGain⁵⁵、Storm⁵⁶ 和 Akka⁵⁷ 在 10 千兆以太网集群上进行了测试。这些框架具有不同的架构、部署模型、设置易用性和易用性。在方法调用、分布式任务和作业队列、多模式同步、actor
    通信、数据流处理和故障恢复方面有不同的选项。GridGain 具有最多的内置功能且最容易设置以及分布式方法调用，尽管它不是最快的。


    预计性能将低于高性能社区的消息接口 (MPI)，因为某些 Java 框架提供了比 MPI 更强大的能力和灵活性，但这通常是以牺牲性能为代价的。没有任何 Java
    框架在小消息上优于 MPI。Java 序列化开销增加了交换消息和移除远程方法的负载。如果数据大小只大几字节，需要更高性能的开发者将编写自定义序列化器以避免默认的序列化开销。


    然而，对于较大的数据，发现 Akka 和 Storm 都超过了 MPI 的一个或两个实现。这可能是由于测试代码的详细实现存在差异。这些差异源于显著不同的 API
    和交互模型。如果是这样，那么设计上的差异可能导致更好的 Java 性能，这一点非常有意义。当达到设计差异成为关键的点时，说明性能问题的答案不再取决于框架是
    C 框架还是 Java 框架。


    此外，对于更复杂的应用，原生 MPI 性能可能会产生误导。如果需要高级的队列和节点内功能，开发者的代码将增加 MPI 的单消息开销。这将降低性能。


    性能型应用通常有数值要求。某些类应用需要每秒 100 个作业的任务循环时间。测试显示，大多数框架都能轻松支持该速率。在每秒 1000 个作业时，三个 Java
    框架可以支持中等数据量下的速率。


    关于延迟和 JVM 能力，测试显示在 10 千兆以太网网络上，Java 套接字延迟（通过 `java.io` 包）比 MPI 的 27 微秒延迟高出约 13
    毫秒。然而，JVM 套接字开销并不是导致框架延迟高于此值的主要部分。观察到的 Java 框架延迟范围在 236 到 1320 微秒之间。虽然我们无法分析原因，但必须假设巨大的框架延迟是由于网格/数据模型、框架软件架构以及可能未优化的设计实现共同导致的。例如，在
    Storm 中，数据必须被“封装”成元组，以便过滤和数据分组，但识别和操作它们也增加了传输延迟。


    本次调查中未探索多节点性能的其他方面。未来调查的因素包括：


    - 网络负载 – 网格框架支持诸如同行节点参与者的自动发现和节点状态通信等功能需要多少开销

    - 内存负载 – 框架运行时需要多少内存

    - 随节点数量增加的可扩展性 – 如何有效地利用额外节点来分配负载

    - 故障检测时间 – 多快可以检测到节点以便重新分配工作


    # 编写用于性能的 Java 代码


    本节描述了有助于充分利用 Java 性能的编码实践。这些实践基于经验以及同仁的经验。


    ### 7.1 最小化重复路径中的内存分配


    一项内存密集型测试发现，重复路径上的垃圾回收器活动导致了 15% 的开销。提高 Java 性能的一种明确方法（特别是在重复路径上）是最小化内存分配。垃圾回收是一个巨大的益处，但其透明性可能导致开发者过度使用动态内存。多年来，垃圾回收器一直是持续开发的重点。


    从好的方面来说，开发者无需跟踪未使用的内存。从坏的方面来说，垃圾回收器必须定期运行以恢复内存的额外线程。扫描需要时间，会消耗主进程资源。垃圾回收运行的时间会导致执行抖动。


    请注意，在有限范围内分配某些数据结构可能不会产生额外的垃圾回收工作。如果在运行时检测到对象实例化不在范围外使用，则对象可能被分配在栈上。如果对象足够简单，甚至可能不会被创建。在
    Java 6 中逃逸分析是关闭的，但在 Java 7 中默认启用。


    ### 7.2 预分配工作缓冲区和结构


    对于非实时应用，最好的做法是让垃圾回收器尽可能少地工作。预分配缓冲区和结构有助于实现这一点。这包括用于分离移动数据和处理数据线程线程的双缓冲区。


    由于预分配倾向于破坏封装，因此在 Java 代码中通常不会这样做。在对象哲学下，对象管理其工作结构的分配，而不考虑复用，依靠内存机制进行清理。因此，“性能型”Java
    编码必须背离这种设计实践，转而采用更高效的预分配实践。


    '
