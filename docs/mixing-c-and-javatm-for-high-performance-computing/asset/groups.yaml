  md: "\nThe absence of language features to simplify parallel for-loops iteration\
    \ will frustrate some with a traditional computing background. Parallel Java has\
    \ the most concise way to do this. On the other hand, this investigation viewed\
    \ very narrowly on for-loop-based numerical computation. The reader may decide\
    \ that one of the other methods is more appropriate for other types of concurrency.\n\
    \nThere is a key lesson here. Given that there are a variety of concurrency techniques\
    \ available to the Java developer, the developer should instrument their application\
    \ and compare the parallelized and unparallelized versions of their application\
    \ to ensure they are obtaining the expected behavior.\n\n# Java Invoking Native\
    \ Code\n\nWhen mixing Java and C, the designer would likely use C for \"number\
    \ crunching\" and to perform tasks that require low execution jitter. Java is\
    \ likely to be used to perform other tasks such as logging, external application\
    \ communications, inter-node coordination, and data persistence. Benchmarks were\
    \ created to understand how most quickly invoke C from Java and to the relative\
    \ difficulties of the options. Here the focus is primarily on numerical data arrays.\
    \ This study does not investigate the use of strings or structures although most\
    \ of alternatives investigated here support.\n\nJava provides a low-level API\
    \ to make calls from Java to C and vice-versa. This is the Java Native Interface(JNI).\
    \ Using JNI directly can be cumbersome because it can take multiple JNI service\
    \ invocations to access arrays. Integer arguments are passed directly, however.\n\
    \nIf one starts with a C API, the method signatures would have to be modified\
    \ to accept calls directly from Java. It is usually easier to write a proxy that\
    \ accepts the Java calls, locks any Java arrays (so the garbage collector does\
    \ not move the data), copies the arrays if needed, and then invokes the actual\
    \ function. When the C function returns, modified arrays have to be written back\
    \ and unlocked.\n\nThis is the fastest way to access Java data, though it is awkward.\
    \ The JNI proxy code is code that must be compiled and linked for the target machine\
    \ and operating system. Callouts through JNI are not platform independent.\n\n\
    There are higher level options for Java-to-C invocation. Most have a platform\
    \ dependence, though one achieves platform independence for a significant set\
    \ of popular operating systems and target hardware.\n\nThe higher level options\
    \ typically hide the JNI details and seek to provide both a simple Java interface\
    \ and a C interface. They typically build a proxy class classically, as a developer-time\
    \ action, or by building \"glue\" on-the-fly. Four such options are Java Native\
    \ Access (JNA), BridgJ, Simplified Wrapper and Interface Generator (SWIG), and\
    \ HawtJNI.\n\nFrom the description at JNI repository site:\n\n> \"JNA provides\
    \ Java easy access to native shared libraries (DLLs on Windows) without writing\
    \ anything but Java—no JNI or native code is required. [...] Access is dynamic\
    \ at runtime without code generation. [...] The Java uses a small native library\
    \ stub to dynamically invoke native code. The developer uses a Java interface\
    \ to describe functions and structures in the target native library. [...] While\
    \ some attention is paid to performance, correctness and use of take priority.\"\
    \n\nBridgJ is a library that:\n\n35 \"Java Native Interface Specification.\" Oracle\
    \ SE Documentation. <https://docs.oracle.com/javase/7/technotes/guides/jni/jniTOC.html>.\n\
