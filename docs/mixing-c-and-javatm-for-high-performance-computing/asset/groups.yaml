  mdcn: '


    Storm 与所研究的其他框架相比，一个独特的之处是，该框架可以轻松创建相同 spouts（喷射）和 bolts（节点）的多个实例来实现并行处理。指向并行化
    bolt 的流元组将自动在各个 bolt 之间“拆分”（stripped）以分配负载。


    Storm spouts 和 bolts 可以在包含或不包含元组交付确认（acknowled）的情况下进行定向。故障可能会导致元组重发，尽管这是在检测到缺失确认后由用户代码执行的。spouts
    和 bolts 应该保持状态，并能够快速重启。


    Storm 处于开发的早期阶段。它假设假设在实例化并行化 bolt 时，所有处理节点的能力是平等的。这使得开发者需要编写专门的着色器来处理更具处理器感知能力的
    bolt 实例分配。它没有单一的队列可以进行入队。独一无二的处理必须响应节点的“触发”元组来完成。


    Storm 是开源的，并根据 Eclipse 公共许可（Eclipse Public License）发布。Storm 相对较新，缺乏旧框架的某些“打磨”。Storm
    运行在 JVM 上，但用 Java 和 Closure 编写。它要求分别安装并配置 Apache Zookeeper⁶、ZeroMQ⁷ 以及 ZeroMQ
    的 Java 绑定。测试使用了 Storm 0.8.2。


    ## 6.2.6 Akka


    Akka 提供了一种更进阶的消息分布模型，即 Actor 模型（actor model）。通过 MPI 和 Pj，消息根据整数 ID发送到计算元素。使用 actor
    时，通过开发者分配的唯一标识符查找 actor 的引用。该引用用于后续的交付。与 MPI 和 Pj 的整数 ID 不同，actor 的对称标识符不取决于网格的大小。无论
    actor 是发送进程的本地还是远程的，都会使用引用机制。这允许应用程序最初编写为多个相互通信的 actor，稍后可以轻松地在不同的节点上实例化。


    消息发送是异步的。任何可序列化的 Java 对象（包括 Java 对象的元组）都可以作为消息发送。Actor 可以维护状态并根据需要更改其行为。与 Storm
    不同，actor 之间的 I/O 关系没有捕获在静态拓扑中——每个发送者在发送每条消息时都会要求接收者。


    Akka 支持集群操作，用户可以编写代码来识别集群事件，例如节点加入或离开集群。Akka 支持将消息分到不同节点上 actor 的并行实例。该框架提供了定义的
    actor 作为路由器（routers），这对于将消息分到 actor 的并行实例非常有用。然而，使用这些比非路由器分发需要更多的开发者工作和理解。


    > ⁶⁰ Apache Zookeeper, < http://zookeeper.apache.org >


    > ⁶¹ Carl Hewitt, Peter Bishop, and Richard Steiger. 1973. A universal modular
    ACTOR formalism for artificial intelligence. In Proceedings of the 3rd international
    conference on Artificial Intelligence (IJCAI73). Morgan Kaufmann Publishers Inc.,
    San Francisco, CA, USA, 235-245


    Akka 具有各种类型的路由器，包括一种自适应负载均衡路由器，它使用运行时 CPU 指标来决定向哪些工作节点路由消息。这些指标包括内存利用率、平均负载、CPU
    利用率或这些者的混合。测试使用了版本 2.1.2。


    ## 6.3 特性比较


    上一节提供了每个框架的介绍性描述。表 6-1 和表 6-2 比较了这些框架中设计多节点计算应用的人感兴趣的方面。


    架构（Architecture）指的是节点之间的关系。在某些框架中存在主节点（master node），例如，可能会启动其他节点或在 I/O 中承担特殊角色。节点和工作节点的拓扑在框架运行期间可能是固定的，或者它们可能支持计算节点的临时进入/退出。在后一种情况下，工作代码通常是动态分发的，取决于哪些节点是用的。


    分布模型（Distribution model）指的是消息或工作是否被分发。为了分配工作，框架必须移动数据，但消息的细节由框架处理。在 Storm 的情况下，数据元组从
    sprouts 和 bolts 中显式发射，元组的目标对于 sprout 或 bolt 是不可知的。目标是由提交给框架执行的拓扑确定的。相比之下，Akka
    的发送 actor 显式地指定将接收消息的 actor。


    框架可能可能不分离操作系统进程来执行工作。GridGain 和 Akka 是唯一不分离的框架。


    负载均衡（Load balancing）指的是框架在可用节点之间分配工作的能力。简单算法将仅以轮询方式将负载分配到可用资源。更复杂的算法将考虑执行时间，以预测当前分配决策对负载的影响。其他算法还会考虑节点当前的
    CPU 和内存负载。JPPF、GridGain 和 Akka 都提供了各种形式的负载均衡，以及为用户提供的负载均衡算法的准备。


    节点故障恢复（Recovery from node failure）描述了框架是否有助于从节点故障中恢复，而不会给开发者带来过多检测和采取纠正措施的工作。MPI
    和 PJ 处于不利，因为它们基于整数 ID 的进程标识使得在特定 ID 下线时难以于恢复，需要用户对工作到其他节点进行某些复杂的重新分配。


    ## 表 6-1. 框架特性比较 (1 of 2)


    | 特性 | MPI | PJ | JPPF | GridGain | Storm | Akka |

    |---|---|---|---|---|---|---|

    | 使用版本 | OpenMPI 1.6.4 | 20120620 | 3.3.4 | 4.3.1e | 0.8.2 | 2.1.2 |

    | 架构 | 固定对等节点；固定网格 | 主/从；固定网格 | 主/从；动态网格 | 主/从；动态拓扑 | 动态数量节点 | 动态数量节点 |

    | 分布模型 | 消息传递 | 消息传递 | 任务提交 | 任务提交 | 显式目标 | 显式目标 |

    | 分离操作系统进程 | 是 | 是 | 否 | 否 | 否 | 否 |

    | 负载均衡 | 否 | 否 | 是 | 是 | 是 | 是 |

    | 节点故障恢复 | 否 | 否 | 是 | 是 | 是 |

    | 节点间通信 | TCP/IP; RDMA | TCP/IP; UDP/IP | TCP/IP; UDP/IP | TCP/IP; UDP/IP | ZeroMQ
    | ZeroMQ |

    | 序列化 | 由应用程序提供 | 自动 | 自动 | 自动 | | |

    | 执行单元 | 整个应用 | 整个应用 | 细粒度 | 细粒度 | 细粒度 | 细粒度 |

    | 分布式工作队列 | 否 | 否 | 是 | 是 | 是 | 是 |

    | 任务间同步 | 否 | 否 | 是 | 是 | 是 | |

    | 基于节点属性的分布 | 否 | 否 | 否 | 是 | 是 | 是 |

    | 基于数据属性的分布 | 否 | 否 | 否 | 否 | 是 | 是 |

    | 跨节点实现 join 语义 | 否 | 否 | 是 | 是 | 是 | 是 |

    | 节点间同步数据 | 否 | 否 | 否 | 否 | 否 | 否 |


    节点间通信标识用于通信的关键协议。MPI 可以使用远程内存访问 (RDMA)。RDMA 允许一个节点直接另一个内存中放置信息。ZeroMQ 是一种促进通信的
    API 和协议。


    序列化是将数据类型、数组和数据结构转换为字节以便传输。在 MPI 中，数据结构由应用程序提供。在 Java 中，如果遵循某些约定，数据是一个对象。


    执行单元指的是代码如何传输和执行。在 MPI 和 PJ 中，整个应用程序在每个节点上运行，由应用程序决定做什么。其他框架提供了更细粒度的代码。JPPF、GridGain、Storm
    有将必要代码传输到节点的能力。


    分布式工作队列是指任何节点的进程都可以排队执行额外工作，但也跨网格。如果没有框架对此的支持，开发者必须实现可以写入任何节点的队列、从队列获取工作并分发到工作节点的代码，以及将结果传回请求节点的代码。


    '
