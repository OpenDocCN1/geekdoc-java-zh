    flexibility is often achieved if a separate communication thread is used, but
    then additional queues and buffers will be used. A framework that provides asynchronous
    communication as well as the needed queuing and buffering will serve the user
    much development time.


    Job/work control refers to facilities the framework may provide for concurrent
    execution of work. This includes:


    - How jobs are specified and invoked. The framework may provide a local queue
    where jobs are placed.

    - Coordination/synchronization. A more sophisticated form of job control will
    provide a local queue onto which job descriptors are placed.

    - Job status. The ability to inspect job queues to determine what work is pending
    may allow adaptive job distribution.

    - Job failure detection. Similar to communication failure detection, this may
    simply mean tracking whether job completed normally or abnormally. A more sophisticated
    framework might retry the job on a different node.

    - Logical topology. Since the framework works with some sort of abstraction of
    work, the logical topology provides an easy way to specify that the output of
    one job becomes the input to one or more jobs. The previous paragraphs have outlined
    attributes for analyzing frameworks. One additional consideration is to what degree
    advanced framework features are manual or automated to what degree, are they statically
    or dynamically configured. For example, may may be described statically by configuration
    files that are read by a framework at runtime, or it may be programmatically specified
    by the application as part of application initialization, or it may be heuristically
    determined by the framework in response to network load.


    ## 6.2 Five Compute Grid Frameworks


    Five frameworks were chosen. The frameworks have different models of work, data,
    the compute grid, and the communications. They also represent open-source and
    commercial offerings. The frameworks are:


    - Java Parallel Processing Framework (JPPF)

    - GridGain

    - Storm

    - Akka


    Additionally, MPI was chosen as a performance baseline. MPI has been developed
    over many years and is the facto workhorse for high performance computing. It
    has optimized support for basic cluster communication over Ethernet and low latency
    communications as Infinband.


