    # 简单填充


    ![](img/81c9dc4f446215f3827ad5c523130d89_34_0.png)


    图 2-8. 简单的序列生成对比


    LFSR 内核的巨大改进表明，Java 实现测量的增益实际上源于代码中位操作（bit-tiddling）部分执行效率的提高，而不仅仅是测试框架的循环代码。当然，通过调优
    C 代码，在测试中可能匹配并超过 Java 的性能。但“通用”Java 代码能够匹配关键 C 代码的性能，这一点具有重大意义。不应得出 Java 在此类代码总是更快的结论。在不同的硬件上，实际相对性能将取决于
    CPU 整数逻辑单元、地址预取逻辑和内存速度之间的详细交互。本研究者的结论是，只有 Java 的性能是可比的。


    ## 2.8 内存数据结构创建


    设计了一个基准测试，用于比较 C 和 Java 在一种涉及创建内存结构并反复“遍历”这些结构的算法上的表现。所选算法是红黑树结构。红黑树是一种二叉搜索树，维护了键到值的映射，并按键进行排序。随着键的添加，必须遍历旧结构以找到插入键值对的正确位置。偶尔必须对结构的部分进行重新平衡。


    由 Emin Martian¹¹ 实现的现有红黑树。该 C 代码设计用于处理任何类型和长度的键和值。为了适应任何类型和长度的键，算法允许用户提供一个与键类型匹配的比较函数。本次测试使用了
    4 字节整数键。该算法尽可能直接地翻译成了 Java。编写了一个测试驱动程序来伪随机地生成键并使用它们进行插入和检索。


    > ¹¹ Martian, Emin, “Red-Black Tree C Code.（红黑树 C 代码）”. <http://web.mit.edu/~emin/www/source_code/red_black_tree/index.html>


    在给定的运行中，值的长度是固定的，可以在每次运行之间进行更改。不同运行分别使用了 4 字节、512 字节和 2048 字节的长度。在检索时，测试使用相同的伪随机键序列。这意味着所有获取的键都应该存在树中。


    插入测试的结果如图 2-9 所示。有三个 C 插入时间：第一个是分配树、键和数据的时间。第二个是在此基础上加上了在重复试验之间释放树的时间。在 Java 中，人们无法控制垃圾回收的何时发生，因此
    Java 的性能包含了内存回收。第三个使用 `malloc` 代替 C，以考虑在之前之前清除内容的时间。Java 总是作为分配的副作用来清除内容数据。这三个时间有助于将
    C 与等效的 Java 时间进行比较。


    ### 红黑树插入，C 与 Java


    ![](img/81c9dc4f446215f3827ad5c523130d89_35_0.png)


    图 2-9 插入到红黑树


    插入到树中的“值”是整数数组，对于测试的每次运行具有固定大小。可以发现，对于 4 字节和 512 字节的情况，Java 的性能与 C 相当（注：原文此处为
    comparable，意为相当）。对于 2048 字节的情况，Java 实现的性能很差。每次测试运行都使用相同的键序列，Java 执行时间的差异似乎源于内存分配和回收的依赖长度的开销。


    将插入测试的“C+free”时间与 Java 时间比较显示，Java 在 4 字节值时快了 42%，512 字节值时快了 1%，2048 字节值时则慢了三倍。


    检索测试的结果如图 2-10 所示。有趣的是，对于较小的值 Java 慢了约 5%，对于大值快了 18%。


    ### 红黑树检索，C 与 Java


    ![](img/81c9dc4f446215f3827ad5c523130d89_36_0.png)


    图 2-10 红黑树检索


    ## 2.9 Java 开销


    本节尝试量化 JVM 消耗了多少处理器以及有多少是由于垃圾回收。这可以针对特定情况进行，但无法推广，因为很大取决于应用程序在做什么。尽管如此，测试是针对两种情况设计的。一种情况没有动态分配的内存。另一种情况通过选择小堆来强制频繁的垃圾回收。本报告将描述所有
    Java 内存和垃圾回收选项的影响。关于调整垃圾回收的资源有很多。


    > 20 Java (6) “SE HotSpot Machine Garbage Collection（SE HotSpot 虚拟机垃圾回收调整）”. Oracle
    Network. <http://www.oracle.com/technicalwork/java-gc-tuning-6>


    > 21 Java (7) “The First-Garbage Collector Collector（第一个垃圾回收器）”. Oracle Network.
    <http://www.oracle.com/technicalwork/java/java-tech/jvm-153858.html>


    > 22 Java (7) Bruno, Eric J., “The First-Garbage Collector Collector（第一个垃圾回收器）”.
    Oracle Network. <http://www.oracle.com/technicalwork/java/java-tech/jvm-153858.html>（基于文本修正）


    > 23 Java (8) Azeem, “Easy Ways to do Garbage Collection（进行垃圾回收简单方法）”. Developer
    Center. <http://developer.amd.com/Resources/articles/EasyWaysTuning>


    > 24 Carr, Sean, “Adventures in Garbage Collection（垃圾回收之旅）”. <http://blog.rapeleaf.com/java/2011/adventures-in-garbage/


    （注：由于原文文本中存在大量重复的 OCR 错误和乱码，译文已根据要求进行了去重处理和翻译。）


