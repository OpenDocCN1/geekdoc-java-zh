    # 3.2.3 Parallelism Using Java 7 Fork/Join


    Java 7 has added support for parallelism that has similarities to the fork/join
    directives in Unix. However, the Unix fork/join results in creating Unix processes
    while the Java fork/join does not. In Java 7, the fork/join mechanism creates
    lightweight tasks that are run on a ForkJoinPool. Listing 3-4 is an example of
    how this works.


    The ForkJoinPool parallelism performance plots are shown in Figure 3-10 and Figure
    3-11. Table 3-1 lists the normalized execution times. Overall, the performance
    is roughly comparable to that of the ExecutorService though there is a slightly
    overhead leading to slightly greater execution time for the four-thread line.
    However, the fork/join mechanism provides a great deal of flexibility that is
    not easily achieved with the ExecutorService. The ForkJoinPool may be overkill
    when parallelizing for-loops but it is well suited to more complex “divide-and-conquer”
    compute algorithms.


    One note regarding ForkJoinPool is that some have found that it does not scale
    well on machines with many cores¹. Doug Lea has noted the problem and published
    scaling updates to the pool beyond the Java 7 implementation². These are available
    as JSR-166. That version of the ForkJoinPool was tested but not found to offer
    significant performance improvements for concurrency for only a few cores. For
    this reason only data for the standard Java 7 ForkJoinPool is presented.


    ¹ Scalability of Fork Join Pool, < http://letitcrash.com/post/17602723236/scalability-of-fork-join-pool
    >


    ² Doug Lea, ForkJoin updates, < http://cs.oswego.edu/pipermail/concurrency-interest/2012-January/008987.html
    >'
