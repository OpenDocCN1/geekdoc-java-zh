    of more complex operations, but it has the downside effect that a simple sequential
    integer-based iteration is not as simple as a byte-code loop.


    There has been much discussion of this issue.¹ The compiler, as of Scala 2.10.2,
    still generates code with the slower for-comprehension for integer-based looping.
    However, there is a Scala compiler addition targeted for Scala 2.11 which will
    perform the desired optimization.²


