    ![](img/81c9dc4f446215f3827ad5c523130d89_103_0.png)


    # Figure 6-2. Comparison of Framework Latency Over 10 GbE


    Figure 6-3 plots synchronous activation rate as a function of message size. The
    message size is the size of the user data. As expected the highest message rate
    is achieved by MPI. JPPF has the lowest rate. The best synchronous JPPF performer,
    Akka, was about a factor of 11 slower than MPI for small data sizes, where the
    Java serialization overhead is less significant, Akka has 70 percent of the rate
    of MPI.


    Figure 6-3 also plots the number of message exchanges that were achieved using
    just low level Java TCP socket I/O. This size is the true message length in bytes
    because for curve there is no serialization. It might seem odd to compare this
    no-overhead rate-by-count curve with the capabilities of the post-serialization
    Java curves. However, the purpose is to show the capabilities of the various options
    as seen by the end user who have little control over serialization overhead unless
    the user writes their own serializer. The Java socket I/O curve also shows that
    in this synchronous ping test Java itself is not the limitation to throughput.
    The lower performance of the Java frameworks is likely due to a combination of
    two factors. One factor is the additional work performed by each framework to
    implement each frameworks features. The second factor is efficient I/O design.


    Figure 6-4 plots the asynchronous activation rate. These curves should be higher
    than their synchronous counterparts because new messages or tasks can be queued
    before the previous have completed. Again Akka has the best Java rate and JPPF
    has the lowest. There are two MPI curves shown. The MPI-A1 test maintains a single
    outstanding buffer. The MPI-A4 test maintains 4 buffers that are used in a round-robin
    fashion to allow 4 outstanding activations.'
