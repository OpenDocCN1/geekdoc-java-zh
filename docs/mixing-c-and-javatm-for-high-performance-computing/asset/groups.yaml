    # 6.2.1 Message Passing Interface


    MPI focuses on reliable message transmission among a number of nodes. MPI 2.2
    was used in these studies. MPI programs are launched from the command-line in
    which the user specifies how many copies of the process should be launched. The
    copies are launched using a grid topology specification file identifies candidate
    nodes as well as how many processes may be launched at each node. From the point
    of view of MPI all nodes can connect to all other nodes.


    The same application is launched at all nodes. An MPI execute communicates with
    a daemon or job controller running on each node to instantiate the application
    copies at that node. Each instance is identified by a unique integer. It leaves
    it to the developer to write code to edit the id and decide which ids should handle
    and how they should communicate using each other ids. Synchronous and asynchronous
    communications are supported. The developer must write any necessary queuing and
    buffering. The developer must specify what then uses programmatic specification
    to do the serialization and deserialization as needed. There is no notion of a
    job. There are attributes that can be associated with different contexts. Facilities
    exist for synchronization process flow across multiple nodes. There is no automated
    behavior to handle communication failures. There are commercial and open-source
    implementations of MPI that are available. OpenMPI 1.6.4 was used here.


    # 6.2.2 Parallel Java


    PJ is an all-Java framework for cluster computing. Parts of PJ have many similarities
    to MPI. PJ is distributed under a General Public License (GPL). The distribution
    includes a cluster communication API that is very similar to MPI. It also includes
    functionality for in-process multi-threading that is similar to Concept MPI and
    was partially discussed in Section 3.2.4. Finally, PJ includes a variety of other
    support functions and utilities that are used at RIT.


    PJ applications are also usually launched from the command-line. There is a scheduler
    running on a node that communicates with Secure Shell (SSH) daemons running on
    other nodes to start the required number of instances of the application on the
    other nodes. The startup interactions are a little different than those of MPI
    though often the instances of the application are running the developer must handle
    many of the same software design issues related to buffers and queues that face
    the MPI developer. Serialization is a bit more capable than MPI because Java objects
    can be serialized with much less work due to general support in Java for object
    serialization.


    PJ is fairly easy to use and also the framework has problems maintaining connections
    between nodes when large data sizes were being exchanged. Version 20120620 was
    used here.


    # 6.2.3 Java Parallel Processing Framework


    While MPI and PJ have basic facilities for cluster communication based on message
    exchange, JPPF has different model. In JPPF, work is distributed as jobs and tasks.
    A job is a list of tasks that may be executed in parallel. A task is a Java object
    that is either Runnable, Callable, or a subclass of JPPFTask. A task may also
    be designated as the JPPF annotation JPPFRunnable. A task has inputs and a result
    that is serialized and available upon task completion.'
  - '[PAGE 94]


    Unlike MPI and PJ the entire application is not run at each node. Instead only
    the tasks are run when needed on selected nodes. The JPPF model of the grid is
    as one big queue that accepts tasks. The topology of the grid is less important.
    The applications classes can be installed on all nodes, JPPF dynamically serialize
    and deploy the classes when running. This simplifies development and makes it
    easier to configure clusters that can join or leave the cluster dynamically.


    Jobs are submitted synchronously or asynchronously. JPPF has some tolerance to
    failures because a node becomes unavailable it will not be used for subsequent
    task execution. Furthermore, each job has an expiration time that could be used
    to detect work that has already been dispatched but failed to complete. JPPF uses
    heartbeats to detect when node fails and can automatically re-queue a task to
    a different node than the one that failed.


    The JPPF deployment architecture has at least one JPPF server and one JPPF compute
    node. Nodes get their work from a server and there may be multiple nodes connected
    to the same server. There may be multiple servers that are connected to each other
    which will distribute work between them. The topology is configured by a configuration
    file and can be a mix of predefined connections and automatically discovered.
    Predefined connections use Transmission Control Protocol/Internet Protocol (TCP/IP).
    Discovered connections use Datagram Protocol [UDP] multicast.


    When the main application runs, it makes a connection to a server and is able
    to submit work to the grid. Regardless of the connection relationships between
    servers and compute nodes, a client enters the grid as a single queue. Jobs are
    distributed from the queue using one of several available load-balancing algorithms.
    It is also possible to write a custom load-balancing algorithm.


    JPPF is available as open-source under an Apache 2 license. Version 3.3.4 was
    tested in this investigation.


    # 6.2.4 GridGain


    GridGain is a commercial product that evolved from an earlier open-source development
    by the same principal developers. It is available for three different types of
    grids—compute grids, data grids, and map-reduce grids. The compute grid was used
    for this study.


    GridGain is a very flexible framework that allows work to be distributed to an
    abstract grid. The grid is attracted to a greater degree than JPPF does. Grid
    nodes are not logical peers to each other and have attributes that can be used
    when work is dispatched. Use code can attach attributes to nodes some grid attributes
    are automatically added by the system including environment variables, JVM Runtime
    properties, and operating system name/machine architecture/version.


    Node attributes are also dynamically updated with 50 metrics including:


    +   - average CPU load

    - average number of waiting jobs

    - garbage collection CPU load

    - amount of file free space

    - memory usage metrics'
  - '[PAGE 95]


    +   * communication message counts

    * available number of CPUs.


    GridGain joins jobs. This is opposite to JPPF in jobs which contain tasks. A task
    is an object that can be created as a subclass of one of several predefined base
    classes. GridGain tasks are submitted to the entire grid or a subset of the grid.
    A grid subset can be created by the client application by using node attributes
    to select candidate nodes.


    Work can also be submitted as a proxy of calling methods that have been compiled
    with the Gridify annotation. This is very attractive for development and maintenance
    of more intricate applications because method calls are easy to write and understand.
    The framework covers the complexities of argument and return value serialization
    as well as dispatch to the grid.


    The previous frameworks utilized daemons to initiate the instantiation or its
    workers processes at various nodes. With GridGain an instance of GridGain is run
    at each network node. Each instance participates in the grid and can run tasks
    directly—additional operating system (OS) processes are not required. Client code
    can be run as part of one node''s GridGain instance, or the GridGain instance
    can access via its local grid. Furthermore, it is possible to have client at any
    node—each client can invoke distributed services executed among all other nodes.
    This is very attractive for fault tolerant computing because there does not need
    to be an explicit master node. The user could detect when the current active master
    node fails and then assume those responsibilities at another already active node.
    The algorithm for this is, of course, up to the user.


    GridGain can autopdeploy to any node that needs it. Job arguments and return results
    are auto-serialized. The user can create custom serializers if desired. There
    are various types of loadbalancing available including factors that a node''s
    CPU load into the distribution algorithm. The work distribution algorithm can
    also be customized. Custom the handler for failures are already provided that
    will resubmit work to a different node if needed.


    GridGain was the easiest to install and use of all the frameworks tested. As a
    commercial product it also has the most extensive documentation. Version 4.3.1e
    used for testing.


    # 6.2.5 Storm


    Storm is focused on distributed streaming computation. In this model, client work
    is decomposed into several small computation tasks that are interconnected. The
    input stages are called “spouts” and the others are called “bolts.”. The client
    application is implemented as a dataflow network with sprouts and bolts interconnected
    in a topology that is submitted as part of a small application. Data are represented
    as n-tuples. The n-tuple components are composed of serializable Java objects
    and can be simple or complex as needed.


    The I/O relationships between the spouts and bolts define a topology that is specified
    by a “starting” application that submits the topology to special framework daemon
    named “Nimbus.” Nimbus then communicates with the Storm compute node daemons (supervisors)
    that will instantiate sprouts and bolts as needed. The sprouts and bolts are instantiated
    as OS processes with socket connection to each other.'
