    # 6 Java Frameworks for Multi-Node Work


    Code that handles inter-node communication can be tedious and error-prone to write.
    There are various Java frameworks that can be used in an compute cluster to simplify
    this. This section investigates various of these and presents performance results.
    Results are compared with the Message Passing Interface (MPI) which is the “workhorse”
    of high computing.


    # 6.1 Comparing Grid Computing Frameworks Capabilities in the Abstract


    For the purpose of this report the term “grid computing” is used to describe the
    use of tightly coupled nodes working over a problem. Both large-scale compute
    problems such as weather prediction and smaller HPEC-scale problems have the need
    to serialize, buffer, transmit, verify delivery, and re-buffer, and de-serialize
    data. When comparing different compute grid frameworks there will be differences
    in how physical assets are identified, how messages are managed, and how communication
    links are utilized. Figure 6-1 depicts these areas for comparison.


    ![](img/81c9dc4f446215f3827ad5c523130d89_90_0.png)


    Figure 6-1. Considerations When Comparing Compute Grid Frameworks


    Physical assets refer to how a framework provides information about the processors
    and other hardware characteristics of a node. It is often necessary to know the
    capabilities of the physical assets to make best use of the cluster. For example,
    a particular node may not contain a GPU. Such a node might not be used for high
    performance calculations in favor of the faster node with a GPU. The implementer
    can always build custom structures that decorate the operating system, CPU, and
    GPU environments, and use the communication facilities to convey that to other
    nodes. However, the greatest developer productivity is achieved if the framework
    already collects and propagates that information and allows the developer to add
    meta-data as needed.'
  - '[PAGE 91]


    Communications refers to the mechanisms and models provided by the framework to
    exchange information between the nodes. At the lowest level this includes the
    ability to send and receive a sequence of bytes. Other considerations include:


    +   - Whether synchronous send/receive is supported. Synchronous communications
    allow data to be "copied" directly to/from application but requires the sender
    and receiver block until communication is complete.


    +   - Whether asynchronous send/receive is supported. Here sender and receive
    do not wait but must make additional framework calls to test communication. The
    greatest flexibility is often achieved if a separate communication thread is used,
    but then additional queues and buffers will be used. A framework that provides
    asynchronous communication as well as the needed queuing and buffering will serve
    the user much development time.


    Job/work control refers to facilities the framework may provide for concurrent
    execution of code in a distributed fashion. This includes:


    +   - How jobs are specified and invoked. Each job, in general, have some metadata
    that identifies a name or id, what the inputs are, and may also include what the
    outputs. One of them is simply remote method invocation that allows code on a
    remote node to be invoked. The methods arguments are serialized, sent to the remote
    node, the method is activated, and method results are serialized and returned
    to the caller.

    - Coordination/synchronization. A more sophisticated form of job control will
    provide a local queue onto which job descriptors (or job objects) are placed.
    Jobs on the local queue are distributed to other nodes and executed. Framework
    facilities may allow conditions to be set up that one job start might require
    other job completions as a precondition.'
  - '[PAGE 92]


    +   - Job status monitoring. The ability to inspect job queues to determine what
    work is pending may allow data throttling and adaptive job distribution. This
    is not as important for applications that have a fixed input and output rate,
    but is very useful for applications whose processing load may depend on the data
    content.


    +   - Job failure detection. Similar to communication failure detection, this
    may simply mean tracking job completion with indicator of whether the job completed
    normally or abnormally. A more sophisticated framework might automatically retry
    the job on a different node.


    +   - Logical topology. Since the framework works with some sort of abstraction
    of work, the logical topology provides an easy way to specify that the output
    of one job becomes the input to one or more jobs. The timesaving however is that
    the framework that supports this will automatically configure the communication
    paths that are required between work units freeing the developer from this tedious
    coding.


    The previous paragraphs have outlined attributes for analyzing frameworks. One
    additional consideration is to what degree advanced framework features are manual
    or automated to what degree, are they statically or dynamically configured. For
    example, topology may be described statically, by configuration files that are
    read by a framework at runtime, or it may be programmatically specified by the
    application as part of application initialization, or it may be heuristically
    determined by the framework in response to network load.


    # 6.2 Five Java Compute Grid Frameworks


    Five frameworks were chosen. The frameworks have different models of work, data,
    the compute grid, and the communications. They also represent open-source and
    commercial offerings. The frameworks are:


    +   - PJ^53


    +   - Java Parallel Processing Framework^54 (JPPF)


    +   - GridGain^55


    +   - Storm^56


    +   - Akka^57


    Additionally, MPI^58 was chosen as a performance baseline. MPI has been developed
    over many years and is the facto workhorse for high performance computing. It
    has optimized support for basic cluster communication over Ethernet and low latency
    communications as Infiniband^59.


    > 54 Java Parallel Processing Framework, < http://www.jppf.org >n55 GridGain,
    < http://www.gridgain.com >n56 Storm, < http://storm-project.net >n57 Akka, <
    http://akka.io >n58 MPI, < http://www.mcs.anl.gov/research/projects/mpi/index.html
    >n59 Infiniband Trade Association - < http://www.infiniband.org >'
