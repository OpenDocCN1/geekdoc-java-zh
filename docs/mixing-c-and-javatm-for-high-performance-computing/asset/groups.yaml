    在展示结果之前说明一点：在之前调用 C 的研究中，有多种方式来传递 Java 数组数据，或者是否在 Java 代码控制下创建原生数据。由于所有选项仍然可用，此测试没有重复。相反，此测试侧重于带有简单整数参数的方法调用时间，因为这些时间可以外推以预测各种数组传递方案的性能。


