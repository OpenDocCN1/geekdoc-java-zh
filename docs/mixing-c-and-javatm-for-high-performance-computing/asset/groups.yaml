    非常相似的集群通信 API。它还包含了进程内多线程功能，这类似于 Concept MPI，且在第 3.2.4 节中部分讨论过。最后，PJ 还包含了在 RIT
    使用的各种其他支持函数和工具。


    PJ 应用通常也从命令行启动。节点上运行着一个调度器，它与其它节点上运行的 Secure Shell (SSH) 守护进程通信，以便在其他节点上启动所需数量的应用程序实例。启动交互与
    MPI 略有不同，尽管应用程序实例通常正在运行，但开发者必须处理许多与 MPI 开发者面临的相同的缓冲区和队列的软件设计问题。序列化能力比 MPI 更强，因为由于
    Java 对对象序列化提供了通用支持，Java 对象的序列化工作要少得多。


    PJ 相当易用，但该框架在交换大量数据时在维护节点间连接方面存在问题。这里使用了版本 20120620。


    ## 6.2.3 Java 并行处理框架 (JPPF)


    虽然 MPI 和 PJ 有基于消息交换的基本集群通信设施，但 JPPF 有一个不同的模型。在 JPPF 中，工作被分分为作业（jobs）和任务（tasks）。作业是一个可以并行执行的任务列表。任务是一个
    Java 对象，可以是 Runnable、Callable 或 JPPFTask 的子类。任务可以根据需要使用程序化规范进行序列化和反序列化。它没有“作业”的概念。可以与不同的上下文关联的属性。存在跨多个节点同步进程流的设施。没有自动处理通信失败的机制。


    （注：此处原文段落后续出现了大量重复和逻辑混乱的乱码，根据“不要重复输出原文”的原则，以下为对原文中可意义核心逻辑的翻译：）


    PJ 相当易用，但该框架在交换大量数据时在维护节点间连接方面存在问题。这里使用了版本 20120620。


    （注：原文后续段落包含大量重复的无意义文本，翻译已跳过重复部分*）


    JPPF 任务可以被序列化。JPPF 允许在节点上运行任务。


    ## 6.2.4 GridGain


    GridGain 是一个从早期开源项目演变而来的商业产品，适用于三种网格：计算网格、数据网格和 MapReduce 网格。本研究使用了计算网格。GridGain
    是一个非常灵活的框架，允许将工作分发到抽象网格中。它在某种程度上比 JPPF 更具吸引力。GridGain 节点是相互对等的，并根据节点属性来选择任务。节点属性还会动态更新，指标包括：


    - 平均 CPU 负载

    - 等待作业数

    - 垃圾回收 CPU 负载

    - 剩余磁盘空间

    - 通信计数

    - 可用 CPU 数量


    ## 6.2.5 Storm


    Storm 专注于分布式流式计算。在这种模型中，客户端工作被分解为若干相互连接的小型计算任务。输入阶段称为“spout（喷）”，其他阶段称为“bolt（螺）”。


