    # Java and Scala Compared on Red-Black Tree Tests


    ![](img/81c9dc4f446215f3827ad5c523130d89_121_0.png)


    Figure A-1. Java and Scala Red-Black Insert and Get Performance


    The matrix multiply requires three nested loops. This makes a good test to understand
    the performance of Scala loops. Scala''s for-comprehensions are also “syntactic
    sugar” for higher-order methods. The for-comprehension is a general construct
    that can be used for iteration over a variety of types and can include filtering
