    The Java code executes at between 60 to 85 percent of the speed of the C code.
    This seems inconsistent with the results of the matrix multiply benchmark of the
    previous section. However, if one looks at a source code, in Listing 2-2, the
    characteristics of the code are different than that of the matrix-multiply:


    +   - The code kernel is longer.

    - There are more array indexes used.

    - Array index increments are not sequential making them more difficult to predict
    by code analysis done by the Runtime.

    - Non-sequential array data access

    - Loop bounds are more complex functions of outer loops.

    - There are more array pickups.


    One of Java''s safety features is that all array indexes are checked to make sure
    they are in range. In simple loops¹ the compiler can analyze index bounds and
    check them, before the loop is executed. If the bounds cannot be determined, Java
    must check each array index, which can carry a significant performance penalty.
    However, due to resource limitations, it was not verified how much a factor this
    was.


