  md: "\n## Table 2-2. JVM Overhead in Memory Allocation Intensive Test\n\n| Case\
    \ (All use two Compute Threads) | Memory Intensive Test | No Memory Test |\n|---|---|--|\n\
    | 2 Cores | 178 sec. (15%) | 155.79 sec. (0%) |\n| 3 Cores | 155 sec. | 155.70\
    \ sec. |\n\n## 2.10 Summary of Java On a Single Core\n\nFour types of algorithms\
    \ that were initially implemented in C were converted to Java. The matrix multiplication\
    \ has nested loops with small compute bodies and sequential array indices. The\
    \ FFT has medium sized loops, but non-sequential array indices. The LFSR sequence\
    \ requires integer-based masking and Boolean operations. The red-black tree sorting\
    \ is highly recursive and requires dynamic object creation and cleanup.\n\nOnce\
    \ warmed, the Java matrix multiplication ran a faster than the C version that\
    \ was compiled with a GNU compiler at its highest level of optimization. The Java\
    \ FFT performance was 20 to 40 percent slower than Css. This may be due to the\
    \ more complex and non-sequential use of array indices as compared with the matrix\
    \ multiplication. The Java version of the LFSR sequence ran 30 percent faster\
    \ than the C version.\n\nThe first three tests required no memory allocation for\
    \ computation. In contrast, the red-black tree-sorting required heavy use of memory\
    \ allocation to allocate space for keys and values to be inserted into the tree,\
    \ the entire tree and its contents are disposed of by triggering the garbage collection\
    \ system to recover unused memory. In this test, Java was a little faster for\
    \ insertion and a slower than C for retrieval. There also seemed to be object-size\
    \ dependence. The faster insertion speed degraded to poorer as the allocation\
    \ size increased.\n\nThe fact that sometimes the Java is faster and sometimes\
    \ slower suggests that:\n\n- Hardware architecture, such as cache size, instruction\
    \ pipeline depths, number and throughput of floating point versus integer logic\
    \ units can significantly impact these findings.\n\n- The designer should test\
    \ the kernels to know what yields the best performance for the application. On\
    \ the other hand, it should not be assumed that C code will always be the best.\n\
    \n- Even if the heavy computation is done in C, incidental computation might be\
    \ handled by Java. In the end, the bigger consideration may be whether the data\
    \ is located in Java or on the native side.\n\nOverall, these findings show that\
    \ performance of Java is comparable to C’s—after Java warm-up. This opens up a\
    \ lot of options for mixing Java and C.\n\n## 3 Java Parallelism\n\nA compute\
    \ solution running on a multicore machine will want to concurrently utilize multiple\
    \ cores when possible. Java has provided standard language constructs and library\
    \ support for this since Java 1.0. However, the developer trying to implement\
    \ a “simple” parallel for-loop will find that there does not exist a simple syntax\
    \ for doing this in Java like the one that exists in C using OpenMP. OpenMP “extends”\
    \ the C language by utilizing pragma statements that allow OpenMP-aware compilers\
    \ to distribute the for-loop workload among the available cores. The pragma statements\
    \ look like C. Compilers that are not OpenMP capable will compile the for-loop\
    \ normally within a single thread.\n\nThe Java Specification (JSR 166) will simplify\
    \ parallel execution of code blocks in Java 8. The JSR does not address parallel\
    \ loops. Instead it provides changes that allow collections of various sorts to\
    \ parallelize themselves and apply functions to their members.\n\nThe Java 7 developer\
    \ has a few alternatives for parallelism. This study compares the performance\
    \ of three Java 7 alternatives for parallelism. The study also compares the performance\
    \ of two additional third-party, open source alternatives.\n\n### 3.1 Methodology\
    \ for Testing Parallelism\n\nThe concept of a parallel for-loop was to design\
    \ a simple workload to execute in a parallel manner. The goal was to determine\
    \ how efficiently Java can distribute a pure compute workload among the available\
    \ CPU cores. A compute workload that takes a certain amount of time on a single\
    \ core would ideally take one-fourth the amount on four cores. In reality, there\
    \ is a small penalty for time for breaking up a task into multiple independent\
    \ cores. There is also a penalty for waiting for cores to complete and aggregating\
    \ the results. Small workloads may not be worth breaking for this reason. Large\
    \ workloads may approach the ideal gain asymptotically.\n\nA variably sized workload\
    \ was designed so that the time to complete the work with different levels of\
    \ parallel execution could be measured. The work can be performed in-line or divided\
    \ up to four threads on the test system. The workload is shown in Listing 3-1.\
    \ Each test is performed multiple times. Every iteration executes four operations—loop\
    \ increment, loop test, division, and accumulation.\n\n### Listing 3-1. Worker\
    \ Task\n\n```java\nstatic double sumStartLength(int startIndex, int length) {\n\
    \  double cum = 0;\n  final int endIndex = startIndex+length;\n  for (double i\
    \ = startIndex+1; i<=endIndex; i++) {\n    cum += 1.0/i;\n  }\n  return cum;\n\
    }\n```\n\nThe sections below present the results of these tests. On the Linux\
    \ system used in these tests, there appeared to be adverse interactions between\
    \ the application threads, management threads, and the operating system scheduling\
    \ of threads leading to “thread-thrashing” and irregular execution time. 4 to\
    \ 6 provide examples of this.\n\n4 is an example in which, as the workload increases,\
    \ there are “spikes” of poor performance. Figure 3-2 is an example showing overall\
    \ improved performance with additional threads, but an irregular fluctuation in\
    \ the execution time as the workload increases. Finally, Figure 3-3 shows reduced\
    \ execution time for one and two threads as expected but increased execution time\
    \ with three threads. The four-thread line is not better.\n\n## 3.2 Parallelism\
    \ at “Half” Load\n\n### 3.2.1 Parallelism with Timers\n\nThe java.util.Timer and\
    \ java.util.CountDownLatch have been available since Java 1. These are used for\
    \ concurrency. The example in Listing 3-2 shows one way to break up a for-loop\
    \ onto multiple threads using a CountDownLatch to signal when each thread is complete.\n\
    \nThe approach comes down to the details that must be coded. One detail not shown\
    \ in the example is ensuring that the initial count for the CountDownLatch is\
    \ correct even if there are runtime errors that prevent even one of the inner\
    \ Runnable instances from being created.\n\nIn the example, a timer thread is\
    \ used for every fragment of work to be performed. It is not necessary to have\
    \ many timer threads as there are available processors. The Invoking thread will\
    \ be idle while waiting for the worker threads to complete. It should be more\
    \ efficient if the main threads handle the final fragment, avoiding overhead for\
    \ dispatching and waiting on.\n"
  mdcn: "\n\n## 表 2-2. 内存密集测试中的 JVM 开销\n\n| 用例（均使用两个计算线程） | 内存密集测试 | 无内存测试 |\n|---|---|--|\n\
    | 2 核心 | 178 sec. (15%) | 155.79 sec. (0%) |\n| 3 核心 | 155 sec. | 155.70 sec.\
    \ |\n\n## 2.10 单核 Java 性能总结\n\n最初在 C 语言中实现的四种算法已转换为 Java。矩阵乘法包含具有小型计算体和顺序数组索引的嵌套循环。FFT\
    \ 具有中等规模的循环，但数组索引是非顺序的。LFSR 序列需要基于整数的掩码操作和布尔运算。红黑树排序具有高度递归性，并且需要动态对象的创建和清理。\n\n\
    在热身后，Java 矩阵乘法的运行速度比使用 GNU 编译器以最高优化级别编译的 C 版本更快。Java FFT 的性能比 C 慢 20 到 40%。这可能是因为与矩阵乘法相比，数组索引的使用更加复杂且非顺序。Java\
    \ 版本的 LFSR 序列运行比 C 版本快 30%。\n\n前三个测试在计算时不需要内存分配。相比之下，红黑树排序需要大量使用内存分配，为要插入树的键和值分配空间，整个树及其内容都通过触发垃圾回收系统来恢复未使用的内存。在这项测试中，Java\
    \ 在插入方面快一点，但在检索方面比 C 慢。似乎存在对象大小依赖性。随着分配大小的增加，较快的插入速度会退化得更差。\n\nJava 有时快、有时慢的事实表明：\n\
    \n- 硬件架构（如缓存大小、指令流水线深度、浮点与整数逻辑单元的数量和吞吐量）会显著影响这些发现。\n\n- 设计者应该测试内核，以了解什么方案对应用产生最佳性能。另一方面，不应假设\
    \ C 代码总是是最好的。\n\n- 即使重计算是在 C 中完成的，间接计算也可能由 Java 处理。最终，更大的考虑因素可能是数据位于 Java 侧还是原生侧。\n\
    \n总的来说，这些发现表明，在 Java 热身之后，其性能与 C 相当。这为 Java 和 C 的混合使用提供了许多选择。\n\n## 3 Java 并行性\n\
    \n在多核机器上运行的计算方案希望尽可能并发利用多个核心。自 Java 1.0 以来，Java 已经为此提供了标准的语言结构和库支持。然而，尝试实现“简单”并行\
    \ for 循环的开发者会发现，Java 中不存在像 C 语言 OpenMP 那样简单的语法来实现此操作。OpenMP 通过利用 `pragma` 语句“扩展”了\
    \ C 语言，这些语句允许感知 OpenMP 的编译器将 for 循环的负载分配到可用的核心之间。`pragma` 语句看起来像 C 语言。不支持 OpenMP\
    \ 的编译器将在单线程内正常地编译该 for 循环。\n\nJava 规范 (JSR 166) 将简化 Java 8 中代码块的并行执行。JSR 并没有解决并行循环。相反，它提供了更改，允许各种类型的集合实现自并行化并对其成员应用函数。\n\
    \nJava 7 开发者有几种并行的替代方案。本项研究比较了三种 Java 7 并行替代方案的性能。该研究还比较了两个额外的第三方开源替代方案的性能。\n\n\
    ### 3.1 并行性测试方法\n\n并行 for 循环的概念是设计一种以并行方式执行的简单负载。目标是确定 Java 多么高效地将纯计算负载分配到可用的\
    \ CPU 核心之间。在单核心上花费某些时间的计算负载，理想情况下在四个核心上仅需四分之一的时间。实际上，将任务分解为多个独立核心会有很小的时间开销。等待核心完成并汇总结果也有开销。由于这个原因，小型负载可能不值得拆分。大型负载可能会渐近于达到理想增益。\n\
    \n设计了一个可变大小的负载，以便测量不同并行执行级别完成工作的时间。该工作可以在测试系统中内联执行，或分为四个线程。负载如列表 3-1 所示。每个测试执行多次。每次迭代执行四种操作——循环递增、循环测试、除法和累加。\n\
    \n###  3-1. 工作任务\n\n```java\nstatic double sumStartLength(int startIndex, int\
    \ length) {\n  double cum = 0;\n  final int endIndex = startIndex+length;\n  for\
    \ (double i = startIndex+1; i<=endIndex; i++) {\n    cum += 1.0/i;\n  }\n  return\
    \ cum;\n}\n```\n\n下文展示了这些测试的结果。在这些测试中使用的 Linux 系统上，应用程序线程、管理线程和操作系统的线程调度之间似乎存在不利的相互作用，导致了“线程抖动”和不规则的执行时间。4\
    \ 到 6 提供了此类示例。\n\n4 是一个示例，随着负载增加，会出现性能低下的“峰值”。图 3-2 显示了增加额外线程后整体性能的提高，但执行时间随负载增加而出现不规则的波动。最后，图\
    \ 3-3 显示正如预期，一个和两个线程的执行时间减少，但在三个线程时执行时间反而增加。四线程的线并没有更好。\n\n## 3.2 “半”负载下的并行性\n\
    \n### 3.2.1 带有计时器的并行性\n\n`java.util.Timer` 和 `java.util.CountDownLatch` 自 Java\
    \ 1 以来一直可用。它们用于并发。列表 3-2 中的示例展示了使用 `CountDownLatch` 信号每个线程完成，从而将 for 循环拆分为多个线程的一种方法。\n\
    \n这种方法取决于必须编码的细节。示例中未显示的细节是，确保即使发生运行时错误导致甚至一个内部 `Runnable` 实例无法创建，`CountDownLatch`\
    \ 的初始计数也是正确的。\n\n在示例中，每个要执行的工作片段都使用计时器线程。由于有用的处理器，不需要许多计时器线程。调用线程在等待工作线程完成时将处于空闲状态。如果主线程处理最后的片段，将会更高效，从而避免了分发和等待的开销。\n\
    \n"
