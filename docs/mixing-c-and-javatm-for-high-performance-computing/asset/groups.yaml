    ### 图 A-2. Java 与 Scala 矩阵乘法对比


    最后进行的测试是比较 Scala 在 FFT 上的速度与 Java。其中一个 FFT 使用 for-comprehension（for 复合表达式）实现，另一个使用
    while 循环。图 A-3 显示了结果。Scala 的 for-comprehension 迭代执行速度相当较慢，仅为 Java 代码的 13% 到 34%
    之间。除了一个异常点外，Scala 的 while 循环实现在运行速度上与其对应的 Java 版本一致。


    # FFT 速度


    ![](img/81c9dc4f446215f3827ad5c523130d89_123_0.png)


    图 A-3. Java 与 Scala FFT 对比


    基于这些测试，本研究者的观点是：Scala 可以用于性能环境，只要使用 ScalaCL 插件来加速简单的基于整数的 for-comprehension 循环。许多性能代码依赖于现有的库和算法，这些算法根源于带有
    for 循环的老旧 Fortran 代码。手动将这些代码转换为 while 循环将过于负担且容易出错。与 Java 相比，Scala 的简洁性是 JVM 的巨大胜利。


    # 附录 B JPython


    Jython 是一种运行在 Java 虚拟机 (JVM) 上的 Python 实现。Python 自 20 世纪 80 年代一直存在。它在科学计算和性能计算社区非常流行。由于缺乏类型检查，它的语法比
    Java 更简洁。它具有垃圾回收机制。它支持对象；开发者必须管理更多关于子类的机制。它能够轻松地调用外部 C 库，并基于原生库创建语言“扩展”。这使得 Python
    成为一种易于使用的脚本语言，用于绑定和序列化原生函数。


    CPython 是一种解释型 Python，与编译代码相比其速度相对较慢。PyPy 是一个快速的 Python 实现，包含一个即时编译（JIT）编译器，在几次迭代后也会表现出速度加速行为。


    问题出现在 CPython 各版本之间，以及与本报告正文中使用的算法之间的对比。目标是进行定量比较，从而为做出实现权衡的设计师提供潜在帮助。以下是一些“快速”性能调查。


    第一次比较是矩阵乘法测试的性能。Python 开发者通常使用 NumPy 包。NumPy 的大部分工作在原生库中完成，不能作为语言相对性能的合理指标。相反，我们用纯
    Python 实现了本报告正文中用于 C 和 Java 的相同矩阵代码。所有 Python 测试都使用了 Python 的 array 包进行矩阵存储。所有测试在收集时间之前都会先预运行代码。


    结果总结在表 B-1 中，比较了吞吐量比例。原始吞吐量（十亿次浮点运算，giga-flops）如图 B-1 和图 B-2 所示。Jython 在此测试中的吞吐量最慢，约为
    CPython 吞吐量的 70%。PyPy 显著快于 CPython，但比 Java 慢三倍。回想正文，热身后的速度始终比 Oracle Java 7 标准版快一点点。


