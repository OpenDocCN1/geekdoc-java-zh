  - '[PAGE 101]


    This has been a quick overview of these five JVM frameworks. Four of the frameworks,
    JPPF, GridGain, Storm, and Akka the developer from low level message “massaging”
    such as serialization, buffering, and queuing. They also have significant pre-build
    capabilities for load balancing, concurrency, and failure recovery. Those knowledgeable
    with any of these frameworks may feel that these descriptions are too simplistic.
    However, the goal was to guide others who don''t have experience with these frameworks
    and who need an initial impression of what the differences are.


    # 6.4 Framework Performance


    One expects that frameworks with lots of features will not perform as well as
    smaller frameworks with fewer features but where more attention has been given
    to performance. This section investigates framework performance. It measures simple
    metrics—latency and throughput.


    A simple ping-pong test was used to measure latency and throughput. Both a synchronous
    and an asynchronous version of the test were created for each framework. In the
    synchronous test, Node A sends a fixed size to Node B and waits for a response.
    Upon receipt of a message from Node A, Node B returns a message of the same size
    to Node A. This is done repeatedly. In the asynchronous test, Node A sends multiple
    messages to Node B but does not wait for a response.


    The asynchronous test requires data to be queued by the first node because the
    rate at which data is produced is faster than the rate at which it is transmitted.
    Thus, the asynchronous test provides data about queuing and buffering capabilities
    of the framework. MPI and PJ do not provide communications software stack. Therefore,
    the investigator added round-robin queuing and buffering as part of the MPI and
    PJ benchmark code. This was not needed for the other frameworks.


    Each experimental run exchanges a fixed amount of data varying in length from
    approximately 80 bytes to approximately 650 kilobytes. With MPI, the buffer size
    can be controlled because C has direct control over the data being sent. With
    Java, the data is contained in a Java object. The object is shown in Listing-6.
    Serializing a Java object describes metadata to what is being sent so that it
    can be reconstructed on the node. Thus, the byte-count transmitted is greater
    than the size of the user’s data. For the object shown in Listing 6-1 the size
    is 182 bytes of metadata plus 36 bytes for the non-array fields plus the number
    of bytes for the array data. Some of the frameworks use standard Java serialization
    though others have framework-specific serializers. Some of the frameworks allow
    the user to create more efficient serializers. There may be even more overhead
    for a task/job oriented framework such as JPPF the job/task object must be serialized
    in addition to the user data.'
  - "[PAGE 102]\n\n# Listing 6-1. Java Object Used In Ping-Pong Tests\n\n```\npublic\
    \ class RunInfo implements Serializable {\n    private static final long serialVersionUID\
    \ = 9478L;\n    public int jobID;\n    public long creationTimeNanos;\n    public\
    \ long remoteReceiveTimeNanos;\n    public long intervalNanos;\n    public long\
    \ durationNanos; // unused but present\n    public long[] data;\n}\n```\n\nIn\
    \ the benchmarks the message sent from the first node is tagged with the time\
    \ in nanoseconds just before the framework call to send the data. When the second\
    \ node receives the data it adds the time of receipt in nanoseconds to the message\
    \ and returns the same message. Latency can then be determined by comparing the\
    \ two times.\n\nSpecial care was taken regarding the use of the server's clock.\
    \ Nanosecond time on machines is typically relative to start. Millisecond time\
    \ is usually available as an absolute time. The two can be carefully combined\
    \ to get an absolute nanosecond time that can be compared between machines. Also,\
    \ standard clock hardware can significantly drift over the course of minutes.\
    \ Calibration software was developed to measure relative skew as part of each\
    \ test run. The calibration software used the JNodeNodeClockSkew tool that has\
    \ been released⁴ to the public domain. The technique was to resolve server clock\
    \ differences repeatedly on the test hardware to approximately 2 us.\n\nTesting\
    \ was performed on a 4-cluster of Intel Xeon E5620s connected with a 10 Gigabit\
    \ Ethernet switch. A test to measure the \"best\" case latency was performed in\
    \ C and Java. The best Java latency was measured using the JNodeNodeClockSkew\
    \ tool. The best C latency was measured using the same algorithm as used by the\
    \ JNodeNodeClockSkew tool implemented with MPI. Table 6-3 added an additional\
    \ 13 ms latency. Though it might be possible to implement a faster Java test,\
    \ the goal here is to have a reference minimum with which to compare the Java\
    \ grid-framework latencies.\n\n# Table 6-3. Measured Best Case Latency\n\n| Language\
    \ | Latency |\n| --- | --- |\n| Java (TCP sockets) | 33-41 us |\n| C (using MPI)\
    \ | 20-27 us |\n\nFigure 6-2 graphs the one-way latencies for each framework using\
    \ the framework provided/receive APIs. One can see that there is a significant\
    \ amount of Java framework latency above and the best case. Akka introduced the\
    \ smallest latency.\n\n> ⁴ Poor Man’s Timing and Profiling, < http://jtimeprofile.sourceforge.net\
    \ >"
