    Sam Midriff, "Escape Analysis for Java," Proceedings of ACM SIGPLAN OOPSLA Conference,
    November 1, 1999


    > 67 Goetz, Brian, "Java tech and practice: Urban performance legends, revisited,"
    2005, <http://www.ibm.com/developers/java/library/jip09275/index.html>.'
