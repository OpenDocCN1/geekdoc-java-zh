    # ### 3.2.2 Parallelism Utilizing ExecutorService Threads


    Another option for distributing work among multiple cores is to use the java.util.concurrent.ExecutorService.
    By comparison with java.util.Timer the executor service is a little easier to
    use because invokeAll() method provides an easier way to start and wait for all
    tasks to finish. An example is shown in Listing 3-3. There is also the option
    to submit work fragments individually using the submit() method and use CountDownLatch
    to wait for completion. This was tested but found to be slower than using the
    invokeAll() method.'
