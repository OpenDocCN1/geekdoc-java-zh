    ## 7.12 “热身”关键代码路径


    在运行 JIT 编译器优化的 JVM 上的应用程序通常在运行一段时间后会变得更快。满意的迭代次数取决于代码细节，特别是当涉及嵌套循环和多级方法调用时。最好的方法是构造应用程序，允许关键代码路径进行单独热身，然后在经过一定次数的迭代后进行热身。


    这对于“服务器”型应用程序非常有效，这类应用启动并等待外部事件触发处理或响应。这对于那些在应用程序完全“启动”之前需要达到特定吞吐量的应用也是合适的。


    ## 7.13 共享中央处理器核心


    此项调查人员通过惨痛教训了解了满载状态处理器的不可预测性。如果一个应用程序正在运行多个计算密集型线程，很容易对可用核心提出过高要求。在对并行性的一些初始测试中，即使没有以实时优先级运行，四路负载均衡的性能也低于三路负载均衡。最可能的原因不仅是操作系统被饥饿了，垃圾回收器也被饥饿了。


    有两种方法可以采取。一种是刻意在计算密集型任务中添加监控代码，这样如果计算运行时间过长，代码将刻意向其他线程让时间。将整个核心留给操作系统并不能完全解决问题，因为这会导致垃圾回收器在剩余的核心上与计算线程竞争。此外，操作系统很可能需要整个核心的所有算力。这意味着计算密集型线程可能不得不实施第二种方案。


    当然，通常会涉及某种形式的 I/O，且计算密集型任务通常会被 I/O 打断。但值得记住这个问题，因为应用程序经过了插桩以测量执行时间，除非在不同的负载划分替代方案下进行比较，否则开发者可能无法意识到性能比预期的要差。


    ## 8 关于实时 Java 和安全关键型 Java 的说明


    本研究的大部分工作都是在 x86_64 硬件上使用 Oracle Java 7 标准版完成的。不同的 JVM 将具有不同的性能。实时 JVM 实现了 JSR
    1，“Java 实时规范”(RTSJ)⁷⁸。该规范旨在“允许创建、验证、分析、执行和管理 Java 线程，其正确性性条件包括时间性限制（也称为实时线程）”。


    `java.realtime` 包中大约有 70 个对象或接口新增。它们提供了在不受垃圾回收器活动影响的内存范围内分配内存的支持。它们还提供了创建和运行以实时优先级运行线程的机制。这使得编写不被垃圾回收器中断的代码成为可能。此外，虽然标准
    Java 中的计时和调度器实现提供了实时 Java 的“近似”计时，但实时操作系统提供了更精确的计时和调度。


    还有各种 JVM 环境允许对最终的 Java 代码进行精简，以烧录到 ROM 设备。对于这些 JVM，重点在于如何生成可执行镜像，允许应用程序代码和最少量的
    Java 库对象使其能够工作。


    安全关键型 Java⁷⁹ SCJ 是一种“基于 RTSJ (JSR-1) 的 J2ME™ 能力，包含了能够通过认证的安全关键型系统（例如，DO-178B）的器关键型系统所需的最少功能”。服务包括启动、并发、调度、同步、内存管理、定时器管理和中断处理。它采用了一种基于区域的内存分配方案，而不是一个通用堆。区域形成了一个作用域栈，这些区域在超出范围时被创建，并可以程序化地回收。这些区域上没有垃圾回收器运行，减少了抖动。


    某些 SCJ 实现将 Java 转换为 C。这意味着代码无法从 JIT 优化中受益，且运行速度比 Oracle Java 7 标准版慢。RTSJ 和 SC
    JVM 供应商采取的方法各异。本研究未尝试表征此类系统的性能，本调查中使用的基准测试和方法如下：


    > ⁸ 参见 JSR 1，“Java 实时规范”，2006 年 7 月，http://jcp.org/jsr/1

    > ⁷⁹ 参见 JSR 302，“安全关键型 Java”，2011 年 1 月，http://jcp.org/jsr/302


    ## 9 结论


    本研究旨在证明 Java 7 标准在某些计算上与 C 一样快。混合应用程序通常使用 Java 将计算密集型工作卸载到 C。本研究探讨了 Java 框架的性能，还研究了单节点
    Java 的边界。最后，在附录中展示了关于 Scala（一种运行在 JVM 上的现代语言）和 Jython（一种适用于 JVM 脚本的 Python 版本）的数据。


