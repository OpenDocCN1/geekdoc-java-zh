    # ## 4.3 Java Calling Java, C Calling C


    The previous section presented timings for calling from Java to C. The question
    may arise as to how quickly Java can call Java and C can call C. A simple benchmark
    was designed to measure this. The problem with the benchmark was that a Hotspot-based
    Java inline simple method bodies. This makes it difficult to design a simple test
    to compare the two call times. Figure 4-5 shows the results. The figure shows
    that the Java execution time (due to presumed in-lining) is approximately, one-sixth
    of that of C''s. This underscores the value of one Hotspot''s optimizations.'
