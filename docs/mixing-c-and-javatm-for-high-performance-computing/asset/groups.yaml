    \ code is in full control of which arrays are read and written. For Java data,\
    \ the BridJ proxy gives the user control over when to put or get data from the\
    \ native side. HawtJNI has annotations to indicate non-output and non-input.\n\
    \n# Table 4-1. Comparison of Java Native Call Options\n\n| Test Case | Array Data\
    \ is on the Java Side | Array Data is Native | Approach Supports Input-Only Array\
    \ Arguments |\n|---|---|---|---|\n| JNI | ✓ | | ✓ |\n| JNA | ✓ | | ✓ |\n| BridJ-Ja\
    \ (Java arrays) | ✓ | | ✓ |\n| BridJ-Ca (Native arrays) | | ✓ | ✓ |\n| SWIG-Ja\
    \ (Java arrays) | ✓ | | Note 1 |\n| SWIG-Ca (Native arrays) | | ✓ | ✓ |\n| HawtJNI\
    \ | ✓ | | ✓ |\n\nNote 1: SWIG is flexible and could allow hand-implemented input-only\
    \ output arrays. It does not support this \"out-the-box.\"\n\nFigure 4-1 graphs\
    \ the time to call methods with simple integer arguments. The time increases as\
    \ the number of arguments, as expected. The manual JNI implementation is the fastest,\
    \ while JNA implementation is the slowest. The fastest way to invoke methods with\
    \ simple non-array arguments is SWIG. BridJ is very fast with a few arguments\
    \ (four or fewer) but slows down beyond that. BridJ is still under development\
    \ and the developer is planning to extend the performance \"knee\" to sixteen\
    \ arguments. The BridJ build used here was dated July 2012.\n\n![](81cdc4f446215f3827ad5c52310d89_77_0.png)\n\
    \n### Invoking Methods With Simple Arguments\n\nThe next set of timings, in Figure\
    \ 4-2, for calling double array arguments of length 200. These are the methods\
    \ saDouble1() and saDouble2() from Listing 4-2. As expected, the two fastest cases\
    \ are the ones where the data is allocated natively.\n\nWhen the array data is\
    \ on the Java side, BridJ has the fastest invocation times. SWIG is slower because\
    \ it assumes the arrays are input and output. Thus, it converts the data back\
    \ into Java when not needed.\n\nWith array data on the native side, BridJ has\
    \ a slight edge on SWIG in this test. BridJ proxy was specified using getPeer()\
    \ to pass the array’s native address, which is a mechanism similar to the one\
    \ that SWIG uses.\n\nA separate comparison, in Figure 4-3, compares BridJ’s two\
    \ ways of passing arrays. There is a big speed difference between the two approaches\
    \ that may or not be significant depending how much time the body of the method\
    \ takes.\n\n![](81cdc4f446215f3827ad5c52310d89_78_0.png)\n\n### Invoking Methods\
    \ With Read-Only Array Arguments\n\n![](81cdc4f446215f3827ad5c52310d89_78_1.png)\n\
    \n### Comparison of BridJ Options For Passing Native References\n\nThe final set\
    \ of times are shown in Figure 4-4. These times are for the method that copies\
    \ one array to the other and returns the modified array. The times shown include\
    \ both the additional work of copying one array to another and the time to copy\
    \ the data back to Java. Some of the technologies such as JNA do this automatically.\
    \ For others, the copy-back was done by extra code.\n\n![](81cdc4f446215f3827ad5c52310d89_79_0.png)\n\
    \n### Invoking C Method With Returned Array\n\n## 4.3 Java Calling Java, C Calling\
    \ C\n\nThe previous section presented timings for calling from Java to C. The\
    \ question may arise as to how quickly Java can call Java and C call C. A simple\
    \ benchmark was designed to measure this. The problem with the benchmark was that\
    \ Hotspot-based Java inlines simple method bodies. This makes it difficult to\
    \ design a simple test to compare the two call times. Figure 4-5 shows the results.\
    \ The figure shows that the Java execution time (due to presumed inlining) is\
    \ approximately one-sixth of that of C's. This underscores the value of Hotspot's\
    \ optimizations.\n\n> 45 Oracle, The Invocation API <http://docs.oracle.com/javase/6/docs/jni/spec/invocation.html>\n\
    > 46 IBM developerWorks, Java programming with JNI, <http://www.ibm.com/developerworks/java/tutorials/jni/section3.html>\n\
    > 47 C Shim To Java, <http://shimjava.sourceforge.org>\n\nThe fastest way to call\
    \ C from Java is to manually code a JNI proxy class that accepts the Java call\
    \ and mediates the call to the C method. JNA is well known to be slow and the\
    \ findings here confirm that HawtJNI performs better than JNA but not as well\
    \ as BridJ and SWIG.\n\nBridJ and SWIG are the fastest overall. BridJ is faster\
    \ and is platform independent within the platforms supported by BridJ. SWIG is\
    \ slower and more difficult to learn and work with, but yields interfaces that\
    \ can be compiled for any platform that has C. SWIG, however, has great potential\
    \ for customization, which means that with sufficient work it could ultimately\
    \ be faster than BridJ.\n\nIf an application is being developed on a platform\
    \ supported by BridJ, the best strategy may be to generate the BridJ-based glue\
    \ using JNArator. If call times are too slow and if the data (either arrays or\
    \ structs) is native, then the developer can modify the Java proxy to utilize\
    \ BridJ’s @Ptr mechanism.\n\nIf the platform is not supported by BridJ then there\
    \ are two options. If the data is primarily array data, JNI can be used \"by rote\"\
    \ which yields the ultimate in speed. If there are C structures involved, then\
    \ SWIG facilitates working with those.\n"
