    # 1 引言


    ## 1.1 动机与目标受众


    本工作旨在改进高性能计算，特别是针对高性能嵌入式计算（HPEC）应用。HPEC 的涵盖范围从较小的只读存储器（ROM）设备到较大的多板、基于磁盘系统。


    HPEC 软件不仅包括计算需求，还包括管理、通信、作业调度、故障检测和日志记录。开发需要管理尺寸、重量和功耗。在过去，限制因素往往决定了专用逻辑和可编程处理器之间的选择。


    随着处理器随时间缩小且商品化处理器中出现了更多的核心，处理能力相对于这些限制有了显著提高，导致了远离专用逻辑和特殊处理器的趋势。随着硬件和平台运行时更新，软件通常会被丢弃并重新实现。Java
    框架支持平台迁移。存在许多商业和开源 Java 框架，为多处理器基础设施需求提供了硬件无关的现有解决方案。Java 在减少缺陷、增强代码安全等方面的潜力不容忽视。此外，还有大量的
    Java 开发人员人才可以利用。


    在混合 Java 和 C 时，设计工程师希望根据对这些权衡性能影响的初始定量预期做出决策。本报告试图通过不同的方式测试基于 Oracle HotSpot 的
    Java 并与等效 C 进行比较，来量化这些预期。本报告还记录了有助于良好性能的编码模式。


