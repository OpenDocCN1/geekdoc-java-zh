    the effective GPU throughput for most data sizes between 64 and 524,288.


    Regarding invoking native libraries, the investigations showed that when native
    data is used SWIG and Bridj can perform comparably to hand JNI (which is the low
    level Java call mechanism). Bridj, which is supported on many platforms, makes
    it very easy to locate and manage the native data. This includes garbage collection
    of the native data when it is no longer referenced by the Java code. SWIG is powerful
    but has more complexity and requires more learning. However, if the target platform
    is not one of the supported ones, SWIG may be then the best choice.


    Five computer-grid frameworks, ³¹¹ JPPF, GridGain, Storm, and Akka, were tested
    on a 10-gigabyte Ethernet cluster. Collectively the frameworks offer such as auto-discovery,
    auto-failover, inter-node data synchronization, data serialization, multi-node
    queuing, active monitoring and load balancing which can save significant developer
    time. They were compared with each other and to MPI, which is the benchmark for
    performance computing.


    With greater flexibility and features, the more sophisticated frameworks were
    not expected to perform as well as MPI. Only MPI and low-level Java I/O could
    handle small data sizes at rates of 10,000 synchronous round-trip exchanges per
    second. On the other hand Akka and Storm achieved 10,000 asynchronous round-trip
    exchanges per second. For many applications with lower requirements, other frameworks,
    such as GridGain and JPPF, could be used as well. Even a C framework offering
    enhanced flexibility and features would be expected to have poorer performance
    than MPI.


    Two investigations were conducted and presented in the appendices. One looked
    at Scala because some have thought it might be a successor to Java. It is potentially
    attractive for embedded high performance computing because it is more concise
    but only if it retains Java''s throughput. On matrix-multiply and FFTs the investigation
    found that for-loops need to be implemented as while-loops because of increased
    overhead in Scala''s for-based looping statements.


    The second language investigation presented in the appendices is use of Python
    for scripting. Python was found to have more performance comparable to CPython
    than Java or C. It was faster to call out native libraries than CPython though
    slower at numerical computation. PyPy, a faster implementation of Python was found
    to be slower than Java by a factor of two for matrix multiplication.


    Java, and the JVM, can be part of the performance tool chest for applications
    that run long enough to allow Java 7 Hotspot warmup optimizations to “kick in”.
    Dynamic memory allocation should be minimized by preallocating working storage.
    Other practices for good performance were also discussed in the body of this study.


    A crafted mix of Java and C can exploit the productivity and code safety of Java
    as well as the speed of C to build solutions that perform well and make use of
    increasingly scarce developer dollars and available Java-talent. It is hoped that
    the developer will find this report and its findings helpful in making quantitative
    trade-offs leading to good, hybrid applications.'
