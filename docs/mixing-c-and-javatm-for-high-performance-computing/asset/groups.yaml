    # #3 Java Parallelism


    A compute solution running on a multicore machine will want to concurrently utilize
    multiple cores when possible. Java has provided standard language constructs and
    library support for this since Java 1.0. However, the developer trying to implement
    a “simple” parallel for-loop will find that there does not exist a simple syntax
    for doing this in Java like the one that exists in C using OpenMPTMPM²². OpenMP
    “extends” the C language by utilizing pragma statements that allow OpenMP-aware
    compilers to distribute the for-loop workload among the available cores. The pragma
    statements look like C. Compilers that are not OpenMP capable will compile the
    for-loop normally within a single thread.


    The Java Specification (JSR 166 ³) will simplify parallel execution of code blocks
    in Java 8. The JSR does not address parallel loops. Instead it provides changes
    that allow collections of various sorts to parallelize themselves and apply functions
    to their members.


    The Java 7 developer has a few alternatives for parallelism. This study compares
    the performance of three Java 7 alternatives for parallelism. The study also compares
    the performance of two additional third-party, open source alternatives.


    # ##3.1 Methodology for Testing Parallelism


    The concept of a parallel for-loop was to design a simple workload to execute
    in a parallel manner. The goal was to determine how efficiently Java can distribute
    a pure compute workload among the available CPU cores. A compute workload that
    takes a certain amount of time on a single core would ideally take one-fourth
    the amount on four cores. In reality, there is a small penalty for time for breaking
    up a task into multiple independent cores. There is also a penalty for waiting
    for cores to complete and aggregating the results. Small workloads may not be
    worth breaking for this reason. Large workloads may approach the ideal gain asymptotically.


    A variably sized workload was designed so that the time to complete the work with
    different levels of parallel execution could be measured. The work can be performed
    in-line or divided up to four threads on the test system. The workload is shown
    in Listing 3-1. Each test is performed multiple times. Every iteration executes
    four operations—loop increment, loop test, division, and accumulation.'
