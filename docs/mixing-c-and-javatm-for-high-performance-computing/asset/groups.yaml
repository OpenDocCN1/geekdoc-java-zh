    GPU 吞吐量的百分比下降是因为内核设置和队列过程是与 GPU 执行并行进行的。在 64 到 524,288 之间的多数数据规模下，有效 GPU 吞吐量的差异不超过
    2%。


    关于调用原生库，研究表明，当使用原生数据时，SWIG 和 Bridj 的性能可以与手写的 JNI（一种底层 Java 调用机制）相当。Bridj 支持许多平台，使得定位和管理原生数据变得非常容易。这包括在
    Java 代码不再引用原生数据时对原生数据进行垃圾回收。SWIG 功能很强大，但复杂性更高，且需要更多学习。然而，如果目标平台不在支持的平台列表中，SWIG
    可能是最佳选择。


    在 10GbE 以太网集群上测试了五个计算机网框架：³¹¹ JPPF、GridGain、Storm 和 Akka。这些框架共同提供了如自动发现、自动故障转移、节点间数据同步、数据序列化、多节点队列、活动监控和负载均衡等功能，可以节省大量的开发时间。它们之间进行了相互比较，并与
    MPI（性能计算的基准）进行了比较。


    由于更强的灵活性和特性，更复杂的框架预计性能并不会像 MPI 那么。只有 MPI 和低级 Java I/O 能以每秒 10,000 次同步往返交换的速度处理小规模数据。另一方面，Akka
    和 Storm 实现了每秒 10,000 次异步往返交换。对于许多需求较低的应用，也可以使用其他框架，如 GridGain 和 JPPF。即使是提供增强灵活性特性的
    C 框架，其性能预计也会比 MPI 差。


    进行了两项调查并列在附录中。一项研究了 Scala，因为一些人认为它可能是 Java 的继任者。它对于嵌入式高性能计算具有潜在的吸引力，因为它更简洁，但前提是它必须保持
    Java 的吞吐量。在矩阵乘法和 FFT 上，研究发现由于 Scala 的基于 `for` 的循环语句开销增加，`for` 循环需要实现为 `while`
    循环。


    附录中介绍的第二项语言调查是使用 Python 进行脚本编写。发现 Python 的性能比 Java 或 C 更接近 CPython。它调用原生库的速度比
    CPython 快，但在数值计算上较慢。PyPy（一种更快的 Python 实现）被发现矩阵乘法速度比 Java 慢一倍。


    Java 和 JVM 可以作为性能工具箱的一部分，用于运行时间足够长、足以让 Java 7 Hotspot 热身优化“起作用”的应用。应通过预分配工作存储空间尽量减少动态内存分配。本文正文还讨论了实现良好性能的其他实践。


    Java 和 C 的巧妙结合可以利用 Java 的高效率和代码安全性以及 C 的速度，来构建性能良好的解决方案，并利用日益稀缺的开发者成本和现有的 Java
    人才。希望开发者能发现本报告及其发现对于进行量化权衡有所帮助，从而开发出良好的混合应用程序。


    此处开发的基准测试已作为开源项目发布在 http://jcompmarks.sourceforge.net。性能的系统分析需要易于使用的代码段计时工具和简单统计数据的积累工具。这里为
    C、Java 和 Python 开发的计时工具具有相似的 API，并在这些研究中证明了无价之。它们已发布在 http://jtimeandprofile.sourceforge.net。最后，一个便于从
    C 调用 Java 的工具已发布在 http://cshimtojava.sourceforge.net。


    # 附录 A Scala


    Scala 是一种在 2003 年发布的相对新的语言。它可以在 Java 虚拟机（JVM）上运行，尽管它具有更强大、更简洁的语法。它保留了对象设计，并将函数式编程世界的许多强大特性引入来与对象设计共存。它具有严格的类型检查，但不需要让
    Java 感到“臃肿”的许多类型声明。由于它运行在 JVM 上且非常简洁，关于它是否能保留足够的性能以成为高性能工具箱中极具吸引力的补充，这是一个值得的问题。


    Scala 可以在 JVM 上运行并轻松地使用 Java 库。在让应用程序内部轻松混合 Java 和 Scala 集合类型及迭代器方面做了大量工作。Scala
    拥有力量、灵活性以及定义类型感知操作符的能力，这些操作类似于运算符重载。Scala 的强大是以语言复杂性增加为代价的，这需要比人们预期的更多的学习。


    然而，Scala 也很简洁且没有牺牲强类型检查。研究人员对 Scala 的经验表明，相同的 Java 函数用大约四分之三的代码量即可编写。


    对 Scala 的第一次实验是实现了第 2.8 节描述的红黑树插入测试。在 Scala 中，一切都可以被视为对象，包括数字。本报告中使用的红黑树算法基于泛型对象，使得翻译到
    Scala 非常容易。但该语言还有一项规定，如果为原始类型实例化特定的类而不是对象，就可以生成专门/更快的代码。这创建了泛型类（如红黑树）的多个版本，但应该提供更好的性能。因此，Scala
    的红黑树测试分为两种方式：特化和非特化。


    图 A-1 比较了 Java 的四字节内容插入和测试与 Scala 版本，以及在红黑树键和红黑节点键上带有 `@specialized` 注解的 Scala
    版本。未特化的 Scala 实现比 Java 版本慢一点，尽管仍比本报告早些记录的 C 版本快。特化版本比 Java 版本稍好一点。


    # Java 和 Scala 在红黑测试上的对比


    ![](img/81c9dc4f446215f3827ad5c523130d9_121_0.png)


    图 A-1. Java 和 Scala 红黑树插入和获取性能


    矩阵乘法需要三层嵌套循环。这使得理解 Scala 循环性能成为一个很好的测试。Scala 的 `for` 导式也是高阶方法的“语法糖”。`for` 导式是一种通用结构，可以用于对各种类型进行迭代，还可以包含对迭代类型进行过滤。这导致一系列复杂操作具有非常紧凑的语法，但缺点是简单的基于整数的顺序迭代不像字节码循环那样简单。


    关于此问题有许多讨论¹。截至 Scala 2.10.2，编译器对于整数循环仍生成较慢的 `for` 导式代码。然而，有一个针对 Scala 2.11 的 Scala
    编译器新增将实现所需的优化。²


    图 A-2 比较了正文中描述的 Java 矩阵乘法测试与其 Scala 对应版本。分别使用 `for` 导式和将循环转换为 `while` 循环进行了测试。对于
    Scala，“for` 导式在 N < 18 时性能很差。另一方面，基于 `while` 循环的 Scala 实现性能与 Java 实现几乎相同。


    ¹参见许多讨论中的两个：http://stackoverflow.com/questions/61461822/how-to-optimize-for-comprehensions-and-loopsloops-in-scala
    和 https://groups.google.com/forum/#topic/scala-user/hq20XLvRjg。


    ² 参见票据：http://issues.scala-lang.org/browse/SI-1338.


