    # 混合 C 和 Java™ 进行高性能计算


    本报告中包含的观点、意见和/或发现属于 MITRE 公司，除非另有文档说明，否则不应被解释为政府的官方立场、政策或决策。


    批准公开发布；分发不受限制：13-5234


    ©2013 MITRE 公司。保留所有权利。


    Nazario Irizarry, Jr.


    2013年9月


    马萨诸塞州，贝德福德


    ## 摘要


    性能计算计算软件，尤其是高性能嵌入式计算（HPEC）软件，通常使用 C 语言开发，用于数据处理以及基础设施功能。基础设施包括通信、处理器/核心分配、任务管理、作业调度、故障检测、故障处理和日志记录。使用
    C 语言和优化的汇编语言是为了在尺寸、重量和功耗的限制下实现最高性能。目前存在一种从专用逻辑和特殊处理器转向基于通用型处理器的趋势。因此，现在可以实现更健壮的软件方案。这些功能中的许多可以快速实现，并利用
    Java 框架（某些人对 Oracle 的性能表示怀疑）。Java 框架具有开源和厂商支持，且 Java 的平台独立性减少了随着硬件和操作系统演进而重新开发功能的需求。


    测试表明，对于某些问题，如果谨慎使用对象创建且应用程序能够承受短暂的启动和预热时间，Java™ 标准版（在 Intel 处理器上）的性能可以达到 C 语言的水平。Java
    可以快速调用原生库。通过一些可用的桥接技术，它可以原生分配数据并将其垃圾回收机制扩展到这些数据上。尽管调用图形处理单元时存在一些 Java 开销，但测试显示，当数据以原生方式分配时，利用图形处理单元（GPU）的速度与原生
    C 相同的效果良好。


    Java 计算网格框架提供了自动发现、自动故障转移、节点间数据同步、自动数据序列化、多节点工作队列、活动负载监控、自适应负载均衡和动态网格缩放等功能，如果需要这些功能，可以节省大量的开发时间。GridGain
    易设置，并且在工作分配和处理节点故障方面有许多选项。Akka 和 Storm 的性能相对于高性能社区的消息传递接口（MPI）表现良好，尽管由于 MPI 框架与
    Java 框架功能之间存在显著差异，这种比较是不公平的。在 10 千比特以太网集群上，Akka 和 Storm 每秒实现了 10,000 次异步往返交换，对于应用程序来说完全足够。


    简要调查了 Scala 和 Python，以了解它们相互以及相对于 Java 的性能。Scala 较新、更简洁，性能与 Java 平等。Python 较旧，性能较差，但具有广泛的原生库支持和简洁的语法。


    混合 Java/C 应用是有意义的，并且执行良好。这为复杂的高性能应用开启了大门，在这些应用中，通过 Java 的开发者效率可以与 C 和原生自定义库所实现的最终计算速度进行权衡。


    ## 执行摘要


    性能计算软件（尤其是高性能嵌入式计算（HPEC）软件）的开发者编写代码不仅是为了计算处理，还为了管理和基础设施任务，如通信、处理器/核心分配、任务管理、作业调度、故障检测、故障处理和日志记录。HPEC
    软件开发需要大量的软件开发，以相对于尺寸、重量和功耗的限制获得最高性能。过去，由于处理器特征随时间的推移而缩小，HPEC 处理器中出现了额外的处理器核心，这些限制驱动了在专用逻辑和可编程处理器之间的选择，处理能力相对于这些限制有了显著提高——这导致了从专用逻辑和特殊可编程处理器转向基于通用型处理器的趋势。随着传感器平台硬件和运行时执行器的更新，此类软件通常会被丢弃、重新设计并重新实现。由于这种额外的能力，现在可以为
    HPEC 启用更健壮的软件方案——范围从功能更全的操作系统到支持在多个硬件和操作系统平台之间移植的 Java™ 框架。利用 Java 框架将减少冗余和重新实现。


    测试表明，对于某些问题，如果谨慎使用对象创建且应用程序能够承受短暂的启动和预热时间，Java™ 标准版（在 Intel 处理器上）的性能可以达到 C 语言的水平。Java
    可以快速调用原生库。通过一些可用的桥接技术，它可以原生分配数据并将其垃圾回收机制扩展到这些数据上。尽管调用图形处理单元时存在一些 Java 开销，但测试显示，当数据以原生方式分配时，利用图形处理单元（GPU）的速度与原生
