    • Implements an object-oriented abstraction of OpenCL that may simplify usage
    for developers not already familiar with OpenCL. Kernels are invoked via the com.jogamp.opencl.CLCommandQueue
    class using methods that are named a little different than in OpenCL.

    • Checks OpenCL return error codes. Invokes a com.jogamp.opencl.CLError that is
    coded and registered at run time by the developer.

    • Has a parameterized command, com.jogamp.opencl.CLBuffer object that represents
    an OpenCL.cl_mem buffer. A CLBuffer can be based on any of the java.nio buffer
    types, ByteBuffer, DoubleBuffer, etc. The CLBuffer can move data from indirect
    NIO buffers to the native side. It can also use direct NIO buffers. The CLBuffer
    can be released but does not result in immediately freeing the associated native
