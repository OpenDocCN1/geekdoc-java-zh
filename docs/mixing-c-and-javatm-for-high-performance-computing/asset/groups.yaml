    #  2.10 Summary of Java On a Single Core


    Four types of algorithms that were initially implemented in C were converted to
    Java. The matrix multiplication has nested loops with small compute bodies and
    sequential array indices. The FFT has medium sized loops, but non-sequential array
    indices. The LFSR sequence requires integer-based masking and Boolean operations.
    The red-black tree sorting is highly recursive and requires dynamic object creation
    and cleanup.


    Once warmed, the Java matrix multiplication ran a faster than the C version that
    was compiled with a GNU compiler at its highest level of optimization. The Java
    FFT performance was 20 to 40 percent slower than Cs. This may be due to the more
    complex and non-sequential use of array indices as compared with the matrix multiplication.
    The Java version of the LFSR sequence ran 30 percent faster than the C version.


    The first three tests required no memory allocation for computation. In contrast,
    the red-black tree-sorting required heavy use of memory allocation to allocate
    space for keys and values to be inserted into the tree, the entire tree and its
    contents are disposed of by triggering the garbage collection system to recover
    unused memory. In this test, Java was a little faster for insertion and a slower
    than C for retrieval. There also seemed to be object-size dependence. The faster
    insertion speed degraded to poorer as the allocation size increased.


    The fact that sometimes the Java is faster and sometimes slower suggests that:


    +   - Hardware architecture, such as cache size, instruction pipeline depths,
    number and throughput of floating point versus integer logic units can significantly
    impact these findings.


    +   - The designer should test the kernels to know what yields the best performance
    for the application. On the other hand, it should not be assumed that C code will
    always be the best.


    +   - Even if the heavy computation is done in C, incidental computation might
    be handled by Java. In the end, the bigger consideration may be whether the data
    is located in Java or on the native side.


    Overall, these findings show that performance of Java is comparable to C’s—after
    Java warm-up. This opens up a lot of options for mixing Java and C.'
