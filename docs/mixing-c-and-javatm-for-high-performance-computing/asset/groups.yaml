    ## Java、图形处理器与 OpenCL™


    GPU 为许多类型的计算提供了显著的加速优势。OpenCL 提供了一种通用的编程方法，可以在各种硬件和操作系统平台上为各种厂商的 GPU 编写程序。API
    1.0、1.1 和 1.2 版本的规范可以在 Kronos Group 网站上找到。GPU 的性能和可用性表明，GPU 不再是一个可选项，而是高性能计算工具箱中关键组成部分。


    OpenCL 不是使用 GPU 的唯一方法，但它是关键方法之一。读者可能对研究 Aparapi 和 Roobert 等项目感兴趣，它们简化或消除了显式 GPU
    内核的创建和调用。这些项目在研究中未经过测试或评估。本研究基于更现代的 OpenCL 使用方法。


    有多个库提供了对 OpenCL 的访问。某些库实现了 OpenCL API，让开发者自己处理内存指针细节。另一些则提供了更高的抽象和安全性。表 5-1 和表
    5-2 识别了四种 Java 替代方案。表格提供了每种替代方案关键方面的简要摘要。


    一些替代方案使用 Java .nio (NIO) 数据缓冲区来原生持有用于 OpenCV 内核的数组数据。NIO 在内存分配后不提供释放内存的方法。NIO
    缓冲区的设计使得当不再有引用指向它们时，垃圾回收器最终可以回收内存。然而，由于收集器需要等待堆（Heap）大部分满，且原生缓冲区内存不在堆上，因此垃圾回收器回收未引用的
    NIO 缓冲区可能需要一段时间。


    似乎有通过直接调用非公共 Java 类来绕过 NIO 缓冲区的方法。这些方法在所有 Java 实现上可能无效。如果 NIO 缓冲区存储是数组数据的唯一选择，那么最佳方法是分配一次所需的缓冲区，然后在应用程序生命周期内重用它们。这对于减少内存碎片和最小化垃圾回收器工作来说是一个好主意。


