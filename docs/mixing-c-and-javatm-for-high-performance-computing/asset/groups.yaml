    # 8 A Note on Real-Time Java and Safety-Critical Java


    Most of the work in this study was done using Oracle Java 7 Standard Edition on
    x86_64 hardware. Different JVMs will have different performance. Real-time JVMs
    implement JSR 1, "Real-time Specification for Java" (RTSJ)\78. The specification
    was designed to "enable the creation, verification, analysis, execution, and management
    of Java threads whose correctness conditions include timeliness constraints (also
    known as real-time threads).


    There are approximately 70 objects or interface additions within the java.realtime
    package. They provide support for allocating memory in memory scopes that are
    not subject to garbage collector activity. They also provide mechanisms for creating
    and running threads that run at real-time priorities. This makes it possible to
    write code that is not interrupted by the garbage collector. Furthermore, while
    timer and scheduler implementation in standard Java provide "approximate" timings
    of real-time Java, real-time operating systems provide more precise timing and
    scheduling.


    There are also various JVM environments that allow the final Java code to be streamlined
    for burning into ROM devices. For those JVMs, there is a focus on how to generate
    executable images that the application code and the minimum amount of Java library
    objects allow it to work.


    Safety-critical Java\79 SCJ is a "J2ME™ capability, based on the RTSJ (JSR-1),
    containing minimal features necessary for safety-critical systems capable of certification,
    e.g., DO-178B.\ Services include start-up, concurrency, scheduling, synchronization,
    memory management, timer management, and interrupt processing. It has a region-based
    memory allocation scheme instead of one general heap. Regions form a stack of
    scopes that are created and can be reclaimed programmatically when they fall out
    of scope. There is no garbage collector operating on these regions, reduced jitter.


    Some of the SCJ implementations convert Java to C. This means the code cannot
    benefit from JIT optimizations and also run slower than Oracle Java 7, Standard
    Edition. The approach taken by vendors of RTSJ and SC JVMs will vary. This study
    did not attempt to characterize the performance of such systems, the benchmarks
    and approaches used in this investigation help characterize such platforms.


    > 78 See JSR 1: Real-time Specification for Java," July 2006, <http://jcp.org/en/jsr/detail?id=1>

    79 See JSR 302: Safety Critical Java™, January 2011, <http://jcp.org/en/jsr/detail?id=302>'
