    计算网框架，以了解它们提供的功能以及人们可能获得何种性能。


    本报告的目的并不是取代 C 语言，而是为了解决“Java 运行缓慢”这一仍然存在的观念。通过 Java、C 和原生库的巧妙结合，可以利用 Java 的高效率和代码安全性以及
    C 的速度，构建出性能良好的解决方案，并有效利用日益稀缺的开发资金和现有的 Java 人才。


    ## 1.2 关于高性能嵌入式计算系统


    嵌入式系统的特点是仅运行设计时已知的少数应用程序——即开箱式生产产品。作为生产系统，它们重复运行经过认证的应用程序，且终端用户被允许重新编程或更改它们。它们具有固定的运行时需求，或者至少在输入速率、处理负载和输出速率方面有定义的边界。它们被称为“嵌入式”，是因为它们与大型系统或传感器共存，或作为其的一部分。嵌入式系统可以很小（例如手机），也可以由多个机架的多个处理器节点组成。本研究更多关注中等规模的系统。


    ## 1.3 为什么选择 Java？


    Java 由 Sun 微系统（现 Oracle）于 20 世纪 90 年代初设计，旨在为相互连接的小型嵌入式设备开发软件。1995 年 Java 正式发布，迅速吸引了开发者社区的关注。与
    C 语言相比，Java 提供了：


    -   相似的控制流语法

    -   具有自动垃圾回收的无内存内存管理，以及防止缓冲区溢出的安全保障

    -   一种对象结构。社区已接受对象是处理复杂数据结构和大型模块化软件设计的关键

    -   内置的线程模型，以及用于跨线程同步和锁的语言结构

    -   对网络通信和数据结构序列化的标准支持，且独立于处理程序和操作系统

    -   数值类型的标准长度

    -   包、类、文件、变量的命名规范，这些规范已被开发者社区广泛接受并通俗实现

    -   一种独立于处理器和操作系统的字节码格式，便于代码在开发、测试、部署以及分布式系统（包括异构计算系统）之间的构建、部署和移动迁移

    -   提供多种开发工具（包括免费工具）


    最后一点为某些项目带来了益处，因为开发者在大部分开发时间内不需要在精确的目标硬件上进行操作。HPEC 硬件通常可以根据外形和功率需求进行定制。在几乎任何机器上开发和测试代码的能力，可以使许多项目从特殊配置系统带来的瓶颈中解放出来。


    ## 1.4 为什么不选择 Java？


    由于报告正文中讨论的原因，Java 程序的启动速度可能比其他语言慢。另一方面，高性能代码通常是长时间运行的。运行时间越长，启动时间的影响就越小。


    Java 会导致执行时间可变。实时 Java 系统的供应商提供了 Java 编译器和运行时来解决这个问题。典型的桌面级 Java（可能是用于开发的）可能有可变的执行时间，但目标运行环境可以具有更可预测的执行时间。然而，作者的经验是，某些实时
    Java 系统可以实现显著的可预测性，但这是以整体速度为代价的。


    Java 比 C 语言更简洁，很大程度上是因为没有 C 包含文件（这些文件通常用于定义结构体和方法签名）。Java 比 Ruby、Python 和 Scala
    等语言没那么简洁。MATLAB¹ 等语言在处理许多类型的数值计算时更为简洁。


    简洁性是理想的，但代码安全与这些之间往往是相互矛盾的。至少有一种语言² 显示，代码中的缺陷率更多地取决于个人程序员编写的代码行数，而不是取决于语言本身。作者对
    Scala 的经验表明，相同的函数可以用四之三代码量编写出来。在一次实验³中，Ruby 也需要大约四之三的代码，而 Python 所需的代码量约为一半。


    ## 1.5 研究目标


    本研究并不是对语言或框架的全面比较。重点在于展示 Java（以及更广泛的 Java 虚拟机 (JVM)）在性能处理中可以发挥良好作用。目标是通过量化不同类型代码的性能来理解其优劣。通过定量的理解，开发者可以更好地做出更好的工程权衡，决定如何混合
    Java 和 C。下一节开始分析 Java 在不同算法上的性能。


