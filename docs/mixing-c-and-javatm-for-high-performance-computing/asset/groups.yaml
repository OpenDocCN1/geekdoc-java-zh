    support; the developer has to manage more of the mechanics of subclassing. It
    makes it easy to call external C libraries and create language "extensions" based
    on native libraries. This makes Python an easy-to-use as a scripting language
    for binding and sequencing native functions.


    CPython is an interpreted Python that is relatively slow compared to compiled
    code. PyPy is a fast implementation of Python that includes a just-in-time (JIT)
    compiler that also exhibits speedup behavior after a few iterations.


    The question arose as to some the the versions of CPython compared to each other
    and to the algorithms used in the body of this report. The goal was for quantitative
    comparisons that would be of potential benefit to the designer making implementation
    trade-offs. The following are some "quick" performance investigations.


    The first comparison is performance on the matrix-multiply test. Python developers
    typically use the NumPy package. NumPy does much of the work in native libraries
    and would not be a reasonable indication of relative language performance. Instead,
    the implemented the same matrix code used in the body of this report for C and
    Java in pure Python. Python''s array package was used for matrix storage on all
    the Python tests. All the tests first pre-exercise the code before collecting
    timings.


    The results are summarized in Table B-1, that compares throughput ratios. The
    raw throughputs, in giga-flops, are shown in Figure B-1 and Figure B-2. Jython
    exhibited the slowest throughput on this test with about 70 percent of CPython''s
    throughput. PyPy was significantly faster than CPython but slower than Java by
    a factor of three. Recall from the body of this report that warmed was consistently
    a little faster than C Oracle Java 7 Standard Edition.


