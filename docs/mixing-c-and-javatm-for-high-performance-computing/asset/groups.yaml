    | Feature | MPI | PJ | JPPF | GridGain | Storm | Akka |

    |---|---|---|---|---|---|-|

    | Version Used | OpenMPI 1.6.4 | 20120620 | 3.3.4 | 4.3.1e | 0.8.2 | 2.1.2 |

    | Architecture | Fixed peers; Fixed grid | Master/slave; Fixed grid | Master/slave;
    Dynamic topology | Dynamic number of node peers | Dynamic number of node peers
    | Dynamic number of node peers |

    | Distribution model | Message passing | Message passing | Job/task submission
    | Task/job submission; Distributed remote function and method invocation | Data
    tuples w/ implicit targets | Actor w/ explicit message targets |

    | Starts OS processes for “workers” | Yes | Yes | No | No | Yes | No |

    | Load balancing | No | No | Yes | Yes | Message “striping” | Yes |

    | Recovery from node failure | No | No | Yes | Yes | Yes | Yes |

    | Inter-node communication | TCP/IP*; RDMA; Other | TCP/IP; UDP/IP | TCP/IP; UDP/IP
    | TCP/IP; UDP/IP | ZeroMQ⁶² | TCP/IP; ZeroMQ possible |

