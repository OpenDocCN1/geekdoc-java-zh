    \n图 3-11. 使用 ForkJoinPool 的并发执行抖动\n\n### 3.2.4 使用 Parallel Java 库的并行化\n\nParallel\
    \ Java (PJ) 库是为单节点或多节点并行编程开发的全 Java 库。PJ 由罗彻斯特理工学院的 Alan Kaminsky 和 Luke McComber\
