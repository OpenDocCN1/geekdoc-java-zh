    as each new major version (such as Java 7) is released. Of course, the best way
    to reduce collector impact is to avoid creating garbage when possible.


    In a Java application that does not have a graphical interface, the application(s)
    and the JVM garbage collector are the biggest users of processor time. There are
    other JVM threads that consume little time. If there are sufficient CPU cores
    then much of the garbage collector''s work will not interfere with the work of
    the main threads. If one measures the performance of the main thread(s), one does
    not get a true measurement of the overhead.


    This study measures allocation time as the percentage in increased time to complete
    a compute workload. In the tests developed here, the number of threads used to
    perform the Java work is a command line parameter. The number of cores used by
    the Java application can also be limited at runtime by using Linux’s “taskset”
    command.


    Performance was measured for a no-memory allocation case and for a “heavy” memory
    allocation/deallocation case. The no-memory allocation test performed 120,000
    iterations of 8192-point FFT using pure-Java FFTs used in other tests. The heavy
    memory allocation performed 400 iterations of the red-black tree insertion test.
