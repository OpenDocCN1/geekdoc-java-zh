    测试结果如图 B-6 所示。对于少数参数，可以说时间处于同一“量级”。然而，随着参数数量的增加，这种不成比例的差异越来越大。原因可能是因为在 CPython
    中，每个整数（或地址）都是直接传递的，不需要回调。


    对于许多应用程序来说，时间差异是不显著的。通过与 CPython 调用 CPython 以及 Jython 调用 Jython 的时间进行对比，将这些调用情况视角化可能会有所帮助。


