  mdcn: '

    百分比影响。请注意，不同的 JVM 会产生不同的开销。开发者应该对目标平台进行测量。


    在混合应用中，Java 可用于通信、处理器/核心分配、任务管理、工作排序、故障检测、故障处理和日志记录。从 Java 调用原生计算是关键。使用低级的 Java
    Native Interface (JNI) 是实现这一目标最快、但也是最繁琐且容易出错的方法。Java Native Access (JNA) 既易于使用又与平台无关。如果需要调用，开销为每秒几百微秒。如果每秒需要调用几十或数千次，BridgJ
    和简化封装器与接口生成器（SWIG）可能是更好的选择。在研究者的观点中，BridgJ 更加易于使用，并且可以在硬件和操作系统平台上在不依赖外部原生库的情况下使用。SWIG
    则需要更多工作量，因为它会生成 C 代码，以便基于 SWIG 的原生库能够针对任何目标进行编译。


    在计算并发性方面，Java 并没有用于并发循环的语法。在四核机器上对各种工作负载进行测试显示，最好的并行并发技术比 C 语言的性能低 4% 到 5%。最快的
    Java 并发机制并不是 Java 7 标准内置的。第三方库 Juvenile 和 Parallel Java 在所使用的纯计算测试中具有最好的并发性性能。这并没有削减内置并发机制的价值。它们具有用于调度、周期性、延迟和递归任务的功能，这些对于许多类型的任务是必不可少的。测试还显示，在
    Linux 上添加更多处理器核心而没有缩短总时间会导致性能会出现不稳定的情况。然而，通过使用 Linux 轮询调度缓解了这一问题。


    可以从 Java 有效地注入 GPU。研究的方法利用了一个 Java 库，该库调用 GPU 底层的 OpenCL 接口。因此，Java 应用永远不会比直接利用
    OpenCL 接口的 C 应用快。然而，目标是在这种限制下获得所需的性能。


    用于 OpenCL 的 Java 库只有几个。这里使用了 JavaCL。它是由开发上述提到的 BridgJ 用的同一位开源开发者开发的。使用最初由 Apple
    开发的 GPU 优化内核表明，Java 在设置和调用内核上比 C 语言慢了约 2 微秒。C 代码需要大约 9 毫秒。然而，由于 GPU 计算与内核并行进行，对
    GPU 吞吐量的净影响通常小于 2%。但有了这类设置时间，每秒超过数千次的 GPU 交互是合理的答案。


    在 10 千比特以太网集群上测试了五个计算网框架：Parallel Java、Java Parallel Processing Framework、GridGain、Storm
    和 Akka。这些框架共同提供了诸如自动发现、自动故障转移、节点间数据同步、自动数据序列化、多节点工作队列、活动负载监控和自适应负载均衡等功能，可以节省大量的开发者时间。它们之间进行了相互比较，并与高性能社区常用的的消息传递接口（MPI）进行了比较，MPI
    是性能计算的主力。


    由于具有更强的灵活性功能，预计更复杂的框架性能不会像 MPI 好。事实上，只有 MPI 和低级 Java socket 输入/输出（I/O）能够以每秒 10,000
    次同步往返交换的速度处理小数据。另一方面，Akka 和 Storm 实现了每秒 10,000 次异步往返交换，并在某些情况下优于 MPI。GridGain
    是最设置的，在研究者看来，吞吐量、生产力和生命周期成本之间的权衡是复杂的，必须针对每个应用程序进行解决。


    为了了解其他 JVM 语言与 Java 和 C 的性能对比，测试了其他语言。Python 在性能计算世界被使用是为了扩展性、简洁性和易用性，部分归因于无类型变量。Python
    有多种实现，例如解释执行的 CPython、编译的 PyPy 以及运行在 JVM 上的 Jython。Jython 2.7.0 比 CPython 2.6
    快一点。使用最初由 Apple 开发的 GPU 优化内核表明，Java 在设置和调用内核上比 C 慢了约 2 微秒。C 代码需要大约 9 毫秒。然而，由于
    GPU 计算与内核并行进行，对 GPU 吞吐量的净影响通常小于 2%。但有了这类设置时间，每秒超过数千次的 GPU 交互是合理的。


    Scala 是一种运行在 JVM 上的新语言，它具有扩展性且代码简洁。它的强类型比 Java 更易于编写。它还具有函数式编程的功能。Java 7 标准版稍微快一点。Python
    在纯计算中比 CPython 慢 30%，归因于内存 结构。PyPy 在调用原生代码时比 CPython 快 120 倍。


