  - '[PAGE 96]


    One unique aspect of Storm relative to the other frameworks investigated is that
    the framework can easily create multiple instances of the same spouts and bolts
    to implement parallel processing. Stream tuples that are directed to a parallelized
    bolt will be automatically “stripped” across the bolts to distribute the load.


    Storm spouts and bolts can be directed with or without tuple delivery acknowledgment.
    Failures can cause tuples to be resent although this is by user code upon detection
    of missing acknowledgments. Spouts and bolts should maintain a state and are capable
    of being quickly restarted.


    Storm is early in its development life. There is an assumption that all the processing
    nodes are equally capable when parallelized bolts are instantiated. This leaves
    it to the developer to write specialized shaders to handle more processor-aware
    assignment of bolt instances. There is no single queue onto which can be queued.
    One-of-a-kind processing has to be done in response to a “trigger” tuple to a
    node.


    Storm is open-source and is available under an Eclipse Public License. Storm is
    relatively new and lacks some of the “polish” of the older frameworks. Storm runs
    on the JVM but is written in Java and Closure. It requires the use of Apache Zookeeper⁶,
    ZeroMQ⁷ and the Java bindings for ZeroMQ all be installed and configured separately.
    Storm version 0.8.2 was used for testing.


    # 6.2.6 Akka


    Akka presents a more evolved message distribution model known as an actor model.
    With MPI and Pj, messages are sent to compute elements based on an integer id.
    With actors, a reference to an actor is looked up by unique identifier assigned
    by the developer. The reference is used for subsequent delivery. Unlike MPI and
    Pj’s integer id, the actor’s symmetric identifier does not depend on the grid
    size. The referencing mechanism is used whether the actor is local to the sending
    process or remote. This allows an application to be written initially as a number
    of inter-communicating actors that can later be easily instantiated at different
    nodes.


    Message sending is asynchronous. Any serializable Java object (including tuples
    of Java objects) can be sent as a message. Actors may maintain state and change
    their behavior as needed. Unlike Storm, the I/O relationships between the actors
    are not captured in a static topology—each sender demands the receiver for every
    message when it is sent.


    Akka supports cluster operation that the user can write some code to recognize
    cluster events such as nodes joining or leaving the cluster. Akka supports message
    distribution to parallel instances of actors on different nodes. The framework
    provides defined actors as routers that are very useful for distributing messages
    to parallel instances of actors. However, using these takes a little more developer
    work and understanding than non-router distribution.


    > ⁶⁰ Apache Zookeeper, < http://zookeeper.apache.org >


    > ⁶¹ Carl Hewitt, Peter Bishop, and Richard Steiger. 1973. A universal modular
    ACTOR formalism for artificial intelligence. In Proceedings of the 3rd international
    conference on Artificial Intelligence (IJCAI73). Morgan Kaufmann Publishers Inc.,
    San Francisco, CA, USA, 235-245'
  - '[PAGE 97]


    Akka has various types of routers including an adaptive load balancing router
    that uses runtime CPU metrics to determine which workers to route messages to.
    The metrics include memory utilization, load average, CPU utilization, or mixes
    of these. Version 2.1.2 was used for testing.


    # # 6.3 Feature Comparisons


    The previous section provided an introductory description for each framework.
    Table 6-1 and Table 6-2 compare aspects of these frameworks that are of interest
    to those designing multi-node compute applications.


    Architecture refers to the relationships between nodes. In some of the frameworks
    there is a master node, for example, may launch other nodes or take a special
    role in I/O. Node and worker topologies may be fixed for the duration of the framework
    or they may support ad hoc entry/exit of compute nodes. In the latter case, the
    worker code is typically distributed dynamically whatever prevails nodes are available.


    Distribution model refers to whether messages or work is distributed. To distribute
    work the framework has move data but the details of the messaging are handled
    by the framework. In the case of Storm, data tuples are explicitly emitted from
    sprouts and bolts the target of tuples is not known by the sprout or the bolt.
    The target has been identified by the topology that was submitted to the framework
    for execution. In contrast, Akka, the sending actor explicitly identifies the
    actor that will receive the message.


    Frameworks may or not separate OS processes to perform work. GridGain and Akka
    are the only ones that do not this.


    Load balancing refers to a framework''s ability to distribute work across available
    nodes. Simple algorithms will just distribute the load in round-robin fashion
    to available resources. More sophisticated algorithms will factor in execution
    time to predict the loading impact of current distribution decisions. Other algorithms
    will also factor in the node''s current CPU and memory loading. JPPF, GridGain,
    and Akka all provide various forms of load balancing as well as provisions for
    user provided load balancing algorithms.


    Recovery from node failure describes whether the framework facilitates recovery
    from node failure without imposing much work on the developer to detect and take
    corrective action. MPI and PJ are at a disadvantage because their integer id-based
    process identification makes it hard to easily recover when a specific id is down,
    requiring the user to do some intricate reassignment of the work to other nodes.'
