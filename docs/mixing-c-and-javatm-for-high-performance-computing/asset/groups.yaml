    # Java, Graphics Processing Units, and OpenCL™


    GPUs offer significant speed benefits for many types of computations. OpenCL provides
    a versatile way to program a variety of vendor GPUs on a variety of hardware and
    operating system platforms. The specification for 1.0, 1.1, and 1.2 of the API
    can be found at the Kronos Group''s web site. The power and availability of GPUs
    suggest that the GPU is not an option but is instead a critical part of the high
    performance computing toolbox.


    OpenCL is not the only way to use GPUs but it is a key one. The reader may be
    interested in investigating projects such as Aparapi and Roobert simplify or eliminate
    explicit GPU kernel creation and invocation. These were not tested or evaluated
    in this study. This study is based on a more modern use of OpenCL.


    There are several libraries that provide access to OpenCL. Some implement the
    OpenCL API leaving the developer to work around memory pointer details. Others
    provide greater abstraction and greater safety. Table 5-1 and Table 5-2 identify
    four Java alternatives. The tables provide a brief summary of key aspects of each
    alternative.


    Several of the alternatives use Java .nio (NIO) data buffers to hold array data
    for OpenCV kernels natively. NIO does not provide a way to release memory once
    it is allocated. NIO buffers are designed so that the garbage collector could
    eventually reclaim the memory when there are no more references to them. However,
    since the collector needs to wait until the Heap is mostly full and native buffer
    memory is not on the heap, it may take a while for the garbage collector to reclaim
    unreferenced NIO buffers.


    There appear to be ways to work around the NIO buffer problem by making direct
    calls into non-public Java classes. These may not work on all Java implementations.
    If NIO buffer storage is the only option for array data then the best approach
    is to allocate the required buffers once and then reuse them throughout the life
    of the application. This is a good idea anyway to reduce memory fragmentation
    and to minimize garbage collector work.


    48 OpenCV is a trademark of Apple, and is used under license by Kronos Group.


    49 "OpenCL - The open standard for parallel programming of heterogeneous systems."
    <http://www.kronos.org/opencl/>


    50 Aparapi converts Java bytecode to OpenCL at run time and executes it on the
    GPU. See <http://github.com/aparapi/>.


    51 Roobert is a graphics processor unit (GPU) compiler that analyzes standard
    Java bytecode and produces Unified Device Architecture (CUDA)-based GPU code.
    See <https://github.com/pcprraits/rootbeer1/.


    52 For ways to work around the inability to free NIO direct buffers see <http://stackoverflow.com/questions/846200/examples-of-forcing-freeing-of-native-memory-direct-buffer-has-allocated-us>.'
