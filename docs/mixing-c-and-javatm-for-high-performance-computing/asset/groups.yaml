    insertion retrieval. On a given run, the values have a fixed length that can be
    changed from one run to the next. Lengths of 4 bytes, 512 bytes, and 2048 bytes
    were used on different runs. On retrieve, the test uses the same sequence of pseudo-random
    keys. This means that all fetched keys are to be present in the tree.


    The results of the insertion tests are shown in Figure 2-9. There are three C
    insertion timings The first is the time to allocate the tree, the keys, and the
    data. The second adds to this time to free the tree between repeated trials. With
    Java one cannot control when garbage collection is taking place so the Java performance
    includes memory reclamation. The third uses malloc instead of C to take into account
    the time to clear the content before use. Java always clears the content data
    as a side-effect of allocation. The three timings help to compare C to the equivalent
    Java timing.


