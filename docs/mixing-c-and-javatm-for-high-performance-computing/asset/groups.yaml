  mdcn: "\n\n## 表 6-2. 框架特性比较（2/2）\n\n| 特性 | MPI | PJ | JPPF | GridGain | Storm |\
    \ Akka |\n|---|---|---|---|---|---|---|\n| 执行单元 | 整个副本应用 | 整个副本应用 | 可动态部署的单个作业和任务\
    \ | 可动态部署的单个作业和任务 | 动态部署的单个代码点和组件 (bolts) | 静态部署的 Actor 对象 |\n| 跨节点共享和分布式工作队列\
    \ | 不适用 | 不适用 | 是 | 是 | 作为对分片消息的响应 | 是，但需要一些“胶水”代码 |\n| 基于节点属性的工作负载 | 不适用 | 不适用\
    \ | 否 | 是 | 不适用 | Akka 识别“节点角色”，但用户代码必须手动使用 |\n| 基于数据属性的消息分发或数据分区 | 否；需要手动编码 |\
    \ 否；需要手动编码 | 否；需要手动编码 | 是 | 是 | Akka – 可以通过自定义路由器实现 |\n| 跨节点实现 fork/join 语义 |\
    \ 不适用 | 不适用 | 是（带有 Fork/Join 插件） | 是 | 不适用 | 不适用 |\n| 节点间的共享同步数据 | 使用共享文件机制 |\
    \ 否 | 是（带有 DataProvider） | 是，提供了多种机制 | 否 | 否 |\n| 跨节点的任务间或进程间同步 | 是 | 否 | 否 |\
    \ 是 | 否 | 否 |\n\n这是对这五个 JVM 框架的快速概述。其中四个框架（JPPF、GridGain、Storm 和 Akka）将开发者从底层的消息“处理”（如序列化、缓冲和队列）中解放了出来。它们在负载均衡、并发和故障恢复方面也具有显著的内置能力。熟悉其中任何一个框架的人可能会认为这些描述过于简单。然而，目标是引导那些没有这些框架经验、且需要对其差异有初步印象的读者。\n\
    \n## 6.4 框架性能\n\n人们预期，功能众多的框架性能可能不如功能较少但对性能投入更多关注的小型框架。本节调查了框架的性能。它测量了简单的指标——延迟和吞吐量。\n\
    \n使用了一个简单的 ping-pong 测试来测量延迟和吞吐量。每个框架都创建了同步和异步两个版本的测试。在同步测试中，节点 A 向节点 B 发送固定大小的数据并等待响应。节点\
    \ B 在接收到节点 A 的消息后，向节点 A 返回相同大小的消息。这一过程重复进行。在异步测试中，节点 A 向节点 B 发送多条消息但不等待响应。\n\n\
    异步测试需要第一个节点对数据进行队列，因为数据产生速度快于传输速度。因此，异步测试提供了有关框架队列和缓冲能力的信息。MPI 和 PJ 不提供通信软件栈。因此，研究人员在\
    \ MPI 和 PJ 的基准测试代码中加入了轮询队列和缓冲。其他框架则不需要此操作。\n\n每次实验运行交换固定长度的数据，其长度从约 80 字节到约 650\
    \ 千字节不等。对于 MPI，缓冲区大小是可以控制的，因为 C 语言对发送的数据有直接控制权。在 Java 中，数据包含在 Java 对象中。该对象如列表\
    \ 6-1 所示。序列化 Java 对象会描述所发送内容的元数据，以便在节点上进行重构。因此，传输的字节数大于用户数据的大小。对于列表 6-1 所示的对象，其大小为\
    \ 182 字节元数据加上 36 字节的非数组字段，再加上数组数据的字节数。某些框架使用标准的 Java 序列化，而另一些则拥有框架特定的序列化器。某些框架允许用户创建更高效的序列化器。对于像\
    \ JPPF 这样面向任务/作业的框架，开销可能更大，因为除了用户数据外，作业/任务对象也必须序列化。\n\n### 列表 6-1. Ping-Pong 测试使用的\
    \ Java 对象\n\n```java\npublic class RunInfo implements Serializable {\n    private\
    \ static final long serialVersionUID = 9478L;\n    public int jobID;\n    public\
    \ long creationTimeNanos;\n    public long remoteReceiveTimeNanos;\n    public\
    \ long intervalNanos;\n    public long durationNanos; // 未使用但存在\n    public long[]\
    \ data;\n}\n```\n\n在基准测试中，从第一个节点发送的消息在调用框架发送数据之前标记了纳秒时间。当第二个节点接收到数据时，它将接收时的纳秒时间添加到消息中并返回相同的消息。随后可以通过比较这两个时间确定延迟。\n\
    \n在使用服务器时钟方面格外小心。机器上的纳秒级时间通常是相对于启动时间的。毫秒级时间通常作为绝对时间可用。可以将两者仔细结合，以获得可以在机器之间比较的绝对纳秒时间。此外，标准时钟硬件在几分钟内可能会显著漂移。开发了校准软件来在每次测试运行中测量相对偏差。\n\
