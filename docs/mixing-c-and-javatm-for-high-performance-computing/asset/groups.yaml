  mdcn: "\n\n缺乏简化并行 for 循环迭代的语言特性将让一些具有传统计算背景的人感到沮丧。并行化 Java 提供了实现此目标最简洁的方法。另一方面，这项调查的视角非常狭窄，仅基于\
    \ for 循环的数值计算。读者可能会认为其他方法中的一种更适用于其他类型的并发。\n\n这里有一个核心的教训。鉴于 Java 开发者有多种并发技术可用，开发者应该对应用程序进行插桩，并将应用程序的并行版本和未并行版本进行比较，以确保他们获得了预期的行为。\n\
    \n# Java 调用原生代码\n\n在 Java 和 C 混合使用时，设计者可能会使用 C 进行“数值计算”并执行需要低执行抖动（jitter）的任务。Java\
    \ 可能被用于执行其他任务，如日志记录、外部应用程序通信、节点间协调和数据持久化。创建基准测试是为了理解如何最快地从 Java 调用 C，以及这些选项的相对难度。这里的重点主要是数值型数据数组。本研究没有调查字符串或结构的使用，尽管此处调查的大多数替代方案都支持这些。\n\
    \nJava 提供了一个低级 API 允许从 Java 调用 C 以及反之亦然。这就是 Java 原生接口（JNI）。直接使用 JNI 可能会很繁琐，因为访问数组可能需要多次\
    \ JNI 服务调用。然而，整数参数是直接传递的。\n\n如果从 C API 开始，则方法签名必须修改以接受直接来自 Java 的调用。通常编写一个代理类更简单，它接受\
    \ Java 调用，锁定任何 Java 数组（防止垃圾回收器移动数据），在需要时复制数组，然后调用实际函数。当 C 函数返回时，修改后的数组必须写回并解锁。\n\
    \n这是访问 Java 数据最快的方法，尽管它很笨拙。JNI 代理代码是必须为目标机器和操作系统编译并链接的代码。通过 JNI 进行调用不是平台无关的。\n\
    \nJava 到 C 的调用有其他更高级的选项。大多数选项具有平台依赖性，尽管其中一种方案针对一组广泛流行的操作系统和目标硬件实现了平台无关性。\n\n高级别的选项通常隐藏了\
    \ JNI 细节，并试图同时提供简单的 Java 接口和 C 接口。它们通常以经典方式构建代理类（作为一种开发时操作），或者通过即时构建“胶水”代码。这四种选项分别是：Java\
    \ Native Access (JNA)、BridgJ、Simplified Wrapper and Interface Generator (SWIG)\
    \ 和 HawtJNI。\n\n根据 JNI 仓库的描述：\n\n> “JNA 允许 Java 轻松访问原生共享库（Windows 上的 DLL），而无需编写任何\
    \ Java 代码——不需要 JNI 或原生代码。…… 访问在运行时是动态的，无需代码生成。…… Java 使用小型原生库存根来动态调用原生代码。开发者使用\
    \ Java 接口来描述目标原生库中的函数和结构。…… 虽然对性能有一定的关注，但正确性和使用优先。”\n\nBridgJ 是一个库：\n\n35 “Java\
    \ Native Interface Specification.” Oracle SE Documentation. <https://docs.oracle.com/javase/7/technotes/guides/jni/jniTOC.html>.\n\
    \n36 “Java Native Access (JNA).” <https://github.com/twall/jna/readme>\n\n37 “BridgJ:\
    \ Let Java & Scala Call, C++, Objective-C, C#...” <https://code.google.com/p/bridj/>\n\
    \n“它让你像编写原生代码一样从 Java 调用 C、C++ 和 Objective-C 库。它是 JNA 的近期替代方案。借助[工具] JNAerator*，它提供了到\
    \ C/C++ 清晰且无歧的映射，以及一个非常直接且高度类型的 API 来操作指针、类、结构体、联合……”\n\n使用 JNAerator，可以生成一个 Java\
    \ jar 文件，它预置了所有必要的胶水逻辑，并可以将原生库包含在内部以便使用。通过 Bridge，可以使用 Java 代码在原生内存中分配结构体，消除了将\
    \ Java 数据转换为 C 的相关开销。此外， Bridge 创建的 Java 对象在 Java 对象被回收时可以在 C 端被调用。因此，Bridge 允许开发者利用\
    \ Java 垃圾回收器来确保 C 数据也能正确收集。JNAerator 生成的代码是纯 Java 的，这意味着生成的 Java 类将在 Bridge 已经运行的任何机器和操作系统上运行。\n\
    \nSWIG²;\n\n> “ 是一种软件开发工具，将用 C 和 C++ 编写的程序与各种高级语言连接。SWIG 用于不同类型的目标语言，使用常用的脚本语言如\
    \ Perl、PHP、Python、Tcl 和 Ruby [以及 Java ] …… SWIG 通常用于解析 C/C++ 接口并生成目标语言调用 C/C++\
    \ 所需的‘胶水代码’。”\n\n生成此代码需要开发者提供一个 SWIG 特定的接口文件，该文件识别了各种结构映射选项以及要暴露的 API。SWIG 生成代理\
    \ Java 代码。该代码必须为目标机器和操作系统编译并链接。\n\n最后，HawtJNI³;\n\n> “HawtJNI 是一个代码生成器，产生实现 Java\
    \ 原生方法所需的 JNI 代码。它基于 jenigen 代码生成器，该生成器是 SWT Tools 项目的一部分，用于生成驱动 eclipse平台的所有\
    \ JNI 代码。”\n\nHawtJNI 允许开发者编写一个与 C 方法匹配的 Java 源类，并自动生成所需的 JNI 代码代理。对于像 Maven⁴\
    \ 这样的工具，它很好地集成到了 Maven 中。\n\n# 4.1 为 Java 调用生成桥接代码\n\n每种桥接工具/库都有其创建创建到 C 的桥接代码的方法。在实验中，目标\
    \ C 代码见列表 4-1 和 4-2。\n\n⁸JNA - Native C++ / Objective-C <https://code.google.com/p/jna>\n\
    \n⁹SWIG. <https://www.swig.org/>\n\n⁴⁰HawtJNI. <https://fource.com/sites/hawtjni/>\n\
    \n⁴¹Maven Project. <https://maven.apache.org/>\n\n# 列表 4-1 整数参数的 C 方法\n\n```c\n\
    int sf1(int i1){\n    return i1;\n}\n\nint sf2(int i1, int i2){\n    return i1;\n\
    }\n\nint sf5(int i1, int i2, int i3, int i4, int i5){\n    return i1;\n}\n\nint\
    \ sf10(int i1, int i2, int i3,\nint i4, int i5, int i6, int i7, int i8, int i9,\
    \ int i10){\n    return i1;\n}\n```\n\n# 列表 4-2 数组参数的 C 方法\n\n```c\n// 访问数组的值\n\
    double sa(const double a1[]){\n    return a1[0];\n}\n\n// 访问数组的值，忽略第二个数组\ndouble\
    \ sa2(const double a1[], const double a2[], int n){\n    return a1[0];\n}\n\n\
    // 修改第二个数组的内容，从第一个数组复制\ndouble sarw(const double a1[], double a2[], int n){\n\
    \    int i;\n    for (i = 0; i < n; i++){\n        a2[i] = a1[i];\n    }\n   \
    \ return a1[0];\n}\n```\n\n# 4.1.1 Java 原生接口\n\nJNI API 和规范是 Java 标准版的一部分。要使用\
    \ JNI，开发者必须：\n\n- 按照 JNI 规范重写原生签名，或\n编写一个遵循 JNI 规范的 C 代理类并调用所需的 C API。\n\n然后对代码进行编译、链接并作为特定的原生库发布。\n\
    测试的 JNI 代码见列表 4-3 和列表 4-4。JNI 为所有调用增加了两个参数：JNIEnv 和 jclass 参数。这些允许代码回调 Java 以访问元数据和数据。\n\
    \n# 列表 4-3 手动创建的整数参数测试 JNI 代码\n\n```c\nJNIEXPORT j jNICALL Java_sfInt1\n(JNIEnv\
    \ * env, jclass cls, j i1)\n{\n    return i1;\n}\n\nJNIEXPORT j jNICALL Java_sfInt5\n\
    (JNIEnv * env, jclass cls, j i1, j i2, j i3, j i4, j i5)\n{\n    return i1;\n\
    }\n\nJNIEXPORT j jNICALL Java_sfInt10\n(JNIEnv * env, jclass cls, j i1, j i2,\
    \ j i3,\nj i4, j i5, j i6, j i7, j i8, j i9, j i10)\n{\n    return i1;\n}\n```\n\
    \n"
