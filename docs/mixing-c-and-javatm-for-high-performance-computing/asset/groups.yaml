  - '[PAGE 99]


    Inter-node communication identifies the key protocols used for communication.
    MPI can use remote direct memory access (RDMA). RDMA allows MPI to exploit features
    of network interface cards that let one node to directly place information into
    another''s memory. ZeroMQ is an API and protocol that facilitates message-based
    communications.


    Serialization refers to the need to translate data types, arrays, and data structures
    and assemble them into sequential bytes for transmission. With MPI the structure
    of data has to be provided declaratively by the application itself. With Java
    data is an object which can be serialized automatically if it follows some basic
    conventions.


    Unit of execution refers to how code is transferred and executed at the multiple
    nodes. In MPI and PJ the entire application is run at each node and it is up to
    the application to decide what to do at each node. The other frameworks provide
    more fine-grained portions of the code for activation. JPPF, GridGain, Storm have
    the ability to transfer the necessary code to the nodes at runtime.


    Shared and distributed work queuing is where processes on any node can queue additional
    work to be just executed, but also distributed across the grid nodes. Without
    framework support for this, the developer must implement queues that can be written/to
    any node, code to work from the queues and distribute them to the worker nodes,
    and code to send the results back to the node that originated the request.


    Inter-task or inter-process synchronization occurs where nodes are mechanisms
    so that multiple codes can synchronize with code on another node. One example
    of this is a barrier that requires multiple codes to reach a certain point before
    any of them can continue.


    Work distribution based on node attributes is where a task or job can be “sent”
    to a node based on an attribute assigned to the node. This is useful when the
    node has special I/O capability or compute capability that need to be utilized
    to do the work.


    Message distribution based on data attributes is where data is sent to a node
    based on the data itself. This is useful, for example, for data analytics which
    may benefit by having all data reductions for the type performed at the node.


    Implements/join semantics across nodes refers to the ability to start execution
    on one node, start (fork) execution of multiple code sections on other nodes,
    then when the other nodes complete, execution continues on the original node (or
    on one of the other nodes). Direct framework support saves developer work and
    errors. On the other hand, while this is very hard for some types of algorithms
    it only makes sense for the job and task oriented frameworks.


    Shared synchronized data between nodes allows multiple nodes to have the same
    view of data after modifications are made. Regardless of the order that data is
    modified in, from different nodes all nodes see the same order of data changes.


    > 63 RDMA Consortium'
