  md: '# Foreword


    OK, before we do anything else, let''s be sure we''re talking about the testing

    tool. Right? Cucumber. The acceptance testing tool. I mean, you wouldn''t

    have picked this book up if you didn''t know something about it already. Right?

    I mean, you''re a software person, right?


    So, you''re probably wondering, since Cucumber is so simple to use and all,

    just how much this book could possibly teach you. I mean, you''re probably

    seen, or even written, some Gherkin scenarios, and you''ve probably seen

    some Cucumber tests run. You''ve probably watched a video or two, so you

    know what Cucumber is like. So perhaps you''re looking at the page count,

    or just looking at thick the book is, "Is there really that to talk about?” You
    might be suspicious that this book is

    like all other books full of fluffy descriptions, vacuous advice, and

    tedious repetition to fill up space and make it thick and important.


    Well, put those thoughts out of your mind—because, trust me, this book may

    be thick, but it''s also dense. (Uh...)This isn''t coming out...But you

    know what I mean.)


    What you''re looking at here is a book about acceptance testing—a deep book

    about acceptance testing. It happens to use Cucumber as the tool, and

    Gherkin as the language for writing those acceptance tests—and make no

    mistake you''ll learn every nook and cranny of that tool and that language.

    However, Cucumber and Gherkin is the least you''ll learn. If you

    never intend to use Cucumber and Gherkin, this book has a lot to teach you.


    The first few chapters might not convince you of this, because they''re mostly

    about the syntax and semantics of the tool and language. They walk you

    through setting up simple acceptance tests, features, and scenarios. They

    show you how to construct step files and where to put them. They show you

    how to execute the tests, and how to deal with the error messages. With

    these early chapters as the appetizer—a light and tasty tease with just a

    tmeat that is to come.'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'Foreword • xii


    And then, hold on your hats, because when the meat comes, it comes! I mean, these
    authors put you in the passenger seat, take you on a nice gentle ride once or
    twice around the track, and then, when you''re thinking that the ride should be
    over, they look at you, smile with an evil grin, and floor it.


    And what a dizzying ride it is! You''ll learn what acceptance tests are, what
    they''re good for, who should write them, who should read them, and what can go
    wrong, how to fix what can go wrong, to avoid making it go wrong—and (pant, pant)
    that''s your first lap.


    The next laps include things how to deal with race conditions, how to test and
    manage current operations, and what to do with intermittently flickering tests.
    They talk about how to write tests that use databases, and why and when that''s
    a good idea, and when and when it''s not. They talk about complex configurations,
    dependency injection, continuous integration, and (get this) legacy code!


    And, just to prove that no topic is out of bound for these guys, they talk about
    organizational structure, team structure, and the sociology of programmers, testers,
    managers, customers, and product owners.


    And every time you think they''re about to slow down for their last lap so you
    can get out of this crazy ride, you turn the page and there''s another whirlwind
    lap full of deep knowledge, genuine experience, and solid advice.


    For those of you who are experienced in acceptance testing, you might find parts
    in the middle of the book a bit annoying because they seem to break all the rules
    you thought golden. But they''re just teasing you, because you read on you find
    not only that they''ve got those bases covered but they have a better set of solutions
    and a better perspective than you thought—maybe better even than yours.


    So, here''s my advice. Get ready to study! Get ready for a really meaty meal that
    will take a long time to eat, and an even longer to digest. You won''t be disappointed.
    This one is worth the time and effort.


    Robert C. Martin (Uncle Bob)'
