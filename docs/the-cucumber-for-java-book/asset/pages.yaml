  md: "# Sharing a Browser Using Spring\n\nWe're using a Spring configuration file,\
    \ cucumber.xml, to define our EventFiringWeb-Driver. It takes a tiny modification\
    \ to keep the browser instance alive for the whole run of Cucumber. In the XML\
    \ follows, we simply removed the attribute scope=\"cucumber-glue\" from the definition\
    \ of the bean:\n\n```\nfast/04/src/test/resources/cucumber.xml\n<bean class=\"\
    org.openqa.selenium.events.EventFiringWebDriver\"\n    destroy-method=\"quit\"\
    >\n  <bean constructor-arg>\n    <bean class=\"org.openqa.selenium.firefox.FirefoxDriver\"\
    \ />\n  </constructor-arg>\n</bean>\n```\n\nNow when Spring creates an instance\
    \ of the web driver, it's associated with the default scope run. Running mvn clean\
    \ test and you'll see that this makes the feature much quicker overall, because\
    \ we don't have to wait for the browser to start up for any scenario.\n\nIf you\
    \ needed to delete cookies as well, you'd need to write a hook that does this\
    \ programmatically, we'll see next\n\n# Using a Shutdown Hook\n\nThere's a more\
    \ general way to do cleanup when a JVM is closing down that doesn't rely on Spring;\
    \ using Java's addShutdownHook. The following code comes from the Webbit-Websockets-Selenium\
    \ example in the Cucumber project.\n\n```\npublic class SharedDriver extends EventFiringWebDriver\
    \ {\n  private static final WebDriver REAL_DRIVER = new FirefoxDriver();\n  private\
    \ static final Thread CLOSE_THREAD = new Thread() {\n    @Override\n    public\
    \ void run() {\n      REAL_DRIVER.close();\n    }\n  }\n\n  static {\n    Runtime.getRuntime().addShutdownHook(CLOSE_THREAD);\n\
    \  }\n\n  public SharedDriver() {\n    super(REAL_DRIVER);\n  }\n}\n```\n\n+ \
    \  3. https://github.com/cucumber/cucumber-jvm/master/examples/java-webbit-websockets-selenium/src/test/java/cucumber/examples/java/websockets/SharedDriver.java"
  merge: -1
  pgno: 243
