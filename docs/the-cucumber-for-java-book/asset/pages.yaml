  md: "# Moving to Guice\n\nGuice is a DI container from Google with many of the features\
    \ as Pico-Container. In our opinion it's not as easy to use as PicoContainer,\
    \ but it does have some extra possibilities, as we'll see. Also, since it's part\
    \ of the popular Guice toolset, you may already be familiar with it.\n\nWe'll\
    \ quickly modify our ATM solution to run with Guice, pointing out the differences\
    \ as we go. Further details can be found on the Guice website.8 Note as of this\
    \ writing Guice 4.0 is in beta, but this example uses Guice 3.0 and cucumber-guice-1.2.0.\n\
    \n# Switching the DI DI Container\n\nWe'll start with the refactored code that\
    \ we produced at the end of the previous section. The first thing to do is to\
    \ replace the dependencies on cucumber-picocontainer and PicoContainer in pom.xml.\n\
    \n```\ndependency_injection/guice/01/pom.xml\n<dependency>\n  <groupId>info.cukes</groupId>\n\
    \  <artifactId>cucumber-guice</artifactId>\n  <version>$(cucumber.version)</version>\n\
    \  <scope>test</scope>\n</dependency>\n<dependency>\n  <groupId>com.google.inject</groupId>\n\
    \  <artifactId>guice</artifactId>\n  <version>3.0</version>\n</dependency>\n```\n\
    \nIf you run mvn clean test you'll see a number of errors like this:\n\n```\n\
    T E S T S\nRunningRunCukesTest\nFeature: Cash Withdrawal\nFailure in before hook:ServerHooks.startServer()\n\
    Message: com.google.inject.ConfigurationException: Guice configuration errors:\n\
    ```\n\n+   1) Could not find a suitable constructor in hooks.ServerHooks.\nClasses\
    \ have either one (and only one) constructor annotated with @Inject or a zero-argument\
    \ constructor that is not private. at ServerHooks.class(ServerHooks.java:19)\n\
    while locating hooks.ServerHooks\n\n> 8. https://github.com/google/guice"
