  md: "# Hooks That Run at Other Times\n\nIf you want to run code before all of your\
    \ features start, the way to do that is to use Java language features, such as\
    \ static fields.\n\nIf you want to run code after all of your features have finished,\
    \ you can use Java's built-in addShutdownHook, which will be run just before the\
    \ Cucumber process exits. You'll typically use this mechanism to tear down some\
    \ external system that you've started from your support code.\n\nSometimes people\
    \ also ask about running specific setup and cleanup code once for a particular\
    \ feature, not for each scenario in the feature. There are a number of ways to\
    \ achieve this without needing Cucumber to provide any additional functionality,\
    \ one of which was described in detail by Paolo Ambrosio.⁵\n\nArmed with this\
    \ new knowledge about hooks, let's get back to work on our ATM.\n\n```\nJoe asks:\\\
    \ What Order Do My Hooks Run In?\n\nSometimes it's important to be able to specify\
    \ the exact order that your hooks run in. The @Before and @After annotations have\
    \ an order parameter that you can set. The default value is 10000 for any hook\
    \ that doesn't have a specific order.\n\n@Before(order = 5)\npublic void oneHook()\
    \ {\n    // ...\n}\n\n@After(order = 200)\npublic void anotherHook() {\n    //\
    \ ...\n}\n\nCucumber runs @Before hooks from low to high. A @Before hook with\
    \ an order of 10 will run before one with an order of 20. @After hooks run in\
    \ the opposite direction—from high to low—so an @After hook with an order of 21\
    \ will run before one with an order of 10.\n\nIf you need to use value=\"Tag\"\
    , you have to use the value parameter:\n@Before(value=\"myTag\", order=5)\npublic\
    \ void oneHook() {\n    // ...\n}\n```\n\n+   5. https://groups.google.com/d/msg/kukes/Z2mWGk0Rsgs/4F2H8SPcmRsj"
