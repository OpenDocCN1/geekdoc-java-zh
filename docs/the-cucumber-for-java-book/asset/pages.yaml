  md: "# Chapter 12. Working with Web Applications • 226\n\nThat's right—it's completely\
    \ useless for that. Still, people keep using it to\ndevelop web applications.\
    \ How come?\n\nRemember, Cucumber is not much more than a tool that can parse\
    \ Gherkin\n features and execute step definitions. It doesn't know how to talk\
    \ to\ndatabases, web apps, or any external system. People install other libraries\n\
    for this and use them in their step definitions and support code to connect\n\
    to those external systems.\n\nAs of this writing, the most popular Java library\
    \ for programmatically inter-\nacting with a web application Selenium WebDriver.\
    \ It provides an API for\naccessing web pages and interacting with them in a way\
    \ that is similar to\nhow a real user does—entering text in fields and text areas,\
    \ checking\ncheck boxes, clicking links and buttons, and so on. Selenium WebDriver\n\
    allows you to pull in drivers that run those interactions in several\ndifferent\
    \ browsers—such as Firefox, Internet Explorer, and Chrome.\n\nWe've been using\
    \ a few pieces of Selenium WebDriver functionality already\nin the book, but this\
    \ chapter is going to need more. Therefore, it's time to give\ny brief overview\
    \ of the full power of Selenium so that you're ready for the\nstep definitions\
    \ we're going to be written later on. Make sure you consult\nSelenium's own documentation\
    \ for more comprehensive details.¹¹\n\n# Navigation, WebElements, and Locations\n\
    \nThe most basic way of using a browser is to access a specific URL. Sele-\nium\
    \ provides the get method, which we've already used earlier, to issue a\nGET request\
    \ to the specified URL: driver.get(String path). However, you cannot\nassume that\
    \ Selenium will wait for the page to load before returning from\nthis method.\n\
    \nOnce you've loaded a web page, you'll want to do things like enter text into\n\
    boxes or click buttons. Selenium calls the components that make up a\npage WebElements\
    \ and provides a number of methods to help you discover\nthem. Most of these methods\
    \ take a Selenium locator as an argument that\nspecifies which element you are\
    \ interested in, and the simplest is findElement.\nIf more than one element matches\
    \ the locator you supply, findElement returns\nt first element that matches the\
    \ locator. You can also retrieve a list of all\nelements that match your locator\
    \ using findElements.\n\n+   1. http://selenium.hq.org/projects/webdriver/"
