  md: '# Track Your Code Coverage for Team Encouragement


    Code coverage is a misused metric of code quality. We''ve heard of managers who''ve
    demanded that their teams achieve 100 percent code coverage. We''ve also heard
    of teams that, under those circumstances, simply wrote a load of tests with no
    assertions in them. All the code was run, but it wasn''t tested!


    As a source of internal feedback for the team, though, code coverage can be useful,
    especially when you''re embarking on a long-term project to build a legacy system
    under the control of automated tests. Start measuring your code coverage today,
    and come back every few weeks to measure it again. You should be pleased to see
    the number climbing all the time.


    Another great related metric to track, which your manager might be more impressed
    by, is the defect rate (number of new bugs discovered per week). If Cucumber tests
    are going to add any value to your customers, this is the most likely place it
    surface. As you add more test coverage, your team will make fewer mistakes, and
    you should see your defect rate drop.


    has gone into the development of tools like pitest to minimize the time it takes
    to run them on your application, but they are still relatively slow compared to
    our scenarios and unit tests. Used as part of your development process and integrated
    into your CI pipeline, mutation testing can be a cost-effective way of confirming
    the quality of your automated testing.


    # What We Just Learned


    Working with legacy code is always a challenge, but you can use Cucumber scenarios
    to help make it a much more enjoyable challenge. Be pragmatic! Don''t exhaust
    yourself trying to retrofit a complete set of Cucumber features for everything
    the system already does. Instead, add them gradually, one at a time, as you need
    them.


    You''ll use characterization tests to help understand what the system is already
    doing and to give you some security before you make a change. Similarly, every
    time you discover a bug, you''ll trap it with a new Cucumber scenario. And, every
    time you add new behavior to the system, start by describing it with a Cucumber
    feature.


    Code coverage can give you and team feedback and encouragement about your progress
    in getting the system under test.


    Enjoy the newfound confidence with which you can refactor and clean up the code
    that''s covered by the tests.'
