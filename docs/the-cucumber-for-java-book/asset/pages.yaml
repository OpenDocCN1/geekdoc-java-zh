  md: '# Source of Truth


    For many teams, the Cucumber feature files become the definitive source of truth
    as to what the system does. Having a single place to go for this information saves
    a lot of time that is often wasted to keep requirements documents, tests, and
    code all in sync. Having a single source of truth also helps build trust within
    the team, because different parts of the team no longer have their own versions
    of the truth.


    # How Cucumber Works


    Before we dive into the meat of the book, let''s give you some context with a
    high-level overview of a typical Cucumber test suite. This structure, from features
    down to automation library, is illustrated in the figure.


    Cucumber was originally created as a command-line tool by members of the Ruby
    community. It has since translated into several development environments, including
    Java, to allow more of us to enjoy its benefits. When you run Cucumber, it reads
    your specifications from plain-language text files called features, examines them
    for scenarios to test, and runs the scenarios against your system. Each scenario
    is a list of steps for Cucumber to work to. So that Cucumber can understand these
    feature files, they must follow some basic syntax rules. The name for this set
    of rules is Gherkin.


    ![](img/3bdd08a58a5b15b4736776437bb8f3a0_25_0.png)


    Along with the features, you give Cucumber a set of step definitions, which map
    the business-readable language of each step into code (written in Java throughout
    this book) to carry out whatever action is being described by the step. In a mature
    test suite, the step definition itself will probably be just one or two lines
    of code that delegate to a library of support code, specific to the domain of
    your application, that knows how to carry out common tasks on the system. Times
    that may involve an automation library, like the browser automation library Selenium,
    to interact with the system itself.'
