  md: "```\n<fail message=\"Cucumber failed\">\n<condition>\n  <not>\n    <equals\
    \ arg1=\"${cucumber.exitstatus}\\ arg2=\"0\"/>\n  </not>\n</condition>\n</fail>\n\
    </target>\n```\n\nNow that you know how to run Cucumber both by hand and from\
    \ Ant and Maven, you can also make your CI server run it. Cucumber exits with\
    \ a status code of 1 if any scenarios fail, so your CI server can properly detect\
    \ failure.\n\n# Running Cucumber in Continuous Integration\n\nMany teams set up\
    \ their continuous integration¹⁷ CI server to run Cucumber every time someone\
    \ changes changes with the rest of the team. Since it's a command-line tool, you\
    \ don't have to do anything fancy—just plop the build command you're using into\
    \ the CI project's configuration.\n\nYou may want to use slightly different command-line\
    \ options for CI than you use on your own workstation. You can do this by providing\
    \ different options, as described earlier.\n\n# Being Strict\n\nIt's common to\
    \ have missing or pending steps while we're working on a new scenario. Some teams\
    \ strive to keep the mainline (trunk) of the source repository pristine, without\
    \ any pending or missing steps.\n\nCI systems detect by inspecting the exit status\
    \ of the processes they are running, and by default Cucumber exits with an error\
    \ status (a nonzero value) only if there are one or more *failing* steps. If you're\
    \ running Cucumber in a CI environment, you may want to set it up so that anyone\
    \ checks in *missing* or *pending* steps as *failing* ones.\n\nIf you pass the\
    \ --strict option to cucumber, it will exit with a nonzero value if there are\
    \ any *missing* or *pending* steps as *failing* ones. You can inspect the exit\
    \ status after running Cucumber:\n\n```\n# OS X or Linux\n$ echo $?\n\n# Windows\n\
    $ echo %ERRORLEVEL%\n```\n\n+   17. http://martinfowler.com/articles/continuousintegration.html"
