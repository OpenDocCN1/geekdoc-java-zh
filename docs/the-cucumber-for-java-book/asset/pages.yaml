  md: 'Because we develop our applications iteratively, we also develop our database
    schemas iteratively. In this chapter we''ll use a popular tool called Liquibase³
    to manage our database as it evolves. This type of tool becomes particularly useful
    as your product gets more complicated.


    It''s useful to have a basic understanding of these database tools, so we''ll
    start with a quick introduction before we plug it into our example.


    # Introducing the ActiveJDBC ORM


    The ActiveJDBC library is inspired by an implementation found in the Ruby on Rails
    framework, which is in turn based on the Active Record design pattern.⁴ActiveJDBC
    is easy to use from Java code to talk to any existing databases. For example,
    if we have an accounts table with the following data:


    | id | balance |

    |---|---|

    | 1 | 1765 |

    | 2 | 2214 | "250.00" |


    then we can query that database table using the following Java code:


    ```

    Account account = Account.getFirst("number = 2214");

    System.out.println(account.getString("balance"));

    ```


    Similarly, to add a new row to the table, we could do:


    ```

    Account newAccount = new Account();

    newAccount.setInt("number", 2134);

    newAccount.setString("amount", "0.00");

    newAccount.saveIt();

    ```


    We still need to define this Account class, but the clever thing is, we don''t
    to define the database columns in the code. Here''s how the class is defined:


    ```

    import activejdbc.Model;

    public class Account extends Model {

    ```


    That''s it! ActiveJDBC examines the database schema and sprinkles a little bit
    of Java magic to retrieve the Account class attributes from the database table,
    providing methods to get and set them by column name. There are also class methods
    like where and findFirst for searching for rows by a particular field. All we
    have to do is inherit from activejdbc.Model, and ActiveJDBC does the rest.


    +   3. http://www.liquibase.org

    4. http://en.wikipedia.org/wiki/Active_Record_design_pattern'
