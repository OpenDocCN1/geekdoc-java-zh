  md: "# Assertions and Exceptions\n\nEven if you're used to using a testing library\
    \ like JUnit, you might not have realized\nat the assertions in those libraries\
    \ work by raising exceptions.\n\nYou can prove this by writing a little Java program\
    \ that runs a failing\nassertion:\n\n```\nstep_definitions/assertions_sidebar/AssertionExample.java\n\
    import org.junit.*;\nimport static org.junit.Assert.*;\n\npublic class AssertionExample\
    \ {\n    public static void main(String[] args) {\n        try {\n           \
    \ assertTrue(false);\n        } catch (AssertionError e) {\n            System.out.print(\"\
    Exception was raised was \");\n            System.out.println(e.getClass().getName());\n\
    \        }\n    }\n}\n```\n\nWhen you run it, you should find that this program\
    \ raises an exception of type\njava.lang.AssertionError.\n\nsnippets Cucumber\
    \ generates for undefined steps throw a PendingException\nthem: now you understand\
    \ why.\n\nLet's get back to our ATM withdrawal scenario to show you what we mean.\n\
    \nCreate a file called step_definitions/Steps.java and paste it in this step:\n\
