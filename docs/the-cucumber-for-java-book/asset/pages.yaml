  md: "Let's take a look at test scenario again:\n\n```\nsupport_code/10/src/test/resources/cash_withdrawal.feature\n\
    Feature: Cash Withdrawal\nScenario: Successful withdrawal from an account in credit\n\
    Given my account has been credited with $100.00\nWhen I withdrew $20\nThen $20\
    \ should be dispensed\nAnd the balance of my account should be $80.00\n```\n\n\
    We haven't specified anything about how we do the cash withdrawal, so there's\
    \ nothing we need to change about the scenario at all. Great! Let's jump down\
    \ into the step definition for withdrawing cash and see what needs to be there:\n\
    \n```\nsupport_code/10/src/test/java/nicebank/TellerSteps.java\npackage nicebank;\n\
    \nimport cucumber.api.java.en.*;\n\nimport support.KnowsTheDomain;\n\npublic class\
    \ TellerSteps {\n\n    KnowsTheDomain helper;\n    public TellerSteps(KnowsTheDomain\
    \ helper) {\n        this.helper = helper;\n    }\n\n    @When(\"I withdraw \\\
    $\\(int \\d+)\")\n    public void iWithdraws(int amount) throws Throwable {\n\
    \        helper.getwithdrawFrom(helper.getAccount(), amount);\n    }\n}\n```\n\
    \nWe are all doing here is calling withdrawFrom on something. Right now that something\
    \ is an instance of the Teller class in our domain model. But what if we made\
    \ getTeller return something else, like an interface that follows the behaviors\
    \ we need to interact with a teller? That's the beauty of object-oriented programming—as\
    \ long as the object understands the withdrawFrom method, this step definition\
    \ is going to be happy. What we need to do is create an interface that describes\
    \ the responsibilities of a teller, and make our existing Teller implement it."
