  md: '# APPENDIX 2


    # # Cucumber and Other JVM Languages


    Cucumber comes in several flavors—it has been ported from Ruby to JavaScript,
    C#, Java, PHP, and others. The choice of which flavor of Cucumber you use essentially
    comes down to what language you want to write your step definitions in. Since
    most languages offer libraries that let you drive web browsers or interact with
    web services, you can use any implementation of Cucumber if you want to drive
    these sorts of applications from the outside. You should therefore choose the
    Cucumber that offers the language that your team will be most comfortable writing
    the step definitions in.


    Cucumber for Java is written in Java and is an obvious choice when using Cucumber
    with Java applications. However, Java runs on the JVM and interoperates seamlessly
    with other JVM languages. This opens up the possibility of writing your step definitions
    in the JVM language of your choice. You can choose to write your step definitions
    in one JVM language and your application in another.


    As described in *Backend Modules, on page 294*, there are many languages to choose
    from. The functionality they offer is all built on top of the Cucumber functionality
    (implemented in cucumber-core), but due to the differing paradigms of these languages
    the mechanisms used to make the functionality available varies from language to
    language.


    Since there are a large number of JVM languages integrated with Cucumber, with
    varying popularity, we have chosen to focus on the Java back end in'
