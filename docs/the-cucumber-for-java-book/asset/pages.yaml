  md: "Our final step is failing again. Can you see why?\n\nPreviously, we were sharing\
    \ state by using a local instance of the KnowsTheDomain class created in the Steps\
    \ constructor, but now we have three step definition classes and three separate\
    \ instances of KnowsTheDomain. We only want a single instance of KnowsTheDomain\
    \ and this is where Cucumber dependency injection functionality comes to the rescue.\n\
    \n# Dependency Injection\n\nDependency injection (DI) is a technique that allows\
    \ us to isolate a class from its concrete dependencies until runtime. Often this\
    \ is used to defer the decision about which actual implementation of an interface\
    \ we are going to use. On this occasion, Cucumber uses a dependency injection\
    \ framework to create a single instance of a class and that instance between all\
    \ the step definition classes we need to use. (We'll talk about Cucumber's use\
    \ of DI much more in Chapter 11, Simplifying Design with Dependency Injection,\
    \ on page 205.)\n\nCucumber ships with integrations to several popular DI frameworks\
    \ to choose from. We'll PicoContainer which is probably the most lightweight and\
    \ also available under the BSD license. We modify our pom.xml to add PicoContainer\
    \ as a dependency:\n\n```\nstep_definitions_inside_19/pom.xml\n<dependency>\n\
    \  <groupId>info.cukes</groupId>\n  <artifactId>cucumber-picocainer</artifactId>\n\
    \  <version>${cucumber.version}</version>\n  <scope>test</scope>\n</dependency>\n\
    <dependency>\n  <groupId>org.picocainer</groupId>\n  <artifactId>picocainer</artifactId>\n\
    \  <version>${picocainer.version}</version>\n  <scope>test</scope>\n</dependency>\n\
    ```\n\nNow all we need to do is change the constructor in each of our step definitions.\
    \ The following is an example:\n\n+   1. http://www.martinfowler.com/articles/injection.html\n\
    2. http://picocainer.codehaus.org"
