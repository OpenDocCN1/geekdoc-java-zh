  md: '# Backend Modules


    The choice of Backend module specifies which language you are going to write your
    glue (step definitions and hooks) in. The modules define the format of the snippets
    that are generated when Cucumber discovers a missing definition and may also control
    how Cucumber searches for your glue code.


    | Language | JAR |

    |---|---|

    | Java | cucumber-java |

    | Clojure | cucumber-clojure |

    | Groovy | cucumber-groovy |

    | Ioke | cucumber-loke |

    | JRuby | cucumber-jruby |

    | Jython | cucumber-jtyton |

    | Rhino | cucumber-rhino |

    | Scala | cucumber-scala |

    | Java for Android | cucumber-android |


    You must choose one, and only one, of these modules and have it on the Java classpath.
    Without a Backend module, Cucumber JUnit will fail with this error:


    > > Exception in thread "main" cucumber.runtime.CucumberException:

    No backends were found.

    Please make sure you have a backend module on your CLASSPATH.


    With more than one Backend module, Cucumber will not run correctly. Also, if you
    use cucumber-android you''ll need the Android development environment correctly
    installed.


    # Runners


    The cucumber-core JAR provides a class that offers a command-line interface. If,
    however, you want to run your features from an IDE or from a continuous integration
    (CI) server, you may want to interact with the features via a common test API,
    such as JUnit.


    These runners are currently supported by Cucumber:


    | Runner | JAR |

    |---|---|

    | JUnit | cucumber-junit |

    | TestNG | cucumber-testng |'
