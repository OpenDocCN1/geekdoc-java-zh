    # # Clojure


    The Clojure website describes Clojure like this:^6


    It is designed to be a general-purpose language, combining the approachability
    and interactive development of a scripting language with an efficient and robust
    infrastructure for multithreaded programming. Clojure is a compiled language—it
    compiles directly to JVM bytecode, which remains completely dynamic. Every feature
    supported Clojure is supported at runtime. Clojure provides easy access to the
    Java frameworks, with optimal type hints and type inference, to ensure that calls
    to Java can avoid reflection.


    The profusion of parentheses might confuse a Java programmer, but they should
    come as no surprise, because Clojure is a dialect of Lisp—which of course means
    that Clojure is a functional language.


    Managing state in a functional language can be confusing for programmers not used
    to it—not because it''s difficult, but because these languages encourage idempotence,
    and hence stateless functions. In this example we step test functions defined
    in the production code. No state is stored in the production code, which leaves
    this responsibility to our step definitions.


    There are two common approaches when using Cucumber with Clojure: use the traditional
    Java infrastructure or use Leining.^7 We will show you both.


