    \            String message = queue.read();\n\n            try {\n           \
    \     Thread.sleep(1000);\n            } catch (InterruptedException e) {\n  \
    \          }\n\n            if (message.length() > 0) {\n                Money\
    \ balance = BalanceStore.getBalance();\n                Money transactionAmount\
    \ = new Money(message);\n\n                if (isCreditTransaction(message)){\n\
    \                    BalanceStore.setBalance(balance.add(transactionAmount));\n\
    \                } else {\n                    BalanceStore.setBalance(balance.minus(transactionAmount));\n\
    \                }\n            }\n        } while (true);\n    }\n\n    private\
    \ boolean isCreditTransaction(String message) {\n        return !message.startsWith(\"\
    -\");\n    }\n}\n```\n\nThe transaction processor starts by creating an instance\
    \ of the TransactionQueue and BalanceStore classes. Once it's started up, it enters\
    \ a loop to read a message off the transaction queue. If it finds one, it pauses\
    \ for a second, calculates the new balance, and stores it on the BalanceStore.\
    \ We've introduced the pause to demonstrate the effects of working with an asynchronous\
    \ component in our system; this delay should mean the test will fail consistently\
    \ because the back-end will take so long to update the balance that Cucumber will\
    \ have already finished the scenario.\n\nThat should complete the implementation\
