  md: "# KnowsTheCashSlot\n\nTaking a look at the class KnowsTheCashSlot, we can see\
    \ that all it's doing is managing the creation of the domain entity CashSlot.\
    \ The reason we're using DI in the first place is to manage the creation of shared\
    \ objects, so it seems strange that we've ended up with our own class that does\
    \ that! What happened is by refactoring KnowsDomain, and with our new knowledge\
    \ of how DI works, we can now see that we don't need KnowsTheCashSlot at all.\
    \ Let's simplify our codebase by deleting KnowsTheCashSlot and injecting the CashSlot\
    \ directly into our definition:\n\n```\ndependency_injection/pico/03/src/test/java/nicebank/CashSlotSteps.java\n\
    CashSlot cashSlot;\n```\n\n```\npublic CashSlotSteps(CashSlot cashSlot) {\n  \
    \  this.cashSlot = cashSlot;\n}\n```\n\nWe also need to inject CashSlot into our\
    \ ServerHooks:\n\n```\ndependency_injection/pico/03/src/test/java/ServerHooks.java\n\
    private KnowsTheAccount accountHelper;\nprivate CashSlot cashSlot;\n```\n\n```\n\
    public ServerHooks(KnowsTheAccount accountHelper, CashSlot cashSlot) {\n    this.accountHelper\
    \ = accountHelper;\n    this.cashSlot = cashSlot;\n}\n```\n\nRun mvn clean test\
    \ to make sure we're still green!\n\n# KnowsTheTeller\n\nKnowsTheTeller also only\
    \ manages the creation of a Teller. If we make exactly the same changes to delete\
    \ teller, we'll get a runtime error when trying to create TellerSteps. That's\
    \ because the DI container doesn't know implementation of the Teller interface\
    \ to instantiate. We tell it which concrete class to instantiate by changing the\
    \ signature of the TellerSteps constructor:\n\n```\ndependency_injection/pico/04/src/test/java/nicebank/TellerSteps.java\n\
    KnowsTheAccount accountHelper;\nTeller teller;\n```\n\n```\npublic TellerSteps(TellerInterface\
    \ teller, KnowsTheAccount accountHelper) {\n    this.teller = teller;\n    this.accountHelper\
    \ = accountHelper;\n}\n```\n\nRun mvn clean test again."
