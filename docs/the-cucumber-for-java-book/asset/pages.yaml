  md: "PicoContainer Is Almost Invisible • 213\n\ntakes care of managing the creation\
    \ of our shared entities for us. It's a bit like the way garbage collection in\
    \ the JVM frees us from having to worry much about creating and deleting object\
    \ instances.\n\nSo far we've been using PicoContainer as our DI container. Next,\
    \ let's take a look at how weve integrated it with our application.\n\n# PicoContainer\
    \ Is Almost Invisible\n\nPicoContainer is probably the simplest DI container on\
    \ the JVM, which is why we've been using it. It's certainly the simplest to integrate\
    \ with Cucumber. Some of the other containers have options, but PicoContainer\
    \ is sufficient for most applications. The most likely reason not to use PicoContainer\
    \ is your application is already using another DI container.\n\nOur use of PicoContainer\
    \ is so unobtrusive that you may well have forgotten all about it by now. The\
    \ only evidence that we're even using it at all are the two dependencies in our\
    \ pom.xml:\n\n```\ndependency_injection/pico/01/pom.xml\n<dependency>\n  <groupId>info.cukes</groupId>\n\
    \  <artifactId>cucumber-picocontainer</artifactId>\n  <version>$${cucumber.version}</version>\n\
    \  <scope>test</scope>\n</dependency>\n```\n\nThis dependency puts the cucumber-picocontainer\
    \ JAR on the classpath, which tells Cucumber to let PicoContainer handle creation\
    \ of the hooks and step definitions.\n\n```\ndependency_injection/pico/01/pom.xml\n\
    <dependency>\n  <groupId>org.picocontainer</groupId>\n  <artifactId>picocontainer</artifactId>\n\
    \  <version>$${cucumber.version}</version>\n  <scope>test</scope>\n</dependency>\n\
    ```\n\nThis second dependency puts the PicoContainer implementation on the classpath.\
    \ Without this Cucumber would be unable to find PicoContainer and wouldn't be\
    \ able to delegate to it.\n\nApart from adding these dependencies, you can use\
    \ PicoContainer without adding any code or annotations at all. In the following\
    \ sections we'll port the example to other DI containers, and we'll see that PicoContainer\
    \ is the only one that requires little configuration by us."
