  md: "We'll move the functionality that's specific to each domain entity into a separate\
    \ helper class. Take a look at KnowsTheCashSlot, for example:\n\n```\ndependency_injection/pico/02/src/test/java/support/KnowsTheCashSlot.java\n\
    package support;\nimport niceback.CashSlot;\n\npublic class KnowsTheCashSlot {\n\
    \    private CashSlot cashSlot;\n```\n\n```\npublic CashSlot getCashSlot() {\n\
    \    if (cashSlot == null) {\n        cashSlot = new CashSlot();\n    }\n    return\
    \ cashSlot;\n}\n\n```\n\nSimilarly, we can create the KnowsTeller and KnowsTheAccount\
    \ helper classes.\n\nNext we have to change references to KnowsTheDomain, such\
    \ as in CashSlotSteps:\n\n```\ndependency_injection/pico/02/src/test/java/nicebank/CashSlotSteps.java\n\
    import support.KnowsTheCashSlot;\n```\n\n```\npublic class CashSlotSteps {\n \
    \   KnowsTheCashSlotHelper;\n```\n\n```\npublic CashSlotSteps(KnowsTheCashSlotHelper)\
    \ {\n    this.cashSlotHelper = cashSlotHelper;\nn}\n```\n\nNot all changes are\
    \ quite simple. For TellerSteps, for example, interacts with KnowsTheAccount as\
    \ well as KnowsTeller, so we have to pass both in the constructor. The DI framework\
    \ can handle multiple parameters, and calls the constructor correctly without\
    \ extra work on our part:\n\n```\ndependency_injection/pico/02/src/test/java/nicebank/TellerSteps.java\n\
    ```\n\n```\npublic TellerSteps(KnowsTheTeller tellerHelper, KnowsTheAccount accountHelper)\
    \ {\n    this.tellerHelper = tellerHelper;\n    this.accountHelper = accountHelper;\n\
    }\n```\n\nOnce we finish moving functionality into the new helper classes, we\
    \ notice that there is still some code in KnowsTheDomain that's concerned with\
    \ creating a shared EventFiringWebDriver. Since this is specific to the technology\
    \ driving the user interface, it's not logically a concern of any of the KnowsThexx\
    \ classes, so we need to decide where to put it, which we'll do next."
