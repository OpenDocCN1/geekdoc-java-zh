  md: "This scenario introduces the idea that an ATM contains a limited amount of\
    \ money. We'll need to implement a way to specify how much money to load into\
    \ the ATM, and check that we have sufficient funds before we attempt to dispense\
    \ money to the customer:\n\n```\nfast/03/src/main/java/nicebank/CashSlot.java\n\
    public void load(int dollars) {\n    available = dollars;\n}\n\npublic void dispense(int\
    \ requested) {\n    if (available >= requested) {\n        contents =\n      \
    \  available -= requested;\n    } else {\n        throw new RuntimeException(\"\
    Insufficient ATM funds\");\n    }\n}\n```\n\nWe also need to make sure that original,\
    \ successful withdrawal scenario keeps working. We could do this by adding an\
    \ extra step to load the ATM, but this would be an incidental detail. Instead\
    \ we add a constructor to our TestCashSlot that makes sure there's plenty of cash\
    \ available for any scenarios that aren't specifically interested in how much\
    \ money is in the machine:\n\n```\nfast/03/src/test/java/support/TestCashSlot.java\n\
    public TestCashSlot() {\n    super.load(1000);\n}\n```\n\nWe can now run mvn test\
    \ and see all three scenarios.\nWe added two extra scenarios, but already our\
    \ feature takes longer to run. If we don't do something, it won't long before\
    \ the team stops running the scenarios. Next we'll take a look at the simplest\
    \ way to speed up.\n\n# Reusing the Browser\n\nEach of our scenarios is exercising\
    \ our application through our web UI and so needs to use a browser. At the moment\
    \ we start a new instance of Firefox for each scenario, which takes a fair amount\
    \ of time. Is it really necessary, or could our scenarios all use the same instance\
    \ of Firefox?\n\nIt's important that each scenario is isolated from all other\
    \ scenarios, but the browser itself holds very little content. In most situations\
    \ it is quite safe to reuse the browser instance for all scenarios as long as\
    \ you clear out any cookies. In this example it's even simpler—we have no cookies."
