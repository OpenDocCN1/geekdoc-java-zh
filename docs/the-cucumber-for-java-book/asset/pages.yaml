  md: "# KnowsTheAccount\n\nRemoving KnowsTheAccount is more complicated, because\
    \ (as is now clear) it has several responsibilities. It does the following:\n\n\
    +   - Opens a database connection (if necessary)\n- Deletes any existing accounts\n\
    - Creates an account with a specified account number\n\nLet's start by moving\
    \ the database connection and account deletion into ResetHooks. We need to ensure\
    \ that this runs before any other hook that needs a database connection, so we\
    \ specify a low order number:\n\n```\ndependency_injection/pico/05/src/test/java/hooks/ResetHooks.java\n\
    public class ResetHooks {\n    @Before(order = 1)\n    public void reset() {\n\
    \        if (!Base.hasConnection()) {\n            Base.open(\n              \
    \  \"com.mysql.jdbc.Driver\",\n                \"jdbc:mysql://localhost/bank\"\
    ,\n                \"teller\", \"password\"\n            );\n            Account.deleteAll();\n\
    \            TransactionQueue.clear();\n        }\n    }\n}\n```\n\nNow KnowsTheAccount's\
    \ only responsibility is to store a test account in the database, so the name\
    \ no longer makes sense. Rename it TestAccount and extend Account:\n\n```\ndependency_injection/pico/05/src/test/java/support/TestAccount.java\n\
    package support;\nimport nicebank.Account;\npublic class TestAccount {\n    public\
    \ TestAccount() {\n        super(1234);\n        saveIt();\n    }\n}\n```\n\n\
    When we inject a TestAccount directly into our steps. PicoContainer will ensure\
    \ that they all get a reference to the same, newly created Account object. Try\
    \ it—it still works.\n\nWe could have done everything in this section without\
    \ using DI at all, but you can see how things are made so much simpler when the\
    \ DI container"
