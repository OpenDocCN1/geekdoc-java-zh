  md: 'Selenium also provides the Cookie class as a wrapper to make working with cookies
    easy. If you want to add a cookie to your browser session, it''s as simple as
    this:


    ```

    Cookie cookie = new Cookie("name", "value");ndriver.addCookie(cookie);

    ```


    Even if our web application used cookies, we probably wouldn''t have needed to
    manage them yet, because browser restarts for each scenario and we only have a
    single scenario away. By the end of this chapter we''ll have several scenarios
    running in a single browser session, or if our application used cookies we would
    need to start managing them carefully.


    # Managing Timeouts


    Another useful piece of functionality available through the Selenium driver''s
    manage interface is the timeout, which is used to alter the various timeouts that
    Selenium will wait before signaling an error. This can be used, for example, to
    ensure a page has time to load before looking a specific WebElement on: driver.manager().timeout().pageLoadTimeout(10,
    TimeUnit.SECONDS).


    You can also tell the driver to poll the DOM for a certain period of time while
    looking for a particular WebElement—for example: driver.manager().timeout().implyWait(10,
    TimeUnit.MILLISECONDS). This can help when some of the elements on the page take
    a certain amount of time to be rendered and Selenium''s own implementation of
    exactly what we did in Synchronization by Sampling, on page 172.


    The downside of using these timeouts is that they apply globally to all Selenium
    calls, which can make failing scenarios very slowly. You''ll learn a more focused
    approach later in Synchronization in Selenium, on page 242.


    This section has given you more quite a taste of the automation possibilities
    that Selenium has to offer. We''ll use some of these features when we write step
    definitions in the following sections. We''ll be particularly grateful for the
    timeout functionality when we begin using Ajax towards the end of the chapter.
    We''ve got a lot to do, so let''s get started.


