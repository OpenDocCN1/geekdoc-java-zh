  md: "# Separating the Support Code\n\nWe should also aid the helper class. This\
    \ is what we call support code, so we will put it in a new folder, src/test/java/support.\
    \ Take the KnowsTheDomain class and move it into a new file, called src/test/java/support/KnowsTheDomain.java.\
    \ As we add more methods to our KnowsTheDomain, we will split it into multiple\
    \ classes; however, this is fine for now.\n\nSince KnowsTheDomain is in the support\
    \ package, we'll need import statements for the domain classes Account, CashSlot,\
    \ and Teller.\n\n```\nstep_definitions_inside/17/src/test/java/support/KnowsTheDomain.java\n\
    import nicebank.Account;\nimport nicebank.CashSlot;\nimport nicebank.Teller;\n\
    }\n```\n\n# Organizing Our Step Definitions\n\nWe've managed to get this with\
    \ a single file of step definitions called Steps.java, and for a project of this\
    \ size, we might as well stick with a single file for a while longer. As the number\
    \ of step definitions starts to grow, we'll want to split the files so that the\
    \ code is more cohesive. We've found that our favorite way to organize step definitions\
    \ is to organize them with one file per entity. So, in our example, we have three:\n\
    \n```\nsrc/test/nicebank/AccountSteps.java\nsrc/test/nicebank/TellerSteps.java\n\
    src/test/nicebank/CashSlotSteps.java\n```\n\nIn our first attempt at doing this\
    \ refactor, we give each of the classes one constructor that creates an instance\
    \ of KnowsTheDomain:\n\n```\nstep_definitions_inside/18/src/test/java/nicebank/AccountSteps.java\n\
    KnowsTheDomain helper;\npublic AccountSteps() {\n    helper = new KnowsTheDomain();\n\
    }\n```\n\nLet's run mvn test and see what happens:\n\n```\njava.lang.AssertionError:\
    \ Incorrect amount\n      - expected:<20> but was:<0>\n    at org.junit.Assert.fail(Assert.java:743)\n\
    \    at org.junit.Assert.failNotEquals(Assert.java:433)\n    at org.junit.Assert.assertEquals(Assert.java:118)\n\
    \    at org.junit.Assert.assertEquals(Assert.java:555)\n    at nicebank.Steps.$ShouldBeDispensed(Steps.java:95)\n\
    \    at *.Then $20 should be dispensed(cash_withdrawal.feature:5)\n```"
