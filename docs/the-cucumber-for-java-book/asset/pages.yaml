  md: '# Color or Monochrome Output


    By default, the bundled plugins produce colored output to help emphasize the outcome
    of each step. This is done by inserting control characters into the output, but
    sometimes this is not what you want. Simply supply the --monochrome option and
    the output will be plain text.


    # Overriding Cucumber Options


    There are several ways you can set the options to control how Cucumber runs your
    features. Learning how they interact is useful if you want Cucumber to behave
    differently depending on how you invoke it. Let''s look at the various ways you
    supply options to Cucumber and how they interact.


    # How Cucumber Overrides


    Cucumber options initially get set by the arguments you provide to your runner—either
    directly on the command line for cucumber.api.cli.Main or using a @CucumberOptions
    annotation for the JUnit or TestNG runners.


    Cucumber then looks to see if any option overrides have been provided. looks in
    the following three places:


    +   1. The OS environment variable CUCUMBER_OPTIONS

    2. The Java system property cucumber.options

    3. The Java resource bundle cucumber.properties with a cucumber.options property
    Overrides are provided in a variable (or property) called cucumber.options or
    CUCUMBER_OPTIONS. Cucumber searches for this variable in the order shown here
    and uses the first value it finds. It will not continue to search other locations
    once it has found an override.


    Except for the plugin argument, values found in the override replace any values
    already set. Arguments not mentioned in the override will not affect any value
    already supplied for that argument.


    The plugin option is handled slightly differently. The list of plugins specified
    by the override is combined with any plugins already specified. This can cause
    a problem if Cucumber ends up with more than one plugin trying to output to STDOUT,
    in which case you''ll get this error: Only one plugin can use STDOUT.


    The plugin option is also the only one for Cucumber provides a default. If no
    plugin is specified, then Cucumber will always use the progress plugin to output
    to STDOUT.'
