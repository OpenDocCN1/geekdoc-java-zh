  md: 'fast/05/src/test/resources/cash_withdrawal.feature


    **Scenario:** Unsuccessful withdrawal due to insufficient ATM funds

    My account is in credit

    And the ATM contains $10

    When I type $20

    Then I should see an ask-for-less-money message


    There is a subtle but difference in our When step here. We''re only typing text,
    unlike the When step in our previous scenario, we are not submitting the form
    by clicking the button or pressing the Enter/Return key. We have an idea about
    how to implement this feature—we''ll use Ajax request when the user types a character,
    and when the response comes back, we''ll display a message on the same page without
    a de..


    # Entering an Amount


    When we run mvn clean test, Cucumber exits with a missing step definition. We
    need to tell it how to enter text in a field without submitting the form. That''s
    easy! We''ll implement the undefined step definition almost like the one we use
    in our previous scenario, except this we won''t press the Submit button—are only
    going to fill the field


    If you run the feature again and look carefully, you''ll see that the amount is
    filled with the amount requested from our Gherkin scenario before the browser
    is closed when the scenario is de. Neat! This leaves us with only one failing
    step—the one where we need to verify that the error message is being displayed.
    It''s time to take a little break and think about how we are going to implement
    this with Ajax and dynamic HTML.


    # Designing Our Live Messages


    When the user types in the amount and waits a short time, the browser will issue
    an Ajax GET request to ask if the ATM contains sufficient funds. There''s one
    important difference about this request—it will have an additional Accepts HTTP
    header, indicating to the server that we want the response JSON (instead of HTML).
    When the response comes back to the, we''ll iterate over the JSON we get and create
    the notification message (if necessary) dynamically with JavaScript.'
