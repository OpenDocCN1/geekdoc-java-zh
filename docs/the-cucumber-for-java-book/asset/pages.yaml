  md: "# Auto-Conversion Magic\n\nHave you wondered how Cucumber knows what arguments\
    \ to use in the step definition snippets it generates? First, it generates one\
    \ argument capture group in the regular expression. Then, for each capture group,\
    \ it matches only numbers it creates an int parameter; otherwise it creates a\
    \ String parameter. For example:\n\n```\n@Given(\"a = amount\\(\\d+)\\\")\npublic\
    \ void aDollarAmount(String arg1, int arg2) Throwable {\n}\n```\n\nIf you wanted\
    \ to manipulate digits as a String? No problem—just a little hint from Cucumber\
    \ to you. If you'd like to use a different type, then just change the signature\
    \ of the step definition, like so:\n\n```\n@Given(\"a = amount\\(\\d+)\\\")\n\
    public void aDollarAmount(String arg1, int arg2) Throwable {\n}\n```\n\nUnder\
    \ the hood, Cucumber represents each capture group in the regular expression as\
    \ a String. When calling, the step definition converts the String into the type\
    \ expected. If it can't convert it, it throws a cucumber.runtime.CucumberException,\
    \ or otherwise the conversion happens automatically—as by magic.\n\nstep_definitions_inside/07/src/test/java/nicebank/Steps.java\n\
    \n```\n@Given(\"I have deposited\\(\\d+\\.\\d+\\)\\) in my account$\")\npublic\
    \ void iHaveDepositedInMyAccount(Money amount) throws Throwable {\n  Account myAccount\
    \ = new Account();\n  myAccount.deposit(amount);\n}\n```\n\n```\nAssert.assertEquals(\"\
    Incorrect account balance --\", myAccount.getBalance());\n```\n\nNow we need to\
    \ know how Cucumber can convert a String into a Money object. One approach would\
    \ be to give our Money class a single argument constructor that takes a String.\
    \ Cucumber would then automatically invoke this when calling the step definition.\
    \ passing in the original String that matched the regular expression in our capture\
    \ group.\n\nstep_definitions_inside/07/src/main/java/nicebank/Money.java\n\n```\n\
    public Money(String amount) {\n  Pattern pattern = Pattern.compile(\"^\\d*([\\\
    d]+)\\.([\\d]+)\\$\");\n  Matcher matcher = pattern.matcher(amount);\n```\n\n\
    ```\n  matcher.find();\n  this.dollars = Integer.parseInt(matcher.group(1));\n\
    \  this.cents = Integer.parseInt(matcher.group(2));\n}\n```"
