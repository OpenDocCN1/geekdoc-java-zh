  md: '# Spoken Languages


    Remember earlier we said that you can write your Gherkin features in the spoken
    language of your stakeholders? Here''s how.


    Putting a # language: comment on the first line of a feature file tells Cucumber
    spoken language that feature is written in. If you omit this header, Cucumber
    will default to English, as you''ve already seen.


    Here''s an example of a feature written in Norwegian:


    ```

    # language: no

    Egenskap: Summering

    For å unngå at firmaet går konkurs

    Må regnskapsførere bruke regnemaskin for å legge sammen tall


    Scenario: to tall

    Gitt at jeg har tastet inn 5

    Og jeg har tastet inn 7

    år jeg summerer

    Så skal resultatet være 12

    ```


    If you''re wondering whether Cucumber knows how to speak your language, you can
    ask it for the list of all valid languages with this command:


    ```

    $ ./cucumber --i1n help

    ```


    When you''re working with a particular language, you can discover the key-words
    by passing the language code (as listed by the previous command) with the --i8n.
    Here''s Japanese, for example:


    ```

    $ ./cucumber --i1n ja

    ```


    The --i8n option only became available in Cucumber-JVM 1.2.0. Prior to that, the
    easiest way to find out what languages were supported was to look in the Gherkin
    project at lib/gherkin.json.⁵


    One of the greatest benefits of working with a tool like Cucumber is the conversations
    with your stakeholders as you write the scenarios. These conversations can help
    you find gaps and misunderstandings that might have emerged only after you''ve
    spent days or weeks working on the code. So, even if you never run the tests,
    just writing them can help you go faster.


    +   5. https://github.com/cucumber/gherkin/master/lib/gherkin/i18n.json'
