  md: 'This makes for a very fluent interface that reads like an English sentence:

    "element by id dateOfBirth."


    The id factor method is only one of many provided. Others include xpath, link-Text,
    name, className, and inputfieldName—check the Selenium documentation for more.
    All the method names are self-explanatory and help to keep your steps easy to
    read (and maintain).


    Once you''ve got hold of the WebElement you''re interested in, you''ll want to
    do things with it. You have plenty of methods to choose from, all with descriptive,
    self-explanatory names like click, sendKeys, and submit. The actual behavior of
    the HTML control behind a WebElement instance depends on what type of control
    it is. For example, calling on a check box will change its selected state, whereas
    calling on a button will cause a button press to occur.


    # Switching Windows


    Of course not all apps have a single browser window, so you may need to switch
    between windows or frames. Selenium provides the switchTo method for this purpose.
    For example, you can switch to another window by name: driver.switchToTo().window("myWindow").
    Once this method has been called, the driver will direct further Selenium calls
    to the window.


    As well as the window methods, frame and alert are available to direct calls to
    a specified IFrame or alert box, respectively.


    # Cookie Management


    The Selenium driver also has the manage method to give you direct access to the
    current browser session. You''ll need this to manage cookies if your web app uses
    them. Selenium provides methods with descriptive names, such as addCookie, deleteCookies,
    and getCookieNamed, which you use like this: driver.manager().getCookieNamed("my-cookie");


