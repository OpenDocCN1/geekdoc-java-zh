  md: "# Extracting a Web Driver\n\nBoth AtmUserInterface and WebHooks are dependent\
    \ on a shared EventFiring-Driver. This used to be managed by KnowsTheDomain but\
    \ really has nothing to do with the domain. Instead, lets extract a new MyWebDriver\
    \ class:\n\n```\ndependency_injection/pico/02/src/test/java/support/MyWebDriver.java\n\
    package support;\n\nimport org.openqa.selenium.firefox.FirefoxDriver;\nimport\
    \ org.openqa.selenium.support.events.EventFiringDriver;\n\npublic class MyWebDriver\
    \ extends EventFiringWebDriver{\n    public MyWebDriver() {\n        super(new\
    \ FirefoxDriver());\n    }\n}\n```\n\nThere's no code left in KnowsTheDomain,\
    \ so we can delete it. However, we still have to inject the shared WebDriver instance\
    \ into AtmUserInterface and WebDriver-Hooks by changing their constructors:\n\n\
    ```\ndependency_injection/pico/02/src/test/java/support/AtmUserInterface.java\n\
    private final EventFiringWebDriver driver;\n```\n\npublic AtmUserInterface(MyWebDriver\
    \ driver) {\n    this.webDriver = driver;\n}\n\n(The WebHooks constructor looks\
    \ the same.)\n\nNow we run mvn clean test to make sure we haven't introduced any\
    \ defects. We've improved by decoupling the UI from the domain entities. Our DI\
    \ container now has the responsibility of managing a shared instance of WebDriver\
    \ and injecting it into any constructor that needs it. In the next step, we'll\
    \ see that most of the helper classes are doing nothing (or very little) that\
    \ our DI container can't do for us, so we'll refactor them away entirely.\n\n\
    # Replacing the Helper Classes\n\nAt this point, we've created smaller, more cohesive\
    \ helper classes, so now let's take a good look at each of them to see if we're\
    \ happy with the structure of our test code. Now that we have smaller helper classes\
    \ it's easier to see exactly which one does and decide, armed with our deeper\
    \ understanding of DI, if we could do better. And if we think that we could improve\
    \ things further, we still have the safety net of a passing scenario to ensure\
    \ we don't break anything while we continue the refactoring."
