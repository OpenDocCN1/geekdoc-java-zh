  md: "ATM. When we added the fault handling scenarios, we saw the feature runtime\
    \ start to get longer, so we applied a simple technique to reduce it by sharing\
    \ a single browser session among all our scenarios. And then we extended our ATM\
    \ using Ajax to give feedback to our customer, which taught us another way to\
    \ provide synchronization using Selenium.\n\nThere are a lot of features that\
    \ we would want to implement in our ATM, and would lead to more scenarios. Sharing\
    \ a single browser session between them all will greatly help control the runtime,\
    \ but we'll need to consider other techniques as well if we want able to run hundreds\
    \ (or thousands) of scenarios in an acceptable amount of time. This is what we'll\
    \ be looking at in the next chapter.\n\n# Try This\n\nSelenium can be used outside\
    \ of Cucumber too. A handy way to get grips with Selenium is to automate some\
    \ dull, repetitive task that you have to do on the Web, such as filling in spreadsheets\
    \ or downloading your bank statement.\n\nWe've provided a old Java project that\
