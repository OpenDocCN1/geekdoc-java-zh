  md: '# APPENDIX 1


    # # Installing Cucumber


    Cucumber for Java is packaged as a series of JAR files. You can install simply
    by downloading the relevant JAR files and placing them on the Java classpath,
    which is what we did in Chapter 2, First Taste, on page 11. More likely you''ll
    be using some dependency management tool in your build process, such as Maven
    or Ivy, but this still requires you to specify the leaves of the dependency tree.
    This can be confusing, and that''s what this appendix will explain.


    # ## Choosing Your JARS


    The current release of Cucumber for Java contains nineteen JARS, which split into
    four groups, described in the following sections. You will need to select the
    JARS that are relevant to your environment. As you''ll see, some choices are optional,
    whereas others are required. Full details are outlined below and further information
    can be found online.¹


    # ### Core JARS


    The core JAR cucumber-core is always needed. As its name suggests, it implements
    the core functionality of Cucumber.


    If you''re using a dependency management tool, then you''ll never need to specify
    cucumber-core because the other Cucumber JARS that you have to specify (specifically
    the Programming Language Module) depend on it, and so it will always be present
    in the dependency graph. If you''re downloading JARS manually, then you''ll need
    to download it.


    +   1. http://cukes.info/install-cucumber-jvm.html'
