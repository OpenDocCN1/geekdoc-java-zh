  md: "# Chapter 12. Working with Web Applications 242\n\nNow when we run mvn test\
    \ the ask method puts up a dialog box when we expect the notification method to\
    \ be visible. And enough, there is: \"Insufficient ATM funds! It looks like we\
    \ have yet another issue to sort out in the next section.\n\n# Synchronization\
    \ in Selenium\n\nWhat's missing? It can be a little hard to tell at this point.\
    \ Pausing the scenario using ask has helped us understand that the notification\
    \ is being displayed—eventually.\n\nIn our step, we are typing the amount to be\
    \ withdrawn and then verifying that we have the expected notification on the page.\
    \ The problem is—we are looking for the results too soon, before the Ajax query\
    \ has a chance to complete! As we discussed in Chapter 9, Message Queues and Asynchronous\
    \ Components, on page 169, we need to introduce a synchronization point so that\
    \ we can be sure the validation request completed before we proceed checking what\
    \ it returned.\n\nLuckily, Selenium has a number of different ways to deal with\
    \ this situation in a simple way. In this case we use the helper class DriverManager\
    \ to poll the page every 30 milliseconds for up to 20 seconds:\n\n```\nfast/09/src/test/java/support/AtmInterface.java\n\
    public boolean isDisplay(String message) {\n By locator = By.xpath(\"*contains(text(),'\
    \ + message + '\\')\");\n\n WebDriverWait wait = new WebDriverWait(driver, 2,\
    \ 30);\n WebElement element = wait.until(\nExpectedConditions.presenceOfElementLocated(locator));\n\
    \n List<WebElement> list = driver.findElements(locator);\n return (list.size()\
    \ > 0);\n}\n```\n\nThis will make the scenario pass, and what's more, we have\
    \ covered the essential parts of the Selenium API. Selenium has more to offer,\
    \ but it's mostly variations of what we have already seen.\n\n# What We Just Learned\n\
    \nWe've covered a lot of good in this chapter. We started by taking a quick tour\
    \ of the most useful parts of the Selenium API, and we used some of them when\
    \ we came to implement basic fault handling in our\n\n+   8. http://selenium.com/2013/01/29/webdriver-wait-commands/"
