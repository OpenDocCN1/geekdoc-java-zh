  md: "How does it know which table to look at? ActiveJDBC espouses a principle of\
    \ convention over configuration. This means the expected name for the database\
    \ table represented by the Account ActiveJDBC class is accounts; if the table\
    \ were named widgets, we'd call the class Widget. As long as we stick to those\
    \ conventions, we get a lot of useful benefit for very little code.\n\n# Tweaking\
    \ ActiveJDBC for Nonconventional Databases\n\nActiveJDBC's default conventions\
    \ are great if you're building a database from scratch, but what if you're working\
    \ with a legacy system? If your database doesn't fit ActiveJDBC's conventions,\
    \ you can override the default conventions:\n\n```\n@Table(\"tblAccounts\")\n\
    class Account extends Model {\n    int getNumber() {\n        return getInteger(\"\
    intNumber\");\n    }\n\n    void setNumber(int number) {\n        setInteger(\"\
    intNumber\", number);\n    }\n}\n```\n\nThe @Table annotation tells ActiveJDBC\
    \ the name of the table you want to use.\n\n# Managing the Schema with Liquibase\n\
    \nIt's not enough to have a simple way of connecting your code to your database;\
    \ you'll also need to control the evolution of your database schema. Several frameworks\
    \ are available for managing your schema from the JVM, and we'll use one of the\
    \ most popular ones, Liquibase.\n\nWe define each incremental change to the schema\
    \ as a changeset within a changelog. The changelog is a plain XML file, so it\
    \ can easily be committed to your source control system (along with the code)\
    \ and managed using normal tools. Each changeset is uniquely identified by a combination\
    \ of ID and author. Liquibase keeps track of which changets have been applied\
    \ to your database in a special table (databasechangelog), meaning it can always\
    \ tell which changets need to be applied to bring a schema up to date.\n\nUsing\
    \ a Liquibase changelog you can easily create a database from scratch, upgrade\
    \ a database to the latest schema version, roll back to a previous version. It's\
    \ a powerful, well-documented tool, so if you start using it some time to read\
    \ through the features it provides. For the rest of this chapter we'll use it\
    \ to create our very simple banking schema, and the examples should be self-explanatory."
