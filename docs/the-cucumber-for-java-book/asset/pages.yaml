    \  <version>${cdi.version}</version>\n</dependency>\n<dependency>\n  <groupId>org.jboss.weld.se</groupId>\n\
    \  <artifactId>weld-se</artifactId>\n  <version>${weld.version}</version>\n</dependency>\n\
    ```\n\nIn the same way as we have seen with the preceding DI containers, we need\
