    \ test to check it's all working.\n\n# Some Spring Configuration Magic\n\nThe\
    \ Spring configuration file is very powerful. In this section we'll see how we\
    \ can use the configuration file to specify that a class is a bean without having\
    \ to modify the Java code at all.\n\n# Beans with No-arg Constructors\n\nSpring\
    \ provides an alternative to specify which classes are candidates for injection\
