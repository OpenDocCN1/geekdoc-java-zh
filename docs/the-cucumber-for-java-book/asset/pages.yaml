  md: "# Chapter 7. Step Definitions: On the Inside • 126\n\nBut if the Money didn't\
    \ have a String constructor and wasn't ours to modify? In that case, we're going\
    \ to need to learn another Cucumber feature, the Transformer class, which allows\
    \ us to create the instances of Money that we want without giving it a new constructor.\n\
    \nTransformers work on captured arguments. Each transform is responsible for converting\
    \ a captured String into something more meaningful. For example, we can use a\
    \ Transformer to take a String argument that contains a monetary amount and turn\
    \ it into an instance of our Money class. Let's create a MoneyTransformer and\
    \ transform it a little in a new folder, test/transforms:\n\n```\nstep_definitions_inside/08/src/test/java/transforms/MoneyConverter.java\n\
    package transforms;\n```\n\n```\nimport cucumber.api.Transformer;\n\nimport nicebank.Money;\n\
    \npublic class MoneyConverter extends Transformer<Money>\n    public Money transform(String\
    \ amount) {\n        String[] numbers = amount.split(\"\\\\\\\");\n\n        int\
    \ dollars = Integer.parseInt(numbers[0]);\n        int cents = Integer.parseInt(numbers[1]);\n\
    \n        return new Money(dollars, cents);\n    }\n```\n\nWe then annotate the\
    \ parameter in the step definition to tell Cucumber which Transformer to use:\n\
    \nGreat! That code looks much cleaner and easier to read.\n\nWe can tidy this\
    \ little further by moving the dollar sign into the capture group. This makes\
    \ the code more cohesive, because we're bringing together"
