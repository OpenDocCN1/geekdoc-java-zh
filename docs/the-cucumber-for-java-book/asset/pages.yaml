  md: 'scenarios that force an error to happen so that we can drive out our error
    handling functionality.


    Our running scenario describes the situation where a customer who has money in
    his account successfully withdraws some of it using the ATM. What happens if the
    mechanism that counts and dispenses the money malfunctions? If the ATM doesn''t
    contain enough money to fulfill the customer''s request? We''re sure you can think
    up plenty of other situations that need to be considered, and that''s just to
    give you an idea.


    Now we implement the scenarios that you captured while working with your stakeholders.
    Since Spring is such a popular DI container, we''ll start from the code that we
    wrote in [Spring in Your Steps, on page 218](). We won''t spend a lot of time
    describing the code, because you learned most of this earlier in the book, but
    we will describe new Selenium functionality as we use. You can always jump ahead
    to [Reusing the Browser, on page 233]() if you want to skip the development phase.


    # A Faulty ATM


    The first scenario we decide to handle is where the ATM develops a fault after
    the user tries to withdraw money before money is dispensed. Working with stakeholders,
    we capture this scenario as:


    ```

    fast/01/src/test/resources/cash_withdrawal.feature

    Scenario: Unsuccessful withdrawal due to technical fault

    Given my account has been credited with $100.00

    But the slot has developed a fault

    When I withdraw $20

    Then I should see an out-of-order message

    And $0 should be dispensed

    And the balance of my account should be $100.00

    ```


    There are two new steps in this scenario: one injects a fault into the cash slot
    and also checks that the correct error message is displayed to the user. We''ll
    look at both of these before seeing if we can do anything to improve how the scenario
    reads.


    # Injecting a Fault


    We''d like to make sure that our software behaves correctly when something goes
    wrong with the ATM mechanism, represented by our CashSlot. We wouldn''t want to
    change our production code, so we create a TestCashSlot(that extends CashSlot)
    to allow us to simulate a fault:'
