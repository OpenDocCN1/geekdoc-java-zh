  md: 'The Steps file can be split to organize the step definitions better. This is
    arguably unnecessary for a project with only three step definitions, but we''ll
    do it illustrate how we do this on a bigger project.


    # Separating the Application Code


    It''s conventional in Java projects to store the system''s code in an src folder
    in the root of the project. Normally your production code would be created in
    a relevant named package. Our company is trying to stand out from the crowd with
    the brand name NiceBank, so we''ll put out our production code into the folder
    src/main/java/nicebank alongside the Money class that has already been written.


    Let''s move the three classes, Account, Teller, and CashSlot, into the files Account.java,
    Teller.java, and CashSlot.java in the src/main/java/nicebank package. As we do
    this, we''ll need to specify that the classes are in the nicebank package and
    make them public.


    Since Steps is also in the nicebank package, no imports are needed.


    Save the files and run mvn test.


    # Dry Run


    As we start to move files around, it''s useful to test that everything matches
    using Cucumber''s "dry run" feature. A dry run aims to parse your features and
    step definitions but not actually run them.


    ```

    step_definitions_inside/16/src/test/java/RunCukesTest.java

    import cucumber.api.junit.Cucumber;

    import cucumber.api.CucumberOptions;

    import cucumber.api.SnippetType;

    import org.junit.runner.RunWith;


    @RunWith(Cucumber.class)

    @CucumberOptions(plugin="pretty", snippets=SnippetType.CAMELCASE, dryRun=true)

    public class CucumberTest {

    }

    ```


    This is much faster than a test run if you just want to check for undefined steps
    and make sure that all paths are set up correctly. Get used using dryRun to refactor
    your scenarios and step definitions, but remember that since no calls are actually
    made to your step definitions this doesn''t test your conversions or transforms.'
