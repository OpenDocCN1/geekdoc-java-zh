  md: "We've fixed the failure in shutdownServer, but we're still trying to create\
    \ a duplicate account. That's because, although we annotated the glue code with\
    \ @ScenarioScoped, Guice is still creating a new instance of every injected class\
    \ time it needs to be injected. Since we are using injection to share the same\
    \ instance between several objects, we need to annotate these classes as well.\
    \ The classes that need to be annotated are AtmInterface, CashSlot, MyWebDriver,\
    \ and TestAccount.\n\nThe only class that presents a problem is CashSlot, because\
    \ it is part of our production code, and we may not want to add an annotation\
    \ to keep our test framework happy. One alternative is to create a TestCashSlot\
    \ that extends CashSlot, which keeps Guice annotations free for our test code:\n\
    \n```\ndependency_injection/guice/04/src/test/java/support/TestCashSlot.java\n\
    package support;\n```\n\n```\nimport cucumber.runtime.java.guice.ScenarioScoped;\n\
    \nimport nicebank.CashSlot;\n```\n\n```\n@ScenarioScoped\npublic class TestCashSlot\
    \ extends CashSlot {\n}\n```\n\nHowever, now we need to tell Guice to create an\
    \ instance of TestCashSlot, CashSlot. We can do this by changing the signatures\
    \ of the @Inject-annotated constructors that currently take a CashSlot:\n\n```\n\
    dependency_injection/guice/04/src/test/java/nicebank/CashSlotSteps.java\nCashSlot\
    \ cashSlot;\n```\n\n```\n@Inject\npublic CashSlot CashSlot(TestCashSlot cashSlot)\
    \ {\n  this.cashSlot = cashSlot;\n}\n```\n\nNow the test passes!\n\n# @Singleton\
    \ Annotation\n\nIn the previous section we applied the @ScenarioScoped annotation\
    \ indiscrimin to every class that is being managed by Guice. This means a new\
    \ instance will be created for every scenario run. That's not a problem for us\
    \ at the moment because we have only one scenario, but this approach could be\
    \ wasteful, if the objects are expensive to construct.\n\nThe other supported\
    \ scope, @Singleton, allows Cucumber to construct only a single instance for all\
    \ scenarios that will be run. This strategy should be"
