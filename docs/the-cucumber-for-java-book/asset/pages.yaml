  md: '# Chapter 14. Controlling Cucumber * 268


    @CucumberOptions(glue="step_definitions", features="features")


    # Supplying Multiple Values for a Property


    If you want to specify multiple values for a property, you can use a list. Here
    we''re specifying list of two plugins we want to use:


    ```

    @CucumberOptions(glue="step_definitions"

    ```


    You can use lists of strings for features, glue, plugin, and tags.


    # Snippets


    The snippets option is tied, so you''ll use one of the constants provided, SnippetType.CAMCASE
    or SnippetType.UNDERSCORE:


    ```

    @CucumberOptions(glue="step_definitions", features="features", snippetType=SnippetType.CAMCASE)

    ```


    Remember: You must add import cucumber.api.SnippetType to your class.


    # Tag Expressions


    To run all scenarios tagged with a specific tag, use the tag: follow the following:


    ```

    @CucumberOptions(tags="@TagA", glue="step_definitions", features="features")

    ```


    Tag terms can be combined to form logical expressions as described earlier. To
    run all our scenarios with either @TagA or @TagB, we''d write:


    ```

    @CucumberOptions(tags="@TagA,@TagB", glue="step_definitions", features="features")

    ```


    To run all scenarios tagged with both @TagA and @TagB, we''d write:


    ```

    @CucumberOptions(tags={"@TagA", "@TagB"}, glue="step_definitions", features="features")

    ```


    We can use the (NOT) operator - as described


