    means that Cucumber will instantiate a new instance of the class for each step
    within a scenario that uses that definition.9


    We have two potential scopes to choose from: @ScenarioScoped and @Singleton. In
    general we will use @ScenarioScoped, because this ensures that state is reset
    before each scenario starts to run.


