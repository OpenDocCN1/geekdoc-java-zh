    # Joe asks:

    How Many Examples Should I Use?


    Once you have a scenario outline with a few examples, it''s very easy to think
    of examples, and even easier to add them. Before you know it, you have a huge,
    very comprehensive table of examples—and a problem.


    Why?


    On a system of any serious complexity, you can quickly start to experience what
    mathematicians call combinatorial explosion, where the number of combinations
    of inputs and expected outputs becomes unmanageable. In trying to cover every
    possible event, you end up with rows of example data for Cucumber that might take
    several seconds to execute. Remember that each of those little rows represents
    a scenario that might quickly start up. When your tests take longer to run, slow
    down your feedback loop, making the whole team less productive as a result.


    A really long is also very hard to read. It''s better to make your examples illustrative
    or representative than exhaustive. Try to stick with Gohko Adic calls the key
    examples. If you study the code you''re testing, you''ll often find that rows
    of your examples cover the same logic as another row in the table. You might also
    find that the cases in your table are already covered by unit tests of the underlying
    code. If they are not, consider whether they should be.


    Remember readability is what''s most important. If your stakeholders feel exhausted
    by exhaustive tests, because your software operates in a safety-critical environment,
    then by means put them in. Just remember that you''ll never be able to prove there
    are no bugs. As logicians say, absence of proof is not proof of absence.


    +   a. Specification by Example [Ad 11]


    Although this is a useful technique, be careful that your programmer''s instinct
    to reduce duplication at all costs doesn''t take over here. If you move too much
    of the test into steps into the table, it can be very hard to read the flow of
    the scenario. Remember your goal is readability, don''t take this too far, and
    always test your features by getting other people to regularly read them and give
    you feedback.


    +   2. See this point explained in detail by David Chelinsky: http://confreaks.net/videos/434.'
