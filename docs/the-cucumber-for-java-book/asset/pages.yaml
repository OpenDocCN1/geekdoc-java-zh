  md: '# CHAPTER 13


    # Keeping Your Features Fast


    We''ve driven out some new functionality in our CashSlot to handle errors that
    might arise when the ATM tries to dispense money to the customer. We also implemented
    functionality that lets users know if the ATM doesn''t hold enough money to satisfy
    their request before they even press the Submit button. The scenarios are all
    running through the ATM UI in a single browser session, which seems fast enough
    at the moment.


    However, we''ll want to develop hundreds, if not thousands, more scenarios before
    we ship our integration so the runtime of our features will continue to increase.
    Many of the scenarios that we write exercise the same parts of the UI over and
    over again, not because it gives us any confidence in the application, but because
    that''s the only way we are able to demonstrate the behaviors we''re interested
    in. Before you know it, you''ll be waiting hours rather than minutes for feedback.
    This is what we refer to in Chapter 6 Keeping Your Cucumbers Sweet, on page 91
    as Lots of Scenarios, on page 108.


    In this chapter you''ll learn a new way to think about your specifications and
    what you test. By the end of this chapter, you''ll be able to maintain comprehensive
    living documentation in your feature files without sacrificing the quick feedback
    that we so valuable while developing and maintaining your application. But first
    we''re going to show you a very simple technique that you can use as first-aid
    to help control the growing runtime of your test suite.


    # Partitioning Features and Scenarios


    One of the simplest ways to reduce your Cucumber runtime is to run fewer scenarios.
    Tag your scenarios and you can choose a subset of the scenarios to run, covering
    the area that you''re currently working on. Once the work is checked in, a larger,
    but still reduced, subset of faster tests might run in our continuous integration
    (CI) server. Larger subsets might run in subsequent'
  merge: -1
  pgno: 253
- img_proc: true
  md: 'Chapter 13. Keeping Your Features Fast • 246


    steps of a continuous delivery pipeline, or at scheduled intervals (such as overnight
    or weekly). Finally, the full set of scenarios could run on demand as part of
    a release or QA process.


    # Possible Classifications


    To facilitate this way of working, we need to agree on a set of tags to be applied
    to our scenarios. Here are some typical tags that we''ve seen:


    | Partitioning Type | Description | Examples |

    | --- | --- | --- |

    | Speed | An arbitrary classification of the time scenarios to run. Let us to
    exclude slower scenarios. | @fast, @slow, @glacial |

    | Release | Execute scenarios that only apply to particular releases. | @release_104,
    @hot-fix_2014_3_27, @version_2 |

    | Defect | Execute scenarios that verify defects. | @defect, @defect_10983 |

    | Purpose | A categorization of where the test is most useful. | @regression,
    @smoke_test |

    | Risk | An arbitrary grouping of the risk mitigated by the scenario, so we can
    run scenarios with risk profiles. | @High, @Medium, @Low, @CurrentSprint, @WIP
    |


    Remember that tags are free-form text, so Cucumber can''t know, and won''t warn
    us, if we misspell one.


    # Tag Expressions


    As explained in Running a Subset of Scenarios, on page 261, we can build logical
    expressions of tags to specify which scenarios we want Cucumber to execute. We
    can put tags on features, scenarios, scenario outlines, or example blocks, and
    we can have as many tags as we like on each. For example, take a look at the following
    feature:


    ```

    @high_risk

    @first_released_2_0

    Feature: Retain card when instructed by authentication system

    n@fast

    @regression

    Scenario: Dispenser retains cancelled card

    Given a cancelled bank card

    When authentication is sought

    Then the card is retained

    ```'
