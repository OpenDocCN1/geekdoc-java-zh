  md: "Chapter 7. Step Definitions: On the Inside • 130\n\nTry it works!\n\nThis solution\
    \ is OK, but we don't like leaving instance variables in step definitions. The\
    \ problem with instance variables is that if you don't set them they stay null.\
    \ We hate nulls, because they creep around your system, causing weird bugs that\
    \ are hard to track down. For example, if someone were to come along and use the\
    \ second step definition in another scenario that hasn't already set myAccount,\
    \ a null would get passed into Teller.withdrawFrom.\n\nCucumber uses dependency\
    \ injection to facilitate sharing state between steps. (We talk about this later\
    \ in the chapter, in Dependency Injection, on page 137). For now we create a helper\
    \ class to share our state between steps.\n\n# Creating a Custom Helper Class\n\
    \nIn a regular class we might avoid null by putting the instance variables behind\
    \ an accessor method, like this:\n\n```\nprivate Account myAccount;\npublic Account\
    \ getMyAccount() {\n    if (myAccount == null) {\n        myAccount = new Account();\n\
    \    }\n    return myAccount;\n}\n```\n\nWe can do this in Cucumber. Let's define\
    \ a new helper class and use it in our step definitions. Here's what we do:\n\n\
    ```\nstep_definitions_inside/12/src/test/java/nicebank/Steps.java\nclass KnowsMyAccount\
    \ {\n    private Account myAccount;\n    public Account getMyAccount() {\n   \
    \     if (myAccount == null) {\n            myAccount = new Account();\n     \
    \   }\n        return myAccount;\n    }\nn}\n```"
