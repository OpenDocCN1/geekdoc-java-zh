  md: "# Chapter 4. Step Definitions: From the Outside • 54\n\nNow we restricted the\
    \ character we'll accept to be numeric. We're still modifying the character with\
    \ the star to accept any number of them, but we're now being specific that we'll\
    \ accept a continuous string of numbers.\n\n# Shorthand Character Classes\n\n\
    For common patterns of characters like [0-9], there are a few shorthand character\
    \ classes that you can use instead. You might find regular expressions more cryptic,\
    \ but there are only a few to learn. For a digit, you can use \\d as shorthand\
    \ for [0-9]:\n\n```\n@Given(\"I have deposited $\\\\d* in my Account\"\npublic\
    \ void iHaveDepositedInMyAccount(int amount) {\n  // TODO: code goes here\n}\n\
    ```\n\nHere are the most useful character classes:\n\n+   \\w stands for word\
    \ character, specifically [A-Za-z0-9]. Notice that underscores and digits are\
    \ included but not hyphens.\nd stands for digit, or [0-9].ns stands for whitespace\
    \ character, specifically [\\s\\n]. That means a tab, or a line break.\nb stands\
    \ for word boundary, which is a lot like \\s but actually means the opposite of\
    \ \\w. Anything that is not a character is a word boundary.\n\nYou can also negate\
    \ character classes by capitalizing them, for example, \\D means any character\
    \ except a digit.\n\nBack to matching our account. It looks like we're done, but\
