    # Changing Cucumber''s Output


    Cucumber''s default behavior is to output results using the progress plugin, which
    produces a minimal report with a single character per step (as we have seen already):


    ```

    $ java cucumber.api.cli.Main features

    ..U-..F.

    ```


    Each character represents the status of each step:


    +   * means passing.

    * U undefined.

    * means skipped (or a Scenario Outline step).

    * F means failing.


    Cucumber can also produce a more verbose report that''s similar to the Gherkin
    source text—with a little extra information such as colors, locations of matched
    steps definitions, highlighting of arguments, and so on—using the plugin:


    ```

    $ java cucumber.api.cli.Main --plugin pretty features

    ```


    Cucumber also has built-in plugins that output html, json, and junit. The latter
    is handy if you''re running Cucumber in a CI environment where CI servers know
    how to interpret JUnit reports. More on that in a minute.


    # Other Plugins


    In addition to the plugins we''ve seen so far, Cucumber bundles a few that create
    output that isn''t meant to be read as a report of the run. These plugins serve
    as a development aid.


    The usage plugin lists all the step definitions in our project, as well as the
    steps that are using it. It shows unused step definitions, and it sorts the step
    definitions by their average execution time. The output from the usage plugin
    is useful for quickly finding slow parts in your code but also a great way to
    get an overview of your step definitions.'
