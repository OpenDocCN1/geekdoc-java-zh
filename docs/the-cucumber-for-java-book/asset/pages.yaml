    1.0\" encoding=\"UTF-8\"?>\n<beans xmlns=\"http://java.sun.com/xml/ns/javawee\"\
    \n     xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n     xsi:schemaLocation=\"\
    http://java.sun.com/xml/ns/javawee\n     http://java.sun.com/xml/ns/javawee/beans_1_0.xsd\"\
    >\n</beans>\n```\n\nYou'll notice that our beans.xml has nothing in it. We could\
    \ use it to configure our beans in the same way that we did in Some Spring Configuration\
    \ Magic, on page 220. Since this book is about Cucumber, not Weld/CDI, we're leaving\
    \ that as an exercise for the reader.\n\n# What We Just Learned\n\nCongratulations,\
    \ you're ready to inject dependencies!\n\nIn this chapter we've seen Cucumber's\
    \ use of dependency injection simplifies the management of the graph of objects\
    \ to run our scenarios. We looked at most of the DI containers that Cucumber is\
    \ integrated with and saw PicoContainer is probably the simplest to use, if you\
    \ aren't already using one of the others in your project. Most of the other DI\
    \ containers require some form of annotation and configuration. We choose a DI\
    \ container, no matter which one, it takes over responsibility for creating all\
    \ our step definition and hooks.\n\nAs we applied DI to our example we pushed\
    \ more of the responsibilities for creating and initializing our objects onto\
    \ the container. That leaves us with fewer, smaller, more cohesive objects. This\
    \ style takes a bit of getting used, but leads to a more composable architecture\
    \ that can be maintained and extend.\n\n# Try This\n\nUsing your DI container\
    \ of choice, try the following:\n\n+   * If we had more than one scenario, the\
    \ browser would start up for each one, which takes time. How would you share a\
    \ single browser session across all scenarios?\n* Most of our examples use constructor\
    \ injection. Change them to use field injection—you should be able to delete the\
    \ constructor entirely.\n* Choose a DI container and browse its documentation.\
    \ Experiment with different ways of creating the objects that need to be injected."
