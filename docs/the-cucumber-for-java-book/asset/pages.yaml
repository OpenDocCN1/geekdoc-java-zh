  md: '# Explore Testing and Cucumber


    Explore the uncharted waters of exploratory testing and beef up your automated
    testing with more Cucumber.


    # Explore It!


    Uncover surprises, risks, and potentially serious bugs with exploratory testing.
    Rather than designing all tests in advance, explorers design and execute small,
    rapid experiments, using what they learned from the last little experiment to
    inform the next. Learn essential skills of a master explorer, including how to
    analyze software to discover key points of vulnerability, how to design experiments
    on the fly, and how to focus your efforts.


    Elisabeth Hendrickson

    (160 pages) ISBN: 9781937785024. 829

    https://pragprog.com/book/ehxta


    ![](img/3bdd08a58a5b15b4736776437bb8f3a0_321_0.png)


    # Cucumber Recipes


    You can test just anything with Cucumber. We will certainly have, and in Cucumber
    Recipes we''ll show how to apply our hard-won field experience to your own projects.
    Once you''ve mastered the basics, this book will show you how to get the most
    out of Cucumber—from specific situations to advanced test-writing advice. With
    forty practical recipes, you''ll test desktop, web, mobile, and server applications
    across a variety of platforms. This book gives tools you can use today to automate
    any system that you encounter, and do it well.


    Ian Dees, Matt Wynne, Aslak Hellesøy

    (272 pages) ISBN: 9781937785017. 833

    https://pragprog.com/book/dhwcr


    ![](img/3bdd08a58a5b15b4736776437bb8f3a0_321_1.png)'
  merge: -1
  pgno: 321
- img_proc: true
  md: '# Be Agile


    Don''t just "do" agile; you want to be agile. We''ll show you how, for new code
    and old.


    # Your Code As a Crime Scene


    Jack the Ripper and legacy codebases have more in common than you''d think. Inspired
    by forensic psychology, this book teaches you strategies to predict the future
    of your codebase, assess refactoring direction, and understand how your team influences
    the design. With its unique blend of forensic psychology and analysis, this book
    arms you with the strategies you need, no matter what programming language use.


    Adam Tomhill

    (190 pages) ISBN: 9781680500387.836


    https://pragprog.com/book/atcrime


    ![](img/3bdd08a58a5b15b4736776437bb8f3a0_322_0.png)


    # The Nature of Software Development


    You need to get value from your software project. You need it "free, now, and
    perfect." We can''t get you there, but we can help you get to "cheaper, sooner,
    and better." This book leads you the desire for value down to the specific activities
    that help Agile projects deliver better software, and at a lower cost. Using simple
    sketches and a few words, the author invites you to follow his path of learning
    and understanding from a half century of software development and from his engagement
    with Agile methods their very beginning.


    Ron Jeffries

    (150 pages) ISBN: 9781941222379. 824


    https://pragprog.com/book/rjnsd


    ![](img/3bdd08a58a5b15b4736776437bb8f3a0_322_1.png)'
  merge: -1
  pgno: 322
- img_proc: true
  md: '# Seven in Seven


    From Web Frameworks to Concurrency Models, see what the rest of the world is doing
    with this introduction to seven different approaches.


    # Seven Web Frameworks in Seven Weeks


    Whether you need a new tool or just inspiration, Seven Web Frameworks in Seven
    Weeks explores modern options, giving you a taste of each with ideas that will
    help you create better apps. You''ll see frameworks that leverage modern programming
    languages, unique architectures, client-side instead of server-side, or type systems.
    You''ll see everything from familiar Ruby and JavaScript to the more exotic Erlang,
    Haskell, and Closure.


    Jack Moffitt, Fred Daoud

    (302 pages) ISBN: 9781937785635.838

    https://pragprog.com/book/web


    ![](img/3bdd08a58a5b15b4736776437bb8f3a0_323_0.png)


    # Seven Concurrency Models in Seven Weeks


    Your software needs to leverage multiple cores, handle thousands of users and
    terabytes of data, and continue working in the face of both hardware and software
    failure. Concurrency and parallelism are the keys, and Seven Concurrency Models
    in Seven Weeks equips you for this new world. See how emerging technologies as
    actors and functional programming address issues with traditional threads and
    locks development. Learn how to exploit the parallelism in your computer''s GPU
    and leverage clusters of machines with MapReduce and Stream Processing. And do
    it all with the confidence that comes from using tools that help you write crystal
    clear, high-quality code.


    Paul Butcher

