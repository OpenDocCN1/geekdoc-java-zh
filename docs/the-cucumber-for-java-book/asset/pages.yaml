  md: "# Chapter 8. Support Code · 162\n\n```\nsupport_code/15/src/test/java/RunCukesTest.java\n\
    @RunWith(Cucumber.class)\n@CucumberOptions(plugin=\"pretty\", \"html:out\", snippets=SnippetType.CAMELCASE)\n\
    public class RunCukesTest {\n}\n```\n\nWe have to share the same instance of the\
    \ Selenium web driver between WebDriverHooks and AtmInterface. So, we use KnowsDomain\
    \ to manage the shared web driver in just the same way we use to manage the shared\
    \ account, cash slot, and teller:\n\n```\nsupport_code/15/src/test/java/KnowsTheDomain.java\n\
    public EventFiringWebDriver getWebDriver() {\n    if (driver == null) {\n    \
