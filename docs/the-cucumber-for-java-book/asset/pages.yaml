  md: "# Running Cucumber from Maven\n\nThe simplest way for Maven to run your scenarios\
    \ is to run them at the same time as your tests. You've already created an empty\
    \ test class as shown in Cucumber Integration with Unit Test Frameworks, on page\
    \ 266. If you were already running unit tests, there's nothing more to do—your\
    \ scenarios would be run by the Surefire9 plugin that ships with Maven.\n\nOf\
    \ course, the trouble with running your scenarios as unit tests is that they may\
    \ become indistinguishable independently of your unit tests. Occasionally you'll\
    \ find to run your scenarios with Maven, one of which (using the Maven Failsafe10\
    \ plugin) is described in a detail by Sébastien Le Callonnec11.\n\nAnother way\
    \ of separating your unit tests from your scenarios is to run them explicitly\
    \ using cucumber.api.cli.Main. To do this within Maven, you'd use the maven-plugin12\
    \ (an example of which was posted in the Cucumber mailing list13).\n\n```\n<build>\n\
    \  <plugins>\n    <plugin>\n      <groupId>org.codehaus.mojo</groupId>\n     \
    \ <artifactId>exec-maven-plugin</artifactId>\n      <version>1.2.1</version>\n\
    \      <executions>\n        <execution>\n          <phase>integration-test</phase>\n\
    \          <goals>\n            <goal>java</goal>\n          </goals>\n      \
    \  </execution>\n        <configuration>\n        <classpathScope>test</classpathScope>\n\
    \        <mainClass>cucumber.cli.Main</mainClass>\n        <arguments>\n     \
    \     <argument>--plugin</argument>\n          <argument>--pretty</argument>\n\
    \          <argument>--glue</argument>\n          <argument>--nicebank</argument>\n\
    \          <argument>--src/test/resources/nicebank</argument>\n        </arguments>\n\
    \      </configuration>\n    </plugin>\n  </plugins>\n</build>\n```\n\n+   9.\
