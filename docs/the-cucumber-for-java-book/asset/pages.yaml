  md: "You'll notice that all the fields are marked nullable=\"false\" because all\
    \ of them should be set at all times. The id field is marked autoIncrement=\"\
    true\" (so that the database automatically generates a new id for each account\
    \ added) and has a primaryKey constraint (to ensure it is unique and indexed).\
    \ The number field has a unique=\"true\" (also to ensure uniqueness) and the balance\
    \ field is a decimal with a default value of 0.00.\n\n# Connecting to the Database\n\
    \nWhen we run our application we need to get a connection to the database so that\
    \ we can read and update account balances. We will do this in the main method\
    \ of our AtmServer class where we use the Base class to activateJDBC to a connection\
    \ to our MySQL database called. Once the connection is available to all code running\
    \ on this thread.\n\n```\ndatabases/00/src/main/java/nicebank/AtmServer.java\n\
    public static void main(String[] args) throws Exception {\n    Base.open(\n  \
    \      \"com.mysql.jdbc.Driver\",\n        \"jdbc:mysql://localhost/bank\",\n\
    \        \"teller\", \"password\");\n    new AtmServer(9988, new CashSlot(), new\
    \ Account()).start();\n```\n\nNow we have an Account that can persist itself along\
    \ with the balance. let's get rid of the BalanceStore class, so we will simply\
    \ delete the src/main/java/nicebank/BalanceStore.java file. Of course, we need\
    \ to modify TransactionProcessor so that it uses the database instead of BalanceStore\
    \ to access the balance:\n\n```\nnicebank/TransactionProcessor.java\npublic void\
    \ process() {\ndo {\n    String message = queue.read();\n\n    if (message.length()\
    \ > 0) {\n        String[] parts = message.split(\",\");\n        Account account\
