  md: "# Test Data Builders\n\nYou may already know the Test Data Builderª (a specialization\
    \ of the Builder pattern—see Design Patterns: Elements of Reusable Object-Oriented\
    \ Software [GHJV95]). For the uninitiated, here's a quick summary of its benefits.\n\
    \nSuppose you're testing a payroll system and you need to create a PayCheck record\
    \ for part of a scenario. Your domain model is structured, a PayCheck needs an\
    \ Employee, and the Employee in turn needs an Address. Each of them has a few\
    \ mandatory fields. Having to create all of these objects individually in your\
    \ step definition code or having a big fat set of fixture data, you can simply\
    \ say:\n\n```\n@Given(\"have been paid\")\nvoid i_have_paid() {\n    PayCheck\
    \ paycheck = new PayCheckBuilder().build();\n}\n```\n\nOnce you've created a PayCheckBuilder,\
    \ all you need to do is ask it for a PayCheck, and it'll create not only the PayCheck\
    \ object but all the dependent objects as well, setting the mandatory fields with\
    \ reasonable default values. If you care about a field having a specific value,\
    \ provide a method to override the default:\n\n```\n@Given(\"have paid 50 dollars$\"\
    )\nvoid i_have_paid_50_dollars() {\n    PayCheck paycheck = new PayCheckBuilder()\n\
    \        .dollarAmount(50)\n        .build();\n}\n```\n\nWhen it's easy to create\
    \ data, you no longer need to carry around the baggage of big fixture data sets.\
    \ A small amount of up-front investment in creating these builders, of course,\
    \ it quickly pays off in reliable, readable scenarios and step definition code.\n\
    \n+   a. [http://www.natryce.com/articles/000714.html](http://www.natryce.com/articles/000714.html)\n\
    \n# Race Conditions and Sleepy Steps\n\nIf you write full-stack integration tests\
    \ for a reasonably complex system, you'll eventually encounter this problem. Race\
    \ conditions occur when two or more parts of the system are running in parallel,\
    \ but success depends on a particular of them finishing first. In the case of\
    \ a Cucumber test, your step might cause the system to start some work that it\
    \ runs in the background, such as generating a PDF or updating a search index.\
    \ If this background task happens to finish before Cucumber runs your Then step,\
    \ the scenario will pass. If Cucumber wins the race and the Then step executes\
    \ before the background task is finished, the scenario will fail."
