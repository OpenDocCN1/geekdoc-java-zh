  md: '# What Sort of Tests? • 249


    ![](img/3bdd08a58a5b15b4736776437bb8f3a0_257_0.png)


    pective, we often write a large number of full-stack tests, exercising the application
    the same way a user would—through the UI. In the extreme case, you end up with
    an inverted pyramid (known as the Ice Cream Cone antipattern).


    One of the solutions that has been proposed to push some scenarios when features
    take too long to run is the unit test suite. This can work, but because less behavior
    is now specified in the features, we can make our living documentation less complete
    and less useful. We need a new way to think about this problem.


    The pyramid is often drawn with a cloud around the summit labeled “Manual and
    exploratory testing” to emphasize that we still need human testers to apply their
    skill, experience, and intuition. Automated testing is ideal for repetitive, scriptable
    behaviors, but is, by its nature, useful for discovering the more unlikely ways
    in which an application can fail. Liz Keogh captured this perfectly in her talk²,
    which describes the value that a tester (wearing the Evil Hat) brings to the team.


    # The Testing Iceberg


    The decision about or not a behavior should be specified in the feature files
    should be based on whether your business stakeholders are interested in it, not
    on how long it takes to run or how much of the application exercises. Imagine
    the Testing Pyramid became a Testing iceberg floating in water.


    +   1. http://watwatermelon.com/2012/01/31/introducing-the-software-testing-ice-cream-cone/

    2. http://www.infoq.com/presentations/Learning-and-Perverse-Incentives'
