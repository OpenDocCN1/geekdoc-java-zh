    whereas the pretty output gets written to target/test-reports/cucumber.out—there
    is nothing you about this.


    We''ve had a brief look at Cucumber''s integration with the three most popular
    non-Java JVM languages. They, and other integrations, are under active development
    by the Cucumber community, so check the documentation online for the latest details.
    And if you''d like to see other features in these integrations, why not implement
    them yourself and submit a pull request? The Cucumber team needs YOU!


    +   8. https://github.com/nilswloka/lein-cucumber'
