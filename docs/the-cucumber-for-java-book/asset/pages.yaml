  md: '# Preface


    Companies often have huge issues with trust—the customer doesn''t trust the supplier,
    the business doesn''t trust the developers, the developers don''t trust the testers,
    and the testers don''t trust anyone. Cucumber gives the business, developers,
    and testers a way to collaborate and specify, in plain English, how the system
    should work. We''ve seen how these conversations over a simple Cucumber specification
    can begin the process of recuperation.


    Out of these conversations grow a set of specifications that all stakeholders
    could understand. Cucumber enables the direct automation of the specification,
    which means that anyone can see, at a glance, what functionality has been implemented
    and hasn''t. It also gives the development team a safety net so that they get
    early feedback if a change they''re working on breaks any existing functionality.
    And it frees your testers up to interesting, creative work instead of regularly
    running through a repetitive, manual regression pattern.


    Cucumber has now been used by teams who have derived benefit from it in different
    ways. Those of us who were drawn to Cucumber from the beginning instinctively
    realized that it''s more than a test automation tool; it''s a collaboration tool.
    Let''s be clear about this—Cucumber can be used for test automation—but this was
    not the intent of its creators, and some of our design choices reflect this. By
    writing this book, we hope to show you not just how to use Cucumber but how to
    use it.


    Cucumber was originally written in Ruby. Over the years it has become incredibly
    popular and has been ported to plenty of other languages. This book is a Java
    version of The Cucumber Book, containing the same great advice about how to deliver
    rock-solid applications collaboratively, but with all code completely rewritten
    in Java and new chapters that cover features unique to the Java version of Cucumber.'
  merge: -1
