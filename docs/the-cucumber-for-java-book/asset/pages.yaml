    http://localhost:\" + ServerHooks.PORT);\n    webdriver.findElement(By.id(\"Amount\"\
    ))\n      .sendKeys(String.valueOf(dollars));\n    webdriver.findElement(By.id(\"\
    Withdraw\")).click();\n  } \n  finally {\n    webdriver.close();\n  }\n}\n```\n\
    \nWhen we run mvn clean we see the browser up and display our web page with the\
    \ message \"Welcome to our nice bank.\" The scenario still fails, because the\
    \ UI that our test expects hasn't been implemented yet.\n\n# Building the User\
    \ Interface\n\nEven though we can see the page that's failing in the browser,\
    \ it would be useful to learn how to save exactly what is visible in the browser\
    \ when a test fails. That way, when our feature file contains lots of scenarios\
    \ we will still be able to find out what went wrong. Let's add a debugging hook\
    \ to show what's going on in our feature scenario. Let's start by creating WebHooks\
    \ and fleshing out what we want to do:\n\n```\nsupport_code/15/src/test/java/hooks/WebDriverHooks.java\n\
    @After\npublic void finish(Scenario scenario) {\n  try {\n    byte[] screenshot\
    \ = \n      helper.getWebDriver().getScreenshot(OutputType.BYTES);\n    scenario.embed(screenshot,\
    \ \"image/png\");\n  } catch (WebDriverException somePlatformsDontSupportScreenshots)\
    \ {\n    System.err.println(somePlatformsDontSupportScreenshots.getMessage());\n\
    \  } \n  finally {\n    helper.getWebDriver().close();\n  }\n}\n```\n\nThe method\
    \ embed is provided by Cucumber's Scenario class. It only saves an image when\
    \ we use Cucumber's HTML formatter, so we'll need to make a change to the Options\
    \ in RunCukesTest.java to request HTML output:"
