  md: '# Formatting the Override


    When overriding Cucumber''s options, use exactly the same format as you did on
    the command line in Cucumber''s Runtime Options, on page 259. For example:


    ```

    $ java cucumber.api.cli.Main -g step_definitions features

    ```


    can be rewritten as a Java system property:


    ```

    $ java -Cucumber.options="-g step_definitions" cucumber.api.cli.Main

    ```


    This could also be set in an OS environment variable:


    ```

    export Cucumber_OPTIONS="-g step_definitions features"

    ```


    Or you might choose to place it in the cucumber.properties resource bundle:


    ```

    cucumber.options=-g step_definitions features

    ```


    As you see, to override options simply copy what you would have written on the
    command line.


