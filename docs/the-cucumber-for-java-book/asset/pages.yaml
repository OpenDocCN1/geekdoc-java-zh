  md: "# Chapter 11. Simplifying Design with Dependency Injection · 206\n\nThe two\
    \ common ways DI containers inject objects *constructor injection* and *field\
    \ injection*. In the following sections, we'll mainly be using constructor injection,\
    \ but we'll also show you field injection in action.\n\n# Letting DI Manage Shared\
    \ State\n\nA DI container is just a tool that creates and manages instances of\
    \ some classes for us. If you look back at the code we write to share a single\
    \ instance of KnowsDomain among all our step definition classes, we will see that\
    \ we never create an instance of KnowsDomain using new. That's because our DI\
    \ container, PicoContainer, has been doing it for us. What's more, PicoContainer\
    \ created a new instance of KnowsDomain for every scenario and injected that into\
    \ every step definition class that needed it. This made it easy for us to create\
    \ a focused step definition class for each domain entity in our application, relying\
    \ on PicoContainer to share state between them.\n\nIf we had done this without\
    \ DI, it would mean much more work for us. We would have shared state by creating\
    \ a static instance of KnowsDomain, but instance would be shared by all our scenarios.\
    \ Since we want each scenario to have its own fresh copy of KnowsDomain, we would\
    \ have to add a @Before hook to reset the shared instance. But we don't need to\
    \ do any of this, because a DI container will do it for us.\n\nCucumber's use\
    \ of DI makes our lives much simpler by taking care of the creation of our hook\
    \ and step definition classes, as well as all the shared state they depend on.\
    \ For each step definition we define a constructor that takes the shared class\
    \ as a parameter. If a scenario needs access to several different classes, we\
    \ simply provide a constructor that has a parameter for each of them:\n\n```\n\
    public StepDefinitionOrHooks(Foo sharedFoo, Bar sharedBar) {\n  // sharedFoo and\
    \ sharedBar\n}\n```\n\nYou'll want to use DI in most of your Cucumber projects,\
    \ because it makes sharing sharing state between step definition classes so much\
    \ simpler. Cucumber has integrations with several DI containers, which we'll take\
    \ a brief look at next.\n\n# DI Container Integrations\n\nCucumber ships with\
    \ integrations to several of the more popular DI containers (as well as unfamiliar\
    \ to most people), shown in the following list. The code you will write look slightly\
    \ different depending on which DI container you choose."
