  md: '# Brittle Features


    When you feel you can hardly move in the test suite without making an unrelated
    test fail for no good reason, you have what we call brittle features. A brittle
    feature is easy to break. When features are brittle, a necessary change in one
    part of the test suite or main codebase causes unrelated scenarios to break.


    When you encounter a brittle scenario, it''s usually when you''re in the middle
    of something else. You''re interrupted by the unexpected failure and waste dashing
