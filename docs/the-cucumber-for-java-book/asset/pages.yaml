  md: "What is this telling us that Guice is trying to instantiate an instance of\
    \ our glue classes, but it doesn't know which constructor to use (even though\
    \ they each have one constructor).\n\n# @Inject Annotation\n\nTo tell Guice which\
    \ constructor to use, we add the @Inject annotation to the constructor that we\
    \ want to inject into:\n\n```\ndependency_injection/guice/02/src/test/java/nicebank/CashSlotSteps.java\n\
    CashSlot cashSlot;\n@Inject\npublic CashSlotSteps(CashSlot cashSlot) {\n    this.cashSlot\
    \ = cashSlot;\n}\n```\n\nWe also have to annotate the constructors in AtmmInterface,\
    \ AccountSteps, ServerHooks, TellerSteps, and WebDrivers. When we run mvn clean\
    \ test both of our scenarios fail but with a different error:\n\n```\nTESTS\n\
    -------\nRunningCukesTest\nFeature: Cash Withdrawal\nListening on http://10.101.77:8887/\n\
    Failure in after hook:ServerHooks.stopServer\nMessage: com.google.inject.ProvisionException:Guice\
    \ provision errors:\n```\n\n> 1 error injecting constructor, org.servlet.activejdbcbc.DBException:\n\
    com.mysql.jdbc.exceptions.jdbc4.MySQLIntegrityConstraintViolationException:\n\
    Duplicate entry '1234' for key 'number', Query:\nINSERT INTO accounts (number,\
    \ balance) VALUES (?, ?), params: 1234.00\nat support.TestAccount.<init>(TestAccount.java:8)\n\
    while locating stop.TestAccount\n    for parameter 0 at ServerHooks.<init>(ServerHooks.java:22)\n\
    \    while locating hooks.ServerHooks\n\nWhat's going on here? The error being\
    \ reported is a MySQLIntegrityConstraintViolation, which is being thrown because\
    \ we're trying to create more than one account with the same account number. The\
    \ unique constraint we put on the database will not allow this and that's the\
    \ cause of the error.\n\nThe root cause of this problem is scope. We hit a significant\
    \ difference between PicoContainer and Guice, which we'll look at next."
