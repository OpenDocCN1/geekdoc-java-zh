    # Building Trust


    As we saw in Three Amigos, on page 101, the tester, the programmer, and the product
    owner collaborate to discover examples that illustrate how the application should
    work. These examples become scenarios, and the development team uses them to drive
    out the implementation. Meanwhile, they are written using business domain language,
    they are also used by testers and business stakeholders as automated tests. We
    can run them regularly to assure ourselves that the application delivers the functionality
    that our customers require. This helps build trust between customers, developers,
    and testers that we understand each other''s needs.


    We also want our scenarios to run relatively quickly so that we can run them often
    and get feedback quickly. We can use the technique presented in the previous section
    to focus in and exercise the part of the application where the behavior specified
    by the scenario is implemented. Since the scenarios started exercising the whole
    application stack, we win the trust of our customers. Using tags in this way makes
    it a better test without compromising the specification.


    Lots of scenarios will execute the same UI elements as others, because that''s
    the only way we can vary the paths through our application''s business logic.
    So we can introduce tags to reduce the amount of application being exercised without
    reducing the coverage of our scenarios. We just have to leave enough scenarios
    untagged so that every UI element is exercised, but this will be a fraction of
    all our scenarios.


    By exercising the whole application when we first write our scenarios, build the
    trust that the application is correct. Once this trust has been established, we
    can use tags and unit tests to minimize the cost of running all our scenarios.
    Without trust this wouldn''t be possible, so it''s important to remember how easy
    it is to lose the trust of other parts of the'
