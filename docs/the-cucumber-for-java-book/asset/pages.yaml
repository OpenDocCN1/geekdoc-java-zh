  md: '# CHAPTER 11


    # Simplifying Design with Dependency Injection


    In Dependency Injection, on page 137, we saw how Cucumber uses dependency injection
    (DI) to share an instance of KnowsTheDomain between our step definitions, but
    we really only scratched the surface. Now it''s time to dig a little deeper.


    In this chapter we will discuss how DI can help improve the design of your code
    and the DI containers that are integrated with Cucumber. Then we will dive in
    and refactor our ATM example to use DI more effectively, showing you how to do
    it with four of the popular DI containers.


    # DI and Cucumber


    You don''t need a DI container when you use Cucumber. When you use Cucumber without
    one of the DI integrations, it manages the creation of all your hooks and step
    definitions itself. Cucumber creates instances of each step definition or hook
    class for each scenario. Of course that means these classes need to have a default
    constructor; otherwise Cucumber won''t know how to create them. This makes it
    hard to share state safely between several step definition classes.


    DI can make some of your everyday work less tedious and error prone. As soon as
    you add one of the DI integrations, the DI container takes over the responsibility
    for creating the hooks and step definitions. All the DI containers can also inject
    objects into our hooks and step definitions when it creates them. Even better,
    the DI container will create instances of any object that needs to be created
    you can easily build networks of dependent objects, leaving the hard work of wiring
    them all together to the DI container.'
