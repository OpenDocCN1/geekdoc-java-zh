  md: 'Are Your Scenarios Sufficient? • 291


    Just as bug fixing, following this process means that you quickly get the benefits
    of automated testing in the areas of the system where you need them: the ones
    that are most prone to change and instability.


    As you gradually build up your suite of Cucumber scenarios for your legacy application,
    you''ll find you confidence to refactor and clean up the code. It becomes a vicious
    cycle, with cleaner code causing less bugs.


    # Are Your Scenarios Sufficient?


    Often it''s difficult to tell whether the characterization tests that you''ve
    written cover enough of the functionality of the application to give you confidence
    to go in and make changes safely. There are some tools that can help you decide
    how safe you really be feeling. The last thing we want is a false sense of security
    leading to unexpected regressions delivered to our customer.


    # Code Coverage


    Code coverage tools allow us to discover which specific lines of code in the system
    were executed during a test. When you are starting to add tests to a legacy application,
    it can be useful to know your code coverage:


    +   * If you know a line of code is not covered by your tests, you can see more
    clearly what kind of a characterization test you need to write.

    * If you know that a line of code is covered by your tests, you can be more confident
    in refactoring or changing it.


    # Mutation Testing


    Code coverage tools tell us what lines get executed when we run our tests, but
    don''t tell us whether we testing the right things. You might think there''s no
    substitute for human analysis when it comes to checking that your tests are sufficient,
    but mutation testing tools, like pitest (http://pitest.org) can help.


    The theory behind mutation testing is quite simple. The tool takes your application
    and creates a mutant version by automatically injecting a bug. If one or more
    fails fails, then the mutant is killed. If they pass, the mutant survives. Any
    mutant that survives indicates a gap in our tests. We might choose to go back
    and fill that gap, either by writing a new test or by modifying an existing test.


    As you can imagine, a huge number of bugs could be injected into any reasonably
    sized application, so mutation testing can be quite slow. A lot of work'
