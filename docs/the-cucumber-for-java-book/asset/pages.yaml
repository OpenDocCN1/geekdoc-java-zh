  md: "```\nfast/01/src/java/test/support/TestCashSlot.java\npackage support;\n\n\
    import nicebank.CashSlot;\n\npublic class TestCashSlot extends CashSlot {\n  \
    \  private boolean faulty;\n\n    public void injectFault() {\n        faulty\
    \ = true;\n    }\n\n    public void dispense(int dollars) {\n        if (faulty)\n\
    \            throw new RuntimeException(\"Out of order\");\n        else\n   \
    \         super.dispense(dollars);\n    }\n} \n\n```\n\nSince we're using Spring,\
    \ we can make a simple change to the configuration file cucumber/xml to inject\
    \ our test class into our application:\n\n```\nfast/01/src/test/resources/cucumber.xml\n\
    <bean class=\"support.AtmInterface\" scope=\"cucumber-glue\" />\n<bean class=\"\
    support.TestCashSlot\" scope=\"cucumber-glue\" />\n```\n\nNow when our scenarios\
    \ run, Spring will create a single instance of TestCashSlot and inject it anywhere\
    \ that we need a TestCashSlot or CashSlot. When to withdraw cash from a faulty\
    \ ATM, dispense will throw an exception. For the time we're using Java's RuntimeException,\
    \ we'd want to replace this with something more meaningful if this was not an\
    \ example.\n\nWe can inject our TestCashSlot at any time using the injectFault\
    \ method. We call this from our new step \"But the cash slot has developed a fault\"\
    :\n\n```\nfast/01/src/test/java/nicebank/CashSlotSteps.java\n@Given(\"the cash\
    \ slot has developed a fault$\")\npublic void theFault() throws Throwable {\n\
    \    cashSlot.injectFault();\n}\n```\n\nRemember that by this time definition\
    \ executed, the TestCashSlot will already have been created by Spring and wired\
    \ into our application. We're simply changing a flag to indicate that for future\
    \ calls we want it to behave as if it was faulty."
