  md: 'Improving Our Design DI • 207


    +   - cucumber-picocontainer—PicoContainer:¹ A lightweight DI container from Aslak
    Hellesøy, Paul Hammant, and Jon Tirsen


    +   - cucumber-guice—Guice:² A lightweight DI container from Google


    +   - cucumber-spring—Spring:³ A popular framework that includes DI and much more


    +   - cucumber-weld—CDI/Weld:⁴ The reference implementation of the CDI (Context
    and Dependency Injection Framework for the Java EE platform)


    +   - cucumber-openejb—OpenEJB:⁵ A stand-alone EJB server from Apache, including
    a DI implementation


    You choose which framework to use the relevant Cucumber JAR in your classpath,
    as only one Cucumber DI JAR will ever be on the classpath. As soon as you put
    one of these JARS on your classpath, Cucumber will delegate the creation and management
    of your hooks and step definitions to the DI container you use. The Cucumber JARS
    contain only the code to integrate the DI container—you''ll also need to add a
    dependency on the DI itself.


    # Which DI Container Should I Choose?


    The various DI containers provide almost exactly the same functionality. Each
    needs slightly different configuration, but the choice depends on what DI you
    are already using in your application. If your application uses Spring, then cucumber-spring.
    If your application uses Guice, choose cucumber-guice.


    If your app isn''t using DI at all, PicoContainer is a great choice because it''s
    simple to use.


    Let''s go back to our ATM example and see how DI can improve the structure of
    our test code. You''ll be surprised by how big difference it can make.


    # Improving Our Design Using DI


    As we''ve seen, DI can make our lives simpler by doing some of our work for us.
    At the moment our application is using DI to share state, but in KnowsDomain is
    managing the creation of quite a few domain entities. As


