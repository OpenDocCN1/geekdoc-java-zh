  md: "Chapter 8. Support Code • 156\n\n> Seb says:\nSelenium Web Drivers\n\nIf you\
    \ start strange errors using your Selenium web driver, it may be caused by incompatibilities\
    \ between their versions. New versions of browsers are released regularly and\
    \ this often means that you'll need to update your Selenium version too.\nThis\
    \ book was prepared using Firefox 28.0 and Selenium 2.41.0.\n\n# Using Hooks\n\
    \nCucumber supports hooks, which are methods that run before or after each scenario.\
    \ You can define them anywhere in your support or step definition layers, using\
    \ the annotations @Before and @After.\n\nTo test them, add a file src/test/java/hooks/SomeTestHooks.java\
    \ that looks like this:\n\n```\nsupport_code/13/src/test/java/hooks/SomeTestHooks.java\n\
    package hooks;\n\nimport cucumber.api.java.After;\nimport cucumber.api.java.Before;\n\
    import cucumber.api.Scenario;\n\npublic class SomeTestHooks {\n    @Before\n \
    \   public void beforeCallingScenario() {\n        System.out.println(\"***********\
    \ About to start the scenario.\");\n    }\n\n    @After\n    public void afterRunningScenario(Scenario\
    \ scenario) {\n        System.out.println(\"*********** Just running scenario:\
    \ \" + scenario.getStatus());\n    }\n}\n```\n\nIf you run mvn clean test, you'll\
    \ see the two messages printed in the output at the beginning and end of the scenario.\
    \ Cucumber's @Before and @After hooks are a lot like the SetUp and TearDown methods\
    \ in the xUnit family of testing tools.\n\nThe common use of @Before and @After\
    \ hooks is to clear any residual state left in external systems like databases\
    \ so that each scenario starts with\n\nPrepared exclusively for Aaron Evans |\
    \ report erratum • discuss"
