    \nWe obviously need to be careful in this situation, because we could easily have\
    \ a scenario that was giving us a false positive: passing when it had been failing.\
    \ It might not seem like it, but Cucumber's flexibility actually helped us by\
    \ exposing some subtle ambiguity in the language used in each of the steps. The\
    \ best way we've found to avoid this problem is to pay careful attention to the\
    \ precise wording in your steps. You could change both steps to be less ambiguous:\n\
    \nGiven I have deposited $100 in My Account\nThen the balance of my Account should\
    \ be $100\n\nBy reordering the steps like this, you've made them better at communicating\
    \ exactly what they will be executed. Learning to sort and remove this kind of\
    \ ambiguity is something that takes practice. Paying attention to the distinction\
    \ between two steps like this can also give you hints about concepts that may\
    \ not be expressed in your code need to be. It might seem pedantic, but we've\
    \ found teams who pay this careful attention to detail write much better software,\
    \ faster.\n\n# Speaking in Tongues\n\nIf you're using a different spoken language\
    \ than English in your features, you can still use the same language when registering\
    \ step definitions, Cucumber"
