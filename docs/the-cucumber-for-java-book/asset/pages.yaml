    \ For systems like these, the user interface is often a REST¹ web service. To\
    \ automate scenarios against it, we need to make our Cucumber step definitions\
    \ talk to the web service as though they were a regular client application.\n\n\
    Your application doesn't have to be written in Java (or any other JVM language)\
    \ in order to be developed using Cucumber. Applications written in Ruby,.NET,\
    \ PHP, or any other programming language can be tested by starting your application\
    \ before Cucumber runs and then having Cucumber talk to it using HTTP client library.\n\
