  md: "# Getting to Green\n\nWhere were we? We were just trying to get our scenario\
    \ to talk to the UI when we realized that we needed to learn about how to get\
    \ Cucumber to start and stop the web server. Once we get that working, we'll need\
    \ to design and build a UI. And finally we'll have to write our new UI up to our\
    \ existing domain model.\n\nLet's get started!\n\n# Starting the Server\n\nWe\
    \ want to start our server before each scenario runs and stop the server after\
    \ each scenario completes. This is exactly what the @Before and @After hooks are\
    \ intended for. Let's create a new file, src/test/java/hooks/ServerHooks.java,\
    \ where we'll create our hooks.\n\n```\nsupport_code/14/src/test/java/hooks/ServerHooks.java\n\
    package hooks;\n\nimport cucumber.api.java.After;\nimport cucumber.api.java.Before;\n\
    import cucumber.api.java.Scenario;\n\nimport nicebank.AtmServer;\n\npublic class\
    \ ServerHooks {\n    public static final int PORT = 8888;\n\n    private AtmServer\
    \ server;\n\n    @Before\n    public void startServer() throws Exception {\n \
    \       server = new AtmServer(PORT);\n        server.start();\n    }\n\n    @After\n\
    \    public void stopServer() throws Exception {\n        server.stop();\n   \
    \ }\n}\n```\n\nWe'll also want to use the constant PORT that we've just introduced\
    \ in our class that drives the Teller through the user interface:"
