  md: 'Chapter 13. Keeping Your Features Fast · 248


    remove tags from our feature file. For example, a feature that is classified as
    high risk today might be be seen as less risky in six months once we''ve ironed
    out the technical problems.


    Now we''ve explored this simple technique, it''s time to tackle the problem of
    slow tests from another angle. To do this, we''ll need to go back to the fundamental
    question of what we''re testing and why.


    # What Sort of Tests?


    Both BDD and TDD ask us to write examples before we write the code to help us
    drive out the functionality that our customers want, and no more. When we write
    these scenarios and tests, they guide our emerging design. Once the functionality
    has been implemented, its purpose is to give us confidence when refactor or add
    new behavior to protect us from regressions.


    Many people assume that when using a tool like Cucumber—where the test is a business-readable
    acceptance test—we must exercise all layers of the solution. That''s not the case!
    The choice between using a natural language tool or a more technical tool, such
    as JUnit, to run the tests depends on how much of the application that is interested
    in reading the specification. How much of the application that the test should
    exercise is going to be a completely separate decision.


    We''re going to introduce a new model to help you think about this, but let''s
    start by looking at a recognized model used in the Agile community.


    # The Testing Pyramid


    In his book, Succeeding with Agile: Software Development Using Scrum [Coh09],
    Mike Cohn introduced the concept of the testing pyramid to emphasize that you
    should have more unit tests than full-stack tests. The figure follows is inspired
    by his ideas and shows that unit tests are the foundation of your automated test
    suite. They drive out implementation and specify the precise behavior of individual
    components. Integration or component tests validate the interactions between subsystems
    or units. Finally, the full-stack tests ensure that the whole application "hangs
    together."


    Unit tests are preferable to full-stack tests because they are faster, and when
    they fail, they give us a clear indication of where we need to go to fix the problem.
    Additionally, unit tests are less brittle and easier to understand than full-stack
    tests.


    Using BDD, we encourage the team to specify the application''s behavior in business
    language. When thinking about the application from a user''s per'
