  md: "# Chapter 11. Simplifying Design with Dependency Injection • 208\n\nour application\
    \ grows, we're likely to find more domain entities that need to be shared between\
    \ our step definitions. The temptation is to put all our shared domain entities\
    \ into KnowsDomain, but this would soon grow huge, exhibiting the Monster antipattern.⁶\n\
    \nTo keep our step definitions maintainable, it's a good idea to create a step\
    \ definition class for each domain entity. It's clear that the Cash Slot definition\
    \ is going to interact with the Cash Slot domain entity, but will it ever need\
    \ to know about a Customer entity? Probably not, so why would we pass it access\
    \ to the Customer?\n\nStarting with the code from the end we refactor our ATM\
    \ example to use DI more effectively. We'll take small steps,⁷ looking at the\
    \ result of this refactoring to see if there is another refactoring that could\
    \ improve the design further. At the end you'll see a much cleaner application\
    \ with fewer classes and a clearer architecture.\n\n# Decomposing KnowsTheDomain\n\
    \nWe'll start by splitting KnowsTheDomain into several, cohesive helper classes—one\
    \ for each domain entity—as shown in the figure. Then we can make sure that a\
    \ step definition only has access to entities that it should need to interact\
    \ with by passing them in construction time.\n\n| KnowsTheDomain | CashSlotSteps\
    \ |\n| --- | --- |\n| Account getMyAccount() TellerTeller() CashSlot getCashSlot()\
    \ | public void CashSlotSteps(KnowsTheDomain helper) {\n // ...\n }\n\n| KnowsAccount\
    \ | CashSlotSteps |\n| --- | --- |\n| Account getMyAccount() | public void CashSlotSteps(KnowsTheCashSlot\
    \ helper) {\n // ...\n }\n\n| KnowsTheTeller |\n| --- |\n| TellerTeller()\n\n\
    | KnowsTheCashSlot |\n| --- |\n| CashSlot getCashSlot()\n\n+   6. http://lostechies.com/chrismiss/2009/05/28/anti-patterns-and-worst-practices-monster-objects/\n\
    7. http://c2.com/cgi/wi?RefactoringInVerySmallSteps"
