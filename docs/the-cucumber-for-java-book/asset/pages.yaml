  md: 'Above the water are all the tests that are business readable. Below the water
    are all the tests that only the technical people on the team can read.


    ![](img/3bdd08a58a5b15b4736776437bb8f3a0_258_0.png)


    As the iceberg settles in the water, it tilts to one side. Some of the unit tests
    appear above the waterline, becoming business readable. Some full-stack tests
    disappear beneath the water, as they are specifying behavior that only a technical
    audience would be interested in.


