    We''ll show you our solution in the next section.


    > Joe asks:

    **I Feel Weird: You''re Making Tests Pass but Nothing Works!**


    We implemented a step that uses the Checkout class and passes, even though the
    "class" contains just method implementations that don''t do useful. What''s going
    on?

    Remember that a step isn''t a test in itself. The test is the whole scenario,
    and that isn''t going to pass until all of its steps do. By the time we''ve implemented
    all of the step definitions, there''s going to be only one way to make the whole
    scenario pass, and that''s to build a checkout that can total items!

    When we work outside-in like this, we use temporary *stubs* like the empty Checkout
    class as placeholders for details we need to fill in. We know we can''t get away
    with leaving as an empty file, because eventually Cucumber is going to tell us
    to come back and make it something useful in order to get the whole scenario pass.

    This principle, *deliberately doing the minimum useful work the tests will let
    us get away*, might seem lazy, but in fact it''s a discipline. It ensures that
    we make our tests thorough: if the test doesn''t drive us to write the right thing,
    then we need a better test.


    # Making It Pass


    So, now that we have our failing Cucumber scenario in place, it''s time to let
    that scenario drive out a solution.'
