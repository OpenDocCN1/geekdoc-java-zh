  md: '# Chapter 13. Keeping Your Features Fast 256


    organization and remain focused on delivering software reliably delivers value
    to our customers.


    In this chapter, we''ve seen techniques that can help you control the runtime
    of your scenarios. The example that we have used on bypassing the UI to reduce
    the amount of web automation required. These techniques are not limited to our
    UI and can be used anywhere in our application. Instead of calling a service over
    the network, we could use these techniques to switch to a local test double that
    could returned data to speed up the scenarios. Or could switch between using a
    real database for our persistent store and an in-memory data structure. The possibilities
    are endless. Our executable specifications remain comprehensive and our scenarios
    deliver consistently high coverage, but they continue to run quickly and deliver
    fast, reliable feedback.


    # What We Just Learned


    We begin this chapter by reviewing the recommended distribution of test depth
    as described by the Testing Pyramid. We then looked at the separate concern of
    who the tests should be readable by, as captured by the Testingberg. This led
    us into discussion of how we can keep our scenarios running quickly, while still
    keeping their documentation of our application complete. Finally, we looked at
    concrete techniques that allow us to vary the amount of the application that our
    steps exercise without changing the scenarios themselves.


    # Try This


    The example in this chapter focused on switching between the web UI and the business
    logic. Try to introduce a similar choice somewhere else in our application. For
    instance, you could implement a switch that lets you replace the asynchronous
    processing of the message file and TransactionProcessor with a synchronous, in-memory
    test double. Or could you try to switch between using the database and using an
    in-memory account balance.


    When you try this, consider how the design decisions we made earlier affect the
    ease of the change. Have some of them made the introduction of a seam harder?
    Would it have been better to implement the seam from the start?'
