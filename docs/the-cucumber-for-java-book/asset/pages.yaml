  md: "Now you have some grounding in ActiveJDBC and Liquibase, let's get our hands\
    \ dirty and start it to our banking system.\n\n# Refactoring to Use a Database\n\
    \nIn our current system, the balance of the single account is stored in a file\
    \ and read and write by the BalanceStore class. In our new design, we will make\
    \ the Account responsible for reading the balance straight out of a database instead.\
    \ It's refactoring time again!\n\n# Creating the Database\n\nOnce you have installed\
    \ MySQL® you will need to create a database and user. This can be done simply,\
    \ using the setup-bank.sql script:\n\n```\ndatabases/00/setup-bank.sql\nCREATE\
    \ DATABASE bank;\nCREATE USER 'teller'@'localhost' IDENTIFIED BY 'password';\n\
    GRANT ALL ON * TO 'teller'@'localhost';\n```\n\nAs you can see, this script creates\
