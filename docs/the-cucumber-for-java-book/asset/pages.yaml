  md: '# Sharing Reports


    Earlier in this chapter we saw how to use the --plugin option to change Cucumber''s
    output. If we pass --plugin junit:UNIT_DIR to Cucumber, we can configure our CI
    server to pick up those reports from UNIT_DIR and analyze them. Some CI servers
    can generate a trend chart showing how healthy our builds over time. This is a
    great way to get an indicator of whether the project is improving or decaying.


    We can also pass the -p html:HTML_FILE to get a full HTML report of the results.
    This is particularly helpful if we''re using a browser automation tool, because
    we can embed screenshots of the browser right into the HTML report, as we did
    in Building the User Interface, on page 161.


    # What We Just Learned


    Cucumber has a rich set of options that give us full control over how it behaves.
    We now know how to choose which features and/or scenarios to run, based on tags,
    names, and line numbers. Using the special run plugin, we can even choose to only
    run scenarios that failed the last time the features were executed. A wealth of
    other plugins ship with Cucumber, and we''ve learned how to control their output
    as well as how to use several of them at the same time.


    We''ve looked at some of the other options that control Cucumber, especially the
    glue option (which gives us the freedom to structure our solution in the way we
    want) and the snippets option (which gives us control of the formatting of our
    snippets).


    We''ve also looked at some of the unit test and build frameworks that Cucumber
    integrates with, so that you can use in your project today. And with the knowledge
    of how you can use your OS or build environment to override Cucumber options,
    you have the power to customize what Cucumber does in a flexible way.


    # Try This


    Here are some exercises you can try:


    +   * Modify one of the examples from Part II to use cucumber.api.cli.Main instead
    of the JUnit integration.


    +   * How many different ways can you find to get the Cucumber version number?
    Think about all the places you could provide a --version override.'
