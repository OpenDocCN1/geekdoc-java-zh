  md: '# CHAPTER 12


    # Working with Web Applications


    Our ATM example—a simple web application that has a single feature—withdrawing
    cash—but even that isn''t fully implemented. In this chapter we''re going to extend
    this feature to handle some simple error situations that our stakeholders are
    concerned about. Along the way we''ll learn some techniques for injecting errors
    into our system and a lot more about how to use Selenium to exercise web applications.


    It doesn''t take very long to run the single scenario we''ve written for our ATM
    example, but as we add more scenarios the time it takes to run Cucumber will get
    longer. We''ve already talked about some of the ways to handle some features in
    Chapter 6, Keeping Your Cucumbers Sweet, on page 91, but in this chapter, we''ve
    added some extra scenarios, we''ll take some time to talk about one technical
    approach to managing the problem—browser reuse.


    We''re also going to discover a user requirement to update our ATM page while
    the user types. This will lead us into the realm of JavaScript and Ajax, which
    are common technologies in almost all modern web applications. We''ll learn how
    to use Cucumber and Selenium to drive out this feature and see that everything
    is not as simple as we might have hoped.


    Before we begin to flesh out some more scenarios, let''s take a deeper look at
    some of the functionality that Selenium provides for interacting with web apps
    and see how Cucumber fits into the picture.


    # Selenium WebDriver


    One of the most popular ways to use Cucumber is to automate the development of
    web applications. Here is a dirty little secret:


    Cucumber has no idea how talk to a web application!'
