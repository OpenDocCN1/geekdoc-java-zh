  md: "Ajax 235\n\n```\n@Override\npublic void close() {\n  if (Thread.currentThread()\
    \ != CLOSE_THREAD) {\n    throw new UnsupportedOperationException(\n      \"You\
    \ shouldn't close this WebDriver. \" + \n      \"It's shared and will close when\
    \ the JVM exits.\");\n  }\n}\n```\n\n```\n@Before\npublic void deleteAllCookies()\
    \ {\n  manage().deleteAllCookies();\n}\n```\n\nWe create a simple driver instance\
    \ and store it in a static variable (line 2). This will be shared by all instances\
    \ of SharedDriver. We also create a static Thread (line 3) and add it to the JVM's\
    \ list of hooks that should be called when the JVM is shutting down (line 11).\n\
    \nIf you try to close the driver manually, SharedDriver will check whether the\
    \ call is coming from the registered CLOSE_THREAD (line 20). If it isn't, SharedDriver\
    \ will report the error through an exception. This protects you from inadvertently\
    \ closing the browser midway through executing your Cucumber features.\n\nThis\
    \ example also shows how you can use a hook to clear cookies before each scenario\
    \ runs (line 29). The method manage is part of the EventFiringWebDriver API provided\
    \ by Selenium.\n\nWhile driving out some faulty features in our ATM, we've learned\
    \ a general way to call cleandup at the end of a Cucumber run. We've used Selenium\
    \ to ensure that each scenario cleans up any cookies that the previous scenario\
    \ might have saved. Now we need to show what we've done to our users and see whether\
    \ they like it!\n\n# Ajax\n\nDuring usability testing sessions, we discover that\
    \ users don't like being told the amount of money they request isn't available.\
    \ They'd prefer it if we could display a message that the ATM has insufficient\
    \ funds while they are typing the amount into the ATM before they press the Submit\
    \ button. This is described by a new scenario:"
