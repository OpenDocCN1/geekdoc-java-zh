  md: "# Bean Constructors with Arguments\n\nIn the previous section we saw how we\
    \ could configure a class as a bean in the cucumber.xml file. That was fine for\
    \ classes that had default, no-arg construc-tors. When we needed to call a constructor\
    \ with an argument for Account we had to create an AccountFactory. Let's see if\
    \ there's another way to do it. Take a look at MyWebDriver\n\n```\ndependency_injection/spring/02/src/test/java/support/MyWebDriver.java\n\
    package support;\n\nimport org.openqa.selenium.firefox.FirefoxDriver;\nimport\
    \ org.openqa.selenium.support.events.EventFiringWebDriver;\n\npublic class MyWebDriver\
    \ extends EventFiringWebDriver {\n    public MyWebDriver() {\n        super(new\
    \ FirefoxDriver());\n    }\n}\n```\n\nAs you can see, its only difference from\
    \ Selenium's EventFiringWebDriver is that the constructor is wired to use a Firefox\
    \ browser. As a last example, let's use Spring to get rid of WebDriver entirely.\
    \ We'll start telling Spring how to create an EventFiringWebDriver for our scenarios\
    \ to use:\n\n```\ndependency_injection/spring/03/src/test/resources/cucumber.xml\n\
    <bean class=\"org.openqa.selenium.support.events.EventFiringWebDriver\" scope=\"\
    cucumber-glue\" destroy-method=\"close\">\n    <constructor-arg>\n        <bean\
    \ class=\"org.openqa.selenium.firefox.FirefoxDriver\" scope=\"cucumber-glue\"\
    />\n    </constructor-arg>\n</bean>\n```\n\nNow we need to replace all references\
    \ to WebDriver in our test code with references to EventFiringWebDriver. Here's\
    \ an example from WebHooks:\n\n```\ndependency_injection/spring/03/src/test/java/hooks/WebHooks.java\n\
    @Autowired\nprivate EventFiringWebDriver webdriver;\n```\n\nAnother run of mvn\
    \ clean test will verify that our scenario still passes.\n\nWe'll use more of\
    \ Spring in Chapter 12, Working with Web Applications, on page 225.\n\n# CDI with\
    \ Weld\n\nThe Java community has been working on a standardized approach to many\
    \ of the challenges that software developers have to deal with. One of these is"
