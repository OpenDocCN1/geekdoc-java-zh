    @After\npublic void rollback() {\n    Base.rollbackTransaction();\n}\n```\n\n\
    That's all you need to start a transaction at the beginning of each scenario and\
    \ roll it back at the end.\n\nWe'll also add a bit of helpful diagnostic to the\
    \ TransactionProcessor:\n\n```\ndatabases/06/src/main/java/nicebank/TransactionProcessor.java\n\
    Account account = Account.findFirst(\"number = ?\", parts[1]);\nif (account ==\
