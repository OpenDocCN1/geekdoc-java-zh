  \ 窗口。\n\n### 尝试代码\n\n现在你已经打开了 `Processing`，可以测试一些代码来确保一切正常！\n\n\n\n\n在这本书中，你将学习如何从零开始编写自己的代码。但在首次设置编程环境时，测试一些你认为*应该*可以运行的代码是一个好主意，以确保你的编程环境工作正常。按照以下步骤操作：\n\
  \n1. **访问** [`www.processing.org/examples/star.html`](http://www.processing.org/examples/star.html)\
