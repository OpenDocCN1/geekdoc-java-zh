  \   然后在 `setup` 方法底部添加此代码：\n\n   ```java\n   enemy2 = new Enemy(650, 325);\n   ```\n\
  \n2. 在 `draw` 方法中添加另一个 `move` 调用，让 `enemy2` 在岩浆和屏幕边缘之间移动：\n\n   ```java\n   enemy2.move(650,\
  \ 900);\n   ```\n\n3. 点击运行确保两个敌人都在移动。\n\n## 创建第二个 Java 类\n\n你创建的第二个类是角色类。虽然在这个游戏中只有一个角色，但创建第二个类可以通过分离代码来清理代码，使其更易读。\n\
