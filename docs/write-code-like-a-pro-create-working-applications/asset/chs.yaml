  图 7-29： 测试以确保你的角色移动时没有留下痕迹。\n\n## 为你的视频游戏添加重力\n\n你现在游戏中一个奇怪的方面是你的角色直接穿过了山丘（参见图 7-30)）。\n\
  \n![image](img/9781119404170-fg0730.png)\n\n图 7-30： 你的角色可以穿过山丘。\n\n在本节中，你将让角色在按下空格键时向上移动，会自动向下移动。这本质上就是重力。按照以下步骤操作：\n\
  \n1. **在条件语句中添加第三个条件，在按下空格键时更改 `characterY` 变量（参见图 7-31)::**\n\n```java\nelse if(key\
