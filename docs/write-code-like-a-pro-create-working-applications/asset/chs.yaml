  \n\n正如你可能在图 7-25 中看到的，每当你按下 A 或 D 键时，你的角色都会留下一道痕。要修复这个问题，你必须在每次重新绘制角色时重新绘制场景。请按照以下步骤操作：\n\
  \n1. **创建一个名为 `drawScene` 的新方法，并将背景颜色、草地和两座山丘的代码移动到 `drawScene` 方法中（参见图 7-26)::**\n\
  \n```java\nvoid drawScene()\n{\n  //Sky\n  background(173, 216, 230);\n  //Grass\n\
  \  stroke(0, 255, 0);\n  fill(0, 255, 0);\n  rect(0, 400, 1000, 500);\n  //Hills\n\
  \  stroke(165, 42, 42);\n  fill(165, 42, 42);\n  arc(300, 400, 100, 150, PI, TWO_PI);\n\
  \  arc(600, 400, 100, 150, PI, TWO_PI);\n}\n```\n\n确保你更新了代码中的注释。\n\n2. **在你的 `setup`\
  \ 方法中添加对 `drawScene` 方法的调用（参见图 7-27):**\n\n```java\nvoid setup()\n{\n  //Canvas\n\
  \  size(1000, 500);\n  //Draw the sky, grass, and hills\n  drawScene();\n  //Create\
  \ the character\n  character = loadImage(\"penguin.png\");\n  image(character, characterX,\
  \ characterY);\n}\n```\n\n3. **在你的 `draw` 方法中添加对 `drawScene` 方法的调用（参见图 7-28)::**\n\
  \n```java\nvoid draw()\n{\n  //Redraw the sky, grass, and hills\n  drawScene();\n\
  \  //Redraw the character\n  image(character, characterX, characterY);\n}\n```\n\
  \n4. **测试你的代码以确保场景仍然正确（参见图 7-29)。**\n\n现在当你移动角色时，它就不会再留下痕迹了。\n\n![image](img/9781119404170-fg0726.png)\n\
