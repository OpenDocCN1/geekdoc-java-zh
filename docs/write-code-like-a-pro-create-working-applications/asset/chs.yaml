  \n## 为你的游戏添加移动功能\n\n现在你已经有了场景和角色，是时候让它在场景中移动了。按照以下步骤操作：\n\n1. 在程序顶部添加两个角色的 `x` 和\
  \ `y` 坐标变量；将它们初始化为 `characterX = 0` 和 `characterY = 300`（参见图 7-19）。\n\n```java\n\
  int characterX = 0;\nint characterY = 300;\n```\n2. 将 `image` 方法中的 `0` 和 `300` 替换为\
  \ `characterX` 和 `character`（参见图 7-20）。\n\n```java\nimage(character, characterX,\
  \ characterY);\n```\n3. 添加一个空的 `keyPressed` 方法（参见图 7-21）。\n\n```java\nvoid keyPressed()\
  \ {\n}\n```\n4. 在 `keyPressed` 方法中添加条件语句，检查是否按了 A 或 D（参见图 7-22）。\n\n```java\nvoid\
  \ keyPressed() {\n  if (key == 'a') {\n  } else if (key == 'd') {\n  }\n}\n```\n\
  5. 添加代码根据是否按了 A 或 D 键来更新 `characterX` 变量以向左右移动（参见图 7-23）。\n\n```java\nvoid keyPressed()\
  \ {\n  if (key == 'a') {\n    characterX = characterX - 10;\n  } else if (key ==\
  \ 'd') {\n    characterX = characterX + 10;\n  }\n}\n```\n6. 添加一个 `draw` 方法并持续调用\
  \ `image` 方法，这样每次按下 A 或 D 键时，角色的位置都会更新（参见图 7-24）。\n\n```java\nvoid draw() {\n  image(character,\
  \ characterX, characterY);\n}\n```\n7. 测试你的代码，确保在按下 A 和 D ，角色会左右移动（参见图 7-25）。\n\n\
