  图 2-10 制作另一条黑白线条的代码和输出。\n\n在第 4 章中，你将学习更多关于颜色的知识，但这里是对像素属性（位置和颜色）的基础介绍。\n\n![image](img/9781119404170-fg0211.png)\n\
  图 2-11 位置指南。\n\n恭喜！你现在已经学习了关于像素、位置、颜色以及如何在 Java 中调用方法的知识！在下一节中，你将概述目前使用的的方法并了解调用方法的原理。\n\
  \n![image](img/9781119404170-fg0212.png)\n图 2-12 保存前务必命名文件。\n\n## 在 Java 中调用方法\n\
  \n你已经在为本章编写的代码中调用了好几个方法，但在编写代码时，理解你正在写什么很重要。在你目前调用的方法中包含两个部分：方法名和参数：\n\n`methodName(Parameters)`\n\
  \n方法名后面总是有左括号和右括号。在你目前使用的所有示例中，中间都有参数，但有时也没有。例如，有一个你尚未使用过的不带任何参数的方法：\n\n`exit()`\n\
  \n你可以尝试将这行代码添加到程序的最后一行。当你点击 Run 时，你应该看到画布出现然后立即关闭。这是因为 `exit` 方法会关闭画布。\n\n如果方法确实有参数，那么参数的顺序必须正确且类型正确。例如，`size`\
  \ 方法需要两个参数（或数字）；第一个数字必须是画布的宽度，第二个数字是画布的高度：\n\n`size(width, height)`\n\n你可以尝试放置较少或更多的参数并更改类型，你会发现会得到错误。例如，假设你第一个写的是：\n\
  \n`size(\"abc\")`\n\n你将收到一个错误消息，说明 `size` 方法需要两个整数参数（参见图 2-13）。\n\n![image](img/9781119404170-fg0213.png)\n\
  图 2-13 在 Processing 中可能获得的错误消息示例。\n\n在每个参数之间必须有一个逗号。\n\n最后，每个方法调用都以分号结尾。这告诉 Processing\
  \ 该行代码已结束。\n\n在第 2 章中，你已经调用了四个不同的方法：\n\n`size(width, height)`\n`color(colorCode)`\n\
  `set(x, y, color)`\n`exit()`\n\n## 创建变量\n\n变量基本上是你为你想要重复使用的值命的名字。在本章中，你创建了两个变量：`black`\
  \ 和 `white`。\n\n就像调用方法一样，创建变量时有固定格式：\n\n`type variableName = value;`\n\n在本章中，我们使用的类型是\
  \ `color`。你可能会在书中遇到的其他简单类型有：\n\n* `int`: 整数/数字\n* `boolean`: 真或假\n* `char`: 单字符，如\
  \ `a` 或 `b`\n* `color`: 像素的颜色\n\n变量的用在于你可以给一个值命名（例如 `color(0)`），然后通过使用该名称来使用该值。例如，这里相同的代码——第一个使用了变量，第二个没有：\n\
  \n```\ncolor black = color(0);\nset(240, 250, black);\nset(241, 250, black);\nset(242,\
  \ 250, black);\n```\n\n```\nset(240, 250, color(0));\nset(241, 250, color(0));\n\
  set(242, 250, color(0));\n```\n\n\n\n你可以看到，输入 `black` 而不是 `color(0)` 不仅更快，而且对于人类来说，使用单词\
  \ `black` 而不是代码 `color(0)` 也要清晰得多。\n\n这仍然会将这 3 个像素设置为黑色，因为当你在调用 `color` 方法时使用 `0`\
  \ 作为参数，但任何阅读这段代码的人都可能认为这 3 个像素被设置为紫色了！\n\n在本书的其余部分中，你将再次复习方法、参数和变量。\n\n![image](img/c3.png)\n\
  \n在第 2 章中，你学习了如何画一条黑白线。为了画一条长度为 20 像素的线就需要大量的代码！想象一下如果你想画一个黑白色的正方形，你必须画 20 条线，这意味着需要\
  \ 400 行代码！那太疯狂了——而且非常很容易出错。\n\n尽管画一个宽 20 像素、高 20 像素的正方形基本上是改变每个像素的颜色，但 Processing\
  \ 编程环境已经创建了你可以调用的方法来创建正方形，而不是编写所有 400 行代码来更改单个像素！\n\nProcessing 提供的五种原始（或简单）形状是：\n\
  \n```\ntriangle(x1, y1, x2, y2, x3, y3);\n```\n\n```\nrect(x, y, width, height);\n\
  ```\n\n```\nquad(x1, y1, x2, y2, x3, y3, x4, y4);\n```\n\n```\nellipse(x, y, width,\
  \ height);\n```\n\n```\narc(x, y, width, height, start, stop);\n```\n\n尽管 Processing\
  \ 让创建这些形状变得更简单，但它仍然可能棘手。在本章中，你将创建每种形状并稍微更改参数，以便在画布的不同部分绘制形状，并让它们具有不同的尺寸。\n\n## 绘制三角形\n\
  \n在 Processing 中，`triangle` 方法将创建一个接受六个参数的三角形，这些是三角形每个点的 `x` 和 `y` 位置。按照以下步骤操作：\n\
  \n1. **打开 Processing 并创建一个新程序。**\n2. **创建一个 500  像素乘 500 像素的画布（参见[图 3-1]](#06_9781119404170-ch03.xhtml_c03-fig-0001)):**\n\
  ```\nsize(500, 500);\n```\n3. **创建一个三角形，其上顶点位于画布中心（`x` = 250, `y` = 250）。三角形的高度应为\
  \ 100 像素，宽度应为 200 像素（参见[图 3-2]](#06_9781119404170-ch03.xhtml_c03-fig-0002)):**\n\
  ```\ntriangle(250, 250, 150, 350, 350, 350);\n```\n4. **点击运行查看你创建的三角形（参见[图 3-4]](#06_9781119404170-ch03.xhtml_c03-fig-0004）。**\n\
  5. **尝试更改每个点的 `x` 和 `y` 坐标以创建不同的三角形。**\n   这段代码创建了图 3-5 中所示的三角形：\n```\ntriangle(250,\
  \ 250, 250, 350, 300, 300);\n```\n   这段代码创建了图 3-6 中所示的三角形：\n```\ntriangle(250, 250,\
  \ 150, 450, 350, 450);\n```\n   这段代码创建了图 3-7 中所示的三角形：\n```\ntriangle(250, 250, 250,\
  \ 450, 450, 450);\n```\n6. **当你探索完不同的三角形形状后，注释掉创建三角形的行代码。**\n   要做到这一点，在方法名称前面添加两个正斜杠（参见[图\
  \ 3-8]](#06_9781119404170-ch03.xhtml_c03-fig-0008)):\n```\n//triangle(250, 250,\
  \ 250, 450, 450, 450);\n```\n   这将使 Processing 忽略与 `//` 同一行上的所有内容。\n\n![image](img/9781119404170-fg0301.png)\n\
