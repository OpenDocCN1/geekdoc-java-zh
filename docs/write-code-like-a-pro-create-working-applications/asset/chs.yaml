  \nFIGURE 9-9: 创建新标签。\n\n## 管道类 (PIPE CLASS)\n\n下一个要构建的类是 `Pipe` 类。为了方便跟踪你的代码，你将在单独文件中编写该类。遵循以下步骤：\n\
  \n1.  点击 `NinjaBird` 标签旁边的箭头，选择 `New Tab`（新标签页）。\n2.  将该文件命名为 `Pipe`（大写 P）。\n3.\
