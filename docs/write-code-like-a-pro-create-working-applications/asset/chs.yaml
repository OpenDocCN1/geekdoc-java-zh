  \nFIGURE 8-40: 运行中的最终游戏。你刚刚制作了一个游戏！游戏的目标是在失去所有生命值之前尝试让角色到达边缘！在下一章中，你将构建一个与其非常相似的游戏。不要忘记：如果你遇到困难，可以随时参考之前的章节来获取帮助。\n\
  \n![image](img/c9.png)\n\n在开始之前，你将在线玩 Flappy Bird，以了解在重新创建你自己的版本的游戏（称为 Ninja）时需要做什么。\n\
  \n1. 打开网络浏览器并访问 `http://flappybird.io`。\n当页面加载时，你可能会看到一个广告（参见图 9-1）。等到你可以点击 Skip\
  \ 按钮并点击。\n\n2. 你应该会在浏览器中看到 Flappy Bird 游戏（参见图 9-2）。\n\n3. 点击 Flappy Bird 开始游戏。\n\
  过程中，你需要不断点击鼠标让小鸟保持在空中。当你碰到管子时，会弹出一个菜单（参见图 9-3）。\n\n4. 玩几次游戏感受一下。\n要继续玩，可以点击 Restart\
  \ 按钮。\n\n5. 注意当你玩时，游戏会记录你的当前分数和最高分（参见图 9-4）。\n\n![image](img/9781119404170-fg0901.png)\n\
  \nFIGURE 9-1: 玩 Flappy Bird 之前看到的广告示例。\n\n![image](img/9781119404170-fg0902.png)\n\
  \nFIGURE 9-2: 浏览器中的 Flappy Bird 游戏。\n\n![image](img/9781119404170-fg0903.png)\n\n\
  FIGURE 9-3: 第一次失败时出现的菜单。\n\n![image](img/9781119404170-fg0904.png)\n\nFIGURE 9-4:\
  \ 该游戏记录你的最高分和最近的分。\n\n## 理解 FLAPPY BIRD 代码\n\n当你编写了长时间代码后，你将能够开始使用新技术并猜测编写什么样的代码来使该软件运行。尽管你刚刚开始，但你现在将在书中练习这些。\n\
  \n### 开始界面\n\n你所玩的 Flappy Bird 游戏首先要注意到的是开始界面（参见图 9-5）。它有三个部分：\n\n- **背景**：背景有蓝色背景、云朵、建筑和树的图像；棕色的地面以及似乎在移动的绿草。\n\
  - **小鸟**：下一部分是小鸟本身。小鸟是一个简单的图像，但它有一个动画让它看起来像在扇动翅膀。小鸟还会上下跳动。\n- **分数**：最后部分是一个带轮边的大白数字，代表分数。\n\
  \n![image](img/9781119404170-fg0905.png)\n\nFIGURE 9-5: Flappy Bird 的开始界面。\n\n根据你到目前在书中所做，创建所有这些应该相当简单。复杂的是让草看起来像在移动以及让小鸟的翅膀扇动。这些是你需要研究如何实现的代码片段。在你游戏的第一版本中，它们不会移动。\n\
  \n### 游戏界面\n\n当你开始玩游戏时，界面发生了微变化，有四个部分需要注意（参见图 9-6）：\n\n- **背景**：背景与开始界面相同。\n- **小鸟**：小鸟看起来一样，但现在除非玩家点击它，否则它会掉落。当玩家点击小鸟时，它向上移动。如果小鸟撞到管子，它会自动脸朝地掉到地上。\n\
  - **分数**：分数的样式与开始界面相同，但每当小鸟成功通过一组管子时，分数加 1。\n- **管子**：屏幕上最多有四根管子。其中两根从屏幕底部向上移动，另外两根直接在底部管子的上方，从屏幕顶部向下移动。每当一组新的管子出现在屏幕右侧时，它们之间的开口在垂直轴上的位置不同。管子之间的开口似乎始终是相同的像素数。\n\
  \n![image](img/9781119404170-fg0906.png)\n\nFIGURE 9-6: 游戏期间的 Flappy Bird。\n\n\n\
  \n\n你已经在这本书中完成了大量的编码工作以来实现这一切。可能比较困难的部分是，让每当有一组新管道从屏幕右侧出现时，管道之间的开口处每次都出现在随机的位置。\n\
  \n# 结束界面\n\n当你游戏失败时，界面会发生最后一次变化。在这种情况下，有三个部分需要注意（请参见图 9-7）：\n\n*   **背景：** 背景与游戏屏幕完全相同。唯一的区别是现在草地不再移动了。\n\
  *   **鸟和管道：** 鸟和管道保持在游戏屏幕结束时的完全相同的位置。它们不再移动。\n*   **分数：** 分数现在被一个方框围着，里面显示了刚刚玩的游戏的分数以及所有玩过的游戏最高分。\n\
  *   **按钮：** 在这个版本中，有三个按钮：重启（Restart）、分享（Share）和添加到排行榜（Add to Leaderboard）。\n\n![image](img/9781119404170-fg0907.png)\n\
  \nFIGURE 9-7: 游戏失败时显示的结束界面。\n\n由于你的游戏不在互联网上，而是在你的电脑上，你可以忽略“分享”和“添加到排行榜”按钮。你需要设解决的是“重启”按钮。按下此按钮时，它会将管道移回起点，将鸟送回天空，让按钮消失，让草地重新移动，并重置分数显示。\n\
  \n# 规划你的忍者鸟\n\n现在你已经有机会玩过一个版本的 Flappy Bird 并尝试破译代码中发生了什么，现在是时候规划你如何让你的忍者鸟工作工作了。\n\
  \n*   **背景：** 这部分应该是简单的，因为你已经在本书前面的部分在画布上创建了形状和图像。这里棘手的部分是草地移动，但这是可选的。\n*   **鸟：**\
  \ 你的鸟需要一直处于下降状态，除非用户执行某些操作，例如点击鼠标或键盘上的某个键。鸟需要一张图像（可能是一只鸟），这样它就不只是一个点。可选的是，鸟的翅膀应该是移动的。\n\
  *   **管道：** 这是一个有趣的点。尽管当你玩的时候，鸟看起来是正在穿过无限数量的管道，但如果你玩得足够久，你会注意到屏幕上同时只有两组管道。实际上发生的情况是，两组管道从屏幕右侧移动到屏幕左侧。当它们到达左侧时，它们会变得不可见，移回右侧并再次变得可见！这是一个让游戏看起来像有无限物品，而实际上只有几个的巧妙方法！这里的诀窍在于，你必须弄清楚如何确保管道之间的间隙在每次回到右侧时都处于一个随机的位置。\n\
  *   **分数：** 就像你之前玩过的 Flappy Bird 游戏一样，你应该有一个分数变量，用来记录鸟成功飞过了多少根管道。你还应该有第二个变量，记录鸟成功飞过的管道最大数量。游戏时时应该显示当前分数，一旦玩家失败，两个分数都应该显示出来。\n\
  *   **按钮：** 对于你的忍者鸟游戏，你应该有一个重启游戏的按钮。当游戏重启时，你必须改变鸟（位置）、管道（位置）以及两个分数变量（将当前分数重置为 0，如果当前分数高于最高分，则应更新最高分）。\n\
  \n# 设计你的 Java 类\n\n现在你已经对游戏将如何进行有了了解，是时候规划你的 Java 类了，这样你就知道需要编写哪些变量和方法。在这一节中，你将向一个新的\
  \ Sketch 文件中添加注释，以概述你想要编写的代码。这种策略是软件工程师在编写复杂程序有时会使用的策略。通过先添加注释，你可以确保在编写代码时不会忘记任何内容。它也有助于调试（找到你代码中的错误），因为你可以将你想要执行的（注释）与你实际执行的（代码）进行比较。\n\
  \n打开 Processing 并创建一个新的 Sketch 文件。立即保存该文件并将其命名为 `NinjaBird`。\n\n## 主类 (MAIN CLASS)\n\
  \n虽然你不需要像创建其他类时那样添加 `class` 单词，但你的第一个类是你开始时所使用的那个 Sketch 文件，它包含了 `setup` 和 `draw`\
  \ 方法。\n\n在这个类中，你将希望：\n\n*   同时对两个分数变量的跟踪。\n*   绘制背景。\n*   在需要的时候显示按钮。\n*   跟踪游戏状态（开始、进行中、结束）。\n\
  \n在你空的 Sketch 文件中，输入以下代码，为你为主类所需的代码创建注释和空方法签名。（参见图 9-8）\n\n```\n// 同时对两个分数变量的跟踪\n\
  // 绘制背景\n// 在需要的时候显示按钮\n// 跟踪游戏状态\nvoid setup()\n{\n}\n\nvoid draw()\n{\n}\n```\n\
