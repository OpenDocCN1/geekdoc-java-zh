  \ `characterY` 变量让角色向下移动（参见图 7-32)::**\n\n```java\nvoid draw()\n{\n  //Redraw the\
  \ sky, grass, and hills\n  drawScene();\n  if(characterY < 300)\n  {\n    characterY\
  \ = characterY + 2;\n  }\n  //Redraw the character\n  image(character, characterX,\
  \ characterY);\n}\n```\n\n3. **调整更改 `characterY` 变量的数字，以便跳得很高并缓慢落下（参见图 7-33)::**\n\
  \n在 `draw` 方法的条件中，如果值小于 300：\n`characterY = characterY + 2;`\n\n在 `keyPressed` 方法的条件中，当按下空格键时：\n\
  `characterY = characterY - 5;`\n\n4. **调整更改 `characterX` 变量的数字，使其跳过山丘（参见图 7-34):**\n\
  \n在 `keyPressed` 方法的条件中，当按下 A 键时：\n`characterX = characterX - 10;`\n\n在 `keyPressed`\
  \ 方法的条件中，当按下 D 键时：\n`characterX = characterX + 10;`\n\n![image](img/9781119404170-fg0731.png)\n\
  \n图 7-31： 按下空格键时移动。\n\n![image](img/9781119404170-fg0732.png)\n\n图 7-32： 在草地上方时向下移动。\n\
  \n![image](img/9781119404170-fg0733.png)\n\n图 7-33： 调整跳跃高度。\n\n![image](img/9781119404170-fg0734.png)\n\
  \n图 7-34： 跳过山丘。\n\n现在当你移动角色时，它不应该再留下痕迹。\n\n恭喜！你已经为世界添加了重力！\n\n\n\n\n\n5. **添加对 `text`\
  \ 方法调用，让角色在接触岩浆时说“OW!”（参见图 7-39）：**\n\n```javascript\n//text(characterX, characterX\
  \ + 60, characterY – 5);\n//Check to see if the character hit the lava\nif((characterX\
