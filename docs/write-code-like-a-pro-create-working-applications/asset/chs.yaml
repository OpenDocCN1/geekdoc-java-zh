  \n## 为你的管道添加随机性\n\n确保你打开了第 11 章](#14_9781119404170-ch11.xhtml)的 NinjaBird 代码。在本节中，你将学习如何向代码添加一些随机性——具体来说，是让管道在每次回到画布右侧时具有不同的位置。\n\
  \n为了使用随机性，你将学习 Java 库。Java 库是任何任何人都可以使用的代码段。它们与 Processing 应用提供的代码（如 `rect` 方法）类似。按照以下步骤操作：\n\
  \n1. 在 `Pipes` 类的顶部导入 `Random` 库（参见图 12-1）：\n\n```java\nimport java.util.Random;\n\
  ```\n\n2. 在 `Pipes` 类中添加一个允许你选择随机数的变量（参见图 12-2）：\n\n```java\n//创建随机数的变量\nRandom\
  \ rand = new Random();\n```\n\n3. 添加两行代码来更新顶部和底部管道的 `y` 坐标。\n\n   首先，选择一个随机数作为底部管道的\
  \ `y` 坐标：\n\n```java\nyCoordinateBottom = rand.nextInt(450) + 250;\n```\n\n   然后，设置顶部管道的\
  \ `y` 坐标，使其距离底部管道正好 800 像素：\n\n```java\nyCoordinateTop = yCoordinateBottom - 800;\n\
  ```\n\n   图 12-3 显示了这两行新代码应该添加到 `Pipes` 类的 `move` 方法中。\n\n4. **测试你的代码，确保管道在每次回到屏幕右侧时都具有随机的\
