  \ statement to check if the bird has hit\n//the pipes\nif(checkCollision())\n  {\n\
  \    text(\"YES\", bird.getX() + 60, bird.getY() - 5);\n  }\nelse\n  {\n    text(\"\
  NO\", bird.getX() + 60, bird.getY() - 5);\n  }\n```\n\n测试你的代码，确保鸟根据它是避开了管道还是碰到了管道来更新上面的文字。\n\
  \n## 在游戏中记录分数\n\n现在你已经可以判断鸟是否撞到了管道，是时候记录游戏分数了。幸运的是，你已经知道鸟是否正通过管道的间隙——你只需要添加另一个方法让主类知道这一点。\n\
  \n1. 在你的 `Pipes` 类中，创建两个返回 Boolean 并接受整数参数的新方法。第一个方法名为 `birdWithinPipes`；第二个方法名为\
  \ `birdWithinGap`。将 `checkIfHit` 方法中的代码移动到刚创建的两个方法中（参见图 12-14）：\n\n```java\nboolean\
  \ birdWithinPipes(int x)\n{\n```\n\n\n\n\n\n```java\n//判断鸟是否在管道的水平\n//范围内内\nboolean\
  \ birdPastPipesBeg = x >= xCoordinateTop;\nboolean birdBeforePipesEnd = x <= (xCoordinateTop\
  \ + widthTop);\nboolean birdWithinPipes = birdPastPipesBeg && birdBeforePipesEnd;\n\
  return birdWithinPipes;\n}\n\nboolean birdWithinGap(int topY, int bottomY)\n{\n\
  //判断鸟是否在管道的垂直\n//间隙内\nboolean birdBelowTopPipes = topY > (yCoordinateTop + heightTop);\n\
  boolean birdAboveBottomPipes = bottomY < yCoordinateBottom;\nboolean withinGap =\
  \ birdBelowTopPipes && birdAboveBottomPipes;\nreturn withinGap;\n}\n\nboolean checkIfHit(int\
  \ x, int topY, int bottomY)\n{\n//使用条件语句检查鸟是否与管道\n//位于同一个位置上\nif(birdWithinPipes(x)\
  \ && !birdWithinGap(topY, bottomY))\n{\nreturn true;\n}\nreturn false;\n}\n```\n\
  \n2. **创建一个名为** `birdPassedPipes` ****新方法，它接收一个整数参数并返回一个布尔值。如果鸟到达了管道的右侧（即成功通过），则该方法应返回\
  \ true。**\n\n```java\nboolean birdPassedPipes(int x)\n{\nboolean birdAtPipesEndLeft\
  \ = x >= ((xCoordinateTop + widthTop) - 2);\nboolean birdAtPipesEndRight = x <=\
  \ ((xCoordinateTop + widthTop) + 2);\nif(birdAtPipesEndLeft && birdAtPipesEndRight)\n\
  {\nreturn true;\n}\nreturn false;\n}\n```\n\n3. **创建一个名为** `checkIfPassed` ****新方法，它返回一个布尔值并接受三个整数参数。如果鸟通过了管道*且*鸟在间隙内（参见**\
  \ 图 12-15**），该新方法应返回 true。**\n\n```java\nboolean checkIfPassed(int x, int topY,\
  \ int bottomY)\n{\n//使用条件语句检查鸟是否与管道\n//位于同一个位置上\nif(birdPassedPipes(x) && birdWithinGap(topY,\
  \ bottomY))\n{\nreturn true;\n}\nreturn false;\n}\n```\n\n4. **在你的 NinjaBird 主类顶部创建两个变量，用于记录当前得分和最高分（参见**\
  \ 图 12-16**）。****\n\n```java\n//用于记录当前得分和最高\n//分的两个变量\nint currentScore = 0;\nint\
  \ bestScore = 0;\n```\n\n5. **在你的 NinjaBird 主类中创建一个名为** `trackScore` ****新方法，用于检查鸟是否通过了其中一组管道（参见**\
  \ 图 12-17**）。****\n\n```java\n//检查鸟是否成功通过了\n//一组管道的方法\nvoid trackScore()\n{\nint\
  \ birdRightX = bird.getX() + bird.getWidth()/2;\nint birdTopY = bird.getY() - bird.getHeight()/2;\n\
  int birdBottomY = bird.getY() + bird.getHeight()/2;\nif(pipes.checkIfPassed(birdRightX,\
  \ birdTopY,\nbirdBottomY) || pipes2.checkIfPassed(birdRightX,\nbirdTopY, birdBottomY))\n\
  {\ncurrentScore = currentScore + 1;\n}\n}\n```\n\n6. **在 draw 方法中调用** `trackScore`\
  \ **方法，并在鸟头上方打印当前得分。**\n\n```java\n//持续检查鸟是否应该获得\n//另一个分\ntrackScore();\ntext(currentScore,\
  \ bird.getX() + 60, bird.getY() - 5);\n```\n\n7. **在** `checkCollision` 条件语句*内部*添加一个条件语句，当鸟撞到管道时，*如果*当前得分高于最高分，则更新\
  \ `bestScore` 变量。然后将 `currentScore` 重置为 0（参见** 图 12-18**）。**\n\n```java\n//检查鸟是否撞到了\n\
  //管道的条件语句\nif(checkCollision())\n{\nif(currentScore > bestScore)\n{\nbestScore =\
  \ currentScore;\ncurrentScore = 0;\n}\n}\n```\n\n8. **测试你的代码，确保每当鸟通过管道时得分都会更新，如**\
  \ 图 12-19**所示，并且每当鸟撞到管道时得分都会恢复为 0，如** 图 12-20**所示。**\n\n9. **在你的 NinjaBird 类的 draw\
  \ 方法末尾添加一行代码，在屏幕上方显示最高分****\n\n```java\ntext(\"BEST:\" + bestScore, 400, 50);\n\
  ```\n\n10. **测试你的代码，确保每当鸟撞到管道时最高分都会更新，如果当前得分高于最高分（参见** 图 12-22**）。**\n\n\n\n\n`SARAH\
  \ GUTHALS` 于 2014 年获得加州大学圣地亚哥分校（UCSD）计算机科学博士学位，专注于计算机教育。研究生期间，她开发了 CodeSpells 的测试版本，这是一款\
  \ 3D 沉浸式视频游戏，旨在孩子们通过扮演魔法师和编写“咒语”来学习编程。随后，她共同创立了 ThoughtSTEM，这家公司致力于为儿童编程开发软件（如 LearnToMod）、课程和教学法，并赋能\
  \ K–12 教师向其学生教授编程。她写过四本关于 Minecraft 的书和一本关于移动开发的书，还为兴趣教授编程的老师上线了 Coursera 和 EdX\
  \ 课程，近期入选了福布斯“30 岁以下 30 位精英榜”科学类，并创立了 We Can，这是一家致力于鼓励所有孩子尝试任何事情的公司。她的热情是让每个人都能接触到编程，目标是使其成为一项基础素养。Sarah\
  \ 目前在 UCSD 授课。\n\n## 献辞\n\n我想将这本书献给支持我的亲密朋友和家人，他们不仅在我撰写这本书期间支持我，更成就了今天的我。我想特别将这本书献给\
  \ Adrian Guthals，他一直帮助我看到，只要充满热情奉献，我真的可以任何任何想做的事情。\n\n## 作者致谢\n\n我要感谢为开发 Processing\
