  \ 方法，它不接受参数并将生命值减少 1（参见图 8-31）。\n\n```java\nvoid updateHealth()\n{\n  health = health\
  \ - 1;\n}\n```\n\n3. 在 `move` 方法中添加一行代码，每当角色触碰岩岩时调用 `updateHealth`（参见图 8-32）。\n\n\
  ```java\nupdateHealth();\n```\n\n4. 创建一个名为 `getHealth` 方法，返回整数类型的生命值（参见图 8-33）。\n\
  \n```java\nint getHealth()\n{\n  return health;\n}\n```\n\n5. 确保在 `setup` 方法最后调用\
  \ `drawScene` 方法（参见图 8-34）。这是因为你需要先创建角色才能访问该变量。\n\n6. 在画布上添加大小为 32 的文本来显示角色的生命值（参见图\
  \ 8-35）。这段代码应该写在 `drawScene` 方法的底部：\n\n```java\ntextSize(32);\ntext(character.getHealth(),\
  \ 900, 50);\n```\n\n\n\n\n\n1. 在你的 `Enemy` 类中创建一个名为 `collidedWith` 的新方法，它返回一个 `Boolean`（true\
  \ 或 false），并带有四个整数参数（`x`、`y`、`x2` 和 `y2`），如图 8-36 所示。\n\n这四个参数最终将拥有角色的位置值。\n\n你可以将此代码添加到\
  \ `Enemy` 构造函数的下方：\n\n```java\nboolean collidedWith(int x, int y, int x2, int y2)\n\
  {\n    return false;\n}\n```\n\n2. 添加一个条件语句，检查敌人的位置是否在角色的矩形范围内（参见图 8-37）。\n\n```java\n\
  boolean collidedWith(int x, int y, int x2, int y2)\n{\n    if(enemyX >= x && enemyX\
  \ <= x2 && enemyY >= y && enemyY <= y2)\n    {\n        return true;\n    }\n  \
  \  return false;\n}\n```\n\n3. 为你的 `Character` 类添加四个方法，以返回角色起始点的 `x` 和 `y` 坐标以及角色结束点的\
