  \n## 学习 RGB 值\n\n正如你可能在上一节中注意到的，`background` 方法的每个参数都有独特之处。每个参数可以取 0 到 255 之间的数值：\n\
  \n* `Red` 代表颜色中的红色含量。\n* `Green` 代表颜色中的绿色含量。\n* `Blue` 代表颜色中的蓝色含量。\n\n注意参数的顺序是 `Red`、`Green`\
  \ 然后是 `Blue`。这就是为什么它被称为 RGB！如果这三个参数的值都是 `0`，颜色将是黑色（参见图 4-7）：\n\n```\nbackground(0,\
  \ 0, 0);\n```\n\n如果所有三个参数的值都是 255，颜色将是白色（参见图 4-8）：\n\n```\nbackground(255, 255,\
  \ 255);\n```\n\n\n\n\n\n图 4-8: 将背景完全变为白色的示例。\n\n你可以尝试调整每个参数的值来获得特定的颜色。\n\n![image](img/9781119404170-fg0409.png)\n\
  \n图 4-9: Rapid Tables 网站上用于选择颜色的 RGB 选择器。\n\n![image](img/9781119404170-fg0410.png)\n\
  \n图 4-10: 在代码中使用来自网站的 RGB 数字。\n\n## 为形状添加颜色\n\n形状可以通过两种不同的方式设置颜色：\n\n* **描边 (Stroke)**：形状的轮廓\n\
  * **填充 (Fill)**：形状内部的颜色\n\n向你的程序中添加三行代码（参见图 4-11):\n\n```\nstroke(255, 255, 255);\n\
  fill(56, 205, 130);\ntriangle(250, 250, 250, 450, 450, 450);\n```\n\n![image](img/9781119404170-fg0411.png)\n\
  \n图 4-11: 将三角形改为绿色并带有白色轮廓的示例。\n\n注意，描边是白色的，填充是绿色的。如果你不想让轮廓可见，可以将其设置为与填充相同的颜色（参见图\
  \ 4-12):\n\n```\nstroke(56, 205, 130);\nfill(56, 205, 130);\ntriangle(250, 250,\
  \ 250, 450, 450, 450);\n```\n\n![image](img/9781119404170-fg0412.png)\n\n图 4-12:\
  \ 使整个三角形变为绿色的示例。\n\n如果你想让所有形状都具有相同的颜色，只需要在开头调用一次 `stroke` 和 `fill`（参见图 4-13):\n\n\
  ```\nstroke(56, 205, 130);\nfill(56, 205, 130);\ntriangle(250, 250, 250, 450, 450,\
  \ 450);\nrect(100, 50, 200, 400);\nquad(50, 50, 150, 50, 150, 150, 50, 150);\n```\n\
  \n![image](img/9781119404170-fg0413.png)\n\n图 4-13: 使三个形状完全变为绿色的示例。\n\n但如果你想让所有形状具有不同的颜色，你需要在绘制每个形状之前调用\
  \ `stroke` 和 `fill`（参见图 4-14):\n\n```\nstroke(56, 205, 130);\nfill(56, 205, 130);\n\
  triangle(250, 250, 250, 450, 450, 450);\nstroke(56, 105, 205);\nfill(556, 105, 205);\n\
  rect(100, 50, 200, 400);\nstroke(205, 56, 205);\nfill(205, 56, 205);\nquad(50, 50,\
  \ 150, 50, 150, 150, 50, 150);\n```\n\n![image](img/9781119404170-fg0414.png)\n\n\
  图 4-14: 使三个形状颜色不同的示例。\n\n尝试为你在第 3 章中制作的绘画添加颜色，或者现在就可以使用颜色创建一个新的绘画吧！\n\n![image](img/c5.png)\n\
  \n在本书的前四章中，你学习了如何调用方法。你调用方法来创建画布、更改画布颜色、创建形状以及更改这些形状的颜色。方法是编程中非常有用的工具，因为许多代码只需要编写一次并命名，然后程序员就可以使用方法名称来执行所有这些代码。方法让代码更容易理解且更易于管理。\n\
  \n在本章中，你将学习为什么方法是有用的，发现你可能想要编写的制作动画（以及以后的游戏！）的方法，并了解如何编写自己的方法。在此之前，对方法进行简单概述！\n\n\
  ## 学习方法\n\n在本节中，你将更多地了解 Java 方法。方法是编程中非常重要的部分，因为它们将你的代码分解成命名的代码块。然后你可以使用这些代码块的名称反复调用相同的代码。方法是编程的基础之一，即使在其他编程语言（而不只是\
  \ Java）中也有用。\n\n### 方法签名\n\n在 Java 中，你总是以的方式编写方法：\n\n```\nreturnType methodName(parameterType\
  \ parameterName)\n{\n    CODE\n}\n```\n\n上述代码段的第一行代码被称为方法签名。它包含了你（或使用你代码的程序员）调用方法所需的所有信息。\n\
  \n方法签名包含三个部分：\n\n* `returnType`：方法返回的值的类型。\n* `methodName`：调用方法的名称。\n* `(parameterType\
  \ parameterName)`：方法接受的输入。\n\n\n\n\n\n图 5-2: 带有新的红色画布的 `setup` 方法体。\n\n![image](img/9781119404170-fg0503.png)\n\
  \n图 5-3: 当你点击运行（Run）按钮时，会出现红色画布。\n\n在编写简单的程序时，`setup` 方法可能会非常简单，就像你刚刚编写的那样。但当你开始制作视频游戏时，设置设置代码可能会变得更加复杂。你将在本书的后面看到这一点。\n\
  \n## 编写 DRAW 方法\n\n下一个方法称为 `draw`。该方法在 `setup` 方法执行完毕后会自动被调用。然后，`draw` 方法会被反复地（一次又一次）调用，直到画布关闭。\n\
  \n1. 在 `setup` 方法的右大括号之后，添加另一个名为 `draw` 的方法，它没有返回值且不接受任何参数（参见图 5-4）：\n   ```\n \
  \  void draw()\n   {\n   }\n   ```\n2. 在方法体内添加三行代码，在画布中心绘制一个圆，该圆具有白色轮廓和蓝色填充（参见图\
  \ 5-5）：\n   ```javascript\n   void draw()\n   {\n     stroke(255, 255, 255);\n \
  \    fill(0, 0, 250);\n     ellipse(250, 250, 300, 300);\n   }\n   ```\n3. 点击运行（Run）按钮并确保圆已经画出来（参见图\
  \ 5-6）。\n\n![image](img/9781119404170-fg0504.png)\n\n图 5-4: 一个空的 `draw` 方法。\n\n\
  ![image](img/9781119404170-fg0505.png)\n\n图 5-5: 创建一个带有白色轮廓的蓝色圆的三行代码。\n\n![image](img/9781119404170-fg0506.png)\n\
  \n图 5-6: 画布上的蓝白相圆。\n\n`draw` 方法被反复、一次又一次地调用，但圆只出现了一次。这是因为圆实际上在被反复绘制，但它是在完全相同的位置绘制的，所以你看不见任何变化。在下一节中，你将学习如何制作一个简单的动画！\n\
  \n## 编写你的前两个原始方法\n\n本节的目标是让你在上一个节中创建的圆（参见图 5-6）跨屏幕移动！\n\n### 创建两个有用的变量\n\n在两个方法上方，你需要添加两个变量，用于跟踪椭圆的\
  \ *x-* 和 *y-* 坐标。\n\n1. 首先，添加两个名为 `xCoordinate` 和 `yCoordinate` 的变量。这些变量的类型应为 `int`（整数），且值应为\
  \ 250（参见图 5-7）：\n   ```javascript\n   int xCoordinate = 250;\n   int yCoordinate\
  \ = 250;\n   ```\n2. 将 `ellipse` 方法调用中的两个 250 值替换为你第 1 步中创建的变量（参见图 5-8）：\n   ```javascript\n\
  \   void draw()\n   {\n     stroke(255, 255, 255);\n     fill(0, 0, 250);\n    \
  \ ellipse(xCoordinate, yCoordinate, 300, 300);\n   }\n   ```\n3. 点击运行（Run）按钮进行测试，确保蓝白相间的圆仍然在图\
  \ 5-6 所示。由于你将两个变量设置为 250，所以圆留在原地（参见图 5-9）。\n4. 将 `xCoordinate` 变量设置为 0（参见图 5-10）：\n\
  \   ```javascript\n   int xCoordinate = 0;\n   int yCoordinate = 250;\n   ```\n\
  5. 点击运行（Run）按钮测试蓝白相间的圆的位置。圆现在位于 *x* = 0, *y* = 250，即画布左侧中央（参见图 5-10）。\n6. 同样将 `yCoordinate`\
  \ 变量设置为 0（参见图 5-11）：\n   ```javascript\n   int xCoordinate = 0;\n   int yCoordinate\
  \ = 0;\n   ```\n7. 点击运行（Run）按钮，确保蓝白相间的圆在画布左上角。\n\n![image](img/9781119404170-fg0507.png)\n\
  \n图 5-7: 用于跟踪圆的 *x* 和 *y* 位置的两个变量。\n\n![image](img/9781119404170-fg0508.png)\n\n\
  图 5-8: 在 `ellipse` 方法调用两个变量。\n\n![image](img/9781119404170-fg0509.png)\n\n图 5-9:\
  \ 测试代码以确保圆仍在中心。\n\n![image](img/9781119404170-fg0510.png)\n\n图 5-10: 将 `xCoordinate`\
  \ 变量设置为 0，让圆向左移动。\n\n![image](img/9781119404170-fg0511.png)\n\n图 5-11: 将 `yCoordinate`\
  \ 变量设置为 0，让圆向上移动。\n\n现在你有了两个可以帮助圆在画布上移动的变量，你可以编写两个方法在画布开启时更改变量的值。\n\n### 创建自定义方法\n\
  \n现在你有了控制圆在画布绘制位置的两个变量 `xCoordinate` 和 `yCoordinate`，你可以编写一个方法在画布开启时更改变量的值。\n\n\
  1. 编写一个名为 `moveDownAndRight` 的新方法，无返回值且没有参数（参见图 5-12）：\n   ```javascript\n   void\
  \ moveDownAndRight()\n   {\n   }\n   ```\n   确保 `xCoordinate` 和 `yCoordinate` 变量都设置为\
  \ 0（参见图 5-12）：\n   ```javascript\n   int xCoordinate = 0;\n   int yCoordinate =\
  \ 0;\n   ```\n2. 将 `xCoordinate` 和 `yCoordinate` 变量设置为它们之前的值加 1（参见图 5-13）：\n   ```javascript\n\
  \   void moveDownAndRight()\n   {\n     xCoordinate = xCoordinate + 1;\n     yCoordinate\
  \ = yCoordinate + 1;\n   }\n   ```\n   所以，如果 `xCoordinate` 从 0 开始，那么第一次调用 `moveDownAndRight`\
  \ 时，`xCoordinate` 将设置为 1，第二次调用该方法时，它将被设置为 2。这种情况将持续到画布关闭。\n3. 在绘制圆之后添加一行代码调用 `moveDownAndRight`\
  \ 方法（参见图 5-14）：\n   ```javascript\n   void draw()\n   {\n     stroke(255, 255, 255);\n\
  \     fill(0, 0, 250);\n     ellipse(xCoordinate, yCoordinate, 300, 300);\n    \
  \ moveDownAndRight();\n   }\n   ```\n4. 点击运行（Run）按钮测试你编写的代码。\n因为 `draw` 方法被反复调用直到画布关闭，圆应该开始向右下方移动（参见图\
  \ 5-15）。\n5. 正如你注意到的，圆被反复绘制，你可以看到它留下的痕迹。如果你想让圆移动而不留下痕迹，请在绘制圆之前调用一次 `background`\
  \ 方法（参见图 5-16）：\n   ```javascript\n   void draw()\n   {\n     background(255, 0,\
  \ 0);\n     stroke(255, 255, 255);\n     fill(0, 0, 250);\n     ellipse(xCoordinate,\
  \ yCoordinate, 300, 300);\n     moveDownAndRight();\n   }\n   ```\n   现在，你的 `draw`\
  \ 方法执行以下步骤：\n\n* 使画布变为全红色\n* 绘制一个具有白色轮廓和蓝色填充的圆\n* 更新圆的位置\n* 重复直到画布关闭。\n\n\n\n\n\n\
  6. 点击运行按钮，确保你的圆跨越屏幕时后面没有留下痕迹（参见图 5-17）。\n\n![image](img/9781119404170-fg0512.png)\n\
  \n图 5-12: 一个空的 `moveDownAndRight()` 方法。\n\n![image](img/9781119404170-fg0513.png)\n\
  \n图 5-13: 在 `moveDownAndRight` 中添加了两个行代码，用于更新 `xCoordinate` 和 `yCoordinate` 变量。\n\
  \n![image](img/9781119404170-fg0514.png)\n\n图 5-14: 每次绘制圆时都调用一次 `moveDownAndRight`。\n\
  \n![image](img/9781119404170-fg0515.png)\n\n图 5-15: 蓝白相色的圆带有痕迹跨越画布。\n\n![image](img/9781119404170-fg0516.png)\n\
  \n图 5-16: 再次调用背景方法以覆盖圆的痕迹。\n\n![image](img/9781119404170-fg0517.png)\n\n图 5-17:\
  \ 圆跨越画布且没有留下痕迹。\n\n恭喜！你现在已经制作了一个动画！在下一节中，你将学习如何调整动画的速度。\n\n## 为你的方法添加参数\n\n现在你已经有了动画，可以添加一个参数来加速你的动画。给\
  \ `xCoordinate` 增加 1 并给 `yCoordinate` 增加 1，基本上就是每次绘制时让圆向左移动 1 像素并向下 1 像素。如果你将 1\
  \ 改为 2，圆将向左移动 2 像素并向下 2 像素，这会让圆看起来移动速度快了一倍（参见图 5-18）：\n\n```\nvoid moveDownAndRight()\n\
  {\n  xCoordinate = xCoordinate + 2;\n  yCoordinate = yCoordinate + 2;\n}\n```\n\n\
  ![image](img/9781119404170-fg0518.png)\n\n图 5-18: 修改 `xCoordinate` 和 `yCoordinate`\
  \ 变量，每次移动 2 像素而不是 1 像素。\n\n在这个示例中，只有两个地方需要更改显示速度的值：\n\n```\nxCoordinate = xCoordinate\
  \ + 2;\nyCoordinate = yCoordinate + 2;\n```\n\n但你仍然不想意外地改变其中一个而忘记改变另一个。为了避免这种错误，你可以为你的\
  \ `moveDownAndRight` 方法添加一个参数，这样 `xCoordinate` 和 `yCoordinate` 变量总是按相同的量变化。\n\n\
  1. **在 `moveDownAndRight` 方法签名中添加参数类型和参数名称。类型应该是 `int`（因为该值是一个数字），名称应该是 `speed`：**\n\
  \n```\nvoid moveDownAndRight(int speed)\n{\n  xCoordinate = xCoordinate + 2;\n \
  \ yCoordinate = yCoordinate + 2;\n}\n```\n\n你实际上可以给参数起任何你喜欢的名称，最好的做法是让名称代表该值，所以\
  \ `speed` 是一个很好的选择。\n\n注意，你在 Processing 窗口底部收到一个错误消息（参见图 5-20）。这是发生是因为当你调用 `moveDownAndRight`\
  \ 时，没有传递一个数值。\n\n2. **在 `moveDownAndRight` 方法调用的括号之间放入数字 2（参见图 5-21）：**\n\n```\n\
  void draw()\n{\n  background(255, 0, 0);\n  stroke(255, 255, 255);\n  fill(0, 0,\
  \ 250);\n  ellipse(xCoordinate, yCoordinate, 300, 300);\n  moveDownAndRight(2);\n\
  }\n```\n\n3. **将 `moveDownAndRight` 方法体中的两个 2 替换为参数 `speed`（参见图 5-22）：**\n\n```\n\
  void moveDownAndRight(int speed)\n{\n  xCoordinate = xCoordinate + speed;\n  yCoordinate\
  \ = yCoordinate + speed;\n}\n```\n\n4. **点击运行按钮，确保你的圆跨越屏幕时后面没有留下痕迹（参见图 5-17）。**\n\
  \n5. **尝试将参数的值改为 8（参见图 5-23）：**\n\n```\nvoid draw()\n{\n  background(255, 0, 0);\n\
  \  stroke(255, 255, 255);\n  fill(0, 0, 250);\n  ellipse(xCoordinate, yCoordinate,\
  \ 300, 300);\n  moveDownAndRight(8);\n}\n```\n\n\n\n\n\n```javascript\nyCoordinate\
  \ = yCoordinate + speed;\n}\n```\n\n2. **在你的 `draw` 方法中找到对 `ellipse` 方法的调用，并将 `xCoordinate`\
  \ 修改为 `mouseX`，将 `yCoordinate` 修改为 `mouseY`（参见图 6-2）。\n\n   你应该修改的代码行是对 `ellipse`\
  \ 的调用：\n\n```javascript\nellipse(mouseX, mouseY, 300, 300);\n```\n\n3. **注释掉调用你的\
  \ `moveDownAndRight` 方法的代码行（参见图 6-3）。**\n\n   因为现在圆的位置将通过 `mouseX` 和 `mouseY` 变量进行更新，你不再需要更新\
  \ `xCoordinate` 或 `yCoordinate` 变量了。\n\n   **记住：** 要注释掉代码，可以在代码行前面加上两个 `//`，如下所示：\n\
  \n```javascript\n//moveDownAndRight(8);\n```\n\n   虽然通常删除未使用的代码更好，但当你不确定将进行哪些更改时，先注释掉这些行可能会更好。等你的代码按照你想要的方式正常运行后，就可以删除注释的代码以便于阅读。\n\
  \n4. **点击运行（Run）按钮，观察你的圆如何移动到鼠标所在的位置（参见图 6-5）！**\n\n![image](img/9781119404170-fg0601.png)\n\
  \n图 6-1： 来自第 5 章末尾的 CircleAnimation 草图。\n\n![image](img/9781119404170-fg0602.png)\n\
  \n图 6-2： 修改代码将圆移动到鼠标所在的位置。\n\n![image](img/9781119404170-fg0603.png)\n\n图 6-3： 注释掉对\
  \ `moveDownAndRight` 方法调用。\n\n![image](img/9781119404170-fg0604.png)\n\n图 6-4： 删除了未使用代码的\
  \ CircleAnimation 代码变体。\n\n![image](img/9781119404170-fg0605.png)\n\n图 6-5： 当你运行代码时，圆始终跟随鼠标。\n\
  \n## 与鼠标点击交互\n\n有时你可能希望形状始终跟随鼠标移动，但其他时候你又希望形状仅在用户点击鼠标时才随之移动。把它想象成“点击并拖拽”。你可能在网站或游戏上遇到这种情况，比如有一个圆，你必须点击并拖动它来提交问题的答案。\n\
  \n例如，你可能遇到过像 W3Schools.com 网站上的滑动块（[www.w3schools.com/howto/howto_js_rangeslider.asp](http://www.w3schools.com/howto/howto_js_rangeslider.asp)；参见图\
  \ 6-6）。\n\n![image](img/9781119404170-fg0606.png)\n\n图 6-6： 这种滑动块的设计使得仅当用户点击并拖拽它们时，形状才会水平移动。\n\
  \n你可以通过使用应用程序自带的另一个 Processing 方法 `mouseDragged` 来快速将你的代码转换为滑动块版本。按照以下步骤操作：\n\n\
  1. **添加另一个名为** `mouseDragged` 的方法，该方法不返回值且不接受参数（参见图 6-7）。\n\n   `mouseDragged` 是\
  \ Processing 在用户点击并移动鼠标时知道要调用的方法。你在 `draw` 方法之后、`moveDownAndRight` 方法之前添加的代码如下：\n\
  \n```javascript\nvoid mouseDragged() {\n\n}\n```\n\n2. 在 `mouseDragged` 中添加两行代码，将\
  \ `xCoordinate` 和 `yCoordinate` 变量更新为鼠标位置（参见图 6-8）。\n\n   这两行代码是：\n\n```javascript\n\
  xCoordinate = mouseX;\nyCoordinate = mouseY;\n```\n\n3. 将 `ellipse` 方法调用改为 `xCoordinate`\
  \ 和 `yCoordinate`，而不是 `mouseX` 和 `mouseY`（参见图 6-9）。\n\n   `ellipse` 的调用现在应该是：\n\n\
  ```javascript\nellipse(xCoordinate, yCoordinate, 300, 300);\n```\n\n4. **点击运行按钮，确保圆只在你拖拽鼠标时才移动。**\n\
  \n   如果你松开鼠标，圆应该停止移动。如果你在按下按钮的情况下上下鼠标，圆不会移动。\n\n![image](img/9781119404170-fg0607.png)\n\
  \n图 6-7： 空的 `mouseDragged` 方法。\n\n![image](img/9781119404170-fg0608.png)\n\n图 6-8：\
  \ 两行代码。\n\n![image](img/9781119404170-fg0609.png)\n\n图 6-9： 更新后的 `ellipse` 调用。\n\
  \n\n\n\n正如你可能注意到的，条件语句有特定的部分，就像方法调用和方法定义一样：\n\n```\nif(CONDITION)\n{\n  CODE\n}\n\
  else\n{\n  CODE\n}\n```\n\n条件语句始终以小写的 `if` 开始，后面跟着一对圆括号。在左右括号之间是一个条件。这个条件必须是一个求值为为真（true）或假（false）的值。在上面的\
  \ `eatDinner` 示例中，条件是 `eatDinner == true`。如果变量 `eatDinner` 为真，那么整个条件实际上是 `true ==\
  \ true`，其求值为为真。如果 `eatDinner` 为假，那么整个条件实际上是 `false == true`，其求值为为假。你可以将条件看作一个有“是”或“否”答案的问题（true\
  \ = 是，false = 否）。\n\n条件语句的另一个有趣特性是，你并不总是需要 `else` 部分。这是一个有效的条件语句：\n\n```\nif(CONDITION)\n\
  {\n}\n```\n\n有时候你并没有备选方案。例如，也许你的父母说如果你不吃晚饭就什么也得不到！你的代码看起来像这样：\n\n```\nif(eatDinner\
  \ == true)\n{\n  giveIceCream();\n}\n```\n\n你可能还有不止一个选项。例如，也许你和父母有一个约定，如果你考试至少得到\
  \ 90 分，你就能得到一个巧克力冰圣奶；但如果你至少得到 70 分，你至少能得到一个冰淇淋；如果你得到不到 70 分，就会被关禁。你的代码看起来像这样：\n\n\
  ```\nif(examPoints >= 90)\n{\n  giveChocolateSundae();\n}\nelse if(examPoints >=\
  \ 70)\n{\n  giveScoop();\n}\nelse\n{\n  giveGrounding();\n}\n```\n\n注意，这些 `if` 语句的条件仍然求值为真假，但它们是将变量与数字进行比较，而不是与真假比较。\n\
  \n你认为如果你得到 91 分，你会得到一个巧克力冰圣奶和一个球冰淇淋吗？你确实得到了 `>= 90` 分，但你也得到了 `>= 70` 分。\n\n不。你只会得到巧克力冰圣奶。因为条件语句被视为代码块，一旦你找到了一个真的条件，实际上就会跳过其后的所有代码。所以，如果你考试得了\
  \ 91 分，那么第一个 `if` 语句内部的代码将执行（给你一个巧克力冰圣奶），而第二个 `if` 语句内部以及 `else` 语句内部的代码将被跳过。这也是你在书中其他地方也会看到的。\n\
  \n### 在你的代码中添加条件语句\n\n现在你已经对条件语句有了简要介绍，是时候在代码中添加一些了！你将实现：当按下鼠标时，圆的颜色为蓝色；当松开鼠标时，圆的颜色为绿色。按照以下步骤操作：\n\
  \n1. 在 `stroke` 和 `fill` 行周围添加一些空格，以便在视觉上区分你将添加条件语句的区域（参见图 6-12）。\n\n2. 在 `stroke`\
  \ 和 `fill` 方法调用周围添加一个 `if` 语句（参见图 6-13）。\n\n   确保大括号包裹了这两行代码。此 `if` 语句的条件应如下：\n\n\
  \   `mousePressed == true`\n\n   `mousePressed` 是 Processing 应用程序给你使用的变量，就像 `mouseX`\
  \ 和 `mouseY` 一样。\n\n``````\nif(mousePressed == true)\n{\n  stroke(255, 255, 255);\n\
  \  fill(0, 0, 250);\n}\n```\n\n3. 在 `if` 语句下方添加 `else` 语句以完成条件语句，并在 `if` 语句的大括号内添加两行代码，使描边变为白色，填充变为绿色（参见图\
  \ 6-14）。\n\n```\nelse\n{\n  stroke(255, 255, 255);\n  fill(0, 255, 0);\n}\n```\n\
  \n4. 点击运行（Run）按钮，确保当你按下鼠标时圆是蓝色的，当松开鼠标时它变成绿色！\n\n![image](img/9781119404170-fg0612.png)\n\
  \n图 6-12: 在此处留出空格\n\n![image](img/9781119404170-fg0613.png)\n\n图 6-13: 添加 `if` 语句\n\
  \n![image](img/9781119404170-fg0614.png)\n\n图 6-14: 添加 `else` 部分\n\n### 使用键盘移动形状\n\
  \n###本节介绍了键盘。在最后一章中，你将学习如何使用键盘移动形状。按照以下步骤操作：\n\n1. 修改 `ellipse` 方法（参见图 6-15）。\n\n\
  ```\nellipse(xCoordinate, yCoordinate, 300);\n```\n\n2. 删除你创建的 `mouseDragged` 方法（参见图\
  \ 6-16）。\n\n3. 添加一个新的 `keyPressed` 方法（参见图 6-17）。\n\n```\nvoid keyPressed()\n{\n\
  }\n```\n\n4. 在 `keyPressed` 方法中添加一个条件语句，检查按键是否为 W（参见图 6-18）。\n\n```\nif(key == 'w')\n\
  {\n}\n```\n\n5. 添加一行代码将 `yCoordinate` 变量改为原有值减 1 像素。该行代码应该位于条件语句的左右大括号之间：\n\n```\n\
  yCoordinate = yCoordinate – 1;\n```\n\n6. 点击运行按钮并按下 W 键。确保每次按下按键时圆都会向上移动像素。\n\n\
  7. 在你的条件语句中添加另外三个 `if` 语句部分，以检查按按键是否为 A、S 或 D（参见图 6-20）。\n\n确保你正确修改了 `xCoordinate`\
  \ 和 `yCoordinate` 变量！\n\n```\nvoid keyPressed()\n{\n  if(key == 'w')\n  {\n    yCoordinate\
  \ = yCoordinate – 1;\n  }\n  else if(key == 'a')\n  {\n    xCoordinate = xCoordinate\
  \ – 1;\n  }\n  else if(key == 's')\n  {\n    yCoordinate = yCoordinate + 1;\n  }\n\
  \  else if(key == 'd')\n  {\n    xCoordinate = xCoordinate + 1;\n  }\n}\n```\n\n\
  8. 点击运行按钮并尝试按下所有四个键（W、A、S 和 D）来移动画布上的圆圆。\n\n\n\n\n9. 为了确保你刚刚写的内容没有弄乱任何东西，尝试再次点击鼠标，确保它仍然会改变颜色。\n\
  \n![image](img/9781119404170-fg0615.png)\n\n图 6-15: 使用 `xCoordinate` 和 `yCoordinate`\
  \ 变量控制圆的位置。\n\n![image](img/9781119404170-fg0616.png)\n\n图 6-16: 删除 `mouseDragged`\
  \ 方法，以免被意外调用。\n\n![image](img/9781119404170-fg0617.png)\n\n图 6-17: 创建名为 `keyPressed`\
  \ 的新方法。\n\n![image](img/9781119404170-fg0618.png)\n\n图 6-18: 在 `keyPressed` 方法中添加条件语句。\n\
  \n![image](img/9781119404170-fg0619.png)\n\n图 6-19：当按下 `w` 时，更新 `yCoordinate` 变量以使圆向上移动。\n\
  \n![image](img/9781119404170-fg0620.png)\n\n图 6-20: 在条件中再添加三个 if 语句，使形状可以在四个方向上移动。\n\
  \n![image](img/9781119404170-fg0621.png)\n\n图 6-21: 让圆从画布中心开始。\n\n你也可以创建一个名为 `speed`\
  \ 的变量，如果你将变量设置为更大的数字，形状就会移动得更快（参见图 6-22）。\n\n```\nint speed = 5;\n```\n\n![image](img/9781119404170-fg0622.png)\n\
  \n图 6-22: 添加一个设置为 5 的新变量 `speed`。\n\n然后在 `keyPressed` 方法中，用变量 `speed` 代替 1 来更改 `xCoordinate`\
  \ 和 `yCoordinate` 变量（参见图 6-23）。\n\n```java\nvoid keyPressed()\n{\n  if(key == 'w')\n\
  \  {\n    yCoordinate = yCoordinate – speed;\n  }\n  else if(key == 'a')\n  {\n\
  \    xCoordinate = xCoordinate – speed;\n  }\n  else if(key == 's')\n  {\n    yCoordinate\
  \ = yCoordinate + speed;\n  }\n  else if(key == 'd')\n  {\n    xCoordinate = xCoordinate\
  \ + speed;\n  }\n}\n```\n\n![image](img/9781119404170-fg0623.png)\n\n图 6-23: 使用\
  \ `speed` 代替 1 更改 `xCoordinate` 和 `yCoordinate` 变量。\n\n恭喜！你已经让一个形状通过键盘移动并通过鼠标改变颜色了！这真的令人兴奋，因为在下一章中，你将利用所学的所有知识来创建你的第一个电子游戏！\n\
  \n![image](img/c7.png)\n\n创建你的第一个电子游戏的时间到了！本章将引导你完成制作简单电子游戏所需的所有步骤。在这个游戏中，你有一个真正的角色（而不仅仅是一个形状），当玩家使用键盘时，它会在屏幕上移动并收集积分！\n\
  \n你在本章制作并在下一章完成的游戏类似于马里奥（Mario）。你拥有一个可以执行以下操作的角色：\n\n*   使用 A 和 D 键左右移动\n*   使用空格键跳跃\n\
  *   撞击黄色圆（硬币！）以收集它们\n*   获得积分\n\n## 创建场景\n\n首先，你需要一个你的角色可以探索的场景。你可能想先在纸上画出它。你需要：\n\
  \n*   某种地面\n*   彩色的天空\n*   一些可以跳过去或跳在上面的上面的东西\n\n现在你已经对想在场景中创建的内容有了想法（无论是通过列表还是通过你的画作），是时候开始你的游戏了！按照以下步骤操作：\n\
  \n1. 打开 Processing 并创建一个新的 Sketch 文件。\n2. 创建 `setup` 方法（参见图 7-1）。\n```java\nvoid\
  \ setup()\n{\n}\n```\n3. 创建一个 1000 x 500 像素且背景为浅蓝色的画布（参见图 7-2）。\n```java\nvoid setup()\n\
  {\n  size(1000, 500);\n  background(173, 216, 230);\n}\n```\n4. 在第 3 步添加的代码上方添加注释，以便人类阅读（参见图\
  \ 7-3）。*注：此处原文图号似乎有误，根据上下文推断*。\n```java\nvoid setup()\n{\n  // Canvas and sky\n\
  \  size(1000, 500);\n  background(173, 216, 230);\n}\n```\n5. 添加注释和三行代码创建草地（参见图\
  \ 7-4）。\n```java\nvoid setup()\n{\n  // Canvas and sky\n  size(1000, 500);\n  background(173,\
  \ 216, 230);\n  // Grass\n  stroke(0, 255, 0);\n  fill(0, 255, 0);\n  rect(0, 400,\
  \ 1000);\n}\n```\n草地基本上是屏幕底部的绿色矩形。\n6. 添加注释和三行代码创建一个山（参见图 7-5）。\n```java\nvoid setup()\n\
  {\n  // Canvas and sky\n  size(1000, 500);\n  background(173, 216, 230);\n  // Grass\n\
  \  stroke(0, 255, 0);\n  fill(0, 255, 0);\n  rect(0, 400, 1000);\n  // Hill\n  stroke(165,\
  \ 42, 42);\n  fill(165, 42, 42);\n  arc(300, 400, 100, PI, TWO_PI);\n}\n```\n山基本上是草地上的棕色弧。\n\
  7. 添加三行代码创建第二个山（参见图 7-6）。\n```java\nvoid setup()\n{\n  // Canvas and sky\n  size(1000,\
  \ 500);\n  background(173, 216, 230);\n  // Grass\n  stroke(0, 255, 0);\n  fill(0,\
  \ 255, 0);\n  rect(0, 400, 1000);\n  // Hills\n  stroke(165, 42, 42);\n  fill(165,\
  \ 42, 42);\n  arc(300, 400, 100, PI, TWO_PI);\n  arc(600, 400, 100, PI, TWO_PI);\n\
  }\n```\n确保你将注释改为“Hills”而不是“Hill”，因为注释下面的代码创建创建两个山。\n\n![image](img/9781119404170-fg0701.png)\n\
