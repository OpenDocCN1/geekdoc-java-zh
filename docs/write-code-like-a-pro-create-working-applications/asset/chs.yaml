  \n## 让敌人移动\n\n下一步是让敌人通过代码移动，而不是通过用户输入（如键盘或鼠标）。开始，敌人将在两个岩浆坑之间移动，为玩家增加额外的难度。为了做到，你将使用一个新变量来跟踪敌人应该向左（–1）还是向右（+1）。\n\
  \n1. **创建一个名为 `enemyMovement` 的新变量并初始化为 1（参见图 8-7）。**\n\n   在你的 `setup` 方法上方添加此行代码：\n\
  ```javascript\nint enemyMovement = 1;\n```\n\n2. **添加条件语句，根据敌人到达哪个岩浆来更新 `enemyMovement`\
  \ 变量（参见图 8-8）。**\n\n   如果敌人到达左岩浆（`enemyX = 350`），它应该向右移动（+1）。如果敌人到达右岩浆（`enemyX =\
  \ 450`），它应该向左移动（–1）。\n\n   此代码应添加到你的 `draw` 方法底部：\n```javascript\n//Move enemy\n\
  if(enemyX == 350)\n{\n    enemyMovement = 1;\n}\nelse if(enemyX == 450)\n{\n   \
  \ enemyMovement = -1;\n}\n```\n\n3. **根据第 2 步将敌人的 `enemyX` 更新为 1 或 –1（参见图 8-9）。**\n\
  \n   此代码应添加到你的 `draw` 方法底部：\n```javascript\nenemyX = enemyX + enemyMovement;\n```\n\
  \n4. **通过点击运行按钮测试代码，确保敌人在两个岩浆之间来回移动（参见图 8-10）。**\n\n![image](img/9781119404170-fg0807.png)\n\
  \nFIGURE 8-7: 设置敌人方向的 `enemyMovement` 变量。\n\n![image](img/9781119404170-fg0808.png)\n\
  \nFIGURE 8-8: 切换敌人方向的条件语句。\n\n![image](img/9781119404170-fg0809.png)\n\nFIGURE 8-9:\
  \ 根据第 4 步的条件语句让敌人左右移动的代码。\n\n\n\n\n你的第一个个人人工智能（AI）已经写好了！这其实就是 AI 的本质：让虚拟角色自己移动的代码！\n\
  \n# 创建你自己的 Java 类\n\n在继续下去之前，你将学习如何创建一个 Java 类。`class`（类）是定义虚拟对象的一种方式。该对象可能具有属性（如位置和颜色），并可能拥有方法（如移动）。通过将敌人和角色代码移动到类中，你可以轻松地创建更多运行良好的敌人和类！\n\
  \n## 创建敌人类\n\n你创建的第一个类是敌人类。这样，如果你需要，就可以添加更多敌人，并且可以轻松地更新它们。\n\n1. 在你的 Sketch 文件底部，创建一个名为\
  \ `Enemy` 的新类（参见图 8-11）。\n\n   ```java\n   class Enemy\n   {\n   }\n   ```\n\n2.\
  \ 将 Sketch 文件顶部所有的 `enemy` 变量移动到你的 `Enemy` 类中（参见图 8-12）。\n\n   ```java\n   class\
  \ Enemy\n   {\n   PImage enemy;\n   int enemyX = 350;\n   int enemyY = 325;\n  \
  \ int enemyMovement = 1;\n   }\n   ```\n\n3. 创建一个构造函数，并将创建敌人的代码从 `setup` 方法移动到构造函数中（参见图\
  \ 8-13）。\n\n   构造函数用于创建对象。将此代码放在 `Enemy` 类的底部。\n\n   ```java\n   Enemy()\n   {\n\
  \   enemy = loadImage(\"crab.png\");\n   image(enemy, enemyX, enemyY);\n   }\n \
  \  ```\n\n4. 在 Sketch 文件顶部创建一个类型为 `Enemy` 且名为 `enemy1` 的新变量。在 `setup` 方法中使用你在第 3\
  \ 步中创建的构造函数来初始化 `enemy1` 变量（参见图 8-14）。\n\n   在 `setup` 方法上方输入此代码，即你之前从第 2 步移动代码的位置：\n\
  \n   ```java\n   Enemy enemy1;\n   ```\n\n   然后在 `setup` 方法底部输入此代码，即你之前第 3 步代码的位置：\n\
  \n   ```java\n   //Create the enemy\n   enemy1 = new Enemy();\n   ```\n\n5. 创建名为\
  \ `move` 的新方法，该方法不返回内容并接收两个名为 `leftX` 和 `rightX` 的整数参数。将 `draw` 方法中移动敌人的代码移动到这个新方法中（参见图\
  \ 8-15）。\n\n   此方法应该位于 `Enemy` 类内部，紧接在你第 3 步中编写的构造函数之后：\n\n   ```java\n   void move(int\
  \ leftX, int rightX)\n   {\n   //Redraw the enemy\n   image(enemy, enemyX, enemyY);\n\
  \   //Move enemy\n   if(enemyX == 350)\n   {\n   enemyMovement = 1;\n   }\n   else\
  \ if(enemyX == 450)\n   {\n   enemyMovement = -1;\n   }\n   enemyX = enemyX + enemyMovement;\n\
  \   }\n   ```\n\n6. 更新条件语句以使用参数而不是硬编码的值（参见图 8-16）。\n\n   ```java\n   void move(int\
  \ leftX, int rightX)\n   {\n   //Redraw the enemy\n   image(enemy, enemyX, enemyY);\n\
  \   //Move enemy\n   if(enemyX == leftX)\n   {\n   enemyMovement = 1;\n   }\n  \
  \ else if(enemyX == rightX)\n   {\n   enemyMovement = -1;\n   }\n   enemyX = enemyX\
  \ + enemyMovement;\n   }\n   ```\n\n7. 在原始的 `draw` 方法中调用新创建的 `move` 方法（参见图 8-17）。确保传递你在第\
  \ 6 步中替换的原始值。\n\n   ```java\n   //Redraw the enemy\n   enemy1.move(350, 450);\n\
  \   ```\n\n8. 测试你的敌人是否仍在反复移动。\n\n9. 修改你的 `Enemy` 构造函数，使其两个参数作为敌人的起始位置（参见图 8-18）。\n\
  \n   ```java\n   Enemy(int x, int y)\n   {\n   enemyX = x;\n   enemyY = y;\n   enemy\
  \ = loadImage(\"crab.png\");\n   image(enemy, enemyX, enemyY);\n   }\n   ```\n\n\
  10. 修改对 `Enemy` 构造函数的调用，让敌人从相同的位置开始（参见图 8-19）。此代码代码位于 sketch 主部分的 `setup` 方法中：\n\
  \n    ```java\n    //Create the enemy\n    enemy1 = new Enemy(350, 325);\n    ```\n\
