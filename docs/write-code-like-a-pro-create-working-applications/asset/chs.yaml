  \ Sketch 文件。\n\n在本章中，你将学习 Java 编程中非常重要的概念：方法（methods）和变量（variables）。在学习这些内容时，你将创建自己的画布并添加颜色！\n\
  \n## 了解画布\n\n正如你在第 1 章中注意到的，运行 Processing 程序时会弹出一个画布。`canvas` 是显示程序视觉部分的窗口，就像你测试的旋转星星那样。\n\
  \n### 创建画布\n\n在本节中，你将学习关于画布的知识，这对于理解如何与其交互非常重要。按照以下步骤操作：\n\n1. **打开 Processing 应用程序并创建一个新程序（参见**\
  \ 图 2-1**）。****\n\n2. **输入一行代码创建一个宽 500 像素、高 500 像素的画布（参见** 图 2-2**）。****\n\n```\n\
  size(500, 500);\n```\n\n3. **点击 Processing 窗口左上角的运行按钮，你可以在图 2-2 中看到。****\n\n   画布应该出现在你的屏幕上（参见\
  \ 图 2-3）。\n\n4. **点击屏幕左上角的红色 X 关闭画布。**\n\n5. **将代码更改为 500 比 250 像素，如图 2-4 所示。****\n\
  \n```\nsize(500, 250);\n```\n\n6. **在点击运行按钮之前，预测画布将是横矩形还是竖矩形。**\n\n7. **点击运行按钮，查看你的预测是否正确！**\n\
  \n![image](img/9781119404170-fg0201.png)\n图 2-1: 一个空白的 Sketch 文件。\n\n![image](img/9781119404170-fg0202.png)\n\
  图 2-2: 创建 500x500 像素画布所需的代码。\n\n![image](img/9781119404170-fg0203.png)\n图 2-3: 空闲的\
  \ 500x500 像素画布。\n\n![image](img/9781119404170-fg0204.png)\n图 2-4: 创建 500x250 像素画布所需的代码。\n\
  \n### 理解画布中的像素\n\n\n\n\n你创建的每个画布（canvas）都是由许多像素组成的。例如，通过你在上一节中编写第一段代码，你就创建了一个包含\
  \ 250,000 个像素的画布！它有 500 行像素，每行有 500 个像素。\n\n画布上的每个像素都有一个位置和一个颜色。像素的位置由像素的 `x` 和\
  \ `y` 位置指定。你可以使用 `set` 方法更改单个像素的颜色。请按照以下步骤操作：\n\n1. 确保你的代码正在创建一个 500x 500 像素的画布，如图\
  \ 2-5 所示：\n   ```\n   size(500, 500);\n   ```\n\n2. 添加第二行代码，创建一个新的颜色变量（参见图 2-6）：\n\
  \   ```\n   color black = color(0);\n   ```\n\n3. 添加第三行代码，将正中心像素的颜色改为你在第 2 步中创建的颜色（参见图\
  \ 2-7）：\n   ```\n   set(250, 250, black);\n   ```\n\n4. 点击**Run**（运行）按钮。\n   注意中心像素现在是黑色的（参见图\
  \ 2-8）。\n\n5. 尝试将第 2 步中的数字改为 0 到 255 之间的任意数字，并再次点击 Run 按钮，观察中心按钮变为不同的颜色。\n   你也可以像第\
  \ 3 步中那样添加更多行，将画布上的其他像素更改为其他颜色。例如，这里制作一条每隔一个像素为黑色或白色的线条的方法（参见图 2-9）：\n   ```\n \
  \  size(500, 500);\n   color black = color(0);\n   color white = color(255);\n \
  \  set(240, 250, black);\n   set(241, 250, white);\n   set(242, 250, black);\n \
  \  set(243, 250, white);\n   set(244, 250, black);\n   set(245, 250, white);\n \
  \  set(246, 250, black);\n   set(247, 250, white);\n   set(248, 250, black);\n \
  \  set(249, 250, white);\n   set(250, 250, black);\n   set(251, 250, white);\n \
  \  set(252, 250, black);\n   set(253, 250, white);\n   set(254, 250, black);\n \
  \  set(255, 250, white);\n   set(256, 250, black);\n   set(257, 250, white);\n \
  \  set(258, 250, black);\n   set(259, 250, white);\n   ```\n\n   这里是制作一条包含 10 个黑色像素后接\
  \ 10 个白色像素的线条的方法（参见图 2-10）：\n   ```\n   size(500, 500);\n   color black = color(0);\n\
  \   color white = color(255);\n   set(240, 250, black);\n   set(241, 250, black);\n\
  \   set(242, 250, black);\n   set(243, 250, black);\n   set(244, 250, black);\n\
  \   set(245, 250, black);\n   set(246, 250, black);\n   set(247, 250, black);\n\
  \   set(248, 250, black);\n   set(249, 250, black);\n   set(250, 250, white);\n\
  \   set(251, 250, white);\n   set(252, 250, white);\n   set(253, 250, white);\n\
  \   set(254, 250, white);\n   set(255, 250, white);\n   set(256, 250, white);\n\
  \   set(257, 250, white);\n   set(258, 250, white);\n   set(259, 250, white);\n\
  \   ```\n\n   ![image](img/9781119404170-fg0205.png)\n图 2-5 创建 500x500 像素画布的代码。\n\
