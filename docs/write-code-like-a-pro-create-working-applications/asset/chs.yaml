  \n图 12-4： 两组管道在测试代码时应具有随机的 `y` 坐标。\n\n## 检测碰撞\n\n进入你的 NinjaBird 主类，并找到你在第 10 章](#13_9781119404170-ch10.xhtml)中概述的\
  \ `checkCollision` 方法。注意，你需要访问鸟类和管道的位置、宽度和高度。与其为这些创建新变量，你可以直接使用你在这本书早些规划的辅助方法。但首先，你需要在这些辅助方法中实际返回正确的值：\n\
  \n\n\n\n\n1. 从你的 `Bird` 类中的四个方法中返回正确的变量（参见图 12-5）：\n\n```java\n//Method to return\
  \ the x-coordinate of the bird\nint getX()\n{\n  return xCoordinate;\n}\n//Method\
  \ to return the y-coordinate of the bird\nint getY()\n{\n  return yCoordinate;\n\
  }\n//Method to return the width of the bird\nint getWidth()\n{\n  return width;\n\
  }\n//Method to return the height of the bird\nint getHeight()\n{\n  return height;\n\
  }\n```\n\n2. 从 `Pipes` 类中的八个辅助方法中返回正确的变量：\n\n```java\n//Method to return the x-coordinate\
  \ of the top pipe\nint getXTop()\n{\n  return xCoordinateTop;\n}\n//Method to return\
  \ the y-coordinate of the top pipe\nint getYTop()\n{\n  return yCoordinateTop;\n\
  }\n//Method to return the width of the top pipe\nint getWidthTop()\n{\n  return\
  \ widthTop;\n}\n//Method to return the height of the top pipe\nint getHeightTop()\n\
  {\n  return heightTop;\n}\n//Method to return the x-coordinate of the bottom\n//pipe\n\
  int getXBottom()\n{\n  return xCoordinateBottom;\n}\n//Method to return the y-coordinate\
  \ of the bottom\n//pipe\nint getYBottom()\n{\n  return yCoordinateBottom;\n}\n//Method\
  \ to return the width of the bottom pipe\nint getWidthBottom()\n{\n  return widthBottom;\n\
  }\n//Method to return the height of the bottom pipe\nint getHeightBottom()\n{\n\
  \  return heightBottom;\n}\n```\n\n图 12-6 显示了这八个辅助方法在你 `Pipes` 类文件中的位置。\n\n3. 删除\
  \ `NinjaBird` 主类中 `checkCollision` 方法中的两个注释（参见图 12-7）。\n\n既然你已经有了这些辅助方法可以使用，就不再需要注释来提醒你访问这些方法了。\n\
  \n4. 因为你有两组管道，所以在 `Pipes` 类内部检查鸟是否撞到了管道会更合理；这样一来，你就不需要为每组管道编写碰撞检测代码了。在 `Pipes` 类中，创建一个名为\
  \ `checkIfHit` 的新方法，它返回一个 Boolean 值并接受三个整数参数（参见图 12-8）：\n\n```java\nboolean checkIfHit(int\
  \ x, int topY, int bottomY)\n{\n  return false;\n}\n```\n\n5. 在你的 `NinjaBird` 主类中，为鸟的\
  \ `rightX`、`topY` 和 `bottomY` 创建三个变量，然后将它们传递给 `pipes` 和 `pipes2` 组管道的 `checkIfHit`\
  \ 方法。如果其中一个返回 true，则说明鸟已经撞到了某组管道，你的 `checkCollision` 方法应该返回 true。否则，你的 `checkCollision`\
  \ 方法应该返回 false。新的 `checkCollision` 方法如图 12-9 所示。\n\n```java\n//Method to check to\
  \ see if the bird has hit any of\n//the pipes\nboolean checkCollision()\n{\n  int\
  \ birdRightX = bird.getX() + bird.getWidth()/2;\n  int birdTopY = bird.getY() -\
  \ bird.getHeight()/2;\n  int birdBottomY = bird.getY() + bird.getHeight()/2;\n \
  \ if(pipes.checkIfHit(birdRightX,\nbirdTopY, birdBottomY) || pipes2.checkIfHit(birdRightX,\n\
  birdTopY, birdBottomY))\n  {\n    return true;\n  }\n  return false;\n}\n```\n\n\
  6. 回到 `Pipes` 类，创建三个变量来确定鸟在水平方向上是否位于管道范围内（参见图 12-10）：\n\n```java\n//Determine if\
  \ the bird is within the pipes\n//horizontally\nboolean birdPastPipesBeg = x >=\
  \ xCoordinateTop;\nboolean birdBeforePipesEnd = x <= (xCoordinateTop + widthTop);\n\
  boolean birdWithinPipes = birdPastPipesBeg && birdBeforePipesEnd;\n```\n\n再添加三个变量来确定鸟在垂直方向上是否位于管道的间隙内：\n\
  \n```java\n//Determine if the bird is within the gap of the\n//pipes vertically\n\
  boolean birdBelowTopPipes = topY > (yCoordinateTop + heightTop);\nboolean birdAboveBottomPipes\
  \ = bottomY < yCoordinateBottom;\nboolean withinGap = birdBelowTopPipes && birdAboveBottomPipes;\n\
  ```\n\n最后，添加一个条件语句，如果鸟在水平范围内且不在间隙内，则返回 true（这意味着它碰到了管道）：\n\n```java\n//Conditional\
  \ statement to check if the bird is in\n//the same location as the pipes\nif(birdWithinPipes\
  \ && !withinGap)\n  {\n    return true;\n  }\n```\n\n7. 在 `NinjaBird` 主类的 `draw`\
