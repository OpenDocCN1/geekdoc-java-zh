  trans: "\n\n1. 在你的 `Enemy` 类中创建一个名为 `collidedWith` 的新方法，它返回一个 `Boolean`（true 或 false），并带有四个整数参数（`x`、`y`、`x2`\
    \ 和 `y2`），如图 8-36 所示。\n\n这四个参数最终将拥有角色的位置值。\n\n你可以将此代码添加到 `Enemy` 构造函数的下方：\n\n\
    ```java\nboolean collidedWith(int x, int y, int x2, int y2)\n{\n    return false;\n\
    }\n```\n\n2. 添加一个条件语句，检查敌人的位置是否在角色的矩形范围内（参见图 8-37）。\n\n```java\nboolean collidedWith(int\
    \ x, int y, int x2, int y2)\n{\n    if(enemyX >= x && enemyX <= x2 && enemyY >=\
    \ y && enemyY <= y2)\n    {\n        return true;\n    }\n    return false;\n\
    }\n```\n\n3. 为你的 `Character` 类添加四个方法，以返回角色起始点的 `x` 和 `y` 坐标以及角色结束点的 `x` 和 `y`\
    \ 坐标（参见图 8-38）。\n\n将这些方法添加到 `Character` 构造函数的下方：\n\n```java\nint getX()\n{\n \
    \   return characterX - (character.width/2);\n}\n\nint getY()\n{\n    return characterY;\n\
    }\n\nint getX2()\n{\n    return characterX + (character.width/2);\n}\n\nint getY2()\n\
    {\n    return characterY + character.height;\n}\n```\n\n4. 在 `draw` 方法中添加一个条件，检查是否任一个敌人与角色发生了碰撞；如果是，则调用\
    \ `updateHealth` 方法（参见图 8-39）。\n\n将此条件添加到 `draw` 方法的底部：\n\n```java\nif(enemy1.collidedWith(character.getX(),\
    \ character.getY(), character.getX2(), character.getY2()))\n{\n    character.updateHealth();\n\
    }\nelse if(enemy2.collidedWith(character.getX(), character.getY(), character.getX2(),\
    \ character.getY2()))\n{\n    character.updateHealth();\n}\n```\n\n5. 测试你的代码以确保它正常工作。当你的角色碰到岩岩或敌人时，它应该开始失去生命值（参见图\
    \ 8-40）。\n\n![image](img/9781119404170-fg0836.png)\n\nFIGURE 8-36: 新的 `collidedWith`\
    \ 方法。\n\n![image](img/9781119404170-fg0837.png)\n\nFIGURE 8-37: 用于检查敌人是否在角色边界内的条件语句。\n\
    \n![image](img/9781119404170-fg0838.png)\n\nFIGURE 8-38: 用于确定角色边界的四个方法。\n\n![image](img/9781119404170-fg0839.png)\n\
    \nFIGURE 8-39: 当角色与任一敌人碰撞时将更新生命值的条件语句。\n\n![image](img/9781119404170-fg0840.png)\n\
    \nFIGURE 8-40: 运行中的最终游戏。你刚刚制作了一个游戏！游戏的目标是在失去所有生命值之前尝试让角色到达边缘！在下一章中，你将构建一个与其非常相似的游戏。不要忘记：如果你遇到困难，可以随时参考之前的章节来获取帮助。\n\
    \n![image](img/c9.png)\n\n在开始之前，你将在线玩 Flappy Bird，以了解在重新创建你自己的版本的游戏（称为 Ninja）时需要做什么。\n\
    \n1. 打开网络浏览器并访问 `http://flappybird.io`。\n当页面加载时，你可能会看到一个广告（参见图 9-1）。等到你可以点击 Skip\
    \ 按钮并点击。\n\n2. 你应该会在浏览器中看到 Flappy Bird 游戏（参见图 9-2）。\n\n3. 点击 Flappy Bird 开始游戏。\n\
    过程中，你需要不断点击鼠标让小鸟保持在空中。当你碰到管子时，会弹出一个菜单（参见图 9-3）。\n\n4. 玩几次游戏感受一下。\n要继续玩，可以点击 Restart\
    \ 按钮。\n\n5. 注意当你玩时，游戏会记录你的当前分数和最高分（参见图 9-4）。\n\n![image](img/9781119404170-fg0901.png)\n\
    \nFIGURE 9-1: 玩 Flappy Bird 之前看到的广告示例。\n\n![image](img/9781119404170-fg0902.png)\n\
    \nFIGURE 9-2: 浏览器中的 Flappy Bird 游戏。\n\n![image](img/9781119404170-fg0903.png)\n\
    \nFIGURE 9-3: 第一次失败时出现的菜单。\n\n![image](img/9781119404170-fg0904.png)\n\nFIGURE\
    \ 9-4: 该游戏记录你的最高分和最近的分。\n\n## 理解 FLAPPY BIRD 代码\n\n当你编写了长时间代码后，你将能够开始使用新技术并猜测编写什么样的代码来使该软件运行。尽管你刚刚开始，但你现在将在书中练习这些。\n\
    \n### 开始界面\n\n你所玩的 Flappy Bird 游戏首先要注意到的是开始界面（参见图 9-5）。它有三个部分：\n\n- **背景**：背景有蓝色背景、云朵、建筑和树的图像；棕色的地面以及似乎在移动的绿草。\n\
    - **小鸟**：下一部分是小鸟本身。小鸟是一个简单的图像，但它有一个动画让它看起来像在扇动翅膀。小鸟还会上下跳动。\n- **分数**：最后部分是一个带轮边的大白数字，代表分数。\n\
    \n![image](img/9781119404170-fg0905.png)\n\nFIGURE 9-5: Flappy Bird 的开始界面。\n\n\
    根据你到目前在书中所做，创建所有这些应该相当简单。复杂的是让草看起来像在移动以及让小鸟的翅膀扇动。这些是你需要研究如何实现的代码片段。在你游戏的第一版本中，它们不会移动。\n\
    \n### 游戏界面\n\n当你开始玩游戏时，界面发生了微变化，有四个部分需要注意（参见图 9-6）：\n\n- **背景**：背景与开始界面相同。\n-\
    \ **小鸟**：小鸟看起来一样，但现在除非玩家点击它，否则它会掉落。当玩家点击小鸟时，它向上移动。如果小鸟撞到管子，它会自动脸朝地掉到地上。\n- **分数**：分数的样式与开始界面相同，但每当小鸟成功通过一组管子时，分数加\
    \ 1。\n- **管子**：屏幕上最多有四根管子。其中两根从屏幕底部向上移动，另外两根直接在底部管子的上方，从屏幕顶部向下移动。每当一组新的管子出现在屏幕右侧时，它们之间的开口在垂直轴上的位置不同。管子之间的开口似乎始终是相同的像素数。\n\
    \n![image](img/9781119404170-fg0906.png)\n\nFIGURE 9-6: 游戏期间的 Flappy Bird。\n\n"
- fmt: "\nYou’ve already done a lot of the coding in this book to make all of this\
    \ happen. The one part that might be difficult is making the opening between the\
    \ pipes be in a random spot each time a new set of pipes is shown coming from\
    \ the right side of the screen.\n\n# THE END SCREEN\n\nWhen you lose the game,\
    \ the interface changes one last time. In this case, there are three parts to\
    \ pay attention to (see [Figure 9-7](#12_9781119404170-ch09.xhtml_c09-fig-0007)):\n\
    \n*   **The background:** The background is exactly the same as the gameplay screen.\
    \ The only difference is that now the grass is not moving.\n*   **The bird and\
    \ pipes:** The bird and pipes are left in the exact same location as they were\
    \ in when the gameplay screen finished. They aren’t moving.\n*   **The score:**\
    \ The score now has a square around it with the score of the game that was just\
    \ played and the best score over all of the games that have been played.\n*  \
    \ **The buttons:** In this version, there are three buttons: Restart, Share, and\
    \ Add to Leaderboard.\n\n![image](images/9781119404170-fg0907.png)\n\n[FIGURE\
    \ 9-7:](#12_9781119404170-ch09.xhtml_rc09-fig-0007) The end screen, shown when\
    \ you lose a game.\n\nBecause your game is not on the Internet, but instead just\
    \ on your computer, you can ignore the Share and Add to Leaderboard buttons. The\
    \ button you’ll need to figure out is the Restart button. When pressed, this button\
    \ moves the pipes back to the start, puts the bird back into the sky, makes the\
    \ buttons disappear, makes the grass start moving again, and resets the Score\
    \ display.\n\n# OUTLINING YOUR NINJA BIRD\n\nNow that you have had a chance to\
    \ play a version of Flappy Bird and try to decipher what is happening in the code,\
    \ it’s time to plan out how you want your Ninja Bird to work.\n\n*   **The background:**\
    \ This part should be straightforward, because you’ve created shapes and images\
    \ on your canvas earlier in this book. The tricky part here will be making the\
    \ grass move, but this is optional.\n*   **The bird:** Your bird needs to always\
    \ be falling, unless the user does something, like click the mouse or a certain\
    \ key on the keyboard. The bird needs to have an image (probably of a bird) so\
    \ that it isn’t just a dot. Optionally, the wing on the bird should be moving.\n\
    *   **The pipes:** This is an interesting one. Even though when you play it looks\
    \ like the bird is flying through an infinite number of pipes, if you play long\
    \ enough, you’ll notice that there are only ever two sets of pipes on the screen\
    \ at once. What is actually happening is the two sets of pipes are moving from\
    \ the right side of the screen to the left side of the screen. When they get to\
    \ the left side, they turn invisible, move back to the right, and turn visible\
    \ again! It’s a clever way to make a game look like there are infinite items when\
    \ there are really only a couple! The trick here is that you’ll have to figure\
    \ out how to make sure the gap between the pipes is in a random place each time\
    \ it comes back to the right.\n*   **The score:** Just like in the Flappy Bird\
    \ game you played earlier, you should have a score variable that keeps track of\
    \ how many pipes the bird has successfully flown through. You should have a second\
    \ variable that keeps track of the highest number of pipes that the bird has successfully\
    \ flown through as well. The current score should be displayed when playing, and\
    \ both scores should be displayed once the player loses.\n*   **The buttons:**\
    \ For your Ninja Bird game, you should have one button that restarts the game.\
    \ When the game is restarted, you will have to change the bird (location), the\
    \ pipes (location), and the two score variables (reset the current score to 0\
    \ and the highest score should be updated if the current score is higher than\
    \ the highest score).\n\n# DESIGNING YOUR JAVA CLASSES\n\nNow that you have an\
    \ idea of how your game will play out, it’s time to plan out your Java classes\
