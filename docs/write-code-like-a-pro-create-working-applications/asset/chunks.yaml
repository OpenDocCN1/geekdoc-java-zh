  trans: "\n你创建的每个画布（canvas）都是由许多像素组成的。例如，通过你在上一节中编写第一段代码，你就创建了一个包含 250,000 个像素的画布！它有\
    \ 500 行像素，每行有 500 个像素。\n\n画布上的每个像素都有一个位置和一个颜色。像素的位置由像素的 `x` 和 `y` 位置指定。你可以使用 `set`\
    \ 方法更改单个像素的颜色。请按照以下步骤操作：\n\n1. 确保你的代码正在创建一个 500x 500 像素的画布，如图 2-5 所示：\n   ```\n\
    \   size(500, 500);\n   ```\n\n2. 添加第二行代码，创建一个新的颜色变量（参见图 2-6）：\n   ```\n   color\
    \ black = color(0);\n   ```\n\n3. 添加第三行代码，将正中心像素的颜色改为你在第 2 步中创建的颜色（参见图 2-7）：\n\
    \   ```\n   set(250, 250, black);\n   ```\n\n4. 点击**Run**（运行）按钮。\n   注意中心像素现在是黑色的（参见图\
    \ 2-8）。\n\n5. 尝试将第 2 步中的数字改为 0 到 255 之间的任意数字，并再次点击 Run 按钮，观察中心按钮变为不同的颜色。\n   你也可以像第\
    \ 3 步中那样添加更多行，将画布上的其他像素更改为其他颜色。例如，这里制作一条每隔一个像素为黑色或白色的线条的方法（参见图 2-9）：\n   ```\n\
    \   size(500, 500);\n   color black = color(0);\n   color white = color(255);\n\
    \   set(240, 250, black);\n   set(241, 250, white);\n   set(242, 250, black);\n\
    \   set(243, 250, white);\n   set(244, 250, black);\n   set(245, 250, white);\n\
    \   set(246, 250, black);\n   set(247, 250, white);\n   set(248, 250, black);\n\
    \   set(249, 250, white);\n   set(250, 250, black);\n   set(251, 250, white);\n\
    \   set(252, 250, black);\n   set(253, 250, white);\n   set(254, 250, black);\n\
    \   set(255, 250, white);\n   set(256, 250, black);\n   set(257, 250, white);\n\
    \   set(258, 250, black);\n   set(259, 250, white);\n   ```\n\n   这里是制作一条包含 10\
    \ 个黑色像素后接 10 个白色像素的线条的方法（参见图 2-10）：\n   ```\n   size(500, 500);\n   color black\
    \ = color(0);\n   color white = color(255);\n   set(240, 250, black);\n   set(241,\
    \ 250, black);\n   set(242, 250, black);\n   set(243, 250, black);\n   set(244,\
    \ 250, black);\n   set(245, 250, black);\n   set(246, 250, black);\n   set(247,\
    \ 250, black);\n   set(248, 250, black);\n   set(249, 250, black);\n   set(250,\
    \ 250, white);\n   set(251, 250, white);\n   set(252, 250, white);\n   set(253,\
    \ 250, white);\n   set(254, 250, white);\n   set(255, 250, white);\n   set(256,\
    \ 250, white);\n   set(257, 250, white);\n   set(258, 250, white);\n   set(259,\
    \ 250, white);\n   ```\n\n   ![image](img/9781119404170-fg0205.png)\n图 2-5 创建\
    \ 500x500 像素画布的代码。\n\n![image](img/9781119404170-fg0206.png)\n图 2-6 创建黑色的代码。\n\
    \n![image](img/9781119404170-fg0207.png)\n图 2-7 更改特定像素的代码。\n\n![image](img/9781119404170-fg0208.png)\n\
    图 2-8 中心有一个黑色像素的 500x500 像素画布。\n\n![image](img/9781119404170-fg0209.png)\n图 2-9\
    \ 制作黑白线条的代码和输出。\n\n![image](img/9781119404170-fg0210.png)\n图 2-10 制作另一条黑白线条的代码和输出。\n\
    \n在第 4 章中，你将学习更多关于颜色的知识，但这里是对像素属性（位置和颜色）的基础介绍。\n\n![image](img/9781119404170-fg0211.png)\n\
    图 2-11 位置指南。\n\n恭喜！你现在已经学习了关于像素、位置、颜色以及如何在 Java 中调用方法的知识！在下一节中，你将概述目前使用的的方法并了解调用方法的原理。\n\
    \n![image](img/9781119404170-fg0212.png)\n图 2-12 保存前务必命名文件。\n\n## 在 Java 中调用方法\n\
    \n你已经在为本章编写的代码中调用了好几个方法，但在编写代码时，理解你正在写什么很重要。在你目前调用的方法中包含两个部分：方法名和参数：\n\n`methodName(Parameters)`\n\
    \n方法名后面总是有左括号和右括号。在你目前使用的所有示例中，中间都有参数，但有时也没有。例如，有一个你尚未使用过的不带任何参数的方法：\n\n`exit()`\n\
    \n你可以尝试将这行代码添加到程序的最后一行。当你点击 Run 时，你应该看到画布出现然后立即关闭。这是因为 `exit` 方法会关闭画布。\n\n如果方法确实有参数，那么参数的顺序必须正确且类型正确。例如，`size`\
    \ 方法需要两个参数（或数字）；第一个数字必须是画布的宽度，第二个数字是画布的高度：\n\n`size(width, height)`\n\n你可以尝试放置较少或更多的参数并更改类型，你会发现会得到错误。例如，假设你第一个写的是：\n\
    \n`size(\"abc\")`\n\n你将收到一个错误消息，说明 `size` 方法需要两个整数参数（参见图 2-13）。\n\n![image](img/9781119404170-fg0213.png)\n\
    图 2-13 在 Processing 中可能获得的错误消息示例。\n\n在每个参数之间必须有一个逗号。\n\n最后，每个方法调用都以分号结尾。这告诉 Processing\
    \ 该行代码已结束。\n\n在第 2 章中，你已经调用了四个不同的方法：\n\n`size(width, height)`\n`color(colorCode)`\n\
    `set(x, y, color)`\n`exit()`\n\n## 创建变量\n\n变量基本上是你为你想要重复使用的值命的名字。在本章中，你创建了两个变量：`black`\
    \ 和 `white`。\n\n就像调用方法一样，创建变量时有固定格式：\n\n`type variableName = value;`\n\n在本章中，我们使用的类型是\
    \ `color`。你可能会在书中遇到的其他简单类型有：\n\n* `int`: 整数/数字\n* `boolean`: 真或假\n* `char`: 单字符，如\
    \ `a` 或 `b`\n* `color`: 像素的颜色\n\n变量的用在于你可以给一个值命名（例如 `color(0)`），然后通过使用该名称来使用该值。例如，这里相同的代码——第一个使用了变量，第二个没有：\n\
    \n```\ncolor black = color(0);\nset(240, 250, black);\nset(241, 250, black);\n\
    set(242, 250, black);\n```\n\n```\nset(240, 250, color(0));\nset(241, 250, color(0));\n\
    set(242, 250, color(0));\n```\n"
- fmt: "\nYou can see that not only is it faster to type `black` instead of `color(0)`,\
    \ but it’s also much clearer to humans to use the word `black` instead of the\
    \ code `color(0)`.\n\nThis would still set the 3 pixels to the color black because\
    \ you’re using `0` as the parameter when you call the `color` method, but any\
    \ human reading this code might think that the 3 pixels would be set to purple\
    \ instead!\n\nIn the rest of this book, you’ll revisit methods, parameters, and\
    \ variables.\n\n![image](images/c3.png)\n\nIn [Chapter 2](#05_9781119404170-ch02.xhtml),\
    \ you learned how to make a black-and-white line. It was a lot of code just to\
    \ make a line that was 20 pixels long! Imagine if you wanted to make a square\
    \ that was black and white. You’d have to make 20 lines, which would mean 400\
    \ lines of code! That would be crazy — and it would be really easy to make a mistake.\n\
    \nEven though making a square that is 20 pixels wide and 20 pixels tall is basically\
    \ changing each of those pixels to be a different color, the Processing programming\
    \ environment has created methods that you can call to create a square instead\
    \ of having to write all 400 lines of code to change each individual pixel!\n\n\
    The five primitive (or simple) shapes that Processing provides to you are:\n\n\
    ```\ntriangle(x1, y1, x2, y2, x3, y3);\n```\n\n```\nrect(x, y, width, height);\n\
    ```\n\n```\nquad(x1, y1, x2, y2, x3, y3, x4, y4);\n```\n\n```\nellipse(x, y, width,\
    \ height);\n```\n\n```\narc(x, y, width, height, start, stop);\n```\n\nEven though\
    \ Processing makes it simpler to create these shapes, it can still be tricky.\
    \ In this chapter, you’ll create each of the shapes and change the parameters\
    \ a bit to draw the shapes on different parts of the canvas, and make them different\
    \ sizes.\n\n## DRAWING A TRIANGLE\n\nIn Processing, the `triangle` method will\
    \ create a triangle that takes six parameters, which are the `x` and `y` locations\
    \ of each of the points of the triangle. Follow these steps:\n\n1. **Open the\
    \ Processing application and create a new program.**\n2. **Create a canvas that\
    \ is 500 by 500 pixels (see [Figure 3-1]](#06_9781119404170-ch03.xhtml_c03-fig-0001)):**\n\
    ```\nsize(500, 500);\n```\n3. **Create a triangle that has its upper-point right\
    \ in the center of the canvas (`x` = 250, `y` = 250). The height of the triangle\
    \ should be 100 pixels and the width of the triangle should be 200 pixels (see\
    \ [Figure 3-2]](#06_9781119404170-ch03.xhtml_c03-fig-0002)):**\n```\ntriangle(250,\
    \ 250, 150, 350, 350, 350);\n```\n4. **Click Run to see the triangle that you\
    \ created (see [Figure 3-4]](#06_9781119404170-ch03.xhtml_c03-fig-0004)).**\n\
    5. **Try changing the `x` and `y` coordinates for each point to create different\
    \ triangles.**\n   This code makes the triangle shown in [Figure 3-5](#06_9781119404170-ch03.xhtml_c03-fig-0005):\n\
    ```\ntriangle(250, 250, 250, 350, 300, 300);\n```\n   This code makes the triangle\
    \ shown in [Figure 3-6](#06_9781119404170-ch03.xhtml_c03-fig-0006):\n```\ntriangle(250,\
    \ 250, 150, 450, 350, 450);\n```\n   This code makes the triangle shown in [Figure\
    \ 3-7](#06_9781119404170-ch03.xhtml_c03-fig-0007):\n```\ntriangle(250, 250, 250,\
    \ 450, 450, 450);\n```\n6. **When you’re done exploring different triangle shapes,\
    \ comment out the line of code that creates the triangle.**\n   To do this, add\
    \ two forward slashes in front of the method name (see [Figure 3-8](#06_9781119404170-ch03.xhtml_c03-fig-0008)):\n\
    ```\n//triangle(250, 250, 250, 450, 450, 450);\n```\n   This will make the Processing\
    \ application ignore everything written on the same line as the `//`.\n\n![image](images/9781119404170-fg0301.png)\n\
    \n[FIGURE 3-1:](#06_9781119404170-ch03.xhtml_rc03-fig-0001) The code needed to\
    \ create a 500-x-500-pixel canvas.\n\n![image](images/9781119404170-fg0302.png)\n\
    \n[FIGURE 3-2:](#06_9781119404170-ch03.xhtml_rc03-fig-0002) The code needed to\
