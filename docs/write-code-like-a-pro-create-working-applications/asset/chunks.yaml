- fmt: "\n[FIGURE 4-8:](#07_9781119404170-ch04.xhtml_rc04-fig-0008) An example of\
    \ changing the background completely white.\n\nYou can play around with the value\
    \ of each parameter to get very specific colors.\n\n![image](images/9781119404170-fg0409.png)\n\
    \n[FIGURE 4-9:](#07_9781119404170-ch04.xhtml_rc04-fig-0009) The RGB picker on\
    \ the Rapid Tables website for color choosing.\n\n![image](images/9781119404170-fg0410.png)\n\
    \n[FIGURE 4-10:](#07_9781119404170-ch04.xhtml_rc04-fig-0010) Using the RGB numbers\
    \ from the website in your code.\n\n## ADDING COLOR TO SHAPES\n\nShapes can have\
    \ color in two different ways:\n\n* **Stroke**: The outline of the shape\n* **Fill**:\
    \ The inside color of the shape\n\nAdd three lines of code to your program (see\
    \ [Figure 4-11](#07_9781119404170-ch04.xhtml_c04-fig-0011)):\n\n```\nstroke(255,\
    \ 255, 255);\nfill(56, 205, 130);\ntriangle(250, 250, 250, 450, 450, 450);\n```\n\
    \n![image](images/9781119404170-fg0411.png)\n\n[FIGURE 4-11:](#07_9781119404170-ch04.xhtml_rc04-fig-0011)\
    \ An example of changing the triangle to be green with a white outline.\n\nNotice\
    \ that the stroke is white and the fill is green. If you don’t want to have the\
    \ outline be visible, you can make it the same color as the fill (see [Figure\
    \ 4-12](#07_9781119404170-ch04.xhtml_c04-fig-0012)):\n\n```\nstroke(56, 205, 130);\n\
    fill(56, 205, 130);\ntriangle(250, 250, 250, 450, 450, 450);\n```\n\n![image](images/9781119404170-fg0412.png)\n\
    \n[FIGURE 4-12:](#07_9781119404170-ch04.xhtml_rc04-fig-0012) An example of making\
    \ the entire triangle green.\n\nIf you want all your shapes to be the same color,\
    \ you only have to call `stroke` and `fill` once, at the beginning (see [Figure\
    \ 4-13](#07_9781119404170-ch04.xhtml_c04-fig-0013)):\n\n```\nstroke(56, 205, 130);\n\
    fill(56, 205, 130);\ntriangle(250, 250, 250, 450, 450, 450);\nrect(100, 50, 200,\
    \ 400);\nquad(50, 50, 150, 50, 150, 150, 50, 150);\n```\n\n![image](images/9781119404170-fg0413.png)\n\
    \n[FIGURE 4-13:](#07_9781119404170-ch04.xhtml_rc04-fig-0013) An example of making\
    \ three shapes completely green.\n\nBut if you want all your shapes to be different\
    \ colors, you need to call `stroke` and `fill` before you draw each shape (see\
    \ [Figure 4-14](#07_9781119404170-ch04.xhtml_c04-fig-0014)):\n\n```\nstroke(56,\
    \ 205, 130);\nfill(56, 205, 130);\ntriangle(250, 250, 250, 450, 450, 450);\nstroke(56,\
    \ 105, 205);\nfill(556, 105, 205);\nrect(100, 50, 200, 400);\nstroke(205, 56,\
    \ 205);\nfill(205, 56, 205);\nquad(50, 50, 150, 50, 150, 150, 50, 150);\n```\n\
    \n![image](images/9781119404170-fg0414.png)\n\n[FIGURE 4-14:](#07_9781119404170-ch04.xhtml_rc04-fig-0014)\
    \ An example of making three shapes different colors.\n\nTry adding color to the\
    \ drawing you made in [Chapter 3](#06_9781119404170-ch03.xhtml), or creating a\
    \ new drawing now that you can have color!\n\n![image](images/c5.png)\n\nIn the\
    \ first four chapters of this book, you saw how to call methods. You called methods\
    \ to create a canvas, change the color of the canvas, create shapes, and change\
    \ the color of those shapes. Methods are a really useful tool in coding because\
    \ a lot of lines of code get written once, get named, and then coders can use\
    \ the name of the method to execute all those lines of code. Methods make code\
    \ easier to understand and more manageable.\n\nIn this chapter, you’ll learn why\
    \ methods are useful, discover methods that you’ll want to write to make animations\
    \ (and later, games!), and find out how to write your own methods. But first,\
    \ a short overview of methods!\n\n## LEARNING ABOUT METHODS\n\nIn this section,\
    \ you’ll learn more about Java methods. Methods are a really important part of\
    \ coding, because they break your code up into small chunks that are named. You\
    \ can then use the name of these code chunks to call the same code over and over\
    \ again. Methods are one of the fundamentals of coding and will be useful even\
    \ in other programming languages, not just Java.\n\n### METHOD SIGNATURE\n\nIn\
    \ Java, you always write a method the same way:\n\n```\nreturnType methodName(parameterType\
    \ parameterName)\n{\n    CODE\n}\n```\n\nThe first line of code in the above code\
    \ snippet is called the method signature. It has all the information you (or another\
    \ coder using your code) would need to call the method.\n\nThe method signature\
    \ has three parts:\n\n* `returnType`: The type of value the method returns.\n\
    * `methodName`: The name used to call the method.\n* `(parameterType parameterName)`:\
    \ The inputs the method accepts.\n"
  raw: "[FIGURE 4-8:](#07_9781119404170-ch04.xhtml_rc04-fig-0008) An example of changing\
    \ the background completely white.\n\nYou can play around with the value of each\
    \ parameter to get very specific colors.\n\n![image](images/9781119404170-fg0409.png)\n\
    \n[FIGURE 4-9:](#07_9781119404170-ch04.xhtml_rc04-fig-0009) The RGB picker on\
    \ the Rapid Tables website for color choosing.\n\n![image](images/9781119404170-fg0410.png)\n\
    \n[FIGURE 4-10:](#07_9781119404170-ch04.xhtml_rc04-fig-0010) Using the RGB numbers\
    \ from the website in your code.\n\n## ADDING COLOR TO SHAPES\n\nShapes can have\
    \ color in two different ways:\n\n*   **Stroke:** The outline of the shape\n\n\
    *   **Fill:** The inside color of the shape\n\nAdd three lines of code to your\
    \ program (see [Figure 4-11](#07_9781119404170-ch04.xhtml_c04-fig-0011)):\n\n\
    `stroke(255, 255, 255);`\n\n`fill(56, 205, 130);`\n\n`triangle(250, 250, 250,\
    \ 450, 450, 450);`\n\n![image](images/9781119404170-fg0411.png)\n\n[FIGURE 4-11:](#07_9781119404170-ch04.xhtml_rc04-fig-0011)\
    \ An example of changing the triangle to be green with a white outline.\n\nNotice\
    \ that the stroke is white and the fill is green. If you don’t want to have the\
    \ outline be visible, you can make it the same color as the fill (see [Figure\
    \ 4-12](#07_9781119404170-ch04.xhtml_c04-fig-0012)):\n\n`stroke(56, 205, 130);`\n\
    \n`fill(56, 205, 130);`\n\n`triangle(250, 250, 250, 450, 450, 450);`\n\n![image](images/9781119404170-fg0412.png)\n\
    \n[FIGURE 4-12:](#07_9781119404170-ch04.xhtml_rc04-fig-0012) An example of making\
    \ the entire triangle green.\n\nIf you want all your shapes to be the same color,\
    \ you only have to call `stroke` and `fill` once, at the beginning (see [Figure\
    \ 4-13](#07_9781119404170-ch04.xhtml_c04-fig-0013)):\n\n`stroke(56, 205, 130);`\n\
    \n`fill(56, 205, 130);`\n\n`triangle(250, 250, 250, 450, 450, 450);`\n\n`rect(100,\
    \ 50, 200, 400);`\n\n`quad(50, 50, 150, 50, 150, 150, 50, 150);`\n\n![image](images/9781119404170-fg0413.png)\n\
    \n[FIGURE 4-13:](#07_9781119404170-ch04.xhtml_rc04-fig-0013) An example of making\
    \ three shapes completely green.\n\nBut if you want all your shapes to be different\
    \ colors, you need to call `stroke` and `fill` before you draw each shape (see\
    \ [Figure 4-14](#07_9781119404170-ch04.xhtml_c04-fig-0014)):\n\n`stroke(56, 205,\
    \ 130);`\n\n`fill(56, 205, 130);`\n\n`triangle(250, 250, 250, 450, 450, 450);`\n\
    \n`stroke(56, 105, 205);`\n\n`fill(556, 105, 205);`\n\n`rect(100, 50, 200, 400);`\n\
    \n`stroke(205, 56, 205);`\n\n`fill(205, 56, 205);`\n\n`quad(50, 50, 150, 50, 150,\
    \ 150, 50, 150);`\n\n![image](images/9781119404170-fg0414.png)\n\n[FIGURE 4-14:](#07_9781119404170-ch04.xhtml_rc04-fig-0014)\
    \ An example of making three shapes different colors.\n\nTry adding color to the\
    \ drawing you made in [Chapter 3](#06_9781119404170-ch03.xhtml), or creating a\
    \ new drawing now that you can have color!\n\n![image](images/c5.png)\n\nIn the\
    \ first four chapters of this book, you saw how to *call* methods. You called\
    \ methods to create a canvas, change the color of the canvas, create shapes, and\
    \ change the color of those shapes. Methods are a really useful tool in coding\
    \ because a lot of lines of code get written once, get named, and then coders\
    \ can use the name of the method to execute all those lines of code. Methods make\
    \ code easier to understand and more manageable.\n\nIn this chapter, you’ll learn\
    \ why methods are useful, discover methods that you’ll want to write to make animations\
    \ (and later, games!), and find out how to write your own methods. But first,\
    \ a short overview of methods!\n\n## LEARNING ABOUT METHODS\n\nIn this section,\
    \ you’ll learn more about Java methods. Methods are a really important part of\
    \ coding, because they break your code up into small chunks that are named. You\
    \ can then use the name of these code chunks to call the same code over and over\
    \ again. Methods are one of the fundamentals of coding and will be useful even\
    \ in other programming languages, not just Java.\n\n### A METHOD SIGNATURE\n\n\
    In Java, you always write a method the same way:\n\n*`returnType`**`methodName`*`(`*`parameterType`**`parameterName`*`)`\n\
    \n`{`\n\n*`CODE`*\n\n`}`\n\nThe first line of code in the above code snippet is\
    \ called the *method signature.* It has all the information you (or another coder\
    \ using your code) would need to call the method.\n\nThe method signature has\
    \ three parts:\n\n*   `returnType`: The return type is the type of data that will\
    \ be returned when the code in the method finishes executing (or running). You’ll\
    \ get more examples of this as you go through this book. In a lot of the code\
    \ you’ll be writing, you’ll use the return type `void`. But there are times when\
    \ it’s important to have data returned. For example, in [Chapter 2](#05_9781119404170-ch02.xhtml),\
    \ you added a line of code to call a method called `color`. The return type for\
    \ the `color` method is `Color`. When the `color` method finishes executing, it\
    \ returns data that is of type `Color`, and that data gets named `black` when\
    \ you assigned it to the variable you created. Don’t worry if this doesn’t make\
    \ sense yet — you’ll re-visit this idea throughout the book to get a better understanding.\n\
    \n*   `methodName`: The method name can be anything you want, but typically it\
    \ describes what the method does. For example, if you had a method that added\
    \ two numbers, you might call it `add`.\n\n*   `(parameterType parameterName)`: After\
    \ the method name there is always an open and closed parentheses. Between the\
    \ open and closed parentheses is an optional parameter list. Sometimes, methods\
    \ don’t have parameters, like in the method `exit()`. When a method does have\
    \ parameters, you, as the coder, have to specify what type the parameter is and\
    \ what its name is. It’s kind of like creating a new variable to be used in the\
    \ method. For example, the `color` method from [Chapter 2](#05_9781119404170-ch02.xhtml)\
    \ has one parameter that is of type `int` (integer or number) and, though you\
    \ never saw it, the parameter was named `gray`. Later in this book, you’ll write\
    \ methods that take in parameters and this will become clearer.\n\n### A METHOD\
    \ BODY\n\nThe last three lines of the code snippet is called the *method body.*\
    \ This is where all the code for the method goes. All the code that is inside\
    \ the method body will be executed when the method is called.\n\nIf the method\
    \ needs to return data of a certain type, let’s say an `int` (or number), then\
    \ a `return` statement needs to be the last line of code in the method body:\n\
    \n*`returnType`**`methodName`*`(`*`parameterType`**`parameterName`*`)`\n\n`{`\n\
    \n*`CODE`*\n\n`return 5;`\n\n`}`\n\nYou’ll learn more about method bodies throughout\
    \ this book.\n\n## WRITING YOUR FIRST TWO METHODS\n\nTo practice what you just\
    \ read, you’ll now write two of your own methods! When you want to make an animation\
    \ or videogame using the Processing application, there are two methods that you\
    \ should write that are critical. In this case, the methods have specific names\
    \ that you have to use. Don’t worry — later in this chapter, you’ll write a method\
    \ with a name that you can choose.\n\n### WRITING THE SETUP METHOD\n\nThe first\
    \ method is called `setup`. This method is automatically called first, when you\
    \ click the Run button.\n\n1.  **Open a new Sketch window.**\n\n2.  **Write the\
    \ method signature and empty method body of a method called** `setup` **that returns\
    \ nothing and has no parameters (see** [**Figure 5-1**](#08_9781119404170-ch05.xhtml_c05-fig-0001)**):**\n\
    \n    `void setup()`\n\n    `{`\n\n    `}`\n\n3.  **Add two lines of code inside\
    \ the method body for the** `setup` **method to create a 500-x-500-pixel canvas\
    \ that has a red background color (see** [**Figure 5-2**](#08_9781119404170-ch05.xhtml_c05-fig-0002)**):**\n\
    \n    `void setup()`\n\n    `{`\n\n    **`size(500, 500);`**\n\n    **`background(255,\
    \ 0, 0);`**\n\n    `}`\n\n4.  **Click the Run button to test your code.**\n\n\
    \    A red canvas appears (see [Figure 5-3](#08_9781119404170-ch05.xhtml_c05-fig-0003)).\n\
    \n![image](images/9781119404170-fg0501.png)\n\n[FIGURE 5-1:](#08_9781119404170-ch05.xhtml_rc05-fig-0001)\
    \ An empty `setup` method.\n\n![image](images/9781119404170-fg0502.png)"
