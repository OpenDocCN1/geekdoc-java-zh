  trans: "\n\n10. 既然你已经更新了鸟的位置，现在在画布上重新绘制小鸟（参见图 11-24）：\n\n```javasa\n//Redraw the\
    \ bird in on the canvas\nimage(bird, xCoordinate, yCoordinate);\n```\n\n11. 在主类的\
    \ `draw` 方法中调用鸟的 `move` 方法来重新绘制小鸟（参见图 11-25）：\n\n```javasa\nbird.move();\n```\n\
    \n12. 在主类的 `draw` 方法中调用 `drawScene` 方法，这样鸟在落下时就不会留下痕迹（参见图 11-26）：\n\n```javasa\n\
    drawScene();\n```\n\n13. 测试你的代码，确保鸟落在地面时会停止移动（参见图 11-27）。\n\n14. 添加一行代码，当玩家点击鼠标时让小鸟向上移动。这部分位于\
    \ `Bird` 类的 `mouseClicked` 方法中（参见图 11-28）：\n\n```javasa\n//Move the bird up when\
    \ the mouse is clicked\nyCoordinate = yCoordinate - 75;\n```\n\n15. 除非同一类中也有一个\
    \ `draw` 方法，否则 Processing 不会自动调用 `mouseClicked` 方法。由于 `Bird` 类没有 `draw` 方法，你必须在主类中创建一个\
