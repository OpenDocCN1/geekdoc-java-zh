    \ Comment out code by putting `//` at the beginning of the line.\n\n## DRAWING\
    \ A RECTANGLE\n\nIn Processing, the `rect` method will create a rectangle that\
    \ takes four parameters: the upper-left `x` and `y` values, the width, and the\
    \ height.\n\n1. **Create a rectangle that has the upper-left corner at `x` = 100\
    \ and `y` = 100 and is 50 pixels wide and 50 pixels tall. Click Play to see the\
    \ square (see [Figure 3-9](#06_9781119404170-ch03.xhtml_c03-fig-0009)):**\n```\n\
    rect(100, 100, 50, 50);\n```\n2. **Try changing the `x` and `y` coordinates and\
    \ the width and height to create different kinds of rectangles.**\n   This code\
    \ creates the rectangle shown in [Figure 3-10](#06_9781119404170-ch03.xhtml_c03-fig-0010):\n\
    ```\nrect(100, 100, 200, 100);\n```\n   This code creates the rectangle shown\
    \ in [Figure 3-11](#06_9781119404170-ch03.xhtml_c03-fig-0011):\n```\nrect(100,\
    \ 50, 200, 400);\n```\n3. **When you’re done exploring rectangle shapes, comment\
    \ out the line of code that creates the rectangle (see [Figure 3-12](#06_9781119404170-ch03.xhtml_c03-fig-0012)).**\n\
    \n![image](images/9781119404170-fg0309.png)\n\n[FIGURE 3-9:](#06_9781119404170-ch03.xhtml_rc03-fig-0009)\
    \ An example of a 50-x-50-pixel square.\n\n![image](images/9781119404170-fg0310.png)\n\
    \n[FIGURE 3-10:](#06_9781119404170-ch03.xhtml_rc03-fig-0010) An example of a horizontal\
    \ rectangle.\n\n![image](images/9781119404170-fg0311.png)\n\n[FIGURE 3-11:](#06_9781119404170-ch03.xhtml_rc03-fig-0011)\
    \ An example of a vertical rectangle.\n\n![image](images/9781119404170-fg0312.png)\n\
    \n[FIGURE 3-12:](#06_9781119404170-ch03.xhtml_rc03-fig-0012) The rectangle code\
    \ commented out.\n\n## DRAWING A QUADRATERAL\n\nIn Processing, the `quad` method\
    \ will create a shape that has four sides. Similar to the triangle, there are\
    \ eight parameters, which represent the `x` and `y` coordinates of each point.\
    \ Follow these steps:\n\n1. **Create a quadrilateral that has the upper-left corner\
    \ at `x` = 50 and `y` = 50, the upper-right corner at `x` = 100 and `y` = 100,\
    \ the lower-right corner at `x` = 100 and `y` = 150, and lower-left corner at\
    \ `x` = 50 and `y` = 200 (see [Figure 3-13](#06_9781119404170-ch03.xhtml_c03-fig-0013)):**\n\
    ```\nquad(50, 50, 100, 100, 100, 150, 50, 200);\n```\n2. **Try changing the `x`\
    \ and `y` coordinates to create different kinds of quadrilaterals.**\n   This\
    \ code creates the quadrilateral shown in [Figure 3-14](#06_9781119404170-ch03.xhtml_c03-fig-0014):\n\
    ```\nquad(50, 50, 150, 50, 200, 150, 100, 150);\n```\n   This code creates the\
    \ quadrilateral shown in [Figure 3-15](#06_9781119404170-ch03.xhtml_c03-fig-0015):\n\
    ```\nquad(50, 50, 150, 50, 150, 150, 50, 150);\n```\n3. **When you’re done exploring\
    \ different quadrilateral shapes, comment out the line of code that creates the\
    \ quadrilateral (see [Figure 3-16](#06_9781119404170-ch03.xhtml_c03-fig-0016)).**\n\
    \n![image](images/9781119404170-fg0313.png)\n\n[FIGURE 3-13:](#06_9781119404170-ch03.xhtml_rc03-fig-0013)\
    \ An example of a sideways trapezoid.\n\n![image](images/9781119404170-fg0314.png)\n\
    \n[FIGURE 3-14:](#06_9781119404170-ch03.xhtml_rc03-fig-0014) An example of a parallelogram.\n\
    \n![image](images/9781119404170-fg0315.png)\n\n[FIGURE 3-15:](#06_9781119404170-ch03.xhtml_rc03-fig-0015)\
    \ An example of a square.\n\n![image](images/9781119404170-fg0316.png)\n"
