  trans: "\n正如你可能注意到的，条件语句有特定的部分，就像方法调用和方法定义一样：\n\n```\nif(CONDITION)\n{\n  CODE\n\
    }\nelse\n{\n  CODE\n}\n```\n\n条件语句始终以小写的 `if` 开始，后面跟着一对圆括号。在左右括号之间是一个条件。这个条件必须是一个求值为为真（true）或假（false）的值。在上面的\
    \ `eatDinner` 示例中，条件是 `eatDinner == true`。如果变量 `eatDinner` 为真，那么整个条件实际上是 `true\
    \ == true`，其求值为为真。如果 `eatDinner` 为假，那么整个条件实际上是 `false == true`，其求值为为假。你可以将条件看作一个有“是”或“否”答案的问题（true\
    \ = 是，false = 否）。\n\n条件语句的另一个有趣特性是，你并不总是需要 `else` 部分。这是一个有效的条件语句：\n\n```\nif(CONDITION)\n\
    {\n}\n```\n\n有时候你并没有备选方案。例如，也许你的父母说如果你不吃晚饭就什么也得不到！你的代码看起来像这样：\n\n```\nif(eatDinner\
    \ == true)\n{\n  giveIceCream();\n}\n```\n\n你可能还有不止一个选项。例如，也许你和父母有一个约定，如果你考试至少得到\
    \ 90 分，你就能得到一个巧克力冰圣奶；但如果你至少得到 70 分，你至少能得到一个冰淇淋；如果你得到不到 70 分，就会被关禁。你的代码看起来像这样：\n\
    \n```\nif(examPoints >= 90)\n{\n  giveChocolateSundae();\n}\nelse if(examPoints\
    \ >= 70)\n{\n  giveScoop();\n}\nelse\n{\n  giveGrounding();\n}\n```\n\n注意，这些 `if`\
    \ 语句的条件仍然求值为真假，但它们是将变量与数字进行比较，而不是与真假比较。\n\n你认为如果你得到 91 分，你会得到一个巧克力冰圣奶和一个球冰淇淋吗？你确实得到了\
    \ `>= 90` 分，但你也得到了 `>= 70` 分。\n\n不。你只会得到巧克力冰圣奶。因为条件语句被视为代码块，一旦你找到了一个真的条件，实际上就会跳过其后的所有代码。所以，如果你考试得了\
    \ 91 分，那么第一个 `if` 语句内部的代码将执行（给你一个巧克力冰圣奶），而第二个 `if` 语句内部以及 `else` 语句内部的代码将被跳过。这也是你在书中其他地方也会看到的。\n\
    \n### 在你的代码中添加条件语句\n\n现在你已经对条件语句有了简要介绍，是时候在代码中添加一些了！你将实现：当按下鼠标时，圆的颜色为蓝色；当松开鼠标时，圆的颜色为绿色。按照以下步骤操作：\n\
    \n1. 在 `stroke` 和 `fill` 行周围添加一些空格，以便在视觉上区分你将添加条件语句的区域（参见图 6-12）。\n\n2. 在 `stroke`\
    \ 和 `fill` 方法调用周围添加一个 `if` 语句（参见图 6-13）。\n\n   确保大括号包裹了这两行代码。此 `if` 语句的条件应如下：\n\
    \n   `mousePressed == true`\n\n   `mousePressed` 是 Processing 应用程序给你使用的变量，就像 `mouseX`\
    \ 和 `mouseY` 一样。\n\n``````\nif(mousePressed == true)\n{\n  stroke(255, 255, 255);\n\
    \  fill(0, 0, 250);\n}\n```\n\n3. 在 `if` 语句下方添加 `else` 语句以完成条件语句，并在 `if` 语句的大括号内添加两行代码，使描边变为白色，填充变为绿色（参见图\
    \ 6-14）。\n\n```\nelse\n{\n  stroke(255, 255, 255);\n  fill(0, 255, 0);\n}\n```\n\
    \n4. 点击运行（Run）按钮，确保当你按下鼠标时圆是蓝色的，当松开鼠标时它变成绿色！\n\n![image](img/9781119404170-fg0612.png)\n\
    \n图 6-12: 在此处留出空格\n\n![image](img/9781119404170-fg0613.png)\n\n图 6-13: 添加 `if`\
    \ 语句\n\n![image](img/9781119404170-fg0614.png)\n\n图 6-14: 添加 `else` 部分\n\n###\
    \ 使用键盘移动形状\n\n###本节介绍了键盘。在最后一章中，你将学习如何使用键盘移动形状。按照以下步骤操作：\n\n1. 修改 `ellipse` 方法（参见图\
    \ 6-15）。\n\n```\nellipse(xCoordinate, yCoordinate, 300);\n```\n\n2. 删除你创建的 `mouseDragged`\
    \ 方法（参见图 6-16）。\n\n3. 添加一个新的 `keyPressed` 方法（参见图 6-17）。\n\n```\nvoid keyPressed()\n\
    {\n}\n```\n\n4. 在 `keyPressed` 方法中添加一个条件语句，检查按键是否为 W（参见图 6-18）。\n\n```\nif(key\
    \ == 'w')\n{\n}\n```\n\n5. 添加一行代码将 `yCoordinate` 变量改为原有值减 1 像素。该行代码应该位于条件语句的左右大括号之间：\n\
    \n```\nyCoordinate = yCoordinate – 1;\n```\n\n6. 点击运行按钮并按下 W 键。确保每次按下按键时圆都会向上移动像素。\n\
    \n7. 在你的条件语句中添加另外三个 `if` 语句部分，以检查按按键是否为 A、S 或 D（参见图 6-20）。\n\n确保你正确修改了 `xCoordinate`\
    \ 和 `yCoordinate` 变量！\n\n```\nvoid keyPressed()\n{\n  if(key == 'w')\n  {\n  \
    \  yCoordinate = yCoordinate – 1;\n  }\n  else if(key == 'a')\n  {\n    xCoordinate\
    \ = xCoordinate – 1;\n  }\n  else if(key == 's')\n  {\n    yCoordinate = yCoordinate\
    \ + 1;\n  }\n  else if(key == 'd')\n  {\n    xCoordinate = xCoordinate + 1;\n\
    \  }\n}\n```\n\n8. 点击运行按钮并尝试按下所有四个键（W、A、S 和 D）来移动画布上的圆圆。\n\n"
- fmt: "\n9. Just to make sure that what you just wrote didn’t mess anything up, try\
    \ also pressing the mouse to make sure it still changes color.\n\n![image](images/9781119404170-fg0615.png)\n\
    \n[FIGURE 6-15:](#09_9781119404170-ch06.xhtml_rc06-fig-0015) Control the circle’s\
    \ location with the `xCoordinate` and `yCoordinate` variables.\n\n![image](images/9781119404170-fg0616.png)\n\
    \n[FIGURE 6-16:](#09_9781119404170-ch06.xhtml_rc06-fig-0016) Delete the `mouseDragged`\
    \ method so that it isn’t accidentally called.\n\n![image](images/9781119404170-fg0617.png)\n\
    \n[FIGURE 6-17:](#09_9781119404170-ch06.xhtml_rc06-fig-0017) Create a new method\
    \ called `keyPressed`.\n\n![image](images/9781119404170-fg0618.png)\n\n[FIGURE\
    \ 6-18:](#09_9781119404170-ch06.xhtml_rc06-fig-0018) Add a conditional statement\
    \ to the `keyPressed` method.\n\n![image](images/9781119404170-fg0619.png)\n\n\
    Figure 6-19: Update the `yCoordinate` variable to move the circle up when `w`\
    \ is pressed.\n\n![image](images/9781119404170-fg0620.png)\n\n[FIGURE 6-20:](#09_9781119404170-ch06.xhtml_rc06-fig-0020)\
    \ Add three more if statements to the conditional to move the shape in all four\
    \ directions.\n\n![image](images/9781119404170-fg0621.png)\n\n[FIGURE 6-21:](#09_9781119404170-ch06.xhtml_rc06-fig-0021)\
    \ Start the circle in the center of the canvas.\n\nYou can also create a variable\
    \ called `speed` that will move the shape faster if you make the variable a bigger\
    \ number (see [Figure 6-22](#09_9781119404170-ch06.xhtml_c06-fig-0022)).\n\n```\n\
    int speed = 5;\n```\n\n![image](images/9781119404170-fg0622.png)\n\n[FIGURE 6-22:](#09_9781119404170-ch06.xhtml_rc06-fig-0022)\
    \ Add a new variable called `speed` that is set to 5.\n\nThen change the `xCoordinate`\
    \ and `yCoordinate` variables by the variable `speed` instead of 1 in the `keyPressed`\
    \ method (see [Figure 6-23](#09_9781119404170-ch06.xhtml_c06-fig-0023)).\n\n```java\n\
    void keyPressed()\n{\n  if(key == 'w')\n  {\n    yCoordinate = yCoordinate – speed;\n\
    \  }\n  else if(key == 'a')\n  {\n    xCoordinate = xCoordinate – speed;\n  }\n\
    \  else if(key == 's')\n  {\n    yCoordinate = yCoordinate + speed;\n  }\n  else\
    \ if(key == 'd')\n  {\n    xCoordinate = xCoordinate + speed;\n  }\n}\n```\n\n\
    ![image](images/9781119404170-fg0623.png)\n\n[FIGURE 6-23:](#09_9781119404170-ch06.xhtml_rc06-fig-0023)\
    \ Change the `xCoordinate` and `yCoordinate` variables by `speed` instead of 1.\n\
    \nCongratulations! You’ve made a shape move with the keyboard and change colors\
    \ with the mouse! This is really exciting because in the next chapter you’ll take\
    \ everything you learned to create your very first videogame!\n\n![image](images/c7.png)\n\
    \nThe time has come to create your first videogame! This chapter guides you through\
    \ all the steps needed to make a simple videogame where you have an actual character\
    \ (not just a shape) that moves around the screen when the player uses the keyboard\
    \ and collects points!\n\nThe game you’ll make in this chapter, and finish making\
    \ in the next chapter, is kind of like Mario. You have a character that can:\n\
    \n*   Move left and right with the A and D keys\n*   Jump with the spacebar\n\
    *   Run into yellow circles (coins!) to collect them\n*   Earn points\n\n## CREATING\
    \ A SCENE\n\nTo start, you need a scene that your character can explore. You may\
    \ want to draw it on paper first. Here’s what you’ll need:\n\n*   Some kind of\
    \ ground\n*   A colorful sky\n*   Something to jump over or on top\n\nNow that\
    \ you have an idea of what you want to create in your scene — either with the\
    \ list or from your drawing — it’s time to get started your game! Follow these\
    \ steps:\n\n1. Open the Processing application and create a new Sketch file.\n\
    2. Create the `setup` method (see [Figure 7-1](#09_9781119404170-ch07.xhtml_c07-fig-0001)).\n\
    ```java\nvoid setup()\n{\n}\n```\n3. Create a canvas that is 1000 x 500 pixels\
    \ with a light-blue background (see [Figure 7-2](#09_9781119404170-ch07.xhtml_c07-fig-0002)).\n\
    ```java\nvoid setup()\n{\n  size(1000, 500);\n  background(173, 216, 230);\n}\n\
    ```\n4. Add a comment above the code you added in Step 3 to keep your code clear\
    \ for humans (see [Figure 7-3](#09_9781119404170-ch07.xhtml_c07-fig-0003)).\n\
    ```java\nvoid setup()\n{\n  // Canvas and sky\n  size(1000, 500);\n  background(173,\
    \ 216, 230);\n}\n```\n5. Add a comment and three lines of code to create the grass\
    \ (see [Figure 7-4](#09_9781119404170-ch07.xhtml_c07-fig-0004)).\n```java\nvoid\
    \ setup()\n{\n  // Canvas and sky\n  size(1000, 500);\n  background(173, 216,\
    \ 230);\n  // Grass\n  stroke(0, 255, 0);\n  fill(0, 255, 0);\n  rect(0, 400,\
    \ 1000, 500);\n}\n```\nThe grass is essentially a rectangle at the bottom of the\
    \ screen that is green.\n6. Add a comment and three lines of code to create a\
    \ hill (see [Figure 7-5](#09_9781119404170-ch07.xhtml_c07-fig-0005)).\n```java\n\
    void setup()\n{\n  // Canvas and sky\n  size(1000, 500);\n  background(173, 216,\
    \ 230);\n  // Grass\n  stroke(0, 255, 0);\n  fill(0, 255, 0);\n  rect(0, 400,\
    \ 1000, 500);\n  // Hill\n  stroke(165, 42, 42);\n  fill(165, 42, 42);\n  arc(300,\
    \ 400, 100, 150, PI, TWO_PI);\n}\n```\nThe hill is essentially an arc on top of\
    \ the grass that is brown.\n7. Add three lines of code to create a second hill\
    \ (see [Figure 7-6](#09_9781119404170-ch07.xhtml_c07-fig-0006)).\n```java\nvoid\
    \ setup()\n{\n  // Canvas and sky\n  size(1000, 500);\n  background(173, 216,\
    \ 230);\n  // Grass\n  stroke(0, 255, 0);\n  fill(0, 255, 0);\n  rect(0, 400,\
    \ 1000, 500);\n  // Hills\n  stroke(165, 42, 42);\n  fill(165, 42, 42);\n  arc(300,\
    \ 400, 100, 150, PI, TWO_PI);\n  arc(600, 400, 100, 150, PI, TWO_PI);\n}\n```\n\
    Make sure you change the comment to say “Hills” instead of “Hill,” because the\
    \ code below the comment is creating two hills.\n\n![image](images/9781119404170-fg0701.png)\n\
    \n[FIGURE 7-1:](#09_9781119404170-ch07.xhtml_rc06-fig-0001) An empty `setup` method.\n\
    \n![image](images/9781119404170-fg0702.png)\n\n[FIGURE 7-2:](#09_9781119404170-ch07.xhtml_rc06-fig-0002)\
    \ A canvas that looks like the sky.\n\n![image](images/9781119404170-fg0703.png)\n\
    \n[Figure 7-3:](#09_9781119404170-ch07.xhtml_c07-fig-0003) Comments added for\
    \ clarity.\n\n![image](images/9781119404170-fg0704.png)\n\n[FIGURE 7-4:](#09_9781119404170-ch07.xhtml_c07-fig-0004)\
    \ Code to create a green rectangle that represents grass.\n\n![image](images/9781119404170-fg0705.png)\n\
    \n[FIGURE 7-5:](#09_9781119404170-ch07.xhtml_c07-fig-0005) Code to create a brown\
    \ arc that represents a hill.\n\n![image](images/9781119404170-fg0706.png)\n\n\
    [FIGURE 7-6:](#09_9781119404170-ch07.xhtml_c07-fig-0006) Code to create a second\
    \ hill.\n\nGreat! Now you have a scene for your character to jump around! It’s\
    \ time to choose and add your character to the scene.\n\n## ADDING A CHARACTER\
    \ TO YOUR GAME\n\nNow it’s time to choose a character. If you have experience\
    \ creating characters on the computer, you can create your own. Otherwise, you\
    \ can find one that you can use for free online.\n\nFollow these steps:\n\n1.\
    \ Open a web browser and go to `www.google.com`.\n2. Type `cartoon` in the search\
    \ bar and click the Images tab (see [Figure 7-7](#09_9781119404170-ch07.xhtml_c07-fig-0007)).\n\
    3. Click Tools and then License.\n4. Choose Labeled for Reuse with Modification\
    \ (see [Figure 7-8](#09_9781119404170-ch07.xhtml_c07-fig-0008)).\n5. Find a cartoon\
    \ character that you’d like to use, click the image of the character, and then\
    \ click View Image (see [Figure 7-9](#09_9781119404170-ch07.xhtml_c07-fig-0009)).\n"
