    \   `arc(600, 400, 100, 150, PI, TWO_PI);`\n\n    `}`\n\n    Make sure you update\
    \ the comments in your code.\n\n2.  **Add a call to the** `drawScene` **method\
    \ in your** `setup` **method (see** [**Figure 7-27**](#10_9781119404170-ch07.xhtml_c07-fig-0027)**):**\n\
    \n    `void setup()`\n\n    `{`\n\n    `//Canvas`\n\n    `size(1000, 500);`\n\n\
    \    **`//Draw the sky, grass, and hills`**\n\n    **`drawScene();`**\n\n    `//Create\
    \ the character`\n\n    `character = loadImage(\"penguin.png\");`\n\n    `image(character,\
    \ characterX, characterY);`\n\n    `}`\n\n3.  **Add a call to the** `drawScene`\
    \ **method in your** `draw` **method (see** [**Figure 7-28**](#10_9781119404170-ch07.xhtml_c07-fig-0028)**):**\n\
    \n    `void draw()`\n\n    `{`\n\n    **`//Redraw the sky, grass, and hills`**\n\
    \n    **`drawScene();`**\n\n    `//Redraw the character`\n\n    `image(character,\
    \ characterX, characterY);`\n\n    `}`\n\n4.  **Test your code to make sure the\
    \ scene is still correct (see** [**Figure 7-29**](#10_9781119404170-ch07.xhtml_c07-fig-0029)**).**\n\
    \n    Now when you move your character, it shouldn’t leave a trail.\n\n![image](images/9781119404170-fg0726.png)\n\
    \n[FIGURE 7-26:](#10_9781119404170-ch07.xhtml_rc07-fig-0026) Move the `drawScene`\
    \ code to a new method.\n\n![image](images/9781119404170-fg0727.png)\n\n[FIGURE\
    \ 7-27:](#10_9781119404170-ch07.xhtml_rc07-fig-0027) Call `drawScene` from `setup`.\n\
    \n![image](images/9781119404170-fg0728.png)\n\n[FIGURE 7-28:](#10_9781119404170-ch07.xhtml_rc07-fig-0028)\
    \ Call `drawScene` from `draw`.\n\n![image](images/9781119404170-fg0729.png)\n\
    \n[FIGURE 7-29:](#10_9781119404170-ch07.xhtml_rc07-fig-0029) Test to make sure\
    \ that your character moves without a trail.\n\n## ADDING GRAVITY TO YOUR VIDEOGAME\n\
    \nOne strange aspect of your game right now is that your character just runs right\
    \ through the hills (see [Figure 7-30](#10_9781119404170-ch07.xhtml_c07-fig-0030)).\n\
    \n![image](images/9781119404170-fg0730.png)\n\n[FIGURE 7-30:](#10_9781119404170-ch07.xhtml_rc07-fig-0030)\
    \ Your character can run through the hills.\n\nIn this section, you’ll make it\
    \ so that your character can move up when you press the spacebar and will move\
    \ down automatically. This is essentially simulating gravity. Follow these steps:\n\
    \n1.  **Add a third condition to the conditional statement to change the** `characterY`\
    \ **variable when the spacebar is pressed (see** [**Figure 7-31**](#10_9781119404170-ch07.xhtml_c07-fig-0031)**):**\n\
    \n    `else if(key == ' ' )`\n\n    `{`\n\n    `characterY = characterY – 5;`\n\
    \n    `}`\n\n2.  **Add a conditional statement to the** `draw` **method to change\
    \ the** `characterY` **variable to move the character down, as long as it’s still\
    \ above the grass (see** [**Figure 7-32**](#10_9781119404170-ch07.xhtml_c07-fig-0032)**):**\n\
    \n    `void draw()`\n\n    `{`\n\n    `//Redraw the sky, grass, and hills`\n\n\
    \    `drawScene();`\n\n    **`if(characterY < 300)`**\n\n    **`{`**\n\n    **`characterY\
    \ = characterY + 2;`**\n\n    **`}`**\n\n    `//Redraw the character`\n\n    `image(character,\
    \ characterX, characterY);`\n\n    `}`\n\n3.  **Adjust the numbers for changing\
    \ the** `characterY` **variable so that you can jump high and fall slowly (see**\
    \ [**Figure 7-33**](#10_9781119404170-ch07.xhtml_c07-fig-0033)**):**\n\n    In\
    \ the condition in the `draw` method that checks if character is less than 300:\n\
    \n    `characterY = characterY + 2;`\n\n    In the condition in the `keyPressed`\
    \ method that checks if the key that was pressed was the spacebar:\n\n    `characterY\
    \ = characterY – 100;`\n\n4.  **Adjust the numbers for changing the `characterX`\
    \ variable so that you can jump over the hills (see [Figure 7-34](#10_9781119404170-ch07.xhtml_c07-fig-0034)):**\n\
    \n    In the condition in the `keyPressed` method that checks if the key that\
    \ was pressed was the letter A:\n\n    `characterX = characterX – 10;`\n\n   \
    \ In the condition in the `keyPressed` method that checks if the key that was\
    \ pressed was the letter D:\n\n    `characterX = characterX + 10;`\n\n![image](images/9781119404170-fg0731.png)\n\
    \n[FIGURE 7-31:](#10_9781119404170-ch07.xhtml_rc07-fig-0031) Move the character\
    \ up when the spacebar is pressed.\n\n![image](images/9781119404170-fg0732.png)\n\
    \n[FIGURE 7-32:](#10_9781119404170-ch07.xhtml_rc07-fig-0032) Move the character\
    \ down when it’s above the grass.\n\n![image](images/9781119404170-fg0733.png)\n\
    \n[FIGURE 7-33:](#10_9781119404170-ch07.xhtml_rc07-fig-0033) Make the jumping\
    \ and gravity more realistic.\n\n![image](images/9781119404170-fg0734.png)\n\n\
    [Figure 7-34:](#10_9781119404170-ch07.xhtml_rc07-fig-0034) Make the movement more\
    \ realistic now that the character can jump.\n\nCongratulations! You’ve added\
    \ gravity to your world!\n\n## MAKING LAVA PITS\n\nMaking it so that your character\
    \ can land on the hills is very complex coding, because Processing doesn’t support\
    \ detecting when a character is touching a certain color. So, instead, you’ll\
    \ modify your code to replace the hills with lava! Follow these steps:\n\n1. \
    \ **In your** `drawScene` **method, modify the code to be upside down and red\
    \ (see** [**Figure 7-35**](#10_9781119404170-ch07.xhtml_c07-fig-0035)**):**\n\n\
    \    `void drawScene()`\n\n    `{`\n\n    `//Sky`\n\n    `background(173, 216,\
    \ 230);`\n\n    `//Grass`\n\n    `stroke(0, 255, 0);`\n\n    `fill(0, 255, 0);`\n\
    \n    `rect(0, 400, 1000, 500);`\n\n    **`//Lava Pits`**\n\n    **`stroke(255,\
    \ 0, 0);`**\n\n    **`fill(255, 0, 0);`**\n\n    **`arc(300, 400, 100, 150, 0,\
    \ PI);`**\n\n    **`arc(600, 400, 100, 150, 0, PI);`**\n\n    `}`\n\n2.  **Add\
    \ a line of code to the end of your `draw` method to display the value of** `characterX`\
    \ **as it moves so that you know when it’s touching the lava (see** [**Figure\
    \ 7-36**](#10_9781119404170-ch07.xhtml_c07-fig-0036)**):**\n\n    `text(characterX,\
    \ characterX + 60, characterY – 5);`\n\n3.  **Add a conditional statement to the\
    \ end of your `draw` method that checks to see if the** `characterX` **variable\
    \ is within the range of the lava pit.**\n\n    To do this, you need to make sure\
    \ that `characterX` is between the 150 and 310 mark. You can use the `&&` symbol\
    \ to do this. This symbol means “and,” so you’re checking to see if the value\
    \ of the `characterX` variable is greater than 150 *and* less than 310\\. It’s\
    \ also a good idea to put this into an extra set of parentheses so that when you\
    \ add more conditions (in Step 4) the computer knows which comparisons to make\
    \ together (see [Figure 7-37](#10_9781119404170-ch07.xhtml_c07-fig-0037)):\n\n\
    \    `//Check to see if the character hit the lava`\n\n    `if((characterX >=\
    \ 150 && characterX <= 310))`\n\n    `{`\n\n    `}`\n\n4.  **Add to the conditional\
    \ statement to check to see if the character variable is within the range of the\
    \ second lava pit. To do this, you’ll use the || symbol, which means “or” (see**\
    \ [**Figure 7-38**](#10_9781119404170-ch07.xhtml_c07-fig-0038)**):**\n\n    `if((characterX\
    \ >= 150 && characterX <= 310) || (characterX >= 450 && characterX <= 610))`\n\
    \n    This line of code means “if `characterX` is between 150 and 310 *or* between\
    \ 450 and 610.” Notice that there are parentheses around each part of the statement.\
    \ This is to make sure that you’re checking that the variable is between 150 and\
    \ 310 *or* between 450 and 610\\. Without the parentheses, the code might get\
    \ read by the computer incorrectly. Adding parentheses ensures that the computer\
    \ knows exactly what you meant to code."
