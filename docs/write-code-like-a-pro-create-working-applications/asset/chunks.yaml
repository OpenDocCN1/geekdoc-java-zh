  trans: "\n在这本书中，你将学习如何从零开始编写自己的代码。但在首次设置编程环境时，测试一些你认为*应该*可以运行的代码是一个好主意，以确保你的编程环境工作正常。按照以下步骤操作：\n\
    \n1. **访问** [`www.processing.org/examples/star.html`](http://www.processing.org/examples/star.html)\
    \ **（参见** 图 1-7**）。**\n\n2. **向下滚动到创建这些星星的代码，如图 1-8**所示。********\n\n3. **选中所有代码。然后右键点击代码，从弹出的菜单中选择“复制”（参见**\
    \ 图 1-9**）。**\n\n   如果你使用的是 Mac，也可以选中代码并按 `Command+C`；如果你使用的是 Windows 电脑，可以按 `Ctrl+C`。\n\
    \n4. **再次点击 Processing 应用程序，在 Sketch 窗口中右键，从弹出的菜单中选择“粘贴”（参见** 图 1-10**）。**\n\n\
    \   如果你使用的是 Mac，也可以点击 Sketch 窗口并按 `Command+V`；如果你使用的是 Windows 电脑，可以按 `Ctrl+V`。\n\
    \n5. **点击 Processing 窗口左上角的运行（Run）按钮（参见** 图 1-11**）。**\n\n6. **观察三颗不同的星星旋转（参见**\
    \ 图 1-12**）！**\n\n![image](img/9781119404170-fg0107.png)\n图 1-7: Processing 网站上的\
    \ Star 程序示例。\n\n![image](img/9781119404170-fg0108.png)\n图 1-8: 你将复制的 Star 程序代码。\n\
    \n![image](img/9781119404170-fg0109.png)\n图 1-9: 通过选中和右键复制 Star 程序代码。\n\n![image](img/9781119404170-fg0110.png)\n\
    图 1-10: 在 Sketch 中右键粘贴 Star 程序代码。\n\n![image](img/9781119404170-fg0111.png)\n\
    图 1-11: 点击运行按钮测试 Star 程序。\n\n![image](img/9781119404170-fg0112.png)\n图 1-12: 带有旋转星星的画布。\n\
    \n恭喜！你测试了你的第一个 Java 程序！如果代码现在还看不懂，不要担心。在整本书中，你将学习很多 Java 知识，并有机会理解一切是如何运作的。\n\n\
    ## 保存并重新打开 Processing 程序\n\n在我结束本章之前，你需要了解如何保存你的工作，并在关闭 Processing 应用程序后再次访问它。按照以下步骤操作：\n\
    \n1. **通过选择 `File`⇒Save 保存你的代码（参见** 图 1-13**）。**\n\n2. **将你的文件重命名为“StarProgram”并点击\
    \ Save（参见** 图 1-14**）。**\n\n3. **通过选择 `Processing`⇒Quit Processing 关闭 Processing\
    \ 应用程序（参见** 图 1.15**）。****\n\n4. **如果你想再次打开此文件，只需打开 Processing 应用程序并选择 `File`⇒Open（参见**\
    \ 图 1-16**）。****\n\n   Processing 显示保存到 Processing 文件夹中的程序，那里是你第 2 步中保存程序的地方。\n\
    \n5. **选择 StarProgram 文件夹并点击 Open（参见** 图 1-17**）。****\n\n6. **选择 `StarProgram.dpe`\
    \ 文件并点击 Open（参见** 图 1-18**）。**\n   你在第 1 步中保存的代码将打开（参见 图 1-19）。\n\n7. **如果你想开始一个新程序，选择\
    \ `File`⇒New（参见** 图 1-20**）。**\n   一个新的 Processing 窗口将打开（参见 图 1-21），你可以编写新代码！\n\
    \n![image](img/9781119404170-fg0113.png)\n图 1-13: 从 File 菜单保存你的 Star 程序。\n\n![image](img/9781119404170-fg0114.png)\n\
    图 1-14: 重命名程序。\n\n![image](img/9781119404170-fg0115.png)\n图 1-15: 从 Processing\
    \ 菜单退出 Processing。\n\n![image](img/9781119404170-fg0116.png)\n图 1-16: 从 File 菜单打开保存的程序。\n\
    \n![image](img/9781119404170-fg0117.png)\n图 1-17: 在同名文件夹中找到保存的程序。\n\n![image](img/9781119404170-fg0118.png)\n\
    图 1-18: 打开 `StarProgram.dpe` 文件查看代码。\n\n![image](img/9781119404170-fg0119.png)\n\
    图 1-19: 在 Processing 中重新打开 Star 程序。\n\n![image](img/9781119404170-fg0120.png)\n\
    图 1-20: 从 File 菜单创建一个新程序。\n\n![image](img/9781119404170-fg0121.png)\n图 1-21: 一个空白的\
    \ Sketch 文件。\n\n在本章中，你将学习 Java 编程中非常重要的概念：方法（methods）和变量（variables）。在学习这些内容时，你将创建自己的画布并添加颜色！\n\
    \n## 了解画布\n\n正如你在第 1 章中注意到的，运行 Processing 程序时会弹出一个画布。`canvas` 是显示程序视觉部分的窗口，就像你测试的旋转星星那样。\n\
    \n### 创建画布\n\n在本节中，你将学习关于画布的知识，这对于理解如何与其交互非常重要。按照以下步骤操作：\n\n1. **打开 Processing\
    \ 应用程序并创建一个新程序（参见** 图 2-1**）。****\n\n2. **输入一行代码创建一个宽 500 像素、高 500 像素的画布（参见**\
    \ 图 2-2**）。****\n\n```\nsize(500, 500);\n```\n\n3. **点击 Processing 窗口左上角的运行按钮，你可以在图\
    \ 2-2 中看到。****\n\n   画布应该出现在你的屏幕上（参见 图 2-3）。\n\n4. **点击屏幕左上角的红色 X 关闭画布。**\n\n\
    5. **将代码更改为 500 比 250 像素，如图 2-4 所示。****\n\n```\nsize(500, 250);\n```\n\n6. **在点击运行按钮之前，预测画布将是横矩形还是竖矩形。**\n\
    \n7. **点击运行按钮，查看你的预测是否正确！**\n\n![image](img/9781119404170-fg0201.png)\n图 2-1:\
    \ 一个空白的 Sketch 文件。\n\n![image](img/9781119404170-fg0202.png)\n图 2-2: 创建 500x500\
    \ 像素画布所需的代码。\n\n![image](img/9781119404170-fg0203.png)\n图 2-3: 空闲的 500x500 像素画布。\n\
