    \ 400, 100, 150, PI, TWO_PI);`**\n\n    `}`\n\n    The hill is essentially an\
    \ arc on top of the grass that is brown.\n\n7.  **Add three lines of code to create\
    \ a second hill (see** [**Figure 7-6**](#10_9781119404170-ch07.xhtml_c07-fig-0006)**):**\n\
    \n    `void setup()`\n\n    `{`\n\n    `//Canvas and sky`\n\n    `size(1000, 500);`\n\
    \n    `background(173, 216, 230);`\n\n    `//Grass`\n\n    `stroke(0, 255, 0);`\n\
    \n    `fill(0, 255, 0);`\n\n    `rect(0, 400, 1000, 500);`\n\n    **`//Hills`**\n\
    \n    `stroke(165, 42, 42);`\n\n    `fill(165, 42, 42);`\n\n    `arc(300, 400,\
    \ 100, 150, PI, TWO_PI);`\n\n    **`arc(600, 400, 100, 150, PI, TWO_PI);`**\n\n\
    \    `}`\n\n    Make sure you change the comment to say “Hills” instead of “Hill,”\
    \ because the code below the comment is creating two hills.\n\n![image](images/9781119404170-fg0701.png)\n\
    \n[FIGURE 7-1:](#10_9781119404170-ch07.xhtml_rc07-fig-0001) An empty `setup` method.\n\
    \n![image](images/9781119404170-fg0702.png)\n\n[FIGURE 7-2:](#10_9781119404170-ch07.xhtml_rc07-fig-0002)\
    \ A canvas that looks like the sky.\n\n![image](images/9781119404170-fg0703.png)\n\
    \n[Figure 7-3:](#10_9781119404170-ch07.xhtml_rc07-fig-0003) Comments added for\
    \ clarity in code.\n\n![image](images/9781119404170-fg0704.png)\n\n[FIGURE 7-4:](#10_9781119404170-ch07.xhtml_rc07-fig-0004)\
    \ Code to create a green rectangle that represents grass.\n\n![image](images/9781119404170-fg0705.png)\n\
    \n[FIGURE 7-5:](#10_9781119404170-ch07.xhtml_rc07-fig-0005) Code to create a brown\
    \ arc that represents a hill.\n\n![image](images/9781119404170-fg0706.png)\n\n\
    [FIGURE 7-6:](#10_9781119404170-ch07.xhtml_rc07-fig-0006) Code to create a second\
    \ hill.\n\nGreat! Now you have a scene for your character to jump around! It’s\
    \ time to choose and add your character to the scene.\n\n## ADDING A CHARACTER\
    \ TO YOUR GAME\n\nNow it’s time to choose a character. If you have experience\
    \ creating characters on the computer, you can create your own. Otherwise, you\
    \ can find one that you can use for free online.\n\nFollow these steps:\n\n1.\
    \  **Open a web browser and go to** [`www.google.com`](http://www.google.com)**.**\n\
    \n2.  **Type** cartoon **in the search bar and click the Images tab (see** [**Figure\
    \ 7-7**](#10_9781119404170-ch07.xhtml_c07-fig-0007)**).**\n\n3.  **Click Tools\
    \ and then click License.**\n\n4.  **Choose Labeled for Reuse with Modification\
    \ (see** [**Figure 7-8**](#10_9781119404170-ch07.xhtml_c07-fig-0008)**).**\n\n\
    5.  **Find a cartoon character that you’d like to use, click the image of the\
    \ character, and then click View Image (see** [**Figure 7-9**](#10_9781119404170-ch07.xhtml_c07-fig-0009)**).**"
