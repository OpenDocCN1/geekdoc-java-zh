    \n![image](images/9781119404170-fg0911.png)\n\n[FIGURE 9-11:](#12_9781119404170-ch09.xhtml_rc09-fig-0011)\
    \ You now have two classes: NinjaBird and Bird.\n\nIn this class, you’ll want\
