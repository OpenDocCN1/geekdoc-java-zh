    \   `xCoordinateTop = xCoordinateTop - 3;`\n\n    `xCoordinateBottom = xCoordinateBottom\
    \ - 3;`\n\n7.  **Add a conditional statement to move the pipes from the left side\
    \ of the canvas back to the right, when they reach the very left (see** [**Figure\
    \ 11-36**](#14_9781119404170-ch11.xhtml_c11-fig-0036)**).**\n\n    `//Conditional\
    \ to move the pipe from the left back to`\n\n    `//the right`\n\n    `if(xCoordinateTop\
    \ < - 150)`"
