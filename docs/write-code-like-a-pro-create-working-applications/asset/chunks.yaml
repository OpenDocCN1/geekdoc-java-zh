  trans: "\n9. 为了确保你刚刚写的内容没有弄乱任何东西，尝试再次点击鼠标，确保它仍然会改变颜色。\n\n![image](img/9781119404170-fg0615.png)\n\
    \n图 6-15: 使用 `xCoordinate` 和 `yCoordinate` 变量控制圆的位置。\n\n![image](img/9781119404170-fg0616.png)\n\
    \n图 6-16: 删除 `mouseDragged` 方法，以免被意外调用。\n\n![image](img/9781119404170-fg0617.png)\n\
    \n图 6-17: 创建名为 `keyPressed` 的新方法。\n\n![image](img/9781119404170-fg0618.png)\n\n\
    图 6-18: 在 `keyPressed` 方法中添加条件语句。\n\n![image](img/9781119404170-fg0619.png)\n\n\
    图 6-19：当按下 `w` 时，更新 `yCoordinate` 变量以使圆向上移动。\n\n![image](img/9781119404170-fg0620.png)\n\
    \n图 6-20: 在条件中再添加三个 if 语句，使形状可以在四个方向上移动。\n\n![image](img/9781119404170-fg0621.png)\n\
    \n图 6-21: 让圆从画布中心开始。\n\n你也可以创建一个名为 `speed` 的变量，如果你将变量设置为更大的数字，形状就会移动得更快（参见图 6-22）。\n\
    \n```\nint speed = 5;\n```\n\n![image](img/9781119404170-fg0622.png)\n\n图 6-22:\
    \ 添加一个设置为 5 的新变量 `speed`。\n\n然后在 `keyPressed` 方法中，用变量 `speed` 代替 1 来更改 `xCoordinate`\
    \ 和 `yCoordinate` 变量（参见图 6-23）。\n\n```java\nvoid keyPressed()\n{\n  if(key ==\
    \ 'w')\n  {\n    yCoordinate = yCoordinate – speed;\n  }\n  else if(key == 'a')\n\
    \  {\n    xCoordinate = xCoordinate – speed;\n  }\n  else if(key == 's')\n  {\n\
    \    yCoordinate = yCoordinate + speed;\n  }\n  else if(key == 'd')\n  {\n   \
    \ xCoordinate = xCoordinate + speed;\n  }\n}\n```\n\n![image](img/9781119404170-fg0623.png)\n\
    \n图 6-23: 使用 `speed` 代替 1 更改 `xCoordinate` 和 `yCoordinate` 变量。\n\n恭喜！你已经让一个形状通过键盘移动并通过鼠标改变颜色了！这真的令人兴奋，因为在下一章中，你将利用所学的所有知识来创建你的第一个电子游戏！\n\
    \n![image](img/c7.png)\n\n创建你的第一个电子游戏的时间到了！本章将引导你完成制作简单电子游戏所需的所有步骤。在这个游戏中，你有一个真正的角色（而不仅仅是一个形状），当玩家使用键盘时，它会在屏幕上移动并收集积分！\n\
    \n你在本章制作并在下一章完成的游戏类似于马里奥（Mario）。你拥有一个可以执行以下操作的角色：\n\n*   使用 A 和 D 键左右移动\n*   使用空格键跳跃\n\
    *   撞击黄色圆（硬币！）以收集它们\n*   获得积分\n\n## 创建场景\n\n首先，你需要一个你的角色可以探索的场景。你可能想先在纸上画出它。你需要：\n\
    \n*   某种地面\n*   彩色的天空\n*   一些可以跳过去或跳在上面的上面的东西\n\n现在你已经对想在场景中创建的内容有了想法（无论是通过列表还是通过你的画作），是时候开始你的游戏了！按照以下步骤操作：\n\
    \n1. 打开 Processing 并创建一个新的 Sketch 文件。\n2. 创建 `setup` 方法（参见图 7-1）。\n```java\nvoid\
    \ setup()\n{\n}\n```\n3. 创建一个 1000 x 500 像素且背景为浅蓝色的画布（参见图 7-2）。\n```java\nvoid\
    \ setup()\n{\n  size(1000, 500);\n  background(173, 216, 230);\n}\n```\n4. 在第\
    \ 3 步添加的代码上方添加注释，以便人类阅读（参见图 7-3）。*注：此处原文图号似乎有误，根据上下文推断*。\n```java\nvoid setup()\n\
    {\n  // Canvas and sky\n  size(1000, 500);\n  background(173, 216, 230);\n}\n\
    ```\n5. 添加注释和三行代码创建草地（参见图 7-4）。\n```java\nvoid setup()\n{\n  // Canvas and sky\n\
    \  size(1000, 500);\n  background(173, 216, 230);\n  // Grass\n  stroke(0, 255,\
    \ 0);\n  fill(0, 255, 0);\n  rect(0, 400, 1000);\n}\n```\n草地基本上是屏幕底部的绿色矩形。\n6.\
    \ 添加注释和三行代码创建一个山（参见图 7-5）。\n```java\nvoid setup()\n{\n  // Canvas and sky\n  size(1000,\
    \ 500);\n  background(173, 216, 230);\n  // Grass\n  stroke(0, 255, 0);\n  fill(0,\
    \ 255, 0);\n  rect(0, 400, 1000);\n  // Hill\n  stroke(165, 42, 42);\n  fill(165,\
    \ 42, 42);\n  arc(300, 400, 100, PI, TWO_PI);\n}\n```\n山基本上是草地上的棕色弧。\n7. 添加三行代码创建第二个山（参见图\
    \ 7-6）。\n```java\nvoid setup()\n{\n  // Canvas and sky\n  size(1000, 500);\n \
    \ background(173, 216, 230);\n  // Grass\n  stroke(0, 255, 0);\n  fill(0, 255,\
    \ 0);\n  rect(0, 400, 1000);\n  // Hills\n  stroke(165, 42, 42);\n  fill(165,\
    \ 42, 42);\n  arc(300, 400, 100, PI, TWO_PI);\n  arc(600, 400, 100, PI, TWO_PI);\n\
    }\n```\n确保你将注释改为“Hills”而不是“Hill”，因为注释下面的代码创建创建两个山。\n\n![image](img/9781119404170-fg0701.png)\n\
    \n图 7-1: 一个空的 `setup` 方法。\n\n![image](img/9781119404170-fg0702.png)\n\n图 7-2:\
    \ 像天空一样的画布。\n\n![image](img/9781119404170-fg0703.png)\n\n图 7-3: 为了清晰添加的注释。\n\n\
    ![image](img/9781119404170-fg0704.png)\n\n图 7-4: 创建代表草地的绿色矩形的代码。\n\n![image](img/9781119404170-fg0705.png)\n\
    \n图 7-5: 创建代表山的棕色弧的代码。\n\n![image](img/9781119404170-fg0706.png)\n\n图 7-6: 创建第二个山的代码。\n\
    \n太棒了！现在你有一个角色可以在其中跳跳跃的场景了！是时候选择并将你的角色添加到场景中了。\n\n## 为你的游戏添加角色\n\n现在是时候选择角色了。如果你有在计算机上创建角色经验，你可以创建自己的。否则，你可以在网上找到免费使用的角色。\n\
    \n按照以下步骤操作：\n\n1. 打开网络浏览器并访问 `www.google.com`。\n2. 在搜索框中输入 `cartoon` 并点击图像标签页（参见图\
    \ 7-7）。\n3. 点击“工具”，然后点击“权限”。\n4. 选择“允许修改后使用”（参见图 7-8）。\n5. 找到一个你喜欢的卡通角色，点击角色图像，然后点击“查看图像”（参见图\
    \ 7-9）。\n\n"
- fmt: "\nSometimes, when you click View Image, a new tab opens with the picture and\
    \ you can right-click it and choose Save Picture As. Other times, when you click\
    \ View Image, a new tab opens with a website where you can download the image.\
    \ In this example, a new tab opened to [`www.pixabay.com`](http://www.pixabay.com).\n\
    \n6. **Click Free Download (see [Figure 7-10](#10_9781119404170-ch07.xhtml_c07-fig-0010)).**\n\
    \n7. **Choose a size that you want (see [Figure 7-11](#10_9781119404170-ch07.xhtml_c07-fig-0011)).**\n\
    You’ll change the size later, so the size you choose doesn’t really matter right\
    \ now.\n\n8. **A popup window might appear with a captcha (see [Figure 7-12](#10_9781119404170-ch07.xhtml_c07-fig-0012));\
    \ if it does, fill it out.**\n\n9. **Open the picture you just downloaded.**\n\
    If you’re using a Mac, open the picture in Preview. (If you double-click the picture\
    \ file, it will most likely open in Preview automatically.) Choose Tools  Adjust\
    \ Size (see [Figure 7-13](#10_9781119404170-ch07.xhtml_c07-fig-0013)).\nIf you’re\
    \ using a PC, open the picture in Paint. Click the Home tab in the menu bar and\
    \ choose Resize.\n\n10. **Change the height of the image to 100 pixels (see [Figure\
    \ 7-14](#10_9781119404170-ch07.xhtml_c07-fig-0014)).**\nOn a Mac, make sure the\
    \ Scale Proportionally button is checked so that the picture doesn’t get squashed.\n\
    On a PC, the button is Maintain Aspect Ratio instead of Scale Proportionally.\n\
    \n11. **Choose Processing  Preferences to find the Processing folder where your\
    \ projects are saved (see [Figure 7-15](#10_9781119404170-ch07.xhtml_c07-fig-0015)).**\n\
    At the top of the popup window, you should see the Sketchbook Location, which\
    \ is where your Processing folder is on your computer (see [Figure 7-16](#10_9781119404170-ch07.xhtml_c07-fig-0016)).\n\
    \n12. **Save your Sketch project, and name it FirstVideoGame.**\n\n13. **Open\
    \ the FirstVideoGame folder and move the image you downloaded into that folder\
    \ (see [Figure 7-17](#10_9781119404170-ch07.xhtml_c07-fig-0017)).**\n\n14. **Add\
    \ three lines of code to your program to add the character to the scene (see [Figure\
    \ 7-18](#10_9781119404170-ch07.xhtml_c07-fig-0018)).**\nFirst, add the variable\
    \ that will represent the character. This needs to be added to the top of your\
    \ program, outside of the `setup` method so that all methods can access it:\n\n\
    ```java\nPImage character;\n```\nAdd one line of code to load the image into the\
    \ program and one line of code to place the image right on top of the grass on\
    \ the very left of the screen:\n\n```java\ncharacter = loadImage(\"penguin.png\"\
    );\nimage(character, 0, 300);\n```\n\n15. **Click the Run button to test that\
    \ your character is loading in the right place.**\n\n![image](images/9781119404170-fg0707.png)\n\
    [FIGURE 7-7:](#10_9781119404170-ch07.xhtml_rc07-fig-0007) Search for cartoon images\
    \ on Google.\n\n![image](images/9781119404170-fg0708.png)\n[FIGURE 7-8:](#10_9781119404170-ch07.xhtml_rc07-fig-0008)\
    \ Look for images you can use and modify.\n\n![image](images/9781119404170-fg0709.png)\n\
    [FIGURE 7-9:](#10_9781119404170-ch07.xhtml_rc07-fig-0009) Choose a character.\n\
    \n![image](images/9781119404170-fg0710.png)\n[FIGURE 7-10:](#10_9781119404170-ch07.xhtml_rc07-fig-0010)\
    \ Download the image.\n\n![image](images/9781119404170-fg0711.png)\n[FIGURE 7-11:](#10_9781119404170-ch07.xhtml_rc07-fig-0011)\
    \ Choosing the image size.\n\n![image](images/9781119404170-fg0712.png)\n[FIGURE\
    \ 7-12:](#10_9781119404170-ch07.xhtml_rc07-fig-0012) You might need to fill out\
    \ a captcha.\n\n![image](images/9781119404170-fg0713.png)\n[FIGURE 7-13:](#10_9781119404170-ch07.xhtml_rc07-fig-0013)\
    \ Open the picture to adjust the size.\n\n![image](images/9781119404170-fg0714.png)\n\
    [FIGURE 7-14:](#10_9781119404170-ch07.xhtml_rc07-fig-0014) Adjust the size of\
    \ the picture to be 100 pixels tall and stay proportional on width.\n\n![image](images/9781119404170-fg0715.png)\n\
    [FIGURE 7-15:](#10_9781119404170-ch07.xhtml_rc07-fig-0015) Processing option.\n\
    \n![image](images/9781119404170-fg0716.png)\n[FIGURE 7-16:](#10_9781119404170-ch07.xhtml_rc07-fig-0016)\
    \ The location of your Processing folder.\n\n![image](images/9781119404170-fg0717.png)\n\
    [FIGURE 7-17:](#10_9781119404170-ch07.xhtml_rc07-fig-0017) Move the image to FirstVideoGame\
    \ folder.\n\n![image](images/9781119404170-fg0718.png)\n[FIGURE 7-18:](#10_9781119404170-ch07.xhtml_rc07-fig-0018)\
    \ Three lines of code to add the character to your scene.\n\nAwesome! Now you\
    \ have a character in your scene! In the next section, you’ll learn how to move\
    \ the character around the screen.\n\n## ADDING MOVEMENT TO YOUR VIDEAME\n\nNow\
    \ that you have a scene and a character, it’s time to make it so your character\
    \ can move around the scene. Follow these steps:\n\n1. Add two variables at the\
    \ top of your program for the character’s `x` and `y`-coordinates; initialize\
    \ them to `characterX = 0` and `characterY = 300` (see [Figure 7-19](#10_9781119404170-ch07.xhtml_c07-fig-0019)).\n\
    ```java\nint characterX = 0;\nint characterY = 300;\n```\n2. Replace the `0` and\
    \ `300` in the `image` method with `characterX` and `character` (see [Figure 7-20](#10_9781119404170-ch07.xhtml_c07-fig-0020)).\n\
    ```java\nimage(character, characterX, characterY);\n```\n3. Add an empty `keyPressed`\
    \ method (see [Figure 7-21](#10_9781119404170-ch07.xhtml_c07-fig-0021)).\n```java\n\
    void keyPressed() {\n}\n```\n4. Add a conditional statement to the `keyPressed`\
    \ method to see if either A or D was pressed (see [Figure 7-22](#10_9781119404170-ch07.xhtml_c07-fig-0022)).\n\
    ```java\nvoid keyPressed() {\n  if (key == 'a') {\n  } else if (key == 'd') {\n\
    \  }\n}\n```\n5. Add code to update the `characterX` variable to move left or\
    \ right depending on if the A or D key was pressed (see [Figure 7-23](#10_9781119404170-ch07.xhtml_c07-fig-0023)).\n\
    ```java\nvoid keyPressed() {\n  if (key == 'a') {\n    characterX = characterX\
    \ - 10;\n  } else if (key == 'd') {\n    characterX = characterX + 10;\n  }\n\
    }\n```\n6. Add a `draw` method with a call to the `image` method continuously\
    \ so that the character’s location gets updated each time the A or D key is pressed\
    \ (see [Figure 7-24](#10_9781119404170-ch07.xhtml_c07-fig-0024)).\n```java\nvoid\
    \ draw() {\n  image(character, characterX, characterY);\n}\n```\n7. Test your\
    \ code to make sure the character moves left and right when you press A and D\
    \ (see [Figure 7-25](#10_9781119404170-ch07.xhtml_c07-fig-0025)).\n\n![image](images/9781119404170-fg0719.png)\n\
    [FIGURE 7-19:](#10_9781119404170-ch07.xhtml_rc07-fig-0019) Two variables to keep\
    \ track of the character’s location.\n\n![image](images/9781119404170-fg0720.png)\n\
    [FIGURE 7-20:](#10_9781119404170-ch07.xhtml_rc07-fig-0020) Update the character’s\
    \ location using the variables from Step 1.\n\n![image](images/9781119404170-fg0721.png)\n\
    [FIGURE 7-21:](#10_9781119404170-ch07.xhtml_rc07-fig-0021) Add a `keyPressed`\
    \ method.\n\n![image](images/9781119404170-fg0722.png)\n[FIGURE 7-22:](#10_9781119404170-ch07.xhtml_rc07-fig-0022)\
    \ Conditional statement to check if A or D was pressed.\n\n![image](images/9781119404170-fg0723.png)\n\
    [FIGURE 7-23:](#10_9781119404170-ch07.xhtml_rc07-fig-0023) Use the variables from\
    \ Step 1 instead of hard-coded values.\n\n![image](images/9781119404170-fg0724.png)\n\
    [FIGURE 7-24:](#10_9781119404170-ch07.xhtml_rc07-fig-0024) Add a `draw` method\
    \ to always update the location of the character.\n\nWatch your character move\
    \ around your scene.\n"
