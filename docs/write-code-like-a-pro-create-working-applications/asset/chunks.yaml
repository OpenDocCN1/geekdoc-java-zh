    \ touches the lava (see** [**Figure 7-39**](#10_9781119404170-ch07.xhtml_c07-fig-0039)**):**\n\
    \n    **`//text(characterX, characterX + 60, characterY – 5);`**\n\n    `//Check\
    \ to see if the character hit the lava`\n\n    `if((characterX >= 150 && characterX\
    \ <= 310) || (characterX >= 450 && characterX <= 610))`\n\n    `{`\n\n    **`text(\"\
    OW!\", characterX + 60, characterY – 5);`**\n\n    `}`\n\n    Comment out the\
    \ code you added in Step 2 to so that it only says something when it touches the\
    \ lava.\n\n6.  **Add one final condition to your conditional statement to make\
    \ sure your character only says “OW!” if it’s touching the lava, not jumping above\
    \ it (see** [**Figure 7-40**](#10_9781119404170-ch07.xhtml_c07-fig-0040)**):**\n\
    \n    `//Check to see if the character hit the lava`\n\n    `if(`**`(`**`(characterX\
    \ >= 150 && characterX <= 310) || (characterX >= 450 && characterX <= 610)`**`)\
    \ && characterY >= 300`**`)`\n\n    `{`\n\n    `text(\"OW!\", characterX + 60,\
    \ characterY – 5);`\n\n    `}`\n\n![image](images/9781119404170-fg0735.png)\n\n\
    [FIGURE 7-35:](#10_9781119404170-ch07.xhtml_rc07-fig-0035) Make the `arc` methods\
    \ create lava pits instead of hills.\n\n![image](images/9781119404170-fg0736.png)\n\
    \n[FIGURE 7-36:](#10_9781119404170-ch07.xhtml_rc07-fig-0036) Use the `text` method\
    \ to gather information about the character.\n\n![image](images/9781119404170-fg0737.png)\n\
    \n[FIGURE 7-37:](#10_9781119404170-ch07.xhtml_rc07-fig-0037) Add a conditional\
    \ statement to test whether the character is touching the first lava.\n\n![image](images/9781119404170-fg0738.png)\n\
    \n[FIGURE 7-38:](#10_9781119404170-ch07.xhtml_rc07-fig-0038) Add to the conditional\
    \ statement to test whether the character is touching the second lava.\n\n![image](images/9781119404170-fg0739.png)\n\
    \n[FIGURE 7-39:](#10_9781119404170-ch07.xhtml_rc07-fig-0039) Add a call to the\
    \ text method to say “OW!” when touching lava.\n\n![image](images/9781119404170-fg0740.png)\n\
    \n[FIGURE 7-40:](#10_9781119404170-ch07.xhtml_rc07-fig-0040) Add an additional\
    \ condition to ensure that the character is on the ground on the lava, not in\
    \ the air above it.\n\nCongratulations! You’ve made a short game. In this game,\
    \ the goal is to avoid the lava pits so that your character doesn’t get hurt!\
    \ In the next chapter, you’ll add points and other characters to your game.\n\n\
    ![image](images/c8.png)\n\nThis chapter is exciting! Here, you’ll add new characters\
    \ to your game that aren’t controlled by a player, but instead are controlled\
    \ by your code! This is what artificial intelligence is, and it’s what this chapter\
    \ is all about.\n\n## ADDING AN ENEMY TO YOUR VIDEOGAME\n\nThe first step to creating\
    \ artificial intelligence is to get the enemy into your game.\n\n1.  **Open the\
    \ Processing application and open your FirstVideoGame Sketch that you made in**\
    \ [**Chapter 7**](#10_9781119404170-ch07.xhtml) **(see** [**Figure 8-1**](#11_9781119404170-ch08.xhtml_c08-fig-0001)**).**\n\
    \n2.  **Find another character online, download it, and save it to your FirstVideoGame\
    \ folder (see** [**Figure 8-2**](#11_9781119404170-ch08.xhtml_c08-fig-0002)**).**\n\
    \n    You can do this using the technique I introduced in [Chapter 7](#10_9781119404170-ch07.xhtml);\
    \ just turn to the “[Adding a Character to Your Videogame](#10_9781119404170-ch07.xhtml_c07-sec-0003)”\
    \ section.\n\n3.  **Add the code needed to create the enemy, place it in your\
    \ videogame, and control its *x* and *y* location (see** [**Figure 8-3**](#11_9781119404170-ch08.xhtml_c08-fig-0003)**).**\n\
    \n    First, add this code above your `setup` method:\n\n    `PImage enemy;`\n\
    \n    `int enemyX = 200;`\n\n    `int enemyY = 300;`\n\n    Then, add this code\
    \ at the bottom of your `setup` method:\n\n    `//Create the enemy`\n\n    `enemy\
    \ = loadImage(\"crab.png\");`\n\n    `image(enemy, enemyX, enemyY);`\n\n4.  **Add\
    \ a line of code to redraw the enemy every time the draw method is called (see**\
    \ [**Figure 8-4**](#11_9781119404170-ch08.xhtml_c08-fig-0004)**).**\n\n    This\
    \ code should be added at the bottom of your `draw` method:\n\n    `//Redraw the\
    \ enemy`\n\n    `image(enemy, enemyX, enemyY);`\n\n5.  **Test your code to make\
    \ sure your first enemy is where you want it to be (see** [**Figure 8-5**](#11_9781119404170-ch08.xhtml_c08-fig-0005)**).**\n\
    \n6.  **Adjust the start location of your enemy to be more realistic (see** [**Figure\
    \ 8-6**](#11_9781119404170-ch08.xhtml_c08-fig-0006)**).**\n\n    Change the code\
    \ from Step 3 that goes above the `setup` method to:\n\n    `PImage enemy;`\n\n\
    \    `int enemyX =` **`350`**`;`\n\n    `int enemyY =` **`325`**`;`\n\n![image](images/9781119404170-fg0801.png)\n\
    \n[FIGURE 8-1:](#11_9781119404170-ch08.xhtml_rc08-fig-0001) The Sketch program\
    \ from [Chapter 7](#10_9781119404170-ch07.xhtml).\n\n![image](images/9781119404170-fg0802.png)\n\
    \n[FIGURE 8-2:](#11_9781119404170-ch08.xhtml_rc08-fig-0002) Download an enemy\
    \ image into your FirstVideoGame folder.\n\n![image](images/9781119404170-fg0803.png)\n\
    \n[FIGURE 8-3:](#11_9781119404170-ch08.xhtml_rc08-fig-0003) The code needed to\
    \ create the enemy on the canvas.\n\n![image](images/9781119404170-fg0804.png)\n\
    \n[FIGURE 8-4:](#11_9781119404170-ch08.xhtml_rc08-fig-0004) The code needed to\
    \ redraw the enemy to allow it to move.\n\n![image](images/9781119404170-fg0805.png)\n\
    \n[FIGURE 8-5:](#11_9781119404170-ch08.xhtml_rc08-fig-0005) The enemy in your\
    \ videogame for the first time.\n\n![image](images/9781119404170-fg0806.png)\n\
    \n[FIGURE 8-6:](#11_9781119404170-ch08.xhtml_rc08-fig-0006) Modify the code to\
    \ place the enemy on the canvas correctly.\n\nGreat! Now you have a character\
    \ and an enemy in your videogame!\n\n## MAKING THE ENEMY MOVE\n\nThe next step\
    \ is to make the enemy move with code, instead of user input (like the keyboard\
    \ or mouse). To start with, the enemy is going to move between the two lava pits,\
    \ adding an extra layer of difficulty for the player. To do this, you’re going\
    \ to use a new variable to keep track of whether the enemy should be moving left\
    \ (–1) or right (+1).\n\n1.  **Create a new variable called** `enemyMovement`\
    \ **that is initialized to 1 (see** [**Figure 8-7**](#11_9781119404170-ch08.xhtml_c08-fig-0007)**).**\n\
    \n    Add this line of code above your `setup` method:\n\n    `int enemyMovement\
    \ = 1;`\n\n2.  **Add a conditional statement to update the** `enemyMovement` **variable\
    \ depending on which lava pit the enemy reaches (see** [**Figure 8-8**](#11_9781119404170-ch08.xhtml_c08-fig-0008)**).**\n\
    \n    If the enemy gets to the left lava pit (`enemyX = 350`), it should move\
    \ right (+1). If the enemy gets to the right lava pit (`enemyX = 450`), it should\
    \ move left (–1).\n\n    This code should be added to the bottom of your `draw`\
    \ method:\n\n    `//Move enemy`\n\n    `if(enemyX == 350)`\n\n    `{`\n\n    `enemyMovement\
    \ = 1;`\n\n    `}`\n\n    `else if(enemyX == 450)`\n\n    `{`\n\n    `enemyMovement\
    \ = -1;`\n\n    `}`\n\n3.  **Update the enemy’s** `enemyX` **by either 1 or –1\
    \ depending on Step 2 (see** [**Figure 8-9**](#11_9781119404170-ch08.xhtml_c08-fig-0009)**).**\n\
    \n    This code should be added to the bottom of your `draw` method:\n\n    `enemyX\
    \ = enemyX + enemyMovement;`\n\n4.  **Test your code by pressing the Run button\
    \ to make sure the enemy moves back and forth between the two lava pits (see**\
    \ [**Figure 8-10**](#11_9781119404170-ch08.xhtml_c08-fig-0010)**).**\n\n![image](images/9781119404170-fg0807.png)\n\
    \n[FIGURE 8-7:](#11_9781119404170-ch08.xhtml_rc08-fig-0007) The `enemyMovement`\
    \ variable to set the direction of the enemy.\n\n![image](images/9781119404170-fg0808.png)\n\
    \n[FIGURE 8-8:](#11_9781119404170-ch08.xhtml_rc08-fig-0008) The conditional to\
    \ switch directions of the enemy.\n\n![image](images/9781119404170-fg0809.png)\n\
    \n[FIGURE 8-9:](#11_9781119404170-ch08.xhtml_rc08-fig-0009) The code to make your\
    \ enemy move left or right, depending on the conditional statement in Step 4.\n\
    \n![image](images/9781119404170-fg0810.png)\n\n[FIGURE 8-10:](#11_9781119404170-ch08.xhtml_rc08-fig-0010)\
    \ The enemy moving between the two lava pits."
