    \ method in the main class.\n\nWow! What you’ve done so far is incredible! There\
    \ is just a bit more to code in this chapter: making the pipes move across the\
    \ screen!\n\n### CONVERTING PIPES COMMENTS TO CODE\n\nThe last part to this chapter\
    \ is making pipes move from the right side of the canvas to the left side of the\
    \ canvas. In this section, you won’t be guided line by line; instead, you’ll be\
    \ shown large chunks of code to write at once. A lot of what you’ll be coding\
