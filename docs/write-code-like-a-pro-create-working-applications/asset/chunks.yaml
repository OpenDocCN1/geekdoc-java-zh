  trans: "\n\n```java\nclass Character\n{\n  PImage character;\n  int characterX;\n\
    \  int characterY;\n  Character(int x, int y)\n  {\n    characterX = x;\n    characterY\
    \ = y;\n    character = loadImage(\"penguin.png\");\n    image(character, characterX,\
    \ characterY);\n  }\n}\n```\n\n### 3. **在 `setup` 方法中调用 `Character` 构造函数（参见图 8-25）。**\n\
    \n首先，在你的 Sketch 文件顶部添加这行代码：\n`Character character;`\n\n然后，在你的 `setup` 方法中间添加这段代码：\n\
    \n```java\nvoid setup()\n{\n  //画布\n  size(1000, 500);\n  //绘制天空、草地和山丘\n  drawScene();\n\
    \  //创建角色\n  character = new Character(0, 300);\n  //创建敌人\n  enemy1 = new Enemy(350,\
    \ 325);\n  enemy2 = new Enemy(650, 325);\n}\n```\n\n### 4. **在 `Character` 类中创建一个\
    \ `move` 方法，并将所有的角色移动代码从 `draw` 方法移动到新的 `move` 方法中（参见图 8-26）。**\n\n```java\nvoid\
    \ move()\n{\n  if(characterY < 300)\n  {\n    characterY = characterY + 1;\n \
    \ }\n  //重绘角色\n  image(character, characterX, characterY);\n  //text(characterX,\
    \ characterX + 60, characterY – 5);\n  //检查角色是否触碰到了岩岩\n  if(((characterX >= 150\
    \ && characterX <= 310)\n  || (characterX >= 450 && characterX <= 610))\n  &&\
    \ characterY >= 300)\n  {\n    text(\"OW!\", characterX + 60, characterY – 5);\n\
    \  }\n}\n```\n\n### 5. **在 `draw` 方法中调用 `move` 方法（参见图 8-27）。**\n\n这段代码应该写在你之前在本章稍早时候调用敌人\
    \ `move` 方法的地方上方：\n```java\n//重绘角色\ncharacter.move();\n```\n\n### 6. **在 `Character`\
    \ 类中创建一个 `keyPressed` 方法，并将原始 `keyPresssed` 方法中的所有代码移动到新方法中（参见图 8-28）。**\n\n在\
    \ `Character` 类内部：\n\n```java\nvoid keyPressed()\n{\n  if(key == 'a')\n  {\n \
    \   characterX = characterX – 10;\n  }\n  else if(key == 'd')\n  {\n    characterX\
    \ = characterX + 10;\n  }\n  else if(key == ' ')\n  {\n    characterY = characterY\
    \ – 100;\n  }\n}\n```\n\n### 7. **在原始 `keyPressed` 方法中调用新的 `keyPressed` 方法（参见图\
    \ 8-29）。**\n\n这段代码应该在主 sketch 的 `keyPressed` 方法中输入：\n\n```java\nvoid keyPressed()\n\
    {\n  character.keyPressed();\n}\n```\n\n### 8. **测试以确保你的角色在按下 A 或 D 时仍然移动，按下空格键时仍然跳跃，在地面上方时仍然下落，并且在触碰岩岩时仍然说“OW!”。**\n\
    \n![image](img/9781119404170-fg0823.png)\n\n图 8-23: 一个新的 `Character` 类。\n\n![image](img/9781119404170-fg0824.png)\n\
    \n图 8-24: 创建一个构造函数来创建角色。\n\n![image](img/9781119404170-fg0825.png)\n\n图 8-25:\
    \ 在 `setup` 方法中创建角色。\n\n![image](img/9781119404170-fg0826.png)\n\n图 8-26: `Character`\
    \ 类中新的 `move` 方法。\n\n![image](img/9781119404170-fg0827.png)\n\n图 8-27: 调用新的 `move`\
    \ 方法。\n\n![image](img/9781119404170-fg0828.png)\n\n图 8-28: 新 `Character` 类中的 `keyPressed`\
    \ 方法。\n\n![image](img/9781119404170-fg0829.png)\n\n图 8-29: 从原始 `keyPressed` 调用\
    \ `Character` `keyPressed`。\n\n## 为角色添加生命值\n\n现在你有一个可以运行的游戏，唯一要做的是添加一个跟踪生命值的变量。这会让玩家想要避开岩岩。遵循以下步骤：\n\
    \n1. 在 `Character` 类顶部添加一个 `health` 变量，其值为 100（参见图 8-30）。\n\n2. 创建一个名为 `updateHealth`\
    \ 方法，它不接受参数并将生命值减少 1（参见图 8-31）。\n\n```java\nvoid updateHealth()\n{\n  health =\
    \ health - 1;\n}\n```\n\n3. 在 `move` 方法中添加一行代码，每当角色触碰岩岩时调用 `updateHealth`（参见图\
    \ 8-32）。\n\n```java\nupdateHealth();\n```\n\n4. 创建一个名为 `getHealth` 方法，返回整数类型的生命值（参见图\
    \ 8-33）。\n\n```java\nint getHealth()\n{\n  return health;\n}\n```\n\n5. 确保在 `setup`\
    \ 方法最后调用 `drawScene` 方法（参见图 8-34）。这是因为你需要先创建角色才能访问该变量。\n\n6. 在画布上添加大小为 32 的文本来显示角色的生命值（参见图\
    \ 8-35）。这段代码应该写在 `drawScene` 方法的底部：\n\n```java\ntextSize(32);\ntext(character.getHealth(),\
    \ 900, 50);\n```\n\n"
- fmt: "\n1. Create a new method in your `Enemy` class called `collidedWith` that\
    \ returns a `Boolean` (true or false) and has four integer parameters (`x`, `y`,\
    \ `x2`, and `y2`), as shown in [Figure 8-36](#11_9781119404170-ch08.xhtml_c08-fig-0036).\n\
    \nThese four parameters will eventually have the values of the character’s location.\n\
    \nYou can add this code underneath your `Enemy` constructor:\n\n```java\nboolean\
    \ collidedWith(int x, int y, int x2, int y2)\n{\n    return false;\n}\n```\n\n\
    2. Add a conditional statement to see if the location of the enemy is anywhere\
    \ within the square of the character (see [Figure 8-37](#11_9781119404170-ch08.xhtml_c08-fig-0037)).\n\
    \n```java\nboolean collidedWith(int x, int y, int x2, int y2)\n{\n    if(enemyX\
    \ >= x && enemyX <= x2 && enemyY >= y && enemyY <= y2)\n    {\n        return\
    \ true;\n    }\n    return false;\n}\n```\n\n3. Add four methods to your `Character`\
    \ class to return the `x` and `y` coordinates of the start of the character and\
    \ the `x` and `y` coordinates of the end of the character (see [Figure 8-38](#11_9781119404170-ch08.xhtml_c08-fig-0038)).\n\
    \nAdd these methods underneath the `Character` constructor:\n\n```java\nint getX()\n\
    {\n    return characterX - (character.width/2);\n}\n\nint getY()\n{\n    return\
    \ characterY;\n}\n\nint getX2()\n{\n    return characterX + (character.width/2);\n\
    }\n\nint getY2()\n{\n    return characterY + character.height;\n}\n```\n\n4. Add\
    \ a conditional to the `draw` method to check to see if either enemy is colliding\
    \ with the character; if it is, call the `updateHealth` method (see [Figure 8-39](#11_9781119404170-ch08.xhtml_c08-fig-0039)).\n\
    \nAdd this conditional to the bottom of the `draw` method:\n\n```java\nif(enemy1.collidedWith(character.getX(),\
    \ character.getY(), character.getX2(), character.getY2()))\n{\n    character.updateHealth();\n\
    }\nelse if(enemy2.collidedWith(character.getX(), character.getY(), character.getX2(),\
    \ character.getY2()))\n{\n    character.updateHealth();\n}\n```\n\n5. Test your\
    \ code to make sure it works. When your character touches lava or an enemy, it\
    \ should start to lose health (see [Figure 8-40](#11_9781119404170-ch08.xhtml_c08-fig-0040)).\n\
    \n![image](images/9781119404170-fg0836.png)\n\n[FIGURE 8-36:](#11_9781119404170-ch08.xhtml_rc08-fig-0036)\
    \ The new `collidedWith` method.\n\n![image](images/9781119404170-fg0837.png)\n\
    \n[FIGURE 8-37:](#11_9781119404170-ch08.xhtml_rc08-fig-0037) A conditional to\
    \ check to see if the enemy is within the bounds of the character.\n\n![image](images/9781119404170-fg0838.png)\n\
    \n[FIGURE 8-38:](#11_9781119404170-ch08.xhtml_rc08-fig-0038) The four methods\
    \ to determine the bounds of the character.\n\n![image](images/9781119404170-fg0839.png)\n\
    \n[FIGURE 8-39:](#11_9781119404170-ch08.xhtml_c08-fig-0039) The conditional statement\
    \ that will update the health if the character collides with either enemy.\n\n\
    ![image](images/9781119404170-fg0840.png)\n\n[FIGURE 8-40:](#11_9781119404170-ch08.xhtml_rc08-fig-0040)\
    \ The final game in action. You’ve just made a game! The goal of the game is to\
    \ try to get the character to the edge before losing all health! In the next chapter,\
    \ you’ll build a game that is very similar to this. Don’t forget: You can always\
    \ refer back to earlier chapters to get help if you get stuck.\n\n![image](images/c9.png)\n\
    \nBefore you get started, you’re going to play Flappy Bird online to get an idea\
    \ of what you need to do in re-create your own version of this game, called Ninja.\n\
    \n1. Open a web browser and go to `http://flappybird.io`.\n\nAs the page loads,\
    \ you may see an ad (see [Figure 9-1](#11_9781119404170-ch09.xhtml_c09-fig-0001)).\
    \ Wait until you can click the Skip button, and press Skip.\n\n2. You should see\
    \ a Flappy Bird game playing in your browser (see [Figure 9-2](#11_9781119404170-ch09.xhtml_c09-fig-0002)).\n\
    \n3. Click the Flappy Bird to start the game.\n\nAs you play, you’ll have to keep\
    \ clicking your mouse to keep the bird up. Notice the menu that pops up when you\
    \ hit a pipe (see [Figure 9-3](#11_9781119404170-ch09.xhtml_c09-fig-0003)).\n\n\
    4. Play the game a few times to get a feeling for everything works.\n\nTo keep\
    \ playing, you can click the Restart button.\n\n5. Notice that when you play,\
    \ the game keeps track of your current score and your highest score (see [Figure\
    \ 9-4](#11_9781119404170-ch09.xhtml_c09-fig-0004)).\n\n![image](images/9781119404170-fg0901.png)\n\
    \n[FIGURE 9-1:](#11_9781119404170-ch09.xhtml_rc09-fig-0001) An example of an ad\
    \ you may see before playing Flappy Bird.\n\n![image](images/9781119404170-fg0902.png)\n\
    \n[FIGURE 9-2:](#11_9781119404170-ch09.xhtml_rc09-fig-0002) An in-browser Flappy\
    \ Bird game.\n\n![image](images/9781119404170-fg0903.png)\n\n[FIGURE 9-3:](#11_9781119404170-ch09.xhtml_rc09-fig-0003)\
    \ The menu that appears when you lose the first time.\n\n![image](images/9781119404170-fg0904.png)\n\
    \n[FIGURE 9-4:](#11_9781119404170-ch09.xhtml_rc09-fig-0004) This game keeps track\
    \ of your highest and most recent scores.\n\n## MAKING SENSE OF THE FLAPPY BIRD\
    \ CODE\n\nWhen you have been writing code for a long time, you’ll be able to start\
    \ using new technology and guessing what kind of code had to be written to make\
    \ that software work. Even though you’re just starting out, you’re going to practice\
    \ doing that in this book right now.\n\n### THE START SCREEN\n\nThe first thing\
    \ to notice about the Flappy Bird game that you’re playing is the start screen\
    \ (see [Figure 9-5](#11_9781119404170-ch09.xhtml_c09-fig-0005)). There are three\
    \ parts to it:\n\n*   **The background:** The background has a blue background,\
    \ an image of clouds, buildings, and trees; a brown ground; and a green grass\
    \ that seems to be moving.\n*   **The bird:** The next part is the bird itself.\
    \ The bird is a simple little image, but it has an animation that makes it look\
    \ like it’s flapping its wings. The bird also is bouncing up and down.\n*   **The\
    \ score:** The last part is a big white number with a black outline that represents\
    \ the score.\n\n![image](images/9781119404170-fg0905.png)\n\n[FIGURE 9-5:](#11_9781119404170-ch09.xhtml_rc09-fig-0005)\
    \ The Flappy Bird start screen.\n\nFrom the work that you’ve done so far in this\
    \ book, creating all that should be pretty simple. What’s complicated is making\
    \ the grass look like it’s moving and making the bird’s wing flap. Those are pieces\
    \ of code that you’ll have to research how to make happen. In the first versions\
    \ of your game, they won’t move.\n\n### THE GAMEPLAY SCREEN\n\nWhen you start\
    \ to play the game, the interface changes slightly, and there are four parts to\
    \ pay attention to (see [Figure 9-6](#11_9781119404170-ch09.xhtml_c09-fig-0006)):\n\
    \n*   **The background:** The background is the same as the start screen.\n* \
    \  **The bird:** The bird looks the same, but now it falls unless the player clicks\
    \ it. When the player clicks the bird, it moves up. If the bird hits a pipe, it\
    \ automatically falls to the ground, face first.\n*   **The score:** The score\
    \ is the same style as the start screen, but updates by 1 each time the bird successfully\
    \ gets through a set of pipes.\n*   **The pipes:** There are at most four pipes\
    \ on the screen at a time. Two of them are coming from the bottom of the screen\
    \ going up and two of them are directly above those bottom pipes, coming from\
    \ the top of the screen going down. Whenever a new set of pipes appears on the\
    \ right side of the screen, the opening between them is in a different position\
    \ on the vertical axis. The opening between the pipes seems to always be the same\
    \ number of pixels.\n\n![image](images/9781119404170-fg0906.png)\n\n[FIGURE 9-6:](#11_9781119404170-ch09.xhtml_rc09-fig-0006)\
    \ The Flappy Bird game during gameplay.\n"
