    \ code to create the comments and empty method signatures for the code you’ll\
    \ need for your main class. (See [Figure 9-8](#12_9781119404170-ch09.xhtml_c09-fig-0008)\
    \ as a reference for where the code is in your file.)\n\n```\n//Two variables\
    \ that keep track of current and best\n//score\n//Variable that keeps track of\
    \ the state of the game\n//Method to set up the background\nvoid setup()\n{\n\
    }\n//Method to constantly draw the bird, pipes, and\n//score and to show the buttons\
    \ when it's time\nvoid draw()\n{\n}\n```\n\n![image](images/9781119404170-fg0908.png)\n\
    \n[FIGURE 9-8:](#12_9781119404170-ch09.xhtml_rc09-fig-0008) The setup of your\
    \ main class.\n\n## BIRD CLASS\n\nThe next class to build is the `Bird` class.\
    \ To make it easier to keep track of all your code, you’re going to write the\
    \ class in a separate file within your program. Follow these steps:\n\n1.  Click\
    \ the down arrow next to the `NinjaBird` tab and choose `New Tab` (see [Figure\
    \ 9-9](#12_9781119404170-ch09.xhtml_rc09-fig-0009)).\n2.  Name the new file `Bird`\
