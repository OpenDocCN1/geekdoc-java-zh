- fmt: "\nEach canvas that you create is created by a lot of pixels. For example,\
    \ with the first bit of code that you wrote in the preceding section, you created\
    \ a canvas that contained 250,000 pixels! There are 500 rows of pixels, and in\
    \ each row, there are 500 pixels.\n\nEach pixel that is on the canvas has a location\
    \ and a color. The location of the pixel is specified by the `x` and `y` location\
    \ of the pixel. You can change the color of individual pixels by using the method\
    \ `set`. Follow these steps:\n\n1. Make sure your code is creating a canvas that\
    \ is 500 by 500 pixels, as shown in [Figure 2-5](#05_9781119404170-ch02.xhtml_c02-fig-0005)::\n\
    \   ```\n   size(500, 500);\n   ```\n\n2. Add a second line of code that creates\
    \ a new color variable (see [Figure 2-6](#05_9781119404170-ch02.xhtml_c02-fig-0006)):\n\
    \   ```\n   color black = color(0);\n   ```\n\n3. Add a third line of code that\
    \ changes the color of the centermost pixel to the color that you just created\
    \ in Step 2 (see [Figure 2-7](#05_9781119404170-ch02.xhtml_c02-fig-0007)):\n \
    \  ```\n   set(250, 250, black);\n   ```\n\n4. Click the **Run** button.\n   Notice\
    \ that the center pixel is now black (see [Figure 2-8](#05_9781119404170-ch02.xhtml_c02-fig-0008)).\n\
    \n5. Try changing the number in Step 2 to be any number between 0 and 255 and\
    \ click the Run button again to see that center button change to different colors.\n\
    \   You can also add more lines like you did in Step 3, to change other pixels\
    \ in your canvas to other colors. For example, here’s how to make a line that\
    \ has every other pixel black or white (see [Figure 2-9](#05_9781119404170-ch02.xhtml_c02-fig-0009)):\n\
    \   ```\n   size(500, 500);\n   color black = color(0);\n   color white = color(255);\n\
    \   set(240, 250, black);\n   set(241, 250, white);\n   set(242, 250, black);\n\
    \   set(243, 250, white);\n   set(244, 250, black);\n   set(245, 250, white);\n\
    \   set(246, 250, black);\n   set(247, 250, white);\n   set(248, 250, black);\n\
    \   set(249, 250, white);\n   set(250, 250, black);\n   set(251, 250, white);\n\
    \   set(252, 250, black);\n   set(253, 250, white);\n   set(254, 250, black);\n\
    \   set(255, 250, white);\n   set(256, 250, black);\n   set(257, 250, white);\n\
    \   set(258, 250, black);\n   set(259, 250, white);\n   ```\n\n   And here’s how\
    \ to make a line that has 10 pixels black and then 10 pixels white (see [Figure\
    \ 2-10](#05_9781119404170-ch02.xhtml_c02-fig-0010)):\n   ```\n   size(500, 500);\n\
    \   color black = color(0);\n   color white = color(255);\n   set(240, 250, black);\n\
    \   set(241, 250, black);\n   set(242, 250, black);\n   set(243, 250, black);\n\
    \   set(244, 250, black);\n   set(245, 250, black);\n   set(246, 250, black);\n\
    \   set(247, 250, black);\n   set(248, 250, black);\n   set(249, 250, black);\n\
    \   set(250, 250, white);\n   set(251, 250, white);\n   set(252, 250, white);\n\
    \   set(253, 250, white);\n   set(254, 250, white);\n   set(255, 250, white);\n\
    \   set(256, 250, white);\n   set(257, 250, white);\n   set(258, 250, white);\n\
    \   set(259, 250, white);\n   ```\n\n![image](images/9781119404170-fg0205.png)\n\
    [FIGURE 2-5:](#05_9781119404170-ch02.xhtml_rc02-fig-0005) The code needed to create\
    \ a 500-x-500-pixel canvas.\n\n![image](images/9781119404170-fg0206.png)\n[FIGURE\
    \ 2-6:](#05_9781119404170-ch02.xhtml_rc02-fig-0006) The code needed to create\
    \ the color black.\n\n![image](images/9781119404170-fg0207.png)\n[FIGURE 2-7:](#05_9781119404170-ch02.xhtml_rc02-fig-0007)\
    \ The code needed to change a particular pixel.\n\n![image](images/9781119404170-fg0208.png)\n\
    [FIGURE 2-8:](#05_9781119404170-ch02.xhtml_rc02-fig-0008) A 500-x-500-pixel canvas\
    \ with a single black pixel in the center.\n\n![image](images/9781119404170-fg0209.png)\n\
    [FIGURE 2-9:](#05_9781119404170-ch02.xhtml_rc02-fig-0009) The code and output\
    \ of making a black-and-white line of pixels.\n\n![image](images/9781119404170-fg0210.png)\n\
    [FIGURE 2-10:](#05_9781119404170-ch02.xhtml_rc02-fig-0010) The code and output\
    \ of making another black-and-white line.\n\nIn [Chapter 4](#07_9781119404170-ch04.xhtml),\
    \ you’ll learn a lot more about colors, but this is a general introduction to\
    \ pixels and their attributes: location and color.\n\n![image](images/9781119404170-fg0211.png)\n\
    [FIGURE 2-11:](#05_9781119404170-ch02.xhtml_rc02-fig-0011) A guideline of where\
    \ the locations are.\n\nCongratulations! You’ve now learned a bit about pixels,\
    \ location, color, and how to call methods in Java! In the next section, you’ll\
    \ get an overview of the methods you’ve used so far and find out how calling methods\
    \ works.\n\n![image](images/9781119404170-fg0212.png)\n[FIGURE 2-12:](#05_9781119404170-ch02.xhtml_rc02-fig-0012)\
    \ Be sure to name files before saving.\n\n## CALLING METHODS IN JAVA\n\nYou’ve\
    \ already called quite a few methods in the code that you wrote for this chapter,\
    \ but it’s important to understand what you’re writing when you’re writing code.\
    \ In the methods you’ve called so far, there are two parts: method name and parameters:\n\
    \n`methodName(Parameters)`\n\nAfter the method name, there is always open and\
    \ closed parentheses. In all the examples you’ve used so far, there are parameters\
    \ in the middle, but sometimes there are none. For example, there is a method\
    \ you haven’t used yet that doesn’t have any parameters:\n\n`exit()`\n\nYou can\
    \ try to add this line of code to the very last line in your program. When you\
    \ click Run, you should see the canvas appear and then immediately close. That’s\
    \ because the `exit` method closes the canvas.\n\nIf a method does have parameters,\
    \ then the parameters need to be in the correct order and they need to be the\
    \ correct type. For example, the `size` method requires two parameters (or numbers);\
    \ the first number must be the width of the canvas while the second number is\
    \ the height of the canvas:\n\n`size(width, height)`\n\nYou can test out putting\
    \ fewer or more parameters and changing the type, and you’ll notice that you get\
    \ an error. For example, say you had the following as your first:\n\n`size(\"\
    abc\")`\n\nYou would get an error message explaining that the method `size` requires\
    \ two integer parameters (see [Figure 2-13](#05_9781119404170-ch02.xhtml_c02-fig-0013)).\n\
    \n![image](images/9781119404170-fg0213.png)\n[FIGURE 2-13:](#05_9781119404170-ch02.xhtml_rc02-fig-0013)\
    \ An example of an error message you could get in Processing.\n\nBetween each\
    \ parameter, you have to put a comma.\n\nFinally, every method call ends in a\
    \ semicolon. This tells Processing that you’re done with that line of code.\n\n\
    In [Chapter 2](#05_9781119404170-ch02.xhtml), you’ve already called four different\
    \ methods:\n\n`size(width, height)`\n`color(colorCode)`\n`set(x, y, color)`\n\
    `exit()`\n\nIt’s important that the first method you call is the `size` method,\
    \ so that your canvas is created at the right size. After that, you can call the\
    \ `color` and `set` methods as many times as you want! And if you call the `exit`\
    \ method last, then everything will happen before the canvas closes.## CREATING\
    \ VARIABLES\n\nVariables are basically names that you give to values that you\
    \ want to reuse over and over. In this chapter, you created two variables: `black`\
    \ and `white`.\n\nJust like calling a method, when you create a variable there\
    \ is a format:\n\n`type variableName = value;`\n\nIn this chapter, the type that\
    \ we used was `color`. Some other simple types that you might encounter in this\
    \ book are:\n\n* `int`: Integer/number\n* `boolean`: True or false\n* `char`:\
    \ A single character like `a` or `b`\n* `color`: The color of a pixel\n\nThe usefulness\
    \ of variables is that you can name a value, like `color(0)`, and then use that\
    \ value by just using the name. As an example, here is the same code — the first\
    \ uses a variable and the second doesn’t:\n\n```\ncolor black = color(0);\nset(240,\
    \ 250, black);\nset(241, 250, black);\nset(242, 250, black);\n```\n\n```\nset(240,\
    \ 250, color(0));\nset(241, 250, color(0));\nset(242, 250, color(0));\n```\n"
