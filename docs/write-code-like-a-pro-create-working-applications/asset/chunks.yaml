    `SARAH GUTHALS` received her PhD from UCSD in Computer Science specializing in
    CS Education in 2014\. During graduate school, she built the beta version of CodeSpells,
    a 3D immersive videogame designed to teach children to code through playing a
    wizard and writing “spells.” She went on to co-found ThoughtSTEM, a company that
    builds software (such as LearnToMod), curriculum, and pedagogies for teaching
    children to code and empowering K–12 teachers to teach their students. She has
    written four books around Minecraft and one on mobile development, launched a
    Coursera and EdX course for teachers interested in teaching coding, was recently
    named Forbes 30 under 30 in Science, and founded We Can, a company dedicated to
    encouraging all kids to do anything. Her passion is making coding accessible to
    everyone, with the goal of making it a basic literacy. Sarah currently teaches
    at UCSD.


    ## DEDICATION


    I would like to dedicate this book to my close friends and family members who
    have supported me, not only in writing this book, but in becoming who I am today.
    I’d like to specifically dedicate this book to Adrian Guthals, who has always
    helped me to see that, with passion and dedication, I can really do anything I
    want.


    ## AUTHOR’S ACKNOWLEDGMENTS


    I would like to acknowledge all of the hard work that went into making Processing
    — without these amazing engineers, making videogames would be so much harder.
    I would also like to acknowledge the teachers and parents around the world who
    have recognized the importance of coding in learning so many valuable lessons
    to our next generation of makers.


    ## PUBLISHER’S ACKNOWLEDGMENTS


    - **EXECUTIVE EDITOR:** Steven Hayes

