  trans: "\n你已经在这本书中完成了大量的编码工作以来实现这一切。可能比较困难的部分是，让每当有一组新管道从屏幕右侧出现时，管道之间的开口处每次都出现在随机的位置。\n\
    \n# 结束界面\n\n当你游戏失败时，界面会发生最后一次变化。在这种情况下，有三个部分需要注意（请参见图 9-7）：\n\n*   **背景：** 背景与游戏屏幕完全相同。唯一的区别是现在草地不再移动了。\n\
    *   **鸟和管道：** 鸟和管道保持在游戏屏幕结束时的完全相同的位置。它们不再移动。\n*   **分数：** 分数现在被一个方框围着，里面显示了刚刚玩的游戏的分数以及所有玩过的游戏最高分。\n\
    *   **按钮：** 在这个版本中，有三个按钮：重启（Restart）、分享（Share）和添加到排行榜（Add to Leaderboard）。\n\n\
    ![image](img/9781119404170-fg0907.png)\n\nFIGURE 9-7: 游戏失败时显示的结束界面。\n\n由于你的游戏不在互联网上，而是在你的电脑上，你可以忽略“分享”和“添加到排行榜”按钮。你需要设解决的是“重启”按钮。按下此按钮时，它会将管道移回起点，将鸟送回天空，让按钮消失，让草地重新移动，并重置分数显示。\n\
    \n# 规划你的忍者鸟\n\n现在你已经有机会玩过一个版本的 Flappy Bird 并尝试破译代码中发生了什么，现在是时候规划你如何让你的忍者鸟工作工作了。\n\
    \n*   **背景：** 这部分应该是简单的，因为你已经在本书前面的部分在画布上创建了形状和图像。这里棘手的部分是草地移动，但这是可选的。\n*   **鸟：**\
    \ 你的鸟需要一直处于下降状态，除非用户执行某些操作，例如点击鼠标或键盘上的某个键。鸟需要一张图像（可能是一只鸟），这样它就不只是一个点。可选的是，鸟的翅膀应该是移动的。\n\
    *   **管道：** 这是一个有趣的点。尽管当你玩的时候，鸟看起来是正在穿过无限数量的管道，但如果你玩得足够久，你会注意到屏幕上同时只有两组管道。实际上发生的情况是，两组管道从屏幕右侧移动到屏幕左侧。当它们到达左侧时，它们会变得不可见，移回右侧并再次变得可见！这是一个让游戏看起来像有无限物品，而实际上只有几个的巧妙方法！这里的诀窍在于，你必须弄清楚如何确保管道之间的间隙在每次回到右侧时都处于一个随机的位置。\n\
    *   **分数：** 就像你之前玩过的 Flappy Bird 游戏一样，你应该有一个分数变量，用来记录鸟成功飞过了多少根管道。你还应该有第二个变量，记录鸟成功飞过的管道最大数量。游戏时时应该显示当前分数，一旦玩家失败，两个分数都应该显示出来。\n\
    *   **按钮：** 对于你的忍者鸟游戏，你应该有一个重启游戏的按钮。当游戏重启时，你必须改变鸟（位置）、管道（位置）以及两个分数变量（将当前分数重置为\
    \ 0，如果当前分数高于最高分，则应更新最高分）。\n\n# 设计你的 Java 类\n\n现在你已经对游戏将如何进行有了了解，是时候规划你的 Java 类了，这样你就知道需要编写哪些变量和方法。在这一节中，你将向一个新的\
    \ Sketch 文件中添加注释，以概述你想要编写的代码。这种策略是软件工程师在编写复杂程序有时会使用的策略。通过先添加注释，你可以确保在编写代码时不会忘记任何内容。它也有助于调试（找到你代码中的错误），因为你可以将你想要执行的（注释）与你实际执行的（代码）进行比较。\n\
    \n打开 Processing 并创建一个新的 Sketch 文件。立即保存该文件并将其命名为 `NinjaBird`。\n\n## 主类 (MAIN CLASS)\n\
    \n虽然你不需要像创建其他类时那样添加 `class` 单词，但你的第一个类是你开始时所使用的那个 Sketch 文件，它包含了 `setup` 和 `draw`\
    \ 方法。\n\n在这个类中，你将希望：\n\n*   同时对两个分数变量的跟踪。\n*   绘制背景。\n*   在需要的时候显示按钮。\n*   跟踪游戏状态（开始、进行中、结束）。\n\
    \n在你空的 Sketch 文件中，输入以下代码，为你为主类所需的代码创建注释和空方法签名。（参见图 9-8）\n\n```\n// 同时对两个分数变量的跟踪\n\
    // 绘制背景\n// 在需要的时候显示按钮\n// 跟踪游戏状态\nvoid setup()\n{\n}\n\nvoid draw()\n{\n}\n```\n\
    \n![image](img/9781119404170-fg0908.png)\n\nFIGURE 9-8: 主类。\n\n## 鸟类 (BIRD CLASS)\n\
    \n下一个要构建的类是 `Bird` 类。为了方便跟踪你的代码，你将在单独文件中编写该类。遵循以下步骤：\n\n1.  点击 `NinjaBird` 标签旁边的箭头，选择\
    \ `New Tab`（新标签页）。\n2.  将该文件命名为 `Bird`（大写 B）。\n3.  你现在应该看到一个名为 `Bird` 的空标签。\n\n\
    ```\nclass Bird\n{\n  // 鸟的图像\n  // 鸟的位置两个变量\n  // 创建鸟的构造函数\n  Bird()\n  {\n \
    \ }\n\n  // 鸟的方法\n  void move()\n  {\n  }\n\n  // 当鼠标被点击时调用的方法\n  void mouseClicked()\n\
    \  {\n  }\n\n  // 鸟撞地时的结束序列\n  void endSequence()\n  {\n  }\n}\n```\n\n![image](img/9781119404170-fg0909.png)\n\
    \nFIGURE 9-9: 创建新标签。\n\n## 管道类 (PIPE CLASS)\n\n下一个要构建的类是 `Pipe` 类。为了方便跟踪你的代码，你将在单独文件中编写该类。遵循以下步骤：\n\
    \n1.  点击 `NinjaBird` 标签旁边的箭头，选择 `New Tab`（新标签页）。\n2.  将该文件命名为 `Pipe`（大写 P）。\n\
    3.  你现在应该看到一个名为 `Pipe` 的空标签。\n\n```\nclass Pipe\n{\n  // 管道的图像\n  // 管道的位置两个变量\n\
    \  // 创建管道的构造函数\n  Pipe()\n  {\n  }\n\n  // 移动管道的方法\n  void move()\n  {\n  }\n\
    \n  // 将管道重置位置的方法\n  void reset()\n  {\n  }\n}\n```\n\n![image](img/9781119404170-fg0910.png)\n\
    \nFIGURE 9-10: 命名文件为 Pipe。\n\n## 按钮类 (BUTTON CLASS)\n\n下一个要构建的类是 `Button` 类。为了方便跟踪你的代码，你将在单独文件中编写该类。遵循以下步骤：\n\
    \n1.  点击 `NinjaBird` 标签旁边的箭头，选择 `New Tab`（新标签页）。\n2.  将该文件命名为 `Button`（大写 B）。\n\
    3.  你现在应该看到一个名为 `Button` 的空标签。\n\n```\nclass Button\n{\n  // 按钮的图像\n  // 按钮的位置变量\n\
    \  // 创建按钮的构造函数\n  Button()\n  {\n  }\n\n  // 显示按钮的方法\n  void display()\n  {\n\
    \  }\n\n  // 点击按钮的方法\n  void click()\n  {\n  }\n}\n```\n\n![image](img/9781119404170-fg0911.png)\n\
    \nFIGURE 9-11: 命名文件为 Button。\n\n## 逻辑类 (LOGIC CLASS)\n\n下一个要构建的类是 `GameLogic`\
    \ 类。为了方便跟踪你的代码，你将在单独文件中编写该类。遵循以下步骤：\n\n1.  点击 `NinjaBird` 标签旁边的箭头，选择 `New Tab`（新标签页）。\n\
