    8. **测试你的代码，确保每当鸟通过管道时得分都会更新，如** 图 12-19**所示，并且每当鸟撞到管道时得分都会恢复为 0，如** 图 12-20**所示。**


    9. **在你的 NinjaBird 类的 draw 方法末尾添加一行代码，在屏幕上方显示最高分****


    ```java

    text("BEST:" + bestScore, 400, 50);

    ```


    10. **测试你的代码，确保每当鸟撞到管道时最高分都会更新，如果当前得分高于最高分（参见** 图 12-22**）。**


