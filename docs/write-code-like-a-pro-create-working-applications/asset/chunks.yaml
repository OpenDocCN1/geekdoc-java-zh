    ## DRAWING AN ELLIPSE


    In Processing, the `ellipse` method will create a shape that is round. Similar
    to the quadrilateral, there are four parameters, which represent the `x` and `y`
    coordinates of the center of the shape, the width, and the height. Follow these
    steps:


    1. Create an ellipse that has the center at `x` = 250 and `y` = 250, a height
    of 100 pixels, and a width of 100 pixels (see [Figure 3-17](#06_9781119404170-ch03.xhtml_c03-fig-0017)).


    ```

    ellipse(250, 250, 100, 100);

    ```


    2. Try changing the `x` and `y` coordinates and the width and height to create
    different kinds of circular shapes (ellipses).


    This code creates the ellipse shown in [Figure 3-18](#06_9781119404170-ch03.xhtml_c03-fig-0018):


    ```

    ellipse(250, 250, 100, 300);

    ```


    This code creates the ellipse shown in [Figure 3-19](#06_9781119404170-ch03.xhtml_c03-fig-0019):


    ```

    ellipse(250, 250, 300, 100);

    ```


    3. When you’re done exploring different ellipse shapes, comment out the line of
    code that creates the ellipse (see [Figure 3-20](#06_9781119404170-ch03.xhtml_c03-fig-0020)).


    ![image](images/9781119404170-fg0317.png)

    [FIGURE 3-17:](#06_9781119404170-ch03.xhtml_rc03-fig-0017) An example of a small
    circle.


    ![image](images/9781119404170-fg0318.png)

    [FIGURE 3-18:](#06_9781119404170-ch03.xhtml_rc03-fig-0018) An example of a vertical
    oval.


    ![image](images/9781119404170-fg0319.png)

    [FIGURE 3-19:](#06_9781119404170-ch03.xhtml_rc03-fig-0019) An example of a horizontal
    oval.


    ![image](images/9781119404170-fg0320.png)

    [FIGURE 3-20:](#06_9781119404170-ch03.xhtml_rc03-fig-0020) The ellipse code commented
    out.


    ## DRAWING AN ARC


    In Processing, the `arc` method will create a shape that is round. Similar to
    the ellipse, there are four parameters, which represent the `x` and `y` coordinates
    of the center of the shape, the width and the height of the arc, and the start
    and stop angles. This shape is a lot more complicated than the others, because
    it involves using values for the last two parameters that can be confusing.


    1. Create an arc that has the center at `x` = 50 and `y` = 55, a height of 50
    pixels and width of 50 pixels. The arc should start at 0 and end at `PI` (see
    [Figure 3-21](#06_9781119404170-ch03.xhtml_c03-fig-0021)):


    ```

    arc(50, 55, 50, 50, 0, PI);

    ```


    2. Try changing the `x` and `y` coordinates, the width and height, and the start
    and stop angles to create different kinds of arcs.


    This code creates the arc shown in [Figure 3-22](#06_9781119404170-ch03.xhtml_c03-fig-0022):


    ```

    arc(50, 55, 50, 50, 0, HALF_PI);

    ```


    This code creates the arc shown in [Figure 3-23](#06_9781119404170-ch03.xhtml_c03-fig-0023):


    ```

    arc(50, 55, 50, 50, 0, QUARTER_PI+PI);

    ```


    3. When you’re done exploring different arcs, comment out the line of code that
    creates the arc (see [Figure 3-24](#06_9781119404170-ch03.xhtml_c03-fig-0024)).


    ![image](images/9781119404170-fg0321.png)

    [FIGURE 3-21:](#06_9781119404170-ch03.xhtml_rc03-fig-0021) An example of a half-circle
    arc.


    ![image](images/9781119404170-fg0322.png)

    [FIGURE 3-22:](#06_9781119404170-ch03.xhtml_rc03-fig-0022) An example of a quarter-circle
    arc.


    ![image](images/9781119404170-fg0323.png)

    [FIGURE 3-23:](#06_9781119404170-ch03.xhtml_rc03-fig-0023) An example arc that
    uses an eighth of a circle and half-circle.


    ![image](images/9781119404170-fg0324.png)

    [FIGURE 3-24:](#06_9781119404170-ch03.xhtml_rc03-fig-0024) The arc code commented
    out.


    ## CREATING A UNIQUE DRAWING


    Now that you know how to make the basic shapes using `triangle`, `rect`, `ellipse`,
    and `arc`, try making a unique drawing placing more than one shape within your
    canvas (see [Figure 3-25](#06_9781119404170-ch03.xhtml_c03-fig-0025)).


    ![image](images/9781119404170-fg0325.png)

    [FIGURE 3-25:](#06_9781119404170-ch03.xhtml_rc03-fig-0025) An example of all the
    shapes drawn on one canvas.


    There is no wrong way to draw your unique drawing. Try adding more than one ellipse
    and changing the order of shapes. For example, if you call the `rect` method first
    and then you call the `ellipse` method, it will be on top.


    ![image](images/c4.png)

    In the first three chapters of this book, you’ve been working on a gray canvas
    with white shapes. You added a little bit of color in Chapter 2 when you made
    black-and-white line, but it still wasn’t colorful. In this chapter, you’ll learn
    how to add a lot of color to your static drawings, which you’ll be able to use
    in your animations later!


    ## ADDING COLOR TO YOUR CANVAS


    The first step is to add color to your canvas. This is similar to what you did
    in Chapter 2. Follow these:


    1. Create a new program and create a canvas that is 500 by 500 pixels (see [Figure
    4-1](#06_9781119404170-ch04.xhtml_c04-fig-0001)).


    ```

    size(500, 500);

    ```


    2. Before `size` method call, add a method call to `background` (see [Figure 4-2](#06_9781119404170-ch04.xhtml_c04-fig-0002)).


    ```

    background(10, 80, 100);

    ```


    3. Click Run. You can see that the color of your background is now teal (see [Figure
    4-3](#06_9781119404170-ch04.xhtml_c04-fig-0003)).


    4. Try changing the three parameter values in the `background` method to change
    the color. This code colors the canvas as shown in [Figure 4-4](#06_9781119404170-ch04.xhtml_c04-fig-0004):


    ```

    background(255, 0, 0);

    ```


    This code colors the canvas as shown in [Figure 4-5](#06_9781119404170-ch04.xhtml_c04-fig-0005):


    ```

    background(0, 255, 0);

    ```


    This code colors the canvas as shown in [Figure 4-6](#06_9781119404170-ch04.xhtml_c04-fig-0006):


    ```

    background(0, 0, 255);

    ```


    In the next section, you will learn what these values represent.


    ![image](images/9781119404170-fg0401.png)

    [FIGURE 4-1:](#06_9781119404170-ch04.xhtml_rc04-fig-0001) The code needed to create
    a 500-x-500-pixel canvas.


    ![image](images/9781119404170-fg0402.png)

    [FIGURE 4-2:](#06_9781119404170-ch04.xhtml_rc04-fig-0002) The code needed to change
    the color of the canvas’s background.


    ![image](images/9781119404170-fg0403.png)

    [FIGURE 4-3:](#06_9781119404170-ch04.xhtml_rc04-fig-0003) An example of changing
    the background to teal.


    ![image](images/9781119404170-fg0404.png)

    [FIGURE 4-4:](#06_9781119404170-ch04.xhtml_rc04-fig-0004) An example of changing
    the background completely red.


    ![image](images/9781119404170-fg0405.png)

    [FIGURE 4-5:](#06_9781119404170-ch04.xhtml_rc04-fig-0005) An example of changing
    the background completely green.


    ![image](images/9781119404170-fg0406.png)

    [FIGURE 4-6:](#06_9781119404170-ch04.xhtml_rc04-fig-0006) An example of changing
    the background completely blue.


    ## LEARNING ABOUT RGB VALUES


    As you may have noticed in the preceding section, there is something unique about
    each of the values of the parameters for the `background` method. Each parameter
    can have a number value from 0 to 255:


    * `Red` represents how much red will be in the color.

    * `Green` represents how much green will be in the color.

    * `Blue` represents how much blue will be in the color.


    Notice that the parameters are `Red`, then `Green`, and `Blue`. That’s why it’s
    called RGB! If all the values for these three parameters are `0`, the color will
    be black (see [Figure 4-7](#06_9781119404170-ch04.xhtml_c04-fig-0007)):


    ```

    background(0, 0, 0);

    ```


    ![image](images/9781119404170-fg0407.png)

    [FIGURE 4-7:](#06_9781119404170-ch04.xhtml_rc04-fig-0007) An example of changing
    the background color completely black.


    If all the values for the three parameters are 255, the color will be white (see
    [Figure 4-8](#06_9781119404170-ch04.xhtml_c04-fig-0008)):


    ```

    background(255, 255, 255);

    ```


    ![image](images/9781119404170-fg0408.png)

