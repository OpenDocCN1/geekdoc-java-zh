    \ programs. By adding the comments first, you can make sure you don’t forget anything\
    \ when you write your code. It also helps with debugging (finding errors in your\
    \ code) because you can compare what you wanted to do (the comments) with what\
    \ you actually do (the code).\n\nOpen the Processing application and create a\
    \ new Sketch file. Save the file right away and call it `NinjaBird`.\n\n## MAIN\
    \ CLASS\n\nEven though you don’t have to add the word `class` like you do for\
    \ the other classes you’ll make, your first class is the Sketch file that you\
    \ start with, which has the `setup` and `draw` methods.\n\nIn this class, you’ll\
    \ want to:\n\n*   Keep track of both score variables.\n*   Draw the background.\n\
    *   Display the buttons when it’s time to do so.\n*   Keep track of the state\
