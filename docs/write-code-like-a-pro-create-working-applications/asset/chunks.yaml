  trans: "\n正如你可能在图 7-25 中看到的，每当你按下 A 或 D 键时，你的角色都会留下一道痕。要修复这个问题，你必须在每次重新绘制角色时重新绘制场景。请按照以下步骤操作：\n\
    \n1. **创建一个名为 `drawScene` 的新方法，并将背景颜色、草地和两座山丘的代码移动到 `drawScene` 方法中（参见图 7-26)::**\n\
    \n```java\nvoid drawScene()\n{\n  //Sky\n  background(173, 216, 230);\n  //Grass\n\
    \  stroke(0, 255, 0);\n  fill(0, 255, 0);\n  rect(0, 400, 1000, 500);\n  //Hills\n\
    \  stroke(165, 42, 42);\n  fill(165, 42, 42);\n  arc(300, 400, 100, 150, PI, TWO_PI);\n\
    \  arc(600, 400, 100, 150, PI, TWO_PI);\n}\n```\n\n确保你更新了代码中的注释。\n\n2. **在你的 `setup`\
    \ 方法中添加对 `drawScene` 方法的调用（参见图 7-27):**\n\n```java\nvoid setup()\n{\n  //Canvas\n\
    \  size(1000, 500);\n  //Draw the sky, grass, and hills\n  drawScene();\n  //Create\
    \ the character\n  character = loadImage(\"penguin.png\");\n  image(character,\
    \ characterX, characterY);\n}\n```\n\n3. **在你的 `draw` 方法中添加对 `drawScene` 方法的调用（参见图\
    \ 7-28)::**\n\n```java\nvoid draw()\n{\n  //Redraw the sky, grass, and hills\n\
    \  drawScene();\n  //Redraw the character\n  image(character, characterX, characterY);\n\
    }\n```\n\n4. **测试你的代码以确保场景仍然正确（参见图 7-29)。**\n\n现在当你移动角色时，它就不会再留下痕迹了。\n\n![image](img/9781119404170-fg0726.png)\n\
    \n图 7-26： 将 `drawScene` 代码移动到新方法中。\n\n![image](img/9781119404170-fg0727.png)\n\
    \n图 7-27： 从 `setup` 中调用 `drawScene`。\n\n![image](img/9781119404170-fg0728.png)\n\
    \n图 7-28： 从 `draw` 中调用 `drawScene`。\n\n![image](img/9781119404170-fg0729.png)\n\
    \n图 7-29： 测试以确保你的角色移动时没有留下痕迹。\n\n## 为你的视频游戏添加重力\n\n你现在游戏中一个奇怪的方面是你的角色直接穿过了山丘（参见图\
    \ 7-30)）。\n\n![image](img/9781119404170-fg0730.png)\n\n图 7-30： 你的角色可以穿过山丘。\n\n\
    在本节中，你将让角色在按下空格键时向上移动，会自动向下移动。这本质上就是重力。按照以下步骤操作：\n\n1. **在条件语句中添加第三个条件，在按下空格键时更改\
    \ `characterY` 变量（参见图 7-31)::**\n\n```java\nelse if(key == ' ')\n{\n  characterY\
    \ = characterY - 5;\n}\n```\n\n2. **在 `draw` 方法中添加一个条件语句，只要角色仍在草地上方，就更改 `characterY`\
    \ 变量让角色向下移动（参见图 7-32)::**\n\n```java\nvoid draw()\n{\n  //Redraw the sky, grass,\
    \ and hills\n  drawScene();\n  if(characterY < 300)\n  {\n    characterY = characterY\
    \ + 2;\n  }\n  //Redraw the character\n  image(character, characterX, characterY);\n\
    }\n```\n\n3. **调整更改 `characterY` 变量的数字，以便跳得很高并缓慢落下（参见图 7-33)::**\n\n在 `draw` 方法的条件中，如果值小于\
    \ 300：\n`characterY = characterY + 2;`\n\n在 `keyPressed` 方法的条件中，当按下空格键时：\n`characterY\
    \ = characterY - 5;`\n\n4. **调整更改 `characterX` 变量的数字，使其跳过山丘（参见图 7-34):**\n\n在\
    \ `keyPressed` 方法的条件中，当按下 A 键时：\n`characterX = characterX - 10;`\n\n在 `keyPressed`\
    \ 方法的条件中，当按下 D 键时：\n`characterX = characterX + 10;`\n\n![image](img/9781119404170-fg0731.png)\n\
    \n图 7-31： 按下空格键时移动。\n\n![image](img/9781119404170-fg0732.png)\n\n图 7-32： 在草地上方时向下移动。\n\
    \n![image](img/9781119404170-fg0733.png)\n\n图 7-33： 调整跳跃高度。\n\n![image](img/9781119404170-fg0734.png)\n\
    \n图 7-34： 跳过山丘。\n\n现在当你移动角色时，它不应该再留下痕迹。\n\n恭喜！你已经为世界添加了重力！\n\n"
- fmt: "\n5. **Add a call to the text method to have the character say “OW!” when\
    \ it touches the lava (see [Figure 7-39](#10_9781119404170-ch07.xhtml_c07-fig-0039)):**\n\
    \n```javascript\n//text(characterX, characterX + 60, characterY – 5);\n//Check\
    \ to see if the character hit the lava\nif((characterX >= 150 && characterX <=\
    \ 310) || (characterX >= 450 && characterX <= 610))\n{\n    text(\"OW!\", characterX\
    \ + 60, characterY – 5);\n}\n```\nComment out the code you added in Step 2 to\
    \ so that it only says something when it touches the lava.\n\n6. **Add one final\
    \ condition to your conditional statement to make sure your character only says\
    \ “OW!” if it’s touching the lava, not jumping above it (see [Figure 7-40](#10_9781119404170-ch07.xhtml_c07-fig-0040)):**\n\
    \n```javascript\n//Check to see if the character hit the lava\nif((characterX\
    \ >= 150 && characterX <= 310) || (characterX >= 450 && characterX <= 610)) &&\
    \ characterY >= 300)\n{\n    text(\"OW!\", characterX + 60, characterY – 5);\n\
    }\n```\n\n![image](images/9781119404170-fg0735.png)\n\n[FIGURE 7-35:](#10_9781119404170-ch07.xhtml_rc07-fig-0035)\
    \ Make the `arc` methods create lava pits instead of hills.\n\n![image](images/9781119404170-fg0736.png)\n\
    \n[FIGURE 7-36:](#10_9781119404170-ch07.xhtml_rc07-fig-0036) Use the `text` method\
    \ to gather information about the character.\n\n![image](images/9781119404170-fg0737.png)\n\
    \n[FIGURE 7-37:](#10_9781119404170-ch07.xhtml_rc07-fig-0037) Add a conditional\
    \ statement to test whether the character is touching the first lava.\n\n![image](images/9781119404170-fg0738.png)\n\
    \n[FIGURE 7-38:](#10_9781119404170-ch07.xhtml_rc07-fig-0038) Add to the conditional\
    \ statement to test whether the character is touching the second lava.\n\n![image](images/9781119404170-fg0739.png)\n\
    \n[FIGURE 7-39:](#10_9781119404170-ch07.xhtml_rc07-fig-0039) Add a call to the\
    \ text method to say “OW!” when touching lava.\n\n![image](images/9781119404170-fg0740.png)\n\
    \n[FIGURE 7-40:](#10_9781119404170-ch07.xhtml_rc07-fig-0040) Add an additional\
    \ condition to ensure that the character is on the ground on the lava, not in\
    \ the air above it.\n\nCongratulations! You’ve made a short game. In this game,\
    \ the goal is to avoid the lava pits so that your character doesn’t get hurt!\
    \ In the next chapter, you’ll add points and other characters to your game.\n\n\
    ![image](images/c8.png)\n\nThis chapter is exciting! Here, you’ll add new characters\
    \ to your game that aren’t controlled by a player, but instead are controlled\
    \ by your code! This is what artificial intelligence is, and it’s what this chapter\
    \ is all about.\n\n## ADDING AN ENEMY TO YOUR VIDEOGAME\n\nThe first step to creating\
    \ artificial intelligence is to get the enemy into your game.\n\n1. **Open the\
    \ Processing application and open your FirstVideoGame Sketch that you made in\
    \ Chapter 7 (#10_9781119404170-ch07.xhtml) (see [Figure 8-1](#11_9781119404170-ch08.xhtml_c08-fig-0001)).**\n\
    \n2. **Find another character online, download it, and save it to your FirstVideoGame\
    \ folder (see [Figure 8-2](#11_9781119404170-ch08.xhtml_c08-fig-0002)).**\n\n\
    \   You can do this using the technique I introduced in Chapter 7](#10_9781119404170-ch07.xhtml)\
    \ turn to the [Adding Character to Your Videogame](#10_9781119404170-ch07.xhtml_c07-sec-0003)\
    \ section.\n\n3. **Add the code needed to create the enemy, place it in your videogame,\
    \ and control its x and y location (see [Figure 8-3](#11_9781119404170-ch08.xhtml_c08-fig-0003)).**\n\
    \n   First, add this code above your `setup` method:\n```javascript\nPImage enemy;\n\
    int enemyX = 200;\nint enemyY = 300;\n```\n   Then, add this code at the bottom\
    \ of your `setup` method:\n```javascript\n//Create the enemy\nenemy = loadImage(\"\
    crab.png\");\nimage(enemy, enemyX, enemyY);\n```\n\n4. **Add a line of code to\
    \ redraw the enemy every time the draw method is called (see [Figure 8-4](#11_9781119404170-ch08.xhtml_c08-fig-0004)).**\n\
    \n   This code should be added at the bottom of your `draw` method:\n```javascript\n\
    //Redraw the enemy\nimage(enemy, enemyX, enemyY);\n```\n\n5. **Test your code\
    \ to make sure your first enemy is where you want it to be (see [Figure 8-5](#11_9781119404170-ch08.xhtml_c08-fig-0005)).**\n\
    \n6. **Adjust the start location of your enemy to be more realistic (see [Figure\
    \ 8-6](#11_9781119404170-ch08.xhtml_c08-fig-0006)).**\n\n   Change the code from\
    \ Step 3 that goes above the `setup` method to:\n```javascript\nPImage enemy;\n\
    int enemyX = 350;\nint enemyY = 325;\n```\n\n![image](images/9781119404170-fg0801.png)\n\
    \n[FIGURE 8-1:](#11_9781119404170-ch08.xhtml_rc08-fig-0001) The Sketch program\
    \ Chapter 7](#10_9781119404170-ch07.xhtml).\n\n![image](images/9781119404170-fg0802.png)\n\
    \n[FIGURE 8-2:](#11_9781119404170-ch08.xhtml_rc08-fig-0002) Download an enemy\
    \ image into your FirstVideoGame folder.\n\n![image](images/9781119404170-fg0803.png)\n\
    \n[FIGURE 8-3:](#11_9781119404170-ch08.xhtml_rc08-fig-0003) The code needed to\
    \ create the enemy on the canvas.\n\n![image](images/9781119404170-fg0804.png)\n\
    \n[FIGURE 8-4:](#11_9781119404170-ch08.xhtml_rc08-fig-0004) The code needed to\
    \ redraw the enemy to allow it to move.\n\n![image](images/9781119404170-fg0805.png)\n\
    \n[FIGURE 8-5:](#11_9781119404170-ch08.xhtml_rc08-fig-0005) The enemy in your\
    \ videogame for the first time.\n\n![image](images/9781119404170-fg0806.png)\n\
    \n[FIGURE 8-6:](#11_9781119404170-ch08.xhtml_rc08-fig-0006) Modify the code to\
    \ place the enemy on the canvas correctly.\n\nGreat! Now you have a character\
    \ and an enemy in your videogame!\n\n## MAKING THE ENEMY MOVE\n\nThe next step\
    \ is to make the enemy move with code, instead of user input (like the keyboard\
    \ or mouse). To start with, the enemy is going to move between the two lava pits,\
    \ adding an extra layer of difficulty for the player. To do this, you’re going\
    \ to use a new variable to keep track of whether the enemy should be moving left\
    \ (–1) or right (+1).\n\n1. **Create a new variable called `enemyMovement` that\
    \ is initialized to 1 (see [Figure 8-7](#11_9781119404170-ch08.xhtml_c08-fig-0007)).**\n\
    \n   Add this line of code above your `setup` method:\n```javascript\nint enemyMovement\
    \ = 1;\n```\n\n2. **Add a conditional statement to update the `enemyMovement`\
    \ variable depending on which lava pit the enemy reaches (see [Figure 8-8](#11_9781119404170-ch08.xhtml_c08-fig-0008)).**\n\
    \n   If the enemy gets to the left lava pit (`enemyX = 350`), it should move right\
    \ (+1). If the enemy gets to the right lava pit (`enemyX = 450`), it should move\
    \ left (–1).\n\n   This code should be added to the bottom of your `draw` method:\n\
    ```javascript\n//Move enemy\nif(enemyX == 350)\n{\n    enemyMovement = 1;\n}\n\
    else if(enemyX == 450)\n{\n    enemyMovement = -1;\n}\n```\n\n3. **Update the\
    \ enemy’s `enemyX` by either 1 or –1 depending on Step 2 (see [Figure 8-9](#11_9781119404170-ch08.xhtml_c08-fig-0009)).**\n\
    \n   This code should be added to the bottom of your `draw` method:\n```javascript\n\
    enemyX = enemyX + enemyMovement;\n```\n\n4. **Test your code by pressing the Run\
    \ button to make sure the enemy moves back and forth between the two lava pits\
    \ (see [Figure 8-10](#11_9781119404170-ch08.xhtml_c08-fig-0010)).**\n\n![image](images/9781119404170-fg0807.png)\n\
    \n[FIGURE 8-7:](#11_9781119404170-ch08.xhtml_rc08-fig-0007) The `enemyMovement`\
    \ variable to set the direction of the enemy.\n\n![image](images/9781119404170-fg0808.png)\n\
    \n[FIGURE 8-8:](#11_9781119404170-ch08.xhtml_rc08-fig-0008) The conditional to\
    \ switch directions of the enemy.\n\n![image](images/9781119404170-fg0809.png)\n\
    \n[FIGURE 8-9:](#11_9781119404170-ch08.xhtml_rc08-fig-0009) The code to make your\
    \ enemy move left or right, depending on the conditional statement in Step 4.\n\
    \n![image](images/9781119404170-fg0810.png)\n\n[FIGURE 8-10:](#11_9781119404170-ch08.xhtml_rc08-fig-0010)\
    \ The enemy moving between the two lava pits.\n"
