    \n```javasa\n//Call the mouseClicked button for the bird when the\n//mouse is\
    \ clicked\nvoid mouseClicked()\n{\n    bird.mouseClicked();\n}\n```\n\n16. 测试你的代码，确保当你点击画布内部时小鸟会向上移动。\n\
