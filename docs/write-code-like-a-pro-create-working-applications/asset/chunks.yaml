    ![](img/cover.jpg)


    # 引言


    你想制作属于自己的视频游戏吗？你想学习如何用 Java 编写代码吗？这是一个非常棒的主意！


    编写 Java 代码可能是一项艰苦的工作，尤其是编写用于视频游戏的 Java 代码。例如，初版的《塞尔达传说》（Legend of Zelda）花费了 100
    多人三年的时间才完成！但别担心，这本书将引导你通过所有步骤，学习 Java 编程的基础知识，并制作两个你自己的视频游戏。你制作的第一个游戏类似于马里奥（Mario），你有一个角色在屏幕上奔，并试图避开岩浆坑和敌人。你编写的第二个更大的游戏类似于《愤怒的小鸟》（Flappy
    Bird），它被称为 `Ninja Bird`。追踪分数、让水管随机移动、甚至帮助小鸟飞行——你的朋友们会玩你做的游戏玩好几个小时！


    ## 关于本书


    本书使用了一个名为 `Processing` 的计算机应用程序，它是为了让 Java 视频游戏的编码变得简单得多而设计的。正如你看到的，你可以轻松地用不同的形状和颜色进行绘制，可以将从网上找到的（当然，需要获得成人的许可！）加入到你的绘画和游戏中，而且它带有一个完整的代码库供你直接使用。它是免费的，可以在线获取。在第一章中，你将学习如何通过几个简单的步骤下载并开始使用。


    《像专业人士一样编写代码》（Write Code Like a Pro）包含了你要编写的三类程序。首先，你将使用 `Processing` 库提供的许多功能创建一个简单的图形。通过形状和颜色，本书的前几章将引导你完成一个艺术程序。书的下一部分将教你如何将绘画转换为动画——让形状和图像在画布上移动。最后，你将有机会构建两个不同的视频游戏。


    虽然这本书将引导你一步一步地制作这些游戏，但我们非常鼓励你在读完这本书后继续编程，并对在这里学到的游戏进行变体！这只是你编程和视频游戏开发生涯的开始。以本书为起点，你永远不知道能取得什么样的成就！


    ## 基础假设


    每个人都必须从某个地方开始，对吧？我在写这本书时，必须假设你已经擅长处理这些内容：


    *   **在电脑上打字和使用鼠标：** 你可能知道如何使用 Windows 系统或 Mac；任一系统都可以。本书中的示例是在 Mac 上展示的。

    *   **遵循指令：** 编码是非常精确的。在制作应用程序时有很多拼图碎片。你已经知道如何仔细遵循指令，并将书中的图片与你自己制作的内容进行对比，这是非常重要的。


    ## 本书中使用的图标


    当你阅读书中的项目时，你会看到图标。这些图标指出了不同的内容：


    ![remember](img/remember.png) “记住”（Remember）图标强调了你应该记住的观点。


    ![tip](img/tip.png) “提示”（Tip）图标标记了可以让编码更简单的建议和快捷方法。


    ## 从这里开始


    在本书中，最好从第 1 章开始，一直到第 12 章。你在早期章节中学学的某些内容确实有助于你完成后期章节中更大的问题。书中的章节分为三类：第 1 章到第 6
    章引导你通过画布学习 Java 编码的基础；你将学习如何制作形状、添加颜色、让对象移动，甚至进行用户交互——这些对于编写视频游戏都非常重要。第 7 章到第
    8 章引导你制作你的第一个视频游戏！这个游戏类似于马里奥，但只是视频游戏制作的预览。最后，第 9 章到第 12 章引导你制作 `Ninja Bird`，这是一个像《愤怒的小鸟》的游戏。


    ![image](img/c1.png)


    所以，你想学习如何用 Java 编写代码。这是一个很棒的目标！在本书中，你将在学习制作视频游戏的同时学习 Java 的基础知识！编码可能是很复杂的。有时它会令人沮丧。记住继续尝试，测试你的代码，并双倍检查是否正确输入了所有内容。通过努力，你会学到很多并享受其中！


    在本章中，你将安装 `Processing` 应用程序，这将允许你编写 Java 代码。然后你将有机会测试一些真实的 Java 代码，并确保你理解应用程序在书中范围内如何工作。


    ## 开始使用 PROCESSING


    要开始 Java，你将使用一个名为 `Processing` 的编程环境。`Processing` 自带一个库，有助于让 Java 视频游戏的编码变得简单得多。


    ### 下载与安装


    要开始使用 `Processing`，你需要下载并安装。按照以下步骤操作：


    1.  访问 `www.processing.org` 并点击 Download 按钮。

    2.  找到你使用的操作系统（参见图 1-1），并选择正确的版本。

    3.  文件下载完成后，解压文件。


    ![image](img/9781119404170-fg01.png)

    图 1-1 Processing 网站。


    ![image](img/9781119404170-fg02.png)

    图 1-2 下载选项。


    ![image](img/9781119404170-fg03.png)

    图 1-3 可选贡献。


    ### 开始使用 PROCESSING


    现在你已经安装了 `Processing`，可以开始使用它了。按照以下步骤操作：


    1.  双击 `Processing` 文件。

    2.  第一次打开 `Processing` 时，可能会弹一个提示框，询问你是否确定要打开文件（参见图 1-4）。打开。

    3.  取消勾选“每次显示此消息”（Show This Message Each Time）框，然后点击“开始使用”（Get Started）按钮。


    打开一个新的 `Sketch`。`Sketch` 是 `Processing` 对程序文件的称呼。你会发现 `Sketch` 右上角的编程语言设置为 Java（参见图
    1-5）。


    ![image](img/9781119404170-fg04.png)

    图 1-4 首次打开 Processing 时可能会警告。


    ![image](img/9781119404170-fg05.png)

    图 1-5 欢迎界面。


    ![image](img/97811119404170-fg06.png)

    图 1-6 打开了新 Sketch 的 Processing 窗口。


    ### 尝试代码


    现在你已经打开了 `Processing`，可以测试一些代码来确保一切正常！


