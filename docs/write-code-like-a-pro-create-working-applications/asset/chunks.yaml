    \n`}`\n\n`else if(examPoints >= 70)`\n\n`{`\n\n`giveScoop();`\n\n`}`\n\n`else`\n\
    \n`{`\n\n`giveGrounding();`\n\n`}`\n\nNotice that the condition for these `if`\
    \ statements still evaluate to true or false, but they’re comparing a variable\
    \ to a number instead of to true or false.\n\nDo you think that if you received\
    \ 91 points you would get a chocolate sundae *and* a scoop of ice cream? You did\
    \ get >= 90 points, but you also got >= 70 points.\n\nNo. You’ll only get the\
    \ chocolate sundae. That’s because conditional statements are considered a block\
    \ of code and you actually skip all the code after you’ve found a condition that\
    \ is true. So, if you got 91 points on the exam, then the code inside of the first\
    \ `if` statement would execute (giving you a chocolate sundae) and the code inside\
    \ the second `if` statement and inside of the `else` statement would be skipped\
    \ over. This is something you’ll see throughout this book as well.\n\n### ADDING\
    \ CONDITIONAL STATEMENTS TO YOUR CODE\n\nNow that you’ve had a brief introduction\
    \ to conditional statements, it’s time to add some to the code! You’re going to\
    \ make it so that when the mouse is being pressed, the color of the circle is\
    \ blue, and when the mouse is let go, the color of the circle is green. Follow\
    \ these steps:\n\n1.  **Add some space around the stroke and fill lines of code\
    \ so that you can visually separate the area where you’re going to add the conditional\
    \ statement (see** [**Figure 6-12**](#09_9781119404170-ch06.xhtml_c06-fig-0012)**).**\n\
    \n2.  **Add an `if` statement around the calls to the stroke and fill methods\
    \ (see** [**Figure 6-13**](#09_9781119404170-ch06.xhtml_c06-fig-0013)**).**\n\n\
    \    Make sure that the curly braces are around both lines. The condition for\
    \ this `if` statement should be as follows:\n\n    `mousePressed == true`\n\n\
    \    `mousePressed` is a variable that the Processing application gives you to\
    \ use, just like `mouseX` and `mouseY`.\n\n    `if(mousePressed == true)`\n\n\
    \    `{`\n\n    `stroke(255, 255, 255);`\n\n    `fill(0, 0, 250);`\n\n    `}`\n\
    \n3.  **Add an `else` statement below the `if` statement to complete the conditional\
    \ statement, and add two lines of code inside the curly braces of the `if` statement\
    \ to make the stroke white and the fill green (see** [**Figure 6-14**](#09_9781119404170-ch06.xhtml_c06-fig-0014)**).**\n\
    \n    `else`\n\n    `{`\n\n    `stroke(255, 255, 255);`\n\n    `fill(0, 255, 0);`\n\
    \n    `}`\n\n4.  **Press the Run button and make sure that when you’re pressing\
    \ the mouse the circle is blue and when you let go it turns green!**\n\n![image](images/9781119404170-fg0612.png)\n\
    \n[FIGURE 6-12:](#09_9781119404170-ch06.xhtml_rc06-fig-0012) Add space where your\
    \ conditional statement will go.\n\n![image](images/9781119404170-fg0613.png)\n\
    \n[FIGURE 6-13:](#09_9781119404170-ch06.xhtml_rc06-fig-0013) Add the `if` part\
    \ of the conditional statement.\n\n![image](images/9781119404170-fg0614.png)\n\
    \n[FIGURE 6-14:](#09_9781119404170-ch06.xhtml_rc06-fig-0014) Add the `else` part\
    \ of the conditional statement.\n\nIncredible! Your code is really coming along!\
    \ You have a moving shape that changes color based on user input. In the last\
    \ section of this chapter, you’ll learn how to interact with your shape using\
    \ the keyboard instead of the mouse.\n\n## MOVING SHAPES WITH THE KEYBOARD\n\n\
    This section introduces you to using the keyboard to interact with your animation.\
    \ This is going to be very important because it’s how you’ll move your character\
    \ when you make a videogame. Follow these steps:\n\n1.  **Change the call to the\
    \ `ellipse` method to use the `yCoordinate` variable again (see** [**Figure 6-15**](#09_9781119404170-ch06.xhtml_c06-fig-0015)**).**\n\
    \n    `ellipse(xCoordinate, yCoordinate, 300, 300);`\n\n2.  **Delete the `mouseDragged`\
    \ method that you created (see** [**Figure 6-16**](#09_9781119404170-ch06.xhtml_c06-fig-0016)**).**\n\
    \n    This time you *do* want to delete the code. You don’t need the `mouseDragged`\
    \ call anymore because the keys are going to change the location of the circle.\
    \ Because `mouseDragged` is automatically called by the Processing application,\
    \ you don’t want any code accidentally being called.\n\n3.  **Add a new method\
    \ called `keyPressed` that returns no value and has no parameters (see** [**Figure\
    \ 6-17**](#09_9781119404170-ch06.xhtml_c06-fig-0017)**).**\n\n    This is just\
    \ like the `mouseDragged` method. It’s one that the Processing application knows\
    \ about and will automatically call when any key is pressed on the keyboard.\n\
    \n    `void keyPressed()`\n\n    `{`\n\n    `}`\n\n4.  **Add a conditional statement\
    \ to the `keyPressed` method that checks if the key that was pressed was the letter\
    \ W (see** [**Figure 6-18**](#09_9781119404170-ch06.xhtml_c06-fig-0018)**).**\n\
    \n    If you look at the keyboard, the letters W, A, S, and D create a shape similar\
    \ to the four arrow keys. Because we still have mouse interactions (when you click\
    \ the mouse it changes color), you want to leave the right hand for the mouse\
    \ and use your left hand for moving the shape. This is often done in videogames,\
    \ using WASD to move a character and the mouse to be able to look around and aim.\n\
    \n    `void keyPressed()`\n\n    `{`\n\n    `if(key == 'w')`\n\n    `{`\n\n  \
    \  `}`\n\n    `}`\n\n5.  **Add a line of code to change the yCoordinate variable\
    \ to be the same value, minus 1 pixel.**\n\n    This will move the shape up 1\
    \ pixel. This line should be between the open and closed curly braces of the conditional\
    \ statement:\n\n    `yCoordinate = yCoordinate – 1;`\n\n6.  **Press the Run button\
    \ and then press the W key.**\n\n    Make sure that the circle moves up by one\
    \ pixel each time you press the key.\n\n7.  **Add three more `if` statement parts\
    \ to your conditional statement to check if the key that was pressed was A, S,\
    \ or D (see** [**Figure 6-20**](#09_9781119404170-ch06.xhtml_c06-fig-0020)**).**\n\
    \n    Make sure that you’re changing the `xCoordinate` and `yCoordinate` variables\
    \ correctly!\n\n    `void keyPressed()`\n\n    `{`\n\n    `if(key == 'w')`\n\n\
    \    `{`\n\n    `yCoordinate = yCoordinate – 1;`\n\n    `}`\n\n    `else if(key\
    \ == 'a')`\n\n    `{`\n\n    `xCoordinate = xCoordinate – 1;`\n\n    `}`\n\n \
    \   `else if(key == 's')`\n\n    `{`\n\n    `yCoordinate = yCoordinate + 1;`\n\
    \n    `}`\n\n    `else if(key == 'd')`\n\n    `{`\n\n    `xCoordinate = xCoordinate\
    \ + 1;`\n\n    `}`\n\n    `}`\n\n8.  **Press the Run button and try pressing all\
