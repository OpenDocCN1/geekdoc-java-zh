    }\n```\n\n2. 从 `Pipes` 类中的八个辅助方法中返回正确的变量：\n\n```java\n//Method to return the x-coordinate\
    \ of the top pipe\nint getXTop()\n{\n  return xCoordinateTop;\n}\n//Method to\
    \ return the y-coordinate of the top pipe\nint getYTop()\n{\n  return yCoordinateTop;\n\
    }\n//Method to return the width of the top pipe\nint getWidthTop()\n{\n  return\
    \ widthTop;\n}\n//Method to return the height of the top pipe\nint getHeightTop()\n\
    {\n  return heightTop;\n}\n//Method to return the x-coordinate of the bottom\n\
    //pipe\nint getXBottom()\n{\n  return xCoordinateBottom;\n}\n//Method to return\
    \ the y-coordinate of the bottom\n//pipe\nint getYBottom()\n{\n  return yCoordinateBottom;\n\
    }\n//Method to return the width of the bottom pipe\nint getWidthBottom()\n{\n\
    \  return widthBottom;\n}\n//Method to return the height of the bottom pipe\n\
    int getHeightBottom()\n{\n  return heightBottom;\n}\n```\n\n图 12-6 显示了这八个辅助方法在你\
    \ `Pipes` 类文件中的位置。\n\n3. 删除 `NinjaBird` 主类中 `checkCollision` 方法中的两个注释（参见图 12-7）。\n\
    \n既然你已经有了这些辅助方法可以使用，就不再需要注释来提醒你访问这些方法了。\n\n4. 因为你有两组管道，所以在 `Pipes` 类内部检查鸟是否撞到了管道会更合理；这样一来，你就不需要为每组管道编写碰撞检测代码了。在\
    \ `Pipes` 类中，创建一个名为 `checkIfHit` 的新方法，它返回一个 Boolean 值并接受三个整数参数（参见图 12-8）：\n\n\
    ```java\nboolean checkIfHit(int x, int topY, int bottomY)\n{\n  return false;\n\
    }\n```\n\n5. 在你的 `NinjaBird` 主类中，为鸟的 `rightX`、`topY` 和 `bottomY` 创建三个变量，然后将它们传递给\
    \ `pipes` 和 `pipes2` 组管道的 `checkIfHit` 方法。如果其中一个返回 true，则说明鸟已经撞到了某组管道，你的 `checkCollision`\
    \ 方法应该返回 true。否则，你的 `checkCollision` 方法应该返回 false。新的 `checkCollision` 方法如图 12-9\
    \ 所示。\n\n```java\n//Method to check to see if the bird has hit any of\n//the pipes\n\
    boolean checkCollision()\n{\n  int birdRightX = bird.getX() + bird.getWidth()/2;\n\
    \  int birdTopY = bird.getY() - bird.getHeight()/2;\n  int birdBottomY = bird.getY()\
