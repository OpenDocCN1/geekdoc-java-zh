  trans: "\n\n6. 点击运行按钮，确保你的圆跨越屏幕时后面没有留下痕迹（参见图 5-17）。\n\n![image](img/9781119404170-fg0512.png)\n\
    \n图 5-12: 一个空的 `moveDownAndRight()` 方法。\n\n![image](img/9781119404170-fg0513.png)\n\
    \n图 5-13: 在 `moveDownAndRight` 中添加了两个行代码，用于更新 `xCoordinate` 和 `yCoordinate` 变量。\n\
    \n![image](img/9781119404170-fg0514.png)\n\n图 5-14: 每次绘制圆时都调用一次 `moveDownAndRight`。\n\
    \n![image](img/9781119404170-fg0515.png)\n\n图 5-15: 蓝白相色的圆带有痕迹跨越画布。\n\n![image](img/9781119404170-fg0516.png)\n\
    \n图 5-16: 再次调用背景方法以覆盖圆的痕迹。\n\n![image](img/9781119404170-fg0517.png)\n\n图 5-17:\
    \ 圆跨越画布且没有留下痕迹。\n\n恭喜！你现在已经制作了一个动画！在下一节中，你将学习如何调整动画的速度。\n\n## 为你的方法添加参数\n\n现在你已经有了动画，可以添加一个参数来加速你的动画。给\
    \ `xCoordinate` 增加 1 并给 `yCoordinate` 增加 1，基本上就是每次绘制时让圆向左移动 1 像素并向下 1 像素。如果你将\
    \ 1 改为 2，圆将向左移动 2 像素并向下 2 像素，这会让圆看起来移动速度快了一倍（参见图 5-18）：\n\n```\nvoid moveDownAndRight()\n\
    {\n  xCoordinate = xCoordinate + 2;\n  yCoordinate = yCoordinate + 2;\n}\n```\n\
    \n![image](img/9781119404170-fg0518.png)\n\n图 5-18: 修改 `xCoordinate` 和 `yCoordinate`\
    \ 变量，每次移动 2 像素而不是 1 像素。\n\n在这个示例中，只有两个地方需要更改显示速度的值：\n\n```\nxCoordinate = xCoordinate\
    \ + 2;\nyCoordinate = yCoordinate + 2;\n```\n\n但你仍然不想意外地改变其中一个而忘记改变另一个。为了避免这种错误，你可以为你的\
    \ `moveDownAndRight` 方法添加一个参数，这样 `xCoordinate` 和 `yCoordinate` 变量总是按相同的量变化。\n\n\
    1. **在 `moveDownAndRight` 方法签名中添加参数类型和参数名称。类型应该是 `int`（因为该值是一个数字），名称应该是 `speed`：**\n\
    \n```\nvoid moveDownAndRight(int speed)\n{\n  xCoordinate = xCoordinate + 2;\n\
    \  yCoordinate = yCoordinate + 2;\n}\n```\n\n你实际上可以给参数起任何你喜欢的名称，最好的做法是让名称代表该值，所以\
    \ `speed` 是一个很好的选择。\n\n注意，你在 Processing 窗口底部收到一个错误消息（参见图 5-20）。这是发生是因为当你调用 `moveDownAndRight`\
    \ 时，没有传递一个数值。\n\n2. **在 `moveDownAndRight` 方法调用的括号之间放入数字 2（参见图 5-21）：**\n\n```\n\
    void draw()\n{\n  background(255, 0, 0);\n  stroke(255, 255, 255);\n  fill(0,\
    \ 0, 250);\n  ellipse(xCoordinate, yCoordinate, 300, 300);\n  moveDownAndRight(2);\n\
    }\n```\n\n3. **将 `moveDownAndRight` 方法体中的两个 2 替换为参数 `speed`（参见图 5-22）：**\n\n```\n\
    void moveDownAndRight(int speed)\n{\n  xCoordinate = xCoordinate + speed;\n  yCoordinate\
    \ = yCoordinate + speed;\n}\n```\n\n4. **点击运行按钮，确保你的圆跨越屏幕时后面没有留下痕迹（参见图 5-17）。**\n\
    \n5. **尝试将参数的值改为 8（参见图 5-23）：**\n\n```\nvoid draw()\n{\n  background(255, 0, 0);\n\
    \  stroke(255, 255, 255);\n  fill(0, 0, 250);\n  ellipse(xCoordinate, yCoordinate,\
    \ 300, 300);\n  moveDownAndRight(8);\n}\n```\n\n"
