    \n    `//Four variables for the location of the top and`\n\n    `//bottom pipes`\n\
    \n    `int xCoordinateTop = 500;`\n\n    `int yCoordinateTop = -300;`\n\n    `int\
    \ xCoordinateBottom = 500;`\n\n    `int yCoordinateBottom = 500;`\n\n    `//Four\
    \ variables for the width and height of the`\n\n    `//top and bottom pipes`\n\
    \n    `int widthTop = topPipe.width;`\n\n    `int heightTop = topPipe.height;`\n\
    \n    `int widthBottom = bottomPipe.width;`\n\n    `int heightBottom = bottomPipe.height;`\n\
    \n3.  **Draw the top and bottom pipes in the constructor and in the** `move` **methods\
    \ in the** `Pipes` **class (as shown in [Figure 11-32](#14_9781119404170-ch11.xhtml_c11-fig-0032)).**\n\
    \n    `//Constructor to create the pipes`\n\n    `Pipes()`\n\n    `{`\n\n    `//Draw\
    \ the pipes in on the canvas`\n\n    `image(topPipe, xCoordinateTop, yCoordinateTop);`\n\
    \n    `image(bottomPipe, xCoordinateBottom, yCoordinateBottom);`\n\n    `}`\n\n\
    \    `//Method to move the pipes`\n\n    `void move()`\n\n    `{`\n\n    `//Redraw\
    \ the pipes on the canvas`\n\n    `image(topPipe, xCoordinateTop, yCoordinateTop);`\n\
    \n    `image(bottomPipe, xCoordinateBottom, yCoordinateBottom);`\n\n    `}`\n\n\
    4.  **In your NinjaBird main class, create a new variable for the pipes (see**\
    \ [**Figure 11-33**](#14_9781119404170-ch11.xhtml_c11-fig-0033)**):**\n\n    `Pipes\
    \ pipes;`\n\n    **Call the `Pipes` constructor in the setup method (refer to**\
    \ [**Figure 11-33**](#14_9781119404170-ch11.xhtml_c11-fig-0033)**):**\n\n    `pipes\
    \ = new Pipes();`\n\n    **And call the pipes `move` method in the `draw` method\
    \ (see** [**Figure 11-33**](#14_9781119404170-ch11.xhtml_c11-fig-0033)**):**\n\
    \n    `pipes.move();`\n\n5.  **Test your code to make sure your pipes are showing\
    \ up on your canvas in the correct locations (see** [**Figure 11-34**](#14_9781119404170-ch11.xhtml_c11-fig-0034)**).**\n\
