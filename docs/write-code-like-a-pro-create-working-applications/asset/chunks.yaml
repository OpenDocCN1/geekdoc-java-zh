    \n7. **If you want to start a new program, choose `File`⇒New` (see** [Figure 1-20](#04_9781119404170-ch01.xhtml_c01-fig-0020)**)..**\n\
    \n   A new Processing window opens (see [Figure 1-21](#04_9781119404170-ch01.xhtml_c01-fig-0021)),\
