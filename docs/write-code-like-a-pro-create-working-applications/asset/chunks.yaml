  trans: "\n你的第一个个人人工智能（AI）已经写好了！这其实就是 AI 的本质：让虚拟角色自己移动的代码！\n\n# 创建你自己的 Java 类\n\n\
    在继续下去之前，你将学习如何创建一个 Java 类。`class`（类）是定义虚拟对象的一种方式。该对象可能具有属性（如位置和颜色），并可能拥有方法（如移动）。通过将敌人和角色代码移动到类中，你可以轻松地创建更多运行良好的敌人和类！\n\
    \n## 创建敌人类\n\n你创建的第一个类是敌人类。这样，如果你需要，就可以添加更多敌人，并且可以轻松地更新它们。\n\n1. 在你的 Sketch 文件底部，创建一个名为\
    \ `Enemy` 的新类（参见图 8-11）。\n\n   ```java\n   class Enemy\n   {\n   }\n   ```\n\n\
    2. 将 Sketch 文件顶部所有的 `enemy` 变量移动到你的 `Enemy` 类中（参见图 8-12）。\n\n   ```java\n   class\
    \ Enemy\n   {\n   PImage enemy;\n   int enemyX = 350;\n   int enemyY = 325;\n\
    \   int enemyMovement = 1;\n   }\n   ```\n\n3. 创建一个构造函数，并将创建敌人的代码从 `setup` 方法移动到构造函数中（参见图\
    \ 8-13）。\n\n   构造函数用于创建对象。将此代码放在 `Enemy` 类的底部。\n\n   ```java\n   Enemy()\n   {\n\
    \   enemy = loadImage(\"crab.png\");\n   image(enemy, enemyX, enemyY);\n   }\n\
    \   ```\n\n4. 在 Sketch 文件顶部创建一个类型为 `Enemy` 且名为 `enemy1` 的新变量。在 `setup` 方法中使用你在第\
    \ 3 步中创建的构造函数来初始化 `enemy1` 变量（参见图 8-14）。\n\n   在 `setup` 方法上方输入此代码，即你之前从第 2 步移动代码的位置：\n\
    \n   ```java\n   Enemy enemy1;\n   ```\n\n   然后在 `setup` 方法底部输入此代码，即你之前第 3 步代码的位置：\n\
    \n   ```java\n   //Create the enemy\n   enemy1 = new Enemy();\n   ```\n\n5. 创建名为\
    \ `move` 的新方法，该方法不返回内容并接收两个名为 `leftX` 和 `rightX` 的整数参数。将 `draw` 方法中移动敌人的代码移动到这个新方法中（参见图\
    \ 8-15）。\n\n   此方法应该位于 `Enemy` 类内部，紧接在你第 3 步中编写的构造函数之后：\n\n   ```java\n   void\
    \ move(int leftX, int rightX)\n   {\n   //Redraw the enemy\n   image(enemy, enemyX,\
    \ enemyY);\n   //Move enemy\n   if(enemyX == 350)\n   {\n   enemyMovement = 1;\n\
    \   }\n   else if(enemyX == 450)\n   {\n   enemyMovement = -1;\n   }\n   enemyX\
    \ = enemyX + enemyMovement;\n   }\n   ```\n\n6. 更新条件语句以使用参数而不是硬编码的值（参见图 8-16）。\n\
    \n   ```java\n   void move(int leftX, int rightX)\n   {\n   //Redraw the enemy\n\
    \   image(enemy, enemyX, enemyY);\n   //Move enemy\n   if(enemyX == leftX)\n \
    \  {\n   enemyMovement = 1;\n   }\n   else if(enemyX == rightX)\n   {\n   enemyMovement\
    \ = -1;\n   }\n   enemyX = enemyX + enemyMovement;\n   }\n   ```\n\n7. 在原始的 `draw`\
    \ 方法中调用新创建的 `move` 方法（参见图 8-17）。确保传递你在第 6 步中替换的原始值。\n\n   ```java\n   //Redraw\
    \ the enemy\n   enemy1.move(350, 450);\n   ```\n\n8. 测试你的敌人是否仍在反复移动。\n\n9. 修改你的\
    \ `Enemy` 构造函数，使其两个参数作为敌人的起始位置（参见图 8-18）。\n\n   ```java\n   Enemy(int x, int y)\n\
    \   {\n   enemyX = x;\n   enemyY = y;\n   enemy = loadImage(\"crab.png\");\n \
    \  image(enemy, enemyX, enemyY);\n   }\n   ```\n\n10. 修改对 `Enemy` 构造函数的调用，让敌人从相同的位置开始（参见图\
    \ 8-19）。此代码代码位于 sketch 主部分的 `setup` 方法中：\n\n    ```java\n    //Create the enemy\n\
    \    enemy1 = new Enemy(350, 325);\n    ```\n\n![images/9781119404170-fg0811.png]\n\
    图 8-11 一个新的空 `Enemy` 类。\n\n![images/9781119404170-fg0812.png]\n图 8-12 在你的 `Enemy`\
    \ 类中添加 `enemy` 变量。\n\n![images/9781119404170-fg0813.png]\n图 8-13 一个 `Enemy` 构造函数。\n\
    \n![images/9781119404170-fg0814.png]\n图 8-14 在主部分创建敌人。\n\n![images/9781119404170-fg0815.png]\n\
    图 8-15 用于移动敌人的 `move` 方法。\n\n![images/9781119404170-fg0816.png]\n图 8-16 使用 `move`\
    \ 方法代替硬编码的值。\n\n![images/9781119404170-fg0817.png]\n图 8-17 在 `draw` 方法中调用 `move`\
    \ 方法。\n\n![images/9781119404170-fg0818.png]\n图 8-18 更新构造函数以接受参数。\n\n![images/9781119404170-fg0819.png]\n\
    图 8-19 更新对构造函数的调用。\n\n## 创建第二个敌人\n\n现在你有了类，添加第二个敌人就很简单！按照以下步骤操作：\n\n1. 在你的 `setup`\
    \ 方法中创建名为 `enemy2` 的另一个 `Enemy` 变量：\n\n   ```java\n   Enemy enemy2;\n   ```\n\n\
    \   然后在 `setup` 方法底部添加此代码：\n\n   ```java\n   enemy2 = new Enemy(650, 325);\n \
    \  ```\n\n2. 在 `draw` 方法中添加另一个 `move` 调用，让 `enemy2` 在岩浆和屏幕边缘之间移动：\n\n   ```java\n\
    \   enemy2.move(650, 900);\n   ```\n\n3. 点击运行确保两个敌人都在移动。\n\n## 创建第二个 Java 类\n\n\
    你创建的第二个类是角色类。虽然在这个游戏中只有一个角色，但创建第二个类可以通过分离代码来清理代码，使其更易读。\n\n1. 创建名为 `Character`\
    \ 的新类（参见图 8-23）。\n\n   将此代码添加到 Sketch 文件的底部，位于 `Enemy` 类下方：\n\n   ```java\n  \
    \ class Character\n   {\n   }\n   ```\n\n2. 创建一个构造函数，正如你在“创建敌人类”节中所做的那样，创建角色并初始化其起始位置（参见图\
    \ 8-24）。\n\n"
- fmt: "\n```java\nclass Character\n{\n  PImage character;\n  int characterX;\n  int\
    \ characterY;\n  Character(int x, int y)\n  {\n    characterX = x;\n    characterY\
    \ = y;\n    character = loadImage(\"penguin.png\");\n    image(character, characterX,\
    \ characterY);\n  }\n}\n```\n\n### 3. **Call the `Character` constructor from\
    \ the `setup` method (see [Figure 8-25](#11_9781119404170-ch08.xhtml_c08-fig-0025)).**\n\
    \nFirst, add this line of code to the very top of your Sketch file:\n`Character\
    \ character;`\n\nThen add this code to the middle of your `setup` method:\n\n\
    ```java\nvoid setup()\n{\n  //Canvas\n  size(1000, 500);\n  //Draw the sky, grass,\
    \ and hills\n  drawScene();\n  //Create the character\n  character = new Character(0,\
    \ 300);\n  //Create the enemies\n  enemy1 = new Enemy(350, 325);\n  enemy2 = new\
    \ Enemy(650, 325);\n}\n```\n\n### 4. **Create a `move` method in the `Character`\
    \ class and move all the character movement code from the `draw` method to the\
    \ new `move` method (see [Figure 8-26](#11_9781119404170-ch08.xhtml_c08-fig-0026)).**\n\
    \n```java\nvoid move()\n{\n  if(characterY < 300)\n  {\n    characterY = characterY\
    \ + 1;\n  }\n  //Redraw the character\n  image(character, characterX, characterY);\n\
    \  //text(characterX, characterX + 60, characterY – 5);\n  //Check to see if the\
    \ character hit the lava\n  if(((characterX >= 150 && characterX <= 310)\n  ||\
    \ (characterX >= 450 && characterX <= 610))\n  && characterY >= 300)\n  {\n  \
    \  text(\"OW!\", characterX + 60, characterY – 5);\n  }\n}\n```\n\n### 5. **Call\
    \ the `move` method from the `draw` method (see [Figure 8-27](#11_9781119404170-ch08.xhtml_c08-fig-0027)).**\n\
    \nThis code should be right above where you called the enemy `move` methods earlier\
    \ in this chapter:\n```java\n//Redraw the character\ncharacter.move();\n```\n\n\
    ### 6. **Create a `keyPressed` method in the `Character` class and move all the\
    \ code from the original `keyPresssed` method into the new one (see [Figure 8-28](#11_9781119404170-ch08.xhtml_c08-fig-0028)).**\n\
    \nInside of the `Character` class:\n\n```java\nvoid keyPressed()\n{\n  if(key\
    \ == 'a')\n  {\n    characterX = characterX – 10;\n  }\n  else if(key == 'd')\n\
    \  {\n    characterX = characterX + 10;\n  }\n  else if(key == ' ')\n  {\n   \
    \ characterY = characterY – 100;\n  }\n}\n```\n\n### 7. **Call the new `keyPressed`\
    \ method from the original `keyPressed` method (see [Figure 8-29](#11_9781119404170-ch08.xhtml_c08-fig-0029)).**\n\
    \nThis code should be typed in the `keyPressed` method in the main sketch:\n\n\
    ```java\nvoid keyPressed()\n{\n  character.keyPressed();\n}\n```\n\n### 8. **Test\
    \ to make sure your character still moves when you press A or D, still jumps when\
    \ you press the spacebar, still falls when it’s above the ground, and still says\
    \ “OW!” when it touches lava.**\n\n![image](images/9781119404170-fg0823.png)\n\
    \n[FIGURE 8-23:](#11_9781119404170-ch08.xhtml_rc08-fig-0023) A new `Character`\
    \ class.\n\n![image](images/9781119404170-fg0824.png)\n\n[FIGURE 8-24:](#11_9781119404170-ch08.xhtml_rc08-fig-0024)\
    \ Create a constructor to create the character.\n\n![image](images/9781119404170-fg0825.png)\n\
    \n[FIGURE 8-25:](#11_9781119404170-ch08.xhtml_rc08-fig-0025) Create the character\
    \ in the `setup` method.\n\n![image](images/9781119404170-fg0826.png)\n\n[FIGURE\
    \ 8-26:](#11_9781119404170-ch08.xhtml_rc08-fig-0026) The new `move` method in\
    \ the `Character` class.\n\n![image](images/9781119404170-fg0827.png)\n\n[FIGURE\
    \ 8-27:](#11_9781119404170-ch08.xhtml_rc08-fig-0027) Call the new `move` method.\n\
    \n![image](images/9781119404170-fg0828.png)\n\n[FIGURE 8-28:](#11_9781119404170-ch08.xhtml_rc08-fig-0028)\
    \ The `keyPressed` method in the new `Character` class.\n\n![image](images/9781119404170-fg0829.png)\n\
    \n[FIGURE 8-29:](#11_9781119404170-ch08.xhtml_rc08-fig-0029) Call the `Character`\
    \ `keyPressed` from the original `keyPressed`.\n\n## ADDING HEALTH TO YOUR CHARACTER\n\
    \nNow that you have a working game, the only thing you need to do is to add a\
    \ variable that keeps track of health. This will make your players want to avoid\
    \ the lava and enemies. Follow these steps:\n\n1. **Add a variable at the top\
    \ of your `Character` class called `health` that has a type integer and a value\
    \ 100 (see [Figure 8-30](#11_9781119404170-ch08.xhtml_rc08-fig-0030)).**\n   `int\
    \ health = 100;`\n\n2. **Create a method called `updateHealth` that doesn’t return\
    \ a value and doesn’t have any parameters (see [Figure 8-31](#11_9781119404170-ch08.xhtml_rc08-fig-0031)).**\n\
    \   The method will reduce the health by 1 point.\n   ```java\n   void updateHealth()\n\
    \   {\n     health = health - 1;\n   }\n   ```\n\n3. **Add a line of code to your\
    \ `Character` `move` method that calls `updateHealth` every time the character\
    \ touches the lava (see [Figure 8-32](#11_9781119404170-ch08.xhtml_rc08-fig-0032)).**\n\
    \   This line of code should go inside the conditional statement at the bottom\
    \ of your `move` method:\n   ```java\n   text(\"OW!\", characterX + 60, characterY\
    \ – 5);\n   updateHealth();\n   ```\n\n4. **Create a method called `getHealth`\
    \ that returns an integer (the health) and does not have any parameters (see [Figure\
    \ 8-33](#11_9781119404170-ch08.xhtml_rc08-fig-0033)).**\n   You can type this\
    \ code underneath your `Character` constructor:\n   ```java\n   int getHealth()\n\
    \   {\n     return health;\n   }\n   ```\n\n5. **Make sure the `drawScene` method\
    \ is called last in your original setup method (see [Figure 8-34](#11_9781119404170-ch08.xhtml_rc08-fig-0034)).**\n\
    \   ```java\n   void setup()\n   {\n     //Canvas\n     size(1000, 500);\n   \
    \  //Create the character\n     character = new Character(0, 300);\n     //Create\
    \ the enemies\n     enemy1 = new Enemy(350, 325);\n     enemy2 = new Enemy(650,\
    \ 325);\n     //Draw the sky, grass, and hills\n     drawScene();\n   }\n   ```\n\
    \   This is important because the character must be created first so that you\
