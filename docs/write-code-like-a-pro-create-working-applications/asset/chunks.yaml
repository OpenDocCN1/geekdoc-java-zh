- fmt: '

    ![](images/cover.jpg)


    # INTRODUCTION


    So you want to make your very own videogame? And you want to learn how to code
    in Java? That is an awesome idea!


    Writing Java code can be really hard work, especially writing Java code to make
    a videogame. For example, the original Legend of Zelda took more than 100 people
    three years to make! But don’t worry, this book will guide your through all the
    steps to learn the basics of Java programming and to make two videogames of your
    own. The first game you’ll make is kind of like Mario, where you have a character
    that runs across the screen and tries to avoid lava pits and enemies. The second,
    larger game that you’ll code is kind of like Flappy Bird. It’s called `Ninja Bird`.
    Keeping track of scores, making pipes move on their own randomly, and even helping
    the bird fly — you’ll have your friends playing games you make for hours!


    ## ABOUT THIS BOOK


    This book uses a computer application called `Processing` that was made to make
    coding Java video games much easier. As you’ll see, you can easily make drawings
    with different shapes and colors, you can add images that you find online (with
    adult permission, of course!) into your drawing and games, and it comes with an
    entire library of code that you get to just use. It’s free, and available online.
    In the first chapter, you’ll learn how to download it and begin using it in just
    a couple of simple steps.


    *Write Code Like a Pro* has three different types of programs that you’ll write.
    First, you’ll make a simple drawing using a lot of what `Processing` provides
    to you in its library. With shapes and colors, the first couple chapters of this
    book guide you through an art program. The next part of this book teaches you
    how to turn that drawing into an animation — making shapes and images move around
    the canvas. Finally, you’ll get a chance to build two different videogames.


    Though this book will guide you step-by-step in making these games, you’re highly
    encouraged to keep coding after you finish this book and make variations of the
    games you learn here! This is just the beginning of your coding and videogame
    development career. With this book as a starting point, you never know what you
    can achieve!


    ## FOOLISH ASSUMPTIONS


    Everybody has to start somewhere, right? I had to start writing this book by assuming
    that you’re comfortable doing this stuff:


    *   **Typing on a computer and using a mouse:** You may know how to use a Windows
    system or a Mac; either one will do. This book shows examples on a Mac.

    *   **Following instructions:** Coding is very precise. There are a lot of pieces
    of the puzzle when you’re making an application. It’s very important that you
    already know how to follow instructions carefully, and compare pictures in the
    book to what you’re making on your own.


    ## ICONS USED IN THIS BOOK


    As you read through the projects in this book, you’ll see icons. The icons point
    out different things:


    ![remember](images/remember.png) The Remember icon highlights ideas that you should
    keep in mind.


    ![tip](images/tip.png) The Tip icon marks advice and shortcuts that can make coding
    easier.


    ## WHERE TO GO FROM HERE


    In this book, it’s best if you start from [Chapter 1](#04_9781119404170-ch01.xhtml)
    and move through to [Chapter 12](#15_9781119404170-ch12.xhtml). There are some
    things you learn in early chapters that really help you complete the larger problems
    in later chapters. The chapters in this book do fall under three categories: [Chapters
    1](#04_9781119404170-ch01.xhtml) through [6](#09_9781119404170-ch06.xhtml) guide
    you through the basics of coding in Java with a drawing canvas; you’ll get to
    learn how to make shapes, add color, make objects move, and even have user interaction
    — all very important for coding a videogame. [Chapters 7](#10_9781119404170-ch07.xhtml)
    through [8](#11_9781119404170-ch08.xhtml) guide you through making your very first
    videogame! This game is similar to Mario, but just a preview to videogame making.
    Finally, [Chapters 9](#12_9781119404170-ch09.xhtml) through [12](#15_9781119404170-ch12.xhtml)
    guide you through making Ninja Bird, which is a game like Flappy Bird.


    ![image](images/c1.png)


    So, you want to learn how to code in Java. That’s a great goal! In this book,
    you’ll learn the basics of Java while learning how to make a videogame! Coding
    can be tricky. Sometimes it’s frustrating. Remember to keep trying, test your
    code, and double-check that you’ve typed everything correctly. With dedication,
    you’ll learn a lot and have fun doing it!


    In this chapter, you’ll install the `Processing` application, which will allow
    you to write Java code. Then you’ll get a chance to test out some real Java code
    and make sure you understand how the application will work throughout the rest
    of the book.


    ## GETTING STARTED WITH PROCESSING


    To get started with Java, you’ll be using a programming environment called `Processing`.
    `Processing` comes with a library that helps make coding Java video games much
    easier.


    ### DOWNLOADING AND INSTALLING


    To get started with `Processing`, you need to download and install it. Follow
    these steps:


    1.  Go to `www.processing.org` and click the Download button.

    2.  Find the operating system you’re using (see [Figure 1-1](#04_9781119404170-ch01.xhtml)),
    and choose the correct version.

    3.  After the file downloads, unzip the file.


    ![image](images/9781119404170-fg01.png)

    [FIGURE 1-1](#04_9781119404170-ch01.xhtml) The Processing website.


    ![image](images/9781119404170-fg02.png)

    [FIGURE 1-2](#04_9781119404170-ch01.xhtml) Options for downloading.


    ![image](images/9781119404170-fg03.png)

    [FIGURE 1-3](#04_9781119404170-ch01.xhtml) Optional contribution.


    ### STARTING TO USE PROCESSING


    Now that you have `Processing` installed, you can start using it. Follow these
    steps:


    1.  Double-click the `Processing` file.

    2.  The first time you open `Processing`, you might get an alert that asks if
    you’re sure you want to open the file (see [Figure 1-4](#04_9781119404170-ch01.xhtml)).
    Open.

    3.  Uncheck the Show This Message Each Time box and then click the Get Started
    button.


    A new `Sketch` opens. A `Sketch` is what `Processing` calls a program file. You’ll
    notice that the `Sketch` has Java as the programming language set in the upper
    right of the screen (see [Figure 1-5](#04_9781119404170-ch01.xhtml)).


    ![image](images/9781119404170-fg04.png)

    [FIGURE 1-4](#04_9781119404170-ch01.xhtml) A warning you might see when opening
    Processing the first time.


    ![image](images/9781119404170-fg05.png)

    [FIGURE 1-5](#04_9781119404170-ch01.xhtml) A welcome screen.


    ![image](images/97811119404170-fg06.png)

    [FIGURE 1-6](#04_9781119404170-ch01.xhtml) The Processing window with a new Sketch
    opened.


    ### TRYING SOME CODE

    Now that you have `Processing` open, you can test out some code to make sure everything
    is working!

