  trans: "\n\n5. **添加对 `text` 方法调用，让角色在接触岩浆时说“OW!”（参见图 7-39）：**\n\n```javascript\n\
    //text(characterX, characterX + 60, characterY – 5);\n//Check to see if the character\
    \ hit the lava\nif((characterX >= 150 && characterX <= 310) || (characterX >=\
    \ 450 && characterX <= 610))\n{\n    text(\"OW!\", characterX + 60, characterY\
    \ – 5);\n}\n```\n注释掉你在第 2 步中添加的代码，使其只在接触岩浆时才说话。\n\n6. **在你的条件语句中添加最后一个条件，以确保你的角色只有在接触岩浆时才说“OW!”，而不是跳到它上方（参见图\
    \ 7-40）：**\n\n```javascript\n//Check to see if the character hit the lava\nif((characterX\
    \ >= 150 && characterX <= 310) || (characterX >= 450 && characterX <= 610)) &&\
    \ characterY >= 300)\n{\n    text(\"OW!\", characterX + 60, characterY – 5);\n\
    }\n```\n\n![image](img/9781119404170-fg0735.png)\n\nFIGURE 7-35: 使用 `arc` 方法创建岩浆坑而非丘丘。\n\
    \n![image](img/9781119404170-fg0736.png)\n\nFIGURE 7-36: 使用 `text` 方法收集有关角色的信息。\n\
    \n![image](img/9781119404170-fg0737.png)\n\nFIGURE 7-37: 添加条件语句来测试角色是否正在接触第一个岩浆。\n\
    \n![image](img/9781119404170-fg0738.png)\n\nFIGURE 7-38: 添加条件语句以测试角色是否正在接触第二个岩浆。\n\
    \n![image](img/9781119404170-fg0739.png)\n\nFIGURE 7-39: 添加对 `text` 方法的调用，在接触岩浆时说“OW!”。\n\
    \n![image](img/9781119404170-fg0740.png)\n\nFIGURE 7-40: 添加额外条件以确保角色在岩浆地面上，而不是在它上空中。\n\
    \n恭喜你！你制作了一个小游戏。在这个游戏中，目标是避开岩浆坑，让你的角色不受伤！在下一章中，你将为你的游戏添加分数和其他角色。\n\n![image](img/c8.png)\n\
    \n这一章非常精彩！在这里，你将为游戏添加新角色，这些角色不是由玩家控制的，而是由你的代码控制！这就是人工智能，这也是本章的主题。\n\n## 在你的视频游戏中添加一个敌人\n\
    \n创建人工智能的第一步是将敌人引入你的游戏。\n\n1. **打开 Processing 应用程序，并打开你在第 7 章中创建的 FirstVideoGame\
    \ Sketch (#10_9781119404170-ch07.xhtml)（参见图 8-1）。**\n\n2. **在网上找到另一个角色，下载它并保存到你的\
    \ FirstVideoGame 文件夹中（参见图 8-2）。**\n\n   你可以使用我在第 7 章中介绍的技巧](#10_9781119404170-ch07.xhtml），转到向你的视频游戏添加角色\
    \ 部分。\n\n3. **添加创建敌人代码，将其放置在视频游戏中，并控制它的 x 和 y 位置（参见图 8-3）。**\n\n   首先，在 `setup`\
    \ 方法上方添加此代码：\n```javascript\nPImage enemy;\nint enemyX = 200;\nint enemyY = 300;\n\
    ```\n   然后，在 `setup` 方法底部添加此代码：\n```javascript\n//Create the enemy\nenemy = loadImage(\"\
    crab.png\");\nimage(enemy, enemyX, enemyY);\n```\n\n4. **每次调用 `draw` 方法时添加一行代码来重绘敌人（参见图\
    \ 8-4）。**\n\n   此代码应添加到你的 `draw` 方法底部：\n```javascript\n//Redraw the enemy\nimage(enemy,\
    \ enemyX, enemyY);\n```\n\n5. **测试你的代码，确保你的第一个敌人出现在你想的地方（参见图 8-5）。**\n\n6. **调整敌人的起始位置使其更真实（参见图\
    \ 8-6）。**\n\n   将 `setup` 方法上方的代码改为：\n```javascript\nPImage enemy;\nint enemyX\
    \ = 350;\nint enemyY = 325;\n```\n\n![image](img/9781119404170-fg0801.png)\n\n\
    FIGURE 8-1: 第 7 章的 Sketch 程序(#10_9781119404170-ch07.xhtml)。\n\n![image](img/9781119404170-fg0802.png)\n\
    \nFIGURE 8-2: 将敌人图像下载到你的 FirstVideoGame 文件夹。\n\n![image](img/9781119404170-fg0803.png)\n\
    \nFIGURE 8-3: 在画布上创建敌人的代码。\n\n![image](img/9781119404170-fg0804.png)\n\nFIGURE\
    \ 8-4: 重绘敌人使其移动的代码。\n\n![image](img/9781119404170-fg0805.png)\n\nFIGURE 8-5: 第一次在你的视频游戏中敌人。\n\
    \n![image](img/9781119404170-fg0806.png)\n\nFIGURE 8-6: 修改代码将敌人正确放置在画布上。\n\n太棒了！现在你的视频游戏里既有角色又有敌人！\n\
    \n## 让敌人移动\n\n下一步是让敌人通过代码移动，而不是通过用户输入（如键盘或鼠标）。开始，敌人将在两个岩浆坑之间移动，为玩家增加额外的难度。为了做到，你将使用一个新变量来跟踪敌人应该向左（–1）还是向右（+1）。\n\
    \n1. **创建一个名为 `enemyMovement` 的新变量并初始化为 1（参见图 8-7）。**\n\n   在你的 `setup` 方法上方添加此行代码：\n\
    ```javascript\nint enemyMovement = 1;\n```\n\n2. **添加条件语句，根据敌人到达哪个岩浆来更新 `enemyMovement`\
    \ 变量（参见图 8-8）。**\n\n   如果敌人到达左岩浆（`enemyX = 350`），它应该向右移动（+1）。如果敌人到达右岩浆（`enemyX\
    \ = 450`），它应该向左移动（–1）。\n\n   此代码应添加到你的 `draw` 方法底部：\n```javascript\n//Move enemy\n\
    if(enemyX == 350)\n{\n    enemyMovement = 1;\n}\nelse if(enemyX == 450)\n{\n \
    \   enemyMovement = -1;\n}\n```\n\n3. **根据第 2 步将敌人的 `enemyX` 更新为 1 或 –1（参见图 8-9）。**\n\
    \n   此代码应添加到你的 `draw` 方法底部：\n```javascript\nenemyX = enemyX + enemyMovement;\n\
    ```\n\n4. **通过点击运行按钮测试代码，确保敌人在两个岩浆之间来回移动（参见图 8-10）。**\n\n![image](img/9781119404170-fg0807.png)\n\
    \nFIGURE 8-7: 设置敌人方向的 `enemyMovement` 变量。\n\n![image](img/9781119404170-fg0808.png)\n\
    \nFIGURE 8-8: 切换敌人方向的条件语句。\n\n![image](img/9781119404170-fg0809.png)\n\nFIGURE\
    \ 8-9: 根据第 4 步的条件语句让敌人左右移动的代码。\n\n"
- fmt: "Your first artificial intelligence (AI) has been written! That’s all AI really\
    \ is: code that makes virtual characters move on their own!\n\n# CREATING YOUR\
    \ OWN JAVA CLASS\n\nBefore moving on, you’re going to learn how to create a Java\
    \ class. A `class` is a way of defining a virtual object. The object might have\
    \ properties (like location and color) and might have methods (like movement).\
    \ By moving your enemy and character code to classes, you can easily create more\
    \ enemies and classes that work!\n\n## CREATING AN ENEMY CLASS\n\nThe first class\
    \ you’ll create is the enemy class. That way you can add more enemies if you want,\
    \ and you can update them all with ease.\n\n1. At the bottom of your Sketch file,\
    \ create a new class called `Enemy` (see [Figure 8-11](#11_9781119404170-ch08.xhtml_c08-fig-0011)).\n\
    \n   ```java\n   class Enemy\n   {\n   }\n   ```\n\n2. Move all the `enemy` variables\
    \ from the top of your Sketch file to your `Enemy` class (see [Figure 8-12](#11_9781119404170-ch08.xhtml_c08-fig-0012)).\n\
    \n   ```java\n   class Enemy\n   {\n   PImage enemy;\n   int enemyX = 350;\n \
    \  int enemyY = 325;\n   int enemyMovement = 1;\n   }\n   ```\n\n3. Create a constructor\
    \ and move the create enemy code from the `setup` method to the constructor (see\
    \ [Figure 8-13](#11_9781119404170-ch08.xhtml_c08-fig-0013)).\n\n   A constructor\
    \ is the creation of the object. Put this code at the bottom of your `Enemy` class.\n\
    \n   ```java\n   Enemy()\n   {\n   enemy = loadImage(\"crab.png\");\n   image(enemy,\
    \ enemyX, enemyY);\n   }\n   ```\n\n4. Create a new variable at the top of your\
    \ Sketch file that is of type `Enemy` and named `enemy1`. Initialize the `enemy1`\
    \ variable in your `setup` method by using the constructor you made in Step 3\
    \ (see [Figure 8-14](#11_9781119404170-ch08.xhtml_c08-fig-0014)).\n\n   Type this\
    \ code above your `setup` method, where the code you moved from Step 2 used to\
    \ be:\n\n   ```java\n   Enemy enemy1;\n   ```\n\n   Then type this code at the\
    \ bottom of your `setup` method, where the code from Step 3 used to be:\n\n  \
    \ ```java\n   //Create the enemy\n   enemy1 = new Enemy();\n   ```\n\n5. Create\
    \ a new method called `move` that returns nothing and takes in two integer parameters\
    \ called `leftX` and `rightX`. Move the code from the `draw` method that moves\
    \ the enemy into this new method (see [Figure 8-15](#11_9781119404170-ch08.xhtml_c08-fig-0015)).\n\
    \n   This method should be inside your `Enemy` class, just below the constructor\
    \ you wrote in Step 3:\n\n   ```java\n   void move(int leftX, int rightX)\n  \
    \ {\n   //Redraw the enemy\n   image(enemy, enemyX, enemyY);\n   //Move enemy\n\
    \   if(enemyX == 350)\n   {\n   enemyMovement = 1;\n   }\n   else if(enemyX ==\
    \ 450)\n   {\n   enemyMovement = -1;\n   }\n   enemyX = enemyX + enemyMovement;\n\
    \   }\n   ```\n\n6. Update the conditional statement to use the parameters instead\
    \ of the hard-coded values (see [Figure 8-16](#11_9781119404170-ch08.xhtml_c08-fig-0016)).\n\
    \n   ```java\n   void move(int leftX, int rightX)\n   {\n   //Redraw the enemy\n\
    \   image(enemy, enemyX, enemyY);\n   //Move enemy\n   if(enemyX == leftX)\n \
    \  {\n   enemyMovement = 1;\n   }\n   else if(enemyX == rightX)\n   {\n   enemyMovement\
    \ = -1;\n   }\n   enemyX = enemyX + enemyMovement;\n   }\n   ```\n\n7. Call the\
    \ new `move` method that you just created in the original `draw` method (see [Figure\
    \ 8-17](#11_9781119404170-ch08.xhtml_c08-fig-0017)).\n\n   Make sure you pass\
    \ the original values that you replaced in Step 6 as the parameters.\n\n   ```java\n\
    \   //Redraw the enemy\n   enemy1.move(350, 450);\n   ```\n\n8. Test to make sure\
    \ your enemy still moves back and forth.\n\n9. Modify your `Enemy` constructor\
    \ to have two parameters, which are the start locations of the enemy (see [Figure\
    \ 8-18](#11_9781119404170-ch08.xhtml_c08-fig-0018)).\n\n   ```java\n   Enemy(int\
    \ x, int y)\n   {\n   enemyX = x;\n   enemyY = y;\n   enemy = loadImage(\"crab.png\"\
    );\n   image(enemy, enemyX, enemyY);\n   }\n   ```\n\n10. Modify the call to the\
    \ `Enemy` constructor to still have the enemy start at the same location (see\
    \ [Figure 8-19](#11_9781119404170-ch08.xhtml_c08-fig-0019)).\n\n    This code\
    \ is in your `setup` method in the main part of the sketch:\n\n    ```java\n \
    \   //Create the enemy\n    enemy1 = Enemy(350, 325);\n    ```\n\n![image](images/9781119404170-fg0811.png)\n\
    \n[FIGURE 8-11:](#11_9781119404170-ch08.xhtml_rc08-fig-0011) A new empty `Enemy`\
    \ class.\n\n![image](images/9781119404170-fg0812.png)\n\n[FIGURE 8-12:](#11_9781119404170-ch08.xhtml_rc08-fig-0012)\
    \ Add `enemy` variables to your `Enemy` class.\n\n![image](images/9781119404170-fg0813.png)\n\
    \n[FIGURE 8-13:](#11_9781119404170-ch08.xhtml_rc08-fig-0013) An `Enemy` constructor.\n\
    \n![image](images/9781119404170-fg0814.png)\n\n[FIGURE 8-14:](#11_9781119404170-ch08.xhtml_rc08-fig-0014)\
    \ Creating the enemy in the main part.\n\n![image](images/9781119404170-fg0815.png)\n\
    \n[FIGURE 8-15:](#11_9781119404170-ch08.xhtml_rc08-fig-0015) The `move` method\
    \ to move the enemy.\n\n![image](images/9781119404170-fg0816.png)\n\n[FIGURE 8-16:](#11_9781119404170-ch08.xhtml_rc08-fig-0016)\
    \ Use the `move` method instead of hard-coded values.\n\n![image](images/9781119404170-fg0817.png)\n\
    \n[FIGURE 8-17:](#11_9781119404170-ch08.xhtml_rc08-fig-0017) Call the `move` method\
    \ in the `draw` method.\n\n![image](images/9781119404170-fg0818.png)\n\n[FIGURE\
    \ 8-18:](#11_9781119404170-ch08.xhtml_rc08-fig-0018) Update the constructor to\
    \ accept parameters.\n\n![image](images/9781119404170-fg0819.png)\n\n[FIGURE 8-19:](#11_9781119404170-ch08.xhtml_rc08-fig-0019)\
    \ Update the call to the constructor.\n\n## CREATING SECOND ENEMY\n\nNow that\
    \ you have a class, it’s easy to add a second enemy! Follow these steps:\n\n1.\
    \ Create another `Enemy` variable called `enemy2` in your `setup` method:\n\n\
    \   ```java\n   Enemy enemy2;\n   ```\n\n   Then add this code to the bottom of\
    \ `setup` method:\n\n   ```java\n   enemy2 = new Enemy(650, 325);\n   ```\n\n\
    2. Add another `move` call in your `draw` method, this time moving `enemy2` between\
    \ the lava pits and the edge of the screen:\n\n   ```java\n   enemy2.move(650,\
    \ 900);\n   ```\n\n3. Press Run to make sure both enemies are moving.\n\n## CREATING\
    \ A SECOND JAVA CLASS\n\nThe second class that you’ll create is the class for\
    \ the character. Even though you’ll only have one character in this game, creating\
    \ a second class will help clean up the code by separating the code, making it\
    \ easier to read.\n\n1. Create a new class called `Character` (see [Figure 8-23](#11_9781119404170-ch08.xhtml_c08-fig-0023)).\n\
    \n   Add this code to the bottom of your Sketch file, under the `Enemy` class:\n\
    \n   ```java\n   class Character\n   {\n   }\n   ```\n\n2. Create a constructor\
    \ like you did in the section called \"[Creating an Enemy class](#11_9781119404170-ch08.xhtml_c08-sec-0005),\"\
    \ where you create the character and initialize its starting location (see [Figure\
    \ 8-24](#11_9781119404170-ch08.xhtml_c08-fig-0024)).\n"
  raw: "Your first artificial intelligence (AI) has been written! That’s all AI really\
    \ is: code that makes virtual characters move on their own!\n\n## CREATING YOUR\
    \ OWN JAVA CLASS\n\nBefore moving on, you’re going to learn how to create a Java\
    \ class. A *class* is way of defining a virtual object. The object might have\
    \ properties (like location and color) and might have methods (like movement).\
    \ By moving your enemy and character code to classes, you can easily create more\
    \ enemies and classes that work!\n\n### CREATING AN ENEMY CLASS\n\nThe first class\
    \ you’ll create is the enemy class. That way you can add more enemies if you want,\
    \ and you can update them all with ease.\n\n1.  **At the bottom of your Sketch\
    \ file, create a new class called** `Enemy` **(see** [**Figure 8-11**](#11_9781119404170-ch08.xhtml_c08-fig-0011)**).**\n\
    \n    `class Enemy`\n\n    `{`\n\n    `}`\n\n2.  **Move all the** `enemy` **variables\
    \ from the top of your Sketch file to your** `Enemy` **class (see** [**Figure\
    \ 8-12**](#11_9781119404170-ch08.xhtml_c08-fig-0012)**).**\n\n    `class Enemy`\n\
    \n    `{`\n\n    **`PImage enemy;`**\n\n    **`int enemyX = 350;`**\n\n    **`int\
    \ enemyY = 325;`**\n\n    **`int enemyMovement = 1;`**\n\n    `}`\n\n3.  **Create\
    \ a constructor and move the create enemy code from the setup method to the constructor\
    \ (see** [**Figure 8-13**](#11_9781119404170-ch08.xhtml_c08-fig-0013)**).**\n\n\
    \    A constructor is the creation of the object. Put this code at the bottom\
    \ of your `Enemy` class.\n\n    `Enemy()`\n\n    `{`\n\n    **`enemy = loadImage(\"\
    crab.png\");`**\n\n    **`image(enemy, enemyX, enemyY);`**\n\n    `}`\n\n4.  **Create\
    \ a new variable at the top of your Sketch file that is of type** `Enemy` **and\
    \ named** `enemy1`**. Initialize the** `enemy1` **variable in your** `setup` **method\
    \ by using the constructor you made in Step 3 (see** [**Figure 8-14**](#11_9781119404170-ch08.xhtml_c08-fig-0014)**).**\n\
    \n    Type this code above your `setup` method, where the code you moved from\
    \ Step 2 used to be:\n\n    `Enemy enemy1;`\n\n    Then type this code at the\
    \ bottom of your `setup` method, where the code from Step 3 used to be:\n\n  \
    \  `//Create the enemy`\n\n    `enemy1 = new Enemy();`\n\n5.  **Create a new method\
    \ called** `move` **that returns nothing and takes in two integer parameters called**\
    \ `leftX` **and** `rightX`**. Move the code from the** `draw` **method that moves\
    \ the enemy into this new method (see** [**Figure 8-15**](#11_9781119404170-ch08.xhtml_c08-fig-0015)**).**\n\
    \n    This method should be inside your `Enemy` class, just below the constructor\
    \ you wrote in Step 3:\n\n    `void move(int leftX, int rightX)`\n\n    `{`\n\n\
    \    `//Redraw the enemy`\n\n    `image(enemy, enemyX, enemyY);`\n\n    `//Move\
    \ enemy`\n\n    `if(enemyX == 350)`\n\n    `{`\n\n    `enemyMovement = 1;`\n\n\
    \    `}`\n\n    `else if(enemyX == 450)`\n\n    `{`\n\n    `enemyMovement = -1;`\n\
    \n    `}`\n\n    `enemyX = enemyX + enemyMovement;`\n\n    `}`\n\n6.  **Update\
    \ the conditional statement to use the parameters instead of the hard-coded values\
    \ (see** [**Figure 8-16**](#11_9781119404170-ch08.xhtml_c08-fig-0016)**).**\n\n\
    \    `void move(int leftX, int rightX)`\n\n    `{`\n\n    `//Redraw the enemy`\n\
    \n    `image(enemy, enemyX, enemyY);`\n\n    `//Move enemy`\n\n    `if(enemyX\
    \ ==` **`leftX`**`)`\n\n    `{`\n\n    `enemyMovement = 1;`\n\n    `}`\n\n   \
    \ `else if(enemyX ==` **`rightX`**`)`\n\n    `{`\n\n    `enemyMovement = -1;`\n\
    \n    `}`\n\n    `enemyX = enemyX + enemyMovement;`\n\n    `}`\n\n7.  **Call the\
    \ new** `move` **method that you just created in the original** `draw` **method\
    \ (see** [**Figure 8-17**](#11_9781119404170-ch08.xhtml_c08-fig-0017)**).**\n\n\
    \    Make sure you pass the original values that you replaced in Step 6 as the\
    \ parameters.\n\n    `//Redraw the enemy`\n\n    `enemy1.move(350, 450);`\n\n\
    8.  **Test to make sure your enemy still moves back and forth.**\n\n9.  **Modify\
    \ your** `Enemy` **constructor to have two parameters, which are the start locations\
    \ of the enemy (see** [**Figure 8-18**](#11_9781119404170-ch08.xhtml_c08-fig-0018)**).**\n\
    \n    `Enemy(`**`int x, int y`**`)`\n\n    `{`\n\n    **`enemyX = x;`**\n\n  \
    \  **`enemyY = y;`**\n\n    `enemy = loadImage(\"crab.png\");`\n\n    `image(enemy,\
    \ enemyX, enemyY);`\n\n    `}`\n\n10.  **Modify the call to the** `Enemy` **constructor\
    \ to still have the enemy start at the same location (see** [**Figure 8-19**](#11_9781119404170-ch08.xhtml_c08-fig-0019)**).**\n\
    \n    This code is in your `setup` method in the main part of the sketch:\n\n\
    \    `//Create the enemy`\n\n    `enemy1 = Enemy(`**`350, 325`**`);`\n\n![image](images/9781119404170-fg0811.png)\n\
    \n[FIGURE 8-11:](#11_9781119404170-ch08.xhtml_rc08-fig-0011) A new empty `Enemy`\
    \ class.\n\n![image](images/9781119404170-fg0812.png)\n\n[FIGURE 8-12:](#11_9781119404170-ch08.xhtml_rc08-fig-0012)\
    \ Add `enemy` variables to your `Enemy` class.\n\n![image](images/9781119404170-fg0813.png)\n\
    \n[FIGURE 8-13:](#11_9781119404170-ch08.xhtml_rc08-fig-0013) An `Enemy` constructor.\n\
    \n![image](images/9781119404170-fg0814.png)\n\n[FIGURE 8-14:](#11_9781119404170-ch08.xhtml_rc08-fig-0014)\
    \ Creating the enemy in the main Sketch coding area.\n\n![image](images/9781119404170-fg0815.png)\n\
    \n[FIGURE 8-15:](#11_9781119404170-ch08.xhtml_rc08-fig-0015) The `move` method\
    \ to move the enemy.\n\n![image](images/9781119404170-fg0816.png)\n\n[FIGURE 8-16:](#11_9781119404170-ch08.xhtml_rc08-fig-0016)\
    \ Use the `move` method parameters instead of hard-coded values.\n\n![image](images/9781119404170-fg0817.png)\n\
    \n[FIGURE 8-17:](#11_9781119404170-ch08.xhtml_rc08-fig-0017) Call the `move` method\
    \ in the `draw` method.\n\n![image](images/9781119404170-fg0818.png)\n\n[FIGURE\
    \ 8-18:](#11_9781119404170-ch08.xhtml_rc08-fig-0018) Update the constructor to\
    \ accept parameters.\n\n![image](images/9781119404170-fg0819.png)\n\n[FIGURE 8-19:](#11_9781119404170-ch08.xhtml_rc08-fig-0019)\
    \ Update the call to the constructor to provide parameters.\n\n### CREATING A\
    \ SECOND ENEMY\n\nNow that you have a class for your enemies, it’s easy to add\
    \ a second enemy! Follow these steps:\n\n1.  **Create another** `Enemy` **variable\
    \ called** `enemy2` **and create a new enemy in your setup method (see** [**Figure\
    \ 8-20**](#11_9781119404170-ch08.xhtml_c08-fig-0020)**).**\n\n    First, add this\
    \ code right above your `setup` method:\n\n    `Enemy enemy2;`\n\n    Then add\
    \ this code at the bottom of your `setup` method:\n\n    `enemy2 = new Enemy(650,\
    \ 325);`\n\n2.  **Add another** `move` **call in your** `draw` **method, this\
    \ time moving** `enemy2` **between the second lava pit and the edge of the screen\
    \ (see** [**Figure 8-21**](#11_9781119404170-ch08.xhtml_c08-fig-0021)**).**\n\n\
    \    This code should be added to the very end of your `draw` method:\n\n    `enemy2.move(650,\
    \ 900);`\n\n3.  **Press the Run button to make sure both enemies are moving between\
    \ the lava pits and the edges (see** [**Figure 8-22**](#11_9781119404170-ch08.xhtml_c08-fig-0022)**).**\n\
    \n![image](images/9781119404170-fg0820.png)\n\n[FIGURE 8-20:](#11_9781119404170-ch08.xhtml_rc08-fig-0020)\
    \ A second enemy in the videogame.\n\n![image](images/9781119404170-fg0821.png)\n\
    \n[FIGURE 8-21:](#11_9781119404170-ch08.xhtml_rc08-fig-0021) Moving the second\
    \ enemy in the videogame.\n\n![image](images/9781119404170-fg0822.png)\n\n[FIGURE\
    \ 8-22:](#11_9781119404170-ch08.xhtml_rc08-fig-0022) Testing the second enemy.\n\
    \nYou now can add as many enemies as you want!\n\n## CREATING A SECOND JAVA CLASS\n\
    \nThe second class that you’ll create is the class for the character. Even though\
    \ you’ll only have one character in this game, creating a second class will help\
    \ clean up the code by separating the code, making it easier to read.\n\n1.  **Create\
    \ a new class called** `Character` **(see** [**Figure 8-23**](#11_9781119404170-ch08.xhtml_c08-fig-0023)**).**\n\
    \n    Add this code to the bottom of your Sketch file, under the `Enemy` class:\n\
    \n    `class Character`\n\n    `{`\n\n    `}`\n\n2.  **Create a constructor like\
    \ you did in the section called “**[**Creating an Enemy class**](#11_9781119404170-ch08.xhtml_c08-sec-0005)**,”\
    \ where you create the character and initialize its starting location (see** [**Figure\
    \ 8-24**](#11_9781119404170-ch08.xhtml_c08-fig-0024)**).**"
