    \ Look for images you can use and modify.\n\n![image](images/9781119404170-fg0709.png)\n\
    \n[FIGURE 7-9:](#10_9781119404170-ch07.xhtml_rc07-fig-0009) Choose a character.\n\
    \n![image](images/9781119404170-fg0710.png)\n\n[FIGURE 7-10:](#10_9781119404170-ch07.xhtml_rc07-fig-0010)\
    \ Download the image.\n\n![image](images/9781119404170-fg0711.png)\n\n[FIGURE\
    \ 7-11:](#10_9781119404170-ch07.xhtml_rc07-fig-0011) Choosing the image size.\n\
    \n![image](images/9781119404170-fg0712.png)\n\n[FIGURE 7-12:](#10_9781119404170-ch07.xhtml_rc07-fig-0012)\
    \ You might need to fill out a captcha.\n\n![image](images/9781119404170-fg0713.png)\n\
    \n[FIGURE 7-13:](#10_9781119404170-ch07.xhtml_rc07-fig-0013) Open the picture\
    \ to adjust the size.\n\n![image](images/9781119404170-fg0714.png)\n\n[FIGURE\
    \ 7-14:](#10_9781119404170-ch07.xhtml_rc07-fig-0014) Adjust the size of the picture\
    \ to be 100 pixels tall and stay proportional on the width.\n\n![image](images/9781119404170-fg0715.png)\n\
    \n[FIGURE 7-15:](#10_9781119404170-ch07.xhtml_rc07-fig-0015) The Processing Preferences\
    \ option.\n\n![image](images/9781119404170-fg0716.png)\n\n[FIGURE 7-16:](#10_9781119404170-ch07.xhtml_rc07-fig-0016)\
    \ The location of your Processing folder.\n\n![image](images/9781119404170-fg0717.png)\n\
    \n[FIGURE 7-17:](#10_9781119404170-ch07.xhtml_rc07-fig-0017) Move the image to\
    \ the FirstVideoGame folder.\n\n![image](images/9781119404170-fg0718.png)\n\n\
    [FIGURE 7-18:](#10_9781119404170-ch07.xhtml_rc07-fig-0018) Three lines of code\
    \ to add the character to your scene.\n\nAwesome! Now you have a character in\
    \ your scene! In the next section, you’ll learn how to move the character around\
    \ the screen.\n\n## ADDING MOVEMENT TO YOUR VIDEOGAME\n\nNow that you have a scene\
    \ and a character, it’s time to make it so that your character can move around\
    \ the scene. Follow these steps:\n\n1.  **Add two variables at the top of your\
    \ program for the character’s *x*- and *y*-coordinates; initialize them to** `characterX\
    \ = 0` **and** `characterY = 300` **(see** [**Figure 7-19**](#10_9781119404170-ch07.xhtml_c07-fig-0019)**):**\n\
    \n    `int characterX = 0;`\n\n    `int characterY = 300;`\n\n2.  **Replace the\
    \ 0 and 300 in the image method call with** `characterX` **and** `character` **(see**\
    \ [**Figure 7-20**](#10_9781119404170-ch07.xhtml_c07-fig-0020)**):**\n\n    `image(character,\
    \ characterX, characterY);`\n\n3.  **Add an empty** `keyPressed` **method (see**\
    \ [**Figure 7-21**](#10_9781119404170-ch07.xhtml_c07-fig-0021)**):**\n\n    `void\
    \ keyPressed()`\n\n    `{`\n\n    `}`\n\n4.  **Add a conditional statement to\
    \ the** `keyPressed` **method to check to see if either A or D was pressed (see**\
    \ [**Figure 7-22**](#10_9781119404170-ch07.xhtml_c07-fig-0022)**):**\n\n    `void\
    \ keyPressed()`\n\n    `{`\n\n    **`if(key == 'a')`**\n\n    **`{`**\n\n    **`}`**\n\
    \n    **`else if(key == 'd')`**\n\n    **`{`**\n\n    **`}`**\n\n    `}`\n\n5.\
    \  **Add code to update the** `characterX` **variable to move left or right depending\
    \ on if the A or D key was pressed (see** [**Figure 7-23**](#10_9781119404170-ch07.xhtml_c07-fig-0023)**):**\n\
    \n    `void keyPressed()`\n\n    `{`\n\n    `if(key == 'a')`\n\n    `{`\n\n  \
    \  **`characterX = characterX - 10;`**\n\n    `}`\n\n    `else if(key == 'd')`\n\
    \n    `{`\n\n    **`characterX = characterX + 10;`**\n\n    `}`\n\n    `}`\n\n\
    6.  **Add a `draw` method with a call to the image method continuously so that\
    \ the character’s location gets updated each time the A or D key is pressed (see**\
    \ [**Figure 7-24**](#10_9781119404170-ch07.xhtml_c07-fig-0024)**):**\n\n    `void\
    \ draw()`\n\n    `{`\n\n    `image(character, characterX, characterY);`\n\n  \
    \  `}`\n\n7.  **Test your code to make sure the character moves left and right\
    \ when you press A and D (see** [**Figure 7-25**](#10_9781119404170-ch07.xhtml_c07-fig-0025)**).**\n\
    \n![image](images/9781119404170-fg0719.png)\n\n[FIGURE 7-19:](#10_9781119404170-ch07.xhtml_rc07-fig-0019)\
    \ Two variables to keep track of the character’s location.\n\n![image](images/9781119404170-fg0720.png)\n\
    \n[FIGURE 7-20:](#10_9781119404170-ch07.xhtml_rc07-fig-0020) Update the character’s\
    \ location using the variables from Step 1.\n\n![image](images/9781119404170-fg0721.png)\n\
    \n[FIGURE 7-21:](#10_9781119404170-ch07.xhtml_rc07-fig-0021) Add a `keyPressed`\
    \ method.\n\n![image](images/9781119404170-fg0722.png)\n\n[FIGURE 7-22:](#10_9781119404170-ch07.xhtml_rc07-fig-0022)\
    \ Conditional statement to check if A or D was pressed.\n\n![image](images/9781119404170-fg0723.png)\n\
    \n[FIGURE 7-23:](#10_9781119404170-ch07.xhtml_rc07-fig-0023) Use the variables\
    \ from Step 1 instead of hard-coded values.\n\n![image](images/9781119404170-fg0724.png)\n\
    \n[FIGURE 7-24:](#10_9781119404170-ch07.xhtml_rc07-fig-0024) Add a `draw` method\
    \ to always update the location of the character.\n\n![image](images/9781119404170-fg0725.png)\n\
    \n[FIGURE 7-25:](#10_9781119404170-ch07.xhtml_rc07-fig-0025) Watch your character\
    \ move around your scene.\n\n## UPDATING THE BACKGROUND"
