    \ the circle always stays with the mouse.\n\n## INTERACTING WITH MOUSE CLICKS\n\
    \nSometimes you’ll want your shapes to always move with your mouse, but other\
    \ times you’ll want your shapes to move with your mouse only when the user is\
    \ clicking the mouse. Think about it like a click and drag. You might have encountered\
    \ something like this on a website or game where there was a circle that you had\
    \ to click and drag to submit an answer to a question.\n\nFor example, you might\
    \ have encountered sliders like the ones on the W3Schools.com website ([www.w3schools.com/howto/howto_js_rangeslider.asp`](http://www.w3schools.com/howto/howto_js_rangeslider.asp);\
    \ see [Figure 6-6](#09_9781119404170-ch06.xhtml_c06-fig-0006)).\n\n![image](images/9781119404170-fg0606.png)\n\
    \n[FIGURE 6-6:](#09_9781119404170-ch06.xhtml_rc06-fig-0006) Sliders that are made\
    \ to have a shape move horizontally only when the user clicks and drags them.\n\
    \nYou can quickly turn your code into a version of a slider by using another one\
    \ of the Processing methods that comes with the application: `mouseDragged`. Follow\
    \ these steps:\n\n1. **Add another method called** `mouseDragged` that does not\
    \ return a value and takes no parameters (see [Figure 6-7](#09_9781119404170-ch06.xhtml_c06-fig-0007)).\n\
    \n   `mouseDragged` is a method that Processing knows to call when the user has\
    \ clicked and moved the mouse. The code that you will add after your `draw` method\
    \ and before your `moveDownAndRight` method is:\n\n```javascript\nvoid mouseDragged()\
    \ {\n\n}\n```\n\n2. **Add two lines of code to `mouseDragged` that update the\
    \ `xCoordinate` and `yCoordinate` variables to the mouse position (see [Figure\
    \ 6-8](#09_9781119404170-ch06.xhtml_c06-fig-0008)).**\n\n   The two lines of code\
    \ are:\n\n```javascript\nxCoordinate = mouseX;\nyCoordinate = mouseY;\n```\n\n\
    3. **Change the method call of `ellipse` to `xCoordinate` and `yCoordinate` instead\
    \ of `mouseX` and `mouseY` (see [Figure 6-9](#09_9781119404170-ch06.xhtml_c06-fig-0009)).**\n\
    \n   The call to `ellipse` should now be:\n\n```javascript\nellipse(xCoordinate,\
    \ yCoordinate, 300, 300);\n```\n\n4. **Press the Run button and make sure the\
    \ circle only moves when you drag the mouse.**\n\n   If you let go of the mouse\
    \ button, the circle should stop moving. If you move your mouse up and down while\
    \ pressing the button, the circle should not move.\n\n![image](images/9781119404170-fg0607.png)\n\
    \n[FIGURE 6-7:](#09_9781119404170-ch06.xhtml_rc06-fig-0007) Empty `mouseDragged`\
    \ method.\n\n![image](images/9781119404170-fg0608.png)\n\n[FIGURE 6-8:](#09_9781119404170-ch06.xhtml_rc06-fig-0008)\
    \ Two lines of code.\n\n![image](images/9781119404170-fg0609.png)\n\n[FIGURE 6-9:](#09_9781119404170-ch06.xhtml_rc06-fig-0009)\
    \ Updated `ellipse` call.\n"
