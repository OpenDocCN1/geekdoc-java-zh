  trans: '

    `SARAH GUTHALS` 于 2014 年获得加州大学圣地亚哥分校（UCSD）计算机科学博士学位，专注于计算机教育。研究生期间，她开发了 CodeSpells
    的测试版本，这是一款 3D 沉浸式视频游戏，旨在孩子们通过扮演魔法师和编写“咒语”来学习编程。随后，她共同创立了 ThoughtSTEM，这家公司致力于为儿童编程开发软件（如
    LearnToMod）、课程和教学法，并赋能 K–12 教师向其学生教授编程。她写过四本关于 Minecraft 的书和一本关于移动开发的书，还为兴趣教授编程的老师上线了
    Coursera 和 EdX 课程，近期入选了福布斯“30 岁以下 30 位精英榜”科学类，并创立了 We Can，这是一家致力于鼓励所有孩子尝试任何事情的公司。她的热情是让每个人都能接触到编程，目标是使其成为一项基础素养。Sarah
    目前在 UCSD 授课。


    ## 献辞


    我想将这本书献给支持我的亲密朋友和家人，他们不仅在我撰写这本书期间支持我，更成就了今天的我。我想特别将这本书献给 Adrian Guthals，他一直帮助我看到，只要充满热情奉献，我真的可以任何任何想做的事情。


    ## 作者致谢


    我要感谢为开发 Processing 所付出的所有努力——没有这些出色的工程师，制作视频游戏将困难得多。我还要感谢世界各地的教师和家长，他们意识到编程在学习中的重要性，为我们的下一代创造者传授了许多宝贵的课程。


    ## 出版社致谢


