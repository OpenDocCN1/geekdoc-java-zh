    \ x2, y2, x3, y3, x4, y4);\n```\n\n```\nellipse(x, y, width, height);\n```\n\n\
    ```\narc(x, y, width, height, start, stop);\n```\n\n尽管 Processing 让创建这些形状变得更简单，但它仍然可能棘手。在本章中，你将创建每种形状并稍微更改参数，以便在画布的不同部分绘制形状，并让它们具有不同的尺寸。\n\
    \n## 绘制三角形\n\n在 Processing 中，`triangle` 方法将创建一个接受六个参数的三角形，这些是三角形每个点的 `x` 和 `y`\
    \ 位置。按照以下步骤操作：\n\n1. **打开 Processing 并创建一个新程序。**\n2. **创建一个 500  像素乘 500 像素的画布（参见[图\
    \ 3-1]](#06_9781119404170-ch03.xhtml_c03-fig-0001)):**\n```\nsize(500, 500);\n\
    ```\n3. **创建一个三角形，其上顶点位于画布中心（`x` = 250, `y` = 250）。三角形的高度应为 100 像素，宽度应为 200 像素（参见[图\
    \ 3-2]](#06_9781119404170-ch03.xhtml_c03-fig-0002)):**\n```\ntriangle(250, 250,\
    \ 150, 350, 350, 350);\n```\n4. **点击运行查看你创建的三角形（参见[图 3-4]](#06_9781119404170-ch03.xhtml_c03-fig-0004）。**\n\
    5. **尝试更改每个点的 `x` 和 `y` 坐标以创建不同的三角形。**\n   这段代码创建了图 3-5 中所示的三角形：\n```\ntriangle(250,\
    \ 250, 250, 350, 300, 300);\n```\n   这段代码创建了图 3-6 中所示的三角形：\n```\ntriangle(250,\
    \ 250, 150, 450, 350, 450);\n```\n   这段代码创建了图 3-7 中所示的三角形：\n```\ntriangle(250,\
    \ 250, 250, 450, 450, 450);\n```\n6. **当你探索完不同的三角形形状后，注释掉创建三角形的行代码。**\n   要做到这一点，在方法名称前面添加两个正斜杠（参见[图\
    \ 3-8]](#06_9781119404170-ch03.xhtml_c03-fig-0008)):\n```\n//triangle(250, 250,\
    \ 250, 450, 450, 450);\n```\n   这将使 Processing 忽略与 `//` 同一行上的所有内容。\n\n![image](img/9781119404170-fg0301.png)\n\
    \n图 3-1: 创建 500x500 像素画布所需的代码。\n\n![image](img/9781119404170-fg0302.png)\n\n图\
    \ 3-2: 创建三角形所需的代码。\n\n![image](img/9781119404170-fg0303.png)\n\n图 3-3: 手绘草图示例，有助于可视化代码。\n\
    \n![image](img/9781119404170-fg0304.png)\n\n图 3-4: 从图 3-2 创建的三角形。\n\n![image](img/9781119404170-fg0305.png)\n\
    \n图 3-5: 小三角形示例。\n\n![image](img/9781119404170-fg0306.png)\n\n图 3-6: 高瘦三角形示例。\n\
    \n![image](img/9781119404170-fg0307.png)\n\n图 3-7: 直角三角形示例。\n\n![image](img/9781119404170-fg0308.png)\n\
    \n图 3-8: 注释掉的代码。\n\n## 绘制矩形\n\n在 Processing 中，`rect` 方法将创建一个接受四个参数的矩形：左上角的 `x`\
    \ 和 `y` 值、宽度和高度。\n\n1. **创建一个左上角 `x` = 100，`y` = 100 且宽 50 像素、高 50 像素的矩形。点击运行（参见图\
    \ 3-9):**\n```\nrect(100, 100, 50, 50);\n```\n2. **尝试更改 `x` 和 `y` 坐标以及宽度和高度以创建不同的矩形。**\n\
    \   这段代码创建了图 3-10 中所示的矩形：\n```\nrect(100, 100, 200, 100);\n```\n   这段代码创建了图 3-11\
    \ 中所示的矩形：\n```\nrect(100, 50, 200, 400);\n```\n3. **当你探索完矩形形状后，注释掉创建矩形的行代码（参见图\
    \ 3-12).**\n\n![image](img/9781119404170-fg0309.png)\n\n图 3-9: 50x50 像素正方形示例。\n\
    \n![image](img/9781119404170-fg0310.png)\n\n图 3-10: 横向矩形示例。\n\n![image](img/9781119404170-fg0311.png)\n\
    \n图 3-11: 竖向矩形示例。\n\n![image](img/9781119404170-fg0312.png)\n\n图 3-12: 注释掉的代码。\n\
    \n## 绘制四边形\n\n在 Processing 中，`quad` 方法将创建一个有四边的形状。与三角形类似，有八个参数，代表每个点的 `x` 和 `y`\
    \ 坐标。按照以下步骤操作：\n\n1. **创建一个四边形，其左上角 `x` = 50，`y` = 50，右上角 `x` = 100，`y` = 100，右下角\
    \ `x` = 100，`y` = 150，左下角 `x` = 50，`y` = 200（参见图 3-13):**\n```\nquad(50, 50, 100,\
    \ 100, 100, 150, 50, 200);\n```\n2. **尝试更改 `x` 和 `y` 坐标以创建不同的四边形。**\n   这段代码创建了图\
    \ 3-14 中所示的四边形：\n```\nquad(50, 50, 150, 50, 200, 150, 100, 150);\n```\n   这段代码创建了图\
    \ 3-15 中所示的四边形：\n```\nquad(50, 50, 150, 50, 150, 150, 50, 150);\n```\n3. **当你探索完不同的四边形形状后，注释掉创建四边形的行代码（参见图\
    \ 3-16).**\n\n![image](img/9781119404170-fg0313.png)\n\n图 3-13: 侧置梯边形示例。\n\n![image](img/9781119404170-fg0314.png)\n\
