  trans: "\n\n图 5-2: 带有新的红色画布的 `setup` 方法体。\n\n![image](img/9781119404170-fg0503.png)\n\
    \n图 5-3: 当你点击运行（Run）按钮时，会出现红色画布。\n\n在编写简单的程序时，`setup` 方法可能会非常简单，就像你刚刚编写的那样。但当你开始制作视频游戏时，设置设置代码可能会变得更加复杂。你将在本书的后面看到这一点。\n\
    \n## 编写 DRAW 方法\n\n下一个方法称为 `draw`。该方法在 `setup` 方法执行完毕后会自动被调用。然后，`draw` 方法会被反复地（一次又一次）调用，直到画布关闭。\n\
    \n1. 在 `setup` 方法的右大括号之后，添加另一个名为 `draw` 的方法，它没有返回值且不接受任何参数（参见图 5-4）：\n   ```\n\
    \   void draw()\n   {\n   }\n   ```\n2. 在方法体内添加三行代码，在画布中心绘制一个圆，该圆具有白色轮廓和蓝色填充（参见图\
    \ 5-5）：\n   ```javascript\n   void draw()\n   {\n     stroke(255, 255, 255);\n\
    \     fill(0, 0, 250);\n     ellipse(250, 250, 300, 300);\n   }\n   ```\n3. 点击运行（Run）按钮并确保圆已经画出来（参见图\
    \ 5-6）。\n\n![image](img/9781119404170-fg0504.png)\n\n图 5-4: 一个空的 `draw` 方法。\n\n\
    ![image](img/9781119404170-fg0505.png)\n\n图 5-5: 创建一个带有白色轮廓的蓝色圆的三行代码。\n\n![image](img/9781119404170-fg0506.png)\n\
    \n图 5-6: 画布上的蓝白相圆。\n\n`draw` 方法被反复、一次又一次地调用，但圆只出现了一次。这是因为圆实际上在被反复绘制，但它是在完全相同的位置绘制的，所以你看不见任何变化。在下一节中，你将学习如何制作一个简单的动画！\n\
    \n## 编写你的前两个原始方法\n\n本节的目标是让你在上一个节中创建的圆（参见图 5-6）跨屏幕移动！\n\n### 创建两个有用的变量\n\n在两个方法上方，你需要添加两个变量，用于跟踪椭圆的\
    \ *x-* 和 *y-* 坐标。\n\n1. 首先，添加两个名为 `xCoordinate` 和 `yCoordinate` 的变量。这些变量的类型应为\
    \ `int`（整数），且值应为 250（参见图 5-7）：\n   ```javascript\n   int xCoordinate = 250;\n\
    \   int yCoordinate = 250;\n   ```\n2. 将 `ellipse` 方法调用中的两个 250 值替换为你第 1 步中创建的变量（参见图\
    \ 5-8）：\n   ```javascript\n   void draw()\n   {\n     stroke(255, 255, 255);\n\
    \     fill(0, 0, 250);\n     ellipse(xCoordinate, yCoordinate, 300, 300);\n  \
    \ }\n   ```\n3. 点击运行（Run）按钮进行测试，确保蓝白相间的圆仍然在图 5-6 所示。由于你将两个变量设置为 250，所以圆留在原地（参见图\
    \ 5-9）。\n4. 将 `xCoordinate` 变量设置为 0（参见图 5-10）：\n   ```javascript\n   int xCoordinate\
    \ = 0;\n   int yCoordinate = 250;\n   ```\n5. 点击运行（Run）按钮测试蓝白相间的圆的位置。圆现在位于 *x*\
    \ = 0, *y* = 250，即画布左侧中央（参见图 5-10）。\n6. 同样将 `yCoordinate` 变量设置为 0（参见图 5-11）：\n\
    \   ```javascript\n   int xCoordinate = 0;\n   int yCoordinate = 0;\n   ```\n\
    7. 点击运行（Run）按钮，确保蓝白相间的圆在画布左上角。\n\n![image](img/9781119404170-fg0507.png)\n\n图\
    \ 5-7: 用于跟踪圆的 *x* 和 *y* 位置的两个变量。\n\n![image](img/9781119404170-fg0508.png)\n\n\
    图 5-8: 在 `ellipse` 方法调用两个变量。\n\n![image](img/9781119404170-fg0509.png)\n\n图 5-9:\
    \ 测试代码以确保圆仍在中心。\n\n![image](img/9781119404170-fg0510.png)\n\n图 5-10: 将 `xCoordinate`\
    \ 变量设置为 0，让圆向左移动。\n\n![image](img/9781119404170-fg0511.png)\n\n图 5-11: 将 `yCoordinate`\
    \ 变量设置为 0，让圆向上移动。\n\n现在你有了两个可以帮助圆在画布上移动的变量，你可以编写两个方法在画布开启时更改变量的值。\n\n### 创建自定义方法\n\
    \n现在你有了控制圆在画布绘制位置的两个变量 `xCoordinate` 和 `yCoordinate`，你可以编写一个方法在画布开启时更改变量的值。\n\n\
    1. 编写一个名为 `moveDownAndRight` 的新方法，无返回值且没有参数（参见图 5-12）：\n   ```javascript\n   void\
    \ moveDownAndRight()\n   {\n   }\n   ```\n   确保 `xCoordinate` 和 `yCoordinate`\
    \ 变量都设置为 0（参见图 5-12）：\n   ```javascript\n   int xCoordinate = 0;\n   int yCoordinate\
    \ = 0;\n   ```\n2. 将 `xCoordinate` 和 `yCoordinate` 变量设置为它们之前的值加 1（参见图 5-13）：\n\
    \   ```javascript\n   void moveDownAndRight()\n   {\n     xCoordinate = xCoordinate\
    \ + 1;\n     yCoordinate = yCoordinate + 1;\n   }\n   ```\n   所以，如果 `xCoordinate`\
    \ 从 0 开始，那么第一次调用 `moveDownAndRight` 时，`xCoordinate` 将设置为 1，第二次调用该方法时，它将被设置为 2。这种情况将持续到画布关闭。\n\
    3. 在绘制圆之后添加一行代码调用 `moveDownAndRight` 方法（参见图 5-14）：\n   ```javascript\n   void\
    \ draw()\n   {\n     stroke(255, 255, 255);\n     fill(0, 0, 250);\n     ellipse(xCoordinate,\
    \ yCoordinate, 300, 300);\n     moveDownAndRight();\n   }\n   ```\n4. 点击运行（Run）按钮测试你编写的代码。\n\
    因为 `draw` 方法被反复调用直到画布关闭，圆应该开始向右下方移动（参见图 5-15）。\n5. 正如你注意到的，圆被反复绘制，你可以看到它留下的痕迹。如果你想让圆移动而不留下痕迹，请在绘制圆之前调用一次\
    \ `background` 方法（参见图 5-16）：\n   ```javascript\n   void draw()\n   {\n     background(255,\
    \ 0, 0);\n     stroke(255, 255, 255);\n     fill(0, 0, 250);\n     ellipse(xCoordinate,\
    \ yCoordinate, 300, 300);\n     moveDownAndRight();\n   }\n   ```\n   现在，你的 `draw`\
    \ 方法执行以下步骤：\n\n* 使画布变为全红色\n* 绘制一个具有白色轮廓和蓝色填充的圆\n* 更新圆的位置\n* 重复直到画布关闭。\n\n"
- fmt: "\n6. Click the Run button and make sure your circle moves across the screen\
    \ without having a trail behind it (see [Figure 5-17](#08_9781119404170-ch05.xhtml_c05-fig-0017)).\n\
    \n![image](images/9781119404170-fg0512.png)\n\n[FIGURE 5-12:](#08_9781119404170-ch05.xhtml_rc05-fig-0012)\
    \ An empty `moveDownAndRight()` method.\n\n![image](images/9781119404170-fg0513.png)\n\
    \n[FIGURE 5-13:](#08_9781119404170-ch05.xhtml_rc05-fig-0013) Two lines of code\
    \ added to `moveDownAndRight` to update the `xCoordinate` and `yCoordinate` variables.\n\
    \n![image](images/9781119404170-fg0514.png)\n\n[FIGURE 5-14:](#08_9781119404170-ch05.xhtml_rc05-fig-0014)\
    \ A call to `moveDownAndRight` every time the circle is drawn.\n\n![image](images/9781119404170-fg0515.png)\n\
    \n[FIGURE 5-15:](#08_9781119404170-ch05.xhtml_rc05-fig-0015) The blue-and-white\
    \ circle moves across the canvas with a tail.\n\n![image](images/9781119404170-fg0516.png)\n\
    \n[FIGURE 5-16:](#08_9781119404170-ch05.xhtml_rc05-fig-0016) Another call to the\
    \ background method to overwrite the circle trail.\n\n![image](images/9781119404170-fg0517.png)\n\
    \n[FIGURE 5-17:](#08_9781119404170-ch05.xhtml_c05-fig-0017) The circle moving\
    \ across the canvas with no trail.\n\nCongratulations! You’ve now made an animation!\
    \ In the next section, you’ll learn how to adjust the speed of your animation.\n\
    \n## ADDING PARAMETERS TO YOUR METHOD\n\nNow that you have an animation, you can\
    \ add a parameter to speed up your animation. Adding 1 to the `xCoordinate` and\
    \ 1 to the `yCoordinate` is basically moving the circle 1 pixel left and 1 pixel\
    \ down each time it’s drawn. If you change the 1 to a 2, the circle will move\
    \ 2 pixels left and 2 pixels down, which will make the circle look like it’s moving\
    \ twice as fast (see [Figure 5-18](#08_9781119404170-ch05.xhtml_c05-fig-0018)):\n\
    \n```\nvoid moveDownAndRight()\n{\n  xCoordinate = xCoordinate + 2;\n  yCoordinate\
    \ = yCoordinate + 2;\n}\n```\n\n![image](images/9781119404170-fg0518.png)\n\n\
    [FIGURE 5-18:](#08_9781119404170-ch05.xhtml_rc05-fig-0018) Change the `xCoordinate`\
    \ and `yCoordinate` variables to move 2 pixels each time instead of 1 pixel.\n\
    \nIn this example, there are only two places where you have to change the value\
    \ that shows the speed:\n\n```\nxCoordinate = xCoordinate + 2;\nyCoordinate =\
    \ yCoordinate + 2;\n```\n\nBut you still don’t want to accidentally change one\
    \ of them and not the other. To avoid that error, you can add a parameter to your\
    \ `moveDownAndRight` method so that the `xCoordinate` and `yCoordinate` variables\
    \ always change by the same amount.\n\n1. **Add the parameter type and parameter\
    \ name to the `moveDownAndRight` method signature. The type should be `int` (because\
    \ the value is a number) and the name should be `speed`:**\n\n```\nvoid moveDownAndRight(int\
    \ speed)\n{\n  xCoordinate = xCoordinate + 2;\n  yCoordinate = yCoordinate + 2;\n\
    }\n```\n\nYou can actually make the parameter name anything you want, but it’s\
    \ best if the name actually represents the value, so `speed` is a good choice.\n\
    \nNotice that you get an error message at the bottom of the Processing window\
    \ (see [Figure 5-20](#08_9781119404170-ch05.xhtml_c05-fig-0020)). That happens\
    \ because, when you call `moveDownAndRight`, you don’t pass a number value.\n\n\
    2. **Put the number 2 between the parentheses of the `moveDownAndRight` method\
    \ call (see [Figure 5-21](#08_9781119404170-ch05.xhtml_c05-fig-0021)):**\n\n```\n\
    void draw()\n{\n  background(255, 0, 0);\n  stroke(255, 255, 255);\n  fill(0,\
    \ 0, 250);\n  ellipse(xCoordinate, yCoordinate, 300, 300);\n  moveDownAndRight(2);\n\
    }\n```\n\n3. **Replace the two 2’s in the method body of the `moveDownAndRight`\
    \ method with the parameter `speed` (see [Figure 5-22](#08_9781119404170-ch05.xhtml_rc05-fig-0022)):**\n\
    \n```\nvoid moveDownAndRight(int speed)\n{\n  xCoordinate = xCoordinate + speed;\n\
    \  yCoordinate = yCoordinate + speed;\n}\n```\n\n4. **Click the Run button and\
    \ make sure your circle moves across the screen without having a trail behind\
    \ it (see [Figure 5-17](#08_9781119404170-ch05.xhtml_c05-fig-0017)).**\n\n5. **Try\
    \ changing the value of the parameter to 8 (see [Figure 5-23](#08_9781119404170-ch05.xhtml_c05-fig-0023)):**\n\
    \n```\nvoid draw()\n{\n  background(255, 0, 0);\n  stroke(255, 255, 255);\n  fill(0,\
    \ 0, 250);\n  ellipse(xCoordinate, yCoordinate, 300, 300);\n  moveDownAndRight(8);\n\
    }\n```\n"
  raw: "6.  **Click the Run button and make sure your circle moves across the screen\
    \ without having a trail behind it (see** [**Figure 5-17**](#08_9781119404170-ch05.xhtml_c05-fig-0017)**).**\n\
    \n![image](images/9781119404170-fg0512.png)\n\n[FIGURE 5-12:](#08_9781119404170-ch05.xhtml_rc05-fig-0012)\
    \ An empty `moveDownAndRight` method.\n\n![image](images/9781119404170-fg0513.png)\n\
    \n[FIGURE 5-13:](#08_9781119404170-ch05.xhtml_rc05-fig-0013) Two lines of code\
    \ added to `moveDownAndRight` to update the `xCoordinate` and `yCoordinate` variables.\n\
    \n![image](images/9781119404170-fg0514.png)\n\n[FIGURE 5-14:](#08_9781119404170-ch05.xhtml_rc05-fig-0014)\
    \ A call to `moveDownAndRight` every time the circle is drawn.\n\n![image](images/9781119404170-fg0515.png)\n\
    \n[FIGURE 5-15:](#08_9781119404170-ch05.xhtml_rc05-fig-0015) The blue-and-white\
    \ circle moves across the canvas with a tail.\n\n![image](images/9781119404170-fg0516.png)\n\
    \n[FIGURE 5-16:](#08_9781119404170-ch05.xhtml_rc05-fig-0016) Another call to the\
    \ background method to overwrite the circle trail.\n\n![image](images/9781119404170-fg0517.png)\n\
    \n[FIGURE 5-17:](#08_9781119404170-ch05.xhtml_rc05-fig-0017) The circle moving\
    \ across the canvas with no trail.\n\nCongratulations! You’ve now made an animation!\
    \ In the next section, you’ll learn how to adjust the speed of your animation.\n\
    \n## ADDING PARAMETERS TO YOUR METHOD\n\nNow that you have an animation, you can\
    \ add a parameter to speed up your animation. Adding 1 to the `xCoordinate` and\
    \ 1 to the `yCoordinate` is basically moving the circle 1 pixel left and 1 pixel\
    \ down each time it’s drawn. If you change the 1 to a 2, the circle will move\
    \ 2 pixels left and 2 pixels down, which will make the circle look like it’s moving\
    \ twice as fast (see [Figure 5-18](#08_9781119404170-ch05.xhtml_c05-fig-0018)):\n\
    \n`void moveDownAndRight()`\n\n`{`\n\n`xCoordinate = xCoordinate + 2;`\n\n`yCoordinate\
    \ = yCoordinate + 2;`\n\n`}`\n\n![image](images/9781119404170-fg0518.png)\n\n\
    [FIGURE 5-18:](#08_9781119404170-ch05.xhtml_rc05-fig-0018) Change the `xCoordinate`\
    \ and `yCoordinate` variables to move 2 pixels each time instead of 1 pixel.\n\
    \nIn this example, there are only two places where you have to change the value\
    \ that shows the speed:\n\n`xCoordinate = xCoordinate + 2;`\n\n`yCoordinate =\
    \ yCoordinate + 2;`\n\nBut you still don’t want to accidentally change one of\
    \ them and not the other. To avoid that error, you can add a parameter to your\
    \ `moveDownAndRight` method so that the `xCoordinate` and `yCoordinate` variables\
    \ always change by the same amount.\n\n1.  **Add the parameter type and parameter\
    \ name to the** `moveDownAndRight` **method signature. The type should be** `int`\
    \ **(because the value is a number) and the name should be** `speed`**:**\n\n\
    \    **`void moveDownAndRight(int speed)`**\n\n    `{`\n\n    `xCoordinate = xCoordinate\
    \ + 2;`\n\n    `yCoordinate = yCoordinate + 2;`\n\n    `}`\n\n    You can actually\
    \ make the parameter name anything you want, but it’s best if the name actually\
    \ represents the value, so `speed` is a good choice.\n\n    Notice that you get\
    \ an error message at the bottom of the Processing window (see [Figure 5-20](#08_9781119404170-ch05.xhtml_c05-fig-0020)).\
    \ That happens because, when you call `moveDownAndRight`, you don’t pass a number\
    \ value.\n\n2.  **Put the number 2 between the parentheses of the** `moveDownAndRight`\
    \ **method call (see** [**Figure 5-21**](#08_9781119404170-ch05.xhtml_c05-fig-0021)**):**\n\
    \n    `void draw()`\n\n    `{`\n\n    `background(255, 0, 0);`\n\n    `stroke(255,\
    \ 255, 255);`\n\n    `fill(0, 0, 250);`\n\n    `ellipse(xCoordinate, yCoordinate,\
    \ 300, 300);`\n\n    **`moveDownAndRight(2);`**\n\n    `}`\n\n3.  **Replace the\
    \ two 2’s in the method body of the** `moveDownAndRight` **method with the parameter**\
    \ `speed` **(see** [**Figure 5-22**](#08_9781119404170-ch05.xhtml_c05-fig-0022)**):**\n\
    \n    `void moveDownAndRight(int speed)`\n\n    `{`\n\n    **`xCoordinate = xCoordinate\
    \ + speed;`**\n\n    **`yCoordinate = yCoordinate + speed;`**\n\n    `}`\n\n4.\
    \  **Click the Run button and make sure the circle is still moving as fast as\
    \ it was at the beginning of this section, when you originally changed the circle\
    \ to move twice as fast (the code changes are shown in** [**Figure 5-18**](#08_9781119404170-ch05.xhtml_c05-fig-0018)**).**\n\
    \n5.  **Try changing the value of the parameter to 8 (see** [**Figure 5-23**](#08_9781119404170-ch05.xhtml_c05-fig-0023)**):**\n\
    \n    `void draw()`\n\n    `{`\n\n    `background(255, 0, 0);`\n\n    `stroke(255,\
    \ 255, 255);`\n\n    `fill(0, 0, 250);`\n\n    `ellipse(xCoordinate, yCoordinate,\
    \ 300, 300);`\n\n    **`moveDownAndRight(8);`**\n\n    `}`\n\n6.  **Press the\
    \ Run button to see how fast the circle moves.**\n\n![image](images/9781119404170-fg0519.png)\n\
    \nFigure 5-19: The new `speed` parameter in the `moveDownAndRight` method.\n\n\
    ![image](images/9781119404170-fg0520.png)\n\n[FIGURE 5-20:](#08_9781119404170-ch05.xhtml_rc05-fig-0020)\
    \ The error message shown when the `moveDownAndRight` method call doesn’t pass\
    \ a value for the parameter.\n\n![image](images/9781119404170-fg0521.png)\n\n\
    [FIGURE 5-21:](#08_9781119404170-ch05.xhtml_rc05-fig-0021) Passing in the value\
    \ 2 to the `moveDownAndRight` method.\n\n![image](images/9781119404170-fg0522.png)\n\
    \n[FIGURE 5-22:](#08_9781119404170-ch05.xhtml_rc05-fig-0022) Using the speed parameter\
    \ in the `moveDownAndRight` method.\n\n![image](images/9781119404170-fg0523.png)\n\
    \n[FIGURE 5-23:](#08_9781119404170-ch05.xhtml_rc05-fig-0023) Change the parameter\
    \ of the `moveDownAndRight` method to 8.\n\nWow! That is some incredible coding!\
    \ In this chapter, you made new variables, three methods, and added a parameter!\
    \ You did all that coding to make an animation. In the next chapter, you’ll learn\
    \ how to have users interact with your animation. Before ending, make sure you\
    \ save your Sketch program under the name CircleAnimation so that you can open\
    \ it in [Chapter 6](#09_9781119404170-ch06.xhtml).\n\n![image](images/c6.png)\n\
    \nOne of the most important parts of a videogame is the player! And the player\
    \ can’t do much if she’s just watching an animation happen on screen. In this\
    \ chapter, you learn how to make your shapes and animations interact with the\
    \ user. This is the first step to making a videogame!\n\n## MOVING WITH THE MOUSE\n\
    \nProcessing is a great application, because it has a lot of built-in functions\
    \ and variables that you get to use. You’ve already used some of these — like\
    \ the shape functions earlier in this book. In [Chapter 5](#08_9781119404170-ch05.xhtml),\
    \ you even defined two methods that Processing already knows about: setup and\
    \ draw.\n\nHere I’ll introduce you to two variables that Processing gives you\
    \ to use: `mouseX` and `mouseY`. These variables represent the *x*- and *y*-coordinates\
    \ of where the mouse is on the canvas at all times. In [Chapter 5](#08_9781119404170-ch05.xhtml),\
    \ you had two variables — `xCoordinate` and `yCoordinate` — and when you changed\
    \ their values in the `moveDownAndRight` method, the shape’s location was moved.\
    \ Using the `mouseX` and `mouseY` variables is exactly like that. The only difference\
    \ is that the values of `mouseX` and `mouseY` are automatically changed when the\
    \ user moves the mouse (instead of having to call a method).\n\nTo make your shapes\
    \ follow your mouse around the canvas, follow these steps:\n\n1.  **Open Processing,\
    \ choose File ⇒ Open, and then open the CircleAnimation Sketch file that you saved\
    \ at the end of** [**Chapter 5**](#08_9781119404170-ch05.xhtml) **(see** [**Figure\
    \ 6-1**](#09_9781119404170-ch06.xhtml_c06-fig-0001)**).**\n\n    To make sure\
    \ you have all the code you need, here is the code your CircleAnimation should\
    \ have:\n\n    `int xCoordinate = 0;`\n\n    `int yCoordinate = 0;`\n\n    `void\
    \ setup()`\n\n    `{`\n\n    `size(500, 500);`\n\n    `background(255, 0, 0);`\n\
    \n    `}`\n\n    `void draw()`\n\n    `{`\n\n    `background(255, 0, 0);`\n\n\
    \    `stroke(255, 255, 255);`\n\n    `fill(0, 0, 250);`\n\n    `ellipse(xCoordinate,\
    \ yCoordinate, 300, 300);`\n\n    `moveDownAndRight(8);`\n\n    `}`\n\n    `void\
    \ moveDownAndRight(int speed)`\n\n    `{`\n\n    `xCoordinate = xCoordinate +\
    \ speed;`"
