    \ `checkCollision` 方法中获取两组管道的位置、宽度和高度的地方。\n\n![image](img/9781119404170-fg1017.png)\n\
    \n图 10-17: 实际测试碰撞的条件语句应该在 `checkCollision` 方法中的位置。\n\n## 添加辅助方法\n\n在上一节中，你在步骤\
    \ 2 和 3 中添加了注释来获取鸟和两组管道的位置、宽度和高度。然而，你目前还没有任何方法来帮助获取这些信息。在本节中，你将为 `Bird` 和 `Pipes`\
    \ 类添加四个方法来收集并返回这些信息。\n\n1. **添加四个名为 `getX`、`getY`、`getWidth` 和 `getHeight` 的方法。每个方法应该返回一个整数（数字）且不应该有任何参数（参见图\
    \ 10-18）。**\n\n```java\n//Method to return the x-coordinate of the bird\nint getX()\n\
    {\n    return 0;\n}\n//Method to return the y-coordinate of the bird\nint getY()\n\
    {\n    return 0;\n}\n//Method to return the width of the bird\nint getWidth()\n\
    {\n    return 0;\n}\n//Method to return the height of the bird\nint getHeight()\n\
    {\n    return 0;\n}\n```\n\n2. **你目前没有用于跟踪鸟的宽度高度的变量，因此在 `Bird` 类顶部添加它们（参见图 10-19）。**\n\
    \n```java\n//Two variables for the width and height of the bird\n```\n\n3. **对于\
    \ `Pipes` 类，你需要知道顶部和底部管道的 x 坐标、y 坐标、宽度高度，因此你需要在类中添加八个方法（参见图 10-20）。**\n\n```java\n\
    //Method to return the x-coordinate of the top pipe\nint getXTop()\n{\n    return\
    \ 0;\n}\n//Method to return the y-coordinate of the top pipe\nint getYTop()\n\
    {\n    return 0;\n}\n//Method to return the width of the top pipe\nint getWidthTop()\n\
    {\n    return 0;\n}\n//Method to return the height of the top pipe\nint getHeightTop()\n\
    {\n    return 0;\n}\n//Method to return the x-coordinate of the bottom pipe\n\
    int getXBottom()\n{\n    return 0;\n}\n//Method to return the y-coordinate of\
    \ the bottom pipe\nint getYBottom()\n{\n    return 0;\n}\n//Method to return the\
    \ width of the bottom pipe\nint getWidthBottom()\n{\n    return 0;\n}\n//Method\
    \ to return the height of the bottom pipe\nint getHeightBottom()\n{\n    return\
    \ 0;\n}\n```\n\n4. **添加用于跟踪顶部和底部管道宽度高度四个变量（参见图 10-21）。**\n\n```java\n//Four variables\
    \ for the width and height of the top\nand bottom pipes\n```\n\n5. **再添加两个变量来跟踪两组管道的位置，而不仅仅是一个组（参见图\
    \ 10-22）。**\n\n```java\n//Four variables for the location of the top and\nbottom\
    \ pipes\n```\n\n![image](img/9781119404170-fg1018.png)\n\n图 10-18: 在 `Bird` 类中应该编写四个新方法的地方。\n\
    \n![image](img/9781119404170-fg1019.png)\n\n图 10-19: 添加宽度高度变量的地方。\n\n![image](img/9781119404170-fg1020.png)\n\
    \n图 10-20: 在 `Pipes` 类中添加八个方法的参考。\n\n![image](img/9781119404170-fg1021.png)\n\n\
    图 10-21: 在 `Pipes` 类中创建四个新变量的地方。\n\n![image](img/9781119404170-fg1022.png)\n\n\
    图 10-22: 在 `Pipes` 类中更新 `location` 变量以包含顶部和底部管道。\n\n恭喜！你现在已经完整勾勒出了整个 Ninja 游戏！在下一章中，你将开始在注释下方添加代码并测试你的游戏。\n\
    \n![image](img/c11.png)\n\n在第 9 章](#12_9781119404170-ch09.xhtml)和第 10 章](#13_9781119404170-ch10.xhtml)中，你完整地勾勒了程序，并在需要代码的地方都写了注释。在本章中，你将面临编写和测试制作游戏实际代码的挑战！在本章结束时，你将拥有一个基础的有效的视频游戏。\n\
    \n## 将注释转换为代码\n\n确保你打开了来自第 10 章](#13_9781119404170-ch10.xhtml)的 NinjaBird 代码（参见图\
    \ 11-1）。你应该有三个标签页：NinjaBird、Bird 和 Pipes。在每个标签页中，你都应该有很多空方法和许多注释，它们将引导你完成本章。\n\
    \n![image](img/9781119404170-fg1101.png)\n\n图 11-1: 来自第 10 章的 NinjaBird 代码。\n\n"
- fmt: "\nIn this section, you’re going to start converting your comments to code.\
    \ It won’t make sense to just start at the top of the file, and move down, because\
    \ you want to be able to test small pieces of your code as you write the code.\
    \ So, you’ll break up the code writing into logical steps: the background, the\
    \ bird and pipes, and the user input.\n\n### CONVERTING BACKGROUND COMMENTS TO\
    \ CODE\n\nFirst, you should create the background. You will have to:\n\n* Create\
    \ an 800-x-800-pixel canvas.\n* Color the canvas blue.\n* Find a picture of a\
    \ city.\n* Create grass.\n* Put the city on top of the grass.\n\nThe code that\
    \ you’ll write for this section will be split between the `setup` and `drawScene`\
    \ methods in your main class (the `NinjaBird` tab).\n\n1. **Create a canvas that\
    \ is 800 x 800 pixels (see [Figure 11-2](#14_9781119404170-ch11.xhtml_c11-fig-0002)):**\n\
    \   ```\n   size(800, 800);\n   ```\n\n2. **Test your code to make sure that a\
    \ canvas gets created that is a good size (800 x 800 pixels).**\n   To test, click\
    \ the Run button shown in [Figure 11-3](#14_9781119404170-ch11.xhtml_c11-fig-0003).\
    \ You should see a similar canvas to the one in [Figure 11-4](#14_9781119404170-ch11.xhtml_c11-fig-0004).\n\
    \n3. **Call the `background` method from inside your `drawScene` method to turn\
    \ the background of the canvas blue like the sky (see [Figure 11-5](#14_9781119404170-ch11.xhtml_c11-fig-0005)):**\n\
    \   ```\n   background(173, 216, 230);\n   ```\n\n4. **Call the `drawScene` method\
    \ from your `setup` method so that you can actually test to make sure the canvas\
    \ is being turned blue (see [Figure 11-6](#14_9781119404170-ch11.xhtml_c11-fig-0006)):**\n\
    \   ```\n   drawScene();\n   ```\n\n5. **Test your code to make sure the canvas\
    \ is now blue instead of gray (see [Figure 11-7](#14_9781119404170-ch11.xhtml_c11-fig-0007)).**\n\
    \n6. **Create a green rectangle along the bottom of your canvas to look like grass\
    \ (see [Figure 11-8](#14_9781119404170-ch11.xhtml_c11-fig-0008)):**\n   ```\n\
    \   stroke(0, 255, 0);\n   fill(0, 255, 0);\n   rect(0, 700, 1000, 1000);\n  \
    \ ```\n\n7. **Test to make sure the grass looks good on your canvas (see [Figure\
    \ 11-9](#14_9781119404170-ch11.xhtml_c11-fig-0009)).**\n\n8. **Just as in earlier\
    \ chapters, go online to find an image of a city that you want to use in the background\
    \ of your game (see [Figure 11-10](#14_9781119404170-ch11.xhtml_c11-fig-0010)).**\n\
    \   Search “cityscape drawing” on Google images, and make sure you have permission\
    \ to use the drawing.\n\n9. **When you have found and downloaded an image you\
    \ want to use, save the file to your `NinjaBird` folder where your code is (see\
    \ [Figure 11-11](#14_9781119404170-ch11.xhtml_c11-fig-0011)).**\n\n10. **Add a\
    \ line of code to load in the city image to your program (see [Figure 11-12](#14_9781119404170-ch11.xhtml_c11-fig-0012)):**\n\
    \    ```\n    PImage city = loadImage(\"cityscape.png\");\n    ```\n\n11. **Add\
    \ the city image to your canvas (see [Figure 11-13](#14_9781119404170-ch11.xhtml_c11-fig-0013)):**\n\
    \    ```\n    image(city, 0, 500);\n    ```\n\n12. **Test your code to make sure\
    \ your city is in the right location (see [Figure 11-14](#14_9781119404170-ch11.xhtml_c11-fig-0014)).**\
    \ If it isn’t, adjust the size of your image or location of your image to make\
    \ it look the way you want.\n\nCongratulations! Your background now looks similar\
    \ to the version of Flappy Bird that you played on [`www.flappybird.io`](http://www.flappybird.io)\
    \ in [Chapter 9](#12_9781119404170-ch09.xhtml)!\n\n### CONVERTING BIRD COMMENTS\
    \ TO CODE\n\nNow that you have a background, it’s time to get your bird into your\
    \ game and flying around! Follow these steps:\n\n1. **Find an image of a bird\
    \ that you want to use (and have permission to), put it in your `NinjaBird` folder\
    \ (see [Figure 11-15](#14_9781119404170-ch11.xhtml_c11-fig-0015)).**\n\n2. **Create\
    \ the bird image in your `Bird` class (see [Figure 11-16](#14_9781119404170-ch11.xhtml_c11-fig-0016)):**\n\
    \   ```\n   PImage bird = loadImage(\"bird.png\");\n   ```\n\n3. **Draw the bird\
    \ on the canvas (see [Figure 11-17](#14_9781119404170-ch11.xhtml_c11-fig-0017)):**\n\
    \   ```\n   image(bird, 300, 200);\n   ```\n\n4. **Back in your main class, create\
    \ a variable for the bird at the top of the file (see [Figure 11-18](#14_9781119404170-ch11.xhtml_c11-fig-0018)):**\n\
    \   ```\n   Bird bird;\n   ```\n\n5. **In your main class, call the constructor\
    \ for the `Bird` class in your `setup` method (see [Figure 11-19](#14_9781119404170-ch11.xhtml_c11-fig-0019)):**\n\
    \   ```\n   bird = new Bird();\n   ```\n\n6. **Test your code to make sure your\
    \ bird is in your game in a good location (see [Figure 11-20](#14_9781119404170-ch11.xhtml_c11-fig-0020)).**\n\
    \n7. **Add the four variables that keep track of the location, width, and height\
    \ of your bird (see [Figure 11-21](#14_9781119404170-ch11.xhtml_c11-fig-0021)):**\n\
    \   ```\n   //Two variables for the location of the bird\n   int xCoordinate =\
    \ 300;\n   int yCoordinate = 200;\n   //Two variables for the width and height\
    \ of the\n   //bird\n   int width = bird.width;\n   int height = bird.height;\n\
    \   ```\n\n8. **Update your constructor to use the location variables you just\
    \ created (see [Figure 11-22](#14_9781119404170-ch11.xhtml_c11-fig-0022)):**\n\
    \   ```\n   image(bird, xCoordinate, yCoordinate);\n   ```\n\n9. **Add code to\
    \ the `move` method in the `Bird` class to make the bird always falling (see [Figure\
    \ 11-23](#14_9781119404170-ch11.xhtml_c11-fig-0023)):**\n   ```\n   //Simulate\
    \ gravity to make your bird constantly fall\n   if(yCoordinate < 700)\n   {\n\
    \   yCoordinate = yCoordinate + 5;\n   }\n   ```\n   This is very similar to the\
    \ code you wrote in [Chapter 7](#10_9781119404170-ch07.xhtml) when you made your\
    \ game simulate gravity.\n"
