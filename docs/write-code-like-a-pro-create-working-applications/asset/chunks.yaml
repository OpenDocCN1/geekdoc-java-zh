    \ and then move the mouse, the circle should follow the mouse.\n\n![image](images/9781119404170-fg0607.png)\n\
    \n[FIGURE 6-7:](#09_9781119404170-ch06.xhtml_rc06-fig-0007) An empty `mouseDragged`\
    \ method.\n\n![image](images/9781119404170-fg0608.png)\n\n[FIGURE 6-8:](#09_9781119404170-ch06.xhtml_rc06-fig-0008)\
    \ Two lines of code that change the `xCoordinate` and `yCoordinate` variables\
    \ to match the location of the mouse (using `mouseX` and `mouseY`).\n\n![image](images/9781119404170-fg0609.png)\n\
    \n[FIGURE 6-9:](#09_9781119404170-ch06.xhtml_rc06-fig-0009) Update the call to\
    \ the `ellipse` function to use `xCoordinate` and `yCoordinate`.\n\nYou’re doing\
    \ a lot with user interaction! This is your first step to making a real videogame.\
    \ Learning how to do simple interactions with basic shapes is how all professional\
    \ coders start to learn how to integrate what they’ll need for their full-fledged\
    \ games.\n\n## MAKING A HORIZONTAL SLIDER\n\nLet’s say you wanted to make a more\
    \ realistic horizontal slider. You could change your code to make sure that the\
    \ circle always stayed at the center of the screen on the *y*-axis, and only moved\
    \ with the mouse on the *x*-axis. Follow these steps:\n\n1.  **Change parameter\
    \ in the `ellipse` method call from `yCoordinate` to 250, as shown in** [**Figure\
    \ 6-10**](#09_9781119404170-ch06.xhtml_c06-fig-0010)**.**\n\n    This will keep\
    \ the circle at the center of the canvas on the vertical (or *y*-) axis.\n\n \
    \   `ellipse(xCoordinate, 250, 300, 300);`\n\n2.  **Comment out the update to\
    \ the** `yCoordinate` **variable in the** `mouseDragged` **method (see** [**Figure\
    \ 6-11**](#09_9781119404170-ch06.xhtml_c06-fig-0011)**).**\n\n    Only the `xCoordinate`\
    \ variable needs to be updated as the mouse is dragged.\n\n    `void mouseDragged()`\n\
    \n    `{`\n\n    `xCoordinate = mouseX;`\n\n    `//yCoordinate = mouseY;`\n\n\
    \    `}`\n\n3.  **Press the Run button and make sure that the circle only moves\
    \ left and right when you click and drag the mouse.**\n\n    If you let go of\
    \ the mouse button, the circle should stop moving. If you move your mouse up and\
    \ down while pressing the mouse button, the circle should not move up and down.\n\
    \n![image](images/9781119404170-fg0610.png)\n\n[FIGURE 6-10:](#09_9781119404170-ch06.xhtml_rc06-fig-0010)\
    \ Keep the circle at the center of the canvas on the vertical axis.\n\n![image](images/9781119404170-fg0611.png)\n\
    \n[FIGURE 6-11:](#09_9781119404170-ch06.xhtml_rc06-fig-0011) Comment out the `yCoordinate`\
    \ variable update in the `mouseDragged` method.\n\nCan you figure out how to change\
    \ the code so that the circle is in the center of the canvas on the horizontal\
    \ (*x*-) axis and moves with the mouse up and down, instead of left and right?\n\
    \n## WORKING WITH CONDITIONAL STATEMENTS\n\nNow that you know how to have some\
    \ experience with user interaction, it’s time to learn about a very important\
    \ part of coding: conditional statements.\n\n### GETTING ACQUAINTED WITH CONDITIONAL\
    \ STATEMENTS\n\n*Conditional statements,* also sometimes called *if statements*\
    \ or *if-else statements,* are bits of code that you add to change the effect\
    \ of your code based on some condition. One way to understand this is in the context\
    \ of your everyday life: If you eat dinner, you get ice cream; otherwise, you\
    \ get a banana. I could imagine that written in code something like this:\n\n\
    `if(eatDinner == true)`\n\n`{`\n\n`giveIceCream();`\n\n`}`\n\n`else`\n\n`{`\n\n\
    `giveBanana();`\n\n`}`"
