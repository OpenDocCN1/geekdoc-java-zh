  trans: "\n\n在本节中，你将开始将注释转换为代码。仅仅从文件顶部开始向下移动是行不通的，因为你希望在编写代码时能够对编写的每一小部分代码进行测试。因此，你把代码编写过程分为几个逻辑步骤：背景、小鸟和管道，以及用户输入。\n\
    \n### 将背景注释转换为代码\n\n首先，你应该创建背景。你将需要：\n\n* 创建一个 800x800 像素的画布。\n* 将画布涂成蓝色。\n* 寻找一张城市的图片。\n\
    * 创建草地。\n* 将城市放在草地上方。\n\n你将为这一部分编写的代码将分布在你的主类（`NinjaBird` 标签页）的 `setup` 和 `drawScene`\
    \ 方法中。\n\n1. **创建一个 800 x 800 像素的画布（参见 图 11-2）：**\n   ```\n   size(800, 800);\n\
    \   ```\n\n2. **测试你的代码，确保创建的画布大小合适（800 x 800 像素）。**\n   要进行测试，点击图 11-3 所示的 Run\
    \ 按钮。你应该看到一个与图 11-4 中类似的画布。\n\n3. **在你的 `drawScene` 方法内部调用 `background` 方法，将画布背景涂成天空蓝色（参见\
    \ 图 11-5）：**\n   ```\n   background(173, 216, 230);\n   ```\n\n4. **在你的 `setup`\
    \ 方法中调用 `drawScene` 方法，这样你就可以实际测试画布是否变为了蓝色（参见 图 11-6）：**\n   ```\n   drawScene();\n\
    \   ```\n\n5. **测试你的代码，确保画布现在是蓝色而不是灰色（参见 图 11-7）。**\n\n6. **在画布底部创建一个绿色矩形，看起来像草地（参见\
    \ 图 11-8）：**\n   ```\n   stroke(0, 255, 0);\n   fill(0, 255, 0);\n   rect(0, 700,\
    \ 1000, 1000);\n   ```\n\n7. **测试以确保草地在你的画布上看起来良好（参见 图 11-9）。**\n\n8. **与前面的章节一样，在网上寻找一张你想要在游戏背景中使用的图片（参见\
    \ 图 11-10）。**\n   在 Google 图片上搜索“cityscape drawing”，并确保你获得使用该画作的许可。\n\n9. **当你找到并下载了想要使用的图片后，将文件保存到存放代码的\
    \ `NinjaBird` 文件夹中（参见 图 11-11）。**\n\n10. **在你的程序中添加一行代码来加载城市图片（参见 图 11-12）：**\n\
    \    ```\n    PImage city = loadImage(\"cityscape.png\");\n    ```\n\n11. **将城市图片添加到你的画布中（参见\
    \ 图 11-13）：**\n    ```\n    image(city, 0, 500);\n    ```\n\n12. **测试你的代码，确保你的城市位于正确的位置（参见\
    \ 图 11-14）。** 如果位置不对，调整图片的大小或位置，使其看起来像你想要。\n\n恭喜！你的背景现在看起来像你在第 9 章中在[`www.flappybird.io`](http://www.flappybird.io)上玩过的\
    \ Flappy Bird 版本！\n\n### 将小鸟注释转换为代码\n\n现在你已经有了背景，是时候让小鸟进入你的游戏并在四周飞翔了！按照以下步骤操作：\n\
    \n1. **找到一张你想使用的（并有许可的）鸟图片，将其放入你的 `NinjaBird` 文件夹中（参见 图 11-15）。**\n\n2. **在你的\
    \ `Bird` 类中创建鸟图片（参见 图 11-16）：**\n   ```\n   PImage bird = loadImage(\"bird.png\"\
    );\n   ```\n\n3. **在画布上画出小鸟（参见 图 11-17）：**\n   ```\n   image(bird, 300, 200);\n\
    \   ```\n\n4. **回到你的主类，在文件顶部创建一个小鸟变量（参见 图 11-18）：**\n   ```\n   Bird bird;\n \
    \  ```\n\n5. **在主类的 `setup` 方法中调用 `Bird` 类的构造函数（参见 图 11-19）：**\n   ```\n   bird\
    \ = new Bird();\n   ```\n\n6. **测试你的代码，确保小鸟在游戏中的位置良好（参见 图 11-20）。**\n\n7. **添加跟踪小鸟位置、宽度和高度的四个变量（参见\
    \ 图 11-21）：**\n   ```\n   // 小鸟位置的变量\n   int xCoordinate = 300;\n   int yCoordinate\
    \ = 200;\n   // 小鸟宽度和高度的\n   // 变量\n   int width = bird.width;\n   int height\
    \ = bird.height;\n   ```\n\n8. **更新你的构造函数以使用你刚刚创建的位置变量（参见 图 11-22）：**\n   ```\n\
    \   image(bird, xCoordinate, yCoordinate);\n   ```\n\n9. **在 `Bird` 类的 `move`\
    \ 方法中添加代码，让小鸟始终掉落（参见 图 11-23）：**\n   ```\n   // 模拟重力让小鸟不断掉落\n   if(yCoordinate\
    \ < 700)\n   {\n   yCoordinate = yCoordinate + 5;\n   }\n   ```\n   这与你在第 7 章中让游戏模拟重力时编写的代码非常相似。\n\
    \n"
