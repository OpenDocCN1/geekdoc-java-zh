    \ Follow these steps:\n\n1.  **Find an image of a pipe you want to use in your\
    \ game, save it in your NinjaBird code folder, copy the image, and flip the copied\
    \ image vertically so that you can have one top pipe and one bottom pipe (see**\
    \ [**Figure 11-30**](#14_9781119404170-ch11.xhtml_c11-fig-0030)**).**\n\n2.  **At\
