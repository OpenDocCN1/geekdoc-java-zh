  trans: "\n\n最后，你需要列出的最后一个类是 `Pipe` 类。你需要在另一个标签页中创建另一个类来完成它。按照与前一节相同的步骤操作。现在，你的编程环境中应该有三个标签页：NinjaBird、Bird\
    \ 和 Pipes（参见图 9-13）。\n\n![image](img/9781119404170-fg0913.png)\n\n图 9-13： 你的三个类的三个标签页。\n\
    \n在这个类中，你想要：\n\n*   为水管创建一个图像。\n*   为两根水管创建一个构造函数。\n*   绘制两根水管，其中一根倒置。\n*   获取所有管道的位置。\n\
    *   更新管道的位置。\n*   设置一个停止管道的结束序列。\n\n在你空的 Pipes sketch 草稿文件中，输入以下代码。参考图 9-14 来确定代码应该的位置。\n\
    \n```java\nclass Pipes\n{\n  //Variable for the image of the pipes\n  //Two variables\
    \ for the location of the pipes\n  //Constructor to create the pipes\n  Pipes()\n\
    \  {\n  }\n  //Method to move the pipes\n  void move()\n  {\n  }\n  //Method to\
    \ make the pipes stop when the bird hits\n  //them\n  void endSequence()\n  {\n\
    \  }\n}\n```\n\n![image](img/9781119404170-fg0914.png)\n\n图 9-14： 你的 Pipes 类大纲。\n\
    \n在关闭 Processing 之前，确保确保已保存代码。在下一章中，你将规划所有的方法。\n\n![image](img/c10.png)\n\n在第\
    \ 9 章中，你为你的 Ninja Bird 游戏做了很多规划。你创建并列出了三个类的结构，并考虑了可能需要的变量。作为一种挑战，在本章中，你将在方法内部编写代码，但使用英文注释而不是代码。就像在第\
    \ 9 章中一样，在执行之前理解你计划要做什么是有用的。\n\n## 你的你的 SETUP 方法\n\n在你的 `setup` 方法中，你需要：\n\n*\
    \   创建画布。\n*   为画布上色。\n*   创建地面。\n*   创建城市背景。\n*   创建鸟。\n*   创建至少两组水管。\n\n你可以将这些注释加入你的代码中。和之前一样，你将添加的注释和代码将在书中编写，而图像将帮助你看到应该添加代码的位置。按照以下步骤操作：\n\
    \n1.  **在你想要创建 800-x-800 像素画布的地方添加注释（参见图 10-1）：**\n    `//Create an 800-x-800-pixel\
    \ canvas`\n2.  **在你想要将画布变为蓝色的地方添加注释（参见图 10-2）：**\n    `//Turn the background of\
    \ the canvas blue`\n3.  **在你想要创建地面的地方添加注释（参见图 10-3）：**\n    `//Create a green\
    \ rectangle that spans across the bottom of the canvas`\n4.  **在你想要显示城市图像的地方添加注释（参见图\
    \ 10-4）：**\n    `//Create an image that represents the city`\n5.  **在你的 `setup`\
    \ 方法上方，为你的鸟和两组水管创建三个变量（参见图 10-5）：**\n    `//Variables for the bird and two sets\
    \ of pipes`\n6.  **在你想要调用鸟和两组水管构造函数的地方添加注释（参见图 10-6）：**\n    `//Call the constructors\
    \ for the bird and two sets of pipes`\n\n![image](img/9781119404170-fg1001.png)\
    \ 图 10-1： 你创建 800-x-800 像素画布的地方。\n![image](img/9781119404170-fg1002.png) 图 10-2：\
    \ 你将画布变为蓝色的地方。\n![image](img/9781119404170-fg1003.png) 图 10-3： 你创建地面的地方。\n![image](img/9781119404170-fg1004.png)\
