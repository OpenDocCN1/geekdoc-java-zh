  trans: "\n\n图 4-8: 将背景完全变为白色的示例。\n\n你可以尝试调整每个参数的值来获得特定的颜色。\n\n![image](img/9781119404170-fg0409.png)\n\
    \n图 4-9: Rapid Tables 网站上用于选择颜色的 RGB 选择器。\n\n![image](img/9781119404170-fg0410.png)\n\
    \n图 4-10: 在代码中使用来自网站的 RGB 数字。\n\n## 为形状添加颜色\n\n形状可以通过两种不同的方式设置颜色：\n\n* **描边 (Stroke)**：形状的轮廓\n\
    * **填充 (Fill)**：形状内部的颜色\n\n向你的程序中添加三行代码（参见图 4-11):\n\n```\nstroke(255, 255, 255);\n\
    fill(56, 205, 130);\ntriangle(250, 250, 250, 450, 450, 450);\n```\n\n![image](img/9781119404170-fg0411.png)\n\
    \n图 4-11: 将三角形改为绿色并带有白色轮廓的示例。\n\n注意，描边是白色的，填充是绿色的。如果你不想让轮廓可见，可以将其设置为与填充相同的颜色（参见图\
    \ 4-12):\n\n```\nstroke(56, 205, 130);\nfill(56, 205, 130);\ntriangle(250, 250,\
    \ 250, 450, 450, 450);\n```\n\n![image](img/9781119404170-fg0412.png)\n\n图 4-12:\
    \ 使整个三角形变为绿色的示例。\n\n如果你想让所有形状都具有相同的颜色，只需要在开头调用一次 `stroke` 和 `fill`（参见图 4-13):\n\
    \n```\nstroke(56, 205, 130);\nfill(56, 205, 130);\ntriangle(250, 250, 250, 450,\
    \ 450, 450);\nrect(100, 50, 200, 400);\nquad(50, 50, 150, 50, 150, 150, 50, 150);\n\
    ```\n\n![image](img/9781119404170-fg0413.png)\n\n图 4-13: 使三个形状完全变为绿色的示例。\n\n但如果你想让所有形状具有不同的颜色，你需要在绘制每个形状之前调用\
    \ `stroke` 和 `fill`（参见图 4-14):\n\n```\nstroke(56, 205, 130);\nfill(56, 205, 130);\n\
    triangle(250, 250, 250, 450, 450, 450);\nstroke(56, 105, 205);\nfill(556, 105,\
    \ 205);\nrect(100, 50, 200, 400);\nstroke(205, 56, 205);\nfill(205, 56, 205);\n\
    quad(50, 50, 150, 50, 150, 150, 50, 150);\n```\n\n![image](img/9781119404170-fg0414.png)\n\
    \n图 4-14: 使三个形状颜色不同的示例。\n\n尝试为你在第 3 章中制作的绘画添加颜色，或者现在就可以使用颜色创建一个新的绘画吧！\n\n![image](img/c5.png)\n\
    \n在本书的前四章中，你学习了如何调用方法。你调用方法来创建画布、更改画布颜色、创建形状以及更改这些形状的颜色。方法是编程中非常有用的工具，因为许多代码只需要编写一次并命名，然后程序员就可以使用方法名称来执行所有这些代码。方法让代码更容易理解且更易于管理。\n\
    \n在本章中，你将学习为什么方法是有用的，发现你可能想要编写的制作动画（以及以后的游戏！）的方法，并了解如何编写自己的方法。在此之前，对方法进行简单概述！\n\
    \n## 学习方法\n\n在本节中，你将更多地了解 Java 方法。方法是编程中非常重要的部分，因为它们将你的代码分解成命名的代码块。然后你可以使用这些代码块的名称反复调用相同的代码。方法是编程的基础之一，即使在其他编程语言（而不只是\
    \ Java）中也有用。\n\n### 方法签名\n\n在 Java 中，你总是以的方式编写方法：\n\n```\nreturnType methodName(parameterType\
    \ parameterName)\n{\n    CODE\n}\n```\n\n上述代码段的第一行代码被称为方法签名。它包含了你（或使用你代码的程序员）调用方法所需的所有信息。\n\
    \n方法签名包含三个部分：\n\n* `returnType`：方法返回的值的类型。\n* `methodName`：调用方法的名称。\n* `(parameterType\
    \ parameterName)`：方法接受的输入。\n\n"
- fmt: "\n[FIGURE 5-2:](#08_9781119404170-ch05.xhtml_rc05-fig-0002) The `setup` method\
    \ body with a new, red canvas.\n\n![image](images/9781119404170-fg0503.png)\n\n\
    [FIGURE 5-3:](#08_9781119404170-ch05.xhtml_rc05-fig-0003) A red canvas appears\
    \ when you click the Run button.\n\nWhen making a simple program, the `setup`\
    \ method will probably be very simple, like the one you just wrote. But when you\
    \ move into making a videogame, the setup code can get more complicated. You’ll\
    \ see that later in this book.\n\n## Writing THE DRAW METHOD\n\nThe next method\
    \ is called `draw`. This method is automatically called after the `setup` method\
    \ finishes executing. The `draw` method is then called repeatedly (over and over)\
    \ until the canvas is closed.\n\n1. Under the `setup` method, after the closed\
    \ curly brace, add another method called `draw` that has no return data and doesn’t\
    \ take any parameters (see [Figure 5-4](#08_9781119404170-ch05.xhtml_c05-fig-0004)):\n\
    \   ```\n   void draw()\n   {\n   }\n   ```\n2. Inside the method body, add three\
    \ lines of code to draw a circle in the center of the canvas that has a white\
    \ outline and blue fill (see [Figure 5-5](#08_9781119404170-ch05.xhtml_c05-fig-0005)):\n\
    \   ```javascript\n   void draw()\n   {\n     stroke(255, 255, 255);\n     fill(0,\
    \ 0, 250);\n     ellipse(250, 250, 300, 300);\n   }\n   ```\n3. Press the Run\
    \ button and make sure that the circle is drawn (see [Figure 5-6](#08_9781119404170-ch05.xhtml_c05-fig-0006)).\n\
    \n![image](images/9781119404170-fg0504.png)\n\n[FIGURE 5-4:](#08_9781119404170-ch05.xhtml_rc05-fig-0004)\
    \ An empty `draw` method.\n\n![image](images/9781119404170-fg0505.png)\n\n[FIGURE\
    \ 5-5:](#08_9781119404170-ch05.xhtml_rc05-fig-0005) Three lines of code to create\
    \ a blue circle with a white outline.\n\n![image](images/9781119404170-fg0506.png)\n\
    \n[FIGURE 5-6:](#08_9781119404170-ch05.xhtml_rc05-fig-0006) The blue-and-white\
    \ circle on the canvas.\n\nThe `draw` method is called over and over and over\
    \ again, but the circle only appears once. This is because the circle is actually\
    \ being drawn over and over, but it’s being drawn in the exact same place, so\
    \ you can’t see any changes. In the next section, you’ll learn how to make a simple\
    \ animation!\n\n## Writing YOUR FIRST TWO ORIGINAL METHODS\n\nYour goal for this\
    \ section is to make the circle you made in the previous section (refer to [Figure\
    \ 5-6](#08_9781119404170-ch05.xhtml_c05-fig-0006)) move across the screen!\n\n\
    ### Creating TWO USEFUL VARIABLES\n\nAbove the two methods, you need to add two\
    \ variables that will keep track of the *x*- and *y*-coordinates of your ellipse.\n\
    \n1. To get started, add two variables called `xCoordinate` and `yCoordinate`.\
    \ The variables should be type `int` (number) and should have the value 250 (see\
    \ [Figure 5-7](#08_9781119404170-ch05.xhtml_c05-fig-0007)):\n   ```javascript\n\
    \   int xCoordinate = 250;\n   int yCoordinate = 250;\n   ```\n2. Replace both\
    \ the 250 values in the `ellipse` method call with the variables you created in\
    \ Step 1 (see [Figure 5-8](#08_9781119404170-ch05.xhtml_c05-fig-0008)):\n   ```javascript\n\
    \   void draw()\n   {\n     stroke(255, 255, 255);\n     fill(0, 0, 250);\n  \
    \   ellipse(xCoordinate, yCoordinate, 300, 300);\n   }\n   ```\n3. Click the Run\
    \ button to test make sure the blue-and-white circle is still where it was in\
    \ [Figure 5-6](#08_9781119404170-ch05.xhtml_c05-fig-0006). Because you set the\
    \ two variables to 250, the circle stays in the same place (see [Figure 5-9](#08_9781119404170-ch05.xhtml_c05-fig-0009)).\n\
    4. Change the `xCoordinate` variable to have a value of 0 (see [Figure 5-10](#08_9781119404170-ch05.xhtml_c05-fig-0010)):\n\
    \   ```javascript\n   int xCoordinate = 0;\n   int yCoordinate = 250;\n   ```\n\
    5. Click the Run button and test where the blue-and-white circle is. The circle\
    \ will now be at *x* = 0 and *y* = 250, putting it in the center on the very left\
    \ of the canvas (refer to [Figure 5-10](#08_9781119404170-ch05.xhtml_c05-fig-0010)).\n\
    6. Change the `yCoordinate` variable to have a value of 0, too (see [Figure 5-11](#08_9781119404170-ch05.xhtml_c05-fig-0011)):\n\
    \   ```javascript\n   int xCoordinate = 0;\n   int yCoordinate = 0;\n   ```\n\
    7. Click the Run button and make sure the blue-and-white circle is in the upper-left\
    \ corner of the canvas.\n\n![image](images/9781119404170-fg0507.png)\n\n[FIGURE\
    \ 5-7:](#08_9781119404170-ch05.xhtml_rc05-fig-0007) Two variables to keep track\
    \ of the *x* and *y* location of the circle.\n\n![image](images/9781119404170-fg0508.png)\n\
    \n[FIGURE 5-8:](#08_9781119404170-ch05.xhtml_rc05-fig-0008) Using the two variables\
    \ in the ellipse method call.\n\n![image](images/9781119404170-fg0509.png)\n\n\
    [FIGURE 5-9:](#08_9781119404170-ch05.xhtml_rc05-fig-0009) Test the code to make\
    \ sure the circle is still in the center.\n\n![image](images/9781119404170-fg0510.png)\n\
    \n[FIGURE 5-10:](#08_9781119404170-ch05.xhtml_rc05-fig-0010) Change the `xCoordinate`\
    \ variable to 0 to move the circle to the left.\n\n![image](images/9781119404170-fg0511.png)\n\
    \n[FIGURE 5-11:](#08_9781119404170-ch05.xhtml_rc05-fig-0011) Change the `yCoordinate`\
    \ variable to 0 to move the circle to the top.\n\nNow that you have two variables\
    \ that can help move your circle around the canvas, you can write two methods\
    \ to change the value of the variables while the canvas is still open.\n\n###\
    \ Creating A CUSTOM METHOD\n\nNow that you have two variables, `xCoordinate` and\
    \ `yCoordinate`, that control where your circle is drawn on the canvas, you can\
    \ write a method to change the value of the variables while the canvas is still\
    \ open.\n\n1. Write a new method called `moveDownAndRight` that doesn’t return\
    \ anything and has no parameters (see [Figure 5-12](#08_9781119404170-ch05.xhtml_c05-fig-0012)):\n\
    \   ```javascript\n   void moveDownAndRight()\n   {\n   }\n   ```\n   Make sure\
    \ the `xCoordinate` and `yCoordinate` variables are both set to 0 (refer to [Figure\
    \ 5-12](#08_9781119404170-ch05.xhtml_c05-fig-0012)):\n   ```javascript\n   int\
    \ xCoordinate = 0;\n   int yCoordinate = 0;\n   ```\n2. Set the `xCoordinate`\
    \ and `yCoordinate` variables to be what they were before, plus 1 (see [Figure\
    \ 5-13](#08_9781119404170-ch05.xhtml_c05-fig-0013)):\n   ```javascript\n   void\
    \ moveDownAndRight()\n   {\n     xCoordinate = xCoordinate + 1;\n     yCoordinate\
    \ = yCoordinate + 1;\n   }\n   ```\n   So, if `xCoordinate` starts at 0, then\
    \ the first time `moveDownAndRight` is called, `xCoordinate` will be set to 1,\
    \ and the second time the method is called, it will be set to 2. This will happen\
    \ until the canvas is closed.\n3. Add a line of code to call the `moveDownAndRight`\
    \ method after the circle is drawn (see [Figure 5-14](#08_9781119404170-ch05.xhtml_c05-fig-0014)):\n\
    \   ```javascript\n   void draw()\n   {\n     stroke(255, 255, 255);\n     fill(0,\
    \ 0, 250);\n     ellipse(xCoordinate, yCoordinate, 300, 300);\n     moveDownAndRight();\n\
    \   }\n   ```\n4. Click the Run button to test the code you just wrote.\nBecause\
    \ the draw method is called over over until the canvas is closed, the circle should\
    \ start to move down and to the right (see [Figure 5-15](#08_9781119404170-ch05.xhtml_c05-fig-0015)).\n\
    5. As you noticed, the circle gets drawn over and over, but you can see the trail\
    \ of circles that it draws. If you want to make the circle move without seeing\
    \ its trail, add a call to the `background` method before you draw the circle\
    \ (see [Figure 5-16](#08_9781119404170-ch05.xhtml_c05-fig-0016)):\n   ```javascript\n\
    \   void draw()\n   {\n     background(255, 0, 0);\n     stroke(255, 255, 255);\n\
    \     fill(0, 0, 250);\n     ellipse(xCoordinate, yCoordinate, 300, 300);\n  \
    \   moveDownAndRight();\n   }\n   ```\n   Now, your `draw` method does the following\
    \ steps:\n\n* Makes the canvas all red\n* Draws a circle that has a white outline\
    \ and a blue fill\n* Updates the location of the circle\n* Repeats until the canvas\
    \ is closed.\n"
  raw: "[FIGURE 5-2:](#08_9781119404170-ch05.xhtml_rc05-fig-0002) The `setup` method\
    \ body with a new, red canvas.\n\n![image](images/9781119404170-fg0503.png)\n\n\
    [FIGURE 5-3:](#08_9781119404170-ch05.xhtml_rc05-fig-0003) A red canvas appears\
    \ when you click the Run button.\n\nWhen making a simple program, the `setup`\
    \ method will probably be very simple, like the one you just wrote. But when you\
    \ move into making a videogame, the setup code can get more complicated. You’ll\
    \ see that later in this book.\n\n### WRITING THE DRAW METHOD\n\nThe next method\
    \ is called `draw`. This method is automatically called after the setup method\
    \ finishes executing. The `draw` method is then called repeatedly (over and over)\
    \ until the canvas is closed.\n\n1.  **Under the** `setup` **method, *after* the\
    \ closed curly brace, add another method called** `draw` **that has no return\
    \ data and doesn’t take any parameters (see** [**Figure 5-4**](#08_9781119404170-ch05.xhtml_c05-fig-0004)**):**\n\
    \n    `void draw()`\n\n    `{`\n\n    `}`\n\n2.  **Inside the** `method` **body,\
    \ add three lines of code to draw a circle in the center of the canvas that has\
    \ a white outline and blue fill (see** [**Figure 5-5**](#08_9781119404170-ch05.xhtml_c05-fig-0005)**):**\n\
    \n    `void draw()`\n\n    `{`\n\n    **`stroke(255, 255, 255);`**\n\n    **`fill(0,\
    \ 0, 250);`**\n\n    **`ellipse(250, 250, 300, 300);`**\n\n    `}`\n\n3.  **Press\
    \ the Run button and make sure that the circle is drawn (see** [**Figure 5-6**](#08_9781119404170-ch05.xhtml_c05-fig-0006)**).**\n\
    \n![image](images/9781119404170-fg0504.png)\n\n[FIGURE 5-4:](#08_9781119404170-ch05.xhtml_rc05-fig-0004)\
    \ An empty `draw` method.\n\n![image](images/9781119404170-fg0505.png)\n\n[FIGURE\
    \ 5-5:](#08_9781119404170-ch05.xhtml_rc05-fig-0005) Three lines of code to create\
    \ a blue circle with a white outline.\n\n![image](images/9781119404170-fg0506.png)\n\
    \n[FIGURE 5-6:](#08_9781119404170-ch05.xhtml_rc05-fig-0006) The blue-and-white\
    \ circle on the canvas.\n\nThe `draw` method is called over and over and over\
    \ again, but the circle only appears once. This is because the circle is actually\
    \ being drawn over and over, but it’s being drawn in the exact same place, so\
    \ you can’t see any changes. In the next section, you’ll learn how to make a simple\
    \ animation!\n\n## WRITING YOUR FIRST TWO ORIGINAL METHODS\n\nYour goal for this\
    \ section is to make the circle you made in the previous section (refer to [Figure\
    \ 5-6](#08_9781119404170-ch05.xhtml_c05-fig-0006)) move across the screen!\n\n\
    ### CREATING TWO USEFUL VARIABLES\n\nAbove the two methods, you need to add two\
    \ variables that will keep track of the *x*- and *y*-coordinates of your ellipse.\n\
    \n1.  **To get started, add two variables called** `xCoordinate` **and** `yCoordinate`**.\
    \ The variables should be type** `int` **(number) and should have the value 250\
    \ (see** [**Figure 5-7**](#08_9781119404170-ch05.xhtml_c05-fig-0007)**):**\n\n\
    \    `int xCoordinate = 250;`\n\n    `int yCoordinate = 250;`\n\n2.  **Replace\
    \ both the 250 values in the** `ellipse` **method call with the variables you\
    \ created in Step 1 (see** [**Figure 5-8**](#08_9781119404170-ch05.xhtml_c05-fig-0008)**):**\n\
    \n    `void draw()`\n\n    `{`\n\n    `stroke(255, 255, 255);`\n\n    `fill(0,\
    \ 0, 250);`\n\n    **`ellipse(xCoordinate, yCoordinate, 300, 300);`**\n\n    `}`\n\
    \n3.  **Click the Run button to test to make sure the blue-and-white circle is\
    \ still where it was in** [**Figure 5-6**](#08_9781119404170-ch05.xhtml_c05-fig-0006)**.**\n\
    \n    Because you set the two variables both to 250, the circle stays in the same\
    \ place (see [Figure 5-9](#08_9781119404170-ch05.xhtml_c05-fig-0009)).\n\n4. \
    \ **Change the** `xCoordinate` **variable to have a value of 0 (see** [**Figure\
    \ 5-10**](#08_9781119404170-ch05.xhtml_c05-fig-0010)**):**\n\n    `int xCoordinate\
    \ = 0;`\n\n    `int yCoordinate = 250;`\n\n5.  **Click the Run button and test\
    \ where the blue-and-white circle is.**\n\n    The circle will now be at *x* =\
    \ 0 and *y* = 250, putting it in the center on the very left of the canvas (refer\
    \ to [Figure 5-10](#08_9781119404170-ch05.xhtml_c05-fig-0010)).\n\n6.  **Change\
    \ the yCoordinate variable to have a value of 0, too (see** [**Figure 5-11**](#08_9781119404170-ch05.xhtml_c05-fig-0011)**):**\n\
    \n    `int xCoordinate = 0;`\n\n    `int yCoordinate = 0;`\n\n7.  **Click the\
    \ Run button and make sure the blue-and-white circle is in the upper-left corner\
    \ of the canvas.**\n\n![image](images/9781119404170-fg0507.png)\n\n[FIGURE 5-7:](#08_9781119404170-ch05.xhtml_rc05-fig-0007)\
    \ Two variables to keep track of the *x* and *y* location of the circle.\n\n![image](images/9781119404170-fg0508.png)\n\
    \n[FIGURE 5-8:](#08_9781119404170-ch05.xhtml_rc05-fig-0008) Using the two variables\
    \ in the ellipse method call.\n\n![image](images/9781119404170-fg0509.png)\n\n\
    [FIGURE 5-9:](#08_9781119404170-ch05.xhtml_rc05-fig-0009) Test the code to make\
    \ sure the circle is still in the center.\n\n![image](images/9781119404170-fg0510.png)\n\
    \n[FIGURE 5-10:](#08_9781119404170-ch05.xhtml_rc05-fig-0010) Change the `xCoordinate`\
    \ variable to 0 to move the circle to the left.\n\n![image](images/9781119404170-fg0511.png)\n\
    \n[FIGURE 5-11:](#08_9781119404170-ch05.xhtml_rc05-fig-0011) Change the `yCoordinate`\
    \ variable to 0 to move the circle to the top.\n\nNow that you have two variables\
    \ that can help move your circle around the canvas, you can write two methods\
    \ to change the value of the variables while the canvas is still open.\n\n###\
    \ CREATING A CUSTOM METHOD\n\nNow that you have two variables, `xCoordinate` and\
    \ `yCoordinate`, that control where your circle is drawn on the canvas, you can\
    \ write a method to change the value of the variables while the canvas is still\
    \ open.\n\n1.  **Write a new method called** `moveDownAndRight` **that doesn’t\
    \ return anything and has no parameters (see** [**Figure 5-12**](#08_9781119404170-ch05.xhtml_c05-fig-0012)**):**\n\
    \n    `void moveDownAndRight()`\n\n    `{`\n\n    `}`\n\n    Make sure the `xCoordinate`\
    \ and `yCoordinate` variables are both set to 0 (refer to [Figure 5-12](#08_9781119404170-ch05.xhtml_c05-fig-0012)):\n\
    \n    `int xCoordinate = 0;`\n\n    `int yCoordinate = 0;`\n\n2.  **Set the**\
    \ `xCoordinate` **and** `yCoordinate` **variables to be what they were before,\
    \ plus 1 (see** [**Figure 5-13**](#08_9781119404170-ch05.xhtml_c05-fig-0013)**):**\n\
    \n    `void moveDownAndRight()`\n\n    `{`\n\n    **`xCoordinate = xCoordinate\
    \ + 1;`**\n\n    **`yCoordinate = yCoordinate + 1;`**\n\n    `}`\n\n    So, if\
    \ `xCoordinate` starts at 0, then the first time the `moveDownAndRight` method\
    \ is called, the `xCoordinate` variable will be set to 1, and the second time\
    \ the method is called, the variable will be set to 2\\. This will happen forever\
    \ until the canvas is closed.\n\n3.  **Add a line of code to call the** `moveDownAndRight`\
    \ **method after the circle is drawn (see** [**Figure 5-14**](#08_9781119404170-ch05.xhtml_c05-fig-0014)**):**\n\
    \n    `void draw()`\n\n    `{`\n\n    `stroke(255, 255, 255);`\n\n    `fill(0,\
    \ 0, 250);`\n\n    `ellipse(xCoordinate, yCoordinate, 300, 300);`\n\n    **`moveDownAndRight();`**\n\
    \n    `}`\n\n4.  **Click the Run button to test the code you just wrote.**\n\n\
    \    Because the draw method is called over and over until the canvas is closed,\
    \ the circle should start to move down and to the right (see [Figure 5-15](#08_9781119404170-ch05.xhtml_c05-fig-0015)).\n\
    \n5.  **As you noticed, the circle gets drawn over and over, but you can see the\
    \ trail of circles that it draws. If you want to make the circle move without\
    \ seeing its trail, add a call to the** `background` **method before you draw\
    \ the circle (see** [**Figure 5-16**](#08_9781119404170-ch05.xhtml_c05-fig-0016)**):**\n\
    \n    `void draw()`\n\n    `{`\n\n    **`background(255, 0, 0);`**\n\n    `stroke(255,\
    \ 255, 255);`\n\n    `fill(0, 0, 250);`\n\n    `ellipse(xCoordinate, yCoordinate,\
    \ 300, 300);`\n\n    `moveDownAndRight();`\n\n    `}`\n\n    Now, your `draw`\
    \ method does the following steps:\n\n    *   Makes the canvas all red\n\n   \
    \ *   Draws a circle that has a white outline and a blue fill\n\n    *   Updates\
    \ the location of the circle\n\n    *   Repeats until the canvas is closed"
