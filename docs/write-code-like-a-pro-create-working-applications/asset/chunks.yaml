  trans: "\n有时，当你点击“查看图像”（View Image）时，会打开一个新标签页显示图片，你可以右键点击并选择“图片另存为”。其他时候，当你点击“查看图像”时，会打开一个新标签页，你可以在其中下载图片。在这个示例中，打开的新标签页是\
    \ [`www.pixabay.com`](http://www.pixabay.com)。\n\n6. **点击“免费下载”（参见图 7-10）。**\n\
    \n7. **选择你需要的尺寸（参见图 7-11）。** 你稍后会更改尺寸，所以现在选择什么尺寸并不重要。\n\n8. **可能会出现带有验证码的弹出窗口（参见图\
    \ 7-12）；如果是这样，请填写。**\n\n9. **打开你刚刚下载的图片。**\n如果你使用的是 Mac，请在“预览”（Preview）中打开图片。（如果你双击图片文件，它可能会自动在“预览”中打开。）选择“工具”→“调整大小”（参见图\
    \ 7-13）。\n如果你使用的是 PC，请在“画画”（Paint）中打开图片。点击菜单栏中的“首页”选项卡并选择“调整大小”。\n\n10. **将图像高度更改为\
    \ 100 像素（参见图 7-14）。**\n在 Mac 上，确保勾选“等比例比例”（Scale Proportionally）按钮，这样图片就不会被压缩。\n\
    在 PC 上，该按钮是“保持纵横比”（Maintain Aspect Ratio）而不是“等比例”。\n\n11. **选择“处理首选项”（Processing\
    \ Preferences）来找到保存项目的 Processing 文件夹（参见图 7-15）。**\n在弹出窗口顶部，你应该能看到“草稿位置”（Sketchbook\
    \ Location），这就是你电脑上 Processing 文件夹所在的位置（参见图 7-16）。\n\n12. **保存你的 Sketch 项目，并命名为\
    \ FirstVideoGame。**\n\n13. **打开 FirstVideoGame 文件夹并将下载的图片移动到该文件夹中（参见图 7-17）。**\n\
    \n14. **为你的程序添加三行代码将角色添加到场景中（参见图 7-18）。**\n首先，添加代表角色的变量。这需要添加到程序的顶部，位于 `setup`\
    \ 方法之外，以便所有方法都够访问它：\n\n```java\nPImage character;\n```\n添加一行代码将图像加载到程序中，并添加一行代码将图像放置在屏幕最左侧草地上方的：\n\
    \n```java\ncharacter = loadImage(\"penguin.png\");\nimage(character, 0, 300);\n\
    ```\n\n15. **点击“运行”（Run）按钮测试角色是否加载在正确的位置。**\n\n![image](img/9781119404170-fg0707.png)\n\
    图 7-7: 在 Google 上搜索卡通图片。\n\n![image](img/9781119404170-fg0708.png)\n图 7-8: 寻找你可以使用并修改的图片。\n\
    \n![image](img/9781119404170-fg0709.png)\n图 7-9: 选择一个角色。\n\n![image](img/9781119404170-fg0710.png)\n\
    图 7-10: 下载图片。\n\n![image](img/9781119404170-fg0711.png)\n图 7-11: 选择图片尺寸。\n\n![image](img/9781119404170-fg0712.png)\n\
    图 7-12: 你可能需要填写验证码。\n\n![image](img/9781119404170-fg0713.png)\n图 7-13: 打开图片调整尺寸。\n\
    \n![image](img/9781119404170-fg0714.png)\n图 7-14: 调整图片高度为 100 像素并保持等比例。\n\n![image](img/9781119404170-fg0715.png)\n\
    图 7-15: Processing 选项。\n\n![image](img/9781119404170-fg0716.png)\n图 7-16: Processing\
    \ 文件夹的位置。\n\n![image](img/9781119404170-fg0717.png)\n图 7-17: 将图片移动到 FirstVideoGame\
    \ 文件夹。\n\n![image](img/9781119404170-fg0718.png)\n图 7-18: 将角色添加到场景中的三行代码。\n\n\
    太棒了！现在你的场景中有一个角色了！在下一节中，你将学习如何角色在屏幕上移动。\n\n## 为你的游戏添加移动功能\n\n现在你已经有了场景和角色，是时候让它在场景中移动了。按照以下步骤操作：\n\
    \n1. 在程序顶部添加两个角色的 `x` 和 `y` 坐标变量；将它们初始化为 `characterX = 0` 和 `characterY = 300`（参见图\
    \ 7-19）。\n\n```java\nint characterX = 0;\nint characterY = 300;\n```\n2. 将 `image`\
    \ 方法中的 `0` 和 `300` 替换为 `characterX` 和 `character`（参见图 7-20）。\n\n```java\nimage(character,\
    \ characterX, characterY);\n```\n3. 添加一个空的 `keyPressed` 方法（参见图 7-21）。\n\n```java\n\
    void keyPressed() {\n}\n```\n4. 在 `keyPressed` 方法中添加条件语句，检查是否按了 A 或 D（参见图 7-22）。\n\
    \n```java\nvoid keyPressed() {\n  if (key == 'a') {\n  } else if (key == 'd')\
    \ {\n  }\n}\n```\n5. 添加代码根据是否按了 A 或 D 键来更新 `characterX` 变量以向左右移动（参见图 7-23）。\n\n\
    ```java\nvoid keyPressed() {\n  if (key == 'a') {\n    characterX = characterX\
    \ - 10;\n  } else if (key == 'd') {\n    characterX = characterX + 10;\n  }\n\
    }\n```\n6. 添加一个 `draw` 方法并持续调用 `image` 方法，这样每次按下 A 或 D 键时，角色的位置都会更新（参见图 7-24）。\n\
    \n```java\nvoid draw() {\n  image(character, characterX, characterY);\n}\n```\n\
    7. 测试你的代码，确保在按下 A 和 D ，角色会左右移动（参见图 7-25）。\n\n![image](img/9781119404170-fg0719.png)\n\
    图 7-19: 用于跟踪位置的两个变量。\n\n![image](img/9781119404170-fg0720.png)\n图 7-20: 使用第 1\
    \ 步的变量更新角色位置。\n\n![image](img/9781119404170-fg0721.png)\n图 7-21: 添加一个 `keyPressed`\
    \ 方法。\n\n![image](img/9781119404170-fg0722.png)\n图 7-22: 检查是否按了 A 或 D 的条件语句。\n\
    \n![image](img/9781119404170-fg0723.png)\n图 7-23: 使用第 1 步的变量代替硬编码值。\n\n![image](img/9781119404170-fg0724.png)\n\
    图 7-24: 添加一个 `draw` 方法来始终更新角色的位置。\n\n"
- fmt: "\nAs you may have noticed in [Figure 7-25](#10_9781119404170-ch07.xhtml_c07-fig-0025),\
    \ there is a trail of your character being left behind each time you press A or\
    \ D. To fix this, you have to redraw the scene each time you redraw the character.\
    \ Follow these steps:\n\n1. **Create a new method called `drawScene` and move\
    \ the code for the background color, grass, and two hills into the `drawScene`\
    \ method (see [Figure 7-26](#10_9781119404170-ch07.xhtml_c07-fig-0026)):**\n\n\
    ```java\nvoid drawScene()\n{\n  //Sky\n  background(173, 216, 230);\n  //Grass\n\
    \  stroke(0, 255, 0);\n  fill(0, 255, 0);\n  rect(0, 400, 1000, 500);\n  //Hills\n\
    \  stroke(165, 42, 42);\n  fill(165, 42, 42);\n  arc(300, 400, 100, 150, PI, TWO_PI);\n\
    \  arc(600, 400, 100, 150, PI, TWO_PI);\n}\n```\n\nMake sure you update the comments\
    \ in your code.\n\n2. **Add a call to the `drawScene` method in your `setup` method\
    \ (see [Figure 7-27](#10_9781119404170-ch07.xhtml_c07-fig-0027)):**\n\n```java\n\
    void setup()\n{\n  //Canvas\n  size(1000, 500);\n  //Draw the sky, grass, and\
    \ hills\n  drawScene();\n  //Create the character\n  character = loadImage(\"\
    penguin.png\");\n  image(character, characterX, characterY);\n}\n```\n\n3. **Add\
    \ a call to the `drawScene` method in your `draw` method (see [Figure 7-28](#10_9781119404170-ch07.xhtml_c07-fig-0028)):**\n\
    \n```java\nvoid draw()\n{\n  //Redraw the sky, grass, and hills\n  drawScene();\n\
    \  //Redraw the character\n  image(character, characterX, characterY);\n}\n```\n\
    \n4. **Test your code to make sure the scene is still correct (see [Figure 7-29](#10_9781119404170-ch07.xhtml_c07-fig-0029)).**\n\
    \nNow when you move your character, it shouldn’t leave a trail.\n\n![image](images/9781119404170-fg0726.png)\n\
    \n[FIGURE 7-26:](#10_9781119404170-ch07.xhtml_rc07-fig-0026) Move the `drawScene`\
    \ code to a new method.\n\n![image](images/9781119404170-fg0727.png)\n\n[FIGURE\
    \ 7-27:](#10_9781119404170-ch07.xhtml_rc07-fig-0027) Call `drawScene` from `setup`.\n\
    \n![image](images/9781119404170-fg0728.png)\n\n[FIGURE 7-28:](#10_9781119404170-ch07.xhtml_rc07-fig-0028)\
    \ Call `drawScene` from `draw`.\n\n![image](images/9781119404170-fg0729.png)\n\
    \n[FIGURE 7-29:](#10_9781119404170-ch07.xhtml_c07-fig-0029) Test to make sure\
    \ that your character moves without a trail.\n\n## ADDING GRAVITY TO YOUR VIDEOGAME\n\
    \nOne strange aspect of your game right now is that your character just runs right\
    \ through the hills (see [Figure 7-30](#10_9781119404170-ch07.xhtml_c07-fig-0030)).\n\
    \n![image](images/9781119404170-fg0730.png)\n\n[FIGURE 7-30:](#10_9781119404170-ch07.xhtml_rc07-fig-0030)\
    \ Your character can run through the hills.\n\nIn this section, you’ll make it\
    \ so that your character can move up when you press the spacebar and will move\
    \ down automatically. This is essentially gravity. Follow these steps:\n\n1. **Add\
    \ a third condition to the conditional statement to change the `characterY` variable\
    \ when the spacebar is pressed (see [Figure 7-31](#10_9781119404170-ch07.xhtml_c07-fig-0031)):**\n\
    \n```java\nelse if(key == ' ')\n{\n  characterY = characterY - 5;\n}\n```\n\n\
    2. **Add a conditional statement to the `draw` method to change the `characterY`\
    \ variable to move the character down, as long as it’s still above the grass (see\
    \ [Figure 7-32](#10_9781119404170-ch07.xhtml_c07-fig-0032)):**\n\n```java\nvoid\
    \ draw()\n{\n  //Redraw the sky, grass, and hills\n  drawScene();\n  if(characterY\
    \ < 300)\n  {\n    characterY = characterY + 2;\n  }\n  //Redraw the character\n\
    \  image(character, characterX, characterY);\n}\n```\n\n3. **Adjust the numbers\
    \ for changing the `characterY` variable so that you can jump high and fall slowly\
    \ (see [Figure 7-33](#10_9781119404170-ch07.xhtml_c07-fig-0033)):**\n\nIn the\
    \ condition in the `draw` method that checks if character is less than 300:\n\
    `characterY = characterY + 2;`\n\nIn the condition in the `keyPressed` method\
    \ that checks if the key was pressed the spacebar:\n`characterY = characterY -\
    \ 100;`\n\n4. **Adjust the numbers for changing the `characterX` variable so that\
    \ you can jump over the hills (see [Figure 7-34](#10_9781119404170-ch07.xhtml_c07-fig-0034)):**\n\
    \nIn the condition in the `keyPressed` method that checks if the key was pressed\
    \ the letter A:\n`characterX = characterX - 10;`\n\nIn the condition in the `keyPressed`\
    \ method that checks if the key was pressed the letter D:\n`characterX = characterX\
    \ + 10;`\n\n![image](images/9781119404170-fg0731.png)\n\n[FIGURE 7-31:](#10_9781119404170-ch07.xhtml_rc07-fig-0031)\
    \ Move the character up when the spacebar is pressed.\n\n![image](images/9781119404170-fg0732.png)\n\
    \n[FIGURE 7-32:](#10_9781119404170-ch07.xhtml_rc07-fig-0032) Move the character\
    \ down when it’s above the grass.\n\n![image](images/9781119404170-fg0733.png)\n\
    \n[FIGURE 7-33:](#10_9781119404170-ch07.xhtml_rc07-fig-0033) Make the jumping\
    \ and gravity more realistic.\n\n![image](images/9781119404170-fg0734.png)\n\n\
    [Figure 7-34:](#10_9781119404170-ch07.xhtml_rc07-fig-0034) Make the movement more\
    \ realistic now that the character can jump.\n\nCongratulations! You’ve added\
    \ gravity to your world!\n\n## MAKING LAVA PITS\n\nMaking so that your character\
    \ can land on the hills is very complex coding, because Processing doesn’t support\
    \ detecting when a character is touching a certain color. So, instead, you’ll\
    \ modify your code to replace the hills with lava! Follow these steps:\n\n1. **In\
    \ your `drawScene` method, modify the code to be upside down and red (see [Figure\
    \ 7-35](#10_9781119404170-ch07.xhtml_c07-fig-0035)):**\n\n```java\nvoid drawScene()\n\
    {\n  //Sky\n  background(173, 216, 230);\n  //Grass\n  stroke(0, 255, 0);\n  fill(0,\
    \ 255, 0);\n  rect(0, 400, 1000, 500);\n  //Lava Pits\n  stroke(255, 0, 0);\n\
    \  fill(255, 0, 0);\n  arc(300, 400, 100, 150, PI, TWO_PI);\n  arc(600, 400, 100,\
    \ 150, PI, TWO_PI);\n}\n```\n\n2. **Add a line of code to the end of your `draw`\
    \ method to display the value of `characterX` as it moves so that you know it’s\
    \ touching the lava (see [Figure 7-36](#10_9781119404170-ch07.xhtml_c07-fig-0036)):**\n\
    \n`text(characterX, characterY - 5);`\n\n3. **Add a conditional statement to the\
    \ end of your `draw` method that checks if the `characterX` variable is within\
    \ the range of the lava pit.**\n\nTo do this, you need to make sure that `characterX`\
    \ is between 150 and 310. You can use the `&&` symbol to do this. This symbol\
    \ means “and,” so you’re checking if the value of the `characterX` variable is\
    \ greater than 150 *and* less than 310. It’s also a good idea to put this into\
    \ an extra set of parentheses so that when you add more conditions (in Step 4)\
    \ the computer knows which comparisons to make (see Figure 7-37](#10_9781119404170-ch07.xhtml_c07-fig-0037)):\n\
    \n```java\n//Check to see if the character hit the lava\nif((characterX >= 150\
    \ && characterX <= 310))\n{\n}\n```\n\n4. **Add to the conditional statement to\
    \ check to see if the character variable is within the range of the second lava\
    \ pit. To do this, you’ll use the `||` symbol, which means “or” (see [Figure 7-38](#10_9781119404170-ch07.xhtml_c07-fig-0038)):**\n\
    \n```java\nif((characterX >= 150 && characterX <= 310) || (characterX >= 450 &&\
    \ characterX <= 610))\n```\n\nThis line of code means “if `characterX` is between\
    \ 150 and 310 *or* between 450 and 610.” Notice that there are parentheses around\
    \ each part of the statement. This is to make sure that you’re checking each part\
    \ correctly. Without the parentheses, the code might get read by the computer\
    \ incorrectly. Adding parentheses ensures that the computer knows exactly what\
    \ you meant to code.\n"
