  trans: "\n\n```javascript\nyCoordinate = yCoordinate + speed;\n}\n```\n\n2. **在你的\
    \ `draw` 方法中找到对 `ellipse` 方法的调用，并将 `xCoordinate` 修改为 `mouseX`，将 `yCoordinate`\
    \ 修改为 `mouseY`（参见图 6-2）。\n\n   你应该修改的代码行是对 `ellipse` 的调用：\n\n```javascript\nellipse(mouseX,\
    \ mouseY, 300, 300);\n```\n\n3. **注释掉调用你的 `moveDownAndRight` 方法的代码行（参见图 6-3）。**\n\
    \n   因为现在圆的位置将通过 `mouseX` 和 `mouseY` 变量进行更新，你不再需要更新 `xCoordinate` 或 `yCoordinate`\
    \ 变量了。\n\n   **记住：** 要注释掉代码，可以在代码行前面加上两个 `//`，如下所示：\n\n```javascript\n//moveDownAndRight(8);\n\
    ```\n\n   虽然通常删除未使用的代码更好，但当你不确定将进行哪些更改时，先注释掉这些行可能会更好。等你的代码按照你想要的方式正常运行后，就可以删除注释的代码以便于阅读。\n\
    \n4. **点击运行（Run）按钮，观察你的圆如何移动到鼠标所在的位置（参见图 6-5）！**\n\n![image](img/9781119404170-fg0601.png)\n\
    \n图 6-1： 来自第 5 章末尾的 CircleAnimation 草图。\n\n![image](img/9781119404170-fg0602.png)\n\
    \n图 6-2： 修改代码将圆移动到鼠标所在的位置。\n\n![image](img/9781119404170-fg0603.png)\n\n图 6-3：\
    \ 注释掉对 `moveDownAndRight` 方法调用。\n\n![image](img/9781119404170-fg0604.png)\n\n\
    图 6-4： 删除了未使用代码的 CircleAnimation 代码变体。\n\n![image](img/9781119404170-fg0605.png)\n\
    \n图 6-5： 当你运行代码时，圆始终跟随鼠标。\n\n## 与鼠标点击交互\n\n有时你可能希望形状始终跟随鼠标移动，但其他时候你又希望形状仅在用户点击鼠标时才随之移动。把它想象成“点击并拖拽”。你可能在网站或游戏上遇到这种情况，比如有一个圆，你必须点击并拖动它来提交问题的答案。\n\
    \n例如，你可能遇到过像 W3Schools.com 网站上的滑动块（[www.w3schools.com/howto/howto_js_rangeslider.asp](http://www.w3schools.com/howto/howto_js_rangeslider.asp)；参见图\
    \ 6-6）。\n\n![image](img/9781119404170-fg0606.png)\n\n图 6-6： 这种滑动块的设计使得仅当用户点击并拖拽它们时，形状才会水平移动。\n\
    \n你可以通过使用应用程序自带的另一个 Processing 方法 `mouseDragged` 来快速将你的代码转换为滑动块版本。按照以下步骤操作：\n\n\
    1. **添加另一个名为** `mouseDragged` 的方法，该方法不返回值且不接受参数（参见图 6-7）。\n\n   `mouseDragged`\
    \ 是 Processing 在用户点击并移动鼠标时知道要调用的方法。你在 `draw` 方法之后、`moveDownAndRight` 方法之前添加的代码如下：\n\
    \n```javascript\nvoid mouseDragged() {\n\n}\n```\n\n2. 在 `mouseDragged` 中添加两行代码，将\
    \ `xCoordinate` 和 `yCoordinate` 变量更新为鼠标位置（参见图 6-8）。\n\n   这两行代码是：\n\n```javascript\n\
    xCoordinate = mouseX;\nyCoordinate = mouseY;\n```\n\n3. 将 `ellipse` 方法调用改为 `xCoordinate`\
    \ 和 `yCoordinate`，而不是 `mouseX` 和 `mouseY`（参见图 6-9）。\n\n   `ellipse` 的调用现在应该是：\n\
    \n```javascript\nellipse(xCoordinate, yCoordinate, 300, 300);\n```\n\n4. **点击运行按钮，确保圆只在你拖拽鼠标时才移动。**\n\
    \n   如果你松开鼠标，圆应该停止移动。如果你在按下按钮的情况下上下鼠标，圆不会移动。\n\n![image](img/9781119404170-fg0607.png)\n\
    \n图 6-7： 空的 `mouseDragged` 方法。\n\n![image](img/9781119404170-fg0608.png)\n\n图\
    \ 6-8： 两行代码。\n\n![image](img/9781119404170-fg0609.png)\n\n图 6-9： 更新后的 `ellipse`\
    \ 调用。\n\n"
- fmt: "\nAs you might notice, there are very specific parts to a conditional statement,\
    \ just like there were for method calls and method definitions:\n\n```\nif(CONDITION)\n\
    {\n  CODE\n}\nelse\n{\n  CODE\n}\n```\n\nA conditional statement always starts\
    \ with a lower-cased `if` followed by open and closed parentheses. In between\
    \ the open and closed parentheses there is a condition. This is something that\
    \ must evaluate to true or false. In the `eatDinner` example above, the condition\
    \ was `eatDinner == true`. If the variable `eatDinner` is true, then the entire\
    \ condition is actually `true == true`, which evaluates to true. If the `eatDinner`\
    \ is false, then the entire condition is actually `false == true`, which evaluates\
    \ to false. You can think of a condition as a question that has a yes or no answer\
    \ (true = yes, false = no).\n\nAnother interesting feature of conditional statements\
    \ is that you don’t always have to have the `else` part. This is a valid conditional\
    \ statement:\n\n```\nif(CONDITION)\n{\n}\n```\n\nSometimes you don’t have an alternative.\
    \ For example, maybe your parents say if you don’t eat dinner, you don’t get anything!\
    \ Your code would look like this:\n\n```\nif(eatDinner == true)\n{\n  giveIceCream();\n\
    }\n```\n\nYou also might have more than one option. For example, maybe you have\
    \ a deal with your parents that says if you get at least 90 points on your exam,\
    \ you get a chocolate sundae, but if you get at least 70 points you at least get\
    \ a scoop of ice cream, and if you get under 70 points you get grounded. Your\
    \ code would look like this:\n\n```\nif(examPoints >= 90)\n{\n  giveChocolateSundae();\n\
    }\nelse if(examPoints >= 70)\n{\n  giveScoop();\n}\nelse\n{\n  giveGrounding();\n\
    }\n```\n\nNotice that the condition for these `if` statements still evaluate to\
    \ true or false, but they’re comparing a variable to a number instead of to true\
    \ or false.\n\nDo you think that if you received 91 points you would get a chocolate\
    \ sundae and a scoop of ice cream? You did get `>= 90` points, but you also got\
    \ `>= 70` points.\n\nNo. You’ll only get the chocolate sundae. That’s because\
    \ conditional statements are considered a block of code and you actually skip\
    \ all the code after you’ve found a condition that is true. So, if you got 91\
    \ points on the exam, then the code inside of the first `if` statement would execute\
    \ (giving you a chocolate sundae) and the code inside the second `if` statement\
    \ and inside of the `else` statement would be skipped over. This is something\
    \ you’ll see throughout this book as well.\n\n### ADDING CONDITIONAL STATEMENTS\
    \ TO YOUR CODE\n\nNow that you’ve had a brief introduction to conditional statements,\
    \ it’s time to add some to the code! You’re going to make it so that when the\
    \ mouse is being pressed, the color of the circle is blue, and when the mouse\
    \ is let go, the color of the circle is green. Follow these steps:\n\n1. Add some\
    \ space around the stroke and fill lines of code so that you can visually separate\
    \ the area where you’re going to add the conditional statement (see [Figure 6-12](#09_9781119404170-ch06.xhtml_c06-fig-0012)).\n\
    \n2. Add an `if` statement around the calls to the stroke and fill methods (see\
    \ [Figure 6-13](#09_9781119404170-ch06.xhtml_c06-fig-0013)).\n\n   Make sure that\
    \ the curly braces are around both lines. The condition for this `if` statement\
    \ should be as follows:\n\n   `mousePressed == true`\n\n   `mousePressed` is a\
    \ variable that the Processing application gives you to use, just like `mouseX`\
    \ and `mouseY`.\n\n``````\nif(mousePressed == true)\n{\n  stroke(255, 255, 255);\n\
    \  fill(0, 0, 250);\n}\n```\n\n3. Add an `else` statement below the `if` statement\
    \ to complete the conditional statement, and add two lines of code inside the\
    \ curly braces of the `if` statement to make the stroke white and the fill green\
    \ (see [Figure 6-14](#09_9781119404170-ch06.xhtml_c06-fig-0014)).\n\n```\nelse\n\
    {\n  stroke(255, 255, 255);\n  fill(0, 255, 0);\n}\n```\n\n4. Press the Run button\
    \ and make sure that when you’re pressing the mouse the circle is blue and when\
    \ you let go it turns green!\n\n![image](images/9781119404170-fg0612.png)\n\n\
    [FIGURE 6-12:](#09_9781119404170-ch06.xhtml_rc06-fig-0012) Add space where the\n\
    \n![image](images/9781119404170-fg0613.png)\n\n[FIGURE 6-13:](#09_9781119404170-ch06.xhtml_c06-fig-0013)\
    \ Add the `if` part of the conditional statement.\n\n![image](images/9781119404170-fg0614.png)\n\
    \n[FIGURE 6-14:](#09_9781119404170-ch06.xhtml_rc06-fig-0014) Add the `else` part\
    \ of the conditional statement.\n\n### MOVING SHAPES WITH THE KEYBOARD\n\nThis\
    \ section introduces you to the keyboard. In the last chapter, you’ll learn how\
    \ to move the shape using the keyboard. Follow these steps:\n\n1. Change the `ellipse`\
    \ method (see [Figure 6-15](#09_9781119404170-ch06.xhtml_c06-fig-0015)).\n\n```\n\
    ellipse(xCoordinate, yCoordinate, 300);\n```\n\n2. Delete the `mouseDragged` method\
    \ you created (see [Figure 6-16](#09_9781119404170-ch06.xhtml_c06-fig-0016)).\n\
    \n3. Add a new `keyPressed` method (see [Figure 6-17](#09_9781119404170-ch06.xhtml_c06-fig-0017)).\n\
    \n```\nvoid keyPressed()\n{\n}\n```\n\n4. Add a conditional statement to your\
    \ `keyPressed` method that checks if the key was W (see [Figure 6-18](#09_9781119404170-ch06.xhtml_c06-fig-0018)).\n\
    \n```\nif(key == 'w')\n{\n}\n```\n\n5. Add a line of code to change the `yCoordinate`\
    \ variable to be the same value, minus 1 pixel. This line should be between the\
    \ open and closed curly braces of the conditional statement:\n\n```\nyCoordinate\
    \ = yCoordinate – 1;\n```\n\n6. Press the Run button and then press the W key.\
    \ Make sure that the circle moves up one pixel each time you press the key.\n\n\
    7. Add three more `if` statement parts to your conditional statement to check\
    \ if the key that was pressed was A, S, or D (see [Figure 6-20](#09_9781119404170-ch06.xhtml_c06-fig-0020)).\n\
    \nMake sure that you’re changing the `xCoordinate` and `yCoordinate` variables\
    \ correctly!\n\n```\nvoid keyPressed()\n{\n  if(key == 'w')\n  {\n    yCoordinate\
    \ = yCoordinate – 1;\n  }\n  else if(key == 'a')\n  {\n    xCoordinate = xCoordinate\
    \ – 1;\n  }\n  else if(key == 's')\n  {\n    yCoordinate = yCoordinate + 1;\n\
    \  }\n  else if(key == 'd')\n  {\n    xCoordinate = xCoordinate + 1;\n  }\n}\n\
    ```\n\n8. Press the Run button and try pressing all four keys (W, A, S, and D)\
    \ to move the circle around the canvas.\n"
