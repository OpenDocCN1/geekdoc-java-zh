    \ Find saved programs inside the folders with the same name.\n\n![image](images/9781119404170-fg0118.png)\n\
    [FIGURE 1-18:](#04_9781119404170-ch01.xhtml_rc01-fig-0018) Open the `StarProgram.dpe`\
    \ file to see the code.\n\n![image](images/9781119404170-fg0119.png)\n[FIGURE\
    \ 1-19:](#04_9781119404170-ch01.xhtml_rc01-fig-0019) The Star program reopened\
    \ in Processing.\n\n![image](images/9781119404170-fg0120.png)\n[FIGURE 1-20:](#04_9781119404170-ch01.xhtml_rc01-fig-0020)\
    \ Create a new program from the File menu.\n\n![image](images/9781119404170-fg0121.png)\n\
    [FIGURE 1-21:](#04_9781119404170-ch01.xhtml_rc01-fig-0021) A blank Sketch file.\n\
    \nIn this chapter, you’ll learn about two very important concepts in Java programming:\
    \ methods and variables. While you’re learning about those, you’ll get to create\
    \ your own canvas and add color to it!\n\n## GETTING TO KNOW THE CANVAS\n\nAs\
    \ you may have noticed in [Chapter 1](#04_9781119404170-ch01.xhtml), when you\
    \ run a Processing program, a canvas pops up. The `canvas` is the window that\
    \ displays the visual part of your program, like the spinning stars in the program\
    \ you tested.\n\n### CREATING A CANVAS\n\nIn this section, you learn a little\
    \ about the canvas, which will be important to understand how you can interact\
    \ with it. Follow these steps:\n\n1. **Open the Processing application and create\
    \ a new program (see** [Figure 2-1](#05_9781119404170-ch02.xhtml_c02-fig-0001)**)..**\n\
    \n2. **Type one line of code to create a canvas that is 500 pixels wide and 500\
    \ pixels tall (see** [Figure 2-2](#05_9781119404170-ch02.xhtml_c02-fig-0002)**)..**\n\
