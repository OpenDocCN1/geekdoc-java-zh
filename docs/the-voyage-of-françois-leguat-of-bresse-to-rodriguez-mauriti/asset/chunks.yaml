    Evidently, says M. Muller, an allusion to the famous scene from *L’Amour Médecin*,
    of Molière.^([4](#C01_chapter_split_000_split_001.xhtml_Rfn8_221)) In orig. :
    “ce qui est l’unique moyen de décision quand il y a contrariété d’opinion entre
    les sacrez Ministres d’Esculape.”^([5](#C01_chapter_split_000_split_001.xhtml_Rfn8_222))
    Phlebotomists, lit. vein cutters, from *ψλέψ, ϕλεβós* a vein, and *τέμνειν*, to
