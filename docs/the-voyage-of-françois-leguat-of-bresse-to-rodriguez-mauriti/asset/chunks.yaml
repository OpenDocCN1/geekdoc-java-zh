    ### LAWS OF THE HAKLUYT SOCIETY.


    I. The object of this Society shall be to print, for distribution among its members,
    rare and valuable Voyages, Travels, Naval Expeditions, and other geographical
    records, from an early period to the beginning of the eighteenth century.II. The
    Annual Subscription shall be One Guinea, payable in advance on the 1st January.III.
    Each member of the Society, having paid his Subscription, shall be entitled to
    a copy of every work produced by the Society, and to vote at the general meetings
    within the period subscribed for; and if he do not signify, before the close of
    the year, his with to resign, he shall be considered as a member for the succeeding
    year.IV. The management of the Society’s affairs shall be veiled in a Council
    confifting of twenty-one members, viz., a President, two *Vice-President*? a Secretary,
    and seventeen ordinary members, to be elected annually ; but vacancies occurring
    between the general meetings shall be filled up by the Council.V. A General Meeting
    of the Subscribers shall be held annually. The Secretary’s Report on the condition
    and proceedings of the Society shall be then read, and the Meeting shall proceed
    to elect the Council for the enfuing year.VI. At each Annual Election, fix of
    the old Council shall retire, of whom three shall be eligible for re-election.VII.
    The Council shall meet when necessary, for the dispatch of bufinefs, three forming
    a quorum, including the Secretary, and the Chairman having a cafling vote.VIII.
    Gentlemen preparing and editing works for the Society, shall receive twenty-five
    copies of such works respectively, and an additional twenty-five copies if the
    work is also translated.


    ### RULES FOR THE DELIVERY OF THE SOCIETY’S VOLUMES.


    I. The Society’s productions will be delivered without any charge, within three
    miles of the General Post Office.II. They will be forwarded to any place beyond
    that limit, the Society paying the coil of booking, but not of carriage ; nor
    will it be anfwerable in this cafe for any loss or damage.III. They will be delivered
    by the Society’s agent, MR. CHARLES J. CLARK, 4, Lincoln’s Inn Fields, to persons
    having written authority of fubfcribers to receive them.IV. They will be sent
    to the Society’s correspondents or agents in the principal towns throughout the
    kingdom ; and care shall be taken that the charge for carriage be as moderate
    as possible.


