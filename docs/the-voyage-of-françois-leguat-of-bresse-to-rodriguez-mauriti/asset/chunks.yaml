    ### Other Works Undertaken by Editors


    - The Letters of Pietro della Valle, transcribed from the early English version
    by G. Havers (1665), and edited by Mr. EDWARD GREY, late of the Indian Civil Service.

    - The Voyages of Foxe and James to Hudson’s Bay. Edited by `MILLER CHRISTY`, Esq.

    - The True History of the Conquest of New Spain, by Bernal Diaz. Translated from
    the Spanish and edited by Rear-Admiral LINDESAY BRINE.

    - The Voyages of the Earl of Cumberland, from the Records prepared by order of
    the Countefs of Pembroke. Edited by `W. DE GRAY BIRCH`, Esq., F.S.A.R.

    - Rofmital’s Embaffy to England, Spain, etc., in 1466\. Edited by `R. C. GRAVES`,
    Esq.

    - A Reprint of 17th Century Books on Seamanship and Sea Matters in General, including
    Captain John Smith’s “Seaman’s Grammar”, from the edition of 1692, and Sir H.
    Manwayring’s “Seaman’s Dictionary”, 1644, with extracts from unpublished MSS.
    Edited, with Notes and an Introduction, by `H. HALLIDAY SPARLING`, Esq.

    - The Travels of Leo Africanus the Moor, from the English translation of John
    Pory (1600). Edited by `ROBERT BROWN`, Esq., M.A., Ph.D., F.L.S., etc.

    - The Travels of Ibn Jobair. Edited by Professor `W. ROBERTSON SMITH`, Fellow
    of Christ’s College, Cambridge.

    - Raleigh’s Empire of Guiana. Second Edition (see No. 3). Edited, with Notes,
    etc., by `EVERARD F. IM THURN`, Esq.

    - The Voyages of Keymis and Berrie to Guiana. Edited by Mr. James Rodway.

    - Dampier’s Voyages. Edited by Lieut. `CECIL DAMPIER`, `R.N.`


    ### WORKS SUGGESTED TO THE COUNCIL FOE PUBLICATION


    - Inedited Letters, etc., of Sir Thomas Roe during his Embaffy to India.

    - The Topographia Chriftiana of Cofmas Indicopleuftes.

    - Bernhard de Breydenbach, 1483-84, A.D. Travels in the Holy Land.

    - Felix Fabri, 1483\. Wanderings in the Holy Land, Egypt, etc.

    - Voyage made by Captain Jaques Cartier in 1535 and 1536 to the Ifles of Canada,
    Hochlega, and Saguenay.

    - Ca da Mofto. Voyages along the Weilern Coaft of Africa in 1454 : translated
    from the Italian text of 1507.

    - J. dos Santos. The History of Eaftern Ethiopia. 1607.

    - Icelandic Sagas narrating the Discovery of America.

    - La Argentina. An account of the Discovery of the Provinces of Rio de la Plata
    from 1512 to the time of Domingo Martinez de Irala; by Ruiz Diaz de Guzman.

    - The History of Ethiopia, by Manoel de Almeida.

    - Journal of the Jesuit Desideri in Tibet.

    - Travels of Friar Rubruquis.

    - Voyages of Willoughby and Chancellor.

    - Letters of Ortelius and Mercator.

    - The Travels of Ibn Batuta.

    - Tasman’s Voyages.

    - The Travels of Teixeiro (from the Portuguese).

    - Voyage of Sarmiento.

    - Travels of the brothers Sherley in Persia.

    - The Voyage of Ralph Fitch.


    ### LAWS OF THE HAKLUYT SOCIETY


    I. The object of this Society shall be to print, for distribution among its members,
    rare and valuable Voyages, Travels, Naval Expeditions, and other geographical
    records, from an early period to the beginning of the eighteenth century.

    II. The Annual Subscription shall be One Guinea, payable in advance on the 1st
    January.

    III. Each member of the Society, having paid his Subscription, shall be entitled
    to a copy of every work produced by the Society, and to vote at the general meetings
    within the period subscribed for; and if he do not signify, before the close of
    the year, his with to resign, he shall be considered as a member for the succeeding
    year.

    IV. The management of the Society’s affairs shall be veiled in a Council confisting
    of twenty-one members, viz., a President, two `Vice-President`, a Secretary, and
    seventeen ordinary members, to be elected annually ; but vacancies occurring between
    the general meetings shall be filled up by the Council.

    V. A General Meeting of the Subscribers shall be held annually. The Secretary’s
    Report on the condition and proceedings of the Society shall be then read, and
    the Meeting shall proceed to elect the Council for the enfuing year.

    VI. At each Annual Election, fix of the old Council shall retire, of whom three
    shall be eligible for re-election.

    VII. The Council shall meet when necessary, for the dispatch of bufinefs, three
    forming a quorum, including the Secretary, and the Chairman having a cafling vote.

    VIII. Gentlemen preparing and editing works for the Society, shall receive twenty-five
    copies of such works respectively, and an additional twenty-five copies if the
    work is also translated.


    ### RULES FOR THE DELIVERY OF THE SOCIETY’S VOLUMES


    I. The Society’s productions will be delivered without any charge, within three
    miles of the General Post Office.

    II. They will be forwarded to any place beyond that limit, the Society paying
    the coil of booking, but not of carriage ; nor will it be anfwerable in this cafe
    for any loss or damage.

    III. They will be delivered by the Society’s agent, `MR. CHARLES J. CLARK`, `4,
    Lincoln’s Inn Fields, to persons having written authority of fubfcribers to receive
    them.

    IV. They will be sent to the Society’s correspondents or agents in the principal
    towns throughout the kingdom ; and care shall be taken that the charge for carriage
    be as moderate as possible.


    ### LIST OF MEMBERS OF THE Haklupt Society.

