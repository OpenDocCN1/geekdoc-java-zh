    # 1—理查德·霍金斯骑士的观察记录

    其 1593 年南海航行纪实。重印自 1622 年版，由 `Capt. C. R. DRINKWATER BETHUNE`、`R.N.`、`C.B.` 编。（第一版已绝版。见第
    57 号）。供 1848 年发行。


    # 2—哥伦布节选书信

    附带有关发现新世界的原始文献。由英国博物馆的 `R. H. MAJOR` 爵士翻译并编辑。（第一版已绝版。见第 43 号。（1847 年））。供 1849
    年发行。


    # 3—圭亚纳帝国的发现

    沃尔特·莱利爵士著。由 `SIR ROBERT H. SCHOMBURGK`、`Phil.D.` 等人编辑，并附有详尽的解释性注释和传记性回忆。（1848
    年）。（已绝版）。供 1850 年发行。


    # 4—弗朗西斯·德雷克爵士 1595 年航行

    托马斯·梅纳德著，连同德雷克攻击波多黎各的西班牙记录。由 `W. D. COOLEY` 爵士根据原始手稿编辑。（1849 年）。供 1850 年发行。


    # 5—早期航行叙述

    旨在发现通往开泰（Cathaia）和印度的西北航线，包含了伦敦东印度贸易商人尊贵行会的记录选段，以及英国博物馆图书馆手稿选段，现为首次出版；由 `THOMAS
    RUNDALL` 爵士编辑。（1849 年）。（已绝版）。供 1851 年发行。


    # 6—进入弗吉尼亚·不列颠尼亚的旅行史

    描述了该地的地理和物产，以及当地人民的习俗风情，由首批抵达那里的人收集并观察，并由殖民地首任秘书 `William Strachey` 绅士汇编；现由英国博物馆的
    `R. H. MAJOR` 爵士根据英国博物馆原始手稿首次编辑。（1849 年）。（已绝版）。供 1851 年发行。


    # 7—发现美洲及相邻岛屿的相关航行

    由 `Richard Hakluyt` 收集并出版。1582 年布里斯托尔圣咏诗人。由英国博物馆的 `JOHN WINTER JONES` 绅士编辑，附有注释和引言。（1850
    年）。（已绝版）。供 1852 年发行。


    # 8—日本文献集

    附有 `THOMAS RUNDALL` 爵士的注释。（1850 年）。供 1852 年发行。


    # 9—佛罗里达的发现与征服

    `Don Ferdinando de Soto` 著。由 `Richard Hakluyt` 从葡萄牙语翻译；并由英国博物馆的 `W. B. RYE` 爵士编辑，附有注释和引言。（1851
    年）。供 1853 年发行。


    # 10—俄罗斯笔记

    译自关于该国的早期报告，题为 `Rerum Muscoviticarum Commentarii`，作者为 `Baron Sigifmund von Herberltein`，他是德国宫廷派往大公
    `Vafiley Ivanovich` 的使节，于 1517 年和 1526 年。两卷。由英国博物馆的 `R. H. MAJOR` 爵士翻译并编辑，附有注释和引言。第一卷。（1851
    年）。供 1853 年发行。


    # 11—哈逊湾地理志

    `Captain W. Coats` 海长在 1727 年至 1751 年间多次访问该地的记录。附附录，包含 `Captain Middleton` 海长在
    1741-42 年乘坐 `H.M.S. “Furnace,”` 号寻找西北航道的航行日志摘录。由 `JOHN BARROW` 绅士、`F.R.S.`、`F.S.A.`
    编辑。（1852 年）。供 1854 年发行。


    # 12—俄罗斯笔记

    第二卷。（1852 年）。供 1854 年发行。


    # 13—三次东北前往开泰和中国的航行

    由荷兰人于 1594 年、1595 年和 1596 年进行，其中包括他们对斯匹策根岛的发现、在纽西伯利亚岛留宿数月以及乘坐两只小船安全返回。由 `Gerrit
    de Veer` 著。由 `C. T. BEKE` 绅士、`Ph.D.`、`F.S.A.` 编辑。（1853 年）。（第一版已绝版。见第 54 号）。供 1855
    年发行。


    # 14-15—伟大强大的中国历史及其状况

    由 `Padre Juan Gonzalez de Mendoza` 编。。现重印自 `R. Parke` 的早期译本。由 `SIR GEORGE T. STAUNTON`
    爵士编辑。附有 `R. H. MAJOR` 绅士的引言。两卷。（1853-54 年）。供 1855 年发行。


    # 16—弗朗西斯·德雷克爵士环绕的世界

    他前往诺姆布德·迪斯（Nombre de Dios）的后续航行。与远征军记者 `Francis Fletcher` 的未出版手稿校对。附有说明该次著名航行的附录，以及由
    `W. S. W. VAUX` 绅士、`M.A.` 写的引言。（1854 年）。供 1856 年发行。


    # 17—征服中国的鞑胜利者史

    译自 `Père Orléans` 的法文，1688 年。由 `EARL OF ELLEERE` 翻译并编辑。附有 `R. H. MAJOR` 绅士的引言。（1854
    年）。供 1856 年发行。


    # 18—斯匹策根与格陵兰早期文献集

    包括：`F. Martin` 关于斯匹策根著作的德语翻译（现非常稀有）；`Isaac de Peyrère` 的《格陵兰关系》的翻译；以及一篇名为《神的力量与天佑在
    1630 年八名不幸被留的英国人在九个月又十二天后获得奇迹般营救中体现》的稀有文章，由 `Edward Pelham` 忠实报道。由 `ADAM WHITE`
    绅士编辑，附有注释。（1855 年）。供 1857 年发行。


    # 19—亨利爵士前往巴打丹和马琉古群岛的航行

    来自 1606 年的稀有版本。由 `BOLTON CORNEY` 绅士编辑。（1855 年）。供 1857 年发行。


    # 20—16 世纪末的俄罗斯

    包含了 `Dr. Giles Fletcher` 著的《俄国共和国》以及 `Sir Horfey` 的旅行记，现为英国博物馆首次印刷的完整手稿。由 `E.
    A. Hond` 绅士编辑。（1856 年）。供 1858 年发行。


    # 21—吉罗拉莫·本佐尼 1542-56 年的美洲旅行

    由 `ADMIRAL W. H. SMYTH`、`F.R.S.`、`F.S.A.` 编校和编辑。（1857 年）。供 1858 年发行。


    # 22—15 世纪的印度

    是在葡萄牙好望角人到达之前的一个世纪前往印度的航行叙述集；源自拉丁语、波斯语和意大利语文献，现首次翻译成英文。由 `R. H. MAJOR` 绅士、`F.S.A.`
    编辑，附有注释。（1857 年）。供 1859 年发行。


    # 23—前往西印度群岛和墨西哥的航行叙述

    1599-1602 年间由 `Samuel Champlain` 著。附有地图和插图。自原始手稿翻译，附有 `ALICE WILMERE` 写的传记和注释。（1859
    年）。供 1859 年发行。


    # 24—亚马逊谷的探险

    16 和 17 世纪：包含了 `Gonzalo Pizarro` 的旅程；源自 `Garcilasso Inca de Vega` 的皇家纪事；`Francisco
    de Orellana` 的航行；以及 `Cristoval de Acuna` 在 1641 年写的极其稀有的叙述。由 `CLEMENTS R. MARKHAM`
    编辑并翻译。（1859 年）。供 1860 年发行。


    # 25—澳大利亚早期迹迹

    显示库克船长时期澳大利亚早期发现的文献集。由英国博物馆的 `R. H. MAJOR` 绅士、`F.S.A.` 编辑。（1859 年）。供 1860 年发行。


    # 26—Ruy Gonzalez de Clavijo 前往提木的使团

    1403-6 年。首次翻译，附有注释、序言以及 `Timour Beg` 的传记。由 `CLEMENTS R. MARKHAM` 绅士编辑。（1859 年）。供
    1861 年发行。


    # 27—航海家亨利·哈逊

    记录其经历的原始文献由 `GEORGE ASHER`、`LL.D.` 收集、部分翻译并注释。（1860 年）。供 1861 年发行。


    # 28—乌苏亚和阿基格雷尔寻找黄金国和奥马瓜的探险

    公元 1560-61 年。从修士 Pedro Simon 的《Sexta Noticia Historiale》翻译，由 `W. BULLA` 绅士编辑；附有
    `CLEMENTS R. MARKHAM` 绅士写的引言。（1861 年）。供 1862 年发行。


    # 29—Alonzo Enriquez de Guzman 的生平事迹

    自马德里国家图书馆的手稿翻译，并由 `CLEMENTS R. MARKHAM` 绅士编辑，附有注释和引言。（1862 年）。供 1862 年发行。


    # 80—Galvano 发现的世界

    直到公元 1555 年。重印自原始葡萄牙语文本，由 `VICE-ADMIRAL BETH`、`C.B.` 编辑。（1862 年）。供 1863 年发行。


    # 31—修士 Jordanus 所描述的奇迹

    源自 14 世纪的一份羊皮手稿，由 `COLONEL H. YULE`、`C.B.`、`F.R.G.S.` 翻译并编辑。作者为塞拉克的教主教。（1863 年）。供
    1863 年发行。


    # 32—Ludovico di Varthe 的旅行

    16 世纪的叙利亚、阿拉伯、印度等地。由 `J. WINTER TONES` 绅士、`F.S.A.` 翻译，并由 `REV. GEORGE PERCY BADGER`
    编辑，附有注释和引言。（1863 年）。供 1864 年发行。


    # 33—Cieza de Leon 在 1532-50 年的旅行

    从达里恩湾到拉普拉塔城，包含在其《纪事》第一部分（安特卫普 1554 年）。由 `CLEMENTS R. MARKHAM` 绅士翻译并编辑，附有注释和引言。（1864
    年）。供 1864 年发行。


    # 34—Pascual de Andagoya 的叙述

    包含秘鲁的记载。由 `CLEMENTS R. MARKHAM` 绅士翻译并编辑，附有注释和引言。（1864 年）。供 1864 年发行。


    # 35—非洲和马拉巴海岸

    16 世纪初。由 `Duarte Barbofa` 著。自早期手稿翻译，由 `HON. HENRY STANLEY` 翻译。（1866 年）。供 1865
    年发行。


    # 36—开泰与之路

    16 世纪之前的中国次要记载集。由 `COLONEL H. YULE`、`C.B.` 编辑并编辑。（1866 年）。供 1866 年发行。


    # 37—开泰与之路

    第二卷。（1866 年）。供 1866 年发行。


    # 38—马丁·弗罗爵士的三次航行

    附有国家档案信件选段。由 `REAR-ADMIRAL COLLINSON`、`C.B.` 编辑。（1867 年）。供 1867 年发行。


    # 39—菲律宾群岛

    马琉古群岛、泰国、日本和中国，16 世纪末。`Antonia de Morga` 著（注：应为 Antonio）。由 `LORD STANLEY of Alderley`
    从西班牙语翻译，附有注释。（1868 年）。供 1868 年发行。


    # 40—埃尔南·科尔特斯的第五封信

    致查理五世皇帝，包含他 1525-26 年远征洪都拉斯的记录。由 `Pascual de Gayangos` 翻译。（1868 年）。供 1868 年发行。


    # 41—印加人的官方纪事

    `Garcilasso de Vega` 著。由 `CLEMENTS R. MARKHAM` 绅士翻译并编辑，附有注释和引言。第一卷。（1869 年）。供
    1869 年发行。


    # 42—瓦斯科·达·加马的三次航行

    以及 Caspar Correa 的《印度传说》；附有原始文献。由 `LORD STANLEY of Alderley` 翻译并编辑。（1869 年）。供
    1869 年发行。


    # 43—哥伦布节选书信

    附带有关他四次前往新世界的原始文献。由 `R. H. MAJOR`、`F.S.A.` 等翻译并编辑。第二版。（1870 年）。供 1870 年发行。


    # 44—也门的伊玛姆与赛义德的历史

    `Salîl-Ibn-Razîk` 著，公元 661-1856 年。从原始阿拉伯语翻译，并由 `GEORGE PERCY BADGER`、`F.R.G. S.`
    编辑，附有注释、附录和引言，历史延续至 1870 年。（1871 年）。供 1870 年发行。


    # 45—印加人的官方纪事

    第二卷。（1871 年）。供 1871 年发行。


    # 46—加那利亚人

    或 1402 年征服和转化加那利亚人的书，`Messire Jean de Bethencourt` 骑士著。`Pierre Bontier and Jean
    le Verrier` 编写。由 `R. H. MAJOR` 绅士、`F.S.A.` 翻译并编辑，附有注释和引言。（1872 年）。供 1871 年发行。


    # 47—发现秘鲁的报告

    由 `CLEMENTS R. MARKHAM`、`C.B.` 翻译并编辑，附有注释和引言。（1872 年）。供 1872 年发行。


    # 48—印加人的仪式与法律叙述

    从原始西班牙手稿翻译，并由 `CLEMENTS R. MARKHAM`、`C.B.`、`F.R.S.` 编辑，附有注释和引言。（1873 年）。供 1872
    年发行。


    # 49—前往提木和波斯的旅行

    `Jafa Barbaro and Ambrogio Contarini` 著；由 `LORD STANLEY of Alderley` 编辑；以及其他意大利旅行叙述，由
    `CHARLES GREY` 翻译并编辑。（1873 年）。供 1873 年发行。


    # 50—十四世纪的海域

    由 `R. H. MAJOR`、`F.S.A.` 编辑。（1873 年）。供 1873 年发行。


    # 51—Hans Stade 在 1547-55 年的被俘

    在巴西部落中。由 `ALBERT` 翻译，由 `RICHARD F. BURTON` 注释。（1874 年）。供 1874 年发行。


    # 52—麦哲伦首次环球旅行

    从 `Pigafetta` 的记录翻译。附有 `LORD STANLEY of Alderley` 的注释和引言。（1874 年）。供 1874 年发行。


    # 53—印加人的官方纪事

    自 1774 年葡萄语版翻译，由 `WALTER DE BIRCH` 绅士、`F.R.S.` 编辑。第一卷。（1875 年）。供 1875 年发行。


    # 54—前往北方的三次航行

    `Gerrit de Veer` 三次航行的第二版。由海军中尉 `Lt. KOOLEMAN BEYEN` 编辑，附有引言。（1876 年）。供 1876 年发行。


    # 55—印加人的官方纪事

    第二卷。（1877 年）。供 1875 年发行。


    # 56—詹姆斯·兰卡斯特爵士的航行

    附有海军部保存的日志摘要。由 `CLEMENTS R. MARKHAM`、`C.B.`、`F.R.S.` 编辑。（1877 年）。供 1877 年发行。


    # 57—理查德·霍金斯骑士的观察记录

