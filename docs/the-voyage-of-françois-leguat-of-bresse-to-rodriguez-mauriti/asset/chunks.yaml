- fmt: "\nIn a word, My Reason was this: After having been forc’d to leave my Native\
    \ Country, with so many Thousands of my Brethren, to abandon my small Inheritance,\
    \ and to forsake for ever, according to all outward appearance, those Persons\
    \ that were dear to me, without finding in the New Country, to which I first Transported\
    \ my self, that sufficient Relief which my present Necessity demanded, I gave\
    \ my self up entirely to Providence, and determin’d humbly and patiently to make\
    \ use of the Means that offer’d for me, perhaps to preserve my Life.\n\nWeary\
    \ of the bustle of th”. World, and fatigu’d with the Troubles I had endur’d in\
    \ it, I quitted Variety and Tumult without any regret, and at an Age already advanc’d\
    \ beyond its Prime, I thought I wou’d endeavour to live in a Place where I might\
    \ be free from the common and frequent Dangers to which I was expos’d. I had nothing\
    \ to lose, and therefore risk’d nothing, tho’ I had a great deal to hope, at least\
    \ that I might find that delicious Repose which I never knew; but for the two\
    \ years that I remain’d in the Desart Island, where I had without doubt finish’d\
    \ my Course, if the wicked man who carry’d us thither had not betray’d us, and\
    \ ruin’d the Design that had been form’d in Holland.\n\nAfter all, I breath’d\
    \ an admirable Air there, without the least alteration of my Health. I liv’d like\
    \ a Prince at ease, and in abundance without Bread, and without Servants. I had\
    \ there been Rich without Diamonds, and without Gold as well as without Ambition.\
    \ I had tasted a secret and exquisite Pleasure, and content in being deliver’d\
    \ from an infinity of Temptations to Sin, to which Men are liable in other Places.\
    \ \n\nCollected in my self, I had seen there by serious Reflection, as plain as\
    \ if it was within reach of my Hand or Eye; what `Nothings` the Inhabitants of\
    \ this wretched “World admire; of this World, I say, where `Art` almost always\
    \ destroys Nature under pretence of adorning it; Where `Artifice` worse than Art,\
    \ Hypocrisy, Fraud, Superstition and Rapine exercise a Tyrannical Empire over\
    \ Mankind; where in short, every thing is Error, Vanity, Disorder, Corruption,\
    \ Malice and Misery.\n\nI cannot help adding here by way of Advance, that whatever\
    \ inconveniences might have attended a longer stay in this Island, I had never\
    \ left it, had I not been forc’d to do it: And nothing but the boisterous Humour,\
    \ the wild Precipitation, and the rash attempt of Seven, in that, Inconsiderate\
    \ young Men, cou’d have constrain’d me to have abandon’d that sweet Abode.\n\n\
    What do I say,—No, ’twas not Man but Providence that conducted me thither, and\
    \ that brought me thence. ’Twas Providence that conducted me safely thro’ so many\
    \ Dangers, and has happily transpoi’ted me from my Desart Isles, to this vast\
    \ Powerful and Glorious Island of `Great Britain`, where the charity of the Generous\
    \ Inhabitants has held out its Hand to me, and fix’d my Repose as much as it can\
    \ be fix’d in this lower World.\n\nAccording to `M. Eyries`, the actual editor\
    \ and author of `Leguat’s` narrative was an ex-Benedictine monk named `Gabillon`.\
    \ *See* note, p. lxxxviii, and introduction. `Journal du Voyage de Siam fait en`\
    \ 1685-86 (`M. l’Abbé Choisy`), by `M. L. D. C.` 4to. Paris, 1687. `Leguat` here\
    \ writes ironically, but his sarcasm is not undeserved; for instance, the “Robin\
    \ here referred to is a sheep—“un mouton fameux entre les moutons”—and more than\
    \ a page is occupied in telling how he was cooked, eaten, and discussed at table.\n\
    \nThis Prince of Roman eloquence was `Cicero`, who wrote as follows: “Cæsar has\
    \ likewise some commentaries or short memoirs of his own transactions, and such\
    \ as merit the highest approbation; for they are simple, correct, and elegant,\
    \ and divested of all the ornaments of language, so as to appear (if 1 may be\
    \ allowed the expression) in a kind of undress.”(`Cicero`, *in Bruto,* c. 74.)\
    \ “A Place in Paris where Second-hand and other Cloaths are sold.” In orig.: “lustres,”\
    \ *i.e.,* glass or polish.\n\n`Rabbi Benjamin`, the son of `Jonas of Tudela`.\
    \ Travels through Europe, Asia, from Spain to China, 1160-73. From the Latin of\
    \ `Montanus`; *vide* `Purchas’ *Pilgrimes,*` vol. ii. `Dom. Bernard de Montfaucon`,\
    \ a distinguished `savant` and Greek scholar, who after taking part in two campaigns\
    \ under `Turenne` became a monk of `Saint-Benoît` at Toulouse in 1675. He died,\
    \ aged 87 years, in 1741. According to Bernard this author was `Casimir Freschot`,\
    \ the anonymous author of `Remarques et Critiques,*` but the context further appears\
    \ to refer to `Mabillon` or `Montaucon`.\n\n`Jean Mabillon` was a learned writer\
    \ and Benedictine monk of the Congregation. Maur, born in 1632, a few years senior\
    \ to `Leguat`. `Mabillon` visited the principal Libraries of Italy in 1685 with\
    \ `Michel Germain`, and brought back 3,000 volumes and manuscripts for the King’s\
    \ Library. He published an account of his travels, and published `Musæum Italicum`\
    \ and many works of deep research. He died, aged 75 years, in 1707.\n\n“I have\
    \ borrowed much, and not contemptible, from Writers I lighted on, that have not\
    \ been public, the chiefest whereof is `Flaminius Vacca`, a `Roman` Carver. This\
    \ Man collected many Observations of his own and Friends found in `Roman` Monuments,\
    \ and before it, presented them to `Anastasius Simonetta` of `Perugino`, who was\
    \ compiling a very accurate Work of Antiquities. Flaminius’ Observations being\
    \ in no Order, but intermixed as they happened to occur I thought fit to translate\
    \ his Papers. Flaminius was a noble Roman Carver whose Skill is visible in many\
    \ Works to be seen in Roman Churches and Homes. He flourished in the sixteenth\
    \ Century and seems to have lived to the seventeenth. His Tomb is to be seen in\
    \ the Church of Santa Maria Rotunda.”\n\n“where I design’d to entertain my Reader\
    \ for some Time, with certain Passages of the Relation that `D. Bernard de Mont-faucon`\
    \ (a Benedictine Monk) has published of his Travels in Italy, under the Title\
    \ of `Diarium, etc.` But since he makes a Show of a Dissertation, with a Sort\
    \ of Ostentation to the Eyes of the `Turba Eruditor`, whom he pretends to inform,\
    \ after a decisive Manner, concerning the famous Manuscript which is kept so preciously\
    \ in the Treasury of St. Mark.” ... And as I have formerly applied myself with\
    \ Care to search after those things which have been the Occasion of his Publishing\
    \ a Volume by the Title of `Palxographia Grœca, etc.` Without retracting what\
    \ I have just now said of the Journal of Trévoux, the Reverend Fathers that compose\
    \ it, will give me Leave to make some Reflections here upon their Article of Tome\
    \ iv..... This Journal is now (1714) made at Paris by some learned Jésuites under\
    \ the Title of `Histoire des Sciences & des beaux Arts` (Maximilien Misson’s Preface\
    \ to fourth edition, New Voyage to Italy.)\n\nMabillon’s Querelle d’Allemande—his\
    \ dispute with Père Germain as to the rules of criticism as applied to the authenticity\
    \ of manuscript characters may perhaps here be alluded to. “Hence we proceeded\
    \ to see the Manuscript of the Gospel of St. Mark, which is kept in a Cupboard\
    \ hard by, and we viewed it to Content with `D. Leith` or `Galtcrius`, the Library\
    \ Keeper. . . The characters, tho’ scarce legible, are infallibly Latin. It is\
    \ generally said to be St. Mark’s writing. I do not remember to have ever seen\
    \ any Manuscript that seems to be of greater Antiquity than this. But that this\
    \ Book is writ in Latin is plainly made out by the story I shall now relate. .\
    \ . The letter of Emperor Charles the IVth will inform you that he received from\
    \ the Patriarchal Church of Aquileia two Quires of the Holy Gospel of St. Mark,\
    \ written with his own Hand, which are in this Cathedral.” . . (Montfaucon’s Journey\
    \ through Italy, pp. 73-75.) “As for their Quotations from the Greek and Latin\
    \ Poets, which several offer to introduce in great Numbers, into their Writings,\
    \ there are but very few of them to be found in these Letters.” (M. Misson, b.\
    \ c.) “As I am far from having a perfect Knowledge of the English Tongue. . .\
    \ .”\n"
