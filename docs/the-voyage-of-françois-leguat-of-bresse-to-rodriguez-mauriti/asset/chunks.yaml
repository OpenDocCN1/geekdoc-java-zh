    was Governor of the Isle of France in 1791, and (according to Grant) ‘ a man full
    of knowledge and philanthropy’, states in his `Voyage à Canton` (1799) :—’ On
    approaching the Isle of France, you must keep to windward, because the port, which
    is frequented by the larger vessels, is to leeward: when the wind is not violent,
    the air is embalmed with the perfumes of flowers, with which the trees of the
    island are covered. The same odours are perceived along the island of Ceylon,
    when the winds blow from the land. This effect was falsely attributed to the cinnamon
    tree, which forms a part of the forests of this island, as its flowers have a
    foetid smell. The effluvia from the land are carried by the winds very far to
    sea ; and sometimes produce very sudden and unexpected effects. I eaw one of this
    kind, which is not very uncommon. A German soldier, a passenger on board of our
    vessel, about seven or eight and twenty years old, died suddenly in sight of the
    little isle of Rodriguez, and about a hundred leagues distant from the Isle of
    France. He had some slight symptoms of the scurvy, but he was not on the sick-list,
    nor did he appear to have any unfavourable symptoms.’ (Baron Grant’s `History
    of Mauritius, p. 516.)”


