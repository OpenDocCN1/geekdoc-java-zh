- fmt: '

    LET who will say what they please against `Prefaces`, for my part I always read
    them with Profit. To deprive one’s self of so necessary a Thing, is to leave off
    a good fashion at the peril of Reason and Instruction; He that exposes a Work
    to the Multitude, brings himself into such great Danger, let his Design be ever
    so just, and the execution of it ever so perfect, that in Prudence he ought to
    neglect nothing to prepare the minds of his Readers, and prevent the ill-effects
    of Ignorance and Malice; But if the Author do’s this for his own Advantage, the
    Readers also in my Opinion benefit by it; for by this he smooths the way for them.
    He enlightens them, and makes several things easy, in which otherwise they would
    find a great deal of Difficulty. Be it as it will, I beg the favour of you, courteous
    and just Reader, to suffer me to Discourse with you a little before you turn to
    the Relation of my Adventures, which I am about to present to you.


    ### Departure from Amsterdam


    When the Companions of my Fortune and my self embark’d aboard our Ship the `Swallow`
    at `Amsterdam`, abundance of our Friends attended us to the Water-side, and when
    they took their leave of us, they cry’d as long as they could see us; “Pray let
    us hear from you, send us all the News you can, and fill your Letters with the
    particular Circumstances of your Adventures.” From that very Minute I form’d to
    myself the design of giving them Satisfaction. But you will find when you have
    read my History, that my Design could not be executed.


    After my return, I could neither refuse them the demand they made of seeing my
    Journal, nor excuse my self from answering a hundred Questions they ask’d concerning
    things which I had not inserted in it, but which were, however, still in my Memory.
    I have met no Body ever since who has not been very Inquisitive, and I have endeavour’d
    to satisfie the curiosity of my Friends to the utmost of my Power. Tho’ if I may
    be so free, I have met with Persons who have been so Importunate, that they became
    troublesome with their Inquiries.


    ### The Origin of the Memoirs


    To save my self answering an infinite number of Questions, and being continually
    teaz’d by the own importunity, it one day came into my mind that the best way
    to do it would be to write down a Relation of my Voyage and Adventures, and to
    shew it to those of my Friends and Acquaintance who desir’d to see it. Accordingly
    I wrote these `Memoirs`, they were presently seen in the World, and I fancy’d
    I saw in the looks of those that had read them, when they returned them, an air
    of Content, which I took for a very good Omen, and was pleas’d with it.


    I perceiv’d they interested themselves in every thing that had happen’d to Me,
    and some of them went so far as to say, ‘Print them, fear nothing, the Book will
    be very Entertaining: A Man shou’d be Modest, but not a Coward. There is something
    in them very extraordinary and singular, with which all the World will be pleas’d.
    Take your Friends to for it, and publish them.’ Thus did they perswade me. To
    which they added one thing that weigh’d very much with me, and help’d to overcome
    the repugnance I had to Print them; which was their naming to me a great number
    of false Voyages, and some of them ill-enough related, which, however, went off.


    Indeed, said I to my self, there’s such a one, and such a one (I can scarce forbear
    naming fifteen or twenty), such a one, and such a one, have had the Impudence
    to impose on the Publick, and their ridiculous Falsities have been very well receiv’d.
    Why therefore is it not lawful for an honest Man to tell things which are true,
    and of which some use may be made. Wretched Romances, and ill-contriv’d Fables,
    find a Vent; why may not my true Romance have as favourable a fate?


    ### Comparison of Styles


    I expect the Critical Reader shou’d say here, “there’s a manner of expressing
    things”: A Story well told, is read with Pleasure, tho’ ’tis even a little Romantick
    or Trivial in its self. People are now more earnest than ever for perfection of
    Language. As for Example, the little `Nothings` of the Abbot of Choisy in the
    `Voyage` to `Siam`, have an incomparable Grace in them, and please much more than
    many other things made of more precious Materials.


    ```

    “We cast Anchor.” “We made ready to Sail” “The Wind took Courage.” “Robin is dead.”
    “We said Mass.” “We Vomited.”

    ```


    Tho’ they are poor Words any where else, yet in his Book, which is half compos’d
    of them, they are Sentences, and the worth of them is not to be told. His Phrases
    are so fine, so pretty, that we should be more in love with them, than with Discoveries.
    And what then can you hope for, you a Country Gentleman who relate your Affairs
    `grosso modo`, and speak plainly without gloss or disguise, what you have seen,
    or what you have heard: You are in the wrong to imagine your History, tho’ true,
    singular, nay even moral, and as political as you please, can enter into Comparison
    with a Book that is well Written.


    I own all this, I am no Polite Author, nor indeed any at all. Neither did I ever
    believe I eou’d ever set up for one, till I was as it were forc’d to give way
    to Importunity, which lasted five or six years. ’Tis true and most true, that
    I am very far from having `Ghoisy’s` rare Talent. His Delicacy is without doubt.
    He writes politely, and the fine simplicity of his, approaches:


    ```

    “His Calm quite flat.” “I see nothing but Water.” “The same Song.” “To tell you
    nothing is a new Rag,”

    ```


    which pleases and Charms, tho’ I must indeed own, have not been able to relish
    it. Perhaps may be too high season’d for me. Simple and naked Truth, and the singularity
    of our Adventures, are the Body and Soul of my Relation. But since the Prince
    of `Roman` Eloquence has commended `esar` (or the Author of his Commentaries)
    for writing without Artifices or Ornament, I hope I shall also find Men of a moderate
    Taste, who without lessening the extraordinary value of, will readily bear with
    mine tho’ Common. There’s deceit in this Simplicity, so very simple; and ’tis
    very well known the Inhabitants of the `Republick` of letters, as well as those
    of `Friie`, make use of several sorts of Lights: I know also that a `Latin` Cloak
    is as Convenient as Venerable, and often proves a great help to such as have nothing
    to say, and yet would raise Admiration; and that the politeness of a gay Stile,
    and the Convenience of `Rimes` are a good cover for many Authors: `Juvenal` and
    `Boileau` are in the Eight to rail at whom they please, as long as they rail in
    Verse; and the most Scoundrel `Rimers` find also their Account in their Songs
    and Lampoons.


    If my Voyage was written in `Hebrew`, I am very well assur’d it’d at least succeed
    as well as that of `Rabbi Benjamin`. And if it was only in `Latin` with `Greek
    à la Montfaune`, with a word or two of `Ardbick` to relish it a little, I should
    without doubt have at least Admirers, if I wanted `Readers`. For who with impunity,
    and even with Success, would publish a hundred useless sorts of insipid Literature,
    a hundred Copies of things that have been said again and by others, a hundred
    Lyes and Invectives? if they had not been in `Latin`, or in `Verse`, they’d never
    have gone off as they did. There’s a certain Reverend Father of our Acquaintance
    whose Book is full of Faults, of things ill Chosen, of shocking Repetitions, of
    Trifles, of Pedantick Insolence, of Injurious and ill-grounded Contradictions;
    but then ’tis all in `Latin`. This Learned Doctor endeavours to give the World
    a Relation of his Voyage, in imitation of Father `Mabillon`, whose Scholar he
    is; and whose Novelty consisting wholly in Catalogues of `Bulls` and `Decretals`,
    and of other Species of base allays, which have been a hundred times examined,
    and a hundred times confuted with a Manuscript of poor `Vacca`, which till now
    was despis’d by every Body: What cou’d he do? He cou’d write tolerably in `Latin`,
    add Rhapsodies to his Trifles, and give them a `Latin` Pass-port, and a `Latin`
    Dress. But had he not done better if he had written in his own Tongue, Judiciously,
    Civilly, Wisely, and Briefly? Or rather if he had not written at all. What had
    the `Turba Eruditorum`, which he explains so ill, and yet with so much Pomp and
    Variety, to do with his Journal? There’s but very little in it that deserves to
    be published; and that that is, may lie found in Mess. `Trévoux` and elsewhere.
    Who is concern’d in his `German` Quarrel, and his Chimerical Triumph about `St.
    Mark’s` Gospel, being written in `Latin` with the Apostles own Hand. If this Fantastick
    Monk had told his Reasons modestly; if he had not with as much Rudeness as Injustice,
    offended those who never thought anything of him, good or ill, and who are in
    a condition to Chastize when they think fit, he had been more Excusable.


    ### Conclusion


    As for Me then, I write in `French`, and in plain `French`, not aspiring to any
    higher degree of beauty of Stile, than what is necessary to be understood, nor
    to any Supernatural Language. I must desire the Reader to remember, that it cannot
    be expected that a Desart Island should furnish me with such ample Matter, as
    Travellers commonly meet with in the inhabited Countries which they Visit. I found
    neither Cities nor Temples, nor Palaces, nor Cabinets of Rarities, nor Academies,
    nor Libraries, nor People, on Religion, Language, Customs, I might make Observations.
    I have said already, and I say it again, that all that can make this small Treatise,
    which I have been encouraged to present you with, any way valuable, is in the
    first place, the particularity and variety of the Facts and Adventures. To dwell
    two years in a Desart; to be sav’d by a Miracle; to fall from `Charybdis` upon
    `Scylla`, as the ancient Proverb says; to suffer a thousand miseries for three
    years together on a dry Rock, by unheard of persecution; to be deliver’d contrary
    to Appearance and Hope, must certainly have something Singular in it. What is
    Secondly valuable in this Relation, is the pure and simple truth of all I have
    related. It never enter’d into my Thoughts to adorn my History, to exaggerate
    any thing at the expence of that Truth, which I have always respected. And I will
    add for your Satisfaction, that there are Witnesses of every thing I have reported.
    Among the things which those that have Trav’d last in the Countries that are known
    and describ’d, report, ’tis unavoidable but there must be something which the
    first Travellers make no mention of; Be it as it will with respect to my self,
    when I talk of the Cape of `Good Hope`, `Batavia`, and other Places treated of
    in other Voyages, I speak of those things that I thought worth observing, without
    troubling myself whether others have made any mention of them before or not. I
    shall conclude with making some Reflection on three Difficulties that have been
    started to me. For, Dear Reader, I will dissemble nothing with you, nor neglect
    anything to satisfie you.

