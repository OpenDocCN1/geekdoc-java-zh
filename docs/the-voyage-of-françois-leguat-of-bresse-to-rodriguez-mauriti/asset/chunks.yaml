  trans: '


    # I. 人们说我题外话太多。


    对于这一点，我希望你考虑两件事。我承认在撰写这些`Memoirs`时，同一个念头经常浮现在我的脑海中，正如我们多次提到的`Choisy` 院院长身上产生过的一样。`我很遗憾`（他有时会这样说）事情没有按照我所希望的那样呈现——我只能给出我拥有的——`我真希望能有更有趣的事可以告诉你们。`
    事实是，我经常发现自己处于同样的境地；我的德萨特群岛提供的素材还不够多样，我承认，有时为了这些素材，我不得不绕一点远路。


    尽管如此，如果你能对我公正相待，我希望你会赞同我给出的第二个回答。在我看来，一份优秀游记的真实特征在于包含旅行者所见、所闻或发生在他身上的非凡事，并以这种方式呈现，使读者对这些了解就像他们亲身去过那里，并且是所有发生事件的目击者一样。如果事实如此，旅行者应当传达他所知的一切：他的对话、论述、冒险、反思，只要它们与旅程有足够的联系，以至于没有旅程就无法得知。相反，最精彩、最令人愉悦的想法出现在这类游记中会非常`不合时宜`，如果它不是像人们所说的那诞生于旅程，并且没有恰当地独立地属于旅程。根据这一想法，我可以长篇大论，并继续保持我旅行者的身份，对关于女性的话题进行长篇论述：所有从`Golden
    Sentences`中摘录的内容，所有关于人类权利的论，以及我提到过的其他几乎所有似乎偏离了主题的内容。


    # II. 有人建议我给那些`Memoirs`署上名字，而另一些人认为我不应该这样做。后者是基于一种谦虚或节制的原则，正如这件事本身所解释的那样；而前者则认为，每一个声称契约的人都有义务让自己为人知。


    我完全赞同他们的观点。我认为任何以见证者身份说话的人都应该正如我们用`French`说的那样，隐去姓名，并且不要遗漏任何可能说服读者其诚实以及所言之绝对真实的事实。至于我个人，我承认如果没有作者的姓名，我从未对任何旅程产生过意见；即使是一个名声平平的旅行者的游记，即使他在作品上签了名，如果他没有同样提供证人（尤其是当他来自遥远的国家时）。谁又不知道人的本性呢？一个忠实度平平、且没有证人来证明他所声称属实的旅行者，在隐藏姓名以修饰他的历史、使其更悦人时，面临着巨大的诱惑。我们有许多这一真理的证据，以至于没有人怀疑它的真实性。因此我再次结论，那些向世界讲述任何稀有事物以及他们在极遥远国家所见事物的人，有必不可的需要让公众清楚、明确地知道他们是谁，甚至不加掩饰地暗示所有获得信誉所需的特定细节。由此自然推导出的是，那些没有署名的游记作者几乎总是欺骗公众的流氓和骗子，并且通常以此为自己某种卑鄙的目的。这样的人绝对是两年前出现的一本劣质书籍的作者，该书名为`1704
    年从意大利到荷兰日记中的历史与批判评论`，`包含卡尔尼奥拉的习俗`。这位我们熟悉的、根据其惯常做法伪造寓言集的无耻匿名作者，除了一点卑鄙和可耻的利润外，没有别的目的；而是违背所有正义规则，侮辱一个他本应该尊敬且宽容了他太久的人；有时，某些恶棍应该被被打上标记，让世界知道他们的卑劣招数，而如果不告诉他们，很少有人能察觉这些招数。


    # III. 有人也曾对我说过，当我一次快要死于可怕的坏血病时，当我一次被一群老鼠骚扰时；当我暴露在暴风和飓风的狂怒中，或成为一个小暴君的玩物时：‘你为什么要投身这样的事业？难道你不知道比新世界的定居点更不确定、更困难的了吗？尽管某些人的特定利益将其描绘得多么绚丽？难道你不知道执行此类项目所伴随的艰辛劳动和巨大危险吗？’


