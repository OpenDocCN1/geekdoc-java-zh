    1 Where are the countless and mighty Otaries that Péron found in Bass’s Straits
    V Not there assuredly ! . . . Surely it is time to stop such wanton, such short-sighted
    destruction.’’ (Professor Newton on “ Extermination of Marine Mammalia”, *Nature*,
