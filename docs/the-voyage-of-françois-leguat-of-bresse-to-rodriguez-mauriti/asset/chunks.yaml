  trans: "\n\n# 1891 年哈克鲁特学会\n\n## 领导层\n- **主席**：`CLEMENTS R. MARKHAM`士，C.B., F.R.S.\n\
    - **副主席**：`MAJOR-GENERAL SIR HENRY RAWLINSON`将士，Bart., K.C.B., D.C.L., LL.D.,\
    \ F.R.\n- **理事会**：`LORD ABERDAARE`，G.C.B., F.R.S.S.；`E. B. BOUVERIE-PUSEY`士；`WALTER\
    \ DE GRAY BIRCH`士，F.S.A.；`REAR-ADMIRAL LINDESAY BRINE`;`ROBERT BROWN`士，M.A., PH.D.\n\
    - **骑士团**：`HON. SIR MOUNTSTUART E. GRANT-DUFF`，G.C.S.I.；`ALBERT GRAY`士；`F. H.\
    \ H. GUILLEMARD`士，M.A., M.D.R.；`H. MAJOR`士，F.S.A.；`E. A. PETHERICK`士；`LORD ARTHUR\
    \ RUSSELL`；`ERNEST SATOW`士，C.M.G.S.；`W. SILVER`士；`COUTTS TROTTER`士；`PROF. E. B.\
    \ TYLOR`，D.C.L.；`Capt. Sir J. SYDNEY WEBB`，K.C.M.G.；`Capt. W. J. L. WHARTON`，R.N.\n\
    - **荣誉秘书**：`E. DELMAR MORGAN`士\n- **银行**：`MESSRS. BARCLAY, BEVAN, TRITTON, RANSOM,\
    \ BOUVERIE, & Co.`，1, `PALL MALL EAST`。\n\n## 关于学会\n哈克鲁特学会的成立目的是出版稀有或未出版的航海与旅行记录，旨在通过这种方式让人们更轻松地获取某一知识领域的原始资料；这一领域的重要性无与伦比，且在趣味多样性方面优于大多数领域。\n\
    \n旅行者和航海家的叙述让我们熟悉地球、其居民及其产物；它们展示了人类交流的增长及其对文明的影响，并在传授知识的同时，通过讲述那些首批探索未知和遥远地区者的艰辛与冒险，唤醒了人们的关注。\n\
    \n此类协会的优势不仅在于其文学合作体系，还在于经济性。许多对同一研究方向感兴趣的个人，其积累、品味和鉴赏力因此通过自愿结合结合在一起，并避免了常规的出版费用，使得制作的书籍仅以略高于印刷和纸张成本的费用分发给成员。\n\
    \n学会将其全部资金用于为成员准备著作；由于每份副本的成本与总印数成反比，显而易见，学会的繁荣和随之而来的活力使得每个成员都是受益者。\n\n## 会员\n\
    希望成为哈克鲁特学会会员的绅士应向秘书 `MR. E. DELMAR MORGAN`（地址：15, `Roland Gardens, S.W.`）或学会负责书籍交付的代理\
    \ `MR. CHARLES J. CLARK`（地址：4, `Lincoln’s Inn Fields`）表达意愿；登记并在向 `Mr. CLARK` 支付\
    \ `£1: 1` 的会费后，即可收到当年的发行书籍。\n\n## 剩余库存处理\n现通知成员及公众，理事会已批准以下处理剩余库存的方案：\n\n- **面向新成员**：`过往出版物的完整套装`，缺省第\
    \ 1, 2, 3, 5, 6, 7 和 13 号，售价为 `£27`。\n- **仅面向成员**：`包括 1883 年在内的限量套书`，缺省第 1—13,\
    \ 19, 36 和 37 号。总共 53 册，售价为 `£15 15s`。\n- **面向普通公众**：`亦有限量数量的单本`，如下：——\n    -\
    \ 第 17, 22, 23, 26, 29, 31, 34, 40, 47, 50 号，售价为 `8s. 6d`。\n    - 第 14 和 15, 18,\
    \ 21, 24, 28, 30, 35, 46, 48, 51, 53, 55, 56, 58, 60 和 61, 62, 63, 64, 65, 69\
    \ 号，售价为 `10s`。\n    - 第 16, 20, 27, 32, 33, 38, 41 至 45, 49, 52, 57 号，售价为 `15s`。\n\
    \    - 第 54 和 59 号，售价为 `20s`。\n- **成员优惠**：折扣 `15%`。\n\n请成员记住，理事会做出优惠安排的能力很大程度上取决于会费的及时缴纳。会费需在\
    \ 1 月 1 日预付，并由 `MR. CHARLES J. CLARK`（4, `Lincoln’s Inn Fields, W.C.`）收取。邮政汇票应抬头写\
    \ `MR. CHARLES J. CLARK`，地址为 `West Central Office, High Holborn`。\n\n### 已发行的著作。\n\
    \n"
- fmt: '

    # 1—The Observations of Sir Richard Hawkins, Knt.

    In his Voyage into the South Sea in 1593. Reprinted from the edition of 1622,
    and edited by `Capt. C. R. DRINKWATER BETHUNE`, `R.N.`, `C.B.` (First Edition
    out of print. See No. 57) Issued for 1848.


    # 2—Select Letters of Columbus

    With Original Documents relating to the Discovery of the New World. Translated
    and Edited by `R. H. MAJOR`, Esq., of the British Museum. (First Edition out of
    print. See No. 43. (1847.)) Issued for 1849.


    # 3—The Discoverie of the Empire of Guiana

    By Sir Walter Raleigh, Knt. Edited, with copious Explanatory Notes, and a Biographical
    Memoir, by `SIR ROBERT H. SCHOMBURGK`, `Phil.D.`, etc.(1848.) (Out of print.)
    Issued for 1850.


    # 4—Sir Francis Drake his Voyage, 1595

    By Thomas Maynarde, together with the Spanish Account of Drake’s attack on Puerto
    Rico. Edited from the Original MSS. by `W. D. COOLEY`, Esq. (1849.) Issued for
    1850.


    # 5—Narratives of Early Voyages

    Undertaken for the Discovery of a Passage to Cathaia and India, by the North-weft,
    with Selections from the Records of the worshipful Fellowship of the Merchants
    of London, trading into the Eail Indies ; and from MSS. in the Library of the
    British Museum, now firth published; by `THOMAS RUNDALL`, Esq.(1849. ) (Out of
    print.) Issued for 1851.


    # 6—The Historie of Travaile into Virginia Britannia

    Expressing the Cosmographie and Commodities of the Country, together with the
    manners and customs of the people, gathered and observed as well by those who
    went first thither as collected by `William Strachey`, Gent., the first Secretary
    of the Colony; now first Edited from the original manuscript in the British Museum,
    by `R. H. MAJOR`, Esq., of the British Museum. (1849.) (Out of print.) Issued
    for 1851.


    # 7—Divers Voyages touching the Discovery of America

    And the Islands adjacent, collected and published by `Richard Hakluyt`. Prebendary
    of Bristol in the year 1582. Edited, with Notes and an introduction, by `JOHN
    WINTER JONES`, Esq., of the British Museum. (1850.) (Out of print. ) Issued for
    1852.


    # 8—A Collection of Documents on Japan

    With a Commentary by `THOMAS RUNDALL`, ESQ.(1850.) Issued for 1852.


    # 9—The Discovery and Conquest of Florida

    By `Don Ferdinando de Soto`. Translated out of Portugueie by `Richard Hakluyt`;
    and Edited, with notes and an introduction, by `W. B. RYE`, Esq., of the British
    Museum. (1851.) Issued for 1853.


    # 10—Notes upon Russia

    Being a Translation from the Earlieft Account of that Country, entitled `Rerum
    Muscoviticarum Commentarii`, by the `Baron Sigifmund von Herberltein`, Ambaffador
    from the Court of Germany to the Grand Prince `Vafiley Ivanovich`, in the years
    1517 and 1526. Two Volumes. Translated and Edited, with Notes and an Introduction,
    by `R. H. MAJOR`, Esq., of the British Museum. Vol. 1. (1851.) Issued for 1853.


    # 11—The Geography of Hudson’s Bay

    Being the Remarks of `Captain W. Coats`, in many Voyages to that locality, between
    the years 1727 and 1751. With an Appendix, containing Extracts from the Log of
    `Captain Middleton` on his Voyage for the Discovery of the North-west Passage,
    in `H.M.S. “Furnace,”`, in 1741-2. Edited by `JOHN BARROW`, Esq., `F.R.S.`, `F.S.A.`
    (1852.) Issued for 1854.


    # 12—Notes upon Russia

    Vol. 2. (1852.) Issued for 1854.


    # 13—Three Voyages by the North-east

    Towards Cathay and China, undertaken by the Dutch in the years 1594, 1595 and
    1596, with their Discovery of Spitzbergen, their residence often months in Novaya
    Zemlya, and their safe return in two open boats. By `Gerrit de Veer`. Edited by
    `C. T. BEKE`, Esq., `Ph.D.`, `F.S.A.` (1853.) (First Edition out of print. See
    No. 54. ) Issued for 1855.


    # 14-15—The History of the Great and Mighty Kingdom of China and the Situation
    Thereof

    Compiled by the `Padre Juan Gonzalez de Mendoza`. And now Reprinted from the Early
    Translation of `R. Parke`. Edited by `SIR GEORGE T. STAUNTON`, Bart. With an Introduction
    by `R. H. MAJOR`, Esq. 2 vols. (1853-54.) Issued for 1855.


    # 16—The World Encompassed by Sir Francis Drake

    Being his next Voyage to that Nombre de Dios. Collated, with an unpublished Mamiscript
    of `Francis Fletcher`, Chaplain to the Expedition. With Appendices illustrative
    of the fame Voyage, and Introduction by `W. S. W. VAUX` Esq., `M.A.`(1854.) Issued
    for 1856.


    # 17—The History of the Tartar Conquerors who subdued China

    From the French of `Père Orléans`, 1688. Translated and Edited by `EARL OF ELLEERE`.
    With an Introduction by `R. H. MAJOR`, Esq. (1854.) Issued for 1856.


    # 18—A Collection of Early Documents on Spitzbergen and Greenland

    Consisting of: a Translation from the German of `F. Martin’s` work on Spitzbergen,
    now very rare; a Translation from `Isaac de Peyrère’s` Relation de Greenland;
    and a rare piece entitled `God’s Power and Providence showed in the miraculous
    deliverance of eight Englishmen left by mischance in 1630, nine months and twelve
    days, faithfully reported by `Edward Pelham`. Edited, with Notes, by `ADAM WHITE`,
    Esq. (1855.) Issued for 1857.


    # 19—The Voyage of Sir Henry Middleton to Bantam and the Maluco Islands

    From the rare Edition of 1606. Edited by `BOLTON CORNEY`, Esq. (1855.) Issued
    for 1857.


    # 20—Russia at the Close of the Sixteenth Century

    Compris `The Russe Commonwealth` by `Dr. Giles Fletcher`, and `Sir Horfey’s` Travels,
    now first printed entire mamiscript in the British Museum. Edited by `E. A. Hond`,
    Esq. (1856.) Issued for 1858.


    # 21—The Travels of Girolamo Benzoni in America, in 1542-56

    That flated and Edited by `ADMIRAL W. H. SMYTH`, `F.R.S.`, `F.S.A.` (1857.) Issued
    for 1858.


    # 22—India in the Fifteenth Century

    Being a Collection of Narratives of Voyages to India in the century preceding
    the Portuguese of the Cape of Good Hope; from Latin, Persian, and Italian Sources,
    now first translated into English. Edited, with an Introduction by `R. H. MAJOR`,
    Esq., `F.S.A.` (1857.) Issued for 1859.


    # 23—Narrative of a Voyage to the West Indies and Mexico

    In the years 1599-1602, with Maps and Illustrations. By `Samuel Champlain`. Translated
    from the original and unpublished Manuscript, with a Biographical Notice and Notes
    by `ALICE WILMERE`. (1859.) Issued for 1859.


    # 24—Expeditions into the Valley of the Amazons

    During the Sixteenth and Seventeenth Centuries: containing the Journey of `Gonzalo
    Pizarro`, from the Royal Commentaries of `Garcilasso Inca de Vega`; the Voyage
    of `Francisco de Orellana`, from the General History of `Herrera`; and the Voyage
    of `Cristoval de Acuna`, from an exceedingly scarce narrative written by himself
    in 1641. Edited and Translated by `CLEMENTS R. MARKHAM`, Esq. (1859.) Issued for
    1860.


    # 25—Early Indications of Australia

    A Collection of Documents shewing the Early Discoveries of Australia to the time
    of `Captain Cook`. Edited by `R. H. MAJOR`, ESQ., of the British Museum, `F.S.A.`
    (1859) Issued for 1860.


    # 26—Tho Embassy of Ruy Gonzalez de Clavijo to the Court of Timour, 1403-6

    Translated, for the first time, with Notes, a Preface, and an Introductory Life
    of `Timour Beg`. By `CLEMENTS R. MARKHAM`, Esq.(1859.) Issued for 1861.


    # 27—Henry Hudson the Navigator

    The Original Documents in which his career is recorded. Collected, partly Translated,
    and Annotated, with an Introduction by `GEORGE ASHER`, `LL.D.` (1860.) Issued
    for 1861.


    # 28—The Expedition of Ursua and Aguirre

    In search of El Dorado and Omagua, A.D. 1560-61. Translated from the `Sexta Noticia
    Historiale` of Fray Pedro Simon, by `W. BULLAERT`, Esq. ; with an Introduction
    by `CLEMENTS R. MARKHAM`, Esq.(1861.) Issued for 1862.


    # 29—The Life and Acts of Son Alonzo Enriquez de Guzman

    Translated from a Manuscript in the National Library at Madrid, and edited, with
    Notes and an Introduction, by `CLEMENTS R. MARKHAM`, Esq.(1862.) Iffuted for 1862.


    # 80—Discoveries of the World by Galvano

    From their first original unto the year of our Lord 1555. Reprinted, with the
    original Portuguese text, and edited by `VICE-ADMIRAL BETH UNE`, `C.B.` (1862.)
    Issued for 1863.


    # 31—Marvels described by Friar Jordanus

    Of the Order of Preachers, native of Severac, and Bishop of Columbum; from a parchment
    manuscript of the Fourteenth Century, in Latin, the text of which has recently
    been Translated and Edited by `COLONEL H. YULE`, `C.B.`, `F.R.G.S.`, late of `H.M.
    Bengal Engineers`. (1863) Issued for 1863.


    # 32—The Travels of Ludovico di Varthema

    In Syria, Arabia, Perfia, India, etc., during the Sixteenth Century. Translated
    by `J. WINTER TONES`, Esq., `F.S.A.`, and edited, with Notes and an Introduction,
    by the `REV. GEORGE PERCY BADGER`. (1863.) Issued for 1864.


