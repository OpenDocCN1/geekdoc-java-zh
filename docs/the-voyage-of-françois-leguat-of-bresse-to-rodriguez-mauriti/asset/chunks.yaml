    In orig.: “Et voilà un chétif Pont-volant qu’ils ont fait.”^([3](#C01_chapter_split_000_split_001.xhtml_Rfn8_264))
    In orig.: “Confidant.”^([1](#C01_chapter_split_000_split_001.xhtml_Rfn8_265))
    Plus honorée.^([2](#C01_chapter_split_000_split_001.xhtml_Rfn8_266)) In orig.:
    “que l’Europe voyoit ébranlée.”^([3](#C01_chapter_split_000_split_001.xhtml_Rfn8_267))
    In orig.: “triste regret.”^([4](#C01_chapter_split_000_split_001.xhtml_Rfn8_268))
    In orig.: “Rétablissement éternel.”^([1](#C01_chapter_split_000_split_001.xhtml_Rfn8_269))
    In orig.: “engeance de tout Animal.”^([2](#C01_chapter_split_000_split_001.xhtml_Rfn8_270))
    In orig.: “Religieux Scélérat.”^([3](#C01_chapter_split_000_split_001.xhtml_Rfn8_271))
    Max. Misson, writing from Rome, April 24, 1688, says: “I can’t for my life see
    why the Church of Rome should make such a bluster to hide this Disgrace, when
    *Baroni us* bestows the Title of *Monsters* upon several other Popes, and not
    without reason, considering the Enormities the Popes have been guilty of, distributing
    scepters and treading crown’d Heads under their Feet, notwithstanding they retain’d
    the qualities of Priests; and what is worse than all the rest, to set a certain
    rate of Absolution upon the most abominable Crimes that can be committed; witness
    the Book intituled *The Rates of the Apostolical Chamber* (sold publickly to this
    day at Paris), which I bought some days ago. ’Tis true they have since endeavour’d
    to suppress the Book, by inserting it in the *Index Expurgatorias* of the *Council
    of Trent,* but continue nevertheless in selling their Dispensations.‘Venalia nobisTempla,
    Sacerdotes, Altaría, Sacra, Coronse,Ignis thura preces, Cœlum est vénale Deus.’
    ”*(B. Mant.)*^([1](#C01_chapter_split_000_split_001.xhtml_Rfn8_273)) Allusion
    to the dispute on the word *filioque* in the Creed between the Oriental Greek
    and Roman Churches. Writing from Venice, January 20, 1688, Max. Misson mentions
    with regard to this : “ They (the Greeks) use Confession, but not after the manner
    of the Romanists : concerning the Article of the *Proceeding of the Holy Ghost*,
    they say as little now as they did formerly dispute upon it, looking upon it as
    a point that has more of nicety than usefulness ; they also preserve Relicks,
    but never worship them.”(*Letter xvi.*)^([2](#C01_chapter_split_000_split_001.xhtml_Rfn8_274))
    In orig : “ Que jamais extravagant Dévot.”Max. Misson, writing from Loretto, February
    26, 1688, says : “ But the greatest Curiosity is, the Processions of the Devotees,
    who crawl round the *Holy House* upon their Knees, some five times, others seven,
    and others twelve times, according to the different degrees of their Devotions
    ; some of these creep along from one side whilst others meet them coming from
    the other, but all furnished with Beads and muttering *Pater Nosters.”*^([1](#C01_chapter_split_000_split_001.xhtml_Rfn8_275))
    In orig. : “ qui s’érige en Embellisseur de Créance.”^([2](#C01_chapter_split_001.xhtml_Rfn8_276))
    In orig. : “Aucun Esclave d’Othons rouillez.” This allusion is not too easily
    to be comprehended. Rusty Othons can hardly refer to the German Othos, Emperors,
    of the tenth century : can it not more probably have reference to the manuscripts
    and books relating to their deeds, as, for instance, Hroswitha, *de Gestis Oddonis?*
    The formidable Otho the Great died on Christmas Day, 967. The valuable chrouicle,
    recovered by the industry of JPertz, records the death of Otho II ; and Otho III,
    the religious Otho, was poisoned by the remorseless Stephania in 1002\. (See Milman’s
    *History of Latin Christianity*, vol. ii, pp. 389-418.)^([3](#C01_chapter_split_001.xhtml_Rfn8_277))
    In orig. : “ Aucun chercheur de Pierre Philosophale.” Archbishop Gerbert, subsequently
    known as Pope Silvester II, who succeeded to the Pontificate in 999, was celebrated
    for his Arabian skill in arithmetic, geometry, and astrology, which he had studied
    under Caliph Hakim II, in Cordova. In remote Britain, according to William of
    Malmesbury, the magical arts and enchantments of Gerbert were commonly believed,
    and his funeral oration, in the *Vit. Pontif. Ravennat*, is “ Homagium diabolo
    fecit et male finivit.” Compare “ Hist. Lit. de la France “ and Vincent of Beauvais
    in the *Encyclopedia of the Middle Ages*.Gerbert, in Spain, fell in love with
    the daughter of one of those accursed doctors ; he stole his books. The Magician,
    by the aid of the stars, pursued the robber. But Gerbert, too, had learned to
    read the stars. By their counsel he lay hid under a bridge, when the devil descended
    and bore him away, designing him for the Pontifical chair. (See Milman’s *Latin
    Christianity*, vol. ii, p. 419.)^([1](#C01_chapter_split_001.xhtml_Rfn8_278))
    “ Secte des Anciennistes.”^([2](#C01_chapter_split_001.xhtml_Rfn8_279)) “ Chez
    toi.”^([3](#C01_chapter_split_001.xhtml_Rfn8_280)) In orig. : “ Après les avoir
    martyrisez.”^([4](#C01_chapter_split_001.xhtml_Rfn8_281)) In orig. : “ Faiseur
    de Visites inutiles.”^([5](#C01_chapter_split_001.xhtml_Rfn8_282)) “ The Pope
    [*Innocent XI*], tho’ really old and infirm, yet often makes the want of Health
    serve for a pretext to excuse his absence at those numerous ceremonies used at
    Rome. I had it from very credible persons that he did in no wise approve of the
    *French* way of converting People by *Dragooning*,and shew’d a great deal of aversion
    to those who pretended to propose certain methods of accommodation to him with
    the Crown of *France?* (Max. Misson, *Letter xxc.)*^([6](#C01_chapter_split_001.xhtml_Rfn8_283))
    In orig. : “ni Cachets.”^([7](#C01_chapter_split_001.xhtml_Rfn8_284)) In orig.
    : “ Ni Poudre à poudrer, ni Poudre à Canon.”^([1](#C01_chapter_split_001.xhtml_Rfn8_285))
    The greatest of Justinian’s generals. He was born in Illyria, and his Slavonic
    name siguifies “ White Prince”, or Bieli Tsar, the title usually bestowed upon
    the Emperor of liussia by Asiatics. The actual edition, probably, here quoted
    by Max. Misson was the following :—*“ Vide. Historia Gothorom Vandalorvin & Langobardorvm:
    ab Hugone Grotio*. Amstelodami, apud Ludovicum Elzevirium (1655).*“ Art*.Vandálica
    et Gothica, Procopii emendata plurimis locis: accedentibus supplements é Manusciiptis
    : & sic versa Latine ab Hugone Grotio.“Procopii CœsareensisHistoriée Vandalicse
    Liber Secundus, p. 88.“ ‘ Etiam in Numidia castellum posuere quo loco nunc urbs
    est dicta Tingis. Hie duíe stant é lapide candido columnge propter magnum fontem,
    inscriptse Phcenioias literas, quarum ex sermone Phœtiicio haec est interpretatio.
    Nos illi sum us qui prsedonem effugiuius lesum Navse filium.’ ”^([2](#C01_chapter_split_001.xhtml_Rfn8_286))
    Procopius, *De Bello Vandálico*, lib. II, cap. vii. The historian of Justinian’s
    wars, speaking of the origin of the Moors in Africa, whom he identifies with the
    Gergesitcs and Jebusites and other nations overthrown by the Israelites when they
    entered Canaan, says these nations, seeing this new captain (Joshua) irresistible,
    removed from their own country into Egypt, and finding no room there, went on
    into Africa, where they built many cities and possessed it all unto the Pillars
    of Hercules, and to this day contiuue there, using the Phoenician language. “
    In Numidia they built a castle where now is the citie of Tigisis. In which stand
    two pillars near the great conduit, with these words engraven in the Phoenician
    language : *We are they who fled before Joshua the chief, the son of Nun.”*(Holcroft’s
    translation of Procopius’ history, 1653 ; *The Vandal Wars*,p. 36.)^([1](#C01_chapter_split_001.xhtml_Rfn8_287))
    The names appear as follows :—Franciscus Leguat ; Paulus Be***le ; Jacobus de
    la Case ; Joannes Testard ; Isaacus Boyer : Joannes de la Haye ; Robertus Anselin
    ; Petrus Thomas ; Isaacus Boyer Mundo Valedicens Ad Celestem Patriam abut Maj.
    D. 8 A. 1693.^([2](#C01_chapter_split_001.xhtml_Rfn8_288)) “The following inscription”
    (writes Max. Misson, dating from Strasburg, July 22, 1688) “ was lately placed
    over the Gate of the *Manufactory Hall*,at Bern, the capital city of the most
    potent Canton among the Swiss :—“ ‘ Tempore quo crassa Clericorum ignorantia,
    cum gratia & privilegio Regis in verum Dei cultum f ureret, atque DEACONUM opera
    nos quos Huguenotos vocant, ferro flamma, & omnis generis cruce e regno pelleret,
    supremus Maģistrātus cruderibus Cinobii, olim Praedicatorium has sedes exstruxit,
    ut pietatem simul & artem GALLIC exiliantes hospitalibus tectis exciperat ; Fanit
    Deus T. O. M. ut charitatis hoc Opificium situri cremento patriae.’“ This Inscription
    being, as I am informed, remov’d from thence in 1692” [this is a subsequent addition
    by Max. Misson in his translation of the original letters] “ at the request of
    the *French* Ambassadour, I can’t omit to give you a translation of it :“ ‘ When
    the blind Ignorance of the Clergy, supported by the King’s Favour and Authority,
    did exert its Rage against the true Worship of God, and by the force of DKAGOOXS
    with fire and sword and all manner of Torments, drove those call’d *Huguenots*
    out of the Kingdom, this House was erected by the supream Magistrates, upon the
    ruins of the old Monastery belonging formerly to the Predicant Friers, that Piety
    and Industry, bauish’d at once out of *France*, might meet there with an hospitable
    entertainment : May it please the most Great and Good God, that this Charitable
    Act may tend to the advantage of our Native Country.’“ (*A New Voyage to Italy*,
    by Maxmilian Misson, Done into English, Letter XXXV.)^([1](#C01_chapter_split_001.xhtml_Rfn8_289))
    Ignatius de Loyola, the famous Spaniard who founded the order of the Jesuits,
    and inspired the King of Spain, Philippe II, to become the champion of Catholicism,
    under whom the dragoons of the cruel Duke of Alva inundated with blood the Flemish
    and Dutch provinces, 1568-1572.^([2](#C01_chapter_split_001.xhtml_Rfn8_290)) *ÆEneldos*,
    lib. viii, 333-336 :“ Me pulsum[^*](#C01_chapter_split_001.xhtml_fn8_293) patriâ,
    pélagique extrema sequentemFortuna omnipotens et ineluctabile fatumHis posuere
    locis, matrisque egere tremendaCarmentis Nymphse mónita, et deus auctor Apollo.”(King
    Evander is speaking, and alludes to an accidental murder which compelled him to
    leave Arcadia) :“Myself, an exile from my home,Went wandering far along the foam,Till
    mighty chance and destined doomConstrained my errant choice :So came I to these
    regions drivenBy warning from my mother given,And Phoebus’ awful voice.”Professor
    Conington’s *Translation*.Only the first portion of the Virgilian lines given
    above is inscribed on the simulated column as far as “ locis” ; afterwards is
    inserted : “AD. Dom. M. DC. XCI. XXX Aprilis. Biennio cum 21 diebus ibidem peractis,
    Fragilem truci Pelago commissimus ratem. Die xx Maj. An. Dom. M. DC. XCIII.”[In
    the original French, Leguat’s book is divided into two separate volumes, the “
    premier tome” occupying 164 pages of print, whilst the first part of the English
    version fills only 120 pages of larger size. Thu frontispiece of the first volume
    is repeated in the second, which fills 180 pages of type in the French, and 123
    in the English edition. The Dutch version is in one small quarto volume, with
    178 pages of text and 14 pages of index. This version has the dates given, in
    years, at the top of each page and marginal references, being also divided into
    chapters, the headings of which are given above at page lxiii.]LONDON ; WHITING
    AND CO., 30 AKD 32, SA.BDINIA. STREET, W.C.^([*](#C01_chapter_split_001.xhtml_Rfn8_293))
    *Me pulsum Patria* is changed into *Nos patria pidsos* in the inscription ; *vide*
