    # A NEW VOYAGE TO THE EAST-INDIES BY FRANCIS LEGUAT AND His Companions.


    ADVENTURES In Two Desart Islands, And an Account of the most Remarkable Things
    in `Maurice` Island, `Batavia,` at the `Cape` of `Good Hope,` the Island of `St.
    Helena,` and other Places in their Way to and from the Desart Isles. Adorn’d with
    MAPS and FIGURES LONDON Printed for `R. Bonwicke, W. Freeman, Tim. Goodwin, F.
    Walthoe, M. Wotton, S. Manship, F. Nicholson, B. Tooke, R. Parker, and R. Smith`.
    MDCCVIII.


    ### TO THE MOST HONOURABLE HENRY, MARQUESS OF KENT.


    Earl of `Harrold,` and Viscount `Goderich,` Lord Chamberlain of Her Majesty’s
    Household, Lord Lieutenant of the County of `Hereford,` and one of the Lords of
    Her Majesty’s most Honourable Privy Council. MY LORD, THE only Excuse the Translator
    of this Voyage has to make Your Lordship, for presuming to put your Name before
    it, is that he found it in the Original, and hop’d your Lordship, loho has distinguish’d
    yourself by your Humanity and Love of the Belles lettres, will be as well pleas’d
    to see it in an English, as in a French Dress. The Original, ’tis true, has the
    advantage of being known to more Nations, and the spreading your Lordship’s Fame,
    was a Justice the Language of our Enemies ow’d to the many high Qualities that
    have have plac’d you in one of the first Posts of the British Empire, and one
    of the nearest to Her Majesties Sacred Person and Favour. I cou’d not have for
    giv’n my self, if any Foreigner shou’d have shewn more Respect for your Lordship
    than an Englishman, or if a Traveller in rude and desolate Islands should he more
    ambitious of your Protection, than one who has had the honour at other times to
    frequent the delicious Plains of Parnassus, a Region that is immediately under
    your Lordship’s Government, and that has visibly flourished, since you have condescended
    to make it a part of your Care, which is otherwise more nobly employ d for the
    Service of the best of Princes, and the best of Countries. Let it be said, my
    Lord; Notwithstanding our unhappy Divisions, against which all your Lordship’s
    moderate Couneels have vigorously declared, and endeavour’d to unite us all in
    our Duty to Her Majesty, and Peace among our selves; but Division is so natural
    to Mankind, that who can hope to see an end of it in his Time? We find the solitary
    Inhabitants of Rodrigo had their Debates and Disputes; and 7 Men united by common
    Interest, and common Danger, were divided by their Passions. May Your Lordship’s
    eminent Worth always meet with the Prosperity it deserves, may it never be wrong’d
    by Jealousy, nor reach’d by Envy, too Common in this degenerate Age, to the prejudice
    of the most Heroick Virtue. This my Lord will always be the hearty Prayer of Your
    Lordship’s most Humble, most obedient, and most Devoted Servant.


    Henry Grey, or de Grey, Duke of Kent, succeeded to the title in 1702, and in the
    third year of Queen Anne was made Lord-Chamberlain of her Household, Lord-Lieutenant
    of the county of Hereford, and a Privy-Councillor. In December 1706 he was created
    Marquis of Kent, Earl of Harold, and Viscount Goodrich, and in the year 1710,
    on resigning his office of Lord-Chamberlain, he was advanced to the dignity of
    Duke of Kent. (`The Peerage of England,` 1710, p. 155.)


    Nichols, in his `Literary Anecdotes` (iv, 577), mentions that the Rev. John Laurence
    dedicated a treatise on the “Usefulness of the Barometer” to him; and the same
    author mentions him in connection with Roger Cotes, professor of astronomy and
    experimental philosophy at Cambridge, who was tutor to his sons, Anthony, Earl
    of Harold, and Lord Henry de Grey. (`Ibid.,` ii, 127.) Note by E. Delmar Morgan.
    This is, apparently, in allusion to the part taken by the Marquess of Kent in
    the recent Union of the Parliaments of England and Scotland, and to the Tory opposition
    encountered by the “Whig Cabinet of Queen Anne to which he belonged. The Scottish
    Estates sat for the last time in March 1707, and the Union was effected five months
    before this dedication was printed.


    Maximilian Misson in his preface to the `New Voyage to Italy,` translated into
    English by himself, also alludes to the rival factions of Whigs and Tories, a
    few years later:—“If the Peace has given any Calm to our Isles after the bloody
    Conflicts they have had with our GREAT neighbour, it has left ns involved in such
    Dissentions and intestine Animosities that they deprive us of an entire Happiness;
    and these lamentable Misunderstandings seem so to inflame the Minds, that the
    most moderate Persons can hardly hinder themselves from Listing under one of the
    Banners of this sad Discord. One is even look’d upon by the Generality of the
    People as not being in the Fashion when he does not take upon himself, and with
    Warmth too, one of these factious Names my Pen declines to set down, of W. or
    of T.” It may be noticed that Misson here speaks of himself as a British subject,
    alluding to “our”. In a note he explains the origin of the terms Whig and Tory.
    The signature of the anonymous translator is omitted. In the French edition the
    dedicatory epistle bears the signature of François Leguat, with the date—“Le 7\.
    Octobre, A Londres, 1707.” Of course, it differs considerably from the above wording
    of the English translator, who distinctly avows himself to be an Englishman. In
    the French edition the author requests that His Highness will be pleased to grant
    his generous and powerful protection in the most flourishing Island of the world,
    where good Providence has happily led him, and where, he adds, he shall never
    cease to offer his wishes for His Highness’ abundant and eternal prosperity, etc.
    It has not been considered necessary to give this letter in extenso. The arms,
    crest, supporters, motto, and heraldic insignia of the Marquess are figured in
    the French but not in the English version.


    ### THE AUTHOR’S PREFACE.

