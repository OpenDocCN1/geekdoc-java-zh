    This habit of the female *Lamentin,* described by Leguat, confirms the opinion,
    before mentioned, that it is the *Halicore Dugong.* When the female Dugong is
    nursing her young one, she carries it on one flipper and takes care to keep the
    head of her offspring, as well as her own, well above the surface of the water,,
    thus presenting a strangely human aspect. These creatures are most affectionate,
    and if one of a pair be captured, the other falls an easy prey, as it refuses
    to leave the dead body of its companion. Some of these animals attain to a length
    of over seven feet in Ceylon. (See Sir Emerson Tennent’s *Ceylon,* 2nd edit.,
    ii, pp. 557 *et seq*.)^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_117))
