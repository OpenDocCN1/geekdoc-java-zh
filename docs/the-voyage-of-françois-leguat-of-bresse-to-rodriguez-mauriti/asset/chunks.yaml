    Corinthians, xi, 7: “For a man indeed ought not to cover his head, forasmuch as
    he is the image and glory of God; but the woman is the glory of the man.”^([4](#C01_chapter_split_000_split_001.xhtml_Rfn8_250))
    Max. Misson, writing from Rome, April 11, 1688, says, with regard to the liberty
    allowed to women in England, and the confinement of the *Italian* ladies: “That
    this Custom was introduc’d into *Italy* as a necessary Caution where three parts
    of the Men living under the constraint of Celibacy, would without this Precaution
    create most dreadful Disorders; but Answer being made, That *St. Pauls* Advice
    might be a much better and more convenient Remedy against this Danger, we chang’d
    the Discourse.”^([5](#C01_chapter_split_000_split_001.xhtml_Rfn8_251)) Genesis,
    i, 28.^([6](#C01_chapter_split_000_split_001.xhtml_Rfn8_252)) Genesis, ii, 18.^([7](#C01_chapter_split_000_split_001.xhtml_Rfn8_253))
    Genesis, ii, 24.^([1](#C01_chapter_split_000_split_001.xhtml_Rfn8_254)) Vide *La
    Manière de célébrer le Mariage,* in the old French Huguenot prayer-book. “Et ce
    saint Mariage institué de Dieu est de telle vertu, que par icelui le mari n’a
    point la puissance de son corps, mais la femme; aussi la femme n’a point la puissance
    de son corps mais le mari. C’est pourquoi étans conjoints de Dieu, ils ne peuvent
    être séparez,” etc.^([1](#C01_chapter_split_000_split_001.xhtml_Rfn8_255)) *Vide
    supra,* p.In orig. it is, however, “ces vilains *Rats*.”^([2](#C01_chapter_split_000_split_001.xhtml_Rfn8_256))
    At spring-tide.^([1](#C01_chapter_split_000_split_001.xhtml_Rfn8_257)) Diodati,
    Governor of Mauritius (*Vide infra*.)^([2](#C01_chapter_split_000_split_001.xhtml_Rfn8_258))
    Bresse was an old division of France, now comprised in the department Ain. It
    was obtained by exchange from Savoy in 1601.^([3](#C01_chapter_split_000_split_001.xhtml_Rfn8_259))
    *Sebusians,* in orig., Sebusiens, probably a misprint for Segusiens, *i.e., Segusiani,*
    a people of Gallia Lugdunensis, on the banks of the Rhône and Saone.^([4](#C01_chapter_split_000_split_001.xhtml_Rfn8_260))
    In orig.: “le Rhône & la Saone.”^([5](#C01_chapter_split_000_split_001.xhtml_Rfn8_261))
    Max. Misson ascended to the summit of Mount Vesuvius in March 1688, and descended
