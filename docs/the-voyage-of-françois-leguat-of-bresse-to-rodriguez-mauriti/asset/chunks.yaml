    # 出版清单


    ## 1—理查德·霍金斯骑士爵的观察

    关于他 1593 年南海航行的记录。重印自 1622 年版，由海军上尉 C. R. DRINKWATER BETHUNE 博士（R.N., C.B.）编辑（*第一版已绝版。见第
    57 项*）。*于 1848 年发行*。


    ## 2—哥伦布选选书信

    附带有关发现新世界的原始文献。由英国博物馆的 R. H. MAJOR 先生翻译并编辑（*第一版已绝版。见第 43 项（1847 年）*）。*于 1849 年发行*。


    ## 3—圭亚纳帝国的发现

    由沃尔特·雷利骑士爵著。由罗伯特·H. SCHOMBURGK 博士（Phil.D.）等附上详尽解释性注释和传记编辑（1848 年）。（*已绝版*）。*于 1850
    年发行*。


    ## 4—弗朗西斯·德雷克爵的航行，1595 年

    由 Thomas Maynarde 著，附有德雷克攻击波多黎那岛的西班牙记载。由 W. D. COOLEY 先生根据原始手稿编辑（1849 年）。*于 1850
    年发行*。


    ## 5—早期航行叙述

    为了发现通往中国（Cathaia）和印度的西北航道而进行的航行，选自伦敦东印度贸易商人协会的记录以及英国博物馆图书馆的手稿，现为首次出版；由 THOMAS
    RUNDALL 先生编辑（1849 年）。（*已绝版*）。*于 1851 年发行*。


    ## 6—弗吉尼亚·不列颠尼亚之旅的历史

    表达了该地区的地理和物产，以及当地人的习惯习俗，由首批抵达那里的人收集观察，由殖民地第一书记 William Strachey 先生整理；现由英国博物馆的
    R. H. MAJOR 先生根据原始手稿首次编辑（1849 年）。（*已绝版*）。*于 1851 年发行*。


    ## 7—关于发现美洲及相邻岛屿的航行

    由 Richard Hakluyt 收集并出版。他是 1582 年布里斯托尔的圣职。由英国博物馆的 JOHN WINTER JONES 先生附上注释和引言编辑（1850
    年）。（*已绝版*）。*于 1852 年发行*。


    ## 8—日本文献集

    附有 THOMAS RUNDALL 先生的注释（1850 年）。*于 1852 年发行*。


    ## 9—佛罗里达的发现与征服

    由 费尔迪南德·德·索托著。由 Richard Hakluyt 从葡萄牙语翻译；由英国博物馆的 W. B. RYE 先生附上注释和引言编辑（1851 年）。*于
    1853 年发行*。


    ## 10—俄罗斯笔记

    译自关于该国的早期记载，书名为`Rerum Muscoviticarum Commentarii`，作者为德国宫廷派遣大公瓦西里·伊万·诺维奇的大使 Sigifmund
    von Herberltein 男爵，写于 1517 年和 1526 年。两卷。由英国博物馆的 R. H. MAJOR 先生翻译、编辑并附上注释和引言。第一卷（1851
    年）。*于 1853 年发行*。


    ## 11—哈逊湾地理

    根据 W. Coats 海尉在 1727 年至 1751 年间多次前往该地区的记录。附录包含 Middleton 海尉在 1741-1742 年乘坐英国海军女王号的“熔炉号（Furnace）”发现西北航道时的日志摘录。由
    JOHN BARROW 先生（F.R.S., F.S.A.）编辑（1852 年）。*于 1854 年发行*。


    ## 12—俄罗斯笔记

    第二卷（1852 年）。*于 1854 年发行*。


    ## 13—三次东北航行

    通往契汗和中国，由荷兰人在 1594 年、1595 年和 1596 年进行，包括他们对斯匹茨贝根岛的发现、在纽地民岛逗留数月，以及乘坐两只小船安全返回。由
    Gerrit de Veer 著。由 C. T. BEKE 先生（Ph.D., F.S.A.）编辑（1853 年）。（*第一版已绝版。见第 54 项*）。*于
    1855 年发行*。


    ## 14-15—中国伟大帝国的历史及其状况

    由 Juan Gonzalez de Mendoza 传父编写。现重印自 R. Parke 的早期译本。由 George T. STAUNTON 爵士编辑，并附有
    R. H. MAJOR 先生的引言。2 卷（1853-54 年）。*于 1855 年发行*。


    ## 16—弗朗西斯·德雷克爵环环绕的世界

    关于他随后前往神之名（Nombre de Dios）的航行。与远征队随师 Francis Fletcher 的一份未出版手稿校对。附有说明该次航行的附录，以及由
    W. S. W. VAUX 先生（M.A.）写的引言（1854 年）。*于 1856 年发行*。


    ## 17—征服中国的鞑征服者历史

    译自奥兰教父（Père''Orléans）1688 年的法文版。由 ELLEERE 爵翻译并编辑。附有 R. H. MAJOR 先生的引言（1854 年）。*于
    1856 年发行*。


    ## 18—斯匹茨贝根和格陵兰的早期文献集

    包括：从德语翻译 F. Martin 关于斯匹茨贝根的重要著作（现极其稀有）；译自 Isaac de Peyrère 的《格陵兰纪事》；以及一篇罕见文章，题为“1630
    年八名因不幸遗落在格陵兰的英国人身上显出的上帝的力量与眷佑，历经九个月十二天，由 Edward Pelham 忠实报告》。由 ADAM WHITE 先生附上注释编辑（1855
    年）。*于 1857 年发行*。


    ## 19—亨利·米尔顿爵士前往八打亚和马琉库群岛的航行

    来自 1606 年的稀有版本。由 BOLTON CORNEY 先生编辑（1855 年）。*于 1857 年发行*。


    ## 20—16 世纪末的俄罗斯

    由 Giles Fletcher 博士和 Jerome Horfey 爵士的旅行记著，现为英国博物馆首次印刷完整手稿。由 E. A. Hond 先生编辑（1856
    年）。


    ## 21—Girolamo Benzoni 在美美的旅行

    1542-56 年。由 W. H. SMYTH 海将（F.R.S., F.S.A.）编辑（1857 年）。*于 1858 年发行*。


    ## 22—15 世纪的印度

    发现好望角之前的叙述集。来自拉丁语、波斯语和意大利语来源，现首次译成英文。由 R. H. MAJOR 先生（F.S.A.）编辑（1857 年）。*于 1859
    年发行*。


    ## 23—西印度群岛和墨西哥的航行叙述

    1599-1602 年。由 Samuel Champlain 著。根据原始及未出版手稿翻译，并附有 ALICE WILMERE 的传记注释和地图（1859
    年）。*于 1859 年发行*。


    ## 24—亚马逊谷的探险

    16 世纪和 17 世纪：包含 Gonzalo Pizarro 的行程（译自 Garcilaso Inca de Vega 的《王室评论》）、Francisco
    de Orellana 的航行，以及 Cristoval de Acuna 在 1641 年撰写的极其稀有的叙述。由 CLEMENTS R. MARKHAM
    先生编辑并翻译（1859 年）。*于 1660 年发行*。


    ## 25—澳大利亚早期发现

    库克船之前的文献集。由英国博物馆的 R. H. MAJOR 先生（F.S.A.）编辑（1859 年）。*于 1660 年发行*。


    ## 26—Ruy Gonzalez de Clavijo 访问朝廷使团

    1403-6 年。首次翻译，附有注释、序言和 Timour Beg 的传记。由 CLEMENTS R. MARKHAM 先生编辑（1859 年）。*于 1661
    年发行*。


    ## 27—航海家亨利·哈逊

    记录其生平的原始文献。由 GEORGE ASHER（LL.D.）收集、部分翻译并注释（1860 年）。*于 1661 年发行*。


    ## 28—Ursua 和 Aguirre 寻找黄金国和奥马瓜的远征

    1560-61 年。译自 Pedro Simon 的《第六历史消息》（Sexta Noticia Historiale），由 W. BULLAERT 先生编辑；附有
    CLEMENTS R. MARKHAM 先生的引言（1861 年）。*于 1862 年发行*。


    ## 29—Alonzo Enriquez de Guzman 的生平与事

    译自马德里国家图书馆的手稿，由 CLEMENTS R. MARKHAM 先生编辑并附上注释和引言（1862 年）。*于 1862 年发行*。


    ## 80—Galvano 对世界的发现

    从最初到 1555 年。重印原始葡萄牙语文本，由海军副将 BETHUNE（C.B.）编辑（1862 年）。*于 1863 年发行*。


    ## 31—传道士 Jordanus 描述的奇迹

    塞维拉克，哥伦布主教；来自 14 世纪的拉丁语羊皮手稿，近期由 H. YULE 上校（C.B., F.R.G.S., 前孟加工程师）翻译并编辑（1863 年）。*于
    1863 年发行*。


    ## 32—Ludovico di Vartheما 的旅行

    16 世纪的叙利亚、阿拉伯、波斯、印度等地。由 J. WINTER TONES 先生（F.S.A.）翻译，并由 GEORGE PERCY BADGER 牧师附上注释和引言（1863
    年）。*于 1864 年发行*。


    ## 33—Cieza de Leon 1532-50 年的旅行

    从达里恩湾到普拉塔城，包含在其《编年史》第一部分（安特卫普 1554 年）。由 CLEMENTS R. MARKHAM 先生翻译、编辑并附上注释和引言（1864
    年）。*于 1864 年发行*。


    ## 34—Pascual de Andagoya 的叙述

    包含秘鲁的早期记载。由 CLEMENTS R. MARKHAM 先生翻译、编辑并附上注释和引言（1865 年）。*于 1865 年发行*。


    ## 35—16 世纪初的东非和马拉拉巴尔海岸

    由 Duarte Barbofa 著。由 HENRY STANLEY 先生根据一份早期手稿翻译（1866 年）。*于 1865 年发行*。


    ## 36—契汗与之路

    16 世纪以前关于中国的所有简要记载集。由 H. YULE 上校（C.B.）翻译并编辑（1866 年）。


    ## 37—契汗与之路

    第二卷（1866 年）。*于 1866 年发行*。


    ## 38—马丁·弗罗比舍爵士的三次航行

    附有现国家档案中的信件选编。由海军少将 COLLINSON（C.B.）编辑（1867 年）。*于 1867 年发行*。


    ## 39—菲律宾群岛

    16 世纪末的摩鹿群岛、暹、日本和中国。Antonia de Morga 著。由 Alderley 的 STANLEY 爵从西班牙语翻译并附上注释（1868
    年）。*于 1868 年发行*。


    ## 40—赫尔南·科尔特斯的第五封信

    写给查理五世皇帝，包含他 1525-26 年远征洪都拉斯的记载。由 Don Pascual de Gayos 从西班牙语翻译（1868 年）。*于 1868
    年发行*。


    ## 41—印加人的皇家注释

    由印加人 Garcilasso de Vega 著。由 CLEMENTS R. MARKHAM 先生翻译、编辑并附上注释和引言。第一卷（1869 年）。*于
    1869 年发行*。


    ## 42—瓦斯科·伽马的三次航行

    附带 Caspar Correa 的《印度传说》（Lendas da India）及原始文献。由 Alderley 的 STANLEY 爵士编辑（1869
    年）。*于 1869 年发行*。


    ## 43—哥伦布选选书信

    附带有关发现新世界的四次航行的原始文献。由 R. H. MAJOR 先生（F.S.A.）等编辑。第二版（1870 年）。*于 1870 年发行*。


    ## 44—奥曼伊玛和谢义的历史

    由 Salîl-Ibn-Razîk 著，661-1856 年。根据原始阿拉伯语翻译，并由 GEORGE PERCY BADGER 编辑附上注释、附录和引言，延续至
    1870 年。*于 1870 年发行*。


    ## 45—印加人的皇家注释

    第二卷（1871 年）。*于 1871 年发行*。


    ## 46—加那利亚人的征服与皈教之书

    1402 年由 Jean Bethencourt 爵士和 Pierre Bontier 创作。由 R. H. MAJOR 先生编辑附上注释和引言（1871
    年）。*于 1871 年发行*。


    ## 47—秘鲁发现的报告

    由 CLEMENTS R. MARKHAM 先生（C.B.）翻译、编辑并附上注释和引言（1872 年）。*于 1872 年发行*。


    ## 48—印加人的仪式与法律

    根据原始西班牙语手稿翻译，由 CLEMENTS R. MARKHAM 先生（C.B., F.R.S.）编辑并附上注释和引言（1873 年）。*于 1872
    年发行*。


    ## 49—塔纳和波斯的旅行

    由 Jafa Barbaro 和 Ambrogio Contarini 著；由 Alderley 的 STANLEY 爵编辑；由 CHARLES GREY
    翻译翻译（1873 年）。*于 1873 年发行*。


    ## 50—14 世纪的北方海

    由 R. H. MAJOR 先生（F.S.A.）翻译并编辑（1873 年）。*于 1873 年发行*。


    ## 51—1547-55 年汉斯·斯德在巴西东部部落中的被

    由 ALBERT TOOTAL 先生翻译，由 RICHARD F. BURTON 注释（1874 年）。*于 1874 年发行*。


    ## 52—麦哲兰的首次环球航行

    译自 Pigafetta 及其他同时代人的。由 Alderley 的 STANLEY 爵士附上注释和引言（1874 年）。*于 1874 年发行*。


    ## 53—阿方索·达尔贝奎克的皇家注释

    译自 1774 年的葡萄牙语版；由 WALTER DE BIRCH 先生（F.R.S.L.）附上注释和引言（1875 年）。*于 1875 年发行*。


    ## 54—三次东北航行

    Gerrit Veer 的北方航行的第二版。由皇家海军的 KOOLEMAN BEYEN 尉编辑并附上引言（1876 年）。*于 1876 年发行*。


    ## 55—阿方索·达尔贝奎克的注释

    第二卷（1877 年）。*于 1875 年发行*。


    ## 56—詹姆斯·兰卡斯特爵士的航行

    附有保存于印度部的日志摘要以及 Knight 海尉寻找西北航道的航行。由 CLEMENTS R. MARKHAM 先生（C.B., F.R.S.）编辑（1877
    年）。*于 1877 年发行*。


    ## 57—理查德·霍金斯骑士爵观察的第二版

    关于他 1593 年南海航行，以及祖父 William、父亲 John 和堂 William 的航行。由 CLEMENTS R. MARKHAM 先生（C.B.,
    F.R.S.）编辑（1878 年）。*于 1877 年发行*。


    ## 58—约翰·希尔特贝格的囚禁与旅行

    从 1396 年在尼尼波尔之战中中被俘到 1427 年逃往欧洲：根据海德堡手稿翻译，由 Karl Freidrich Neumann 教授于 1859 年编辑，由
    J. BUCHAN TELFEB 指令编辑；附有 B. BRUUN 的序言以及翻译者和编辑的注释（1879 年）。*于 1878 年发行*。


    ## 59—航海家约翰·戴维斯的航行与著作

    由 ALBERT H. MARKHAM 海尉（R.N., F.R.G.S.）编辑并附上引言和注释（1880 年）。*于 1878 年发行*。


    ## 60—印度的自然史与道德史

    Joseph de Acosta 父著。重印自 Edward Grimston 1604 年的英文译本；由 CLEMENTS R. MARKHAM 先生（C.B.,
    F.R.S.）编辑并附上注释和引言。第一卷，自然史（1880 年）。*于 1879 年发行*。


    ## 61—印度的自然史与道德史

    第二卷，道德史（1880 年）。*于 1879 年发行*。


    ## 62—阿方索·达尔贝奎克的注释

    第三卷（1880 年）。*于 1880 年发行*。


    ## 63—威廉·巴芬的航行，1612-1622。

    由 CLEMENTS R. MARKHAM 先生（C.B., F.R.S.）编辑并附上注释和引言（1881 年）。*于 1880 年发行*。


    ## 64—前往埃塞俄比亚的葡萄牙使团叙述

    1520-1527 年。由 Francisco Alvarez 著。根据葡萄牙语翻译，并由 Alderley 的 STANLEY 爵编辑附上注释和引言（1881
    年）。


    ## 65—百慕群岛或萨默罗群屿的历史

    归于 John Smith 海长。根据 Sloane Collection 中的一份手稿编辑，由 HENRY LEFROY 海将（R.A., K.C.M.G.,
    C.B., F.R.S.）等编辑（1882 年）。*于 1881 年发行*。


    ## 66—理查德·考克斯日记

    1615-1622 年在日本工厂期间。由 EDWARD MAUNDE THOMPSON 先生编辑第一卷（1883 年）。*于 1882 年发行*。


    ## 67—考克斯日记

    第二卷（1883 年）。*于 1882 年发行*。


    ## 68—秘鲁编年史的第二部分

    由 Pedro Cieza de Leon 著。由 CLEMENTS R. MARKHAM 先生（C.B., F.R.S.）翻译、编辑并附上注释和引言（1883
    年）。*于 1883 年发行*。


    ## 69—阿方索·达尔贝奎克的注释

    第四卷（1884 年）。*于 1883 年发行*。


    ## 70-71—John Huyghen van linschoten 的印度航行

    根据 1598 年的早期英文翻译。第一卷，由 ARTHUR COKE BURNELI（Ph.D., C.I.E.）的英国部编辑（1884 年）。*于 1884
    年发行*。


    ## 72-73—前往塔纳和波斯的旅行

    由 Jafa Barbaro 和 Ambrogio Contarini 著；由 Alderley 的 STANLEY 爵编辑；由 CHARLES GREY
    翻译并编辑（1883 年）。*于 1883 年发行*。


    ## 74—威廉·海奇斯先生的日记

    在孟加拉代理期间，1811 年。根据 Col. Yule 的未出版摘录（1888 年）。*于 1888 年发行*。


    ## 75—威廉·海奇斯的日记

    第二卷（1888 年）。*于 1888 年发行*。


    ## 76—弗朗西斯·莱瓜特的航行

    前往罗德里格、马里求斯和好望角。根据第一版版。重印原始葡萄牙语文本，由海军副将 BETHUNE（C.B.）编辑（1862 年）。*于 1863 年发行*。


    ## 77—弗朗西斯·皮拉德前往印度群岛的航行

    第二卷，第一部分（1888 年）。*于 1887 年发行*。


    ## 78—威廉·海奇斯的日记

    第三卷。Col. Yule 的未出版摘录（1889 年）。*于 1888 年发行*。


    ## 79—《球论》（Tractatus de Globis, et eorum usu）

    描述 Emery Molyneux 构建的地球，1592 年出版。由 Robert Hues 著。由 CLEMENTS R. MARKHAM 先生（C.B.,
    F.R.S.）编辑并附上索引和引言。附有环绕地球航行指南以及前往直布罗陀海峡的航行。来自 15 世纪手稿。由 JAMES GAIRDNER 先生编辑；附有
    E. DELMAR MORGAN 先生的词表（1889 年）。*于 1888 年发行*。


    ## 80—Galvano 对世界的发现

    第二卷，第二部分（1890 年）。*于 1889 年发行*。


    ## 81.—普拉塔的征服，1535-1555。

    第一：Ulrich Schmidt 往普拉塔河和巴拉圭河的航行。第二：Alvar Nunez Cabeza de Vaca 的注释。由 LUIS L. DOMINGUEZ
    附上注释和引言（1891 年）。*于 1889 年发行*。


    ## 82-83.—弗朗西斯·莱瓜特的航行

    前往罗德里格、马里求斯和好望角。根据第一英文版转录。由陆军上将 PASFIELD OLIVER 编辑并附上注释（1891 年）。*于 1890 年发行*。


