    P. 36. The famous `Idseas of Virgil` are expressed in that poet’s 1st Book ofneid
    represents Neptune as possessed of absolute power over all the waters below the
    firmament, which authority had fallen to his share on the death of Saturn. His
    elder brother Jupiter ruled over the air, and Æolus, the ruler of the storm-clouds,
    was an inferior deity, whose control of the winds was regulated by fixed laws,
    and he lets loose the winds, by striking his spear the volcanic Stromboli only
    at the order of Juno, Joris et soror et conjux.`

