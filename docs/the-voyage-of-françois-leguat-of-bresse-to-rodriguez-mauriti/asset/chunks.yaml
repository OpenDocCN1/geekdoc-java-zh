    *La Bibliothèque Britannique,* ou Histoire des Savants de la Grande Bretagne (La
    Haye, 1733-47), 25 vols., in 8vo. It is a continuation of the *Bibliothèque Anglaise*
    commenced in 1717 by Michel de la Roche. The writers in it were well-qualified
    authors, whose knowledge of English literature was considerable ; their names
    are given in the *Historie d’un Voyage Littéraire, fait en* M.DCCXxxiii, par Charles
    Etienne Jordan (La Haye, 1735), p. 159 :—”Il parut pendant mon Séjour à Londres,
    un nouveau Journal sous le Titre de *Bibliothèque Britannique.*Il y a toute apparance
    que ce Journal aura un heureux succès : les Auteurs sont Gens de Mérite, & qui
    entendent tous parfaitement l’Anglois : Messieurs Stahlin, Bernard, le Missy,
    le Mr. Duval, & le Savant Mr. Darmigcaux, aussi M. Blanfort.”^([1](#B11_fm-chapter.xhtml_Rfn1_21))
    *The History of Mauritius, or the Isle of France, and the neighbouring Islands.*
    From their first discovery to the present time, composed principally from the
    papers and memoirs of Baron Grant, who resided twenty years in the island. By
    his son, Charles Grant, Viscount de Vaux.(Loudon, 1801.)^([1](#B11_fm-chapter.xhtml_Rfn1_22))
    *Aventures de François Leguat et de ses compagnons en Deux Iles Désertes des Indes
    Orientales* (1650-1698). Publiées et annotées par Eugène Millier. Paris. Bibliothèque
    d’Aventures et de Voyages.(Maurice Dreyfous.)^([2](#B11_fm-chapter.xhtml_Rfn1_23))
    *Un Projet de République à l’ile oVEden (Vile Bourbon) en* 1689, par Le Marquis
    Henri du Quesne. Réimpression d’un ouvrage disparu, publié en 1689, intitulé Recueil
    de quelques mémoires servans d’instruction pour l’établissement de l’isle d’Eden.
    Précédé d’une notice par Th. Sauzier. (Paris, Librairie Ancienne et Moderne de
    E. Dufossé.)^([1](#B11_fm-chapter.xhtml_Rfn1_24)) *A Voyage to Madagascar and
    the adjacent Islands and Coast of Africk,* by Francis Cauche. English translation
    of 1710, p. 4, by Capt. Stevens, after the *Relations véritables et curieuses
    de Visle de Madagascar, etc.,* par Le Sieur Morisot.(Paris, 1657.)^([1](#B11_fm-chapter.xhtml_Rfn1_25))
    *Vide* “ Note sur l’Ile Rodrigue après le départ de Leguat,” par Eugène Müller.^([2](#B11_fm-chapter.xhtml_Rfn1_26))
    *Vide* Appendix B.^([3](#B11_fm-chapter.xhtml_Rfn1_27)) M. Sauzier adds : “ *Coincidence
    hizarre,* this name of the Marianne is still applied to the rock on which Leguat
    was imprisoned after escaping from Rodriguez.”^([1](#B11_fm-chapter.xhtml_Rfn1_28))
    *Vide* “ Some Remarks made at the French Islands of Mauritius and Bourbon, 1755,
    by Charles F. Noble, to Governor Pigot at Madras.”(Dalrymple’s *Oriental Repository*.)^([1](#B11_fm-chapter.xhtml_Rfn1_29))
    *I.e.,* two-pounder guns.^([1](#B11_fm-chapter.xhtml_Rfn1_30)) This constellation,
    says Mr. Knobel, is a small one cribbed from Libra and Virgo. The boundaries of
    it for the present eposh lie between Right ascension 14 hours and 14 hours 40
    minutes, and within the parallels of 15° and 25° of South declination. Devoid
    of bright stars.“ J’ai observé la plus grande partie de ces Etoiles à mes deux
    quarts-de-cercles muraux, & la figure de la constellation du *Solitaire* (oiseau
    des Indes & des Philippines) a été preservé en mémoire du voyage en l’île Rodrigue,
    m’ayant été fournu par Mrs. Pingré et Brisson ; voyez le tome ii de l’Ornithologie
    ; cette constellation sera voisine du Corbeau & de l’Hydre sur nos planisphères
    & globes célestes.” *(Mémoire sur une Nouvelle Constellation,* par M. le Monuier,
    lu 21 Août 1776; *Mém. de VAcadémie Royale,* 1776, p. 562, pl. xvii.)^([2](#B11_fm-chapter.xhtml_Rfn1_31))
    See Pamphlet by Dr. Hamel, entitled “ Der Dodo, die Einsiedler und der erdichtete
    Nazarvogel”, *Bulletin Phys -math.-Acad.,* St. Petersburg, vol. viii, Nos. *5,*
    6, 1846\. Quoted by Strickland and Melville in their postscript to their monograph
    on the Dodo, p. 64.^([1](#B11_fm-chapter.xhtml_Rfn1_32)) “ Upon the whole, if
    we consider the little trust that is to be put in slaves, which forms the chief
    strength of the island, their small force, besides the stony shoar which would
    render their batteries scarce tenable, and, I may add, the terror of the English
    arms, it may be presumed, that had our fleet under Admiral Cornish, which cruised
    off Rodriguez in 1761, been ordered to attack this island [Bourbon], it would
    have met with an easy conquest, and a very important one, as it may justly be
    reckoned a very healthy, pleasant, and profitable island.” (Dalrymple’s *Oriental
    Repository, loc. cit.)*^([1](#B11_fm-chapter.xhtml_Rfn1_33)) Afterwards Admiral
    Sir J. Rowley.^([1](#B11_fm-chapter.xhtml_Rfn1_34)) “ Les solitaires étoient communes
    à Rodrigue du temps de François Leguat. M. de. Puvigné m’a assuré que la race
    n’en étoit pas encore détruite, mais ils se sont retirés dans les endroits de
    l’Isle les plus inaccessibles.”(Pingré, *Journal,* MS., fol. 178.)^([1](#B11_fm-chapter.xhtml_Rfn1_35))
    “The *Queen Victoria*, 715 tons, which left Bombay on the 11th March 1843, bound
    for Liverpool, struck on the south-west reefs, off Rodrigues, during a gale of
    wind, on the morning of the 7th of April, and became a total wreck. The commander,
    Captain Black, most of the passengers, and several of the crew were saved, but
    Mr. R. Plunkett, a passenger, and nine seamen were drowned in a hasty attempt
    to reach the shore. The survivors were hospitably entertained in the island of
    Rodrigues for thirty-six days, until they obtained a passage to Bourbon, the governor
    of which place forwarded them to Mauritius.” *(Asiatic Journal,* vol. i, p. 662
    ; 1843.)“At 4, on the morning of 1st September 1843, the East-India packet ship,
    *Oxford,* Captain Marshall, on her passage from Calcutta to London, while under
    a press of sail, struck on a ledge of rocks off the island of Rodrigues, and shortly
    after became a total wreck. The crew and passengers having taken to the boats,
    were picked up by a Glasgow vessel and landed at Mauritius. The loss of this vessel
    and of the *Queen Victoria* is attributed to an error in the Admiralty Charts,
    in which this reef of rocks is laid down as extending only five miles, whereas
    it extends from fifteen to sixteen miles.” *(Asiatic Journal,* vol. ii, p. 326
    ; 1843-44.)^([1](#B11_fm-chapter.xhtml_Rfn1_36)) The *Philosophical Transactions
    of the Royal Society,* vol. 168, 1879, reporting on the collections from Rodriguez,
    include *The Physical Features of Rodriguez* by Is. B. Balfour, Sc.D. ; and reports
    of proceedings of the Naturalists, viz. : *Petrology,* by N. S. Maskelyne, F.R.S.
    ; *Botany,* MM. Balfour, Mitten, Crombie, Berkeley, and Dickie ; *Zoology, Extinct
    Fauna,* Bone Caves, by Mr. Slater ; *Birds,* by Dr. Günther and E. Newton ; *Osteology
    of the Solitaire,* by E. Newton and J. W. Clark ; *Untiles,* by Dr. Günther; *Recent
    Fauna,* by Dr.Günther, MM.Sharpe, Smith, Miers, Butler, Waterhouse, Grube, Gulliver,
    Brüggemann, and others.'
