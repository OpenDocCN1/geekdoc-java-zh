    在关于弗朗索瓦·勒瓜（François Leguat）所经历的非凡冒险与苦难的故事中，叙述的事件发生比哈克鲁伊特协会（Hakluyt Society）此前出版的任何其他旅行或航行要晚得多；尽管如此，这份个人记录的日期紧随威廉·海奇斯（William
    Hedges）日记的后期，事实上，它构成了后者一个相当贴切的延续，因为它提供了有关 17 世纪末荷兰在印度东群和好望角的行政与殖民体系的信息，并生动地描绘了那个时代胡格教徒从欧洲迁往南非的情况。


    然而，勒瓜描述中主要的现代科学兴趣，无疑取决于他对当时存在于马斯喀里纳群岛（Mascarene Islands）的奇异鸟类群的详尽描述。这些物种随后的灭绝使得这位哲学家胡格教徒的个人观察对自然学家而言无价之宝，而且这些观察带有如此显而易见的简单与真实。


    ### 致谢


    编辑现在有一项愉快的任务，在本本书的开头感谢并记录他在准备过程中，从众多文学和科学界朋友那里在各项研究中获得的善意与及时协助。


    首先，要感谢地理学会（`Société de Géographie`）著名的图书管理员詹姆斯·杰克逊（M. James Jackson）先生，编辑得以接触这位胡格教徒作者的早期法语版本。地理学家通过同一学会的科迪尼（M.
    J. Codine）先生的研究，对马斯喀里纳群岛发现的大致日期有了更准确的了解，此前这一主题大多持有错误观点。遗憾的是，由于空间限制，科迪尼先生关于这一主题的精彩论证不得不删减。


    索齐尔（M. Sauzier）先生发现并复制了罕见的杜奎内（Du Quesne）`Mémoire`，这对更好地理解勒瓜的几处暗示做出了巨大贡献，尽管目前仍理由怀疑被引用的那份特定的
    `Memoire` 是否已获得完全确认。欧金·穆勒（M. Eugene Muller）先生的几条注释在注释者的许可下被利用，而巴黎国立图书馆馆长再出版的勒瓜书籍小版附录所提供的线索被证明极具启发性。


    自然，阿尔法·米尔内-爱德华（M. Alph. Milne-Edwards）先生对《自然科学纪》（`Annales des Sciences Naturelles`）及其他科学期刊的贡献，很大程度上被用于阐明罗德格斯的自然史；任何关于马斯喀里纳群岛的著作，都不可能不对这位著名的自然学家产生沉重的债务。国立图书馆（`Bibliothèque
    Nationale`）的加布里尔·马塞尔（M. Gabriel Marcel）先生付出了巨大的精力，详尽且分类地回答了编辑就该出版物的文献和地理等方面提出的众多且固执的问题，从而极大地帮助了其准确性。


    法国水图员 A·布凯·德·格里（M. A. Bouquet de la Grye）先生非常礼貌地使编辑获得了平格神父（Abbé Pingré）在罗德格斯尚未出版的原始手稿日记的准确抄本，这被证明对阐明某些疑点非常有用。美国华盛顿史密森尼学会（`Smithsonian
    Institution`）的 R·W·舒菲尔特（Mr. R. W. Shufeldt）先生欣然许可复制他对毛里留斯巨鸟的巧妙修复图，尽管这种鸟的存在仍存争议；范坎（Mr.
    Van Kampen）先生体体修订了萨尔蒙夫人（Mrs. Salmon）从瓦伦丁（Valentyn）荷兰语翻译的任何章节。哈克鲁伊特协会（`Hakluyt
    Society`）对上述所有外国贡献者表示感谢，编辑也对他们热情的帮助和鼓励深表感谢。


    ### 贡献者


    在履行义务，首先对海外盟友的帮助表达了略显不足的谢意后，编辑现在必须对自己的同胞表示同样诚挚的感谢，同胞向他自由地分享了他们对以下笔记中涉及的所有科学领域进行耐心的研究结果。


    在动物学家和鸟类学家中，最卓越的是剑桥大学动物学教授（斯特里克兰德和梅尔维的收藏在那里处于尊崇地位）以及他的兄弟 E·牛顿爵士（Sir E. Newton，世界由于于他不疲竭的探索，才恢复了多加鸟（Dodo）、独行性鸟（`Solitaire`）、无足鹤（`Aphanapteryx`）及其同缘种的），他们为勒瓜文本的注释和说明插图提供的材料，远超过编辑在有限空间内能妥善或满意处理的内容。此外，这位博学的教授及其兄弟花费了大量个人精力，为编辑获取了博物馆中马斯喀里纳鸟类丰富的骨骼遗骸（顺便提，博物馆不断从罗德格斯和毛里留斯的洞土中获得新的
    `trouvailles`），还获得了一让勒瓜之名永垂的鸟骨架照片。这些科学家在勒瓜历史中最引人胜的主题上造诣极深，他们通过对其专业领域的校样稿进行批判性审阅，协助了编辑。


    当马斯喀里纳的鸟类群得到了阿尔弗雷德·牛顿教授（Professor Alfred Newton）和爱德华·牛顿爵士（Sir Edward Newton）的密切关注时，罗德格斯的植物受到了爱丁堡艾萨克·贝利·巴尔富（Professor
    Isaac Bayley Balfour）教授的严格检查和分类；在与“1874 年凌日考察”有关访问该岛后给皇家学会（`Royal Society`）的报告中，编辑在识别那位两百年前的胡格教徒以许多
    `naïveté`（天真）描述的植物的任务时，找到了他所需要的一切。邱园的 J·G·贝克（Mr. J. G. Baker, F.R.S.）和斯科特·埃利奥特（Mr.
    Scott Elliot）先生在确定某种提到的对老旅行者产生灾难影响的毒树这一困难且未完成的问题上，也通过启发性的建议协助了编辑。君特（Professor
    Günther）教授也乐意就他询问的同一岛屿奇龟提供全部信息；而 J·雷格（Prof. J. Legge）、托马斯·韦德爵士（Sir Thomas Wade）和
    K·道格拉斯（K. Douglas）教授则礼貌地就勒瓜对中国哲学家混乱的想法提供了有帮助的建议。


    印度事务部（`India Office`）的 R·罗斯特博士（Dr. R. Rost）通过允许编辑查阅图书馆中各种不易获得的旅行书籍，为编辑提供了至关重要的帮助。事实上，他的热诚和友善建议对编辑帮助极大。在此记录，伦敦图书馆（`London
    Library`）对于任何住在城外、远离大博物馆从事需要不断参考文献工作的写作作者来说，被证明是一个巨大的福音，这也不为恰。


    哈克鲁伊特协会（`Hakluyt Society`）的秘书热心地修订、删减、修改并补充了编辑在第一部分的许多原始笔记。在感谢他通过修订确保额外准确性所做的努力的同时，编辑遗憾地被迫反对他的协作者得出并发表的某些结论，特别是关于榕树、露兜和胡椒的那些笔记，其中德尔马·摩根（Mr.
    Delmar Morgan）违背了专家植物学家教授在亲身观察后形成的意见。最后，克莱门斯·K·马克姆（Mr. Clements K. Markham）对第二部分的修订，以及他对第一部分一个非常重要的错误陈述的及时纠正，值得编辑衷心的认可和感谢。威廉·格里格（Mr.
    Wm. Griggs）先生通过对原作进行精美的 `facsimile` 复制，对文本的完整插图做出了巨大贡献。


    S·帕斯菲德·奥利弗（S. PASFIELD OLIVER）

    莫雷小屋，斯托克斯湾，戈斯港

    1891 年 5 月 16 日

