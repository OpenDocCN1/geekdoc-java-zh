    In orig.: “qui étoit presque pleine,” omitted by translator.^([1](#C01_chapter_split_000_split_001.xhtml_Rfn8_212))
    In orig.: “au dela de ce même brisant,” omitted by translator.^([2](#C01_chapter_split_000_split_001.xhtml_Rfn8_213))
    In orig.: “un demi-quart d’heure plutôt.”^([3](#C01_chapter_split_000_split_001.xhtml_Rfn8_214))
    It is high water, full, and change at Port Mathurin at Ohr. 30m.; spring tides,
    such as those chosen by Leguat’s comrades for passing the reefs, rise, according
    to Findlay, 4½ feet, the neaps to 1½ foot only. The tidal streams are not appreciable
    except in the channels or passes. Occasionally rollers set in (*ras-de-marées)*,
    causing heavy breakers on all the dangerous reefs and rocks, and a nasty swell
    in Mathurin Bay. (*Findlay.)*^([1](#C01_chapter_split_000_split_001.xhtml_Rfn8_215))
    The upper surface of coral reefs always presents a series of sharp and jagged
    edges most dangerous to tread on without protection to the feet.^([2](#C01_chapter_split_000_split_001.xhtml_Rfn8_216))
    “Boats land now at the upper end of the creek in Mathurin Bay, at a small pier
    extending from the village, during high tide, but they cannot get within 400 yards
    at low tide, and wading must be resorted to.” (Findlay, *op. cit.*, p. 516.)^([3](#C01_chapter_split_000_split_001.xhtml_Rfn8_217))
    In orig. : “transi,” *i.e.*, chilled.^([1](#C01_chapter_split_000_split_001.xhtml_Rfn8_218))
