- fmt: "\nFIVE or six years before the deaths of Cardinal Richelieu and his sovereign,\
    \ Louis XIII—that is, about the year 1637-38—`François Leguat` appears to have\
    \ been born in Bresse, a small province (represented at the present day by the\
    \ department of Ain, on the Savoyard frontier) between the confluent streams of\
    \ the Rhône and Saône rivers. Our author’s ancestor, `Pierre le Guat`, is mentioned\
    \ as the Seigneur of la Fougère, in the `Histoire de Bresse et de Bugey,` by Samuel\
    \ Guichenon. Of his early days little is known ; but, according to his own account,\
    \ when over fifty years of age, he was driven into exile, in consequence of the\
    \ revocation of the Edict of Nantes (1685), and with many others took refuge in\
    \ Holland in the year 1689. At this time the Marquis Henri du Quesne, son of the\
    \ celebrated naval commander of that name, was projecting, under the sanction\
    \ of the States-General and the directors of the Dutch East India Company, the\
    \ establishment of a colony of French Protestant refugees in the island of Mascaregne,\
    \ now known as `Tie de la Réunion`. The Marquis had previously published a glowing\
    \ description of this island (which he proposed to name `Eden`), the largest of\
    \ the group discovered by the Portuguese in the preceding century, but as yet\
    \ imperfectly explored and vaguely marked as `Las Mascarenhas` in the old maps\
    \ and portulans ; so that many refugees were desirous of becoming colonists in\
    \ the new paradise of the southern hemisphere, and two ships were chartered for\
    \ the purpose of taking possession of this hitherto supposed uninhabited island,\
    \ to one of which Leguat was officially appointed as major. \n\nOn learning, however,\
    \ later, that a French squadron was under orders to sail for this island (which\
    \ had, indeed, been re-annexed in 1674 by `M. de la Haye`, the French `Viceroi\
    \ des Indes,` for the French East India Company), the Marquis du Quesne suspended\
    \ the preparations for his abortive scheme, following the precise injunctions\
    \ of his father, never to take up arms against the French Government, and, instead,\
    \ contented himself with fitting out a small frigate, `La Hirondelle,` whose commander\
    \ was directed to reconnoitre the islands of the group, and to take possession\
    \ of whatever island was found unoccupied and suitable for colonisation. This\
    \ change of plan does not seem to have been communicated to the small band of\
    \ adventurers who embarked as emigrants under the idea that they were to be landed\
    \ on the Isle of Eden, the terrestrial paradise of their anticipations, and the\
    \ small expedition finally left Texel on the 10th July 1691.\n\nThe commander\
    \ of the `Hirondelle,` `M. Valleau`, whom Leguat charges with the basest treachery,\
    \ having professedly discovered at the Cape that Mascaregne had been formally\
    \ annexed by the French `Compagnie des Indes Orientales` (who had placed `M. Vaubolon`\
    \ there as governor), passed by this delightful island, which, in truth, fully\
    \ justified the praises and descriptions of the Marquis, tantalising the scurvy-stricken\
    \ colonists by the enchanting prospect it exhibited to their eyes, and continuing\
    \ his voyage to the eastward, anchored off the smaller island of Rodriguez ; and\
    \ here, on the 1st May 1691, Leguat landed with eight of his fellow-adventurers,\
    \ somewhat disappointed with the unexpected change in their programme, but sufficiently\
    \ pleased with the place to decide that they would remain for two years and see\
    \ how fortune might favour them. The `Hirondelle` shortly afterwards sailed for\
    \ Mauritius, having landed arms, utensils, seeds, and provisions, in addition\
    \ to the private stock of supplies and necessaries which each colonist had provided\
    \ for himself.\n\nIt is the record of the careful personal and detailed observations,\
    \ made by Leguat on the then existent fauna and flora of the island, during this\
    \ period of seclusion from the world, that has rendered the simple story of the\
    \ Huguenot exile so deeply interesting to naturalists of the present day ; and,\
    \ consequently, in the following notes and appendices which accompany the text\
    \ of the original translation, the confirmation of Leguat’s remarks upon the appearance\
    \ and habits of the remarkable birds and animals, now altogether extinct, by the\
    \ late investigations of modern men of science, has been especially dwelt upon\
    \ ; for the veracity of the main facts recorded in this charming narrative of\
    \ adventure has been fully established in the most notable particulars by eminent\
    \ authorities in Europe.\n\nAfter a residence of two long years’ duration in Rodriguez,\
    \ the settlers, wearied with discontent and hopeless of assistance, constructed\
    \ a boat, in which they succeeded in reaching Mauritius after a most hazardous\
    \ voyage. Unfortunately, they had only escaped from one evil to fall into greater\
    \ trouble, for the avarice of the governor of the Dutch convict establishment\
    \ caused them to be treated with the utmost cruelty and injustice. They were imprisoned\
    \ on an exposed rocky islet at a long distance from the shore, and in attempting\
    \ to escape, one of their number perished miserably. At last the survivors, who\
    \ had contrived to send news of their sad plight to Europe, were transmitted,\
    \ still in confinement, to Batavia, where they disembarked, in December 1696,\
    \ only to be again thrown into prison. After examination, however, before the\
    \ Dutch Council their innocence was established, but they were unable to obtain\
    \ the slightest redress for the pain and suffering they had endured, or compensation\
    \ for the losses they had sustained. It was not until March 1698, after the proclamation\
    \ of the Peace of Ryswick, that Leguat and two others, the sole survivors of the\
    \ original party, landed at Flushing.\n\nAt this period crowds of French refugees\
    \ were streaming to Britain, and it is interesting to hear what a friend of Leguat,\
    \ writing at this period (1697-98), says on this subject. `M. Henri de Valbourg`\
    \ (not `Maximilien Misson`, whose connection with Leguat will afterwards discussed)\
    \ writes: “The French Protestants that fled into England are so spread over the\
    \ whole country, that it is impossible to be certain so much as their number.\
    \ Besides the eleven regiments which are wholly made up of them, there are some\
    \ in all other sects gone into service, so that there is scarce any considerable\
    \ house where you may not find some. At present there are twenty French churches\
    \ in London, that are in the pay of the state, without reckoning those that went\
    \ to Scotland and Ireland, Jersey, and Guernsey.” (Written originally in French,\
    \ and translated by `Mr. Ozell`).\n\nAmong others of his compatriots Leguat now\
    \ migrated from Holland to England, where he seems to have settled for the remainder\
    \ of his life. He was about sixty years old, but it was not until 1708, when he\
    \ was a septagenarian, that the manuscript of his `Relation` was printed and published\
    \ in London, in French and English, whilst a French edition was published at Amsterdam,\
    \ and a Dutch version was printed at Utrecht. These original editions were soon\
    \ followed by German translations printed at Frankfort and Leipsic in 1709, another\
    \ French edition was produced in London in 1720, and an abridged edition appeared\
    \ later in 1792. The book was well received, and reviewed favourably by the literary\
    \ journals of the day, so that its publication brought its author into notice,\
    \ and Leguat became acquainted with `Baron Haller` and other scientists of that\
    \ day ; among others who thus came to know him was `Dr. Sloane`, the secretary\
    \ of the Royal Society. The adventurous traveller remained in England, and, from\
    \ a contemporary notice in the `Bibliothèque Britannique`, it appears that he\
    \ attained the great age of ninety-six years before he died at or near London\
    \ in September 1735. According to `M. Eyriés`, in the `Biographie Universelle`,\
    \ the narrative of Leguat’s voyage was generally supposed to have been published\
    \ by a certain unfrocked Benedictine monk, named `Frédéric Gabillon`. This person\
    \ was an ingenious literary adventurer who, having completed his studies in Paris,\
    \ joined the order of the Théins, but soon, repenting the sacrifice of his liberty,\
    \ escaped from his convent and fled to Holland, where he shortly professed the\
    \ reformed religion. Being without resources, he worked at compilations for booksellers,\
    \ but getting into debt went over to England, where he took the name `Jean Leclerc`\
    \ (a noted journalist) and imposed on several persons of distinction.\n\nIt is\
    \ certainly possible that this renegade may have imposed on the simple-minded\
    \ Leguat ; and, indeed, `President Bouhier` (as evidenced by a note in his handwriting\
    \ in his own copy of Leguat’s book) was of opinion that Leguat owed to Gabillon\
    \ `les faits altérés` and the digressions on the advantages and disadvantages\
    \ of marriage, which are so prominent in our author’s work. Baron Haller, who,\
    \ as already mentioned, knew him personally, always declared that Leguat was a\
    \ frank and sincere man ; nevertheless, `M. Bruins de la Martinière`, also a contemporary,\
    \ in his `Geographical Dictionary`, does not scruple to class Leguat’s Voyage\
    \ among “the fabulous travels which have no more reality than the dreams of a\
    \ fevered brain”. Ever since, this very inaccurate judgment has not seldom been\
    \ held by many. On the other hand, the observations of Leguat have been amply\
    \ confirmed by the evidence of his contemporaries and of voyagers who followed\
    \ in his footsteps ; while recent investigation has proved the general correctness\
    \ of his observations in a remarkable degree. `M. Jacques Bernard` (the successor\
    \ of `Pierre Bayle`), in his continuation of Bayle’s `Nouvelles de la République\
    \ des Lettres,` for December 1707, noticed Leguat’s volume when first published,\
    \ and made the following critical remarks on its authorship: “The Preface of this\
    \ Book is not by the Author of the Work. He who has composed it maligns various\
    \ persons of merit, some of whom will perhaps scorn to notice his insulting expressions,\
    \ and others will not fail to retaliate on the first opportunity. I (M. Jacques\
    \ Bernard) have already received from two separate sources a Memoir and a Letter\
    \ against this Preface. But as they concern personal quarrels in which the Public\
    \ has no interest, I have not thought fit to insert them in my Review, especially\
    \ the Memoir, in which the attacks of the Author are warmly repuls. I have already,\
    \ elsewhere, advertised that, if I cared to utilise all the writings which concern\
    \ the personal disputes of Authors, I should have room for nothing. I repeat my\
    \ notice again, unless the Memoirs sent to me contain something-useful to the\
    \ Public, I cannot publish them.”\n"
