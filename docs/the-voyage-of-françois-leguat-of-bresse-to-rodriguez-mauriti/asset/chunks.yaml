    | 1570. | 兰巴德（Lambarde）关于格林尼治玛丽女王的记载。 |

    | 1598 年 9 月 20 日. | 《南特敕令》。荷兰人定居在圣阿波洛尼亚和毛里留斯。 |

    | 1613. | 一艘英国船“珍珠号”（Pearl）访问圣阿波洛尼亚，卡斯顿船长（Captain Castleton）将其命名为“英国森林”。 |

    | 1630. | 圣阿波洛尼亚被命名为珍珠岛（Ile de la Perle）。 |

    | 1638. | 弗朗索瓦·勒瓜（François Leguat）出生。苏格兰公约派反对查尔斯国王政府的起义。 |

