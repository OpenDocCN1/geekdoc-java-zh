    ### 编辑承担的其他作品。


    - 《皮埃罗·德拉·瓦莱书信》（Letters of Pietro della Valle），由 `G. Havers` 根据早期英文版本转录（1665 年），并由前印度文官政府
    `Mr. EDWARD GREY` 编辑。

    - 《福克斯和詹姆斯在哈德逊湾航行》。由 `MILLER CHRISTY` 士编辑。

    - 伯纳尔·迪亚斯（Bernal Diaz）著的《新西班牙征服 true 史实》。由西班牙语翻译并由海军上将 `LINDESAY BRINE` 编辑。

    - 《坎伯兰伯爵的航行》，根据彭布鲁克伯爵之命准备的记录整理。由 `W. DE GRAY BIRCH` 士、`F.S.A.R` 编辑。

    - 《罗夫米塔尔于 `1466` 年出使英国、西班牙等国的使节报告》。由 `R. C. GRAVES` 士编辑。

    - 17 世纪关于航海及一般海事书籍的重印本，包括 `1692` 年版的约翰·史密斯船长《海员语法》，以及 `1644` 年 H. 曼韦爵士的《海员词典》，并附未出版手稿摘录。由
    `H. HALLIDAY SPARLING` 士编辑，并附注释和前言。

    - 《摩尔人利奥·非洲人的游记》，译自 `John Pory`（`1600`年）的英文版。由 `ROBERT BROWN` 士（`M.A.`、`Ph.D.`、`F.L.S.`
    等衔）编辑。

    - 《伊本·朱拜尔的游记》。由剑桥大学基督学院成员 `Professor W. ROBERTSON SMITH` 教授编辑。

    - 《莱利的圭亚纳帝国》。第二版（见第 3 项）。由 `EVERARD F. IM THURN` 士编辑，并附注释等。

    - 《凯米斯和贝里前往圭亚纳的航行》。由 `Mr. James Rodway` 编辑。

    - 《丹皮尔的航行》。由海军海军 `Lieut. CECIL DAMPIER`、`R.N` 编辑。


    ### 建议提交委员会出版的作品。


    - 罗伊斯爵士（Sir Thomas Roe）出使印度期间的未出版书信等。

    - 科斯马·印迪科普留夫特斯（Cofmas Indicopleuftes）的《基督教地理》。

    - 伯恩哈德·德·布雷登巴赫（Bernhard de Breydenbach），公元 `1483-84` 年圣地之旅。

    - 菲利克斯·法布里（Felix Fabri），`1483` 年圣地、埃及等地漫游。

    - 雅克·卡蒂埃船长（Captain Jaques Cartier）于 `1535` 年和 `1536` 年前往加拿大、霍赫加和萨格尼岛的航行。

    - `Ca da Mofto`。《`1454` 年沿非洲西岸航行》。译自 `1507` 年的意大利语文本。

    - `J. dos Santos`。《东埃塞俄比亚史》。`1607`。

    - 讲述发现美洲的冰岛萨歌。

    - 《阿根廷》（La Argentina）。关于 `1512` 年到多明戈·马丁内斯·德·伊拉拉（Domingo Martinez de Irala）时期发现拉普拉塔河省的记载；鲁伊斯斯·迪亚斯·德·古斯曼（Ruiz
    Diaz de Guzman）著。

    - 曼努埃·德·阿尔梅达（Manoel de Almeida）著《埃塞俄比亚史》。

    - 耶稣会士西德里（Desideri）在西藏的日记。

    - 鲁布鲁克（Friar Rubruquis）的游记。

    - 威廉比和钱切勒（Willoughby and Chancellor）的航行。

    - 奥特利留（Ortelius）和墨卡托（Mercator）的信件。

    - 伊本·巴图塔（Ibn Batuta）的游记。

    - 塔斯曼（Tasman）的航行。

    - 泰塞罗（Teixeiro）的游记（译自葡萄牙语）。

    - 萨尔米托（Sarmiento）的航行。

    - 谢莱兄弟在波斯的游记。

    - 拉尔夫·菲奇（Ralph Fitch）的航行。


    ### 哈克卢特学会章程。


    I. 本学会的宗旨是为其成员分发，印刷从早期到 18 世纪初的稀有且珍贵的航行、游记、海军远征及其他地理记录。

    II. 年度订阅费为一几尼英，须在每年`1 月 1 日` 提前支付。

    III. 学会每位成员在缴纳订阅费后，有权获得学会制作的每部作品，并在订阅期内参加全体会议的投票；若在年底结束前未表示辞职意愿，则被视为下一年的成员。

    IV. 学会的事务由一个由 21 人组成的委员会管理，即：一名主席（`President`）、两名副主席（`Vice-President`）、一名秘书（`Secretary`）和十七名普通成员，每年选举一次；但在全体会议期间产生的空缺由委员会填补。

    V. 每年举行一次订阅者全体。届时将阅读秘书关于学会状况和进展的报告，并进入选举下一届委员会的程序。

    VI. 在每届年度选举中，旧委员会成员将退休，其中三人有资格参加连选。

    VII. 委员会在需要时开会以处理事务，三人组成法定人数，包括秘书在内，主席拥有决定票票。

    VIII. 为学会准备和编辑作品的先生，将分别获得 25 份此类作品，若作品也经过翻译，则额外获得 25 份。


    ### 学会书籍的递送规则。


    I. 学会的作品将在总邮局三英里内免费递送。

    II. 作品将寄往该范围以外的任何地方，学会承担挂号费，但不承担运费；在此情况下，学会不对任何损失或损坏负责。

    III. 书籍将由学会代理 `MR. CHARLES J. CLARK`（`4, Lincoln’s Inn Fields`）递交给持有订阅者书面授权的人。

    IV. 书籍将发送给学会位于王国主要城市的通讯员或代理；并应确保运费尽可能廉。


    哈克卢特学会（Haklupt Society）成员名单。


