    Th.—Dictionnaire des Arts et des Sciences. 16-10.CORNEILLE, Pierre.—Le Cid. 1636.DAVID,
    Pseaumes de.—Protestant version of, by Marot et Bèze. 1580.DELON.—Relation de
    Voyage. 1685.DIODORUS SICULUS.—*Bιβλιοθήκη.* (Time of Augustus, 50 B.C.)DIOSCORIDES.—Fragmenta.Du
    QUESNE, Marquis Henri.—Projet de République à l’île Eden. 1689.FLACOURT, de.—Voyage
    à Madagascar. 1658.FOCJRNIER, P. George.—Hydrographie. 1667.GODEAU, M. de.—Poésie.GRYNÆUS.—Novus
    Orbis Region um et Insularum veteribus incog. 1532.HERODOTUS.—Historia. B.C. 450.HERVAGIUS.—Novus
    Orbis. 1537.HOANGTI-XAO.(Time of Confucius, B.C . 480.)HORATIUS FLACCUS, Q.—Carmina,
    *“Ad Virgilium.”* B.C. 30.JEREMIAS.—Lamentationes. B.C. 600.LAMBARDE, William.—Perambulation
