    Bèze.—Pseaumes de David. 1580.MATTHÆUS.—Evangelium Auetore Matthæi.MELA, Pomponius.—Cosmographi
    Geographia. A.D. 600.MOLTERE, J. B. P. de.—Œuvres. 1667.MONTFAUCON, Dom. B. de.—Paleeographia
    Græca. 1707.MORGAN, Sylvanus.—Sphere of Gentry.MOSES.—Libri Mosis.NORTH, Sir Thomas.—Amyot’s
    version of Plutarch’s Lives translated into English. 1657\. *Vide* Amyot.OLEARIUS,
    Adam.—Voyages and Travels. 1662.OVIDIUS NASO, P.—Opera. Cuippingii Ed. 1683.PAULUS.—Epistolse.PLINIUS,
    C., Secundus, or Major.—Encyclopaedia. Delphin Ed. 1685.PLUTARCHUS.—Biographia.
