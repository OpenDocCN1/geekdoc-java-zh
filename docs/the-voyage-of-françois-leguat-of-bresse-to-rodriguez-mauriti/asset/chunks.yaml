    “These few lines suffice, we believe,” writes M. Eugène Muller, “to characterise
    the author and the principal hero of the narrative about to be related. We here
    recognise one of those pure but rigid individualities which have so often been
    engendered by the pious spirit of enquiry amidst the fires of intolerant persecution.”
    “François Leguat personifies in all his austerity, imposing yet simple, those
    puritans of France, who, obliged by conviction to profess the primitive faith,
    openly repudiate with energy all practices both civil and religious, which according
    to their ideas are incompatible with ancient Christian simplicity. Absolutely
    humble before God, and full of charity towards their neighbours, they do not regard
    as vain the examples of putting away all vanities given by the Divine Saviour;
    but freed by the renouncement of the world, they obtain from the divine revelation
    the great precept of human equality. A strange and bizarre type, and we cannot
    help adding, not without a semblance of the ridiculous.”^([1](#B19_fm-chapter.xhtml_Rfn7_27))
    This preface, according to Jacques Bernard, the successor of Bayle, was not written
    by Leguat, but by Maximilitn Misson. See Introduction and Notice by M. Th. Sauzier
    therein quoted.Frédéric Auguste Gabillon, to whom President Bouhier (quoted by
    M. Eyriès) attributes this volume, was born at Paris in the 17th century. After
    completing his studies, he joined the religious order of the *Théatins,* but soon
    repenting of the sacrifice of his liberty, he left their convent and fled to Holland,
    where he shortly after openly abjured his vows and professed the reformed religion.
    Being without resources, he worked at compilations for booksellers, but getting
    into debt, he went over to England, and took the name of Jean Léclerc, a well-known
    publicist of Holland, thereby imposing on various persons of distinction. The
    end of the adventurer’s career is not very certain according to Moréri’s Dictionary.
    It is, therefore, possible that this refugee was employed by Leguat as an amanuensis
    or copyist, but there is little doubt that M. Bernard was right, and the President
    Bouhier wrong in his surmise. Let the reader only compare Leguat’s preface with
    that of Misson’s *New Voyage to Italy* (fourth edition), and he cannot fail to
    be convinced of the identity of the original author. Take, for instance, the first
    paragraph as to the uses of Prefaces in general. Misson begins:—” Joseph Pamelius,
    an Ingenious Man, has composed some Dialogues, in one of which he declaims mightily
    against[^*](#B19_fm-chapter.xhtml_fn3_28) Prefaces in general; but particularly
    against those who make ’em......”This opening, the tirade against false Voyages,
    and his excuses for publishing his book, have a most wonderful similarity of language
    and reasoning with the earlier portions of the preface to Leguat’s book.^([*](#B19_fm-chapter.xhtml_Rfn3_28))
    That is to say: *Prefaces are useless to those only who never read ’em; and are
    resolv’d to stand fast in their Reproaches and Prejudices. It is in vain to speak
    to the Deaf or write to the Blind.*'
