- fmt: '

    # FIRST CHAPTER

    Departure of the Author from France to Holland and why. How he performed the journey.
    Difficulties caused by a French Squadron. He embarks on a small vessel to follow
    the said Squadron. “What persons accompany him and their commission. Departure
    from Amsterdam and arrival at Texel. When they sailed thence and what course they
    kept. Their experiences off Schetland.[¹](#B15_fm-chapter.xhtml_fn5_1) Arrival
    at the Canary Islands. What kinds of fish and fowl they met with on their way.
    Description of Salt Island, and the animals found there. The Island of Bonavista.
    Ceremony on crossing the Line. The Island of Tristan. Arrival at the Cape of Good
    Hope (1-33)


    # SECOND CHAPTER

    Departure from the Cape for the Island of Mauritius. Fearful storm. Unexpected
    arrival and description of the Island of `Eden`. The fruit that grows there. The
    animals and birds on it. The Commander does not wish to land; and proceeds to
    the Island of `Diego-Ruys`. Arrival there. Landing and date (34-50)


    # THIRD CHAPTER

    “What names the said Island has, and its latitude and longitude. Our Author settles
    on it with his comrades, and where they erect their huts. The Captain takes away
    two of his men, weighs anchor, and departs. They begin sowing and its results
    (50-57)


    # FOURTH CHAPTER

    Further description of the Island, `Diego-Ruys`, or `Rodrigue`. Its healthy air
    ; mountains, brooks, valleys, valuable trees ; especially of the Palm-tree and
    Latanier, and how wine is tapped from it. The Paretuvier, or Kasta. The Stinkwood.
    The Purslain, etc (57-70)


    # FIFTH CHAPTER

    What quadrupeds are found on the Island `Rodrigue` ; and especially of the Land-Tortoise
    and its nutritious qualities. What food the sea provides, namely the Sea-Turtle;
    the `Lamentin`, or sea-cow, and how to catch it. Extraordinarily great Eels. Oysters.
    Pleasant fishing, and of what kind of fish (70-77)


    # SIXTH CHAPTER

    Of the birds that live on the Island of `Rodrigue`, especially of the `Solitaire`,
    or Lone-one, as well as a few curious facts about it. Of the Bitterns, Pigeons,
    Frigates, Fowls, Straw-Tails, Wood-hens, and several others. Parrots. Bats of
    very great size. Of the Salt, Yellow Amber, and the Ambergris that is found there
    (77-87)


    # SEVENTH CHAPTER

    The Author proceeds to describe the four draw-backs of the Island `Rodrigue`.
    First, the small and great Flies. Secondly, the Rats and Landcrabs. Thirdly, the
    Yearly Hurricane ; and fourthly, the Caterpillars. Further, he speaks of the `Requin`,
    or Sea-hound, and of the `Remora`, or Sea-Lamprey (87-98)


    # EIGHTH CHAPTER

    The occupations of the inhabitants of this new World, intellectual and otherwise.
    Why they did not choose a Preacher and found a Church. In passing he gives a description
    of the `Pavilion` tree. What sort of games they played there. They begin to despair
    and make a vessel, to cross in it over to the island `Mauritius` in case the `Marquis
    du Quesne` should not come to them at the end of two years. How they managed to
    build it (98-108)


    # NINTH CHAPTER

    The inhabitants of `Rodrigue` bring their vessel into the water. They victual
    it, and what with. What they use in place of a Compass. The day of sailing fixed.
    They set sail. Run aground. How they save themselves. Isaac Boyer dies. Epitaph
    in his honour. Our Author objects to sail a second time. His objections over-ruled,
    and how. Takes leave of the said Island and bestows a benediction on it. [End
    of Part I.] (108-137)


    # PART II


    ## TENTH CHAPTER

    They set sail for the second time. Are caught in a severe storm on the eighth
    day. Arrive at `Mauritius`. Repair to the house of the Governor. Find there their
    Ship’s Barber and their companion, `Jan André Guiguer`, who had been taken from
    them. Practical joke of the skipper. `Jan de la Haye` sells his Silversmith’s
    tools and with them, but without being aware of it, a piece of `Ambergris`. How
    they got into trouble about this. The Governor has their little vessel burnt,
    throwing them into prison, confiscates their goods and finally sends them to a
    Rock in the Sea (139-160)


    # ELEVENTH CHAPTER

    The Author and his companions on the Rock. He describes their experiences. He
    falls ill and requests to be taken back ashore, but this is refused. He begs for
    some fresh meat, which is also refused. `La Case` and `Testard` begin to suffer
    from the same illness. A Dutch ship is sighted in the Road. `Bele` and `La Haye`
    go to Mauritius and lodge a complaint with the Officers of the ship. They are
    sent back with fearful threats. The said officers visit them on their Rock, but
    dare not take them off. The `Governor` is married and allows our Author to come
    to Mauritius, on the occasion, but does not grant him an interview. Finally he
    is sent back to the Rock (160-172)


    # TWELFTH CHAPTER

    To raise their fallen spirits our exiles set to making hats. How they won the
    favour of the people through this. The inhabitants of `Mauritius` sometimes, without
    the knowledge of the Governor, send some fresh food to the Rock. They hit upon
    a curious way of catching fish, and where. They catch a Sea-Snake of more than
    sixty pounds and they endanger their lives through this. Description of so-named
    birds `Ferret` and `Pluto`. Our exiles resolve to rig out a boat for the second
    time. What were their materials and how they obtained them. They finish it and
    find it good. Rare foresight of the Author and his companions on seeing certain
    fire on `Mauritius`. Two English Ships come up the North west of `Mauritius`.
    One of the Captains wishes to take off our prisoners because he is short of men,
    but ill weather intervened (172-183)


    # THIRTEENT CHAPTER

    The Author relates the further consequences of the undertaking of `Mr. Testa`,
    and how it failed the first time. He starts a second time by night without saying
    a word, and why. How this attempt resulted. `La Case` follows him in his track,
    gets safely over, gets into the bush : is caught and brought before the Governor.
    The Governor sends for others from the Rock. A Dutch Ship comes to `Mauritius`,
    with orders to bring our Author with his companions to `Batavia`. They present
    a Request to the Ship’s Council[¹](#B15_fm_chapter.xhtml_fn5_2) and why. What
    Diodati made them undergo before they left (183-194)


    # FOURTEH CHAPTER

    Description of the Island `Mauritius`. Its latitude and longitude. Wherefore so
    named. The Fort. What trees are found there. Of `Ananas` and `Bananas`. The `Slronoom`
    and its poison. What suffering our Author once had from it. Remarkable forest.
    Malinity of the Apes. Where they fetch their daily food for the fort, and what
    it consists of. Of the cows, horses. Of the birds and especially of the `Giant-birds`.²](#B15_fm-chapter.xhtml_fn5_3)
    What kind of vermin is found there and what kinds not. Of the storm winds, fair
    weather, etc (195-215)


    # FIFENTH CHAPTER

    Departure from `Mauritius` and arrival at `Batavia`. They are given over as prisoners
    thrown into prison and examined the next day. They are set free, except `La Case`,
    and forced to enlist as Soldiers in the service of the Company. On further news
    coming from `Mauritius`, `La Case` is also set free by the Council. They ask `restitution`
    of their goods, but are put off. Receive orders from the General to depart for
    Holland and there demand justice. `La Haye` dies (215-220)


    # SIXENTH CHAPTER

    Description of `Batavia`; its buildings, canals, streets, the Fort, also the Churches.
    The Suburb. Its canals, gardens, and Houses of `Bamboo`. Where the Ants live.
    The Road of `Batavia`, and its fine prospect. Abundance of rice. Fertility of
    Vineyards. What is the most usual drink. Of the `Betel` and nuts of the `Alexa`.
    Of `Mangas`. Tame and wild Oxen. Chinese pigs. Of the birds, wild beasts and especially
    of the `Crocodile`. Of the Snakes. Remarkable Ape. Curious Lizard (220-236)


    # SEVENTH CHAPTER

    The Author describes the inhabitants of `Batavia` and what nations are represented
    there. Further account of the Government. Magnificence and splendour of the General
    and his wife. Wealth of the Inhabitants, and especially of the `Chinese`. What
    taxes they pay the `Company`. Proverbs or Sentences from the Golden Book of `Hoangti-Xao`,
    one of the lxii best disciples of the wise King `Confucius`. How the `Chinese`
    eat. Their dress. Splendour and ceremony at their weddings. Their Carnival of
    six weeks, and what they do. Water-feast. Burial of their dead. Pagodes or Temples
    and their service. Of the native `Javans` and their deadly weapon. How they run
    `amuk` and the damage they cause. Of the `Javan` women; their amorous ways, dress,
    etc. Errors of `Vertomannus` about the `Smaragd` found by `Tavernier` (236-270)


    # EIGHTH CHAPTER

    Departure from `Batavia`. Learn on the voyage the conclusion of the peace of `Rijswijkse`.
    Their joy thereat. Arrival at the Cape. Expect a storm, which comes to pass. Description
    of the Cape. Robben Island and wherefore so named. The Fort. The village itself.
    The Company’s Gardens. The Governor’s house. The Colony named `Drakesteyn`. Of
    the fields and vineyards. What animals are found there, especially of the `Rhinoceros`.
    Of the birds. Of the oxen. How men trap the lions. Prices of the cows, meat, soap,
    and brandy-wine. Of the Hottentots. They sell all their cattle to the Company
    and at what price. The knowledge they have of medicinal herbs and how they use
    them. Their courtship. The religion of the negroes at the `Cape` (270-298)


    # NINETEENTH OR LAST CHAPTER

    Departare from the `cape`, and arrival at `Sinle Helena`, Description of that
    Island. What freite and trees grow, also what cattle and birds are found there.
    Departure from `Siute Helena`. Ascension Island[¹](#B15_fm-chapter.xhtml_fn5_4)
    and its sitnation. They pass the Line. What dangers they meet and through what
    neglect. Dense mist and what it brought. Arrival at `Vlissingen` (298-304)


    ([1](#B15_fm-chapter.xhtml_Rfn5_1)) “ Ilitland,” in orig.^([1](#B15_fm-chapter.xhtml_Rfn5_2))
    *Selieepxraad.*^([2](#B15_fm-chapter.xhtml_Rfn5_3)) *Revsvofjel.*^([1](#B15_fm-chapter.xhtml_Rfn5_4))
    Hemelvaarts Eyknd.

