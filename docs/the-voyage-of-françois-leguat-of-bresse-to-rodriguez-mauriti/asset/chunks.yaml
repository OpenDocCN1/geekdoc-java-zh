  raw: 'This Project[¹](#C01_chapter_split_001.xhtml_fn8_7) being thus form’d, all
    Hands were set to work to forward the Execution of it; and ’twas done with so
    much Warmth and Expedition, that the Ship was soon ready to put to Sea. Care was
    taken to provide every Thing necessary for such an Enterprise; and the Vessel
    was so little, and so good a Sailer, that she was nam’d the *Swallow.* Her Flag
    had Mons, *du Quesne’s* Arms in it, with this Device, “*Libertas sine Licentia”;*
    which was us’d by that wise Pope Adrian VI.[²](#C01_chapter_split_001.xhtml_fn8_8)
    Our little Frigate was mounted with six Guns, and had ten Seamen, commanded by
    *Anthony Valleau,* of the Isle of *Rhe.* When ’twas ready to sail, several of
    the Passengers, whose Names had been enroil’d for this Service, shrunk back and
    chang’d their Opinion; which was the occasion of the small Number that embark’d;
    for the first Complement that design’d to go in her were five and twenty. The
    Ten who continu’d in their Resolution to the last were:*Paul Be—le*[¹](#C01_chapter_split_001.xhtml_fn8_9)
    twenty Years old, a Merchant’s son of *Metz.**Jacques de la Case,* thirty Years
    old, a Merchant’s Son of *Nerac,* who had been an Officer in the Elector of *Breindenburgh’s*
    Army.*Jean Testard,* a Druggist, twenty-six Years old, a Merchant’s Son of *St.
    Quintin* in *Picardy.**Isaac Boycr,* a Merchant, about twenty-seven Years old,
    Son of an Apothecary near *Nerac.**Jean de la Haye,* a Silversmith of Roan, twenty-three
    Years old.*Jacques Guigner,* twenty Years old, a Merchant’s Son of *Lyons.**Jean
    Pagni*,[²](#C01_chapter_split_001.xhtml_fn8_10) thirty Years old, a Convert and
    Patrician of *Roan.**Robert Anselin,* eighteen Years old, a Miller’s Son of *Picardy.**Pierrot,*
    twelve Years old, of *Roan.*And *Francis Leguat,* Esq., above fifty Years of Age,
    of the Province of Burgundy, who was put over the rest.Tho’ it cou’d not but be
    a very great Trouble to us to see our selves depriv’d of fifteen of our Companions,
    when we least expected it, and look’d on them as Persons destin’d to the same
    Fortune as we were, who perhaps might be a Comfort and Help to us: Yet we cheerfully
    resign’d our selves into the Hands of Providence, and parted from *Amsterdam*
    the 10th of *July* 1690\. The 13th we arriv’d in *Texel* Eoad, where we lay till
    the fourth of *September* following. We then set Sail, in company of 24 Ships,
    *English* and *Dutch,* We bent our Course Northward, by favour of an East South-East
    Wind, which fill’d our Sails to our Hearts content; but the next Night it chopp’d
    about, and became contrary: there rose also a Tempest, which, however, did us
    no more hurt than to make us pay the usual Tribute to the Sea. The 14th the Wind
    shifting to the South-west, our Admiral fir’d a Gun, to make us keep our Way Northward.
    The next Day we spy’d the Isles of *Schetland,* in the height of 29 deg. 42 min.
    The 18th we made those Isles, and our Ship doubled the Cape, but with much difficulty;
    the Man that Mas at the Helm, and had not perceiv’d that our Vessel was carry’d
    away by a rapid Current, was surpriz’d when he saw a flat Rock, which was not
    above a Foot under Water, and but seven or eight Fathom distant from us; he cry’d
    out so terribly, that we were all frightened, and every Man began to strip, in
    hopes of swimming to the Island; but the Water was deep enough at the side of
    the Rock for our poor little Frigat to pass, and we had the good Fortune to escape
    being Ship-wreck’d.Such as have been as far as this End of the World, says an
    ancient Author, as far as the famous *Thule,* have a Eight to Lye with Impunity,
    and to make themselves be believ’d without fear of being reprehended; and certainly
    the Number of those that make use of this Privilege is very great, conformable
    to an old Proverb of ours, *A Beau mentir qui ment de Loin;*—A good Lyer ought
    to come a great way. —As for us, we shall say nothing but exact Truth, no more
    than if we had never been as far as *Thide.*This Island makes us still afraid
    as often as we think of it, and as we were all of us busie endeavouring to preserve
    our selves from this new Danger, one of our Seamen spy’d a *French* Privateer[¹](#C01_chapter_split_001.xhtml_fn8_11)
    bearing down upon us with all the Sail she could make. We went to Prayers, and
    prepar’d to defend our selves; but we were so happy as to escape this Enemy also;
    for after we had doubled the Cape, we found she cou’d not gain upon us; however,
    she pursu’d us six Hours, till Night coming on we lost sight of her, and ran back
    the false Course we had kept to escape him. We were all of us convinc’d by this
    double Deliverance the same Day, that we had been under the singular Protection
    of the Almighty, and we render’d the Thanks that were due to his Divine Favour.The
    22d we took a sort of Curlew by hand, for it came and perch’d upon our Sails:
    abundance of Purs [*“Allouettes de Mer”*] follow’d us, flying about our Ship.The
    28th an innumerable Army of Porpuses past by us; at which Sight we were very well
    pleas’d; they seem’d to us to march really along in order of Battel, and they
    leap’d up and down by turns, still keeping their Ranks; they approach’d so near
    to us that we struck one; we darted at him with a Trident, fasten’d at the End
    of a Rope: when they are wounded they grow weak, through loss of Blood, and then
    may be easily taken up: The blood of these Animals is hot; they bear their Young
    in their Bellies like Whales, Laman-tines, and some other Fish; the inside of
    their Body is very like that of a Hog, but the Flesh is Oily and has an ill taste.The
    6th of *October* we spy’d a Squadron of 13 great Dutch Men of War, of which one
    gave us chase; for, not knowing what she was, we made the best of our way from
    her; when she came up to us, she hung out her Colours; we did the same, and then
    we both continu’d our several Courses.The 22d we discover’d the *Canary Islands*[¹](#C01_chapter_split_001.xhtml_fn8_12)
    by Moonlight, and fell in with the Trade-Winds, which never left us; or, rather,
    which we never left till we came in the 9th Degree. By our Account we were 50
    Leagues to the Wind-ward of *Palma,* between *Forieccntura* and the *Grand Canaries.*“We
    coasted along the Island *Forteventura,* with a Larboard Tack, a whole Bay, and
    in the Evening, about Sun-set we perceiv’d the *Grand Canaries;* we past by it
    in the Night without meeting with any Ship, tho’ commonly they are to be met with
    thereabouts, especially *Turks;* they post themselves there to lie in wait for
    the Ships that come out loaden with Wines, in hopes of picking up some of them.The
    28th we were in the height of 24 deg. 29 min. and saw a vast Number of flying
    Fish about us. I observed one of them very exactly; ’twas about 10 Inches long;
    there are few larger, and abundance shorter: Its Back-was of a Ilusset-brown Colour,
    speckled with blue Spots, inclining to a greenish, with a little black amongst
    it. Its naked Belly was black, and blue, and its Sides covered with little Scales
    of dark red. Its long Wings or Fins were brown, with Sea-green Spots upon them.
    The young Ones are of a light grey, and their Tail the same. Its Eye is great
    and rais’d; the Sight of it large and blue, the rest black. The Prickles upon
    the Head of it are of a greyish Colour, and like a sort of very rough Chagreen.Our
    Books represent this Fish[¹](#C01_chapter_split_001.xhtml_fn8_13) after another
    manner; and I doubt not but there are some of them of different sorts of Figures;
    for Nature varies in every thing. The *Irish* Horses are not of a like make with
    those of *Friseland,* nor *Kentish* Cows like *Middlesex,* tho’ those two Counties
    are contiguous; much less are they like those of *Iseland,* which have no Horns.
    And, without going out of our own Species, one Man is a *Negro,* another a *Dutch*
    Man, and another a *Chinese.*To return to our Fish. A certain Naturalist calls
    that which is mark’d A, a Sea-Swallow, and attributes a great many Properties
    to it, which I shall not repeat. That which I have mark’d B, is called a Mullet,
    in *Sanson Mathurin’s*[¹](#C01_chapter_split_001.xhtml_fn8_14) Journal; he was
    a famous Pilot in the *Mediterranean,* and us’d to see them in the *Gulph of Lyons*
    and elsewhere. The 3rd, mark’d C, was taken from the K. of *Denmark’s* Cabinet,
    where I have some reason to believe ’tis not exactly design’d: For when these
    Animals grow dry, ’tis a hard matter to observe their true Form. There are some
    of them that have four Wings. Those we eat tasted something like a H erring.These
    poor little Creatures, that may be taken for an Emblem of perpetual Fear, are
    continually flying and rising to save themselves; they are very often caught in
    the Ship’s Sails: they fly as long as there remains any Moisture in their Wings;
    which, as soon as they are dry, turn to Fins again; and they are forc’d to take
    again to the water, or else, their Fright is always so great, they would fly to
    the End of the World.The Efforts they make to become rather Inhabitants of the
    Air than of the Water, is to avoid the Persecution of the Goldfish and the Bonita’s,
    who are at eternal War with them. But these wretched Animals fly from one Peril,
    and are immediately overtaken by another; for the cruel Birds are their irreconcilable
    Enemies, and always on the watch in great Flocks to devour them, as soon as they
    enter the new Element, where they thought they shou’d find an Asylum from their
    Foes of the Sea. The Porpoises make the same War upon the Goldfish, as the latter
    do on the Flying Fish: and all this gives us a true Image of human Life; which
    is nothing but continual Bangers, and in which the Weak commonly fall a Victim
    to the Strong.Our Ship wanting Balast, we put into the Island of *Salt,* one of
    the Isles of *Cape Verd*,[¹](#C01_chapter_split_001.xhtml_fn8_15) which we discover’d
    the 29th of *October,* and arriv’d the next Day in the Road, where we cast Anchor
    in a Creek to the Southward of the Island, in eight Fathom Water. A great Number
    of Sea-Birds came to visit our Vessel, and perching on our Yards, let us take
    them by hand: we eat some of them, but we did not like them. We caught Fools,
    Frigates, Longtails, and other Birds. Perhaps I shall have room to speak of these
    Animals hereafter. We had a Swallow ever since we came from the *Canaries,* which
    we let go every Morning, and it return’d to us at Night; ’twas kill’d here by
    an Accident.The 31st we went ashoar, early in the Morning, with our Arms and Dogs
    to hunt; we found presently a prodigious Quantity of Goats; we cou’d easily see
    them, tho’ at a great distance, for the Island is extreamly dry, without Tree
    or Bush, producing nothing but a sort of short Grass, at least in the greatest
    part of what we saw: we kill’d some of them, and left ’em on a Bank, to take them
    with us when we came back, for we went farther into the Island, and search’d about
    two or three Hours for fresh Water, but all that we met with was brackish; by
    which means we were almost dead with Thirst. The Sun shines very hot in this Isle,
    and there being no Shade, the Heat was very troublesome to us; we therefore return’d
    to our Goats, and thence to the Seaside, where we arriv’d about Sun-set. When
    we came back we found there a very handsome Horse, of a reddish bay Colour, his
    Main and Tail trailing on the ground; ’twas fierce, and never had any Horse a
    better Shape, nor a more magnificent Chest: he ran away immediately, and let us
    see that his Heels were good. I know not what Name to give to another Animal which
    we also saw, but were not so near it; I believe ’twas a sort of Cat, but one of
    our Company would have it to be a Fox: And 1 am mistaken, if he is more happy
    in his Conjecture than the Translators of the *Psalms*[¹](#C01_chapter_split_001.xhtml_fn8_16)
    into *French,* when they make *David* say. His *Enemies should le a Prey to Foxes.*
    We found most of our Companions ashoar catching Turtles, we went along with them
    up into another part of the Country and digg’d, in hopes of meeting with fresh
    Water, but all our Labour was in vain, Night came upon us, and we slept on the
    Sand, it being a Star-light Night. Nor were we less weaken’d by Hunger and Thirst,
    than tir’d with Hunting. As we lay all of us in a sound sleep, we were on a sudden
    waken’d by the braying Musick of a Rustick Regiment of Asses, of which we cou’d
    not rid our selves, but by braying as they did, and firing twice or thrice a Fuzee
    at them; but they had scarce turn’d their Backs upon us, when another Troop of
    the same Beasts entertain’d us with the same Song: They were accompany’d by above
    five hundred Goats, which surrounding us, we cou’d sleep no longer: At last these
    Animals retir’d, and we imagin’d if we follow’d them, they might perhaps lead
    us to some hidden Spring. As we believ’d, it happen’d, part of them descended
    into a little Pit, where there was Water, which they drank: We rejoyc’d all of
    us, as if we had found a Treasure; but this Water was also salt. These Beasts
    having been forc’d to drink of it from their Births, ’tis now become customary
    to them.Day broke, and Hunger still pressing us, we had a mind to roast a Leg
    of a Goat, I dare not say of a Kid, ’tis too honourable a Term for it, and I am
    sorry that ever I should call these Beasts Goats. For want of Wood, we heap’d
    Asses and Horse Dung together, made a Piramid of it, like one of *Dutch* turfs,
    hung Pieces of Flesh on Strings, and turning ’em round by a good Fire, our Meat
    was soon ready. But, alas, such Meat, such a Taste, such a Smell, that I can scarce
    forbear vomiting when I think of it. There’s no Sawce like a good Stomach. Every
    Man’s teeth went to work, we tore it to pieces, chaw’d it as well as we cou’d,
    and down it went without Water. ’Tis probable the Reader will say here, we were
    in the wrong to amuse ourselves in this Rascally Island, whereas we might have
    gone aboard and have eat and drank our fill: He must therefore know, That the
    Seamen who had set us ashoar, were return’d with their Long-boat to the Ship,
    and, whether we wou’d or not, we were oblig’d to stay till they came for us: They
    cou’d not think that we far’d so ill; they saw us making good Cheer by a- good
    Fire, afar off, and did not doubt we were very well at our ease. At last they
    brought the Boat for us about Noon, and we returned to our *Swallow.*The Isle
    of *Salt* is not eight Leagues about, ’tis so call’d, because Ships go thither
    to load Salt, which is there excellent in its kind, and in abundance, lying in
    the crevises of the Rocks, on the *South* Coast of the Island. ’Tis made without
    Art by the Sea and the Sun. Here also Sailors come to turn the Turtle, a Term
    us’d by them for killing it, because they turn the Turtle on its Back when they
    catch it; all the Shoar is cover’d with these Animals, especially in the Season,
    when they lay their Eggs. We turn’d some of these stupid and slow Creatures, and
    amongst the rest, two which, according to the guess of the Skillful, weigh’d 500
    Pound each. We Carry’d all that was good of them aboard with us.There is nothing
    more to he said of the Isle of *Salt* “We found some *Cow-dung* there, but could
    see no *Cotos;* and all the Birds we met with were Sparrows, they are like ours
    except in their size, for they are not half so big.We must not forget the fine
    Shells that are spread over all the Coast, the variety of them is Charming, and
    I never saw any in any other Place so beautiful as here; they are certainly the
    work of an excellent Workman. The shineing of the Enameling, the mixture and diversity
    of the Colours, the Form, the Delicacy, the Symmetry, every thing Charms, and
    raises in us a just Admiration of the Great Creator. I was bound for the *Indies,*
    the *Antipodes,* I did not know whether; for Desert Islands from whence I thought
    I should never return: And my Head being full of such Thoughts, I could not amuse
    my self to gather Shells; but had I touch’d at this Island when I came back, I
    should certainly have furnish’d my self plentifully with them.I must own, now
    it comes into my Mind, I was sorry that as I walkt about the Island, I could not
    meet with any of those great and beautiful Birds call’d *Flamans,* from *Flam-boyans*
    (Flaminir), which by relation of Voyagers, are the most considerable of the. Place.
    ’Twas not only a simple desire to see these Birds; the greatest Pleasure I propos’d
    to my self by it, was to compare the different draughts I had of them with the
    Original; For all that have describ’d them, except Mr. *Willougliby,* at least
    all the Authors (and they are not a few in number), which I have seen who have
    spoke of them, make the beak of these Birds like a Spatula or a Spoon, whereas
    Mr. *Willougliby* designs them with a sharp Beak.This curious Naturalist adds,
    that he believes these Birds had the name of *Flamantes*[¹](#C01_chapter_split_001.xhtml_fn8_17)
    given them, rather on account of some of their Feathers, whose colour is like
    that of flaming Fire, than because they were originally of *Flanders.* And certainly
    our learned Author is in the Right; for ’tis most sure that such *Flemings* as
    these are as great Strangers in *Flanders,* as in *England.*The 6*th of Novemh.*
    we weigh’d Anchor, the Wind being fair, and sail’d towards the Isle of *Martin-
    Vas,* according to our Orders.The 7*th* the Wind continuing still fair, we saw
    and doubled the Island *Bonavist,* which is as bad as the Isle of *Salt;* ’tis
    longer and more Mountainous. We could see no more Trees on this Island than we
    had done on the other.The 11*th* we the first time made tryal of one of those
    short but troublesom Tempests, which the Seamen call Gusts,[¹](#C01_chapter_split_001.xhtml_fn8_18)
    and we had ’em from time to time afterwards till we crost the *Line.* These are
    a sort of violent Whirlwinds mingled with Rain, which rises at once, but do’s
    not commonly last above a quarter of an Hour. We always prepare to receive them;
    for we can spy the Gusts afar off: we immediately furl our Top-sails, which otherwise
    wou’d be carry’d away, and the Masts broken.When the Wind is too strong we lower
    all our Sails, or carry as little as we can. While this Tempest lasts, the Sea
    is in an extream agitation, and seems to be all on Fire. These Gusts often happen
    several times in the same Day, during which the Ships Crew is ev’ry Man hard put
    to it; a Calm commonly succeeds in a very little while after the Storm. We also
    escap’d several watry Dragons,[¹](#C01_chapter_split_001.xhtml_fn8_19) and on
    the 12*th* the Wind ceas’d in the height of 7 Deg. 15 Min.At Night we caught a
    Bird something like a Woodcock, which flew about our Ship all day long; The Mariners
    kill’d her not so much for the pleasure of eating her, tho’ that was worth their
    while, as to revenge her driving away four Swallows which had follow’d us some
    time, and every Morning and Night entertain’d us with Musick the more agreeable,
    because it puts us in mind of the dear Land, which is so well belov’d by all Men
    that are sailing in the middle of the vast Ocean.The 13*th* an hour after Day-light
    we met with a furious Gust, which brought our Main-top-mast by the Board, having
    broke the Iron Hoop that bound it. I observe this only because all our Crew were
    very much amaz’d at it.The 14*th* we saw a prodigious number of Gold-fish and
    Bonitas, of which I have spoken. These Fish being well enough known, I did not
    describe them; but since I have occasion to speak of ’em again, I have a great
    mind to tell what sort of Fish those were that I saw.The Gold-fish[²](#C01_chapter_split_001.xhtml_fn8_20)
    of *America,* of which Mr. *de Rochefort*[¹](#C01_chapter_split_001.xhtml_fn8_21)
    writes, have sharp Heads, I know nothing of such Goldfish as these; those that
    I saw had a round flatish Snout, that gives them a certain Physiognomy, in which
    I did not take much delight. Neither do I believe that any Body values this Fish
    for the beauty of its shape, but that of its Colours are admirable: There are
    two sorts of Gold-fish, that which I have giv’n the Figure of, is enammel’d on
    its Back, with speckles of a blewish Green on a black Ground: Its Belly is of
    a bright Silver Colour, its Tail and Fins as if gilded with fine Gold; Nothing
    can be more bright and shining when ’tis in its Element, or before it begins to
    Mortifie, which it does presently when ’tis out of it: ’Tis four or five foot
    long, and not thicker than a Salmon.[²](#C01_chapter_split_001.xhtml_fn8_22) *Rondelet*
    calls it the Sea-Bream, our Mariners told me, that the other Species of the Gold-fish
    differs from this only in that its Jaw sticks out a little more, and that its
    Speckles are a beautiful Azure on a Golden Ground. The flesh of this Fish is firm,
    and tasts very well.The Bonita is generally three or four Foot long, very thick
    and Fleshy, its Back is cover’d with a little Scale, so thin, that one can scarce
    perceive it; ’tis of a Slate colour, and a little upon the Green in some Places.
    Its Belly is of a grey Pearl colour, and turns brown near the Back; four streaks
    of a yellowish colour begin at the side of its Head, run along the Body almost
    at a Parallel distance, and join at the Tail, which is not unlike that of a Makarel.
    Its Eye is large and lively, resembling a Jet-stone set in a Silver Bing. I have
    design’d the Shape of its Body, and the Disposition of its Fins. Near the Tail
    of it, there are six little things like square Fins on the Back of it not an inch
    High, and over against them under its Belly there are seven.As I was writing this,
    a Friend of mine, who is always admiring the Divine Wonders of Nature, and very
    nicely considers them; told me that he had measured and design’d a Bonita which
    was taken in the year 1702 near *Rye,* on the *Kentish* Shoar, and which differ’d
    in several things from that I have been speaking of. The Reader will, I doubt
    not, be pleas’d to see the Billet which my Friend wrote me on this Subject, when
    he sent me the draught of this Bonita.“The Fish which in the *Indian* Sea is call’d
    Bonita, is known on the Coasts of *France,* and particularly between the *Loire*
    and the *Garonne,* by the name of *Germon.* It very rarely enters the Channel,
    which I note *en passant* is quite contrary to the Makarel; for the Coasts of
    *Normandy,* especially the *Bessin*[¹](#C01_chapter_split_001.xhtml_fn8_23) and
    *Costentin* are full of them; whereas they are never, or very rarely, seen about
    *Rochelle. The Germon* or Bonita of our Seas, is certainly a Fish of the same
    Species with the Bonitas you saw in your Voyages, but the Species varies a little,
    a thing that may be observ’d in all sorts of Animals, as soon as we change the
    Country, as you have your self taken notice. The last Bonita which I saw, and
    which was taken near *Rye* in the beginning of *June* 1702 was just three Foot
    long, and its Body proportionably greater than that which you design’d in the
    Figure you shew’d me; for thrice the breadth of it where ’twas broadest, made
    compleatly its length. I send you an exact draught of it. At the first view one
    would think that this Fish did not open its Month very wide, but there’s a secret
    help for that, and it opens it as far as the place mark’d *a*. Its Teeth above
    and below are so little, so short, and so weak, that one wou’d think they were
    only made for Scratching: Its Tongue is broad, blackish, and hard at the Boot,
    but soft and a little reddish at the Tip. Its Eye is a good Inch Diameter: The
    Sight like very white and transparent Chrystal, and the Circle that surrounds
    it, is more Brilliant than pollish’d Gold.“The colour of this Fish is the same
    with that of which you have giv’n us a Description, tho’ it has no Scales on its
    Back, it has nothing but a smooth Skin on its Back and Belly, and on its Side
    between the Tail and the Fins near the Gills, there’s a scaly List two Inches
    broad, the Scales so little and so fine, that they are scarce perceptible: Its
    two Fins, if I may call them so, which are mark’d B, are bony and immoveable.
    In the narrowest part of its Tail, there’s a knot on each side, out of which grows
    a little hairy Tuft that is not above an Inch and a half long.“Whereas your Fish
    has but six of those little Fins which you have represented in your Draught, to
    be upon the Back toward the Tail, and seven under it; this has nine above and
    eight below, *c.c,* Shews where the Gills are which open one another very easily.
    And *d.d.,* is like a great Scale, which cannot be but very little lifted up all
    about it.’The Trade-winds[¹](#C01_chapter_split_001.xhtml_fn8_24) having left
    us in the 9*th* Degree, we had nothing after that but Gusts and Calms till we
    came to the Line, no sooner was one gone, but another came. The Heat was not excessive,
    we cou’d very well bear our Night-gowns all Night long.We crost the Line the 23d
    of *November,* and were oblig’d to undergoe the impertinent Ceremony of *Baptism,*
    at least all those who had not assisted at the same Festival before, or would
    not buy themselves off for a piece of Money.’Tis an ancient Custom, and will not
    be abolish’d without difficulty; ’tis also sometimes done when we rjass the Tro-picks.
    I shall in a few words report how this fine Ceremony was perform’d in our Vessel.
    One of the Seamen who had past the Line before, drest himself in Rags, with a
    beard and Hair of Hards of Hemp, and black’d his face with Soot and Oil mix’d
    together. Thus Equip’d, holding a Sea-Chart in one Hand, and a Cutlass in the
    other, with a Pot full of blacking Stuff standing by him, he presented himself
    upon Deck attended by his Suffragans, drest as whimsically as himself, and arm’d
    with Grid-Irons, Stoves, Kettles, and little Bells; with which rare Instruments
    they made a sort of Musick, the goodness of which may be easily imagin’d.They
    call’d those that were to be initiated into these Rites and Mysteries one after
    another, and having made them sit down on the edge of a Tub full of Water, they
    oblig’d them to put one Hand on the. Chart, and promise that on the like Occasion
    they wou’d do to others what was at that time done to them. Then they gave them
    a mark in the Forehead with the stuff out of the Pot, wetted their faces with
    Sea-water, and askt them if they wou’d give the Crew any thing to drink, promising
    them they wou’d in such case let them go without doing any further Pennance. Those
    that gave were presently discharg’d, and some avoided this unpleasant *Pras-ludium*
    to what was to follow, by giving ’em something Extraordinary: It cost me but a
    Crown to have the same Privilege with the Latter. As for those who. paid nothing
    they were thrown into the Tub of Water over Head and Ears, and then wash’d and
    scrub’d every where with the Ships Ballast; and I believe this scrubbing and washing
    lasted much longer than those who were so treated desir’d.Our Frigat and Boat
    having never past the Line, they were subjected to the same Law. The Captain was
    oblig’d to give something to save the Beakhead of his Ship, the Seamen alledging,
    ’twas their Eight to cut off the Boats Nose else. The Money the Men got by it,
    was laid up to be spent on the whole Crew when opportunity offer’d. Every Nation
    practices this ridiculous Custom after a different Manner.We kept on a straight
    course towards the Isles of *Martin Vas*[¹](#C01_chapter_split_001.xhtml_fn8_25)
    which are in 20 Degrees *South* Latitude, and we bad the Captain put in there,
    that we might go a-shoar and visit them according to our Orders. He having no
    design to touch there, reply’d, That the Eound-top of our Fore-Mast was half broken,
    and we should have a great deal of trouble to make those Islands, because we must
    go near the Wind, and tack all the Way: He therefore chang’d his Course, notwithstanding
    all our Entreaties to the contrary, and the Contempt we shew’d for his false and
    trivial Reasons. Thus we made the Cape of the Island of *Tristan d’Acugna,* which
    is in 37 Deg. of *South* Latitude.The 10*th* of *December* we past the Tropick
    of Capricorn, and enter’d the *Southern* Temperate *Zone.*The 13*th* we were visited
    by several Birds, there were abundance of those which are call’d Great Gullets,
    and which rather should have the name of great Craws,[²](#C01_chapter_split_001.xhtml_fn8_26)
    on account of their great hanging Breasts. They are almost as big as a Goose,
    are very tall, but neither handsom nor good to eat; their Flesh being tough, and
    having a strange Tast. Their Heads are big, their Beaks long and sharp, their
    Bodies white, their Wings brown or russet, their Neck sometimes short, sometimes
    long, according as they please, either to stretch it out or shrink it up. ’Tis
    a melancholy Bird that passes whole days on the brink of a Bock, hanging its Head
    over into the Sea, like a Fisherman with a Line to catch little Fish. Though the
    figure of this Creature was not at first sight very pleasing to us, they were
    however very welcome, because we were weary of seeing nothing but Water, and the
    least new Objects diverted us. Like their Highnesses in those little out-of-the-way
    Courts where no Company comes to interrupt their Solitude; or like the Nuns who
    are so greedy of Society in their Solitary Convents.The 17*th* we heard the Seamen
    cry a Whale,[¹](#C01_chapter_split_001.xhtml_fn8_27) another Marine Pleasure;
    every Body rose immediately to pay our Compliment to the Eminency of a great black-Back,
    which swam up and down slowly about our ship.A Moment after we saw fifteen or
    twenty more, which put me in mind of what Mr. *de Godeau*[²](#C01_chapter_split_001.xhtml_fn8_28)
    says elegantly in his Poems:—“Thou, for the Beauty of the Universe,With Monsters
    various in their FormsHast Peopled all the Liquid Plains;And wil’st that all within-the
    spatious Deep,To the huge Whales shou’d Homage payWho look like floating Rocks
    upon the Sea.”[¹](#C01_chapter_split_001.xhtml_fn8_29)Indeed such as have no more
    Experience of the Sea than honest *Aloysio Gadamusto*[²](#C01_chapter_split_001.xhtml_fn8_30)
    had, and all his Ships Crew imagine, that these huge Beasts seek after to devour
    them. This celebrated *Voyager* in the I Chapter of the *History* of his *Navigation*
    tells us, they were all very much afraid of a terrible Monster, whose Eins were
    like the Sails of a Windmill, which came down upon them, but they escap’d that
    Danger, by clapping all their Sails to, and flying faster than the Monster could
    pursue them. As for us, we were so far from being afraid, that we were extreamly
    delighted to see those Colosses play in the Waves with as much agility, as a Bird
    flies in the Air. One of these Whales[³](#C01_chapter_split_001.xhtml_fn8_31)
    was much bigger than any of the rest, and lookt like a little Isle with a little
    Mountain in it, on the surface of the smooth Ocean.I question whether that prodigious
    half of a Jaw which is thought worthy to be fasten’d to the Wall of the Pallace
    of *St. James’s* in *London,* belong’d to an Animal of a more Monstrous size.[¹](#C01_chapter_split_001.xhtml_fn8_32)
    Our Seamen who had *Patricius Vartomanni’s* Relation,[²](#C01_chapter_split_001.xhtml_fn8_33)
    cou’d not help laughing when they read what that famous Author writes of Whales
    that piss’d, as high as the Clouds.But if they had read *Pliny* and *Solinus,*
    venerable for their Antiquity, with their Whales 960 Foot long, their inclination
    to Laugh, had been chang’d into a mortal Fright, for fear of being all swallow’d,
    Ship, Anchors, Sails, Masts, Men, and Goods: For tho’ those that are commonly
    call’d *Naturalists,* have for a long time us’d themselves to affirm, that *Jonas*
    cou’d not be swallow’d by a Whale, because the Throat of these Animals is so straight,
    that hardly a Pilcher can go down it; yet every Body do’s not believe what they
    say, as a matter beyond all Dispute. There are few Men who have themselves Dissected
    Whales, and have seen with their own Eyes what sort of Throats they have; besides,
    we must consider there are several different kinds of these Marine Monsters. And
    as I cannot refuse believing P. *Geoige Fournier*,[³](#C01_chapter_split_001.xhtml_fn8_34)
    a very curious Man, and very knowing in every thing which belongs to the Sea,
    who assures us in his *Hydrography,* that two Men were found in the Belly of a
    Whale that was thrown a-shoar at *Valentía,* on the Coast of *Spain,* a Jaw of
    which is preserv’d in the Escurial, so I am satisfied a Whale of the size *Solinus*
    speaks of, wou’d have swallow’d us up as easily, as they do Sack and Loaches in
    *England*. *Signior Cadamusto* says that his *Leviathan* was bigger than the Whale,
    but the Dispute concerning the *Whale* and the *Leviathan,* is about a word only;
    for the Animal that in all Languages is call’d a Whale, is the biggest of all
    Fish, and even of all Animals. And from thence Mr. *Bochart*[¹](#C01_chapter_split_001.xhtml_fn8_35)
    writes (*Phal.* Vol. II. Book I. Chap. I.) that the word *Baleine* or Whale is
    a Syriaque word, which signifies Lord of Fishes.I cou’d willingly say one word
    more on this Article, to confute the Error of those who imagine the Whale-bone
    which Women use in their Stays and Gowns, is taken out of the Tail and Fins of
    this Fish; for what I say, I know very well, and that is, the Whale-bone we speak
    of is never found any where but in the Mouth of several kinds of these Animals
    which have no Teeth: Enough of this, ’tis time to keep on our way, and that I
    may not be accus’d here of loving Digressions, I shall say nothing of the Battel
    between the Sword-fish and the Whale, which our Mariners told us of, tho’ it cou’d
    not properly be call’d a Digression, and the thing is curious enough, much more
    so than the fighting of Cocks, or that of Dogs and Bears, in which whole Nations
    take delight.The *21st* we again met with abundance of Whales, and there was one
    which I believe scratch’d her self against our Ship,[²](#C01_chapter_split_001.xhtml_fn8_36)
    but so rudely, that she was flead with it; she found some Fracture which rub’d
    off the Skin, for when she was at a Distance from us, we perceiv’d she was all
    bloody, and her scratching had giv’n our Vessel a little *shake.*Arriving in the
    height of the Isle *Tristan* we sail’d *Eastward* to endeavour to gain it, hut
    we cou’d not succeed because of the Fogs and hazy Weather, which we had for five
    or six days; we lay by all that while, that we might not go beyond it, nor come
    too near it. The Weather not clearing up, we were afraid of losing our time there,
    and resolv’d to take hold of the opportunity of a fair Wind which then presented,
    and might bring us in a few days to the *Gape of Good Hope;* But we had not kept
    on our Course thither six Hours, before the Wind shifted again, and was in our
    Teeth, which oblig’d the Captain to tell us, he must make a new effort to put
    into the Isle of *Tristan*.[¹](#C01_chapter_split_001.xhtml_fn8_37) His pretended
    design succeeded in some sort, we saw that Island *Thursday* the *‘27th* of *December,*
    about six in the Morning, and coasted it from the *North,* to the *South* and
    by *East,* but we cou’d find no place to cast Anchor, we were always Sounding,
    but never reach’d the Bottom.We perceiv’d plainly enough that the Captain’s Chart
    was false, because there was a Bay mark’d to be in that part which we saw, where
    there certainly was none at all; and having no intention that we should land there,
    he wou’d have perswaded us the Isle was inaccessible: But we were sure Ships had
    formerly anchor’d there, and were confirm’d in that Opinion by a good Chart of
    the Sieur *Testard’s,* where a Bay was mark’d in another place to the *Westward,*
    and it represented the Coasts that were before us, to be, as indeed they were,
    very high and steep.We observ’d a little Island *to the Southward,* but we did
    not come near it. That Coast of the Isle of *Tristan* which we saw, was about
    two Leagues long; it seem’d to be extreamly agreeable, tho’ very steep, as I have
    said; and tho’ we had Mists from time to time, which depriv’d us in part of the
    sight of it, and sometimes hid it all entirely from us, yet we could see the Hills
    from the top to the bottom, were adorn’d with the most beautiful verdure in the
    World, and we saw the Sun with Pleasure thro’ tall and straight Trees, with which
    the tops of the Mountains were covei’d, Birds were every where flying about, the
    running Waters flow’d abundantly in several places, from Bason to Bason; making
    admirable Cascades; and from the foot of the Hills, to which they rapidly rowl’d,
    they fell precipitately, into the Sea. All the different Beauties of this charming
    Prospect, made us more desirous to have a nearer view of it, and refresh our selves
    in so delicious a Place; but we desir’d it in vain.The Sea was almost cover’d
    with Whales and Sea-Wolfs, which swam to the very Shoar of the Isle playing with
    the Water, and some of them ran against our Frigat; about which flew a great number
    of Sea-fowl of several kinds, some as big as our Geese, others no bigger than
    Ducks. The sight of them fill’d us with new Joy, as did every thing that brought
    the much desir’d Land to our Remembrance: ’Twas to no purpose for us to flatter
    our selves with hopes of Landing on the lovely Isle that lay before us, and perhaps
    we might have stay’d there too long if we had. There was the greater likelihood
    of it, inasmuch as our Healths were very much impair’d, the most Vigorous finding
    his Strength extreamly decay’d, but we cou’d discover neither Bay nor Port, our
    Captain not having done all that was in his Power to search after one: We durst
    not stay near the Shoar in the Night-time; besides, we were too much expos’d to
    violent gusts of Wind which blew off Land from between the Mountains, so we pursu’d
    our Voyage towards the Cape.In the Night the Wind rose so high, that all our Hands
    found business enough to employ them. The Waves flew up to the top of our Masts,
    and there fell so much Water upon Deck, that our young Lad had been drown’d if
    he had not been very nimbly assisted.On *New-Years-Day,* 1691, we were entertain’d
    with the sight of a Sea-Cow, of a russet Colour; sometimes her whole Head, and
    sometimes above half her Body appear’d above Water; she was thick and round, and
    seem’d to be more bulky than the bigest of our Cows.[¹](#C01_chapter_split_001.xhtml_fn8_38)
    Her Eye was large, her Teeth or Tusks long, and her Muzzle swell’d out a little:
    One of our Mariners assur’d us, this Animal had Feet the same as you see in this
    Figure.The 11*th* and 12*th* we saw abundance of Birds as big as Partridges, and
    very near of the same Colour, which our Ships Crew call’d by the Name of *Grissards*[²](#C01_chapter_split_001.xhtml_fn8_39)
    or grey Birds: There were several other sorts, and all of them different from
    those of our Continent. You may imagine these new Objects were not disagreeable
    to us; but what pleas’d us most was, that they were a certain sign of our being
    near Land.The 13*th* in the Evening we saw and knew the Cape of *Good Hope,* but
    lost sight of it again in a great Fog, which rose on a sudden, and oblig’d us
    to keep to Sea all that Night.The next day we drew near and saw the Isle *Rollen*,[¹](#C01_chapter_split_001.xhtml_fn8_40)
    which is at the entrance of the Port. This little Island is flat, and has no Dwellings
    upon it but some Hutts where the *Lime-lurners* live, when they are sent thither
    to make it.All of us had a long while earnestly desir’d to arrive at the *Cape,*
    for we all wanted Refreshment extreamly, being almost eaten up with the Scurvy,
    and the Grapes beginning to ripen, the Season, was very favourable to us. After
    having Coasted along the Cape two days, sometimes with a Larboard, and sometimes
    with a Starboard Tack, because of the contrary Wind and Current, we at last enter’d
    the Bay the 26*th* of *January* 1691 and cast Anchor about four in the Afternoon.Tho’
    this seems to be an admirable Bay, its vast Bason being enclos’d on one side by
    a ridge of Mountains, and on the other by a long tract of Earth, which seems instead
    of a Mole for it. ’Tis however very often dangerous to ride in, the reason of
    which is, partly for that one of those Mountains which ought always to he a shelter
    to it, is sometimes, and even frequently a fatal Source of those impetuous Gusts,
    that presently put all the Ships into a terrible Disorder; besides, the Sea-winds
    are very furious, they blow with a frightful force, and the Anchorage not being
    very good, Ships are in great danger of running a-shoar, or oversetting, and no
    Boats are then suffer’d to come off to them. This bad Mountain is near the Point
    of the Cape, and call’d the *Devil’s Mountain,* on account of the mischief it
    do’s. ’Twas in the year 1493 that *Bartholomew Diaz*[¹](#C01_chapter_split_001.xhtml_fn8_41)
    was sent by *John* II, King of *Portugal* to discover this Cape; but he says,
    the dreadful Winds that always blow there, hinder’d him from Landing, and for
    that Reason he gave the Place the Name of *Tormentado,* the Tempestuous. The story
    adds, the King reply’d they shou’d not be so soon discourag’d, and that he wou’d
    himself give that Land the Name of the Cape of *Good Hope*.[²](#C01_chapter_split_001.xhtml_fn8_42)There
    are two other Mountains near the *Devil’s*, one call’d the *Lyon’s Mountain;*
    for that when we see it from the Bay, some Men fansie it looks like a Lyon Couchant.
    On the top of it there’s always a Guard, and ten pieces of Canon : And when any
    Ships are discover’d at Sea, notice of it is giv’n to the Port.The other Mountain
    is call’d the *Table Mountain*, and with good reason : for its Summit being cut
    off Horizontally, it naturally enough represents the figure of a Table. There’s
    a little Lake or Pond at the top of it, which supplies part of the cultivated
    Lands in the bottom with Water: We had several *Charts*, and took several views
    of the Bay, but this[¹](#C01_chapter_split_001.xhtml_fn8_43) seem’d to us to be
    the best.We found four Ships there, two *Dutch* (the *Black Lion* and the *Mountain
    of China*), one *English*, and one *Danish*. Our Guns being still in the *Hold*,
    we cou’d not Salute them at first according to Custom. ’Twas the next day before
    they were ready, and when fir’d, it had been better we had let it alone, unless
    we cou’d have come off more luckily ; though, as it happened, ’twas well it was
    no worse ; for one of our Guns which was loaden with Ball ever since we came from
    the *Texel*, and had not been discharg’d, was forgotten to be loaden, and being
    fir’d struck the Wall of the Fort, after having past through the middle of thirty
    Persons, and brush’d a little the Beard of the Serjeant, who return’d us our Bullet.
    “We were chid for our Negligence, and that was all. I remember to have read in
    *Zambard’s[¹](#C01_chapter_split_001.xhtml_fn8_44)* Description of the County
    of *Kent* in *England*, a like violent Salutation of a Bullet which was shot thro’
    the Palace of *Greenwich*, and whistl’d in the First Queen *Mary’s* Ears. Kings
    don’t love such sort of Honours, and our Serjeant was of the same mind with Kings.The
    next day we went to deliver our Letters to the Governour,[²](#C01_chapter_split_001.xhtml_fn8_45)
    who check’d us for the Blunder we had made in entring the Port, and indeed we
    deserv’d it. However, he receiv’d us very civilly out of respect to the Treaty[³](#C01_chapter_split_001.xhtml_fn8_46)
    Monsieur *du Quesne* had made with *Messieurs* the Directors of the *East-India*
    Company, from whom we also brought Letters of Recommendation.. “We afterwards
    made the necessary Inquiries for the prosecution of our Voyage, particularly if
    the *French* had again taken possession of the Island of *Mascaregne*, and if
    there was any news of their Squadron at the *Cape ?* But we cou’d meet with no
    certain account of either the one or the other.Some told us, the Squadron of Seven
    Men of War had put three hundred Men a-shoar there, in their way to the *Indies*:
    Others said, the *French* who were driv’n out of *Siam*, had seiz’d the Isle.
    And others assur’d us, that Squadron never touch’d there, and that there were
    only a few Families at *Mascaregne*, who had dwelt there a long time. These Reports
    being all different, were of no use to us. All agreed, that nothing cou’d compare
    with the Island of *Mascaregne* for Beauty and Fertility. That Corn, Grapes, and
    every thing else proper for the Nourishment of Man, grew there in abundance, and
    almost without Cultivating. This made us resolve to depart with all convenient
    speed for *Maurice* Isle which is not far from that of *Mascaregne* or *Eden*.
    We might expect there to be better inform’d of things, and enabled to concert
    our Measures better, to follow the Orders that were giv’n us in *Holland*.Those
    of us that were sickest Landed at the Cape, as soon as we arriv’d, to cure our
    selves of the Scurvy, staying at Land being the only true and sovereign Remedy
    for that Distemper.The Grapes were just beginning to grow ripe when we came there
    (which was an excellent Refreshment for our selves, and our Ships Crew :) We stay’d
    three Weeks at the *Cape*, as well to recover our Health, as to refit our Ship.
    Since my design is to speak more largely of the Cape of *Good Hope* in the sequel
    of this Relation, and to give an account of what Remarkable things I saw there
    in my Return, I shall not detain the Reader any longer about it now, our good
    *Swallow* having been refresh’d as well as we, and all our Company being in a
    good state of Health, we weigh’d Anchor the *13th* of *Feb*. 1691, after three
    Weeks resta-shoar. We Saluted the Fort with five Guns, and so set Sail, tho’ the
    Wind was not quite fair for us. After having tack’d to and again some time, we
    went on in a straight Course to double Cape *Needles[¹](#C01_chapter_split_001.xhtml_fn8_47)*
    ; we came into 40 Degrees, and the Wind continu’d changeable till the *15th* of
    *March*, when we had all the Prognosticks that fore-run a terrible Tempest.The
    Wind became Impetuous in a very little time, and the Sea foaming and lifting up
    its Waves, form’d Mountains that seem’d higher than our Masts : the Air appear’d
    to be all on fire, Lightnings struck us almost blind, and the Waves rowl’d dreadfully
    in upon us. But our Crew were most of all terrify’d at the sight of *St. Elme’s[²](#C01_chapter_split_001.xhtml_fn8_48)*
    Fire, which stuck to our Masts : Our Ship was so little, that People were amaz’d
    at the sight of it at the Cape, and ’twas now driv’n along with inconceiveable
    swiftness : All things were in Confusion, and horrible Disorder. Our Tackling
    broke, our Chests, our Arms, Beds, the Mariners and Passengers were tumbled *Pell-mell*,
    from one side to t’other : The Heavens which appear’d at first to us to be all
    on fire, were now hid from our Eyes by black Clouds, from whose profound depths
    issu’d such Torrents of Water, as threatened to overwhelm those that handled the
    Ropes with present Destruction.Our Deck was always a Foot deep in Water, for the
    Sea threw it in faster than it cou’d run out ; and it added to our Terrors, that
    no body there had ever seen the like before, so extraordinary was this Storm ;
    the same Wind encreas’d still to a certain Point : after which all the others
    blew successively, and sometimes mingled together with equal fury to make Sport
    with our poor little Vessel, which this Minute they tost up to the Skyes, and
    the next sunk down to the Earth. During the ten hours that this Tempest lasted,
    all the Winds conspir’d to make an entire *tour* of the Compass ; and it being
    impossible to handle the Ropes and Sails to work the Ship regularly, we were all
    that while oblig’d to abandon our selves to the caprice and fury of the Waves.At
    last the Storm decreas’d by little and little, we recovered Hope in the midst
    of Despair, and heartily Congratulated one another on our common Deliverance,
    each of us feeling a secret Joy, which none can be sensible of, that has not escap’d
    the like Danger, and been deliver’d out of so great and so just a Fright. We therefore
    return’d thanks to him, that had preserv’d us in the midst of it thro’ Iiis infinite
    Mercy.When we were a little come to our selves, we lookt upon those dreadful Billows
    which threaten’d still to swallow us up, as if they only play’d with us, and concluded
    that the Tempest in which we had been, cou’d be nothing less than a Hurricane.
    We found a true and lively Description of it in the CVII Psalm, which we read
    with great Pleasure and Admiration, as we did also the XXIX.Let who will boast
    of the famous *Idæas &* of *Virgil* on the same Subject : What he says, do’s not
    come up to the *Sublime* of these two Psalms. And, indeed, all the Places admir’d
    by the Pedants in the *Greek* and *Latin* Poets, are but Trifles, in Comparison
    with the Magnificent and Inimitable Canticles of *David*.We Discours’d a long
    time on the terrible and almost incredible effects of the Matter of Air, which
    is in appearance so soft, so weak, so light, so invisible, and like to nothing,
    and which in the impetuous Agitations of these Whirl-winds, tear up the greatest
    Trees by the Boots, break Ships to pieces, throw down Houses, and in a few Minutes
    cause such great Disorders.What’s most to be admir’d in it, is, that the surest
    Presage of a Hurricane[¹](#C01_chapter_split_001.xhtml_fn8_49) (an *Indian* Word
    which we have adopted) is a perfect Calm ; the Sea puts on a deceitful Mien, she
    smooths all her Furrows, and leaves not the least wrinkle on her Brows, but looks
    on you with a gay and smiling Air.I wish those Gentlemen whom we call Philosophers,
    wou’d shew us distinctly the secret Springs of these several wonderful Movements
    ; instead of filling their famous Writings with their little superficial Reasons,
    which are almost always false. True sages humbly confess that Nature has her unsearchable
    Depths, and that to speak properly, all those are things Divine. They acknowledge
    also, that one of the greatest Sciences of true Philosophy, is not to be ignorant
    of ones Ignorance.It has been thought that the Rain is salt when the Hurricane
    is at the height; several Voyagers have written as much, but tho’ I will not positively
    deny the matter of fact, I am very apt to believe they confound the sprinklings
    of the Waves with the Rain : If ’tis said that the Rain has been found to be Salt
    a-shoar, in the middle of certain Islands, I answer in the first place, that I
    doubt it, and add, that the same Whirl-winds that lift up the greatest Vessels,
    may also raise up great quantities of those broken Waves, and scatter them to
    a vast distance, in these Isles or other Places far from the Sea, where, falling
    down in drops, they may easily be mistaken for Rain.I shall say one word only
    of *St. Elme’s* Fire, which I saw sticking to our Masts when the Storm was at
    the strongest, because I did not make any particular Observation of that Phænomena.
    I saw it but by chance, and my Mind was then so eniploy’d about things of another
    Nature, that it had no time for matters of Curiosity. I observ’d a Body of blewish
    Light, as it were curl round one of our Masts, and I did not look to see if there
    was any more ; what makes me believe there was but one, is, our Seamen were frighted
    at the sight of it ; Whereas, had there been two, these poor Wretches wou’d have
    taken it for a Happy Omen. ’Twas without doubt according to this Idrea, that the
    Name of one of these two Fires only, is not mention’d by *St. Paul* speaking of
    the Ship he was in, but of both together : I say of both, because two was then
    spoken of. The two Children that came out of the same Womb with *Hellen* and *Glytem-nestra*,
    the two Eggs of *Læda*, which some have transforms into the Constellation of *Gemini*,
    and others adore under their Primitive Name of *Castor* and *Pollux*, as Gods
    of the Sea, because they support Pirates : But I know there sometimes appear four
    or five together, and perhaps more. As for Monsieur *St. Eime* succeeding Monsieur
    *St. Castor*, and Monsieur *St. Pollux*, ’tis a question that I leave to some
    Seraphick Doctor to decide how it came about.The *3d* of *April* we saw Land,
    great News ! What it was we cou’d not tell, for we had lost our *Tramontane[¹](#C01_chapter_split_001.xhtml_fn8_50);*
    Nevertheless we flatter’d ourselves with Hopes that ’twas the Isle of *Eden ;*
    and we made Merry with the thoughts of setting foot on the Land we so much desir’d
    as design’d for the place of our Habitation. The Wind seem’d to have a spirit
    of Contradiction, and wou’d not let us approach it, however, we disputed that
    Matter so effectually with it, that, in spite of its Obstinacy, we drew so near
    it as to perceive, after a strict Examination, ’twas the same we sought after,
    and had now found with equal Surprize and Joy.We discover’d several Beauties in
    this admirable Country, from the place where we stopt to view it : All that part
    of it which presented it self to our View appear’d to be a Level, with Mountains
    rising in the Middle ; and we cou’d easily discern the agreeable mixture of Woods,
    Rivers and Valleys enamell’d with a charming Verdure : If our Sight was perfectly
    well pleas’d, our Smell was no less ; for the Air was perfum’d with a Delicious
    Odour that ascended from the Isle, and that plainly arose from the abundance of
    Limons and Oranges which grow there. This sweet Odour struck us all alike, when
    we came at a certain distance from the Island : some agreeably complain’d, that
    the Perfume hinder’d them from sleeping, others said they were so embalm’d with
    it, that ’twas as much a Refreshment to them, as if they had been fifteen days
    a-shoar.The Account[¹](#C01_chapter_split_001.xhtml_fn8_51) which Monsieur *Du
    Quesne* order’d to be publish’d of this Island, has not this Particular, but Mr.
    *Delon[²](#C01_chapter_split_001.xhtml_fn8_52)* did not forget it ; and he even
    writes, that he believes the Reason why there are no Serpents, Rats, nor Venomous
    Insects in that Isle, is, because the great number of Odoriferous Flowers with
    which it is cover’d, are Poyson to those Animals, which he says he has experienc’d.
    We cou’d not help praising this Paradise, all of us extoll’d it but the Captain,
    who affected to speak the quite contrary, whatever Disposition he then shew’d
    to it, and however positive his Orders were to Land on that Island, he never intended
    it ; and ’twas pure chance that brought him so near it, for he thought he was
    above forty Leagues off when we discover’d it. He seem’d to be amaz’d when the
    Pilot told him he spy’d Land, and believ’d ’twas that we sought after. I shall
    not pretend here to give this Man’s secret Reasons for what he did, because I
    know nothing but by Conjecture, and besides, ’tis not to our purpose, be it one
    way or t’other. (Alas, I can hardly hold my Pen in my Hand to say it) ; this Cheat,
    this Rascal, took hold of the weak Condition we were in, drew farther off’ from
    the Island by little and little, and sail’d directly to *Dwgo-Ruys*. His Ships
    Crew were all at his Disposal, and we, the Passengers, being all Sick, cou’d not
    pretend to force him to execute his Commission. ’Tis easie to imagine how we were
    surpriz’d and troubled.As for the Description of this Amiable Country, since I
    was not so happy as to visit it my self, which the Reader has expected I should
    do from the beginning of the Voyage: I believe he will not be displeas’d, if 1
    have recourse to a means to procure it for him that will in a great measure make
    amends for my disappointing him. To this end I will abridge the Relation[¹](#C01_chapter_split_001.xhtml_fn8_53)
    of the most Remarkable Rarities of this Island, which Monsieur *du Quesne* made
    publick before our departure from *Holland*. ’Tis true, this Relation may be suspected
    by those who think ’twas his Interest to prepossess the World with an advantageous
    Opinion of the new World which he was going to Inhabit : But to this I shall first
    reply that Monsieur *du Quesne* was so very far from adding to the truth, that
    he wou’d not suffer any thing to be inserted in the Book he order’d to be Publish’d,
    which had the least air of Exaggeration : And in the next place I add that at
    *Maurice* Island, *Batavia* and the *Gape*, I can my self Witness, every Body
    allow’d there was nothing in that Relation, which was not exactly conformable
    to Truth.“ This Island was at first call’d *Mascarenas*, by the *Portuguese*,
    who took Possession of it in the Reign of their King John IV,[¹](#C01_chapter_split_001.xhtml_fn8_54)
    in the Year 1545\. M. *de Flacour* set up the Standard of *France* there, one
    hundred and eight Years afterwards, in the Name of Lewis XIV. now reigning, and
    gave it the Illustrious Name of *Bourbon*. What he wrote concerning it is to be
    seen. He put the Arms of *France* on the very Monument where he found those of
    *Portugal*, having done the same at *Madagascar*.“ I believe the *French* have
    as good as abandon’d this little Island. Others that have since landed there,
    have found it to be so excellent and so beautiful, that they look’d upon it as
    a Terrestrial Paradise, and gave it the fine Name of *Eden ;* that is, *The Country
    of Delight.”*[²](#C01_chapter_split_001.xhtml_fn8_55)The Relation out of which
    I have taken this Abstract says, no Body ever went quite thro’ the Island, which
    was for want of good Information. The Map I have plac’d here, was taken from a
    Description given by Persons that visited it all over, and liv’d there several
    Tears.*Monsieur du Quesne* adds, “ Be it as it will, ’Tis certain the Isle of
    Eden is of a sufficient Extent, to contain easily along Descent of. Generations,
    of whatever Colony will settle there.“ ’Tis most true, *says our Author*, That
    Voyagers have not made mention of any Country where the Air is more healthy than
    in this Isle ; which is a very important Article. ’Tis well known abundance of
    sick People have gone ashoar there, and have recover’d their Health in a very
    little time. The same have those said, who have remain’d there much longer; tho’
    they wanted several Conveniencies, and were but too much expos’d sometimes to
    the Sun, and sometimes to the Dew. The Sky is clear; the Exhalations of the Earth,
    as well as those of the Aromatick Plants and Flowers, with which ’tis cover’d,
    perfume the Air, and they breath’d in a Balmy Spirit equally wholesome and agreeable.“This
    charming Isle[¹](#C01_chapter_split_001.xhtml_fn8_56) lies between 21 and 22 deg.
    of S. Latitude, and has one Advantage in common with other Countries near the
    *Line*, that the Heats are temper’d by certain cool and regular Breezes, which
    Providence, admirable in all its Ways, has so dispos’d to render these Countries
    more Commodious for Habitation.“ The abundance of Springs that are found in this
    Isle, is one of its Rarities. The Water is clear and wholesome, and some of it
    Purgative. From these Springs flow Rivulets, and even some Rivers, which water
    all the Plains, and are so full of Fish, that Voyagers affirm, *Those who ford
    them find it so slippery, they can hardly stand for the Number of Fish.[¹](#C01_chapter_split_001.xhtml_fn8_57)*
    There are several Lakes, and one among the rest, so plentiful of Springs, that
    seven great Rivulets run out of it into a vast and rich Plain.“ There is no venomous
    Creature upon it, neither in the Water, neither on the dry Land ; whereas almost
    all other hot Countries are full of Snakes, and such sort of Animals, whose Sting
    or Bite is dangerous, if not mortal. The same thing is affirmed of the Plants
    and Fruits here.“ I shall say nothing of the admirable Shells that are pick’d
    up on the Sea shoar, nor of the Coral and Ambergreese that are found here, tho’
    they are both valuable and useful Things. But I must declare that the Sea is full
    of Fish, and that its Turtles only wou’d abundantly and deliciously subsist the
    Inhabitants. The Land Turtles are also some of the Riches of the Island. There
    are vast Numbers of them : Their Flesh is very delicate ; the Fat better than
    Butter or the best Oil, for all sorts of Sa wees. Some of the Sea turtles weigh
    above 500 Pound weight. The Land Turtles are not so big ; but the great ones carry
    a Man with more ease than a Man can carry them.. This Oil of Turtle, for ’tis
    a sort of Fat, which do’s not congeal as other Fat do’s, is an excellent Remedy
    in several Distempers.“ The Forrests are not so thick but one may easily go thro’
    them, and the Shade do’s not hinder the Fruit from ripening. There is abundance
    of Cedars, of Ebony, and Timber for Carpenter’s use, Palm-Trees, Fig-Trees, Plantanes,
    Oranges, Limons, etc. We might name 20 other different kinds of Trees that bear
    Fruit good to eat, and the variety of their Tastes are enough to content those
    of all Men. Aloes, Indigo, Sugar Canes, Cotton, Ananas, Bananas, Tobacco, Potatoes,
    Pumpkins, Land and Water Melons, Cucumbers, Charibbean Cabages, Beans, Artichokes,
    a certain sort of Pease, and a hundred other Plants. Fruits or Roots of this nature
    grow naturally every where. ’Tis experienc’d that Indian Corn, Millet, Bice, Wheat,
    Barley, and Oats grow very well there, and that one may have above one Crop a
    Year of all these several sorts of Grains. People have had the Curiosity to sow
    some of each sort of our Pulse and Garden Herbs (which I shall not particularise,
    for fear of being tiresome), and they all came up to a wonder. The reason is,
    ’tis an excellent Soil, and the Father of Nature has rendered it admirably fruitful.
    Since we find very good Grapes there, we have, reason to believe one may have
    very good Wine ; and, no doubt, might with the same success raise any of the Fruit-trees
    peculiar to our Continent.“The black Cattle,[¹](#C01_chapter_split_001.xhtml_fn8_58)
    Hogs and Goats, that were formerly left there by the *Portuguese*, are so multiply’d
    that we meet with them in Droves in the Forrests; and one may reasonably expect
    that Dear, Sheep, and all Animals that we find any where else, in the same Climate,
    wou’d in the same manner succeed there.“ The Fowl that are most plenty in this
    Island, are Partridges, Doves, Ducks, Wood-Pigeons, Woodcocks, Quales, Black-Birds,
    Puets, Thrushes, Geese, Coots, Ducks, Bitterns, Parrots, Herons, Peacocks,[²](#C01_chapter_split_001.xhtml_fn8_59)
    Fools, Frigats, Sparrows, and abundances of other small Birds, as also Birds of
    Prey, and other Birds. There are Batts whose[¹](#C01_chapter_split_001.xhtml_fn8_60)
    Bodies are bigger than a Hen’s, and the Flesh of them very pleasant to eat, when
    a Man gets over that Aversion to ’em which is begot by Prejudice. The Parrots
    are also excellent Food. The Peacocks are great Birds mounted upon Stilts ; they
    frequent Lakes -and Rivers, and their Flesh tastes much like that of a Bittern.
    The Partridges are all grey, and half as little again as ours. The Males of the
    Sparrows have red Breasts,[²](#C01_chapter_split_001.xhtml_fn8_61) and when they
    make Love, redder than ordinary. But these little Animals, which, like Flowers
    and Butter-flies, seem to be made only to embellish Nature, multiply so fast,
    that, to say the Truth, they are troublesome. They come in Clouds, and carry away
    the Corn that is sown, if great Care is not taken of it ; which is doubtless an
    Inconvenience ; but a little Gunpowder soon frightens ’em away. There are also
    Caterpillars and Flyes, which are a little vexatious. And lastly (for we must
    say all we can, if we wou’d give a true and entire Idea of Things) those dreadful
    Tempests, that are known by the Name of *Hurricanes*, are a dismal Article. However,
    we are assur’d they are much less violent than those of *America ;* and, after
    all, do -not last above four and twenty Hours. Besides, these terrible Tempests
    never happen but once a Year, and there are infallible ways of providing against
    them : towhich we may add, that for one bad Day there are three hundred and sixty-four
    wonderfully fair ones. And this Consideration is very comfortable. Wise Men, who
    have had a little Experience of the World, and travell’d a little, know that no
    perfect happiness is to be expected in it, neither linder the *Line* nor under
    the *Poles*. Every Thing has its For and Against, and the best is but the least
    bad. All that can be done therefore on this Occasion, as well as in others, is
    to take the Balance and weigh Things before we determine what to do. If some Inconveniencies
    in our *Eden* trouble you, says Mr. *du Quesne*, Put the Catterpillars, the Flyes
    and the Sparrows of this Isle, together with one *Hurricane* a Year, in one Scale,
    and add *Health, Liberty, Safety, Abundance*, and *Peace*. To counterbalance these
    three sorts of little troublesome Animals, put all those strange Beasts that our
    famous *Molière* calls Harpagons,[¹](#C01_chapter_split_001.xhtml_fn8_62) Purgons,[²](#C01_chapter_split_001.xhtml_fn8_63)Macratons,
    Mascarils,[³](#C01_chapter_split_001.xhtml_fn8_64) Metaphrasts,[⁴](#C01_chapter_split_001.xhtml_fn8_65)
    Trissotins,[⁵](#C01_chapter_split_001.xhtml_fn8_66) Town-Fops, all the Race of
    Misers, Cheats, Coxcombs, and Blockheads, add to that Dragons and Beetles, Cellar-Rats,
    Barn-Rats, Slavery, Poverty, Alarms, and a thousand Miseries, and see which Scale
    is the heaviest !”I must again declare, ’twas to our great Regret, that we saw
    our selves leaving this Island behind us, this charming Island, so much desir’d
    by us. We were so weak and so troubled, that we consented to what we could not
    help ; and the Commander of our *Swallow* endeavour’d to persuade us he wou’d
    carry us to a Place every whit as good as that of which we were so fond. ’Twas
    but one hundred and fifty Leagues from this Island, but the Wind was so contrary,
    that we were forc’d to tack to and again for a Month together.Poor *John Pagni*,
    one of our Companions, dy’d between the Isle we had found, and that we were seeking.
    He cou’d no longer resist the Violence of the Scurvy and the Oppression that tormented
    him.On Saturday Morning, the 25th of *April* 1691, Old Stile, we spy’d *Land*,
    which was the little Island *Diego Ruys*, where our Captain resolved to carry
    us ; we came very near it, by the Eastern Point sailing Southward. It appear’d
    to us to be difficult of access, it being surrounded with Eocks calPd *Shelves*,[¹](#C01_chapter_split_001.xhtml_fn8_67)
    which run very far out into the Sea. We did not at first perceive either Port,
    or Bay, or any Place where we might land. In the Evening we sounded and met with
    the Bottom, three Leagues from Shoar. We cast Anchor, ’twas a Calm, and we stay’d
    there till Monday the 27th. for what reason I know not. That and the next day
    we spent in examining the outside of the Isle as much as we cou’d, to endeavour
    to discover some Place that was accessible. The 28th, about four in the Afternoon,
    we perceiv’d an Opening, which seem’d proper for our Design: But the Night following
    we were driv’n out to Sea, and beat there till the next Day. About 11 a Clock
    in the Forenoon a Calm took us, and brought us into great Danger ; for a rapid
    Current plainly carry’d us among Eocks, that run out above a League into the Sea.We
    were so near that there was no likelihood of avoiding them, when by the special
    Mercy of Heaven there sprang up a brisk and fair Wind that drove us back. We then
    made the *Gape* towards the North Point, and at Noon the Captain put out his Boat
    to seek for a Place to enter. In the Evening we sail’d towards the Northeast Point,
    and the Boat gave us a Signal that it had found out good Anchorage : We were then
    on the Bock in eight Fathom Water only, which oblig’d us to be always sounding.
    We cast Anchor in nine Fathom, a sandy Mud at Bottom ; our Ship was tow’d along
    by the Boat ; We lay there till the next Day, when we intended to look out for
    a better Place. Accordingly, early in the Morning, the 30th of April, we cast
    Anchor in nine Fathom Water, a good Bottom of Ouzy Sand, and shelter’d from the
    East and South-East Winds, which blow always in that Country.The Island afar off,
    and near at hand, appear’d to us very lovely : The Captain, who had his Reasons
    for not landing us at *Tristan* or *Mascaregna*, desir’d nothing better than to
    leave us at *Rodrigo*, and with that Design he highly extoll’d the Beauty and
    Advantages of this Island ; and indeed this little new World seem’d full of Delights
    and Charms. ’Tis true we did not see so many Birds flying about as at *Tristan*,
    and our *Road* was not so perfum’d with the *Odours* of the neighbouring Shoar
    as at *Eden*, from whence we had been come about a Month. But we cou’d not thence
    conclude there were no Birds in the New Island, nor no Flowers to send up grateful
    Sweets. Besides, the Face of it was ex-treamly Fair. We cou’d hardly take our
    Eyes off from the little Mountains, of which it almost entirely consists, they
    are so richly spread with great and tall Trees. The Rivers that we saw run from
    them water’d Valleys, whose Fertility we cou’d not doubt of ; and, after having
    run thro’ a beautiful Level, they fell into the Sea, even before our Eyes. Their
    Banks were adorn’d with Forrests ; and some of us, at the sight of this Lovely
    Isle, call’d to mind the famous *Liguori,[¹](#C01_chapter_split_001.xhtml_fn8_68)*
    and those several enchanted Places, so agreeably describ’d by Mr. *d’Urfé* in
    his Romance; But our Thoughts were immediately carry’d away by other Contemplations.
    We admir’d the secret and wonderful Ways of Providence, which, after having permitted
    us to be ruin’d at home, had brought us thence by many Miracles, and now dry’d
    up all our Tears, by the sight of the Earthly Paradise it presented to our view
    ; where, if we wou’d, we might be rich, free and happy ; if contemning vain Biches,
    we wou’d employ the peaceable Life that was offer’d to us, to glorifie God and
    save our Souls.We were all of us more busy’d with these sweet Meditations, than
    possess’d with Transports of Joy, when the Boat was put out again, and we were
    ask’d who wou’d go ashoar ? Upon which every one rose up hastily, tho’ there was
    not one but was sick. All my Companions got into the Boat, but seeing it was full,
    I made no great haste after them. I was older by much than any of them, and consequently
    more Master of my self ; and being full of I know not what, mixtures of Grief
    and Joy, I spent the rest of the Day in profound Silence.In the Evening the Captain
    return’d, and told me Wonders of the Country, which he exaggerated much beyond
    the Truth, as I had time enough to discover. He talk’d to me of Animals and Fruits
    that were never seen in that Island. ’Tis true, he brought back several sorts
    of great and good Birds : I experienc’d the Truth of that by making an agreeable
    Meal on this new and unknown Dish. The next day (the 1 st of *May* 1691) I follow’d
    my Companions, and went ashoar.This Isle, which is call’d either *Diego-Rodrigo*,
    or *Diego-Ruys*, or *Rodrigo*, is situated in nineteen Degrees of South Latitude.
    ’Tis about twenty Miles (*lieues*) in Circuit. Its Length from East to West, and
    its Shape, are as may be seen in the Map.We seated our selves near the Sea, on
    the North North-West Shoar, in a lovely Valley, by the side of a great Brook,
    the Water of which was clear and good. We went all over the Island, and chose
    this Place as the most convenient, and that which Providence design’d for us,
    by conducting us first to it.I have observ’d that every one to whom I have told
    my Adventures, have had a great Curiosity to know the Disposition of our little
    Habitations ; ’tis for that reason I now lay down a Plan of them. For by my own
    Experience, I know very well that when the Eeader by this means conceives any
    Idea of the Places where Things happen’d, he is the more concern’d about the Things
    themselves.Let him therefore cast his Eyes on the *Map* I set before him, he will
    see I distinguisli it from the General Plan of the Island, because Things cou’d
    not have been so distinctly mark’d there. I desire he wou’d pardon my deficiency
    in *Designing*, which I profess not to understand, I give him what I have, and
    I can do no more. As I have made but an imperfect Eelation of Things, so I have
    drawn but an imperfect Design, in this small Delineation of our poor Settlement.
    And I hope my Defects will not be found to be so great, but he may himself easily
    supply them.The little Eiver he sees, comes from the middle of the Island, and
    at four or five thousand common Paces below our Cabbins, it forms several Cascades,
    falling from Eock to Eock, and several Basons (*ct napes d’eau*), that wou’d adorn
    a Prince’s Garden. In a hot and dry Time it receives very little Water from its
    Fountain ; But in all Times the Tide fills it to the Brink of the Banks. The little
    Space which I have mark’d towards the Left, and at the Mouth of it, is low Ground,
    which the Sea covers as often as it rises. This side of the Water is in general
    lower than the other, and subject to frequent Inundations by the Floods in *Hurricane*
    time.*Peter Thomas*, one of our Pilots, of whom I have made mention, chose to
    inhabit a little Island form’d by the River. He built his Cabbin there, and made
    a little Garden with a double Bridge. He was a very pretty Lad, and us’d to perch
    upon a Tree in an Inundation ; which brings to my Remembrance the glorious Monarch
    *Charles* II when he was mounted up in the famous Oak at *Boscobel*,[¹](#C01_chapter_split_001.xhtml_fn8_69)
    whose Relicks are Venerable to this Day. But whereas that King durst not say a
    Word, or only Whisper to Captain *Sans-Soucy,[²](#C01_chapter_split_001.xhtml_fn8_70)*
    the Companion of his Fortune, Master *Peter Thomas*[³](#C01_chapter_split_001.xhtml_fn8_71)
    play’d on the Flute, or sung, or chatter’d freely with his Friends, lie was the
    Only Man of the Company that smoak’d Tobacco : He was also a Mariner. When his
    Tobacco was gone he smoak’d Leaves.The next Cabbin to the Isle on the Right-hand
    towards the Sea, was Mr. *de la Haye’s*. He was a Silversmith, and had built a
    Forge, so that he was oblig’d to make his House a little bigger than the rest.
    *La Haye* was always singing of Psalms, whether he was at work or walking.The
    Cabbins were ten or twelve Foot square, some more some less, according to the
    Fansie of the Builder. The Walls were made of the Trunks of Plantanes,[¹](#C01_chapter_split_001.xhtml_fn8_72)
    and the broad Leaves of the same Tree serv’d to cover them. The Dotts about every
    Cabbin shew where the Pallisado’s stood, which en-clos’d our Gardens. The Doors
    are also mark’d by the void Spaces.The Plan shews at what distance these Hutts
    (*maisonettes*) were one from the other.Near poor *la Haye’s*, on the same side
    of the River, and not far from the Water, was the *Stadt-House (Hôtel-deville*),
    or, if you please, the Place of Rendezvous for our *Republick*, whose chief Councils
    concern’d the Affairs of the Kitchen. Tins Edifice was about twice as big as the
    others, and *Hubert Anseltn* lay in it. ’Twas there we prepar’d the Sawces for
    our Dishes, but we eat under a tall and great Tree, on the Bank of the Rivulet,
    over-against the Door of that Cabbin. This Tree afforded us a very fine Shade,
    and defended us from the burning Rays of the Sun. ’Twas in the Trunk of this Tree,
    which was very hard, that we cut a sort of a Nich, to leave there the Memorial
    and Monuments, of which I shall speak hereafter. On the other side of the Water,
    opposite to the Common *Hall (Hôtel*) was the Common *Garden*: ’Twas fifty or
    sixty Foot Square, and the Pallisado’s that eneompass’d it of a Alan’s height
    and very close : Insomuch that the least Turtles cou’d not go between them. For
    that, as may be imagin’d, was the only reason which oblig’d us to enclose our
    Gardens.But let us re-pass the Bridge, and come back to *Francis Leguat*, the
    Author of this Relation’s Cabbin ; you see ’twas between two Parterres, and upheld
    by a great Tree, which also cover’d it on the side of the Sea. This Tree[¹](#C01_chapter_split_001.xhtml_fn8_73)
    bore a Fruit something like an Olive ; and the Parrots lov’d the Nuts of it mightily.A
    little lower and nearer the Water on the same side of the Brook, stood Mr. *de
    la Case’s* Lodge. This brave Man, who is now in *America*, had been an Officer
    in the *Branden -burgh* Troops, and knew already what it was to live in Tents.
    He was a Man of good Presence, Ingenious, full of Honour, Courage and Wit.On the
    other side of the Rivulet between the Islet and the great Garden, was the Cabbin
    of poor Mr. *Testard*, whose .sad Destiny we shall see in a short time. He was
    a stout (*brave*) Man, and one whom I very much regretted the loss of.Mess. *B—le*[²](#C01_chapter_split_001.xhtml_fn8_74)
    and *Boger* liv’d together, and built their Hutt a little farther from the Brook,
    and nearer the Sea. The Reader will find a true Picture of honest *Isaac Boyer*
    in his Epitaph ; for I must tell him before hand, that this dear Companion of
    our first Adventures, laid his Bones in *Rodrigo*. And since I have giv’n a Character
    of those whom I have spoken of, I shall add concerning Mr. *B—le* (who is, thanks
    be to God, now alive and in Health), that we all lov’d him for the good Qualities
    with which he is adorn’d. I observ’d with pleasure in this young Man (for he was
    not above twenty years old) an honest and upright Soul, good natur’d and lively
    : He had by his Studies acquir’d more Knowledge, than the generality of Mankind
    can pretend to. He was always Gay, and in good Humour,[¹](#C01_chapter_split_001.xhtml_fn8_75)
    and ’twas chiefly owing to his faculty of Invention and Address, that we built
    the rare Vessel, of which we shall say more hereafter ; as also that we Manufactured
    certain little Hatts, which were very great Comforts to us in our great Distresses.
    To conclude, I must inform the Header, *en passant*, that except *P. Thomas* and
    *R. Anselm*, M’en of mean Fortunes, all the rest of our Friends were not driv’n
    out of *Europe* by Misery, nor did they desperately cast themselves on Desert
    Islands, because they knew not where to set their foot in the World. They were
    Men of good Families, and of no contemptible Estates ; but Mr. *du Quesne’s* Colony
    made such a noise (*& qu’ils étaient jeunes, sains & gaillards*), that having
    no ties of Families or Affairs to detain them, they had a mind to make this Voyage.I
    believ’d, Reader, you wou’d be better pleas’d with the Continuation of our Adventures,
    after I had given you some light into the Characters and Circumstances of the
    Adventurers.You see Trees scatter’d up and down in our little Town, they are Remainders
    of a much greater Number, which we thought fit to fell, and ’twas no hard matter
    to do it ; for the Ground is extreamly light, and the Roots were easily taken
    up : I don’t doubt, you Laugh to hear us talk of our little Town, but what I pray
    you was the famous *Rome* in its beginning ? Had there been. Women amongst us,
    100 years hence, instead of seven Hutts, one might have reckon’d seven Parishes.When
    we had finish’d our Preparations for building our little Houses, the Captain who
    stay’d fifteen days iu the Road weigh’d Anchor, after having deliver’d us the
    greatest part of the Necessaries we brought for a Settlement, and taken fresh
    Provisions Aboard. We sent Letters by him to our *Friends* in *Holland*, wherein
    we had set out his Panegy-rick as he deserv’d, but he was not such a Fool as to
    deliver them, as we understood afterwards, and, indeed, as we expected from him.What
    he left us was chiefly—Biskels, Fuzees,[¹](#C01_chapter_split_001.xhtml_fn8_76)
    and other .Arms, Powder and Bullets, Tools for Husbandry and building our Cabbius,
    as Saws, Hatchets, Nails, Hammers, and Sheers, Household-stuff, a Turn-broach,
    Fishing-Nets and Lines ; in short, every thing except *Drugs*, which I believe,
    the Captain rather forgot, than maliciously kept from us : Besides this, every
    Man had his particular Goods, Necessaries and Provisions.*Peter Thomas*, whom
    I have mention’d, having (quarrell’d with the Captain, and fearing to return with
    him, resolv’d to stay in the Island, and that wou’d have made up the loss of one
    of our Companions who dy’d at Sea near *Masea regne*, if the Captain, the Night
    before he left us, had not taken away two of our Company (*Jacques Guigner* and
    *Pierrot*) so that we had but eight left.When the Ship was gone, and each of us
    were well recovers! of the Fatigues of the Sea, we made the *tour* of the Island
    to see whether we cou’d discover any better Place to settle in, than that where
    we first Arriv’d ; but we found ’twas much the same all over it, and even tho’
    there were about twenty several sorts of level Land, and almost as Commodious
    as Ours, yet we met with none that was not somewhat Inferior to it in Beauty and
    in Goodness ; so that we resolv’d to stay in the place where we first sat down.As
    soon as we had clear’d the Earth as much as was necessary for Tillage, we dug
    it, and sow’d our Grain.We had abundance, and of all sorts ; but that which we
    brought from *Holland*, was spoil’d by the Air of the Sea, we having forgot to
    put it into Earthen Pots, and Seal them down well. We furnish’d our selves with
    other Seed at the Cape of *Good Hope*. Only five Seeds of Ordinary, and as many
    of Water-Melons came up ; three of Succory,[¹](#C01_chapter_split_001.xhtml_fn8_77)
    three of Wheat, some Artichokes, Purslain, Turnips, Mustard, Gilly-flowers and
    Clover-grass. The Gilly-flowers rose high, but they did not blow, and at last
    they all perish’d.The Turnips did the same, and where entirely destroy’d by the
    Worms before we cou’d eat them. The Melons which I call *Land*, to distinguish
    them from *Water-*Melons, came up almost without Culture in abundance, prodigiously
    Large, and excellently well tasted. I do not believe there can be better anywhere,
    and we found by Experience they had this rare Quality, that tho’ one did eat of
    them a little to Excess, no Inconvenience happen’d afterwards.We put ‘em into
    all our Sauces, and they were admirable in all ; We might have had them all the
    year long, but we observ’d that those which came up in the Winter, that is, when
    ’twas not so hot as at other times, towards the Months of *June* and *July*, were
    a great deal better than the others.We thought at first we must expose them to
    the Sun, as we do in *France*, but we soon found they wou’d thrive better in the
    Shade, which we may suppose is caus’d by the difference of the Climate and Soil.Among
    our five Plants of Water-Melons, there were two sorts, Red and White ; the first
    were the best. The Hind was Green, and the inside Red ; they are very Refreshing,
    and never do any hurt no more than the others : They are so full of Water, that
    one may easily go without Drink when they are eaten : Sometimes they were so big,
    that all Eight of us cou’d hardly eat up one of them.These several kinds of Melons
    grew without taking Pains about them, as I have said already, and produe’d Fruit
    in great Abundance. When we mingled a little Ashes with the Earth in the Place
    where they were Sown, it made ‘em grow and fructifie extraordinarily, and the
    Fruit was more than ordinarily delicate. We had great hopes of our Artichokes.
    We cou’d almost see them grow. They spread very much, but they yielded very little
    Fruit. Indeed we cou’d not be sure that the Seed was true Artichoke Seed, tho’
    it had the figure of it, and the Plant was like that of an Artichoke. We brought
    it from the Cape of *Good Hope*, without knowing what it was. We did our utmost
    to make the sides of it whiten, but to no purpose, tho’ we were not ignorant of
    the several ways of doing it. And we had as bad Success with the Succoury *(Chicorée*)
    : It came up to a wonder, so did the Purslain and the Mustard-Seed ; but do what
    we cou’d, we cou’d never take off its bitterness. Of three Grains of Wheat that
    came up, we cou’d preserve tut one Plant : It had above 200 Ears, and we were
    full of Hopes that it wou’d come to something, but it produe’d only a sort of
    Tares,[¹](#C01_chapter_split_001.xhtml_fn8_78) which very much troubled us, as
    you may imagine ; because we found our selves depriv’d of the Pleasure of eating
    Bread.However we shou’d not from hence conclude, that Wheat Corn will always turn
    to Tares here, since in *Europe* such like Degenerations are often to be met with.
    And if our young Alen instead of precipitately sowing all our Seed in one Place,
    and in one Day, had kept some for other Soils, and other Seasons, perhaps we might
    have had an ample Harvest, and better luck with all our other Grain.The Air is
    very clear and healthy at *Rodrigo*, and none of us having been ill all the while
    we liv’d there, is a very good proof of it, considering the great difference of
    the Climate and Food. He who dy’d just as we were about to leave it, as I shall
    relate in the sequel of these Memoirs, was perfectly born down by the violence
    of Fatigue.The Sky is always fair and serene, and the heats of the Summer very
    Moderate ; because precisely at Eight a Clock in the Morning there rises every
    day a little North-East or North-West Wind, which agreeably cools the Air, and
    tempering the hottest Season, causes a perpetual Spring all the year round, and
    a continual Autumn, no part of it deserving the Name of Winter, insomuch that
    one may bath one’s self at any time. The Nights are cool and refreshing ; it seldom
    Rains, at least we saw no Rain, except for four or five Weeks after the Hurricane
    ; that is, in *January* and *February*.[¹](#C01_chapter_split_001.xhtml_fn8_79)
    There fall great Dews, and frequently, which serve instead of Show’rs. As for
    Thunder,[²](#C01_chapter_split_001.xhtml_fn8_80) which is so formidable in our
    *Europe*, and in several other parts of the World, I believe it was never heard
    in this Island.’Tis as I have hinted, compos’d of lovely Hills, cover’d all with
    fine Trees, whose perpetual Verdure is entirely Charming. These Trees are very
    rarely entangled (*de broussailles*) one in another by the nearness and thickness
    of their Branches. They naturally form Ally’s to defend us from the Sun’s Heat
    ; and the Prospect is every where adorn’d by the sight of the Sea, thro’ the Boughs
    which are almost in all Places open enough, to admit a View of the vast Ocean
    between them.At the foot of these Hills are Valleys, the Soil of which is the
    most excellent in the World, as we may easily conceive, if we consider it consists
    chiefly of rotten Trees; whose Matter being redue’d to dust, is driven by the
    Floods down the Hills. This Mould is very light, and produces almost without Cultivating.
    It abounds in fruitful Juices.The Valleys are cover’d with Palm-Trees, Plantanes
    (*Lataniers*), Ebony’s, and several other sorts of Trees ; the Beauty of whose
    Leaves and Branches may compare with that of the finest of our *European* Trees.
    In the low parts of these Valleys we frequently meet with Rivulets of fresh Water,
    whose Springs are all in the middle of the Island. These pure Streams are never
    dry, and so conveniently dispos’d for watering all this little Country, that nothing
    can be more Commodious. What pity ’tis that a Place so Delicious in all things,
    shou’d be useless to the Inhabitants of the World. I insist the more on these
    charming Rivulets, because there are a great many Islands that have none ; and
    ’tis doubly a wonder to find so many here, and all so happily distributed.Several
    of the other Rivulets besides that near which as I have said we built our Cabbins,
    form (*des Napes &*) Cascades by falling from the top of Rocks : I reckon’d seven
    Basons, and as many Cascades all together, and all form’d by the same River.[¹](#C01_chapter_split_001.xhtml_fn8_81)There
    are abundance of Eels in these Rivers, some of them very big, and all excellently
    well tasted. Wo have taken some so Monstrous, (I am afraid to tell it) that two
    Men cou’d hardly carry home one of them ; ’tis easie to catch them, for you can
    scarce put your Bait into the Water, before the Fish bite. This Water is seldom
    deep, and being very Transparent, we cou’d easily see these huge Eels creeping
    at the bottom ; and if we pleas’d, might have taken them with a Harping-Iron (harpoon)
    : We have sometimes shot them with a Fuzee[¹](#C01_chapter_split_001.xhtml_fn8_82)
    and Hare-shot.The Valleys I am talking of, Water’d and made fertile by these little
    Rivers, extend themselves Insensibly as we draw nearer the Sea, and form a Level,
    which in some Places is two Miles[²](#C01_chapter_split_001.xhtml_fn8_83) broad,
    and two long. The Soil of these little Plains is excellent eight or ten foot deep,
    and there those great and tall Trees grow, between which one may walk at ease,
    and find such refreshing coolness in their shade at Noon ; so sweet, so healthy,
    that ’twou’d give Life to those that are dying. Their spreading and tufty Tops,
    which are almost all of an equal height, joyn together like so many Canopy’s and
    Umbrello’s, and jointly make a Cieling of an eternal Verdure, supported by natural
    Pillars, which raise and nourish them. This is certainly the Workmanship of a
    Divine Architect.What is more Remarkable, is the greatest part of the Trees of
    this little *Eden*, are not less useful or necessary for the Conveniences of Life,
    than pleasant to the Eyes or tho Mind. For Example, the several sorts of Palm-Trees
    and Plantanes are Admirable Magazines of Necessaries for those Sages, who Believe
    and Practise what *St. Paul* says. The Fruit of them is excellent, and the Water
    which the Trunks of these Trees yield, and which runs from its Spring without
    Preparation, is a kindly and delicious Liquor ; some of the Leaves are good to
    eat, others serve instead of Silk or Linen. There are abundance of these wonderful
    Trees all over our Isle. Perhaps the Reader may expect that I shou’d explain my
    self a little on this Head.I shall not undertake to give a Description of Palm-trees
    and Plantanes (*Lataniers*), a Thousand and a Thousand Men having written of them,
    and I know there are above thirty[¹](#C01_chapter_split_001.xhtml_fn8_84) several
    sorts of them : Neither shall I enlarge in the Description of those I am speaking
    of, but give a small *Idæa* of them, for the sake of such as do not know what
    sort of Trees these are.Our Palm-trees are commonly thirty or forty Foot high
    ; their Trunk is straight, and without Leaves, but ’tis cover’d with a sort of
    prickly Scales, whose prickles stand out a little : Some have a smoother Bark
    than others. On the top of the Trunks grow those Boughs of Palm, of which no Man
    ever saw a lively Picture. These Boughs form a great Knot (*bouquet*), and fall
    down all about it in Plumes : Below these Boughs, or rather below the Trunk from
    which they grow, are produe’d long Bunches, each Fruit or Grain (*estverd*) as
    big as a Hens Egg, and of the same shape, known by the Name of *Bates*.[²](#C01_chapter_split_001.xhtml_fn8_85)In
    the center of this great Knot (*bouquet*), and at the Summet of the Trunk, is
    what we call the Cabbidge. One cannot see it, being hidden by the Boughs that
    rise a little all about it. This Summet consists of tender Leaves, which closely
    embrace each other, joy η together, and form a Mass something like that of a Cabbage
    Lettice, or common Cabbage ; ’tis about two Foot high if the Tree is large, and
    of the same bigness with the Trunk. The large outside Leaves of this Mass are
    white, soft, pliable, and as strong as Buff, which it resembles. They will serve
    also for Linen, Satin, for Napkins, Table Cloths, and anything what you please.
    The Membrana or inside leaves are tender and brittle, like the Heart of a Lettice:
    They are good to eat raw, and tast like a Filberd ; but we made an admirable Bagout
    of them when we Fricasi’d them with the Fat and Liver of a Turtle.We put them
    also in our Soops.We come now to the Liquor, or rather the Nectar of the Isle
    of *Rodrigo*. ’Tis call’d Palm-Wine all over the *Indies*: There are two ways
    of drawing out the Juice. We make a hole in the Trunk of the Tree at about a Mans
    height, as big as ones two Fists.We presently put a Pot or other Vessel there
    to receive the delicious Liquor, which runs out fast enough, otherwise we dig
    *(creusions*) the Cabbage, and make a little Cistern at its Head. We need only
    go twice or thrice a Day, and draw this rare Wine at the Fountain Head, and we
    may be abundantly supply’d with it. The Wine of the Trunk, and that of the Cabbage,
    are in my Opinion of an equal goodness.But those who wou’d be good Husbands of
    their Trees (for as for us we were lavish enough of them), the first way is the
    best, because after the Cabbage has yielded its Liquor for about a Month, it Withers,
    and the Tree decays and dies. ’Tis the same thing if you tear off the Cabbage,
    when its Head and Brain are gone it dies almost suddenly.Whereas if you only pierce
    its Side, the Tree do’s not die, provided the Wound is not too deep ; but the
    Liquor will not run out at that Hole above four Days : The wounded Tree must afterwards
    have time to recover. I do not know what is done elsewhere, but I can tell by
    Experience what I have said here, we having made trial of it daily for two years
    together. The Bark of this Tree is very hard, ’tis an Inch thick, Porous and Tender
    in the Inside. If one make the Hole on the side of the Trunk too wide, there is
    reason to fear ’twill weaken the Tree there, and that then the next Hurricane
    will break it.The Plantane[¹](#C01_chapter_split_001.xhtml_fn8_86) *(Laitanier*)
    is a sort of Palm-tree, and the Arborists place it in the same Class. Our Plantanes
    have a straight Trunk, which seems to he form’d of large Sings at an equal Distance.
    They have no such prickly Scales as I have talkt of. At the top of the Trunk is
    a Cabbage, very like to that I have described. At the foot of this Cabbage instead
    of Palm Boughs are broad Leaves, with Stalks about six or seven Foot long : These
    Leaves are strong and thick, and like a Fan when ’tis open ; the Sticks of which
    come a little out of the Circumference, and are pointed at the end. Some of these
    Leaves are eight Foot Diameter, insomuch that they serv’d to make rare Coverings
    for our Cabbins. We cut ‘em out into little pieces, and made Hatts and Umbrello’s
    (*parasols*) of them. The Stalk is four Inches broad, an Inch thick and a little
    roundish at the sides ; at the bottom where it joyns to the Tree, it widens, and
    grows like a flat Shell which sticks to the Trunk, and in part embraces it. This
    wide and hollow Plate (*patte*) is sometimes above a Foot Diameter, and of the
    thickness of a Crown-Piece. We made use of it for Dishes, Plates and Sawcers.
    The first Rind of the Stalk serv’d us instead of Ropes, and the Fibres of the
    second made good Thread to Sow with. One might have wove Stuffs with it, had it
    been prepared.We could not perceive any difference in the Tast, or in any other
    qualities (*entre le vin*) of the Palm-tree or Plantane. This Liquor is whitish
    like white Whey, and so sweet, that no other sweetness, if I may judge of it,
    can compare to it: The newer it is, the more agreeable. In three or four days
    it begins to turn Sowre, and in seven or eight, ’tis as sharp as the strongest
    Vinegar without changing its Colour.The Dates of the Plantane (*Latanier*) are
    bigger than those of the Palm-tree. Having abundance of better things to feed
    on, Fish and Flesh, Fruits, etc., we left the Dates for the Turtles and other
    Birds, particularly the *Solitaries*, of which we shall hereafter make mention.About
    the Cabbage of the Plantane, near the bottom of it and between the Stalks of its
    broad Leaves, is a sort of Cotton of a Limon Colour, which all thro’ *India* is
    known by the name of *Capoc*.[¹](#C01_chapter_split_001.xhtml_fn8_87) We made
    very good Quilts (*matelas*) of it. It may be Wove, and Manufacture for all the
    Uses that Cotton is put to : Perhaps we might have thought of making a sort of
    stuff, both of the *Capoc* and the Fibers of our Plantane Leaves ; but we had
    Stuff enough of our own to serve a long time, and the Air is so mild, so sweet,
    that we did not make much use of our Cloaths. Happy for us had we sav’d them ;
    for the time when the Persecution of a New *giv’n of God,[²](#C01_chapter_split_001.xhtml_fn8_88)*
    whom we shall speak of expos’d us to a thousand Miseries on the fatal Rock, whither
    that wicked Man banish’d us.There are several other kinds of Trees in this Island,
    which yield tolerable Fruit. Those that bear a sort of Pepper,[³](#C01_chapter_split_001.xhtml_fn8_89)
    are not a little like Plum-trees of a moderate size : Their Leaves are much like
    that of the Jessamine; they bear their Fruit in little Bunches, and it did very
    well in our Sauces.The Sea having thrown us up some Cocos which began to bud,
    we planted some of that Fruit some Months after our Arrival, and when we left
    the Place, the Trees were four Foot high.I leave it to the Reader to guess how
    these Cocoes,[⁴](#C01_chapter_split_001.xhtml_fn8_90) some of which weigh’d five
    or six Pound, can be thrown on the Coasts of *Rodrigo*, and come three or four
    score Leagues by Sea without Corrupting. For we are very certain they come from
    the Isle of *Sie. Brande*, which is to the Windward, to the North-East of Ours,
    and at least as far off as I have said.[¹](#C01_chapter_split_001.xhtml_fn8_91)The
    Sea brings in nothing but from that side, from whence we may conclude, there are
    certain Currents which contribute very much together with the Wind and Tide to
    throw abundance of things on the Coast.[²](#C01_chapter_split_001.xhtml_fn8_92)
    We may therefore suppose, these Fruits were blown off from the Isle of *Ste. Brande*,
    very far into the Sea ; and from thence brought to us by the Tide and the Currents.There’s
    a wonderful fine Tree at *Rodrigo*, whose Branches are so round, and so thick,
    ’tis impossible for the Sun-Beams to penetrate thro’ it : Some of these Trees
    are so big, that two or three hundred People may stand under them, and be shelter’d
    from the Sun or the Weather.[¹](#C01_chapter_split_001.xhtml_fn8_93)The vast Extent
    of it is occasioned thus. Some of the great Branches naturally tend downwards,
    and reaching the Ground take Root, and become new Trunks themselves, which make
    a sort of little Forest.The first time I saw this Tree, I remember I had read
    in some Voyages, that they are to be met with every where in the *Indies*, and
    in the Continent and Isles of *America*. I do not think there’s any of them in
    *Europe*. The Eastern Idolaters have a great Respect for them, and commonly build
    their *Pagods* under them.*La Boulaye le Gouz* writes,[¹](#C01_chapter_split_001.xhtml_fn8_94)
    that this sacred Tree is call’d *Kasta*, and that the *Indians* say, ’tis cherish’d
    by the Saints ; because their God *Pan* diverts himself with playing upon the
    Flute, under the shade of its broad Leaves.The same Author adds, that no Aran
    dares pull off one of those Leaves for fear of dying within the year ; and refers
    his Header to what *Herodotus* and *Quintas Cur tins* have said on the same Subject.
    *Tavernier*[²](#C01_chapter_split_001.xhtml_fn8_95) also speaks of it, and tells
    us the *Persians* call it Lull, but that the *Franks* have giv’n it the Name of
    the *Banians* Tree ; because the Penitents of the *Faquirs* and *Banians* dress
    their Meat, and pay their Devotions under this Tree.Mr. *de Rochefort* calls it
    *Pare-* *tuvier[¹](#C01_chapter_split_001.xhtml_fn8_96)* in his *Natural History
    of the Antilles*,[²](#C01_chapter_split_001.xhtml_fn8_97) and says, its Leaves
    are broad, thick and long, without saying any thing of the Fruit : And the two
    Voyagers before mention’d, tell us nothing either of the Fruit or of the Leaves.The
    *Rodrigo Kastas*[³](#C01_chapter_split_001.xhtml_fn8_98) (for I ought to keep
    the *Indian* Name at least in the *Indies*) bear Leaves as broad as one’s Hand,
    pretty thick, and somewhat like that of a Lilach or a Heart in shape, they are
    softer than Satin to touch. Their Flower is white, and smells well : Their Fruit
    is red and round, and as big as a black Damask Plum. Their Skin is hard, and within
    it is a thin Seed, a little like that of a Fig. The Fruit is not prejudicial to
    Health, but ’tis insipid. The Batts commonly feed upon it, and multitudes of them
    nest in the tufted Branches of this Tree.The Wood of all the Trees in this Island,
    is generally hard. We made this Observation in building our Cabbins ; The Timber
    we us’d about them, in a few Weeks after ’twas cut, wou’d be full of Worms, till
    to prevent that Inconvenience, we let it lie three Weeks in the Sea, and then
    the Worm never came into it.There is a Tree we call the *Nasty* Tree,[⁴](#C01_chapter_split_001.xhtml_fn8_99)
    because it stunk : ’Tis the best Wood of all for Carpenters use, but ’twas of
    no Service to us ; for it stinks so, that it makes all the Places about it smell
    of it, and the Smell is very Offensive.We did not find in this Island any Plant,
    Tree, Shrub, or Herb, which grows naturally in any part of *Europe*, that was
    known to us, except Purslain,[¹](#C01_chapter_split_001.xhtml_fn8_100) which is
    small and green, There’s plenty of it in some Places of the Valleys, and that
    which we sow’d having brought some of the Seed from the *Cape*, came up exactly
    like the Purslain of the Island.We saw no four-footed Creatures, but Rats, Lizards,
    and Land-Turtles,[²](#C01_chapter_split_001.xhtml_fn8_101) of which there are
    different sorts. I have seen one[¹](#C01_chapter_split_001.xhtml_fn8_102) that
    weigh’d one hundred pound, and had Flesh enough about it, to feed a good number
    of Men. This Flesh is very wholsom, and tasts something like Mutton, but ’tis
    more delicate : The Fat. is extreamly white, and never Congeals nor rises in your
    Stomach, eat as much as you will of it. We all unanimously agreed, ’twas better
    than the best Butter in *Europe*. To anoint one’s self with this Oil, is an excellent
    Remedy for Surfeits, Colds, Cramps and several other Distempers. The Liver of
    this Animal is extraordinarily delicate,[²](#C01_chapter_split_001.xhtml_fn8_103)
    ’tis so Delicious that one may say of it, it always carries its own Sauce with
    it, dress it how you will.The Bones of these Turtles are Massy ; I mean they have
    no Marrow in them. Every one knows, that these Animals in general are hatch’d
    of Eggs. The Land-Turtles lay theirs in the Sand, and cover them,[³](#C01_chapter_split_001.xhtml_fn8_104)
    that they may be hatch’d[⁴](#C01_chapter_split_001.xhtml_fn8_105) : The Scale
    of it, or rather the Shell, is soft, and the Substance within good to eat. There
    are such plenty of Land-Turtles in this Isle, that sometimes you see two or three
    thousand of them in a Flock ; so that one may go above a hundred Paces on their
    Backs ; or, to speak more properly on their *Carapaces*, without setting foot
    to the Ground. They meet together in the Evening in shady Places, and lie so close,
    that one wou’d think those Places were pav’d with them. There’s one thing very
    odd among them ; they always place Sentinels at some Distance from their Troop,
    at the four corners of their Camp, to which the Sentinels turn their Backs, and
    look with the Eyes, as if they were on the Watch. This we have always observ’d
    of them ; and this Mystery seems the more difficult to be comprehended, for that
    these Creatures are uncapable to defend themselves, or to fly.We have also great
    plenty of Sea-Turtles here : Their Flesh tasts like Beef, that of the Breast is
    admirable. The fat is as good as Veal Marrow, but being green, it has something
    the Air of an Ointment, which at first renders it Nauseous. This fat is not only
    delicate, but wholsom, and purges gently. The *Indians* make use of it as a Soveraign
    Remedy in the Venereal Disease.[¹](#C01_chapter_split_001.xhtml_fn8_106)The Sea-Turtles
    are prodigious big, we have seen some that weigh’d above 500 Round. When we wou’d
    take them, we turn’d them on their Backs by strength of Arms, or with Leavers
    ; and when they are overturn’d, ’tis impossible for them to get up again. They
    lay their Eggs in sandy Places near the Sea, and always in the Night-time ; they
    make a hole about three Foot deep, and a Foot broad for that purpose: The greatest
    of them will lay near two hundred in less than two Hours. They cover them with
    Sand, and in six Weeks time the Sun hatches them : As soon as they are hatch’d,
    all these little Animals which are not so big as a Chicken, just coming out of
    the Shell, go directly to the Sea, do what you will to hinder them ; they are
    generally hatch’d in an Hour’s time, We have often, to divert our selves, carry’d
    some of them a quarter of a League off on the Mountain, and as soon as we put
    them on the Ground, they immediately went directly to the Sea. They then go faster
    than when they are grown bigger.The Fools, the Frigats, and several other Birds
    which lie in wait for them upon Trees, destroy abundance of them when they are
    so young ; insomuch, that hardly ten in a Hundred of them are sav’d. Yet there
    are such prodigious Numbers, that ’twou’d have amaz’d one if we had not considered,
    every Turtle lays two thousand Eggs a year at times, that they have mltiply’d
    thus from the beginning of the World, and perhaps have not met with any Destroyers
    but our selves.Their Eggs are not quite so good to eat, as those of the Land-Turtles,
    neither is their Flesh so Delicate. They are of the same shape, and the white
    both of the one and the other cannot without a great deal of difficulty be changed
    ; but in length of time it changes so entirely, that it turns quite yellow.[¹](#C01_chapter_split_001.xhtml_fn8_107)
    The Liver of the Sea-Turtle hath not at all the Tast of that of the Land ; besides,
    ’tis very unwholsome, it smells offensive like bad Oil[²](#C01_chapter_split_001.xhtml_fn8_108)
    : ’Tis Rank, and rises in the Stomach a good while after it is eaten.These Animals
    feed upon Weeds at the bottom of the Sea, and never come a-shoar but to Lay. And
    I must observe here, *en passant*, that before that time they couple for nine
    days together without Disjunction.Their Fat remains Liquid when ’tis melted, and
    tasts Admirably, as well as that of the Land-Turtles. It may be made use of in
    all sorts of Sauces, either for Flesh or Fish.The Turtle is a dull, heavy sort
    of a Creature.[³](#C01_chapter_split_001.xhtml_fn8_109) It can live without eating
    a whole Month, provided ’tis discharged of the burthen of its Eggs, and you water
    it from time to time with some Pails of Sea-Water.The Lamentins,[¹](#C01_chapter_split_001.xhtml_fn8_110)
    which other Nations call *Ma-nati*, that is *having Hands*, abound in the Sea
    about this Isle, appearing often in numerous Troops. Its Head is extreamly like
    that of a Hog, whatever is said in Mr. *Corneille’s[²](#C01_chapter_split_001.xhtml_fn8_111)
    Diet ionarg of Arts and Sciences;* for in the Article of this Fish, of the difference
    of Palm-Trees, and several other things that have fallen within my Knowledge ;
    he is apt to erre frequently and grosly, as is the least imperfect Dictionary
    that ever was. He borrows the Heads of an Ox, of a Mole, of a Horse and a Hog,
    to Compose that of a Lamantin ; and in this case falls into the same Confusion,
    which happens to all that undertake to describe things they never saw, and have
    no distinct *Idæa* of. As for my self, I have seen, and carefully and nearly examin’d
    several ; wherefore I say again, that not only I, but my Companions also found
    the Head of a Lam en-tin was altogether very like that of a Hog, excepting that
    its Snout was not so sharp.The greatest of them are about twenty Foot long, and
    have no other Fins but the Tail and two Paws. The Body is pretty big down to the
    middle, and a little below it, the Tail has this in Particular with the Whales[¹](#C01_chapter_split_001.xhtml_fn8_112)
    ; that its breadth is Horizontal, when the Animal lies on its Belly. The Blood
    of this Creature is hot, its Skin is Black, very rough and hard, with some Hairs,
    but so few, they are scarce perceivable. Its Eyes are small, and it has two holes
    which it opens and shuts, and for that reason may be call’d (its) Gills and its
    Ears. Because it often draws in its Tongue, which is not very great, several have
    assur’d me it has none. It has Hind-Teeth,[²](#C01_chapter_split_001.xhtml_fn8_113)
    and even Tusks like a Boar, but no Fore-Teeth: Its Jaws are hard enough to bite
    Crass,[³](#C01_chapter_split_001.xhtml_fn8_114) its Flesh is excellent, and tasts
    something like the best Veal : ’Tis very wholsom Meat.The Female has Tets like
    Women’s ; Some say it brings forth two ‘ young ones at a time, and gives them
    Milk together, carrying them both at its Breast with its two things like Hands[⁴](#C01_chapter_split_001.xhtml_fn8_115)
    : But since I have never seen it hold but one, I encline to believe it bears no
    more at once.I never saw this extraordinary Nurse,[⁵](#C01_chapter_split_001.xhtml_fn8_116)
    without remembring with double Beason my own Condition, that of an Exile, and
    that Passage of the Prophet *Jeremy, in* his Lamentations, where he there Complains
    thus. *Even the Sea-Monsters[¹](#C01_chapter_split_001.xhtml_fn8_117) draw out
    the Breast, they give suck to their young ones ; (but) the Daughter of my People
    is become cruel like the Ostriches in the Wilderness.*(Lamentations, iv, 3.)This
    Fish is very easily taken, it feeds in Herds like Sheep, about three or four foot
    under Water ; and when we came among them did not fly, so that we might take which
    we wou’d of them, by either Shooting them,[²](#C01_chapter_split_001.xhtml_fn8_118)
    or falling upon them two or three at a time upon one without Arms, and pulling
    it a-shoar by main force. We sometimes found three or four hundred together feeding
    on the Weeds at the bottom of the Water, and they are so far from being Wild,
    that they wou’d often let us handle them to feel which was fattest. We put a Rope
    about its Tail, and so hale it a-shoar. We never took the greatest of them, because
    we cou’d not master them so easily, and they might perhaps have master’d us :
    Besides, their Elesh is not so Delicate as that of the little ones.Their Lard
    is firm and excellent, no body that ever saw and tasted the Flesh, took it for
    any thing but Butchers Meat. This poor Animal dies as soon as it has lost a little
    Blood. We discover’d that they were to be met with in these Seas, by finding one
    dead on the Shoar some Months after our Arrival on the Island. We did not observe
    that this Creature ever came to Land : We imagin’d it might be thrown there, for
    I do not take it to be Amphibious.We found several other sorts of Fish, and all
    different from those of *Europe,* except Oysters and Eels.We easily caught Sea-Eels
    with a line, as well as Fresh-Water. Between the Shelves,[³](#C01_chapter_split_001.xhtml_fn8_119)
    and the dry Land, there are certain spaces of Ground which are cover’d when the
    Tide is in, and dry when ‘tis out. In this Extent there are Ditches or sorts of
    Reservatories, which the Sea has dug, and which remain always full of Water, and
    also full of Fish. ’Tis there that we fish’d with Ease and Pleasure ; for the
    Water being very clear, we cou’d see the Fish catch greedily after the Bait ;
    and sometimes there wou’d be a kind of Battel about it, who shou’d bite first
    ; insomuch that we might catch abundance in a very little time.The fishing with
    a Net is not less Diverting, for we had the pleasure of taking a great number
    of Fish, whose Variety was very agreeable.About a thousand Paces from our Lodges
    there was a Creek, which was full of Sea-Water (at high tide), and at its entrance
    we cast our Net ; so that when the Sea went out, abundance of Fish remain’d dry,
    and we took up what we pleas’d, letting the rest go, as long as there was Water
    enough to carry them.We had also another Creek on the other side of our Cab-bins,
    and full of Oysters, sticking to the Rocks. We went often to Breakfast there,
    and brought some home, with which we made an excellent Ragout with Palm-Tree-Cabbages
    and Turtles fat.Of all the Birds in the Island, the most Remarkable is that which
    goes by the Name of the *Solitary,*[¹](#C01_chapter_split_001.xhtml_fn8_120) because
    ‘tis very seldom seen in Company, tho’ there are abundance of them. The Feathers
    of the Males are of a brown, grey Colour : The Feet and Beak are like a Turkeys,
    but a little more crooked. They have scarce any Tail, but their Hind-part cover’d
    with Feathers is Roundish, like the Crupper of a Horse, they are taller than Turkeys.
    Their Neck is straight, and a little longer in proportion than a Turkeys, when
    it lifts up his Head. Its Eye is black and lively, and its Head without Comb or
    Cop.[²](#C01_chapter_split_001.xhtml_fn8_121) They never fly, their Wings are
    too little to support the weight of their Bodies ; they serve only to heat themselves,
    and flutter[¹](#C01_chapter_split_001.xhtml_fn8_122) when they call one another.
    They will whirl about[²](#C01_chapter_split_001.xhtml_fn8_123) for twenty or thirty
    times together on the same side, during the space of four or five Minutes : The
    Motions of their Wings makes then a noise very like that of a Rattle ; and one
    may hear it two hundred Races off. The Bone of their Wing grows greater towards
    the Extremity, and forms a little round Mass under the Feathers, as big as a Musket
    Ball : That and its Beak are the chief Defence of this Bird. ‘Tis very hard to
    catch it in the Woods, but easie in open Places, because we run faster than they,
    and sometimes we approach them without much Trouble. From *March* to *September*
    they are extremely fat, and tast admirably well, especially while they are young,
    some of the Males weigh forty five Pound.The Females are wonderfully beautiful,
    some fair, some brown ; I call them fair, because they are of the colour of fair
    Hair : They have a sort of Peak like a Widow’s cap[³](#C01_chapter_split_001.xhtml_fn8_124)
    upon their Breasts, which is of a dun Colour. No one Feather is stragling from
    the other all over their Bodies, they being very careful to adjust themselves,
    and make them all even with their Beaks. The Feathers on their Thighs are round
    like shells at the end, and being there very thick, have an agreeable effect :
    They have two Risings on their *Craws*,[⁴](#C01_chapter_split_001.xhtml_fn8_125)
    and the Feathers are whiter there than the rest, which livelily Represents the
    fine Neck of a Beautiful Woman. They walk with so much Stateliness and good Grace,
    that one cannot help admiring and loving them ; by which means their fine Mein
    *(i.e.,* mien) often saves their Lives.Tho’ these Birds will sometimes very familiarly
    come up near enough to one, when we do not run after them, yet they will never
    grow Tame : As soon as they are caught they shed Tears without Crying, and (obstinately)
    refuse all manner of Sustenance till they die.We find in the Guards of both Male
    and Female a brown Stone, of the bigness of a Hens Egg,[¹](#C01_chapter_split_001.xhtml_fn8_126)
    ‘tis somewhat rough, flat on one side, and round on the other, heavy and hard.
    We believe this Stone was there when they were hatch’d, for let them be never
    so young, you met with it always. They have never but one of ‘em, and besides,
    the Passage from the Craw to the Gizard is so narrow, that a like Mass of half
    the bigness cou’d not pass. It serv’d to whet our Knives, better than any other
    Stone whatsoever.When these Birds build their Nests, they choose a clean Place,
    gather together some Palm-Leaves for that purpose, and heap them up a foot and
    a half high from the Ground, on which they sit. They never lay but one Egg, which
    is much bigger than that of a Goose. The Male and Female both cover[²](#C01_chapter_split_001.xhtml_fn8_127)
    it in their turns, and the young is not hatch’d till at seven Weeks end : All
    the while they are sitting upon it, or are bringing up their young one, which
    is not able to provide for its self in several Months,[³](#C01_chapter_split_001.xhtml_fn8_128)
    they will not suffer any other Bird of their Species to come within two hundred
    yards round of the Place : But what is very singular, is, The Males will never
    drive away the Females, only when he perceives one he makes a noise with his Wings
    to call the Female, and she drives the unwelcome Stranger away, not leaving it
    till ‘tis without her Bounds. The Female do’s the same as to the Males, whom she
    leaves to the Male, and he drives them away. We have observ’d this several times,
    and I affirm it to be true.The Combats between them on this occasion last sometimes
    pretty long, because the Stranger only turns about, and do’s not fly directly
    from the Nest : However, the others do not forsake it, till they have quite driv’n
    it out of their Limits. After these Birds have rais’d their young One, and left
    it to its self, they are always together, which the other Birds are not, and tho’
    they happen to mingle with other Birds of the same Species, these two Companions
    never disunite.[¹](#C01_chapter_split_001.xhtml_fn8_129) We have often remark’d,
    that some days after the young one leaves the Nest, a Company of thirty or forty
    brings another young one to it ; and the new fledg’d Bird with its Father and
    Mother joyning with the Band, march to some bye Place. We frequently follow’d
    them, and found that afterwards the old ones went each their way alone, or in
    Couples, and left the two young ones together, which we call’d a *Marriage.*This
    Particularity has something in it which looks a little Fabulous, nevertheless,
    what I say is sincere Truth, and what I have more than once observ’d with Care
    and Pleasure : neither cou’d I forbear to entertain my Mind with several Reflections
    on this Occasion. I sent Mankind to learn of the Beasts. I commended my *Solilarics*for
    marrying young (a piece of Wisdom practis’d by our *Jeiüs)*for satisfying Nature
    in a proper time ; and when she wants to be satisfy’d according to the state of
    the same Nature, and conformable to the intention of the Creator. I admir’d the
    Happiness of these innocent and faithful Pairs, who liv’d so peaceably in constant
    Love : I said to my self, if our Pride and Extravagance were restrain’d, if Men
    were or had been as wise as these Birds, to say all at once, they wou’d marry
    as these Birds do, without any other Pomp or Ceremony, without Contracts or Jointures,
    without Portions or Settlements,[²](#C01_chapter_split_001.xhtml_fn8_130) without
    subjection to any Laws, and without any Offence, with which Nature wou’d be most
    pleas’d, and the Common-Wealth most benefited ; for Divine and Human Laws, are
    only-Precautions against the disorders of Mankind. Know, kind lieader, that my
    chief Employment in this Desart Island was thinking, and suffer me therefore sometimes
    to speak my Thoughts. I have already giv’n you notice, that you were not to expect
    a Dissertation on the *Antiquity* of *Greek* Accents, nor on Manuscripts of our
    *Eden,* nor on the Medals found there, any more than Descriptions of its Amphitheaters,
    Palaces and Temples.![Image](Images/5.jpeg)Our Wood-hens[¹](#C01_chapter_split_001.xhtml_fn8_131)
    are fat all the year round, and of a most delicate Tast. Their Colour is always
    of a bright Gray, and there’s very little difference in the *Plumage* between
    the two Sexes. They hide their Nests so well, that we cou’d not find ‘em out,
    and consequently did not tast their Eggs. They have a red List[²](#C01_chapter_split_001.xhtml_fn8_132)
    about their Eyes, their Beaks are straight and pointed, near two Inches long,
    and red also. They cannot fly, their fat makes ’em too heavy for it. If you offer
    them any thing that’s red,[³](#C01_chapter_split_001.xhtml_fn8_133) they are so
    angry they will fly at you to catch it out of your Hand, and in the heat of the
    Combat, we had an opportunity to take them with ease. We had abundance of Bitterns,[⁴](#C01_chapter_split_001.xhtml_fn8_134)
    as big and as good as Capons ; they are more familiar, and more easily to be caught
    than Woodhens.The Pigeons[¹](#C01_chapter_split_001.xhtml_fn8_135) here are somewhat
    less than ours, and all of a Slate colour, fat and good. They pearch and build
    their Nests upon Trees ; they are easily taken, being so Tame, that we have had
    fifty about our Table to Pick up the Melon-Seeds which we threw them, and they
    lik’d mightily. We took them when we pleas’d, and ty’d little Eags to their Thighs
    of several Colours, that we might know them again if we let them loose. They never
    miss’d attending us at our Meals, and we call’d them our Chickens. They never
    built their Nests in the Isle, but in the little *Islets[²](#C01_chapter_split_001.xhtml_fn8_136)*
    that are near it. We suppos’d ‘twas to avoid the persecution of the Eats, of which
    there are vast Numbers in this Island, as I shall report in the Sequel of this
    Eelation. The Eats never pass into the Islets. The Pools,[³](#C01_chapter_split_001.xhtml_fn8_137)
    the Frigats[⁴](#C01_chapter_split_001.xhtml_fn8_138) and perhaps some other Sea-Birds
    who live upon Fish only, build their Nests on Trees ; but[⁵](#C01_chapter_split_001.xhtml_fn8_139)
    there are some other Birds that sit on the Land, in the same Isles where the Pigeons
    nest. All these Birds have a rank Taste, which is not agreeable; to make amends
    their Eggs are very good. The Fools come ev’ry Night, and Boost in the Island
    ; and the *Frigats* which are Larger, and so call’d because they are light, and
    admirable Sailers,[¹](#C01_chapter_split_001.xhtml_fn8_140) lie in wait for them
    on the top of the Trees, from whence they flounce down upon them like Falcons
    on their Prey, not to kill them, but make them bring up the Fish that is in their
    Craw, which the Fool as soon as it is thus struck, is forc’d to do. The Frigat
    catches it always before it comes to the Ground. The Fool cries, and sometimes
    is very unwilling to part with its Prog, but the Frigat who is a bolder and stronger
    Bird, laughs at its Cries, mounts into the Air, and down he flounces again upon
    it, seizes upon the Throat, and do’s so till he has compell’d it to obey.The Frigat[²](#C01_chapter_split_001.xhtml_fn8_141)
    is blackish, and about the bigness of a Duck. Its Wings are very large, ‘tis a
    sort of Bird of Prey ; for it has Talons, and its Beak which is above half a Foot
    long, is a little crooked at the end. The old ones of the Males, have a kind of
    red Flesh like a Comb under its Neck, as our Cocks have. The *Fools* are so call’d
    because they inconsiderately come about Ships, Perch on the Ropes, and innocently
    suffer themselves to be easily taken. Their Simplicity is so great, that they
    judge of others by themselves, and do not take Men to be Mischievous Creatures.
    Their Backs are of a Chesnut Colour, their Bellies whitish, their Beaks sharp,
    four Inches long, and big towards the Head, a little indented at the Edges. Their
    legs are short, their feet like those of a Duck, and of a pale Yellow.There’s
    another sort of Bird[³](#C01_chapter_split_001.xhtml_fn8_142) as big as a Pigeon
    all over white, its Beak is short and strong, it has a Feather at its Tail a Foot
    and a half long, from whence it takes its Name being call’d *Straw-Tail.* These
    Birds made a pleasant War upon us, or rather upon our Bonnets ; they often came
    behind us, and caught ‘em off our Heads before we were aware of it : This they
    did so frequently that we were forc’d to carry Sticks in our hands to defend our
    selves. We prevented them sometimes, when we discover’d them by their shadow before
    us : we then struck them in the Moment they were about to strike us. We cou’d
    never find out of what use the Bonnets were to them, nor what they did with those
    they took from us.I shall speak of the *Tag* and the *Pluto* in *Maurice* Island.
    There’s but one sort of small Birds[¹](#C01_chapter_split_001.xhtml_fn8_143) at
    *Punlrigo,* they are not much unlike Canary Birds ; we never heard them sing,
    tho’ they are so familiar, that they will place themselves on a Book which you
    hold in your hand.There are abundance of green and blew Barrets,[²](#C01_chapter_split_001.xhtml_fn8_144)
    they are of a midling and equal bigness ; when they are young, their Flesh is
    as good as that of young Pigeons.![Image](Images/6.jpeg)There are Purrs[¹](#C01_chapter_split_001.xhtml_fn8_145)
    and a few Swallows.[²](#C01_chapter_split_001.xhtml_fn8_146)The Batts[³](#C01_chapter_split_001.xhtml_fn8_147)
    fly there by day as well as other Birds ; they are as big as a good Hen, and each
    wing is near two Foot long. They never Perch, but hang by their Feet to the Boughs
    of Trees, with their Head downwards, and their Wings being supply’d with several
    Hooks, they do not easily fall tho’ they are struck.[⁴](#C01_chapter_split_001.xhtml_fn8_148)
    When you see them at a Distance, hanging thus wrapt up in their Wings, you wou’d
    take them rather for Fruit than Birds. The *Dutch* whom I knew at *Maurice* Island,
    made a rare Dish with them, and preferr’d it to the most Delicate Wild-Fowl. Every
    Man has his Tast ; As for us, we found something in these Batts that we did not
    like, and having a great many things that were much better, at least in our Opinion,
    we never eat any of these filthy Creatures. They carry their young about with
    them[¹](#C01_chapter_split_001.xhtml_fn8_149); We observ’d they had always two.The
    Palmtrees and Plantanes are always loaden with Lizards[²](#C01_chapter_split_001.xhtml_fn8_150)
    about a foot long, the Beauty of which is very Extraordinary ; some of them are
    blue, some black, some green, some red, some grey, and the colour of each the
    most lively and bright of any of its kind. Their common Food is the Fruit of the
    Palm-Trees. They are not mischievous, and so Tame, that they often come and eat
    the Melons on our Tables, and in our Presence, and even in our Hands[³](#C01_chapter_split_001.xhtml_fn8_151)
    ; they serve for Prey to some Birds, especially the Bitterns. When we beat ’em
    down from the Trees with a Pole, these Birds wou’d come and devour them before
    us, tho’ we did our utmost to hinder them ; and when we offer’d to oppose them,
    they came on still after their Prey, and still follow’d us when we endeavour’d
    to defend them.There’s another sort of Nocturnal Lizards[⁴](#C01_chapter_split_001.xhtml_fn8_152)
    of a grayish Colour, and very ugly ; they are as big and as long as ones Arm,
    their Flesh is not very bad, they love Plantanes. We found Salt enough in holes
    on the Rocks upon our Coasts, and had the Island been full of Inhabitants, they
    might have been supply’d there. The Waves throw up the Sea-water in their Agitation,
    and the Sun, that admirable Workman of all the Metamorphoses of Nature, turns
    it into Salt. The Sea brings yellow Amber and Ambergreece.[¹](#C01_chapter_split_001.xhtml_fn8_153)
    We found a great piece of the latter, which we did not know, and which prov’d
    the cause of all the Misfortunes that happen’d to us afterwards, as will be related
    in. the sequel of this History. We found also abundance of a sort of black Bitumen,
    to which we gave the name of Amber, but I believe ‘tis properly Jet.There’s a
    certain admirable Flower[²](#C01_chapter_split_001.xhtml_fn8_154) in this Island,
    which 1 shou’d prefer to *Spanish* Jessamine, ‘tis as white as a Lily, and shap’d
    something like common Jessamine. It grows particularly out of the Trunks of rotten
    Trees, when they are almost reduc’d to the Substance of Mould. The Odour of this
    Flower, strikes one agreeably at a hundred Paces distance.The Air of this Isle
    will not suffer Lice or Fleas, as one may be assur’d by Experience after such
    a Voyage as ours. Neither were we troubled by any stinging Flies, nor other Insects
    that are so troublesom in the Night, or rather so intolerable, in other Places.In
    those little Islands[¹](#C01_chapter_split_001.xhtml_fn8_155) before-mention’d
    where the Pigeons build, there are an infinite number of Sea-Fowl ; their Flesh
    (is) not pleasant to the Taste, nor very wholesom, but their Eggs are very good.
    There’s such abundance of these Birds,[²](#C01_chapter_split_001.xhtml_fn8_156)
    that when they rise, the Sky is even darken’d by them.They hatch on the Sand,
    and so near one another that they touch, tho’ of different Kinds. These poor Creatures
    are so Tame, and so little Diffident, that they will not rise tho’ you are almost
    upon them. They lay three times a year, and but one Egg at a time, like the *Solitaries
    ;* which is the more Remarkable, for that if I am not Mistaken, we have no Example
    of any thing like it among our *European* Birds. I shall add one very particular
    thing which I observ’d in some of these Birds in *Maurice* Island, when I come
    to treat of that Isle.Thus have I related the most considerable Observations we
    made in and about the Island of *Rodrigo.* I must now, to give the Reader a true
    *Idaect* of the Place, take notice of the disagreeable and inconvenient things
    in it : I shall begin with what we first saw. As soon as we Landed, we were surrounded
    by a prodigious Number of certain little Flies which cover’d us. ‘Twas in vain
    to kill them, for after you had bruis’d ten Thousand of them to pieces, they wou’d
    be no more mist, than ten drops of “Water in the Sea. ‘Tis true, these little
    Creatures did not sting ; all the Inconvenience they put us to was a little tickling
    when they touch’d our Faces. They retire to the Trees as soon as the Sun is down,
    and leave them when it Rises. They always seek shelter, and the mild cooling Breeze
    ; and after we had fell’d the Trees about the Place where we built our Cabins,
    it expos’d them so much to the Wind, that it drove ‘em to the Woods, and delivered
    all the extent of our Habitations entirely from them. But we met with them every
    where when we walkt out into the Island.There’s also a kind of great Flies which
    do not fear the Wind as the others do, and are very Troublesom. Their Bellies
    are fall of Worms, which they lay on our Meat, and sometimes let ‘em fall as they
    fly along, so that those Provisions quickly tainted, when, instead of leaving
    them open to the Air, we wrapt them up in Linen. The only means we found out to
    cure this Evil, was to dip them in Sea-Water from time to time. The Nerves or
    Fibres of the Stalks of our Plantane-Leaves wou’d have made an excellent fine
    Trellis which those Flies cou’d not Penetrate, and with which we might have made
    a *Safe* to secure our Meat, but we did not think of that Machine.The Rats were
    our second Plague, they are like those in *Europe,* are very Numerous, and very
    Troublesome.They did not only eat the Seed we sow’d, but came into our Cabbins,
    and nibbled everything they found there. I am apt to doubt whether Mr. *de Rochefort*
    was well inform’d when he wrote there were no Rats in the *American* Islands before
    our Discoveries there[¹](#C01_chapter_split_001.xhtml_fn8_157) ; for I have often
    found in the Reiation of Voyagers that they met with prodigious quantities in
    Desert and unknown Islands. It’s not impossible that some Ship might have touch’d,
    or been cast away there ; but let our Modern Philosophers say what they will,
    I have very good reason to believe, that Eats as well as other kind of Vermin
    are engender’d sometimes by Corruption, tho’ they are also brought forth by the
    common way of Generation. If ‘tis the good pleasure of God, the Great Master of
    the Universe, that it shou’d be so, what shou’d hinder Eats being found in those
    Islands where never any vessel was ?[²](#C01_chapter_split_001.xhtml_fn8_158)Whereas
    the *Americans* have Adders which are naturally bent to exterminate this Villanous
    Race, as also Cats and Dogs that are taught to make War upon them, we had nothing
    to assist us but Owls[³](#C01_chapter_split_001.xhtml_fn8_159) and Traps. We soon
    banish’d them from our Quarters, by the help of the latter ; however we must own,
    that a new Multitude sometimes return’d, and found us new Work to clear them.
    The most ready and sure way of getting rid of great Numbers of them, wou’d be
    to lay poyson’d Meat for them ; the Island not being very big, this wou’d soon
    have a very good Effect ; and nothing could come of it that we needed apprehend,
    if it happen’d before the Isle was well setled.The several Inconveniences occasion’d
    by these Animals when they come thus by Armies, render Credible what is said of
    that young *English* Adventurer (Richard Whittington, in the year 1397) who made
    his Fortune by a Cat which he carry’d out of his Country by chance, and which
    he presented to a Lord in some Island in the *Indies.* This little Prince charm’d
    with the Cat’s admirable Hunting, liberally Rewarded him who brought it ; and
    who having set a high Price upon it, return’d Rich to *London,* and became Lord
    Mayor. He is often to be seen painted with his Cat in his Mayors Habit, and serves
    for one of the *Signs* in that City.The Land-Crabs[¹](#C01_chapter_split_001.xhtml_fn8_160)
    were our next Enemies. ’Tis impossible to destroy them, there’s such a prodigious
    quantity of them in the low Grounds, and ‘tis very difficult to get them out of
    their Holes.[²](#C01_chapter_split_001.xhtml_fn8_161) Their Burroughs are very
    broad, and have several Entrances ; they never go far from them, standing always
    upon their Guard.They tore up our Plants in our Gardens day and Night, and if
    we shut up the Plants in a sort of a Cage in hopes of saving them, if they were
    not far off, they wou’d dig under Ground from their Burroughs to the Plants, and
    tear them up under the Cage. The back Scale or Shell of this Crab is of a dirty
    Russet Colour, is almost round, and about four Inches Diameter. They march directly
    with eight Claws or Paws, about four Inches from the Ground, and have two that
    are indented of an unequal Bigness, as we know all sorts of Crabs have, the Right
    Claw or Paw being bigger and stronger than the rest. You cannot see the Mouth
    of one of them when it goes along, because it is downwards, but its Eyes are much
    like those of the Crabs in *France* and *England,* are a good Inch one above another
    on the Brink, and without the Shell.When one approaches it, it presently retires;
    but when we throw Stones after it, ‘twill always run after the Stones, by which
    it is easily struck ; ‘tis dangerous venturing to be pinch’d by it. This Animal
    often cleans its Hole, and after having made a little heap of the Ordures it finds
    there, it carries them out by Pressing them against its Belly with its Claws.
    This it do’s often, and with so much nimbleness, that it soon removes what is
    Troublesom to it. Its Flesh is pretty good, and tasts something like Biver-Crabs.A
    little before and after the Full-Moons in *July* and *August,* these Crabs march
    by Millions, from all parts of the Island to the Sea. We never met with one but
    what was laden with Epgs. We might then have destroy’d great quantities of them
    with ease, for they go in prodigious Troops, and being far from their Burroughs,
    have no place of Betreat. We have sometimes kill’d above three Thousand in an
    Evening with Sticks, yet we cou’d not perceive the next Day, that their Number
    was at all Diminish’d. The Second year of our abode in this Isle, we thought of
    a way to rid our selves of them, in some measure ; which was, by Sowing abundance
    of Seed in the places where they most Inhabited ; that finding Occupation enough
    at Home, they might save our Plants, which if they had time to grow to any bigness,
    were out of danger. This helpt us a little, and we were so cautious as to Sow
    those Plants which we were willing to Cultivate, in Places they did not frequent,
    as well in our Gardens, as in Hills far from the Bivers where the bottom was Rock.One
    of our Companions who at all ventures had brought two great Chests of Merchandise
    with him, which were in demand in *India,* and also a good quantity of *louis
    d’ors,* but was at least as Diffident as Rich, was pleasantly caught by one of
    these little Beasts. His Pistoles were in several Purses ; and we observ’d, if
    he went at any time a little way from his Cabbin, he took them along with him.
    He never fail’d to hide them every Night before he went to Bed, in the safest
    place he cou’d think of; but as cunning as he was he found one that was as cunning
    as he, and was bubbled[¹](#C01_chapter_split_001.xhtml_fn8_162) by a Thief, he
    did not think of, I mean, some Crab or Eat that took away one of his Purses from
    him ; which being of Leather,[²](#C01_chapter_split_001.xhtml_fn8_163) was no
    doubt very agreeable to the Bobbers Tast. The next day we perceiv’d he was Chagrin,
    and search’d for something with great Application ; we prest him to tell what
    he had lost, and at last through Importunity, or hoping we wou’d help him in finding
    it, he told us the whole truth of the Matter. Tho’ we cou’d not forbear Laughing
    a little, we however went about with him to seek it, but all our seeking signify’d
    nothing, and the Person Rob’d was forc’d to comfort himself for the Robbery. ‘Tis
    true, he ever after made War[³](#C01_chapter_split_001.xhtml_fn8_164) upon the
    whole Nation of Crabs, and we assisted him in it. He never kill’d one without
    giving him some blows after he was dead.The Sea-Crabs are much better[⁴](#C01_chapter_split_001.xhtml_fn8_165)
    than the Land, and the Flesh easier to Digest.There’s also another sort which
    I am inform’d goes by the Name of *Tourlouroux[¹](#C01_chapter_split_001.xhtml_fn8_166)*
    in the *Antilles,* and are very like the first Crabs I spoke of, but somewhat
    less. They dwell between the Sea and the Land like true Amphibious Creatures,
    as they are ; insomuch that the Sea twice a Bay fills their Holes with Water,
    and they are continually at work to keep ’em clean.The Hurricanes[²](#C01_chapter_split_001.xhtml_fn8_167)
    which we were terrify’d with every year, in the Month of *January* or *February,*
    as I have already noted, is also a dreadful Enemy. We felt its rude Attacks twice.
    This furious Wind rises commonly after fair Weather, and even after a great Calm
    ; and its greatest Violence lasts at least an Hour. We then saw several huge Trees
    torn up by the Roots in a Moment, and our Cabbins utterly over-whelm’d. The Sea
    Raging and Foaming roar’d so, that it frighted us ; and lifting up its foaming
    Waves like Mountains, dashed ’em against the Coasts with so much Impetuosity,
    that it seem’d as if Nature was in such Convulsions, as wou’d soon reduce her
    to her Original Chaos. Heaven and Earth mingled, a thick Darkness involv’d the
    Sky, and the Clouds breaking discharg’d a Deluge of Rain, like that which immerg’d
    the first World. Our fair and fruitful Valleys were immediately drown’d, and look’d
    like a new Ocean. The Torrent overwhelm’d every thing that lay in its way ; and
    I believe if this Violence had lasted three Hours, there was not a Tree in the
    Island that could have resisted it. The Beasts by a natural Instinct of Gracious
    and wise Providence, foresaw these Storms before they happen’d, and sav’d themselves
    in the Cavities of the Mountains ; but the next Day they appear’d abroad as before,
    for the Weather returned to be as fair and clear as ever. The last Hurricane we
    felt at *Rodrigo,* was much more terrible than the first. In the midst of its
    greatest Fury, there was a sudden and profound Calm, not the least Noise was heard,
    and we believ’d all was over, when immediately the Storm return’d with more Violence
    than ever. It entirely destroy’d all our Gardens ; for the force of the Wind rais’d
    up the Waters of the Sea, and blew about ev’ry where a deluge of Salt Water that
    burnt up or kill’d all our plants. But it doing no hurt to the Soil at bottom,
    as soon as we got out of the Holes of the Bocks to which we fled we sow’d more
    Plants, and they came up as before.In fine, The fourth and last Enemy we had to
    Combat with, were little green Caterpillars, which always come after a Hurricane,
    and are certainly one of its secret Productions. These Insects troubled us very
    much, from the Month of *February,*to that of *April ;*for they eat up our Melons,
    not leaving a Leaf on the Trees. Experience taught us the way to prevent it, which
    was by covering ’em all Night, and uncovering them in the Morning ; Glass Bells
    wou’d have been a good Buckler for them. These Vermin did not touch our Succory,
    nor our Purslain ; and we may therefore reasonably conclude, that there are several
    sorts of other Herbs and Plants which they will not meddle with, as not being
    to their Gust.[¹](#C01_chapter_split_001.xhtml_fn8_168)In some Places we met with
    little Scorpions, especially on the Plantanes ; but we did not find that they
    were any way dangerous, because we were several times stung by them, without any
    Inconvenience afterwards. It only caus’d a little Pain for a Moment or two, like
    the prick of a Pin.When we bath’d our selves in the Sea, or when we were oblig’d
    to walk in our Fishing, we were often surrounded with a great Troop of Sharks,
    among which some were very great, yet we were never attack’d by them. And when
    we were on that fatal Rock of the Isle *Maurice,* which I shall say more of hereafter,
    I have a hundred times seen a great Pack of Dogs follow a Stag into the Sea, and
    Swim after him in places where were abundance of Sharks ; yet they never did them
    any hurt, any more than they did us when we were Bathing. Let the Reader therefore
    judge, whether this is such a Voracious Animal as ‘tis represented to be, or whether
    the Sharks in these Seas are different from those, in others. The Relations of
    such as have made Voyages to *America,* and several other parts of the World,
    tell us unanimously, that the Sharks in those Seas are extreamly dangerous and
    ravenous, and several Persons speak as if they had been Eye-Witnesses of it ;
    wherefore ‘tis most reasonable to conclude, that all the Sharks are not of the
    same kind.[¹](#C01_chapter_split_001.xhtml_fn8_169) This Fish is commonly fifteen
    or sixteen Foot long ; its Mouth is so made, that it must necessarily turn upon
    its Back to swallow its Prey, or must thrust half its Head out of Water ; it has
    several rows of Teeth, which are extreamly sharp, and like those of a Saw. I was
    told at *Batavia,* and elsewhere, that the Brain of a Shark had a Virtue in it,
    which made Womens Pains in Child-Bed not so racking to them, as they generally
    are ; but we cou’d not try the Experiment in our Island. Some say, the little
    Fish which we call Succet,[²](#C01_chapter_split_001.xhtml_fn8_170) or the Shark’s
    Pilot, is his Guide, but that’s a Chimera, which Father *Tachard*[¹](#C01_chapter_split_001.xhtml_fn8_171)
    has very well Confuted. This Succet which is reasonably enough thought to be the
    Rhemora, those good Men of old (who are venerably call’d Antients,[²](#C01_chapter_split_001.xhtml_fn8_172)
    and who often did not know very well what they said) have render’d so famous and
    formidable. This Succet, I say, has on its Head, and on the forepart of its Keck
    a grisly Membrane flat, & in Folds by which it sticks fast to the Back of the
    Sharks and Sea-Dogs, and sometimes to inanimate things as Wood ; for we have seen
    it stick to the Deck of the Ship with its Belly upwards.[³](#C01_chapter_split_001.xhtml_fn8_173)
    There are at least two sorts of them, different in Bigness and Colour, but shap’d
    alike; they have no Scales, and their Skin is as slick and slippery as an Eel’s.
    Those of the biggest sort are two or three Foot long ; the colour of their Backs
    is a greenish Brown, which towards the Belly turns whitish. The others are not
    longer than Herrings, hardly so long. Their Snouts are shorter, and not so dark
    Colour’d. The Flesh of both the one and the other is not firm, but ‘tis not ill
    tasted. They are very well provided with Fins, and are thin and long ; so that
    they dart into the Sea like an Arrow out of a Bow. Their Teeth are a little round
    at the end, and so short, they are scarce perceptible. ‘Tis most certain that
    these Fish often stick to the Ships in the Water, and when they do it in a great
    Number, they doubtless hinder her Course, because she cannot run so lightly over
    the Waves. I was the more willing to speak of this Animal at large, for that others
    have not done it; and I cannot help saying, *en passant,* that I sometimes wonder
    at the mighty Reputation the Famous *Rondelet* acquir’d ; for I never consulted
    him concerning any thing within my Knowledge, but I found him very false and very
    dry.[¹](#C01_chapter_split_001.xhtml_fn8_174)All our Employment as long as we
    staid in this Island was very Insignificant, as may be easily imagined ; however,
    we cou’d not live without doing something. The looking after our Cabins, and Cultivating
    our Gardens, took up one part of our Time, Walking, another. We frequently went
    to the South of the Island, either in crossing it, or going about it ; there’s
    no Place upon it but we Visited very nicely ; none of the Mountains or Hills are
    without Verdure, tho’ they are very full of Rocks. The bottom which is Rock, is
    spread with two, three or four foot Earth, and amongst the Stones where there’s
    no appearance of Earth, great Trees tall and straight grow, which at a distance
    gives one a better *Idæa* of the Island than it deserves, because one wou’d think
    it was compos’d of a Soil universally Excellent.One may go every where all over
    it with ease, there being few or no parts of it, which are not very Accessible,
    and no Place but affords abundantly Meat and Drink. Go where you will, and if
    you see no Game, you need only strike against a Tree, or cry out as hard as you
    can, and Game will immediately offer it self of all sorts, which you may knock
    down with a Stick or Stone. ’Twas Chance made us experience this, because when
    we walkt out together and wander’d in the Woods, if any one of us lost Company
    with the rest, we were forc’d to cry aloud to let him know where we were, that
    he might come to us. We were then amaz’d to see what quantities of Birds flew
    out, and ran up and down from all parts about us ; Providence as it were bid us
    *Kill* and *Eat,*[¹](#C01_chapter_split_001.xhtml_fn8_175) and we had nothing
    to do but to fire a Fuzee, and roast what we kill’d to provide a Feast ; Turtles
    are to be met with every where. The Air is so sweet and so temperate, that one
    might lye down boldly under the Canopy of the Sky ; but if we pleas’d, might at
    any time make a sort of Hutt immediately with five or six Plantane-Leaves which
    we have spoken of.To return to our Employments, and the manner of spending our
    tedious Hours, I shall add without Boasting, that we had every day our exercises
    of Devotion. On Sundays we did as far as we cou’d what is practis’d in our *French*
    Churches, for we had the Bible entire with us ; some Hymns, a large Commentary
    on the Testament, and several Sermons upon the *Old Rock,* which were sensible
    Discourses. If we had believ’d we shou’d spend the rest of our Days there, or
    at least stay some longer time than we did, or intended, what shou’d have hinder’d
    the Wisest among us from taking upon him the Ministerial Office ; and that these
    two or three meeting together, and in the Name of God, shou’d not have forni’d
    a true Church, and have receiv’d those particular Consolations which are participated
    in the Holy Communions.I often thought of proposing it to my Companions ; but
    on one hand, I saw they were all dispos’d to endeavour suddenly, at the hazard
    of their Lives, to return into the inhabited World. On the other I had reason
    to fear there wou’d be thought some kind of Affectation in that Design, which
    they wou’d not have been pleas’d with. For in the Reflections we sometimes made
    upon Religion, we were always on our Guard in an extraordinary manner, least we
    shou’d fall into any Practice, or have any Idæa *which* tended in the least to
    Superstition, the most dangerous and most fatal Pest of Christianity. We were
    so happy, as to be united all in the same Spirit, without the false Wisdom of
    the *Sagen*, and that Pernicious knowledge of the Learned, the Disputers and Innovators
    of this Age, which, have caus’d so many wicked Sects, and other Disorders in the
    Christian World. The Errors of the *Roman Catholicks* and some others in the matter
    of the necessity of Baptism, ought to be a Lesson to us, not to fall into the
    like Mistake, in the use of the other Sacrament, the Practice of which by the
    common consent of all the Christians this day alive is not in it self necessary.
    We found a great Comfort in our selves, in keeping closely to that Pure and Primitive
    Evangelical Doctrine, which all Divines without exception say, contains the Soul
    and Essence of saving Faith, without entring into any Inquiries, which had the
    least appearance of Unprofitableness or Curiosity. We delighted in, and often
    Repeated Passages out of the Scripture, and these offered themselves to our Remembrance.
    *All that I propose to you is to know Jesus Christ, and him Crucify’d. This is
    eternal Life to know thee, the only true God, and Jesus Christ whom thou hast
    sent. If thou confessest the Lord Jesus with thy Mouth, and believe in thy Heart
    that God has raisd him from the Dead, thou shall be Sav’d. Whoever believes in
    me, has eternal Life. Whoever calls upon the Name of the Lord shcdl be sav’d.
    I have dcclar’d unto you all the Counsel of God, to wit, Repentance towards God,
    and Faith in Jesus* *Christ. The Religion that is Pure and without* & *Spot towards
    our God and, Father, is to visit the Orphans and Wido us in their Tribulations,
    and to avoid the Defilements of the World*, &c.[¹](#C01_chapter_split_001.xhtml_fn8_176)
    We were free from the accidental Theology of Controversies, from Chimerical and
    Heretical *Idæas*, which we look’d upon, as if they had never been ; from all
    Superstitious Fooleries, from all vain, impertinent rash Thoughts, which are as
    Pernicious to the Soul, as they are unreasonable ; and had a delicious Taste of
    the excellency of simple and pure Religion. We abhorr’d as the sacred Writers
    did, those Makers or Botchers[²](#C01_chapter_split_001.xhtml_fn8_177) of Religion,
    who accommodate the Doctrine and Worship of Christianity to their own fancies,
    pretending to be more wise than Wisdom it self. We ador’d God the Creator in purity
    and simplicity of Heart. We worship’d Father, Son, and Holy Ghost, according to
    the Terms and Rules of Revelation, without valuing our selves on foolish Explanations,
    or endeavouring to unfold the sacred Mysteries, which by the confession of all
    Men are necessarily, and will always be hidden from mortal Men, and impenitrable
    to Human Eye; or they wou’d cease to be *Mysteries*. We thus invok’d the Almighty
    with Joy and Confidence, (doing good as far as we cou’d) by the Meditation[³](#C01_chapter_split_001.xhtml_fn8_178)
    of our Redeemer and Saviour Jesus Christ, the way, the Truth and the Life. In
    these happy Dispositions we look’d on Death, not as a Terror, but as the Messenger
    of glad Tidings.Besides those great Walks, or rather those little Journeys we
    us’d to take, we never mist walking out in the Evening, in the Neighbourhood of
    our Habitations. We had one Walk among others on the Sea-shoar to the left of
    our Rivulet, and ’twas a very lovely one. ’Twas an avenue to it form’d by Nature,
    as straight as if it had been planted by a Line at a parallel Distance, from the
    Sea ; and about twelve hundred Paces long, which is exactly the length of the
    Mall at *London*, in the fine Park at *St. James’s.[¹](#C01_chapter_split_001.xhtml_fn8_179)*
    We might have lengthen’d it to seven or eight Miles if we wou’d, and upon firm
    Ground, which was a perfect Level. We had on one side of this delicious Walk a
    View of the vast extended Ocean, and heard the confus’d murmur[²](#C01_chapter_split_001.xhtml_fn8_180)
    of the Waves breaking against the Eocks, about a League off, so that ’twas not
    loud enough to disturb our Conversation ; it only threw us often into Contemplations,
    to which we gave our selves up with the greater Pleasure, because we had not much
    to say to one another. On the other side (inland) our Prospect was agreeably bounded
    by charming Hills, and the Valleys which reach’d to it were like a fine Orchard
    in the sweet and rich Seasons of Autumn.Among the great number and variety of
    Trees in this Island planted by Nature, there is one which is wonderful and worthy
    our particular Observation, for its Beauty, Bigness, Roundness, and the rare Symmetry
    of its exact Branches ; the ends of which are every where very much tufted, and
    its Leaves so great and thick, that they fall down almost to the Ground all about
    it ; so that come which way you will at this Tree, you can perceive but a small
    part of its Trunk, and that at the bottom of it; and sometimes you can see nothing
    at all of it.[³](#C01_chapter_split_001.xhtml_fn8_181)It being as one may imagine,
    all shady in the middle, the Branches are within-side like dry Poles, which seem
    to be the work of a Carpenter, and set there to bear up the Plumes or Branches
    which are quite about it, and thus make a sort of Cage or Tent of the Tree. ’Tis
    true, the greatest beauty of this Tent, is in its charming Outside, though the
    coolness and shelter of the inside have also their Charms ; ’twas unhappy that
    its Fruit was not good to eat. Those of us who had the Curiosity to eat it, found
    it Sour, and knew by Experience, that was all the hurt that was in it. It has
    the smell of a very fine Quince ; ’tis a sort of a Grape, the Seeds of which are
    close and all together. It lookt at a distance like the Fruit of the *Ananas*.
    For which reason we us’d to call these Trees *Ananas ;* tho’ there’s a great difference
    between the two Plants. As for me, I was for calling it the *Pavilion* or Tent.
    The Leaves are of an admirable Green, and the Stalks of them are so short, that
    one wou’d think they grew immediately to the Wood. The greatest are four or five
    Inches broad, sharp at the end and about fifteen inches long. They form a great
    Bunch, and here and there one may see the Grapes, which are of divers Colours,
    according as they are more or less Ripe. I have often taken Pleasure to Survey
    these natural Palaces, and was equally ravish’d with its largeness and singular
    beauty. We sometimes play’d at Chess, at Trictrac,[¹](#C01_chapter_split_001.xhtml_fn8_182)
    at Drafts, at Bowls and at Scales.[²](#C01_chapter_split_001.xhtml_fn8_183) Hunting
    and Fishing were so easie to us, that it took away from the Pleasure. We often
    delighted our selves in teaching the Parrots[¹](#C01_chapter_split_001.xhtml_fn8_184)
    to speak, there being a vast number of them. We carry’d one to *Maurice* Isle,
    which talk’d *French* and *Dutch*.We shall soon see that all the last year of
    our abode here, we were employ’d in building the fine Bark, of which we must speak
    in the Sequel of these Memoirs. If any one desires to know how we lighted our
    Cabbins when ’twas dark, or the Places we were then in, I must acquaint him that
    we brought Lamps with us ; and instead of Oil, made use of Turtles fat, which
    as I said before, never Congeal’d. We lighted our Fires with Burning-Glasses.The
    Reader finding we had Abundance of Variety of Flesh and Fish, Boasted and Boil’d,
    Soops, Bagouts, Herbs, Boots, excellent Melons, other Fruits, Palm-Wine, clear
    and fresh Water, do’s not apprehend the poor Adventurers in *Rodrigo* were in
    any danger of Starving.But since he’s so kind as to consern himself a little in
    their extraordinary manner of Living, I assure him they made very good Cheer without
    Surfeits, Indigestion, Diseases, and thanks be to God without Bread. The Captain
    had left them two great Barrels of Bisket,[²](#C01_chapter_split_001.xhtml_fn8_185)
    but they seldom made use of it, except ’twas in Soops or Broth, and often they
    quite forgot it. When we had stay’d above a year in our new Island, we began to
    wonder we saw no Ship come ; for to say truth, some of us were not a little tir’d.
    They regretted the loss of their Youth, and were troubled to think they shou’d
    perhaps be oblig’d to pass the best part of their Lives in a strange Solitude,
    and intolerable Idleness. After several Deliberations, ’twas at last almost unanimously
    agreed, that when we had stay’d two whole years in expectation of *News from Mr.
    Du Quesne*, which we at first resolved to do, then if none came, we wou’d do our
    utmost to get to *Maurice* Island, which belorjg’d to the *Dutch*, where we might
    embark to go where we pleas’d, there being a Governor, and Ships coming every
    year from the Cape of *Good Hope*. This Isle is above one hundred and sixty Leagues
    from *Rodrigo*, a great way for us to make ; but we consider’d the Wind[¹](#C01_chapter_split_001.xhtml_fn8_186)
    blew generally one way, and that fair for that Island ; wherefore we put all hands
    to Work to build a Bark as well as we cou’d, and if there was any liklihood we
    might make use of it, we wou’d convey our selves thither in it,[²](#C01_chapter_split_001.xhtml_fn8_187)
    after having implor’d the assistance of him, who Commands the Winds and the Seas.This
    Enterprize appear’d very difficult, even to those that Projected it ; but however,
    it did not seem to be wholly impossible. We were to build a pretty big Boat, but
    we had no Skilful Workmen, and few Tools ; we had neither Pitch nor Tar, nor Cordage,
    nor Anchor, nor Compass, nor a hundred other Necessaries, and near two hundred
    Leagues[³](#C01_chapter_split_001.xhtml_fn8_188) by Sea was a great Voyage. The
    Wisest of us saw a thousand other Difficulties, and were afraid our Design cou’d
    never succeed. But those that projected it, were fix’d in it ; and ’twas agreed
    upon, that we shou’d prepare to put it in Execution, and by way of Diversion,
    to undertake the building of a Bark, tho’ we lost our Labour. No sooner said than
    done. And all eight of us without serving any Apprenticeship, became Carpenters,
    Smiths, Rope-makers, Mariners, and generally every thing that was necessary for
    us to be. In this Undertaking necessity was a Law to us, it supply’d all our Defects.
    Every one propos’d what he thought wou’d be most proper and advantageous, and
    we went all chear-fully to Work, having a good Understanding one with another,
    as ’twas our Common Interest.Among other Instruments we had a great Saw and a
    little one, with which we began to saw Boards, and very happily made use of a
    Beam of Oak[¹](#C01_chapter_split_001.xhtml_fn8_189) which the Sea had sometime
    before thrown on our Coasts. If the Curious Beader demands by way of Parenthesis,
    from whence that Beam came, I must answer, that truly I cannot tell.[²](#C01_chapter_split_001.xhtml_fn8_190)
    Let it come from whence it will, we had it, the Sea brought it to us, and we us’d
    it for the Purpose I tell him. We saw’d out some good Boards, but the great Saw
    breaking thrice, and being handled by unskilful Persons, the greater part of those
    Boards were of an unequal thickness, and Consequently not very good to the Eye,
    nor indeed fit for Use.Our Bark was twenty Foot long at the Keel, six broad, and
    four deep, we rounded it at both ends. We had some Nails, but *John de la Haye*
    who was a Silver-Smith, had some Forge-Tools and other Instruments, helpt us to
    more ; he mended our Saw for us several times. For Calking we made use of old
    Linen ; and instead of Pitch and Tar, mingled Jet[³](#C01_chapter_split_001.xhtml_fn8_191)
    with Gumms which we found on the Trees in Plenty, and temper’d it with Oil of
    Turtle. We work’d up several sorts of Ropes with the Threads or Fibres of the
    Stalks of the Plantane-Leaves ; which Ropes were strong enough, but not very Supple,
    and were proper only for fix’d work, but were always frizing[⁴](#C01_chapter_split_001.xhtml_fn8_192)
    out and untwisting when we employ’d ’em about running Work. Instead of an Anchor,
    we provided our selves with a piece of Rock, which weigh’d one hundred and fifty
    pound Weight, and we made a Sail as well as we could.Every Man was Industrious
    as it lay in his Power to be, to carry on this Work, and the two years being almost
    expired, we were so forward in it, that the Bark was Lanch’d, no one of us sparing
    his Labour[¹](#C01_chapter_split_001.xhtml_fn8_193) on this Occasion.As for Provisions
    we dry’d[²](#C01_chapter_split_001.xhtml_fn8_194) Lamentins Flesh, we fill’d the
    Barrels we had for that use with Fresh Water ; the little Biskit that was left
    us we put aboard, and supply’d ourselves with Land and Water Melons. The latter
    wou’d keep a long time ; What I have said is true, we began the building our Boat
    knowing we had no Compass,[³](#C01_chapter_split_001.xhtml_fn8_195) and so we
    finish’d it ; but every Body seeking for something Useful towards supplying its
    Place, one of us found a little Solar Quadrant of Loadstone[⁴](#C01_chapter_split_001.xhtml_fn8_196)
    which cost him three Pence at *Amsterdam*; and tho’ ’twas not good we were glad
    he had found it, hoping to reap some Benefit by it.When the Bark was in the Water,
    we were all surpris’d to find she did not obey the Eudder, and that to turn it
    we must make use of an Oar.The day of our Departure, was fix’d to be *Saturday*
    the 19th of *April* 1693\. The Moon being then near at the Full, the Sea wou’d
    be high, and consequently the easier to pass above the Shelves. The Eeason why
    we did not choose the time when the Moon wou’d be quite at the Full was, because
    we wou’d have as much as we cou’d of her Light.These Shelves of which I have often
    spoken,[¹](#C01_chapter_split_001.xhtml_fn8_197) are (to inform, *en passant*,
    those who do not understand the Term) Eocks rising up in the Sea like a sort of
    Wall,[²](#C01_chapter_split_001.xhtml_fn8_198) with which the Island is encompast
    at an unequal Distance ; except in two Places, where there’s a Breach about 10
    or 12 Foot broad, that gives access to the Isle. This is not to be seen in the
    Map.[¹](#C01_chapter_split_001.xhtml_fn8_199)When we arriv’d on the Island, we
    perceiv’d the Names of some *Dutchmen*, who had Landed there before, Written on
    the Bark of some Trees,[²](#C01_chapter_split_001.xhtml_fn8_200) with the date
    of the Time ; and this put us in mind of doing the same when we left it. We therefore
    wrote an Abridgment of our History in *French* and *Dutch*,[³](#C01_chapter_split_001.xhtml_fn8_201)
    with the date of our Arrival, the time of our Abode, and our Departure. We put
    it into a Viol, with a Note to Passengers to look into. We plac’d it in a sort
    of a Niche Dug in the Trunk of the great Tree,[⁴](#C01_chapter_split_001.xhtml_fn8_202)
    under which we us’d to eat, and which we had experience to be proof against Hurricanes.At
    last the appointed Day for which my young Companions heartily long’d, arrived,
    and having put up our Prayers to Heaven for the Divine Assistance, we embark’d
    about Noon with our Provisions and Goods. The Weather was extremely fair, and
    the Wind the same ; so that tho’ we wanted a Rudder,[¹](#C01_chapter_split_001.xhtml_fn8_203)
    Cordage, Anchors, and almost everything necessary for our Boat, weak and ill-built
    as it was, we were full of Hope, that we shoul’d do very well in her. We reckoned
    the fair Weather wou’d continue, and if so, we might depend upon the Trade-Wind,[²](#C01_chapter_split_001.xhtml_fn8_204)
    of which I have spoken ; and which according to our Calculation, founded upon
    what we had heard the Captain and Seamen say, always blow’d at that time of the
    year, and as long as the Weather was fair. In such case we might expect to make
    *St. Maurice* Island in[³](#C01_chapter_split_001.xhtml_fn8_205) two Days and
    two Nights.We therefore departed with Joy, and earnestly desiring to arrive in
    some Place where we might see the Inhabitants of the World, we past swiftly enough
    to the Shelves. But instead of seeking for one of the two Breaches before mentions!,
    and to Hale[¹](#C01_chapter_split_001.xhtml_fn8_206) the Ship by Land or by Sea,
    to a Place where ‘tis easy to pass, we depended too much on our good Fortune,
    and thinking to go thro’ directly, we happen’d to strike. We went so swiftly along,[²](#C01_chapter_split_001.xhtml_fn8_207)
    that we cou’d hardly perceive when we struck, and thought we only brusht by the
    Bock. Wherefore we proceeded, and were got about fifty Paces beyond the Shelves,
    flattering ourselves we were past the greatest Danger, when on a sudden we were
    sadly convinced of our Mistake[³](#C01_chapter_split_001.xhtml_fn8_208); for the
    Water came pouring in, and we saw ‘twas time for us to return as fast as we cou’d
    to Land. In the meantime the poor Boat fill’d apace, the Budder cou’d not guide
    us. The Wind in spite of us, drove us farther off Shoar. Fear depriv’d us of the
    little Skill we had, and as for myself in particular, I believ’d our time was
    come ; one may easily imagine the Condition we were in, our Peril was so terrible
    and apparent. The Desire of Living made us set to work to save ourselves ; but
    the truth is, ‘twas to no purpose[⁴](#C01_chapter_split_001.xhtml_fn8_209); one
    endeavour’d to lave[⁵](#C01_chapter_split_001.xhtml_fn8_210) the Water out of
    the Bark[⁶](#C01_chapter_split_001.xhtml_fn8_211) with his Hat, another employ’d
    himself with Labour every whit as unprofitable, and all cry’d out or Pray’d like
    lost Men. However at last one of us handled an Oar so effectually, that the Bark
    tack’d about, and the Wind being-brisk, it drove us (back) in four Minutes time
    on the other side of the Shelves ; but thirty Paces from thence[¹](#C01_chapter_split_001.xhtml_fn8_212)
    nearer the Island the Boat sank down to the Bottom. If that Misfortune had happened
    to us half an Hour before,[²](#C01_chapter_split_001.xhtml_fn8_213) we had been
    drown’d every Man of us ; but there being not above six[³](#C01_chapter_split_001.xhtml_fn8_214)
    foot Water, and the Bark not Over-setting, we stood all of us upright on the Deck,
    with the Water up to our Middles. ’Twas a Happiness in our Trouble, that the Bock
    on which we struck made such a hole in the Boat, that we saw the Water enter immediately
    ; for if we had not so visibly and readily seen it, we should have kept on our
    way, and then had infallibly Perish’d. However, as it was, we were very unpleasantly
    Posted in the Water on one end of the Deck. Tho’ it began to Ebb, and we were
    but half a League from the Shoar, we cou’d not tell what to resolve on. ’Twas
    concluded after we had thought of it a little, we wou’d stay till the Water was
    so low that we might get to Shoar, haling our Chests and Barrels after us as they
    floated in the Water ty’d to one another.This was accordingly done, but not without
    putting us to terrible Fatigues ; for we had several Voyages to make, sometimes
    up to the Neck in Water, the Bottom being uneven, and sometimes we were oblig’d
    to Swim, it being out of our Depths, and draw our Chests after us with Bopes ty’d
    about our Wasts. We all of us stript, that we might have the more liberty in Swimming,
    and the sharp and keen Stones[¹](#C01_chapter_split_001.xhtml_fn8_215) made our
    Feet all bloody. To add to our Misfortunes, the Current ev’ry now and then carry’d
    away part of our Baggage, nevertheless we sav’d most of our things the same day,
    and put the heavy part of our Luggage out of the Bark on the Land ; the Sea cou’d
    not sweep that away, and when the Tide was quite out, we might at our Leasure
    recover it, which we intended to do next Day, and see if we cou’d hale our poor
    Boat after us. We now ty’d it to a Bock, and at last got to Land with much joy,
    and much Sorrow, having made proof by a woful and happy Experience, that evil
    and good things are often mix’d together by Fortune.The next Morning as soon as
    twas Light we went to the Bark, which now lay a-shoar, to Befit her as well as
    we cou’d. We Launch’d her when the Tide came in, put our heavy Coods aboard, and
    got safe to a Place where we cou’d conveniently Land them.[²](#C01_chapter_split_001.xhtml_fn8_216)
    Each of us lost something in this Shipwreck, and what we had left was generally
    damag’d ; but we had sav’d our Lives almost by a Miracle. We return’d our most
    humble thanks to God, the Gracious and Mighty Protector, who had assisted us in
    our extreme Peril.In the mean time one of us who seem’d to be the most Strong
    and Vigorous Man in the Company, found himself very much out of Order after so
    great a fatigue. As soon as he got a-shoar naked and frozen,[³](#C01_chapter_split_001.xhtml_fn8_217)
    as he was, he laid himself all along upon the Sand, which the Sun had heated extraordinarily.
    He thought at first he wanted only a little Best, but a while after his Face turn’d
    as red as Scarlet ; his Head grew very heavy, and his Distemper increas’d ev’ry
    Minute. We carry’d him to his Cabbin with much adoe, and being of a very Vigorous
    Complexion, ‘twas three or four days before he would confine himself to his Bed,
    but at last he yielded. His Head swell’d, and so many Imposthumes appear’d in
    it, that we cou’d scarce open all to let out the Corruption. We were at first
    sorry that our Rogue of a Captain had left us no Ungents or Drugs,as I have said
    before.[¹](#C01_chapter_split_001.xhtml_fn8_218) However we consider’d none of
    us understood very well how to Administer them, if we had had them; and indeed,
    that take it all together what we call Physich or Pharmacy is commonly nothing
    but a Cheat more Pernicious than Useful to Mankind ; so we did not trouble our
    selves much for the want of it till now. We had a Consultation, whether the Patient
    ought not to be Blooded.[²](#C01_chapter_split_001.xhtml_fn8_219) Some cry’d he
    wou’d die in the Operation, if he lost one drop of Blood only, others cry’d out
    louder, then he wou’d give up the Ghost in three Minutes, if he was not Blooded
    ; and we were all so warm in the Vindication of our several Opinions, that whoever
    had seen us, wou’d have taken us for true Physicians.[³](#C01_chapter_split_001.xhtml_fn8_220)
    Nevertheless we did not come to Blows, and there being four out of seven Voices
    for Bleeding, ‘twas not necessary that we should stay for any other way of deciding
    the Question, tho’ the Sacred Ministers of *Æsculapius*, have recourse sometimes
    to others in such Cases.[⁴](#C01_chapter_split_001.xhtml_fn8_221) The Boldest
    of the four Phlebotomists[⁵](#C01_chapter_split_001.xhtml_fn8_222) sharpen’d as
    well as he cou’d the point of his Pen-knife, and made Incisions in several parts
    of the poor dying Man’s Arm, but ‘twas all to no Purpose ; the Fever Augmented,[¹](#C01_chapter_split_001.xhtml_fn8_223)
    he grew Delirious, and remain’d so some Days. We cou’d then do nothing for him,
    but apply to the Great Physician of Body and Soul, which we had done all along.
    Before this Struggle was over, we had the Satisfaction to see our Dear Brother
    recover his Understanding, and give us the most certain and most edifying Tokens
    of a sincere Repentance, and holy hope of his Salvation. Thus it continu’d with
    him[²](#C01_chapter_split_001.xhtml_fn8_224) till the eighth of *May* 1693, when
    he expir’d in the 29th year of his Age, after three Weeks Sickness. Such was the
    end of honest *Isaac Bayer*, the eighth part of the Kings and the Inhabitants
    of *Rodrigo*. And that you may not, kind Reader, go so far as this New World without
    seeing some Monument, Read if you think fit, the Epitaph that I add here.[³](#C01_chapter_split_001.xhtml_fn8_225)“Beneath
    these Immortal Palms,In the faithful Bosom of a Virgin Earth,Are piously depositedThe
    BonesOf ISAAC BOYER,An honest and faithful *Gascon*, descended from *Adam*,Of
    as Noble Blood as any of the Mortals his Brethren,Who all Reckon, among their
    AncestorsBishops and Mrtlers.* * * * *If all Men would live as He liv’d,Dancing,
    Laces, Bayliffs, Locks and Keys,Cannon, Prisons, Tax-Gatherers, Monarchs,Would
    be useless things in the World.* * * * *He was Wise, and more a Philosopher than
    the Philosophers.He was a Christian, and more a Divine than the Divines.He knew
    his Ignorance, and was more a Doctor than the Doctors.He was more Independant
    than Sovereigns,Being neither plagu’d with Flatterers, nor drunk with Ambition.He
    was richer than Kings, for he wanted but one Thing,A WIFE.* * * * *In that Execrable
    TimeWhich makes my Pen tremble with Horror,He was fore’d to abandon his Dear CountryAnd
    every thing with it,To fly from theFurious Ministers of the great Tribulation.*
    * * * *He cross’d Mountains and Seas,And coming to this Island,Found here the
    true Port of Safety.* * * * *Himself and seven Companions of the same Fortune,Stay’d
    here two whole years,The people and the Rulers of the Place.He had longer enjoy’dThe
    Delights of this new World,If his Heart had not been touch’dWith a secret Desire
    forThe Too lovely Sex,Which engag’d him in an EnterprizeThat caus’d his Death.*
    * * * *He wrestled boldly with that terrible Enemy,And came off Conqueror;Since
    at the same time that he yielded Dust to Dust,He procur’d the Honour for the Isle
    of Rodrigo,ToRender to the Lord one of the Blessed at the Resurrection.His SoulIs
    gone TriumphantlyInto the Palace of Immortality.* * * * *His few and evil DaysWere
    not at most aboveTen Thousand Six Hundred ;AndThat in which he took his leave
    of the World,Was the Eighth of May, in the Year of our Redemption,MDCXCIII.Whosoever
    thou art, Passenger, that reads this,RememberThou must die in a little while,AndImprove
    thy Time.”A * ω.Neither our Sorrow for the loss of a dear and useful Friend, nor
    the bad Success of our first Enterprize hinder’d us from thinking of leaving the
    Island. These young Men had, as *Horace* says, Hearts of Oak and Brass,[¹](#C01_chapter_split_001.xhtml_fn8_226)
    which made them freely expose their Lives in the weakest of all Boats, and rashly
    to defie the fury of the Winds. They persisted therefore obstinately in their
    first Resolution, and added to the Fundamental Reasons alledg’d in the beginning,
    that they wou’d benefit themselves by the Misfortune that had happened to them,
    and take better measure for the future. They said they wou’d strengthen the Bark
    in Repairing it, that they wou’d lay some Buoys, or some other Tokens in their
    way to direct them in this Case, and wou’d depart when the Tides were highest,
    that they might not run the Risk of touching the Shelves, without spending time
    in seeking after other Breaches, if they cou’d not follow exactly the way mark’d
    them out by the Buoys.[¹](#C01_chapter_split_001.xhtml_fn8_227)I was, as well
    as they, a little weary of Confinement, and cou’d not with Pleasure think of living
    all the rest of my Days in one of the Islands of the *Antipodes;* but I did not
    imagine such a sorry Gondola[²](#C01_chapter_split_001.xhtml_fn8_228) as our Boat,
    was capable of carrying us such a vast way, especially having no necessaries for
    the Voyage : Wherefore I oppos’d the execution of the first I Design with all
    my Might. As Resolute as they seem’d to be, to be gone, I beg’d them in the most
    perswasive Terms I cou’d use, to reflect a little more upon what they were going
    about; and not to shock them too much at first, 1 highly commended their Courage,
    and gave way to their most plausible Reasons. But I conjur’d them also to consider,
    that this was an Affair of the last Importance, both for the Body and the Soul
    ; that without a second Miracle, we must be a second time Ship-wreck’d, and that
    then they wou’d never be able to avoid Reproaches very like Despair, for having
    tempted God. I added, Experience ought to make us wiser than we were before ;
    that it had already cost us one of our Companions Lives, and we shou’d look upon
    that sad Accident as the Warning of Providence, and the Manifestation of God’s
    Will, of whom we had demanded with Fasting and Resignation, that he wou’d be pleased
    to inspire us what we shou’d do.I told them farther, that since those that were
    to follow us, had not promis’d to come till after two years, ’twas convenient
    to outstay that time a little ; perhaps Succour was now upon Sea for us, and might
    arrive ev’n when we were the deplorable sport of the Waves, if we were not before
    that Food for the Monsters of the Sea. Besides, since we were in a good Place,
    we ought to have a little Patience ; and in the mean time have Recourse to a reasonable
    Means, which no Body had yet thought of ; and that was, to light great Pires on
    the top of our high Mountain,[¹](#C01_chapter_split_001.xhtml_fn8_229) and set
    Lanthorns[²](#C01_chapter_split_001.xhtml_fn8_230) all about the Island, to invite
    Ships that past by us, to come to our Assistance. The Cotton[³](#C01_chapter_split_001.xhtml_fn8_231)
    of our Plantanes, and our Turtles Oil, made the execution of this Design easy
    ; and we had stuff enough to cover it with, and make a kind of Lanthorns if it
    had been necessary.I had a thousand things more to say, if I had had to do with
    Men of riŗje Understanding, and well reclaim’d from the follies of the World.
    For to cast up all things, what cou’d be comparable to the Sweetness, the Innocence,
    the Advantages, and Delight in a Solitude so much resembling an Earthly Paradise
    as ours ? What can be imagin’d more happy, after having groan’d and suffer’d under
    the Yoak of Tyranny, than to live in Independence and Ease, without danger of
    Worldly Temptations : But when a Man is young, he is not capable of making such
    Reflections. I therefore finish’d my Speech, in representing further to them the
    length of the Voyage, the weakness of our Vessel, the wretched Tackling we had,
    and their Unskilfulness. They heard me patiently ; several of them seem’d not
    to digest it, and one of them whom I had touch’d in a sore Place, of which I was
    not aware, alledg’d briskly, a new Reason for our Departure; which was so agreeable
    to the relish of the rest, that it occasion’d a new Discourse, and all my Arguments
    were forgotten. *Do you imagine*, said this young Man,[¹](#C01_chapter_split_001.xhtml_fn8_232)
    *That we will condemn ourselves to spend all our Dives here without Wives. Do
    you think your Earthly Paradise more excellent, than that which God prepar’d for
    Adam; where he declared with his Mouth, it is not good that Man shou’d be alone:*
    I reply’d,[²](#C01_chapter_split_001.xhtml_fn8_233) *My dear Friend*, Adam’s *Wife
    proved such a Curse to him, and all his Posterity, that certainly our Paradise
    wou’d not be much improv’d by the Company of such an Eve among us*. They all Laugh’d,
    and what I little thought of, all the Discourse was afterwards on the Subject
    of the Ladies, which was, as is said, the Gospel of the Day.[³](#C01_chapter_split_001.xhtml_fn8_234)
    I soon saw where the Shooe pinch’d,[⁴](#C01_chapter_split_001.xhtml_fn8_235) and
    in the reign of *Quolibets* some fine Wit wou’d certainly have said on this occasion,
    there was not one of my Adventurers who wou’d not have lov’d a *Chimène*[⁵](#C01_chapter_split_001.xhtml_fn8_236)
    much better than a *Rodrigo*. The most Moderate of us (and ‘twas time to be moderate
    after Fifty and I do not know how many more Winters) put on a serious Air ; and
    the business of Marriage and Women not being a question that is entirely decided,
    for or against it, more than one of our Company joyn’d with him, as to the Inconveniences
    that attended them. ’Twas said that an eternal Slavery, and a just and natural
    Love of Liberty were incompatible ; that ’twas a strange Resolution to subscribe
    one’s self voluntarily, to a Bondage that has no end. And if all Animals were
    born with a desire of Conjunction, Nature liad for all that, loaden them with
    Irons. The Cares and Tribulations mentioned by *St. Paul*,[¹](#C01_chapter_split_001.xhtml_fn8_237)
    were also urg’d against them ; and ‘twas said, the Beauty of Women was no more
    durable, than that of Flowers. That the Sweets which we fansie we may enjoy with
    them, are no solid good ; and after all, this just devise of Marry’d Men, will
    be eternally true ; *for one Pleasure, a thousand Pains*. That notwithstanding
    all the Precautions we endeavour to take, we shall often find our selves coupled
    with Harpyes and Traiteresses; and the Bage of Jealousie, together with all the
    Misfortunes that accompany Marriage, are often the fruit of the greatest Love.
    The quarrelsome Contentious Women, of whom *Solomon*[²](#C01_chapter_split_001.xhtml_fn8_238)
    speaks, were not omitted ; nor the famous Passages[³](#C01_chapter_split_001.xhtml_fn8_239)
    in the xxv and xlii Chapters of the excellent Book of *Ecclesiasticus*, where
    ‘tis said, *All Malice is little, and all Wickedness supportable, provided the
    Medice of a Woman is excepted ; and the Iniquity of a Man is of more Worth, than
    the Woman that do s good*, or *than the goodness of a Woman*, as some Authors
    Translate it. Besides[⁴](#C01_chapter_split_001.xhtml_fn8_240) we consider’d,
    that if such a thing has been heard of, that the Union between Man and Wife is
    very great, the thoughts of an unavoidable Separation, and the grief of Parting,
    must be most Cruel and most Bitter.The Subject being Fertile, it gave occasion
    to other Reflections against the Sex, with which I would not tire the Ladies,[⁵](#C01_chapter_split_001.xhtml_fn8_241)
    who shall vouchsafe to cast their fair Eyes on this Relation.One of the youngest[⁶](#C01_chapter_split_001.xhtml_fn8_242)
    said with a modest and pleasant Air, that he did not believe anyone of the Company
    thought then of Marriage or Debauchery ; but that in truth ‘twas very hard to
    him, to think he must for ever be depriv’d of the Company of a Woman ; and the
    more, because God had otherwise order’d things from the Beginning.[¹](#C01_chapter_split_001.xhtml_fn8_243)
    That all that had been said against them in General, seem’d to him to be very
    unjust; and for his part he own’d he lookt upon them as the most lovely half of
    the World.*Reader, ’Tis at your own choice to look over, or pass by this[²](#C01_chapter_split_001.xhtml_fn8_244)
    Discourse; when once it was a foot,[³](#C01_chapter_split_001.xhtml_fn8_245) our
    young Men who did not want wit, said several pleasant things which I put here
    together, and the more willingly because these sorts of Subjects are rarely disagreeable*.’Tis
    not enough, said he with a loud Voice who had demanded *Eve’s* for the *Adam’s*
    of our *Eden ;* the Women are not only the most lovely half of the World, they
    are also the best half. (His Temper being a little quick, his expressions also
    were sometimes a little Vigorous.) ’Tis a shame, *added he*, to talk of Women,
    as some among us have done, and I cannot bear their Injurious Reflections. If
    there are wicked Women, there are without Comparison, a much greater Number of
    Rogues of our own Sex. If there are Impudent Women, ‘twas certainly the infamous
    Temptation of Men that corrupted them. Whoever[⁴](#C01_chapter_split_001.xhtml_fn8_246)
    have said or Thought, that *the Wickedness of Men is Preferable to the Goodness
    of Women*, have said so Impertinent and Extravagant a thing, that ‘tis not worth
    answering. No Body denies, but there are scolding,[¹](#C01_chapter_split_001.xhtml_fn8_247)
    Contentious Women ; and what Consequence can be drawn from thence to the Prejudice
    of those Wise and Virtuous Women of whom the same *Solomon* speaks. Those worthy
    wives, who, according to him, are the Happiness, the Joy and the Crown of their
    Husbands[²](#C01_chapter_split_001.xhtml_fn8_248); a Gift of God, and a Favour
    of Heaven. Those excellent Women whom *St. Paul* calls the Glory of a Man,[³](#C01_chapter_split_001.xhtml_fn8_249)
    the first of whom was the Master-piece and Crowning-Work of the Creation.We may
    with boldness affirm, that the positive Will, and the certain and manifest Destiny
    of the Master of the World, is, that all the Descendants of *Adam,* shou’d each
    have his Help-Mate, as he our Common Father had. Those Continent Persons *St.
    Paul*[⁴](#C01_chapter_split_001.xhtml_fn8_250), speaks of, who, either by their
    Stripes, their Fastings or Mortifications, have van-quish’d or overwhelm’d Nature,
    as being born with a Constitution that rendered them Monstrous; that is, Animals,
    whose Disposition was against the Order of Nature, these Persons I say, are of
    a particular Species, so rare, that the Laws were not made for them, *Fncrease*[⁵](#C01_chapter_split_001.xhtml_fn8_251)
    *and Multiply; it is not good that Man should he alone[⁶](#C01_chapter_split_001.xhtml_fn8_252):
    a Man shall leave his Father and Mother, and cleave unto his Wife.*[⁷](#C01_chapter_split_001.xhtml_fn8_253)
    These are Oracles pronounc’d when the World was made, the Primitive Indispensable
    Laws that ought to be deeply engraven on Marble and Brass, and transmitted to
    Posterity in Letters of Gold in civiliz’d Governments. I call them Laws, and not
    a simple Permission, which leaves Man at his liberty to do what he pleases, according
    to his Fancy or Caprice. The first *Eve* was not made to live a Virgin, but to
    become a Mother and begin to People the World; and the *Eve’s* of the following
    Ages are not given us, let ’em be what they will, but to perpetuate the Work of
    the Creation. If there are a sort of Men, who like those vile Insects, of which
    some speak, grow out of Mud and Corruption, let those Men live by themselves as
    long as they please, and wallow as much as they please in the Filth and Ordure
    of their Origin. But ’tis not thus, that the Noble Race of the Children of *Adam*
    are Im-mortaliz’d. A single Man, to a single Woman, are not each properly speaking,
    but a part of themselves. These two half’s together, make one whole. How unjust
    and cruel is it, to keep these imperfect Portions always naturally desiring to
    be joyn’d and destin’d to Union by Eternal Wisdom[¹](#C01_chapter_split_001.xhtml_fn8_254)
    in a state of Separation. Let us therefore conclude thus, Dear Companion, that
    Women are entirely all that’s Fine in the World, all that is Lovely, all that
    is Necessary; and that we ought to be unspeakably pleas’d in Loving them, and
    being belov’d by them, as also in seeing them bring forth, and breed up the Pledges
    they give of Mutual Love. Call them Yoaks or Fetters, or what you please; and
    give the Union of Marriage the odious Name of Chains, but let us remember we are
    never weary of enjoying what we Love, and should not think it a tiresom slavery,
    to keep our Treasure a long time. Our sorrowful and imperfect Society, can have
    no Relief, no Support here; we shall die, and our Island remain Desert. He who
    dies last, will have no Body to Assist and Comfort him, his Corps have no other
    Burial but the Belly of those filthy Batts,[¹](#C01_chapter_split_001.xhtml_fn8_255)
    that seem now ready to devour us alive. A little Water wou’d perhaps Refresh him
    in his Bed of Languishing Sickness, but his weakness not permitting him to fetch
    it, he will see himself consum’d by a heat without Remedy, and all his Distresses
    will be extream. Let us therefore save our selves from this fate, and for a more
    happy Society. We have Philosophers among us, who they say, love their Liberty;
    with all our Hearts, let them enjoy it. The Isle is their own, and they may be
    as free as they please in these Forests. They need not fear that any Nymph will
    come and trouble the Pleasures of their Contemplative Life. As for us, Let us
    go and submit to the agreeable Yoak (if it must be a Yoak) the amiable Yoak of
    those whose Victorious Charms ought in my Opinion to be preferable to the most
    sweet Oil of our Turtles. But we lose Time, we have said enough on this Subject;
    follow me, my Friends, and let us immediately think of what we ought to do, in
    order to our Departure.The truth is, we rose up all hastily, and as if the question
    had been decided by an Oracle, not a Word was said, but of refitting the Bark,
    and preparing things necessary for our Voyage. However I made a new Proposition
    to gain Time, but they wou’d not hearken to me, and ’twas resolv’d we shou’d re-embark
    the next time the Moon was at the Full.[²](#C01_chapter_split_001.xhtml_fn8_256)Since
    nothing cou’d happen worse to me, than to Live and Die alone in an Island of the
    other World, I resolv’d, yet not without some contrary Reflection, to go with
    them. The day prefix’d arriving, we bad this Charming Island adieu, and with the
    Island, what is worst of all, we bad adieu to our true and noble titles of *Freemen,*
    to become e’er long the Sport and Prey of a little Scoundrel Tyrant.[¹](#C01_chapter_split_001.xhtml_fn8_257)I
    have already shewn, that the day before our first Departure, we left a little
    Monument behind us, to inform all such as might one time or other happen to Land
    in this Isle of our Adventures. But that being very short, and containing some
    General Things, I had a mind before our second Departure, to add some Particulars
    in a little Writing, a Copy of which I have here very freely inserted. If the
    Reader is of Opinion that it breaks off the Thread of the History, it is easie
    for him to turn over and pass it by, and he will soon come at what he seeks after.“Dear
    Adventurer:Read, if thou wilt, this weak and slight Monument.FRANCIS LEGUAT,Who
    now writes these Lines with his own Hand,Was born and honourably bred,In the good
    and little Province of *Bresse*[²](#C01_chapter_split_001.xhtml_fn8_258); Which
    our Predecessors, call’d the Country of the*Sebusians*[³](#C01_chapter_split_001.xhtml_fn8_259)
    some thousands of years agoe.’Tis a fruitful Peninsula,Form’d by the *Ehosne*
    and the *Soane*.[⁴](#C01_chapter_split_001.xhtml_fn8_260)And blest with the most
    benign Aspects of the Father of Nature.There I liv’d Innocently in Prosperity
    and Peace,When an Irruption of wild Beasts,Which rose out of the bottomless Pit,Like
    a Vomit of Fire,Impetuously falling from the horrible *Vesuvius*,[⁵](#C01_chapter_split_001.xhtml_fn8_261)Cruelly
    plunder’d my Habitation.A little after a Hurricane quite over-whelm’d it,[¹](#C01_chapter_split_001.xhtml_fn8_262)And
    Transported me and several of my CountrymenInto the Rcpublick, blest by Heaven,Which
    is Famous all over the World,By the Name ofHOLLAND.I was scarce recover’d of the
    Fright I was in,Which seem’d to me to be the effects of a Dream,When a Voice call’d
    meFrom within a Ship then ready to Sail,I ran,And after a long and dangerous Voyage,I
    was brought to this Island with my Companions,Whose Names are not unknown to thee;And
    one of whom is departed a Moment sinceFor his true Country.We have seen in this
    delicious Abode,Two whole Revolutions of Years,Which I thought was a little Golden
    Age;I, who in an Age of Reflection,Desire nothing more than what is truly Necessary.But
    my Companions who were but justComing into the World,And knew not the little worth
    of it,Cry’d, that they wou’d have Wives.Wives! said they, the only JoyOf Man,And
    the Masterpiece of the Creator.The Latent Fire of their Imaginations Kindled,They
    wou’d have Wives.And such was the wretched Bridge[²](#C01_chapter_split_001.xhtml_fn8_263)
    they made themselves,To pass over it in quest of the Soveraign Good,I must therefore
    stay here alone,Or suffer my self to be torn away from my Repose,By the Violence
    of the Torrent,Which drove me into a thousand Dangers.Pity my Destiny I pray thee,Thou
    Dear Confident[³](#C01_chapter_split_001.xhtml_fn8_264) of my Adventures;And let
    no more hurt ever happen to thee,Than what I wou’d do thee!Further,I cou’d not
    leave thee this Memorial,In a more Universal and more Noble[¹](#C01_chapter_split_001.xhtml_fn8_265)
    Tongue,Than that of Glorious and Formidable *France*,My Dear and Desolate Country.Given
    in the Palace of the Eight Kings of *Rodrigo,*The Twenty First of the Month we
    call *May,*And the Year which the *Christians,* Successors to the*Israelites,*Compute
    to be One thousand six hundred ninety threeAfter the coming of the *Messias:*The
    fourth Year of the ReignOf the Most Wise and most Mighty Princes,WILLIAM and MARY,Defenders
    of the Faith,Restorers of Religion,And of Liberty when they were shaken in *Europe.*[²](#C01_chapter_split_001.xhtml_fn8_266)In
    that year of the World which no true Learned ManWill ever be so bold as to pretend
    to Design,ThouLittle and lovely Island,I wou’d render thee famous above all the
    Isles of the East,If my Power was answerable to my Will;My Mouth confesses from
    the abundance of my Heart,That my Soul is touch’d with Sorrow,[³](#C01_chapter_split_001.xhtml_fn8_267)Now
    I am about to leave thy wholesom Air,Thy good Palm-Wine, thy excellent Melons;Thy
    Solitaries; thy Lamentines;Thy Hills always Verdant;The clear Water of thy Rivers;Thy
    fruitful and smiling Sun;And all thy Innocent and Rare Delights.Can I forget the
    precious Treasure of Liberty?Thou shalt never be call’d Barren,Since thou broughtest
    us forth Plenty of exquisite Meats;And at the Day of Eternal Doom,[⁴](#C01_chapter_split_001.xhtml_fn8_268)A
    new ISAAC who has been sown in CorruptionIn thy Earth,Shall rise to Immortality
    and Glory.O Isle, most desirable among theDaughters of the Ocean!How many good
    and laudable Things may be said of thee!May a wiser and happier People than We,One
    day Cultivate with joy thy fertile Soil;And without Interruption, enjoy all thy
    Natural Riches.May that People Multiply!May they Prosper without Trouble and Alarms,And
    no Successor in the Government,Ever call thy Inhabitants his Inheritance,And never
    become their Enemy and Destroyer.May never King nor Viceroy suck thy Blood,Nor
    break thy Bones.May Heaven preserve thee from all wicked Judges,From all pretended
    Distributors of Justice,Who sit in the Seat of Discord, Rapine and Iniquity.May
    Heaven prt serve thee from the Pride of the Great,And the Wantonness of the Rich.May
    Heaven for ever preserve theeFrom that pernicious Race of Animals,[¹](#C01_chapter_split_001.xhtml_fn8_269)Who
    without Wisdom, Virtue, Courage or Honour,Assume the fair Name of Noble.May the
    Cry of the Poor in DistressNever be heard on thy Coasts.May never Begging Ambassador,Carrying
    on his ShouldersThe Miserable Dirty train that seem to follow him,Raise Pity in
    thy People.May never any wicked Heretick, nor Orthodox Fool,Nor rascally Monk,[²](#C01_chapter_split_001.xhtml_fn8_270)Trouble
    thy Peace.May thy holy Religion never dependOn the Sword, or on Custom.May no
    Sellers and Buyers of Holy Things,[³](#C01_chapter_split_001.xhtml_fn8_271)Ever
    set foot on thy Land.May no Proud-youth and ignorant DeclaimerEver sound his poor
    Orations in thy Land,Nor his Antichristian SatyrsUnder the Name of Preaching.May
    no unskilful Copyist, nor bold Parrot,Have the liberty to pretend to teach thy
    People.May thy sacred Sanctuaries.(The Palaces of the Holiness of the Almighty,)Never
    be miserably chang’dInto Theaters, Shops, and Retreats for Robbers.Let never Dispute
    upon a Word,[¹](#C01_chapter_split_001.xhtml_fn8_273) create Schism, Hatred or
    CrueltyAmong thy Children.Let never any foolish or superstitious Bigot,Corrupt
    or dishonour the Divine Laws,By his Trifles or Fables.Never let any Man by his
    extravagant Devotion,[²](#C01_chapter_split_001.xhtml_fn8_274)Expose Piety to
    Laughter,Nor render the sacred Truths suspected, Scandalous and Ridiculous,To
    such as want Knowledge and Discernment.May Heaven to the end of the World preserve
    theeFrom all these presumptuous Earthworms,Who proudly boast they can explain
    Mysteries,And pretend to Embellish[¹](#C01_chapter_split_001.xhtml_fn8_275) Faith
    and Worship,According to their Folly or Rashness.May no Astrologer ever be permitted
    in thy Common-Wealth.No learner of passages out of Homer,No Slave of musty Otho’s,[²](#C01_chapter_split_001.xhtml_fn8_276)No
    Searcher after the Philosophers Stone.[³](#C01_chapter_split_001.xhtml_fn8_277)No
    Poetaster.And may no Man be ever so Ridiculous,As to hope to get Honour by vain
    Sciences,Or other such like things which he has Learn’d,And of which wise Men
    know only enough to despise them.Mayst thou ever be defendedFrom the poor and
    wretched Set of Antiquaries,[¹](#C01_chapter_split_001.xhtml_fn8_278)A Race of
    Monkeys, Parrots, and not of Reasonable Creatures.May no mad PedantEver dedicate,
    within the bounds of thy Coasts,[²](#C01_chapter_split_001.xhtml_fn8_279)The short
    course of his Life,(Which ought to be imploy’d about Important Duties)To such
    sort of Studies that bring Content to the Mind,And that are made Famous onlyBy
    miserable Custom,Founded upon popular Prejudice.May never any Echo of the Multitude,Be
    Taken by thee for anything else but an Echo.May no Honourable Robber or MurdererSet
    up the obliging TradeTo cheat thee of thy Money,By shortning with Impunity the
    Days of thyInhabitants,After[³](#C01_chapter_split_001.xhtml_fn8_280) having a
    long time kept them on theRack in a Bed of Sickness.May no unprofitable Visiters[⁴](#C01_chapter_split_001.xhtml_fn8_281)Ever
    come to disturb the good Employmentsof thy Sages.May never Dragoons,[⁵](#C01_chapter_split_001.xhtml_fn8_282)
    nor Highnesses, nor Monks,Nor Louvres, nor Dungeons,[⁶](#C01_chapter_split_001.xhtml_fn8_283)Nor
    Reprisals, nor Complements,Nor Slavery, nor troublesome Fashion,Nor Powder for
    the Cartridge or Dressing-Box,[⁷](#C01_chapter_split_001.xhtml_fn8_284)Ever be
    knownAmong thy Peaceable, Reasonable, and Happy Society ;Mayst thou ever be freeFrom
    Fraud, Ambition, Avarice,Tyranny, and all Villany.MayVirtue, Wisdom, Truth, Fidelity,
    Innocence,Justice, Safety, Abundance,Happiness, Peace and Joy,Make thy little
    Terrestrial Paradise the Desire orEnvy of all Men,As a Tast or SemblanceOf the
    Paradise which the AngelsInhabit.”As I had done writing these my Vows for this
    charming Isle, I remember’d I had read in the History of the *War with the Vandals*,
    written by *Proeopius*, that when that Author was in *Africa* with *Belisarius,[¹](#C01_chapter_split_001.xhtml_fn8_285)*
    he found in a city of *Numidia* two Stone Pillars, on which was Ingrav’d this
    Inscription in the *Phoenician* Tongue ; *We are some of those that fled from*
    Joshua *the Great Bobber*.[²](#C01_chapter_split_001.xhtml_fn8_286)I had neither
    Stone nor Marble to make anything like a Pillar ; but having a small piece of
    Vellom which may last as long as Brass, if ’twas kept in the Vial I have spoke
    of, I made a Draught of a Pillar after my Way ; on the top I plac’d the Cross
    and Thorns of our Tribulations, wrote our Names[¹](#C01_chapter_split_001.xhtml_fn8_287)
    on one side, and these words on the other :“ We are some of thoseHundreds of ThousandsTo
    whom Wings have been givenToEscape the furious Dragoons[²](#C01_chapter_split_001.xhtml_fn8_288)OfThe
    Great Loyola.”[¹](#C01_chapter_split_001.xhtml_fn8_289)But after I had a little
    reflected upon it, two things oblig’d me to blot out this Inscription. First,
    I thought the Comparison was not very Just ; and Secondly I imagin’d it might
    displease the *Jesuits*, a Venerable Society, somewhat false and Dangerous, ’tis
    true ; but my Companions and I were very much oblig’d to them. I therefore took
    away this Inscription, and put two verses of *Virgil[²](#C01_chapter_split_001.xhtml_fn8_290)*
    in the place of it ; which represent our condition plain enough, as the Reader
    may see by looking upon the Pillar here presented to him. I do not love *Latin*
    in *French* Books, and indeed I have almost forgot all I knew of that Language,
    but ’tis difficult to Translate these Verses, without taking away their Force
    and Beauty.THE END OF THE FIRST PART^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_1))
    François Leguat, of the Province of Bourgogne, brought up in the Province of Bresse,
    a small district now represented by the department of Ain.^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_2))
    The Edict of Nantes, which put a temporary end to the religious struggles in France,
    and assured liberty of belief and safety in worship to the Calviniste, was decreed
    in 1598.Louis XIV, under the influence of Madame de Maintenon, having determined
    for political reasons to re-establish the unity of the Catholic religion throughout
    his dominions, proceeded by all the means in his power, moral and physical, by
    cruel persecution, and especially by what were known as *dragonnades,* to enforce
    his arbitrary acts of despotism; and finally revoked the Edict of Nantes, eighty-seven
    years after its original promulgation.In spite of rigorous prohibitions against
    emigration, numerous Protestants followed their pastors into exile, and sought
    in other countries that freedom of conscience denied to them at home. It has been
    calculated that at least some three hundred thousand Huguenots passed across the
    frontiers and left France, so that some provinces were deprived of nearly a third
    of their inhabitants, and many French industries were seriously injured.Holland,
    England, and Prussia were the countries which were most benefited by this wholesale
    emigration, and in fact, at London, a whole suburb (Spitalfields) was peopled
    by the foreign weavers; whilst at Berlin several industries were first established
    by the Protestant fugitives. More than twelve thousand soldiers and six hundred
    officers carried to foreign flags an implacable resentment and sentiments of vengeance
    against their mother-country.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_3))
    “Henry and Abraham, the two sons of the great Duquesne, both Protestants like
    their father, the most remarkable of naval commanders in France during the seventeenth
    century; and, having already distinguished themselves under his command, they
    were, like him, excepted from the rigours of the law pronounced against their
    co-religionists at the time of the Revocation of the Edict of Nantes. On the death
    of their father, in 1688, being given to understand that they would be subjected
    to persecution, they quitted France. Anticipating the persecutions to which the
    Calvinists would be subjected, and uneasy as regards the future of his children,
    he resolved to prepare a safe refuge for them by purchasing the property of Auhonne,
    near Berne, of which municipality the burgesses granted him the freedom. On hearing
    of this, Louis XIV asked him his reason for so doing. “Sire,” said he, “I have
    been desirous of securing a property of which I cannot be deprived by the will
    of a master.” It was to this estate of Aubonne that his sons retired; but, previous
    to his death, he made them swear that, whatever happened, they should never take
    up arms against France: an oath which they scrupulously kept. Henri Duquesne,
    the elder of the two brothers, promoter of the expedition which Leguat here mentions,
    and which was rendered abortive, never more went to sea, but gave himself up entirely
    to theological studies, and, in 1718, he published a volume, entitled *Réflexions
    sur l’Eucharistie.* The nephew Duquesne Guitón, with a Dutch squadron, made an
    expedition to the East Indies, of which the journal was published in 1721.” (*Eugène
    Mutter.)*^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_4)) *Recueil de Quelques
    Mémoires servons d’Instruction pour l’Etahlissement de l’Isle d’Eden. A Amsterdam,*
    M.DC.LXXXIX. (*See* Introduction, and Appendix at end of volume.) M. Muller believed
    all trace of this rare document had been lost; he has since found a copy in the
    Library of the Arsenal, and another copy has lately been reprinted by M. Sauzier.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_5))
    The island in the Indian Ocean, now known as *Réunion,* the largest of the Mascarene
    Islands, was first named *St. Appollonia* as early as 1527\. It was subsequently
    called *England’s Forest* by the British, and *Mascaregne* by the French in 1613\.
    In 1630 we find it written of as *Ile de la Ferle.* M. de Flacourt gave it the
    name of *Bourbon* in 1649, since which date various names have at different times
    been applied to it, such as *Eden,* as in the narrative of M. du Quesne; *lie
    Bonaparte,* under the first Republic and Empire; and finally the present name,
    *Réunion.*On the return of M. de la Haye, the viceroy of the Indies, to France,
    in 1G74-75, he advised the French king to send out an expedition with proper officials
    to take possession of the Island of Bourbon, as it was then called. Accordingly,
    M. de Vauboulon was despatched there by the Government with a suitable escort,
    and appointed Governor for the King and the Company (*French East Indian Company”),*
    and Chief Justice of the Island of Bourbon.M. de Vauboulon took with him a certain
    Capuchin monk of Quimper, as chaplain, and appointed him Curé of St. Paul. Whether
    Governor de Vauboulon abused the powers confided in him or not does not clearly
    appear from the records, but, judging from the conduct of the Dutch Governor of
    the neighbouring island, the probabilities are that he did; for, anyhow, a revolution
    took place on the 20th December 1690, when the rebels, headed by Père Hyacinthe,
    the Capuchin, deposed M. de Vauboulon, and kept him in prison until be died in
    confinement at St. Denis, in August 1692, the Sieur Firelin being installed as
    Commissioner for the Company by the Curé, who, having accomplished his *coup d’état,*
    retired to his parish at St. Paul.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_6))
    The great Duquesne had made his children swear not to take up arms against France,
    and, therefore, his son wished to prevent the possibility of any aggressive action
    on the part of the Dutch vessels.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_7))
    This project is fully described in despatches in the Cape archives.^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_8))
