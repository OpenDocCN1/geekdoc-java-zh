    | 1 月 18 日. | 审问。 |

    | 2 月。 | 抵达马斯喀里纳。 |

    | 3 月 15 日. | `Perseverance`号抵达。

    | 10 月。 | 德·弗拉克特。 |

    | 1695 年 2 月 9 日. | 德马斯喀里纳。

    | 2 月 21 日 | 。。

    。 9 月 15 日。 | 抵达大。 |

    | 12 月 6 日。 | 离开毛里留斯。 |

    | 1696 年 1 月 10 日. | 抵达巴达维。 |

    | 9 月 29 日。 | 遭遇船难。 |

    | 10 月 7 日。 | 德·拉·哈。 |

    | 1697 年 2 月 14 日. | 被捕。 |

    | 2 月 24 日。 | 在马斯喀里纳。 |

    | 12 月 15 日。 | 抵达。

    | 12 月 30 日。 | 抵达巴达维。 |

    | 1698 年 1 月 17 日. | 发现罗宾岛。 |

    | 2 月 12 日。 | 抵达桌湾。 |

    | 3 月 8 日。 | 离开桌湾。 |

    | 复活节。 | 抵达圣海岛。 |

    | 4 月 26 日。 | 离开圣海岛。 |

    | 5 月。 | 没发现赤道。 |

    | 1702 年 3 月 8 日. | 威廉三世去世；安妮女王继位。 |

    | 1705 年。 | 麦斯喀里纳。 |

    | 1707 年。 | 勒瓜向肯特公爵献他的书。 |

    | 1708 年 10 月 7 日. | 《勒瓜游记》首版出版。瓦伦廷访问好角。 |

