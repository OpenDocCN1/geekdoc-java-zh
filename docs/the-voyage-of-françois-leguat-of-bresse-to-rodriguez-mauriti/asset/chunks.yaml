    ### The Hakluyt Society.


    REPORT FOR 1890. SINCE our last Report `PYRARD’s VOYAGE`, edited by `Mr. Albert
    Gray`, has been completed by the issue of the second part of `Vol. II`; valuable
    appendices illustrating the early geography and history of the Maldives, together
    with a dictionary of some words of the language spoken in those islands, and an
    index, accompany this volume.


    The work on the River Plate, comprising the `VOYAGE OF ULRICH SCHMIDT`, and the
    `COMMENTARIES OF CABEZA DE VACA`, has also been issued to members. The `VOYAGE
    OF FRANÇOIS LEGUAT` is now ready.


    With regard to future arrangements, the `LETTERS FROM INDIA OF PIETRO DELLA VALLE`,
    edited by `Mr. Edward Grey` are in the printer’s hands. `Dr. Brown` promises us
    shortly `LEO AFRICANUS`; `Mr. Miller Christy` announces `FOXE AND JAMES` are nearly
    ready; `Lt. Cecil Dampier, R.N.`, is engaged upon `VOYAGES OF CAPTAIN DAMPIER`;
    `Mr. Thurn` writes from British Guiana that he is collecting material for These
    are the journals of `DALLAM`, who visited Constantinople in the early century.
    `Dr. Covel`’s journals, which are voluminous, will have to be abridged to bring
    the whole Work into the compass of one volume. Meanwhile, `Mr. Bent`’s expedition
    to Mashonaland will prevent him going on with the editing.


    In connection with Raleigh, the Council has also decided on publishing `VOYAGES
    OF KEYMIS AND BERRIE`; `Keymis` was an intimate friend of Raleigh, and it was
    the failure of the last voyage to Guiana that led the former to commit suicide.


    By the deaths of `Sir Richard Burton` in October this year, while holding the
    post of `H. M. Consul at Trieste`, and of `Sir John Henry Lefroy`, two more active
    members are removed from our list. `Burton` edited for us `HANS STADE’S CAPTIVITY
    IN BRAZIL`, and `Lefroy`—the `HISTORY OF THE BERMUDAS`.


    The accounts of the Society show a balance on the 31st December, 1890, of `£216
    9s. 1d.`, after paying a heavy bill for printing, etc. As this includes more than
    half the cost of `LEGUAT’S VOYAGE` for 1891, it is hoped that next year’s account
    will be much less.


    The list of Subscribed continues to be fairly well maintained, but more are wanted
    to complete the Works undertaken and suggested.


    The vacancies on the Council caused by the retirement of `Mr. JOHN BARROW`, `Vice-Admiral
    Sir F. W. RICHARDS`, and `Sir CHARLES WILSON`, and by the election of `Mr. Mark`
    to the office of President, are filled by `Mr. S. E. BOUVERE PUSEY`, `Mr. E. H.
    H. GUILLEMA`, `Captain Sir J. SYDNEY WEBB`, and `Captain W. J. L. WHARTON, R.N.`.

