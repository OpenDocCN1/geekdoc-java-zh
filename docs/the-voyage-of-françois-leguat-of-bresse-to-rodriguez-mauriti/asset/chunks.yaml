    In orig. : “ Enfin il rendit son Ame à Dieu.”^([3](#C01_chapter_split_000_split_001.xhtml_Rfn8_225))
    This epitaph is printed in the original on a quarto sheet, in two columns, surmounted
    by a strange device, in imitation or mockery, as we may suppose, of the heraldic
    ornaments which decorated the pompous epitaphs on contemporary monuments of the
    17th century. The centre is a coat of arms, with the name “ Boyer” under a fleur-de-lys
    and a star *or,* on a field *azure,* between two cherubims proper on a field *or;*
    surmounted by the name of Jehovah in Hebrew characters. On either side are two
    medallions ; on one of which is represented the adventurer’s boat at sea, with
    the legend, “*Nous n’avons point icy decite permanente*,” circumscribed. On the
    other side is the conventional phoenix on its burning nest, with its circumscription,
    “ *Dans la mort V immortalité y* Above all is a scroll beaiing the Latin words
    : *“Nascimur pares ; pares morhnur*,” The whole appearance of these fanciful designs
    is in keeping with the fashion then in vogue, as displayed in the emblems of Jacob
    Cats, of a few years’ earlier date.^([1](#C01_chapter_split_000_split_001.xhtml_Rfn8_226))
    “Illi robur et æs triplexCirca pectus erat, qui fragilem truciCommisit pelago
    ratemPrimus, nec timuit prsecipitem AfricuraDecertantem Aquilonibus,Nec tristes
    Ilyades, nec rabiem Noti.”(Horace, *Curmiuum*, lib. i, iii, *ad Virgilium.)*^([1](#C01_chapter_split_000_split_001.xhtml_Rfn8_227))
    The channel buoyed by Leguat’s companions was probably the western point into
    Mathurin Bay, the sole practicable harbour at Rodriguez. “The most convenient
    anchorage in Mathurin Bay is in 10 fathoms, bottom of sand and mud, off a small
    buoy marking the entrance to the creek. The creek is narrow but deep, running
    into the coral reef towards the settlement, and makes a good berth for the small
    schooners (*chasse-marics*, in Creole) which carry on the trade of the island.
    These place their anchors on the coral at the end of the creek about a quarter
    of a mile from the small town or village, mooring head and stern.” (Findlay, *op.
    cit.*, p. 516.)^([2](#C01_chapter_split_000_split_001.xhtml_Rfn8_228)) Another
    of Misson’s Italian references (?). See his *Voyage to Italy*, letter xvii.^([1](#C01_chapter_split_000_split_001.xhtml_Rfn8_229))
    In orig. ; “sur quelques hauteurs.” The highest point is Mount Limon, 1,300 feet.^([2](#C01_chapter_split_000_split_001.xhtml_Rfn8_230))
    The spelling of *lanthorn* which so long prevailed was doubtless influenced by
    the use of transparent sheets of horn for the sides of the lantern. (Wedgwood’s
    *Diet, of Eng. Etymology*.)^([3](#C01_chapter_split_000_split_001.xhtml_Rfn8_231))
    The *capoc* of the Latanier palm, mentioned before. (*Vide supra*, p. 65.)^([1](#C01_chapter_split_000_split_001.xhtml_Rfn8_232))
    Evidently Paul Bénelle.^([2](#C01_chapter_split_000_split_001.xhtml_Rfn8_233))
