    # I. ’Tis said I have too many Digressions.


    Upon this I desire you to consider two things, I confess that in writing these
    `Memoirs,` the same thought came often into my Head, as it did in the Abbot of
    `Choisy’s,` of whom we have more than once spoken. `I am sorry` (says he from
    time to time) that the Matter did not present it self as I would have had it—I
    give what I have`—`I wish I had something more pleasant to tell you.` The truth
    is, I frequently find my self in the same case; My Desart Islands did not furnish
    me with variety enough, and I confess I was sometimes oblig’d to go a little out
    of the way for it.


    Nevertheless if you do me Justice, I hope you will approve of the second Answer
    that I have to make. The true character of a good Relation, in my Opinion consists
    in containing the Remarkable things which the Traveller saw or heard, or which
    happen’d to him, and in such a manner, that the Reader may be as well inform’d
    of it, as if he had Travell’d himself, and had been an Eye-Witness of all that
    had happen’d. Granting this to be true, the Traveller ought to Communicate every
    thing that came to his Knowledge; his Conversations, Discourses, Adventures, Reflections,
    provided they have so much relation to the Voyage, that they cou’d not be learnt
    without it. On the contrary, the best and most agreeable thought will come in
    very `Mal à propos,` in a Relation of this Nature, if ’tis not, as one may say
    born in the Voyage, and do’s not properly and independently belong to it. Pursuant
    to this Idea, I might report at length, and keep still in my character of a Traveller,
    all the long Discourse upon the Subject of Women: All that is taken out of the
    `Golden Sentences,` all that is said on the Rights of Mankind, and almost every
    thing else which I have spoken of, that seems to go from the Subject.


    # II. Some advis’d me to put my Name to those `Memoirs` and others were of Opinion
    that I shou’d not do it. The latter grounded theirs on a Principle of Humility
    or Modesty, as the thing explains it self: And the former pretend that every Man
    who affirms Pact, is obliged to make himself known.


    I am entirely of their Sentiments. I believe that whoever speaks as a Witness,
    ought, as we say in `French,` to decline his Name, and to omit nothing that may
    serve to convince the Reader of his Candour, and the most exact truth of all he
    says. As to my self in particular, I own I never had any Opinion at all of a Voyage,
    without the Authors Name to it; nor even of the Relation of a Voyager of an indifferent
    Reputation, tho’ he puts his Name to his Work, if he do’s not also produce Witnesses,
    especially if he comes from a far Country. Who do’s not know the Disposition of
    all Men? A Traveller of an ordinary Character for Fidelity, and one who has no
    Witnesses to prove what he affirms to be true, is under a great Temptation when
    he conceals his Name to lace his History a little, to render it the more agreeable.
    And we have so many proofs of this Truth, that no body can doubt of its being
    true. I therefore conclude again, that those who tell the World any thing that
    is Rare, and that they saw in very remote Countries, are under an indispensable
    necessity to let the Publick know clearly, and distinctly who they are, and even
    to insinuate without Affectation, all the Particularities which are proper to
    acquire Credit. From whence it naturally follows, that the Authors of Relations
    which have no Name to them, are almost always Rogues and Cheats who impose on
    the Publick, and generally propose some base end to themselves by it. Such a one
    most certainly is the Author of a Wretched Book that appeared two years agoe,
    under the Title of `Historical and Critical Remarks, made in a Journal from Italy
    to Holland, in the year` 1704. `Containing the Manners of Carniola.` This Impudent
    Anonymous Author, whom we know, and who forg’d his Collection of Fables according
    to his common Practice, had no other view, besides a little vile and shameful
    Profit; but to insult against all the rules of Justice, a Person whom he ought
    to Honour, and one who has spar’d him too long; ’tis fit sometimes that certain
    Rascalls should have a mark set upon them, and that the World should know their
    Villainous Tricks, of which there are very few Persons that wou’d be sensible,
    if they were not told them.


    # III. It has also been said to me, when I was once like to die of a cruel Scurvy,
    at another time persecuted by an Army of Rats; when I have been expos’d to the
    fury of the Tempests and Hurricanes, or have been the Sport of a little Tyrant;
    ‘ Why did you engage yourself in such an Enterprise? did not you know that there
    is nothing more uncertain, nor more difficult, than Settlements in the New World,
    notwithstanding the fine Colours in which the particular Interests of some Persons
    will have them Painted? Cou’d you be ignorant of the great Labour, and the great
    Danger that attend the execution of such Projects as these?’

    '
