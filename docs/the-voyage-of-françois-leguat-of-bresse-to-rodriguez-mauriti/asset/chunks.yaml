    in the most notable particulars by eminent authorities in Europe.[¹](#B11_fm-chapter.xhtml_fn1_5)After
    a residence of two long years’ duration in Rodriguez, the settlers, wearied with
    discontent and hopeless of assistance, constructed a boat, in which they succeeded
    in reaching Mauritius after a most hazardous voyage. Unfortunately, they had only
    escaped from one evil to fall into greater trouble, for the avarice of the governor
    of the Dutch convict establishment caused them tobe treated with the utmost cruelty
    and injustice. They were imprisoned on an exposed rocky islet at a long distance
    from the shore, and in attempting to escape, one of their number perished miserably.
    At last the survivors, who had contrived to send news of their sad plight to Europe,
    were transmitted, still in confinement, to Batavia, where they disembarked, in
    December 1696, only to be again thrown into prison. After examination, however,
    before the Dutch Council their innocence was established, but they were unable
    to obtain the slightest redress for the pain and suffering they had endured, or
    compensation for the losses they had sustained. It was not until March 1698, after
    the proclamation of the Peace of Ryswick, that Leguat and two others, the sole
    survivors of the original party, landed at Flushing.At this period crowds of French
    refugees were Streaming over to Britain, and it is interesting to hear what a
    friend of Leguat, writing at this period (1697-1698), says on this subject. M.
    Henri de Valbourg Misson (not Maximilien Misson, whose connection with Leguat
    will afterwards be discussed) writes :“ The *French* Protestants that fled into
    *England* are so spread over the whole Country, that it is impossible to be certain
    or so much as guess at their Number. Besides the eleven Regiments which are wholly
    made up of them, there are some in all the other Troops. A vast many of both Sexes
    are gone into Service in various *English* Families ; so that there is scarce
    any considerable House, where you may not find some of our Nation. Many have set
    up Manufactures in the Country and Churches at the same time : Abundance went
    to *Scotland* and *Ireland,* to *Jersey* and *Garnsey.* At present there are Two
    and twenty *French* Churches in *London,* and about a Hundred Ministers, that
    are in the Pay of the State, without reckoning those that are arriv’d at other
    Means of subsisting.” (M. Misson’s *Memoirs and Observations in his Travels over
    England* (1697-98). Written originally in French, and translated by Mr. Ozell,
    1719.)Among others of his compatriots Leguat now migrated from Holland to England,
    where he seems to have settled for the remainder of his life. He was about sixty
    years old, but it was not until 1708, when he was a septuagenarian, that the manuscript
    of his *Relation* was printed and published in London, in French and English simultaneously,
    whilst a French edition was published in Amsterdam,[¹](#B11_fm-chapter.xhtml_fn1_6)
    and a Dutch version was printed at Utrecht *in quarto.[¹](#B11_fm-chapter.xhtml_fn1_7)*
    These original editions were soon followed by German translations printed at Frankfort
    and Leipsic in 1709, another French edicion was produced in London in 1720, and
    an abridged edition appeared later in 1792\. [There was another abstract translation
    published under the title of *The French Robinson*,[²](#B11_fm-chapter.xhtml_fn1_8)
    and one[¹](#B11_fm-chapter.xhtml_fn1_9) was prepared but never published m 1846.]The
    book was well received, and reviewed favourably by the literary journals of the
    day, so that its publication brought its author into notice, and Leguat became
    acquainted with Baron Haller[²](#B11_fm-chapter.xhtml_fn1_10) and other scientists
    of that day ; among others who thus came to know him was Dr. Sloane, the secretary
    of the Boyal Society. The adventurous traveller remained in exile in England,
    and, from a contemporary notice in the *Bibliothèque Britannique,*[³](#B11_fm-chapter.xhtml_fn1_11)
    it appears that he attained the great age of ninety-six years before he died at
    or near London in September 1735.According to M. Eyriés,[⁴](#B11_fm-chapter.xhtml_fn1_12)
    in the *Biographie Universelle,* the narrative of Leguat’s voyage was generally
    supposed to have been published by a certain unfrocked Benedictine monk, named
    Frédéric Auguste Gabillon. This person was an ingenious literary adventurer, who,
    having completed his studies in Paris, joined the order of the Théatins, but soon,
    repenting the sacrifice of his liberty, escaped from his convent and fled to Holland,
    where he shortly after professed the reformed religion. Being without resources,
    he worked at compilations for booksellers, but getting into debt went over to
    England, where he took the name of Jean Leclerc (a noted journalist) and imposed
    on several persons of distinction.[¹](#B11_fm-chapter.xhtml_fn1_13)It is certainly
    possible that this renegade may have imposed on the simple-minded Leguat ; and,
    indeed, President Bouhier (as evidenced by a note in his handwriting in his own
    copy of Leguat’s book) was of opinion that Leguat owed to Gabillon *les faits
    altérés* and the digressions on the advantages and disadvantages of marriage,
    which are so prominent in our author’s work. Baron Haller, who, as already mentioned,
    knew him personally, always declared that Leguat was a frank and sincere man ;
    nevertheless, M. Bruzen de la Martinière, also a contemporary, in his *Geographical
    Dictionary,* does not scruple to class Leguat’s Voyage among “the fabulous travels
    which have no more reality than the dreams of a fevered brain”. Ever since, this
    very inaccurate judgment has not seldom been held by many. On the other hand,
    the observations of Leguat have been amply confirmed by the evidence of his contemporaries
    and of voyagers who followed in his footsteps ; while recent investigation has
    proved the general correctness of his observations in a remarkable degree.M. Jacques
    Bernard (the successor of Pierre Bayle), in his continuation of Bayle’s *Noucelles
    de la République des Lettres,* for December 1707, noticed Leguat’s volume when
    first published, and made the following critical remarks on its authorship :“The
    Preface of this Book is not by the Author of the Work. He who has composed it
    maligns various persons of merit, some of whom will perhaps scorn to notice his
    insulting expressions, and others will not fail to retaliate on the first opportunity.
    I (M. Jacques Bernard) have already received from two separate sources a Memoir
    and a Letter against this Preface. But as they concern personal quarrels in which
    the Public has no interest, I have not thought fit to insert them in my Review,
    especially the Memoir, in which the attacks of the Author are warmly repulsed.
    I have already, elsewhere, advertised that, if Ī cared to utilise all the writings
    which concern the personal disputes of Authors, I should have room for nothing
    else. I repeat my notice again, that unless the Memoirs sent to me contain something-useful
    to the Public, I cannot publish them.“ A person very well informed on all subjects
    of which the narrative is given in this book of travels tells me that there are
    some facts exaggerated, that some essential points have been omitted, and that
    some others are inserted which are absolutely false. In this last class may be
    placed a certain argument of some length on the advantages and disadvantages of
    marriage, which is, to my taste, the most uninteresting reading in the whole book
    ; the fictitious columns on which were engraved the names of the voyagers, said
    to have been left in the Island of *Rodrigue,* and the Epitaph on Sieur Isaac
    Boyer, which may be said to be both ridiculous and slightly fanatical. It is asserted
    that the author blames without reason the design which the voyagers had in leaving
    the spot where they were wasting their youth miserably in idleness. It is said
    that he has had little consideration for a distinguished family (Bénelle ?) in
    attributing to one of its members frivolous schemes which he most assuredly never
    advanced. In short we are told that the whole Book is a tissue of rubbish *(fatras),*
    which so obscures the real adventures that it is necessary to recast it altogether
    iu order to correct it, which someone will, perhaps, be able to do some day.“
    It is astonishing that a stranger’s hand should thus have disfigured a Voyage
    which was perfectly capable of attracting interest by the mere recital of the
    actual adventures, of which it could have been composed. Those who have met with
    some of the persons mentioned in it know that it was not necessary to exaggerate
    these adventures to render them interesting, as they were sufficiently so in themselves.
    We shall give a very short extract from it, in which we shall try to disentangle
    the truth from the false as much as we possibly can...“ In spite of some additions,
    made in various places of this Voyage, which consist mostly of reflections, which
    it is easy to distinguish, the reading of it is most agreeable.”“In fact,” writes
    M. Th. Sauzier[¹](#B11_fm-chapter.xhtml_fn1_14) :—“Casimir Freschot (a laborious
    writer, translator and compiler, 1676-1716), the anonymous author of *Remarques
    Historiques et Critiques,* etc., whom Leguat, without naming, indicates and severely
    vilifies in his preface, tells us that this self-same preface[²](#B11_fm-chapter.xhtml_fn1_15)
    had been composed by one well-known Maximilien Misson, and that the work had been
    drawn up by Paul Benelle of Metz.” *( Vide, Nouvelle Relation de la Ville et République
    de Vénise.* Utrecht, 1709.) At the same time, M. Sauzier informs us, there appears
    under the name of Leguat, in the *Catalogue Général des Livres composant la Bibliothèque
    du Département de la Marine* (Paris, 1840), the following note : “ The Preface
    is by Maximilien Misson ; the work has been written by Paul B... of Metz.”Nevertheless,
    Maximilien Misson apparently refers to this work on Venice in his preface to the
    fourth edition of his *New Voyage to Italy,* 1714, wherein he states :—“ Some
    Time ago, a friend of mine wrote me word from *Holland,* that a certain Priest
    of the Romish Sect[¹](#B11_fm-chapter.xhtml_fn1_16) had published a *French* Translation
    of a little *Italian* Book, which is a small Abstract of the Lives of the Doges
    of Venice ; and that this Man takes an Occasion to speak undecently of the worthy
    Mr. *Amelot* and of *Us* because of certain Truths that we have both Written with
    some Freedom, concerning that Country. If that Book happens to come into *England,*
    and it should fall into our Hands, we may perhaps consider it a little, and say
    something more particular of it in some other Place. But since it seems to be
    condemn’d to the *Scombri* of *Horace* and *Martial ;* and none of those that
    publish Journals of Littérature, having yet vouchsafed to mention it, I may very
    well say of the Censures of this Author, what the same Martial said of the despicable
    Verses of a certain *Diauhis ;* without giving myself the Trouble of refuting
    him any other Way.*Versiculos in me narrant scripsisse Diaulum; at Non scribit
    cujus Carmina nemo legit.*I will then content myself with adding a Word concerning
    the Book of Mr. Leguat (A good and honest Gentleman) in[²](#B11_fm-chapter.xhtml_fn1_17)
    which they assure me that the Priest speaks much otherwise than he ought to do.
    It seems, say they, that he grounds his unjust Liberty upon the Account he has
    seen of Mr. *Leguat’s* Book, in the Journal that is intituled, *Nouvelles de la
    République des Lettres ;* in which the Author of the said *Nouvelles* uses very
    ill, without any Reason, both Mr. *Leguat,* and the Relation he has published.“
    These sort of *Journals* ought not to be tiirn’d into *Defamatory Libels,* no
    more than *Sermons.* The Journals *of Paris Amsterdam, Leipsick, Trevoux,* nor
    any of the Rest, have nothing in ’em but what is civil ; and the good *Republick
    of Letters,* is not at all pleas’d with Reading such slandering *News.* It would
    be a strange Thing indeed, that the most innocent and commendable Persons should
    be inevitably expos’d to the Mercy of malicious *Preachers* and *Journalists,*
    of the like Character, because their *Satyrs* generally go unpun-ish’d. Some Reasons
    which are not necessary for me to explain here, oblige me to say here in favour
    of Mr. *Leguat,* that the Relation he has published, is *faithful* and *true*
    ; as reasonable Persons also agree that it contains many Circumstances which are
    very extraordinary and worth Relating ; I am equally certain of both. The Objections
    that are made against an Epitaph, and two other small Particulars of that Nature,
    in his Book, are fit only to shew the Inconsideration of those that make ’em,
    as well as their great Unkindness. As it has often happen’d, that the “Writer
    of the abovesaid *Nouvelles* has ridicul’d some Books of which he has made Extracts,
    so he took a Fancy (judging of others by himself) that Mr. *Leguat* was pleased
    to play upon the *Abbot de Choisy,* in quoting some Words out of one of his Books.
    But he ought not to give such a traducing Turn to Mr. *Leguat’s* Conduct, which
    has been very innocent. I know upon his secret and sincere Protestation, that
    he never had the least Intention, in his mentioning the deserving Gentleman I
    just now nam’d, to say any Thing that cou’d be taken in a disadvantageous Sense,
    and might derogate from the great Esteem he has for him.”Now, it is noticeable
    that Maximilien Misson does not, in the above quoted extract, deny the authorship
    of Leguat’s preface attributed to him ; whereas in a few pages afterwards he takes
    the trouble to disclaim the authorship of another work fathered upon him, although
    he acknowledges to some share in its production :—“ The Authors of the Journal
    of *Trevoux,* have been mis inform’d concerning another Fact, of which I shall
    take Notice here, since I have an Opportunity of doing it. I declare that the
    Book, which they mention, Page 323, of their Third Volume, and which is attributed
    to me, as they ^(sa)y. by the general Consent, is none of my Works. I had some
    Share in the Edition that was made of that Rhapsody...M. Misson evidently thought
    that M. Bernard had a grudge against him, for he adds :—“ He of whom we have already
    spoken, who writes (or did write not long ago) *la suite des Nouvelles de la République
    des Lettres* (of which the Famous Mr. *Bayle* was the first contriver, and who
    always has sought after every Opportunity of disobliging, by a Miserable Return
    of Revenge, a Person who never gave him the least Offence whatsoever .... he affected
    to Advertise the Publick (or those that read his *Nouvelles)* that I was the Person
    whom Father *Montfaucon* attack’d and contradicted ; for truly, this Father points
    at me without mentioning my Name.”Maximilien Misson, who was a Huguenot by birth,
    and a refugee in England subsequent to the revocation of the Edict of Nantes,
    was notable for his extreme fanaticism and Protestant zeal. He is best known by
    his *Nouveau Voyage d’Italie,* to which Addison added his remarks. The Benedictine
    monk, Père Freschot, in his *Remarques historiques* (Cologne, 1705), had exposed
    with vigour the rude jokes in which Misson had indulged against the Romish Church,
    aud, writes M. Weiss, “ Misson replied to him most bitterly in his preface to
    the *Voyage* of François Leguat, of which he was the real editor, and not Gabillon,
    as President Bouhier had supposed ; and Freschot replied to him with sharp retorts
    in the *Nouvelle Relation de la ville de Venise.”* (Vide *l’Examen Critique des
    dictionnaires,* par M. Barbier, tom. 1^(er), p. 355, 1820.)It indeed seems from
    the above, as well as from the internal evidence afforded by comparing many interpolations
    in the text of Leguat’s narrative with parallel allusions in Misson’s previous
    works, that either Misson must have been the compiler and collaborateur of Leguat’s
    book, or Leguat must have repeatedly referred to Misson’s publications. In the
    notes subjoined to the text several of these passages are brought to the attention
    of the reader ; but, on the other hand, M. Th. Sauzier, whose careful examination
    of the subject entitles his opinion to be received with the greatest respect,
    seems to consider that the assertion, that Leguat was not the author of the whole
    work bearing his name, is without any foundation. M. Sauzier argues that the notice
    above quoted from the *Bibliothèque Britannique* establishes a perfectly clear
    and precise statement in an authoritative work,[¹](#B11_fm-chapter.xhtml_fn1_18)
    published at the very time of Leguat’s death, that our centenarian, who had preserved
    to the last his great freedom of mind and body, was indeed the very author of
    the book in question.“ For besides,” he writes,“ what credence can be placed in
    this Freschot, the very same who is so abused in the preface of Leguat, a nd who,
    without furnishin any proof, tells us that neither the preface nor the work are
    written by that traveller ? “Had he not some interest in attributing this preface
    to Maximilien Misson, who, in 1691,had published, likehimself, a work upon Italy:
    *Nouveau Voyage en Italie?* As to the note inserted in the Catalogue of the Marine
    Library, M. Sauzier is under the impression that it is merely a reproduction of
    what Freschot said. “The son of a merchant of Metz, Bénelle was one of the seven
    adventurers, the companions in misfortune of Leguat, the only one whom he, from
    some motive of which we are not informed, has designated by initials (see page
    6).Bénelle returned into Holland in 1698 with Leguat and Jacques de la Caze. The
    last proceeded to settle in America ; Leguat proceeded to England, and Bénelle
    lived at Amsterdam, where he died in 1746\. Jean Beckmann, in his *Histoire littéraire
    des Voyages,* published at Göttingen in 1808-10, writes :—“ ‘ The truth of the
    Narrative of Leguat can be established by a valuable testimony : He names Paul
    B..., one of his two companions who returned with him, in 1698, to Flushing. A
    descendant of this B. is the wife of Councillor Von Martens, to whom I owe the
    following information :—Paul Bénelle was with his father, when they were obliged
    to quit France on account of their religion ; they betook themselves to Amsterdam,
    where, at the age of twenty years, Paul decided to make the voyage to Eden, which
    du Quesne had depicted in so charming a fashion. After eight years he came back
    to his father at Amsterdam. There he lived, after having contracted two marriages,
    until 1746 [that is, eleven years after Leguat’s death], that is to say, until
    the age of 70 years. He has acknowledged the truth of Leguat’s story, although,
    indeed, he was not precisely his friend. This Bénelle has also left a journal,
    which probably yet remains in the hands of the heirs of Pierre Bénelle, his grandson,
    deceased a short time ago at Amsterdam. Can this-manuscript be published ? ‘“
    Thus, Bénelle, who died eleven years after Leguat—Bénelle, the very same to whom
    has been attributed the authorship of Leguat’s Adventures, who was not precisely
    the friend of Leguat, has formally acknowledged that Leguat was undoubtedly the
    author of that work.“ Any doubt is no longer possible ; the French Esquire, Leguat
    of la Fougère, the chief of the expedition of the *Hirondelle,* the exile of the
    desert islands Rodriguez and Marianne, is the self-same individual who has published
    *The Voyages and Adventures of François Leguat and of his Companions.”*Nevertheless,
    M. Sauzier’s arguments, forcible as they are, will not convince other critics
    who hold to their opinion that Leguat’s MS. was largely manipulated by M. Misson,
    who not impossibly may have bean assisted in the English translation by Ozell.An
    abstract of Leguat’s narrative was published by M. Charles Grant, Viscount de
    Vaux, in his well-known *History of Mauritius,[¹](#B11_fm-chapter.xhtml_fn1_19)*
    compiled from the papers of his father, Baron Grant.He writes :—“ N.B.—As the
    extract from Le Guat, on the Island of Rodriguez, may perhaps he found long, I
    think proper to explain my motives on the subject.“ The residence of Le Guat,
    and his companions in that island being the sole event which furnishes us a sort
    of historical description, it was necessary to mention it. By attachment to truth
    and justice, I could not do better than to let the author speak himself; knowing
    that this manner, which has been adopted by *Anacharsis, &c,* offers more interest
    to the reader. However,’ it has cost me more labour than if I had written the
    whole in my own way ; because I have been obliged to correct the style, and to
    shorten it in every part, which seems to me tedious, prolix, and often of erroneous
    systems ; besides he places Rodriguez at two hundred leagues from Mauritius, whereas,
    it is not half, as I make him say.....I wish the knowledge I present of this island
    may be sufficiently convincing of the advantages which may be reaped from it,
    that it should no longer remain useless to humanity.”An abbreviated version of
    Leguat’s adventures has lately been published with the annotations of M. Eugène
    Muller, the Librarian of the Arsenal at Paris, in the series of Voyages brought
    out by M. Dreyfous.[¹](#B11_fm-chapter.xhtml_fn1_20) M. Muller has kindly permitted
    the Editor of the following reprint to make full use of his notes, many of which
    have been thus utilised to the great advantage of the members of the Society.By
    far the most valuable contribution, however, to the *literary* and bibliographical
    history of Leguat’s work is the lately published *brochure,*[²](#B11_fm-chapter.xhtml_fn1_21)
    by M. Th. Sauzier of the Paris Geographical Society, including the reprint of
    what is perhaps an *abrégé* of Marquis du Quesne’s remarkable pamphlet, till lately
    only known by the extracts quoted in Leguat’s narrative. M. Sauzier’s arguments,
    which are not indisputable, have already been quoted above as proving the authorship
    and veracity of the philosophic and pious refugee. A translation of du Quesne’s
    original scheme for colonising Reunion was to have been included at the end of
    this present reprint, but want of space prevents its appearance.The interest attaching
    to Leguat’s narrative, as before observed, centres (apart from its simple and
    picturesque originality and charming style in which the touching story of adventure
    is told) in the important details of the natural history of Rodriguez which are
    contained therein. Before touching on this portion of the work, therefore, a few
    words on the island of Rodriguez may well find a place.The small island of Rodriguez,
    although but a poor dependency of the colony of Mauritius, has considerable interest,
    both for naturalists and geographers, yet it seldom receives much attention either
    at home or abroad, and it is only occasionally that the general public hears of
    its existence. Years ago, however, when the road round the Cape to the East Indies
    was first opened to navigators, this island was regarded as one of the ports of
    call, until the colonisation of Mauritius rendered the more important island a
    safer harbour of refuge, and a bettev haven for refit and refreshment.Rodriguez,
    or Diego Rais, lies about 330 miles to the eastward of Mauritius, of which island
    it is a dependency, and is the third island of importance in the Mascarene archipelago.
    It is ten miles long; in an east-north-east and west-south-west direction, and
    four miles broad, with an area of about forty-three square miles.An extensive
    coral reef encircles the island, varying much as to its distance from the shore.
    At the south-eastern point of the island it is only twenty yards from the shore
    ; from the western end it extends four-and-a-half miles in a southerly, two-and-a-quarter
    miles in a westerly, and four miles in a northerly direction. The history of the
    discovery of this island will be found in the Appendix (p. 308), which deals with
    the earliest voyagers who touched at the Mascarene Islands. It may be mentioned
    here, however, that on the 25th of June 1638, the *St. Alexis* of Dieppe, commanded
    by Captain Alonso Goubert of Dieppe, came up with the island of Diego Ruiz, “
    lying in twenty degrees of south latitude, about forty leagues from Madagascar,”
    as this was the first French ship that ever visited the Mascarene islands. “ We
    landed,” writes François Cauche of Rouen,[¹](#B11_fm-chapter.xhtml_fn1_22) “ and
    set up the arms of France on the trunk of a tree, our ship keeping out at sea,
    not being able to anchor by reason of the depth ; so that as soon as the King’s
    Arms were fix’d, those who had done it, returned aboard in the boat, as they went.”After
    the departure of Leguat and his comrades in 1693, some English officers appeared
    to have stayed for a while and surveyed Port Mathurin in 1706 or 1707 ; as is
    stated in a report made by M. de Parat, Governor of He Bourbon in 1712 to the
    Minister of Marine in France, in answer to a request for information as to the
    capabilities of Rodriguez. Port Mathurin (now designated by this denomination
    for the first time) was described as being difficult to enter, but available for
    the anchorage of vessels of thirty guns ; and it was further stated that, apart
    from the quantity of tortoises found there, the island was of no use to the French
    East India Company.In 1725, says M. d’Avezac, the Government of Bourbon, under
    the President of Council, M. Des-forges Boucher, decided to take possession of
    Rodriguez in the name of Louis XV, and a vessel was despatched thither, whose
    officers made a geodetic survey of the island, the original map of which is said
    still to exist in manuscript at the Depot of Charts, in the Marine Office at Paris.[¹](#B11_fm-chapter.xhtml_fn1_23)
    The curious *Relation de Vile Rodrigue*,[²](#B11_fm-chapter.xhtml_fn1_24) found
    by M. Rouillard among the archives of the Ile de France at the Marine Office in
    Paris, dates from this period, as it follows the Proceedings of the Council, which
    ordained the project of settling the island of *Diego Ruys*, as Rodriguez was
    then named ; although, on this occasion, M. Th. Sauzier states that the name of
    He Marianne was given by the French visitors to the island.[³](#B11_fm-chapter.xhtml_fn1_25)
    A superintendent and guard were established on the island from this date, as it
    is mentioned that the guard-house of the French superintendent in the bay of the
    Ouen Valley was entrusted in the year 1740 to a negro family.Thirteen years afterwards
    (1748), Admiral Boscawen, who so boldly led his squadron across the locality,
    supposed to be occupied by the reefs of Cargados Carayos (see Chart, p. 308),
    examined the capacity of the roadstead at Rodriguez for the accommodation of shipping
    ; and it must have been previous to 1756 that a regular establishment was formed
    for the preservation of turtles to supply the Ile de France and Bourbon with such
    fresh provision.“ This fishery”, wrote Mr. Charles F. Noble[¹](#B11_fm-chapter.xhtml_fn1_26)
    (alluding to the sea-turtles), in that year, 1756, “is thought so useful at Mauritius,
    that they have always a sergeant’s party on that little island of Rodriguez, who
    collect all the fish they can, for the boats that are sent to bring them at certain
    times, and the ships that generally touched there on their way to Mauritius. There
    is, also, a particular spot of ground inclosed here, for keeping and breeding
    land tortoises for the same purposes.”It was in the year 1671, that, on Thursday,
    28th of May, the first scientific observer, Abbé Pingré, accompanied by his assistant,
    M. Thuillier—“ un jeune homme tres versé dans la haute géométrie, et initié dans
    la théorie et dans la pratique de l’astronomie”—set foot on shore in the *isle
    desirée* of Rodriguez. The expedition had left L’Orient in January, on board the
    French East India Company’s ship *Le Comte d’ Argenson,* arriving at Mauritius
    on the 7th of May, where the news of the capture of Pondicherry had just reached.
    M. Le Gentil had embarked two months previously at Port Louis for the above-named
    Indian port, which he was not destined to enter on this voyage. These scientists
    had been dispatched by the French Academy, under the auspices of the Cardinal
    de Luynes and Mons. Le Monier, to observe the transit of Venus on the 6th of June
    1761\. Pingré sailed from Mauritius on the 9th of May, and was, therefore, three
    weeks in getting to Rodriguez from Port Louis in the corvette *La Mignonne,* a
    dead beat to windward, reaching as far south as 28° 30’. The astronomical party
    remained at Rodriguez until the 8th of September, on which date the *Mignonne*
    took them back to Mauritius. Pingré’s journal has never been published, for its
    interest was overshadowed by the voluminous quartos of Le Gentil. The astronomical
    details duly appeared in the *Histoire de l’Académie* (1761, p. 102) and *Mémoires*
    (1 761, pp. 415, 985). Pingré planted his observatory on the traditional site
    of Leguat’s settlement, and it is interesting to note his opinion of our adventurer
    and the current judgment of contemporary opinion at that period, presumably at
    Mauritius, as well as in France. For doubtless Pingré, before starting, would
    have taken an interest in ascertaining all reliable information regarding the
    small islet where he proposed to take his observations. He writes :“I made my
    observations in the ‘enfoncement nommé de François Leguat’, on the northern side
    of the island, at the spot marked A on the plan, in 19° 40’ 40” latitude, and
    80° 51’ 30” long. The name which this locality bears has been given to it in memory
    of François Leguat, a Bourguignois gentleman who, having left France for the sake
    of religion, in 1(389 betook himself to Holland, where he embarked the following
    year on the ship *Hirondelle.* He intended, in company with several other French
    refugees, to found the nursery of a new colony, either at Bourbon Island, which
    he believed had been abandoned by the French, or at Rodriguez. In fact, they disembarked
    at Rodriguez, to the number of eight, on the 10th of May 1691 ; they established
    their abode in the aforesaid locality, and remained there until the 31st of May
    1093, when, tired of their solitude, they abandoned themselves to the sea in a
    kind of boat which they had constructed for the purpose. A stiff breeze occurred,
    and was taken by them for a storm ; they, nevertheless, arrived safe and sound
    at Mauritius, on the eighth of the following month. *Les Voyages et Aventures
    de François Leguat* have been printed in two vols, in 12°, at Amsterdam, in 1708\.
    This work *‘passe pour un tissu dc fahles ; fen ay trouvé beaucoup moins que je
    ne m’y attendois.* We find in the narrative of Leguat a plan of Eodriguez, which
    does not at all resemble that island. [Compare maps, pp. xvii, 1.] That which
    I give here is the result of a journey which we have made—M. Thuillier and myself—around
    the island ; we have traversed many times nearly all the northern coast line.
    As the sight of M. Thuillier is far better than mine, I have let him take nearly
    all the angles. The triangles which we have formed round the island have been
    connected with a base which we laid out in our *enfoncement de François Leguat,*
    and which measures four hundred and eight toises (eight hundred and three yards).....”The
    taking of Rodriguez by the English under Captain Kempenfelt prevented the astronomers
    completing their survey of the island.We get a glimpse of the little colony from
    the Abbé’s journal.He says :—“ The island of Rodriguez is generally inhabited
    only by a French officer, who commands a dozen or fifteen blacks, whose principal
    occupation is to catch the tortoises in the different parts of the island ; they
    collect these tortoises in a park, and send them to the Isle de France on the
    corvettes, which they dispatch from time to time for this cargo. These blacks,
    natives of Madagascar or from India, are, the most part, slaves of the Company
    ; there are, nevertheless, some free men. The work of these is paid for at the
    price agreed when they are hired. There was, besides, at Rodriguez, when I arrived
    there, a surgeon and a corporal of the island, both Europeans. The commandant
    can have with him his family and his slaves, if he has any. Such was the colony
    of Rodriguez in 1761.“When the Governor of the Isle de France sends a corvette
    to load up with tortoises, he sends at the same time a provision of rice, sufficing
    for the maintenance of the colony. For its defence, M. de Puvigné had erected
    on the sea-coast a battery of six pieces of ordnance, two prs.[¹](#B11_fm-chapter.xhtml_fn1_27)
    Most of these cannons had belonged to French ships. As Rodriguez is only kept
    in order to obtain its tortoises one would think it unnecessary to place it in
    a state of defence. One would hardly imagine that it would enter into the minds
    of the English to form there a base from which they could attack the Isle of France
    to more advantage. . . . All those who live at Rodriguez make profession of being
    Christians ; but each one after his own fashion. This one may eat of everything,
    because the Capuchin priests who instructed him had represented that the distinction
    of victual customary in his country had resulted from superstition. Another would
    abstain from eating beef, because his conversion had been effected by the ministry
    of other missionaries, more accommodating to the opinions of the people. They
    called these *Paulist-Christians,* being baptised by those who belong to the Church
    of Saint Paul at Pondicherry. The others were named *Capuchin-Christians.*Public
    worship at Rodriguez was reduced to ringing the *Angelus* every day, which no
    one said. Resides, the Commandant insisted on his slaves attending prayers offered
    by a slave who had never been baptised. There was neither church nor chapel, anil
    there had never been anything of that kind there. Francois Leguat and his companions
    served God, in their manner, with greater exactitude than has been observed by
    the Catholics ever since they have been established in this island. There is,
    nevertheless, at Rodriguez a cemetery, consecrated by some chaplain of a ship,
    who has wished to leave this monument of the visit of a minister of the true Church
    to this neglected island. At the same time, I am assured that this neglect ought
    not to be imputed to the zealous missionaries, who till the ground, otherwise
    almost uncultivated, of Bourbon, and of the Isle of France.....”To commemorate
    the observations of the Transit of Venus expedition under Pingré, Le Monnier proposed
    placing the *Solitaire* among the southern constellation,[¹](#B11_fm-chapter.xhtml_fn1_28)
    “ but, being a better astronomer than ornithologist, he, inadvertently,” says
    Dr. Hamel.[²](#B11_fm-chapter.xhtml_fn1_29) “ gave this honour not to the Didine
    bird of Rodriguez, but to the Solitary Thrush of the Philippines *(Monticola eremita),*
    figured by Brisson, vol. ii, pi. 28, f. 1, instead of copying Leguat’s figure
    as he might have done.”Kempenfelt surveyed Port Mathurin the same year, by order
    of Admiral Cornish, who was then cruising about the Mascarene Islands. A landing
    was effected on the island,[¹](#B11_fm-chapter.xhtml_fn1_30) but the mortality
    among the crews of the ships was so excessive that they very soon re-embarked.In
    August 1764, the administration of the Mascarene Islands passed into the hands
    of the King, Louis XV ; and in 1768, M. Dumas, the Governor of the Islands, deported
    M. Rivalz de Saint-Antoine, a member of Council of the Isle of France to Rodriguez,
    for having protested against the arbitrary proceedings of the military administration.
    However, the exile of M. de St. Antoine did not exceed a year, after which interval
    he was released on the recall of M. Dumas to France. For forty years now the little
    island enjoyed peace and tranquillity ; only the tortoises and turtles suffered
    deportation to the hospitals of Bourbon and Mauritius ; but Abbé Pingré’s surmise
    as to the improbability of the English ever finding the advantage of holding Rodriguez
    as an entrepôt, from which to organise an attack on Mauritius, was destined to
    be put to proof most decisively. As a preparatory measure to the project of capturing
    the Ile de France and the He Bonaparte (now Réunion), as the Ile de Bourbon had
    been then lately renamed, Vice-Admiral Bertie, commanding the Cape naval station,
    entrusted Captain Rowley[¹](#B11_fm-chapter.xhtml_fn1_31) with the strict blockade
    of the Mascarene Islands in 1809 ; and early in that year a small advanced force
    of 200 Indian troops, accompanied by 200 of the 56th Foot, under Lieut.-Col. Keating,
    embarked from Bombay and occupied Rodriguez, on the 4th of August, where a depot
    was established for the supply of the cruisers blockading the islands, and a small
    fort was erected. From Rodriguez an expeditionary force of 368 officers and men,
    with 100 bluejackets and 136 marines from the squadron, proceeded in September
    to the He Bourbon, and captured the insignificant works at St. Paul’s, where a
    landing was effected and the shipping burnt ; but the island was not occupied,
    and Colonel Keating retreated his force to Rodriguez, where preparations were
    continued for the attack on Mauritius, and the force in the British *place d’armes*
    at Rodriguez was augmented by 1,700 Europeans and about 1,800 Sepoys. This expedition
    was detained on the island until the 3rd of July 1810, when another attack was
    made in force on Bourbon, which was now taken and properly occupied, whilst a
    closer blockade of Mauritius was effected.In November, Vice-Admiral Bertie having
    arrived at Rodriguez, a division of troops from Madras joined the convoy from
    Bengal, when the united expedition sailed from Rodriguez, under General Abercrombie,
    whose troops, being landed at Cape Malheureux, accomplished the easy conquest
    of the Ile de France by the 3rd of December, on which date the capitulation was
    signed.Subsequent to the capture of the Mascarene Islands by the British, Rodriguez
    long remained little heard of and unnoticed by the outside world. The open-boat
    voyage of François Leguat, which by many had been regarded as an improbable feat
    of navigation, in spite of the sneer of the Abbé Pingré, has, notwithstanding,
    been repeated more than once. M. Th. Sauzier records the fact that, about 1825,
    Captain Doret, who later became a Rear-Admiral and Governor of Réunion, and later
    a member of the French Senate, left Rodriguez in an open boat, accompanied by
    a few sailors, and reached Mauritius, where he succeeded in obtaining assistance
    and rescue for the remainder of the crew of his ship which had been wrecked on
    the reefs outside the island.The interest in Rodriguez after the commencement
    of the present century was felt only by scientific naturalists, who now began
    to appreciate the loss sustained by the world through the total destruction and
    extinction of original fauna and flora in various countries throughout the world.In
    Mauritius a Society of Natural History had been formed by Mr. Telfair, Dr. Lyall,
    and Professor Bojer, on the foundation of an older Société d’Emulation, when Sir
    Charles Colville was Governor in 1829\. In the following year, the secretary of
    this Society, M. Desjardins, obtained certain bones encrusted with stalagmite,
    which had been found many years before (about 1789) in one of the caves of Rodriguez
    ; and this find appears to have induced Mr. Telfair to urge Colonel Dawkins and
    M. Eudes, who were then at Bodriguez, to make further search for the bones of
    Didine birds. M. Eudes succeeded in digging up in the large cavern various bones,
    including some of a large kind of bird which no longer existed in the island.
    A bird of so large a size as that indicated by the bones had never been seen in
    the island by M. Gory, who had resided there for the last forty years, *i.e.,*
    since 1790. It may be here remarked that Pingré had remarked with regard to the
    Solitaire, in 1761, that M. de Puvigne had assured him that these birds were not
    even then totally extinct, but that they had become extremely rare, and were only
    to be found in the most inaccessible parts of the island.[¹](#B11_fm-chapter.xhtml_fn1_32)It
    would therefore be during the period between 1760-1790 that the final disappearance
    of the species may have taken place. The next excavations were made by Capt. Kelly,
    R.N., of II.M.S. *Conway, dit* the request of Mr. Cunninghame, in 1845, but the
    search was unsuccessful. The bones procured by M. Telfair were exhibited by M.
    Cuvier in Paris, and subsequently compared by Messrs. Strickland and Melville
    with the remains of the Dodo in the Ashmolean Museum at Oxford. The reconstruction
    of the ideal skeleton from these fragments showed that the species to which they
    belonged was unquestionably allied to, though not identical with, the Dodo, and
    it was rightly assumed that they belonged to the species described and figured
    by Leguat as the Solitaire. It was also discovered by these eminent naturalists
    that the points of agreement between these two extinct birds are *“shaved in common
    with the Pigeons, and exist in no other known sliecies of bird”.* A triumph of
    ornithological diagnosis.The coral reefs round Rodriguez have ever been a source
    of danger to seamen navigating those seas, especially on the homeward route. In
    1843, two vessels were wrecked upon the *Quatre-vingt Brisans* at the S.W. extremity
    of the island, where the waves break at a great distance from the shore.[¹](#B11_fm-chapter.xhtml_fn1_33)
    The *Queen Victoria* and the *Oxford,* East Indiamen, were totally lost ; and
    Mr. Higgin, of Liverpool, who was a passenger by the former of these ships, during
    his enforced stay on the island for six weeks, was enabled to make some observations
    on the natural history of the island, which assisted Mr. Strickland, the President
    of the Ashmolean Society, and Dr. Melville, his coadjutor, in their magnificent
    monograph on the Dodo and its kindred, towards their investigation of the structure
    and habits of the Solitaire, which was named *Pezophaps solitarius ;* a smaller
    species, *Pezophaps minor,* was determined in 1852\. In 1859 the *Nassur Sultan,*
    another East Indian liner, was lost ; and it may be noted as a fact that in each
    case of wreck the vessel is reported to have struck at fifteen miles S.W., although,
    from subsequent examination, it has been found that no reefs extend more than
    five or six miles from land.It was not until 1864 that Mr. E. Newton, then Auditor-General
    in Mauritius, visited Rodriguez, and obtained some more bones ; and in the two
    following years a large quantity of bones was obtained by Mr. Jenner, for Mr.
    Edward Newton, and forwarded to Cambridge, where Professor Alfred Newton, his
    brother, and himself succeeded in making an admirable, though not altogether perfect,
    restoration of the skeleton of the long lost Solitaire, the photograph of which
    appears in the frontispiece. The extraordinary fidelity of Leguat’s account of
    the bird was confirmed in almost every point. The very singular knob on the wing,
    caused by injuries received in fighting, fully bore out the accuracy of Leguat
    as to the pugnacity of these most curious birds, which seem to have fought by
    buffeting with their pinions like pigeons.When, in the year 1874, the British
    Government dispatched an expedition to observe the Transit of Venus at Rodriguez,
    by the request of the Royal Society some naturalists were sent to accompany the
    astronomers. Dr. Balfour as botanist and geologist, Mr. Gulliver, zoologist, and
    Mr. Slater, especially deputed to examine the remains of extinct animals in the
    caves.[¹](#B11_fm-chapter.xhtml_fn1_34) The results of these investigations were
    published in the *Philosophical Transactions* of the Royal Society. Professor
    Balfour succeeded in identifying the most characteristic of the plants described
    by Leguat, and his notes form the most interesting commentary possible on Leguat’s
    faithful delineation of the productions of his island home.One more ocean voyage
    of recent date in an open boat deserves recording ; and it is to be hoped that
    it is the last of its kind, for surely the Government will insist on better provision
    being ensured for this most unfortunate poverty-stricken little colony.At present
    the whole budget of the island barely exceeds some five hundred pounds *per annum,*
    from which the impecuniosity of the dependent islet can be judged.On the 15th
    of April 1886, a very severe cyclone struck the island, which lies in the very
    track of the so-called Mauritius hurricanes, during which a colonial schooner
    was lost, adding the cost of maintenance of the shipwrecked captain and crew to
    the debt of the inhabitants. This cyclone, which occasioned the severest hurricane
    hitherto experienced by those longest in the colony, besides causing great damage
    to crops and property, was followed by an almost continual drought. The state
    of affairs began to assume a very alarming aspect towards the month of August,
    when it became evident that the crops would fail. Nor was it a vain surmise. The
    beans harvest was not one-third of what it had been on previous years ; whilst,
    as regards the sweet potatoes, manioc, and maize, which, with rice, form the staple
    food of the creoles and Indians, hardly any could be raised. The stock of imported
    rice in the island being nearly exhausted at the beginning of September, and the
    ship expected with supplies being late, a meeting of the principal inhabitants
    was called together at the Town Hall, at which it was resolved that a boat should
    be sent to Mauritius, distant 330 miles, to ask for immediate relief. The Government
    pinnace *Victoria,* being then unfit for sea, another private boat, belonging
    to the Civil Commissioner, was fitted up. The Government pilot, Mr. Vandorous,
    consented to take charge of the expedition, assisted by Sergeant Aston, and two
    creoles, Genève and Prudence, all volunteers. The boat left on the 11th of September,
    and reached Mauritius after a three days’ passage, during which they experienced
    some heavy seas and weather, which made the journey one of some little danger
    for an open boat. The Government of Mauritius, which was, surely, remiss in not
    having foreseen and anticipated the scarcity, despatched a tug with 350 bags of
    rice only for a population of J,700 souls. This supply was soon exhausted, and
    it was not until the 21st December that a cargo of 1,000 bags of rice reached
    poor Rodriguez, to be *sold* (at what price, we may ask ?) to the very patient
    and helpless islanders. “ For this act of grace,” naively adds the magistrate,
    “ the Governor cannot be too much thanked.” This adventure of an open boat proceeding
    300 miles across the Indian Ocean, in the track of François Leguat’s desperate
    voyage two hundred years before, led in fact to the present republication of his
    *Relation,* which may well be read again with profit by those who care for true
    tales of days gone by.We can hardly conclude better than by quoting the testimony
    of a learned man of science who has carefully investigated Leguat’s narrative,
    and compared his written description with the materials available after the lapse
    of two centuries.“ From Leguat’s work we find,” writes Professor Schlegel, “ that
    he was a man of true refinement and much reading, that he possessed to a high
    degree the earnestness and piety which characterised the fervent Protestants of
    the time, and that, by his scientific disposition and imperturbable faith, as
    well as by his oppression and persecution of several kinds, together with Iiis
    ripe age, he had obtained that unchangeable calmness of mind with which he felt
    so happy at Rodriguez that, had he not been compelled, he would have never left
    that resting-place.”“ As to his love of truth, we find the contents of his work
    corroborated by what he says in his preface : ‘ La simple Vérité toute nue et
    la Singularité de nos Avantures sont le corps et l’âme de ma Relation.’ ”The simple
    and pure faith in the Bible inculcated by the Huguenot religion is conspicuous
    in Leguat’s pathetic story.We find the word *“Providence”* on the Irst arid last
    pages of his hook, arid it was this reliance on divine support which upheld his
    equanimity during long years of trying exile. It will be consolatory to remember
    that he survived these hardships, so nobly borne, when he was considerably beyond
    the prime of life, for a period of over another quarter of a century—in a foreign
    country, certainly, but at all events, during his old age, in security, comfort,
    and peace.^([1](#B11_fm-chapter.xhtml_Rfn1_1)) The arms of le guat fougère are
    given in the *Indice Armorial,* as : “ d’azur à une fasce d’or, à un Lyon passant
