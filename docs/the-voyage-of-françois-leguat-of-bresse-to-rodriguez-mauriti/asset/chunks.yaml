    | 1692. | 毛里留斯总督罗洛夫·迪奥蒂（Roelof Diodati）。 |

    | 1692. | 冒险者受雇造船。 |

    | 1693 年 4 月 19 日. | 首次尝试离开岛屿。船撞在岩石上。 |

    | 5 月 8 日. | 伊萨克·博耶（Isaac Boyer）死亡。 |

    | 1693 年 5 月 21 日. | 冒险者再次登船。 |

    | 5 月 28 日. | 遭遇风暴。 |

    | 5 月 29 日. | 抵达毛里留斯。 |

    | 6 月。 | 遭遇风暴。 |

    | 6 月。 | 抵达黑河。 |

