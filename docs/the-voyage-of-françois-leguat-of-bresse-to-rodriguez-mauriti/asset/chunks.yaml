    \ were set to work to forward the Execution of it; and ’twas done with so much\
    \ Warmth and Expedition, that the Ship was soon ready to put to Sea. Care was\
    \ taken to provide every Thing necessary for such an Enterprise; and the Vessel\
    \ was so little, and so good a Sailer, that she was nam’d the `Swallow`. \n\n\
    Her Flag had Mons, `du Quesne’s` Arms in it, with this Device, “Libertas sine\
    \ Licentia”; which was us’d by that wise Pope Adrian VI.\n\nOur little Frigate\
    \ was mounted with six Guns, and had ten Seamen, commanded by `Anthony Valleau`,\
    \ of the Isle of `Rhe`. When ’twas ready to sail, several of the Passengers, whose\
    \ Names had been enroil’d for this Service, shrunk back and chang’d their Opinion;\
    \ which was the occasion of the small Number that embark’d; for the first Complement\
    \ that design’d to go in her were five and twenty.\n\n```javascript\nif (condVar\
