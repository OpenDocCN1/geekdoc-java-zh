    ### Hakluyt 学会。


    1890 年报告。自我们上一次由 `Albert Gray 先生` 编辑的 `PYRARD’s VOYAGE` 报告以来，已随着 `Vol. II` 第二部分的发行而完成；本书书附带了说明马尔代夫早期地理和历史的宝贵附录，以及该岛屿语言的部分词典和索引。


    拉普拉塔河的作品，包括 `VOYAGE OF ULRICH SCHMIDT` 和 `COMMENTARIES OF CABEZA DE VACA` 也已向成员发行`VOYAGE
    OF FRANÇOIS LEGUAT` 现在已就绪。


    关于未来的安排，由 `Edward Grey 先生` 编辑的 `LETTERS FROM INDIA OF PIETRO DELLA VALLE` 已在印刷中。`Brown
    博士` 承诺很快将提供 `LEO AFRICANUS`；`Miller Christy 先生` 宣布 `FOXE AND JAMES` 几乎准备就绪；`Cecil
    Dampier 中尉` 正在致力于 `VOYAGES OF CAPTAIN DAMPIER`；`Thurn 先生` 从英属圭亚纳来信，他正在收集这些材料——这些是
    `DALLAM` 的日记，他在本世纪初访问过君士坦丁堡。`Covel 博士`的日记篇幅宏大，将进行缩减以涵盖在一卷书中。同时，`Bent 先生` 的马绍纳兰探险将阻止他继续编辑。


    与莱利有关，委员会还决定出版 `VOYAGES OF KEYMIS AND BERRIE`；`Keymis` 是莱利的密友，正是最后一次圭亚纳航行的失败导致了后者的自杀。


    由于 `Richard 爵` 今年十月担任特里斯特英国领事期间去世，以及 `John Henry Lefroy 爵` 的去世，我们的名单中又减少了两名活跃成员。`Burton`
    为我们编辑了 `HANS STADE’S CAPTIVITY IN BRAZIL`，而 `Lefroy` 则是 `HISTORY OF THE BERMUDAS`。


    学会会计显示 1990 年 12 月 31 日的余额为 `£216 9s. 1d.`，这是在支付巨额印刷等费用后的。由于这包含了 1891 年 `LEGUAT’S
    VOYAGE` 的一半以上费用，希望明年的账目会少得多。


    订阅名单继续维持得良好，但还需要更多成员来完成已承担和建议的作品。


    由于 `JOHN BARROW 先生`、`F. W. RICHARDS 中将`和 `CHARLES WILSON 爵士` 的退休，以及 `Mark 先生`
    当选为主席而产生的委员会空缺，已由 `S. E. BOUVERE PUSEY`、`E. H. H. GUILLEMA`、`J. SYDNEY WEBB 爵士`和
    `W. J. L. WHARTON 上尉` 填补。


