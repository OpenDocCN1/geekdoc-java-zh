    Jean Baptista, Baron d’Aubonne. Les six Voyages. 1678.URFE, Honoré d’.—Astrée.VACCA.—MSS.
    *Vide* Montfaucon.VARTOMANNUS PATRICIUS.—Navigatio: Novus Orbis. *See* Hervagius.VIRGILIUS,
    Publius Maro.—Æneis. B.C. 21.WILLUGHBY, Franciscus.—Ornithologiae Libri. 1676.N.B.—*Only
    works alluded to in original edition of Leguafs Voyage are included in above Bibliography.*¹
