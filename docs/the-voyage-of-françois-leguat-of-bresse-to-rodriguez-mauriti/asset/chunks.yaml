    `Rodrigue` 岛上发现了哪些四足动物；特别是陆龟及其营养价值。海洋提供的食物，即海龟；`Lamentin`（或海牛）以及如何捕获它。异常巨大的鳗。牡蛎。愉快的捕鱼，以及是哪些鱼（70-77）


    # 第六章

    生活在 `Rodrigue` 岛上的鸟类，尤其是 `Solitaire`（或孤独鸟），以及关于它的几个趣闻。大大鹤、鸽子、鹱鸟、禽类、草尾鸟、雉鸡和其他几种。鹦鹉。体型巨大的蝙蝠。在那里发现盐、黄琥珀和鲸脂（77-87）


    # 第七章

    作者开始描述 `Rodrigue` 岛的四个缺点。第一，大和小苍蝇。第二，老鼠和陆蟹。第三，每年的飓风；第四，幼虫。此外，他提到了 `Requin`（海鲨）和
    `Remora`（海鱥）（87-98）


    # 第八章

    这个新世界居民的活动，智力或其他。为什么他们没有选择道师并建立教堂。在途中，他描述了 `Pavilion` 树。他们在那里玩什么样的游戏。他们开始绝望并制造一艘船，以便在两年后前往
    `Mauritius` 岛，以防 `Marquis du Quesne` 没来接他们。他们是如何建造这艘船的（98-108）


    # 第九章

    `Rodrigue` 的居民将他们的船下水。他们对其进行补给，用了什么。他们用什么代替指南针。确定了航行日期。他们出发了。搁浅。他们是如何自救的。艾萨克·博耶去世。为他的纪念碑。我们的作者拒绝第二次出发。他的反对被驳回了，以及是如何驳回的。离开该岛并对其施以祝福。第一部分结束。（108-137）


    # 第二部分


    # 第十章

    他们第二次出发。在第八天遭遇了风暴。抵达 `Mauritius`。前往总督官邸。在那里发现了他们的船用理发师和同伴 `Jan André Guiguer`，后者曾被夺走。船长的恶作剧。`Jan
    de la Haye` 卖了他的银匠工具，连同工具还有在不知情的情况下的一块 `Ambergris`。他们为此陷入了麻烦。总督烧掉了他们的小船，将他们关入监狱，没收了他们的货物，最后将他们送到海中的一块岩石上（139-160）


    # 第十一章

    作者和同伴在岩石上。他描述了他们的经历。他病了并请求返回岸，但被拒绝了。他请求一些新鲜肉类，也被拒绝了。`La Case` 和 `Testard` 开始患上同样的疾病。在港口看到一艘荷兰船。`Bele`
    和 `La Haye` 去往毛留斯向船员提出投诉。他们带着可怕的威胁被送回。上述官员造访了在岩石上的他们，但不敢带他们离开。`Governor` 结婚了，有时允许我们的作者来到毛留斯，但并未给他会面。最后他被送回岩石（160-172）


    # 第十二章

    为了提振堕落的精神，我们的流亡者开始制作帽子。他们通过此赢得了人的喜爱。`Mauritius` 的居民有时在总督不知的情况下向岩石送一些新鲜食物。他们发现了一种奇特的捕鱼方法及其地点。他们捕到了一条超过六十磅的海蛇并因此危及生命。描述名为
    `Ferret` 和 `Pluto` 的鸟。我们的流亡者决定第二次改装一艘船。他们的材料是什么，又是如何获得的。他们完成了它并发现良好。作者及其同伴在看到
    `Mauritius` 上的火光时罕有的远见。两艘英国船从毛留斯的西北部来。其中一位船长想带走我们的囚犯，因为他缺少人手，但天气干预了（172-183）


    # 第十三章

    作者讲述了 `Mr. Testa` 计划的后续后果，以及第一次是如何失败的。他在半夜不发一言的情况下开始第二次出发，以及原因。这次尝试结果如何。`La Case`
    追踪他的踪迹，安全到达，进入丛林：被捕并带到总督面前。总督从岩石召集了其他人。一艘荷兰船来到毛留斯，奉命将我们的作者及其同伴带往 `Batavia`。他们向船员委员会提交了一份请求¹
    以及原因。Diodati 在他们离开之前让他们经历了些什么（183-194）


    # 第十四章

    `Mauritius` 岛的描述。它的经纬度。为何如此命名。堡垒。那里发现了哪些树。关于 `Ananas`（菠萝）和香蕉。`Slronoom` 及其毒性。我们的作者曾因此遭受过怎样的痛苦。显著的森林。猴子的邪恶性。他们从哪里为堡垒获取每日食物，食物由什么组成。关于猴子（*注：原文为
    Apes，通常指猿类，但在某些历史语境下可能指特定动物或误用，视语境而定，此处译为猴子*）此处，`La Case` 和 `Testard` 开始患上同样的疾病。在港口看到一艘荷兰船。`Bele`
    和 `La Haye` 去往毛留斯向船员提出投诉。他们带着可怕的威胁被送回。上述官员造访了在岩石上的他们，但不敢带他们离开。`Governor` 结婚了，有时允许我们的作者来到毛留斯，但并未给他会面。最后他被送回岩石（160-172）


    （注：由于提供的原始文本中存在大量重复，译文已根据逻辑结构进行对齐处理，确保不重复输出原文。）

