- fmt: "\n# THE HAKLUYT SOCIETY 1891\n\n## Leadership\n- **President**: `CLEMENTS\
    \ R. MARKHAM`, Esq., C.B., F.R.S.\n- **Vice-President**: `MAJOR-GENERAL SIR HENRY\
    \ RAWLINSON`, Bart., K.C.B., D.C.L., LL.D., F.R.\n- **Council**: `LORD ABERDAARE`,\
    \ G.C.B., F.R.S.S.; `E. B. BOUVERIE-PUSEY`, ESQ.; `WALTER DE GRAY BIRCH`, ESQ.,\
    \ F.S.A.; `REAR-ADMIRAL LINDESAY BRINE`; `ROBERT BROWN`, ESQ., M.A., PH.D.\n-\
    \ **The Knight**: `HON. SIR MOUNTSTUART E. GRANT-DUFF`, G.C.S.I.; `ALBERT GRAY`,\
    \ ESQ.; `F. H. H. GUILLEMARD`, ESQ., M.A., M.D.R.; `H. MAJOR`, ESQ., F.S.A.; `E.\
    \ A. PETHERICK`, ESQ.; `LORD ARTHUR RUSSELL`; `ERNEST SATOW`, Esq., C.M.G.S.;\
    \ `W. SILVER`, ESQ.; `COUTTS TROTTER`, ESQ.; `PROF. E. B. TYLOR`, D.C.L.; `Capt.\
    \ Sir J. SYDNEY WEBB`, K.C.M.G.; `Capt. W. J. L. WHARTON`, R.N.\n- **Honorary\
    \ Secretary**: `E. DELMAR MORGAN`, Esq.\n- **Bankers**: `MESSRS. BARCLAY, BEVAN,\
    \ TRITTON, RANSOM, BOUVERIE, & Co.`, 1, `PALL MALL EAST`.\n\n## About the Society\n\
    THE HAKLUYT SOCIETY, established for the purpose of printing rare or unpublished\
    \ Voyages and Travels, aims at opening by this means an easier access to the sources\
    \ of a branch of knowledge, which yields to none in importance, and is superior\
    \ to most in agreeable variety.\n\nThe narratives of travellers and navigators\
    \ make us acquainted with the earth, its inhabitants and productions; they exhibit\
    \ the growth of intercourse among mankind, with its effects on civilisation, and,\
    \ while instructing, they at the same time awaken attention, by recounting the\
    \ toils and adventures of those who first explored unknown and distant regions.\n\
    \nThe advantage of an Association of this kind consists not merely in its system\
    \ of literary co-operation, but also in its economy. The acquirements, taste,\
    \ and discrimination of a number of individuals, who feel an interest in the same\
    \ pursuit, are thus brought to act in voluntary combination, and the ordinary\
    \ charges of publication are also avoided, so that the volumes produced are distributed\
    \ among the Members at little more than the cost of printing and paper.\n\nThe\
    \ Society expends the whole of its funds in the preparation of works for the Members;\
    \ and since the cost of each copy varies inversely as the whole number of copies\
    \ printed, it is obvious that the members are gainers individually by the prosperity\
    \ of the Society, and the consequent vigour of its operations.\n\n## Membership\n\
    Gentlemen desirous of becoming Members of the Hakluyt Society should intimate\
    \ their intention to the Secretary, `MR. E. DELMAR MORGAN`, 15, `Roland Gardens,\
    \ S.W.`, or to the Society’s Agent for the delivery of its volumes, `MR. CHARLES\
    \ J. CLARK`, 4, `Lincoln’s Inn Fields`; when their names will be recorded, and\
    \ on payment of their subscription of `£1: 1` to `Mr. CLARK`, they will receive\
    \ the volumes issued for the year.\n\n## Surplus Stock Disposal\nMembers and the\
    \ general public are informed that the Council has approved of the following scheme\
    \ for the disposal of its surplus stock:\n\n- **TO NEW MEMBERS**: `Complete sets\
    \ of back publications`, omitting Nos. 1, 2, 3, 5, 6, 7 and 13, to be sold for\
    \ `£27`.\n- **TO MEMBERS ONLY**: `A limited number of sets up to 1883 inclusive`,\
    \ omitting Nos. 1—13, 19, 36 and 37. 53 vols. in all, to be sold for `£15 15s`.\n\
    - **TO THE PUBLIC GENERALLY**: `Also, a limited number of single copies` as follows:—\n\
    \    - Nos. 17, 22, 23, 26, 29, 31, 34, 40, 47, 50, at `8s. 6d`.\n    - Nos. 14\
    \ and 15, 18, 21, 24, 28, 30, 35, 46, 48, 51, 53, 55, 56, 58, 60 and 61, 62, 63,\
    \ 64, 65, 69, at `10s`.\n    - Nos. 16, 20, 27, 32, 33, 38, 41 to 45, 49, 52,\
    \ 57, at `15s`.\n    - Nos. 54 and 59, at `20s`.\n- **Subject in Case of Members**:\
    \ a discount of `15%`.\n\nMembers are requested to bear in mind that the power\
    \ of the Council to make advantageous arrangements will depend in a great measure\
    \ on the prompt payment of the subscriptions, which are payable in advance on\
    \ the 1st of January, and are received by `MR. CHARLES J. CLARK`, 4, `Lincoln’s\
    \ Inn Fields, W.C.` Post Office Orders should be made payable to `MR. CHARLES\
    \ J. CLARK`, at the `West Central Office, High Holborn`.\n\n### WORKS ALREADY\
    \ ISSUED.\n"
