    This animal was evidently the *Ilalicore dugong*, now extinct in the JMascarene
    waters, an innocuous herbivore, without fear of man, easily captured, and therefore
    soon extirpated by the sailors in want of fresh meat.(See supplementary note.)“
    Where is the *Rhythm* of Behrings’ Island? Absolutely abolished from the face
    of the earth ! Where are the *Manatees* that played in the waters of the Antilles
