  trans: '

    简而言之，我的理由是这样的：在被迫离开我的祖国，与成千上万的同胞一起放弃了我的微小家产，并从外表看似乎永远放弃了那些对我而言重要的人，而在我最初运往的新国家，并没有找到我目前迫切需要的那种足够的救济后，我将自己完全托付给了上苍，并谦卑而耐心地决定利用为我提供的手段，或许是为了保住我的生命。


    厌倦了世俗的喧嚣，因在其中遭受的苦难而精疲力竭，毫无遗憾地离开了纷华与动荡。在一个已经过了巅峰时期的年纪里，我想我应该努力生活在一个可以远离我曾所暴露的常见且频繁危险的地方。我无可失去，因此也无须冒险，尽管我怀有巨大的希望，至少希望能够找到我从未体验过的那种美味的安宁；除了我在荒岛岛留下的那两年，我在那里无疑完成了我的旅程，如果不是那个带我们去往那里的恶人背叛了我们，并毁了在荷兰制定的计划。


    归根结底，那里的空气令人赞叹，我的健康未受丝毫改变。我生活得像一个闲散的王子，虽然没有面包，也没有仆人，却非常富足。我在那里是有没有钻石的富有，既没有黄金，也没有野心。我品尝到了一种秘密而精妙的快乐，并满足于免受在其他地方人们容易陷入的无限罪恶诱惑。


    我静下心来，通过严肃的反思，在那里看清了某些事，清晰如触手可及或可见：这个可怜的“世界”的居民所崇拜的究竟是些`无物`；我说的这个世界，`艺术` 几乎总是以装饰之名摧毁自然；在那里，`技艺`
    比艺术更糟糕，虚伪、欺诈、迷信和掠夺对人类行使着暴政般的统治；简而言之，这里的一切都是错误、虚荣、混乱、腐败、恶意和痛苦。


    我不禁在此顺便补充说明的是，无论在这座岛上留得更久会带来什么不便，如果没有被逼，我绝不会离开它：仅仅由于那股暴躁的情绪、狂野的鲁莽，以及七个不计后果的年轻人的轻率尝试，才可能迫使离开了那片甜蜜的居所。


    我在说什么呢——不，不是人而是上苍引导我到达那里的，并带我从那里离开。是上苍引导我安全地穿过许多危险，并幸运地将我从我的荒岛运到了这片广阔、强大且光明的岛屿——`Great
    Britain`，那里慷慨居民的仁慈向我伸出了手，并在在这个下俗世界中尽可能为我安定了身之所。


    根据 `M. Eyries` 的说法，`Leguat` 叙述的实际编辑和作者是一位前本笃苦克会修士，名叫 `Gabillon`。*参见*注释第 lxxxviii
    页及引言。1685-86 年暹旅行之旅 (`Journal du Voyage de Siam fait en`) (`M. l’Abbé Choisy`)，`M.
    L. D. C.` 四开，巴黎，1687。`Leguat` 在此处写得很讽刺，但他的讽刺并非毫无理据；例如，“这里提到的 Robin 是一只羊——‘一只在羊群中著名的羊’（un
    mouton fameux entre les moutons）——超过一多页的内容都在讲述他是如何被烹煮、吃掉并在餐桌上讨论的。


    这位罗马修辞之王是 `Cicero`，他写道：“凯撒也写了一些关于自己事迹的评述或短记，其中有些值得最高赞誉的；因为它们简单、正确且优雅，剥离了语言所有的修饰，以至于显得（如果允许我这样表达的话）处于一种‘赤裸’的状态。”(`Cicero`,
    *in Bruto,* 约公元 74 年）。” “巴黎的一处售卖旧衣服和其他衣服的地方。”原文中为：“lustres，”*即* 玻璃或抛光剂。


    `Rabbi Benjamin`，`Tudela 的 Jonas` 之子。游历欧洲、亚洲，从西班牙到中国，1160-73 年。出自 `Montanus` 的拉丁语；*见*
    `Purchas’ *Pilgrimes,*` 第二卷。`Dom. Bernard de Montfaucon`，一位卓越的`学者`和希腊学者，在 `Turenne`
    亲自参加了两次战役后，于 1675 年成为图卢兹`Saint-Benoît` 的修士。他在 1741 年去世，享 87 岁。根据 Bernard 的说法，这位作者是
    `Casimir Fresch`，`Remarques et Critiques` 的匿名作者。


    `Jean Mabillon`，一位博学的本笃苦克会修士，1632 年出生，比 `Leguat` 晚几年。`Mabillon` 曾与 `Michel Germain`
    一起在 1685 年探访访问了意大利的主要图书馆，并带回了 3000 卷书籍。他发表了一本关于旅行的记录，并出版了许多深度研究著作 `Musæum Italicum`。他在
    1707 年去世，享 75 岁。根据 Bernard 的说法，这位作者是 `Fresot`，`Bernard de Montaucon`（一位本笃苦克会修士）在意大利的旅行记录中发表了一本名为
    `Diarium, etc.` 的书，但关于那些珍存在于圣马利亚大教堂的著名手稿，其内容似乎指向 `Mabillon`。


    “我打算让读者了解一些关于 `Flaminius Vacca`（一位罗马雕刻家）的段落，他的技艺在许多罗马古迹中是可见的。由于 `Flaminius` 的观察结果没有先后顺序，而是随遇记录并混合在一起，我认为有必要翻译他的论文`Flaminius`
    是一位高贵的罗马雕刻家，他的作品在许多罗马教堂和家中随处可见他活跃于 16 世纪，似乎活到了 17 世纪。他的墓位于 Santa Maria Rotunda
    教堂。”


    “我打算让读者了解关于 `Bernard de Mont-faucon`（一位本笃苦克会修士）在意大利的旅行记录中发表了一本名为 `Diarium, etc.`
    的书，但由于他展示了一篇论文，并以一种炫耀的方式向 `Turba Eruditor`（他自称要告知这些人）介绍了那些存在圣马可宝库的著名手稿。”……正如我曾费心地寻找那些尚未公开的事物一样，他出版了一本名为
    `Palxographia Grœca, etc.` 的。在不撤回我刚才对 `Journal de Trévoux` 的评价的情况下，组成该期刊的尊敬父们允许我进行一些反思……本期刊现在（1714
    年）由巴黎的一些耶稣会出版，名为 `Histoire des Sciences & des beaux Arts`（Maximilien Misson，《意大利新游》第四版序言）。


    Mabillon 的 `Querelle d’Allemande`——他与 Germain 父亲关于应用于手稿字体真实性的批判规则的争论，或许在此被提及。“于是我们去查看位于旁边的柜子里的圣马可福音手稿，我们在图书馆管理员
    `D. Leith` 或 `Galtcrius` 的陪同下审视了它。……那些字体几乎无法辨认，但无疑是拉丁文。它通常被认为是圣马他的笔迹。我不记得曾见过任何比这看起来更古老的手稿。但这本书是用拉丁文写的，这一点从我将要讲述的故事可以清楚地看出……查理四世皇帝的信将告知你，他从阿奎莱的主教区收到了两卷圣马可福音手稿，是亲手写的，就在这所大教堂里。”……（Montfaucon《意大利游行记》，第
    73-75 页）“至于他们引用的希腊和拉丁诗人的诗，有几人提议大量引入他们的著作中，但在这些信件中发现的很少。”（M. Misson, b. c.）“由于我的英语还远未精通。
    . . .”

    '
