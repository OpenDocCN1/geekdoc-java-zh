    ### The Hakluyt Society.


    REPORT FOR 1890.SINCE our last Report PYRARD’s VOYAGE, edited by Mr. Albert Gray,
    has been completed by the issue of the second part of Vol. II.; valuable appendices
    illustrating the early geography and history of the Maldives, together with a
    dictionary of some words of the language spoken in those islands, and an index,
    accompany this volume.The work on the River Plate, comprising the VOYAGE OF ULRICH
    SCHMIDT, and the COMMENTARIES OF CABEZA DE VACA, has also been issued to members.
    The VOYAGE OF FRANÇOIS LEGUAT is now ready.With regard to future arrangements,
    the LETTERS FROM INDIA OF PIETRO DELLA VALLE, edited by Mr. Edward Grey are in
    the printer’s hands. Dr. Robert Brown promises us shortly his edition of LEO AFRICANUS;
    Mr. Miller Christy’s VOYAGES OF FOXE AND JAMES are nearly ready; Lieut. Cecil
    Dampier, R.N., is engaged upon the VOYAGES OF CAPTAIN WILLIAM DAMPIER; Mr. im
    Thurn writes from British Guiana that he is collecting material for a second edition
    of SCHOMBURGHK’S RALEIGH’S EMPIRE OF GUIANA.Besides these and other Works undertaken
    for our Society the Council has much pleasure in announcing that Mr. Theodore
    Bent has in hand two 17th century MSS. illustrating the early intercourse of the
    English with the Levant. These are the journals of MASTER DALLAM, who visited
    Constantinople in the early part of that century for purposes connected with his
    trade of an organ builder, and Dr. COVEL for six years chaplain to the Levant
    Company. Dr. Covel’s journals, which are very voluminous, will have to be considerably
    abridged so as to bring the whole Work into the compass of one volume. Meanwhile,
    Mr, Bent’s expedition to the ruined cities of Mashonaland will prevent him going
    on with the editing just at present.In connection with Raleigh, the Council has
    also decided on publishing the VOYAGES OF KEYMIS AND BERRIE; Keymis was an intimate
    friend of Raleigh, and it was the failure of the last voyage to Guiana and his
    master’s troubles that led the former to commit suicide.The VOYAGES OF SIR HUGH
    WILLOUGHBY AND KICHARD CHANCELLOR TO RUSSIA, from Hakluyt’s Collection, will,
    a little later, form a suitable volume for our series, and the Hon. Secretary
    proposes to edit these.By the deaths of Sir Richard Burton in October this year,
    while holding the post of H. M. Consul at Trieste, and of Sir John Henry Lefroy,
    two more active members are removed from our list. Burton edited for us “HANS
    STADE’S CAPTIVITY IN BRAZIL,” and Lefroy—the “HISTORYE OF THE BERMUDAES OR SUMMER
    ISLANDS.”The accounts of the Society show a balance on the 31st December, 1890,
    of £216 9*s*. 1*d*., after paying a heavy bill for printing, etc. As this includes
    more than half the cost of LEGUAT’S VOYAGE for issue in 1891, it is hoped that
    next year’s account will be much less.The list of Subseriberg continues to be
