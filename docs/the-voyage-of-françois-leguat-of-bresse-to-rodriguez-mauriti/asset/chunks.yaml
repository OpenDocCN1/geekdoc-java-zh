    In orig.: “De l’abondance du cœur la bouche parla,” which is omitted by translator.^([4](#C01_chapter_split_000_split_001.xhtml_Rfn8_235))
    “Il ne me fat pas difficile de voir où gissit le heure (si je puis ajouter proverbe
    à proverbe).”^([5](#C01_chapter_split_000_split_001.xhtml_Rfn8_236)) La Belle
    Chimène, or Ximena, daughter of Count Lozano de Gormaz, who married the Cid, Rodrigue
    Diaz de Bivar. (*Le Cid*, written by *Le grand Curneile* in 1C36.)^([1](#C01_chapter_split_000_split_001.xhtml_Rfn8_237))
    I Corinthians, vii, 28, 29.^([2](#C01_chapter_split_000_split_001.xhtml_Rfn8_238))
    Proverbs, xix, 13.^([3](#C01_chapter_split_000_split_001.xhtml_Rfn8_239)) Cf.
