    # 弗朗斯·勒格亚及其同伴前往东印度群岛的新航。


    在两座荒废岛上的冒险，以及关于 `Maurice` 岛、`好望角` `Cape of Hope` 的 `Batavia`、`圣海伦娜` 岛以及往返荒废岛途中其他地的显著事迹记录。附有地图与插图。于伦敦为
    `R. Bonwicke, W. Freeman, Tim. Goodwin, F. Walthoe, M. Wotton, S. Manship, F.
    Nicholson, B. Tooke, R. Parker, and R. Smith` 出版。MDCCVIII 年。


    ### 献给最尊贵的亨利，肯特侯爵。


    哈罗尔德伯爵、戈德里奇子爵、女王陛下宫廷内侍官、赫里福德郡总督，以及女王陛下最受尊敬的枢密会议成员之一。阁下，这趟旅程的译者向阁下提出的唯一歉辞，便是冒昧将您的名字置于其前，是因为他在原文中如此如此，并希望阁下凭借您的仁慈和对文学的热爱，能像乐意看到英文版一样乐意看到法文版。诚然，原文的优势在于被更多国家所知，而传播阁下的名声是我们的敌人的语言所欠下的公正，因为您的许多高尚品质使您处于大英帝国首要位置之一，也是最接近女王神圣人格与恩宠的人之一。如果有任何外国人对阁下表现出比一个英国人更多的尊重，我宁愿放弃自己的身份；如果一个在荒凉孤寂岛屿的旅行者对阁下保护的渴望，超过了一个多次荣幸地出入帕尔纳索斯美味平原的人——而那片土地正由阁下辖领，且自您俯尊将其纳入您的范围内以来，那里已日益繁荣，而那里本可以更高贵地服务于最伟大的君主和最卓越的国家。阁下，请听我说：尽管我们存在着不幸的分裂，阁下所有的温和建议都对此强烈表示了反对，并努力让我们在对女王的职责以及我们内部的和平上达成团结；但分分裂对人类来说是如此自然，谁能希望在他生中看到它的终结呢？我们发现罗德里戈岛的孤独居民也有他们的辩论和纷争；7
    个因共同利益和共同危险而团结的人，也被他们的激情所分裂。愿阁下的卓越价值始终获得与其相称的繁荣，永不被嫉妒所侵害，不被这个堕落时代常见的嫉恨所触及，以免损害最英雄的美德。我的阁下，这将永远是阁下最谦卑、最顺从、最忠诚仆人的赤诚祈祷。


    亨利·格雷（或德雷），肯特公爵于 1702 年继位，在安妮女王统治的第三年被任命为宫廷内侍官、赫里福德郡总督及枢密会议顾问。1706 年 12 月，他被封肯特侯爵、哈罗尔德伯爵和戈德里奇子爵；1710
    年，在辞去内侍官一职后，晋升为肯特公爵。（《英国贵族谱》`，1710 年，第 155 页。）


    尼科尔斯在其《文学轶事`（iv, 577）中提到，约翰·劳伦斯牧师曾将其关于“气压计的用处”的论文献给他；同一作者在提到剑桥天文学与实验哲学教授罗杰·科特斯时也提到了他，科特斯是安东尼（哈罗尔德伯爵）和亨利·德·格雷男子的导师。（`同上`，ii,
    127。）E. 德尔马·摩根注：这显然是在暗示肯特侯爵在近期英格兰与苏格兰议会合并中所起的作用，以及他所所属的“安妮女王辉党内阁”所遭遇的托党反对。苏格兰议会于
    1707 年 3 月举行了最后一次会议，合并是在这一献献词印刷的五个月前达成的。


    马克西米利安·米松在他《意大利新游记》的序言中（该书由他本人翻译成英文），几年后也提到了辉党与托铎党的对立派系：“如果和平在我们与伟大邻国经历过血腥冲突后给我们的岛屿带来了任何宁静，它也让我们陷入了这样的分歧和内在仇恨之中，剥夺了我们完整的幸福；这些可悲的误解似乎如此点燃人心，以至于最温和的人也难以抑制自己投向这种悲剧不和的旗帜之下。如果一个人不自力而为且带有足够热情地加入这些派系名称之一（我的笔拒绝写下，即‘W（辉党）或或
    T（托党）’），他甚至会被大众认为是不合时宜的。”可以注意到米松在这里将自己称为一名英国臣民，暗示了“我们”。他在一个注释中解释了辉党和托党这两个词的起源。匿名译者的签名被略去了。在法文版中，献词信带有弗朗索斯·勒格亚的签名，日期为——“1707
    年 10 月 7 日，于伦敦”。无疑，这与英文译者的上述表述大不相同，后者明确承认自己英国人。在法文版中，作者请求阁下愿在这个世界上最繁荣的岛屿上给予慷慨且强大的保护，这里是上帝天意幸运地引导他来到这里的，他补充道，他将永不停为阁下的丰足与永恒的繁荣祈愿，等等。这认为没有必要全文给出这封信。侯爵的纹章、冠饰、支持者、格言和纹章标志在法文版中有图，但在英文版中没有。


    ### 作者序。


