    在利希留枢枢主教和他的君主路易十三世去世前五、六年——即大约 1637-1638 年间——`François Leguat`似乎出生在布雷斯，这是一个小省份（现今由位于萨瓦亚边界的阿涅省代表），位于罗纳河与索恩河的汇流处之间。我们作者的祖先`Pierre
    le Guat`在萨缪埃尔·盖谢农（Samuel Guichenon）所著的《布雷斯与比盖耶史》中被提到为富热热尔领主。关于他的早年生活人们知之甚少；但根据他自己的叙述，在他五十多岁时，由于《南特堡赦免令》被废除（1685
    年），他被迫流亡，并与许多人一起于 1689 年逃往荷兰。当时，同名著名海军指挥官之子亨利·杜·克斯侯爵（Marquis Henri du Quesne）正在荷兰三议会和荷兰东印度公司董事会的支持下，计划在马斯卡雷涅群岛（现名为`Tie
    de la Réunion`）建立一个法国新教徒难民殖民地。侯爵此前对这座岛屿发表过赞誉溢口的描述（他提议将其命名为`伊甸`），它是上世纪葡萄牙人发现的群岛中最大的一个，但当时尚未被充分探索，在旧地图和海图上模糊地标记为`Las
    Mascarenhas`；因此，许多难民渴望成为这个南半球新乐园的殖民者，他们为此租用了两艘船去占领这片此前被认为无人的岛屿，其中一艘船正式任命勒格亚担任大尉。


    然而，后来他得知一支法国舰队正奉命前往该岛屿（事实上，该岛屿已于 1674 年被法国东印度公司的法国印度总督海耶先生（`M. de la Haye`）兼并），杜·克斯侯爵借此停止了他那注定失败的计划的准备，完全遵循其父亲的遗嘱，绝不反对法国政府起兵，转而满足于装备一艘名为“海燕号”（`La
    Hirondelle`）的小型护卫舰，并指示指挥官侦察该群岛，并占领任何发现的无人且适合殖民的岛屿。这一计划的改变似乎并未传达到那小群以移民身份出发的冒险者，他们本以为自己将被带往伊甸岛——即他们幻想中的陆地乐园，而这支小小的探险队最终于
    1691 年 7 月 10 日离开了特塞尔尔岛。


    “海燕号”的指挥官瓦勒索（`M. Valleau`）被勒格亚指控为最卑劣的背叛者。他声称在好望角发现马斯卡雷涅岛已被法国东印度公司（`Compagnie des
    Indes Orientales`）正式兼并（该公司已派遣沃波隆先生（`M. Vaubolon`）在那里担任总督），他驶过了这座迷人的岛屿——事实上，这座岛屿完全对得了侯爵的赞美和描述，它向殖民者展示的迷人前景令饱受坏血病的殖民者心向神往。他继续向东航行，锚定在较小的罗德里格斯岛附近；随后，在
    1691 年 5 月 1 日，勒格亚与八位同伴冒险者登陆，尽管他们对计划的意外改变感到有些失望，但对该地感到足够满意，决定留下来两年看看运气将如何眷顾他们。不久，“海燕号”便驶向毛里求斯岛，卸载了武器、器皿、种子和食物，此外还有每位殖民者自己提供的私人供应物资和必需品。


    正是勒格亚在这一段与世隔绝期间，对岛上现存动植物所做的细致且详的个人观察记录，使得这段关于胡格诺派流亡者的简单故事对今天的自然学家如此引人入胜；因此，在随附原文译文的笔记和附录中，现代科学家的后期调查对勒格亚关于现已完全灭绝的奇异鸟兽外貌和习性的观察得到了特别的阐述；因为这篇迷人的冒险故事中所记录的主要事实的真实性，已由欧洲著名权威在最著名的细节中得到了充分证实。


    在罗德里格斯岛居住了漫长的两年后，殖民者厌倦了不满且对援助不抱希望，建造了一只船，在经历了极其危险的航行后成功到达毛里求斯。不幸的是，他们刚逃离苦海又陷入了更大的麻烦，因为荷兰囚犯营省长的贪婪导致他们受到了极其残忍和不公正的对待。他们被关在一个远离岸头的迎风的岩石小岛上，在试图逃跑时，其中一人惨死不幸。最后，幸存者们设法向欧洲传了他们悲惨境遇的消息，并在被囚禁的情况下被送往巴达维亚，于
    1696 年 12 月在那里登岸，却再次被投入监狱。然而，在荷兰议会的审理后，他们的清白得到了证实，但他们无法为所遭受的痛苦和折磨获得任何补偿，也无法为遭受的损失获得赔。直到
    1698 年 3 月《雷斯卫和约》宣布后，勒格亚和另外两个原团的唯一幸存者才登陆了弗勒梅辛。


    此时，大量法国难民涌入英国，听听勒格亚的一位在此时（1697-98 年）的朋友对此主题的描述很有趣。亨利·德·瓦尔堡先生（`M. Henri de Valbourg`，而非`马克西米利安·米松`，后者与勒格亚有联系）写道：“进入英国的法国新教徒遍布全国，以至于无法确定人数。除了那些在政府任职的教徒，目前在苏格兰、爱尔兰、泽西岛和根西岛也能找到一些（原文最初用法语编写，由奥泽尔先生翻译）。”


    （注：此处原文英文段落似乎出现了严重的乱码或重复错误，翻译已根据上下文逻辑进行了修正顺顺处理）

