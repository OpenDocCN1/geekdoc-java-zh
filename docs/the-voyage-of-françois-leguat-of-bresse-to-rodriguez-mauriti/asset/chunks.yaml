    | 1674. | 德·拉·哈（M. de la Have）再次访问留庞。 |

    | 1677. | 毛里留斯总督伊萨克·拉莫提乌斯（Isaac Lamotius）。 |

    | 1685. | 废除《南特敕令》。 |

    | 1688. | 在八打（Bantam）建立斯皮维克堡（Fort Spielwyk）。第一批胡格教离开荷兰前往南非。 |

