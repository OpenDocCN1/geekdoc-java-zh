    # VOYAGE AND ADVENTURES OF FRANCIS LEGUAT, A GENTLEMAN OF BRESSE


    The State of the Affairs of Religion in France, obliging me to seek after some
    means to leave the Kingdom, I made use of that which Providence furnished me with,
    to pass into Holland, where I arriv’d the 6th of August 1689. I had scarce begun
    to taste the Sweetness of that precious Liberty, which I found in my abode there,
    and which I had been deprived of four whole years, ever since the Revocation of
    the Edict of Nants in 1685, when I understood that the Marquis du Quesne was by
    the good Pleasure, and under the Protection of my Lords the States General, and
    Messieurs the Directors of the East India Company, making Preparations for a Settlement
    in the Island of Mascaregne.


    To this Purpose two great Ships were equipp’d at Amsterdam, aboard which all the
    French Protestants, who were willing to be of this Colony, were receivd gratis.
    The Description of this Island, which was made publick at that time, and the name
    of Eden that was given it on account of its Excellency, made me conceive so good
    an Opinion of it that I was tempted to give it a Visit, resolving to end my Days
    there in Peace, and out of the Care and Confusion of the World, if I found ’twas
    but in some measure so Pleasant and Commodious as ’twas describ’d to be.


    Twas so easie for a Man to enter himself in this Colony; and the Idea I had of
    the Quiet and Pleasure I hop’d to enjoy in this lovely Island was such, that I
    got over all the Obstacles which lay in my way. I offer’d myself to the Gentlemen
    who were concerned in the Enterprize. They receiv’d me very favourably, and honour’d
    me with the Post, or rather Name, of Major of the biggest of the two Ships, which
    was call’d La Droite.


    All Things necessary being aboard, and the Masters ready to set sail, waiting
    only for a fair Wind, we understood that the French King, who had formerly taken
    Possession of this Isle, had sent a Squadron of seven Men of War that way. The
    Uncertainty we were in of the Design of that little Fleet, and a just Fear grounded
    on some advices lately come from France, were such powerful Motives with Mr. du
    Quesne, that he disarm’d the two Ships, and disembark’d the Goods and Necessaries,
    being afraid to expose so many poor Wretches, who were already miserable enough,
    to Danger; the greatest part of them being Women, and other Persons who cou’d
    not defend themselves.


    But that he might fully inform himself of the Design of that Squadron, if there
    was such a one, he resolv’d to set out a little Frigat, and send her away upon
    Discovery. Some Persons were chosen to go aboard her, and they had Orders given
    them concerning the design of the Voyage: The substance of which was:


    1. To visit the Islands that lie in the Way to the Cape of good Hope; particularly,
    those of Martin Vas, and Tristan.

    2. Afterwards to pass the Cape of good Hope, to learn, if it was possible, more
    certain News of the Isle of Eden, and the Design of the French Squadron, which
    was said to be at Sea.

    3. To take Possession of the Isle of Mascaregne, in the Name of the said Marquis,
    who was authoriz’d to enter upon it, in case there were no French there.

    4. If it cou’d be done without running any considerable Risk, to proceed as far
    as the Island of Diego Ruys, which the French call Rodrigue.

    5. If that Island was found to be sufficiently provided with Things necessary
    for Settlement, and the Subsistance of those that would live there, then to take
    Possession of it, in the Name of the said Marquis.

    6. To send the Ship back, after unloading the Things that were for the use of
    the Colony, that intended to settle in this new World.

    7. And lastly, to take an exact Account of the Isle, where those that were left
    behind staid in expectation of the rest of the Colony, who were to come after,
    in two Years Time at Farthest, and then to possess themselves of the Isle of Eden,
    under the Protection, and by the Assistance of Messieurs of the Company.

    '
