    5.  If that Island was found to be sufficiently provided with Things necessary
    for Settlement, and the Subsistance of those that would live there, then to take
    Possession of it, in the Name of the said Marquis.


    6.  To send the Ship back, after unloading the Things that were for the use of
    the Colony, that intended to settle in this new World.


    7.  And lastly, to take an exact Account of the Isle, where those that were left
    behind staid in expectation of the rest of the Colony, who were to come after,
