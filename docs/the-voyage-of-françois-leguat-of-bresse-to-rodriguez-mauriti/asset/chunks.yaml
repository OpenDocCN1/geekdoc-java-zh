    Sometimes the north-east and south-east trade winds meet, generally somewhere
    about the meridian of 28°, or 33° west, where a vessel may, by chance, pass in
    a squall from one trade to the other.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_25))
    Trinidad and Martin Vas form a small but remarkable group of rocky islets near
    the usual track of sailing vessels bound for the Cape, in lat. 20° 30’ S., long.
    29° 21’ W. The Martin Vas rocks lie twenty-six miles from Trinidad; they are three
    in number, and the largest is visible thirty miles off.^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_26))
    In the print of the French edition it is named *Grand Gosier,* a well-known French
    name for a pelican; but Leguat’s figure, entitled *The Great Throat,* seems to
    represent a heron of some kind. It is impossible to specify the bird.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_27))
    There are two distinct families of Cetaceans. The first, *Odontoceti,* or toothed
    whales, include the spouting whales, which subsist on fish and sepias, representing
    the carnivorous class, exemplified by the sperm-whales, porpoises, and dolphins.
    The second division comprises the whalebone whales, as the *rorquals* and *mysticetes,*
    the true or right whales, provided with filaments of whalebone.The whales seen
    by Leguat were probably the sperm-whales, the largest and most valuable of the
    southern whales. These are gregarious, and are found in parties, termed by whalers
    “schools” or “pods”, according to the size of the association.^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_28))
    “*Monsignor Godeau,* a witty prelate, and an *habitué* of the Hôtel de Rambouillet,
    who was one of the first members of the French Academy. It is related that he
    owed the bishopric of Grasse to the irresistible habit of punning possessed by
    Richelieu. Godeau having written a paraphrase of the canticle, *Benedicite omnia
    opera,* presented it to the Cardinal, who was so pleased with it, that, after
    having read it over again in the presence of the author, he said to him: ‘ You
    offer me the Benediction, I offer you in return (*graces,* thanks) Grasse.’ “(*Eugène
    Muller.)*^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_29))“Pour la beauté
    de l’Univers,De Monstres en formes diversTu peuplas les humides plaines;Et voulus
    qu’en leur vaste enclos,Tous rendissent hommage à ces lourdes BaleinesQu’on prend
    pour des écueils sur la face des flots.”^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_30))
    Voyages of Cadamosto and Pedro de Cintra, in the Portuguese service, 1454-1463,
    in the collection of voyages by Vicenza, 1507.^([3](#C01_chapter_split_000_split_000.xhtml_Rfn8_31))
    Compare Milton (1665), *Paradise Lost,* Book vu:—“. . . . these leviathan,Ilugest
    of living creatures, on the deep,Stretch’d like a promontory, sleeps or swims,And
    seems a moving land.”When a solitary or lone sperm-whale is observed it almost
    invariably proves to be an old bull. When two or more schools of whales coalesce
    and form a very large assemblage, this is technically distinguished as a “body
    of whales”.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_32)) In Max. Misson’s
    *Memoirs and Observations* in his travels over England, 1697, translated by Mr.
    Ozell, 1719, p. 359:—“Whale.] In one of the Courts of St. James’s Palace, there
    is the llib of a Whale twenty feet long. *Jonas* would certainly have had Elbow-room
    enough in the Belly of such a Fish, if the Monster’s Throat (or the Gate of the
    House) was proportionable to the rest; that Point s to be examin’d.”^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_33))
    *Navigatio Vartomanni;* see *Novus Orbis* of Hervagius, 1537.^([3](#C01_chapter_split_000_split_000.xhtml_Rfn8_34))
    *Hydrographie,* par M. George Fournier, Paris, 1667.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_35))
    *Hierozoicon sive Bipartitum opus de Animalibus S. Scriptursæ, Geogr. Sacra, sou
    Phaleg et Canaan,* 3tia editio, Samuel Bochartus, 3 vol. in 2, fob, Lugduni Batavorum,
    1692. *Balsena* is derived from *ϕἁλλαινα.*^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_36))
    A male sperm-whale of the largest size, and probably the guardian of a “school”,
    rushed repeatedly at an American whaling ship, the *Essex,* and stove in the planking
    of her starboard bow, in 1820.—This was a case of assault, which, however, there
    is nothing to show that Leguat’s was. The whale that “scratched” herself against
    his ship was more likely trying to divest itself of barnacles, with which, like
    most whales, especially in the South Seas, it was probably beset.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_37))
    The Tristan d’Acunha Isles are three in number: Tristan, the largest, to the north-east;
    Inaccessible, the westernmost and smallest; Nightingale Island, to the south.
    The N.W. extremity of Tristan, near the settlement, is in lat. 37° 2′ S., long.
    12° 18′ W. The people now living in the village on Tristan form a very interesting
    community in what is called Falmouth Bay. The Duke of Edinburgh landed here in
    1867, the *Challenger* in 1874\. It is dangerous to range along the margin of
    the ioland nearer than two miles, on account of the baffling eddies, which leave
    a ship in the onset influence of the swell.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_38))
    The figure given by Leguat’s publishers of the *Vache Marine* is all but identical
    with that figured by Père Tachard, who writes of it:—” On voit dans les grandes
    Rivieres un Animal monstrueux, qu’on apelle Vache-lMarine, & qui égale le Rhinocéros
    en grandeur, sa chair ou pour mieux dire son lard est bon a manger, & le goût
    en est fort agréable. J’en ay mis icy la figure.” (*Voyage de Siam,* liv. ii,
    p. 89.)There is much confusion as to the synonyme of so-called sea-elephants,
    sea-lions, sea-bears, sea-leopards, sea-wolves, etc., which names have been more
    or less misapplied to all seals with ears, so that it is impossible to form any
    conjecture as to what this *“Vache marine”* was. The figure given by Leguat is
    clearly meant to represent a hippopotamus; but he could not have met with a hippopotamus
    at sea ! All we can say is, that it was probably not one of the sea-wolves he
    found at Tristan d’Acunha.^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_39))
    “Des grisets ce sont oyseaux gros comme Pigeons qui vivent de pesche, ils sentent
    trop le marescage” (*de Flacourt). “Grissard”* seems to be any grey sea-bird.
    Leguat, doubtless, met with “Cape Pigeons”, but he would hardly call them “Grissards”:
    more likely “*Pintades*”.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_40))
    Robben (so called from the seals which used to inhabit it) or Penguin Island lies
    five miles N.E. from Green Point, at the entrance to Table Bay, and three miles
    from Blaauwberg beach, the northern boundary of the bay. A constantly northern
    current sets out between Robben Island and the mainland: added to which the wind
    blows with great violence from the S.E. In dark or hazy weather many ships have
    sailed right upon Green Point, without seeing land, whilst their masts were seen
    over the fog from the elevated ground, so it is a prudent course for a stranger
    not to beat into the bay in thick weather, but to keep off until it is clearer.“On
    laisse sur la gauche en entrant une Isle assez basse nommée PIsle Robin, au milieu
    de laquelle les Hollandois ont arboré leur Pavillon. Ils y relèguent ceux du pais,
    & même ceux des Indes qu’ils veulent punir de banissement & les obligent d’y travailler
    á la chaux, qu’ils font des coquillages, que la Mer y jette.” (*Père Tachard,*
    1686.)^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_41)) A Portuguese expedition
    under Bartholomew Dias was despatched by King John II, from Lisbon, in 1487, along
    the west and south coasts of Africa, to find a route to the Indies, and successfully
    reached the Cape, named *Cabo Tormentoso,* afterwards Cabo de Boa Esperança, which
    name, some say, was given it instead of Agesingue, its proper designation, because
    that was the farthest the Portuguese King hoped to extend his explorations and
    conquests, or because this Cape gave expectation of better countries and discoveries
    beyond it. (*Weise.)*^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_42)) The
    southern promontory of Africa, commonly called the Cape of Good Hope, is a peninsula
    twenty-eight miles in length, composed of a vast mass of mountainous and rocky
    land. The north end of this promontory forms the west side of Table Bay, on the
    south coast of which stands Cape Town, having near it, on the west, the Lion’s
    Mountain, 2,180 feet high; at two miles from it, to the south, the Table Mountain,
    3,550 feet, eastward of which is the Devil’s Berg, 3,270 feet, and other elevations.The
    Cape, on approaching, either from the east or west, has the appearance of a large
    island. Of all the land the most remarkable feature is Table Mountain, which appears
    to have a flat, level summit with perpendicular sides. It is composed of a sandstone
    and quartzose rock resting on a granite base.When the S.E. wind blows at the Cape,
    a remarkable phenomenon attends it, in that a dense, continuous mantle of cloud
    rests upon the summits, and pouring down the precipitous sides like a cataract,
    dissolves in vapour at about 1,000 feet. This majestic white cap is called by
    the inhabitants “the table-cloth”, and by the French *La perruque* (cf. *Findlay,
    op. cit.,* p. 211).^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_43)) Vide
    *Voyage de Siam, des Pères Jésuites, envoyez par le Roy aux Indes & à la Chine.
    Avec leurs Observations Astronomiques, et leurs Remarques de Physique de Géographie,
    d’Hydrographie & d’Histoire. A Paris*, M.DC.LXXXVI., *par Guy Tachará de la Compagnie
    de Jesus*. Plate of *La Baye du Cap de Bonne Esperance*, p. 62, qto. edition;
    p. 53, 12mo edition, 1687. *C. Vermeiden fecit*. The only difference between Tachard’s
    charts and that in Leguat’s volume is the difference of size, with the insertion
    of four ships and the omission of four large fish, meant perhaps for whales, in
    the Jesuit’s drawing.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_44)) Lambard’s
    *Perambulation of Kent*, 1576, p. 339\. “ One accident more touching this house,
    and then an ende ; it hapened in the reigne of *Queene Marie*, that the Master
    of a Ship, passing by whilest the Court lay there, and meaning (as the manner
    and dutie is) with saile and shot to honour the Princes presence unadvisedly gaue
    f yre to a peice charged with a pellet in sted of a tampion, the which lighting
    on the Palaice wall, ranne through one of the priuie lodginges, and did no further
    harme.”^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_45)) Herr Simon van der
    Stel was *Commandeur* at the Cape from 1679 to October 1691, when he was promoted
    Governor and, in 1692, *Gourveneur en Extraordinaar Raad*, till 1699, when he
    retired to Con-stantia. Herr Willem Pat was the Militaire Hoofd at the Castle
    from 1689-93.^([3](#C01_chapter_split_000_split_000.xhtml_Rfn8_46)) A few French
    refugees took service with the Dutch in South Africa before 1685, when the Company
    decided to send out a French pastor and some Huguenots as colonists, providing
    free passages and farms without payment as inducements, in order to improve the
    cultivation of vines and olives at the Cape. In 1688 several parties of French
    emigrants were dispatched from Holland, whom the Commander, van der Stel, received
    and treated kindly ; but, in 1689, when these French settlers requested permission
    to establish a separate church at Drakenstein, he, being anxious to blend the
    nationalities, contested their right. He therefore viewed with pleasure the project
    of the Marquis du Quesne for drawing French emigrants to the Island of Mascaregne,
    as thereby the proportion of French refugees introduced into Cape Colony would
    be lessened. (*Cape Quarterly Review*, vol. i, p. 385.)^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_47))
    During the Southern summer, October to April, the passage round the Cape is a
    simple and easy one to make, the track lying within the region of the anti-trade
    winds. The chief difficulties are the strong gales which are encountered further
    to the south, at this season, than they are in winter, when they occur near the
    latitude of Cape Colony. Besides the adverse winds in the summer near the Cape,
    there is the Agulhas current to be encountered, setting to the west along the
    edge of the Agulhas bank. To avoid this a high latitude should be chosen, and
    the parallel recommended to run down the easting as far as the longitude of eastern
    Madagascar, is that between lats. 88° and 40°. After reaching longitude 54° or
    55°, turning northward, the route carries between Mauritius and Réunion. This
    track, which was known and used from early time, has been named by the French
    “ the Boscawen passage”, in consequence of Admiral Boscawen, with a convoy of
    twenty-six sail, making a quick passage by this route in 1748.All that part of
    Africa of which Cape Agulhas is the southernmost point is surrounded by a bank
    of soundings, which is called the bank of Agulhas. This bank begins at 32° 30’
    of S. lat., near the coast, in long. 29° E., and continually increases its breadth
    to the southwestward, till it exceeds 135 miles, then, extending north-west, it
    contracts to the Cape of Good Hope, and finally terminates near St. Helena Bay.
    (*Findlay.*)^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_48)) “ Dans l’une
    de ces Travades parurent deux diverses fois sur les mats, sur les vergues & sur
    le canon de notre Navire, de ces petits feux de figure piramidale, que les Portugais
    appellent le feu de saint Telme & non pas Saint Helme. Quelques Matelots les regardent
    comme l’ame du Saint de ce nom, qu’ils invoquent alors de toutes leurs forces,
    les mains jointes & avec beaucoup d’autres marques de respect...... Ce sont ces
    mêmes feux que les Payens adoroient autrefois sous le nom de Castor & de Pollux
    ; & il est surprenant que cette superstition se soit ainsi introduite parmy les
    Chrétiens.” (*Voyage de Siam*, 1686.)^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_49))
    *“Ouragati”*. The winds and weather between the Cape and the meridians of Madagascar
    or Mauritius are certainly very peculiar, being a sort of debatable ground between
    the trades and the anti-trades, a region alternately affected by both.Lieut. Bridet,
    Director of the Observatory at St. Denis, Réunion, attributes the rotatory gales
    or cyclones, which are encountered as far south as lat. 40°, to the recurving
    of those true cyclones which commence in the northern margin of the trade winds.
    These cyclones turn from left to right, like all others in the southern hemisphere,
    but with an angular velocity less than that of the cyclones of the torrid zone.These
    extra tropical gales, which are most violent from May to August, invariably travel
    to the eastward. They last from one to seven days, and travel at the rate of from
    four to twenty miles an hour. These storms are generally limited within a few
    degrees to the latitude of 40°.The gales most to be dreaded are those which are
    preceded by heavy black clouds, rising from the N.W. and W., sometimes with lightning.
    The old Dutch commanders were directed by the East India Company to wear and shorten
    sail when this occurred, as a gale might be expected.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_50))
    *Tramontana* or *Tresmontaine* = the Pole Star, thus alluded to in a document
    among the Ashburnham MSS. :—“ La tresmontaine est de tel guiseQu’ele est el firmament
    asisseOù ele luist et reflambie Li maronier qui vont en FriseEn Gresso, en Acre,
    ou en Venise.Pour bise, ne pour autre afaireNe laist sen dout servise à faire,La
    tresinontaigne clere et pureLes maroniers par son esclaireJete souvent hors de
    contraireEt de chemin les asséure.”(*Lais inédits*, M. F. Michel, Paris, 1836,
    quoted by Wm. Chapell in *Nature*, June 15, 1876.)*Perdre la Tramontane*, equivalent
    to lose reckoning. “Il ne plus pouvoir s’aider de la boussole à cause d’agitation
    du vaisseau” (*Littré*). In fact, they knocked about so much that the compass-bearings
    could not be depended on.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_51))
    *Vide ante*, p. 2, and Appendix.^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_52))
    *Relation de Voyage*, par M. Dellon, 2 vols, in 12, Paris, 1685\. M. Dellon writes
    : “ For the rest, there is neither Serpent nor Scorpion, or any other reptiles
    or Venomous Insects to be found in this Island, the goodness of it being such,
    as to be quite contrary to these Creatures, as it has been found by several Experiments
    which the *French* have made upon Rats.” (*A Voyage to the East Indies*, 1698,
    p. 12.)^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_53)) “ Now that I have
    compared Leguat’s extracts from Du Quesne with the tract found and reprinted by
    M. Sauzier in 1887, I feel very doubtful whether M. Sauzier has got hold of the
    right thing. I don’t doubt that his prize is the work of du Quesne, but it reads
    like au *abridgment* of some book which Leguat had before him. If Leguat had had
    only the tract which M. Sauzier found he would never have inserted so many particulars
    which it does not contain.”—N.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_54))
    This is an error of du Quesne ; it should be John III. In 1661 M. de Flacourt
    described Bourbon, and gave a map showing the rivers and the volcano. The rivers
    are named and the habitation of the French settlers is shown at St. Paul. M. du
    Quesne evidently drew upon M. Flacourt’s account for his description of Mascaregne.^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_55))
    De Flacourt wrote : “ Ce seroit auec juste raison que l’on pourroit appeller cette
    isle un Paradis terrestre.”^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_56))
    Réunion, as the island is now called, is situated in lat. 20° 5Γ, long. 55° 26’
    (*St. Denis*). It was captured by the British in 1810, but restored to France
    by the treaty of Paris in 1815, and is now an important colony of the Republic.
    It is 138 miles in circumference, and 48 miles long, east and west, by 34 miles
    broad, north and south. The island is a mass of volcanic mountains, the ridges
    rising to a height of 10,169 feet between the extinct crater *cirques*, whilst
    an active volcano forms the extremity of the island, whose summit is 8,613 feet
    in height. Its area contains about 610,000 acres, of which nearly one-third is
    cultivated.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_57)) “ Les estants
    & riuieres y fourmillent de poissons, il n’i a ni cro-codilles dans icelles, ni
    serpens nuisibles à l’homme, ni insectes fâcheuses, ainsi que dans les autres
    îles, ni pulces, ni mouches, ni mousquites picquantes, ni fourmis, ni rats, ni
    souris.” (*De Flucourt*,1661.)^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_58))
    “En cette année mil six cens-quarante-neuf, i’y ay fait passer quatre génisses
    et un toreau, afin d’y multiplier. Et en l’année mil six cens cinquante-quatre,
    i’y en ay enuoyé autant, lesquelles on trouua qu’elles estoient multipliées jusques
    à plus de trente.” (*De Flacourt.*)^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_59))
    “ In the English translation the word ‘ Géants’ is here given as * peacocks’,
    as though it had been ‘ *paons¹ ;* but at p. 171 by ‘ giants’ “ (*Strickland*).
    “ Les oiseaux de terre sont : le solitaire (comme une grosse oie), blanc, avec
    noir à l’extrémité des ailes et de la queue, où il y a des plumes pareilles à
    celles de l’autruche, col long, bec de bécasse, mais plus gros, pieds de poule
    d’Inde, se prennent à la course et voilent peu. C’est un des meilleurs gibiers
    de l’île. Les oiseaux bleus, gros comme les précédents, avec bec et pieds rouges,
    faits comme pieds de poules, ne volant pas mais courant très-vite.” (*Dubois*,
    1669, quoted by *Maillard*, p. 10.)^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_60))
    *Collet rouge*, or flying fox, is a large species of bat, *Pteropvs Edwardsii*.
    Some specimens measure over three feet from tip to tip of the wings. “ Il y a
    aussi beaucoup de tortues de terré et de mer, et des chauve-souris, grosses comme
    des petits chats.” (*Dubois.*)^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_61))
    These “ Sparrows with red breasts” belonged to a species of weaver-bird, *Foudia
    Bruante (P. L. S. Midler*), of which Sir Edward Newton says (*Trans. Norfolk and
    Norte. Natural Soc*., iv, p. 548) that “it was described in the last century by
    Buffon and figured by Daubertin. The specimen which provided the description and
    figure no longer exists, so far as I can ascertain. 1 have never heard of anyone
    now living who has ever seen an example of the bird. Its place on the island is
    now taken by the kindred species, *Foudia Madagascaricnsis*, introduced from Madagascar.”
    See Appendix for list of Bourbon birds.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_62))
    *Harpagon*, the miser in *L’Avare*, by Molière (1667).^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_63))
    *Purgon*, the conventional doctor in 7,e *Malade Imaginaire*.^([3](#C01_chapter_split_000_split_000.xhtml_Rfn8_64))
    *Mascarille*, the sham marquis in *Les Précieuses Ridicules*, by Molière (1659).^([4](#C01_chapter_split_000_split_000.xhtml_Rfn8_65))
    *Métaphrast*, a critic, *l’auteur qui l’explique*.^([5](#C01_chapter_split_000_split_000.xhtml_Rfn8_66))
    *Trissotin*, a *bel esprit* in *Les Femmes Savæites*, by Molière (1672).^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_67))
    *Shelves*, the coral reefs -which encircle the island. “*Brisans”* in the French
    edition, rocks on which the sea breaks in heavy surf. Glorious old John Dryden
    used the word *shelves*:“ Three ships were hurried by the southern blastAnd on
    the secret shelves with fury cast.” (*Æneid*, i, 154.)^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_68))
    A small stream in the department of Loire, which, taking its rise in the hills
    of Forez, flows through Boen and by the family château of the celebrated d’Urfé
    (who has there placed the scene of his romance *l’Astrée*), and enters the river
    Loire near Feurs. It is not surprising to find Leguat quoting this romance, first
    published in the reign of Henri IV, for it continued a popular book down to the
    days of J. J. Rousseau (born in 1712), with whom it was a favourite volume during
    his youth. (Note in Eugène Muller’s version of *Leyuafs Voyage*, p. 60.)^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_69))
    After the battle of Worcester Charles heard, at the house of John Penderell, near
    the Boscobel Wood, that Colonel Careless was hiding in the vicinity. At his suggestion
    the prince passed the third day of his wanderings in concealment with Colonel
    Careless, among the branches of an oak tree, which was called the Royal Oak, and
    remained standing as late as the middle of the last century, when it was mentioned
    by Br. Stukeley in his *Itinerarittm Curiosum*, published in 177G.The reference
    to the Oak of Boscobel seems a favourite allusion of Max. Misson, who in his *New
    Voyage to Italy* writes: “This is no ill Thought ; and puts me in Mind of some
    of our Friends in *London*, who have precious Snuff-Boxes, made of the *Royal-Oak*
    known as Boscobel.’’^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_70)) “ The
    Name of the Captain that aecompany’d the King in the Oak at *Boscohel* was *Careless*,
    an English Word which signifies Negligence, or without Care. But the King thought
    fit to change his Name from *Careless* to *Carlos”* (See Sylvanus Morgan’s *Spheres
    of Gentry*, and Dr. Chamberlain’s *Present State of England*, vol. i, ch. 4.)—Note
    by the edtor of the original edition. The translator has retained the French equivalent
    for Careless— *Sanssouci* —in the text as it stands in the French edition.^([3](#C01_chapter_split_000_split_000.xhtml_Rfn8_71))
    This Peter Thomas is not mentioned in the list of Leguat’s companions on p. 6
    (*siqira*). He appears to have been one of the crew of the ship, and to have made
    up his mind to remain at Rodriguez at the last moment when the ship sailed. See
    note in Midler’s 18s:¹) edition, p. 71, and p. 55 *infra*.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_72))
    Palm-trees ; see *infra*, note on p. C3.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_73))
    From this tree, cons’dered by Professor Balfour to be the so-called “Bois d’olive”
    (*Elseodendron orientale*), exudes an enormous quantity of gum in the form of
    tears, which soon harden and form large masses in the crevices of the stem or
    on the ground around. It is the most frequently met with of all the trees in the
    island. (*Phil. Trans*., vol. clxviii, p. o34.)^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_74))
    M. Bénelle; *ride aide*, p. G; also Introduction.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_75))
    I1 étoit toujours gai, toujours obligeant, & du meilleur naturel du monde.” Bénelle
    was living at Amsterdam when this was written. (See Introduction.)^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_76))
    Fusee, a small, light musket or firelock, commonly writtenfusil”.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_77))
    Or chicory (*C. udylnut*), extensively used fur adulterating coffee.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_78))
    Professor Balfour suggests that this grain was not wheat, but might have been
    millet. (*Phil. Trans*., vol. clxviii, p. 3(M.)^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_79))
    “Une heure après que l’eau est tombée, on peut se promener comme à l’ordinaire.”
    Omitted by translator after word *February*. The translator frequently makes such
    omiss^:ons.^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_80)) Thunder is rarely
    heard throughout the regions of the trade-winds.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_81))
    The reviewer of Leguat’s book in the *Noue. Iles de kt République des Lettres*,
    for December 1707 (p. Gil), calls attention to the very small rainfall being insufficient
    to supply the sources of the streams. This circumstance, and the fact of the remoteness
    of the island from any continent, would apparently, he adds, disprove the theory
    of those who maintain that a’l springs are dependent on rainfall, for the dews,
    though frecpaent, would not supply enough moisture for these perennial rivulets.
    Recent accounts give a somewhat different account of the climate. “The island,”
    says Prof. Balfour, “is comparatively dry, the soil is parched and arid, and during
    the warm season many of the streams are dried up. But the size of the water-courses
    and the enormous boulders filling their beds indicate large torrents in the rainy
    season. In some places, issuing from the clay, springs occur, of which the water
    is brackish, has a very disagreeable taste, and is slightly tepid, but has no
    smell. As a rule the water of the streams is good and safe to drink, but that
    of some rivers, notably the river Saumâtre, is most unpalatable, and apt to cause
    slight catharsis.“The climate is much like that of Mauritius, where the average
    annual temperature is 78° Fahr. During the north-west monsoon, from November to
    -April, the weather is wet and warm, and frequently in the first months of the
    year the island is visited by severe hurricanes. From May to October the south-east
    monsoon prevails, and then the weather is cool and dry.“ The rainfall is exceedingly
    irregular, the hills being hardly high enough, and not sufficiently wooded, to
    arrest clouds ; hence, also, fogs are rare.” (*Philosophical Transactions*, vol.
    clxviii, p. 292.)^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_82)) Cf. p.
    55.^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_83)) In original, “ two thousand
    paces”. The breadth of these level valleys near the sea would, therefore, be one
    mile, *not* two, as in text.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_84))
    Botanists have now distinguished cons^:derably more than a thousand species of
    palms, divided, according to Sir J. Hooker, into 132 genera.^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_85))
    It is a difficult matter to decide what particular species of palm is referred
    to by Leguat. Prof. Is. Bayley Balfour, who visited Rodriguez with the Transit
    of Venus expedition (1874-5), made a special study of the botany of this island.
    He says that Leguat probably included in his description two kinds of palm— *Diciyosppvma
    album*, now very abundant in the island, and *Hyophorbe Verschaffelii*. Part of
    his remarks would apply to one of these and part to the other, while his allusions
    to the fruit as big as a hen’s egg, and the prickly scales on the trunk, would
    agree well with neither. “As pointing in this direction, I think,”says Balfour,
    “ we may take his remark, ‘some have a smoother bark than others,’ for the bark
    *Hyojikorbe Vtrschajj’iltii* is much smoother than that of *Dictyosperma album.”*This
    palm, *Hyophorbe Verschajfeltii*, called Palmiste marron (*i.e*., wild Palmiste)
    by the Creoles, grows to a height of 25-30 feet and is spread over the whole island,
    but never occurs on the coralline limestone. It begins with a stem G-12 ins. diameter
    at the base, bulging after a few feet, reaching 12-24 ins. in the middle, thence
    contracting upwards. If the tree be lofty, there may be a second ventiicosity.
    (Cf. *Philosophical Tirais, nf the Royal Society*, vol. clxviii, p. 375 *seqq*.]
    *Flora of Mauritius and the Sfyclullfx*, by J. G. Baker, F.L.S..1.S77, p. 3*3.)^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_86))
    The word “ Latanier” in the original has been throughout the narrative mistranslated
    “ plantane”. It is evidently the fan-palm (*Latania Verschaffeltii*) that Leguat
    is describing here. Prof. Balfour says it is found in every part of the island,
    where it is put to a variety of uses. The wood is very hard and durable, of a
    rich mottled black appearance, and used for building huts, though now this is
    interdicted, as the trees are becoming more scarce. The leaves are chiefly used
    for thatching huts, and are also made into baskets. The fibres of the petiole
    form a very excellent material for cordage, and the reticulum is also put to various
    uses. (Cf. *Phil. Trans*., vol. clxviii. p. 374.)^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_87))
    *Capoc*, a sort of cotton so fine and so short that it cannot he spun. It is used
    in the East Indies to line palanquins, and to make beds, mattresses, cushions,
    pillows, etc.(Rees’ *Cyclopxdia.*)^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_88))
    A play on the name of Diodati, or Deodate, the Governor in Mauritius, who subsequently
    persecuted and imprisoned Leguat.^([3](#C01_chapter_split_000_split_000.xhtml_Rfn8_89))
    Professor Balfour supposes this plant to have been either *Capsicum frutescens*,
    abundant everywhere in the island, or *C. cordiforme*, not common (*L* c, pp.
    303, 360). But it seems scarcely probable that Leguat’s pepper was a capsicum,
    which bears a long, pod-like fruit or seed, whereas he compares that of his plant
    to a small plum.^([4](#C01_chapter_split_000_split_000.xhtml_Rfn8_90)) A few trees
    of *Cocos nucífera* occur in the compound of Government House at Port Mathurin.
    Leguat’s remark that the cocoa-nuts thrown up on his island came from St. Brandon,
    better known as the Cargados Garajos, in lat. 1G° 25’ south, and between long.
    50° and 60° east, is difficult to reconcile with the circumstance of the prevailing
    south-east monsoon setting the current in an opposite direction, *i.e*., towards
    this group from Rodriguez. There are, however, more singular instances of drift
    on record, *e.g*., the Keeling Islands, whose flora is almost wholly derived from
    islands in the Indian Archipelago, though the direction of the winds and currents
    would hardly seem to render such a thing possible. Compare Darwin’s remarks on
    this subject in *Voyage of the Beagle*, vol. iii, p. 542, and Chamisso, in Kotzebue’s
    first voyage (vol. iii, p. 155).^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_91))
    Here our author is in error ; the Cargados Garajos (*vide* note on p. 65) are
    to the *north-westward* of Rodriguez, and about 300 miles distant from it. These
    islets, of which there are said to be sixteen in number, lie off a dangerous bank
    of coral sand. It was with reference to their position that an acrimonious controversy
    raged, towards the end of the last century, between the Abbé Rochon and M. d’Après
    de Manevil-lette, a well-known hydrographer, the Abbé having placed St. Brandon
    fifty leagues to the eastward of Cargados Garajos. Later surveyors have, however,
    succeeded in establishing their identity. According to Sir E. Belcher, who visited
    the group in 1846, the fishermen there have a way of calling every white stone
    above water a St. Brandon. The southernmost of these isles, Coco Island, owes
    its name to its having been formerly covered with these trees, of which only two
    remained in a perishing condition at the time of his visit. St. Brandon is noted
    for the beautiful scarlet coral, the *Tnbifora música*. (Cf. Findlay’s *Sailing
    Directions for the Indian Ocean*, p. 454 ; Pike’s *Sub-tropical Rambles*, pp.
    423-4 ; *Voyages à Madagascar*, par Alexis Rochon, 1802, tome i, ch. xlvi.)^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_92))
    “Dans la saison de l’Ouragan, on pourroit dire que le tourbillon auroit enlevé
    ces fruits dans l’isle de Ste. Brande.”^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_93))
    There can be little doubt that Leguat’s description and the authors he cites point
    to the banyan (*Ficus indica*). Its great height and the vast area it covers with
    its interlacing branches, the curious way these have of taking root and forming
    new stems, are all characteristic of this remarkable tree, which has been a favourite
    theme of writers in prose and verse in all ages, from the days of Pliny to our
    own times.But, though indigenous to India, Southern Persia, and Ceylon, the banyan
    is foreign to the Mascarene flora. We may suppose, therefore, either that it was
    formerly extant and has become extinct in Rodriguez, or that Leguat referred to
    some other species of *Ficus*. Balfuur describes two— *F. consimilis* and *F.
    rubra* —found by him on that island, where they are both common, but adds that
    neither of them is the one described by Leguat. Baker mentions these and several
    other species in his *Flora of Mauritius* (pp. 283 *seqq.*), and Sir Henry Barkly
    informs the writer that there is a large tree of *F. consimilis* in Seychelles,
    and that the bats feed on its fruit precisely as Leguat describes at Rodriguez
    j but the size of the leaves and fruit is much smaller than his species. (*Phil.
    Trans., l. c*, p. 368; Balfour’s *Timber-Trees of India*, p. 117 ; Helinsley’s
    *Vegetation of Diego Garcia*, in *Linn. Soc. Journal*, vol. xxii, p. 334.)^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_94))
    *Les Voyages et Observations du Sieur de la Boidlaye-Lc-Gouz, etc*., Paris, 1653,
    2nd ed., 1657\. This author, whose tour in Ireland in 1644 was edited in English
    by Crokcr in 1837, was born in the early part of the seventeenth century. He travelled
    extensively in the East, and died in Persia in 16G8\. The genuineness and impartiality
    of Iiis remarks on men and things earned for him the reputation of “ a very honest
    fellow”. The passage in his above-mentioned work referring to the banyan-tree
    is in chapter xvii (pp. 183 *seq*. of 1st edit.), lie figures the tree with a
    native Indian seated below, a cow and a pagoda, while above is a quaint representation
    of the sun. He mentions camping several times under its shade while on the journey
    from Surat to Goa, and remarks that Rama or Brahma taught the Indians to venerate
    it. The followers of this divinity, however, mingling superstition with their
    worship, declared that anyone plucking its leaves would die within the year.Milton
    described it as follows :—... there soon they choseThe fig-tree, not that kind
    for fruit renown’d,But such as at this day to Indians knownIn Malabar or Deccan
    spreads her arms,Branching so broad and long, that in the groundThe bended twigs
    take root and daughters growAbout the mother tree, a pillar’d shadeHigh overarch’d,
    and echoing walls between.”(*Paradise Lost*, Book ix.)^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_95))
    Cf. Tavernier’s *Persian Voyages*, Book v, ch. xxiii, 1682 ed., vol. i, p. 614\.
    This traveller also figures the banyan, stating that the Persians call it *Lui*,
    the Portuguese “ arbre de Reys”, and the French “ l’arbre des Banianes”.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_96))
    *l.c., Palétuvier*, the mangrove, a very different tree.^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_97))
    The title of this rare book is given on page 17, *supra*.^([3](#C01_chapter_split_000_split_000.xhtml_Rfn8_98))
    The name *Kasta*, to which Leguat, following La Boullaye-Le-Gouz, attributes an
    ludían origin, is Portuguese, meaning no more than our word “caste”, which is
    derived from it. Of course, the caste-tree would not be an inappropriate name
    for the *Ficus religiosa*, whieh has always been an object of superstitious reverence
    among the Hindus. (Cf. Dr. Brewer’s *Dictionary of Phrase and Fahle ;* Yule’s
    *Anglo-Indian Glossary.*)^([4](#C01_chapter_split_000_split_000.xhtml_Rfn8_99))
    Prof. Balfour has no doubt but that the tree referred to by Leguat as the “ nasty
    tree” is *Clerodendron lacinialiun*, the *Bois cabri* of the Creoles, a small
    tree easily recognised by its disagreeable odour, which has occasioned its popular
    name. The wood is very white and close-grained, but is not put to great use, save
    for burning, probably on account of the odour. Sonic have thought that Leguat
    referred to the Bois puant (*Fatidia Maiiriliana Lam.*), but the odour of that
    tree, though exceedingly objectionable, is only apparent when the sun shinet:
    upon it, and is evanescent, and not at all like the persistent odour which the
    Bois cabri emits. (Balfour, in *Phil. Trans*., vol. clxviii, p. 364, and Plate
    xxxii ; and cf. Baker, *l. c*, pp. 255 and 120.)^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_100))
    *Portulaca olerácea*, Creole name *Pourpier*, is common in waste ground, and especially
    abundant on the barren ground towards the west of the island. (*Balfour, I*. c,
    p. 328.)^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_101)) According to Admiral
    Kempenfeldt, who visited Rodriguez in 1761, the land-turtle was the best production
    of the island. Small vessels were constantly employed in transporting them by
    thousands to Mauritius for the service of the hospital. The principal objects
    of interest m Rodriguez then were : First, the house of the Superintendent appointed
    by the Governor of Mauritius to direct the cultivation of the gardens and to overlook
    the park of land-turtles ; secondly, the park for the land-turtles, which is on
    the sea-shore, facing the house. As long as Rodriguez was in the hands of the
    French, these tortoises were protected. (*History of Mauritius, etc*., by C. Grant,
    Viscount de Vaux, 1801, pp. 100-101.) “ But early in the present cenjbury the
    work of extermination appears to have been accomplished,” remarks Dr. Günther,
    “ and there is at present of the Rodriguez tortoise not a single living example
    in the island or in any other locality.“In 1874 the Presidents of the Royal and
    Geographical Societies addressed a memorial to the Governor of Mauritius, Sir
    Arthur Gordon, requesting him to preserve the last remnants of the nearly extinct
    race of Mascarene tortoises, which still survive in the island of Aldabra.“Among
    the bones collected by the naturalist of the Transit of Venus Expedition, 1874-5,
    some, far exceeding in size the majority of their kind, are not rare, and prove
    that the Rodriguez tortoise was quite equal in bulk to *Testudo elephantina*,
    many individuals having had a carapace four and a half feet long.” (A. Günther,
    in *Phil. Trans., l. c*., pp. 452 *seqq*. See Appendix and supplementary note.)^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_102))
