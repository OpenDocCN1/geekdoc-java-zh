    ## 提及或涉及的事件编年表。


    | 日期 | 事件 |

    | :--- | :--- |

    | 1506. | 可能首次发现圣阿波洛尼亚岛（S^(ta) Apollonia）。 |

    | 1507 年 2 月 9 日. | 迪奥戈·费尔南德斯·佩雷拉（Diogo Fernandes Pereira）首次访问瑟尼岛（Cirne）和圣阿波洛尼亚岛。
    |

