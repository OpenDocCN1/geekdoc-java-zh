  raw: 'P. 5, note 2, *for* “ Andrian VI” *read “* Adrian VI”.P. 6, line 16 and note
    2\. *“Jean Pagni,* thirty Years old, a Convert and Patrician of *Roan.”* Add to
    note, “In the above passage is a curious mistranslation. The original text is
    :—’ *Jean Pagni,* âgé de 30 ans, Prosélyte, & Praticien à *Rouen,’ i.e.,* a Convert
    and Practitioner (of law) at Eouen.”P. 16, note 1, line 2, *for* “ ce font” *read*
    “ce sont”.P. 21, note 2\. *Add, “* Froger and Moore mention the Pelican under
    this name, saying it is of the size and colour of a Goose. Le Maire describes
    it as twice as big as a Swan, with a bill a cubit long, and with a craw which
    lies under its throat like a bag, adding, he swallows fish entire though as large
    as a middling carp. Cf. Froger’s *Voyage au Mer du Sud:* Moore’s *Travels into
    the Inland parts of Africa:* Le Maire’s *Voyage to the Canary Isles;* quoted in
    A new general Collection of Voyages and Travels, by Astley, 1745. Vol. ii, p.
    356.”P. 22, note 2\. *After* “Eugène Muller”, *add“op. cit.,* p. 28.”P. 23, note
    1\. *Add,* “In the Dutch Edition, the taste of the Hollanders has been consulted
    by substituting for M. Godeau’s elegant lines the metrical Dutch version of the
    well-known verses in the 104th Psalm, beginning at the 24th verse :—’ O Lord how
    manifold are thy works, in wisdom hast thou made them all.....There go the ships,
    and there is that Leviathan ; whom thou bast made to take his pastime therein.’
    “P. 26, note, line 7, *for “* the *Challenger* in 1874” *read “* the *Challenger*
    touched here in 1874”.Pp. 38-39\. Note on *Tramontane, for* “ Il ne plus pouvoir”,
    *read* “ Il ne plus pouvoit”.P. 39, lines 13, 14\. *Add* below, note, “Sweet Odour
    of Land. M. de Cossigny, who was Governor of the Isle of France in 1791, and (according
    to Grant) ‘ a man full of knowledge and philanthropy’, states in his *Voyage à
    Canton* (1799) :—’ On approaching the Isle of France, you must keep to windward,
    because the port, which is frequented by the larger vessels, is to leeward: when
    the wind is not violent, the air is embalmed with the perfumes of flowers, with
    which the trees of the island are covered. The same odours are perceived along
    the island of Ceylon, when the winds blow from the land. This effect was falsely
    attributed to the cinnamon tree, which forms a part of the forests of this island,
    as its flowers have a foetid smell. The effluvia from the land are carried by
    the winds very far to sea ; and sometimes produce very sudden and unexpected effects.
    I eaw one of this kind, which is not very uncommon. A German soldier, a passenger
    on board of our vessel, about seven or eight and twenty years old, died suddenly
    in sight of the little isle of Rodriguez, and about a hundred leagues distant
    from the Isle of France. He had some slight symptoms of the scurvy, but he was
    not on the sick-list, nor did he appear to have any unfavourable symptoms.’ (Baron
    Grant’s *History of Mauritius,* p. 516.)”P. 36, line 10, “ Idseas of Virgil.”[¹](#B13_fm-chapter.xhtml_fn3_1)
    *Add* below, in note, “ See Virgil’s *Æneid,* i, 50 *et seq.”*P. 45\. Quotation
    ends at “ bird” in note 2.P. 53, line 9, “the Parrots”. *Add* note, “In original,
    ‘les Perroquets’: *vide infra,* pp. 84, 336, 337, 345.”P. 60\. *After* “ monsoon”,
    *add* “(more correctly the south-east trade wind)”.P. 65, note 3\. *After “* 360).”
    *Dele* from “But” to “small plum”. *Insert “ Vide* Pref., p. xiv.”P. 66, line
    14 from top, “ South east monsoon” should *read “* South-east Trade wind”.Note
    1, *dele “(vide* note on p. 65)”.P. 70, note 2\. *After “* locality”, *add “ (
    Vide* Gigantic Land Tortoises, by Dr. A. Günther, p. 2)”. *Instead of “* supplementary
    note”, *read* “ E, *vide infra,* pp. 376, 377”.P. 77\. *After* “See Appendix”,
    *add “* C, p. 352 *et seq.”*P. 78, note 1, “pour faire le moulinet”, *add,* “Sir
    Walter Scott, when describing the bout with quarter staves between the Miller
    and Gweth at Ashby de-la-Zouche, writes: ‘The Miller, on the other hand, holding
    his quarter-staff by the middle, and making it flourish round his head after the
    fashion which the French call *faire le moulinet,* exclaimed boastfully.’ “P.
    79\. *For “* Plate, No. x”, *read “* Frontispiece”.P. 80, line 14\. “Marriage.”
    *Add* below, note, “ *Vide supra,* p. xx.”P. 81, note 3\. *After “Leguati”, add
    “* or *Miserythrus leguati.* Vide *Ency. Brit.,* Art. *‘Birds”.”*P. 82, note 5\.
    *After “* Part ii” *add* “Appendix B, pp. 326, 329”.P. 104\. *After* “in our text”,
    *add “ Vide* Preface, p. xiv”. *Add* “Note 4\. *‘ Vacoa.* This word is not improbably
    derived from “ *Macarequeau”,* the French name of the Pandanus, after the Malay
    name *ma-karhi-keyo.’* Vide *Voyage of Pyrard de Laval,* vol. ii, Part n, p. 369
    ; Hakluyt edition.”^([1](#B13_fm-chapter.xhtml_Rfn3_1)) P. 36\. The famous *Idœas
    of Virgil* on the storm are expressed in that poet’s inimitable description in
    the 1st Book of the *Mneid.* Virgil represents Neptune as possessed of absolute
    power over all the waters below the firmament, the *Imperium pelagi,* which authority
    had fallen to his share on the death of Saturn. His elder brother Jupiter ruled
    over all the powers of the air, and Æolus, the ruler of the storm-clouds, was
    an inferior deity, whose control of the winds was regulated by fixed meteorological
    laws *(certo fœdere),* and he lets loose the winds, by striking with his spear
    the volcanic Stromboli only at the order of Juno, *Joris et soror et conjux.*


    ## [DEDICATION OF THE DUTCH EDITION.](#A04_content.xhtml_Rfm-chapter4)


    ### TO HEERE CHRISTIAAN BONGART, DOCTOR AND ADVOCATE OF CIVIL AND CRIMINAL LAW.


    *IT is needless to tell one who habitually finds his amusement in the study of
    books and in its sweet pleasures, that the acquaintance with reliable and truthful
    travellers and their memoirs brings with it great enjoyment and utility. I make
    bold to affirm that this knowledge, however much it may he undervalued by the
    ignorant, will never sink so low in the eyes of those intent on sensible occupations
    as to be despised ; at least not, when with the useful and the agreeable it Innings
    to light facts hitherto unknown, or when it keeps up the attention by curious
    yet true revelations. However this may be, I flatter myself not to obtrude in
    respect of cither of these points, and take the liberty of dedicating to you this
    short Voyage, because the discoveries, unimportant as they may seem at first sight,
    are sure to attract the attention of geographers, and because the perilous yet
    happy issues of these people loho were nearly lost deserve so much attention and
    pity, that no one will regret the time spcnt in reading and investigating them.
    Even should I be wrong in this respect I shall be content to have testified to
    the world our intimate friendship and the esteem and respect with which I remain,*Sir,Your
    obedient Servant,                  W. BROEDELET.Utrecht, *the* 12*th April* 1708.


