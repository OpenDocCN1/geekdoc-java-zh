    ## 编辑前言。


    '
- fmt: "\nIn the following story of the remarkable adventures and sufferings endured\
    \ by François Leguat, events are narrated which belong to a period considerably\
    \ later than that of any other travels or voyages treated of in former publications\
    \ undertaken by the Hakluyt Society; nevertheless, the date of the personal record\
    \ follows somewhat closely upon the time of the latter portion of William Hedges’\
    \ diary, to which, indeed, it forms a not altogether unfitting sequel, by affording\
    \ information regarding the system of Dutch administration and colonisation in\
    \ the East Indies, and at the Cape, towards the end of the seventeenth century,\
    \ and by giving a graphic sketch of the circumstances of French Huguenot emigration\
    \ from Europe to South Africa at that epoch.\n\nThe chief modern scientific interest,\
    \ however, in Leguat’s description undoubtedly hinges upon the circumstantial\
    \ delineation which he gives of the curious bird-fauna then extant in the Mascarene\
    \ Islands, the subsequent destruction of which has rendered the personal observations\
    \ of the philosophic Huguenot invaluable to naturalists, marked as they are by\
    \ such evident simplicity and veracity.\n\n### Acknowledgments\n\nIt is now the\
    \ pleasurable duty of the Editor to acknowledge and place on record, in the commencement\
    \ of this volume, the kindness and ready assistance which he has met with in every\
    \ branch of his inquiries from numerous literary and scientific friends during\
    \ its preparation.\n\nFirst and foremost, it is to M. James Jackson, the well-known\
    \ librarian of the `Société de Géographie`, that the Editor owes his acquaintance\
    \ with the early French editions of the Huguenot author. To the researches of\
    \ M. J. Codine, of the same `Society`, are due the more exact knowledge, which\
    \ geographers possess, as to the approximate date of discovery of the several\
    \ Mascarene Islands, on which subject most erroneous views had previously been\
    \ entertained. It is regrettable that want of space has compelled the abridgment\
    \ of M. Codine’s admirable reasoning on this subject. \n\nM. Sauzier’s discovery\
    \ and reproduction of the rare Du Quesne `Mémoire` have contributed largely to\
    \ the better comprehension of several of Leguat’s allusions, although there is\
    \ yet reason to doubt whether the particular `Memoire` from which the quotations\
    \ were taken has been absolutely identified. Several of M. Eugene Muller’s notes\
    \ have been utilised by permission of the annotator, and the clues afforded by\
    \ the Appendix of the small edition of Leguat’s book, republished by the Librarian\
    \ of the Arsenal at Paris, have been found most suggestive. \n\nNaturally, the\
    \ contributions of M. Alph. Milne-Edwards to the `Annales des Sciences Naturelles`\
    \ and other periodical scientific journals have been largely used for the elucidation\
    \ of the natural history of Rodriguez; it would be impossible to illustrate any\
    \ work on the Mascarene Islands without incurring a heavy debt to this celebrated\
    \ naturalist. M. Gabriel Marcel, of the `Bibliothèque Nationale`, has taken an\
    \ infinity of pains in answering, most minutely and categorically, numerous and\
    \ somewhat pertinacious questions, which have been addressed to him by the Editor\
    \ on various points, bibliographical and geographical, in connection with this\
    \ publication, thereby aiding largely towards its correctness. \n\nM. A. Bouquet\
    \ de la Grye, the French Hydrographer, most courteously enabled the Editor to\
    \ obtain an accurate transcript of the Abbé Pingré’s original manuscript journal\
    \ at Rodriguez, hitherto unpublished, which has proved most useful in elucidating\
    \ certain doubtful points. Mr. R. W. Shufeldt, of the `Smithsonian Institution`\
    \ (Washington, U.S.), has readily permitted the reproduction of his clever restoration\
    \ of the Giant bird of Mauritius, whose existence, however, is still problematic;\
    \ and Mr. Van Kampen has been good enough to revise whatever passages have been\
    \ translated from the Dutch of Valentyn by Mrs. Salmon. The thanks of the `Hakluyt\
    \ Society` are due to all the above foreign contributors to their work, as well\
    \ as the Editor’s personal gratitude for their very sympathetic help and encouragement.\n\
    \n### Contributors\n\nHaving, as in duty bound, first of all made his too inadequate\
    \ acknowledgments of what he owes to his friendly helpers across the seas, the\
    \ Editor must now proceed to offer his no less sincere thanks to those of his\
    \ own countrymen who have communicated so freely to him the results of their patient\
    \ investigations of all branches of science treated of in the following notes.\n\
    \nPre-eminent among zoologists and ornithologists, the Professor of Zoology at\
    \ Cambridge (where Strickland and Melville’s collection finds an honoured position),\
    \ and his brother, Sir E. Newton (to whose indefatigable explorations the world\
    \ owes the rehabilitation of Dodo, `Solitaire`, `Aphanapteryx`, and their congeners),\
    \ have furnished far more material for notes and explanatory illustration of Leguat’s\
    \ text than the Editor has been able to treat properly or satisfactorily within\
    \ the space at his command. Moreover, the learned Professor and his brother have\
    \ taken much personal trouble to secure for the Editor, not only access to the\
    \ rich store of osteological remains of the Mascarene birds in the museum (which,\
    \ by the way, is constantly acquiring fresh `trouvailles` from the cave earths\
    \ of Rodriguez and Mauritius), but also a photograph of the skeleton of the bird\
    \ which has conduced to render Leguat’s name immortal. These scientists, so profoundly\
    \ skilled in the subject of most enticing interest in Leguat’s history, have also\
    \ assisted the Editor by their critical perusal of his proof-sheets, so far as\
    \ they concern their special department.\n\nWhilst the avi-fauna of the Mascarenes\
    \ has received such close attention from Professor Alfred Newton and Sir Edward\
    \ Newton, the flora of Rodriguez has been subjected to keen examination and classification\
    \ by Professor Isaac Bayley Balfour, of Edinburgh; and in the report to the `Royal\
    \ Society`, which resulted from his visit to the island in connection with the\
    \ `Transit Expedition of 1874`, the Editor has been able to find all he could\
    \ desire in the task of identifying the plants mentioned with much `naïveté` by\
    \ the Huguenot writer two hundred years ago. Mr. J. G. Baker, F.R.S., and Mr.\
    \ Scott Elliot, of `Kew`, have also aided the Editor by suggestive advice in the\
    \ difficult and unaccomplished problem of ascertaining the identity of certain\
    \ poison-tree of Mauritius, mentioned as causing disastrous effects on the old\
    \ traveller. Professor Günther, likewise, has readily given all information asked\
    \ of him with regard to the wonderful tortoises of the same islands; whilst Professors\
    \ J. Legge, Sir Thomas Wade, and K. Douglas have courteously proffered helpful\
    \ suggestions as to Leguat’s rather confused ideas of the Chinese philosophers.\n\
    \nDr. R. Rost, of the `India Office`, has rendered most important assistance to\
    \ the Editor by permitting him to consult the various books of travel in the Library,\
    \ which could not easily be obtained. Indeed, his cordiality and kind advice have\
    \ helped the Editor not a little. It may not be out of place also here to record\
    \ the very great boon which the `London Library` has proved itself to be for any\
    \ writer who resides out of town, and at a distance from the `British Museum`,\
    \ when engaged on a work requiring constant references.\n\nThe secretary of the\
    \ `Hakluyt Society` has obligingly revised, suppressed, altered, and added to\
    \ many of the Editor’s original notes throughout the first part. Whilst thanking\
    \ him for his efforts to secure additional correctness by his revision, the Editor\
    \ is reluctantly compelled to dissent from some of the conclusions arrived at\
    \ and published by his coadjutor, especially in those notes on the Banyan, the\
    \ Pandanus, and the Pepper, wherein Mr. Delmar Morgan diners from the opinion\
    \ formed after personal observation by that expert botanist, Professor Bayley\
    \ Balfour. Finally, the revision of the second part by Mr. Clements K. Markham,\
    \ and his timely correction of a very important mis-statement in the first part,\
    \ deserves the hearty recognition and thanks of the Editor. Mr. Wm. Griggs, by\
    \ his admirable `facsimile` reproductions of the original plates, has largely\
    \ contributed to the complete illustration of the text.\n\nS. PASFIELD OLIVER\n\
    MORAY HOUSE, STOKES BAY, GOSPORT.\n16 *May* 1891.\n"
  raw: IN the following story of the remarkable adventures and sufferings endured
    by François Leguat, events are narrated which belong to a period considerably
    later than that of any other travels or voyages treated of in former publications
    undertaken by the Hakluyt Society ; nevertheless, the date of the personal record
    follows somewhat closely upon the time of the latter portion of William Hedges’
    diary,[¹](#B10_fm-chapter.xhtml_fn35_4) to which, indeed, it forms a not altogether
    unfitting sequel, by affording information regarding the system of Dutch administration
    and colonisation in the East Indies, and at the Cape, towards the end of the seventeenth
    century, and by giving a graphic sketch of the circumstances of French Huguenot
    emigration from Europe to South Africa at that epoch. The chief modern scientific
    interest, however, in Leguat’s description undoubtedly hinges upon the circumstantial
    delineation which he gives of the curious bird-fauna then extant in the Mascarene
    Islands, the subsequent destruction of which has rendered the personal observations
    of the philosophic Huguenot invaluable to naturalists, marked as they are by such
    evident simplicity and veracity.It is now the pleasurable duty of the Editor to
    acknowledge and place on record, in the commencement of this volume, the kindness
    and ready assistance which he has met with in every branch of his inquiries from
    numerous literary and scientific friends during its preparation. First and foremost,
    it is to M. James Jackson, the well-known librarian of the Société de Géographie,
    that the Editor owes his acquaintance with the early French editions of the Huguenot
    author. To the researches of M. J. Codine, of the same Society, are due the more
    exact knowledge, which geographers possess, as to the approximate date of discovery
    of the several Mascarene Islands, on which subject most erroneous views had previously
    been entertained. It is regrettable that want of space has compelled the abridgment
    of M. Codine’s admirable reasoning on this subject.[¹](#B10_fm-chapter.xhtml_fn35_5)
    M. Sauzier’s discovery and reproduction of the rare Du Quesne *Mémoire*[²](#B10_fm-chapter.xhtml_fn35_6)
    have contributed largely to the better comprehension of several of Leguat’s allusions,
    although there is yet reason to doubt whether the particular *Memoire* from which
    the quotations were taken has been absolutely identified. Several of M. Eugene
    Muller’s notes have been utilised by permission of the annotator, and the clues
    afforded by the Appendix of the small edition of Leguat’s book, republished by
    the Librarian of the Arsenal at Paris, have been found most suggestive. Naturally,
    the contributions of M. Alph. Milne-Edwards to the *Annales des Sciences Naturelles*[¹](#B10_fm-chapter.xhtml_fn35_7)
    and other periodical scientific journals have been largely used for the elucidation
    of the natural history of Rodriguez ; it would be impossible to illustrate any
    work on the Mascarene Islands without incurring a heavy debt to this celebrated
    naturalist. M. Gabriel Marcel, of the Bibliothèque Nationale, has taken an infinity
    of pains in answering, most minutely and categorically, numerous and somewhat
    pertinacious questions, which have been addressed to him by the Editor on various
    points, bibliographical and geographical, in connection with this publication,
    thereby aiding largely towards its correctness. M. A. Bouquet de la Grye, the
    French Hydrographer, most courteously enabled the Editor to obtain an accurate
    transcript of the Abbé Pingré’s original manuscript journal at Rodriguez, hitherto
    unpublished, which has proved most useful in elucidating certain doubtful points.
    Mr. R. W. Shufeldt, of the Smithsonian Institution (Washington, U.S.), has readily
    permitted the reproduction of his clever restoration of the Giant bird of Mauritius,
    whose existence, however, is still problematical ; and Mr. Van Kampen has been
    good enough to revise whatever passages have been translated from the Dutch of
    Valentyn by Mrs. Salmon. The thanks of the Hakluyt Society are due to all the
    above foreign contributors to their work, as well as the Editor’s personal gratitude
    for their very sympathetic help and encouragement.Having, as in duty bound, first
    of all made his too inadequate acknowledgments of what he owes to his friendly
    helpers across the seas, the Editor must now proceed to offer his no less sincere
    thanks to those of his own countrymen who have communicated so freely to him the
    results of their patient investigations of all branches of science treated of
    in the following notes.Pre-eminent among zoologists and ornithologists, the Professor
    of Zoology at Cambridge (where Strickland and Melville’s collection finds an honoured
    position), and his brother, Sir E. Newton (to whose indefatigable explorations
    the world owes the rehabilitation of Dodo, Solitaire, Aphanapteryx, and their
    congeners), have furnished far more material for notes and explanatory illustration
    of Leguat’s text than the Editor has been able to treat properly or satisfactorily
    within the space at his command. Moreover, the learned Professor and his brother
    have taken much personal trouble to secure for the Editor, not only access to
    the rich store of osteological remains of the Mascarene birds in the museum (which,
    by the way, is constantly acquiring fresh *trouvailles* from the cave earths of
    Rodriguez and Mauritius), but also a photograph[¹](#B10_fm-chapter.xhtml_fn35_8)
    of the skeleton of the bird which has conduced to render Leguat’s name immortal.
    These scientists, so profoundly skilled in the subject of most enticing interest
    in Leguat’s history, have also assisted the Editor by their critical perusal of
    his proof-sheets, so far as they concern their special department.Whilst the avi-fauna
    of the Mascarenes has received such close attention from Professor Alfred Newton
    and Sir Edward Newton, the flora of Rodriguez has been subjected to keen examination
    and classification by Professor Isaac Bayley Balfour, of Edinburgh ; and in the
    report to the Royal Society, which resulted from his visit to the island in connection
    with the Transit Expedition of 1874, the Editor has been able to find all he could
    possibly desire in the task of identifying the plants mentioned with much *naïveté*
    by the Huguenot writer two hundred years ago. Mr. J. G. Baker, F.R.S., and Mr.
    Scott Elliot, of Kew, have also aided the Editor by suggestive advice in the difficult
    and unaccomplished problem of ascertaining the identity of a certain poison-tree
    of Mauritius, mentioned as causing disastrous effects on the old traveller. Professor
    Günther, likewise, has readily given all information asked of him with regard
    to the wonderful tortoises of the same islands ; whilst Professors J. Legge, Sir
    Thomas Wade, and K. Douglas have courteously proffered helpful suggestions as
    to Leguat’s rather confused ideas of the Chinese philosophers.Dr. R. Rost, of
    the India Office, has rendered most important assistance to the Editor by permitting
    him to consult the various books of travel in the Library, which could not easily
    be elsewhere obtained. Indeed, his cordiality and kind advice have helped the
    Editor not a little. It may not be out of place also here to record the very great
    boon which the London Library has proved itself to be for any writer who resides
    out of town, and at a distance from the British Museum, when engaged on a work
    requiring constant references.The secretary of the Hakluyt Society has obligingly
    revised, suppressed, altered, and added to many of the Editor’s original notes
    throughout the first part. Whilst thanking him for his efforts to secure additional
    correctness by his revision, the Editor is reluctantly compelled to dissent from
    some of the conclusions arrived at and published by his coadjutor, especially
    in those notes on the Banyan, the Pandanus, and the Pepper, wherein Mr. Delmar
    Morgan diners from the opinion formed after personal observation by that expert
    botanist, Professor Bayley Balfour.[¹](#B10_fm-chapter.xhtml_fn35_9) Finally,
    the revision of the second part by Mr. Clements K. Markham, and his timely correction
    of a very important mis-statement in the first part, deserves the hearty recognition
    and thanks of the Editor. Mr. Wm. Griggs, by his admirable *facsimile* reproductions
    of the original plates, has largely contributed to the complete illustration of
    the text.S. PASFIELD OLIVER.MORAY HOUSE, STOKES BAY, GOSPORT.16 *May* 1891.
