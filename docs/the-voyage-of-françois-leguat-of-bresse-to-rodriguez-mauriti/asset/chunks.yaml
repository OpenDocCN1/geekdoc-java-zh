    The archipelago of the Canaries is situated near the polar limit of the north-east
    trade winds, the prevailing breeze setting from the north-east to north.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_13))
    “When, for instance, he (Leguat) obtained the first flying-fish, he examined,
    described, represented, and compared them with the representations of other authors,
    discovering at once that there exists among these animals two forms, those now
    called *Dactylopterus* and *Exocatus.* He appends, for this reason, to his drawing
    the copies of three figures of these fish taken from other works, and on that
    of Olearius makes the true observation that it had probably been drawn from a
    dried specimen, and was therefore inaccurate; for he says, ‘*quand ces animaux-la
    viennent á ge sécher, il est difficile d’en observer la véritable forme:”* (Professor
    Schlegel, *Ibis,* 1866, p. 151.)^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_14))
    Sanson Mathurin, after whom, probably, Port Mathurin, in Rodriguez, was named.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_15))
    The Cape Verde islands are a group of fourteen islands, situated about 320 miles
    west of Cape Verde. Sal island is the north-easternmost of the islands; it is
    seventeen miles long, north and south, and about five miles broad, with rocky
    shores and mountains, the most northern of which—Pico Martinez—is 1,340 feet high.
    The only production of this island is salt, which is now brought to the sea-coast
    on tramways. South Bay or Porte Santa Maria, where Leguat landed, is the only
    inhabited settlement on the island.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_16))
