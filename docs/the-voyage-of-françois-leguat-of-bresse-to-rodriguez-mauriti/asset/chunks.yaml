    Two indigenous species of small birds were collected by Sir E. Newton on Rodriguez
    in 1864\. These were described by him as *Fotalia flavicans* and *Drymxca rodericana,*
    and specimens of both were brought home by the naturalists of the Transit of Venus
    Expedition in 1874\. Sir E. Newton identifies Leguat’s small birds with *Foudia
    flavicans,* but notices that they had “ a very pleasant song”, in contradiction
    to his statement that “we never heard them sing”. M. Milne Edwards, however, laying
    more stress on Leguat’s words, is of opinion that his small birds were neither
    *Foudia β avi cans* nor *Drymseca rodericana,* and that these may have been of
    more recent introduction. Leguat’s canaries, he thinks, have shared the fate of
    the solitaries and wood-hens— *i.e.,* become extinct. (Cf. *P. Z. S.,* 1865, p.
    47 ; *Ibis,* 1865, pp. 147 *et seq. ; Phil. Trans., 1\. c,* p. 459 ; *Ann. des
    Sc. nat. Zool.* (5), xix, art. 3, and (6). ii, art. 4.)^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_144))
    M. Milne Edwards has shown, in a memoir published some years ago, that there were
    great parrots at Rodriguez of a species which neither exists there nor in any
    other part of the globe. These were distinct from *Agapornis cana* and *Palseornis
    exsul,* and furnish additional proof of changes having taken place in the fauna
    of that island. See his *Mémoire sur un Psittacus fossile de Vīle de Rodrigue
    (Psittacus roderi-canns)* in *Ann. des Se. nat. Zool.* (5), viii, 145\. The parrots,
    however, referred to in our text were of moderate size, and may probably have
    been *Palseornis exid,* of which a living specimen was seen in the island by Mr.
    Slater in 1874.(Cf. *Phil. Trans. R. S., I.* c, pp. 430 aud 459.)^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_145))
    Purrs, probably a species of sandpiper, or perhaps small plovers, for Leguat could
    not distinguish them.^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_146)) In
    orig. : “ Il y a des alloüettes de mer et des Becassines. Nous n’avons vû que
    très-peu d’hirondelles.”^([3](#C01_chapter_split_000_split_000.xhtml_Rfn8_147))
    Flying-foxes, *Pteropus Edirardsii.* Pingré, who touched at Rodriguez in 1761,
    during his voyage for the observation of the Transit of Venus, gives some interesting
    details on these flying-foxes. Those he saw were the size of a pigeon, but longer
    ; the head like that of a fox ; the skin reddish, darker on the head and neck
    than on the rest of the body ; the wings dark grey ; when extended they may have
    measured a foot or a foot and a half. These animals are still extant at Rodriguez,
    but no materials have hitherto been accessible for their identification. M. Milne
    Edwards is inclined to think they are not *Pteropus Edwardsii,* a much larger
    species inhabiting Madagascar, nor *Pteropus vulgaris* of the island of Mauritius,
    also a larger type. *(Ann. des Sc. nat. Zool.,* 5me série, xix, art. 3.)^([4](#C01_chapter_split_000_split_000.xhtml_Rfn8_148))
    “ Elles demeurent toujours attachées par quelque crochet,” omitted by translator.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_149))
    “ & ne les abandonnent que lors qu’ils peuvent voler,” omitted by translator.^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_150))
    Possibly, Dr. Günther thinks, a species of *Phelsuma,* a genus well represented
    in the Mascarene region. *(Phil. Trans., I. c,* p. 454.)^([3](#C01_chapter_split_000_split_000.xhtml_Rfn8_151))
    The fact of there being lizards at Rodriguez is another proof of its being zoologically
    distinct from Hindustan, for though several kinds of these reptiles are found
    in Ceylon, there are none in the adjacent continent. With reference to the tameness
    of lizards, Sir E. Tennent relates the following anecdote : “ In an officer’s
    quarters, a gecko had been taught to come daily to the dinner-table, and always
    made its appearance along with the dessert. The family were absent for some months
    while the house underwent repairs ; but on the return of its old friends, at their
    first dinner, the little lizard made its entrance as usual as soon as the cloth
    had been removed.” (Sir E. Tennent’s *Ceylon,* i, 186.)^([4](#C01_chapter_split_000_split_000.xhtml_Rfn8_152))
    Probably, according to the authority quoted above (n. 2), the species of which
    Mr. Slater collected, with remains of the solitaire and tortoise, several bones.
    He recognised them as the. remains of a lizard, possibly belonging to the family
    of Skinks. In Dr. Günther’s opinion it is a geckoid lizard, which cannot be separated
    from the genus Gecko. He concurs in the proposal of Mr. Slater to name it, after
    Sir E. Newton, *Gecko Newton it.(Ibid.)*^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_153))
    “ La mer apporte de l’ambre jaune, & de l’ambre gris.” The Arabie term *Amber*
    was first given to the remarkable secretion formed in the intestines of the spermaceti
    whale, and subsequently to the fossilised gum now generally known by that term.
    These two substances, both mysterious products of the sea, were, in the seventeenth
    century, distinguished only by their colour as *ambre gris* and *ambre jaune.*
    Ben Jonson asks—Whilst Milton speaks of game—^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_154))
    A marked feature in the Flora, Professor Balfour states *(pp. cit.,* p. 304),
    is the paucity of *Orchidaceæ.* Only four species have been determined ; a fifth,
    a species of *Angrsecum,* was found, but in too imperfect a state for identification.
    Professor Balfour knows of no plant on the island answering to Leguat’s description,
    and can only suppose it to refer to some species of orchid, which has now passed
    away. A sweet-smelling orchid, *Angrsecum fragrans,* is found in the Mascarene
    Islands.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_155)) These little islets
    are noticeable both in Leguat’s sketch map and the Admiralty charts, facsimiles
    of which have been given for comparison. It will be seen that these islets extend
    from Booby Island (55 feet) on the north, round the west side of the island within
    the reefs to Port South-East, Crab Island being the highest of them (150 feet).
    Their names, Booby, Pierrot, and Frigate, etc., indicate their being the homes
    of land-birds and sea-fowl. It is not easy to identify any particular islet in
    Leguat’s map.^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_156)) Probably
    terns, several species of which breed on the islets round Rodriguez.(Cf. *Phil.
    Trans., I. c.*, pp. 463 *et seq.)*^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_157))
    De RocMort, in speaking of the various inconveniences to be met with in the Antilles,
    says that it was only after ships began frequenting these islands that rats multiplied
    to such an extent as to injure the crops and vegetables ; previously they were
    unknown to the Caraib Indians. *(Histoire Naturelle des lies Antilles,* L. de
    Poincy et C. de Rochfort, 2nd edit., 1865, p. 277.)^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_158))
    The rats were probably of recent introduction. Vessels had touched at the island
    before Leguat’s time on their way to India.^([3](#C01_chapter_split_000_split_000.xhtml_Rfn8_159))
    The owls of Rodriguez are now extinct, but some bones found in one of its caves
    by Sir E. Newton in 1874 attest Leguat’s veracity. These bones belong to two species,
    for one of which M. Alph. Milne Edwards proposes the name of *Strix (Athene) murivora
    ;* of the other only one bone, a tibia, having been produced for examination,
    no specific name could be given. *(Ann. des Sc. nat. Zool.* (5), xix, art. 3.)^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_160))
    The land-crabs described in our text appear to be allied or identical with *Birgus
    latro,* which Darwin observed in the Keeling Islands. He speaks of their burrowing
    habits and of their being provided with “very strong and heavy pincers”, with
    which they crack the cocoa-nuts *(Voyage of the Beagle,* iii, p. 551). Messrs.
    Gulliver and Slater collected 189 specimens of crustáceas at Rodriguez, representing
    thirty-five species. *(Phil. Trans., I. c.,* p. 485.)^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_161))
    “Elles se logent en terre, & creusent, jusqu’à ce qu’elles ayeat trouvé de l’eau,”
    omitted by translator.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_162))
    To bubble, *i.e.,* to cheat, from It. *bubbola,* a hoopoe ; in orig. “ fut la
    dupe”, from the French for the same bird, from some tradition of the habits of
    that bird of which we are ignorant. A familiar instance of the use of the noun
    is the “ South Sea bubble.” Cf. Wedgwood’s *Diet, of Eng. Etymology ;* Nares’
    *Glossary.*^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_163)) In orig. :
    “ dont le cuir étant un peu gras,” ets.^([3](#C01_chapter_split_000_split_000.xhtml_Rfn8_164))
    In orig.: “Il est vrai qu’il eut une permanente rancune contre toute la nation
    des crabes, et que dans la guerre que nous leur faisons souvent, il n’en tua jamais
    aucune,” etc.^([4](#C01_chapter_split_000_split_000.xhtml_Rfn8_165)) “ Et beaucoup
    plus grosses, ... et la chair en est aisée à digerer.”^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_166))
    De Rochfort, in his work on the Antilles (p. 253), mentions three kinds of crabs
    under this name, applying it in particular to the smallest of the three. These
    crabs have a red shell with a black spot on it, are agreeable to the taste, but,
    being small and producing dysentery, are not in much request.^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_167))
    In original : “ ouragan “ (cf. p. 36, *svpra).* Rodriguez lies right in the paths
    of the cyclones which traverse the southern Indian Ocean. There is no positive
    law for their tracks, but, from the averages observed, it seems that they nearly
    all pass from E.N.E. to W.S.W., but, from longitude 80° E. westward and when approaching
    the Mascarene group, they have a tendency to curve southward, frequently backing
    to E.S.E. when they reach the southern tropic.Dr. Meldrum has noticed that when
    the Mascarene Islands suffer from drought the Indian Ocean is almost free from
    hurricanes.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_168)) “Gust”, Lafe.
    *gustus,* relish, taste; cf. Shakespeare, “Allay the *gust* he hath in . . .”
    *Twelfth Night,* ii, 3.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_169))
    All the known species (140) of sharks except four are carnivorous. Those observed
    by Leguat had doubtless ceased to be dangerous to man, owing to the abundance
    of animal food round the island. Forty years later we read a very different account
    of them ; far from being harmless, they were then extremely aggressive and of
    great size. *(Gunther, I. c,* p. 315 ; *Ann. Sc. nat. Zool.* (6), ii, art. 4.)^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_170))
    Sucking-fish, *Echeneis remora.*^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_171))
    Père Guy Tachard. See *Voyage de Siam des Pères Jésuites,* Amsterdam, 1687-9,
    liv. i, p. 41.^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_172)) Our author
    is probably referring to Aristotle and Pliny, who described the Echen eis and
    attributed to this little fish the power of fastening itself to vessels, and so
    arresting their course. Thus, it was alleged, Antony’s ship was delayed getting
    into action at the battle of Actium (cf. Rondelet, *Licre des Poissons,* p. 313).
    Ten different kinds of sucking-fish are known, of which *Echincis remora* and
    *E. naucrates* are the most common. (See Giinther’s *Study of Fishes,* p. 460.)
    An excellent specimen of this remarkable fish may be seen at the South Kensington
    Natural History Museum. Our author confuses the sucking-fish with *Naucrates ductor,*
    the pilot fish, which is said to follow large sharks.^([3](#C01_chapter_split_000_split_000.xhtml_Rfn8_173))
    In orig. : “ quand il est tout sortant de l’eau,” omitted by translator.^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_174))
    Our author is rather too severe in his criticism. Rondelet was Doctor Regent in
    Medicine at the University of Montpellier, and published several important works
    on natural history. He was a good observer, a diligent student, and a skilful
    anatomist. The work by which he is best known is that on fishes, entitled *De
    Piscibus marinis libri* xviii, *in quibus vivæ piscium imagines expositor sunt.*
    Lyon, 1554\. It was translated into French and published in 1558\. This edition
    is illustrated by numerous woodcuts, evidently executed by a skilful artist, and
    drawn with great fidelity to nature. With the exception of a few that Rondelet
    could only have known by hearsay, they may be recognized at the present day. The
    original work is dedicated to Cardinal Tournou, whom the author accompanied on
    his travels in the capacity of physician. Rondelet died in 1566 at the age of
    59\. *(Bio-graphie Universelle.)*^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_175))
    The Acts x, 13 : “ And there came a voice to him, Rise, Peter ; kill, and eat.”^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_176))
    1 Cor. ii, 2 ; St. John xvii, 3 ; Rom. x, 9 ; St. John vi, 47 ; Acts ii, 21 ;
    Rom. x, 13 ; Acts xx, 27 and 21 ; St. James i, 27.^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_177))
    In orig. : “ accomodeurs”. Botchers, *i.e.*, bunglers, probably derived from the
    Mantuan *puccia*, a slop, mess, or puddle. Hence It. *pozza*, a bungling piece
    of work.^([3](#C01_chapter_split_000_split_000.xhtml_Rfn8_178)) In orig. : “ la
    Médiation.”^([1](#C01_chapter_split_000_split_000.xhtml_Rfn8_179)) This paragraph
    seems to indicate an interpolation by Max. Misson. The site of Leguat’s settlement
    was on the north-north-west shore (*ride ante*, p. 50), and was well known in
    1760 as “ *l’enfoncement de François Leguat”*. It is now occupied by the small
    town known as Port Mathurin.^([2](#C01_chapter_split_000_split_000.xhtml_Rfn8_180))
    In orig. : “ le flux, ou reflux perpetuel venant à se rompre contre les Brizans
    qui étoient à une lieüe de là, fasoit un murmure confus.”^([3](#C01_chapter_split_000_split_000.xhtml_Rfn8_181))
    At p. 130 of vol. i of the French edition of Leguat’s voyage, this wonderful tree
    is figured in a way to puzzle botanists were it not for the accompanying descriptive
    text. The title on the plate is as follows : “ Pavilion Arbre, nouvellement découvert.”
    Leguat’s Pavilion has been identified with the screw-pine, growing in abundance
    everywhere on this island from the sea-shore to the highest points. Prof. Balfour
    writes (*Phil. Trans.*, vol. cxlviii, p. 312):” Every visitor to Rodriguez will
    be struck at once by the peculiar features impressed on the landscape by the prevalence
    of screw-pines. They are indeed the physiognomic plants, and far outstrip in numbers
    any other species ; but it is remarkable that, though individually so numerous,
    specifically the family is not rich, there being only two species of Pandanus
    on the island— *P. heterocarpus* and *P. tenuifolius*, both peculiar and very
    distinct from any other of the indigenous Mascarene forms. Three other specimens
    have been registered by various authorities ; they are *P. odoratissimus, P. utilis*,
    and *P. muricatus.”**P. Heterocarpus*, the species to which Leguat’s tree may
    be referred, is very variable, and the popular names indicate this—Vacoa calé
    rouge, V. calé blanc, V. sac, V. poteau, V. parasol, and V. mâle, are all applied
    to it according to its habit of growth, and the various uses to which its leaves
    and branches are put by the creóles. When on sites exposed to the wind it has
    a stunted habit, the branches are few, thick, and short, and the leaves also are
    short and erect. In such situations it is known as the *Vacoa calé*, and the inhabitants
    make a distinction between two varieties according as the head, peduncle, and
    united parts are red or are greenish yellow or yellow. The former they style *rouge*,
    the latter *blanc*. If the tree grows in suitable soil or in a sheltered position
    where it has room to develop its branches properly, then it forms a dense and
    compact dome, and the branches droop downwards so far as almost to conceal the
    stem, and it is then known as *Vacoa parasol*. When in any situation the tree
    develops a trunk of a good size, and is allowed to grow until the wood is hard
    and firm to the centre, and is capable of being used as a post for a house, then
    the tree is called *V. poteau*. The name *V. sac* is given to the young plants
    when the leaves are long and broad, and may be made into bags such as are used
    in Mauritius for sugar. *V. mâle* is of course the male tree, known by the inhabitants
    as not bearing fruit.*V. tenuifolius* (Vacoa chevron) is a much smaller plant,
    with narrow delicate leaves and a few large druped fruits. It is easily distinguished
    from the foregoing, and is confined to the higher parts of the island and the
    upper parts of the valleys.(Balfour, *op. cit.*, p. 379.)In the large palm-house
    in the Kew Gardens there is a fine specimen of *P. odoratissimus*, which has flowered
    and fruited this year (1890). The fruits, two in number, hang from the topmost
    branches, and bear a close resemblance to pine-apples, while the peculiar development
    of the long, straggling branches, stout enough for posts or rafters, surmounted
    by a tuft of leaves growing directly from the wood, and the pendulous roots from
    the main trunk, present a remarkable appearance, and are worth comparing with
    the description in our text.^([1](#C01_chapter_split_000_split_001.xhtml_Rfn8_182))
    *Tric-trac*, a game somewhat like backgammon.^([2](#C01_chapter_split_000_split_001.xhtml_Rfn8_183))
    In orig. : “ Quilles”, *i.e.*, ninepins. A variation of this game, called “quilles
    au bâton”, is played with seven bits of wood set up on end, and a stick ; the
    player tries to knock over as many as he can each throw. This latter may probably
    have been the game played by Leguat and his companions.^([1](#C01_chapter_split_000_split_001.xhtml_Rfn8_184))
    *Vide ante*, p. 83 ; *Phil, Tr., loc. cit.*, p. 429.^([2](#C01_chapter_split_000_split_001.xhtml_Rfn8_185))
    *Vide ante*, p. 55.^([1](#C01_chapter_split_000_split_001.xhtml_Rfn8_186)) The
    trade -wind ; *vide infra*.^([2](#C01_chapter_split_000_split_001.xhtml_Rfn8_187))
    In orig. : “ dans cette petite arche.”^([3](#C01_chapter_split_000_split_001.xhtml_Rfn8_188))
    Rodriguez lies 350 miles to the eastward of Mauritius. (*Vide* Findlay, *op. cit.*,
    p. 512.)^([1](#C01_chapter_split_000_split_001.xhtml_Rfn8_189)) “ Taillée en quarre
    & longue de soixante pieds,” omitted by translator.^([2](#C01_chapter_split_000_split_001.xhtml_Rfn8_190))
    It subsequently transpired that an English ship had been wrecked in this vicinity
    previous to the arrival of Leguat. Captain Valleau heard of this on his reaching
    Mauritius after leaving Leguat, and he returned to search for this wreck, from
    which, evidently, this oak timber had drifted.( *Vide infra*, Part II.)^([3](#C01_chapter_split_000_split_001.xhtml_Rfn8_191))
    “ Dont j’ai parlé,” omitted by translator. Leguat is referring to bitumen, which
    he has mentioned above.Cf. *supra*, p. 87.^([4](#C01_chapter_split_000_split_001.xhtml_Rfn8_192))
    From the Fr. *friser*, to curl. In the orig. the word used is *s’érailler*, to
    fray.^([1](#C01_chapter_split_000_split_001.xhtml_Rfn8_193)) In orig. : “ à force
    de bras et d’epaules.”^([2](#C01_chapter_split_000_split_001.xhtml_Rfn8_194))
    In orig. : “nous finies *boucaner”* From this word comes our word “buccaneer”.^([3](#C01_chapter_split_000_split_001.xhtml_Rfn8_195))
    Maximilian Misson, supposed by some to have written Leguat’s preface, and to have
    translated his Voyage, in his *New Voyage to Italy*, 1637, observes, vol. i, p.
    640, that “ the city of Amalphis boasts of having given birth to Flavio Gioia,
    as being the Inventor of the Compass (in the year 1300), upon which M^r Magnati
    cites the following Verse of Panormita : ‘ Prima dedit Nautis usum Magnetis Amalphis’.”
    But Father Fournier, the author of a learned work on navigation entitled *Hydrographia*,
    shews (p. 399), by the verses which he takes out of the Poet Guyot (“Auteur du
    Roman qu’il intitula *la Bible de Guyot”*), who lived one hundred years before
    Gioia was born (at the end of the twelfth century), that the use of the *Boussole*,
    then called *Marinette*, was known in France at that time :—“ Icelle Estoille
    ne se muetUn Art font qui mentir ne puetPar vertu de la Marinette,Une pierre laide
    & noiretteOù le fer volontiers se ioint,” &c.^([4](#C01_chapter_split_000_split_001.xhtml_Rfn8_196))
    In orig. : “ un petit quadran solaire aimanté,” a sun-dial with a compass to allow
    of adjustment. The one mentioned by Leguat appears to have been a toy pocket-dial.
    Such instruments were much in use in the latter part of the 17th and beginning
    of the 18th century, before clocks and watches took their place. In the collection
    at the S. Kensington Museum there are several of that period ; one in particular,
    of French make, with the hours and names of cities engraved on it, might serve
    to illustrate our text.^([1](#C01_chapter_split_000_split_001.xhtml_Rfn8_197))
    Cf. *supra*, p. 47, and note, *ib*.^([2](#C01_chapter_split_000_split_001.xhtml_Rfn8_198))
    The island of Rodriguez is bound to the north, the south, and the west with chains
    or reefs of rocks, nearly even with the water’s edge, on which are scattered the
    rocky islets mentioned above at page 88\. This bank or wall, as the text says,
    extends a league and a half from the coast, and the north-east side is the least
    dangerous, as the reef recedes sufficiently here to admit of ranging along the
    isle on that side. (Grant’s *History of Mauritius*, p. 310.)Mr. J. Murray, of
    the *Challenger* expedition, has shown that it is not necessary to call in the
    subsidences required by Darwin’s theory (*A Naturalist’s Voyage*, pp. 557 *seqq.)*
    to explain the characteristics of these barrier reefs. He shows that the foundations
    for barrier reef such as those at Rodriguez, have been prepared by the disintegration
    of volcanic islands and by the building up of submarine volcanoes by the deposition
    on their summits of organic sediments ; that barrier reefs have been built up
    by coral plantations from the shore on a foundation of volcanic *debris*, or on
    a talus of coral blocks, coral sediments, and pelagic shells and the lagoon channel
    formed by the solvent action of the sea-water thrown over the reefs at each tide
    and by currents, etc. (See *Structure and Origin of Coral Reefs and Islands*,
    by Mr. John Murray, 1880; *Nature*, vol. xxii, p. 351.)The coral animals by which
    the stony, cellular scaffoldings which coinpose coral reefs (or, as Dioscorides
    designates them, a forest of stony trees, *lithodendra*) surrounding the island
    of Rodriguez, have been built up in thick, wall-like masses, are closely related
    to those of Mauritius, Madagascar, and the Seychelles. Dr. Brüggemann has examined
    and identified 102 specimens collected at Rodriguez by MM. Slater and Gulliver,
    which belong to 49 species : including Alcyoniidee, Mille-poridae, Astrseidse,
    Actiniidse, Madraporidse, Fungidas, etc. (See *Philosophical Transactions, op.
    cit.*, p. 569.)^([1](#C01_chapter_split_000_split_001.xhtml_Rfn8_199)) In orig.
    : “on peut voir cela dans la carte.” The two entrances *are* shown on the map.
    That to the north opposite the settlements is the most convenient for landing,
    while that on the south side is so winding that it requires considerable practice
    to navigate it with safety. (Grant, *op. et loc. cit.)*^([2](#C01_chapter_split_000_split_001.xhtml_Rfn8_200))
    Adanson found trunks of the Baobab on the Magdalena Is. in 1748, with a diameter
    of five and six feet, all bearing the names of Europeans deeply carved on their
    bark. One inscription was of the 15th, another of the 16th century, and the characters
    were about six inches long. (*Voyage au Sénégal*, p. 66.)“Le vingt cinquiesme
    Juin (1638) nous abordasmes l’isle de Diego Rois, . . . Nous y descendismes, et
    y arborâmes les armes de France contre un tronc d’arbre par les mains de Salomon
    Gobert. Nostre navire fut tousiours en mer, n’ayant pû anchre, le fond estant
    trop bas; aussi.tost que les armes du Roy y furent posées, ceux qui auoient eu
    charge de ce faire, retournèrent à nous dans la chaloupe qui les y auoit portez.”
    (*Relation du Voyage de François Cauche*, 1651, p. 7.)^([3](#C01_chapter_split_000_split_001.xhtml_Rfn8_201))
    In orig. : “Flamand.”^([4](#C01_chapter_split_000_split_001.xhtml_Rfn8_202)) Probably
    a *bois d’olice. Vide ante*, p. 52.^([1](#C01_chapter_split_000_split_001.xhtml_Rfn8_203))
    “Boussole” omitted by translator.^([2](#C01_chapter_split_000_split_001.xhtml_Rfn8_204))
    In orig. : “cette espèce de Vent Alizé.” The general system of winds in the Indian
    Ocean, writes Findlay, may be said to be divided into :—1, The region of the N.W.
    anti-trades or passage winds, south of 25° or 30° S. ; 2, The region of the S.E.
    trade winds, between lats. 10° and 25° or 30° S. ; 3, The belt of calms to the
    N. and N.W. of the trades ; 4, The area of the south-*cast* and north-*west* monsoons,
    between the equator and 10° S. ; and 5, The part N. of the equator, where the
    monsoons alternately blow in opposite seasons from northward or southward. Rodriguez,
    in 19° 42’ S., is therefore in the very heart of the S.E. trade winds, the “*espèce
    de Vent Alizé*” noticed by Leguat.The regularity of this wind is only affected
    in some seasons W. of 70° E. (*i.e.*, 7° W. of Rodriguez), and the northern and
    southern limits of this aerial current are extended or contracted according to
    the season of the year. The occasional disturbances caused in the atmosphere by
    cyclones will be noticed hereafter, when they are more particularly noticed by
    Leguat.(See Findlay’s *Indian Ocean Directory*, p. 17 *et seq*.)^([3](#C01_chapter_split_000_split_001.xhtml_Rfn8_205))
    In orig. : “en moins de deux jours & deux nuits.”^([1](#C01_chapter_split_000_split_001.xhtml_Rfn8_206))
    *I.e.*, to haul or drag along. Cf. Dampier’s *Voyages* (1681).^([2](#C01_chapter_split_000_split_001.xhtml_Rfn8_207))
    In orig. : “comme nous voguions avec beaucoup de légèreté.” The idea of lightness
