    \ home 对象访问 `Home` 类中的属性并对其赋值，并将它们的内容打印到屏幕上。\n\n最后，通过代码 `double volume;` 我们定义了一个名为\
    \ `volume` 的 `double` 变量。我们通过乘以 `Home` 对象的 3 个变量为该变量赋值并将其打印到屏幕上。\n\n结果如下：\n> House\
    \ width: 3\n> House Size: 6.0\n> HEIGHT OF THE HOUSE: 7.0\n> The volume of the\
