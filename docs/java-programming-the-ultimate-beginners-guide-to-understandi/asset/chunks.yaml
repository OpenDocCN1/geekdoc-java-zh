    # Integer Literals


    Those who know mathematics know, numbers can be expressed in different number
    systems. In other words, a number is written differently in the system of 2, the
    system of 10 can be written differently in the system of 16, but the value is
    the same. The number systems we need to know are:


    1. Decimal systems

    2. Hexadecimal number systems

    3. Binary number systems


    We use the system of 10 in our daily life. But in digital environments, binary
    and binary based number systems are based. `2^10 = 1024`. If you do not know conversions
    between number systems, you can use the online sites that do this (`HexToDecimal`,
    `DecToBinary`).


    Let us explain why this information is necessary on an application. The Eclipse
    IDE environment for the application is used. The codes are as follows:


