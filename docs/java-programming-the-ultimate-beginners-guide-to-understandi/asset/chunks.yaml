  trans: "\n\n# 什么是 String？\n\n`String` 是一种数据类型，用于通过多个字符的拼接创建并进行文本操作。换句话说，`string`\
    \ 是字符串元素的集合。`String` 类位于 `java.Lang` 库中。这是执行各种类型文本相关操作的类。\n\n## 创建字符串，调用字符串\n\n\
    在这里，你将看到如何创建一个字符串并调用字符串。`string` 类型与应用程序中的其他变量类型没有太大区别。让我们通过一个简单的应用程序来解释。\n\n\
    ### 我们的代码。\n\n```java\npublic class StringSinifi {\n    public static void main\
    \ (String [] args) {\n        // TODO Auto-generated method stub\n        String\
    \ ad = \"Osman\";\n        String surname = \"Thompson\";\n        String message\
    \ = new String (\"Java Lessons - elektroyazilim.org\");\n        System.out.println\
    \ (first name + \"\" + last name);\n        System.out.println (message);\n  \
    \  }\n}\n```\n\n让我们聊聊我们的代码。`String ad = \"Osman\";` 通过代码，我们定义了一个名为 `string` 的变量，值为\
    \ `ism Osman`。然后我们定义了一个 `string` 类型的变量，名为 `last name`。我们使用 `=` 赋值运算符将第一个值赋给第一个和最后一个姓名变量。最后，我们定义的\
    \ `message` 变量是 `string` 类型。然而，我们使用 `new` 关键字和 `String` 构造函数初始化了 `message` 变量，并使用\
    \ `System.out.println()` 方法打印了我们的变量。在这个方法中，我们使用 `+` 运算符在文本表达式中组合字符串。\n\n我们程序的结果如下：\n\
    \n让我们聊聊以下两行代码。\n`String surname = \"Thompson\"; // 字面量`\n`String message = new\
    \ String (\"Java Lessons - elektroyazilim.org\"); // 对象创建`\n\n在我们的第一个代码中（以字面量形式表示），我们使用赋值运算符为字符串变量赋值。虽然我们没有使用\
    \ `new` 关键字，但 `Java 虚拟机 (JVM)` 为我们创建了这个对象。但这里有一点需要注意：如果我们使用赋值运算符创建两个名称不同但内容相同的字符串变量，`JVM`\
    \ 会控制定义字符串的池。当它看到第一个相同值的内容时，它会返回第二个字符串变量的引用，而不是创建一个对象。\n\n![Java 编程教程字符串操作](img/rsrc1GS.jpg)\n\
    \n以下代码将总结这种情况情况：\n`String expression1 = \"String Operations\"; // 创建了名为 expression1\
    \ 的 String 对象`\n`String expression2 = \"String Operations\"; // 创建了指向值为 \"String\
    \ Operations\" 对象的引用`\n\n## String 类方法\n\n在本节中，我们将检查字符串类中常用的字符串方法，这些方法让我们的工作变得更轻松。\n\
    \n### 查找字符串长度 - length () 方法\n\n在 `String` 类中，你可以使用名为 `length()` 的方法找出字符串表达式由多少个字符组成。该方法也将字符串中的空格视为字符。\n\
    \n```java\nString message = new String (\"Java Lessons - elektroyazilim.org\"\
    ); // 对象创建\nSystem.out.println (\"String length (characters):\" + message.length\
    \ ());\n```\n结果如下：\n> String length (characters): 34\n\n要访问 `String` 类中的方法，我们会在输入字符串名称后使用点\
    \ (`.`) 运算符。\n\n### 字符串比较 - Equals () 方法\n\nJava 有一个名为 `equals()` 方法来比较字符串表达式。该方法比较两个字符串表达式，如果相等则返回\
    \ `true`，否则返回 `false`。通常在 Java 中，有一个运算符 `==`，它控制变量 `n` 的相等性。这个运算符检查“引用相等”。因此，我们比较的两个字符串取决于它们是否是同一个对象。而\
    \ `equals()` 方法控制“值相等”。为了这个目的，在关联字符串时，你应该使用 `equals()` 方法。\n\n我们定义了两个字符串变量并在它们中放入了相同的文本值。`equals()`\
    \ 方法的使用如下：\n\n```java\nString message1 = \"Java Lessons\";\nString message2 =\
    \ new String (\"Java Lessons\");\nif (message1.equals (message2)) {\n    System.out.println\
    \ ( \"same\");\n} else {\n    System.out.println ( \"different\");\n}\n```\n结果如下：\n\
    > the same\n\n在 Java 区分大小写（即字母大小写）之前，我们称这种语言。让我们稍微修改一下代码来显示这一点：\n\n```java\nString\
    \ message1 = \"Java Lessons\";\nString message2 = new String (\"JAVA Lessons\"\
    );\nif (message1.equals (message2)) {\n    System.out.println ( \"same\");\n}\
    \ else {\n    System.out.println ( \"different\");\n}\n```\n我们的结果如下：\n> Different\n\
    \n你可以看到，表达式“Java”和“JAVA”是不等的，因为它们的评估结果不同。这种方法是 `equalsIgnoreCase()` 方法。该方法首先将文本转换为小写字母然后进行比较。它的用法如下：\n\
    \n```java\nString message1 = \"Java Lessons\";\nString message2 = new String (\"\
    JAVA Lessons\");\nif (message1.equalsIgnoreCase (message2)) {\n    System.out.println\
    \ ( \"same\");\n} else {\n    System.out.println ( \"different\");\n}\n```\n我们的结果如下：\n\
    > the same\n\n### 将数字转换为字符串 - valueOf () 方法\n\n不使用拼接技术而将数字转换为字符串最直接的方法是：如果你在数字前面放置一个空字符串，数字会自动转换为字符串。尝试一下：\n\
    \n```java\nString message1 = \"Converting Numbers to String\";\nString message2\
    \ = \"\" + 453;\nSystem.out.println (message1 + \"\\n\" + message2);\n```\n结果如下：\n\
    > Converting Numbers to String\n>453\n\n在 Java 中，`valueOf()` 方法将数字转换为字符串。它的用法如下：\n\
    \n```java\nString message1 = \"Converting Numbers to String\";\nString message2\
    \ = String.valueOf (453);\nSystem.out.println (message1 + \"\\n\" + message2);\n\
    ```\n结果与另一个相同。`toString()` 方法也可以使用。让我们看看：\n\n```java\nint a = 3;\nfloat b = 5.2f;\n\
    String s1 = Integer.toString(a); // 转换为字符串\nString s2 = Float.toString(b); //\
    \ float 转换为字符串\nSystem.out.println (s1 + s2);\n```\n结果如下：\n> 35.2\n\n如果 `s1` 和\
    \ `s2` 是数值，`s1 + s2` 将是 `3 + 5.2` 的数值值。然而，由于 `+` 运算符执行的是字符串拼接，“3” + ”5.2” = 35.2\n\
    \n### 将字符串转换为数值 - parse .. 方法\n\n`Integer` 和 `Double` 类可以使用 `parse()` 方法将字符串值转换为数值。让我们看看：\n\
    \n```java\nString message1 = \"6.7\";\nString message2 = \"5\";\ndouble s3 = Double.parseDouble(message1);\n\
    int s4 = Integer.parseInt(message2);\nSystem.out.println (\"s3 value:\" + s3 +\
    \ \"\\ns4 value:\" + s4);\nSystem.out.println (\"The sum of string values: \"\
    \ + s3 + s4);\n```\n结果如下：\n> s3 value: 6.7\n> s4 value: 5\n> The sum of string\
    \ values: 11.7\n\n结果没有异常情况。因为字符串是和，我们组合了数值。现在让我们将这些字符串转换为数值。\n\n```java\nString\
    \ message1 = \"6.7\";\nString message2 = \"5\";\ndouble s3 = Double.parseDouble(message1);\n\
    int s4 = Integer.parseInt(message2);\nSystem.out.println (\"s3 value:\" + s3 +\
    \ \"\\ns4 value:\" + s4);\n// ABNITY\nSystem.out.println (\"Sum of converted value\
    \ s3 + s4 =\" + s3 + s4);\n```\n应用程序的输出如下：\n> s3 value: 6.7\n> s4 value: 5\n>\
    \ Sum of converted value s3 + s4 = 11.7\n\n可以看到，表达式是作为字符串评估的而不是数值。在这种情况下，你必须使用括号\
    \ `(s3 + s4)` 来获得正确的结果。编译器是这样评估程序的：如果不加括号，将从左到右进行，因此将值转换为字符串并拼接它们。考虑到括号在方法中的优先级，首先取出括号然后打印。\n\
    \n### 拼接 () 方法\n\n在 Java 中，我们可以使用 `+` 运算符而不使用任何方法来进行字符串拼接。\n\n```java\nString\
    \ message1 = \"Java Programming Lessons\";\nString message2 = \"- elektroyazilim.org\"\
    ;\nSystem.out.println (message1 + message2);\n```\n结果如下：\n> Java Programming Lessons\
    \ - elektroyazilim.org\n\n我们也可以使用 `concat()` 方法连接两个字符串。让我们创建一个简单的程序来看看如何使用：\n\n\
    ```java\nString message1 = \"Java Programming Lessons\";\nString message2 = \"\
    - electro-software\";\nString endMessage;\nlastMessage = message1.concat (message2);\n\
    System.out.println (\"message1:\" + message1);\nSystem.out.println (\"message2:\"\
    \ + message2);\nSystem.out.println (\"lastMessage:\" + lastMessage);\n```\n首先，我们定义了两个名为\
    \ `message1` 和 `message2` 的变量。然后，使用 `concat()` 方法结合这两个方法并将它们赋值给 `lastMessage`\
    \ 变量。我们在屏幕上打印了它们的值。结果如下：\n> Message1: Java Programming Lessons\n> Message2: -\
    \ electro-software\n> Java Programming Lessons\n\n### 创建子字符串 - substring () 方法\n\
    \n我们将字符串视为字符串。我们可以根据所需的条件分割字符串。为此，我们将使用 `substring()` 方法。`Substring()` 方法的两个区域是：当给定单个参数时，它获取给定数字之后的字符。当给定两个参数时，第一个显示起始索引，第二个显示结束索引。但不包含结束索引。\n\
    \n`substring(int beginindex)`\n`substring(int beginindex, int endindex)`\n\n```java\n\
    String message1 = \"Java Programming Lessons\";\nString message2;\nmessage2 =\
    \ message1.substring (0, 4);\nSystem.out.println (\"Message1 contains:\" + message1);\n\
    System.out.println (\"Message2 contains:\" + message2);\n```\n在以下应用程序中，我们将从第 0\
    \ 个字符开始将 `message1` 字符串赋值给 `message2`，除了第 4 个字符。我们程序的输出如下：\n> Message1 contains:\
    \ Java Programming Lessons\n> Message2 contains: Java\n\n### startsWith () 和 endsWith\
    \ ()\n\n`startsWith(String prefix)` 方法检查字符串表达式是否在开头。如果是则返回 `true`，否则返回 `false`。它的用法如下：\n\
    \n```java\nString message1 = \"Java Lessons\";\nboolean bastaMi = message1.startsWith\
    \ (\"Jav\");\nSystem.out.println (\"Is string in the beginning:\" + bastaMi);\n\
    ```\n当我们检查代码时，`startsWith()` 方法检查 `message1` 字符串开头是否有 \"Jav\"。此过程返回的布尔值赋值给 `bastaMi`\
    \ 并最终打印在屏幕上。结果如下：\n> Is string in the beginning: true\n\n同样，`endsWith(string prefix)`\
    \ 方法检查字符串是否在结尾。返回 `true` 或 `false`。让我们看看：\n\n```java\nString message1 = \"Java\
    \ Lessons\";\nboolean probeMi1 = message1.endsWith(\"Lesson\");\nboolean probeMi2\
    \ = message1.endsWith (\"s\");\nSystem.out.println (\"Is string at the end of:\"\
    \ + probeMi1);\nSystem.out.println (\"Is there s at the end of:\" + probeMi2);\n\
    ```\n在布尔类型中，我们定义了 `probeMi1` 和 `probeMi2`。通过 `endsWith()` 方法，我们检查了 \"Lessons\"\
    \ 和 \"s\" 是否在 `message1` 字符串的结尾。最后我们在屏幕上打印了它们。结果如下：\n> Is string at the end of:\
    \ false\n> Is there s at the end of: true\n\n### 字符串删除 - trim () 方法\n\n`trim()`\
    \ 方法在 Java 中经常使用。字符串用于删除表达式开头和结尾的空格。通过 \"trim\"，我们指的是空字符。`trim()` 方法不碰碰之间的空格。\n\
    \n```java\nString message = \"Java Programming Lessons\";\nSystem.out.println\
    \ (\"Message string initial value:\" + message);\nmessage = message.trim ();\n\
    System.out.println (\"Message string new value:\" + message);\n```\n在我们的代码中，我们首先在屏幕上打印了消息字符串。然后，使用\
    \ `trim()` 方法删除了消息字符串开头和结尾的空格，并重新赋值给同一个变量。我们重新在屏幕上打印了新格式。让我们看看：\n> Message string\
    \ initial value: Java Programming Lessons\n> Message string new value: Java Programming\
    \ Lessons\n\n### 替换 - method (replace)\n\n在 Java 字符串类中，`replace()` 方法可以替换任何字符串或字符。首先，让我们为字符串替换创建一个应用程序：\n\
    \n```java\nString message = \"Java Programming Lessons\";\nString newMessage =\
    \ message.replace (\"Lessons\", \"- electro-software\");\nSystem.out.println (\"\
    Message variable:\" + message);\nSystem.out.println (\"NewMessage variable:\"\
    \ + newMessage);\n```\n我们在消息中定义了两个字符串变量。然后使用 `replace()` 方法将 `message` 变量中的 \"\
    Lessons\" 更改为 \"- electro-software\"。我们将 `replace()` 方法返回的新值赋值给 `newMessage` 字符串并打印出来。\n\
    > Message variable: Java Programming Lessons\n> NewMessage variable: Java Programming\
    \ - electro-software\n\n通过这个应用程序，我们完成了字符串替换。我们也可以使用此方法更改字符。让我们看一个程序：\n\n```java\n\
    String ad = \"osman\";\nString newName = ad.replace ('o', 'O');\nSystem.out.println\
    \ (\"name variable:\" + ad);\nSystem.out.println (\"newName variable:\" + newName);\n\
    ```\n在我们的应用程序中，我们定义了一个名为 \"osman\" 的字符串。然后使用 `replace()` 方法，我们将小写的 'o' 替换为大写的\
    \ 'O'。我们将新值赋值给 `newName` 变量，并在屏幕上打印了变量。结果如下：\n> name: osman\n> newName: Osman\n\
    \n### 字符序列学习 - indexOf () 方法\n\n`indexOf()` 方法是 `String` 类中的方法之一；返回字符串或字符在字符串中的搜索顺序。返回\
    \ `int`。让我们通过应用程序使用该方法。首先，找出字符串中字符的数量。\n\n```java\nString message1 = \"Java Programming\
    \ Lessons\";\n// 'g' 字符搜索\nSystem.out.println (\"'g' is in the string\" + message1.indexOf\
    \ ('g') + \". Is in the string.\");\n```\n在上面的程序中，我们首先打印了字符串中\"g\"字符的位置。\n> 字母\
    \ 'g' 在字符串中排名第 8。当 `indexOf()` 方法接收单个参数时，它只返回所求字符的顺序。当 `indexOf()` 方法接收两个参数时，情况略有不同。现在让我们检查字符在字符串中被多次搜索的情况。在字符串中搜索字符：\n\
    \n```java\n// 如果我们要找的字符有多个\nString message1 = \"Java Programming Lessons\";\n\
    System.out.println (\"The letter 'a' was first found in the string\" + message1.indexOf\
    \ ('a') + \". Ranked\");\n```\n（注意：源文本中存在语法错误 `);`，已注明。）\n\nSystem.out.println\
    \ (\"The letter 'a' was first found in the string\" + message1.indexOf ('a') +\
    \ \". Ranked\");\n\n等等，源文本在 `message1` 处有一个语法错误 `);`，这已经记录。\n\nSystem.out.println\
    \ (\"The letter 'a' was first found in the string\" + message1.indexOf ('a') +\
    \ \". Ranked\");\n\n等等，源文本在 `message1` 处有一个语法错误 `);`。我会保持逻辑。\nSystem.out.println\
    \ (\"The letter 'a' was first found in the string\" + message1.indexOf ('a') +\
    \ \". Ranked\");\n\n```\n``` 处有一个语法错误 `);`。\n```\n\n等等，源文本在 `message1` 处有一个语法错误\
    \ `);`。我会修复括号。\n\n```java\nString message1 = \"Java Programming Lessons\";\nSystem.out.println\
