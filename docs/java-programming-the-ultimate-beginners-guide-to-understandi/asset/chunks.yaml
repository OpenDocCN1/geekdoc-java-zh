    \ homeObject.Height);\n    }\n}\n```\n\n我们在这个项目中使用了 `NetBeans IDE`。我们创建了一个名为 `ObjectsClasses`\
    \ 的项目，并创建了一个名为 `Main` 的类，并在包含一个 `main` 方法。\n\n类名是一个数据类型。类也是一种数据类型，而 `int`、`char`、`double`\
    \ 是数据类型。我们定义了房屋类中的 `double` 类型变量，分别名为 `width`、`height` 和 `height`。这些变量是 `Home`\
    \ 类的属性/变量。\n\n在 `main` 方法中，我们定义了一个类型为房屋的变量 `evObject`。我们实际上创建了 `Home` 类的实例。这通常通过使用\
    \ `new` 关键字来实现。//\n\n```java\n// 实例：类的示例\nHome homeObject; // homeObject 变量\n\
    evObject = new Ev (); // 现在是一个对象了。\n```\n\n一个 Java 程序/项目中可能存在多个包。一个包中可以有多个 `java`\
    \ 类。每个类并不都必须包含一个 `main` 方法。第一个类将有一个 `main` 方法。它不需要出现在所有类中，但必须至少有一个。\n\n你可以通过该类的对象来使用该类中的内容（属性、方法）。例如，我们创建了一个名为\
    \ `Home` 的类，并在 `width`、`height` 和 `height` 中定义了 3 个变量/属性。然后我们创建了一个名为 `evObject`\
    \ 的对象。使用 `evObject`，如果 `Home` 类中存在属性，我们就可以访问方法。在这里我们使用点操作符 (`.`）。当你在输入 `evObject`\
    \ 后输入点时，你会看到与该类相关的属性和方法。\n\n如果你看下面的代码，我们为大部分属性分配了值 6，为高度 属性分配了值 3，为另一个高度 属性分配了值\
    \ 4。然后我们使用 `System.out.println()` 方法打印了这些值。\n\n我们程序的运行如下：\n> House width: 6.0\n\
    > House Size: 3.0\n> HEIGHT OF THE HOUSE: 4.0\n\n# 应用程序 2（双类、单对象）\n\n理解 Java 编程语言中对象和类的概念非常重要。面向对象编程作为面向对象编程是基础。我们继续对应用程序进行细微修改。现在，让我们在同一个包的项目中使用两个不同的类。我们的代码如下：\n\
