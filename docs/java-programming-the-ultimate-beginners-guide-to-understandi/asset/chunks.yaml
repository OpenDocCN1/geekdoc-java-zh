    message = "Java Programming Lessons";System.out.println ("6th character:" + message.charAt
    (5));System.out.println ("13th character:" + message.charAt (12));In the above
    application, we printed the 6th and 13th characters of our message string on the
    screen. For this, we have given the charAt () method a low value of 1 in the order
