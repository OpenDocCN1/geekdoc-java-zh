    WIDTH:\" + buyukEv.en);\n        System.out.println (\"SIZE OF BIG HOUSE:\" +\
    \ bigEv.boy);\n        System.out.println (\"HEIGHT OF THE GREAT HOUSE:\" + buyukHome.HighSight);\n\
