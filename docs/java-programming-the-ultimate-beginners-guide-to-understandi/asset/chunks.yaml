  trans: "\n\n# 类定义\n\n```java\nclass Ev\n{\n}\n```\n\n该语句声明了一个类。`class` 单词是一个关键字。`house`\
    \ 是类的名称。块 `{…}` 是类的主体或类块。Java 语言中的类是一种模板设计。由于它是完全抽象的，因此不占用内存空间。然而，一旦我们使用 `new`\
    \ 关键字创建该类类型的对象，它就会占用内存空间。创建的对象就该类的具体体现。\n\n# 对象引用\n\n```java\nMy home = home;\n\
    ```\n\n该语句告诉编译器一个指向 `Home` 类对象内存地址的引用。该引用的名称为 `home`。在当前状态下，`home` 引用的唯一功能是指向内存中\
    \ `home` 类对象的地址。因此，目前还没有具体的 `House` 实例。由于这个原因，我们可以说 `my home` 引用指向 `null`，这表示空（无内容）。\n\
    \n# 对象创建\n\n```java\nhome = new Home ();\n```\n\n我们创建了 `Home` 类的对象。一个对象的类（对象）意味着创建，属于类的内存（非静态）是指在一个地方为所有项目分配内存。其他值无法写入这些预留位置。只要对象仍留在内存中，这一点就有效。你可能将其理解为租用内存空间。Java\
    \ 为内存中创建的每个类变量分配默认值。默认值取决于数据类型。我们已经在类型转换课程中提到过这些值。\n\n# 类对象使用\n\n```java\nMy home\
    \ = new Home ();\n```\n\n作为单行代码。在我们创建对象 `evim` 后，我们使用点运算符 `.` 来访问 `House` 类的属性和方法。我们已经见过相关的示例了。为了提醒访问类的属性和方法，让我们知道我们已经创建了该类的对象。在面向对象编程中，我们倾向于在不同的类中执行尽可能多的不同任务。这样，我们的程序既易于管理，当类的位置出现时可以在不同的程序中工作。这被称为模块化编程。\n\
    \n# 访问修饰符\n\n如果 Java 代码可以调用一个变量，它就可以访问该变量。同样地，如果 Java 代码可以调用一个方法，它就可以访问该方法。如果类内部的代码可以访问另一个类中的变量和方法，那么该类就可以访问另一个类。包（packages）也是如此。在\
    \ Java 中，我们在定义变量、方法、类或包时，可以指定谁可以访问它们。为了这一点，我们使用访问修饰符关键字。在 Java 中，访问令牌确保了系统的安全性，共有\
    \ 4 种：\n\n- `public`：允许所有类访问。\n- `private`：其他类（包括子类）无法访问。\n- `protected`：子类和同一包中的类可以访问。\n\
    - `<default>`（预定义）：同包内访问。\n\n## 公有\n\n`public` 访问令牌；它可以修饰变量、方法或类。它使被修饰的项目变为 `public`。程序中的每段代码都可以访问它们，即使它们在另一个包中。`public`\
    \ 可以无限制地访问类的变量和方法、它自己的子类以及其他外部类。公有变量和方法也是如此。这就是为什么在应用程序中 `main()` 方法被定义为 `public`。\n\
    \n## 公有类声明\n\n```java\npublic class Home \n{\n// 类主体\n}\n```\n\n## 公有变量声明\n\n\
    ```java\npublic int number;\n```\n\n## 公有方法声明\n\n```java\npublic double topla\
    \ (int a, double b)\n{\n    return a + b;\n}\n```\n\n"
- fmt: "\n# Private\nSometimes we may want to prevent some variables, methods, or\
    \ classes from accessing code from other classes in our program. In such cases,\
    \ we use the `private` access identifier. Private items can only be accessed by\
    \ code in the same class, but not by other classes. Even their own subclasses\
    \ cannot access.\n\n```java\nsuperclass interface method\nprivate class declaration\n\
    private class Home { \n    // Class body \n}\nprivate variable declaration\nprivate\
    \ int number;\nprivate method declaration\ncollect private double (int a, double\
    \ b){\n    return a + b;\n}\n```\nNote: (Note)\n\n# Protected\nIn some cases,\
    \ we may want to prevent subclasses from accessing variables and methods within\
    \ a class, but from accessing other classes within the package or program. For\
    \ such cases, we use the `protected` access identifier. This means that variables\
    \ or methods in the subclass access the protected elements of the superclass as\
    \ public. Because it gives access to subclasses, it plays an important role in\
    \ inheritance.\n\n```java\nprotected class declaration\nprotected class Home {\
    \ \n    // Class Body \n}\nprotected variable declaration\nprotected int number;\n\
    protected method declaration\ncollect protected double (int a, double b){\n  \
    \  return a + b;\n}\n```\n\n# Pre-Defined <Default> Token\nA case where no access\
    \ specifier is placed before a variable, method, or class. If no access token\
    \ is set, the default, `default` token is effective. (friendly access)\n\n###\
    \ package\nnotificationPackages only have default access, no other access token.\
    \ With this access; Each class in the package can access every variable and method\
    \ in the package. But classes in other packages cannot access it.\n\n```java\n\
    package package_name { \n    // package body \n}\n```\n\n### default\nclass declaration\
    \ without access token\nIf no access token is placed in front of the class while\
    \ declaring the class, all classes in the same package can access variables and\
    \ methods within that class.\n```java\nclass Home { \n    // Class body \n}\n\
    ```\nmethod declaration without access token\nIf no access token is placed at\
    \ the beginning of the method in the method declaration; this method can access\
    \ the subclasses of the class itself and other classes in the same package.\n\
    ```java\nadd a double (int a, double b){\n    return a + b;\n}\n```\nvariable\
    \ declaration\nThe access token is not used in the variable declaration; the class\
    \ itself, its subclasses, and other classes in the same package.\n```java\nint\
    \ numbers;\n```\n\nIn this way, we have completed “Java Programming Lessons, Objects\
    \ and Classes.”\n\n## Advantages of Java Programming\nJava is now available for\
    \ a variety of computer systems and has found widespread use. Similarly, Java\
    \ comes with an extensive class library that includes support for (almost) everyday\
    \ programming task. The concept of the virtual machine enables a once-compiled\
    \ program code to run on any platform for which a Java VM is available. Re-compiling\
    \ on the respective target platform (as with `C` / `C++`) is no longer necessary.\
    \ Another advantage is the so-called \"applets.\" These are Java programs that\
    \ can be launched within a web browser, making it very easy to deploy applications\
    \ over the Internet.\n\nA tangible advantage - not only for large projects - is\
    \ the free availability of integrated development environments, especially the\
    \ Eclipse platform. For many programmers, tool support is a crucial criterion\
    \ when choosing a programming language. Here Java is one of the most actively\
    \ supported platforms. Java has become established as the industry standard.\n\
    \n## Disadvantages of Java Programming\nJava programs require a runtime environment\
    \ to run. On many computers, this is not preinstalled and has to be set up separately.\
    \ The same applies to other popular programming languages, such as `.NET` or `Perl`.\
    \ Likewise, the Java applet runtime environments built into popular browsers are\
    \ often outdated. If you want to write Java programs for these browsers, you have\
    \ to restrict yourself to an old language version or install a current runtime\
    \ environment on the browser.\n\nFurthermore, Java is not suitable for developing\
    \ near-system programs such as hardware drivers. This is mainly because Java programs\
    \ on theoretically arbitrary computer architectures and operating systems should\
    \ be able to run unchanged. This abstraction no longer allows direct access to\
    \ specific hardware-related functions. Other languages such as `C` or `C++` are\
    \ more suitable for such tasks.\n\n## Speed of Java programs\nThe prevailing opinion\
    \ on the speed of Java programs is that Java programs are slower than comparable\
    \ `C` or `C++` programs. However, one can not say that in a general way, because\
    \ the speed of Java programs depends on various factors.\n\nThe Virtual Machine\
    \ (`VM`), on which the Java program runs, plays a significant role at first. In\
    \ the early days, Java code was interpreted. This has resulted in performance\
    \ degradation that is virtually eliminated with modern Java VMs. For example,\
    \ SUN's Java VM \"compiles\" Java programs at runtime. The result is a program\
    \ that is barely slower than a comparable one written in `C` or `C++`.\n\nJava\
    \ programs have a fundamental speed disadvantage when \"starting up\", because\
    \ each Java program must first start its own `VM`. In addition, loading the classes\
    \ takes a long time. Recent implementations of the `VM` (2004) overcome the latter\
    \ drawback by allowing classes of several programs to be used simultaneously so\
    \ that after the first Java application has been started, subsequent loading is\
    \ eliminated.\n\nJava programs have another speed penalty in that the field boundaries\
    \ are checked every time the field is accessed. Modern VMs can, however, mostly\
    \ \"optimize away\" the check by placing the area check in front of the loop body\
    \ during loop passes rather than every field access. In this way, about 80 percent\
    \ of the otherwise required range checks can be eliminated.\n\nAnother disadvantage\
    \ of Java code is that many methods (more precisely: non-final instance methods)\
    \ are virtual at first. Again, however, compilers can perform optimizations; and\
    \ because Java's runtime environment is optimized for running virtual methods,\
    \ virtual method calls in Java are significantly faster than most `C++` compilers.\n\
    \nLast but not least, the library also plays a role.\n\nConclusion\nIn this way,\
    \ we have completed “Java Programming Lessons, Objects and Classes.”\n"
  raw: 'PrivateSometimes we may want to prevent some variables, methods, or classes
    from accessing code from other classes in our program. In such cases, we use the private
    access identifier. Private items can only be accessed by code in the same class,
    but not by other classes. Even their own subclasses cannot access.superclass interface
    methodprivate class declarationprivate class Home {// Class body}private variable
    declarationprivate int number;private method declarationcollect private double
    (int a, double b){​ return a + b;}ProtectedIn some cases, we may want to prevent
    subclasses from accessing variables and methods within a class, but from accessing
    other classes within the package or program. For such cases, we use the protected
    access identifier.This means that variables or methods in the subclass access
    the protected elements of the superclass as public. Because it gives access to
    subclasses, it plays an important role in inheritance.protected class declarationprotected
    class Home {// Class Body}protected variable declarationprotected int number;protected
    method declarationcollect protected double (int a, double b){​ return a + b;}Pre-Defined
    <Default> TokenA case where no access specifier is placed before a variable, method,
    or class. If no access token is set, the default, default token is effective. (friendly
    access)package notificationPackages only have default access, no other access
    token. With this access; Each class in the package can access every variable and
    method in the package. But classes in other packages cannot access it.package
    package_name {// package body}default class declaration without access tokenIf
    no access token is placed in front of the class while declaring the class, all
    classes in the same package can access variables and methods within that class.class
    Home {// Class body}default method declaration without access tokenIf no access
    token is placed at the beginning of the method in the method declaration; this
    method can access the subclasses of the class itself and other classes in the
    same package. add a double (int a, double b){return a + b;}default variable declarationThe
    access token is not used in the variable declaration; the class itself, its subclasses,
    and other classes in the same package.int numbers;In this way, we have completed “ Java
    Programming Lessons, Objects and Classes.”Advantages of Java ProgrammingJava is
    now available for a variety of computer systems and has found widespread use. Similarly,
    Java comes with an extensive class library that includes support for (almost)
    everyday programming task. The concept of the virtual machine enables a once-compiled
    program code to run on any platform for which a Java VM is available. Re-compiling
    on the respective target platform (as with C / C ++) is no longer necessary. Another
    advantage is the so-called "applets." These are Java programs that can be launched
    within a web browser, making it very easy to deploy applications over the Internet.A
    tangible advantage - not only for large projects - is the free availability of
    integrated development environments, especially the Eclipse platform. For many
    programmers, tool support is a crucial criterion when choosing a programming language. Here
    Java is one of the most actively supported platforms.Java has become established
    as the industry standard.Disadvantages of Java ProgrammingJava programs require
    a runtime environment to run. On many computers, this is not preinstalled and
    has to be set up separately. The same applies to other popular programming languages,
    such as .NET or Perl. Likewise, the Java applet runtime environments built into
    popular browsers are often outdated. If you want to write Java programs for these
    browsers, you have to restrict yourself to an old language version or install
    a current runtime environment on the browser.Furthermore, Java is not suitable
    for developing near-system programs such as hardware drivers. This is mainly because
    Java programs on theoretically arbitrary computer architectures and operating
    systems should be able to run unchanged. This abstraction no longer allows direct
    access to specific hardware-related functions. Other languages ​​ such as C or
    C ++ are more suitable for such tasks.Speed ​ ​ of Java programs The prevailing
    opinion on the speed of Java programs is that Java programs are slower than comparable
    C or C ++ programs. However, one can not say that in a general way, because the
    speed of Java programs depends on various factors.The Virtual Machine (VM), on
    which the Java program runs, plays a significant role at first. In the early days,
    Java code was interpreted. This has resulted in performance degradation that is
    virtually eliminated with modern Java VMs. For example, SUN''s Java VM "compiles"
    Java programs at runtime. The result is a program that is barely slower than a
    comparable one written in C or C ++.Java programs have a fundamental speed disadvantage
    when "starting up", because each Java program must first start its own VM. In
    addition, loading the classes takes a long time. Recent implementations of the
    VM (2004) overcome the latter drawback by allowing classes of several programs
    to be used simultaneously so that after the first Java application has been started,
    subsequent loading is eliminated.Java programs have another speed penalty in that
    the field boundaries are checked every time the field is accessed. Modern VMs
    can, however, mostly "optimize away" the check by placing the area check in front
    of the loop body during loop passes rather than every field access. In this way,
    about 80 percent of the otherwise required range checks can be eliminated.Another
    disadvantage of Java code is that many methods (more precisely: non-final instance
    methods) are virtual at first. Again, however, compilers can perform optimizations; and
    because Java''s runtime environment is optimized for running virtual methods,
    virtual method calls in Java are significantly faster than most C ++ compilers.Last
    but not least, the library also plays a role. The SUN-favored swing library, which
    is primarily responsible for graphics output, has no reputation for being particularly
    fast.But there are also conditions under which Java programs have speed advantages over
    C or C ++ programs. For example, Java''s object creation speed is very high. So
    when it comes to generating many objects in a short amount of time, Java programs
    can be beneficial in practice. Java also has fewer aliasing issues than C or C
    ++. Aliasing means that memory areas overlap formally different objects. Since
    there are fewer aliasing problems in Java, Java programs can be profitably used
    in numerical tasks. Whether your own Java program is faster or slower in practice
    than one written in C ++ depends on many other factors. As already indicated,
    Java programs can run on fast and slow VMs. And if you compare the speed with
    C ++, of course, the implementation of the underlying C ++ compiler also plays
    a role.In any case, the practical speed difference is not significant in most
    cases today.Any Java program can be made infinitely slow if you only programmed
    infinitely wrong. So the main factor is you.ConclusionWith JAVA, you''re learning
    one of the most common programming languages ​​ used on planet Earth.One of the
    big goals in developing JAVA was to develop a programming language that could
    be used to build platform-independent programs. A program should, therefore, be
    created once and run on all systems such as Windows, Linux, and iOS.Of course,
    this is only possible if neither special hardware nor special operating system
    functions are accessed.In practice, however, one has to relativize the platform
    independence. For example, you can hardly build an app for your I-Phone under
    Java. For this, you should use the programming language SWIFT.This is a breeze
    for you, once you master JAVA and for Android devices, Java is the top dog anyway.If
    you are eager to learn in the development of application software, then you are
    damn right with JAVA, because Java is almost 100% object-oriented.And since you''re
    serious, you should definitely choose a programming language that will teach you
    the concept of object-oriented programming.Set goals!Make sure that you do not
    learn the thing for its own sake, because then you will lose the desire very quickly. Formulate
    goals like "I programmed my own app in a year!"After you have learned the basics,
    you should check out everything you learn to see if it will bring you nearer to
    your goal.If your goal is to develop a computer game, then it makes no sense that
    you are dealing with SQL database queries. And not even if it is a chapter in
    a video course that you have bought for a lot of money.Tell your friends about
    your project. This puts you under pressure and helps you not to lose motivation.Also
    regularly participate in social media discussions and share your progress.Divide
    the big goal in well-proportioned and above all, easily accessible partial goals. As:In
    a month, I can deal with objects.In two months, I know what abstract classes and
    methods are.In three months, I can create a graphical user interface.And so on!That
    also gives you regular motivational boosts.Where can I get help?If you get stuck,
    you''ll find help quickly.That''s another big advantage of JAVA. The programming
    language has been around for 20 years, and during this time, a huge community
    has emerged.Just when you start learning JAVA, you probably will not have a question
    under your nails that have not yet been answered somewhere.It''s recommended you
    visit the forums Coding-Board and Java-Forum regularly .If you are searching for more
    information about a particular JAVA package or JAVA class, then you should definitely
    give the official JAVA API documentation a chance.I hope I could give you a red
    thread in this guide, as you can proceed with your project "Java Programming Learn."Congratulations
    on your decision to learn JAVA programming!You certainly will not regret it.'
