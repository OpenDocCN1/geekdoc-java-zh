    # 32-bit Oracle Java installation instructions on Linux Ubuntu 32-bit


    - `cd /home/"your username"/Downloads`

    - `sudo -s cp -r jdk-7u17-linux-i586.tar.gz /usr/local/java`

    - `sudo -s cp -r jre-7u17-linux-i586.tar.gz /usr/local/java`

    - `cd /usr/local/java`


    # 64-bit Oracle Java installation instructions on Linux 64-bit Ubuntu


    - `cd /home/"your username"/Downloads`

    - `sudo -s cp -r jdk-7u17-linux-x64.tar.gz /usr/local/java`

    - `sudo -s cp -r jre-7u17-linux-x64.tar.gz /usr/local/java`

    - `cd /usr/local/java`


    ## 6. Unpack the Java compressed binaries, in the `/usr/local/java` directory


    ### 32-bit Oracle Java installation instructions on Linux Ubuntu 32-bit

    - `sudo -s tar xvzf jdk-7u17-linux-i586.tar.gz`

    - `sudo -s tar xvzf jre-7u17-linux-i586.tar.gz`


    ### 64-bit Oracle Java installation instructions on Linux 64-bit Ubuntu

    - `sudo -s tar xvzf jdk-7u17-linux-x64.tar.gz`

    - `sudo -s tar xvzf jre-7u17-linux-x64.tar.gz`


    ## 7. Check your directories


    At this point, you must have two unzipped binary directories in `/usr/local/java`
    for the Java JDK / JRE listed as:


    - `ls -ajdk1.7.0_17jre1.7.0_17`


    ## 8. Update your environment variables


    Edit the system file `/etc/profile`, which is one of the main query files in the
    `PATH` environment variable. Adding the following variables to your system directory/system
    path list. You can use the `nano`, `gedit` or any other editor, with the root
    account open the file `/etc/profile`.


    - `sudo gedit /etc/profile`

    - or `sudo nano /etc/profile`


    ## 9. Place yourself at the end of the file


    Using the arrow keys, add the lines to the end of the `/etc/profile` file:


    ```bash

    export JAVA_HOME

    export JRE_HOME

    export PATH

    ```


    ## 10. Save the file


    Save the `/etc/profile` file and jump.


    ## 11. Inform your system


    Inform your Linux Ubuntu system where your Oracle Java JDK / JRE is located. This
    will inform the system that the new version of Oracle Java is available for use.


    ## 12. Set default Java


    In addition to all this, it is necessary to inform the operating system that this
    Oracle Java JDK / JRE must be the default Java, that is, the default.


    - With this command you select the global `java` environment variable for the
    executable.

    - With this command you select the global `javac` environment variable for the
    compiler.

    - With this command you select the global `javaws` environment variable for Java
    Web Start.


    ## 13. Reload system variables


    Reload your `PATH` global system variable defined in the `/etc/profile` file,
    by typing this command:


    ```bash

    . /etc/profile

    ```

    Note that when you initialize the system again, `PATH` will be updated.


    ## 14. Test the installation


    Test if Oracle Java was correctly installed on your system. Run the following
    commands and look at the Java version:


    ## 15. For a successful 32-bit Oracle Java installation


    - `java -version`

    This command will show you the running Java version. You will receive a message
    like this:

    ```

    java version "1.7.0_17"

    ```

    This command will show you the version of the Java compiler, in addition to confirming
    that it is now available to compile Java programs from your terminal. You will
    receive a message like this:

    ```

    javac 1.7.0_17

    ```


    ## 16. For a successful 64-bit Oracle Java installation


    - `java -version`

    This command will show you the running Java version. You will receive a message
    like this:

    ```

    java version "1.7.0_17"

    Java (TM) SE Runtime Environment using (build 1.7.0_17-b21)

    Java HotSpot (TM) 64-Bit Server VM ensure (build 23.6-b04, mixed mode)

    ```

    - `javac -version`

    This command will show you the version of the Java compiler, in addition to confirming
    that it is now available to compile Java programs from your terminal. You will
    receive a message like this:

    ```

    javac 1.7.0_17

    ```


    ## 17. Congratulations!


    You have fully installed Oracle Java on your Linux system. Now reboot your Linux
    Ubuntu system. Then, your system will be fully configured to run and develop Java
    programs. Later you might want to compile and run your own Java programs.

    '
