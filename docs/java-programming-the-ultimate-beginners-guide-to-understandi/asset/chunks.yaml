    # 为什么选择 JAVA


    Java 是目前及土耳其全球范围内标准且广泛使用的语言之一。今天，它或多少应用于每一个行业。它是职业发展或学习时最受推荐的语言之一。


    语法方面；它与 `C`、`C#`、`C++` 非常相似。因此，熟悉 `Java` 的人可以很容易切换到这些语言。它是平台无关的（平台独立）。因此，它采用了“一次编写，随运行”（`WORA`）的哲学。所以，用
    `JAVA` 编写的程序可以在 `LINUX` 中编写并在 `Windows`或其他操作系统上运行。


    其平台无关的结构使其能够运行从微型嵌入式系统到高度先进系统的任何地方（今天，`java` 已运行在 30 亿设备上）。使用 `JAVA` 可以编写广泛的银行应用程序、工业应用程序（如高级程序）、小型机器人应用、智能家居以及自动驾驶汽车实践。此外，`JAVA`
    还可以运行在卫星、时钟或手机上。


    ![Java Used Machines Devices Where Java is Used](img/rsrc4P.jpg)


    # Java 语言的特性


    Java 能够如此易于使用的核心特性之一是它是开源的。所有必要的 `Java` 的 `IDE` 和其他工具都是免费的。因为在任何环境中编写的 `Java`
    代码都可以在每个平台上运行，它已经超越了许多编程语言。得益于面向对象且灵活的结构，它已成为企业项目中不可或缺的。


    如果我们简要列出 Java 语言的特性：


    * 面向对象

    * 简单

    * 安全

    * 健壮（强大）

    * 架构中立

    * 平台无关（平台独立）

    * 多线程

    * 解释型

    * 可移植

    * 分布式

    * 动态

    * 高性能


