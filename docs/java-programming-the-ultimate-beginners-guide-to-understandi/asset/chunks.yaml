    \ 运行我们的应用程序。应用程序启动时，会出现一个警告屏幕。该屏幕询问我们可以把项目放在哪里？我们可以不更改任何设置，指定路径并点击 `Launch`（启动）打开应用程序，或者指定我们的路径而不是\
