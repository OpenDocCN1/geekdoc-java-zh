    # Those who know a little programming can quickly sense what these expressions
    mean. Those who do not understand the explanations now should not be upset because
    these idioms are simply the essence of java. Their true meaning can only be fully
    understood after reading the entire book.


    Java is simple. The developers of Java aimed to make the source program easy to
    write, easy to compile, and easy to debug. The main reason that Java is much simpler
    than C++ is that it automatically allocates memory and destroys finished objects
    from memory (garbage collection).


    Java is an object-oriented programming language. It has all the advantages of
    the object-oriented programming paradigm. It provides the programmer with essential
    capabilities such as inheritance, polymorphism, modular programming, debugging,
    and code reuse.


    Java is a distributed system. It enables multiple computers on a network to work
    together as an integrated system.


    Java is multithreaded. Multi-tasking means that the computer can handle multiple
    jobs at the same time. Multithreaded is built into the core of the java language
    by calling system-related procedures in other languages. Multithreaded capability
    is especially important in visual programming and network programming.


    Java is platform-independent. Java programs are compiled once for `JVM`, not for
    separate platforms. The `JVM` interprets the resulting java bytecode at the end
    of the compilation. Bytecode can run on all machines with `JVM` installed. The
    `JVM` virtual machine can be quickly and free installed on every machine. Therefore,
    java programs are written once and run everywhere.


    Java is portable. Because it is independent of the operating system and hardware,
    Java Bytecode is easily migrated from one computer system to another. The ability
    of the same java program to work smoothly on different systems has opened wide
    horizons in the field of programming.


    Java is robust. It determines errors that other languages ​​ can only detect at
    run time, at java compile time — powerful debugging capability.


    Java is safe. The Java language, compiler, and interpreter are designed with security
    priority. It is the first language that emphasizes safety in its design.


    Java Network is friendly. In Java, writing a network program is as easy as sending
    and receiving data.


    ## Major Application Development Tools of Java Language


    As a general-purpose, high-level language, Java is a powerful software development
    tool. Some applications made in Java are as follows:


    ### Software Development Tools

    The tools required to compile, run, debug, and document the application program
    are included in `JSDK`. In the Windows operating system, we will use the `javac.exe`
    compiler in `JSDK` to compile java source programs, the `java.exe` program to
    run java applications, and the `javadoc.exe` interpreter to prepare documents.
    For other operating systems, these programs have their counterparts.


    ### Application Programs Interface

    [`API - Application Programming Interface]`: One of the essential features of
    Java. This library, called the `Java API`, includes classes, interfaces, and methods
    for advanced topics such as network, security, XML, access to databases, starting
    with simple classes that need a programmer. At the time of writing, the library
    is located at `http://download.oracle.com/javase/6/docs/api/`.


    `JSEDK [Java Standard Environment Development Kit 6]` is located in. Version 6
    of `JSDK` is the last of these sales. Over time, new versions of `JSDK`, and therefore
    `API`, emerge. When writing new applications, it is preferable to use the latest
    version.


    ### User Interface Tools

    It has advanced tools, such as Java language, `Swing` and `Java 2D`, to prepare
    GUI graphical user interfaces.


    ### Integrated Libraries

    `Java IDL API`, `JDBC TM API`, `Java Naming and Directory Interface TM ("JNDI")
    API`, `Java RMI (Java Remote Method Invocation over Internet)`, `Inter-ORB Protocol
    Technology (Java RMI-IIOP Technology)` provides access to remote objects.


    ## Major Applications of Java Language


    * **Class Libraries**: Creates library classes to be used in other applications.

    * **Console Applications**: Creates visual Java applications for the line command
    interface.

    * **Web Applications**: Creates visual Java applications for the web user interface.

    * **XML Applications**: `XML` creates Web services. Creates application programs
    to manage Database Applications.

    * **Mobile Web Applications**: Creates application programs for portable devices
    such as PDAs, mobile phones.

    * **Game Programs**: Developed game programs are written with java.


    ## What does Java provide you with?


    Since Java is a language that works in almost every aspect of the computer, java
    programmers have a superior privilege all over the world. They can easily find
    high paid jobs. If you are a beginner in programming, java will offer you the
    following advantages in this course:


    * Since Java is a simple language, and you will learn it in a shorter time than
    other languages.

    * Java programs are, for example, about a quarter of the same C++ source programs
    that do the same work. In this case, you will save time and effort by writing
    less code.

    * You will write code more efficiently. The `Java API` will give you almost every
    class and method you need. You can use these classes and methods if you want,
    and you can derive subclasses from them. By doing this, you will prevent errors
    in your source program. Of course, if you need it, you will always be able to
    write new classes and new methods.

    * You can write Java applications once and run them anywhere.

    * The applications you write do not use library other than Java API, so you can
    spread them quickly.


    ## Stages of Programming


    Regardless of the language used, the programming action consists of the following
    phases:


    1. **Writing source program**: It is written as text in any programming language.
    The source program must follow the syntax of the language.

    2. **Compilation**: The source program converts intermediate language that the
    computer understands. The intermediate language depends on the language used.
    For example, obj codes in C language, bytecode in java, `IL` in C, etc.

    3. **Interlingual codes are converted to executable language**: In order for the
    program to be executable (executable, interpretable), the computer system must
    be converted to the language it understands (machine language). `JVM` interprets
    the bytecode generated by the Java compiler. In this context is useful to explain
    one more issue. In contemporary programming, everything is done in a program.
    There are several program items created beforehand that are ready to used. These
    are like the library of the language used. The programmer can take what he wants
    from the library and place it in his program. Although the merge method is different,
    it is possible in every language. Java has an extensive library. We will learn
    how to use it in future chapters.


    ## FAQ: What is Java Automatic Update?


    ### How do I change notification settings?

    This section applies to: Windows 10, Windows 8, Windows 7, Vista, Windows XP Java
    versions 7.0, 8.0. Mac X users: For more information, see How to update Java on
    Mac.


    ### How does automatic update work?

    Java Update is a feature that lets you keep your computer up to date with the
    latest Java versions. When you enable automatic updating, your system periodically
    checks for a new version of Java. When the new version is found, you will be prompted
    to upgrade the installed Java version. You can schedule the frequency of checking
    for updates or use manual option at any time.


    ### How do I change how often Java versions are notified?

    Adjust the update schedule through the Advanced settings on the Update tab. In
    general, you will be notified within one week after the update is released.


    ### Why shouldn''t I disable notifications?

    By enabling your system to look for the latest version, you keep your system secure.
    It''s strongly recommend that you do not disable the update feature. Instead,
    change how often new versions are notified to you. According to the default setting,
    notification is made once a week.


    ### How do I configure my system to download new versions of Java automatically?

    Use the Notify Me option on the Update tab in the Java Control Panel.


    ### How do I install the update?

    When you are notified of a new version, click the notification message to start
    the update process.


    ### Why should I allow Java Auto Updater to run?

    The Java Automatic Update program (known as `jucheck.exe` in earlier versions
    of Java) runs as a Windows process that checks and performs the updates described
    in this FAQ.


    ### Installed as part of the installation

    It does not automatically install Java. Gives you the option to install the latest
    Java version. This process reminds you that a newer secure version is available
    for your system until the update is complete. To use the latest secure version
    of Java, you must keep this process running.


    ### Why do I receive notifications every time I restart my computer?

    When you restart your system in Windows Vista, and later, the Windows process
    `jucheck.exe` (also known as) starts and tries to check for the latest version
    of Java. Windows User Account Control (UAC) asks if you allow this process to
    run.


    ### Why can''t I change the Update settings?

    If you are not log as an administrator, or if your network administrator has disabled
    this feature during installation, making changes to the Update tab may not be
    enabled.


    ### Why is the Update tab not available in the Java Control Panel?

    Java Automatic Update is not available for 64-bit versions of Java before Java
    8. In pre-Java 8 versions, there is no Update tab in the Java Control Panel. As
    of Java 8 Update 20, the Update tab in the Java Control Panel allows users to
    automatically update 64-bit JREs (as well as 32-bit versions) installed on their
    systems.


    ### Why aren''t my update settings saved?

    For more information and solutions, see Java update settings are not saved in
    the Java control panel.


    ### Are previous versions uninstalled when updating from Java 6 to Java 7?

    Yes, upgrading to Java 7 through AutoUpdate or the Java Control Panel removes
    the highest installed version of Java 6. End of General Updates for Java 6 reached.
    There will be no new secure update for Java 6. For added security, it is recommended
    that you uninstall Java 6 from your computer.


    ## Java Update Options


    Adjust the Java update settings through the Java Control Panel.


    ### Change Automatic Update Settings

    Locate and then launch the Java Control Panel. Click the Update tab and access
    the settings. To enable Java Update to check for updates automatically, select
    the Automatically Check for Updates checkbox. To disable Java Update, clear the
    Automatically Check for Updates checkbox.


    ### Change Update Schedule

    You can change the update frequency: daily, weekly, or monthly (default). On the
    Update tab in the Java control panel, click Advanced. The Automatic Update Advanced
    Settings dialog box appears. Adjust the frequency, date, and time of the Java
    update. Click OK. The Java Update timer checks for new Java updates at the scheduled
    frequency and notifies you. For daily updates, you can select the update time
    during the day. For weekly updates, you can choose the day and time to update.
    For monthly updates, you can choose the day and time to update. Monthly updates
    are checked weekly and will notify you within 30 days of an update, but if an
    update is critical, you will receive notification within one week after it is
    released.


    ### Change Notification Options

    There are two notification options.


    ### Manual Update

    Before downloading, use the manual option.

