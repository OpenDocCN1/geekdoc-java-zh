    in the web browsers, ensure you must make a symbolic link in your browser''s plug-in
    directory to the address of the Java plug-in included in the Oracle Java distribution.Important
    Note: In the Oracle Java 7 plug-in, many security flaws have been detected, and
    you could put your system at risk. To see more information about this consult
    the following web site: Java TesterGoogle ChromeInstructions for Oracle Java 32-bit:Give
    the following commands.Type / Copy / Paste: sudo -sWith this command you enable
    yourself as the super root user![](rsrcW2.jpg)with this command you create the
    directory / opt / google / chrome / plugins![](rsrcW7.jpg)With this command you
    move to the newly created directory. Make sure you are there before you make the
    symbolic league.![](rsrcWC.jpg)with this command you create the symbolic link
    to the Java JRE plug-in (Java Runtime Environment) libnpjp2\. Then to your Google
    Chrome web browser.Instructions for Oracle Java 64-bit:Give the following commands.Type
    / Copy / Paste: sudo -sWith this command you enable yourself as the super root
    user![](rsrcWN.jpg)With this command you move to the newly created directory.
    Make sure you are there before you make the symbolic league.![](rsrcWU.jpg)with
    this command you create the symbolic link to the Java JRE plug-in (Java Runtime
    Environment) libnpjp2.so to the Google Chrome web browserNotices:Note: Sometimes
    when you execute the above command you may receive an error message:![](rsrcX1.jpg)To
    correct this simple problem, you must remove the previous symbolic link with the
    following commands:![](rsrcX6.jpg)Repeat the command for the creation of the symbolic
    league.Restart browser and go to Java Tester to test if Java is working correctly.Mozilla
    FirefoxInstructions for Oracle Java 32-bit:Give the following commands.![](rsrcXM.jpg)this
    command creates the symbolic link to the Java JRE plug-in (Java Runtime Environment)
    libnpjp2.so to your Mozilla Firefox network browserInstructions for Oracle Java
    64-bit:Give the following commands.![](rsrcXU.jpg)this command creates the symbolic
    link to the Java JRE plug-in (Java Runtime Environment) libnpjp2.so to your Mozilla
    Firefox network browserNotices:Note: Sometimes when you execute the above command
    you may receive an error message:ln: creating symbolic league `./libnpjp2.so '':
    Existing fileTo correct this simple problem, you must remove the previous symbolic
    link with the following commands:![](rsrcY2.jpg)Repeat the command for the creation
    of the symbolic league.Restart browser and go to Java Tester to test if Java is
    working correctly.TipsIn Linux Ubuntu, you can choose whether or not to use OpenJDK,
    which is a free and open implementation of JAVA or use Oracle Java JDK and JRE.
    Some prefer to use Oracle Java (because it is the most up-to-date version of Java
    and is directly supported by Java technology), but it varies.Note that Oracle
    makes updates to security, execution failures, and performance issues in each
    new revision of Oracle Java. When you install Oracle Java on your system, be careful
    of version changes. See How to update Oracle Java on Linux Ubuntu for more information.Please
    note that this document is continually being reviewed because eventually, Oracle
    changes the installation method for the JDK / JRE Java binaries.Installing Oracle
    Java JRE on Ubuntu LinuxThis section will help you install Oracle Java 7 version
    1.7.0_40 (32-bit or 64-bit) JRE on 32-bit and 64-bit Ubuntu operating systems.
    These instructions also work on Debian and Linux Mint. This part is designed for
    those who just want to install Oracle Java JRE on their Debian-based Linux systems,
    such as Debian, Ubuntu or Linux Mint. Using this method you can only run Java
    programs and you cannot develop and program in Java. This article was created
    because many users wanted to learn how to install Oracle Java JRE on their Ubuntu
    systems. And the, this section is included on how to enable Oracle Java JRE in
    your browsers using this method. These instructions will work perfectly on Debian,
    Ubuntu and Linux Mint.


    1.  Check what Ubuntu Linux architecture you have, 32-bit or 64-bit. Open the
    terminal and then execute the following command.


    Type / Copy / Paste: file / sbin / initNote the architecture version of your Ubuntu
    Linux operating system. You can tell if it is 32-bit or 64-bit.


    2.  Check if you have Java installed on your system. To do this, execute the command
    to determine the Java version from the terminal.


    Open the terminal and enter the following command:![](rsrcYR.jpg)If you OpenJDK
    installed on your system, you have the wrong version of Java installed on your
    system for this procedure.


    3.  Remove OpenJDK / JRE completely from your system and create a directory to
    store your Oracle Java JRE binaries. This will prevent conflicts between the Java
    versions. For example, if you have OpenJDK / JRE installed on your system, you
    can remove it by typing the following command:


    ![](rsrcYY.jpg)


    4.  Download Oracle Java JRE for Linux . Be sure to select the correct binaries
    for your system architecture, 32-bit or 64-bit (which end in "tar.gz").


    For example, if you go to the Ubuntu Linux 32-bit operating system, download the
    32-bit binaries from Oracle Java.And if you go to the Ubuntu Linux 64-bit operating
    system, then download the 64-bit version of the Oracle Java binaries.![](rsrcZ6.jpg)Important
    information: Oracle Java 64-bit binaries do not work with the 32-bit Ubuntu Linux
    operating system, you will receive multiple error messages if you try to install
    Oracle Java 64-bit on Ubuntu Linux 32-bit.


    5.  Copy the Oracle Java binaries to the / usr / local / java directory. In most
    cases, Oracle Java binaries will be found in the directory: / home / "your_username"
    / Downloads.


    Instructions for installing Oracle Java 32-bit on Ubuntu Linux 32-bit:![](rsrcZF.jpg)Instructions
    for installing Oracle Java 64-bit on Ubuntu Linux 64-bit:![](rsrcZM.jpg)


    6.  Run the following commands in the Oracle Java tar.gz files you just downloaded.
    Be sure to do this from the root so you can make them executable for all users
    in your system. To open the terminal as root, type "sudo -s" (without quotes)
    and enter the login password.


    Instructions for installing Oracle Java 32-bit on Ubuntu Linux 32-bit:Type / Copy
    / Paste: sudo chmod a + x jre-7u45-linux-i586.tar.gzInstructions for installing
    Oracle Java 64-bit on Ubuntu Linux 64-bitType / Copy / Paste: sudo chmod a + x
    jre-7u45-linux-x64.tar.gz


    7.  Unzip the Java binaries in the / usr / local / java directory


    '' Instructions for installing Oracle Java 32-bit on Ubuntu Linux 32-bit:''![](rsrc103.jpg)


    8.  Check your directories. In this step you should already have two uncompressed
    binary directories in / usr / local / java for Java JDK / JRE cataloged as follows:


    Type / Copy / Paste: ls -ajre1.7.0_45


    9.  Edit the PATH / etc / profile system file, include the following system variables
    to the system PATH. Use "nano", "gedit" or other text editor, as root and open
    / etc / profile.


    ![](rsrc10F.jpg)


    10.  Scroll to the end of the file using the arrows on your keyboard and add the
    following lines below your file / etc / profile:


    ![](rsrc10P.jpg)


    11.  Save the file / etc / profile and jump.


    12.  Tell your Ubuntu Linux system where Oracle Java JRE is located. This will
    tell your system that there is a new version of Oracle Java available.


    ![](rsrc110.jpg)This command notifies the device that Oracle Java Web Start is
    ready for usage.


    13.  Inform your Ubuntu Linux system that the Oracle Java JRE will be the default
    Java.


    ![](rsrc118.jpg)


    14.  Reload the system PATH / etc / profile by typing the following command:


    Type / Copy / Paste: / etc / profileNote that the PATH / etc / profile system
    file will be loaded after restarting your Ubuntu Linux system.'
