    \ String?\n\n`String`, a data type that is used to make and textual operations\
    \ obtained by the concatenation of multiple characters. In other words, the `string`\
    \ is a set of elements of a string. The `String` class is located in the `java.Lang`\
    \ library. This is the class in which all kinds of text-related operations are\
    \ performed. \n\n## Creating a String, Calling a String\n\nHere, you will see\
    \ how to make a string and invoke a string. The `string` type is not very different\
    \ from other variable types in the application. Let's explain on a simple application.\n\
    \n### Our Code.\n\n```java\npublic class StringSinifi {\n    public static void\
    \ main (String [] args) {\n        // TODO Auto-generated method stub\n      \
    \  String ad = \"Osman\";\n        String surname = \"Thompson\";\n        String\
    \ message = new String (\"Java Lessons - elektroyazilim.org\");\n        System.out.println\
    \ (first name + \"\" + last name);\n        System.out.println (message);\n  \
    \  }\n}\n```\n\nLet's talk about our schedule. `String ad = \"Osman\";` With code,\
    \ we have defined a variable named `string` with the name is `ism Osman` inde.\
    \ Then we have defined a variable in `string` type whose name is `last name`.\
    \ We assign the first value to the first and last name variables using `=` assignment\
    \ operator. Finally, the `message` variable we define is from the `string` type.\
    \ However, we initialized the `message` variable with the `new` keyword using\
    \ the `String` constructor and printed our variables with the `System.out.prinln()`\
    \ method. In this method we use `+` operator is textual expressions are used to\
    \ combine the strings.\n\nThe result of our program is as follows:\n\nLet's talk\
    \ about the following two lines of code.\n`String surname = \"Thompson\"; // literal`\n\
    `String message = new String (\"Java Lessons - elektroyazilim.org\"); // object\
    \ creation`\n\nIn our first code, which is expressed literally, we assign a value\
    \ to our string variable with the assignment operator. Although we don't use the\
    \ `new` keyword, the `Java Virtual Machine (JVM)` creates this object for us.\
    \ But there is a point to know here. If we use the assignment operator to create\
    \ string variables with two different names but the same contents, the `JVM` controls\
    \ the pool where the strings are defined. When it sees the first content of the\
    \ same value, it returns a reference to the second string variable instead of\
    \ creating an object.\n\n![Java Programming Lessons String Operations](rsrc1GS.jpg)\n\
    \nthe following code will summarize this situation:\n`String expression1 = \"\
    String Operations\"; // String object named expression1 created`\n`String expression2\
    \ = \"String Operations\"; // Reference was created to the object with the value\
    \ \"String Operations\".`\n\n## String Class Methods\n\nIn this section, we will\
    \ examine the use of string methods that are commonly used in the string class,\
    \ which make our work easier.\n\n### Finding String Length - length () Method\n\
    \nWithin the `String` class, you can find out how many characters a string expression\
    \ consists of using the method named `length()`. This method also counts the spaces\
    \ in the string as characters.\n\n```java\nString message = new String (\"Java\
    \ Lessons - elektroyazilim.org\"); // object creation\nSystem.out.println (\"\
    String length (characters):\" + message.length ());\n```\nThe result is as follows:\n\
    > String length (characters): 34\n\nTo access the methods in the `String` class,\
    \ we use the dot (`.` Operator after typing the name string.\n\n### String Comparison\
    \ - Equals () Method\n\nJava has a method called `equals()` to compare string\
    \ expressions. This method compares two string expressions, returns true if equal,\
    \ false if not. Normally in Java, there is the operator `==`, which controls the\
    \ equality of variables `n`. This operator checks the “ reference equation.” So\
    \ the two strings we compare look at whether they are the same object or not.\
