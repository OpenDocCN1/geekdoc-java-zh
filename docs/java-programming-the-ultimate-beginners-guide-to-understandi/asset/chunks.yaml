- fmt: "\n# Class Definition\n\n```java\nclass Ev\n{\n}\n```\n\nThe statement declares\
    \ a class. The word `class` is a keyword. The `house` is the name of the class.\
    \ The block `{…}` is the body of the class or class block. A class in Java language\
    \ is a template design. It does not occupy a place in memory as it is completely\
    \ abstract. However, as soon as we create an object of that class type using the\
    \ `new` keyword, it takes up space in memory. The created object becomes the embodiment\
    \ of the class.\n\n# Object Reference\n\n```java\nMy home = home;\n```\n\nstatement\
    \ tells the compiler a reference to the memory address of an object of the `Home`\
    \ class. The name of the reference is `home`. The only function of the `home`\
    \ reference in this state is to point to the address of a `home` class object\
    \ in memory. As such, there is no concrete `House` yet. For this reason, we can\
    \ say that `my home` reference points to `null`, which means nothing.\n\n# Object\
    \ Creation\n\n```java\nhome = new Home ();\n```\n\nWe create the object of the\
    \ class `Home`. A class of objects (object) means creating, belonging to the class\
    \ of memory (non-static) is to allocate memory for all the items in one place.\
    \ Other values cannot be written to these reserved places. This is true for as\
    \ long as the object remains in memory. You might think of it as renting space\
    \ in memory. Java assigns a default value to each class variable created in memory.\
    \ The default value depends on the data type. We have mentioned these values in\
    \ our type conversions course.\n\n# Class Object Usage\n\n```java\nMy home = new\
    \ Home ();\n```\n\nas a single code. After we create the object `evim`, we use\
    \ the dot `.` operator to access the property and methods of the `House` class.\
    \ We have already seen examples of this. To access the property and methods of\
    \ a class for reminding, let's know that we have created an object of that class.\
    \ In object-oriented programming, we prefer to do as many different tasks as possible\
    \ in different classes. Thus, both our program is easy to manage and can work\
    \ in different programs when a class place comes. This is called modular programming.\n\
    \n# Access Modifiers\n\nIf a java code can call a variable, it can access that\
    \ variable. Likewise, if a java code can call a method, it can access that method.\
    \ If the code inside a class can access variables and methods within a different\
    \ class, then that class can access that class. This is the same for packages.\
    \ In Java, we can specify who can access that variable when defining a variable,\
    \ a method, a class, or a package. For this, we use access modifier keywords.\
    \ In Java, access tokens ensure the security of the system, and there are 4:\n\
    \n- `public`: Permits all classes to have access.\n- `private`: No other classes,\
    \ including the subclass, can access it.\n- `protected`: Subclasses and those\
    \ in the same package have access.\n- `<default>` (pre-defined): Access to the\
    \ same package.\n\n## The Public\n\nThe `public` access token; it can qualify\
    \ a variable, a method, or a class. Makes the item he/she qualifies `public`.\
    \ Every code in the program can access them, even if they are in another package.\
    \ The `public` can access the variables and methods of a class without constraint,\
    \ its own subclasses, and other outside classes. This is the same for public variables\
    \ and methods. This is why the `main()` method is defined in `public` in application\
    \ programs.\n\n## public class declaration\n\n```java\npublic class Home \n{\n\
    // Class body\n}\n```\n\n## public variable declaration\n\n```java\npublic int\
    \ number;\n```\n\n## public method declaration\n\n```java\npublic double topla\
    \ (int a, double b)\n{\n    return a + b;\n}\n```\n"
