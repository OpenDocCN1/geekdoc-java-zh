    \ height);\n        double volume;\n        volume = evim.en * evim.boy * evim.yukseklik;\n\
    \        System.out.println (\"\\nVolume of volume:\" + volume);\n    }\n}\n```\n\
    \n现在让我们从开始解释这两个类。要添加一个类，只需指向包并调用 `New Class`。然而，如果我们需要检查类的定义：\n\n```\n<access\
    \ identifier> class <class name> {\n    // 代码\n}\n```\n\n格式是这样的。你已经猜到了 `<access\
