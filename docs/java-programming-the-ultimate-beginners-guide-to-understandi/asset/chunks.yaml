    # Why JAVA


    Java is one of the standard and widely used languages in the world in both current
    and Turkey. Today, it is used more or less in every sector. It is one of the most
    recommended languages as a career or learning.


    As for syntax; It is very close to `C`, `C#`, `C++`. Thus, someone who knows `Java`
    can easily switch to these languages. It is platform-independent (Platform, independent).
    So once you write, run everywhere, philosophy is adopted (Write once run anywhere
    - `WORA`). Therefore, a program written in `JAVA` can be written in `LINUX` and
    run on `Windows` or other operating systems.


    Its platform-independent structure allows it to operate anywhere from tiny embedded
    systems to highly advanced systems (Today, `java` works on 3 billion devices.).
    `JAVA`, extensive banking applications, industrial applications such as advanced
    programs can be written minimal robotic applications, smart home, made a practice
    of self-driving cars. In addition, `JAVA`; It can also work on a satellite, a
    clock or a mobile phone.


    ![Java Used Machines Devices Where Java is Used](rsrc4P.jpg)


    # Features of Java Programming Language


    One of the essential features of Java that makes it so accessible is that it is
    open source. All the necessary `IDE` and other tools for `Java` are free. Because
    `Java` code written in any environment works on every platform, it has left behind
    many programming languages. It has become indispensable for corporate projects
    thanks to its Object-Oriented and flexible structure.


    If we list the features of Java programming language in short items:


    * Object-Oriented

    * Simple

    * Secure

    * Robust (Powerful)

    * Architectural - Neutral

    * Platform Independent (Platform Independent)

    * Multi-threaded

    * Interpreted

    * Portable

    * Distributed

    * Dynamic

    * High Performance

