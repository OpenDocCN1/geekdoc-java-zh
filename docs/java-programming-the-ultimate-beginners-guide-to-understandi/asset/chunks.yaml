    after starting school, we learn the grammar step by step. In this lesson, we will
    usually follow this method; that is, we will learn the Java language, not pedagogically,
    but systematically. We will use many concepts first, and then we will learn their
    merits.You are not expected to understand the concepts mentioned in the first
    sections. Even if you do not understand the basics of the syntax of programs,
