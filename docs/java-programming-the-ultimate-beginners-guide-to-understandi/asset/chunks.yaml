    # 整数字面量


    懂数学的人都知道，数字可以用不同的数制表示。换句话说，一个数字在 2 进制中的写法可能与 10 进制不同，在 16 进制中的写法也可能不同，但其取值是相同的。我们需要了解的数制有：


    1. 十进制

    2. 十六进制

    3. 二进制


    我们在日常生活中使用 10 进制。但在数字环境中，二进制和基于二进制的数制是基础。`2¹⁰ = 1024`。如果你不知道数制之间的转换，可以使用执行这些操作的在线网站（`HexToDecimal`、`DecToBinary`）。


    让我们解释为什么这些信息在应用程序中是必要的。该应用程序使用了 Eclipse IDE 环境。代码如下：


    ![](img/rsrc1C8.jpg)


    我们程序的截图如下：

    ![Java 编程课程 整数字面量](img/rsrc1CD.jpg)


    让我们解释一下这个程序。定义了三个变量：`int decdeg`、`hexdeg` 以及第三个 `bindeg`。其中，`decdeg` 被赋值为十进制中的数值
    `45`。`hexdeg` 被赋值为十六进制的 `0x2D`，`bindeg` 被赋值为二进制的 `0b00101101`。


    在 Java 中编写十进制数字时，我们不需要使用任何表达式。然而，在赋值十六进制值时，我们需要使用 `"0x ...."`；在赋值二进制值时，我们需要使用
    `"0b ...."`。我们必须加上这些表达式。通过这些语句，编译器将理解数字是以何种数制提供的。


    当我们编译应用程序时，得到以下结果：

    ![Java 编程课程 整数字面量结果](img/rsrc1CK.jpg)


    所示，编译器分析了数制，并以十进制 `int` 值的形式向我们给结果。


    # 浮点数字面量


    十进制也可以以不同的方式表示。在评估 `float` 数字时，应该在数值紧邻右侧放置字母 `f`。否则，编译器会接受 `double` 类型数字。


    让我们通过应用程序来澄清这个问题。首先，给出代码：

    ![](img/rsrc1CV.jpg)


    我们程序的截图如下：

    ![Java 编程课程 浮点数字面量 1](img/rsrc1CZ.jpg)


    让我们解释一下计划。我们定义了两个类型为 `d` 的 `double` 单位和一个 `float` 类型的变量 `n`。我们在其中放入了相同的值。尽管变量
    `d1` 和 `d2` 被赋值了相同的值，但我们已经说明表示形式可能不同。字母 `e` 表示的状态表示该数字将有一个大于 10 的值。`1.3456e2 =
    1.3456 x 10² = 134.56`。


    我们已经展示了在给 `float` 数字赋值时，应该在数值右侧放置字母 `f`。当你运行我们的程序时，可以看到结果如下：

    ![Java 编程课程 浮点数字面量 2](img/rsrc1D6.jpg)


    # 应用 - 字面量


    现在让我们做一个包含其他类型变量通用应用程序。在程序中，我们定义了 `long`、`byte`、`float` 类型变量并在屏幕上打印了它们的值。


    我们的代码如下：

    ![](img/rsrc1DJ.jpg)


    程序截图：

    ![](img/rsrc1DR.jpg) ![Java 编程课程 变量字面量 1](img/rsrc1DV.jpg)


    当我们查看程序中赋予变量的值时，我们发现通常有一个下划线字符 `_`。编译器不会看到这个字符，我们只能使用 `long` 数字来使其更具可读性或适应特定格式。


    你可能已经注意到我们在 `long` 数据类型中使用字母 `L`，在 `float` 数据类型中使用字母 `F`。我们程序的输出如下：

    ![](img/rsrc1E2.jpg)


    # 变量的生命 - 作用域


    在 Java 中，每个变量都有一个定义范围。该字段位于变量定义的块（block）中。想象数学中的最外层集合及其子集。内部子集中元素的生命周期取决于它们所在的簇。然而，最外层簇内元素的生命周期等于最外层簇的面积，它包含了子集。


    这是一个解释这种情况的粗略模板。`Main` 方法中有 3 个覆盖区域。最外层的覆盖区域 3 是最大的，覆盖了区域 1 和 2。你也可以从块 1 和 2 访问在字段
    3 中定义的数字 `num1`。


    在字段 2 中定义的变量 `num2` 覆盖了字段 1 和 2，并在这些区域内可用。你不能在字段 2 之外访问（使用）变量 `number2`。


    最内层的 No.1 区域是 `sayi3`，它的作用域仅限于该块。结果是，每个变量都可以从定义块内的任何地方访问，但它无法离开该块。


    # Java 编程课程 - String 类


    在之前的系列从零开始 Java Java 编程课程中，我们讨论了“Java 编程课程 - 变量（数据类型）”。然而，我们没有提供关于 `string` 数据类型的信息。在这节课程中，我们将讨论
    Java `String` 类。


    *   什么是 `String`？

    *   创建 `String`，调用 `String`

    *   `String` 类方法

    *   获取字符串长度 - `length()` 方法

    *   字符串比较 - `equals()` 方法

    *   将数字转换为字符串 - `valueOf()` 方法

    *   将字符串转换为数值 - `parse()` 方法

    *   拼接 `concat()` 方法

    *   创建子字符串 - `substring()` 方法

    *   `startsWith()` 和 `endsWith()`

    *   字符串修剪 - `trim()` 方法

    *   字符串替换 - 方法 (`replace`)

    *   字符序列查找 - `indexOf()` 方法

    *   字符获取 - `charAt()` 方法

    *   大小写转换 - `toLowerCase()` `toUpperCase()`


