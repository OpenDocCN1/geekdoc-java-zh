    {// Java Programming Lessons, SeriesString str [] = {"Cotton", "Princess", "and",
    "Seven", "Dwarfs"};System.out.println (str [0] + "" + str [1]);​ }}The result
    of our program is as follows:> Pamuk PrensesPrinting Array Elements To The Screen
    - ApplicationNow let us make a small application that prints the array elements
    on the screen to use the information we have learned so far. Code:public class
    Diziler {​ public static void main (String [] args) {// Java Programming Lessons,
    Seriesint number [] = {12, 35, 69, 58, 48};System.out.println ("Array Elements
    \ n");for (int index = 0; index < sayi.length; index++){System.out.println (""
    + (index + 1) + ". Element:" + number [index]);}System.out.println ("\ nArray
    elements are printed.");​ }}In our application, we first defined a 5-element array
    of type int, named number, and made initial value assignments. After Dizi Number
    Array Elements ”is displayed on the screen, the for loop is started.The int variable
    defined by the index name in the for loop will be used for the sequence numbers
    of the array elements. sayi. length relates to the period of the array; 5\. We
    printed each array element with the System.out.println method in the loop.As mentioned
    earlier, array elements can be accessed by array name, square brackets, and sequence
    number. For example, since the index value of the third element of the array is
    2, we can access the third element of the array with the number [2] statement.After
