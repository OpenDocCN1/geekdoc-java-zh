    \ 编程课程 - 变量（数据类型）\n在这一系列从零开始的 Java 课程中，我们将讨论“Java 编程课程 -变量（数据类型）”。什么是变量，变量的类型有哪些？变量命名规范、数据类型、Eclipse\
    \ IDE 中圆面积计算的应用、在 Netbeans IDE 环境中打印数据类型、赋值运算符和 ASCII 表格。\n\n*   什么是变量？(What is\
    \ variable?)\n*   变量的类型\n*   变量命名规范\n*   数据类型\n*   圆面积计算器（应用）- Eclipse\n*   显示数据类型（应用）-\
    \ NetBeans\n*   字面量（整数、浮点数、字符串）\n*   整数字面量\n*   浮点字面量\n*   应用 - 文献\n*   变量的生命\
    \ - 作用域\n\n### 什么是变量？(What is variable?)\n在开始 Java 编程课程中的变量主题之前，让我们先聊聊“什么是变量”。\n\
    \n在编写数据类型时，我们想要在内存中预留位置进行处理的 Java 程序被称为变量。之所以称其为变量，是因为它的内容可以随时更改。![Java 编程课程 什么是变量？](img/rsrc14W.jpg)![](img/rsrc151.jpg)\n\
    \n在上面的代码中，我们将整数 `10` 的值赋值给变量 `number`。在 Java 中，`=` 运算符是赋值运算符。它们用于将等式右侧的值赋给左侧。\n\
    \n### 变量的类型\nJava 中主要有三种变量。这些：\n\n1.  **局部变量：** 在 Java 方法中定义（声明 / declaration）的变量称为局部变量。如果我们要在方法中使用局部变量，必须为其分配第一个值。\n\
    2.  **实例变量：** 实例变量定义在类内部，即定义在方法之外的静态变量。我们不需要初始化它们。只需给最终变量赋予第一个值即可。\n3.  **静态变量：**\
    \ 静态类中声明的静态变量。这些变量不能是局部的。我们不需要初始化。在这种情况下，必须将第一个变量赋给最终变量。我们将在后续课程中详细解释。\n\n如果我们用例子来解释这些变量；![](img/rsrc15B.jpg)\n\
    \n### 变量命名规范\nJava 编程语言中的变量命名规范如下：\n*   变量不能是 Java 定义的保留字或关键字。\n*   变量名中不使用土耳其字符。\n\
    *   变量名不能以数字开头，但可以包含数字。不过，它可以以美元符号（`$`）和下划线（`_`）开头。\n\n变量名对大小写敏感。如果变量包含多个单词，不能插入任何空格。可以使用\
    \ `_` 字符代替。\n\n### 数据类型\nJava 中有两种数据类型。这些是基本类型和非基本类型。\n\n#### 基本类型\n*   布尔数据类型（取值\
    \ `0` 和 `1`；即 true 和 false）\n*   数值类型\n*   字符 (`char`)\n*   整型\n    *   `integer`\n\
    \    *   `byte`\n    *   `short`\n    *   `int`\n    *   `longan`\n*   浮点型\n \
    \   *   `float`\n    *   `double`\n\n"
