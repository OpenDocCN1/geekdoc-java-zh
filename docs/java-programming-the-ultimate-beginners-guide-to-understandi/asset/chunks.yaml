    Dimensional Arrays·         Variable Size ArraysDeclarationIn all C syntax languages
    ​​ and Java, arrays are declared with square brackets. Arrays are often expressed
    with the concept of ays Arrays plan . Array definitions are like standard variable
    definitions, except that they have square brackets.int numbers [] = new int [7];with
    codeint [] numbers = new int [7];Statements are the same. The square brackets used
    when defining an array can be the beginning or end of the array name. We can define
    multiple arrays at the same time:float [] numbers, numbers;double bank [], receipt
    [], finance [];Those who have no idea about loops before moving to one-dimensional
    arrays are strongly recommended to read “ Java Programming Lessons, Loops.”One
    Dimensional Arrayint monthsArray []; // nullIn this case, a reservation is made for
    this array in memory but does not take up any memory space. If we want space,
    we need to type the rest of the new keyword :int monthsArray [] = new int [12]; With
    code, we have created an array of 12 elements each of type int. So instead of
    defining 12 int variables in succession, we have done it with a single code. To
    summarize, the general definition of arrays is as follows:arrayType arrayName
    [] = new arrayType [number]; The square brackets on the left side of the equation
    can be to the left or right of the arrayName expression.Sequences are stored in
    sequence. The index value of the first element is 0 (zero). To access each of
    the array elements, after entering the array name, the sequence number is written
    in square brackets. In other words, the first array element of the months array
    is monthsArray [0], and the second element is monthsArray [1].Since we did not
    assign the first value to the array elements in this array definition, we have
    default values ​​ of {0,0,0,0,0…., 0}. For initial value assignment:> int aylarDizisi[]
    = new int[12];> aylarDizisi[0] = 31;> aylarDizisi[1] = 28;> aylarDizisi[2] = 31;>
    aylarDizisi[3] = 30;> aylarDizisi[4] = 31;> aylarDizisi[5] = 30;Individual index
    numbers access the first 6 of the array elements, and the value values ​​ are
    assigned separately. Sequences can be assigned to individual arrays in this way,
    as well as to assign values at a time :int number [] = {12, 35, 69, 58, 48};We
    have defined an int array named number and assigned the first value. Although
    we do not specify the number of elements of the array, the compiler assumes that
    the array has 5 elements. The first element of the number array is assigned a
    value of 12, and the last element is assigned a value of 48.We can define arrays
