    # Linux Ubuntu 32-位 32-bit Oracle Java 安装指南


    - `cd /home/"your username"/Downloads`

    - `sudo -s cp -r jdk-7u17-linux-i586.tar.gz /usr/local/java`

    - `sudo -s cp -r jre-7u17-linux-i586.tar.gz /usr/local/java`

    - `cd /usr/local/java`


    # Linux 64-位 Ubuntu 64-bit Oracle Java 安装指南


    - `cd /home/"your username"/Downloads`

    - `sudo -s cp -r jdk-7u17-linux-x64.tar.gz /usr/local/java`

    - `sudo -s cp -r jre-7u17-linux-x64.tar.gz /usr/local/java`

    - `cd /usr/local/java`


    ## 6. 在 `/usr/local/java` 目录下解压 Java 压缩二进制文件


    ### Linux Ubuntu 32-位 32-bit Oracle Java 安装指南

    - `sudo -s tar xvzf jdk-7u17-linux-i586.tar.gz`

    - `sudo -s tar xvzf jre-7u17-linux-i586.tar.gz`


    ### Linux 64-位 Ubuntu 64-bit Oracle Java 安装指南

    - `sudo -s tar xvzf jdk-7u17-linux-x64.tar.gz`

    - `sudo -s tar xvzf jre-7u17-linux-x64.tar.gz`


    ## 7. 检查您的目录


    此时，在 `/usr/local/java` 目录下您应该有两个解压后的二进制目录，对应出的 Java JDK / JRE：


    - `ls -ajdk1.7.0_17jre1.7.0_17`


    ## 8. 更新您的环境变量


    编辑系统文件 `/etc/profile`，它是 `PATH` 环境变量的主要查询文件之一。将以下变量添加到您的系统目录/系统路径列表中。您使用 `nano`、`gedit`
    或任何其他编辑器，以 root 账户打开 `/etc/profile` 文件。


    - `sudo gedit /etc/profile`

    - 或 `sudo nano /etc/profile`


    ## 9. 移动到文件末尾


    使用方向键将这些行添加到 `/etc/profile` 文件的末尾：


    ```bash

    export JAVA_HOME

    export JRE_HOME

    export PATH

    ```


    ## 10. 保存文件


    保存 `/etc/profile` 文件并退出。


    ## 11. 通知您的系统


    告知您的 Linux Ubuntu 系统 Oracle Java JDK / JRE 的所在位置。这将通知系统新版本的 Oracle Java 可供使用。


    ## 12. 设置默认 Java


    除了以上操作外，还需要通知操作系统此 Oracle Java JDK / JRE 必须是默认 Java，即默认值。


    - 通过此命令，您为执行文件选择全局 `java` 环境变量。

    - 通过此命令，您为编译器选择全局 `javac` 环境变量。

    - 通过此命令，您为 Java Web Start 选择全局 `javaws` 环境变量。


    ## 13. 重载系统变量


    输入以下命令重载在 `/etc/profile` 文件中定义的 `PATH` 全局系统变量：


    ```bash

    . /etc/profile

    ```

    注意，当再次初始化系统时，`PATH` 将被更新。


    ## 14. 测试安装


    测试 Oracle Java 是否已正确安装在系统上。运行以下命令并查看 Java 版本：


    ## 15. 若 32-bit Oracle Java 安装成功


    - `java -version`

    此命令将向您显示正在运行的 Java 版本。您将收到如下消息：

    ```

    java version "1.7.0_17"

    ```

    此命令将向您显示 Java 编译器的版本，并确认现在现在可以从终端编译 Java 程序了。您将收到如下消息：

    ```

    javac 1.7.0_17

    ```


    ## 16. 若 64-bit Oracle Java 安装成功


    - `java -version`

    此命令将向您显示正在运行的 Java 版本。您将收到如下消息：

    ```

    java version "1.7.0_17"

    Java (TM) SE Runtime Environment using (build 1.7.0_17-b21)

    Java HotSpot (TM) 64-Bit Server VM ensure (build 23.6-b04, mixed mode)

    ```

    - `javac -version`

    此命令将向您显示 Java 编译器的版本，并确认现在现在可以从终端编译 Java 程序了。您将收到如下消息：

    ```

    javac 1.7.0_17

    ```


    ## 17. 恭喜！


    您已在 Linux 系统上完整安装了 Oracle Java。现在重启您的 Linux Ubuntu 系统。然后，您的系统将完全配置，以运行和开发 Java
    程序。稍后您可能想要编译并运行自己的 Java 程序。


    '
- fmt: "\n# How to enable Oracle Java in your Network Browsers\n\nTo enable your Java\
    \ plug-in in the web browsers, ensure you must make a symbolic link in your browser's\
    \ plug-in directory to the address of the Java plug-in included in the Oracle\
    \ Java distribution.\n\n**Important Note:** In the Oracle Java 7 plug-in, many\
    \ security flaws have been detected, and you could put your system at risk. To\
    \ see more information about this consult the following web site: `Java Tester`\n\
    \n## Google Chrome\n\n### Instructions for Oracle Java 32-bit:\nGive the following\
    \ commands. Type / Copy / Paste: `sudo -s`\nWith this command you enable yourself\
    \ as the super root user![](rsrcW2.jpg)\nWith this command you create the directory\
    \ `/opt/google/chrome/plugins`![](rsrcW7.jpg)\nWith this command you move to the\
    \ newly created directory. Make sure you are there before you make the symbolic\
    \ league.![](rsrcWC.jpg)\nWith this command you create the symbolic link to the\
    \ Java JRE plug-in (Java Runtime Environment) `libnpjp2.so`. Then to your Google\
    \ Chrome web browser.\n\n### Instructions for Oracle Java 64-bit:\nGive the following\
