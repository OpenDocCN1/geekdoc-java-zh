  trans: "\n\n# 私有 Private Private\n有时我们可能希望防止变量、方法或类访问程序中其他类的代码。在这种情况下，我们使用 `private`\
    \ 访问修饰符。私有项只能被同一个类的代码访问，而不能被其他类访问。甚至它们自己的子类无法访问。\n\n```java\nsuperclass interface\
    \ method\nprivate class declaration\nprivate class Home { \n    // Class body\
    \ \n}\nprivate variable declaration\nprivate int number;\nprivate method declaration\n\
    collect private double (int a, double b){\n    return a + b;\n}\n```\n注意：(Note)\n\
    \n# 保护级 Protected\n在某些情况下，我们可能希望子类访问类内的变量和方法，但不允许访问包或程序或其他类。对于这种情况，我们使用 `protected`\
    \ 访问修饰符。这意味着子类中的变量或方法像访问公共元素一样访问类的保护元素。因为它允许子类访问，所以它在继承中起着重要作用。\n\n```java\nprotected\
    \ class declaration\nprotected class Home { \n    // Class Body \n}\nprotected\
    \ variable declaration\nprotected int number;\nprotected method declaration\n\
    collect protected double (int a, double b){\n    return a + b;\n}\n```\n\n# 预定义\
    \ <默认> Token Pre-Defined Default\n在变量、方法或类之前没有放置访问修饰符的情况。如果没有设置访问令牌，则默认的 `default`\
    \ 令牌将生效。（友好访问）\n\n### 包 package\n通知包仅有默认访问权限，没有其他访问令牌。通过这种访问权限；包中的每个类都可以访问包中的每个变量和方法。但其他包中的类无法访问它。\n\
    \n```java\npackage package_name { \n    // package body \n}\n```\n\n### 默认 default\n\
    没有访问修饰符的类声明\n如果在声明类时类前面没有放置访问修饰符，同一包中的所有类都可以访问该类中的变量和方法。\n```java\nclass Home\
    \ { \n    // Class body \n}\n```\n没有访问修饰符的方法声明\n如果在方法声明的方法开头没有放置访问修饰符；此方法可以访问该类自身的子类以及同一包中的其他类。\n\
    ```java\nadd a double (int a, double b){\n    return a + b;\n}\n```\n变量声明\n变量声明中未使用访问令牌；类本身、其子类以及同一包中的其他类。\n\
    ```java\nint numbers;\n```\n\n通过这种方式，我们完成了“Java 课程：对象与类”。\n\n## Java 编程的优点\nJava\
    \ 现在已适用于各种计算机系统并已得到广泛应用。同样，Java 还附带了广泛的类库，其中包含了对（几乎）日常编程任务的支持。虚拟机的概念使得编译一次的程序代码可以在任何提供\
    \ Java 虚拟的平台上运行。不再需要在相应的目标平台上进行重新编译（如使用 `C` / `C++` 那样）。另一个优势是所谓的“小程序（applets）”。这些是可以在网页浏览器中启动的\
    \ Java 程序，使得通过互联网部署应用程序变得非常简单。\n\n一个切实在在的优势——不仅对于大型项目——是集成开发环境的免费可用，特别是 Eclipse\
    \ 平台。对于许多程序员来说，工具支持是选择编程语言的关键标准。在这里，Java 是受支持最活跃的平台之一。Java 已经成为行业标准。\n\n## Java\
    \ 编程的缺点\nJava 程序需要运行时环境才能运行。在许多计算机上，这并不是预装的，必须单独设置。这同样适用于其他流行的编程语言，如 `.NET` 或\
    \ `Perl`。同样，流行浏览器内置的 Java App 运行时环境通常是过时的。如果你想为这些浏览器编写 Java 程序，你必须限制使用旧的语言版本，或者在浏览器上安装当前的运行时环境。\n\
    \n此外，Java 不适用于开发接近底层的程序，如硬件驱动程序。这主要是因为运行在理论上任意计算机架构和操作系统上的 Java 程序应该能够在不改变的情况下运行。这种抽象不再允许直接访问与特定硬件相关的函数。其他语言如\
    \ `C` 或 `C++` 更适合此类任务。\n\n## Java 程序的运行速度 Speed\n关于 Java 程序速度的流行观点是，Java 程序比类似的\
    \ `C` 或 `C++` 程序慢。然而，不能一概而论，因为 Java 程序的速度取决于多种因素。\n\n用于运行 Java 程序的虚拟机（`VM`）首先起着重要作用。在早期，Java\
    \ 代码是被解释的。这导致了性能下降，而现代 Java 虚拟机几乎消除了这种现象。例如，SUN 的 Java 虚拟机在运行时“编译”Java 程序。结果是程序的速度仅比用\
    \ `C` 或 `C++` 编写的相应程序慢一点点。\n\nJava 程序在“启动”时有一个基本的速度劣势，因为每个 Java 程序必须首先启动自己的 `VM`。此外，加载类需要很长时间。最近的\
    \ `VM` 实现（2004 年）通过允许同时使用多个程序的类克服了后者的缺点，以便在第一个 Java 启动后，随后的加载就被消除了。\n\nJava 程序还有另一个速度损失，即每次访问字段时都会检查字段边界。然而，现代虚拟机大多可以通过在循环遍历期间将区域检查放在循环体之前，而不是每次字段访问时，来“优化掉”这种检查。通过这种方式，可以消除大约\
    \ 80% 原来需要的范围检查。\n\nJava 代码的另一个缺点是，许多方法（更准确地说：非 final 实例方法）最初都是虚方法。然而，编译器可以进行优化；由于\
    \ Java 的运行时环境针对运行虚方法进行了优化，Java 中的虚方法调用速度明显快于大多数 `C++` 编译器。\n\n最后但同样重要的，库也起了作用。\n\
    \n结论 Conclusion\n通过这种方式，我们完成了“Java 课程：对象与类”。\n\n"
