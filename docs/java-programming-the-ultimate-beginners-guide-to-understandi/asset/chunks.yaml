    # 懂一点编程的人可以很快感觉到这些表达式的含义。现在不理解解释的人不要沮丧，因为这些习惯用语仅仅是 Java 的精髓。它们的真正含义只有在读完整本书后才能被完全理解。


    Java 是简单的。Java 开发者目标是让源程序易于编写、易于编译和调试。Java 比 C++ 简单得多的原因是它会自动分配内存并从内存中销毁完成的对象（垃圾收集）。


    Java 是一种面向对象的编程语言。它具有面向对象编程范式的所有优点。它为程序员提供了基本能力，如继承、多态、模块化编程、调试和代码重用。


    Java 是一个分布式系统。它允许网络上的多台计算机作为一个集成系统协同工作。


    Java 是支持多线程的。多任务意味着计算机可以同时处理多个作业。多线程通过调用其他语言中的系统相关过程构建在 Java 语言的核心中。多线程能力在视觉编程和网络编程中尤为重要。


    Java 是平台无关的。Java 程序针对 `JVM` 编译一次，而不是针对不同的平台。`JVM` 在编译结束时解释生成的 Java 字节码。字节码可以在所有安装了
    `JVM` 的机器上运行。`JVM` 虚拟机可以快速免费地安装在每台机器上。因此，Java 程序编写一次，随处运行。


    Java 是移植的。因为它独立于操作系统和硬件，Java 字节码很容易从一个计算机系统迁移到另一个。同一个 Java 程序在不同系统上平畅运行的能力为编程领域开启了广阔的视野。


    Java 是健壮的。它能在 Java 编译时确定其他语言只能在运行时检测的错误——强大的调试能力。


    Java 是安全的。Java 语言、编译器和解释器的设计都以安全为优先考虑。它是第一个在设计中强调安全的语言。


    Java 网络是友好的。在 Java 中，编写网络程序就像发送和接收数据一样简单。


    ## Java 语言的主要应用开发工具


    作为一种通用、高级语言，Java 是一种强大的软件开发工具。用 Java 开发的一些应用如下：


    ### 软件开发工具

    编译、运行、调试和记录应用程序所需的工具包含在 `JSDK` 中。在 Windows 操作系统中，我们将使用 `JSDK` 中的 `javac.exe` 编译器编译
    Java 源程序，使用 `java.exe` 程序运行 Java 应用，并使用 `javadoc.exe` 解释器准备文档。对于其他操作系统，这些程序有对应的程序。


    ### 应用程序接口

    [`API - 应用程序接口]`：Java 的核心特性之一。这个名为 `Java API` 的库包含了用于网络、安全、XML、数据库访问等高级主题的类、接口和方法，从程序员需要的简单类开始。在编写本文时，该库位于
    `http://download.oracle.com/javase/6/docs/api/`。


    `JSEDK [Java 标准环境开发包 6]` 位于。`JSDK` 第 6 版本是这些销售版本中的最后一个。随着时间的推移，新版本的 `JSDK` 以及相应的
    `API` 会出现。在编写新应用时，最好使用最新版本。


    ### 用户界面工具

    它拥有先进的工具，如 Java 语言、`Swing` 和 `Java 2D` 来准备 GUI 图形用户界面。


    ### 集成库

    `Java IDL API`、`JDBC TM API`、`Java 命名和目录接口 TM ("JNDI") API`、`Java RMI (基于 Internet
    的 Java 远程方法调用)`、`中间对象 协议技术 (Java RMI-IIOP 技术)` 提供了对远程对象的访问。


    ## Java 语言的主要应用


    * **类库**：创建供其他应用程序使用的库类。

    * **控制台应用程序**：为行命令行界面创建视觉化的 Java 应用程序。

    * **Web 应用程序**：为 Web 用户界面创建视觉化的 Java 应用程序。

    * **XML 应用程序**：`XML` 创建 Web 服务。创建管理数据库应用程序的程序。

    * **移动 Web 应用程序**：为 PDA、手机等便携式设备创建程序。

    * **游戏程序**：用 Java 编写的开发程序。


    ## Java 为你提供了什么？


    由于 Java 是一门运行于计算机几乎每个方面的语言，Java 程序员在全世界拥有优越的权利。他们可以轻松找到高薪工作。如果你是编程初学者，Java 在本课程将为你提供以下优势：


    * 因为 Java 是一种简洁的语言，你学习它的时间比其他语言更短。

    * 例如，Java 程序大约只是完成相同工作的 C++ 源程序的四分之一。在这种情况下，通过编写更少的代码，你将节省时间和精力。

    * 你将更高效地编写代码。`Java API` 将为你提供几乎所需的每一个类和方法。如果你愿意，可以使用这些类和方法，也可以从它们派生子类。通过这样做，你将防止源程序中的错误。当然，如果你需要，你总是可以编写新的类和方法。

    * 你可以编写一次 Java 程序并随处运行。

    * 除了 Java API，你可以快速更新它们。


    ## 编程的阶段


    无论使用哪种语言，编程动作由以下阶段组成：


    1. **编写源程序**：用任何语言编写源程序。源程序必须遵循语言语法。

    2. **编译**：将源程序转换为中间语言。这取决于所使用的语言。例如，在 Java 中，将源程序转换为字节码。

    3. **中间语言转换为可执行语言**：为了让程序可执行（可解释），计算机系统必须将中间语言转换为它理解的语言（机器语言）。`JVM` 解释由 Java 编译器生成的字节码。在现代编程中，这些是有用的。预先的项以便使用的
    Java 程序员可以从库中获取想要的内容。虽然更新方法不同，但在每个语言中都是可能的。我们将在后续章节学习如何使用它。


    ## 常见问题：什么是 Java 自动更新？


    ### 如何更改设置？

    此部分适用于 Windows 10、Windows 8、Windows 7、Vista、Windows XP Java 版本 7.0、8.0。Mac 用户请参见如何在
    Mac 上更新 Java。


    ### 自动更新如何工作？

    Java 自动更新是一个让你的计算机保持最新 Java 版本更新的功能。当你启用自动更新时，系统定期检查 Java 新版本。当发现新版本时，将提示升级已安装的
    Java 版本。你可以随时手动更新或检查更新。


    ### 如何更改通知 Java 版本的频率？

    通过更新选项卡上的高级设置调整更新计划。通常情况下，将在更新发布后一周内通知你。


    ### 为什么我不应该禁用通知？

    通过让你的系统查找最新版本来保持系统安全。强烈建议不要禁用更新功能。相反，更改通知你新版本的频率。根据默认设置，每周通知一次。


    ### 如何配置系统自动下载 Java 新版本？

    使用 Java 控制面板中更新选项卡上的“通知我”选项。


    ### 如何安装更新？

    当你收到新版本通知时，点击消息启动更新过程。


    ### 为什么我应该允许 Java 自动更新程序运行？

    Java 自动更新程序（在早期版本中称为 `jucheck.exe`）作为 Windows 进程运行，检查并执行本文所述的更新。


    ### 作为安装的一部分

    它不会自动安装 Java。提供了安装最新 Java 版本的选项。此过程提醒你系统有新的安全版本。要使用最新的 Java 版本，你必须保持此进程运行。


    ### 为什么我每次重启电脑都会收到通知？

    在 Windows Vista 及之后重启系统时，Windows 进程 `jucheck.exe`（也称为）启动并尝试检查 Java 最新版本。用户账户控制
    (UAC) 会询问你是否允许此进程运行。


    ### 为什么我无法更改设置？

    如果你不是管理员身份登录，或者网络管理员在安装期间禁用了此功能，则更新选项卡可能无效。


    ### 为什么 Java 控制面板中没有更新选项卡？

    Java 8 之前的 64 位 Java 版本不支持自动更新。在 Java 8 之前的版本中，Java 控制面板中没有更新选项卡。从 Java 8 Update
    20 开始，Java 控制面板中的更新选项卡允许用户自动更新安装在系统上的 64 位 JRE（以及 32 位版本）。


    ### 为什么我的更新设置没有保存？

    有关更多信息和解决方案，请参见 Java 控制面板中的更新设置未保存。


    ### 从 Java 6 升级到 Java 7 时旧版本会被卸载吗？

    是的，通过 AutoUpdate 或 Java 控制面板升级到 Java 7 会移除最高版本的 Java 6 版本。Java 6 的常规更新已结束。将不再有新的安全更新。为了增加安全性，建议从计算机上卸载
    Java 6。


