  trans: "\n\n# 你需要学习 Java\n\n在学习 Java 之前，不需要了解任何知识。它是一种即使是从未见过程序设计、只会在电脑上打字的人也能学习的结构。然而，可能需要一定的数学逻辑。这并不会阻止你成为一名出色的程序员。即使你没有过多的计算技能，拥有数学逻辑也会让你的工作变得更容易。因此，在培训过程中需要一些数学知识。不需要先备知识。\n\
    \n## Java 课程入门\n\n在开始 Java 编程之前，我们需要一些工具和开发环境。因此，在开始编程之前，我们必须先进行一些设置。\n\n*   Java\
    \ 运行环境 (JRE)\n*   Java 开发工具包 (JDK)\n*   开发环境 (IDE) Eclipse 或 Netbeans（这些界面（IDE）在编写\
    \ Java 项目时提供视觉化和易用性。最常用的常用的两个是 `Eclipse IDE` 和 `Netbeans`）。\n\n### Java 运行环境 (JRE)\n\
    \n`JRE`（`Java Runtime Environment`）是一个 Java 工作环境。它是包含 `JVM` 的软件。它还包含了 Java 库。它是在你计算机上运行用\
    \ Java 编写的程序所需的工具。如果你已经在你的计算机上运行过用 Java 编写的程序，它可能已经安装了。如果还没有安装，你可以下载它。你可以根据适用于你操作系统的选择使用对应的下载链接（不要忘记接受许可协议。点击“Accept”）。\n\
    \n由于 `JRE` 带有 `JDK`，你可以跳过这一步，并在安装 `JDK` 时同时安装它。\n\n![java programming lessons\
    \ jre download](img/rsrc6J.jpg)\n\n### 安装 Java 开发工具包 (JDK)\n\n要用 Java 编程，我们需要下载并安装\
    \ `JDK`。我们将下载 `Java SE 8` 的 `JDK`。点击 `JDK DOWNLOAD` 将带你进入一个根据操作系统提供下载选项的页面。在这里不要忘记接受许可协议。“Accept\
    \ ...” 。\n\n![java programming lessons jdk installation](img/rsrc6U.jpg)\n\n点击此选项旁边的下载链接，因为我的操作系统是\
    \ `Windows x64 bit`。你可以通过选择适合你的选项来开始下载过程。将下载一个安装文件。双击应用程序开始安装。然后像标准安装一样一直点击 next（下一步）。\n\
    \n当你安装 `JDK` 并进入计算机上的“程序”部分时，你会看到 `JRE` 和 `JDK` 均已安装。你也可以通过查看 `C:\\Program Files\\\
    Java` 文件夹来访问。\n\n### NetBeans 开发环境 (IDE)\n\n你可以下载 `NetBeans` 开发环境，它是我们将用于 Java\
    \ 的 IDE 之一。它是由 `Oracle` 支持的软件。当你点击下载链接时，将出现如图像所示的不同的下载选项。如果你愿意，可以在 `IDE Language`（IDE\
    \ 语言）中选择土耳其语。\n\n我们将使用 `Java SE`，你可以选择 `Java EE` 或 `All`（全部）中的一个。下面是根据你操作系统的位状态提供的一些下载链接；32\
    \ 位是 `x86`，64 位是 `x64 bits`。你可以根据自己的情况做出相应选择并下载应用程序。以前，Java 属于一家名为 `Sun Microsystems`\
    \ 的公司。然而，当 `Oracle` 收这家公司后，`Oracle` 变成了 Java 的新主人。\n\n![java programming lessons\
    \ netbeans ide installation 1](img/rsrc7B.jpg)\n\n当你点击 `Download` 按钮时，相应的安装文件将下载到你的计算机。按照如下方式双击可执行文件开始安装。你可以通过点击\
    \ forward（向前）来安装应用程序。\n\n### Eclipse IDE 开发环境\n\nJava 最常用的另一个 IDE 环境是 `Eclipse\
    \ IDE` 开发环境。你可以下载 `Eclipse IDE`。点击链接将出现针对 `Eclipse IDE` 环境下不同编程语言的下载选项。\n\n![java\
    \ programming lessons eclipse ide setup 2](img/rsrc7J.jpg)\n\n点击 `Eclipse IDE`\
    \ 下适用于 `Java Developers`（Java 开发者）的 64 位下载链接。（如果你的电脑是 32 位的，点击 32 位）。下载时，你会发现下载的文件是一个\
    \ zip 包，而不是安装文件。\n\n![](img/rsrc7S.jpg)\n\n右键点击该文件并选择 `eclipse`。进入后，你会发现除了一些文件夹外，还有\
    \ `eclipse.exe`。\n\n![java programming lessons eclipse ide folder](img/rsrc7X.jpg)\n\
    \n之后，只需点击 `eclipse.exe` 即可运行 `eclipse`。\n\n### Eclipse IDE 与 Netbeans IDE\n\n\
    `Netbeans IDE` 比 `Eclipse IDE` 使用起来更简单、更方便。一切都更准备就绪了。在 `Eclipse IDE` 中，你需要从市场上收集很多东西进行安装，而\
    \ `Netbeans IDE` 自带了很多内容。\n\n通常，建议初学者使用 `Netbeans` 开发应用程序，而不必在熟悉语言之前面对各种困难，然后建议他们切换到\
    \ `Eclipse`。当然，这取决于你。我们将在课程中同时使用它们。通常情况下，编程不需要这些 IDE。你也可以用记事本类似的应用程序编写代码。然而，IDE\
    \ 缩短了我们应用程序的时间。它为我们提供了便利。IDE 是软件世界中不可或缺的工具。\n\n`Eclipse IDE` 最的一点是它是便携的。不需要安装。无论你把这个文件放在哪里它都能工作。这就是\
    \ `Eclipse` 在商业世界最受欢迎的原因之一。`Eclipse` 还支持 Java 外的许多编程语言。在 `Eclipse` 文件夹中，你可以打开一个名为\
    \ `projects` 的文件夹。\n\n### Java 代码的基本操作逻辑\n\n### 什么是 Java 开发工具包 (JDK)、Java 运行环境\
    \ (JRE) 和 Java 虚拟机 (JVM)?\n\n我们将简要介绍这些。\n\n![Java development Kit Structure](img/rsrc8B.jpg)\n\
    \nJava 代码被编译（编译器），然后它不是直接转换为特定操作系统的机器码，而是中间语言 `.class` 扩展。Java 平台无关性的秘密就在这里。这些字节码对于每个操作系统都是相同的，由\
    \ Java 虚拟机接收并在其中运行（每个操作系统都有自己的虚拟机）。这会将 Java 代码翻译成每个操作系统能理解的语言。`JVM` 解析操作位于 `JRE`\
    \ 库中。Java 程序由对象和类组成。编写的代码扩展名为 `.java`。开发 Java 需要 `JDK`。Java 开发工具包有自己的库和编译器。`JDK`\
    \ 在其持有中操作（编译——编译器）。这允许我们创建 `.class` 扩展的文件（字节码）。\n\n![java programming lessons\
