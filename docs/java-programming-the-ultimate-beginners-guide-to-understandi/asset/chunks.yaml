  trans: "\n\n## 15. 检查 Oracle Java 是否已正确安装在系统中。运行以下命令并记录 Java 版本：\n\n### 16. 成功安装\
    \ Oracle Java 32 位版本将显示以下内容：\n\n输入 / 复制 / 粘贴：\n```bash\njava -version\n```\n此命令显示你系统中\
    \ Java 的版本。你应该会收到一条所示的消息：![](img/rsrc11T.jpg)\n\n### 17. 成功安装 Oracle Java 64 位版本将显示以下内容：\n\
    \n输入 / 复制 / 粘贴：\n```bash\njava -version\n```\n此命令将显示你系统中 Java 的版本。你应该收到以下消息：![](img/rsrc123.jpg)\n\
