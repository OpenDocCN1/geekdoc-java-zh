    With this command you create the symbolic link to the Java JRE plug-in (Java Runtime\
    \ Environment) `libnpjp2.so` to the Google Chrome web browser.\n\n**Notices:**\n\
    Note: Sometimes when you execute the above command you may receive an error message:![](rsrcX1.jpg)\n\
    To correct this simple problem, you must remove the previous symbolic link with\
    \ the following commands:![](rsrcX6.jpg)\nRepeat the command for the creation\
    \ of the symbolic league.\nRestart browser and go to Java Tester to test if Java\
    \ is working correctly.\n\n## Mozilla Firefox\n\n### Instructions for Oracle Java\
    \ 32-bit:\nGive the following commands.![](rsrcXM.jpg)\nThis command creates the\
    \ symbolic link to the Java JRE plug-in (Java Runtime Environment) `libnpjp2.so`\
    \ to your Mozilla Firefox network browser.\n\n### Instructions for Oracle Java\
    \ 64-bit:\nGive the following commands.![](rsrcXU.jpg)\nThis command creates the\
    \ symbolic link to the Java JRE plug-in (Java Runtime Environment) `libnpjp2.so`\
    \ to your Mozilla Firefox network browser.\n\n**Notices:**\nNote: Sometimes when\
    \ you execute the above command you may receive an error message: `ln: creating\
    \ symbolic league './libnpjp2.so ': Existing file`\nTo correct this simple problem,\
    \ you must remove the previous symbolic link with the following commands:![](rsrcY2.jpg)\n\
    Repeat the command for the creation of the symbolic league.\nRestart browser and\
    \ go to Java Tester to test if Java is working correctly.\n\n## Tips\n\nIn Linux\
    \ Ubuntu, you can choose whether or not to use `OpenJDK`, which is a free and\
    \ open implementation of `JAVA` or use `Oracle JDK` and `JRE`. Some prefer to\
    \ use `Oracle Java` (because it is the most up-to-date version of Java and is\
    \ directly supported by Java technology), but it varies.\n\nNote that Oracle makes\
    \ updates to security, execution failures, and performance issues in each new\
    \ revision of Oracle Java. When you install Oracle Java on your system, be careful\
    \ of version changes. See `How to update Oracle Java on Linux Ubuntu` for more\
    \ information.\n\nPlease note that this document is continually being reviewed\
    \ because eventually, Oracle changes the installation.\n\n## Detailed Installation\
    \ Guide\n\n### Installing Oracle Java on Linux Ubuntu\n\nThis article covers how\
    \ to install `1.7.0_45` (32-bit or 64-bit) on Ubuntu-based systems such as Debian\
    \ and Mint. These instructions are for those who want to install Oracle Java.\n\
    \n1. **Check architecture:** Determine if your system is 32-bit or 64-bit. Use\
    \ the terminal to check the Java version.\n2. **Access root:** Open the terminal\
    \ and type `sudo -s` to enter as root user.\n3. **Download/Unzip files:** Unzip\
    \ the downloaded `.tar.gz` files in the `/usr/local/java` directory.\n4. **Set\
    \ permissions:** Make the binaries executable by running the following commands:\n\
    \   ```bash\n   chmod +x jre-7u45-linux-i586.tar.gz\n   chmod +x jre-7u45-linux-x64.tar.gz\n\
    \   ```\n5. **Configure Environment Variables:** Edit the `/etc/profile` file\
    \ using a text editor (like `nano` or `gedit`). Add the following system variables\
    \ to the end of the file to update the `PATH`:\n   (Insert variable configuration\
    \ here based on `/etc/profile`)\n6. **Reload configuration:** Apply the changes\
    \ by running:\n   ```bash\n   source /etc/profile\n   ```\n7. **Verify installation:**\
    \ Check the directories to ensure the uncompressed binaries are present:\n   ```bash\n\
    \   ls -ajre1.7.0_45\n   ```\n"
