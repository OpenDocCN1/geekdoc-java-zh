  trans: "\n\n# 1. 使用 Java 文件模拟器\n\n![](img/rsrcKU.jpg)\n\n*   **对手机进行 Root（根）。**\
    \ 因为这种方法需要将文件复制到系统目录（这在没有 root 权限的情况下是不允许的），所以你需要让手机拥有 root 权限。获取这种权限被称为对手机进行“root（rooting）”。该方法因设备而异，但本指南将帮助你了解如何在大多数安卓设备上进行此操作。\n\
    \n    注意：Java 文件模拟器不会允许你查看用 Java 创建的网页，它只允许你运行 Java 文件。如果你想查看用 Java 创建的网页，请参下一节。![](img/rsrcM3.jpg)\n\
    \n*   **查找并下载适用于安卓的 Java 文件模拟器。** 目前有不同类型的 Java 文件模拟器可用，它们各有优缺点。不同的模拟器在不同的设备上运行效果更好，因此建议下载几个不同的模拟器。这些模拟器在\
    \ Google Play 商店并不提供；`APK` 文件必须从开发者的网站下载。一些最流行的模拟器包括：\n\n    *   `phoneME`\n \
    \   *   `JBED`\n    *   `JBlend`\n    *   `Netmite`\n\n    ![](img/rsrcMK.jpg)\n\
    \n*   **安装并使用 phoneMe。** 从开发者的网站下载 `phoneMe Feature` `APK` 文件。你还需要下载 `OpenIntents\
    \ File Manager` 的 `APK` 文件。将 `APK` 文件复制到你安卓设备的根目录。\n\n    运行 `APK` 文件将它们安装到你的设备上。在电脑上下载\
    \ `JADGen`，然后使用它为任何你想要运行的 `JAR` 文件创建一个 `JAD` 文件。将 `JAR` 文件和 `JAD` 文件复制到设备上的同一个文件夹中。确保\
    \ `JAR` 文件的文件名中没有空格。使用 `phoneMe` 运行文件并选择设备上的文件。![](img/rsrcMX.jpg)\n\n    **安装并使用\
    \ JBED。** 下载 `JBED` 文件并在你的电脑系统上将其解压。将 `APK` 文件复制到手机（设备）的根目录，并使用 `ADB` 将 `libjbedvm.so`\
    \ 文件启动到 `/system/lib` 目录。运行 `APK` 文件将其安装到你的设备上。你可以通过 `ADB` 并输入以下命令来启动 `libjbedvm.so`\
    \ 文件：\n    ```\n    adb push /filelocation/libjbedvm.so /system/lib\n    ```\n\
    \    将你想要运行的任何 `JAR` 文件复制到手机自身的目录。运行 `JBED` 模拟器并按下“菜单”按钮。浏览到 `JAR` 文件，然后选择你想运行的\
    \ `JAR` 文件。![](img/rsrcN5.jpg)\n\n    **安装并使用 JBlend 模拟器。** 下载 `JBlend` 文件并提取内容。将文件复制到手机的存储空间。安装\
    \ `Root Explorer`（根管理器）应用程序。打开 `Root Explorer` 应用并点击右上角的 `r / w` 按钮。将后续文件复制到目标文件夹：\n\
    \    - `ibDxDrmJava.so` - `/system/lib`\n    - `libjbmidpdy.so` - `/system/lib`\n\
    \    - `libjbmidp.so` - `/system/lib`\n    - `javax.obex.jar` - `/system/framework`\n\
    \    - `MetaMidpPlayer.apk` - `/system/app`\n    - `MidpPlayer.apk` - `/system/app`\n\
    \    将你想运行的 `JAR` 文件复制到手机的存储空间。使用 `JBlend` 模拟器选择要上传的文件。![](img/rsrcNG.jpg)\n\n\
    *   **安装 Netmite 模拟器。** 从 `Netmite` 网站下载最新版本。将 `APK` 文件复制到你的设备并运行它以安装 `Netmite`。\n\
    \n    使用 `Netmite` 网站上的转换器将 `JAR` 或 `JAD` 文件转换为 `APK` 文件。将转换后的 `APK` 文件复制到手机并运行进行安装。对所有你想运行的\
    \ `JAR` 文件重复此操作。在你的设备上打开 `Netmite` 并使用它选择任何已安装的 `JAR` 文件。\n\n# 2. 使用远程桌面\n\n![](img/rsrcP2.jpg)\n\
    \n*   **在安卓设备上安装“Chrome 远程桌面”应用程序。** 如果你在浏览时需要访问带有 Java 内容的网页，唯一实现的方法是使用远程桌面应用访问另一台电脑。这将允许你使用该电脑的网页浏览器来加载网页。来自\
    \ Google 的 `Chrome Remote Desktop` 应用程序可以快速将 Chrome 连接到你的电脑，这是配置远程访问的最简单方法。![](img/rsrcP7.jpg)\n\
    \n*   **在你的电脑上安装“远程桌面”扩展。** 你需要在系统中安装 Google Chrome 才能使用它。之后可以从 Chrome 商店免费安装\
    \ `Remote Desktop` 扩展。点击 Chrome 中的“菜单”按钮 (☰ ) 并选择“工具”→“扩展程序”。点击网页底部的“获取更多扩展程序”链接，然后搜索“Chrome\
    \ 远程桌面”。\n\n    安装扩展后，你需要登录你的 Google 账号，然后点击“激活远程连接”按钮。你可以为连接创建一个个人识别码（`PIN`）作为额外的安全措施。![](img/rsrcPF.jpg)\n\
    \n*   **运行“远程桌面”应用程序。** 登录 Google 账号，然后从可用连接列表中选择你的家庭电脑。输入个人识别码（`PIN`）。\n\n![](img/rsrcPP.jpg)\n\
    \n"
