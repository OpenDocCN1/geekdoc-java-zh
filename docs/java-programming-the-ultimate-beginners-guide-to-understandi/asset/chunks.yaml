    that exist in each programming language and which are considered as the basics
    of programming will be explained for those who do not understand any programming.
    Those who have already learned a programming language can skip this section without
    reading it.Java Programming LanguageWhen the first computers appeared, there were
    no high-level languages ​​ like FORTRAN, COBOL, Pascal, C / C ++, Java, which
    we now use. Since the hardware structures of the different machines were different,
    the machine languages ​​ of different brands and models of computers (the only
    language the machines understood) were different from each other. Therefore, the
    first programmers were able to get the computer to work only with the machine
    language of the machine they used. In addition to being challenging to learn the
    machine language, the machine language learned for a machine did not apply to
    different brands and models. To overcome this challenge, the first assembler language
    and then top-level languages appeared. High-level languages ​​ have brought great
    comfort to programmers. Because the programmer could write the source program
    in any language without thinking about the operating system and the machine, for
    example, a source program written in C could be compiled and run on every operating
    system and machine with the appropriate compiler. [Of course, we ignore minor
    deviations from the standard from different companies that write C compilers.]High-level
    languages ​​ such as FORTRAN, COBOL, Pascal, Modula, C, which are now called procedural
    languages, have successfully served programmers for many years; they still do.
    But there was a problem. A source program that was compiled on a particular type
    of machine running under a particular operating system could only be run on those
    machines running under that operating system. When the operating system and/or
    machine type changes; so when the platform changed, the program could not run
    there; it had to be recompiled with a compiler suitable for the new platform.
    We call it platform dependency. What we mean by platform dependency is the fact
    that a source program is compiled with a specific compiler running under a particular
    operating system and can only be run on certain types of computers. For example,
    WindowsIt is not possible to run a computer program compiled on a PC running under
    the operating system on a machine running under the Macintosh or Linux operating
    system.The emergence of different operating systems and a large number of different
    hardware on the market, the development of computer networks, machines connected
    to a network operating under different operating systems of different brands and
    models of computers have exacerbated the problem.The solution to the problem required
    the creation of a language that could operate independently of the platform. This
    was solved with the Java language developed by Sun. The Sun company, however,
    set out to solve this big problem and not to solve it. He wanted to develop a
    language that would make the electrical appliances easy to use. That was soon
    realized that this could only be done on a common platform. In 1995, Sun''s programmer
    James Gosling created Java on all platforms.Gosling made a simple but wonderful
    invention. He designed a typical virtual machine that can be installed on different
    operating systems and different hardware. This virtual machine called JVM (Java
    Virtual Machine) was distributed free of charge. The JVM can be easily installed
    on any platform. Source programs written in Java are converted to a machine language
    that can work with the java compiler in the JVM. On behalf of java byte code called
    by the JVM, this program is interpreted and executed. Java byte code, in a way,
    is the function of source programs written and compiled in procedural languages.Anyone
    who wants to run Java applications can install the JVM on their own machine. For
    this, JRE (Java Runtime Environment) will be enough to download and install the
    program. The JRE is installed on the computer once. Then all Java applications
    can run on this machine. When a java application runs on the machine, the JRE
    automatically creates the JVM virtual machine.JVM is a program that runs when
    needed; Like any program, it is deleted from the main memory when it is done.
    Therefore, it is not possible to damage the machine. Nowadays, most browsers encountering
    java applications are capable of automatically downloading and installing the
    JRE. Java is a simple, modern, object-oriented, type-protected language with good
    features of C and C ++. More than that, it is capable of working on any platform.
    This ability enabled him to find a wide range of applications not only on computers
    but also on internet applications, mobile phones, gaming machines, and home appliances.
    Therefore, we can consider Java as both a programming language and an environment.
    In this environment, operating system, networks, internet programming, database,
    and all middleware (middleware) technologies are located.In summary, Java is a
    simple language. Easy to learn. It has all the skills of a general-purpose language.
    C has good features of C ++ languages. User-friendly and fast application development
    tool.Main features of JavaOn Java''s site, Java''s attributes are specified in
    these terms:'
