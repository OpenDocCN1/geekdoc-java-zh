  trans: "\n\n# 如何在网络浏览器中启用 Oracle Java\n\n要在网页浏览器中启用 Java 插件，请确保你必须在浏览器的插件目录中创建一个符号链接，指向\
    \ Oracle Java 分发版中包含的 Java 插件地址。\n\n**重要提示：** 在 Oracle Java 7 插件中已检测到许多安全漏洞，可能会让你的系统面临风险。要了解更多信息，请参阅以下网站：`Java\
    \ Tester`\n\n## Google Chrome\n\n### Oracle Java 32 位版本操作说明：\n执行以下命令。输入/复制/粘贴：`sudo\
    \ -s`\n通过此命令你将自己启用为超级根用户![](img/rsrcW2.jpg)\n通过此命令你创建目录 `/opt/google/chrome/plugins`![](img/rsrcW7.jpg)\n\
    通过此命令你移动到新创建的目录。在创建符号链接之前，请确保你已处于该目录![](img/rsrcWC.jpg)\n通过此命令你创建指向 Java JRE 插件（Java\
    \ 环境）`libnpjp2.so` 的符号链接，到你的 Google Chrome 浏览器。\n\n### Oracle Java 64 位版本操作说明：\n\
    执行以下命令。输入/复制/粘贴：`sudo -s`\n通过此命令你将自己启用为超级根用户![](img/rsrcWN.jpg)\n通过此命令你移动到新创建的目录。在创建符号链接之前，请确保你已处于该目录![](img/rsrcWU.jpg)\n\
    通过此命令你创建指向 Java JRE 插件（Java 环境）`libnpjp2.so` 的符号链接，到你的 Google Chrome 浏览器。\n\n\
    **注意：**\n注意：有时当你执行上述命令时，可能会收到一条错误信息：![](img/rsrcX1.jpg)\n要解决这个简单的问题，你必须使用以下命令删除之前的符号链接![](img/rsrcX6.jpg)\n\
    重复创建符号链接的命令。\n重启浏览器并进入 Java Tester 测试 Java 是否正常工作。\n\n## Mozilla Firefox\n\n###\
    \ Oracle Java 32 位版本操作说明：\n执行以下命令![](img/rsrcXM.jpg)\n此命令创建指向 Java JRE 插件（Java\
    \ 环境）`libnpjp2.so` 的符号链接，到你的 Mozilla Firefox 网络浏览器。\n\n### Oracle Java 64 位版本操作说明：\n\
    执行以下命令![](img/rsrcXU.jpg)\n此命令创建指向 Java JRE 插件（Java 环境）`libnpjp2.so` 的符号链接，到你的\
    \ Mozilla Firefox 网络浏览器。\n\n**注意：**\n注意：有时当你执行上述命令时，可能会收到一条错误信息：`ln: creating\
    \ symbolic league './libnpjp2.so ': Existing file`\n要解决这个简单的问题，你必须使用以下命令删除之前的符号链接![](img/rsrcY2.jpg)\n\
    重复创建符号链接的命令。\n重启浏览器并进入 Java Tester 测试 Java 是否正常工作。\n\n## 提示\n\n在 Linux Ubuntu\
    \ 中，你可以选择使用 `OpenJDK`（它是 `JAVA` 的免费开源实现）或使用 `Oracle JDK` 和 `JRE`。有些人倾向于使用 `Oracle\
    \ Java`（因为它是最新的 Java 版本并由 Java 技术直接支持），但视而异。\n\n请注意，Oracle 在每个新的修订版本中都会安全、执行失败和性能问题进行更新。当你在系统上安装\
    \ Oracle Java 时，请注意版本变化。参见`How to update Oracle Java on Linux Ubuntu` 获取更多信息。\n\
    \n请注意，本文正在不断审核，因为 Oracle 最终会更改安装方式。\n\n## 详细安装指南\n\n### 在 Linux Ubuntu 上安装 Oracle\
    \ Java\n\n本文涵盖了如何在 Debian 和 Mint 等基于 Ubuntu 的系统中安装 `1.7.0_45`（32 位或 64 位）。这些指令适用于想要安装\
    \ Oracle Java 的用户。\n\n1. **检查架构：** 确定你的系统是 32 位还是 64 位。使用终端检查 Java 版本。\n2. **访问\
    \ root 权限：** 打开终端并输入 `sudo -s` 以 root 用户身份进入。\n3. **下载/解压文件：** 在 `/usr/local/java`\
    \ 目录下解压下载的 `.tar.gz` 文件。\n4. **设置权限：** 通过运行以下命令使二进制文件可执行：\n   ```bash\n   chmod\
    \ +x jre-7u45-linux-i586.tar.gz\n   chmod +x jre-7u45-linux-x64.tar.gz\n   ```\n\
    5. **配置环境变量：** 使用文本编辑器（如 `nano` 或 `gedit`）编辑 `/etc/profile` 文件。在文件末尾添加以下系统变量以更新\
    \ `PATH`：\n   (根据 `/etc/profile` 在此处插入变量配置)\n6. **重新加载配置：** 运行以下应用更改：\n   ```bash\n\
    \   source /etc/profile\n   ```\n7. **验证安装：** 检查目录以确保解压后的二进制文件存在：\n   ```bash\n\
    \   ls -ajre1.7.0_45\n   ```\n\n"
- fmt: "\n## 15. Check if Oracle Java was installed correctly on your system. Run\
    \ the following commands and write down the Java version:\n\n### 16. A successful\
    \ installation of Oracle Java 32-bit will show the following:\n\nType / Copy /\
    \ Paste:\n```bash\njava -version\n```\nThis command shows the version of Java\
    \ that you have on your system. You should receive a message that says:![](rsrc11T.jpg)\n\
    \n### 17. A successful installation of the Oracle Java 64-bit will show the following:\n\
    \nType / Copy / Paste:\n```bash\njava -version\n```\nThis command will show the\
    \ version of Java that you have in the system. You should receive the following\
    \ message:![](rsrc123.jpg)\n\n### 18. Congratulations, you have already installed\
    \ Oracle Java JRE on your Linux system. Now reboot your system. After it restarts,\
    \ your system will be fully configured to run Java programs.\n\n## Optional: How\
    \ to enable Oracle Java in web browsers\nTo enable the Java plugin in your web\
    \ browsers, you must make a symbolic link from your browser's plugin directory\
    \ to the location of the Java plugin included in your Oracle Java distribution.\n\
    \n**Important note:** It’s suggested you be very careful when enabling Oracle\
    \ Java 7 in your browsers, because there are many security problems. Particulally,\
    \ by enabling Oracle Java 7 in your browser if a security flaw is discovered,\
    \ they can enter your system. For more information about security flaws in Java,\
    \ check the following website: Java Tester\n\n## Google Chrome\n### Instructions\
    \ for Oracle Java 32-bit:\nType the following commands.![](rsrc12G.jpg)\nThis\
    \ will then make a symbolic link from the Java JRE (Java Runtime Environment)\
    \ `libnpjp2.so` plugin to your Google Chrome browsers.\n\n### Instructions for\
    \ Oracle Java 64-bit:\nType the following commands.![](rsrc12P.jpg)\nThis will\
    \ then make a symbolic link from the Java JRE (Java Runtime Environment) `libnpjp2.so`\
    \ plugin to your Google Chrome browser.\n\n### Reminders\n**Note:** Sometimes,\
    \ when you enter the above command, an error may appear that says:![](rsrc12W.jpg)\n\
    Restart your browser and then go to Java Tester to see if Java is working in your\
    \ web browser.\n\n## Mozilla Firefox\n### Instructions for Oracle Java 32-bit:\n\
    Type the following commands.![](rsrc133.jpg)\nThis will then make a symbolic link\
    \ from the Java JRE (Java Runtime Environment) `libnpjp2.so` plugin for your Mozilla\
    \ Firefox browser.\n\n### Instructions for Oracle Java 64-bit:\nType the following\
    \ commands![](rsrc13E.jpg)\nThis will then make a symbolic link from the Java\
    \ JRE (Java Runtime Environment) `libnpjp2.so` plugin for your Mozilla Firefox\
    \ browser.\n\n### Reminders:\n**Note:** Sometimes you may receive an error saying:\
    \ `ln: creating symbolic link `./libnpjp2.so ': File exists`\nTo correct this\
    \ problem, simply delete the previous link using the command:![](rsrc13P.jpg)\n\
    Restart your browser and then go to Java Tester.\n\n## Java Programming Lessons\
    \ - Variables (Data Types)\nIn this series of Java programming lessons from scratch,\
    \ we will talk about “Java Programming Lessons - Variables (Data Types).” What\
    \ are variables, what are the types of variables?, variable naming conventions,\
    \ data types, application of circle area calculation in Eclipse IDE, printing\
    \ data types in Netbeans IDE environment, assignment operator and ASCII Table.\n\
    \n*   What is Variable? (What is variable?)\n*   Type of Variables\n*   Variable\
    \ Naming Conventions\n*   Data Types\n*   Circle Area Calculator (Application)\
    \ - Eclipse\n*   Data Types to the Screen (Application) - NetBeans\n*   Literals\
    \ (Integer, Floating Points, Strings)\n*   Integer Literals\n*   Floating Point\
    \ Literals\n*   Application - Literature\n*   Life of Variables - Scope Area\n\
    \n### What is Variable? (What is variable?)\nBefore starting the topic of variables\
    \ that we will explain in Java programming lessons, “What is a variable?” Let's\
    \ talk about it.\n\nJava programs that we want to work with when writing data\
    \ types for a place reserved in the memory variable is called. The reason we call\
    \ it variable is that the content can be changed at any time.![Java Programming\
    \ Courses What is Variable?](rsrc14W.jpg)![](rsrc151.jpg)\n\nIn the above code,\
    \ we assign the value of `10` as integer to the `number` variable. In Java, the\
    \ `=` operator is the assignment operator. They are used to assign the value on\
    \ the right side of the equation to the left.\n\n### Type of Variables\nThere\
    \ are three major kinds of variables in Java. These:\n\n1.  **Local variables:**\
    \ Variables that we define in a method (declare / declaration) in Java are called\
    \ local variables. If we are going to use local variables in the method, we have\
    \ to assign the first value.\n2.  **Instance variables:** Instance, variables\
    \ are defined within the class, ie, non-static variables defined outside the method.\
    \ We do not have to initialize. We just have to give the first value to the final\
    \ variables.\n3.  **Static variables:** Static variables are the static variables\
    \ that we declare in a class. These variables cannot be local. We do not have\
    \ to initialize. In this case, the first variable must be assigned to the final\
    \ variables. We will explain in detail in the following lessons.\n\nIf we explain\
    \ these variables with an example;![](rsrc15B.jpg)\n\n### Variable Naming Conventions\n\
    Variable naming conventions in the Java programming language are as follows:\n\
    *   Variables cannot be from reserved words or keywords defined in Java.\n*  \
    \ Turkish characters are not used in variable names.\n*   Variable names can not\
    \ start with numbers but can contain numbers. However, it can start with a dollar\
    \ (`$`) and underscore (`_`) characters.\n\nVariable names are case sensitive.\
    \ If the variable contains more than one word, you cannot insert any spaces. The\
    \ `_` character can be used instead.\n\n### Data Types\nThere are two types of\
    \ data in Java. These are Primitive types and non-primitive types.\n\n#### Primitive\
    \ Types\n*   Boolean Data Type (takes values `0` and `1`; that is, true and false)\n\
    *   Numeric Types\n*   Character (`char`)\n*   Integral\n    *   `integer`\n \
    \   *   `byte`\n    *   `short`\n    *   `int`\n    *   `longan`\n*   Floating\
    \ point\n    *   `float`\n    *   `double`\n"
