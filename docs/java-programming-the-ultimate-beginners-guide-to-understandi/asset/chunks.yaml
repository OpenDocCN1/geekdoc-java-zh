  trans: "\n\n# if 结构与 if 使用\n\n在 Java 中，`if` 结构基于执行逻辑：如果满足 `condition` 中指定的条件，则执行声明为语句的动作。也就是说，如果条件为真，则执行相应的操作。\n\
    \n```java\nif (condition)statement;\n```\n\n如果程序中存在条件，则使用布尔变量来保持条件内的真（true）或假（false）状态。`sart`\
    \ 存储真或假。让我们来看一个简单的代码实现：\n\n```java\n// If 控制结构\nboolean sart = false;\nsart =\
    \ true;\nif(System.out.println (\"Condition provided, this code worked.\"));\n\
    ```\n\n让我们解释这段代码。首先，我们定义了一个 `boolean` 类型的变量名为 `sart` 并将其赋值为 `false`。然后我们将该变量赋值为\
    \ `true`。当紧接着进入条件代码时，编译器会检查条件是否为真。如果条件实际成立，它将处理 `if` 语句中的代码。换句话说，“条件已提供，此代码已运行。”我们的应用程序结果如下：\n\
    \n> Condition provided, this code worked.\n\n## if 条件逻辑\n\n如果提供了条件，则处理内容中的代码；如果没有提供，则跳过这些代码。到目前为止，我们已经习惯了使用代码块。但正如你所看到的，我们在单行\
    \ `if` 结构中没有使用代码块结构。这是因为只有一个表达式（代码）。如果有多个代码需要处理，我们就必须使用代码块（大括号）。虽然编译器没有规定单行表达式必须使用块，但始终建议放置代码块。\n\
    \n再来看另一个例子：\n\n```java\n// If 控制结构\nint studentNote = 89;\nif (studentNote> 85)\
    \ {\n    System.out.println (\"Student Grade is greater than 85\");\n    studentNote\
    \ = 0;\n}\n```\n\n通过这段代码，我们制作了一个简单的控制结构示例。首先，我们定义了一个名为 `studentNote` 的 `int` 类型变量，值为\
    \ `89`。然后，如果进入条件，将查询 `studentNote> 85`。由于学生分数大于 85（`89> 85`），代码块中的代码被处理。结果如下：\n\
    \n> Student Grade is greater than 85\n\n## if else 结构与用法\n\n当我们讨论在 `if` 结构中提供\
    \ `condition` 的用法时，我们提到了内部代码块会被处理。那么，如果我们必须说明在条件未提供的情况下该做什么，该怎么办呢？这就是 `if else`\
    \ 结构发挥作用的地方。让我们写一些简单的代码来看 `if else` 结构的用法：\n\n```java\npublic class IfKontrolYapisi\
    \ {\n    public static void main (String [] args) {\n        // If 控制结构\n    \
    \    int studentNote = 89;\n        if (studentNote >= 85) {\n            System.out.println\
    \ (\"Student Grade is greater than or equal to 85.\");\n        } else {\n   \
    \         System.out.println (\"Student Grade is less than 85.\");\n        }\n\
    \        System.out.println (\"Student Grade:\" + studentNote);\n    }\n}\n```\n\
    \n检查我们的代码。首先是一个 `int` 变量和一个值 `89`。然后到达结构部分。在这里，查询的是“大于 85”的问题，只有这部分被处理了。`Else`\
    \ 部分没有通过。最后，学生分数被打印在屏幕上。我们应用程序的输出如下：\n\n> Student Grade is greater than or equal\
    \ to 85.\n> Student Grade: 89\n\n如果学生的分数是 75，这次代码将被处理并显示：\n\n> Student grade is\
    \ less than 85.\n> Student Grade: 75\n\n这就是 `if else` 结构的基本工作逻辑。如果我们必须查询多个情况，该如何使用\
    \ `if else` 结构呢？让我们看看程序：\n\n```java\npublic class IfKontrolYapisi {\n    public\
    \ static void main (String [] args) {\n        // If 控制结构\n        int num1 =\
    \ 45, num2 = 89;\n        if (num1 == num2) {\n            System.out.println\
    \ (\"Numbers are equal.\");\n        } else if (num1> num2) {\n            System.out.println\
    \ (\"Number1 is greater than number2\");\n        } else {\n            System.out.println\
    \ (\"Number1 is less than number2\");\n        }\n        System.out.println(\"\
    Number1:\" + num1 + \"\\nNumber2:\" + num2);\n    }\n}\n```\n\n回顾一下流程。首先，我们定义了两个不同类型的\
    \ `int` 变量，名为 `num1` 和 `num2` 并分配了值。然后我们使用 `if else` 结构来比较这两个数字。程序比较 `num1` 和\
    \ `num2`。如果 `num1` 等于 `num2`，屏幕将显示 `Numbers are equal ..`。如果 `num1` 大于 `num2`，屏幕将显示\
    \ `Number1 is greater than number2`。如果不满足这两个要求，将进入另一个块并显示 `Number1 is less than\
    \ number2`。\n\n运算符 `==` 检查两个变量是否相等。注意：`!` 运算符提供值的取反。`!=` 运算符用于检查不相等。结果如下：\n\n\
    > Number1 is less than number2.\n> Number1: 45\n> Number2: 89\n\n程序在退出 `if else`\
    \ 结构后会打印 `num1` 和 `num2` 的值。\n\n## if else - 应用\n\n这是 `if else` 的一个最终示例。在 `if`\
    \ 结构中始终使用条件，但没有规定必须使用单个条件。换句话说，你可以在 `if` 结构中包含多个条件。看看应用：\n\n```java\npublic class\
    \ IfKontrolYapisi {\n    public static void main (String [] args) {\n        //\
    \ If 控制结构\n        int months = 4;\n        String seasons;\n        if (months\
    \ == 3) {\n            seasons = \"Winter\";\n        } else if (months == 4)\
    \ {\n            seasons = \"Spring\";\n        } else if (months == 5) {\n  \
    \          seasons = \"Summer\";\n        } else {\n            seasons = \"Autumn\"\
    ;\n        }\n        System.out.println(months + \" belongs to \" + seasons);\n\
    \    }\n}\n```\n\n在程序中定义了两个变量 `months` (int) 和 `seasons` (string)。我们的目标是根据给定的数值确定\
    \ `seasons`。为此，我们使用了带有不同条件的 `if else` 结构。在每个 `else if` 中都会进行查询。`months == 3` 或\
    \ `months == 4` 或 `months == 5` 意味着如果 `months` 为 4，查询将被正确评估并处理该块。\n\n## 闰年 - 应用\n\
    \n年份计算器程序当然是 `if else` 的用法之一。\n\n```java\npublic class IfKontrolYapisi {\n   \
    \ public static void main (String [] args) {\n        // If 控制结构\n        int\
    \ year = 2016;\n        if (year % 4 == 0 && (year % 100 != 0 || year % 400 ==\
    \ 0)) {\n            System.out.println(year + \" is a year\");\n        } else\
    \ {\n            System.out.println(year + \" no longer a year\");\n        }\n\
    \    }\n}\n```\n\n## 嵌套 if 结构，用法\n\n某些情况需要使用嵌套 `if` 结构。这里有一个简单的示例：\n\n```java\n\
    public class IfKontrolYapisi {\n    public static void main (String [] args) {\n\
    \        // 嵌套 结构\n        int number = 8;\n        if (number != 0) {\n     \
    \       if (number > 0) {\n                System.out.println(\"Result:\" + (1\
    \ / number));\n            } else {\n                System.out.println(\"Number\
    \ must be greater than 0.\");\n            }\n        }\n    }\n}\n```\n\n在我们的程序中，外层的\
    \ `if` 结构检查 `number` 的值。如果 `number` 不为零，则进入 `if` 结构。这时另一个 `if` 也会询问数字是否大于零。\n\n\
    ## switch 结构，用法\n\n`switch case` 结构是决策控制结构之一，类似于 `if else`。然而，与 `if else` 结构相比，它有更特定的领域。在该结构中，相关的\
    \ case 将根据 `switch (state)` 语句中的状态执行。\n\n```java\npublic class SwitchCaseYapisi\
    \ {\n    public static void main (String [] args) {\n        // switch 结构\n  \
    \      int i = 0;\n        switch (i) {\n            case 0:\n               \
    \ System.out.println (\"The value of i is 0.\");\n                break;\n   \
    \         case 1:\n                System.out.println (\"i is 1.\");\n       \
    \         break;\n            case 2:\n                System.out.println (\"\
    i value: 2\");\n                break;\n            case 3:\n                System.out.println\
    \ (\"i value: 3\");\n                break;\n            default:\n          \
    \      System.out.println (\"Default message\");\n                break;\n   \
    \     }\n    }\n}\n```\n\n## break, continue 和 return\n\n- `break` 用法\n- 应用 1\n\
    - 应用 2\n- 数组中的搜索\n- `continue` 用法\n- 应用\n- `return` 关键字\n\n## 二维数组\n\n我们已经见过行列的一维数组和二维数组。随着第三维的引入，出现了三维数组。虽然\
    \ `3D` 的概念很困惑，但你可以将 `3D` 视为二维数组。通常二维数组是 `i`，而列 `j` 是 `[i][j]`。由于三维中也包含了深度，所以有行、列\
    \ `[k][i][j]`。正如所说，你可以将三维数组看作二维数组。\n\n```java\npublic class Arrays {\n    public\
    \ static void main (String [] args) {\n        // Java 课程，三维序列\n        int numbers[][][]\
    \ = new int[3][4][5];\n        int value = 1;\n        for (int k = 0; k < 3;\
    \ k++) {\n            for (int i = 0; i < 4; i++) {\n                for (int\
    \ j = 0; j < 5; j++) {\n                    numbers[k][i][j] = value;\n      \
    \              value++;\n                }\n            }\n        }\n       \
    \ for (int k = 0; k < 3; k++) {\n            for (int i = 0; i < 4; i++) {\n \
    \               for (int j = 0; j < 5; j++) {\n                    System.out.print(numbers[k][i][j]\
    \ + \" \");\n                }\n                System.out.println();\n      \
    \      }\n            System.out.println();\n        }\n    }\n}\n```\n\n（注：原文后部分存在大量重复和无意义的字符堆，已根据核心技术逻辑完成翻译转换。）\n\
