    the decimal system. `45` Number of 16lık system until the money `0x2D` value and
    2lik system with money until the `0b00101101` values have been appointed.


    We do not need to use any expression when writing numbers in the decimal system
    in Java. However hex value per''re going to do the assignment number `"0x ...."`
    And the binary value per''re going to do the assignment number `"0b ...."`. We
    have to put expressions. From these statements, the compiler will understand in
    which system the number is given.


    When we compile the application, we get the following result:

    ![Java programming lessons Integer literatures result](rsrc1CK.jpg)


    As it is seen, the compiler analyzed the number systems and gave us the result
    as an `int` value in the decimal system.


    # Floating Point Literals


    Decimal number systems can also be expressed in different ways. When evaluating
    `float` numbers, the letter `f` should be placed immediately to the right of the
    numeric value. If not, the compiler accepts a `double` number.


    Let''s clarify the issue with an application. First, let''s give the codes:

    ![](rsrc1CV.jpg)


    The screenshot of our program is as follows:

    ![java programming lessons floating point literals 1](rsrc1CZ.jpg)


    Let''s explain our schedule. Two `double` units of type `d` and 1 unit also `float`
    we define a variable of `n`. We put the same values in it. Although the same value
    is assigned to the variables `d1` and `d2`, we have stated that the representation
    may be different. The state indicated by the letter `e` indicates that that number
    will have a value greater than 10. `1.3456e2 = 1.3456 x 10^2 = 134.56`.


    We have shown that we should put the letter `f` at the far right of the value
    while giving value to `float` numbers. When you run our program, you can see that
    the result is as follows:

    ![java programming lessons floating point literals 2](rsrc1D6.jpg)


    # Application - Literature


    Now let''s make a general application that includes other types of variables.
    In our program, we have defined `long`, `byte`, `float` type variables and printed
    their values on the screen.


    Our codes are as follows:

    ![](rsrc1DJ.jpg)


    Screenshot of the program:

    ![](rsrc1DR.jpg) ![java programming lessons variable literature 1](rsrc1DV.jpg)


    When we look at the values given to the variables in our program, we see that
    there is an underscore character `_` genel. The compiler does not see this character,
    we can only use `long` numbers to make them more readable or to fit a certain
    format.


    You have noticed that we use the letter `L` in the `long` data type and the letter
    `F` in the `float` data type. The output of our program is as follows:

    ![](rsrc1E2.jpg)


    # Life of Variables - Scope Area


    In Java, each variable has a range where `n` is defined. This field is in the
    block where the variable is defined. Think of the outermost set in mathematics
    and its subsets. The life of the elements in the subsets in the interior is as
    much as the clusters in which they are located. However, the life of the elements
    within the outermost cluster is as much as the area of the outermost cluster,
    which includes subsets.


    Here is a rough template to explain this situation. There are 3 coverage areas
    in the `Main` method. The outermost coverage area 3 is the largest and covers
    areas 1 and 2. You can also access the number `num1` defined in field 3 from blocks
    1 and 2.


    The variable `num2` defined in field 2 covers fields 1 and 2 and has access in
    these regions. You cannot access (use) variable `number2` outside field 2.


    The innermost No. 1 area is `sayi3` the reputation habitats and lives only in
    this block. As a result, each variable can be accessed from anywhere within the
    defined block. But he can''t get out of the block.


    # Java Programming Lessons - String Class


