  trans: "\n\n# 非基本类型 · Stringer · 数组 · 等\n\n![Java 编程课程数据类型](img/rsrc16P.jpg)\n\n\
    让我们来讨论一下 Java 中基本类型的默认值。`boolean` 类型默认为 `false`，而 `char` 类型默认为 `'\\u0000'`。`Byte`、`short`\
    \ 和 `int` 类型默认被设置为 `0`。`long` 类型默认为 `0L`，而 `float` 类型的默认值为 `0.0f`，`double` 类型的默认值为\
    \ `0.0d`。除非我们在数值类型末尾放置一个字母来指定其类型，否则它表现得像 `int` 类型。由于这个原因，在 `long` 类型末尾放置了 `L`\
    \ 或 `l`。如果我们不在小数末尾放置字母，它的行为也像 `double`。因此，我们在 `float` 类型变量的末尾放置了字母 `F` 或 `f`。\n\
    \n在逗号敏感性双倍的 `float 'tan` 的值要高得多。变量 `char n` 变为 `'a,' 'Z'`，因为我们可以赋值如 `65` 或 `'\\\
    u0042'` 作为值赋值。现在让我们在应用程序中展示我们目前提到的变量类型的理论知识。\n\n## 圆面积计算器（应用） - Eclipse\n\n通过计算圆面积来创建一个侧边应用。计算圆需要该圆的半径和\
    \ pi 数。（ Area = Pi * r² ）\n\n`Circle Area = number * (radius * radius)`\n\n计算完成。上述语句计算\
    \ `Pi * r²` 的值并将结果赋值给 `Circle` 字段变量。因此我们需要三个不同的变量。这些是：`area`、`number` 和 `radius`。\n\
    \n让我们使用这些变量开始我们的程序。在使用变量之前，我们需要先定义它（声明）。变量定义：\n`[variableType] variableName ;\
    \ // Java 中的代码；以分号结束.`\n`[variableType] variableName = value ;`\n\n完成。在定义变量时，我们可以赋值第一个值，也可以稍后赋值第一个值。在\
    \ Java 中，`=` 运算符是赋值运算符，用于初始值赋值。\n\n![](img/rsrc178.jpg)\n\n与表达式 ![](img/rsrc17H.jpg)\
    \ 相同。在这些词的内存中，双精度类型 `n` 在 `pi` 中专门用于此区域以及名为 `3.14` 的面积，我们放入该值。\n\nEclipse IDE\
    \ 的用户首先创建一个名为 `VariableTypes` 的项目。在 `src` 文件夹上通过右键点击 `> New > Class`，在主方法 `sayisaltip`\
    \ 中，他们创建一个命名的类。然后将以下代码添加到 `NumericTypes.java` 类中。\n\n```java\npublic class NumericTypes\
    \ {\n    public static void main(String [] args) {\n        // TODO Auto-generated\
    \ method stub\n        // JAVA 中的变量类型\n        // byte: 数字, 1 字节 (8 位)\n     \
