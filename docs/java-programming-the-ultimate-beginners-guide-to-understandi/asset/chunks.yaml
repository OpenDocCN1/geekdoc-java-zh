    \ only require to install Java JRE to operate applications.\n\n### Installing\
    \ Java JDK on Ubuntu\nFor those who wish to install Oracle JDK and be able to\
    \ develop programs with Java JRE.\n\n### How to enable Java in your browser in\
    \ Linux\n\n1.  **Check if the architecture of your Linux operating system is 32-bit\
    \ or 64-bit.** Open a terminal and run the following command:\n    ```\n    file\
    \ /sbin/init\n    ```\n2.  **Examine if you have Java installed on the system.**\
    \ To do this, run the `java` command from the terminal.\n    Open a terminal and\
    \ then give the following command:\n    ```\n    java -version\n    ```\n    If\
    \ you have OpenJDK installed, then the command will return the following:\n  \
    \  `java version \"1.6.0_21\"` OpenJDK Runtime Environment (IcedTea6.10pre1-0lucid1)OpenJDK\
    \ using 64-Bit Server VM (build 19.0-b09, mixed mode)\n3.  **Clear the OpenJDK\
    \ / JRE completely for your system and create a directory to keep your Oracle\
    \ Java JDK / JRE binaries.** This prevents system conflicts and confusion between\
    \ different versions of Java. For example, if you already have the OpenJDK / JRE\
    \ installed, you can delete it using the following (command missing in source\
    \ text).\n4.  **Download Oracle Java JDK / JRE for Linux.** Be sure to select\
    \ the correct combination of compressed binaries for your 32-bit or 64-bit system\
    \ (which ends in `.tar.gz`).\n    - If you have 32-bit Linux Ubuntu, then download\
    \ the Oracle Java binaries for 32-bit.\n    - If you have 64-bit Linux Ubuntu,\
    \ then download the Oracle Java binaries for 64-bit.\n    - Optional, download\
    \ Oracle Java JDK / JRE documentation select `jdk-7u17-apidocs.zip`.\n5.  **Copy\
    \ the Oracle Java binaries to the `/usr/local/java` folder.** It is very common\
    \ for them to download: `/home/\"your username\"/Downloads`.\n"
