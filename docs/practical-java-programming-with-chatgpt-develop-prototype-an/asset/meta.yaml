- - '#'
  - 前言
- - '##'
  - 第 1 章 涵盖了与软件开发相关的问题，这些问题是以（加粗**）形式向 ChatGPT 3.5 AskAI “手机应用”提出的。我们还涵盖了 ChatGPT
    作为 Web 应用程序的安装以及 Android 手机应用程序的安装。书中还描述了回答内容的版权问题以及 ChatGPT 的基本用法。
- - '##'
  - 第 2 章 涵盖了用于测试 ChatGPT 对良好编程实践理解的 ChatGPT 提示词。我们要求它定义对“SOLID”原则的理解，它几乎瞬间就给出了回答。以下输出仅为引言：
- - '##'
  - 第 3 章 涵盖了使用 OpenAI Java API 接口 ChatGPT AI 系统所需的 Java 代码。ChatGPT 提供了一个如何使用 OkHttp
    库向 API 发请求的示例。为了使用该 API，我们描述了获取 OpenAI API 密钥所需的方法。
- - '##'
  - 第 4 章 涵盖了为了提供用于二分查找的 Java 程序代码而提出的问题。二分查找方法接收一个排序后的整数数组和一个要搜索的目标整数。如果在数组中找到目标整数，则返回该整数的索引；如果未找到则返回
    -1。
- - '##'
  - 第 5 章 我们涵盖了最新开源 Eclipse Java IDE（Eclipse IDE 2023-06 R – 适用于 Java 开发者的 Eclipse
    IDE）的下载与安装，以及在 MS Windows 10 和 RedHat Enterprise Linux (RHEL 8.x) 上的逐步安装步骤。随后，我们通过创建
    Java BinarySearch 项目并检查 Java 程序输出，描述了二分查找程序的详细实现和验证。
- - '##'
  - 第 6 章 涵盖了对 MP4 音乐文件进行傅里叶分析以分离乐器人声。这是一项复杂任务，涉及解码 MP4 文件、信号处理和应用源分离技术等多个步骤。ChatGPT
    提供了所需步骤的大纲指南，并为每个步骤建议了一些库。一个简单的任务（ChatGPT 提供了完整的运行代码）是使用 Java 代码对正弦波进行傅里叶分析。
- - '##'
  - 第 7 章 描述了 ChatGPT 生成的用于快速傅里叶变换的 Java 代码。要求 ChatGPT 提供示例 Java 代码来演示快速傅里叶变换。展示了一个使用
    Apache Commons Math 库演示快速傅里叶变换 (FFT) 的示例代码。
- - '##'
  - 第 8 章 涵盖了 ChatGPT 生成的示例 Java 代码，用于文档建立索引并输出关键词列表以及相关的文档页码。ChatGPT 提供的代码使用 Lucene
    库创建文档及其关联关键词的索引。它还允许根据关键词搜索文档并返回文档路径。
- - '##'
  - 第 9 章 描述了如何提示 ChatGPT 提供 Java 代码，通过测量截面的尺寸分布，利用 Saltikov 确定确定不透明材料中颗粒的尺寸分布。ChatGPT
    生成此代码提示用户输入测量的截面数量、每个截面的尺寸以及曲线下的面积。然后它使用 Saltikov 确定计算颗粒尺寸分布并打印结果。
- - '##'
  - 第 10 章 解释了 ChatGPT 如何生成 Java 代码来反转三角矩阵以获取多项式系数。提示 ChatGPT 提供一个示例 Java 程序，其代码通过反转三角矩阵获取一组多项式方程结果的多项式系数。创建的
    Java 代码提示用户输入多项式的次数和一组多项式方程的系数。然后它使用高斯消元法反转生成的矩阵并获取多项式系数。最后，它打印多项式的系数。
- - '##'
  - 第 11 章 涵盖了使用 ChatGPT 生成示例 Java 代码，通过 FileNet Java API 将文档存储在最新的 IBM FileNet 文档管理系统中。ChatGPT
    生成的代码在下载额外的库后，建立了与 FileNet 服务器的连接，创建了新文档，设置了文档属性，添加了内容，保存了文档，然后将其归档到指定的对象存储（Object
    Store）文件夹中。
- - '##'
  - 第 12 章 涵盖了 ChatGPT 用于程序开发的结论和未来。我们描述了 ChatGPT 3.5 在 2021 年 9 月的知识截止日期，以及 OpenAI
    基金为增强该知识库的持续开发以及目前发布的测试版 ChatGPT 4.0 的开发。我们还对未来 ChatGPT 5.0 版本的路线图给出指示。
- - '##'
  - 第 13 章 提供了附录，包含参考文献和额外的 ChatGPT 问题，以及支持 AI 开发的其他 IBM 系统信息，包括量子计算的发展对 AI 处理的影响。
