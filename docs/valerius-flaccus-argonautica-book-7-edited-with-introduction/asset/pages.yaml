  md: '# Commentary, lines 511–13


    # 511–38. MEDEA INFORMS JASON OF THE NATURE OF HIS NEXT TASK


    After a brief embarrassed silence, Medea not only tells Jason of the difficulty
    involved in stealing the fleece, but terrifies him by arous the guardian serpent
    to rage.


    511–15. These lines are marked by verbal references to the scene’s beginning (407–19),
    references which underscore the altered nature of the lovers’ relationship. the
    perception of *nunc* (512, 514) implies that the lovers oscillate between joy
    and shame until Medea speaks (cf. A 6.3102-3: ἀμω δ’ ἄλλοτο μέν... “Of them at
    one time… but again then”).


    511. haecubi dicta: This formula for the transition from speech to narrative is
    Ennian in origin. (*quam tibi ex orationem duriter dictis*, Delamo, 258 Jocelyn;
    see Norden [1994] on Virg. A. 6.628, Horsfall [2000] on A. 7.471, [2013]) on A.
    6.628 [‘lofty, archaic'']. It is common in epic (Virg. A. 1.81, 5.32, 315, 8.175,
    Luc. 2.500, VF 2.384, *Stab.* 8.838, Sil. 16.393). Virgil favours the longer nature:
    *haecubi dicta* (2.790 and seven more times); VF uses Virgil’s formula only (269).
    Here we need to understand either sunt or doit.


    defixus utere: Represents the description of Medea and Jason at the beginning
    of their meeting (407).


    512. oraulet...laeta. Calls 408–9 where Medea longed for Jason to raise her eyes
    and speak: *iamiam lo levare* | Aesoniden farique comet Medea priorem. Both can
    now do so joyfully the extent to which their sense of shame has been weakened.


    audaci…iuenta: *While audax* and cognates can be positive (e.g. VF 2.264, where
    *audacia* is of Hippolyses’ rescue of Thoas), they are often pejorative (e.g.
    6.423 [with Fechini’s 2006 note], where *audax* Ariasmenus meets instant death,
    and 7.573–4, where *audax…Idas shudder*). The context suggests that the word is
    used pejoratively.


    513. ora timius dulcis raptentia rius: Roughly translates AR *τς δ ἀμαγνᾶ ἵπρασεψ*
    (3.018–19), snatched the sparkle of her eye. Odysseus’s lovers adapt AR when receiving
    a new girlfriend: *tu quoque, quae rostrost niupciero oellos* (A. 2.199; cf. 3.11-48),
    as does his Medea (*Her. 12.36); *abstulenturant oculi nomina nostra tua*. VF
    varies both AR and Vid by making the exchange of glances mutual, an exchange expressed
    on the page through interwoven word. Gaston (185) notes that ‘the predominantly
    dactlic rhythm…conveys the gentle, surreptitious snatching of sweet glances by
    the young lovers.'
