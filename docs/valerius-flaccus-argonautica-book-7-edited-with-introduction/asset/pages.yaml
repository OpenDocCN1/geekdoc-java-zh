  md: '94


    Commentary, lites 6–7


    Delight in oxymoron is characteristic of imperial literature. Among epic poets
    it is a key strategy of Ovid, Lucan, and Statius. In Metamorphoses paradox and
    oxymoron are particularly appropriate in transformations, a state of e.g. Hardie
    [2002: 42–5], Tissol [1997: 13–18]]; in Lucan, as Bartsch (1997: 49) says, ‘it
    is a gesture towards the collapse of the lexical and semantic system in which
    works’; while in Achilles paradox is central to Statius representation of Achilles’vasena
    (Davis [2015a]). Kleyweg (1986: 2475–27) claims that oxymoron is one of VF’s favourite
    figures and lists some examples (including this one). Other examples in Book 7
    occur at 10 (uolen…trahor), 103 (medies intera parentes), 127 (molti…ira), 215
    (fibile gauden), 566 (ardentes… tenebras), 572 (incedia fluctu), 585–6 (ignis
    frigidus), 597 (timide minimatem). Oxymoron in this case underlines the paradoxical
    nature of Medea’s position (see below on 10).


    6-7. utertere, scire: Historic infinitives. Woodcock §21 explains: ‘The Historic
    Infinitive is used in narrative to describe an unfolding scene, a state of feeling,
    or the beginning or repetition of striking actions.’ But historic infinitives
    are used seldom. There are usually two or more; OLS 527–31. VF is clearly concerned
    to describe both Medea’s state of feeling and the feeling of a striking action.


    The construction is frequent in histories (especially Sallust, but also Livy and
    Tacitus). Schlicher (1914: 380–1) argues that Virgil’s use of it in the Aeneid
    (32 times) guaranteed its place in subsequent epic poetry. Schlicher (1915) discusses
    it in imperial verse and lists all examples.


    6. insomnia: Means both ‘sleeplessness’ and ‘dream’ (OLD 1, TLL 1936.66; OLD 2,
    TLL 1938.12). Sleepness is characteristic of the lower in elegiac poetry (e.g.
    Prop. 2.25.47, Ov. Am. 1.2-1–8). But here the word most vividly recalls Dido’s
    report of her, the first words she utters in Aeneid 4: Anna soror, quae me sum
    insomnia terrent! (4.9).


    Note VF’s use of hyperbaton in this indirect question. We might have expected:
    nec scire malo pereat. Garson (1970: 186) observes that the confused order here
    reflects the confusion of Medea’s mind. VF employs an indirect question in primary
    sequence after the unexpected present subjunctive enlivening the expression.'
