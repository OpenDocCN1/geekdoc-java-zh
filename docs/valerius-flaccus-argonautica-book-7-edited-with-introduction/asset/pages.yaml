  md: '# Commentary, lines 14–16


    as seeking the golden fleece over the vast sea (aequore tanto, 6.592). Reference
    to separation by sea is appropriate in a poem which Jason Argo''s voyage as fulfilling
    Jupiter''s desire to abolish separation (1.246–7). Cf. of the Ovidian Medica''s
