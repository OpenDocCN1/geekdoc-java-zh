  md: '# 240 Commentary, lines 547–52


    **547. primum:** Since Aeetes claims to have ploughed the field in the past (62–4),
    primum presumes that Jason will be the first to plough the field since Aeetes''
    decline. Emphasis on primacy is appropriate in a poem whose first word is prima.


    **548. uiolentas flammas:** Foreshadows VF''s description of the field at 571–2
    and alludes to Ovid''s description of Aeetes'' bulls (Met. 7.109: uoluenta flammas).
    Cf. [Tib.] 3.4.86 (of the Chimaera), Stat. Sil. 4.40 (of Vesuvius), Sil. 9.446
    (of Pallas'' helmet).


    **549. exeat:** For *exire as spring up, grow, sprout* (OLD 9) see Virg. G. 2.53,
    81, 368, Var. R. 1.31.2, 145.1.


    **Haemonio...colono:** Referring to the hero as a farmer is doubtless a slur.
    Cf. Gesander''s result unito to the defeated Canthus, as the Argonauts Argicolis...
    colonis (6.334). Given the nature of the task that Aeetes has promised, it is
    not surprising that he uses agricultural language (cf. 62–72). But calling Jason
    a ''famer'' also reminds of the poem''s broader concern with technology and its
    consequences, because agriculture, like sailing, is a postlaparian activity (see
    above 469).


    **memiss memoranda:** The adjective is sarcastic. Aeetes expects the harvest to
    be memorable/although Jason will not remember it. Aeetes, however, is wrong: (a)
    Jason will survive, so that he and others will recall the event, and (b) his victory
    is recorded in epic poetry. For the earthborn men as a ''harvest'' see 7.69, 469.


    **550. tuque tu pestem in Graium da, nata, draconem:** MSS are divided of this
    line, with V offering *pestem* and *lim*. (V''s reading is usually reported as
    *partim*. The third letter, however, resembles *an* and so that an original *s*
    has been altered to an *r*) Heinsius [1702: 395], R. M. Thomson advises as *partim*
    cannot be right (a) it makes no sense in this context and (b) the adverb always
    appears in pairs in classical epic (Virg. A. 10.330-1, 11.204-5, cf. 5.187: *parte
    prior, partim*; Met. 1.40-1, 2228–9, 436–7, 5189, 646–7, 7.226–15, 526; VF 3.439–40)
    Although *partim* is not a Latin word, it is close to Meyncke''s (1865: 51) suggestion
    in *pestem*. I accept Courney''s variation *pestem* because it produces more elegant
    phrasing (cf. Liberman [332, 301]).


    **Graium:** Plural, not accusative singular, looking forward *pereant*.


    **551. aspect pereant uelleris:** Aeetes hopes that the Argonauts might perish
    within sight of the fleece (OLD aspect 3; cf. TLL 802.78–82). Cf. Cic. Ver. 2.1.12:
    *quam tempus in otidiano aspectu populi Romani positum est.


    **552:** Aeetes rounds off his speech with a bloodthirsty remark in the form of
    a Golden Line (see above 24–5). For *tergum* used of the golden fleece see Ov.'
