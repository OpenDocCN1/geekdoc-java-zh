    Others refers to transport (e.g. Masierius [1519: fo. cv]), a reading that finds
    adherents (e.g. Soubrian: ainsi qu char abandonné); Barich agrees: ‘just like
    a chariot alone’. The narrative function of highlighting the exceptional nature
