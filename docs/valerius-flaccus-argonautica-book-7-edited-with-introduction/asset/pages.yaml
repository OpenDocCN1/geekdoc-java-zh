  md: 'Commentary, lines 647–51


    4.170–5, A. 8.439–53, Luc. 7.150. Wide separation of adjective and noun (niger
    ...|... Cyclops), although puzzling at first (who or what is niger?), throws Cyclops
    into prominence. Reference to the thunderbolt here reminds the reader that completing
    this part of his mission Jason is helping to fulfill Jupiter’s plan for the world
    (1.531–73).


    647. rutilique a fulminis estu: For rutilus de fulmen Ov. Her. 364, VF 6.56.


    648. fugit: This is Heinsius’ (reported in Burman [1724]) suggested correction
    of inherited fur. furit makes little sense in the context, while fugit has the
    advantage of recalling euolat (644).


    Siculo: This is Fontius’ correction of transmitted sicco. Whenever VF mentions
    the Cyclops/Cyclopes, he notes the connection with Sicily or Etna (1.136, 4.104,
    287). The connection, at least as Euripides (Cyc. 20) and Thucydides (6.2), is
    in Latin poetry (e.g. G. 4.173, A. 8.416–19, Ov. Met. 14.1–7, Sen. Thy. 582–3,
    Luc. 7.14–50).


    649–AS closes Book 3 by focusing on Aetes’ withdrawal from the field, wondering
    how he threw the Greeks (1403–7). VF, by contrast, emphasizes Jason’s state of
    mind.


    649. reddicus hic turnus sociusque amplexus quiantes: Cuft. Turnus’ return to
    his comrades at the event of Aeneid 9 (818); et laetum sociis abluta caedis remit.
    For Turnus as a model for Jason seen after 572.


    hic: Against some recent editors (e.g. Liberman, Soubiran, Spaltenstein), I retain
    hic. Francisius (Schenkl [1883: 143]) emation hinc is both unnecessary and unnecessarily
    precise. I treat hic as a pronoun referring to Jason.


    650. mendacem...regem: For Jason’s understanding of the treachery of tyrants sees
    over 91–2.


    promissa resposse: The verb implies the justice of Jason’s claim on the fleece
    (OLD 2: ‘to claim as one’s right, due’) cf. Virg. A.12.1–2: Turnus infractos adverso
    Marte Latini; de fiducia timet, nunc missa responci).


    651–nec, si ipse sit igerat ultra | qui pepigit: Some editors (e.g. Perutelli,
    Liberman) accept Burman’s (1724) different: ‘I would prefer, quae pepigit; though
    it makes little difference. Actually, it makes a great Difference. Given that
    it is resentment towards Aetes that connects Jason, not desire for the fleece,
    transmitted qui is the superior reading.


    in pacem dextrum: For the symbolic significance of the right hand see above on
    344. Virgil combines the idea of peace and (literal) right hands (A. 7.226, 11.414).
    Jason’s thought recalls his hope for peace with Aetes'
