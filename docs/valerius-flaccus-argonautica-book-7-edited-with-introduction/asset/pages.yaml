  md: '# Gaius Valerius Flaccus: Argonautica, Book 7 79


    first to fall and no one was left behind: the earth suddenly swallowed up her
    own corpses.


    [644] Immediately Aeson’s son escapes in steaming armour to the river, just as
    Mavors from Getic dust enters Hebrus with his horses and burns the slugish river
    with his sweat; or when a Cyclops, black with the heat of the glowing thunderbolt,
    flees from the cavern and recovers breath in Sicily’s sea. Returned at last and
    embracing his exultant comrades, he does not deign now to demand his promises
    of the lying king nor, if he made the pledge were to bring him the fleece of his
    own accord, would he wish any longer to return to the right hand of peace. Both
    men departed fiercely, both making threats.'
