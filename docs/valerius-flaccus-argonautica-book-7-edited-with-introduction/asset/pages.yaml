    death$^{18}$ or to a failure in the manuscript tradition$^{19}$ cannot be resolved.${20}


    # 2. THE POEM


    # 2.1. Intended length


    Nor can the question of the poem''s intended length be answered with complete
    certainty. There is, however, a well-founded consensus that Schetter right when
    he argued that this was to be a poem in books.${21}$ First, if Valerius aimed
    to produce a poem roughly the same length that of Apollonius (5,836 lines), then
    he needed to write roughly 250 additional lines to match his Greek predecessor.
    That would fill out Book 8 to a reasonable length for a book of Latin poetry.
    Second, like the Aeneid, *Argonautica* falls into two distinct halves, with Books
    1–4 describing the voyage and Books 5–8 events in Colchis. Given that Valerius
    adopted Virgil as a model for writing epic rather than Ovid or Lucan, it seems
    probable that he followed the *Aeneid*''s epic structure when structuring his
    material. This argument gains additional strength from the fact that Valerius
    mimics Virgil in placing his epic poem third (5,217–20) but slightly later (cf.
    A. 7.37–45), because it implies that *Argonautica* is the beginning of the second
    half. The suggestion of Hershkowitz and Nesselrath that Book 8 and the poem ended
    with the killing of Abyrtus is attractive precisely because it would constitute
    another structural parallel with the *Aeneid.${22}


    Argonautica is partly modelled on the Aeneid in other ways as well. Unlike its
    more predecessors, *Metamorphoses and Civil War*, it offers a continuous narrative
    on remote mythological subject with frequent references to its Roman context.${23}$
    Even if we leave the poem with its address to Vespasian and instead of the conquest
    of Jerusalem (1,12–14), the epic includes references to eruptions of Vesuvius
    (3,208–9, 4–507)—to Roman civil


    > $17$ Only Penwell (2013: 30–1) argues that the poem is complete as it stands.


    > $18$ Recent supporters of the majority view include Hershkowitz (1998b: 1–4),
    Zissos (2008: xxvi–xx), and Stover (2012: 26).


    > $19$ Ehlers (1980) v) supports this view.


    > $20$ Manwald (2015: 7) argues, in my view, that it is not possible to know whether
    the poem''s epic text exists in full some point.


    > $21$ Schetter (1959).


    > $22$ Hershkowitz (1998b: 9), Nesselrath, Pellucci (2012: xvii) supports this
    suggestion.


    > $23$ For discussion of references to the Roman context see e.g. Zissos (2009),
    Davis (2015b), and Bernstein (2016).'
