  md: '# Preface


    Valerius Flaccus writes as the heir to a remarkably rich tradition of epic and
    dramatic poetry concerned with Argös''s voyage, the legend of Jason and Medea,
    and the disastrous consequences of their relationship. Sometimes dismissed as
    the retelling of a story already told in Greek, the Roman Argonautica is a poem
    that merits sustained, detailed attention.


    The primary focus of this work is literary. In both the Introduction and Commentary
    I have attempted to document Valerius''s engagement with Greco-Roman epic in general,
    with previous representations of Medea''s myth, and with the lengthy tradition
    of reflection upon the Argonautic expedition. Intertextuality is therefore a major
    concern, with particular attention paid to the ways in which Valerius'' rewriting
    of Euripides, Apollonius of Rhodes, Ovid, and Seneca contributes to the poem''
    overall meaning. Consequently, I have aimed to indicate the context and explain
    the significance of the most important passages to Valerius alludes.


    Also central is the texture of Valerius'' verse. I have tried to highlight the
    elegance and power of his writing, the complexity of his language, his expressive
    use of meter, the effectiveness of his rhetoric, and his interest in the symmetrical
    placing of words. And I have sought to underline Argonautica''s connections with
    its cultural and political environment, emphasizing the Flavian context of Valerius''
    work.


    Close engagement with Valerius'' work inevitably leads to grappling with significant
    textual difficulties. Although I have consulted digital images of the principal
    manuscripts, L and V, the text that I offer is based primarily on printed editions,
    especially those of Widu-Wolfgang Ehlers (1980) and Gauthier Liberman (1997–2002).
    These embody very different critical methods, with Ehlers seeking a conservative
    approach to manuscript problems and Liberman being skeptical of the inherited
    text² I have learned much from Liberman''s edition, particularly because he justifies
    his choices in extensive, detailed notes, my practice is to accept transmitted
    readings wherever possible, even to the point of rejecting some universally accepted
    ''corrections''³ I do so on epistemological grounds. While it is true that medieval
    manuscripts often prefered readings, along with Carrio''s reports of C, actually
    constitute


    +   ¹ Images of L are freely available from the website of the Biblioteca Medica
    Laureziana (https://www.bmlonline.it).

    ² Tarrant (2016:77) includes Liberman among those ''critics'' who feel free to
    adopt any conjecture in their view improve the text, even if the transmitted text
    makes sense and has generally been regarded as sound;

    ³ E.g. at 20, 179, 200, 243, 260, 318, 489, 531, 533, 546.'
