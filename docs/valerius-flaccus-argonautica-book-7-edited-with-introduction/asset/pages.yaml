    labores | reworked as a mildly ironic condition tua praesenti virtus [te]ducere
    leto | si te forte potest. The understatedducere leto (as opposed to say, eripere
    leto [cf. Virg. A. 2.134, 5.690, Sil. 10.57)] suits the gentle tone.


    452. in it: The three syllables are missing from L and V. The earliest editions
    A in completing the line with inpsis (1655: p. 299) found si samten aut suntis
    aliquem pons armis in ancient MS. This was accepted by Heisenius (1680) among
    others. The Virgilian parallel noted by Vossius (in Burman [1724]) makes this
    active (sumpsis pons in armis, A. 2.676; also null nostrum ipsus pons armis, A.
    11.411). Thilo (1863) proposed to complete the line with itis, accepted by all
    modern editors except Liberman (in ipsis). I reject Cato''s reading reference
    to weapons/warfare is not appropriate to the argument. istis is preferable to
    ipisis because it is more consistent with the tone of the following line and produces
    a rhetorical effect.


    453. praestis...leto: Cf. Virg. A. 19:1: praesentem...morten, 1022: praestis leti.


    454- etiam nunc deprecor, hospes, | me sine et insontem misero dimitte parenti:
    It is striking that at this late stage, when he is in committed herself to helping
    Jason, Medea is still trying to preserve her pudor, for she concludes the speech
    with the request that, if Jason can possibly succeed with his own resources, he
    should send her back to her father. Medea appeals to Jason in Book 8 in very similar
    terms: hoc saepe dequecor, hospes (Lazzarini [2012: ad loc.] and Pelluchi [2012:
    ad loc.]. Here in Book 7, however, Medea asks to be sent back to Aetes, in Book
    8 she pleads not to be returned to her father. The key issue is guilt. At this
    point Medea can claim innocence; the being of Book 8 she cannot.


    454. deprecor: The verb is often used in contexts of powerful emotion, e.g. Catul.
    92.3 (Catull on Lesbia), Ov. Her. 9.159 (Deianira believing that she has destroyed
    Heracles), Met. 2.98 (Apollo trying to save Phaethon), St. The. 11.431 (Adrastus
    pushing Polynices and Eteocles not to fight). Cf. Virg. A. 12.931 when Turnus
    returns for his life: nec deprecor.


    hospes: By addressing Jason in this way, Medea implies that her motives are innocent,
    she is prompted by the duty owed, and by sexual passion. The shifting significance
    of hospes above on 1, 119, 144–3, 283.


    455. misero...parenti: Both the narrator (Colchis erat nondum miseros parentes,
    5.349) and Medea''s mother (nil rectum miseri pepigere parentes, 8.154) use the
    phrase of Medea''s betrayal of her family. It points to the decision she is about
    to take and foreshadows her effects. For Medea''s commitment to her father see
    above on 17 and 78.'
