    Commentary, lines 467–71


    467. nunc age: The phrase, adapted by Lucretius from Greek didactic poetry (he
    uses it 17 times; see Kenney [1971: on 3.417], who compares Nicander’s νῶν \δ
    ἄγεε (‘Come now’, Ther. 359 and two more times), marks a decisive shift in Medea.
    Having concluded her last speech with the wish that she might have returned to
    her father, she now plays the teacher and issues a series of instructions.


    has…cristales galleanqueum: The verb (OLD 1b: ‘put on again’) suggests that Jason
    has this to meeting in full and that he has removed his helmet before Medea. cristales
    galleanqueum is an example of hendadiys (note hanc; 496; for the device see above
    on 29). Cf. Virg. A. 9.50, 12.89, VF 3.176.


