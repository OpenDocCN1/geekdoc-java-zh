    presence increases the number of choices that Jason has to make.


    For both Valerius and Corneille, the golden fleece is not merely a precious or
    sacred item: it is an emblem of Aetes'' power. Thus Phrixus'' ghost warns in Argonautica
    5 if the fleece is lost, so too is Aetes'' reward (236-7):


    ```

    tunc tibi region lacusque supersunt

    rapta saporato ferunt uellera loco.

