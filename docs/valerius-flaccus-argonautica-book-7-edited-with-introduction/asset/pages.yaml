    speaks only of Aeetes'' treacherous nature (3.1105–6). Extreme anger characterizes
    Aeetes'' reaction in both VF (8.2–3) and AR (4.8–9).


    472. sic deinde locuta: Varis Virgilian phrase used only in A.5: *sic deinde locutus*,
    5.14, 303, 400. (Also see Stiu. 2.3.26).


    473–5. Like AR, VF inserts a brief analysis of Medea''s thoughts. Medea, having
    left Jason to the fleece back to Hellas, weeps (3.1065–6): *ἐμέλεν ἀποθρβολ πολὸν
    εἰδ ποιόντον ἐπιπλύξεθαι*, because she was about to roam the sea very far from
    her. VF uses the content of Medea''s thoughts, leaving it to the reader to infer
