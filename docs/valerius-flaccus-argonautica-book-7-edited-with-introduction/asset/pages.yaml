    a river OLD 4: ‘sluggish’. Servius confirms when he points out the description
    of Hebrus of the river as ‘swift’ was mistaken (on A. 1.317), noting that the
    river was particularly cold in winter. Baerehens’s (1875) hauritique grauis (accepted
    by Liberman) is unnecessary.


    647–8. VF’s treatment of the Cyclopes reflects the complexity of the poetic tradition,
    because he presents one Cyclops, Polyphemus, who also-be-lover of Galatea (1.135–6,
    with Zissus’s note; cf. Theoc. Id. 11, Ov. Met. 13.750–897), or as cannibal (4.106–7;
    cf. Hom. Od. 9.105–542), or the Cyclopes in general as forgers of Jupiter’s thunderbolts'
