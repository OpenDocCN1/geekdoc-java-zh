    # 488–510. JASON DECLARES HIS LOVE FOR MEDEA


    VF combines two of the Hellenistic Virgil''s speeches, one in which he claims
    that will never forget Medea (1079–1101) and a second in which he promises to
    be faithful to Medea until death (1120–30).


    **488–9.** As in AR (τον δὲ καὶ αὐτὸν ὑπιε δάκρυνα κούρης  λλος ἔκος, 3.1077–8,
    ‘And, at the hero’s tears, destructive love over him too’; cf. 3.1023–4) and Virgil
    (multa genera quantum animulum lafectibus, A. 4.395), VF’s narrator, rather than
    describing the hero’s passion, simply informs readers that the hero is in love.
    But whereas AR treats passion as an external force and Virgil opts for the poetic
    voice, VF makes Medea into an active force: she stays, she inspires.


    **483. tacitus...cantibus:** These are not the carmina Medea employed when praying
    to Hecate (352–3) or when preparing for battle (463), for those seem to have been
    uttered aloud. Rather they remember the spells for Lucina (one of Hecate’s avatars)
    employs when preparing Hercules’ birth (O. Met. 9.300–1); tacita quoque carmina
    voce | dict, et inept tenurunt carmina partus.


    **489. flexerat...afflabat:** Both verbs are used elsewhere in erotic contexts.
    For flepto see e.g. Catul. 64.330 (quae tibi lexanimento profundat amore), Virg.
    A. 4.35, VF 7.172, Stat. Sil. 1.21–199; for afflo see Tib. 2.180, 2.4.57, Prop.
    2.29.17, Stat. Theb. 5.194, Il. 11.420.


    MSS and earliest editions read adflabit/afflabat. Pius’ (1519) affarat, accepted
    by some recent editors, including Ehlers and Liberman, is unnecessary. In fact,
    the shift in tense is active, because the perfect suggests a single completed
    action, the imperfect implies a longer continuing process. iamundum, moreover,
    is more commonly followed by the imperfect than the perfect.


    simili...amore:** The phrase suggests that Jason’s passion for Medea equals hers.


    **490–1.** Jason’s vigorous question for a particularly strong opening, cf. Virg.
    A. 12.947, O. Met. 9.213, 214, VF 7.331, Sil. 5.649, 12.236, 13.371) suggests
