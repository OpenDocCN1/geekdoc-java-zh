    # 5.3. Corneille''s Conquest of the Golden Fleece


    I would like to conclude by examining a work that responds unambiguously to Valerius;
    Pierre Corneille''s Conquest of the Golden Fleece. This play, called a ''tragedy''
    by its author and a ''machine play'' by others, was first performed in November
    1660 in Normandy in the presence of the king and queen, and subsequently in January
    1661 in Paris, to mark the conclusion of a peace treaty between France and Spain
    (the Treaty of the Pyrenees) and to celebrate the marriage of Louis XIV to Maria
    Teresa, the Spanish infanta.¹³⁰ little performed today the play was, in the words
    of one theatre historian: [le] grand extravagant de la vie théâtrale du XVII siècle
    (the greatest event in the theatrical life of the seventeenth century).¹³¹


    While the case for Boccaccio''s awareness of Valerius is based on circumstance,
    the argument for Corneille''s knowledge is based on the clear of evidence. First,
    some 20 editions of Argonautica appeared between the publication of the first
