    at 469: cum at 76, 92, and 233, VF alludes to the ploughing of the Campus Martius,
    the struggle with the earthborn men, and the serpent guardian of the fleece.


    The repetition of flammas in successive lines is troubling, by Heinsius (1702:
    395). Löchbach (1872: 15; 1876: 13), followed by Mozley, proposed the ending flammas
