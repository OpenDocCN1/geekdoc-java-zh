  md: '# Commentary


    # 1-8. MEDEA''S DISTRESS (1)


    The origins of Medea''s distress lie in Book 6, for it is that we see Juno and
    Venus conspiring against her, with Juno borrowing Venus'' *cingula* (471), disguising
    herself as Medea''s sister, Chalciope, and leading Medea to the city walls (427–506).
    There too we see Juno working upon Medea as she gazes upon Jason in battle (575–601)
    and placing Venus'' ornament around Medea''s neck (668–74). Finally, as Medea
    leaves the battlements, still struggling to resist her passion (752–60). It is
    at this point that Book 7 begins with Medea


    1–3. The opening of Book 7 is particularly striking, beginning as with an apostrophe
    to Medea: *te جوئے*. Initial te is then reinforced by alliteration of *t* in lines
    1 and 2, particularly by the phrase *te tua* in epic''s book this is is unusual.
    The next parallel is the narrator''s address to Aeneas'' Nurse Caieta in the abandoned
    Aeneid 7: *Tuoque*. Caieta, however, is an important character in the poem. Here
    apostrophe underlines the fact that Medea (and not Jason) is the primary focus
    of Book 7.


    Apostrophe is often used by epic poets to arouse sympathy for a character (as
    when the doomed Patroclus is addressed eight in *liad* 16, or the abandoned Dido
    to A. 4:48: *quis tibi tuo, nenti talia sensus*, or the orphaned Orpheus in Met.
    11:44–6: *te maestra uolocres, Orpheus, te turba ferram, | te rigid silices, te
    carmina saepe secutae | fleuerent silua*). We see VF employing apostrophe in the
    same way when he speaks of Jason''s star-like phrase as bringing no to Medea:
    *nec tibi, miro, iargo, uiga laeta-bilde asius Aquiae* (6.606), when the first
    bull is struggling against Jason (7.589–90): *illeum autque ipsam te, Medea |
    concutit*, and when Abysurus is the Argonauts (8.312): *at tibi quae sceler facies,
    Medea*. Wheeler (1999: 112) observes that Virgil uses apostrophe in Metamorphoses
    to draw attention to important turning points in the narrative. It is also used,
    as by Zissos (2008: 1) puts it, ''to register author emotional involvement''.
    All three are present here.


    For a list of examples of apostrophe in VF and post-Augustan poets see (1980:48–9).
    Williams (1972) on *Stat. The 10.498* gives the figures for frequency of use of
    apostrophe by epic poets: Virgil (G. and A.) one in 180 lines (*Met.*) one in
    120; Statius in 111; Silius in 108; VF one in 93; Lucan one in 56.'
