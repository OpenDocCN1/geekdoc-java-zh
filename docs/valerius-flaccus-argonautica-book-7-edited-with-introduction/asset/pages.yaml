    (OLD 4). A Roman flavour seems unlike here.


    # 127–40. MEDEA’S SECOND MONOLOGUE


    This soliloquy superbly encapsulates Medea’s contradictory emotions. She begins
    by rebuking her for a passion that cannot succeed (128–30) and asking why she
    should be concerned for Jason’s fate (131–2). Reflection on the likelihood of
    his death, prompts the wish that he might perish eve-where (133–5) and the acknowledgement
    that he merits sympathy (136–8). Nevertheless, Medea closes with the hope that
    Jason might return home without knowledge of her prayer and hatred of her father
    (139–40).


    127. molli...ira: Another paradoxical expression. The Virgilian Aeolus’ task is
    to soothe the winds’ anger (cela sedet Aeolus ire | septra tenuis mollit animos
