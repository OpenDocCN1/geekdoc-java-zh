    rura coloni 6.404–5, of the fathers of civil warriors; rura petri 6.599, of Jason
    destined to return in triumph to Iolcus; and uenties in rura labor 7.72, used
    by Aetes of Jason’s current labour.


    For receded of the up mean of land see Old 2d. Cf. the use of accedere at 86 Old
    2a treats christis as divisive of advantage. It seems more likely that recedo
