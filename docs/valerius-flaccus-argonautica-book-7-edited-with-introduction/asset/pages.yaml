  md: '# Selective Critical Apparatus


    Knowledge of the textuent of Argonautica 7 depends primarily upon two manuscripts:
    L (cod. Laurentianus plut. 39,38), written by the Florentine humanist Niccolò
    Niccoli before November 1429;¹ and V (Vaticanus Latinus 3277), written at Fulda,
    a major German centre for the copying of manuscripts,² in the second quarter of
    the ninth century.³ Also important are C, manuscript not lost but reported in
    Carrio''s edits, and selections of text circulating in twelfth-century French
    florilegia.⁴ W.-W. Ehl established that, contrary to previous belief, L and its
    copies are independent of V and represent an earlier state of the text.⁵ Taylor-Briggs⁶
    uses the following stemma to represent the relationships between the principal
    manuscripts (including S, a manuscript not relevant to Book 7):


    ![](img/072a59248c563084081d7991e90b1bab_92_0.png)


    I have examined digital images of L and V, and of almost every printed edition.
    I rely upon the apparatus critici of Ehlers (1980) and Liberman (2002) for the
    readings of other manuscripts. While I have their reports of scholarly conjectures,
    I have also attempted to verify in the Commentary precise references


    +   ¹ For the date see de la Mare (1973: 56).

    ² For the importance of V''s survival see Reynolds and Wilson (2013: 93, 100–2).

    ³ For the dating of V Ehlers (1970: 20–1) cites a letter from B. Bischoff. See
    also Bischoff (1981:180–1).

    ⁴ For the reliability of Carrio and the importance of his MS see Taylor (1989),
    Hurka (2003, 2006). For the florilegia see Ullman (1931), Taylor (1989: 452–3).

    ⁵ Ehlers (1970: 115). See also Schmidt (1976), Reeve (1983), Liberman (1997: lxvi–lxvii),
    Perutelli (1997: 61–70), and Taylor-Briggs (2014).

    ⁶ Taylor-Briggs (2014: 27).'
