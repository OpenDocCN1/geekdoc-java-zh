    # Introduction


    own Médée (1635), a play that ends with Médée killing of her children, Créuse,
    and Créon, with Jason''s suicide. Note too that Hippolyle''s experience of Jason''s
    perfidy leads her to warn her rival of possible future infidelity (1296–7) et
    peut-être qu''en Grèce | Quelle troisième objet surprendrait sa tendresse (''and
    perhaps some third object may take hold of his affections in Greece'')^{143} and
    that Jupiter surpasses for punishment for irresponsibility and disloyalty (2198–2220).


    How are we to understand the play''s relationship to its political context? One
    possibility is that its relevance lies not in a simple equation of Louis XIV with
    a Greek hero, but in its presentation of two different kinds of marriage. First,
    we should note that the Prologue embodies the claim that dynamic marriage leads
    to peace and prosperity. Second, if we turn to the final scene, we find that the
    play ends with a marriage that is both happy and politically advantageous: Hippolyle
    and Absyte will marry and rule over Lemnos. Jupiter, moreover, endorses their
    relationship (2208–9); and Hippolyle and Aet are glad to accept his decision.
    Since the entire episode is Corneille''s invention, there is no mythographic evidence
    to suggest that this marriage will not succeed. The same cannot be said the marriage
    of Jason and Médée, a marriage that results from Médée''s defiance of her father
    and betrayal of her country (cf. 845). Corneille presents marriage that has divine
    and parental approval leading to national prosperity and unsanctioned marriage
    causing disaster.


    For those familiar with classical mythology, however, another possibility lies
    open fair proportion of Corneille''s original audience, might well conclude that
    the play''s model of successful marriage, the marriage of Hippolyle and Absyte,
    was an obvious fantasy devised by the playwrightwright to produce a happy ending.
    A sceptical viewer, noting the absence of ancient textual authority, might well
    conclude that the play''s vision of the blessings of dynamic marriage was entirely
    fictitious.


