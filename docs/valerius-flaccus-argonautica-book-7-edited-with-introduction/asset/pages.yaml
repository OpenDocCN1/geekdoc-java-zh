    violence, VF knowing more of Jason and the Argonauts, delivers a masterpiece of
    sarcasm and wit. And yet the speech is tonally complex, for Aetes moves from scorn
    (35–57) to seeming enormous (58–72) to utter cynicism and cruelty (73–77).


