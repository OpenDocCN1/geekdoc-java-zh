    on the grounds that Ariadne is inconsistent with mythological chronology. Mythological
    chronology, however, is fluid. Catullus insists that Argo''s voyage (and for him
    it is the first voyage, 64.11–18) is precisely contemporary (tum... 19–21) with
    the wedding of Peleus and Thetis, and that the marvel covert displays a (by definition)
