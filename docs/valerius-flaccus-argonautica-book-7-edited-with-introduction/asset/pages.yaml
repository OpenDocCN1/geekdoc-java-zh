  md: '# Preface


    the only available evidence for our author''s text. In my view it is not the editor''s
    task to ''improve'' the text if it makes sense and is in other ways acceptable.
    Indeed, some modern ''improvements'' are so misconceived that they actually actually
    weaken the poet''s work. The text of this edition differs from that of Ehlers
    in 53 places and from of Liberman in 105.4


    My translation claims no credit to grace or elegance. It is intended primarily
    to clarify the surface meaning of the Latin. Valerius is sometimes difficult and
    the translation is often the simplest and most economical of explanation.


    I tried to make this edition accessible to as many readers as possible. The Introduction
    is intended to be comprehensive to anyone interested in the development of the
    Media legend, Valerius'' place in the epic tradition, in the poem''s themes, and
    in its reception. While the Commentary is obviously aimed at readers with a knowledge
    of Latin, it does not require familiarity with Greek or other languages.


    I have made extensive use of the Packard Humanities Institute of database of Classical
    Latin. My claims concerning the occurrence or non-occurrence of words and phrases
    in Latin literature are based upon searches of this important resource.


