  md: '# 2.3. Politics


    invention of the first ship and its journey to Colchis to constitute a pivotal
    event in world history.


    Allusions to other myths concerned with technological innovation suggest that
    this is one of the Roman Argonautica''s principal concerns.27 Thus we find references
    to inventions associated with the end of the golden age, those of agriculture
    (1.68–70) and horse-riding (7.604–6). There are also reminds of humans who smash
    through natural boundaries to disastrous effect, reminds of Phaethon (1.526–7,
    5.429–30) and Daedalus and Icarus (1.704–8). Most important are mentions of Prometheus,
    the god who brought technological skills to humankind and whose liberation coincides
    with Argo’s passing through the Clashing Rocks (4.62–81, 5.154–76; cf. 7.355–60).


    # 2.3. Politics


    Politics is also important.28 It is striking that the epic poems employ Roman
    constitutional language to describe the politics of major cities and the representation
    of tyrants is consistent with that found in later epics and in contemporary prose
    verses:29 tyrants like Pelias and Aetes conceal their true feelings, treat the
    scene with contempt, and act against the best interests of their people. Like
    the Romans, the nations that Jason encounters display a marked tendency to war.
    On Lemmas the Argonauts meet women who have already rebelled against their husbands,
    on Cyzicus they become involved in a quasi-civil war, a war between guests and
    hosts. And in Colchis they take sides in a full-scale battle between Aetes and
    his brothers.


    But civil war is also the most extreme form of the corruption of family relationships
    that the poem presents.30 In locus rivalry between brothers creates discord within
    the state, leading in Book 1 to the suicides of Jason’s parents and the murder
    of his younger brother. In Book 2, the women of Lemnos kill all their male relatives,
    while Trojan Laomed is locked in affection that exposes his innocent daughter
    to cruel death. And in Colchis Jason’s presence prompts Medea’s betrayal of her
    parents, and presumably, murder of her mother.


    Although the favourable judgement of critics like Quintilian and Heinsius and
    the frequency of the editions in the century after Argonautica’s first printing
    in Bologna in 1474, sixteen between 1481 and 1566,31 suggest that there have been
    times when Valerius Flaccus been highly regarded, by merit


