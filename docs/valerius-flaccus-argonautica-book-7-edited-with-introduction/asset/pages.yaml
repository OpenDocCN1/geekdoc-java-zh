    One of the most notable features of Argonaut 7 is its concentration on the complex
    psychology of a single individual, Medea. That complexity is conveyed in this
    passage by a variety of ways. First, Valerius delineates carefully the sequence
    of emotions experienced by Medea. Most obliterated by Juno''s intervention in
    Book 6,³³ reasserts its hold in Book 7 (156, 177) to the point that Venus feels
    to intervene in person. The girl responds, however, not with submission to the
    goddess, but with a combination of shame and anger (tanta postuat erat, 294).
    That anger, is vividly embodied not only in her appearance (grauult), but in the
    barely restrained impulse to stroke Venus'' face. Dread (horror) follows, an emotion
    that finds physical expression when Medea tries to block words from entering her
    ears. Next, Valerius uses indirect deliberative questions (What is she to do?)
    to convey a sense of helpless entrapment and to suggest the narrator''s empathy
    with sympathy for her plight. Finally, he conveys her desperation by recording
    Medea''s desire to be buried beneath the earth, not for the sake of duty, that
    would surely result, but in order to avoid Venus''s words.


