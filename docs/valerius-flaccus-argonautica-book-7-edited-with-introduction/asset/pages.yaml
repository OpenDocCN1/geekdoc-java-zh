  md: '# Introduction


    Valerius had died nuper (''recently''), claiming that he sometimes uses the word
    loosely.⁸ However, the fact that ''recently'' can be used imprecisely (it is after
    all a relative term)⁹ does not entail that it is being used outside its semantic
    range here. Note too that the issue is complicated by the fact that it is difficult
    to date Quintilian''s work exactly. The context, moreover, suggests that Quintilian
    is more concerned with recording the early deaths of poets when telling us exactly
    when Valerius died (Inst. 10.18-90).


    The poem to Book I has been debated.¹⁰ Nevertheless, the fact that the poet addresses
    Vespasian 1.7–12 and speaks of the speaker''s apotheosis as a future event (1.16)
    establishes that Valerius began his work at some point in Vespasian''s region,
    in the 70s CE.¹¹ Similarly, reference to the major eruption of Vesuvius on 79
    at August 4.7–9 makes it clear that work continued under Titus. When later Valerius
    ceased writing the poem we know now.¹² On the other hand, Status Thebaid (published
    around 91) and Achilleid (unfinished at the time of Status around 96) clearly
    refer to Argonica.¹³ Composition in the 70s and 80s seems strange.


    While reference to Apollo''s tripod and Cumae''s prophet (1–5) may suggest that
    Valerius was a member of the Board of Fifteen in charge of, among others, the
    Sibylline codes (the XVI sacri facundiis)¹⁴ these lines do not necessarily constitute
    evidence for Valerius''s biography¹⁵ because the poet is telling us about himself,
    but his poem.¹⁶ The work is clearly unfinished; it leaves Jason caught in a dilemma
    and responding to Medea''s


