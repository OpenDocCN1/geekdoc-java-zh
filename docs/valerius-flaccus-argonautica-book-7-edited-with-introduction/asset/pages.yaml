    In literature there that Medea is sick with goes back to the first speech of English’
    Medea: Medea anima grego aeo saucia (216 Jocelyn). VF describes Medea as meagre
    in Book 6 (719, 753) and compares her to a sick pet at 7.125 (aagra–canis). And
    in Book 8 Medea’s mother rebukes her for failing to understand the symptoms of
    love’s sickness (8.163–5): non ullius tim color aegagrauerque | errantes gene
    atque a dialogo uultu | semper erat.


    incensa: Reveals cruel imagery frequently found in erotic contexts in Latin, most
    famously found in Virgil’s account of Dido’s passion in Aeneid 1 and 4 (note especially
    incensa, A. 4.300, 376). But also see Virgil’s accounts of Medea: In Heroides,
