  md: '# 557–8. maxima…| dicta


    Varies a formula that Virgil uses to end a speech (A. 2790 and seven more times):
    haeci subi dict dict. It is used to introduce a collective speaker. The *force
    of maxima* is not clear. *TLL* 136.1–18 includes this package and 5.599 as examples
    of magnis magnaniloquus, while OLD magnis suggests 8 *most encouraging*; magnum,
    however, can stand loudness (e.g. VF 1262: *magnum sonantes*) or emptiness (e.g.
    Virg. A. 1054: dizeret aliquid magnum, with Harrison’s [1991] observation: ‘common
    in poetry of rash or boastful utterance,’ Ov. Met. 13.222 [Ulysses criticizing
    Ajax]: non erat him minum numquam nisi magni loquenti). It is possible that TLL
    and VF right the hollowness of his companions’ words with Jason’s courage.


    558. procul dissit agris: procul dissit suggests that we should accept Fontius’
    correction of MSS agris. Some earlier editors amended to agros, a change that
    makes little sense if Jason is standing *Circcaeis Mauortis* in agros (544).


    559. fixerat et gradus: Translates AR’s ἐδ διαβας (3.1294). For this use of figo
    Old LB 6. Standing on one ground is a battle of courage (e.g. Ov. Met. 94.43:
    inque gradu statimus; Stat. The. 2.585–6: di glomerant in unum | Ogygia firmantique
    gradum).


    550–60. solus: Standing implies not just justice, but acceptance of responsibility.
