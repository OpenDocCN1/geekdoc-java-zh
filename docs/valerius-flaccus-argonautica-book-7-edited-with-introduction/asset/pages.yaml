    His Majesty''s happy marriage, and the peace he had pleased to grant to his peoples,
    having been the reasons for the public rejoicing for which this tragedy was prepared,
    not only was it right that they serve as subject in the Prologue which precedes
    it, but was absolutely impossible to choose more illustrious subject matter.


    That Prologue presents the god of marriage, Hymenaeus, accompanied by four Loves,
    using the queen''s portrait to liberate Peace, to drive Discord and Envy back
    to hell, and to transform a France devastated into a splendid garden.


