    # 153–92. JUNO AND VENUS PLOT AGAINST MEDEA


    The narrative''s focus shifts from Medea in Colchis to Juno and Venus, the gods
    who are trying to control her. Juno''s recognition that her first attempt at deceiving
    Medea has failed leads her approach Venus again. This section rewrites not only
    Juno''s previous encounter with Venus in Book 6, but its manifestation of Dido
    and Aeneas in Aeneid 4 (90–128) and of the Hellenistic Medea in AR''s third book
    (36–110).


    153. his neiquam nutantem Cholcida cursus: This line is notable for its use of
    enclosing word order (his...curs) and all (neiquam nutantem Cholcida cursus).
    Enclosing word order is a marked feature of Catullus 64 and subsequent Latin poetry
    (Peacock [1966]). It has a least two advantages: (1) the postponement of fulfillment
    that from placing the adjective first and the last makes for a particularly strong
    line (Nisbet [1999: 138]) and (2) it reduces the reader''s or listener''s awareness
    of rhyme, an effect that Roman writers on the whole prefer to avoid, perhaps because
    it is so easy to achieve in an inflection language.


    Colchis: use of Colchis as substantive perhaps derives from Euripides (ἐκλων δὲ
    βου | τάς δτάνιος Χλχδου); ‘I heard the cry of the wretched Colchian’, Med. 131-2.
    For Medea in Colchis as Euripides se Mastronorde (2002: 22–4), AR uses κόλχις
    of Medea as an adjective (4.2, 689). In the latin nouns tends to be associative
