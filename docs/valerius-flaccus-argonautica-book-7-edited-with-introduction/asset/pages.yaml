  md: '# Commentary, lines 8–9


    8. paulium: I retained paulum. There is no need to obelize (Ehlers, Talicerio,
    Palstenstein) or emend (Mozley, Liberman, Soubiran:usam; Courtney: culpam; Watt
    [1984]: euer; Gärtner [2010]: pestem), because fateri is used absolutely, with
    an object like’truth/guilt’ implied (OLD 1b). Given that the speech that follows
    is only 12 lines long, paulum is not problematic.


    # 9–20. MEDEA’S FIRST MONOLOGUE


    Medea delivers soliloquies in both AR (3.464–70, 636–44, 771–801) and Ovid (Met.
    7.11–71). VF speaks seven soliloquies (7.9–20, 128–209, 331–3, 338–49, 95–108),
    more than any other character in the epic. For analysis of Medea’s monologues
    in all three authors see Auhagen (2004), who argues that VF’s Medea connects the
    helplessness of AR’s with the rationalism of Ovid’s.


    The soliloquy is typical of epic Homer onwards and of Roman tragedy. Particularly
    important for readers of VF is Seneca’s Medea, a play in which Medea herself delivers
    five monologues of various kinds (1–55, 116–49, 560–7, 740–842, 893–977). The
    technique is traditionally used to reveal a character’s psychology and to underline
    her or emotional isolation.


    Medea’s soliloquy is an example of what has been called the ‘interior monologue
    (Discussion of the term see Scholes, Phelan, and Kellogg [2006: 181–4], Fusillo
    [2000]). Scholes lists six characteristics (of which all the last are present
    here) by duty and desire, unable to confide in anyone, and considering the possibility
    of suicide. Virgil gives interior monologues to Dido (A. 4.534–52) and Juturna
    (12.872–84; by Barchiesi [2015: 95–113]), Ovid is the true master of the form,
    giving one in Met. 7 and to five subsequent heroines (Scylla, 8.44–80; Althaea,
    8.481–51; Byblis, 9.474–56; Myrha, 10.320–55; Altalana, 10.61–35).


    This soliloquy is structured around a series of questions each of which is followed
    by a statement and/or a wish, a pattern that underlines not only Medea’s uncertainty
    but also her innocence: her final hope is that Jason should leave.


    9–10. nunc ego qua suo que… |error: The word order here, particularly the postponement
    of error to the following line, perhaps reflects Medea’s confusion. Garson (105)
    notes the allusion to the opening of Medea’s first soliloquy in AR: τίπε με δειλαίνν
    τόδ ἔχειἄχος; (What is this pain which takes possession of wretched me?, 3.464).'
