  md: '# Commentary, line 5


    Dido as Medea serve Introduction 4 (15–17). Garson (1970: 186) observes that the
    elisions in this line, erg(o) ubi, extrem(o) in, suggest ‘Medea’s faltering at
    the threshold’. See below on 382–3 and 385. For Virgil’s of elision and embarkment
    in combination to suggest ‘agitation and confusion’ see Dainotti (2015: 11).


    +   5. aegra: Recalls the Greco-Roman notion that sexual passion is a kind of
    desire. it is also, for example, in Euripides’ Hippolytus, a play in which vínos
    (‘disease’) and cognates occur 23 times; in Roman love ele (e.g. Catul. 76.25
    [cf. 83.4 mea means ‘free of love’], Prop. 1.26–7, 2.57–8]; Tib. 2.13–14; cf.
    nostra media furoris, Virg. Ecl. 100); and it is, of course, the central trope
    in Virgil’s Remedia Amoris. Herinck (2015: 127) notes that that ‘VF’ elegizes
    Medea’s passion. For VF’s of elegiac language see below on 107, 128–9, 160, 194–5,
