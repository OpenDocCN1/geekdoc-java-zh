    in hospite: For this use of in OLD 41g ‘indicating the centre of a person’s thought’.


    14–16. cognati… Phrixi: Important here is Medea''s emphasis on the single goal
    of Jason''s expedition: he seeks only the fleece (quae sola petit); this is the
    only reason (una… causa) for his efforts. The emphasis suggests that Medea wishes
    things were otherwise.


    cognati Phrixi: Medea echoes Juno''s chant for the reason for Jason''s expedition:
    debita cognati repetit uellera Phrixi (6.593), i.e. Jason is entitled to the fleece
    because it belongs to a relation. Pelias, Jason''s uncle, claims Phrixus as a
    descendant of Crethus at 1.42–2: nostri de santi Phrixus | Crethus. And VF narrator
    describes the fleece of Phrixea monumenta fugae (8.119); it should be pointed
    out, that Aeetes and Medea are also relatives of Phrixi, if only. For Phrixus’
    dual status as Greek and as member of the Colchian family was Manuwald (2008).


    15–16. laborum… uiro: There is always a necessary connection between wir (or iurus)
    and labour. Aeneas’ to Ascanus as A. 12.435: utertem ex eum uque labores; the
    narrator comments on Perseus at Met. 5.243: iius viert per tot spectata labores;
    and Cato’s advice to his men at Luc. 9.380–1: componentes ad magnum iius opus
    summosques. The hero most famous for his labours is of course Hercules, a character
    in VF’s poem. Indeed, Jason compares his own labours to his (5.486–8), as does
    the narrator (see below 622–4).


    queaque… causa: as is understood.


    16–17. Medea’s comment underline the utility of wishing things were other: Jason
    will not return to Colchis, and Aeetes will visit Jason to organize a marriage.


    quandō…quandō: Old’s claim the o in quando is long is true of Ovid, and Lucan,
    it is not always true in Flavian epic. Silius follows earlier practice. In Status’
