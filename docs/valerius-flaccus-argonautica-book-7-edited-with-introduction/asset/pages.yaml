  md: '(5.494): meliora tuae mihi foedera dextrae, as well as Mars’ (accurate) judgement
    that (6.12–13): iunctacte ad foedera dextra | luserit Aeetes. The phrase constitutes
    a hendiadys (see above on 29).


    **653.** The book closes with unresolved hostility. Whereas previously Aeetes
    alone could be described as *tru* (78), now both men are equally fierce.'
