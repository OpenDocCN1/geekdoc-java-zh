    Stover (2012) presents a more upbeat view. For critique of story Heerink (2016).

    29 For this see McGuire (1997): Ch. 4.

    30 For civil war as a corruption of family relations cf. Luc. 1:4: cognatas acies
    (‘war between relatives’); Stat. Theb. 1.1: fraternater acies (‘war between brothers’).

    31 For a list of these editions in chronological order see Liberman (1997: cxi).'
