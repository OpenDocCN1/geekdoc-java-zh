    an urochs (urus, Delz [1975:164–5], predicted by Liberman), or an Indian spotted
    deer (axis, Stadler, approved by Drager; cf ‘with the hide of fawn and more and
    white spots’). While a suitably heroic animal is plausible, an unspecified bird
