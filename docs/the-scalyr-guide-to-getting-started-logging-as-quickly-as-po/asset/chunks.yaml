    随着你的应用程序规模不断扩大，日志文件变得越来越复杂，即使你遵循了所有最佳实践，也可能发现理解它们是具有挑战性的。这时，日志聚合工具就可以成为你的救命稻草。这些工具可以帮助你聚合、处理、搜索和可视化日志，让你在海量的日志条目中更容易找到你需要的内容。


    所以，尽管在你的 PHP 项目中使用应用程序日志吧！并记住：你可能应该记录比你目前认为需要的更多的日志。


    本章由 Vasiliy Zukanov 贡献。[Vasily](https://www.techyourchance.com/) 曾在半导体行业工作过，后来成为了一名专攻
    Android 的软件工程师。在经历了几年的 9-5 点工作后，他决定从事 Android 开发自由职业。目前，他为开发者提供咨询服务并制作 Android
    视频课程。


    # 第 5 章：快速上手 Ruby 日志


    让我们继续快速开始日志，这次我们使用 Ruby。


    到目前我们已经讨论了许多语言。那么，把天平向动态类型解释型语言倾斜如何？这正是我们在本章要做的：教你如何使用 Ruby 编程语言运行日志功能。


    本章将涵盖：


    *   如何实现一个非常原始的日志器。

    *   我对日志基础知识的看法：为什么要记录日志、记录什么数据以及在何处记录。

    *   最后，在 `Logger` 类的帮助下，给出一个非常简单但真实的正确日志记录示例。


    与之前的章节一样，我们将创建一个非常简单的玩具应用来演示如何记录日志。我们将从一个非常原始——虽然可行——的方法开始，然后将其演进为一个更复杂、更真实的解决方案。


    ![Ruby With Scalyr Colors](img/Image855.png)


    ## 关于 Ruby 和 Rails 的几点


    在进入日志部分之前，我认为设定一下背景是很有用的。Ruby 语言首次出现于 1995 年，由松本裕弘（Yukihiro Matsumoto，又名 Matz）创建。但它在
    2005 年之后才真正流行起来，这很大程度上归功于非常成功的 Ruby On Rails Web 框架。


    许多（甚至大部分）开发者都是通过 Rails 熟悉 Ruby 的，但 Ruby 本身是一种通用语言，可以用于各种情况，而不仅仅是构建 Web 应用程序。出于如此，本章将不涵盖
    Rails 中的日志记录——那将在下一章详细介绍。在这里，我们将在简单的命令行 Ruby 应用程序背景下探索日志记录。


    处理完这些，我认为是时候大显身手了。让我们开始吧。


    ## 可能的最简单的 Ruby 日志


    在演示中，我将使用 [JetBrain](https://www.jetbrains.com/ruby/)[’](https://www.jetbrains.com/ruby/s
    RubyMine IDE]。同时，请确保你已经安装了 [Ruby](https://www.ruby-lang.org)。


    一旦你准备好就绪，打开 RubyMine 并点击 `Create New Project`（创建新项目）：


    ![`blog.scalyr.com/wp-content/uploads/2018/02/Screenshot-2018-02-22-20.45.42.png`](img/Image864.png)


    在下一个屏幕中，会被要求选择项目类型：


    ![`blog.scalyr.com/wp-content/uploads/2018/02/Screenshot-2018-02-22-20.52.59.png`](img/Image871.png)


    正如我已经提到的，我们不是在创建一个 Rails 应用，而是创建一个简单的 Ruby 应用。因此选择 `Empty Project`（空项目），它是左侧栏
    Ruby 下的第一个选项。下一步是为项目设置位置/名称。完成后后，选择 Ruby SDK 的位置：


    ![`blog.scalyr.com/wp-content/uploads/2018/03/Highlighted.png`](img/Image879.png)


    完成后，点击 `Create`（创建）按钮。我们成功在 RubyMine 上创建了一个新的 Ruby 项目。是时候写代码了。


    首先，让我们添加一个类。进入 `File > New... > Ruby class`：


    ![`blog.scalyr.com/wp-content/uploads/2018/02/add-new-ruby-class.png`](img/Image886.png)


    将其命名为 `Greeter` 并点击 `OK`：


    ![`blog.scalyr.com/wp-content/uploads/2018/02/Screenshot-2018-02-22-21.22.03.png`](img/Image894.png)


    RubyMine 将创建该类并打开进行编辑。让我们添加一个 `Greet` 方法，它接收用户名作为输入并打印一条友好的问候：


    ![](img/Image903.png)


    很好。现在让我们添加一个新文件。进入 `File` 菜单，然后 `New...`，最后点击 `File`。当对话框出现时，输入 `main.rb` 作为文件名并点击
    `OK`：


    ![`blog.scalyr.com/wp-content/uploads/2018/02/Screenshot-2018-02-22-20.45.42.png`](img/Image914.png)


    该文件将作为我们小程序的入口点。插入以下代码：


    ```ruby

    require_relative ''greeter''


    name = gets.chomp

    greeter = Greeter.new

    greeter.greet(name)

    ```


    这段代码应该很容易理解。在第一行，我们加载了 `greeter.rb`。

