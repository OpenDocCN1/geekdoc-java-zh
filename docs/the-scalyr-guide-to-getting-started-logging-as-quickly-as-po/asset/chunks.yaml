    # 你准备就绪了！


    在本章中，我们查看了 Rails 日志器以及如何在应用程序代码中调用它。然后，我们查看了如何自定义配置并扩展日志消息以使其更有用。


    在日志方面你还有很多事情可以做，所以请继续学习吧！


    本章由 Eric Goebelbecker 贡献。[Eric](http://ericgoebelbecker.com/) 在纽约的金融市场工作了 25 年，负责开发市场数据和金融信息交换
    (FIX) 协议网络的基础设施。他喜欢讨论什么因素让团队变得高效（或者没那么高效！）。


    ## 第 7 章：快速上手 Swift 日志记录


    在本章中，是时候谈谈 Apple 的 Swift 语言了。Swift 语言正在逐渐变得流行，尤其是自其开源以来。


    我将先从一个 Swift 手动日志的快速示例开始。然后，我将对本书书中经常讨论的一个主题给出我自己的见解：日志记录如何以及为什么重要的细节。最后，我将转向在
    Swift 应用程序中使用 Apple 的统一日志器（Unified Logger），并让你知道它可以提高你监控应用程序和追踪问题的能力。


    代码示例将适用于 MacOS，但你可以轻松地将其适配到任何 Apple 平台。


    让我们开始工作吧！


    ![](img/Image1182.png)


    ### 可能运行的最简单 Swift 日志记录


    让我们从在 Xcode 中创建一个项目开始。如果你还没有安装它，请前往 App Store 并从那里安装。


    接下来，启动 Xcode，并在第一个对话框中选择 `Create a new Xcode Project`（新建 Xcode 项目）。


    ![开始使用 swift 日志](img/Image1193.png)


    在教程中，我们将保持代码尽可能简单，因此请选择 `MacOS` 和 `Command Line Tool`，然后点击 `Next`。你会看到这个。


    ![](img/Image1206.png)


    现在，你可以给你的项目命名。这些值并不关键重要，但请确保将 Swift 设置为项目语言。


    ![](img/Image1213.png)


    最后，我们有了一个项目。


    ![](img/Image1221.png)


    在 IDE 中选择 `main.swift`，你就可以看到 Xcode 为我们添加的代码。


    ![](img/Image1228.png)


    与其打印到控制台，我们更想将日志信息保存到文本文件中。


    Swift 的工作方式与我们之前过的许多其他语言不同。有多种方法可以将字符串写入文件。但由于这里的目的是演示最简单的方法，这里是它：


    ![](img/Image1236.png)


    将文件名设置为一个让你快速定位它的名称。请记住，Xcode 项目的工作目录隐藏在你的 `Library` 目录的深处，所以你可能想将日志文件位置设置为你的主目录。


    当你选好文件位置后，构建并运行项目。然后找到该文件并使用你喜欢的任何编辑器打开它。你会看到你的日志消息。


    我们首先声明了日志文件将放在哪里。如下文所示，这是重要的。这是所有组件都必须知道的——除非有一个框架为我们管理日志位置。


    接下来，我们将该文件名转换为 `URL`。所有的 Swift 字符串都可以将自己写入 `URL`，所以我们正在利用这一点。


    最后，我们创建了一个字符串并将其写入 `URL`。


    虽然这种方法对于简单的日志记录有效，但并不一定能良好运行。每条日志消息都打开一个 `URL` 并将其写入其中的代价是什么？我怀疑它对于成百上千条日志消息的扩展性并不良好。当有多条消息想要同时记录自己时会发生什么？这种机制是线程安全的吗？它会阻塞整个程序吗？


    让我们看看更好的方法。


    ### 什么是应用程序日志记录？


    首先，让我们看看什么是日志记录。


    你可能以前处理过日志记录，并对它的含义有所了解，但仍然值得定义它，以便我们根据自己的需求来评估日志框架。你已经知道我们喜欢这样定义应用程序日志记录：


    应用程序日志记录涉及将应用程序运行的行为信息记录到更持久的介质中。


    但让我来拆解一下。


    日志记录意味着记录运行时行为。我们正在记录有关应用程序的事件。时间因素意味着按时间顺序排列。


    其次，我们将日志存储在更持久的介质中。应用程序事件发生很快，我们希望能够回溯并审查它们。也许我们正在尝试追踪一个错误，或者也许我们必须维护审计跟踪。持久性介质可以是磁盘、关系型数据库或搜索引擎。


    所以，这就是日志记录。在 Swift 中你如何更有效地这样做？你为什么想这样做？这些都是重要的问题。让我们回到工作中。


    ### Apple 的统一日志系统


    随着 MacOS Sierra 和 iOS 10，Apple 引入了新的统一日志系统。虽然他们还没有弃用旧的日志系统，但这个新的日志器是他们所在的方向。


    统一日志器内置的安全和性能功能使其变得极具吸引力。但它确实有一个许多开发者不喜欢的特性：消息存储在内存和专有数据存储中。没有明文日志文件，消息只能通过 `Console.app`
    读取。


    让我们在 Swift 应用程序中使用统一日志器，并看看它如何提高你监控应用程序和追踪问题的能力。


    通过添加统一日志器来开始。我们需要导入 `OS` 包并添加 `os_log` 调用。


    ![](img/Image243.png)


    嗯。这个程序无法构建。


    ![开始使用 swift 日志](img/Image1250.png)我们只能向 `os_log` 传递静态字符串。所以我们将更改字符串定义。


    ![](img/Image258.png)


    构建并运行这个版本，一切看起来良好。


    但日志消息在哪里？


    运行 `Console` 。你可以在 `Applications/Utilities` 中找到它，或者通过 Spotlight 搜索它。


    在搜索框中搜索文本 `Process: Swift`，如下所示![](img/Image267.png)


    这就是我们的日志消息。


    统一日志器通过将所有日志存储在系统中并进行索引来处理日志位置。我们不需要担心它们在哪里、如何打开它们以及何时关闭它们。


    所以对于 Swift 日志，我们需要关注什么？


    ### 为什么要日志？


    总有一天你会写出那个完美的应用程序。你知道指的是哪一个——没有 Bug、对意外事件做出正确反应，并预测客户的每个需求。在此之前，你需要一种方法来监控情况。在现实世界中，即使是结构良好的应用程序也有
    Bug 和缺陷，我们需要监控它们内部发生了什么。


    在开发代码时，我们可以快速发现并解决问题。我们有调试器，可以添加打印语句，是的，我们在编写代码时也会使用日志。我们是在受控的环境中观察我们的应用程序。


    但我们的应用程序最终会离开开发环境的怀抱。它将以我们没有预测到的方式被使用，并遇到我们从未想象过的条件。并且当它失败时，我们需要一种方法来确定发生了什么。


    这就是日志大显身手的地方。


    隔离 Bug 并不是日志的唯一用途。它们对于观察运行良好的应用程序并发现改进机会也很有用。我们可以利用它们来检测可以改进的行为模式。我们可能会发现某个应该缓存在内存而不是文件中的资源，或者一个从未被使用的功能。


    而且当然，日志的用性并不仅于此。有时我们需要交易数据的额外副本，例如信用卡费用或其他金融交易。


