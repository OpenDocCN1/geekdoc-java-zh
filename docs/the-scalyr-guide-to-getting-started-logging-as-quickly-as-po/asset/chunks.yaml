    *   Automated testing, building, and deployment tools.

    *   Low- or no-code platforms that allow you to build applications with little
    to no coding experience.


    But even though things are easier, they haven’t become simpler. In fact, they’re
    more complex. Instead of building a single stand-alone application, we now write
    applications that consist of multiple smaller applications. These all interact
    with each other and with services that are out of our control.


    All this complexity gives us great advantages, like easier scaling and improved
    efficiency. But they also increase the amount of places where bugs and issues
    can occur. Luckily, we have modern monitoring tools that can quickly notify us
    and even provide context and information. But logging is still the best way to
    see what led up to the issue.


    In these complex environments, centralized logging is the number one way to gain
    access to all necessary information. Centralized logging makes our lives easier
    and allows us to fix issues faster and cheaper.


    ## Chapter 2: Get Started Quickly With Java Logging


    For our first experiment in getting started quickly with logging, we’re going
    to tackle Java. In this chapter, we’ll not only provide a quick guide but also
    go into more detail about logging, diving particularly into the what and why of
    logging.


    ![http://blog.scalyr.com/wp-content/uploads/2018/01/Java-Logging-Icon.png](Images/Image280.png)


    ### The Simplest Possible Java Logging That Could Possibly Work


    For this demo, I’m going to use the free [community version of IntelliJ IDEA](https://www.jetbrains.com/idea/download/#section=windows).
    I’m also assuming that you have the [Java JDK](http://www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133151.html?ssSourceSiteId=otnpt)
    installed on your machine.


    ![IntelliJ IDEA Screenshot](Images/Image287.png)


    On the next screen, select Java as the type of project on the left panel. You’ll
    also need to point to the JDK’s path, in case you haven’t yet.


    ![JDK Path Screenshot](Images/Image296.png)


    Third step—mark the Create project from template option and then select Command
    Line App:


    ![New Project Screenshot](Images/Image304.png)


    I’ve called my project `JavaLoggingDemo`, as you can see from the image below.


    ![JavaLoggingDemo Screenshot](Images/Image311.png)


    After doing the steps above, you should see the `Main` class that was automatically
    created for you. It should look like this:


    ![](Images/Image319.png)


    Let’s get to work. Replace the // write your code here comment with the following
    line:


    ![](Images/Image328.png)


    Now you have an application that displays a friendly greeting.


    Next, let’s run our app. Go to Run > Run ‘Main’ or use the shortcut `SHIFT+F10`
    (Windows and Linux) or `CTRL+R` on Mac.


    If everything went well, you should see something like this:


    ![Program File Screenshot](Images/Image335.png)


    Nice. But let’s say the requirements for our little app changed, as they always
    seem to do. Now we need our app to not only display a message but also log it
    somewhere. How do we go about that?


    There are a lot of sophisticated options we could use, but let’s try to do the
    simplest thing we can. Edit the code in your `main` function so it looks like
    this:


    ![](Images/Image343.png)


    Notice the changes. We’ve added a new variable `message` to store the greeting’s
    text. Then there’s the printing. And finally, there’s a new line, which is meant
    to save the text to a file.


    We also had to add a `throw` declaration to our method since the last line can
    throw an `IOException`. Additionally, we’ve added some new import declarations.
    The whole code now looks like this:


    ![](Images/Image351.png)


    When you run your application again, it should behave the same as before. But
    the last line added will create a log file for you. The log file will be located
    in your project folder:


    ![Project File Screenshot](Images/Image358.png)


    That’s pretty much it. You’ve just written your first Java logger! And with that
    first, small step, you’re ready to try larger ones.


    ### What Is Application Logging?


    Let’s zoom out for a second and briefly define what application logging is.


    According to [Wikipedia](https://en.wikipedia.org/wiki/Log_file):


    In computing, a log file is a file that records either events that occur in an
    operating system or other software runs, or messages between different users of
    a communication software. Logging is the act of keeping a log.


    A little bit vague, right? I tend to prefer the definition we gave at the beginning
    of the Scalyr’s first book on logging, [The Scalyr Guide to Getting Started Logging
    as Quickly as Possible](https://www.amazon.com/Getting-Started-Logging-Quickly-Possible-ebook/dp/B07H8SNT2Q):


    Application logging involves recording information about your application’s runtime
    behavior to a more persistent medium.


    With the what out of the way, let’s get to the why of logging.


    ### What’s the Motivation for Logging?


    I think the key part of the logging definition from the previous section was the
    word “persistent.” Why would we need to record information about the behavior
    of our app in a persistent medium?


    Well, for the same reason we record anything to a persistent medium: so we can
    get back to it later. The question then becomes: “Why would you want to do that?”


    It all boils down to the nature of software. A piece of software in production
    is a very complicated thing, more often than not running environment. You can
    always cross your fingers and hope, but as they say, hope is not a strategy. Logging
    is, though!


    In a nutshell, you use logging so that you can after-fact debug your application.
    By reading the log entries, you can understand what happened or even retrace the
    steps taken by a user, in order to diagnose and fix issues.


    ### Evolving Our Approach: What Should We Capture? And to Where?


    Being able to do an after-fact investigation on your app sounds like a great benefit—and
    indeed it is. The humble logger we just created isn’t able to provide this benefit,
    though, since all it can do is write some text to a file. Our job now should be
    to evolve our logger, turning it into a richer source of information for its future
    readers. So how do we go about that?


    The key point to understand is the nature of a log entry. Think of a log entry
    as an event. Something that is of interest to your application happened in a given
    moment in time. So the value of your log entry derives from the data you capture
    about the event.


    The following list contains some examples of data that you’ll want to capture:


    *   A `timestamp`. Exactly when did the event take place? (You’ll want to record
    times in `UTC` and using a standard format such as `ISO8601`, in case you’re logging
    to a file.)

    *   Context that makes it clear to a reader what the entry is about. Just recording
    “Hello, user!” might prove confusing weeks or months later. A better message might
    say, “Recorded user greeting of ‘Hello, user!’”

    *   Tags or categories for each entry, to enable later search and classification.

    *   Log levels, such as `Error`, `Warning`, or `Info`, that allow even more filtering
    and context.


    After deciding what things you want to capture, the next step is defining where
    you want to log to. Even though I’ve used a file in our first example, there’s
    nothing stopping you from logging to other media, such as a database (relational
    or not), the Windows event viewer, or even the console.


    ## Enter the Logging Framework


    Time to get back to our demo. Here’s the thing: this was designed to give you
    a quick start on the Java logging world. But now you’re equipped to look at it
    in a more critical way. So let’s do just that.


    As it turns out, our humble logger is inadequate in several important ways.

