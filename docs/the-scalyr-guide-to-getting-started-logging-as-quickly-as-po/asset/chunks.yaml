    There are two important points to note here.


    First, logging is all about the application’s runtime behavior. In other words,
    it involves recording the application’s events as a function of time.


    Second, you always want to store logs in a more persistent medium. The exact meaning
    of “more persistent” will vary depending on your requirements and environment,
    but at the very least, you’ll want to be able to read the logs even if the application—or
    the entire server—crashes.


    While this definition explains what logging is, it doesn’t explain why you’d want
    to use logging in your application. That’s an important question, and I’d like
    to address it in detail.


    Why Log?


    If we lived in an ideal world, our applications would just work exactly as we
    planned. However, the reality is that even well-constructed applications have
    bugs and will be at risk of crashing at one point or another.


    When you develop on your personal computer and encounter errors, they’re usually
    relatively simple to resolve. After all, you know what you’ve been working on
    and what sequence of events led to the error. In addition, you can develop in
    debug mode, which gives you lots of additional information about the system.'
