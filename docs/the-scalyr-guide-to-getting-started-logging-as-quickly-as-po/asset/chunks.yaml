    本章由 [Vlad Georgescu](https://www.organizepictures.com/) 贡献。Vlad 是一位高级系统架构师和全栈企业软件开发人员，在开发生命周期方面拥有近二十年的经验。他还拥有
    SCRUM master、敏捷教练和团队组长的经验。在沟通方面，Vlad 也非常高效：他创建了在线社区并研究过社交媒体营销策略。


    # 第 11 章：快速上手 Meteor 日志


    在之前的章节中，我们已经涵盖了许多内容。除了 Java 和 PHP 之外，我们还为 Ruby、Swift、Django 等语言编写了指南。现在，我们将从 Meteor
    的角度讨论日志。


    由于 Meteor 可以遵循与 JavaScript 和 Node.js 相同的前提，我们将稍微进行一些改变。我们不会创建一个空应用，而是克隆一个现有的示例应用并为其添加日志功能。但如果这个教程不是你寻找的内容，请查看我们第一本日志书籍中关于基础
    JavaScript 和 Node.js 的章节，[Scalyr 快速上手日志记录指南](https://www.amazon.com/Getting-Started-Logging-Quickly-Possible-ebook/dp/B07H8SNT2Q)。它们将涵盖你可能需要的其他内容。


    但别担心，我们仍然涵盖这些主题：


    * Meteor 概述

    * 基础日志

    * 在哪里记录日志

    * 记录什么


    现在让我们开始吧。


    ![Meteor_logging_image_with_scalyr_colors](img/Image2106.png)


    ## Meteor 概述


    如果你带着使用 Meteor 的经验来到这一章，你可能不需要这一部分。但我想确保我们从同一个起点开始，所以这里有一些 Meteor 的快速信息。别担心，我会很短的。


    Meteor 提供了一个全栈 JavaScript 平台，用于开发 Web 和移动应用。它包含了许多来自 Node.js 和其他 JavaScript 库的包。它专注于提供全栈响应式，以便你的
    UI 与后端服务器无缝交互。作为一个奖励，它开箱即提供了简单的 MongoDB 集成。


    ## 基础日志


    正如我上面提到的，我们不会创建一个空白应用，而是将克隆 Meteor 团队提供的现有示例应用之一。由于我们已经在现有的应用中添加日志，我们将以极小的努力看到不同的日志输出。


    ### 设置


    如果你以前没有用过 Meteor，别担心——基础设置非常简单。首先，你需要安装 Node.js 和 `npm`。如果你使用的是 Mac，你还需要 Xcode。


    第二步，我们将根据你的操作系统使用 Chocolatey 或 `curl` 命令安装 Meteor。


    ![](img/Image2115.png)


    都准备好了吗？太好了。接下来，让我们克隆 Meteor 简单的 todo 应用：


    ![](img/Image2124.png)


    一旦你下载并安装好一切，`cd` 进入 `simple-todo` 目录并使用 `meteor` 命令运行应用。


    ![`library.scalyr.com/2019/02/15124602/011.png`](img/Image2135.png)


    一旦应用启动，访问 `http://localhost:3000/`。你应该在那里看到一个简单的 todo 应用。


    ![`library.scalyr.com/2019/02/15124645/021-1024x463.png`](img/Image2147.png)


    你应该能够添加用户、向清单添加项目等。尽管去玩玩它吧。我会在下一节等候。


    ### 控制台日志


    现在你已经有机会查看该应用程序，让我们开始吧。为了演示简单的日志记录，我们将向应用程序添加一些控制台日志。这对于在开发期间调试客户端问题很有帮助。但一旦你的应用程序被现实世界中的用户使用，它对你的帮助就不大了——你无法访问他们的控制台日志。


    首先，让我们向 `imports/api/tasks.js` 文件添加一些代码。该文件包含了在我们从列表中添加或删除任务时执行的 JavaScript。在
    `tasks.insert` 方法中，添加图像所示的 `log.console` 行：


    ![`library.scalyr.com/2019/02/15124721/031-1024x439.png`](img/Image2154.png)


    接下来，保存该文件后，转到浏览器窗口。它应该会自动更新，所以你不需要重启应用。当你添加新任务时，你应该在浏览器控制台中看到输出。


    ![`library.scalyr.com/2019/02/15124750/041-1024x280.png`](img/Image2162.png)


    看起来很棒，对吧？如果我们也想添加一些用户上下文呢？修改 `tasks.insert` 方法中的行，也打印出此应用程序定义的 `userId` 对象。


    ![](img/Image2169.png)


    之后，你应该看到类似这样的内容：


    ![`library.scalyr.com/2019/02/15124821/031-1024x439.png`](img/Image2154.png)

