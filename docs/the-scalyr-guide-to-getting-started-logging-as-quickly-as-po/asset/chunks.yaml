    ## Chapter 7: Getting Started Quickly With Swift Logging


    In this chapter, it’s time to talk about Apple’s Swift language. Swift has slowly
    been gaining popularity, especially since its open-source release.


    I’ll start with a quick example of manual logging in Swift. Then I’ll give you
    my own take on a subject frequently covered in this book: details of how and why
    logging matters. Finally, I’ll move on to using Apple’s Unified Logger in a Swift
    application and let you know how it can improve your ability to monitor applications
    and track down issues.


    The code example will be for MacOS, but you can easily adapt it for any Apple
    platform.


    Let’s get to work!


    ![](Images/Image1182.png)


    ### The Simplest Swift Logging That Could Possibly Work


    Let’s start by creating a new project in Xcode. If you don’t already have it installed,
    go to the App Store and install it from there.


    Next, start Xcode and select `Create a new Xcode Project` from the first dialog
    window.


    ![getting started with swift logging](Images/Image1193.png)


    We’re going to keep the code as simple as we can in this tutorial, so select `MacOS`
    and `Command Line Tool` and then click `Next`. You’ll see this.


    ![](Images/Image1206.png)


    Now, you can give your project a name. These values are not critical, but make
    sure that Swift is set as the project language.


    ![](Images/Image1213.png)


    Finally, we have a project.


    ![](Images/Image1221.png)


    Select `main.swift` in the IDE, and you can see the code Xcode added for us.


    ![](Images/Image1228.png)


    Rather than print to the console, we want to save logging information to a text
    file.


    Swift works differently from many of the other languages we’ve worked with before.
    There are several ways to write a string to a file. But since the purpose here
    is to demonstrate the easiest way to, here it is:


    ![](Images/Image1236.png)


    Set the file name to something that will allow you to quickly locate it. Keep
    in mind that the working directory for Xcode projects is buried somewhere deep
    in your `Library` directory, so you may want to set the log file location to your
    home directory.


    When you’ve picked a place for the file, build and run the project. Then find
    the file and open it with any editor you wish. You’ll see your log message.


    We started by declaring where our log file will be. As you’ll see below, this
    is important. It’s something all components have to know—unless there’s a framework
    that manages log locations for us.


    Next, we converted that file name to a `URL`. All Swift strings can write themselves
    to a `URL`, so we’re taking advantage of that.


    Finally, we created a string and wrote it to the `URL`.


    While this would work for simple logging, it wouldn’t necessarily work well. What’s
    the cost of having every log message open a `URL` and write itself to it? I doubt
    it scales well for hundreds or thousands of log messages. What would happen when
    more than one message wanted to log itself at the same time? Is this mechanism
    threadsafe? Would it block the entire program?


    Let’s look at a better way.


    ### What Is Application Logging?


    First, let’s take a look at what logging is.


    You’ve probably dealt with logging before and have an idea of what it means, but
    it’s still worth defining it so we can evaluate a logging framework in terms of
    what we need. You already know that we like to define application logging like
    this:


    Application logging involves recording information about your application’s runtime
    behavior to a more persistent medium.


    But let me break that down.


    Logging means recording runtime behavior. We’re documenting events about an application.
    The time factor implies in chronological order.


    Second, we store logs in a more persistent medium. Application events occur quickly,
    and we want to be able to go back and review them. Maybe we’re trying to track
    down an error, or perhaps we have to maintain an audit trail. A persistent medium
    can be a disk, a relational database, or a search engine.


    So, that’s what logging is. How can you do it more effectively in Swift? And why
    would you want to? These are important questions. Let’s get back to work.


    ### Apple’s Unified Logging System


    With MacOS Sierra and iOS 10, Apple introduced the new unified logging system.
    While they haven’t deprecated the legacy logging system yet, this new logger is
    the direction they’re going.


    The unified logger has built-in security and performance features that make it
    desirable. But it does have an idiosyncrasy that many developers dislike: messages
    are stored in memory and a proprietary data store. There are no clear-text log
    files, and messages can only be read with `Console.app` or the command line `log`
    tool.


    Let’s add the unified logger to our application and see how it works.


    We’ll start by removing the code for manipulating files and just replacing it
    with `os_log()`, the unified logger. We need to import the `OS` package and add
    the call to `os_log`.


    ![](Images/Image1243.png)


    Hmm. This program doesn’t build.


    ![getting started with swift logging](Images/Image1250.png)We can only pass static
    strings to `os_log`. So we’ll change how our string is defined.


    ![](Images/Image1258.png)


    Build and run this version, and everything looks fine.


    But where’s the log message?


    Run the `Console` application. You can find it in `Applications/Utilities` or
    by opening Spotlight and searching for it.


    Search for the text `Process: Swift` in the search bar as shown below.![](Images/Image1267.png)


    There’s our log message.


    The unified logger takes care of the log file location by storing all logs in
    the same system and indexing them. We don’t have to worry about where they belong,
    how to open them, and when to close them.


    So what do we need to concern ourselves with when it comes to Swift logging?


    ### Why Log?


    Someday you’ll write that perfect application. You know which—the one has no bugs,
    reacts correctly to unexpected events, and anticipates your customers’ every need.
    But until then, you’ll need a way to keep an eye on things. Here in the real world,
    even well-constructed applications have bugs and other shortcomings, and we need
    to monitor what’s going on inside them.


    We can find and fix problems quickly when we’re developing code. We have the debugger,
    we can add print statements, and yes, we even use logs as we’re coding. We’re
    watching our application in captivity, in a sterile environment where we have
    control.


    But our application is going to leave the embrace of our development environment
    eventually. It will be used in ways we didn’t anticipate, and it will encounter
    conditions we never imagined. And then, when it fails, we’ll need a way to figure
    out what happened.


    This is where logs come in.


    Isolating bugs isn’t the only use for logs, either. They’re useful for watching
    an application that works and finding opportunities for improvement. We can use
    them to detect patterns of behavior that can be improved upon. We might be able
    to discover a resource that should be cached in memory instead of a file or a
    feature that’s never used.


    And of course, the usefulness of logs doesn’t stop there. Sometimes we need an
    extra copy of transactional data, such as credit card charges or other financial
    transactions.

