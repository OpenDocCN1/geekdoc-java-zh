    ## Chapter 1: Centralized Logging Is a Modern Solution for At-Scale Applications


    I remember the very first website I created. This was in the late 90s. It was
    about military fighter jets, and I built it in pure HTML with inline CSS—no JavaScript.
    I also only ever ran it locally.


    The most complex websites of that time were probably e-commerce websites. They
    had to handle content management, user accounts, and payment processing. While
    not a trivial task at the time, the way the web applications of the late 90s and
    early 2000s were constructed seems simple and straightforward today.


    Things have shifted over the years. Companies used to have just one instance of
    an application running on a single server. Only the biggest enterprises needed
    to think about scaling because most websites saw a limited amount of traffic.
    Today, even relatively small organizations take scale into account.


    Luckily, the cloud allows us to build services without needing to manage our hardware.
    This can significantly save cost and effort for enterprises, both small and large.
    Going further, microservices give us the opportunity to develop individual services
    that remain loosely coupled and scale more easily.


    Yet we can’t just say things have become easier and simpler. In fact, microservices
    in a cloud environment can form a jungle of moving parts, making it hard to get
    an overview of their communication flow. We need something more.


    We need logging.


    ### Scale Has Increased Our Need for Logging


    If you have a single application with maybe one or two dependencies to other services,
    logging is easy. The application can log information to the server’s disk, which
    you can then check to see what’s going on. You’ll get a chronological overview
    of all performed actions. This gives you an easy way of investigating any issues
    that arise.


    In a scaled environment, things get a bit more complicated. Your application probably
    consists of multiple services, with either services offering different functionalities
    or different instances of the same service. The interaction of these services
    increases the chances of things going wrong. So the need for logging increases
    as well.


    When you make an in-process method call, not much can break so long as you provide
    the correct input. However, if you’re making a call to another service, there
    are more opportunities for things to fail:


    *   The network might be slow or down.

    *   The other service might produce an error.

    *   Your service could be providing the wrong input.


    All this magnifies the need for logging so that you can more easily see what’s
    going wrong.


    ### The Need for Centralized Logging


    Having each service log to the server’s disk quickly becomes a nightmare. When
    one service calls another, you need to look at the other service’s logs. If that
    service calls a third, you have even more work to do. After investigating all
    logs, you need to aggregate this information to complete the picture. And if you’ve
    ever investigated issues that span several services, you’ve experienced the pain
    of logs spread out everywhere.


    This is why centralized logging is becoming increasingly important, as companies
    move to an architecture where one application actually consists of multiple services
    interacting with each other. But in fact, this isn’t so different from what we
    used to do. In the past, we went to a central location to read the logs—specifically,
    the server running the single service. Now that we have multiple services, it’s
    still useful to be able to go to a single location.


    ### Microservices as a Model for Massive Scale


    Microservices are a great way of developing applications that need to scale. But
    they create challenges for logging. We need to be able to correlate log statements
    across different services, especially when many requests are coming in at a fast
    pace.


    While that all might sound complicated, logging is probably still the best way
    to identify the root cause of problems. Monitoring provides a great overview of
    the health of our applications, but when something goes wrong, we often need to
    go back several steps to see what led to the issue. A stack trace usually isn’t
    enough.


    Centralized logging allows us to follow the flow of a user’s request across multiple
    services, so it’s the way to go.


    ### Hybrid Environments


    These days, many companies take a hybrid approach to the cloud/on-premise choice.
    Some services run on local servers that the company manages. Some might be running
    on a hosted infrastructure. Yet others may run on one of the major cloud providers.


    This is due in part to our world is evolving so quickly. We might start by running
    on Platform A but later decide to switch to Platform B for new services. The old
    services aren’t always ported immediately. And why should they, if they’re running
    great?


    Logging is often overlooked when planning these architectures. The first step
    is to log to the local system. This works well on the developer’s machine. But
    when we’re talking about multiple services deployed multiple platforms, this approach
    starts falling apart. Yet many companies keep each service logging to its own
    location.


    Migrating all your services to a single platform would be a costly and unnecessary
    solution. A far simpler solution is to keep everything where it is but send the
    logs to a central location. Of course, this means the central log can become massive.
    But with good tools, this shouldn’t be an issue.


    Centralizing logging can really save a company money. Support staff will need
    less time to find the root cause of issues. Developers will have the information
    to reproduce the issue faster. This means less frustration in the organization
    and less chance of people leaving. But it also means less frustration for your
    customers, as issues can be identified and resolved sooner.


    ### The New Serverless


    Serverless, or function as a service (`FaaS`), is a new way of developing applications.
    I’ve seen it described as microservices on steroids. Each function has a very
    limited scope. This means an application consists of tens if not hundreds (or
    thousands!) of separate functions.


    Because all these function interact with each other, it’s difficult to get an
    idea of the application’s flow by just looking at the logging of one function.
    In Amazon’s `AWS Lambda`, for example, you can use `CloudWatch` to check the logs
    of a single function. But currently, it’s still impossible to combine the logs
    of different functions; you’re forced to switch between multiple views or queries.


    Centralized logging is even more important here. Instead of having a few microservice
    logs, you can now have an incredible amount of logs in different locations.


    ### Easier, Not Simpler


    Developing software has become easier thanks to the plethora of tools that help
    developers by eliminating difficult tasks. These tools include


    *   The cloud

    *   Modern IDEs.

    *   Development frameworks and libraries.

