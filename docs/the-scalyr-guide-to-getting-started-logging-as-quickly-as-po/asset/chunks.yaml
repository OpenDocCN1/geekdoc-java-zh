    *   自动化测试、构建和部署工具。

    *   低代码或无代码平台，允许你在几乎或完全没有编程经验的情况下构建应用程序。


    但尽管事情变得更容易了，但它们并没有变得更简单。事实上，它们变得更复杂了。我们现在不再构建单一独立的应用程序，而是编写由多个较小应用程序组成的程序。这些程序相互交互，并与我们无法控制的服务进行交互。


    这一切复杂性为我们带来了巨大的优势，例如更容易扩展和提高效率。但它们也增加了可能出现错误和问题的地方。幸运的是，我们拥有现代的监控工具，它们可以快速通知我们，甚至提供上下文和信息。但日志记录（logging）仍然查看问题产生源的最佳方式。


    在这些复杂的环境中，集中式日志是获取所有必要首要方法。集中式日志让我们的生活变得简单，并允许我们更快、更廉地解决问题。


    ## 第 2 章：快速上手 Java 日志


    在我们快速上手日志记录的第一个实验中，我们将处理 Java。在本章中，我们不仅将提供一份快速指南，还会深入讨论日志记录，特别是探讨日志记录的“是什么”以及“为什么”。


    ![`blog.scalyr.com/wp-content/uploads/2018/01/Java-Logging-Icon.png`](img/Image280.png)


    ### 可能运行的最简单 Java 日志


    对于这个演示，我将使用免费的 [IntelliJ IDEA 社区版](https://www.jetbrains.com/idea/download/#section=windows)。我假设你的机器上已经安装了
    [Java JDK](http://www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133151.html?ssSourceSiteId=otnpt)。


    ![IntelliJ IDEA 截图](img/Image287.png)


    在下一个屏幕上，在左侧面板中选择 Java 作为项目类型。如果你还没有指定 JDK 路径，还需要指向它。


    ![JDK 路径截图](img/Image296.png)


    第三步——勾选“从模板创建项目”（Create project from template）选项，然后选择“命令行应用程序”（Command Line App）：


    ![新项目截图](img/Image304.png)


    我将我的项目命名为 `JavaLoggingDemo`，如下图所示。


    ![JavaLoggingDemo 截图](img/Image311.png)


    完成上述步骤后，你应该能看到自动为你创建的 `Main` 类。它看起来应该是这样的：


    ![](img/Image319.png)


    让我们开始工作吧。将 `// write your code here` 注释替换为以下行：


    ![](img/Image328.png)


    现在你有了一个显示友好问候的应用程序。


    接下来，运行我们的程序。转到 Run > Run ‘Main’，或使用快捷键 `SHIFT+F10`（Windows 和 Linux）或 Mac 上的 `CTRL+R`。


    如果一切顺利，你应该能看到类似的内容：


    ![程序文件截图](img/Image335.png)


    很好。但假设我们小程序的需求发生了变化（它们通常总是会这样）。现在，我们需要程序不仅显示一条消息，还要将其记录到某处。我们该如何做呢？


    我们有很多复杂的选项可以使用，但让我们尝试做能做的最简单的事情。编辑你 `main` 函数中的代码，使其看起来像这样：


    ![](img/Image343.png)


    注意这些变化。我们添加了一个新变量 `message` 来存储问候文本。然后是打印语句。最后是新的一行，用于将文本保存到文件中。


    我们还必须在方法中添加 `throw` 声明，因为最后一行可能会抛出 `IOException`。此外，我们添加了一些新的 import 声明。现在代码看起来如下：


    ![](img/Image351.png)


    当你再次运行应用程序时，它的行为将与之前相同。但添加的最后一行将为你创建一个日志文件。日志文件将位于你的项目文件夹中：


    ![项目文件截图](img/Image358.png)


    就是这样。你刚刚写了你的第一个 Java 日志记录器！通过这第一个小步，你已经准备好尝试更大的步了。


    ### 什么是应用程序日志？


    让我们退后一步，简要定义一下什么是应用程序日志。


    根据 [维基百科](https://en.wikipedia.org/wiki/Log_file) 的定义：


    在计算中，日志文件是记录操作系统或其他软件运行期间发生的事件，或通信软件中不同用户之间消息的文件。日志记录（Logging）是保存日志的行为。


    有点模糊，对吧？我更倾向于我们在 Scalyr 第一本关于日志记录的书开头给出的定义，[Scalyr 快速上手日志指南](https://www.amazon.com/Getting-Started-Logging-Quickly-Possible-ebook/dp/B07H8SNT2Q)：


    应用程序日志涉及将你的应用程序运行行为信息记录到更持久的介质中。


    解决了“是什么”之后，让我们来看看日志记录的“为什么”。


    ### 日志记录的动机是什么？


    我认为上一节日志定义中的关键部分是“持久”（persistent）这个词。为什么我们需要在持久介质中记录应用程序的行为信息呢？


    嗯，与我们记录任何内容到持久介质的原因相同：以便我们以后可以回顾。那么问题变成了：“你为什么想这样做？”


    这都归结为软件的本质。生产环境中的软件是非常复杂的东西，而且通常处于运行环境中。你可以一直祈祷并希望，但正如俗所说，希望不是策略。但日志记录是！


    简而言之，你使用日志记录是为了事后对应用程序进行调试。通过读取日志条目，你可以理解发生了什么，甚至回溯用户采取的步骤，以便诊断并修复问题。


    ### 演进我们的方法：我们应该捕获什么？记录到哪里？


    能够对你的程序进行事后调查听起来是一个很棒的优势——确实如此。不过，我们刚刚创建的这个简单的日志记录器并不能提供这种优势，因为它能做的只是向文件中写入一些文本。我们现在的工作应该是演进我们的日志记录器，将其变为未来读者更丰富的信息源。那么，我们该如何做呢？


    要理解的关键点是日志条目的本质。将日志条目视为一个事件。在特定的时刻，发生了对你的应用程序感兴趣的事情。因此，日志条目的价值来自于你捕获事件的数据。


    以下列表包含了一些你想要捕获的数据示例：


    *   时间戳（`timestamp`）。事件具体发生在什么时候？（如果你将其记录到文件中，你会希望使用 `UTC` 并使用 `ISO8601` 等标准格式记录时间。）

    *   上下文，让读者清楚该条目关于什么。仅仅记录“Hello, user!”在几周或几个月后可能会令人困惑。更好的消息可能是“记录了用户问候：‘Hello,
    user!’”。

    *   每个条目的标签或类别，以便日后搜索和分类。

    *   日志级别，如 `Error`、`Warning` 或 `Info`，允许更多的过滤和上下文支持。


    在决定了想要捕获的内容后，下一步是定义你想将其记录到哪里。虽然我们在示例中使用了文件，但没有什么阻止你将其记录到其他介质，例如数据库（关系型或非关系型）、Windows
    事件查看器甚至是控制台。


    ## 使用日志框架


    回到我们的演示中。事实是这样的：这个设计是为了让你快速上手 Java 日志世界。但现在你已经具备了更具批判性的视角来审视它。所以，让我们这样做吧。


    事实证明，我们简单的日志记录器在几个重要的方面上是不够的。

    '
- fmt: '

    For one thing, the code always overwrites the log file. A log strategy that only
    allows you to see the last event isn’t terribly useful, is it? Since we’re talking
    about overwriting the file, it probably wouldn’t hurt to think about file permissions,
    how to deal with concurrent access, and other things of that sort.


    Finally, it sounds like an awful lot of work having to write boilerplate code
    in each logging call to get log levels, timestamps, and all that jazz I mentioned
    in the previous section.


    I could go on and on, but you’ve got the picture: coming up with a sound Java
    logging approach requires a lot of thought. I have good news, though. As it turns
    out, people have already solved these problems. Not only that, they provide their
    solutions for you, ready to use and often for free, in the form of a logging framework.


    A logging framework is a package you install in your application that provides
    easy and configurable logging for you. With a little bit of configuration, you
    can make one-line calls as simple as the one in our toy example. But this time,
    they’ll have consistent and nicely formatted log entries, and they’ll have answers
    to all those questions from the previous section.


    ## Installing a Logging Framework


    The first thing we’re going to do is go back to our codebase and delete that line
    that writes to the file. Then we can proceed to install a logging framework called
    [Log4j](https://logging.apache.org/log4j/2.x/). This is only one of the options
    out there, and I do encourage you to try alternatives later. But since this is
    a quick guide, it makes sense to go with Log4j because it’s a widely used framework.


    On the Project tool windows, right-click on the `JavaLoggingDemo` module and then
    on Add Framework Support...


    ![Add Framework Screenshot](Images/Image368.png)


    Now, select Maven and click OK:


    ![Maven Screenshot](Images/Image375.png)


    After you’ve done this, the IDE will create a `pom.xml` file for you and open
    it for editing:


    ![Pom XML Screenshot](Images/Image382.png)


    Now, use the following XML text in your file:


    ![](Images/Image390.png)


    The whole file should look like this by now:


    ![](Images/Image397.png)


    After adding the dependencies to the file, you should see a small pop-up in the
    bottom-right corner of your screen. Click on Import Changes to finish the installation.


    ![Import Changes Screenshot](Images/Image405.png)


    ## Configuring the Logger


    Now it’s time to configure Log4j. What I’m going to show you is just one way of
    doing this; it’s not the only one, and it’s probably not even the best one, whatever
    “best” may mean. But it’s definitely shorter than a lot of the tutorials you see
    out there.


    Pretty much all you have to do is create a configuration file and then write some
    lines of code. Don’t believe me? Well, let me just show you!


    First, go to the Project tool window on IntelliJ. Expand the folders and locate
    the resources folder, under `JavaLoggingDemo > src > main`, just like in the image
    below:


    ![Java Logging Demo Screenshot](Images/Image412.png)


    Now, right-click on the resources folder and then select New > File:


    ![New File Screenshot](Images/Image420.png)


    When you’re prompted for a name, enter `log4j2.xml`. After the file is created,
    add the following text to it:


    ![](Images/Image429.png)


    ## Editing the Code


    First, at the top of the file, add the following two import declarations:


    ![](Images/Image440.png)


    Then, add the following line to the top of the `Main` class, which declares a
    private field to hold the instance of the logger:


    ![](Images/Image455.png)


    Finally, add the following line of code to where you had the call to `Files.write(Paths.get("log.txt"),
    message.getBytes())`:


    ![](Images/Image462.png)


    The whole class should now look like this:


    ![](Images/Image470.png)


    And we’re done! Now all you have to do is run the application.


    ## Checking the Results


    Now, if you navigate back to the application folder, you should notice a new file
    there called `proper.log`. If you open it using a text editor, you should see
    the following:


    ![](Images/Image477.png)


    Let’s break this line into its components.


    First, we have the timestamp, `2017-12-31 15:39:29.739`, in the ISO-8601-compliant
    format.


    Then we have `[main]`. This refers to the name of the thread from which the event
    originated.


    Next is `Info`, the logging level.


    Then comes `com.company.Main`, the name of the class.


    And last but not least, the message itself: `Hello there!`.


    ## The Power of a Logging Framework


    I think you’ll agree that our logger just got a lot more useful after the update
    we made. Just by creating a config file and writing a few lines of code, we were
    able to configure a realistic example of a logger. This isn’t all there is to
    it, of course, but it’s already enough to be useful in a real application. What’s
    more, it gives you a pretty good idea of the power a logging framework can put
    into your hands.


    The XML configuration file is one of the places this power really manifests itself.
    It offers you a lot of options to configure each entry, such as the name of log
    file or if the logger should append to it or overwrite it. A lot of the flexibility
    Log4j provides is due to something called an appender. The appender is the component
    that effectively writes the message to some, and there are many of them. This
    means it’s possible to direct your logs somewhere else—just by adding a new appender—without
    even touching your application code.


    Separation of concerns at its finest, if you ask me.


    ## What’s Next?


    What we’ve seen in this chapter is just the tip of the iceberg. If this is your
    first time logging, make no mistake: you have a lot of learning ahead of you.
    But you have a live, functional setup to work with. Here are some tips on what
    you can do:


    *   Learn how to configure different loggers, one for each log level.

    *   Research and try out the different appenders.

    *   Play with the options available for thelayout.

    *   Learn about the other ways you can configure Log4j.

    *   Try some logging frameworks.


    Learning something from the ground up can be an overwhelming task. Fortunately
    for you, you don’t have to do that. We’ve given you the fundamentals upon which
    you can build a solid and long-lasting body of knowledge. Now it’s up to you.


