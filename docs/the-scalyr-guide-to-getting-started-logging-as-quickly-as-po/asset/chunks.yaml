    ## 你应该记录什么？


    本章开头介绍的简单日志方法满足了持久化要求，因为它将日志存储在文件中。然而，它对于记录运行行为并不理想，因为它没有告诉你是每个特定事件具体何时发生的。


    这引出了一个更通用的问题：应该记录哪些信息？


    在每条日志条目中包含以下信息是一项广泛的做法：


    *   时间戳，准确说明日志条目描述的事件发生的时间。为了方便你的工作，请使用 UTC 格式下格式正确的 [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
    日期时间。

    *   具有描述性的事件上下文。例如，记录 `name: testName; email: test@test.com` 是一个坏主意，因为一个月后，你可能会忘记这些是什么意思。这里有一些上下文可以让日志条目更具描述性：`Subscription;
    user: testName email: test@test.com`。

    *   日志级别，如 Error（错误）、Warning（警告）、Info（信息）等。这些信息提供了额外的上下文，并允许你按级别轻松过滤日志。


    我建议你将上述列表视为日志策略的绝对基准，记录的信息不要少于此。否则，你在阅读和理解日志时会变得非常困难。


    ## 使用 Monolog 框架让日志变得更容易


    在本章开头的示例中，我向你展示了如何在 PHP 中进行基础日志记录。然而，我的解决方案没有记录时间戳和级别，正如你现在所知的，这是每条日志条目中必须包含的两个强制性信息。


    当然，我可以添加更多代码并增强我的解决方案以适应更高级的需求，但那样将是浪费。你看，我记录日志是因为我需要——它 true 不是我的应用程序功能的一部分。因此，我花在实现日志解决方案上的每分钟，都意味着我少有了一分钟用于开发应用程序核心功能的时间。


    幸运的是，我的日志需求与数百万其他开发者的需求非常相似，因此这个问题已经以日志框架的形式解决了。这些是第三方库，我可以将它们导入并使用到我的项目中，而无需担心它们具体是如何工作的。换句话说，在日志记录方面，我不需要重复造轮子。


    最流行的 PHP 日志框架是 [Monolog](https://github.com/Seldaek/monolog)。在接下来的章节中，我将向你展示如何在项目中使用它。


