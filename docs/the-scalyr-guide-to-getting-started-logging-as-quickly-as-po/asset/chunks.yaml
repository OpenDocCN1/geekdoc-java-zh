    There you have it—some background on Angular. Now, let’s get started with logging
    in AngularJS!


    # AngularJS Logging Application


    Let me start with a blast from the past, when Angular was young and called AngularJS.
    Even though it’s an old version now, there are many current applications still
    using Angular 1. In AngularJS (last version 1.7.2), things were simpler to bootstrap.
    Let’s revisit a simple example for logging with AngularJS.


    With Windows Explorer, create a new folder called `angular-logging`. Place this
    in your development folder on your hard drive. This folder will contain our two
    simple files: `script.js` (containing our logging logic) and `index.html` (containing
    our template view).


    In Visual Studio Code, open this folder by choosing `File > Open Folder`. Then,
    click `File > New File` (`CTRL+N`) and type the file name: `script.js`. This new
    file will contain our Angular 1 controller, which will perform the Angular logging
    logic.


    ![](Images/Image1897.png)


    When creating an Angular controller, we pass in a name for the controller and
    an array of parameters that define this controller’s dependencies. In our case,
    we’re passing the `$scope` object and the `$log` module that we’ll use.


    The last parameter is the actual function that performs our logic...logging. To
    keep things simple, we add two variables on the global `$scope` object: `logger`
    and `message`.


    The `logger` variable is the actual `$log` library, and the `message` variable
    will be bound to the HTML template `index.html`.


    Next, we create the HTML template—our view—that will be controlled by `LogController`.


    ![](Images/Image1904.png)


    What do we have in our HTML view? Let’s take a closer look above, inside `index.html`.


    After importing the Angular library and our controller code, start binding the
    HTML elements to the `LogController` and the `message` variable. In addition,
    add click listeners using the Angular 1 directive `ng-click` so that when we click
    the buttons, our controller’s function will be called.


    ## Testing Our AngularJS Logging Application


    In Firefox, click `File > Open File` and navigate to the `index.html` file. Once
    the file loads, bring up Firefox Developer Tools and then click the `Console`
    tab.


    ![https://www.hitsubscribe.com/wp-content/uploads/2018/11/angular1-logging-view.png](Images/Image1911.png)


    By clicking on the buttons, we can see the various logging levels displayed. We
    can also change the text being logged in the `Message` field since it’s bound
    two ways to the controller.


    In AngularJS, the `$log` module is a simple wrapper to `console.log` and doesn’t
    provide any extra functionality.


    There you have it! Logging with AngularJS in a few steps. In AngularJS, things
    are much simpler.


    Now, let’s move on to logging in today’s version of Angular. But before we take
    a look at that, we need to build a simple Angular application skeleton. This will
    prove to be more difficult than it was with AngularJS.


    # Building a Simple Angular Application


    Getting started with Angular is going to be different. Gone are the days when
    you can simply load an HTML file straight from your browser and get coding quickly.
    To get even a simple application bootstrapped, you must have a few things installed.


    Let’s get started! First, we’ll need to [install Node.js](https://nodejs.org/).
    Node comes with its own package manager `npm`, which we’ll need in order to install
    Angular.


    Next, we need to install the Angular command line interface (CLI). Before we can
    talk about logging with Angular, we’ll need to use `Angular CLI` to generate an
    application skeleton:


    ![](Images/Image1919.png)


    The `-g` flag stands for global. If we don’t use `-g`, Angular CLI will only be
    installed in the current folder, and it’s not going to be accessible anywhere
    else.


    If you’re on a Mac, you need to put `sudo` at the beginning of this command to
    execute it as an administrator. Otherwise, you’ll get permission errors.


    If you’re doing this for the first time, this step might take a while. Once Angular
    CLI has been installed, we can create a simple application:


    ![](Images/Image1929.png)


    Here we’re telling Angular CLI to generate a new project called `hello-world`
    and store it in a folder with the same name. It’ll be created in the folder where
    you’re running the Angular CLI commands, and it’ll contain all the files needed
    for the Angular application to run.


    Now, let’s run it.


    ![](Images/Image1938.png)


    Ugh! Now you have to wait a while (depending on your machine’s muscles) for Angular
    to actually compile all that TypeScript code that was generated. Look for an output
    like this:


    ![](Images/Image1949.png)


    ## Testing Our New Angular Application


    Finally! Now you can simply point your browser to `localhost:4200` and see the
    Angular logo. As you can see, wow—this was not trivial.


    ![https://www.hitsubscribe.com/wp-content/uploads/2018/11/angular4-hello-world-1.png](Images/Image1961.png)


    Now let’s take a look at the `hello-world` folder and see what Angular CLI actually
    created for us:


    ![https://www.hitsubscribe.com/wp-content/uploads/2018/11/angular4-hello-visual-code.png](Images/Image1968.png)


    Remember that we’re still trying to get to logging with Angular. But for now,
    here’s a quick summary of application structure: The top folder called `e2e` is
    for testing. The next one, `node_modules`, is for all the modules. If we expand
    `node_modules`, we see a lot of modules. Finally, we get to `src` folder, which
    is our source code.


    # Generating an Angular Component


    Now, as promised, let’s turn our attention to logging in Angular. We’ll add a
    new Angular component that has several buttons, and these buttons will trigger
    logging at the console. In addition, we’ll add a timestamp to each logging statement.


    ![https://www.hitsubscribe.com/wp-content/uploads/2018/11/angular-new-component.png](Images/Image1976.png)


    Our first step is to generate a new component for logging. We’ll do this using
    the Angular CLI in the same folder as our project `hello-world`.


    ![](Images/Image1983.png)


    In this command, `g` stands for generate, while `c` stands for component. `Logger`
    is the name of our new component. Taking a look at the project folder `hello-world`
    inside `src/app`, we see a new folder called `logger`.


    The `logger` folder contains the four basic parts of an Angular component: `.css`,
    `.html`, `.spec.ts`, and `.ts`.


    In addition, our application’s module file `app.module.ts` has been modified to
    automatically import the new component.


    ![](Images/Image1991.png)


    This way, as soon as we generate a new component, we can immediately use it. So,
    let’s use our brand-spanking-new Angular component.


    ## Adding Logging Logic in Our Angular Component


    To start adding logging logic, we’ll first open our application view file `app.component.html`.
    We generated this file at the very beginning when we created the hello world application.


    Let’s add our new Angular component, as well as the new custom HTML tag that was
    created (`<app-logger></app-logger>`):


    ![](Images/Image1998.png)


    Now, let’s go inside our new Angular component model `logger.component.ts` and
    add some logging logic.


    ![](Images/Image2005.png)


    Take a look at our model file. Our main method is `log(level, message)` method,
    which simply logs to the console the message passed in, according to the level
    passed in.


    Next, we’ll take a look at our model file above (`logger.component.ts`). So, the
    method `log` simply logs to the console the message passed in as a parameter.
    Additionally, logging is done according to the logging level, which is also passed
    in as a parameter. We then finish formatting each log statement to include the
    level and a simple timestamp, in addition to the message.


    Now, let’s add our controls to the HTML view in `logger.component.html`:

