    Let’s note a few things here in our view. First, notice lines 1 and 6, which are
    {{title}} and {{logStatement}}. These are our model variables that were bound
    to our view. In Angular, they’re bound two ways, which means that if the value
    changes in the view, the model value is updated and vice versa. If you change
    the value in the model, the value in the view will also be updated.


    In our particular case, the {{logStatement}} will be changed in our model as we
    click the various logging level buttons. The HTML view will update when the model
    value updates.


    Let’s take a look at our Angular logging application:


    ![https://www.hitsubscribe.com/wp-content/uploads/2018/11/angular4-logging-app.png](Images/Image2022.png)


    On the right-hand side, we have our Google Chrome console, which first displays
    the message in the ngOnInit method. Then, as we click on the various logging buttons,
    we log to the console in the appropriate logging level.


    Generating a New Service With Angular CLI


    Logging inside an Angular component was a very quick way to log with Angular,
    certainly. But that’s not the proper way to create a logging utility that can
    be reused to log in our Angular application.


    To do it properly, let’s create a logging service called LogEngine. A service
    is a small piece of our software that specializes in performing one specific function.
    Our new service specializes in logging messages to the console.


    This time, since we already have our logger component, let’s create an Angular
    service that will contain our logging logic. We’ll also change our logger component
    to only have our user interface that will use the new service.


    We could simply use the Angular CLI again to generate a service, just as we generated
    the Angular component above. To do that, in a terminal window, we’d make sure
    we’re inside our hello-world folder. We’d then use Angular CLI to generate a service
    instead of a component:


    ![](Images/Image2031.png)


    As usual, g stands for generate, while s stands for service. We’re naming our
    logging service logEngine. Notice that in addition to the service name, we also
    include the path to this new service. And let me share a piece of advice: make
    sure you don’t use the word service in the name of your service when you’re creating
    through the CLI. Angular CLI automatically adds the word service to the class
    definition.


    But I’ve chosen not to generate our new service using Angular CLI. Let’s discuss
    how to do this manually instead.


    Creating a New Angular Logging Service Manually


    This time, let’s create the new Angular logging service manually. It’s good to
    know how to do this because, many times, it’s helpful to see what happens behind
    the scenes when things are generated for us.


    In Visual Studio Code, under src/app, we’ll create a new folder called services.
    Inside that, create another new folder called log-engine. This folder will hold
    our logEngine service. Inside this new folder, let’s create a new file called
    log-engine.service.ts. This is our service file.


    ![https://www.hitsubscribe.com/wp-content/uploads/2018/11/angular-service-created-215x300.png](Images/Image2042.png)


    Next, let’s take a look at our IDE. We should still see the logger component folder
    from above. Now we have the services folder with the log-engine subfolder inside
    it. It’s here that we’ll find our new log-engine.service.ts file. In this file,
    we’ll create our LogEngineService logic.


    Now, let’s move all our logging logic from the old logger.component.ts to the
    new logging service, log-engine.service.ts.


    We’ll also refactor our logging methods to better resemble a normal logging interface,
    with specific methods for each logging level.


    Moving Logging Logic to the New Angular Service


    At this point, we’ll simply move our existing logging logic from our logger component
    to our new LogEngineService. In addition, we’ll refactor the existing log method
    and split it into specific methods dedicated to each log level. This is a much
    better interface for logging, as it resembles the well-known console logging interface.


    ![](Images/Image2054.png)


    Notice that the class name is LogEngineService. Angular CLI automatically adds
    the word service when creating a service. And we should do the same, even though
    we’re creating the file manually.


    We still want to add the logging level and the timestamp in each log entry. In
    addition, each method in our LogEngineService returns each log entry. We want
    to also display the logging statement in our application via our HTML view. This
    will become clearer in a little bit.


    Now let’s wire our LogEngineService and use it in our logger Angular component.


    Wiring the New Angular Logging Service


    To wire the service, we’ll open app.module.ts. Here’s where we define our application-level
    dependencies. We need to add our new service as one of the providers.


    ![](Images/Image2061.png)


    Notice that we added LogEngineService in the providers list—providers: [LogEngineService].


    Using Our Service Inside Our Angular Component


    Next in our journey toward logging quickly with Angular, we need to add LogEngineService
    to our logger component inside logger.component.ts. Let’s take a look at the import
    statement on top of the file:


    ![](Images/Image2069.png)


    Now our existing logger component is ready to use our new logEngine service. I’ve
    also refactored our existing component so it has clear button listeners, specific
    to each button. Our old component doesn’t have any logging logic because we’ve
    moved all that logic to our new service.


    Let’s take a look again at the entire logger.component.ts file:


    ![](Images/Image2076.png)


    I’m sure you quickly noticed the new button listeners. But what’s logService?
    Well, it’s our new LogEngineService that we just created and imported into our
    logger component. Notice the constructor. That’s how LogEngineService becomes
    logService:


    ![](Images/Image2084.png)


    Now all our button listeners can use the logService instance to call the logging
    methods on our new service.


    Take special note of the logStatement variable. We bind this model variable to
    our HTML view. Our LogEngineService updates this variable with the value of the
    last log entry. That’s why our LogEngineService log methods return every log entry.


    Refactoring the HTML View and Retesting


    The last step is to update our logger component’s HTML view (logger.component.html)
    to use the new button listeners that we just created:


    ![](Images/Image2091.png)


    Here, we just added calls to each button listener with a message. We no longer
    have to pass the desired logging level since each button listener will send the
    right logging level to the LogEngineService methods.


    All we have to do now is to save all files and refresh our application running
    at localhost:4200. Let’s take a look:


    ![https://www.hitsubscribe.com/wp-content/uploads/2018/11/angular-logging-final-debug-1024x463.png](Images/Image2098.png)


    There you have it! Same exact functionality as we previously implemented when
    we were logging from inside the container itself. However, now we have an independent
    Angular service, specialized in logging our messages, embellished with the logging
    level and timestamp.


    Enhance Your Logging Service!


    In this chapter, we learned how to get started logging quickly with Angular and
    AngularJS. We also touched on installing Angular CLI and using it to create a
    skeleton for developing with Angular. Plus, we refactored our logging component
    so that it uses an Angular logging service. That equates to much better organization
    of our code and logic.


    It’s probably obvious that logging to the console doesn’t bring much value other
    than during debugging. However, after exploring Angular services, you should have
    some ideas now about how you could enhance your logging service so that it can
    persist logs via REST calls or integrate with a log aggregation service. So go
    forth and log in Angular like a pro!'
