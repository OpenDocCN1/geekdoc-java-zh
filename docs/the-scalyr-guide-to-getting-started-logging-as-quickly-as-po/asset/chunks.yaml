    # Chapter 8: Getting Started Quickly With Scala Logging


    Now that we’ve talked about logging with a couple different languages and platforms,
    it’s time to show how you can get started quickly with Scala logging.


    First, I’ll show you with a quick example of manual logging with Scala. I’ll use
    `IntelliJ IDEA` to create and run a Scala project, using `sbt` to build the code.
    That way, you can use the application to get started on any platform that supports
    Scala and Java.


    Next, I’ll discuss details of how and why logging matters. You’ve already heard
    some other folks’ takes on this, but I’m sharing mine here.


    And finally, I’ll move on to using the Scala logging wrapper in an application,
    and I’ll tell you about how it can improve your ability to monitor your applications
    and issues.


    Let’s get started!


    ![](Images/Image1441.png)


    ## A Simple Scala Logging Implementation


    Let’s kick things off by launching Scala project. Then, we’ll show the simplest
    Scala logging that could possibly work.


    ### Creating a Scala Project


    We’ll use [IntelliJ IDEA](https://www.jetbrains.com/idea/download/) for this tutorial,
    which has a free community edition that you can download.


    First, make sure you have the Scala plugin installed and activated. Once you have
    that set up, start `IntelliJ`. Before you open any projects, select `Preferences`
    from the start screen.


    ![scala logging start plugins](Images/Image1450.png)


    Select `Plugins` from the configure menu.


    This will open the plugins management window.


    ![jetbrains plugins scala logging](Images/Image1459.png)


    Now, click `Install JetBrains plugin...` on the bottom left-hand side of the window.
    This will bring up a window listing the official JetBrains-supported plugins for
    `IDEA`.


    ![scala logging plugin](Images/Image1468.png)


    Now, select the `Languages` category at the top and scroll down until you find
    the `Scala` option. Install the plugin if it’s not already there. You’ll be prompted
    to restart the IDE after the plugin is downloaded and restarted.


    You’re ready to write Scala applications now!


    ![scala logging new project](Images/Image1479.png)


    In the next window, select `Scala` and `sbt` as shown, and then click `Next`.


    ![scala logging tutorial](Images/Image1491.png)


    Now give the project a name at the top. Verify that the latest `JDK` you have
    available is selected, as well as the `Scala SDK` and `sbt` version.


    ![scala logging last project window](Images/Image1498.png)


    If `Scala` is not installed, no `SDK` will be available. Click the `Create` button
    and download the latest available version (`2.12.7`, as of this writing). Now,
    click `Finish`, and `IDEA` will create your project.


    We have one more step to finish before we can start coding. Adding the Scala framework
    to the project will make creating Scala classes and objects easier. After the
    project is finished loading, right-click on the project name in the browser window.


    ![scala logging Add Framework support](Images/Image1506.png)


    Select `Add Framework Support...` as shown. This brings up the `Add Frameworks`
    window. Scroll down in the left-hand pane until you find `Scala`. Check the box
    and then click `OK`.


    ![Add scala framework](Images/Image1513.png)


    That’s it. Let’s write some code!


    ### Simple Scala Logging


    Let’s start with a new class. Open up the `src` folder in the project browser
    and navigate to the `Scala` folder.


    ![New Scala Class](Images/Image1521.png)


    Right-click and select `Scala Class`.


    ![](Images/Image1528.png)


    Change the selector from `class` to `object`, and give your new object a name.
    Then, click `OK`.


    `IDEA` will create a file and add skeleton code to it.


    ![](Images/Image1535.png)


    Now, modify the new class to extend the `App` class. That way, we can run it.
    Then add a single line of code:


    ![](Images/Image1543.png)


    Let’s now have the IDE run the class. Right-click on the object name in the project
    browser.


    ![scala logging run first time](Images/Image1552.png)


    Select `Run` in the menu as shown.


    A run pane will open in the IDE, and you’ll see the program output.


    ![](Images/Image1561.png)


    That was easy! But now the requirements for your application have changed. You
    need to not only log to the console but also to a file. Your operations personnel
    want to be able to go back and look at past log messages.


    There are several options for writing to a text file in Scala, but let’s use the
    simplest option. Edit the code in the object, so it looks like this:


    ![](Images/Image1572.png)


    Now, rerun the program. The output is the same, but a new file called `output.log`
    appears in the project browser.


    ![scala logging output.log](Images/Image1584.png)


    Double-click on `output.log` and the IDE will display the contents.


    ![](Images/Image1591.png)


    We have a log file.


    But there are some issues with this approach. For example, `PrintWriter` uses
    the current platform’s default encoding. So log files created on a Mac will not
    look correct when examined on Windows and vice versa.


    Let’s discuss some logging basics, and then we’ll see a better method for Scala
    logging.


    ### What Is Application Logging?


    What is logging? Why do we need it? When do we need it?


    At this point in the book, you probably have a good idea of what logging is. And
    you may have already dealt with it in an application that you’ve created or maintained.
    But let’s revisit our definition so we can evaluate a logging framework in terms
    of what we need. Way back at the start of this book, we defined application logging
    this way:


    Application logging involves recording information about your application’s runtime
    behavior to a more persistent medium.


    Let’s take a closer look at this definition.


    When we log, we record runtime behavior. We document the events that occur inside
    an application. While it’s not explicit in this definition, we can also assume
    that the events are recorded in chronological order.


    Second, we store logs in a more persistent medium, like a disk, a relational database,
    or a search engine. Sometimes application events occur more quickly than we can
    follow in real time. We want to be able to review them later. Maybe we’re trying
    to track down an error, or perhaps we have to maintain an audit trail.


    The following list contains some examples of things that you’ll probably want
    to capture in a log entry:


    *   A timestamp. Exactly when did the event take place? (You’ll want to record
    times in `UTC`, using a standard format such as `ISO8601`, in case you’re logging
    to a file.)

    *   A context that makes it clear to a reader what the entry is about. Just recording
    “Hello, user!” might be difficult to decipher weeks or months later. A better
    message might say, “User greeting of ‘Hello, user!’”

    *   Log levels, such as `Error`, `Warning`, or `Info`. These provide context.


    ## Enter Logging Framework


    So, that’s what logging is. Our simple solution above only scratches the surface
    of what we need for effective logging. It also relies on the developer to open
    the file, close it, manage the log entry format, and avoid overwriting old log
    entries when the application is restarted. Also, the solution wouldn’t scale across
    multiple objects. We would have to write a library or framework for that.


    I could continue, but I’m sure you understand. Creating a sound logging approach
    requires a lot of work and a lot of thought. But these problems have already been
    solved for Java and, as a result, for Scala.


    `Scala-logging` is a library that wraps the [Simple Logging Facade for Java (SLF4J)](https://www.slf4j.org)
    in a Scala-friendly library. SLF4J supports many different logging frameworks,
    including `Log4j`, which we covered earlier in the book; and [Logback](https://logback.qos.ch),
    a similar framework. We’re going to use `Logback` for this tutorial because the
    set will be easier.


    Let’s get back to the tutorial.


    ### Using a Framework for Scala Logging


    First, we need to add `SLF4J` to our application dependencies. Open `build.sbt`
    in the code editor.


    ![scala logging build.sbt](Images/Image1599.png)

