    `disable_existing_loggers`: 此设置用于禁用现有的日志器。默认值为 `False`，但显式设置也无妨。当将此项设置为 `True`
    时，请定义额外的日志器。否则，消息可能会丢失。


    `formatters`: 此部分定义了日志语句的外。让我们来看控制台日志格式：


    ![](img/Image1818.png)


    以下是其工作原理：


    * `%(name)`：这是发布日志消息的包名。

    * `%(levelname)`：消息的日志级别（Error, Warning, Info 等）。

    * `%(message)`：这是实际的日志消息。


    `-12s` 和 `-8s` 控制不同格式规范之间的间距。该格式下的示例消息如下：


    ![](img/Image1826.png)


    你会发现文件格式化器（file formatter）包含了一个额外的指定符 `%(asctime)`。它为通过文件处理器发送的每条消息添加了时间戳。例如，我们定义的
    `debug.log` 中的消息将如下所示：


    ![](img/Image1835.png)


    `handlers`: 此部分定义了如何处理日志消息。我们可以将消息发送到控制台、文件，甚至是套字！所有的默认处理器都在 Python [官方网站的文档](https://docs.python.org/3/library/logging.handlers.html)
    中。此配置定义了单独处理器：一个用于控制台消息，另一个用于发送到文件的消息。此外，对于文件处理器，我们指定了处理器类、记录日志的文件以及日志级别。该处理器还指定了使用哪种格式化器。


    `loggers`: 最后这一部分是将所有内容整合在一起并定义日志器的地方，包括如何处理根日志器（由空字符串表示）的消息。我们还将日志级别设置为 `Debug`，并定义了两个处理器——一个到控制台，一个到文件。


    现在让我们更新配置并运行一下吧。


    ## 更新并测试新配置


    更新 `app/views.py` 以包含上述日志配置。它看起来应该是这样的：


    ![](img/Image1844.png)


    像以前一样运行并刷新浏览器，控制台日志消息现在包含了来自我们格式化字符串的额外信息：


    ![](img/Image1855.png)


    日志文件将包含相同的消息和格式，但增加了时间戳：


    ![](img/Image1867.png)


    这对于在任何 Django 项目中引入日志记录已经足够了。然而，我们还有一个主题要介绍：Django 提供的日志扩展。


    ## 浏览 Django 日志扩展


    在 Web 服务器环境中，我们经常有需要记录的常规信息。Django 提供了几个日志扩展来涵盖这些用例。


    * `django`：这是一个用于 `django` 层次结构中消息的通型日志器。不会使用此日志器名称发布消息，因为将使用以下日志器之一。

    * `django.request`：此日志器处理 HTTP 请求的记录，并会对某些状态码抛出异常。所有的 HTTP 5xx 错误码将引发 `Error`
    消息。同样，HTTP 4xx 码将显示为 `Warning` 消息。

    * `django.server`：当使用 `runserver` 命令运行服务器时（我们一直一直在这样做），它将记录与处理这些请求相关的消息，就像 `django.request`
    日志器一样——只是所有其他消息都以 `Info` 级别记录。这些是不会触发 HTTP 5xx 或 4xx 状态码的消息。

    * `django.template`：无论我处理 Django 模板有多少次，从没有在第一次组合时不出错。`django.template` 日志器处理与模板渲染相关的错误。缺失的上下文变量将以
    `Debug` 消息的形式出现在日志中。

    * `django.db.backends`：此日志器处理代码与数据库交互的所有消息。所有应用程序级别的 SQL 语句将以 `Debug` 级别出现。由于这可能会产生大量噪音，需要通过将
    `settings.DEBUG` 改为 `True` 来启用 `Debug` 日志。

    * `django.security.*`：Django 为安全错误提供了处理器。特别是，日志器将接收任何由 `SuspiciousOperation` 错误引起的消息。Django
    为每种安全错误定义了子类，例如 `DisallowedHost` 或 `InvalidSessionKey`。`SuspiciousOperation` 的其余子类可以在
    [Django 网站](https://docs.djangoproject.com/en/2.1/ref/exceptions/#django.core.exceptions.SuspiciousOperation)
    [文档中的异常页面下](https://docs.djangoproject.com/en/2.1/ref/exceptions/#django.core.exceptions.SuspiciousOperation)
    找到。提醒一下——如果 `django.security` 日志器处理了消息，它将不会通过 `django.request` 日志器发送。所以不要忽略来自
    `django.security.*` 日志的消息！

    * `django.security.csrf`：此日志器没有继承自其他安全处理器扩展的 `SuspiciousOperation` 日志器。它处理由于跨站请求伪造（CSRF）攻击引起的任何异常。


    作为最后一个示例，让我们记录来自 `django.request` 扩展的消息。通过像所示将日志器添加到配置的日志部分来实现：


    ![](img/Image1874.png)


    这将记录如下请求消息：


    ![](img/Image1882.png)


    请尽管尝试，不要忘记记录 `django.security.*` 消息！


    ## 你可以的！


    信息非常多，让我们总结一下：


    * Django 使用标准的 Python 日志设施。

    * 日志设置通过 `logging.dictConfig` 字典设置。

    * Django 提供了几个[日志扩展](https://docs.djangoproject.com/en/2.1/topics/logging/#django-logging-extensions)
    来处理常见的服务器问题。


