    本教程使用了 [Ruby v2.5.1](https://www.ruby-lang.org/en/downloads/) 和 [Rails 5.2.0](https://weblog.rubyonrails.org/2018/4/9/Rails-5-2-0-final/)。你需要安装这些版本才能跟上操作。这些指令将使用命令行来创建和配置应用程序，而不会依赖于特定的
    IDE 或编辑器。我们将让 Rails 使用 `SQLite` 作为后端数据库。


    ![](img/Image1007.png)


    # 创建 Rails 应用程序


    我们将从创建一个 Rails 应用程序开始。首先运行此命令：


    ![](img/Image1019.png)


    在几屏输出后，Rails 已经创建了应用程序。


    接下来，我们将让 Rails 为我们创建一个模型（model）和一个控制器（controller），这样我们就有有趣的内容可以记录了。进入 `logging_app`
    目录并运行此：


    ![](img/Image1026.png)


    Rails 为带有名称和电子邮件地址的用户记录创建了脚架（scaffolding）。


    最后，让 Rails 将应用程序迁移到 `SQLite`。


    ![](img/Image1034.png)


    我们有一个应用程序了！让我们运行它并确认一切都已就绪。


    ![](img/Image1042.png)


    将浏览器指向 `http://localhost:3000/users`，我们看到了管理用户的主页：


    ![](img/Image1050.png)


    我们准备好开始记录了！


    # Rails 日志器


    Rails 在初始化时创建一个 `ActiveSupport::Logger` 实例，并使用它将日志输出到标准输出。


    查看我们打开 `/users` 页面时应用程序的输出：


    ![](img/Image1057.png)


    `Logger` 产生了这种输出。除了标准输出外，我们还可以在默认日志文件中找到相同的输入。停止服务器并查看日志文件的最后十行：


    ![](img/Image1064.png)


    日志文件的默认名称是环境名称。在开发环境中，它命名为 `development.log`；在生产环境中，它名为 `production.log`；以此此类推。


    默认日志器通过一个全局可用的实例 `logger` 供应用程序代码使用。让我们在应用程序显示用户时添加额外的调试消息。


    首先，在 `app/user_controller.rb` 的 `show` 方法中添加日志消息。


    ![](img/Image1071.png)


    然后启动应用程序。访问 `/users` 并添加一个名为 John Doe、电子邮件地址为 john@doe.com 的用户。


    你的日志应该有一个类似这样的条目：


    ![](img/Image1080.png)


    Rails 以为开发者提供便利而闻名，日志记录就是它获得声誉的例子之一。让我们看看如何自定义 Rails 日志器。


    ## 什么是应用程序日志？


    在深入如何改进 Rails 日志器之前，让我们回到基本原理。我们试图要做什么？应用程序日志是什么？如果你读过我们的其他章节，你已经对我们的定义非常熟悉了：


    应用程序日志涉及将你的应用程序运行行为的信息记录到更持久的介质中。


    所以，在 Rails 中，我们已经看到有方法将应用程序信息记录到文件和标准输出中，我们的 DevOps 团队可以通过标准输出将其重定向到他们想要的地方。但我们还可以做更多。


    ## 应用程序日志目的是什么？


    我们为什么要写日志？这似乎是一个显而易见的问题，但值得考虑。


    我们写日志是为了对正在发生的事情有一个记录。


    我们已经将代码发布到生产环境，并且我们需要去处理其他事情。但在某个时刻，某些事情会出错，我们会被要求诊断问题。日志通常是我们唯一拥有的东西。


    当没有任何问题发生时，我们也可能被要求提供有关生产环境中发生情况的信息。每天加载多少页面？每小时？每分钟？用户来自哪里？哪些功能使用最频繁，哪些功能被忽略了？


    虽然其中一些信息可以通过网络分析获得，但日志可以深入到更高级层次的细节。


    应用程序日志是帮助我们定位和修复错误，以及收集帮助我们改进应用程序的信息的关键工具。


    ## 我们应该记录什么信息？


    我们从 Rails 看到的这些是关于应用程序中正在发生的事情的消息。不过，它们缺乏上下文。让我们定义我们从日志消息中想要什么，然后配置系统来提供这些。


    一个日志条目代表一个事件。应用程序发生了某些事情，开发者认为它足够有趣可以保存以备日后审查。


    关于一个事件我们最想知道的可能是它发生的时间。到目前为止看到的任何日志条目都没有时间戳。我们需要添加它。


    拥有一些上下文也是很有用的。我们之前在代码中添加了这条日志消息。


    ![](img/Image1089.png)


    Rails 记录了这些：


    ![](img/Image1100.png)


    Debug 发生了什么？我们在 `Debug` 级别调用了 `logger`，但该信息没有传递。在默认配置下，所有日志条目看起来都等价，降低了它们的用途。


    让我们开始更改 Rails 日志器的配置。


    # 配置日志


    像大多数日志器一样，`ActiveSupport::Logger` 支持不同的级别。这些级别是 `Debug`、`Info`、`Warn`、`Error`
    和 `Fatal`。


    我们可以通过调用这些任何一个级别来记录消息：


    ```ruby

    debug("message")

    ```


    这给了我们分类消息的方法。但让我们先看看过滤。`Debug` 消息对于调试是有用的。


    我们可以过滤哪些消息进入控制台：


    ```ruby

    logger.level = :error

    ```


    Rails 具有分级配置方案。我们可以在 `config/application.rb` 或 `config/environment/{environment_name}.rb`
    中配置。环境特定的文件具有优先级。


    所以当我们在 `config/application.rb` 中添加这些……


    ![](img/Image1119.png)


    并在 `config/development.rb` 中添加这些……


    ![](img/Image134.png)


    ……我们仍然在开发环境中看到 `Debug` 消息，但在生产环境中只看到 `Error`。


    我们可以通过向 Rails 提供初始化了我们偏好的 `logger` 实例来更改日志文件的名称和位置。


    ```ruby

    config.logger = ActiveSupport::Logger.new("log/development")

    ```


    这意味着如果我们想要，也可以创建 `Logger` 的新子类。


    但让我们改变现在最感兴趣的行为：日志消息格式。


    # 日志消息格式


    Rails 配置有一种机制为 Rails 提供日志消息格式化实例。第一步是创建那个格式化器类。


    ![](img/Image149.png)


    我们扩展了 `ActiveSupport::Logger::SimpleFormatter` 并重写了它的 `call` 方法。配置一个 `SimpleFormatter`
    的实例。


    `Logger` 向 `call` 传递四个参数。它们是：


    - 日志级别（作为严重性）。

    - 消息的时间。

    - 程序名。

    - 消息内容。


    我们将严重性格式化为固定宽度字段，并将时间格式化为可读的字符串。然后我们将这些部分组合成熟悉的消息格式。


    我们有多种方法可以将此类添加到我们的代码中。在 Rails 中使用 `libs` 目录是有争议的，但为了安装格式化器，我们将使用它。


    首先，在 `logging_app/libs` 中创建 `message_formatter.rb`。


    接下来，由于 Rails 5.x 不会自动加载 `lib` 中的类，在 `config/application.rb` 的 `LoggingApp` 类声明中添加这些行：


    ```ruby

    config.autoload_paths << Rails.root.join(''libs'')

    ```


    最后，在 `config/environment/development.rb` 中添加格式化器：


    ```ruby

    config.logger.formatter = MyCustomFormatter.new

    ```


    当我们运行服务器并打开用户条目时，我们看到了带有自定义格式的日志消息。


    ![](img/Image1173.png)


