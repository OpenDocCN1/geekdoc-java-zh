    sample app and add logging to it. But if this tutorial isn’t quite what you were
    looking for, go check out the basic JavaScript and Node.js chapters from our first
    logging book, [The Scalyr Guide to Getting Started Logging as Quickly as Possible](https://www.amazon.com/Getting-Started-Logging-Quickly-Possible-ebook/dp/B07H8SNT2Q).
    They’ll cover anything else you might need.


    But don’t worry, we’ll still cover these topics:


    *   Meteor overview


    *   Basic logging


    *   Where to log


    *   What to log


    Now let’s get started.


    ![Meteor_logging_image_with_scalyr_colors](Images/Image2106.png)


    Meteor Overview


    If you came to this chapter with some experience using Meteor, you might not need
    this section. But I’d like to make sure we’re all starting from the same point,
    so here’s some quick Meteor info. Don’t worry. I’ll be brief.


    Meteor provides a full-stack JavaScript platform for developing web and mobile
    apps. It includes a number of packages from Node.js and other JavaScript libraries.
    And it focuses on and provides full stack reactivity so your UI acts seamlessly
    with your backend server. And as a bonus, it provides easy MongoDB integration
    right out of the box.


    Basic Logging


    As I mentioned above, instead of creating a bare application, we’re going to clone
    one of the existing sample applications that the folks over at Meteor have provided.
    Since we’re adding logging to an already existing app, we’ll be able to see different
    logs come through with minimal effort.


    Setup


    If you haven’t used Meteor before, no worries—basic setup is a breeze. First,
    you’ll need to install both Node.js and npm. If you’re on a Mac, you’ll need Xcode
    as well.


    For step two, we’ll install Meteor using either Chocolatey or a curl command,
    depending on your operating system.


    ![](Images/Image2115.png)


    All set? Great. Next, let’s clone the simple todo app from Meteor:


    ![](Images/Image2124.png)


    Once you’ve got everything downloaded and installed, cd into the simple-todo directory
    and run the app using the Meteor command.


    ![https://library.scalyr.com/2019/02/15124602/011.png](Images/Image2135.png)


    Once the application has started, go to http://localhost:3000/. You should see
    a simple todo app there.


    ![https://library.scalyr.com/2019/02/15124645/021-1024x463.png](Images/Image2147.png)


    You should be able to add users, add items to the checklist, and so on. Go ahead
    and play around with it. I’ll be waiting at the next section for you.


    Console Logging


    Now that you’ve had a chance to check out the application, let’s get started.
    To demonstrate simple logging, we’re going to add some console logs to our application.
    This can be helpful for debugging issues on the client side while you’re developing.
    But it won’t do much for you once your application is being used by someone out
    in the real world—you won’t have access to their console logs.


    To start, let’s add some code to the imports/api/tasks.js file. This file contains
    the JavaScript that’s executed when we add or remove tasks from the list. In the
    tasks.insert method, add the log.console line shown in this image:


    ![https://library.scalyr.com/2019/02/15124721/031-1024x439.png](Images/Image2154.png)


    Next, after saving that file, head over to your browser window. It should have
    updated automatically, so you don’t have to restart the app. When you add a new
    task, you should see the output in your browser console.


    ![https://library.scalyr.com/2019/02/15124750/041-1024x280.png](Images/Image2162.png)


    Looks great, right? What if we also want to add some user context? Modify the
    line in the tasks.insert method to also print out the userId object that this
    application has defined.


    ![](Images/Image2169.png)


    After that, you should see something like this:


    ![https://library.scalyr.com/2019/02/15124816/051-1024x221.png](Images/Image2177.png)


    Not super helpful, is it? Let’s make it a little more useful by asking Meteor
    to find the username associated with this ID instead.


    ![](Images/Image2184.png)


    Yes, that looks much better!


    ![https://library.scalyr.com/2019/02/15124841/06-1024x243.png](Images/Image2191.png)


    OK, now that we’ve done some simple console logging, we can move on to the next
    section. However, I have one thing I’d like you to do first.


    Now that you have a Meteor application up and running, take some time to explore
    its various functionalities by adding your own console logging throughout the
    code. It really helps you understand the application by seeing data flow through
    the system as you use it. And though these may not be logs you want to keep around
    forever, they’ll help you gain a sense of what goes into a good Meteor application.


    Where to Log


    Let’s return to something I mentioned at the beginning of the console logging
    section. You won’t be able to view your customer’s console.log files. So let’s
    discuss what you should do instead.


    Send Logs to the Server


    As discussed, if your application is being used by actual customers, you won’t
    have access to their console logs. Sure, you could have them open their browser
    console and send you what’s there every time there’s an issue. But you’re assuming
    that people will know how to do that. And even if they do know, it doesn’t provide
    a great user experience for them.


    So what can we do instead? Well, instead of just writing to a console, we could
    send logs back to the server. But then what?


    Save Logs for Later Use


    With Meteor, one option could be to set up a logging table in MongoDB. So instead
    of just inserting tasks as our example above shows, we could insert logging or
    error messages. However, storing logs in a database typically doesn’t make sense.
    You want to store them somewhere easily accessible so you can start harvesting
    some analytics.


    Let’s consider another option. How about taking a look at some of Scalyr’s [APIs](https://www.scalyr.com/help/api)?
    There are a lot of goodies there. And two of them let us add events to our Scalyr
    logs, either one at a time or by batch. So instead of logging to the console or
    saving the logs to our database, we can send events that require logging right
    back to Scalyr.


    In this situation, I would send the logs over to the server side of my Meteor
    application and then call the Scalyr APIs with the token tied to my account. Let’s
    go over this in greater detail.


    First, adding simple HTTP functionality to your Meteor app requires running the
    following command within your Meteor directory.


    ![](Images/Image2199.png)


    That will let you make HTTP calls to remote servers easily.


    Then we can use the following syntax to send an event to Scalyr’s addEvents API.


    ![](Images/Image2208.png)


    You may have noticed that I broke out the username from the message I sent. That’s
    because breaking parts of the log into separate attributes will help with searching
    later.


    What to Log


    With great logging comes great responsibility. So what should we log in our applications?'
