    But at some point, you need to release the application to your users. They will
    use it in original ways and in environments you couldn’t have imagined, and there
    will potentially be many of them using the application concurrently. Plus, your
    application will need to function for much longer periods of time. Debugging errors
    in this situation is impossible without additional information.


    Enter logging.


    Having a record of your application’s past runtime behavior allows you to investigate
    all kinds of undesired behavior post-factum. In other words, even if your application
    crashes and loses all its runtime state, you’ll still be able to understand what
    led to that crash using application’s logs.


    But the usefulness of logs doesn’t stop there. Logs become priceless when users
    report bugs. They can audit your application, including regulatory audits required
    in specific business domains. Or they can be processed and analyzed in real time
    to warn you about potential performance issues. That’s just to name a few things.


    In short, application logging is a must for production applications because it
    gives you visibility into your application’s runtime history.


    ## What Should You Log?


    The simple logging approach from the beginning of this chapter fulfills the persistence
    requirement because it stores the logs in a file. However, it’s not great for
    recording runtime behavior because it doesn’t tell you exactly when each specific
    event happened.


    This leads to a more general question: what information should be logged?


    It’s a widespread practice to include at least the following information in each
    log entry:


    *   A timestamp that states exactly when the event described by the log entry
    happened. To make your life easier, use properly formatted [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
    date/time in UTC.

    *   Event context that is descriptive. For example, it would be a bad idea to
    log `name: testName; email: test@test.com` because a month from now, you’ll probably
    forget what this means. Here’s some context to make the log entry more descriptive:
    `Subscription; user: testName email: test@test.com`.

    *   Log severity level, such as Error, Warning, Info, etc. This information provides
    additional context and allows you to easily filter logs by severity.


    I suggest that you treat the above list as the absolute baseline for your logging
    strategy and don’t log less information than that. Otherwise, you’ll have a hard
    time reading your logs and making sense of them.


    ## Make Logging Easier With the Monolog Framework


    In the example at the beginning of this chapter, I showed you how to do basic
    logging in PHP. However, my solution didn’t log timestamps and severity levels,
    which, as you now know, are two mandatory pieces of information that must be included
    in each log entry.


    Sure, I can add more code and enhance my solution to accommodate more advanced
    needs, but that would be a waste. See, I do logging only because I need to—it’s
    not really part of my application’s functionality. Therefore, each minute I spend
    on implementing logging solutions is one less minute I have to work on the core
    functionality of my application.


    Luckily, my logging needs are very similar to the needs of millions of other developers,
    so this problem has already been solved in form of logging frameworks. These are
    third-party libraries that I can import and use in my project without having to
    concern myself with exactly how they work. In other words, there’s no need for
    me to reinvent the wheel when it comes to logging.


    The most popular logging framework for PHP is [Monolog](https://github.com/Seldaek/monolog).
    In the next sections, I’ll show you how you can use it in your projects.


    ### Installing Monolog PHP Logging Framework


    If you’re developing your application using a PHP framework (like Laravel, for
    example), chances are this framework already integrates with `Monolog`. Check
    your framework’s documentation for details.


    Since I’m working with a very simple PHP project, I can show you how to install
    and use `Monolog` from scratch.


    First, you’ll need to install the PHP [Composer](https://getcomposer.org/doc/00-intro.md)
    package manager. The following commands will achieve that:


    ```

    ![](Images/Image751.png)```


    Once you’ve got `Composer` on your machine, go to the root directory of your project
    at `/var/www/html/` and execute the following command:


    ```

    ![](Images/Image758.png)```


    This command will create `vendor` directory and import `Monolog` files there.
    The next step will be to make use of `Monolog` from within the PHP code.


    ### Using Monolog


    To use `Monolog` in your code, you’ll need to load it as a dependency. For this
    purpose, `Composer` conveniently generated an `autoload.php` file that you can
    access from your code.


    Put the following code at the top of your PHP script in an `index.php` file:


    ```

    ![](Images/Image766.png)```


    And right after that, specify two specific `Monolog` dependencies that you’re
    going to use:


    ```

    ![](Images/Image773.png)```


    `Logger` is the object that generates logs, and [StreamHandler](https://docs.python.org/2/library/logging.handlers.html)
    is a special object `Logger` uses internally to write logs to files. As you might
    guess, `Monolog` supports different handlers that allow you to route the logs
    into different mediums.


    So far, you’ve loaded `Monolog` and imported specific dependencies. Now instantiate
    a new `Logger` and name it `SimpleLogger`:


    ```

    ![](Images/Image781.png)```


    Next, use `StreamHandler` to make sure the logger stores the logs into your existing
    `server.log` file:


    ```

    ![](Images/Image788.png)```


    The second parameter in `StreamHandler`’s constructor defines the lowest severity
    level it picks up. Since you want it to capture all log entries in this case,
    specify the lowest severity level, which is `Debug`.


    After setting up the `Logger` object, you can replace your old logging implementation
    with `Monolog`’s logger. So, delete this line:


    ```

    ![](Images/Image796.png)```


    Now replace it with the following call:


    ```

    ![](Images/Image805.png)```


    As you can see, even though you had to do a bit of upfront setup, this process
    made logging much simpler. Given that in real applications you might want to log
    hundreds of events, this conciseness will become very handy.


    All in all, your `index.php` file should look like this:


    ```

    ![](Images/Image819.png)```


    ### Reading Monolog Logs


    If you go to `http://localhost` in your browser again, specify the same user details,
    and click on subscribe, a new log entry will be added to `server.log` file. Let’s
    contrast the original log entry from the first example with the one generated
    by `Monolog`.


    Here’s the original log entry:


    ```

    ![](Images/Image833.png)```


    And here’s what `Monolog` produced:


    ```

    ![](Images/Image840.png)```


    As you see, `Monolog` automatically added the following information to the log
    entry:


    *   Timestamp

    *   Logger name

    *   Log severity level


    And the best part is that you didn’t need to write all stuff yourself.


    The only issue with this log entry is that the timestamp is not UTC. There are
    at least two ways to fix that:


    1.  Specify UTC timezone when instantiating `Logger`.

    2.  Specify UTC timezone for the entire PHP script.


    In most cases, you’ll want your entire application to use UTC time, so I suggest
    adding the following method call at the top of your PHP script:


    ```

    ![](Images/Image848.png)```


    All date and time function calls following this line will use UTC timezone by
    default—very useful.


    ## What Now?


    In this chapter I’ve explained the basics of logging in PHP, which should be enough
    to get you started. Still, you might want to search for more advanced information
    to solidify your understanding.


    If you’re going to use `Monolog` (as you probably should), invest some time into
    reading its [documentation](https://github.com/Seldaek/monolog/blob/master/doc/01-usage.md).
    This logging framework is extremely powerful and configurable, which allows you
    to support basically any logging requirements.

