    # 第 8 章：快速上手 Scala 日志


    现在我们已经讨论了使用不同语言和平台的日志记录，现在是向你们展示如何快速上手 Scala 日志记录了。


    首先，我将通过一个简单的 Scala 手动日志示例向你们演示。我将使用 `IntelliJ IDEA` 创建并运行一个 Scala 项目，并使用 `sbt`
    来构建代码。这样，你就可以通过应用程序在任何支持 Scala 和 Java 的平台上启动。


    接下来，我将讨论日志记录的细节以及为什么很重要。你可能已经听过其他人对此的看法，但我在这里也会分享我的见解。


    最后，我将介绍如何在应用程序中使用 Scala 日志包装器（wrapper），并告诉你们它可以如何提高你监控应用程序和问题的能力。


    让我们开始吧！


    ![](img/Image1441.png)


    ## 简单的 Scala 日志实现


    让我们从启动 Scala 项目开始。然后，我们将展示可能的最简单的 Scala 日志记录。


    ### 创建 Scala 项目


    本教程将使用 [IntelliJ IDEA](https://www.jetbrains.com/idea/download/)，你可以下载其免费的社区版。


    首先，确保你已经安装并激活了 Scala 插件。设置完成后，启动 `IntelliJ`。在打开任何项目之前，从启动界面选择 `Preferences`（设置）。


    ![scala logging start plugins](img/Image1450.png)


    从配置菜单中选择 `Plugins`（插件）。


    这将打开插件管理窗口。


    ![jetbrains plugins scala logging](img/Image1459.png)


    现在，点击窗口左下角的 `Install JetBrains plugin...`（安装 JetBrains 插件...）。这将弹出一个列出 IDEA 官方支持的插件的窗口。


    ![scala logging plugin](img/Image1468.png)


    现在，选择顶部的 `Languages`（语言）类别并向下滚动直到找到 `Scala` 选项。如果尚未安装，请安装该插件。插件下载完成后，系统会提示你重启
    IDE。


    你现在准备好编写 Scala 应用程序了！


    ![scala logging new project](img/Image1479.png)


    在下一个窗口中，如所示选择 `Scala` 和 `sbt`，然后点击 `Next`（下一步）。


    ![scala logging tutorial](img/Image1491.png)


    现在在顶部为项目命名。验证是否选择了你当前可用的最新 `JDK`，以及 `Scala SDK` 和 `sbt` 版本。


    ![scala logging last project window](img/Image1498.png)


    如果没有安装 `Scala`，将没有可用的 `SDK`。点击 `Create`（创建）按钮下载最新的可用版本（截至本文发布为 `2.12.7`）。现在点击
    `Finish`（完成），`IDEA` 将创建你的项目。


    在开始编码之前，我们还需要完成最后一步。向项目添加 Scala 框架将让创建 Scala 类和对象变得更容易。项目加载完成后，在浏览器窗口中右键点击项目名称。


    ![scala logging Add Framework support](img/Image1506.png)


    如所示选择 `Add Framework Support...`（添加框架支持...）。这将弹出 `Add Frameworks`（添加框架）窗口。在左侧面板中向下滚动直到找到
    `Scala`。勾选框并点击 `OK`。


    ![Add scala framework](img/Image1513.png)


    好了。让我们写些代码吧！


    ### 简单的 Scala 日志


    让我们从一个新类开始。在项目浏览器中打开 `src` 文件夹并导航到 `Scala` 文件夹。


    ![New Scala Class](img/Image1521.png)


    右键并选择 `Scala Class`。


    ![](img/Image1528.png)


    将选择器从 `class` 改为 `object`，并给你的新对象命名。然后点击 `OK`。


    `IDEA` 将创建一个文件并为其添加骨架代码。


    ![](img/Image1535.png)


    现在，修改新类以扩展 `App` 类。这样我们就可以运行它了。然后添加一行代码：


    ![](img/Image1543.png)


    现在让 IDE 运行该类。在项目浏览器中右键点击对象名称。


    ![scala logging run first time](img/Image1552.png)


    如所示在菜单中选择 `Run`（运行）。


    IDE 中打开一个运行面板，你将看到程序的输出。


    ![](img/Image1561.png)


    这很简单！但现在你的应用程序发生了发生了。你不仅需要将日志记录到控制台，还要记录到文件中。你的运维人员希望能够回溯查看过去的日志消息。


    在 Scala 中写入文本文件有多种选项，但让我们使用最简单的选项。编辑对象中的代码，使其看起来像这样：


    ![](img/Image1572.png)


    现在重新运行程序。输出相同，但项目浏览器中出现了一个名为 `output.log` 的新文件。


    ![scala logging output.log](img/Image1584.png)


    双击 `output.log`，IDE 将显示内容。


    ![](img/Image1591.png)


    我们有了一个日志文件。


    但这种方法存在一些问题。例如，`PrintWriter` 使用当前平台的默认编码。因此，在 Mac 上创建的日志文件在 Windows 上查看时可能显示不，反之亦然。


    让我们讨论一些日志的基础知识，然后看一种更好的 Scala 日志记录方法。


    ### 什么是应用程序日志？


    什么是日志？为什么我们需要它？我们我们需要它？


    在书的这里，你可能对日志是什么有了很好的了解。你可能已经在你创建或维护的应用程序中处理过它。但让我们回顾一下定义，以便根据我们的需求来评估日志框架。在本书的开头，我们这样定义应用程序日志：


    应用程序日志涉及将应用程序的运行时行为信息记录到更持久的介质中。


    让我们仔细审视这个定义。


    当我们记录日志时，我们记录的是运行时行为。我们记录了应用程序内部发生的事件。虽然这个定义中没有明确说明，但我们也可以假设事件是按时间顺序记录的。


    其次，我们将日志存储在更持久的介质中，如磁盘、关系型数据库或搜索引擎。有时应用程序事件发生得比我们实时跟进的速度快。我们希望以后能够查看它们。也许我们正试图追踪某个错误，或者我们必须维护审计追踪。


    以下列表包含了你可能想记录在日志记录中的某些示例：


    *   时间戳。事件具体何时发生？（如果你记录到文件，你可能希望使用 `UTC` 时间并使用 `ISO8601` 等标准格式。）

    *   上下文，让读者清楚条目的含义。仅仅记录“Hello, user!”在几周或几个月后可能很难解释。更好的信息可能是“User greeting of‘Hello,
    user!”

    *   日志级别，例如 `Error`、`Warning` 或 `Info`。这些提供了上下文。


    ## 引入日志框架


    所以，这就是日志记录。我们上面的简单方案只触及了有效日志所需的表面。它还依赖开发者打开文件、关闭文件、管理日志条目格式并在应用程序重启时不覆盖旧日志。此外，该方案无法在多个对象之间扩展。我们需要为此编写库或框架。


    我可以继续，但我相信理解这需要大量的工作和思考。但这些问题已经在 Java 中得到了解决，因此也适用于 Scala。


    `Scala-logging` 是一个将 [Java 简单日志门面 (SLF4J)](https://www.slf4j.org) 封装的 Scala 友好型库。SLF4J
    支持许多不同的日志框架，包括我们在本书早些介绍过的 `Log4j`；以及 [Logback](https://logback.qos.ch)，一个类似的框架。我们将在本教程中使用
    `Logback`，因为设置会更简单。


    让我们回到教程。


    ### 使用框架进行 Scala 日志记录


    首先，我们需要将 `SLF4J` 添加到应用程序依赖中。在代码编辑器中打开 `build.sbt`。


    ![scala logging build.sbt](img/Image1599.png)


