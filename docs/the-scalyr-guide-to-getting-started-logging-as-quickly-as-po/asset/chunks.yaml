    ### Logger Hierarchy


    `Log4j` arranges loggers in a hierarchy. This makes specifying a different configuration
    for individual classes possible.


    Let’s change our application and see this in action.


    ![](Images/Image585.png)


    We’ve added an inner class that creates a logger and logs a message with it.


    After `Main` does its logging, it calls `LoggerChild`.


    If we run this with our current config, we see the new message and that it’s logged
    from a different class.


    ![](Images/Image593.png)


    Logger have a class hierarchy similar to Java’s. All loggers are descendants of
    the `Root` logger we’ve been working with so far. Loggers that lack any specific
    configuration inherit the `Root` configuration.


    So when `Main` and `LoggerChild` create loggers using their class name, these
    loggers inherit the `Root` configuration, which is to send `Debug` level and higher
