    (FIX) 协议网络设施开发。他喜欢谈论什么让团队变得高效（或不高效）！


    ## 第 4 章：快速上手 PHP 日志记录


    在本章中，让我们讨论一种非常流行的语言中的日志记录技术：PHP。


    我将用一个 PHP 手动记录日志的快速示例开头。然后，我将重新回顾本书第二章讨论的细节——关于为什么日志很重要以及你的日志应该显示内容的细节。最后，我将向你展示如何设置和使用最流行的
    PHP 日志框架。


    让我们开始吧！


    ![](img/Image679.png)


    ### PHP 日志记录（超级简单）示例


