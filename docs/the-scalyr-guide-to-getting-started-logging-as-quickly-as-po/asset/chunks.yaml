    # Chapter 3: Getting Started Quickly With Log4j Configuration


    In the previous chapter, we used Log4j, a logging framework from the Apache project.
    Let’s go one step further with Java application logging and look at Log4j configuration.


    Log4js capabilities have made it one of Java’s most popular logging frameworks.
    It can be configured for multiple logging destinations and a variety of log file
    formats. Log messages can be filtered and directed at the individual class level,
    giving developers and operations personnel granular control over application messages.


