    Well, that depends—not only on what your application does, but also on whether
    you’re logging on the client side or the server side. You also want to make sure
    that what you log adds value. Logging every little action is usually a bad idea.


    In fact, the example above doesn’t represent something I’d want to be logged in
    my system. I don’t care what my customers add to their to-do lists. I care about
    metrics, performance, and errors. And I want specific information that can help
    debug issues.


    ### What sort of data can we log?


    *   **Errors**: if something goes wrong, we want to know about it.

    *   **Usage**: let’s see how often various parts of our application are used.
    If we have features no one uses, we can deprecate them or make them better.

    *   **Performance**: we want to know what the customer experiences regarding latency.
    If the application slows down too much for them, we need to investigate.


    ### Specifically for error logging, what information do we need?


    *   **Timestamps** that tell exactly when an error occurred.

    *   **User ID** or context, so we know who was affected.

    *   **Relevant parameters** to help recreate the problem and find a solution.

    *   **Unique and specific error messages** to help pinpoint the problem.


    ### You’re on Your Way


    You’re in a great place. You’ve got a sample Meteor app to experiment with, as
    well as some guidance on how to log information in it. Once you’ve logged data
    from your application, remember to review the logs from time to time. Iterate
    on what’s being logged and the format until you have a useful set of data that
    will help you debug and optimize your application. And now you can rest easy knowing
    you’ll be able to support your Meteor application in production.


    This chapter was contributed by Sylvia Fronczak. [Sylvia](https://sylviafronczak.com/)
    is a software developer who has worked in various industries with various software
    methodologies. She’s currently focused on design practices that the whole team
    can own, understand, and evolve over time.


    ## About Scalyr


    Scalyr is the log management and observability platform for the new stack. Purpose-built
    to handle the scale and complexity of modern cloud architectures, Scalyr changes
    the dynamics of delivering healthy applications by allowing engineers to quickly
    troubleshoot problems and focus on doing what they love—coding. With 96% of searches
    completing in under one second and thousands of active users, Scalyr has transformed
    logs from afterthought into advantage.


    Learn more at [scalyr.com](http://scalyr.com/) and follow on Twitter (@scalyr).

