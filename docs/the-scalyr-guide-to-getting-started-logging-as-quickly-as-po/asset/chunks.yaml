    `disable_existing_loggers`: This setting disables existing loggers. The default
    value is `False`, but it doesn’t hurt to be explicit. When setting this to `True`,
    define additional loggers. Otherwise, messages may be lost.


    `formatters`: This section defines what our log statements will look like. Let’s
    take a look at the console log format:


    ![](Images/Image1818.png)


    Here’s what’s going on:


    * `%(name)`: this is the package name that emits the log message.

    * `%(levelname)`: the log level of the message (Error, Warning, Info, etc.).

    * `%(message)`: this is the actual log message.


    The `-12s` and the `-8s` control spacing between the different format specifications.
    An example message in this format will look like the following:


    ![](Images/Image1826.png)


    You’ll notice the file formatter includes an additional specifier, `%(asctime)`.
    This adds a timestamp to each message sent through the file handler. As an example,
    the message from our defined `debug.log` will resemble this:


    ![](Images/Image1835.png)


    `handlers`: This section defines how to handle log messages. We can send messages
    to the console, files, or even sockets! All the default handlers are in the Python
    docs [on their website](https://docs.python.org/3/library/logging.handlers.html).
    This configuration defines separate handlers: one for console messages and another
    for messages sent to the file. In addition, for the file handler, we specify the
    handler class, the file name to log to, and the log level. This handler also specifies
    which formatter to use.


    `loggers`: This last section is where we tie it all together and define our loggers,
    including how to handle the root logger (represented by the empty string) messages.
    We also set the logging level to `Debug` and define two handlers—one to the console
    and one to the file.


    Let’s update the configuration now and take it for a spin.


    ## Update and Test the New Configuration


    Update the `app/views.py` to include the above logging configuration. It should
    look like this:


    ![](Images/Image1844.png)


    Running that as before and refreshing the browser, the console log message now
    includes the additional information from our format string:


    ![](Images/Image1855.png)


    The log file will contain the same message and format, but with the addition of
    the timestamp:


    ![](Images/Image1867.png)


    This is enough to start incorporating logging in any Django project. However,
    we have one more topic to cover: the logging extensions that Django provides.


    ## Tour the Django Logging Extensions


    In a web server environment, we often have routine information we need to log.
    Django provides a few logging extensions to cover these use cases.


    * `django`: This is a catch-all logger for messages in the `django` hierarchy.
    Messages aren’t posted using this logger name since one of the following loggers
    will be used.

    * `django.request`: This logger handles the logging of HTTP requests and will
    raise exceptions for certain status codes. All HTTP 5xx error codes will raise
    `Error` messages. Likewise, HTTP 4xx codes will appear as `Warning` messages.

    * `django.server`: When running the server using the `runserver` command (which
    we’ve been doing), this will log messages related to the handling of those requests,
    just like the `django.request` logger—except that all other messages are logged
    at the `Info` level. These are messages that don’t trigger an HTTP status code
    of 5xx or 4xx.

    * `django.template`: No matter how often I’ve worked with Django templates, I’ve
    never put one together without errors the first time. The `django.template` logger
    handles errors related to the rendering of templates. Missing context variables
    will appear in the log as `Debug` messages.

    * `django.db.backends`: This logger handles any messages from the interaction
    of the code with the database. All application-level SQL statements will appear
    at the `Debug` level. As this can get quite noisy, `Debug` logging needs to be
    enabled by changing `settings.DEBUG` to `True`.

    * `django.security.*`: Django provides handlers for security-related errors. In
    particular, the logger will receive any messages that result from a `SuspiciousOperation`
    error. Django defines subclasses for each kind of security error, such as `DisallowedHost`
    or `InvalidSessionKey`. The rest of the subclasses of `SuspiciousOperation` can
    be found [on](https://docs.djangoproject.com/en/2.1/ref/exceptions/#django.core.exceptions.SuspiciousOperation)
    [Django’s website, under their exceptions page in the documentation](https://docs.djangoproject.com/en/2.1/ref/exceptions/#django.core.exceptions.SuspiciousOperation).
    A word of caution—if the `django.security` logger handles a message, it won’t
    be sent through the `django.request` logger. So don’t ignore messages from the
    `django.security.*` loggers!

    * `django.security.csrf`: This logger doesn’t inherit from the `SuspiciousOperation`
    logger that the other security handlers extend. This handles any exceptions that
    occur due to cross-site request forgery (CSRF) attacks.


    As one final example, let’s log messages from the `django.request` extension.
    This is done by adding the logger to the logging section of the configuration
    like so:


    ![](Images/Image1874.png)


    This will log request messages like the following:


    ![](Images/Image1882.png)


    Feel free to experiment, and don’t forget to log the `django.security.*` messages!


    ## You’ve Got This!


    That was a lot of information, so let’s recap:


    * Django uses the standard Python logging facilities.

    * Logging settings are set through the `logging.dictConfig` dictionary.

    * Django provides a few [logging extensions](https://docs.djangoproject.com/en/2.1/topics/logging/#django-logging-extensions)
    for handling common server issues.

