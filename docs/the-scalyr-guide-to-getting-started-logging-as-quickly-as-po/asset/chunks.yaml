- fmt: "\nWe need visibility into our application’s runtime behavior, and we get it\
    \ by logging.\n\n## How Should You Log?\n\nWe already took a quick look at Apple’s\
    \ unified logging system. It fulfills the requirement for persistently storing\
    \ logs in a central location. We can find these logs with a text search via the\
    \ console application or a command line tool.\n\nBut it would be nice if the logs\
    \ were easier to find inside the system and had a bit more context.\n\nThis leads\
    \ to a more general question: what information should be logged?\n\nMost logging\
    \ systems include at least the following information in each log entry:\n\n* \
    \  Timestamp: when the event described in the log entry happened. The unified\
    \ logger takes care of this for us.\n*   Event context: useful information about\
    \ the event. “It worked” or “it’s broken” might be useful or entertaining during\
    \ a debugging session. “Failed to connect to database at `192.168.3:5000`” is\
    \ more useful in production.\n*   Severity level: logs tend to have a level that\
