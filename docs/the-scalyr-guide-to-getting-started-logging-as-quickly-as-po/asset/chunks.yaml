    *   My take on the fundamentals of logging: why bother logging, what data to log,
    and where to log.


    *   Finally, a very simple yet realistic example of proper logging, with help
    from the Ruby Logger class.


    As in the previous chapters, we’ll create a very simple toy app in order to demonstrate
    how to log. And we’ll start with a very primitive—though functional—approach.
    We’ll then evolve it toward a more sophisticated and realistic solution.


    ![Ruby With Scalyr Colors](Images/Image855.png)


    Some Words About Ruby and Rails


    Before we jump into the logging part, I figured it’d be useful to set the scene.
    The Ruby language first appeared in 1995, created by Yukihiro Matsumoto, aka Matz.
    But it really gained popularity after 2005, largely due to the very successful
    Ruby On Rails web framework.


    Even though many (or even most) developers get to know Ruby thanks to Rails, Ruby
    itself is a general-purpose language that can be used in a variety of situations,
    not just when building web applications. For that reason, this chapter won’t cover
    logging in Rails—that’s covered fully in the next chapter. But here, we’ll explore
    logging in the context of a simple command-line Ruby application.


    With that out of the way, I think it’s time to get our hands dirty. Let’s start.


    The Simplest Ruby Logging That Could Possibly Work


    For our demo, I’m going to use [JetBrain](https://www.jetbrains.com/ruby/)[’](https://www.jetbrains.com/ruby/)[s
    RubyMine IDE](https://www.jetbrains.com/ruby/). Also, make sure you’ve got [Ruby](https://www.ruby-lang.org)
    installed.


    Once you’re all set up and good to go, open RubyMine and click on Create New Project:


    ![http://blog.scalyr.com/wp-content/uploads/2018/02/Screenshot-2018-02-22-20.45.42.png](Images/Image864.png)


    In the next screen, you’ll be asked to choose the project’s type:


    ![http://blog.scalyr.com/wp-content/uploads/2018/02/Screenshot-2018-02-22-20.52.59.png](Images/Image871.png)


    As I already mentioned, we’re not creating a Rails app but rather a simple Ruby
    app. So choose Empty Project, which is the first option under Ruby on the left
    bar. The next step is to set the location/name for your project. After doing that,
    select the location of the Ruby SDK:


    ![http://blog.scalyr.com/wp-content/uploads/2018/03/Highlighted.png](Images/Image879.png)


    Once you’re done, click on the Create button. We’ve successfully created a new
    Ruby project on RubyMine. Time to start coding.


    First, let’s add a class. Go to File > New... > Ruby class:


    ![http://blog.scalyr.com/wp-content/uploads/2018/02/add-new-ruby-class.png](Images/Image886.png)


    Name it Greeter and click on OK:


    ![http://blog.scalyr.com/wp-content/uploads/2018/02/Screenshot-2018-02-22-21.22.03.png](Images/Image894.png)


    RubyMine will create the class and open it up for editing. Let’s add a Greet method
    that will receive a user’s name as input and print a friendly greeting:


    ![](Images/Image903.png)


    Nice. Now let’s add a new file. Go to the File menu, then New..., and finally
    click on File. When the dialog box shows up, enter main.rb as the file name and
    click on OK:


    ![http://blog.scalyr.com/wp-content/uploads/2018/02/Screenshot-2018-02-22-21.50.45.png](Images/Image914.png)


    This file will serve as the entry point for our little toy app. Insert the following
    code into it:


    ![](Images/Image927.png)


    This code should be very easy to understand. On the first line, we load the greeter.rb
    file so we can access the Greeter class we’ve defined.


    Following this, we print a request to the user to type their name. Then we read
    from stdin and assign the value to a new variable called name. On the next line,
    we create a new instance of the Greeter class and assign it to a variable of the
    same name. Finally, we call the Greet method on Greeter, passing the name we read
    from stdin as a parameter.


    Time to run our app. Go to the Run menu and choose the first option, as is shown
    in the figure below:


    ![http://blog.scalyr.com/wp-content/uploads/2018/02/run-main.png](Images/Image934.png)


    Alternatively, use the shortcut SHIFT+F10 on Windows and Linux or CTRL+R on Mac.
    If everything goes well, you should see something like this on the Run tool window:


    ![http://blog.scalyr.com/wp-content/uploads/2018/02/pleas-type.png](Images/Image942.png)


    Type your name and press Enter, and you should see this:


    ![http://blog.scalyr.com/wp-content/uploads/2018/02/hi-carlos.png](Images/Image949.png)


    Well, not exactly this, of course. Unless your name is also Carlos, in which case
    I congratulate your parents on their good taste in names.


    Jokes aside, we’ve got our little toy app up and running! It successfully displays
    a greeting to the user. But now let’s say someone decided this isn’t enough. We
    also need to register the greetings somewhere, which can really come in handy
    in several ways. How to go about that? There’s no shortage of options, of course,
    but since this is meant to get you logging as quickly as possible, we don’t really
    want to get fancy.


    Go back to the Greeter class and edit it so it looks like this:


    ![](Images/Image957.png)


    Not a lot of changes. We’ve just added a new line of text that writes the greeting
    to a file. There’s also a new variable, message, that exists just to prevent duplication.
    So, run the app again, type your name, and the app should continue behaving the
    exact same way.


    But now navigate to the project folder and you’ll see a new file there, accompanying
    the project’s source files:


    ![http://blog.scalyr.com/wp-content/uploads/2018/02/log-file.png](Images/Image964.png)


    Open the file and you should see the greeting message. And that’s it. If this
    was your first attempt at logging with Ruby, congrats—you were successful!


    What Is Application Logging?


    As a starting point for discussion, let’s repeat the definition of application
    logging shared early on in this book.


    Application logging involves recording information about your application’s runtime
    behavior to a more persistent medium.


    This definition is, in my opinion, as good as it gets; it’s short, easy, and to
    the point. I don’t really feel the need to add more to it, which lets us get to
    a more interesting question: why log?


    What’s the Motivation for Logging?


    Why bother logging? Basically, we log for the same reasons we record any kind
    of information—so we can get back to it later. In the case of your application
    behavior, there are many ways in which this can come in handy.'
