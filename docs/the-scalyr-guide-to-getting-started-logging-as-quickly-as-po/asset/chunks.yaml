    including how to handle the root logger (represented by the empty string) messages.
    We also set the logging level to Debug and define two handlers—one to the console
    and one to the file.


    Let’s update the configuration now and take it for a spin.


    Update and Test the New Configuration


    Update the app/views.py to include the above logging configuration. It should
    look like this:


    ![](Images/Image1844.png)


    Running that as before and refreshing the browser, the console log message now
    includes the additional information from our format string:


    ![](Images/Image1855.png)


    The log file will contain the same message and format, but with the addition of
    the timestamp:


    ![](Images/Image1867.png)


    This is enough to start incorporating logging in any Django project. However,
    we have one more topic to cover: the logging extensions that Django provides.


    Tour the Django Logging Extensions


    In a web server environment, we often have routine information we need to log.
    Django provides a few logging extensions to cover these use cases.


    django: This is a catch-all logger for messages in the django hierarchy. Messages
    aren’t posted using this logger name since one of the following loggers will be
    used.


    django.request: This logger handles the logging of HTTP requests and will raise
    exceptions for certain status codes. All HTTP 5xx error codes will raise Error
    messages. Likewise, HTTP 4xx codes will appear as Warning messages.


    django.server: When running the server using the runserver command (which we’ve
    been doing), this will log messages related to the handling of those requests,
    just like the django.request logger—except that all other messages are logged
    at the Info level. These are messages that don’t trigger an HTTP status code of
    5xx or 4xx.


    django.template: No matter how often I’ve worked with Django templates, I’ve never
    put one together without errors the first time. The django.template logger handles
    errors related to the rendering of templates. Missing context variables will appear
    in the log as Debug messages.


    django.db.backends: This logger handles any messages from the interaction of the
    code with the database. All application-level SQL statements will appear at the
    Debug level. As this can get quite noisy, Debug logging needs to be enabled by
    changing settings.DEBUG to True.


    django.security.*: Django provides handlers for security-related errors. In particular,
    the logger will receive any messages that result from a SuspiciousOperation error.
    Django defines subclasses for each kind of security error, such as DisallowedHost
    or InvalidSessionKey. The rest of the subclasses of SuspiciousOperation can be
    found [on](https://docs.djangoproject.com/en/2.1/ref/exceptions/#django.core.exceptions.SuspiciousOperation)
    [Django’s website, under their exceptions page in the documentation](https://docs.djangoproject.com/en/2.1/ref/exceptions/#django.core.exceptions.SuspiciousOperation).
    A word of caution—if the django.security logger handles a message, it won’t be
    sent through the django.request logger. So don’t ignore messages from the django.security.*
    loggers!


    django.security.csrf: This logger doesn’t inherit from the SuspiciousOperation
    logger that the other security handlers extend. This handles any exceptions that
    occur due to cross-site request forgery (CSRF) attacks.


    As one final example, let’s log messages from the django.request extension. This
    is done by adding the logger to the logging section of the configuration like
    so:


    ![](Images/Image1874.png)


    This will log request messages like the following:


    ![](Images/Image1882.png)


    Feel free to experiment, and don’t forget to log the django.security.* messages!


    You’ve Got This!


    That was a lot of information, so let’s recap:


    *   Django uses the standard Python logging facilities.


    *   Logging settings are set through the logging.dictConfig dictionary.


    *   Django provides a few [logging extensions](https://docs.djangoproject.com/en/2.1/topics/logging/#django-s-logging-extensions)
    for handling common web server issues.


    If you need to delve further, you can read up on the Python logging facility as
    well as the Django logging specifics, both on their respective websites. Until
    next time, happy logging!


    This chapter was contributed by Casey Dunham. [Casey](https://www.caseydunham.com/),
    who recently launched his own security business, is known for his unique approaches
    to all areas of application security, stemming from his 10+ year career as a professional
    software developer. His strengths include secure SDLC development consulting;
    threat modeling; developer training; and auditing web, mobile, and desktop applications
    for security flaws.


    ## Chapter 10: Getting Started Quickly With Angular Logging


    In this chapter, I’ll show you how to quickly get started logging in one of the
    most popular front-end development frameworks: Angular.


    “But wait!” you might be thinking. “Do you mean Angular or AngularJS?” I mean
    both. After a bit of Angular history, we’ll look at logging with AngularJS, and
    then we’ll use the current Angular version to show you logging in action.


    ![](Images/Image1889.png)


    A Bit of Angular History


    The history of Google’s Angular development is tumultuous. Each major version
    made the previous one obsolete, as the codebase developed in previous Angular
    versions was not compatible with newer versions. If the cost of refactoring the
    entire codebase was too high for your company, you never made the upgrade to newer
    Angular versions.


    Like all front-end development frameworks of the time, Angular started as a JavaScript
    framework. The first version of Angular was called AngularJS, and the JS in the
    name stands for JavaScript.


    Around 2015 at the Angular Conference, the Angular team announced they were moving
    to TypeScript instead of JavaScript, which marked another major change in the
    codebase. This is when the JS was dropped from the product name and it simply
    became Angular.


    In addition to moving away from JavaScript, newer Angular versions started embracing
    component- and service-centered development. While it added more complexity to
    getting started, this approach is the better architecture for supporting large
    single-page applications. Currently, Angular has a very structured and opinionated
    approach to front-end development.'
