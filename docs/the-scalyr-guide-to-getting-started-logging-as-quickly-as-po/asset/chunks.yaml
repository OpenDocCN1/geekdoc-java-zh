    这可能是不言而喻的，但软件是一项极其复杂的工作。在开发它时，你希望采用各种技术、工具和原则来尝试确保它的正确性。


    但当发布时间到来，你将你的应用程序发布到世界上时，你基本上放弃了控制权。事情可能会出问题，而且经常会发生。如果你没有一套适当的策略来监控应用程序在生产环境中的行为，你基本上就是在盲目运行。如果没有日志记录，你无法知诸如下信息：


    *   一切是否正常。

    *   当出现问题时，究竟发生了什么。你还不知道它是何时或如何发生的。

    *   人们最常使用哪些功能，哪些功能他们完全不使用。

    *   应用程序的哪个区域导致了大多数崩溃。


    正如我们所看到的，应用程序日志不仅有助于帮助你理解和修复错误，还能帮助你收集数据以理解用户的需求。


    # 演进我们的方法：我们应该记录什么？应该存储何处？


    正如我们刚刚看到的，通过调查应用程序的日志文件来戴上“侦探帽”可以带来许多益处。我们的示例日志以目前的形式还没有达到要求。毕竟，它只是将问候语写入文件。


    现在，我们需要我们演进自己的方法，以便我们的日志文件发挥最大的效用。但该如何进行呢？


    首先，我们必须理解日志条目的本质。如果你读过之前的章节，这听起来会很熟悉，但为了完整起见，我在这里回顾一下。你应该将一个日志条目视为一个事件——即你的应用程序感兴趣的在某个时间发生的事情。因此，你的条目的价值完全取决于你针对该事件记录了什么。


    以下是一些你认为值得记录的内容的示例：


    *   `timestamp`（时间戳）。事件发生在什么时候？（你可能希望遵循处理日期时间的最佳实践，例如使用 `ISO-8601` 格式。）

    *   `Context`（上下文）。你需要让未来的读者尽可能容易地理解此条目关于什么。

    *   `Log levels`（日志级别）。日志条目的目的差异巨大。你必须有一种方法，将一个唯一目的是调试某些执行路径的条目与另一个记录业务相关事件（客户下了订单）的条目，甚至是记录致命崩溃详情供日后调查的条目区分开。`Log
    levels` 在这里是你的朋友。


    在决定了你想记录什么类型的事件（每次方法调用？仅业务事件？仅致命错误？）以及你想记录关于它们的什么数据（`timestamp`、`description`、`log
    level`、`logged user` 或 `time of session`？）之后，下一步是决定你想记录日志到哪里。


    你看，尽管演示应用记录日志到文件中，但没有什么阻止你将日志记录到各种目标，例如数据库、控制台，甚至是在线服务。

    '
