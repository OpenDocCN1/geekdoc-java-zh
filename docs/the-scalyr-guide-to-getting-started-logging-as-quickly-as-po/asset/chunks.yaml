  raw: 'It probably goes without saying, but software is a massively complicated thing.
    While you’re developing it, you hopefully employ techniques, tools, and principles
    to try to ensure its correctness.


    But when the time for release comes and you set your application free into the
    world, you’re basically giving up control. Things can go wrong, and they often
    do. If you don’t have a proper strategy for monitoring your application’s behavior
    in production, you’re basically running blind. Without logging, you can’t know
    things like


    *   If everything is OK.


    *   What happened, exactly, when something goes wrong. You also won’t know when
    or how it happened.


    *   Which features people use the most and which ones they don’t they use at all.


    *   Which area of the application is responsible for most crashes.


    As we’ve seen, application logging is essential not only to help you understand
    and fix errors but also to help you gather data so you understand the needs of
    your users.


    Evolving Our Approach: What Should We Capture? And Where Should We Store It?


    Being able to put on your detective hat by investigating your application’s log
    files can bring several benefits, as we’ve just seen. Our toy log, in its current
    form, isn’t quite there yet. It just writes the greeting to a file, after all.


    Now it’s up to us to evolve our approach so our log files can reach their maximum
    usefulness. But how to proceed with that?


    First, we have to understand the nature of a log entry. This is going to sound
    familiar if you’ve read previous chapters, but I’m going to recap here for completeness’
    sake. You should think of a log entry as an event—something that’s of interest
    to your app that happened at some time. So the value of your entry is all about
    what you capture regarding the event.


    Here are some examples of things that might make sense for you to capture:


    *   A timestamp. When did the event take place? (You’ll probably want to follow
    best practices of dealing with dates and times, such as using the ISO-8601 format,
    for instance.)


    *   Context. You need to make it as easy as possible for the future reader to
    understand what this entry is about.


    *   Log levels. Log entries can wildly vary in their purpose. You have to have
    some way of distinguishing an entry whose sole purpose is to debug some execution
    path from another that records some event of interest to the business (customer
    placed an order) or from even another that writes down the details of a fatal
    crash for posterior investigation. Log levels are your friends here.


    After deciding what type of events you want to log (Each method call? Just business
    events? Only fatal errors?) and what data about them you want to capture (timestamp,
    description, log level, logged user, or time of session?), the next step is deciding
    where you want to log to.


    See, even though the demo app logs to a file, there’s nothing preventing you from
    logging to a variety of targets, such as the database, the console, or even an
    online service.


    Enter the Logging Framework


    Think about our toy app. It was designed to give you as quick a start on the Ruby
    logging world as humanly possible. But now you’re more knowledgeable about logging
    and can analyze our demo in a more critical way.


    By doing that, we can come up with several questions that need answering, such
    as:


    *   How can we prevent the log file from getting overwritten every time?


    *   Since we’re talking about files, don’t we have to worry about file permissions,
    concurrent access, and other concerns that arise when doing IO?


    *   Will we have to write a lot of code to add the timestamp, log levels, and
    other important information we want to capture with each event?


    It didn’t take a lot of thought to conclude that our logging strategy lacks a
    lot of important things. Coming up with a proper logging strategy is no small
    feat, as you can see.


    The good news is this: you don’t have to answer all of those issues on your own.
    People have already solved those kinds of problems before, and guess what? Many
    of them decided to make their solutions available to the world in the form of
    a logging framework.


    A logging framework is a package meant to provide “free” logging for you. With
    a little bit of configuration, you can make one-line calls that, despite being
    as simple as the one in our toy example, can do a lot more. They’ll generate log
    entries with nice, consistent formatting, and all of the issues we discussed above
    will be pretty much taken care of.


    As with Python, Ruby has logging built in, which can really make things easier.
    Let’s explore it a little bit.


    Getting Started With the Ruby Logger


    First of all, let’s change our existing code to make use of the Logger class.
    Go to the Greeter file and add the following line right at the start of the file:


    ![](Images/Image972.png)


    Now, remove the line where we write the greeting to a file, and add the following
    lines:


    ![](Images/Image979.png)


    Then, the complete Greet method should look like this:


    ![](Images/Image987.png)


    The code should be easy enough to understand. We create a new instance of the
    Logger class, giving it a new file by parameter. In the next line, we log the
    greeting message at the Info level.


    Now, let’s run the app again and see what happens.


    Checking the Results


    Next, navigate back to the project folder, and you’ll notice there’s a new file
    hanging out there called proper.log. Open it using your favorite text editor,
    and you should get something like the following:


    ![](Images/Image996.png)


    Let’s break this line down:


    First, we have the severity ID, I. The I stands for Info.


    What follows—2018-02-23T14:41:59.538985—is the event timestamp, in ISO-8601 format.


    Then we have our app’s PID, #11520, and the label for the severity, Info.


    And finally, we have our message: Hi Carlos!


    The Power of a Logging Framework


    Just by adding three lines of code (the require line and the two new lines inside
    the method), we were able to implement a simple yet realistic example of a logger.
    Of course, a logger for a “real life” application would require a lot more thought—and
    work. But I do hope that after this quick example, you’re now both more knowledgeable
    about the principles that govern logging and also eager to explore and learn more.


    What’s Next?


    There’s obviously more to logging in Ruby, but I think we’ve delivered on our
    promise: you’re up and running with Ruby logging as quickly as possible. Your
    challenge from here on out is to build upon this knowledge. So why not start playing
    with the demo logger you now have?


    There’s no shortage of things for you to try. Here are some suggestions:


    *   Experiment with the different severity levels.


    *   Learn about formatting options for your logger.


    *   Research logging to targets other than files, such as a database.


    *   Once you’re confident enough, try logging options other than the built-in
    class. Use GitHub and Ruby Gems to learn about those options, and try them!


    Good luck on your logging journey with Ruby!


    This chapter was contributed by Carlos Schults. [Carlos](http://carlosschults.net/)
    is a software developer with experience in both desktop and web development, now
    trying his hand at mobile. Carlos has a passion for writing clean and concise
    code, and he’s also very interested in practices that help you improve your app’s
    health.


    ## Chapter 6: Getting Started Quickly With Rails Logging


    Let’s continue our our journey getting starting with loggers for different languages
    and platforms. In the last chapter, we covered logging with Ruby; now it’s time
    to take a look at the platform most often associated with that language: Rails.


    We’ll start with a simple application, with scaffolding for CRUD operations on
    a single record. We’ll look at Rails’ default logging configuration and how to
    use logging in an application. Then we’ll look at how logging can be improved
    and why you might want to improve it.'
