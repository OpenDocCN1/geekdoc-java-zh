    Add a second file appender. To do this, create a list with the original appender
    and the second one with a different name and file. Your Appenders section should
    look like this:


    ![](Images/Image618.png)


    Next, point the `LoggerChild` logger at at the new appender. Your `Loggers` section
    will look like this.


    ![](Images/Image629.png)


    Now run the application. You’ll see two different log files, each with the messages
    from their associated classes.


    # Log Message Formatting


    Each of our appenders has a `PatternLayout`.


    ![](Images/Image642.png)`PatternLayout` is an instance of a Log4j layout class.
    `Log4j` has built-in layouts for logging messages in CSV, JSON, Syslog, and a
    variety of different formats.


    `PatternLayout` has a set of operators for formatting messages that works like
    C’s `sprintf` function. By specifying a pattern, we control the format of log
    messages when they’re written by the appender.


    Our layout string looks like this:


    ![](Images/Image649.png)


    Each `%` corresponds to a field in a log message.


    ![](Images/Image657.png)


    There are many additional operators for `PatternLayout`, too, which you can explore
    on your own.


    # Variable Replacement


    Configuration files can become repetitive as appenders and loggers multiply. `Log4j`
    supports variable substitution to help reduce repetition and make things easier
    to maintain. Let’s refine our configuration with the use of `Properties`.


    ![](Images/Image664.png)


    At the top of the file, we declared two `Properties`, one named `LogDir` and another
    `DefaultPattern`.


    After declaring a property, it can be used in the configuration using braces and
    a dollar sign: `${LogDir}` or `${DefaultPattern}`.


    `LogDir` is a subdirectory name we added to the names of the two log files. When
    we run the application, `Log4j` will create this directory and place the log files
    there.


    We specified `DefaultPattern` as the pattern layout for our two log files, moving
    the definition to one place. If we want to modify our log file format, we only
    have to worry about changing it once now.


    `Log4j` can also import properties from the environment. (You can read more about
    this [on the Apache Logging Services website.](https://logging.apache.org/log4j/2.x/manual/configuration.html#Property_Substitution))
    For example, if we want to import the log file directory from a Java system property,
    we specify it as `${sys:LogDir}` in the `Log4j` configuration and set a `LogDir`
    system property to the desired directory.


    # Automatic Reconfiguration


    `Log4j` can reload its configuration at a periodic interval, giving us the ability
    to change an application’s logging configuration without restarting it.


    Add the `monitorInterval` setting to the `Configuration` section of the file and
    `Log4j` will scan the file at the specified interval.


    ![](Images/Image672.png)


    The interval is specified in seconds.


    # Conclusion


    `Log4j` is a powerful logging framework that allows us to configure our applications
    to log in a variety of different ways, with granular control over how different
    components use log files. This tutorial covered the basic aspects of configuring
    `Log4j`, but there’s much more to learn. You can learn about `Log4j` configuration
    on the project’s [website](https://logging.apache.org/log4j/2.x/manual/configuration.html).


    This chapter was contributed by Eric Goebelbecker. [Eric](http://ericgoebelbecker.com/)
    has worked in the financial markets in New York City for 25 years, developing
    infrastructure for market data and financial information exchange (FIX) protocol
    networks. He loves to talk about what makes teams effective (or not so effective!).


    ## Chapter 4: Getting Started Quickly With PHP Logging


    In this chapter, let’s discuss logging techniques in a very popular language:
    PHP.


    I’ll open with a quick example of manual logging in PHP. Then I’ll revisit the
    details discussed in chapter two of this book—details about why logging matters
    and what your logs should show. And lastly, I’ll show you how to set up and use
    the most popular PHP logging framework.


    Let’s get started, then!


    ![](Images/Image679.png)


    ### A (Super Simple) Example of PHP Logging


    For the purpose of this tutorial, I’ll be using Linux with a clean installation
    of the [LAMP stack](https://www.digitalocean.com/community/tags/lamp-stack?type=tutorials).
    You might need to adjust the tools and the commands if you’re using Mac or Windows
    instead of Linux.


    Navigate to the `/var/www/html` folder and delete a file named `index.html` from
    there:


    ![](Images/Image687.png)


    Then create a new file `index.php` and open it in your favorite text editor (I’m
    using Emacs):


    ![](Images/Image694.png)


    Add the following HTML code into `index.php`:


    ![](Images/Image702.png)


    This HTML code will create a simple subscription form. To see the resulting page,
    open your browser and go to `http://localhost`:


    ![](Images/Image711.png)


    Even though you can see the form in the browser, it doesn’t do anything useful
    right now. To make it functional, add the following PHP script at the top of the
    `index.php` file, before the HTML code:


    ![](Images/Image722.png)


    The above code will extract the name and email parameters from the submitted request
    and pass them into the `subscribe` function, which will have the code that takes
    care of subscribing new users. But since this tutorial is about logging, I’ll
    leave the `subscribe` function’s body empty for now.


    Now, let’s say you want a log file that keeps track of all subscription requests
    alongside their respective parameters. You can do that by adding just two lines
    right before a call to `subscribe`:


    ![](Images/Image736.png)


    The additional two lines of code will call PHP’s `file_put_contents` function
    that will append a new log message to the contents of `server.log`.


    Now if you open `http://localhost` in your browser, populate the input fields,
    and click on the subscribe button, this script will create a new file `server.log`
    in the `/var/www/html` directory and write the log entry into it. I can read the
    contents of this file using `cat` command:


    ![](Images/Image743.png)


    Congratulations! You’ve logged your first entry written in PHP.


    Now, let’s back up a bit.


    # What Is Application Logging?


    You probably already have an intuitive understanding of what logging is, but it’s
    still worth taking the time to go over a proper definition we can build upon.
    We previously defined application logging like this:


    Application logging involves recording information about your application’s runtime
    behavior to a more persistent medium.


    There are two important points to note here.


    First, logging is all about the application’s runtime behavior. In other words,
    it involves recording the application’s events as a function of time.


    Second, you always want to store logs in a more persistent medium. The exact meaning
    of “more persistent” will vary depending on your requirements and environment,
    but at the very least, you’ll want to be able to read the logs even if the application—or
    the entire server—c crashes.


    While this definition explains what logging is, it doesn’t explain why you’d want
    to use logging in your application. That’s an important question, and I’d like
    to address it in detail.


    # Why Log?


    If we lived in an ideal world, our applications would just work exactly as we
    planned. However, the reality is that even well-constructed applications have
    bugs and will be at risk of crashing at one point or another.


    When you develop on your personal computer and encounter errors, they’re usually
    relatively simple to resolve. After all, you know what you’ve been working on
    and what sequence of events led to the error. In addition, you can develop in
    debug mode, which gives you lots of additional information about the system.

