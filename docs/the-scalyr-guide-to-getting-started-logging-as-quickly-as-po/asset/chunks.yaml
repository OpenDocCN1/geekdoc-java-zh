    ## Chapter 5: Getting Started Quickly With Ruby Logging


    Let’s continue to get started logging quickly, this time with Ruby.


    We’ve talked about many languages so far. So, what about tipping the scale to
    the side of dynamically-typed interpreted languages? That’s exactly what we’re
    doing in this chapter by teaching you how to get up and running with logging using
    the Ruby programming language.


