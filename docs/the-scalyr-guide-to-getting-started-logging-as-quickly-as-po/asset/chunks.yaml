    This tutorial uses [Ruby v2.5.1](https://www.ruby-lang.org/en/downloads/) and
    [Rails 5.2.0](https://weblog.rubyonrails.org/2018/4/9/Rails-5-2-0-final/). You’ll
    need to have them installed to follow along. These instructions will use the command
    line to create and configure the application and will not rely on a specific IDE
    or editor. We’ll let Rails use `SQLite` for the backend database.


    ![](Images/Image1007.png)


    # Create a Rails Application


    We’ll start off by creating a Rails application. Run this command first:


    ![](Images/Image1019.png)


    After few screens of output, Rails has created the application.


    Next, we’ll let Rails create a model and a controller for us so we have something
    interesting to log. Move into the `logging_app` directory and run this:


    ![](Images/Image1026.png)


    Rails creates the scaffolding for a user record with a name and an email address.


    Finally, have Rails migrate the application into `SQLite`.


    ![](Images/Image1034.png)


    And we have an application! Let’s run it and confirm that’s all set up.


    ![](Images/Image1042.png)


    Point a browser at `http://localhost:3000/users`, and we see our main page for
    managing users:


    ![](Images/Image1050.png)


    We’re ready to get started with logging!


    # Rails Logger


    Rails creates an instance of `ActiveSupport::Logger` as part of initialization
    and uses it for logging to standard output.


    Take a look at the application output when we open the `/users` page:


    ![](Images/Image1057.png)


    `Logger` produces this output. In addition to standard output, we can find the
    same input in the default log file. Let’s stop the server and take a look at the
    last ten lines of the log file:


    ![](Images/Image1064.png)


    The default name of the log file is the environment name. In development, it’s
    named `development.log`; in production, it’s named `production.log`; and so on.


    The default logger is available to application code in a globally accessible instance
    named `logger`. Let’s add an extra debug message when the application displays
    a user.


    First, add a log message to `app/user_controller.rb` in the `show` method.


    ![](Images/Image1071.png)


    Then start the application. Go to the `/users` and add a user named John Doe with
    an email address of [john@doe.com](mailto:john@doe.com).


    Your log should have an entry similar to this:


    ![](Images/Image1080.png)


    Rails has a reputation for making life easy for developers, and logging is an
    example of why it got that reputation. Let’s look at how we can customize the
    Rails logger.


    ## What Is Application Logging?


    Before we delve into how to improve the Rails logger, let’s go back to first principles.
    What are we trying to do? What is application logging? If you’ve read any of our
    other chapters, you’re already quite familiar with our definition:


    Application logging involves recording information about your application’s runtime
    behavior to a more persistent medium.


    So, in Rails, we’ve already seen that we have a way to record information about
    our application to a file and to standard output, which our DevOps team can redirect
    to where they wish with standard output. But we can do more.


    ## What Is Application Logging For?


    Why do we write logs? It seems like an obvious question, but it’s worth considering.


    We write logs so we have a record of what’s happening.


    We’ve released our code to production, and we need to get to work on something
    else. But at some point, something will go wrong, and we’ll be asked to diagnose
    the problem. Logs are often the only thing we have.


    We may also be asked for information about what’s happening in production when
    nothing is wrong. How many pages are loaded per day? Per hour? Per minute? Where
    are users coming from? What features are used most often, and what features are
    ignored?


    While some of this information is available from web analytics, logs can drill
    down to a higher level of detail.


    Application logging is a critical tool for helping us locate and fix errors and
    for collecting information that can help us improve our applications.


    ## What Information Should We Log?


    The messages we’ve seen from Rails are messages about what’s happening in the
    application. They lack context, though. Let’s define what we want from a log message
    and then configure the system to give us that.


    A log entry represents an event. Something happened to the application, and the
    developer thought it was interesting enough to save for later review.


    The most obvious thing we might want to know about an event is when it happened.
    None of the log entries we’ve seen so far have a timestamp on them. We’ll need
    to add that.


    It’s also useful to have some context. We added this log message to our code earlier.


    ![](Images/Image1089.png)


    Rails logged this:


    ![](Images/Image1100.png)


    What happened to Debug? We called the `logger` at `Debug` level, but that information
    wasn’t passed on. All of the log entries appear as equivalent with the default
    configuration, reducing their usefulness.


    Let’s get started changing the Rails logger’s configuration.


    # Configuring Logs


    Like most loggers, `ActiveSupport::Logger` supports different levels. Those levels
    are `Debug`, `Info`, `Warn`, `Error`, and `Fatal`.


    We can log a message at any one of these levels by calling the associated method:


    ```ruby

    logger.debug("message")

    ```


    This gives us a way to categorize messages. But let’s look at filtering first.
    `Debug` messages are useful for, well, debugging. We don’t typically want to see
    them in production where they can reduce the signal-to-noise ratio.


    We can filter which messages make it to the console


    ```ruby

    logger.level = :error

    ```


    Rails has a hierarchical configurations scheme. We can add logging configuration
    in `config/application.rb` or `config/environment/{environment_name}.rb`. The
    environment-specific file takes precedence.


    So when we add this to `config/application.rb`...


    ![](Images/Image1119.png)


    and this to `config/environment/development.rb`...


    ![](Images/Image1134.png)


    ...we still see `Debug` messages in development but only `Error` in production.


    We can change the name and location of log files by supplying Rails with `logger`
    instance initialized with our preferences.


    ```ruby

    config.logger = ActiveSupport::Logger.new("log/development.log")

    ```


    This also means we can create new subclasses of `Logger` if we want to change
    logging behavior.


    But let’s change the behavior we’re most in right now: log message formatting.


    # Log Message Format


    Rails’ configuration has a mechanism for supplying Rails with a log message formatter
    instance. The first step is creating that message formatter class.


    ![](Images/Image1149.png)


    We extended `ActiveSupport::Logger::SimpleFormatter` and overloaded its `call`
    method. We need an instance of `SimpleFormatter` for the configuration.


    `Logger` passes `call` four parameters. They are:


    - The log level (as severity).

    - The time of the message.

    - The program name.

    - The message.


    We formatted the severity into a fixed width field and the time as a human-readable
    string. Then we put the parts together into a familiar message format.


    There are a variety of ways we can add this class to our code. The use of the
    `libs` directory can be controversial with Rails, but we’ll use it for the sake
    of getting a formatter installed.


    First, create the formatter class in `logging_app/libs` as `message_formatter.rb`.


    Next, since Rails 5.x does not load classes from `lib` automatically, add these
    lines to `config/application.rb` in the `LoggingApp` class declaration:


    ```ruby

    config.autoload_paths << Rails.root.join(''libs'')

    ```


    Finally, add the formatter to `config/environment/development.rb`:


    ```ruby

    config.logger.formatter = MyCustomFormatter.new

    ```


    When we run the server and open a user entry, we see log messages with our custom
    format.


    ![](Images/Image1173.png)

