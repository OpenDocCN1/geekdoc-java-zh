    It probably goes without saying, but software is a massively complicated thing.
    While you’re developing it, you hopefully employ techniques, tools, and principles
    to try to ensure its correctness.


    But when the time for release comes and you set your application free into the
    world, you’re basically giving up control. Things can go wrong, and they often
    do. If you don’t have a proper strategy for monitoring your application’s behavior
    in production, you’re basically running blind. Without logging, you can’t know
    things like:


    *   If everything is OK.

    *   What happened, exactly, when something goes wrong. You also won’t know when
    or how it happened.

    *   Which features people use the most and which ones they don’t they use at all.

    *   Which area of the application is responsible for most crashes.


    As we’ve seen, application logging is essential not only to help you understand
    and fix errors but also to help you gather data so you understand the needs of
    your users.


    ## Evolving Our Approach: What Should We Capture? And Where Should We Store It?


    Being able to put on your detective hat by investigating your application’s log
    files can bring several benefits, as we’ve just seen. Our toy log, in its current
    form, isn’t quite there yet. It just writes the greeting to a file, after all.


    Now it’s up to us to evolve our approach so our log files can reach their maximum
    usefulness. But how to proceed with that?


    First, we have to understand the nature of a log entry. This is going to sound
    familiar if you’ve read previous chapters, but I’m going to recap here for completeness’
    sake. You should think of a log entry as an event—something that’s of interest
    to your app that happened at some time. So the value of your entry is all about
    what you capture regarding the event.


    Here are some examples of things that might make sense for you to capture:


    *   A `timestamp`. When did the event take place? (You’ll probably want to follow
    best practices of dealing with dates and times, such as using the `ISO-8601` format,
    for instance.)

    *   `Context`. You need to make it as easy as possible for the future reader to
    understand what this entry is about.

    *   `Log levels`. Log entries can wildly vary in their purpose. You have to have
    some way of distinguishing an entry whose sole purpose is to debug some execution
    path from another that records some event of interest to the business (customer
    placed an order) or from even another that writes down the details of a fatal
    crash for posterior investigation. `Log levels` are your friends here.


    After deciding what type of events you want to log (Each method call? Just business
    events? Only fatal errors?) and what data about them you want to capture (`timestamp`,
    `description`, `log level`, `logged user`, or `time of session?), the next step
    is deciding where you want to log to.


    See, even though the demo app logs to a file, there’s nothing preventing you from
    logging to a variety of targets, such as the database, the console, or even an
    online service.

