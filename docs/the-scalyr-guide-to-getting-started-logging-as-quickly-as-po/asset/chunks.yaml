    ![](img/Image2013.png)


    让我们在视图中注意几点。首先，注意第 1 行和第 6 行，它们是 `{{title}}` 和 `{{logStatement}}`。这些是我们绑定到视图的模型变量。在
    Angular 中，它们是双向绑定的，这意味着如果视图中的值发生变化，模型值就会更新，反之亦然。如果你更改了模型中的值，视图中的值也会同步更新。


    在我们的特殊情况下，当我们点击各种日志级别按钮时，我们模型中的 `{{logStatement}}` 会发生变化。当模型值更新时，HTML 视图也会更新。


    让我们来看看我们的 Angular 日志应用程序：


    ![`www.hitsubscribe.com/wp-content/uploads/2018/11/angular4-logging-app.png`](img/Image2022.png)


    在右侧，我们有 Google Chrome 控制台，它首先显示 `ngOnInit()` 方法中的消息。然后，随着我们点击各种日志按钮，我们就会以相应的日志级别向控制台记录日志。


    ## 使用 Angular CLI 生成新服务


    在 Angular 组件内部进行日志记录无疑是使用 Angular 记录日志非常快速的方法。但对于创建一个可以复用的日志工具以便在 Angular 应用中记录日志，这并不是正确的方法。


    为了正确实现，让我们创建一个名为 `LogEngine` 的日志服务。服务是软件中的一小部分，专门执行一个特定的功能。我们的新服务专门负责向控制台记录消息。


    这次，由于我们已经有了日志记录组件，让我们创建一个包含日志逻辑的 Angular 服务。我们还将修改日志组件，使其仅包含使用新服务的用户界面。


    我们可以再次简单使用 Angular CLI 来生成服务，就像我们上面生成 Angular 组件一样。要这样做，在终端窗口中，我们需要确保我们处于 `hello-world`
    文件夹内。然后我们使用 Angular CLI 生成服务而不是组件：


    ![](img/Image2031.png)


    像往常一样，`g` 代表 generate（生成），而 `s` 代表 service（服务）。我们将日志服务命名为 `logEngine`。注意，除了服务名称外，我们还包含了此新服务的路径。让我分享一个建议：当通过
    CLI 创建服务时，请确保不要在服务的命名称中使用 `service` 单词。Angular CLI 会自动在类定义中添加 `service` 单词。


    但我选择不使用 Angular CLI 生成我们的新服务。让我们来讨论如何手动执行此。


    ## 手动创建新的 Angular 日志服务


    这次，让我们手动创建新的 Angular 日志服务。了解如何这样做是有好的，因为很多时候，当系统为我们生成内容时，看到背后发生了什么会有帮助。


    在 Visual Studio Code 中，在 `src/app` 下，我们将创建一个名为 `services` 的新文件夹。在里面，创建另一个名为 `log-engine`
    的新文件夹。该文件夹将存放我们的 `logEngine` 服务。在新文件夹内部，让我们创建一个名为 `log-engine.service.ts` 的新文件。这就是我们的服务文件。


    ![`www.hitsubscribe.com/wp-content/uploads/2018/11/angular-service-created-215x300.png`](img/Image2042.png)


    接下来，让我们看看 IDE。我们仍然应该看到上面的日志组件文件夹。现在我们有了带有 `log-engine` 子文件夹的 `services` 文件夹。我们在这里可以找到新建的
    `log-engine.service.ts` 文件。在这个文件中，我们将创建 `LogEngineService` 逻辑。


    现在，我们将所有的日志逻辑从旧的 `logger.component.ts` 移动到新的日志服务 `log-engine.service.ts` 中。


    我们还将重构日志方法，使其更像标准的日志接口，为每个日志级别提供特定的方法。


    ## 将日志逻辑移动到新的 Angular 服务


    在此时，我们将简单地将现有的日志逻辑从日志组件移动到新的 `LogEngineService`。此外，我们将重构现有的 `log` 方法，并将其拆分为适用于每个日志级别的特定方法。这是一个更好的日志接口，因为它类似于著名的
    `console` 控制台日志接口。


    ![](img/Image2054.png)


    注意类名是 `LogEngineService`。Angular CLI 在创建服务时会自动添加 `service` 单词。尽管我们是手动创建文件，我们也应该这样做。


    我们仍然想在每个日志条目中添加日志级别和时间戳。此外，`LogEngineService` 中的每个方法都返回每个日志条目。我们还想通过 HTML 视图在应用程序中显示日志语句。这稍后会变得清晰。


    现在，让我们连接 `LogEngineService` 并在我们的日志 Angular 组件中使用它。


    ## 连接新的 Angular 日志服务


    为了连接服务，我们将打开 `app.module.ts`。这里是我们定义应用级依赖的地方。我们需要将我们的新服务作为提供者（providers）之一。


    ![](img/Image2061.png)


    注意我们在 `providers` 列表中添加了 `LogEngineService`——`providers: [LogEngineService]`。


    ### 在我们的 Angular 组件中使用服务


    在快速使用 Angular 记录日志的旅程中，我们需要向 `logger.component.ts` 内部的日志组件添加 `LogEngineService`。让我们看看文件顶部的导入语句：


    ![](img/Image2069.png)


    现在我们的日志组件已准备好使用 `logEngine` 服务。重构了现有的组件，使其不再包含日志逻辑，因为我们将所有逻辑都移动到了服务中。让我们再次查看整个
    `logger.component.ts` 文件：


    ![](img/Image2076.png)


    注意新的监听器。但 `logService` 是什么？它是我们刚刚创建并导入到组件中的 `LogEngineService`。注意构造函数。这就是 `LogEngineService`
    变为 `logService` 的方式：


    ![](img/Image2084.png)


    ### 重构 HTML 视图并测试


    最后一步是更新我们的组件 HTML 视图（`logger.component.html`）以使用刚刚创建的新监听器：


    ![](img/Image2091.png)


    我们我们为每个按钮监听器添加了带消息的调用。我们不再需要手动传递所需的日志级别，因为每个按钮监听器都会向 `LogEngineService` 方法发送正确的日志级别。


    我们现在只需要保存所有文件，并刷新运行在 `localhost:4200` 的应用程序。让我们来看看：


    ![`www.hitsubscribe.com/wp-content/uploads/2018/11/angular-logging-final-debug-1024x463.png`](img/Image2098.png)


    就是这样！这与我们之前在容器本身中记录日志时的功能完全相同。然而，现在我们有了一个独立的 Angular 服务，专门负责记录我们的消息，并带有日志级别和时间戳。


    ## 增强你的日志服务！


    在本章中，我们学习了如何使用 Angular 和 AngularJS 快速开始记录日志。我们还涉及了安装 Angular CLI 并使用它创建开发 Angular
    的框架骨架。此外，我们重构了日志组件，使其使用 Angular 日志服务。这改进了我们代码和逻辑的组织。


    显然，除了调试，日志可能没什么价值。但在探索了 Angular 服务之后，你现在应该有了如何增强日志服务的想法，以便通过 REST 调用持久化日志或与日志聚合服务集成。所以，去吧，像专业人士一样在
    Angular 中记录日志吧！


