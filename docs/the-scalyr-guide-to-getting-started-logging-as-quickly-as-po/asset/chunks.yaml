    *   Low- or no-code platforms that allow you to build applications with little
    to no coding experience.


    But even though things are easier, they haven’t become simpler. In fact, they’re
    more complex. Instead of building a single stand-alone application, we now write
    applications that consist of multiple smaller applications. These all interact
    with each other and with services that are out of our control.


    All this complexity gives us great advantages, like easier scaling and improved
    efficiency. But they also increase the amount of places where bugs and issues
    can occur. Luckily, we have modern monitoring tools that can quickly notify us
    and even provide context and information. But logging is still the best way to
    see what led up to the issue.


    In these complex environments, centralized logging is the number one way to gain
    access to all necessary information. Centralized logging makes our lives easier
    and allows us to fix issues faster and cheaper.


