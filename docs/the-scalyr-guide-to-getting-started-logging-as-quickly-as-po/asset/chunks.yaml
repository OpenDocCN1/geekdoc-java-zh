    ![](img/Image694.png)


    在 `index.php` 中添加以下 HTML 代码：


    ![](img/Image702.png)


    这段 HTML 代码将创建一个简单的订阅表单。要查看生成的页面，打开浏览器并访问 `http://localhost`：


    ![](img/Image711.png)


    尽管你可以在浏览器中看到表单，但它现在并没有任何实用的功能。为了让它运行，请在 `index.php` 文件的顶部、HTML 代码之前添加以下 PHP 脚本：


    ![](img/Image722.png)


    上面的代码将从提交请求中提取 name 和 email 参数，并将它们传递给 `subscribe` 函数。由于本教程是关于日志记录的，我们暂时保持 `subscribe`
    函数体为空。


    现在，假设你想创建一个记录所有订阅请求及其参数的文件。你可以通过在调用 `subscribe` 之前添加两行代码来实现：


    ![](img/Image736.png)


    这些代码将调用 PHP 的 `file_put_contents` 函数，将日志消息追加到 `server.log` 内容中。


    现在如果你在浏览器中打开 `http://localhost`，填充字段并点击订阅按钮，此脚本会在 `/var/www/html` 中创建 `server.log`
    文件并写入内容。我可以使用 `cat` 命令读取文件内容：


    ![](img/Image743.png)


    恭喜！你记录了第一条 PHP 日。


    现在，让我们退一步。


    # 什么是应用程序日志记录？


    你可能对日志有了直观的理解，但值得花时间回顾一个正式的定义。我们之前将日志记录定义为：


    日志记录涉及将应用程序运行行为的信息记录到更持久的介质中。


    这里有两个重要的点需要注意：


    首先，日志与应用程序的运行行为有关。也就是说，它是记录随时间变化的应用程序事件。


    其次，你总是希望将日志存储在更持久的介质中。“更持久”的具体含义取决于你的需求和环境，但至少，即使应用程序或整个服务器崩溃，你也能够读取日志。


    虽然这个定义解释了什么是日志，但它并没有解释为什么要在程序中使用日志。这是一个重要的问题，我想详细讨论。

