    添加第二个文件输出器（appender）。要做到这一点，创建一个列表，包含原始 appender 以及另一个具有不同名称和文件的 appender。你的 `Appenders`
    部分如下所示：


    ![](img/Image618.png)


    接下来，将 `LoggerChild` 日志指向新的 appender。你的 `Loggers` 部分如下所示。


    ![](img/Image629.png)


    现在运行应用程序。你会看到两个不同的日志文件，每个文件都包含其关联类的消息。


    # 日志消息格式化


    我们的每个 appender 都有一个 `PatternLayout`。


    ![](img/Image642.png)`PatternLayout` 是 Log4j 布局类的一个实例。`Log4j` 内置了多种布局，用于以 CSV、JSON、Syslog
    以及多种不同格式记录消息。


    `PatternLayout` 拥有一组用于格式化消息的操作符，用法类似于 C 语言的 `sprintf` 函数。通过指定模式（pattern），我们可以控制日志消息在被
    appender 写入时的格式。


    我们的布局字符串看起来如下：


    ![](img/Image649.png)


    每个 `%` 对应日志消息中的一个字段。


    ![](img/Image657.png)


    `PatternLayout` 还有许多额外的操作符，你可以自己去探索。


    # 变量替换


    随着 appenders 和 loggers 的数量增加，配置文件可能会变得重复。`Log4j` 支持变量替换，有助于减少重复并使维护变得更简单。让我们使用
    `Properties` 来完善我们的配置。


    ![](img/Image664.png)


    在文件顶部，我们声明了两个 `Properties`，一个命名为 `LogDir`，另一个命名为 `DefaultPattern`。


    声明属性后，可以使用大括号和美元符号在配置中使用它：`${LogDir}` 或 `${DefaultPattern}`。


    `LogDir` 是我们添加到两个日志文件文件名中的一个子目录名称。当我们运行应用程序时，`Log4j` 会创建此目录并将日志文件放置在其中。


    我们将 `DefaultPattern` 指定为两个日志文件的布局模式，将定义移动到了一个地方。现在，如果我们要修改日志文件格式，我们只需要担心修改一次就行了。


    `Log4j` 还可以从环境中导入属性。（你可以在 [Apache Logging Services 网站上阅读更多相关信息。](https://logging.apache.org/log4j/2.x/manual/configuration.html#Property_Substitution））例如，如果我们想从
    Java 系统属性导入日志文件目录，我们在 `Log4j` 配置中将其指定为 `${sys:LogDir}`，并将 `LogDir` 系统属性设置为所需的目录。


    # 自动重配置


    `Log4j` 可以按定期间隔重新加载配置，这使我们能够在不重启应用程序的情况下更改其日志配置。


    在文件的 `Configuration` 部分添加 `monitorInterval` 设置，`Log4j` 就会按照指定的间隔扫描文件。


    ![](img/Image672.png)


    间隔以秒为单位。


    # 总结


    `Log4j` 是一个强大的日志框架，允许我们配置应用程序以多种方式记录日志，并对不同组件使用日志文件的方式进行粒度控制。本教程涵盖了配置 `Log4j`的基本方面，但还有更多内容可以学习。你可以在该项目的[网站](https://logging.apache.org/log4j/2.x/manual/configuration.html)上学习
    `Log4j` 配置。


