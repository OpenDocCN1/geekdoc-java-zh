    to locate a file after we cover the different format and naming options.


    Configuration File Formats


    Log4j will load Java properties and YAML, JSON, and XML configuration files. It
    identifies the file format by examining the file extension.


    *   For Java properties, the extension is .properties


    *   For YAML, the extensions are .yaml or .yml


    *   For JSON, the extensions are .json or .jsn


    *   For XML, the extension is .xml


    A file specified by the log4j.configurationFile system property must have one
    of these file extensions, but it can have any base name. Log4j will parse it based
    on the format indicated by the extension.


    When Log4j scans the classpath for a file, it checks for each format in the order
    listed above and stops when it finds a match. For example, if it finds a YAML
    configuration, it will stop searching and load it. If there is no YAML file but
    it finds a JSON one, it will stop searching and use that instead.


    Configuration File Names


    When Log4j scans the classpath, it looks for one of two file names: log4j2-test.[extension]
    or log4j2.[extension]. It loads test files first, giving developers a convenient
    mechanism for forcing an application to log at the Debug or Trace levels without
    altering the standard configuration.


    Scanning for Configuration


    When we put the rules for file formats and names together, we can see Log4j’s
    algorithm for configuring itself.


    If any of the following steps succeeds, Log4j will stop and load the resulting
    configuration file.


    1.  Check for the log4j.configurationFile system property and load the specified
    file if found.


    2.  Search for log4j2-test.properties in the classpath.


    3.  Scan classpath for log4j2-test.yaml or log4j2-test.yml.


    4.  Check for log4j2-test.json or log4j2-test.jsn.


    5.  Search for log4j2-test.xml.


    6.  Look for log4j2.properties.


    7.  Search for log4j2.yaml or log4j2.yml.


    8.  Scan classpath for log4j2.json or log4j2.jsn.


    9.  Check for log4j2.xml.


    10.  Use the default configuration.


    Practice Proper Configuration File Hygiene


    There are 12 potential configuration file names for Log4j. Loading the wrong one
    can lead to lost logging information or diminished performance. That’s because
    an application may log unnecessary messages in a production environment.


    Before deploying code, make sure your application has one—and only one—configuration
    file and that you know where it is. If you insist on loading configuration from
    the classpath, scan for spurious files before releasing your code.


    Basic Configuration


    Now that we know how to supply a configuration to Log4j, let’s create one and
    use it to customize our application.


    Log4j’s Default Configuration Revisited


    We’ll start with the default configuration and modify our application’s behavior
    from there. Taking the hint from Log4j’s configuration rules, we’ll use YAML.


    The default configuration looks like this:


    ![](Images/Image515.png)


    Create a file name log4j2.yaml with these contents and set log4j.configurationFile
    to point to its location.


    Next, run the application. You’ll see the same output as before.


    ![](Images/Image524.png)


    We’ve taken control of our application’s logging configuration. Now let’s improve
    it.


    Log File Location


    The first step is to get our logs off of the console and into a file. To do this,
    we need to understand appenders.


    Appenders put log messages where they belong. The default configuration supplies
    a console appender. As the name suggests, it appends messages to the console.


    ![](Images/Image535.png)


    We want a file appender. Let’s replace our console appender.


    ![](Images/Image548.png)


    File appenders have a name, just like console appenders. But instead of a target,
    they have a fileName.


    Similar to console appenders, they also have a PatternLayout, which we’ll cover
    below.


    The name is not just for show. If we want to replace the console appender with
    the file appender, we need to let our logger know where to put our log messages.


    So change the ref value in the logger to the file appender’s name.


    ![](Images/Image555.png)


    Now, rerun the application. Instead of logging to the console, it places the messages
    in a file named logfile.log in the working directory. We’ve moved our logs to
    a file!


    Logging Levels


    We still only saw two of our six log messages in our log file. Let’s talk about
    loggers and how they manage log messages.


    Our basic configuration defines a single logger.


    ![](Images/Image563.png)


    It has a level of Error, so it only prints messages that are Error or Fatal.


    When a logger receives a log message, it passes it on or filters it based on its
    configured level. This table shows the relationship between logger configuration
    and log message level.


    ![](Images/Image570.png)


    So if we change the level of our logger, we’ll see more messages. Set it to Debug.


    ![](Images/Image578.png)


    Next, rerun the program. The application logs all of the messages that are Debug
    level or higher.


    Logger Hierarchy


    Log4j arranges loggers in a hierarchy. This makes specifying a different configuration
    for individual classes possible.


    Let’s change our application and see this in action.


    ![](Images/Image585.png)


    We’ve added an inner class that creates a logger and logs a message with it.


    After Main does its logging, it calls LoggerChild.


    If we run this with our current config, we see the new message and that it’s logged
    from a different class.


    ![](Images/Image593.png)


    Loggers have a class hierarchy similar to Java’s. All loggers are descendants
    of the Root logger we’ve been working with so far. Loggers that lack any specific
    configuration inherit the Root configuration.


    So when Main and LoggerChild create loggers using their class name, these loggers
    inherit Root’s configuration, which is to send Debug level and higher messages
    to the File_Appender.


    We can override this specifying configuration for the two loggers.


    ![](Images/Image600.png)


    Loggers are named in the logger section. Since we’re listing two, we use the YAML
    array syntax.


    We set com.company.Main logger to Error and com.company.Main.LoggerChild to Debug.


    The additivity setting controls whether or not Log4j will send messages from a
    logger’s ancestor to a descendant. If set to true, both loggers will process the
    same message. Some systems want to add the same message to two different logs.
    We don’t want this behavior, so we’ve overridden the default and specified false.


    Now run the program again:


    ![](Images/Image608.png)


    We only saw the error message from Main but still saw the debug message from LoggerChild!


    More Than One Appender


    Just like we can have more than one logger, we can have more than one appender.


    Let’s make a few changes to our configuration.'
