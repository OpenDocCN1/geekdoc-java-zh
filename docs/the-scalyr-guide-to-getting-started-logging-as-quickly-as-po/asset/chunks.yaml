  raw: 'We need visibility into our application’s runtime behavior, and we get it
    by logging.


    How Should You Log?


    We already took a quick look at Apple’s unified logging system. It fulfills the
    requirement for persistently storing logs in a central location. We can find these
    logs with a text search via the console application or a command line tool.


    But it would be nice if the logs were easier to find inside the system and had
    a bit more context.


    This leads to a more general question: what information should be logged?


    Most logging systems include at least the following information in each log entry:


    *   Timestamp: when the event described in the log entry happened. The unified
    logger takes care of this for us.


    *   Event context: useful information about the event. “It worked” or “it’s broken”
    might be useful or entertaining during a debugging session. “Failed to connect
    to database at 192.9.168.3:5000” is more useful in production.


    *   Severity level: logs tend to have a level that puts them in context compared
    to other entries. The unified logger defines Default, Info, Debug, Error, and
    Fault. We’ll take a closer look at logging levels below.


    So the unified logger takes care of two out of three essential aspects of logging
    for us. But it’s up to us to manage the content of our messages effectively.


    Customizing the Unified Logging System


    Let’s take some time to talk about customization.


    Adding a Log Level


    First, we’ll cover how to make our use of the unified logger more effective. We
    can already log information to persistent storage with a single line of code.
    But what more can we do?


    First, let’s add some additional context to our logs with log levels. Change the
    call to os_log by adding a few more arguments and the log message text.


    ![](Images/Image1277.png)


    Build, run, and take a look at the console application.


    ![](Images/Image1289.png)


    The logger tagged the message as an Error for us because we passed .error for
    the type: argument. We can also pass in .info, .debug, or .fatal. If we omit the
    type: argument, the message is logged as default.


    To do this, we had to pass the call to os_log the log message, an instance of
    a logger, along with the log message type.


    Let’s take a closer look at the notion of a log instance before continuing to
    customize our messages.


    Log Instances


    We’d been calling os_log with a single call to log messages up until the previous
    exercise. This is a convenience function. When we called it with only a message,
    it used a default logger instance. When we called it with an instance and a log
    type, we were calling a different function that manipulated the instance we passed
    in.


    Let’s take a closer look at our log message in the console application.


    ![](Images/Image1302.png)


    Because we used the default logger instance, the message doesn’t have subsystem
    or category information.


    If we want to populate these fields, we need our own logger instance—one that’s
    initialized with information about our application. Let’s create one.


    The first step is to create a plist with logging configuration information.


    In Xcode, create a new file. Select the property list type.


    ![swift logging new plist](Images/Image1309.png)


    Name it com.scalyr.SwiftLogger and save the file.


    The file will open in the property editor. But life’s too short for that. Right-click
    on the file name in the project navigator, select open as, and then select source
    code.


    ![https://www.hitsubscribe.com/wp-content/uploads/2018/09/open-as-source-code.png](Images/Image1317.png)


    Enter this text:


    ![](Images/Image1324.png)


    This property list defines a logger system that defines how Info-level messages
    are handled. We’ll go over this in more detail after this example.


    Copy this file over to the /Library area of your system.


    You’ll need to be in the working directory of your project and have root access.


    ![](Images/Image1332.png)


    This property list defines a logging subsystem named com.scalyr.SwiftLogger that
    we can refer to when we create a new instance.


    So, let’s update the code.


    ![](Images/Image1339.png)


    We’re creating a logger instance with OSLog.init. We pass it the name of our subsystem
    and then a logging category. A category is an arbitrary name for group log messages.


    Next, we pass the logger instance to os_log.


    Run the code, and you’ll find a log message set to the Default level in the console
    app. Click on it to see the details.


    ![](Images/Image1346.png)


    Let’s send this message as a Fault.


    ![](Images/Image1354.png)


    Run this version, and check the console application.


    ![swift logging](Images/Image1364.png)


    We see the details and the Fault log level.


    Log Message Storage


    In the plist, you can see this section toward the middle:


    ![](Images/Image1373.png)


    This defines the storage options for the Info log level. It tells the system to
    inherit the default. We only needed to establish a log system to get past the
    step of creating a named logger.


    But it’s useful to understand the default rules for storing logs.


    *   Default log messages are stored in memory buffers. The system will compress
    and move them to the data store as memory buffers fill.


    *   Info log messages are stored in memory buffers. The system won’t move them
    to the data store. It purges them as memory buffers fill.


    *   Debug messages are only captured in memory when Debug logging is enabled through
    a configuration change. The system will never write them to disk.


    *   Unified logging always saves Error and Fatal messages to the data store.


    Log Contents


    We can set up a log with a subsystem and category, and we can control the level
    messages we send with it. That leaves log contents.


    Even though we’re limited to passing static strings in the log message, we can
    still use C-style formatting with those strings.


    So we can use log strings as a formatter:


    ![](Images/Image1384.png)


    Run this from Xcode, and you’ll see the log message.


    We can log scalar values too:


    ![](Images/Image1396.png)


    But what we see from inside Xcode is not what happens in production.


    Let’s change the code back to printing a string in the log message:


    ![](Images/Image1403.png)


    Run this in Xcode, and you’ll see “The answer is a secret” in the console application.


    Now, let’s build the application and run it from the command line.


    Open a shell and move to the project directory. Run xcodebuild and then run the
    application.


    ![](Images/Image1412.png)


    Check the log message in console.


    ![](Images/Image1419.png)


    The unified logger redacted the string. This is the default behavior for string
    messages. It isn’t for scalar values.


    If you do not want a string to be redacted use the {public} notation.


    ![](Images/Image1427.png)


    If you want a scalar value redacted, use the {private} notation.


    ![](Images/Image1434.png)


    This is a built-in security feature that helps protect critical information. As
    tempting as it might be to mark everything public, resist the urge.


    What Now?


    We’ve covered the hows and the whys of logging with Swift on an Apple platform
    with the unified logger. It’s a comprehensive system that makes logging easy for
    an application developer.


    Even though we’ve talked about a lot of logging approaches in this book, there’s
    still more to know about logging. If you want to branch out from what you’ve learned
    in this chapter, you can start with the the [Apple unified logger documentation](https://developer.apple.com/documentation/os/logging#2878594?changes=_1)
    on the Apple Developer website. But now you know the fundamentals, and that means
    you can get started with logging in your Swift applications today!


    This chapter was contributed by Eric Goebelbecker. [Eric](http://ericgoebelbecker.com/)
    has worked in the financial markets in New York City for 25 years, developing
    infrastructure for market data and financial information exchange (FIX) protocol
    networks. He loves to talk about what makes teams effective (or not so effective!).'
