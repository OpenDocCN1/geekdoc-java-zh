    If there is one idea in this book that might save your life, it is this: The human
    body, like all living things, is a heat machine. Just being alive generates heat.
    But if your body gets too hot fast—it doesn''t matter if that heat comes from
    the outside on a hot day or the inside from a raging fever—you are in trouble.


    Every organism manages heat in a different way (more about that in an upcoming
    chapter). We humans work hard to maintain an internal temperature of over 98 degrees,
    no matter what the temperature is. If it is cold outside, we push blood into our
    vital organs to keep them warm. If it is hot outside, we push blood toward our
    skin so it can be cooled by sweat. The drier the air, the more difficult it is
    for our sweat to evaporate and dissipate heat. Like all living things, our bodies
    have thermal limits. Those limits vary depending on age, general health, and a
    number of other factors. There is general consensus among researchers that a bulb
    temperature of 95 degrees—which basically means both outdoor air temperature and
    humidity levels are high (see glossary for a more precise definition of wet globe
    temperature)—is the upper end of human adaptability to humid heat. Beyond that,
    our body generates heat faster than it can dissipate it.


    And that''s when trouble begins. Hyperthermia, or abnormally high body temperature,
    causes a range of physiological responses that might start with dizziness and
    heat cramps and lead all the way to heatstroke—a condition that can be, and often
    is, fatal.


    Broadly speaking, there are two kinds of heatstroke: classic and exerted. Classic
    heatstroke hits the very young, the elderly, overweight, and people suffering
