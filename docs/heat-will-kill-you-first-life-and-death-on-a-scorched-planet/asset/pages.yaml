  md: '# 9. ICE AT THE END OF THE WORLD


    January 30, 2019


    Today, we''re supposed to be steaming toward Antarctica. Instead, as I write this
    morning, the Nathaniel B. Palmer, a 308-foot-long icebreaker and research vessel
    I''m aboard, is tied up at a dock in Punta Arenas, Chile. On the ship with me
    are twenty-six scientists and thirty-one crew members and support staff, as well
    as many millions of dollars'' worth of scientific equipment. We departed for Antarctica
    two nights ago, but we had to return to port because of a problem with the ship''s
    rudder. Divers are in the water now—presumably it will get fixed shortly and we''ll
    be on our way.


    The trip I''m about to take is the first expedition in a $50-million, five-year-long
    joint research project between the National Science Foundation and the British
    Antarctic Survey designed to explore the risk of sudden collapse of Thwaites Glacier,
    one of the largest glaciers in West Antarctica. On this trip, scientists will
    poke and prod Thwaites—aka the Doomsday Glacier—from every direction, map the
    ground beneath, measure changes in ocean currents that are bringing warm water
    to the base of the glacier, and dig mud near the front of the glacier to better
    understand how quickly it has retreated during past warm periods. As chief scientist
    Rob Larter told us during a science meeting aboard the ship last night, “The question
    we want to answer is, is the West Antarctic ice sheet on the verge of unstoppable
    collapse?”


    How close West Antarctica is to collapse is one of the most urgent and consequential
    questions of our time. A stable West Antarctic ice sheet means coastal cities
    around the world will likely have time to adapt to rising seas. An unstable West
    Antarctic ice sheet means goodbye Miami—and virtually every other low-lying coastal
    city in the world.'
