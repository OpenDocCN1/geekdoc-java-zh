  md: 'One night a month or so before the trip began, Keith and Holmes and I sat in
    the living room of Keith’s house and discussed our polar bear defense strategy.
    Keith explained that bear spray is useless in windy conditions. Some people who
    trek through polar country bring dogs to alert them of the presence of bears.
    We decided, however, that dogs were too much hassle. Among other things, they
    need to be leashed at night, and you have to haul around a sled of dog food.


    Keith had a better way. “We’ll use a bear wire,” he said. It would work like this:
    every night we pitched our tent, we set our ski poles in the ground in a circle
    about thirty feet from the tent, driving into the ground like fence posts. Then
    we would string a thin copper wire between them and connect both ends in a little
    box with a battery and buzzer in it. The copper wire formed a circuit, and if
    a bear was coming into our camp, it would break the wire and the alarm would go
    off, giving us a few seconds’ warning before it charged into our tent.


    “And then what?” I asked.


