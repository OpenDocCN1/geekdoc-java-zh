    calm. Without waves to break up the surface and dissipate heat, warmth from the
    sun accumulated in the water, eventually raising the temperature by five degrees—a
    huge spike for the ocean.


    When scientists noticed this temperature anomaly in the satellite data, they had
    never seen anything like it. Everyone knew about heat waves on land, but in the
    ocean? “As the Earth heats up, the ocean is changing in very dramatic ways,” Jane
    Luchenko, a marine ecologist and former head of the National Oceanic and Atmospheric
    Administration, told me. “It is less predictable, and we are seeing more surprises.
    The heat waves are one of those surprises.


