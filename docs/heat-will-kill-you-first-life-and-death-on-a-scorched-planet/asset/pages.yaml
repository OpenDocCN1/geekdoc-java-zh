  md: '# Glossary


    **albedo**: the ability of an object or surface to reflect away sunlight, and
    along with it, reflect away heat. A white roof has a high albedo; a black asphalt
    street has a low albedo. Shifting to higher-albedo materials is a key strategy
    in counteracting the urban heat island effect. Cold-blooded animals like chameleons
    manipulate their albedo to control their body temperature: when it''s hot, they
    turn a white-ish color to reflect away sunlight. When it''s cold, they darken
    to warm themselves.


    **body temperature**: the temperature of a person’s internal organs, including
    the heart, liver, brains, and blood. Core body temperature is different—and more
    indicative of hyperthermia—than peripheral body temperature, which is the temperature
    at or near your skin, and influenced by your environment. A person’s core body
    temperature has a daily circadian rhythm, causing it to vary by a degree or more
    depending on the time of day. Body temperature is typically lowest in the morning,
    rises during the day, then falls all in the evening.


    **Goldilocks Zone**: the area around a star where is not too hot and not too cold
    for liquid water to exist on the surface of planets. Also known as the habitable
    zone.


    **heat dome**: an area of high pressure that lingers for days or even weeks, trapping
    heat underneath—a bit like a lid on a pot. In northern latitudes, pressure systems
    usually move from west to east, but sometimes they get blocked, often when the
    jet stream weakens and buckles. The jet stream is a band of strong winds high
    above the Earth’s surface that, among other things, helps to develop and move
    areas of low pressure around.


    **heat exhaustion**: a condition of elevated heat stress. Symptoms may'
  merge: -1
  pgno: 246
- img_proc: true
  md: 'include heavy sweating, dizziness, nausea, fainting.


    **heat index:** a value calculated by combining relative humidity and air temperature.
    It was developed from a model created by physicist Robert Steadman in 1979 as
    a way to more accurately measure how weather conditions feel to a person (that’s
    why the heat index is sometimes referred to as the “feels like” temperature).
    The National Weather Service (NWS) cautions that heat index values assume shady,
    light wind conditions—exposure to direct sunlight can increase the index by 15
    degrees. David Romps, a climate scientist at the University of California, Berkeley,
    has demonstrated that at high temperatures the NWS heat index calculation becomes
    increasingly inaccurate and can underestimate the actual heat index by as much
    as 20 degrees.


    **heat stress:** the inability of the body to rid itself of excess heat. Initial
    symptoms include moderate sweating and a rapid pulse. Escalating stress leads
    to heat exhaustion and heatstroke.


    **heatstroke:** a life-threatening illness typically associated with an uncontrolled
    rise in core body temperature above 104 degrees (40°C) and central nervous system
    dysfunction, including delirium, convulsions, coma, and death.


    **hyperthermia:** abnormally high body temperature, caused when your body is absorbing
    or generating more heat than it can release. It’s the opposite of hypothermia,
    which occurs when your body is losing more heat than it can generate.


    **thermal barrier:** the reduction of heat transfer from one body or space to
    another. On mammals, fur is a thermal barrier. In buildings, insulation is a thermal
    barrier. The phrase is also used in the context of a heat boundary, such as the
    speed at which a rocket can fly before aerodynamic heating (caused by the friction
    of an object flying through the air at high speed) causes the melt surface of
    the rocket to deform or melt.


    **thermal comfort:** a person’s state of mind that defines whether they feel too
    hot or too cold. Unlike hyperthermia, which describes a physiological condition,
    thermal comfort describes a psychological'
  merge: -1
  pgno: 247
- img_proc: true
  md: 'state. To put it another way, any given temperature feels like to a person
    is dependent on who is doing the feeling. Age, basic health, clothing, drug use,
    and many other factors can have a significant influence.


    # the process of water movement through a plant and its evaporation from its leaves.
    Plants pull water from the soil through their roots and transport it to their
    leaves, where photosynthesis takes place. But almost all the water that reaches
    the leaves is lost as water vapor when the stomata (tiny pore-like structures
    on the leaf surface) open and close to exchange CO2 and oxygen. As the water vapor
    evaporates, it has a cooling effect on the plant, similar to the way sweating
    works to cool the human body. Large trees can transpire as much as 30 gallons
    of water a day, which draws heat energy from around the tree and cools the surrounding
    air.


    # a populated area that is significantly warmer than its surrounding rural areas
    due to human artifacts and activities. Pavement, concrete, and steel all absorb
    heat and radiate it back. Buildings mean less shade and transpiration cooling.
    Waste heat from machines—cars, trucks, AC units, power plants, factories—further
    adds to the heat load. The result can be temperatures 15 to 20 degrees hotter
    in cities than in nearby rural areas, with the temperature differential often
    largest at night.


    # human illnesses caused by parasites, viruses, and bacteria that are transmitted
    by the bite of an infected arthropod, such as a mosquito or tick. Arthropods are
    all cold-blooded creatures and thus especially sensitive to changes in temperature
    and climate.


    # a measure of heat stress in direct sunlight, which takes into account temperature,
    humidity, wind speed, and solar radiation.


    “Wet bulb globe temperature came out of the military, because they wanted to find
    a better way to prevent heat casualties.” Andrew Grundstein, a professor of geography
    at the University of Georgia, told me. It’s often used in sports, in the military,
    and for worker safety. “Because it considers many factors, including the cooling
    power of'
  merge: -1
  pgno: 248
- img_proc: true
  md: 'sweat, it’s a much more accurate measurement of heat stress than heat index,”
    explained Grundstein. “The problem is, weathercasters shy away from it because
    it can give you a reading that is below the air temperature, so it confuses people.”
    For example, I write this, the temperature in Austin is 95 degrees, with a humidity
    level of 40 percent and a light wind. The heat index is 99 degrees. The WBGT is
    only 86.4 degrees, partly because there is light cover, and partly because humidity
    is relatively low (for Texas).


    **wet bulb temperature (WBT):** a calculation of the lowest temperature that the
    evaporation of water can cool air. It was developed in the early twentieth century
    by British physicist J. S. Haldane, who descended into hot, humid Cornish tin
    mines to research the impacts of moist heat on workers. Haldane developed a temperature
    measurement that focuses on humidity and how well someone can cool via the evaporation
    of sweat.


    The phrase “wet bulb” refers to the fact that it is measured by wrapping a thermometer
    in a wet cotton rag or sock and placing it outdoors. As the water from the rag,
    it lowers the temperature of the thermometer, approximating the cooling capacity
    of sweat. When the air is dry, more water can evaporate, lowering the WBT temperature;
    when it’s humid, evaporation is less effective, so the WBT is higher.


    Researchers sometimes use the WBT to establish thermodynamic limits on heat transfer
    by the human body.


    WBT is different from WBGT (see previous page), which was developed much later
    and includes the effects of wind and solar radiation.'
