  md: 'Polar bears may look cuddly and cute, but they are the apex predators of the
    Far North. That is, there''s nothing in the polar bear''s realm that hits it.
    It''s afraid of nothing, because in its world, it has nothing to fear. Everything
    in a polar bear''s domain is food until proven otherwise. Unlike other bears,
    which are omnivorous (grizzlies eat everything from plant roots to elk), polar
    bears are pure meat-eaters. While their preferred meal is seals, they have also
    been known to kill and eat walrus, beluga whales, and in hard times, one another.
    Male polar bears have a particular appetite for cubs, which is why mother bears
    do everything they can stay away from male bears when their cubs are young.


    During the first weeks of our trip, we spent most of our time winding through
    the fjords along the coast of Baffin, where the ice was solid. All the bears,
    we believed, were out on the floe edge—the farther out where the open sea meets
    the frozen sea. For polar bears, this is the best hunting terrain, allowing them
    to catch seals when they pop up in their breathing holes in the sea ice, as well
    as when they haul themselves out to rest on chunks of ice adrift in the sea. Although
    we didn''t know exactly where the floe edge was, we assumed it miles from the
    shore. Our guess was that all the polar bears were busy out there, and by hugging
    close to the shore of the island among the fjords, we were fairly safe.


    But after the first sighting of the bear and her cubs, we learned otherwise. In
    the following days, we began seeing more and more bear tracks. Some were several
    old days; others looked like they had been made five minutes before we arrived.
    We crossed what we jokingly called bear highways, which were well-worn paths in
    the ice that bears used to travel back and forth from the floe edge. One day we
    discovered the solitary marks of a wandering bear that looped and circled for
    no apparent reason. But the further we traveled, the more bear prints we saw.


    Not surprisingly, we also sighted more and more bears. At least we thought we
    did. Usually it was just a glimpse in the distance, a moving shape that appeared
    against the dark background of a granite outcrop. But it was hard to be sure.
    Keith would be skiing along, and suddenly he would stop and gaze into the distance,
