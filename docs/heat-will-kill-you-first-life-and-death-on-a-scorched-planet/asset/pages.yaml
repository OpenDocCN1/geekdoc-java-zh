  md: 'widening of the thermal divide, the invisible but very real line that separates
    the cool from the suffering, the lucky from the damned.


    When it comes to imagining the future at the edge of the Goldilocks Zone, it’s
    this thermal gap that is hardest to see. If the Covid-19 pandemic demonstrated
    anything, it was how quickly and easily people were able to normalize the deaths
    of others, especially if they were old, sick, or otherwise living on the margins.
    There were thousand deaths a day from Covid in the US alone. There were headlines
    and speeches and heroic doctors and nurses. And if you lost a friend or loved
    one, you felt the tragedy of it. But after the initial shock and fear of Covid,
    the deaths became a part of everyday life. Just as the 43,000 deaths a year in
    the US in auto accidents no longer trigger public outcry. Or the nine million
    deaths globally from air pollution each year. Or starvation in Yemen and Haiti.
    Or casualties of distant wars. It becomes part of the world we live in.


    And so it may be, I, with the suffering and deaths from extreme heat. It will
    become part of what it means to live in the twenty-first century, something we
    accept and don’t think too much about our everyday lives.

    But the hotter it gets, the more difficult that will become.


    Then again, maybe not. Maybe twenty thousand people dying in a sudden heat wave
