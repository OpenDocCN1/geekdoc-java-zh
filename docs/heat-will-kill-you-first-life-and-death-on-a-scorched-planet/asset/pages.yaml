    And you don’t have to go to Venus to find evidence of the killing effects of a
    superheated planet. You can just visit Guadalupe Mountains National Park in Texas.


    Gualupe Mountains is one of the least-visited national parks in the country, a
    place that makes scenery-seekers accustomed to the sheer awomeness of Yosemite
