  pgno: 55
- img_proc: true
  md: 'for the city of Phoenix.


    In 2021, there were 339 heat-related deaths in Maricopa County. That might not
    sound like a lot, especially compared to the 70,000 people who died in a few days
    during a heat wave in Europe in 2003, but it was more than triple the number from
    a decade earlier, before the city had begun taking deliberate action against heat.
    And the trend fit with the growing number of heat-related deaths in cities. A
    recent study by the National Academy of Sciences found that globally, the heat
    risk in urban areas tripled over the last forty years, putting 1.1 billion people
    at risk. Unless we take drastic action to reduce CO2 pollution and change how
    we live, the number of people at risk will grow exponentially. By 2050, 70 percent
    of the world’s population will live in cities.


    The cascading dangers of extreme heat in urban areas are just beginning to be
    understood, even in places like Phoenix, which has long been one of the hottest
    cities in America. By Mikhail Chester, the director of the Met Center for Infrastructure
    and Sustainable Engineering at Arizona State University (ASU), the risk of a heat-driven
    catastrophe increases every year. “What will the Hurricane Katrina of extreme
    heat look like?” we wondered as we sat in a café near the ASU campus a few years
    ago. Hurricane Katrina, which hit New Orleans in 2005, resulting in nearly two
    thousand deaths and more than $100 billion in economic damage, demonstrated just
    how an unprepared city can be for extreme climate events.


    > “Hurricane Katrina caused a cascading failure of urban infrastructure in New
    Orleans that no one really predicted,” Chester explained. “Levees broke. People
    were stranded. Rescue operations failed. Extreme heat could lead to a similar
    cascading failure in Phoenix, exposing vulnerabilities and weaknesses in the region’s
    infrastructure that are difficult to foresee.


    In Chester’s view, a Phoenix heat catastrophe begins with a blackout. On a hot
    day, a wildfire knocks out a major power line. A substation blows. A Russian hacker
