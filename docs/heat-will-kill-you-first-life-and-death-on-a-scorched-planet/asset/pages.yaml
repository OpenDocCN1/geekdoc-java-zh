    niches where they can thrive. Some will fare better than others. Robins can migrate
    more easily than elephants. Poison ivy can move more quickly than an oak tree.
    Farmers who grow wheat have more options than farmers who grow peaches. And some
    creatures have nowhere to go. Polar bears in the Arctic can''t migrate farther
    north. Frogs in Costa Rica aren''t going to hop up to Canada.


