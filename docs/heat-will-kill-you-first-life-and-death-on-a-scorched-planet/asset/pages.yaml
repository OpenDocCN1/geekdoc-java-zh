    Until recently, climate scientists didn''t worry much about Antarctica. It is,
    after all, the coldest on Earth, and except for a small part of the Antarctic
    Peninsula that juts north, it hadn''t been heating up much. It was also thought
    to be isolated from the warming ocean by a current that surrounds the continent,
