  md: '# EPILOGUE: BEYOND GOLDILOCKS


    THERE ARE NO signs or border crossing guards at the edge of the Goldilocks Zone.
    If we cross over, no alarms will go off. Depending on where you live, you may
    cross over sooner than others. But unless we take dramatic action now, we may
    all discover what it’s like to live outside the zone. The human race—which built
    the pyramids and the iPhone, wrote epic love poems and invented rock n’ roll,
    worshipped ancient gods and now deifies Hollywood stars—will exist in a world
    beyond the world it grew up in, beyond the place where our hearts were shaped
    and our genes were forged. We will be, in the deepest sense, on our own.


    Heat will be the engine of this transformation. The heat that propels us out of
    our Goldilocks Zone will not be accidental heat, the equivalent of an asteroid
    slamming into Earth. It will be deliberate heat. Premediated heat. We plead guilty
    to first-degree heat, Your Honor. We have known for more than a century about
    the climate consequences of burning fossil fuels. And it wasn''t just the scientists
    who know. In 1965, President Lyndon B. Johnson was aware, as have been many presidents
    after him. By 1977, Exxon (now ExxonMobil) not only knew that decades of burning
    fossil fuels would heat up the atmosphere, but developed in-house climate models
    that projected those changes with remarkable accuracy. Despite that knowledge,
    we have not only continued burning fossil fuels, we have continued them with reckless
    abandon. In a sense, you say we have built a heat-fueled rockship that is taking
    us, for better or worse, on a trip beyond the Goldilocks Zone.


    We are not there yet. It’s hot, but the things that our ancestors lived with millions
    of years—the deep forests, the cool ocean, the snow-capped mountains—are still
    with us, still recognizable, still our companions. Making the necessary changes
    will be hard; it will require political'
