    extreme cold kills people: Comparisons between deaths from extreme cold and deaths
    from extreme heat are not easy to make. First, according to Kristie Ebi, an epidemiologist
    at the University of Washington, evidence that people die from heat is well-documented.
    “But research that people actually die from the cold is scattered and not strong,”
    she argues. Many studies have shown that cardiovascular disease increases in the
    winter, but disentangling temperature from seasonal factors is challenging. “During
    the winter, on average, blood pressure, blood viscosity, and cholesterol go up,”
    explains Ebi. “But we don’t know how much could be due to temperature separate
    from behavioral changes, daylength, and other factors.” Second, comparisons of
    cold mortality vs. heat mortality often compare deaths during winter to heat waves,
    which is apples to oranges (winter is a season, a heat wave is a temperature event).
    Third, as the world heats up, all projections indicate that heat-related mortality
    will rise—key questions include who and where it will kill. As for the notion
