  md: 'When a city like Phoenix goes dark, the comforts and conveniences of modern
    life fray. Without air-conditioning, temperatures in homes and office buildings
    soar. (Ironically, new, highly efficient LEED-certified buildings are tightly
    sealed, making them dangerous traps when the power goes out.) Traffic signals
    fail. Highways gridlock with people fleeing the overheated city. Without power,
    gas pumps don''t work, leaving vehicles stranded with empty tanks. Underground
    water pipes crack from the heat, and water pumps fail, leaving people scrounging
    for fresh water. Hospitals overflow with people suffering from heat exhaustion
    and heatstroke. There are wildfires in the nearby mountains, the air will become
    hazy and difficult to breathe. The blackout continues for thirty-six hours or
    so, it''s likely the National Guard will need to be called in to maintain order
    and control widespread looting and general mayhem.


    And people—“Katrina-like numbers,” Chester predicted. Which is to say, thousands.


    In the café, Chester described this all coolly, as if a Phoenix heat apocalypse
    was a matter of fact, not hypothesis.


    “How likely is this to happen?” I asked.


    “I’d say the odds are about the same as another big hurricane will hit New Orleans,”
    Chester explained. “It’s more a question of when, not if.”


    A city is different from a hot jungle or a hot desert. Urban heat feels crueler
    and more intimate than the heat you feel in nature. Despite the fact that cities
    are full of people, urban heat has the perverse effect of creating islands of
    isolation and hardship for anyone without the means or the social connections
    to access cool spaces. It makes the hardship of poverty harder and turns even
    the simplest tasks of daily life into risky adventures.


