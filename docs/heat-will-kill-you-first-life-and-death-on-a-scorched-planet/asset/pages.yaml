    # February 2, 2019


    We are about two hundred miles off the coast of Chile right now, about to enter
    Drake Passage. This stretch of water, named after English explorer Sir Francis
    Drake, has long terrified sailors who venture into what is called the inhospitable
    latitudes. The winds often scream through the Drake from the west, swirling around
    Antarctica with nothing to stop them, giving the winds plenty of time and space
    to build monstrous waves. In addition, the Antarctic Circumpolar Current, which
    is the strongest ocean current in the world, five times more powerful than the
    Gulf Stream, swirls around the continent, amplifying the waves and making navigation
    difficult. Thirty-foot waves, combined with seventy-knot winds, are not uncommon.
    In 2017 a buoy just west of the passage recorded a wave sixty feet high, the largest
    wave ever recorded in the Southern Hemisphere. The Drake is widely recognized
    as the most dangerous passage in the world for ships. It''s a seascape haunted
    by generations of broken masts, abandoned ships, and lost sailors.


    Today, I feel the swell growing. The Palmer rocks with a predictable rhythm that
    it is, so far, not terribly alarming. At lunch today in the ship''s mess hall,
    I sit with some of the marine technicians. Most of them have been through the
