  md: '# About the Author


    Jeff Goodell is the author of seven books, including The Water Will Come: Rising
    Seas, Sinking Cities, and the Remaking of the Civilized World, which was a New
    York Times Critics Top Book of 2017. He has covered climate change for more than
    two decades at Rolling Stone and many other publications. He is a Senior Fellow
    at the Adrienne Arsht-Rockefeller Foundation Resilience Center and a 2020 Guggenheim
    Fellow.'
