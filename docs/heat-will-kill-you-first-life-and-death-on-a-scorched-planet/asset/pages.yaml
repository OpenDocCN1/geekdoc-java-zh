  pgno: 236
- img_proc: true
  md: 'leadership and deeper understanding of our connection with one another and
    with the world we live in. But it is not beyond our reach. “Humanity retains an
    enormous amount of control over just how hot it will get and how much we will
    do to protect one another through [the coming] assaults and disruptions,” argues
    David Wallace-Wells, author of The Uninhabitable Earth: Life After Warming. The
    good news, Wallace-Wells points out, that is the world is decarbonizing faster
    than anyone anticipated a decade ago. And thanks to decades of innovation, clean
    energy is now cheaper than fossil fuel energy in most parts of the world. That
    we now have the means to lift hundreds of millions out of poverty without relying
    on coal, gas, or oil. Right now, our dependence on fossil fuels is all out inertia,
    political will, and big oil and gas companies wanting to milk their investments
    as long as they can.


    If we end up pushing beyond the Goldilocks Zone, we''ll be okay for a while. We
    have tools and technology to help us adapt and survive. The lucky ones will have
    them. But our world will be transformed. The tree you used to climb when you were
    a kid will die. The beach where you kissed your partner will be underwater. Mosquitoes
    and other insects will be round companions. New diseases will emerge. Cults of
    cool will celebrate the spiritual purity of ice. You''ll grill de lab-grown “meat”
    and drink Zinfandel from Alaska. Your digital watch will monitor your internal
    body temperature. Border walls will be fortified. Entrepreneurs will make millions
    selling micro cooling devices. Fourth of July celebrations will become life-threatening
    events. Snow will feel exotic.


    In some regions of the tropics, outdoor life will become virtually impossible.
    People will flee, just like many other living things, to higher, cooler climates.
    In many parts of the world, survival will depend not just on access to water,
    decent food, and medical care. It will increasingly depend on access to cool spaces,
    a job that doesn’t require you to work outside the heat of the day, and the means
