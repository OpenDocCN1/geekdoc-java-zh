  md: 'Arctic alters the thermodynamic balance of the Earth’s atmosphere, changing
    the pressure gradients that create heat waves, and altering rainfall patterns,
    especially in Europe and Asia, which will have big implications for food production.
    Rapidly melting ice sheets in the Arctic also accelerates sea-level rise, inundating
    coastal cities around the world, stranding billions of dollars’ worth of real
    estate and forcing tens of millions of people to move to higher ground.


    A warming Arctic is also speeding the melting of permafrost, releasing vast quantities
    of methane, a greenhouse gas that is twenty-five times more potent than CO2. More
    methane warms warming, which will release still more methane—when scientists talk
    about a looming climate catastrophe, this is one of the scenarios that worries
    them. And it’s not just methane and woolly mammoth bones that are locked up in
    the Arctic permafrost—there are also viruses and pathogens, as I mentioned in
    a previous chapter, when thawed and released into our world, which could unleash
    a global pandemic (Bill Gates, an incurable optimist on many public health issues,
    once told me that pathogens released from thawed permafrost represent the one
    climate impact that keeps him awake at night).


    As the ice disappears, so the polar bears. They have evolved to survive in a very
    particular ecological niche, one that is populated mostly by ice and seals. Their
    white coats blend with the ice. Their front paws, exquisitely evolved by yanking
    seals out of the sea, are larger and shaped more like fish-hooks than the knife-like
    claws of other bears, which have evolved for climbing and digging as well as hunting.


    Although polar bears can breed with grizzly bears, creating offspring is not a
    survival strategy for the species. Wildlife biologists believe the population
    of polar bears will dwindle with the ice, retreating farther and farther north.
    Polar bear rescue groups will likely arrange food drops from helicopters to keep
    the remaining alive (it''s already a subject of active discussion). But as their
    population shrinks, so will their gene pool, leaving them more vulnerable to disease
    and less able to adapt to changing conditions. A few polar bears will live on
    for a while in zoos, but unless we take radical action to stop heating the climate
    in the next few decades, polar bears are goners.'
