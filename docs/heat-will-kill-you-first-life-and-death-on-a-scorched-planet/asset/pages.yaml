    You probably think of heat on a temperature scale, either Fahrenheit or Celsius.
    You think of it as a gradual, linear thing, a quality of the air around you moves
    up and down in increments, or that can be controlled by a thermostat. Seventy
    degrees is a little hotter than 68 degrees, which is a little hotter than 65 degrees.
    The change of seasons also plays into this incremental perception of heat—winter
    gradually warms to spring, spring into summer. Yes, there are some days that are
    hotter or colder than others, when we crank up the air-conditioning or throw on
    a sweater. It will pass and things will return to normal. Temperature is a merry-round
    that we are used to riding.


    This sense of incrementalism also holds true with the climate crisis. The Earth
