    Definitions of extreme heat, like definitions of pornography, depend a lot on
    context. Where I live in Texas, a temperature rise of one or two degrees is imperceptible.
    In Antarctica, however, a change of one or two degrees can be the difference between
    ice and water, and between stability and collapse. For millions of people in coastal
    cities around the world, those one or two degrees can make the difference between
    a nice view of the beach and three feet of water in the living room. Nowhere on
    the planet does heat have as much leverage over our future as it does in Antarctica.


