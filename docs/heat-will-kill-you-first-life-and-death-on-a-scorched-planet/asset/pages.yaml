    Coping with a warmer world has other risks. On a trip to Botswana, I learned that
    lions prefer to hunt in the cooler parts of the day, mostly early morning and
    evening. That means their prey species, such as gembok, zebra, and waterbuck,
    switch to feeding at hotter times of the day when they are not in the presence
    of lions. But feeding during the heat of the day leaves them more vulnerable to
    heat stress—and less able to adapt to rising temperatures.


    There is also the problem of synchronicity. Bumblebees are well suited to a colder
    climate, with long, furry hairs. But that makes them more vulnerable to even small
    changes in temperature. Bumblebee populations have been hardest in warming southern
    regions such as Spain and Mexico, where some species live near the edge of their
    temperature range. Sometimes bumblebees get so hot that they fall out of the sky,
    said University of Ottawa biologist Peter Soroye. “Bumblebees are disappearing
    from areas as fast as they are recolonizing others.” And because bumblebees are
    important pollinators in wild landscapes (as well as for crops like tomatoes,
    squash, and berries), the decline of bumblebees ripples through ecosystems. Without
    a strong population of bumblebees in Montana, for example, the blackberry bushes
    do not get pollinated. Which means they don’t fruit. And because blackberries
    are an important food for grizzlies, grizzlies have to look elsewhere for food—including
    dangerous journeys into the campsites of backcountry hikers.


    Then there are the pine beetles, which are ravaging pine trees in the Rockies.
    When it comes to adapting to heat, insects have an advantage in that their lives
