    Pine bark beetles’ favorite food is—surprise—pine bark. “Pine bark beetles are
    very much in tune with effects of climate on trees,” Diana Six, an entomologist
    at the University of Montana, told me. “Beetles see the whole world chemically.
    They can actually ‘smell’ a tree that is stressed by heat and drought, and they
    go after those preferentially.” Recent beetle outbreaks in the West are roughly
    ten times larger than they were a decade ago as beetles sweep through heat and
    water-stressed forests of Colorado, Arizona, and Montana. They’re also moving
    into new regions of the West that previously been too cold.


    The beetle invasion not only kills swaths of forest, but also leaves the trees
    more vulnerable to fire. Wildfires lead to a cascade of consequences not just
    for the creatures who live in those forests (including humans), but also for the
    rest of us: injecting more carbon into the atmosphere, landing soot on glaciers
    (accelerates their melting because each tiny piece of black carbon is like a heat
    sink, absorbing sunlight far greater than the reflective ice of a glacier), and
    creating more burned-out open land. All this heats up the atmosphere even further.
    And, in turn, amplifies the metabolism of bark beetles more, driving them to move
    to new forests, which they devour and will, inevitably, burn. Scientists call
    this a positive feedback loop. appetites of a few billion beetles can change the
    world.


