  md: 'Heat rearranges the natural world and rewrites disease algorithms on our planet.
    It creates new opportunities for microbes, opening up fresh biological landscapes
    for them to explore, turning pathogens into microscopic versions of Ferdinand
    Magellan, expanding the boundaries of the known world. Heat waves, as well as
    heat-driven climate events like flooding and drought, have worsened more than
    half of the hundreds of known infectious diseases in people, including malaria,
    hantavirus, cholera, and anthrax.


