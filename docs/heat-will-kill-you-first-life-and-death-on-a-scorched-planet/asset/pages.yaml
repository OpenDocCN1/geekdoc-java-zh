  md: '# 2. HOW HEAT SHAPED US


    TO UNDERSTAND THE dangers of extreme heat today, it helps to understand how we
    have lived with heat in the past. Among other things, we evolved clever ways to
    manage the heating and cooling of our bodies that gave our ancestors an evolutionary
    edge over competitors. To tell you about it, though, I have to go way back, because
    you can''t separate heat from the beginning of things.


    Fourteen billion years ago, the universe was compressed into a stupendously hot,
    incredibly dense nugget, which then rapidly expanded. This nugget cooled as it
    swelled; its particles gradually slowed their frenied motion and aggregated into
    clumps, which over time formed stars, planets—and us.


    How exactly life emerged from the hot mess of the universe is only dimly understood.
    The most widely accepted theory is that life began around the volcanoes that rose
    above the ocean shortly after the earth formed, probably within the first hundred
    million years. The volcanoes were surrounded by hot geyser-fed ponds and bubbling
    hot springs, which were loaded with organic compounds from the asteroids and meteors
    that bombarded the planet. Volcanoes acted as chemical reactors, creating a hot
    soup. Somehow, RNA molecules grew, growing longer and more complex and folding
    into two proteins and double-stranded DNA. They formed microbes that floated in
    thick mats on the volcanic ponds. When the ponds dried out, winds picked up their
    spores and spread them for miles. Rains eventually washed microbes into the ocean.
    "Once they reached the sea," science author Carl Zimmer writes, "the whole planet
    came alive."


    Evolution’s next trick was developing a way for animals to deal with temperature
