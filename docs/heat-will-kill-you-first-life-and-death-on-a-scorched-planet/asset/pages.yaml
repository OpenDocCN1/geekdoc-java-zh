  md: '# # PROLOGUE: THE GOLDILOCKS ZONE


    WHEN HEAT COMES, it’s invisible. It doesn’t bend tree branches or blow hair across
    your face to let you know it’s arrived. The ground doesn’t shake. It just surrounds
    you and works in ways that you can’t anticipate or control. You sweat. Your heart
    races. You’re thirsty. Your vision blurs. The sun feels like the barrel of a gun
    pointed at you. Plants look like they’re crying. Birds vanish from the sky and
    take refuge in deep shade. Cars are untouchable. Colors fade. The air smells burned.
    You can imagine fire before you see it.


    In the summer of 2021, weathercasters in the Pacific Northwest warned people that
    a heat wave was on the way. Workers in Washington’s Yakima Valley were summoned
    to cherry orchards at 1 a.m. so the ripe fruit could be picked before it turned
    to mush. Air-conditioning contractors were deluge with calls. Fans sold out at
    Home Depot and Lowe’s. The Red Cross activated its heat alert network, blasting
    warnings to people to drink water and check on family and friends who lived alive.
    Libraries and churches set cooling centers for the homeless or anyone who needed
    refuge. In Portland, Chris Voss, the emergency management director for Multnomah
    County, decided to open the Oregon Convention Center, which was capable of providing
    a cool retreat for hundreds of people. “What’s coming is not just uncomfortable
    heat,” Jennifer Vines, the lead health officer for the region, advised Voss. “This
    is life-threatening heat.


    Nevertheless, the heat hit with a force that few people anticipated. The Pacific
    Northwest, after all, has long been seen as a climate refuge. It was the place
    you moved to if you wanted to live somewhere that was “safe” from climate change.
    There are beaches and lakes and stately trees and'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'volcanic soil where anything grows, from blueberries to boxwood to grapes that
    are crushed into world-class Pinot Noir. There are glaciers in the Cascades and
    lush temperate rainforests in Olympic National Park and more than a few fragments
    left of the Edenic paradise that pulled many settlers over the Oregon Trail. In
    the 1970s, Steve Jobs picked on a farm in the region and loved it so much he named
    a computer company after it. Heat wave? No big deal. This was not Phoenix, where
    heat owns the city. Or New Delhi, where heat is both a goddess and a demon. In
    the Pacific Northwest that summer, everyone might have known the heat was coming,
    but nobody thought it would be a searing, ghostly force that would melt asphalt
    and kill loved ones and force a new reckoning with the world they live in.


    The heat had been born over the Pacific a week or earlier. Atmospheric waves wobbled
    across the Northern Hemisphere, creating a high-pressure lift that allowed heat
    radiating from the ocean to gather beneath it. As this pile of heat drifted to
    the coast, it grew quickly in size and intensity (land reflects and amplifies
    heat more efficiently than water), creating what scientists called a heat home.
    In a twenty-four hour period, the temperature in downtown Portland jumped from
    76 degrees to 114 degrees, the hottest temperature in 147 years of observations.¹
    Suddenly, the ferry salamander-land of the Northwest felt like the hardbaked steel
    and sand of Dubai.


    Ice, nature''s most exquisite thermometer, registered the heat first. The last
    of the snow in the Cascades vanished from shaded hollows in the forests and atop
    the peaks. With the protective snowpack gone, the blue glacial ice itself began
    to melt, rushing down streambands and canyons in a swirl of silty grey water,
    carrying ancient sediment from before the fossil fuel age, before books, before
    the pyramids. The rush of meltwater flooded roads and towns as it rolled down
    to the rivers and out to the sea. the wash of sediment was so enormous that satellites
    circled the Earth several miles into the Pacific.


    In streams and rivers, migrating salmon immediately sensed the changes in water
    temperature. They had spent three or four years in the cold, salt Pacific and
    now were swimming in freshwater back to where they were born to lay eggs and begin
    the cycle anew. The salmon''s journey is'
