    In the past decade, scientists who study the movement of animals have found that
    the four thousand species they’d tracked, between 40 and 70 percent had altered
    their distribution. On average, terrestrial creatures are moving nearly twenty
    kilometers every decade. Marine creatures, who are largely free of barriers to
    seeking cooler waters, are moving four times faster than land-based animals. Some
    animals are making spectacular leaps. Scientists estimate that Atlantic cod are
    moving north at a rate of a hundred miles per decade. In the Andes, frogs and
    fungi have climbed hundred meters upward over the past seventy years. Even seemingly
    immobile wildlife are on the move. In Japan, several species of coral polyps,
    which form the branching thickets of coral reefs, were found by scientists to
    be traveling about two miles north every year.


    Plants are on the move too. In the eastern US, trees are shifting north and westward
    at an average rate of about two miles per decade. Speed and direction vary for
    different types of trees: the conifers are mostly heading north, while broad-leaf
    and flowering trees, such as oaks and birches, move west. Among the fastest travelers
    that scientists know of are white spruce, which are migrating at a rate of about
    sixty miles each decade.


    Some plants and animals are more adaptable than others. Sharks move from Florida
    to Maine, but mussels and urchins and starfish cannot quickly swim to cooler water.
    Polar bears need floating sea ice to hunt seals; without it, they starve. Bats
    are good at moving around and finding new habitats, as many birds are. But some
    are not.


    One example: Thick-billed murres and snowy buntings, both common Arctic birds,
    are well adapted to the frozen north. But as the Arctic heats up, their dark feathers
    draw the heat. Their body temperature can reach 115 degrees in the sun, even on
    a 75-degree day. It would like working out in the peak of summer while wearing
    an insulated jacket. And because they are already living in one of the coldest
    places on the planet, migration to a cooler climate is out of the question.


    Even animals that move freely have a rough time. Pacific salmon are cold-water
    species, adapted for mountain-fed, forested rivers and cool oceans and estuaries.
    Healthy water temperatures for salmon are under 58 degrees. Above 59 degrees,
    their bodies become stressed, making them easier targets for predators and at
    higher risk of disease. When water'
