  md: '# 3. HEAT ISLANDS


    ON A SCORCHING day in downtown Phoenix, when the temperature soars to 115 degrees
    or more, the sunshine assaults you, pushing you to seek cover. The air feels solid,
    a hazy, ozone-soaked curtain of heat. You feel radiating from the parking lot
    through your shoes. Metal bus stops on Van Buren Street become convection ovens.
    Flights are delayed at Sky Harbor International Airport because the planes can''t
    get enough lift in the warmer thin, hot air. At City Hall, where the entrance
    to the building is emblazoned with a giant metallic emblem of the sun, workers
    eat in the lobby rather than venture out to nearby restaurants. On the outskirts
    of the city, power lines sag and buzz, overloaded with electrons as the demand
    for air-conditioning soars and the entire grid is pushed to the max. In an Arizona
    heat wave, electricity is not a convenience. It is a tool for survival.


    Modern cities are empires of asphalt and concrete and steel, materials that absorb
    and amplify heat during the day, then radiate it at night. Air conditioners exhaust
    hot air, exacerbating the problem of urban heat buildup. Downtown Phoenix can
    be as much as twenty degrees hotter than the surrounding area. New York City averages
    two to five degrees warmer than its leafy suburbs during the day—and sometimes
    twenty warmer at night. This phenomenon, known to city planners and heat researchers
    as the urban heat island effect, is so pervasive that climate skeptics once claimed
    climate change is merely an illusion created by thousands of once-rural meteorological
    stations becoming surrounded by urban development (the argument, like most pushed
    by climate skeptics, have been thoroughly debunked).


    “For cities, the urban heat island effect has had far more impact on local temperatures
    than climate change itself,” said David Hondola, a scientist at Arizona State
    University and the director of heat response and mitigation'
