  \ 95 和 92。名字“George”存储在 `names` 数组的索引 `0` 处，在相同的索引处，`grades_lesson1` 和 `grades_lesson2`\
  \ 数组中也存储了他这两门课程的成绩。下一个学生（Anna）和她的成绩分别存储在 `names`、`grades_lesson1` 和 `grades_lesson2`\
  \ 数组的索引 `1` 处，依此类推。\n\nJava 程序如下。\n\n![](img/00001.gif)\n\n```java\nClass_33_4_1\n\
  static final int STUDENTS = 20;\npublic static void main(String[] args) {\n    int\
  \ i, total;\n    double average;\n    String[] names = new String[STUDENTS];\n \
  \   int[] grades_lesson1 = new int[STUDENTS];\n    int[] grades_lesson2 = new int[STUDENTS];\n\
