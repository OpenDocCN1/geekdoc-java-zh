  48. 描述 Eclipse IDE 如何帮助你发现逻辑错误。\n\n# 第 3 节：顺序控制结构\n\n## 第 10 章：顺序控制结构导论\n\n### 10.1\
  \ 什么是顺序控制结构？\n\n顺序控制结构是指语句的逐行执行，即语句按照它们在程序中出现的顺序顺序执行，而不跳过其中任何一个。例如，它们可以执行一系列读取或写入操作、算术运算或对变量进行赋值。\n\
  \n以下程序展示了顺序执行的 Java 语句示例。\n\n![](img/00001.gif)\n\n```java\nClass_10_1\npublic static\
  \ void main(String[] args) {\n    double num, result;\n    // Prompt the user to\
  \ enter value for num\n    System.out.print(\"Enter a number: \");\n    num = Double.parseDouble(cin.nextLine());\n\
  \    //Calculate the square of num\n    result = num * num;\n    // Display the\
  \ result on user's screen\n    System.out.println(\"The square of \" + num + \"\
  \ is \" + result);\n}\n```\n\n![](img/00002.jpeg) 顺序控制结构是你在 4.11 节中学学的三个基本控制结构中最简单的。另外两种结构是“选择结构”和“循环结构”。计算机编程中的所有问题都可以仅用这三个结构解决！\n\
  \n![](img/00003.jpeg) 在 Java 中，你可以使用双斜杠（`//`）添加注释。注释是给人类读者的。编译器和解释器会忽略它们。\n\n####\
  \ 练习 10.1-1：计算矩形的面积\n\n编写一个 Java 程序，提示用户输入矩形的底边和高度，然后计算并显示其面积。\n\n#### 答案\n\n你可能在学校里已经知道可以使用以下公式计算矩形的面积：\n\
  \n`Area = Base × Height`\n\n在 4.6 节中，你学习了创建算法涉及三个三个阶段：数据输入、数据处理和结果输出。\n\n在练习中，这三个主要阶段如下：\n\
  \n- **数据输入**：用户必须输入 `Base` 和 `Height` 的值\n- **数据处理**：程序必须计算矩形的面积\n- **结果输出**：程序必须显示上一个阶段计算出的矩形面积\n\
  \n该问题的解决方案所示。\n\n![](img/00001.gif)\n\n```java\nClass_10_1\npublic static void main(String[]\
  \ args) {\n    double num, result;\n    // Prompt the user to enter value for num\n\
  \    System.out.print(\"Enter a number: \");\n    num = Double.parseDouble(cin.nextLine());\n\
  \    //Calculate the square of num\n    result = num * num;\n    // Display the\
  \ result on user's screen\n    System.out.println(\"The square of \" + num + \"\
  \ is \" + result);\n}\n```\n\n#### 练习 10.1-2：计算圆的面积\n\n编写一个 Java 程序，计算并显示圆的面积。\n\
  \n#### 答案\n\n你可以使用以下公式计算圆的面积：\n\n`Area = π · Radius²`\n\n`π` 的值是已知的 `3.14159`。因此，用户必须输入的是\
  \ `Radius`。\n\n在练习中，你在 4.6 节中学学的三个主要阶段如下：\n\n- **数据输入**：用户必须输入 `Radius` 的值\n- **数据处理**：程序必须计算圆的面积\n\
  - **结果输出**：程序必须显示上一个阶段计算出的面积\n\n该问题的解决方案所示。\n\n![](img/00001.gif)\n\n```java\nClass_10_2\n\
  public static void main(String[] args) {\n    double area, radius;\n    // Prompt\
  \ the user to enter value for num\n    System.out.print(\"Enter a number: \");\n\
  \    radius = Double.parseDouble(cin.nextLine());\n    //Calculate the square of\
  \ num\n    area = 3.14159 * radius * radius;\n    // Display the result on user's\
  \ screen\n    System.out.println(\"The square of \" + num + \" is \" + result);\n\
  }\n```\n\n更好的方法是使用常量 `PI`。\n\n![](img/00001.gif)\n\n```java\nClass_10_2\nstatic\
  \ final double PI = 3.14159;\npublic static void main(String[] args) {\n    double\
  \ area, radius;\n    // Prompt the user to enter value for num\n    System.out.print(\"\
  Enter a number: \");\n    radius = Double.parseDouble(cin.nextLine());\n    //Calculate\
  \ the square of num\n    area = PI * radius * radius;\n    // Display the result\
  \ on user's screen\n    System.out.println(\"The square of \" + num + \" is \" +\
  \ result);\n}\n```\n\n![](img/00002.jpeg) 注意常量 `PI` 是在 `main` 方法之外声明的。\n\n#### 练习\
  \ 10.1-3：计算油耗\n\n在美国，汽车的油耗以每加仑英里（即 `MPG`）衡量。汽车的 `MPG` 可以使用以下公式计算：\n\n![Image](img/0106.gif)\n\
  \n编写一个 Java 程序，提示用户输入总行驶英数和消耗的加仑数。然后程序必须计算并显示汽车的 `MPG`。\n\n#### 答案\n\n这是一个非常简单的案例。用户输入总行驶英数和消耗的加仑数，然后程序必须计算并显示汽车的\
  \ `MPG`。\n\n\n\n\n\n![](img/00001.gif)\n```java\nClass_10_1_3\npublic static void\
  \ main(String[] args) {\n    double gallons, miles_driven, mpg;\n    System.out.print(\"\
  Enter miles driven: \");\n    miles_driven = Double.parseDouble(cin.nextLine());\n\
  \    System.out.print(\"Enter gallons of gas used: \");\n    gallons = Double.parseDouble(cin.nextLine());\n\
  \    mpg = miles_driven / gallons;\n    System.out.println(\"Your car's MPG is:\
  \ \" + mpg);\n}\n```\n\n#### 练习 10.1-4 汽车在哪里？计算行驶距离\n\n汽车从静止开始，沿直直水平道路以恒定加速度运动给定的时间。编写一个\
  \ Java 程序，提示用户输入加速度和汽车行驶的时间，然后计算并显示行驶的距离。所需的公式是\n\n![Image](img/00107.gif)\n\n其中\n\
  \n\n\n- ►`S` 是汽车行驶的距离，单位为米 (m)\n- ►`u[0]` 是汽车的初速度（速度），单位为米/秒 (m/sec)\n- ►`t` 是汽车行驶的时间，单位为秒\
  \ (sec)\n- ►`a` 是加速度，单位为米/秒² (m/sec²)\n\n#### 解决方案\n\n由于汽车从静止开始，初速度（速度）`u[0]` 为零。因此，公式变为\n\
  \n![Image](img/00108.gif)\n\n对应的 Java 程序如下：\n\n```java\n![](img/00001.gif) \nClass_10_1_4\n\
  public static void main(String[] args) {\n    double S, a, t;\n    System.out.print(\"\
  Enter acceleration: \");\n    a = Double.parseDouble(cin.nextLine());\n    System.out.print(\"\
  Enter time traveled: \");\n    t = Double.parseDouble(cin.nextLine());\n    S =\
  \ 0.5 * a * t * t;\n    System.out.println(\"Your car traveled \" + S + \" meters\"\
  );\n}\n```\n\n#### 练习 10.1-5 华氏度转开文\n\n编写一个 Java 程序，将温度值从华氏度转换为等值的开文度。所需的公式是\n\n\
  `1.8 × Kelvin = Fahrenheit + 459.67`\n\n#### 解决方案\n\n给出的公式不能直接在你的程序中使用。在 Java 这样的计算机语言中，不允许写成\n\
  \n`1.8 * kelvin = fahrenheit + 459.67;`\n\n![](img/00003.jpeg)\n在 `( )` 符号左侧的位置，必须存在一个变量。该变量实际上是\
  \ RAM 中一个可以存储数值的区域。\n\n该程序将华氏度转换为开文度。华氏度值是已知值并由用户提供，而开文度值是 Java 程序必须计算得出的值。因此，你需要解出开文度。经过处理后，公式变为\n\
  \n![Image](img/00109.gif)\n\n对应的 Java 程序所示此处。\n\n```java\n![](img/00001.gif) \n\
  Class_10_1_5\npublic static void main(String[] args) {\n    double fahrenheit, kelvin;\n\
  \    System.out.print(\"Enter a temperature in Fahrenheit: \");\n    fahrenheit\
  \ = Double.parseDouble(cin.nextLine());\n    kelvin = (fahrenheit + 459.67) / 1.8;\n\
  \    System.out.println(\"The temperature in Kelvin is \" + kelvin);\n}\n```\n\n\
  #### 练习 10.1-6 计算销售税\n\n员工需要一个程序来输入产品的税前价格并计算其最终价格。假设增值税（`VAT`）为 `19%`。\n\n####\
