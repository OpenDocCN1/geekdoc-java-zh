  Would you like to repeat? \");\n        answer = cin.nextLine();\n    } while (answer.toUpperCase().equals(\"\
  YES\"));\n}\n```\n\n#### 练习 30.4-2 寻找 x 和 y\n\n编写一个 Java 程序，在 -20 到 +20 范围内显示所有满足公式\
