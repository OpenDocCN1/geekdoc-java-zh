  \ 显而易见，这个问题有很多解决方案。找到最优的取决于你。\n\n#### 练习 23.4-5 阶梯电价与用电量\n\n电力公司根据下表（月费）向订阅者收取用电费。假设包含了传输和分配等费用。\n\
  \n| 千瓦时 (kWh) | 每 kWh 价格 |\n| --- | --- |\n| ≤ 500 | $0.10 |\n| 501 ≤ kWh ≤ 2000\
