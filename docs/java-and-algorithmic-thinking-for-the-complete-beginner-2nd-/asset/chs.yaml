  \n关于一个穷人发明国际象棋的传说。印度国王对这个新游戏非常满意，提议给那个穷人他想要的任何东西。那个贫穷但聪明的人告诉国王，他想要棋盘第一个格子放一粒米，第二个格子放两粒，第三个放四粒，以此类推，棋盘上\
  \ 64 个格子的每个格子数量都翻倍。国王认为这是一个非常谦虚的要求，于是命令仆人去拿米过来。\n\n编写一个 Java 程序，计算并显示国际棋盘上最后有多少粒米，以及多少磅米。假设一磅米大约包含\
  \ 30,000 粒米。\n\n#### 解决方案\n\n假设国际棋盘只有 2 × 2 = 4 个格子，并且变量 `grains` 赋初始值 1（这是第 1 个格子的米数）。一个循环三次的\
  \ `for-loop` 可以在每次迭代中将变量 `grains` 的值翻倍，如下代码片段所示。\n\n```java\ngrains = 1;\nfor (i\
  \ = 2; i <= 4; i++) {\n    grains = 2 * grains;\n}\n```\n\n变量 `grains` 在每次迭代结束时的值如表所示。\n\
  \n| 迭代 | grains 的值 |\n| --- | --- |\n| 第 1 次 | 2 × 1 = 2 |\n| 第 2 次 | 2 × 2 = 4\
  \ |\n| 第 3 次 | 2 × 4 = 8 |\n\n在第 3 次迭代结束，变量 `grains` 的值为 8。这个值并不是棋盘上的米总数，而是第 4 个格子的米数。如果你需要找到棋盘上的米总数，可以把所有格子的米相加，即\
  \ 1 + 2 + 4 + 8 = 15。\n\n在现实世界中，真正的国际棋盘包含 8 × 8 = 64 个格子，因此你需要迭代 63 次。Java 程序如下。\n\
  \n![](img/00001.gif)\n```java\nClass_30_6_2\npublic static void main(String[] args)\
  \ {\n    int i;\n    double grains, total, weight;\n    grains = 1;\n    total =\
  \ 1;\n    for (i = 2; i <= 64; i++) {\n        grains = 2 * grains;\n        total\
  \ = total + grains;\n    }\n    weight = total / 30000;\n    System.out.println(total\
  \ + \"  \" + weight);\n}\n```\n\n如果你在好奇这些数字有多大，这里是答案：棋盘上将有 18,446,744,073,709,551,615\
  \ 粒米；也就是说，614,891,469,123,651.8 磅！\n\n## 练习 30.6-3 仅仅是民意\n\n一家民意调查公司询问 1000 名市民他们早上是否吃早餐。编写一个\
