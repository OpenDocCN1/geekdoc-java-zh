  18. 什么年份被认为是闰年？\n19. 什么是回文数？\n\n# 第 5 节：循环控制结构\n\n## 第 24 章：循环控制结构简介\n\n### 24.1\
  \ 什么是循环控制结构？\n\n循环控制结构是一种允许多次执行某个语句或一组语句，直到满足特定条件所需的控制结构。\n\n### 24.2 从顺序控制到循环控制结构\n\
  \n下一个示例允许用户输入四个数字，然后计算并显示它们的和。如你所见，这里还没有循环控制结构，只有你熟悉的顺序控制结构。\n\n```java\npublic\
  \ static void main(String[] args) {double x, y, z, w, total;x = Double.parseDouble(cin.nextLine());y\
  \ = Double.parseDouble(cin.nextLine());z = Double.parseDouble(cin.nextLine());w\
  \ = Double.parseDouble(cin.nextLine());total = x + y + z + w;System.out.println(total);}\n\
  ```\n\n这个程序非常短。然而，想象一个允许用户输入 1000 个数字而不是 4 个的程序！你能想象写 1000 次 `Double.parseDouble(cin.nextLine())`\
  \ 语句吗？如果你只需要写一次这个语句，但“告诉”计算机执行 1000 次，不是会简单得多吗？当然是！但你需要一个循环控制结构！\n\n让我们先尝试解决一个谜题吧！在暂不使用循环结构的情况下，尝试只用两个变量\
  \ `x` 和 `total` 来重写之前的程序。是的，你听没错！这个程序必须计算并显示四个给定数字的和，但必须只用两个变量完成！你能找到方法吗？\n\n嗯……你现在的想法显而易见：“我用两个变量能做的唯一就是在变量\
  \ `x` 中读取一个值，然后将该值赋值给 `total`”。你的想法非常正确，这里展示了这一点。\n\n```java\nx = Double.parseDouble(cin.nextLine());\n\
  total = x;\n```\n\n这等价于：\n\n```java\ntotal = 0;\nx = Double.parseDouble(cin.nextLine());\n\
  total = total + x;\n```\n\n现在呢？现在，你实际上可以做三件事，那就是：思考、思考，当然还有思考！\n\n第一个数字已经存储在变量 `total`\
  \ 中，所以变量 `x` 现在可以进一步使用了！因此，你可以复用变量 `x` 来读取第二个值，该值也会累加到变量 `total` 中，如下：\n\n```java\n\
  total = 0;\nx = Double.parseDouble(cin.nextLine());\ntotal = total + x;\nx = Double.parseDouble(cin.nextLine());\n\
  total = total + x;\n```\n\n![](img/00002.jpeg)语句 `total = total + x` 将 `x` 的值累加到\
  \ `total` 中，这意味着它将 `x` 的值加到 `total` 原有的任何旧值上。例如，如果变量 `total` 包含值 5，变量 `x` 包含值 3，则语句\
  \ `total = total + x` 将将值 8 赋值给变量 `total`。\n\n由于第二个数字已经累加在变量 `total` 中，变量 `x` 可以被重用！这个过程可以一次又一次，直到四个数字都被读取并累加到变量\
  \ `total` 中。最终的 Java 程序如下。请注意，这个程序还没有使用任何循环控制结构！\n\n```java\ntotal = 0;\nx = Double.parseDouble(cin.nextLine());\n\
  total = total + x;\nx = Double.parseDouble(cin.nextLine());\ntotal = total + x;\n\
  x = Double.parseDouble(cin.nextLine());\ntotal = total + x;\nx = Double.parseDouble(cin.nextLine());\n\
  total = total + x;\nSystem.out.println(total);\n```\n\n![](img/00002.jpeg)这个程序和最初的程序被认为是等价。然而，它们之间的主要区别在于，后者有四对相同的语句。\n\
  \n当然，你可以使用这个示例来读取并找到四个以上数字的和。然而，你不能反复编写那对语句，因为很快你就会发现这有多痛苦。此外，如果你忘记写至少一对语句，最终会导致结果错误。\n\
  \n你在这里真正需要的是只保留这些语句中的一对，但使用循环控制结构来执行四次（或者如果你愿意，执行 1000 次）。你可以使用类似下面的代码片段。\n\n```java\n\
  total = 0;\nexecute_these_statements_4_times {\n    x = Double.parseDouble(cin.nextLine());\n\
  \    total = total + x;\n}\nSystem.out.println(total);\n```\n\n显然，Java 中没有任何 `execute_these_statements_4_times`\
  \ 语句。这仅用于演示，但很快你就会学习关于 Java 支持的所有循环控制结构的所有知识了！\n\n### 24.3 复习题：判断题\n\n对以下每个陈述判断对（true）或错（false）。\n\
  \n1. 循环控制结构是一种允许多次执行某个语句或一组语句，直到满足特定条件的结构。\n2. 可以使用顺序控制结构提示用户输入 1000 个数字然后计算它们的和。\n\
  3. 下面代码片段 `total = 10; a = 0; total = total + a;` 在变量 `total` 中累加了值 10。\n4. 下面 Java\
  \ 程序 `public static void main(String[] args) {int a, total;a = 5;total = total +\
  \ a;System.out.println(total);}` 满足确定性（definiteness）属性。\n5. 下面两个代码片段被认为是等价的：`a =\
  \ 5; total = a;` 和 `total = 0; a = 5; total = total + a;`。\n\n## 第 25 章：前测试、中间和后测试循环结构\n\
  \n### 25.1 前测试循环结构\n\n前测试循环结构所示如下方的流程图。\n\n![Image](img/00242.gif)\n\n![](img/00002.jpeg)决策符号（菱形）既用于决策控制结构，也用于循环控制结构。然而，在循环控制结构中，菱形的出口之一始终有一个向上的方向。\n\
  \n让我们看看当执行流到达一个前测试循环结构时会发生什么。如果 `Boolean_Expression` 求值为真，则执行该结构的语句或语句块，然后执行流返回再次检查\
  \ `Boolean_Expression`。如果 `Boolean_Expression` 再次求值为真，则重复该过程。当 `Boolean_Expression`\
  \ 在某处求值为假时，迭代停止，执行流退出循环。\n\n![](img/00002.jpeg)“前测试循环结构”之所以这样命名，是因为首先求值布尔表达式，然后执行该结构的语句或语句块。\n\
  \n![](img/00002.jpeg)因为布尔表达式是在进入循环之前求值的，所以前测试循环可能执行从零次到多次迭代。\n\n\n\n\n\n![](img/00002.jpeg)每当循环控制结构的语句或语句块被执行一次时，计算机科学中使用的术语是“循环正在迭代”或“循环执行了一次迭代”。\n\
  \nJava 语句的通用形式为：\n\n```java\nwhile (Boolean_Expression) {A statement or block of\
  \ statements}\n```\n\n示例显示了数字 1 到 10。\n\n![](img/00001.gif)\n```java\nClass_25_1\n\
  public static void main(String[] args) {\n    int i;\n    i = 1;\n    while (i <=\
  \ 10) {\n        System.out.println(i);\n        i++;\n    }\n}\n```\n\n![](img/00002.jpeg)就像决策控制结构一样，循环控制结构内部的语句应该缩进。\n\
  \n当只需要一个单独语句作为 `while` 语句的一部分时，允许省略大括号 `{ }`。因此，`while` 语句变为：\n\n```java\nwhile\
  \ (Boolean_Expression) One_Single_Statement;\n```\n\n![](img/00003.jpeg)许多程序员倾向于始终使用大括号，即使\
  \ `while` 语句仅包含一个语句。\n\n#### 练习 25.1-1 设计流程图并计算迭代总数\n\n为以下代码段设计相应的流程图。这段 Java 代码执行了多少次迭代？\n\
  \n```java\nint i;\ni = 4;\nwhile (i > 0) {\n    i--;\n}\nSystem.out.println(\"The\
  \ end\");\n```\n\n#### 答案\n\n相应的流程图片段如下。\n\n![Image](img/00243.gif)\n\n接下来，跟踪表可以帮助你观察执行流。\n\
  \n| 步骤 | 语句 | 注释 | i | | |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 1 | `i\
  \ = 4` | | 4 | | |\n| 2 | `while (i > 0)` | 结果为真 | 1^(st) | 迭代 | |\n| 3 | `i--`\
  \ | | 3 | | |\n| 4 | `while (i > 0)` | 结果为真 | 2^(nd) | 迭代 | |\n| 5 | `i--` | | 2\
  \ | | |\n| 6 | `while (i > 0)` | 结果为真 | 3^(rd) | 迭代 | |\n| 7 | `i--` | | 1 | | |\n\
  | 8 | `while (i > 0)` | 结果为真 | 4^(th) | 迭代 | |\n| 9 | `i--` | | 0 | | |\n| 10 |\
  \ `while (i > 0)` | 结果为假 | | | |\n| 11 | `.println(\"The end\")` | 显示：The end |\
  \ | | |\n\n从跟踪表中可以看出，迭代的总数为四次。\n\n现在，让我们得出一些结论吧！\n\n- 如果你想找到迭代的总数，你需要计算该结构中的语句或语句块执行的次数，而不是布尔表达式被求值的次数。\n\
  - 在预测试循环结构中，当结构中的语句或语句块执行了 N 次时，布尔表达式求值了 N+1 次。\n\n#### 练习 25.1-2 计算迭代总数\n\n该代码段执行了多少次迭代？\n\
  \n```java\nint i;\ni = 4;\nwhile (i >= 0) {\n    i--;\n}\nSystem.out.println(\"\
  The end\");\n```\n\n#### 答案\n\n这个练习与上一个几乎相同。唯一的区别是这里的布尔表达式在 `i = 0` 时仍然为真。因此，它又多执行了一次迭代，即五次迭代。\n\
  \n#### 练习 25.1-3 设计流程图并计算迭代总数\n\n该代码段执行了多少次迭代？\n\n```java\nint i;\ni = 1;\nwhile\
  \ (i != 6) {\n    i += 2;\n}\nSystem.out.println(\"The end\");\n```\n\n#### 答案\n\
  \n让我们创建一个跟踪表来观察执行流。\n\n| 步骤 | 语句 | 注释 | i | | |\n| :--- | :--- | :--- | :--- | :---\
  \ | :--- |\n| 1 | `i = 1` | | 1 | | |\n| 2 | `while (i != 6)` | 结果为真 | 1^(st) |\
  \ 迭代 | |\n| 3 | `i += 2` | | 3 | | |\n| 4 | `while (i != 6)` | 结果为真 | 2^(nd) | 迭代\
  \ | |\n| 5 | `i += 2` | | 5 | | |\n| 6 | `while (i != 6)` | 结果为真 | 3^(rd) | 迭代 |\
  \ |\n| 7 | `i += 2` | | 7 | | |\n| 8 | `while (i != 6)` | 结果为真 | ... | ... | |\n\
  | 9 | … | … | | | |\n\n从跟踪表中可以看出，由于值 6 从未被赋值给变量 `i`，这个程序将无限次迭代下去！显然，这个程序不满足有限性属性。\n\
  \n#### 练习 25.1-4 计算迭代总数\n\n该代码段执行了多少次迭代？\n\n```java\nint i;\ni = -10;\nwhile (i\
  \ > 0) {\n    i--;\n}\nSystem.out.println(\"The end\");\n```\n\n#### 答案\n\n初始时，值\
  \ −10 被赋值给变量 `i`。布尔表达式直接求值为假，执行流直接跳转到 `System.out.println(\"The end\")` 语句。因此，该程序执行了零次迭代。\n\
  \n#### 练习 25.1-5 计算迭代次数\n\n使用预测试循环编写一个 Java 程序，让用户输入四个数字，然后计算并显示它们的和。\n\n#### 答案\n\
  \n程序在循环内部必须做的是检查迭代次数。当完成了所需的迭代次数后，循环必须退出。\n\n迭代的总数取决于用户必须输入的值。以下是一个通用的代码段，它按用户指定的次数进行迭代。\n\
  \n```java\ni = 1;\nwhile (i <= number_of_iterations) {\n    i++;\n}\n```\n\n变量 `i`\
  \ 的名称可以是你喜欢的任何。根据你目前学的内容，最终程序变为：\n\n```java\nClass_25_1_5\npublic static void main(String[]\
  \ args) {\n    double x, total;\n    int i;\n    total = 0;\n    i = 1;\n    while\
  \ (i <= 4) {\n        x = Double.parseDouble(cin.nextLine());\n        total +=\
  \ x;\n    }\n    System.out.println(total);\n}\n```\n\n#### 练习 25.1-6 计算迭代总数\n\n\
  设计流程图并编写相应的 Java 程序，让用户输入整数，然后显示奇数的和。\n\n#### 答案\n\n程序在循环内部必须做的是检查给定数字是否为奇数，如果是，则将其累加到变量\
  \ `total` 中；偶数被忽略。流程图所示。它包含一个嵌套在预测试循环中的单分支决策结构。\n\n![Image](img/044.gif)\n\n相应的\
  \ Java 程序如下。\n\n```java\nClass_25_1_6\npublic static void main(String[] args) {\n\
  \    int total, i, x;\n    total = 0;\n    i = 1;\n    while (i <= 20) {\n     \
  \   x = Integer.parseInt(cin.nextLine());\n        if (x % 2 != 0) {\n         \
  \   total += x;\n        }\n        i++;\n    }\n    System.out.println(total);\n\
  }\n```\n\n只要保持语法和逻辑正确，你可以将任何决策控制结构嵌套在任何循环控制结构中。\n\n#### 练习 25.1-7 求 N 个数的和\n\n编写一个\
  \ Java 程序，让用户输入 N 个数字，然后计算并显示它们的和。N 的值必须在程序开始由用户给出。\n\n#### 答案\n\n在这个练习中，迭代次数取决于用户必须输入的值。以下是一个通用的代码段，它根据用户提供的迭代\
  \ N 次。\n\n```java\nn = Integer.parseInt(cin.nextLine());\ni = 1;\nwhile (i <= n)\
  \ {\n    i++;\n}\n```\n\n根据你目前学的内容，最终程序变为：\n\n```java\nClass_25_1_7\npublic static\
  \ void main(String[] args) {\n    int n, i;\n    double x, total;\n    total = 0;\n\
  \    n = Integer.parseInt(cin.nextLine());\n    i = 1;\n    while (i <= n) {\n \
  \       x = Double.parseDouble(cin.nextLine());\n        total += x;\n    }\n  \
  \  System.out.println(total);\n}\n```\n\n#### 练习 25.1-8 求未知数量数字的和\n\n\n\n\n\n编写一个\
  \ Java 程序，允许用户重复输入整数值，直到输入值 `-1` 为止。当数据输入完成后，必须显示所有输入数字的总和（`-1` 的值不能包含在最终总和中）。接下来，创建一个跟踪表，使用\
  \ `10`、`20`、`5` 和 `-1` 作为输入值检查检查程序运行运行正常。\n\n#### 解决方案\n\n在本练习中，总迭代次数是未知的。如果你使用判断控制结构，你的程序将类似于下面的代码片段。\n\
  \n```java\ntotal = 0;x = Integer.parseInt(cin.nextLine());if (x != -1) { //检查变量\
  \ x\n    total += x; //并执行此语句\n    x = Integer.parseInt(cin.nextLine()); //并执行此语句\n\
  \    if (x != -1) { //检查变量 x\n        total += x;\n        x = Integer.parseInt(cin.nextLine());\
  \ //并执行此语句\n        if (x != -1) { //检查变量 x\n            total += x;\n         \
  \   x = Integer.parseInt(cin.nextLine()); //并执行此语句\n            // ...\n       \
  \ }\n    }\n}\nSystem.out.println(total);\n```\n\n现在让我们用循环控制结构来重写这个程序。最终程序如下所示。如果你尝试跟踪执行流，你会发现它的运行效果与上一个等效。\n\
  \n```java\nClass_25_1_8\npublic static void main(String[] args) {\ndouble total,\
  \ x;\ntotal = 0;\nx = Integer.parseInt(cin.nextLine());\nwhile (x != -1) { //检查变量\
  \ x\n    total += x; //并执行此语句\n    x = Integer.parseInt(cin.nextLine()); //并执行此语句\n\
  }\nSystem.out.println(total);\n}\n```\n\n现在让我们创建一个跟踪表，使用 `10`、`20`、`5` 和 `-1` 作为输入值确定此程序是否运行正常。\n\
  \n| 步骤 | 语句 | 备注 | x | total |\n| --- | --- | --- | --- | --- |\n| 1 | `total =\
  \ 0` | | ? | 0 |\n| 2 | `x = Integer.parseInt(…)` | | 10 | 0 |\n| 3 | `while (x\
  \ != -1)` | 结果为 true | | |\n| 4 | `total += x` | | 10 | 10 |\n| 5 | `x = Integer.parseInt(…)`\
  \ | | 20 | 10 |\n| 6 | `while (x != -1)` | 结果为 true | | |\n| 7 | `total += x` |\
  \ | 20 | 30 |\n| 8 | `x = Integer.parseInt(…)` | | 5 | 30 |\n| 9 | `while (x !=\
  \ -1)` | 结果为 true | | |\n| 10 | `total += x` | | 5 | 35 |\n| 11 | `x = Integer.parseInt(…)`\
  \ | | -1 | 35 |\n| 12 | `while (x != -1)` | 结果为 false | | |\n| 13 | `.println(total)`\
  \ | 显示: 35 | | |\n\n正如你所见，最后变量 `total` 包含值 `35`，这确实是值 `10 + 20 + 5` 的和。此外，最后给出的值\
  \ `-1` 没有参与最终总和。\n\n如果在循环开始迭代之前已知迭代次数，则循环通常被称为“确定循环”。在本练习中，迭代次数在循环开始迭代之前是未知的，它取决于某个条件。这种循环通常被称为“不确定循环”。\n\
  \n## 练习 25.1-9 求 20 个数的乘积\n\n编写一个 Java 程序，允许用户输入 20 个数，然后计算并显示它们的乘积。\n\n#### 解决方案\n\
  \n如果你使用顺序控制结构，它将类似于下一个代码片段。\n\n```java\np = 1;x = Double.parseDouble(cin.nextLine());\n\
  p = p * x;x = Double.parseDouble(cin.nextLine());\np = p * x;x = Double.parseDouble(cin.nextLine());\n\
  p = p * x;……x = Double.parseDouble(cin.nextLine());\np = p * x;\n```\n\n注意变量 `p`\
  \ 被初始化为 `1` 而不是 `0`。为了让语句 `p = p * x` 正常运行，这是必要的；否则最终乘积将为零。\n\n利用之前练习的知识，最终程序变为：\n\
  \n```java\nClass_25_1_9\npublic static void main(String[] args) {\ndouble p, x;\n\
  int i;\np = 1;\nwhile (i < 20) {\n    x = Double.parseDouble(cin.nextLine());\n\
  \    p = p * x;\n    i++;\n}\nSystem.out.println(p);\n}\n```\n\n### 25.2 后测试结构\n\
  \n后测试结构在下面的流程图中。\n\n后测试循环在执行结构的语句或语句块时，会返回到语句上方的点。`BooleanExpression` 在某处求值为 false\
  \ 时，循环退出。\n\n在后测试循环中，当结构的语句或语句块执行 N 次时，`BooleanExpression` 也会被求值 N 次。\n\n`do-while`\
  \ 的通用形式为：\n\n```java\ndo {\n    statement\n} while (BooleanExpression);\n```\n\n\
  注意，当只有一个语句需要作为 do-while 语句的一部分时，允许省略大括号 `{}`。因此，do-while 语句变为 `do statement; while\
  \ (BooleanExpression);`。\n\n## 练习 25.2-1 设计流程图并统计迭代总数\n\n为以下代码设计相应的流程图。这段代码执行了多少次迭代？\n\
  \n```java\nint i;i = 3;\ndo {\n    i--;\n} while (i > 0);\nSystem.out.println(\"\
  The end\");\n```\n\n#### 解决方案\n\n相应的流程图如下。\n\n现在，让我们创建一个跟踪表来观察执行流。\n\n| 步骤 | 语句\
  \ | 备注 | i | |\n| --- | --- | --- | --- | --- |\n| 1 | `i = 3` | | 3 | |\n| 2 |\
  \ `i--` | | 2 | 第 1 次 |\n| 3 | `while (i > 0)` | | | |\n| 4 | `i--` | | 1 | 第 2\
  \ 次 |\n| 5 | `while (i > 0)` | | | |\n| 6 | `i--` | | 0 | 第 3 次 |\n| 7 | `while\
  \ (i > 0)` | | | |\n| 8 | `.println(\"The end\")` | | | |\n\n正如从跟踪表所示，总迭代次数为三次。\n\
  \n现在，让我们得出一些结论！\n\n- 如果你必须找到迭代总数，你可以计算结构语句或语句块执行的次数，也可以计算 `BooleanExpression` 求值的次数，因为这两个数字是相。\n\
  - 在后测试循环结构中，当结构的语句或语句块执行 N 次时，`BooleanExpression` 也会被求值 N 次。\n\n## 练习 25.2-2 统计迭代总数\n\
  \n这段代码片段执行了多少次迭代？\n\n```java\nint i;i = 3;\ndo {\n    i--;\n} while (i >= 0);\n\
  System.out.println(\"The end\");\n```\n\n#### 解决方案\n\n这个练习与上一个几乎相同。区别在于这里的布尔表达式\
  \ `i >= 0` 在 `i = 0` 时仍然为真。因此，它多执行了一次迭代，即四次迭代。\n\n## 练习 25.2-3 设计流程图并统计迭代总数\n\n\n\
  \n\n为以下代码段设计相应的流程图。这段代码执行了多少次迭代？如果将后测试循环切换为测试循环结构，会发生什么？\n\n```java\nint i;i = -1;do\
  \ {\n    i--;\n    System.out.println(\"Hello there!\");\n} while (i > 0);\nSystem.out.println(\"\
  The end\");\n```\n\n#### 解决方案\n\n相应的流程图片段如下。\n\n![Image](img/00247.gif)\n\n最初将值\
  \ $-1$ 赋值给变量 `i`。在循环内部，变量 `i` 减 1（赋值为 $-2$）并显示消息“Hello there!”。布尔表达式 `i > 0` 结果为假，执行流向右进入写入操作（`\"\
  The end\"`）。因此，该算法和相应的 Java 代码段执行了次迭代！\n\n现在，在接下来的流程图中，让我们看看将后测试循环切换为测试循环结构会发生什么。\n\
  \n![Image](img/00248.gif)\n\n将值 $-1$ 赋值给变量 `i`。布尔表达式 `i > 0` 结果为假，执行流直接进入写入操作（`\"\
  The end\"`）。因此，该算法执行了 0 次迭代！\n\n![](img/00002.jpeg)\n测试循环结构可能执行 0 次迭代，而后测试循环结构至少执行一次迭代！\n\
  \n#### 练习题 25.2-4 统计总迭代次数\n\n这段代码段执行了多少次迭代？\n\n```java\nint i;i = 1;do {\n    i\
  \ = i + 2;\n} while (i != 4);\nSystem.out.println(\"The end\");\n```\n\n#### 解决方案\n\
  \n让我们创建一个追踪表来观察执行流。\n\n| 步骤 | 语句 | 注释 | i |\n| --- | --- | --- | --- |\n| 1 | `i\
  \ = 1` | | 1 |\n| 2 | `i = i + 2` | | 3 (第 1 次迭代) |\n| 3 | `while (i != 4)` | 此项结果为真\
  \ | |\n| 4 | `i = i + 2` | | 5 (第 2 次迭代) |\n| 5 | `while (i != 4)` | 此项结果为真 | |\n\
  | 6 | `i = i + 2` | | 7 (第 3 次迭代) |\n| 7 | `while (i != 4)` | 此项结果为真 | |\n| 8 |\
  \ … | … | ... |\n| 9 | … | … | |\n\n如从追踪表中所示，由于值 $4$ 从未被赋值给变量 `i`，该程序将进行无限次迭代！显然，该程序不符合有限性属性。\n\
  \n#### 练习题 25.2-5 寻找 N 个数字的乘积\n\n编写一个 Java 程序，让用户输入 $N$ 个数字，然后计算并显示它们的乘积。$N$ 的值必须在程序开始时由用户给出。如果将后测试循环结构切换为测试循环结构，会发生什么？对于所有可能的\
  \ $N$ 输入值，这两个程序的操作运行方式完全相同吗？\n\n#### 解决方案\n\n下面的两个程序都允许用户输入 $N$ 个数字，然后计算并显示它们的乘积。然而，左侧使用的是测试循环，而右侧使用的是后测试循环结构。如果你尝试执行它们并为\
  \ $N$ 输入任何大于零的值，两个程序的运行方式完全相同！\n\n![](img/00001.gif)\nClass_25_2_5a\n```java\npublic\
  \ static void main(String[] args){\n    int n, i;\n    double p, x;\n    n = Integer.parseInt(cin.nextLine());\n\
  \    p = 1;\n    i = 1;\n    while (i <= n) {\n        x = Double.parseDouble(cin.nextLine());\n\
  \        p = p * x;\n        i++;\n    }\n    System.out.println(p);\n}\n```\n![](img/00001.gif)\n\
  Class_25_2_5b\n```java\npublic static void main(String[] args){\n    int n, i;\n\
  \    double p, x;\n    n = Integer.parseInt(cin.nextLine());\n    p = 1;\n    i\
  \ = 1;\n    do {\n        x = Double.parseDouble(cin.nextLine());\n        p = p\
  \ * x;\n        i++;\n    } while (i <= n);\n    System.out.println(p);\n}\n```\n\
  \n然而，当用户为 $N$ 输入非正值时，这两个 Java 程序的运行方式不同。例如，如果输入值 $0$，左侧程序执行 0 次迭代，而右侧程序执行了 1 次迭代！\n\
  \n![](img/00003.jpeg)\n测试循环结构可能执行 0 次迭代，而后测试循环结构至少执行一次迭代！\n\n![](img/00002.jpeg)\n\
  显然，左侧程序（使用测试循环结构的程序）是解决此练习题的最佳选择。假设用户执行了程序但决定不输入任何值。他可以为 $N$ 输入值零，程序将不会询问任何其他值！\n\
  \n### 25.3 中测试循环结构\n\n中测试循环结构所示如下图所示。\n\n![Image](img/00249.gif)\n\n让我们看看执行流到达测试循环结构时会发生什么。（注：此处原文存在大量重复句子，已根据指令要求进行处理）\n\
  \n\n\n\n1. 先测试循环可能会执行零次迭代。\n2. 在流程图中，先测试循环结构中菱形符号的两个出口方向都是向上的。\n3. 先测试循环结构中的语句或语句块至少执行一次。\n\
  4. 当先测试循环的布尔表达式求值为 `true` 时，该循环停止迭代。\n5. 在先测试循环结构中，当结构的语句或语句块执行了 `N` 次时，布尔表达式被求值\
  \ `N - 1` 次。\n6. 后测试循环可能会执行零次迭代。\n7. 当后测试循环的布尔表达式求值为 `true` 时，该循环停止迭代。\n8. 在后测试循环结构中，当结构的语句或语句块执行了\
  \ `N` 次时，其布尔表达式同样被求值 `N` 次。\n9. 你不能在后测试循环结构内部嵌套判定控制结构。\n10. 在中间测试循环结构中，语句块 `1` 的执行次数与语句语句块\
  \ `2` 的执行次数相同。\n11. 在以下代码段中：\n```\nint i = 1;\nwhile (i <= 10)\nSystem.out.println(\"\
  Hello\");\ni++;\n```\n单词“Hello”显示了 10 次。\n\n12. 下一个 Java 程序：\n```java\npublic static\
  \ void main(String[] args) {\n    int i;\n    i = 1;\n    while (i != 10) {\n  \
  \      System.out.println(\"Hello\");\n        i += 2;\n    }\n}\n```\n不满足有限性属性。\n\
  \n13. 在以下代码段中：\n```java\nint i = 1;\ndo {\n    System.out.println(\"Hello\");\n\
  } while (i >= 10);\n```\n单词“Hello”显示了无限次。\n\n14. 下一个 Java 程序：\n```java\npublic static\
  \ void main(String[] args) {\n    int i;\n    do {\n        System.out.println(\"\
  Hello\");\n        i++;\n    } while (i <= 10);\n}\n```\n满足确定性属性。\n\n15. 在以下代码段中：\n\
  ```java\nint b;\ndouble a;\nb = Integer.parseInt(cin.nextLine());\ndo {\n    a =\
  \ 1 / (b – 1);\n    b++;\n} while (b <= 10);\n```\n不满足确定性属性。\n\n16. 在以下代码段中：\n```java\n\
  int i = 1;\nwhile (true) {\n    System.out.println(\"Zeus\");\n    if (i > 10) break;\n\
  \    i++;\n}\n```\n单词“Zeus”显示了 10 次。\n\n### 25.5 复习题：单选题\n\n为下列每个陈述选择正确答案。\n\n1.\
