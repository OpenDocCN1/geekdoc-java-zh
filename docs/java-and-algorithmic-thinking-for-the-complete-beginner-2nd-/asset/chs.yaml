  \ 程序，用于找到并显示二次方程 $ax² + bx + c = 0$ 的根。\n\n#### 解法\n\n在方程 $ax² + bx + c = 0$ 中，系数\
  \ $a$、$b$ 和 $c$ 是已知实数，$x$ 代表要找到的未知数。由于 $x$ 以二次幂的形式出现，该方程被称为二次方程或二阶方程。\n\n方程的根是使该方程成立的\
  \ $x$ 值；即等式的左侧 $ax² + bx + c$ 等于零。\n\n在该练习中，用户必须输入系数 $a、$b$ 和 $c$ 的值，程序必须找到使 $ax²\
  \ + bx + c$ 等于零的 $x$ 值。\n\n根据系数 $a$ 的值，此问题可以分为两个独立的子问题。\n\ni. 如果系数 $a$ 不等于零，则可以使用判别式\
  \ $D$ 找到方程的根。请注意，当 $D < 0$ 时，该解不会找到复数根；这超出了本书的范围。\nii. 如果系数 $a$ 等于零，则方程变为一次方程 $bx\
  \ + c = 0$，其解已在上一个练习中给出。\n\n所有必要的路径都显示在这里。\n\n![Image](img/00223.gif)\n\n![](img/00002.jpeg)\
  \ 右侧的路径（$a = 0$）是一次方程 $bx + c = 0$ 的解，在上一个练习中显示过。\n\n使用此图，你可以设计以下流程图。\n\n![Image](img/00224.gif)\n\
  \n这里显示了 Java 程序。\n\n![](img/00001.gif)\n```java\nClass_23_2_4\npublic static void\
  \ main(String[] args) {\n    double a, b, c, D, x1, x2, x;\n    System.out.println(\"\
  Enter values for coefficients a, b and c: \");\n    a = Double.parseDouble(cin.nextLine());\n\
  \    b = Double.parseDouble(cin.nextLine());\n    c = Double.parseDouble(cin.nextLine());\n\
  \    if (a != 0) {\n        D = b * b - 4 * a * c;\n        if (D >= 0) {\n    \
  \        if (D > 0) {\n                x1 = (-b + Math.sqrt(D)) / (2 * a);\n   \
  \             x2 = (-b - Math.sqrt(D)) / (2 * a);\n                System.out.println(\"\
  Roots: \" + x1 + \", \" + x2);\n            } else {\n                x = -b / (2\
  \ * a);\n                System.out.println(\"One double root: \" + x);\n      \
  \      }\n        } else {\n            System.out.println(\"Complex Roots\");\n\
  \        }\n    } else {\n        if (b != 0) {\n            x = -c / b;\n     \
  \       System.out.println(\"Root: \" + x);\n        } else if (c != 0) {\n    \
  \        System.out.println(\"Undefined\");\n        } else {\n            System.out.println(\"\
  Indeterminate form\");\n        }\n    }\n}\n```\n\n### 23.3 使用决策控制结构寻找最小值和最大值\n\
  \n假设有一些男人，你想找到最轻的一个。假设他们每个人走过来并告诉你的体重。你必须做的是，记住第一个过来人的体重，并且对于每个新的人，你必须将他的体重与你记住的那个进行比较。如果他更重，你就忽略他的体重。然而，如果他更轻，你需要忘记之前的体重并记住新的。同样的程序继续，直到所有人都过来。\n\
  \n让我们请四个人按随机顺序过来。假设他们的体重按出现顺序依次是 165、170、160 和 180 磅。\n\n| 步骤 | 你脑海中变量 `minimum`\
  \ 的值！ |\n| :--- | :--- |\n| 第一个人走过来。他重 165 磅。将他的体重留在脑海中（想象脑中有一个名为 `minimum` 的变量）。\
  \ | `minimum = 165` |\n| 第二个人走过来。他重 170 磅。他比你记住的体重重，所以忽略他的体重。 | `minimum = 165`\
  \ |\n| 第一个人走过来。他重 160 磅。他比你记住的体重轻，你需要忘记之前的体重并记住新的。 | `minimum = 160` |\n| 第四个人走过来。他重\
  \ 180 磅。他比你记住的体重重，所以忽略他的体重。 | `minimum = 160` |\n\n当所有人都过来后，你脑中的 `minimum` 就包含了最轻人的体重。\n\
