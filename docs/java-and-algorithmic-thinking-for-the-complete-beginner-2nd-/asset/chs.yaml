  \    System.out.println(a * b);\n        case \"/\":\n            if (b == 0) {\n\
  \                System.out.println(\"Division by zero\");\n            } else {\n\
  \                System.out.println(a / b);\n            }\n            break;\n\
  \    }\n}\n```\n\n### 23.2 控制结构解决问题\n\n#### 23.2-1 求 y 的值\n\n设计一个流程图并编写相应的 Java\
  \ 程序，根据以下公式找到并显示 y 的值（如果可能）。\n\n![](img/00021.gif) 答案\n\n在这个练习中，不允许用户输入会导致分母为零的数值。因此，程序需要考虑这些限制。流程图所示。\n\
