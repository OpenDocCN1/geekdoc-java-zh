  \ 18. LAV 手机公司向客户收取每月 10 美元的基础费用，并根据客户在该月内使用手机通话的总秒数收取额外费用。使用下表所示的费率。\n\n| 客户手机通话的秒数\
  \ | 额外费率（美元/秒） |\n| --- | --- |\n| 1 - 600 | 免费 |\n| 601 - 1200 | $0.01 |\n| 1201\
  \ 及以上 | $0.02 |\n\n完成以下操作：\n\ni. 编写一个名为 `amount_to_pay` 的子程序，它通过其形式参数列表接受一个秒数，然后显示总金额。请注意费率是阶梯的。此外，联邦、州和地方税会为每张账单增加总计\
  \ 11% 的费用。\n\nii. 使用上述子程序，编写一个 Java 程序，提示用户输入其手机通话秒数，然后显示总金额。\n\n## 第 37 章\n## 子程序的技巧与技巧\n\
  \n### 37.1 两个子程序可以使用同名的变量吗？\n\n每个子程序都使用自己的内存空间来存储变量的值。即使是主代码也有自己的内存空间！这意味着你可以在主代码中有一个名为\
  \ `test` 的变量，在子程序中有一个另一个名为 `test` 的变量，在另一个子程序中又有一个另一个名为 `test` 的变量。注意！这三个变量是三个完全不同的变量，位于不同的内存位置，并且它们可以持有完全不同的值。\n\
  \n如接下来的程序所示，在三个不同的内存位置上有三个名为 `test` 的变量，每一个都持有一个完全不同的值。下方的跟踪表可以帮助你理解发生了什么。\n\n![](img/00001.gif)\n\
  \n```java\nClass_37_1\nstatic boolean f1() {\n    int test;\n    test = 22;\n  \
  \  System.out.println(test);\n    return true;\n}\nstatic void f2(int test) {\n\
  \    System.out.println(test);\n}\n//Main code starts here\npublic static void main(String[]\
  \ args) {\n    int test;\n    boolean ret;\n    test = 5;\n    System.out.println(test);\n\
  \    ret = f1();\n    f2(10);\n    System.out.println(test);\n}\n```\n\n跟踪表所示所示。\n\
  \n| 步骤 | 语句 | 注释 | 主代码 | 方法 f1() | void 方法 f2() |\n| --- | --- | --- | --- | ---\
  \ | --- |\n| test | ret | test | test | | | |\n| 1 | test = 5 | | 5 | ? | | |\n\
  | 2 | .println(test) | 显示: 5 | 5 | ? | | |\n| 3 | ret = f1() | 调用了 f1() | | | ?\
  \ | |\n| 4 | test = 22 | | | | 22 | | |\n| 5 | .println(test) | 显示: 22 | | | 22\
  \ | | |\n| 6 | return true | 返回到主代码 | 5 | true | | |\n| 7 | f2(10) | 调用了 f2(10)\
  \ | | | | |\n| 8 | .println(test) | 显示: 10 | | | | |\n| 9 | .println(test) | 显示:\
  \ 5 | 5 | | |\n\n![](img/00002.gif) 注意在子程序执行期间“生存”的变量是形式参数列表。这意味着当子程序结束时，它们从主内存中移除。\n\
  \n### 37.2 子程序可以调用子程序吗？\n\n在阅读这一节时，你可能认为只有主代码可以调用子程序。当然，事实并非如此！\n\n子程序可以调用任何其他子程序，以此此类推。例如，你可以编写一个调用\
  \ void 方法的方法，或者调用你使用的语言的内置方法。下一个示例展示了这种情况。主代码调用了 `display_sum()`，它转而调用了 `add()`。\n\
  \n```java\nClass_37_2\nstatic int add(int number1, int number2) {\n    int result;\n\
  \    result = number1 + number2;\n    return result;\n}\nstatic void display_sum(int\
  \ num1, int num2) {\n    System.out.println(add(num1, num2));\n}\npublic static\
  \ void main(String[] args) {\n    int a, b;\n    a = Integer.parseInt(cin.nextLine());\n\
  \    b = Integer.parseInt(cin.nextLine());\n    display_sum(a, b);\n}\n```\n\n![](img/00002.gif)\
  \ 当 `add()` 方法执行结束时，它返回到它的调用者，即 void 方法 `display_sum()`。然后，当 void 方法 `display_sum()`\
  \ 执行结束时，它返回到它的调用者，即主代码。注意，对于这两个子程序的编写顺序没有限制。如果将 void 方法 `display_sum()` 写在 `add()`\
  \ 方法之前，结果也将完全相同。\n\n### 37.3 按值和按引用传递参数\n\n在 Java 中，变量是按值传递给子程序的。这意味着如果参数在子程序内部被更改，它在外部并不会发生改变。请看以下示例。\n\
  \n```java\nClass_37_3\nstatic void f1(int b) {\n    b++;\n    System.out.println(b);\n\
  }\npublic static void main(String[] args) {\n    int a;\n    a = 10;\n    f1(a);\n\
  \    System.out.println(a);\n}\n```\n\n变量 `a` 的值 10 通过参数 `b` 传递给 void 方法 `f1()`。然而，尽管变量\
  \ `b` 的内容在子程序内部被修改了，但当执行流返回主代码时，这一更改不会影响变量 `a` 的值。\n\n\n\n\n在在上一个示例中，`main` 代码和\
  \ `void` 方法使用了两个不同名的变量。然而，如果例如，`main` 代码和 `void` 方法使用了相同名的变量，结果也将是相同的。下一个 Java 程序的运行方式完全相同，显示的结果也与之前的程序完全一致。\n\
  \n![](img/00001.gif) Class_37_3b\n```java\nstatic void f1(int a) {\n    a++;   \
  \ //这是一个 void 方法 f1() 的变量\n    System.out.println(a);     //显示为: 11\n}\npublic static\
  \ void main(String[] args) {\n    int a;\n    a = 10;    //这是 main 代码中的变量\n    f1(a);\n\
  \    System.out.println(a);    //显示为: 10\n}\n```\n\n将数组作为参数传递给子程序与传递简单变量一样简单。接下来的示例将数组\
  \ `a` 传递给 `void` 方法 `display()`，后者会显示该数组。\n\n![](img/00001.gif) Class_37_3c\n```java\n\
  static final int ELEMENTS = 10;\nstatic void display(int b[]) {\n    int i;\n  \
  \  for (i = 0; i <= ELEMENTS - 1; i++) {\n        System.out.print(b[i] + \"\\t\"\
  );\n    }\n}\npublic static void main(String[] args) {\n    int i;\n    int[] a\
  \ = new int[ELEMENTS];\n    for (i = 0; i <= ELEMENTS - 1; i++) {\n        a[i]\
  \ = Integer.parseInt(cin.nextLine());\n    }\n    display(a);\n}\n```\n\n与变量不同，Java\
  \ 中的数据结构是通过引用传递的。这意味着，例如，你将一个数组传递给子程序，而该子程序更改了数组中一个或多个元素的值，这些更改也将反映在子程序外部。请看下面的示例。\n\
  \n![](img/00001.gif) Class_37_3d\n```java\nstatic void f1(int[] x) {\n    x[0]++;\n\
  \    System.out.println(x[0]); //显示为: 6\n}\npublic static void main(String[] args)\
  \ {\n    int[] y = {5, 10, 15, 20};\n    System.out.println(y[0]);   //显示为: 5\n\
  \    f1(y);\n    System.out.println(y[0]);   //显示为: 6\n}\n```\n\n![](img/00002.jpeg)将数组传递给子程序实际上传递的是数组的引用，而不是数组的拷贝件。数组\
  \ `y` 和参数 `x` 实际上是同一个数组的别名。由于数组被两个引用共享，因此在主内存（RAM）中只有一份拷贝。如果子程序更改了元素的值，此更改也将反映在主程序中。\n\
  \n所以，正如你可能意识到的，通过引用传递数组可以为子程序提供一种间接的方法来“返回”多个值。在接下来的示例中，方法 `my_divmod()` 将变量 `a`\
  \ 除以变量 `b`，并找到它们的整数商和整数余数。如果一切顺利，它返回 `true`；否则，返回 `false`。此外，通过数组结果，该方法还间接返回了计算出的商和计算出的余数。\n\
  \n![](img/00001.gif) Class_37_3e\n```java\nstatic boolean div_mod(int a, int b,\
  \ int[] results) {\n    boolean return_value = true;\n    if (b == 0) {\n      \
  \  return_value = false;\n    } else {\n        results[0] = (int)(a / b);\n   \
  \     results[1] = a % b;\n    }\n    return return_value;\n}\npublic static void\
  \ main(String[] args) {\n    int val1, val2;\n    boolean ret;\n    int[] res =\
  \ new int[2];\n    val1 = Integer.parseInt(cin.nextLine());\n    val2 = Integer.parseInt(cin.nextLine());\n\
  \    ret = div_mod(val1, val2, res);\n    if (ret) {\n        System.out.println(res[0]\
  \ + \", \" + res[1]);\n    } else {\n        System.out.println(\"Sorry, wrong values\
  \ entered!\");\n    }\n}\n```\n\n![](img/00002.jpeg)关于形式参数列表中的参数的一个非常好的策略，是将所有按值传递的参数写在所有按引用传递的参数之前。\n\
  \n#### 练习 37.3-1 寻找逻辑错误\n\n以下 Java 程序本应提示用户向数组输入五个整数，然后对每个元素显示其位数和该整数本身。例如，如果用户输入值\
  \ 35, 13565, 113, 278955, 9999，该 Java 程序本应显示：\n\n2 are the digits of 35\n\n5 are\
  \ the digits of 13565\n\n3 are the digits of 113\n\n6 are the digits of 278955\n\
  \n4 are the digits of 9999\n\n不幸的是，以下 Java 程序显示为\n\n2 are the digits of 0\n\n5 are\
  \ the digits of 0\n\n3 are the digits of 0\n\n6 are the digits of 0\n\n4 are the\
  \ digits of 0\n\n你能找出原因吗？\n\n![](img/00001.gif) Class_37_3b\n```java\nstatic final\
  \ int ELEMENTS = 5;\nstatic int get_num_of_digits(int[] x, int index) {\n    int\
  \ count = 0;\n    while (x[index] != 0) {\n        count++;\n        x[index] =\
  \ (int)(x[index] / 10);\n    }\n    return count;\n}\npublic static void main(String[]\
  \ args) {\n    int[] val = new int[ELEMENTS];\n    int i;\n    for (i = 0; i < ELEMENTS;\
  \ i++) {\n        val[i] = Integer.parseInt(cin.nextLine());\n    }\n    for (i\
  \ = 0; i < ELEMENTS; i++) {\n        System.out.print(get_num_of_digits(val, i)\
  \ + \" are the digits of \" + val[i]);\n    }\n}\n```\n\n#### 解决方案\n\n上面的 `get_num_of_digits`\
  \ 修改修改数组 `val`，因为它将其除以 10 直到零。为了修复这个问题，你应该向方法传递数组的拷贝，或者使用局部变量进行计算。\n\n#### 37.4\
  \ 返回数组\n\n在接下来的示例中，Java 程序必须找到三个最小值。为了实现这一点，程序通过其形式参数 `x` 调用 `get_array()`，后者使用插入排序算法对数组排序。当执行流返回主代码时，数组变得有序了。\n\
  \n![](img/00001.gif) Class_37_4a\n```java\nstatic final int ELEMENTS = 10;\nstatic\
  \ void get_array(int x[]) {\n    int m, n, element;\n    for (m = 1; m < ELEMENTS;\
  \ m++) {\n        element = x[m];\n        n = m;\n        while (n > 0 && x[n -\
  \ 1] > element) {\n            x[n] = x[n - 1];\n            n--;\n        }\n \
  \       x[n] = element;\n    }\n}\npublic static void main(String[] args) {\n  \
  \  int i;\n    int t[] = {75, 73, 78, 70, 71, 74, 72, 69, 79, 77};\n    get_array(t);\n\
  \    System.out.println(\"Three lowest values are: \");\n    System.out.println(t[0]\
  \ + \"  \" + t[1] + \"  \" + t[2]);\n    //在此步骤中，数组 t 是有序的\n    for (i = 0; i <\
  \ ELEMENTS; i++) {\n        System.out.println(t[i]);\n    }\n}\n```\n\n注意，由于主代码中的数组\
  \ `t`是通过引用传递给 `void` 方法的，当执行流返回主代码时，数组也被排序排序。\n\n然而，在许多情况下，按引用传递数组可能是完全灾难性的。假设你有以下两个数组。数组\
  \ `names` 包含了 10 个城市的名称，数组 `t` 包含了它们在某天某小时记录的相应温度。\n\n![Image](img/00419.gif)\n\n\
  \n\n一种可能的解决方案是编写一个方法，将数组复制到一个辅助数组，该方法返回一个只包含三个最小值的较小数组。建议的解决方案所示。\n\n![](img/00001.gif)\n\
  ```java\nClass_37_4bstatic final int ELEMENTS = 10;\nstatic int[] get_array(int\
  \ x[]) {\n    int m, n, element;\n    int[] aux_x = new int[ELEMENTS];\n    //Copy\
  \ array x to array aux_x\n    for (m = 0; m <= ELEMENTS - 1; m++) {\n        aux_x[m]\
  \ = x[m];\n    }\n    //and sort array aux_x\n    for (m = 1; m <= ELEMENTS - 1;\
  \ m++) {\n        element = aux_x[m];\n        n = m;\n        while (n > 0 && aux_x[n\
  \ - 1] > element) {\n            aux_x[n] = aux_x[n - 1];\n            n--;\n  \
  \      }\n        aux_x[n] = element;\n    }\n    int[] ret_array = {aux_x[0], aux_x[1],\
  \ aux_x[2]};\n    return ret_array;\n}\npublic static void main(String[] args) {\n\
  \    int i;\n    int t[] = {75, 73, 78, 70, 71, 74, 72, 69, 79, 77};\n    int low[]\
  \ = get_array(t);\n    System.out.println(\"Three lowest values are: \");\n    System.out.println(low[0]\
  \ + \"  \" + low[1] + \"  \" + low[2]);\n    //In this step, array t is NOT sorted\n\
  \    for (i = 0; i <= ELEMENTS - 1; i++) {\n        System.out.println(t[i]);\n\
  \    }\n}\n```\n\n![](img/00002.jpeg)注意，你不能使用像 `int aux_x[] = x` 这样的语句来将数组 `x` 的元素复制到\
  \ `aux_x`。该语句只是创建了同一个数组的两个别名。这就是为什么在前面的示例中使用了 for 循环来将数组 `x` 的元素复制到数组 `aux_x`。\n\
  \n### 37.5 方法重载\n\n方法重载是一项特性，允许你拥有两个或多个相同的方法，只要它们的的形式形参数列表不同。这意味着只要满足以下条件，你就可以进行重载：\n\
  \n-   每个形式形参数列表中的参数数量不同；或者\n-   每个形式形参数列表中参数的数据类型不同；或者\n-   每个形式形参数列表中参数的数据类型顺序不同。\n\
  \n为了更好地理解所有这些概念，让我们尝试为每个概念使用一个例子来分析它们。\n\n#### 每个形式形参数列表中的参数数量不同\n\n在下面的示例中，有两个方法\
  \ `display()`，但它们的形式形参数数量不同。第一个方法通过其形式形参数列表接收一个字符串，而第二个方法接收两个字符串。\n\n![](img/00001.gif)\n\
  ```java\nClass_37_5astatic void display(String first_name) {\n    System.out.println(\"\
  First name: \" + first_name);\n    System.out.println(\"-----------------------------\"\
  );\n}\nstatic void display(String first_name, String last_name) {\n    System.out.println(\"\
  First name: \" + first_name);\n    System.out.println(\"Last name: \" + last_name);\n\
  \    System.out.println(\"-----------------------------\");\n}\npublic static void\
  \ main(String[] args) {\n    display(\"George\", \"Washington\");  //这调用了第二个方法\n\
  \    display(\"George\");  //这调用了第一个方法\n}\n```\n\n输出结果所示。\n\n![Image](img/00420.gif)\n\
  \n#### 每个形式形参数列表中参数类型不同\n\n在下面的示例中，有两个方法 `my_abs()`，但它们的形式形参数类型不同。第一个方法接收一个整数，而第二个方法通过其形式形参数列表接收一个实数（一个\
  \ `double`）。\n\n![](img/00001.gif)\n```java\nClass_37_5bstatic int my_abs(int a)\
  \ {\n    if (a < 0) {\n        a *= -1;\n    }\n    System.out.print(\"An integer\
  \ passed: \");\n    return a;\n}\nstatic double my_abs(double a) {\n    if (a <\
  \ 0) {\n        a *= -1;\n    }\n    System.out.print(\"A real passed: \");\n  \
  \  return a;\n}\npublic static void main(String[] args) {\n    System.out.println(my_abs(-5));\
  \    //这调用了第一个方法\n    System.out.println(my_abs(-5.5));  //这调用了第二个方法\n    System.out.println(my_abs(-5.0));\
  \  //这调用了第二个方法\n}\n```\n\n输出结果如下。\n\n![Image](img/00421.gif)\n\n#### 每个形式形参数列表中参数数据类型顺序不同\n\
  \n最后但同样，在下面的示例中，有两个方法 `display_date()`，但每个形式形参数列表中参数的数据类型顺序不同。第一个方法接收以字符串-整数顺序的参数，而第二个接收以整数-字符串顺序的参数。\n\
  \n![](img/00001.gif)\n```java\nClass_37_5static void display_date(String month,\
  \ int day) {\n    System.out.println(\"Month: \" + month + \" Day: \" + day);\n\
  \    System.out.println(\"-----------------------------\");\n}\nstatic void display_date(int\
  \ day, String month) {\n    System.out.println(\"Month: \" + month + \" Day: \"\
  \ + day);\n    System.out.println(\"-----------------------------\");\n}\npublic\
  \ static void main(String[] args) {\n    display_date(\"January\", 15); //这调用了第一个方法\n\
  \    display_date(15, \"January\"); //这调用了第二个方法\n}\n```\n*(注：由于原文中最后一段代码块似乎被截断或不完整，此处根据逻辑推全了翻译中的代码结构，以保持格式一致性，但严格遵循翻译原则。)*\n\
