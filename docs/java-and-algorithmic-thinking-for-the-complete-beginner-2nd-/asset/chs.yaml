  \ 用户定义方法可以像调用 Java 的内置方法一样调用。\n\n### 36.7 void 方法是如何执行的？\n\n当主代码调用 void 方法时，会执行以下步骤：\n\
  \n- ► 主代码语句的执行被中断。\n- ► 存在于实际参数列表中的变量或表达式的结果被传递（赋值）给形式参数列表中的对应参数（变量），执行流跳转到编写 void\
  \ 方法的地方。\n- ► 执行 void 方法的语句。\n- ► 当执行流到达 void 方法末尾时，执行流从调用 void 方法之前的地方继续。\n\n在下一个\
  \ Java 程序中，void 方法 `minimum()` 通过其形式参数列表接受三个参数（数值）并显示最低值。\n\n![](img/00001.gif)\
  \ Class_36_7\n```java\nstatic void minimum(double val1, double val2, double val3)\
  \ {\n    double minim;\n    minim = val1;\n    if (val2 < minim) {\n        minim\
  \ = val2;\n    }\n    if (val3 < minim) {\n        minim = val3;\n    }\n    System.out.println(minim);\n\
  }\npublic static void main(String[] args) {\n    double a, b, c;\n    a = Double.parseDouble(cin.nextLine());\n\
  \    b = Double.parseDouble(cin.nextLine());\n    c = Double.parseDouble(cin.nextLine());\n\
