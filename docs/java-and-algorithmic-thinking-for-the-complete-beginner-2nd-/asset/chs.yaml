  \ M 或 F，回答只接受 Y、N 或 S。\n\n#### 解决方案\n\nJava 程序如下。\n\n![](img/00001.gif)\n```java\n\
  Class_30_6_3\nstatic final int CITIZENS = 1000;\npublic static void main(String[]\
  \ args) {\n    int total_yes, female_no, i;\n    String gender, answer;\n    total_yes\
