  \ 其中 `S` 是周长![Image](img/00144.gif)\n\n# 第 13 章 商与余数\n\n### 13.1 引言\n\n哪些类型的问题需要使用商和余数？没有简单的答案！但是，商和余数可以：\n\
  \n- 将数字拆分为单个数字\n- 判断一个数是奇还是偶\n- 将经过的时间（秒）转换为小时、分钟和秒\n- 将金额（美元）转换为$100、$50 等\n- 计算最大约数\n\
  - 判断一个数是否是回文\n- 统计某个数字在数字中出现的次数\n\n当然，这些是它们的一些用途。接下来你将看到一些使用商和余数的练习。\n\n#### 练习\
  \ 13.1-1 计算除法的商和余数\n\n写一个 Java 程序，提示用户输入两个整数，然后计算它们的商和余数。\n\n解决方案\n\n`%` 运算符执行整数除法并返回整数余数。由于\
  \ Java 并没有引入计算整数商的运算符，你可以使用 `(int)` 强制转换来实现相同的结果。解决方案所示：\n\nimages/00001.gif) `Class_12_1_3`\n\
  ```java\npublic static void main(String[] args) {\n    int number1, number2, q,\
  \ r;\n    System.out.print(\"Enter first number: \");\n    number1 = Integer.parseInt(cin.nextLine());\n\
  \    System.out.print(\"Enter second number: \");\n    number2 = Integer.parseInt(cin.nextLine());\n\
  \    q = (int)(number1 / number2);\n    r = number1 % number2;\n    System.out.println(\"\
  Integer Quotient: \" + q + \"\\nInteger Remainder: \" + r);\n}\n```\n\n在流程图中，为了计算整数除法的商和余数，可以使用常用的\
  \ `DIV` 和 `MOD` 运算符。示例所示：\n\n![Image](img/00145.gif)\n\n在 Java 中，两个整数除法的结果始终是整数。因此，在语句\
  \ `q = (int)(number1 / number2)` 中，由于变量 `number1` 和 `number2` 是整数，`(int)` 强制转换是多余的。然而，为了提高可读性，保留它是个好习惯。\n\
  \n#### 练习 13.1-2 寻找数字之和\n\n写一个 Java 程序，提示用户输入一个四位整数，然后计算其数字之和。\n\n解决方案\n\n这里你应该记住的是像这样的语句\n\
  \n`number = Integer.parseInt(cin.nextLine());`\n\n将输入的四位整数赋值给单个变量 `number`，而不是四个独立的变量。所以，在用户输入四位整数后，程序必须将该整数拆分为四个数字，并将每个数字赋值给单独的变量。然后就可以计算这四个变量之和并得到所需的结果。有两种方法可用。\n\
  \n第一种\n\n让我们尝试用一个算术示例来理解第一种方法。以数字 6753 为例。\n\n\n\n\n\n| 第一位 = 6 | 如果使用 `/` 运算符将给定数字除以\
  \ 1000，并使用 `(int)` 类型转换运算符获取整数商 `digit1 = (int)(6753 / 1000)`，就可以分离出第一位。 |\n| 剩余数字\
  \ = 753 | 如果再次将给定数字除以 1000，这次使用 `%` 运算符获取整数余数 `r = 6753 % 1000`，就可以分离剩余数字。 |\n|\
  \ 第二位 = 7 | 如果使用 `/` 运算符将剩余数字除以 100，并使用 `(int)` 类型转换运算符获取整数商 `digit2 = (int)(753\
  \ / 100)`，就可以分离出第二位。 |\n| 剩余数字 = 53 | 现在剩余数字为 `r = 753 % 100` |\n| 第三位 = 5 | 如果使用\
  \ `/` 运算符将剩余数字除以 10，并使用 `(int)` 类型转换运算符获取整数商 `digit3 = (int)(53 / 10)`，就可以分离出第三位。\
  \ |\n| 第四位 = 3 | 最后一个剩余的数字恰好是第四位，即 `digit4 = 53 % 10` |\n\n解决该算法的 Java 程序所示所示。\n\
  \n![](img/00001.gif) Class_13_1_2\n```java\npublic static void main(String[] args)\
  \ {\n    int digit1, digit2, digit3, digit4, number, r, total;\n    System.out.print(\"\
  Enter a four-digit integer: \");\n    number = Integer.parseInt(cin.nextLine());\n\
  \    digit1 = (int)(number / 1000);\n    r = number % 1000;\n    digit2 = (int)(r\
  \ / 100);\n    r = r % 100;\n    digit3 = (int)(r / 10);\n    digit4 = r % 10;\n\
  \    total = digit1 + digit2 + digit3 + digit4;\n    System.out.println(total);\n\
  }\n```\n\n你刚刚看到的程序的追踪表（trace table）所示。\n\n| Step | Statement | Notes | number |\
  \ digit1 | digit2 | digit3 | digit4 | r | total |\n| --- | --- | --- | --- | ---\
  \ | --- | --- | --- | --- | --- |\n| 1 | `.print(\"Enter…` | 它显示：Enter a four-digit\
  \ integer: | | | | | | | | |\n| 2 | `number = Integer.parseInt(…` | 用户输入 6753 |\
  \ 6753 | ? | ? | ? | ? | ? | ? |\n| 3 | `digit1 = (int)(number / 1000)` | | 6753\
  \ | 6 | ? | ? | ? | ? | ? |\n| 4 | `r = number % 1000` | | 6753 | 6 | ? | ? | ?\
  \ | 753 | ? |\n| 5 | `digit2 = (int)(r / 100)` | | 6753 | 6 | 7 | ? | ? | 753 |\
  \ ? |\n| 6 | `r = r % 100` | | 6753 | 6 | 7 | ? | ? | 53 | ? |\n| 7 | `digit3 =\
  \ (int)(r / 10)` | | 6753 | 6 | 7 | 5 | ? | 53 | ? |\n| 8 | `digit4 = r % 10` |\
  \ | 6753 | 6 | 7 | 5 | 3 | 53 | ? |\n| 9 | `total = digit1 + digit2 + digit3 + digit4`\
  \ | | 6753 | 6 | 7 | 5 | 3 | 53 | 21 |\n| 10 | `.println(total)` | 它显示：21 | | |\
  \ | | | | | |\n\n为了进一步帮助你，还有一个通用的 Java 程序可以用于拆分任何给整数。由于你的程序长度取决于位数 `N`，你只需要编写 `N−1`\
  \ 对语句语句即可。\n\n```java\nSystem.out.print(\"Enter an N-digit integer: \");\nnumber\
  \ = Integer.parseInt(cin.nextLine());\ndigit1 = (int)(number / 10^(N-1));\nr = number\
  \ % 10^(N-1);\ndigit2 = (int)(r / 10^(N-2));\nr = r % 10^(N-2);\n...\ndigit(N-2)\
  \ = (int)(r / 100);\nr = r % 100;\ndigit(N-1) = (int)(r / 10);\ndigitN = r % 10;\n\
  ```\n\n例如，如果你想拆分一个六位整数，你需要像后续程序所示编写五对语句。\n\n![](img/00001.gif) Class_13_1_2b\n```java\n\
  public static void main(String[] args) {\n    int digit1, digit2, digit3, digit4,\
