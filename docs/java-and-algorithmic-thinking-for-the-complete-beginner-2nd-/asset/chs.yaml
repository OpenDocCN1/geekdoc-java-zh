  \ 1 的半径；如果选择 3、4 或 5，程序必须相应地显示选项 1 的半径的直径、面积或周长。该过程必须根据用户的意愿重复。\n\n## 9. 假设你在一家计算机软件公司工作，将创建一个文字处理器应用程序。你被分配编写一个类用于为用户提供信息。\n\
