- "# Java 与算法思维初学者指南（第 2 版）：学习像程序员一样思考\n\n\n\n![](img/cover.jpeg)\n\n\n\n\n\n\n\n\n\
  \n\n\n\n如果你将此程序输入 Eclipse，你会发现甚至没有一条红色的波浪线表示任何错误。然而，如果你运行程序并输入两个值 5 和 3，你可以亲眼看到，尽管\
  \ 5 和 3 的和是 8，但 Eclipse 坚持认为它是 0，如图 9–15 所示。\n\n![Image](img/00087.jpeg)\n\n###\
  \ 图 9–15 在输出窗口中查看逻辑错误的结果\n\n到底是怎么回事？当然，对于资深程序员来说，修正这个错误是小菜一碟。但对于你这个新手来说，尽管你非常努力，也发现没有任何不对劲。那么，错误在哪里呢？\n\
  \n有时候眼睛会疲劳到看不到显而易见的问题。所以，让我们尝试使用一些魔法！尝试使用调试器逐步执行程序。这给了你一个观察执行流的机会，并仔细观察每一步中变量的当前值。\n\
  \n要打开调试器，你需要打开“Debug”（调试）视图。你可以通过从主菜单中选择“Window→Perspective→Open Perspective→Debug”来实现。现在，Eclipse\
  \ 环境发生了一点变化，看起来就像图 9–16 所示。\n\n![Image](img/00088.jpeg)\n\n### 图 9–16 “Debug”视图\n\
  \n将光标置于存在 `S = 0` 语句的行，按下 `SHIFT+CTRL+B` 组合键。左侧边处会出现一个蓝色的圆点，如图 9–17 所示。\n\n![Image](img/00089.jpeg)\n\
  \n### 图 9–17 在 Eclipse 中添加断点\n\n通过从主菜单中选择“Run→Debug”或按下 `F11` 键来启动调试器。通过这样做，你启用了调试器，工具栏上会启用更多的图标。\n\
  \n![Image](img/00090.jpeg)\n\n程序计数器（左边距中的蓝色箭头 ![Image](img/00091.gif) 图标）已停在程序的第一行，如图\
  \ 9–18 所示。\n\n![Image](img/00092.jpeg)\n\n### 图 9–18 在 Eclipse 中使用调试器\n\n![](img/00002.jpeg)\
  \ 程序计数器随时向你显示哪条语句是下一个要执行的。\n\n在此步中，`S = 0` 语句尚未执行。点击“Step Over”（单步执行） ![Image](img/00093.gif)\
  \ 工具栏图标或按下 `F6` 键。现在执行语句 `S = 0`，程序计数器移动到后续的 Java 语句，即下一个要执行的语句。\n\n在“Variables”（变量）窗口中，你可以观察内存（RAM）中所有的变量以及它们在执行每一步中所包含的值，如图\
  \ 9–19 所示。\n\n![Image](img/00094.jpeg)\n\n### 图 9–19 变量及其值显示在调试器的 Variables 窗口中\n\
  \n点击三次“Step Over” ![Image](img/00093.gif) 工具栏图标。第二、第三和第四条语句被执行。你可以在“Console”（控制台）窗口中看到输出结果（见图\
  \ 9–20）。\n\n![Image](img/00095.jpeg)\n\n### 图 9–20 在输出窗口中查看提示\n\n在此步中，程序等待你输入一个值。将光标放在“Console”窗口内部，输入值\
  \ 5，并按下“Enter ![Image](img/00050.gif)”键。\n\n程序计数器移动到第五条 Java 语句。点击两次“Step Over”\
  \ ![Image](img/00093.gif) 工具栏图标。此操作执行了第五和第六条 Java 语句。将光标放在“Console”窗口内部，输入值 3，并按下“Enter\
  \ ![Image](img/00050.gif)”键。\n\n程序计数器移动到第七条 Java 语句。再次点击一次“Step Over” ![Image](img/00093.gif)\
  \ 工具栏图标。执行语句 `S = a + b`。值 `8.0` 被赋值给变量 `S`，如图 9–21 所示。\n\n![Image](img/00096.jpeg)\n\
  ### 图 9–21 所有声明的变量都显示在 Variables 窗口中\n\n\n\n\n\n![Image](img/00099.jpeg)\n\n图 9–22\
  \ 在程序中添加断点\n\n![](img/00002.jpeg)当左侧边缘的对应行出现蓝色圆点 ![Image](img/00100.gif) 时，你就知道已经设置了断点。\n\
  \n确保“Debug（调试）”视图已打开，并按下 `F11` 启动调试器。在输出窗口被提示时，输入值 `10` 和 `12`。你会注意到，刚在你输入第二个数字并按下“回车\
  \ ![Image](img/00050.gif)”键后，执行流就会在断点处暂停（相应的行会有绿色背景高亮）。\n\n![](img/00003.jpeg)你可以通过从主菜单选择“Run→Debug（运行→调试）”或按下\
  \ `F11` 键来调试程序。\n\n现在，你可以仔细查看变量的当前值了。变量 `a`、`b` 和 `s` 分别包含值 `10.0`、`12.0` 和 `22`，这是预期的，所以到目前没有问题，如图\
  \ 9–23 所示。\n\n![Image](img/00101.jpeg)\n\n图 9–23 在 Variables 窗口查看变量的当前值\n\n点击“Step\
  \ Over（单步执行）” ![Image](img/00093.gif) 工具栏图标一次。语句 `d = a – b` 执行，变量 `a`、`b`、`s` 和\
  \ `d` 分别包含值 `10.0`、`12.0`、`22.0` 和 `-2.0`，符合预期，所以目前还没有问题，如图 9–24 所示。\n\n![Image](img/00102.jpeg)\n\
  \n图 9–24 在 Variables 窗口查看变量的当前值\n\n再次点击“Step Over（单步执行）” ![Image](img/00093.gif)\
  \ 工具栏图标。语句 `average = a + b / 2` 执行，变量 `a`、`b`、`s`、`d` 和 `average` 分别包含值 `10.0`、`12.0`、`22`、`-2`\
  \ 和 `16`，如图 9–25 所示。\n\n![](img/00103.jpeg)\n\n图 9–25 在 Variables 窗口查看变量的当前值\n\n\
  找到了！你刚刚发现了错误地给变量 `average` 赋值 `16.0` 而不是 `11.0` 的语句！现在困难的部分来了；你应该考虑为什么会发生这种情况！\n\
  \n经过整两天的思考，结果变得显而易见！你只是忘记将 `a + b` 包在括号内；因此，只有变量 `b` 被除以 `2`。点击“Terminate（终止）” ![Image](img/00097.gif)\
  \ 工具栏图标，移除所有断点，通过将 `a + b` 包在括号内来修正错误，你就准备好了！重新执行程序，现在看它正确地计算并显示了平均值。\n\n![](img/00002.jpeg)你可以像添加断点一样移除断点：在对应行号的左侧边缘双击，或者将光标放在包含断点的行上并按下\
  \ `SHIFT+CTRL+B` 组合键。\n\n### 9.5 复习练习\n\n完成以下练习。\n\n1. 将以下 Java 程序输入 Eclipse 并逐步执行。确定为什么它没有正确地计算出\
  \ `1 + 3 + 5` 的和。\n```java\npublic static void main(String[] args) {\n    int SS,\
  \ S1, S3, S5, S;\n    SS = 0;\n    S1 = 1;\n    S3 = 3;\n    S5 = 5;\n    S = S1\
  \ + S3 + SS;\n    System.out.println(S);\n}\n```\n\n2. 创建一个跟踪表（trace table），以确定\
  \ Java 程序在两次不同执行过程中每一步的变量值。然后，在 Eclipse 中输入程序，逐步执行并确认结果。\n\n两次执行的输入值分别为：(i) `5,\
  \ 5`；(ii) `4, 8`。\n\n```java\npublic static void main(String[] args) {\n    double\
  \ a, b, c, d, e;\n    a = Double.parseDouble(cin.nextLine());\n    b = Double.parseDouble(cin.nextLine());\n\
  \    c = a + b;\n    d = 5 + a / b * c + 2;\n    e = c - d;\n    c += d + c;\n \
  \   e--;\n    d += c + a / b;\n    System.out.println(c + \", \" + d + \", \" +\
  \ e);\n}\n```\n\n3. 创建一个跟踪表，确定 Java 程序在三次不同执行过程中每一步的变量值。然后，在 Eclipse 中输入程序，逐步执行并确认结果。\n\
  \n三次执行的输入值分别为：(i) `0.50`，(ii) `3` 和 (iii) `15`。\n\n```java\npublic static void main(String[]\
  \ args) {\n    int a;\n    double b, c;\n    b = Double.parseDouble(cin.nextLine());\n\
  \    c = 5;\n    c = c * b;\n    a = 10 * c / 2;\n    System.out.println(a);\n}\n\
  ```\n\n## “Java 入门”复习\n\n### 字谜游戏\n\n1. 完成以下字谜游戏。\n\n![Image](img/00104.jpeg)\n\n\
