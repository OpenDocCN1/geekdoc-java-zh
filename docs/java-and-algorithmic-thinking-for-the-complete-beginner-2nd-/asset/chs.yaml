  \        System.out.println(h2.events[1]);\n    }\n}\n```\n\n### 39.5 Getter 和 Setter\
  \ 方法\n\n字段是直接在类中定义的变量。然而，面向对象编程的原则规定类的数据应该是隐藏的，并且防止意外修改。想一下，某一天你可能会编写其他程序员在他们的程序中使用的类。所以，你不希望他们知道你的类内部的什么类你类的内部操作应该对外部世界隐藏。通过不暴露字段，你成功地隐藏了类的内部实现。字段应该保持对类私有，并通过\
  \ get 和 set 方法访问。\n\n![](img/00002.jpeg) 一般来说，程序员应该只对具有私有或保护访问权限的数据使用字段。在 Java 中，你可以使用特殊的关键字\
  \ `private` 或 `protected` 分将字段（或方法）设置为私有或保护。\n\n让我们通过一个示例来理解所有这些新内容。假设你写了以下类，将华氏度温度转换为等效摄氏度。\n\
  \n![](img/00001.gif) Project_39_5a\n\n```java\nclass FahrenheitToCelsius {\n   \
  \ public double temperature;\n    //Define the constructor\n    public FahrenheitToCelsius(double\
  \ value) {\n        this.temperature = value;   //字段被初始化\n    }\n    //This method\
  \ gets the temperature\n    public double getTemperature() {\n        return 5.0\
  \ / 9.0 * (this.temperature - 32.0);\n    }\n}\n\npublic class Class_39_5a {\n \
  \   public static void main(String[] args) {\n        FahrenheitToCelsius x = new\
  \ FahrenheitToCelsius(-68);  //创建对象 x\n        System.out.println(x.getTemperature());\n\
  \    }\n}\n```\n\n这个类几乎是完美的，但有一个主要的缺点。它没有考虑到温度不能低于 −459.67 华氏度（−273.15 摄氏度）。这个温度被称为绝对零度。因此，一个对物理一无所知新手程序员可能会向构造方法传递一个\
  \ -500 华氏度的值，如下面的代码所示：\n\n```java\nFahrenheitToCelsius x = new FahrenheitToCelsius(-500);\n\
  System.out.println(x.getTemperature());\n```\n\n尽管程序可以完美运行并显示 −295.55 摄氏度的值，但遗憾的是，这个温度是不存在的！所以，该类的稍微不同版本可能会部分解决这个问题。\n\
  \n![](img/00001.gif) Project_39_5b\n\n```java\nclass FahrenheitToCelsius {\n   \
  \ public double temperature;\n    //Define the constructor\n    public FahrenheitToCelsius(double\
  \ value) {\n        this.temperature = value;\n    }\n    //This method gets the\
  \ temperature\n    public double getTemperature() {\n        return 5.0 / 9.0 *\
  \ (this.temperature - 32.0);\n    }\n    //This method sets the temperature\n  \
  \  public void setTemperature(double value) throws Exception {\n        if (value\
  \ >= -459.67) {\n            this.temperature = value;\n        } else {\n     \
  \       throw new Exception(\"There is no temperature below -459.67\");\n      \
  \  }\n    }\n}\n\npublic class Class_39_5b {\n    public static void main(String[]\
  \ args) {\n        FahrenheitToCelsius x = new FahrenheitToCelsius(-500); //创建对象\
  \ x\n        System.out.println(x.getTemperature());\n    }\n}\n```\n\n![](img/00002.jpeg)\
  \ throw 语句强制程序抛出异常（运行时错误），导致执行流停止。\n\n这次，使用名为 `setTemperature()` 的方法来设置字段。这好了一些，但并不完美，因为程序员必须在每次想要更改字段值时都使用\
  \ `setTemperature()` 方法。问题是，字段仍然可以使用其名称直接更改，如代码片段所示：\n\n```java\nFahrenheitToCelsius\
  \ x = new FahrenheitToCelsius(-50); //创建对象 x\nSystem.out.println(x.getTemperature());\n\
  x.setTemperature(-65); //这是好的！\nSystem.out.println(x.getTemperature());\nx.temperature\
  \ = -500; //遗憾的是，这仍然允许！\nSystem.out.println(x.getTemperature());\n```\n\n如果你将字段\
  \ `temperature` 声明为 `private`，这个问题就可以完全解决。当字段被声明为私有时，调用者（这里是对象 `x`）无法直接访问字段，如下 Java\
  \ 程序所示。\n\n![](img/00001.gif) Project_39_5c\n\n```java\nclass FahrenheitToCelsius\
  \ {\n    private double temperature; //将字段声明为私有\n    //Define the constructor\n\
  \    public FahrenheitToCelsius(double value) throws Exception {\n        this.setTemperature(value);\
  \   调用 setter\n    }\n    //This method gets the temperature\n    public double\
  \ getTemperature() {\n        return 5.0 / 9.0 * (this.temperature - 32.0);\n  \
  \  }\n    //This method sets the temperature\n    public void setTemperature(double\
  \ value) throws Exception {\n        if (value >= -459.67) {\n            this.temperature\
  \ = value;\n        } else {\n            throw new Exception(\"There is no temperature\
  \ below -459.67\");\n        }\n    }\n}\n\npublic class Class_39_5c {\n    public\
  \ static void main(String[] args) throws Exception {\n        // 在处实现\n    }\n}\n\
  ```\n\n\n\n\n\n```java\nFahrenheitToCelsius x = new FahrenheitToCelsius(-50);  //创建对象\
  \ x。构造函数被\n//调用，随后它会\n//调用 setter\nSystem.out.println(x.getTemperature());  //这调用了\
  \ getter。\nx.setTemperature(-65);     //这调用了 setter。\nSystem.out.println(x.getTemperature());\
  \  //这调用了 getter。\nx.temperature = -50;                //这是不允许的！\nSystem.out.println(x.temperature);\
  \  //这也不允许的！\n```}}\n\n#### 练习 39.5-1 罗马数字\n\n罗马数字如表所示。\n\n| 数字 | 罗马数字 |\n| ---\
  \ | --- |\n| 1 | I |\n| 2 | II |\n| 3 | III |\n| 4 | IV |\n| 5 | V |\n\n执行以下操作：\n\
  \ni.编写一个名为 `Romans` 的类，它包含：\n    a. 一个名为 `number` 的私有整数字段。\n    b. 分别名为 `getNumber`\
  \ 和 `setNumber` 的 getter 和 setter。它们将用于以整数格式获取和设置字段 `number` 的值。当 `number` 无法识别时，setter\
  \ 必须抛出一个错误。\n    c. 分别名为 `getRoman` 和 `setRoman` 的 getter 和 setter。它们将用于以罗马数字格式获取和设置字段\
  \ `number` 的值。当罗马数字无法识别时，setter 必须抛出一个错误。\nii.使用上述类编写一个 Java 程序，显示与值 3 对应的罗马数字，以及与罗马数字值“V”对应的数字。\n\
  \n解决方案\n\n整数格式的 `number` 字段的 getter 和 setter 非常简单，因此没有什么特殊的需要解释的。然而，罗马数字格式的 `number`\
  \ 字段的 getter 和 setter 需要一些解释。\n\n罗马数字格式字段 `number` 的 getter 可以写如下：\n\n```java\n\
  //定义 getter\npublic String getRoman() {\n    String retValue = \"\";\n    if (this.number\
  \ == 1)\n        retValue = \"I\";\n    else if (this.number == 2)\n        retValue\
  \ = \"II\";\n    else if (this.number == 3)\n        retValue = \"III\";\n    else\
  \ if (this.number == 4)\n        retValue = \"IV\";\n    else if (this.number ==\
  \ 5)\n        retValue = \"V\";\n    return retValue;\n}\n```\n\n然而，这种方法非常长，而且如果你想扩展程序以处理更多的罗马数字，它可能会变得更长。所以，既然你现在已经了解很多\
  \ hashmaps，你可以使用一种更好的方法，如下代码片段所示。\n\n```java\n//定义 getter\npublic String getRoman()\
  \ {\n    HashMap<Integer, String> number2roman = new HashMap<>(\n        Map.of(1,\
  \ \"I\", 2, \"II\", 3, \"III\", 4, \"IV\", 5, \"V\")\n    );\n    return number2roman.get(this.number);\n\
  }\n```\n\n相应地，setter 可以如下：\n\n```java\n//定义 setter\npublic void setRoman(String\
  \ key) throws Exception {\n    HashMap<String, Integer> roman2number = new HashMap<>(\n\
  \        Map.of(\"I\", 1, \"II\", 2, \"III\", 3, \"IV\", 4, \"V\", 5)\n    );\n\
  \    if (roman2number.containsKey(key)) {\n        this.number = roman2number.get(key);\n\
  \    } else {\n        throw new Exception(\"Roman numeral not recognized\");\n\
  \    }\n}\n```\n\n![](img/00002.jpeg) 当哈希 map `roman2number` 包含指定的 `key` 时，Java\
  \ 内置方法 `containsKey(key)` 返回 true。\n\n![](img/00002.jpeg) 语句 `if (roman2number.containsKey(key))`\
  \ 等于语句 `if (roman2number.containsKey(key) == true)`。\n\n最终的 Java 程序如下：\n\n![](img/00001.gif)\
  \ Project_39_5_1\n\n```java\nclass Romans {\n    private int number;\n    //定义 getter\n\
  \    public int getNumber() {\n        return this.number;\n    }\n    //定义 setter\n\
  \    public void setNumber(int value) throws Exception {\n        if (value >= 1\
  \ && value <= 5) {\n            this.number = value;\n        } else {\n       \
  \     throw new Exception(\"Number not recognized\");\n        }\n    }\n    //定义\
  \ getter\n    public String getRoman() {\n        HashMap<Integer, String> number2roman\
  \ = new HashMap<>(\n            Map.of(1, \"I\", 2, \"II\", 3, \"III\", 4, \"IV\"\
  , 5, \"V\")\n        );\n        return number2roman.get(this.number);\n    }\n\
  \    //定义 setter\n    public void setRoman(String key) throws Exception {\n    \
  \    HashMap<String, Integer> roman2number = new HashMap<>(\n            Map.of(\"\
  I\", 1, \"II\", 2, \"III\", 3, \"IV\", 4, \"V\", 5)\n        );\n        if (roman2number.containsKey(key))\
  \ {\n            this.number = roman2number.get(key);\n        } else {\n      \
  \      throw new Exception(\"Roman numeral not recognized\");\n        }\n    }\n\
  }\n\npublic class Class_39_5_1 {\n    public static void main(String[] args) throws\
  \ Exception {\n        Romans x = new Romans();\n        x.setNumber(3);\n     \
  \   System.out.println(x.getNumber());  //它显示: 3\n        System.out.println(x.getRoman());\
  \   //它显示: III\n        x.setRoman(\"V\");\n        System.out.println(x.getNumber());\
  \  //它显示: 5\n        System.out.println(x.getRoman());   //它显示: V\n    }\n}\n```\n\
  \n### 39.6 方法可以调用同一类中的另一个方法吗？\n\n在 段落 37.2 中你学习了子程序可以调用另一个子程序。显然，对于方法来说也是如此——方法可以调用同一类的另一个方法！毕竟方法无非是子程序而已！所以，如果你想让一个方法调用同一类的另一个方法，你应该使用\
  \ `this` 关键字跟在你想要调用的方法前面，如下例所示。\n\n![](img/00001.gif) Project_39_6\n\n```java\n\
  class JustAClass {\n    public void foo1() {\n        System.out.println(\"foo1\
  \ was called\");\n        this.foo2();\n    }\n    public void foo2() {\n      \
  \  System.out.println(\"foo2 was called\");\n    }\n}\n\npublic class Class_39_6\
  \ {\n    public static void main(String[] args) {\n        JustAClass x = new JustAClass();\n\
  \        x.foo1();\n    }\n}\n```\n\n#### 练习 39.6-1 数\n\n执行以下操作：\n\ni.编写一个名为 `DoingMath`\
  \ 的类，它包含：\n    a. 一个名为 `square` 的私有方法，它通过形式参数列表接受数字并计算平方，显示“XX 的平方是 YY”，`XX` 和 `YY`\
  \ 需要替换为实际值。\n    b. 一个名为 `square_root` 的私有方法，它通过形式参数列表接受数字并计算平方根，显示“XX 的平方根是 YY”，`XX`\
  \ 和 `YY` 需要替换为实际值。然而，如果数字小于 0，该方法必须显示错误消息。\n    c. 一个名为 `display_results` 的公共方法，它通过形式参数列表接受数字并调用方法\
  \ `square()` 和 `square_root()` 来显示结果。\nii.使用上述类编写一个 Java 程序，提示用户输入一个数字。程序然后显示该数字的平方和平方根。\n\
  \n解决方案\n\n这个练习非常简单。`square()`、`square_root()` 和 `display_results()` 方法必须在形式参数列表中有一个形式参数以便接受传递的值。解决方案如下。\n\
  \n![](img/00001.gif) Project_39_6_1\n\n```java\nclass DoingMath {\n    private void\
  \ square(double x) {\n        System.out.println(\"The square of \" + x + \" is\
  \ \" + (x * x));\n    }\n    private void square_root(double x) {\n        if (x\
  \ < 0) {\n            System.out.println(\"Cannot calculate square root\");\n  \
  \      } else {\n            System.out.println(\"Square root of \" + x + \" is\
  \ \" + Math.sqrt(x));\n        }\n    }\n    public void display_results(double\
  \ x) {\n        this.square(x);\n        this.square_root(x);\n    }\n}\n\npublic\
  \ class Class_39_6_1 {\n    static Scanner cin = new Scanner(System.in);\n    public\
  \ static void main(String[] args) {\n        double b;\n        DoingMath dm = new\
  \ DoingMath();\n        System.out.print(\"Enter a number: \");\n        b = Double.parseDouble(cin.nextLine());\n\
  \        dm.display_results(b);\n    }\n}\n```\n\n### 39.7 类继承\n\n类继承是 OOP 的核心概念之一。它允许你使用另一个类作为基类来编写类。当一个类基于另一个类时，程序员们会说“它继承了另一个类”。被继承的类被称为父类、基类或超类。执行继承的类被称为子类、派生类或子类。\n\
  \n\n\n\n子类会自动继承父类的所有方法和字段。然而，最棒的部分是你可以为子类添加额外的特征（方法或字段）。因此，当你需要几个并不完全相同但具有许多共同特征的类时，就会使用继承。要实现这一点，你可以按照以下步骤操作：首先，编写一个包含所有共同特征的父类；其次，编写从父类继承了所有共同特征的子类；最后，为每个子类添加额外的特征。毕竟，正是这些额外的特征区分了子类和其父类的区别！\n\
  \n假设你想编写一个程序来跟踪学校里的老师和学生。他们有一些共同的特征，例如姓名和年龄，但他们也有一些特定的特征，例如老师的工资和学生的成绩，这些特征是不共有的。你在这里可以这样做：编写一个名为\
  \ `SchoolMember` 的父类，其中包含老师和学生的所有共同特征。然后，你可以编写两个名为 `Teacher` 和 `Student` 的子类，分别用于老师和学生。这两个子类都可以继承\
  \ `SchoolMember` 类，但必须相应地在子类 `Teacher` 和 `Student` 中添加名为 `salary` 和 `grades` 的额外字段。\n\
  \n这里是父类 `SchoolMember` 的示例：\n\n```java\nclass SchoolMember {\n    public String\
  \ name;\n    public int age;\n    //定义构造函数\n    public SchoolMember(String name,\
  \ int age) {\n        this.name = name;\n        this.age = age;\n        System.out.println(\"\
  A school member was initialized\");\n    }\n}\n```\n\n如果你想让一个类继承 `SchoolMember`\
  \ 类，必须按照如下方式定义：\n\n```java\nclass Name extends SchoolMember {\n    //为 Teacher 类定义额外的字段\n\
  \    //定义构造函数\n    public Teacher(String name, int age [, …]) {\n        super(name,\
  \ age); //调用 SchoolMember 类的构造函数\n        // 语句或语句块\n    }\n}\n```\n其中 `Name` 是子类的名称。\n\
  \n因此，`Teacher` 类可以如下：\n\n```java\nclass Teacher extends SchoolMember {\n    public\
  \ double salary; // 这是 Teacher 类的一个额外字段\n    //定义构造函数\n    public Teacher(String\
  \ name, int age, double salary) {\n        super(name, age); // 调用 SchoolMember\
  \ 类的构造函数\n        this.salary = salary;\n        System.out.println(\"A teacher\
  \ was initialized\");\n    }\n}\n```\n\n![](img/00002.jpeg) 语句 `super(name, age)`\
  \ 调用了 `SchoolMember` 类的构造函数，并初始化了 `Teacher` 类 `name` 和 `age` 字段。\n\n同样，`Student`\
  \ 类如下：\n\n```java\nclass Student extends SchoolMember {\n    public int[] grades\
  \ = new int[3]; // 这是 Student 类的一个额外字段\n    //定义构造函数\n    public Student(String\
  \ name, int age, int[] grades) {\n        super(name, age); // 调用 SchoolMember 类的构造函数\n\
  \        this.grades = grades;\n        System.out.println(\"A student was initialized\"\
  );\n    }\n}\n```\n\n![](img/00002.jpeg) 语句 `super(name, age)` 调用了 `SchoolMember`\
  \ 类的构造函数，并初始化了 `Student`  `name` 和 `age` 字段。\n\n完整的 Java 程序如下。请注意每个字段都包含了 getter\
  \ 和 setter 方法。\n\n![](img/00001.gif) \n\n```java\nProject_39_7\nclass SchoolMember\
  \ {\n    public String name;\n    public int age;\n    //定义构造函数\n    public SchoolMember(String\
  \ name, int age) {\n        this.name = name;\n        this.age = age;\n       \
  \ System.out.println(\"A school member was initialized\");\n    }\n}\n\nclass Teacher\
  \ extends SchoolMember {\n    public double salary; // 这是 Teacher 类的一个额外字段\n   \
  \ //定义构造函数\n    public Teacher(String name, int age, double salary) {\n        super(name,\
  \ age); //调用 SchoolMember 类的构造函数\n        this.salary = salary;\n        System.out.println(\"\
  A teacher was initialized\");\n    }\n}\n\nclass Student extends SchoolMember {\n\
  \    public int[] grades = new int[3]; // 这是 Student 类的一个额外字段\n    //定义构造函数\n  \
  \  public Student(String name, int age, int[] grades) {\n        super(name, age);\
  \ // 调用 SchoolMember 类的构造函数\n        this.grades = grades;\n        System.out.println(\"\
  A student was initialized\");\n    }\n}\n\npublic class Class_39_7 {\n    public\
  \ static void main(String[] args) {\n        Teacher teacher1 = new Teacher(\"Mr.\
  \ John Scott\", 43, 35000);\n        Teacher teacher2 = new Teacher(\"Mrs. Ann Carter\"\
  , 5, 32000);\n        Student student1 = new Student(\"Mark Nelson\", 14, new int[]\
  \ {90, 95, 92});\n        Student student2 = new Student(\"Mary Morgan\", 13, new\
  \ int[] {92, 97, 94});\n        System.out.println(teacher1.name);\n        System.out.println(teacher1.age);\n\
  \        System.out.println(teacher1.salary);\n        System.out.println(student2.name);\n\
  \        System.out.println(student2.age);\n        for (int grade : student2.grades)\
  \ {\n            System.out.println(grade);\n        }\n    }\n}\n```\n\n![](img/00002.jpeg)\
  \ 注意参数 `grades` 是如何传递给构造函数的。\n\n### 39.8 复习题：判断题\n\n对以下陈述判断对错。\n\n1. 在编写大型程序时，过程化编程优于面向对象编程。\n\
  2. 面向对象编程关注对象。\n3. 对象将数据和功能结合在一起。\n4. 面向对象编程使得代码更容易维护。\n5. 你可以在不使用类的情况下创建对象。\n6.\
  \ 创建类的过程被称为“安装”。\n7. 在 OOP 中，你总是要创建两个相同的实例。\n8. 构造方法在实例化时执行。\n9. 当你创建同一个类的实例时，该类的构造方法会执行两次。\n\
  10. 字段前的 `private` 关键字表示该字段可以从外部访问。\n11. 方法前的 `public` 关键字表示该方法可以从外部调用。\n12. 面对象的原则规定数据应该是隐藏的，防止意外修改。\n\
  13. Getter 和 setter 方法为读取、写入或计算字段值提供了灵活机制。\n14. Getter 和 setter 方法暴露了类的内部实现。\n15.\
  \ 类继承是 OOP 的核心概念之一。\n16. 当一个类被继承时，它被称为“派生类”。\n17. 父类会自动继承子类的所有方法和字段。\n\n### 39.9\
