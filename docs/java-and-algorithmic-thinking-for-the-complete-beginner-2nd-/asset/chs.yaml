  \n## 第 27 章\n## 嵌套循环结构\n\n### 27.1 什么是嵌套循环？\n\n嵌套循环是在另一个内部内部循环，或者说外层循环中的内层循环。\n\n\
  外层循环控制内层循环完整迭代次数。这意味着外层循环的第一次迭代触发内层循环运行其完整周期。\n\n```java\nfor (i = 0; i <= 2; i++)\
  \ {\n    for (j = 0; j <= 3; j++) {\n        //内层循环\n    }\n}\n```\n\n内层循环和外层循环不需要是相同类型。例如，`for`\
  \ 语句可以嵌套（包含）`while` 语句，反之亦然。\n\n#### 练习 27.1-1 说“Hello Zeus”。统计迭代次数。\n\n找出“Hello\
  \ Zeus” 显示次数。\n\n```java\npublic static void main(String[] args) {\n    int i, j;\n\
  \    for (i = 0; i <= 2; i++) {\n        for (j = 0; j <= 3; j++) {\n          \
  \  System.out.println(\"Hello Zeus\");\n        }\n    }\n}\n```\n\n\n\n因此，消息“Hello\
  \ Zeus”共显示了 `3 × 4 = 12` 次。\n\n![](img/00003.jpeg)外层循环控制内层循环完整迭代的次数！\n\n### 练习 27.1-2\
  \ 创建追踪表\n\n对于以下代码段，确定变量 `a` 在结束时包含的值。\n\n```java\nint a, i, j;\na = 1;\ni = 5;\n\
  while (i < 7) {\n    for (j = 1; j <= 3; j += 2) {\n        a = a * j + i;\n   \
  \ }\n    i++;\n}\nSystem.out.println(a);\n```\n\n#### 答案\n\n追踪表所示。\n\n| 步骤 | 语句\
  \ | 备注 | a | i | j |\n| --- | --- | --- | --- | --- | --- |\n| 1 | `a = 1` | | 1\
  \ | ? | ? |\n| 2 | `i = 5` | | 1 | 5 | ? |\n| 3 | `i < 7` | 结果为 true | | | |\n|\
  \ 4 | `j = 1` | | 1 | 5 | 1 |\n| 5 | `j <= 3` | 结果为 true | | | |\n| 6 | `a = a *\
  \ j + i` | | 6 | 5 | 1 |\n| 7 | `j = j + 2` | | 6 | 5 | 3 |\n| 8 | `j <= 3` | 结果为\
  \ true | | | |\n| 9 | `a = a * j + i` | | 23 | 5 | 3 |\n| 10 | `j = j + 2` | | 23\
  \ | 5 | 5 |\n| 11 | `j <= 3` | 结果为 false | | | |\n| 12 | `i = i + 1` | | 23 | 6\
  \ | 5 |\n| 13 | `i < 7` | 结果为 true | | | |\n| 14 | `j = 1` | | 23 | 6 | 1 |\n| 15\
  \ | `j <= 3` | 结果为 true | | | |\n| 16 | `a = a * j + i` | | 29 | 6 | 1 |\n| 17 |\
  \ `j = j + 2` | | 29 | 6 | 3 |\n| 18 | `j <= 3` | 结果为 true | | | |\n| 19 | `a =\
  \ a * j + i` | | 93 | 6 | 3 |\n| 20 | `j = j + 2` | | 93 | 6 | 5 |\n| 21 | `j <=\
  \ 3` | 结果为 false | | | |\n| 22 | `i = i + 1` | | 93 | 7 | 5 |\n| 23 | `i < 7` |\
  \ 结果为 false | | | |\n| 24 | `.println(a)` | 显示: 93 | | | |\n\n在程序结束时，变量 `a` 包含值\
  \ `93`。\n\n### 27.2 适用于嵌套循环的规则\n\n除了适用于 `for`-循环的四条规则外，在编写嵌套循环的程序时，你必须遵循两条额外的规则，因为它们可以避免意外的副作用。\n\
  \n►规则 1：内层循环必须完全在外层循环内部开始并结束，这意味着循环不能重叠。\n►规则 2：外层循环和内层（嵌套）循环不能使用同一个计数变量。\n\n####\
  \ 练习 27.2-1 违反第一规则\n\n设计一个流程图片段，违反嵌套循环的第一规则，该规则规定：“内层循环必须完全在外层循环内部开始并结束”。\n\n####\
  \ 答案\n\n以下流程图片段违反了嵌套循环的第一规则。\n\n![Image](img/00260.gif)\n\n如果你尝试遵循执行流，你可以看到它是如何流畅地执行\
  \ `5 × 10 = 50` 次迭代的。没有人能看出这个流程图是错误的；相反，它是完全正确的。然而，问题在于，这个流程图完全不可读。一眼看上去，没人看出这个流程图到底在做什么。此外，这种结构不符合你所学过的任何已知的循环控制结构，因此它无法直接变成\
  \ Java 程序。请尽量避免这种嵌套循环！\n\n#### 练习 27.2-2 统计总迭代次数\n\n找到消息“Hello”显示的次数。\n\n```java\n\
  for (i = 1; i <= 3; i++) {\n    for (i = 5; i >= 1; i--) {\n        System.out.println(\"\
  Hello\");\n    }\n}\n```\n\n#### 答案\n\n一眼看去，人们会认为“Hello”显示了 `3 × 5 = 15` 次。然而，仔细观察会发现事情并不总是如此。这个程序违反了嵌套循环的第二规则，该规则规定：“外层循环和内层（嵌套）循环不能使用同一个计数变量”。让我们设计相应的流程图。\n\
  \n![Image](img/00261.jpeg)\n\n如果你尝试遵循该流程图的执行，你会发现当内层循环完成所有迭代时，变量 `i` 包含值 `0`。然后，变量\
  \ `i` 加 1，外层循环再次重复。这个过程会持续下去，因为变量 `i` 永远无法超过外层循环要求的 `3`。因此，“Hello”显示了无限次。\n\n###\
  \ 27.3 复习题：判断题\n\n对以下每一项选择对或错。\n\n1. 嵌套循环是外层循环中的内层循环。\n2. 可以在测试循环中嵌套中间循环。\n3. 循环结构的最大层数是四。\n\
  4. 当两个循环嵌套时，后启动的循环必须先完成。\n5. 当两个循环嵌套时，它们不能使用同一个变量。\n6. 在以下代码段中：\n```java\nfor (i\
  \ = 1; i <= 3; i++) {\n    for (j = 1; j <= 3; j++) {\n        System.out.println(\"\
  Hello\");\n    }\n}\n```\n“Hello”显示了六次。\n7. 在以下代码段中：\n```java\nfor (i = 0; i <=\
  \ 1; i++) {\n    for (j = 1; j <= 3; j++) {\n        for (k = 1; k <= 4; k += 2)\
  \ {\n            System.out.println(\"Hello\");\n        }\n    }\n}\n```\n“Hello”显示了十二次。\n\
  8. 在以下代码段中：\n```java\nfor (i = 1; i <= 3; i++) {\n    for (i = 3; i >= 1; i--) {\n\
  \        System.out.println(\"Hello\");\n    }\n}\n```\n“Hello”显示了无限次。\n9. 在以下代码段中：\n\
  ```java\nfor (i = 0; i <= 2; i++) {\n    j = 1;\n    do {\n        System.out.println(\"\
  Hello\");\n        j++;\n    } while (j < 4);\n}\n```\n“Hello”显示了九次。\n10. 在以下代码段中：\n\
  ```java\nint s, a;\ns = 0;\nwhile (!false) {\n    while (!false) {\n        a =\
  \ Integer.parseInt(cin.nextLine());\n        if (a >= -1) break;\n    }\n    s +=\
  \ a;\n}\nSystem.out.println(s);\n```\n至少有一个测试循环。\n\n### 27.4 复习题：单选择\n\n为以下每一项选择正确答案。\n\
