  \    }\n}\n```\n\n现在，如果你完全理解了上一个 for 循环的工作原理，请看接下来的代码片段。它与上一个 for 循环等效，但执行效率更高，因为它使用的变量更少！\n\
  \n```java\nfor (i = 0; i <= STUDENTS - 1; i++) {\n    System.out.println(names[i]\
  \ + \"  \" + grades_table.get(grades[i]));\n}\n```\n\n### 33.5 从二维数组创建一个一维数组\n\n\
  为了更容易地理解如何从二维数组创建一个一维数组，让我们来看一个例子。\n\n编写一个程序，从现有的 3 × 4 二维数组（如下所示）创建一个包含 12 个元素的一维数组，具体要求如下：二维数组第一列的元素必须放置在一维数组的前三个位置，第二列的元素必须放置在接下来的三个位置，以此此类推。\n\
  \n二维 3 × 4 数组和新的一维数组如下。\n\n![Image](img/00350.gif)\n\n接下来的 Java 程序通过遍历列来创建新的一维数组，这样会更方便。它使用了示例中给出的现有数组。\n\
  \n![](img/00001.gif)\n\n```java\nstatic final int ROWS = 3;\nstatic final int COLUMNS\
  \ = 4;\npublic static void main(String[] args) {\n    int i, j, k;\n    int a[][]\
  \ = {\n        {5, 9, 3, 2},\n        {11, 12, 4, 1},\n        {10, 25, 22, 18}\n\
  \    };\n    int[] b = new int[ROWS * COLUMNS];\n    k = 0; // 这是新数组的索引。\n    for\
  \ (j = 0; j <= COLUMNS - 1; j++) { // 遍历列\n        for (i = 0; i <= ROWS - 1; i++)\
  \ {\n            b[k] = a[i][j];\n            k++;\n        }\n    }\n    for (k\
  \ = 0; k <= b.length - 1; k++) {\n        System.out.print(b[k] + \"\\t\");\n  \
  \  }\n}\n```\n\n![](img/00002.jpeg) 注意最后一个 for 循环中的 `length` 属性。它包含数组的元素个数。在这个练习中，它的值为\
  \ 12。与你在第 14.3 节中学到的 `length()` 方法不同，`length` 是一个属性。因此，你不能在末尾加上括号。你将在第 8 节中学习更多关于属性的知识。\n\
  \n### 33.6 从一维数组创建一个二维数组\n\n为了更容易地理解如何从一维数组创建一个二维数组，让我们来看一个例子。\n\n编写一个 Java 程序，从现有的包含\
