  \n### 34.4 数组排序\n\n排序算法是计算机科学中一个重要的课题。排序算法可以按升序或降序排列数组。有很多排序算法，每种都有其特定的优缺点。大多数排序算法通过比较元素来工作。\n\
  \n其中一些：\n- 冒泡排序\n- 改进的冒泡排序\n- 选择排序\n- 插入排序\n- 堆排序\n- 归并排序\n- 快速排序\n\n就效率而言，快速排序被认为是最快的之一。冒泡排序可能是效率最低的，但被广泛用于教学。主要思想（当要求按升序排列数组时）是重复地将数组中的最小元素移动到索引最低的位置。工作原理如下：算法遍历数组元素，比较每对相邻元素，如果它们的顺序错误，则交换它们的内容。\n\
  \n#### 练习 34.4-1 冒泡算法 – 数值一维数组排序\n\n编写一个 Java 程序，让用户向数组输入 20 个数值，然后使用冒泡排序算法将其按升序排序。\n\
  \n解答\n\n最小值是 5。根据冒泡排序算法，这个值必须逐渐“冒泡”或“上升”到位置 0，就像可乐中的气泡一样。当值 5 被移动到位置 0 后，下一个最小值是\
  \ 8。现在，值 8 必须“冒泡”到位置 1。接下来是 12，它必须“冒泡”到位置 2，依此类推。这个过程重复，直到所有元素都放置在正确的位置。\n\n但是这种“冒泡”是如何使用算法完成的？让我们更详细地查看整个过程。对于之前包含六个元素的数组\
  \ A，必须执行五次遍历。\n\n第一次遍历\n\n第 1 次比较\n\n初始，对索引位置 4 和 5 的元素进行比较。由于值 12 小于 49，这两个元素交换内容。\n\
  \n第 2 次比较\n\n对索引位置 3 和 4 的元素进行比较。由于值 12 不小于 5，不进行交换。\n\n\n\n比较索引位置 1 和 2 处的元素。由于值\
  \ 5 小于值 25，这两个元素交换了它们的内容。\n\n### 第 5 次比较\n\n比较索引位置 0 和 1 处的元素。由于值 5 小于值 17，这两个元素交换了它们的内容。\n\
  \n![Image](img/00364.gif)\n\n第一轮已经完成，但正如你所看到的，数组尚未排序。唯一一个被放置在正确位置的值是 5。然而，由于后续还有更多轮，因此不需要值\
  \ 5 参与后续的比较。在接下来的一轮中，将执行少一次的比较——即四次比较。\n\n## 第二轮\n\n### 第 1 次比较\n\n比较索引位置 4 和 5\
  \ 处的元素。由于值 49 不小于值 12，因此没有进行交换。\n\n### 第 2 次比较\n比较索引位置 3 和 4 处的元素。由于值 12 不小于值 8，因此没有进行交换。\n\
  \n### 第 3 次比较\n比较索引位置 2 和 3 处的元素。由于值 8 小于值 25，这两个元素交换了它们的内容。\n\n### 第 4 次比较\n比较索引位置\
  \ 1 和 2 处的元素。由于值 8 小于值 17，这两个元素交换了它们的内容。\n\n![Image](img/00365.gif)\n\n第二轮已经完成，值\
  \ 8 已被放置在正确的位置。然而，由于后续还有更多轮，因此不需要值 8（当然还有值 5）参与后续的比较。在接下来的一轮中，将执行少一次的比较——即三次比较。\n\
  \n## 第三轮\n\n### 第 1 次比较\n比较索引位置 4 和 5 处的元素。由于值 49 不小于值 12，因此没有进行交换。\n\n### 第 2 次比较\n\
  比较索引位置 3 和 4 处的元素。由于值 12 小于值 25，这两个元素交换了它们的内容。\n\n### 第 3 次比较\n比较索引位置 2 和 3 处的元素。由于值\
  \ 12 小于值 17，这两个元素交换了它们的内容。\n\n![Image](img/00366.gif)\n\n第三轮已经完成，值 12 已被放置在正确的位置。如之前所示，由于后续还有更多轮，因此不需要值\
  \ 12（当然还有值 5 和 8）参与后续的比较。在接下来的一轮中，将执行少一次的比较——即两次比较。\n\n## 第四轮\n\n### 第 1 次比较\n比较索引位置\
  \ 4 和 5 处的元素。由于值 49 不小于值 25，因此没有进行交换。\n\n### 第 2 次比较\n比较索引位置 3 和 4 处的元素。由于值 25 不小于值\
  \ 17，因此没有进行交换。\n\n![Image](img/00367.gif)\n\n第四轮已经完成，值 17 已被放置在正确的位置。如之前所示，由于后面还有最后一轮，因此不需要值\
  \ 17（当然还有值 5、8 和 12）参与后续的比较。在接下来的最后一轮轮中，将执行少一次的比较——即一次比较。\n\n## 第五轮\n\n### 第 1 次比较\n\
  比较索引位置 4 和 5 处的元素。由于值 49 不小于值 25，因此没有进行交换。\n\n![Image](img/00368.gif)\n\n第五轮已经完成，最后两个值（25\
  \ 和 49）已就放置在正确的位置。冒泡排序算法已结束，数组已按升序排序！\n\n现在你需要一个 Java 程序来完成上述整个过程。让我们使用“从内层到外层”的方法。下面显示仅执行第一轮的代码片段。请注意，这是内层（嵌套）循环控制结构。假设变量\
  \ `m` 包含值 0。\n\n```java\nfor (n = ELEMENTS - 1; n >= m; n--) {\n    if (a[n] < a[n\
  \ - 1]) {\n        temp = a[n];\n        a[n] = a[n - 1];\n        a[n - 1] = temp;\n\
  \    }\n}\n```\n\n![](img/00002.jpeg)在第一轮中，变量 `m` 必须包含值 0。这确保了在最后迭代中，比较的元素是位置 1\
  \ 和 0 处的元素。\n\n![](img/00003.jpeg)交换两个元素的内容使用了你已经学过的方法！请回想那两杯橙汁和柠檬汁。如果这让你没有什么记忆，你需要刷新记忆并重读对应的练习\
  \ 8.1-2。\n\n如果重新执行之前的代码片段，就可以进行第二轮。然而，变量 `m` 需要包含值 1。这将确保位置 0 处的元素不再被比较。同样，对于第三轮，可以重新执行之前的代码片段，但变量\
  \ `m` 需要包含值 2。如前所述，由于后续还有更多轮，因此不需要值 12（当然还有值 5 和 8）参与后续的比较。在接下来的一轮中，将执行少一次的比较——即两次比较。根据原因，之前的代码片段需要执行五次，每次\
  \ `m` 增加 1。使用冒泡排序数组 `a` 的代码片段如下：\n\n```java\nfor (m = 1; m <= ELEMENTS - 1; m++)\
  \ {\n    for (n = ELEMENTS - 1; n >= m; n--) {\n        if (a[n] < a[n - 1]) {\n\
  \            temp = a[n];\n            a[n] = a[n - 1];\n            a[n - 1] =\
  \ temp;\n        }\n    }\n}\n```\n\n\n\nfor (i = 0; i <= ELEMENTS - 1; i++) {\n\
  \    System.out.print(a[i] + \"\\t\");\n}\n\n\n\n现在，让我们来看看需要修改哪些地方以便算法能够按降序排列。你还记得冒泡排序实际上是如何运作的吗？元素逐渐“浮”到索引最小的位置，就像可乐中玻璃杯里的气泡上升一样。在这次练习中，你想要让较大的元素（而不是较小的元素）“浮”到较低的索引位置。因此，你只需要简单地反转决策控制结构中的比较运算符即可！\n\
  \n以下是降序排序字母数字型值的代码片段。\n\n```java\nString temp_str;\nfor (m = 1; m <= ELEMENTS -\
  \ 1; m++) {\n    for (n = ELEMENTS - 1; n >= m; n--) {\n        if (a[n].compareTo(a[n\
  \ - 1]) > 0) {\n            temp_str = a[n];\n            a[n] = a[n - 1];\n   \
  \         a[n - 1] = temp_str;\n        }\n    }\n}\n```\n\n### 练习 34.4-3 在保持与第二个数组关系的同时对一维数组进行排序\n\
  \n编写一个 Java 程序，让用户输入 20 个湖的名称及其对应的平均面积。程序必须使用冒泡排序算法按平均面积升序对它们进行排序。\n\n#### 解决方案\n\
  \n在本次练习中，你需要以下两个数组。\n\n![Image](img/00370.gif)\n\n如果你想在保持两个数组元素之间关系的情况下排序数组 `areas`，你必须同样重新排列数组\
  \ `names` 的元素。这意味着每当 `areas` 数组的两个元素交换内容时，`names` 数组对应的元素也必须交换内容。Java 程序如下。\n\n\
  ![](img/00001.gif)\n\n```java\nClass_34_4_3static final int LAKES = 20;\npublic\
  \ static void main(String[] args) {\n    int i, m, n;\n    double temp;\n    String\
  \ temp_str;\n    String[] names = new String[LAKES];\n    double[] areas = new double[LAKES];\n\
  \    for (i = 0; i <= LAKES - 1; i++) {\n        names[i] = cin.nextLine();\n  \
  \      areas[i] = Double.parseDouble(cin.nextLine());\n    }\n    for (m = 1; m\
  \ <= LAKES - 1; m++) {\n        for (n = LAKES - 1; n >= m; n--) {\n           \
  \ if (areas[n] < areas[n - 1]) {\n                temp = areas[n];\n           \
  \     areas[n] = areas[n - 1];\n                areas[n - 1] = temp;\n         \
  \       temp_str = names[n];\n                names[n] = names[n - 1];\n       \
  \         names[n - 1] = temp_str;\n            }\n        }\n    }\n    for (i\
  \ = 0; i <= LAKES - 1; i++) {\n        System.out.println(names[i] + \"\\t\" + areas[i]);\n\
  \    }\n}\n```\n\n![](img/00002.jpeg) 注意，你不能使用变量 `temp` 来交换 `names` 数组中两个元素的内容；这是因为变量\
  \ `temp` 被声明为 `double`，而数组 `names` 包含字符串。因此，你需要另一个声明为 `string` 的变量（`temp_str`）用于此目的。\n\
  \n### 练习 34.4-4 对姓和名进行排序\n\n编写一个 Java 程序，提示用户输入 100 个人的姓和名，然后按姓的字母顺序对它们进行排序显示。此外，如果两个或多个人有相同的姓，他们的名也必须按字母顺序显示。\n\
  \n#### 解决方案\n\n你已经知道如何在保持与第二个数组元素之间关系的情况下对数组进行排序。现在，你必须处理第一个数组中两个姓相等的情况。根据练习的描述，第二个数组中对应的名也必须按字母顺序排序。例如，以下数组\
  \ `last_nm` 包含了 100 个人的姓。它是按字母顺序排序的，并且包含了三次“Parker”这个姓。数组 `first_nm` 中对应的名“Andrew”、“Anna”和“Chloe”也同样是按字母顺序排序的。\n\
  \n![Image](img/00371.gif)\n\n为了方便起见，这里再次展示了冒泡排序算法的基本版本。请注意，该算法保留了数组 `last_nm` 和\
  \ `first_nm` 元素之间的关系。\n\n```java\nfor (m = 1; m <= PEOPLE - 1; m++) {\n    for (n\
  \ = PEOPLE - 1; n >= m; n--) {\n        if (last_nm[n].compareTo(last_nm[n - 1])\
  \ < 0) {\n            temp_str = last_nm[n];\n            last_nm[n] = last_nm[n\
  \ - 1];\n            last_nm[n - 1] = temp_str;\n            temp_str = first_nm[n];\n\
  \            first_nm[n] = first_nm[n - 1];\n            first_nm[n - 1] = temp_str;\n\
  \        }\n    }\n}\n```\n\n![](img/00002.jpeg) 注意变量 `temp_str` 用于交换 `last_nm`\
  \ 和 `first_nm` 两个数组元素的内容。由于两个数组都包含字符串，这是可以的。但要解决这个练习，必须对冒泡排序算法进行调整。根据这个基本冒泡排序算法，当位置\
  \ `n` 的姓“小于”位置 `n - 1` 的姓时，算法会交换内容。然而，当位置 `n` 的姓等于位置 `n - 1` 的姓时，算法必须检查名是否顺序正确。如果不是，则必须交换。调整后的冒泡排序所示：\n\
