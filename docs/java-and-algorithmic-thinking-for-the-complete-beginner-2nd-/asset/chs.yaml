  YES\"));\n}\n```\n\n### 练习 30.1-6 查找数字之和\n\n编写一个 Java 程序，让用户输入一个整数，然后计算其各个数字的和。\n\
  \n在[3.1-2]中，你学习了当总位数已知时如何拆分整数的数字。在本练习中，允许用户输入任何值，无论大小；因此，总位数可能是未知的。为了解决这个练习，可以使用循环控制结构。然而，有两种方法可以使用可以使用。\n\
  \n#### 第一种方法\n\n在这种方法中，核心思想是每次迭代都分离出一个数字。但你并不知道必须执行的总迭代次数，因为这个数字取决于给定的整数。所以，这是一个死胡同吗？当然不是！在循环内部，给定的整数可以不断“变小”，直到变为零。零的值可以停止循环结构的迭代。例如，如果给定的数字是\
  \ 4753，它在第一次迭代中可以变为 475，然后是 4，最后是 0。当它变为 0 时，迭代停止。\n\n让我们尝试通过以下流程图理解建议的解决方案。某些语句以通用形式编写。\n\
  \n![Image](img/00288.gif) `digit ← Isolate last digit of variable x.` 使用所示的 `MOD\
  \ 10` 操作写入。\n\n`digit ← x MOD 10`\n\n整个概念依赖于 `x ← Keep all except last digit of\
  \ variable.` 这使得变量 `x` 的值归零，执行流随后退出循环。编写这条语句可以使用所示的 `DIV 10` 操作。\n\n`x ← x DIV 10`\n\
  \n相应，Java 程序变为：\n\n![](img/00001.gif) `Class_30_1_6a`\n```\npublic static void main(String[]\
  \ args) {\n    int x, s, digit;\n    x = Integer.parseInt(cin.nextLine());\n   \
  \ s = 0;\n    while (x != 0) {\n        digit = x % 10;\n        s = s + digit;\n\
  \        x = (int)(x / 10);\n    }\n    System.out.println(s);\n}\n```\n[/content]\n\
