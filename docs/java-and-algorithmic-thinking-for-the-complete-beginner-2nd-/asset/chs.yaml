  \ 求正整数的平均值\n\n执行以下操作：\n\ni. 编写一个名为 `test_integer` 的子程序，通过其形式参数列表接收一个数字，当传递的数字为整数时返回\
  \ `true`；否则必须返回 `false`。\nii. 使用上述子程序，编写一个 Java 程序，让用户反复输入数值，直到输入一个实数为止。最后，程序必须显示输入入的正整数的平均值。\n\
  \n## Solution\n\n解决方案如下所示。\n\n![](img/00001.gif) Class_38_1_5\n```java\nstatic boolean\
  \ test_integer(double number) {\n    boolean return_value = false;\n    if (number\
  \ == (int)(number)) {\n        return_value = true;\n    }\n    return return_value;\n\
  }\npublic static void main(String[] args) {\n    int count;\n    double total, x;\n\
  \    total = 0;\n    count = 0;\n    x = Double.parseDouble(cin.nextLine()); //\
  \ Initialization of x\n    while (test_integer(x)) { // The Boolean Expression depends\
  \ on x\n        if (x > 0) {\n            total += x;\n            count++;\n  \
  \      }\n        x = Double.parseDouble(cin.nextLine()); // Update/alteration of\
  \ x\n    }\n    if (count > 0) {\n        System.out.println(total / count);\n \
  \   }\n}\n```\n\n![](img/00002.jpeg) 语句 `while (test_integer(x))` 等于语句 `while (test_integer(x)\
  \ == true)`。\n\n![](img/00002.jpeg) 注意最后一个单分支决策结构 `if count > 0`。为了让程序满足确定性（definiteness）属性，这个结构是必要的。考虑一下！如果用户从一开始就输入实数（浮点数），变量\
  \ `count` 最终将包含零零。\n\n![](img/00002.jpeg) 下述方法可以作为前一种方法的替代方案。它直接返回布尔表达式 `number\
  \ == int(number)` 的结果（true 或 false）。\n\n```java\nstatic boolean test_integer(double\
  \ number) {\n    return number == (int)(number);\n}\n```\n\n## Exercise 38.1-6:\
