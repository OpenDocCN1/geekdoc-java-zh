  | A | 90 - 100 |\n| B | 80 - 89 |\n| C | 70 - 79 |\n| D | 60 - 69 |\n| E / F | 0\
  \ - 59 |\n\n假设用户输入有效值。\n\n# 第 19 章\n\n## case 选择结构\n\n### 19.1 case 选择结构\n\ncase\
  \ 选择结构是多分支决策结构的简化版本。它能帮助你更快速地编写代码并提高可读性，特别是对于需要复杂决策结构组合的算法。case 选择结构用于以多分支决策结构相同的方式扩展备选方案。\n\
  \nJava 语句的一般形式为：\n\n```java\nswitch (要评估的变量或表达式) {\n    case value-1:\n        //\
  \ 语句块 1\n        break;\n    case value-2:\n        // 语句块 2\n        break;\n \
  \   case value-3:\n        // 语句块 3\n        break;\n    ...\n    case value-N:\n\
  \        // 语句块 N\n        break;\n    default:\n        // 默认语句\n}\n```default\
  \ 语句是可选的，可以省略。为了避免意外结果，请记住在每个 case 结束处包含 `break`。`switch` 只支持某些数据类型，如 `byte`、`short`、`int`\
  \ 或 `String`。\n\n```java\npublic static void main(String[] args) {\n    String name;\n\
  \    System.out.print(\"你的名字是什么?\");\n    name = cin.nextLine();\n    switch (name)\
  \ {\n        case \"John\":\n            System.out.println(\"你是我的兄弟!\");\n    \
  \        break;\n        case \"Aphrodite\":\n            System.out.println(\"\
  你是我的姐姐!\");\n            break;\n        case \"Loukia\":\n            System.out.println(\"\
  你是我妈妈!\");\n            break;\n        default:\n            System.out.println(\"\
  我不认识你.\");\n    }\n}\n```\n\n#### 练习 19.1-1 周\n\n编写一个 Java 程序，提示用户输入 1 到 5 之间的整数，然后显示相应的工作日（周一、周二、周三、周四或周五）。如果输入值无效，必须显示错误消息。\n\
  \n解决方案\n\n该 Java 程序可以使用多分支决策结构或 case 选择结构来编写。让我们尝试两种！\n\n第一方法——使用多分支决策结构\n\n流程图如下：\n\
  （此处为流程图）\n\n```java\npublic static void main(String[] args) {\n    int day;\n  \
  \  System.out.print(\"输入 1 到 5 之间的整数: \");\n    day = Integer.parseInt(cin.nextLine());\n\
  \    if (day == 1) {\n        System.out.println(\"周一\");\n    } else if (day ==\
  \ 2) {\n        System.out.println(\"周二\");\n    } else if (day == 3) {\n      \
  \  System.out.println(\"周三\");\n    } else if (day == 4) {\n        System.out.println(\"\
  周四\");\n    } else if (day == 5) {\n        System.out.println(\"周五\");\n    } else\
  \ {\n        System.out.println(\"无效数字\");\n    }\n}\n```\n\n第二种方法——使用 case 选择结构\n\
  \n```java\npublic static void main(String[] args) {\n    int day;\n    System.out.print(\"\
  输入 1 到 5 之间的整数: \");\n    day = Integer.parseInt(cin.nextLine());\n    switch (day)\
  \ {\n        case 1:\n            System.out.println(\"周一\");\n            break;\n\
  \        case 2:\n            System.out.println(\"周二\");\n            break;\n\
  \        case 3:\n            System.out.println(\"周三\");\n            break;\n\
  \        case 4:\n            System.out.println(\"周四\");\n            break;\n\
  \        case 5:\n            System.out.println(\"周五\");\n            break;\n\
  \        default:\n            System.out.println(\"无效数字\");\n    }\n}\n```\n\n\
  ### 19.2 复习题：判断对错\n\n对下列每个陈述进行判断对错。\n\n\n\n\n\n## case 决策结构\n\n1. case 决策结构用于扩展备选项的数量。\n\
  2. case 决策结构可以始终替代多备选项决策结构。\n3. case 决策结构可以包含程序员任意数量的备选项。\n4. 在 case 决策结构中，最后一条语句或语句块\
  \ `N + 1`（出现在 Java 关键字 `default` 之后）总是会被执行。\n5. 在 case 决策结构中，当之前的没有任何 case 结果为真时，最后一条语句或语句块\
  \ `N + 1`（出现在 Java 关键字 `default` 之后）会被执行。\n6. 最后一条语句或语句块 `N + 1` 以及 Java 关键字 `default`\
  \ 不能省略。\n7. 在下面的 Java 程序中：\n\n```java\nswitch (a) {\n    case 1:  x = x + 5; break;\n\
  \    case 2:  x = x - 2; break;\n    case 3:  x = x - 9; break;\n    default: x\
  \ = x + 3; y++;\n}\n```\n\n只有当变量 `a` 包含除 `1`、`2` 或 `3` 以外的值时，语句 `y++` 才会执行。\n\n\
