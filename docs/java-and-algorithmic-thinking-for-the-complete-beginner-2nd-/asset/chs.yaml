  \ `get_words_count` 的公共方法，返回 `user_text` 中的总单词数。\n- e. 一个名为 `get_vowels_count` 的公共方法，返回字段\
  \ `user_text` 中的总元音字母数。\n- f. 一个名为 `get_letters_count` 的公共方法，返回字段 `user_text` 中的总字符数（不包括空格）。\n\
