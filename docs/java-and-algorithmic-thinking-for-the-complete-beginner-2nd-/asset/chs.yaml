  \    y = 10;\n    if (x < 30) {\n        if (x < 15) {\n```\n\n\n\n\n\n```java\n\
  \        y = y + 2;\n    }\nelse {\n        y--;\n    }\n} else {\n    y++;\n}\n\
  System.out.println(y);\n```\n\n#### 解决方案\n\ni. 对于输入值 13，追踪表所示。\n\n| 步骤 | 语句 | 注\
  \ | x | y |\n| --- | --- | --- | --- | --- |\n| 1 | `x = Integer.parseInt(…)` |\
  \ 用户输入值 13 | 13 | ? |\n| 2 | `y = 10` | | 13 | 10 |\n| 3 | `if (x < 30)` | 结果为 true\
  \ | | |\n| 4 | `if (x < 15)` | 结果为 true | | |\n| 5 | `y = y + 2` | | 13 | 12 |\n\
  | 6 | `.println(y)` | 显示: 12 | | |\n\nii. 对于输入值 18，追踪表所示。\n\n| 步骤 | 语句 | 注 | x |\
  \ y |\n| --- | --- | --- | --- | --- |\n| 1 | `x = Integer.parseInt(…)` | 用户输入值\
  \ 18 | 18 | ? |\n| 2 | `y = 10` | | 18 | 10 |\n| 3 | `if (x < 30)` | 结果为 true |\
  \ | |\n| 4 | `if (x < 15)` | 结果为 false | | |\n| 5 | `y--` | | 18 | 9 |\n| 6 | `.println(y)`\
  \ | 显示: 9 | | |\n\niii. 对于输入值 30，追踪表所示。\n\n| 步骤 | 语句 | 注 | x | y |\n| --- | ---\
  \ | --- | --- | --- |\n| 1 | `x = Integer.parseInt(…)` | 用户输入值 30 | 30 | ? |\n|\
  \ 2 | `y = 10` | | 30 | 10 |\n| 3 | `if (x < 30)` | 结果为 false | | |\n| 4 | `y++`\
  \ | | 30 | 11 |\n| 5 | `.println(y)` | 显示: 11 | | |\n\n#### 练习 20.1-2 正、负或零？\n\n\
