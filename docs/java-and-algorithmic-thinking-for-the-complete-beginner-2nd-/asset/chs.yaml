  14. 在以下代码段中：\n```\ni = 0;do {System.out.println(\"Hello there!\");i += 5;} while\
  \ (i < 100);\n```\n满足有限性属性。\n\n### 28.9 习习题：单选择\n\n为每个陈述选择正确答案。\n\n1. 当迭代次数未知时，你可以使用：\n\
