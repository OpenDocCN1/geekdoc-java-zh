  \n![Image](img/00353.gif)\n\n# 第 34 章\n\n数组的更多练习\n\n### 34.1 数组的简单练习\n\n#### 练习\
  \ 34.1-1 创建包含邻接元素平均值的数组\n\n编写一个 Java 程序，让用户向数组中输入 100 个正数值。然后，程序必须创建一个包含 98 个元素的新数组。该新数组的每个位置都应包含给定数组中当前位置及其后续两个位置元素的平均值。\n\
  \n解决方案\n\n让我们通过一个使用 10 个元素的示例来理解这个练习。\n\n\n\n\n![Image](img/00355.gif)\n\n`Array\
  \ new_arr` 是创建的新数组。在数组 `new_arr` 中，位置 0 处的元素是数组 `b` 中当前位置及后两个位置元素的平均值；即 `(5 + 10\
  \ + 9) / 3 = 8`。位置 1 处的元素是数组 `b` 中当前位置及后两个位置元素的平均值；即 `(10 + 9 + 2) / 3 = 7`，依此类推。\n\
  \n该 Java 程序如下：\n\n![](img/00001.gif)\n```java\nClass_34_1_1\nstatic final int ELEMENTS_OF_A\
  \ = 100;\nstatic final int ELEMENTS_OF_NEW = ELEMENTS_OF_A - 2;\npublic static void\
  \ main(String[] args) {\n    int i;\n    double[] a = new double[ELEMENTS_OF_A];\n\
  \    for (i = 0; i <= ELEMENTS_OF_A - 1; i++) {\n        a[i] = Double.parseDouble(cin.nextLine());\n\
  \    }\n    double[] new_arr = new double[ELEMENTS_OF_NEW];\n    for (i = 0; i <=\
  \ ELEMENTS_OF_NEW - 1; i++) {\n        new_arr[i] = (a[i] + a[i + 1] + a[i + 2])\
  \ / 3;\n    }\n    for (i = 0; i <= ELEMENTS_OF_NEW - 1; i++) {\n        System.out.print(new_arr[i]\
  \ + \"\\t\");\n    }\n}\n```\n\n### 练习 34.1-2 创建包含最大值的数组\n\n编写一个 Java 程序，允许用户向各包含\
  \ 20 个元素的数组 `a` 和 `b` 中输入数值。然后，程序必须创建一个包含 20 个元素的新数组 `new_arr`。该新数组的每个位置必须包含数组 `a`\
  \ 和 `b` 对应位置上的最大值。\n\n#### 答案\n\n这里没有新内容！你需要两个 `for-loops` 来读取数组 `a` 和 `b` 的值，一个用于创建数组\
  \ `new_arr`，另一个用于在屏幕上显示数组 `new_arr`。\n\n该 Java 程序所示：\n\n![](img/00001.gif)\n```java\n\
  Class_34_1_2\nstatic final int ELEMENTS = 20;\npublic static void main(String[]\
  \ args) {\n    int i;\n    //Read arrays a and b\n    double[] a = new double[ELEMENTS];\n\
  \    for (i = 0; i <= ELEMENTS - 1; i++) {\n        a[i] = Double.parseDouble(cin.nextLine());\n\
  \    }\n    double[] b = new double[ELEMENTS];\n    for (i = 0; i <= ELEMENTS -\
  \ 1; i++) {\n        b[i] = Double.parseDouble(cin.nextLine());\n    }\n    // Create\
  \ array new_arr\n    double[] new_arr = new double[ELEMENTS];\n    for (i = 0; i\
  \ <= ELEMENTS - 1; i++) {\n        if (a[i] > b[i]) {\n            new_arr[i] =\
  \ a[i];\n        } else {\n            new_arr[i] = b[i];\n        }\n    }\n  \
  \  //Display array new_arr\n    for (i = 0; i <= ELEMENTS - 1; i++) {\n        System.out.println(new_arr[i]);\n\
  \    }\n}\n```\n\n### 练习 34.1-3 合并一维数组\n\n编写一个 Java 程序，对于两个分别包含 10 和 15 个元素的给定数组\
  \ `a` 和 `b`，创建一个包含 25 个元素的新数组 `new_arr`。这个新数组的前 10 个位置必须包含数组 `a` 的元素，接下来的 15 个位置必须包含数组\
  \ `b` 的元素。\n\n#### 答案\n\n正如接下来的示例所示，数组 `a` 的元素索引位置与数组 `new_arr` 的元素索引位置之间是一一对应的关系。数组\
  \ `a` 位置 0 处的元素存储在 `new_arr` 的位置 0 处，数组 `a` 位置 1 处的元素存储在 `new_arr` 的位置 1 处，依此类推。然而，数组\
  \ `b` 的元素索引位置与 `new_arr` 的索引位置之间并不是一一对应的。数组 `b` 位置 0 处的元素必须存储在 `new_arr` 的位置 10\
  \ 处，数组 `b` 位置 1 处的元素必须存储在 `new_arr` 的位置 11 处，依此类推。\n\n![Image](img/00356.gif)\n\n\
  为了将数组 `a` 的值赋值给数组 `new_arr`，你可以使用以下代码片段。\n\n```java\nfor (i = 0; i <= a.length -\
  \ 1; i++) {new_arr[i] = a[i];}\n```\n\n然而，将数组 `b` 的值赋值给数组 `new_arr`，你的代码片段应该完全不同，如下所示。\n\
  \n```java\nfor (i = 0; i <= b.length - 1; i++) {new_arr[a.length + i] = b[i];}\n\
  ```\n\n最终的 Java 程序如下。\n\n![](img/00001.gif)\n```java\nClass_34_1_3\npublic static\
  \ void main(String[] args) {\n    int i;\n    //Create arrays a and b\n    int[]\
  \ a = {5, 10, 9, 6, 7, 13, 12, 11, 2};\n    int[] b = {-1, 25, 4, 45, 67, 87, 34,\
  \ 23, 33, 55, 13, 15, -4, -2};\n    //Create array new_arr\n    int[] new_arr =\
  \ new int[a.length + b.length];\n    for (i = 0; i <= a.length - 1; i++) {\n   \
  \     new_arr[i] = a[i];\n    }\n    for (i = 0; i <= b.length - 1; i++) {\n   \
  \     new_arr[a.length + i] = b[i];\n    }\n    //Display array new_arr\n    for\
  \ (i = 0; i <= new_arr.length - 1; i++) {\n        System.out.print(new_arr[i] +\
  \ \"\\t\");\n    }\n}\n```\n`length` 属性包含数组的数量。与你在第 4.3 节中学到的 `length()` 方法不同，`length`\
  \ 是一个属性。因此，你不需要加括号。\n\n### 练习 34.1-4 合并二维数组\n\n编写一个 Java 程序，对于两个分别包含 `3×4` 和 `5×4`\
  \ 个元素的给定数组 `a` 和 `b`，创建一个包含 `8×4` 个元素的新数组 `new_arr`。在这个数组中，前 3 行必须包含数组 `a` 的元素，接下来的\
  \ 5 行必须包含数组 `b` 的元素。\n\n#### 答案\n\n使用上一个练习的知识，建议的解决方案如下。首先，随机创建两个二维数组 `a` 和 `b`。\n\
  \n![](img/00001.gif)\n```java\nClass_34_1_4\nstatic final int COLUMNS = 4;\npublic\
  \ static void main(String[] args) {\n    int i, j;\n    int[][] a = {{10, 11, 12,\
  \ 8}, {3, 1, 5, 10}, {-1, 2, -5, -10}};\n    int[][] b = {{10, 11, 16, 33}, {1,\
  \ 13, 5, 55}, {-1, -2, 4, 44}, {55, 33, 77, 12}, {-10, 120, 32, 43}};\n    //Create\
  \ array new_arr\n    int[][] new_arr = new int[a.length + b.length][COLUMNS];\n\
  \    for (i = 0; i <= a.length - 1; i++) {\n        for (j = 0; j <= COLUMNS - 1;\
  \ j++) {\n            new_arr[i][j] = a[i][j];\n        }\n    }\n    for (i = 0;\
  \ i <= b.length - 1; i++) {\n        for (j = 0; j <= COLUMNS - 1; j++) {\n    \
  \        new_arr[a.length + i][j] = b[i][j];\n        }\n    }\n    //Display array\
  \ new_arr\n    for (i = 0; i <= new_arr.length - 1; i++) {\n        for (j = 0;\
  \ j <= COLUMNS - 1; j++) {\n            System.out.print(new_arr[i][j] + \"\\t\"\
  );\n        }\n        System.out.println();\n    }\n}\n```\n\n### 练习 34.1-5 创建两个数组——分离正负值\n\
  \n编写一个 Java 程序，允许用户向一个数组输入 100 个数值，然后创建两个新数组 `pos` 和 `neg`。数组 `pos` 必须包含正值，而数组 `neg`\
  \ 必须包含负值。值 0（如果有）不应添加到最终数组 `pos` 或 `neg` 中的任何。\n\n#### 答案\n\n使用以下示例分析这种方法。\n\n![Image](img/00357.gif)\n\
  \n在这个练习中，数组 `ar` 的元素索引位置与数组 `pos` 和 `neg` 之间没有一一对应的关系。例如，数组 `ar` 位置 1 处的元素没有存储在\
  \ `neg` 的位置 1 处，或者数组 `ar` 位置 2 处的元素没有存储在 `pos` 的位置 2 处。因此，你不能执行以下操作：\n\n```java\n\
  for (i = 0; i <= ELEMENTS - 1; i++) {\n    if (ar[i] > 0) {\n        pos[i] = ar[i];\n\
  \    } else if (ar[i] < 0) {\n        neg[i] = ar[i];\n    }\n}\n```\n\n因为会导致会导致两个数组。\n\
  \n![Image](img/00358.gif)\n\n你需要的是两个独立的索引变量：用于数组 `pos` 的 `pos_index` 和用于数组 `neg`\
  \ 的 `neg_index`。这些索引变量必须独立增加，并且只有在元素添加到相应的数组时增加。索引变量 `pos_index` 只有在元素添加到数组 `pos`\
  \ 时才增加，而索引变量 `neg_index` 只有在元素添加到数组 `neg` 时才增加，如下面的代码片段所示。\n\n```java\npos_index\
  \ = 0;\nneg_index = 0;\nfor (i = 0; i <= ELEMENTS - 1; i++) {\n    if (ar[i] > 0)\
  \ {\n        pos[pos_index++] = ar[i];\n    } else if (ar[i] < 0) {\n        neg[neg_index++]\
  \ = ar[i];\n    }\n}\n```\n\n\n\n\n\n![](img/00002.jpeg)注意变量 `pos_index` 和 `neg_index`\
  \ 具有双重作用。当循环迭代时，每个都指向必须放置新元素的下一个位置。但当循环结束时，变量 `pos_index` 和 `neg_index` 也包含了每个对应数组中的元素总数！\n\
  \n下面给出了完整的解决方案。\n\n![](img/00001.gif) Class_34_1_5\n```java\nstatic final int ELEMENTS\
  \ = 100;\npublic static void main(String[] args) {\n    int i, pos_index, neg_index;\n\
  \    double[] ar = new double[ELEMENTS];\n    for (i = 0; i <= ELEMENTS - 1; i++)\
  \ {\n        ar[i] = Double.parseDouble(cin.nextLine());\n    }\n    //创建数组 pos\
  \ 和 neg\n    double[] pos = new double[ELEMENTS];\n    double[] neg = new double[ELEMENTS];\n\
  \    pos_index = 0;\n    neg_index = 0;\n    for (i = 0; i <= ELEMENTS - 1; i++)\
  \ {\n        if (ar[i] > 0) {\n            pos[pos_index++] = ar[i];\n        }\
  \ else if (ar[i] < 0) {\n            neg[neg_index++] = ar[i];\n        }\n    }\n\
  \    for (i = 0; i <= pos_index - 1; i++) {\n        System.out.print(pos[i] + \"\
  \\t\");\n    }\n    System.out.println();\n    for (i = 0; i <= neg_index - 1; i++)\
  \ {\n        System.out.print(neg[i] + \"\\t\");\n    }\n}\n```\n\n![](img/00002.jpeg)注意数组\
  \ `pos` 和 `neg` 分别包含 `pos_index` 和 `neg_index` 个元素。这就是为什么最后两个循环控制结构迭代直到变量 `i` 达到\
  \ `pos_index – 1` 和 `neg_index – 1` 值为止，而不是你可能误预期的达到 `ELEMENTS – 1`。显然，`pos_index\
  \ + neg_index` 等于 `ELEMENTS`。\n\n### 练习 34.1-6 创建包含数字 5 的数组\n\n编写一个 Java 程序，让用户向数组输入\
