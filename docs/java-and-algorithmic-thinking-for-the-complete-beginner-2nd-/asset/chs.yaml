  \n### 20.3 复习题：对错\n\n对以下各项选择对或错：\n\n1. 判断结构的嵌套描述了一个判断结构的多个路径包含其他判断结构的情况。\n2. 嵌套深度可以根据程序员的意愿任意延伸。\n\
  3. 当问题可以使用分支结构或嵌套判断结构解决时，后者更好是因为。\n4. 可以在分支结构中嵌套多分支判断结构，反之不可。\n5. 在使用嵌套判断结构设计流程图时，第一个打开的判断结构必须是关闭的。\n\
