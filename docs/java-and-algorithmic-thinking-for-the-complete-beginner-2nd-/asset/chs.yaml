  \n# 第 26 章\n\n## for 语句\n\n### 26.1 for 语句\n\n在第 25 章 中，你可能已经注意到，`while` 语句被用于创建确定和不定循环。换句话说，它既用于已知次数的迭代，也用于未知次数的迭代。由于确定循环在计算机编程中被频繁使用，几乎每种计算机语言都包含了\
  \ `for` 语句，它比 `while` 语句更易读。\n\n```java\nfor (初始化; 测试条件; 更新表达式) {\n    // 循环体\n\
  }\n```\n\n`for` 语句的通用形式如下：\n\n```java\nfor (初始化; 测试条件; 更新表达式) {\n    执行语句\n}\n```\n\
  \n- **初始化**：在循环开始前执行一次。\n- **测试条件**：在每次循环体执行前检查。如果条件为真，则执行循环体；如果为假，则退出循环。\n- **更新表达式**：在每次循环体执行后执行。\n\
  \n例如，以下 `for` 语句将打印 1 到 5：\n\n```java\nfor (int i = 1; i <= 5; i++) {\n    System.out.println(i);\n\
  }\n```\n\n等价于以下 `while` 语句：\n\n```java\nint i = 1;\nwhile (i <= 5) {\n    System.out.println(i);\n\
  \    i++;\n}\n```\n\n`for` 语句也可以用于嵌套循环中：\n\n```java\nfor (int i = 1; i <= 3; i++)\
  \ {\n    for (int j = 1; j <= 3; j++) {\n        System.out.println(i + \", \" +\
  \ j);\n    }\n}\n```\n\n\n\n\n\n当然，当变量 `counter` 递增或减少的值不为 1 时，使用复合赋值运算符会更方便。上一个示例也可以写成：\n\
  \n![](img/00001.gif)\n```java\npublic static void main(String[] args) {\n    int\
  \ i;\n    for (i = 10; i >= 2; i -= 2) {\n        System.out.println(i);\n    }\n\
  }\n```\n\n接下来的示例显示了字母“H”、“e”、“l”、“l”和“o”（均不带双引号）。\n\n![](img/00001.gif)\n```java\n\
  public static void main(String[] args) {\n    int i;\n    String message = \"Hello\"\
  ;\n    for (i = 0; i <= message.length() - 1; i++) {\n        System.out.println(message.charAt(i));\n\
  \    }\n}\n```\n\n![](img/00003.jpeg) `length()` 方法返回变量 `message` 所包含的字符数（参见第 14.3\
  \ 节）。\n\n![](img/00003.jpeg) `charAt()` 方法返回变量 `message` 指定位置上的字符（参见第 14.3 节）。\n\
  \n### 练习题 26.1-1 创建追踪表\n\n设计对应的流程图并创建一个追踪表，以确定当输入值为 1 时，以下代码段每个步骤中变量的值。\n\n```java\n\
  int a, i;\na = Integer.parseInt(cin.nextLine());\nfor (i = -3; i <= 3; i += 2) {\n\
  \    a = a * 3;\n}\nSystem.out.println(i + \"  \" + a);\n```\n\n#### 答案\n\n对应的流程图片段如下。\n\
  \n![Image](img/00253.gif)\n\n![](img/00003.jpeg) 你应该记住，`for` 循环实际上是一个预测试循环结构！\n\n\
  如果你使用 `while` 语句重写该代码片段，结果如下。\n\n```java\nint a, i;\na = Integer.parseInt(cin.nextLine());\n\
  i = -3;\nwhile (i <= 3) {\n    a = a * 3;\n    i += 2;\n}\nSystem.out.println(i\
  \ + \"  \" + a);\n```\n\n现在，为了给 `for` 语句创建追踪表，你有两个选择：可以使用对应的流程图，也可以使用用 `while` 语句编写的等效程序。\n\
  \n| 步骤 | 语句 | 注释 | a | i | | |\n| --- | --- | --- | --- | --- | --- | --- |\n| 1\
  \ | `a = Integer.parseInt(…)` | | 1 | ? | | |\n| 2 | `i = -3;` | | 1 | -3 | | |\n\
  | 3 | `i <= 3` | 值结果为 true | 第 1 次 | 迭代 | | |\n| 4 | `a = a * 3` | | 3 | -3 | |\
  \ |\n| 5 | `i += 2` | | 3 | -1 | | |\n| 6 | `i <= 3` | 值结果为 true | 第 2 次 | 迭代 |\
  \ | |\n| 7 | `a = a * 3` | | 9 | -1 | | |\n| 8 | `i += 2` | | 9 | 1 | | |\n| 9 |\
  \ `i <= 3` | 值结果为 true | 第 3 次 | 迭代 | | |\n| 10 | `a = a * 3` | | 27 | 1 | | |\n\
  | 11 | `i += 2` | | 27 | 3 | | |\n| 12 | `i <= 3` | 值结果为 true | 第 4 次 | 迭代 | | |\n\
  | 13 | `a = a * 3` | | 81 | 3 | | |\n| 14 | `i += 2` | | 81 | 5 | | |\n| 15 | `i\
  \ <= 3` | 值结果为 false | | | | |\n| 16 | `.println (i + \" \" + a)` | 显示： 5 81 | |\
  \ | | |\n\n![](img/00002.jpeg) 注意，当计数器 `i` 的值超过 `final_value` 时，执行流退出循环。在这个示例中，当执行流最终退出循环时，计数器\
  \ `i` 并不包含最终值 3，而是包含下一个值，即值 5。\n\n### 练习题 26.1-2 创建追踪表\n\n创建一个追踪表，以确定当输入值为 4 时，以下代码段每个步骤中变量的值。\n\
  \n```java\nint a, i;\na = Integer.parseInt(cin.nextLine());\nfor (i = 6; i >= a;\
  \ i--) {\n    System.out.println(i);\n}\n```\n\n#### 答案\n\n再次可以使用 `while` 语句重写程序。\n\
  \n```java\nint a, i;\na = Integer.parseInt(cin.nextLine());\ni = 6;\nwhile (i >=\
  \ a) {\n    System.out.println(i);\n    i--;\n}\n```\n\n以下是用于确定每个步骤中变量值的追踪表。\n\n\
  | 步骤 | 语句 | 注释 | a | i |\n| --- | --- | --- | --- | --- |\n| 1 | `a = Integer.parseInt(…)`\
  \ | | 4 | ? |\n| 2 | `i = 6;` | | 4 | 6 |\n| 3 | `i >= a` | 值结果为 true | | |\n| 4\
  \ | `.println(i)` | 显示：6 | | |\n| 5 | `i--` | | 4 | 5 |\n| 6 | `i >= a` | 值结果为 true\
  \ | | |\n| 7 | `.println(i)` | 显示：5 | | |\n| 8 | `i--` | | 4 | 4 |\n| 9 | `i >=\
  \ a` | 值结果为 true | | |\n| 10 | `.println(i)` | 显示：4 | | |\n| 11 | `i--` | | 4 |\
  \ 3 |\n| 12 | `i >= a` | 值结果为 false | | |\n\n### 练习题 26.1-3 统计总迭代次数\n\n统计以下代码段在两次执行中的总迭代次数。两次执行的输入值为：(i)\
  \ 6 和 (ii) 5。\n\n```java\nn = Integer.parseInt(cin.nextLine());\nfor (i = 5; i <=\
  \ n; i++) {\n    System.out.println(i);\n}\n```\n\n#### 答案\n\n为了更好地理解过程，与其创建追踪表，你只需要设计其对应的流程图。\n\
  \n![Image](img/00254.gif)\n从这个流程图中可以看到：\ni. 对于输入值 5，布尔表达式结果为 true，执行流进入循环。变量 `i`\
  \ 增加到 6，布尔表达式结果为 false，执行流退出循环。因此，循环执行了一次迭代。\nii. 对于输入值 6，循环执行了两次迭代。\n\n### 练习题\
  \ 26.1-4 求四个数的和\n\n编写一个 Java 程序，提示用户输入四个数，然后计算它们的和。\n\n#### 答案\n\n在 `练习题 5.1-5`\
  \ 中，使用 `while` 语句提出的解决方案如下：\n\n```java\npublic static void main(String[] args) {\n\
  \    double total, x;\n    int i;\n    total = 0;\n    i = 1;\n    while (i <= 4)\
  \ {\n        x = Double.parseDouble(cin.nextLine());\n        total = total + x;\n\
  \        i++;\n    }\n    System.out.println(total);\n}\n```\n\n现在，很容易使用 `for` 语句来重写它，并在每次输入前显示提示。\n\
  \n![](img/00001.gif)\n```java\npublic static void main(String[] args) {\n    int\
  \ i;\n    double total, x;\n    total = 0;\n    for (i = 1; i <= 4; i++) {\n   \
  \     System.out.print(\"Enter a number: \");\n        x = Double.parseDouble(cin.nextLine());\n\
  \        total = total + x;\n    }\n    System.out.println(total);\n}\n```\n\n![](img/00002.jpeg)\
  \ 注意，当计数器 `i` 的值超过 `final_value` 时，执行流退出循环。在这个示例中，当执行流最终退出循环时，计数器 `i` 并不包含最终值 3，而是包含下一个值，即值\
  \ 5。\n\n### 练习题 26.1-5 求整数的平方根\n\n编写一个 Java 程序，提示用户输入一个整数，然后计算它的平方根。\n\n#### 答案\n\
  \n对应的解决方案如下：\n\n![](img/00001.gif)\n```java\npublic static void main(String[] args)\
  \ {\n    int num;\n    System.out.print(\"Enter an integer: \");\n    num = Integer.parseInt(cin.nextLine());\n\
  \    for (i = 0; i <= num; i++) {\n        System.out.println(Math.sqrt(i));\n \
  \   }\n}\n```\n\n### 练习题 26.1-6 求 1 + 2 + 3 + … + 100 的和\n\n编写一个 Java 程序计算并显示以下和：\n\
  S = 1 + 2 + 3 + … + 100\n\n#### 答案\n\n如果你使用 `while` 结构来解决这个练习，它将是：\n\n```java\n\
  s = 0;\ni = 1;\nwhile (i <= 100) {\n    s = s + i;\n    i++;\n}\n```\n\n让我们使用追踪表来更好地理解它。\n\
  \n| 步骤 | 语句 | 注释 | i | s |\n| --- | --- | --- | --- | --- |\n| 1 | `s = 0` | | ?\
  \ | 0 |\n| 2 | `i = 1;` | | 1 | 0 |\n| 3 | `s = s + i` | 0 + 1 = 1 | 1 | 1 |\n|\
  \ 4 | `i++;` | | 2 | 1 |\n| 5 | `s = s + i` | 0 + 1 + 2 = 3 | 2 | 3 |\n| 6 | `i++;`\
  \ | | 3 | 3 |\n| 7 | `s = s + i` | 0 + 1 + 2 + 3 = 6 | 3 | 6 |\n| 8 | `i++;` | |\
  \ 4 | 6 |\n| ... | … | | … | … |\n| ... | … | | … | … |\n| 199 | `s = s + i` | |\
  \ 99 | 4950 |\n| 200 | `i++;` | | 100 | 4950 |\n| 201 | `s = s + i` | 0 + 1 + 2\
  \ + 3 + …+ 99 + 100 = 5050 | 100 | 5050 |\n| 202 | `i++;` | | 101 | 5050 |\n\n现在一切都清楚了，你同样可以使用一个变量\
  \ `i` 递增 1 的 `for` 循环来完成。\n\n![](img/00001.gif)\n```java\npublic static void main(String[]\
  \ args) {\n    int s, i;\n    s = 0;\n    for (i = 1; i <= 100; i++) {\n       \
  \ s = s + i;\n    }\n    System.out.println(s);\n}\n```\n\n### 练习题 26.1-7 求 2 ×\
  \ 4 × 6 × 8 × 10 的积\n\n编写一个 Java 程序计算并显示以下乘积：\nP = 2 × 4 × 6 × 8 × 10\n\n#### 答案\n\
  \n如果你使用 `while` 结构来解决这个练习，它将是：\n\n```java\np = 1;\ni = 2;\nwhile (i <= 10) {\n \
  \   p = p * i;\n    i += 2;\n}\n```\n\n\n\n\n与上一个练习一样，让我们使用下面的顺序控制结构来学习这个练习。\n\n\
  ```java\np = 1; i = 2; p = p * i; i = i + 2; p = p * i; i = i + 2; p = p * i; i\
  \ = i + 2; p = p * i; i = i + 2; p = p * i; i = i + 2;\n```\n\n对应的跟踪表所示。\n\n| 步骤\
  \ | 语句 | 注 | i | p |\n| --- | --- | --- | --- | --- |\n| 1 | p = 1 | 1 | ? | 1 |\n\
  | 2 | i = 2 | | 2 | 1 |\n| 3 | p = p * i | 1 × 2 = 2 | 2 | 2 |\n| 4 | i = i + 2\
  \ | | 4 | 2 |\n| 5 | p = p * i | 2 × 4 = 8 | 4 | 8 |\n| 6 | i = i + 2 | | 6 | 8\
  \ |\n| 7 | p = p * i | 2 × 4 × 6 = 48 | 6 | 48 |\n| 8 | i = i + 2 | | 8 | 48 |\n\
  | 9 | p = p * i | 2 × 4 × 6 × 8 = 384 | 8 | 384 |\n| 10 | i = i + 2 | | 10 | 384\
  \ |\n| 11 | p = p * i | 2 × 4 × 6 × 8 × 10 = 3840 | 8 | 3840 |\n| 12 | i = i + 2\
  \ | | 12 | 3840 |\n\n现在一切都弄清楚了，你可以做同样的事情，这次使用一个 `for` 循环让变量 `i` 递增 2。\n\n![](img/00001.gif)\n\
  ```java\npublic static void main(String[] args) {\n    int p, i;\n    p = 1;\n \
  \   for (i = 2; i <= 10; i += 2) {\n        p = p * i;\n    }\n    System.out.println(p);\n\
  }\n```\n\n#### 练习 26.1-8 求解 2² + 4² + 6² + … (2N)² 的和\n\n编写一个 Java 程序，让用户输入整数 `N`，然后计算并显示以下求和：\n\
  \n$S = 2² + 4² + 6² + … (2N)²$\n\n#### 答案\n\n在这个练习中，变量 `i` 必须每次递增 2。但在每次迭代中，它的值在被累加到变量\
  \ `s` 之前，必须取二次方。最终的 Java 程序如下。\n\n![](img/00001.gif)\n```java\npublic static void\
  \ main(String[] args) {\n    int N, i;\n    double s;\n    N = Integer.parseInt(cin.nextLine());\n\
  \    s = 0;\n    for (i = 2; i <= 2 * N; i += 2) {\n        s = s + Math.pow(i,\
  \ 2);\n    }\n    System.out.println(s);\n}\n```\n\n#### 练习 26.1-9 求解 3³ + 6⁶ +\
  \ 9⁹ + … (3N)^(3N) 的和\n\n编写一个 Java 程序，让用户输入整数 `N`，然后计算并显示以下求和：\n\n$S = 3³ + 6⁶ +\
  \ 9⁹ + …+ (3N)^(3N)$\n\n#### 答案\n\n这与上一个练习几乎一样。唯一的区别是变量 `i` 在被累加到变量 `s` 之前，必须取 $i^{th}$\
  \ 次方。使用 `for` 循环，最终的 Java 程序如下。\n\n![](img/00001.gif)\n```java\npublic static void\
  \ main(String[] args) {\n    int N, i;\n    double s;\n    N = Integer.parseInt(cin.nextLine());\n\
  \    s = 0;\n    for (i = 3; i <= 3 * N; i += 3) {\n        s = s + Math.pow(i,\
  \ i);\n    }\n    System.out.println(s);\n}\n```\n\n#### 练习 26.1-10 求解正数的平均值\n\n\
  编写一个 Java 程序，让用户输入 100 个数字，然后计算并显示正数的平均值。添加所有必要的检查以使程序满足确定性属性。\n\n#### 答案\n\n由于你知道总迭代次数，可以使用\
  \ `for` 循环。但在循环内部，必须使用选择控制结构来检查给数字是否为正数；如果是，则必须将该数字累加到变量 `s` 中。变量 `count` 用于统计给出的正数数量。当执行流退出循环时，就可以计算平均值。Java\
  \ 程序如下。\n\n![](img/00001.gif)\n```java\npublic static void main(String[] args) {\n\
  \    int count, i;\n    double s, x;\n    s = 0;\n    count = 0;\n    for (i = 1;\
  \ i <= 100; i++) {\n        x = Double.parseDouble(cin.nextLine());\n        if\
  \ (x > 0) {\n            s = s + x;\n            count++;\n        }\n    }\n  \
  \  if (count > 0) {\n        System.out.println(s / count);\n    } else {\n    \
  \    System.out.println(\"No positive numbers entered.\");\n    }\n}\n```\n\n\n\n\
  \n```java\nfor (i = 5; i >= 10; i--) {System.out.println(i);}\n```\n\n#### 解决方案\n\
  \n此程序违反了 for 循环的第三条规则，该规则规定：如果 `initial_value` 小于 `final_value` 且偏移量为负，则循环执行零次迭代。\n\
  \n相应的流程图片段可以帮助你更好地理解实际发生了什么。\n\n![Image](img/00257.gif)\n\n当执行流到达循环控制结构时，值 `5` 被赋值给变量\
  \ `i`。然而，布尔表达式求值为假，执行流从未进入循环体！因此，该循环执行了零次迭代。\n\n![](img/00002.jpeg)for 循环实际上是一个预测试循环结构。正如此，它可能会执行从零到多次的迭代。\n\
  \n![](img/00003.jpeg)故意违反 for 循环的第三条规则在某些情况下是有用的。\n\n#### 练习题 26.2-4 计算总迭代次数\n\n\
  以下代码片段执行了多少次迭代？\n\n```java\nfor (i = 10; i <= 5; i++) {System.out.println(i);}\n\
  ```\n\n#### 解决方案\n\n此程序违反了 for 循环的第四条规则，该规则规定：如果 `initial_value` 大于 `final_value`\
  \ 且偏移量为正，则循环执行零次迭代。\n\n相应的流程图片段可以帮助你更好地理解实际发生了什么。\n\n![Image](img/00258.gif)\n\n\
  当执行流到达循环控制结构时，值 `10` 被赋值给变量 `i`。然而，布尔表达式求值为假，执行流从未进入循环体！因此，该循环执行了零次迭代。\n\n![](img/00003.jpeg)故意违反\
  \ for 循环的第四条规则在某些情况下是有用的。\n\n#### 练习题 26.2-5 寻找 N 个数的和\n\n编写一个 Java 程序，提示用户输入 `N`\
  \ 个数字，然后计算并显示它们的和。`N` 的值必须在程序开始时由用户给出。\n\n#### 解决方案\n\n解决方案在此给出。\n\n![](img/00001.gif)\n\
  \n```java\nClass_26_2_5\npublic static void main(String[] args) {\n    int n, i;\n\
  \    double a, total;\n    System.out.print(\"Enter quantity of numbers to enter:\
  \ \");\n    n = Integer.parseInt(cin.nextLine());\n    total = 0;\n    for (i =\
  \ 1; i <= n; i++) {\n        System.out.println(\"Enter number No \" + i + \": \"\
  );\n        a = Double.parseDouble(cin.nextLine());\n        total += a;  //这相当于\
  \ total = total + a\n    }\n    System.out.println(\"Sum: \" + total);\n}\n```\n\
  \n![](img/00002.jpeg)尽管它违反了 for 循环的第四条规则，但在特定的练习中，这种情况是非常用的。如果用户为变量 `n` 输入非正值，`for`\
  \ 语句将执行零次迭代。\n\n### 26.3 复习题：判断对错\n\n对以下每个陈述判断对错。\n\n1. 在 `for` 语句中，计数器的值在每次循环结束时自动增加或递减。\n\
  2. 当迭代次数已知时，可以使用确定循环。\n3. 在确定循环中，循环的语句或语句块至少执行一次。\n4. 在 `for-loop` 中，`initial_value`\
  \ 不能大于 `final_value`。\n5. 当执行流退出 `for-loop` 时，计数器的值等于 `final_value`。\n6. 在 `for-loop`\
  \ 中，`initial_value`、`final_value` 和 `offset` 的值可以是整数，也可以是浮点数。\n7. 在 `for-loop` 中，当\
  \ `offset` 设置为零时，循环执行无限次迭代。\n8. 在 `for-loop` 中，计数器变量可以出现在循环内部的语句中，但其值不能被修改。\n9.\
  \ 在 `for-loop` 中，在某些情况下 `offset` 可以为零。\n10. 在以下代码片段中：\n```java\nfor (i = 0; i <=\
