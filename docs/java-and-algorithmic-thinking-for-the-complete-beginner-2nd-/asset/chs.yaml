  ```\n\n### 练习 34.4-5 对二维数组进行排序\n\n编写一个代码片段，对二维数组的每一列按升序排序。假设该数组包含数值。\n\n#### 解决方案\n\
  \n二维数组的示例如下：\n\n![Image](img/00372.gif)\n\n由于该数组有七列，冒泡排序需要执行七次，每列一次。因此，整个冒泡排序算法应该嵌套在一个循环七次的循环中。\n\
  \n但让我们先处理正确。使用“从内层到外层”的方法，下一个代码片段仅对二维数组 `a` 的第一列（列索引 0）进行排序。假设变量 `j` 值为 0。\n\n```java\n\
  for (m = 1; m <= ROWS - 1; m++) {\n    for (n = ROWS - 1; n >= m; n--) {\n     \
  \   if (a[n][j] < a[n - 1][j]) {\n            temp = a[n][j];\n            a[n][j]\
  \ = a[n - 1][j];\n            a[n - 1][j] = temp;\n        }\n    }\n}\n```\n\n\
  现在，为了排序所有列，你可以将此代码片段嵌套在一个遍历所有列的循环中，如下：\n\n```java\nfor (j = 0; j <= COLUMNS - 1;\
  \ j++) {\n    for (m = 1; m <= ROWS - 1; m++) {\n        for (n = ROWS - 1; n >=\
  \ m; n--) {\n            if (a[n][j] < a[n - 1][j]) {\n                temp = a[n][j];\n\
  \                a[n][j] = a[n - 1][j];\n                a[n - 1][j] = temp;\n \
  \           }\n        }\n    }\n}\n```\n\n\n\n\n编写一个 Java 程序，让用户输入 20 个人的体重，然后显示三个最重和三个最轻的体重。使用改进的泡泡排序算法。\n\
  \n#### 解决方案\n\n为了解决这个练习，Java 程序可以对给定的数据进行升序排序，然后显示索引位置为 `27`、`28` 和 `29` 的元素（三个最重的体重）以及索引位置为\
  \ `0`、`1` 和 `2` 的元素（三个最轻的体重）。\n\n但是改进版的泡泡排序算法是如何工作的呢？假设你有如下一个包含六个人体重的数组。\n\n![Image](img/00373.gif)\n\
  \n如果你仔细观察，你可以自己确认，唯一不在正确位置的元素是索引为 `3` 和 `4` 的元素。如果你交换它们的值，数组 `w` 立即变为有序状态！然而，泡泡排序算法并不是这样运行的。遗憾的是，对于这个给定的六元素数组，无论哪种方式，它都会执行五轮，总共进行\
  \ `![Image](img/00374.gif)` 次比较，其中 `N` 是数组元素的总数。对于更大的数组，泡泡排序算法执行的比较总数呈指数级增长！例如，对于一个包含\
  \ 1000 个元素的数组，泡泡排序算法执行了 499,500 次比较！\n\n当然，改进的泡泡排序可以通过可以通过方式克服这种情况：如果执行了完整的遍历且没有发生任何交换，则说明数组已经排序，不需要继续后续遍历。为了实现这一点，Java\
  \ 程序可以使用一个标记变量来指示是否发生了任何交换。在每一轮开始时，可以给标记变量赋值 `false`；当发生交换时，赋值 `true`。如果在一轮结束时标记仍为\
  \ `false`，则说明没有发生任何交换，因此必须停止迭代。改进的泡泡排序如接下来所示。它使用了 `break` 语句和一个标记变量（`swaps`）。\n\n\
  ```java\nfor (m = 1; m <= ELEMENTS - 1; m++) {\n    // 给变量 swaps 赋值 false\n    swaps\
  \ = false;\n    // 执行新的一轮\n    for (n = ELEMENTS - 1; n >= m; n--) {\n        if\
  \ (w[n] < w[n - 1]) {\n            temp = w[n];\n            w[n] = w[n - 1];\n\
  \            w[n - 1] = temp;\n            swaps = true;\n        }\n    }\n   \
  \ // 如果变量 swaps 仍然为 false，说明在一轮中\n    // 没有发生交换。停止迭代！\n    if (!swaps) break;\n\
  }\n```\n\n![](img/00002.jpeg)每当开始新的一轮时，必须给变量 `swaps` 赋值 `false`。这就是为什么语句 `swaps\
  \ = false` 必须放置在两个 `for` 语句之间。\n\n![](img/00002.jpeg)语句 `if (!swaps)` 等于语句 `if (swaps\
  \ == false)`。\n\n最终的 Java 程序如接下来所示。\n\n![](img/00001.gif) \n```java\nclass Class_34_4_6\
  \ {\n    static final int ELEMENTS = 20;\n\n    public static void main(String[]\
  \ args) {\n        int i, m, n;\n        boolean swaps;\n        double temp;\n\
  \        double[] w = new double[ELEMENTS];\n\n        for (i = 0; i <= ELEMENTS\
  \ - 1; i++) {\n            w[i] = Double.parseDouble(cin.nextLine());\n        }\n\
  \n        for (m = 1; m <= ELEMENTS - 1; m++) {\n            swaps = false;\n  \
  \          for (n = ELEMENTS - 1; n >= m; n--) {\n                if (w[n] < w[n\
  \ - 1]) {\n                    temp = w[n];\n                    w[n] = w[n - 1];\n\
  \                    w[n - 1] = temp;\n                    swaps = true;\n     \
  \           }\n            }\n            if (!swaps) break;\n        }\n\n    \
  \    System.out.println(\"三个最重的体重是:\");\n        System.out.println(w[ELEMENTS -\
  \ 3] + \" \" + w[ELEMENTS - 2] + \" \" + w[ELEMENTS - 1]);\n        System.out.println(\"\
  三个最轻的体重是:\");\n        System.out.println(w[0] + \" \" + w[1] + \" \" + w[2]);\n\
  \    }\n}\n```\n\n#### 练习 34.4-7 五位得分最高的球员\n\n编写一个 Java 程序，提示用户输入 FIFA 世界杯 32 支国家队的名称、每支队伍\
