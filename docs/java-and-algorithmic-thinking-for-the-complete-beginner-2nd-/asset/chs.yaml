  \n# 第 18 章\n## 多分支选择结构\n\n### 18.1 多分支选择结构\n\n多分支选择结构用于扩展备选项的数量，如下流程图片段所示。\n\n![Image](img/00168.gif)\n\
  \n当执行多分支选择结构时，会评估 `Boolean_Expression_1`。如果 `Boolean_Expression_1` 的结果为 `true`，则执行其后对应的语句或语句块；然后跳过结构的其余部分。然而，如果\
  \ `Boolean_Expression_1` 的结果为 `false`，则执行流将评估 `Boolean_Expression_2`。如果它的结果为 `true`，则执行其后对应的语句或语句块。此过程一直持续，直到某个布尔表达式结果为\
  \ `true` 或没有更多表达式剩余。\n\n当之前所有的布尔表达式都没有结果为 `true` 时，执行最后的一个语句或语句块 `N+1`。此外，这个最后的语句或语句块\
  \ `N+1` 是可选的，可以省略。它取决于算法。\n\n```\nif (Boolean_Expression_1) {A statement or block\
  \ of statements 1}\nelse if (Boolean_Expression_2) {A statement or block of statements\
  \ 2}\nelse if (Boolean_Expression_3) {A statement or block of statements 3}\n...\n\
  else if (Boolean_Expression_N) {A statement or block of statements N}\nelse {A statement\
  \ or block of statements N+1}\n```\n\n这里展示了一个简单的示例。\n\n![Image](img/00001.gif)\n\
  ```java\nclass Class18_1 {\n    public static void main(String[] args) {\n     \
  \   String name;\n        System.out.print(\"What is your name? \");\n        name\
  \ = cin.nextLine();\n        if (name.equals(\"John\")) {\n            System.out.println(\"\
  You are my cousin!\");\n        } else if (name.equals(\"Aphrodite\")) {\n     \
  \       System.out.println(\"You are my sister!\");\n        } else if (name.equals(\"\
  Loukia\")) {\n            System.out.println(\"You are my mom!\");\n        } else\
  \ {\n            System.out.println(\"Sorry, I don't know you.\");\n        }\n\
  \    }\n}\n```\n\n#### 18.1-1 跟踪表与多分支选择结构\n\n创建一个跟踪表，以确定在下一个 Java 程序的不同执行过程中，每一步变量的值。\n\
