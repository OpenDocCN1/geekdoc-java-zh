  #### 练习 23.1-1 全为奇数或全偶数？\n\n编写一个 Java 程序，提示用户输入两个整数，然后显示消息指示这两个数是否都是奇数或都是偶数；否则显示消息“Nothing\
  \ special（无特殊）”。\n\n#### 解决方案\n\n此处是该 Java 程序。\n\n![](img/00001.gif) `Class_23_1_1`\n\
  \n```java\npublic static void main(String[] args) {\n    int n1, n2;\n    System.out.print(\"\
  Enter an integer: \");\n    n1 = Integer.parseInt(cin.nextLine());\n    System.out.print(\"\
  Enter a second integer: \");\n    n2 = Integer.parseInt(cin.nextLine());\n    if\
  \ (n1 % 2 == 0 && n2 % 2 == 0) {\n        System.out.println(\"Both numbers are\
  \ evens\");\n    } else if (n1 % 2 != 0 && n2 % 2 != 0) {\n        System.out.println(\"\
  Both numbers are odds\");\n    } else {\n        System.out.println(\"Nothing special!\"\
