  \ 4753，它在第一次迭代中可以变为 475，然后是 4，最后是 0。当它变为 0 时，迭代停止。\n\n让我们尝试通过以下流程图理解建议的解决方案。某些语句以通用形式编写。\n\
  \n![Image](img/00288.gif) `digit ← Isolate last digit of variable x.` 使用所示的 `MOD\
  \ 10` 操作写入。\n\n`digit ← x MOD 10`\n\n整个概念依赖于 `x ← Keep all except last digit of\
  \ variable.` 这使得变量 `x` 的值归零，执行流随后退出循环。编写这条语句可以使用所示的 `DIV 10` 操作。\n\n`x ← x DIV 10`\n\
  \n相应，Java 程序变为：\n\n![](img/00001.gif) `Class_30_1_6a`\n```\npublic static void main(String[]\
  \ args) {\n    int x, s, digit;\n    x = Integer.parseInt(cin.nextLine());\n   \
  \ s = 0;\n    while (x != 0) {\n        digit = x % 10;\n        s = s + digit;\n\
  \        x = (int)(x / 10);\n    }\n    System.out.println(s);\n}\n```\n\n\n\n让我们为输入值\
  \ 4753 创建跟踪表，以更好地理解发生了什么。\n\n| 步骤 | 语句 | 注释 | x | digit | s |\n| --- | --- | ---\
  \ | --- | --- | --- |\n| 1 | `x = Integer.parseInt(…)` | 用户输入值 4753 | 4753 | ? |\
  \ ? |\n| 2 | `s = 0` | | 4753 | ? | 0 |\n| 3 | `while (x != 0)` | 验证为真 | | | |\n\
  | 4 | `digit = x % 10` | | 4753 | 3 | 0 |\n| 5 | `s = s + digit` | | 4753 | 3 |\
  \ 3 |\n| 6 | `x = (int)(x / 10)` | | 475 | 3 | 3 |\n| 7 | `while (x != 0)` | 验证为真\
  \ | | | |\n| 8 | `digit = x % 10` | | 475 | 5 | 3 |\n| 9 | `s = s + digit` | | 475\
  \ | 5 | 8 |\n| 10 | `x = (int)(x / 10)` | | 47 | 5 | 8 |\n| 11 | `while (x != 0)`\
  \ | 验证为真 | | | |\n| 12 | `digit = x % 10` | | 47 | 7 | 8 |\n| 13 | `s = s + digit`\
  \ | | 47 | 7 | 15 |\n| 14 | `x = (int)(x / 10)` | | 4 | 7 | 15 |\n| 15 | `while\
  \ (x != 0)` | 验证为真 | | | |\n| 16 | `digit = x % 10` | | 4 | 4 | 15 |\n| 17 | `s\
  \ = s + digit` | | 4 | 4 | 19 |\n| 18 | `x = (int)(x / 10)` | | 0 | 4 | 19 |\n|\
  \ 19 | `while (x != 0)` | 验证为假 | | | |\n| 20 | `.println(s)` | 显示：19 | | | |\n\n\
  ![](img/00003.jpeg)\n\n在 Java 中，两个整数相除除法结果始终是一个整数。因此，在语句 `x = (int)(x / 10)` 中，由于变量\
  \ `x` 和常量值 `10` 都是整数，`(int)` 强制转换运算符是多余的。然而，为了提高可读性，保留它是一个良好的习惯。\n\n#### 第二种方法\n\
  \n在这种方法中，核心思想是将给定的整数转换为字符串，然后使用 for 循环遍历其所有的字符（数字）。然而，在 for 循环中，你需要将每个数字从 `char`\
  \ 类型转换回 `int` 类型，然后将其累加到变量 `s` 中。Java 程序如下。\n\n![](img/00001.gif)\n```java\npublic\
  \ static void main(String[] args) {\n    int i, x, s;\n    String x_str, digit;\n\
  \    x = Integer.parseInt(cin.nextLine());\n    x_str = \"\" + x; // 将用户的输入转换为字符串\n\
  \    s = 0;\n    for (i = 0; i <= x_str.length() - 1; i++) {\n        digit = \"\
  \" + x_str.charAt(i); // 获取“数字”的字符串形式\n        s = s + Integer.parseInt(digit);\n\
  \    }\n    System.out.println(s);\n}\n```\n\n### 30.2 嵌套循环控制结构的练习\n\n#### 练习 30.2-1\
  \ 显示所有包含给定数字的三位数整数\n\n编写一个 Java 程序，提示用户输入一个数字（0 到 9），然后显示所有至少包含该数字的三位数整数。例如，对于给定的值\
  \ 7，数值 357、771 和 700 都是这样的整数。\n\n#### 解法\n\n有三种不同的方法！第一种只使用一个 for 循环，第二种使用三个嵌套的\
  \ for 循环，最后一种将所有三位数整数转换为字符串。让我们分析一下它们吧！\n\n##### 第一种方法 —— 使用 for 循环和决策控制结构\n\n核心思想是使用一个\
  \ for 循环，变量 `counter` 的值从 100 到 999。在循环内部，将计数器变量拆分为各个单独数字（`digit[3]`、`digit[2]`、`digit[1]`），并使用决策控制结构检查其是否至少有一个数字等于给定的数字。Java\
  \ 程序如下。\n\n![](img/00001.gif)\n```java\npublic static void main(String[] args) {\n\
  \    int x, i, digit3, r, digit2, digit1;\n    System.out.print(\"Enter a digit\
  \ 0 - 9: \");\n    x = Integer.parseInt(cin.nextLine());\n    for (i = 100; i <=\
  \ 999; i++) {\n        digit3 = (int)(i / 100);\n        r = i % 100;\n        digit2\
  \ = (int)(r / 10);\n        digit1 = r % 10;\n        if (digit3 == x || digit2\
  \ == x || digit1 == x) {\n            System.out.println(i);\n        }\n    }\n\
  }\n```\n\n##### 第二种方法 —— 使用嵌套循环\n\n核心思想是使用三个嵌套的 for 循环。在这种情况下，有三个计数变量（`digit3`、`digit2`\
  \ 和 `digit1`），每一个都对应三位数整数的一位。Java 程序如下。\n\n![](img/00001.gif)\n```java\npublic static\
  \ void main(String[] args) {\n    int x, digit3, digit2, digit1;\n    System.out.print(\"\
  Enter a digit 0 - 9: \");\n    x = Integer.parseInt(cin.nextLine());\n    for (digit3\
  \ = 1; digit3 <= 9; digit3++) {\n        for (digit2 = 0; digit2 <= 9; digit2++)\
  \ {\n            for (digit1 = 0; digit1 <= 9; digit1++) {\n                if (digit3\
  \ == x || digit2 == x || digit1 == x) {\n                    System.out.println(digit3\
  \ * 100 + digit2 * 10 + digit1);\n                }\n            }\n        }\n\
  \    }\n}\n```\n如果你遵循执行流程，值 100 是第一个被评估的整数（`digit3 = 1`、`digit2 = 0`、`digit1 = 0`）。然后，最内层的循环结构使\
  \ `digit1` 加 1，下一个评估的值是 101。一直持续到 `digit1` 达到值 9；执行流程退出最内层循环结构，变量 `digit2` 加 1，最内层循环重新开始，因此评估的值为\
  \ 110、111、112……119。该过程一直持续到评估所有 999。\n\n![](img/00002.jpeg)注意 `digit3` 从 1 开始，而变量\
  \ `digit2` 和 `digit1` 从 0 开始。这是因为三位数的范围是从 100 而不是 000。\n\n![](img/00002.jpeg)注意\
  \ `System.out.println()` 语句是如何组合三位数的。\n\n##### 第三种方法 —— 将所有三位数整数转换为字符串\n\n使用 for\
  \ 循环，变量 `counter` 的值从 100 到 999。在循环内部，将计数变量转换为字符串，并使用 `indexOf()` 方法检查指定的“数字”是否存在于字符串中。Java\
  \ 程序如下。\n\n![](img/00001.gif)\n```java\npublic static void main(String[] args) {\n\
  \    int i, x;\n    String x_str;\n    System.out.print(\"Enter a digit 0 - 9: \"\
  );\n    x = Integer.parseInt(cin.nextLine());\n    x_str = \"\" + x; // 将用户的输入转换为字符串\n\
  \    for (i = 100; i <= 999; i++) {\n        if (String.valueOf(i).indexOf(x_str)\
  \ != -1) { 或者也可以这样做：\n            // if (\"\" + i).indexOf(x_str) != -1)\n     \
  \       System.out.println(i);\n        }\n    }\n}\n```\n\n#### 练习 30.2-2 显示特定条件的所有实例\n\
  \n编写一个 Java 程序，显示所有第一位小于第二位且第二位小于第三位的三位数整数。例如，数值 357、456 和 159 就是这样的整数。\n\n####\
  \ 解法\n\n实际上有三种不同的方法！让我们分析一下它们！\n\n##### 第一种方法 —— 使用 for 循环和决策控制结构\n\nJava 程序如下。\n\
  \n![](img/00001.gif)\n```java\npublic static void main(String[] args) {\n    int\
  \ i, r, digit1, digit2, digit3;\n    for (i = 100; i <= 999; i++) {\n        digit3\
  \ = (int)(i / 100);\n        r = i % 100;\n        digit2 = (int)(r / 10);\n   \
  \     digit1 = r % 10;\n        if (digit3 < digit2 && digit2 < digit1) {\n    \
  \        System.out.println(i);\n        }\n    }\n}\n```\n\n##### 第二种方法 —— 使用嵌套循环控制结构和决策控制结构\n\
  \nJava 程序如下。\n\n![](img/00001.gif)\n```java\npublic static void main(String[] args)\
  \ {\n    int digit1, digit2, digit3;\n    for (digit3 = 1; digit3 <= 9; digit3++)\
  \ {\n        for (digit2 = 0; digit2 <= 9; digit2++) {\n            for (digit1\
  \ = 0; digit1 <= 9; digit1++) {\n                if (digit3 < digit2 && digit2 <\
  \ digit1) {\n                    System.out.println(digit3 * 100 + digit2 * 10 +\
  \ digit1);\n                }\n            }\n        }\n    }\n}\n```\n\n#####\
  \ 第三种方法 —— 仅使用嵌套循环控制结构\n\n这种方法基于一种方法。它们之间的主要区别在于，在这种情况下，变量 `digit1` 总是从大于 `digit2`\
  \ 的值开始，变量 `digit2` 总是从大于 `digit3` 的值开始。这样，第一个被显示的整数是 123。\n\n![](img/00002.jpeg)在\
  \ 123 以下和 789 以上之间，没有整数可以使布尔表达式 `digit3 < digit2 && digit2 < digit1` 验证为真。\n\nJava\
  \ 程序如下。\n\n\n\n\n\n![](img/00001.gif)\n```java\nClass_30_2_2c\npublic static void\
  \ main(String[] args) {\n    int digit3, digit2, digit1;\n    for (digit3 = 1; digit3\
  \ <= 7; digit3++) {\n        for (digit2 = digit3 + 1; digit2 <= 8; digit2++) {\n\
  \            for (digit1 = digit2 + 1; digit1 <= 9; digit1++) {\n              \
  \  System.out.println(digit3 * 100 + digit2 * 10 + digit1);\n            }\n   \
  \     }\n    }\n}\n```\n\n![](img/00002.jpeg) 这种解决方案是最有效的，因为它没有使用任何决策控制结构，而且迭代次数保持在最低！\n\
  \n![](img/00003.jpeg) 正如你所见，一个问题可以有多种解决方案。找到最优解取决于你！\n\n### 30.3 使用循环控制结构进行数据验证\n\
  \n正如你所知道的，数据验证是限制数据输入的过程，它强制用户只输入有效值。你已经遇到过使用决策控制结构的数据验证方法。让我们来看一个例子。\n\n```java\n\
  System.out.print(\"Enter a non-negative number: \");\nx = Double.parseDouble(cin.nextLine());\n\
  if (x < 0) {\n    System.out.print(\"Error: Negative number entered!\");\n} else\
  \ {\n    System.out.println(Math.sqrt(x));\n}\n```\n\n然而，这种方法并不是最好的，因为如果用户输入了无效数字，程序会显示错误消息并且执行流将不可避免地结束。用户必须重新执行程序以输入有效数字。\n\
  \n接下来，你将看到三种通用形式的方法，它们使用循环控制结构来验证数据输入。如果用户持续输入无效值，核心思想是反复提示他，直到他感到厌烦并输入有效值。当然，如果用户从一开始就输入有效值，执行流将直接继续程序的下一个部分。\n\
  \n你使用哪种方法取决于你是否希望显示错误消息，以及你希望为每个错误显示特定的错误消息，还是对任何类型的错误只显示一个错误消息。\n\n#### 第一种方法——不带错误消息的数据输入验证\n\
  \n要在不显示任何错误消息的情况下验证数据输入，你可以使用下面的通用形式代码片段。\n\n```java\ndo {\n    System.out.print(\"\
  Prompt message\");\n    input_data = cin.nextLine();\n} while (input_data test 1\
  \ fails || input_data test 2 fails || …);\n```\n\n#### 第二种方法——带有一个错误消息的数据输入验证\n\n\
  要验证数据输入并显示错误消息（即对任何类型的输入错误显示相同的错误消息），你可以使用下面的通用形式代码片段。\n\n```java\nSystem.out.print(\"\
  Prompt message\");\ninput_data = cin.nextLine();\nwhile (input_data test 1 fails\
  \ || input_data test 2 fails || … ) {\n    System.out.println(\"Error message\"\
  );\n    System.out.print(\"Prompt message\");\n    input_data = cin.nextLine();\n\
  }\n```\n\n#### 第三种方法——带特定错误消息的数据输入验证\n\n要验证数据输入并显示特定的错误消息（即每种类型的输入错误显示一个），你可以使用下面的通用形式代码片段。\n\
  \n```java\ndo {\n    System.out.print(\"Prompt message\");\n    input_data = cin.nextLine();\n\
  \    failure = false;\n    if (input_data test 1 fails) {\n        System.out.println(\"\
  Error message 1\");\n        failure = true;\n    } else if (input_data test 2 fails)\
  \ {\n        System.out.println(\"Error message 2\");\n        failure = true;\n\
  \    } else if (……)\n} while (failure);\n```\n\n![](img/00002.jpeg) `while (failure)`\
  \ 语句等同于 `while (failure == true)` 语句。\n\n#### 练习 30.3-1 寻找奇偶数 - 无错误消息的验证\n\n编写一个\
  \ Java 程序，提示用户输入一个非负整数，然后显示消息指示该数是否为偶数；否则必须显示“Odd（奇数）”。程序必须使用循环控制结构验证数据输入，允许用户输入非负整数。不需要显示任何错误消息。\n\
  \n**解**\n\n首先，我们写一个不带数据验证的程序。\n\n```java\npublic static void main(String[] args)\
  \ {\n    double x;\n    System.out.print(\"Enter a non-negative integer: \");\n\
  \    x = Double.parseDouble(cin.nextLine());\n    if (x % 2 == 0) {\n        System.out.println(\"\
  Even\");\n    } else {\n        System.out.println(\"Odd\");\n    }\n}\n```\n\n\
  要在不显示任何错误消息的情况下验证数据输入，可以使用第一种方法。你只需要将虚线矩形标记的语句替换为以下代码片段。\n\n```java\ndo {\n    System.out.print(\"\
  Enter a non-negative integer: \");\n    x = Double.parseDouble(cin.nextLine());\n\
  } while (x < 0 || (int)x != x);\n```\n\n![](img/00002.jpeg) 变量 `x` 被声明为 `double`。这是为了允许用户输入整数或浮点数。\n\
  \n最终的 Java 程序变为\n\n```java\n![](img/00001.gif)\nClass_30_3_1\npublic static void\
  \ main(String[] args) {\n    double x;\n    do {\n        System.out.print(\"Enter\
  \ a non-negative integer: \");\n        x = Double.parseDouble(cin.nextLine());\n\
  \    } while (x < 0 || (int)x != x);\n    if (x % 2 == 0) {\n        System.out.println(\"\
  Even\");\n    } else {\n        System.out.println(\"Odd\");\n    }\n}\n```\n\n\
  #### 练习 30.3-2 寻找奇偶数 - 带有一个错误消息的验证\n\n编写一个 Java 程序，提示用户输入一个非负整数，然后显示消息指示该数是否为偶数；否则必须显示“Odd”。程序必须使用循环控制结构验证数据输入，并在用户输入负值或浮点数时显示错误消息。\n\
  \n**解**\n\n在在上一个练习中，虚线矩形标记的语句被替换为在不显示任何错误消息的情况下验证数据输入的代码片段。这里遵循相同的方法，但替换的代码片段基于第二种方法。Java\
  \ 程序如下。\n\n```java\n![](img/00001.gif)\nClass_30_3_2\npublic static void main(String[]\
  \ args) {\n    double x;\n    System.out.print(\"Enter a non-negative integer: \"\
  );\n    x = Double.parseDouble(cin.nextLine());\n    while (x < 0 || (int)x != x)\
  \ {\n        System.out.println(\"Error! A negative value or a float entered.\"\
  );\n        System.out.print(\"Enter a non-negative integer: \");\n        x = Double.parseDouble(cin.nextLine());\n\
  \    }\n    if (x % 2 == 0) {\n        System.out.println(\"Even\");\n    } else\
  \ {\n        System.out.println(\"Odd\");\n    }\n}\n```\n\n#### 练习 30.3-3 寻找奇偶数\
  \ - 带特定错误消息的验证\n\n编写一个 Java 程序，提示用户输入一个非负整数，然后显示消息指示该数是否为偶数；否则必须显示“Odd”。程序必须使用循环控制结构验证数据输入，并在用户输入负值或浮点数时显示特定的错误消息。\n\
  \n**解**\n\n这与上一个练习相同，但替换的代码片段基于第三种方法。Java 程序如下。\n\n```java\n![](img/00001.gif)\n\
  Class_30_3_3\npublic static void main(String[] args) {\n    double x;\n    boolean\
  \ failure;\n    do {\n        System.out.print(\"Enter a non-negative integer: \"\
  );\n        x = Double.parseDouble(cin.nextLine());\n        failure = false;\n\
  \        if (x < 0) {\n            System.out.println(\"Error! You entered a negative\
  \ value\");\n            failure = true;\n        } else if ((int)x != x) {\n  \
  \          System.out.println(\"Error! You entered a float\");\n            failure\
  \ = true;\n        }\n    } while (failure);\n    if (x % 2 == 0) {\n        System.out.println(\"\
  Even\");\n    } else {\n        System.out.println(\"Odd\");\n    }\n}\n```\n\n\
  #### 练习 30.3-4 计算四个数的之和\n\n\n\n\n编写一个 Java 程序，提示用户输入四个正数，然后计算并显示它们的和。使用循环控制结构，程序还必须对数据输入进行验证，并在用户输入非正值时显示错误信息。\n\
  \n#### 解决方案\n\n这个练习已经在 练习 26.1-4 中讨论过。这里的唯一区别是，此程序必须对数据输入进行验证，并在用户输入无效值时显示错误信息。为了方便起见，这里在此在此练习中提出的解决方案。\n\
  \n```java\ntotal = 0;\nfor (i = 1; i <= 4; i++) {\n    System.out.print(\"Enter\
  \ a number: \");\n    x = Double.parseDouble(cin.nextLine());\n    total += x;\n\
  }\nSystem.out.println(total);\n```\n\n现在，将虚线形标记的语句替换为以下代码片段\n\n```java\nSystem.out.print(\"\
  Enter a number: \");\nx = Double.parseDouble(cin.nextLine());\nwhile (x <= 0) {\n\
  \    System.out.println(\"Please enter a positive value!\");\n    System.out.print(\"\
  Enter a number: \");\n    x = Double.parseDouble(cin.nextLine());\n}\n```\n\n然后最终的\
  \ Java 程序变为\n\n![](img/00001.gif)\n```java\nClass_30_3_4\npublic static void main(String[]\
  \ args) {\n    int i;\n    double total, x;\n    total = 0;\n    for (i = 1; i <=\
  \ 4; i++) {\n        System.out.print(\"Enter a number: \");\n        x = Double.parseDouble(cin.nextLine());\n\
  \        while (x <= 0) {\n            System.out.println(\"Please enter a positive\
  \ value!\");\n            System.out.print(\"Enter a number: \");\n            x\
  \ = Double.parseDouble(cin.nextLine());\n        }\n        total += x;\n    }\n\
  \    System.out.println(total);\n}\n```\n\n![](img/00002.jpeg) 这个练习的基本目的是向你展示如何将验证数据输入的循环控制结构嵌套到其他已有的循环控制结构中。\n\
  \n### 30.4 使用循环控制结构解决数学问题\n\n#### 练习 30.4-1 计算用户要求的任意数量三角形的面积\n\n编写一个 Java 程序，提示用户输入三角形三边\
  \ `A`、`B` 和 `C` 的长度，然后计算并显示其面积。你可以使用海伦公式，\n\n![Image](img/00143.gif)\n\n其中 `S` 是半周\n\
  \n![Image](img/00144.gif)\n\n程序必须根据用户的意愿进行迭代。在每次面积计算结束时，程序必须询问用户其是否希望计算另一个三角形的面积。如果答案是“yes”，程序必须重复；否则结束。使你的程序能够接受所有可能的答案形式，例如“yes”、“YES”、“Yes”或甚至“YeS”。\n\
  \n此外，使用循环控制结构，程序必须对数据输入进行验证，并在用户输入非正值时显示错误信息。\n\n#### 解决方案\n\n根据“终极”（Ultimate）规则，后测试循环结构的形式如下，给出一般形式。\n\
  \n```java\nanswer = \"yes\";    // 初始化 answer（冗余）。\ndo {\n    提示用户输入三角形三边 A, B,\
  \ C 的长度，然后计算并显示其面积。\n    System.out.print(\"Would you like to repeat? \");\n   \
  \ answer = cin.nextLine();      // 更新/修改 answer\n} while (answer.toUpperCase().equals(\"\
  YES\"));\n```\n\n![](img/00003.jpeg) `toUpperCase()` 方法确保了程序对于任何给定的答案“Yes”、“yes”、“YES”甚至“YeS”或“yEs”都能正常运行！\n\
  \n该练习的解决方案如下。\n\n![](img/00001.gif)\n```java\nClass_30_4_1\npublic static void main(String[]\
