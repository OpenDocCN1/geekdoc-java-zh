  \    t = 500 * 0.10 + 1500 * 0.25 + 2500 * 0.4 + (kwh - 4500) * 0.6;\n    }\n  \
  \  System.out.println(\"Total amount to pay: \" + t);\n}\n```\n\n\n\n\n\n#### 练习\
