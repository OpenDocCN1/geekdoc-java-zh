  \ 练习 13.1-3 显示已时间\n\n编写一个 Java 程序，提示用户输入一个表示秒持续时间的整数，然后以“DD days HH hours MM minutes\
  \ and SS seconds”的格式显示。例如，如果用户输入数字 700005，必须显示“8 days 2 hours 26 minutes and 45\
  \ seconds”。\n\n#### 解决方案\n\n让我们尝试使用上一个练习中学的第一种方法分析数字 700005。\n\n你可能已经知道，分钟有 60 秒，一小时有\
  \ 3600 秒（60 × 60），一天有 86400 秒（3600 × 24）。\n\n\n\n\n\n![](img/00001.gif) `Class_13_1_3a`\n\
  ```java\npublic static void main(String[] args) {\n    int days, hours, minutes,\
  \ number, r, seconds;\n    System.out.print(\"Enter a period of time in seconds:\
  \ \");\n    number = Integer.parseInt(cin.nextLine());\n    days = (int)(number\
  \ / 86400); // 60 * 60 * 24 = 86400\n    r = number % 86400;\n    hours = (int)(r\
  \ / 3600); // 60 * 60 = 3600\n    r = r % 3600;\n    minutes = (int)(r / 60);\n\
  \    seconds = r % 60;\n    System.out.println(days + \" days \" + hours + \" hours\
  \ \");\n    System.out.println(minutes + \" minutes and \" + seconds + \" seconds\"\
  );\n}\n```\n\n你也可以使用上一个练习中的第二方法来解决这个练习。你只需要先除以 60，再次除以 60，最后除以 24，如下所示。\n\n![](img/00001.gif)\
  \ `Class_13_1_3b`\n```java\npublic static void main(String[] args) {\n    int days,\
  \ hours, minutes, number, r, seconds;\n    System.out.print(\"Enter a period of\
  \ time in seconds: \");\n    number = Integer.parseInt(cin.nextLine());\n    seconds\
  \ = number % 60;\n    r = (int)(number / 60);\n    minutes = r % 60;\n    r = (int)(r\
  \ / 60);\n    hours = r % 24;\n    days = (int)(r / 24);\n    System.out.println(days\
  \ + \" days \" + hours + \" hours \");\n    System.out.println(minutes + \" minutes\
  \ and \" + seconds + \" seconds\");\n}\n```\n\n#### 练习 13.1-4 反转数字\n\n编写一个 Java\
  \ 程序，提示用户输入三位整数，然后将其反转。例如，如果用户输入数字 375，则必须显示数字 573。\n\n解决方案\n\n为了分离出给定数字的三个数字，你可以使用第一或第二种方法。之后，这个练习中唯一的难点在于构建反转后的数字。以数字\
  \ 375 为例，分离后的三个数字为：\n\n`digit1 = 3`\n`digit2 = 7`\n`digit3 = 5`\n\n你可以通过简单计算乘积之和来构建反转后的数字：\n\
  \n`digit3 × 100 + digit2 × 10 + digit1 × 1`\n\n为了换一种方法，你可以使用第二种方法分割给定数字。Java 程序看起来如下。\n\
