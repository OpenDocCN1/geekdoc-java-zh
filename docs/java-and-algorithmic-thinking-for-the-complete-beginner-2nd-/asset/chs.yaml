  \ 的子程序，通过其形式参数列表接收一个整数和一个数组，并返回该整数在数组中出现的次数。\niii. 使用上述子程序，编写一个 Java 程序，用 100 个随机整数（1\
  \ 到 6 之间）填充数组，然后让用户输入一个整数。程序必须显示该整数在数组中出现了多少次。\n\n#### 解决方案\n\n这两个子程序都可以写为方法，因为它们都返回一个值。`dice()`\
  \ 方法返回一个 1 到 6 之间的随机整数，`search_and_count()` 方法返回一个表示整数在数组中出现次数的数字。\n\n\n\n\n![](img/00001.gif)\n\
  ```java\nstatic final int ELEMENTS = 100;\nstatic int dice() {\n    return 1 + (int)(Math.random()\
  \ * 5);\n}\nstatic int search_and_count(int x, int[] a) {\n    int count = 0;\n\
  \    int i;\n    for (i = 0; i <= ELEMENTS - 1; i++) {\n        if (a[i] == x) {\n\
  \            count++;\n        }\n    }\n    return count;\n}\npublic static void\
  \ main(String[] args) {\n    int x, i;\n    int[] a = new int[ELEMENTS];\n    for\
  \ (i = 0; i <= ELEMENTS - 1; i++) {\n        a[i] = dice();\n    }\n    x = Integer.parseInt(cin.nextLine());\n\
  \    System.out.println(\"Given value exists in the array\");\n    System.out.println(search_and_count(x,\
  \ a) + \" times\");\n}\n```\n\n### 练习 38.2-5 每个骰子数字出现了多少次？\n\n使用上一个练习中引用的 `dice()`\
  \ 和 `search_and_count()` 方法，编写一个 Java 程序，用 100 个随机整数（1 到 6 之间）填充数组，然后显示这六个数字在数组中各出现的次数，以及哪个数字出现的频率最高。\n\
  \n#### 解决方案\n\n如果你打算不使用循环控制结构来解决这个练习，代码将如下所示。\n\n```java\n// 将数组 an1 中值 1 出现的次数赋值给\
  \ n1\nn1 = search_and_count(1, a);\n// 将数组 an2 中值 2 出现的次数赋值给 n2\nn2 = search_and_count(2,\
  \ a);\n...\n// 将数组 an6 中值 6 出现的次数赋值给 n6\nn6 = search_and_count(6, a);\n// 显示这六个数字在数组\
  \ a 中各出现的次数\nSystem.out.println(n1 + \"  \" + n2 + \"  \" + n3 + \"  \" + n4 + \"\
  \  \" + n5 + \"  \" + n6);\n// 寻找 n1, n2,… n6 中的最大值\nmaximum = n1;\nmax_i = 1;\n\
  if (n2 > maximum) {\n    maximum = n2;\n    max_i = 2;\n}\nif (n3 > maximum) {\n\
  \    maximum = n3;\n    max_i = 3;\n}\n...\nif (n6 > maximum) {\n    maximum = n6;\n\
  \    max_i = 6;\n}\n// 显示哪个数字在数组中出现频率最高\nSystem.out.println(max_i);\n```\n\n但现在你已经读到了书的最后，当然可以做一些更有创意的事情。与其将\
  \ `search_and_count()` 方法的每个结果赋值给单独变量 `n1`、`n2`、`n3`、`n4`、`n5` 和 `n6`，你可以将这些结果赋值给名为\
