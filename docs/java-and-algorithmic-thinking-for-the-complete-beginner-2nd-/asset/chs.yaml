  - d. 一个名为 `display_dimensions` 的公共 void 方法，用于显示箱子的尺寸。\nii. 使用上面提到的类编写一个 Java 程序，提示用户输入三个箱子的尺寸，然后显示它们的尺寸和体积。\n\
