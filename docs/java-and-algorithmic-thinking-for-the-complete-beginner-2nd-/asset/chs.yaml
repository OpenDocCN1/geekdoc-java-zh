  \n\n\n\n\n## 编程练习\n\n### 5. 自动取款机（ATM）中有 10 美元、5 美元和 1 美元的钞。编写一个 Java 程序来模拟这台 ATM\
  \ 的工作方式。开始，机器提示用户输入四位 PIN 码并检查 PIN 的有效性（假设“1234”为有效 PIN）。如果提供的 PIN 正确，程序必须提示用户输入其想要取的金额（整数值），最后显示\
  \ ATM 必须取出的最少钞票数量。例如，如果用户输入的金额为 36 美元，程序必须显示“3 张 10 美元钞，1 张 5 美元钞和 1 张 1 美元钞”。此外，如果用户输入了错误的\
  \ PIN，机器允许其重试两次。如果用户三次都输入错误的 PIN，则必须显示“PIN locked（PIN 已锁定）”的消息并且程序结束。假设用户输入的金额是有效的。\n\
  \n### 6. 编写一个 Java 程序，提示用户输入两个值，一个是温度，一个是风速。如果温度高于 75 华氏度，则认为当天天气炎热，否则为寒冷。如果风速高于\
  \ 12 英英小时，则认为当天有风，否则无风。程序必须根据给定的值显示一条信息。例如，如果用户输入的温度为 60，风速为 10，程序必须显示“当天天气很寒冷且无风”。假设用户输入的是有效值。\n\
  \n# 第 21 章\n\n## 关于带决策控制结构的流程图\n\n### 21.1 引言\n\n通过学习前面的章节，你已经熟悉了所有的决策控制结构。由于流程图是学习“算法化思维”以及帮助你更好地理解特定控制结构的理想方式，本章专门用于教你如何将\
