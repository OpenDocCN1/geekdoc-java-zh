  \ `ELEMENTS – 1`。显然，`pos_index + neg_index` 等于 `ELEMENTS`。\n\n### 练习 34.1-6 创建包含数字\
  \ 5 的数组\n\n编写一个 Java 程序，让用户向数组输入 100 个双位整数，然后创建一个新数组，仅包含包含至少一个数字 5 的整数。\n\n####\
  \ 解决方案\n\n这个练习需要用到以前的知识。在练习 13.1-2 中，你学习了如何使用商和余数将一个整数拆分为各个单独数字。在这里，整数有两个数字；因此，你可以使用以下代码片段来拆分变量\
