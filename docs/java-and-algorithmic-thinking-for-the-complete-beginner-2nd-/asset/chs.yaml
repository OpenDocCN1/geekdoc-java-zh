  ### 复习字游戏\n\n1. 完成以下填字游戏。\n\n![Image](img/049.jpeg)\n\n横向\n2. `length()` 方法返回字符串中的数量。\n\
  6. 任何你可以使用键盘输入的内容。\n7. Java 提供了许多。\n8. 这种控制结构指的是语句按行执行的方式。\n\n向下\n1. 空白字符。\n3. 从字符串的开头或结尾移除空白字符的过程。\n\
  4. `Math.sin()` 方法返回数字的。\n5. `Math.abs()` 函数返回数字的值。\n\n### 复习题\n\n回答以下问题：\n\n1.\
  \ 什么是序列控制结构？\n2. 序列控制结构可以执行哪些操作？\n3. 给整数除法的商和余数举几个例子。\n4. 什么是方法？\n5. “链式方法”术语是什么意思？\n\
  6. “嵌套方法”术语是什么意思？\n\n\n\n\n\n![](img/00002.jpeg)布尔表达式是一个问题，它们应该被读为“某值是否等于/大于/小于其他某值？”，而答案只是“是”或“否”（真或假）。\n\
  \n![](img/00003.jpeg)决策控制结构可以评估一个布尔表达式或一组布尔表达式，然后决定执行哪块语句。\n\n### 15.3 如何编写简单的布尔表达式\n\
  \n一个简单的布尔表达式的写形式为：\n\n`Operand1 Comparison_Operator Operand2`\n\n其中：\n\n- `Operand1`\
  \ 和 `Operand2` 可以是值、变量或数学表达式。\n- `Comparison_Operator` 可以是表 15-1 所示的运算符之一。\n\n|\
  \ 比较运算符 | 描述 |\n| --- | --- |\n| `==` | 等于（非赋值操作符） |\n| `!=` | 不等于 |\n| `>` | 大于\
  \ |\n| `<` | 小于 |\n| `>=` | 大于等于 |\n| `<=` | 小于等于 |\n\n表 15-1 Java 中的比较运算符\n\n以下是一些布尔表达式的示例：\n\
  \n- `x > y`。这个布尔表达式是对计算机的一个问题，可以读作“x 大于 y 吗？”\n- `x <= y`。这个布尔表达式也是对计算机的一个问题，可以读作“x\
  \ 小于等于 y 吗？”\n- `x != 3 * y + 4`。这可以读作“x 不等于表达式 `3 * y + 4` 的结果吗？”\n- `s.equals(\"\
  Hello\") == true`。这可以读作“s 等于单词 'Hello' 吗？”换句话说，这个问题可以读作“s 包含单词 'Hello' 吗？”![](img/00003.jpeg)在\
  \ Java 中，为了测试两个字符串在字典顺序上是否相等，你需要使用 `equals()` 方法。\n\n- `x == 5`。这可以读作“x 等于 5 吗？”\n\
  \n![](img/00002.jpeg)新手程序员在编写 Java 程序时经常犯的一个非常常见的错误是将值赋值操作符与等号运算符混淆。他们经常在实际上想表达\
  \ `x == 5` 时误写成 `x = 5`。\n\n#### 练习 15.3-1 填充表格\n\n根据变量 `a`、`b` 和 `c` 的值，在下表中填入“true”或“false”。\n\
  \n| a | b | c | a == 10 | b <= a | c > 3 * a - b |\n| --- | --- | --- | --- | ---\
  \ | --- |\n| 3 | −5 | 7 | | | |\n| 10 | 10 | 21 | | | |\n| −4 | −2 | −9 | | | |\n\
  \n解法\n\n前两个布尔表达式是显而易见的，不需要进一步的解释。\n\n关于布尔表达式 `c > 3 * a – b`，请非常小心 `b` 为负的情况。例如，在第一行中，`a`\
  \ 等于 3，`b` 等于 −5。表达式 `3 * a - b` 的结果为 `3 * 3 – (−5) = 3 * 3 + 5 = 14`。由于变量 `c` 的内容（第一行中）并不大于\
  \ 14，因此布尔表达式 `c > 3 * a – b` 的结果为 false。\n\n经过计算后，表格如下：\n\n| a | b | c | a == 10\
  \ | b <= a | c > 3 * a - b |\n| --- | --- | --- | --- | --- | --- |\n| 3 | −5 |\
  \ 7 | false | true | false |\n| 10 | 10 | 21 | true | true | true |\n| −4 | −2 |\
  \ −9 | false | false | true |\n\n### 15.4 逻辑运算符和复杂的布尔表达式\n\n一个更复杂的布尔表达式由更简单的布尔表达式构建，可以写成：\n\
  \n`BE1 Logical_Operator BE2`\n\n其中：\n\n- `BE1` 和 `BE2` 可以是任何布尔表达式。\n- `Logical_Operator`\
  \ 可以是表 15-2 所示的运算符之一。\n\n| 逻辑运算符 | 描述 |\n| --- | --- |\n| `&&` | 与（也称为逻辑合与） |\n\
  | `||` | 或（也称为逻辑析取） |\n| `!` | 非（也称为否定或逻辑取反） |\n\n表 15-2 Java 中的逻辑运算符\n\n![](img/00002.jpeg)当你将简单的布尔表达式与逻辑运算符结合时，整个布尔表达式被称为“复杂布尔表达式”。例如，表达式\
  \ `x == 3 && y > 5` 就是一个复杂的布尔表达式。\n\n#### 与 ( && ) 运算符\n\n当你在两个布尔表达式之间使用与运算符 `(BE1\
  \ && BE2)` 时，意味着只有当 `BE1` 和 `BE2` 两个布尔表达式都为真时，整个复杂布尔表达式的结果为真。\n\n你可以将这些信息组织在所谓的真表中。真表显示了两个或多个布尔表达式之间在所有可能的值组合下的逻辑操作结果。这里显示了与\
  \ (`&&`) 运算符的真表。\n\n| BE1 (布尔表达式 1) | BE2 (布尔表达式 2) | BE1 && BE2 |\n| --- | ---\
  \ | --- |\n| false | false | false |\n| false | true | false |\n| true | false |\
  \ false |\n| true | true | true |\n\n你可以在两个布尔表达式之间使用或运算符 `(BE1 || BE2)`，这意味着只有当\
  \ `BE1` 或 `BE2` 两个布尔表达式至少有一个为真时，整个复杂布尔表达式的结果为真。\n\n你可以将这些信息组织在所谓的真表中。真表显示了两个或多个布尔表达式之间在所有可能的值组合下的逻辑操作结果。这里显示了或\
  \ (`||`) 运算符的真表。\n\n| BE1 (布尔表达式 1) | BE2 (布尔表达式 2) | BE1 || BE2 |\n| --- | ---\
  \ | --- |\n| false | false | false |\n| false | true | true |\n| true | false |\
  \ true |\n| true | true | true |\n\n#### 非 ( ! ) 运算符\n\n当你在布尔表达式前面使用非运算符 `(!BE)`，意味着当布尔表达式\
  \ `BE` 为假时，结果为真，反之亦然。\n\n非运算符的真表如下表所示：\n\n| BE (布尔表达式) | !(BE) |\n| --- | --- |\n\
  | false | true |\n| true | false |\n\n例如，表达式 `!(age > 5)` 在变量 `age` 的值小于或等于 5 时为真。如果变量\
  \ `age` 的值为 6，则整个表达式为假。\n\nimages/00002.jpeg)逻辑运算符非 (!!) 反转布尔表达式的结果。在 Java 中，布尔表达式必须放在括号内。\n\
  \n### 15.5 将布尔表达式的结果赋值给变量\n\n由于布尔表达式返回一个值（真或假），这个值可以直接赋值给变量。例如，表达式 `a = x > y` 将真或假赋值给变量\
  \ `a`。它可以读作“如果变量 `x` 的内容大于变量 `y` 的内容，则给变量 `a` 赋值真；否则赋值假”。下一个示例将在屏幕上显示真。\n\n```java\n\
  public static void main(String[] args) {\n    int x, y;\n    boolean a;\n    x =\
  \ 8;\n    y = 5;\n    a = x > y;\n    System.out.println(a);\n}\n```\n\n### 15.6\
  \ 逻辑运算符的优先级是什么？\n\n一个更复杂的布尔表达式可能由多个逻辑运算符组成，如这里的表达式所示：\n\n`x > y || x == 5 && x <=\
  \ z || !(z == 1)`\n\n因此，一个合理的问题是“哪个执行逻辑操作？”\n\n逻辑运算符遵循适用于大多数编程语言的优先级规则。优先级顺序是：逻辑非\
  \ (`!`) 首先执行，逻辑合与 (`&&`) 接着执行，逻辑析取 (`||`) 最后执行。\n\n| 高优先级 ![Image](img/00059.jpeg)\
  \ | |\n\n| 低优先级 | 逻辑运算符 |\n| --- | --- |\n| `!` | |\n| `&&` | |\n| `||` | |\n\n\n\
  \n\n# 表 15-3 逻辑运算符的优先级\n\n![](img/00002.jpeg)你始终可以使用括号来改变默认的优先级。\n\n### 15.7 算术运算符、比较运算符和逻辑运算符的优先级是什么？\n\
  \n在很多情况下，一个表达式可能包含不同类型的运算符，如下例所示。\n\n```java\na * b + 2 > 21 || !(c == b / 2) &&\
  \ c > 13\n```\n\n在这些情况下，首先执行算术运算，接着执行比较运算，最后执行逻辑运算，如下表所示。\n\n| 优先级较高 ![Image](img/00059.jpeg)\
  \ | 优先级较低 |\n| :--- | :--- |\n| 算术运算符 | `*`, `/`, `%` |\n| | `+`, `−` |\n| 比较运算符\
  \ | `<`, `<=`, `>`, `>=`, `==`, `!=` |\n| 逻辑运算符 | `!` |\n| | `&&` |\n| | `||` |\n\
  \n表 15-4 算术运算符、比较运算符和逻辑运算符的优先级\n\n#### 练习 15.7-1 填充真值表\n\n根据变量 `a`、`b` 和 `c` 的值，在下表中填充“true”或“false”。\n\
  \n| `a` | `b` | `c` | `a > 2 || c > b && c > 2` | `!(a > 2 || c > b && c > 2)` |\n\
  | :--- | :--- | :--- | :--- | :--- |\n| 1 | -5 | 7 | | |\n| 10 | 10 | 3 | | |\n\
  | -4 | -2 | -9 | | |\n\n#### 答案\n\n要计算复杂的布尔表达式的结果，你可以使用以下图形化方法。\n\n对于 `a = 1`, `b\
  \ = −5`, `c = 7`，\n\n![Image](img/00150.gif)\n\n最终结果为 true。\n\n![](img/00003.jpeg)与\
  \ (`&&`) 运算的优先级更高，在或（||）运算之前执行。\n\n对于 `a = 10`, `b = 10`, `c = 3`，\n\n![Image](img/00151.gif)\n\
  \n最终结果为 true。\n\n对于 `a = −4`, `b = −2`, `c = −9`，\n\n![Image](img/00152.gif)\n\n\
  最终结果为 false。\n\n表格第五列的值可以很容易地计算出来，因为其列标题中的布尔表达式与第四列的表达式几乎相同。唯一的区别是表达式前面的非 (`!`)\
  \ 运算符。因此，第五列的值只需简单地对第四列的结果取反即可得到！\n\n最终的真值表所示。\n\n| `a` | `b` | `c` | `a > 2 ||\
  \ c > b && c > 2` | `!(a > 2 || c > b && c > 2)` |\n| :--- | :--- | :--- | :---\
  \ | :--- |\n| 1 | -5 | 7 | true | false |\n| 10 | 10 | 3 | true | false |\n| -4\
  \ | -2 | -9 | false | true |\n\n#### 练习 15.7-2 计算复杂布尔表达式的结果\n\n当变量 `a`、`b`、`c` 和\
  \ `d` 分别包含 5、2、7 和 −3 值时，计算以下复杂布尔表达式的结果。\n\ni. `(3 * a + b / 47 - c * b / a > 23)\
  \ && (b != 2)`\nii. `(a * b - c / 2 + 21 * c / 3) || (a >= 5)`\n\n#### 答案\n\n不要害怕！结果可以很容易地找到。你只需要回忆与\
  \ (`&&`) 和或 (`||`) 运算符的规则即可。\n\ni. 当两个布尔表达式都为真时，与 (`&&`) 运算符的结果为真。如果你仔细观察，右侧布尔表达式（`b\
  \ != 2`）的结果为 false。因此，你不需要浪费时间计算左侧布尔表达式的结果。最终结果一定是 false。\nii. 当至少有一个布尔表达式为真时，或\
  \ (`||`) 运算符的结果为真。如果你仔细观察，右侧布尔表达式（`a >= 5`）的结果实际上是 true。因此，不必费力计算左侧布尔表达式的结果。最终结果一定是\
  \ true。\n\n#### 练习 15.7-3 将英语句子转换为布尔表达式\n\n一位主任要求学生根据年龄举手。他想找到以下学生：\n\ni. 年龄在 9\
  \ 岁到 12 岁之间的。\nii. 8 岁以下且 11 岁以上的。\niii. 8 岁、10 岁和 12 岁的。\niv. 年龄在 6 岁到 8 岁之间，且在\
  \ 10 岁到 12 岁之间的。\nv. 既不是 10 岁也不是 12 岁的。\n\n#### 答案\n\n为了组合所需的布尔表达式，使用了变量 `age`。\n\
  \ni. 句子“年龄在 9 岁到 12 岁之间”可以用所示图形化表示。\n\n![Image](img/00153.gif)\n\n不过！编写 `9 ≤ age\
  \ ≤ 12` 是有效的，但在代码中你应该使用 `9 <= age && age <= 12`。\n\nii. 句子“8 岁以下且 11 岁以上”可以用所示图形化表示。\n\
  \n![Image](img/00154.gif)\n\niv. 句子“年龄在 6 岁到 8 岁之间，且在 10 岁到 12 岁之间”可以用所示图形化表示。\n\
  \n![Image](img/00155.gif)\n\nv. “既不是 10 岁也不是 12 岁”的布尔表达式可以写成：\n\n```java\nage !=\
  \ 10 && age != 12\n```\n或者写成：\n\n```java\n!(age == 10 || age == 12)\n```\n\n\n\n\
  \n第二种方法稍微复杂，但并不难学。你只需要根据下表对每个运算符进行取反即可。\n\n| 原始运算符 | 取反后的运算符 |\n| --- | --- |\n\
  | `==` | `!=` |\n| `!=` | `==` |\n| `>` | `<=` |\n| `<` | `>=` |\n| `<=` | `>` |\n\
  | `>=` | `<` |\n| `&&` | `||` |\n| `||` | `&&` |\n| `!` | `!` |\n\n![](img/00002.jpeg)\n\
  注意，非（`!`) 运算符保持不变。\n\n例如，如果原始布尔表达式是：\n\n`x > 5 && y == 3`\n\n那么取反后的布尔表达式变为：\n\n\
  `x <= 5 || y != 3`\n\n### 练习 15.8-1 取反布尔表达式\n\n使用两种方法对以下布尔表达式进行取反。\n\ni. `b != 4`\n\
  ii. `a * 3 + 2 > 0`\niii. `!(a == 5 && b >= 7)`\niv. `a == true`\nv. `b > 7 && !(x\
  \ > 4)`\nvi. `a == 4 || b != 2`\n\n#### 答案\n\n#### 第一种方法\n\ni. `!(b != 4)`\nii.\
  \ `!(a * 3 + 2 > 0)`\niii. `!(!(a == 5 && b >= 7))`，或者等价于 `a == 5 && b >= 7`\n\n\
  ![](img/00002.jpeg)\n两次取反等于肯定。也就是说，两个连续的非（`!`）运算符会相互取反。\n\niv. `!(a == true)`\n\
  v. `!(b > 7 && !(x > 4))`\nvi. `!(a == 4 || b != 2)`\n\n#### 第二种方法\n\ni. `b == 4`\n\
  ii. `a * 3 + 2 <= 0`\n\n![](img/00002.jpeg)\n注意，算术运算符是不“取反”的。千万不要尝试将加号（`+`）替换为减号（`–`）运算符！\n\
  \niii. `!(a != 5 || b < 7)`\n\n![](img/00002.jpeg)\n注意，非（`!`）运算符保持不变。\n\niv. `a\
  \ != true`\nv. `b <= 7 || !(x <= 4)`\nvi. `a != 4 && b == 2`\n\n### 15.9 复习题：判断对错\n\
  \n对以下每个陈述选择对或错。\n\n1. 布尔表达式是一个始终产生两个值之一的表达式。\n2. 布尔表达式包含至少一个逻辑运算符。\n3. 在 Java 中，表达式\
  \ `x = 5` 用于测试变量 `x` 是否等于 5。\n4. 在 Java 中，语句 `a = b == c;` 不是一个有效的 Java 语句。\n5.\
  \ 布尔表达式 `b < 5` 用于测试变量 `b` 是否小于或等于 5。\n6. 与（`&&`）运算符也被称为逻辑取或运算符。\n7. 或（`||`）运算符也被称为逻辑逻辑/补运算符。\n\
  8. 给定两个布尔表达式都为真，则这两个布尔表达式的逻辑取与的结果等于它们逻辑取或的结果。\n9. 如果定两个布尔表达式的值不同，则这两个布尔表达式的逻辑取或的结果为真。\n\
  10. 表达式 `c == 3 && d > 7` 被认为是一个布尔表达式。\n11. 当两个操作数（布尔表达式）都为真时，逻辑运算符或（`||`）的结果为真。\n\
  12. 当变量 `x` 包含除 5 以外的任何值时，布尔表达式 `!(x == 5)` 的结果为真。\n13. 非（`!`）运算符在逻辑运算符中优先级最高。\n\
  14. 或（`||`）运算符在逻辑运算符中优先级最低。\n15. 在布尔表达式 `x > y || x == 5 && x <= z` 中，与（`&&`）操作在或（`||`）操作之前执行。\n\
  16. 在布尔表达式 `a * b + c > 21 || c == b / 2` 中，程序首先测试 `c` 是否大于 21。\n17. 当老师想找到年龄小于\
  \ 8 岁且大于 11 岁的学生时，对应的布尔表达式是 `age < 8 && age > 11`。\n18. 布尔表达式 `x < 0 && x > 100`\
  \ 对于任何 `x` 的取值始终为假。\n19. 布尔表达式 `x > 0 || x < 100` 对于任何 `x` 的取值始终为真。\n20. 布尔表达式 `x\
  \ > 5` 等于 `!(x < 5)`。\n21. 布尔表达式 `!(x > 5 && y == 5)` 不等于 `!(x > 5) && y == 5`。\n\
  22. 在威廉·莎士比亚的《哈姆莱特》（第三幕第一场）中，主角说：“生存还是毁灭，这是一个问题：…… ”。 如果你将其写成一个布尔表达式 `to_be || !to_be`，那么这个“莎士布尔”表达式在以下代码片段下的结果为真：\n\
  ```\nto_be = 1 > 0;\nthat_is_the_question = to_be || !to_be;\n```\n23. 布尔表达式 `!(!(x\
  \ > 5))` 等于 `x > 5`。\n\n### 15.10 复习题：单选题\n\n为以下每个陈述选择正确答案。\n\n1. 下哪个不是比较运算符？\n\
