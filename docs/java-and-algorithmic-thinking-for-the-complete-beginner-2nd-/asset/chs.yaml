  \   if (values[i] % 2 == 0) {\n            System.out.println(values[i]);\n    \
  \    }\n    }\n}\n```\n\n### 31.8 什么是 HashMap?\n\n\n\n\n`hashmap` 和数组之间的主要区别是 `hashmap`\
  \ 元素可以使用 `key` 进行唯一标识，而该键不一定是整数值。`hashmap` 的每个键都与一个元素关联（或者如果你愿意的话，可以称为映射）。`hashmap`\
  \ 键的类型可以是字符串、整数、浮点数或元组。\n\n下面的示例展示了一个包含家庭成员名称的 `hashmap`。该 `hashmap` 的名称为 `family`，对应的键写在每个元素上方。\n\
  \n![Image](img/00325.gif)\n\n![](img/00002.jpeg)`hashmap` 元素的键在 `hashmap` 内部必须是唯一的。这意味着在\
  \ `family` 这个 `hashmap` 中，例如，你不能拥有两个名为 `father` 的键。\n\n![](img/00002.jpeg)`hashmap`\
  \ 元素的值可以是任何类型。\n\n### 31.9 在 Java 中创建 HashMaps\n\n让我们尝试使用最常用的方法来创建下的 `hashmap`。\n\
  \n![Image](img/00326.gif)\n\n#### 第一种方法\n\n要创建一个 `hashmap` 并直接为其元素赋值，你可以使用下面通用形式的\
  \ Java 语句。\n\n```java\nHashMap<key_type, value_type> hashmap_name = new HashMap<>(Map.of(key0,\
  \ value0, key1, value1, key2, value2, … keyM, valueM));\n```\n\n其中：\n\n- `key_type`\
  \ 是键的类型。可以是 `String`、`Integer`、`Double` 等。\n- `value_type` 是元素的类型。可以是 `String`、`Integer`、`Double`\
  \ 等。\n- `hashmap_name` 是 `hashmap` 的名称。\n- `key0`、`key1`、`key2`、…… `keyM` 是 `hashmap`\
  \ 元素的键。\n- `value0`、`value1`、`value2`、…… `valueM` 是 `hashmap` 元素的值。\n\n使用这种方法，可以使用以下语句创建\
  \ `pupil` `hashmap`：\n\n```java\nHashMap<String, String> pupil = new HashMap<>(Map.of(\"\
  first_name\", \"Ann\", \"last_name\", \"Fox\", \"age\", \"8\", \"class\", \"2nd\"\
  ));\n```\n\n![](img/00002.jpeg)`Map.of()` 方法在 Java 9.0 中首次引入。它支持最多 10 个键值对。\n\n\
  #### 第二种方法\n\n在这种方法中，你可以使用下面通用形式的语句创建一个完全空的 `hashmap`：\n\n```java\nHashMap<key_type,\
  \ value_type> hashmap_name = new HashMap<>();\n```\n\n然后按照下面通用形式的 Java 语句添加一个元素（键值对）：\n\
  \n```java\nhashmap_name.put(key, value);\n```\n\n使用这种方法，可以使用以下代码段创建 `pupil` `hashmap`：\n\
  \n```java\nHashMap<String, String> pupil = new HashMap<>();\npupil.put(\"first_name\"\
  , \"Ann\");\npupil.put(\"last_name\", \"Fox\");\npupil.put(\"age\", \"8\");\npupil.put(\"\
  class\", \"2nd\");\n```\n\n### 31.10 如何从 HashMap 获取值\n\n要获取特定 `hashmap` 元素的值，必须使用其对应的键指向该元素。下面的代码段创建了一个\
  \ `hashmap`，然后在屏幕上显示“Ares is the God of War”（不带引号）。\n\n```java\nHashMap<String,\
  \ String> olympians = new HashMap<>();\nolympians.put(\"Zeus\", \"King of the Gods\"\
  );\nolympians.put(\"Hera\", \"Goddess of Marriage\");\nolympians.put(\"Ares\", \"\
  God of War\");\nolympians.put(\"Poseidon\", \"God of the Sea\");\nolympians.put(\"\
  Demeter\", \"Goddess of the Harvest\");\nolympians.put(\"Artemis\", \"Goddess of\
  \ the Hunt\");\nolympians.put(\"Apollo\", \"God of Music and Medicine\");\nolympians.put(\"\
  Aphrodite\", \"Goddess of Love and Beauty\");\nolympians.put(\"Hermes\", \"Messenger\
  \ of the Gods\");\nolympians.put(\"Athena\", \"Goddess of Wisdom\");\nolympians.put(\"\
  Hephaistos\", \"God of Fire and the Forge\");\nolympians.put(\"Dionysus\", \"God\
  \ of the Wine\");\nSystem.out.println(\"Ares is the \" + olympians.get(\"Ares\"\
  ));\n```\n\n![](img/00002.jpeg)只有键可以用于访问元素。这意味着 `olympians.get(\"Ares\")` 正确地返回“God\
  \ of War”，但 `olympians.get(\"God of War\")` 无法返回“Ares”。\n\n#### 练习 31.10-1 在 HashMaps\
  \ 中使用不存在的键\n\n以下 Java 程序哪里出错了？\n\n```java\nHashMap<String, String> family = new\
  \ HashMap<>(Map.of(\"Father\", \"John\", \"Mother\", \"Maria\", \"Son\", \"George\"\
  ));\nSystem.out.println(family.get(\"daughter\"));\n```\n\n#### 答案\n\n与数组类似，你永远不能引用不存在的\
  \ `hashmap` 元素。在这个练习中，有一个不存在的元素。images/00002.jpeg)在计算机科学中，“不存在”意味着 `null`。由于 `family`\
  \ 是一个 `map` 且没有 `daughter` 这个键，因此它会返回 `null`。对于 `hashmap` 来说，这是合法的。`null` 也是一个有效值。\n\
  \n### 31.11 修改 HashMap 中的值\n\n要修改现有 `hashmap` 元素的值，你需要使用其对应的键指向该元素。下面是通用形式的 Java\
  \ 语句，用于修改 `tribes` `hashmap` 的值：\n\n```java\nHashMap<Integer, String> tribes = new\
  \ HashMap<>(Map.of(0, \"Navajo\", 1, \"African\", 2, \"Sioux\"));\ntribes.put(1,\
  \ \"Apache\");\nSystem.out.println(tribes); // 输出：{0=Navajo, 1=African, 2=Sioux}\n\
  ```\n\n#### 练习 31.11-1 在 HashMap 中为不存在的键赋值\n\n以下 Java 程序中有什么问题？\n\n```java\nHashMap<String,\
  \ String> family = new HashMap<>(Map.of(\"Father\", \"John\", \"Mother\", \"Maria\"\
  , \"Son\", \"George\"));\nfamily.put(\"daughter\", \"Alice\");\n```\n\n#### 答案\n\
  \n这个程序完全没有问题。images/00002.jpeg)请记住，如果 `tribes` 实际上是一个数组，最后一条语句肯定会抛出异常。看下面的代码：\n\n\
  ```java\nString[] indian_tribes = {\"Navajo\", \"Cherokee\", \"Sioux\"};\nindian_tribes[3]\
  \ = \"Apache\";\n```\n\n在这个例子中，由于 `indian_tribes` 是一个数组且索引 3 不存在，最后一条语句尝试修改不存在的元素，显然会产生错误！\n\
  \n### 31.12 如何遍历 HashMap\n\n要遍历 `hashmap` 的元素可以使用 `for` 循环。下面是通用形式的代码片段：\n\n```java\n\
  for (key_type key : structure_name.keySet()) {\n    process structure_name.get(key);\n\
  }\n```\n\n其中 `process` 是任何 Java 语句或语句块，用于每次处理 `structure_name` `hashmap` 的一个元素。\n\
