  \ `kWh` 并返回总金额。\niii. 使用上述子程序，编写一个 Java 程序，提示用户输入用电量，然后显示总金额。在每次计算结束后，程序询问用户是否重复。让你的程序接受各种形式的“是”回答。\n\
  \n#### 解决方案\n\n这里没有任何。请注意数组是通过引用传递的。这就是为什么不需要包含 `return` 语句。Java 程序如下：\n\n```java\n\
