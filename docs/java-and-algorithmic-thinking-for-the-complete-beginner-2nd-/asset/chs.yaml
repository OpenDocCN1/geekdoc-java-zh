  \ 练习 30.4-7 孙顿法 (Heron's Root)\n\n编写一个 Java 程序，提示用户输入一个非负值，然后使用孙顿法计算其平方根。\n\n![](img/00001.gif)\n\
  \n其中 `y` 是你想求平方根的数，`x` 是平方根的第 n 次迭代。\n\n#### 解答\n\n你现在可能很困惑并在抓头。别被这些东西吓到！你可以通过下面的流程图理解孙顿法！\n\
  \n![](img/0290.gif) 还是困惑吗？来看个例子。求 25 的平方根：\n\n- 假设 8 为你的估计值。\n- 8 × 8 的乘积是 64。由于\
  \ 64 不够接近 25，你可以创建一个估计值！\n\n![](img/0291.gif)\n- 5.56 × 5.56 的乘积约为 30.91。由于 30.91\
  \ 不够接近 25，你可以创建一个估计值！\n\n![](img/0292.gif)\n- 5.02 × 5.02 的乘积是 25.2。现在你可以说 25.2\
  \ 足够接近 25。因此，你可以停止整个过程并说 25 的近似平方根是 5.02。\n\n现在让我们看看对应的 Java 程序。\n\n![](img/00001.gif)\
  \ `Class_30_4_7`\n```java\nstatic final double ACCURACY = 0.00000000001;\npublic\
  \ static void main(String[] args) {\n    double y, guess;\n    System.out.print(\"\
  Enter a non-negative number: \");\n    y = Double.parseDouble(cin.nextLine());\n\
  \    while (y < 0) {\n        System.out.println(\"Invalid value. Enter a non-negative\
  \ number: \");\n        y = Double.parseDouble(cin.nextLine());\n    }\n    guess\
  \ = 1 + (Math.random() * y); // 在 1 到 y 之间产生随机第一个估计值\n    while (Math.abs(guess\
  \ * guess - y) > ACCURACY) { // 足够接近吗？\n        guess = (guess + y / guess) / 2;\
  \ // 不是，创建一个新的“估计值”！\n    }\n    System.out.println(guess);\n}\n```\n\n![](img/00002.jpeg)\
  \ 注意检查“是否足够”的方式。当差值 |guess² − y| 的绝对值小于 0.000000000001（其中 y 是给定的值）时，执行流退出循环。\n\n\
  ### 练习 30.4-8 计算 π\n\n编写一个 Java 程序，使用下面的 Madhava–Leibniz 级数计算 π，精度为 0.00001。\n\n\
  ![](img/0293.gif)\n\nSolution\n\n\n\n\n\n马达瓦-莱布尼茨级数可以求解出 `π`，如下：\n\n![Image](img/00294.gif)\n\
  \n分数越多，精度就越高！因此，为了计算这个公式，程序需要进行多次迭代，以便尽可能使用分数。但当然，它不能无限迭代下去！当 `π` 的当前值与上一次迭代计算的值“足够接近”时，循环必须停止迭代，这意味着它们差值的绝对值已经变得非常小。常量\
  \ `ACCURACY` 定义了这个差必须有多小。这里展示了该 Java 程序。\n\n![](img/00001.gif) \n```java\nClass_30_4_8\n\
  static final double ACCURACY = 0.00001;\npublic static void main(String[] args)\
  \ {\n    double pi, pi_previous;\n    int sign, denom;\n    pi = 0;\n    sign =\
  \ 1;        // 这是第一个分数的符号\n    denom = 1;       // 这是第一个分数的分母\n    do {\n      \
  \  pi_previous = pi;               //保留上一次的 pi\n        pi += sign * 4 / (double)denom;\
  \ //通过增加一个分数计算新的 pi\n        sign = -sign;                   //为下一个分数准备符号\n    \
  \    denom += 2;                     //为下一个分数准备分母\n    } while (Math.abs(pi - pi_previous)\
  \ > ACCURACY);   //是否“足够接近”？\n    System.out.println(\"Pi ~= \" + pi);\n}\n```\n\
  \n![](img/00002.jpeg)注意变量 `sign` 在每次迭代中在值 `-1` 和 `+1` 之间切换的方式。\n\n如果你减小常量 `ACCURACY`\
  \ 的值，`π` 的计算将越来越精确。取决于你计算机的速度，你可以相当快速地计算出 `π` 的前五位。然而，计算 `π` 的后续每个数字所需的时间将呈指数级增长。在现代计算机上使用这种方法计算\
  \ 40 位 `π` 可能需要多年时间！\n\n### 练习 30.4-9 用分数近似实数\n\n编写一个 Java 程序，提示用户输入一个 0 到 100 之间的实数，然后尝试找到一个更接近它的分数\
  \ ![Image](img/00295.gif)，其中 `N` 是 0 到 100 之间的整数，`M` 是 1 到 100 之间的整数。使用循环控制结构，程序还必须验证数据输入，允许用户只输入\
  \ 0 到 100 之间的值。不需要显示任何错误信息。\n\n#### 答案\n\n解决方案非常简单。你只需要遍历变量 `n` 和 `m` 的所有可能组合，并检查哪一种组合更好地近似给定的实数。\n\
  \n要遍历变量 `n` 和 `m` 的所有可能组合，你可以使用嵌套循环控制结构，即两个嵌套在另一个内部的 `for` 循环，如下：\n\n```java\nfor\
  \ (n = 0; n <= 100; n++) {\n    for (m = 1; m <= 100; m++) {\n        // ...\n \
  \   }\n}\n```\n\n![](img/00002.jpeg)总迭代次数为 `101 × 100 = 10100`。这是一个相当大的数字，但对于现代计算机来说，这是小一碟！\n\
  \n![](img/00002.jpeg)变量 `m` 代表分数的分母，分母不能为零。这就是为什么它从 1 开始而不是从 0 开始。\n\n以下标准\n\n![Image](img/00296.gif)\n\
  \n可以评估近似值有多“好”。\n\n困惑吗？让我们尝试用分数近似值 0.333，遍历 `N` 和 `M` 的所有可能组合。\n\n- 当 `N = 1`, `M\
  \ = 1` 时，标准等于 ![Image](img/00297.gif)\n- 当 `N = 1`, `M = 2` 时，标准等于 ![Image](img/00298.gif)\n\
  - 当 `N = 1`, `M = 3` 时，标准等于 ![Image](img/00299.gif)\n- 当 `N = 1`, `M = 4` 时，标准等于\
  \ ![Image](img/00300.gif)\n- 对于 ……\n- 当 `N = 100`, `M = 99` 时，标准等于 ![Image](img/00301.gif)\n\
  - 当 `N = 100`, `M = 100` 时，标准等于 ![Image](img/00302.gif)\n\n显而易见，0.0003 是所有可能结果中的最小值。因此，组合\
  \ `N = 1` 和 `M = 3`（对应于分数 1/3）被认为是值 0.333 的最佳近似值。\n\n现在是 Java 程序：\n\n![](img/00001.gif)\
  \ \n```java\nClass_30_4_9\npublic static void main(String[] args) {\n    double\
  \ x, y, minimum;\n    int best_n, best_m, n, m;\n    do {\n        System.out.print(\"\
  输入 0 到 100 之间的实数：\");\n        x = Double.parseDouble(System.nextLine());\n    }\
  \ while (x < 0 || x > 100);\n    best_n = 1;\n    best_m = 1;\n    minimum = 1.0;\n\
  \    for (n = 0; n <= 100; n++) {\n        for (m = 1; m <= 100; m++) {\n      \
  \      y = Math.abs(x - (double)n / m);\n            if (y < minimum) {\n      \
  \          minimum = y;\n                best_n = n;\n                best_m = m;\n\
  \            }\n        }\n    }\n    System.out.println(\"最佳分数是：\" + best_n + \"\
  /\" + best_m);\n}\n```\n\n\n\n\n\n一旦执行流进入循环，用户输入第一个值，决策控制结构将验证为 `true`。变量 `maximum`\
  \ 中的值 `-1` 将被第一个给定的值覆盖，之后执行流将正常继续进行。\n\n![](img/00002.jpeg)\n请注意，这种方法并不适用于所有情况。如果某个练习需要提示用户输入任何数字（而不只是正数），则这种方法无法适用，因为用户可能只输入负值。如果发生这种情况，初始值\
  \ `-1` 将永远不会被任何给定的值覆盖。只有在你知道给定值的下限时，你才能使用这种方法寻找最大值；或者只有在你知道给定值的上限时，才能使用这种方法寻找最小值。例如，如果练习要求寻找最轻的人，你可以为变量\
