  \ `kwh`数组元素排序时，必须保持与`months`数组元素的关系。这意味着每当 `kwh`数组的两个元素交换内容时，`months`数组对应的元素也必须交换内容。Java\
  \ 程序如下：\n\n![Image](img/00001.gif)\n\n```java\nclass Class_34_4_9 {\n    public\
