  \n#### 练习 34.4-8 选择排序算法 – 排序一维数组\n\n编写一个代码片段，使用选择排序算法对数组元素进行升序排序。假设数组包含数值。\n\n####\
  \ 解决方案\n\n选择排序算法对于大规模数据来说效率低下，正如泡泡排序算法也是如此，但它的性能通常比泡泡排序要好。它是所有排序算法中最简单的，并且在主内存（RAM）有限的计算机系统中表现良好。\n\
  \n\n\n\n该算法找到数组中最小（或最大，取决于排序顺序）的元素，并将其与位置 `0` 处的内容交换。然后对数组的剩余部分重复此过程；找到下一个最小（或最大）元素并将其放入下一个位置，直到所有元素都经过检查。\n\
  \n例如，让我们尝试按升序对以下数组进行排序。\n\n![Image](img/00376.gif)\n\n最小值是位置 `4` 处的值 `4`。根据选择排序算法，该元素的内容与位置\
  \ `0` 处的内容交换。数组 `A` 变为：\n\n![Image](img/00377.gif)\n\n数组剩余部分中的最小值是位置 `5` 处的值 `9`。该元素的内容与位置\
  \ `1` 处的内容交换。数组 `A` 变为：\n\n![Image](img/00378.gif)\n\n数组剩余部分中的最小值是位置 `4` 处的值 `18`。该元素的内容与位置\
  \ `2` 处的内容交换。数组 `A` 变为：\n\n![Image](img/00379.gif)\n\n按照相同的方法，下一个较值是位置 `5` 处的值 `19`。数组\
  \ `A` 变为：\n\n![Image](img/0380.gif)\n\n最后，下一个较值是位置 `5` 处的值 `36`。数组 `A` 最终按升序排序完成！\n\
  \n![Image](img/0381.gif)\n\n现在，让我们编写对应的 Java 程序。“从内到外”的方法有助于帮助更好地理解整个过程。该代码片段找到最小元素，然后将其与位置\
  \ `0` 处的内容交换。请注意这是一个嵌套循环结构。假设变量 `m` 包含值 `0`。\n\n```java\nminimum = a[m];\nindex_of_min\
  \ = m;\nfor (n = m; n <= ELEMENTS - 1; n++) {\n    if (a[n] < minimum) {\n     \
  \   minimum = a[n];\n        index_of_min = n;\n    }\n}\n// 找到最小值！现在交换值。\ntemp\
  \ = a[m];\na[m] = a[index_of_min];\na[index_of_min] = temp;\n```\n\n现在，为了对数组的所有元素重复此过程，你可以将此代码片段放在遍历所有元素的\
  \ for 循环中。升序排序数组的最终选择算法如下：\n\n```java\nfor (m = 0; m <= ELEMENTS - 1; m++) {\n \
  \   minimum = a[m];\n    index_of_min = m;\n    for (n = m; n <= ELEMENTS - 1; n++)\
  \ {\n        if (a[n] < minimum) {\n            minimum = a[n];\n            index_of_min\
  \ = n;\n        }\n    }\n    temp = a[m];\n    a[m] = a[index_of_min];\n    a[index_of_min]\
  \ = temp;\n}\n```\n\n![Image](img/00002.jpeg) 如果你想降序排序数组，只需要寻找最大值而不是最小值。\n\n![Image](img/00003.jpeg)\
  \ 像冒泡算法一样，在 Java 中对字母数据进行排序，只需将表达式 `a[n] < minimum` 替换为 `a[n].compareTo(minimum)\
  \ < 0`。\n\n### 34.4-9 在保持第二个数组关系的同时对一维数组\n\n编写一个 Java 程序，提示用户输入一年中每月月底的电表读数。然后显示每个读数（降序）以及对应的月份。使用选择排序算法。\n\
