  \n## 14 操作字符串\n\n### 14.1 引言\n\n通常来说，字符串是任何通过键盘输入的字母、符号（如 `*`）或数字。字符串无处不在——从文字处理器到浏览器。许多练习都大量使用字符串。然而，本章只涵盖了必要的字符串。如果你需要更多信息，可以访问：\n\
  \n[`docs.oracle.com/en/javase/13/api/lang/String.html#summary`](https://docs.oracle.com/en/javase/13/api/lang/String.html#summary)\n\
  \n字符串方法（子程序）可以在需要时使用，例如从字符串中提取字符、移除可能存在的空格，或将其所有字符转换为大写。\n\n方法仅仅是解决小问题的微程序。\n\n\
  ### 14.2 字符在字符串中的位置\n\n让我们在下面的示例中使用“Hello World”。该字符串包含 11 个字符（包括两个单词之间的空格）。每个字符的位置所示：\n\
  \n![Image](img/014.gif)\n\nJava 对字符的编号假设第一个位于位置 0，第二个位于位置 1，以此此类推。空格也是一个字符。即使你看不到它，也不意味着它不存在！\n\
  \n### 14.3 有用的字符串方法（子程序）及更多\n\n修剪 (Trimming)\n\n修剪是从字符串开头或结尾移除空白字符的过程。在修剪过程中移除的空白字符包括：\n\
  \n►普通空格\n►制表符\n►换行符（line feed）\n►回车符（carriage return）\n\n例如，你可以修剪用户在字符串开头或结尾误输入的空格。修剪字符串的方法是：\n\
  \n`subject.trim()`\n\n该方法返回 `subject` 的副本，并移除 `subject` 字符串开头和结尾的所有空白字符。\n\n示例\n\
  \n![](img/00001.gif) `Class_14_3a`\n```java\npublic static void main(String[] args)\
  \ {\n    String a, b;\n    a = \" Hello\";\n    b = a.trim();\n    System.out.println(b\
  \ + \" Poseidon!\"); // 输出: Hello Poseidon!\n    System.out.println(a + \" Poseidon!\"\
  ); // 输出:  Hello  Poseidon!\n}\n```\n\n![](img/00002.jpeg)注意变量 `a` 的内容没有改变。如果你确实需要更改其内容，可以使用语句\
  \ `a = a.trim();`。\n\n字符串替换\n\n\n\n\n\n#### `subject.replace(search, replace)`\n\
  \n该方法在 `subject` 中搜索，并返回它的副本，其中 `search` 字符串的所有出现处都被替换为 `replace` 字符串。\n\n#### 示例\n\
  \n![](img/00001.gif) Class_14_3b\n```java\npublic static void main(String[] args)\
  \ {\n    String a, b;\n    a = \"I am newbie in C++. C++ rocks!\";\n    b = a.replace(\"\
  C++\", \"Java\");\n    System.out.println(b);    //显示: I am newbie in Java. Java\
  \ rocks\n    System.out.println(a);    //显示: I am newbie in C++. C++ rocks\n}\n\
  ```\n\n![](img/00002.jpeg)\n注意变量 `a` 的内容没有被改变。如果你确实需要修改它的内容，可以使用语句 `a = a.replace(\"\
  C++\", \"Java\");`。\n\n#### 统计字符数量\n\n#### `subject.length()`\n\n该方法返回 `subject`\
  \ 的长度，换句话说，就是 `subject` 包含的字符数（包括空格、符号、数字等）。\n\n#### 示例\n\n![](img/00001.gif) Class_14_3c\n\
  ```java\npublic static void main(String[] args) {\n    String a;\n    int k;\n \
  \   a = \"Hello Olympians!\";\n    System.out.println(a.length());             \
  \         //显示: 16\n    k = a.length();\n    System.out.println(k);            \
  \                    //显示: 16\n    System.out.println(\"I am newbie in Java\".length());\
  \  //显示: 19 \n}\n```\n\n#### 查找字符串位置\n\n#### `subject.indexOf(search)`\n\n该方法找到\
  \ `search` 在 `subject` 中第一次出现的数字位置位置。\n\n#### 示例\n\n![](img/00001.gif) Class_14_3d\n\
  ```java\npublic static void main(String[] args) {\n    int i;\n    String a;\n \
  \   a = \"I am newbie in Java. Java rocks!\";\n    i = a.indexOf(\"newbie\");\n\
  \    System.out.println(i);                   //显示: 5\n    System.out.println(a.indexOf\
  \ (\"Java\"));  //显示: 15\n    System.out.println(a.indexOf (\"C++\"));   //显示: -1\n\
  }\n```\n\n![](img/00003.jpeg) 第一个字符位于位置 0。\n\n#### 转换为小写\n\n#### `subject.toLowerCase()`\n\
  \n该方法返回 `subject` 的副本，其中字符串 `subject` 的所有字母都被转换为小写。\n\n#### 示例\n\n![](img/00001.gif)\
  \ Class_14_3e\n```java\npublic static void main(String[] args) {\n    String a,\
  \ b;\n    a = \"My NaMe is JohN\";\n    b = a.toLowerCase();\n    System.out.println(b);\
  \    //显示: my name is john\n    System.out.println(a);    //显示: My NaMe is JohN\n\
  }\n```\n\n![](img/00002.jpeg) 注意变量 `a` 的内容没有被改变。如果你确实需要修改它的内容，可以使用语句 `a = a.toLowerCase();`。\n\
  \n#### 转换为大写\n\n#### `subject.toUpperCase()`\n\n该方法返回 `subject` 的副本，其中字符串 `subject`\
  \ 的所有字母都被转换为大写。\n\n#### 示例\n\n![](img/00001.gif) Class_14_3f\n```java\npublic static\
  \ void main(String[] args) {\n    String a, b;\n    a = \"My NaMe is JohN\";\n \
  \   b = a.toUpperCase();\n    System.out.println(b);    //显示: MY NAME IS JOHN\n\
  \    System.out.println(a);    //显示: My NaMe is JohN\n}\n```\n\n![](img/00002.jpeg)\
  \ 注意变量 `a` 的内容没有改变。如果你需要修改它的内容，可以使用语句 `a = a.toUpperCase();`。\n\n### 从字符串中获取单个字符\n\
  \n#### `subject.charAt(index)`\n\n该方法返回 `subject` 中指定 `index` 处的字符。如前所述，索引从零开始。你可以使用\
  \ `index 0` 访问第一个字符，`index 1` 访问第二个字符，以此此类推。最后一个字符的索引是字符串长度减 1。\n\n#### 示例\n\n![](img/00001.gif)\
  \ Class_14_3g\n```java\npublic static void main(String[] args) {\n    String a;\n\
  \    a = \"Hello World\";\n    System.out.println(a.charAt(0));     //显示: H (第一个字符)\n\
  \    System.out.println(a.charAt(6));     //显示: W\n    System.out.println(a.charAt(10));\
  \    //显示: d (最后一个字符)\n}\n```\n\n![](img/00002.jpeg) 注意，“Hello”和“World”之间的空格也被视为字符。因此，字母\
  \ `W` 位于位置 6 而不是 5。如果尝试使用无效索引（如负数或大于字符串长度的索引），Java 会报错错误。\n\n#### 获取字符串的一部分\n\n\
  #### `subject.substring(beginIndex [, endIndex]`\n\n该方法返回 `subject` 的一部分。具体而言，它返回从\
  \ `beginIndex` 开始但不包含 `endIndex` 的子串。`endIndex` 参数是可选的。如果省略，则返回从 `beginIndex` 直\
  \ `subject` 结束的子串。\n\n#### 示例\n\n![](img/00001.gif) Class_14_3h\n```java\npublic\
  \ static void main(String[] args) {\n    String a;\n    a = \"HelloWorld\";\n  \
  \  System.out.println(a.substring(6, 9)); //显示: Wor\n    System.out.println(a.substring(7));\
  \    //显示: or\n}\n```\n\n#### 比较字符串\n\n#### `subject.compareTo(string)`\n\n当 `subject`\
  \ 与 `string` 字典序相等时，该方法返回 0；如果 `subject` 字典序小于 `string`，返回小于 0 的值；如果 `subject` 字典序大于\
  \ `string`，返回大于 0 的值。“字典序”意味着字母“A”小于“B”，“B”小于“C”，以此此类推。\n\n#### 示例\n\n![](img/00001.gif)\
  \ Class_14_3i\n```java\npublic static void main(String[] args) {\n    String a =\
  \ \"backspace\";\n    String b = \"backwards\";\n    String c = \"Backspace\";\n\
  \    String d = \"winter\";\n    String e = \"winter\";\n    System.out.println(a.compareTo(b));\
  \ //显示: -4\n    System.out.println(a.compareTo(c)); //显示: 3\n    System.out.println(a.compareTo(d));\
  \ //显示: -21\n    System.out.println(d.compareTo(e)); //显示: 0\n    System.out.println(a.equals(d));\
  \    //显示: false \n    System.out.println(a.equals(c));    //显示: false\n    System.out.println(d.equals(e));\
  \    //显示: true\n}\n```\n\n#### 将数字或字符转换为字符串\n\n#### `String.valueOf(subject)`\n\
  \n该方法返回 `subject` 的字符串版本，换句话说，它将数字（实数或整数）或字符转换为字符串。\n\n#### 示例\n\n![](img/00001.gif)\
  \ Class_14_3j\n```java\npublic static void main(String[] args) {\n    String a;\n\
  \    char b;\n    int c, d;\n    b = 'W';\n    a = String.valueOf(b);\n    System.out.println(a);\
  \ //显示: W\n    c = 12;\n    d = 34;\n    System.out.println(c + d); //显示: 46\n \
  \   System.out.println(String.valueOf(c) + String.valueOf(d)); //显示: 1234\n}\n```\n\
  \n但在 Java 中，如果只是在序列开头一个字符串（即使是空字符串），也可以获得相同的结果，如下所示。\n\n![](img/00001.gif) Class_14_3k\n\
  ```java\npublic static void main(String[] args) {\n    String a;\n    char b;\n\
  \    int c, d;\n    b = 'W';\n    a = \"\" + b;\n    System.out.println(a); //显示:\
  \ W\n    c = 12;\n    d = 34;\n    System.out.println(c + d); //显示: 46\n    System.out.println(\"\
  \" + c + d); //显示: 1234\n}\n```\n\n#### 练习题 14.3-1 反向显示字符串\n\n编写一个 Java 程序，提示用户输入任何四个字母的字符串，然后反向显示其内容。例如，如果输入的字符串是“Zeus”，程序必须显示“sueZ”。\n\
  \n解答\n\n假设用户的输入赋值给变量 `s`。你可以使用 `s.charAt(3)` 访问第四个字母，使用 `s.charAt(2)` 访问第三个字母，以此此类推。\n\
  \n\n\n\nJava 程序如所示。连接操作符 `( + )` 用于重新组合最终的反转字符串。\n\n![](img/00001.gif)\n```java\n\
  Class_14_3_1public static void main(String[] args) {\n    String s, s_reversed;\n\
  \    System.out.print(\"Enter a word with four letters: \");\n    s = cin.nextLine();\n\
  \    s_reversed = \"\" + s.charAt(3) + s.charAt(2) + s.charAt(1) + s.charAt(0);\n\
  \    System.out.println(s_reversed);\n}\n```\n\n![](img/00002.jpeg)在 Java 中，有时有必要通过以字符串（即使是空字符串）开始序列，来强制编译器执行连接而不是普通的加法。\n\
  \n### 练习 14.3-2 交换名字的顺序\n\n编写一个 Java 程序，提示用户在一个单一字符串中输入姓和名。最后，程序必须改变这两个名字的顺序。\n\n\
  #### 解决方案\n\n这个练习与你在练习 8.1-2 和 8.1-3 中学习到的不同，后者是交换两个变量的数值。在本次练习中，姓和名都输入在一个单一字符串中，因此程序必须做的第一件事是拆分字符串并将每个名字分配给不同的变量。如果你能做到这一点，就可以以不同的顺序重新连接它们。\n\
  \n让我们用一个例子来理解这个练习。你必须拆分的字符串以及其每个字符的位置在此所示。\n\n![Image](img/00148.gif)\n\n在视觉上分隔名和姓的字符是它们之间的空格字符。问题在于，这个字符并不总是位于位置\
  \ `3`。某人的名字可能很短，比如“Tom”，而另人的名字可能较长，比如“Robert”。因此，你需要一种无论字符串内容如何，都能找到空格字符位置的方法。\n\
  \n`indexOf()` 方法就是你正在寻找的！如果你用它来查找字符串“Tom Smith”中空格字符的位置，它返回值 `3`。但如果你用它来查找另一个字符串（例如“Angelina\
  \ Brown”）中的空格字符，它返回的是值 `8`。\n\n![](img/00002.jpeg)值 `3` 不仅仅是空格字符存在的位置。它还代表了单词“Tom”包含的字符数！同样适用于为字符串“Angelina\
  \ Brown”返回的值 `8`。它既代表了空格字符存在的位置，也代表了单词“Angelina”包含的字符数！\n\n该算法的 Java 程序如所示。\n\n\
  ![](img/00001.gif)\n```java\nClass_14_3_2public static void main(String[] args)\
  \ {\n    String full_name, name1, name2;\n    int space_pos;\n    System.out.print(\"\
  Enter your full name: \");\n    full_name = cin.nextLine();\n    // 找到空格字符的位置。这也是名字\n\
  \    // 包含的字符数\n    space_pos = full_name.indexOf(\"  \");\n    // 从位置 0 开始获取 space_pos\
  \ 个字符\n    name1 = full_name.substring(0, space_pos);\n    // 从位置 space_pos + 1\
  \ 开始获取剩余字符\n    name2 = full_name.substring(space_pos + 1);\n    full_name = name2\
  \ + \"  \" + name1;\n    System.out.println(full_name);\n}\n```\n\n![](img/00002.jpeg)注意，`substring(beginIndex\
  \ [, endIndex])` 方法返回从 `beginIndex` 位置开始并在但不包含 `endIndex` 位置结束的子字符串。\n\n![](img/00002.jpeg)注意，此程序不能适用于西班牙语名字，例如“Maria\
  \ Teresa García Ramírez de Arroyo”。原因显而易见！\n\n## 练习 14.3-3 创建登录 ID\n\n编写一个 Java\
  \ 程序，提示用户输入其姓氏，然后根据名字的前四个字母（小写）和一个三位随机整数创建一个登录 ID。\n\n#### 解决方案\n\n要创建一个随机整数，你可以使用\
  \ `Math.random()` 方法。由于你需要一个三位的随机整数，范围必须在 100 到 999 之间。\n\n该算法的 Java 程序如所示。\n\n\
  ![](img/00001.gif)\n```java\nClass_14_3_3public static void main(String[] args)\
  \ {\n    int random_int;\n    String last_name, login_ID;\n    System.out.print(\"\
  Enter last name: \");\n    last_name = cin.nextLine();\n    // 获取 100 到 999 之间的随机整数\n\
  \    random_int  = 100 + (int)(Math.random() * 900);\n    login_ID = last_name.substring(0,\
  \ 4).toLowerCase() + random_int;\n    System.out.println(login_ID);\n}\n```\n\n\
  ![](img/00002.jpeg)注意，`substring()` 方法返回从位置 0 开始并在但不包含位置 4 的子字符串。\n\n注意 `substring()`\
  \ 方法是如何链接到 `toLowerCase()` 方法的。第一个方法的的结果用作第二个方法的参数。这是大多数程序员喜欢的编写风格，因为可以节省大量代码。当然，你可以链用任意数量的方法，但如果你链得太多，将将无法理解你的代码。\n\
  \n## 练习 14.3-4 创建随机单词\n\n编写一个 Java 程序，显示一个五个字母的随机单词。\n\n#### 解决方案\n\n要创建一个随机单词，你需要一个包含所有\
  \ 26 个字母的字符串。然后你可以使用 `Math.random()` 方法在 0 到 25 之间选择一个字母。\n\n该算法的 Java 程序如所示。\n\n\
  ![](img/00001.gif)\n```java\nClass_14_3_4public static void main(String[] args)\
  \ {\n    String alphabet, random_word;\n    alphabet = \"abcdefghijklmnopqrst\"\
  ;\n    random_word = \"\" + alphabet.charAt((int)(Math.random() * 26)) +\n> > >\
  \ alphabet.charAt((int)(Math.random() * 26)) +\n> > > alphabet.charAt((int)(Math.random()\
  \ * 26)) +\n> > > alphabet.charAt((int)(Math.random() * 26)) +\n> > > alphabet.charAt((int)(Math.random()\
  \ * 26));\n    System.out.println(random_word);\n}\n```\n\n![](img/00003.jpeg)注意\
  \ `random()` 方法是如何嵌套在 `charAt()` 方法内部的。内部方法的的结果作为外部方法的参数。这是大多数程序员喜欢的编写风格，因为可以节省大量代码。当然，如果你嵌套了太多方法，将无法理解。嵌套四层是可以接受的。\n\
  \n![](img/00002.jpeg)注意 `Math.random()` 方法被调用了五次，每次可能返回不同的随机数。\n\n![](img/00003.jpeg)在\
  \ Java 中，有时有必要通过以字符串（即使是空字符串）开始序列，来强制编译器执行连接而不是普通的加法。\n\n你还可以使用 `length()` 方法获取字符串\
  \ `alphabet` 的长度，如下所示。\n\n![](img/00001.gif)\n```java\nClass_14_3_4public static\
  \ void main(String[] args) {\n    String alphabet, random_word;\n    alphabet =\
  \ \"abcdefghijklmnopqrstuvwxyz\";\n    random_word = \"\" + alphabet.charAt((int)(Math.random()\
  \ * alphabet.length())) +\n> > > alphabet.charAt((int)(Math.random() * alphabet.length()))\
  \ +\n> > > alphabet.charAt((int)(Math.random() * alphabet.length())) +\n> > > alphabet.charAt((int)(Math.random()\
  \ * alphabet.length())) +\n> > > alphabet.charAt((int)(Math.random() * alphabet.length()));\n\
  \    System.out.println(random_word);\n}\n```\n\n### 练习 14.3-5 求数字之和\n\n编写一个 Java\
  \ 程序，提示用户输入一个三位整数，然后计算其数字之和。在不使用算术运算符的情况下解决这个练习。\n\n#### 解决方案\n\n现在你可能疑惑为什么这个练习被放在这一章中，这里的整个讨论都是关于如何操作字符串。你可能还会说你已经知道如何将一个三位整数拆分为三个数字并将每个数字分配给单独的变量，就像你在第\
  \ 13 章 中通过除法 ( / ) 和整数取模 ( % ) 运算符学习的那样。所以，为什么这个练习又在这里了？\n\n\n\n\n原因是 Java 是一门非常强大的语言，你可以利用它的魔法力量以完全不同的方式来解决这个练习。主要思想是将给定的整数转换为字符串类型，并将每个数字（每个字符）赋值给单独的变量。\n\
  \n![](img/00001.gif)\n\n```java\nClass_14_3_5\npublic static void main(String[]\
  \ args) {\n    int number, total;\n    String s_number, digit1, digit2, digit3;\n\
  \    System.out.print(\"Enter an three-digit integer: \");\n    number = Integer.parseInt(cin.nextLine());\n\
  \    s_number = \"\" + number;  //将数字转换为字符串\n    digit1 = \"\" + s_number.charAt(0);\
  \  //将位置 0 的字符转换为字符串\n    digit2 = \"\" + s_number.charAt(1);  //将位置 1 的字符转换为字符串\n\
  \    digit3 = \"\" + s_number.charAt(2);  //将位置 2 的字符转换为字符串\n    total = Integer.parseInt(digit1)\
  \ + Integer.parseInt(digit2) + Integer.parseInt(digit3);\n    System.out.println(total);\n\
  }\n```\n\n### 14.4 复习题：判断题\n\n对以下每个陈述选择对或错。\n\n1. 字符串是任何你可以使用键盘输入的内容。\n2. 字符串必须被括在括号中。\n\
