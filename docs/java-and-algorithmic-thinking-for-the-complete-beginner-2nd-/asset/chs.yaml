  \ | 9.0 | 6.0 | 8.0 |\n| 4 | `minimum(a, b, c)` | | | |\n\n调用 void 方法 `minimum()`\
  \ 时，主代码语句的执行中断，变量 `a`、`b` 和 `c` 被复制（赋值）到相应的参数 `val1`、`val2` 和 `val3`，执行流跳转到编写 void\
  \ 方法的地方。然后执行 void 方法语句。\n\n| Step | Statements of void Method `minimum()` | val1\
  \ | val2 | val3 | minim |\n| --- | --- | --- | --- | --- | --- |\n| 5 | `minim =\
  \ val1` | 9.0 | 6.0 | 8.0 | 9.0 |\n| 6 | `if (val2 < minim)` | | | | true |\n| 7\
  \ | `minim = val2` | 9.0 | 6.0 | 8.0 | 6.0 |\n| 8 | `if (val3 < minim)` | | | |\
