  \ + \"\\t\");\n    }\n}\n```\n\n### 34.2 使用数组进行数据验证\n\n正如你在第 30.3 节中所学过的，有三种方法可以用来验证数据输入。你的方法取决于你是否希望显示错误消息，以及你希望为每个错误显示单独的错误消息，还是对任何类型的错误只显示一条错误消息。让我们看看这三种方法如何适配并应用于数组。\n\
