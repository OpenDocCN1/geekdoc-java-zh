  \n在 OOP 中，这辆车可以是一个具有特定属性（通常称为字段）并执行特定动作（称为方法）的对象。\n\n显然，你现在可能在问自己：“我最初该如何创建对象呢？”答案很简单！你只需要一个类。类就像一个“橡皮印章”！在图\
  \ 39-1 中，有一个印章（这就是类），它有四个空字段。\n\n![Image](img/00440.jpeg)\n\n图 39-1 类像一个“橡皮印章”\n\
  \n使用这个印章的人可以盖出很多辆汽车（这些就是对象）。例如，在图 39-2 中，一个小男孩盖出了那两辆汽车，然后给它们涂上颜色，并用特定的属性填充了每辆汽车的字段。\n\
  \n![Image](img/00441.jpeg)\n\n图 39-2 你可以使用同一个橡皮印章作为模板来盖出很多辆汽车\n\n![](img/00002.jpeg)创建新对象（类的新实例）的过程被称为“实例化”。\n\
  \n![](img/00002.jpeg)类是一个模板，每个对象都是从类中创建的。每个类都应该设计为执行一项且仅执行一项任务！这就是为什么在大多数情况下，使用一个以上的类来构建整个应用程序！\n\
  \n![](img/00002.jpeg)在 OOP 中，橡皮印章就是类。你可以使用同一个类作为模板来创建（实例化）许多对象！\n\n## 39.2 Java\
  \ 中的类和对象\n\n现在你已经了解了一些关于类和对象的理论知识，让我们来看看如何在 Java 中编写一个真实的类吧！下面的代码段创建了 `Car` 类。该类中有四个字段和三个方法。\n\
  \n```java\nclass Car {\n    // 定义四个字段（属性）\n    public String brand = \"\";\n   \
  \ public String model = \"\";\n    public String color = \"\";\n    public String\
  \ license_plate = \"\";\n\n    // 定义方法 turn_on()\n    public void turn_on() {\n\
  \        System.out.println(\"The car turns on\");\n    }\n\n    // 定义方法 turn_off()\n\
  \    public void turn_off() {\n        System.out.println(\"The car turns off\"\
  );\n    }\n\n    // 定义方法 accelerate()\n    public void accelerate() {\n        System.out.println(\"\
  The car accelerates\");\n    }\n}\n```\n\n是的，这是真的。类中的字段只是普通的变量！\n\n![](img/00002.jpeg)`Car`\
  \ 类只是一个模板。目前还没有创建对象！\n\n![](img/00002.jpeg)对象无非是类的实例，这就是为什么很多时候它可能被称为“类实例”或“类对象”。\n\
  \n![](img/00002.jpeg)字段或方法前面的 `public` 关键字指定了可以使用类的实例从类外部访问该字段或方法。\n\n创建两个对象（或者换句话创建\
  \ `Car` 类的两个实例），你需要以下两行代码。\n\n```java\nCar car1 = new Car();\nCar car2 = new Car();\n\
  ```\n\n![](img/00003.jpeg)当你创建一个新对象（类的新实例）时，这个过程被称为“实例化”。\n\n现在你已经创建（实例化）了两个对象，你可以给它们的字段赋值。要这样做，你必须使用点符号（dot\
  \ notation），这意味着你必须写对象的名称，后面跟着点，然后是你想访问的字段或方法的名称。下一个代码段创建了两个对象 `car1` 和 `car2`，并给它们的字段赋值。\n\
  \n```java\npublic static void main(String[] args) {\n    Car car1 = new Car();\n\
  \    Car car2 = new Car();\n    car1.brand = \"Mazda\";\n    car1.model = \"6\"\
  ;\n    car1.color = \"Gray\";\n    car1.license_plate = \"AB1234\";\n    car2.brand\
  \ = \"Ford\";\n    car2.model = \"Focus\";\n    car2.color = \"Blue\";\n    car2.license_plate\
  \ = \"XY9876\";\n    System.out.println(car1.brand);  //显示为: Mazda\n    System.out.println(car2.brand);\
  \  //显示为: Ford\n}\n```\n\n![](img/00002.jpeg)在前面的示例中，`car1` 和 `car2` 是同一个类的两个实例。使用点符号配合\
  \ `car1` 和 `car2` 允许你一次引用一个实例。如果你对其中一个实例进行任何更改，都不会影响任何其他实例！\n\n下一个代码段分别调用了对象 `car1`\
  \ 和 `car2` 的 `turn_off()` 和 `accelerate()` 方法。\n\n```java\ncar1.turn_off();\ncar2.accelerate();\n\
  ```\n\n![](img/00003.jpeg)类是一个可以执行的模板，而对象是可执行的实例![](img/00002.jpeg)一个类可以作为模板来实例化许多对象！\n\
  \n## 39.3 构造函数和 this 关键字\n\n在 Java 中，有一个特殊的方法被称为构造函数。每当创建一个类的实例时，就会调用这个方法。来看下面的例子。\n\
  \n```java\nclass Person {\n    public Person() {\n        System.out.println(\"\
  An object was created\");\n    }\n}\n\nclass Main {\n    public static void main(String[]\
  \ args) {\n        Person p1 = new Person();\n        Person p2 = new Person();\n\
  \    }\n}\n```\n\n![](img/00002.jpeg)注意，构造方法名前没有 `void`。现在让我们谈谈 `this` 关键字。`this`\
  \ 就是对象本身的引用！来看下面的例子。\n\n```java\nclass Person {\n    public String name;\n    public\
  \ int age;\n\n    public Person() {\n        System.out.println(\"An object was\
  \ created\");\n    }\n\n    public void say_info() {\n        System.out.println(\"\
  I am \" + this.name);\n        System.out.println(\"I am \" + this.age + \" years\
  \ old\");\n    }\n}\n\nclass Main {\n    public static void main(String[] args)\
  \ {\n        Person person1 = new Person();\n        person1.name = \"John\";\n\
  \        person1.age = 14;\n        person1.say_info();\n    }\n}\n```\n\n![](img/00002.jpeg)注意，在方法之外（但在类内部）声明字段\
  \ `name` 和 `age` 时，你只需要写字段名不需要点符号。然而，在方法内部访问字段时，必须使用点符号（例如 `this.name` 和 `this.age`）。\n\
  \n你现在可能在脑海中旋转的问题是：“为什么必须在 `say_info()` 方法内部将这些字段 `name` 和 `age` 分别引用为 `this.name`\
  \ 和 `this.age`？真的需要在它们前面加上 `this` 关键字吗？”简单的答案是，方法内部总有可能存在同名的局部变量（`name` 和 `age`）。因此，你需要一种方法来区分这些局部变量和对象的字段。如果你感到困惑，尝试理解下面的例子。在\
  \ `MyClass` 类中有一个字段 `b`，在类的 `myMethod()` 方法中有一个局部变量 `b`。\n\n```java\nclass MyClass\
  \ {\n    public String b;\n\n    public void myMethod() {\n        String b = \"\
  \ *** \";\n        System.out.println(b + this.b + b);\n    }\n}\n\nclass Main {\n\
  \    public static void main(String[] args) {\n        MyClass x = new MyClass();\n\
  \        x.b = \"Hello!\";\n        x.myMethod();\n    }\n}\n```\n\n`this` 关键字可以用于在类的方法内部引用该类的任何成员（字段或方法）。\n\
  \n\n\n\n### 39.4 向构造方法传递初始值\n\n任何方法（包括构造方法）都可以在其形式参数列表中包含形式参数。例如，你可以使用这些参数在创建对象时向对象的构造方法传递一些初始值。下面的示例创建了四个对象，每个对象代表希腊神话中的一个泰坦。\n\
  \n![](img/00001.gif) Project_39_4\n\n```java\nclass Titan {\n    public String name;\n\
  \    public String gender;\n    //Define the constructor\n    public Titan(String\
  \ n, String g) {\n        this.name = n;\n        this.gender = g;\n    }\n}\n\n\
  public class Class_39_4 {\n    public static void main(String[] args) {\n      \
  \  Titan titan1 = new Titan(\"Cronus\", \"male\");\n        Titan titan2 = new Titan(\"\
  Oceanus\", \"male\");\n        Titan titan3 = new Titan(\"Rhea\", \"female\");\n\
  \        Titan titan4 = new Titan(\"Phoebe\", \"female\");\n    }\n}\n```\n\n在 Java\
  \ 中，允许一个字段和一个局部变量（甚至是一个形式参数）具有相同的名称。因此，`Titan` 类也可以写如下：\n\n```java\nclass Titan\
  \ {\n    public String name;\n    public String gender;\n    //Define the constructor\n\
  \    public Titan(String name, String gender) {\n        this.name = name;     //字段和参数可以有相同的名称\n\
  \        this.gender = gender;\n    }\n}\n```\n\n变量 `name` 和 `gender` 是用于向构造方法传递值的参数，而\
  \ `this.name` 和 `this.gender` 是用于在对象内部存储值的字段。\n\n#### 练习 39.4-1 历史事件\n\n完成以下操作：\n\
  \ni. 写一个名为 `HistoryEvents` 的类，包含：\na. 一个名为 `day` 的公共字符串字段。\nb. 一个名为 `events` 的公共字符串数组字段。\n\
  c. 一个构造方法，通过其形式参数列表接受字段 `day` 的初始值。\nii. 编写一个 Java 程序，为以下历史事件创建两个 `HistoryEvents`\
  \ 类的对象：\n\n- 7 月 4 日\n    - i. 1776 年：美国《独立宣言》\n    - ii. 1810 年：法国军占领阿姆斯特丹\n- 10\
  \ 月 28 日\n    - i. 969 年：拜占军队占领安条俄克\n    - ii. 1940 年：希腊 Ohi 日\n\n然后显示所有可用信息。\n\n\
  #### 解决方案\n\n解决方案如下。\n\n![](img/00001.gif) Project_39_4_1\n\n```java\nclass HistoryEvents\
