  \ `a` 中搜索值 `needle`。假设数组包含数值并按升序排序。\n\n# 第 7 ：子程序\n\n## 第 35 章：子程序简介\n\n### 35.1\
  \ 什么是子程序？\n\n在计算机科学中，子程序是一个封装成单元的语句块，用于执行特定任务。当需要执行该特定任务时，可以在程序中多次调用子程序。\n\n在 Java\
  \ 中，内置方法（built-in method）是此类子程序的一个示例。以已知的 `Math.abs()` 方法为例。它由一组语句组成，这些语句被封装在名为“abs”的单元下并执行特定任务——返回数字的绝对值。\n\
  \n![](img/00002.jpeg)如果你在好奇 `Math.abs()` 方法内部可能存在哪些语句，这里有一个可能的语句块。\n\n```\nif (number\
  \ < 0)\nreturn number * (-1);\nelse\nreturn number;\n```\n\n通常来说，子程序分为两种：函数（functions）和过程（procedures）。函数和过程的区别在于函数会返回结果，而过程不会返回。然而，在某些计算机语言中，这种区别可能并不明显。在某些语言中，函数也可以表现像过程且不返回结果，而在另一些语言中，过程可以返回一个甚至多个结果。\n\
  \n![](img/00002.jpeg)根据所使用的计算机语言，“函数”和“过程”的术语可能不同。例如，在 Visual Basic 中，它们被称为“functions”和“subprocedures”，在\
  \ FORTRAN 中是“functions”和“subroutines”，而在 Java 中，首选的术语通常是“methods”（方法）和“void methods”（空方法）。\n\
  \n### 35.2 什么是过程化编程？\n\n假设你被分配了一个项目来解决你地区的药物滥用问题。一种可能的方法（可能证明非常困难）是尝试自己解决这个问题！\n\
  \n然而，一种更好的方法是将大问题细分为较小的子问题，如预防、治疗和康复，每个子问题都可以进一步细分，所示。然后，通过各个领域专家的帮助，你可以建立一个团队来帮助解决。下面的图展示了如何进一步细分，如图\
  \ 35–1 所示。\n\n![Image](img/00412.gif)\n\n图 35–1 问题可以细分较小的问题\n\n然后，作为该项目的负责人，你可以租一栋建筑并在其中建立三个部门：预防部门（及其所有子部门）、治疗部门（及其所有子部门）以及康复部门（及其所有子部门）。最后，你将雇佣员工来他们为你工作！\n\
  \n过程化编程正是执行相同的事情。它将初始问题细分为较小的子问题，每个子问题又进一步细分为更小的子问题。最后，为每个子问题编写一个小的子程序，主程序（正如主管一样）调用（雇用）其中的每一个来完成不同的部分。\n\
  \n过程化编程有几个优点：\n\n- 它允许程序员在需要时重复使用相同的代码，而无需复制。\n- 它相对容易实现。\n- 它有助于程序员更轻松地跟踪执行流。\n\
  \n![](img/00002.jpeg)一个非常大的程序如果合在一起，调试和维护可能会非常困难。由于这个原因，通常将其细分为较小的子程序更容易，每个子程序执行一个定义清晰的过程。\n\
  \n### 35.3 什么是模块化编程？\n\n在模块化编程中，具有共同功能的子程序被组合到独立的模块中，每个模块可以有自己的数据集。因此，程序可以由多个部分组成，每个部分（模块）可以包含一个或多个较小的部分（子程序）。\n\
  \n![](img/00002.jpeg)Java 内置的 Math 模块就是这样一个示例。它包含了常用功能的子程序（与数学相关），如 `abs()`、`sqrt()`、`sin()`、`cos()`、`tan()`\
  \ 等许多。\n\n\n\n\n\n如果你在之前的药物问题示例中使用模块化编程，那么你会有三个独立的建筑——一栋用于托管预防部门及其所有的子部门，另一栋用于托管治疗部门及其所有的子部门，第三栋用于托管康复部门及其所有的子部门（如图\
  \ 35–2 所示）。这三栋建筑可以被认为是模块化编程中的三个不同模块，每个模块都包含常用功能的子程序。\n\n![Image](img/00413.jpeg)\n\
  \n图 35–2 常用功能的子程序可以被分组到独立的模块中。\n\n### 35.4 复习题：判断题\n\n对以下每个陈述选择对或错。\n\n1. 子程序是一个被封装成单元的执行特定任务的语句块。\n\
  2. 通常情况下，子程序有两种：函数和过程（procedures）。\n3. 在许多计算机语言中，函数和过程的区别在于过程返回结果，而函数不返回。\n4. `Java`\
  \ 只支持过程（procedures）。\n5. 过程化编程将初始问题细分为更小的子问题。\n6. 过程化编程的优点是需要时可以重复使用相同的代码，而无需复制它。\n\
  7. 过程化编程帮助程序员更容易地遵循执行流。\n8. 模块化编程提高了程序的执行速度。\n9. 在模块化编程中，常用功能的子程序被分组到独立的模块中。\n10.\
  \ 在模块化编程中，每个模块都可以有自己的一组数据。\n11. 模块化编程使用的结构与结构化编程不同。\n12. 程序可以由多个一个模块组成。\n\n## 第\
  \ 36 章\n\n用户定义子程序\n\n### 36.1 返回值的子程序\n\n在许多计算机语言中，返回值的子程序被称为 `function`（函数）。`Java`\
  \ 将它们称为 `methods`（方法），方法分为两类。有内置方法，如 `Math.abs()`、`Math.sqrt()`，还有用户定义方法，即你在自己的程序中实际编写和使用的方法。\n\
  \n返回值的 `Java` 方法的通用形式所示：\n\n```java\nstatic return_type name([type1 arg1, type2\
  \ arg2, type3 arg3, …]) {\n    Local variables declaration section\n    一条语句或语句块\n\
  \    return value;\n}\n```\n\n其中\n\n- `return_type` 是方法返回的值的数据类型。\n- `name` 是方法的名称。它遵循与变量名相同的规则。\n\
  - `arg1`, `arg2`, `arg3`, `…` 是参数列表（变量、数组等），用于从调用者向方法传递值。参数数量可以根据需要任意设置。\n- `type1`,\
  \ `type2`, `type3`, `…` 是每个参数的数据类型。每个参数都必须有一个数据类型。\n- `value` 是返回给调用者的值。它可以是一个常量、变量、一个表达式，甚至是一个数据结构。它的数据类型必须与方法的\
  \ `return_type` 匹配。\n\n![](img/00002.jpeg) 注意参数是可选的；也就是说，方法可以不包含任何参数。\n\n方法名可以比作一个盒子（见图\
  \ 36–1），其中包含一条语句或语句块。它接受参数 `arg1`、`arg2`、`arg3`、`…` 作为输入值并返回 `value` 作为输出值。\n\n\
  ![Image](img/00414.gif)\n\n图 36–1 方法可以比作一个盒子\n\n例如，下一个方法通过参数 `num1` 和 `num2` 接收两个数字，然后计算它们的和并返回结果。\n\
  \n```java\nstatic double get_sum(double num1, double num2) {\n    double result;\n\
  \    result = num1 + num2;\n    return result;\n}\n```\n\n当然，也可以写成：\n\n```java\n\
  static double get_sum(double num1, double num2) {\n    return num1 + num2;\n}\n\
  ```\n\n### 36.2 如何调用方法\n\n对方法的每次调用如下：你编写方法名，后面跟着参数列表（如果需要），可以写在将方法的返回值赋值给变量的语句中，也可以直接在表达式中。\n\
  \n让我们来看一些例子。以下方法接受一个参数（一个数值），并返回该值三次方幂的结果。\n\n```java\nstatic double cube(double\
  \ num) {\n    result = num * num * num;\n    return result;\n}\n```\n\n现在，假设你想使用以下表达式计算结果\n\
  \n![Image](img/00415.gif)\n\n你可以将方法 `cube()` 返回的值赋值给变量，如下所示\n\n```java\nx = Double.parseDouble(cin.nextLine());\n\
  cb = cube(x);        // 将返回的值赋值给变量\ny = cb + 1 / x;      // 并使用该变量\nSystem.out.println(y);\n\
  ```\n\n或者你可以直接在表达式中调用方法，\n\n```java\nx = Double.parseDouble(cin.nextLine());\ny\
  \ = cube(x) + 1 / x; // 直接在表达式中调用方法\nSystem.out.println(y);\n```\n\n或者你甚至可以直接在 `System.out.println()`\
  \ 语句中调用方法。\n\n```java\nx = Double.parseDouble(cin.nextLine());\nSystem.out.println(cube(x)\
  \ + 1 / x);\n```\n\n\n\n`name` 是空方法（void method）的名字。它遵循与变量名相同的规则。`arg1`、`arg2`、`arg3`、……\
  \ 是一个参数列表（变量、数组等），用于从调用者将值传递给空方法。你可以根据需要包含任意数量的参数。`type1`、`type2`、`type3`、…… 是每个参数的数据类型。每个参数都必须有一个数据类型。\n\
  \n![](img/00002.jpeg)\n\n注意，参数是可选的；也就是说，空方法可以不包含任何参数。\n\n例如，下一个空方法通过参数 `num1` 和\
  \ `num2` 接收两个数字，然后计算它们的和并显示结果。\n\n```java\nstatic void display_sum(double num1,\
  \ double num2) {\n    double result;\n    result = num1 + num2;\n    System.out.println(result);\n\
  }\n```\n\n### 36.4 如何调用空方法\n\n你可以通过直接编写方法的名称来调用空方法。接下来的示例定义了空方法 `display_line()`，主代码在每次需要显示水平线时调用该空方法。\n\
  \n![](img/00001.gif)\n\nClass_36_4a\n```java\nstatic void display_line() {\n   \
  \ System.out.println(\"---------------------\");\n}\n\npublic static void main(String[]\
  \ args) {\n    System.out.println(\"Hello there!\");\n    display_line();\n    System.out.println(\"\
  How do you do?\");\n    display_line();\n    System.out.println(\"What is your name?\"\
  );\n    display_line();\n}\n```\n\n你也可以向空方法传递（发送）值，只要空方法括号内至少存在一个参数。在接下来的示例中，空方法\
  \ `display_line()` 被调用了三次，但每次通过变量长度传递了不同的值，导致打印出三行长度不同的线。\n\n![](img/00001.gif)\n\
  \nClass_36_4b\n```java\nstatic void display_line(int length) {\n    int i;\n   \
  \ for (i = 1; i <= length; i++) {\n        System.out.print(\"-\");\n    }\n   \
  \ System.out.println();\n}\n\npublic static void main(String[] args) {\n    System.out.println(\"\
  Hello there!\");\n    display_line(12);\n    System.out.println(\"How do you do?\"\
  );\n    display_line(14);\n    System.out.println(\"What is your name?\");\n   \
  \ display_line(18);\n}\n```\n\n![](img/00003.jpeg) 由于空方法 `display_line()` 不返回任何值，因此下一行代码是错误的。你不能将空方法赋值给变量，因为没有返回值！\n\
  \n```java\ny = display_line(12);\n```\n\n此外，你不能在语句中调用它。下一行代码也是错误的。\n\n```java\n\
  System.out.println( \"Hello there!\\n\" + display_line(12) );\n```\n\n### 36.5 形式参数与实际参数\n\
  \n每个方法（或空方法）都包含一个称为形式参数列表的参数列表。如所述，此列表中的参数是可选的；形式参数列表可以包含零参数、一个参数或多个参数。\n\n当调用一个子程序（方法或空方法）时，可能会向子程序传递一个参数列表。此列表被称为实际参数列表。\n\
  \n在接下来的示例中，变量 `n1` 和 `n2` 构成形式参数列表，而变量 `x`、`y` 以及表达式 `x + y` 和 `y / 2` 构成实际参数列表。\n\
  \n![](img/00001.gif)\n\nClass_36_5\n```java\n// 定义 multiply() 方法。\n// 两个参数 n1 和\
  \ n2 是形式参数。\nstatic double multiply(double n1, double n2) {\n    double result;\n\
  \    result = n1 * n2;\n    return result;\n}\n\n// 主代码在此开始\npublic static void\
  \ main(String[] args) {\n    double x, y, w;\n    x = Double.parseDouble(cin.nextLine());\n\
  \    y = Double.parseDouble(cin.nextLine());\n    // 调用 multiply() 方法。\n    // 两个参数\
  \ x 和 y 是实际参数。\n    w = multiply(x, y);\n    System.out.println(w);\n    // 调用 multiply()\
  \ 方法。\n    // 两个参数 x + y 和 y / 2 是实际参数。\n    System.out.println(multiply(x + 2,\
  \ y / 2));\n}\n```\n\n![](img/00002.jpeg) 注意，形式参数与实际参数之间存在一一对应的关系。在第一次调用中，参数 `x`\
  \ 的值传递给参数 `n1`，参数 `y` 的值传递给参数 `n2`。在第二次调用中，表达式 `x + 2` 的结果传递给参数 `n1`，表达式 `y / 2`\
  \ 的结果传递给参数 `n2`。\n\n### 36.6 方法是如何执行的？\n\n当主代码调用方法时，会执行以下步骤：\n\n1. 中断主代码语句的执行。\n\
  2. 实际参数列表中变量的值或表达式的结果传递给形式参数列表中的参数，执行流跳转到方法。\n3. 执行方法中的语句。\n4. 当方法执行结束时，一个值返回给主代码，执行流从调用之前的地方继续。\n\
  \n![](img/00001.gif)\n\nClass_366\n```java\nstatic double multiply(double n1, double\
  \ n2) {\n    double m;\n    m = n1 * n2;\n    if (m > 0) {\n        m = 0;\n   \
  \ }\n    return m;\n}\n\n// 主代码\npublic static void main(String[] args) {\n    double\
  \ a, b, result;\n    a = Double.parseDouble(cin.nextLine());\n    b = Double.parseDouble(cin.nextLine());\n\
  \    // ... 调用 multiply ...\n}\n```\n\n当 Java 程序启动时，首先执行的语句是 `a = Double.parseDouble(cin.nextLine())`。假设用户输入\
  \ 3 和 8。下面的跟踪表显示了精确的执行流、`a` 和 `b` 如何从主代码传递到方法，以及方法如何返回结果。\n\n| 步骤 | 主代码语句 | a |\
  \ b | result |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | `a = Double.parseDouble(cin.nextLine())`\
