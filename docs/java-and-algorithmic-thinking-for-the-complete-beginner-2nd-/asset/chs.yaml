  \ `find_max` 的子程序，通过其形式参数列表接收一个数组，并返回数组最大值的索引位置。\niii. 使用上述子程序，编写一个 Java 程序，提示用户向三个数组输入\
  \ 50 个人的名字、姓氏和年龄，然后显示年龄最大者的姓名。\n\n## Solution\n\n\n\n\n由于子程序 `get_age()` 返回一个值，因此它可以被写为一个方法。子程序\
  \ `find_max()` 也是如此，因为它也返回一个值。主代码必须提示用户输入 50 个人的名、姓和年龄，并分别存数组 `first_names`、`last_names`\
  \ 和 `ages` 中。然后，在方法 `find_max()` 的帮助下，可以找到数组 `ages` 中最大值的索引位置。解决方案所示。\n\n![](img/00001.gif)\n\
  \n```java\nClass_38_2_1\nstatic final int PEOPLE = 50;\nstatic int get_age() {\n\
  \    int age;\n    System.out.print(\"Enter an age: \");\n    age = Integer.parseInt(cin.nextLine());\n\
  \    while (age <= 0) {\n        System.out.print(\"Error: Invalid age\\nEnter a\
  \ positive number: \");\n        age = Integer.parseInt(cin.nextLine());\n    }\n\
  \    return age;\n}\nstatic int find_max(int[] a) {\n    int i, maximum, max_i;\n\
  \    maximum = a[0];\n    max_i = 0;\n    for (i = 1; i <= PEOPLE - 1; i++) {\n\
  \        if (a[i] > maximum) {\n            maximum = a[i];\n            max_i =\
  \ i;\n        }\n    }\n    return max_i;\n}\npublic static void main(String[] args)\
  \ {\n    int i, index_of_max;\n    String[] first_names = new String[PEOPLE];\n\
  \    String[] last_names = new String[PEOPLE];\n    int[] ages = new int[PEOPLE];\n\
