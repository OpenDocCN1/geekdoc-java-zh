  \n### 练习题 34.5-7 线性搜索算法 – 在包含唯一值的二维数组中搜索\n\n一家民意调查公司在 10 个城市进行电话调查，并询问每个城市 30 名市民是否锻炼。编写一个\
  \ Java 程序，提示用户输入每位市民的电话号码和答案（`Y` 表示是，`N` 表示否，`S` 表示有时）。程序随后必须提示用户输入一个电话号码，它将搜索并显示该电话号码对应的答案。程序还必须验证数据输入，并且仅接受\
  \ `Y`、`N` 或 `S` 作为答案。\n\n#### 解决方案\n\n在练习题中，你需要以下两个数组。\n\n![Image](img/00394.gif)\n\
  \n虽然从练习的表述并不清楚，但 `phone_num` 数组中的每个值都是唯一的！程序必须搜索给定的数字，如果找到了，则必须停止搜索。解决方案如下。\n\n\
  ![](img/00001.gif)\n```java\nClass_34_5_7 {\n    static final int CITIES = 10;\n\
  \    static final int CITIZENS = 30;\n\n    public static void main(String[] args)\
  \ {\n        int i, j, position_i, position_j;\n        boolean found;\n       \
  \ String needle;\n        String[][] phone_num = new String[CITIES][CITIZENS];\n\
  \        String[][] ans = new String[CITIES][CITIZENS];\n        for (i = 0; i <=\
  \ CITIES - 1; i++) {\n            System.out.println(\"City No. \" + (i + 1));\n\
  \            for (j = 0; j <= CITIZENS - 1; j++) {\n                System.out.print(\"\
  Enter phone number of citizen No. \" + (j + 1) + \": \");\n                phone_num[i][j]\
  \ = cin.nextLine();\n                System.out.print(\"Enter the answer of citizen\
  \ No. \" + (j + 1) + \": \");\n                ans[i][j] = cin.nextLine().toUpperCase();\n\
  \                while (!ans[i][j].equals(\"Y\") && !ans[i][j].equals(\"N\") &&\
  \ !ans[i][j].equals(\"S\")) {\n                    System.out.print(\"Wrong answer.\
  \ Enter a valid one: \");\n                    ans[i][j] = cin.nextLine().toUpperCase();\n\
  \                }\n            }\n        }\n        System.out.print(\"Enter a\
  \ phone number to search: \");\n        needle = cin.nextLine();\n        found\
  \ = false;\n        position_i = -1;\n        position_j = -1;\n        for (i =\
  \ 0; i <= CITIES - 1; i++) {\n            for (j = 0; j <= CITIZENS - 1; j++) {\n\
  \                if (phone_num[i][j].equals(needle)) { //If it is found\n      \
  \              found = true;\n                    position_i = i; //Keep row index\
  \ where needle was found\n                    position_j = j; //Keep column index\
  \ where needle was found\n                    break;  //Exit the inner loop\n  \
  \              }\n            }\n            if (found)\n                break;\
  \  //If it is found, exit the outer loop as well\n        }\n        if (!found)\
  \ {\n            System.out.println(\"Phone number not found!\");\n        } else\
  \ {\n            System.out.print(\"Phone number \" + phone_num[position_i][position_j]\
  \ + \" gave '\");\n            switch (ans[position_i][position_j]) {\n        \
  \        case \"Y\":\n                    System.out.print(\"Yes\");\n         \
  \           break;\n                case \"N\":\n                    System.out.print(\"\
  No\");\n                    break;\n                default:\n                 \
  \   System.out.print(\"Sometimes\");\n            }\n            System.out.print(\"\
  ' as an answer\");\n        }\n    }\n}\n```\n\n### 练习题 34.5-8 检查值是否存在于所有列中\n\n\
  编写一个 Java 程序，允许用户将数值输入到 20 × 30 的数组中。在输入所有值后，程序将让用户输入一个值。最后，如果给定的值在数组的每一列中至少出现一次，则必须显示消息。\n\
  \n#### 解决方案\n\n此练习题可以使用线性搜索算法和计数变量 `count` 来解决。Java 程序将遍历第一列；如果找到了给定的值，Java 程序将随后停止对第一列的搜索，并且变量\
  \ `count` 加 1。然后，程序将遍历第二列；如果再次找到了给定的值，Java 程序将随后停止对第二列的搜索，变量 `count` 再次加 1。此过程必须重复直到所有列都检查完毕。在过程结束，如果\
  \ `count` 的值等于列的总数，这意味着给定的值在数组的每一列中至少存在一次。\n\n让我们使用“从内层到外”的方法。以下代码段在数组的第一列（列索引为\
  \ 0）中搜索，如果找到了给定的值，执行流将退出 for 循环，变量 `count` 加 1。假设变量 `j` 包含值 0。\n\n```java\nfound\
  \ = false;\nfor (i = 0; i <= ROWS - 1; i++) {\n    if (haystack[i][j] == needle)\
  \ {\n        found = true;\n        break;\n    }\n}\nif (found) {\n    count++;\n\
  }\n```\n\n现在你可以将此代码段嵌套在一个遍历所有列的 for 循环中。\n\n```java\nfor (j = 0; j <= COLUMNS -\
  \ 1; j++) {\n    found = false;\n    for (i = 0; i <= ROWS - 1; i++) {\n       \
  \ if (haystack[i][j] == needle) {\n            found = true;\n            break;\n\
  \        }\n    }\n    if (found) {\n        count++;\n    }\n}\n```\n\n你已经准备好了，但考虑一下：如果内层循环没有在列中找到给定的值，外层循环必须停止。因此，更好的方法如下：\n\
  \n```java\nfor (j = 0; j <= COLUMNS - 1; j++) {\n    found = false;\n    for (i\
  \ = 0; i <= ROWS - 1; i++) {\n        if (haystack[i][j] == needle) {\n        \
  \    found = true;\n            break;\n        }\n    }\n    if (found) {\n   \
  \     count++;\n    }\n}\n```\n\n最终的 Java 程序如下：\n\n![](img/00001.gif)\n```java\n\
  Class_34_5_8 {\n    static final int ROWS = 20;\n    static final int COLUMNS =\
  \ 30;\n\n    public static void main(String[] args) {\n        int i, j, count;\n\
  \        boolean found;\n        double needle;\n        double[][] haystack = new\
  \ double[ROWS][COLUMNS];\n        for (i = 0; i <= ROWS - 1; i++) {\n          \
  \  for (j = 0; j <= COLUMNS - 1; j++) {\n                haystack[i][j] = Double.parseDouble(cin.nextLine());\n\
  \            }\n        }\n        System.out.print(\"Enter a value to search: \"\
  );\n        needle = Double.parseDouble(cin.nextLine());\n        count = 0;\n \
  \       for (j = 0; j <= COLUMNS - 1; j++) {\n            found = false;\n     \
  \       for (i = 0; i <= ROWS - 1; i++) {\n                if (haystack[i][j] ==\
  \ needle) {\n                    found = true;\n                    break;\n   \
  \             }\n            }\n            if (found) {\n                count++;\n\
  \            } else {\n                break;\n            }\n        }\n      \
  \  if (count == COLUMNS) {\n            System.out.println(needle + \" found every\
  \ column!\");\n        }\n    }\n}\n```\n\n![](img/00002.jpeg) 如果你需要在给定值在每一行中至少存在一次（而不是每一列）时显示消息，Java\
  \ 程序可以像之前所示操作；只需将遍历列改为遍历行即可。\n\n### 练习题 34.5-9 二分搜索算法 – 在排序的一维数组中搜索\n\n编写一个代码段，在排序的一维数组中搜索给定的值。使用二分搜索算法。\n\
  \n#### 解决方案\n\n二分搜索算法被认为非常快速，可以用于大规模数据。然而，它的主要缺点是数据需要经过排序。\n\n二分搜索算法的核心思想是检查数组中间元素的值。如果它不是你寻找的“大海捞针”，而且你寻找的值实际上小于中间元素的值，那么意味着\
  \ `needle` 必须在数组的前半部分。相反，如果你寻找的值比中间元素的值大，那么 `needle` 必须在数组的后半部分。\n\n二分搜索算法通过检查剩余部分的中间元素的值来继续进行。搜索范围缩小到\
  \ `needle` 可能存在的剩余部分，直到找到 `needle` 或剩余部分只包含一个元素。\n\n\n\n\n困惑吗？让我们通过一个示例来分析二分查找算法。下面的数组包含按升序排列的数值。假设你正在寻找的“针”值是\
  \ 44。\n\n![Image](img/00395.gif)\n\n程序使用了三个变量。初始时，变量 `left` 包含值 `0`（这是第一个元素的索引），变量\
  \ `right` 包含值 `13`（这是最后一个元素的索引），而变量 `middle` 包含值 `6`（这大约是中间元素的索引）。\n\n![Image](img/00396.gif)\n\
  \n你正在寻找的“针”（值 `44`）大于中间的数值 `39`，因此你正在寻找的元素必须在数组的后半部分。因此，变量 `left` 更新为指向索引位置 `7`，变量\
  \ `middle` 更新为指向 `left`（新的值）和 `right` 之间的中间。\n\n![Image](img/00397.gif)\n\n现在，你正在寻找的“针”（值\
  \ `44`）小于中间的数值 `57`，因此你正在寻找的元素必须在数组剩余部分的前半部分。因此，现在更新变量 `right` 指向索引位置 `9`，并将变量 `middle`\
  \ 更新为指向 `left` 和 `right`（新的值）之间的中间。\n\n![Image](img/00398.gif)\n\n你完成了！在索引位置 `8`\
  \ 处找到了“针”，整个过程可以停止了！\n\n![](img/00003.jpeg) 每次失败的比较都会让待检查的元素数量减半！\n\n现在，让我们看看对应的代码片段。\n\
  \n```\nleft = 0;\nright = ELEMENTS - 1;\nfound = false;\nwhile (left <= right &&\
  \ !found) {\n    middle = (int)((left + right) / 2);  //这是一个除以 2 的操作\n    if (haystack[middle]\
  \ > needle) {\n        right = middle - 1;\n    } else if (haystack[middle] < needle)\
  \ {\n        left = middle + 1;\n    } else {\n        found = true;\n        index_position\
  \ = middle;\n    }\n}\nif (!found) {\n    System.out.println(\"Nothing found!\"\
  );\n} else {\n    System.out.println(needle + \" found at position: \" + index_position);\n\
  }\n```\n\n![](img/00002.jpeg) 在示例数组上使用二分查找算法，只需三次迭代即可找到值 `44`。另一方面，对于相同的数据，线性查找算法将需要九次\
  \ 迭代！\n\n![](img/00002.jpeg) 如果数组中包含多次重复的数值，二分查找算法只能找到其中一个出现。\n\n### 练习 34.5-10\
