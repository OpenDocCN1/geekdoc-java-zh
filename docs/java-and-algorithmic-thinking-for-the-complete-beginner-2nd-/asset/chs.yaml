  \ \");\n    number = Integer.parseInt(cin.nextLine());\n    digit1 = (int)(number\
  \ / 100000);\n    r = number % 100000;\n    digit2 = (int)(r / 10000);\n    r =\
  \ r % 10000;\n    digit3 = (int)(r / 1000);\n    r = r % 1000;\n    digit4 = (int)(r\
  \ / 100);\n    r = r % 100;\n    digit5 = (int)(r / 10);\n    digit6 = r % 10;\n\
  \    System.out.print(digit1 + \"  \" + digit2 + \"  \" + digit3 + \"  \");\n  \
  \  System.out.println(digit4 + \"  \" + digit5 + \"  \" + digit6);\n}\n```\n\n####\
  \ 第二种方法\n\n再次尝试使用运算符理解第二种方法。以 `6753` 为例。\n\n| 第四位 = 3 | 如果使用 `%` 运算符将给定数字除以 10 获取整数余数\
  \ `digit4 = 6753 % 10`，就可以分离出第四位。 |\n| 剩余数字 = 675 | 如果使用 `/` 运算符将给定数字除以 10 获取整数商\
  \ `r = (int)(6753 / 10)`，就可以分离剩余数字。 |\n| 第三位 = 5 | 如果使用 `%` 运算符将剩余数字除以 10 获取整数余数\
  \ `digit3 = 675 % 10`，就可以分离出第三位。 |\n| 剩余数字 = 67 | 如果使用 `/` 运算符将剩余数字除以 10 获取整数商 `r\
  \ = (int)(675 / 10)` | |\n| 第二位 = 7 | 如果使用 `%` 运算符将剩余数字除以 10 获取整数余数 `digit2 = 67\
  \ % 10`，就可以分离出第二位。 |\n| 第一位 = 6 | 最后一个剩余的数字恰好是第一位，即 `digit1 = (int)(67 / 10)` |\n\
  \n该算法的 Java 程序所示。\n\n![](img/00001.gif) Class_13_1_2c\n```java\npublic static void\
  \ main(String[] args) {\n    int digit1, digit2, digit3, digit4, number, r, total;\n\
