  \ 编写一个 Java 程序，提示用户在数组中输入 40 个单词，然后显示其中至少包含两次字母“w”的单词。\n\n# 第 32 章：二维数组\n\n### 32.1\
  \ 在 Java 中创建二维数组\n\n一个可以存储三个学生四门课程成绩的数组如下：\n\n![Image](img/00330.gif)\n\n二维数组具有行和列。在这一特定示例中，数组\
  \ `grades` 有 3 行 4 列。\n\n实际上，Java 仅支持一维数组，但你可以使用一种技巧来克服这个问题并创建多维数组。你可以创建一个“**数组的数组**！只需将\
  \ `grades` 数组想象成一个包含三个元素的单列数组，其中每个元素都包含一个拥有四个元素的完整新数组，如下所示。\n\n![Image](img/00331.gif)\n\
  \n在 Java 中，二维数组是数组的数组，三维数组是数组的数组的数组，依此类推。\n\n与一维数组一样，创建和向二维数组添加元素（以及值）有四种方法。让我们尝试使用每种方法来创建\
  \ `grades` 数组。\n\n#### 方法一\n\n要创建一个数组并直接为其元素赋值，可以使用以下通用形式的 Java 语句：\n\n```java\n\
  type[][] array_name = { {value0-0, value0-1, value0-2, …, value0-M},\n         \
  \               {value1-0, value1-1, value1-2, …, value1-M},\n                 \
  \       {value2-0, value2-1, value2-2, …, value2-M},\n                        …\n\
  \                        {valueN-0, valueN-1, valueN-2, …, valueN-M}\n};\n```\n\n\
  其中：\n- `type` 可以是 `int`、`double`、`String` 等。\n- `array_name` 是数组名称。\n- `value0-0`、`value0-1`、`value0-2`……`valueN-M`\
  \ 是数组的值。\n\n对于这种方法，你可以使用以下语句创建 `grades` 数组：\n\n```java\nString[][] grades = { {\"\
  B+\", \"A\", \"C\", \"-\"},\n                     {\"B\", \"A\", \"C\", \"A\"},\n\
  \                     {\"B\", \"-\", \"B+\" };\n```\n\n第一个值 \"B+\" 被赋值给索引 0 列 0，第二个值\
  \ \"A\" 被赋值给索引 0 列 1，依此类推。\n\n#### 方法二\n\n你可以使用以下通用形式的 Java 语句创建一个空元素的二维数组：\n\n\
  ```java\ntype[][] array_name = new type[number_of_rows][number_columns];\n```\n\n\
  其中 `number_of_rows` 和 `number_columns` 是任意整数。然后，你可以使用以下语句为数组元素赋值：\n\n```java\narray_name[row_index][column_index]\
  \ = value;\n```\n\n其中 `row_index` 和 `column_index` 分别是行和列的位置。以下代码片段创建了 3 行 4 列的\
  \ `grades` 数组并进行了赋值：\n\n```java\nString[][] grades = new String[3][4];\ngrades[0][0]\
  \ = \"B+\";\ngrades[0][1] = \"A\";\ngrades[0][2] = \"C\";\ngrades[0][3] = \"-\"\
  ;\n// ... 其他赋值\n```\n\n### 32.2 从二维数组获取值\n\n二维数组由行和列组成。下面的示例显示了一个 3 行 4 列的二维数组：\n\
  \n![Image](img/00332.gif)\n\n二维数组的每个元素可以通过一对索引（行索引和列索引）唯一标识，如下：\n\n```java\nString[][]\
  \ grades = { {\"B+\", \"A\", \"C\", \"-\"},\n                     {\"B\", \"A\"\
  , \"C\", \"A\"},\n                     {\"B\", \"-\", \"B+\" };\n\nSystem.out.println(grades[1][2]);\
  \ // 输出 C\nSystem.out.println(grades[2][2]); // 输出 -\nSystem.out.println(grades[0][0]);\
  \ // 输出 B+\n```\n\n#### 练习 32.2-1 创建追踪表\n\n为以下代码段创建追踪表：\n\n```java\nint[][] a =\
  \ { {0, 0},\n              {0, 0},\n              {0, 0} };\na[1][0] = 9;\na[0][1]\
  \ = 1;\na[0][0] = a[0][1] + 6;\nint x = 2;\na[x][1] = a[0][0] + 4;\na[x][0] = a[x-1][1]\
  \ - 3;\n```\n\n**解答：**\n\n该代码片段使用了 3×2 数组，即具有 3 行 2 列的数组。追踪表如下：\n\n| 步骤 | 语句 | 备注\
  \ | x | a |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | `int[][] a = { {0, 0},\
  \ {0, 0}, {0, 0} };` | 创建了全零数组 a | ? | `[[0, 0], [0, 0], [0, 0]]` |\n| 2 | `a[1][0]\
  \ = 9;` | | ? | `[[0, 0], [9, 0], [0, 0]]` |\n| 3 | `a[0][1] = 1;` | | ? | `[[0,\
  \ 1], [9, 0], [0, 0]]` |\n| 4 | `a[0][0] = a[0][1] + 6;` | | ? | `[[7, 1], [9, 0],\
  \ [0, 0]]` |\n| 5 | `int x = 2;` | | 2 | `[[7, 1], [9, 0], [0, 0]]` |\n| 6 | `a[x][1]\
  \ = a[0][0] + 4;` | | 2 | `[[7, 1], [9, 11], [0, 0]]` |\n| 7 | `a[x-1][1] = a[0][1]\
  \ * 3;` | | 2 | `[[7, 3], [9, 11], [0, 0]]` |\n| 8 | `a[x][0] = a[x-1][1] - 3;`\
  \ | | 2 | `[[7, 3], [9, 11], [0, 0]]` |\n\n\n\n\n\n| 4 | `a[0][0] = a[0][1] + 6`\
  \ | | ? |\n| | 7 | 1 | |\n| | 9 | 0 | |\n| | 0 | 0 | |\n| |\n| 5 | `x = 2` | | 2\
  \ |\n| | 7 | 1 | |\n| | 9 | 0 | |\n| | 0 | 0 | |\n| |\n| 6 | `a[x][1] = a[0][0]\
  \ + 4` | | 2 |\n| | 7 | 1 | |\n| | 9 | 0 | |\n| | 0 | 11 | |\n| |\n| 7 | `a[x -\
  \ 1][1] = a[0][1] * 3` | | 2 |\n| | 7 | 1 | |\n| | 9 | 3 | |\n| | 0 | 11 | |\n|\
  \ |\n| 8 | `a[x][0] = a[x - 1][1] - 3` | | 2 |\n| | 7 | 1 | |\n| | 9 | 3 | |\n|\
  \ | 0 | 11 | |\n\n### 32.3 如何遍历二维数组\n\n由于二维数组由行和列组成，程序可以按行遍历，也可以按列遍历。\n\n#### 按行遍历\n\
  \n按行遍历意味着首先处理第 0 行，紧接着处理第 1 行，然后是第 2 行，依此类推。接下来是一个 3 × 4 数组的示例。箭头显示了执行行遍历时遵循的“路径”，换句话说，它们显示了元素处理的顺序。\n\
  \n![Image](img/00333.gif)\n\n![](img/00003.jpeg) 3 × 4 数组是一个具有 3 行 4 列的二维数组。在 `Y\
  \ × X` 表示法中，第一个数字（`Y`）始终代表总行数，第二个数字（`X`）始终代表总列数。\n\n按行遍历时，数组元素的处理如下：\n\n► 第 0 行的元素按以下顺序处理：`a[0][0]`\
  \ → `a[0][1]` → `a[0][2]` → `a[0][3]`\n► 第 1 行的元素按以下顺序处理：`a[1][0]` → `a[1][1]` →\
  \ `a[1][2]` → `a[1][3]`\n► 第 2 行的元素按以下顺序处理：`a[2][0]` → `a[2][1]` → `a[2][2]` → `a[2][3]`\n\
  \n使用 Java 语句，让我们尝试按行遍历处理一个 3 × 4 数组（3 行×4 列）的所有元素。\n\n```java\ni = 0; // 变量 i 指向第\
  \ 0 行。\nfor (j = 0; j <= 3; j++) { // 此循环控制结构处理第 0 行的所有元素\n    process a[i][j];\n\
  }\ni = 1; // 变量 i 指向第 1 行。\nfor (j = 0; j <= 3; j++) { // 此循环控制结构处理第 1 行的所有元素\n\
  \    process a[i][j];\n}\ni = 2; // 变量 i 指向第 2 行。\nfor (j = 0; j <= 3; j++) { //\
  \ 此循环控制结构处理第 2 行的所有元素\n    process a[i][j];\n}\n```\n\n当然，可以使用下所示的嵌套循环控制结构相同的结果。\n\
  \n```java\nfor (i = 0; i <= 2; i++) {\n    for (j = 0; j <= 3; j++) {\n        process\
  \ a[i][j];\n    }\n}\n```\n\n让我们来看一些例子。以下代码段允许用户为数组 `b` 输入 10 × 10 = 100 个值。\n\n\
  ```java\nfor (i = 0; i <= 9; i++) {\n    for (j = 0; j <= 9; j++) {\n        b[i][j]\
  \ = cin.nextLine();\n    }\n}\n```\n\n以下代码段将数组 `b` 的所有值减 1。\n\n```java\nfor (i =\
  \ 0; i <= 9; i++) {\n    for (j = 0; j <= 9; j++) {\n        b[i][j]--; // 等于 b[i][j]\
  \ = b[i][j] - 1\n    }\n}\n```\n\n以下代码段显示数组 `b` 的所有元素。\n\n```java\nfor (i = 0; i\
  \ <= 9; i++) {\n    for (j = 0; j <= 9; j++) {\n        System.out.print(b[i][j]\
  \ + \"\\t\");\n    }\n    System.out.println();\n}\n```\n![](img/00002.jpeg) `System.out.println()`\
  \ 语句用于在行之间“显示”换行符。\n\n还有另一种方法，非常简单，但不如之前的方法灵活。如如下所示，在某些情况下它是无法使用的。以下用通用形式编写的代码段：\n\
  \n```java\nfor (type[] row : array_name) {\n    for (type element : row) {\n   \
  \     process element;\n    }\n}\n```\n其中 `process` 是在每次迭代中处理数组一个元素的 Java 语句或块。以下\
  \ Java 程序显示数组 `b` 的所有元素，每次迭代一个。\n\n```java\nfor (String[] row : b) {\n    for (String\
  \ element : row) {\n        System.out.print(element + \"\\t\");\n    }\n    System.out.println();\n\
  }\n```\n\n遗憾的是，这种方法无法修改数组的值。例如，如果你想将数组 `numbers` 所有元素翻倍，无法执行以下操作：\n\n```java\nint[][]\
  \ numbers = { {5, 10, 3}, {2, 4, 6} };\nfor (int[] x : numbers) {\n    for (int\
  \ number : x) {\n        number *= 2;\n}\n```\n\n#### 按列遍历\n\n按列遍历意味着首先处理第 0 列，紧接着处理第\
  \ 1 列，然后是第 2 列，依此类推。接下来是一个 3 × 4 数组的示例。箭头显示了元素处理的顺序。\n\n![Image](img/00334.gif)\n\
  \n按列遍历时，数组元素的处理如下：\n\n► 第 0 列的元素按以下顺序处理：`a[0][0]` → `a[1][0]` → `a[2][0]`\n► 第 1\
  \ 列的元素按以下顺序处理：`a[0][1]` → `a[1][1]` → `a[2][1]`\n► 第 2 列的元素按以下顺序处理：`a[0][2]` → `a[1][2]`\
  \ → `a[2][2]`\n► 第 3 列的元素按以下顺序处理：`a[0][3]` → `a[1][3]` → `a[2][3]`\n\n使用 Java 语句，尝试按列遍历处理\
  \ 3 × 4 数组（3 行 4 列）的所有元素。\n\n```java\nj = 0; // 变量 j 指向第 0 列。\nfor (i = 0; i <=\
  \ 2; i++) { // 此循环控制结构处理第 0 列的所有元素\n    process a[i][j];\n}\nj = 1; // 变量 j 指向第\
  \ 1 列。\nfor (i = 0; i <= 2; i++) { // 此循环控制结构处理第 1 列的所有元素\n    process a[i][j];\n\
  }\nj = 2; // 变量 j 指向第 2 列。\nfor (i = 0; i <= 2; i++) { // 此循环控制结构处理第 2 列的所有元素\n\
  \    process a[i][j];\n}\nj = 3; // 变量 j 指向第 3 列。\nfor (i = 0; i <= 2; i++) { //\
  \ 此循环控制结构处理第 3 列的所有元素\n    process a[i][j];\n}\n```\n\n当然，可以使用下所示的嵌套循环结构实现相同的结果。\n\
  \n```java\nfor (j = 0; j <= 3; j++) {\n    for (i = 0; i <= 2; i++) {\n        process\
  \ a[i][j];\n    }\n}\n```\n\n你可以看到，这段代码与按行遍历的代码只有一个点不同：两个 for 循环的位置交换了。但要注意，不要尝试交换\
  \ `process a[i][j]` 语句中两个索引变量 `i` 和 `j` 的位置。例如以下代码段，它尝试按列遍历 3 × 4 数组（3 行 4 列），但它不满足确定。你能找到为什么吗？\n\
  \n```java\nfor (j = 0; j <= 3; j++) {\n    for (i = 0; i <= 2; i++) {\n        process\
  \ a[j][i];\n    }\n}\n```\n\n问题出现在变量 `j` 等于 `3` 时。`process a[j][i]` 语句尝试处理行索引 3（这是第四行）的元素，显然它并不存在！还是困惑吗？不要！3\
  \ × 4 数组中没有行索引 3！为什么？因为行索引从 0 开始，所以只存在第 0、1、2 行！\n\n### 32.4 如何向二维数组添加用户输入的值\n\n\
  与一维数组一样，与其从键盘读取一个值并赋值给变量，不如将该值直接赋值特定的数组元素。以下代码段创建一个二维数组 `names`，提示用户输入六个值，并将这些值赋值给数组的元素。\n\
  \n```java\npublic static void main(String[] args) {\n    String[][] names = new\
  \ String[3][2];\n    System.out.print(\"Name for Row 0, Column 0: \");names[0][0]\
  \ = cin.nextLine();\n    System.out.print(\"Name for Row 0, Column 1: \");names[0][1]\
  \ = cin.nextLine();\n    System.out.print(\"Name for Row 1, Column 0: \");names[1][0]\
  \ = cin.nextLine();\n    System.out.print(\"Name for Row 1, Column 1: \");names[1][1]\
  \ = cin.nextLine();\n    System.out.print(\"Name for Row 2, Column 0: \");names[2][0]\
  \ = cin.nextLine();\n    System.out.print(\"Name for Row 2, Column 1: \");names[2][1]\
  \ = cin.nextLine();\n}\n```\n\n使用嵌套 for 循环，这段代码可以等价地写为：\n\n```java\nfinal static\
  \ int ROWS = 3;\nfinal static int COLUMNS = 2;\npublic static void main(String[]\
  \ args) {\n    int i, j;\n    String[][] names = new String[ROWS][COLUMNS];\n  \
  \  for (i = 0; i <= ROWS - 1; i++) {\n\n\n\n```java\nfor (j = 0; j <= COLUMNS -\
  \ 1; j++) {\n    System.out.print(\"Name for Row \" + i + \", Column \" + j + \"\
  : \");\n    names[i][j] = cin.nextLine();\n}\n}\n```\n\n### 练习 32.4-1 仅显示实数\n\n\
  编写一个 Java 程序，提示用户在 5 × 7 数组中输入数值，然后显示包含实数的元素索引。\n\n#### 解决方案\n\n遍历行是最常用的方法，所以让我们使用它吧。解决方案如下：\n\
  \n![](img/00001.gif)\n\n```java\nstatic final int ROWS = 5;\nstatic final int COLUMNS\
  \ = 7;\npublic static void main(String[] args) {\n    int i, j;\n    double[][]\
  \ a = new double[ROWS][COLUMNS];\n    for (i = 0; i <= ROWS - 1; i++) {\n      \
  \  for (j = 0; j <= COLUMNS - 1; j++) {\n            System.out.print(\"Enter a\
  \ value for element \" + i + \", \" + j + \": \");\n            a[i][j] = Double.parseDouble(cin.nextLine());\n\
  \        }\n    }\n    for (i = 0; i <= ROWS - 1; i++) {\n        for (j = 0; j\
  \ <= COLUMNS - 1; j++) {\n            if (a[i][j] != (int)(a[i][j])) {   //检查是否为实数（浮点数）\n\
  \                System.out.println(\"A real found at position: \" + i  + \", \"\
  \ + j);\n            }\n        }\n    }\n}\n```\n\n### 练习 32.4-2 仅显示奇数列\n\n编写一个\
  \ Java 程序，提示用户在 5 × 7 数组中输入数值，然后显示索引为奇数的列元素（即列索引 1、3 和 5）。\n\n#### 解决方案\n\n接下来是\
  \ Java 程序。\n\n![](img/00001.gif)\n\n```java\nstatic final int ROWS = 5;\nstatic\
  \ final int COLUMNS = 7;\npublic static void main(String[] args) {\n    int i, j;\n\
  \    double[][] a = new double[ROWS][COLUMNS];\n    for (i = 0; i <= ROWS - 1; i++)\
  \ {\n        for (j = 0; j <= COLUMNS - 1; j++) {\n            System.out.print(\"\
  Enter a value for element \" + i + \", \"+ j + \": \");\n            a[i][j] = Double.parseDouble(cin.nextLine());\n\
  \        }\n    }\n    // 遍历列\n    for (j = 1; j <= COLUMNS - 1; j += 2) { // 从\
  \ 1 开始，每次递增 2\n        for (i = 0; i <= ROWS - 1; i++) {\n            System.out.print(a[i][j]\
  \ + \"  \");\n        }\n    }\n}\n```\n\n![](img/00002.jpeg) 本书尝试尽可能使用变量 `i` 作为行索引，变量\
  \ `j` 作为列索引。当然，你也可以使用其他变量名，例如用于行索引的 `row`、r` 或用于列索引的 `column`、c`，但大多数程序员广泛使用变量 `i`\
  \ 和 `j`。在使用它们一段时间后，你的大脑会将 `i` 与行、将 `j` 与列联系起来。因此，每个在二维数组中使用这些变量名作为索引的算法或程序都将更容易被理解。\n\
  \n### 32.5 变量 i 和 j 有什么故事？\n\n许多程序员认为变量 `i` 的名称代表“index（索引）”，而使用 `j` 仅仅是因为它在 `i`\
  \ 之后。还有人认为名称 `i` 代表“integer（整数）”。事实可能介于两者之间。\n\n在计算机出现很早以前，数学家就已经使用 `i`、`j` 和 `k`\
  \ 来指代数学中的整数了。后来，在最早的高级计算机语言之一 `FORTRAN` 中，变量 `i`、`j`、`k`、`l`、`m` 和 `n` 默认都是整数。因此，第一批程序员养成了在程序中使用变量\
  \ `i` 和 `j` 的习惯，这便成为了大多数计算机语言的惯例。\n\n### 32.6 方矩阵\n\n在数学中，行数和列数相同的矩阵被称为方矩阵。以下是方矩阵的一些例子。\n\
  \n![图像](img/00335.gif)\n\n### 练习 32.6-1 寻找主对角线元素的和\n\n编写一个 Java 程序，让用户向 10 × 10\
  \ 数组输入数值，然后计算其主对角线元素的和。\n\n#### 解决方案\n\n在数学中，方矩阵的主对角线是指从左上角到右下角的元素集合。以下是一些方矩阵的示例，其主对角线用深色背景突出。\n\
  \n![图像](img/00336.gif)\n\n![](img/00002.jpeg) 注意，主对角线元素的行索引等于它们的列索引。\n\n你可以使用两种方法计算主对角线元素的和。让我们学习学习。\n\
  \n#### 方法一——遍历所有元素\n\n在这种方法中，程序遍历行并检查行索引是否等于列索引。对于方矩阵（在这种情况下为 N × N），行和列相等，所以你可以定义常量\
  \ `N`。解决方案如下：\n\n![](img/00001.gif)\n\n```java\nstatic final int N = 10;\npublic\
  \ static void main(String[] args) {\n    int i, j;\n    double[][] a = new double[N][N];\n\
  \    for (i = 0; i <= N - 1; i++) {\n        for (j = 0; j <= N - 1; j++) {\n  \
  \          a[i][j] = Double.parseDouble(cin.nextLine());\n        }\n    }\n   \
  \ // 计算和\n    total = 0;\n    for (i = 0; i <= N - 1; i++) {\n        for (j = 0;\
  \ j <= N - 1; j++) {\n            if (i == j) {\n                total += a[i][j];\n\
  \            }\n        }\n    }\n    System.out.println(\"Sum = \" + total);\n\
  }\n```\n\n#### 方法二——直接遍历对角线\n\n在这种方法中，程序直接遍历主对角线。这种方法的解决方案如下：\n\n```java\nstatic\
  \ final int N = 10;\npublic static void main(String[] args) {\n    int i, j;\n \
  \   double total;\n    double[][] a = new double[N][N];\n    for (i = 0; i <= N\
  \ - 1; i++) {\n        for (j = 0; j <= N - 1; j++) {\n            a[i][j] = Double.parseDouble(cin.nextLine());\n\
  \        }\n    }\n    // 计算和\n    total = 0;\n    for (i = 0; i <= N - 1; i++)\
  \ {\n        total += a[i][i];\n    }\n    System.out.println(\"Sum = \" + total);\n\
  }\n```\n\n![](img/00002.jpeg) 这种方法比第一种更高效，因为负责计算和的循环只需要 N 次。\n\n### 32.6-2 寻找反对角线元素的和\n\
  \n编写一个 Java 程序，让用户向 5 × 5 数组输入数值，然后计算其反对角线元素的和。\n\n#### 解决方案\n\n在数学中，矩阵的反对角线是指从右上角到左下角的元素集合。接下来，你可以看到一个\
  \ 5 × 5 方矩阵的示例，其反对角线用深色背景突出。\n\n![](img/00337.gif)\n\nN × N 数组的反对角线的任意元素都满足以下方程：\n\
  \n`i + j = N - 1`\n\n其中变量 `i` 和 `j` 分别对应行和列索引。如果你求解 `j`，方程变为：\n\n`j = N - i - 1`\n\
  \n使用这个公式，你可以为任何 `i` 值计算对应的 `j` 值。例如，在之前的 5 × 5 方数组中，当 `N` 等于 5，且 `i` 为 0，`j` 的值为：\n\
  \n`j = N - i - 1 ⟺ j = 5 – 0 – 1 ⟺ j = 4`\n\n利用所有这些知识，让我们编写对应的 Java 程序。\n\n```java\n\
  static final int N = 5;\npublic static void main(String[] args) {\n    int i, j;\n\
  \    double total;\n    double[][] a = new double[N][N];\n    for (i = 0; i <= N\
  \ - 1; i++) {\n        for (j = 0; j <= N - 1; j++) {\n            a[i][j] = Double.parseDouble(cin.nextLine());\n\
  \        }\n    }\n    // 计算和\n    total = 0;\n    for (i = 0; i <= N - 1; i++)\
  \ {\n        j = N - i - 1;\n        total += a[i][j];\n    }\n    System.out.println(\"\
  Sum = \" + total);\n}\n```\n\n![](img/00002.jpeg) 注意，负责寻找反对角线元素元素的循环直接遍历反对角线。\n\n\
  #### 练习 32.6-3 填充数组\n\n编写一个 Java 程序，创建并显示以下数组。\n\n![图像](img/00338.gif)\n\n#### 解决方案\n\
  \n\n\n\n如你所见，主对角线上的值为 `-1`。你已经知道方矩阵的主对角线是行索引等于列索引的元素集合。现在，你还需要找到所有包含值 `10` 的元素之间的一个共同特征，以及所有包含值\
  \ `20` 的元素之间的另一个共同特征。而实际上，这些特征是存在的！任何包含值 `10` 的元素的行索引总是大于其对应的列索引，同样，任何包含值 `20` 的元素的行索引总是小于其对应的列索引。\n\
  \n因此，Java 程序如下。\n\n![](img/00001.gif)\n\n```java\nstatic final int N = 5;\npublic\
  \ static void main(String[] args) {\n    int i, j;\n    int[][] a = new int[N][N];\n\
  \    for (i = 0; i <= N - 1; i++) {\n        for (j = 0; j <= N - 1; j++) {\n  \
  \          if (i == j) {\n                a[i][j] = -1;\n            } else if (i\
  \ > j) {\n                a[i][j] = 10;\n            } else {\n                a[i][j]\
  \ = 20;\n            }\n        }\n    }\n    for (i = 0; i <= N - 1; i++) {\n \
  \       for (j = 0; j <= N - 1; j++) {\n            System.out.print(a[i][j] + \"\
  \\t\");\n        }\n        System.out.println();\n    }\n}\n```\n\n### 32.7 复习题：判断对错\n\
