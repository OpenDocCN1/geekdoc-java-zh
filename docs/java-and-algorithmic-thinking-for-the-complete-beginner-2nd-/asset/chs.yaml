  \ - 1; i++) {\n            System.out.println(months[i] + \": \" + kwh[i]);\n  \
  \      }\n    }\n}\n```\n\n### 34.4-10 插入排序算法 – 一维数组排序\n\n编写一个代码片段，使用插入排序对数组进行升序排序。\n\
  \n#### 答案\n\n该算法实际执行的操作是逐个检查未排序的元素，并将每个元素插入到已排序元素中的相应位置。\n\n插入排序对于大规模数据效率低下，但对于小数组来说性能更好，类似于选择排序和冒泡排序。插入排序类似于你洗扑牌的方式：你从空手开始，最后你的手里将持有排好的牌。过程如下：你每次从桌上取一张牌，并将其插入手中的正确位置。例如，让我们尝试对以下数组。为了更好地理解这个例子，数组的前三个元素已经是排序好的。\n\
  \n![Image](img/0383.gif) 位置 `3` 处的 `8` 从数组中移除，其左侧元素向右移动。\n\n![Image](img/0384.gif)\
  \ 现在位置已释放，将 `8` 插入其中。数组变为：\n\n![Image](img/0385.gif) 位置 `4` 处的 `10` 从数组中移除，其左侧元素向右移动。数组变为：\n\
  \n![Image](img/0386.gif) 现在位置已释放，将 `10` 插入其中。数组变为：\n\n![Image](img/0387.gif) 位置\
  \ `5` 处的 `18` 从数组中移除，其左侧元素向右移动。数组变为：\n\n![Image](img/0388.gif) 现在位置已释放，将 `18` 插入其中。数组变为：\n\
  \n![Image](img/0389.gif) 位置 `6` 处的 `9` 从数组中移除，其左侧元素向右移动。数组变为：\n\n![Image](img/0390.gif)\
  \ 现在位置已释放，将 `9` 插入其中。这是过程的最后一步。算法结束，数组现在已经排序。\n\n![Image](img/0391.gif)\n\n\n\n\n\
  \n![](img/00002.jpeg)请注意，索引位置 `m` 处的元素实际上并没有从数组中删除，而是在执行向右移动时被覆盖了。这就是为什么在移动元素之前，需要将它的值保存在变量\
  \ `element` 中。\n\n![](img/00002.jpeg)如果你想对数组进行降序排序，你只需要将 `while` 语句的布尔表达式改为 `n >\
  \ 0 && a[n – 1] < element` 即可。\n\n![](img/00003.jpeg)与之前的排序算法一样，在 Java 中排序字母数字数据，你只需将布尔表达式\
  \ `n > 0 && a[n - 1] > element` 替换为表达式 `n > 0 && a[n - 1].compareTo(element) > 0`\
  \ 即可。\n\n### 练习 34.4-11 三最慢耗时\n\n十位赛车手在赛道上尽可能快地行驶。每辆赛车跑 20 圈，并记录每一圈相应的耗时（秒）。编写一个\
  \ Java 程序，提示用户输入每位车手的名称及其每圈的耗时。程序随后必须显示每位车手的名称以及他们最慢的三个耗时。使用插入排序算法。\n\n#### 解决方案\n\
  \n在本次练习中，你需要以下两个数组。\n\n![Image](img/00392.gif)\n\n在用户输入所有数据后，Java 程序必须对数组的每一行进行降序排序，但最后必须显示前三列。\n\
  \n使用“从内层到外层”的方法，下一个代码片段使用插入排序算法对二维数组 `elapsed_times` 的第一行（行索引 0）进行降序排序。假设变量 `i`\
  \ 的值为 0。\n\n```java\nfor (m = 1; m <= LAPS - 1; m++) {\n    element = elapsed_times[i][m];\n\
  \    n = m;\n    while (n > 0 && elapsed_times[i][n - 1] < element) {\n        elapsed_times[i][n]\
  \ = elapsed_times[i][n - 1];\n        n--;\n    }\n    elapsed_times[i][n] = element;\n\
  }\n```\n\n现在，为了对所有行进行排序，你需要将此代码片段嵌套在一个迭代所有行的 `for`-循环中，如下所示。\n\n```java\nfor (i\
  \ = 0; i <= CARS - 1; i++) {\n    for (m = 1; m <= LAPS - 1; m++) {\n        element\
  \ = elapsed_times[i][m];\n        n = m;\n        while (n > 0 && elapsed_times[i][n\
  \ - 1] < element) {\n            elapsed_times[i][n] = elapsed_times[i][n - 1];\n\
  \            n--;\n        }\n        elapsed_times[i][n] = element;\n    }\n}\n\
  ```\n\n现在，让我们关注给定的练习。最终的 Java 程序如下：\n\n![](img/00001.gif)\n```java\nClass_34_4_11\
  \ {\n    static final int CARS = 10;\n    static final int LAPS = 20;\n\n    public\
  \ static void main(String[] args) {\n        int i, j, m, n;\n        double element;\n\
  \        // 一次读取名称和耗时\n        String[] names = new String[CARS];\n        double[][]\
  \ elapsed_times = new double[CARS][LAPS];\n        for (i = 0; i <= CARS - 1; i++)\
  \ {\n            System.out.print(\"输入车手 No. \" + (i + 1) + \" 的名称: \");\n     \
  \       names[i] = cin.nextLine();\n            for (j = 0; j <= LAPS - 1; j++)\
  \ {\n                System.out.print(\"输入第 \" + (j + 1) + \" 圈的耗时: \");\n     \
  \           elapsed_times[i][j] = Double.parseDouble(cin.nextLine());\n        \
  \    }\n        }\n        // 排序数组\n        for (i = 0; i <= CARS - 1; i++) {\n\
  \            for (m = 1; m <= LAPS - 1; m++) {\n                element = elapsed_times[i][m];\n\
  \                n = m;\n                while (n > 0 && elapsed_times[i][n - 1]\
  \ < element) {\n                    elapsed_times[i][n] = elapsed_times[i][n - 1];\n\
  \                    n--;\n                }\n                elapsed_times[i][n]\
  \ = element;\n            }\n        }\n        // 显示最慢三个耗时\n        for (i = 0;\
  \ i <= CARS - 1; i++) {\n            System.out.println(names[i]);\n           \
  \ System.out.println(\"-------------------\");\n            for (j = 0; j < 3; j++)\
  \ {\n                System.out.println(elapsed_times[i][j]);\n            }\n \
  \       }\n    }\n}\n```\n\n### 34.5 数据结构中的搜索\n\n在计算机科学中，搜索算法是在数据结构中查找特定项。在搜索数据结构时，有两种情况：\n\
  \n- 你想在一个可能包含相同值的数据结构中搜索给定值，你需要找到所有匹配的索引。\n- 你想在一个每个值唯一的数据结构中搜索给定值，你只需要找到一个元素。\n\
  \n最常用的算法有：\n- 线性搜索（顺序查找）\n- 二分搜索\n\n#### 练习 34.5-1 在可能包含相同值的一维数组中进行线性搜索\n\n编写一个代码片段，在一维数组中搜索给定值。假设数组包含多个值。\n\
  \n解决方案\n\n线性（顺序查找）算法检查数组的第一个元素，然后是第二个，直到数组结束。由于这种逐个检查的过程非常缓慢，线性搜索适用于元素较少的数组。代码如下：\n\
  \n```java\nSystem.out.print(\"要搜索的值: \");\nneedle = cin.nextLine();\nfound = false;\n\
  for (i = 0; i <= ELEMENTS - 1; i++) {\n    if (haystack[i].equals(needle)) {\n \
  \       System.out.println(needle + \" 在位置: \" + i);\n        found = true;\n  \
  \  }\n}\nif (!found) {\n    System.out.println(\"未找到!\");\n}\n```\n\n#### 练习 34.5-2\
  \ 显示所有名字相同的姓\n\n编写一个 Java 程序，提示用户输入 20 个人的名字：名字在 `first_names` 数组中，姓在 `last_names`\
  \ 数组中。程序随后要求用户输入一个名字，据此搜索并显示所有该名字的姓。\n\n解决方案\n\n```java\nClass_34_5_2 {\n    static\
  \ final int PEOPLE = 20;\n\n    public static void main(String[] args) {\n     \
  \   int i;\n        String needle;\n        boolean found;\n        String[] first_names\
  \ = new String[PEOPLE];\n        String[] last_names = new String[PEOPLE];\n   \
  \     for (i = 0; i <= PEOPLE - 1; i++) {\n            System.out.print(\"输入名字:\
  \ \");\n            first_names[i] = cin.nextLine();\n            System.out.print(\"\
  输入姓: \");\n            last_names[i] = cin.nextLine();\n        }\n        // 获取要搜索的名字并转换为大写\n\
  \        System.out.print(\"要搜索的名字: \");\n        needle = cin.nextLine().toUpperCase();\n\
  \        // 在 first_names 数组中搜索值\n        found = false;\n        for (i = 0; i\
  \ <= PEOPLE - 1; i++) {\n            if (first_names[i].toUpperCase().equals(needle))\
  \ {\n                System.out.println(last_names[i]);\n                found =\
  \ true;\n            }\n        }\n        if (!found) {\n            System.out.println(\"\
  没有找到任何人!\");\n        }\n    }\n}\n```\n\n当你想要比较两个字符串以判断它们是否相等时，不能使用相等 ( == ) 比较运算符。Java\
  \ 为此目的引入了特殊的 `equals()` 方法。\n\n![](img/00003.jpeg)由于程序处理字母数字数据，需要 `toUpperCase()`\
  \ 方法以确保能够正确处理任何给定值。例如，如果“John”存在于 `first_names` 数组中，而用户想要搜索“JOHN”，`toUpperCase()`\
  \ 方法将确保程序能够找到所有的 John。\n\n#### 练习 34.5-3 在包含唯一值的一维数组中进行线性搜索\n\n\n\n\n\n编写一个代码片段，在一个一维数组中搜索给定的值。假设数组包含数值，且数组中的每个值都是唯一的。使用线性搜索算法。\n\
  \n#### 解决方案\n\n这种情况与之前的用例非常不同。由于数组中的每个值都是唯一的，当找到给定值时，没有必要无谓地一直迭代到数组末尾，从而浪费 CPU 时间。实际上有三种方法！让我们来分析它们吧！\n\
  \n## 第一种方法——使用 `break` 语句\n\n在这种方法中，当找到给定值时，使用 `break` 语句跳出 `for` 循环。解决方案如下。\n\n\
  ```java\nSystem.out.print(\"Enter a value to search: \");\nneedle = Double.parseDouble(cin.nextLine());\n\
  found = false;\nfor (i = 0; i <= ELEMENTS - 1; i++) {\n    if (haystack[i] == needle)\
  \ {\n        System.out.println(needle + \" found at position: \" + i);\n      \
  \  found = true;\n        break;\n    }\n}\nif (!found) {\n    System.out.println(\"\
  Nothing found!\");\n}\n```\n\n或者你也可以用稍微不同的方式实现相同的操作。\n\n```java\nSystem.out.print(\"\
  Enter a value to search: \");\nneedle = Double.parseDouble(cin.nextLine());\nindex_position\
  \ = -1;\nfor (i = 0; i <= ELEMENTS - 1; i++) {\n    if (haystack[i] == needle) {\n\
  \        index_position = i;\n        break;\n    }\n}\nif (index_position == -1)\
  \ {\n    System.out.println(\"Nothing found!\");\n} else {\n    System.out.println(needle\
  \ + \" found at position: \" + index_position);\n}\n```\n\n#### 第二种方法——使用标志位\n\n\
  `break` 语句并不是在所有的计算机语言中都存在；由于这本书的意图是教你“算法思维”（而不仅仅是只有 `Java` 支持的特殊语句），让我们看看另一种方法。\n\
  \n在下一个代码片段中，当在数组 `haystack` 中找到给定值时，变量 `found` 将强制程序执行流立即退出循环。\n\n```java\nSystem.out.print(\"\
  Enter a value to search: \");\nneedle = Double.parseDouble(cin.nextLine());\nfound\
  \ = false;\ni = 0;\nwhile (i <= ELEMENTS - 1 && !found) {\n    if (haystack[i] ==\
  \ needle) {\n        found = true;\n        index_position = i;\n    }\n    i++;\n\
  }\nif (!found) {\n    System.out.println(\"Nothing found!\");\n} else {\n    System.out.println(needle\
  \ + \" found at position: \" + index_position);\n}\n```\n\n## 第三种方法——仅使用预测试循环结构\n\
  \n这种方法可能是效率最高的一种。此外，它的工作方式非常易于理解，因此不需要任何解释。代码片段如下。\n\n```java\nSystem.out.print(\"\
  Enter a value to search: \");\nneedle = Double.parseDouble(cin.nextLine());\ni =\
  \ 0;\nwhile (i < ELEMENTS - 1 && haystack[i] != needle) {\n    i++;\n}\nif (haystack[i]\
  \ != needle) {\n    System.out.println(\"Nothing found!\");\n} else {\n    System.out.println(needle\
  \ + \" found at position: \" + i);\n}\n```\n\n## 练习 34.5-4 搜索给定的社会安全号\n\n在美国，社会安全号（`SSN`）是一个九位数的身份标识，适用于所有美国公民，以便出于社会安全之目的识别他们。编写一个\
  \ `Java` 程序，提示用户输入 100 个人的 `SSN` 以及姓和名氏。然后程序必须要求用户输入一个 `SSN`，程序将搜索并显示持有该 `SSN` 的人的姓和名氏。\n\
  \n#### 解决方案\n\n在美国，不存在两个或更多人拥有相同 `SSN` 的可能性。因此，尽管练习的表述不是非常清楚，但存储 `SSNs` 的数组中的每个值都是唯一的！\n\
  \n根据你目前所学的所有知识，该练习的解决方案如下。\n\n![](img/00001.gif)\n\n```java\nstatic final int PEOPLE\
  \ = 100;\npublic static void main(String[] args) {\n    int i;\n    String needle;\n\
  \    String[] SSNs = new String[PEOPLE];\n    String[] first_names = new String[PEOPLE];\n\
  \    String[] last_names = new String[PEOPLE];\n    for (i = 0; i <= PEOPLE - 1;\
  \ i++) {\n        System.out.print(\"Enter SSN: \");\n        SSNs[i] = cin.nextLine();\n\
  \        System.out.print(\"Enter first name: \");\n        first_names[i] = cin.nextLine();\n\
