  ![Image](img/00287.gif)\n\n## 第 30 章 循环结构的练习\n\n### 30.1 循环结构的简单练习\n\n#### 练习 30.1-1\
  \ 根据大小进行计数\n\n编写一个 Java 程序，提示用户输入 10 对数字，然后计数并显示第一个数字大于第二个数字的次数，以及第二个数字大于第一个数字的次数。\n\
  \n#### 答案\n\nJava 程序如下所示。它使用变量 `count_a` 来计数第一个数字大于第二个数字的次数，使用变量 `count_b` 来计数第二个数字大于第一个数字的次数。\n\
  \n![](img/00001.gif)\n```java\nClass_30_1_1\npublic static void main(String[] args)\
  \ {\n    int count_a, count_b, i, a, b;\n    count_a = 0;\n    count_b = 0;\n  \
  \  for (i = 1; i <= 10; i++) {\n        System.out.print(\"Enter number A: \");\n\
  \        a = Integer.parseInt(cin.nextLine());\n        System.out.print(\"Enter\
  \ number B: \");\n        b = Integer.parseInt(cin.nextLine());\n        if (a >\
  \ b) {\n            count_a++;\n        } else if (b > a) {\n            count_b++;\n\
  \        }\n    }\n    System.out.println(count_a + \"  \" + count_b);\n}\n```\n\
  \n有人可能会提出的合理问题是：“为什么要使用多路控制结构？为什么不使用双二选决策结构呢？”\n\n\n\n\n假设使用了如下双重备一决策结构：\n\n```\n\
  if (a > b) {count_a++;}else {count_b++;}\n```\n\n在这个决策控制结构中，当变量 `b` 大于变量 `a` 时，变量\
  \ `count_b` 会递增（这是符合要求的），但当变量 `b` 等于变量 `a` 时，它也会递增（这是不符合要求的）。使用多重决策控制结构可以确保变量 `count_b`\
  \ 仅在变量 `b` 大于 `a`（而不是等于 `a`）时才递增。\n\n### 练习 30.1-2 根据位数计数数字\n\n编写一个 Java 程序，提示用户输入\
  \ 20 个整数，然后统计并显示一位、两位和三位整数的总数。假设用户输入的是 1 到 999 之间的值。\n\n#### 解决方案\n\n利用练习 18.1-2\
  \ 中的知识，Java 程序如下。\n\n![](img/00001.gif) `Class_30_1_2`\n```\npublic static void\
  \ main(String[] args) {\n    int count1, count2, count3, i, a;\n    count1 = count2\
  \ = count3 = 0;\n    for (i = 1; i <= 20; i++) {\n        System.out.print(\"Enter\
  \ a number: \");\n        a = Integer.parseInt(cin.nextLine());\n        if (a <=\
  \ 9) {\n            count1++;\n        } else if (a <= 99) {\n            count2++;\n\
  \        } else {\n            count3++;\n        }\n    }\n    System.out.println(count1\
  \ + \"  \" + count2 + \"  \" + count3);\n}\n```\n\n### 练习 30.1-3 总和中包含多少数字\n\n编写一个\
  \ Java 程序，让用户重复输入数值，直到它们的和超过 1000。在最后，程序必须显示输入的数字总数。\n\n#### 解决方案\n\n在这种情况下，你不知道确切的迭代次数，因此无法使用\
  \ `for` 循环。让我们改用 `while` 循环，但为了确保程序没有逻辑错误，你应该遵循第 28.3 段 中讨论的“终极”规则。根据该规则，预测试循环结构的通用形式如下：\n\
  \n```\nInitialize total\nwhile (total <= 1000) {\n    A statement or block of statements\n\
  \    Update/alter total\n}\n```\n\n![](img/00002.jpeg) 由于循环的布尔表达式依赖于变量 `total`，因此该变量必须在循环开始前初始化，并在循环内部进行更新（更改）。具体来说，更新/更改变量\
  \ `total` 的语句必须是循环的最后一条语句。\n\n随后，Java 程序变为：\n\n![](img/00001.gif) `Class_30_1_3`\n\
  ```\npublic static void main(String[] args) {\n    int count;\n    double total,\
  \ x;\n    count = 0;\n    total = 0; // 初始化 total\n    while (total <= 1000) { //\
  \ 依赖于 total 的布尔表达式\n        x = Double.parseDouble(cin.nextLine());\n        count++;\n\
  \        total += x; // 更新/更改 total\n    }\n    System.out.println(count);\n}\n\
  ```\n\n### 练习 30.1-4 查找正整数的总数\n\n编写一个 Java 程序，提示用户重复输入整数值，直到输入实数为止。在最后，程序必须显示输入的正整数总数。\n\
  \n#### 解决方案\n\n同样，你不知道确切的迭代次数，因此无法使用 `for` 循环。\n\n根据“终极”规则，预测试循环结构的通用形式如下：\n\n```\n\
  System.out.print(\"Enter a number: \");\nx = Double.parseDouble(cin.nextLine());\
  \ // 初始化 x\nwhile ((int)(x) == x ) { // 依赖于 x 的布尔表达式\n    A statement or block of\
  \ statements\n    System.out.print(\"Enter a number: \");\n    x = Double.parseDouble(cin.nextLine());\
  \ // 更新/更改 x\n}\n```\n\n最终的 Java 程序如下：\n\n![](img/00001.gif) `Class_30_1_4`\n```\n\
