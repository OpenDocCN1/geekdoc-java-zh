  \ 0 开始计数并使用偏移量 +1，不如从 1 开始计数并使用偏移量 +2。这种修改减少了迭代次数。修改后的 Java 程序如下。\n\n![](img/00001.gif)\
  \ Class_31_7_5b\n```java\nstatic final int ELEMENTS = 8;\npublic static void main(String[]\
  \ args) {\n    int i;\n    double[] a = new double[ELEMENTS];\n    for (i = 0; i\
