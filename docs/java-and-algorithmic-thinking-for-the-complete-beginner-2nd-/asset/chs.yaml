  \    System.out.println(\"He or she is \" + ages[index_of_max] + \" years old!\"\
  );\n}\n```\n\n#### 练习 38.2-2 使用子程序对数组\n\n执行以下操作：\n\ni. 编写一个名为 `my_swap` 的子程序，通过其形式参数列表接收数组以及两个索引。该子程序交换相应索引位置上元素的值。\n\
  ii. 使用上述子程序 `my_swap()`，编写一个名为 `my_sort` 的子程序，通过其形式参数列表接收数组，然后使用冒泡排序对数组进行排序。它必须能够按升序或降序进行排序。为了实现这一点，请在形式参数列表中包含一个布尔变量。\n\
  iii. 编写一个名为 `display_array` 的子程序，通过其形式参数列表接收一个数组并显示它。\niv. 使用上述子程序 `my_sort()` 和\
  \ `display_array()`，编写一个 Java 程序，提示用户输入 20 个人的名字，然后显示两次：一次升序排序，另一次降序排序。\n\n####\
  \ 解决方案\n\n如底部的 Java 程序所示，`void` 方法 `my_sort()` 使用了改进版的冒泡排序算法。当将值 `true` 传递给参数 `ascending`\
  \ 时，算法对数组 `a` 进行升序排序。当传递值 `false` 时，算法对数组 `a` 进行降序排序。\n\n此外，当两个元素的内容之间需要交换时，`void`\
  \ 方法 `my_sort()` 会调用 `void` 方法 `my_swap()`。\n\n![](img/00001.gif)\n\n```java\nClass_38_2_2\n\
  static final int PEOPLE = 20;\nstatic void my_swap(String[] a, int index1, int index2)\
  \ {\n    String temp;\n    temp = a[index1];\n    a[index1] = a[index2];\n    a[index2]\
  \ = temp;\n}\nstatic void my_sort(String[] a, boolean ascending) {\n    int m, n;\n\
  \    for (m = 1; m <= PEOPLE - 1; m++) {\n        for (n = PEOPLE - 1; n >= m; n--)\
  \ {\n            if (ascending) {\n                if (a[n].compareTo(a[n - 1])\
  \ < 0) {\n                    my_swap(a, n, n - 1);\n                }\n       \
  \     } else {\n                if (a[n].compareTo(a[n - 1]) > 0) {\n          \
  \          my_swap(a, n, n - 1);\n                }\n            }\n        }\n\
  \    }\n}\nstatic void display_array(String[] a) {\n    int i;\n    for (i = 0;\
  \ i <= PEOPLE - 1; i++) {\n        System.out.println(a[i]);\n    }\n}\npublic static\
  \ void main(String[] args) {\n    int i;\n    String[] names = new String[PEOPLE];\n\
  \    for (i = 0; i <= PEOPLE - 1; i++) {\n        System.out.print(\"Enter name:\
  \ \");\n        names[i] = cin.nextLine();\n    }\n    my_sort(names, true);\n \
  \   display_array(names);\n    my_sort(names, false);\n    display_array(names);\n\
  }\n```\n\n#### 练习 38.2-3 阶梯电费\n\n电力公司根据下表向用户收取用电费：\n\n| 千瓦时 (kWh) | 每 kWh 费用 |\n\
