  \ 程序，提示用户输入 kWh，然后计算并显示总金额。请注意电价是阶梯的。\n\n#### 解决方案\n\n阶梯电价意味着当客户消耗例如 2200 kWh 时，并不是所有的千瓦时都按\
  \ $0.40 收费。前 `500` kWh 按 $0.10 收费，接下来的 `1500` kWh 按 $0.25 收费，最后的 `200` kWh 按 $0.40\
  \ 收费。因此，客户必须支付 500 × $0.10 + 1500 × $0.25 + 200 × $0.40 = $505\n\n相同的逻辑可以计算客户消耗例如\
  \ 4800 kWh 时的总金额。前 `500` kWh 按 $0.10 收费，接下来的 `1500` kWh 按 $0.25 收费，下一个 `2500` kWh\
  \ 按 $0.40 收费，最后的 `300` kWh 按 $0.60 收费。因此，客户必须支付 500 × $0.10 + 1500 × $0.25 + 2500\
  \ × $0.40 + 300 × $0.60 = $1605\n\n以下图表可以帮助你完全理解当电价为阶梯时如何计算总金额。\n\n![Image](img/00234.gif)\n\
