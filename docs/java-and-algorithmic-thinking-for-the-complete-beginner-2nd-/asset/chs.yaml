  \ 30 天。\n\n# 第 11 章\n## 数字处理\n\n### 11.1 引言\n\n与每种高级编程语言一样，Java 提供了许多现成可子程序（称为方法），你可以在随时随地的地方使用它们。\n\
  \n![](img/00002.jpeg) “子程序”仅仅是一组封装成单个单元的语句。每个子程序都有一个描述性的名称并执行一个特定的任务。\n\n为了更好地理解\
  \ Java 的方法，让我们看看用于计算正数平方根的海伦迭代公式。\n\n```\n![Image](img/00114.gif)\n```\n\n其中\n\n\
  ► `y` 是你想要寻找平方根的数字\n► `x[n]` 是 `y` 的平方根的第 n 次迭代值\n\n嘿，不要失望！现在没有人用这种方法来计算数字的平方根了。幸运的是，Java\
  \ 包含一个为此目的的方法！这个方法实际上是一个小的子程序，被命名为 `Math.sqrt`，你所做的就是通过它的名称调用它，它就会为你完成工作。`Math.sqrt`\
  \ 方法可能使用了海伦迭代公式，也可能是其他古代或现代数学家的公式。事实是，你并不在乎！真正重要的是 `Math.sqrt` 给你提供了正确的结果！示例所示。\n\
  \n```\nx = Double.parseDouble(cin.nextLine());\ny = Math.sqrt(x);\nSystem.out.println(y);\n\
  ```\n\n尽管 Java 支持许多数学子程序（方法），但本章只涵盖了本书目的绝对需要的方法。然而，如果你需要更多信息，可以访问：\n\n[`docs.oracle.com/javase/8/docs/api/java/lang/Math.html`](https://docs.oracle.com/javase/8/docs/api/java/lang/Math.html)\n\
  \n![](img/00002.jpeg) 当你需要计算平方根、正弦、余弦、绝对值等时候就会使用数学方法。\n\n### 11.2 有用的方法（子程序）\n\n\
  #### 绝对值\n`Math.abs(number)` 此方法返回 `number` 的绝对值。\n\n示例：\n```\n![Image](img/00001.gif)\n\
  ```\n```java\nint a, b;\na = -5;\nb = Math.abs(a);\nSystem.out.println(b); // 显示\
  \ 5\n```\n\n#### 圆周率\n`Math.PI` 返回 π 的值。\n\n```\n![Image](img/00002.jpeg)\n```\n\
  注意 `Math.PI` 是一个常量，而不是方法。这就是为什么没有使用括号。\n\n示例：\n```\n![Image](img/00001.gif)\n```\n\
  ```java\nSystem.out.println(Math.PI); // 显示 3.141592653589793\n```\n\n#### 正弦\n\
  `Math.sin(number)` 此方法返回 `number` 的正弦。`number` 必须以弧度表示。你可以乘以 `Math.PI/180` 来转换为角度。\n\
  \n示例：\n```\n![Image](img/00001.gif)\n```\n```java\ndouble a, b;\na = Math.sin(3\
  \ * Math.PI / 2); // 3π/2 弧度\nb = Math.sin(270 * Math.PI / 180); // 270 度\nSystem.out.println(a\
  \ + \" \" + b); // 显示 -1.0 -1.0\n```\n\n#### 余弦\n`Math.cos(number)` 此方法返回 `number`\
  \ 的余弦。`number` 必须以弧度表示。你可以乘以 `Math.PI/180` 来转换为角度。\n\n示例：\n```\n![Image](img/00001.gif)\n\
  ```\n```java\ndouble a, b;\na = Math.cos(2 * Math.PI); // 2π 弧度\nb = Math.cos(360\
  \ * Math.PI / 180); // 360 度\nSystem.out.println(a + \" \" + b); // 显示 1.0 1.0\n\
  ```\n\n#### 正切\n`Math.tan(number)` 此方法返回 `number` 的正切。`number` 必须以弧度表示。你可以乘以 `Math.PI/180`\
  \ 来转换为角度。\n\n示例：\n```\n![Image](img/00001.gif)\n```\n```java\ndouble a;\na = Math.tan(10\
  \ * Math.PI / 180); // 10 度\nSystem.out.println(a); // 显示 0.17632698070846498\n\
  ```\n\n#### 字符串转整数\n`Integer.parseInt(value)` 此方法将整数的字符串表示转换为数值。\n\n示例：\n```\n!![Image](img/00001.gif)\n\
  ```\n```java\nString s1 = \"5\";\nString s2 = \"3\";\nint k;\nk = Integer.parseInt(s1);\n\
  System.out.println(k); // 显示 5\nSystem.out.println(Integer.parseInt(s2)); // 显示\
  \ 3\nSystem.out.println(s1 + s2); // 显示 53\nSystem.out.println(Integer.parseInt(s1)\
  \ + Integer.parseInt(s2)); // 显示 8\n```\n\n#### 字符串转实数\n`Double.parseDouble(value)`\
  \ 此方法将实数的字符串表示转换为数值。\n\n\n\n\n\n![](img/00001.gif)\n```java\nClass_11_2\npublic\
  \ static void main(String[] args) {\n    String s1 = \"6.5\";\n    String s2 = \"\
  3.4\";\n    double x;\n    x = Double.parseDouble(s1);\n    System.out.println(x);\
  \ //It displays: 6.5\n    System.out.println(Double.parseDouble(s2)); //It displays:\
  \ 3.4\n    System.out.println(s1 + s2); //It displays: 6.53.4\n    System.out.println(Double.parseDouble(s1)\
  \ + Double.parseDouble(s2)); //It displays: 9.9\n}\n```\n\n## 整数（类型转换）\n\n`(int)number`\n\
  \n这返回 `number` 的整数值。\n\n#### 示例\n\n![](img/00001.gif)\n```java\nClass_11_2h\npublic\
  \ static void main(String[] args) {\n    double a = 5.4;\n    System.out.println((int)a);\
  \ //It displays: 5\n    System.out.println((int)34); //It displays: 34\n    System.out.println((int)34.9);\
  \ //It displays: 34\n    System.out.println((int)-34.999); //It displays: -34\n\
  }\n```\n\n![](img/00002.jpeg) 在计算机科学中，类型转换是将一种数据类型的变量转换为另一种数据类型的方法。注意 `(int)` 并不是一个方法。它只是\
  \ Java 中将实数转换为整数的方法。还要注意，如果实数包含小数部分，该部分在转换过程中将会丢失。\n\n## 实数（类型转换）\n\n`(double)number`\n\
  \n这以实数形式返回数字。\n\n#### 示例\n\n![](img/00001.gif)\n```java\nClass_11_2i\npublic static\
  \ void main(String[] args) {\n    int a = 5;\n    System.out.println((double)a);\
  \ //It displays: 5.0\n    System.out.println((double)34); //It displays: 34.0\n\
  \    System.out.println((double)-34); //It displays: -34.0\n    System.out.println(a\
  \ / 2); //It displays: 2\n    System.out.println((double)a / 2); //It displays:\
  \ 2.5\n}\n```\n\n![](img/00002.jpeg) 在计算机科学中，类型转换是将一种数据类型的变量转换为另一种数据类型的方法。注意 `(double)`\
  \ 并不是一个方法。它只是 Java 中将整数转换为实数的方法。\n\n![](img/00002.jpeg) 在 Java 中，两个整数除的结果总是整数。因此，在表达式\
  \ `a / 2` 中，由于变量 `a` 和数字 `2` 都是整数，结果始终是整数。如最后一句所示，如果你希望结果是实数类型，需要在至少一个操作数前面添加 `(double)`\
  \ 转换运算符。\n\n此外，语句\n\n```java\nSystem.out.println((double)a / 2);\n```\n等同于\n\n```java\n\
  System.out.println(a / (double)2);\n```\n等同于\n\n```java\nSystem.out.println((double)a\
  \ / (double)2);\n```\n当然也等同\n\n```java\nSystem.out.println(a / 2.0);\n```\n它们都输出值\
  \ `2.5`。\n\n## 幂\n\n`Math.pow(number, exp)`\n\n该方法返回 `number` 的 `exp` 次幂的结果。\n\n\
  #### 示例\n\n![](img/00001.gif)\n```java\nClass_11_2j\npublic static void main(String[]\
  \ args) {\n    double a, b, c;\n    a = 2;\n    b = 3;\n    System.out.println(Math.pow(a,\
  \ b)); //It displays: 8.0\n    c = Math.pow(3, 2);\n    System.out.println(c); //It\
  \ displays: 9.0\n}\n```\n\n![](img/00002.jpeg) 方法 `Math.pow()` 也可以计算数字的平方根。从数学上知道\
  \ ![Image](img/00115.gif)。因此，你可以写 `y = Math.pow(x, 1 / 2)` 来计算 `x` 的平方根，或者你甚至写 `y\
  \ = Math.pow(x, 1 / 3)` 来计算 `x` 的立方根，依此类推！\n\n## 随机数\n\n`Math.random()`\n\n该方法返回范围在\
  \ `0, 1)` 内的伪随机数（实数）。\n\n![ 注意该范围不包含 `1`。如果你想在最小和最大值之间获取一个随机整数，可以使用以下公式`minimum\
  \ + (int)(Math.random() * (maximum - minimum + 1))`### 示例![](img/00001.gif)\n```java\n\
  Class_11_2k\npublic static void main(String[] args) {\n    // 在 0, 1) 范围内显示一个随机双\n\
  \    System.out.println(Math.random());\n    // 在 2 到 10 之间显示一个随机整数\n    System.out.println(2\
  \ + (int)(Math.random() * (10 - 2)));\n    // 在 20 到 25 之间显示一个随机整数\n    System.out.println(20\
  \ + (int)(Math.random() * 6));\n}\n```\n\n![ 随机数被广泛用于游戏。例如，“敌人”可能会随机时间出现或随机方向移动。此外，随机数也用于模拟程序、统计程序、计算机加密等。##\
  \ 四舍五入`Math.round(number)`该方法返回 `number` 最接近的整数。### 示例![](img/00001.gif)\n```java\n\
  Class_11_2l\npublic static void main(String[] args) {\n    double a = 5.9;\n   \
  \ System.out.println(Math.round(a)); //It displays: 6\n    System.out.println(Math.round(5.4));\
  \ //It displays: 5\n}\n```\n如果你需要指定精度的 `number` Round 入值，可以使用以下公式：\n\n`Math.round(number\
  \ * Math.pow(10, precision)) / Math.pow(10, precision)`\n\n#### 示例\n\n![](img/00001.gif)\n\
  ```java\nClass_11_2m\npublic static void main(String[] args) {\n    double a, y;\n\
  \    a = 5.312;\n    y = Math.round(a * Math.pow(10, 2)) / Math.pow(10, 2); //It\
  \ displays: 5.31\n    a = 5.315;\n    y = Math.round(a * Math.pow(10, 2)) / Math.pow(10,\
  \ 2); //It displays: 5.32\n    // 显示 2.345\n    System.out.println(Math.round(2.3447\
  \ * 1000) / 1000);\n}\n```\n\n## 平方根\n\n`Math.sqrt(number)`\n\n该方法返回 `number` 的平方根。\n\
  \n#### 示例\n\n![](img/00001.gif)\n```java\nClass_11_2n\npublic static void main(String[]\
