  \        answer = cin.nextLine();\n        } while (!answer.equals(\"Y\") && !answer.equals(\"\
  N\") && !answer.equals(\"S\"));\n        if (answer.equals(\"Y\")) {\n         \
  \   total_yes++;\n        }\n        if (answer.equals(\"N\") && gender.equals(\"\
  F\")) {\n            female_no++;\n        }\n    }\n    System.out.println(total_yes\
  \ + \"  \" + (double)female_no / total_yes * 100);\n}\n```\n\n## 练习 30.6-4 消息是回文吗？\n\
  \n回文是指正反读都相同的单词或句子。编写一个 Java 程序，提示用户输入一个单词或句子，然后显示该单词或句子是否为回文。以下是一些回文消息：\n\n-  \
  \ Anna\n-   A nut for tuna\n-   Dennis and sinned\n-   Murder for red rum\n-   Borrow\
  \ or rob?\n-   Are we not drawn onward, we?\n\n#### 解决方案\n\n你这里需要记住的是，在开始比较字母之前，单词或句子中的有些字母是大写，有些是小写。例如，句子“A\
  \ nut for tuna”，虽然首尾字母相同，但它们并不相等。因此，程序必须首先将所有字母转换为小写，然后就可以开始比较了。记住，循环只需要迭代一半的字母。你能猜出为什么吗？程序开始迭代并比较第\
  \ 0 位置和第 10 位置的字母。然后比较第 1 个位置和第 9 位置的字母，以此类推。最后一次迭代应该是比较第 4 和第 6 位置的字母。之后继续迭代没有意义，因为所有的字母都比较过了。解决这个问题有许多方法。下面给出了一些方案。程序中的注释可以帮助你完全理解它们的运行方式。然而，如果你对它们的运行方式仍有疑问，仍然可以使用\
  \ Eclipse 逐步执行，并观察每次步骤中变量的值。\n\n#### 第一种方法\n\n解决方案如下。\n\n![](img/00001.gif)\n```java\n\
  Class_30_6_4\npublic static void main(String[] args) {\n    int i, middle_pos, j;\n\
  \    String message, message_clean, letter, left_letter, right_letter;\n    boolean\
  \ palindrome;\n    System.out.print(\"Enter a message: \");\n    message = cin.nextLine().toLowerCase();\n\
  \    // 创建一个包含除了空格、逗号、句号和问号以外字符的新字符串\n    message_clean = \"\";\n    for (i = 0;\
  \ i <= message.length() - 1; i++) {\n        letter = \"\" + message.charAt(i);\n\
  \        if (!letter.equals(\"  \") && !letter.equals(\",\") &&\n            !letter.equals(\"\
  .\") && !letter.equals(\"?\")) {\n            message_clean += letter;\n       \
  \ }\n    }\n}\n```\n\n\n\n\n```java\n// 这是 message_clean 的最后一个位置\nmessage_cleanj\
  \ = message_clean.length() - 1;\n// 这是 message_clean 的中间位置\nmiddle_pos = (int)(j\
  \ / 2);\n// 在开始时，假设句子是回文\npalindrome = true;\n// 这个 for 循环逐个比较字母。\nfor (i = 0; i\
  \ <= middle_pos; i++) {\n    left_letter = \"\" + message_clean.charAt(i);\n   \
  \ right_letter = \"\" + message_clean.charAt(j);\n    // 如果至少有一对字母的验证未通过，则将变量 palindrome\
  \ 设为 false\n    if (!left_letter.equals(right_letter)) {\n        palindrome = false;\n\
  \    }\n    j--;\n}\n// 如果变量 palindrome 仍然为 true\nif (palindrome) {\n    System.out.println(\"\
  The message is palindrome\");\n}\n```\n\n#### 第二种方法\n\n之前的方法可以运行，但假设用户输入了一个非常长且不是回文的句子。例如，第二个字母和最后一个不同。遗憾的是，在之前的方法中，尽管变量\
  \ `palindrome` 从第二次迭代开始就被设为 false，但最后一个 `for` 循环仍会迭代到句子的中间。所以，让我们尝试让这个程序变得更好。正如你所知道的，你可以使用\
  \ `break` 语句在循环完成所有迭代之前跳出循环。\n\n此外，由于只有四种不同的字符需要被删除（空格、逗号、句号和问号），你只需要链调用四个 `replace()`\
  \ 方法，就可以避免第一个循环，如下面的 Java 程序所示。\n\n![](img/00001.gif)\n\n```java\nclass Class_30_6_4b\n\
  public static void main(String[] args) {\n    int i, middle_pos, j;\n    String\
  \ message, message_clean, left_letter, right_letter;\n    boolean palindrome;\n\
  \    System.out.print(\"Enter a message: \");\n    message = cin.nextLine().toLowerCase();\n\
  \    // 创建一个新字符串，包含除空格、逗号、句号和问号以外的所有字符\n    message_clean = message.replace(\" \
  \ \", \"\").replace(\",\", \"\").replace(\".\", \"\").replace(\"?\", \"\");\n  \
  \  j = message_clean.length() - 1;\n    middle_pos = (int)(j / 2);\n    palindrome\
  \ = true;\n    for (i = 0; i <= middle_pos; i++) {\n        left_letter = \"\" +\
  \ message_clean.charAt(i);\n        right_letter = \"\" + message_clean.charAt(j);\n\
  \        if (!left_letter.equals(right_letter)) {\n            palindrome = false;\n\
  \            break;\n        }\n        j--;\n    }\n    if (palindrome) {\n   \
  \     System.out.println(\"The message is palindrome\");\n    }\n}\n```\n\n![](img/00002.jpeg)\
  \ 显而易见，一个问题可以有很多解决方案。找到最优解取决于你！\n\n### 30.7 复习题：判断对错\n\n请对以下每个陈述判断对或错。\n\n1. 数据验证是限制数据输入的过程，强制用户只输入有效值。\n\
  2. 你可以使用 `for-loop` 来验证数据输入。\n3. 你可以使用任何循环控制结构来验证数据输入。\n4. 为了强制用户只输入正数且不显示任何错误信息，可以使用以下代码片段：\n\
  ```java\ndo {\n   System.out.print(\"Enter a positive number: \");\n   x = Double.parseDouble(cin.nextLine());\n\
  } while (x <= 0);\n```\n5. 为了强制用户输入 1 到 10 之间的数字，可以使用以下代码片段：\n```java\nSystem.out.print(\"\
  Enter a number between 1 and 10: \");\nx = Double.parseDouble(cin.nextLine());\n\
  while (x >= 1 && x <= 10) {\n    System.out.println(\"Wrong number\");\n    System.out.print(\"\
  Enter a number between 1 and 10: \");\n    x = Double.parseDouble(cin.nextLine());\n\
  }\n```\n6. 当用 Java 程序寻找给定 10 个值中的最大值时，使用的循环控制结构必须始终迭代 9 次。\n7. 为了在给定的 10 个数中找到最小数，可以使用以下代码片段：\n\
  ```java\nminimum = 0;\nfor (i = 1; i <= 10; i++) {\n    w = Double.parseDouble(cin.nextLine());\n\
  \    if (w < minimum) {\n        minimum = w;\n    }\n}\n```\n8. 为了在给定的 10 个数中找到最大的数，可以使用以下代码片段：\n\
  ```java\nmaximum = 0;\nfor (i = 1; i <= 10; i++) {\n    w = Double.parseDouble(cin.nextLine());\n\
  \    if (w > maximum) {\n        maximum = w;\n    }\n}\n```\n9. 为了在给定的 10 个正数中找到最大的数，可以使用以下代码片段：\n\
