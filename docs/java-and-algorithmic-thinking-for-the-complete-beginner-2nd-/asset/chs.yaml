  28th of October\");\n        h2.events[0] = \"969: Byzantine troops occupy Antioch\"\
  ;\n        h2.events[1] = \"1940: Ohi Day in Greece\";\n        System.out.println(h1.day);\n\
  \        System.out.println(h1.events[0]);\n        System.out.println(h1.events[1]);\n\
