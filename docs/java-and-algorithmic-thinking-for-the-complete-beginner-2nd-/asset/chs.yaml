  提示：尝试使用三个嵌套的 for 循环显示单词。\n\n# 第 33 章数组的技巧\n\n### 33.1 引言\n\n由于数组的处理使用了你在之前的章节中学过的相同顺序、判断和循环控制结构，因此这里没有必要重复这些信息。然而，你将在本章中发现的是如何单独处理二维数组的每一行或每一列，如何解决需要使用多个数组的问题，如何从一维数组创建二维数组（反之亦然），以及\
  \ Java 支持的一些实用内置数组方法。\n\n### 33.2 单独处理每一行\n\n单独处理每一行意味着每一行都被分开处理，并且每一行的结果（可以是和、平均值等）可以被单独用于后续处理。\n\
  \n假设你有以下 $4 \\times 5$ 数组。\n![Image](img/00342.gif)\n\n让我们尝试单独找到每一行的和。以下四种方法中的每种都在遍历。\n\
  \n#### 第一种——创建辅助数组\n\n在这种方法中，程序单独处理每一行，并创建一个辅助数组，其中每个元素存储一行的和。这种方法为你提供了更大的灵活性，因为你可以在程序的后续部分可以使用新数组。辅助数组\
  \ `total` 所示所示。\n![Image](img/00343.gif)\n\n现在，让我们编写相应的代码段。为了更容易理解该过程，使用了“从内向外”的方法。以下代码段计算第一行（行索引\
  \ 0）的和，并将其存储在辅助数组 `total` 的位置 0 中。假设变量 `i` 包含值 0。\n\n```java\ns = 0;\nfor (j = 0;\
  \ j <= COLUMNS - 1; j++) {\n    s += b[i][j];\n}\ntotal[i] = s;\n```\n\n该代码段可以等效地写为：\n\
  \n```java\ntotal[i] = 0;\nfor (j = 0; j <= COLUMNS - 1; j++) {\n    total[i] +=\
  \ b[i][j];\n}\n```\n\n现在，将此代码段嵌套在一个遍历所有行的 for 循环中，会导致结果。\n\n```java\nfor (i = 0;\
  \ i <= ROWS - 1; i++) {\n    total[i] = 0;\n    for (j = 0; j <= COLUMNS - 1; j++)\
  \ {\n        total[i] += b[i][j];\n    }\n}\n```\n\n#### 第二种——直接查找并处理。\n\n\n\n\n\
  - 这种方法不使用辅助数组；它只是计算并直接处理总和。代码段如下。\n\n```java\nfor (i = 0; i <= ROWS - 1; i++) {\n\
  \    total = 0;\n    for (j = 0; j <= COLUMNS - 1; j++) {\n        total += b[i][j];\n\
  \    }\n    process total;\n}\n```\n\n`process total` 是什么意思？这取决于给定的问题。它可能只是显示总和，可能计算每一行的平均值并显示，也可能使用总和来计算更复杂的数学表达式。\n\
  \n例如，下面的示例计算并显示了数组 `b` 每一行的平均值。\n\n```java\nfor (i = 0; i <= ROWS - 1; i++) {\n\
  \    total = 0;\n    for (j = 0; j <= COLUMNS - 1; j++) {\n        total += b[i][j];\n\
  \    }\n    average = total / COLUMNS;\n    System.out.println(average);\n}\n```\n\
