  \n#### 练习 33.4-1 找出两个成绩的平均值\n\n有 20 个学生，每人都收到了两门课程的成绩。编写一个 Java 程序，提示用户输入每个学生在所有课程中的姓名和成绩。然后计算并显示所有平均分大于\
