  \n等待，如果你这样做是因为 `j` 从 1 开始，那么整个索引为 0 的列将不会被检查！\n\n### 练习 34.3-6 寻找最冷的城市\n\n编写一个 Java\
  \ 程序，让用户输入 10 个不同城市 1 月的温度（华氏度）。程序必须显示温度最低的城市名称以及记录的日期。\n\n### 练习 34.3-7 寻找每行的最小值和最大值\n\
  \n编写一个 Java 程序，让用户在一个 20 × 30 的数组中输入值，然后寻找并显示每一行的最小值和最大值。\n\n\n\n\n实际上，有两种方法。第一种方法创建两个辅助的一维数组\
  \ `minimum` 和 `maximum`，然后将它们显示出来。数组 `minimum` 和 `maximum` 在每个位置将分别包含每行的最小值和最大值。另一方面，第二种方法是找到并直接显示每行的最小值和最大值。让我们研究这两种方法。\n\
  \n## 第一种方法 – 创建辅助数组\n\n为了更好地理解这种方法，让我们使用“从内向外”的方法。当以下代码段完成迭代时，辅助一维数组 `minimum` 和\
  \ `maximum` 在位置 0 处分别包含数组 `b` 第一行（行索引 0）的最小值和最大值。假设变量 `i` 的值为 0。\n\n```\nminimum[i]\
  \ = b[i][0];\nmaximum[i] = b[i][0];\nfor (j = 1; j <= COLUMNS - 1; j++) {\n    if\
  \ (b[i][j] < minimum[i]) {\n        minimum[i] = b[i][j];\n    }\n    if (b[i][j]\
  \ > maximum[i]) {\n        maximum[i] = b[i][j];\n    }\n}\n```\n\n![](img/00002.jpeg)\
  \ 注意变量 `j` 从 1 开始。其实从列索引 0 而不是 1 开始迭代并没有错，尽管程序会执行一次无用的迭代。\n\n现在既然一切都已清楚了，为了处理整个数组\
  \ `b`，你只需要将此代码段嵌套到一个遍历所有行的 for 循环中，如下所示。\n\n```\nfor (i = 0; i <= ROWS - 1; i++)\
  \ {\n    minimum[i] = b[i][0];\n    maximum[i] = b[i][0];\n    for (j = 1; j <=\
  \ COLUMNS - 1; j++) {\n        if (b[i][j] < minimum[i]) {\n            minimum[i]\
  \ = b[i][j];\n        }\n        if (b[i][j] > maximum[i]) {\n            maximum[i]\
