  \ 语句不属于单分支决策结构的语句块。\n\n初级程序员在编写 Java 程序时经常犯的一个非常常见的错误是将赋值运算符与“等于”运算符混淆。他们经常犯写成 `if\
  \ (name.equals(\"Zeus\") = true)` 的错误，而他们实际上想表达的是 `if (name.equals(\"Zeus\") ==\
  \ true)`。\n\n当 `if` 语句中只包含一条单一语句时，你可以省略大括号 `{ }`。因此，`if` 语句变为：\n\n`if (Boolean_Expression)\
  \ One_Single_Statement;`\n\n或者你甚至可以将语句写在同一行，如下所示：\n\n`if (Boolean_Expression) One_Single_Statement;`\n\
  \n只有当 `if` 语句中包含多条语句时，才需要大括号。如果没有大括号，Java 无法判断某语句是 `if` 语句的一部分，还是 `if` 语句之后语句的一部分。许多程序员倾向于始终使用大括号，即使\
  \ `if` 语句只包含一条单一语句。在以下两个示例中，`System.out.println(y)` 语句都不是 `if` 语句的一部分。\n\n```java\n\
  if (x == y)x++;\nSystem.out.println(y);\nif (x == y) {x++;\nSystem.out.println(y);\n\
  ```\n\n#### 练习 16.1-1 追踪表与单分支决策结构\n\n设计相应的流程图并创建一个追踪表，以确定下一个 Java 程序在两种不同执行情况下，每一步中变量的值。\n\
  \n两次执行的输入值为 (i) 10 和 (ii) 51。\n\n![](img/00001.gif) `Class_16_1_1`\n```java\npublic\
  \ static void main(String[] args) {\n    int a, y;\n    a = Integer.parseInt(cin.nextLine());\n\
  \    if (a * 2 > 100) {\n        y = 5;\n    }\n    y = a * 4;\n    System.out.println(a\
  \ + \" \" + y);\n}\n```\n\n解决方案\n\n流程图所示![](img/00159.gif) i. 对于输入值 10，追踪表如下：\n\n\
  | 步骤 | 语句 | 注释 | a | y |\n| :--- | :--- | :--- | :--- | :--- |\n| | | | | |\n| 1\
  \ | `a = Integer.parseInt(cin.nextLine())` | 输入: 10 | 10 | |\n| 2 | `y = 5` | |\
  \ 10 | 5 |\n| 3 | `if (a * 2 > 100)` | `10 * 2 > 100` 为假 | 10 | 5 |\n| 4 | `y =\
  \ a * 4` | | 10 | 40 |\n| 5 | `System.out.println(a + \" \" + y)` | 输出: 10 40 |\
  \ 10 | 40 |\n\nii. 对于输入值 51，追踪表如下：\n\n| 步骤 | 语句 | 注释 | a | y |\n| :--- | :--- |\
  \ :--- | :--- | :--- |\n| | | | | |\n| 1 | `a = Integer.parseInt(cin.nextLine())`\
  \ | 输入: 51 | 51 | |\n| 2 | `y = 5` | | 51 | 5 |\n| 3 | `if (a * 2 > 100)` | `51\
  \ * 2 > 100` 为真 | 51 | 5 |\n| 4 | `y = a * 4` | | 51 | 204 |\n| 5 | `System.out.println(a\
  \ + \" \" + y)` | 输出: 51 204 | 51 | 204 |\n\n#### 练习 16.1-2 数字的绝对值\n\n设计相应的流程图并编写相应的\
  \ Java 程序，让用户输入一个数字，然后显示其绝对值。\n\n解决方案\n\n实际上有两种方法。第一种方法使用单分支结构，而第二种使用内置的 `abs()`\
  \ 方法。\n\n使用单分支结构\n\n这种方法非常简单。如果用户输入负值，例如 -5，该值将变为 +5。正数或零则保持不变。解决方案所示所示![](img/00160.gif)。对应的\
  \ Java 程序如下：\n\n![](img/00001.gif) `Class_16_1_2a`\n```java\npublic static void\
  \ main(String[] args) {\n    double x;\n    x = Double.parseDouble(cin.nextLine());\n\
  \    if (x < 0) {\n        x = (-1) * x;\n    }\n    System.out.println(x);\n}\n\
  ```\n\n使用 `abs()` 方法\n\n在这种情况下，你只需要几行代码，不需要决策结构！\n\n![](img/00001.gif) `Class_16_1_2b`\n\
  ```java\npublic static void main(String[] args) {\n    double x;\n    x = Double.parseDouble(cin.nextLine());\n\
  \    System.out.println(Math.abs(x));\n}\n```\n\n### 16.2 复习题：判断题\n\n对以下每个陈述选择对或错。\n\
  \n1. 单分支决策结构用于执行一组语句。\n2. 你使用单分支决策结构是为了让其他程序员更容易理解你的程序。\n3. 单分支决策结构中的的语句可能一个都不被执行。\n\
