  ```\n\n为了进一步帮助你，还有一个通用的 Java 程序可以用于拆分任何给整数。这个程序使用了第二种方法。再次，由于你的程序长度取决于位数 `N`，你只需要编写\
  \ `N−1` 对语句。\n\n```java\nSystem.out.print(\"Enter a N-digit integer: \");\nnumber\
  \ = Integer.parseInt(cin.nextLine());\ndigit(N) = number % 10;\nr = (int)(number\
  \ / 10);\ndigit(N-1) = r % 10;\nr = (int)(r / 10);\n..digit3 = r % 10;\nr = (int)(r\
  \ / 10);\ndigit2 = r % 10;\ndigit1 = (int)(r / 10);\n```\n\n例如，如果你想拆分一个五位整数，你必须像后续程序所示使用四对语句。\n\
