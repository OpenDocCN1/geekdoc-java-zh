  \ 中没有 `break` 语句，它们都将到达 `case 11`。\n\n#### 练习 23.5-3 数字是回文吗？\n\n回文是指反转数字后保持相同的数字。例如，数字\
  \ `13631` 就是回文。编写一个 Java 程序，让用户输入一个五位整数并测试该数字是否为回文。此外，当用户输入浮点数或任何少于或多于五位的整数时，必须显示单独错误消息。\n\
  \n（注意这涉及数据验证！）\n\n#### 解决方案\n\n为了测试用户输入的是否回文数，你需要像第 13 中学的那样，将其数字拆五个不同的变量。然后，你可以检查\
  \ `第 1 个` 数字是否等于 `第 5 个` 数字，以及 `第 2 个` 数字是否等于 `第 4 个` 数字。如果此结果为真，则该数字是回文。\n\n为了验证数据输入，你需要检查用户是否输入了五位数字。记住所有五位数字都在\
  \ `10000` 到 `99999` 范围内。因此，你只需要将数据输入限制在这个范围内。\n\n为了显示许多不同的错误消息，最佳实践是使用多重选择结构，它首先检查所有情况的数据输入有效性，然后尝试解决所需的问题。例如，如果你需要检查各种错误，可以进行如下操作。\n\
  \n\n\n\n最终的 Java 程序所示。\n\n![](img/00001.gif) `Class_23_5_3`\n\n```java\npublic static\
  \ void main(String[] args) {\n    int digit1, r, digit2, digit3, digit4, digit5;\n\
  \    double x;\n    x = Double.parseDouble(cin.nextLine());\n    if (x != (int)x)\
  \ {\n        System.out.println(\"You entered a float\");\n    } else if (x < 10000)\
  \ {\n        System.out.println(\"You entered less than five digits\");\n    } else\
  \ if (x > 99999) {\n        System.out.println(\"You entered more than five digits\"\
  );\n    } else {\n        //Split the digits of x into 5 different variables\n \
  \       digit1 = (int)(x / 10000);\n        r = (int)x % 10000;\n        digit2\
  \ = (int)(r / 1000);\n        r = r % 1000;\n        digit3 = (int)(r / 100);\n\
  \        r = r % 100;\n        digit4 = (int)(r / 10);\n        digit5 = r % 10;\n\
  \        if (digit1 == digit5 && digit2 == digit4) {\n            System.out.println(\"\
  Palindrome\");\n        } else {\n            System.out.println(\"Not Palindrome\"\
  );\n        }\n    }\n}\n```\n\n#### 练习 23.5-4 检查大小写和标点符号\n\n编写一个 Java 程序，提示用户输入一个句子，然后检查其大小写和标点符号是否正确。程序必须判断字符串是否以大写字母开头并以标点符号结尾（仅检查句号、问号和叹号）。\n\
  \n#### 解法\n\n在此练习中，你需要提取字符串的第一个和最后一个字符。正如你所知道的，可以使用 substring 表示法访问字符串的任何单个字符。你可以使用索引\
  \ `0` 访问第一个字符，索引 `1` 访问第二个字符，以此此类推。\n\n因此，你可以使用以下 Java 语句提取字符串的第一个字符。\n\n`first_char\
  \ = sentence.charAt(0);`\n\n另一方面，最后一个字符的索引比字符串的长度少 1。但是，这个字符串有多长呢？\n\n你可以使用 `length()`\
  \ 方法获取任何字符串的长度。以下代码片段提取字符串的最后一个字符。\n\n```java\nlength = sentence.length();\nlast_char\
  \ = sentence.charAt(length – 1);\n```\n\n或者你甚至可以用一条语句完成。\n\n`last_char = sentence.charAt(sentence.length()\
  \ – 1);`\n\nJava 程序所示所示。\n\n![](img/00001.gif) `Class_23_5_4` \n\n```java\npublic\
  \ static void main(String[] args) {\n    String sentence, first_char, last_char;\n\
  \    boolean sentence_is_okay;\n    System.out.print(\"Enter a sentence: \");\n\
  \    sentence = cin.nextLine();\n    //获取第一个字符并将其从 char 转换为 String\n    first_char\
  \ = \"\" + sentence.charAt(0);\n    //获取最后一个字符并将其从 char 转换为 String\n    last_char\
  \ = \"\" + sentence.charAt(sentence.length() - 1);\n    sentence_is_okay = true;\n\
  \    if (!first_char.equals(first_char.toUpperCase())) {\n        sentence_is_okay\
  \ = false;\n    } else if (!last_char.equals(\".\") && !last_char.equals(\"?\")\
  \ && !last_char.equals(\"!\")) {\n        sentence_is_okay = false;\n    }\n   \
  \ if (sentence_is_okay) {\n        System.out.println(\"Sentence is okay!\");\n\
  \    }\n}\n```\n\n起初，程序假设句子是正确的（`sentence_is_okay = true`）。然后，它检查大小写和标点是否正确，如果发现错误，会将\
  \ `false` 值赋值给变量 `sentence_is_okay`。\n\n### 23.6 复习练习\n\n完成以下练习。\n\n1. 编写一个 Java\
