  ### 22.1 引言\n\n本章致力于向你介绍一些可以帮助写出“更好”代码的技巧和技巧。在你设计自己的算法或 Java 程序时，应该始终记住这些技巧。\n\n\
  这些技巧可以提高代码的可读性，并帮助代码更短甚至更快。当然，在某些情况下使用特定的技巧会有帮助，但在另一些情况下，相同的技巧可能会产生相反的结果。大多数情况下，代码优化取决于经验。\n\
  \n![](img/00003.jpeg)算法算法并不总是最佳方案。为了解决特定问题，你可能会写一个非常短但消耗大量 CPU 时间的算法。另一方面，你也可以用另一个算法解决同一个问题，尽管它看起来长，但计算速度快得多。\n\
  \n### 22.2 选择决策控制结构\n\n下面的图可以帮助你根据检查变量的数量决定哪种决策结构是更好的选择。\n\n![Image](img/00197.gif)\n\
  \n![](img/00002.jpeg)该图推荐的是最好的，而不是唯一的。例如，当一个变量有多个情况时，使用嵌套决策结构并不是错误的。但是，建议的多分支决策结构和建议的分类结构更好，因为它们更方便。\n\
  \n### 22.3 精简决策控制结构\n\n仔细观察给出的通用形式的流程图片段。\n\n![Image](img/00198.gif)\n\n你可以看到，相同的语句或语句块位于开头，另外两个相同的语句或语句块位于两个路径的结尾。这意味着无论\
  \ `Boolean_Expression` 的结果如何，这些语句都会执行。因此，你可以简单地将它们移动到双分支结构之外并分别在其之前和之后，如等效结构所示。\n\
  \n![Image](img/00199.gif)\n\n相同的技巧适用于任何决策控制结构，只要所有路径都存在相同的语句或语句块。当然，也有无法应用该技巧的情况。\n\
  \n仍然感到困惑吗？接下来，你将发现一些可以帮助你更好理解的练习。\n\n#### 练习 22.3-1 “收缩”算法\n\n使用更少的语句重新设计以下流程图。\n\
  \n![Image](img/00200.gif)\n\n答案\n\n\n\n\n\n如你所示，语句 `y ← a * 2` 存在于双选选择结构的两种路径中。这意味着，无论布尔表达式的结果如何，该语句在两种情况下都会执行。因此，你可以简单地将该语句移动到双选选择结构的外部并紧邻其，如下。\n\
  \n![Image](img/00201.gif)\n\n#### 练习 22.3-2 “收缩”Java 程序\n\n使用更少的语句重写以下 Java 程序。\n\
  \n```java\npublic static void main(String[] args) {\n    int a, y;\n    a = Integer.parseInt(cin.nextLine());\n\
  \    if (a > 0) {\n        y = a * 4;\n        System.out.println(y);\n    } else\
  \ {\n        y = a * 3;\n        System.out.println(y);\n    }\n}\n```\n\n#### 答案\n\
  \n如你所示，语句 `System.out.println(y)` 存在于双选选择结构的两种路径中。这意味着，无论布尔表达式的结果如何，该语句在两种情况下都会执行。因此，你可以简单地将该语句移动到双选选择结构的外部并紧随其后，如下所示。\n\
  \n```java\npublic static void main(String[] args) {\n    int a, y;\n    a = Integer.parseInt(cin.nextLine());\n\
  \    if (a > 0) {\n        y = a * 4;\n    } else {\n        y = a * 3;\n    }\n\
  \    System.out.println(y);\n}\n```\n\n#### 练习 22.3-3 “收缩”算法\n\n使用更少的语句重新设计以下流程图，然后编写相应的\
  \ Java 程序。\n\n![Image](img/00202.gif)\n\n#### 答案\n\n在这种情况下，无法进行任何特殊处理。如果你尝试将 `Write\
  \ y` 语句移动到多选选择结构的外部，那么生成的流程图绝对与初始流程图不等等。\n\n![Image](img/00203.gif)\n\n这是因为右侧的最后一条路径，在初始流程图中，该路径并不包含\
  \ `Write y` 语句。\n\n检查两个流程图，看它们是否产生相同的结果。例如，假设用户输入了一个错误的数字。在两个流程图中，执行流都会流向 `Write\
  \ \"Wrong Number\"` 语句。之后，初始流程图不再执行其他语句，但相反，第二个流程图额外执行了一个 `Write y` 语句。\n\n![](img/00003.jpeg)\
  \ 如果一个语句或语句块并不在所有路径中都存在，你就无法将其移动到决策控制结构的外部。\n\n你现在可能想知道是否有其他方法可以将 `Write y` 语句移动到多选选择结构的外部。答案是“肯定的”，但你需要稍微重新安排流程图。你需要完全移除右侧的最后一条路径，并在开头使用一个全新的决策控制结构来检查给定的数字是否错误。一种可能的解决方案所示。\n\
  \n![Image](img/00204.gif)\n\n对应的 Java 程序为：\n\n```java\npublic static void main(String[]\
  \ args) {\n    double a, y;\n    a = Double.parseDouble(cin.nextLine());\n    if\
  \ (a >= 30) {\n        System.out.println(\"Wrong Number\");\n    } else {\n   \
  \     if (a < 10) {\n            y = a * 2;\n        } else if (a < 20) {\n    \
  \        y = a / 2;\n        } else {\n            y = a + 2;\n        }\n     \
  \   System.out.println(y);\n    }\n}\n```\n\n### 22.4 逻辑运算符 – 使用，还是不使用：这是一个问题！\n\
  \n在某些情况下，你可以使用逻辑运算符代替嵌套决策结构，这可以提高可读性。看这个通用形式的流程图片段。\n\n![Image](img/00205.gif)\n\
  \n如你所示，只有当两个布尔表达式都为真时，语句或块 `1` 才会执行。语句或块 `2` 在其他情况下都会执行。因此，你可以使用 `AND` 运算符重新设计该流程图。\n\
  \n![Image](img/00206.gif)\n\n现在让我们来看另一个通用形式的流程图片段。\n\n![Image](img/00207.gif)\n\n\
  在这个流程图片段中，当 `Boolean_Expression_1` 或 `Boolean_Expression_2` 为真时，语句或块 `2` 执行。因此，你可以如下所示使用\
  \ `OR` 运算符重新设计该片段。\n\n![Image](img/00208.gif)\n\n![](img/00002.jpeg) 显然，这些方法也可以适用于嵌套决策结构。\n\
  \n#### 练习 22.4-1 重写代码\n\n使用逻辑运算符重写以下 Java 程序。\n\n```java\npublic static void main(String[]\
  \ args) {\n    String today;\n    today = cin.nextLine();\n    if (today.equals(\"\
  February 16\") == true) {\n        if (today.equals(\"Lukia\") == true) {\n    \
  \        System.out.println(\"Happy Birthday!!!\");\n        } else {\n        \
  \    System.out.println(\"No match!\");\n        }\n    }\n}\n```\n\n只有当两个表达式都为真时，`System.out.println(\"\
  Happy Birthday!!!\")` 才会执行。`System.out.println(\"No match!\")` 在其他情况下执行。因此，你可以使用\
  \ `&&` 运算符重写程序。\n\n```java\npublic static void main(String[] args) {\n    String\
  \ today;\n    today = cin.nextLine();\n    if (today.equals(\"February 16\") ==\
  \ true && today.equals(\"Lukia\") == true) {\n        System.out.println(\"Happy\
  \ Birthday!!!\");\n    } else {\n        System.out.println(\"No match!\");\n  \
  \  }\n}\n```\n\n#### 练习 22.4-2 重写代码\n\n使用逻辑运算符重写以下 Java 程序。\n\n```java\npublic static\
  \ void main(String[] args) {\n    int a, y, b;\n    a = Integer.parseInt(cin.nextLine());\n\
  \    y = 0;\n    if (a > 10) {\n        y++;\n    } else if (b > 20) {\n       \
  \ y++;\n    } else {\n        y--;\n    }\n    System.out.println(y);\n}\n```\n\n\
  当变量 `a` 大于 10 或变量 `b` 大于 20 时，`y++` 语句执行。因此，你可以使用 `||` 运算符重写程序。\n\n```java\npublic\
  \ static void main(String[] args) {\n    int a, y, b;\n    a = Integer.parseInt(cin.nextLine());\n\
  \    b = Integer.parseInt(cin.nextLine());\n    y = 0;\n    if (a > 10 || b > 20)\
  \ {\n        y++;\n    } else {\n        y--;\n    }\n    System.out.println(y);\n\
  }\n```\n\n### 22.5 合并多个单选决策结构\n\n很多时候，算法包含两个或多个评估相同布尔表达式的单选决策结构。例如所示。\n\n![Image](img/00209.gif)\n\
  \n当这种情况发生时，你可以将所有的单选决策结构合并为一个，如下。\n\n![Image](img/00210.gif)\n\n![](img/00003.jpeg)\
  \ 单选决策结构需要彼此相邻。如果它们之间存在任何语句，除非你能将该语句移动到代码的其他地方，否则你无法合并它们。\n\n#### 练习 22.5-1 合并决策控制结构\n\
  \n在以下 Java 程序中，合并单选决策结构。\n\n```java\npublic static void main(String[] args) {\n\
  \    int a;\n    a = Integer.parseInt(cin.nextLine());\n    if (a > 0) {\n     \
  \   System.out.println(\"Hello\");\n    }\n    if (a > 0) {\n        System.out.println(\"\
  Hermes\");\n    }\n}\n```\n\n第一个和第二个决策控制结构评估完全相同的布尔表达式，因此它们可以简单地合并为一个。Java 程序变为：\n\
  \n```java\npublic static void main(String[] args) {\n    int a;\n    a = Integer.parseInt(cin.nextLine());\n\
  \    if (a > 0) {\n        System.out.println(\"Hello\");\n        System.out.println(\"\
  Hermes\");\n    }\n}\n```\n\n#### 练习 22.5-2 合并决策控制结构\n\n在以下 Java 程序中，尽可能多合并单选决策结构。\n\
  \n```java\npublic static void main(String[] args) {\n    int a, y, b;\n    a = Integer.parseInt(cin.nextLine());\n\
  \    y = 0;\n    if (a > 0) {\n        y += a + 1;\n    }\n    b = Integer.parseInt(cin.nextLine());\n\
  \    if (!(a <= 0)) {\n        System.out.println(\"Hello Hera\");\n    }\n    a++;\n\
  \    if (a > 0) {\n        System.out.println(\"Hallo Welt\");\n    }\n    System.out.println(y);\n\
  }\n```\n\n\n\n\n\n如果你仔细观察这个 Java 程序，你会很清楚第一个和第二个决策控制结构实际上在评估完全相同的布尔表达式。`a > 0` 的取反结果是\
  \ `a <= 0`，而对 `a <= 0` 进行第二次取反（这次使用 `NOT` (`!`) 运算符）的结果是 `!(a <= 0)`。因此，`a > 0`\
  \ 实际上等于 `!(a <= 0)`。\n\n![](img/00003.jpeg)\n两次否定会得到一个肯定。\n\n然而，在第一个和第二个决策控制结构之间存在语句\
  \ `b = Integer.parseInt(cin.nextLine())`，这阻止了你将它们合并为一个。幸运的是，这条语句可以移动到程序的开头，因为它并不真正影响执行的后续流程。\n\
  \n另一方面，在第二个和第三个决策控制结构之间存在语句 `a++`，这同样阻止了你进行合并；遗憾的是，这条语句无法移动到其他地方，因为它确实影响了执行的后续流程（第二个和第三个决策控制结构依赖于这条语句）。因此，第三个决策控制结构无法与前两个合并！\n\
  \n\n\n最终的 Java 程序如所示。\n\n```java\npublic static void main(String[] args) {\n   \
  \ int a, b, y;\n    a = Integer.parseInt(cin.nextLine());\n    b = Integer.parseInt(cin.nextLine());\n\
  \    y = 0;\n    if (a > 0) {\n        y += a + 1;\n        System.out.println(\"\
  Hello Hera\");\n    }\n    a++;\n    if (a > 0) {\n        System.out.println(\"\
  Hallo Welt\");\n    }\n    System.out.println(y);\n}\n```\n\n### 22.6 将两个单分支决策控制结构替换为双分支结构\n\
  \n请看下一个示例。\n\n```java\nif (x > 40) {//Do something}\nif (x <= 40) {//Do something\
  \ else}\n```\n\n第一个决策控制结构评估变量 `x` 以测试它是否大于 40，紧接着，第二个决策控制结构再次评估该变量，以测试它是否小于或等于 40！\n\
  \n这是初级程序员经常犯的一个非常常见的“错误”。尽管一个双分支决策结构就能完成相同的工作，他们仍然使用了两个单分支决策控制结构。\n\n上一个示例可以仅用一个双分支决策结构进行重写，如下：\n\
  \n```java\nif (x > 40) {//Do something}\nelse {//Do something else}\n```\n\n尽管这两个示例都完全正确且运行完美，但第二种方案更好。CPU\
  \ 只需要评估一个布尔表达式，从而导致更快的执行速度。\n\n![](img/00002.jpeg)\n两个单分支决策控制结构必须相互相邻。如果它们之间存在任何语句，你就无法“合并”它们（即将它们替换为双分支决策控制结构），除非你能够将该语句移动到代码的其他地方。\n\
  \n#### 练习题 22.6-1 “合并”决策控制结构\n\n在下面的 Java 程序中，尽可能“合并”所有的单分支决策控制结构。\n\n```java\n\
  public static void main(String[] args) {\n    int a, y, b;\n    a = Integer.parseInt(cin.nextLine());\n\
  \    y = 0;\n    if (a > 0) {\n        y += a;\n    }\n    b = Integer.parseInt(cin.nextLine());\n\
  \    if (!(a > 0)) {\n        System.out.println(\"Hello Zeus\");\n    }\n    if\
  \ (y > 0) {\n        System.out.println(y + 5);\n    }\n    y++;\n    if (y <= 0)\
  \ {\n        System.out.println(y + 12);\n    }\n}\n```\n\n##### 解答案\n\n第一个决策控制结构评估变量\
  \ `a` 以测试它是否大于零，紧随之后，第二个决策控制结构再次评估变量 `a` 以测试它是否不大于零。尽管它们之间存在语句 `b = Integer.parseInt(cin.nextLine())`，但这条语句可以移动到其他地方，因为它并不真正影响执行的后续流程。因此，第一个和第二个决策控制结构可以合并！\n\
  \n另一方面，在第三和第四个决策控制结构之间存在语句 `y++`，这阻止了你进行合并。遗憾的是，这条语句无法移动到其他地方，因为它确实影响了执行的后续流程（第三和第四个决策控制结构依赖于这条语句）。因此，第三个和第四个决策控制结构无法合并！\n\
  \n最终的 Java 程序变为\n\n```java\npublic static void main(String[] args) {\n    int a,\
  \ b, y;\n    a = Integer.parseInt(cin.nextLine());\n    b = Integer.parseInt(cin.nextLine());\n\
  \    y = 0;\n    if (a > 0) {\n        y += a;\n    } else {\n        System.out.println(\"\
  Hello Zeus\");\n    }\n    if (y > 0) {\n        System.out.println(y + 5);\n  \
  \  }\n    y++;\n    if (y <= 0) {\n        System.out.println(y + 12);\n    }\n\
  }\n```\n\n### 22.7 将最可能为布尔表达式放在前面\n\n多分支结构通常需要检查多个布尔表达式以以决定执行哪个语句或语句块。在下一个决策控制结构中，\n\
  \n```java\nif (Boolean_Expression_1){A statement or block of statements 1}\nelse\
  \ if (Boolean_Expression_2){A statement or block of statements 2}\nelse if (Boolean_Expression_3){A\
  \ statement or block of statements 3}\n```\n\n程序首先测试 `Boolean_Expression_1` 是否为真。如果不是，测试\
  \ `Boolean_Expression_2` 是否为真。如果不是，测试 `Boolean_Expression_3`。然而，如果 `Boolean_Expression_1`\
  \ 大多数为假而 `Boolean_Expression_3` 大多数为真呢？这意味着在测试 `Boolean_Expression_1` 上浪费了时间。为了让你的程序更高效，你可以将最可能为真的表达式放在开头，将最可能为假的表达式放在最后，如下：\n\
  \n```java\nif (Boolean_Expression_3){A statement or block of statements 3}\nelse\
  \ if (Boolean_Expression_2){A statement or block of statements 2}\nelse if (Boolean_Expression_1){A\
  \ statement or block of statements 1}\n```\n\n![](img/00003.jpeg)\n尽管这种变化看起来无关紧要，但你节省的每一点时间都能让你的程序更快。\n\
  \n#### 练习题 22.7-1 重排布尔表达式\n\n根据一份极机密的报告，美国人喜欢的宠物是狗，猫位第二，猪紧随，鹦鹉最后。在下面的 Java 程序中，重新排列布尔表达式，以便程序在大多数情况下运行得更快、更高效。\n\
  \n```java\npublic static void main(String[] args) {\n    String kind;\n    System.out.print(\"\
  What is your favorite pet? \");\n    kind = cin.nextLine();\n    switch (kind) {\n\
  \        case \"Parrots\":\n            System.out.println(\"It screeches!\");\n\
  \            break;\n        case \"Guinea pig\":\n            System.out.println(\"\
  It squeaks\");\n            break;\n        case \"Dog\":\n            System.out.println(\"\
  It barks\");\n            break;\n        case \"Cat\":\n            System.out.println(\"\
  It meows\");\n            break;\n    }\n}\n```\n\n##### 解答案\n\n对于这份机密报告，你可以重新排列\
  \ Java 程序，使其在大多数情况下运行得快一点。\n\n```java\npublic static void main(String[] args) {\n\
  \    String kind;\n    System.out.print(\"What is your favorite pet? \");\n    kind\
  \ = cin.nextLine();\n    switch (kind) {\n        case \"Dog\":\n            System.out.println(\"\
  It barks\");\n            break;\n        case \"Cat\":\n            System.out.println(\"\
  It meows\");\n            break;\n        case \"Guinea pig\":\n            System.out.println(\"\
  It squeaks\");\n            break;\n        case \"Parrots\":\n            System.out.println(\"\
  It screeches!\");\n            break;\n    }\n}\n```\n\n### 22.8 为什么代码缩进如此重要？\n\n\
  当你阅读完这本书时，你可能会疑惑为什么在 Java 语句前面会出现空格字符，以及为什么这些语句没有写在段落的最左侧边缘，如下所示。\n\n\n\n\n\n```java\n\
  public static void main(String[] args) {\n    int x, y;\n    System.out.print(\"\
  Enter a number: \");\n    x = Integer.parseInt(cin.nextLine());\n    System.out.print(\"\
  Enter a second number: \");\n    y = Integer.parseInt(cin.nextLine());\n    if (x\
  \ > 5) {\n        System.out.println(\"Variable x is greater than 5\");\n    } else\
  \ {\n        x = x + y;\n        System.out.println(\"Hello Zeus!\");\n        if\
  \ (x == 3) {\n            System.out.println(\"Variable x equals to 3\");\n    \
  \    } else {\n            x = x - y;\n            System.out.println(\"Hello Olympians!\"\
  );\n            if (x + y == 24) {\n                System.out.println(\"The sum\
  \ of x + y equals to 24\");\n            } else {\n                System.out.println(\"\
  Nothing of the above\");\n            }\n        }\n    }\n}\n```\n\n答案显而易见的！没有缩进的代码很难阅读和理解。任何阅读这种编写代码的人都会对\
  \ `if – else` 的配对感到困惑（即一个 `else` 属于哪个 `if`）。此外，如果一个长长的 `Java` 程序是这样写的，几乎无法找到例如，一个遗漏的右括号\
  \ `}` 的位置。\n\n代码缩进可以定义为组织源代码的方式。缩进使用空格或制表符对代码进行格式化，以提高可读性。良好的缩进非常有帮助，即使花费额外的精力，从长远来看，当你重新查看代码时它可以节省大量时间。遗憾的是，它有时会被忽视，问题会在以后出现。遵循特定的编程风格有助于你避免语法和逻辑错误。它还能帮助程序员更容易地学习和理解他人编写的代码。\n\
  \n![](img/00002.jpeg)代码缩进类似于作者视觉上安排书籍文本的方式。他们不是写长系列句子，而是将文本分成章节和段落。这种做法并没有改变文本的含义，但它使其更容易阅读。\n\
  \n所有出现在大括号 `{ }` 内部的语句都应该缩进。例如，通过对双分支决策结构内部的语句进行缩进，你可以在视觉上将它们隔离开。结果是任何人都可以一眼看出当布尔表达式求值为\
  \ `true` 时执行哪些语句，当布尔表达式求值为 `false` 时执行哪些语句。\n\n![](img/00002.jpeg)只有人类在阅读和理解没有缩进的程序时才有困难。计算机可以执行任何\
  \ `Java` 代码，无论是否带有缩进，只要它不包含语法错误。\n\n## 22.9 复习题：判断对错对对以下每个陈述判断对错。\n\n1. 较小的算法总是给定问题的最佳解决方案。\n\
  2. 你可以将一个语句移动到双分支决策结构的外部并紧随其之前，只要它在决策结构的两条路径的开头都存在。\n3. 你始终可以使用逻辑运算符代替嵌套的决策控制结构来提高可读性。\n\
  4. 只有当两个单分支决策结构是连续的且它们求值相同的布尔表达式时，它们才能合并成一个单分支决策结构。\n5. 从双分支决策结构转换为两个单分支决策结构总是可能的。\n\
  6. 只有当两个单分支决策结构是连续的且它们求值相同的布尔表达式时，它们才能替换为一个双分支决策结构。\n7. 包含决策控制结构且编写时不缩进的 `Java`\
  \ 程序无法被计算机执行。\n\n### 22.10 复习题：选择题\n\n为以下每个陈述选择正确答案。\n\n1. 以下两个程序：\n```java\npublic\
