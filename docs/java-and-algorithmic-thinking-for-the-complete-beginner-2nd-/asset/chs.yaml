  * *\n*\n*\n```\n\n## 第 28 章：循环控制结构的技巧与方法\n\n### 28.1 引言\n\n本章旨在向你介绍一些可以帮助写出“更好”代码的实用技巧和方法。在设计自己的算法甚至自己的\
  \ Java 程序时，你应该始终记住这些技巧。\n\n这些技巧和方法可以帮助你提高代码的可读性，帮助你在每个给定的问题中选择更好用的循环控制结构，并帮助让代码更短甚至运行更快。当然，没有单一完美的方法，因为在某些情况下使用某个特定的技巧可能有帮助，但在另一些情况下，同样的技巧可能会产生完全相反的结果。大多数时候，代码优化取决于编程经验。\n\
  \n![](img/00003.jpeg) 较小的算法并不总是解决问题的最佳方案。为了解决某个特定问题，你可能会编写一个短算法，但遗憾的是它会消耗大量的 CPU\
  \ 时间。相反，你用另一种算法解决同一个问题，虽然算法看起来更长，但计算结果快得多。\n\n### 28.2 选择循环控制结构\n\n下图可以帮助你根据迭代次数，在每个给定的问题中选择哪种循环控制结构更好。\n\
  \n![Image](img/00262.gif)\n\n![](img/00002.jpeg) 此图推荐的是最佳选项，而非唯一选项。例如，当迭代次数已知时，使用前测试循环或后测试循环结构并不是错误的。不过，提议的\
  \ `for` 循环更加方便。\n\n### 28.3 “终极”规则\n\n在使用前测试或后测试循环结构时，经常困扰程序员脑的问题之一是：如何确定哪些语句应该写在循环控制结构的内部，哪些写在外部，以及顺序是什么。\n\
  \n有一个简单而强大的规则——“终极”规则！一旦你遵循它，产生逻辑错误的可能性就会降为零！\n\n“终极”规则规定：\n\n- 参与循环布尔表达式的变量或多个变量必须在进入循环之前初始化。\n\
  - 参与循环布尔表达式的变量的值必须在循环内部进行更新，并且位于循环控制结构的最后语句中。\n\n例如，如果 `x` 是参与循环布尔表达式的变量，前测试循环结构应该是如下形式：\n\
  \n```java\nInitialize x\nwhile (Boolean_Expression) {\n    A statement or statements\n\
  }\n```\n\n而后测试循环结构应该是如下形式：\n\n```java\nInitialize x\ndo {\n    A statement or statements\n\
  } while (Boolean_Expression);\n```\n\n其中：\n\n- `Initialize x` 是给变量 `x` 分配初始值的语句。它可以是输入语句（如\
  \ `cin.nextLine()`），或者是使用赋值运算符（=`）的赋值语句。在后测试循环中，这个语句有时是多余的可以省略，因为 `x` 的初始化可以在循环内部完成。\n\
  - `Boolean_Expression(x)` 是任何布尔表达式，从简单的到复杂的，取决于 `x`。\n- `Update/alter x` 是改变 `x`\
  \ 值的语句，必须位于循环的最后位置。\n\n以下是使用“终极”规则的示例：\n\n**示例 1**\n\n```java\na = Integer.parseInt(cin.nextLine());\
  \ // 初始化 a\nwhile (a > 0) { // 依赖 a 的布尔表达式\n    System.out.println(a);\n    a =\
  \ a - 1; // 更新 a\n}\n```\n\n**示例 2**\n\n```java\na = Integer.parseInt(cin.nextLine());\
  \ // 初始化 a\nb = Integer.parseInt(cin.nextLine()); // 初始化 b\nwhile (a > b) {\n  \
  \  System.out.println(a + \" \" + b);\n    a = Integer.parseInt(cin.nextLine());\
  \ // 更新 a\n    b = Integer.parseInt(cin.nextLine()); // 更新 b\n}\n```\n\n**示例 3**\n\
  \n```java\ns = 0; // 初始化 s\ndo {\n    y = Integer.parseInt(cin.nextLine());\n  \
  \  s = s + y; // 更新 s\n} while (s < 1000); // 依赖 s 的布尔表达式\n```\n\n**示例 4**\n\n```java\n\
  y = 0; // 初始化 y\ndo {\n    y = Integer.parseInt(cin.nextLine()); // 更新 y\n} while\
  \ (y < 0); // 依赖 y 的布尔表达式\n```\n在这个示例中，循环外的变量初始化是多余的可以省略，因为初始化在循环内部完成，如下：\n\n```java\n\
  do {\n    y = Integer.parseInt(cin.nextLine()); // 初始化并更新 y\n} while (y < 0); //\
  \ 依赖 y 的布尔表达式\n```\n\n**示例 5**\n\n```java\nodd = 0; // 初始化 odd\neven = 0; // 初始化\
  \ even\nwhile (odd + even < 5) { // 依赖 odd 和 even 的布尔表达式\n    x = Integer.parseInt(cin.nextLine());\n\
  \    if (x % 2 == 0) {\n        even++; // 更新 even\n    }else {\n        odd++;\
  \ // 更新 odd\n    }\n}\n```\n\n现在，你会明白为什么应该始终遵循“终极”规则了！让我们来看下面的练习题：\n\n\n\n\n编写一个代码片段，让用户重复输入数字，直到输入的正数个数达到三个。\n\
  \n这个作业是给一个班级的，一个学生给出了代码片段作为答案。\n\n```java\nint positives_given;\ndouble x;\npositives_given\
  \ = 0;\nx = Double.parseDouble(cin.nextLine());\nwhile (positives_given != 3) {\n\
  \    if (x > 0) {\n        positives_given += 1;\n    }\n    x = Double.parseDouble(cin.nextLine());\n\
  }\nSystem.out.println(\"Three Positives given!\");\n```\n\n乍看程序看起来是正确的。它让用户输入一个数字，进入循环检查该数字是否为正数，然后让用户输入第二个数字，以此此类推。然而，这个程序包含一个逻辑错误——不幸的是，这是一个很难发现的错误。你能发现它吗？\n\
  \n如果你尝试跟踪执行流，你可以亲自确认程序运行非常顺畅——顺畅到让你怀疑这本书是否是否可靠，或者你是否必须把它扔掉！\n\n只有当你尝试输入所有预期的三个正值时，问题才变得清晰。随后的跟踪追踪表可以帮助你确定问题所在之处。假设用户想要输入值\
  \ 5、−10、−2、4 和 20。\n\n| Step | Statement | Notes | positives_given | x |\n| :---\
  \ | :--- | :--- | :--- | :--- |\n| 1 | `positives_given = 0` | | 0 | ? |\n| 2 |\
  \ `x = Double.parseDouble(…)` | | 0 | 5.0 |\n| 3 | `while (positives_given != 3)`\
  \ | 结果为 true | | |\n| 4 | `if (x > 0)` | 结果为 true | | |\n| 5 | `positives_given\
  \ += 1` | | 1 | 5.0 |\n| 6 | `x = Double.parseDouble(…)` | | 1 | −10.0 |\n| 7 |\
  \ `while (positives_given != 3)` | 结果为 true | | |\n| 8 | `if (x > 0)` | 结果为 false\
  \ | | |\n| 9 | `x = Double.parseDouble(…)` | | 1 | −2.0 |\n| 10 | `while (positives_given\
  \ != 3)` | 结果为 true | | |\n| 11 | `if (x > 0)` | 结果为 false | | |\n| 12 | `x = Double.parseDouble(…)`\
  \ | | 1 | 4.0 |\n| 13 | `while (positives_given != 3)` | 结果为 true | | |\n| 14 |\
  \ `if (x > 0)` | 结果为 true | | |\n| 15 | `positives_given += 1` | | 2 | 4.0 |\n|\
  \ 16 | `x = Double.parseDouble(…)` | | 2 | 20.0 |\n| 17 | `while (positives_given\
  \ != 3)` | 结果为 true | | |\n| 18 | `if (x > 0)` | 结果为 true | | |\n| 19 | `positives_given\
  \ += 1` | | 3 | 20.0 |\n| 20 | `x = Double.parseDouble(…)` | | 3 | ??? |\n\n逻辑错误就在这里！在第\
  \ 20 步，尽管输入的正数总已经是三个，且你预期程序会停止，不幸的是，它仍然要求用户再输入一个数字！\n\n![](img/00003.jpeg) 你需要的是让用户输入三个正数的\
  \ Java 程序，而不是四个！\n\n这就是为什么你应该始终遵循书本方法！让我们看看这个程序应该怎么写。\n\n由于 `while` 循环的布尔表达式取决于变量\
  \ `positives_given`，因此该变量必须在循环外进行初始化。该变量必须在循环内部进行更新或修改。执行此更新或修改的语句必须是循环内的最后一条语句，如下所示代码片段（通用形式）所示。\n\
  \n```java\nint positives_given;\ndouble x;\npositives_given = 0; // positives_given\
  \ 的初始化\nwhile (positives_given != 3) { // 这取决于 positives_given\n    一条语句或语句块\n \
  \   if (x > 0) {\n        positives_given += 1; // positives_given 的更新/修改\n    }\n\
  }\n```\n\n现在你可以添加任何必要的语句来完成程序。这里缺失的语句只有让用户输入数字的语句（这必须在循环内完成）以及显示最后消息的语句（这必须在循环完成所有迭代后完成）。因此，最终的代码片段变为：\n\
  \n```java\nint positives_given;\ndouble x;\npositives_given = 0;\nwhile (positives_given\
  \ != 3) {\n    x = Double.parseDouble(cin.nextLine());\n    if (x > 0) {\n     \
  \   positives_given += 1;\n    }\n}\nSystem.out.println(\"Three Positives given!\"\
  );\n```\n\n### 28.4 跳出循环\n\n循环可能会消耗过多的 CPU 时间，因此在使用它们时必须非常小心。有时，你需要在循环完成所有迭代之前跳出或结束循环，通常是在满足特定条件时。\n\
  \n假设有一个隐藏密码，你知道它由三个字符组成且只包含数字。\n\n```java\nfound = false;\nfor (i = 100; i <= 999;\
  \ i++) {\n    if (i == hidden_password) {\n        password = i;\n        found\
  \ = true;\n    }\n}\nif (found) {\n    System.out.println(\"Hidden password is:\
  \ \" + password);\n}\n```\n\n### 第一种方法——使用 break 语句\n\n你可以使用 `break` 语句在循环完成所有迭代之前跳出循环。看下面的\
  \ Java 程序。当找到隐藏密码时，执行流立即退出（跳出）循环。\n\n```java\nfound = false;\nfor (i = 100; i <=\
  \ 999; i++) {\n    if (i == hidden_password) {\n        password = i;\n        found\
  \ = true;\n        break;\n    }\n}\nif (found) {\n    System.out.println(\"Hidden\
  \ password is: \" + password);\n}\n```\n\n#### 第二种方法——使用标志位\n\n`break` 语句并不是所有语言都具备；由于由于书的意图是教你“算法思维”（而不是仅\
  \ Java 支持的特殊语句），让我们来看另一种替代方案。\n\n在下面的 Java 程序中，当找到隐藏密码时，布尔表达式 `found == false` 强制执行流退出循环。\n\
  \n```java\nfound = false;\ni = 100;\nwhile (i <= 999 && found == false) {\n    if\
  \ (i == hidden_password) {\n        password = i;\n        found = true;\n    }\n\
  \    i++;\n}\nif (found) {\n    System.out.println(\"Hidden password is: \" + password);\n\
  }\n```\n\n\n\n\n```java\ns = 0;i = 1;do {count_of_numbers = 10000;s = s + i;i++;}\
  \ while (i <= count_of_numbers);average = s / count_of_numbers;System.out.println(average);\n\
  ```\n\n在使用循环时（尤其是那些执行多次迭代的循环），你应该始终记住的是：避免在循环内部放置任何对循环没有作用的语句。在上一个例中，`count_of_numbers\
  \ = 10000` 语句就是这样的语句。遗憾的是，只要它位于循环内部，计算机就会无缘地执行 10000 次，这无疑会影响计算机的性能。\n\n为了解决这个问题，你只需将此语句移动到循环外部，如下：\n\
  \n```java\ncount_of_numbers = 10000;s = 0;i = 1;do {s = s + i;i++;} while (i <=\
  \ count_of_numbers);average = s / count_of_numbers;System.out.println(average);\n\
  ```\n\n### 练习 28.5-1 清理循环\n\n以下代码片段计算数字 1, 2, 3, 4, … 10000 的平均值。尝试将尽可能多的语句移到循环外部，以提高程序的效率。\n\
  \n```java\ns = 0;for (i = 1; i <= 10000; i++) {s = s + i;average = s / 10000;}System.out.println(average);\n\
  ```\n\n#### 解答\n\n初级程序员在计算平均值时一个非常常见的错误是，将总和除以数字个数的语句（这里是 `average = s / 10000`）放在循环内部。考虑一下！想象一下你想计算自己在学校的平均分。你的第一步是计算你所修所有课程成绩的总和。然后，当所有成绩都加总后，你将该总和除以你所修课程的数量。\n\
  \n![](img/00002.jpeg) 计算平均值是一个两的过程。\n\n因此，在循环内部计算平均值是没有意义的。你可以将此语句移动到循环外部并紧跟循环之后，让循环仅用于累加数字，如下：\n\
  \n```java\ns = 0;for (i = 1; i <= 10000; i++) {s = s + i;}average = s / 10000;System.out.println(average);\n\
  ```\n\n### 练习 28.5-2 清理循环\n\n下一个公式\n\n![Image](img/00263.gif)\n\n使用以下代码片段求解，其中 `N`\
  \ 由用户给出。\n\n```java\nint n, i, j, denom;double s;System.out.print(\"Enter N: \"\
  );n = Integer.parseInt(cin.nextLine());s = 0;for (i = 1; i <= n; i++) {denom = 0;for\
  \ (j = 1; j <= n; j++) {\n\ndenom += Math.pow(j, j);\n\n}s += i / (double)denom;}System.out.println(s);\n\
  ```\n\n尝试将尽可能多的语句移到循环外部，以使代码更高效。\n\n#### 解答\n\n从公式可以看出，分母对于所有分数都是通用的。因此，为每个分数反复计算它是没有意义的。你可以只计算一次分母并多次使用该结果，如下：\n\
  \n```java\nint n, i, j, denom;double s;System.out.print(\"Enter N: \");n = Integer.parseInt(cin.nextLine());denom\
  \ = 0; for (j = 1; j <= n; j++) {denom += Math.pow(j, j);}s = 0;for (i = 1; i <=\
  \ n; i++) {;}\n```\n\n### 28.6 死循环以及如何避免死循环\n\n在使用循环时（尤其是那些执行多次迭代的循环），你应该始终记住的是：避免在循环内部放置任何对循环没有作用的语句。在上一个例中，`count_of_numbers\
  \ = 10000` 语句就是这样的语句。遗憾的是，只要它位于循环内部，计算机就会无缘地执行 10000 次，这无疑会影响计算机的性能。\n\n所有的 while\
  \ 循环必须包含一个语句来使其执行。不幸的是，程序员忘记在循环内部增加 `i`；导致它永远无法达到 10。\n\n![](img/00002.jpeg) 如果一个循环无法停止，它被称为死循环或无限循环。\n\
  \n在 Java 中，当你不小心编写并执行死循环时，应用程序会“挂起”。\n\n![](img/00002.jpeg) 这种循环会无限迭代。\n\n所以，始终记住在循环中包含一个语句来使其执行停止。\n\
  \n![](img/0097.gif)\n\n### 28.7 “由内向外”方法\n\n“由内向外”是本书提出的的一种方法，帮助你从内向外进行算法思维。这种方法首先处理内部结构，然后随着程序的开发，添加更多的控制结构。\n\
  \n尝试编写一个 Java 程序显示如下所示：\n\n![Image](img/00264.gif)\n\n\n\n\n\n1. 当迭代次数未知时，你可以使用固定循环。\n\
  2. 当迭代次数已知时，你不能使用后测试循环结构。\n3. 根据“终极”规则，在预测试循环结构中，参与循环布尔表达式的变量初始化必须在循环内部完成。\n4. 根据“终极”规则，在预测试循环结构中，更新/改变参与循环布尔表达式变量值的语句必须是循环内的最后一条语句。\n\
  5. 根据“终极”规则，在后测试循环结构中，参与循环布尔表达式的变量初始化有时可以在循环内部完成。\n6. 根据“终极”规则，在后测试循环结构中，参与循环布尔表达式变量的更新/改变必须是循环内的第一条语句。\n\
  7. 在 Java 中，你可以使用 `break_loop`（break）语句在循环完成所有迭代之前跳出循环。\n8. 给变量赋值常量值的语句放在循环控制结构内部更好。\n\
  9. 在以下代码段中：\n```\nfor (i = 1; i <= 30; i++) {a = \"Hello\";System.out.println(a);}\n\
  ```\n至少有一语句可以移动到 `for`-循环外部。\n\n10. 在以下代码段中：\n```\ns = 0;count = 1;while (count\
