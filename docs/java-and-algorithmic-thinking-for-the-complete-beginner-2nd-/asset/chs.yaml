  \ 17 章\n\n双分支决策结构\n\n### 17.1 双分支决策结构\n\n与单一分支决策结构相比，双分支决策结构在两条路径上都包含一个语句或语句块。\n\
  \n`if-else` 的通用形式为：\n```java\nif (expression)\n    语句或语句块 1\nelse\n    语句或语句块 2\n\
  ```\n在下一个示例中，当用户输入大于或等于 18 的值时，显示消息“You are an adult”。否则显示“You are underage!”。\n\
  ```java\npublic static void main(String[] args) {\n    int age;\n    System.out.print(\"\
  Enter your age: \");\n    age = Integer.parseInt(cin.nextLine());\n    if (age >=\
  \ 18) {\n        System.out.println(\"You are an adult!\");\n    } else {\n    \
  \    System.out.println(\"You are underage!\");\n    }\n}\n```\n\n#### 练习 17.1-1\
  \ Find 输出\n\n对于以下代码，确定三次执行的输出消息：\n```java\nif (x > 0)\n    print(\"Positive\");\n\
  else\n    print(\"Negative\");\n```\n解答：\ni. 当用户输入 3 时，表达式为真。执行右路径并显示“Positive”。\n\
  ii. 当用户输入 −3 时，表达式为假。执行左路径并显示“Negative”。\niii. 你能预测用户输入 0 时会发生什么吗？双分支决策结构必须遵循某条路径，右左右！它不会跳过两个语句的执行。因此，当用户输入\
  \ 0 时，表达式为假，执行左路径并显示“Negative”。\n\n#### 练习 17.1-2 跟踪表与双分支决策结构\n\n创建一个跟踪表，确定下一个 Java\
  \ 程序在两种不同执行下的每一步的变量值。\n两次执行的输入值为 (i) 5，和 (ii) 10。\n```java\npublic static void main(String[]\
  \ args) {\n    double a, z, w, y;\n    a = Double.parseDouble(cin.nextLine());\n\
  \    z = a * 10;\n    w = (z - 4) * (a - 3) / 7 + 36;\n    if (z >= w && a < z)\
  \ {\n        y = 2 * a;\n    } else {\n        y = 4 * a;\n    }\n    System.out.println(y);\n\
  }\n```\n解答：\ni. 对于输入值 5，跟踪表如下。\n\n| 步骤 | 语句 | 备注 | a | z | w | y |\n| --- | ---\
  \ | --- | --- | --- | --- | --- |\n| 1 | `a = Double.parseDouble(…)` | 用户输入值 5 |\
  \ 5.0 | ? | ? | ? |\n\n\n\n\n\n| 2 | `z = a * 10` | | 5.0 | 50.0 | ? | ? |\n| 3\
  \ | `w = (z - 4) * (a - 3) / 7 + 36` | | 5.0 | 50.0 | 49.142 | ? |\n| 4 | `if (z\
  \ >= w && a < z)` | 此项结果为 true |\n| 5 | `y = 2 * a` | | 5.0 | 50.0 | 49.142 | 10.0\
  \ |\n| 6 | `.println(y)` | 显示: 10.0 |\n\nii. 当输入值为 10 时，跟踪表所示。\n\n| 步骤 | 语句 | 注释\
  \ | a | z | w | y |\n| --- | --- | --- | --- | --- | --- | --- |\n| 1 | `a = Double.parseDouble(…)`\
  \ | 用户输入值 10 | 10.0 | ? | ? | ? |\n| 2 | `z = a * 10` | | 10.0 | 100.0 | ? | ? |\n\
  | 3 | `w = (z - 4) * (a - 3) / 7 + 36` | | 10.0 | 100.0 | 132.0 | ? |\n| 4 | `if\
  \ (z >= w && a < z)` | 此项结果为 false |\n| 5 | `y = 4 * a` | | 10.0 | 100.0 | 132.0\
  \ | 40.0 |\n| 6 | `.println(y)` | 显示: 40.0 |\n\n#### 练习 17.1-3 谁最大？\n\n设计一个流程图并编写相应的\
  \ Java 程序，让用户输入两个数字 `A` 和 `B`，然后确定并显示这两个数中较大的一个。\n\n#### 答案\n\n这个练习可以使用单分支或双分支决策结构来解决。所以，让我们都使用一下吧！\n\
  \n#### 方法一 – 使用双分支决策结构\n\n这种方法测试数字 `B` 的值是否大于数字 `A`。如果是，则 `B` 是最大的；否则，`A` 是最大的。\n\
  \n![Image](img/00163.gif)\n\n对应的 Java 程序如下。\n\n![](img/00001.gif)\n```java\nClass_17_1_3\n\
  public static void main(String[] args) {\n    double a, b, maximum;\n    a = Double.parseDouble(cin.nextLine());\n\
  \    b = Double.parseDouble(cin.nextLine());\n    if (b > a) {\n        maximum\
  \ = b;\n    } else {\n        maximum = a;\n    }\n    System.out.println(\"Greatest\
  \ value: \" + maximum);\n}\n```\n\n![](img/00002.jpeg) 注意，这个练习是尝试确定最大值，而不是该值实际上赋值给了哪个变量（变量\
  \ `A` 还是变量 `B`）。\n\n#### 方法二 – 使用单分支决策结构\n\n这种方法最初假设数字 `A` 可能是最大值（这就是为什么将变量 `a`\
  \ 的值赋值给 `maximum` 的原因）。然而，如果证明数字 `B` 实际上大于数字 `A`，那么最大值就会更新，即变量 `maximum` 被赋值了一个新值，即变量\
  \ `b` 的值。因此，无论发生什么，最后变量 `maximum` 始终包含最大值！\n\n![Image](img/00164.gif)\n\n在这里显示了\
  \ Java 程序。\n\n![](img/00001.gif)\n```java\nClass_17_1_3b\npublic static void main(String[]\
  \ args) {\n    double a, b, maximum;\n    a = Double.parseDouble(cin.nextLine());\n\
  \    b = Double.parseDouble(cin.nextLine());\n    maximum = a;\n    if (b > a) {\n\
  \        maximum = b;\n    }\n    System.out.println(\"Greatest value: \" + maximum);\n\
  }\n```\n\n#### 练习 17.1-4 寻找奇数和偶数\n\n设计一个流程图并编写相应的 Java 程序，提示用户输入一个正整数，然后显示消息指示该数是否为偶数；否则必须显示“Odd”（奇数）。\n\
  \n#### 答案\n\n接下来你可以找到各种奇数和偶数：\n\n- ► 奇数：1, 3, 5, 7, 9, 11, …\n- ► 偶数：0, 2, 4, 6,\
  \ 8, 10, 12, ….\n\n![](img/00002.jpeg) 注意，0 被视为偶数。\n\n在这个练习中，你需要找到一种方法来判断一个数是奇数还是偶数。你需要找到所有偶数之间的共同属性，或者所有奇数之间的共同属性。实际上确实有一个！所有偶数都能被\
  \ 2 整除。所以，当操作 `x MOD 2` 的结果等于 `0` 时，`x` 是偶数；否则，`x` 是奇数。\n\n流程图所示。\n\n![Image](img/00165.gif)\n\
  \n对应的 Java 程序如下。\n\n![](img/00001.gif)\n```java\nClass_17_1_4\npublic static void\
  \ main(String[] args) {\n    int x;\n    System.out.print(\"Enter a positive integer:\
  \ \");\n    x = Integer.parseInt(cin.nextLine());\n    if (x % 2 == 0) {\n     \
  \   System.out.println(\"Even\");\n    } else {\n        System.out.println(\"Odd\"\
  );\n    }\n}\n```\n\n#### 练习 17.1-5 周薪\n\n总工资取决于资率和每周工作小时。然而，如果有人工作超过 40 小时，他将获得加班工资。设计一个流程图并编写相应的\
  \ Java 程序，让用户输入资率和工作小时，然后计算并显示总工资。\n\n#### 答案\n\n这个练习可以使用双分支结构来解决。流程图所示。\n\n![Image](img/00166.gif)\n\
  \n对应的 Java 程序所示。\n\n```java\nClass_17_1_5\npublic static void main(String[] args)\
  \ {\n    double payrate, hours_worked, grossp;\n    payrate = Double.parseDouble(cin.nextLine());\n\
  \    hours_worked = Double.parseDouble(cin.nextLine());\n    if (hours_worked <=\
  \ 40) {\n        grossp = payrate * hours_worked;\n    } else {\n        grossp\
  \ = payrate * 40 + (hours_worked - 40) * 1.5 * payrate;\n    }\n    System.out.println(\"\
  Gross pay: \" + grossp);\n}\n```\n\n### 17.2 复习题：判断题\n\n1. 双分支结构可以执行 `else` 部分。\n\
  2. 双分支结构必须包含两个语句。\n3. 双分支结构使用了 `else` 关键字。\n4. `int else = 5;` 是正确的。\n5. 双分支结构的表达式可以返回多个值。\n\
  6. 以下代码片段满足属性：\n```java\nint x, y, z;\nx = Integer.parseInt(cin.nextLine());\ny\
  \ = Integer.parseInt(cin.nextLine());\nz = Integer.parseInt(cin.nextLine());\nif\
  \ (x > y && x > z) {\n    System.out.println(x + \" is the greatest\");\n} else\
  \ {\n    System.out.println(y + \" is the greatest\");\n}\n```\n\n### 17.3 复习题：单选题\n\
  \n1. 双分支结构包含：\n   a. 错误路径。\n   b. 路径。\n   c. 正确路径。\n\n2. 在片段中：\n```java\nif (x %\
  \ 2 == 0) {\n    x = 0;\n} else {\n    y++;\n}\n```\n`y++` 执行当：\n   a. 变量 `x` 被\
