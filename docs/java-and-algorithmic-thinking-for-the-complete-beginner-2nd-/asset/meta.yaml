  - 4. 两足球球队在欧洲冠军联赛中比赛。编写一个 Java 程序，提示用户输入两支球队的名称以及每支球队的进球数，然后显示获胜者的名称。假设用户输入的是有效值且没有平局。
- - '###'
  - 5. 编写一个 Java 程序，让用户输入一个整数，然后显示一条消息指示该数字是否为 6 的倍数；否则，必须显示“NN is not a multiple
    of 6”（其中 `NN` 是给定的数字）。假设用户输入的是非负值。
- - '###'
  - 6. 编写一个 Java 程序，让用户输入一个整数，然后显示两条可能的消息之一。其中一条指示该数字是否为 6 的倍数或 7 的倍数；另一个消息指示该数字既不是
    6 的倍数也不是 7 的倍数。假设用户输入的是非负值。
- - '###'
  - 7. 编写一个 Java 程序，让用户输入一个整数，然后显示一条消息指示该数字是否为 4 的倍数；否则，必须显示“NN is not a multiple
    of 4”（其中 `NN` 是给定的数字）。此外，该 Java 程序必须显示给定整数的结构，包括给定整数、商和任何余数。
- - '###'
  - 8. 编写一个 Java 程序，让用户输入一个整数，然后显示一条消息指示该整数为四位数；否则，必须显示“NN is not a four-digit integer”（其中
    `NN` 是指定的数字）。假设用户输入是非负值。
- - '###'
  - 9. 设计流程图并编写相应的 程序，让用户输入两个值，然后确定并显示这两个值中较的一个。
- - '###'
  - 10. 编写一个 Java 程序，让用户输入三个数字，然后显示一条消息指示数字是否作为三角形。否则，必须显示“Given numbers cannot be
    lengths of the sides”。
- - '###'
  - 11. 编写一个 Java 程序，让用户输入三个数字，然后显示一条消息指示数字是否作为直角三角形。否则，必须显示“Given numbers cannot
    be lengths of right triangle”。
- - '###'
  - 12. 雅典奥运会跳远运动员参加了三次。晋级，平均跳距离至少达到 8 米。编写一个 Java 程序，提示用户输入成绩，平均值大于 8 米时显示“Qualified”，否则“Disqualified”。
- - '###'
  - 13. 总工资取决于薪率和工作小时。然而，如果某人超过 40 小时，所有小时将获得双倍。设计流程图并编写相应的 程序，让用户输入薪率和工作小时，然后计算并显示净工资。净工资是扣除任何费用后的。费用包括税、医疗、退休计划等。总扣率为30%。
- - '###'
  - 14. 定期保养将使车辆更加可靠，减少故障、不必要的。
- - '###'
  - 15. 两辆车从静止开始沿水平道路以恒定加速度一段时间。编写一个 Java 程序，提示用户各自加速度，计算并显示它们距离，并根据哪辆车领先显示“Car A
    is first”或“Car B is first”。
