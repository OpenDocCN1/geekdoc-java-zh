  - 5. 自动取款机（ATM）中有10美元、5元和1元钞。编写一个 Java 程序来模拟这台 ATM的工作方式。开始，机器提示用户输入四位PIN码并检查 PIN的有效性（假设“1234”为有效PIN）。如果提供的PIN正确，程序必须提示用户输入想要取的金额（整数值），最后显示
    ATM必须取出的最少票数量。例如，如果用户输入的金额为36美元，程序必须显示“3张10美元钞，1张5元钞和1张1元钞”。此外，如果用户输入了错误的PIN，机器允许其重试两次。如果用户三次都输入错误的PIN，则必须显示“PIN
    locked（PIN 已锁定）”的消息并且结束。假设用户输入的金额是有效的。
- - '###'
  - 6. 编写一个 Java 程序，提示用户输入两个值，一个是温度，一个是风速。如果温度高于75华氏度，则认为当天天气炎热，否则为寒冷。如果风速高于12英小时，则认为当天有风，否则无风。程序必须根据给定的值显示一条信息。例如，如果用户的温度为60，风速为10，程序必须显示“当天天气很寒冷且无风”。假设用户的是有效值。
