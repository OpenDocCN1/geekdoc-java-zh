    follows: ![](image-842ml0c5.jpg) Figure 6.2: Output of running Happy Flow with
    Page Factory Finally, we will see an annotation that can be useful to speed up
    the test execution by caching the Web Elements. This annotation is the @CacheLookup
    annotation used in the Step Definitions. 6.10 Understanding the @CacheLookup annotation The
    @FindBy annotation does the following when used in a Step Definition:  Navigates
    to the Document Object Model. Searches for the element. Initializes the element. The
    element is ready for operations such as click(). There are many operations that
    are performed on WebElements and in a big project, there can be hundreds or even
    thousands of such WebElements. This increases the test execution time and reduces
    productivity. To tackle this situation, Cucumber provides us with the @CacheLookup
    annotation. This annotation, when applied over a WebElement, instructs Selenium
    to maintain this WebElement in the Cache. Every Time afterwards, when an operation
    is performed on that particular WebElement, the element is picked from the Cache,
    thus saving the execution time. The way we apply this annotation in the Page Object
    classes is shown as follows: @CacheLookup@FindBy(how=How.XPATH,using="//div[@role=''listbox'']")public
    WebElement logOutDiv; We will use @CacheLookup in all our Page Objects as we proceed
    to the remaining chapters. With this, we come to the end of this chapter. We covered
