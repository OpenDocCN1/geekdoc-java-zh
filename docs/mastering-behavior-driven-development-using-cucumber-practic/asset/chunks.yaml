    Understanding optional Capture/Non-Capture groups Think about a situation where
    we have multiple business analysts creating feature files. We will understand
    and groups with an example. 3.2.1 Capture groups Let’s take an example of a step
    written in two different ways:  Given User navigates to the login page.   Given
    User goes to the login page.  Here, only one word differs in the step which is
    and Apart from that, the step is the same. An efficient step definition shown
    below takes the action written in the feature file and prints it out. Alter BPB_1.java
    for the code snippet shown as follows: @Given("^User (navigates|goes) to the login
    page$")public void user_navigates_to_the_login_page(String entry) throws Throwable
    {System.out.println("Navigated to Login Page with verb "+entry);} The output will
    look as follows: With the first step, we get the output shown as follows: Navigated
    to Login Page with verb navigates With the second Given step, we get the output
    shown as follows: Navigated to Login Page with verb goes In the preceding Step
    Definition, we had to mention an argument for the method. It is not likely that
    this verb (navigates or goes) will be used anywhere else in the business logic.
    Here, the verb (navigates or goes) forms a capture group as shown in the regular
    expression as follows: @Given("^User (navigates|goes) to the login page$") What
    if we do not want to pass the verb as an argument but still wish to keep the feature
    files untouched. We need a Non-Capture group in that case. 3.2.2 Non-Capture groups Consider
    the same Given step of section Non-Capture groups provide the ability to specify
    different verbs. For example, (navigates|goes) in the feature file without having
    to pass it as an argument in the Step Definition. The change that needs to be
    done in BPB_1.java in the regular expression of the method in the Step Definition
    is shown as follows: @Given("^User to the login page$")public void user_navigates_to_the_login_page()
    throws Throwable {System.out.println("Navigated to Login Page");} Output: Navigated
    to Login Page is printed to the console. The Non-Capture group is mentioned in
    the regular expression attached to the method with a preceding ‘?:’. Anything
    that follows this symbol is considered as a non-capture group, and hence, it need
    not be passed as an argument to the method as shown above. 3.3 Handling string
