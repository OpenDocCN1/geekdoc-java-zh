    Pattern? The single design pattern is one of the creational design patterns in
    Java. It is used to create an object in Java. Only one instance exists at a given
    time when the Singleton Pattern is used. Other classes that utilize this class
    have access to only one instance of this class. The Singleton pattern saves memory
    since the same instance is utilized time and again. This pattern is implemented
    with the use of the components shown as follows:  Static member This holds the
    instance of the Singleton class. It saves memory as it is static. Private This
    prevents instantiation of the class from outside using the new keyword. Static
    Factory This can be accessed using This method returns the instance of the Singleton
    class to the caller. The Singleton pattern is used in test automation for the
    WebDriver instance creation. Apart from this in development, it is used in Database
    and Multi-Threaded applications. It is also used in thread pools, caching, logging,
    and so on. We will take a look at how we can make our code thread-safe in the
    next section. 4.2 Introduction to the ThreadLocal class in Java We will now take
    a look at how we can achieve parallel execution in Selenium. We will make use
    of parallel execution features of TestNG which requires the creation of a separate
    thread for each driver instance. The ThreadLocal class of Java will be utilized
    for this purpose. By declaring variables as shown in the following code, we make
    sure that each thread has its own copy of the WebDriver instance: ThreadLocaldriver
    = new ThreadLocal<webdriver>();</webdriver> Apart from the Driver instance, we
    will have the variables which hold the session ID, Browser name, the platform
    (Windows or Linux), and the Version: private ThreadLocalsessId = new ThreadLocal<string>();</string>private
    ThreadLocalsBrwsr = new ThreadLocal<string>();</string>private ThreadLocalsPltfrm
    = new ThreadLocal<string>();</string>private ThreadLocalsVrsn = new ThreadLocal<string>();</string> Each
    of these variables is thread-safe. Note that in section 4.1, when were introduced
    to the Singleton pattern which can be used to initiate a single browser session
    throughout. Here, we make the driver instance thread safe, thus giving an opportunity
    to launch multiple driver instances. Next, we will take a look at the WebDriverManager
    library which helps us in automating the driver binary management. 4.3 Introducing
    the WebDriverManager library Enter the code shown as follows in the Main method: System.
    setProperty("webdriver.chrome.driver", "path of the exe file\\chromedriver.exe");WebDriver
    driver=new ChromeDriver(); This will open a Chrome browser session. The driver
    executable has to be downloaded manually. This works fine but the problem with
    this is that every time the Chrome browser gets an update, the version of the
    driver executable has to be changed. Suppose testing has to be done on a specific
    version of a browser. This is not possible when we have to download the driver
    executable manually. The WebDriverManager library helps us in this by automatic
    management of the driver executable. WebDriverManager comes as a Maven dependency
    shown as follows: <groupid>io.github.bonigarcia</groupid><artifactid>webdrivermanager</artifactid><version>3.6.2</version> Right
    click on the project and select Maven | Update Project. The following lines System.
    setProperty("webdriver.chrome.driver", "path of the exe file\\chromedriver.exe");WebDriver
    driver=new ChromeDriver(); Will be replaced with the following: WebDriverManager.chromedriver().setup();WebDriver
    chromeDriver = new ChromeDriver(); Execute this code and you will see a Chrome
