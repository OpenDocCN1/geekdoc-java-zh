    execution. Log4J is configurable through external configuration files which can
    be either xml or property files. In order to use Log4J, the log4J dependency should
    be added to the pom.xml as follows: <groupid>log4j</groupid><artifactid>log4j</artifactid><version>1.2.17</version> After
    including this dependency, right click on the project and select Maven | Update
    The required JAR files will be downloaded in the .m2 folder. Log4J has three main
    components listed as follows:  This is used for capturing logging information. This
    is used for redirecting logging information to various preferred destinations
    [like Console or File Systems]. This is used for formatting logging information
    in different styles. Let’s understand the steps involved in using Log4J to log
    user-defined output statements in the code. 9.2 Create a generic class for logging For
    logging information to the console and file, we will use a user-defined class.
    This will be a very simple class as follows. Create a class called LoggerUtil.java
    in the package utils in src/main/java as follows: package utils; import org.apache.log4j.Logger;import
    org.apache.log4j.PropertyConfigurator; public class LoggerUtil {private static
    boolean customRoot=false;public static Logger getCustomLogger(Class mycls){if(customRoot){return
    Logger.getLogger(mycls);}PropertyConfigurator.configure("log4j.properties");customRoot
    = true;return Logger.getLogger(mycls);}} The preceding LoggerUtil class defines
    a static Boolean variable called If the root logger for Log4J has been already
    created by any class in the framework, the logger for that class will be returned
    else a new logger gets created. Let’s move to the log4j.properties file creation. 9.2.1
    Create a log4j.properties file Along with this class, we should have the log4j.properties
    file at the root of the project. The contents of the log4j.properties is shown
    as follows: # Define custom root logger with file appender. Level of the root
    logger is defined as INFOlog4j.rootLogger = INFO, FILE, stdout # Define the FILE
    Appender, the threshhold, the layout and the# conversion #pattern# The logging
    levels are in the order ALL(Integer.MAX_VALUE)# <trace_600_ _="" span="">< #DEBUG(500)
    < #INFO(400) < WARN(300) < ERROR(200) <</trace_600_># FATAL(100) < OFF(0). Since
    we #have kept the logging #level # at# INFO here, all INFO,WARN,ERROR,FATAL messages
    #will be displayed.# The DEBUG and #TRACE level messages are not displayed log4j.appender.FILE=org.apache.log4j.FileAppenderlog4j.appender.FILE.File=automationtest.outlog4j.appender.FILE.MaxFileSize=20MBlog4j.appender.FILE.MaxBackupIndex=5log4j.appender.FILE.Append=truelog4j.appender.FILE.layout=org.apache.log4j.PatternLayoutlog4j.appender.FILE.layout.ConversionPattern=%d{yyyy-MM-dd
    HH:MM:SS} %-5p %c{1}:%L - %m%nlog4j.appender.FILE.Threshold=INFO # This will print
    log in consolelog4j.appender.stdout=org.apache.log4j.ConsoleAppenderlog4j.appender.stdout.Target=System.outlog4j.appender.stdout.layout=org.apache.log4j.PatternLayoutlog4j.appender.stdout.layout.ConversionPattern=%d{yyyy-MM-dd
    HH:MM:SS} %-5p %c{1} :%L - %m%nlog4j.appender.stdout.Threshold=INFO The log messages
    will be pushed to the automationtest.out file, which will be appended every. On
    reaching 20 MB, a new file gets created. The new file will be an archived version,
    and at the place where it shows the type, the version number will be listed. For
    example, the first file will be of type 1 and the second of type 2\. When the
    version 2 file is created, the version 1 file data will be pushed to version 2,
    and the current version data will be pushed to version 1. The next thing worth
    mentioning is that there can be only five versions that can be created, as indicated
    by MaxBackupIndex. After the fifth version, once maxFileSize is reached, data
    will start flowing from the current version to version 1, from version 1 to version
    2, version 2 to version 3, and so on. Data in version 5 that was originally there
    will be overwritten by data from version 4\. Another point to note is about the
    logging levels. Logging levels are used to categorize entries in log files. This
    categorization is done based on urgency. Using logging levels one can manage the
    information that is logged. There are 8 logging levels which are listed as follows:  This
    turns on all levels of logging. This is used for debugging. Messages appear in
    log files once this level is set. This is used to record messages about routine
    operations of the application. This is used to indicate that an error exists in
    the system. This indicates a serious problem that requires immediate attention. This
    indicates a very serious problem which might result in a system crash if not addressed
    immediately. This turns off logging. This is introduced in version 1.2 and adds
    more information to DEBUG level logs. Let’s see how we can invoke this custom
    logger from our page objects. 9.3 Invoke the custom logger from the page objects In
