    reports in JenkinsConclusionQuestions IndexCHAPTER 1 Introduction to Behavior
    Driven Development Welcome to the exciting world of Behavior Driven Development
    ( BDD ). This book will be divided into three parts. The first part will make
    the user understand what Cucumber is all about. The second part will explore the
    Page Object Model and Page Factories. The third part will cover integration of
    Cucumber with the TestNG framework. It is going to be a very exciting journey,
    so let’s get started and understand what BDD is all about. BDD helps to bridge
    the gap between business people and technical people by implementing a language
    called It consists of statements in English predominantly, although other languages
    are available for this purpose too. A group of Gherkin statements together lists
    a functional flow. These statements are taken by the Automation developer and
    converted into code using frameworks like Cucumber, JBehave or Specflow. BDD is
    quite frequently used in Agile projects for getting quick feedback on code quality
    after developers check in their code in source code management systems like GitHub
    or SVN. The BDD tests can be configured to execute immediately after the code
    is checked in. This chapter will predominantly focus on  Test Driven Development Behavior
    Driven Development Understanding Gherkin Introduction to Cucumber Understanding
    the DRY principle Components of Cucumber Setup of the project in Eclipse Setup
    of TestNG in Eclipse Understanding the project structure Objective After reading
    this chapter, the reader will be conversant with the concepts of TDD, BDD, Gherkin
    and able to create a basic file called in the Gherkin Language. He will also learn
    how the Gherkin file relates to the Step Definition file which is one of the components
    of Cucumber. He will get knowledge of the project structure and understand how
    to set up a project in Eclipse along with TestNG Plugin integration. This chapter
    will serve as the foundation for one who wishes to work as a Test Automation Engineer
    and wants to make a career in BDD framework. 1.1 What is TDD? TDD stands for Test
    Driven Development. Test Driven Development is a software development process
    where test cases are written first taking into consideration the requirements
    in a traditional project or the user stories in a scrum or agile project. Once
    the tests are created, minimal code to make the tests pass is created. As and
    when new tests are created, the code is updated to make the new tests pass and
    at the same time ensuring that the existing tests pass as well. TDD (We will refer
    to this acronym for Test Driven Development going forward) was developed or rediscovered
    by Kent Beck in 2003 to facilitate simple designs. TDD is related to test first
    programming concepts of Extreme Programming. 1.1.1 Steps involved in a TDD The
    steps mentioned below should be followed in a typical Test Driven Development
    approach.  Write the This activity can be done by the tester or developer where
    a test is created from the user story, requirement or use case. This is contrasted
    to the traditional approach of writing unit tests after the code is written. TDD
    enables the developer to focus on the requirements (We will refer to user stories,
    traditional requirements or use cases as requirements going forward) before getting
    started with the code. This differentiated TDD from a traditional development
    approach. Run the test to check that it Prepare the development system such that
    bare minimum code is there to make your application run like creating the main
    method or a screen with the required stubs for the database or web service for
    example. Since writing the test was the very first activity done, it should definitely
    fail since we don''t have any code in place to support the test. If the test fails,
    then we are sure that the test has been written correctly. Write the development
    Now it''s time to make our test pass by writing only the required code to make
    the test pass. It is strongly recommended not to write more code in this step.
    Writing more code results in what is called Gold Plating where you are just giving
    additional features that are not required at the present moment. Check to see
    that the test Run our first test again and this time it should pass. This helps
    to ensure that all the correct development code is in place and we can move on
    to the next test. Refactor the In the iterative TDD process, we need to make sure
    that we have not introduced any duplication, all the design principles are met
    and the methods are where they are supposed to be, that is, logically grouped
    together in a class. Repeat with new Next we write new tests for new requirements
    and repeat steps 1-5 to ensure that the correct code is written and only the required
    code is written. TDD will help you build a near defect free application using
    the minimum amount of code. There are many tools in the market for TDD one of
    them being JUnit. Since this book is focussed on BDD, we won’t go into details
    about testing with JUnit. 1.2 What is BDD? BDD is an extension of TDD that makes
    use of a simple, Domain Specific Language The DSL is in plain English and convert
    natural language statements into executable tests. The DSL that we are going to
    study in this book is known by the name Gherkin. The term Gherkin however is specific
    to Cucumber, JBehave, Behave and Behat software tools. BDD focuses on:  Where
    to start What to test and what to exclude How much to test What to name the tests Understanding
    why a test fails Let''s get our hands dirty with the first DSL in Gherkin.  Cash
    withdrawal from ATM Successful cash withdrawal Given the account balance is $100 And
    the card is valid And the ATM contains sufficient money When the account holder
    requests $20 Then the cashslot should dispense $20 And the account balance should
    be $80 And the card should be returned  These very simple English statements can
    be split into three distinct sections.  Context: This defines the starting state ![](image-3wwgl62z.jpg) Figure
    1.1: Example of Given keyword Event: This defines the user''s action or actions ![](image-4jfnsitl.jpg) Figure
    1.2: Example of When keyword Outcomes: This defines the expected results ![](image-kbxrlcvo.jpg) Figure
    1.3: Example of ‘Then’ and ‘And’ keywords  The words highlighted in Bold like
    ‘’‘’’’“Given”, “When”, “Then” and ‘’“And‘’ are known as Cucumber Let’s have a
    look at each of these keywords  The purpose of Given is to put the system in a
    known state before the user starts interacting with the system. The purpose of
    When steps is to describe the key action the user performs. The purpose of Then
    steps is to observe outcomes. The observations should be related in some way to
    the business value in your feature description. The observations should also be
    on some kind of output – that is values that come out of the system. Used to connect
    multiple Given, When and Then steps. The above Domain Specific Language has the
    Feature and Scenario steps also. We will cover each of these steps in detail when
    we start designing the Page Object Model Framework. We are now ready to get introduced
    to Cucumber. 1.3 What is Cucumber? Cucumber is a tool based on the BDD Framework.
    Cucumber makes use of Gherkin keywords. Gherkin is a DSL which is used in Cucumber
    to create test cases. Rather than building linear pieces of code, it is best to
    understand Cucumber by building a framework of some sort. The framework that can
    be used for Cucumber is Page Object which is based on the Page Object Design Pattern.
    We will understand the Page Object Pattern throughout this book, but let’s understand
    how Cucumber is structured and once we understand that, we will go deeper into
    understanding how Cucumber fits into the Page Object Model Framework. To get a
    feel of Cucumber, you may visit www.cucumber.io which gives much detail about
    Cucumber. 1.3.1 Structure of Cucumber Cucumber comprises three components viz.
    Runner class, Feature Files and Step Definition classes. Ideally in a scenario
    where you have no framework, these are all the components you need to execute
    Cucumber feature file scenarios. Generally, projects are implemented using Frameworks
    and in the case of Page Object Model Framework, apart from the three mandatory
    components mentioned above, we have another set called Page Object These are Java
    classes with each page in the Application Under Test corresponding to one Page
    object class. Thus there is one to one correspondence between Page Objects and
    Pages in the AUT. When we start designing page objects, we will see how to utilize
    the concept of inheritance to keep code clean and to avoid code duplication. A
    very important principle exists known as Don’t Repeat Yourself which we will see
    next. Generally, the default language for the Test Runner class is JUNIT but in
    this book we will see how to use TestNG for driving the framework. Just because
    we will use TestNG, we will also make use of TestNG xml to drive the framework.
    For creating Test Suites in Cucumber, we will make use of something called Using
    Tags proves to be extremely helpful while working with test suites. 1.4 Understanding
    the DRY principle ‘DRY’ simply means Don’t Repeat Yourself. What this means is
    that we write the methods pertaining to web elements on a web page in one class.
    These methods can pertain to clicking a button or entering values in a test box.
    To be precise, that one class will have as many methods as there are web elements. So
    rather We would write something like the code line shown below in the class which
    corresponds to the webpage. Suppose we are dealing with the login page and there
    is a button with id as ‘Login’ WebElement btnLogin = driver.findElement(By.id(’Login’));clickLogin(btnLogin); This
    is always better than doing something like this everywhere in your tests where
    the Login page is involved. Driver.findElement(By.id(’Login’)).click(); The hard
    coded value can be replaced by dynamic or static locators which we will see when
    we look at Page Objects. 1.5 Components of Cucumber Framework As every other framework,
    Cucumber also has well defined components. Cucumber has three main components
    which are Runner class, Feature Files and Step Definition files. Apart from these
    basic components, we will be using Maven and Jenkins. We will learn about Maven
    and Jenkins in subsequent chapters but now we mainly focus on the three main components
    which are Runner class, Feature Files, and Step Definition files. 1.5.1 Runner
    class This is the class that triggers the framework. The components of the class
