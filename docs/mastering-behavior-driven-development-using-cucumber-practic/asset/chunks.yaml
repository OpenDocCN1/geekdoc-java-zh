    the multiple feature files with the help of tags Examine the Cucumber-JVM reports Let’s
    start by understanding the <testfailureignore></testfailureignore>tag of the Maven
    Surefire plugin which will help in the continuation of the test execution even
    if scenarios fail. 11.1 Understanding the <testfailureignore></testfailureignore>tag On
    occasions where there are hundreds of tests to be executed, we may want to continue
    execution even if few of the tests fail. The feature file design should be such
    that the tests are mutually independent of each other and can execute without
    a dependency on other feature files. The <testfailureignore></testfailureignore>tag
    helps to ignore failures in the test execution and move to the next scenario.
    The scenario design should be such that each of the scenarios should be a complete
    one. If a scenario opens a browser window, then the same scenario should close
    the browser window so that the next scenario starts afresh without stale browser
    sessions. The xml fragment from the POM xml is shown as follows: <groupid>org.apache.maven.plugins</groupid><artifactid>maven-surefire-plugin</artifactid><version>2.14.1</version><configuration></configuration><suitexmlfile>testng.xml</suitexmlfile><skiptests>false</skiptests><testfailureignore>true</testfailureignore> As
    shown in the preceding code, we will ignore test failures in our test execution
    so that all scenarios in all the feature files get executed and we get a consolidated
    output. 11.2 Understand the maven-cucumber-reporting plugin This chapter is about
    the Cucumber JVM reports for which we need to configure a plugin called the maven-cucumber-reporter
    plugin. This plugin will help in the generation of the Cucumber JVM reports. The
    plugin is shown as follows: <groupid>net.masterthought</groupid><artifactid>maven-cucumber-reporting</artifactid><version>2.8.0</version><id>execution</id><phase>verify</phase><goals></goals><goal>generate</goal><configuration></configuration><projectname>cucumberpom</projectname><skip>false</skip><outputdirectory>target/cucumber-reports/advanced-reports</outputdirectory><cucumberoutput>target/cucumber-reports</cucumberoutput><inputdirectory>${project.build.directory}/cucumber-reports</inputdirectory><param
    class="calibre28">**/*.json <enableflashcharts>true</enableflashcharts> The main
    tags to note in this plugin are listed as follows:  This gives the details of
    what exactly has to be executed. The phase is specified as ‘verify’ and the goal
    is specified as generate. We will run which will automatically run the verify
    and use the generate goal to create the reports. Configuration - The report directory
    location is mentioned in the configuration section. The JSON output once created
    will be placed at the location specified in the tag and the Cucumber JVM reports
    will be placed at the location specified in The JSON files that should be picked
    up for generating the reports are mentioned in the tag. Now that we have the reporting
    plugin set up, we will see how we can capture the screenshot for failed scenario
    steps and embed within the scenario so that we can view the screenshot in the
    JVM report. 11.3 Capturing screenshots of failed scenario steps A very common
    practice in test automation is capturing screenshots when a failure occurs. Selenium
    provides us with the TakesScreenshot interface and the getScreenshotAs() method.
    The TakesScreenshot interface is used for capturing the screenshot and storing
    it in a specified location. We will capture the screenshot of the entire page.
    After taking the screenshot, it needs to be stored somewhere at a convenient location.
    Cucumber provides the embed(byte[], String) method for embedding the screenshot
    directly into the Cucumber JVM report. The screenshot is stored in a byte array
    which is then passed to the embed method which places the screenshot in the Cucumber
    JVM report. We will place the method for taking screenshots on failure in the
    method annotated with @After so that it runs at the end of the scenario. The After
    Hook is shown as follows: package stepdefinitions; import org.openqa.selenium.OutputType;import
    org.openqa.selenium.TakesScreenshot; import cucumber.api.Scenario;import cucumber.api.java.After;import
    locators.HomepageLocators;import pageobjects.AbstractBasePage;import singletondriver.SingletonDriver;import
    utils.Assertions; public class BPBSD_99 {@Afterpublic void tearDown(Scenario scenario)
    {if (scenario.isFailed()) {byte[] screenPrint = ((TakesScreenshot)SingletonDriver.getInstance().getDrvr()).getScreenshotAs(OutputType.BYTES);scenario.embed(screenPrint,
    "image/png");}try {if (!(SingletonDriver.getInstance().getSessId()==null)) {SingletonDriver.getInstance().getDrvr().close();SingletonDriver.getInstance().getDrvr().quit();}}
    catch (Exception e) {e.printStackTrace();}}} We will take a look at the output
    when we verify the JVM report. 11.4 Modifying the Test Runner for Cucumber JVM
    reports Till now we have been using a Test Runner with @DataProvider, and @AfterClass
