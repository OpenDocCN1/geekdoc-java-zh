    is a test automation framework where NG represents the next generation.TestNG
    is a combination of JUnit (in Java) and NUnit (in C#). It is frequently used for
    unit, functional, integration, and end-to-end testing. TestNG has become very
    popular in the test automation area within a short time and has become one of
    the most widely used testing frameworks among developers (both application and
    test automation developers). It mainly uses annotations in Java to configure and
    write test methods. TestNG was introduced by Cedric Beust. He developed it to
    overcome shortcomings in JUnit. A few of the features of TestNG are as follows:  Additional
    before and after annotations like @AfterTest @AfterClass Grouping test methods
    by creating TestNG groups Incorporating dependencies using dependsOn Executing
    tests in parallel Basic test execution reporting TestNG is a testing framework
    which is written in Java and can be used with Java and also with Java-related
    languages such as Groovy. In TestNG, suites and tests are configured through the
    use of XML files. By default, the name of this file is testng.xml, but it can
    be given another name if need be. TestNG enables us to do test configuration through
    XML files and allows us to include (or exclude) respective packages, classes,
    and methods in the test suite. It also allows users to group test methods into
    particular named groups, which can be included or excluded as part of the test
    execution. Parameterization of test methods is easy using TestNG, and it also
    provides the facility of creating data-driven tests. TestNG has exposed its API,
    which has made it easy to add custom functionalities or extensions if required. 7.2
    Configuring the TestNG framework in Eclipse In Chapter 1: Introduction to Behavior
