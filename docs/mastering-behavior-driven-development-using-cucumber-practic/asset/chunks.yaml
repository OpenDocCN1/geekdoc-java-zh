    Once extracted, the folder structure should include the folders mentioned as follows:  This
    contains the required files to run Maven on different platforms. This contains
    the settings.xml file which can be used to configure certain Maven settings. This
    contains the required jar files for Maven to start. This contains the libraries
    used by Maven along with an ext folder which contains third-party extensions to
    change the default Maven implementation. Once Maven is downloaded and extracted,
    we need to add a new environment variable and edit the Environment variable. 8.2
    Configuring M2_HOME and path environment variables Now that Maven is downloaded
    and extracted, let’s add the M2_HOME environment variable as follows:  Open Control
    Panel | All Control Panel Items | System on the computer. Choose Advanced system
    settings. Click on Add the M2_HOME environment variable and set its value to the
