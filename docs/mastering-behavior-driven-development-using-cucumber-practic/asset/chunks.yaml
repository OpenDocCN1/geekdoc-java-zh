    8.1: Checking the Maven installation If the text similar to the preceding screenshot
    gets displayed, we are sure that Maven has been installed successfully. Now that
    Maven is installed, let’s start understanding concepts related to Maven. We will
    begin by understanding the repository concept in Maven. 8.3 Understanding Maven
    local and central repositories A repository in Maven is a physical directory that
    contains JAR files along with meta data about the JAR files. The meta data is
    in the form of POM files which has project information and other external dependencies
    that the JAR file has. There are two kinds of repositories, namely, Local and
    Central. Let’s understand the difference between the two:  Local This resides
    on the developer’s machine in C:\Users\pinakin.chaubal\.m2\repository. Central
    This is located at When a Maven build job is run, Maven tries to locate the dependency
    in the local repository and if it is unable to find the dependency in the local
    repository, the dependency gets downloaded from the Central Repository into the
    .m2 folder mentioned above. When we learn about the POM XML file, we will see
    how to mention dependencies of the project along with the versions. Let’s learn
    a little about the build phases in Maven. 8.4 Learning about Maven build lifecycle
    phases and goals Maven is based on the concept of a build lifecycle where the
    process of building and distributing a particular artifact is defined clearly.
    The person in charge of the project build has to know only a limited number of
    commands to run a Maven project and the POM file takes care of getting this done
    for us. There are three build lifecycles that are built in, namely, default, clean,
    and site. A brief description of the three build lifecycles is given as follows:  default
    This handles the project deployment. clean This handles the project cleaning. site
    This handles the project’s site documentation. Each build lifecycle is defined
    by a different list of build phases. A build phase is nothing but a stage in the
    lifecycle. As an example, let’s consider the default lifecycle which comprises
    the following phases:  The project is validated for correctness and availability
    of necessary information. This is used for compilation of the source code of the
    project. The compiled source code is tested using a unit testing framework like
    TestNG or Junit. The compiled code is packaged into a distributable format like
    JAR. Checks are run on the results of integration tests to ensure quality of deliverables. The
    package is installed in the local repository so that it can be used as a dependency
    for other projects locally. This is done in the build environment where the final
    package is copied to the remote repository so that it can be used by other projects. In
    our case, when we say ‘mvn test’, the validate and compile phases get executed
    before the test phase. The default lifecycle phases get executed in order, starting
    from validate and ending at the desired phase. Let’s understand the concept of
    plugin goals. A plugin goal represents a task which is fine grained than a build
    phase and contributes to the building and managing of a project. It may be bound
    to either zero or more build phases. A goal that is not bound to any build phase
    can be executed independently outside the build lifecycle through direct invocation. Let’s
    take a look at the pom.xml in detail. 8.5 Understanding the pom.xml In this section,
    we will understand what the pom.xml file is and what goes into it. POM stands
    for Project Object Model and the pom.xml is used for configurations of a Maven
    Project. The pom.xml file is based on a specific schema as indicated in the tag
    shown as follows: <project _="" span="">xmlns="http://maven.apache.org/POM/4.0.0"
    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0
    http://maven.apache.org/xsd/maven-4.0.0.xsd"></project> The version of the schema
    is indicated in the tag as follows: <modelversion>4.0.0</modelversion> The group
    ID is indicated by the groupId tag and it is a unique ID for the organization
    indicated as a reverse domain name as follows: <groupid>bpb.cucumber</groupid> The
    artifact ID indicates the name of the project as follows: <artifactid>cucumberpom</artifactid> The
    version tag relates to the specific instance of our project. ‘SNAPSHOT’ indicates
    that this is work in progress: <version>0.0.1-SNAPSHOT</version> The build tag
    specifies the plugins to be used in the project. In our case, we have two plugins
    specified in the POM.XML file, namely, the Maven Compiler Plugin and Maven Surefire
    plugin. The dependencies tag specifies all the external dependencies in the form
    of JAR files required for the project. These dependencies are downloaded automatically
    when the pom file is saved. That is all that is needed to know about the POM file
    as far as our framework is concerned. Let’s now learn about Maven profiles. 8.6
    Learning about Maven profiles A portable build is one that works on different
    platforms and runtime environments. Profiles can be used to build the same project
    in a different manner depending on the platform and environment. In order to view
    Maven profiles, open the file in the conf folder as shown in the following screenshot: ![](image-y4gca4or.jpg) Figure
    8.2: The settings.xml file in Maven folder View the Profile tag that is commented
    in the file is shown as follows: <id>env-dev</id><activation></activation><name>target-env</name><value>dev</value><tomcatpath>/path/to/tomcat/instance</tomcatpath> Maven
    provides us with the following three types of profiles:  Global profile defined
    in the settings.xml in the Maven home directory. Per project profile defined in
    the pom file of the project. Per user profile defined in the user settings in
    the .m2 folder under the User’s home folder. Let’s take a look at how to add a
    new profile. 8.7 Adding a new Maven profile In the pom file under your project,
    add the code as follows: <id>sit</id><activation></activation><activebydefault>false</activebydefault> There
    are two ways to create a profile. In the Setting xml file or project’s pom file,
