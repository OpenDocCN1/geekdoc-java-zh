    a vast and very active area of research, was impossible to deep-dive into different
    class of problems in a single book, that too by not making it voluminous.Preface This
    book covers the Cucumber BDD test automation tool. BDD stands for Behavior driven
    development. BDD is an extension of TDD that makes use of a simple, Domain Specific
    Language (DSL). The DSL is in plain English and converts natural language statements
    into executable tests. The DSL that we are going to study in this book is known
    by the name Gherkin. The term Gherkin however is specific to Cucumber, JBehave,
    Behave and Behat software tools. This book will be divided into three sections: Section
    1 will explore what Cucumber is along with the building blocks such as Feature
    files, Step Definition classes and Runner classes. These will form the foundation
    for getting up-to-speed with Cucumber. Section 2 will explore the Page Object
    design pattern and make the reader understand Page Objects and Page Factories. Section
    3 will explore the integration part of Cucumber with TestNG and Maven. We will
    be putting the Maven build in Jenkins and thus configure Jenkins for automatic
    triggering on completion of a Dev build. After reading this book, the test engineer
    will be conversant with incorporating Cucumber as a BDD framework in his testing
    and thus streamlining the testing and bug detection process. Section I Chapter
    1 makes you understand the concept of Test Driven Development(TDD) followed by
    Behavior Driven Development(BDD).TDD stands for Test Driven Development. Chapter
    describes the Feature files which are the documents that contain Gherkin scenarios
    and requirements – they can be very useful to teams working on BDD. Feature file
    is a key deliverable for BAs. Feature files are where BAs store the requirements
    in Gherkin format and create the bridge between requirements and automated tests. Chapter
    3 describes about the Gherkin statements which are present in the Feature files
    and are translated into code using what is called a Step Definition. It is the
    bridge between the utility Java classes which will be the Page Objects and the
    Feature files. The Step Definition files contain regular expressions in addition
    to Java code. Chapter 4 will cover the test runner class which also acts as an
    interlink between feature files and step definition classes. It is in the test
    runner class, that you provide the path for both feature file and step definition
    class. Section II Chapter 5 onwards, we will jump into action by first understanding
    the Page Object Design Pattern and Page Object Model. We will the create Page
    Objects for all the individual Web Pages in the Application Under Test[AUT]. A
    page object contains logic for working with all HTML objects on the Page. Chapter
    6 will cover the PageFactory Class in Selenium which is an extension to the Page
    Object design pattern. It is used to initialize the elements of the Page Object
    or instantiate the Page Objects itself. It is used to initialize elements of a
    Page class without having to use ''FindElement'' or ''FindElements''. We will
    create Page factories fr static web elements. Section III Chapter 7 will cover
    TestNG in Selenium which is a testing framework in Java, inspired by JUnit and
    NUnit. It overcomes the constraints of JUnit. From simple unit testing to complex
    integrated testing, it simplifies all testing requirements such as functional
    testing, regression, end-to-end testing and more. We will create a TestNG xml
    file and configure our tests. Chapter 8 will cover Apache Maven, which is a software
    project management and comprehension tool. Based on the concept of a project object
    model (POM), Maven can manage a project''s build, reporting and documentation
    from a central piece of information. Chapter 9 will show us one can execute a
    Maven Project from Eclipse IDE and later externalize the execution process from
    command line. This is required because we will be integrating the Maven build
    in Jenkins. Chapter 10 will cover the configuration of POM.xml to execute the
    TestNG xml which will eventually run our Cucumber tests. The POM.xml will be the
    single execution engine for our framework. We will see how to execute the TestNG
    xml from Maven''s POM.xml. Chapter 11 will be configuring the Cucumber Reporter
    in the runner class and generate reports with statistics for our framework. Chapter
    12 will show how we can configure graphical extent reports for our project using
    Extent Reports, which gives more insight on the test execution status. Chapter
    13 will cover the execution of Cucumber features parallelly using TestNG XML and
    the ThreadLocal class of Java. Parallel execution speeds up the overall test execution
    thus reducing time for test completion Chapter 14 will first cover Jenkins and
    then we will be integrating the framework with Jenkins and doing configurations
    for auto trigger.Downloading the codebundle and coloured images: Please follow
