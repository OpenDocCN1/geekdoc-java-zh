    Outline: Title of your scenario outlineGiven I want to write a step with<name></name>When
    I check for the <value></value>in stepThen I verify the <status></status>in step Examples:|
    name  | value | status  || name1 | 5 | success || name2 | 7 | Fail    | 2.2 Introducing
    feature, scenario, and scenario outline A feature file consists of the following
    keywords: Feature and Scenario or Scenario outline. Let’s understand each keyword
    in detail. 2.2.1 Feature In Cucumber, feature files specify business needs or
    requirements. The title of the feature file immediately follows the feature keyword
    and is on the same line. Three (optional) text lines may follow the line having
    the feature keyword and specify the intent of the feature file. Feature files
    contain Scenario or Scenario Outline. 2.2.2 Scenario Scenarios are similar to
    test cases in manual testing. They start with the Scenario keyword in a new line
    (other than the one in which the feature intent is present). The Scenario Title
    follows the Scenario keyword and is on the same line as that of the keyword. The
    Intent of the Scenario is specified by three (optional) lines following the line
    in which the Scenario keyword is present. A Scenario consists of steps which make
    use of keywords like and so on. An example of a Scenario is shown as follows: To
    test the login functionality to www.freecrm.com To test a successful login: Given
    User navigates to the login page When User enters as username And User enters
    as password And User clicks the Login button Then User should be shown User Name
    on top left corner Let’s explore Scenario Outline next. 2.2.3 Scenario Outline Scenario
    Outline is used to execute the same scenario multiple times with different sets
    of values. Consider the following two scenarios: To test login functionality to
    www.freecrm.com To test a successful login Given User navigates to the login page When
    User enters as username And User enters as password And User clicks the Login
    button Then User should be shown User Name on top left corner To test a successful
    login Given User navigates to the login page When User enters as username And
    User enters as password And User clicks the Login button Then User should be shown
    User Name on top left corner Notice that the second scenario is a redundant one.
    To eliminate this redundancy, we make use of Scenario Outline shown as follows.
    We will have 2 iterations for this feature. One for and the other for To test
    login functionality to www.freecrm.com Scenario To test a successful login Given
    User navigates to the login page When User enters as username And User enters
    as password And User clicks the Login button Then User should be shown User Name
    on top left corner  | userName                    | password || admin | admin
    || superuser | superuser              | We now move on to understand what each
    keyword (GIVEN, WHEN, THEN, and so on) mean. 2.3 Understanding the different keywords In
    this section, we will understand the meaning of the different keywords used in
    a Scenario. This keyword establishes the initial state of the Application under
    Test so that the subsequent steps will perform operations on the AUT. An example
    of the Given keyword is given as follows: Given User navigates to the login page This
    keyword describes the user action. An example of the When keyword is given as
    follows: When User enters “<username>”</username> as username This keyword describes
    the expected result. An example of the Then keyword is given as follows: Then
    User should be shown User Name on top left corner This keyword is used for statements
    that add to the previous Step/Steps and represent positive statements. And User
    enters “superuser” as password This keyword is used for statements that add to
    the previous Step/Steps and represent negative statements. But I should not see
    "Admin" as the role 2.4 Reusing the same step with different arguments Suppose
    we have two scenarios where we need to check different sets of data shown as follows: To
    test a successful login Given User navigates to the login page When User enters
    as username And User enters as password And User clicks the Login button Then
    User should be shown User Name on top left corner To test a successful login Given
    User navigates to the login page When User enters as username And User enters
    as password And User clicks the Login button Then User should be shown User Name
    on top left corner When these scenarios are executed, the flow of control passes
    into a Step Definition file where we will see a method similar to the one as follows: @When("^User
    enters \"(.*?)\" as username$")public void User_enters_as_username(String userName)
    {//print the value of data passed from Feature fileSystem.out.println(userName);} Output: adminsuperuser The
    \"(.*?)\" in the preceding code is known as a Regular Let’s understand each part
    of this regular expression.  ‘*’ represents zero or more occurrences of the preceding
    element. ‘?’ represents zero or one occurrences of the preceding element. ‘.’
    represents a single character except the NewLine character. We will understand
    new regular expressions as and when we encounter them. 2.5 Using complex data
    types In this section, we will use a table with a step shown as follows. The ‘Then’
    step runs three times with different usernames. To test a successful login Given
    User navigates to the login page Then Verify that following users are able to
    Login | userName    | password  || KamleshP    | xyz || RamK        | abc || MikeP
    | mkpe      | The corresponding step definition contains the following method.
    Here, we make use of the DataTable to pull the step table data into a List of
    String: @Then("^Verify that following users are able to Login$")public void verify_that_following_users_are_able_to_Login(DataTable
    loginDetails){//Write the code to handle Data TableList<list_string>></list_string>
    loginData = loginDetails.raw();System.out.println(loginData.get(1).get(0));} Output: KamleshP 2.6
