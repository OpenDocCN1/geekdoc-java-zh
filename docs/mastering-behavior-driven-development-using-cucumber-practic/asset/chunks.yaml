    difference between Explain what a Design Pattern is.CHAPTER 2 Understanding Feature
    Files We will begin by understanding the components of the Cucumber framework
    in this chapter with the first component which is feature files. Feature files
    are mostly written in plain English but can be written in other supported languages.
    They specify a business requirement, for example, logging into a web application
    and verifying whether the title is correct. This business requirement is specified
    as a sequence of steps which instruct the system of what action has to be taken
    in order to fulfil the business requirement. We will thoroughly understand the
    different components of a feature file. We will start from a basic feature with
    one scenario and later build multiple scenarios with different steps using Gherkin
    keywords like Given, When, Then, And, But, and so on. The reader will understand
    how easy it is to learn Cucumber feature files and can start developing complex
    feature files. This chapter will predominantly focus on:  Feature files Creating
    feature files Plug-in for Feature files Introducing feature, Scenario, and Scenario
    outline Understanding the different keywords Reusing the same step with different
    arguments Using complex data types Understanding DocStrings Background step Feature
    file in a different language Designing complex feature files Introducing Tags Objectives After
    reading this chapter, the reader will be able to:  Create complex feature files. Understand
    the concepts of Scenario and Scenario outline. Learn how to pass arguments in
    steps. Understand the usage of complex data types. Grasp the concepts of feature
    files using examples 2.1 What are feature files? Feature files are files that
    have tests written in a descriptive language like English. It is the entry point
    for the Cucumber framework. Of course, to execute our tests from Jenkins, we will
    put a testNG.xml and a Runner class with cucumber tags. This will form a layer
    over the feature file. The following is a sample feature file to log in to the
    freecrm website: Feature: To test login functionality to www.freecrm.comScenario:
    To test a successful loginGiven User navigates to the login pageWhen User enters
    “admin” as usernameAnd User enters “admin” as passwordAnd User clicks the Login
    buttonThen User should be shown User Name on top left corner A feature file contains
    certain in-built keywords like ‘Feature’, ‘Scenario’, ‘Given’, ‘When’, ‘And’,
    ‘But’, ‘Then’, and so on. These are keywords defined in a language known as Gherkin.
    Gherkin has more keywords apart from the ones shown here, but we will go with
    the ones mentioned here and understand what each keyword does. 2.1.1 Creating
    feature files in IDE Open Eclipse IDE and under src.test.resources create a package
