    be designed which can pull data from the data tables present in the feature files. 1.5.2
    Feature Files Feature files are our test cases in simple words. These test cases
    can be designed by anyone in the team and are in simple English language. The
    extension of Feature files is The language used in the feature file is called
    Gherkin which is English like and contains keywords like ‘GIVEN’,’WHEN’, ‘THEN’,
    ‘OR’, ‘BUT’, and so on. We have already seen the structure of feature files earlier
    in this chapter. Chapter 2, Understanding Feature Files is dedicated to Feature
    files. 1.5.3 Step Definition Files These are files that get generated for us with
    dummy methods when we run the feature file by right clicking on the feature file
    in Eclipse and clicking As Cucumber The dummy step definition methods look like
    this: @Given(“^User is on the home page$”)Public void user_is_on_the_home_page()
    throws Throwable {Throw new PendingException();} The user has to add code at the
    place where it says new The name of the method is immaterial. The methods will
    be executed based on the match of the regular expression with that of the feature
    file. So in this case, there should be a Gherkin keyword ‘GIVEN’ in the feature
    file followed by is on the home Chapter 3, Step Definitions is dedicated to Step
    Definition files. Apart from these three components, there might be Java classes
    that act as page objects. There has to be one java class for each screen or page. Next,
    lets learn about Design Patterns that we will implement in this book. 1.6 Design
    pattern This book has been written based on the Page Factory Design Pattern. Page
    Factory Design Pattern optimizes the Page Object Model pattern. In Page Factory
    pattern, we use @FindBy keyword and initElements method. We will see how to use
