    \ About the Author\nPinakin Chaubal is a BE (Computer Science) Graduate with over\
    \ 19 years of work experience in the IT domain. He is a certified `PMP`, `ISTQB`,\
    \ `HP0-M47` (QTP 11.0 Functional testing expert) and `INS-21` (General Insurance).\
    \ He is working as an Automation Architect at Intellect Design Arena Ltd (earlier\
    \ known as Polaris Consulting). Prior to this, he has worked with companies such\
    \ as Patni, Accenture, ACS International (USA), L&T Infotech (USA & India), Polaris\
    \ Financial Technology and SQS. He carries 6 years of onsite experience in the\
    \ US and 8 months in Hong Kong and China working closely with the clients and\
    \ being a part of senior management and stakeholder meetings. The clients that\
    \ he has worked for include YES Bank, HSBC, Travelers Insurance, Harleysville\
    \ insurance, Albertsons retail chain, Bellsouth Telecommunications, GE-Fleet Services,\
    \ and GE-Supply. He is the creator of the YouTube channel 'Automation Geek', which\
    \ teaches PMP, ISTQB, Test Automation using Selenium and Cucumber and Performance\
    \ testing using JMeter 3.0. He is the author of ‘Page Object Model using Selenium\
    \ WebDriver and Java’, ‘Selenium WebDriver Quick Start Guide’ published by Packt\
    \ Publishing, and ‘Selenium Framework design with Keyword Driven Testing’ published\
    \ by BPB Publications. He is also the reviewer of the newly released book on Selenium\
    \ Frameworks - 'Selenium Framework Design in Data Driven Testing' by Carl Cocchiaro.\n\
    \n### About the Reviewers\nNarottam Singh is a Software Development Engineer in\
    \ Test with over 10 years of experience in delivering quality products. Currently,\
    \ his responsibilities include end-to-end testing (manual and automation) of mobile\
    \ apps on Android and iOS platforms. So far, he has got the opportunity to work\
    \ on few hottest technologies in the software industry i.e. Elastic search, Kafka,\
    \ OpenShift and Test Automation (Web, Rest-API and Mobile Apps). He has worked\
    \ with `JAVA`, `Python`, `Node.js`, `Selenium`, `Cypress.io` and `Linux` programming\
    \ languages for Test Automation. During his journey with various organizations,\
    \ Narottam learned that quality of the product is utmost important for client\
    \ and end-user satisfaction. He always believes that if something is built with\
    \ quality paradigms, it makes the customer's life easy.\nLinkedIn: `https://www.linkedin.com/in/narottamgla`\n\
    GitHub: `https://github.com/narottamgla`\n\nGarima Chauhan is a Software Development\
    \ Engineer in Test with over 6 years of experience in implementing quality products.\
    \ Currently, she is working for Walmart as a Quality Engineer III. She is responsible\
    \ for end-to-end testing (manual and automation) of mobile apps on Android and\
    \ iOS platforms. So far, she has worked in almost 5 verticals of testing i.e.\
    \ Manual, Automation, Load, Performance and A/B testing. To deliver stable and\
    \ bug-free products, she has started learning automation testing. She has worked\
    \ with `JAVA`, `Python`, `Selenium`, `JavaScript`, `Linux` programming languages\
    \ and implemented tests. Garima started her career with a B2B company RechargeItNow\
    \ with manual testing as an Associate Quality Engineer. Later, she worked for\
    \ Citrus Payments Solutions and PayU as a Lead Software Engineer for almost 5\
    \ years. She worked as a Lead Software Engineer in Test and delivered fully tested\
    \ products to facilitate users a bug free experience during payments flow.\n\n\
    All the products are live and are used by merchants like Hotstar, GoAir, Dream\
    \ 11, NDTV Gadgets, Big Basket, Lenskart, Zee, Videocon and many more... She worked\
    \ for Sequoia Consulting Group which is a US based company that works in the health\
    \ insurance and HR management domain. At this organization, she learned how to\
    \ test or validate high volumes of sensitive data which is entirely a combination\
    \ of manual and automation testing effort. She spent 1 year at this organization\
    \ and learned different ways of testing and mainly worked on micro-services, API’s\
    \ and website portals. Garima loves to spend time on testing things and her hobbies\
    \ include traveling, yoga, and cooking. She always believe that if something is\
    \ built with quality paradigms, it makes the customer's life easy.\n\n## Acknowledgement\n\
    There are a few people I want to thank for the continued and ongoing support they\
    \ have given me during the writing of this book. First and foremost, I would like\
    \ to thank my parents for continuously encouraging me for writing the book — I\
    \ could have never completed this book without their support. I would like to\
    \ thank Manasi, who is very special to me and who, during the entire course of\
    \ writing this book provided me loads of positivity and support. My gratitude\
    \ also goes to the team at BPB Publications for being supportive enough to provide\
    \ me quite a long time to finish the first part of the book. Thanks for allowing\
    \ me to publish the book in multiple parts, since image processing, being a vast\
    \ and very active area of research, was impossible to deep-dive into different\
    \ class of problems in a single book, that too by not making it voluminous.\n\n\
    ## Preface\nThis book covers the Cucumber BDD test automation tool. BDD stands\
    \ for Behavior driven development. BDD is an extension of TDD that makes use of\
    \ a simple, Domain Specific Language (DSL). The DSL is in plain English and converts\
    \ natural language statements into executable tests. The DSL that we are going\
    \ to study in this book is known by the name Gherkin. The term Gherkin however\
    \ is specific to `Cucumber`, `JBehave`, `Behave` and `Behat` software tools. \n\
    \nThis book will be divided into three sections:\n- **Section 1** will explore\
    \ what Cucumber is along with the building blocks such as `Feature files`, `Step\
    \ Definition classes` and `Runner classes`.\n- **Section 2** will explore the\
    \ `Page Object` design pattern and make the reader understand `Page Objects` and\
    \ `Factories`.\n- **Section 3** will explore the integration part of Cucumber\
    \ with `TestNG` and `Maven`.\n\nAfter reading this book, the test engineer will\
    \ be conversant with incorporating Cucumber as BDD framework in his testing and\
    \ thus streamlining the testing process.\n\n## Section I: Introduction to Behavior\
    \ Driven Development\n### Chapter 1\nChapter 1 makes you understand the concept\
    \ of Test Driven Development(TDD) followed by Behavior Driven Development(BDD).\
    \ TDD stands for Test Driven Development.\n\n### Chapter 2\nChapter 2 describes\
    \ the `Feature files` which contain Gherkin scenarios – they can be very useful\
    \ for teams working on BDD.\n\n### Chapter 3\nChapter 3 describes about `Step\
    \ Definitions`.\n\n## Section II: Page Object Model\n### Chapter 4\nChapter 4\
    \ onwards, we will jump into action by first understanding the `Page Object` Design\
    \ Pattern and `Page Object Model`.\n\n### Chapter 5\nChapter 5 will cover the\
    \ `Page Object` class (AUT).\n\n### Chapter 6\nChapter 6 will cover the `PageFactory`\
    \ class in `Selenium`.\n\n## Section III: TestNG\n### Chapter 7\nChapter 7 will\
    \ cover `TestNG` in `Selenium`.\n\n### Chapter 8\nChapter 8 will cover `Apache\
    \ Maven` and Learning About `pom.xml`.\n\n### Chapter 9\nChapter 9 shows Test\
    \ Execution with `Maven` and `Log4J`.\n\n### Chapter 10\nChapter 10 will cover\
    \ the configuration of `POM.xml` to trigger `TestNG`.\n\n*(Note: The provided\
