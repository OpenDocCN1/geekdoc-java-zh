    thing we do in this Step Definition is to create an object of the LandingPage.
    Using this object, we open a Chrome browser, navigate to the URL, and click on
    the Login button. Notice that the methods for opening a browser and navigating
    to the URL are present in the AbstractBasePage and not in the landing page, but
    since we have extended the Abstract Base Page for all our page objects, we can
    use the LandingPage object to invoke methods in the Abstract Base Page. The LandingStepDef
    Step Definition that makes use of the LandingPage page object is shown as follows: package
    stepdefinitions; import constants.GLOBAL_DATA;import cucumber.api.java.en.Given;import
    cucumber.api.java.en.When;import pageobjects.LandingPage; public class LandingStepDef
    {LandingPage = new LandingPage();@Given("^I open the \"([^\"]*)\" browser on \"([^\"]*)\"
    and \"([^\"]*)\"$")public void i_open_the_browser_on_and(String browser, String
    platform, String gridSetting) throws Throwable {landingPage.openBrowser(browser,
    platform, gridSetting);} @When("^User navigates to the landing page$")public void
    user_navigates_to_the_landing_page() throws Throwable {landingPage.navigateURL();} @When("^clicks
    the Login button on the landing page$")public void clicks_the_Login_button_on_the_landing_page()
    throws Throwable {landingPage.clickLogin();}} Now that we have navigated to the
    Login Page, let’s move on to the Login Page Step Definition. 5.6.2 Login Page
    Step Definition Next in our list is the design of the Login Page Step Definition.
    Here, our task is to enter the email, password, and then click on the Login button.
    The code for the Login Page Step Definition is shown below. It basically has the
    same structure as the Landing Page Step Definition. We create an object of the
    LoginPage and then we enter the UserName, Password, and then click on the Login
    button using this object. LoginStepDef makes use of the LoginPage page object
    as follows: package stepdefinitions; import cucumber.api.java.en.And;import cucumber.api.java.en.When;import
    pageobjects.LoginPage; public class LoginStepDef {LoginPage = new LoginPage();@When("^User
    enters \"(.*?)\" as username$")public void user_enters_admin_as_username(String
    userName) throws Throwable {System.out.println("UserName is: "+userName);loginPage.enterUserName(userName);} @And("^User
    enters \"(.*?)\" as password$")public void user_enters_admin_as_password(String
    password) throws Throwable {System.out.println("Password is: "+password);loginPage.enterPassword(password);} @And("^User
    clicks the Login button$")public void user_clicks_the_Login_button() throws Throwable
    {System.out.println("Login button clicked");loginPage.clickLogin();}} Finally,
    we move to the Homepage step definition. 5.6.3 Home Page step definition The Home
    Page step definition has a similar code structure to the landing page step definition
    and login page step definition. The code listing is given as follows: package
    stepdefinitions; import cucumber.api.java.en.Then;import pageobjects.Homepage; public
    class HomePageStepDef {Homepage = new Homepage();@Then("^User should be shown
    \"(.*?)\" on top left corner$")public void user_should_be_shown_User_Name_on_top_left_corner(String
    userDisplayText) throws Throwable {System.out.println("UserName verified");homePage.verifyUser(userDisplayText);}} This
    is a comparatively small code listing, wherein we just validate the text displayed
    on top of the page with that passed from the Feature file. We have used the Assert
    class to accomplish this and the Assert class verification is what we will see
    next. 5.7 Verification of text on a page using the Assert class In the code listing
    of section we have invoked the verifyUser(String) method from the Homepage Page
    Object. This Page Object had made use of the assertEquals method from the Assert
    class. This method is provided the following arguments: an actual string and an
    expected string. The actual string is the text extracted from the WebElement named
    userDisplay and this string is extracted using the following code snippet: SingletonDriver.getInstance().getDrvr().findElement(userDisplay).getText() The
    Expected string value is taken from the Feature file. The line from the Feature
    file shown as follows provides this value. Then, the User should be shown on top-left
    hand corner of the page. If we change the string in the preceding line to “Pinakin
    Chaubal1”, the test now fails with an Assertion error shown as follows: ![](image-gqhau6ik.jpg) Figure
    5.3: Assertion failure of Username verification With this, we come to the end
    of this chapter. We covered all concepts related to the Page Object Model without
    Page Factory. Conclusion This chapter covered the concept of the Page Object Model
    without PageFactory using Java. We started by understanding what the Page Object
    Design Pattern is. We learned about the Page Object Model. We learned the BY class
    which is at the heart of the Page Object Model and took a brief look at the methods
    associated with the BY class. We next designed our Login Scenario by creating
    a Feature file. We created the Abstract Base Page class along with the three Page
    Objects for the Landing Page, Login Page, and Home Page. Finally, we saw how to
    verify the text present on the Homepage using the assertEquals method of the Assert
    class. In the next chapter, we will take a look at how to create the Page Objects
    Model with PageFactory. We will take a look at the @FindBy annotation which can
    be used to create a locator. We will also take a look at what @CacheLookup is
    and how it can speed up test execution with the help of WebElement caching. We
    will create a class of Locators and keep it separate from the corresponding Page
    Object. Questions  Explain what a Page Object Model is without PageFactory. Explain
    the components of the ‘BY’ class. Write a small program to take a sample web page
    and create a Page Object for it. Create a Page Object Model for logging into www.gmail.com
    and verifying the UserName. Explain the different methods of the Assert class.CHAPTER
    6 Learning About the Page Object Model Using Page Factory In Chapter 5, Page Object
    Model without Page Factory , we learned how to design Page Objects and used them
    in the Page Object Model framework without Page Factory. We learned the theory
    behind the Page Object Design pattern and then understood the Page Object Model.
    We learned about the BY class and its usage in the design of Page Objects. We
    designed a simple Login Scenario in the form of a Feature file. We created an
    Abstract Base Page which was inherited by the Landing Page, Login Page, and Home
    Page. Finally, we verified the username on the Home Page. In this chapter, we
    will learn about the Page Object Model using PageFactory which is a popular pattern
    in test automation which reduces code duplication and simplifies code and test
    maintenance. PageFactory makes use of the @FindBy annotation which we will learn
    in this chapter. Each AUT page will have two Java classes attached to it, namely,
    the Page Object class itself and the Page Object Locators class which will be
    used by the Page Object class. A concept known as Composition in Java will be
    covered in this respect. We will create a different set of Java classes and a
    Feature file for this chapter. This chapter will make you an expert in designing
    Page Objects and implementing the Page Object Model using PageFactory. By the
    end of this chapter, you will have two classes for each page that we plan to automate. The
    following topics will be covered in this chapter:  Understanding the Page Factory
    Design pattern Learning about the PageFactory class Introducing the @FindBys,
    and @FindAll annotations Understanding the initElements method Designing the Page
    Factory framework Designing a Login Scenario Creating the Page Locators using
    @FindBy Creating the Page Objects Using composition to include the locator in
    the Page Objects Creating the Step Definitions Understanding the @CacheLookup
    annotation Objectives After reading this chapter, the reader will be able to:  Understand
    the Page Factory Design pattern. Learn about the PageFactory class. Understand
    the @FindBys, and @FindAll annotations. Understand the initElements method. Design
    our Page Factory framework. Design a scenario for the test. Create a class for
    locators using the annotation. Create methods to perform operations on these Locators. Call
    these methods from the Step Definition. Get familiar with the @CacheLookup annotation. 6.1
    Understanding the Page Factory Design pattern The Page Factory Design pattern
    is an extension to the Page Object Design pattern but is much more advanced. The
    creation of Page Objects is simplified by using the Page Factory pattern. The
    elements in the Page Objects can be initialized using the static method of the
    PageFactory class which is The PageFactory.initElements() static method takes
    two arguments, namely, the driver instance and the class type, and it returns
    a Page Object with its variables/fields which are initialized. The locators and
    the code using those locators can be in the same or different class. Generally,
    a different class is preferable. The Page Factory Design pattern has the following
    advantages:  The WebElements of a web page are initialized at one go. Since the
    locators are maintained in the Page Object class, the tests are clean with no
    locators scattered in them. Now that we know what a Page Factory Design pattern
    is, let’s take a look at the PageFactory class. 6.2 Learning about the PageFactory
    class The WebDriver library provides us with the PageFactory class so that we
    can create our Page Objects with ease. This ease of creating Page Objects is due
    to the annotations provided by the PageFactory class. WebElements can be pre-defined
    in the class and the PageFactory transforms the WebElements into Proxied objects
    where the Java proxy class is utilized. When the time comes to make use of these
    WebElements, the annotations provided by the PageFactory class transform the proxy
    objects in WebElements so that the WebElements can be used. A two-step process
    needs to be used:  Annotate the variables that we need to use (proxy) in our code. Initialize
    the proxied elements with the initElements() method before using them. Let’s first
    understand how to annotate the variables that we need to proxy. 6.3 Introducing
    the @FindBy, @FindBys, and @FindAll annotations Let us see the various annotations
    that Cucumber provides. We will look at three annotations, namely, @FindBys, and
    Let’s start with the @FindBy annotation. 6.3.1 The @FindBy annotation @FindBy
    is an annotation which specifies the Object Location strategy for a single WebElement
    or list of WebElements. The @FindBy annotation is used to find one or more WebElements
    using single search criteria. If we are sure that our search criteria will return
    a single WebElement, then we can use the annotation as follows: @FindBy(how=How.XPATH,using="//a[@href=''https://ui.freecrm.com'']")public
    WebElement btnLogin; Here, the location strategy is specified using the XPATH
    strategy from the HOW enum. Here, we will find the WebElement with XPath //a[@href=''https://ui.freecrm.com'']
    and assign it to the WebElement If we are not sure about the number of WebElements
    returned by the search criteria, use a Listinstead of a single WebElement as follows: @FindBy(how=How.CLASS_NAME,using="dummyclass")public
    ListtxtBoxes; Here, the location strategy is specified using the CLASS_NAME strategy
    from the HOW enum. Here, we will find the WebElement with Class Name dummyclass
    and assign it to a list of WebElements txtBoxes. We then need additional code
    to iterate through this list of WebElements. Let’s next take a look at the @FindBys
    annotation. 6.3.2 The @FindBys annotation When we need to find WebElements that
    match all of the given criteria, then in such a case @FindBys is used. More than
    single search criteria can be specified as follows: @FindBys({@FindBy(how = How.ID,
    using = "dummyid"),@FindBy(how = How.NAME, using = "dummyname")})private ListbothMatching; In
    the preceding example, the list of WebElements will include WebElements which
    have the ID as and NAME as Let’s see the @FindAll annotation next. 6.3.3 The @FindAll
    annotation When we need to find WebElements that match at least one of the given
    criteria, then in such a case, @FindAll is used. More than single search criteria
    can be specified as follows: @FindAll({@FindBy(how = How.ID, using = "dummyid"),@FindBy(how
    = How.NAME, using = "dummyname")})private ListatleastOneMatching; In the preceding
    example, the list of WebElements will include WebElements which have the ID as
    or NAME as Let’s see how to initialize the proxied elements with the initElements()
    method before using them in the code. 6.4 Understanding the initElements method In
    this section, we will take a look at step two of section 6.2 which is about initializing
    the proxied elements. The PageFactory class provides us with a static initElements
    method which can be used for this purpose. There are three overloaded versions
    of this method which are as follows:  public static void initElements(WebDriver
    driver, java.lang.Object page) This is the basic version which takes a WebDriver
    and page class as arguments. public static void initElements(ElementLocatorFactory
    factory, java.lang.Object page) This version takes a ElementLocatorFactory that
    is used to provide a mechanism for finding elements and page class as arguments. public
    static void initElements(FieldDecorator field, java.lang.Object page) This version
    takes a FieldDecorator that is used to decorate each of the fields. We will see
    the annotations and the initElements() method in action when we explore the sample
    scenario. 6.5 Designing the Page Factory framework We will use a similar structure
    as the Page Object Model. We will create two additional packages under src/main/java,
    namely, where the ‘pf’ at the end stands for Page Factory and locators, which
    will have Java classes with the @FindBy annotation. Public WebElements will be
    maintained in these classes so that they are accessible for the Java classes that
    utilize these variables. All Page Objects will inherit an AbstractBasePagePF class.
    This class will have two concrete methods, openBrowser(String, String, String)
    and It will also have two abstract methods for getting and setting the Page Title.
    Since we have three pages to work with, we will have three page objects and three
    step definitions. The Page Factory framework designed in such a manner will help
    splitting the work of creating the Object Repository [Classes for Locators] and
    Page Objects and can be done independently of each other without dependencies
    involved. 6.6 Designing a Login scenario We will start with a simple scenario
    as follows:  Open the browser. Navigate to the website Click on the Login button. Enter
    UserName. Enter Password. Click on the Login button. Verify the User Name on top
    of page. Close the browser. Let’s take a look at our Feature file as shown in
    the following screenshot: ![](image-ct739wt8.jpg) Figure 6.1: Login Scenario We
    have three pages for the locators to design. So let’s go step by step and as the
    first step, let’s design the locators for the Landing Page, Login Page, and Home
    Page which will be used by their respective Page Objects. 6.7 Creating the Page
    Locators using @FindBy In this section, we will create the locator classes for
    the Landing Page, Login Page, and Home Page. This class will have locators designed
    as per the Page Factory style with the @FindBy annotation. Let''s start with the
    locators for the Landing Page. 6.7.1 Creating the Landing Page Locators The landing
    page has the Login button that needs to be clicked to open the Login page. Here
    is the content of the LandingPageLocators.java that has one WebElement defined
    with the @FindBy annotation: package locators; import org.openqa.selenium.WebElement;import
    org.openqa.selenium.support.FindBy;import org.openqa.selenium.support.How; public
    class LandingPageLocators {@FindBy(how=How.XPATH,using="//a[@href=''https://ui.freecrm.com'']")public
    WebElement btnLogin;} This is a straightforward class with just one WebElement
    for the Login button. We are locating the Login button using the XPath strategy. 6.7.2
    Creating the Login Page locators The login page has the email address and password
    text boxes and the Login button. Here is the content of the LoginPageLocators.java
    that has three WebElements defined with the @FindBy annotation: package locators; import
    org.openqa.selenium.WebElement;import org.openqa.selenium.support.FindBy;import
    org.openqa.selenium.support.How; public class LoginPageLocators {@FindBy(name="email")public
    WebElement email; @FindBy(name="password")public WebElement password; @FindBy(how=How.XPATH,using="//div[text()=''Login'']")public
    WebElement btnLogin;} This class finds elements based on the name as well as the
    X-Path Strategy. 6.7.3 Creating the Home Page locators The Home page has the User
    Name display on top that needs to be verified. In addition to this, it also has
    the LogOut Div and LogOut span. Here is the content of the HomePageLocators.java
    that has three WebElements defined with the @FindBy annotation: package locators; import
    org.openqa.selenium.WebElement;import org.openqa.selenium.support.FindBy;import
    org.openqa.selenium.support.How; public class HomepageLocators { @FindBy(how=How.XPATH,using="//span[@class=''user-display'']")public
    WebElement userDisplay; @FindBy(how=How.XPATH,using="//div[@role=''listbox'']")public
    WebElement logOutDiv; @FindBy(how=How.XPATH,using="//span[text()=''Log Out'']")public
    WebElement logOutSpan;} This class finds elements based on the X-Path Strategy.
    Now that we have created individual classes for the locators, let’s go ahead and
    design our Page Objects. There are four classes involved: The Abstract Base Page,
    Landing Page Object, Login Page Object, and Home Page object. 6.8 Creating the
    Page Objects In this section, we will learn how to create the three page objects
    starting with the parent of all Page Objects, which is the Abstract Base Page. 6.8.1
    Creating the Abstract Base Page We will create an abstract Base Page class that
    will serve as a base class of all Page Object classes. Right now, this page contains
    concrete methods for opening the browser and navigating to a URL. It also has
    abstract methods for setting and getting the Page Title. The Abstract Base Page
    class will have the openBrowser(String, String, String) and navigateURL() methods
    which are the two concrete methods. The URL is picked up from the GLOBAL_DATA
    class. The entry in the GLOBAL_DATA class is as follows: public static final String
    URL="http://freecrm.co.in"; The AbstractBasePage class is shown as follows: package
    pageobjectspf; import constants.GLOBAL_DATA;import pageobjectspf.LandingPagePF;import
    singletondriver.SingletonDriver; public abstract class AbstractBasePagePF {protected
    String pageTitle; public LandingPagePF navigateURL() {SingletonDriver.getInstance().getDrvr().navigate().to(GLOBAL_DATA.URL);return
    new LandingPagePF();} public void openBrowser(String browserName, String platform,
    String gridSetting) {try {SingletonDriver.getInstance().setDrvr(browserName, platform,
    gridSetting, null);} catch (Exception e) {// TODO Auto-generated catch blocke.printStackTrace();}}public
    abstract void setPageTitle(String pageTitle);public abstract String getPageTitle();} Note
    that the navigateURL returns an object of the LandingPage when the control is
    sent back to the child class LandingPage that inherits the AbstractBasePagePF
    class. When we see the Step Definitions in the later section, we will see how
    to get a hold of this returned object to do actions on the Landing Page. Next,
    we will make use of inheritance and create three Page Objects, namely, LandingPage,
    LoginPage, and Homepage which extend this abstract class. Since our Page objects
    are concrete classes, we have to provide a method body for the two methods setPageTitle(String
    pageTitle) and Since we have the SingletonDriver already set up, we make use of
    it to create an instance of the Chrome Driver and navigate to the http://freecrm.co.in
    website. The navigateURL method lands us on the Landing page so that we can use
    it to click on the Login button that is in the Landing page. Let’s design the
    Landing page next. 6.8.2 Creating the Landing Page The Landing page is the one
    which loads when the browser is opened and navigation happens in Our only task
    on this page is to click on the Login button and land on the Login Page. Let’s
    see how we have implemented the Landing Page. The Landing page extends the Abstract
    Base Page. We will use the concept of composition and create an object of the
    LandingPageLocators class inside the LandingPagePF page object. Inside the constructor,
    we will instantiate the landingPageLocators object and initialize all WebElements
    at one go using the initElements method which takes as argument the driver instance
    and the LandingPageLocators object. package pageobjectspf; import org.openqa.selenium.support.PageFactory;import
    locators.LandingPageLocators;import singletondriver.SingletonDriver; public class
    LandingPagePF extends AbstractBasePagePF{LandingPageLocators;public LandingPagePF()
    {super();landingpageLocators = new LandingPageLocators();PageFactory.initElements(SingletonDriver.getInstance().getDrvr(),
    landingpageLocators);System.out.println("After init");}public void clickLogin()
    {System.out.println("Before click"+this.landingpageLocators.btnLogin.getText());landingpageLocators.btnLogin.click();System.out.println("After
    click");} @Overridepublic void setPageTitle(String pageTitle) {this.pageTitle=pageTitle;} @Overridepublic
    String getPageTitle() {return this.pageTitle;}} We have a clickLogin() method
    that clicks the Login button and lands us on LoginPage so that it can be used
    further. We have also implemented the abstracts methods from the Abstract Base
    Page, namely, setPageTitle(String) and Now that we are on the LoginPage, let’s
    see how we can implement the LoginPage class. 6.8.3 Creating the Login page The
    LoginPage class has three WebElements to work with, namely, UserName textbox,
    Password textbox, and Login button. After clicking on the Login button, the user
    needs to navigate to the HomePage so that we can extract and verify the User Name
    displayed on the top: package pageobjectspf; import org.openqa.selenium.support.PageFactory;import
    locators.LoginPageLocators;import singletondriver.SingletonDriver; public class
    LoginPagePF extends AbstractBasePagePF{LoginPageLocators;public LoginPagePF()
    {super();loginpageLocators = new LoginPageLocators();PageFactory.initElements(SingletonDriver.getInstance().getDrvr(),
    loginpageLocators);} public void enterUserName(String userName) {loginpageLocators.email.sendKeys(userName);}public
    void enterPassword(String passwordtxt) {loginpageLocators.password.sendKeys(passwordtxt);}public
    void clickLogin() {loginpageLocators.btnLogin.click();} @Overridepublic void setPageTitle(String
    pageTitle) {this.pageTitle = pageTitle;} @Overridepublic String getPageTitle()
    {return this.pageTitle;}} Now we are on the HomePage and we are in the final phase
    of verification of the UserName on the top panel. Let’s see the Homepage.java
    next. 6.8.4 Creating the Home page Now that we are on the Homepage, we will make
    use of the getText() method to capture the text present for UserName on the top
    panel. The procedure remains the same. We have the Logout functionality scripted
    in this class since the Logout appears on the HomePage after logging in. Logout
    is a two-step process where the Logout icon is clicked first followed by clicking
    on the ‘Log out’ link. We will quit the browser after this. All this code has
    been kept in the logOut() method. Logout happens after each Feature finishes execution
    as the logOut() method is annotated with the @After annotation.  Note: We can
    also keep the method annotated with the @After annotation in a different class
    based on requirements.  The code listing is given as follows: package pageobjectspf; import
    org.openqa.selenium.support.PageFactory;import org.testng.Assert; import locators.HomepageLocators;import
    singletondriver.SingletonDriver; public class HomepagePF extends AbstractBasePagePF{HomepageLocators;public
    HomepagePF() {super();homepageLocators = new HomepageLocators();PageFactory.initElements(SingletonDriver.getInstance().getDrvr(),
    homepageLocators);} public void verifyUser(String userDisplayText) {System.out.println(homepageLocators.userDisplay.getText());Assert.assertEquals(homepageLocators.userDisplay.getText(),
    userDisplayText);} @Afterpublic void logOut() {homepageLocators.logOutDiv.click();homepageLocators.logOutSpan.click();SingletonDriver.getInstance().getDrvr().close();SingletonDriver.getInstance().getDrvr().quit();} @Overridepublic
    void setPageTitle(String title) {this.pageTitle=pageTitle;} @Overridepublic String
    getPageTitle() {return this.pageTitle;}} With this, we are done with creating
    the Abstract Base page along with the three page objects for the Landing Page,
    Login Page, and Home Page. Let’s understand the Step definitions next. 6.9 Step
    definitions for the pages In section 6.8, we designed the three page objects along
    with the Abstract Base Page. We have segregated our Step Definitions in three
    separate java classes. Let’s see each Java class. 6.9.1 Landing page step definition Let’s
    take a look at the Landing page step definitions. The first thing we do in this
    Step Definition is to create an object of the LandingPage. Using this object,
    we will open a Chrome browser, navigate to the URL, and click on the Login button.
    Notice that the methods for opening a browser and navigating to the URL are present
    in the AbstractBasePage and not in the landing page but since we have extended
    the Abstract Base Page for all our page objects, we can use the LandingPage object
    to invoke methods in the Abstract Base Page. Also, note that we are capturing
    the returned LandingPage object from the navigateURL() method and making use of
    it to do the click operation of the Login button on the Landing page. The code
    is as follows: package stepdefinitions; import constants.GLOBAL_DATA;import cucumber.api.java.en.Given;import
    cucumber.api.java.en.When;import pageobjects.LandingPage;import pageobjectspf.LandingPagePF; public
    class LandingStepDefPF {LandingPagePF landingPagePF = new LandingPagePF();@Given("^The
    user opens the \"([^\"]*)\" browser on \"([^\"]*)\" and \"([^\"]*)\"$")public
    void i_open_the_browser_on_and(String browser, String platform, String gridSetting)
    throws Throwable {landingPagePF.openBrowser(browser, platform, gridSetting);} @When("^The
    user navigates to the landing page$")public void user_navigates_to_the_landing_page()
    throws Throwable {landingPagePF = landingPagePF.navigateURL();} @When("^The user
    clicks the Login button on the landing page$")public void The_user_clicks_the_Login_button_on_the_landing_page()
    throws Throwable {landingPagePF.clickLogin();}} Now that we have navigated to
    the Login page, let’s move on to the Login Page Step Definition. 6.9.2 Login page
    step definition Next in our list is the design of the Login Page Step Definition.
    Here, our task is to enter the email, password, and then click on the Login button.
    The code for the Login Page Step Definition is shown as follows. It basically
    has the same structure as the Landing Page Step Definition. We created an object
    of the LoginPage and then we entered the Password, and then clicked on the Login
    button using this object. The code is as follows: package stepdefinitions; import
    cucumber.api.java.en.And;import cucumber.api.java.en.When;import pageobjects.LoginPage;import
    pageobjectspf.LoginPagePF; public class LoginStepDefPF {LoginPagePF loginPagePF
    = new LoginPagePF();@When("^The user enters \"(.*?)\" as username$")public void
    user_enters_admin_as_username(String userName) throws Throwable {System.out.println("UserName
    is: "+userName);loginPagePF.enterUserName(userName);} @And("^The user enters \"(.*?)\"
    as password$")public void user_enters_admin_as_password(String password) throws
    Throwable {System.out.println("Password is: "+password);loginPagePF.enterPassword(password);} @And("^The
    user clicks the Login button$")public void user_clicks_the_Login_button() throws
    Throwable {System.out.println("Login button clicked");loginPagePF.clickLogin();}} Finally,
    we move on to the Homepage Step Definition. 6.9.3 Home page step definition The
    Home Page step definition has a similar code structure to the Landing Page Step
    Definition and Login Page Step Definition. We created an object of the HomePage
    and used it to fetch the text of the The code listing is given as follows: package
    stepdefinitions; import cucumber.api.java.en.Then;import pageobjects.Homepage;import
    pageobjectspf.HomepagePF; public class HomePageStepDefPF {HomepagePF homePagePF
    = new HomepagePF();@Then("^The user should be shown \"(.*?)\" on top left corner$")public
    void user_should_be_shown_User_Name_on_top_left_corner(String userDisplayText)
    throws Throwable {System.out.println("UserName verified");homePagePF.verifyUser(userDisplayText);}} This
    is a comparatively small code listing, wherein we will just validate the text
