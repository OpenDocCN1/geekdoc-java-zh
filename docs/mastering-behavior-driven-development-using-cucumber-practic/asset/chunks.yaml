    Pattern The Page Object Design Pattern is a popular design pattern in test automation
    which is used for enhanced test maintenance and reduced code duplication. A page
    object is a Java class or any other OOP language class that represents a page
    of our AUT. The test classes which in our case will be the Step Definitions make
    use of the methods of this page object class whenever an action has to be performed
    on a page. The advantage of having such a structure is that if the UI changes
    for a particular page, there is no need of changing the tests. Only the Page Object
    classes undergo change. Hence, all changes required for the new UI are located
    in one place. The Page Object Design Pattern has the following advantages:  There
    is a clear separation between test code and page-specific code such as locators
    and the methods that operate on those locators. Since the locators are maintained
    in the Page Object class, the tests are clean with no locators scattered in them. Now
    that we know what a Page Object Design pattern is, let’s take a look at the Page
    Object Model. 5.2 What is the Page Object Model? The Page Object Model is derived
    from the Page Object Design pattern. Here, we will design a class for each page.
    This will be a Java class in our case. Let’s see the Login screen as shown in
    the following screenshot. We will consider this page and see a code snippet. Click
    on the tab to navigate to the Login Page: ![](image-l4plmtrm.jpg) Figure 5.1:
