    4.1: WebDriverManager output for Chrome browser Next, we will take a look at how
    to design the Singleton WebDriver class using the WebDriverManager library. 4.4
    Design a Singleton WebDriver using the WebDriverManager library Since we have
    seen concepts such as Singleton pattern, the ThreadLocal class, and the WebDriverManager
    library, we can now design the Singleton WebDriver class. Instead of looking at
    the full code, we will look at the individual methods for ease of understanding.
    We have already seen the ThreadLocal variables that will be used in this class
    in section 4.4.1 Private Constructor The Singleton WebDriver class will have a
    private constructor so that this class cannot be instantiated from outside using
    the new() keyword. The constructor is shown as follows: // Private constructor
    in order to block instantiation of this class from outsideprivate SingletonDriver()
    {} We now look at how to fetch the Single instance of the SingletonDriver class. 4.4.2
    Fetching the Singleton class instance The next component of the SingletonDriver
    class is the method to fetch the Singleton instance of the driver class so that
    it can be accessed from outside. /*** getInstance method will fetch the active
    driver instance** @return SingletoDriver*/public static SingletonDriver getInstance()
    {if (instance == null) {instance = new SingletonDriver();}return instance;} We
    will next look at setting the Driver and its preferences with the setDrvr method. 4.4.3
    Setting the Driver and its preferences The next component of the SingletonDriver
