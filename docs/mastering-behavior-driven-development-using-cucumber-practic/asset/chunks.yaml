    is displayed in the following screenshot: ![](image-9ah5tkab.jpg) Figure 11.14:
    Screenshot for an error message for a failed scenario The Sanity1.html thus gives
    excellent information on the passes and failures. 11.8.4 Examining the feature-overview.html This
    is the complete summary of the execution along with the pass/fail percentages. We
    also get beautiful pie charts in the report as shown in the following screenshot: ![](image-jkpidlhw.jpg) Figure
    11.15: Consolidated report with a pie chart showing execution based on tags We
    have gone through the procedure of configuring the Cucumber-JVM reports and generated
    these reports by running a test suite with the @Sanity1 tag. Conclusion This chapter
    covered the configuration and generation of Cucumber-JVM reports. We started by
    explaining the <testfailureignore></testfailureignore>tag through which we can
    ignore failures and move ahead without stopping the test execution. We took a
    look at the Maven-Cucumber-Reporting plugin. We looked at a very common utility
    code for capturing screenshots on failures. We modified our TestRunner to work
    with the Cucumber JVM reports. We created a feature file with two scenarios one
    positive and one negative. We created another feature file with one negative scenario.
    We made changes to the Homepage page object, step definition, and locator where
    we added a new locator for the Account Type and the required glue and Java code.
    We then executed both feature files by giving them a common tag of Finally, we
    took a look at the beautiful JVM reports for the individual feature files and
    tags. In the next chapter 12, Reporting using Extent we will take a look at configuring
    the extent reports which can be customized to our needs, and we can also put log
    statements and screenshots in the Extent reports. We will see the detailed process
    of using Extent reports in the framework. Questions  Explain the <testfailureignore></testfailureignore>tag
    in pom.xml. List the sections in the Maven-Cucumber-Reporting plugin. Modify your
    testrunner and try generating the JVM reports. Create a method for capturing screenshots. Execute
    the test suite with a combination of positive and negative scenarios using Maven.CHAPTER
    12 Reporting Using Extent Reports In the previous chapter, we looked at the generation
    of the Cucumber JVM reports. We learned about the <testfailureignore></testfailureignore>tag.
    We added a plugin called the maven-cucumber-reporting plugin which we used for
    generating beautiful HTML reports. We created one positive scenario and one negative
    scenario in the first feature file and one negative scenario in the second feature
    file and placed the same tag on both the feature files. We modified the test runner
    class to generate Cucumber JVM reports. The scenarios got executed in a serial
    fashion generating a report for each feature file and a consolidated report based
    on tags. In this chapter, we will learn the configuration required for generating
    Extent reports. Extent reports are another set of reports that help us in understanding
    the status of execution through graphical representations. These reports are customizable
    reports where the reports can be customized on basis of our needs. We will create
    a new class for generating Extent reports. This class will generate one report
    for all feature files. We will attach a screenshot in the report for failed scenarios. Structure The
    following topics will be covered in this chapter:  Introduction to Extent reports Understanding
    Maven dependency for Extent reports Creating a class for generating Extent reports Creating
    a helper class for taking screenshots Creating a base steps class for declaring
    the required variables Understanding changes to the Before and After hooks Executing
    the flows and generating the reports Objectives After reading this chapter, the
    reader will be able to:  Understand what Extent reports are Understand Maven dependency
    for Extent reports Create a class for generating Extent reports Create a helper
    class for taking screenshots Create a base steps class for declaring required
    variables Understand changes to the Before and After Hooks Understand feature
    file execution and generate the reports Let’s start by understanding what Extent
    reports are along with the Maven dependency. 12.1 Introduction to Extent reports Extent
    reports offer several features (when compared to the built-in reports that are
    generated through Cucumber). These reports include pie chart generation, scenario-wise
    report generation, adding screenshots, and so on, for every failed scenario and
    a beautiful user interface that can be shared with all stakeholders of the project. 12.1.1
    Advantages of Extent reports There are several advantages provided by extent reports
    and few of them are discussed as follows:  HTML reports with pie chart representation,
    which is customizable Displays the time taken for scenario execution Multiple
    test case runs within a single suite can be tracked easily It can be integrated
    with TestNG and JUnit frameworks quite easily 12.1.2 Components of Extent reports We
    will use two classes of Extents reports:  ExtentReports class: This class is mainly
    used for starting reporters and building reports. There should be one ExtentReports
    instance for the entire JVM. ExtentHtmlReporter class: This class creates a rich
    standalone HTML file. It provides several configuration options via the config()
    method. We will create a Custom Reporter class for generating Extent reports.
    There will be a generic helper for capturing screenshots. Let’s look at what dependencies
    are required for incorporating Extent reports. 12.2 Maven dependency for Extent
    reports For using extent reports, the following dependency needs to be included
    in <groupid>com.aventstack</groupid><artifactid>extentreports</artifactid><version>4.0.9</version> Save
    the POM xml. Right click on the project and select Maven | Update This download
    required Maven JARs. 12.3 Creating a class for generating Extent reports We will
    create a class called to create our Extent reports. This class will have the methods
    shown as follows:  createCustomTest(Scenario, This method gets the scenario title
    and error message if the scenario has failed. It creates a test using the status
    of the scenario using the getStatus() method of the Scenario object. If the scenario
    has failed, it attaches a screenshot as well as prints the error message to the
    report. The createCustomTest(Scenario, String) method is shown as follows: public
    void createCustomTest(Scenario scenario,String screenshotFile)throws IOException
    {if (scenario!=null) {String testName = getScenarioTitle(scenario);String errMessage
    = fetchErrorMsg(scenario);switch(scenario.getStatus().toUpperCase()) {case "PASSED":extentReports.createTest(testName).pass("passed");break;case
    "FAILED":System.out.println("in failed");extentReports.createTest(testName).fail(errMessage).addScreenCaptureFromPath(screenshotFile);break;default:extentReports.createTest(testName).fail("skipped");}}} We
    have used the fetchErrorMsg(Scenario) to get the error message attached to the
    scenario, and we need access to the stepResults ArrayList as follows: ![](image-6uvowd4f.jpg) Figure
    12.1: The private stepResults arrayList The following step 7 of a feature file
    has failed. We need to extract the error message shown in the following screenshot: ![](image-ea2t7e7b.jpg) Figure
    12.2: The display of the error message Here is the code for fetching the error
    message from the private We declare two lists: one for the test result and one
    for the failed results. A field provides information about and dynamic access
    to a single field of a class or an interface. The reflected field may be a class
    (static) field or an instance field. Using this, we will fetch the stepResults
    We then bypass the security on this field using the setAccessible method passing
    it the argument ‘true’. We will fetch the step results for the scenario and store
    it into the local list We will then check for the test results being null or empty.
    If the test result list is not null or empty, we will use a lambda expression
    to extract the failed scenarios into the failedResults list. If the failedResults
    list is not null or empty, we will return the error message from this list. At
    the end, we will return spaces when the test has passed. private String fetchErrorMsg(Scenario
    scenario) {ListtestResults = null;ListfailedResults = null;try {Field stepResults
    =scenario.getClass().getDeclaredField("stepResults");//Bypass the securitystepResults.setAccessible(true);testResults
    = (List<result>)stepResults.get(scenario);</result>} catch (NoSuchFieldException|SecurityException
    |IllegalArgumentException | IllegalAccessException e) {// TODO Auto-generated
    catch blocke.printStackTrace();} if (testResults != null && !testResults.isEmpty())
    {//pick the results where error message is not nullfailedResults = testResults.stream().filter((a)
    -> {return a.getErrorMessage() != null;}).collect(Collectors.toList());} if (failedResults
    != null && !failedResults.isEmpty()) {return failedResults.get(0).getErrorMessage();}return
    "";}  Let’s take a look at the logic for capturing screenshots which we will attach
    to a failed scenario. 12.4 Creating a helper class for taking screenshots We will
    now create a generic helper class which will be used for capturing screenshots.
    This generic helper has a method for taking screenshots which is This method takes
    the screenshot and copies it to the location specified as an argument. It then
    returns the path. The method is shown as follows: public String takeScreenShot(String
    aPath) {File screenshot =((TakesScreenshot)SingletonDriver.getInstance().getDrvr()).getScreenshotAs(OutputType.FILE);try
    {FileUtils.copyFile(screenshot, new File(aPath));} catch (IOException e) {e.printStackTrace();return
    "";}return aPath;} We have the path to the screenshot with us now. Let’s invoke
    this method from the After Hook. In order to declare the object of the CustomCucumberReporter
    class, to create a Boolean variable to check whether the CustomCucumberReporter
    class has been instantiated and to instantiate the GenericHelper class, we will
    make use of the Base class for the Before and After Hooks so that these hooks
    can use these objects. Let’s create this class. 12.5 Create a base steps class
    for declaring required variables We will create a Base Class to achieve the goals
    mentioned as follows:  Create an object of type CucumberCustomReporter. Declare
    a Boolean variable to check whether an instance of the CustomCucumberReporter
    class has been created. Create an object of the GenericHelper class. The BaseSteps.java
    is shown as follows: package stepdefinitions; import utils.CucumberCustomReporter;import
    utils.GenericHelper; public class BaseSteps {protected static CucumberCustomReporter
    cucumberCustomReporter;protected static boolean isReportRunning;protected static
    GenericHelper genericHelper = new GenericHelper();} We will make the Before and
    After hooks inherit the BaseSteps class. Let’s take a look at changes to the Before
    and After hooks. 12.6 Changes to the Before and After Hooks We will now make changes
    to the Before and After Hooks. We are required to change classes BPBSD_00.java
    and Let’s take a look at the changes to the Before Hook. 12.6.1 Changes to the
    Before Hook The Before Hook will extend the BaseSteps as follows: public class
    BPBSD_00 extends BaseSteps This is a comparatively small piece of code where we
    simply verify whether the CustomCucumberReport has been instantiated. If it has
    not been instantiated, then the instantiation is done and the boolean variable
    is set to true. @Beforepublic void setUp(Scenario scenario) {System.out.println("Before
    any of the methods");if(!isReportRunning) {cucumberCustomReporter=newCucumberCustomReporter("src/test/resources/TestReport.html");isReportRunning
    = true;}} Once the Before Hook is executed, the scenario is executed and finally
    the After Hook is executed. Let’s see what we are achieving in the After Hook. 12.6.2
    Changes to the After Hook The After Hook will run after a scenario is executed.
    The After Hook also extends the BaseSteps class and the tear down method has the
    code that creates the Extent report. We will make use of the getProperty(String)
    method of the System class to get the project home directory and then append the
    remaining path along with the image file name. We will then invoke the takeScreenShot(Sting)
    method from the GenericHelper class in case of the scenario failure. We will then
    create an Extent test with the screenshot. Finally, we will flush the report by
    invoking the writeReport() method: @Afterpublic void tearDown1(Scenario scenario)
    throws IOException {File screenPrint = null;String screenshotName =System.getProperty("user.dir")+"\\src\\test\\resources\\images\\"+scenario.getName().replaceAll("
    ", "")+".jpeg";if (scenario.isFailed()){genericHelper.takeScreenShot(screenshotName);byte[]
    screenPrint1 =((TakesScreenshot)SingletonDriver.getInstance().getDrvr()).getScreenshotAs(OutputType.BYTES);scenario.embed(screenPrint1,
    "image/png");try {if (!(SingletonDriver.getInstance().getSessId()==null)) {SingletonDriver.getInstance().getDrvr().close();SingletonDriver.getInstance().getDrvr().quit();}}
    catch (Exception e) {// TODO Auto-generated catch blocke.printStackTrace();} }
    else {try {if (!(SingletonDriver.getInstance().getSessId()==null)) {SingletonDriver.getInstance().getDrvr().close();SingletonDriver.getInstance().getDrvr().quit();}}
    catch (Exception e) {// TODO Auto-generated catch blocke.printStackTrace();}}cucumberCustomReporter.createCustomTest(scenario,
    screenshotName);cucumberCustomReporter.writeReport();} Finally, we come to the
    point where we will see Extent reports in action. 12.7 Execution of the flows
    and generating the reports Right click on the pom.xml and click on Run As | Maven
    The tests get executed and the logs get printed in the console as shown in the
    following screenshot. Please note that Figure 12.3 is just a partial snapshot
    of the log. ![](image-t6l1u486.jpg) Figure 12.3: Execution log for passed scenario Our
    report is available at The report is shown in the following screenshot. Three
    scenarios have run from two feature files where two failed and one passed. The
    one that passed does not have a screenshot attached. Figure 12.4 is a failed test
    case where the screenshot is in the form of a link. Click on the link to open
    the image: ![](image-436tkh0z.jpg) Figure 12.4: TestReport.html After clicking
    on the highlighted link, the following screen appears: ![](image-zbp45kue.jpg) Figure
    12.5: Snapshot.html We have configured Extent reports with our framework in this
    chapter. This brings us to the end of this chapter. Conclusion This chapter covered
    the configuration and generation of Extent reports. We got introduced to Extent
    reports. We understood what Maven dependency should be put in the pom.xml in order
    to generate Extent reports. We created a class for generating Extent reports.
    In addition to this, we created a generic helper class to take screenshots in
    case of scenario failures. We also used reflection in Java to extract the assertion
    error in case of failures. We printed this error in the Extent report. We went
    ahead and created a Base class for the Hooks for declaring required variables.
    We made changes to Before and After hooks to generate Extent reports. Finally,
    we generated Extent reports for three scenarios. In the next chapter 13, Parallel
    Execution Using Selenium we will take a look at parallel execution in Cucumber
    using the ThreadLocal class. We will see changes required for POM.XML and TestNG.xml
    and we will also see changes. We will also see how we can generate Extent reports
    in parallel execution. Questions  Explain the process of generating Extent reports. Create
    a program to generate Extent reports for Cucumber scenarios. Explain the concept
    of Reflection in Java. Extract the Step Results private array list and try printing
    contents from it. Explain how to attach screenshots in Extent reports.CHAPTER
    13 Parallel Execution Using Selenium Grid In Chapter 12, Reporting Using Extent
    Reports , we learned how to create Extent reports version 4\. We took a look at
    the Maven dependency for Extent reports. We created a custom class for generating
    the reports. We also added a generic helper class for taking screenshots. A base
    steps class for the hooks was created so that variables or objects common to both
    the classes could be declared here. We made changes to the before and after hooks.
    We executed the positive and negative flows and generated the Extent report. This
    chapter will look at parallel execution on the local and Selenium Grid. Parallel
    test execution involves running test automation in parallel rather than sequentially.
    The tester need not execute your tests one by one. Instead of that, the entire
    batch can be split up into multiple groups, and each group can be executed in
    parallel. This technique has advantages that can effectively reduce the test execution
    time and improve your overall software development life cycle. Once the reader
    completes reading this chapter, he/she will have sufficient knowledge to set up
    a test suite that will have tests that execute in parallel. Structure The following
    topics will be covered in this chapter:  Introduction to parallel execution Understanding
    Synchronized methods Creating an Extent Manager class Creating an Extent Test
    class Changes to be made to the testng.xml for parallel execution Changes to the
    Step Definitions for logging Looking at the Singleton Driver code Improved versions
    of the Before and After Hooks Executing the pom.xml to generate the reports Introduction
    to Remote Web Driver Learning about the Selenium standalone server Introduction
    to Selenium Grid Changes to be made to the feature files and Test Runner Executing
    the test cases on the configured grid Objectives After reading this chapter, the
    reader will be able to:  Understand parallel execution Understand synchronized
    methods Create an Extent Manager class Create an Extent Test class Change the
    testng.xml for parallel execution Make changes to the Step Definitions for logging
    purpose Understand the Singleton Driver code Understand improved Before and After
    Hooks Understand the execution of the pom.xml to generate the reports Introduce
    Remote Web Driver Learn about the Selenium standalone server Introduce Selenium
    Grid Make changes to the feature files and Test Runner Execute the test cases
    on the configured grid Let’s start understanding the concepts related to parallel
    execution along with the Selenium Grid configuration. This is going to be a very
    important chapter as far as test automation is concerned. 13.1 Understand parallel
    execution Parallel execution helps to reduce the execution time by executing Feature
    files or scenarios in parallel. This helps in faster turnaround time in case of
    failures. We can mix and match the execution on different browsers and thus achieve
    multi browser testing. We can also execute the test cases remotely using Grid
    as we will see later. If one has enough resources to run all the tests at once,
    then the duration of the test execution will last only as long as the slowest
    running test. For example, if you have 100 tests and 100 virtual machines on which
    to run these tests, then dividing these tests in parallel will allow running 100
    tests at once. If your slowest test among the set of 100 takes two minutes to
    run, then that is how long it will take for the entire test suite to complete
    the execution. Let’s now understand synchronized methods. 13.2 Understanding Synchronized
    methods Synchronization in Java gives the control to access multiple threads to
    any resource that is shared. Java synchronization is a good option when it is
    required that only one thread should be able to access the shared resource. Synchronization
    is mostly used in programming when we want to prevent the thread interference. There
    are two types of synchronization in Java:  Process synchronization Thread synchronization We
    will look at only Thread synchronization here. There are two types of synchronizations
    available in Thread synchronization:  Inter thread communication Mutually Exclusive  Synchronized
    method Synchronized block Static synchronization  Here, our focus will be on synchronized
    methods. Synchronized methods enable us to prevent thread interference and prevent
    memory consistency errors. If an object is visible to more than one thread, all
    reads or writes to that object’s fields are done through the synchronized method. When
    the method is static synchronized, the lock is obtained on the class and not on
    the object. In general, synchronized methods are used to protect access to resources
    that are accessed concurrently or in parallel. When a resource that is being accessed
    concurrently belongs to each instance of your class, you use a synchronized instance
    method; when the resource belongs to all instances (i.e. when it is in a static
    variable as our ExtentTest and ExtentReports objects as we will see later), then
    you will use a synchronized static method to access it. We will use static synchronized
    methods for the creation of Extent reports. We will have two classes, namely,
    ExtentMgr and Let’s see what these classes will have. 13.3 Creating an Extent
    Manager class Our first class the ExtentMgr will have two methods, namely, getReporter()
    and Let’s understand the various details in the ExtentMgr class.  Declare various
    variables for Date, File name, Screenshot path, and Screenshot name as follows: static
    ExtentReports extentReports;static Date d = new Date();static String fileName
    = "Extent_" + d.toString().replace(":", "_").replace(" ", "_") + ".html";public
    static String screenshotPath;public static String screenshotName;static int counter=0; The
    static synchronized method getReporter() returns the ExtentReports object This
    method creates the ExtentHtmlReporter object by passing it the filename with the
    full path as argument. The theme, document title, encoding, and report name are
    set by invoking the config() method on the ExtentHtmlReporter object. A new ExtentReports
    object is then created and the ExtentHtmlReporter object is attached to it by
    invoking the attachReporter(ExtentHtmlReporter) method on the ExtentReports object.
    Various system information is set on the ExtentReports object by invoking the
    setSystemInfo(String, The code is shown as follows: public synchronized static
    ExtentReports getRprtr() {if (extentReports == null) {ExtentHtmlReporter htmlReprtr
    = newExtentHtmlReporter(System.getProperty("user.dir")+"/reports/"+fileName);htmlReprtr.config().setTheme(Theme.STANDARD);htmlReprtr.config().setDocumentTitle(fileName);htmlReprtr.config().setEncoding("utf-8");htmlReprtr.config().setReportName(fileName);extentReports
    = new ExtentReports();extentReports.attachReporter(htmlReprtr);extentReports.setSystemInfo("Automation
    Test Run", "Parallel Execution");extentReports.setSystemInfo("Organization", "BPB");extentReports.setSystemInfo("Build
    no", "BPB-TEST");}return extentReports;} Create a method for capturing screenshots.
    This method will capture a screenshot as a file object. It creates the screenshot
    name by appending today’s date and a counter that gets incremented on every call
    to this method. Finally, the screenshot is copied to the reports folder as follows: public
    static void captureScreenshot() {counter = counter + 1;File scrFile = ((TakesScreenshot)SingletonDriver.getInstance().getDrvr()).getScreenshotAs(OutputTyp
    e.FILE);Date d = new Date();screenshotName = d.toString().replace(":", "_").replace("
    ", "_")+ "_"+counter+".jpg";try {FileUtils.copyFile(scrFile, newFile(System.getProperty("user.dir")
    + "/reports/" +screenshotName));} catch (IOException e) {// TODO Auto-generated
    catch blocke.printStackTrace();}} We will now move to the actual creation of logging
    statements inside the report using the 13.4 Creating an Extent Test class Follow
    the given steps to create the  We will first create a ThreadLocal variable for
    ExtentTest and another variable for ExtentReports and fetch the ExtentReports
    instance using the getRprtr() method. Both these are static variables as follows: public
    static ThreadLocaltstReprt = new ThreadLocal<extenttest>();</extenttest>static
    ExtentReports extent = ExtentMgr.getRprtr(); Fetch the test using the static synchronized
    method as follows: public static synchronized ExtentTest getTest() {return tstReprt.get();} Create
    log messages for info, passed steps, and failed steps as follows: public static
    void logInfo(String message) {tstReprt.get().info(message);} public static void
    logPass(String message) {tstReprt.get().pass(message);} public static void logFail(String
    message) {tstReprt.get().fail(message);} Create a static method for marking the
    test case as passed using createLabel(String,ExtentColor) of the MarkupHelper
    class. Pass the log message and the GREEN enum entry. Get the ThreadLocal variable
    and pass it the status PASS along with the log message as follows: public static
    void scenarioPass() {String passMsg = "Scenario has passed";Markup m = MarkupHelper.createLabel(passMsg,
    ExtentColor.GREEN);tstReprt.get().log(Status.PASS, m);} Create a static synchronized
    method for adding screenshots in case of failure in which first invoke the captureScreenshot()
    static method from the ExtentMgr class. Put a fail log and attach a screenshot
    using the Create a label using the createLabel(String,ExtentColor) of the MarkupHelper
    class. Pass the log message and the RED enum entry. Get the ThreadLocal variable
    and pass it the status FAIL along with the log message as follows: public static
    synchronized boolean addScreenShotsOnFailure() {ExtentMgr.captureScreenshot();try
    {tstReprt.get().fail("**"** **+ "color=" + "red>" +****"Screenshot of failure"
    + "" + "**",MediaEntityBuilder.createScreenCaptureFromPath(ExtentMgr.screenshotName).build());}
    catch (IOException e) {}String failureLog = "Scenario has failed";Markup m = MarkupHelper.createLabel(failureLog,
    ExtentColor.RED);tstReprt.get().log(Status.FAIL, m);return true;} Create a method
    to start the generation of Extent reports. There are two overloaded methods as
    follows: public static synchronized ExtentTest startTest(String testName) {return
    startTest(testName, "");} public static synchronized ExtentTest startTest(String
    testName, Stringdesc) {ExtentTest tst = extent.createTest(testName, desc);tstReprt.set(tst);return
    tst;} This completes the Let’s move on to changes in testng.xml for parallel execution. 13.5
    Changes to the testng.xml for parallel execution The changes to the testng.xml
    are simple. We have two tests. One is a positive test and the other is a negative
    test. In the suite tag, we have mentioned parallel=”tests” so that the tests execute
    in parallel. We will execute two test runners here. The execution takes place
    based on the tags in both the test runners: version="1.0" encoding="UTF-8"?>suite
    SYSTEM "http://testng.org/testng-1.0.dtd"><suite _="" span="">name="Suite" parallel="tests"></suite> <test
    _="" span="">name="Negative Test"></test><classes></classes><class _="" span="">name="testrunner.BPBTR_2"/></class><test
    _="" span="">name="Positive Test"></test><classes></classes><class _="" span="">name="testrunner.BPBTR_3"/></class>'
