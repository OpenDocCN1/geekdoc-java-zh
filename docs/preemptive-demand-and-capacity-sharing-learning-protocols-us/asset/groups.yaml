    Despite the scope, the original contribution of this research is to address the
    gap by developing a learning protocol for preemptive capacity sharing: 1) utilized
    historical data to enable better demand-sharing, 2) the capability of initiating
    capacity preemptively. The rest of the paper is organized as follows: the framework
    and methodology are summarized in Section 3. Numerical experiments are conducted
    in Section 4. Lastly, the results of numerical experiments are discussed in Section
    5.


    ## 2. BACKGROUND


    ### 2.1 Demand and Capacity Sharing


    Demand and Capacity Sharing was proposed by Yoon and Notof (2010). In a collaborative
    network of enterprises (CNEs), an order $e_i$ is generated. If a part of the demand,
    $r_i(o_k)$, is fulfilled then the maximum available capacity $m_i(o_k)$ should
    be fully assigned to the order $o_k$, the enterprise $e_j$ will share the demand-sharing
    proposal $\Delta_i$ with the CNEs. The enterprise''s identification and the information
    of order $o_k$:


    $$\Delta_i = \{e_i, q_k, t_k\}$$


    Once the demand-sharing proposal $\Delta_i$ is shared with CNEs, potential collaborative
    enterprises submit $\omega_j$ as feedback. The network demand-sharing capacity
    is calculated as (Eq. 2):


    $$DS_i(o_k) = \begin{cases} q_k & q_k < \omega_j(o_k) \\ \omega_j(o_k) & q_k -
    r_i(o_k) \le \omega_j(o_k) < q_k \\ 0 & \text{otherwise} \end{cases}$$


    If $q_k$ can be fulfilled, the demand is allocated to enterprise $e_j \in Z^*$
    which has the corresponding shared capacity $\omega_j(o_k)$. Otherwise, the order
    $o_k$ is rejected.


    Furthermore, the capacity-sharing protocol is activated. When the demand-sharing
    proposal $\Delta_i$ is received by $e_j \in E$, the maximum available capacity
    $m_i(o_k)$ should be calculated by subtracting the available capacity at time
    $t$, $CA(t)$, by the capacity for order $o_k$, $CS_k(t)$, as shown in (Eq. 3):


    $$m_i(o_k) = \sum_{t=1}^{k} CA(t) - \frac{K-1}{2} \sum_{t=1}^{k} CS_s(t)$$


    After shared capacity $\omega_j(o_k)$ is determined, the capacity-sharing proposal
    will be sent to the demand sharing enterprise $e_i$. The capacity sharing proposal
    $\Lambda_i$ includes the identification: $$\Lambda_j = \{e_i, \omega_j(o_k)\}$$


    ### 2.2 Artificial Neural Network and LSTM Encoder


    Long-term memory networks (LSTM) are a type of recurrent neural network (RNN)
    which allows a network to maintain long-term links to data in previous times.
    A terminology was first introduced in 1997 (Hochreiter and Schmiduber 1997), LSTM
    from interpreting of variables from neural networks. Each enable consists of three
    gates: memory gate, forget gate, and output gate. Each gate contains a neural
    layer and an activation function. The output value of the sigmoid layer is between
    0 and 1, which represents the probability of the input that must be passed. LSTM
    reads sequential data in the form of a vector $v = [x_1, x_2, \dots, x_t]$, where
    $x_t \in \mathbb{R}^m$ represents a vector with $m$ dimensions for a number of
    variables with $t$ times (Yoon et al., 2021).


    LSTM encoder is for unsupervised neural network which aims to learn the encoding-decoding
    scheme from historical data (Yoon et al. 2021). In general, the autoencoder consists
