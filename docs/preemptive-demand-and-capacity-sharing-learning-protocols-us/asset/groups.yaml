    # 2. Anomaly Detection in Time Series


    Anomaly detection is a data mining process that determines types of anomalies
    found in a data and certain details about their occurrence (Prostovar et al.,
    2015). Methods of anomaly detection include clustering-based anomaly detection,
    isolation forests, forest vector machines, and in addition to these classical
    methods there are also other methods such as anomaly detection based on signal
    detection, time series models (exponential models, Holt-Winters, ARIMA) and deep
    learning (e.g., autoencoder and LSTM neural network) (Su et al., 2019), and dimensionality
    reduction (robust principal component self-organizing maps), and detectors (Sakakura
    and Yairi, 2014).


    The original contribution of this research is extending the original DCS protocol
    by accommodating two features: predictive models based on historical data in order
    to forecast future needs of collaboration and using the predictions to collaborate
    in advance. Due to the nature of the protocols, two parameters associated with
    the ratio of shared capacity $c_t$ and the length of sharing period. In the DCS
    protocol, the shared capacity and length are determined after the order arrives.
    This is not the case in the preventive DCS protocol. Both parameters are determined
    after prior adjustment and collaboration along time.


    There are classes of anomaly detection techniques related based on their reason
    for labeling: supervised anomaly detection, and unsupervised anomaly detection
    (Chandola et al., 2009). In the anomaly detection process, there are several cases
    that can be used. Among these are classification-based anomaly detection, which
    include anomaly detection techniques based on near neighbors (Tian, Azarian and
    Peicht, 2014), anomaly detection based on clustering (Sairaj, Prugel-Wiggles and
    Wills, 2012), and anomaly detection based on statistical methods (Chandola et
    al., 2009).


    LSTM-based anomaly detection is classified as unsupervised anomaly detection,
    which aims to solve anomaly problems without labeling. The model incorporates
    historical time series data and uses it to build a new time series model using
    the reconstruction function, which measures the quality of the reconstruction.
    The difference between the original time series data (actual data) and the reconstruction
    will be in residual. The model is trained using data that does not have an anomaly,
    reconstruction error that corresponds to anomalous data is of great value (Walsh
    et al., 2020). The metric is trained as time series $X_t, t=1, 2, \dots, T$ which
    is the reconstruction of $X$. Reconstruction error, which is the difference between
    $X$ and $Y$, is an element of $||X_t - \hat{X}_t||, t=1, \dots, T$. The Euclidean
    distance from the reconstruction error for each time step can be used as a criterion
    in detecting anomalies (Wang et al., 2022).


    ![](img/2e808fcef49f60d76622f167e51d8a4f_2_0.png)


    > Figure 1: Conceptual Framework of Preventive Demand-Capacity Sharing Sharing
    Protocols


    The protocols are detailed as follows. First, historical data $q_t = \{q_t^{(i)}\}$
    from the previous period is used to train the LSTM autoencoder as it generates
    an anomaly $a_t$. The second period is used to predict the need to collaborate.
    The model monitors the demand of order quantity $X_t$, and calculates $e = ||X_t
    - \hat{X}_t||, t=1, \dots, T$. Once the LSTM autoencoder detects order quantity
    $X_t$, such that $e \in A$, it will raise its threshold. This threshold activates
    the preventive DCS, with value of shared capacity $C_t$ and the length of sharing
    $P_t$.


    As the need for collaboration is predicted, the protocols will determine a set
    of $C_t$ and $P_t$ and the optimal parameters for the DCS. The optimality of the
    protocol is determined by the objective criteria of DCS (Yoon and Nof, 2010) on
    local demand forecast rate $y_t$, base on local demand forecast $y_t$, and collaboration-based
    demand forecast rate $y_t$.


    $Y_t = Y_t + Y_c = \sum_{i \in Y_t} D_i + \sum_{j \in Y_c} D_j$


