    ## 4.2 Predictive DCS with Learning Protocol


    Numerical examples representing the implementation of demand capacity sharing
    protocols in the collaborative network of enterprises (CNES) are provided here.
    To illustrate effectiveness of the protocol, three types of enterprise collaboration
    modes are applied in the simulation: (1) no collaboration model, (2) demand-capacity
    sharing (DCS) protocol, and (3) preemptive demand-capacity sharing learning protocols.


    # Table 1. Parameters for the Simulation


    The preemptive demand-capacity sharing learning protocols are capable of increasing
    the fulfillment rate to 92.94%, compared to 88.65% of the baseline scenario collaborative
    model and 90.58% of the non-preemptive DCSP. The fulfillment rate of the learning
    protocol is positively correlated with the ratio of shared capacity and the length
    of the preemptive horizon. On average, the preemptive demand-capacity sharing
    learning protocols are capable of fulfilling 91.03% of the CEs.


