    et al., 2019），以及降维（鲁棒主成分自组织映射）等Sakakura and Yairi, 2014）。


    本研究的原始贡献是扩展原始DCS协议，通过适应两个特征：基于历史数据的预测模型以提前预测协作需求。由于协议的性质，与共享容量比例 $c_t$ 和长度相关的两个参数：在DCS协议中，共享容量和长度在订单到达后确定。在预防性DCS协议中，参数在协作时间后确定。


    与标签相关的异常检测类有：监督异常检测和无监督异常检测（Chandola et al., 2009）。在异常检测过程中，有几种情况可以使用。其中包括基于近邻的异常检测（Tian,
    Azarian and Peicht, 2014）、基于聚类的异常检测（Sairaj, Prugel and Wills, 2012）以及基于统计方法的异常检测（Chandola
    et al., 2009）。


    基于LSTM的异常检测被分类为无监督异常检测，旨在解决无标签异常问题。模型结合时间序列数据并使用重构函数构建一个新的时间序列模型，以衡量重构质量。原始时间序列数据（实际数据）与重构之间的差异将是残差。模型使用无异常数据进行训练，异常数据的重构误差值很大（Walsh
    et al., 2020）。指标作为时间序列 $X_t, t=1, 2, \dots, T$ 进行训练，它是 $X$ 的重构。重构误差（$X$ 与 $Y$
    之间的差异）是 $||X_t - \hat{X}_t||, t=1, \dots, T$。每个时间步重构误差的欧几式距离可以作为异常检测的标准（Wang et
