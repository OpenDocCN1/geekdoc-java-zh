    # ## 1. INTRODUCTION


    Demand and Capacity Sharing (CS) Protocol in a collaborative network of enterprises
    (CNEs) is designed to coordinate demand and capacity sharing and allocation decisions.
    The protocol, based on collaborative control theory, prevents underutilized and
    minimizes the latency of capacity sharing in enterprises to improve the multiple
    objective criteria of CNEs (Yoon and Notof, 2015). The CS protocol has been extended
    and generalized into a resource-sharing framework for the cyber-physical systems
    (Nsayal et al., 2014) and bolstered by resilience (R) (Reyes and Lef, 2015) and
    dynamic lines of collaboration (Zhong and Notof, 2020), the CS protocol aims to
    ensure the resilience of a collaborative supply network against disruptions.


    The dynamic nature of a manufacturing system is represented as a time series,
    which offers a new dimension of complexity to CNE modeling. Sharing algorithms
    with heterogeneous batch processors (Hidayat et al., 2016), learning and forgetting
    effects (Yerselli et al., 2019), and a combination with


    maintenance scheduling (Zahed et al., 2016) have been developed to address complexity
    within a single enterprise, few models have addressed to the dynamism of a supply
    network. Intelligent CS (ICS) protocol is developed to form a contingent capacity
    sharing based on a distribution-decision process (Soek et al., 2016). Association/Distribution
    protocol has also been developed to address the membership issue of reconfigurable
    CNEs over (Yoon and Notof, 2011).


    A few have addressed the dynamic nature of a manufacturing system by accommodating
    real-time data updates and adaptive solutions to the CS protocol. Adaptive-collaborative
    CS protocol was developed to determine whether to perform resource allocation
    based on the history of long-term expected profit (Soek and Notof, 2014). Combined
    with Best Matching Protocol (PBMP), the CS protocol has been developed to mitigate
    uncertainty and demand (Moghaddam and Notof, 2014), including another approach
    to a Real-Time Optimization (RTO) method, which optimizes allocation decisions
    in real-time (Moghaddam and Notof, 2019).


