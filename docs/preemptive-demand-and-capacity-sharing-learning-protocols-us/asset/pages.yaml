    # 5. CONCLUSION AND DISCUSSION


    In this study, premium demand and capacity sharing learning protocols have been
    developed, analyzed, and validated. The protocol being developed by this study
    extends the previously developed demand-capacity sharing (DCS) by preemptive requests
    for capacity sharing before the actual order arrival. The proposed demand model
    for production scheduling based on parameters, lead time, order quantity, and
    duration of processes using the LSTM autoencoder. The LSTM autoencoder predicts
    a new threshold value of a quantity, which triggers collision.


    Based on the numerical analysis of the case study, the preemptive demand-capacity
    sharing learning protocol achieves a fulfillment rate of CEs by 91.03 and is better
    compared to the non-collaborative and non-preemptive demand-capacity sharing baseline
    scenarios. Given the availability of reliable historical data, practical decision-makers
    in the industry could utilize the proposed model to predict and fulfill future
    needs of CEs as a result, reducing uncertainty in the market and disruptions in
    the networks. Further studies are needed to refine and establish robust statistical
    significance. The objective of the preemptive DCS learning protocol is to enable
    the CEs in the network to allocate and share their demands and allocate their
    capacities to achieve a better fulfillment rate.


    Future research will also explore the economic perspective of preemptive demand-capacity
    sharing minimizes the probability of lost sales, it could enable the enterprises
    with high coordination costs. Furthermore, the interdependencies between the learning
    protocols, other collaborative protocols, and data availability and reliability
    are among the questions and challenges to be addressed in future research.


