    # 2.2 Artificial Neural Network and LSTM Encoder


    Long-term memory networks (LSTM) are a type of recurrent neural network (RNN)
    which allows a network to maintain long-term links to data in previous times.
    A terminology was first introduced in 1997 (Hochreiter and Schmiduber 1997), LSTM
    from interpreting of variables from neural networks. Each enable consists of three
    gates: memory gate, forget gate, and output gate. Each gate contains a neural
    layer and an activation function. The output value of the sigmoid layer is between
    0 and 1, which represents the probability of the input that must be passed. LSTM
    reads sequential data in the form of a vector $v = [x_1, x_2, \dots, x_t]$, where
    $x_t \in \mathbb{R}^m$ represents a vector with $m$ dimensions for a number of
    variables with $t$ times (Yoon et al., 2021).


    LSTM encoder is for unsupervised neural network which aims to learn the encoding-decoding
    scheme from historical (Yoon et al. 2021). In general, the autoencoder consists
    of an input layer, an output layer, a neural network encoder, a neural network
    decoder, and space. When data is entered into the encoder, the encoder will compress
    the data into latent space, the decoder will'
