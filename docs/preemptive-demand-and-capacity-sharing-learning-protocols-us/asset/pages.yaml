    Abstract: This research is conducted to address the challenge of future resilient
    global supply, subject to disruptions. In a collaborative network of enterprises
    (CNEs), lately collaborate through capacity sharing and information resources.
    A common practice of collaborative sharing through demand and capacity sharing
    (CS), which aims to ensure timely delivery to customers, despite uncertainties
    in the market and disruptions in supply chain. One key challenge of CNE implementation
    is to ensure that capacity sharing protocols could lead to coordination failures
    and backorders, prevent, when actual demand has been presented. This study aims
    to develop a new preemptive CS, Collaborative CS, which uses machine learning
    to learn from historical data. Long Short-Term Memory (LSTM) Neural Network Autoencoders
    are used to detect anomalies in real-time. The detected anomalies become capable
    of capacity sharing protocol, which could initiate preemptive CS. A case of automobile
    manufacturers in Indonesia is used to validate the model. On average, for the
    given study, preemptive protocols on the learning protocols of capacity increase
    the fulfillment rate to to in the demand-capacity sharing CNEs, compared to the
    collaborative and non-preemptive capacity sharing protocols (DSP) baseline scenarios.
    Further research is needed for comprehend.


