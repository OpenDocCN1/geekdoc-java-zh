    # 2.1 Demand and Capacity Sharing


    Demand and Capacity Sharing was proposed by Yoon and NotF(2010). In a collaborative
    network of enterprises (CNEs), an order $e_i$ is generated. If a part of the demand,
    $r_i(o_k)$, is fulfilled then the maximum available local capacity $m_i(o_k)$
    should be fully assigned to the order $o_k$, the the enterprise $e_j$ will share
    the demand-sharing proposal $\Delta_i$ which with the CNEs. The enterprise''s
    identification and the information of order $o_k$.


    ```

    $$\Delta_i = \{e_i, q_k, t_k\}$$$

    ```


    Once the demand-sharing proposal $\Delta_i$ is shared with the CNEs, potential
    collaborative enterprises submit $\omega_j$ as a feedback. The network demand-sharing
    capacity is calculated as (Eq. 2).


    ```

    $$\DS_i(o_k) = \begin{cases} q_k & q_k < \omega_j(o_k) \ \omega_j(o_k) & q_k -
    r_i(o_k) \le \omega_j(o_k) < q_k \ 0 & \text{otherwise} \end{cases}$$$

    ```


    If $q_k$ can be fulfilled, the demand is allocated to enterprise $e_j \in Z^*$
    which has the corresponding shared capacity $\omega_j(o_k)$. Otherwise, the order
    $o_k$ is rejected.


    Furthermore, the capacity-sharing protocol is activated. When the demand-sharing
