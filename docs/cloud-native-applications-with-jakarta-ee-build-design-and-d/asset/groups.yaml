    面对这么多参与者，经常被问的问题是选择哪一个。正如我们所看到的，大多数大型云参与者提供的服务都是竞争性的，不能简单地认为某一个服务提供商优于其他。当我们选择要部署应用的云服务提供商时，会有很多因素考虑进来。如果你已经在为某些工作使用某个云服务提供商的服务，这将是显而易见的选择，因为你想重用团队的专业知识。其次，你需要查看你将使用哪些云服务，然后寻找提供你所需服务的提供商。在选择云服务提供商时，你还应该考虑未来需求以及当前需求。成本将是另一个因素。大多数云服务提供商都具有竞争性的成本，但它们对免费层级的访问或对不同服务的计费机制可能有所不同。因此，根据你预计使用的服务，你可能需要进行成本分析。


    另一个大项目和公司有时会考虑的因素因素是避免对单一云服务提供商的依赖。你可能希望设计你的应用程序，使其被多个服务提供商支持，或者从一个服务提供者移动到另一个并不复杂。这种方法有助于从长期为项目提供灵活性。


    ## 总结


    在本章中，我们高层次地查看了各种云服务提供商。当你第一次开始云项目时，你需要了解你的选择。如今行业中有多许多云服务提供商，它们在功能和成本方面提供了具有竞争力的服务。


    我们学习了一些顶级参与者，如 Amazon 的 AWS 和微软的 Azure。我们研究了这些参与者提供的顶级服务。我们还简要研究了 Google Cloud。我们讨论了行业中的一些其他参与者，它们正努力建立自己的足迹，可以作为探索的良好选择。我们还讨论了在决定云服务提供商是否适合手头项目时需要考虑的事项。


    研究每个云服务提供商的细节超出了本书的范围，因此鼓励读者至少探索他们选择的几个提供商。没有什么能比得上实践经验。我们将在书中的示例中使用一些流行的服务提供商，这将进一步帮助读者理解由这些云服务提供商提供的各种服务。


    在下一章节中，我们将亲自动手（get our hands dirty），使用 Jakarta EE 创建我们的第一个示例应用程序。


