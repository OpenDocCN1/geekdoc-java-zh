    在云端置备硬件并为此付费吗？如果我们有一种机制，让我们只为使用的计算能力付费呢？函数即服务（Functions as a Service）就是我们所有忧虑的答案。


    当我们使用 SaaS 方案时，云服务提供商赋予了灵活性，你只需要带上你的代码并将其上传到 FaaS 服务即可。我们不需要真正担心底层基础设施，甚至是应用程序服务器。


    让我们来看看 FaaS 方案的一些优点和缺点，然后我们将创建一个示例，帮助我们直感受函数即服务。


    ## FaaS 的优点


    - **成本**：采用函数实现时你获得的第一个优势是低成本。通常情况下，你只为正在使用的资源付费，因为不需要预先置备基础设施。

    - **可扩展性**：当你采用基于函数的实现时，你可以获得开箱即用的扩展性。你的云服务提供商将根据需要自动帮助你的函数扩展或收缩。

    - **易于开发**：由于现在你的团队可以完全专注于核心功能的开发，而无需担心部署或扩展性需求，你会有更多的时间来关注真实的业务问题。


    ## FaaS 的缺点


    - **供应商锁定（Vendor Lock-in）**：这可能是一个主要问题，因为大多数云服务提供商都会希望你编写针对其 FaaS 服务的特定代码。因此，将你的代码从一个服务提供商迁移到另一个并重新部署并不容易。

    - **冷启动（Cold Starts）**：由于云服务提供商现在管理函数的伸缩性，可能会出现请求到来时必须等待函数实例的情况，因为你没有预先置备基础设施。


    ## AWS Lambda 示例


    首先，我们将实现一个非常基本的“Hello World!”示例，以让我们熟悉无服务器计算和 Lambda 函数。一旦我们熟悉了核心概念，将处理更复杂的示例。


    ## Hello-World 函数示例


    我们将创建一个基于 Maven 的“Hello World!”Lambda 函数实现示例。你需要在 `pom.xml` 中添加 `aws-lambda-java-core`
    依赖。因此，XML 可能如下所示：


    ```

    <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
    xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">

    <model>4.0.0</model>

    <groupId>com.example.lambda</groupId>

    <artifactId>0.0.1-SNAPSHOT</artifactId>

    <version>1</version>

    <name>LambdaExample</name>

    <description>LambdaExample </description>

    <dependencies>

    <dependency>

    <groupId>com.amazonaws</groupId>

    <artifactId>aws-lambda-java-core</artifactId>

    <version>1.2.1</version>

    </dependency>

    </dependencies>

    </project>

    ```


    接下来，我们将编写第一个 Lambda 函数，如下：


    ```

    package app;

    import com.amazonaws.services.lambda.runtime.Context;

    import com.amazonaws.services.lambda.runtime.RequestHandler;

    public class LambdaExample implements RequestHandler<String, String> {

    @Override

    public String handleRequest(String input, Context context) {

    context.getLogger().log("Input: " + input);

    return"Hello World - " + input;

    }

    }}

    ```


    现在，我们已经有了代码和 `pom.xml`，下一步是构建并打包我们的 JAR 文件以以上传到 Lambda：


    Maven clean package


    或者我们使用带有 shade 的以下选项，确保将所有依赖项与 JAR 一起打包：


    mvn clean package shade:shade


    在大多数示例中你都将使用此选项，因为我们的代码需要外部 JAR 依赖。


    接下来，我们将登录 AWS 控制台并进入 Lambda Functions。我们将创建一个新的 Lambda 函数：


    ## 创建函数


    选择以下选项之一创建你的函数。


    | 从头开始 (Author from scratch) | 使用蓝图 (Use a blueprint) | 浏览无服务器应用仓库 (Browse serverless
    app repository) |

