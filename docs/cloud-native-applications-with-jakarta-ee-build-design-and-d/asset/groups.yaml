    # 第 3 章


    # 云计算的主要参与者


    在过去的几个章节中，我们讨论了什么是云，以及在为云端构建应用时应该如何设计。但在我们着手编写实际代码和进行部署之前，了解我们在云服务提供商方面有哪些选择是有意义的。云服务提供商是为我们提供云基础设施及相关服务的公司。我们将使用许多现成的工具，这些工具将帮助我们为云端开发并部署到云端。


    在本章中，我们将学习一些重要的云服务提供商。目前领先两大云服务提供商是亚马逊 Web Services（AWS）和微软的 Azure。Google Cloud（谷歌云）是另一个进展良好的参与者。在本章中，我们将深入研究这些参与者，并对一些其他的云服务提供商进行概述。


    # 结构


    - Amazon Web Services (AWS)

    - 的 Azure

    - Google Cloud

    - 其他重要参与者


    # 目标


    在软件开发者和架构师的职业生涯中，会有需要为项目选择云服务提供商做出决策的时候。人们需要了解有哪些可选，以及这些提供商提供哪些服务。只有具备全面的知识，才能做出明智的决策。我们将在本章中查看顶级服务商提供的核心服务。


    # Amazon Web Services


    Amazon Web Services（简称 AWS）是目前最流行的云平台，占据了 40% 以上的云市场份额。它为开发者和架构师提供多种服务，帮助规划真正的云原生应用。开始使用
    AWS 非常简单，只需访问以下链接：https://aws.amazon.com/ 并创建一个账户即可。创建账户是免费的，并且在第一年你可以获得大量的免费层级使用额。


    登录账户后，你将看到 AWS 的所有服务以组织良好的方式分类在不同的目录下。以下展示了 AWS 服务的高层架构：


    ![](img/0ba5078687d28877e27a5bc212dacbeb_57_0.png)


    图 3.1：Amazon AWS 服务概览


    你可以点击感兴趣的服务以了解它们的更多信息。在本节中，我们将学习 AWS 提供的某些核心服务。


    # 计算 (Compute)


    当你查看服务目录时，你会发现第一个类别是“Compute”（计算）。当你开始接触云时，计算确实是你遇到的最重要且第一组服务。正如其名，计算服务为你的应用程序提供计算能力。亚马逊提供了多种计算选项。其中一些重要的如下：


    - EC2 或 Elastic Compute Cloud（弹性计算云）：EC2 是最基本的计算形式，或者简单来说，它是一个让你能够引入虚拟机来部署应用程序的服务。EC2
    带有一个易于使用的控制面板，帮助用户启动和管理虚拟机（VM）。


    下面的截图了创建 EC2 实例的界面：


    ![](img/0ba5078687d28877e27a5bc212dacbeb_58_0.png)


    图 3.2：使用 AWS 创建 EC2 实例


    EC2 在计算能力方面提供了许多可供选项。你可以选择 CPU 性能、RAM 或内存、存储类型、网络性能等。你可以选择 Amazon Machine Image（AMI，亚马逊机器镜像），它将预安装在你启动的机器上。你可以选择一个带有核心操作系统的镜像并在其安装额外软件，或者从市场中选择一个镜像，在市场中你将获得一些预装的软件。在选择镜像时要小心，因为它可能会根据软件包中包含软件的许可费用收费。通常，对于许可软件，你还会获得“自带许可”（BYOL）的选项。


    在创建 VM 实例时，你可以选择并设置安全和网络选项。记住，EC2 是 IaaS（基础设施即服务）方案的一部分，这意味着亚马逊仅负责提供基础基础设施，而你负责设置任何安全或网络需求。


    - ECS 或 EC2 容器服务：容器正成为一种非常流行的开发模式。AWS 提供 ECS 来开箱支持基于容器的开发。容器优于虚拟机的优势是它们轻量级且易于扩展。Docker
    和 Kubernetes 等工具使得基于容器的应用开发和扩展变得非常简单。我们将在第 10 章详细讨论基于容器的开发。


    - Lambda：另一种近期日益受欢迎的重要开发模式。无服务器（Serverless）编程只是以函数的形式编写代码，并直接部署到服务提供商处而无需担心底层基础设施。AWS
    Lambda 其中服务，我们可以在其中上传基于函数的代码。我们将在本书的第 11 章学习更多关于无服务器编程的内容。


    - AWS Batch：有时你需要在批处理作业中运行代码。AWS 为我们提供了 AWS Batch 服务来实现这一点。


    - AWS Beanstalk：AWS Beanstalk 提供了直接上传应用程序代码并部署到 AWS 的选项，而无需涉及底层基础设施的细节。也就是说，你不需要自己设置虚拟机；你只需要上传应用程序代码即可。


    - 其他：AWS 还提供了许多其他计算服务。我们已经提到过 EC2 容器服务或 ECS；类似地，我们还有 Amazon Elastic Kubernetes
    Service（EKS）来提供和管理基于容器的部署。此外，我们还有 Amazon Fargate，它是一个无服务器容器引擎，可以同时与 ECS 和 EKS
    工作。亚马逊还提供了 LightSail 服务，它为开发者提供完整的包，包括计算、存储和数据库。


    # 存储 (Storage)


    在计算之后，是应用程序部署所需的下一个重要内容。你需要存储来存放动态文件、静态文件、图像、代码等。同样，亚马逊为我们提供了许多存储数据的选项，如下：


    - Amazon S3 或 Simple Storage Service（简单存储服务）：亚马逊提供的流行的存储服务是 S3。它以对象的形式存储数据。凭借
    99.999999999% 的持久性，它确保你不会丢失数据。你存储在桶（buckets）中，这类似于本地机器上的文件夹。桶通过设置安全策略、加密和版本控制来管理文件。你还可以通过将
    HTML、JS 和 CSS 文件放入桶中来托管静态网站。


    - Amazon S3 Glacier：并不是所有想要存储的数据或文件都是随时需要的。例如，你可能有一些偶尔才会用到的报告。Glacier 为此类不经常访问的数据提供了更廉价的选项。当然，检索数据可能会有轻微延迟，因此在决定哪些数据进入
    Glacier 时需要小心。


    - Amazon Elastic Block Store 或 EBS（弹性块存储）：EBS 是一种与 EC2 一起使用的块存储服务。简单来说，你可以为你的
    EC2 实例选择磁盘类型。你可以选择各种尺寸。你在 HDD 和 SSD 磁盘之间进行选择。


    - 其他：我们已经讨论了 S3，它以对象的形式存储数据，以及 EBS 它以块的形式存储。亚马逊提供了 EFS（弹性文件系统），它适用于存储和共享文件。此外，亚马逊还提供了用于
    Windows 文件服务器的 FSx 以及用于 Lustre 的 FSx。


    # 数据库 (Databases)


    在计算和存储之后，设置应用程序所需的下一个重要内容是数据库。所有应用程序都需要以某种形式存储与用户和应用程序的数据（无论是关系型还是 NoSQL），以便执行其操作。亚马逊在数据库方面提供了多种选项，如下：


    - Amazon RDS 或 Relational Database Service（关系型数据库服务）：存储数据最常见且最老的方法是关系型。Amazon
    RDS 支持许多流行的关系型数据库，如 MySQL、


