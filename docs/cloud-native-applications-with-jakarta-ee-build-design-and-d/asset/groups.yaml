    ## 总结


    在本章中，我们首先了解了 Jakarta EE。Eclipse 基金会拥有 Jakarta EE，它以前被称为 Java EE。它为开发应用程序和服务提供了标准。Jakarta
    EE 是云原生 Java 的未来。我们使用 Jakarta EE 的规范创建了基于 REST 的服务。


