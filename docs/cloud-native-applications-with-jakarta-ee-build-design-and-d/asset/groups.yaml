    \nThe preceding screenshot shows various specifications by MicroProfile. Blue\
    \ boxes show the specifications taken from J2EE, and orange boxes show the specifications\
    \ added by MicroProfile.\n\n- **Open Tracing**: It provides a standard way of\
    \ tracing requests across multiple services. This can be very useful, when your\
    \ application grows and multiple services are calling each other, as one can easily\
    \ track the control flow and find problematic areas.\n\n- **Open API**: Documenting\
    \ microservices is an important aspect to make sure everyone involved has the\
    \ same understanding of the service. Open API helps here by providing standards\
    \ for documenting the API.\n\n- **REST Client**: Once your system grows, your\
    \ services will be calling each other to fulfill the required tasks. REST Client\
    \ provides a type-safe method to call other services. You also have the option\
    \ to auto-generate the clients.\n\n- **Config**: Every application needs some\
    \ configuration like system properties, environment variables, etc. With MicroProfile,\
    \ you can configure your application from outside without the need for repackaging\
    \ the whole thing.\n\n- **Fault Tolerance**: Once you create a microservice, you\
    \ need to make sure it is available all the time, that is, there is no downtime.\
    \ Eclipse MicroProfile Fault Tolerance provides us with ways to implement timeouts,\
    \ retries, fallback mechanisms, bulkhead pattern (isolate failures), circuit breaker\
    \ pattern (fail fast), and so on.\n\n- **Metrics**: Once your services are up\
    \ and running, you will need a way to monitor the performance. MicroProfile metrics\
    \ give us ways to check important parameters like CPU usage, Heap Memory, Garbage\
    \ collection, etc.\n\n- **JWT**: JWT stands for JSON Web Token. It's a JSON-based\
    \ text format for passing information to services. It is helpful when your service\
    \ needs some formation to be passed to it in a secured manner.\n\n- **Health Check**:\
    \ Once your services are in production, you need to make sure they are healthy\
    \ and responding in a timely manner. Eclipse MicroProfile provides out of the\
