    ## 计算


    如前所述，Azure 提供了一系列用于计算的服务。在接下来的章节中，我们将查看一些计算服务：


    - **虚拟机**: 类似于 Amazon EC2，Azure 提供了各种形式的虚拟机选项。

    - **虚拟机扩展集**: 应用的另一个重要方面是扩展性。虚拟机扩展集（VMSS）可以根据需要进行扩展或收缩。

    - **服务集群**: Service Fabric 帮助以易于的方式部署和平衡负载。

    - **函数应用**: 就像 Amazon Lambda 一样，可以使用函数来部署无服务器代码。

    - **处理服务**: 对于可以独立运行的作业，Azure 提供了处理服务支持。

    - **其他**: 与 Amazon 类似，Azure 为容器的部署提供了广泛支持。


    ## 存储


    对于任何应用，都需要存储来处理文件、数据、图像等。Azure 在此部分有几个重要的服务：


    - **Azure 存储帐户**: Azure 提供了存储帐户选项，其具有多种数据存储格式，如下：

    - **Blob 存储**: 这可以用于非结构化数据。

    - **文件存储**: 正如名所示，可以在此存储中不同类型的文件。

    - **表存储**: 以表格的形式存储数据。

    - **队列存储**: 用户可以在队列中添加和读取消息。


    **其他**: 除了存储帐户外，Azure 还提供了其他选项，例如用于大数据处理的 Lake 存储、用于将大量数据移动到 Azure 的 Box，以及用于确保数据和应用程序安全且可恢复的备份和恢复服务。


    ## 数据库


    数据库是任何应用的核心。与 Amazon 类似，Azure 提供了许多选项帮助开发者管理数据库中的数据，如下：


    - **Azure SQL 数据库**: 提供作为 PaaS 或平台即服务的 SQL 数据库。你可以根据 CPU、内存等选择数据库所需的计算能力。

    - **Azure MySQL 数据库**: 对于 MySQL 用户，Azure 提供了现成的 MySQL 数据库选项。你可以根据需求设置数据库和计算能力。

    - **Azure PostgreSQL 数据库**: 与 MS-SQL 和 MySQL 类似，Azure 提供了对 PostgreSQL 数据库的现成支持。

    - **Azure MariaDB 数据库**: 正如名所示，该选项提供了构建在可扩展云基础设施上的 MariaDB 数据库服务。MariaDB 是从 MySQL
    分出的，并提供了额外功能。

    - **Azure CosmosDB**: CosmosDB 是 Azure 提供的 NoSQL 产品。你可以从 Core SQL、MongoDB、Cassandra、Azure
    Table 或 Gremlin（基于图）等选项中选择。

    - **Azure Cache for Redis**: Azure Cache for Redis 是一个提供 Redis 缓存功能的服务。


