    Postgres, Oracle, MS-SQL, and Maria DB. You get additional features like database
    backup strategy, and you can make sure that your database is only accessible from
    your application through access restrictions.


    - **Aurora**: Amazon Aurora is off-the-shelf Relational Database solution provided
    by Amazon, which is MySQL and PostgreSQL compatible. Amazon claims it to be five
    times faster than standard MySQL, and three times faster than standard PostgreSQL.


    - **DynamoDB**: DynamoDB provides a key-value database system, which is a classic
