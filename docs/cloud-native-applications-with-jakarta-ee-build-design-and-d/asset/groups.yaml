    ## 因子 7 – 端口绑定


    通过端口绑定导出服务

    为了保持应用程序的松耦合，建议每个服务都绑定到一个端口。正如我们在因子 4 中强调的，即要考虑通过 URL 访问的支持服务，类似地，你应用程序中的每个独立服务都应该可以通过
    URL 访问。例如，在本地系统中，你可能可以通过 `localhost:<<port number>>` 访问服务，而对于外部用户将通过路由层进行路由。


    ## 因子 8 – 并发


    通过进程模型进行扩展

    应用程序可以通过两种方式进行扩展：垂直扩展和水平扩展。在垂直扩展中，我们增加更多的硬件能力，例如在同一台机器上增加内存或 CPU。但这种扩展方式有局限性，而且成本很高。因此，建议你的应用程序能够进行水平扩展，也就是说向应用程序集群中添加更多实例或节点，并将负载轻松地分布在这些节点之间。


    ## 因子 9 – 可移动性


    假设部署应用程序的某个节点开始抛出错误或运行变慢。你应该能够从部署中移除此实例，其他实例能够响应此事件并优雅地处理负载。通过这种方式，我们可以管理故障并以优雅的方式扩展应用程序。我们可以杀死实例并引入新实例，而不影响最终用户。


    ## 因子 10 – 开发/生产环境并行


    保持开发、测试和生产环境尽可能相似

    在应用程序开发生命周期中，可能会观察到某些问题，例如某个功能在一个环境中运行正常，但在另一个环境中报错，尽管部署在两个环境中的构建版本是相同的。问题可能出在底层环境或设置上；例如，两个环境具有不同版本的库或工具。因此，这一原则变得非常重要，因为它迫使我们确保部署应用程序的环境（如开发环境、测试环境、准备环境或生产环境）是相似的。这避免了某些事物在一个环境中正常但在其他环境中不正常的情况。


    ## 因子 11 – 日志


    将日志视为事件流


    与第 9 章不同，对于云原生应用程序，我们已经强调了日志和监控的需求。在分布式系统中，调试应用程序非常困难，因为与单体应用程序不同，不同的动作发生在不同的服务之间，事件被记录在不同的地方。为了克服这个问题，建议将日志视为事件流并将它们存储在中心位置。你的应用程序实例可能会由于扩展需求或系统错误而启动或停止，但你将能够集中地捕获和管理日志。你可以开发中央仪表板，轻松地监控发生在不同节点和服务上的各种活动。


    ## 因子 12 – 管理进程


    作为一次性进程运行管理/维护任务


    管理任务可以是备份数据库之类的任务。这一原则规定，这类管理任务应该被视为一次性进程并与核心应用程序分开处理。例如，你不希望在处理最终用户请求的主应用程序服务器所在的同一机器上运行备份数据库的进程。


    ## 云原生应用的常用设计模式


    在整本书中，我们一直在讨论构建云原生应用程序的最佳实践。当我们讨论设计云原生应用程序时，并没有万能银药，但幸运的是，云原生应用程序已经构建了长期，观察到了许多可以解决常见问题的良好模式。在本节中，让我们来看看其中一些设计模式，在构建云原生应用程序时应该考虑哪些模式。


    ## SAGA 模式


    有时会涉及多个微服务来完成一个事务。一个非常经典的例子是你在电子商务网站上下单。整个过程包括多个步骤，对最终用户而言可能是可见的也可能是不可见的。让我们看看电子商务网站下单的简化工作流：


    ![](img/0ba5078687d28877e27a5bc212dacbeb_224_0.png)

    图 12.1：下单流程


    前面的截图显示了在电子商务网站上下单的过程。以下是涉及的步骤，如前面截图中的数字所示：


    - 1. 用户点击按钮下单。

    - 2. 触发支付服务，用户通常会看到支付选项，或选择一个预存的选项。用户确认选项并提供详细信息。

    - 3. 一旦支付成功，将触发库存服务，在其中确认订单并更新库存。同时，订单服务也会收到支付成功的消息。

    - 4. 当库存服务确认订单后，触发发货服务以开始发货流程。此时，会将最终的订单确认发送回订单服务。

    - 5. 一旦发货服务启动发货，并将发货状态发送给订单服务，该状态可以与最终用户共享。


    正如我们看到的，整个端端事务是多个步骤的组合。在任何服务级别都可能发生问题，例如支付未成功或在库存级别无法确认订单，我们需要回滚付款。为了管理这种处理，我们有两种流行的方法：编排（choreography）和协同排（orchestration）。


    ## 基于编排的 SAGA


    让我们先看看基于编排的 SAGA 实现。这是通过跨各种服务的事件驱动通信实现的。每个服务向队列发布事件，各种服务监听该队列。监听服务将根据数据执行操作。回到电子商务的问题：


    ![](img/0ba5078687d28877e27a5bc212dacbeb_225.png)

    前面的截图展示了事件通信如何帮助我们的订单。让我们重新看流程：


    - 1. 用户下单，订单服务更新。

    - 2. 订单服务发布一个“订单已接收”的事件，该事件被支付服务监听，从而触发支付流程。

    - 3. 一旦支付成功，支付服务发布“支付成功”事件。该事件被库存服务监听，以更新订单状态。

    - 4. 库存服务处理订单后发布“订单已处理库存”事件，该事件被发货服务和订单服务监听。

    - 5. 最后，发货服务发布“物流已启动”。


    ## 基于协同的 SAGA


    在这种类型实现中，核心角色由协调器（orchestrator）担任。协调器服务控制各种服务之间的整体通信。让我们看看我们的电子商务示例，看看协同在这种情况下是如何工作的：


    ![](img/0ba5078687d28877e27a5bc212dacbeb_226.png)

    正如前面的截图所示，这里的核心角色由协调器服务担任。让我们逐步查看整个流程：


    - 1. 用户下单，订单服务更新。

    - 2. 订单服务告诉协调器服务它收到了新订单。

    - 3. 协调器服务通过通知支付服务订单详情来启动支付。

    - 4. 支付完成，支付服务更新协调器。

    - 5. 协调器服务现在通知库存服务订单。同时，协调器服务也会通知订单服务支付状态。

    - 6. 库存服务向协调器确认订单。

    - 7. 协调器此时通过向发货服务发送请求来启动发货。协调器将告知订单服务的当前状态。

    - 8. 发货服务通知协调器已启动。

    - 9. 协调器用物流状态更新订单。


    ## 编排与协同


    此时一个明显的问题是——哪种是实现 SAGA 的更好选择？嗯，没有万能银药；我们需要考虑手头的问题，因为两种方案都有其优缺点。


    ### 编排 (Choreography)


    优点：


    - 真正的微服务方法，因为所有服务都相互独立。


    '
