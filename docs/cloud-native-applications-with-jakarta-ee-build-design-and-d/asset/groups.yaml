    **Amit Khanna** 拥有超过 13 年构建大规模分式应用程序的经验。Amit 目前在一家跨国公司担任高级软件工程师。他在使用 AWS 和 Azure
    云通过 CI/CD 构建和部署应用方面拥有实战经验。Amit 拥有德里理工学院（IIT Delhi）计算机科学硕士学位。


    # 致谢


    感谢我的家人和朋友，他们总是推着我超越极限。


    # 前言


    构建云原生应用不仅仅是一个开发过程，更是我们对整个应用开发思维方式的改变。那种花费几个月或几年时间来发布一个应用程序或新功能的时代已经过去了。我们生活在一个竞争竞争的世界里，我们需要在几天内推出应用和新功能。我们需要构建能够从几百用户扩展到数百万用户而无需任何额外的应用程序。


    云改变了我们过去对应用开发过程的思考。我们需要意识到云的力量、它能提供的所有功能，以及我们如何充分利用云的能力。本书的编写愿景是重新思考应用设计和开发，同时将云能力作为核心。


    以下是本书涵盖的章节：


    # 第 1 章 云计算简介


    - 什么是云？

    - 理解 IaaS、PaaS、SaaS 和 FaaS

    - 云提供的主要服务


    # 第 2 章 云设计


    - 云原生对比传统开发

    - 云端需要考虑的设计因素

    - 常见错误


    # 第 3 章 云计算的主要参与者


    - Amazon Web Services (AWS)

    - 微软 Azure

    - Google Cloud (谷歌云)

    - 其他重要参与者


    # 第 4 章 使用 Jakarta EE 的示例应用


    - 什么是 Jakarta EE？

    - 创建示例应用

    - 部署到云


    # 第 5 章 云应用测试


    - 单元测试

    - 集成测试

    - 服务测试

    - 端到端测试

    - 性能测试

    - 测试方面

    - 代码覆盖率


    # 第 6 章 持续集成与持续交付


    - CI/CD 简介

    - 持续集成

    - 持续交付


    # 第 7 章 云端应用安全


    - 云安全

    - 常见威胁与防御

    - 理解安全


    # 第 8 章 可扩展性


    - 可扩展性简介

    - 云端扩展性

    - 可扩展性设计

    - 实现示例


    # 第 9 章 监控、告警与报告


    - 监控的需求

    - 云端监控、告警与报告

    - 日志


    # 第 10 章 容器


    - 容器简介

    - Docker

    - Kubernetes


    # 第 11 章 无服务器计算


    - 无服务器计算简介

    - 函数即服务

    - 高级示例


    # 第 12 章 云原生开发最佳实践


    - 回顾云原生开发

    - 12 Factor 应用

    - 云原生设计模式


