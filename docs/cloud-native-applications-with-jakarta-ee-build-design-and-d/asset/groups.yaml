    # Dedicated to


    My Family and Friends

    Who are always with me to love, support, and care.


    # About the Author


    **Kamalmeet Singh** has 16 years of experience in the IT Industry. He has worked
    in bootstrapping startups, as well as Fortune 500 companies. He has worked in
    different technologies and domains. The technologies that he has worked on range
    from Cloud computing, Machine Learning, Augmented reality, Serverless applications,
    Microservices, Mobile applications, Java, Python, ROR, C#, and so on.


    He has co-authored two books on Java Design patterns and Microservices. He is
    passionate about cloud computing and exploring the power of cloud for developing
    future ready applications, that are secured, and scalable, with less time to market.


    # About the Reviewer


    **Amit Khanna** is working with more than 13 years of experience in building large
    scale distributes applications. Amit is currently working as a senior software
    engineer at a multinational company. He has hands on experience in building and
    deploying applications using CI/CD on AWS and Azure cloud. Amit has M.Tech in
    Computer Science from IIT Delhi.


    # Acknowledgement


    I would like to thank my family and friends who always push me to stretch beyond
    my limits.


    # Preface


    Building cloud native applications is not just a development process, but a change
    in the way we think of application development as a whole. Gone are the days when
    one could take months or years to roll out an application or a new feature. We
    live in a competitive world, where we need applications and new features to roll
    out in days. We need to build applications that can scale from a few hundred users
    to millions of users without any extra effort.


    Cloud has changed the way we used to think about the application development process.
    We need to be aware of the power of cloud, what all features it can provide, and
    how we can make full use of the cloud''s capabilities. This book is written with
    the vision to rethink application design and development, but keeping cloud capabilities
    at the core.


    The following are the chapters covered in this book:


    # CHAPTER 1 Introduction to Cloud Computing


    - What is Cloud?

    - Understanding IaaS, PaaS, SaaS and FaaS

    - Major Services provided by Cloud


    # CHAPTER 2 Design for Cloud


    - Cloud Native versus Conventional Development

    - Design factors to be considered for cloud

    - Common mistakes


    # CHAPTER 3 Major Players in Cloud Computing


    - Amazon Web Services

    - Microsoft’s Azure

    - Google Cloud

    - Other important players


    # CHAPTER 4 Sample Application using Jakarta EE


    - What is Jakarta EE?

    - Creating a sample application

    - Deploying to Cloud


    ## CHAPTER 5 Testing Cloud-Native Applications


    - Unit Testing

    - Integration Testing

    - Service Testing

    - End to End System Testing

    - Performance Testing

    - Additional Testing aspects

    - Test-Driven Development

    - Static Code Analysis and Code Coverage


    ## CHAPTER 6 Continuous Integration and Continuous Delivery


    - CI and CD - An Introduction

    - Continuous Integration

    - Continuous Delivery

    - Cloud support for CI and CD


    ## CHAPTER 7 Securing Cloud-Based Applications


    - Security in Cloud

    - Common threats and defense

    - Understanding Security with an example


    ## CHAPTER 8 Scalability


    - Introduction to scalability

    - Cloud-based scalability

    - Design for scalability

    - An example implementation of a scalable application


    ## CHAPTER 9 Monitoring, Alerting, and Reporting


    - Need for monitoring

    - Cloud-based monitoring, alerting, and reporting

    - Application logs


    # CHAPTER 10 Containers


    - Introduction to containers

    - Docker

    - Kubernetes

    - Example-based application


    # CHAPTER 11 Serverless Computing


    - Serverless Computing: An Introduction

    - Functions as a Service

    - Advanced Examples for Serverless


    # CHAPTER 12 Best Practices for Developing Cloud-Native Applications


    - Revisit Cloud-Native Development

    - 12 Factor Application

    - Common Design patterns for Cloud-native


