    Like Amazon, Azure provides a vast set of services – like for networking, it has
    virtual network for setting up VPNs, load balancer for managing application load,
    application gateway for managing web traffic, network security group for managing
    security, and ExpressRoute for connecting to on premise network.


    There are additional services, like Web App for deploying web applications, a
    Logic App service to automate workflows and business processes, and CDN service
    for Content Delivery Network. For Internet of Things, we have services like IoT
    central application and IoT Hub.


    # Google Cloud


    In the previous two sections, we talked about Amazon’s AWS and Microsoft’s Azure,
    which are the top cloud service providers. Another provider that is becoming popular
    rapidly is Google Cloud. Google provides a lot of competitive services and tools
    for cloud.


    Similar to Amazon EC2 and Azure Virtual Machine, Google provides a Compute Engine
    to help setup virtual machines. It provides App Engine to deploy web applications
    directly, like Amazon Beanstalk. Kubernetes Engine helps to set up Kubernetes
    and Containers. Google Cloud functions are equivalent to Amazon Lambda and Azure
    function, and help one develop and deploy code in terms of functions.


    For storage, Google provides Cloud Storage options. For SQL, Google has a Cloud
    SQL option. In addition, Google also has Bigtable and Datastore options. Google
    Cloud Memystore provides the option for Redis cache implementations.


    For networking, Google provides VPC network services. Additionally, it provides
    Cloud DNS for managing domains, Cloud CDN for the content delivery network, Cloud
    Load Balancing for managing the load and traffic director to traffic proper microservice
    instances.


    # Other important players


    We already talked about Amazon, Microsoft, and Google; together these three hold
    more than 70 percent of market share. Some of the other important players are
    Alibaba and IBM, which also have good presence in cloud market. Then, there are
    players like Adobe, Oracle, and Rackspace, which are trying to make a mark in
    cloud services. There are many other smaller players, which are targeting niche
    markets like Salesforce.'
  - '[PAGE 67]


    With many players, the obvious question that is asked frequently is which to choose.
    As we have seen, most of the big cloud players provides services which are competitive,
    and one cannot just mark one service provider higher than others. There will be
    a lot of factors that come into the picture, when we are selecting cloud service
    provider, to which we want to deploy our application. If you are already using
    the services of a cloud service provider for some of your work, that will be the
    obvious choice, as you would like to reuse your team''s expertise. Secondly, you
    will need to look at what cloud services you are going to use, and then look at
    service providers who are providing the services you need. While selecting a cloud
    service provider, you should also consider your future needs along with current
    requirements. Cost will be another factor. Mostly, cloud service providers have
    competitive cost, but they might have different access for free tier or differing
    costing mechanism for different services. So, based on which services you are
    expecting to use, you might want to do a cost analysis.


    Another important factor that, at times, big projects and companies keep into
    consideration is to avoid dependency on one cloud service provider. You might
    want to design your application in a manner that can be supported by multiple
    service providers, or the movement from one service provider to another is not
    very tricky. This approach helps in giving projects flexibility in the long term.


    # Summary


    In this chapter, we had a high-level look at various cloud service providers.
    When you start a project with cloud for the first time, you need to be aware of
    your options. There are many cloud service providers in the industry today, which
    provide competitive services in terms of features and cost.


    We learned about some of the top players, like Amazon''s AWS and Microsoft''s
    Azure. We looked into the top services provided by these players. We also looked
    into Google Cloud briefly. We talked about some of the additional players in the
    industry, which are trying to make their mark and can be a good option for exploration.
    We also talked about the things one needs to consider, when taking a call on cloud
    service provider can be a good fit for the project in hand.


    It is beyond the scope of this book to look into details of each cloud service
    provider, so readers are encouraged to explore at least a couple of providers
    of their choice. Nothing can beat a hands-on experience. We will use some of the'
