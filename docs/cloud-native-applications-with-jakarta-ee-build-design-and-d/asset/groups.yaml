    # # Self-healing system


    We understand that a system with multiple microservices communicating each other
    can be complex in nature and is prone to some failure. We already talked about
    the design factor that one should embrace failure and handle that gracefully.
    Now the question is, what after the failure? Our systems should be designed in
    a manner that if a service stops responding, can it be restarted automatically
    based on some performance or application logs? Or can we design the system, so
    that if one instance of service stops responding, we bring up additional service
    instance and transfer load to that?


    We need to consider the questions at design time, like would happen once this
    service fails? Can this be fixed automatically with a restart? Can the situation
    be handled by distributing the load to another instance? Answering these questions
    will help us create a robust system, which can heal itself without manual intervention.


    # # Manage data


    An important aspect of any system is data and databases. While designing a complex
    system, which is going to deal with multiple microservices, it becomes more important
    to understand how the data will be managed? A golden rule for microservices is
    that each microservice manages its own data, but that might not be possible, as
    there will be some shared data. Also, some reporting services need to fetch data
    from multiple sources, so we need to take a call on how much division of data
    is possible without impacting overall performance.


    A good example of handling data complexities is with views. A view is a snapshot
    of data, which can be created from multiple data sources. This will be created
    after applying joins, and filters on data, and help us improve performance at
    runtime. But it does come with an overhead that one needs to take care of – factors
    like refreshing data in a timely manner to avoid servicing'
