    **Kamalmeet Singh** 拥有 16 年 IT 行业经验。他曾在初创企业工作过，也曾在世界 500 强企业工作过。他涉及过不同的技术和领域。他从事的技术范围涵盖云计算、机器学习、增强现实、无服务器应用、微服务、移动应用、Java、Python、ROR、C#
