    按需获取资源。整个过程的底线是，你只想为你正在使用的资源付费。你不希望为未使用的基础设施付费，但同时，你也不希望由于计算或存储资源的稀缺而影响到你的终端用户。


    之前提到的关于在成本和生产力之间取得良好平衡的问题具有挑战性，但通过细致的设计和实现，是可以实现的。在进入细节之前，我们应该先熟悉几个核心术语。


    **纵向扩展（Vertical scaling）：** 为应用增加更多性能的最直接方法是升级基础设施；例如，如果你之前的内存是 16 GB，那么再添加一个
    16 GB 的芯片。这是扩展基础设施的一种有效方法，但正如我们所见，这种可扩展性成本很高（需要获取更高能力的机器），而且由于有硬性限制，因为你所添加资源只能达到某个极限。


    下图展示了纵向扩展的概念：


    ![](img/0ba5078687d28877e27a5bc212dacbeb_151_0.png)


    图 8.1：纵向扩展


    **水平扩展（Horizontal scaling）：** 另一方面，水平扩展意味着为现有的服务或应用添加额外的资源。这通常更廉价，因为获取多台低配置机器比获取一台高配置机器要便宜得多。


    下面的截图强调了水平扩展的概念：


    ![](img/0ba5078687d28877e27a5bc212dacbeb_152_0.png)


    图 8.2：水平扩展


    不用说，纵向扩展有其局限性且成本很高。在不停机的情况下进行纵向扩展也是困难的，因为大多数云提供商在升级机器容量时可能需要重启系统。


    所以，当我们谈论设计能够支持扩展的应用时，我们主要担心的是水平扩展。


    ## 基于云的可扩展性（Cloud-based scalability）


    正如我在本章开头提到的，云已经让可扩展性变得非常简单；其中一个因素是我们拥有许多开箱即用的解决方案，这些解决方案帮助我们设计可扩展的应用。


    有些解决方案可以自动扩展，而无需开发团队进行任何特殊工作；例如，无服务器（serverless）代码。AWS 提供了 Lambda 函数，Microsoft
    Azure 提供了 Functions，它们让你以函数的格式开发代码，并将其直接部署在云端，而无需设置虚拟机或 Web 服务器。其核心思想是开发者可以专注于编码需求，而如何部署和扩展则完全取决于云服务提供商。


    当我们思考一个应用时，在基础设施方面会想到的三个核心领域是**计算、数据库和文件存储**：


    ![](img/0ba5078687d28877e27a5bc212dacbeb_153_0.png)


    图 8.3：云端应用基础设施


    现在我们详细详细研究这三个领域，并看看云服务提供商如何帮助我们扩展这三个核心方面中的每一个。


    ## 计算可扩展性（Compute scalability）


    计算主要是你的应用代码部署的区域。任何人在接触云服务时遇到的第一个计算选项就是虚拟机。它与任何物理机器一样好，你可以在上面部署你的代码。大多数云服务都提供创建扩展单元和节点等选项，可以在其中指定想要如何扩展你的应用。一个简单的规则可以是：将初始基础设施设置为基础机器，当
    CPU 使用率超过 75% 时添加一台机器。你可以将这些机器放置在负载均衡器后面，这将负载均匀地分布在所有机器上。由于这是在云中实现可扩展性的常用方式，我们将在本章的最后一节详细介绍，届时我们将查看可扩展性的代码示例。


    通过理解开发者的需求，云服务提供商为我们提供了许多不同的部署选项；例如，我们有无服务器函数，帮助我们部署代码片段而不必担心底层基础设施和可扩展性。我们将在第
    11 章介绍无服务器计算。同样，还有像设置批作业来处理后台任务（它们可以独立运行），以及各种云服务提供商提供的现成应用部署选项。


    此外，随着容器部署的流行，所有云服务提供商都提供了 Docker 和 Kubernetes 的现成方案，用于部署和管理基于容器的基础设施。我们将在第 10
    章详细介绍容器。


    我们看到，在云中有多种管理计算可扩展性的选项，但开发团队有责任确保他们理解云服务提供商提供的所有选项，并使用对所开发应用有利的服务。


    ## 数据库可扩展性（Database scalability）


    在计算服务之后，任何应用的下一个重要方面就是数据库。归根结底，你的应用执行的最任务是处理、管理和存储数据。从历史上来看，数据库是应用中最难扩展的，原因是大多数时候你希望将数据保留在一个位置以管理
    ACID 属性，即原子性、一致性、隔离性和持久性。将所有数据放在单台机器上有挑战性，因为单机只能增长到某个极限。分片（Sharding）是一种帮助扩展 SQL
    数据库的流行机制，将数据在逻辑上划分为不同的机器。


    随着基于 NoSQL 数据库的流行，可扩展性不再是一个挑战，因为添加额外的基础设施来扩展数据库变得更容易了。所有主要的云服务提供商都有此类选项。


    ## 存储可扩展性（Storage scalability）


    大多数云提供商提供了如 S3 和 Azure 等选项。这些服务提供了可扩展性，这使得设计频繁存储在磁盘上的应用变得合理。此外，人们可以使用托管存储。


    ## 可扩展性设计（Design for scalability）


    到目前为止，本章讨论了可扩展性以及云服务提供商如何帮助我们实现它。但我们一直强调的一点是，无论提供多少服务，这都是设计的责任。下图展示了应用处理正常负载的场景：


    ![](img/0ba5078687d28877e27a5bc212dacbeb_156_0.png)


    在设计可扩展性时，我们希望确保系统能够水平扩展。下面的截图展示了应用处理高负载的场景：


    ![](img/0ba5078687d28877e27a5bc212dacbeb_156_1.png)


    当我们谈论可扩展性设计时，最突出的且最重要的点是微服务。微服务是应用中最小的独立部分，可以以孤立的方式完成任务。微服务可以独立于应用的其他部分进行收缩或扩展，这使得在我们谈论可扩展性时成为最合适的设计方法：


    ![](img/0ba5078687d28877e27a5bc212dacbeb_157_0.png)


    图 8.6：微服务的扩展


    前面的截图展示了在微服务实现中，每个服务如何独立地收缩或扩展。如果某个服务面临高负载，它可以自己扩展而不会打扰其他服务；事实上，，没有其他服务会知道某个服务正在扩展。

