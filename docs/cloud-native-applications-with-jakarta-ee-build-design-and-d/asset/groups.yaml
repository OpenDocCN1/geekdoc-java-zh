    多年或 Serverless（无服务器）计算服务。正如其名所示，在 serverless 部署中，你不需要担心执行代码的服务器或基础设施。你只需要编写好代码，并以函数的形式将其上传到云服务器提供商的基础设施中。


    serverless 部署的另一个优势是它可以让你访问云服务器提供商提供的各种功能，例如，你的代码由云端发生的事件触发；例如，存储中添加了新文件或数据库中新增了新记录。你可以通过简单的
    GUI 连接到数据库、消息队列等各种服务，并将其作为触发器或目标。


    我们将在第 11 章中详细讨论代码的 serverless 实现。批处理（Batch）：一组可以以批作业的形式在后台运行的服务，可以从云服务提供商提供的批服务中受益。例如，一个每
    24 小时运行一次、生成当日销售报告并通过电子邮件发送报告的服务，非常适合这种基础设施。所有常见的服务提供商都提供批计算产品。


    特定厂商的服务：除了之前提到的服务外，几乎所有云服务提供商都提供 PaaS（平台即服务）产品，帮助应用程序和服务的开发与部署。例如，Amazon 提供了 elastic
    beanstalk，你可以直接在那里部署服务。同样，Azure 也提供了 app-automated 和 service fabric 等服务。


    ## 使用虚拟机部署 Web 服务


