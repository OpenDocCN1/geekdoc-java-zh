    # # Factor 7 – Port binding


    Export services via port binding

    To keep our application loosely coupled, it is recommended each service be bound
    to a port. As we highlighted in factor 4, where it was mentioned to consider backing
    services available through a URL, similarly, each separate service in your application
    should be accessible through a URL. For example, on the local system, you might
    be able to access a service as localhost:<<port number>>,, for the external user,
    the routing will be done using a routing layer.


    # # Factor 8 – Concurrency


    Scale out via the process model

    An application can be scaled in two ways, vertical scaling and horizontal scaling.
    In the vertical scaling approach, we add more hardware power like adding RAM or
    CPU to the same machine. But this type of scaling has its limit and is usually
    costly. So, it is recommended that your application should be able to horizontally
    scale, that is, more instances or nodes can be added to the application cluster,
    and your load can be easily distributed among these nodes.


    # # Factor 9 – Disposability


    Say, one of the nodes on which the application was deployed starts throwing errors
    or has become slow. You should be able to remove this instance from the deployment,
    and other instances should be able to respond to this event and handle the load
    gracefully. In this way, we can manage failure and scale the application in a
    graceful manner. We can kill instances and bring new instances without impacting
    the end-user.


    # # Factor 10 – Dev/prod parity


    Keep development, staging, and production as similar as possible

    There are instances, when in your application development lifecycle, you observe
    issues like one feature working in one environment but error out in another. While
    the build version deployed in both environments is the same. The issue can be
    in the underlying environment or settings; for example, the two environments have
    different versions of a specific library or tool. Hence,'
  - '[PAGE 223]


    principle becomes very important, as it forces us to make sure our environments
    on which we are deploying the application, like a development environment, test,
    staging, or production environment, are similar. This avoids situations where
    things are working on one environment but not on others.


    # # Factor 11 – Logs


    Treat logs as event streams


    We have already emphasized on logging and monitoring needs, when it comes to a
    cloud-native application, unlike Chapter 9. In a distributed system, it is very
    difficult to debug an application as, unlike a monolithic application, different
    actions are happening across different services, and events are logged at different
    places. To overcome this problem, it is suggested to treat logs as event streams
    and store them in a centralized position. Your application instances are going
    up and down due to scalability needs or system errors, but you will be able to
    capture and manage logs centrally. You can develop central dashboards to monitor
    various activities happening different nodes and services easily.


    # # Factor 12 – Admin processes


    Run admin/management tasks as one-off processes


    Admin tasks can be tasks like backing up a database. This principle says that
    these kinds of admin tasks should be treated as one-off processes, and handled
    separately from the core application. For example, you do not want to run the
    process backing up the database on the same machine as where your main application
    server handling end-user requests is running.


    # # Common design patterns for Cloud-native applications


    We have been talking about best practices for building a cloud-native application
    throughout this book. There is no silver bullet when we talk about designing a
    cloud-native application, but fortunately, cloud-native applications are being
    built for a long time now, and many good patterns are observed that can solve
    commonly occurring issues. In this section, let''s take a look at some of these
    design patterns, which one should consider while building a cloud-native application.'
