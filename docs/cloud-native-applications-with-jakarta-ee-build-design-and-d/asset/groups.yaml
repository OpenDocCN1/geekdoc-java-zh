    整个应用程序，这将浪费大量的资源。


    - **非敏捷**：在当今的世界中，你希望对代码库进行更改并尽快发布。在单体应用中，这是很难做到的，因为你需要构建、测试并部署整个应用程序。


    - **受限于技术栈**：假设你有一个 Java 应用程序，并且你想为该应用程序添加一个报告功能。你知道 Python 以库的形式提供了对这种类型报告的支持，而且开发时间比在
    Java 中短一半以上。但在单体设计中，你无法这样做，因为整个应用程序需要一起构建和部署，并且必须使用相同的技术进行构建。


    由于我们讨论了关于单体应用所面临的所有挑战，架构师们放弃了“单一大块”的方法，并开始考虑将代码拆分为更小的服务和子服务。


    ## 服务体系架构


    面向服务的架构（Service-Oriented Architecture，通常被称为 SOA）是一种有助于将代码拆分为更小服务的方法。SOA 可以被看作微服务（Microservices）在此基础上进一步发展的基础；因此，理解服务（Services）和面向服务的架构的概念至关重要。


    想象一个电子商务门户，我们可以从多个服务的角度将整个应用程序划分为：


    - 账户管理服务（Account Management Service） - 创建和登录用户

    - 搜索管理服务（Search Management Service）

    - 目录管理服务（Catalog Management Service）

    - 购物车服务（Shopping Cart Service）

    - 支付管理服务（Payment Management Service）

    - 物流管理服务（Shipping Management Service）

    - 库存管理服务（Inventory Management Service）

    - 管理员服务（Admin Service）


    下图显示了基于面向服务的架构，不同功能现在是如何被划分为服务的：


    ![](img/0ba5078687d28877e27a5bc212dacbeb_44_0.png)


    图 2.2：面向服务的架构


    图 2.2 为了简单起见显示了一个单一数据库，但可能涉及多个数据库。这里的优势显而易见；假设我想修改搜索功能的实现方式，我知道应该去哪里寻找现有代码并进行更改。我知道哪个服务需要进行测试。


    但面向服务的设计并没有涉及到服务应该如何实现的细节。数据可能存储在同一个数据库或不同的数据库中，代码可能保持在一起、一起构建并使用单个部署脚本进行部署。为了更清晰地了解服务并进一步划分服务，微服务的概念应运而生。


    ## 微服务


    面向服务架构改变了我们思考应用程序的方式，并帮助我们将其视为多个服务。微服务将这一想法推向了极致，建议将每个服务拆分为最小的逻辑级别。更小的独立服务有助于释放云的力量。很难猜是云是否帮助了微服务的流行，还是反之亦然。无论如何，需要注意的是云和微服务是相辅相成的。让我们从理解什么是微服务开始。


    “微服务——也称为微服务架构——是一种将应用程序结构化为松耦合服务的架构风格，这些服务实现了业务能力。微服务架构实现了大型复杂应用程序的持续交付/部署。它还允许组织演进其技术栈
    http://microservices.io/


    基本上，微服务是应用程序中最小的、能够以独立方式履行某些功能的单元。让我们回到之前的 SOA 电子商务示例，其中我们有几个服务协作交付一个电子商务应用程序。让我们取一个服务，例如账户管理服务。当我们谈论微服务时，首先尝试考虑的是将服务拆分为更小但在逻辑上有意义的服务。例如，账户管理服务目前承担着创建新账户、管理和更新账户、为账户提供身份验证和授权、管理历史记录以及为未来的购买提供建议等角色。


    你可能会问，微服务到底有多大？答案有点复杂，因为没有固定的参数。通常，我们尝试根据功能性来划分应用程序以创建微服务；因此，一个将图像转换为缩略图的微服务，而搜索微服务可能会散布在多个类中。有一个经验法：在定义一个服务时，如果你使用了太多的“逗号”和“和”，你就知道它仍然可以进一步拆分。当我说服务提供功能
    A 和 B 时，我应该拥有服务 A 和服务 B。具体的服务取决于项目，但这是理解如何思考微服务的一个良好开始。


    回到我们的账户管理服务，我们可以考虑将其进一步划分为更细的服务：


    - 账户微服务（Account Microservice）

    - 账户管理微服务（Manage Account Microservice）

    - 当前订单管理微服务（Current Orders Management Microservice）

    - 身份验证微服务（Authentication Microservice）

    - 订单历史管理服务（Order history Management Service）

    - 购买建议服务（Suggest Purchases Service）


    假设创建和管理账户有一项功能，用户可以上传或更新个人资料图片。我们可以添加另一个微服务——图片上传服务，它负责上传或更新用户图片。这种拆分的优势在于，如果我们想更新该服务中的代码（例如我们现在只支持
    JPEG 和 PNG 格式，现在想添加另一种格式），我们只需要更新并重新部署该服务即可。


    下图显示了基于微服务的设计：


    ![](img/0ba5078687d28877e27a5bc212dacbeb_46_0.png)


    图 2.3：微服务


    图 2.3 展示了微服务的一个重要特性，它们之间是独立的，并帮助我们创建松耦合的应用程序。例如，如果我们的用户图片管理服务崩溃或没有响应，它不会影响应用程序的其他部分，用户可以不受影响地使用电子商务门户。


    基于微服务的设计是云的天然选择，并帮助我们解决了许多传统单体架构存在的问题。基于微服务的架构的一些重要优势如下：


    - **可扩展性**：微服务提供的第一要点是选择性扩展服务的能力。例如，当新产品发布时，电子商务门户预计搜索和购买相关服务会有更高的负载，因此我们可以对观察到或预期的服务进行选择性扩容。

    - **易测试性**：测试较小的服务比测试整个应用程序要容易。例如，如果用户图像管理服务发生了更改，我们只需要测试图片上传部分，而无需担心其他代码和功能。

    - **开发容易**：管理和理解较小的代码库更容易。同样，如果我们需要为用户图片添加新的格式支持，我们已经知道该查看哪里并进行更新。开发者在进行任何更改之前不需要整个系统。

    - **系统更稳定**：如果一个或两个服务宕，不会导致整个系统崩溃。例如，如果负责为用户建议未来购买的微服务故障，它不会影响系统的其他部分，用户仍然可以登录、搜索和购买产品。

    - **技术栈灵活性（多语言编程）**：由于每个微服务都是独立开发和部署的，不同的代码库可能会使用不同的技术。例如，如果你需要创建一个新的用户报告，你知道由于现有的库的支持可以用
    Python 轻松创建，你可以尽管创建一个新的微服务，而不必担心其他服务在使用什么技术。


    尽管微服务有一系列优势，但是时候给出一个警告了。


    '
