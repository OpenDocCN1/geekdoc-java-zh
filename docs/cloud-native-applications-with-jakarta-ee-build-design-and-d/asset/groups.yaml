    ## Common threats and software defence


    When you develop an application, you need to tackle a certain set of problems
    that can be faced by it. In this section, we will take a look at some of the common
    threats and techniques to handle them.


    ## HTTPS - Securing your APIs


    We must read a lot about cases where a user is made to believe a fake site is
    actually real site and provide some critical details. The HTTP protocol has a
    limitation in the sense that it is not secured, and data travels unencrypted.
    Answer to these challenges is to use a secured version, that is HTTPS. So, how
    moving from HTTP to HTTPS help secure our sites and APIs? Let''s try to understand
    what is happening behind the scenes:


    1. The browser sends a request for a page like https://xyz.com.

    2. The website will need to send back an SSL certificate confirming it is secured
    and can be verified by the browser.

    3. The browser authenticates the certificate and creates a symmetric key. The
    symmetric key is then sent back to the application. All cloud service providers
    have an easy way to implement HTTPS for sites and APIs hosted with them.


    ## Encryption


    Another type of attack that applications normally face is when someone gets access
    to data. We can use encryption to make sure even if someone gets access to servers,
    they are not able to read the data. Cloud service providers help us with providing
    encryption for lot of services. It is also easy to implement, for example:


    Figure 7.6: AWS view of S3 encryption


    The preceding screenshot shows how we can turn on encryption for storage in AWS
    by just selecting an option. Similarly, we can enable encryption for database.
    This is how one can enable encryption for data at rest. Similarly, we can enable
    encryption for data in transit by using methods like HTTPS which we discussed
    in the last-section.


    ## DDoS attack


    A very common attack in the current arena is Denial of Service or Distributed
    Denial of Service (DDoS) attack. Basically your service will be bombarded with
    fake requests so that servers are choked and not able to deliver legitimate requests.
    We need to understand if a request is fake or legitimate. Again, cloud service
    providers help us here by providing out of box tools. For example, Amazon Web
    Services provides us with AWS Shield which comes with DDoS protection and Microsoft
    Azure provides us with Azure DDoS Protection for the same purpose.


    ## Code and SQL injections


    There are additional attacks that a development team needs to take care of like
    Code and SQL injections. Think of a scenario where a user is asked for feedback
    comments on an eCommerce site. These comments are loaded and shown to other users
    interested in the same product. Now, if a hacker adds some malicious comment which
    has JavaScript code in it, we will store it and render when someone opens the
    product page next. So the code will execute on the end-user machine and access
    personal data in the browser which can be used by a hacker for his personal benefit.
    It is the onus of the development team to make sure proper checks are in place
    to validate the entries added by end-users. These checks can be added manually
    or by using frameworks.


    ## Understanding security with an example


    When you create an application, there can be many aspects that get ignored. For
    example, at times we create simple REST services for GET, PUT, POST and so on.
    Say I have a service like:


    `GET https://somewebite.com/employees/1`


    Now, this looks like a simple REST service to get an employee with ID 1. Nothing
    wrong with it. But someone can easily look for the calls being made to web services
    by the browser and try to modify it to say:


    `GET https://somewebite.com/employees/2`


    And now he/she is able to see the data he/she should not be allowed to. Or else,
    once you know there is a GET service, you might try out POST and PATCH service
    which will update the data for the user; again one needs to understand if the
    calling user has access for carrying out this operation. You can easily see that
    the problems in these cases are that there are missing authorization checks at
    the receiving endpoints to make sure that only authorized users can make a change
    or fetch the data.


    In one of the real project instances, I have seen a case where a user manipulated
    JavaScript checks to let him enter data that he was not authorized to enter and
    should have been stopped at entry level. The mistake here was that there was a
    check only at the frontend level but no checks at the backend.


    We know the problems and we know the solutions, which are quite often simple best
    practices that need to be followed. But we also observe these kinds of problems
    frequently faced by applications. Why? The major reason for facing these problems
    is that these are un-documented requirements of any software being developed and
    easy to miss. You will never see a requirement that explicitly talks about how
    you implement a REST endpoint. It is up to the developers'' experience and expertise
    that he handles all security threats while writing code. Now the problem is that,
    at times due to deadlines'' pressure or changing requirements, developers can
    leave some of these loopholes for the hackers to exploit.

