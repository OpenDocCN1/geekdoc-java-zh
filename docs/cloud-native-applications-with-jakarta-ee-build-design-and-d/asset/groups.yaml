  mdcn: "\n\n确保所有代码都频繁地合并回分支。\n\n## 基础设施即代码 (Infrastructure as code)\n\n在过去的几年里，云改变了我们对基础设施的思考方式。不再是一项需要手动逐步设置虚拟机或服务的繁琐任务，而是可以通过编写简单的脚本来帮助我们轻松地搭建基础设施。\n\
    \n这种方法的一个主要优势是，它允许我们以简单文件的形式与代码一起管理基础设施设置脚本。这意味着可以在多个环境中复制相同的基础设施，因此无需在开发环境、测试环境、性能环境、UAT\
    \ 环境、生产环境等重复相同的相同的部署步骤。它还让我们免受人为失错误的困扰，因为在为不同的基础设施设置重复操作程序时，很容易漏掉某个步骤或设置。\n\n\
    所有主要的云服务提供商都提供了创建现成的开箱支持，帮助我们部署基础设施。让我们快速看看两个巨头——亚马逊的 AWS 和微软的 Azure是如何支持“基础设施即代码”概念的。\n\
    \n## AWS CloudFormation\n\nAWS 通过使用 CloudFormation 脚本为我们提供了管理基础设施需求的简单方法。其思想是将基础设施以代码的形式保留，这样只需修改一次，即可轻松地管理并部署到不同的环境中。AWS\
    \ 支持 YAML 和 JSON 格式来定义您的基础设施。\n\n这是一个通过 JSON 创建 RDS 数据库实例的示例。大多数字段都是自解释其明的，例如\
    \ `AllocatedStorage` 告诉我们分配给数据库的存储量，`AllowMajorVersionUpgrade` 告诉 AWS 如果允许数据库进行主版本升级，等等。JSON\
    \ 下方提供的 AWS 链接提供了所有选项的详细描述：\n\n```json\n{\n  \"Type\" : \"AWS::RDS::DBInstance\"\
    ,\n  \"Properties\" : {\n    \"AllocatedStorage\" : String,\n    \"AllowMajorVersionUpgrade\"\
    \ : Boolean,\n    \"AssociatedRoles\" : [DBInstanceRole, ...]\n  }\n}\n```\n\n\
    ```json\n{\n  \"AutoMinorVersionUpgrade\" : Boolean,\n  \"AvailabilityZone\" :\
    \ String,\n  \"BackupRetentionPeriod\" : Integer,\n  \"CertificateIdentifier\"\
    \ : String,\n  \"CharacterSetName\" : String,\n  \"CopyTagsSnapshot\" : Boolean,\n\
    \  \"DBClusterIdentifier\" : String,\n  \"DBInstanceClass\" : String,\n  \"DBInstanceIdentifier\"\
    \ : String,\n  \"DBName\" : String,\n  \"DBParameterGroupName\" : String,\n  \"\
    DBSecurityGroups\" : [String, ...],\n  \"DBSnapshotIdentifier\" : String,\n  \"\
    DBSubnetGroupName\" : String,\n  \"DeleteAutomatedBackups\" : Boolean,\n  ..\n\
    }\n```\n\n脚本来源：\nhttps://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-properties-rds-database-instance.html\n\
    \n如你所见，我们是以某些设置的形式定义数据库的，如果将来我们需要更新某个属性，可以更新 JSON 脚本并在环境中重新运行。这种“一次更改，到处运行”的方法有助于消除人为错误。此外，我们只需要通过运行\
    \ CloudFormation 脚本来建立新环境。我们可以将这些脚本成为持续交付步骤的一部分，以实现过程的全自动化。我们将在本章稍后讨论持续交付。\n\n\
    ## Azure ARM 模板\n\n与 AWS 类似，Azure 提供了通过创建 Azure Resource Manager (ARM) 模板来创建基础设施即代码的方法。以下是一个描述创建\
    \ SQL 服务器的 JSON 脚本：\n\n```json\n{\n  \"type\": \"Microsoft.Sql/servers\",\n  \"\
    apiVersion\": \"2019-06-01-preview\",\n  \"name\": \"[parameters('serverName')]\"\
    ,\n  \"location\": \"[parameters('location')]\",\n  \"properties\": {\n    \"\
    administratorLogin\": \"[parameters('administratorLogin')]\",\n    \"administratorLoginPassword\"\
    : \"[parameters('administratorLoginPassword')]\",\n    \"resources\": [\n    \
    \  {\n        \"type\": \"databases\",\n        \"apiVersion\": \"2019-06-01-preview\"\
    ,\n        \"name\": \"[parameters('sqlDBNName')]\",\n        \"sku\": {\n   \
    \       \"name\": \"Standard\",\n          \"tier\": \"Standard\"\n        },\n\
    \        \"location\": \"[parameters('location')]\",\n        \"dependsOn\": [\n\
    \          [resourceId('Microsoft.Sql/servers', concat(parameters('serverName')))]\n\
    \        ]\n      }\n    ]\n  }\n}\n```\n\n脚本来源：[https://docs.microsoft.com/en-us/azure/azure-sql/database/single-database-create-arm-template-quickstart](https://docs.microsoft.com/en-us/azure/azure-sql/database/single-database-create-arm-template-quickstart)\n\
    \n## 持续集成\n\n正如我们在上一节中所学习的，持续集成（CI）的核心在于确保你的代码在任何时间点都不处于损坏状态。为了实现这一点，我们确保所有的开发代码都合并到相关的功能分支或主分支，并且生成的代码可以无错误地构建，且基础测试用例应该成功通过。\n\
    \n有很多工具可用于实现 CI。在本章的示例中，我们将使用 Jenkins 来实现流水线。还有许多其他工具如 GitLab CI、Bamboo、Teamcity\
    \ 等，也可以用于相同的功能。\n\n## 设置 Jenkins\n\n正如我们在上一节中所学习的，持续集成（CI）的核心在于确保你的代码在任何时间点都不处于损坏状态。为了实现这一点，我们确保所有的开发代码都合并到相关的功能分支或主分支，并且生成的代码可以无错误地构建，且基础测试用例应该成功通过。\n\
    \n有很多工具可用于实现 CI。在本章的示例中，我们将使用 Jenkins 来实现流水线。还有许多其他工具如 GitLab CI、Bamboo、Teamcity\
    \ 等，也可以用于相同的功能。\n\n## 持续集成示例\n\n```groovy\npipeline {\n  agent any\n  tools {\n\
    \    maven \"M3\"\n  }\n  stages {\n    stage('Build') {\n      steps {\n    \
    \    git 'https://github.com/kamalmeets/CIPipeline.git'\n      }\n    }\n  }\n\
    }\n```\n\n```groovy\npipeline {\n  agent any\n  tools {\n    maven \"M3\"\n  }\n\
    \  stages {\n    stage('Build') {\n      steps {\n        sh \"mvn -Dtest.failure.ignore=true\
    \ package\"\n      }\n    }\n  }\n  success {\n    archiveArtifacts 'target/*.war'\n\
    \  }\n}\n```\n\n"
