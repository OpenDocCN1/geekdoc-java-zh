    # 云原生开发


    首先，让我们回顾一下对云原生应用的理解。随着云的普及，各种术语变得流行起来，如云应用、云就绪应用、云优先应用，当然还有云原生应用。这里的核心思想是设计应用程序，能够利用云提供的能力来使我们的应用程序更加健壮。


    传统上，我们一直为本地基础设施开发应用，通常遵循单体设计方法。云通过各种服务，如基础设施即服务 (IaaS)、软件即服务 (SaaS)、平台即服务 (PaaS)
    和函数即服务 (FaaS)，让我们的生活变得简单许多。当我们考虑云原生应用时，基于容器的应用部署和扩展是另一个热门领域。这些实践也改变了我们过去思考应用的方式。此外，它还影响了我们的开发实践。在整书中，我们讨论了云原生开发中突出的各个方面。我们从基于微服务的架构开始讨论。微服务设计在过去几年中是一个游戏规则的改变者，完全改变了我们开发应用的方式。


    云原生应用开发的另一个重要因素是自动化。我们尝试尽可能将应用开发、部署和监控的过程自动化。我们通过 CI 和 CD 讨论了测试自动化、部署和集成自动化，以及应用扩展过程的自动化。


    云改变了我们过去思考应用开发和部署过程的方式。这种变化的一个重要例子是容器驱动开发，我们在书中讨论过它。容器改变了我们思考微服务部署和编排的方式。Docker
    和 Kubernetes 等工具确保了开发者可以专注于解决代码问题，而微服务的扩展、管理、版本控制等可以被轻松地处理。与基于容器的开发类似，无服务器计算通过管理基础设施处理部分，也让让开发团队的生活变得更加轻松。


    # 12 因子应用


    在为云构建应用时，有很多人应该遵循的最佳实践。这些最佳实践可能因团队和项目而异。但有一些实践是全球公认的。https://12factor.net/ 网站提到了在创建一个要在云上作为软件即服务
    (SaaS) 构建的应用时，应该考虑的 12 个因素。当人们开始思考创建一个借助帮助以分布式方式开发的应用时，这 12 个因素被认为是良好的起点。


    我们将简要查看这 12 个因素：


    # 因素 1 – 代码库 (Codebase)


    一个代码库，通过版本控制跟踪多个部署


    一个代码库，通过版本控制进行跟踪，这样你就可以管理不同的部署版本。


    # 因素 2 – 依赖 (Dependencies)


    显式声明并隔离依赖


    应用程序应该独立存在，即应用程序所使用的外部依赖。这些依赖应该被隔离，例如，如果应用程序使用的第三方服务更新了，不应该影响我们的应用代码。


    # 因素 3 – 配置 (Config)


    在环境中存储配置


    应用程序有许多配置取决于其部署的环境。在这种背景下，环境可以指开发环境、测试、生产环境等。有时人们会将配置元素放在存储库中，这会导致多重问题。首先，配置值的更改意味着需要重新构建和部署。其次，开发者可能会更新错误的配置值。为了避免这些问题，强烈建议你的代码不要包含任何配置，而是在环境层面管理。


    # 因素 4 – 后端服务 (Backing services)


    将后端服务视为附加资源


    构建 12 因子应用的原则建议将所有后端服务都视为资源。后端服务可以指数据库、存储、消息队列等外部服务。这里的思想是将这些后端服务视为可以轻松配置的外部化资源。例如，如果我们的应用使用了队列系统而我们迁移到
    ActiveMQ，只需更新配置即可实现。


    # 因素 5 – 构建、发布、运行 (Build, release, run)


    严格分离构建和运行阶段


    这里的思想是将部署拆分为清晰定义的构建、发布和运行阶段。构建阶段通常会生成一个 jar、war 或 ear 文件，然后可以部署在任何环境中。我们已经强调了环境变量的分离，这构成了发布阶段，我们在阶段获取特定的构建并与环境所需的配置相结合。最后是运行发布；例如，在运行阶段，Docker
    镜像被部署到特定环境的容器中。


    # 因素 6 – 进程 (Processes)


    作为一个或多个无状态进程执行应用


    如果你要构建一个需要扩展或在集群部署的应用程序或服务，我们需要确保你的应用程序可以被视为无状态进程。想象一下在不同的服务或应用实例之间共享状态有多痛苦。因此，将状态管理外部化总是比保留在代码中要好。


