    \    assertEquals(expectedAge, age);\n}\n\n@Test\npublic void testCalculateAgeToday()\
    \ {\n    Calendar cal = Calendar.getInstance();\n    cal.add(Calendar.YEAR, -20);\n\
    \    Date dateOfBirth = cal.getTime();\n    int expectedAge = 20;\n    EmployeeUtility\
    \ employeeUtility = new EmployeeUtility();\n    int age = employeeUtility.calculateAge(dateOfBirth);\n\
    \    assertEquals(expectedAge, age);\n}\n```\n\n单元测试不仅仅是关于正向测试用例。在编写单元用例时，我们被迫思考事情可能出错的情况。例如，年龄会是负数吗？如果年龄结果为负数，或者说出生日期大于今天，函数应该怎么做？函数应该抛出错误吗？同样，如果发送给函数的年龄是\
    \ null 怎么办？所有的测试用例都迫使我们修改代码来处理所有这些边界情况。一个看起来完美的简单函数需要修改：\n\n```java\npublic int\
    \ calculateAge(Date dateOfBirth) throws CustomEmployeeException\n{\n    if(dateOfBirth\
    \ == null) {\n        throw new NullPointerException(\"Date of birth cannot be\
    \ null\");\n    }\n    Instant instant = dateOfBirth.toInstant();\n    ZonedDateTime\
