- md: "\nvirtual machine?\n\n**Hands On:** Try the steps with any cloud service provider\
    \ of your choice.\n\n# CHAPTER 5\n## Testing Cloud-Native Applications\n\nIn the\
    \ previous chapter, we created a sample application for managing Employees data.\
    \ But any application is not production-ready unless you have tested it thoroughly.\
    \ You do not want your customers to find issues with your application and move\
    \ away to your competitors.\n\n# Structure\n\n- Unit Testing\n- Integration Testing\n\
    - Service Testing\n- End to End System Testing\n- Performance Testing\n- Additional\
    \ Testing aspects\n- Test-Driven Development\n- Static Code Analysis and Code\
    \ Coverage\n\n# Objectives\n\nIn this chapter, we will investigate different types\
    \ of testing that are needed for an application to work smoothly in a production\
    \ environment. We will look into Unit testing, which is the most basic and important\
    \ testing for any developer writing code for an application. Unit testing makes\
    \ sure that the application units work fine independently, and any change does\
    \ not break the code. Integration testing, on the other hand, is important to\
    \ test that the different components of an application work fine together. Service\
    \ testing tests service as a whole and is important, especially in a microservice-based\
    \ design.\n\nNext some additional types of testing. Finally, we will talk about\
    \ Test-Driven Development, Static code analysis, and coverage tools.\n\n# Unit\
    \ Testing\n\nWhen you start writing code for an application, the first level of\
    \ testing you would be doing unit testing. As the name suggests, we are talking\
    \ about the smallest unit of code, which is normally a function or a method.\n\
    \nLet's go back to our previous example for Employee Detail Service. Say, we have\
    \ an Employee's date of birth. Additionally, we have a utility function that takes\
    \ the date of birth and returns the age of the employee in years:\n\n```java\n\
    public int calculateAge(Date dateOfBirth) {\n    Instant instant = dateOfBirth.toInstant();\n\
    \    ZonedDateTime zone = instant.atZone(ZoneId.systemDefault());\n    LocalDate\
    \ givenDate = zone.toLocalDate();\n    Period period = Period.between(givenDate,\
    \ LocalDate.now());\n    return period.getYears();\n}\n```\n\nThis is a very small\
    \ unit of code, for which we want to write a set of unit test cases to make sure\
    \ our code works as expected. We will need to check, given a date of birth, by\
    \ this function return a proper age:\n\n```java\n@Test\npublic void testCalculateAge()\
    \ {\n    Date dateOfBirth = new GregorianCalendar(2000, Calendar.FEBRUARY, 24).getTime();\n\
    \    // Convert dates to integer and find difference\n    DateFormat formatter\
    \ = new SimpleDateFormat(\"yyyyMMdd\");\n    int d1 = Integer.parseInt(formatter.format(dateOfBirth));\n\
    \    int d2 = Integer.parseInt(formatter.format(Calendar.getInstance().getTime()));\n\
    \    int expectedAge = (d2-d1)/100;\n    EmployeeUtility employeeUtility = new\
    \ EmployeeUtility();\n    int age = employeeUtility.calculateAge(dateOfBirth);\n\
    \    assertEquals(expectedAge, age);\n}\n```\n\nThis is a simple test case that\
    \ let us know if the code works fine. But we might want to check additional cases,\
    \ like if the code works for people born on 29 Feb of a leap year. Will the code\
    \ work if someone has a birthday today?\n\n```java\n@Test\npublic void testCalculateAgeForLeapYearDate()\
    \ {\n    Date dateOfBirth = new GregorianCalendar(1998, Calendar.FEBRUARY, 29).getTime();\n\
    \n    // Convert dates to integer and find difference\n    DateFormat formatter\
    \ = new SimpleDateFormat(\"yyyyMMdd\");\n    int d1 = Integer.parseInt(formatter.format(dateOfBirth));\n\
    \    int d2 = Integer.parseInt(formatter.format(Calendar.getInstance().getTime()));\n\
    \    int expectedAge = (d2-d1)/10000;\n    EmployeeUtility employeeUtility = new\
    \ EmployeeUtility();\n    int age = employeeUtility.calculateAge(dateOfBirth);\n\
    \    assertEquals(expectedAge, age);\n}\n\n@Test\npublic void testCalculateAgeToday()\
    \ {\n    Calendar cal = Calendar.getInstance();\n    cal.add(Calendar.YEAR, -20);\n\
    \    Date dateOfBirth = cal.getTime();\n    int expectedAge = 20;\n    EmployeeUtility\
    \ employeeUtility = new EmployeeUtility();\n    int age = employeeUtility.calculateAge(dateOfBirth);\n\
    \    assertEquals(expectedAge, age);\n}\n```\n\nUnit testing is not about positive\
    \ test cases. While writing unit cases, we are forced to think about cases when\
    \ things can go wrong. For example, can age be negative? What should the function\
    \ do if the age is coming out to be negative or in other words, date of birth\
    \ being greater than today’s date? Shall the function be throwing an error? Similarly,\
    \ if somehow the age sent to the function is null? All test cases force us to\
    \ modify our code to handle all these corner cases. A simple function that was\
    \ looking perfect, needs modifications:\n\n```java\npublic int calculateAge(Date\
    \ dateOfBirth) throws CustomEmployeeException\n{\n    if(dateOfBirth == null)\
    \ {\n        throw new NullPointerException(\"Date of birth cannot be null\");\n\
    \    }\n    Instant instant = dateOfBirth.toInstant();\n    ZonedDateTime dateTime\
    \ = instant.atZone(ZoneId.systemDefault());\n    LocalDate givenDate = dateTime.toLocalDate();\n\
    \    Period period = Period.between(givenDate, LocalDate.now());\n    int age\
    \ = period.getYears();\n    if(age < 0) {\n        throw new CustomEmployeeException(\"\
    Age cannot be a negative number\");\n    }\n    return age;\n}\n```\n\nNew test\
    \ cases added for testing if the date of birth being sent is null or a future\
    \ date:\n\n```java\n@Test(expected = NullPointerException.class)\npublic void\
    \ testCalculateAgeForNullDOB() {\n    Date dateOfBirth = null;\n    EmployeeUtility\
    \ employeeUtility = new EmployeeUtility();\n    try {\n        employeeUtility.calculateAge(dateOfBirth);\n\
    \    } catch (CustomEmployeeException e) {\n        e.printStackTrace();\n   \
    \ }\n}\n\n@Test(expected = CustomEmployeeException.class)\npublic void testCalculateAgeForNegativeAge()\
    \ throws CustomEmployeeException {\n    Date dateOfBirth = new GregorianCalendar(2030,\
    \ Calendar.FEBRUARY, 11).getTime();\n    EmployeeUtility employeeUtility = new\
    \ EmployeeUtility();\n    employeeUtility.calculateAge(dateOfBirth);\n}\n```\n\
    \nSo we started with a two-line method for calculating age. While writing test\
    \ cases, we found that our method is not handling all error cases and modified\
    \ accordingly. We have additional test cases here, for example, minimum and maximum\
    \ age of employees should be defined, which will again force us to modify our\
    \ code to add the minimum and maximum age checks.\n\nSo, unit test cases not only\
    \ help us test the code, but also make sure we are handling the corner cases,\
    \ which might occur in a real production scenario. One question that arises the\
    \ most of time is: how much unit testing is sufficient? The basic idea is to make\
    \ sure all the expected scenarios are handled by the unit of code. An additional\
    \ measure of checking if you have adequate unit tests written through code coverage.\
    \ Code coverage is a measure of the amount of code executed. We will talk about\
    \ code coverage briefly in the last section of this chapter.\n\n# Mocking dependencies:\n\
    \nMocking is an important aspect of writing unit test cases, as there are times\
    \ when the unit we are trying to test is dependent on additional code, which is\
    \ not owned by this unit. Let's take a simple example. In our Employee Details\
    \ Service, say we have a function to get Employee Salary, which is returned by\
    \ another service called EmployeeFinanceService:\n\n```java\npublic class EmployeeService\
    \ {\n    EmployeeFinanceService employeeFinanceService;\n    public EmployeeService(EmployeeFinanceService\
    \ employeeFinanceService) {\n        this.employeeFinanceService = employeeFinanceService;\n\
    \    }\n\n    public int getEmployeeSalary(String employeeId) {\n        int salary\
    \ =\n        employeeFinanceService.getEmployeeSalary(employeeId);\n        return\
    \ salary;\n    }\n}\n```\n\nEmployeeFinanceService is a blackbox service to Employee\
    \ service, and we do not understand how that is implemented. For testing EmployeeService,\
    \ our objective is to test only the service in hand and EmployeeFinanceService.\
    \ We can mock the EmployeeFinanceService and continue with our testing. There\
    \ are many frameworks to achieve this, Mockito being one of the popular ones we\
    \ are using in this example:\n\n```java\n@RunWith(MockitoJUnitRunner.class)\n\
    public class EmployeeServiceTest {\n    @Test\n    public void testGetSalary()\
    \ {\n        EmployeeFinanceService employeeFinanceService =\n        Mockito.mock(EmployeeFinanceService.class);\n\
    \        int retSalary = 200000;\n        when(employeeFinanceService.getEmployeeSalary(\"\
    1\")).thenReturn(20);\n        EmployeeService employeeService = new\n       \
    \ EmployeeService(employeeFinanceService);\n        int salary = employeeService.getEmployeeSalary(\"\
    1\");\n    }\n}\n```\n"
  mdcn: "\n虚拟机？\n\n**动手实践：** 尝试你选择的任何云服务提供商的步骤。\n\n# 第 5 章\n## 测试云原生应用\n\n在在上一个章节中，我们创建了一个用于管理员工数据的示例应用程序。但除非对其进行了彻底测试，否则任何应用程序都无法达到生产就绪。你不希望客户发现你的应用程序中存在问题，并转向你的竞争对手。\n\
    \n# 结构\n\n- 单元测试\n- 集成测试\n- 服务测试\n- 端到端系统测试\n- 性能测试\n- 额外的测试维度\n- 测试驱动开发 (TDD)\n\
    - 静态代码分析和代码覆盖率\n\n# 目标\n\n在本章中，我们将研究为了应用程序在生产环境中顺利运行所需的不同类型的测试。我们将研究单元测试，这对于任何为应用程序编写代码的开发者来说，都是最基础且最重要的测试。单元测试确保应用程序单元能够独立正常工作，并且任何更改都不会破坏代码。另一方面，集成测试对于测试应用程序的不同组件是否良好协同工作至关重要。服务测试是对整个服务进行测试，这在基于微服务的设计中尤为重要。\n\
    \n接下来是其他一些测试类型。最后，我们将讨论测试驱动开发、静态代码分析和覆盖率工具。\n\n# 单元测试\n\n当你开始为应用程序编写代码时，你进行的第一层测试将是单元测试。正如名称所示，我们讨论的是代码的最小单元，通常是一个函数或一个方法。\n\
    \n让我们回到之前的员工详情服务示例。假设我们有一个员工的出生日期。此外，我们有一个工具函数，它接收出生日期并返回员工的年龄（以岁）：\n\n```java\n\
    public int calculateAge(Date dateOfBirth) {\n    Instant instant = dateOfBirth.toInstant();\n\
    \    ZonedDateTime zone = instant.atZone(ZoneId.systemDefault());\n    LocalDate\
    \ givenDate = zone.toLocalDate();\n    Period period = Period.between(givenDate,\
    \ LocalDate.now());\n    return period.getYears();\n}\n```\n\n这是一个非常小的代码单元，我们希望为其编写一组单元测试用例，以确保我们的代码按预期工作。我们需要检查在给定出生日期的情况下，该函数是否返回了正确的年龄：\n\
    \n```java\n@Test\npublic void testCalculateAge() {\n    Date dateOfBirth = new\
    \ GregorianCalendar(2000, Calendar.FEBRUARY, 24).getTime();\n    // 将日期转换为整数并找到差值\n\
    \    DateFormat formatter = new SimpleDateFormat(\"yyyyMMdd\");\n    int d1 =\
