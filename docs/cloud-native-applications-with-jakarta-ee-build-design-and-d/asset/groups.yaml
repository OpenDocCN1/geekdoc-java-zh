    - Non-Agile: In today’s world, you want to make changes to your codebase and release
    them asap. In a monolithic application, it is difficult, as you will need to build,
    test, and deploy the whole application.


    - Stuck with technology: Say, you have a Java application, and you want to add
    a reporting feature to this application. You know the support for this kind of
    reporting is present in Python in the form of libraries, and it can be developed
    in less than half the time it will take in Java. But you cannot do that in a monolithic
    design, as the whole application needs to be built and deployed together, and
    it must be done in the same technology.


    Due to all the challenges we have discussed for monolithic applications, architects
    moved away from a single chunk of approach, and started thinking in terms of breaking
    the code into smaller services and services.


    ## Service-Oriented Architecture


    Service-Oriented Architecture, or SOA as it is popularly known, is an approach
    that helps in breaking the code into smaller services. SOA can be thought of as
    a base on which Microservices were developed further; so it is important to understand
    the concept of Services and Service-Oriented Architecture.


    Think of an eCommerce portal, where we can divide a whole application in terms
    of multiple services like:


    - Account Management Service - Create and login user

    - Search Management Service

    - Catalog Management Service

    - Shopping Cart Service

    - Payment Management Service

    - Shipping Management Service

    - Inventory Management Service

    - Admin Service


    The following diagram shows how different features are now divided into services,
    based on Service Oriented Architecture:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_44_0.png)


    Figure 2.2: Service-Oriented Architecture


    Figure 2.2 shows a single database for simplicitys, but there might be multiple
    databases involved. The advantage here is very much visible; let''s say if I want
    to modify the approach in which Search is implemented, I know where I should be
    looking for existing code and making changes. I know which service needs to be
    tested.


    But Service Oriented Design does not get into details of how the services should
    be implemented. The data might be stored in the same database or different, code
    might be kept together, built together and deployed using a single deployment
    script. To get more clarity on services and further dividing services, the concept
    of microservices came into existence.


    ## Microservices


    Service Oriented Architecture changed the way we used to think about applications
    and helped us look at it as multiple services. Microservices took the idea to
    the next level and suggested to break each service to the smallest logical level.
    Smaller independent services helped unleash the power of Cloud. It is hard to
    guess if Cloud has helped the popularity of Microservices, or if it is versa.
    Whatever it is, the thing to note is that Cloud and Microservices go in hand.
    Let''s start with getting an understanding of what a microservice is.


    "Microservices - also known as the microservice architecture - is an architectural
    style that structures an application as a collection of loosely coupled services,
    which implement business capabilities. The microservice architecture enables the
    continuous delivery/deployment of large, complex applications. It also enables
    an organization to evolve its technology stack http://microservices.io/


    Basically, the microservice is the smallest in your application that can fulfill
    some purpose in a stand-alone manner. Let''s go back to our eCommerce example
    for SOA, where we had several services come together to deliver an eCommerce application.
    Let''s take one service, say Account Management Service. When we talk about microservices,
    the first thing we try to think of is break down the service into smaller, but
    logically meaningful service. For example, account management service currently
    has the role of creating a new account, managing, and updating the account, providing
    authentication and authorization for accounts, managing the past history, and
    providing suggestions for future purchases.


    You might ask how big exactly is a microservice? The answer is a bit complex,
    as there is no fixed parameter. Normally, we try to divide application in terms
    of functionalities to create microservices; so a microservice converting an image
    into thumbnail whereas search microservice will be scattered across multiple classes.
    A rule of thumb says that while defining a service, you must use too many "commas"
    and "ands", you know it can still be further divided. When I say service provides
    Feature A and B, I have Service A and B. The actual services depend on the project
    in, but this is a good start to understand how to think about microservices.


    Coming back to our Account Management Service, we can think of dividing it down
    to further services:


    - Account Microservice

    - Manage Account Microservice

    - Current Orders Management Microservice

    - Authentication Microservice

    - Order history Management Service

    - Suggest Purchases Service


    Let''s say, create and manage account has a feature, where users can upload or
    update profile images. We can add another microservice upload image service, which
    is responsible for uploading or updating user images. The advantage of such a
    bifurcation is that if we want to update code in that service, say we are supporting
    only JPEG and PNG images today, and we want to add another format, all we need
    to do update and redeploy this service.


    The following diagram shows microservices based design:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_46_0.png)


    Figure 2.3: Microservices


    Figure 2.3 showcases an important feature of microservices, that they are independent
    of each other and helps us create a loosely coupled application. For example,
    if our User Image management service is broken or not responding, it does not
    impact the rest of the application and users can use the eCommerce portal without
    any impact.


    Microservice based design is a default fit for the cloud, and helps us solve many
    problems that there were with traditional monolithic architecture. Some of the
    important advantages of microservice-based architecture are as follows:


    - **Scalability**: The first thing that microservices provide us is the ability
    to selectively scale the services. For example, when a new product is being launched
    on a day, the eCommerce portal expects more load on the search and purchase related
    services, So, we can selectively scale-up services, where the higher load is observed
    or anticipated.

    - **Ease of testing**: It is easier to test a smaller service than the whole application.
    For example, if there is a change in user image management service, we will just
    need to test the image upload part, and not worry about the rest of the code and
    features.

    - **Easy in development**: It is easier to manage and understand smaller codebases.
    Again, if we need to add a new image format support for user images, we already
    know which to look at and update. The developer does not need to understand the
    whole system before making any changes.

    - **More stable systems**: If one or two services are down, it will not result
    in the whole system to be broken. For example, if the microservice responsible
    for suggesting future purchases to end-user is broken, it will not impact the
    rest of the systems and users can still login, search, and purchase products.

    - **Flexibility in technology stack (Polyglot programming)**: Because each microservice
    is being developed and deployed independently, it is possible that different codebases
    use different technologies. For example, if you have to create a new user report,
    which you can know can be created in Python easily due to existing libraries’
    support, you can go ahead and create a new microservice without worrying about
    which technology is being used by the rest of the services.


    Though microservices have a set of advantages, it is time for a word of caution

