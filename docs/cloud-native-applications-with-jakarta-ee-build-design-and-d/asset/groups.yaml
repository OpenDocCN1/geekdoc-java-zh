    # CHAPTER 12

    ## Best Practices for Developing Cloud-Native Applications


    Throughout this book, we have talked about various practices that we should follow,
    when we are developing applications for the cloud. In this final chapter, we will
    talk about some of the best practices that will help us develop cloud-native applications.
    Cloud-based applications have been around for a long time now, which has helped
    the developer community to come up with some proven practices that help us create
    applications that are scalable, maintainable, secured, and perform.


    ## Structure


    - Revisit Cloud-Native Development

    - 12 Factor Application

    - Common Design patterns for Cloud-native applications


    ## Objectives


    We will start this chapter by revisiting the cloud-native application development.
    We will take a look at the concept of a 12-factor application, and look at each
    of these factors briefly. Finally, we will look into some of the design patterns,
    which will help us with cloud-native application development. These design patterns
    are tried and tested best practices that help us design applications meant for
    the cloud.


    ## Revisiting Cloud-Native development


    Throughout this book, we have discussed cloud-native applications, the thought
    process that goes behind designing and developing a cloud-native application,
    the approach we tend to choose, and the best practices to be followed. It is time
    to revisit some of these factors.


    # Cloud-native development


    To begin with, let''s revisit our understanding of cloud-native applications.
    With the popularity of the cloud, various terms have been popularized, like cloud-based
    applications, cloud-ready applications, cloud-first applications, and, of course,
    cloud-native applications. The core idea here is to design applications that can
    make use of capabilities provided to us by the cloud to make our applications
    more robust.


    Traditionally, we have been developing applications for on-prem infrastructure,
    where we usually followed a monolith design approach. Cloud has made our life
    a lot easier with various offerings like Infrastructure as a Service (IaaS), Software
    as a Service (SaaS), Platform as a Service (PaaS), and Functions as a Service
    (FaaS). Container-based application deployment and scaling has been another core
    area popular, when we think about cloud-native applications. All these practices
    also changed the way we used to think of application design. Additionally, it
    has impacted our development practices. Throughout the book, we have talked about
    various aspects that stand out in cloud-native development. We started our discussion
    with Microservices-based architecture. Microservices-based design has been a game-changer
    in the past few years, and has completely changed the way we use to develop our
    applications.


    Another important factor in cloud-native application development has been Automation.
    We try to automate the process of application development, deployment, and monitoring
    as much as possible. We talked about Test automation, deployment, and integration
    automation through CI and CD, and also automating the process of scaling the applications.


    Cloud has changed the way we used to think about application development and deployment
    processes. An important example of this change is container-driven development,
    which we discussed in this book. Containers have changed the way we used to think
    about microservices deployment and orchestration. Tools like Docker and Kubernetes
    have made sure that developers can focus on solving coding problems, and microservices
    scaling, managing, versioning, etc., can be handled easily. Similar to Container-based
    development, serverless computing has been making development teams'' life easier
    by managing the infrastructure handling part.


    # 12-factor application


    When building an application for the cloud, there are many best practices which
    one should follow. These best practices might vary from team to team and project
    to project. But there are a few practices that are universally accepted. https://12factor.net/
    site mentions 12 factors that should be considered, while creating an application
    to be built as Software as a Service on cloud. These 12 factors are considered
    as good starting points, when one starts thinking about creating an application
    that will be developed in a distributed manner with the help of services and microservices.


    We will briefly look into these 12 factors:


    # Factor 1 – Codebase


    One codebase tracked in revision control, many deploys


    The basic rule for any application - have your code managed by a version control
    system, so that you can manage and tag various versions of your application or
    easily in separate repositories, so that they can be managed, built, and deployed
    independently. The same repository for a service or application will serve different
    deployment environments.


    # Factor 2 – Dependencies


    Explicit declare and isolate dependencies


    An application cannot exist independently, that is, there will be some external
    dependencies like libraries this application is using, database drivers, and third-party
    applications or services being used by our application. Your application should
    clearly clear out any dependencies it has. These dependencies should be isolated,
    and should not impact the application code as; for example, if a third party service,
    which is used by our application, gets updated, it should not impact our application
    code.


    # Factor 3 – Config


    Store config in the environment


    Your application has many configurations that will depend on the environment on
    which it is being deployed. The environment, in this context, can refer to the
    dev environment, test, performance, pre-production, production environment, and
    so on. At times people keep configuration elements in the repository itself, which
    can have multi-fold issues. Firstly, a change in a configuration value will mean
    that the application needs to be built and deployed again. Secondly, a developer
    can make a mistake and update the incorrect configuration values. To avoid these
    issues, it is strongly recommended that your code should never have any configurations
    provided, and they should be managed at the environment level.


    # Factor 4 – Backing services


    Treat backing services as attached resources


    This principle for building a 12-factor app suggests that all the backing services
    should be treated as resources. The backing services can refer to external services
    like database, storage, message queues, and so on. The idea here is to consider
    these backing services as externalized resources that can be configured easily.
    For example, if our application used a Queueing system and we move from rabbitMQ
    to ActiveMQ, this should be achievable by just updating the configuration.


    # Factor 5 – Build, release, run


    Strictly separate build and run stages


    The idea here is to break the deployment into clearly defined stages of build,
    release, and run. A build stage will generally result in a jar, war, or an ear
    file which can then be deployed on any environment. We already highlighted the
    separation of environment variables, which constitutes the release phase, where
    we take a specific build and combine with configuration needed for the environment.
    Finally, the release is run; for example, during the run phase, a Docker image
    is deployed to a container on a specific environment.


    # Factor 6 – Processes


    Execute the app as one or more stateless processes


