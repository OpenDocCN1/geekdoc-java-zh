    ## 云是如何工作的？


    在开始之前，你需要理解的云的另一个重要方面是资源是如何管理的。你一定会产生以下问题：如果数据存储在云端，它实际上存储在哪里？我的应用程序实际上安装在何处？云如何确保我的数据不丢失？它如何保证高可用性？


    为了回答所有问题，我们需要知道云是如何管理资源的。在底层，我们有数据中心。数据中心是设置所有硬件系统的物理场所。接下来是可用区（Availability Zones，简称
    AZ）的概念。大多数云服务提供商会在 AZ 中设置一个或多个数据中心。下一层是区域（Regions）；同样，一个区域可以包含一个或多个可用区。区域中的每个可用区都有冗余且独立的电源、网络和连接，以降低区域内多个
    AZ 同时故障的概率。


    下面的截图显示了云中区域、区域和数据中心的概念：


    ![](img/0ba5078687d28877e27a5bc212dacbeb_25_0.png)


    **图 1.1：** 理解区域、可用区和数据中心


    之前的截图显示了区域、可用区和数据中心是如何实现的。不同的云服务提供商在实际实现和命名可能有所不同，但核心思想始终保持不变。


    现在，问题是，为什么理解云服务提供商如何管理资源非常重要。当你尝试在云中创建任何资源时，被问到的第一个问题是你想使用哪个区域。例如，如果我们在 **AWS
    (Amazon Web Services)** 中寻找美国区域，我们会发现以下选项：弗吉尼亚北部、俄亥俄、加利尼亚北部、俄勒冈。在这里做出正确的选择非常重要，因为云提供商提供的所有服务在所有区域并不可用。第二个要考虑的重要方面是目标受众的位置；如果你知道所有的流量都来自美国，你不会希望在日本托管应用程序以获得性能优势。


    理解区域和可用区概念的一个重要性是用于制定你的复制和备份策略。例如，如果你预期来自多个位置的流量，你可能希望制定一个策略，将数据存储在不同的区域，以满足该区域的需求。此外，在备份时，你需要了解数据是否非常关键；你可能希望跨区域进行复制，以防某个区域出现问题时丢失数据。


    ## 云的主要服务提供商


    当我们开始讨论云服务提供商时，提到的第一个主要参与者是 Amazon Web Services（简称 AWS），它是亚马逊的子公司。它于 2006 年推出，目前提供超过
    100 项云服务。云领域的另外两个主要参与者是微软的 Azure 和 Google Cloud。我们将在第 3 章详细讨论这些以及其他一些主要的云服务提供商。


    ## 理解 IaaS、PaS、SaaS 和 FaaS


    在高级层面，我们可以根据以下类型将云提供的服务分为几类：


    - 基础设施即服务 (IaaS)

    - 平台即服务 (PaaS)

    - 软件即服务 (SaaS)

    - 函数即服务 (FaaS)


    为了更详细地理解这些服务，让我们后退一步，了解在云时代以前情况是怎样的。


    ## 传统的软件开发和部署


    在云时代之前，你需要维护自己的硬件、软件、安全、性能等。你负责获取服务器硬件，然后安装操作系统和驱动程序、防火墙、用户访问规则等。之后，你负责为应用程序的运行所需的任何工具或库；应用程序所需的任何
    Web 或应用服务器；数据库、文件系统、消息总线等的基础设施和软件。最后，你需要设置应用程序并对其进行测试，并管理谁可以访问该应用程序。如果你需要更多服务器，你需要负责管理服务器内部通信、创建集群并监控它们的性能。


    下面的截图突出了软件开发的各个方面面：


    ![](img/0ba5078687d28877e27a5bc212dacbeb_27_0.png)


    **图 1.2：** 应用程序的本地部署


    之前的截图帮助我们理解，在传统方法中，从硬件到用户数据，与应用程序相关的一切都是应用程序团队的责任。在我们转向不同的分类之前，我们将再次查看这张图片。


    在传统方法中，从硬件到用户数据，与应用程序相关的一切都是应用程序团队的责任。在我们转向不同的云分类之前，我们将再次查看这张图片。


    从截图来看，以传统方式管理应用程序似乎需要大量工作，不是吗？现在，让我们看看各种服务的分类并了解它们如何减少我们的工作。


    ## 基础设施即服务


    IaaS（基础设施即服务）是云提供的根据硬件需求的一组服务，只需最少的硬件需求。例如，你可以获得一个带有所需硬件要求的虚拟机，你可以在上面根据需要部署，并管理操作系统。


    让我们回顾一下在图 1.2 中看到的方面：


    ![](img/0ba5078687d28877e27a5bc212dacbeb_28_0.png)


    图 1.3：基础设施即服务


    如你在之前的截图所示，当用户选择 IaaS 服务时，硬件资源和网络需求由云服务提供商负责，用户负责管理操作系统、中间件、运行时、应用程序和数据。


    ## 平台即服务


    IaaS 的下一级是 PaaS（平台即服务）。虽然在 IaaS 中，大多数硬件级需求由云服务提供商管理，但在 PaaS 情况下，基础软件和运行时也由服务提供商提供。


    下面的截图回顾了 PaaS 的开发方面：


    ![](img/0ba5078687d28877e27a5bc212dacbeb_29_0.png)


    之前的截图清楚地显示，在 PaaS 情况下，用户只需要关心应用程序和相关数据。所有的底层需求都由云服务提供商满足，如管理操作系统、中间件和运行时环境。Amazon
    的 Elastic Beanstalk 是平台服务的很好的示例，用户只需上传应用程序，AWS 就会负责容量配置、负载均衡、扩展和应用程序健康状况。另一个类似的示例是
    Microsoft Azure Service Fabric，用户可以直接在云上部署应用程序代码，而无需担心底层的基础设施。


    ## 软件即服务


    SaaS（软件即服务）意味着你被提供供使用的软件，而无需担心实现、硬件、操作系统、应用程序或数据的底层复杂性。你并不拥有任何代码或数据；你只需要登录在线 SaaS
    服务并使用它即可。简单来说——登录并使用。想想像 Gmail 这样的电子邮件服务提供商——你需要担心后台是如何运行的吗？安全、性能和扩展性是如何管理的吗？不需要。你只需要打开网站，登录服务并使用它即可。

