    微服务并非万灵药，它也伴随着其自身的挑战。人们很容易陷入误区，因为有些设计系统并没有正确地使用微服务。以下是设计基于微服务的系统时需要注意的一些挑战：


    - **拆分服务：** 在创建微服务时，人们需要理解你希望微服务的粒粒度化到何种程度。创建的服务太少意味着你无法利用微服务架构的优势，而服务过多则意味着你正在管理不必要的服务，并带来了运维的开销。在选择基于微服务的设计时，将应用程序拆分为合适数量的服务至关重要。


    - **服务管理：** 你需要一直对所有服务进行适当的监控，以确保你对整个系统有控制力。如果一个重要服务宕机，且告警系统失效，你可能会导致大量客户不满并可能导致收入损失。


    - **管理多个技术栈：** 虽然使用基于微服务的架构的优势之一是技术栈选择的灵活性，但如果管理不当，这可能会变成一个问题。拥有多个栈意味着团队内部需要管理不同的专业知识，人员在团队之间的流动也会变得困难。


    - **管理数据：** 基于微服务的设计的另一个挑战是如何管理数据和数据库。按照经验法则，每个服务都应该管理自己的数据并拥有独立的数据库。但如果数据在服务之间共享，并且有多个服务可以对同一个数据集进行操作，情况就会变得复杂。因此，需要仔细检查服务之间共享了哪些数据，以及哪个服务是数据的主要所有者。


    ## 云端需要考虑的设计因素


    我们现在理解到云端帮助我们通过微服务创建分布式系统，这些系统更容易易开发、维护和扩展。但同时，我们需要适应一种新的设计系统，并忘记一些在单体系统时代对我们有效的技巧。为了充分利用云端，我们的系统设计应当以能够最大限度地利用云端提供的服务和工具的方式进行。


    在开始开发之前，我们应该设计系统，考虑一些有助于系统拟合云端的因素，并确保我们充分利用其所有能力。在本节中，我们将涵盖影响云端设计的核心因素。


    ## 从服务的角度思考


    不要再将应用程序视为一个单体独立系统，而是解耦系统本应提供的所有功能。我们在上一节已经看到，遵循基于微服务设计的系统易于开发和扩展，因为维护一小部分代码很容易，而且扩展一小部分服务也比扩展整个应用程序要容易。


    一旦你确定了服务，你就有灵活性来决定如何开发它。例如，对于一个小型服务，你可能只想将其暴露为函数即服务（FaaS），而对于另一个服务，你可能认为 Python
    是更好的开发方式，而你系统的其他部分可能用 Java 开发。


    基于微服务的系统默认适合云端，因为你可以根据需求获取不同类型的资源。你可以轻松地相互独立地开发、部署和管理这些服务。


    ## 为故障设计


    尽管分布式和基于微服务的设计有很多优点，但挑战也随之增加，即如何管理故障。在标准的单体系统中，你尝试设计一种系统不会故障的方式。在微服务中，虽然你确保系统永不故障，但同时你也接受故障，即你假设服务有时会发生。然后你就考虑当某个服务宕机时，系统的其他部分将如何表现。


    ## 无单点故障


    当你为故障设计时，你也希望确保没有单点故障。当一个服务宕机时，它不应该影响其他服务。例如，在我们电子商务网站示例中，如果处理搜索操作的服务出现问题，它不应该影响另一个管理客户订单的服务。


    在设计系统时，我们需要确保如果某个服务发生故障，它不会影响其他服务。当服务 A 调用服务 B 时，服务 B 的故障不应导致服务 A 失败。服务 A 应该调用服务
    B 的另一个实例，或者在最坏的情况下优雅地处理服务 B 的错误并返回默认结果。例如回到我们的账户管理服务，如果图像处理服务宕机，它不应该影响账户创建或更新路径。


    ## 保持无状态


    在转向服务或基于微服务的设计时，一个可能导致问题的因素是如何维护调用的状态。一个简单的例子是，服务 A 调用服务 B 并说“加 2 和 3”。服务 A 再次调用服务
    B 并在之前的基础上加 4。这意味着服务 B 需要为来自服务 A 的请求维护状态，并为服务 A 发起的所有请求管理不同的状态。有用状态的问题是难以扩展，人们需要确保来自用户的所有请求都发送到同一个实例，以便管理之前的状态。


    处理这种情况的一种简单方法是使服务成为无状态的，其中流程中的每个请求都独立于上一个请求。服务通常需要发送有关用户（即发起请求的人）以及关于调用者的的一些详细信息。JWT
    或 JSON Web Tokens 等技术有助于此类情况，即向服务发送带有所需信息的加密 JSON。我们不再在服务器端的会话对象中维护元数据，而是将其作为每个请求的一部分，从而使通信变为无状态。


    ## 快速失败


    当服务发生故障时，它应该确保快速失败。一个现实中的例子是，当你登录某个网站并尝试访问某个页面时。页面显示正在加载了几分钟。例如，10分钟后出现“页面当前不可用，请稍后再试”。这会让等待了
    10 分钟的终端感到沮丧。如果你必须交付故障信息，请快速交付，即观察并预测故障进行报告。


    同样，每个服务都应该内置快速失败机制。例如，如果服务观察到现有调用仍在进行且耗费时间，它应该停止接收额外的请求并让它们立即失败（断路器）。当服务观察到最近几次调用尚未成功响应时，应该放弃对该服务的调用，直到之前的调用响应并在终端管理故障。这些实践有助于更快管理故障。


    ## 优雅处理故障


    一旦观察到故障，我们的服务应该足够智能地管理故障。例如，如果用户尝试搜索手机，后端搜索服务未能获取手机的当前数据，我们可以从缓存中获取几分钟前的搜索结果。或者，即使这不可行，我们也可以重定向到畅销手机的页面。我们可能没有显示最新的结果，但仍然可以看到一些与用户相关的有用信息。


    我们的服务设计应当使其能够处理影响其他服务的故障。


    ## 思考可扩展性


    通常看到，只有当我们需要处理额外负载时，我们才开始考虑扩展性需求。我们应该更加主动，在设计阶段考虑扩展性。我们在设计服务时，应该考虑垂直和水平扩展的影响。例如，有状态的服务很难水平扩展，但可以进行垂直扩展。在进行垂直扩展时，我们必须考虑停机需求和垂直扩展限制等设计因素。这可能帮助我们理解垂直扩展对系统是否有利，或者我们是否应该为水平扩展设计。如果我们在初始阶段就考虑扩展性，就可以节省大量的美元和工时，避免后期重新设计和重新编写服务。


    ## 自动化


    随着系统中服务数量的增加，手动测试、管理和监控它们变得困难。你需要尽可能地自动化许多步骤。例如，一组良好的自动化单元测试可以确保服务或你服务依赖的任何服务的更改都不会影响服务的工作。自动化的持续集成和持续部署过程消除了可能发生的人为错误并

