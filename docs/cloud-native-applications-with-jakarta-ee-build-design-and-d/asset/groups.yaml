    # Docker volumes


    We have talked about how we can create images and containers in Docker which will
    host our applications. An important thing you might have observed is that we can
    create and destroy containers. What if our application needs to store some data
    or files? If we go with the approach of storing data within the container, we
    will lose it the moment we destroy the container. To solve this'
- md: "\nproblem, we use an approach to externalize the data through Docker volumes.\
    \ The idea is to store data outside containers. Storage is on the host system\
    \ instead of inside the container. The location is then mapped to a location inside\
    \ the container. So, basically if you lose the container, your data still persists.\
    \ One can create a folder/directory and mount it on the container. Let’s look\
    \ at Docker command to create a volume:\n\n```\n$ docker volume create <<volume\
    \ name>>\n```\n\nLists all the volumes:\n\n```\n$ docker volume ls\n```\n\nLook\
    \ at details for a specific volume:\n\n```\n$ docker volume inspect <<volume name>>\n\
    ```\n\nRemove a volume:\n\n```\n$ docker volume rm <<volume name>>\n```\n\nDocker\
    \ command to mount the volume, give source and target for a container, say mycontainer:\n\
    \n```\n$ docker run -d \\\n--name mycontainer \\\n--mount source=myvolume, target=/app\
    \ \\\nnginx:latest\n$ docker inspect mycontainer\n```\n\nLook for the Mounts:\
    \ \n\n```json\n{\n  \"Type\": \"volume\",\n  \"Name\": \"myvolume\",\n  \"Source\"\
    : \"/var/lib/docker/volumes/myvolume/_data\",\n  \"Destination\": \"/app\",\n\
    \  \"Driver\": \"local\",\n  \"Mode\": \"\",\n  \"RW\": true,\n  \"Propagation\"\
    : \"\"\n}\n```\n\nAs we already discussed that now volume is not a part of the\
    \ container, volume removal is a separate step:\n\n```\n$ docker container stop\
    \ mycontainer\n$ docker container rm mycontainer\n$ docker volume rm myvolume\n\
    ```\n\n# Kubernetes\n\nKubernetes (K8s) is an open-source system for automating\
    \ deployment, scaling, and management of containerized applications. It is an\
    \ open source container orchestration tool. This was originally created by Google\
    \ to manage applications made up of tens or hundreds of containers.\n\n# What\
    \ is container orchestration?\n\nWhen each microservice is deployed in a container,\
    \ we might end up having a lot of containers. Managing these tens and hundreds\
    \ of containers manually is almost impossible and error-prone. An orchestration\
    \ tool like Kubernetes helps manage our containers and applications for high availability,\
    \ scalability, and disaster recovery.\n\nK8S provides the following features off\
    \ the shelf:\n\n- High availability - no downtime\n- Scalability - high performance\n\
    - Disaster Recovery - backup and restore\n\n# Kubernetes architecture\n\nIn this\
    \ section, we will look into Kubernetes architecture and understand how things\
    \ work behind the scenes. We already mentioned that Kubernetes is a tool that\
    \ helps us manage our containers and provides us with scalability, self-healing\
    \ mechanisms, service discovery, load balancing, etc. Let’s see how all these\
    \ functionalities are achieved:\n\n![](img/0ba5078687d28877e27a5bc212dacbeb_191_0.png)\n\
    \nAt the core, the nodes are divided into master nodes and worker nodes.\n\nAs\
    \ the name suggests, master node is the controlling node here that manages the\
    \ worker node. Worker nodes do the actual work here, that is, your applications\
    \ are actually deployed on worker nodes. Master node manages how the application\
    \ will be deployed available and scaled at all points of time. It manages failures\
    \ and is responsible for generating new application instances, if needed. We will\
    \ look into both Master and Worker nodes in detail in the next subsections.\n\n\
    # Master node\n\nLet’s take a deeper look into a master node:\n\n![](img/0ba5078687d28877e27a5bc212dacbeb_192_0.png)\n\
    \nThe master node consists of the following:\n\n- **API Server:** API exposes\
    \ APIs for various operations to external users. It validates any request coming\
