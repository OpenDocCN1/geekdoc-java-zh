    acceptance sign off in place before the code moves to production, depending on
    the complexity of the change we are dealing with.


    Finally, once the code is signed off for the deployment, we will deploy it to
    production, and a set of final checks, like monitoring logs for successful deployment,
    is executed. A final successful deployment email is sent to all the stakeholders:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_121_0.png)


    Figure 6.6: Continuous Delivery flow


    If an issue is observed at any stage of the deployment pipeline, we will stop
    the pipeline or revert the changes.


    Before we move forward, we should call out that CD usually stands for Continuous
    Delivery, but at times it can refer to Continuous Deployment. The difference is
    minor between these two concepts, but significant. Let’s understand this difference.


    # Continuous Delivery versus Continuous Deployment


    When we want to implement CI and CD pipelines in our code


    ![](img/0ba5078687d28877e27a5bc212dacbeb_122_0.png)


    ![](img/0ba5078687d28877e27a5bc212dacbeb_122_1.png)


    Figure 6.7: Continuous Delivery versus Continuous Deployment


    The preceding screenshot shows us a minor, but significant difference. Continuous
    Deployment is a completely automated process. Any changes committed to the master
    or production branch will be deployed without any human interference. This sound
    good could be undesirable in important projects, where you want to manage the
    deployment process in some controlled manner. CD makes sure that we keep the code
    in a deployable state, but actual deployment occurs only when deliberately triggered
    by an administrator.


    # Why Continuous Delivery?


    So, what are we trying to achieve using Continuous Delivery? Let’s try to answer
    this question in a pointwise manner:


    - **Faster production deployments**: In today''s fast-paced world, everyone is
    competing hard to impress end-users. In such a competition, it is important to
    deliver fast to the customer and get feedback. The core goal of CI and CD pipelines
    is to make sure that the changes can be delivered in a smooth and bug-free manner
    to the clients, as soon as they are ready.

    - **Low risk**: As we are delivering frequently, we deliver smaller chunks at
    a time. So, the scope of things going wrong is lesser, compared to rolling out
    big changes in one go.

    - **Automated delivery**: With automated delivery, we are getting away from a
    lot of manual tasks and saving man-hours. This time can now be used to focus on
    creating the core deliverable. Automated delivery also removes the scope of human
    error.

    - **Controlled delivery**: As the delivery process is easier and automated, we
    can deliver in a controlled manner. For example, we will not roll out the complete
    change to all the customers in one go. We can configure the rollout in a controlled
    fashion, where we deploy in a blue-green deployment manner. In this case, we will
    move a set of customers to the new deployment. Once results are found to be satisfactory,
    we will move the rest of the customers to the new implementation.


    # Challenges with Continuous Delivery


    Although Continuous Delivery helps us solve a lot of problems, we still need to
    be a bit careful when going for this route. It makes sense to be aware of challenges
    that comes along Continuous Delivery approach:


    - **Change in culture**: The most important challenge that is faced when moving
    to a CI/CD-based deployment is to encourage developers to think in a manner, where
    we are delivering to production frequently. Especially for developers who are
    used to working in a waterfall-like model where one completes a big chunk, tests
    it, and then the whole thing is deployed to production in six months or a year;
    a delivery model that talks about weekly or daily delivery to production can be
    a big shift in mindset.

    - **Smaller releases and features**: Another critical challenge faced with Continuous
    Delivery is how to plan for bigger features. We are talking about delivering frequently,
    so how can we accommodate bigger features? The answer is to break down the features
    into smaller chunks as possible and deliver the features in incremental chunks.

    - **Testing important**: As we are frequently delivering, we will need to make
    sure that we are not breaking any existing features. The worst thing we can do
    is break something with a new delivery, which was working earlier for the customer.
    So, we need to make a strong testing strategy and automated test cases are in
    place.

    - **Rollback strategies**: No matter how careful we are, things can still go wrong.
    We need to make sure that we are ready for such situations. We need to have rollback
    strategies in place, where we can quickly switch back to a version that was stable
    and working for the customers.


    # Continuous Delivery example


    In the previous example, when we created a pipeline CI, we took an approach with
    scripting the pipeline. In production scenarios, the right approach is to use
    scripting, as this gives you complete control and flexibility.


    Jenkins also provides us the configuration-settings you creating a project. We
    will take a look at the Maven project and deploy it to a Wildfly server in the
    first example. The example takes code from GitHub project, packages the war file
    using a Maven build, and deploy it to the application server.


    Maven Project Example:


    Let''s create a project for Maven in Jenkins. If you have Maven plugin installed
    (**Manage Jenkins | Manage Plugins | Install Maven**), you will see the Maven
    project option option when using the **New Item** option from Jenkins menu:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_124_0.png)


    Figure 6.8: Jenkins Interface - Maven Project


    After selecting the Maven Project, you will see the option for providing source
    code details. In this example, we will provide the Git URL and any credentials,
    if needed, to access the repository:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_125_0.png)


    Figure 6.9: Jenkins Interface - Git settings


    Next, you will see Build options, as we are using Maven, we will use default pom.xml
    for Root POM and for Goals, we can provide Maven goals as per your need, like
    Clean, Install, Package.


    In Post Steps, we will provide details of the server, where we want to deploy.
    Jenkins gives us options for adding plugins for popular servers like Tomcat, Wildfly,
    and so on. For this example, we have added a plugin for the Wildfly application
    server and chosen that from the Post Steps:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_125_1.png)


    Figure 6.10: Jenkins Interface - Build and Post Steps


    Once we select the application server, in this case Wildfly, we will need to provide
    details like War file to deploy, URL, and credentials, which will be used to deploy
    the war file and so on. Once all the details are provided, Jenkins will use these
    details to deploy the generated war file onto the server:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_126_0.png)


    Figure 6.11: Jenkins Interface - Setting up application server

