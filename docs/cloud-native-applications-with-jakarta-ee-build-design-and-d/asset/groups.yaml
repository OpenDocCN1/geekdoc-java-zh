    ## 目标


    从历史上看，代码集成和交付是开发团队面临的重要挑战。大量时间花费在合并不同的代码分支以及确保集成代码处于可交付状态。在本章中，我们将研究开发中的持续集成 (CI)
    和持续交付 (CD) Aspect。


    我们将从这些概念的高层次介绍开始，然后详细理解每个概念。我们还将使用 Jenkins 工具创建一个示例 CI 和 CD 流水线。我们将研究实施 CI 和 CD
    策略时面临的挑战，并学习如何管理这些挑战。


    # CI 和 CD - 简介


    在当今敏捷的世界中，你希望你的功能和错误修复能尽快到达客户。我们已经放弃了瀑布式软件开发过程，过去我们的交付周期需要几个月。我们正在采用基于冲刺（Sprint）的模型，我们希望更改在几周、几天、有时是几小时内到达客户。持续集成和持续交付是两个强大的工具，赋予了我们在短时间内让最终用户可以使用更改的目标。持续集成是关于确保我们的代码在任何时候都是无错误的。它是关于更快地合并更改，以便开发人员不在分歧的分支上工作。为了确保我们拥有任何时候都无错误的代码库，通常会遵循某种策略。


    在开发代码并使用版本控制软件时，常见的问题是什么样的分支策略最好。在进入 CI 和 CD 流水线之前，我们将简要查看流行的分支策略。


    常见的策略是基于分支和单一分支。让我们详细理解这些。


    # 基于分支的


    这种思想是为每个功能分离分支。在功能完全实现并测试后，将其合并回生产分支。这种方法给我们的重要优势是，在任何时候都没有使用的代码。


    例如，假设有一个新功能请求。开发团队从主分支或生产分支切出一个分支并开始该功能。一旦功能完成且大家都认为准备好进入生产环境，我们就可以将分支合并到主分支，并在下一个交付周期中部署。


    下图展示了基于分支的策略：


    ![0ba507868d2877275bc21dacbeb_113_0.png]


    # 单一开发分支


    随着敏捷开发的普及，需要尽快将代码和功能推向生产。在前节讨论的功能分支方法的一个挑战是，如果我们处理一个较大的功能，并且在整个功能开发和测试后才将代码合并到主分支，我们就延迟了合并活动。问题在于当我们尝试将大量代码合并到主分支时，可能意味着解决大量的合并冲突并重新测试大量的代码。一种帮助我们管理此问题的方法是保持单一分支，即使功能尚未完成也继续合并。我们需要确保半成品功能代码处于某种标记机制之后，以便在功能完成之前不会被执行。


    两种方法都有各自的优缺点。基于分支的方法有助于我们确保在代码处于满意状态时将其添加到生产分支，并且主分支中没有未使用的代码。另一方面，单一分支策略与 CI
