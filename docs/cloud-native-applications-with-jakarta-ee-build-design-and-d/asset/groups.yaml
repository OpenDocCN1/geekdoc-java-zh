    \ checks and deploys the pod on available nodes based on on configuration settings\
    \ like hardware and software needs.\n- **Controller / Control Management:** There\
    \ are four types of controllers that are managing various responsibilities in\
    \ Kubernetes. These are—node controller, endpoint controller, replication controller,\
    \ the service controller.\n\nFollowing are the responsibilities of four controllers,\
    \ as per official Kubernetes documentation (https://kubernetes.io/docs/concepts/overview/components/):\n\
    \n- **Node controller**: Responsible for noticing and responding when nodes go\
    \ down.\n- **Replication controller**: Responsible for maintaining the correct\
    \ number of pods for every replication controller object in the system.\n- **Endpoints\
    \ controller**: Populates the Endpoints object (that is, joins Services & Pods).\n\
    - **Service Account and Token controllers**: Create default accounts and API access\
    \ tokens for new namespaces.\n- **etcd**: etcd is a key-value database store.\
    \ It stores cluster state at any point in time. It is a single source of truth\
    \ for all the node, pod, and cluster states.\n\n# Worker node\n\n![](img/0ba5078687d28877e27a5bc212dacbeb_194_0.png)\n\
    \nFigure 10.8: Kubernetes worker node architecture\n\nThe worker node consists\
