    EE 在云计算方面的前景。我们将进入编码阶段并构建一个示例应用程序。在现实世界中，你不会以孤立的方式使用 Jakarta EE，而是大多数通过框架来构建。在本章中，我们将探索像
    EclipseProfile 和 Spring 流行的框架。最后，我们将应用程序部署到云端进行测试。


    ## 什么是 Jakarta EE？


    Java 是开发企业应用最常用的语言之一。它于 1996 年诞生 Microsystems，立即成为开发者的热门选择。最初有两个版本：J2SE（Java 标准版）和
    J2EE（Java 企业版）。EE 版本或企业版旨在创建企业级应用。2009 年，Oracle 收购了 Microsystems，并此获得了 Java 的所有权。2017
    年，Oracle 将 Java EE 捐赠给了 Eclipse Foundation，在那里被更名为 Jakarta EE。


    那么，到底什么是 Jakarta EE？让我们访问官方网站 jakarta.ee 获取答案：


    > “多年来，Java EE 一直是关键应用程序的主要平台。为了加速云原生世界的业务应用开发，领先的软件供应商合作将 Java EE 技术迁移到 Eclipse
    Foundation，在那里以 Jakarta EE 的品牌进行进化。”


    https://jakarta.ee/about/


    让我们看看关于 Jakarta EE 未来的版本：


    “Jakarta EE 是云原生、轻量级和传统企业应用的未来。”


    https://jakarta.ee/about/faq/


    根据这些定义，可以说 Jakarta EE 为创建企业应用提供了规范，并正向支持云原生应用发展。在本书的剩余部分，我们将使用 Jakarta EE 结合一些辅助库编写所有的示例代码。理论够了！让我们亲自动手创建一个示例应用程序。


