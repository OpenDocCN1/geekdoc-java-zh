    导致不必要的停机。对服务健康进行自动化监控可以避免尴尬情况的发生，因为你可以在客户开始报告之前发现服务停机并采取行动。


    你必须在设计阶段就考虑到系统所需的所有自动化，以避免在交付状态下出现未优化的流程。


    ## 自愈系统


    我们理解，一个包含多个微服务相互通信的系统在本质上是复杂的，并且容易出现某些故障。我们已经讨论过设计因素，即应该接受失败并优雅地处理故障。现在的问题是，故障之后怎么办？我们的系统设计应当是：如果某个服务停止响应，它可以根据某些性能或应用程序日志自动重启吗？或者我们可以设计系统，使得当一个服务实例停止响应时，我们可以启动额外的服务实例并将负载转移到该实例？


    我们需要在设计时考虑这些问题，例如一旦此服务失败会发生什么？可以通过重启自动修复吗？是否可以通过将负载分配到另一个实例来处理这种情况？回答这些问题将帮助我们创建一个健壮的系统，它可以在无需人工干预的情况下自我愈合。


    ## 管理数据


    任何系统的重要方面都是数据和数据库。在设计一个处理多个微服务的复杂系统时，理解数据将如何被管理变得更加重要。微服务的一个黄金规则是每个微服务都管理它自己的数据，但可能并非可行，因为会有一些共享数据。此外，某些报告服务需要从多个数据源获取数据，因此我们需要决定在不影响整体性能的情况下，可以进行多大程度的数据划分。


    处理数据复杂性的良好示例是使用视图（views）。视图是数据的快照，可以从多个数据源创建。它是在对数据应用连接（joins）和过滤后创建的，有助于我们提高运行时的性能。但它确实带有需要注意的开销——因素如及时刷新数据，以避免提供过旧的数据。


    ## 尽可能缓存


    在我们谈到服务的数据管理时，缓存是一种多年来一直被成功使用的技术。你可能想在设计系统时了解哪些数据可以被缓存。考虑一些问题，例如，它应该是由某些库管理的内部缓存，还是像
    Redis 缓存这样的外部缓存管理？另一个重要问题是，如何刷新缓存，因为你不希望在数据库正在更新后后数据时提供过旧的数据。


    良好的缓存方法有助于提高系统性能。因此，花一些时间了解哪些数据可以缓存以及如何缓存是有意义的。


    ## 采用异步


    你在系统中执行的操作并不是所有都会立即影响终端用户。例如，在创建或更新账户时，我们需要向终端用户发送电子邮件。但从账户创建或更新的角度来看，这并没有直接影响系统。此类对于请求完成并非关键路径的任务可以并且应该以异步方式处理。另一类此类任务是事件日志。我们可以将此类任务添加到队列中，稍后由服务以异步方式提取并完成。


    ## 常见错误


    在进行云应用设计时，由于缺乏知识或研究，很容易犯下一些错误。让我们来看看开发团队在引入云设计时常犯的一些常见错误。


    ## 未优化的用法


    在使用云基础设施时，面临的最常见错误之一是浪费资源。记住，云资源虽然很便宜，但并不是免费的。已经看到很多情况，用于测试或验证的未使用服务器在不使用时仍保持激活状态；在可以使用廉价低配置机器的地方使用了高配置机器；当负载增加导致触发扩容脚本时，添加了额外资源，在负载正常时并未释放。这些都是导致人们最终拥有仍需付费的闲置功能的一些常见原因。大多数云服务提供商都提供监控工具和建议以保持账单低廉，但确保资源以优化方式使用取决于开发团队。


    ## 缺乏监控


    正如我们在云中所看到的，很容易创建更小、专注且可重用的服务。这种灵活性也带来了一个问题，即我们现在需要监控更多组件的健康和性能。你不希望等到某个客户向系统报告问题。因此，我们需要确保每个组件和服务都正确地记录健康、性能和应用程序相关信息。我们将自动化监控日志的过程，以便在系统发现错误时可以采取适当措施。


    ## 设计未针对云优化


    另一个经常观察到的问题是当团队迁移到云端时，他们仍然带来了单体设计的旧习惯。例如，我们创建本质上是单体的的服务并让它们自己做太多，导致部分功能的扩展无法实现。或者，我们让服务变为有状态的（stateful），增加了维护服务的额外负担，给服务的扩展性带来了问题。


    ## 考虑容器、无服务器和现成工具


    迁移到云端时，理解云服务的全部功能是有意义的。有时，开发者在开发的后期阶段意识到，对于他们实现的解决方案可能有更好的选择。


    通过云服务，使用函数即服务（FaaS）、容器、数据库即服务（DBaaS）等变得更加简单。此外，云服务提供商还有现成工具来帮助开发和部署应用程序，如 Amazon
    Cloud Beanstalk、Azure App Service 或 Google App Engine。有了所有信息，你将能够对正在构建的服务和应用程序的最佳方法做出明智的决策。


    ## 总结


    在本章中，我们首先承认了云开发需要一些额外的设计考虑，以便我们的应用程序最适合云。我们回顾了软件设计从单体架构到基于微服务的架构的转变历程。我们理解了基于微服务的应用如何解决我们面对的旧单体设计中的许多问题。我们理解了基于微服务的架构最适合云。


    接下来，我们研究了在创建一个要部署在云上的系统时的一些重要的设计考虑。我们研究了诸如为故障设计、无单点故障、保持无状态、快速失败、优雅处理故障、考虑可扩展性、自动化、自愈系统、管理数据、尽可能缓存以及采用异步等设计因素。


    最后，我们研究了人们第一次迁移到云端时犯的一些常见错误。我们理解了资源的未优化使用如何影响云成本，缺乏监控可能导致未检测到的故障，未优化的设计可能让我们无法利用云的优势，以及不探索所有可用选项可能会在开发后期导致遗憾。


    关于云的讨论如果不谈论提供云服务的主要参与者，是不完整的。在下一章中，我们将查看一些重要的云服务提供商，以及他们提供的常用服务。


    ## 问题


    - 1. 什么是单体设计？这种设计的缺点是什么？

    - 2. 解释面向服务的架构。

    - 3. 解释基于微服务的的设计及其优点，并举例说明。

    - 4. 为云设计时需要考虑哪些重要的设计因素？

    - 5. 迁移到云端的团队通常会犯哪些常见错误？


