    ![](img/0ba5078687d28877e27a5bc212dacbeb_31_0.png)


    图 1.5: 软件服务 (SaaS)


    之前的截图非常清晰地强调了所有的基础设施和软件需求都由云端处理。任何提供的服务，只要终端用户无需担心实现细节，并且不需要拥有或支持该服务或数据，都属于此类。我们已经讨论过的一个例子是
    Gmail；同样，Google Docs、Microsoft Office 365 等服务也是 SaaS 的示例。


    ## 函数即服务 (FaaS)


    云服务中较新的成员是函数即服务，简称 Function as a Service (FaaS)。如果说软件服务是为终端用户提供完整的现成软件，那么函数即服务就意味着在云上独立地部署代码的最小单元，即一个函数。在这里，一个函数可以代表一个微小的、基于
    REST API 的微服务、一个定期运行的独立批处理、每当上传新资源或文件时需要执行的代码，或者任何类似的可以独立执行的小型代码单元。


    接下来的截图显示了 FaaS 的方面：


    ![](img/0ba5078687d28877e27a5bc212dacbeb_32_0.png)


    图 1.6: 函数即服务 (FaaS)


    之前的截图展示了在 FaaS 的情况下，用户唯一管理的是函数。用户将把函数可执行文件提供给云端并进行部署。所有领先的云服务提供商都提供了 FaaS 解决方案；例如，Amazon
    提供 Lambda，Microsoft 提供 Function App，Google 提供 Google Functions 等。


    ## 云提供的主要服务


    在本节中，我们将从高层次讨论云服务提供商提供的所有主要服务。不同的云服务提供商（如 Amazon、Microsoft 和 Google）提供大量的系列服务。我们将在第
    3 章中介绍一些主要的云服务提供商。在这里，我们将关注云提供的一些核心服务，这些服务在主要参与者中最为常见。


    在介绍云提供的服务之前，让我们先思考在开发和部署一个简单的在线应用时需要哪些基本服务。至少，你至少需要一个部署和运行应用程序的环境，在大多数情况下你需要一个数据库，以及一个用于存储任何静态内容的文件存储系统。终端用户主要通过互联网访问你的应用程序。


    接下来的截图显示了简单应用的高层设计：


    ![](img/0ba5078687d28877e27a5bc212dacbeb_33_0.png)


    图 1.7: 简单应用的高层设计


    当我们开始从云的角度进行思考时，可以认为应用程序部署在计算服务上，静态内容存储在存储服务上，而数据存储在云服务提供商提供的数据库服务中。所有主要的云服务提供商在计算、存储和数据库服务方面都提供了多种解决方案。但服务栈远超这些基础服务。


    让我们来看一下云平台上提供的一些基础服务类别。


    ## 计算 (Compute)


    计算可能是任何云服务提供商提供的最重要的服务组。简单来说，这项服务为你的应用程序执行提供资源。计算资源最基础的形式是虚拟机（VMs）。这更像是一个远程机器，你可以从云服务提供商处获取它来部署你的应用程序。云服务提供商通常会提供选项，让你选择虚拟机的硬件配置、你所需的操作系统以及其他基于安全和访问的配置。


    另一组重要的计算服务是以平台即服务（PaaS）的形式存在的，云服务提供商允许你带上你的应用程序并将其部署在云上；例如，Amazon 的 Elastic Beanstalk
    或 Azure 的 Service Fabric Cluster。除了这些，我们还有以 AWS Lambda 或Azure Functions 或 Google
    Cloud Functions 形式提供的部署。


    除了这里提供的选项，我们还有批处理计算服务，用户可以提供并行方式执行的批处理作业。基于容器的计算服务也变得非常流行，因为开发和部署容器比全功能服务器更容易。我们将在第
    10 章详细介绍容器服务及其用法。


    ## 存储 (Storage)


    在计算之后，存储是任何软件中的另一个重要因素。你需要存储代码、可执行文件、文件、图像、数据等。所有云服务提供商都会为你提供多种口味的存储服务。AWS S3
    是一个流行的存储服务，可以以对象的形式存储数据。同样，Azure 提供了存储功能，可以以 Blobs、文件、队列或表格的形式存储数据。


    在所有存储中，都提供了加密和复制的选项。正如我们在本章前面讨论的那样，云中的数据是以数据中心、可用区和区域为形式存储的；我们可以根据其重要性来复制数据。例如，可以重新计算的数据可能没有客户的数据那么重要。对于关键数据，你可能想要多区域复制策略。存储数据的另一个重要分类是其使用的频率；根据此，人们需要制定一种访问策略。


    ## 数据库 (Database)


    如果不提到数据库，关于软件开发的讨论就是完整的，数据库用于存储和管理软件应用程序中使用的数据。有多种类型的数据库可用，大致分为两个大类：SQL（或 RDBMS）和基于
    NoSQL 的。Oracle、MS-SQL、MySQL、Postgres 是一些著名的 RDBMS 数据库提供商。NoSQL 数据库可以进一步细分为：键值型（Redis
    和 Riak）、文档型（MongoDB 和 CouchDB）、列型（Cassandra 和 Vertica）或图型（Neo4j 和 OrientDB）。


    所有云服务提供商都提供了良好的数据库解决方案。例如，AWS 有 RDS（关系型数据库服务）以及 DynamoDB 等 NoSQL 解决方案。同样，Azure
    提供 Azure SQL 和 Cosmos DB。


    ## 网络 (Networking)


    另一个值得这里的重要服务是网络。有时我们需要通过创建虚拟网络来轻松管理资源。此外还有用于资源间通信的服务，如应用网关和网络安全组。负载均衡可用于分配负载。防火墙服务保护资源免受未经授权的访问。


    ## 安全 (Security)


    当基于云的部署流行起来时，大多数组织的一个大问题是安全。对于共享环境，人们对其没有完全控制权。因此，你会发现大多数云服务提供商内置了许多安全功能。例如，只需设置即可对任何数据或账户启用加密。还有管理密钥和证书的服务。监控服务可以检查谁在访问资源，并提供基于角色的访问。


    ## 资源与成本管理 (Resource and cost management)


    一旦你开始使用云，你会发现资源和成本是一项大任务。你有散落在各处的资源；需要方法来监控和管理它们。例如，你有一个部署了应用程序的虚拟机，但资源只使用了 50%；切换到较低配置的服务器会更好。如果你为了测试启动了新服务器但忘记关闭它，你将一直付费直到发现自己的错误。为了避免糟糕体验并优化我们的使用，云服务提供商通过许多服务帮助我们监控使用情况和成本。


    例如，AWS 提供了 CloudWatch 和 CloudTrail 服务来监控资源访问。Trusted Advisor 服务帮助你优化资源使用并降低成本。同样，Azure
    提供了 Azure Insights 服务。


    ## 其他值得关注的服务 (Additional noteworthy services)


    云非常庞大，拥有许多服务提供商；我们有数百种现成服务可用。某些服务是供应商特有的，而一些是通用的。


    机器学习是过去几年备受关注的领域，所有云服务提供商在该领域都有很好的服务集。例如，Amazon 的 Sagemaker 帮助构建、训练和部署机器学习模型；Deep
    是一个支持深度学习的视频摄像头，可以运行 Sagemaker 模型。Azure 提供了机器学习 Studio 用于机器学习模型。云服务提供商还提供了许多与语音、文本、图像识别相关的的服务。


    对所有云厂商提供的所有服务进行完整讨论超出了


