    to users and applications in some form, be it Relational or NoSQL, to execute
    its operations. Amazon gives us a variety of options when it comes to databases,
    which are as follows:


    +   - Amazon RDS or Relational Database Service: The most common and old way of
    storing data is in Relational form. Amazon RDS provides support for many popularly
