    # CHAPTER 2


    # Design for Cloud


    Before we get deeper into cloud-based application development, it is important
    to understand how designing or architecting an application for cloud is different
    from older approaches of non-cloud times. If you would always want to design the
    system you are about to develop, it is obvious for this book to cover the design
    aspects of cloud-based applications, before we take the next step and talk about
    code and development.


    In the previous chapter, we talked about how cloud has improved a developer''s
    life, by introducing off-the-shelf services that can directly be used to deploy
    and manage applications. A more important implication of cloud, which is often
    undermined, is that with the availability of cloud-based services, developers
    and architects have a lot more freedom to think about systems that are complex
    in nature and were difficult to think about a couple of decades back.


    # Structure


    We will cover the following topics in this chapter:


    - Cloud Native versus Conventional Development

    - Design factors to be considered for cloud

    - Common mistakes


    # Objectives


    As they say, with great power comes great responsibilities; with all the services
    being easily available, it also brings the risk of choosing incorrect services,
    not using the capabilities of cloud in an optimum manner, causing an impact in
    terms of cost and effort. In this chapter, we will learn some basic considerations
    that one needs to take care of when designing for the cloud. We will learn how
    cloud native applications have a different design from traditional monolith applications,
    and talk about some common mistakes that are observed when teams move to cloud
    based development and deployment.


    # Cloud Native versus Conventional Development


    Before trying to get deeper into cloud native application design, let’s try to
    understand what the term cloud native means. As per the definition provided by
    Cloud Native Computing Foundation or CNCF:


    > “Cloud native technologies empower organizations to build and run scalable applications
    in modern, dynamic environments such as public, private, and hybrid clouds. Containers,
    service meshes, microservices, immutable infrastructure, and declarative APIs
    exemplify this approach.”


    In short, cloud native means a design, which is ready to take advantages of cloud
    infrastructure. With popularity of cloud, there are many terms which have become
    popular, cloud-first, cloud-based, cloud-ready, and of course, cloud-native. The
    core idea is to create a design which can help us develop complex applications,
    taking care of its scalability, security, performance, maintenance, cost-effectiveness,
    failure-handling, ease of development, and other project needs.


    When we moved from conventional ways of deployment to cloud-based deployments,
    we had many advantages. The first advantage we, of course, is that now, one does
    not need to worry about hardware needs. You can experiment and test things easily
    without much worrying about hardware cost, as you can rent services and pay only
    for what you used. But the more important aspect is the inbuilt services provided
    by cloud for scalability, availability, security, access management, networking,
    connectivity and so on. With these aspects of control, software architects and
    developers have a lot of freedom to think and develop complex systems.


    A major outcome of this freedom was that we were able to experiment with better
    designs, which help us develop an application in a way that it is easy to maintain
    and scale. We divided our applications to services, and then further to microservices.
    Microservices are the smallest unit of applications, which can be developed and
    deployed independently. This helps us keep our applications loosely coupled, where
    a component or service can be easily updated or replaced without bothering other
    services.


    # From monolithic to microservices


    You will see that a lot of older applications still follow monolithic design architecture.
    In monolithic design, the application is thought off as a single undivided unit
    of deployment. The design has many inherent problems, like all the functionality
    is coded in one place, causing the code to be unreadable and difficult to manage.
    To solve this problem, developers and architects started breaking down the functionality
    into services and components, which helped manage the code in a better manner.
    With the popularity of the cloud, it became possible to break the services further
    and divide the whole functionality into much smaller microservices.


    Let''s look at each of these phases, and understand how microservices help solve
    the many problems that existed earlier.


    # Monolith


    If you are in the software engineering profession for a few years, or have worked
    on legacy systems, you must be familiar with monolith architecture, where the
    whole application is built as a single code unit. It is built and deployed as
    a single unit. In fact, if you are dealing with a small one or two-page application,
    it is not a bad design to follow. But as the application gets complex and starts
    involving multiple features, the monolith architecture will introduce a lot of
    complexity, and there will be a point where making a small change becomes very
    expensive in terms of development and testing.


    The following diagram shows how a monolith application deployment design looks
    like:


