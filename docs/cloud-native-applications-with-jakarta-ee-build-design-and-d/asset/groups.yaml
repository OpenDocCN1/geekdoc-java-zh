    ## Summary


    In this chapter, we talked about scalability and how it can be implemented. Scalability
    is one of the most important areas when designing a cloud native application.
    We started by introducing the concept of scalability, and understood how vertical
    scalability is different from horizontal scalability.


    Next, we investigated cloud-specific areas where we need to maintain scalability.
    We talked about compute scalability, and various services provided by cloud service
    providers to implement it. We looked into database scalability and understood
    how SQL database scale differently from a non-SQL based database. For storage
    scalability, we know that most cloud service providers have off-the-shelf options
    for managing large scale storage, but it is important that we understand various
    options and use them as we need.


    Next, we understood how to design for an application that can scale on a need
    basis. Microservices are a common and popular method to implement a design that
    can scale easily. One microservice can scale independently of the rest of the
    application, which makes microservice-based design best suited for scalability.


    Finally, we created an example showing how our application can scale. We created
    a REST API behind a load balancer. We deployed application to Amazon AWS and used
    its Autoscaling service to help us deploy the application in a manner that it
    can scale out on a need basis.


    In the next chapter, we will look into the monitoring of various types of data
    associated with an application.


    ## Questions


    1. What is scalability?

    2. How is vertical scalability different from horizontal scalability?

    3. How can microservice-based design help us with us achieving scalability?

    4. We have an application deployed to a virtual machine. How can we make it scalable?

    5. Explore a Cloud Service Provider of your choice, and understand how various
    Compute, Database, and Storage options will Scale.


    ## CHAPTER 9


    # Monitoring, Alerting, and Reporting


    Monitoring, alerting, and reporting are very important nonfunctional requirements
    for any application. As these requirements are not visible to end-users, they
    get neglected or de-prioritized at times. One needs to pay for this negligence
    once we observe issues on production environments, which could have been handled
    with proper monitoring, alerting, and reporting. To save ourselves from embarrassing
    situations and lose clients due to issues that could have been handled, it is
    important that we build a strong mechanism for monitoring, alerting, and reporting
    in our cloud-native applications.


    ## Structure


    - Need for monitoring

    - Cloud-based monitoring, alerting, and reporting

    - Application logs management


    ## Objectives


    In this chapter, we will focus on monitoring, alerting, and reporting needs for
    our application. We will start with the basics of monitoring, and understand why
    it is important for our applications. We will look into various aspects of our
    application that needs monitoring.


    We will look into cloud-specific monitoring tools available, and how they can
    help us with our alerting and reporting needs. We will take examples from Amazon
    and Azure to understand off-the-shelf tools available for our monitoring needs.
    An important aspect of our deployment needs is the cost that we are paying to
    cloud service providers for our applications. We will understand how we can monitor
    and manage our cloud on the cloud.


    An important area where we need monitoring and reporting is our application logs.
    We will look into some of the popular tools available to manage and monitor our
    logs in this chapter.


    ## Need for monitoring


    When your application is deployed to production, the work is only half done. The
    real test for an application is on the production environment, when actual users
    are using it, and when the system is being used in a manner that developers did
    not anticipate. The application is exposed to hackers who would like to de-prioritize
    it. (Wait, let me re-read: "The application is exposed to hackers who would like
    to...") -> Actually, the text says: "The application is exposed to hackers who
    would like to..."


    - Application and Service

    - Health

    - Performance

    - Traffic

    - Errors

    - Exceptions

    - Custom metrics


    An important area where we need monitoring and reporting is our application logs.
    We will look into some of the popular tools available to manage and monitor our
    logs in this chapter.


    ## Cloud-based monitoring, alerting, and reporting


    Monitoring, alerting, and reporting are very important nonfunctional requirements
    for any application. As these requirements are not visible to end-users, they
    get neglected or de-prioritized at times. One needs to pay for this negligence
    once we observe issues on production environments, which could have been handled
    with proper monitoring, alerting, and reporting. To save ourselves from embarrassing
    situations and lose clients due to issues that could have been handled, it is
    important that we build a strong mechanism for monitoring, alerting, and reporting
    in our cloud-native applications.


    ## Amazon CloudWatch


    Amazon CloudWatch is a one-stop service provided by AWS for all monitoring needs.
    Here, you can monitor the usage and health of Amazon resources.


    ## Step-by-step example of CloudWatch


    We have looked at what CloudWatch can do for you; let''s set up monitoring for
    an EC2 instance in this section. For EC2, AWS provides a basic CloudWatch configuration,
    which registers every 5 minutes and is enabled by default. If one needs additional
    information, like registering data every minute, one can choose advanced monitoring,
    but this will come at a small price.

