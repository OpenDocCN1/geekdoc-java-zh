    \ IAM 工具为我们提供的界面\n\n你可以在管理用户、组、角色、策略等选项中看到它。基本上，我们可以创建、编辑、删除用户，并为他们分配角色和组，这将管理特定用户可以访问和不能访问的内容。例如，我可以为某个特定用户分配\
    \ S3 的只读权限，当我知道该用户不需要任何额外的访问权限时即可。\n\n此外，你还可以看到 IAM 工具可以提供建议，例如为你的账户启用多因素身份验证（MFA），这意味着用户在提供密码后需要通过额外的身份验证层。这可能是基于发送到手机或电子邮件的某些消息的验证；在凭据泄露的情况下，这增加了一层额外的安全保障。\n\
    \n所有主要的云提供商都提供了类似的工具来管理用户和基于角色的访问。管理员（Admin）有责任确保访问和规则得到妥善管理。\n\n此外，服务提供商还为我们提供了安全组和防火墙等功能。安全组和防火墙允许我们创建一组规则，例如允许对资源的哪些入站和出站访问。\n\
    \n## 监控基础设施变化\n\n确保基础设施安全是一回事，但我们还希望控制资源上发生的所有更改。大多数云服务提供商都为我们提供了选项来监控资源上发生的更改并检查是谁执行了这些更改：\n\
    \n![](img/0ba5078687d28877e27a5bc212dacbeb_134_0.png)\n\n例如，前面的截图来自 Microsoft\
    \ Azure 平台，向我们展示了虚拟机的活动日志。它显示了新机器何时被创建以及由谁创建的。此外，人们还可以根据机器的变化配置事件，例如发送电子邮件或某些自动化操作。这是一个非常实用的工具，可以帮助理解云资源是否执行了任何非想要的操作，并将其追溯到源头。它可能还会帮助我们理解账户是否被破解。\n\
    \n## 在虚拟网络中保护资源\n\n如果我们有一台不希望除授权代码之外任何人访问的机器，虚拟网络是管理这种情况的一种非常有力的工具，可以帮助我们在资源周围标记边界，以确保没有未经授权的访问。在云中创建虚拟网络非常简单，你通常会看到一个额外的服务来创建新的虚拟网络：\n\
    \n图 7.2：Microsoft Azure 活动日志视图\n\n+ 基本 IP 地址 安全标签 查看 + 创建\n\nAzure Virtual Network\
    \ (VNet) 是 Azure 中私有网络的基础构建模块。VNet 允许许多类型的资源（例如 Azure 虚拟机 (VM)）之间、互联网以及本地网络进行安全通信。VNet\
    \ 类似于你在自己的数据中心中运行的传统网络，但它带来了 Azure 基础设施的额外优势，如扩展性、可用性和隔离性。了解更多关于虚拟网络\n\n项目详情\n\
    \n| 订阅 | 现用随付 |\n| :--- | :--- |\n| 资源组 | java-functions-group 创建 |\n\n实例详情\n\n\
    | 名称 | TestVM |\n| :--- | :--- |\n| 区域 | (US) East US 2 |\n\n![](img/0ba5078687d28877e27a5bc212dacbeb_135_0.png)\n\
    \n> 图 7.3：Microsoft Azure 虚拟网络接口视图\n\n截图显示了在 Microsoft Azure 中创建虚拟网络的界面。人们可以设置防火墙规则，以确保从外部世界对虚拟网络的访问是限制的。\n\
    \n当有一组资源只能通过代码访问，而不需要物理访问时，虚拟网络非常有帮助；例如，你有一个数据库应该只从你 VM 中的代码访问，而不需要额外的访问。我们可以将数据库和虚拟机都留在虚拟网络中，并阻止对数据库的任何外部访问。\n\
    \n当我们谈到虚拟网络时，我们应该理解地址空间（address space）和子网（subnets）的概念。在创建虚拟网络时会选择地址空间，并根据 CIDR\
    \ 或无类网间路由进行定义。地址空间基本上是可用于虚拟网络的 IP 地址范围，在选择地址范围时需要小心，因为当我们连接两个或多个虚拟网络时，我们必须确保范围不重叠。子网是在虚拟网络内部设置一个较小的网络。这种方法当你想要进一步划分应用程序内部资源的边界时特别有用；例如用于前端的资源与用于后端的资源。\n\
    \nVPN 客户端和 VPN 网络网关是常见的连接方式。\n\n## 资源的自动化部署\n\n我们希望减少人为错误，特别是当我们有多个环境时。这里有一个虚拟机的\
    \ ARM 模板示例：\n\n```json\n[\n  {\n    \"apiVersion\": \"2016-04-30\",\n    \"type\"\
    : \"Microsoft.Compute/virtualMachines\",\n    \"name\": \"[concat('myVM', copyindex())]\"\
    ,\n    \"location\": \"[resourceGroup().location]\",\n    \"copy\": {\n      \"\
    name\": \"virtualMachineLoop\",\n      \"count\": \"[parameters('numberOfInstances')]\"\
    \n    },\n    \"properties\": {\n      \"hardwareProfile\": {\n        \"vmSize\"\
    : \"Standard_DS1\"\n      },\n      \"osProfile\": {\n        \"computerName\"\
    : \"[concat('myVM', copyindex())]\",\n        \"adminUsername\": \"[parameters('adminUsername')]\"\
