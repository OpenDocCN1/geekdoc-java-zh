    - **Managed Apache Cassandra**: Another flavor of NoSQL database support by Amazon.
    It is fast, highly available and scalable Apache Cassandra Compatible Database.


    - **Others**: Apart of the database options mentioned above, Amazon provides Neptune
    service for graph-based NoSQL database, Timeshift for timeseries database, Elastic-Cache
    for in-memory caching needs, Redshift for cost-effective data warehousing needs.


    ## Other services


    Amazon, being the market leader in cloud service providers, has tens of additional
    services, apart from the ones we have mentioned so far. It is not possible to
    go through all the services in this chapter, so we will go through some of the
    important ones.


    Amazon provides a set of services for networking purposes, like Amazon VPC or
    Virtual Private Cloud, which helps manage resources in a virtual network by helping
    us security and access rules. Other services helping networking needs are Cloud
    Front, which helps setup a content delivery network, Route 53 to manage domains,
    Direct Connect to setup dedicated networks from local networks to AWS, Elastic
    Load Balancing or ELB to manage and distribute incoming traffic.


    An additional set of services is security-related services, where we have AWS
    Identity and Access Management or IAM to manage users, groups, and roles, Amazon
    Detective to investigate potential security issues, Certificate Manager to manage
    and deploy SSL certificates, Key Management Service to manage encryption keys,
    Amazon Inspector to manage application security, and Amazon Shield to protect
    from DDoS attack.


    Monitoring is another important aspect of any application. Amazon provides a set
    of services for monitoring and managing applications which include Amazon CloudWatch
    to monitor resources and applications, CloudTrail to track user activity and usage,
    Cloud Formation to get the infrastructure as code or, in other words, templates
    to setup resources.


    Amazon provides a set of services in a lot of other categories, like for machine
    learning, it has services SageMaker to build, train, and deploy machine learning
    models, DeepLens for video-enabled deep learning, Lex for voice and text chatbots,
    and so on. For IoT or Internet of Things, it has IoT core, which helps to connect
    devices to the cloud, IoT events for event detection, IoT analytics for analysis,
    etc. For blockchain, it provides Amazon Managed Blockchain and Quantum Ledger
    Database or QLDB.


    Readers are further encouraged to explore https://aws.amazon.com to learn more
    about AWS cloud services.


