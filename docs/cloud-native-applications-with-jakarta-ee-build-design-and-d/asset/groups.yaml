    另一个在云使用率位居第二位的重要云服务提供商是微软的 Azure。与 Amazon 类似，Azure 为云端提供了大量服务。要在 Microsoft Azure
    上创建新账户，请访问以下链接：https://azure.microsoft.com/。创建账户是免费，就像 Amazon 一样。一旦进入云门户，你将看到基于分类的资源描述。


