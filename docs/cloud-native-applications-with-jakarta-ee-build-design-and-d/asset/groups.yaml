    ## 云计算中的成本管理


    尽管作为开发团队，我们的主要关注点一直是应用程序的健康和监控，但成本是影响项目的关键因素之一。使用云部署的主要优势之一是易于设置和扩展。如果我们不监控所用资源的成本，同样的优势也可能变成劣势。


    在云中观察到的一些常见错误是：为了测试某个功能添加了资源，但开发者在使用后忘记清理并关闭这些资源。伸缩扩容（scale-out）代码在负载增加时添加了资源和机器，但由于伸缩收容（scale-in）代码的某些问题，负载下降时资源从未被释放，导致不必要的成本增加；或者服务被部署在高端机器上，而它只利用了不到
    10% 的性能，花费了你巨额资金，而相同的服务本可以部署在较小的机器上。


