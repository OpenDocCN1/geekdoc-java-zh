    \ network, and is defined in terms of CIDR or Classless Inter-Domain Routing.\
    \ Address space is basically a range of IP addresses that can be used for the\
    \ virtual network, and needs to be careful while choosing the address range, as\
    \ when we are connecting two or more virtual networks, we have to make sure the\
    \ range is not overlapping. A subnet is about setting up a smaller network within\
    \ a virtual network. This approach is particularly useful when you further want\
    \ to demarc the boundary of resources within an application; for example, resources\
    \ used for frontend vs resources used for backend.\n\nVPN clients and VPN network\
    \ gateways are common ways to connect to.\n\n## Automated deployment of resources\n\
    \nWe would like to reduce human errors, especially if we have multiple environments.\
    \ Here is a sample ARM template for VM:\n\n```json\n[\n  {\n    \"apiVersion\"\
    : \"2016-04-30\",\n    \"type\": \"Microsoft.Compute/virtualMachines\",\n    \"\
    name\": \"[concat('myVM', copyindex())]\",\n    \"location\": \"[resourceGroup().location]\"\
    ,\n    \"copy\": {\n      \"name\": \"virtualMachineLoop\",\n      \"count\":\
    \ \"[parameters('numberOfInstances')]\"\n    },\n    \"properties\": {\n     \
    \ \"hardwareProfile\": {\n        \"vmSize\": \"Standard_DS1\"\n      },\n   \
    \   \"osProfile\": {\n        \"computerName\": \"[concat('myVM', copyindex())]\"\
    ,\n        \"adminUsername\": \"[parameters('adminUsername')]\",\n        \"adminPassword\"\
    : \"[parameters('adminPassword')]\"\n      },\n      \"storageProfile\": {\n \
    \       \"imageReference\": {\n          \"publisher\": \"MicrosoftWindowsServer\"\
    ,\n          \"offer\": \"WindowsServer\",\n          \"sku\": \"2012-R2-Datacenter\"\
    ,\n          \"version\": \"latest\"\n        }\n      }\n    }\n  }\n]\n```\n\
    \nHere is a sample cloud formation for EC2:\n\n```json\n[\n  {\n    \"apiVersion\"\
    : \"2014-09-09\",\n    \"Type\": \"AWS::EC2::Instance\",\n    \"Name\": \"[concat('myVM',\
    \ copyindex())]\",\n    \"Properties\": {\n      \"KeyName\": String,\n      \"\
    LaunchTemplate\": String,\n      \"Licenses\": String,\n      \"Monitoring\":\
    \ Boolean,\n      \"NetworkInterfaces\": String,\n      \"PlacementGroupName\"\
    : String,\n      \"SecurityGroups\": String,\n      \"SourceDestCheck\": Boolean,\n\
    \      \"SsmAssociations\": String,\n      \"SubnetId\": String,\n      \"Tags\"\
    : String,\n      \"Tenancy\": String\n    }\n  }\n]\n```\n\nHere is a sample Azure\
