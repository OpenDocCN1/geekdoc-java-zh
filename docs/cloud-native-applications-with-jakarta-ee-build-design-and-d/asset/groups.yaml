    Continuous Integration and Continuous Delivery


    In the last few chapters, we created an application and tested it. But our job
    is not completed unless we have deployed the code and delivered the application.
    End-user can only use the application that is successfully deployed to production.
    With agile development gaining popularity, Continuous Integration and Continuous
    Delivery have become important aspects of the software development process. In
    this chapter, we will look into these aspects in detail.


    ## Structure


    - CI and CD - An Introduction

    - Continuous Integration

