    持续集成与持续交付


    在过去的几章中，我们创建了一个应用程序并对其进行了测试。但除非部署了代码并交付了应用程序，否则我们的工作还没有完成。最终用户可以使用成功部署到生产环境的应用程序。随着敏捷开发的普及，持续集成和持续交付已成为软件开发过程中的重要方面。在本章中，我们将详细研究这些方面。


    ## 结构


    - CI 和 CD - 简介

