    \ breaker pattern\n- Summary\n- Questions\n\n## Index\n\n## CHAPTER 1\n\n## Introduction\
    \ to Cloud Computing\n\nIn the last few years, cloud computing has changed the\
    \ way we use to think about software development. This has impacted software design\
    \ and development in more ways than we can imagine. Cloud has helped us take our\
    \ focus away from hardware requirements and constraints, so that we can spend\
    \ more time and attention on other aspects of software development, like performance,\
    \ scalability, security, and so on. In this chapter, we will introduce the concept\
    \ of Cloud Computing in details.\n\n## Structure\n\n- What is Cloud?\n- Understanding\
    \ IaaS, PaaS, SaaS and FaaS\n- Major Services provided by Cloud\n\n## Objectives\n\
    \nIn this chapter, we will start by understanding the basics of cloud. We will\
    \ understand what cloud is and how it is reshaping software development. We will\
    \ understand “Pay as you Go” model, which has a major impact in popularizing the\
    \ cloud. We will understand the concept of regions, zones and data centers.\n\n\
    A discussion about cloud is incomplete without an understanding of concepts around\
    \ cloud offerings, like Infrastructure as a Service (IaaS), Platform as a Service\
    \ (PaaS), Software as a Service (SaaS), and Functions as a Service (FaaS). We\
    \ will discuss all of these in detail in this chapter. Finally, we will look into\
    \ some important services offered by cloud service providers.\n\n## What is Cloud?\n\
    \nA couple of decades ago, deploying a new web application online was a nightmare;\
    \ you would need to buy costly servers, which would be installed on premise hosted\
    \ on service provider location. High availability was difficult to maintain, along\
    \ with security, managing OS updates, and so on. Also, once bought or rented,\
    \ it was not easy to upgrade or downgrade the configuration.\n\nThen came an era\
    \ of virtual machines, which eased the allocation of hardware a bit, but still\
    \ that was costly and you would ideally pay for a year or minimum for a month.\
    \ You would only get raw servers and you were still responsible for managing them:\
    \ security, scalability, backing up systems, installing software, databases and\
    \ so on.\n\nFinally, to solve all the hardware and infrastructure-related problems,\
    \ the cloud came to the rescue. Now, instead of buying hardware, you could rent\
    \ it, and that too on an hourly basis, or in most cases, you would pay per your\
    \ usage. You could easily scale up or down, both vertically or horizontally. The\
    \ compute services did not just come in the form of virtual machines, but also\
    \ services like serverless functions, direct deployment of web applications, and\
    \ microservices. Additionally, services are available for storage in files, data\
    \ objects, queues, tables, databases and so on.\n\nOne can set up virtual networks\
    \ easily and manage access to resources. Security is provided as off shelf service\
    \ in most of the cloud-based solutions. Performance monitoring and scalability\
    \ are a few other services that are built into the cloud.\n\nWe will keep on exploring\
    \ the features provided by the cloud throughout the book. A major point to understand\
    \ here is that the cloud has changed the way we used to think about software design\
    \ and development. The factors like scalability, security, performance, monitoring,\
    \ authentication, and role-based access are features that one can get off the\
    \ shelf and do not have worry now.\n\n## Pay As You Go\n\nA discussion about Cloud\
    \ Computing is incomplete without understanding the concept of Pay as you Go model.\
    \ The as you Go” has played a very important role in popularizing cloud services.\
    \ The idea behind the concept is that you will need to pay only for the resources\
    \ you have used.\n\nFor example, if you want to buy a new computer, you first\
    \ need to buy it and only then you can use it. Whereas, on the cloud, if you want\
    \ to use a virtual machine, you can rent it for the time you need, and pay based\
    \ on your usage. Say, I need a quad-core, 32 GB RAM to run a sample code and validate\
    \ some\n"
