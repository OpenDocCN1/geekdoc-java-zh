    静态代码审查工具帮助我们识别这些常见的问题模式，例如硬编码凭据、缺乏适当的命名规范、switch 分中缺失或默认值等。这些工具可以轻松地集成到 IDE 或持续集成流水线中，并起到第一道防线的作用。PMD、FindBugs、SonarCube
    是这里值得提到的一些工具，可以探索它们来实现静态代码分析。


    **代码覆盖率**：另一组支持我们测试策略的工具是帮助我们识别代码覆盖率的工具。在制定测试策略时，有一个常见的争议问题——对于一段代码来说，多少单元测试是足够的？这个问题没有标准答案。你可能会看到一个开发者为一个类编写了
    20 个单元用例，而另一个人只写了 10 个。


    代码覆盖率在这种派上了用场。简单来说，代码覆盖率描述了所有测试用例合计覆盖或执行的代码量。例如，如果代码库中添加了一个 100 行的新类，而单元测试用例的代码覆盖率为
    70%。这意味着仍有 30 行代码未经过测试或未被我们的单元测试用例覆盖。


    我们可以在项目或服务级设置覆盖率预期，以便处理不同代码set的所有开发者在编写测试用例时达成共识。将代码覆盖率设置为 100% 很有诱惑力，但往往是无法实现的，因为部分代码可能处于异常或错误处理情况中，这些情况可能难以复制，或者根本不值得投入精力。90%
    的覆盖率可以认为是良好的，但同样，这取决于具体的项目，或者有时取决于正在测试的服务或类。


    # 总结


    在本章中，我们讨论了软件开发的一个重要方面，即测试。良好的测试策略将使你免于尴尬，即最终用户发现你的应用程序存在问题并可能转向你的竞争对手；而本章中讨论的单元测试是测试中最基础的方面，它帮助我们确保代码的最小单元（通常是函数）能够承担其职责。接下来，我们讨论了集成测试，它让我们更进了一步，帮助我们测试不同单元之间的集成。它确保了系统组件在协作完成任务时能够正常工作。


    我们还讨论了服务测试，它帮助我们确保一个服务被完全测试并运行良好。接下来，我们查看了端到端系统测试。顾如其名，这种测试级别有助于确保系统整体运行良好并能够实现其用例。我们涵盖了性能测试方面，这对于任何应用程序都非常重要。我们探索了
    Jmeter 工具来帮助性能测试并验证我们的预期数值。接下来，我们涵盖了应用程序的一些额外测试方面，如本地化测试、可用性测试、无障碍测试和安全测试。


    我们接着讨论了 TDD（测试驱动开发），据此理解了如何从测试的角度开始考虑需求。人们在编写实现功能的代码之前先编写测试，这种方法可以帮助我们确保编写的是高质量代码，涵盖了所有边界情况并且是测试的。最后，我们讨论了其他方面，如通过现成的代码分析工具发现代码中问题的静态代码分析，以及通过代码覆盖率确保我们可以根据测试代码的百分比来衡量测试。


