    scale-up scripts to come into play are not freed when the load is normal. These
    are some of the very common reasons one ends up having unused capabilities that
    you still end up paying for. Most of the cloud service providers provide monitoring
    tools and suggestions to keep the billing low, but it is up to the development
    team to make sure that resources are being used in an optimum manner.


    # Lack of monitoring


    As we have seen with the cloud, it is easy to create smaller, focused, and reusable
    services. This flexibility also brings a problem with it, that now we need to
    monitor more components for their health and performance. You do not want to wait
    until some customer reports a report in the system. So, we need to make sure each
    component and service is logging health, performance, and application-related
    information properly. We will automate the process of monitoring logs so that
    proper actions can be taken when an error is figured out in the system.


    # Design not optimized for cloud


    Another problem that is observed often is when teams move to the cloud, they still
    bring in the old practices for monolithic designs. For example, we create services
    that are monolithic in nature and to do too much on their own, making scaling
    of a part of functionality impossible. Or, we make our services stateful, which
    adds the additional burden of maintaining state on the service, bringing problems
    in the scalability of the service.


    # Consider containers, serverless, and off the shelf


    When moving to the cloud, it makes sense to understand the full capabilities of
    cloud services. At times, developers realize at later stages of development that
    there could have been a better option for a solution they have implemented.


    With Cloud, it has become easier to use functions as a service, containers, database
    as a service and so on. Additionally, cloud service providers also have off-the-shelf
    tools to help develop and deploy applications like Amazon Cloud Beanstalk, Azure
    App Service, or Google App Engine. With all the information, you will be able
    to take an educated decision about the approach that is best for the service and
    application being built.'
