    ## 常见威胁与软件防御


    开发应用程序时，你需要处理可能面临的一系列问题。在本节中，我们将查看一些常见威胁以及处理这些威胁的技术。


    ## HTTPS - 保护您的 API


    我们读过很多案例，用户误认为虚假网站实际上是真实网站并提供了一些关键细节。HTTP 协议的局限性在于它是不安全的，数据以未加密的形式传输。应对这些挑战的方法是使用安全版本，即
    HTTPS。那么，从 HTTP 迁移到 HTTPS 如何保护我们的网站和 API？让我们尝试理解背后发生了什么：


    1. 浏览器发送类似 https://xyz.com 的页面请求。

    2. 网站需要返回一个 SSL 证书，以确认它是安全的并供浏览器验证。

    3. 浏览器验证证书并创建一个对称密钥。然后将该对称密钥发回应用程序。所有云服务提供商都有简单的方法为其托管的网站和 API 实现 HTTPS。


    ## 加密


    应用程序通常面临的另一种攻击类型是数据被访问。我们可以使用加密来确保即使有人访问了服务器，他们无法读取数据。云服务提供商帮助我们为许多服务提供加密。这也很容易实现，例如：


    图 7.6：AWS S3 加密视图


    （注：此处为翻译错误。例如，Amazon Web Services 为我们提供了带有 DDoS 防护的 AWS Shield，而 Microsoft Azure
    也出于相同目的提供了 Azure DDoS Protection。）


    上面的截图显示了我们如何通过选择一个选项来开启 AWS 存储加密。同样，我们可以启用数据库加密。这就是启用静态数据加密的方法。同样，我们可以通过上一节讨论的
    HTTPS 等方法启用传输数据加密。


    ## DDoS 攻击


    当前领域中非常常见的攻击是拒绝服务或分布式拒绝服务（DDoS）攻击。基本上，你的服务将受到虚假请求的轰炸，导致服务器堵塞并无法处理合法请求。我们需要理解请求是虚假的还是合法的。再次，云服务提供商通过提供开箱工具在此提供帮助。例如，Amazon
    Web Services 为我们提供了带有 DDoS 防护的 AWS Shield，Microsoft Azure 为相同目的提供了 Azure DDoS
    Protection。


    ## 代码和 SQL 注入


    开发团队还需要注意额外的攻击，如代码注入和 SQL 注入。考虑这种情况：用户被要求对电子商务网站提供反馈评论。这些评论会被加载并显示给对同一产品感兴趣的其他用户。现在，如果黑客添加了包含
    JavaScript 代码的恶意评论，我们将其存储并在下次有人打开产品页面时进行渲染。因此，代码将在终端用户的机器上执行并访问浏览器中的个人数据，黑客可以利用这些获取个人利益。确保了适当的检查以验证终端用户添加的输入是开发团队的责任。这些检查可以手动添加，也可以使用框架进行。


    ## 通过示例理解安全


    当你创建一个应用程序时，可能会有许多方面被忽略。例如，有时我们为 GET、PUT、POST 等创建了简单的 REST 服务。假设我有一个这样的服务：


    `GET https://somewebite.com/employees/1`


    现在，这看起来像是一个获取 ID 为 1 的员工的简单 REST 服务。这没有问题。但有人很容易查看浏览器向 Web 服务发出的调用，并尝试将其修改为：


    `GET https://somewebite.com/employees/2`


    现在，他/她就能看到不应允许查看的数据。或者，一旦你知道有一个 GET 服务，你可能会尝试 POST 和 PATCH 服务，这些服务将更新用户的数据；同样，需要理解调用用户是否有权执行此操作。你可以很容易看到，这些情况下的问题在于接收端点缺少授权检查，无法确保只有经过授权的用户才能更改或获取数据。


    在其中的一个真实项目实例中，我见过一种情况：用户操纵 JavaScript 检查，允许他输入未获得授权输入的数据，而这本应在输入层被拦截。这里的错误在于仅在前端层面有检查，而后端没有。


    我们知道问题，也知道解决方案，这些通常是需要遵循的简单最佳实践。但我们也经常观察到应用程序面临这类问题。为什么？面临这些问题的主要原因是，这些是任何开发软件中未被记录的需求，很容易被遗漏。你永远不会看到某个明确讨论如何实现
    REST 端点的需求。这取决于开发人员的经验和专业知识，他们在编写代码时处理所有的安全威胁。现在的问题是，有时由于截止日期压力或需求变化，开发者可能会留下一些漏洞供黑客利用。


    '
