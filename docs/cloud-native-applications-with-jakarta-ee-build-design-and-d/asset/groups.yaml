    # # Sidecar pattern


    As a sidecar is attached to a motorcycle, following a similar concept, sidecar
    pattern allows one to attach extra functionalities to a microservice. Apart from
    core business logic, a microservice needs to implement a lot of supporting code
    for tasks like monitoring, logging, application configurations, circuit breaker,
    and so on. Sidecar pattern helps us move all these additional code out of the
    core application. It helps the microservice to focus on core functionality and
    move all'
  - '[PAGE 233]


    the boilerplate code out:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_233_0.png)


    **Figure 12.8: Sidecar pattern**


    The preceding screenshot shows Sidecar pattern responsibility distribution. A
    very useful implementation of the sidecar pattern is service mesh.


    # ### Service mesh


    Think of a scenario where we need to implement multiple microservices that can
    communicate with each other. In such a scenario, services need to implement various
    aspects like service discovery, timeouts, circuit breakers, logging, and so on.
    Service Mesh helps us move all these boilerplate code out of the core services
    using the sidecar pattern:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_233_1.png)


    **Figure 12.9: Service mesh**

    Image source: https://www.nginx.com/blog/what-is-a-service-mesh/",


    The preceding screenshot shows us a service mesh implementation. Here, sidecar
    also implements proxies for the services. Instead of hitting other services'
  - '[PAGE 234]


    directly, each service now can communicate with each other through sidecars. The
    control plane helps us manage sidecar configurations in a centralized manner.


    # Bulkhead pattern


    The term bulkhead is borrowed from the shipping industry. A bulkhead is an upright
    wall within the hull of a ship. The idea is to isolate a catastrophic event like
    fire or leakage in a part of the ship, so that the remaining areas are safe. We
    try to replicate the same idea when architecting a software application. The idea
    is that even if a service fails or goes down, the rest of the system can work
    fine. In other words, we can restrict failure to one part of the application and
    the remaining features and services work fine. This is usually managed by implementing
    failover scenarios in consumer services, which are taking dependencies on provider
    services.


    # Circuit breaker pattern


    In the world of microservices, we know that a service cannot exist in isolation
    and are mostly dependent on other microservices. Let''s take a simple scenario
    where service A calls Service B, which in turn calls Service C. For a request
    to be successful, all three services need to be healthy and provide responses:


    | Service A | Service B | Service C |


    Figure 12.10: Service Request Response Flow


    The preceding screenshot shows request and response flow among services A, B and
    C. Let''s say for some reason, service C becomes unresponsive. In a case, when
    our service B will make a call to service C, it will receive an error response
    or the request will timeout. Now service C might be overloaded, which is causing
    it to become unresponsive. Our service B unnecessarily calls service C and wastes
    time for the response. In the worst case, it will keep on retrying and overload
    Service C further, which is already under access load; hence, not giving a chance
    to Service C to recover.


    A circuit breaker comes in handy to handle such situations. A circuit breaker
    code implemented at calling service keeps a track of failures from provider services.
    For example, we can add a rule that, if service C has failed five times consecutively,
    we stop calling service C. Instead, service B now triggers'
  - '[PAGE 235]


    failover mechanism; for example, it might use a cached response, call a fallback
    service or handle the failure in another graceful manner.


    A circuit breaker can be in three states:


    +   **Closed**: This state indicates that everything is working fine. The circuit
    is closed, so requests are freely passing from calling service to provider service


    +   **Open**: Circuit gets opened when the calling service observes issues and
    stops sending requests to the provider service.


    +   **Half Open**: This is a state between closed and open states. This usually
    occurs when the circuit was previously in the open state, and the calling service
    is trying to check the availability of provider service by sending partial requests.
    If the provider service starts responding, the circuit will be closed again.


    # Summary


    In this chapter, we looked into the best practices that help us develop applications
    for the cloud. We started by revisiting our understanding of the cloud-native
    applications. Next, we looked into 12-factor applications and briefly discussed
    these factors. We discussed some of the common design patterns used in the industry
    to develop cloud-native applications. We started with the SAGA pattern and looked
    into choreography-based and orchestration-based implementations. We talked about
    CQRS and Command Query Response Segregation, which recommends having separate
    sets of services for query and command-based calls. We talked about distributed
    tracing, which helps us with debugging of a complex set of microservices.


    We talked about the strangler pattern, which helps us monolithic applications
    to cloud-based microservices. Service Registry and Discovery pattern help us manage
    communication among microservices by managing a service register. Next, we talked
    about API Gateway based communication, which helps us centralize all the communication
    among microservices and external consumers. We also looked into the blue-green
    pattern, which helps us deploy a new set of microservices without any downtime.
    Sidecar pattern helped us understand how to externalize common concerns of core
    microservice. Finally, bulkhead and circuit breaker patterns were looked into,
    which help us manage failure conditions in cloud-based distributed design.'
