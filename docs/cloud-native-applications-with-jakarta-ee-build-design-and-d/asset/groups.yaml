    上面的截图显示了蓝绿部署（Blue Green deployment）。假设我们有一个现有的生产环境，其节点运行着当前的生产部署，我们将其称为蓝色环境。现在，我们创建一个并行的绿色环境，其中包含最新升级的代码。我们希望将流量转移到绿色环境。这里的想法是逐渐转移流量，而不是一次性完成。例如，我们先将
    10% 的流量移动到绿色节点。我们不断增加绿色环境的流量百分比，最终停用蓝色环境。


    这种方法具有多重优势。其之一是我们通过只在新的环境中启动一小部分流量来降低了风险。因此，如果在新代码中发现任何问题，我们的影响也是很小且可控的。此外，我们还确保了零停机时间，因为我们的生产环境在任何时候都不会处于状态。


    ## 侧边云模式 (Sidecar pattern)


    正如侧边车附加在摩托车上一样，类似的概念，侧边云模式允许为微服务附加额外的功能。除了核心业务逻辑外，微服务还需要实现大量的辅助代码来处理监控、日志记录、应用配置、断路器等任务。侧边云模式帮助我们将这些额外代码从核心应用程序中移出。它帮助微服务专注于核心功能，并将所有模板代码移出：


    ![](img/0ba5078687d28877e27a5bc212dacbeb_233_0.png)


    **图 12.8：侧边云模式**


    上面的截图显示了侧边云模式的职责分布。侧边云模式的一种非常有用的实现是服务网格（service mesh）。


    ### 服务网格 (Service mesh)


    想象这样一个场景：我们需要实现多个可以相互通信的微服务。在这种情况下，服务需要实现服务发现、超时、断路器、日志等各个方面。服务网格帮助我们使用侧边云模式将所有模板代码从核心服务中移出：


    ![](img/0ba5078687d28877e27a5bc212dacbeb_233_1.png)


    **图 12.9：服务网格**

    图片来源：https://www.nginx.com/blog/what-is-a-service-mesh/


    上面的截图向我们展示了服务网格的实现。在这里，侧边云还为服务实现了代理。每个服务现在不再直接访问其他服务，而是通过侧边云通信。控制平面（control plane）帮助我们以集中方式管理侧边云配置。


    ## 舱壁模式 (Bulkhead pattern)


    “舱壁”（bulkhead）一词借自航运业。舱壁是船体内部的垂直墙。其核心思想是隔离船体部分的火灾或泄漏等灾难性事件，以确保其余区域的安全。在设计软件应用程序时，我们也尝试复制这一想法。这种想法是，即使服务失败或崩溃，系统的其他部分也可以正常工作。换句话说，我们将故障限制在应用程序的一部分，而其余的功能和服务可以正常运行。这通常通过在依赖提供服务的消费者服务中实现故障转移（failover）场景来管理。


    ## 断路器模式 (Circuit breaker pattern)


    在微服务世界中，我们知道服务不能孤立存在，大多数依赖其他微服务。让我们来看一个简单的场景：服务 A 调用服务 B，服务 B 再调用服务 C。为了使请求成功，三个服务都必须健康并提供响应：


    | 服务 A | 服务 B | 服务 C |

    | :--- | :--- | :--- |


    图 12.10：服务请求响应流


    上面的截图显示了服务 A、B 和 C 之间的请求和响应流。假设由于某种原因，服务 C变得无响应。在这种情况下，当我们的服务 B 调用服务 C 时，它将收到错误响应或请求超时。现在服务
    C 可能过载了，导致它无响应。我们的服务 B 不必要地调用服务 C 并浪费时间等待响应。在最坏的情况下，它将不断重试，并进一步过载已经承受访问负载的 Service
    C；因此没有给 Service C 留出恢复的机会。


    断路器（circuit breaker）在处理这种情况时非常有用。在调用服务中实现的断路器代码会跟踪来自提供服务的失败情况。例如，我们可以添加一条规则：如果服务
    C 连续失败五次，我们就停止调用服务 C。相反，现在服务 B 将触发故障转移机制；例如，它可能会使用缓存响应、调用备用服务（fallback service）或以优雅的方式处理故障。


    断路器可以处于三种状态：


    -   **关闭 (Closed)**：此状态表示一切运行正常。电路是关闭的，因此请求可以自由地从调用服务传递到提供服务。

    -   **打开 (Open)**：当调用服务观察到问题并停止向提供服务发送请求时，电路打开。

    -   **半开 (Half Open)**：这是关闭和打开状态之间的状态。这通常发生在电路之前处于打开状态，且调用服务试图通过发送部分请求来检查提供服务的可用性。如果提供服务开始响应，电路将再次关闭。


    ## 总结


    在本章中，我们研究了帮助我们开发云端应用程序的最佳实践。我们从回顾对云原生应用的理解开始。接下来，我们研究了 12 因素应用（12-factor applications）并简要讨论了这些因素。我们讨论了用于开发云原生应用的一些常用设计模式。我们从
    SAGA 模式开始研究了基于编排（choreography）和协同排（orchestration）的模式。我们谈到了 CQRS 和命令查询分离（Command
    Query Segregation），它建议为查询和命令使用独立的集合。我们谈到了分布式追踪，它帮助我们调试复杂的微服务set集。


    我们讨论了绞杀者模式（strangler pattern），它帮助单体应用向云原生微服务迁移。服务注册与发现模式（Service Registry and
    Discovery pattern）帮助我们管理微服务之间的通信。接下来，我们谈到了基于 API 网关（API Gateway）的通信，它帮助我们集中所有外部者的通信。我们还研究了蓝绿模式（blue-green
    pattern），它帮助我们在无停机的情况下部署一组新的微服务。侧边云模式（Sidecar pattern）帮助我们理解如何将核心微服务的关注点外部化。最后，研究了舱壁（bulkhead）和断路器（circuit
    breaker）模式，有助于管理云设计中的故障状况。


    ## 问题


    1. 12 因素应用中的 12 个因素是什么？

    2. 如何通过编排和协同来实现 SAGA 模式？

    3. 解释侧边云模式。什么是服务网格？

    4. 各微服务之间如何通信？请结合服务注册与发现模式进行说明。

    5. 结合示例解释断路器模式。

