    years Functions or Serverless compute services. As the name suggests, in a serverless
    deployment, you need not worry about the server or infrastructure that will execute
    your code. All you need to do is write your code and upload it in the form of
    functions to cloud server provider infrastructure.


    An additional advantage of serverless deployment is that it gives you access to
    various features provided by cloud server providers, like your code can be triggered
    by events happening in the cloud; for example, the addition of a new file in the
    storage or a new record in the database. You get connectivity to various services
    like database, message queues, and so on, as a trigger or destination through
    a simple GUI.


    We will talk more about the serverless implementation of code in Chapter 11. Batch:
    A set of services that can run in the background in the form of batch jobs, can
    get benefited from batch services provided by cloud service providers. For example,
    a service that runs every 24 hours, generates a report of sales during the day,
    and sends the report in an email, is a good fit for this kind of infrastructure.
    All common service providers have a batch compute offering.


    Vendor-Specific Services: In addition to the previously mentioned services, almost
    all cloud service providers have PaaS (Platform as a Service) offerings that help
    the development and deployment of applications and services. For example, Amazon
    provides elastic beanstalk, where you can deploy your services directly. Similarly,
    Azure provides services like app automated service fabric.


