    ## What is Jakarta EE?


    Java is one of the most used languages in developing enterprise applications.
    It was born in Sun Microsystems in 1996, and immediately became a popular choice
    among developers. Two flavors came up initially as J2SE or Java 2 Standard Edition,
    and J2EE or Java 2 Enterprise Edition. The EE version or Enterprise version was
    meant for creating enterprise-scale applications. It includes various specifications
    for Web applications, Web services, Enterprise applications, and so on. In 2009,
    Oracle bought Sun Microsystems, and along with that got ownership of Java. In
    2017, Oracle donated Java EE to the Eclipse Foundation, where it was re-christened
    as Jakarta EE.


    So, what exactly Jakarta EE? Let''s go to jakarta.ee, the official website, for
    the answer:


    > “For many years, Java EE has been a major platform for mission-critical applications.
    In order to accelerate business application development for a cloud-native world,
    leading software vendors collaborated to move Java EE technologies to the Eclipse
    Foundation where they will evolve under the Jakarta EE brand.”


    https://jakarta.ee/about/


