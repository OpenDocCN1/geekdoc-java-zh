    # # Cache whenever possible


    While we are at the topic of managing data for service, one technique that is
    being used successfully for years is caching. You might want to understand which
    data can be cached while you design the system. Consider questions like, should
    it be an internal cache managed by some library or external cache management like
    Redis cache? Another important question is, how to refresh cache, as you do not
    want to serve stale data, while backdated data is getting updated in the database.


    A good caching approach always helps in increasing the performance of the system.
    So, it makes sense to spend some time understanding which data can be cached and
    how.


    # # Go asynchronous


    Not everything you do in a system immediately impacts the end-user. For example,
    when creating or updating an account, we need to send an email to the end-user.
    But it is not directly impacting the system in terms of account creation or update.
    Such tasks that are not on the critical path for a request completion can be and
    should be handled in an asynchronous manner. Another set of such tasks is logging
    of the events. We can add such tasks to queues, which can later be picked up by
    services in an asynchronous manner and completed.


    # # Common mistakes


    When going for a cloud-based application design, it is easy to make some mistakes
    due to lack of knowledge or research. Let''s take a look at few common mistakes
    done by development teams when onboarding a cloud-based design.


    # # Unoptimized usages


    One of the most common mistakes faced, when using cloud-based infrastructure,
    is wasting the resources. Remember that the cloud resources are cheap, but they
    are not free. A lot of cases have been seen, where unused servers that used for
    testing or validating are kept active when they are not in use; high configuration
    machines are used where one could have used a cheaper low configuration machine;
    additional resources added, when increased load caused'
