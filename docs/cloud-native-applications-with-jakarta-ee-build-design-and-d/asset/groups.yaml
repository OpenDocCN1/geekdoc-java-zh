    ## Objectives


    Historically, code integration and delivery are an important challenge faced by
    development teams. A lot of time is spent in merging different code branches and
    making sure that the integrated code is in a deliverable shape. In this chapter,
    we will look into Continuous Integration (CI) and Continuous Delivery (CD) aspects
    of the development.


    We will start with a high-level introduction of these concepts, and later understand
    each of these concepts in detail. We will also create a sample CI and CD pipelines
    using the Jenkins tool. We will look into challenges that are faced while implementing
    a CI and CD strategy, and also learn how to manage these challenges.


    # CI and CD - An Introduction


    In today''s agile world, you want your features and bug fixes to reach the customers
    as soon as possible. We have already moved away from the waterfall software development
    process, where we used to take months for a delivery cycle. We are working on
    sprint-based models, where we want our changes to reach customers in weeks or
    days or sometimes in hours. Continuous Integration and Continuous Delivery are
    two solid tools that empower us to achieve our goal of making changes available
    to end-users in short span of time. Continuous Integration is about making sure
    our code is error-free at any point in time. It is about merging changes faster
    so developers are not working on branches that diverge it. To make sure we have
    a core codebase that is always error-free and ready to be deployed to production,
    usually, the development teams follow a strategy where we have a master or production
    branch, which is made sure to be bug-free all the time.


    When developing code and using a version control software, a common problem being
    faced is around what type of branching strategy is best for delivering fast and
    quality software. Before getting into CI and CD pipelines, we will briefly look
    at two popular branching strategies and their use cases.


    # Branching strategies


    The two most common strategies in use are feature-based branching and a single
    branch strategy. Let''s understand these in detail.


    # Feature-based branching


    The idea is to separate branches for each feature. The feature gets merged back
    to the production branch once it is implemented and tested completely. An important
    advantage that this kind of approach gives us that at any point in time, there
    is no unused code in the production branch.


    For example, say there is a new feature request for a product. The development
    team cuts a branch from the master or production branch and starts working on
    this feature. Once the feature is complete and everyone is satisfied that it is
    ready to move to production, we can merge the branch into master, and feature
    gets deployed to production in the next deployment cycle.


    The following diagram showcases feature based branching strategy:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_113_0.png)


    # Single development branch


    With the popularity of Agile development, there is a need for moving code and
    features to production as soon as possible. One challenge with the feature branch
    approach discussed in the previous sub-section is that if we are dealing with
    a larger feature, and we merge the code to master only after the whole feature
    is developed and tested, we are postponing the merge activity until the end. Problem
    is that once we try to merge a large piece of code to master, it might mean resolving
    too many merge conflicts and retesting larger pieces of code. An approach that
    can help us manage this, is to keep a single branch in which we keep on merging
    even if the feature is incomplete. We need to make sure the half-built feature
    code is behind some kind of flag mechanism, so that it does not get executed unless
    the feature is complete.


    The following diagram showcases single branch branching strategy:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_113_1.png)


    Both the approaches have their pros and cons. A feature branching-based approach
    helps us make sure we are adding the code to a production branch, when it is in
    a satisfactory state, and there is no unused code in master. On the other hand,
    a single branch strategy is more in sync with CI approach, as we

