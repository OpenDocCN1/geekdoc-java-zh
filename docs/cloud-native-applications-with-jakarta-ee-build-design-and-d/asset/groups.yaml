    ## Azure Monitor


    Similar to AWS CloudWatch, Azure provides a monitoring service called Azure Monitor.
    Azure Monitor is a set of services that help development teams gather telemetry
    and perform relevant analyses. Data can be captured by Azure Monitor in the form
    of logs and metrics. Logs are timestamped data that showcases changes in resources.
    It is helpful to track any changes happening on the resources. Metrics, on the
    other hand, help in tracking a specific aspect of a period of time, like CPU usage:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_171_0.png)


