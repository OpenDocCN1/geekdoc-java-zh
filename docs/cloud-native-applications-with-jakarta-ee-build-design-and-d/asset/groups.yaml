    The preceding screenshot helps us understand that everything related to the application,
    from hardware to user data, is the responsibility of the application team, in
    case of traditional approach. We will take another look at this picture, as we
    move on to different categories of cloud services.


    From the screenshot, it looks like a lot of work to manage the application in
    a traditional manner, isn''t it? Now, let''s take a look at various service categorizations
    and understand how they help reduce our work.


    # Infrastructure as a Service'
  - '[PAGE 28]


    IaaS or Infrastructure as a Service is a set of services provided by the cloud
    with bare minimum hardware needs. For example, you can get a virtual machine with
    required hardware requirements, on which you can deploy, and manage OS and software
    as per your needs.


    Let''s revisit the aspects we saw in the preceding figure 1.2:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_28_0.png)


    Figure 1.3: Infrastructure as a Service


    As you can see in the preceding screenshot, when a user is opting for an IaaS
    service, the hardware resources and networking needs are taken care of by cloud
    service providers and the user would be responsible for managing OS,'
  - '[PAGE 29]


    middleware, runtime, application, and data.


    # Platform as a Service


    The next level to IaaS is PaaS or Platform as a Service. While, in IaaS, mostly
    hardware-level requirements were being managed by the cloud service providers,
    in the case of PaaS, basic software and runtime are also provided by the service
    provider.


    The following screenshot revisits development aspects for PaaS:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_29_0.png)


    The preceding screenshot clearly shows that in the case of PaaS, all a user needs
    to take care of is is the application and related data. All the underlying'
  - '[PAGE 30]


    requirements are fulfilled by the cloud service provider, like managing OS, middleware,
    and Runtime environments. Amazon’s Elastic Beananstalk is one good example of
    Platform as a Service, where users can just upload the application, and AWS takes
    care of capacity provisioning, Load Balancing, scaling, and application health
    monitoring. Another similar example is Microsoft Azure Service Fabric, where one
    can directly deploy the application code on the cloud, without worrying about
    the infrastructure underneath.


    # Software as a Service


    Software as a Service, or SaaS, means that you are provided with software to use,
    without worrying about the underlying complexity of implementing, hardware, OS,
    application, or data. You don’t own any code or data; all you need to log into
    an SaaS service online and use it. In simple words—Login and Use. Think of an
    email service provider like Gmail – you need to worry about how things are working
    behind the scenes? How security, performance, and scalability is being managed?
    No. All you need to do is open the website, log into the service, and use it.


    The following screenshot shows the development aspects for SaaS:'
- md: '

    ![](img/0ba5078687d28877e27a5bc212dacbeb_31_0.png)


    Figure 1.5: Software as a Service


    The preceding screenshot very clearly highlights that all the infrastructure and
    software needs are being taken care of the cloud. Any service provided, where
    the end-user need not worry about implementation details, and do not own or support
    the service or data, will fall under this category. One example that we have already
    discussed is of Gmail; similarly, services like Google Docs, Microsoft Office
    365, and so on, are examples of SaaS.


    ## Functions as a Service


    A more recent addition to the cloud-based services is Function as a Service, or
    FaaS. While Software as a Service, one would provide complete software to end-user
    off the shelf, Function as a service would mean deploying the smallest unit in
    the code, that is, a function independently on the cloud. A function here can
    represent a small REST API based microservice, an independent batch call that
    runs periodically, a piece of code that needs to be executed whenever a new resource
    or file is uploaded, or any similar unit of small code that can be executed independently.


    The following screenshot shows FaaS aspects:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_32_0.png)


    Figure 1.6: Functions as a Service


    The preceding screenshot showcases that the only thing that is managed by the
    user in the case of FaaS is the function. The user will provide the function executable
    to the cloud and get it deployed. All leading cloud service providers have solutions
    available as FaaS; for example, Amazon provides Lambda, Microsoft provides Function
    App, Google provides Google Functions, and so on.


    ## Major services provided by cloud


    In this section, we will discuss at a high level, what all major services are
    provided by the Cloud providers. Different cloud service providers like Amazon,
    Microsoft, and Google provide a large stack of services. We will look into some
    of the major cloud service providers in Chapter 3. Here, we will focus on some
    of the core services provided on the cloud, which are most common across the major
    players.


    Before getting into the services provided by the cloud, let''s think about what
    all basic services you need when you are developing and deploying a simple online
    application. At a minimum, you would at least need an environment to deploy and
    run your application, you will need a database in most of the cases, and a file
    storage system to store any static contents. End users will access your application
    mostly over the internet.


    The following screenshot shows high level design for a simple application:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_33_0.png)


    Figure 1.7: High-level design for a simple application


    When we start thinking in terms of the cloud, we can think of application being
    deployed on a compute service, with static content being stored on a storage service,
    and data being stored in a database service provided by Cloud service provider.
    All the major cloud service providers provide multiple solutions in terms of the
    compute, storage, and database services. But the service stack goes much beyond
    these basic services.


    Let''s take a look at some of the basic service categories provided on Cloud platforms.


    ## Compute


    Compute is probably the most important set of services provided by any cloud service
    provider. In simple words, this service provides resources for your application
    to execute. The most basic form of the compute resource is virtual machines or
    VMs. This is more of a remote machine that you can acquire from a cloud service
    provider to deploy your application. The cloud service provider will generally
    give you options for selecting hardware configuration for the virtual machine,
    operating system you need, and other security and access-based configurations.


    Another important set of the compute services is in the form of Platform as a
    Service, where the cloud service provider would let you bring your application
    and deploy it on the cloud; for example, Amazon''s Elastic Beanstalk or Azure''s
    Service Fabric Cluster. In addition to these, we have deployment available in
    the form of AWS Lambda or Azure Functions or Google Cloud Functions.


    Apart from the options given here, we have Batch compute services, where users
    can provide batch jobs that can be executed in a parallel manner. Container-based
    compute services have also gained a lot of popularity, as it is easier to develop
    and deploy containers than full-fledged server. We will get into details of container
    services and how they are used in Chapter 10.


    ## Storage


    After compute, storage is another important factor in any software. You need to
    store your code, executables, files, images, data, etc. All cloud service providers
    will give you multiple flavors of storage services. AWS S3 is one popular storage
    service that can store the data in the form of objects. Similarly, Azure provides
    storage features to store data in the form of Blobs, files, queue, or tables.


    In all storage, service options are provided for encryption and replication. As
    we discussed earlier in this chapter, data in Cloud is stored in terms of data
    centers, availability zones, and regions; we can replicate data based on its criticality.
    For example, data that can be computed again will not be as critical as that which
    belongs to the client. For critical data, you might want a multi-regional replication
    strategy. Another important classification for stored data is how frequently it
    will be used; based on that, one would need to formulate an access strategy.


    ## Database


    A discussion about software development is incomplete without mentioning a database,
    which is used to store and manage data used in the software application. There
    are multiple types of databases available, broadly categorized under two main
    categories, SQL (or RDBMS) and NoSQL Based. Oracle, MS-SQL, MySQL, Postgres are
    some of the well-known providers for RDBMS based databases. NoSQL databases can
    further be categorized into key-value based (Redis and Riak), document-based (MongoDB
    and CouchDB), column-based (Cassandra and Vertica), or graph-based (Neo4j and
    OrientDB).


    All the cloud service providers have good options for database-related services
    and support all major databases. For example, AWS has the RDS or Relational Database
    Service to provide RDBMS based solutions, and DynamoDB to provide NoSQL database-related
    solutions. Similarly, Azure provides options like Azure SQL and Azure Cosmos DB
    services to manage data.


    ## Networking


    Another important of services worth mentioning here is networking. There will
    be times when you will need to group resources under a virtual network, which
    can be done easily by creating a virtual network on the cloud. Then, there are
    services provided for communication among resources and networks like application
    gateways and network security groups. Load balancers can be used to manage and
    distribute the load. Firewall services help secure the resources from unwanted
    access.


    ## Security


    When the cloud-based application deployment gained popularity, one major concern
    that most of the organizations had was about security. Questions were raised about
    how to trust environments that are shared in nature, and over which, one does
    not have complete control. Hence you will find a lot of services that have security
    features inbuilt by most of the cloud service providers. For example, one can
    enable encryption on any data or storage account just by setting a flag. There
    are services to manage your keys and certificates. Monitoring services to keep
    a check on who is accessing resources and provision for role-based access, where
    you can control operations that can be performed on resources and data.


    ## Resource and cost management


    Once you start using the cloud, you will realize that the resources and cost is
    a major task. You have tens of resources scattered around; you will need ways
    to monitor and manage them. For example, you have a virtual machine with an application
    deployed, but hardly 50% of the resources are being used; it will be better to
    switch to a lower server. If you triggered a new server for conducting a test,
    but forgot to turn it off, you will end up paying for it till you notice your
    mistake. To avoid unpleasant experiences and optimizing our usage, cloud service
    providers help us with many services that can monitor our usage and cost.


    For example, AWS provides us with Cloud Watch and Cloud Trail services to keep
    a watch on resources and access. Trusted Advisor service helps you optimize the
    usage of resources and reduce cost. Similarly, Azure provides Azure insights,
    one of the services to manage the resources.


    ## Additional noteworthy services


    Cloud is very vast and with many service service providers; we have hundreds of
    off-the-shelf services available. Some of the services are unique to vendors and
    some are common.


    Machine learning is an area that has gained a lot of attention in the last few
    years, and all cloud service providers have a good set of services in this area.
    For example, Amazon''s Sagemaker helps build, train, and deploy machine learning
    models; Deep is deep-learning enabled video camera which can run Sagemaker models.
    Azure provides the machine learning studio for machine learning models. There
    are many more services related to voice, text, image recognition areas provided
    by the cloud service providers.


    Another area has gained a lot of popularity in the last couple of years is IoT
    or Internet of Things, for which we can use off the shelf services to register,
    process, and manage the events and data.


    A complete discussion of all the services provided by all cloud vendors is out
