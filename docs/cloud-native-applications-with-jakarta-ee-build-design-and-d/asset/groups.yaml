    \n## 结构\n\n- 扩展性简介\n- 云扩展性\n- 扩展性设计\n- 可扩展应用程序的示例实现\n\n## 目标\n\n在本章中，我们将讨论如何扩展应用程序。采用云原生应用程序的主要优势之一是它们良好的扩展性；但要让应用程序具有可扩展性，我们需要确保它们的构建和设计是易于扩展的。我们将调查云提供的功能，这些功能可以帮助我们实现应用扩展。最后，我们将通过代码示例查看云端扩展性的操作。\n\
