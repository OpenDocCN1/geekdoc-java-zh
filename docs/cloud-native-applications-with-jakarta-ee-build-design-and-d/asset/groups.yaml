    \ Calendar.FEBRUARY, 11).getTime();\n    EmployeeUtility employeeUtility = new\
    \ EmployeeUtility();\n    employeeUtility.calculateAge(dateOfBirth);\n}\n```\n\
    \n这里我们从一个计算年龄的简单行方法开始。在编写测试用例时，我们发现它没有处理所有情况，例如我们需要定义员工的最小和最大年龄，这再次迫使我们修改代码。因此，单元测试用例不仅帮助我们测试代码，还确保我们处理了生产场景中可能出现的边界情况。经常出现的问题是：单元测试做到什么足够？基本的想法是确保所有预期场景都由单元处理。另一个衡量指标是代码覆盖率。我们将在章的最后部分简要讨论代码覆盖率。\n\
    \n# 模拟依赖（Mocking）：\n\n模拟是编写单元测试用例的一个重要方面，因为有时我们尝试测试的单元依赖于不属于该单元的其他代码。来看一个简单的示例。在我们的员工服务中，假设我们有一个获取员工工资的函数，它是由另一个名为\
    \ `EmployeeFinanceService` 的服务提供的：\n\n```java\npublic class EmployeeService {\n\
    \    EmployeeFinanceService employeeFinanceService;\n    public EmployeeService(EmployeeFinanceService\
    \ employeeFinanceService) {\n        this.employeeFinanceService = employeeFinanceService;\n\
    \    }\n\n    public int getEmployeeSalary(String employeeId) {\n        int salary\
    \ =\n        employeeFinanceService.getEmployeeSalary(employeeId);\n        return\
    \ salary;\n    }\n}\n```\n\nEmployeeFinanceService 是一个黑盒服务，我们不知道它是如何实现的。对于测试 EmployeeService，我们的目标是只测试本身和\
    \ EmployeeFinanceService。我们可以模拟 EmployeeFinanceService 并继续测试。有很多框架可以实现这一点，Mockito\
    \ 是我们在示例中使用的流行框架之一：\n\n```java\n@RunWith(MockitoJUnitRunner.class)\npublic class\
    \ EmployeeServiceTest {\n    @Test\n    public void testGetSalary() {\n      \
    \  EmployeeFinanceService employeeFinanceService =\n        Mockito.mock(EmployeeFinanceService.class);\n\
    \        int retSalary = 200000;\n        when(employeeFinanceService.getEmployeeSalary(\"\
    1\")).thenReturn(20);\n        EmployeeService employeeService = new\n       \
    \ EmployeeService(employeeFinanceService);\n        int salary = employeeService.getEmployeeSalary(\"\
    1\");\n    }\n}\n```\n"
