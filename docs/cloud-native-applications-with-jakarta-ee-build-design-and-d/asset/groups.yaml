  - '[PAGE 203]


    provision hardware on the cloud and pay for it? What if we can have a mechanism
    where we only pay for the compute power we used? Functions as a Service is the
    answer to all our worries.


    When are using a SaaS approach, the cloud service provider gives you a flexibility,
    so that all you need to do is bring your code and upload it to the FaaS service.
    We are not really worried about the underlying infrastructure or even application
    servers.


    Let’s take a look at some of the advantages and disadvantages of the FaaS approach,
    and then we will create an example to help us get a feel of the Functions as a
    Service.


    # Advantages of FaaS


    +   - **Cost**: The first advantage you get when going for Functions implementation
    is low cost. Usually, you are only paying for resources that you are using, as
    there is no need for provisioning infrastructure beforehand.


    +   - **Scalability**: You get scalability off the shelf when you are going for
    functions based implementation. Your cloud service provider will automatically
    help your functions scale up or down on a need basis.


    +   - **Ease of development**: Since now your team can focus completely on core
    feature development without worrying about deployment or scalability needs, you
    have more time to focus on real business problems.


    # Disadvantages of FaaS


    +   - **Vendor Lock-in**: This can be one major problem, as most cloud service
    providers will want you to write a wrapper code specific to their FaaS service.
    So, it is not easy to take your code from one service provider to another and
    redeploy the code.


    +   - **Cold Starts**: As the cloud service provider is now managing the scalability
    of the functions, there might be a scenario when a request coming has to wait
    for function instance, as you are not pre-provisioning the infrastructure.


    # AWS Lambda Example'
