    最后，一旦代码通过部署签署，我们将其部署到生产环境，并执行一系列最终检查，例如监控日志以确认部署是否成功。随后，将向所有利益相关者发送一封最终部署成功的邮件：


    ![](img/0ba5078687d28877e27a5bc212dacbeb_121_0.png)


    图 6.6: 持续交付流


    如果在部署流水线的任何阶段观察到问题，我们将停止流水线或回滚更改。


    在继续进行之前，我们应该指出，CD 通常代表持续交付（Continuous Delivery），但有时也可以指持续部署（Continuous Deployment）。这两个概念之间的区别虽然很小，但意义重大。让我们来理解这种区别。


    # 持续交付与持续部署


    当我们想要在代码中实现 CI 和 CD 流水线时：


    ![](img/0ba5078687d28877e27a5bc212dacbeb_122_0.png)


    ![](img/0ba5078687d28877e27a5bc212dacbeb_122_1.png)


    图 6.7: 持续交付与持续部署


    之前的截图向我们展示了一个微但重要的区别。持续部署是一个完全自动化的过程。任何提交到主分支或生产分支的更改都将在没有任何人工干预的情况下部署。这听起来很不错，但在重要的项目中可能是不理想的，因为你希望以某种受控的方式管理部署过程。CD
    确保我们保持代码处于可部署状态，但实际部署仅在管理员故意触发时才会发生。


    # 为什么要使用持续交付？


    那么，我们尝试通过持续交付实现什么目标？让我们逐点地回答这个问题：


    - **更快的生产环境部署**：在当今这个快节奏的世界里，每个人都在努力竞争以给终端用户留下深刻。在这样的竞争中，快速向客户交付并获取反馈非常重要。CI 和
    CD 流水线的核心目标是确保更改在准备就绪后能够以流畅且无错误的方式交付给客户。

    - **低风险**：由于我们频繁地交付，因此每次交付的块较小。与一次性推出重大更改相比，出现问题的范围也更小。

    - **自动化交付**：通过自动化交付，我们正在摆脱许多手动任务并节省了工时。这些时间现在可以用于专注于创建核心交付产物。自动化交付还消除了人为错误的发生范围。

    - **受控交付**：由于交付过程变得更简单且自动化，我们可以以受控的方式进行交付。例如，我们不会一次性向所有客户推出所有更改。我们可以以受控的方式配置发布，例如，以蓝绿部署的方式进行部署。在这种情况下，我们将一组客户迁移到新部署中。一旦发现结果满意，我们将把其余客户迁移到新的实现中。


    # 持续交付面临的挑战


    尽管持续交付帮助我们解决了很多问题，但在选择这条路线时，我们仍然需要谨慎。意识到随持续交付方法而来的挑战是有意义的：


    - **文化转变**：转向基于 CI/CD 的部署时面临的最重要挑战，是鼓励开发者以一种方式思考，即我们频繁地向生产环境交付。特别是对于习惯于瀑布模型模型的开发者来说，那种模型是完成一个大块、进行测试，然后在六个月或一年后将整个部分部署到生产环境；一个关于每周或每天向生产环境交付的交付模型在心态上是一个巨大的转变。

    - **更小的发布和功能**：持续交付面临的另一个关键挑战是如何规划更大的功能。我们谈论的是频繁交付，那么如何容纳更大的功能呢？答案是尽可能将功能拆分成较小的块，并以增量块的形式交付功能。

    - **测试至关重要**：由于我们频繁交付，我们需要确保不会破坏任何现有功能。我们能做出的最糟糕的事情就是通过新交付破坏了之前对客户来说运行良好的功能。因此，我们需要建立强大的测试策略，并准备好自动化测试用例。

    - **回滚策略**：无论我们多么小心，事情仍然可能出现问题。我们需要确保自己已为这种情况做好了准备。我们需要建立回滚策略，以便能够快速切换回对客户稳定且运行良好的版本。


    # 持续交付示例


    在上一个示例中，当我们创建 CI 流水线时，我们采用了脚本化流水线的方法。在生产场景中，正确的方法是使用脚本，因为这为你提供了完全的控制和灵活性。


    Jenkins 还为我们创建项目提供了配置设置。我们将在第一个示例中查看 Maven 项目并将其部署到 Wildfly 服务器上。该示例从 GitHub 项目获取代码，使用
    Maven 构建打包 war 文件，并将其部署到应用程序服务器。


    Maven 项目示例：


    让我们在 Jenkins 中为 Maven 创建项目。如果你已安装 Maven 插件（**Manage Jenkins | Manage Plugins |
    Install Maven**），当你使用 Jenkins 菜单中的 **New Item** 选项时，你将看到 Maven 项目选项：


    ![](img/0ba5078687d28877e27a5bc212dacbeb_124_0.png)


    图 6.8: Jenkins 界面 - Maven 项目


    选择 Maven 项目后，你将看到提供源代码详细信息的选项。在示例中，我们将提供 Git URL 以及任何所需的访问仓库的凭据：


    ![](img/0ba5078687d28877e27a5bc212dacbeb_125_0.png)


    图 6.9: Jenkins 界面 - Git 设置


    接下来，你将看到构建选项，由于我们使用 Maven，我们将默认的 pom.xml 作为 Root POM，对于 Goals，我们可以根据需要提供 Maven
    目标，如 Clean、Install、Package。


    在 Post Steps（后续步骤）中，我们将提供要部署的服务器详细信息。Jenkins 提供了为流行的服务器（如 Tomcat、Wildfly 等）添加插件的。对于本示例，我们为
    Wildfly 应用程序服务器添加了插件并从中选择了它：


    ![](img/0ba5078687d28877e27a5bc212dacbeb_125_1.png)


    图 6.10: Jenkins 界面 - 构建与后续步骤


    一旦选择了应用程序服务器（在本例中为 Wildfly），我们需要提供如要部署的 War 文件、URL 和凭据，这些信息将用于部署 war 文件等。一旦提供了所有详细信息，Jenkins
    将使用这些信息将生成的 war 文件部署到服务器上：


    ![](img/0ba5078687d28877e27a5bc212dacbeb_126_0.png)


    图 6.11: Jenkins 界面 - 设置应用程序服务器


