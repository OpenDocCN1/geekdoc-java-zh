    which can have multi-fold issues. Firstly, a change in a configuration value will
    mean that the application needs to be built and deployed again. Secondly, a developer
    can make a mistake and update the incorrect configuration values. To avoid these
    issues, it is strongly recommended that your code should never have any configurations
    provided, and they should be managed at the environment level.


    # Factor 4 – Backing services


    Treat backing services as attached resources


    This principle for building a 12-factor app suggests that all the backing services
    should be treated as resources. The backing services can refer to external services
    like database, storage, message queues, and so on. The idea here is to consider
    these backing services as externalized resources that can be configured easily.
    For example, if our application used a Queueing system and we move from rabbitMQ
    to ActiveMQ, this should be achievable by just updating the configuration.


    # Factor 5 – Build, release, run


    Strictly separate build and run stages


    The idea here is to break the deployment into clearly defined stages of build,
    release, and run. A build stage will generally result in a jar, war, or an ear
    file which can then be deployed on any environment. We already highlighted the
    separation of environment variables, which constitutes the release phase, where
    we take a specific build and combine with configuration needed for the environment.
    Finally, the release is run; for example, during the run phase, a Docker image
    is deployed to a container on a specific environment.


    # Factor 6 – Processes


    Execute the app as one or more stateless processes


    If you are going to build an application or service that needs to be scalable
    or deployed in a cluster, we need to make sure your application can be looked
    at as a stateless process. Imagine how painful it can be sharing state across
