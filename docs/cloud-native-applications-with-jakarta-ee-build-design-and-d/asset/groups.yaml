    # # Cloud-based monitoring, alerting, and reporting


    Cloud service providers very well understand the importance of monitoring, alerting,
    and reporting needs for an application. There are many off-the-shelf tools provided
    by major service providers, which help development teams to keep a watch on what
    is happening with their application. There are reports provided for how the resource
    is being used and billed for our applications deployed on the cloud.


    But like other things, a cloud service provider can only provide the development
    teams with the services and tools. At the end of the day, it is the responsibility
    of the development team to make sure they are using correct tools, configuring
    them properly, and reporting to alerts.


    In this section, we will take a look at the off-the-shelf tools available from
    popular cloud service providers to get an idea of capabilities available for exploration.


    # # Amazon CloudWatch


    Amazon CloudWatch is a one-stop service provided by AWS for all major monitoring
    needs. Here, you can monitor the usage and health of Amazon resources that your
    application is using:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_168_0.png)'
  - '[PAGE 169]


    # Figure 9.1: Amazon CloudWatch architecture


    Image source:


    https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudw


    The preceding screenshots explain the design as to how AWS CloudWatch works. A
    resource in AWS publishes data to CloudWatch in the form of metrics. A Metric
    is a structure that contains time-ordered data for various aspects of resources,
    like CPU usage or Memory usage.


    One can set alarms on top of the CloudWatch, which will alert the team in case
    of certain events, for example, if the CPU usage goes beyond 75%. Based on the
    alarm, we will configure an action, such as sending an email notification to admins
    or autoscale the application by adding an additional server to reduce CPU usage.
    In using out-of-the-box available data, one can also publish additional application
    data to CloudWatch for monitoring.


    In addition to alerting, CloudWatch is capable of showing the data in the form
    of graphs and bars. We can create useful dashboards or reports and share them
    with team members for monitoring and observation.


    # Step-by-step example of CloudWatch


    We have looked at what CloudWatch can do for you; let''s set up monitoring for
    an EC2 instance in this section. For EC2, AWS provides a basic CloudWatch configuration,
    which registers every 5 minutes and is enabled by default. If one needs additional
    information, like registering data every minute, one can choose advanced monitoring,
    but this will come at a small price.


    Let''s go to our EC2 dashboard and enable CloudWatch for an existing instance:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_169_0.png)


