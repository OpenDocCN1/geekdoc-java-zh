    ## 其他服务


    Amazon 作为云服务提供商的市场领导者，除了我们目前提到的服务外，还有许多额外服务。在本章中无法介绍所有服务，因此我们将介绍其中一些重要的服务。


    Amazon 提供了一系列用于网络的服务，例如 Amazon VPC（虚拟私有云），它通过帮助我们管理安全和访问规则，在虚拟网络中管理资源。其他帮助网络需求的服务还包括帮助搭建内容分发网络的
    Cloud Front、用于管理域名的 Route 53、用于从本地网络到 AWS 建立专用网络的 Direct Connect，以及用于管理和分发传入流量的弹性负载均衡（ELB）。


    另一组服务是安全相关的服务，其中我们有 AWS 身份和访问管理（IAM）来管理用户、组和角色，用于调查潜在安全问题的 Amazon Detective，用于管理和部署
    SSL 证书的 Certificate Manager，用于管理加密密钥的密钥管理服务（KMS），用于管理应用安全的 Amazon Inspector，以及用于免受
    DDoS 攻击的 Amazon Shield。


    监控是任何应用的另一个重要方面。Amazon 提供了一系列用于监控和管理应用的服务，包括用于监控资源和应用的 Amazon CloudWatch、用于跟踪用户活动和使用情况的
    CloudTrail，以及用于获取基础设施代码（换句话说，用于设置资源的模板）的 Cloud Formation。


    Amazon 在许多其他类别也提供一系列服务，例如对于机器学习，它有用于构建、训练和部署机器学习模型的 SageMaker，用于支持视频深度学习的 DeepLens，用于语音和文本机器人的
    Lex 等。对于 IoT 或物联网，它有帮助将设备连接到云端的 IoT core、用于事件检测的 IoT events、用于分析的 IoT analytics
    等。对于区块链，它提供了 Amazon Managed Blockchain 和量子账本数据库（QLDB）。


    鼓励读者进一步访问 https://aws.amazon.com 了解更多关于 AWS 云服务的信息。


