    # 总结


    在本章中，我们研究了云计算的基础。我们理解了如何从一个硬件和软件管理是开发团队责任的世界，转变为云端部署——在云端中，你可以根据需求获取现成的核心基础设施。


    我们学习了什么是云计算。了解云如何提供各种类型的服务，并按照 IAAS、PAAS、SAAS 和 FAAS 进行分类。在 IAAS 中，我们获得的是基础设施服务（Infrastructure
    as a Service），这意味着获得了基础基础设施。PAAS 或平台服务（Platform as a Service）处理平台需求，用户只需要部署可执行文件。软件服务（Software
    as a Service）更进一步层，在云端提供软件系统，你只需要登录并使用该服务即可。最后，我们讨论了 FAAS，函数服务（Functions as a
    Service），这是一项较新的服务，你只需要以函数的形式提供代码，并将其部署在云端。


    最后，我们查看了云服务商提供的各种核心服务。我们研究了计算服务，它为我们提供了部署应用程序的云基础设施。我们研究了存储服务以帮助存储和管理数据。我们讨论了数据库服务，它是任何软件的骨干。除了这些，我们还讨论了网络、资源管理、成本管理、安全和扩展性方面的服务。


    总的来说，在本章中，我们对云计算有了 30000 英的高视角。在下一章中，我们将研究如何设计云端系统，以及它与传统的软件设计思维方式有何不同。


    # 问题


    - 1. 请解释按需付费（Pay as you Go）模型？

    - 2. 什么是数据中心、可用区（availability zone）和区域（region）？

    - 3. 什么是基础设施即服务（IaaS）？它与软件即服务（aaS）有什么区别？

    - 4. 讨论云提供的任何三个服务？


    # 第 2 章


    # 云端设计


    在深入研究云端应用开发之前，理解为云设计或构建一个应用程序与旧的非云时代方法的区别是非常重要的。如果你总是想设计你正要开发的系统，那么本书在进入下一步讨论代码和开发之前，涵盖云端应用的设计方面是显而易见的。


    在上一章中，我们讨论了云如何通过引入可以直接用于部署和管理应用程序的现成服务来改善开发人员的生活。云的另一个重要但经常被忽视的影响是，随着云服务的可用性，开发者和架构师有了更多自由去思考那些本质上很复杂的系统，而这些系统在几十年前是很难想象的。


    # 结构


    我们将在本章涵盖以下主题：


    - 云原生对比传统模式开发

    - 云端需要考虑的设计因素

    - 常见错误


    # 目标


    正如俗所说，能力越大，责任越大；随着所有服务变得触手可及，也带来了选择错误服务的风险、无法以优化方式利用云的能力，从而在成本和精力方面产生影响。在本章中，我们将学习在为云端设计时需要注意的一些基本考虑。我们将学习云原生应用与传统的单体应用在设计上有何不同，并讨论团队在转向云端开发和部署时观察到的常见错误。


    # 云原生对比传统模式开发


    在尝试深入研究云原生应用设计之前，让我们尝试理解“云原生”（cloud native）这一术语的含义。根据云原生计算基金会（CNCF）提供的定义：


    > “云原生技术使组织能够在现代动态环境（如公有云、私有云和混合云）构建并运行可扩展应用程序。容器、服务网、微服务、不可变基础设施和声明式 API 是这种方法的体现。”


    简而言之，云原生意味着一种准备利用云基础设施的设计。随着云的普及，出现了许多流行术语：云优先（cloud-first）、基于云（cloud-based）、云就绪（cloud-ready），当然还有云原生（cloud-native）。核心思想是创建一个可以帮助我们开发复杂应用的设计，同时兼顾其扩展性、安全性、性能、维护、成本效益、故障处理、开发易用性以及项目需求。


    当我们从传统的部署方式转向云端部署时，我们拥有许多优势。第一个优势当然是，现在不需要担心硬件需求了。你可以轻松地进行实验和测试，而无需过多担心硬件成本，因为你可以租服务并只为使用的部分付费。但更重要的方面是云为扩展性、可用性、安全性、访问管理、网络、连接等等提供的内置服务。通过对这些方面的控制，软件架构师和开发者有了充分的自由去思考和开发复杂系统。


    这种自由的一个主要结果是，我们能够尝试更好的设计，帮助我们以易于维护和扩展的方式开发应用程序。我们将应用程序拆分为服务，然后进一步拆分为微服务。微服务是应用程序的最小单元，可以独立开发和部署。这有助于我们保持应用程序的松耦合，某个组件或服务可以被轻松更新或替换，而不会干扰其他服务。


    # 从单体到微服务


    你会发现许多旧的应用程序仍然遵循单体（monolithic）设计架构。在单体设计中，应用程序被视为一个单一的不可分割的部署单元。这种设计存在许多固有问题，例如所有功能都写在一个地方，导致代码不可读。为了解决这个问题，开发者和架构师开始将功能拆分为服务，这有助于更好地管理代码。随着云的普及，将整个功能拆分为更小的微服务已成为可能。


    让我们看看这些的每一个阶段，并理解微服务如何解决以前存在的问题。


    # 单体


    如果你在软件工程领域工作了几年，或者处理过遗留系统，你一定熟悉单体架构，即整个应用程序被构建为一个单一的代码单元。它作为一个单一单元构建和部署。事实上，如果你处理的是一个简单的一个或两个页面的应用程序，这并不是一个坏的设计。但随着应用程序变得复杂并开始涉及多个功能，单体架构将引入大量的复杂性，并在某一点，微小的更改在开发和测试方面将变得非常昂贵。


    下图展示了单体应用程序部署的设计样式：


    ![](img/0ba5078687d28877e27a5bc212dacbeb_42_0.png)


    图 2.1：单体设计


    上述设计看起来简单，但具有许多复杂性。这种设计面临的一些挑战如下：


    - **代码库大小**：由于我们处理的是单一代码库，我们在单一代码库中有成百上千个文件。这首先影响了代码的可读性，即使是进行微小的更改，你也需要理解整个代码库。每当代码更改时，都不必要重新构建和部署整个代码库。

    - **测试**：由于代码库都在一个地方并且需要一起构建，一个微小的更改意味着我们需要测试整个应用程序，以确保没有集成或回归问题。

    - **扩展性**：我们在单体设计中面临的另一个挑战是应用程序的扩展性。唯一的方法是整体扩展应用程序。例如，如果一个电子商务门户是以单体方式开发的，当我们看到大量的搜索请求时，我们不能只扩展搜索服务，我们需要扩展整个

