  mdcn: "\n\n# 一个可扩展应用程序的示例实现\n\n别说话了！是时候大起干戈，看看扩展性的实际操作了。让我们创建一个简单的“Hello World”微服务，我们将在云端对它进行扩展。\n\
    \n```java\n@Path(\"/hello\")\npublic class HelloWorldService {\n    @GET\n   \
    \ public String HelloWorld() {\n        String address = \" IP Address\";\n  \
    \      try {\n            InetAddress inetAddress = InetAddress.getLocalHost();\n\
    \            address = inetAddress.getHostAddress().toString();\n        } catch\
    \ (UnknownHostException e) {\n            e.printStackTrace();\n        }\n  \
    \      return \"Hello World from \" + address + \" !\";\n    }\n}\n```\n\n前面的代码展示了一个非常简单的微服务，它会打印“Hello\
    \ World!”消息以及相应的的 IP 地址。我们在这里使用了最简单的代码，因为这次练习的目的是展示扩展性。首先，我们将把代码部署到云服务提供商的虚拟机上。为了这个示例起见，我们将使用\
    \ Amazon Web Service（简称 AWS）。\n\n你可以启动你选择的机器，选择一个操作系统并部署代码。你可以选择手动创建环境，或者使用 Cloud\
    \ Formation 模板来自动化该过程。自动化将帮助你从代码层面提升应用，这有助于运行期间的扩展性。为了这个示例起见，我们将使用基于镜像的复制（Image\
    \ based replication），我们将在几分钟后看到它。\n\n一旦部署在机器上，你可以访问应用程序的 URL 并看到如下消息：\n\nhttp://ec2.path.url:8080/HelloWorld/rest/hello\n\
    \n它应该返回以下消息：“Hello World From <<IP ADDRESS>>”\n\n正如我所说，一旦我们在机器上部署了应用程序，就可以轻松地创建该虚拟机的副本并开始使用。要创建\
    \ AWS 的副本，我们只需要遵循几个步骤。\n\nAmazon 为我们提供了 AMI（即 Amazon Machine Image，Amazon 镜像）；正如其名，它将创建一个机器的镜像，可以根据该镜像创建额外的实例。这种技术对于备份和恢复机制非常有用；例如，如果你的应用程序服务器停止响应，但你留有该实例的\
    \ AMI，你可以在几分钟内恢复你的应用程序。\n\n创建 AMI 非常简单，只需右键点击你想要创建镜像的实例，并选择“Create”（创建）选项：\n\n\
    | 名称 | 实例 ID | 实例类型 | 可用性区域 | 实例状态 | 状态检查 |\n|---|---|---|---|---|--|\n| I-02fb94e2138bc07d\
    \ | Connect | | | running | 2/2 check |\n| I-0badb90d3954ad | Get Windows Password\
    \ | | | running | 2/2 check |\n| I-0d3e4a4d078 | Create Template From Image |\
    \ | | terminated | |\n| | Launch More Like This | | | | |\n| | Instance Settings\
    \ | | | | |\n| | Image | | | | |\n| 实例: I-02fb94e2138bc07fd | Public DNS | Networking\
    \ | | Create Image | | |\n| | CloudWatch Monitoring | | | Bundle Instance (instance\
    \ store AMI) | | |\n\n图 8.7: AWS 创建实例镜像\n\n一旦你创建了镜像，你将在镜像（images）部分看到它。如果创建镜像只需点击一个按钮选项，那么启动副本实例也同样简单。你首先点击“Launch\
    \ Instance”（启动实例）选项，并选择一个与创建新机器时相似的配置：\n\n![](img/0ba5078687d28877e27a5bc212dacbeb_160_0.png)\n\
    \n你需要确保为机器尺寸、磁盘大小、安全组、密钥对等选择了正确的选项。一旦新实例启动，你就可以像使用主实例一样使用它。\n\n但创建额外的实例本身并不能解决任何问题，我们需要确保已经部署了负载均衡器，它可以将负载均匀地引导到这些实例上。\n\
    \n创建一个经典负载均衡器（classic load balancer）需要创建一个负载均衡器，为它分配一个客户端使用的公网 IP 地址，将机器添加到负载均衡集群中以便负载均匀分布，并确保配备了健康检查机制，以确保负载均衡器了解服务器的健康状况：\n\
    \n![](img/0ba5078687d28877e27a5bc212dacbeb_160_1.png)\n\n你可以为这个示例选择经典负载均衡器。它会询问你详细信息，例如负载均衡器名称以及你想创建的规则。例如，在这种情况下，我希望负载均衡器监听\
    \ 80 端口，但目标端口是部署应用程序的 8080 端口：\n\n## 第 1 步：定义负载均衡器\n\n### 基本配置\n这些都是通过设置一个新的负载均衡器完成的。首先给你的负载均衡器一个唯一的名称，以便和你可能创建的其他负载均衡器区分开。你还需要为负载均衡器配置端口和协议。来自客户端的流量可以从任何负载均衡器端口路由到\
