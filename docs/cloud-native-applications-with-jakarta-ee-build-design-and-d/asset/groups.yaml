    \n# 总结\n\n在本章中，我们讨论了应用程序的安全性。我们从高层视角开始研究了安全的需求。我们讨论了基础设施安全以及如何实现。我们理解了虚拟网络以及它们如何帮助防止意外访问。我们还讨论了基础设施自动化以避免人为错误。我们研究了我们面临的一些常见威胁，如拒绝服务攻击，以及如何缓解这些威胁。我们讨论了\
