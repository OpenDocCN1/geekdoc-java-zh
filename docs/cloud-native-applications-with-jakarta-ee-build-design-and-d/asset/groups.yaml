    cause unnecessary downtime. Automated monitoring of service health can save embarrassing
    situations, as you will catch service downtimes and take actions before clients
    start reporting it.


    You must factor all the automation needed in the system at the time of design
    itself to avoid the unoptimized process later in the delivery state.


    ## Self-healing system


    We understand that a system with multiple microservices communicating each other
    can be complex in nature and is prone to some failure. We already talked about
    the design factor that one should embrace failure and handle that gracefully.
    Now the question is, what after the failure? Our systems should be designed in
    a manner that if a service stops responding, can it be restarted automatically
    based on some performance or application logs? Or can we design the system, so
    that if one instance of service stops responding, we bring up additional service
    instance and transfer load to that?


    We need to consider the questions at design time, like would happen once this
    service fails? Can this be fixed automatically with a restart? Can the situation
    be handled by distributing the load to another instance? Answering these questions
    will help us create a robust system, which can heal itself without manual intervention.


    ## Manage data


    An important aspect of any system is data and databases. While designing a complex
    system, which is going to deal with multiple microservices, it becomes more important
    to understand how the data will be managed? A golden rule for microservices is
    that each microservice manages its own data, but that might not be possible, as
    there will be some shared data. Also, some reporting services need to fetch data
    from multiple sources, so we need to take a call on how much division of data
    is possible without impacting overall performance.


    A good example of handling data complexities is with views. A view is a snapshot
    of data, which can be created from multiple data sources. This will be created
    after applying joins, and filters on data, and help us improve performance at
    runtime. But it does come with an overhead that one needs to take care of – factors
    like refreshing data in a timely manner to avoid servicing too stale a data.


    ## Cache whenever possible


    While we are at the topic of managing data for service, one technique that is
    being used successfully for years is caching. You might want to understand which
    data can be cached while you design the system. Consider questions like, should
    it be an internal cache managed by some library or external cache management like
    Redis cache? Another important question is, how to refresh cache, as you do not
    want to serve stale data, while backdated data is getting updated in the database.


    A good caching approach always helps in increasing the performance of the system.
    So, it makes sense to spend some time understanding which data can be cached and
    how.


    ## Go asynchronous


    Not everything you do in a system immediately impacts the end-user. For example,
    when creating or updating an account, we need to send an email to the end-user.
    But it is not directly impacting the system in terms of account creation or update.
    Such tasks that are not on the critical path for a request completion can be and
    should be handled in an asynchronous manner. Another set of such tasks is logging
    of the events. We can add such tasks to queues, which can later be picked up by
    services in an asynchronous manner and completed.


    ## Common mistakes


    When going for a cloud-based application design, it is easy to make some mistakes
    due to lack of knowledge or research. Let''s take a look at few common mistakes
    done by development teams when onboarding a cloud-based design.


    ## Unoptimized usages


    One of the most common mistakes faced, when using cloud-based infrastructure,
    is wasting the resources. Remember that the cloud resources are cheap, but they
    are not free. A lot of cases have been seen, where unused servers that used for
    testing or validating are kept active when they are not in use; high configuration
    machines are used where one could have used a cheaper low configuration machine;
    additional resources added, when increased load caused scale-up scripts to come
    into play are not freed when the load is normal. These are some of the very common
    reasons one ends up having unused capabilities that you still end up paying for.
    Most of the cloud service providers provide monitoring tools and suggestions to
    keep the billing low, but it is up to the development team to make sure resources
    are being used in an optimum manner.


    ## Lack of monitoring


    As we have seen with the cloud, it is easy to create smaller, focused, and reusable
    services. This flexibility also brings a problem with it, that now we need to
    monitor more components for their health and performance. You do not want to wait
    until some customer reports a report in the system. So, we need to make sure each
    component and service is logging health, performance, and application-related
    information properly. We will automate the process of monitoring logs so that
    proper actions can be taken when an error is figured out in the system.


    ## Design not optimized for cloud


    Another problem that is observed often is when teams move to the cloud, they still
    bring in the old practices for monolithic designs. For example, we create services
    that are monolithic in nature and to do too much on their own, making scaling
    of a part of functionality impossible. Or, we make our services stateful, which
    adds the additional burden of maintaining state on the service, bringing problems
    in the scalability of the service.


    ## Consider containers, serverless, and off the shelf


    When moving to the cloud, it makes sense to understand the full capabilities of
    cloud services. At times, developers realize at later stages of development that
    there could have been a better option for a solution they have implemented.


    With Cloud, it has become easier to use functions as a service, containers, database
    as a service and so on. Additionally, cloud service providers also have off-the-shelf
    tools to help develop and deploy applications like Amazon Cloud Beanstalk, Azure
    App Service, or Google App Engine. With all the information, you will be able
    to take an educated decision about the approach that is best for the service and
    application being built.


    ## Summary


    In this chapter, we started by acknowledging the fact that cloud-based development
    needs some additional design consideration to make our application best fit for
    the cloud. We looked into the journey of software design change from monolithic
    architecture to Microservices based architecture. We understood how microservice-based
    application solves many of the issues, we were faced with older monolithic design.
    We understood how microservice-based architectures are the best fit for the cloud.


    Next, we looked into some of the important design considerations when we created
    a system to be deployed on the cloud. We looked into design considerations like
    design for failure, No single point of failure, stay stateless, fail fast, gracefully
    handle failure, think scalability, automation, self-healing system, manage data,
    cache whenever possible, and go asynchronous.


    Lastly, we looked into some of the common mistakes people make when they first
    move to the cloud. We understood how unoptimized usage of resources can impact
    the cost of using cloud, lack of monitoring can result in undetected failures,
    the unoptimized design can let us not complete advantage of the cloud, and not
    exploring all the options available can cause regrets at a later point in development.


    A discussion about cloud is not complete unless we talk about major players providing
    cloud services. In the next chapter, we will look into some of the important cloud
    service providers, and common services provided by them.


    ## Questions


    - 1. What is a monolithic design? What are the disadvantages of this design?

    - 2. Explain service-oriented architecture.

    - 3. Explain microservices based design and its advantages, with an example.

    - 4. What are the important design factors to be considered when designing for
    cloud?

    - 5. What are some of the common mistakes committed by teams moving to the cloud?

