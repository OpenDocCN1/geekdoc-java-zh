    ## Cost management in Cloud


    Though, as a development team, our main focus will always be on application health
    and monitoring, yet the cost is one of the most critical factors which will impact
    a project. One of the major advantages of using cloud-based deployments is that
    it is easy to set up and scale. The same advantage can become a disadvantage,
    if we do not keep a check on the cost of the resources being used.


    Some of the most common errors, are observed on the cloud, that some resources
    were added to test a feature and the developer forgot to clean up and shutdown
    the resources after the usage. A scale-out code added resources and machines when
    the load went up, but due to some issue with scale-in code, the resources were
    never freed when the load went down, and unnecessarily added to the cost; or a
    service was deployed on a high-end machine whereas all it is using is less than
    10% of power, costing you a fortune, whereas the same service could have been
    deployed to a smaller machine.


    The important message conveyed is that monitoring resource usage and the cost
    is an important aspect of any project being setup. We need to monitor any resources
    that were assigned and were not being used, resources that were being used at
    least capacity, and whether the overall cost of the system was within your expected
    budget range or not. All these monitoring should be in place and the alerting
    system should highlight whenever anything needs action.


