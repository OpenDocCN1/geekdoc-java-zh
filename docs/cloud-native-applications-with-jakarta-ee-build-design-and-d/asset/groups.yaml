    : \"2012-R2-Datacenter\",\n          \"version\": \"latest\"\n        }\n    \
    \  }\n    }\n  }\n]\n```\n\n这是一个用于 EC2 的 CloudFormation 示例：\n\n```json\n[\n  {\n\
