    # Orchestration


    Pros:


    +   * Simplified implementation in terms of code, as complete flow of control
    is defined in a single orchestrator.

    * Monitoring flow is easy as it is controlled from a single service.


    Cons:


    +   * Introduction of an extra service, just for the purpose of controlling the
