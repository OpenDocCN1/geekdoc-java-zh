    ## 第 9 章


    # 监控、报警与报告


    监控、报警和报告是任何应用程序非常重要的非功能性需求。由于这些需求对最终用户是不可见的，它们有时会被忽视或降低优先级。一旦我们在生产环境中观察到问题，就必须为这种疏忽付出代价，而这些问题本可以通过适当的监控、报警和报告来处理。为了避免本可以处理的问题而陷入尴尬局面并流失客户，在我们的云原生应用中建立一个强大的监控、报警和报告机制是非常重要的。


    ## 结构


    - 监控的需求

    - 云端监控、报警与报告

    - 应用程序日志管理


    ## 目标


    在本章中，我们将关注应用程序的监控、报警和报告需求。我们将从监控的基础知识开始，理解为什么它对我们的应用程序非常重要。我们将研究应用程序中需要监控的各个方面。


    我们将研究现用的云端监控工具，以及它们如何帮助我们满足报警和报告需求。我们将通过 Amazon 和 Azure 的示例来了解用于满足我们监控需求的现成工具。部署需求中的一个重要方面是我们向云服务提供商为应用程序支付的费用。我们将理解如何在云端上监控和管理我们的云资源。


    我们需要监控和报告的一个重要领域是应用程序日志。在本章中，我们将研究一些可用于管理和监控日志的流行工具。


    ## 监控的需求


    当你的应用程序部署到生产环境时，工作只完成一半。应用程序的真正测试是在生产环境中，当实际用户在使用它，并且系统以开发者未预料的方式被使用时。应用程序暴露在想要降低其优先级的黑客面前。（等等，让我重新读一下：“应用程序暴露在想要……”）
    -> 实际上，原文是：“应用程序暴露在想要……”


    - 应用程序与服务

    - 健康状况

    - 性能

    - 流量

    - 错误

    - 异常

    - 自定义指标


    我们需要监控和报告的一个重要领域是应用程序日志。在本章中，我们将研究一些可用于管理和监控日志的流行工具。


    ## 云端监控、报警与报告


    监控、报警和报告是任何应用程序非常重要的非功能性需求。由于这些需求对最终用户是不可见的，它们有时会被忽视或降低优先级。一旦我们在生产环境中观察到问题，就必须为这种疏忽付出代价，而这些问题本可以通过适当的监控、报警和报告来处理。为了避免本可以处理的问题而陷入尴尬局面并流失客户，在我们的云原生应用中建立一个强大的监控、报警和报告机制是非常重要的。


    ## Amazon CloudWatch


    Amazon CloudWatch 是 AWS 为所有监控需求提供的的一站式服务。在这里，你可以监控 Amazon 资源的使用情况和健康状况。


    ## CloudWatch 示例


    我们已经看了 CloudWatch 能为你做什么；在本节中让我们为 EC2 实例设置监控。对于 EC2，AWS 提供了基本的 CloudWatch 配置，每
    5 分钟注册一次并默认启用。如果需要额外信息（例如每分钟注册一次数据），可以选择高级监控，但这将产生少许费用。

