  md: '# CHAPTER 2


    # Design for Cloud


    Before we get deeper into cloud-based application development, it is important
    to understand how designing or architecting an application for cloud is different
    from older approaches of non-cloud times. If you would always want to design the
    system you are about to develop, it is obvious for this book to cover the design
    aspects of cloud-based applications, before we take the next step and talk about
    code and development.


    In the previous chapter, we talked about how cloud has improved a developer''s
    life, by introducing off-the-shelf services that can directly be used to deploy
    and manage applications. A more important implication of cloud, which is often
    undermined, is that with the availability of cloud-based services, developers
    and architects have a lot more freedom to think about systems that are complex
    in nature and were difficult to think about a couple of decades back.


    # Structure


    We will cover the following topics in this chapter:


    +   * Cloud Native versus Conventional Development

    * Design factors to be considered for cloud

    * Common mistakes


    # Objectives


    As they say, with great power comes great responsibilities; with all the services
    being easily available, it also brings the risk of choosing incorrect services,
    not using the capabilities of cloud in an optimum manner, causing an impact in
    terms of cost and effort. In this chapter, we will learn some basic considerations
    that one needs to take care of when designing for the cloud. We will learn how
    cloud native applications have a different design from traditional monolith applications,
    and talk about some common mistakes that are observed when teams move to cloud
    based development and deployment.'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# Cloud Native versus Conventional Development


    Before trying to get deeper into cloud native application design, let’s try to
    understand what the term cloud native means. As per the definition provided by
    Cloud Native Computing Foundation or CNCF:


    “Cloud native technologies empower organizations to build and run scalable applications
    in modern, dynamic environments such as public, private, and hybrid clouds. Containers,
    service meshes, microservices, immutable infrastructure, and declarative APIs
    exemplify this approach.”


    In short, cloud native means a design, which is ready to take advantages of cloud
    infrastructure. With popularity of cloud, there are many terms which have become
    popular, cloud-first, cloud-based, cloud-ready, and of course, cloud-native. The
    core idea is to create a design which can help us develop complex applications,
    taking care of its scalability, security, performance, maintenance, cost-effectiveness,
    failure-handling, ease of development, and other project needs.


    When we moved from conventional ways of deployment to cloud-based deployments,
    we had many advantages. The first advantage we, of course, is that now, one does
    not need to worry about hardware needs. You can experiment and test things easily
    without much worrying about hardware cost, as you can rent services and pay only
    for what you used. But the more important aspect is the inbuilt services provided
    by cloud for scalability, availability, security, access management, networking,
    connectivity and so on. With these aspects of control, software architects and
    developers have a lot of freedom to think and develop complex systems.


    A major outcome of this freedom was that we were able to experiment with better
    designs, which help us develop an application in a way that it is easy to maintain
    and scale. We divided our applications to services, and then further to microservices.
    Microservices are the smallest unit of applications, which can be developed and
    deployed independently. This helps us keep our applications loosely coupled, where
    a component or service can be easily updated or replaced without bothering other
    services.


    # From monolithic to microservices


    You will see that a lot of older applications still follow monolithic design architecture.
    In monolithic design, the application is thought off as a single undivided unit
    of deployment. The design has many inherent problems, like all'
  merge: -1
  pgno: 40
- img_proc: true
  md: 'the functionality is coded in one place, causing the code to be unreadable
    and difficult to manage. To solve this problem, developers and architects started
    breaking down the functionality into services and components, which helped manage
    the code in a better manner. With the popularity of the cloud, it became possible
    to break the services further and divide the whole functionality into much smaller
    microservices.


    Let''s look at each of these phases, and understand how microservices help solve
    the many problems that existed earlier.


    # Monolith


    If you are in the software engineering profession for a few years, or have worked
    on legacy systems, you must be familiar with monolith architecture, where the
    whole application is built as a single code unit. It is built and deployed as
    a single unit. In fact, if you are dealing with a small one or two-page application,
    it is not a bad design to follow. But as the application gets complex and starts
    involving multiple features, the monolith architecture will introduce a lot of
    complexity, and there will be a point where making a small change becomes very
    expensive in terms of development and testing.


    The following diagram shows how a monolith application deployment design looks
    like:'
  merge: -1
  pgno: 41
- img_proc: true
  md: '![](img/0ba5078687d28877e27a5bc212dacbeb_42_0.png)


    Figure 2.1: Monolith design


    The preceding design looks very simple, but it has multiple complexities. Some
    of the challenges being being faced with this design are as follows:


    +   - **Size of Codebase:** As we are dealing with a single code base, we have
    hundreds and thousands of files in a single code base. This impacts the readability
    of code first, even for a small change to be made, you will need an understanding
    of the whole codebase. Every time a code change is, one needs to build and deploy
    the whole codebase unnecessarily.

    - **Testing:** As the codebase is all in one place and needs to be built together,
    a small change would mean that we will need to test the whole application to make
    sure there are no integration or regression issues.

    - **Scalability:** Another challenge we face with monolith design is the scalability
    of the application. The only way to scale the application as a whole. For example,
    if an eCommerce portal is developed in a monolithic manner, and we are seeing
    a lot of search requests, we cannot just scale up search service, we will need
    to scale the'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'whole application, which will waste a lot of resources.


    +   - Non-Agile: In today’s world, you want to make changes to your codebase and
    release them asap. In a monolithic application, it is difficult, as you will need
    to build, test, and deploy the whole application.


    +   - Stuck with technology: Say, you have a Java application, and you want to
    add a reporting feature to this application. You know the support for this kind
    of reporting is present in Python in the form of libraries, and it can be developed
    in less than half the time it will take in Java. But you cannot do that in a monolithic
    design, as the whole application needs to be built and deployed together, and
    it must be done in the same technology.


    Due to all the challenges we have discussed for monolithic applications, architects
    moved away from a single chunk of approach, and started thinking in terms of breaking
    the code into smaller services and services.


    # Service-Oriented Architecture


    Service-Oriented Architecture, or SOA as it is popularly known, is an approach
    that helps in breaking the code into smaller services. SOA can be thought of as
    a base on which Microservices were developed further; so it is important to understand
    the concept of Services and Service-Oriented Architecture.


    Think of an eCommerce portal, where we can divide a whole application in terms
    of multiple services like:


    +   - Account Management Service - Create and login user

    - Search Management Service

    - Catalog Management Service

    - Shopping Cart Service

    - Payment Management Service

    - Shipping Management Service

    - Inventory Management Service

    - Admin Service


    The following diagram shows how different features are now divided into services,
    based on Service Oriented Architecture:'
  merge: -1
  pgno: 43
- img_proc: true
  md: '![](img/0ba5078687d28877e27a5bc212dacbeb_44_0.png)


    Figure 2.2: Service-Oriented Architecture


    Figure 2.2 shows a single database for simplicity''s, but there might be multiple
    databases involved. The advantage here is very much visible; let''s say if I want
    to modify the approach in which Search is implemented, I know where I should be
    looking for existing code and making changes. I know which service needs to be
    tested.


    But Service Oriented Design does not get into details of how the services should
    be implemented. The data might be stored in the same database or different, code
    might be kept together, built together and deployed using a single deployment
    script. To get more clarity on services and further dividing services, the concept
    of microservices came into existence.


    # # Microservices


    Service Oriented Architecture changed the way we used to think about applications
    and helped us look at it as multiple services. Microservices took the'
  merge: -1
  pgno: 44
- img_proc: true
  md: 'idea to the next level and suggested to break each service to the smallest
    logical level. Smaller independent services helped unleash the power of Cloud.
    It is hard to guess if Cloud has helped the popularity of Microservices, or if
    it is versa. Whatever it is, the thing to note is that Cloud and Microservices
    go in hand. Let''s start with getting an understanding of what a microservice
    is.


    "Microservices - also known as the microservice architecture - is an architectural
    style that structures an application as a collection of loosely coupled services,
    which implement business capabilities. The microservice architecture enables the
    continuous delivery/deployment of large, complex applications. It also enables
    an organization to evolve its technology stack http://microservices.io/


    Basically, the microservice is the smallest in your application that can fulfill
    some purpose in a stand-alone manner. Let''s go back to our eCommerce example
    for SOA, where we had several services come together to deliver an eCommerce application.
    Let''s take one service, say Account Management Service. When we talk about microservices,
    the first thing we try to think of is break down the service into smaller, but
    logically meaningful service. For example, account management service currently
    has the role of creating a new account, managing, and updating the account, providing
    authentication and authorization for accounts, managing the past history, and
    providing suggestions for future purchases.


    You might ask how big exactly is a microservice? The answer is a bit complex,
    as there is no fixed parameter. Normally, we try to divide application in terms
    of functionalities to create microservices; so a microservice converting an image
    into thumbnail whereas search microservice will be scattered across multiple classes.
    A rule of thumb says that while defining a service, you must use too many "commas"
    and "ands", you know it can still be further divided. When I say service provides
    Feature A and B, I have Service A and B. The actual services depend on the project
    in, but this is a good start to understand how to think about microservices.


    Coming back to our Account Management Service, we can think of dividing it down
    to further services:


    +   - Account Microservice

    - Manage Account Microservice

    - Current Orders Management Microservice

    - Authentication Microservice'
  merge: -1
  pgno: 45
- img_proc: true
  md: '+   • Order history Management Service

    • Suggest Purchases Service


    Let''s say, create and manage account has a feature, where users can upload or
    update profile images. We can add another microservice upload image service, which
    is responsible for uploading or updating user images. The advantage of such a
    bifurcation is that if we want to update code in that service, say we are supporting
    only JPEG and PNG images today, and we want to add another format, all we need
    to do update and redeploy this service.


    The following diagram shows microservices based design:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_46_0.png)


    Figure 2.3: Microservices'
  merge: -1
  pgno: 46
- img_proc: true
  md: 'Figure 2.3 showcases an important feature of microservices, that they are independent
    of each other and helps us create a loosely coupled application. For example,
    if our User Image management service is broken or not responding, it does not
    impact the rest of the application and users can use the eCommerce portal without
    any impact.


    Microservice based design is a default fit for the cloud, and helps us solve many
    problems that there were with traditional monolithic architecture. Some of the
    important advantages of microservice-based architecture are as follows:


    +   - **Scalability**: The first thing that microservices provide us is the ability
    to selectively scale the services. For example, when a new product is being launched
    on a day, the eCommerce portal expects more load on the search and purchase related
    services, So, we can selectively scale-up services, where the higher load is observed
    or anticipated.

    - **Ease of testing**: It is easier to test a smaller service than the whole application.
    For example, if there is a change in user image management service, we will just
    need to test the image upload part, and not worry about the rest of the code and
    features.

    - **Easy in development**: It is easier to manage and understand smaller codebases.
    Again, if we need to add a new image format support for user images, we already
    know which to look at and update. The developer does not need to understand the
    whole system before making any changes.

    - **More stable systems**: If one or two services are down, it will not result
    in the whole system to be broken. For example, if the microservice responsible
    for suggesting future purchases to end-user is broken, it will not impact the
    rest of the systems and users can still login, search, and purchase products.

    - **Flexibility in technology stack (Polyglot programming)**: Because each microservice
    is being developed and deployed independently, it is possible that different codebases
    use different technologies. For example, if you have to create a new user report,
    which you can know can be created in Python easily due to existing libraries’
    support, you can go ahead and create a new microservice without worrying about
    which technology is being used by the rest of the services.


    Though microservices have a set of advantages, it is time for a word of caution'
  merge: -1
  pgno: 47
- img_proc: true
  md: 'Microservices are not a silver bullet and come with their own challenges. It
    is easy to get carried away, as there are design systems that do not use microservices
    properly. The following are some of the challenges one needs to take care of designing
    a system based on microservices:


    +   - **Breaking down the services:** While creating microservices, one needs
    to understand how granular you want your microservices to be. Too few services
    created means you are not able to take advantage of microservices architecture,
    and too many would mean you are managing unnecessary services with dev-ops overhead.
    Breaking the application into the right number of services is very important when
    opting for microservices based design.


    +   - **Managing services:** You need to have proper monitoring in place all the
    time for all the services to make sure you have control over the whole system.
    If an important service is down, and the alerting system fails you might end up
    a lot of unsatisfied customers and possible loss in revenue.


    +   - **Multiple tech stacks to manage:** Though one of the advantages of using
    microservices-based architecture is flexibility in choosing tech stacks, this
    can turn out to be a problem if not managed properly. Having multiple stacks means
    managing different expertise within the team, and people''s movement from one
    team to another is difficult.


    +   - **Managing data:** Another challenge with the microservices-based design
    is how to manage data and databases. As a rule of thumb, each service should manage
    its own data and have an independent database. But this can get tricky if the
    data is shared among services, and more than one service can operate on a dataset.
    So, one needs to carefully examine what data is shared among services, and which
    service is the primary owner of the data.


    # # Design factors to be considered for cloud


    We understand now that cloud helps us in creating distributed systems with the
    help of microservices, which are easier to develop, maintain, and scale. But at
    the same time, we need to adapt to a new design system, and unlearn some of the
    techniques that used to work for us in the age of monolithic systems. To completely
    take advantage of cloud, our system should be designed in a manner that it can
    take maximum advantage of services and tools provided by the cloud.'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'Before we start development, we should design our system, considering some
    of the factors which will help our system fit to cloud, and make sure that we
    take advantage of all its capabilities. In this section, we will cover the core
    factors that impact the design of the cloud.


    # Think in terms of services


    Stop thinking of the application as a monolithic standalone system and decouple
    all the functionalities that the system is supposed to provide. We have already
    seen in the last section that a system following microservices-based design is
    easy to develop and scale because it is easy to maintain a small piece of code,
    and it is easier to scale a small piece of service than the whole application.


    Once you identify the service, you also have the flexibility to take a decision
    on how to develop it. For example, for a small service, you might just want to
    expose it as a Function as a Service (FaaS), for another service you might think
    Python is a better way to develop it, whereas the rest of your system might be
    developed in Java.


    Microservice based system is default fit for cloud, as you get different types
    of resources on demand. You can easily develop, deploy, and manage these services
    independent of each other.


    # Design for failure


    With many advantages of distributed and microservices-based design, the challenge
    is also added, that how to manage the failure. In a normal monolithic system,
    you try to design in a manner that the system should not fail. In microservices,
    though you do make sure the system never fails, at the same time you embrace failure,
    i.e., you assume that a service is going to fail sometimes. Then you think about
    how the rest of my system will behave when a particular service is down.


    # No single point of failure


    While you design for failure, you also want to make sure there is no single point
    of failure. When a service goes down, it should not impact the rest of the services.
    For example, in our e-commerce site example, if there is a problem with service
    handling search operations, it should not impact another service, which is used
    for managing customer orders.'
  merge: -1
  pgno: 49
- img_proc: true
  md: 'While designing the system, we need to make sure if a service is failing, it
    does not impact other services. When a service A call Service B, failure of Service
    B should not make service A fail. Service A should be able to call another instance
    of Service B, or in the worst case, gracefully handle the error in Service B and
    return default results. For example, going back to our account management service,
    if the image processing service is down, it should not impact account creation
    or update path.


    # Stay Stateless


    When moving toward service or microservice-based design, one factor that can cause
    problems is how to maintain the state of calls. A simple example is when Service
    A calls Service B and says, add 2 and 3. Service A again calls Service B and adds
    4 to the previous result. This would mean that Service B needs to maintain a state
    for the requests coming for Service A, and manage different states for all the
    requests initiated by Service A. Problem with useful states is that it is hard
    to scale, one needs to make sure that all the requests from a user are going to
    same instances in order to manage previous state.


    One easy to handle this situation is to make the service stateless, where every
    request in the flow is independent of previous request. It is often needed for
    services to be sent to details about the user, who is making the request and some
    details about the caller. Techniques like JWT or JSON Web Tokens help in such
    cases where encrypted JSON is sent to the service with the required information.
    Instead of maintaining the metadata in session objects on server side, we will
    make it of part each request making the communication stateless.


    # Fail fast


    When a service fails, it should make sure to fail fast. A real-life example can
    be, when you log to a website and trying to access a page. It is showing the page
    as being loading for a few minutes. Say, after 10 minutes a message appears that
    the page is not available right now and you should try again after 30 mins. This
    can frustrate the end-user who had to wait for 10 mins just to know that the service
    is down. If you must deliver the failure message, deliver it fast, that is, observe
    and anticipate the failures and report back to calling services.


    Similarly, each service should have a fail-fast mechanism inbuilt. For example,
    if a service observes that existing calls are still in progress and taking time,
    it should stop queuing additional requests and let them fail immediately (circuit-'
  merge: -1
  pgno: 50
- img_proc: true
  md: 'breaker). A service that observes that the last few calls to a service being
    called have not successfully responded yet, one should abandon the calls to this
    service till previous calls respond and manage failure at its end. These practices
    help manage failure in a faster manner.


    # Gracefully handle failure


    Once a failure is observed, our services should be smart enough to manage failure.
    For example, if a user is trying to search for mobile phones, and the backend
    search service fails to fetch the current data about mobile phones, we can take
    results from a cache for a search that have occurred a few minutes back. Or, even
    if that is not possible, we could just redirect to the top of a page for top-selling
    mobiles. We might not be showing the latest results, but still use some useful
    information relevant to the user can be seen.


    Our services should be designed in a manner that they are able to handle failure
    impacting other services.


    # Think scalability


    Often it is seen that we start thinking about scalability needs, when we reach
    a point where we need to handle the extra load. We should be more proactive and
    factor in scalability during designing. We should consider the impact of vertical
    and horizontal scalability on the way when the service is designed. For example,
    a stateful service is difficult to scale horizontally, but can be scaled vertically.
    While scaling vertically, we must consider design factors like downtime needs
    and limits of vertical scalability. This might help us understand if vertical
    scalability is actually good for the system, or should we design for horizontal
    scalability. We can save thousands of dollars and man-hours, which will be used
    in re-designing and re-coding the service, if we consider the scalability in initial
    phase itself.


    # Automate


    As the number of services in a system increases, it becomes difficult to test,
    manage and monitor them manually. You need to automate as many steps as possible.
    For example, a good automated set of unit tests can make sure that changes in
    the service or any services on which your service is dependent, does not impact
    the working of service. Automated continuous integration and continuous deployment
    process eliminates any human errors that can occur and'
  merge: -1
  pgno: 51
- img_proc: true
  md: 'cause unnecessary downtime. Automated monitoring of service health can save
    embarrassing situations, as you will catch service downtimes and take actions
    before clients start reporting it.


    You must factor all the automation needed in the system at the time of design
    itself to avoid the unoptimized process later in the delivery state.


    # # Self-healing system


    We understand that a system with multiple microservices communicating each other
    can be complex in nature and is prone to some failure. We already talked about
    the design factor that one should embrace failure and handle that gracefully.
    Now the question is, what after the failure? Our systems should be designed in
    a manner that if a service stops responding, can it be restarted automatically
    based on some performance or application logs? Or can we design the system, so
    that if one instance of service stops responding, we bring up additional service
    instance and transfer load to that?


    We need to consider the questions at design time, like would happen once this
    service fails? Can this be fixed automatically with a restart? Can the situation
    be handled by distributing the load to another instance? Answering these questions
    will help us create a robust system, which can heal itself without manual intervention.


    # # Manage data


    An important aspect of any system is data and databases. While designing a complex
    system, which is going to deal with multiple microservices, it becomes more important
    to understand how the data will be managed? A golden rule for microservices is
    that each microservice manages its own data, but that might not be possible, as
    there will be some shared data. Also, some reporting services need to fetch data
    from multiple sources, so we need to take a call on how much division of data
    is possible without impacting overall performance.


    A good example of handling data complexities is with views. A view is a snapshot
    of data, which can be created from multiple data sources. This will be created
    after applying joins, and filters on data, and help us improve performance at
    runtime. But it does come with an overhead that one needs to take care of – factors
    like refreshing data in a timely manner to avoid servicing'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'too stale a data.


    # # Cache whenever possible


    While we are at the topic of managing data for service, one technique that is
    being used successfully for years is caching. You might want to understand which
    data can be cached while you design the system. Consider questions like, should
    it be an internal cache managed by some library or external cache management like
    Redis cache? Another important question is, how to refresh cache, as you do not
    want to serve stale data, while backdated data is getting updated in the database.


    A good caching approach always helps in increasing the performance of the system.
    So, it makes sense to spend some time understanding which data can be cached and
    how.


    # # Go asynchronous


    Not everything you do in a system immediately impacts the end-user. For example,
    when creating or updating an account, we need to send an email to the end-user.
    But it is not directly impacting the system in terms of account creation or update.
    Such tasks that are not on the critical path for a request completion can be and
    should be handled in an asynchronous manner. Another set of such tasks is logging
    of the events. We can add such tasks to queues, which can later be picked up by
    services in an asynchronous manner and completed.


    # # Common mistakes


    When going for a cloud-based application design, it is easy to make some mistakes
    due to lack of knowledge or research. Let''s take a look at few common mistakes
    done by development teams when onboarding a cloud-based design.


    # # Unoptimized usages


    One of the most common mistakes faced, when using cloud-based infrastructure,
    is wasting the resources. Remember that the cloud resources are cheap, but they
    are not free. A lot of cases have been seen, where unused servers that used for
    testing or validating are kept active when they are not in use; high configuration
    machines are used where one could have used a cheaper low configuration machine;
    additional resources added, when increased load caused'
  merge: -1
  pgno: 53
- img_proc: true
  md: 'scale-up scripts to come into play are not freed when the load is normal. These
    are some of the very common reasons one ends up having unused capabilities that
    you still end up paying for. Most of the cloud service providers provide monitoring
    tools and suggestions to keep the billing low, but it is up to the development
    team to make sure that resources are being used in an optimum manner.


    # Lack of monitoring


    As we have seen with the cloud, it is easy to create smaller, focused, and reusable
    services. This flexibility also brings a problem with it, that now we need to
    monitor more components for their health and performance. You do not want to wait
    until some customer reports a report in the system. So, we need to make sure each
    component and service is logging health, performance, and application-related
    information properly. We will automate the process of monitoring logs so that
    proper actions can be taken when an error is figured out in the system.


    # Design not optimized for cloud


    Another problem that is observed often is when teams move to the cloud, they still
    bring in the old practices for monolithic designs. For example, we create services
    that are monolithic in nature and to do too much on their own, making scaling
    of a part of functionality impossible. Or, we make our services stateful, which
    adds the additional burden of maintaining state on the service, bringing problems
    in the scalability of the service.


    # Consider containers, serverless, and off the shelf


    When moving to the cloud, it makes sense to understand the full capabilities of
    cloud services. At times, developers realize at later stages of development that
    there could have been a better option for a solution they have implemented.


    With Cloud, it has become easier to use functions as a service, containers, database
    as a service and so on. Additionally, cloud service providers also have off-the-shelf
    tools to help develop and deploy applications like Amazon Cloud Beanstalk, Azure
    App Service, or Google App Engine. With all the information, you will be able
    to take an educated decision about the approach that is best for the service and
    application being built.'
