  md: '![](img/0ba5078687d28877e27a5bc212dacbeb_157_0.png)


    Figure 8.6: Scaling Microservices


    The preceding screenshot showcases how each service in a microservice-based implementation
    can scale in or out independently. If a service is facing a high load, it can
    scale itself without bothering the rest of the services; in fact, no other service
    will come to know if a service is scaling.


    Another important design aspect one needs to consider when implementing scalability
    is how the state is managed in service. We have talked about how a service or
    application can be behind a load balancer that can manage load among the services.
    If your service is built in a stateful manner and uses sessions to manage the
    state of the requests, the load balancer will need to take extra care of making
    sure that requests from a source are handled by the same server. This is normally
    managed by using sticky sessions on load balancer sides.


    The approach of managing sessions has an obvious downside that load balancer is
    not distributing the load evenly. It is always the best practice to develop your
    services in a stateless manner, so that any new request can be handled by a service.
    To manage stateless requests, we can use techniques like usage of JWT tokens,
    which can help to send user context in an encrypted manner to the services. Along
    with the token, one can use a database or distributed cache to manage the state,
    so that any server can access the state-related data, and load'
