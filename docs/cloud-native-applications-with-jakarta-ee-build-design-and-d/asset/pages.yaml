  md: 'coverage.


    **Static code analysis**: One can get a lot of off-the-shelf tools to implement
    static code analysis. Nothing can replace a good code review, but over the years,
    software developers have categorized some best practices for analyzing the code.


    Static code review tools help us identify these common issue patterns like hardcoding
    credentials, without proper naming conventions, missing or default in a switch
    case, etc. These tools can easily be integrated with IDEs or Continuous Integration
    pipelines, and can play a role of first line defence. PMD, FindBugs, SonarCube
    are some of the tools worth mentioning here that can be explored to implement
    static code analysis.


    **Code coverage**: Another set of tools that support our testing strategy are
    the ones that help us identify code coverage. While creating a testing strategy,
    a common debatable question—how much of unit testing is sufficient for a piece
    of code? There is no correct answer to this question. You might see one developer
    writing 20 unit cases for a class, whereas other writes 10.


    Code coverage comes to rescue in such a situation. In simple terms, code coverage
    depicts the amount of code covered or executed by all of your test cases combined.
    For example, if a new class with 100 lines is added to a codebase, and code coverage
    by unit test cases is 70%. It means 30 lines of code are still untested or not
    covered by our unit test cases.


    We can set up our coverage expectations at the project or service level, so that
    all developers working on different sets of code are on the same page in writing
    test cases. It is tempting to set code coverage to be 100%, but often it becomes
    unattainable, as part of the code might be in exception, or error handling cases,
    which might be hard to replicate or simply not worth the effort. A 90% coverage
    can be considered good, but again, it will depend on project to project, or at
    times, the service or class that is being tested.


