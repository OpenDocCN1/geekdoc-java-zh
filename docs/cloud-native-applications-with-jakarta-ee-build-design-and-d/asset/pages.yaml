    # Kubernetes


    Kubernetes (K8s) is an open-source system for automating deployment, scaling,
    and management of containerized applications. It is an open source container orchestration
    tool. This was originally created by Google to manage applications made up of
    tens or hundreds of containers.


    # What is container orchestration?


    When each microservice is deployed in a container, we might end up having a lot
    of containers. Managing these tens and hundreds of containers manually is almost
    impossible and error-prone. An orchestration tool like Kubernetes helps manage
    our containers and applications for high availability, scalability, and disaster
    recovery.


    K8S provides the following features off the shelf:


    +   * High availability - no downtime

    * Scalability - high performance

    * Disaster Recovery - backup and restore


    # Kubernetes architecture


    In this section, we will look into Kubernetes architecture and understand how
    things work behind the scenes. We already mentioned that Kubernetes is a tool
    that helps us manage our containers and provides us with scalability, self-healing
    mechanisms, service discovery, load balancing, etc. Let’s see how all these functionalities
    are achieved:'
