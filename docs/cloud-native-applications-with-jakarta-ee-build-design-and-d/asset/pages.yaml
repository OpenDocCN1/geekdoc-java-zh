  md: '# Figure 11.10: Amazon AWS Lambda S3 Trigger


    The preceding screenshot shows the S3 based trigger setup. One needs to be careful
    when setting complex event-driven triggers; for example, when you are creating
    an S3 based trigger, you will see a warning sign that this kind of trigger can
    become recursive. Think of a scenario when you are listening to the event when
    a new file is added to a bucket, but within the same function, you are adding
    a new file to this bucket. The whole process will go recursive, and hence problematic.


    Overall, you can see many options for setting up a trigger; for example, when
    an update is made to dynamo DB or a message is received in a queue. Without worrying
    about the underlying hardware, you can see how things are going to scale; we are
    easily to write production-level code.


    # Summary


    In this chapter, we understood the usage of Serverless Computing and Functions
    as a Service. With the popularity of the cloud, we have been trying to free up
    our developers from thinking about infrastructural needs, so that they can focus
    on solving the core business problems. Serverless computing helps us in this direction
    by taking responsibility for the deployment of our code and services.


    We started by looking into basic concepts of serverless computing, and went onto
    creating a simple hello-world example in the form of Functions as a Service. We
    next added REST API triggers to enhance our “hello-world” example.


    Finally, we explored advanced examples, where to trigger AWS queues programmatically,
    and added sample messages to the queue. We also looked into additional ways to
    trigger the functions; for example, using S3 bucket events. With serverless computing,
    we have a powerful tool in the hands of development teams that free us from worrying
    about the system setup and scalability needs.


    In the next chapter, we will talk about some of the industry’s proven best practices
    when we are building cloud-native applications.


