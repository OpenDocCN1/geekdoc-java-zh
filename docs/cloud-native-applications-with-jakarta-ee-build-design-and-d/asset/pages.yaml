  md: '# # Common threats and software defence


    When you develop a, you need to tackle a certain set of problems that can be faced
    by your application.


    In this section, we will take a look at some of the common threats and techniques
    to handle these threats.


    # ## HTTPS - Securing your APIs


    You must read a lot about phishing cases, where a user is made to believe that
    a fake site is actually a real site and convinced to provide some critical details.
    The HTTP protocol has a limitation in the sense that it is not secured, and data
    travels un-encrypted, that is anyway one can view it. Answer to these challenges
    is to use a secured version, that is, HTTPS.


    So, how just moving from HTTP to HTTPS help secure our sites and APIs? Let''s
    try to understand what is happening behind the scenes:


    +   1. The browser sends a request for an https secured page, like https://xyz.com

    2. The website will need to send back an SSL certificate along a public key confirming
    that it is secured. SSL certificate is provided by certifying authorities and
    can be verified by the browser.

    3. The browser authenticates the certificate, and if satisfied, it will use the
    public key from the browser to create a symmetric key. The symmetric key is then
    sent back to the application server.


    For any further communication, both parties use this symmetric key.

    All cloud service providers have an easy way to buy and implement HTTPS certificates
    for sites and APIs hosted with them. This should be the first thing we need to
    implement for any sensitive API.


    # ## Encryption


    Another type of attack that applications normally face is when someone gets access
    to their data. We can use encryption to make sure even if someone gets access
    to our servers, they are not able to read the data or at least cannot sense of
    the data. Cloud service providers help us with providing encryption for a lot
    of services. It is also easy to implement, mostly turning a flag “on” for encryption:'
  merge: -1
  pgno: 141
- img_proc: true
  md: 'The following screenshot showcases AWS S3 encryption options:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_142_0.png)


    **Figure 7.6:** AWS view of S3 encryption options


    The preceding screenshot shows how we can turn on the encryption for a storage
    account in AWS, by just selecting an encryption option. Similarly, we can enable
    encryption for VM clouds or database storage. This is how one can enable encryption
    for data at rest. Similarly, we can enable encryption for data in transit by using
    encryption methods like the usage of HTTPS, which we discussed in the last sub-section.


    # DDOS attack


    A very common attack in the current internet arena is Denial of Service or Distributed
    Denial of Service (DDoS) attack. Basically your service will be bombarded with
    fake requests so that servers are choked and not able to deliver legitimate requests.
    We need to understand if a request is fake or legitimate. Again, cloud service
    providers help us here by providing out of the box tools. For example, Amazon
    Web Services provides us with AWS Shield, which comes with DDOS protection and
    Microsoft Azure provides us with Azure'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'DDOS Protection service for the same purpose.


    # Code and SQL Injections


    There are additional attacks that a development team needs to take care of like
    Code injection and SQL injections. Think of a scenario where a user is asked for
    feedback comments on an eCommerce site. These comments are loaded and shown to
    other users interested in the same product. Now, if a hacker adds some malicious
    comment, which has a JavaScript code it in it, we will store it and render when
    someone opens the product page next time. So the code will execute on the end-user
    machine and access to personal data in the browser, which can be used by a hacker
    for his personal benefit. It is the onus of the development team to make sure
    proper checks are in place to validate the entries being added by end-users. These
    checks can be added manually or by using frameworks.


    # Understanding security with an example


    When you create an application, there can be many aspects that get ignored. For
    example, at times, we create simple REST services for GET, PUT, POST and so on.
    Say I have a service like:


    GET https://somewebite.com/employees/1


    Now, this looks like a simple REST service to get me an employee with ID 1. Nothing
    wrong with it. But someone can easily look for the calls being made to web services
    by the browser and try to modify it to say:


    GET https://somewebite.com/employees/2


    And now he is able to see the data he should not be allowed to.


    Or else, once you know there is a GET service, you might try out POST and PATCH
    service, which will update the data for the user; again one needs to understand
    if the calling user has access for carrying out this operation. You can easily
    see that the problems in these cases are that there are missing authorization
    checks at the receiving endpoints to make sure that only authorized users can
    make a change or fetch the data.


    In one of the real project instances, I have seen a case, where a user manipulated
    JavaScript checks to let him enter data that he was not authorized to enter and
    should have been stopped at entry-level. The mistake here was that there was a
    check only at the frontend level but no checks at the backend.'
  merge: -1
  pgno: 143
- img_proc: true
  md: 'We know the problems and we know the solutions, which are quite often simple
    best practices that need to be followed. But we also observe these kinds of problems
    frequently faced by applications. Why? The major reason for facing these problems
    is that these are un-documented requirements of any software being developed and
    easy to miss. You will never see a requirement that explicitly talks about how
    you implement a REST endpoint. It is up to the developers'' experience and expertise
    that he handles all the security threats while writing code. Now the problem is
    that, at times due to the deadlines'' pressure or changing requirements, developers
    can leave some of these loopholes for the hackers to exploit.


    So what is the solution to this problem? Well, while you are designing documenting
    the technical requirements of the system, that is, what services are needed to
    be created and what endpoint will be exposed, one should make a point to add a
    security section in the document, and add all the security-related requirements.
    For example, who can access the endpoint? What Role will have level of permission?


    # An E-Commerce example


    Let''s learn about implementing security in your application with an example.
    We will take a simple example to showcase the power of authorization and authentication.
    For any application, there are different sets of users, who will be playing different
    kind of roles. For the sake of this example, we will consider an E-Commerce website,
    where based on your role, you have access to product details. For example, we
    can say that anyone should be able to see a list of products, but before getting
    into details of a product, you need to be logged in as a user. Additionally, only
    an Administrator-level user can add new products:


    | Feature | Access |

    | --- | --- |

    | List of product | Anyone can view |

    | Product Details for a single product | EndUser (logged in user with Enduser
    role) |

    | Add new products | Admin (logged in user as Admin role) |


    Now, Jakarta EE gives you various options to implement such role-based access,
    also one can use frameworks like Spring to implement the security. To keep this
    example simple, we will use a Jersey-based implementation of Authentication Filter.'
