    +   - Pods and Containers:


    We have already discussed containers in detail. An important thing to understand
    here is that Kubernetes runs these containers inside pods. One can think of a
    Pod as a wrapper layer on top of containers. Kubernetes does not want to work
    directly with containers to give it flexibility, so the underlying layer does
    not have any dependency. This gives abstraction from container technology. One
    can change Docker with any other container technology without impacting orchestration.


    Pods have IP addresses that are used to connect different microservices. If a
    Pod dies, a new Pod is created and a new IP address assigned. One Pod is usually
    expected to run one application container.


    As pods can die and be recreated, the concept of service comes into the picture.
    The IP address is associated with a Service so if the pod dies, the IP address
    does not change. An external request goes to ingress, is converted to an internal
    IP address, so the external communication is smooth even if Pods are getting updated
    internally.


