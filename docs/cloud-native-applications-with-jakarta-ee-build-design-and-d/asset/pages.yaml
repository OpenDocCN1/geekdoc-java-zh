    # Summary


    In this chapter, we talked about the security of our applications on the cloud.
    We started by having a high-level view of security and the challenges we face
    judging the security needs of an application. We looked into Cloud specific security
    needs.


    We talked about the need for securing cloud infrastructure and how it can be achieved.
    We looked into monitoring options we have on the cloud to make sure any change
    in infrastructure is being motored and action is taken if required. We understood
    the concept of Virtual networks and how these can save us from unwanted external
    access. We also talked about automating the process of infrastructure set up to
    avoid any human error.


    Then we looked into some of the common threats, which we face today when deploying
    our applications, and how to mitigate the risks. We talked about the usage of
    HTTPS, which is a secure protocol, that helps us safeguard our users. We looked
    into the encryption keys of data being used in the application. We talked about
    attacks like Denial of Service, Code, and SQL injection, and how we can tackle
    these.


    Finally, we talked about challenges in a real application, like how to safeguard
    our APIs, so that there is no unauthorized access. We created a sample application
    showcasing the use of role-based access.


    In the next chapter, we will learn another important feature of a cloud-based
    application, which is scalability.


    # Questions


    +   1. What are some of the ways in which we can safeguard our infrastructure
    on the cloud?

    2. What are virtual networks and how do they help us secure our resources?

    3. How does HTTPS help us safeguard our APIs?

    4. Exercise: Implement role-based access on sample application with API to access
    employee data.'
