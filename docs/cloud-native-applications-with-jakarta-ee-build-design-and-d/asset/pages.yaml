  md: "+   - Fault Tolerance: Once you create a microservice, you need to make sure\
    \ it is available all the time, that is, there is no downtime. Eclipse MicroProfile\
    \ Fault Tolerance provides us with ways to implement timeouts, retries, fallback\
    \ mechanisms, bulkhead pattern (isolate failures), circuit breaker pattern (fail\
    \ fast), and so on.\n\n+   - Metrics: Once your services are up and running, you\
    \ will need a way to monitor the performance. MicroProfile metrics give us ways\
    \ to check important parameters like CPU usage, Heap Memory, Garbage collection,\
    \ etc.\n\n+   - JWT: JWT stands for JSON Web Token. It's a JSON-based text format\
    \ for passing information to services. It is helpful when your service needs some\
    \ formation to be passed to it in a secured manner.\n\n+   - Health Check: Once\
    \ your services are in production, you need to make sure they are healthy and\
    \ responding in a timely manner. Eclipse MicroProfile provides out of the box\
    \ solutions for implementing health.\n\n+   - MicroProfile Implementations: There\
    \ are multiple popular implementations of Eclipse MicroProfile specifications.\
    \ Some of the popular ones are OpenLiberty, Payara, Websphere, Wildfly Swarm,\
    \ and so on.\n\n# Using MicroProfile\n\nAs mentioned earlier, MicroProfile adds\
    \ to the features that we can already build with Jakarta EE. For example, if we\
    \ go back to our previous example of Employee Details service, we can add additional\
    \ features using MicroProfile. Let's try to add some fault tolerance features\
