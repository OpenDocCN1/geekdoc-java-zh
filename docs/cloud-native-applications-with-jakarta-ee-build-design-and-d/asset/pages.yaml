    like:


    +   - What if there are negative numbers? Are we supporting that?

    - What if the sum of the numbers is 0?

    - Do we need to support decimal values?

    - If the sum goes beyond Max Integer value, will we overflow?


    You can see once we are starting from the test driven development point of view,
    we are not only making our coding robust, but also thinking about requirements.
    This is an important benefit of Test-driven development, that one can ask relevant
    questions before writing the first line of actual code and clarify the requirements.


    Another important advantage of TDD is when you are thinking about test cases first,
    you are also making sure that you are writing testable code, which by default
    means you have a maintainable code being developed.


    TDD approach is simple:


    +   - Figure out all the test cases and clarify any doubts

    - Implement all the test cases; of course, they will fail as we do not have any
    code implementation

    - Once all test cases are coded, we start coding the actual requirement

    - Once all our test cases are successful, we know our code is handling all the
    requirements, and is robust for production deployment


    TDD is very important in making sure we are able to deliver a quality product.
    One should start thinking from a TDD perspective for any requirements in hand.
    Amount of testing being done and test cases being written vary from project to
    project and based on requirements, but thinking TDD will always help in the longer
    run, by writing bug-free and maintainable code.


