    # # End-to-End System Testing


    So far, we have talked about testing a unit of code, or how various components
    work together, or how a service would work. But our final goal is to always make
    sure that the system should work as a whole, and end-users should be able to achieve
    their goals using our application. To achieve this task, we need to make sure
    that all components of the system are working as expected.


    One of the most popular ways to implement this type of end-to-end testing is by
    testing the system through the eyes of the end-user, or try to do all the tasks
    as end-user is supposed to do. A lot of tools are available to simulate level
    testing – Selenium being one of the most popular and front runner candidates.


