  md: '# CHAPTER 7


    # Securing Cloud-Based Applications


    When we create an application, there are certain unsaid requirements, popularly
    known as non-functional requirements. The security of the system being built is
    one such requirement. The problem with the security of the application is that
    mostly we do not pay too much heed to this requirement, unless some vulnerability
    gets highlighted. A lot of times we come across news on how a critical data was
    exposed by highly trusted and sophisticated applications.


    We have already talked about the shared security model that the cloud has. In
    this chapter, we will focus more on securing our infrastructure and applications.
    We will look at some of the core security aspects, which every developer should
    be aware of when working on a cloud-native application. We will understand some
    of the common security related threats, and learn how to defend against them.


    # Structure


    +   * Security in Cloud

    * Common threats and defence

    * Understanding Security with an example


    # Objectives


    In this chapter, we will look into various aspects of the cloud security. We will
    understand what all security factors needs to be looking when designing a system.
    We will learn about some of the common threats that all the applications face,
    and how to handle these threats. Finally, we will create a sample application,
    and learn how role-based access can help us safeguard our APIs.


    # Security in Cloud


    When we move from an on-premise deployment of an application to cloud-based'
  merge: -1
  pgno: 131
- img_proc: true
  md: 'deployment, we get many benefits, but along with that, we come across many
    new challenges as well. The first one is that we need to make sure that our infrastructure
    is safe. Cloud service providers have tons of features and tools provided to us,
    but at the end of the day, it is the development team''s responsibility to make
    sure the tools are being used in the proper way to safeguard the application.


    In this section, we will look at some of the important challenges that we face,
    when we move to the cloud, and how cloud service providers help us handle these
    security issues.


    # Securing Infrastructure


    The first challenge you come across when moving to the cloud is that you have
    created an account on the cloud, and now you need people from your team to be
    able to access the details, deploy applications, manage infrastructure, check
    logs, and so on. It is important that you make sure only authorized users have
    access, and on top of that, you want to ensure that users assigned a specific
    task should have limited access based on the task requirement. For example, a
    support engineer, who only needs access to logs for analyzing application issues,
    should not be able to deploy or delete an application from the cloud.


    Fortunately, all cloud service providers provide us with settings that help us
    create new users and assign them privileges.


    Let''s take the Amazon Web Services example to elaborate on this point. The first
    tool that you will come across when you start working with AWS is IAM Identity
    and Access Management Tool:'
  merge: -1
  pgno: 132
- img_proc: true
  md: '![](img/0ba5078687d28877e27a5bc212dacbeb_133_0.png)


    Figure 7.1: AWS view of Identity and Access Management screenshot that the IAM
    tool provides us with


    You can see in options for managing users, groups, roles, policies, etc. Basically
    we can create, edit, delete users, and assign them with roles and groups, which
    will manage what a particular user can access and what cannot. For example, I
    can just assign read-only access to S3 to a particular user, and when I know the
    user does not need any additional access.


    In addition, you can also see that the IAM tool can give recommendations like
    activating Multi-Factor Authentication (MFA) for your accounts, which means that
    users will need to pass through an additional layer of authentication after providing
    a password. This might be an authentication based on some message sent to mobile
    or email; this adds an additional layer of security in case one''s credentials
    are compromised.


    All major cloud providers provide similar tools to manage users and role-based
    access. It is the responsibility of the Admin to make sure that the access and
    rules are managed properly.


    Additionally, the service providers provide us with features like security groups
    and firewalls. Security groups and firewalls allow us to create a set of rules,
    such as, which inbound and outbound access is allowed for a resource.


