    # Application Logs Management


    In the previous section, we talked about some tools provided off the shelf by
    cloud service providers, but at times we want flexibility and do not want to be
    completely dependent on the service providers. Additionally, we would like to
    use some specific capabilities like monitoring our application logs and applying
    rules on top of them. For such cases, it makes sense to look beyond the options
    provided by cloud service providers.


    In this section, we will look at some of the popular options available for monitoring
    and managing application-specific logs.


    # Prometheus


    Prometheus is an open-source tool that can help with monitoring of various'
  merge: -1
  pgno: 175
- img_proc: true
  md: 'application resources. It gathers data in time series format and monitors the
    change in parameters. Written in Go language, the tool can gather data from various
    sources. It provides a set of client libraries that help the application to onboard
    to its monitoring:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_176_0.png)


    **Figure 9.9:** Prometheus architecture


    Image source: https://prometheus.io/docs/introduction/overview/


    As shown in the preceding screenshot, the following are the core components of
    Prometheus architecture:


    # ## Prometheus server


    The server is the core of the architecture, which gathers data from various endpoints.
    Client libraries are provided by the tool, which can be used by various application
    components to expose APIs for data sharing. Prometheus, in this sense, is a white
    box monitoring tool as application onboarding is explicitly giving permission
    and sharing data. Prometheus server collects data at regular intervals and stores
    it locally.


    # ## Pushgateway


    Not every component can expose APIs for sharing data, for example, a batch job
    that runs at certain intervals. The Pushgateway captures the data, transforms
    that'
  merge: -1
  pgno: 176
- img_proc: true
  md: 'data into the Prometheus data format, and then pushes that data onto the Prometheus
    server.


    # Alert Manager


    As we have mentioned time and again, just capturing data and viewing it is the
    job half done. We need a mechanism to convert this data into actionable items.
    Alert Manager in Prometheus helps us set rules based on data collected. Alert
    rules can be configured to send alerts in the form of SMS, Email, and so on.


    # ELK Stack


