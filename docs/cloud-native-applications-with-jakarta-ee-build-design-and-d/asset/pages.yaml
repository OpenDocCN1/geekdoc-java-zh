    manage data in a scalable and reliable manner.


    # Logstash


    It provides connectors for various input sources and platforms. It gathers logs
    from different sources, parses the data, and converts it in a common structure
    that can then be worked upon by Elastic Search.


    # Kibana


    It is a tool that provides various visual options for reporting, like graphs,
    tables, and so on. Reporting dashboards can be created and shared across teams.


