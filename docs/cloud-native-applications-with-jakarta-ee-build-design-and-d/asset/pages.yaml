    be visualized in the form of dashboards or reports. Also, one can set up alerts
    and integrate with tools, like logic apps, that can perform advanced actions like
    triggering any additional application or APIS.


    Figure 9.5 also showcases data sources:


    +   * **Application data**: Data that relates to your custom application code.

    * **Operating System data**: Data from the Windows or Linux virtual machines that
    host your application.

    * **Azure Resources data**: Data that relates to the operations of an Azure resource,
    such as a web app or a load balancer.

    * **Azure Subscription data**: Data that relates to your subscription. It includes
    data about Azure health and availability.

    * **Azure Tenant data**: Data about your Azure organization-level services, such
    as Azure Active Directory.


