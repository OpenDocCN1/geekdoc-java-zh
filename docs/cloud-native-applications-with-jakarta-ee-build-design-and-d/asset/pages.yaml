  md: '# # Summary


    In this chapter, we started by acknowledging the fact that cloud-based development
    needs some additional design consideration to make our application best fit for
    the cloud. We looked into the journey of software design change from monolithic
    architecture to Microservices based architecture. We understood how microservice-based
    application solves many of the issues, we were faced with older monolithic design.
    We understood how microservice-based architectures are the best fit for the cloud.


    Next, we looked into some of the important design considerations when we created
    a system to be deployed on the cloud. We looked into design considerations like
    design for failure, No single point of failure, stay stateless, fail fast, gracefully
    handle failure, think scalability, automation, self-healing system, manage data,
    cache whenever possible, and go asynchronous.


    Lastly, we looked into some of the common mistakes people make when they first
    move to the cloud. We understood how unoptimized usage of resources can impact
    the cost of using cloud, lack of monitoring can result in undetected failures,
    the unoptimized design can let us not complete advantage of the cloud, and not
    exploring all the options available can cause regrets at a later point in development.


    A discussion about cloud is not complete unless we talk about major players providing
    cloud services. In the next chapter, we will look into some of the important cloud
    service providers, and common services provided by them.


    # # Questions


    +   1. What is a monolithic design? What are the disadvantages of this design?

    2. Explain service-oriented architecture.

    3. Explain microservices based design and its advantages, with an example.

    4. What are the important design factors to be considered when designing for cloud?

    5. What are some of the common mistakes committed by teams moving to the cloud?'
