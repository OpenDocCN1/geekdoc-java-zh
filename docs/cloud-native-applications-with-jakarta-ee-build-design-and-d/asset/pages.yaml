    # Managing with Kubernetes


    In the previous subsection, we created an application and deployed it locally
    in the container. As a next step, we will learn how to deploy the same application
    image that we created for the EmployeeData application to our Kubernetes cluster.


    To begin with, we will deploy our application on a pod:


    ```

    $ kubectl create deployment my-app --nimage=kamaleet/dockerhub:mywebappppush

    ```


    In the preceding command, we are using kubectl to create deployment for the image
    kamaleet/dockerhub:mywebappppush as my-app.


    To check if our command worked, we will see if the new node was created:


    ```

    $ kubectl get pods

    ```


    The preceding command shows that our pod is in a running state. So, ideally our
    application is deployed correctly. Finally, we will expose the application, so
    that it can be accessed through browser:


    ```

    $ kubectl expose deployment my-app --name=my-app-service --type=LoadBalancer --port
    80 --target-port 8080

    ```'
