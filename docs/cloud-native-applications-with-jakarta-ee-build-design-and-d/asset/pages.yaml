    # # Integration testing


    In the previous section, we talked about unit testing, which meant we wanted to
    test a unit of code independently. We also discussed how we can mock the services,
    which are not related to the current unit. Integration testing, as the name suggests,
    focuses on completely different aspects, that is, how code units work together.
    If a service is dependent on another service, we will need to make sure the services
    work fine with each other. In other words, we will not be mocking the services
    or code units but making sure that all pieces work together when they rely on
    each other.


    If we go back to the previous example, where we mocked the EmployeeFinance Service
    call when testing EmployeeService, we actually let the test execute actual EmployeeFinanceService,
    and rely on the actual response. One major advantage of this type of testing is
    that we will come to know how the application will work in a production environment.
    We are also encouraged to think about the cases, where the service on which we
    are dependent is not responding. Our code handling such a situation? Have we adequately
    added retry logic? Do we have timeouts in place? Do we have Circuit breakers and
    fail fast techniques implemented?


    One major area, where integration testing is used with database layer testing.
    In unit testing, one would mock the data layer calls to focus on just application
    logic. While doing integration testing, we tend to build a test database of which
    our test cases run. So, we can have a complete test suite, where we first add
    a new Employee to the database, have Get and Get all tested against the test database,
    which helps us to make sure that even the data layer is working fine.


    # # Service Testing


    In the unit testing section, we investigated the ways of testing an independent
    unit of code. Service testing is more about testing service as a whole. So, we'
