    design when we are building for the Cloud. But, before we get our hands dirty
    with the actual code and deployments, it makes sense to understand what our options
    are with respect to cloud service providers. Cloud service providers are companies
    that provide us with the cloud infrastructure and related services. We will get
    many tools off the shelf, which will help us develop for the Cloud and deploy
    to the Cloud.


    In this chapter, we will learn about some of the important cloud service providers.
    The top two cloud service providers right now are Amazon Web Services, AWS, and
    Microsoft’s Azure. Google Cloud is another player that is making good progress.
    In this chapter, we will look into these players and get an overview of some of
    the additional cloud service providers.


    # Structure


    +   - Amazon Web Services

    - Microsoft’s Azure

    - Google Cloud

    - Other important players


    # Objectives


    There will be times in a software developer and architect’s career, when one needs
    to make a decision about choosing a cloud service provider for the project. One
    needs to understand which options are available to choose from, and what services
    these providers provide. Only with the complete knowledge, one can make a well-informed
    decision. We will look at the core services provided by top service providers
    in this chapter.


    # Amazon Web Services'
