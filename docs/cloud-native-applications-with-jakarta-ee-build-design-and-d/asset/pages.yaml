  md: '# CHAPTER 9


    # Monitoring, Alerting, and Reporting


    Monitoring, alerting, and reporting are very important nonfunctional requirements
    for any application. As these requirements are not visible to end-users, they
    get neglected or de-prioritized at times. One needs to pay for this negligence
    once we observe issues on production environments, which could have been handled
    with proper monitoring, alerting, and reporting. To save ourselves from embarrassing
    situations and lose clients due to issues that could have been handled, it is
    important that we build a strong mechanism for monitoring, alerting, and reporting
    in our cloud-native applications.


    # Structure


    +   - Need for monitoring

    - Cloud-based monitoring, alerting, and reporting

    - Application logs management


    # Objectives


    In this chapter, we will focus on monitoring, alerting, and reporting needs for
    our application. We will start with the basics of monitoring, and understand why
    it is important for our applications. We will look into various aspects of our
    application that needs monitoring.


    We will look into cloud-specific monitoring tools available, and how they can
    help us with our alerting and reporting needs. We will take examples from Amazon
    and Azure to understand off-the-shelf tools available for our monitoring needs.
    An important aspect of our deployment needs is the cost that we are paying to
    cloud service providers for our applications. We will understand how we can monitor
    and manage our cloud on the cloud.


    An important area where we need monitoring and reporting is our application logs.
    We will look into some of the popular tools available to manage and monitor our
    logs in this chapter.'
  merge: -1
  pgno: 166
- img_proc: true
  md: '# Need for monitoring


    When your application is deployed to production, the work is only half done. The
    real test for an application is on the production environment, when actual users
    are using it, and when the system is being used in a manner that developers did
    not anticipate. The application is exposed to hackers who would like to misuse
    or bring the application down. The load on application varies dramatically on
    production.


    In a nutshell, what I am trying to highlight is that testing an application in
    a controlled environment is different from how it will be used when it is available
    to the end-user. Our only trusted friend for an application in production is logs
    and monitoring.


    We would like to be proactive to understand what is going wrong with our application.
    We want to know if a service is down or slow


    Following are the main areas which we would like to cover when designing for monitoring:


    +   * Application and Service Health

    * Performance

    * Cost

    * Traffic

    * Errors

    * Exceptions

    * Service and Feature level usage

    * Custom usage


    Another important aspect of monitoring is alerting and reporting. Monitoring is
    just part of the process. We will keep a check that a server is being used beyond
    90% of resources available, and what to do next. We would like to trigger an alert
    to admins or an automated process to handle the situation; for example, bringing
    up additional servers to balance the load in this case. Similarly, we need proper
    reporting in place to analyze the data generated from various application monitoring
    tools.'
  merge: -1
  pgno: 167
- img_proc: true
  md: '# # Cloud-based monitoring, alerting, and reporting


    Cloud service providers very well understand the importance of monitoring, alerting,
    and reporting needs for an application. There are many off-the-shelf tools provided
    by major service providers, which help development teams to keep a watch on what
    is happening with their application. There are reports provided for how the resource
    is being used and billed for our applications deployed on the cloud.


    But like other things, a cloud service provider can only provide the development
    teams with the services and tools. At the end of the day, it is the responsibility
    of the development team to make sure they are using correct tools, configuring
    them properly, and reporting to alerts.


    In this section, we will take a look at the off-the-shelf tools available from
    popular cloud service providers to get an idea of capabilities available for exploration.


    # # Amazon CloudWatch


    Amazon CloudWatch is a one-stop service provided by AWS for all major monitoring
    needs. Here, you can monitor the usage and health of Amazon resources that your
    application is using:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_168_0.png)'
  merge: -1
  pgno: 168
- img_proc: true
  md: '# Figure 9.1: Amazon CloudWatch architecture


    Image source:


    https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudw


    The preceding screenshots explain the design as to how AWS CloudWatch works. A
    resource in AWS publishes data to CloudWatch in the form of metrics. A Metric
    is a structure that contains time-ordered data for various aspects of resources,
    like CPU usage or Memory usage.


    One can set alarms on top of the CloudWatch, which will alert the team in case
    of certain events, for example, if the CPU usage goes beyond 75%. Based on the
    alarm, we will configure an action, such as sending an email notification to admins
    or autoscale the application by adding an additional server to reduce CPU usage.
    In using out-of-the-box available data, one can also publish additional application
    data to CloudWatch for monitoring.


    In addition to alerting, CloudWatch is capable of showing the data in the form
    of graphs and bars. We can create useful dashboards or reports and share them
    with team members for monitoring and observation.


    # Step-by-step example of CloudWatch


    We have looked at what CloudWatch can do for you; let''s set up monitoring for
    an EC2 instance in this section. For EC2, AWS provides a basic CloudWatch configuration,
    which registers every 5 minutes and is enabled by default. If one needs additional
    information, like registering data every minute, one can choose advanced monitoring,
    but this will come at a small price.


    Let''s go to our EC2 dashboard and enable CloudWatch for an existing instance:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_169_0.png)


