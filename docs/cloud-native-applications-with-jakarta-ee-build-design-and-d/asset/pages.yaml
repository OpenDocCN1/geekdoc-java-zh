    Figure 4.2: Eclipse MicroProfile


    Image source –

    https://www.eclipse.org/community/eclipse_newsletter/2018/september/mp_j


    The preceding screenshot shows various specifications by MicroProfile. Blue boxes
    show the specifications taken from J2EE, and orange boxes show the specifications
    added by MicroProfile.


    +   * **Open Tracing**: It provides a standard way of tracing requests across
    multiple services. This can be very useful, when your application grows and multiple
    services are calling each other, as one can easily track the control flow and
    find problematic areas.


    +   * **Open API**: Documenting microservices is an important aspect to make sure
    everyone involved has the same understanding of the service. Open API helps here
    by providing standards for documenting the API.


    +   * **REST Client**: Once your system grows, your services will be calling each
    other to fulfill the required tasks. REST Client provides a type-safe method to
    call other services. You also have the option to auto-generate the clients.


    +   * **Config**: Every application needs some configuration like system properties,
    environment variables, etc. With MicroProfile, you can configure your application
    from outside without the need for repackaging the whole thing.'
