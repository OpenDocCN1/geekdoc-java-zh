    # # Summary


    In this chapter, we talked about scalability and how it can be implemented. Scalability
    is one of the most important areas when designing a cloud native application.
    We started by introducing the concept of scalability, and understood how vertical
    scalability is different from horizontal scalability.


    Next, we investigated cloud-specific areas where we need to maintain scalability.
    We talked about compute scalability, and various services provided by cloud service
    providers to implement it. We looked into database scalability and understood
    how SQL database scale differently from a non-SQL based database. For storage
    scalability, we know that most cloud service providers have off-the-shelf options
    for managing large scale storage, but it is important that we understand various
    options and use them as we need.


    Next, we understood how to design for an application that can scale on a need
    basis. Microservices are a common and popular method to implement a design that
    can scale easily. One microservice can scale independently of the rest of the
    application, which makes microservice-based design best suited for scalability.


    Finally, we created an example showing how our application can scale. We created
    a REST API behind a load balancer. We deployed application to Amazon AWS and used
    its Autoscaling service to help us deploy the application in a manner that it
    can scale out on a need basis.


    In the next chapter, we will look into the monitoring of various types of data
    associated with an application.


