  md: '# CHAPTER 1


    # Introduction to Cloud Computing


    In the last few years, cloud computing has changed the way we use to think about
    software development. This has impacted software design and development in more
    ways than we can imagine. Cloud has helped us take our focus away from hardware
    requirements and constraints, so that we can spend more time and attention on
    other aspects of software development, like performance, scalability, security,
    and so on. In this chapter, we will introduce the concept of Cloud Computing in
    details.


    # Structure


    +   * What is Cloud?

    * Understanding IaaS, PaaS, SaaS and FaaS

    * Major Services provided by Cloud


    # Objectives


    In this chapter, we will start by understanding the basics of cloud. We will understand
    what cloud is and how it is reshaping software development. We will understand
    “Pay as you Go” model, which has a major impact in popularizing the cloud. We
    will understand the concept of regions, zones and data centers.


    A discussion about cloud is incomplete without an understanding of concepts around
    cloud offerings, like Infrastructure as a Service (IaaS), Platform as a Service
    (PaaS), Software as a Service (SaaS), and Functions as a Service (FaaS). We will
    discuss all of these in detail in this chapter. Finally, we will look into some
    important services offered by cloud service providers.


    # What is Cloud?


    A couple of decades ago, deploying a new web application online was a nightmare;
    you would need to buy costly servers, which would be installed on'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'premise hosted on service provider location. High availability was difficult
    to maintain, along with security, managing OS updates, and so on. Also, once bought
    or rented, it was not easy to upgrade or downgrade the configuration.


    Then came an era of virtual machines, which eased the allocation of hardware a
    bit, but still that was costly and you would ideally pay for a year or minimum
    for a month. You would only get raw servers and you were still responsible for
    managing them: security, scalability, backing up systems, installing software,
    databases and so on.


    Finally, to solve all the hardware and infrastructure-related problems, the cloud
    came to the rescue. Now, instead of buying hardware, you could rent it, and that
    too on an hourly basis, or in most cases, you would pay per your usage. You could
    easily scale up or down, both vertically or horizontally. The compute services
    did not just come in the form of virtual machines, but also services like serverless
    functions, direct deployment of web applications, and microservices. Additionally,
    services are available for storage in files, data objects, queues, tables, databases,
    and so on.


    One can set up virtual networks easily and manage access to resources. Security
    is provided as off the shelf service in most of the cloud-based solutions. Performance
    monitoring and scalability are a few other services that are built into the cloud.


    We will keep on exploring the features provided by the cloud throughout the book.
    A major point to understand here is that the cloud has changed the way we used
    to think about software design and development. The factors like scalability,
    security, performance, monitoring, authentication, and role-based access are features
    that one can get off the shelf and do not have worry about now.


    # # Pay As You Go


    A discussion about Cloud Computing is incomplete without understanding the concept
    of Pay as you Go model. “Pay as you Go” has played a very important role in popularizing
    cloud services. The idea behind the concept is that you will need to pay only
    for the resources you have used.


    For example, if you want to buy a new computer, you first need to buy it and only
    then you can use it. Whereas, on the cloud, if you want to use a virtual machine,
    you can rent it for the time you need, and pay based on your usage. Say, I need
    a quad-core, 32 GB RAM to run a sample code and validate some'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'fixes. I can just go to the cloud service provider portal, checkout a virtual
    machine, deploy my application, test it, and when I am satisfied, I will shut
    down the virtual machine. I will end up only paying for the time I have used the
    machine for.


    You can scale up and scale down the resources easily, mostly in an automated manner.
    This helps you manage your resources on a need basis. So when my website is new
    and I am not expecting a lot of traffic, I can start with a cheap power machine,
    and deploy my application for probably a couple of dollars, or sometimes a free
    tier resource might be sufficient (most of the cloud service providers have a
    free tier resource to encourage users to try out the services). As I see the load
    increasing on my website, I can easily scale up my hardware vertically, by adding
    hardware power or horizontally-adding additional machines, without much effort.
    At this time, I probably don''t mind paying a few extra dollars, as I already
    have got traffic on my website.


    As you can see, this kind of cost model is a boon for users to try out and experiment
    with things, which otherwise would have been impossible to cost factors.


    # How does cloud work?


    Another important aspect of the cloud that you need to understand before getting
    started is how the resources are managed. You must have the following questions:
    If data is being stored on the cloud, where is it actually storing? Where is my
    application actually being installed? How does the cloud make sure my data is
    not lost? How does it guarantee high availability?


    To answer all these questions, we need to know how the resources are managed in
    the cloud. At the ground level, we have data centers. Data centers are the physical
    places, where all the hardware systems are setup. Next comes the concept of Availability
    Zones or AZs. Most cloud service providers will set up one or more data center
    in an AZ. The next level is Regions; again one region can have one or more Availability
    Zones. Each availability zone in a region has redundant and separate power, networking,
    and connectivity to reduce the probability of multiple AZs failing in a region
    simultaneously.


    The following screenshot shows the concept of regions, zone, and data centers
    in cloud:'
  merge: -1
  pgno: 24
- img_proc: true
  md: '![](img/0ba5078687d28877e27a5bc212dacbeb_25_0.png)


    **Figure 1.1:** Understanding Regions, Zones, and Data Centers


    The preceding sherentshot shows how Regions, Zones, and Data Centers are implemented.
    Actual implementation and naming might be different in different Cloud Service
    providers, but the core idea will always remain the same.


    Now, the question is, why is it important to understand how the cloud service
    provider is managing resources. When you try to create any resource in the cloud,
    the first thing you will be asked is, which region you would like to use. For
    example, if we look for US regions in **AWS (Amazon Web Services)**, we will find
    the following options, N. Virginia, Ohio, N. California, Oregon. It is important
    to make the right choice here, because not all the services provided by cloud
    providers are available in all the regions. The second important aspect to consider
    is the target audience location; you would not like to host an application in
    Japan if you know all your traffic is from the U.S. to have performance benefits.


    One important to understand the concept of Regions and Availability Zones it to
    formulate your replication and backup strategy. For example, if you are expecting
    traffic from multiple locations, you might want to formulate a strategy to keep
    data stores in different regions that can cater to that region. Also, while taking
    a backup, you will need to understand if the data is very'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'critical; you may want to duplicate across the regions to avoid losing data
    in case there is a problem in one region.


    # Major service providers for Cloud


    The first major player that comes up, when we start discussing the cloud service
    providers is Amazon Web Services or AWS, a subsidiary of Amazon. It was launched
    in 2006, and currently provides more than 100 cloud-based services. The other
    two major players in the cloud area are Microsoft’s Azure and Google Cloud. We
    will discuss more on these and a few other major Cloud service providers in Chapter
    3.


    # Understanding IaaS, PaaS, SaaS, and FaaS


    At a high level, we can divide services provided by cloud in categories based
    on the following types:


    +   - Infrastructure as a service (IaaS)

    - Platform as a Service (PaaS)

    - Software as a Service (SaaS)

    - Functions as a Service (FaaS)


    To understand these services in more detail, let’s take a step back, and understand
    how things used to be before Cloud.


    # Traditional software development and deployment


    Before the era of the cloud, you were required to maintain your hardware, software,
    security, performance, and so on. You were responsible for getting server hardware,
    then installing the operating system and drivers, firewalls, user access rules,
    and so on. After that, you were responsible for adding any tools or libraries
    needed for your application to run; any web or application servers needed for
    your application; infrastructure and software for your databases, File systems,
    Message Bus, and so on. Finally, you were to set up your application and test
    it, and manage who could access the application. If you needed more servers, you
    were responsible for managing intra-server communications, creating clusters,
    and monitoring their performances.


    The following screenshot highlights various aspects of software development:'
  merge: -1
  pgno: 26
- img_proc: true
  md: '![](img/0ba5078687d28877e27a5bc212dacbeb_27_0.png)


    **Figure 1.2:** On-premise deployment of an application


    The preceding screenshot helps us understand that everything related to the application,
    from hardware to user data, is the responsibility of the application team, in
    case of traditional approach. We will take another look at this picture, as we
    move on to different categories of cloud services.


    From the screenshot, it looks like a lot of work to manage the application in
    a traditional manner, isn''t it? Now, let''s take a look at various service categorizations
    and understand how they help reduce our work.


    # Infrastructure as a Service'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'IaaS or Infrastructure as a Service is a set of services provided by the cloud
    with bare minimum hardware needs. For example, you can get a virtual machine with
    required hardware requirements, on which you can deploy, and manage OS and software
    as per your needs.


    Let''s revisit the aspects we saw in the preceding figure 1.2:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_28_0.png)


    Figure 1.3: Infrastructure as a Service


    As you can see in the preceding screenshot, when a user is opting for an IaaS
    service, the hardware resources and networking needs are taken care of by cloud
    service providers and the user would be responsible for managing OS,'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'middleware, runtime, application, and data.


    # Platform as a Service


    The next level to IaaS is PaaS or Platform as a Service. While, in IaaS, mostly
    hardware-level requirements were being managed by the cloud service providers,
    in the case of PaaS, basic software and runtime are also provided by the service
    provider.


    The following screenshot revisits development aspects for PaaS:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_29_0.png)


    The preceding screenshot clearly shows that in the case of PaaS, all a user needs
    to take care of is is the application and related data. All the underlying'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'requirements are fulfilled by the cloud service provider, like managing OS,
    middleware, and Runtime environments. Amazon’s Elastic Beananstalk is one good
    example of Platform as a Service, where users can just upload the application,
    and AWS takes care of capacity provisioning, Load Balancing, scaling, and application
    health monitoring. Another similar example is Microsoft Azure Service Fabric,
    where one can directly deploy the application code on the cloud, without worrying
    about the infrastructure underneath.


    # Software as a Service


    Software as a Service, or SaaS, means that you are provided with software to use,
    without worrying about the underlying complexity of implementing, hardware, OS,
    application, or data. You don’t own any code or data; all you need to log into
    an SaaS service online and use it. In simple words—Login and Use. Think of an
    email service provider like Gmail – you need to worry about how things are working
    behind the scenes? How security, performance, and scalability is being managed?
    No. All you need to do is open the website, log into the service, and use it.


