  md: '# Deploying to the cloud


    There are multiple ways in which one can deploy microservices to the cloud. A

    production application will be using multiple resources on the cloud to deploy

    various microservices. In this section, we will look into some of the common

    ways to deploy microservices on the cloud. In addition, we will also see how to

    deploy a sample microservice on a virtual machine.


    # Ways to deploy on the cloud


    Virtual Machines: Perhaps the most basic way to deploy a microservice or an

    application is on virtual machine or VM. The virtual machine is nothing but a

    machine or server that is provided on the cloud. So when we deploy our service

    a a virtual machine, we will see that it is more or less similar to deploying
    on a

    local machine.


    Virtual machines are the most basic service type provided by cloud

    service providers. You can choose the configuration you need, including CPU,

    RAM, hard disk, and so on. You can choose the operating system you want to

    use, and in addition, you can also choose from specific images that come with

    pre-deployed software and configurations.


    One must be careful when choosing a virtual machine specification, as the cost

    will change based on your hardware and software-related choices.


