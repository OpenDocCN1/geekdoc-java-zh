  md: '# CHAPTER 11

    Serverless Computing


    We have talked about the implementation of cloud-native design using microservices
    in this book. We looked into the deployment of these services using virtual machines,
    and also implemented a container-based approach. In this chapter, we will get
    into details of serverless computing and understand its usage with the help of
    some examples.


    # Structure


    +   * Serverless Computing: An Introduction

    * Functions as a Service

    * Advanced Examples for Serverless Computing


    # Objectives


    We will start the chapter with an introduction to serverless computing. Serverless
    computing helps us outsource infrastructural needs so our development teams can
    focus more on core features. The most popular form of Serverless compute is functions.
    We will look into details of Functions as a Service implementation in this chapter.
    We will take an example of functions implementation. We will also look into some
    advanced concepts like using additional cloud services, along with functions with
    the help of a code example.


    # Serverless Computing – An Introduction


    So far in this book we have talked about how to think in a cloud-native manner
    and design applications for the cloud. We also looked into various approaches
    to build applications for the cloud. The most common way for developing applications
    and microservices is still virtual machine-based deployments. In the previous
    chapter, we discussed container-based development for microservices that is gaining
    a lot of popularity, as it gives us options like scalability, fault tolerance,
    load balancing off the shelf, and at the same time helps us with'
  merge: -1
  pgno: 201
- img_proc: true
  md: 'optimal usage of infrastructure.


    One common factor that you can observe in the implementations that we have discussed
    so far is that somewhere we are responsible for provisioning infrastructure, scalability,
    managing cost, and so on. What if the development teams can focus strictly on
    code and someone else takes care of all infrastructure setup and scaling needs?
    With this thought, Cloud service providers have come up with the concept of Serverless
    computing.


    A word of caution here; when we use the serverless, one needs to be a bit careful.
    Serverless here does not mean without a server, as the term might mislead you
    to think. Serverless computing very much works on the age-old server-based deployment
    of services, but the change here is that infrastructure setup is owned by the
    cloud service providers.


    The thought process behind the whole concept of going serverless is that the development
    teams can completely focus on developing code and services, and all the infrastructure
    handling will be given off the by cloud service providers. There are multiple
    services provided by the cloud, which fall into the umbrella term “serverless”.
    The services can be in the form of Compute, File storage, data storage, messaging
    services, and so on.


    The most common example of serverless computing is Functions as a Service (FaaS).
    In fact, most Functions are treated as synonyms with serverless computing. All
    major cloud service providers have “Functions as a Service” offering; for example,
    Amazon has AWS Lambda, Microsoft gives us Azure Functions, and Google has Google
    Cloud functions. For the sake of this chapter, we will take AWS Lambda as a base
    for our examples, but readers are free to use Azure Functions, Google Cloud Functions,
    or any other serverless implementation.


    We will start with some simple examples of FaaS, and then move onto the advanced
    implementation of Serverless compute offerings.


    # Functions as a Service


    As already highlighted, when we talk about serverless computing, we are focusing
    on the fact that all our infrastructure setup is being handled by cloud service
    providers. Think of a scenario where your development team can just write the
    code, and don’t worry about the application server on which this is going to execute,
    and how this will scale up or down in case of a change in the external load. What
    if you are expecting less of a load? Do still need to'
  merge: -1
  pgno: 202
- img_proc: true
  md: 'provision hardware on the cloud and pay for it? What if we can have a mechanism
    where we only pay for the compute power we used? Functions as a Service is the
    answer to all our worries.


    When are using a SaaS approach, the cloud service provider gives you a flexibility,
    so that all you need to do is bring your code and upload it to the FaaS service.
    We are not really worried about the underlying infrastructure or even application
    servers.


    Let’s take a look at some of the advantages and disadvantages of the FaaS approach,
    and then we will create an example to help us get a feel of the Functions as a
    Service.


    # Advantages of FaaS


    +   - **Cost**: The first advantage you get when going for Functions implementation
    is low cost. Usually, you are only paying for resources that you are using, as
    there is no need for provisioning infrastructure beforehand.


    +   - **Scalability**: You get scalability off the shelf when you are going for
    functions based implementation. Your cloud service provider will automatically
    help your functions scale up or down on a need basis.


    +   - **Ease of development**: Since now your team can focus completely on core
    feature development without worrying about deployment or scalability needs, you
    have more time to focus on real business problems.


    # Disadvantages of FaaS


    +   - **Vendor Lock-in**: This can be one major problem, as most cloud service
    providers will want you to write a wrapper code specific to their FaaS service.
    So, it is not easy to take your code from one service provider to another and
    redeploy the code.


    +   - **Cold Starts**: As the cloud service provider is now managing the scalability
    of the functions, there might be a scenario when a request coming has to wait
    for function instance, as you are not pre-provisioning the infrastructure.


    # AWS Lambda Example'
