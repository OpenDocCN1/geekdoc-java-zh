  md: '# # CHAPTER 8

    Scalability


    A few years ago, during the pre-cloud era, was to be precise, scaling an application
    was a nightmare. Hardware was costly, and upgrading hardware was a big task in
    itself. Cloud has made our life easier, acquiring hardware is simple and scaling
    up or down your application can be done in an automated manner. Though we have
    a lot of options available for automated scaling with cloud, it is equally important
    to implement the scalability properly. In this chapter, we will focus on the various
    scalability aspects for an application, like Compute, Database, and storage scalability.


    # ## Structure


    +   - Introduction to scalability

    - Cloud-based scalability

    - Design for scalability

    - An example implementation of a scalable application


    # ## Objectives


    In this chapter, we will discuss how to scale the applications. One major advantage
    of going for cloud-native applications is their ability to scale well; but for
    an application to be scalable, we need to make sure that they are built and designed
    to be scaled easily. We will investigate the features provided by the cloud, which
    can help us make our applications scalable. Finally, we will look into a code
    example to see scalability in action on the cloud.


    # ## Introduction to scalability


    Scalability might be a popular word, but a more appropriate term would be elasticity.
    As the name suggests, elastic means something that can grow and shrink on a need
    basis. That is what you are looking for when you implement scalability in your
    application, that you should be able to add or remove'
  merge: -1
  pgno: 150
- img_proc: true
  md: 'resources on a need basis. The bottom line for the whole process is that you
    want to pay only for the resources you are using. You do not want to pay for unutilized
    infrastructure, but at the same time, you do not want your end-users getting impacted
    because of the scarcity of the compute or the storage resources.

    The problem mentioned earlier about striking the right balance between cost and
    productivity is challenging, but with careful design and implementation, it can
    be achieved. Before getting into details, we should get ourselves familiar with
    a few core terms.


    **Vertical scaling:** The most obvious way to add more power for application is
    to upgrade the infrastructure; for example, if you were 16 GB RAM earlier, add
    another chip of 16 GB. This is a helpful way of scaling the infrastructure, but
    as we can see, this type of scalability is costly (getting higher capability machines),
    and of course has hard limits as you can add resources up to a limit.


    The following figure showcases the concept of vertical scaling:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_151_0.png)'
  merge: -1
  pgno: 151
- img_proc: true
  md: 'Figure 8.1: Vertical scaling


    **Horizontal scaling:** Horizontal scaling, on the other hand, means adding additional
    resources for existing service or application. This is usually cheaper, as it
    is cheap to get multiple low configuration machines than a high configuration
    machine.


    The following screenshot highlights the concept of horizontal scaling:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_152_0.png)


    Figure 8.2: Horizontal scaling


    No points for guessing that vertical scaling has its limit and is costly. It is
    also hard to scale up vertically without any downtime, as most cloud providers
    would need a system restart when upgrading the capacity of a machine.


    So, when we talk about designing an application that can support scaling, we are
    mostly worried about horizontal scaling.


    # # Cloud-based scalability'
  merge: -1
  pgno: 152
- img_proc: true
  md: 'As I have already mentioned at the beginning of this chapter, cloud has made
    scalability really easy; one contributing factor is that we have so many out-of-the-box
    solutions, which help us design scalable applications.


    There are solutions that scale on their own without any special work from the
    development team side; for example, serverless code. AWS provides Lambda functions
    and Microsoft Azure provides Functions, which let you develop code in the form
    of functions that can be deployed directly on the cloud, without the need for
    setting up VMs or webservers. The idea is that a developer can only focus on coding
    needs. How it is deployed and scaled is completely on the cloud service providers.


    When we think about an application, the three core areas in terms of infrastructure
    that come to mind are **Compute, Database, and File Storage:**


    ![](img/0ba5078687d28877e27a5bc212dacbeb_153_0.png)


    Figure 8.3: Application infrastructure in the cloud


    We will look into these three areas in detail now, and see how the cloud service
    providers help us in scaling each of these three core aspects.


    # # Compute scalability


    Compute is mostly the area where your application code is deployed. The first'
  merge: -1
  pgno: 153
- img_proc: true
  md: 'compute option that anyone will come across when boarding cloud is virtual
    machines. It is as good as any physical machine where you can deploy your code.
    Most cloud services provide options like creating scale units and nodes, where
    you can specify how you want to scale your application. A simple rule can be to
    start the infrastructure to be set up as initial machines, and add a machine when
    CPU usage goes beyond 75%. You can add these machines behind a load balancer,
    which will make the load is distributed evenly among all the machines. As this
    is the most common way to achieve scalability in the cloud, we will look into
    details in the last section of this chapter, where we will look into code example
    of scalability.


    By understanding the developer''s need, cloud service provider gives us a lot
    of different options to deploy our code; for example, we have serverless functions
    which help us deploy our piece of code without worrying about underlying infrastructure
    and scalability. We will cover Serverless Computing in Chapter 11. Similarly,
    there are options like setting up batch jobs to take care of background jobs,
    which can run independently, and then there are off-the-shelf application deployment
    options provided by various cloud service providers.


    Also, with the popularity of container-based deployments, all cloud service providers
    have off-the-shelf offering for Docker and Kubernetes for deploying and managing
    container-based infrastructure. We will cover containers in detail in Chapter
    10.


    We see that there are multiple options to manage compute scalability in the cloud,
    but it is the onus of the development team to make sure that they understand all
    the options provided by the cloud service provider, and use appropriate services
    that are useful for the application developed.


    # Database scalability


    After the compute services, the next important aspect for any application is a
    database. At the end of the day, the most important task your application does
    is to process, manage, and store data. Historically, the database is the most
    difficult to scale in an application, reason being, most of the time you want
    to keep your data at a single location to manage ACID properties, namely Atomicity,
    Consistency, Isolation, and Durability. Having all the data on a single machine
    has challenges as you can grow the single machine up to a certain limit. Sharding
    is a popular mechanism that helps to scale an SQL database, where the data is
    divided logically into different machines.


    With the popularity of No-SQL based databases, scalability has become less of
    a'
  merge: -1
  pgno: 154
- img_proc: true
  md: 'challenge as it becomes easier to add extra infrastructure to scale the database.
    All major cloud service providers have options for choosing between No-SQL and
    SQL based database storage. Again, one needs to understand the offering from the
    cloud service provider being used, and choose the best options available for database,
    backup, and replication.


    # Storage scalability


    Most cloud service providers give us off-the-shelf storage options like Amazon’s
    S3 and Azure storage. These services give us options for scalability, backups,
    and replication. The services also provide options for encryption and security.
    It makes sense to design the system in a manner that all the important data is
    stored in these external managed storage options rather than directly on disks.
    Additionally, these services have various options, which will provide different
    cost benefits, based on the kind of usage; for example, one can choose cheaper
    storage options where data is not in use frequently.


    # Design for scalability


    So far in this chapter, we have talked about scalability and how cloud service
    providers help us achieve it by providing a set of services. But one thing we
    are consistently saying is that no matter how many services this cloud service
    providers provide, at the end of the day, it is the responsibility of the design
    and development team to make sure the application is built and deployed in a manner
    that is scalable.


    The following figure shows a scenario where application is handling normal load:'
  merge: -1
  pgno: 155
- img_proc: true
  md: '![](img/0ba5078687d28877e27a5bc212dacbeb_156_0.png)


    When designing for scalability, we would like to make sure that our system scales
    out automatically.


    The following screenshot shows the scenario where application is handling a high
    load:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_156_1.png)


    When we talk about a scalable design, the first and most important thing that
    stands out is microservices. A microservice is the smallest independent part of
    the application, which can achieve a task in a standalone manner. A microservice
    can be scaled in or out independently of the rest of the application, which makes
    it the most suitable design approach when we talk about scalability:'
