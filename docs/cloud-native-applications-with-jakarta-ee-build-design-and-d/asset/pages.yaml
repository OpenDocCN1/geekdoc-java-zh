- img_proc: true
  md: '# Cloud-native development


    To begin with, let''s revisit our understanding of cloud-native applications.
    With the popularity of the cloud, various terms have been popularized, like cloud-based
    applications, cloud-ready applications, cloud-first applications, and, of course,
    cloud-native applications. The core idea here is to design applications that can
    make use of capabilities provided to us by the cloud to make our applications
    more robust.


    Traditionally, we have been developing applications for on-prem infrastructure,
    where we usually followed a monolith design approach. Cloud has made our life
    a lot easier with various offerings like Infrastructure as a Service (IaaS), Software
    as a Service (SAAS), Platform as a Service (PAAS), and Functions as a Service
    (FAAS). Container-based application deployment and scaling has been another core
    area popular, when we think about cloud-native applications. All these practices
    also changed the way we used to think of application design. Additionally, it
    has impacted our development practices. Throughout the book, we have talked about
    various aspects that stand out in cloud-native development. We started our discussion
    with Microservices-based architecture. Microservices-based design has been a game-changer
    in the past few years, and has completely changed the way we use to develop our
    applications.


    Another important factor in cloud-native application development has been Automation.
    We try to automate the process of application development, deployment, and monitoring
    as much as possible. We talked about Test automation, deployment, and integration
    automation through CI and CD, and also automating the process of scaling the applications.


    Cloud has changed the way we used to think about application development and deployment
    processes. An important example of this change is container-driven development,
    which we discussed in this book. Containers have changed the way we used to think
    about microservices deployment and orchestration. Tools like Docker and Kubernetes
    have made sure that developers can focus on solving coding problems, and microservices
    scaling, managing, versioning, etc., can be handled easily. Similar to Container-based
    development, serverless computing has been making development teams'' life easier
    by managing the infrastructure handling part.


    # 12-factor application'
  merge: -1
  pgno: 219
- img_proc: true
  md: 'When building an application for the cloud, there are many best practices which
    one should follow. These best practices might vary from team to team and project
    to project. But there are a few practices that are universally accepted. https://12factor.net/
    site mentions 12 factors that should be considered, while one creating an application
    to be built as Software as a Service on cloud. These 12 factors are considered
    as good starting points, when one starts thinking about creating an application
    that will be developed in a distributed manner with the help of services and microservices.


    We will briefly look into these 12 factors:


    # Factor 1 – Codebase


    One codebase tracked in revision control, many deploys


    The basic rule for any application - have your code managed by a version control
    system, so that you can manage and tag various versions of your application or
    easily in separate repositories, so that they can be managed, built, and deployed
    independently. The same repository for a service or application will serve different
    deployment environments.


    # Factor 2 – Dependencies


    Explicit declare and isolate dependencies


    An application cannot exist independently, that is, there will be some external
    dependencies like libraries this application is using, database drivers, and third-party
    applications or services being used by our application. Your application should
    clearly clear out any dependencies it has. These dependencies should be isolated,
    and should not impact the application code as; for example, if a third party service,
    which is used by our application, gets updated, it should not impact our application
    code.


    # Factor 3 – Config


    Store config in the environment


    Your application has many configurations that will depend on the environment on
    which it is being deployed. The environment, in this context, can refer to the
    dev environment, test, performance, pre-production, production environment, and
    so on. At times people keep configuration elements in the repository itself,'
  merge: -1
  pgno: 220
- img_proc: true
  md: 'which can have multi-fold issues. Firstly, a change in a configuration value
    will mean that the application needs to be built and deployed again. Secondly,
    a developer can make a mistake and update the incorrect configuration values.
    To avoid these issues, it is strongly recommended that your code should never
    have any configurations provided, and they should be managed at the environment
    level.


    # Factor 4 – Backing services


    Treat backing services as attached resources


    This principle for building a 12-factor app suggests that all the backing services
    should be treated as resources. The backing services can refer to external services
    like database, storage, message queues, and so on. The idea here is to consider
    these backing services as externalized resources that can be configured easily.
    For example, if our application used a Queueing system and we move from rabbitMQ
    to ActiveMQ, this should be achievable by just updating the configuration.


    # Factor 5 – Build, release, run


    Strictly separate build and run stages


    The idea here is to break the deployment into clearly defined stages of build,
    release, and run. A build stage will generally result in a jar, war, or an ear
    file which can then be deployed on any environment. We already highlighted the
    separation of environment variables, which constitutes the release phase, where
    we take a specific build and combine with configuration needed for the environment.
    Finally, the release is run; for example, during the run phase, a Docker image
    is deployed to a container on a specific environment.


    # Factor 6 – Processes


    Execute the app as one or more stateless processes


    If you are going to build an application or service that needs to be scalable
    or deployed in a cluster, we need to make sure your application can be looked
    at as a stateless process. Imagine how painful it can be sharing state across
    different instances of service or application. You might get stuck with sticky
    sessions, which are a hindrance to a true auto-scaling mechanism. So it is always
    better to externalize state management rather than keeping it in code.'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# # Factor 7 – Port binding


    Export services via port binding

    To keep our application loosely coupled, it is recommended each service be bound
    to a port. As we highlighted in factor 4, where it was mentioned to consider backing
    services available through a URL, similarly, each separate service in your application
    should be accessible through a URL. For example, on the local system, you might
    be able to access a service as localhost:<<port number>>,, for the external user,
    the routing will be done using a routing layer.


    # # Factor 8 – Concurrency


    Scale out via the process model

    An application can be scaled in two ways, vertical scaling and horizontal scaling.
    In the vertical scaling approach, we add more hardware power like adding RAM or
    CPU to the same machine. But this type of scaling has its limit and is usually
    costly. So, it is recommended that your application should be able to horizontally
    scale, that is, more instances or nodes can be added to the application cluster,
    and your load can be easily distributed among these nodes.


    # # Factor 9 – Disposability


    Say, one of the nodes on which the application was deployed starts throwing errors
    or has become slow. You should be able to remove this instance from the deployment,
    and other instances should be able to respond to this event and handle the load
    gracefully. In this way, we can manage failure and scale the application in a
    graceful manner. We can kill instances and bring new instances without impacting
    the end-user.


    # # Factor 10 – Dev/prod parity


    Keep development, staging, and production as similar as possible

    There are instances, when in your application development lifecycle, you observe
    issues like one feature working in one environment but error out in another. While
    the build version deployed in both environments is the same. The issue can be
    in the underlying environment or settings; for example, the two environments have
    different versions of a specific library or tool. Hence,'
  merge: -1
  pgno: 222
- img_proc: true
  md: 'principle becomes very important, as it forces us to make sure our environments
    on which we are deploying the application, like a development environment, test,
    staging, or production environment, are similar. This avoids situations where
    things are working on one environment but not on others.


    # # Factor 11 – Logs


    Treat logs as event streams


    We have already emphasized on logging and monitoring needs, when it comes to a
    cloud-native application, unlike Chapter 9. In a distributed system, it is very
    difficult to debug an application as, unlike a monolithic application, different
    actions are happening across different services, and events are logged at different
    places. To overcome this problem, it is suggested to treat logs as event streams
    and store them in a centralized position. Your application instances are going
    up and down due to scalability needs or system errors, but you will be able to
    capture and manage logs centrally. You can develop central dashboards to monitor
    various activities happening different nodes and services easily.


    # # Factor 12 – Admin processes


    Run admin/management tasks as one-off processes


    Admin tasks can be tasks like backing up a database. This principle says that
    these kinds of admin tasks should be treated as one-off processes, and handled
    separately from the core application. For example, you do not want to run the
    process backing up the database on the same machine as where your main application
    server handling end-user requests is running.


    # # Common design patterns for Cloud-native applications


    We have been talking about best practices for building a cloud-native application
    throughout this book. There is no silver bullet when we talk about designing a
    cloud-native application, but fortunately, cloud-native applications are being
    built for a long time now, and many good patterns are observed that can solve
    commonly occurring issues. In this section, let''s take a look at some of these
    design patterns, which one should consider while building a cloud-native application.'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# SAGA pattern


    There will be times when multiple microservices are involved in completing one
    transaction. A very classic example is when you place an order on an e-commerce
    site. The whole process includes multiple steps, either visible or invisible to
    the end-user. Let''s take a look at a simplified workflow for order-placement
    at an e-commerce site:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_224_0.png)


    Figure 12.1: Order placement flow


    The preceding screenshot shows a process where an order is placed on an e-commerce
    site. Following are the steps involved, as depicted by numbers in the preceding
    screenshot:


    +   1. User clicks a button to place an order.

    2. Payment service is triggered, the user will usually be shown payment options,
    or a pre-stored option is chosen. The user confirms the option and provides details.

    3. Once the payment is successful, Inventory service is triggered where the order
    is confirmed and inventory is updated. At the same time, order service is also
    updated with payment successful message.

    4. When the order is confirmed at the Inventory service, shipment service is triggered
    to start the shipment process. At this point, a final order confirmation is sent
    back to the order service.

    5. Once the shipment service initiates the shipment, it sends the shipment status
    to the order service, which can be shared with the end-user.


    As we see, the whole end-to-end transaction is a combination of multiple steps.
    There can be issues happening at any service level, as the payment was not successful
    or the order could not be confirmed at the inventory level, and we need to revert
    the payment. To manage this kind of processing, we have two popular ways – choreography
    and orchestration.


    # Choreography based SAGA


    Let’s first take a look at choreography-based implementation of SAGA. This is'
  merge: -1
  pgno: 224
- img_proc: true
  md: 'achieved by event-driven communication across various services. Each service
    publishes events to the queue, which is listened to by the interested services.
    listener services will perform actions based on the data received.


    Looking back at the e-commerce problem:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_225_0.png)


    The preceding screenshot showcases how event-based communication helps our order
    flow. Let''s relook at the flow now:


    +   - Order is received from the user

    - Order service publishes an event say, Order_Receieved. This event is listened
    to by the Payment service, which triggers the payment flow.

    - On successful payment, payment service triggers event, Payment_Successful. This
    event is listened to by Inventory service to process the order, as well as Order
    service to update the payment status. Both initiate their flows based on this
    event.

    - Inventory service publishes an event, Order_Processed_By_Inventory, this event
    is listened to by Shipment service and Order service.

    - Finally, shipment service will publish event, Shipment_Initiated, and further
    Shipment_Status_Updated, which will be listened to by order service.


    # Orchestration-based SAGA


    The central role in this type implementation is played by an orchestrator. The
    orchestrator service takes control of the overall communication among various
    services. In this case, no service is individually responsible for communication
    with other services or even publishing any events. Let''s take a look at our e-commerce
    order example, and see how orchestration will work in this case:'
  merge: -1
  pgno: 225
- img_proc: true
  md: '![](img/0ba5078687d28877e27a5bc212dacbeb_226_0.png)


    As we can see in the preceding screenshot, the central role here is played by
    the

    Orchestrator service. Let''s take a look at what the whole flow step-by-step:


    +   1. Order is placed and Order service is updated

    2. Order service tells orchestrator service that it has received a new order

    3. Orchestrator service initiates payment by informing the payment service

    about the order details

    4. Payment is made and the payment service updates the orchestrator

    5. The orchestrator service now informs the inventory service about the order.

    At the same time, orchestrator service also informs the order service about

    the payment status.

    6. Inventory service confirms order placement to the orchestrator.

    7. Orchestrator, at this point, initiates shipment by sending the request to

    shipment service. orchestrator will inform the order service about

    the current status of the order.

    8. Shipment service informs the orchestrator about the initiation of shipment.

    9. Orchestrator updates order with shipment status.


    # Choreography versus orchestrations


    An obvious question at this point would – Which is a better option to

    implement the SAGA? Well, there is no silver bullet; we will need to consider

    the problem at hand, as both the options can have their pros and cons.


    # Choreography


    Pros:


    +   - Truly a microservice-based approach, as all services are independent of

    each other.'
  merge: -1
  pgno: 226
- img_proc: true
  md: '+   * Event-driven communication keeps services loosely coupled.


    Cons:


    +   * Too many services involved in a process increases complexity.

    * When tens of services are publishing and listening to events, monitoring and
    managing failures can be complicated.


    # Orchestration


    Pros:


    +   * Simplified implementation in terms of code, as complete flow of control
    is defined in a single orchestrator.

    * Monitoring flow is easy as it is controlled from a single service.


    Cons:


    +   * Introduction of an extra service, just for the purpose of controlling the
    flow.

    * Orchestrator service can become a single point of failure as it is guiding other
    services.


    # CQRS - Command Query Responsibility Segregation


    In traditional design, we think of a service to comprise of core data operations,
    that is, CRUD operations to create, read, update, and delete entity details. For
    example, an Employee management service will manage all CRUD operations for Employee
    Entity. CQRS pattern suggests dividing these microservices into two parts, the
    command part and the query part:


    +   * **Command:** Command side handles create, update, and delete part, that
    is manipulation of data.

    * **Query:** Read operations for data are handled under the Query side by using
    materialized views.


    This pattern helps to distribute the load among different microservices. Read
    operations usually are faster in this case, as they are not being interfered by
    other data manipulation operations.


    # Distributed tracing'
  merge: -1
  pgno: 227
- img_proc: true
  md: 'Quite often we run into scenarios where requests span across multiple microservices.
    Each service performs part of the responsibility. The transaction is complete
    only when all the services are done. A major problem with this design is to troubleshoot,
    in case something goes wrong. Where to the issue? Which service is causing the
    problem?


    ![](img/0ba5078687d28877e27a5bc212dacbeb_228_0.png)


    Figure 12.4: Microservices Control Flow


    The preceding screenshot shows a flow from Service A to D. A pattern that is commonly
    used to solve the problem is to introduce a tracking ID. When the request enters
    the system, a trace ID or transaction ID is associated with the request. Each
    service, while calling another service, passes along this ID that is logged along
    any logging being done by these services. This helps track the request step by
    step, and helps understand which service is causing the problem.


    # # Strangler pattern


    There will be different kinds of works that you would be doing when creating cloud-native
    microservices. Sometimes you would be creating a new application, where you will
    design and develop functionalities from scratch. But there would be a lot of applications
    that are already built in the on-prem - monolithic manner, which would need to
    be migrated to a cloud-native application. Looking at the current scenario, a
    lot of organizations are trying to move away from the on-prem monolith approach.


    To achieve this transition, a strangler pattern comes in handy. You would not
    like to remove the old application and move to newer version in one go. The approach
    would be to create a parallel implementation that can run side by side under the
    same URI space. Over time, the new application will strangle or replace the old
    application completely. There will be three phases to such a transition:


    +   - **Transform**: Create a parallel application built-in microservices, cloud-native
    design.


    +   - **Coexist**: Incrementally, you will implement features and transfer traffic
    from older monolithic applications to newly built cloud-native applications.


    +   - **Eliminate**: Completely remove the older version and only maintain the'
  merge: -1
  pgno: 228
- img_proc: true
  md: 'new application.


    # # Service Registry and Discovery Pattern


    We have talked about scenarios where different microservices talk to each other.
    Now, one obvious question in such a communication pattern is how a service knows
    the destination service address or URL. One way to achieve this is through the
    client service who knows the addresses of provider service beforehand. The problem
    with this approach is that it is not at all flexible and scalable. An important
    advantage of the microservices-based design is the scalability and self-healing
    capabilities of the design. That means we will keep on adding and removing nodes
    from a service cluster. So, the calling service cannot rely on predefined addresses
    for the provider services.


    To solve this problem, we implement a service registry and discovery pattern.
    This has two parts; first, we need to register provider services, and then consumer
    services can discover the providers through the registry. A core component of
    this deployment is a service register. A service register is nothing but a database
    that has information about provider services like network addresses:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_229_0.png)


    Figure 12.5: Service Registry


    The preceding screenshot highlights service registry flow. There are two ways
    to achieve the service registration part. One is the self-registry, where the
    provider'
  merge: -1
  pgno: 229
- img_proc: true
  md: 'services are responsible to register themselves with the service registry.
    For example, when a service is scaling up, and a new node is added, it is the
    responsibility of the service to get the new address updated in the service register.
    Similarly, each service keeps on updating its status with the registry, so that
    if a node is down, service registry will come to know that there is no update
    from that particular. The second approach is a third party based approach, where
    the service registry is responsible for keeping the register updated with the
    current health and node status of various services.


    The discovery part is now simple. When a service wants to talk to another service,
    it approaches the service registry and asks for the address of the provider service.
    The service registry provides the consumer service with details of the service
    to be called. A related pattern is an API gateway pattern, where instead of calling
    the provider services directly, the consumer service goes through an API gateway.
    We will talk about this pattern in the next subsection.


    # API Gateway Routing and Aggregator Pattern


    We talked about scenarios where microservices need to talk to each other, and
    also where microservices need to be accessed by the frontend. One pattern usually
    followed for these communications is API gateway. In this pattern, instead of
    directly communicating with microservices, we go through a proxy central layer,
    called API gateway:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_230_0.png)


    Figure 12.6: API Gateway


    The preceding screenshot shows API gateway flow. In this type of communication,
    external calling points or consumer services do not need to know the exact location
    of provider services. This gives us the flexibility that'
  merge: -1
  pgno: 230
- img_proc: true
  md: 'can change the provider addresses or infrastructures without impacting consumers
    as the API gateway layer takes care of managing the updated address. Another advantage
    we are getting here is that we can offload certain responsibilities to API gateway.
    Similarly, as we are not exposing services to external consumers, we can have
    services on HTTP protocol and only the API gateway layer is on HTTPS, so that
    there is no need for all the services to manage a secure SSL certificate.


    One advantage API gateway provides is aggregation of requests. For example, we
    have seen product details page on e-commerce sites, where we have a lot of data
    available, like product description, availability, price, shipping estimates,
    additional recommendations, and so on. All this information is provided by different
    microservices, say /productdetails, /price, /shipping, /recommendations, and so
    on. Now instead of making the consumer frontend application call these services,
    we "product/{id}" and at the API gateway level, we make calls to all the internal
    services, aggregate the data, and send back to the consumer.


    An API gateway can also help with features like caching, API versioning, A/B testing,
    Quota implementation, DDOS, and so on.


    # Blue-Green deployment pattern


    One challenge that we continuously face with production deployments is upgrading
    our services. With tens and hundreds of microservices working together to achieve
    customer goals, it is risky to have any impact on the production system. At the
    same time, you need an approach to deploy your service upgrades as soon as possible,
    with minimum risk and zero downtime.


    A blue-green deployment pattern comes to help in such a scenario:'
  merge: -1
  pgno: 231
- img_proc: true
  md: '![](img/0ba5078687d28877e27a5bc212dacbeb_232_0.png)


    The preceding screenshot shows Blue Green deployment. Let''s say we have an existing
    production environment with nodes having current production deployments, let''s
    call this blue environment. Now, we create a parallel green environment that has
    the latest upgraded code. We want to move traffic to a green environment. The
    idea here is to shift the traffic gradually, rather than in one go. Say, we start
    by moving 10% of the traffic to green nodes. We keep on increasing the percentage
    of traffic on the green environment, and eventually retire the blue environment.


    This approach has multi-fold advantages. One is that we are reducing our risk
    by starting only a small part of the traffic in a newer environment. So, if there
    are any issues that are found on new code, our impact is low and controlled. Additionally,
    we are also making sure that we have zero downtime, as at no point of time our
    production environment is going down.


    # # Sidecar pattern


    As a sidecar is attached to a motorcycle, following a similar concept, sidecar
    pattern allows one to attach extra functionalities to a microservice. Apart from
    core business logic, a microservice needs to implement a lot of supporting code
    for tasks like monitoring, logging, application configurations, circuit breaker,
    and so on. Sidecar pattern helps us move all these additional code out of the
    core application. It helps the microservice to focus on core functionality and
    move all'
  merge: -1
  pgno: 232
- img_proc: true
  md: 'the boilerplate code out:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_233_0.png)


    **Figure 12.8: Sidecar pattern**


    The preceding screenshot shows Sidecar pattern responsibility distribution. A
    very useful implementation of the sidecar pattern is service mesh.


    # ### Service mesh


    Think of a scenario where we need to implement multiple microservices that can
    communicate with each other. In such a scenario, services need to implement various
    aspects like service discovery, timeouts, circuit breakers, logging, and so on.
    Service Mesh helps us move all these boilerplate code out of the core services
    using the sidecar pattern:


    ![](img/0ba5078687d28877e27a5bc212dacbeb_233_1.png)


    **Figure 12.9: Service mesh**

    Image source: https://www.nginx.com/blog/what-is-a-service-mesh/",


    The preceding screenshot shows us a service mesh implementation. Here, sidecar
    also implements proxies for the services. Instead of hitting other services'
  merge: -1
  pgno: 233
- img_proc: true
  md: 'directly, each service now can communicate with each other through sidecars.
    The control plane helps us manage sidecar configurations in a centralized manner.


    # Bulkhead pattern


    The term bulkhead is borrowed from the shipping industry. A bulkhead is an upright
    wall within the hull of a ship. The idea is to isolate a catastrophic event like
    fire or leakage in a part of the ship, so that the remaining areas are safe. We
    try to replicate the same idea when architecting a software application. The idea
    is that even if a service fails or goes down, the rest of the system can work
    fine. In other words, we can restrict failure to one part of the application and
    the remaining features and services work fine. This is usually managed by implementing
    failover scenarios in consumer services, which are taking dependencies on provider
    services.


    # Circuit breaker pattern


    In the world of microservices, we know that a service cannot exist in isolation
    and are mostly dependent on other microservices. Let''s take a simple scenario
    where service A calls Service B, which in turn calls Service C. For a request
    to be successful, all three services need to be healthy and provide responses:


    | Service A | Service B | Service C |


    Figure 12.10: Service Request Response Flow


    The preceding screenshot shows request and response flow among services A, B and
    C. Let''s say for some reason, service C becomes unresponsive. In a case, when
    our service B will make a call to service C, it will receive an error response
    or the request will timeout. Now service C might be overloaded, which is causing
    it to become unresponsive. Our service B unnecessarily calls service C and wastes
    time for the response. In the worst case, it will keep on retrying and overload
    Service C further, which is already under access load; hence, not giving a chance
    to Service C to recover.


    A circuit breaker comes in handy to handle such situations. A circuit breaker
    code implemented at calling service keeps a track of failures from provider services.
    For example, we can add a rule that, if service C has failed five times consecutively,
    we stop calling service C. Instead, service B now triggers'
  merge: -1
  pgno: 234
- img_proc: true
  md: 'failover mechanism; for example, it might use a cached response, call a fallback
    service or handle the failure in another graceful manner.


    A circuit breaker can be in three states:


    +   **Closed**: This state indicates that everything is working fine. The circuit
    is closed, so requests are freely passing from calling service to provider service


    +   **Open**: Circuit gets opened when the calling service observes issues and
    stops sending requests to the provider service.


    +   **Half Open**: This is a state between closed and open states. This usually
    occurs when the circuit was previously in the open state, and the calling service
    is trying to check the availability of provider service by sending partial requests.
    If the provider service starts responding, the circuit will be closed again.


    # Summary


    In this chapter, we looked into the best practices that help us develop applications
    for the cloud. We started by revisiting our understanding of the cloud-native
    applications. Next, we looked into 12-factor applications and briefly discussed
    these factors. We discussed some of the common design patterns used in the industry
    to develop cloud-native applications. We started with the SAGA pattern and looked
    into choreography-based and orchestration-based implementations. We talked about
    CQRS and Command Query Response Segregation, which recommends having separate
    sets of services for query and command-based calls. We talked about distributed
    tracing, which helps us with debugging of a complex set of microservices.


    We talked about the strangler pattern, which helps us monolithic applications
    to cloud-based microservices. Service Registry and Discovery pattern help us manage
    communication among microservices by managing a service register. Next, we talked
    about API Gateway based communication, which helps us centralize all the communication
    among microservices and external consumers. We also looked into the blue-green
    pattern, which helps us deploy a new set of microservices without any downtime.
    Sidecar pattern helped us understand how to externalize common concerns of core
    microservice. Finally, bulkhead and circuit breaker patterns were looked into,
    which help us manage failure conditions in cloud-based distributed design.'
