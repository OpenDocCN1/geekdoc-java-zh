  md: '# CHAPTER 4


    # Sample Application Using Jakarta EE


    So far, we have learned cloud basics, design factors considered for cloud, and
    major players in the cloud arena in this book. It is an appropriate time for now
    to get our hands dirty and create our first cloud-native application. In this
    chapter, we will learn how to create a Jakarta EE application and deploy it to
    cloud. This will be our first step in creating cloud native applications.


    # Structure


    +   * What is Jakarta EE?

    * Creating a sample application

    * Deploying to Cloud


    # Objectives


    In this chapter, we will understand what Jakarta EE is. We will look into a brief
    history of Jakarta EE, how it began, and where it is right now. We will learn
    what the future has instore for Jakarta EE with respect to cloud computing. We
    will get into coding and build a sample application using Jakarta EE. In the real
    world, you will not be using Jakarta EE in a standalone manner, and mostly be
    building applications with additional frameworks and tools. Keeping in mind that
    we will also explore popular frameworks, like Eclipse MicroProfile and Spring
    in this chapter. We will understand how these frameworks help us develop cloud-native
    applications along with Jakarta EE. Finally, we will deploy our application to
    the cloud and test it.


    # What is Jakarta EE?


    Java is one of the most used languages in developing enterprise applications.
    It was born in Sun Microsystems in 1996, and immediately became a popular choice
    among developers. Two flavors came up initially as J2SE or Java 2'
  merge: -1
  pgno: 69
- img_proc: true
  md: 'Standard Edition, and J2EE or Java 2 Enterprise Edition. The EE version or
    Enterprise version was meant for creating enterprise-scale applications. It includes
    various specifications for Web applications, Web services, Enterprise applications,
    and so on. In 2009, Oracle bought Sun Microsystems, and along with that, got ownership
    of Java. In 2017, Oracle donated Java EE to the Eclipse Foundation, where it was
    re-christened as Jakarta EE.


    So, what exactly Jakarta EE? Let''s go to jakarta.ee, the official website, for
    the answer:


    > “For many years, Java EE has been a major platform for mission-critical applications.
    In order to accelerate business application development for a cloud-native world,
    leading software vendors collaborated to move Java EE technologies to the Eclipse
    Foundation where they will evolve under the Jakarta EE brand.


    https://jakarta.ee/about/


    Let''s try a version that talks about Jakarta EE''s future.


    “Jakarta EE is the future for cloud-native, light-weight, and traditional enterprise
    applications.”


    https://jakarta.ee/about/faq/


    From the definitions given here, it can be said that Jakarta EE provides specifications
    for creating Enterprise applications and is moving toward support for cloud-native
    applications. In the rest of this book, we will use Jakarta EE, along with some
    helping libraries, for all the example code we develop. Enough of theory! Let''s
    get our hands dirty and create a sample application.


    # Creating a sample application


    Let''s start with an example. Say, we need to create an application for managing
    Employee''s data. Let''s call it the Employee Data Management System (EDMS), which
    will contain Employee''s personal information, financial details, project-related
    details, experience details, expertise details, past history, and so on.


    For the sake of simplicity, we will only think about employee and project data.
    So, we have three sets of microservices, which can be part of such an ecosystem:'
