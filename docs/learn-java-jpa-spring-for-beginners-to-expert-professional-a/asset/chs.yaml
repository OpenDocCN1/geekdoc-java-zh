  package com.abd.util;\nimport java.util.StringTokenizer;\nimport com.abd.expt.AppointmentException;\n\
  \npublic class Util {\n    /**\n    * 医生预约信息字符串处理\n    * 参数信息\n    * dayPattern\
  \ 预约信息（14 个整数，用逗号或空格分隔）\n    * 返回值 - 长度为 14 的整数数组\n    */\n    public static int[]\
  \ parseSpDays(String dayPattern) throws NumberFormatException {\n        int[] spDays\
  \ = new int[14];\n        StringTokenizer token = new StringTokenizer(dayPattern.trim(),\
  \ \", \");\n        if(token.countTokens() != 14)\n            throw new AppointmentException();\n\
  \        for(int i=0; i < 14; i++)\n            spDays[i] = Integer.parseInt(token.nextToken());\n\
  \        return spDays;\n    }\n}\n```\n\n路径：`src\\res`\n\n### AppResources.properties\n\
