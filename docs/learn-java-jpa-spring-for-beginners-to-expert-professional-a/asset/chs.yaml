  - **步骤 2**: `医生` $\\rightarrow$ `医生查看预约` $\\rightarrow$ `治疗`\n- **步骤 3**: `患者` $\\\
  rightarrow$ `查看治疗`\n- **步骤 4**: `医生` $\\rightarrow$ `医生更新治疗开始/结束时间`\n- **步骤 5**:\
  \ `患者` $\\rightarrow$ `查看治疗状态`\n\n# 医院系统设计文档\n\n## 1. 医院门诊预约系统功能\n### 1.1 系统整体功能\n\
  - 权限级别操作，具有清晰分类，当系统进行身份验证时。\n- 个人隐私保护：患者的医疗记录仅在医生治疗期间由患者本人负责，其他包括管理员在内的任何人均无权访问。\n\
  \n### 1.2 患者角色\n- 注册用户，设置登录用户名和密码。\n- 自定义查询医生姓名。\n- 根据查询结果进行预约；如果指定的医生预约量已满，则预约失败。结果返回给患者。\n\
  - 你可以进行预约或撤销。\n- 预约后可以查看医生信息。\n\n### 1.3 医生角色\n- 可以查看患者的预约背景。\n- 查询患者记录。\n- 创建患者记录。\n\
  - 修改患者记录。\n\n### 1.4 管理员角色\n- 添加和删除医生账号。\n\n## 2. 设计流程\n根据需求分析，分离主要实体：\n- `医生` (`doctor`)\n\
  - `患者` (`patient`)\n- `医疗记录` (`history`)\n- `预约记录` (`pinqueue`)\n- `管理员` (`administrator`)\n\
  - 医生最大预约数 (`appointment`)\n- 医生当前可用预约数 (`currappointment`)\n\n### 模块层次图\n| ![](img/image_rsrcBUH.jpg)\
