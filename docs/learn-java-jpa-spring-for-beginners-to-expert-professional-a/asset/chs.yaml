- "# Learn Java JPA Spring：从初学者到专家高级指南及面试技巧\n\n\n\n![](img/cover.jpeg)\n\n\n在本书中，你将学习带有图解的解释以及实际练习，并附带执行成功的输出结果。提供分步说明的现成解决方案。\n\
  \n\n## 引言\n逐步学习 JPA 编程。`JPA` (`Java Persistence API`）是一个强大的框架，用于快速构建健壮的数据驱动应用程序。我们应用程序处理的大部分数据必须存储在数据存储中、检索、处理和分析。如果该数据存储是关系型数据库且你使用如\
  \ `Java` 这样的面向对象的编程语言，那么你应该查看 `JPA`。\n\n`JPA` 是一种对象关系映射（ORM）工具，它将 Java 对象映射到关系型数据库并允许查询操作。在本书中，你将学习\
  \ `Java Persistence API` 及其用于映射实体的注解，以及 JPA 与 `spring` 框架的集成。\n\n## 第 1 章：JPA 一一映射\n\
  1. `JPA OneToOne Mapping`\n2. `JPA OneToOne Lazy Load Mapping`\n3. `JPA OneToOne\
  \ Join Column Mapping`\n4. `JPA OneToOne Primary Key Join Column Mapping`\n5. `JPA\
  \ OneToOne Map Cascade Mapping`\n6. `JPA OneToOne Unidirectional Mapping`\n7. `JPA\
  \ OneToOne Bidirectional Mapping`\n\n### 示例 1：JPA 一一映射\n在这里，你将学习如何在 `JPA` 映射中实现一一映射。此示例假设一个\
  \ `Person`（人员）只能属于一个 `department`（部门），而一个 `department` 只能有一个。在 `Person` 实体中，我们用\
  \ `@OneToOne` 注解标记 `Department` 引用属性。\n\n```java\n@Entity\npublic class Person {...@OneToOne\n\
  private Department department;...}\n```\n\n以下是设置这两个实体并将其保存到数据库的简单代码。\n\n```java\n\
  Person p1 = new Person(\"Tom\");\np1.setName(\"Tom\");\nDepartment d = new Department();\n\
  d.setName(\"Design\");\np1.setDepartment(d);\nem.persist(p1);\nem.persist(d);\n\
  ```\n\n**示例 1：**\n此示例假设一个 `Person` 只能属于一个 `department`，而一个 `department` 只能有一个。\n\
  \n**Person.java**\n```java\npackage com.abd.jpa;\nimport javax.persistence.Entity;\n\
  import javax.persistence.GeneratedValue;\nimport javax.persistence.GenerationType;\n\
  import javax.persistence.Id;\nimport javax.persistence.OneToOne;\n@Entity\npublic\
  \ class Person {\n    @Id\n    @GeneratedValue(strategy=GenerationType.IDENTITY)\n\
  \    private long id;\n    private String name;\n    @OneToOne\n    private Department\
  \ department;\n    public Person() {}\n    public Person(String name) {this.name\
  \ = name;}\n    public Department getDepartment() {return department;}\n    public\
  \ void setDepartment(Department department) {this.department = department;}\n  \
  \  public Long getId() {return id;}\n    public void setId(Long id) {this.id = id;}\n\
  \    public String getName() {return name;}\n    public void setName(String name)\
  \ {this.name = name;}\n    @Override\n    public String toString() {return \"Person\
  \ [id=\" + id + \", name=\" + name + \"]}\n}\n```\n\n**Department.java**\n```java\n\
  package com.abd.jpa;\nimport javax.persistence.Entity;\nimport javax.persistence.GeneratedValue;\n\
  import javax.persistence.GenerationType;\nimport javax.persistence.Id;\n@Entity\n\
  public class Department {\n    @Id\n    @GeneratedValue(strategy=GenerationType.IDENTITY)\n\
  \    private long id;\n    private String name;\n    public long getId() {return\
  \ id;}\n    public void setId(long id) {this.id = id;}\n    public String getName()\
  \ {return name;}\n    public void setName(String name) {this.name = name;}}\n```\n\
  \n**PersonDaoImpl.java**\n```java\npackage com.abd.jpa;\nimport javax.persistence.EntityManager;\n\
  import javax.persistence.PersistenceContext;\nimport org.springframework.transaction.Transactional;\n\
  @Transactional\npublic class PersonDaoImpl {\n    public void test(){\n        Person\
  \ p1 = new Person(\"Tom\");\n        p1.setName(\"Tom\");\n        Department d\
  \ = new Department();\n        d.setName(\"Design\");\n        p1.setDepartment(d);\n\
  \        em.persist(p1);\n        em.persist(d);\n    }\n@PersistenceContext\nprivate\
  \ EntityManager em;}\n```\n\n**Helper.java**\n```java\npackage com.abd.jpa;\nimport\
  \ java.sql.Connection;\nimport java.sql.DriverManager;\nimport java.sql.ResultSet;\n\
  import java.sql.ResultSetMetaData;\nimport java.sql.Statement;\npublic class Helper\
  \ {\n    public static void checkData() {\n        try{\n            Class.forName(\"\
