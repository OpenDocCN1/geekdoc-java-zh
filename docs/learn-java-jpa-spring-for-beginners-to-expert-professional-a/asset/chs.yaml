  \ Tom\n列名: DEPARTMENT_ID,列类型: BIGINT:列值: 1\n\n## 3 JPA 一对一外键列映射\n\n以下章节展示了如何在 JPA\
  \ 中为一对一映射设置连接列（join column）。\n\n我们使用 `@JoinColumn` 注解来设置连接列。\n\n```java\n@OneToOne\n\
  @JoinColumn(name=\"DEPT_ID\")\nprivate Department department;\n```\n\n在这里你将学习到如何在\
  \ JPA 中为一对一映射设置连接列。\n\n#### 示例 3：\n\n### Person.java\n\n```java\npackage com.abd.jpa;\n\
  import javax.persistence.Entity;\nimport javax.persistence.GeneratedValue;\nimport\
  \ javax.persistence.GenerationType;\nimport javax.persistence.Id;\nimport javax.persistence.JoinColumn;\n\
  import javax.persistence.OneToOne;\n@Entity\npublic class Person {\n    @Id\n  \
  \  @GeneratedValue(strategy=GenerationType.IDENTITY)\n    private long id;\n   \
  \ private String name;\n    @OneToOne\n    @JoinColumn(name=\"DEPT_ID\")\n    private\
  \ Department department;\n    public Person() {}\n    public Person(String name)\
  \ {this.name = name;}\n    public Department getDepartment() {return department;}\n\
  \    public void setDepartment(Department department) {this.department = department;}\n\
  \    public Long getId() {return id;}\n    public void setId(Long id) {this.id =\
  \ id;}\n    public String getName() {return name;}\n    public void setName(String\
  \ name) {this.name = name;}\n    @Override\n    public String toString() {return\
  \ \"Person [id=\" + id + \", name=\" + name + \"]\";\n}\n```\n\n### Department.java\n\
  \n```java\npackage com.abd.jpa;\nimport javax.persistence.Entity;\nimport javax.persistence.GeneratedValue;\n\
  import javax.persistence.GenerationType;\nimport javax.persistence.Id;\nimport javax.persistence.OneToOne;\n\
  @Entity\npublic class Department {\n    @Id\n    @GeneratedValue(strategy=GenerationType.IDENTITY)\n\
  \    private long id;\n    private String name;\n    @OneToOne(mappedBy=\"department\"\
  )\n    private Person person;\n    public Department() {}\n    public Department(String\
  \ name) {this.name = name;}\n    public String getName() {return name;}\n    public\
  \ void setName(String name) {this.name = name;}\n    public Long getId() {return\
  \ id;}\n    public void setId(Long id) {this.id = id;}\n    public Person getPerson()\
  \ {return person;}\n    public void setPerson(Person person) {this.person = person;}\n\
  }\n```\nImpl.java\n\n```java\npackage com.abd.jpa;\nimport java.util.List;\nimport\
  \ javax.persistence.EntityManager;\nimport javax.persistence.PersistenceContext;\n\
  import javax.persistence.Query;\nimport org.springframework.transaction.annotation.Transactional;\n\
  @Transactional\npublic class PersonDaoImpl {\n    @PersistenceContext\n    private\
  \ EntityManager em;\n    public void test(){\n        Person p1 = new Person(\"\
  Tom\");\n        Department d = new Department();\n        p1.setDepartment(d);\n\
  \        em.persist(p1);\n        em.persist(d);\n        Query query = em.createQuery(\"\
  SELECT e FROM Person e\");\n        List<Person> list = (List<Person>) query.getResultList();\n\
  \        System.out.println(list.get(0).getDepartment());\n    }\n}\n```\n\n\n\n\
