  \        <property name=\"url\"><value>jdbc:mysql://localhost/db1</value></property>\n\
  \        <property name=\"username\"><value>root</value></property>\n        <property\
  \ name=\"password\"><value>root</value></property>\n    </bean>\n    <bean id=\"\
  entityManagerFactory\" class=\"org.springframework.orm.jpa.LocalContainerEntityManagerFactoryBean\"\
  >\n        <property name=\"dataSource\" ref=\"dataSource\" />\n        <property\
