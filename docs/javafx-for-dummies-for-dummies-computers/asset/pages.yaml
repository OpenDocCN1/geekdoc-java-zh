    # Using a gradient fill


    Instead using a solid color, you can specify a gradient fill, which blends colors
    evenly across the shape. JavaFX provides two classes for working with gradients:
    LinearGradient and RadialGradient.


    A linear gradient is created from two color points. Imagine a line drawn between
    these two points. The gradient fill varies the color smoothly from the color that''s
    set at the first point to the color set at the second point. Then it extends the
    colors on this line at 90-degree angles to the line to fill an entire area.'
