    in the world of computers. The folder structure of your disk drive is a tree,
    as is a JavaFX scene graph.


    Figure 8-5 shows a JavaFX scene that has a tree view control in it. In this example,
    I use a control to represent a few of my favorite TV series, along with series
    that were spun off from them.


