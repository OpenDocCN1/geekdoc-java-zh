  md: '# Introduction


    # How This Book Is Organized


    This book is organized into five parts. Here''s a brief description of what you
    find in each part.


    # Part 1: Getting Started with JavaFX


    This part contains the information you need to get started with JavaFX programming.
    After a brief introduction to what JavaFX is and why it''s so popular, you discover
    the basics of creating simple JavaFX programs. You figure out how to create JavaFX
    scenes populated with common controls such as labels, text field, and buttons.
    Then, you find out how to write programs that respond to user input, such as when
    the user clicks a button or enters text into a text field. Finally, you read how
    to use basic layout managers to control the arrangement of controls in your JavaFX
    scene.


    # Part 2: JavaFX Controls


    The chapters in this part focus on the various types of controls you can use in
    a JavaFX application. Chapter 7 starts by explaining the details of how the JavaFX
    scene graph works and presents the details of the class hierarchy used by the
    various controls. Then, the remaining chapters in this part provide information
    about specific types of controls, ranging from check boxes and radio buttons to
    tables and menus.


    # Part 11: Enhancing Your Scenic Design


    The chapters in this part help you improve the appearance of your applications.
    First, you read about additional types of layout managers that give you more precise
    control over the way your user interface is arranged. Then, you discover how to
    use CSS styles to apply formatting details. Next, you figure out how to incorporate
    simple shapes into your scenes. And finally, you can read about JavaFX''s special
    effects, which let you embell your display with shadows, motion blurs, and so
    on.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Part IV: Making Your Programs

    Come Alive


    The chapters in this part focus on various ways to make your programs more responsive
    and engaging. You discover how to work with properties, which you can use to make
    one part of your user interface respond to changes in another part of your user
    interface. Then, you discover how to incorporate media including sound and video.
    Next, you figure out how to create sophisticated animations that make the objects
    on the screen dance about. And finally, you you read how to create programs that
    respond to multi-finger gestures on touch-enabled devices.


    # Part V: The Part of Tens


    This wouldn''t be a For Dummies book without a Part of Tens, Each of the chapters
    here presents ten items of special interest. Chapter 19 presents ten additional
    JavaFX controls that didn''t fit in Part II. And Chapter 20 presents ten steps
    to creating a JavaFX application that displays a three-dimensional scene.


    # Icons Used in This Book


    Like any For Dummies book, this book is chock-full of helpful icons that draw
    your attention to items of particular importance. You find the following icons
    throughout this book:


    > Danger, Will Robinson! This icon highlights information that may help you avert
    disaster.


