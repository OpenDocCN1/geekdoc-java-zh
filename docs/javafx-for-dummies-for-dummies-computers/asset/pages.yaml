  md: '# Installing JDK 8


    After you download the JDK file, you can install it by running the executable
    file you downloaded. The procedure varies slightly depending on your operating
    system, but basically, you just run the JDK installation program after you download
    it, as follows:


    +   On a Windows system, open the folder in which you saved the installation program
    and double-click the installation program’s icon.

    - On Linux or Solaris system, use console commands to change to the directory
    to you downloaded the file and then run the program.

    - On a Mac, open the Downloads window and double-click the JDK .dmg file you downloaded.
    A Finder window appears containing an icon of an open box. Double-click this icon
    to launch the installer.


    After you start the installation program, it prompts you for any information that
    needs to install the JDK properly, such as which features you want to install
    and what folder you want to install the JDK in. You can safely choose the default
    answer for each option.


    # Setting the path


    After you install the JDK, you need to configure your operating system so that
    it can find the JDK command-line tools. To do that, you must set the Path environment
    variable — a list of folders that the operating system uses to locate executable
    programs. To do this on a Windows system, follow these steps. You must be logged
    in as an administrator to make the changes described in this procedure.


    +   1. Open the Control Panel.

    - On a Windows 7 or earlier system, open the Start menu and choose Control Panel.

    - On a Windows 8 or later system, click the Start button or press the Windows
    key, type Control Panel, and then press Enter.


    +   2. Double-click the System icon.


    The System Properties page appears.


    +   3. Click the Advanced System Settings link and then click the Environment
    Variables button.


    The Environment Variables dialog box appears, as shown in Figure 1-4.'
