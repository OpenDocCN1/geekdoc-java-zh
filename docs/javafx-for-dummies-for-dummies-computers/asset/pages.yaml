  md: '# Chapter 6: Getting Input from the User


    # Validating Numeric Data


    You need to take special care if you are using a text field to get numeric data
    from the user. The getText method returns a string value. You can pass this value
    to one of the parse methods of the wrapper classes for the numeric types. To convert
    the value entered in a text box to an int, use the parseInt method:


    ```

    int count = Integer.parseInt(txtCount.getText());

    ```


    Here the result of the getText method is used as the parameter of the parseInt
    method.


    Table 6-2 lists the parse methods for the various wrapper classes. Note: Each
    of these methods throws NumberFormatException if the string can''t be converted.
    As a result, you need to call the parseInt method in a try/catch block to catch
    this exception.


    | Table 6-2 | Methods That Convert Strings to Numbers |

    | --- | --- |

    | Wrapper Class | parse Method |

    | Integer | parseInt(String) |

    | Short | parseShort(String) |

    | Long | parseLong(String) |

    | Byte | parseByte(String) |

    | Float | parseFloat(String) |

    | Double | parseDouble(String) |


    ![](img/71d6d293a802aaccab3a1d9dafaea059_134_0.png)


    If your program uses more than one or two numeric-entry text fields, consider
    creating separate methods to validate the user''s input. The following code snippet
    shows a method that accepts a text field and a string that provides an error message
    to be displayed if the data entered in the field can''t be converted to an int.
    The method returns a Boolean value that indicates whether the field contains a
    valid integer:'
