  md: "# 3. Add a change listener by calling the addListener method on the selectedItem\
    \ property.\n\nThe listener will be called whenever the value of the selectedItem\
    \ property changes. Change listener implements a functional interface, naturally,\
    \ ChangeListener. Because ChangeListener is a functional interface (that is, it\
    \ has just one method), you can use a Lambda expression to implement the change\
    \ listener.\n\nYou normally do all of these three steps in a single statement,\
    \ as in this example:\n\n```\nchoice.getSelectionModel().getSelectedItemProperty()\n\
    \  .addListener((observable, oldValue, newValue) ->\n    lbl.setText(newValue));\n\
    ```\n\nIn the preceding example, the change listener sets the value displayed\
    \ by a label control to the new value selected by the user.\n\nBeing a functional\
    \ interface, ChangeListener defines a single function named changed, which is\
    \ called whenever the value of the property changes. The changed method receives\
    \ three arguments:\n\n+   * observable: The property whose value has changed\n\
    * oldValue: The previous value of the property\n* newValue: The new value of the\
    \ property\n\nThese three parameters are specified in the parentheses at the beginning\
    \ of the Lambda expression. In the body of the Lambda expression, the newValue\
    \ parameter is assigned to the text of a label. Thus, the value selected by the\
    \ user will be displayed by the label, and the label will be updated automatically\
    \ whenever the user changes the choice box selection.\n\n# Using Combo Boxes\n\
