  md: '# 312 Part IV: Making Your Programs Come Alive


    Likewise with the HBox class: it has properties named alignment, hgroup, padding,
    and spacing which correspond to the getAlignment, setAlignment, getHgroup, setHgroup,
    getPadding, setPadding, getSpacing, and setSpacing methods.


    So far in this book, you''ve had no need to access the properties directly, so
    you''ve relied on the getter and setter methods to manipulate the property values.
    Later in this chapter, when you discover how to bind property values, you will
    see that accessing these properties can be very useful.


    In the next few sections, I discuss how to create your own JavaFX properties.
    Even if you never create JavaFX properties for your own classes, knowing how to
    do so will help you understand the benefits of working with the properties that
    are defined as part of the standard JavaFX API classes.


    # JavaFX Property Classes


    At the heart of JavaFX properties is a collection of classes that create property
    objects. There are a lot of them, as JavaFX provides four important classes for
    each of its basic data types, and property classes are provided for ten different
    data types. Do the math: That means there are 40 property classes. The following
    paragraphs describe the four classes for String properties:


    +   * ReadOnlyProperty: An abstract class that represents a read-only property
    whose value can be read but not modified.


    +   * StringProperty: Another abstract class that represents a read-write property.
    This class extends ReadOnlyProperty.


    +   * SimpleStringProperty: This is the class that you instantiate to create a
    read/write string property.


    +   * ReadOnlyStringWrapper: This is the class that you instantiate to create
    a read-only string property. The use of this class is a bit confusing, so I won''t
    explain it quite yet. You see how it works in the section "Creating a Read-Only
    Property" later in this chapter.


    For your reference, Table 15-1 lists all 40 of the classes used to create properties
    of the various types.'
