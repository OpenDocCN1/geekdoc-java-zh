  md: '# Chapter 17


    # Animating Your Scenes


    # In This Chapter


    +   - Looking at the various ways to create JavaFX animations

    - Using JavaFX transitions

    - Using the KeyFrame and Timeline classes

    - Creating bouncing balls


    You can go a long way towards improving the look and feel of your applications
    by applying special effects as described in Chapter 14, incorporating property
    bindings to make your controls more responsive, and using sound and media to provide
    audio and visual interest. In this chapter, I discuss how to take your applications
    one step further by incorporating simple animation effects. The effects you read
    about in this chapter make your applications alive by enabling objects on the
    screen to move.


    Please don''t get your hopes set on winning an Oscar for Best Animation next year.
    No one will be fooled into thinking that you collaborated with Pixar on your application.
    Still, you can add some interesting whiz-bang to your applications using these
    techniques.


    # Introducing JavaFX Animation


    The basic idea of JavaFX animations is to manipulate the value of one or more
    node properties at regular intervals. For example, suppose you have a circle that
    represents a ball and you want to move it from the left side of the screen to
    the right. Assuming the width of the screen is 600 pixels, you''d animate the
    circle by varying its posX property from 0 to 600.


    Two factors will affect how fast the ball moves across the screen: the amount
    of time that el between each change to the posX property, and the increment you
    add to the posX property at each time interval. For example, if'
  merge: -1
  pgno: 350
- img_proc: true
  md: '# Part IV: Making Your Programs Come Alive


    you add 3 to the posX property at each time interval, it will take 200 intervals
    to get to 600 (3 x 200 — 600). If the intervals occur every 10 milliseconds (100
    times per second), it will take 2,000 milliseconds — 2 seconds — for the ball
    to traverse the screen from left to right.


    Without JavaFX animations, you could implement the movement ball by using the
    Java Timer object to move the ball at regular intervals. The Timer class can be
    difficult to set up and use correctly. The JavaFX animation classes can making
    your nodes a much simpler process.


    JavaFX provides two basic ways to create animations, which I refer to in this
    chapter using extremely technical terms — the hard way and the easy way:


    +   The hard way requires that you set up timer events manually, and then write
    event listeners when the timer events occur. In the event listeners, you manipulate
    the properties of the nodes you want to animate. For example, to move a ball across
    the screen, you''d set up a timer that ticks every 10 milliseconds. At each tick,
    you''d increase the x position of the ball by 3. You''d set the timer to run a
    total of 200 times to move the ball. Setting up this animation requires that you
    use two classes: Timeline and KeyFrame, and that you write an ActionEvent to listen
    to the ball.


    +   The easy way takes advantage of shortcut classes provided by JavaFX to easily
    implement common types of animations. For example, you can use the TranslateTransition
    class to easily move a circle from one side of the screen to the other over a
    specified period of time. You just up a TranslateTransition specifying that you
    want to vary the ball''s x position from 0 to 600 over the course of 2 seconds.
    The TranslateTransition class will take care of the details.


    In the remainder of this chapter, you discover both the easy way and the hard
    way. I start with the easy way.


    # Using Transition Classes


    JavaFX comes with eight predefined animation effects — dubbed classes — that you
    can use to easily create an animation on most any node in your scene graph. (Most
    of the transitions work with any node, but some will work only on shapes.) The
    eight transition types are'
  merge: -1
  pgno: 351
- img_proc: true
  md: '# Chapter 17: Animating Your Scenes 343


    +   - FadeTransition: Varies the opacity value of any node. You can use this transition
    to fade an object in or out. Or, you can use it to make an object "wink" by quickly
    fading it out and then back in. You can also use it to create a flashing light
    that repeatedly fades in and then out.


    +   - FillTransition: Varies the color of a shape''s fill from a starting color
    to an ending color. For example, you can make a circle change from red to green.


    +   - PathTranslation: Causes a shape to move along a predefined path. You can
    use any shape for the path.


    +   - PauseTransition: This handy transition simply pauses for a moment; it''s
    used between two transitions to cause a break in the action.


    +   - RotateTransition: Causes a node to rotate.


    +   - ScaleTransition: Causes an object to increase or decrease in size.


    +   - StrokeTransition: Varies the color used for a shape''s outline stroke.


    +   - TranslateTransition: Moves a node by translating it from one location to
    another.


    These eight transition classes are all subclasses of the Transition class, which
    is in turn a subclass of the Animation class. Table 17-1 lists the methods that
    are defined by the Transition and Animation classes, and are therefore available
    to all transition classes.


    | Table 17-1 Methods of the Transition and Animation Classes |

    | Method | Explanation |

    | void play() | Plays the animation from its current position. |

    | void playFromStart() | Plays the animation from the start. |

    | void pause () | Temporarily suspends the animation. You can start it again by
    calling play. |

    | void stop() | Stops the animation. |

    | void setCycleCount(int value) | Sets the number of times the animation should
    repeat. To repeat the animation an indefinite number of times, specify Animation
    INDEFINITE. |


    (continued)'
  merge: -1
  pgno: 352
- img_proc: true
  md: '# 344 Part IV: Making Your Programs Come Alive


    | Table 17-1 (continued) |

    | Method | Explanation |

    | --- | --- |

    | setAutoReverse (boolean value) | If true, the animation reverses direction each
    time the cycle is repeated. |

    | setInterpolator (Interpolator value) | Determines the method used to calculate
    the intermediate values of the property controlled by the transition. The possible
    values are Interpolator.DISCRETE Interpolator.LINEAR Interpolator.EASE_IN Interpolator.EASE_OUT
    Interpolator.EASE_BOTH The default setting is EASE BOTH. |


    Most of the methods in Table 17-1 are straightforward, but the setInterpolator
    method merits a bit of explanation. The interpolator is the method used to calculate
    the intermediate values of the property controlled by the transition. For example,
    in a FadeTransition, the interpolator determines the value of the node''s opacity
    is varied during the time that the animation is running; for a TranslateTransition,
    the interpolator determines how the x- and y-coordinates change during the animation.


    The default interpolator setting is Interpolator.EASE_BOTH, which means that the
    change begins slowly, then speeds up through the middle of the animation, then
    slows down just before the animation ends. For a TranslateTransition, this causes
    the movement of the node to start slowly, speed up, and then slow down towards
    the end.


    EASE_IN interpolator speeds up at the beginning but ends abruptly, while the EASE
    OUT interpolator starts abruptly but slows down at the end. The LINEAR interpolator
    varies the property controlled by the transition at a constant rate throughout
    the animation. And the DISCRETE interpolator doesn''t change the property value
    at all until the end of the animation has been reached; then, it immediately changes
    to the ending value.


    Table 17-2 lists the most commonly used constructors and methods for each of the
    transition types.'
