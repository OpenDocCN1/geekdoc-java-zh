  md: '# Chapter 16: Using Images and Media 329


    The easiest way to load an image is to do so directly from a file on your local
    computer by specifying a file path in the Image constructor. The file path string
    should be preceded by the protocol string file:. For example, the following constructor
    creates an Image object from a file named pic001.jpg in the folder C:\Pictures:


    ```

    Image img = new Image("file:C:\\Pictures\\pic001.jpg");

    ```


    You can also specify a web location using the http: protocol, as in this example:


    ```

    Image img = new Image("http://www.domain.com/pic001.jpg");

    ```


    Notice in the web example that you don''t have to double the slashes because HTTP
    addresses use forward slashes, not backward slashes.


    In many cases, you want to load an image from a File object. To do that, use the
    File object method toURI to get the correct path from the file. Note: toURI()
    returns an object of type URI; you must then call toString to convert the URI
    to a string:


    ```

    File f = new File("C:\\Pictures\\pic001.jpg");

    Image img = new Image(f.toURI().toString());

    ```


    Here, a file is created from the path C:\Pictures\pic001.jpg. Then, an image is
    created from the file.


    When you create an Image object, you can specify that the image should be resized
    by providing the width and height parameters. You''ll also need to provide two
    boolean arguments. The first specifies whether you want JavaFX to preserve the
    image''s aspect ratio (that is, the ratio of width to height). If you specify
    true, the image may contain blank areas above and below or left and right as needed
    to preserve the image aspect ratio. If you specify false, the image may be distorted.


    The second boolean argument specifies whether you want JavaFX to apply a smoothing
    algorithm to improve the clarity of the image. The smoothing process makes the
    image look better, but takes time.


    Finally, you can specify an optional third boolean argument that indicates that
    you want the image to load in the background. This causes the image loading process
    to be spun off to a separate thread that your main application thread can continue
    without waiting for the image to load.'
