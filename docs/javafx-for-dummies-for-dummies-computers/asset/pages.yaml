  md: '# Chapter 11


    # More about Layout Panes for\ Precise Scene Design


    In This Chapter


    +   - Using four more layout panes to create spectacular layouts

    - Introducing rectangle shapes

    - Adding scroll bars to a layout

    - Creating two complete programs


    In Chapter 5, you can read about how to work with four basic layout pane classes
    that let you control the arrangement of controls in a scene: HBox, which arranges
    nodes horizontally; VBox, which arranges nodes vertically; FlowPane, which arranges
    nodes both horizontally and vertically; and BorderPane, which divides the scene
    into five regions: Top, Right, Bottom, Left, and Center.


    In this chapter, you discover four additional layout panes that give you additional
    ways to arrange the elements in a scene. Specifically, you discover how to use
    the following layout pane classes:


    +   - StackPane: The StackPane class is a bit different than the other layout
    panes in that it doesn''t visually separate nodes from one another. Instead, it
    displays nodes directly on top of each other. For example, if you add a rectangle
    shape and a text shape to a stack pane, the text will appear directly directly
    over the rectangle.


    ![](img/71d6d293a802aaccab3a1d9dafaea059_236_0.png)'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# 228 Part III: Enhancing Your Scenic Design


    +   AnchorPane: This layout lets you anchor nodes to the top, right, bottom, or
    center of the pane. As the pane resizes, the nodes are repositioned but remain
    tied to their anchor points. Note: A node can be anchored to more than one position.
    For example, you might anchor a node to the top and the right. Then, when you
    resize the pane, the node will remain near the top-right corner of the pane.


    +   GridPane: Arranges nodes in a grid of rows and columns. The grid does not
    have to be uniformly sized like a chess board. Instead, the width of each column
    and the height of each row can vary according to its content. In addition, content
    can span columns or rows. GridPane is an ideal layout type for forms that gather
    information from the user via interface controls such as text boxes, list boxes,
    and so on.


    +   TilePane: If you want a layout that resembles a chessboard, in which each
    cell is in the same size, TilePane is the layout pane you''re looking for. TilePane
    is ideal for organizing thumbnails of image files or other objects of the same
    size.


    +   ScrollPane: Technically, the ScrollPane class is not a layout pane at all;
    it inherits the Control class, not the Pane class. However, it is used to create
    layouts that are too large to display all at once and so require a scroll bar
    to allow the pane to left and right and up down (or both) to see all its contents.


    Keep in mind that layout panes are typically used in combinations to create the
    complete layout for your scene. For example, you might use a GridPane to organize
    user input controls and then place the GridPane in the center section of a BorderPane
    to place it in the middle of the scene. Or, you might use VBox panes to display
    labels beneath image thumbnails and then add the VBox panes to a tile pane to
    display the labeled images in a tiled arrangement.


    # Using the StackPane Layout


    A stack pane layout is unusual in that it does not arrange its nodes by spreading
    them out so that you can see them all. Instead, it stacks nodes one on top of
    the other so that they overlap. The first node you add to a stack pane at the
    bottom of the stack; the last node is on the top.'
