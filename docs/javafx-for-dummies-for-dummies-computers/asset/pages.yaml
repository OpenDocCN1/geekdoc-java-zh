  md: "# Chapter 9: Working with Tables\n\nIt's as simple as that. After the cell\
    \ factory is set up, the cell will turn into a text field whenever the user clicks\
    \ it. The user can then edit the data in the text field. When the user presses\
    \ Enter or Tab clicks outside the field, the text field is replaced once again\
    \ with a simple text object.\n\nThe only problem remaining is that although the\
    \ cell factory lets the user edit the contents of a cell via the text field, the\
    \ cell factory does not automatically update the cell's items collection to reflect\
    \ any changes the user might make when editing the cell. To do that, you must\
    \ set up an action listener that responds when the user finishes editing the cell.\
    \ Then, in that listener, you can update the items collection.\n\nHere's how you\
    \ can use a Lambda expression to set up a listener for the onEdit event:\n\n```\n\
    colTitle.setOnEditCommit(\n  -> colTitle_onEditCommit(e));\n```\n\nIn this example,\
    \ the method coltitle OnEditCommit will be called when the user finishes editing\
    \ the contents of the cell in the Title column.\n\nTable 9-4 The CellEditEvent\
    \ class\nWriting the event handler for the OnEditCommit event is a little tricky.\
    \ The OnEditCommit event generates an event object of type CellEditEvent, which\
    \ contains important information you need to access in the event handler. Table\
    \ 9-4 lists the methods of this class.\n\n| Method | Description |\n| --- | ---\
    \ |\n| T getNewValue() | Gets the new value entered by the user |\n| T getOldValue()\
    \ | Gets the previous value of the cell |\n| S getRowValue() | Gets the data object\
    \ for the row edited by the user |\n| TableColumn<S, T> get TableColumn() | Gets\
    \ the table column on which this event occurred |\n| TextView<S> | Gets the table\
    \ view on which this event occurred |\n| Table<S> (ObservableList list) | Creates\
    \ a new table view using the specified list as its items list |"
