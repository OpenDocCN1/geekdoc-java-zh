  md: '# 130 Part I: Getting Started with JavaFX


    ![](img/71d6d293a802aaccab3a1d9dafaea059_139_0.png)


    To with radio buttons, you use two classes. First, you create the radio buttons
    themselves with the Radio class, whose constructors and methods are shown in Table
    6-4. Then you create a group for the buttons with the ToggleGroup class and add
    the radio buttons to the toggle group.


    A ToggleGroup object is simply a way of associating a set of radio buttons so
    that only one of the buttons can be selected. The toggle group object itself is
    not a control and is not displayed. To display radio buttons, you add the individual
    radio buttons, not the toggle group, to a layout pane.


    | Table 6-4 Various RadioButton Constructors and Methods |

    | Constructor | Description |

    |---|---||

    | RadioButton() | Creates a new radio button with no text. |

    | RadioButton(String text) | Creates a new radio button with the specified text.
    |

    | Method | Description |

    | String getText() | Gets the text displayed by the radio button. |

    | boolean isSelected() | Returns true if the radio button is selected or false
    if the radio button is not selected. |n| void setOnAction(EventHandler<ActionEvent>
    value) | Sets an ActionEventListener listener to handle action events. |

    | void setSelected(boolean value) | Selects the radio button if the parameter
    is true; de-selects it if the parameter is false. |

    | void setText(String text) | Sets the check box text. |'
