  md: '# 38 Part I: Getting Started with JavaFX


    You find pertinent details of each of these blocks of code later in this chapter.  But
    before I proceed, I want to point out a few additional salient details about the
    start method:


    +   * The start method is defined as an abstract method in the Application class,
    so when you include a start method in a JavaFX program, you''re actually overriding
    the abstract start method.


    +   * Although it isn''t required, it''s always a good idea to include the `@override`
    annotation to explicitly state that you''re overriding the start method. If you
    omit this annotation and then make a mistake in spelling the method named (for
    example, Start instead of start) or if you list the parameters incorrectly, Java
    thinks you''re defining a new method instead of overriding the start method.


    +   * Unlike the main method, the start method is not a static method. When you
    call the launch method from the static method, the launch method creates an instance
    of your Application class and then calls the start method.


    +   * The start method accepts one parameter: the `Stage` object on which the
    application''s user interface will display. When the application calls your start
    method, the application passes the main stage — known as the `primaryStage` —
    via the `primaryStage` parameter. Thus, you can use the `primaryStage` parameter
    later in the start method to refer to the application''s stage.


    ![](img/71d6d293a802aaccab3a1d9dafaea059_47_0.png)


    # Creating a Button


    The Button displayed by the Click Me program is created using a class Button.
    This class is one of many classes that you can use to create user interface controls.
    The Button class and most of the other control classes are found in the package
    `javafx.scene.control`.


    To create a button, simply define a variable of type Button and then call the
    Button constructor like this:


    ```

    Button btn;

    btn = new Button();

    ```


    In the code Listing 2-1, the `btn` variable is declared as a class variable outside
    of the start method but the `Button` object is actually created within the start
    method. Controls are often declared as class variables so that you can access
    them from any method defined within the class. As you discover in the following
    section ("Handling an Action Event"), a separate method named `handleClick` is
    called when the user clicks the button. By defining the `btn` variable as a class
    variable, both the start method and the handleClick method have access to the
    button.'
