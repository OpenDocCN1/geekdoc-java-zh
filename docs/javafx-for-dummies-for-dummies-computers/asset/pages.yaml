  md: "# 310 Part IV: Making Your Programs Come Alive\n\nlanguages, such as C#, the\
    \ concept of properties is built in to the language. Alas, such is not the case\
    \ with Java. Java has no built-in features for implementing properties ... at\
    \ least, not until now.\n\nPrior to Java 8, Java developers usually followed the\
    \ pattern of using property getters and setters to retrieve and set property values.\
    \ A getter is a public method that retrieves the value of a property, and a setter\
    \ is a public method that sets the value of a property.\n\nFor example, suppose\
    \ you're creating a class that represents a customer, and each customer is identified\
    \ by a unique customer number. You might store the customer number internally\
    \ as a private field named customerNumber. Then, you'd provide a public method\
    \ named getCustomerNumber to return the customer's number and another public method\
    \ named setCustomerNumber to set the customer number. The resulting code would\
    \ look like this:\n\n```\nclass Customer {\n    private int customerNumber;\n\
    \    public int getCustomerNumber() {\n        return customerNumber;\n    }\n\
    \    public void setCustomerNumber(int value) {\n        customerNumber = value;\n\
    \    }\n}\n```\n\nThis pattern of using getter and setter methods has a name:\
    \ the accessor pattern. (No, this has nothing to do with property taxes. Property\
    \ taxes are determined by an assessor, not an accessor).\n\nJavaFX introduces\
    \ a new scheme for implementing properties, which fully follows the accessor pattern.\
    \ As a result, JavaFX classes that implement properties must provide a getter\
    \ and a setter that returns and sets the value of the properties (unless the property\
    \ is read-only, in which case only a get method is required).\n\nHowever, instead\
    \ of using a simple field to represent the value of the property, JavaFX uses\
    \ special property classes to represent properties. These classes encapsulate\
    \ the value of a property in an object that provides the whiz-bang features that\
    \ enable you to listen for changes in the property value or bind properties together."
