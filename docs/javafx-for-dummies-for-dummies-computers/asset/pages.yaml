    # # Listening for Selection Changes


    It''s not uncommon to want your program to respond immediately when the user changes
    the selection of a choice box or other list control, without waiting for the user
    to click a button to submit the data. For example, you might have a label whose
    value you update immediately whenever the user changes the selection. You might
    even want to show or hide controls based on the selection.


    Unfortunately, the choice box and list controls don''t generate an action event
    when the user changes the selection. As a result, the `CheckBox` class doesn''t
    have a `setOnAction` method. Instead, you must use a complicated sequence of method
    calls to set up a different type of event listener, called a change listener.


    Here''s the sequence:


    +   1. Get the selection model by calling the `getSelection()` method on the choice
    box.


    `getSelection()` returns the control''s `selectionModel`, which is an object that
    manages how the user can select items from the list. The selection model is an
    object that implements one of several classes that extend the abstract `Selection`
    class. For a choice box, the selection model is always of type `SingleSelectionMode`,
    which implements a selection model that allows the user to select just one item
    from the list at a time.


    +   2. Get the `selectedItem` property by calling the `getSelectedItemProperty`
    method on the selection model.


    The `SelectionModel` class has a method named `getSelectedItemProperty` that accesses
    a property named `selectedItem`, which represents the item currently selected.
    (A *property* is a special type of JavaFX I discuss more about in Chapter 19.
    For now, assume that a property is an object whose value can be monitored by a
    listener that''s called whenever the value of the property changes.)'
