    \ to either Modena or Caspian. These radio buttons are added to a ToggleGroup\
    \ and to an HBox. Later in the program, the HBox is added to a GridPane layout\
    \ to display in the bottom-left corner of the scene.\n\n# Adding a Style Sheet\
    \ to a Scene\n\nIf you want, you can create a style sheet to replace the Modena\
    \ or Caspian themes with your own theme, creating an entirely different look and\
    \ feel for your application. Then, you can apply your style sheet as the application's\
    \ default style sheet using Application.setUserAgentStylesheet, as I describe\
    \ in the preceding section.\n\nHowever, creating a completely new theme to apply\
    \ application-wide can be a difficult task, as your style sheet must provide style\
    \ information for every possible formatable node element. Instead, you may want\
    \ to start by creating a smaller style sheet that just provides formatting information\
    \ for the specific needs of your application. Then, you can apply the style sheet\
    \ to a specific scene or to an individual node within a scene."
