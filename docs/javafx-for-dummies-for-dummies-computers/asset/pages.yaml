    # Setting properties by, from, or to?


    The setFrom, setTo, and setBy methods that appear in several of the transition
    classes listed in Table 17-2 deserve a little explanation.


    By default, the start and end values of a transition are the node''s current values
    for the property being animated. Thus, the default starting and ending locations
    for a TranslateTransition are the current x and y positions.


    Here are several ways to specify a different starting value, ending value, or:


    +   - Let the node''s current values stand as the starting values and specify
    a new value by using the setTo methods.

    - Let the node''s current values stand as the starting values and specify a displacement
    to the ending value by using a setBy


    method. The value you specify in the setBy method will be added to the start-ing
    value to determine the ending value.


    +   - Use the setFrom location to change the starting location from the node''s
    current value. Then, omit both the setTo and setBy values to let the node''s current
    value be the ending value.

    - Use the setFrom location to change the starting location from the node''s current
    value and use setTo to set the ending value.

    - Use the setFrom location to change the starting location from the node''s current
    value and use setBy to a displacement value that will be added to the starting
    loca-tion to determine the ending location.'
