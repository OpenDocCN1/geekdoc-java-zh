    \ The user can then delete one or more rows by selecting the rows and then pressing\
    \ the Delete button. Here's a method you could call from the OnAction handler\
    \ for a Delete button:\n\n```\npublic void btnDeleteClicked() {\n    ObservableList<Movie>\
    \ sel, items;\n    items = table.getItems();\n    sel = table.getSelectionModel().getSelectedItems();\n\
