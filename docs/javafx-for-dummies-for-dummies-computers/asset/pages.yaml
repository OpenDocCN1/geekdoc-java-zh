  md: "# 216 Part II: JavaFX Controls\n\n# Creating Menus That Change\n\nIn many applications,\
    \ menu items change as you work with the program. Some items may be disabled in\
    \ certain situations, and the text of the menu item may change depending on the\
    \ context in which the command could be used.\n\nFor example, you may want the\
    \ Pause Game menu item in the Game menu to change to Resume Game when the user\
    \ pauses the game. Then, if the user resumes the game, this menu item reverts\
    \ to Pause Game. You could do that in several ways. The easiest is to just look\
    \ at the text in the menu item. If the text is _Pause Game, change it to _Resume\
    \ Game; if the text is _Resume Game, change it to _Pause Game. Here's a snippet\
    \ of code that does the job:\n\n```\nif (menuItemPauseGame.getText().equals(\"\
    _Pause Game\")) {\n    menuItemPauseGame.setText(\"_Resume Game\");\n} else {\n\
    \    menuItemPauseGame.setText(\"_Pause Game\");\n}\n```\n\nIn a real program,\
    \ of course, this code also pauses and resumes the game.\n\nEnabling or disabling\
    \ menu items depending on what's happening in the program is also common. Suppose\
    \ that you don't want to allow users to quit the game while the game is paused.\
    \ In that case, you disable the Quit Game menu item when the user chooses Pause\
    \ Game and enable it again if the user chooses Resume Game, like this:\n\n```\n\
    if (menuItemPauseGame.getText().equals(\"_Pause Game\")) {\n    menuItemPauseGame.setText(\"\
    _Resume Game\");\n    menuItemQuitGame.setDisable(true);\n} else {\n    menuItemPauseGame.setText(\"\
    _Pause Game\");\n    menuItemQuitGame.setDisable(false);\n}\n```"
