    # # Combining Shapes


    The final topic for this chapter is using three methods of the Shape class that
    let you create complicated shapes by combining shapes in various ways. These methods
    are


    +   * intersect: Accepts two shapes and returns a new shape that consists only
    of the parts of the two shapes that overlap

    * union: Combines two shapes by adding the shapes to one another

    * subtract: Creates a new shape by subtracting one shape from another


