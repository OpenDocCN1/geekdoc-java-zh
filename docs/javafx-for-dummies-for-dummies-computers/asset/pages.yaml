  md: '# Part IV: Making Your Programs Come Alive


    # Listening for Gestures


    You can install a listener for any gesture on any node object by calling one of
    the methods listed in Table 18-1. As with all JavaFX events, these events use
    functional interfaces, so you can easily implement the event listeners with Lambda
    expressions.


    | Table 18-1 | Node Methods for Installing Gesture Listeners |

    | --- | --- |

    | Method | Explanation |

    | void setOnRotate(RotateEvent listener) | Creates a listener for the ROTATE event.
    |

    | void setOnRotateStarted(RotateEvent listener) | Creates a listener for the ROTATE_STARTED
    event. |

    | void setOnRotateFinished(RotateEvent listener) | Creates a listener for the
    ROTATE_FINISHED event. |

    | void setOnZoom(ZoomEvent listener) | Creates a listener for the ZOOM event.
    |

    | void setOnZoomStarted(ZoomEvent listener) | Creates a listener for the ZOOM_STARTED
    event. |

    | void setOnZoomFinished(ZoomEvent listener) | Creates a listener for the ZOOM_FINISHED
    event. |

    | void setOnScroll(ScrollEvent listener) | Creates a listener for the SCROLL event.
    |

    | void setOnScrollStarted(ScrollEvent listener) | Creates a listener for the SCROLL_STARTED
    event. |

    | void setOnScrollFinished(ScrollEvent listener) | Creates a listener for the
    SCROLL_FINISHED event. |

    | void setOnSwipeLeft(SwipeEvent listener) | Creates a listener for the SWIPE_LEFT
    event. |

    | void setOnSwipeRight(SwipeEvent listener) | Creates a listener for the SWIPE_RIGHT
    event. |

    | void setOnSwipeUp(SwipeEvent listener) | Creates a listener for the SWIPE_UP
    event. |

    | void setOnSwipeDown(SwipeEvent listener) | Creates a listener for the SWIPE_DOWN
    event. |'
