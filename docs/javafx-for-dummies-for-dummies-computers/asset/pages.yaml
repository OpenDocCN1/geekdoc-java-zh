    # # Handling Events with Inner Classes


    An anonymous inner class, usually called an anonymous class, is a class that''s
    defined on the spot, right at the point where you need it. Because you code the
    body of the class right where you need it, you don''t have to give it a name;
    that''s why it''s called an anonymous class.


    Anonymous classes are often used for event handlers to avoid the need to create
    a separate class that explicitly implements the EventHandler interface.


    One advantage of using anonymous classes for event handlers is that you can easily
    create a separate event handler for each control that generates events. Then,
    in the handle method for those event handlers, you can dispense with if statements
    that check the event source.


    Consider the event handler for the AddSubtract2 program shown earlier in Listing
    3-2: it must check the event source to determine whether or decrement the iCounter
    variable. By using anonymous classes, you can create separate event handlers for
    the Add and Subtract buttons. The event handler for the Add button increments
    iCounter, and the event handler for the Subtract button decrements it. Neither
    event handler needs to check the event source because its handle method will be
    called only when an event is raised on the button with which the handler is associated.


    Listing 3-3 shows the AddSubtract3 program, which uses anonymous inner classes
    in this way.'
