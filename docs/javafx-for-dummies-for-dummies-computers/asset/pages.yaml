  md: '# Chapter 5: Using Layout Panes to Arrange Your Scenes 113


    # Using the Border Layout


    The border layout is a pane that is carved into five regions: Top, Left, Center,
    Right, and Bottom, as shown in Figure 5-6. When you add a component to the layout,
    you can specify which of these regions the component goes in.


    ![](img/71d6d293a802aaccab3a1d9dafaea059_122_0.png)


    Figure 5-6:

    How the border carves things up.


    Border layout is the ideal layout manager for applications that have a traditional
    window arrangement in which menus and toolbars are displayed at the top of the
    window, a status bar or OK and Cancel buttons are displayed at the bottom, a navigation
    pane is displayed on the left, various task panes are displayed on the right,
    and content is displayed in the middle.


