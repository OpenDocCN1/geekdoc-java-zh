  md: '# Chapter 15: Using Properties to Create Dynamic Scenes


    When JavaFX properties are used, the getter and setter methods return the value
    that''s encapsulated by the property object. In addition to the getter and setter
    methods, JavaFX properties introduce a third method which returns the actual property
    itself. This allows users of the property to directly access the property object,
    which in turn lets them access new whiz-bang features.


    Naming conventions are an essential aspect of JavaFX properties correctly. Every
    property has a name, which by convention begins with a lowercase letter. For example,
    a property that represents a person''s first name might be called firstName. The
    getter and setter methods are created by capitalizing the property name and prefixing
    it with the word get or set. The method that returns the property object is the
    name of the property (uncapized) followed by the word Property.


    Thus, a class that implements a read/write property named firstName must expose
    three methods:


    ```

    getFirst

    setFirstName

    firstNameProperty

    ```


    If the property is read-only, the setFirstName method would be omitted.


    # Java API Properties


    JavaFX API classes that are presented in this book make extensive use of properties.
    In fact, just about every API get or set method is actually a property getter
    or setter, and has a corresponding method that returns the property itself.


    For example, consider the TextField class, which has methods named getText and
    setText that get and set the text contained in the text field. These methods are
    actually getters and setters for a property named text, and the TextField class
    has a method named textProperty that provides direct access to the text property.'
