  md: '# Creating a Layout Pane


    By itself, a button is not very useful. You must actually display it on the screen
    for the user to be able to click it. And any realistic JavaFX program will have
    more than one control. The moment you add a second control to your user interface,
    you need a way to specify how the controls are positioned relative to one another.
    For example, if your application has two buttons, do you want them to be stacked
    vertically, one above the other, or side by side?


    That''s when layout panes come in. A layout pane is a container class to which
    you can add one or more user-interface elements. The layout pane then determines
    exactly how to display elements relative to each other.


    To use a layout pane, you first create an instance of the pane. Then, you add
    one or more controls to the pane. When you do so, you can specify the details
    of how the controls will be arranged when the pane is displayed. After you add
    all the controls to the pane and arrange them just so, you add the pane to the
    scene.


    JavaFX provides a total of eight distinct types of layout panes, all defined by
    classes in the package javafx.scene.layout. The Click Me program uses a type of
    layout called a border pane, which arranges the contents of the pane into five
    general regions: top, left, right, bottom, and center. The BorderPane class is
    ideal for layouts where you have elements as a menu and toolbar at the top, optional
    task panes on the left or right, and a main working area in the center of the
    screen.


    The lines that create the border pane in the Click Me program are


    ```

    BorderPane pane = new BorderPane();npane.setCenter(btn);

    ```


    Here, a variable of type BorderPane is declared with the name pane, and the BorderPane
    constructor is called to create a new BorderPane object. Then, the setCenter method
    is used to display the button (btn) in the center region of the pane.


    Here are a few other interesting details about layout panes:


    +   Layout panes automatically adjust the exact position of the elements they
    contain based on the size of the elements contained in the layout as well as the
    size of the space in which the layout pane is displayed.


    +   I said earlier that controls are a type of node, and that you would read about
    other types of nodes later in this book. Well, you just read about one: A Layout
    pane is also a type of node.


