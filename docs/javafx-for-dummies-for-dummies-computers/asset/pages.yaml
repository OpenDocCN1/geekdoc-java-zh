    To set the text value displayed by the button, call the `setText` method, passing
    the text to be displayed as a string:


    ```

    btn.setText("Click me please!");

    ```


    Here are a few additional tidbits about buttons:


    +   * The Button constructor allows you to pass the text to be displayed on the
    button as a parameter, as in this example:


    ```

    btn = new Button("Click me please!");

    ```


    +   * If you set the button''s text in this view, you don''t need to call the
    `setTitle` method.


    +   * The Button class is one of many classes that are derived from a parent class
    known as `javafx.scene.control.Control`. Many other classes derive from this class,
    including `Label`, `TextField`, `ComboBox`, `Checkbox`, and `RadioButton`.


    +   * The Control class is one of several classes that are derived from higher-level
    parent class called `javafx.scene.Node`. Node is the base class of all user-interface
    elements that can be displayed in a scene. A Control is a specific type of node,
    but there are other types of nodes. In other words, all controls are nodes, but
    not all nodes are controls. You can read more about several types of nodes later
    in this book.


    ![](img/71d6d293a802aaccab3a1d9dafaea059_48_0.png)


    # Handling an Action Event


    When the user clicks a button, an *action event* is triggered. Your program can
    respond to the event by providing an *event handler*, which is simply a bit of
    code that will be executed when the event occurs. The Click Me program works by
    setting up an event handler for the button; the code for the event changes the
    text displayed on the button.


    As you read in Chapter 3, there are several ways to handle events in JavaFX. For
    now, I briefly list one of the simplest methods, which requires simply that you
    specify a method to be called when the event occurs and then provide the code
    to implement that method.


    To specify the method to be called when the user clicks a button, you call the
    `setOnAction` method of the button class. Here''s how it''s done in Listing 2-1:


    ```

    btn.setOnAction(e -> buttonClick());

    ```'
