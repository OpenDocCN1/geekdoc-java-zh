    If you prefer, you can call the getChildren method to add nodes to the stack pane,
    like this:


    ```

    stack.getChildren().add(r1);

    stack.getChildren().add(r2);

    ```


    Or like this:


    ```

    stack.getChildren().addAll(r1, r2);

    ```


    Note: The order in which you add nodes to a stack pane has a major impact on how
    the child nodes are displayed. For example, suppose you reversed the order in
    the two rectangles are added:


    ```

    stack.getChildren().addAll(r2, r1);

    ```


    Then, the larger rectangle will be displayed over the top of the smaller one.
    The result is that the user will see only the larger rectangle. (Unless, of course,
    the larger rectangle is transparent. I discuss how to create transparent shapes
    in Chapter 13.)


    By default, the objects in a stack pane are centered on top of one another. You
    can change that by using the setAlignment method. The argument for this method
    is of type Pos, the same as for other layout panes that have a setAlignment method.
    If you need a refresher on the Pos enumeration, flip to Table 5-5 in Chapter 5.
    Here''s an example that displays three rectangles of various sizes aligned at
    the top left of the stack pane:


    ```

