    # Step Five: Add a Box


    In this step, I add a second object to the 3D world: In this case, a box, represented
    by the Box class. Here''s the code:


    ```

    Box box = new Box(100, 100, 100);

    box.setMaterial(blueStuff);

    box.translateX(150);

    box.translateY(-100);

    box.translateZ(-100);

    root.getChildren().add(box);

    ```


    The Box constructor accepts three arguments representing the width, height, and
    depth of the box. In this example, all three are set to 100. Thus, the box will
    be drawn as a cube with each side measuring 100 units.


    The box is given the same material as the cylinder; then it is translated on all
    three axes so that you can have a perspective view of the box. Figure 20-4 shows
    how the box appears when rendered. As you can see, the left and bottom faces of
    the box are visible because you translated the position of the box up and to the
    right so that the camera can gain some perspective.'
