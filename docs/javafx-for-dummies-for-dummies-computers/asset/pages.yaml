  md: '# Chapter 9


    # Working with Tables


    # In This Chapter


    +   - Creating rows and columns with the TableView

    - Using the TableColumn class to format the individual columns of a table

    - Building a simple items list for a TableView

    - Editing the contents of a TableView


    TableView table is one of JavaFX''s most flexible and powerful controls; it lets
    you display data in a spreadsheet-like format, with rows of data aligned in neat
    columns. Both horizontal and vertical scrolling is provided automatically, and
    you can configure the table control to allow the user to edit the contents of
    the table''s cells.


    In this chapter, you discover several classes that work together to create a table.
    The first is the TableView class, which renders the table within a scene. A table
    consists of one or more columns that are created using the TableColumn class.
    Thus, to create a table, you must first create one or more table columns using
    the TableColumn class, and then use the TableView class to create a table, and
    finally add the columns to the table.


    Because a table control is inextricably bound to an underlying items list, this
    chapter begins by showing you how to create the items list required to support
    a table. The sample data used for this chapter is a DVD movie collection that
    lists each movie''s title, the year it was, and the price paid for the movie.


    Next, you figure out how to display this data in a simple table that shows one
    for each movie in the collection. After you know how to do that, I explore how
    to make the table editable so that the user can correct errors in the data or
    add new movies to the collection.


    Along the way, I discuss how to work with a variety of classes and interfaces
    that are required to support the workings of a table. It''s going to be a fun
    ride, so hang on!'
