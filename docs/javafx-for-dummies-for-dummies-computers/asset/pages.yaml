  md: '# Chapter 10


    # Making Menus


    # In This Chapter


    +   - Creating basic and dynamic menus

    - Working with separators and action listeners

    - Constructing menus with check boxes and radio buttons

    - Creating submenus and custom menu items


    In this chapter, you find out how to adorn your programs with menus. We work with
    menus in applications, so you''re probably already familiar with what menus are
    and how they work. I don''t review those basics in this chapter. Instead, I jump
    right into the details of how to create a menu and add it to a scene.


    # Introducing Classes for Creating Menus


    The following paragraphs describe the classes you use most often when you create
    menus:


    +   - MenuBar: This is the top-level container for menus that appear in the menu
    bar at the top of a scene.

    - Menu: Each menu in the menu bar is represented by a Menu object. The menu bar,
    as shown in Figure 10-1, has two Menu objects: one for the Game menu and the other
    for the Options menu. A Menu object contains a collection of MenuItem objects
    that display when the user clicks the menu.

    - MenuItem: Menu items are represented by the MenuItem class or one of its subclasses.
    The Game menu shown in Figure 10-1 has four MenuItem objects: New Game, Pause
    Game, Quit Game, and Exit. It also includes one SeparatorMenuItem object; SeparatorMenuItem
    is a subclass of the MenuItem.'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# 210 Part II: JavaFX Controls


    Interestingly, the Menu class is actually a subclass of MenuItem. That means that
    the items collection of a menu can contain other submenus. When the user clicks
    the submenu, the submenu''s collection of menu items displays.


    +   - CheckMenuItem: This special type of menu item has a check box associated
    with it. Although they''re not shown in Figure 10-1, the Options menu has two
    CheckMenuItem objects in it. This class extends MenuItem.

    - RadioMenuItem: This special type of menu item has a radio button associated
    with it. The RadioMenuItem class extends MenuItem.

    - CustomMenuItem: A custom menu item can have any JavaFX Node object associated
    with it. With a custom menu item, you can add-controls, such as text fields or
    list boxes, to a menu.

    - SeparatorMenuItem: A separator menu item simply displays a separator line in
    a menu. You use this class to create visual groupings with a menu.


    ![](img/71d6d293a802aaccab3a1d9dafaea059_219_0.png)


    Figure 10-1: A scene with a menu bar.


    # Creating a Basic Menu Bar


    The basics of creating menus are pretty straightforward. First, you create a menu
    bar by calling the MenuBar constructor:


    ```

    MenuBar menu = new MenuBar();

    ```'
