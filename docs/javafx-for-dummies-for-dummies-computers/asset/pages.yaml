    method, it passes you an instance of the Stage class that represents the application''s
    primary stage — that is, the stage that represents the application''s main window.
    This reference is passed via the primaryStageStage argument.


    Having created your scene, you are now ready to finalize the primary stage so
    that the scene can be displayed. To do that, you must do at least two things:


    +   - Call the setScene method of the primary stage to set the scene to be displayed.


    +   - Call the show method of the primary stage to display the scene.


    After you call the show method, your application''s window becomes visible to
    the user and the user can then begin to interact with its controls.


    It''s also custom to set the title displayed in the application''s title bar.
    Do so by calling the setTitle method of the primary stage. The last three lines
    of the start method for the Click Me application perform these functions:


    ```

