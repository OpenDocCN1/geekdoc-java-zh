  md: '# 36 Part I: Getting Started with JavaFX


    # Launching the Application


    As you know, the standard entry-point for Java programs is the main method. Here
    is the main method for the Click Me program:


    ```

    public static void main(String[] args)

    {

    launch(args);

    }

    ```


    As you can see, the main method consists of just one statement, a call to the
    Application class'' launch method.


    The launch method is what actually starts a JavaFX application. The launch method
    is a static method, so it can be called in the static context of the main method.
    It creates an instance of the Application class and then starts the JavaFX lifecycle,
    calling the init and start methods, waiting for the application to finish, and
    then calling the stop method.


    The launch method doesn''t return until the JavaFX application ends. Suppose you
    wrote the main method for the Click Me program:


    ```

    public static void main(String[] args)

    {

    System.out.println("Launching JavaFX");

    launch(args);

    System.out.println("Finished");

    }

    ```


    Then, you would see Launching JavaFX displayed in the console window while the
    JavaFX application window opens. When you close the JavaFX application window,
    you would then see Finished in the console window.


    # Overriding the start Method


    Every JavaFX application must include a start method. You write the code that
    creates the user interface elements your program''s user will interact with the
    start method. For example, the start method in Listing 2-1 contains code that
    displays a button with the text Click me please!


    When a JavaFX application is launched, the JavaFX framework calls the start method
    after the Application class has been initialized.'
