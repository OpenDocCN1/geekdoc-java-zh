  md: '# Combining Transitions


    JavaFX provides two transition classes that are designed to let you combine transitions
    so that two or more transitions run one after the other or at the same time. The
    SequentialTransition class lets you run transitions one after the other, whereas
    the ParallelTransition class lets you run transitions at once.


    Both classes have simple constructors that accept a list of transitions as arguments
    and a play method that lets you start the animations. For example, if you have
    three transitions named t1, t2, and t3 already created, you can run them in sequence
    like this:


    ```

    SequentialTransition s = new SequentialTransition(t1, t2, t3);

    s.play();

    ```


    When the play method is called, transition t1 will run until completion and then
    transition t2 will run. When t2 finishes, transition t3 will be run.


    To run all three transitions simultaneously, use the ParallelTransition class
    instead:


    ```

    ParallelTransition p = new ParallelTransition(t1, t2, t3);

    p.play();

    ```


    If you prefer, you can add animations after the constructor has been called by
    using the addChild method. For example:


    ```

    ParallelTransition p = new ParallelTransition();

    p.getChildren().add(t1);

    p.getChildren().add(t2);

    p.getChildren().add(t3);

    p.play();

    ```


    Or:


    ```

    ParallelTransition p = new ParallelTransition();

    p.getChildren().addAll(t1, t2, t3);

    p.play();

    ```


    Note: An animation added to a Sequential or Parallel Transition can itself be
    a SequentialTransition or a Parallel Transition. For example, suppose you have
    three transitions that animate node (t1, t2, and t3) and a fourth transition that
    animate a second node (t4) and you want to run t1, t2, and t3 in sequence while
    t4 runs at the same time as the sequence. Here''s how you can achieve:'
