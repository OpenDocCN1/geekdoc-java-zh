  md: '# 402 Part V: The Part of Tens


    ![](img/71d6d293a802aaccab3a1d9dafaea059_411_0.png)


    Figure 20-8:

    Your 3D world with a light source.


    The PointLight class defines a light source that originates from a specific point
    in the scene and projects light of the given color (in this case, good of ''white'').
    To create the lighting effect I want, I relocate the light by translating its
    coordinates 1,000 to the left, 100 down, and 1,000 units toward the user. The
    result casts nice shadows on the backsides of the spinning objects.


    # Putting It All Together: The Complete 3D World Program


    Now that you''ve seen all the pieces, Listing 20-1 shows the entire program. Comments
    within the program make it clear which sections of the program correspond to the
    steps outlined in this chapter.'
