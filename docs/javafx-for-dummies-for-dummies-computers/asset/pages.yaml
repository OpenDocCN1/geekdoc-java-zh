  md: "# 316 Part IV: Making Your Programs Come Alive\n\n# Creating a Read-Only Property\n\
    \nAlthough a read-only property has less functionality than a read/write property,\
    \ it's actually more complicated to implement. Why? Because internally within\
    \ the class that contains the read-only property — you need to be able to read\
    \ or write the value of the property. But externally — that is, outside of the\
    \ class that defines the read-only property — you must ensure that users can read\
    \ but not write the property value.\n\nYou might think that omitting the setter\
    \ method would be enough to create a read-only property. But the problem is that\
    \ in addition to getter and setter methods, JavaFX properties also expose a property\
    \ accessor method that provides direct access to the property object itself.\n\
    \nThe following is an example of how *not* to create a read-only property:\n\n\
    ```\nProperty firstName =\nnew SimpleStringProperty(this,\n    \"firstName\");\n\
    \npublic final String getFirstName()\n{\n    return firstName.get();\n}\n\npublic\
    \ final StringProperty firstNameProperty()\n{\n    return firstName;\n}\n```\n\
    \nThis code is the same as the code used to create a read/write property in the\
    \ preceding section, except that I omitted the setFirstName method. Unfortunately,\
    \ this property definition does not prevent users of the class from modifying\
    \ the property. To do so, all the user would need to do access the property and\
    \ then call the property's method directly.\n\nFor example, suppose this property\
    \ is part of a class named Customer, an instance of which is referenced by the\
    \ variable cust. The following code would set the value of the read-only property:\n\
    \n```\ncust.getFirstName().set(\"Bogus Value\");\n```\n\n![](img/71d6d293a802aaccab3a1d9dafaea059_325_0.png)"
  merge: -1
  pgno: 325
- img_proc: true
  md: "# Chapter 15: Using Properties to Create Dynamic Scenes\n\nTo safely create\
    \ a read-only property, you must actually create two copies of the property: a\
    \ read-only version and a read/write version. The read-only version will be exposed\
    \ to the outside world. The read/write version will be used internally, within\
    \ the class that defines the property. Then, you must synchronize these two properties\
    \ so that whenever the value of the internal read/write property changes, the\
    \ value of the external read-only property is updated automatically.\n\nTo accomplish\
    \ this, JavaFX provides two additional classes for each property data type: a\
    \ read-only property class and a read-only wrapper class. The read-only property\
    \ class is the one you share with the outside world via the property accessor\
    \ method. The read-only wrapper class is the one you use to create the private\
    \ field used to reference the property within the program.\n\nHere's a complete\
    \ example that implements a read-only integer property named accountNumber in\
    \ a class named:\n\n```\npublic class Customer {\n    ReadOnlyIntegerWrapper accountNumber\
    \ =\n        new ReadOnlyIntegerWrapper(this,\n        \"customerNumber\", 0);\n\
    \n    public final Integer getCustomerNumber() {\n        return accountNumber.get();\n\
    \    }\n\n    public final ReadOnlyIntegerProperty\n        customerNumber() {\n\
    \        return accountNumber.getReadOnlyProperty();\n    }\n\n    // more class\
    \ details go here\n}\n```\n\nThe key to understanding how this works is an extension\
    \ of the simple property class which adds just one new method: getReadOnlyProperty(),\
    \ which returns a read-only copy of the simple property. This read-only copy is\
    \ automatically synchronized with the simple property, so that whenever a change\
    \ is made to the underlying simple property, the value of the read-only property\
    \ will be changed as well."
  merge: -1
