  md: '# 96 Part I: Getting Started with JavaFX


    # Combining layout panes


    You can combine several layout panes to create layouts that are more complicated
    than a single layout pane can provide. For example, suppose you want to create
    a layout that has a horizontal row of buttons at the bottom and a vertical column
    of buttons at the right. To do that, you could create an HBox for the buttons
    at the bottom and a VBox for the buttons at the right. Then, you could create
    a BorderPane and add the HBox to the bottom region and the VBox to the right region.


    Combinations like this are possible because all the layout panes inherit the base
    class javafx.scene.layout.Pane, which in turn inherits the class javafx.scene.node.
    In other words, all nodes are also nodes. Each node that you add to a layout pane
    can be another layout pane. You can nest layout panes within layout panes as deeply
    as you need to achieve the exact layout you need for your application.


    # Using the HBox Layout


    The HBox class provides one of the simplest of all Java''s layout managers: It
    arranges one or more nodes into a horizontal row. Table 5-1 presents the most
    commonly used constructors and methods of the HBox class.


    | Table 5-1 HBox Constructors and Methods |

    | Constructor | Description |

    | HBox () | Creates an empty HBox. |

    | HBox (double spacing) | Creates an empty HBox with the specified spacing. |

    | HBox(Node. . . children) | Creates an HBox with the specified child nodes. This
    constructor lets you create an HBox and add child nodes to it at the same time.
    |

    | HBox(double spacing, Node. . . children) | Creates an HBox with the specified
    spacing and child nodes. |'
