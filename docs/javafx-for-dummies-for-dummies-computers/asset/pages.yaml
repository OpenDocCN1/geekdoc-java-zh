    # Using Radio Buttons


    Radio buttons are similar to check boxes, but with a crucial difference: They
    travel in groups, and a user can select only one radio button at a time from each
    group. When you click a radio button to select it, the radio button within the
    same group that was previously selected is deselected automatically. Figure 6-3
    shows a window with three radio buttons.'
