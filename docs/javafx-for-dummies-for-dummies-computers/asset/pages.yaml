  md: "# 214 Part II: JavaFX Controls\n\n# Using Separators\n\nA separator is a menu\
    \ item whose only purpose is to create visual separation within a menu so that\
    \ items appear grouped logically. The menu that was shown in Figure 10-1 includes\
    \ a separator that divides the three items that start, pause, or end games from\
    \ the item that exits the program.\n\nTo create a separator, you use the SeparatorMenuItem\
    \ class. Usually you create the separator in the same statement you use to add\
    \ the separator to the menu, like this:\n\n```\nmenuGame.getItems().add(new SeparatorMenuItem());\n\
    ```\n\nHere's an example that adds a separator between the Quit Game menu item\
    \ and the Exit menu:\n\n```\nmenuGame.getChildren().add(new MenuItemNewGame);\n\
    menuGame.getChildren().add(new MenuItemPause);\nmenuGame.getChildren().add(new\
    \ MenuItemQuitGame);\nmenuGame.getChildren().add(new SeparatorMenuItem());\nmenuGame.getChildren().add(new\
    \ MenuItemExit);\n```\n\n# Action Listeners\n\nMenu items generate action events\
    \ when selected by the user. As with any other action event, you handle the action\
    \ events for menus by creating an action event handler that is called when the\
    \ action event is generated. The easiest way to do that is by creating a method\
    \ to call when the action event occurs, and then using a Lambda expression with\
    \ the menu item's setOnClick method to call the method you created.\n\nHere's\
    \ a simple method that you might associate with an Exit menu item. This method\
    \ simply exits the program by calling the close method of the primary stage:\n\
    \n```\nprivate void menuItemExit_OnClick() {\n    stage.close();\n}\n```\n\nNote:\
    \ For this method to work, stage must be a class field that's assigned to the\
    \ primary stage in the program's start method."
