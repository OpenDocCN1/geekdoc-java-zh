  md: "# Chapter 18: Targeting Touch Devices 369\n\nHere's an example that creates\
    \ a rectangle, and then installs a listener for the rotate event and adjusts the\
    \ rectangles rotation when the rotate event is fired:\n\n```\nRectangle r = new\
    \ Rectangle(150, 150, 200, 200);\nr.setFill(Color.DARKGRAY);\nr.setOnRotate(e\
    \ -> {\n    r.setRotate(r.getRotate() + e.getAngle());\n    e.consume();\n});\n\
    ```\n\nThe rotation of the rectangle is modified by first retrieving the current\
    \ rotation and adding the angle retrieved from the rotate event.\n\n![](img/71d6d293a802aaccab3a1d9dafaea059_378_0.png)\n\
    \nThis event handler handles the consume method to discard the event. This is\
    \ important when dealing with gesture events. If you don't consume the event,\
    \ the event will be passed up the chain and may be processed again by objects.\n\
    \nOne other detail you know about is that gesture events have a characteristic\
    \ as inertia, which causes events to continue to be raised after the user completes\
    \ the gesture. For example, when the user completes a scroll gesture, the SCROLL_FINISHED\
    \ event occurs, but several SCROLL events are generated after the SCROLL_FINISHED\
    \ event. This creates a more realistic experience for the user, but can complicate\
    \ your programming.\n\nYou can call the gesture event's isInertia method to determine\
    \ whether an event was created as a result of inertia. Then, if you want to suppress\
    \ the effect of inertia, you can ignore the event if isInertia returns true for\
    \ example:\n\n```\nRectangle r = new Rectangle(150, 150, 200, 200);\nr.setFill(Color.DARKGRAY);\n\
    r.setOnRotate(e -> {\n    if (isInertia()) {\n        r.setRotate(r.getRotate()\
    \ + e.getAngle());\n        e.consume();\n    }\n});\n```\n\nHere, the rectangle\
    \ is rotated only if the event is not generated as a result of inertia."
