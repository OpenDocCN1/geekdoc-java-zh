  md: "# 62 Part I: Getting Started with JavaFX\n\nThe EventHandler interface used\
    \ to handle JavaFX events meets that definition: It has just one abstract method,\
    \ handle. Thus, EventHandler is a functional interface and can be used with Lambda\
    \ expressions.\n\nA Lambda expression is a concise way to create an anonymous\
    \ class that implements a functional interface. Instead of providing a formal\
    \ method declaration that includes the return type, method name, parameter types,\
    \ and method body, you simply define the parameter types and the method body.\
    \ The Java compiler infers the rest based on the context in which you use the\
    \ Lambda expression.\n\nThe parameter types are separated from the method body\
    \ by a new operator — the arrow operator — which consists of a hyphen followed\
    \ by a greaterthan symbol. Here's an example of a Lambda expression that implements\
    \ the EventHandler interface:\n\n```\ne -> {\n  iCounter++;\n  lbl.setText(Integer.toString(iCounter));\n\
    }\n```\n\nIn this case the Lambda expression implements a functional interface\
    \ whose single method accepts a single parameter, identified as e. When the method\
    \ is called, the iCounter variable is incremented and the label text is updated\
    \ to display the new counter value.\n\nHere's how you'd register this Lambda expression\
    \ as the event handler for the button:\n\n```\nbtnAdd.setOnAction(e -> {\n  iCounter++;\n\
    \  lbl.setText(Integer.toString(iCounter));\n});\n```\n\nOne of the interesting\
    \ things about Lambda expressions is that you don't need to know the name of the\
    \ method being called. This is possible because a functional interface used with\
    \ a Lambda expression can have only one abstract method. In the case of the EventHandler\
    \ interface, the method is named handle.\n\nYou also do not need to know the name\
    \ of the interface being implemented. This is possible because the interface is\
    \ determined by the context. The setEventHandler method takes a single parameter\
    \ of type EventHandler. Thus, when you use a Lambda expression in a call to setEventHandler,\
    \ the Java compiler can deduce that the Lambda expression will implement the EventHandler\
    \ interface. And because the EventHandler is the handle method, the compiler can\
    \ deduce that the method body you supply is an implementation of the handle method."
