  md: '# Chapter 20


    # # Ten Steps to Building a 3D World


    In This Chapter


    +   - Creating a virtual 3D world

    - Populating your world with shapes

    - Translating and rotating 3D objects

    - Animating 3D objects

    - Adding a light source for more realism


    JavaFX has built-in support for realistic 3D modeling. In fact, the JavaFX scene
    graph is three-dimensional in nature. Most JavaFX programs work in just two dimensions,
    specifying x- and y-coordinates. But all you have to step into the third dimension
    is specify z-coordinates to place the nodes of your scene graph in three-dimensional
    space.


    JavaFX includes a rich set of classes that are dedicated to creating and visualizing
    3D objects in 3D worlds. You can create three-dimensional shapes, such as cubes
    and cylinders. You can move the virtual camera around within and the 3D space
    to look at your 3D objects from different angles and within perspectives. And
    you even add lighting sources to carefully control the final appearance of your
    virtual worlds. In short, JavaFX is capable of producing 3D scenes.


    In this chapter, I discuss in ten short steps how to create a relatively simple
    3D program that displays the three-dimensional world shown in Figure 20-1. As
    you see, this 3D space includes four shapes: a sphere, a cube, a cylinder, and
    a pyramid. This program also demonstrates several other keys of 3D programming:
    a perspective camera, a Phong material, a light source, and 3D animation.


    Put on your Thinking Cap, as this chapter will get pretty technical at times,
    and many of the concepts presented in this chapter can be confusing, especially
    if this is your first experience with 3D programming.


    ![](img/71d6d293a802aaccab3a1d9dafaea059_398_0.png)'
  merge: -1
  pgno: 398
- img_proc: true
  md: '# 390 Part V: The Part of Tens


    ![](img/71d6d293a802aaccab3a1d9dafaea059_399_0.png)


    # Step One: Add a Perspective Camera


    The first step in creating a three-dimensional JavaFX application is adding a
    camera to the scene graph. You do that by creating a PerspectiveCamera object,
    fiddling with its settings, and then calling the scene''s setCamera method. Here
    is an example:


    ```

    Group root = new Group();

    Scene scene = new Scene(root, 800, 800);

    PerspectiveCamera camera = new PerspectiveCamera(true);

    camera.setTranslateZ(-1000);

    camera.setNearClip(0.1);

    camera.setFarClip(2000.0);

    camera.setFieldOfView(35);

    scene.setCamera(camera);

    ```'
