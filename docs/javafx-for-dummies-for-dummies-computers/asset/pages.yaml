  md: '# 222 Part II: JavaFX Controls


    To create a custom menu item, use the CustomMenuItem class. Table 10-6 shows the
    details of this class.


    | Table 10-6 | The CustomMenuItem Class |

    | --- | --- |

    | Constructor | Description |

    | CustomMenuItem() | Creates an empty custom menu item.

    | CustomMenuItem(Node content) | Creates a custom menu item with the specified
    node as its content.

    | CustomMenuItem(Node content, boolean value) | Creates a custom menu item with
    the specified node as its content and the specified hideOnClick setting.

    | Method | Description |

    | Node getContent() | Gets the menu item''s content.

    | void setContent(Node content) | Sets the menu item''s content.

    | void setHideOnClick(boolean value) | Sets the HideOnClick property. This property
    should be set to false for most custom menu items.

    | boolean isHideOnClick() | Indicates the HideOnClick setting.

    | boolean isDisable() | Returns true if the menu item is disabled.

    | void setDisable(boolean value) | Disables the menu item. If value is true, disables
    the menu item. Otherwise, enables the menu item.

    | setOnAction(EventHandler<ActionEvent> value) | Sets an event handler that is
    called when the user selects this menu item |


    As you can see, you can specify the node that you want to add as the custom menu
    item''s content either in the constructor or via the setContent method.


    One common problem with custom menu items is that they have a tendency to disappear
    when the user clicks them. Because that''s the default behavior for menu items
    is to disappear as soon as they''re clicked. For most custom menu items, that''s
    not desirable. For example, if a custom menu item contains a text field but the
    text field disappears whenever the user clicks it, the user can''t enter anything
    into the text field.'
