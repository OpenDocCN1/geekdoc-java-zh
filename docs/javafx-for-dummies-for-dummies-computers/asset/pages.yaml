  md: '# Chapter 16: Using Images and Media 335


    Both the Media and MediaPlayer classes are in the package javafx.scene.media,
    so you need to add the following import statement to your program:


    ```

    import javafx.scene.media.*;

    ```


    To create a Media object, call the Media class constructor and specify the URI
    (Uniform Resource Identifier) to the media file. If you''re accessing a file from
    the local file system, the best way to get a valid URI is to first create a File
    object using a standard file path for the file. Then, call URI().toString() on
    the File object to get the correct URI. Here''s an example that assumes the local
    file path is in the variable PATH:


    ```

    File f = new File(PATH);

    Media media = new Media(f.toURI().toString());

    ```


    After obtain a Media object, you can easily play it by using the MediaPlayer class:


    ```

    MediaPlayer mplayer = new MediaPlayer(media);

    mplayer.setAutoPlay(true);

    ```


    Here, the MediaPlayer constructor accepts the Media object as its only parameter.
    The setAutoPlay method directs the media player to play the audio clip as it finishes
    loading.


    The MediaPlayer class is not a subclass of Node. That means you can''t add a media
    player to the scene graph. If you want to display standard media controls as play,
    stop, and pause buttons, you must manually create those buttons and use them to
    manipulate the media player object. The MediaPlayer has methods named play, pause,
    and stop to accomplish this.


    Listing 16-2 shows the complete example that loads and plays a media clip when
    the user clicks a button. The example assumes the media clip is named 57428main_houston_problem.mp3.
    This is a recording of astronaut Jim Lovell saying his famous line, "Houston,
    we''ve had a problem," from the Apollo 13 mission. I chose this audio clip because
    you can freely download it from NASA''s website. Just browse to www.nasa.gov/connect/
    scroll down to the Apollo and Mercury section, right-click Apollo 13: Houston,
    We''ve Had a Problem, and choose Save Target As. I saved it to the folder C:\Media.
    If you save it to a different location or use a different .mp3 file, you have
    to adjust the PATH variable accordingly.


    ![](img/71d6d293a802aaccab3a1d9dafaea059_344_0.png)'
