  md: '# Chapter 11: More about Layout Panes for Precise Scene Design


    The typical way to fill a grid pane with nodes is to call the add method for each
    node. However, if you prefer, you can add an entire column or row of nodes with
    a single call to either addColumn or addRow. For example, this example creates
    a label and a text field, and then creates a grid pane and adds the label and
    the text field to the first row:


    ```

    Label lbl1Name = new Label("Name");

    TextField txtName = new TextField();

    GridPane grid = new GridPane();

    grid.addRow(0, lbl1Name, txtName);

    ```


    If a node should span more than one column, you can call the setColorSpan method
    to specify the number of columns the node should span. For example:


    ```

    grid.setColumnSpan(txtName, 2);

    ```


    Here, the txtName node will span two columns. You use the setRowSpan in a similar
    way if you need to configure a node to span multiple rows.


    To control the horizontal alignment of a node, use the setHAlignment method in
    this example:


    ```

    grid.setHAlignment(lbl1Name, HPos.RIGHT);

    ```


    Here, the lbl1Name node is right-aligned within its column. The setValAlignment
    method works in a similar way.


    Like other layout panes, the GridPane class has a host of methods for setting
    spacing and alignment details. You can use the setHGap and setGap methods to set
    the spacing between rows and columns so that your layouts won''t look so cluttered.
    You can use the setPadding and setMargins methods to set padding and margins,
    which work just as they do with other layout panes. And you can set the minimum,
    maximum, and preferred width and height for the grid pane.


    # Working with grid pane constraints


    You can control most aspects of a grid pane''s layouts using methods of the GridPane
    class, but unfortunately, you can''t control the size of individual columns or
    rows. To do that, you must use the ColumnConstraints or RowConstraints class,
    as described in Tables 11-5 and 11-6.'
