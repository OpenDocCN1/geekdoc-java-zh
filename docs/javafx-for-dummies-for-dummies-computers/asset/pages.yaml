  md: "# Creating your own style class names\n\nEvery node has a getStyleClass method\
    \ that returns an observable list of style class names. As a result, a given node\
    \ can have more than one style class name. This can come in handy for scenes that\
    \ have complicated formatting requirements because it allows you to group controls\
    \ together for formatting purposes. For example, you can create additional class\
    \ names to use for buttons if you want one set of buttons to be formatted differently\
    \ than another of buttons.\n\nFor example, suppose you want to set the font size\
    \ for some buttons to 16 points. You could do that by creating a style type called\
    \ button-large in the style sheet, like this:\n\n```\n.button-large {\n  -fx-font-size:\
    \ 16pt;\n}\n```\n\nThen, you could add the button-large style class to the list\
    \ of style classes for the buttons you want formatted with larger type. For example:\n\
    \n```\nButton btn1 = new Button(\"Wow!\");\nbtn1.setStyleClass().add(\"button-large\"\
    );\n```\n\nWhen a node has more than one style class name, all the class names\
    \ will be used when matching selectors in the style sheet. In other words, the\
    \ buttons that have the additional class name named button-large will match style\
    \ rules for both button and button-large.\n\nNote: For many JavaFX nodes, the\
    \ default style class collection is empty. For layout panes, such as HBox and\
    \ BorderPane, do not have a default style class, nor shape classes such as Rectangle\
    \ or Circle. If you want to apply a CSS style to one of these nodes using style\
    \ types, you must call getStyleClass().add to create a style class name for the\
    \ node.\n\n# Using id selectors\n\nIf you want to create a style that applies\
    \ to one and only one node in your scene graph, you can give that node a unique\
    \ id by calling the node's setId method, like this:\n\n```\nButton btnOK = new\
    \ Button(\"OK\");\nbtnOK.setId(\"btn-wow\");\n```"
  merge: -1
