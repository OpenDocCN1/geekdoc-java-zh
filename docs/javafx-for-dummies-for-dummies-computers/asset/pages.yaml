  md: '# Chapter 9: Working with Tables


    To create a table, first call the constructor. Typically, you specify the text
    to appear in the column heading when you call the constructor. You need to specify
    two types for the table column. The first is the type that''s associated with
    the table itself, which is also the type associated with the table''s items collection.
    In the example shown throughout this chapter, this type is Movie because the table
    will display data from an observable list of Movie objects.


    The second type is the data type of the property that displays in this column.
    For the Title property, the type is String. Thus, the constructor for the Title
    column is:


    ```

    TableColumn<Movie, String> colTitle =

    new TableColumn<Movie, String>("Title");

    ```


    You also want to set the width of the column, like this:


    ```

    colTitle.setMinWidth(300);

    ```


    Here, the column will be at least 300 pixels wide. That would be wide enough to
    display most movie titles.


    Next, you need to associate a property from the table''s item collection with
    the column. To do that, call the setCellValue method and supply a cell factory.
    A cell factory is a special type of object that supplies cell values to the table
    column. The easiest way to provide a cell factory is to use the PropertyValueFactory
    class, which lets you create a cell factory that returns a named property from
    the table''s item collection.


    Here''s the code to accomplish that for the Title column:


    ```

    colTitle.setCellValueFactory(

    new PropertyValueFactory<Movie, String>("Title"));

    ```


    This statement calls the constructor of the PropertyValueFactory class, specifying
    Movie as the type of object that will be retrieved from String and as the property''s
    value type, and passing the property''s name (Title) as the sole argument for
    the constructor. The net effect of this statement is that the property value factory
    will call the getTitle method of the Movie class to populate the cells of this
    column.


    For sake of clarity, I simplified the signature of the setCellValueFactory method
    in Table 9-2. The actual signature is:


    ```

    void setCellValueFactory(

    Callback<TableColumn<S,T>, Func<S, ICellFactory<T>>> value);

    ```


    ![](img/71d6d293a802aaccab3a1d9dafaea059_202_0.png)'
