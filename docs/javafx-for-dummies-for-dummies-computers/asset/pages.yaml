    You figure out how to use this technique in the section “Handling Events with
    Inner Classes."


    +   - Create an anonymous class that implements EventHandler.


    I show you how to use this technique in the section “Handling Events with Anonymous
    Inner Ciases."


    +   - Use a Lambda expression to implement the handle method.


    You read about how to use this technique in the section “Using Lambda Expressions
    to Handle Events."


    # 3. Register the event handler with the event source.


    The final step is to register the event handler with the event source so that
    the handle method is called whenever the event occurs.


    Every component that serves as an event source provides a method that lets you
    register event handlers to listen for the event. For example, a Button control
    provides a setInputAction method that lets you register an event handler for the
    action event. In the setInputAction method, you specify the event handler object
    as a parameter. The exact way you do depends on which of the various techniques
    you used to create the event handler.


