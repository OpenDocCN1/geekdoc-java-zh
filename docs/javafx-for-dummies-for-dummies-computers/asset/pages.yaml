  md: '# 104 Part I: Getting Started with JavaFX


    # Using the VBox Layout


    The VBox class is similar to the HBox class, but instead of arranging nodes in
    a row, it arranges them vertically in a column. Table 5-4 shows the most commonly
    used constructors and methods of the VBox class.


    | Table 5-4 | VBox Constructors and Methods |

    | --- | --- |

    | Constructor | Description |

    | VBox() | Creates an empty VBox. |

    | VBox(double spacing) | Creates an empty VBox with the specified spacing. |

    | VBox(Node. . children) | Creates a VBox with the specified child nodes. This
    constructor lets you create a VBox and add child nodes to it at the same time.
    |

    | VBox(double spacing, Node. . children) | Creates a VBox with the specified spacing
    and child nodes. |

    | ObservableList<Node> getChildren() | Returns the collection of all child nodes
    that have been added to the VBox. The collection is returned as an ObservableList
    type, which includes the method addAll, adding one or more nodes to the list.
