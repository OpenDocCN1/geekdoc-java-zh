    To create a grid pane, you first call the GridPane constructor. You use the add
    method to add nodes to the grid pane''s cells. The parameters of the add method
    specify the node to be added, the node''s column index, and the node''s row index.
    For example, the following code snippet creates a label, and then creates a grid
    pane and adds the label to the cell at column 0, row 0:


    ```

    Label lblName = new Label("Name");

    GridPane grid = new GridPane();

    grid.add(lblName, 0, 0);

    ```'
