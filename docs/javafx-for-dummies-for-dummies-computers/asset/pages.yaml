  md: '# 88 Part I: Getting Started with JavaFX


    # Shakespeare''s Best Stage Direction


    So far in this chapter, I''ve quoted William Shakespeare once and Snagglepuls
    once. Both quotes are appropriate for the topic of this chapter: The Shakespeare
    quotation from Henry V refers to stages and scenes, and the Snagglepuls refers
    to the proper way to exit the stage. Even so, quoting Snagglepuls as Shakespeare
    seems a little out of balance. Thus, I think it''s best to throw in another Shakespeare
    to say what little I may still learn from my college professors.


    somtimes they''re a bit ambiguous, such as Enter a messenger with two heads and
    a hand from Titus Andronicus.


    But in opinion, the most interesting of all Shakespeare''s stage directions is
    found in The Winter''s Tale, where Antigonus is thwarted by rescuing Perdida following
    a shipwreck: Exit, pursued by a bear.


    When you exit the stage because you''re pursued by a bear, you don''t get to collect
    your things or accomplish any of the other important tasks you had set out to
    do, such as saving the prince or saving the changes made to a document. Instead,
    you just turn and run, which is pretty much what happens when the user clicks
    the window close button unless you properly handle the CloseRequest event.


    Shakespeare''s plays are liberally sprinkled with stage directions. Most of them
    are very brief, such as Enter Tybalt or Exit Romeo in Romeo and Juliet. A few
    are more detailed, as Enter of both houses, who join the fray, also from Romeo
    and Juliet.


    # Handling the CloseRequest event


    Providing a Close button is an excellent way to allow your users to cleanly exit
    from your program. However, the user can bypass your exit processing by simply
    closing the window — that is, by clicking the window close button, usually represented
    as an X in the upper-right corner of the window border. Unless you provide otherwise,
    clicking this button unceremoniously terminates the application, bypassing all
    your nice code that confirms whether the user wants to save his work, closes any
    open resources, and otherwise provides for a graceful exit.


    Fortunately, you can easily avoid such graceful exits. Whenever the user attempts
    to close the window within which a JavaFX stage is displayed, JavaFX generates
    a CloseRequest event, which is sent to the stage. You can provide an event handler
    for this event by calling the setOnCloseRequest method of the Stage class. Then,
    the event handler is called whenever the user tries to close the window.


