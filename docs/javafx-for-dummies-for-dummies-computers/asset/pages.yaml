  md: '# Developing the Click Me Program with TextPad


    TextPad is an inexpensive ($33) text editor that you can integrate with the Java
    Development Kit (JDK) to simplify the task of coding, compiling, and running Java
    programs. It isn''t a true integrated development environment (IDE), as it lacks
    features such as integrated debugging, code generators, and drag-and-drop tools
    for creating graphical user interfaces.


    TextPad is a popular tool for developing Java programs because of its simplicity
    and speed. It''s ideal for learning Java because it''s easy to use, so you can
    concentrate on learning Java rather than on how to use a complicated development
    environment.


    You can download a free evaluation version of TextPad from Helios Software Solutions
    at www.textpad.com. You can use the evaluation free of charge, if you decide to
    keep the program, you must pay for it. (Helios accepts credit card payments.)


    If the Java JDK is already installed on your computer, when you install TextPad,
    TextPad automatically configures itself to compile and run Java programs. If you
    install the JDK after you install TextPad, you need to configure TextPad for Java
    by opening the Preferences dialog box (by choosing Preferences), selecting Tools
    in the tree on the left side of the dialog box, and then choosing Add: Java SDK
    Commands.


    After you configure TextPad to compile and run Java programs, you can create the
    Click Me program by following these steps:


    +   1. Start TextPad.


    +   TextPad automatically opens with an empty source document named Document1.


    +   2. Choose File:Save, type ClickMe.java, and then click Save.


    +   This saves the file with the name ClickMe.java. Saving the file with a name
    that uses the extension .java before you enter any text into the file lets TextPad
    slip into Java editing mode, which makes it easier for you to enter and edit the
    Java source code for the Click Me program.


    +   3. Type the text of the Click Me program from Listing 1-1 into the Document1
    window.'
