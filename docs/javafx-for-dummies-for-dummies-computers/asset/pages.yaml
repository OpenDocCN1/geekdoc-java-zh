  md: '# Chapter 19: Ten More JavaFX Controls


    # Accordion


    An accordion is a stack of titled panes. Only one of the titled panes in the accordion
    can be opened at any given moment. So if one of the titled panes in the accordion
    is open and you open a different pane, the one that was open automatically closes.
    Figure 19-2 shows an accordion pane that contains three titled panes; the same
    accordion pane is shown three times in the figure, each time with a different
    one of the titled panes opened.


    | Size | Size | Size |

    |---|---|---|

    | Small | Style | Style |

    | Medium | Thin crust | Toppings |

    | Large | Thick crust | Pepperoni |

    | Style | Toppings | Olives |

    | Toppings | | Mushrooms |

    | | | Anchovies |


    Figure 19-2 An accordion.


    To create an accordion control, you first create the separate titled panes that
    will make up the accordion. Then, you create the accordion using the default constructor
    and add the titled panes using the getPanes() .addAll The following code sample
    shows how I created the accordion shown in Figure 19-2:


    ```

    // Create the size toggle pane

    RadioButton rbSmall = new RadioButton("Small");

    RadioButton rbMedium = new RadioButton("Medium");

    RadioButton rbLarge = new RadioButton("Large");

    ```


    ```

    ToggleButton sizeGroup = new ToggleGroup();

    sizeGroup.getToggles().addAll(rbSmall, rbMedium, rbLarge);

    rbMedium.setSelected(true);

    ```


    ```

    VBox sizeBox = new VBox(10);

    sizeBox.setPadding(new Insets(10));

    Box.getChildren().addAll(rbSmall, rbMedium, rbLarge);

    ```'
