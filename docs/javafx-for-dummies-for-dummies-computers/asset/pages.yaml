  md: '# 160 Part II: JavaFX Controls


    # Working with Observable Lists


    As you saw in the previous section, the ChoiceBox class does not include methods
    that let you directly add or remove items from the list displayed by the choice
    box. Instead, it includes a method getItems that returns an object of type ObservableList.
    The object returned by this method is an observable list, it represents the list
    displayed by the choice box.


    To work with the items displayed by a choice box, you must first access the observable
    list and then use methods of the ObservableList class to access the individual
    items in the list.


    Observable lists are used not only by the ChoiceBox class, but also by other control
    classes that display list items, such as ComboBox and List, which you can read
    about later in this chapter. Both of those classes have a getItems method that
    returns an ObservableList.


    Observable lists are also used by layout panes, such as HBox and VBox, which you
    can read about later in Chapter 5. The getChildren method''s common to all layout
    classes returns an ObservableList.


    So far in this book, I''ve discussed two methods of the ObservableList interface:
    add and add, which lets you add items to the observable list. Here''s an example
    of the method from earlier in this chapter:


    ```

    comboBox.getItems().add("Baseful");

    ```


    And here''s an example from Chapter 5, which uses the add method to add buttons
    to a layout pane:


    ```

    pane.getChildren().add(btnOK, btnCancel);

    ```


    The ObservableList interface has many other methods besides addAll. Table 8-2
    shows the methods you''re most likely to use.


    | Table 8-2 Commonly Used ObservableList Methods |

    | Method | Description |

    | void add(E element) | Adds the specified element to the end of the list. |

    | void add(int index, E element) | Adds the specified object to the list at the
    specified index position. |

    | void addAll(E...elements) | Adds all the specified elements to the end of the
    list. |'
