  md: '# 146 Part II: JavaFX Controls


    # The Node Class


    The JavaFX Control class hierarchy begins at the Node class, which represents
    an object that can be added to the JavaFX scene. Well, actually, the topmost class
    in the Control class hierarchy is the Object class, but that''s hardly worth mentioning
    here because all class hierarchies begin with the Object class — Object is the
    mother of all Java classes.


    All objects that are part of a scene belong to a scene graph, which is a tree
    structure that contains all the nodes that make up a user interface. To be part
    of a scene graph, an object must inherit the Node class. Thus, the Node class
    is the base class for all classes that can be added to a JavaFX scene.


    Like other tree structure, a scene graph begins with a single node — the root
    node — can have one or more child nodes, each of which in turn can have one or
    more child nodes. A node that has at least one child node is a branch node; a
    node that has no children is a leaf node. A scene can have only one root, but
    it can have many branch and leaf nodes.


    The Node class is an abstract class, which means that you can''t directly create
    an instance of it. In other words, the following code results in a compiler error:


    ```

    myNode = new Node();

    ```


    However, you can use the Node class to hold nodes whose type you are uncertain
    of or don''t care about. For example:


    ```

    myNode = new Button();

    ```


    In this case, the myNode variable is of type Node, but it''s used to hold a reference
    to a Button control.


    Many methods of classes use up and down the Node hierarchy accept or return objects
    of type Node. For example, the getChildren method used with layout panes, as HBox
    and FlowPane, returns list of Node Objects. and the add method used to add an
    object to a layout pane''s node list accepts a Node object as a parameter. In
    other words, any Node object can be added to a layout pane.


    Table 7-1 lists just a few of the methods that you''re likely to use in most JavaFX
    programs. Note that this table drastically simplifies the complexity of the Node
    class. There are actually more than 300 methods defined by this class. More than
    one third of them are related to event handling: The Node class is'
  merge: -1
