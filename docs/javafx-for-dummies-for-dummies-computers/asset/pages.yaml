  md: '# The fast and easy way to unleash the power of JavaFX


    No experience with JavaFX? No problem! This hands-on guide highlights the most
    important features of this powerful graphics platform, giving you the tools to
    understand it quickly and easily. You''ll find out how to work with JavaFX controls,
    enhance your scenic design, and create more efficient coding for a variety of
    connected devices.


    +   - Hello, JavaFX — peruse the possibilities of JavaFX, take a look at a simple
    JavaFX program, download and install JavaFX, and get familiar with the Click me
    program

    - All the world''s stage — find out how to set the stage and scene layout, use
    layout panes to arrange your scenes, create a dialog box and close button, and
    get input from the user

    - Take the reigns — get familiar with the JavaFX node hierarchy, choose from a
    list, work with tables, and make menus

    - Growing panes — discover more about layout panes for precise scene design and
    start drawing shapes and adding special effects like a JavaFX pro

    - Do it dynamically — use properties, images, and media to create dynamic scenes,
    and get the know-how to animate your scenes and target device touches


    +   Open the book and find:

    - How to import JavaFX packages

    - Tips on implementing the event handler interface

    - Ways to draw transparently and use a gradient fill

    - Instruction on adding shadows and creating reflections

    - How to work with audio and video files

    - The lowdown on gestures and touch events

    - Links to a handy cheatset and cool extras


    ![](img/71d6d293a802aaccab3a1d9dafaea059_435_0.png)


    Doug Lowe has been writing computer programming guys who invented Java were in
    high school. Lowe has written books on a wide variety of topics and is the bestselling
    author of more than 30 For Dummies books, including all editions of Java All-In-One
    For Dummies.


