  md: "# 258 Part III: Enhancing Your Scenic Design\n\nWhen you apply a style sheet\
    \ to a scene, any styles contained in that default style sheet override any corresponding\
    \ styles in the application's style sheet. Similarly, if you apply a style sheet\
    \ to a specific node, the styles in that style sheet override any corresponding\
    \ styles in the style sheet to the scene.\n\n![](img/71d6d293a802aaccab3a1d9dafaea059_267_0.png)\n\
    \nYou can create as many style sheets as you want, applying different style sheets\
    \ to different parent nodes in the scene. However, you'll find it easier to manage\
    \ your styles and create consistency if you stick to just one style sheet applied\
    \ at the scene level.\n\nA style sheet applied to a scene or parent node is actually\
    \ a separate file with the extension .css. The style sheet contains formatting\
    \ rules that provide the specifics for the formatting you want for your application.\n\
    \nYou can read about the details of creating a style sheet in the section “Creating\
    \ a Style Sheet” later in this chapter. For now, I introduce a very simple style\
    \ sheet named Simple.css that specifies the font to use for text and a back-ground\
    \ color. The Simple .css style sheet consists of the following lines:\n\n```\n\
    .root {\n  -fx-background-color: lightgray;\n  -fx-font-family: serif;\n  -fx-font-size:\
    \ 12pt;\n}\n```\n\nThe first line specifies that the formatting between the curly\
    \ braces follows applies through the entire scene graph. Then, within the curly\
    \ braces, three formatting rules are used to specify that the background color\
    \ should be lightgray, the font should be serif, and the font size should be 12\
    \ points.\n\nThe easiest way to add a style sheet to a scene is to get the scene's\
    \ style sheet collection (a scene can have more than one style sheet), use the\
    \ add method to add the style sheet, like this:\n\n```\nscene.getStylesheets().add(\"\
    Simple.css\");\n```\n\n![](img/71d6d293a802aaccab3a1d9dafaea059_267_1.png)\n\n\
    To keep the code examples in this book simple, the rest of the examples in this\
    \ chapter use the simple technique shown in the preceding example. However, simply\
    \ specifying the stylesheet name as the parameter to the add method code will\
    \ work only if the style sheet file resides in the same folder as the application's\
    \ class file. If the style sheet resides elsewhere, use the following code instead:"
