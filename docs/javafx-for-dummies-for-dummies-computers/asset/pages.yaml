  md: '# Perusing the Possibilities of JavaFX


    One of the basic strengths of JavaFX is its ability to let you easily create complicated
    graphical user interfaces with all the classic user interface gizmos everyone
    knows and loves. JavaFX provides a full range of controls — dozens of them in
    fact, including the classics such as buttons, labels, text boxes, boxes, drop-down
    lists, and menus, as well as more exotic controls such as tagged panes and accordion
    panes. Figure 1-1 shows a typical JavaFX interface that uses several of these
    control types to create a form for data entry.


    ![](img/71d6d293a802aaccab3a1d9dafaea059_20_0.png)


    **Figure 1-1:** A typical JavaFX program.


    Truthfully, the data-entry form shown in Figure 1-1 isn''t very remarkable. In
    fact, you can easily create data-entry forms like this using Swing with about
    the same amount of effort. The real advantages of using JavaFX over Swing don''t
    become apparent until you start using some of the advanced JavaFX features.


    For starters, consider the general appearance of the data-entry form shown in
    Figure 1-1. The appearance of the buttons, labels, text fields, radio buttons,
    and check boxes are a bit dated. The visual differences between the dialog box
    shown in Figure 1-1 and one you''ve created in Visual Basic on a Windows 95 computer
    20 years ago are minor.


    Where JavaFX begins to shine is in its ability to easily allow you to improve
    the appearance of your interface by using Cascading Style Sheets (CSS). CSS makes
    it easy to customize many aspects of the appearance of your user'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Part I: Getting Started with JavaFX


    interface controls by placing all the formatting information in a separate file
    dubbed a style sheet. A style sheet is a simple text file that provides a set
    of rules for formatting the various elements of the user interface. You can use
    CSS to control literally hundreds of formatting properties. For example, you can
    easily change the text properties such as font, size, color, and weight, and you
    can add a background image, gradient fills, borders, and special effects such
    as shadows, blurs, and light sources.


    Figure 1-2 shows a variation of the form that was shown in Figure 1-1, this time
    formatted with CSS. The simple CSS file for this form adds a background image,
    enhances the appearance of the buttons.


    ![](img/71d6d293a802aaccab3a1d9dafaea059_21_0.png)


    Figure 1-2: JavaFX lets you use CSS to specify formatting for user interface elements.


    Besides CSS, JavaFX offers many other capabilities. These are the most important:


    +   - Visual effects: You can add a wide variety of visual effects to your interface
    elements, including shadows, reflections, blurs, lighting, and perspective effects.


    +   - Animation: You can specify animation effects that apply transitions gradually
    over time.


    +   - Charts: You can create bar charts, pie charts, and many other chart types
    using the many classes of the javafx.scene.chart package.


    +   - 3-D objects: You can draw three-dimensional objects such as cubes, spheres,
    and more complex shapes.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '+   - Touch interface: JavaFX can handle touchscreen devices, such as smartphones
    and tablet computers with ease.


    +   - Property bindings: JavaFX lets you create properties, which are special
    data types that can be bound to user interface controls. For example, you can
    create a property that represents the price of an item being purchased and then
    bind a label to it. Then, whenever the value of the price changes, the value displayed
    by the label is updated automatically.


    You discover all these features and more in later chapters of this book. But for
    now, it''s time to have a look at a simple JavaFX program so you can get a feel
    for what JavaFX programs look like.


    # Looking at a Simple JavaFX Program


    Figure 1-3 shows the user interface for a very simple JavaFX program that includes
    just a single button. Initially, when clicked, the text of this button says Click
    me please! When you click the button again, the text changes back to Click me
    please! Thereafter, each time you click the button, the text cycles between Click
    me please! and You clicked me!


    ![](img/71d6d293a802aaccab3a1d9dafaea059_22_0.png)


    To give you an idea of what JavaFX programming looks like, Listing 1-1 shows the
    complete listing for this program. I won''t explain the details of how this program
    works — I examine this program in painstakingstaking detail in Chapter 2. For
    now, I just want you to get the big picture to give you a feel for what JavaFX
    programming looks like.'
