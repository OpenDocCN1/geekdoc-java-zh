  md: '# Creating the Data for a Table


    The underlying data for a table control is an ObservableList, just as for a list
    view, combo box, or choice box. However, the nature of a table control lends itself
    to more complicated data structures that can be displayed by a list view or other
    simple list-based controls. List views, combo boxes, and choice boxes can display
    one data value for each item in the underlying list. In contrast, a table can
    display multiple values from the underlying list, each in its own column.


    The most common way to create the items list for a table is to create a custom
    class that defines the objects that will display in the table. Then, the table
    can extract the data for each column by calling various methods of the custom
    data class.


    For example, Table 9-1 shows the constructors and methods of a Movie class that
    will serve as the data model for all the examples shown in this chapter. This
    class keeps track of three values associated with each movie: title, year, and
    price. Methods are provided to get or set these values.


    | Constructor | Description |

    | --- | --- |

    | Movie() | Creates an empty Movie object. |

    | Movie (String title, int year, double price) | Creates a Movie object with the
    specified title, year, and price. |

    | Method | Description |

    | String getTitle() | Gets the title. |

    | void setTitle(String title) | Sets the title. |

    | int getYear() | Gets the year. |

    | void setYear(int year) | Sets the year. |

    | double getPrice() | Gets the price. |

    | void setPrice(double price) | Sets the price. |


    Note that the names of these methods all either include the word get or set. That''s
    required for the class to work as the items list for a table control. In JavaFX
    parlance, the values these methods access are properties. The'
