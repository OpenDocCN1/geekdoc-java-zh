    # # Translating, Scaling, and Rotating


    This section describes several methods of the Node class that are especially useful
    when working with shapes:


    +   - The setTranslateX and setTranslate methods moves the (0,0) point from the
    top-left corner to any arbitrary point.

    - The setScaleX and setScale let you change the scale of a shape so that it appears
    smaller or larger.

    - The rotate method rotates the component''s coordinate system so that shapes
    are drawn at an angle


