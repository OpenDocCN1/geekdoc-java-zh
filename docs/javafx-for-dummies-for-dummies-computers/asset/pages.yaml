  md: '# Chapter 5: Using Layout Panes to Arrange Scenes 115


    Here, three buttons are created and added to a VBox. Then, a border layout is
    created, and the VBox is added to its center region.


    Alternatively, you can add a node to the center region via the BorderPane constructor,
    like this:


    ```

    BorderPane pane = new BorderPane(vbox);

    ```


    The third constructor listed in Table 5-7 lets you add nodes to all five regions
    at once. The following example assumes that you have already created five panes,
    named centerPane, topPane, rightPane, bottomPane, and leftPane:


    ```

    BorderPane pane = new BorderPane(centerPane, topPane, rightPane, bottomPane, leftPane);

    ```


    Here are a few additional important points to know about the BorderPane class:


    +   - If you don''t add a node to one of the regions, that region is not rendered.


    +   - The border layout regions are sized according to their contents.


    +   Thus, if you add a VBox to the right region, the width of the VBox pane will
    determine the width of the right region.


    +   - If the user resizes the window to make it wider, the top, center, and bottom
    regions will expand in width — the width of the left and right regions remains
    unchanged.


    +   Similarly, if the user drags the window to make it taller, the left, center,
    and right regions expand in height; the height of the top and bottom regions remain
    the same.


    +   - The nodes you add to the regions of a border pane will themselves almost
    always be other layout panes.


    In Chapter 6, you see a comprehensive example that shows how to create a complex
    layout that uses various combinations of VBox, HBox, and FlowPane layout panes
    as the nodes for each region of a BorderPane.


