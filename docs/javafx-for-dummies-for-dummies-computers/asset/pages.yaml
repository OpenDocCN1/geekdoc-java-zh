  md: '# Chapter 8: Choosing from a List


    Before I get into the mechanics of how to create a tree control, you need to know
    a few terms that describe the elements in the tree itself:


    +   - **Node:** Each element in the tree is a **node**. Each node in a tree is
    created from TreeItem class. The TreeItem class is a generic class, so you can
    associate a type with it. Thus, you can create a tree using objects of any type
    you wish, including types you create yourself.

    - **Root node:** A root node is the starting node for a tree. Every tree must
    have one — and only one — root node. When you create a tree component, you pass
    the root node to the Tree constructor.

    - **Child node:** The nodes that appear immediately below a given node are that''s
    child nodes. A node can have more than one child.

    - **Parent node:** The node immediately above a given node is that''s parent node.
    Every node except the root node must have — and only one — parent.

    - **Sibling node:** Sibling nodes are children of the same parent.

    - **Leaf node:** A *leaf node* is one that doesn''t have any children.

    - **Path:** A path contains the node and all its ancestors — that is, its parent,
    its''s parent, and so on — all the way back to the root.

    - **Expanded node:** An *expanded node* is one whose children are visible.

    - **Collapsed node:** A *collapsed node* is one whose children are hidden.


    # Building a tree


    Before you can actually create a tree view, you must first build the tree it displays.
    To do that, use the `TreeItem` class, the details of which I discuss in Table
    8-5.


    | Table 8-5 | The TreeItem Class |

    | --- | --- |

    | Constructor | Description |

    | `TreeItem<T>()` | Creates an empty tree node. |

    | `TreeItem<T>(T value)` | Creates a tree node with the specified value. |


    (continued)'
