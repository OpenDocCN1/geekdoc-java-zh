- img_proc: true
  md: '# Chapter 7: Introducing the JavaFX Node Hierarchy


    the class that''s responsible for most event handling for all nodes, including
    events that handle mouse, keyboard, and touchscreen interaction with the node.


    | Table 7-1 Commonly Used Methods of the Node Class |

    | Method | Explanation |

    | Parent getParent() | Returns this node''s Parent node. |

    | String getId() | Returns the ID of this node. |

    | void setId(String id) | Sets the ID of this node. The ID should be unique within
    the scene graph. |

    | Node lookup(String id) | Searches the node''s children for a node whose ID matches
    the parameter. |

    | String getStyle() | Returns the CSS style string for the node. |

    | Void setStyle(String style) | Sets the CSS style string for the node. |


    The getParent method returns a node''s parent node. This method returns an object
    of type Parent, which is a node that can have children (as discover in the following
    section). Every node in a scene graph except the root node must have a parent
    node, and that parent node will always be of type Parent. If you call this method
    on the root node, null will be returned.


    Notice that every node can have a unique string identifier, which makes it easy
    to distinguish nodes from one another in complicated scene graphs and can also
    be helpful when using CSS to format your scenes. You can set the string identifier
    by calling the setId method, which accepts a string argument like this:


    ```

    myNode.setId("LBL3");

    ```


    Here, the later find this node by calling the lookup method. This method is a
    little quirky in that you must preface the ID you''re looking for with a hash
    symbol (#). For example, here''s how you might search an entire scene graph for
    a control whose ID is LBL3:


    ```

    Node myNode = scene.getRoot().lookup("#LBL3");

    ```'
