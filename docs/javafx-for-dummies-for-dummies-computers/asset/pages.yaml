  md: '# Chapter 12: Skinning Your Application with CSS


    Then, you can create a style rule that applies only to the node whose id is btn0OK.
    In the selector, you must prefix the id with a hash mark, like this:


    ```

    #btn-wow

    {\  -fx-font-weight: bold;

    }

    ```


    The hash mark (#) is not used in the setId method to create the id, but it is
    required in the style sheet.


    Node ids must be unique across the entire scene graph. In other words, you cannot
    create two nodes with the same id. Unfortunately, JavaFX does not enforce this,
    so it''s up to you to make sure your node ids are unique.


    ![](img/71d6d293a802aaccab3a1d9dafaea059_272_0.png)


    # Using multiple selectors


    A style selector can list more than one style type or id. To do that, you list
    all the types or ids as part of the selector, separating them with commas. For
    example, here is a style that''s applied to all buttons, radio buttons, and check
    boxes:


    ```

    .button, .radio-button, .check-box

    {\  -fx-font-family: "serif";

    }

    ```


    Here''s an example that includes several ids:


    ```

    #btn1, #btn2, #btn3, #btn4

    {\  -fx-fill: GREEN;

    }

    ```


    # Specifying Style Properties


    Within the declaration block of a style rule, each declaration specifies a style
    property and a value. For example, to set the font size to 12 points, use -fx-font-size
    as the property name and 12pt as the value. In all, hundreds of style properties
    exist. Not all properties apply to all node types, however. Thus, each JavaFX
    node class has its own set of style properties.


    All JavaFX style properties begin with the prefix -fx-. The following sections
    describe some of the more commonly used properties.'
