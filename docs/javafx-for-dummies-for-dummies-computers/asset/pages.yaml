  md: '# Chapter 6: Getting Input from the User


    The usual way to create a radio button is to declare a variable to refer to the
    button as a class variable so that it can be accessed anywhere in the class, as
    in this example:


    ```

    RadioButton rdoSmall, rdoMedium, rdoLarge;

    ```


    Then, in the start method, you call the RadioButton constructor to create the
    radio button:


    ```

    rdoSmall = new RadioButton("Small");

    ```


    Thereafter, you can add the radio button to a layout pane to work in the usual
    way.


    To create a toggle group to group radio buttons that work together, call the ToggleGroup
    class constructor:


    ```

    ToggleGroup sizeGroup = new ToggleGroup();

    ```


    Then call the setToggleGroup method of each radio button:


    ```

    rdoSmall.setToggleGroup(sizeGroup);

    rdoMedium.setToggleGroup(sizeGroup);

    rdoLarge.setToggleGroup(sizeGroup);

    ```


    Toggle groups have nothing to do with how radio button displays. To display radio
    buttons, you must still add them to a layout pane. There''s no rule that says
    all the radio buttons within a toggle group must be added to the same layout pane.
    However, it is customary to display all the radio buttons in a single toggle group
    together on the scene so that the user can easily see that radio buttons belonging
    together.


    If you''ve worked with radio buttons in Swing, you''ll want to note an important
    distinction between the way JavaFX toggle groups work versus how button groups
    work in Swing. In JavaFX, radio buttons that are outside a toggle group are independent
    of one another. In Swing, radio buttons that are outside a button group are all
    of a default group. Thus, in JavaFX, always add radio buttons to a toggle group,
    even if the scene has only a single toggle group.


