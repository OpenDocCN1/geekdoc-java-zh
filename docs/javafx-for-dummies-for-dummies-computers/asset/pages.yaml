  md: "# 314 Part IV: Making Your Programs Come Alive\n\n# Creating a ReadWrite Property\n\
    \nTo create a basic property whose value can be read and written, you need to\
    \ use two of the classes for the property type: the property class of the correct\
    \ type and the corresponding simple property. For example, to create a property\
    \ of type Double, you need to use both the DoubleProperty class and the SimpleDoubleProperty\
    \ class.\n\nHere are the steps to create a read/write property:\n\n+   1. Create\
    \ a local field for the property using the property class for the correct type.\n\
    \nThe field should be defined with private visibility, and it should be final.\
    \ For example:\n\n```\nprivate String Property firstName;\n```\n\n+   2. Create\
    \ an instance of the property using the simple property class of the correct type.\n\
    \nThe constructor for the simple property type accepts three parameters, representing\
    \ the object that contains the property (usually specified as this, a string that\
    \ represents the name of the property, and the property's default value). For\
    \ example:\n\n```\nfirstName = new SimpleStringProperty(this,\n\"firstName\",\
    \ \"\");\n```\n\nHere, this is specified as the containing object, firstName is\
    \ the name of the property, and the default value is an empty string.\n\nIt is\
    \ often convenient to declare the private field and instantiate it in the same\
    \ statement, like this:\n\n```\nStringProperty firstName =\nnew SimpleStringProperty(this,\n\
    \"firstName\", \"\");\n```\n\n+   3. Create a getter for the property.\n\nThe\
    \ getter method should be public or protected, it should be final, it should follow\
    \ the property naming convention (get followed by the name of the property with\
    \ an initial cap), and it should return a value of the underlying property type.\
    \ It should then call the private property's get method to retrieve the value\
    \ of the property, like this:\n\n```\n{\npublic final String getFirstName\n  return\
    \ firstName.get();\n}\n```\n\n![](img/71d6d293a802aaccab3a1d9dafaea059_323_0.png)"
  merge: -1
  pgno: 323
- img_proc: true
  md: "# Chapter 15: Using Properties to Create Dynamic Scenes\n\n+   4. **Create\
    \ a setter for the property.**\n\nThe setter method name should be public or protected,\
    \ it should be final, it should follow the property naming convention (set followed\
    \ by the name of the property with an initial cap), and it should accept a parameter\
    \ value of the underlying property type. It should then call the private property's\
    \ set method to set the property to the passed value. For example:\n\n```\npublic\
    \ final void setFirstName(String value) {\n    firstName.set(value);\n}\n```\n\
    \n+   5. **Create the property accessor object itself:**\n\nThis method should\
    \ return the property object itself:\npublic final StringProperty firstNameProperty()\
    \ {\n    return firstName;\n}\n\nNotice that the type is StringProperty, not SimpleStringProperty.\n\
    \n+   6. **Repeat the entire procedure for every property in your class.**\n\n\
    Here's a complete example that implements a read/write property named firstName\
    \ in a class named Customer:\n\n```\npublic class Customer {\n    StringProperty\
    \ firstName = new SimpleStringProperty(this, \"firstName\", \"\");\n\n    public\
    \ final String getFirstName() {\n        return firstName.get();\n    }\n\n  \
    \  public final void setFirstName(String value) {\n        firstName.set(value);\n\
    \    }\n\n    public final StringProperty firstNameProperty() {\n        return\
    \ firstName;\n    }\n}\n```"
