  md: "# Chapter 12: Skinning Your Application with CSS\n\n```\nscene.getStylesheets().add(\n\
    \  getClass().getResource(\"Simple.css\")\n.toExternalForm());\n```\n\nInstead\
    \ of simply providing the name of the style sheet as a string, this technique\
    \ calls the getClass method of the Object class, which returns a reference to\
    \ the application's class. Then, it calls the Class getResource method, which\
    \ accepts a string parameter that names an external resource (such as a file)\
    \ that's located on the application's class path. This returns the URL of the\
