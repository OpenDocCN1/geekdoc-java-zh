  md: 'The following paragraphs help clarify some of the key sticking points that
    might be tripping you up about the Click Counter program and JavaFX in general:


    +   - When does the program switch from static to non-static? Like every Java
    program, the main entry point of a JavaFX program is the static main method.


    In JavaFX programs, the static main method does just one thing: It calls the launch
    method to start the JavaFX portion of the program. The launch method creates an
    instance of the ClickCounter class and then calls the start method. At that point,
    the program is no longer running in a static context because an instance of the
    ClickCounter class has been created.


    +   - Where does the primaryStage variable come from? The primaryStage variable
    is passed to the start method when the launch method calls the start method. Thus,
    the start method receives the primaryStage variable as a parameter.


    That''s why you won''t find a separate variable declaration for the primaryStage
    variable.


    +   - How does the -> operator work? The -> operator is used to create what is
    known as a Lambda expression. Lambda expressions are a new feature of Java 8 that
    are used in situations that would''ve previously required an anonymous class.
    Don''t worry if you don''t understand the Lambda expression works. I explain them
    in detail in Chapter 3.


