  md: '# Part IV: Making Your Programs Come Alive


    # Improving the Ball Bouncer


    The program shown in Listing 17-3 is finally beginning to resemble something that
    might be useful in a game program. With a little more programming effort, you
    can convert this program into something resembling the classic Pong game.


    But to be more useful, the ball bouncing program needs to support more than one
    ball at a time within the scene. And after you add a second ball, the program
    should provide for the balls bouncing not only off the walls, but also off each
    other. Figure 17-4 shows a program that does just that that. Here, a total of
    ten balls are flying around within the crowded scene. The balls bounce off the
    walls and each other.


    ![](img/71d6d293a802aaccab3a1d9dafaea059_367_0.png)


    Figure 17-4: Lots of bouncing balls!


    To implement this program, I created a separate class named Ball that extends
    the Circle class. The Ball class provides the following features:


    +   - You specify the radius of the ball via the constructor. The ball is filled
    automatically with a red gradient to give it a three-dimensional appearance.

    - You also specify the width and height of the bouncing area in the constructor.
    The ball is given an initial random position within this area, and automatically
    travels at a random speed within this specified area, bouncing off the edges when
    they are encountered.'
