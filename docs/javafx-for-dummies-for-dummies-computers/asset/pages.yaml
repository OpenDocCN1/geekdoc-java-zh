  md: '# Introduction


    In the beginning there was AWT, the Abstract Window Toolkit. AWT Java''s first
    system for displaying window-based user interfaces in Java. AWT beat Swing, which
    soon became the preferred way to create user-friendly applications in Java.


    But then JavaFX, the worthy successor to the GUI throne. JavaFX is designed to
    create stunning user interfaces that can run on a wide variety of devices, including
    traditional desktop and portable computers, tablets, smartphones, and many other
    types of devices.


    Until recently, JavaFX was the red-headed stepchild of the Java world. It co-existed
    with Java, but wasn''t an official part of Java. But beginning with Java version
    8, JavaFX is now fully integrated into Java. And while JavaFX and Swing coexist
    today, Oracle has made clear that Swing is in its twilight and JavaFX represents
    the future of user-interface programming.


    So you''re holding the right book in your hands. JavaFX is an essential skill
    for every Java programmer to have at his or her disposal, and this book will help
    you master your skill.


    # About This Book


    This isn''t the kind of book you pick up and read from start to finish, as if
    it is a cheap novel. If I ever see you reading it at the beach, I''ll kick sand
    in your face. Beaches are for reading romance novels or mysteries, not programming
    books.


    Assuming, then, that you have found a more suitable location to read this book,
    you can, read it straight starting with Chapter 1 and finishing with Chapter 20.
    However, this sequence isn''t necessary. If you are new to JavaFX programming,
    I suggest you read at least Part I in sequence so that you''ll gain a basic understanding
    of how JavaFX works.


    After you have the basics down, you can read the chapters in whatever sequence
    makes sense for you. If you need to know about adding effects to a shape, skip
    straight to Chapter 14. For information about animation, skip ahead to Chapter
    17.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# JavaFX For Dummies


    You don''t have to memorize anything in this book. It''s a need-to-know book:
    You pick it up when you need to know something. Need a reminder on how to rotate
    a shape? Pick up the book. Can''t remember the details of the TilePane class?
    Pick up the book. After you find what you need, put down the book and get on with
    your life.


    This book works like a reference. Start with the topic you want to find out. Look
    for it in the Table of Contents or in the index. The Table of Contents is detailed
    enough that you can find most of the topics you''re looking-for. If not, turn
    to the index, where you can find even more detail.


    Of course, the book is loaded with information — so if you want to take a brief
    excursion into your topic, you''re more than welcome. If you want to know the
    big picture on the scene graph, read Chapter 7. But if you just want a reminder
    on how to set the maximum scene size, just read the section on the Scene class.


    Whenever I describe sample Java code, I present it as follows:


    And Java class names, keywords, or other language elements are always shown in
    monospace type.


    # Foolish Assumptions


    In this book, I make very few assumptions about what you may already or may not
    know about JavaFX. But I do have to make two basic assumptions:


    +   You own or access to a computer on which Java JDK 8 has been installed or
    which you have permission to install.


    +   JavaFX 8 is an integral part of JDK 8, so JDK 8 is a requirement for figuring
    out JavaFX. If you have not yet installed it, you''ll find instructions on how
    to do so in Chapter 1.


    +   You know the basics of Java, may I suggest one of two books: my own Java All-In-One
    For Dummies, 4th Edition, or Barry Burd''s Java For Dummies, 6th Edition. Both
    are published by Wiley.


    There are no other prerequisites to this book.


