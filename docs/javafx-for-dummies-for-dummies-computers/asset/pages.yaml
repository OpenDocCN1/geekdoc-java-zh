  md: '# 78 Part I: Getting Started with JavaFX


    +   - Ask for confirmation from the user before performing a task

    - Show complex dialog boxes that ask the user to enter data or options


    Many GUI programming packages or languages contain provisions for such dialog
    boxes. For example, Swing includes a built-in class called JOptionPane that makes
    it easy to create a simple alert box. With the JOptionPane class, you can create
    a simple alert box, as the one shown in Figure 4-2, with a single call to the
    static showDialog method, with this:


    ```

    JOptionPane.showMessageDialog(null, "Thanks for stopping by", "Say Thanks", JOptionPane.INFORMATION_MESSAGE);

    ```


    ![](img/71d6d293a802aaccab3a1d9dafaea059_87_0.png)


    Unfortunately (and a little inexplicably), JavaFX provides no such facility. To
    display a simple message box in JavaFX, you must write code to create a new scene,
    create a label or other type of text to display the message, create an OK button,
    create a layout pane, add the controls to the layout pane, add the pane to the
    stage, set the stage''s modality to WINDOW_MODAL, and then display the stage.
    You end needing well over a dozen lines of code to do this.


    That''s a lot of effort to create a simple class that you can use to display common
    message, alert, or confirmation boxes. You can use the class throughout your project,
    or you can place the class in a package so you can import it into any JavaFX project.


    Listing 4-2 shows a simple class named MessageBox that has one method, show, which
    you can call to display a dialog box that displays a message. To display a message
    box, simply call the show method, with this:


    ```

    MessageBox.show("Hello!", "Greetings!");

    ```


    The show method accepts two parameters — the message to be displayed and the title
    in the dialog box.'
