  md: '# Chapter 12

    # Skinning Your Application with CSS


    # In This Chapter


    +   - Applying styles in several ways

    - Creating your own style sheet

    - Controlling fonts through font styles

    - Creating fills and borders with CSS


    One of the most powerful features of JavaFX is its ability to use CSS (which stands
    for Cascading Style Sheets) to control the visual appearance of your user interface.
    With CSS, you can change the look and feel of your application without actually
    changing any of the Java code that powers your application. CSS essentially disconnects
    the visual aspects of your program from the application logic.


    The terms theme and skin are used somewhat interchangeably to refer to the look
    and feel of an application. A theme or skin governs many aspects of visual appearance,
    including the font used for text, background fills, border styles and colors,
    how items react when the mouse is hovered over them, and many more.


    In this chapter, I first discuss how to switch an entire application between two
    of the default themes provided with JavaFX. Then, you discover how to craft your
    own style sheets and apply them to your scenes.'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# Part III: Enhancing Your Scenic Design


    # Using Default Style Sheets


    JavaFX comes with two built-in themes: Modena and Caspian. Modena is a new theme
    that was introduced with JavaFX 8; Caspian is an older theme that was used with
    previous versions of JavaFX.


    Figure 12-1 shows a version of the Pizza Order application that I present in Chapter
    11; it includes a pair of radio buttons to allow the user to switch between the
    Modena and Caspian themes. The window on the left side of the figure shows the
    Modena theme; the Caspian theme is shown on the right.


    ![](img/71d6d293a802aaccab3a1d9dafaea059_265_0.png)


    Figure 12-1: A Java application shown in the Modena and Caspian themes.


    ![](img/71d6d293a802aaccab3a1d9dafaea059_265_1.png)


    To switch the theme of an application, use the setUserAgentStylesheet method of
    the Application class. The Application class defines two static fields that you
    can use to reference the built-in styles: STYLESHEET_MODENA and STYLESHEET_CASPIAN.
    Thus, to set Caspian as the style sheet, use this statement:


    ```

    Application.setUserAgentStylesheet(STYLESHEET_CASPIAN);

    ```'
