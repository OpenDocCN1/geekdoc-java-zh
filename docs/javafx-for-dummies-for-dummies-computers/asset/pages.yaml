  md: "# 200 Part II: JavaFX Controls\n\nThis method accesses both the collection\
    \ of the table and the selectedItems collection of the table's selection model.\
    \ Then, a for-each loop is used to delete every item in the selectedItems collection\
    \ from the items collection.\n\nThis method does not verify that the user really\
    \ wants to remove the rows. In a more realistic program, you'd want to first display\
    \ an alert box asking the user whether she really wants to delete the rows. Then,\
    \ you'd delete the rows only if the user clicks Yes.\n\n![](img/71d6d293a802aaccab3a1d9dafaea059_209_0.png)\n\
    \n# Editing table cells\n\nTo allow users to edit individual table cells, you\
    \ need to do three things:\n\n+   - Mark the table as editable by calling the\
    \ setEditable method, passing a value of true.\n- Create a cell factory for each\
    \ column that you want to allow the user to edit.\n- Do that by calling the setCellFactory\
    \ method of the TableColumn class.\n- Add an event listener that's called whenever\
    \ the user finishes editing a table cell.\n- This listener is responsible for\
    \ updating the items collection with the data entered by the user.\n\nTo allow\
    \ the user to edit the contents of a column, you must set a cell factory for the\
    \ column. A cell factory is an object that renders the content of a cell. By default,\
    \ the cell factory renders the content as a text object. To enable editing, use\
    \ a cell factory that renders the content as a text field.\n\nThe easiest way\
    \ to create a text field in a table column is to use the TextFieldTableCell. This\
    \ class includes a static method forTableColumn that returns a cell factory suitable\
    \ for editing data with a text box. Here is how you use it:\n\n```\ncolTitle.setCellFactory(\n\
    \  TextFieldTableCell.forTableColumn());\n```"
