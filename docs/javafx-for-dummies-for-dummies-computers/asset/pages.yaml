  md: "# 82 Part I: Getting Started with JavaFX\n\n# # Creating a Confirmation Box\n\
    \nA confirmation box is a dialog box that asks the user for confirmation before\
    \ proceeding with some action. For example, if the user of a word processing program\
    \ closes the program without saving changes to the current document, the program\
    \ typically asks the user whether he really wants to quit without saving changes.\
    \ A confirmation box displays a text message, which is often simple as “Are you\
    \ sure?” along with two buttons, typically labeled Yes and No or OK and Cancel.\n\
    \nCreating a confirmation box is a little more complicated than creating a message\
    \ box because the confirmation box must let the main program know which the user\
    \ clicked. The most common way to do that is to call a method that displays the\
    \ confirmation box and returns a result value that indicates the user's selection.\n\
    \nIn this section, I look at a simple class called ConfirmationBox that has a\
    \ static method named show. This method displays a message and two buttons and\
    \ returns a Boolean true if the user clicks the first button and false if the\
    \ user clicks the second button.\n\nThe show method accepts four parameters:\n\
    \n+   - The message to be displayed\n- The title for the confirmation box\n- The\
    \ text to be displayed on the first button\n- The text to be displayed on the\
    \ second button\n\nHere's an example of how you might use this class to display\
    \ a confirmation box:\n\n```\nboolean confirm = ConfirmationBox.show (\n    \"\
    Are you sure?\", \"Confirmation\",\n    \"Yes\", \"No\");\n```\n\nFigure 4-3 shows\
    \ the confirmation box displayed by the preceding statement. If the user clicks\
    \ the Yes button, the show method returns true; otherwise, the show method returns\
    \ false.\n\nListing 4-4 shows the source for the ConfirmationBox class."
