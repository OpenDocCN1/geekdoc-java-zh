    # Using the Image class


    To load an image from an external source, such as a disk file or a web location,
    you use the Image class. This class has six constructors, detailed in Table 16-1.


    | Constructor | Description |

    | --- | --- |

    | Image (InputStream in) | Creates an image by reading from the specified input
    stream. |

    | Image (InputStream in, double width, double height, boolean preserveRatio, boolean
    smooth) | Creates an image by reading from the specified input stream and resizes
    according to the width and height you specify, preserveRatio indicates whether
    the aspect ratio of the original image should be preserved, and smooth indicates
    whether image smoothing should be applied. |

    | Image (String url) | Creates an image by reading from the specified URL. |

    | Image (String url, boolean backgroundLoading) | Creates an image by reading
    from the specified URL. If backgroundLoading is true, the image is loaded in the
    background (that is, on a separate thread). |

    | Image (String url, double width, double height, boolean preserveRatio, boolean
    smooth) | Creates an image by reading from the specified URL This constructor
    specifies the width and height of the resulting image and indicates whether the
    aspect ratio of the original image should be preserved and whether image smoothing
    should be applied. |

    | Image (String url, double width, double height, boolean preserveRatio, boolean
    smooth, boolean backgroundLoading) | Creates an image by reading from the specified
    web path and resizes according to the width and height you specify, preserveRatio
    indicates whether the aspect ratio of the original image should be preserved,
    and smooth indicates whether image smoothing should be applied. If backgroundLoading
    is true, the image is loaded in the background (that is, on a separate thread).
    |'
