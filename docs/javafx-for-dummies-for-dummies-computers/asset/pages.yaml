  md: '# Part I: Getting Started with JavaFX


    stage of your JavaFX journey. Please don''t become discouraged. In Chapter 2,
    I dissect simple JavaFX program line-by-line so you can see what makes it tick.
    In this chapter, I focus on the high-level details of what JavaFX is, what you
    can do with it, and how to get your computer set up for JavaFX.


    > REMEMBERnAll the code listings used in this book are available for download
    at www.dummies.com/extras/javafx.


    # What Is JavaFX?


    Simply put, JavaFX is a collection of Java packages that lets you add fancy graphical
    interfaces to your Java applications. With JavaFX, you can create traditional
    windows-style user interfaces that include familiar controls such as labels, buttons,
    text boxes, drop-lists, and so on. You can also adorn these user interfaces with
    fancy effects such as light sources, perspective, and animation. Hence FX in JavaFX.


    Prior to JavaFX, the main way to create graphical user interfaces in Java was
    through the Swing API. JavaFX is similar to Swing in many ways to create a user
    interface for a Java program, you have a good head start at learning JavaFX.


    JavaFX has been around an add-on package for a while, but beginning with Java
    version 8, JavaFX is now an official standard part of the Java platform. Thus,
    after you install the Java 8 Development Kit (JDK 8), you can begin developing
    your Java applications with your favorite development tools. Later in this chapter,
    you discover how to download and install JDK 8, and you figure out how to create
    a simple JavaFX program using popular Java development tools: TextPad, Eclipse,
    and NetBeans.


    Because JavaFX is now a standard part of Java, you can run JavaFX programs-on
    any device that includes version 8 of the Java Runtime Environment (JRE). That
    includes computers, tablet devices, smartphones, and any other device that can
    support JDK8.


    Oracle has announced that JavaFX will eventually replace Swing. Although Swing
    is still supported in Java 8 and will be supported for the foreseeable future,
    Oracle is concentrating new features on JavaFX. Eventually, Swing will become
    obsolete.'
  merge: -1
