    \ that indicates whether the tree item is expanded. |\n| boolean isLeaf() | Returns\
    \ a boolean that indicates whether the tree item is a leaf node (that is, has\
    \ no children). A leaf node can't be expanded. |\n| TreeItem nextSibling() | Returns\
    \ the next sibling of this tree item. If there is no next sibling, returns null.\
    \ |\n| TreeItem prevSibling() | Returns the previous sibling of this tree item.\
    \ If there is no previous sibling, returns null. |\n\nThe TreeItem class provides\
    \ three basic characteristics for each node:\n\n+   - The value, which contains\
    \ the data represented by the node.\n In my example, I use strings for the user\
    \ objects, but you can use objects of any type you want for the user object. The\
    \ tree control calls the user object's toString method to determine what text\
    \ to display for each node. The easiest way to set the user object is to pass\
    \ it via the TreeItem constructor.\n- The parent of this node, unless the node\
    \ happens to be the root.\n- The children of this node, represented as an ObservableList."
