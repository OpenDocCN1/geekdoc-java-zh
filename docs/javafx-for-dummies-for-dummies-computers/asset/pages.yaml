  md: '# Animating the Hard Way


    Now that you''ve seen the easy way to create animations (using transition classes),
    it''s time to have a look at the more difficult way. Of course, as you might envision,
    the more difficult way is also the more flexible way.


    For example, the bouncing balls shown in Listings 17-1 and 17-2 are interesting
    but not very practical, as they bounce back and forth in a strictly horizontal
    direction. If you wanted to use these balls to create a game, you''d want them
    to bounce around at angles, bouncing off all four edges of the scene. And you''d
    want them to bounce off each other as well. To achieve that, you need to work
    with two advanced animation classes: KeyFrame and TimeLine:


    +   **KeyFrame:** A KeyFrame is a timing interval that raises an Action when the
    time interval has expired.


    When you create a KeyFrame, you specify the duration of the time interval and
    provide an Action listener. Then, in the action listener, you provide the code
    that implements your animation. In the case of this bouncing ball program, the
    action event will examine each ball that''s in motion and calculate the next position
    for each ball, taking into account the effect of balls bouncing off the edges
    of the scene or bouncing off each other.


    ![](img/71d6d293a802aaccab3a1d9dafaea059_363_0.png)'
