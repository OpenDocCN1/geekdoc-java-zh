    # Playing Video Files


    Playing video files is similar to playing audio files, with one crucial difference:
    To play a video file, you must add a MediaView control to the scene graph. Unlike
    MediaPlayer, MediaView is a subclass of Node, so you can manipulate it in the
    same manner as you can manipulate any other node. In other words, you can control
    its size and position, and you can even translate it or rotate it by special effects.


    The MediaView class accepts a MediaPlayer in its constructor. To play a video
    file, you first create a Media object that loads the video file. Then, you create
    a MediaPlayer object that plays the video. And finally, you use a MediaView object
    to visualize the video file.


