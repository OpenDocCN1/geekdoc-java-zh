  md: '# Chapter 10: Making Menus


    Then you create one or more menus and add it or them to the menu bar.

    When the menu bar is finished, you add it to a layout pane just as you would add
    any other node:


    ```

    pane.getChildren().add(menubar);

    ```


    For your reference, Table 10-1 lists the most useful constructors and methods
    of the MenuBar class.


    | Table 10-1 | The MenuBar Class |

    | --- | --- |

    | Constructor | Description |

    | MenuBar() Method | Creates a menu bar.

    | Observable get() | Returns the list of menus contained in this menu bar. You
    can use any of the methods of the ObservableList interface to add or remove menus
    from the menu bar. |


    # Creating Menus


    To create each menu, you use the Menu and MenuItem classes, whose constructors
    and methods I discuss in the next two tables in this chapter. Start by calling
    the Menu constructor and giving a name to the menu:


    ```

    MenuGame = new Menu("Game");

    ```


    Here, the underline in the text string makes the mnemonic shortcut key that the
    user can use to get at the menu without touching the mouse. In this case, the
    letter G is the mnemonic.


    The mnemonic character allows the user to open the menu by pressing the mnemonic
    character while holding down the Alt key. When the user presses the Alt key, all
    the visible mnemonic characters will be underlined so the user can determine which
    characters are the mnemonics.


    Table 10-2 lists the most important constructors and methods of the Menu class
    for your reference.'
