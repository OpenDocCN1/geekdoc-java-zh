  md: "# Chapter 9: Working with Tables\n\nname of the property must follow the word\
    \ get or set; thus, the name of the property accessed by the getTitle and setTitle\
    \ methods is title. (Notice that the name of the property begins with a lowercase\
    \ letter, but is capitalized in the get or set method.)\n\nJavaFX properties are\
    \ actually much more than a naming convention for creating methods to get and\
    \ set values. Properties have other advanced features as well, such as the ability\
    \ to automatically bind them together when the value of a property in one object\
    \ changes, the corresponding property value in another object changes as well.\
    \ And you can create listeners for properties so that code is executed automatically\
    \ when- the value of a property changes.\n\nTo create a property, you must use\
    \ one of several predefined classes that implements the Property interface (or\
    \ create your own class that implements Property). Because working with the Property\
    \ interface is a complicated topic of it, I devote an entire chapter to it. Thus,\
    \ you discover how to create proper properties in Chapter 15. For my purposes,\
    \ I use fake properties (I like to call them sham properties), which are simply\
    \ class fields that can be accessed with get and set methods that follow the same\
    \ naming conventions actual properties use. As long as the Movie class conforms\
    \ to these naming standards, it will work as an items list for a table control.\n\
    \nListing 9-1 shows the source code for the Movie class.\n\n# Listing 9-1: The\
    \ Movie Class\n\n```\npublic class Movie {\n    private String title; //->3\n\
    \    private int year;\n    private double price;\n\n    public Movie() //->7\n\
    \        this.title = \"\";\n        this.year = 0;\n        this.price = 0.0;\n\
    \    }\n\n    public Movie(String title, int year, double price) //->14\n    \
    \    this.title = title;\n        this.year = year;\n        this.price = price;\n\
    \    }\n```\n\n(continued)"
