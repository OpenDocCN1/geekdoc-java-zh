  md: '# Chapter 8: Choosing from a List


    The list will be empty if the node happens to be a leaf node. You can create or
    retrieve child nodes using the familiar methods of the ObservableList. For more
    information, refer to the section "Working with Observable Lists" earlier in this
    chapter.


    In this section, I will build a tree that lists spinoff shows from three popular
    television shows of the past:


    +   - The Andy Griffith Show, which had two spinoffs: Gomer Pyle, U.S.M.C., and
    Mayberry.R.F.D.


    +   - All in the Family, which famously spawned four spinoffs: The Jeffersons,
    Maude, Gloria, and Archie Bunker''s Place.


    +   - In addition, two of these spinoffs of their own involving the maids: The
    Jeffersons'' maid became the topic of a short-lived show called Checking In, and
    Maude'' maid became the main character in Good Times.


    +   - Happy Days, which spun off Mock and Mindy, Laverne and Shirley, and Joanie
    Loves Chachie.


    You can take many approaches to building trees, most of which involve some recursive
    programming. I''m going to avoid recursive programming in this section to keep
    things simple, but my avoidance means that you have to hard-code the details of
    the tree into the program. Most real programs that work with trees need some type
    of recursive programming to build the tree.


    The first step in creating a tree is declaring a TreeItem variable for each node
    that isn''t a leaf node. For my TV series example, I start with the following-code:


    ```

    TreeItem andy, archie, happy, george, maude;

    ```


    These variables can be local variables within the start method because once you
    get the tree set up, you won''t need these variables anymore. See why you don''t
    need variables for the leaf nodes in a moment.


    Next, I create the root node and set its expanded status to true so that it will
    be expanded when the tree displays initially:


    ```

    TreeItem root = new TreeItem("Spin Offs");

    root.setExpanded(true);"

    ```'
