  md: '# Chapter 18


    # Targeting Touch Devices


    **In This Chapter**


    +   - Discovering gestures on touch devices

    - Adding listeners that respond to gesture events

    - Creating a program that lets the user manipulate a shape with gestures


    Touch devices are everywhere nowadays. Tablets and smartphones are the most common
    types of touch devices, but even some desktop users have installed touch-capable
    monitors. At one time, touch devices ran primarily non-Microsoft operating systems,
    such as Apple''s iOS or Google''s Android. But now, with Windows 8, many touch
    devices even run.


    Fortunately, JavaFX can run on all those platforms. In this chapter, you discover
    how to develop JavaFX applications that take advantage of the unique user interactions
    are possible with touch devices, including basic touch and swiping and scrolling
    as well as multi-touch gestures such as zooming and rotating.


    # Introducing Gestures and Touch Events


    Before I get into the details of working with gestures and touch events, I want
    to point out that the support for basic touch devices for JavaFX controls is already
    built-in and requires no programming to enable. For example, Button respond to
    taps on a touch device just as they respond to mouse clicks. No special programming
    is needed to enable the basic operation of JavaFX controls on a touch device.


    The good news is that the programming to handle more advanced touch gestures,
    such as zooming or rotating, is pretty straightforward. JavaFX handles the difficult
    tasks of figuring out what gestures the user is making when he touches the screen.
    For example, when JavaFX sees that the user has touched the screen with two fingers
    and then rotated the fingers in'
  merge: -1
  pgno: 374
- img_proc: true
  md: '# 366 Part IV: Making Your Programs Come Alive


    opposite directions, the user is attempting to rotate an object on the screen.
    JavaFX figures out object is the target of the rotation, figures out how much
    the user has rotated the object, and then sends a ROTATE event to the target.
    All you have to do is provide an event listener for the ROTATE event.


    Actually, when the user does a rotate gesture, JavaFX will likely send dozens
    of separate ROTATE events to the target of the rotation. Each of these events
    represents an incremental step along the way to the complete rotation. Your program
    will respond to these events by rotating the target object by the amount indicated
    by the ROTATE event; the result will be that the object smoothly follows the user''s
    fingers as the user continues the rotation.


    JavaFX provides event handling for four distinct types of touch gestures:


    +   Rotate: A rotate gesture is recognized when the user places two fingers on
    the screen and rotates them in opposite directions. Three distinct events are
    generated when a rotate gesture is recognized:


    +   * ROTATE_STARTED: This event occurs once, as soon as the rotation gesture
    is recognized.


    +   * ROTATE_FINISHED: This event can occur multiple times throughout the rotation
    gesture. It is usually the event you''ll want to handle.


    +   * ROTATE_FINISHED: This event occurs once, after the end of the rotation gesture
    is recognized.


    All rotation events are represented by a RotateEvent object, which defines two
    key methods:


    +   * getAngle: Returns the angle of rotation for this particular event.


    +   * getTotalAngle: Returns the cumulative angle for the entire rotation gesture.


    +   Zoom: A zoom gesture is recognized when the user places two fingers on the
    screen and then spreads them apart or brings them together. As with rotate gestures,
    zoom gestures create three types of events:


    +   * ZOOM_STARTED: This event occurs when the zoom gesture begins.


    +   * ZOOM_FINISHED: This event occurs multiple times throughout the zoom gesture.


    +   * ZOOM_FINISHED: This event occurs when the zoom gesture ends.


    Zoom events are defined by the ZoomEvent class, which has two important methods:


    +   * getZoomFactor: Returns the amount of the zoom for this particular event.


    +   * getTotalZoomFactor: Returns the accumulated zoom factor for the entire zoom
    gesture.


    ![](img/71d6d293a802aaccab3a1d9dafaea059_375_0.png)'
  merge: -1
  pgno: 375
- img_proc: true
  md: '# Chapter 18: Targeting Touch Devices 367


    The zoom factor is a multiplier you can use to determine the new size of the zoomed
    object. For example, if the user doubles the size of the target object, the zoom
    factor will be 2.0.


    Scroll: A scroll gesture is recognized when the user places one finger on the
    screen and drags it to another location. Once again, three types of events are
    generated for scroll gestures:


    +   - SCROLL_STARTED: Occurs at the start of the scroll gesture.

    - SCROLL: Occurs multiple times throughout the scroll gesture.

    - SCROLL_FINISHED: Occurs when the scroll gesture ends.


    Scroll events are represented by the ScrollEvent class, which provides several
    methods to retrieve the scroll amount:


    +   - getDeltaX: Returns the horizontal change for this scroll event.

    - getDeltaY: Returns the vertical change for this scroll event.

    - getTotalDeltaX: Returns the total horizontal change for this scroll gesture.

    - getTotalDeltaY: Returns the total vertical change for this scroll gesture.


    Swipe: A swipe gesture is recognized when the user places one finger on the screen
    and quickly swipes it either horizontally or vertically. Unlike the other gestures,
    swipe gestures do not generate events to indicate the start and end of the gesture.
    Instead, one of the following events is generated to indicate the direction of
    the swipe:


    +   - SWIPE_LEFT

    - SWIPE_RIGHT

    - SWIPE_UP

    - SWIPE_DOWN


    Swipe events are represented by the SwipeEvent class.


    Swipe events and scroll events are difficult to distinguish because a swipe is
    simply a fast scroll in either a horizontal or vertical direction. Thus, when
    the user performs a swipe gesture, scroll events are generated in addition to
    the swipe event.


    ![](img/71d6d293a802aaccab3a1d9dafaea059_376_0.png)'
