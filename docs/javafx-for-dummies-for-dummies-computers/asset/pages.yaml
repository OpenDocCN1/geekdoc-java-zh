    # Creating rectangles


    A rectangle requires an (x, y) starting point, a width, and a height. Here''s
    the code that creates the first rectangle shown in Figure 13-1 earlier in this
    chapter:


    ```

    Rectangle r1 = new Rectangle(50,25,100,140);

    r1.setStroke(Color.BLACK);

    r1.setFill(null);

    r1.setStrokeWidth(3);

    ```


    Here the rectangle starts at (50, 25). Its width is 100, and its height is 140.
    Notice that the fill color is set to null so that the rectangle will be transparent.


    You can create a rectangle with rounded corners by calling the setArcWidth and
    setArcheight methods. Here''s the rounded rectangle in the middle of the first
    row of shapes in Figure 13-1:


    ```

    Rectangle r2 = new Rectangle(250,25,100,140);

    r2.setStroke(Color.BLACK);

    r2.setFill(null);

    r2.setStrokeWidth(3);

    r2.setArcWidth(25);

    r2.setArcHeight(25);

    ```


    Here, the corners are rounded with an arc whose height and width are 25.


    You can create some interesting shapes using unequal values for the arc''s width
    and height. For the third shape in the first row of Figure 13-1, arc width is
    set to 75 and the height to 125:


    ```

    Rectangle r3 = new Rectangle(450,25,100,140);

    r3.setStroke(Color.BLACK);

    r3.setFill(null);

    r3.setStrokeWidth(3);

    r3.setArcWidth(75);

    r3.setArcHeight(125);

    ```'
