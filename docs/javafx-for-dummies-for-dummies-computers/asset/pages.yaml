  md: '# 102 Part I: Getting Started with JavaFX


    For my purposes here, I just use the simple default constructor of the Region
    class to create a node that serves as a simple spacer in a layout pane. I don''t
    provide a specific size for the region. Instead, I configure it so that it will
    grow horizontally to fill any unused space within its container.


    To do that, you use the static setGrow method of the HBox class, specifying one
    of the three constant values defined by an enumeration named Priority enumeration.
    Table 5-3 lists these constants and explains what each one does.


    | Constant | Description |

    | --- | --- |

    | Priority.NEVER | Indicates that the width of the node should never be adjusted
    to fill the available space in the pane. This is the default setting. Thus, by
    default, nodes are not resized based on the size of the layout pane that contains
    them. |

    | Priority.ALWAYS | Indicates that the width of the node should always be adjusted
    if necessary to fill available space in the pane. If you set two or more nodes
    to ALWAYS, the adjustment will be split equally among each of the nodes. |

    | Priority.SOMETES | Indicates that the node''s width may be adjusted if necessary
    to fill out the pane. However, the adjustment will be made only if there are no
    other nodes that specify ALWAYS.|


    The Priority enumeration is defined in the javafx.scene.layout package; the same
    package that defines the layout managers that require it. So you don''t need to
    include an additional import statement to use the Priority enumeration.


    The following example creates three buttons and a spacer, sets the margins for
    all three buttons to 10 pixels, and then adds the three buttons and the spacer
    to an HBox such that the first two buttons appear on the left of the HBox and
    the third button appears on the right:


    ```

    // Create the buttons

    Button btn1 = new Button("One");

    Button btn2 = new Button("Two");

    Button btn3 = new Button("Three");

    ```


    ```

    // Create the spacer

    Region spacer = new Region();

    ```'
