  md: '# Chapter 7: Introducing the JavaFX Hierarchy


    As its name implies, the Region class defines a visible area of the scene that
    has a physical size — that is, a height and a width. The size of a region depends
    on a number of factors, but by default will be determined by the size of the content
    it contains. You can set minimum, maximum, and preferred constraints that the
    region will honor, and you can specify a fixed amount of padding that provides
    a margin between the region''s content and its outer edges. In addition, the visual
    style of a region can be set by a Cascading Style Sheet.


    Table 7-3 shows the most commonly used methods provided by the Region class, which
    are all related to setting the size of the region.


    | Table 7-3 | Common Methods of the Region Class |

    | Method | Explanation |

    | void setMaxHeight(double height) | Sets the maximum height for the region. |

    | void setMinHeight(double height) | Sets the minimum height for the region. |

    | void setPrefHeight(double height) | Sets the preferred height for the region.
    |

    | void setMaxWidth(double width) | Sets the maximum width for the region. |

    | void setMinWidth(double width) | Sets the minimum width for the region. |

    | void setPrefWidth(double width) | Sets the preferred width for the region. |

    | double getHeight() | Gets the actual height of the region. |

    | double getWidth() | Gets the actual width of the region. |

    | void setPadding(Insets value) | Sets the padding around the inside edges of
    the Hbox. |


    The Region class provides three distinct parameters that let you control the height
    and width of the region. For both the height and the width, you can set a minimum
    value, a preferred value, and a maximum value. As their names imply, JavaFX will
    not make the control smaller than the minimum or larger than the maximum size,
    and, if possible, will shoot for the preferred size.'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# 152 Part II: JavaFX Controls


    Within these parameters, JavaFX will determine the ideal height and width for
    the region based on the content it contains. For a control, such as a label or
    a button, the content is the text that''s displayed by the label or the button.

    For more complex controls, the content consists is more complex. And for layout
    panes, the content consists of the aggregate of all the nodes that are added to
    the pane.


    If you don''t specify any height or width constraints, all three — minimum, preferred,
    and maximum — default to the actual computed size of the control''s.


    Note: In many cases, the contents of a region will resize automatically to fill
    whatever space is available to it. Thus, if the user dynamically resizes the window
    that contains the scene, the size of all the regions contained within the scene
    may expand or contract to fill the available space.


    If you want an exact value for a region''s width or height, set all three parameters
    (minimum, preferred, and maximum) to the same value.


    ![](img/71d6d293a802aaccab3a1d9dafaea059_161_0.png)


    ```

    lbl.setMinWidth(150)

    lbl.setPrefWidth(150)

    lbl.setMaxWidth(150)

    ```


    You might, in this case, prefer to create a constant:


    ```

    final static int LABEL WIDTH = 150;

    lbl.setMinWidth(LABEL WIDTH);

    lbl.setPrefWidth(LABEL WIDTH);

    lbl.setMaxWidth(LABEL WIDTH);

    ```


    That way, you change your mind about the width of the label, you have to change
    the value in only one place.


    One other setting affects the height or width of a region: the amount of padding
    you specify. Padding provides margins around the edges of the region to prevent
    crowded-looking scenes. Note: You''re more likely to use padding with layout panes
    than with controls.


    To specify padding, use the Insets class, which is defined in the javafx.geometry
    package. Insets provides two constructors. The first lets you set even margins
    around all four sides of a region:


    ```

    pane.setPadding(new Insets(10));

    ```


    Or, you can set different values for the top, right, bottom, and left edges:


    ```

    pane.setPadding(new Insets(10, 0, 10, 0));

    ```'
