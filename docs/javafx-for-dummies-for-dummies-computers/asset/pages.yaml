    The following sections provide additional details about selectors and declarations.


    # Using type selectors


    The most commonly used variety of selectors is a type selector; it corresponds
    to a JavaFX node type, such as Button or TextField. Type selectors begin with
    a period followed by the style class name, which is associated with all JavaFX
    node types.(Note: The terms style class and style type are used interchangeably.)


    For controls, the name of the style class is similar to the name of the corresponding
    JavaFX class. To convert a JavaFX class name to a CSS class name, use all lowercase
    letters and a hyphen between words if the JavaFX class name consists of two or
    more words. The following list includes the CSS style class name for most of the
    JavaFX classes that have been presented so far in this book.


    | JavaFX Class | CSS Style Class |

    |---|---|

    | Button | button |

    | CheckBox | check-box |

    | ChoiceBox | choice-box |

    | ComboBox | combo-box |

    | Label | label |

