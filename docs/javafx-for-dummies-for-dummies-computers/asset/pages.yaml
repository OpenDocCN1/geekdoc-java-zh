    # Creating Custom Menu Items


    A custom menu item is a menu item that can contain any JavaFX node. This allows
    you to easily convert any JavaFX node into a menu item. For example, you can turn
    a text field, choice box, or combo box into a menu item by adding it to a custom
    menu item and then adding the custom menu item to a menu. Figure 10-4 shows an
    example of a custom menu item that contains a text field.


    ![](img/71d6d293a802aaccab3a1d9dafaea059_230_1.png)


    Figure 10-4: A custom menu item that contains a text field.'
