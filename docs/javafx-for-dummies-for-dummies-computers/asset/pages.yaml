  md: "# 318 Part IV: Making Your Programs Come Alive\n\n# # Creating Properties More\
    \ Efficiently\n\nThe advanced capabilities of JavaFX properties, which you'll\
    \ come to appreciate in the final sections of this chapter, do not come without\
    \ a cost. Specifically, instantiating a property object takes more memory and\
    \ processing time than creating a simple field-based property. And in many classes,\
    \ the advanced capabilities of a JavaFX property object are only occasionally\
    \ needed. This, instantiating property objects for every property in a class whether\
    \ the object is needed or not, is wasteful.\n\nIn this section, I show you a technique\
    \ for creating properties in the property objects themselves are not instantiated\
    \ until the property accessor itself is. That way, the property object is not\
    \ created unless it is actually needed. Here are the details of this technique:\n\
    \n+   1. Declare a private field to hold the data represented by the property.\n\
    \nFor example, for a string property, you create a String variable. For the variable\
    \ name, use the name of the property prefixed by an underscore, like this:\n\n\
    ```\nprivate final String _firstName = \"\";\n```\n\n+   2. Create, but do not\
    \ instantiate, a private variable to represent the property object.\n\nIn other\
    \ words, declare the variable but not call the class constructor:\nprivate final\
    \ SimpleStringProperty firstName;\n\n+   3. Create the getter.\n\nIn the getter,\
    \ use an if statement to determine whether the property exists. If it does, return\
    \ the value from the property. If it doesn't, return the value of the private\
    \ field. For example:\n\n```\npublic final String getFirstName() {\n    if (firstName\
    \ == null)\n        return _firstName;\n    } else\n        return firstName.get();\n\
    \    }\n```\n\n+   4. Create the setter.\n\nUse the same technique in the setter:"
