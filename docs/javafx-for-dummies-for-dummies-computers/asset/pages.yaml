    → 125: Now it gets interesting. These lines check for collisions with other balls
    in the balls array. A for loop iterates over all the balls in the array list.
    The if statement first eliminates the current ball by checking if b != this. After
    all, a ball cannot really collide with itself.


    Next, if the statement checks whether the current ball has collided with any other
    ball. It does this by calling the intersects method, which is defined by the Shape
    class. This method accepts a Bounds object that represents the bounding rectangle
    which a shape fits. You can get the bounding rectangle by calling the shape''s
    getLayoutBounds method. Thus, this test works by checking whether a ball in the
    balls collection intersects with the bounding rectangle of the current ball. Note:
    This collision test isn''t perfect; it sometimes treats misses as collisions.
    But it''s close enough.


    → 131: If a collision is detected, the x and y speed values of the two balls are
    swapped. Not only do the balls bounce away from each other, but also the slower
    ball picks up speed and the faster ball slows down.


    → 137: A break statement is executed if a collision is detected to prevent detecting
    collisions with more than one ball. Without this break statement, collisions that
    involve more than two balls usually result in pretty strange behavior. Try removing
    the break statement to see what happens. (Even with this break statement, the
    balls sometimes behave in unexpected ways. I think it''s kind of fun to watch,
    but then again, I''m pretty entertained.)'
