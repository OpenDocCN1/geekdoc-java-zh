  md: '# Chapter 5: Using Layout Panes to Arrange Your Scenes


    # # Creating layout panes


    The basic process of working with layout panes is simple. Here is the general
    procedure for creating a layout node:


    +   1. Create the controls or other nodes you want to add to the pane.


    For example, if the layout pane will contain two buttons, you should create the
    two buttons using code similar to this:


    ```

    Button btnOK = new Button();

    btnOK.setText("OK");

    btnOK.setOnAction(e -> btnOK.Click());

    Button btnCancel = new Button();

    btnCancel.setText("Cancel");

    btnCancel.setOnAction(e -> btnCancel_Click());

    ```


    +   2. Create a layout pane by calling its constructor.


    For example:


    ```

    HBox pane = new HBox();

    ```


    +   3. Fine-tune any of the settings required by the layout pane.


    Each type of layout pane has a unique assortment of parameters that govern the
    details of how nodes are laid out within the pane. For example, the HBox pane
    lets you set the number of pixels that will be used to separate each node in the
    pane. You can set this value as follows:


    ```

    HBox.setSpacing(10);

    ```


    +   4. Add each of the nodes that will appear in the layout pane.


    Each type of layout pane provides a method for adding nodes to the pane. For the
    HBox pane, you must first call the getChildren method to get a list of all the
    nodes that have been added to the pane. Then, you call the addAll method to add
    one or more nodes to the pane. For example:


    ```

    pane.getChildren().addAll(btnOK, btnCancel);

    ```


    +   5. Create the scene, specifying the layout pane as the scene''s root node.


    For example:


    ```

    Scene scene = new Scene(pane, 300, 400);

    ```


    In this example, pane is added as the root node for the scene.'
