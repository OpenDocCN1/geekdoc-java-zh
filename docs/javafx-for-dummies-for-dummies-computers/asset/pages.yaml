    # Creating arcs


    Another useful type of shape is an arc, which is a segment of an ellipse. To create
    an arc, you supply the parameters for the ellipse and then you supply the angle
    at the arc begins: 0 is due east (3:00 on a clock face). Finally, you supply the
    length, which represents how much of the arc spans and is also expressed in degrees.


    The important thing to know is that the arc travels counterclockwise from the
    starting point. If you specify /90 as the starting point and 90 as the extent,
    the arc travels from 12:00 to 9:00, as shown in the first shape in the third row
    in Figure 13-1.


    JavaFX can create three types of arcs, which you can specify via the setType method:


    +   - ArcType.OPEN: Indicates that you want to draw the arc itself

    - ArcType.CHORD: Means that you want to draw the arc and then connect the ends
    with a straight line to create a closed shape


