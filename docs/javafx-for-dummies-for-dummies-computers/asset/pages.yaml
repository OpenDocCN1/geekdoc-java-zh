  md: '# 192 Part II: JavaFX Controls


    You use two main classes to create this table: TableView, which represents the
    entire table, and TableColumn, which represents an individual column. The next
    two sections show how to work first with the TableColumn class to create the three
    table columns, as shown in Figure 9-1, and then with the TableView class to assemble
    the columns into a table. After that, you see the source code for the program
    that created the table shown in Figure 9-1.


    # Using the TableColumn class


    The TableColumn class represents a single column in a table. This class allows
    you to bind the column to a property in the table''s items list so that cell values
    are retrieved automatically from the correct property. Table 9-2 lists the most
    important constructors and methods of this class.


    | Constructor | Description |

    | :--- | :--- |

    | TableColumn<S, T>() | Creates an empty table column. The type S should correspond
    to the type that''s associated with the TableView and its ObservableList. The
    type T indicates the type of data displayed in the column. |

    | TableColumn<S, T>(String heading) | Creates an empty table column with the specified
    heading text. |

    | void setMinWidth(double width) | Sets the minimum width for the column. The
    table column may expand the width if necessary to display the column''s data.
    |

    | void setMaxWidth(double width) | Sets the maximum width for the column. |

    | void setPrefWidth(double width) | Sets the preferred width for the column. |

    | void setTitle(String title) | Sets the heading text. |

    | void setSortable(boolean sortable) | If true, the user can sort data on this
    column. (The default is true.) |

    | void setCellValueFactory(PropertyValue f) | Specifies a factory class that provides
    values for the cells in this column. Usually specified as an instance of the PropertyValueFactory
    class.*'
