  md: "# 202 Part II: JavaFX Controls\n\nThe CellEdit class contains information you\
    \ can use to update the items collection with the new data entered by the user.\
    \ Specifically, the getRowValue method returns the items collection for the row\
    \ that's being edited, and the getNewValue method contains the updated value entered\
    \ by the user. After you get the row object, you can update the appropriate property\
    \ with the new value.\n\nUnfortunately, the CellEdit class has more than one method,\
    \ which disqualifies it as a functional class that can be used in a Lambda expression.\
    \ So the preceding example, the e parameter that passed into the Lambda function\
    \ is passed as a generic Event rather than as the more specific CellEditEvent.\
    \ The Lambda function, in turn, passes this argument to the colTitle OnCommit\
    \ method, which must receive it as an Event. This method then calls it to a CellEditEvent\
    \ so that it can access the getRowValue and setNewValue methods.\n\n```\npublic\
    \ void colTitleOnCommit(Event e) {\n    TableColumn.CellEditEvent<Movie, String>\
    \ ce;\n    ce = (TableColumn.CellEditEvent<Movie, String>) e;\n    Movie m = ce.getRowValue();\n\
    \    m.setTitle(ce.getNewValue());\n}\n```\n\nWith this event handler in place,\
    \ the user can update the title of any movie by double-clicking the title, typing\
    \ a new value, and pressing Enter.\n\n# A Program That Creates an Editable Table\n\
    \nListing 9-3 shows a refined version of the movie inventory program that was\
    \ written in Listing 9-2. This program adds the ability to edit existing movies\
