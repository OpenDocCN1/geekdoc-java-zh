  md: '# Chapter 4: Setting the Stage and Scene Layout 87


    # # Creating a Close button


    To add a button or other user-interface element that allows the user to close
    the button, all you have to do is provide an action event handler that calls the
    stage''s close method.


    For example, suppose you create a Close button using the following code:


    ```

    Button btnClose = new Button();

    btnClose.setText("Close");

    btnClose.setOnActionAction(e -> primaryStage.close());

    ```


    In this case, the action event handler simply calls primaryStage.close() to close
    the application.


    If you want to do more than simply call the close method in the event handler,
    you may want to isolate the event handler in a separate method, as in this example:


    ```

    btnClose.setOnAction(e -> btnClose_Clicked());"

    ```


    Because the btnClose_Clicked method will need to access the primary stage to close
    it, you need to define a class field of type Stage and use it to reference the
    primary stage. Then, your btnClose_Clicked method can easily perform additional
    tasks. For example:


    In this example, a confirmation box is displayed to make sure the user really
    wants to exit the program.'
