  md: "# 324 Part IV: Making Your Programs Come Alive\n\nSetting up either type of\
    \ binding is surprisingly easy. Every property has a bind and a bindBidirectional\
    \ method. To set up a binding, simply call this method, specifying the property\
    \ you want to bind to as as the argument.\n\nHere's an example that creates a\
    \ unidirectional binding on the text property of a label to the text property\
    \ of a text field, so that the contents of the label always displays the contents\
    \ of the text field:\n\n```\nlabel1.textProperty().bind(text1.textProperty());\n\
    ```\n\nWith this binding in place, the text displayed by label1 is automatically\
    \ updated, character by character, when the user types data into the text field.\n\
    \nThe following example shows how to create a bidirectional binding between two\
