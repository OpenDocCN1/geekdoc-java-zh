    # Step Eight: Add a Mesh Object


    The three objects you''ve added to your virtual world so far have been created
    using the three built-in 3D shape classes that come with JavaFX: Cylinder, Box,
    and Sphere. For more complex objects, you must use the TriangleMesh class to create
    the object based on a connected series of triangles.


    In this step, I create one of the simplest of all mesh objects: the four-sided
    pyramid pictured in Figure 20-7. Visually, a four-sided pyramid has a total of
    five faces: the four triangular sides and the square base. But in a JavaFX triangle
    mesh, squares are not allowed, only triangles. The pyramid actually consists of
    six faces: the four triangular faces and two adjacent triangles that make up the
    face.


    This section presents probably the most conceptually difficult information in
    this entire book. If you haven''t studied meshes in a Computer Graphics class,
    be prepared to read through the following paragraphs several times before it starts
    to make sense. If it still doesn''t make sense, grab a latte, pull out a sheet
    of graph paper, and start doodling. Drawing the pyramid with your own hand will
    help your understanding. I recommend you use a pencil.


    ![](img/71d6d293a802aaccab3a1d9dafaea059_407_0.png)


    Figure 20-7:

    A square pyramid.


    To get the pyramid started, call the TriangleMesh constructor like this:


    ```

    TriangleMesh pyramidMesh = new TriangleMesh();

    ```


    To complete the pyramid, you need to populate three collections that define the
    geometry of the mesh. These collections hold the points, the faces, and the texture
    coordinates that define the shape.'
  merge: -1
  pgno: 407
- img_proc: true
  md: "# Chapter 20: Ten Steps to Building a 3D World\n\nI start with texture coordinate\
    \ collection, because you can pretty much ignore it for this simple pyramid. Texture\
    \ coordinates are useful when you're using a material that contains an image that\
    \ should be stretched in a specific way over the framework of the mesh. They allow\
    \ you to associate a specific x-, y-coordinate in the image with each corner of\
    \ face.\n\nUnfortunately, you can't simply leave out the texture coordinates even\
    \ if you don't need them, so you must load at least one coordinate. Do that with\
    \ this line of code:\n\n```\npyramidMesh.getTexCoords().addAll(0,0);\n```\n\n\
    Now I on to the other two collections. The next is a collection of the vertices\
    \ (that is, corners) that defines the shape. Your pyramid has five vertices, which\
    \ you can envision as the top, the front corner (the point nearest you), the left\
    \ corner, the back corner, and the right corner. These vertices are numbered 0,\
    \ 1, 2, 3, and 4.\n\nGiven the h and the length s of each side of the pyramid,\
    \ you can calculate the x-, y-, and z-coordinates for each vertex using the following\
    \ formulas:\n\n| Vertex | Corner | X | Y | Z |\n|---|---|---|---||}{\n| 0 | Top\
    \ | 0 | 0 | 0 |\n| 1 | Front | 0 | h | -s/2 |\n| 2 | Left | -s/2 | h | 0 |\n|\
    \ 3 | Back | s/2 | h | 0 |\n| 4 | Right | 0 | h | s/2 |\n\nWith all that as background,\
    \ here's the code to create the Points collection:\n\n```\nfloat h = 150; // Height\n\
    float s = 300; // Side\npyramidMesh.getPoints().addAll(\n    0, 0, // Point 0\
    \ - Top\n    0, h, -s/2, // Point 1 - Front\n    -s/2, h, 0, // Point 2 - Left\n\
    \    s/2, h, 0, // Point 3 - Back\n    0, h, s/2 // Point 4 - Right\n);\n```\n\
    \nThe final collection defines the faces. The faces are defined by specifying\
    \ the index of each vertex that makes up each face. For example, the left face\
    \ is a triangle whose three vertices are the top, the front, and the left. The\
    \ indexes for these three vertices are 0, 2, and 1."
  merge: -1
  pgno: 408
- img_proc: true
  md: "# 400 Part V: The Part of Tens\n\nThere are a total of six triangles in the\
    \ pyramid, and their faces are defined by the following points:\n\n| Face | Point\
    \ 1 | Point 2 | Point 3 |\n| Front left | 0 | 2 | 1 |\n| Front right | 0 | 1 |\
    \ 3 |\n| Back right | 0 | 3 | 4 |\n| Back left | 0 | 4 | 2 |\n| Bottom rear |\
    \ 4 | 1 | 2 |\n| Bottom front | 4 | 3 | 2 |\n\nAlthough it may not be evident\
    \ from this table, the order in which the faces appear is critical to the success\
    \ of the mesh. In general, the faces are listed in a counter-clockwise and downward\
    \ order. Thus, the four side faces around a pyramid in counter-clockwise order.\
    \ They are followed by the two bottom faces.\n\nEach face in the Faces collection\
    \ is represented by three pairs of numbers, each of which represents the index\
    \ of one of the vertices of the triangle and the index of the corresponding texture\
    \ coordinate. Because you have only one item in the Texture Coordinate collection,\
    \ the second number in each pair will always be zero. Thus, the sequence 0, 2,\
    \ 0, 1 defines the front left face: The vertex indexes are 0, 2, and 1, and the\
    \ texture coordinate indexes are all 0.\n\nHere's the code to load the Faces:\n\
    \n```\nMesh.getFaces().addAll( // Front left face\n    0.0, 2.0, 1.0, // Front\
    \ right face\n    0.0, 1.0, 3.0, // Back right face\n    0.0, 3.0, 4.0, // Back\
    \ left face\n    0.0, 4.0, 2.0, // Bottom rear face\n    4.0, 1.0, 2.0, // Bottom\
    \ front face\n    4.0, 3.0, 1.0);\n```\n\nAfter the three collections of mesh\
    \ are ready, the rest of the code fleshes out the pyramid by adding a Phong material,\
    \ translates the pyramid to get it off the center of the scene, and adds the pyramid\
    \ to the root:\n\n```\nMeshView pyramid = new MeshView(pyMesh);\npyramid.setDrawMode(DrawMode.FILL);\n\
    pyramid.setMaterial(blueStuff);\npyramid.translateX(200);\npyramid.translateZ(200);\n\
    root.getChildren().add(pyramid);\n```"
