  md: '# Chapter 8: Choosing from a List


    # # Creating a choice box


    Creating a choice box is easy. The ChoiceBox class is generic, so specify a type
    for the list that will be associated with the choice box. For example:


    ```

    ChoiceBox<String> choice = new ChoiceBox<String>();

    ```


    Here, a choice box that displays strings is created.


    The next step is to add items to the choice box. You can do that by calling the
    getItems method to access the list of items and then calling the add method to
    add an item:


    ```

    choice.getItems().add("Bashful");

    choice.getItems().add("Doc");

    choice.getItems().add("Dopey");

    choice.getItems().add("Grumpy");

    choice.getItems().add("Happy");

    choice.getItems().add("Sleepy");

    choice.getItems().add("Sneezy");

    ```


    Alternatively, you could call theaddAll method and add all the strings at once,
