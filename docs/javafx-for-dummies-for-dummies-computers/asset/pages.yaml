    +   - Each region of a border pane can contain a node. Because a layout pane itself
    is a type of node, each region of a border pane can contain another layout pane.
    For example, suppose you want to display three controls in the center region of
    a border pane. To do that, you''d create a second layout pane and add the three
    controls to it. Then, you''d set the second layout pane as the node to be displayed
    in the center region of the first pane.


    +   - You read more about the BorderPane class and a few commonly used layout
    panes in Chapter 5. You also can read about the layout panes that aren''t as commonly
    used in Chapter 13.


    ![](img/71d6d293a802aaccab3a1d9dafaea059_51_0.png)


    # Making a Scene


    After you create a layout pane that contains the controls you want to display,
    the next step is to create a scene that will display the layout pane. You can
    do in a single line of code that declares a variable of type Scene and calls the
    Scene constructor. Here''s how I did it in the Click Me program:


    ```

    Scene scene = new Scene(pane, 300, 250);

    ```


    The Scene constructor accepts three arguments:


    +   - A node object that represents the root node to be displayed by the scene.


    +   - A scene can have only one root node, so the root node is usually a layout
    pane, which in turn contains other controls to be displayed. In the Click Me program,
    the root node is the border layout pane that contains the button.


    +   - The width of the scene in pixels.


    +   - The height of the scene in pixels.


    If you omit the width and height, the scene will be sized automatically based
    on the size of the elements contained within the root node.


    You can find out some additional capabilities of the Scene class in Chapter 4.


    ![](img/71d6d293a802aaccab3a1d9dafaea059_51_1.png)


