  md: '# Chapter 13


    # Drawing Shapes


    In This Chapter


    +   - Creating basic shapes such as lines, rectangles, circles, and ellipses

    - Creating shapes you can see through

    - Creating gradient fills

    - Rotating, translating, and scaling shapes

    - Drawing some text

    - Combining shapes with union, intersect, and subtract operations


    Were you one of those kids, way back in school, passed away the boring hours of
    algebra class by doodling in the margins of the book? If so, you''re in luck.
    Now that you''re a grown and you''re mastering JavaFX programming, you don''t
    have to doodle in the book. Instead, you can write programs that doodle onscreen.


    This chapter is a brief introduction to the fascinating world of drawing in JavaFX.
    Specifically, you figure out how to draw two-dimensional objects such as lines,
    rectangles, ellipses, and so on. You can set the style used to draw the shape''s
    outline, and you can fill the shape with a solid color, a gradient fill, or text
    that''s created from an image. You can make your shapes solid or transparent,
    and you can rotate, clip, skew, and do all sorts of other unspeakable things to
    them.


    # Introducing the Shape Class


    So far in this book, you''ve read about two types of nodes you can add to a scene
    graph: controls, which inherit the Control class, and layout panes, which inherit
    the Pane class. In this section, you read about how to work with a third type
    of node: shapes, which (as you might guess) inherit the Shape class. Table 13-1
    lists some of the most commonly used methods of the Shape class.'
