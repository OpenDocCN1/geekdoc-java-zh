  md: '# 34 Part I: Getting Started with JavaFX


    # # Importing JavaFX Packages


    Like any Java program, JavaFX programs begin with a series of import statements
    that reference the various JavaFX packages that the program will use. The Click
    Me program includes the following five import statements:


    ```

    import javafx.application.*;

    import javafx.stage.*;

    import javafx.scene.*;

    import javafx.scene.layout.*;

    import javafx.scene.control.*;

    ```


    As you can see, all the JavaFX packages begin with javafx. The Click Me program
    uses classes from five distinct JavaFX packages:


    +   * `javafx.application`: This package defines the core class on all JavaFX
    applications depend: `Application`. You can read more about the Application class
    in the section "Extending the Application Class" later in this chapter.

    * `javafx.stage`: The most important class in this package is Stage, which defines
    the top-level container for all user interface objects. Stage is a JavaFX application''s
    highest-level window, within which all the application''s user-interface elements
    are displayed.

    * `javafx.scene`: The most important class in this package is the Scene class,
    which is a container that holds all the user interface elements displayed by the
    program.

    * `javafx.scene.layout`: This package defines a special type of user-interface
    element called a layout manager. The job of a layout manager is to determine the
    position of each control displayed in the user interface.

    * `javafx.scene.control`: This package contains the classes that define individual
    user interface controls such as buttons, text boxes, and labels.


    The Click Me program uses just one class from this package: Button, which represents
    a button that the user can click.


    # # Extending the Application Class


    A JavaFX application is a Java class that extends the javafx.application. class.
    Thus, the declaration for the Click Me application''s main class is:


    ```

    public class ClickMe extends Application

    ```'
