  md: 'The first step in creating a TreeView control is declaring a TreeView-variable
    as a class instance variable so that you can access it in any method within your
    program, as follows:


    ```

    TreeView tree;

    ```


    Then, in the application''s start method, you call the TreeView constructor to
    create the tree view control, passing the root node of the tree you want it to
    display as a parameter:


    ```

    tree = new TreeView();

    ```


    By default, the user can select just one node from the tree. To allow the user
    to select multiple nodes, use this strict incantation:


    ```

    tree.SelectionModel().setSelectionMode(SelectionModel.MULTIPLE);

    ```


    Here the getSelectionModel method is called to get the selection model that manages
    the selection of nodes within the tree. This method returns an object of type
    MultipleSelectionModel, which includes a method named setSelectionMode that lets
    you set the selection mode. To allow multiple items to be selected, you must pass
    this method the SelectionModel.


    That''s it! You now have a TreeView control that you can add to a layout pane
    and display in your scene.


    Although the tree displayed by a tree view control must begin with a root node,
    in many cases the root node is superfluous. For example, in the example you''ve
    been looking at, what''s the point of showing the root node? The TreeView control
    lets you suppress the display of the root node if you don''t want it to be shown.
    To hide the root node, just call this method:


    ```

    tree.setShowRoot(false);

    ```


    Figure 8-6 shows how the tree appears with the root node hidden.


    ![](img/71d6d293a802aaccab3a1d9dafaea059_187_0.png)'
