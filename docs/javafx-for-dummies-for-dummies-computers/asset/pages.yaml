  md: '# Chapter 12: Skinning Your Application with CSS


    # # Specifying background colors


    The Region class has a property named -fx-background-color that lets you specify
    the background color. Because both the Layout and Control classes inherit Region,
    you can use this property with any layout pane or control.


    ![](img/71d6d293a802aaccab3a1d9dafaea059_274_0.png)


    To apply a background color to a layout pane, you must first give the layout pane
    a class name or id so you can refer to it in a selector.


    The following paragraphs describe the possible values you can supply for this
    property:


    +   - **Named color:** JavaFX defines 148 distinct colors by name, including basic
    colors such as black, white, red, orange, and blue as well as exotic colors such
    as cornsilk and thistle.


    For example:

    ```

    -fx-background-color: red

    ```


    or

    -fx-background-color: papayawhip


    For a complete list of all 148 named colors, consult the CSS reference page online
    at http://docs.oracle.com/javase/8/javafx/api/javafx/scene/doc-files/cssref.html#typecolor.


    +   - **RGB color:** The red-green-blue number of the color. This is usually expressed
    in hex, with two digits for each component of the color. The entire thing is prefixed
    with a hash like this:


    ```

    -fx-background-color: #f5f5f5

    ```


    +   - **Gradient:** Lets you specify the color as a gradient that creates a smooth
    transition from one color to another.


    For information about creating gradients, flip to Chapter 13.


    +   - **Lookup color:** A lookup color lets you define a set of color names in
    the .root section of the style sheet and then refer to the color name anywhere
    else within the style sheet.'
