  md: "# Part III: Enhancing Your Scenic Design\n\n# Specifying font properties\n\n\
    For nodes that display text, you can use the properties shown in Table 12-1 to\
    \ control the text style.\n\n| Property | Font Style Properties |\n| --- | ---\
    \ |\n| -fx-font-family | The actual name of the font, or one of the following-generic\
    \ font types: serif, sans-serif, cursive, fantasy, or monospace. |\n| -fx-font-size\
    \ | A number followed by the unit of measure, which is usually pt (points) or\
    \ px (pixels). |\n| -fx-font-style | normal, italic, or oblique. |\n| -fx-font-weight\
    \ | normal, bold, bolder, lighter, 100, 200, 300, 400, 500, 600, 700, 800, or\
    \ 900. |\n| -fx-font | A shorthand property that combines all properties mentioned\
    \ here into a single value that lists the style, weight, size, and family. Separate\
    \ the values with spaces. If you want, you can omit the style and weight. |\n\n\
    The following example sets the font for all button controls:\n\n```\nbutton {\n\
    \  -fx-font-family: sans-serif;\n  -fx-font-size: 10pt;\n  -fx-font-style: normal;\n\
    \  -fx-font-weight: normal\n}\n```\n\nThis version does the same thing using the\
    \ shorthand font property:\n\n```\nbutton {\n  -fx-font: 10pt sans-serif;\n}\n\
    ```"
