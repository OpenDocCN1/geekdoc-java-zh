  md: '# 162 Part II: JavaFX Controls


    If you''re familiar with Java collection classes, such as ArrayList, you may have
    noticed that many of the methods listed in Table 8-2 are familiar. That''s because
    the ObservableList class extends the List class, which is implemented by classes,
    such as ArrayList and Vector. As a result, any method that can be used with an
    ArrayList can also be used with ObservableList.


    For example, you can clear the contents of a choice box in the same way you''d
    clear the contents of an array list:


    ```

    cbox.getItems().clear();

    ```


    If you need to know how many items are in a choice box, call the size method:


    ```

    int count = cbox.getItems().size();

    ```


    To remove a item from the list, use the remove method:


    ```

    cbox.getItems().remove("Grumpy");

    ```


    This method succeeds whether or not the string "Grumpy" appears in the list. You
    can easily insert items from an existing Java collection, such as an array list,
    into a choice box by specifying the collection in the add method. For example,
    suppose you already have an array list name that contains the items you want to
    display in the choice box. You can add the items like this:


    ```

    cbox.getItems().addAll(list);

    ```


    You might be wondering why an observable list is required for the items displayed
    by list-based JavaFX controls. Why not just use the collecting classes? The reason
    is that for list-based controls to work efficiently, the controls need to monitor
    any changes you might make to the list of items so that the control can automatically
    update the displayed items. The last method listed in Table 8-2 (addListener)
    provides this capability by allowing you to add a listener that''s called whenever
    the contents of the list changes. You will rarely call this method directly. But
    the controls that use observable lists do call this method to create event listeners
    that automatically update the control whenever the contents of the list changes.'
