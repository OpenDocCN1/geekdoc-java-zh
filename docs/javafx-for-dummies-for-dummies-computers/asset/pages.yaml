  md: '# Part V: The Part of Tens


    When the setRotate method is called the second time to rotate the box on the z-axis,
    the x-axis rotation is reset.


    To rotate on more than one axis, you must use the Rotate class instead. You create
    a separate Rotate instance for each axis you want to rotate the object and then
    add all the Rotate instances to the object''s Transforms collection via the getTransforms().addAll
    method, like this:


    ```

    Rotate rxBox = new Rotate(0, 0, 0, 0, Rotate.X_AXIS);

    Rotate ryBox = new Rotate(0, 0, 0, 0, Rotate.Y_AXIS);

    Rotate rzBox = new Rotate(0, 0, 0, 0, Rotate.Z_AXIS);

    rxBox.setAngle(30);

    ryBox.setAngle(50);

    rzBox.setAngle(30);

    box.getTransforms().addAll(rxBox, ryBox, rzBox);

    ```


    The Rotate constructor accepts four parameters. The first three are the x-, y-,
    and z-coordinates of the point within the object through which the rotation axis
    will pass. Typically, you specify zeros for these parameters to rotate the object
    around its center point. The fourth parameter specifies the rotation-axis.


    Figure 20-5 shows how the box appears after it''s been rotated.


    ![](img/71d6d293a802aaccab3a1d9dafaea059_405_0.png)


