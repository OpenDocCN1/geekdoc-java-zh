  md: '# 304 Part III: Enhancing Your Scenic Design


    # Combining Effects


    By now, I hope you agree that JavaFX special effects can have a major impact on
    the appearance of your scenes. But wait, there''s more! JavaFX lets you improve
    the appearance of your scenes even more by allowing you to combine special effects,
    essentially layering one effect atop another.


    To combine effects, you use the setInput method, which is available for all the
    effects classes I cover in this chapter. Simply put, you create an instance of
    an effect class, create an instance of a second effects class, and chain the first
    to the second by calling the first effect''s setInput method and specifying the
    second effect as the input.


    For example, suppose you want to combine a reflection with a shadow and then apply
    the effect to a rectangle. You can do so like this:


    ```

    Rectangle rect = new Rectangle(100,100);

    DropShadow shadow = new DropShadow();

    Reflection reflect = new Reflection();

    rect.setInput(shadow);

    rect.useEffect(reflect);

    ```


    In this example, the shadow effect will first be rendered on the rectangle.

    Then, the reflection effect will be rendered on the rectangle, creating a reflection
    of both the rectangle and its shadow.


    Figure 14-9 shows how the chessboard that was created in the preceding section
    appears with a drop shadow chained to the perspective transform. The code that
    creates the perspectiveTransform and shadow effects is as follows:


    ```

    PerspectiveTransform e = new PerspectiveTransform();


    e.setULX(100);                // Upper left

    e.setULY(100);


    e.setURX(450);                // Upper right

    e.setURY(100);


    e.setLLX(0);                  // Lower left

    e.setLLY(300);


    e.setLRX(400);                // Lower right

    e.setLRY(300);


    DropShadow shadow = new DropShadow();

    shadow.setWidth(20);

    shadow.setHeight(20);

    ```'
