    JavaFX provides three effects classes that can make an object blurry. Each of
    these classes uses a different method for applying the blur:


    +   - BoxBlur: Applies a simple and efficient blurring technique in which each
    pixel in the blurred region is calculated by averaging its neighbor-pixels in
    the input image.

    - GaussianBlur: Uses a Gaussian blurring algorithm, which is more accurate but
    less efficient than a box blur.

    - MotionBlur: Blurs the shape directionally, creating the effect of motion.


