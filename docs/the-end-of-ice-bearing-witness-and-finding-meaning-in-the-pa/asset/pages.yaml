    he does not hesitate. “The biological diversity,” he says. “It’s a unique subtropical
    setting. We have 125 species in South Florida, and 100 of them are from the Caribbean.”
    There’s everything from Jamaican dogwood to mahogany, and there are more than
    366 species of birds in the park as well.


    Native peoples such such as the Calusa, Tequesta, Seminole, and Miccosukee once
    flourished, but when white arrived in the 1800s, they killed or drove most of
    them out. Dams, floodgates, canals, levees, and roads were built, diverting most
    of the water away from the Everglades and setting in motion all kinds of ecological
    problems as they began to dry up. The area was designated a national park in 1947,
    but problems persisted outside its borders as diverted water was used to irrigate
    nearby farms and invasive species infiltrated the park.


    While restoration efforts have been under for quite some time, the park now faces
    a new threat: rising seas. The park is so flat—with its highest point eight feet
    above sea level—that it has become popular with cyclists. But because of flatness,
    the park will disappear. Climate disruption-driven changes in temperatures and
    precipitation patterns are already impacting the Everglades, and the rising sea
    level is already eroding cultural sites, changing wildlife habitats, and increasing
    the salinity in the park’s estuaries.


    Leaving the southernmost visitor center, I get in my car and venture into the
    1.5 million acres that make up the Everglades. Sawgrass prairies stretch out as
