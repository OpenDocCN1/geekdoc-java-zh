- pgno: 168
  md: '“If it comes closer to thawing point, then it becomes unstable,” he says. “For
    any permafrost research, that is the crucial data: what is the temperature and
    how stable is it?” His lab is unique in that it now has nearly forty years of
    data records from a variety of locations, and he generates permafrost temperature
    modeling to explain how the temperatures are changing and, based on various climate
    disruption scenarios, can make projections of how the permafrost will change.


    The changes in the permafrost that are happening across Alaska’s North Slope,
    where Utqiaagvik is located, are due to some of the most dramatic temperature
    increases in the world. In thirty-five years of measurements here, the temperature
    at twenty meters below the ground has increased a stunning 3°C since Romanovsky’s
    first measurement, and at the surface of the permafrost one meter has increased
    by a staggering 5°C since the mid-1980s. Even small increases bring the temperature
    of the permafrost closer to 0°C. Crossing that means the permafrost will start
    to thaw.


    Scientists have always believed the permafrost was stable across the North Slope
    and that it would not begin to thaw this century. Romanovsky says, “If you look
    at our records, however, and extrapolate into the future another thirty years,
    assuming changes continue as they have been for the last thirty years, the permafrost
    on the North Slope will hit 0°C by 2050 or 2060 at the latest. Nobody was expecting
    this, and most people would be surprised to see this happen so soon.”


    The permafrost across much of interior Alaska is, in fact, already beginning to
    thaw, changing the topography of the land. The same thing is happening in Siberia,
    where in late June and early July 2017, two massive craters appeared on the Yamal
    Peninsula. The *Siberian Times*, along with many Russian scientists, believe they
    were caused by methane once trapped in the permafrost.¹³ The eruptions, reportedly
    accompanied by fire and smoke, were large enough to be picked up by seismic sensors
    and were only the latest of similar incidents in recent years. “This is a new
    phenomenon and is not described or explained in any scientific literature,” Romanovsky
    says. Later that summer, researchers began investigating several'
