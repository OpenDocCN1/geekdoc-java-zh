  md: 'Aside from assisting two climbers who struggled into camp who had descended
    in whiteout conditions from near the summit after ascending a technically challenging
    route up into the maelstrom, the bulk of the next two days are spent bolstering
    the integrity of our tents, digging more out of my tent pit, reading and journaling,
    and sharing meals with Mik, Sue, and the two climbers recovering from their ordeal
    on high.


    I relish the long periods of solitude in my tent. I have unfilled time, which
    is perhaps the rarest commodity in the modern world. In that space, perched a
    mere one-day climb and 3,110 feet below the summit, I have plenty of opportunity
    to ponder.


    If you are going to summit Denali, it will only be when the mountain allows it.
    In Nepal, the Sherpa believe that after someone commits to climbing a mountain,
    every action they have taken in their lives from the moment of commitment until
    the climb will determine their success. You will only reach the summit if you
    have the right intentions and your actions have been good. While there are plenty
    of examples to disprove this, my own experience has borne this.


    My first attempt on Argentina’s Aconcagua nearly ended in my death. The winter
    following my first ascent of Denali in 1997, I was twenty-nine, full of pride,
    and lacking the respect I needed to have for the highest peak in the Western Hemisphere,
    which stands at 22,841 feet. Located in Argentina near the Chilean border, the
    mountain is far less challenging than climb Denali. The standard route doesn’t
    cross any glaciers and, while nearly half a mile higher than Denali, it isn’t
    require carrying as much food and fuel as Denali. As a result, I saw it as little
    more than a highaltitude hike and I didn’t take the training seriously. I ascended
    too quickly and fell ill from cerebral and pulmonary edema. I awoke one morning
    in the rangers’ medical tent with my climbing partner handing me medication. I
    was still struggling to breathe as my lungs had filled with fluid. I was suffering
    an excruciating headache, too, and felt completely out of it. I couldn’t stand,
    let alone walk, so I was placed on top of a mule and rode down to the base of
    the climb many miles below. There I was taken to a hospital where, being nearly
    two miles lower than where I got sick, my body healed.'
