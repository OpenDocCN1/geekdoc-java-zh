  md: 'asking ourselves, “How shall I use this precious time?” Thich Nhat Hanh reminds
    us of the value just in being present with what is happening to the planet: “When
    your beloved is suffering, you need to recognize your suffering, anxiety, and
    worries, and just by doing that, you already offer some relief.”^3


    Reporting on the catastrophic impact of climate disruption for this book involved
    trips to the front lines of collapsing geo- and biospheres and reports about near-apocalyptic
    scenarios: about rapidly thawing permafrost, the release of methane into the atmosphere,
    the flooding of coastal cities, the increasing likelihood of billions of people
    dying in the not-so-distant future. Though I learned to find a way of looking
    unwaveringly at what was happening to the planet, I fell into a deep depression
    and I began to wonder whether there was any point in even writing about this.


    I had hoped my work in Iraq would contribute to ending the U.S. occupation of
    that country. I had hoped, too, that writing climate dispatches and bludgeoning
    people with scientific reports about increasingly dire predictions of the future
    would wake them up to the planetary crisis we find ourselves in. It has been very
    difficult for me to surrender that hope. But I came to understand that hope blocked
    the greater need to grieve, so that was the reason necessitating the rendering
    of it.


    Back home from Denali, I had to continue to find a way to balance what I was experiencing.
    I resumed my weekend forays into the nearby Olympic National Park. Again drawn
    to the mountains, I hiked through old-growth forests up into alpine basins filled
    with mountain lakes and hemmed in by rugged peaks. Scrambling up steep rocky slopes
    toward another summit and finding a cliff edge to perch on a lunch of nuts, dried
    salmon, and coffee, I breathed in the scene below: a valley running toward the
    Strait of Juan de Fuca, the glacier just below the summit of Mount Carrie, a raven
    flying above. Saved every moment. Each trip sparked my curiosity about another
    peak or valley. When I returned home, I cleaned my gear and replenished the food
    bag, and the maps came out, and I would begin packing for my next hike or climb.
    These forays into the mountains are my way of being with the Earth in order to
    remain'
