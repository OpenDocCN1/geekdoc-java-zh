    biologist tells me that one of the guys has a loaded shotgun against his chest,
    and he''s upset about this.”


    Wright and most of his colleagues understood that changes in the ocean affect
    people''s lives. Being an Alaskan, he knew all too well that people relied on
    subsistence living, not just for food but as a way of life. The dramatic shift
    across the biological system in the Gulf of Alaska in the 1970s was the first
    evidence of profound change that Wright witnessed, and he attributed it directly
    to the waters warmed by climate disruption.


    Fast-forward to 2016.


    “This last summer, the gulf warmed up 15°C warmer than normal in some areas,”
    Wright told me “Yes, you heard right. 15°C. And it is now, overall, 5°C above
    normal in both the Gulf of Alaska and Bering Sea, and has been all winter long.”


    My head swam. The biological shift that caused the fisheries to close in the 1970s
    came from a 2°C change in water temperature.


