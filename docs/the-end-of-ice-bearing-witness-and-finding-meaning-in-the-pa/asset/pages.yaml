  img_proc: true
- pgno: 171
  md: 'Over a five-year cycle, methane can trap up to a hundred times more heat than
    carbon dioxide, and thirty-five times as much over a hundred-year time scale,
    making it a far more potent greenhouse gas in both the short and long terms.20“Over
    a ten-year timescale, methane globally dominates climate change,” Leifer tells
    me when I speak with him from Utqiagvik. “If changes over ten years push you over
    a tipping point, you can’t return from that. This is why focusing on methane makes
    enormous sense.


    Leifer is particularly focused on the shallow seas of the Arctic, where the vast
    majority of methane can be found frozen in the permafrost underneath the water.
    Oceans have a thousand times the heat capacity of the atmosphere. Warming in water
    at 200°F is far faster than warming it in your oven at 200°F. If you boil a bagel
    at 200°F, it’ll be done in a minute of minutes. Place that dough in the water
    at 200°F, and it will never bake. So, as the atmosphere warms, melting the summer
    ice that prevented the permafrost from thawing and allowing the methane to escape
    into the atmosphere.—The East Siberian Sea is a huge shallow sea,” Leifer says.
    “So any methane there is going to get out. Same with terrestrial methane from
    permafrost.


    Leifer sees two main ways in which climate disruption affects the Arctic: direct
    warming and warming elsewhere on the planet that affects the Arctic. Geographically
    speaking, the Arctic is remote from the rest of the world’s oceans with one exception:
    the Barents Sea receives more of the warmer midlatitude waters than any other
    Arctic sea, and it is one of the major ways heat is transported into the Arctic.
    These oceanic currents are extremely important because the currents transporting
    warm water north are strengthening and the currents transporting cold water south
    are weakening. They are weakening the flow of warm, salty water that starts in
    the tropics and runs northward into the high latitudes is changing due to climate
    disruption.21 This is warming sea-surface temperatures in the Barents Sea, which
    are causing the permafrost in the bed of the sea to melt, releasing the methane
    held within.'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'The Barents Sea serves as an example of what might happen to the Arctic’s other
    shallow seas, including the Chukchi, Beaufort, and Bering Seas. “The process of
