- pgno: 170
  md: 'Disconcertingly, as terrestrial permafrost continues to thaw, it has now been
    shown that the methane it releases will be considerably more prevalent in the
    atmosphere.${16}


    Over the last two centuries, the amount of methane in the atmosphere has increased
    from 0.7 parts per million to 1.7 parts per million (and is continuing to rise),
    making increases in the global temperature of 4 to 6°C, or even far more, most
    likely inevitable. Methane is thought to be one of the primary drivers of the
    Permian mass extinction around 252 million years ago, when an estimated 93 percent
    of all species were wiped out over a period of approximately eighty thousand years.
    Also known as the “Great Dying,” it was believed to be triggered by a massive
    lava flow in what is now Siberia, which led to an increase in global ocean temperatures
    of 6°C. In turn, caused ice containing methane in the shallow seas to melt, which
    released into the atmosphere, causing temperatures to skyrocket even further.${17}


    We are currently in the midst of what scientists consider the sixth mass extinction
    in planetary history, with between 150 and 200 species going extinct daily, a
    pace times greater than the “natural” or “background” extinction rate in Earth’s
    geological and biological history before humans became a primary contributor to
    extinctions).{18} This may already be comparable to, or even exceed, the speed
    and intensity of the Permian mass extinction, the difference we are causing is
    this Great Dying and what may be our own extinction. The process probably isn''t
    going to take eighty thousand years if a sudden increase in methane comes from
    fossil fuels on top of the billions of tons of carbon dioxide from continue to
    enter the atmosphere annually.${19}


    Dr. Ira Leifer is an academic researcher who specializes in bubble-related oceanographic
    processes (such as subsea bubble emanating from the ocean floor), satellite remote
    sensing, and air pollution. Working closely with NASA on some of his projects,
    he uses his satellite data to study methane in the Arctic and its role in climate
    disruption.'
