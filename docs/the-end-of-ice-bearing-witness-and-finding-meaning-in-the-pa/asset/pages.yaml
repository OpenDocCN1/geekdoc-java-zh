- pgno: 162
  md: 'One evening I walk to the coast. Large waves whipped up by a storm out at sea,
    roll on onto the beach, many of them crashing against the twenty-five-foot berm.
    As they do, the water jets up into the air, colored dark brown from the fresh
    soil that has been dumped onto the berm. As the waves pull back into the sea,
    they carry large clumps of dirt with them the shallow waters of the Chukchi Sea
    Older canvas bags filled with soil protrude from the beach below, evidence of
    previous attempts to stop Chukchi Sea’s relentless march toward the village. On
    another part of the beach, I can see the tops of large metal tanks, rusting and
    laying side by side in a row, a remnant of past efforts to keep the sea away.


    The first row of houses in the village is barely fifty feet from the back of the
    berm. Not far behind them stand government buildings, the police station, and
    tribal offices. One hundred yards of me along the coast, only a dirt road separates
    houses from the edge of a fifteen-foot bluff and the waves that wash against it.


    Richard Taalak, who goes by Taaqpak, was born and raised in Utqiapvik. He is sixty-seven
    years old and, like all the elders here, is alert to the changes in the climate
    when he was younger. “Back then it would be forty-five or fifty below for weeks
    and at a time,” he tells me while crafting a traditional *ulu* knife with a walrus-tusk
    handle at a workshop. “Nowadays maybe it’ll be twenty or thirty below for two
    weeks.”


    The workshop smells of bone, coffee, and cigarette smoke. It is filled with native
    carving polar bears from fossilized walrus ivory, etching scrimshaw, and making
    knives and other traditional crafts. Taaqpak uses the ice used to come in October,
    but now it doesn''t flush to the shore until November. On the very day I speak
    with Taaqpak, a Finnish icebreaker set a new world record for the earliest transit
    of the Northwest Passage, setting off from Vancouver and arriving in the capital
    of Greenland, Nuuk, on July 29.


    Taaqpak’s friend Perry Matumeak lives in the senior center next door to the workshop
    and most days find him working on scrimshaw. Perry tells me that he never used
    to look forward to August, when it'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'would start snowing, signaling the end of summer. But now it sometimes won’t
    start snowing until October. They have never had summers this warm before. “Used
    to be we could see the sea ice from our house in the summer, but everything is
    off now. The ice is so small,” he says while etching away on whale baleen.\And
    even our hunting changed. Just three days ago we had a grizzly on the coast eighteen
    miles from here. This isn’t supposed to happen.”


    It is another calm day, with just a mild breeze. In the workshop that Perry finds
    someone to light a stick of mosquito repellent. “It used to be windy all the time,”
    he says. Taaqpaak comes over and mentions how in the “good old days” they used
    to sometimes even snow in July. “We don’t see that anymore,” he says.


    We talk more, then Taaqpaak goes back to making knives and Perry refocuses on
    his scrimshaw. I thank them for letting me sit with them and exit the workshop.
    Sadness comes over me. These kind, warm, gentle people and their culture will
    not be long for this place.


    The next morning I share coffee with Dr. James Churnside, a NOAA physicist working
    here who studies subsurface phytoplankton layers. Where there is still ice is
    significantly receded. “This year the ice is much further north than it was in
    2014,” he tells me. “We’re seeing pieces that look like they’ve been blown together
    by the wind. Where we’ve flown we’ve not seen anything that looks solid ice.”
    He is seeing before his eyes what the National Snow and Ice Data Center (NSIDC)
    information has been reporting for years now—that there is consistently less than
    lasts for a year, there is less coverage, and the ice is thinning. This is especially
    disorienting, given that some of Churnside’s team have flown as far as 250 miles
    north of Point Barrow.


    In February, NOAA had already expressed alarm about the record warm temperatures
    and extraordinary sea ice conditions that were now becoming the norm. January
    sea ice was the lowest it had ever been in thirty-eight years of satellite records,
    and average temperatures in Utqiagvik from November 2016 through January 2017
    were 4.4°F,'
