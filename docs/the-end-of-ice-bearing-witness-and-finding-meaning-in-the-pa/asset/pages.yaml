    at the Zadnade fishery, but there are no fur seals any more compared to what we
    used to have. You look at these rookies and they are just dying. This is what
    we see. This is nothing!"


    Simeon is the mayor of the village of St. Paul. Born on nearby St. George Island
    in 1956, his family moved to St. Paul when he was ten. He was raised in a subsistence
    lifestyle and his family had very little money, but they didn''t have much use
    for it either. Simeon, like the'
