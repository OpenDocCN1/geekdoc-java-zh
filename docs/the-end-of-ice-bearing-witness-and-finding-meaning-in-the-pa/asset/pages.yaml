  md: 'The clouds lie low on my last full day in Utqiapvik. Everyone I had spoken
    with town kept telling me I had to speak with ninety-two-year-old Wesley Aiken,
    the town elder. I''m directed back to the search-and-rescue building, where I
    find him getting a haircut in the back room. After he finishes up, he slowly walks
    into the main room, wearing a blue jacket and aided by a cane. He is always smiling,
    and I see his crow''s-feet behind his thick black-framed glasses.


    Compared to when he was a child in the 1920s, almost everything changed in Aiken''s
    world. Back then, there were maybe five hundred people in Utqiapvik. They used
    dogsleds to hunt and lived, for the most part, by traditional means. There were
    no jets, phones, no snowmobiles, and it was far, far colder during the winter
    and the brief summer. “All the ice is melting,” he says and just looks at me to
    let the weight of his statement sink. He speaks slowly. He is from a world where
    there was never a need to rush anything. “The ice used to hang around here all
    when I was young. The ocean is now eroding the coast. The waves are getting bigger
    and rolling into the coast. I think we''ll have no more Point Barrow before much
    longer,” he says of the thin, northernmost tip of the coast just east of the main
    village.


    Aiken sees the ice as life, for without it nothing is normal, least of all the
    hunting. “Right now we don''t have life on the Arctic Ocean,” he says, refining
    the thinning ice. “Just you in the winter these days. We used to have the ice
    here through all of July. The ice would be close in. There was no boating along
    the coast because of the ice, even in the summer, and when the wind changed from
    the west, the ice would pack in here along the coast.


    Later that day I would learn that hundreds of walrus had begun hauling themselves
    out of the Chukchi Sea onto for want of ice. Two years ago, more than thirty thousand
    so, alarming scientists and locals. “We don''t count the walrus anymore because
    the ice doesn''t come in here for them to be on,” Aiken says. “So we don''t see
    them hardly anymore. They don''t find any ice, so they hang around somewhere else.
    Sometimes we hear about them at other places, or at'
