- pgno: 190
  md: 'gratitude for the smallest, most mundane things. Grief is also a way to honor
    what we are losing. “Grief expressed out loud for someone we have lost, or a country
    or home we have lost, is itself the greatest praise we could ever give them,”
    thinker, writer, and teacher Martín Prechtel writes. “Grief is praise, because
    it is the natural way love honors what it misses.”My acceptance of our probable
    decline opens into a more intimate and heartfelt union with life itself. The price
    of this opening is the repeated embracing of my own grief. Grief is something
    I move through, to territory on the other side. This means falling in love with
    the Earth in a way I never thought possible. It also means opening to the innate
    intelligence of the heart. I am grieving and yet I have never felt more alive.
    I have found that it''s possible to reach a place of acceptance and inner peace,
    while enduring the grief and suffering that are inevitable as the biosphere declines.


    I believe everyone alive is feeling this sorrow for the planet, although most
    are not aware of it. Rather grieving for it, many are given pills for depression,
    or find other ways to self-medicate. To live well involves making amends to the
    Earth by finding gratitude for every bite of food and for every stitch of clothing,
    for every element in our bodies, for it all comes from the Earth. It also means
    living in a community with others who are remaking themselves and their lifestyle
    in accord with what is. “Hope is not the conviction that something will turn out,”
    Czech dissident, writer, and statesman Václav Havel said, “the certainty that
    something is worth doing no matter how it turns out.


    Writing this is my attempt to bear witness to what we have done to the Earth.
    I want to make my own amends to the Earth in the precious time we have left, however
    long that might be. I go into my work wholeheartedly, knowing that it is unlikely
    to turn anything around. And when the tide does not turn, my heart breaks, over
    and over again as the reports of each succeeding loss continue to in. The grief
    for the planet does not get easier. Returning to this again and again is, I think,
    the greatest service I can offer in these times. I am committed in my bones to
    being with the Earth, no matter what, to the end.'
