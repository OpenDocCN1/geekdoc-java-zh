- pgno: 33
  md: '# 2


    # Time Becomes Unfrozen


    A man who keeps company with glaciers comes to feel tolerably insignificant by
    and by. The Alps and the glaciers together are able to take every bit of conceit
    out of a man and reduce his self-importance to zero if he will only remain within
    the influence of their sublime presence long enough to give it a fair and reasonable
    chance to do its work.


    > —Mark Twain, A Tramp Abroad


    April 11, 2016. The nighttime temperature during the first night dipped below
    zero as faint green northern lights danced silently across the clear sky. While
    Alaska has been breaking all kinds of warm-temperature records in recent years,
    camping on the Gulkana Glacier in spring in the eastern part of the Alaska Range
    remains a bitterly cold experience. Several of us have pitched camp atop the ice
    and snow where we will work for the next several days.


    I''m volunteering with a United States Geological Survey (USGS) team, which is
    conducting one of the organization''s annual glacier surveys. The work entails
    using snowmobiles to place a camp high up on the glacier, taking day trips from
    there to dig snow pits, place survey stakes, and take radar measurements of different
    areas of the glacier. Their Benchmark Glacier Program has been tracking glaciers
    since 1957, and it first surveyed the Gulkana Glacier in 1967. Along with the
    South Cascade Glacier in the North Cascades Mountains of Washington State, the
    Gulkana provides the longest continuous record in the Northern Hemisphere of a
    glacier''s surface'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'mass balance—the difference between the amount of snow it accumulates in the
    winter and the amount of snow and ice that melted over summer. Change in mass
    balance is a glacier’s most sensitive climate indicator, and data gathered by
    the World Glacier Monitoring Service from 1980 to 2012 shows twenty-five consecutive
    years of negative mass balances for glaciers across the globe. In other words,
    the majority of the world''s glaciers are melting, and the trend has accelerated
    rapidly in recent years.


    Louis Sass, a thirty-eight-year-old, tall, wiry, quiet USGS glaciologist leads
    the team. Having worked as a guide on Denali for several years, Sass is an itinerant
    mountain man. He is at home high up a glacier in subzero temperatures as he is
    cooking in his own kitchen. Everything he does is measured, well thought out,
    and efficient, as is the way he talks.


    I’d ridden from Anchorage with him and Erin Horton, another glaciologist. As we
    drove past mountain ranges covered in what was left of another year of below-average
    winter snowpack, they both shared their fascination with glaciers and the planet.
    When I asked them they like about being with the USGS, they spoke about a deep
    curiosity to understand how and why things work as they do. The USGS is one of
    the premier scientific research organizations in the United States, and both of
    them had worked in Antarctica and had extensive experience in their field.


    Just after pulling into the trailhead, we offload the snowmobiles and prepare
    to get head up onto the ice. Sass explains that glaciers and ice fields are already
    adjusting to how we have warmed the climate. “There’s no place in Alaska that
    isn’t feeling the effects of human-caused warming,” he says.


    The Gulk is a prime example. Since 1974, the terminus has lost five hundred feet
    of thickness, and while the glacier has two side flowing into its main trunk,
    as Sass puts it, “It’s eventually just going to be the two higher side glaciers."


    Sass and his team dig pits and plunge long metal survey stakes down into the ice
    each April, when there is the maximum amount of ice and snow on the glacier for
    the year. They then return'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'at the end of summer when the ice is at its minimum and log the changes they
    find.


    Sass, Horton, and two other USGS scientists busily survey the glacier. I pitch
    in with a little of the pit digging but mostly help by pushing the survey stakes
    deep into the ice and recording the data Sass calls out from the bottom of another
    snow pit, where he is measuring the weight and consistency of the snow. The mornings
    are bitterly cold, but once we are out doing the work we find an easy rhythm,
    even as I''m enchanted by the hanging glaciers, massive cornices of the ridges,
    and the view down-glacier of the valley formed by this ice through the millennia.


    The last day of the survey we ride the snowmobiles into the upper part of the
    West Fork. It''s a risky ride, as our track crosses heavily crevassed areas, but
    thankfully passes without major incident. One of the snowmobiles gets stuck, but
    after we dig it out we are back on our way. At the top of the fork, it is calm
    and sunny, a bluebird in the mountains. The hulking massive of Mount Sanford,
    standing more than sixteen thousand feet tall, is visible to the southeast. The
    rugged Chugach Mountains run in a long white spine to the west and to the south.
    While Horton and Sass pull out snow core samples, the two other USGS scientists
    are cruising on snowmobiles mapping the upper glacier with radar. The electromechanical
    ice core drill (a drill used to core into snowpack at a glacier in order to sample
    layers that have formed through the annual cycle of snowfall and melting) gently
    whirs and grinds its way downward, and Sass pulls up snow and ice cores from sixteen
    feet down and lays them out on a foam pad for Horton to inspect. They look for
    rain layers, ice layers, and indications of other weather changes in the size
    of the ice crystals.


    Any glacier is a finely tuned indicator of climate history, and they all tell
    a sobering story. Alaska''s 100,000 glaciers cover approximately 79,000 square
    kilometers, comprising one of the largest areas of glaciation outside of Greenland
    and the Antarctic.¹On average we''re probably losing around fifty glaciers each
    year now,” Sass says. “And that number will increase if we continue business-as-usual
    emissions.”'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'After we wrap up, we head back down. From the bottom of the fork, I peer up
    at the glacier and the two rivers of ice funneling into its main body, which is
    a mass of ice 1.5 kilometers wide and 330 meters thick at its deepest. Thinking
    of all the ice that will no longer be there in the not-so-distant future boggles
    my mind.


    I was curious about the extent of glacial recession on mountains that I knew well,
    so a month after the Gulkana trip I climbed Mount Rainier the icon of my home
    state, Washington. Taking the standard route with two friends, I was taken aback
    by how much had changed since I first climbed the mountain twenty-two years earlier.
    From crevasses at 12,500 feet that would otherwise be covered so early in the
    season to glaciers that had lost over a hundred feet of thickness around ten thousand
    feet, the transformation was breathtaking. It was one thing to read scientific
    studies about the ubiquitous loss of glacial ice and quite another to witness
    it firsthand in places I''d been to before.


    While the rate of melting of the Matanuska Glacier near Marcus Baker had surprised
    me, I hadn''t anticipated how much more dramatic melting would be lower on the
    glacier.


    Later summer, I revisited the toe of the Matanuska Glacier, a couple of hours
    east/northeast of Anchorage. I used to climb the glacier at the beginning of every
    winter climbing season as part of the Mountaineering Club of Alaska’s annual ice-climbing
    festival. The glacier had been receding and thinning noticeably. The lower glacier,
    where I used to climb each year from 1996 until 2003, had changed radically. The
    left side of the glacier, now referred to as a “lobe” of ice, had stagnated next
    to the active, moving portion of the glacier, likely during one of the glacier’s
    recessions. Dark in color from collecting dirt and rock debris, the lobe was no
    longer receiving snow and ice from the main body of the glacier, and it was slowly
    melting away.


    My old photos show the lobe, but only as a thin dark layer. Now was more than
    halfway across the glacier, with one arm of it even reaching three-quarters of
    the way across the glacier, spanning the valley. It was even squeezing the opposite
    side, threatening to cut it off'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'from the toe of the glacier as well. It appeared as a blackish virus working
    its way across the white and light blue of the active glacier.


    Sass had mentioned to me that the Matanuska had thinned dramatically, as have
    most of the big land terminus glaciers around the state. Aside from the receding
    toe, the Matanuska had not shrunk in area over the last century, but as Sass put
    it, it is “deflating by losing mass.” The debris on the glacier was a sign that
    it was continuing to thin. Now was now even the potential for a big lake to form
    at its terminus.


    When it begins to retreat, Sass said, it will go fast. All or most of a glacier
    will have a dramatic impact on the ecosystems it helps to support and on the local
    weather. That’s not even to talk about the cultural, spiritual, and economic impact
    it will have. For example, in August, Alaska’s governor issued a state disaster
    declaration for the Matanuska River, which was flowing powerfully in large part
    due to meltwater from the glacier during a record-breaking warm³.³ swollen river
    threatened homes and communities downstream, and at one point, the river eroded
    fourteen feet of land in just twelve hours⁴.


    Even so, a company called Matanuska Glacier Adventures now owns the land at the
    toe of the melting glacier and is capitalizing on it. Charging $30 per person
    just to get anywhere near the glacier (and offering “tours” for $100), the company
    charges $40 to camp where other climbers and noisy camp en masse for a weekend
    of climbing in the glacier’s open crevasses.


    Now fully privatized, the area just west of the receding toe of the glacier is
    groaning with sounds of construction, large trucks, chainsaws cutting down trees,
    and bulldozers. Meanwhile, the Matanuska River flowing out of the glacier is growing
    larger than I ever seen. The entire operation is a mad dash to generate a fast
    buck as the glacier melts, even as the glacier itself feels more like an afterthought,
    darkening and receding into the background. Similar to the folly of investing
    in infrastructure along Florida’s coastlines but on a far smaller scale, large
    sums of money are spent to expand tourism infrastructure for something that is
    melting before our very eyes.'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'Sass suggested I talk with Dr. Mike Loso, a physical scientist with the Wrangell–St.
    Elias National Park and Preserve, so I arranged to speak with Loso from his home
    in the tiny remote mountain town of McCarthy, Alaska.


    Loso sees himself as a “glacial geologist” and is focused on how glaciers impact
    his landscapes. He has done substantial research in Denali National Park, Alaska’s
    Chugach Mountains, and Wrangell–St. Elias. I asked him what changes he was seeing.
    He told me that it''s easy to miss the changes if you don''t know the signs to
    look for, and that the best way understand and experience the rapid thinning of
    a glacier is visually, over time, not just through scientific studies. The retreating
    thinning of a glacier is the most obvious way to experience its recession. It
    is also common to see “bathtub rings” around Alaskan glaciers, demarcating the
    tops of steeply moraines that now cradle the sides of glaciers and, in many cases,
    run all the way up to the heads of the glaciers.


    Loso told me about the Eklutna Glacier, outside of Anchorage. There is a classic
    traverse that is popular with climbers in the region, enough so that the Mountaineering
    Club of Alaska has built three huts at the edge of the glacier for its members.
    These huts serve as a marker for where the ice used to be. “Now you get to the
    edge of the glacier,” Loso said, “and the hut is way up the mountainside, hundreds
    of feet above you.”


    Sass also spoken of the thinning of the Kahiltna, one of the largest glaciers
    in the Alaska Range. It was a glacier I spent many months on. “The Kahiltna has
    been losing loads of mass,” he told me, “and we will probably retreat dramatically
    in the coming years. Today’s climate, the Kahiltna is seeing the same kind of
    major changes throughout the glaciers in Wrangell–St. Elias. In his path, glaciers
