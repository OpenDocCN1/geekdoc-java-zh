- pgno: 11
  md: '# Introduction


    The fall lasts long enough that I have time to watch the blue ice race upward,
    eons of time compressed into glacial ice, flashing in fractions of seconds. I
    assume I''ve fallen far enough that I''ve pulled my climbing partner, Sean, into
    the crevasse with me. This is what it''s like to die in the mountains, a voice
    in my head tells me.


    Just as my mind completes that thought, the rope wrenches my climbing harness
    up. I bounce languidly up and down as the dynamic physics inherent in the rope
    play themselves out. Somehow, Sean has checked my fall while still on the surface
    of the glacier.


    I brush the snow and chunks of ice from my hair, arms, and chest and pull down
    the sleeves of my shirt. Finding my glacier glasses hanging from the pocket of
    my climbing bib, I tuck them away. I check myself for injuries and, incredibly,
    find none. Assessing my situation, I find there''s no ice nearby to ease the tension
    from the rope so Sean can begin setting up a pulley system to extract me.


    I look down.


    Nothing but blackness.


    I look at the wall of blue ice directly in front of me, take a deep breath, and
    peer up at the tiny hole into which I''d fallen when I''d punched through the
    snow bridge spanning the crevasse—the same bridge Sean had crossed without incident
    as we made our way Alaska''s Matanusuka Glacier toward Mount Marcus Baker in the
    Chugach Range.


    “You get to look down one more time, then that''s it,” I tell myself loud.


    Again, there''s only the black void yawning beneath me, swallowing everything,
    even sound. My stomach clenches. I remind myself to breathe.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '“Sean, are you okay?” I yell as I clamp my mechanical ascenders to the rope
    in preparation to climb up.


    “Yeah, I’m alright, but I’m right on the edge,” he calls back. “I can’t set an
    anchor to get out of the system, so don’t descend. We’re just gonna have to wait
    for the other guys to catch up.



    Time passes.


    The onset of hypothermia means I can’t control my body by periodically shaking.
    To ignore my fear of dying I gaze, meditatively, at the ice a few feet in front
    of me as I dangle. The miniature air pockets found in the white ice near the top
    of the glacier have long since been compressed, producing the mesmerizing beauty
    of centuries-old turquoise ice. Slightly deeper into the crevasse is ice that
    has been there since long before the Neanderthals.


    I hung suspended in silence, mindful not to move out of fear of dislodging Sean.
    Giving my full attention to the ice immediately within my vision, I focus on how
    the gently refracting light from above seems to penetrate and reflect off the
    perfectly smooth wall. Staring into it, the blue seems infinite. Despite the danger
    of my situation, the glacier’s beauty calms me.


    Delicate snowflakes, in their infinite possibilities of form, land on mountainous
    terrain. Under its own weight, the snow is compressed into glaciers that scour
    and shape the face of the Earth. Countless millions of tons of weight, aided by
    the force of gravity, push and pull these frozen rivers downhill, carving cirques
    and troughs from uplifted geologic plates and sculpting the majestic heights of
    mountains that I have been drawn to I was young.


    Eventually, our two other teammates arrive and work to extract Sean from his perch
    just six inches from the edge of the crevasse. All three of them set up a three-way
    pulley system. Laboriously, my teammates begin to haul me up, inches at a time,
    of what nearly became my tomb. I continue to focus on the delicately shifting
    shades of blue in the ice as I draw close to the surface, mesmerized by its raw
    beauty.


    My teammates pull me up to the lip of the crevasse. I repeatedly plunge the pick
    of my ice ax into the snow and haul myself out, never before as grateful for being
    on top of a glacier. I stand and gaze at'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'a mountain to the west, behind which the sun has just set. Snow plumes stream
    off one of its ridges, turned into ruddy red ribbons by the setting sun. Snowflakes
    flicker as they float into space.


    As relief floods my shivering body, I roar in gratitude and relief. Utterly overwhelmed
    by being alive and surrounded by the beauty of the mountain world, I hug each
    of my three climbing partners. Now, it sinks in just how close to death I''ve
    been.


    That was Earth Day 2003. In hindsight, I believe the emotion I felt then stemmed
    in part from something else—a deeper consciousness of the ice that I had seen,
    which shriveled for eons, was vanishing. Years of climbing in Alaska had provided
    me with a front-row seat from where I could witness the dramatic impact of human-caused
    climate disruption. Each year, we found the toe of the glacier had shriveled further.
    Each year, for the annual early season ice-climbing festival on this glacier,
    we found ourselves hiking further up the crusty frozen mud left behind by its
    rapidly retreating terminus. Each year the parking lot moved closer to the glacier
    only to be left further away as the ice withdrew. Sections of Denali, which stands
    over twenty thousand feet tall and is roughly 250 miles from the Arctic Circle,
    have undergone startling changes: the ice of its glaciers disappearing quickly.


    Our planet is rapidly changing, and what we are witnessing unlike anything that
    has occurred in human, or even geologic, history. The heat-trapping nature of
    carbon dioxide (CO₂) and methane, both greenhouse gases, has been scientific fact
    for decades, and according to NASA, “There is no question that increased levels
    of greenhouse gases must cause the Earth to warm in response.” Evidence shows
    that greenhouse gas emissions are causing the Earth to warm ten times faster than
    it should, and the ramifications of this are being felt, quite literally, throughout
    the biosphere. Oceans are warming at unprecedented rates, droughts and wildfires
    of increasing severity and frequency are altering frosts around the globe, and
    the Earth’s cryosphere—the parts of the Earth so cold that water is frozen into
    ice or snow—is melting at an ever-accelerating rate. The subsea permafrost in
    the Arctic is thawing, and we could experience a'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'methane “burp” of previously trapped gas at any moment, causing the equivalent
    of several times the total amount of CO₂ humans have emitted to be released into
    the atmosphere. The results would be catastrophic.


    Climate disruption brings with it extreme weather, too, such as hurricanes and
    floods. For instance, a warmer atmosphere holds more moisture, leading to an increase
    in the frequency of severe rain events, such as Hurricane Harvey over Houston
    during the summer of 2017, which dropped so much rain that the weight of the water
    actually caused the Earth’s crust to sink two centimeters.³


    Earth has not seen current atmospheric CO₂ levels since the Pliocene, 3 million
    years ago. Three-quarters of CO₂ will still be here in five hundred years. Given
    that it takes a decade to experience the full warming effects of CO₂ emissions,
    we are still far away from experiencing the impact of all the CO₂ that we are
    currently emitting⁴ Even if we stopped all greenhouse gas emissions, it would
    take another 25,000 years for most of what is currently in the atmosphere to be
    absorbed into the oceans. Climate disruption is progressing faster than ever,
    and faster than predicted. Seventeen of the eighteen hottest years ever recorded
    have occurred since the year 2001¹. The distress signals from our overheated planet
    are all around us, with reports, studies, and warnings increasing daily. Every
    single worst-case prediction made by the Intergovernmental Panel on Climate Change
    (IPCC) about the rise in temperatures, extreme weather, sea levels, and the increasing
    CO₂ content in the atmosphere have fallen short of reality. Countless glaciers,
    rivers, lakes, forests, and species are already vanishing at a pace never seen
    before, and all of this increasing the global mean temperature by “only” 1°C above
    preindustrial baseline temperatures. According to some scientists, it could rise
    as much as 10°C by the year 2100,⁶


    A study by James Hansen, the former director of NASA’s Goddard Institute for Space
    Studies, warned that even staying within a 2°C temperature-warming limit has caused
    unstoppable melting in both the Antarctic and Greenland ice sheets. This will
    raise global sea levels by as much as ten feet by the year 2050, inundating numerous'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'major coastal cities with seawater.7 New York, Boston, Miami, Tampa, New Orleans,
    Jakarta, Singapore, Osaka, Tokyo, Mumbai, Kolkata, Dhaka, and Ho Chi Minh City
    are only a few examples of cities that will, sooner or later, have to be moved
    or abandoned to the sea.


    Mountaineering in today''s climate-disrupted world is a vastly different endeavor
    than it used to be. Glaciers are vanishing before our eyes, shrinking to the lowest
    levels ever recorded, and they are now melting faster than ever. In North America,
    70 percent of the glaciers in western Canada are projected to be gone by 2100.8
    Montana''s Glacier National Park will most likely not have any active glaciers
    by 2030. The Matanuska Glacier''s ancient ice is, by, rapidly vanishing. Dramatic
    changes are occurring even in the planet''s highest and coldest places. Even Mount
    Everest (Sagarmatha/Chomolungma) is transforming, as thousands of glaciers across
    the Himalayas will likely shrink up to 99 percent by 2100.9 A child born today
    will see Everest free of glaciers within her lifetime.


    Before embarking on this book, I already knew the extent to which human-caused
    climate disruption had advanced. I had lived in Alaska for a decade beginning
    in 1996 and spent time on the glaciers there. As early as the late nineties, large
    portions of the holiday season would go by in Anchorage without any snow on the
    ground, the waterfalls barely froze some winters, and we could see the glaciers
    we used to traverse to ice climbing my climbing friends and I used for access
    peaks shrinking from year to year. I wasn''t aware of what was happening in the
    oceans and the rain forests. I wasn''t aware of the rise in sea levels and the
    changing climate''s impact on biodiversity.


    I started reporting on the environment and climate in 2010, and since then I''ve
    published more than one hundred articles about climate disruption and given many
    lectures and radio interviews on the subject. This work established the foundation
    of my research, so by the time I began my field research for this book, I knew
    what to expect: that humans had already altered planetary climate systems. That
    is why, rather than the more commonly used “climate change,” I'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'prefer to use the term “anthropogenic (human-caused) climate disruption.” Without
    question, the human race is responsible.


    My original aim with this book was to provide a view of what was happening around
    the world: from the heights of Denali to the Great Barrier Reef; from the remote,
    windswept islands in the Bering Sea to the Florida coast. I wanted to explore
    how the forests across the western United States were impacted by drought and
    wildfire and investigate what was happening to the Amazon, the largest rain forest
    on Earth. Knowing that most people will likely never visit of these places, I
    hoped to bring home to the reader the urgency of our planetary crisis through
    firsthand accounts of what is happening to the glaciers, wildlife, coral reefs,
    and oceans, alongside data provided by leading scientists who study them.


    The reporting in this book has turned out to be far more difficult to deal with
    the years I spent reporting from war-torn Iraq. But I have to realize that only
    by sharing an intimacy with these places can we begin to know, perhaps love, and
    certainly care for them. Only by having this intimacy with the natural world can
    we fully understand how dramatically our actions are impacting.


    In Nepal, the sacred mountain Machhapuchchhre rises abruptly on the eastern boundary
    of the Annapurna Sanctuary. As a child, I came across a photograph of this peak
    in a geography textbook and was immediately captivated by its majesty. Shaped
    like a fish''s tail, the knife-edge ridge that forms its summit is a seemingly
    paper-thin line of rock that drops precipitously on either side, causing the apex
    of the peak, which is nearly half a mile higher than the top of Denali, to be
    one of the most dramatic summits anywhere.


    The Nepali believe Machhapuchchhre is sacred to Shiva, one of the primary deities
    of Hinduism, who is known as both “the Destroyer” and “the Transformer” and believed
    to be without form—limitless, transcendent, and eternally unchanging. The mountain
    is forbidden to climbers, and to day no human has ever stopt that summit. I believe
    this is a just decision, and I have always wished more parts of Earth could be
    placed out of human reach.'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'Staring at that picture as a youth, time would cease to exist. I fell in love
    with Machhapuchchhre, and in the process I became raptured with all mountains.
    When I was ten years old, I saw the Rocky Mountains of Colorado for the first
    time, their silhouettes against the setting sun, and I was awestruck. In the fall
    of 1995, I traveled to Alaska and drove a short way into Denali National Park
    and Preserve. When the afternoon clouds parted to reveal the majesty of Denali''s
    summit, my first inclination was to bow. A year later I traveled to Alaska and
    trained myself in the mountaineering skills needed to access these sanctuaries
    that stand far from the violence, speed, and greed of my increasingly dystopian
    industrial society. The Scottish American author, author, philosopher, and early
    preservation advocate John Muir captured my feelings precisely: "I am losing precious
    days. I am degenerating into a machine for making money. I am learning nothing
    in this trivial world of men. I must break away and get out into the mountains
    to learn the news."


    A glacier is essentially suspended energy, suspended force. It is time, in that
    sense, life, frozen in time. But now, these frozen rivers of time are themselves
    running out of time. The planet''s ecosystems, now pushed beyond their capacity
    to adapt to human-generated traumas and stresses, are in a state of free fall.
    Similar to how I watched hundreds of years of time compressed into glacial ice
    flash before my eyes in a matter of seconds as I fell into the crevasse, Earth''s
    species, glaciers, rivers, lakes, and forests are in the blink of a geologic age,
    falling into oblivion.


    Modern life has compressed time and space. Through air travel or instantaneous
    communication and access to information you can traverse the globe in a matter
    of hours or gain knowledge nanoseconds after a question is posed. The price for
    this, along with everything we want, on demand, all the time, is a total disconnection
    from the planet that sustains our lives.


    I ventured into the wilds and into the mountains in large part to allow space
    and to stretch themselves back to what they were. The frantic pace of contemporary
    life is having a devastating impact on this planet. Humans have transformed more
    than half the ice-free'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'land on Earth. We have changed the composition of the atmosphere and the chemistry
    of the oceans from which we came. We now use more than half the planet’s readily
    accessible freshwater runoff, and the majority of the world’s major rivers have
    been either dammed or diverted.


    As a species, we now hang over the abyss of a geoengineered future we have created
    for ourselves. At our insistence, our voracious appetite is consuming nature itself.
    We have refused to heed the warnings Earth has been sending, and there is no rescue
    team on its way.'
  merge: -1
  img_proc: true
