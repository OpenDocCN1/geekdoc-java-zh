  md: '# The End at the Top of the World


    July 28, 2017. The calm gray water of the sea fades in and out of the fog. Waves
    lap softly on the gravel beach as I hear the cries of seagulls, invisible in the
    fog. A figure appears in the distance, walking along the beach, then vanishes.
    Everything feels ephemeral as I take a morning walk along the shore of the Arctic
    Ocean. The only thing that is a constant is the shore beneath my boots and the
    crunching sound of the tiny stones as I walk. Up here, only thirteen hundred miles
    from the North Pole, in the summer when the sun never sets, time stretches until
    it loses its meaning.


    The fog rises. Low clouds scud to the west, coloring the tundra a brownish green.
    Occasionally, patches of light shift across the landscape. It is otherworldly,
    timeless.

    Utqagvik (formerly known as Barrow), one of several ancient villages in the area,
    is the northernmost incorporated point in the United States. The indigenous people,
    the Inupiat, have learned to live on the edge of the tundra and the seas, with
    the whales, the birds, and the ice floes. While the precise meaning of “Utqagvik”
    can be the subject of some debate, a sign in the town near the buried remains
    of the original ancient village site it means “a place where snow owls are hunted.”
    It is estimated that people settled anywhere between fifteen hundred to four thousand
    years ago, according to the same sign, primarily to hunt the bowhead whale, which
    appears as the village’s insignia. Similar to the Unangan of St. Paul and other
    indigenous cultures, hunting and gathering is what binds friends, family, and
    community together and informs their spiritual traditions.'
