    to topple large healthy trees. She has also seen a decline in deciduous trees,
    such as birch and aspen, and a lowering of the water table due to less rain, which
    has also impacted the health of the forests. Conifers, for example, are dependent
    on larger amounts of precipitation during the spring and fall, which is when they
    grow, they are no longer getting the water they need at the right time, which
    leaves them more susceptible to drought, fire, and bugs.


