    Dr. Ben Kirtman is one of the leading sea level experts in the world. The program
    director for the Climate and Environmental Hazards program at the University of
    Miami’s Center for Computational Science, Kirtman is also a coordinating lead
    author of the Intergovernmental Panel on Climate Change’s (IPCC) Fifth Assessment
    Report.


    We meet in his office on the University of Miami’s Virginia Key campus, just over
    the Rickenbacker Causeway from downtown Miami. Spry and full of energy, Kirtman
    is wearing an aqua-blue short-sleeve University of Miami shirt and blue jeans.
    He smiles and talks usually until we get into the specifics of the global rise
    in sea levels.


    There are four primary reasons why sea levels change. The land may sink, and Kirtman
    points to the affluent Miami Beach as an example, saying that it “is basically
    built on landfill, so that land is compacting over time.” Another reason is the
    thermal expansion of the oceans. When you heat water it expands, and this is occurring
    on a global level. There are localized effects, such as the freshwater that will
    enter the sea from Greenland as it melts, which could ultimately contribute over
    twenty feet to global sea levels by itself. The fourth reason is the impact of
    climate disruption on ocean circulation. Ocean circulation patterns make Greenland
    a particular cause for concern in Florida, as the freshwater influx, on top of
    contributing to rise in sea levels itself, will weaken the Gulf Stream, which
    will also cause sea levels to rise along the eastern coast of the United States.


    According to Kirtman, projections indicate that by 2030 the current sea levels
    will rise by half a foot to one foot, depending on variables such as the quantity
    of freshwater that will enter the oceans and how much the oceans warm. He reiterates
