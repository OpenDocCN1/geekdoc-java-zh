    Shortly after my first meeting with Lovejoy, we’d taken a short boat tour of the
    mighty Amazon River. He spoke in wonder of the pink and gray dolphins, the manatees,
    and the anacondas, some of which grow up to forty-three feet long and have swallowed
    horses and large alligators. The thick, soft air felt as we headed to the “meeting
    of the waters,” where the brown waters of the Amazon run side by side with the
    black acidic waters of the Rio Negro.


    A short while later, our boat pulled up to a floating village where we walked
    onto a creaky boardwalk and into the jungle. Lovejoy pointed out a giant Amazon
    water lily. This plant is pollinated when the bud of its flower rises and opens
    during the day. It exudes a scent that attracts a particular beetle, which gets
    inside when the flower closes for the night. The beetles eat and are covered by
    pollen then move on to another flower the following day. The lilies are spiny
    at the bottom, which prevents manatees from munching on them, and they are strong
    enough to support sixty pounds of weight on each of their pads. According to Lovejoy,
    the design of many of the buildings of the industrialized world are based on the
    structure of these lilies, a perfect example of biomimicry. He pointed this out
    as just one example of how much more tied we are to nature than most people.


    As we retraced our steps along the boardwalk, hawks, macaws, and various birds
    flew in raucous chorus. Overhead, branches were thrashed by spider monkeys that
    jumped and swung through the trees, knocking free fruits that dropped into the
    water below.


    Lovejoy opened my eyes, my mind, and my heart to the impact of climate disruption
    on Earth’s biodiversity. As scientists and journalists, we are trained to focus
    on physical measurements: the concentration of carbon dioxide, the rise in sea
    levels, the increase in temperature. But what about the profound effect these
    changes have on the intricately woven web of life? Why does it matter if human
    indulgence extinguishes another species? What does the loss of a Malagasy rainbow
    frog or an oyster or a jabiru mean to us? It could'
