    The people who live here, the Unangan (now more commonly known as the Aleut),
    are said to live in the middle of nowhere. But they themselves see it quite differently.
    They see themselves as living in the middle of it all, given their intimate ties
    to the sea, the land, the birds, the fish, and most of all to the northern seal.


    Just before flying to St. Paul from Anchorage, I met with Bruce Wright, a senior
    scientist with the Aleutian Pribilof Islands Association (APIA). Wright has worked
    for the National Marine Fisheries Service and was a section chief for the National
    Oceanic and Atmospheric Administration (NOAA) for eleven years.


    From my research, I knew how profoundly oceans and marine life in Alaska were.
    Not only had the seal population declined dramatically, but the previous winter
    had seen major de-offs of tens of thousands of seabirds. Bruce was the person
    to talk to if you wanted to understand more specifically what was happening.


    Wearing jeans and a Hawaiian shirt, Wright’s casual attire contrasted with the
    formal meeting room in the APIA building where we met, with its massive polished
    wooden table and plush leather chairs.


    Wright wasted no time in cutting to the chase: “By 1975, the water in the Gulf
    of Alaska had already warmed up 2°C, and we did not understand what was going
    on,” he said, speaking of when he used to work with the Alaska Department of Fish
    and Game. By 1978, the entire Gulf of Alaska biological system shifted from a
    shellfish-dominated system to one that was dominated by cod, halibut, polock,
    and flounder, and the shift occurred really fast.” Wright nor anyone else in the
    Alaska Fish and Game Department understood what was going on. “So we shut down
    the fisheries to protect what was left,” he said.'
