- pgno: 26
  md: 'Unseasonably warm temperatures in Talkeetna persisted, our patrol prepared
    to fly onto Denali to begin our patrol the next day. The engine of our ski plane,
    loaded down with climbers and hundreds of pounds of gear, roared at high pitch
    the plane lifted off the airstrip and lumbered its way into the air. The wings
    dropped to the right, aiming us straight for the great white giant that dominates
    the northern skyline. As the plane bobbed laboriously toward the hulking mass,
    my body shifted side to side in the seat in the mild turbulence. My soul found
    more sense to center. Once, all was right in the world and everything made sense
    as we flew into the heart of the Alaska Range that loomed above us the distance.


    Mountains are where I go to listen to the Earth. That was the case when I very
    first began mountaineering in Alaska in 1996. Love was at first sight with Denali,
    and I moved to Alaska, spending months climbing, guiding, and later volunteering
    for the NPS. My love of mountaineering took me from Denali to Aconcagua in Argentina,
    the highest point in the Western Hemisphere, to the highest volcanoes in Mexico,
    as well as Bro Peak in Pakistan. Climbing became my religion, but through it all,
    my heart always remained in the Alaska Range, and on Denali in particular. In
    2003, the Iraq war pulled me away from the mountains. I began working as freelance
    journalist, documenting the plight of the Iraqi people under the brutal U.S. occupation
    of that country. One trip turned into found me spending more than one year in
    that country over the next decade. I fell in love with the Iraqi people and their
    culture just as I''d fallen in love with the mountains. Hundreds of articles and
    lectures, three books, and thousands of radio and television interviews later,
    I became an expert on the world and U.S. foreign policy in the Middle East and
    I formed deep personal friendships with several of my translators there. After
    that, I covered the BP oil disaster in the Gulf of Mexico in 2010, bringing me
    into environmental reporting, and wrote feature stories for Al Jazeera English
    in Doha, Qatar. In 2013, I moved to Washington State to reestablish my connection
    to the mountains. I had known all the while that I wanted to learn about what
    was happening to the planet. I had wanted to understand the depths of the climate
    crisis.'
