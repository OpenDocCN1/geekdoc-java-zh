  md: '# Conclusion: Presence


    You cannot always stay on the summits. You have to come down again ... So what’s
    the point? Only this: what is above knows what, what is below does not know what
    is above ... There is an art to finding your way in the lower regions by the memory
    of what you have seen when you were higher up. When you can no longer see, you
    can at least still know.


    > —René Daumal, Mount Analogue†


    June 18, 2016, 17,200’ camp, Denali. Our time on Denali is coming to an end. We
    are at high camp, 17,200 feet above sea level. During the few days we spent preparing
    to ascend to the summit, we reinforce our tents, dig out of the tent pits, and
    allow our bodies to adjust to the altitude.


    But during our first night at high camp, Liam, the doctor on our patrol, and Sue,
    a nurse and fiancée of Mik, our ranger, saved the life of a descending climber
    who was stricken with high-altitude pulmonary edema. Their efforts got him through
    the night, and Mik arranged to have the high-altitude helicopter arrive in time
    to rescue the climber, whisking him to lower elevations as the first winds of
    the approaching storm began to strafe the barren camp.


    Sleep that next night was fitful as gusts buffeted the tent walls. Snow began
    to slowly fill the pit in which our tent was pitched. The next morning Liam and
    Brian, the other member of our patrol, chose to descend to 14,200’ camp to ride
    out the storm as Mik, Sue, and I hunkered down. Much of that day was spent maintaining
    and again reinforcing our tents and the walls around them as the storm’s ferocity
    built.'
