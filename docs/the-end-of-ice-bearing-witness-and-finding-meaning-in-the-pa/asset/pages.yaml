  md: 'Shults and her husband have a photography business that involves taking birds
    to the coast and tundra. She tells me they are finding more and more birds “off
    course” and that their arrival and departure timings are changing. Snow buntings
    are arriving earlier, and she notes the recent sighting of a Eurasian brambling,
    which isn''t even listed on the checklist given to birds coming to town. The red-breasted
    nuthatch, while common in Anchorage, is now in Utqiapvik, even though “they are
    not supposed to be here, nor are the merlin hawks, which used to use only as far
    north as Fairbanks.” She has hummingbirds, which were previously only found far
    north as Anchorage.


    After meeting with Shults, I went to walk to the search-and-rescue building, which
    doubles as a clubhouse. Native men walk in and out sharing stories over coffee.
    Some play card games while others watch television. I meet fifty-five-year-old
    Marvin Kanayorak, who was born and raised here, as his parents. He is a whaler
    and volunteers rescues. He tells me how there used to be pressure ridges in the
    sea ice (formed when two ice floes are forced together) during the winter that
    we were fifty, even sixty feet high, but now they are “lucky” to find twenty-foot
    tall ridges. Heading out across the ice to find water in the spring used to take
    them two weeks of plotting and making a trail. Now it takes them only a couple
    of days because the open water is so much closer.


    We used to have icebergs that were three stories high. You could hear the booms
    and cracks of them hitting and moving through the ice,” Kanayorak says. “That
    doesn’t happen anymore, and we don’t have icebergs in the fall like we used to
    either.” An old-timer sitting with us chills and tells me to come back in January
    because then I’ll still be able to see open water, albeit with slush, right offshore.


    The stories of dramatic changes seem endless. There used to be polar bears on
    the beaches, but not any longer. Less ice means there is more open water for winds
    to generate larger waves, which means rougher waters for whaling, but instead
    of using eighteen-foot boats, they’ve shifted to using boats between twenty and
    twenty-six feet long to handle the rougher seas. Thinner ice also means they can’t'
