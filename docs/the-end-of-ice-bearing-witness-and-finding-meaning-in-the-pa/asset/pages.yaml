    Directly related to this is the Atlantic Meridional Overturning Circulation (AMOC),
    a massive complex grouping of water currents that move warm water from the tropics
    northward, from the Atlantic toward the Arctic. The AMOC plays a critical role
    in creating the mild climate of the United Kingdom and other parts of Western
    Europe. Without the AMOC, much of that part of the world could even plunge into
    an ice age. One has even warned that this current could potentially collapse within
    the next three hundred years due to the changes human''s fossil fuel emissions
    already caused across the Arctic.43


    Given that the AMOC is deeply tied to the global oceanic conveyor system, which
    transports warm and cold currents between the tropics and the North and South
    Poles, a dramatic shift in the current would also have a heavy impact on the Atlantic
    tropics. This region would see a strong warming pattern south of the tropics,
    which would cause a dramatic shift in precipitation patterns across Central America
    and Brazil. For example, northeastern Brazil would see far more rain, while Central
    American countries would see far less rain. Scientific studies have predicted
    changes in the AMOC would bring a dramatic reduction in sea ice across the Antarctic,
