  md: 'connected to my sorrow for what is happening, as well as to honor her.


    We are already facing mass extinction. There is no removing the heat we have introduced
    into the oceans, nor the 40 billion tons of carbon dioxide we pump into the atmosphere
    every single year. There may be no changing what is happening, and far worse things
    are coming. How, then, shall we meet this?


    “The question is not we are going to fail. The question is how,” author and storyteller
    Stephen Jenkins, who has worked in palliative care for decades, states. “The question
    is, What shall be the manner of our inability to care for what was entrusted to
    us? The question is our manner of failing.” Jenkinson, who now makes his living
    by teaching about grief and the acceptance of death as an integral part of living,
    spoke eloquently about grief and climate disruption during a lecture he gave to
    Simon Fraser University in Vancouver, Canada. When he is, he is also saying that
    the time to change for what is entrusted to us, our ways are long past. “Grief
    requires us to know the time we''re in,” Jenkinson continues. “The great enemy
    of grief is hope. Hope is the four-letter word for people who are willing to know
    things for what they are. Our time requires us to be hope-free. To burn through
    the false choice of being hopeful and hopeless. They are two sides of the same
    con job. Grief is required to proceed.”


    Each time another scientific study is released showing yet another acceleration
    of the loss of ice atop the Arctic Ocean, or sea level projections are stepped
    up yet again, or news of another species that have extinct is announced, my heart
    breaks for what we have done and are doing to the planet. I grieve, yet this ongoing
    process has become more like peeling back the layers of an onion—there is always
    more work to do as the crisis we have created for ourselves continues to unfold.
    And somewhere along the line I surrendered my attachment to results that might
    stem from my work. I am hope-free.


    A willingness to live without hope allows me to accept the heartbreaking truth
    of our situation, however calamitous it is. Grie for what is happening to the
    planet also now brings me'
