- pgno: 167
  md: 'Research scientist Dr. Charles Miller of NASA’s Jet Propulsion Laboratory was
    the principal investigator of the Carbon in Arctic Reservoirs Vulnerability Experiment
    (CARVE), a five-year NASA-led field campaign to study how climate change is affecting
    the Arctic’s carbon cycle. He told NASA, “Permafrost soils are warming faster
    than Arctic air temperatures—as much as 2.7 to 4.5 degrees Fahrenheit (1.5 to
    2.5 degrees Celsius) in just the past 30 years. As heat from Earth’s surface penetrates
    into permafrost, it threatens to release these organic carbon reservoirs and release
    them into the atmosphere as carbon dioxide and methane ... greatly exacerbating
    global warming.”10


    Estimates of how much carbon will be released by thawing permafrost show that
    it could average around 1.5 billion tons annually, which is roughly the same amount
    as the current U.S. annual emissions from burning fossil fuels.11 Dr. Kevin Schaefer,
    a research scientist for the NSIDC who studies permafrost carbon feedback (PCF),
    says the warming of the surface of the planet that would result from the release
    of carbon from the permafrost, estimates that PCF by itself will increase temperatures
    by 0.2°C by 2100, and even more beyond that. This means PCF will have a significant
    effect on the long-term climate, even if the goal of limiting atmospheric temperatures
    to 2°C were reached.


    Schafer linked the sudden warming of the Paleocene-Eocene Thermal Maximum (PETM)
    “55 million years ago to carbon dioxide and methane released from thawing permafrost
    in Antarctica.”12 What drove the PETM is essentially what we are seeing today:
    a massive amount of carbon dioxide injected into the atmosphere that brought about
    an increase in global temperatures of 5°C within a few thousand years, although
    in our case it could happen much faster.


    I speak in Utqagvik with Dr. Vladimir Romanovsky, a professor of geophysics in
    permafrost at the University of Alaska–Fairbanks who also specializes has been
    collecting temperature data each year in many locations around the world, but
    mostly across Alaska, Canada, and Russia.'
