- pgno: 224
  md: '# About the Author


    Dahr Jamail, journalist and former war reporter, is the author of Beyond the Green
    Zone: Dispatches from an Unembedded Journalist in Occupied Iraq, The Will to Resist:
    Soldiers Who Refuse to Fight in Iraq and Afghanistan, and The Mass Destruction
    of Iraq: Disintegration of a Nation (co-authored with William Rivers Pitt). Jamail
    spent more than a year reporting from Iraq, as well as from Lebanon, Syria, Jordan,
    and Turkey over the past fifteen years. Also an accomplished mountaineer who has
    worked as a volunteer rescue ranger on Denali, he won the Martha Gellhorn Prize
    for Journalism and is a 2018 winner of the Izzy Award for excellence in independent
    journalism. Jamail is also the recipient of the James Aronson Award for Social
    Justice Journalism, the Joe A. Callaway Award for Civic Courage, and five Project
    Censored Awards.'
  merge: -1
  img_proc: true
