- pgno: 27
  md: 'Now, thirteen years after I''d left Alaska, and with much water under the proverbial
    bridge, my eyes were once again transfixed on the glacier-clad, exquisitely corniced
    ridges and spires that guard the southern boundary of the Alaska Range.


    The forty-minute flight ended as the plane landed gently on the snow-covered glacier
    basecamp. It felt like coming back home to meet a long-lost close friend. Yet,
    while it was a return to a place near and dear to my heart, the visible and dramatic
    changes since 2003 were immediately obvious. To the west of basecamp, Mount Cross,
    a 12,352-foot glacier-clad peak that rises from the main body of Denali''s Kahiltna
    Glacier, had far less glacier and snow coverage over the route that I''d ascended
    in 2003. At that time, only the lower quarter of the ridge route had been partially
    uncovered by snow or ice. Now, recently exposed dirt and rock on that section
    had begun to blow across snow, leaving a black swath painted across the whiteness
    just north of ridge; three-quarters of the route was largely free of ice.


    In Talketna, every single mountaineering ranger I crossed paths with spoke about
    how hot it had been during recent years. On the mountain, I heard a steady stream
    of similar anecdotes from rangers and climbers alike.


    Mount Hunter, a shorter (14,573 feet) yet far more technically challenging peak
    than Denali, stands directly above Denali basecamp. A team was going to attempt
    the peak but abandoned their climb when they found water running down the top
    portion of their route, which typically should have been frozen solid. Across
    basecamp from Hunter, the south face of Mount Francis (10,450 feet) had notably
    snow and ice covered to when I''d been here. Mik saw gazing at it and said, "Less
    snow and ice coverage too than usual. Plus, the last few years we''ve actually
    had mosquitoes at basecamp."


    I stood silently, taking in what my eyes and Mik were telling me. The sounds of
    climbers talking and laughing across the bustling basecamp filled the background
    as I looked up at the turquoise hanging glaciers covering the northwest face of
    Mount Hunter. Given the ever-accelerating rate of planetary warming, it was only
    a matter'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'of time until they melted away and left that grand, sheer rock face exposed.


    My eyes studied the other glacier-clad peaks around Denali basecamp. Even the
    lower flanks of the towering mass of Mount Foraker, a 17,402-foot giant and the
    second-highest peak in the Alaska Range, which rose abruptly across the Kahiltna
    Glacier, showed signs of loss. It was difficult for me to fathom that even the
    Alaska Range was melting, and rapidly at that.


    There has been evidence of dramatic climate shifts in front of all of us for decades.
    Most people in the so-called developed world are not connected enough to a place
    on the planet to notice. They are unaware of the dire ramifications of what this
    means, both for the planet and our species. Those of us who spend time in nature,
    whether as a climber, gardener, backpacker, herbalist, fisherman, or hunter, we
    have our own version of what Aldo Leopold referred to as an “ecological education.”
    We are acutely aware of the changes already upon us.


    “One of the penalties of an ecological education is that one lives alone in a
    world of worlds,” wrote Leopold. “An ecologist must either harden his shell and
    make believe that the consequences of science are no business of his, or he must
    be the doctor who sees the marks of death in a community that believes itself
    well and does not want to be told otherwise.”¹


    Becoming aware of the wounds of climate disruption has caused to the mountains
    and glaciers I have come to cherish over the years like watching a dear friend
    struggling with a terminal illness. What I was witnessing firsthand on Denali
    and what I had learned from the climbing community and the steady stream of scientific
    studies about the rapid glacial melt rates around the globe were overwhelming.
    While working on this book, I would grow accustomed to hearing about the effects
    of rapid climate disruption. The more intimacy you have with a special place,
    the harder it is to take in its implications.


    As rapidly as global temperatures are increasing, so are temperature predictions.
    The conservative International Energy Agency has predicted a possible worst-case
    scenario of a 3.5°C increase by 2035.² That would be wrote a 412 percent temperature
    increase'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'in less than two decades. A World Bank–commissioned report warned that we are
    on “track to a ‘4°C world’ marked by extreme heat waves and life-threatening sea
    level rise.”³ Leading climate researchers believe there is a possibility that
    the world will even see a more than 6°C temperature increase by 2100, which would
    lead to “cataclysmic changes” and “unimaginable consequences” for human civilization.⁴


    The implications of a temperature increase of 4 to 6°C for glaciers and ice fields
    are dire, given that the planet has warmed “only” 1°C above preindustrial baseline
    temperatures and the melting we are already seeing is so profound.


    It had been thirteen years since I''d last been on Denali yet it felt like I had
    never left it all. Such is the enduring nature of mountains, their sublime agelessness
    immediately apparent to me when I stepped back onto slopes. This was despite the
    changes in my own life, yet this time the changes across Denali’s heights were
    obvious and impossible to miss.


    The first snowstorm hit when we reached 7,800’ camp. The five of us huddled in
    the kitchen tent, drinking tea and sharing stories. Mik told us of how during
    during the 2013 climbing season, the NPS had opted to fly mountaineering rangers
    from 11,200’ camp to 14,200’ camp due to frequent rockfall at Windy Corner at
    13,200 feet. That same year saw rock fall on a section of Denali known as “the
    Autobahn” (a portion of the standard route from 17,200 feet to 18,200 feet) for
    the first time in recorded history, and lightning near the summit ridge, another
    first.


    The next day we moved, in total whiteout conditions, up to 11,200’ camp, literally
    skiing through the clouds. Whatever I had of the world below dissolved in the
    exertion and the rhythm of my breathing. All that mattered was keeping a good
    pace, then staying fed, and warm during the few short breaks we took. After pitching
    camp on arrival, another storm hit, keeping us pinned down. But this time the
    snow was wet.


    “This is a new thing here,” Mik said as we stood outside watching the winds raking
    snow off the West Butt that towered above camp. “Wet snow this high up on the
    mountain, I’ve never seen this'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'before. I never used to bring a Gore-Tex rain jacket here, but now we need
    one."


    That evening, I wrote in my journal, processing each piece of bad news about the
    mountain. I wrote about my sadness but also about my determination to keep on
    returning to Denali with my body no longer allowed. I wanted time in this place,
    on this mountain that will always stand as a sentry, a sanctuary, a guide, and
    a beacon to me.


    I''m far from alone in this, a seasonal ranger in addition to living and working
    in the Tetons of Wyoming. He and others like him are certainly not doing what
    they do in order to get rich. Those of us who choose to submit ourselves to the
    physical and mental rigors of mountaineering do so out of love for these wild
    places. There is now, also, an added draw to be with Denali: it''s like wanting
    to be at the bedside of an ailing friend, wanting to share time with them while
    we are all here here.


    Where would I be if I couldn''t come to this place, and others like it? It is
    the closest thing I have to a church in my life; each camp is an altar, each summit
    a sanctuary I can give homage to the Earth.


    After three days at 11,200'', we broke camp and skied to 14,200'' camp. After
    the steep climb, the route levels off into a more gradual ascent in an area referred
    to as the “Pole Field.” Just atop that is Windy Corner at 13,200 feet, where we
    donned our helmets for potential rockfall before quickly skiing around the exposed
    section of the route, then continued on to the next camp.


    The camp was situated in the middle of a glacial shelf, with the summit looming
    more than one vertical mile directly above. The high winds that had persisted
    for most of our first week on the mountain were blowing long white streamers of
    snow from the summit ridge.


    The patrols were staggered week apart with the aim of one replacing another as
    we slowly moved up the mountain. We were'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'given a warm welcome to camp by the patrol that will soon move up to high camp
    before pitching our tents and settling in. We would be staying here at least a
    week to give our bodies time to acclimatize to the higher altitude before moving
    further up the mountain. Other teams were also taking time here to acclimatize
    and watch the weather for a window within which to make a summit bid.


    The winds continued up high. Attempts to reach the summit were few and between.
    A couple of days after we settled into camp, our patrol swung into action supporting
    a helicopter rescue from high on the mountain. A Japanese team had reached the
    summit in high winds, but one of the climbers collapsed on the way back down to
    high camp. By the time the helicopter managed to dangle the rescue basket the
    team at 18,400 feet, it was immediately clear to the pilot and the ranger riding
    with him that the rescue had turned into a body recovery.


    After witnessing the rush of activity and an unsuccessful attempt by one of the
    patrol volunteers to resuscitate the climber, I spent the rest of the day on my,
    walking around camp, gazing out at Mount Hunter and Mount Foraker. While it was
    clear the climber ignored the warning signs of altitude sickness and made some
    other mistakes, it was always a tragedy when someone died up here. I felt the
    grief that comes with the loss of any life.


    Later, though, I wondered why I had been so emotionally affected by the death
    of someone I never knew. I hadn''t been the volunteer giving CPR, nor had I directly
    involved in the rescue. Yet I was mourning, and I wanted to be alone.


    That evening, sitting in my tent, I wrote in my journal. I realized that the death
    of the Japanese climber opened something else in me. I began to feel the deep
    toll climate disruption was taking on Denali. The glaciers were melting underneath
    my skis, my crampons, and my ice ax. I could feel the cataclysmic impact of the
    human race’s industrial-scale consumerism on the Earth. We had defiled the biosphere
    and we were past the point of no return.'
