    # The Coming Atlantis


    May 13, 2017. Looking out across the vastness of Florida Bay from the Flamingo
    Visitor Center in Everglades National Park is humbling. A seemingly infinite number
    of small green tufts appear as if they are floating atop bluish-green waters that
    are no more than eight feet deep between the mainland and the islands.


    Pelican Keys, Crab Keys, Oyster Keys, Shell Key, Eagle Key, Whaleback Keys, Crane
    Keys, Man of War Key, and the shores of this southernmost point of Florida’s mainland
    are well visited—not so much by humans but by roseate spoonbills, wood sticks,
    tricolored heron, sandhill cranes, barn and burrowing owls, raptors, seabirds,
    river outlets, and manates.


    There is no other land/seascape like the Everglades in the world. It is a synergy
    of worlds, where tropical and temperate species from the Caribbean and North America
    meet and flourish. The entire park is one massive subtropical wetland, the only
    of its kind in the United States. It is part of the Kissimmee–Lake Okeechobee–Everglades
    watershed, a giant drainage basin covering an area of approximately 11,000 square
    miles. The Everglades is comprised of sawgrass prairies, forests, marshes, mangroves,
    cypress, and pine rocks and is home to hundreds of species of birds, with mammals,
    fish, and plenty of reptiles, including alligators and crocodiles.


    Backcountry enthusiasts use kayaks and canoes to paddle along the coasts and into
    Florida Bay to camp on “chickees,” where they pitch their tents atop wooden platforms.
    Along the waterway that runs north to south along the Gulf Coast of the Everglades,
    it is possible to paddle around one hundred miles without ever seeing a road.'
