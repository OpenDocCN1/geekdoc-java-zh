    The weight of his years underscores all of the scientists that have told me. “It’s
    all changing,” he says. “Some people from the lower forty-eight and the rest of
    the world are worrying about us, but I don’t know why, because we are not worried.
    We know this is happening. People before me were telling us this was going to
    happen. They knew. I don’t know how they knew, but they knew. I listened to them.
    Then it started to happen. And now, I just know it’s happening, and I don’t think
    it’s going to stop.”


    While I was in Utqiavik, I decided to go walking along the coast to where the
    Chukchi and Beaufort Seas meet. I walked for five hours. I couldn’t stop. As I
