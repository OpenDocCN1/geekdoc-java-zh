  md: 'Stan Rushworth is an elder of Cherokee descent who has taught Native American
    literature and critical thinking classes focused on Indigenous perspectives for
    more than a quarter of a century. Recently he told me a story about his father,
    a veterinarian who worked closely with University of California, Davis, Rushworth
    described his father as an excellent diagnostician and scientist, who told him
    back in the 1980s, long before we knew everything we know about climate disruption
    today, that he thought we "soiled our bed" past the point of no return in regards
    to what we had done to the Earth.


    Rushworth''s father did not see any way we could turn it around.

    "He also said at time that the only people who were making sense to him were the
    Native elders sitting on the steps of the White House asking people to listen
    to what was going on," Rushworth explained.

    "It was a heavy conversation, nothing light in any way, and he said even with
    that certainty in his mind, ''We have to do our best every day. Even if it all
    goes down, it''s a matter of personal dignity to do everything we can turn it
    around.'' His father then added,"Because you never know. You never really know."


    His father believed that the powers of nature were far beyond our understanding.
    "The dire position we are now in is solid evidence of the fact that the predominant
    civilization does not have a handle on all the interrelationships between humans
    and what we call the natural world," Rushworth told me. "If it did, we wouldn''t
    be facing this situation. We simply do not have a big enough or right-minded enough
    vision. Because of this, we need to allow for something we cannot understand.
    This is not about hope, but more, humility, and carefully considered action within
    that humility, and much deeper listening."


    As I struggled with the conclusion of this book I was introduced to a story by
    Rushworth that helped redefine my entire relationship with the mountains, and
    provided profound meaning as to why I have been drawn up into the mountains since
    childhood.


    This is an old story that was told to Iss/Aw''te writer and storyteller D. Darryl
    Wilson, who was born into the Achumawi and Atusgewwi Native American tribes (often
    called the Pit River Nation) of northeastern California. Wilson tells of Mis Misa,
    a small but'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'powerful spirit that inhabits Akoo-Yet (Mount Shasta), located at the southern
    end of the Cascade Range in north-central California.6 Mis Misa is a spirit force
    that balances the Earth with the universe, and the universe with the Earth. Wilson
    says that Akoo-Yet is “the most necessary of all of the mountains upon earth,
    for Mis Misa keeps the Earth proper distance from the sun and keeps everything
    in its proper place when Wonder and Power stirs the universe with a giant invisible
    ja-pilo-o (canoe paddle). Mis Misa keeps the Earth from wandering away from the
    rest of the universe. It maintains the proper seasons and the proper atmosphere
    for life to flourish as Earth changes seasons on its journey around the sun.”7
    The mountain, the story tells us, must be worshipped because Misa dwells deep
    within it. To climb the mountain with a pure heart and real resolve and to communicate
    with “all of the light and all of the darkness of the universe is to place your
    spirit in a direct line from the songs of Mis Misa to hataji (the heart) of the
    universe. While in this posture, the spirit of man/woman is in perfect balance
    and harmony.8 For as long as Mis Misa’s instructions are followed with sincerity,
    society will be sustained. Its inhabitants will survive for the long term. “The
    most important of all the lessons, it is said, to be so quiet in your being that
    you constantly hear the soft singing of Mis Misa.”


    However, the story also warns that by not listening to Mis Misa’s song the song
    will fade. Mis Misa will depart, and the Earth and all of the societies will be
    out of balance, and the life therein vulnerable to extinction.”9


    In 1973 Wilson’s elder,father Craven Gibson, summoned him to warn him of impending
    disaster. Gibson pointed to the moon, and asked Wilson to see the “scars” and
    the “injured land. He recounted a story to tell to him by his grandmother, of
    a “big war between the people” that occurred. Given the story to Gibson by his
    grandmother dated to the nineteenth century, it locates it at the beginning of
    the genocide of Native Americans in California. Between 1846 and 1880, 90 percent
    of them were killed by white colonists, making the story a profound wounding of
    colonialisms’ devastating impact on nature and the Earth.10 Gibson’s grandmother’s
    story told of a “terrible war” between “those people who did not care we'
