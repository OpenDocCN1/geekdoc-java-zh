- pgno: 193
  md: 'about life and did not care if the moon remained a dwelling place” and “those
    others who wanted the moon to remain a good place to live.” Grandfather Gibson
    stated clearly, “That war used up the moon. When the moon caught fire there wasn''t
    enough water to put it out. It was all used up. The moon burned. It cooked everything.
    That huge fire cooked everything. Just everything.”


    Grandfather Gibson confessed to Wilson that he feared the Earth could also be
    itamji-uw—if everyone failed to “correct their manner of wasting resources and
    amend their arrogant disregard for all of life.”


    Like so many people, I have wondered what to do at this time. Each of us now must
    first find our own honest, natural response to the conditions that we have brought
    upon ourselves. I am heartened by people like my friend Karina Miotto in Brazil,
    who has devoted her entire life to protecting the Amazon. Each time a report is
    published about increased deforestation in her beloved rain forest, I watch Karina
    become consumed in grief. But each time, she goes deeper within herself and her
    community, further strengthening her love for that portion of the planet where
    she lives, and repurposes herself into her next action to protect the Amazon.
    I find solace in the fact that there are millions of others like Karina, particularly
    those of the younger generations, who have drawn their lines around their respective
    portions of the planet closest to their hearts, and are making their stands.


    Rushworth has regularly invited Indigenous elders to speak to his classes, especially
    about what is the right relationship to Earth. His students always ask the elders,
    “What can we do?” Henry Tyler, an Arapaho elder, would point a finger toward his
    head and say nothing for a while, then he would answer, “Use this,” and smile.
    “Everything said for the previous three hours would provide tools for those who
    chose to respond,” Rushworth explained. “He gave so much to reflect upon that
    finger to the head was a powerful statement.” Selo Black Crow, a Lakota Sundance
    leader and elder, would smile and say, “Think about it. That’s up to you. I can’t
    tell you what to do. Educate yourself, then you decide.” Of this Rushworth added,
    “Like'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'with Uncle Henry, listening to him for three hours would give an incalculable
    amount of information and food for reflection.” The common message these men offer,
    Rushworth believes, is that each person must come fully into their own agency
    and that place decide upon their proper course of action. Otherwise, simply following
    the lead of someone else would entail a lac of the kind of conviction needed for
    these times.


    I find my deepest conviction and connection to the Earth by communing with the
    mountains. I moved to Colorado and lived among them when I was in my early twenties,
    and it was there I began to deepen my relationship with them and began to really
    listen to them. I would hike out and just sit among the peaks, watching them for
    hours, and write about them in my journal. Today, I know in my bones, my job is
    to learn to listen to them more deeply, and share what they are telling us with
    those who are also listening.


    While Western colonialist culture believes in “rights,” Indigenous cultures teach
    of “obligations” that we are born into: obligations to those who came before,
    to those who will come after, and to the Earth itself. When I orient myself around
    the question “what are my obligations,” the deeper question immediately arises:
    “From this moment on, knowing what is happening to the planet, to what do I devote
    my life?”'
