  img_proc: true
- pgno: 161
  md: 'To the west of the modern town, the ancient village’s sod-house mounds are
    still visible, but parts of them are disappearing into the sea, along with the
    summer sea ice and the coastlines. Climate disruption is making itself felt here,
    too, and far more dramatically than most people would expect.


    Most of the passengers on my flight to Utqiavik are oil field workers en route
    to Prudhoe Bay, our first stop. They stare blankly at their phones. All but one
    are white, and many of them are wearing trucker hats. Most are in need of a shave
    and haircut. They are following the money north, at least while it is still there.
    Were it not for oil, most of them would never set foot where we are heading. There
    are no distractions; it''s too open, beautiful, quiet.


    The plane took off and I stared out the window at my beloved Alaska. Just I had
    been in the Amazon.


    Not far south of Fairbanks, we fly over the thunderhead plume of a large wildfire,
    which quickly gives way to a thick, sooty haze. The land is burning below me.


    We land at Prudhoe Bay, where most of the passengers disembark. On the horizon
    north of the airport stand the flare stacks and large buildings of the oil industry
    in a layer of brown smog. Due west of the airport is the Trans-Alaska Pipeline,
    beginning its long journey through the Alaskan wilderness as it carries oil oil
    south, where it will be shipped and burned around the globe.


    After a short layover, we take off for Utqiavik. From the air, I can see dirt
    roads running parallel to the pipelines, slicing the fragile green tundra. To
    the north, the shallow brown waters of the Beaufort Sea quickly turn blue. There
    is no ice in sight, even from thirty thousand feet up on this clearest of clear
    late July days.


    On the shore in Utqiavik, a large loader is busy maintaining the dirt berm that
    barricades the northern edges of the village against the encroaching, increasingly
    turbulent seas. Motor rumbling and black exhaust billowing from its top, it scoops
    up dark soil from a large mound that had been transported from a third of a mile
    inland and carries the soil to the berm. This is a full-time job here.'
