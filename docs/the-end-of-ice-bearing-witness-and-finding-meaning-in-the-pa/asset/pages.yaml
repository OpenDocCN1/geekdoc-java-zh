    the heat is reaching even lower depths.9 The same paper showed that oceanic warming
    is occurring 13 percent faster than previously believed and that is only accelerating.10
    A 2016 NOAA study projects that by the year 2050, more than 98 percent of coral
    reefs will be affected by “bleaching-thermal stress” every year.11 An earlier
    study by World Resources International that was compiled by more than two dozen
    conservation and research groups stated that “quick, broad action could go a long
    way in saving reefs,” but also warned that unless immediate action is taken to
    reduce the threats, 90 percent of all reefs will be “threatened” by 2030, and
    all of Earth’s coral reefs could be completely gone by 2050.13 It listed human-caused
    climate disruption, warmer water temperatures, ocean acidification, shipping,
    overfishing, coastal development, and agricultural runoff as the contributing
    factors.


    Dr. Mark Hixon, the Sidney and Erica Hsiao Endowed Professor of Marine Biology
    at the University of Hawaiʻi at Mānoa, was frank with me when I spoke to him.
    “The situation is dire, but not hopeless,” he said, explaining that there are
    already corals living today that have adapted to warm, acidic waters that would
