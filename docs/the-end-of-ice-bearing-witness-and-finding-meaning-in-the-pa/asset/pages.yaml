  img_proc: true
- pgno: 164
  md: 'which shattered the old record of 0°F. The average temperature in Utqiaġvik
    from 1921 to 2015 for those three months was minus 7.9°F. Temperatures generally
    in the Arctic for 2016 were, by far, the highest since 1900, and each of the previous
    four years to date was in the top ten warmest ever recorded.² By February 2018,
    temperatures in northern Greenland were a staggering forty-five degrees warmer
    than normal.³ This would be the equivalent of Denver seeing a 95°F day in February.
    Around the same time, Arctic ice levels were already at record lows for time of
    year: The Bering Sea had lost a full-third of its ice in only eight days, and
    an area of Greenland was already free of ice.⁴ “There is no ice where there is
    almost ice,” the *Washington Post*’s weather experts tweeted at the time⁵⁵There
    is open water north of #Greenland where the thickest ice of the #Arctic used to
    be,” Lars Kalske, a German physicist, explained in a tweet. “It is not refreezing
    quickly because air temperatures are above zero [Celsius].”⁶


    “Things are happening so fast, we’re having trouble keeping up,” Mark Serge, director
    of the NSIDC, said even before all of that happened. “We’ve never seen anything
    like this before.”⁷


    I meet Cindy Shults in the town of KBRW, Utqiaġvik’s “Top of the World Radio”
    station, where she works as the station’s development director. She, too, is full
    of stories of how Utqiaġvik has changed in the forty-one years she has lived.
    Just two weeks earlier, they had thunder and lightning, which is rare here. “Everyone
    just went outside and started watching,” she says laughing. “I was yelling at
    everyone to go back inside so they wouldn’t be human lightning rods. Most of them
    had never seen lightning, they just had no idea.” She remembers a two-week spate
    just ten years ago when temperatures were well into the twenties every day. When
    it’s seventy in Utqiaġvik, it feels more like ninety because of the humidity,
    she says. “Nobody here denies that climate change is happening, and dramatically
    and rapidly,” she says. Shults tells me that the baseball field where she used
    to play as a child, down the hill from the bingo hall, is now ocean. It took about
    fifteen years for the sea to claim'
