  md: '# 4


    # Farewell Coral


    February 10, 2017. Floating delicately above turquoise tropical waters, the Rock
    Islands of Palau in the western Pacific Ocean are the heavily eroded remnants
    of what was once a massive exposed limestone reef. These rock islands have achieved
    their mushroom-like shape as the result of eons of heavy rains, pounding surf,
    the ebb and flow of the tide, and the action of mollusks cutting into the bottom
    of the limestone.


    The skiff of the scuba diving service whisks me along with two marine biologists
    and six crew past these ancient reefs that are now covered in scrub. The Palau
    guide at the boat''s helm slips over the smooth waters, weaving us between the
    islands like a professional race car driver on a familiar track.


    The warm crystal water here contains more than fourteen hundred species of reef
    fish, including thirteen species of sharks, and more than seven hundred species
    of hard and soft corals. When diving, your senses can barely keep up with the
    kaleidoscope of life swimming, floating, and growing before your eyes. The world-renowned
    dive site the Blue Corner along the outer wall of the western barrier reef is
    an overestimation of the senses.


    As we drift down the vertical wall covered by blue, brown, and green hard corals;
    bright yellow fan corals; and pink anemone that are home to bright orange clown
    fish, a massive school of silver barracuda swim as if herded by the gray shark
    that follows them. Massive tuna swim out into the depths, and as I look back toward
    the reef, it is filled with wrasse, butterfly fish, and pipefish. Sea turtles
    forage along the wall of coral.'
