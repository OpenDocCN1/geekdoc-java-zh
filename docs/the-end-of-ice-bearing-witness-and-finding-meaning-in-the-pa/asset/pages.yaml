    to Townsend. These low temperatures were enough to kill off 99 percent of the
    beetle larvae that were “overwintering” at the higher elevations. “But we haven’t
    had temperatures that have gotten that in twenty-five years,” Townsend says, “and
    so still a lot of the larvae get killed off, but maybe it’s only 90 percent.”
    That seemingly shift has had severe consequences. “If you look at the satellite
    imagery and look down the planet,” says Townsend, “you see these huge area, large
    parts of Colorado, Wyoming, and Montana, that are the extent of the mountain pine,
    so this really changes the ecosystem.” Shockingly, mountain pine beetles have
    destroyed ten times the area that fire has in any one year, and the monetary damage
    they have caused is eight to ten times greater than fires because the area is
    so vast.


