  md: 'I focus on the rhythm of my breathing. Diving is as close as you can get to
    experiencing weightlessness on Earth. Seeing and hearing your own breath, it feels
    like a liquid form of meditation. The singing sound of air passing through the
    regulator as I inhale it through the long back tube into my mouth and down my
    throat to fill my lungs entrancing. A slight pause, then the slow conscious squeezing
    of my diaphragm to push that air slowly back out of my lungs, up my throat, and
    out my mouth into the regulator, from which it gurgles out in an explosion of
    bubbles seeking their way up to the surface.


    Floating along at a depth of seventy feet with the massive coral wall to the wide-open
    Philippine Sea to my left, and depths unseen below me from where our ancestors''
    imagination birthed sea monsters is a spiritual experience for me. Yet as spectacular
    as Blue Corner, there are notably fewer fish and sharks than when I last do here
    twenty-two years ago.


    Dr. Seiji Nakaya, with his close-cropped gray hair, compact frame, and tanned,
    clean-shaven face greets me with eyes smiling behind his glasses. He shakes my
    hand and gently bows.


    The day before my dive, I meet with him at the Palau International Coral Reef
    Center (PICRC), which is attached to the Palau Aquarium and located right on the
    water at the southern tip of Koror Island. Nakaya is a coral biologist and the
    project coordinator for the PICRC''s coral reef management program. Given his
