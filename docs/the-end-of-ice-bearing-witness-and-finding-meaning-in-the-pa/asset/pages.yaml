    Wright, had spent much of his career studying PSP, explained to me that the sand
    lance fish, a tiny, pencil-shaped fish that lives along Alaska’s coastline, is
    eaten by birds like the murre. He believed the sand lances had become toxic from
    feeding on a marine dinoflagellate called *Alexandrium* that makes the PSP toxins.
    These toxins then moved up the food chain. Nearly every animal, from salmon to
    whales to cod dying birds like puffins, auks, cormorants, and terns, eats the
    sand lance and/or their larvae. Forage fish are one of the most important steps
    in moving calories through the food chain, so all the other animals depend on
    them. If there are extensive phytoplankton blooms of *Alexandrium*, the forage
    fish become toxic, which can take huge numbers of the top predators. Sea otters,
    stellar sea lions, and northern fur seals have seen shocking population declines
    across western Alaska, as has Alaska’s vaunted king salmon.


    When you mention PSP in Alaska, many people know what you are talking about it
