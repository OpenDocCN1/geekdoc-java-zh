    # The Fate of the Forests


    I hadn''t thought much about trees until a few years ago when I moved into a small
    house in the Pacific Northwest in the middle of a second-growth forest of hemlock
    Douglas fir, alder, madrone, and the occasional old cherry. These days, when I
    need a break from writing, I often step out my door and just look up at the green
    giants surrounding me. Watching their tops sway in the wind, especially when the
    late fall winds rake through them, calms me.


    Roughly a year after I bought my house, an adjacent five acres of forested land
    came up for sale. Knowing it was to the door, owls, and ravens that often keep
    me company, I financed my home and bought the land to make sure the trees stayed
    put. Trees remove and store carbon dioxide and release the oxygen back into the
    atmosphere. A single acre of mature forest absorbs 2.5 tons of CO and releases
    four tons of oxygen annually, enough oxygen to keep nineteen humans alive. Trees
    also absorb ozone, ammonia, and nitrogen oxides. Saving that five acres of trees
    felt like the least I could do.


    Looking at these trees, I think about how their shade also keeps us cool, that
    they protect us from the wind, and that they are home to animals, insects, and
    birds. They slow evaporation by keeping water in the ground and increase moisture
    levels in the atmosphere, which is why you always feel better after hanging out
    in a group of trees for a while. Their leaves absorb the sun''s energy, and trees
    lower the air temperature and absorb and store rainwater for themselves and the
    animals that live among them, including ourselves. They prevent erosion, especially
    on mountainsides and along rivers, and provide wood we use for shelter and heat,
    and many of them are sources of'
