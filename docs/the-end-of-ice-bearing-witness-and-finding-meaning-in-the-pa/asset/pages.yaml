- pgno: 20
  md: '# 1


    # Denali


    June 18, 2016. I''m at 17,200 feet, and the winds, now roaring across the barrenness
    of high camp at fifty miles per hour, are relentless. They have increased dramatically
    in power over the past twenty-four hours, and they will only continue to grow
    stronger.


    I have spent many months of my life on Denali on personal climbing with and working
    as a mountain guide, as well as volunteering with the National Park Service (NPS)
    doing rescues as I am doing now. The NPS utilizes dozens of rescue volunteers
    each climbing season in order to augment the number of mountaineering rangers
    it has on the mountain. As volunteers, we team up with the rangers to form patrols,
    with one of the goals being have a patrol at each camp on the mountain at any
    given time in order to assist climbers who run into trouble.


    I have a great respect for the weather on the mountain, but despite climbing to
    the summit three times, each time by a different route, I have never been this
    high on the mountain in a storm as powerful as this. Knowing the storm was going
    to grow stronger, the Denali mountaineering ranger leading our patrol, Mik Shane,
    gave us three volunteers the option to descend. I both love and fear Denali, but
    there was no hesitation on my part, which surprised me, as I know too well how
    teams have literally been blown off the mountain in the ferocious storms on North
    America’s highest peak.


    “I’ll stay, Mik. I want to stay,” I tell him, raising my voice against the roar
    and the sound of the tent vestibule whipping in the gusts of wind. I know that
    Liam, the doctor in our patrol and my tentmate, and Brian, our other volunteer,
    are keen to descend to the camp below us at 14,200 feet to ride out the storm,
    then return to high camp once'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'it has abated. Given the height and girth of the Denali massif, one of the
    largest single mountain masses on the planet, the mountain rarely sees consistent
    weather across its scope. The winds be roaring high camp but far more bearable
    only three thousand vertical feet lower in the far less exposed camp.


    The previous night entire back half of our tent had been buried underneath blowing
    snow. Frankly, we had pitched the tent in a deep pit we had dug into the surface
    of the snow and reinforced the snow-block walls that stood several feet above
    the snow level. The wall and the pit were the only things keeping the tent and
    everything in it from being shredded by the winds, or worse yet, torn from the
    mountain and blown onto Pteri Glacier below.


    The protection from the winds comes at a cost; the deep pit has to be constantly
    emptied of snow. As Liam packs his gear to descend with Brian, I start out the
    tent.


    Because Denali stands only eighteen hundred miles from the North Pole, the mountain
    is closer to the top of the troposposphere—the layer of the atmosphere that supports
    life—than higher peaks at lower latitudes. The Earth’s atmosphere tapers at the
    poles; while it is twelve miles thick at the equator, at the North Pole it is
    merely four high. Hence, Denali’s proximity to the upper reaches of the troposposphere
    means there is 42 percent less oxygen at the top of the mountain than you would
    find atop a similarly high mountain near the equator. Also, Denali’s summit reaches
    towards the top of the troposposphere, it is much closer to the jet stream, so
    winds in excess of one hundred miles per hour on the mountain are not uncommon.


    For this reason, physical exertion at this altitude is amplified many times over.
    After just thirty minutes of shoveling snow, I crawl back into the tent exhausted.
    I take a short rest as snow refills the bottom of the pit and then shovel the
    snow again—a ritual that, while only beginning, will become my penance for having
    chosen to remain at high camp for the next several days.


    Mik’s tent is situated on a platform just above mine. He is hunkered down there
    with his fiancée, Sue Wolf. The winds continue to strengthen through the day,
    enough so that we are forced to use'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'radios to communicate despite the fact that we are barely ten feet apart. “Dahr,
    how about we all reinforce our tents, because the worst is yet to come,” Mik calls
    to me the radio.


    I tell him I''ll meet them outside and crawl out of my sleeping bag to begin the
    process of pulling on my down pants, parka, full-face balaclava, ski goggles,
    mittens, glacier boots, and thermal overboots. Finally, I step into the maelstrom.
    I grab my snow shovel and slowly make my way through the wind to their tent, where
    the three of us work slowly but steadily to reinforce the snow-block walls, add
    extra tent poles, and tighten the guylines before doing the same with my tent.


    The work takes several hours, as we periodically stop to breathe. Gulping in air,
    I watch in awe as a cloud cap forms over the lower north summit, just as one had
    formed over the higher summit at 20,310 feet. Cloud caps appear when warm, moist
    air from lower altitudes is forced up into the much colder air at higher elevations,
    a phenomenon known as orographic lift.


    Otherworldly cloud patterns that look like ripples of water funnel up from below
    and sweep over the precipitous edge of high camp. The 14,200'' camp is situated
    three vertical feet below on a glacial shelf, which then drops vertigously another
    mile down to the Kahiltna Glacier below. The cloud layer scuds by just over our
    heads. It is so close that Mik, Sue, and I take turns reaching to touch it, but
    it is just out of reach as it is pushed up and away from us to the north summit.
    It forms the classic disk-shape lenticular cloud cap—always a warning of high
    winds. We laugh in amazement at the bizarre cloud patterns, at the energy of the
    winds, and at each other as we pant and jump into the air trying to touch the
    clouds as they race past.


    Snow flurries blot out the occasional window of afternoon sun are blown away by
    long, sustained gusts of wind, which threaten to blow me off my feet, and as they
    strengthen, tear door-size plates of hard-packed snow from the camp’s slopes and
    hurl them downhill.


    In winds approaching gusts of seventy miles per hour, I feel at times like I am
    suffocating. Facing into it feels like sucking on a fire hose; facing away from
    it feels like air being pulled out of my lungs.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'I quickly figure out that it''s easier to breathe facing side-on to the wind.


    I manage to get my tent site largely free of snow, slip back inside, methodically
    and slowly remove all my gear, and crawl back into my sleeping bag.


    The winds roar around around me so loudly I have to wear earplugs. Periodic gusts
    feel like a giant''s hand slapping against the tent, shaking the walls like a
    violent earthquake. As evening arrives, the winds climb up to ninety miles per
    hour. The evening temperature is minus 15°F, which means the temperature outside
    with the windchill is minus 60°F.


    The gusts are so constant the tent is in perpetual motion. My neck gaiter, gloves,
    fleece hat, ski goggles, which hang from the rectangular drying line inside the
    tent, bounce up and down and back and forth. During rare lulls in the wind at
    my tent, the roar of the winds above is deep, constant, and fierce like a freight
    train rolling overhead.


    I''ve been on the mountain nearly three weeks now. I stink. My oxygen-starved
    body is moving at half speed. I am listless, and decision-making is challenging
    at best. I am alone in a storm-battered tent filled with dirty clothing, a stove,
    freeze-dried meals, plastic mountaineering boots, my journal, camera, and a book.


    And yet I have never been as content.


    I pour myself a hot tea from my thermos.

    As the wind speeds up, my inner world slows. I am left with my thoughts, an emptiness
    into which peace flows. I think of people I am close with, and wish them well
    in the world. I think of them not so fond of, and wish them well in the world.
    My world is as focused and simple as this harshly majestic place that leaves no
    room for error. I have a couple of friends in nearby tent with whom I can share
    the experience, and there is no place I''d rather be than right here, right now.


    I love my life.


    It is here that I learn to be 100 percent present and the foundation is laid of
    my respect for the power and beauty of life, along with my awareness of death.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'A few weeks earlier, I had been in the small Alaska town of Talkeetna, which
    had been electric with activity. Climbers heading to Denali were arriving at the
    Walter Harper Talkeetna Ranger Station to check in and sit through a briefing
    about mountain protocol. Then, if the gods were smiling on them, they would head
    to the other end of the tiny main street to the airstrip, where ski planes take
    off and land from sunrise to sunset when the weather on the mountain allows for
    glacier landings at the 7,200-foot basecamp. The roar of their engines was echoing
    across the town.


    Den’ai natives were the first to live in the area, naming Talkeetna, which literally
    means, "place where food is stored near the river." Today, climbers from around
    the world converge with backpacks and duffel bags brimming with gear, food, and
    fuel, full of anticipation for climbing Denali. As important as the mountain is
    for climbers, it is far more important for the Koyukon Athabascan people who named
    Deenaali. This mountain plays the central role in their creation myth. There are
    several other names for the mountain, and each translation pays homage to its
    height and power, all signifying the same thing: the Great One.


    On a clear day, the towering mass of the mountain is visible from thousands of
    square miles around Alaska. This is because the Denali massif is arguably the
    largest mountain on the planet when measured from its edges. It comprises 144
    square miles of rock, ice, and snow that soar 18,310 feet above the 2,000-foot
    plateau from which it arises, giving it the greatest vertical relief of any mountain
    on Earth. For comparison, Mount Everest (Sagarmatha/Chomolungma) is nearly 9,000
    feet higher than Denali, but it rises "only" 12,000 vertical feet above the Tibetan
    Plateau.


    Prior to this trip, the last time I climbed Denali had been in 2003, when a group
    of rescue volunteers headed up the West Rib route, enjoying a more technically
    challenging route than the standard West Buttress. A fellow volunteer on that
    patrol, Tucker Chenoweth, had since become a Denali mountaineering ranger, and,
    more recently, the South District ranger for Denali National Park.


    Mik’s patrol had been invited, along with several other mountaineering rangers,
    to Tucker’s house for a salmon feed the night'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'before we were to fly in to begin our patrol. As children played together in
    the warm evening sun, Tucker spoke with me about some of the dramatic changes
    the NPS had been witnessing on Denali in recent years.


    We’re seeing a shift in seasons, that’s a big thing,” he explained. “Climbers
    have always thought the climbing season is May and June, but now April is the
    new. The general climate on the mountain now seems to be much warmer.” The NPS,
    when discussing the mountain, often describes the “upper mountain” as everything
    above eleven thousand feet, and Tucker described how the upper mountain had always
    been a zone of status, where nothing changed. Not anymore.


    Warmer temperatures are already affecting 14,200’ camp, which is essentially the
    basecamp for the upper mountain. It’s warmer than it’s ever been there, as is
    the case all the way around the mountain at that elevation. The famous Wickersham
    Wall on Denali’s north side, which has traditionally been a massive, steep, heavilyaciated
    face, is seeing its glaciers calving off, leaving behind exposed rock. Access
    to the Wickersham, with several other routes, is becoming increasingly difficult
    and dangerous due to the increased icefall, as well as avalanches. These phenomena
    on Denali are now being reported on popular climbing peaks around the world, including
    Mount Everest.


    Toward the end of our conversation, Tucker spoke about how warmer temperatures
    were impacting the lower mountain. “The lower glacier, and by that I mean 11,200’
    camp down, is melting rapidly,” he said. “The surface is lowering each year, enough
    so that the camps, which we refer to as numbers: 11,200, 9,700, 7,800, and basecamp,
    which is 7,200 ... well, we are going to find something else to call them, because
    they are losing elevation. The glaciers are melting fast.”


    Later that evening, I walked to the edge of the Talkeetna River near our bunkhouse.
    Denali stood proudly in the distance, half lit by the orange evening sun, half
    in silhouette. Tucker’s words weighed on me. I felt like I had been warned. My
    excitement to get back to the mountain now carried it with an apprehension, and
    a slight feeling that I needed to brace myself.'
