    Duane ended up, miraculously, pulling through, but the experience stayed with
    me as I wrote this book. Reflecting on what is happening to the planet, I realize
    that the intimacy I shared with Duane when I thought I was losing my best friend
    is the intimacy we should have with the Earth. When I thought I was losing Duane,
    I did not want to leave anything that was in my heart for unsaid, nor were there
    any wrongs left to make right. In an analogous way, we may be watching Earth dying,
    so we each get to ask ourselves: what am I called for to do at this time? Buddhist
    monk Thich Nhat Hanh has how “the most precious gift we can offer others is our
    presence. When our mindfulness embraces we love, they will bloom like flowers.”
    Only by sharing an intimacy with the natural world we can begin to know, love,
    and care for her. By regaining this intimacy we can begin to understand the ramifications
    of what it is to lose so much of Earth’s ice, species, and biosphere. For so long
    we have lived in a world where many never experience this intimacy, love, and
    connection before it’s too late.


    For decades, many of us have turned a blind eye to what is happening to the planet.
    But now, given that Earth may well be dying, we may be ready to stand up and protect
    what we love. An extraordinary alchemy can take place when people follow their
    inner directives to stand up and face squarely the dire odds of biosphere survival.
    These actions involve extraordinary outer and inner courage, which can nurture
    a profound activism. The gifts provided by the crisis at hand are the conditions
    that make possible widespread shifts in political identity, purpose, and consciousness.


    No one knows if the biosphere will completely collapse. Our future is uncertain.
    Given the fact that a rapid increase of carbon dioxide in the atmosphere coincided
    with previous mass extinctions and that we could well be facing our own extinction,
    we should be'
