    In 2015, my best friend, Duane French, came down with pneumonia and was taken
    to the hospital. Pneumonia on its own is bad enough, but for someone who has quadriplegic
    for more than forty years, it is also life threatening.


    I met Duane when I first moved to Alaska in 1996, then I became his personal assistant.
    Duane is now one of the oldest living quadriplegic on the planet and he has always
    been one of my heroes. He broke his neck in a diving accident when he was fourteen
    and spent his adolescence in a rehabilitation hospital with mangled Vietnam veterans
    returning from the war. Duane decided not to allow something like a broken neck
    and confinement to an electric wheelchair stop him from working to help pass the
    Americans with Disabilities Act. Since then, he has run more than one state government
    division that assists people with disabilities.


    Struggling to breathe, Duane was moved to the ICU shortly after admitted to the
    hospital. His partner, Kelly, his personal assistant Sakhum, and I took twelve-hour
    shifts by his bed. Three weeks went by one antibiotic after another failed. Duane’s
    heart rate was over one hundred beats per minute for weeks on end. He was barely
    eating, and he began spending more and more time wearing a breathing mask.


    Knowing the odds were heavily stacked against him, I sat at his bedside and gave
    him my full attention. When he slept, I watched his chest rising and falling,
    savoring the fact that he was still alive. When it was my to turn, I would go
    to bed in Kelly and Duane’s guest bedroom back at their home, knowing that Duane
    was still alive. But he continued to decline, and as he did, every moment with
    him was ever more precious gift. It was easier for me to sit by his bed than anywhere
    else on Earth. My heart was breaking; I did not want to miss one single second
    of Duane’s life. I had no idea if he would'
