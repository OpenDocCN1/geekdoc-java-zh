    Two days after leaving Utqiavik, I fly from Anchorage to Seattle on my way home.
    Forty-five minutes before we land while flying at thirty-five thousand feet, the
    plane enters the brownish-gray smoke rising from the 146 wildfires British Columbia
    beneath us. At that point, they had burned over six hundred thousand acres and
    forced more than seven thousand people from their homes. We descend into the brown
    cloud until we land in Seattle, which was also enveloped in the smoke.


    A couple of days later, a leaked draft report from U.S. scientists across thirteen
    federal agencies warned of a worst-case scenario of 18°F warming over the Arctic
    between 2071 and 2100. The report also noted that the Arctic was losing more than
    3.5 percent of its sea ice coverage every decade, that the extent of the September
    sea ice had declined more than 10 percent per decade, that the land ice is disappearing
    at an increasingly rapid rate, and that the severity of winter storms is increasing
    because of warming temperatures.\31


    The grim seemed endless: Alaska''s North Slope snow-free season is lengthening.\32
    The 2016 experienced the longest snow-free season in 115 years of record keeping—roughly
    45 percent longer than the average snow-free period over the previous four decades.
    The October temperature at Barrow increased by a staggering 7.2°C between 1979
    and 2012.\33


    Then, I learned of the Trump administration''s decision to close the Denali Commission,
    an Anchorage-based climate adaptation program aimed at relocating dozens of the
    Alaskan towns threatened by thawing permafrost, rising sea levels, and loss of
    sea ice.\34 By October 2017, the coastline of Canada''s Northwest Territories
    was eroding faster than scientists could measure, and thirty-one Alaskan communities
    were facing “imminent” existential threats from coastal erosion, flooding, and
    other consequences from rising twice as fast as the global average.\35 By November
