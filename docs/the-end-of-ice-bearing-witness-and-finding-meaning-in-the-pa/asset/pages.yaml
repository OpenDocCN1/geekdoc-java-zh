  md: 'I am primarily interested in learning about coral bleaching. Corals are organisms
    with algal cells in their tissues that produce energy and are the coral’s primary
    source of food. Bleaching occurs when temperatures become too warm, causing the
    algae to create toxins that are harmful to the coral. The coral then ejects its
    algae, without which the coral is left with a thin, transparent tissue covering
    its skeleton. If the water temperature drops in time, coral can take in the algae
    and start producing energy again. When coral is white, it means it is in a critical
    stage of starvation. When the water temperature is high, or heats further, the
    coral will usually die within a few weeks.


    Sixteen percent of global corals perished during the first global bleaching event,
    which happened in 1998.¹ According to the Associated Press, the largest bleaching
    event ever recorded in 2015 to 2016 “an extended El Niño that warmed Pacific waters
    near the equator.” Twenty-two percent of the Great Barrier Reef was killed and
    73 percent of coral surveyed in the Maldives, a resort destination for the hyper-rich
    in the Indian Ocean, suffered bleaching, with other areas in the central Pacific
    experiencing a 90 percent loss of their coral reefs, leaving some scientists to
    wonder if it would ever end²


    According to Nakaya, the worst bleaching event Palau had occurred in 1998, from
    which it subsequently recovered but was then hit by another event in 2016. Nakaya
    is grateful, compared to bleaching in Japan, the reefs in Palau are still capable
    of returning to a healthy state since they have yet to experience major back-to-back
    bleaching events. According to a report from Japan’s Ministry of the Environment
    a month earlier, coral bleaching had killed 70.1 percent of Japan’s largest coral
    reef, the Sekiseishoko reef, located off the coast of Okinawa. Bleaching had increased
    56.7 percent from only two months earlier


    Oceanic warming is impacting even Palau. We are seeing a pattern of increasing
    surface temperatures and bleaching,” Nakaya says, pointing out at the open water.
    “Last year it was a quarter of the coral impacted, along with the fish and crustaceans
    and other taxonomic groups that suffered from this event. And this year, for'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'example, we had much higher temperatures compared to the year before.


    Nakaya stresses that the uniqueness of Palau’s reefs—is geographic isolation given
    that it is eight hundred miles from the closest major population center (Guam,
    with two hundred thousand people) and its relative lack of human impact compared
    to other reefs—is why they have been able to fully recover from recent major bleaching
    events, compared to reefs in Japan or Australia. He sees Palau as a control group
