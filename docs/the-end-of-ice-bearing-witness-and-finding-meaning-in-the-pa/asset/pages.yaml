  img_proc: true
- pgno: 166
  md: 'hunt larger whales, because when they pull them out to butcher them, the ice
    isn’t thick enough to hold the weight of an animal larger than thirty-five feet
    long.


    That afternoon, I run into Perry while walking to the coast. He smiles his broad
    smile and greets me warmly, as he does every time I see him now. “Oh boy, it is
    hot,” he says, fanning his face. It’s nearly 70°F and the ocean is dead calm,
    which is also here. Or at least it was rare.


    I walk along the beach. To the north, a massive billowing thunderhead cloud grows
    in the sunlight far out over the water beyond Point Barrow. The silhouettes of
    three children dance and play in the shallow water near the shore. The photo I
    take could be of a tropical beach.


    Kanayrak told me that he was a volunteer gravedigger. The permafrost used to be
    to twelve inches below the surface, so it would take three days of chipping with
    an ice pick to dig a grave. Now, the permafrost is several feet below the surface,
    and softer, so he can dig a grave in five hours or less.


    Permafrost, which typically begins just a few feet below the surface, is simply
    a layer of ground that is continuously frozen for a period of two years or more.
    It is composed of dead plants that absorbed carbon dioxide from the atmosphere
    centuries ago before decomposing. When it thaws, microbial activity converts a
    large portion of it into methane and carbon dioxide, which is released back into
    the atmosphere.


    According to a NASA report, over hundreds of millennia, “Arctic permafrost soils
    have accumulated vast stores of organic carbon”—an estimated 1,400 to 1,850 gigatons,
    compared to 850 gigatons of carbon in Earth’s atmosphere. That’s equal to around
    half of all the estimated organic carbon in Earth’s soils, with most of it located
    in the top ten feet of thaw-vulnerable soil. Scientists, along with others, are
    learning that the Arctic permafrost is less permanent than its name implies.'
