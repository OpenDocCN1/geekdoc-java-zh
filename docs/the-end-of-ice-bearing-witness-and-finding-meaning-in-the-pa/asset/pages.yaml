- pgno: 169
  md: 'similar, though far larger, craters caused by the thawing of the permafrost
    just under the surface of the ground in Canada’s Fort McPherson in the Northwest
    Territories.^{14}


    Even more problematic, as the permafrost thaws the land sinks lower, and so for
    villages near coastal zones, like Utqiavik and other northern villages across
    Alaska and Siberia, this will combine with rising sea levels to form a serious
    threat to their communities. As of five years ago, seventeen villages were considering
    relocation, but Romanovsky the number is now much higher. "Kivalina, they need
    to move right now because they have too much happening to keep up with it and
    it''s a huge problem because it involves lots of money and they don''t know where
    that will come from. It is already at the critical stage now between five and
    seven villages," says Romanovsky. Across the Arctic, including Alaska, millions
    of dollars are being spent to shore up infrastructure in a losing battle against
    thawing permafrost and encroaching seas.^{15}


    Schaefer also noted about the impact thawing permafrost will have on the infrastructure
    and people of the Arctic. "Tawing permafrost represents a radical change to the
    environment and way of life in the Arctic, with unknown social costs," he said.
    He asked him if he thought it would be necessary to relocate most, if not all,
    of the coastal villages in northern Alaska, and he said that as sea levels go
    up and permafrost thaws, "there is risk the thawing will destroy infrastructure,
    which will require repair and that includes entire villages. If you build a village
    right next to the ocean and it starts to melt, you have to move. This is happening
    in interior Alaska along rivers, and it''s also happening across the entire Arctic
    zone."


    Roads, railroads, oil and gas infrastructure, airports, seaports, all these things
    were built across the Arctic on the assumption that the permafrost would stay
    frozen. "When it is frozen it is solid, but it thaws and turns to mud, it''s easy
    to see this seeing a lot of damage to infrastructure," Schaefer He has contributed
    to a report to the UN that strongly recommends that countries with a lot of permafrost
    need to plan ahead. "If you don''t plan, things fall down and you have to rebuild,
    and that could be very expensive," he said.'
