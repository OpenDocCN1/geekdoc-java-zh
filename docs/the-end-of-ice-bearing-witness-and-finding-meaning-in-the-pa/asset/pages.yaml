    carbon dioxide emissions, corals cannot form a skeleton and sometimes die because
    they can''t grow properly. That said, in Palau strange thing is going on: in the
    enclosed Nikko Bay, the water has high acidity but the coral remains healthy.


    While the rise in sea levels caused by climate disruption is having a major impact
    on Palau, not only because it leads to a greater number of powerful typhoons but
    also because higher tides are encroaching on areas where the island''s 22,000
    inhabitants are concentrated. Coral reefs, which have always served as wave breaks,
    are less effective as the seas rise, leaving those living on the coasts that much
    more vulnerable.


    Nakaya is also worried about the impact of overfishing and tourism. "We need to
    do everything we can to protect and take care of our coral reefs," he says, adding
    that the onus remains largely elsewhere given that a tiny country like Palau can
    do very little about global CO₂ emissions.


    Coral reef ecosystems cover less than 2 percent of Earth''s ocean floor yet are
