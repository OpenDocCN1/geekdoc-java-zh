    They kept these misty islands to themselves, but the Russians eventually found
    them when an expedition led by Gavril Pribylov arrived in 1786.


    During the late eighteenth century the Russians brought the inhabitants of the
    Aleutian Islands to St. Paul and St. George Islands and forced them to hunt seals,
    whose skins they sold. The Aleut were, of course, not allowed to return to their
    home islands and instead were housed in inhumane living conditions, were not given
    adequate food or medical care, were beaten regularly, and were tightly controlled
    by the Russians as to what they could eat, what they could wear, and even whom
    they could marry.¹ Within the first eighty years of Russian occupation, there
    was an 80 percent decline in the Aleutian population.


    The United States bought Alaska from Russia in 1867, and in 1870 the U.S. government
    awarded a two-decade sealing lease over the Pribilof Islands to the Alaska Commercial
    Company, in effect transferring the control the Russians had over the islands
    to the company. The treatment of the Aleut improved marginally, but they still
    lacked autonomy, as social and racial segregation were practiced and working conditions
    continued to be extremely poor.


    Another huge blow came during World War II, when the entire populations of St.
    Paul and St. George Islands were moved during an emergency evacuation to a camp
    at Funter Bay in southeastern Alaska after the Japanese bombed Dutch Harbor on
    the Aleutian Island of Unalaska. There they were confined in an abandoned fishery
    and mining camp and forced to live in deplorable conditions. When they returned
    to their homes, they found they had been ransacked by American soldiers. Everything
    of value was taken, including religious items from their churches. Aleut Islanders
    eventually received an insultingly low $8.5 million from the federal government
    in partial compensation for the unjust and unfair treatment they were subjected
    to between 1870 and 1946.²


    The U.S. government’s presence on St. Paul and its control of the commercial seal
    harvest counted in 1983. Since then, the island has been autonomous, and ownership
    of seal pelts is only allowed'
