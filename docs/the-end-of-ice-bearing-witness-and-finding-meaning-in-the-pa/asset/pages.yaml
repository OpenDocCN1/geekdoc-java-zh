    The disease germates on the surface of a tree before entering the tree through
    its needles or a wound. The fungus, according to the forestry service, “then grows
    into a twig. The infected branch will often swell; after a year or so, the blister
    rust forms spores” within the blister. When the blisters rupture, they release
    bright orange spores that eventually infect the pines. Once inside the needle,
