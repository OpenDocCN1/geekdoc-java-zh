    - a type

    - operators


    Variables must have a name, and so you can refer to them in the program. Java
    is similar to other modern programming languages relatively flexible in terms
    of variables, but the following shall (should) be:


    +   - a variable name must start with a letter, a dollar sign ''$'' or an underscore
    ''_''

    - a variable name should always start with a lowercase letter, and one should
    avoid ''$'' and only occasionally use `.`

    - then to follow any number of characters consisting of letters, digits, $ and
