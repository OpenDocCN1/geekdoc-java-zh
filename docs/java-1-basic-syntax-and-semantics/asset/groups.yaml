    | + create(int, int, int, String) |

    | + validate(int[], String) |


    The class has only two methods, but they are, in turn, complex. Both first must
    create a new lottery game, and it has five parameters, the first three are the
    game parameters (minimum lottery number, biggest lottery number and the number
    of lottery numbers in a row), next is the number of rows to be played, and finally
    the name of the file that will contain the result. With the class LottoRow available
    in simple principle to create the wished lottery rows, but the method must ensure
    the file. Finally, the identical rows, must be sorted before being written to
    the file. Finally, the method `create()` will write the rows to the file, and
    here it was decided that the first line should be the game''s parameters and week
    number. The method `validate()` is used to validate a lottery game against the
    weekly lottery. The method has three parameters, the first are for the numbers''s
    lottery, while the next is the name of the file with the games to be validated,
    and the last is the name of the file to the result. The method then should read
    data from a file and write data to a file. The most difficult is the course validating
    of the individual rows. The class LottoCoupon defines the program''s most complex
    class.


