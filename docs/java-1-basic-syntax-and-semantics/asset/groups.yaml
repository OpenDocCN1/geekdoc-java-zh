    # JAVA 1: BASIC SYNTAX AND SEMANTICS VARIABLES AND DATA TYPES


    Objects are the key to understanding object-oriented technology. If you look around,
    you will find many examples of real-world objects. It could be a desk, your wife,
    a particular colleague, a customer, your television, your car and so on. These
    objects are characterized by two things: they have all state and behavior. A customer
    has a name, an address, a telenummer, a balance. The customer can order a product,
    return a product, the customer can pay for it. It is the customer''s behavior.
    In the same way a car''s state can be made, color, power, etc., and its behavior
    might be starting, changing gears, braking and so on. By the way to identify the
    state and behavior of objects in the real world, you have a good starting to think
    object-oriented, and thus to find the objects in the development of a program.


    Software objects are conceptual, but looks like the real world''s objects. They
    object stores its state in variables or fields, and it performs its behavior through
    methods. Methods acting on an object''s internal state and serves as the primary
    mechanism for object-to-object communication. The hiding of the objects internal
    state and require that all interaction must be made using the objects methods
    called for data encapsulation and is a fundamental principle of object-oriented
    programming. With data encapsulation it is the object, which has control over
    how its state changes as it is the object through its methods determines what
    the outside world can do with.


    Above I have dealt with variables in Java, but variables can be several things,
    and there are basically the following opportunities:


    +   1. Instance variables (non-static fields) as objects to store their state.
    All variables that in a class are defined as non-static, are instance variables,
    and each object of the class has its instance variables, as a specific object''s
    state is independent of all other objects state, even if it is objects of the
    same class.

    2. Class variables (static fields) are defined static. Aside from that they are
    created in the same way as instance variables, but there are created only one
    copy of these variables, and all objects of a class will share all variables.
    A static variable is designed to store values to be used by all objects of a class.

    3. Local variables are in principle created in the same way as instance variables,
    but they are created in an method, and is known only to this method. All variables
    that I''ve used, are local variables. They are typically used to store temporary
    values that a method needs to do its job. Instance variables and class variables
    have a default value if they are not initialized by the programmer. In contrast,
    local variables must be initialized with a value. A local variable is created
    when the method in which it is defined, is called, and the variable is automatically
    deleted when the method is completed.'
