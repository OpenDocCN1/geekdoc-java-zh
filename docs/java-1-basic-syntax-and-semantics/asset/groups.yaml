    \ has space for 10 elements. After the array is created, all elements have the\
    \ value 0. The next 10 statements assigns values to all places in the array:\n\
    \n| Index | Value |\n|-------|-------|\n| 0 | 100 |\n| 1 | 200 |\n| 2 | 300 |\n\
    | 3 | 400 |\n| 4 | 500 |\n| 5 | 600 |\n| 6 | 700 |\n| 7 | 800 |\n| 8 | 900 |\n\
    | 9 | 1000 |\n"
  mdcn: "\n\n## JAVA 1：基础语法与语义\n### 变量与数据类型\n\n### # 4.4 示例：骰子\n\n我将展示一个表示具有六面的普通立方体的类。该类可以写如下：\n\
    \n```java\npackage cubes;\n\nimport java.util.*;\n// 表示普通正立方体的类\npublic class\
    \ Cube {\n    private static Random rand = new Random();\n    private int eyes;\n\
    \n    public Cube() {\n        roll();\n    }\n\n    public int getEyes() {\n\
    \        return eyes;\n    }\n}\n```\n\n![](imgimg/4c19916134263dc09e46f753c669715e_63_0.png)\n\
    \n```java\npublic void roll() {\n\teyes = rand.nextInt(6) + 1;\n}\n\npublic String\
    \ toString() {\n\treturn \"\" + eyes;\n}\n```\n\n该类有两个字段：一个类变量和一个实例变量。类变量是 `rand`，是一个\
    \ `Random` 类型的对象。它是一个随机数生成器，可以生成随机数。它的工作原理是通过读取机器时钟并根据对象创建时的时钟值产生序列值。由于你无法知道（假设）任何给定时间时钟的内容，因此起始时间是随机的，生成的数字序列看起来似乎是随机的。变量\
    \ `rand` 必须是一个类变量，否则 `Cube` 类型的对象将拥有自己的随机数生成器，这很容易导致它们以相同的时钟值进行初始化。结果将是 `Cube`\
    \ 对象创建相同的随机数序列。类的实例变量名为 `eyes`，用于跟踪每个 `Cube` 的值。由于两个 `Cube` 对象的值并不一定相同，因此该变量必须是实例变量，以便每个对象都有自己的副本。\n\
    \n该类有一个方法 `roll()`，用于模拟掷骰子。当执行该方法时，会使用类变量 `rand`。`Random` 类有一个名为 `nextInt()` 的方法，返回一个非负整数。在这种情况下，它是\
    \ 0, 1, 2, 3, 4 和 5 之一，当加 1 后结果是 1 到 6 之间的值。`Random` 类定义在 `java.util` 包中。为了使用该包中的类，需要使用\
    \ `import` 语句。在这里 `*` 表示你可以使用该包中的所有类。\n\n`Cube` 类有一个构造函数。由于变量 `eyes` 没有初始化，它的默认值为\
    \ 0。这很遗憾，因为这是一个非法的值。因此，构造函数会掷一次骰子，并确保骰子从从开始就有值。\n\n该类还有另外两个方法。`getEyes()` 方法是一个返回骰子显示数值的方法。它看起来如上所示。然后是\
    \ `toString()` 方法，它以文本的形式返回骰子的值。`return` 语句的语法并不直观，但它强制方法返回 `eyes` 的值作为文本。该类可以在\
    \ `main()` 方法中使用如下所示：\n\n```java\npublic static void main(String[] args) {\n \
    \   Cube c1 = new Cube();\n    Cube c2 = new Cube();\n    do {\n        c1.roll();\n\
    \        c2.roll();\n        System.out.println(c1 + \" \" + c2);\n    } while\
    \ (c1.getEyes() != c2.getEyes());\n}\n```\n\n对于尚未提到的 `use` 语句需要稍作解释。前两个语句创建了 `Cube`\
    \ 对象，与上面说的一样没有新内容。下一个语句是 `do` 语句，是循环的一个示例。这意味着块 `{ }` 中的三条语句将一直执行，直到条件为假。条件使用了\
    \ `!=`，意味着“不等于”，因此只要两个 `Cube` 对象显示的数字不同，条件就为真。包含三个语句的块会掷骰子并打印它们。在这里你应该注意，循环的每次迭代都会打印：\n\
    \n```\nc1 + \" \" + c2\n```\n\n这里这里打印的是 `Cube` 类 `toString()` 方法的值。结果是程序不断投掷两个骰子并打印它们，直到它们显示相同的数字为止。`do`\
    \ 语句是程序控制语句的一个示例，当你看到这段代码时，并不难发现发生了什么。\n\n### 练习 7\n\n在这个练习中，你应该编写一个与上面类似的程序，但程序处理的不是骰子而是硬币。添加一个名为\
    \ `Coin` 的类来表示可以显示正面或反面的可以硬币的硬币。该类应该像 `Cube` 一样，并有一个随机数生成器。此外，它必须有一个表示硬币值的实例变量：\n\
    \n```java\nprivate char value;\n```\n\n值必须是 H 或 T。该类必须包含一个构造函数和三个方法：\n- `getValue()`\n\
    - `toString()`\n- `roll()`\n\n在这里，前两个的写法与 `Cube` 相同，但后者需要稍多一点，可以使用运算符如下所示编写：\n\
    \n```java\npublic void roll() {\n    value = rand.nextBoolean() ? 'H' : 'T';\n\
    }\n```\n\n![](img/4c19916134263dc09e46f753c669715e_66_0.png)\n\n### # 4.5 数组\n\
    \n数组是特定类型对象的容器，且数组本身也是对象。数组可以包含若干元素，数组可以包含的元素数量在数组创建时定义。你可以如下所示展示数组：\n\n![](img/4c19916134263dc09e46f753c669715e_67_0.png)\n\
    \n展示具有 10 个元素的数组。每个元素通过索引标识，索引从 0 开始。考虑以下 `main()` 方法：\n\n```java\npackage array01;\n\
    \npublic class Array01 {\n    public static void main(String[] args) {\n     \
    \   int[] arr = new int[10];\n        arr[0] = 100;\n        arr[1] = 200;\n \
