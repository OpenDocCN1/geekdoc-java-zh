    `main()` 方法，该方法包含单条语句——不是由 NetBeans 创建的，而是我手动输入的。这是一条用于在屏幕上打印文本的语句。


    代码非常简单，到目前为止你只需要接受它应该像上面那样被编写，但有几点你应该注意。


    Java 是区分大小写的，在任何地方你都必须区分大写字母和小写字母。


    如前所述，每个 Java 程序都至少包含一个类 `HelloWorld`。在这种情况下，该类只有一个名为 `main()` 的方法，这是程序启动时调用的方法。一个方法由语句组成，这些语句可以被视为在机器上执行某些操作的命令。调用一个方法意味着执行了这些方法。`main()`
    方法必须以 `public static void` 单词作为前缀。后面将进行解释。在这种情况下，`main()` 只有一条语句，即在屏幕上写文本。`System.out.println()`
    实际上是 `PrintStream` 类中的一个方法，该类代表屏幕。当程序运行时，执行 `main()` 中的 `println()` 语句时，会在屏幕上打印文本。


    注意，在 Java 中，每条语句都以分号结束——上面在 `System.out.println()` 之前有一个分号。它告诉编译器语句在何处结束。


    在 Java 中，类被分组在所谓的“包”（packages）中。一个类的全名由它所属的包以及类名组成。NetBeans 会自动为程序定义一个包，其为全小写的应用程序名称，第一条语句是
    `package` 语句，指示该类所在的包。`package` 语句必须是包含类的文件的第一条语句，但可以以前注释作为前缀。注意，在 Java 中你通常需要将每个类放在它自己的文件中，但稍后会详细介绍。


