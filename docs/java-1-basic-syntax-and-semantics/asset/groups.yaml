    # UNARY OPERATORS


    There is a family of operators which takes only one argument, and that includes
    the operators to sign, negation and the two special oprators ++ and --. Finally
    there is the operator for binary complement, which I will not mention in this
    place. A common feature of these operators is that it is the operators with the
    highest priority. Consider as an example the following statements:


    ```

    int a = 2;

    System.out.println(++a);

    System.out.println(a++);

    ```


    If done, you get the result:


    ```

    3

    3

    4

    ```


