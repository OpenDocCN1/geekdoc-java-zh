    # JAVA 1: BASIC SYNTAX AND SEMANTICS VARIABLES AND DATA TYPES


    4. Parameters are variables that you specify in parentheses after the name of
    method. Parameters seems bit like local variables, but they are used to pass values
    to a method when it is called. Thus, one can think of parameters as variables
    that defines the values a method should act on. main() has a parameter called
    arg that are used to transfer arguments to the program on the command line.


    To construct program code as a family of software objects provides a number of
    advantages:


    +   - Modularity, where the code for an object can be written and maintained independently
    of the other objects.

    - Information hiding, where all interaction with an object is by means of methods.
    The details concerning state of the object and the internal implementation remain
    hidden from the outside world.

    - Code Reuse, where already developed objects (perhaps written by another developer)
    can be used in the current program. It allows the objects to be developed and
    tested by specialists, which you can trust and use in your programs.

    - Modifiable, where a particular object without affecting the rest of the program
    can be replaced with another, if the object for some reason is found inexped.


