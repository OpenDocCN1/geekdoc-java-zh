    \ the actual content found in the pages.)*\n\n[content]\n# JAVA 1: BASIC SYNTAX\
    \ AND SEMANTICS\n\n## VARIABLES AND DATA TYPES\n\nExamples could be the following,\
    \ where the first statement define a literal as a long and the last three all\
    \ define an int with their value: 26\n\n```java\nlong t = 123456789012L;\nint\
    \ a = 26;\nint b = 0x1a;\nint c = 0b0111010;\n```\n\n## LITERALS DEFINING FLOATING\
    \ POINTS\n\nA floating point or decimal number is interpreted as the type float\
    \ if it ends with the letter F or f. Otherwise, its type is double, which can\
    \ also be explicitly with the letter D or d. You can also specify an exponent\
    \ with the letter E or e. The following variables have all the value 1234.56:\n\
    \n```java\ndouble x = 1234.56;\ndouble y = 1.23456E3;\nfloat z = 123456F;\n```\n\
    \nHere you need to specifically noticed that 1.23456E3 means 1.23456 times 10\
    \ in the third.\n\n## LITERALS DEFINING CHAR AND STRINGS\n\nLiterals defining\
    \ the types char and String can contain any Unicode (UTF-16) characters, to the\
    \ extent that the characters are present, they can be used directly. A character\
    \ is not on your keyboard, it can be added as Unicode escape sequences like '\\\
    u0108'. For char literals use single quotes, while for String literals use double\
    \ quotes:\n\n```java\nchar c = 't';\nString s = \"Gorm den Gamle\";\n```\n\nJava\
    \ also supports single escape sequences for special control characters:\n\n- \\\
    b backspace\n- \\t tabulator\n- \\n line feed\n- \\f form feed\n- \\r carriage\
    \ return\n- \" double quote\n- ' single quote\n- \\\\ backslash\n\n## VARIABLES\
    \ AND DATA TYPES\n\nConsider as an example the following statements:\n\n```java\n\
    System.out.println(\"1234567890\");\nSystem.out.println(\"\\u0108\");\nSystem.out.println(\"\
    \\'\");\nSystem.out.println(\"abc\\tde\\\\fg\");\nSystem.out.println(\"a\\nb\\\
    nc\");\nSystem.out.println(\"\\u0041\\u0042\\u0043\");\n```\n\nIf done, you get\
    \ the result:\n\n```\n1234567890\nC\n'\nab de\\\"fg\na\nb\ncABC\n```\n\n![](img/4c19916134263dc09e46f753c669715e_48_0.png)\n\
    \n# Empowering People.\nImproving Business.\n\nBI Norwegian Business School is\
    \ one of Europe's largest business schools welcoming more than 20,000 students.\
    \ Our programmes provide a stimulating and multi-cultural learning environment\
    \ with an international outlook ultimately providing students with professional\
    \ skills to meet the needs of businesses.\n\nBI offers different two-year, full-time\
    \ Master of Science (MSc) programmes that are taught in English and been designed\
    \ to provide professional skills to meet the growing need of businesses. The MSc\
    \ programmes provide a stimulating and multi-cultural learning environment to\
    \ give you the best launch into your career. \n\n- MSc in Business\n- MSc in Financial\
    \ Economics\n- MSc in Strategic Marketing Management\n- MSc in Leadership and\
    \ Organisational Psychology\n\nwww.bi.edu/master\n\n## USE OF UNDERSCORES IN NUMBER\
    \ LITERALS\n\nAs a final note regarding literals, I will mention using `_` in\
    \ literals for numbers. Examples as it is legal to write\n\n```java\nlong kortId\
    \ = 1234_5678_9012_3456L;\nlong cprnn = 999999_9999L;\nfloat pi = 3.14_15F;\n\
    long ip = 0xFF_EC_DE_5E;\nlong ord = 0xCAFE_BABE;\nlong max = 0x7ffff_ffff_ffff;\n\
    byte val = 0b01100101;\nlong bytes = 0b01100101_01100101_10100100_10100100;\n\
    ```\n\nand all instances of `_` are ignored. The aim is only to enhance the readability\
    \ of large numbers. There are a few limitations:\n\n- A number must not start\
    \ or end with the character _\n- The character _ must not stand next to the decimal\
    \ point in a floating point number\n- The character _ must not stand before an\
    \ F or L\n\n## 4.3 OBJECTS\n\nJava is an object programming language, and there\
    \ are some basic concepts you need to know, before you write programs that perform\
    \ something interesting, and the following is an overall introduction to objects,\
    \ classes, inheritance, interfaces and packages, where I will primarily focus\
    \ on how these concepts relate to the real world, while providing a basic introduction\
    \ to the syntax of Java.\n\nAn object is a software module having a state and\
    \ a behavior. Software objects are often used to model real-world objects. This\
    \ explanation explains how an object representing state and behavior introduces\
    \ the concept of data encapsulation. The important thing is to explain the advantages\
    \ of designing software.\n"
