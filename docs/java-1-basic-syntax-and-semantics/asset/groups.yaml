    # FOREWORD


    This book is the first in a series of books on software development. The programming
    language is Java, and the language and its syntax and semantics obviously vary
    much, but the books have largely focused on the process and how to develop good
    and robust applications. The subject of the current book is an introduction to
    the programming language Java with an emphasis on basic language syntax and semantics,
    but it is also a book about what programming in general is and how to practically
    write and test programs. The book requires no knowledge about programming or the
    language Java, and the goal is to show how to get writing computer programs. After
    reading the book and working through the book''s exercises and problems, the reader
    should be able to write simple console applications in the Java language.


    As the title says, this series of books deals with software development, and the
    goal is to teach the reader how to develop applications in Java. It can be learned
    by reading the subject and studying complete programs, but most importantly by
    yourself yourself to do it and write your programs from scratch. Therefore, an
    important part of the books is exercises and problems, where the reader has to
    write programs that correspond to the substance being treated in the books. All
    books in the series are built around the same skeleton and will consist of text
    and examples and exercises that are placed in the text where they naturally belong.
    The difference between exercises and problems is that the exercises largely deal
    with repetitions of the substance that is presented in the text, and furthermore
    it is relatively accurately described what to do. Problems are in more loosely
    described, and are typically a little bigger and there is rarely any clear solution.
    These are books to be read from start to finish, but the many examples, including
    exercises and problems, play a central role, and it is important that the reader
    predict in detail studying the code to the many examples and also solves the exercises
    and problems or possibly study the recommended solutions.


    All books end with one or two sample programs, which focus primarily on process
    and an explanation of how the program is written. On the other hand, the code
    appears only to a limited extent – if at all – the reader should instead study
    the finished program code perhaps while testing the program. In addition to the
    development of programs that are larger than the examples which otherwise is presented,
    the aim of the concluding examples also is to show programs from varying fields
    of application.


