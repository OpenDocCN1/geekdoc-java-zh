    # JAVA 1: BASIC SYNTAX AND SEMANTICS


    # INTRODUCTION


    # 1 INTRODUCTION


    A computer program is a series of commands executed in a certain order, and together
    they solve a specific task. A program is written as a text document that contains
    all the necessary commands. This document is called the program code or source
    code. The individual commands must be written in a very precise way for the computer
    to understand them, and it is here that programming languages come into the picture.
    A programming language lays down rules for how the commands should be entered.
    There are many programming languages, and although they are different, each with
    their advantages and disadvantages, the similarities outweigh the differences,
    and once you have learned a language, it is easy to learn the next. The following
    are used throughout the Java programming language, which is a widely used language
    on many platforms. The individual commands and orders exactly must be written
    as the language''s syntax. What the individual commands doing or performing is
    called the language''s semantics.


    As mentioned above, a program is written as a text document (in practice several
    or many), and it is simply a document of commands. Commands are also called statements.
    These commands or statements being only text, the machine cannot immediately perform
    the commands, but they must be translated into an internal format that the computer
    understands. This process is called translation or compilation and is performed
    by a program that can convert statements written in a particular programming language
    to the computer''s internal commands. The program is usually called a compiler.
    During the translation program is checked for errors, and if there are errors,
    you get an error message, and the errors must be corrected before the program
    is translated again. All errors are found during translation, but only syntax
    errors, which covers the issue where a statement is not written in accordance
    with the programming language''s rules. A translated program can easily contain
    errors, for example a miscalculation.


    To write a program you must course learn the programming language that is selected,
    but also you must learn how the solution of a task can be formed by statements
    in the language. It is the latter that is the most difficult, and there is rarely
    a clear solution. A solution of a problem by means of a program is also called
    an algorithm. Programming is largely a matter of writing algorithms, something
    that I will return to several times.'
