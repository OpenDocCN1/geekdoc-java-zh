- md: "\n## JAVA 1: BASIC SYNTAX AND SEMANTICS\n### VARIABLES AND DATA TYPES\n\n###\
    \ # 4.4 EXAMPLE: CUBES\n\nI will show a class representing a usual cube with six\
    \ sides. The class can be written as follows:\n\n```java\npackage cubes;\n\nimport\
    \ java.util.*;\n// Class that represents a normal cube\npublic class Cube {\n\
    \    private static Random rand = new Random();\n    private int eyes;\n\n   \
    \ public Cube() {\n        roll();\n    }\n\n    public int getEyes() {\n    \
    \    return eyes;\n    }\n}\n```\n\n![](img/4c19916134263dc09e46f753c669715e_63_0.png)\n\
    \n```java\npublic void roll() {\n\teyes = rand.nextInt(6) + 1;\n}\n\npublic String\
    \ toString() {\n\treturn \"\" + eyes;\n}\n```\n\nThe class has two fields: A class\
    \ variable and an instance variable. The class variable is rand and is an object\
    \ of type Random. It is a random number generator which can generate random numbers.\
    \ It works by reading the machine clock and produces a sequence of values, based\
    \ on the clock's value when the object is created. As you cannot know (assume)\
    \ something about what the clock shows at any given time, the start time is randomly\
    \ and the sequence of generated numbers appears to be random. The variable rand\
    \ must be a class variable, objects of type Cube otherwise would have their own\
    \ random number generator, which could easily result in initialized with the same\
    \ value of the clock. The result would be a number of Cube objects would create\
    \ the same sequence of random numbers. The class's instance variable is called\
    \ eyes and is used to keep track of the value of each Cube. Since two Cube objects\
    \ not necessarily have the same value, this variable must be an instance variable,\
    \ so each object has its copy.\n\nThe class has a method roll(), and simulating\
    \ that you throw the Cube. When the method is performed the class variable rand\
    \ is used. The Random has a method called nextInt(), which returns a non-negative\
    \ integer. In this case, it is one of the values 0, 1, 2, 3, 4 and 5, and when\
    \ one adds 1 the result is a value between 1 and 6 inclusive. The class Random\
    \ is defined in a package called java.util. In order to use classes in this package,\
    \ it is necessary with an import statement. Here the * means that you can use\
    \ all classes in this package.\n\nThe class Cube has a constructor. Since the\
    \ variable eyes is not initialized, the default value is 0. This is unfortunate\
    \ because it is an illegal value. Therefore the constructor rolls the cube and\
    \ ensures that the cube's value from the start is left.\n\nThe class has two other\
    \ methods. The method getEyes() is a method that returns what the cube shows.\
    \ It looks like above. Then there are the method toString(), which returns the\
    \ value of the cube as a text. The syntax of return statement is not obvious,\
    \ but it force the method to return the value of eyes as a text. The class could\
    \ be used in a main() method as follows:\n\n```java\npublic static void main(String[]\
    \ args) {\n    Cube c1 = new Cube();\n    Cube c2 = new Cube();\n    do {\n  \
    \      c1.roll();\n        c2.roll();\n        System.out.println(c1 + \" \" +\
    \ c2);\n    } while (c1.getEyes() != c2.getEyes());\n}\n```\n\nIt requires a little\
    \ explanation when uses statements which have not yet mentioned. The first two\
    \ statements creates Cube objects, and what has been said above, there is nothing\
    \ new. The next statement is a do statement and is an example of a loop. It means\
    \ that the three statements in the block { } is performed until the condition\
    \ is false. The condition uses != meaning meaning from, and thus the condition\
    \ is true as long as the two Cube objects shows a different number. The block\
    \ with the three statements rolls the cubes and prints them. Here you should note\
    \ that each iteration of the loop prints:\n\n```\nc1 + \" \" + c2\n```\n\nand\
    \ here is the value of Cube class's toString() method that are printed. The result\
    \ is that the program rolls the two cubes and prints them until they show the\
    \ same number. A do statement is an example of statement for program control and\
    \ when you see the code, it is not difficult to find out what happens.\n\n###\
    \ EXERCISE 7\n\nIn this exercise, you should write a program, similar to the above,\
    \ but instead of cubes the program works with coins. Add a class called Coin to\
    \ represent a coin that can show head or tail, is a coin that can flip. The class\
    \ should looks like the Cube and have a random number generator. In addition,\
    \ it must have an instance variable to the coin's value:\n\n```java\nprivate char\
    \ value;\n```\n\nThe value must be H or T. The class must include a constructor\
    \ and have three methods:\n- getValue()\n- toString()\n- roll()\n\nHere, the first\
    \ two are written in the same way as the Cube, but the latter requires a little\
    \ more and can be written as follows using the operator:\n\n```java\npublic void\
    \ roll() {\n    value = rand.nextBoolean() ? 'H' : 'T';\n}\n```\n\n![](img/4c19916134263dc09e46f753c669715e_66_0.png)\n\
    \n### # 4.5 ARRAYS\n\nAn array is a container for objects of a certain type, and\
    \ an array is itself an object. An array can contains a number of elements, and\
    \ the number of elements an array can contains defined when the array is created.\
    \ One may illustrate an array as follows:\n\n![](img/4c19916134263dc09e46f753c669715e_67_0.png)\n\
    \nillustrating an array with space for 10 elements. Each element is identified\
    \ by an index, starting with 0. Consider as example the following main() method:\n\
    \n```java\npackage array01;\n\npublic class Array01 {\n    public static void\
    \ main(String[] args) {\n        int[] arr = new int[10];\n        arr[0] = 100;\n\
    \        arr[1] = 200;\n        arr[2] = 300;\n        arr[3] = 400;\n       \
    \ arr[4] = 500;\n        arr[5] = 600;\n        arr[6] = 700;\n        arr[7]\
    \ = 800;\n        arr[8] = 900;\n        arr[9] = 1000;\n        System.out.println(\"\
    Element at index 0: \" + arr[0]);\n        System.out.println(\"Element at index\
    \ 1: \" + arr[1]);\n        System.out.println(\"Element at index 2: \" + arr[2]);\n\
    \        System.out.println(\"Element at index 3: \" + arr[3]);\n        System.out.println(\"\
    Element at index 4: \" + arr[4]);\n        System.out.println(\"Element at index\
    \ 5: \" + arr[5]);\n        System.out.println(\"Element at index 6: \" + arr[6]);\n\
    \        System.out.println(\"Element at index 7: \" + arr[7]);\n        System.out.println(\"\
    Element at index 8: \" + arr[8]);\n        System.out.println(\"Element at index\
