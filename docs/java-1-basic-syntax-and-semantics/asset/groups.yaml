    of the condition that is true. You should not note the parentheses in the condition
    !(a == b). They are necessary because has higher priority than ==.


    # OPERATORS TO CONDITIONS


    It includes the relational operators, comparison operators and the logical operators.
    Generally, these operators are not the big challenges, but you should be aware
    of the logical operators. Consider the following statements


    ```

    int a = 2;

    int b = 3;

    int c = 2;

    System.out.println(a == b || a == c);

    System.out.println(a == b && a == c);

    System.out.println(a == b || a == c && a == c);

    ```


    that prints


    ```

    true

    false

    true

    ```


    It is not so very strange, but the last, where && operator is performed before
    || because of priorities.


