    安装好 Java 和 NetBeans 后，你就可以执行书中描述的所有示例和练习了。


    然而，这里有一个挑战需要解决，否则你将在下一本书开发 GUI 程序时会遇到问题。在终端中执行以下命令：


    ```

    sudo dnf install java-1.8.0-openjdk

    ```


    这可能需要一些时间，但之后一切都安装好了。


