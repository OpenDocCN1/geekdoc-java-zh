    # THE QUESTIONS OPERATOR


    As the last operator will mention the questions operator, which is the only operator
    that takes three arguments. It is of the form


    ```

    condition ? arg1 : arg2;

    ```


    Here are arg1 and arg2 expressions of the same type and the operator is arg1,
    if the condition is true, and otherwise the value is arg2. Consider the following
    statements:


    ```

    int a = 23;

    int b = 17;

    System.out.println(a < b ? a : b);

    ```


    They prints


    ```

    17

    ```


    First println() statement evaluate the condition


    ```

    a < b

    ```


    Because it is false, the statement prints the value of b, that is the smaller
    of the two numbers a and b.


