  md: "# JAVA I: BASIC SYNTAX AND SEMANTICS VARIABLES AND DATA TYPES\n\nThe class\
    \ could be used in a main() method as follows:\n\n```\npublic static void main(String[]\
    \ args)\n{\n    Cube c1 = new Cube();\n    Cube c2 = new Cube();\n    do {\n \
