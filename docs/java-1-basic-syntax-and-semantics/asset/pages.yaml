    should be used to represent the week''s lottery. Both constructors must ensure
    that the lottery row created is legal in relation to the current lottery game,
    and therefore have to use the class LottoGame. In particular, the first is constructor
    complex since it must ensure the creation of a lottery row where all the numbers
    are different, and the row''s numbers are sorted in ascending order. The class
    should have a method validate() with a parameter that is a LottoRow. This parameter
    represents the week''s lottery, and the method should be used to determine how
    many correct numbers there are on the current row. The result is that the method
    updates the result variable, and when it is private, there is also a method that
    can return the value.


    The class LottoRow consists of a member of LottoNumber objects, but instead of
    showing it as a variable in the class''s figure, we show it as a link between
    the two classes:


