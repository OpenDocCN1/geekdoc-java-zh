    one or more arguments

    - consol applications, which also is performed at a command prompt, where the
    user dialogues with the user, where the user must enter values when the program
    is executed

    - GUI-programs, where the program opens one or more windows with components as
    buttons and input fields used by the user to interact with the program


    This division is only for practical reasons, as I will sometimes characterize
    the program examples in relation to this, but common to the three types of programs
    that they are standalone applications that run on a single machine without using
    resources on other machines.


