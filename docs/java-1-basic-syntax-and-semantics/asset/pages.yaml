  md: '# JAVA 1: BASIC SYNTAX AND SEMANTICS


    Here there are several options, but for the sake of this and the next several
    books the Java SE is sufficient, and I would recommend that you download it. Later
    in the context of web applications, you must use Java EE, but I would recommend
    you to first update your IDE at that time since it requires installation of an
    Application Server, and there is no reason to have it running before you have
    the need.


    When the product is downloaded, you''ve got an installation script that you must
    perform. However, you must first change the rights, so the script can be executed.
    Find the script with Files. Right-click the icon and choose Properties. Here,
    select Privileges tab and tick Execution.


    Then open a Terminal, and set current directory to the folder that contains the
    script. The product can now be installed with the following command:


    ```

    sudo sh netbeans-8.1-javase-linux.sh --javahome /usr/java/jdk1.8.0_92/

    ```


    or what your files are called. There may be differences because of the version
    numbers. The command installs the program and will open more windows including
    to where the product is to be installed. For each window you simply accept the
    default, then the application is installed on the machine and a desktop icon is
    created.


    After Java and NetBeans are installed, you can perform all examples and exercises
    described in this book.


    However, there is one challenge back, otherwise you will encounter problems in
    the next book in the development of GUI programs. From a Terminal execute the
    following command:


    ```

    sudo dnf install java-1.8.0-openjdk

    ```


    It may take some time, but then everything is installed.'
