  md: '# JAVA 1: BASIC SYNTAX AND SEMANTICS VARIABLES AND DATA TYPES


    The smallest unit you can use on a digital computer is a bit, and the whole computer''s
    memory consists of a number of devices that can store one bit. One bit can represent
    one of two values, commonly referred to as 0 and 1, and the contents of the computer''s
    memory is always a large number of 0s and 1s. In practice, you do not refer to
    the individual bits, but they are organized in groups of 8 bits, and such a group
    is called a byte. A byte is a pattern consisting of 8 bits, for example


    ```

    00111001

    ```


    What means depends on how a program uses the pattern. Since each of the 8 places
    in a byte, may have two values, a byte therefore can represent different values.
    As is clear from the above simple data types are different in how many bits they
    use to a variable of that type. For example uses an int 32 bits (or 4 bytes),
    and this means that one can represent different integers that is interpreted as
    the numbers starting from -2147483648


    In addition to the primitive data types mentioned above, there is, as already
    mentioned a type String which can contain any text string. For example you can
    write


    ```

    private String name = "Knud den Hedgehog";

    ```


    The statement creates a variable of the type String. You should note that you
    specify the value in quotes. The type String is not a primitive type, but it is
    instead a class, but for now you can ignore it, and variables of the type String
    is used in principle the same way as other variables.


    Primitive variables are assigned a default value of the compiler. The type boolean
    have the default value false, a char has a space as the default value, while the
    other primitive types have the default value 0. A String (which is not a primitive
    type) has no value, which is defined as null.


    As an example, the following statements creates three variables, all of the type
    int:


    ```

    int number1 = 17;

    int number2 = 23;

    int sum = number1 + number2;

    System.out.println("The sum of " + number1 + " + " + number2 + " is " + sum);

    ```


    The first two variables are initialized with numbers, while the last is initialized
    to sum of the first two. The last statement prints the values of the three variables.'
