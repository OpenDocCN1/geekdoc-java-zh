    # 5.3 THE FOR STATEMENT


    The last statement to iterations is called for, and I have already used the statement
    many times when I mentioned arrays. It is the most flexible of the three control
    statements for loops and also the most used. Formally, the syntax is


    ```

    for (initialising; beteling; utryk)

    ```


    The initialization is performed only once and will typical initialize one or more
    variables. The variables created here, is known only in the statement. After the
    initialization of the for statement test a condition, and if it is the true, it
    executes the block. If the condition is not true, the statement is ended, and
    the program continues with the next statement after the for statement. After the
    block have been executed the expression part is performed, and the condition is
    tested again. In the case where the block consists of only a single statement,
    it is as for other control statements allowed to delete the parentheses { and
    }.


