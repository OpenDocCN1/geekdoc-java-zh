  md: '# JAVA 1: BASIC SYNTAX AND SEMANTICS


    # VARIABLES AND DATA TYPES


    That is, to write the type, then the variable name and finally assign a value,
    for example


    ```

    int number = 23;

    ```


    Here is declared a variable called number, that has type int and the value 23.
    Variables should always be initialized, else you can get a translation error.


    When variables must be declared, it is because the compiler must allocate space
    in the machine''s memory, and when the name appears somewhere in the code, the
    compiler must know what the name to check if the variable is used in the proper
    context. If not, the compiler will come up with an error message. The program
    can only be used when it is compiled without errors.


    Java has the following built-in primitive or simple data types:


    +   - byte, which is a data type for an integer. A variable occupies 8 bits, and
    may contain values from -128 to 127 (both inclusive).

    - short, which is a data type for integers. A variable takes up 16 bits and may
    contain values from -32,768 to 32,767 (both inclusive).

    - int, which is a data type for an integer. An variable occupies 32 bits and can
    contain values from -2147483648 to 2147483647 (both inclusive). It is the default
    type for integer.

    - long, which is a data type for an integer. An variable occupies 64 bits and
    can contain values from -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807
    (both inclusive).

    - float, which is a data type for floating point numbers and can be used for decimal
    numbers. A variable occupies 32 bits and can represent decimal numbers with 7–8
    significant digits. It is important to note that the value is always a rounded
    result.

    - double, which is a data type for floating point numbers and can be used for
    decimal numbers. A variable occupies 64 bits and can represent decimal numbers
    with 14 significant digits. It is important to note that the value is always a
    rounded result. This is the default type for a floating point.

    - boolean, which is a data type with two values: false or true. The type is important
    to be able to write conditions and is used specially for program control.

    - char, which is for characters, and a variable of the type char takes up 16 bits.
    Values are numeric codes values from 0 to 65535 (both inclusive), and each character
    is represented by a numeric codes. For example has a large A code 65.'
