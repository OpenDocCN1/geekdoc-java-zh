    is fully documented.


    The task is to write a program that can print lottery tickets on the screen, but
    a program that can also be used from the week''s lottery numbers to determine
    the number of correct rows. The program should be used as a command from a terminal
    where the user with options specify what the program should do. A typical use
    of the program is that the program is used to create the rows you want to play.
    When the week''s winning numbers are drawn, you then use the program to determine
    the game''s outcome. There are several (many) kinds of lottery, example includes
    a lottery with 36 numbers and a lottery with 48 numbers that are examples of Danish
    lottery games. The program must be written so that it can be used for all lottery
    games which is of that nature.


    A lottery game consists of a number of lottery rows, where a row consists of a
    number of different lottery numbers that are integers within a range, and in this
    program, a lottery game is characterized by the following parameters:


    +   -a the minimum allowable number 1

    -b the maximum allowable number 36

    -r number of lottery numbers at a row 7

    -n number of rows to play


    where the column is a default value that corresponds to the ordinary Danish lottery.
    These values can be obtained as options on the command line. You can also use
    the following options:


    +   -o name of the output file for the result, where the default is the screen

    -i name of the input file when the program is used to check the week''s lottery

    -u the week''s lottery numbers separated by spaces


