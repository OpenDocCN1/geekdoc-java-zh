    # INTRODUCTION


    When you have to write software, you could use a simple input program (a text
    editor) to enter the program code, and in principle you will always use a specific
    development tool, but in practice you will always use a development tool, as it
    makes the job much easier. In the following I will everywhere use NetBeans, a
    development tool for a wide variety of tasks, including writing code in Java.
    It is an integrated software package, which includes all the tools necessary for
    the development of a number of different types of programs.


    Java is an object-oriented programming language. The fundamental architectural
    element in a program is a class, and from the programmer''s point of view a Java
    program consists of a family of classes that collectively define all the application''s
    features and functionality. Writing a program is to define – design and write
    the code to the program''s classes. Nothing in Java exists outside of a class.
    A program will also apply other classes that are not written by the programmer,
    but classes coming from the Java API, and thus is available for the programmer
    as the program''s “entry point” and the place where the program starts and this
    class should be written with a special naming, but it is almost the only formal
    requirements for the architecture of a Java program.


    Java is technically both a platform and a programming language. Seen as a programming
    language, it is a high-level language, which is characterized by


    +   - it is a simple language

    - it is an object-oriented language

    - the language is architecture neutral

    - Java programs are portable

    - it supports development of multithreaded applications

    - it supports the development of distributed applications

    - it supports the development of programs with strong security

    - development of effective programs

    - development of robust programs

    - development of maintenance-friendly and dynamic programs'
