    The basic method is called add(), and it adds an object to where the arrow points
    and after the object is added the arrow is moved one place right. When you create
    a ArrayList the arrow is at the location to the extreme left, corresponding to
    the list being empty. As added objects, the array moves to the right, and attempts
    to add an object, and there is no space, the array automatically expands. That
    is exactly why the data structure''s strength, and as a programmer you can fill
    objects into the list without considering whether there is room or not. The class
    has many other methods, as an example you refer to the individual objects in the
    list with a method get() and you can by an index insert elements in the middle
    of the list, delete items, etc., but it is important to bear in mind that an ArrayList
    is a sequence, and it can not have holes. This means in practice if you insert
    an element in the middle of the list, all elements to the right of the new element
    is moved one place, and in the same way if you delete an element then all elements
    to the right of the item that deleted has to move one place left. In general the
