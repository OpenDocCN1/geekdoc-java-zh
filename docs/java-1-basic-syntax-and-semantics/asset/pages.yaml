  md: '# JAVA 1: BASIC SYNTAX AND SEMANTICS


    If you execute the program with arguments 13, 17 and 19, the result will be:


    13 + 17 + 19 = 49


    Arguments for a command or data that is entered into a console application, has
    always the type String, and they cannot be directly used in the calculations.
    It is first necessary to convert the values (which is text) to a numeric value.
    It can, for example be done in the following way:


    ```

    int a = Integer.parseInt(args[0]);

    ```


    Here, the value of args[0] will be converted to an integer - int - and is stored
    in the variable a. In order that it is possible, args[0] must contain a legal
    integer. If it is not the case (because the user used an illegal value), then
    the conversion will raise an exception, which means that the conversion is interrupted
    with an error. When you have that code the code must be converted in a try block.
    If so and there is an exception runtime system interrupts the try block, and the
    control is transferred to the subsequent catch block. In this case, it that one
    of the three arguments cannot be converted to an int, then the program will catch
    part and prints an error message.


    If the arguments can be converted correctly the result is printed as:


    a + " " + b + " " + c + " " = " " + (a + b + c)


    This is a relatively complex expression, and may not be easy to read, but for
    the understanding of the expression, it is easiest to compare with the result:


    13 + 17 + 19 = 49


    The numbers 13, 17 and 19 are the values of the three variables a, b and c. The
    + signs in quotations is just text and included in the results as strings. If
    you for example consider


    a + " " +


    the + sign means concatenation of the value of the variable a and the value of
    the text " + \ , which is a sign with a gap on both sides. The last parentheses
    in the result expression


    (a + b + c)


    calculates the sum of the three variables, and from that the value 49.


