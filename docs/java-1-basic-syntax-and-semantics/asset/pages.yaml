  md: '# 8 FILES


    Files are first explained in the book Java 5, but because I use files in the following
    chapter and also in the following books I will at this location show a little
    bit about what it takes to use a file – and it is not necessarily much.


    From the perspective of the system file is a sequence of bytes, and one can in
    many ways think of a file as an infinitely large array, where the first byte has
    index 0:


    ![](img/4c19916134263dc09e46f753c669715e_114_0.png)


    Of course, a file will not be infinite and there is an upper limit determined
    by the operating system and disk space, but in practice it is limitations that
    you almost always will ignore. When data is saved in a file and above, all when
    data is to read again, sequences of bytes must be converted from and to the data
    objects used by the application, and you must specify where in the file to write
    or read. It''s all that kind of things that the Java IO classes take care of,
    and for many file operations goes all by itself – when you know what you have
    to write.


    In the following I will only show how one can write and read text files, and how
    to write any object to a file and read it again. The last is also known as object
    serialization / deserialization. In both cases it is simply a matter of accepting
    the syntax of to write, but if you can manage files and serialize objects to a
    file, you also know most of what is necessary to use files in your programs.


    # 8.1 TEXT FILES


    A file is a file that contains usual lines of text separated by carriage returns.
    From Java you use such files by writing and reading one line at a time. If you
    have to write a text file, the process is:


    +   1. open the file

    2. create the line to be written to then file

    3. write the line to the file

    4. repeat these two operations as long as there are more lines

    5. close the file'
