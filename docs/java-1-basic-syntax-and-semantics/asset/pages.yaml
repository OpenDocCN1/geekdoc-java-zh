    To construct program code as a family of software objects provides a number of
    advantages:


    +   - Modularity, where the code for an object can be written and maintained independently
    of the other objects.

    - Information hiding, where all interaction with an object is by means of methods.
    The details concerning state of the object and the internal implementation remain
    hidden from the outside world.

    - Code Reuse, where already developed objects (perhaps written by another developer)
