    The operators are special symbols known by the compiler, that perform specific
    operations on one, two or three operands, which are typically values, or variables.
    I have already used the + , as an operator between strings act as string concatenation,
    while the operator between numbers is interpreted as addition. Also a declaration
    in which a variable is assigned a value, the equating is an operator.


    The operators have different priorities, which affect the order in which they
    are evaluated if an expression contains multiple operators, and the following
    table shows Java''s in order of priority with falling down. If an expression contains
    multiple operators, the operators with the highest priority are evaluated first.
    Operators with the same priority are evaluated from left to right. It does not
    apply to the assignment operators, which is evaluated from right to left.'
