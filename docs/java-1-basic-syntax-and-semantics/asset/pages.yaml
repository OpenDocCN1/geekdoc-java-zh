    # 8.2 SERIALIZATION OF OBJECTS


    It is also possible to store objects in a file, and actually it is not quite simple.
    When a file is of course just a sequence of bytes, this means that the object
    and its data have to be streamed to a sequence of bytes, a process that is called
    for serialization. It might not be so difficult, but the object must be able to
    be read again, and it might be possible to convert a sequence of bytes into an
    object of one type or another. It is only possible if together the object is saved
    information about its type and serialization must not only stream object''s data,
    but also information on the type. With this information it is possible to restore
    an object from a sequence of bytes, a process that we call deserialization. It
    sounds complicated, and it is that too, but seen from the programmer, it is simple,
    because Java has the necessary classes, which takes care of it.


    I will write a program that stores an ArrayList with objects of the type Name,
    where it is the same class that you have seen in chapter 7, however, with one
    change:


    ```

    import java.io.*;

    public class Name implements Comparable<Name>, Serializable {


    ```


