  md: "# JAVA 1: BASIC SYNTAX AND SEMANTICS VARIABLES AND DATA TYPES\n\n```\npublic\
    \ void roll() {\n\teyes = rand.nextInt(6) + 1;\n}\n```\n\n```\npublic String toString()\
    \ {\n\treturn \"\" + eyes;\n}\n```\n\nThe class has two fields: A class variable\
    \ and an instance variable. The class variable is rand and is an object of type\
    \ Random. It is a random number generator which can generate random numbers. It\
    \ works by reading the machine clock and produces a sequence of values, based\
    \ on the clock's value when the object is created. As you cannot know (assume)\
    \ something about what the clock shows at any given time, the start time is randomly\
    \ and the sequence of generated numbers appears to be random. The variable rand\
    \ must be a class variable, objects of type Cube otherwise would have their own\
    \ random number generator, which could easily result in initialized with the same\
    \ value of the clock. The result would be a number of Cube objects would create\
    \ the same sequence of random numbers. The class's instance variable is called\
    \ eyes and is used to keep track of the value of each Cube. Since two Cube objects\
    \ not necessarily have the same value, this variable must be an instance variable,\
    \ so each object has its copy.\n\nThe class has a method roll(), and simulating\
    \ that you throw the Cube. When the method is performed the class variable rand\
    \ is used. The Random has a method called nextInt(), which returns a non-negative\
    \ integer. In this case, it is one of the values 0, 1, 2, 3, 4 and 5, and when\
    \ one adds 1 the result is a value between 1 and 6 inclusive. The class Random\
    \ is defined in a package called java.util. In order to use classes in this package,\
    \ it is necessary with an import statement. Here the * means that you can use\
    \ all classes in this package.\n\nThe class Cube has a constructor. Since the\
    \ variable eyes is not initialized, the default value is 0. This is unfortunate\
    \ because it is an illegal value. Therefore the constructor rolls the cube and\
    \ ensures that the cube's value from the start is left.\n\nThe class has two other\
    \ methods. The method getEyes() is a method that returns what the cube shows.\
    \ It looks like you met above. Then there are the method toString(), which returns\
    \ the value of the cube as a text. The syntax of the return statement is not obvious,\
    \ but it force the method to return the value of the variable eyes as a text."
