    There are some syntax for how to define literals, and below are the most important.


    # LITERALS FOR INTEGERS


    Generally, you specify an integer using the digits 0–9, and thus a number from
    the 10-number system. An integer is interpreted long if it ends with the letter
    L or l. Otherwise, the type is int. It is recommended that you use a large L,
    as a small l is hard to distinguish from the digit 1.


    You can also specify that the integer should be interpreted in hexadecimal starting
    by the number with 0x, and the symbols are the digits and the letters A, B, C,
    D, E and F. Finally, you can specify that the integer should be interpreted binary
    starting the integer with 0b and then the symbols 0 and 1.'
