    \ The first two statements creates Cube objects, and to what has been said above,\
    \ there is nothing new in. The next statement is a do statement and is an example\
    \ of a loop. It means that the three statements in the block { and } is performed\
    \ until the condition after while is false. The condition uses the operator !=\
    \ meaning different from, and thus the condition is true, as long as the two Cube\
    \ objects shows a different number for the eyes. The block with the three statements\
    \ rolls the cubes and prints them. Here you should note that each iteration of\
    \ the loop prints\n\n```\nc1 + \" \" + c2\n```\n\nand here is the value of the\
    \ Cube class's toString() method that are printed. The result is that the program\
    \ rolls the two cubes and prints them until they show the same number of eyes.\n\
    \nA do statement is an example of a statement for program control and are discussed\
