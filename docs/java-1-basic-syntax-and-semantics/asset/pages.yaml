  md: '# VARIABLES AND DATA TYPES


    Programs has to deal with data, and for that they need a way where to save or
    store data. To that purpose use variables that are items, where the program may
    store a value. You must not note that I have already used variables associated
    with data entry. A variable is characterized by


    +   - a name

    - a type

    - operators


    Variables must have a name, and so you can refer to them in the program. Java
    is similar to other modern programming languages relatively flexible in terms
    of variables, but the following shall (should) be:


    +   - a variable name must start with a letter, a dollar sign ''$'' or an underscore
    ''_''

    - a variable name should always start with a lowercase letter, and one should
    avoid ''$'' and only occasionally use `.`

    - then to follow any number of characters consisting of letters, digits, $ and
    _

    - a name must not contain spaces

    - the name of a variable must not be a reserved word, that is a word that has
    specific meaning in Java


    In addition a variable name should tell something about what it is used for. Use
    whole words instead of cryptic abbreviations. It will make the code easier to
    read and understand. If you have long names consisting of several words, you can
    increase readability by letting a word (except the first) start with a capital
    letter such as `customerAddress`. Alternatively, is there anyone who knows `customer_address`,
    but generally avoid very long names.


    If you do not break these rules, you have never problems with names of variables,
    but some other characters are actually allowed.


    Variables have a type that indicates values can be stored in them, and how much
    a variable is filling in the memory''s memory. The type determines simultaneously
    the operations that can be performed on a variable, that is what to do with it.


    Variables must be created or declared before they can be used. This is done by
    a statement of the form:


    ```

    type name = value;

    ```'
