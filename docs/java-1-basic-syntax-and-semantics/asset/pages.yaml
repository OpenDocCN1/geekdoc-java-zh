  md: "# JAVA 1: BASIC SYNTAX AND SEMANTICS\n\nIf the condition is true, the statement\
    \ after the for statement is executed, which here is\n\narr[i] = rand.nextInt();\n\
    \nThis means that the i-th element in the array is assigned a value. Next, the\
    \ third part of the for statement is executed that add 1 to the variable i, and\
    \ then the statement test the condition again and everything repeats itself. Since\
    \ the variable for each iteration is 1 higher, all places in the array are referred\
    \ until there are no more. main() has another statement, and it works in principle\
    \ the same way. It runs through the array's elements for place. The first for\
    \ statement initializes the elements, while the others print.\n\nAs another example,\
