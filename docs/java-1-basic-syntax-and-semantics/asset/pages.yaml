  md: "# JAVA: BASIC SYNTAX AND SEMANTICS FILES\n\nFor an object to be serialized,\
    \ its class must implement Serializable. It is an empty interface, which does\
    \ not define any methods or contains anything else, and such an interface are\
    \ sometimes referred to as a marker interface. Indeed, it may sound strange, what\
    \ it should do, and you must in this book take note of the needs to implement\
    \ that interface if the objects must be able to be serialized.\n\nConsider the\
    \ following method, which creates an ArrayList with 4 Name objects:\n\n```\nprivate\
    \ static ArrayList<Name> createNames()\n{\n    ArrayList<Name> list = new ArrayList();\n\
    \    list.add(new Name(\"Karlo\", \"Jensen\"));\n    list.add(new Name(\"Gudrun\"\
    , \"Andersen\"));\n    list.add(new Name(\"Valdemar\", \"Hansen\"));\n    list.add(new\
    \ Name(\"Olga\", \"Knudsen\"));\n    return list;\n}\n```\n\nThe method requires\
    \ no explanation, but the goal is to serialize the ArrayList that the method returns.\
    \ It is possible, because also the ArrayList is defined Serializable, and because\
    \ the list contains Serializable objects, the entire structure can be serialized\
    \ as an object. In this done as follows:\n\n```\nprivate static void test()\n\
    {\n    try\n    {\n        ObjectOutputStream stream =\n        new ObjectOutputStream(new\
