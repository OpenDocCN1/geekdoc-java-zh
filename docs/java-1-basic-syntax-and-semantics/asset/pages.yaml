  md: "# JAVA 1: BASIC SYNTAX AND SEMANTICS\n\n# VARIABLES AND DATA TYPES\n\n```\n\
    package bankprogram;\n\npublic interface Note {\n    public int getValue();\n\
    \    public void print();\n}\n```\n\nIt looks like the definition of a class,\
    \ but you should notice that it is simply a definition and that the interface\
    \ does not contain code that implements something.\n\nGiven an interface you can\
    \ define that a class must implement this interface. Thus you specify that the\
    \ class has the methods that the interface defines. For example the class BankNote\
    \ can implement the interface Note as follows:\n\n```\npackage bankprogram;\n\n\
    public abstract class BankNote implements Note {\n    private int value;\n\n \
    \   public BankNote(int value) {\n        this.value = value;\n    }\n\n    public\
    \ int getValue() {\n        return value;\n    }\n```\n\nNote first the word implements\
    \ defines that the class implements an interface. This means that the class should\
    \ have two methods getValue() and print() – it must implement the methods that\
    \ the interface defines. It is not the case, since it does not implement them\
    \ the method print(). It is not that because it does not know how this method\
    \ should be written. It is the derived classes BankNote100 and BankNote200, that\
    \ has knowledge. The problem is solved by defining the class as abstract. The\
    \ method then has to be implemented in the derived classes, what it indeed is.\
    \ That a class is abstract has further that consequence that you cannot instantiate\
    \ objects whose type is the abstract class – in this case BankNote. It is also\
    \ reasonable, else you could instantiate notes with an arbitrary value, which\
    \ does not model the real world in a meaningful way. Below is a new version of\
    \ main() program:"
