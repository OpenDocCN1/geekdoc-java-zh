    The last two options are used to check the lottery numbers of the week, while
    the other five options are used to create lottery rows, that is a new game. The
    program is to create Lotto, and below are examples of legal commands:


    ```

    java -jar Lotto.jar -n 20

    java -jar Lotto.jar -a 1 -b 48 -r 6 -n 20 -o uge42

    java -jar Lotto.jar -i uge42 -u 2 13 18 22 34 35

    java -jar Lotto.jar -i uge42 -u 2 13 18 22 34 35 -o uge42-res

    ```


    Generally, there are the following requirements for the arguments on the command
    line:


    +   - All options have a default value (a, b, r, o) may be omitted.

    - Options may appear in any order.

    - There must be no conflicting options (for example -r and -i) on the same command
    line.


    The concept of a lottery ticket is not included in the solution as in this program
    does not make sense – a lottery game is basically one large coupon that can have
    any number of rows.


    In terms of the result of a lottery there are the following requirements:


    +   1. The numbers in each lot row should be sorted in ascending order.

    2. The same row must not occur several times.

    3. The rows should be sorted in ascending order (after the first number, after
    the next number, etc.).

    4. The first line in the result defines the game and contains the smallest and
    largest legal lottery number, and the number of rows in a row and the week number.


    With regard to the results of the verification it is a file (the screen by default)
    that contains all rows, where each row is added a number indicating the number
    of correct rows. The result is sorted by this number in descending order.


    If you enter an illegal command, for example because it is wrong, missing or conflicting
    options, illegal lottery numbers, illegal files., the program must terminate with
    an error message and the program syntax. If checking the week''s lottery there
    is an illegal row, the number after the row should be replaced with a short error
    message, and possibly illegal rows should be added last in the result.


