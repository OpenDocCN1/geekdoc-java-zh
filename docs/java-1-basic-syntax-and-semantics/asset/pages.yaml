    # PROGRAM CONTROL


    # 5 PROGRAM CONTROL


    In this chapter I will deal with control statements in Java, and in fact I have
    already dealt three of them:


    +   - if

    - do

    - for


    The first is used to write conditions in the program, while the last two is for
    loops. There are two other control statements, and with these statements available,
    one is able to write programs that perform something concrete and real data processing,
    and not just programs that prints on the screen. Therefore, this chapter will
    largely consist of examples you are presented for the development of Java applications
    in practice. Put differently, this chapter focuses on algorithms.


    When wee talk about control statements, it is because it''s statements, which
    controls the execution of other statements partly can be a single statement and
    also can be a block. A block encapsulates statements using the parentheses { and
    } and a block of statements can be treated as statements as a whole, for example
    using control statements. Blocks appear in several places in Java, for example
    are the statements in a method block.


    General, statements are performed in the order as they are written in a method,
    but using control statements, it is possible to deviate from this sequential order,
    which is necessary in general to be able to write programs that solve something
    interesting.


    # 5.1 THE IF STATEMENT


    Java has 9 control statements, and I have already mentioned and used if. As an
    example you can write something like the following:


    ```

    if (a > b) a --;

    ```'
