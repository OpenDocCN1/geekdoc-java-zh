  md: '# JAVA : BASIC SYNTAX AND SEMANTICS


    # HELLO WORLD


    There is only one comment back, which is at the top and says something about what
    the program does. The rest of the code is a Java program consists of classes,
    and in this case there is one class HelloWorld and has the name that I chose as
    project name. The class consists of a method main(), which has a single statement
    - not created by NetBeans, but I entered. It is a statement that prints a text
    on the screen.


    The code is simple, and so far you just accept that it should be written, as shown
    above, but there is however a few things that you should note.


    Java is case-sensitive, everywhere you must distinguish between uppercase and
    lowercase letters.


    Every Java program consists as already mentioned by at least one class HelloWorld.
    In this case, the class has only one method called main(), which is the method
    that is called when the program starts. A method consists of statements that can
    be perceived as commands that perform one or other on the machine. A method called
    means that the methods are performed. The method main() must be prefixed by the
    words public static void. The explanation will follow. In this case, main() has
    only a single statement, that write a text on the screen. System.out.println()
    is actually a method in a class PrintStream, that other things, represents the
    screen. When the program is running, nothing happens that the println() statement
    in main() is performed that prints a text on the screen.


    Note that in Java, each statement ends with a semicolon – above there is a semicolon
    before System.out.println(). It tells the compiler where a statement ends.


    In Java classes are grouped in so-called packages. A class''s full name consists
    of the package that it is grouped under, as well the class name. NetBeans automatically
    define a package for a program that is the application name written in lowercase,
    and the first statement is a package statement indicating the class''s package.
    A package statement must be the first statement in the file that contains a class,
    but can be prefixed by a comment. Note that in Java you generally has place each
    class in its own file, but more on later.


    # 2.3 RUN THE PROGRAM


    When the program is written as above (without errors), you can can from the menu
    in NetBeans choose


    ```

    Run | Run Project (HelloWorld)

    ```'
