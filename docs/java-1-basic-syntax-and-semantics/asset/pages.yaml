  md: "# JAVA 1: BASIC SYNTAX AND SEMANTICS\n\n# VARIABLES AND DATA TYPES\n\n# ##\
    \ PACKAGES\n\nA package is a so-called namespace that organizes a family of related\
    \ classes and interfaces. Conceptually, you can think of a package in the same\
    \ way as a folder in which a package contains classes which somehow belong together.\
    \ Since programs written in Java may consist of hundreds or thousands of individual\
    \ classes, it makes sense to keep things separated by placing related classes\
    \ and interfaces in packages.\n\nWhen NetBeans create a project, it also create\
    \ a package and place the project's classes and interfaces in that package, for\
    \ example\n\n```\npackage bankprogram;\n```\n\n```\npublic interface Note\n{\n\
    \    public int getValue();\n    public void print();\n}\n```\n\nwhich means the\
    \ interface is in the package bankprogram. So long that the project contains only\
    \ a single package, it is not something you need to think about, but it means\
    \ exactly that the name of the type Note is\n\nbankprogram.Note\n\nA package statement\
    \ defines the package that a type belongs. It must be the first statement in the\
    \ file that defines a type, but may be preceded by a comment.\n\nThe Java platform\
    \ includes a huge library (a collection of packages), which contains components,\
    \ the programmer may use in his own applications. This Application Programming\
    \ Interface is widely abbreviated as API. This library represents the tasks most\
    \ often associated with general issues within the program development, and examples\
    \ are packages for developing applications with a graphical interface.\n\nTo refer\
    \ to classes other than in the defining package, the package must be referenced\
    \ with an import statement. The following statement\n\n```\nSystem.out.print(\"\
    100 kr., \");\n```\n\nprints a text, and System is actually the name of a class\
    \ that exists in the package java.lang. This package contains all of the most\
    \ common classes from the Java API, and when it is not necessary to an import\
    \ statement for this package, it is because the compiler as default imports the\
    \ package."
