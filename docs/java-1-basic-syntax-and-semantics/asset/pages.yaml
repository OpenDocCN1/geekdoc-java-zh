    written. It is important that the program is written in such a way that the code
    is easy to read and understand, and it is important that the code is written so
    that a change in one place does not mean large parts of the program must be rewritten.
    To meet these goals the program must be organized into good classes, and the question
    is what it is and how to find these classes. It is not simple, and there is not
    a unique solution, and this is largely what the following books are about, but
    below will explain a little about how this program is organized into classes,
    and thus the program''s architecture.


    If one considers the concept of a lottery row, then it is a sequence of different
    integers (lottery numbers) within a range. The Lotto number is nothing more than
    an int, but it have nevertheless chosen to define a class to represent a lottery
    number. The reason is that the class must be to validate a lottery number and
    check that it is legal in relation to the current lotto game, and the program
    should therefore have the following class:


    | LottoNumber |

    | - int: number |

    | + LottoNumber() |

    | + LottoNumber(int) |

    | + getNumber(): int |


    Often you will in system development illustrate the classes that you need. It
    says that the program must have a class called LottoNumber, and this class must
    have a private int variable called number. In this case, this represents the value
    of a lottery number. The figure shows that the class should have two constructors,
    where the first is a default constructor that should create a LottoNumber object
    with a random legal value, while the other has the value as a parameter. It must
    be used when the program creates the week''s lottery. In addition the figure shows
    that the class must have a method getNumber() to returns the lottery number''s
    value.'
