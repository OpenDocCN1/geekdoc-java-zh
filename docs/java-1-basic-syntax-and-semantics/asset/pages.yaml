  md: "# JAVA 1: BASIC SYNTAX AND SEMANTICS\n\nAfter the word if is a condition in\
    \ parentheses, and the meaning is that the subsequent statement that is an assignment,\
    \ is only performed if the condition is true. If not, the statement is ignored.\
    \ As another example, the following code shows an if statement that controls a\
    \ block:\n\n```\nif (a > b) {\n    int c = a;\n    a = b;\n    b = c;\n}\n```\n\
    \nThe block consist of three statements. In general, a block may consist of any\
    \ number of statements and especially declaration of a variable. In particular,\
    \ attention should be paid to the fact that if a variable is declared in a block,\
    \ it is only known within the block. It is local to the block and is created when\
    \ the program goes into the block where it is defined. It will be removed when\
    \ the program exits the block. Note that the if statement reverses the values\
    \ of the two variables a and b, when a is greater than b.\n\nFormally, the syntax\
    \ of an if statement\n\n```\nif (condition) block\n```\n\nwherein block is a block\
    \ of statements. If the block consists of a single statement, it is allowed to\
    \ omit block boundaries { and } – as in the first example above. Some choose of\
    \ readability always to use { and }, even if there is only one statement, and\
    \ it is up to you to choose what you find most readable. The condition must be\
    \ an expression type is boolean, and thus an expression that evaluates to false\
    \ or true.\n\n# IF-ELSE STATEMENT\n\nAnother control statement is called if-else,\
    \ but it is little more than an extension of the if statement. As an example you\
    \ can write the following:\n\n```\nif (a > b) a = b; else b = a;\n```\n\nThe meaning\
    \ is that if the condition is true, then the statement after the parentheses is\
    \ executed, and otherwise the statement after else is executed. The difference\
    \ is that if-else always does something. Formally, the syntax is:\n\n```\nif (condition)\
    \ block_1 else block_2\n```"
