  \ ...;\nStream<String> result = strings.filter(pattern.asPredicate());\n```\n\n\
  结果包含所有匹配该正则表达式的字符串。\n\n现在考虑另一种用例——在输入字符串中找到正则表达式的所有匹配项。使用这个循环：\n\n点击此处查看代码图片\n\n\
  ```java\nMatcher matcher = pattern.matcher(input);\nwhile (matcher.find()) {\n \
  \   String match = matcher.group();\n    ...\n}\n```\n\n通过这种方式，你可以逐一处理每个匹配项。下一节将展示如何统一处理所有匹配项。\n\
  \n### 9.4.5 Flags\n\n若干标志会改变正则表达式的行为。你可以在编译模式时指定它们：\n\n点击此处查看代码图片\n\n```java\nPattern\
  \ pattern = Pattern.compile(regex, Pattern.CASE_INSENSITIVE | Pattern.UNICODE_CHARACTER_CLASS);\n\
  ```\n\n或者你可以在模式内部指定它们：\n\n点击此处查看代码图片\n\n```java\nString regex = \"(?iU:expression)\"\
  ;\n```\n\n这里的标志：\n\n- `Pattern.CASE_INSENSITIVE` 或 `i`: 不区分大小写。默认情况下，此标志仅考虑 ASCII\
  \ 字符。\n- `Pattern.UNICODE_CASE` 或 `u`: 当与 `CASE_INSENSITIVE` 结合时，使用 Unicode 大小写进行匹配。\n\
  - `Pattern.UNICODE_CHARACTER_CLASS` 或 `U`: 选择 Unicode 字符类而非 POSIX。隐含了 `UNICODE_CASE`。\n\
  - `Pattern.MULTILINE` 或 `m`: 让 `^` 和 `$` 匹配行的开始和结束，而不是整个输入。\n- `Pattern.UNIX_LINES`\
  \ 或 `d`: 在多行模式下，只有 `'\\n'` 是换行符（行终止符）。\n- `Pattern.DOTALL` 或 `s`: 让 `.` 符号匹配所有字符，包括换行符。\n\
  - `Pattern.COMMENTS` 或 `x`: 忽略空白字符和注释（从 `#` 到行尾）。\n- `Pattern.LITERAL`: 模式按字面量处理且必须精确匹配，可能的大小小写除外。\n\
  - `Pattern.CANON_EQ`: 考虑 Unicode 字符的规范等效性。例如，u 后面跟着 ¨（变音符号）匹配 ü。\n\n最后两个标志无法在正则表达式内部指定。\n\
  \n## 9.5 序列化\n\n在接下来的章节中你将学习对象序列化——一种将对象转换为字节流的机制，以便将其发送到其他地方或存储在磁盘上，并从这些字节重构对象。\n\
  \n序列化是分布式处理的一种基本工具，对象可以从一个虚拟机发送到另一个虚拟机。它也被用于故障转移和负载均衡，此时可以将序列化的对象移动到另一台服务器。如果你处理服务器端软件，通常需要为类启用序列化。接下来的章节将告诉你如何这样做。\n\
  \n### 9.5.1 Serializable 接口\n\n\n\n\n\n为了使一个对象能够序列化——也就是说，转换为字节流——它必须是实现了 `Serializable`\
  \ 接口的类的实例。这是一个标记接口，不包含任何方法，类似于你在第 4 章中看到的 `Cloneable` 接口。\n\n例如，要使 `Employee` 对象可序列化，需要将该类声明为：\n\
  \n点击此处查看代码图像\n\n```java\npublic class Employee implements Serializable {\n    private\
  \ String name;\n    private double salary;\n    ...\n}\n```\n\n如果所有实例变量都是原始类型或 `enum`\
  \ 类型，或者引用可序列化的对象，那么实现 `Serializable` 接口是安全且适当的。标准库中的许多类都是可序列化的。你在第 7 章中看到的数组和集合类，只要它们的元素是可序列化的，它们本身也是可序列化的。更广泛地说，从一个可序列化对象可以到达的所有对象都需要是可序列化的。\n\
  \n在 `Employee` 类的情况下，实际上对大多数类来说，这没有问题。在接下来的章节中，你将看到当需要额外帮助时该如何做。\n\n要序列化对象，你需要一个\
  \ `ObjectOutputStream`，它是通过另一个接收实际字节的 `OutputStream` 构建的。\n\n点击此处查看代码图像\n\n```java\n\
  ObjectOutputStream out = new ObjectOutputStream(\n    Files.newOutputStream(path));\n\
  ```\n\n现在调用 `writeObject` 方法：\n\n点击此处查看代码图像\n\n```java\nEmployee peter = new Employee(\"\
  Peter\", 90000);\nEmployee paul = new Manager(\"Paul\", 180000);\nout.writeObject(peter);\n\
  out.writeObject(paul);\n```\n\n要将对象读回，需要构造一个 `ObjectInputStream`：\n\n点击此处查看代码图像\n\
  \n```java\nObjectInputStream in = new ObjectInputStream(\n    Files.newInputStream(path));\n\
  ```\n\n使用 `readObject` 方法按照写入时的相同顺序检索对象。\n\n点击此处查看代码图像\n\n```java\nEmployee e1 =\
  \ (Employee) in.readObject();\nEmployee e2 = (Employee) in.readObject();\n```\n\n\
  当一个对象被写入时，类名以及所有实例变量的名称和值都会被保存。如果实例变量的值属于原始类型，它将以二进制数据的形式保存。如果它是一个对象，则会再次使用 `writeObject`\
  \ 方法写入。\n\n当一个对象被读入时，过程是反的。类名以及实例变量的名称和值会被读取，对象会被重新构建。\n\n这里有一个陷阱。假设有两个指向同一个对象的引用。假设每个员工都有指向其老板的引用：\n\
  \n点击此处查看代码图像\n\n```java\nEmployee peter = new Employee(\"Fred\", 90000);\nEmployee\
  \ paul = new Manager(\"Barney\", 105000);\nManager mary = new Manager(\"Mary\",\
  \ 180000);\npeter.setBoss(mary);\npaul.setBoss(mary);\nout.writeObject(peter);\n\
  out.writeObject(paul);\n```\n\n在读回这两个对象时，它们需要拥有*同一个*老板，而不是指向两个相同但不同对象的引用。\n\n为了实现这一点，每个对象在保存时都会获得一个*序列号*。当你将对象引用传递给\
  \ `writeObject` 时，`ObjectOutputStream` 会检查该对象引用之前是否被写入过。如果是，它只会写入序列号，而不会重复对象的内容。\n\
  \n同样，`ObjectInputStream` 会记住它遇到过的所有对象。当读取指向重复对象的引用时，它只是简单地返回之前读过的对象的引用。\n\n### 9.5.2\
  \ Transient 实例变量\n\n某些实例变量不应该被序列化——例如，在对象重新构建时没有意义的数据库连接。此外，当对象保留一个值的缓存时，丢弃缓存并重新计算可能比存储它更好。\n\
  \n为了防止实例变量被序列化，只需用 `transient` 修饰符标记它。此外，如果实例变量属于不可序列化的类，也将其标记为 `transient`。在对象序列化时，transient\
  \ 字段总是总是被跳过。\n\n### 9.5.3 readObject 和 writeObject 方法\n\n在极少数情况下，你需要调整序列化机制。可序列化类可以通过定义具有以下签名的方法，在默认读写行为中添加任何所需的操作：\n\
  \n点击此处查看代码图像\n\n```java\nprivate void readObject(ObjectInputStream in)\n    throws\
  \ IOException, ClassNotFoundException\nprivate void writeObject(ObjectOutputStream\
  \ out)\n    throws IOException\n```\n\n然后，对象头将继续如常地写入。这是一个典型的示例。假设你想序列化一个存储 `String`\
  \ 和 `Point2D` 的类 `LabeledPoint`。首先，你需要将 `Point2D` 字段标记为 `transient`。\n\n点击此处查看代码图像\n\
  \n```java\npublic class LabeledPoint implements Serializable {\n    private String\
  \ label;\n    private transient Point2D point;\n}\n```\n\n在 `writeObject` 方法中，通过调用\
  \ `defaultWriteObject` 方法首先写入 `label` 变量。然后，使用 `DataOutput` 接口的 `writeDouble` 方法写入坐标。\n\
  \n点击此处查看代码图像\n\n```java\nprivate void writeObject(ObjectOutputStream out)\n    throws\
  \ IOException {\n    out.defaultWriteObject();\n    out.writeDouble(point.getX());\n\
  \    out.writeDouble(point.getY());\n}\n```\n\n在 `readObject` 方法中，反转该过程：\n\n点击此处查看代码图像\n\
  \n```java\nprivate void readObject(ObjectInputStream in)\n    throws IOException,\
  \ ClassNotFoundException {\n    in.defaultReadObject();\n    double x = in.readDouble();\n\
  \    double y = in.readDouble();\n    point = new Point2D(x, y);\n}\n```\n\n`readObject`\
  \ 和 `writeObject` 方法只需要读取和写入它们自己的实例变量。它们不应该关心父类的数据。\n\n* *\n\n![图像](img/00005.jpeg)\
  \ 注意\n\n类可以通过实现 `Externalizable` 接口并提供方法来定义自己的序列化格式：\n\n点击此处查看代码图像\n\n```java\n\
  public void readExternal(ObjectInput in)\npublic void writeExternal(ObjectOutput\
  \ out)\n```\n\n读取外部化对象时，对象流使用无参构造函数创建一个对象，然后调用 `readExternal` 方法。这可以提供更好的性能，但很少使用。\n\
  \n* *\n\n### 9.5.4 readResolve 和 writeReplace 方法\n\n我们通常认为对象只能通过构造函数创建。然而，反序列化的对象*不是*通过构造的。它的实例变量仅仅是从对象流中恢复的。\n\
  \n如果构造函数强制执行某些条件，就会出现问题。例如，单例对象可能实现为构造函数只能被调用一次。在 Java 有 `enum` 结构之前，枚举类型通过具有私有构造函数的类来模拟，该构造函数为每个实例被调用一次。另一个例子是，数据库实体可以被构造为始终来自管理实例池。\n\
  \n\n\n\n\n这些情况极其罕见。如今，`enum` 类型的序列化是自动的。而且，你不应该为单例实现自己的机制。如果你需要一个单例，可以创建一个只有一个实例的枚举类型，按照惯例，该实例命名为\
  \ `INSTANCE`。\n\n点击此处查看代码图片\n\n```java\npublic enum PersonDatabase {\n    INSTANCE;\n\
  \    public Person findById(int id) { ... }\n    ...\n}\n```\n\n现在，让我们假设你正处于一种罕见的情况下，即你想控制每个反序列化实例的标识性。例如，假设一个\
  \ `Person` 类在反序列化时想要从数据库中恢复它的实例。那么，不要序列化对象本身，而是序列化一个可以定位或构造该对象的代理。提供一个返回代理对象的 `writeReplace`\
  \ 方法：\n\n点击此处查看代码图片\n\n```java\npublic class Person implements Serializable {\n\
  \    private int id;\n    // 其他实例变量\n    ...\n    private Object writeReplace()\
  \ {\n        return new PersonProxy(id);\n    }\n}\n```\n\n当一个 `Person` 对象被序列化时，它的任何实例变量都不会被保存。相反，会调用\
  \ `writeReplace` 方法，并且*它的返回值*会被序列化并写入流中。\n\n代理类需要实现一个产生 `Person` 对象的 `readResolve`\
  \ 方法：\n\n点击此处查看代码图片\n\n```java\npublic class PersonProxy implements Serializable\
  \ {\n    private int id;\n    public PersonProxy(int id) {\n        this.id = id;\n\
  \    }\n    public Object readResolve() {\n        return PersonDatabase.INSTANCE.findById(id);\n\
  \    }\n}\n```\n\n当 `readObject` 方法在 `ObjectInputStream` 中发现 `PersonProxy` 时，它会反序列化该代理，调用它的\
  \ `readResolve` 方法并返回结果。\n\n### 9.5.5 版本控制\n\n序列化旨在将对象从一个虚拟机发送到另一个虚拟机，或者用于状态的短期持久化。如果你将序列化用于长期持久化，或者用于类在序列化和反序列化之间可能发生变化的任何，你需要考虑当类演进时会发生什么。版本\
  \ 2 能读取旧数据吗？仍在使用版本 1 的用户能读取新版本生成的文件吗？\n\n序列化机制支持简单的版本控制方案。当对象被序列化时，类名和它的 `serialVersionUID`\
  \ 都会被写入对象流。该唯一标识符由实现者通过定义实例变量来分配：\n\n点击此处查看代码图片\n\n```java\nprivate static final\
  \ long serialVersionUID = 1L; // 版本 1\n```\n\n当类以不兼容的方式演进时，实现者应该更改 UID。每当反序列化对象的\
  \ UID 匹配匹配时，`readObject` 方法就会抛出 `InvalidClassException`。\n\n如果 `serialVersionUID`\
  \ 匹配，即使实现发生了变化，反序列化也会继续。只要名称和类型匹配，待读对象的每个非 `transient` 实例变量将被设置为序列化状态中的值。所有其他实例变量都将设置为默认值：对象引用为\
  \ `null`，数字为 `0`，布尔值为 `false`。序列化状态中在待读对象不存在的任何内容都会被忽略。\n\n这个过程安全吗？只有类的实现者才能判断。如果是的话，那么实现者应该给新版本的类提供与旧版本相同的\
  \ `serialVersionUID`。\n\n如果你没有分配 `serialVersionUID`，系统将通过哈希值自动生成一个。你可以通过哈希输入、方法和描述来生成它。使用\
  \ `serialver` 命令显示：\n\n```bash\nserialver\n```\n\n点击此处查看代码图片\n\n```java\nprivate\
  \ static long serialVersionUID = -493257872082123L;\n```\n\n当编码器无法编码某个 Unicode 字符时，它会用默认值——通常是\"\
  ?\"替换它。使用 `newEncoder` 和 `replacement` 报告所有字符集的名称。\n\n![Image](img/00005.jpeg) 如果想实现更复杂的版本控制方案，可以使用\
  \ `readObject` 方法并对 `readFields`。\n\n。\n\n***\n\n## 练习\n\n**1.** 编写一个工具方法，将 `InputStream`\
  \ 拷贝到 `OutputStream`，不使用临时文件。\n\n**2.** 编写一个程序读取文件并生成另一个同名的 `.toc` 文件，包含按字母排序的单词。\n\
  \n**3.** 编写一个程序读取文件，假设大多数单词是英语，判断它是 ASCII 还是 UTF16。\n\n**4.** 逐行读取文件并统计行数，使用 (a)\
  \ `Scanner` 和 `hasNextLine`/`nextLine`，(b) `BufferedReader` 和 `readLine`，(c) `bufferedReader`\
  \ 和 `lines`。哪种最快？哪种最方便？\n\n**5.** 当 `Charset` 覆盖范围不完全时，它会用默认值替换字符。\n\n**6.** BMP\
