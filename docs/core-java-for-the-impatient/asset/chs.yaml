  \n- 12.1 时间线\n- 12.2 日期\n- 12.3 调整器\n- 12.4 本地时间\n- 12.5 时区时间\n- 12.6 格式化与解析\n-\
  \ 12.7 与旧代码互操作\n- 12.8 练习题\n\n### 12.1 时间线\n\n历史上，基本的时间单位——秒，源于地球绕自轴的旋转。一次完整的旋转有\
  \ 24 小时，即 24 × 60 × 60 = 86400 秒，因此精确定义秒只需要天文测量。遗憾的是，地球会轻微抖动，因此需要更精确的定义。1967 年，根据铯\
  \ 133 原子的固有属性得出了更精确的秒定义，它与历史定义相符。从那时起，原子网络维持着官方时间。\n\n每隔一段时间，官方时间员会将绝对时间与地球旋转同步。最初，会对官方秒进行微调，但从\
  \ 1972 年开始，偶尔会插入“闰秒”。\n\n\n\nJava 日期时间 API 规范要求 Java 使用以下时间刻度：\n\n- 每天有 86,400 秒\n\
  - 每天中午与官方时间精确匹配\n- 在其他时间以精确定义的方式与官方时间紧密匹配\n\n这使得 Java 能够灵活地适应未来官方时间的变更。\n\n在 Java\
  \ 中，`Instant` 代表时间线上的一个点。一个被称为 `epoch`（纪元）的起点，被任意地设置在 1970 年 1 月 1 日午夜，即通过伦敦格林威治皇家天文台的经午线。这与\
  \ Unix/POSIX 时间使用的约定相同。从该原点开始，时间以每天 86,400 秒的速度向前或向后测量，精度达到纳秒。`Instant` 值可以追溯到十亿年前（`Instant.MIN`）。这对于表达宇宙的年龄（约\
  \ 135 亿年）来说不够，但对于所有实际用途应该足够了。毕竟，十亿年前，地球被冰雪覆盖，上生活着今日植物动物的微型祖先。最大值 `Instant.MAX` 是\
  \ 1,000,000,000 年 12 月 31 日。\n\n静态方法调用 `Instant.now()` 可当前瞬间。你可以像通常一样使用 `equals`\
  \ 和 `compareTo` 方法比较两个瞬间，因此你可以将 `instant` 用作时间戳使用。\n\n要找出两个 instant 之间的差异，请使用静态方法\
  \ `Duration.between`。例如，以下是测量算法运行时间的方法：\n\n```\nInstant start = Instant.now();\n\
  runAlgorithm();\nInstant end = Instant.now();\nDuration timeElapsed = Duration.between(start,\
  \ end);\nlong millis = timeElapsed.toMillis();\n```\n\n`Duration` 是两个瞬间之间的时间量。你可以通过调用\
  \ `toNanos`、`toMillis`、`toSeconds`、`toMinutes`、`toHours` 或 `toDays` 以常规单位获取 `Duration`\
  \ 的长度。\n\n`Duration` 内部存储所需的于 `long` 值。秒数存储在 `long` 中，纳秒数存储在额外的 `int` 中。如果你想进行纳秒精度的计算，并且实际上需要\
  \ `Duration` 的整个范围，可以使用 表 12–1 中的方法之一。否则，你可以直接调用 `toNanos` 并使用 `long` 值进行计算。\n\n\
  ![Image](img/00067.jpeg)\n\n**表 12–1** 时间瞬间与持续算术运算\n\n***\n\n![Image](img/00005.jpeg)\
  \ 备注\n\n溢出一个 `long` 需要大约 300 年的纳秒时间。\n\n***\n\n例如，如果你想检查一个算法是否比另一个至少快十倍，可以计算：\n\n\
  ```\nDuration timeElapsed2 = Duration.between(start2, end2);\nboolean overTenTimesFaster\
  \ =\n    timeElapsed.multipliedBy(10).minus(timeElapsed2).isNegative();\n// 或者 timeElapsed.toNanos()\
  \ * 10 < timeElapsed2.toNanos()\n```\n\n***\n\n![Image](img/00005.jpeg) 备注\n\n`Instant`\
  \ 和 `Duration` 类是不可变的，所有的方法（如 `multipliedBy` 或 `minus`）都会返回一个新实例。\n\n***\n\n###\
  \ 12.2 本地日期\n\n现在让我们从绝对时间转向人类时间。Java API 中有两种人类时间：本地日期/时间（local date/time*）和时区时间（*zoned\
  \ time*）。本地日期/时间有日期和或当天时间，但没有关联的时区信息。本地日期的例子是 1903 年 6 月 14 日（Lambda 演算发明者 Alonzo\
  \ Church 的生日）。由于该日期既没有当天时间也没有时区信息，因此它不对应于精确的时间瞬间。相比之下，1969 年 7 月 16 日 09:32:00 EDT（阿波罗\
  \ 11 号的发射）是一个时区日期/时间，代表时间线上的一个精确瞬间。\n\n许多计算不需要时区，在某些情况下时区甚至会成为障碍。假设你每周在 10:00 安排一次会议。如果你在上一次时区时间的基础上增加\
  \ 7 天（即 7 × 24 × 60 × 60 秒），而你恰好跨越了夏令时间边界，那么会议将早一小时或晚一小时！\n\n出于这个原因，API 设计者建议除非你真的想表示绝对时间实例，否则不要使用时区时间。生日、节假日、安排时间等通常最好用本地日期或时间表示。\n\
  \n`LocalDate` 是一个带有年、月、日的日期。要构造它，你可以使用 `now` 或 `of` 静态方法：\n\n```\nLocalDate today\
  \ = LocalDate.now(); // 今天的日期\nLocalDate alonzosBirthday = LocalDate.of(1903, 6,\
  \ 14);\nalonzosBirthday = LocalDate.of(1903, Month.JUNE, 14);\n// 使用 Month 枚举\n\
  ```\n\n与 Unix 和 `java.util.Date` 中不规则的约定（月份从 0 开始，年份从 1900 年计算）不同，你为月份提供常规数字。或者，你可以使用\
  \ `Month` 枚举。\n\n表 12–2 显示了处理 `LocalDate` 对象最有用的方法。\n\n![Image](img/00068.jpeg)![Image](img/00069.jpeg)\n\
  \n**表 12–2** `LocalDate` 方法\n\n例如，*程序员节是每年的第 256 天。这里是你可以轻松计算的方法：\n\n```\nLocalDate\
  \ programmersDay = LocalDate.of(2014, 1, 1).plusDays(255);\n```\n\n回想两个瞬间之间的差异是一个\
  \ `Duration`。本地日期的等效物是 `Period`，它表示年、月或天数。\n\n```java\nlong val = LocalDate.of(1900,\
  \ 1, 1).getDayOfWeek().getValue();\n```\n\n`getDayOfWeek` 产生星期几，作为 `DayOfWeek` 枚举的值。`DayOfWeek.MONDAY`\
  \ 的数值为 1，`DayOfWeek.SUNDAY` 的值为 7。例如，\n\n```java\nlong diff = LocalDate.of(2014,\
  \ 1, 1).until(LocalDate.of(2015, 1), ChronoUnit.DAYS);\n```\n\n\n\n对于调度类应用程序，你通常需要计算如“每个月的第一个星期二”之类的日期。`TemporalAdjusters`\
  \ 类提供了许多用于常用调整的静态方法。你将调整方法的结果传递给 `with` 方法。例如，可以像这样计算一个月的第一个星期二：\n\n点击此处查看代码图片\n\
  \n```java\nLocalDate firstTuesday = LocalDate.of(year, month, 1).with(\n    TemporalAdjusters.nextOrSame(DayOfWeek.TUESDAY));\n\
  ```\n\n一如既往地，`with` 方法返回一个新的新的 `LocalDate` 对象，而不修改原始对象。表 12–3 显示了可用的调整器。\n\n![Image](img/00070.jpeg)\n\
  \n**表 12–3** `TemporalAdjusters` 类中的日期调整器\n\n你也可以通过实现 `TemporalAdjuster` 接口来创建自己的调整器。这里是一个用于计算下一个工作日的调整器：\n\
  \n点击此处查看代码图片\n\n```java\nTemporalAdjuster NEXT_WORKDAY = w -> {\n    LocalDate result\
  \ = (LocalDate) w;\n    do {\n        result = result.plusDays(1);\n    } while\
  \ (result.getDayOfWeek().getValue() >= 6);\n    return result;\n};\n\nLocalDate\
  \ backToWork = today.with(NEXT_WORKDAY);\n```\n\n注意，lambda 表达式的参数类型为 `Temporal`，必须强制转换为\
  \ `LocalDate`。你可以使用 `ofDateAdjuster` 方法来避免这种转换，该方法接受类型为 `UnaryOperator<LocalDate>`\
  \ 的 lambda。\n\n点击此处查看代码图片\n\n```java\nTemporalAdjuster NEXT_WORKDAY = TemporalAdjusters.ofDateAdjuster(w\
  \ -> {\n    LocalDate result = w; // 无强制转换\n    do {\n        result = result.plusDays(1);\n\
  \    } while (result.getDayOfWeek().getValue() >= 6);\n    return result;\n});\n\
  ```\n\n### 12.4 本地时间\n\n`LocalTime` 代表一天中的某个时间，例如 15:30:00。你可以使用 `now` 或 `of` 方法创建实例：\n\
  \n点击此处查看代码图片\n\n```java\nLocalTime rightNow = LocalTime.now();\nLocalTime bedtime\
  \ = LocalTime.of(22, 30); // 或 LocalTime.of(22, 30, 0)\n```\n\n表 12–4 显示了本地时间的常用操作。`plus`\
  \ 和 `minus` 操作会在 24 小时天内进行循环计算。例如，\n\n点击此处查看代码图片\n\n```java\nLocalTime wakeup =\
  \ bedtime.plusHours(8); // wakeup 是 6:30:00\n```\n\n![Image](img/00071.jpeg)\n\n\
  **表 12–4** `LocalTime` 方法\n\n***\n\n![Image](img/00005.jpeg) 注意\n\n`LocalTime` 不涉及\
  \ AM/PM（上午/下午）。这种琐事留给格式化器即可——参见第 12.6 节“格式化与解析”，位于第 390 页。\n\n***\n\n有一个 `LocalDateTime`\
  \ 类表示日期和时间。该类适用于存储固定时区中的时间点——例如，课程或活动的时间表。然而，如果你需要进行跨越夏令时的计算，或者如果你需要处理不同时区的用户，你应该使用我们接下来要讨论的\
  \ `ZonedDateTime` 类。\n\n### 12.5 时区时间\n\n时区，也许因为它们完全是人类的产物，比地球不规则旋转所引起的复杂性更加混乱。在一个理性的世界里，我们都应该遵循格林尼治的时钟，我们中的某些人会在\
  \ 02:00 吃午饭，另一些会在 22:00 吃。我们的胃会解决这一切。这在中国实际上是实现的，中国跨越了四个标准时区。在其他地方，我们拥有边界不规则且不断移动的时区，更糟糕的是还有夏令时。\n\
  \n尽管时区对觉悟者来说可能是反复无常的，但它们是生活的现实。当你实现一个日历应用程序时，它需要适用于那些从一个国家飞到另一个国家的人。当你在纽约时间 10:00\
  \ 有电话会议，但你恰好在柏林时，你期望在正确的本地时间收到提醒。\n\n互联网分配数字机构（IANA）维护着一个全球所有已知时区的数据库（`https://www.iana.org/time-zones`），该数据库每年更新几次。大部分更新处理的是夏令时规则的变化。Java\
  \ 使用 IANA 数据库。每个时区都有一个 ID，例如 `America/New_York`。\n\n\n\n\n还有一个 `OffsetDateTime`\
  \ 类，它表示带有 UTC 偏移量的时间，但不包含时区规则。该类用于那些特别要求不需要这些规则的特殊应用程序，例如某些网络协议。对于人类时间，请使用 `ZonedDateTime`。\n\
  \n***\n\n### 12.6 格式化与解析\n\n`DateTimeFormatter` 类提供了三种格式化器来打印日期/时间值：\n\n• 预定义的标准格式化器（参见表\
  \ 12–6）\n\n![Image](img/00074.jpeg)\n\n**表 12–6** 预定义的格式化器\n\n• 特定区域格式化器\n• 具有自定义模式的格式化器\n\
  \n要使用标准格式化器之一，只需调用其 `format` 方法：\n\n点击此处查看代码图片\n\n```\nString formatted = DateTimeFormatter.ISO_DATE_TIME.format(apollo11launch);\n\
  // 1969-07-16T09:32:00-05:00[America/New_York]\n```\n\n标准格式化器主要用于机器可读的时间戳。向人类读者展示日期和时间时，请使用特定区域格式化器。日期和时间都有四样式：`SHORT`、`MEDIUM`、`LONG`\
  \ 和 `FULL`——参见表 12–7）。\n\n![Image](img/00075.jpeg)\n\n**表 12–7** 特定区域的格式化样式\n\n\
  静态方法 `ofLocalizedDate`、`ofLocalizedTime` 和 `ofLocalizedDateTime` 创建此类格式化器。例如：\n\n\
  点击此处查看代码图片\n\n```\nDateTimeFormatter formatter = DateTimeFormatter.ofLocalizedDateTime(FormatStyle.LONG);\n\
  String formatted = formatter.format(apollo11launch);\n// July 16, 1969 9:32:00 AM\
  \ EDT\n```\n\n这些方法使用默认区域语言。要更改为不同的区域语言，只需使用 `withLocale` 方法即可。\n\n点击此处查看代码图片\n\n\
  ```\nformatted = formatter.withLocale(Locale.FRENCH).format(apollo11launch);\n//\
  \ 16 juillet 1969 09:32:00 EDT\n```\n\n`DayOfWeek` 和 `Month` 枚举拥有 `getDisplayName`\
  \ 方法，用于以不同的区域语言和格式提供星期几和月份的名称。\n\n点击此处查看代码图片\n\n```\nfor (DayOfWeek w : DayOfWeek.values())\n\
  \    System.out.print(w.getDisplayName(TextStyle.SHORT, Locale.ENGLISH) + \" \"\
  );\n// Prints Mon Tue Wed Thu Fri Sat Sun\n```\n\n关于区域语言的更多信息，请参见第 13 章。\n\n***\n\
  \n![Image](img/00005.jpeg) 注意\n\n`java.time.format.DateTimeFormatter` 类旨在取代 `java.util.DateFormat`。如果你为了向后兼容需要后者的实例，请调用\
  \ `formatter.toFormat()`。\n\n***\n\n最后，你可以通过指定模式来自定义自己的日期格式。例如：\n\n点击此处查看代码图片\n\n\
  ```\nformatter = DateTimeFormatter.ofPattern(\"E yyyy-MM-dd HH:mm\");\n```\n\n将日期以\
  \ `Wed 1969-07-16 09:32` 的形式格式化。每个字母代表一个不同的时间字段，字母重复的次数选择了一种特定的格式，这些规则非常晦奥，似乎是随着时间的推移而自然形成的。表\
  \ 12–8 显示了最实用的模式元素。\n\n![Image](img/00076.jpeg)\n\n**表 12–8** 日期/时间格式常用的格式化符号\n\n\
  要从字符串中解析日期/时间值，请使用其中一个静态 `parse` 方法。例如：\n\n点击此处查看代码图片\n\n```\nLocalDate churchsBirthday\
  \ = LocalDate.parse(\"1903-06-14\");\nZonedDateTime apollo11launch =\n    ZonedDateTime.parse(\"\
  1969-07-16 03:32:00-0400\",\n      DateTimeFormatter.ofPattern(\"yyyy-MM-dd HH:mm:ssxx\"\
  ));\n```\n\n第一次调用使用了标准的 `ISO_LOCAL_DATE` 格式化器，第二次使用了自定义格式化器。\n\n### 12.7 与旧代码相互操作\n\
  \n作为一个全新的产物，Java 日期和时间 API 必须与现有类相互操作，特别是无处不在 `java.util.Date`。\n\n![Image](img/00005.jpeg)\
  \ 注意\n\n`java.time.format.DateTimeFormatter` 类旨在取代 `java.util.DateFormat`。如果你为了向后兼容需要后者的实例，请调用\
  \ `formatter.toFormat()`。\n\n***\n\n最后，你可以通过指定模式来自定义自己的日期格式。例如：\n\n```\nformatter\
  \ = DateTimeFormatter.ofPattern(\"E yyyy-MM-dd HH:mm\");\n```\n\n将日期以 `Wed 1969-07-16\
  \ 09:32` 的形式格式化。每个字母代表一个不同的时间字段，字母重复的次数选择了一种特定的格式，这些规则非常晦奥，似乎是随着时间的推移而自然形成的。表 12–8\
  \ 显示了最实用的模式元素。\n\n### 12.8 练习\n\n（注：为 12.7 节和 12.8 节提供的输入文本包含大量的重复/损坏片段。我已经根据提供的指令清理了核心逻辑。）\n\
  \n\n\n\n外界世界很大很大，希望其中许多居民都会对你的软件感兴趣。一些程序员认为，应用程序国际化唯一需要的是支持 Unicode 并翻译用户界面中的消息。然而，正如你将看到的，程序的国际化要包含的内容多得多。日期、时间、货币，甚至数字在世界不同部分的格式也各不相同。在本章中，你将学习如何使用\
  \ Java 的国际化功能，以便你的程序无论用户位于何处，都能以符合他们习惯展示并接收信息。\n\n在本章的最后，你将看到关于 Java `Preferences\
  \ API` 存储用户偏好的简要概述。\n\n本章的要点如下：\n\n1. 为国际用户翻译应用程序不仅仅是翻译消息简单。特别是数字和日期的格式在世界各地差异巨大。\n\
  2. `locale` 描述了特定用户群的语言和格式偏好。\n3. `NumberFormat` 和 `DateTimeFormat` 类处理感知区域的数字、货币、日期和时间的格式化。\n\
  4. `MessageFormat` 类可以格式化带有占位符的消息字符串，每个占位符都可以有自己的格式。\n5. 使用 `Collator` 类进行依赖区域的字符串排序。\n\
  6. `ResourceBundle` 类管理多个区域的本地化字符串和对象。\n7. `Preferences` 类可以以与平台的方式存储用户偏好。\n\n##\
  \ 13.1 区域 (Locales)\n\n当你观察一个适应国际市场的应用程序时，最明显的区别是语言。但还有许多更细微的差异；例如，数字在英语和德语中的格式就非常不同。数字\n\
  \n123,456.78\n\n对于德国用户，应该显示为\n\n123.456,78\n\n——也就是说，小数点和十逗号分隔符的角色颠倒了。在日期的显示上也有类似的差异。在美国，日期的显示格式为月/日/年；德国使用更符合逻辑的日/月/年顺序，而在中国，使用习惯是年/月/日。因此，美式的日期\n\
  \n3/22/61\n\n应该向德国用户呈现为\n\n22.03.1961\n\n如果明确写出月份名称，语言上的差异将变得更加明显。英语的\n\nMarch 22,\
  \ 1961\n\n在德语中应该呈现为\n\n22\\. März 1961\n\n或者在中文中呈现为\n\n1961 ![Image](img/00078.jpeg)\
  \ 3 ![Image](img/00079.jpeg) 22 ![Image](img/00080.jpeg)\n\n`locale` 指定了用户的语言和位置，这使得格式化器考虑用户的偏好。接下来的章节将为你展示如何指定区域以及如何控制\
  \ Java 程序的区域设置。\n\n### 13.1.1 指定区域\n\n一个区域由最多五个组件组成：\n\n1. 语言，由两个或三个小写字母指定，例如 `en`（英语）、`de`（德语）或\
  \ `zh`（中文）。表 13–1 显示了常用代码。\n\n![Image](img/00081.jpeg)\n\n**表 13–1** 常用语言代码\n\n\
  2. 可选的脚本，由由首字母大写的四个字母指定，例如 `Latn`（拉丁字母）、`Cyrl`（西里尔字母）或 `Hant`（繁体中文）。这非常有用，因为某些语言（如塞尔维亚语）使用拉丁字母或西里尔字母编写，而且某些中文读者更倾向于繁体字而非简体字。\n\
  \n3. 可选的国家或地区，由两个大写字母或三个数字指定，例如 `US`（美国）或 `CH`（瑞士）。表 13–2 显示了常用代码。\n\n![Image](img/00082.jpeg)\n\
  \n**表 13–2** 常用国家代码\n\n4. 可选的变体 (`variant`)。\n\n5. 可选的扩展 (`extension`)。扩展描述了日历（如日本历）、数字（使用泰国数字而非阿拉伯数字）等的本地化偏好。Unicode\
  \ 标准规定了其中一些扩展。扩展以 `u-` 开头，后跟一个两个字母的代码，指定该扩展处理的是日历（`ca`）、数字（`nu`）等。例如，扩展 `u-nu-thai`\
  \ 表示使用泰国数字。其他扩展是完全任意的，并以 `x-` 开头，例如 `x-java`。\n\n***\n\n![Image](img/00005.jpeg)\
  \ 注意\n\n变体现如今很少使用。挪威语曾有一个“尼诺尔什语”变体，但现在用一个不同的语言代码 `nn` 表示。曾经作为日本皇历和泰国数字的变体现在被作为扩展表示。\n\
  \n***\n\n区域的规则制定在互联网工程任务组的“最佳当前实践”备录 BCP 47（[`tools.ietf.org/html/bcp47``](http://tools.ietf.org/html/bcp47)）。你可以在\
  \ [`www.w3.org/International/articles/language-tags`](http://www.w3.org/International/articles/language-tags)\
  \ 找到一个更易读的摘要。\n\n***\n\n![Image](img/00005.jpeg) 注意\n\n语言和国家代码似乎有些随机，因为它们中的一些源自本地。\n\
  \n***\n\n***区域由标签描述——带有连字符的元素字符串，例如 `en-US`。\n\n在德国，你会使用区域 `de-DE`。瑞士有四种官方语言（德语、法语、意大利语和罗曼什语）。瑞士语用户想使用区域\
  \ `de-CH`。\n\n如果你只指定语言，例如 `de`，该区域无法用于货币等特定问题。\n\n你可以通过如下标签字符串构造 `Locale` 对象：\n\n\
  ```java\nLocale usEnglish = Locale.forLanguageTag(\"en-US\");\n```\n\n`toLanguageTag`\
  \ 方法产生区域的语言标签。例如，`Locale.US.toLanguageTag()` 是字符串 `\"en-US\"`。\n\n为了方便，为各种国家提供了预定义的区域对象：\n\
  \n`Locale.CANADA`\n`Locale.CANADA_FRENCH`\n`Locale.CHINA`\n`Locale.FRANCE`\n`Locale.GERMANY`\n\
  `Locale.ITALY`\n`Locale.JAPAN`\n`Locale.KOREA`\n`Locale.PRC`\n`Locale.TAIWAN`\n\
  `Locale.UK`\n`Locale.US`\n\n许多预定义区域只指定语言而不指定位置：\n\n`Locale.CHINESE`\n`Locale.ENGLISH`\n\
  `Locale.FRENCH`\n`Locale.GERMAN`\n`Locale.ITALIAN`\n`Locale.JAPANESE`\n`Locale.KOREAN`\n\
  `Locale.SIMPLIFIED_CHINESE`\n`Locale.TRADITIONAL_CHINESE`\n\n最后，静态 `getAvailableLocales`\
  \ 方法返回虚拟机所有区域的数组。\n\n### 13.1.2 默认区域\n\n`Locale` 类的静态 `getDefault` 方法获取由本地操作系统存储的默认区域。\n\
  \n某些操作系统允许用户为显示消息和格式化指定不同的区域。例如，居住在美国的法语使用者可以拥有法语菜单，但货币值使用美元。\n\n要获取这些偏好，调用：\n\n\
  ```java\nLocale displayLocale = Locale.getDefault(Locale.Category.DISPLAY);\nLocale\
  \ formatLocale = Locale.getDefault(Locale.Category.FORMAT); ```\n\n***\n\n![Image](img/00005.jpeg)\
  \ 注意\n\n在 Unix 中，你可以通过设置 `LC_NUMERIC`、`LC_MONETARY` 和 `LC_TIME` 环境变量来为数字、货币和日期指定不同的区域。Java\
  \ 不关注这些设置。\n\n***\n\n***\n\n![Image](img/00013.jpeg) 提示\n\n为了测试，你可能想切换程序的默认区域。在启动程序时提供语言和区域属性。例如，这里我们设置默认区域设置为德语（瑞士）：\n\
  \n\n\n\n\n点击此处查看代码图像\n\n```\njava -Duser.language=de -Duser.country=CH MainClass\n\
  ```\n\n你也可以更改脚本（script）和变体（variant），并且可以为显示和格式区域设置设置独立的设置，例如 `-Duser.script.display=Hant`。\n\
  \n你可以通过调用以下方法之一来更改虚拟机的默认区域设置：\n\n点击此处查看代码图像\n\n```java\nLocale.setDefault(newLocale);\n\
  Locale.setDefault(category, newLocale);\n```\n\n第一次调用会更改所有类别通过 `Locale.getDefault()`\
  \ 和 `Locale.getDefault(category)` 返回的区域设置。\n\n### 13.1.3 显示名称\n\n假设你想允许用户从一组区域设置中进行选择。你不希望显示晦涩的标签字符串；`getDisplayName`\
  \ 方法返回一个描述区域设置的字符串，其格式可以呈现给用户，例如：\n\n德语（瑞士）\n\n实际上，这里有一个问题。显示名称是用默认区域设置发出的。这可能并不恰当。如果你的用户已经选择了德语作为首选语言，你可能希望以德语呈现该字符串。你可以通过将德语区域设置作为参数来实现这一点。代码如下：\n\
  \n点击此处查看代码图像\n\n```java\nLocale loc = Locale.forLanguageTag(\"de-CH\");\nSystem.out.println(loc.getDisplayName(Locale.GERMAN));\n\
  ```\n\nDeutsch (Schweiz)\n\n这个示例展示了为什么你需要 `Locale` 对象。你将它们传递给区域感知的方法，这些方法会产生呈现给不同位置用户的文本。你将在后续章节中看到许多示例。\n\
  \n### 13.2 数字格式化\n\n`java.text` 包中的 `NumberFormat` 类为可以格式化和解析数字的格式化器提供了三个工厂方法：`getNumberInstance()`、`getCurrencyInstance()`\
  \ 和 `getPercentInstance()`。例如，这里是你可以如何德语格式化货币值的方法：\n\n点击此处查看代码图像\n\n```java\nLocale\
  \ loc = Locale.GERMANY;\nNumberFormat formatter = NumberFormat.getCurrencyInstance(loc);\n\
  double amt = 123456.78;\nString result = formatter.format(amt);\n```\n\n结果是 123.456,€.注意货币符号是\
  \ €，且它位于字符串的末尾。此外，注意小数点和逗号的翻转。相反，要读取使用特定区域设置输入或存储的数字，请使用 `parse` 方法：\n\n点击此处查看代码图像\n\
  \n```java\nString input = \"...\";\nNumberFormat formatter = NumberFormat.getNumberInstance();\
  \ // 获取默认区域设置的数字格式化\nNumber parsed = formatter.parse(input);\ndouble x = parsed.doubleValue();\n\
  ```\n\n`parse` 的返回类型是 `Number`。返回的对象是 `Double` 或 `Long` 包装对象，取决于所解析的数字是否为浮点数。如果你不在乎这种区别，可以简单地使用\
  \ `Number` 类的 `doubleValue` 方法。如果数字文本不是正确的格式，该方法将抛出 `ParseException`。例如，字符串开头的空格是不允许的（调用\
  \ `trim` 来移除它）。然而，数字后的任何字符都将被忽略了。\n\n### 13.3 货币\n\n要格式化货币值，你可以使用 `NumberFormat.getCurrencyInstance`\
  \ 方法。然而，该方法并不灵活——它返回一个用于单一货币的格式化器。假设你为一位美国客户准备了一份发票，其中一些金额是美元，另一些是欧元。你不能直接使用两个格式化器：\n\
  \n点击此处查看代码图像\n\n```java\nNumberFormat dollarFormatter = NumberFormat.getCurrencyInstance(Locale.US);\n\
  NumberFormat euroFormatter = NumberFormat.getCurrencyInstance(Locale.GERMANY);\n\
  ```\n\n你的发票看起来会非常奇怪，某些值格式化为 `$100,000`，另一些则格式化为 `100.000€`。（注意欧元值使用的是小数点而不是逗号）。相反，使用\
  \ `Currency` 类来控制格式化器使用的货币。你可以通过向静态方法 `Currency.getInstance` 传递货币标识符来获取 `Currency`\
  \ 对象。表 13–3 列出了常见的标识符。静态方法 `Currency.getAvailableCurrencies` 产生一个包含虚拟机已知的货币的 `Set<Currency>`。\n\
  \n![图像](img/00083.jpeg)\n\n**表 13–3** 货币标识符\n\n一旦你拥有了 `Currency` 对象，为格式化器调用 `setCurrency`\
  \ 方法。以下是如何为你的美国客户格式化欧元金额：\n\n点击此处查看代码图像\n\n```java\nNumberFormat formatter = NumberFormat.getCurrencyInstance(Locale.US);\n\
  formatter.setCurrency(Currency.getInstance(\"EUR\"));\nSystem.out.println(formatter.format(amt));\n\
  ```\n\n如果你需要本地化的名称或符号，调用 `getDisplayName()` 或 `getSymbol()`。这些方法以默认区域设置返回。你也可以提供显式的区域设置。\n\
  \n### 13.4 日期和时间格式化\n\n在格式化日期和时间时，存在以下区域相关的问题：\n\n1. 月份和星期日的名称应根据区域设置呈现。\n2. 年、月、日的顺序取决于区域设置。\n\
  3. 格列哥历可能不同。\n4. 必须考虑时区。\n\n使用 `java.time` 包中的 `DateTimeFormatter`，而不是传统的 `java.util.DateFormat`。根据你需要日期、时间还是两者，查看表\
  \ 13–4。\n\n![图像](img/00084.jpeg)\n\n**表 13–4** 区域特定样式\n\n然后获取一个格式化器：\n\n点击此处查看代码图像\n\
  \n```java\nFormatStyle style = ... // 之一 FormatStyle.SHORT, FormatStyle.MEDIUM,\
  \ ..., FormatStyle.LONG\nDateTimeFormatter dateFormatter = DateTimeFormatter.ofLocalizedDate(style);\n\
  DateTimeFormatter timeFormatter = DateTimeFormatter.ofLocalizedTime(style);\nDateTimeFormatter\
  \ dateTimeFormatter = DateTimeFormatter.ofLocalizedDateTime(style);\n// 或 DateTimeFormatter.ofLocalizedDateTime(style,\
  \ style2)\n```\n\n这些格式化器使用当前的区域设置。要使用不同的区域设置，请使用 `withLocale` 方法：\n\n点击此处查看代码图像\n\
  \n```java\nDateTimeFormatter dateFormatter = DateTimeFormatter.ofLocalizedDate(style).withLocale(locale);\n\
  ```\n\n现在你可以格式化 `LocalDate`、`LocalDateTime`、`LocalTime` 或 `ZonedDateTime`：\n\n点击此处查看代码图像\n\
  \n```java\nZonedDateTime appointment = ...;\nString formatted = formatter.format(appointment);\n\
  ```\n\n要解析字符串，使用 `LocalDate`、`LocalDateTime`、`LocalTime` 或 `ZonedDateTime` 的静态 `parse`\
  \ 方法。\n\n点击此处查看代码图像\n\n```java\nLocalTime time = LocalTime.parse(\"9:32 AM\", formatter);\n\
  ```\n\n如果字符串无法成功解析，将抛出 `DateTimeParseException`。\n\n注意：这些方法不适用于解析用户输入，至少在没有预处理的情况下不是。例如，美国的短时间格式化器可以解析\
  \ `\"9:32 AM\"`，但不能解析 `\"9:32AM\"` 或 `\"9:32 am\"`。\n\n注意：日期格式化器解析不存在的日期（例如 11 月\
  \ 31 日），并将其调整为该月份的最后一天。\n\n有时你只需要显示星期和月份的名称，例如在日历应用程序中。调用 `DayOfWeek` 和 `Month`\
  \ 枚举的 `getDisplayName` 方法。\n\n点击此处查看代码图像\n\n\n\n\n\n```\nfor (Month m : Month.values())\
  \ {\n    System.out.println(m.getDisplayName(textStyle, locale) + \" \");\n}\n```\n\
  \n[表 13–5] 显示了文本样式。`STANDALONE` 版本用于格式化日期之外的显示。例如，在芬兰语中，一月在日期内部是“tammikuuta”，但单独出现时是“tammikuu”。\n\
  \n![Image](img/00085.jpeg)\n\n**表 13–5** `java.time.format.TextStyle` 枚举的值\n\n###\
  \ 13.5 排序与归一化\n\n大多数程序员都知道如何使用 `String` 类的 `compareTo` 方法来比较字符串。遗憾的是，在与用户交互时，这个方法并不好用。`compareTo`\
  \ 方法使用字符串的 UTF-16 编码值，这会导致荒谬的结果，即使在英语中也是如此。例如，以下五个字符串根据 `compareTo` 方法排序：\n\n* Athens\n\
  * Zulu\n* able\n* zebra\n* Ångström\n\n对于字典排序，你可能希望考虑大写和小小写的等价性，且重音不应产生影响。对于英语母者来说，示例单词列表的排序顺序应该是：\n\
  \n* able\n* Ångström\n* Athens\n* zebra\n* Zulu\n\n然而，这种顺序对于瑞典用户来说是不可接受的。在瑞典语中，字母\
  \ `Å` 与字母 `A` 不同，它排在字母 `Z` *之后*！这意味着，瑞典用户希望单词按照以下顺序进行排序：\n\n* able\n* Athens\n*\
  \ zebra\n* Zulu\n* Ångström\n\n要获取一个区域敏感的比较器，请调用静态方法 `Collator.getInstance`：\n\n\
  点击此处查看代码图片\n\n```\nCollator coll = Collator.getInstance(locale);\nwords.sort(coll);\n\
  // Collator implements Comparator<Object>\n```\n\n排序器（collator）有几个高级设置。你可以设置排序器的\
  \ `strength` 来调整其选择性。字符差异被分类为初级、二级或三级。例如，在英语中，`e` 和 `f` 之间的差异被视为初级，`e` 和 `é` 之间的差异是次级的，而\
  \ `e` 和 `E` 之间的差异是三级的。\n\n例如，在处理城市名称时，你可能不在意以下之间的差异：\n\n* San José\n* San Jose\n\
  * SAN JOSE\n\n在这种情况下，通过调用以下方法配置排序器：\n\n点击此处查看代码图片\n\n```\ncoll.setStrength(Collator.PRIMARY);\n\
  ```\n\n更具技术性的设置是“分解模式”（decomposition mode），它处理的是一个字符或字符序列在 Unicode 中有时可以用多种方式描述的事实。例如，`é`\
  \ (U+00E9) 也可以表示为普通的 `e` (U+0065) 后跟一个 `´`（组合变音符号 U+0301）。你可能不在乎这个差异，在默认情况下它是不显著的。如果你在乎，则需要如下配置排序器：\n\
  \n点击此处查看代码图片\n\n```\ncoll.setStrength(Collator.IDENTICAL);\ncoll.setDecomposition(Collator.NO_COMPOSITION);\n\
  ```\n\n反之，如果你想非常宽松，并将商标符号 `™` (U+2122) 视为字符组合相同，则将分解模式设置为 `Collator.FULL_COMPOSITION`。即使在不进行排序时，你也可能希望将字符串转换为归一化形式——例如为了持久存储或与其他程序通信。Unicode\
  \ 标准定义了四种归一化形式（C、D、KC 和 KD）——参见 `www.unicode.org/reports/tr15/tr15.html`。在形式 C 中，重音字符总是组合的。例如，`e`\
  \ 和组合变音符号 `´` 的序列被组合成单个字符 `é`。在形式 D 中，重音字符总是分解为基基字母和组合变音符号：`é` 转换为 `e` 后跟 `´`。KC\
  \ 和 KD 也会分解如商标符号 `™` 等字符。W3C 建议你在通过互联网传输数据时使用归一化形式 C。`java.text.Normalizer` 类的静态方法\
  \ `normalize` 方法执行归一化过程。例如：\n\n点击此处查看代码图片\n\n```\nString city = \"San José\";\n\
  String normalized = Normalizer.normalize(city, Normalizer.Form.NFC);\n```\n\n###\
  \ 13.6 消息格式化\n\n对程序进行国际化时，你通常会有带有变量部分的消息。`MessageFormat` 类的静态方法 `format` 带有占位符的模板字符串，后面跟着占位符的值，如下所示：\n\
  \n点击此处查看代码图片\n\n```\nString template = \"{0} has {1} messages\";\nString message\
  \ = MessageFormat.format(template, \"Pierre\", 42);\n```\n\n当然，你不应该硬编码模板，而应该查找与特定区域相关的模板，例如法语中的\
  \ `\"Il y a {1} pour {0}\"`。你将在第 13.7 节 资源包 中学习如何这样做。\n\n注意占位符的顺序在不同语言之间可能不同。在英语中，消息是“Pierre\
  \ has 42 messages”，但在法语中，它是“Il y a 42 messages pour Pierre”。占位符 `{0}` 是调用 `format`\
  \ 时模板后的第一个参数，`{1}` 是下一个参数，依此类推。\n\n你可以通过在占位符后添加后缀 `number,currency` 将数字格式化为货币金额，例如：\n\
  \n点击此处查看代码图片\n\n```\ntemplate=\"Your current total is {0,number,currency}.\";\n\
  ```\n\n在美国，值 1023.95 会被格式化为 `$1,023.95`。相同的值在德国显示为 `1.023,95€`。在占位符后添加 `number,currency`\
  \ 后缀，可以把数字格式化为货币金额。`number` 标识符可以跟在 `currency`、`integer`、`percent` 或 `DecimalFormat`\
  \ 类的数字格式后面，如 `##0`。你可以对 `java.util.Date` 类的值使用 `date` 或 `time` 标识符，跟随 `short`、`medium`、`long`\
  \ 或 `full` 或 `SimpleDateFormat` 格式如 `yyyy-MM-dd`。例如：\n\n点击此处查看代码图片\n\n```\nString\
  \ message = MessageFormat(\"It is now {0,time,short}.\", Date.from(Instant.now()));\n\
  ```\n\n最后，`choice` 格式化器让你生成如下消息：\n\n* No files copied\n* 1 file copied\n* 42 files\
  \ copied\n\n取决于占位符的值。选择格式是一个对序列，每个对包含一个限制和一个格式字符串。限制和格式字符串由 `#` 字符分隔，对之间由 `|` 字符分隔。\n\
  \n点击此处查看代码图片\n\n```\nString template = \"{0,choice,0#No files|1#1 file|2#{0} files}\
  \ copied\";\n```\n\n注意 `{0}` 在模板中出现了两次。当消息格式对占位符 `{0}` 应用选择格式且值为 42 时，选择格式返回 `\"\
  {0} files\"`。该字符串随后再次被格式化，结果被接到消息中。\n\n* *\n\n![Image](img/00005.jpeg) **注意**\n\n\
  选择格式的设计有点混乱。如果你有三个格式字符串，你需要*两个*限制来分隔它们（通常情况下，限制的数量比格式字符串的数量少一个）。`MessageFormat`\
  \ 类实际上忽略了第一个限制！\n\n* *\n\n使用 `<` 符号代替 `#` 来表示当严格小于值时应选择该项。你也可以使用 `≤` 符号（U+2264）作为\
  \ `#` 的同义词，并为第一个值指定 `-∞`（负号后跟 U+221E）。这使得格式字符串更容易读：\n\n点击此处查看代码图片\n\n```\n-∞<No\
  \ files|0<1 file|2≤{0} files\n```\n\n\n\n\n任何位于单引号 `'` . . . `'` 中的文本都会被字面包含。例如，`'{0}'`\
  \ 不是一个占位符，而是字面字符串 `{0}`。如果模板包含单引号，你必须将其双倍。\n\n点击此处查看代码图片\n\n```\nString template\
  \ = \"<a href=''{0}''>{1}</a>\";\n```\n\n* *\n\n静态方法 `MessageFormat.format` 使用当前的格式化区域化来格式化值。要使用任意区域化进行格式化，你需要多费一些精力，因为没有你可以使用的“可变参数”方法。你需要将要格式化的值放入一个\
  \ `Object[]` 数组中，如下：\n\n点击此处查看代码图片\n\n```java\nMessageFormat mf = new MessageFormat(template,\
  \ locale);\nString message = mf.format(new Object[] { arg1, arg2, ... });\n```\n\
  \n### 13.7 资源包 (Resource Bundles)\n\n在对应用程序进行本地化时，将程序与消息字符串、按钮标签和其他需要翻译的文本分离。在 Java\
  \ 中，你可以将它们放入 `resource bundles`（资源包）中。然后，你可以将这些包交给翻译人员，他们可以编辑它们，而无需触碰程序的源代码。\n\n\
  * *\n\n![图像](img/00005.jpeg) 注意\n\n第 4 章 描述了 JAR 文件资源的概念，通过这种机制，数据文件、声音和图像可以放在 JAR\
  \ 文件中。`Class` 的 `getResource` 方法找到文件、打开它并返回指向资源的 URL。这是一种将文件与程序打包在一起的有用机制，但它没有区域化支持。\n\
  \n* *\n\n#### 13.7.1 组织资源包\n\n在对应用程序进行本地化时，你会产生一组资源包。每个包要么是一个属性文件，要么是一个特殊的类，包含针对特定区域化或一组匹配的区域化的对应条目。\n\
  \n在本节中，我只讨论属性文件，因为它们比资源类常见得多。属性文件是一个以 `.properties` 结尾的文本文件，包含键/值对。例如，文件 `messages_de_DE.properties`\
  \ 可能包含：\n\n```\ncomputeButton=Rechnen\ncancelButton=Abbrechen\ndefaultPaperSize=A4\n\
  ```\n\n你需要为构成这些包的文件使用特定的命名约定。例如，特定于德国的资源进入文件 `bundleName``_de_DE`，而由所有德语国家共享的资源进入\
  \ `bundleName``_de`。对于给定的语言、脚本和国家组合，会考虑以下 *备选者 (candidates)*：\n\n点击此处查看代码图片\n\n\
  ```\nbundleName_language_script_country\nbundleName_language_script\nbundleName_language_country\n\
  bundleName_language\n```\n\n如果 `bundleName` 包含点，则该文件必须存放在匹配的子目录中。例如，包 `com.mycompany.messages`\
  \ 的文件是 `com/mycompany/messages_de_DE.properties`，依此类推。\n\n要加载资源包，调用\n\n点击此处查看代码图片\n\
  \n```java\nResourceBundle res = ResourceBundle.getBundle(bundleName);\n```\n\n用于默认区域化，或者\n\
  \n点击此处查看代码图片\n\n```java\nResourceBundle bundle = ResourceBundle.getBundle(bundleName,\
  \ locale);\n```\n\n用于给定的区域化。\n\n* *\n\n![图像](img/00009.jpeg) 警告\n\n第一个 `getBundle`\
  \ 方法 *没有* 使用默认的显示区域化，而是使用全局默认区域化。如果你为用户界面查找资源，请务必将 `Locale.getDisplayDefault()`\
  \ 作为区域化传递。\n\n* *\n\n要查找字符串，带键调用 `getString` 方法。\n\n点击此处查看代码图片\n\n```java\nString\
  \ computeButtonLabel = bundle.getString(\"computeButton\");\n```\n\n加载包文件的规则有点复杂，涉及两个阶段。在第一阶段，会定位匹配的包。这涉及多多三个步骤。\n\
  \n**1.** 首先，按照上述顺序尝试所有包名、语言、脚本、国家和变体的备选组合，直到找到匹配项。例如，如果目标区域化是 `de-DE` 且没有 `messages_de_DE.properties`\
  \ 但有 `messages_de.properties`，则它成为匹配的包。\n\n**2.** 如果没有匹配，则用默认区域化重复该过程。例如，如果请求了一个德语包但不存在，且默认区域化是\
  \ `en-US`，则 `messages_en_US.properties` 被接受为匹配项。\n\n**3.** 如果默认区域化也没有匹配，那么没有后缀的包（例如\
  \ `messages.properties`）即为匹配项。如果这些都不存在，则搜索失败。\n\n* *\n\n![图像](img/00005.jpeg) 注意\n\
  \n对于变体、简体和繁体中文脚本以及挪威语有特殊的规则。参见 `ResourceBundle` 的 Java 文档获取详情。\n\n* *\n\n在第二阶段，匹配包的父包将被定位。这些父包位于匹配包下方的列表中。例如，`messages_DE.properties`\
  \ 的父包是 `messages_de` 和 `messages.properties`。\n\n`getString` 方法在匹配包及其父包中查找键。\n\n\
  ![图像](img/00005.jpeg) 注意\n\n如果在第一阶段找到了匹配包，则其父包永远来自默认区域化。\n\n* *\n\n![图像](img/00009.jpeg)\
  \ 警告\n\n属性文件使用 ASCII 字符集。所有非 ASCII 字符必须使用 `\\u` 编码。例如，为了指定 `Préférences` 的值，使用\n\
  \n点击此处查看代码图片\n\n```\npreferences=Pr\\u0E9fer\\u00nces\n```\n\n你可以使用 `native2ascii`\
  \ 工具生成这些文件。\n\n#### 13.7.2 类\n\n要提供不是字符串的资源，定义继承 `ResourceBundle` 的类。使用与属性资源类似的命名约定，例如\n\
  \n点击此处查看代码图片\n\n```\ncom.mycompany.MyAppResources_en_US\ncom.mycompany.MyAppResources_de\n\
  com.mycompany.MyAppResources\n```\n\n要实现资源包类，你可以继承 `ListResourceBundle` 类。将所有资源放入键/值对数组中并在\
  \ `getContents` 方法中返回。例如，\n\n点击此处查看代码图片\n\n```java\npackage com.mycompany;\n\npublic\
  \ class MyAppResources_de extends ListResourceBundle {\n    public Object[][] getContents()\
  \ {\n        return new Object[][] {\n            {\"backgroundColor\", Color.BLACK},\n\
  \            {\"defaultPaperSize\", new double[] {210, 297}}\n        };\n    }\n\
  }\n```\n\n要从此类资源包获取对象，调用 `getObject` 方法：\n\n点击此处查看代码图片\n\n```java\nResourceBundle\
  \ bundle = ResourceBundle.getBundle(\"com.mycompany.MyAppResources\", locale);\n\
  Color backgroundColor = (Color) bundle.getObject(\"backgroundColor\");\ndouble[]\
  \ paperSize = (double[]) bundle.getObject(\"defaultPaperSize\");\n```\n\n* *\n\n\
  ![图像](img/00009.jpeg) 警告\n\n当 `ResourceBundle.getBundle` 方法发现相同包名的类和属性文件时，它优先考虑类而不是属性文件。\n\
  \n* *\n\n### 13.8 字符编码\n\nJava 使用 Unicode 并不意味着所有的字符编码问题都消失了。幸运的是，你不需要担心 `String`\
  \ 对象的编码。你收到的任何字符串（无论是命令行参数、控制输入还是 GUI 文本字段的输入）将是 UTF-16 编码的字符串，包含用户提供的文本。\n\n\n\n\
  \n当你显示一个字符串时，虚拟机会针对本地平台对其进行编码。这里存在两个潜在的问题：显示字体可能不包含某个特定 Unicode 字符的字形（glyph）。在 Java\
  \ GUI 中，此类字符将显示为空框。对于控制台输出，如果控制台使用的字符编码无法表示所有输出字符，缺失的字符将显示为 `?`。用户可以通过安装合适的字体或将控制台切换到\
  \ UTF-8 来解决这些问题。\n\n当你的程序读取用户产生的纯文本文件时，情况会变得复杂。简单的文本编辑器通常会生成本地平台编码的文件。你可以通过调用以下方法获取该编码：\n\
  \n点击此处查看代码图像\n\n```java\nCharset platformEncoding = Charset.defaultCharset();\n\
  ```\n\n这是对用户偏好字符编码的合理猜测，但你应该允许用户覆盖它。\n\n如果你想提供字符编码的选择，可以按如下方式获取本地化名称：\n\n点击此处查看代码图像\n\
  \n```java\nString displayName = encoding.displayName(locale);\n// 产生如 UTF-8、ISO-8859-6\
  \ 或 GB18030 等名称\n```\n\n遗憾的是，这些名称对于想要在 Unicode、阿拉伯语、简体中文等之间选择的终端用户来说并不真正适用。\n\n\
  ***\n\n![Image](img/00013.jpeg) 提示\n\nJava 源文件也是文本文件。假设你不是项目中唯一的程序员，请不要以平台编码存储源文件。虽然你可以使用\
  \ `\\u*xxxx` 转义字符在代码或注释中表示任何非 ASCII 字符，但那样非常繁琐。相反，请使用 UTF-8。将你的文本编辑器和控制台偏好设置为 UTF-8，或者使用以下命令进行编译：\n\
  \n```bash\njavac -encoding UTF-8 *.java\n```\n\n***\n\n### 13.9 偏好\n\n我用一个与国际化有间接关系的\
  \ API 来结束本章——用户偏好的存储（可能包括偏好的区域设置）。\n\n当然，你可以将偏好存储在一个属性文件中，并在程序启动时加载它。然而，命名和放置配置文件并没有标准约定，这增加了用户安装多个\
  \ Java 应用时发生冲突的概率。\n\n某些操作系统拥有配置信息的中央存储库。最著名的例子是 Microsoft Windows 中的注册表。`Preferences`\
  \ 类是 Java 中存储用户偏好的标准机制，它在 Windows 上使用注册表。在 Linux 上，信息存储在本地文件系统中。对于使用 `Preferences`\
  \ 类的程序员来说，具体的存储库实现是透明的。\n\n`Preferences` 存储库包含一个节点树。存储库中的每个节点都有一个键/值对表。值可以是数字、`boolean`\
  \ 值、字符串或字节数组。\n\n***\n\n![Image](img/00005.jpeg) 注意\n\n没有为存储任意对象提供任何规定。当然，如果你不担心使用序列化进行长期存储，你可以自由地将序列化后的对象作为字节数组存储。\n\
  \n***\n\n到节点的路径类似于 `/com/mycompany/myapp`。与包名一样，你可以通过以反向域名开头路径来避免名称冲突。\n\n有两棵并行的树。每个程序用户拥有一棵树。还有一个名为“系统树”的树，供所有用户通用的设置。`Preferences`\
  \ 类使用操作系统的“当前用户”概念来访问相应的用户树。要访问树中的节点，从用户根或系统根开始：\n\n点击此处查看代码图像\n\n```java\nPreferences\
  \ root = Preferences.userRoot();\n```\n\n或者\n\n点击此处查看代码图像\n\n```java\nPreferences\
  \ root = Preferences.systemRoot();\n```\n\n然后通过它们的路径名访问节点：\n\n点击此处查看代码图像\n\n```java\n\
  Preferences node = root.node(\"/com/mycompany/myapp\");\n```\n\n或者，向静态方法 `userNodeForPackage`\
  \ 或 `systemNodeForPackage` 提供一个 `Class` 对象，节点路径将根据该类的包名派生出来。\n\n点击此处查看代码图像\n\n```java\n\
  Preferences node = Preferences.userNodeForPackage(obj.getClass());\n```\n\n一旦你有了一个节点，就可以访问键/值表。通过以下方法检索字符串：\n\
  \n点击此处查看代码图像\n\n```java\nString preferredLocale = node.get(\"locale\", \"\");\n\
  ```\n\n对于其他类型，请使用以下方法之一：\n\n点击此处查看代码图像\n\n```java\nString get(String key, String\
  \ defval)\nint getInt(String key, int defval)\nlong getLong(String key, long defval)\n\
  float getFloat(String key, float defval)\ndouble getDouble(String key, double defval)\n\
  boolean getBoolean(String key, boolean defval)\nbyte[] getByteArray(String key,\
  \ byte[] defval)\n```\n\n在读取信息时，如果数据不可用，必须指定默认值。反之，可以使用 `put` 方法向存储库写入数据：\n\n```java\n\
  void put(String key, String value)\nvoid putInt(String key, int value)\nvoid putLong(String\
  \ key, long value)\nvoid putFloat(String key, float value)\nvoid putDouble(String\
  \ key, double value)\nvoid putBoolean(String key, boolean value)\nvoid putByteArray(String\
  \ key, byte[] value)\n```\n\n要从节点中删除项，调用 `remove(String key)`。调用 `removeNode()`\
  \ 移除整个节点及其子节点。可以使用以下方法列出节点中所有的键以及子路径：\n\n```java\nString[] keys()\nString[] childrenNames()\n\
  ```\n\n***\n\n![Image](img/00005.jpeg) 注意 没有没有查找特定值类型的方法。\n\n***\n\n可以通过以下方法导出子树的偏好：\n\
  \n点击此处查看代码图像\n\n```java\nvoid exportSubtree(OutputStream out)\n```\n\n位于子树的根节点。数据以\
  \ XML 格式保存。你可以通过以下方法将其导入另一个存储库：\n\n点击此处查看代码图像\n\n```java\nInputStream in = Files.newInputStream(path)\n\
  Preferences.importPreferences(in);\n```\n\n## 练习\n\n**1.** 编写一个程序，演示法国、中国和泰国的日期样式（使用泰语数字）。\n\
  \n**2.** JVM 中的哪些区域设置在格式化数字时不使用西方数字？\n\n**3.** JVM 中的哪些区域设置使用与美国相同的日期表示法（月/日/年）？\n\
  \n**4.** 编写一个程序，打印 JVM 中所有区域的语言名称。对它们进行排序并去重。\n\n**5.** 重复上述练习，但针对货币名称。\n\n**6.**\
  \ 编写一个程序，列出在至少两个区域中具有不同符号的货币。\n\n**7.** 编写一个程序，列出所有独立月份名称不同的区域，但排除那些独立月份名称由数字组成的区域。\n\
  \n**8.** 编写一个程序，列出在规范化形式 KC 或 KD 下展开为两个或多个 ASCII 字符的所有 Unicode 字符。\n\n**9.** 将你的其中一个程序进行国际化，使用至少两种语言的资源包（resource\
  \ bundles）。\n\n**10.** 提供一种显示可用字符编码的机制，带有类似于网络浏览器的人类可读描述。语言名称应该是本地化的。（使用区域语言的翻译。）\n\
  \n**11.** 提供一个用于显示区域相关纸尺寸的类，使用给定区域的偏好尺寸单位和默认纸尺寸。（除了美国和加拿大外，地球上每个国家都使用 ISO 216 纸尺寸。）\n\
  \n\n\n\n## 14.2 脚本 API\n\n# 14.3 Nashorn 脚本引擎\n\n# 14.4 使用 Nashorn 编写 脚本\n\n# 14.4\
  \ 练习\n\n在本章中，你将学习如何使用编译器 API 从应用程序内部编译 Java 代码。你还将看到如何使用脚本 API 从你的 Java 程序中运行用其他语言编写的程序。如果你想让用户能够通过脚本来增强你的程序，这将特别有用。\n\
  \n本章的重点要点是：\n\n1. 通过编译器 API，你可以动态生成 Java 代码并对其进行编译。\n2. 脚本 API 让 Java 程序能够与其他脚本语言进行互操作。\n\
  3. JDK 包含了 `Nashorn`，它是一个性能良好且与 JavaScript 标准具有高保真度的 JavaScript 解释器。\n4. `Nashorn`\
  \ 为处理 Java 列表、映射以及 JavaBeans 属性提供了方便的语法。\n5. `Nashorn` 支持 Lambda 表达式，并提供了扩展 Java\
  \ 类和实现 Java 接口的有限机制。\n6. `Nashorn` 支持使用 JavaScript  Shell 脚本。\n\n## 14.1 编译器 API\n\
  \n有很多工具需要编译 Java 代码。显然，开发环境和教授 Java 编程的程序就在其中，还有测试和构建自动化工具。另一个例子是 JavaServer Pages（JSP）的处理——即嵌入了\
  \ Java 语句的网页。\n\n### 14.1.1 调用编译器\n\n调用编译器非常简单。这是一个示例调用：\n\n```java\nJavaCompiler\
  \ compiler = ToolProvider.getSystemJavaCompiler();\nOutputStream outStream = ...;\n\
  OutputStream errStream = ...;\nint result = compiler.run(null, outStream, errStream,\n\
  \    \"-sourcepath\", \"src\", \"Test.java\");\n```\n\n`result` 值为 `0` 表示编译成功。\n\
  \n编译器会将输出和错误信息发送到提供的流中。你可以将这些参数设置为 `null`，在这种情况下将使用 `System.out` 和 `System.err`。`run`\
  \ 方法的第一个参数是输入流。由于编译器不接受控制台输入，你始终将其留为 `null`。（`run` 方法继承自通用的 `Tool` 接口，该接口允许需要读取输入的工具。）\n\
  \n`run` 方法的剩余参数是你在命令行调用 `javac` 时传递给它的参数。这些参数可以是选项或文件名。\n\n### 14.1.2 启动编译任务\n\n\
  通过 `CompilationTask` 对象，你可以对编译过程进行更细的控制。如果你想从字符串提供源码、在内存中捕获类文件或处理错误和警告消息，这将非常有用。\n\
  \n获取 `CompilationTask`，请像上一节一样从 `compiler` 对象开始。然后调用：\n\n```java\nJavaCompiler.CompilationTask\
  \ task = compiler.getTask(\n    errorWriter, // 如果为 null 则使用 `System.err`\n    fileManager,\
  \ // 如果为 null 则使用标准文件管理器\n    diagnostics, // 如果为 null 则使用 `System.err`\n    options,\
  \ // 无选项则为 null\n    classes, // 用于注解处理；如果没有则为 null\n    sources);\n```\n\n最后三个参数是\
  \ `Iterable` 实例。例如，一组选项可以指定为：\n\n```java\nIterable<String> options = Arrays.asList(\"\
  -d\", \"bin\");\n```\n\n`sources` 参数是 `JavaFileObject` 实例的 `Iterable`。如果你想编译磁盘文件，请获取一个\
  \ `StandardJavaFileManager` 并调用其 `getJavaFileObjects` 方法：\n\n```java\nStandardJavaFileManager\
  \ fileManager =\n    compiler.getStandardFileManager(null, null, null);\nIterable<JavaFileObject>\
  \ sources =\n    fileManager.getJavaFileObjectsFromFiles(\"File1.java\", \"File2.java\"\
  );\nJavaCompiler.CompilationTask task = compiler.getTask(\n    null, null, null,\
  \ options, null, sources);\n```\n\n> **注意**：`classes` 参数仅用于注解处理。在这种情况下，你还需要带有一个\
  \ `Processor` 对象的列表来调用 `task.processors(annotationProcessors)`。示例请参见第 11 章。\n\n\
  `getTask` 方法返回任务对象，但尚未开始编译。`CompilationTask` 类扩展自 `Callable<Boolean>`。你可以将其传递给 `ExecutorService`\
  \ 进行并发执行，或者你也可以直接进行同步调用：\n\n```java\nBoolean success = task.call();\n```\n\n###\
  \ 14.1.3 从内存读取源文件\n\n如果你动态生成源码，可以使其从内存中进行编译，而无需保存到磁盘。使用此类来持有代码：\n\n```java\nclass\
  \ StringSource extends SimpleFileObject {\n    private String code;\n    StringSource(String\
  \ name, String code) {\n        super(URI.create(\"string://\" + name.replace('.',\
  \ '/') + \".java\"),\n            Kind.SOURCE);\n        this.code = code;\n   \
  \ }\n    public CharSequence getContent(boolean ignoreErrors) {\n        return\
  \ code;\n    }\n}\n```\n\n然后为你的类生成代码，并给编译器提供一个 `StringSource` 对象列表：\n\n```java\n\
  String pointCode = ...;\nString rectangleCode = ...;\nList<StringSource> sources\
  \ = Arrays.asList(\n    new StringSource(\"Point\", pointCode),\n    new StringSource(\"\
  Rectangle\", rectangleCode));\ntask = compiler.getTask(null, null, null, null, sources);\n\
  ```\n\n### 14.1.4 将字节码写入内存\n\n如果你动态编译类，则不需要将类文件保存到磁盘。你可以将其保存到内存中并立即加载。\n\n首先，有一个用于持有字节的类：\n\
  \n```java\nclass ByteArrayClass extends SimpleFileObject {\n    private ByteArrayOutputStream\
  \ out;\n    ByteArrayClass(String name) {\n        super(URI.create(\"bytes://\"\
  \ + name.replace('.', '/') + \".class\"),\n            Kind.CLASS);\n    }\n   \
  \ public byte[] getCode() {\n        return out.toByteArray();\n    }\n    public\
  \ OutputStream openOutputStream() throws IOException {\n        out = new ByteArrayOutputStream();\n\
  \        return out;\n    }\n}\n```\n\n接下来，你需要配置文件管理器以使用这些类作为输出：\n\n```java\nList<ByteArrayClass>\
  \ classes = new ArrayList<>();\nStandardJavaFileManager stdFileManager = compiler.getStandardFileManager(null,\
  \ null, null);\nJavaFileManager fileManager = new ForwardingJavaFileManager<JavaFileManager>(stdFileManager)\
  \ {\n    public JavaFileObject getJavaFileForOutput(Location location,\n       \
  \ String className, Kind kind, FileObject sibling)\n        throws IOException {\n\
  \        if (kind == Kind.CLASS) {\n            ByteArrayClass outfile = new ByteArrayClass(className);\n\
  \            classes.add(outfile);\n            return outfile;\n        } else\n\
  \            return super.getJavaFileForOutput(location, className, kind, sibling);\n\
  \    }\n};\n```\n\n要加载这些类，你需要类加载器（参见第 4 章）：\n\n```java\nclass ByteArrayClassLoader\
  \ extends ClassLoader {\n    private Iterable<ByteArrayClass> classes;\n    public\
  \ ByteArrayClassLoader(Iterable<ByteArrayClass> classes) {\n        this.classes\
  \ = classes;\n    }\n}\n```\n\n\n\n\n```java\n@Override public Class<?> findClass(String\
  \ name) throws ClassNotFoundException {\n    for (ByteArrayClass cl : classes) {\n\
  \        if (cl.getName().equals(\"/\" + name.replace('.','/') + \".class\")) {\n\
  \            byte[] bytes = cl.getCode();\n            return defineClass(name,\
  \ bytes, 0, bytes.length);\n        }\n    }\n    throw new ClassNotFoundException(name);\n\
  }\n```\n\n编译完成后，使用该类加载器调用 `Class.forName` 方法：\n\n点击此处查看代码图片\n\n```java\nByteArrayClassLoader\
  \ loader = new ByteArrayClassLoader(classes);\nClass<?> cl = Class.forName(\"Rectangle\"\
  , true, loader);\n```\n\n### 14.1.5 捕捉诊断\n\n要监听错误消息，请安装一个 `DiagnosticListener`。当编译器报告警告或错误消息时，监听器会接收一个\
  \ `Diagnostic` 对象。`DiagnosticCollector` 类实现了此接口。它只是收集所有的诊断信息，以便你可以在编译完成后对它们进行迭代。\n\
  \n点击此处查看代码图片\n\n```java\nDiagnosticCollector<JavaFileObject> collector = new DiagnosticCollector<>();\n\
  compiler.getTask(null, fileManager,\n    collector, null, null, sources).call();\n\
  for (Diagnostic<? extends JavaFileObject> d : collector.getDiagnostics()) {\n  \
  \  System.out.println(d);\n}\n```\n\n`Diagnostic` 对象包含有关问题位置的信息（包括文件名、行号和列号）以及一个人类可读的描述。\n\
  \n你也可以为标准文件管理器安装一个 `DiagnosticListener`，以防你需要捕获关于文件缺失的消息：\n\n点击此处查看代码图片\n\n```java\n\
  StandardJavaFileManager fileManager = compiler.getStandardFileManager(diagnostics,\
  \ null, null);\n```\n\n## 14.2 脚本 API\n\n脚本语言是一种通过在运行时解释程序文本来避免通常“编辑/编译/链接/运行”循环的语言。这鼓励了实验。此外，脚本语言通常复杂度较低，这使得它们适合作为你程序的专家用户的扩展语言。\n\
  \n脚本 API 允许你结合脚本和传统语言的优势。它使你能够从 Java 程序调用用 JavaScript、Groovy、Ruby 甚至是 Scheme 和 Haskell\
  \ 这样的冷门语言编写的脚本。在接下来的章节中，你将看到如何为特定语言选择引擎、如何执行脚本，以及如何利用某些脚本引擎提供的高级功能。\n\n#### 14.2.1\
  \ 获取脚本引擎\n\n脚本引擎是一个可以执行特定语言脚本的库。当虚拟机启动时，它会发现可用的脚本引擎。要列出这些引擎，请构造一个 `ScriptEngineManager`\
  \ 并调用 `getEngineFactories` 方法。\n\n通常情况下，你知道需要哪个引擎，只需按名称请求它即可。例如：\n\n点击此处查看代码图片\n\
  \n```java\nScriptEngineManager manager = new ScriptEngineManager();\nScriptEngine\
  \ engine = manager.getEngineByName(\"nashorn\");\n```\n\nJava 开发工具包包含一个名为“Nashorn”的\
  \ JavaScript 引擎，详见第 14.3 节“Nashorn 脚本引擎”，位于第 428 页。你可以通过在类路径上提供必要的 JAR 文件来添加更多语言。不再有与\
  \ Java 脚本集成的官方语言列表。只需使用你喜欢的搜索引擎查找你喜爱的语言的“JSR 223 support”即可。\n\n一旦有了引擎，只需通过调用以下即可即可脚本：\n\
  \n点击此处查看代码图片\n\n```java\nObject result = engine.eval(scriptString);\n```\n\n你还可以从\
  \ `Reader` 读取脚本：\n\n点击此处查看代码图片\n\n```java\nObject result = engine.eval(Files.newBufferedReader(path,\
  \ charset));\n```\n\n你可以在同一个引擎上调用多个脚本。如果一个脚本定义了变量、函数或类，大多数脚本引擎会保留这些定义供以后使用。例如：\n\
  \n点击此处查看代码图片\n\n```javascript\nengine.eval(\"n = 1728\");\nObject result = engine.eval(\"\
  n + 1\");\n```\n\n将返回 `1729`。\n\n***\n\n![图像](img/00005.jpeg) 备注\n\n要确定在多线程中并发执行脚本是否安全，请调用\
  \ `engine.getFactory().getParameter(\"THREADING\")`。返回的值为以下之一：\n\n- `null`：并发执行是不安全的。\n\
  - `\"MULTITHREADED\"`：并发执行是安全的。一个线程的影响可能在另一个线程中可见。\n- `\"THREAD-ISOLATED\"`：此外，为每个线程维护了不同的变量绑定。\n\
  - `\"STATELESS\"`：此外，脚本不会更改变量绑定。\n\n***\n\n### 14.2.2 绑定\n\n*绑定*（binding）由一个名称和一个关联的\
  \ Java 对象组成。例如，考虑这些语句：\n\n点击此处查看代码图片\n\n```java\nengine.put(\"k\", ...);\n```\n\n\
  \n\n\n```javascript\nengine.eval(\"function greet(how, whom) { return how + ', '\
  \ + whom + '!' }\");\n```\n\n// 使用参数 `\"Hello\"`, `\"World\"` 调用函数\n\n```javascript\n\
  result = ((Invocable) engine).invokeFunction(\n    \"greet\", \"Hello\", \"World\"\
  );\n```\n\n如果脚本语言是面向对象的，请调用 `invokeMethod`：\n\n点击此处查看代码\n\n// 在 `JavaScript` 中定义\
  \ `Greeter` 类\n\n```javascript\nengine.eval(\"function Greeter(how) { this.how =\
  \ how }\");\n\nengine.eval(\"Greeter.prototype.welcome = \"\n    + \" function(whom)\
  \ { return this.how + ', ' + whom + '!' }\");\n```\n\n// 构造实例\n```javascript\nObject\
  \ yo = engine.eval(\"new Greeter('Yo')\");\n```\n\n// 在实例上调用 `welcome` 方法\n```javascript\n\
  result = ((Invocable) engine).invokeMethod(yo, \"welcome\", \"World\");\n```\n\n\
  ***\n\n![Image](img/00005.jpeg) Note\n\n关于如何在 JavaScript 中定义类的更多信息，请参见 Douglas Crockford\
  \ 写的 *JavaScript—The Good Parts* (O’Reilly, 2008)。\n\n***\n\n***\n\n![Image](img/00005.jpeg)\
  \ Note\n\n如果脚本引擎没有实现 `Invocable` 接口，你可能仍然以一种独立语言的方式调用方法。`ScriptEngineFactory` 类的\
  \ `getMethodCallSyntax` 方法可以生成一个传递给 `eval` 方法的字符串。\n\n***\n\n你可以更进一步，要求脚本引擎实现一个\
  \ Java 接口。然后你就可以使用 Java 方法调用语法来调用脚本函数和方法。\n\n具体细节取决于脚本引擎，但通常你需要为接口的每个方法提供一个函数。例如，考虑一个\
  \ Java 接口：\n\n点击此处查看代码\n\n```java\npublic interface Greeter {\n    String welcome(String\
  \ whom);\n}\n```\n\n如果你在 Nashorn 中定义了一个同名的全局函数，你就可以通过这个接口调用它。\n\n点击此处查看代码\n\n//\
  \ 在 `JavaScript` 中定义 `welcome` 函数\n\n```javascript\nengine.eval(\"function welcome(whom)\
  \ { return 'Hello, ' + whom + '!' }\");\n```\n\n// 获取 Java 对象并调用 Java 方法\n```java\n\
  Greeter g = ((Invocable) engine).getInterface(Greeter.class);\nresult = g.welcome(\"\
  World\");\n```\n\n在面向对象的脚本语言中，你可以通过匹配的 Java 接口访问脚本类。例如，这里展示了使用 Java 语法调用 JavaScript\
  \ `Greeter` 类对象的方法：\n\n点击此处查看代码\n\n```java\nGreeter g = ((Invocable) engine).getInterface(yo,\
  \ Greeter.class);\nresult = g.welcome(\"World\");\n```\n\n请参见练习 2 获取更有用的示例。\n\n\
  ### 14.2.5 编译脚本\n\n某些脚本引擎可以将脚本代码编译为中间形式以进行高效执行。这些引擎实现了 `Compilable` 接口。以下示例展示了如何编译和评估脚本文件中包含的代码：\n\
  \n点击此处查看代码\n\n```java\nif (engine implements Compilable) {\n    Reader reader =\
  \ Files.newBufferedReader(path, charset);\n    CompiledScript script = ((Compilable)\
  \ engine).compile(reader);\n    script.eval();\n}\n```\n\n当然，只有当脚本执行了大量工作或者你需要频繁执行它时，编译脚本才有意义。\n\
  \n### 14.3 Nashorn 脚本引擎\n\nJava 开发工具包（JDK）附带了一个名为 Nashorn 的 JavaScript 引擎，它非常快且高度符合\
  \ JavaScript 的 ECMAScript 5.1 标准。你可以像使用其他脚本引擎一样使用 Nashorn，但它具有与 Java 互操作的特殊功能。\n\
  \n***\n\n![Image](img/00005.jpeg) Note\n\nNashorn 是德语中“犀牛”的意思——字面意思是“鼻角”，这暗指一本封上有犀牛的著名\
  \ JavaScript 书。（如果你读作 nas-horn 而不是 na-shorn，会获得额外的好誉。）\n\n***\n\n#### 14.3.1 从命令行运行\
  \ Nashorn\n\nJava 8 附带了一个名为 `jjs` 的命令行工具。只需启动它，并输入 JavaScript 命令即可。\n\n```bash\n\
  $ jjs\njjs> 'Hello, World'\nHello, World\n```\n\n在 Lisp、Scala 等世界中，你得到的是所谓的“读取-评估-打印”循环，即\
  \ REPL。每当你输入一个表达式，它的值就会打印出来。\n\n```javascript\njjs> 'Hello, World!'.length\n13\n\
  ```\n\n你可以定义函数并调用它们：\n\n点击此处查看代码\n\n```javascript\njjs> function(n) { return n <=\
  \ 1 ? 1 : n * factorial(n - 1) }\njjs> factorial(10)\n3628800\n```\n\n***\n\n![Image](img/00005.jpeg)\
  \ Note\n\nNashorn 是德语中“犀牛”的意思——字面意思是“鼻角”，这暗指一本封上有犀牛的著名 JavaScript 书。（如果你读作 nas-horn\
  \ 而不是 na-shorn，会获得额外的好誉。）\n\n***\n\n### 14.3.2 调用 Getters、Setters 和重载方法\n\n当 Nashorn\
  \ 程序中存在 Java 对象时，你可以在它们上调用方法。例如，假设你获取了 Java 类 `NumberFormat` 的一个实例：\n\n点击此处查看代码\n\
  \n```javascript\nvar fmt = java.text.NumberFormat.getPercentInstance()\n```\n\n\
  当然，你可以对它调用一个方法：\n\n点击此处查看代码\n\n```javascript\nfmt.setMinimumFractionDigits(2)\n\
  ```\n\n但在属性 getter 或 setter 的情况下，你可以有更好的方法，使用属性访问语法：\n\n```javascript\nfmt.minimumFractionDigits\
  \ = 2\n```\n\n如果表达式 `fmt.minimumFractionDigits` 出现在 `=` 运算符的左侧，它将被翻译为 `setMinimumFractionDigits`\
  \ 方法的调用。否则，它将变为调用 `fmt.getMinimumFractionDigits()`。你甚至可以使用 JavaScript 的括号表示法访问属性：\n\
  \n点击此处查看代码\n\n```javascript\nfmt['minimumFractionDigits'] = 2\n```\n\n注意 `[]` 运算符的参数是一个字符串。在当前上下文中这并不有用，但你可以使用字符串变量调用\
  \ `fmt[str]`，从而访问任意属性。\n\nJavaScript 没有方法重载的概念。给定的名称只能有一个方法，且它可以具有任意数量、任意类型的参数。Nashorn\
  \ 尝试通过查看参数的数量和类型来选择正确的 Java 方法。\n\n在绝大多数情况下，只有一个 Java 方法与所提供的参数匹配。如果没有匹配，你可以通过以下相当奇特的语法手动选择正确的方法：\n\
  \n```javascript\nlist'remove(Object)'\n```\n\n\n\n\n在这里，我们指定了 `remove(Object)` 方法，它会从列表中移除\
  \ `Integer` 对象 1。（还有一个 `remove(int)` 方法，它会移除位置在 1 处的对象。）\n\n### 14.3.3 构造 Java 对象\n\
  \n当你想要在 JavaScript 中构造对象时（而不是由脚本引擎交给你给你），你需要了解如何访问 Java 包。有两种机制。\n\n有全局对象 `java`、`javax`、`javafx`、`com`、`org`\
  \ 和 `edu`，它们通过点符号表示法产生包对象和类对象。例如，\n\n点击此处查看代码图片\n\n```javascript\nvar javaNetPackage\
  \ = java.net // 一个 `JavaPackage` 对象\n\nvar URL = java.net.URL // 一个 `JavaClass`\
  \ 对象\n```\n\n如果你需要访问一个不以上述标识符开头的包，可以在 `Package` 对象中找到它，例如 `Package.ch.cern`。\n\n\
  或者，调用 `Java.type` 函数：\n\n点击此处查看代码图片\n\n```javascript\nvar URL = Java.type('java.net.URL')\n\
  ```\n\n这比 `java.net.URL` 要快一点，并且你可以获得更好的错误检查。（如果你拼写错误，写成 `java.net.Url`，Nashorn\
  \ 会认为它是一个包。）但如果你追求速度和良好的错误处理，你可能根本就不该使用脚本语言，所以我将坚持使用较短的格式。\n\n***\n\n![Image](img/00005.jpeg)\
  \ 注意\n\nNashorn 文档建议类对象应该定义在脚本文件的顶部，就像你将 import 放在 Java 文件的顶部一样：\n\n点击此处查看代码图片\n\
  \n```javascript\nvar URL = Java.type('java.net.URL')\n\nvar JMath = Java.type('java.lang.Math')\n\
  \n// 避免与 JavaScript `Math` 对象冲突\n```\n\n***\n\n一旦你有了一个类对象，就可以调用静态方法：\n\n```javascript\n\
  JMath.floorMod(-3, 10)\n```\n\n要构造一个对象，将类对象传递给 JavaScript 的 `new` 运算符。以通常的方式传递任何构造函数参数：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar URL = java.net.URL\n\nvar url = new URL('http://horstmann.com')\n\
  ```\n\n如果你不在乎效率，你也可以调用\n\n点击此处查看代码图片\n\n```javascript\nvar url = new java.net.URL('http://horstmann.com')\n\
  ```\n\n***\n\n![Image](img/00009.jpeg) 注意事项\n\n如果你在 `new` 中使用 `Java.type`，你需要额外的一组括号：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar url = new (Java.type('java.net.URL'))('http://horstmann.com')\n\
  ```\n\n***\n\n如果你需要指定内部类，可以使用点符号表示法：\n\n点击此处查看代码图片\n\n```javascript\nvar entry =\
  \ new java.util.AbstractMap.SimpleEntry('hello', 42)\n```\n\n或者，如果你使用 `Java.type`，请像\
  \ JVM 那样添加一个 `$` Sign：\n\n点击此处查看代码图片\n\n```javascript\nvar Entry = Java.type('java.util.AbstractMap$SimpleEntry')\n\
  ```\n\n### 14.3.4 JavaScript 和 Java 中的字符串\n\nNashorn 中的字符串当然是 JavaScript 对象。例如，考虑以下调用\n\
  \n点击此处查看代码图片\n\n```javascript\n'Hello'.slice(-2) // 产生 `'lo'`\n```\n\n在这里，我们调用了\
  \ JavaScript 方法 `slice`。Java 中没有这种方法。\n\n但是调用\n\n```javascript\n'Hello'.compareTo('World')\n\
  ```\n\n也是有效的，尽管在 JavaScript 中没有 `compareTo` 方法。（你只需要使用 `<` 运算符即可。）\n\n在这种情况下，JavaScript\
  \ 字符串被转换为 Java 字符串。通常，每当 JavaScript 字符串被传递给 Java 方法时，它就会转换为 Java 字符串。\n\n还要注意，当任何\
  \ JavaScript 对象传递给带有 `String` 参数的 Java 方法时，它都会被转换为字符串。考虑\n\n点击此处查看代码图片\n\n```javascript\n\
