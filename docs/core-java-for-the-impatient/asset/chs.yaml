  \n**表 4–5** `java.lang.reflect` 包中有用的类和方法\n\n#### 4.5.5 JavaBeans\n\n许多面向对象的编程语言都支持*属性*，它们将表达式\
  \ `object`.`propertyName` 映射到 getter 或 setter 方法的调用，取决于该属性是可读还是可写的。Java 虽然没有这种语法，但它有一种约定，即属性与\
  \ getter/setter 对相对应。`JavaBean` 是一个具有无参构造函数、getter/setter 对以及任意数量方法的类。\n\ngetters\
  \ 和 setters 必须遵循特定的模式\n\n点击此处查看代码图像\n\n```java\npublic Type getProperty()\npublic\
  \ void setProperty(Type newValue)\n```\n\n通过省略 setter 或 getter，可以实现只读和只写属性。\n\n\
  属性的名称是 `get`/`set` 后后缀的*首字母小写化*形式。例如，`getSalary`/`setSalary` 产生一个名为 `salary` 的属性。然而，如果后缀的前*两个*字母是大写的，则按原样提取。例如，`getURL`\
  \ 产生一个名为 `URL` 的只读属性。\n\n***\n\n![Image](img/00005.jpeg) 注意\n\n对于布尔属性，你可以使用 `getProperty`\
  \ 或 `isProperty` 作为 getter，且优于后者。\n\n***\n\nJavaBeans 源于 GUI 构建器，Beans 规范有一套处理属性编辑器、属性更改事件和自定义属性发现的深奥规则。这些特性现在很少使用。\n\
  \n当你需要处理任意属性时，使用标准类来支持 JavaBeans 是一个好主意。给定一个类，如下所示获取 `BeanInfo` 对象：\n\n点击此处查看代码图像\n\
  \n```java\nClass<?> cl = ...;\nBeanInfo info = Introspector.getBeanInfo(cl);\nPropertyDescriptor[]\
  \ props = info.getPropertyDescriptors();\n```\n\n对于给定的 `PropertyDescriptor`，调用 `getName`\
  \ 和 `getPropertyType` 来获取属性的名称和类型。`getReadMethod` 和 `getWriteMethod` 生成 getter 和\
  \ setter 的 `Method` 对象。\n\n遗憾的是，没有方法根据指定的属性名称获取描述符，因此你必须遍历描述符数组：\n\n点击此处查看代码图像\n\
  \n```java\nString propertyName = ...;\nObject propertyValue = null;\nfor (PropertyDescriptor\
  \ prop : props) {\n    if (prop.getName().equals(propertyName))\n        propertyValue\
  \ = prop.getReadMethod().invoke(obj);\n}\n```\n\n#### 4.5.6 处理数组\n\n`isArray` 方法检查给定的\
  \ `Class` 对象是否表示数组。如果是，`getComponentType` 方法将产生描述数组的 `Class`。为了进一步分析或动态创建数组，请使用\
  \ `Array` 类。表 4–6 显示了它的方法。\n\n![Image](img/00034.jpeg)\n\n**表 4–6** `java.lang.reflect`\
  \ 有用的类和方法\n\n作为一个练习，让我们实现 `Arrays` 类中的 `copyOf` 方法。这是一个初步尝试：\n\n```java\npublic\
  \ static Object[] copyOf(Object array, int newLength) {\n    Class<?> cl = array.getClass();\n\
  \    if (!cl.isArray()) return null;\n    Class<?> componentType = cl.getComponentType();\n\
  \    int length = Array.getLength(array);\n    Object newArray = Array.newInstance(componentType,\
  \ newLength);\n    for (int i = 0; i < Math.min(length, newLength); i++) {\n   \
  \     Array.set(newArray, i, Array.get(array, i));\n    }\n    return newArray;\n\
  }\n```\n\n然而，结果数组有一个问题。该方法返回的类型是 `Object[]`。`Object[]` 不能转换为 `Person[]` 数组。为了创建一个与原始类型相同的新数组，你需要\
  \ `Array` 类的 `newInstance` 方法。提供组件类型和长度：\n\n点击此处查看代码图像\n\n```java\nint[] primes\
  \ = { 2, 3, 5, 7, 11 };\nprimes = (int[]) copyOf(primes, 10);\n```\n\n注意，这个 `copyOf`\
  \ 方法可以用于任何类型的数组，而不仅仅是对象数组。\n\n`copyOf` 的参数类型是 `Object`，而不是 `Object[]`。`int[]` 是一个\
  \ `Object` 但不是对象数组。\n\n#### 4.5.7 代理\n\n`Proxy` 类可以在运行时创建实现给定接口或一组接口的新类。这种代理只有在编译时尚不知道需要实现哪些接口时才是必要的。注意你不能简单地使用\
  \ `newInstance` 方法——你无法实例化接口。\n\n代理类拥有所有接口所需的方法，以及 `Object` 类中定义的所有方法（`toString`、`equals`\
  \ 等）。然而，由于你无法在运行时为这些方法定义新代码，你需要提供一个*调用处理器*，一个实现 `InvocationHandler` 接口类的对象。该接口只有一个方法：\n\
  \n```java\nObject invoke(Object proxy, Method method, Object[] args)\n```\n\n\n\n\
  \n\n当在代理对象上调用某个方法时，调用处理器的 `invoke` 方法会被调用，并传入原始调用的 `Method` 对象和参数。随后，调用处理器必须弄清楚如何处理该调用。调用处理器可能会采取许多可能的操作，例如将调用路由到远程服务器，或者为了调试之目的对调用进行跟踪。\n\
  \n要创建一个代理对象，请使用 `Proxy` 类的 `newProxyInstance` 方法。该方法有三个参数：\n\n*   一个类加载器（参见第 4.4.3\
  \ 节”，第 155 页），或传入 `null` 使用默认类加载器\n*   一个 `Class` 对象的数组，每个对象对应一个实现的接口\n*   调用处理器\n\
  \n为了展示代理的机制，这里有一个示例，其中数组中填充了 `Integer` 对象的代理，在打印跟踪消息后将调用转发到原始对象：\n\n点击此处查看代码图像\n\
  \n```java\nObject[] values = new Object[1000];\n\nfor (int i = 0; i < values.length;\
  \ i++) {\n    Object value = new Integer(i);\n    values[i] = Proxy.newProxyInstance(\n\
  \        null,\n        value.getClass().getInterfaces(),\n        // 调用处理器的 Lambda\
  \ 表达式\n        (Object proxy, Method m, Object[] margs) -> {\n            System.out.println(value\
  \ + \".\" + m.getName() + Arrays.toString(margs));\n            return m.invoke(value,\
  \ margs);\n        });\n}\n```\n\n当调用时\n\n点击此处查看代码图像\n\n```java\nArrays.binarySearch(values,\
  \ new Integer(500));\n```\n\n会产生以下输出：\n\n```\n499.compareTo[500]\n749.compareTo[500]\n\
  624.compareTo[500]\n561.compareTo[500]\n530.compareTo[500]\n514.compareTo[500]\n\
  506.compareTo[500]\n502.compareTo[500]\n500.compareTo[500]\n```\n\n你可以看到二分查找算法如何通过每一步将搜索范围减半来锁定键。\n\
  \n关键点在于，`compareTo` 方法是通过代理被调用的，尽管在代码中并没有显式提到这一点。`Integer` 实现的所有接口中的所有方法都被代理了。\n\
  \n***\n\n![Image](img/00009.jpeg) 注意\n\n当调用处理器被带有一个没有参数的方法调用调用时，参数数组为 `null`，而不是长度为\
  \ `0` 的 `Object[]` 数组。这完全是不可接受的，你不应该在自己的代码中这样做。\n\n***\n\n## 练习题\n\n**1.** 定义类 `Point`，包含一个构造方法\
  \ `public Point(double x, double y)` 和访问方法 `getX`、`getY`。定义一个子类 `LabeledPoint`，包含一个构造方法\
