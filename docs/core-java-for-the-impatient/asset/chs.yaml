  \ 文档并编写一个程序计算文件的 SHA-1 摘要。通过 `update` 方法向 `MessageDigest` 对象传递字节块，然后调用 `digest`\
  \ 显示结果。验证你的程序产生的结果与 `sha1sum` 工具一致。\n\n**8.** 编写一个工具方法，创建一个包含目录及其所有后代文件的 ZIP 文件。\n\
