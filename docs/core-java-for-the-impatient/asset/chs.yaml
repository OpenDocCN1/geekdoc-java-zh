  \n**4.** 定义抽象类 `Shape`，包含一个 `Point` 实例变量、一个构造方法、一个具体方法 `public void moveBy(double\
  \ dx, double dy)` 用于按量移动点，以及一个抽象方法 `public Point getCenter()`。提供具体的子类 `Circle`、`Rectangle`、`Line`\
  \ 以及相应的构造方法 `public Circle(Point center, double radius)`、`public Rectangle(Point\
  \ topLeft, double width, double height)` 和 `public Line(Point from, Point to)`。\n\
  \n**5.** 为上述练习中的类定义 `clone` 方法。\n\n**6.** 假设在第 4.2.2 节第 140 页“[equals 方法](#”，`Item.equals`\
  \ 方法使用了 `instanceof` 测试。实现 `DiscountedItem.equals`，使得当 `otherObject` 是一个 `Item`\
  \ 时只比较父类，但也包括了\n\n**7.** 当调用处理器被带有一个没有参数的方法调用调用时，参数数组为 `null`，而不是长度为 `0` 的 `Object[]`\
  \ 数组。这完全是不可接受的，你不应该在自己的代码中这样做。\n\n**8.** 当调用处理器被带有一个没有参数的方法调用调用时，参数数组为 `null`，而不是长度为\
  \ `0` 的 `Object[]` 数组。这完全是不可接受的，你不应该在自己的代码中这样做。\n\n**9.** 当调用处理器被带有一个没有参数的方法调用调用时，参数数组为\
  \ `null`，而不是长度为 `0` 的 `Object[]` 数组。这完全是不可接受的，你不应该在自己的代码中这样做。\n\n**10.** 当调用处理器被带有一个没有参数的方法调用调用时，参数数组为\
  \ `null`，而不是长度为 `0` 的 `Object[]` 数组。这完全是不可接受的，你不应该在自己的代码中这样做。\n\n\n\n\n\n# 10. 日志处理器可以将日志消息发送到备用目标，而格式化器控制消息的格式。\n\
  \n# 11. 你可以使用日志配置文件来控制日志属性。\n\n## 5.1 异常处理\n\n当方法遇到无法履行其契约的情况时，它应该做什么？传统的答案是方法应该返回某些错误代码。但对于调用该方法的程序员来说，这非常繁琐。调用者有义务检查错误，如果无法处理这些错误，则将错误代码返回给它自己的调用者。意不之中的是，程序员并不总是检查和传播返回代码，导致错误没有被检测到，从而在以后造成混乱。\n\
  \n与其让错误代码在方法调用链中层层向上溢泡，Java 支持异常处理，方法可以通过“抛出（throwing）”异常来信号严重问题。调用链中的某一个方法（但不一定是直接调用者）负责通过“捕获（catching）”异常来处理它。异常处理的根本优势是将检测错误与处理错误的过程解耦来。在接下来的章节中，你将看到如何在\
  \ Java 中处理异常。\n\n## 5.1.1 抛出异常\n\n方法可能会发现自己处于无法执行当前任务的情况下。也许是缺少所需的资源，或者提供的参数是不一致的。在这种情况下，最好的做法是抛出一个异常。\n\
  \n假设你实现了一个产生两个边界值之间的随机整数的方法：\n\n点击此处查看代码图像\n\n```\nprivate static Random generator\
  \ = new Random();\n\npublic static int randInt(int low, int high) {\n    return\
  \ low + (int) (generator.nextDouble() * (high - low + 1))\n}\n```\n\n如果有人调用 `randInt(10,\
  \ 5)`，会发生什么？尝试修复这个问题可能不是一个好主意，因为调用者可能在多个方面都产生了困惑。相反，应该抛出一个合适的异常：\n\n点击此处查看代码图像\n\
  \n```java\nif (low > high)\n    throw new IllegalArgumentException(\n        String.format(\"\
  low should be <= high but low is %d and high is %d\",\n            low, high));\n\
  ```\n\n如你所示，`throw` 语句被用于“抛出”一个类的对象——在这里是 `IllegalArgumentException`。该对象是用调试消息构造的。你将在下一节中看到如何选择合适的异常类。\n\
  \n当 `throw` 语句执行时，正常的执行流会立即被中断。`randInt` 方法停止执行且不向其调用者返回值。相反，控制将转移给处理器，正如你将在第 5.1.4\
  \ 节 “[捕获异常”第 178 页所示的那样。\n\n### 5.1.2 异常层次结构\n\n图 5–1 显示了 Java 中异常的层次结构。所有异常都是 `Throwable`\
  \ 类的子类。`Error` 的子类是在发生程序无法处理的异常情况时抛出的异常，例如内存耗尽。对于错误，除了向用户发送一条消息说明发生了非常严重的问题之外，你无能为力。\n\
  \n![Image](img/00035.jpeg)\n\n**图 5–1** 异常层次结构\n\n程序员报告的异常是 `Exception` 类的子类。这些异常分为两类：\n\
  \n- 未检查异常（Unchecked exceptions）是 `RuntimeException` 的子类。\n- 所有其他异常都是检查异常（checked\
  \ exceptions）。\n\n正如你将在下一节中看到的，程序员要么捕获检查异常，要么在方法头中声明它们。编译器会检查这些异常是否被妥善处理。\n\n***\n\
  \n![Image](img/00005.jpeg) 事项\n\n`RuntimeException` 这个名字有些遗憾。当然，所有异常都发生在运行时。然而，`RuntimeException`\
  \ 子类的异常在编译期间是不被检查的。\n\n***\n\n检查异常用于应该预料会失败的情况。失败的一个常见原因是输入和输出。文件可能会损坏，网络连接可能会失败。许多异常类继承自\
  \ `IOException`，你应该使用合适的异常来报告你遇到的任何错误。例如，当一个本该存在的文件实际上不存在时，抛出一个 `FileNotFoundException`。\n\
  \n未检查异常表示由程序员引起的逻辑错误，而不是不可避免的外部风险。例如，`NullPointerException` 就不被检查。几乎任何方法都可能抛出此类异常，程序员不应该花时间去捕获它们。相反，他们应该确保从根本上不对\
  \ `null` 进行解引用。\n\n有时，实现者需要根据自己的判断来区分检查异常和未检查异常。考虑调用 `Integer.parseInt(str)`。当 `str`\
  \ 不包含有效整数时，它会抛出一个未检查的 `NumberFormatException`。另一方面，当 `str` 不包含有效的类名时，`Class.forName(str)`\
  \ 会抛出一个受检查的 `ClassNotFoundException`。\n\n为什么为什么会有这种区别？这是因为在调用 `Integer.parseInt`\
  \ 之前，可以检查字符串是否为有效整数，但在实际尝试加载类之前，无法知道一个类是否可以被加载。\n\nJava API 提供了许多异常类，例如 `IOException`、`IllegalArgumentException`\
  \ 等。你应该在适当的时候使用它们。然而，如果没有一个标准异常类适合你的需求，你可以通过继承 `Exception`、`RuntimeException` 或另一个异常类来创建自己的异常。\n\
  \n当你这样做时，最好提供一个无参构造函数和一个带消息字符串的构造函数。例如，\n\n点击此处查看代码图像\n\n```java\npublic class FileFormatException\
  \ extends IOException {\n    public FileFormatException() {}\n    public FileFormatException(String\
  \ message) {\n        super(message);\n    }\n    // 为链式异常添加构造函数——参见 5.1.7 节\n}\n\
  ```\n\n### 5.1.3 声明检查异常\n\n任何可能产生检查异常的方法必须在方法头中使用 `throws` 子句声明它：\n\n点击此处查看代码图像\n\
  \n```java\npublic void write(Object obj, String filename)\n    throws IOException,\
  \ ReflectiveException\n```\n\n列出方法可能抛出的异常，无论是由于 `throw` 语句还是由于调用了带有 `throws` 子句的方法。\n\
  \n在 `throws` 子句中，你可以合并到一个公共父类。这是否是一个好主意取决于异常本身。例如，如果一个方法可以抛出多个 `IOException` 的子类，那么将它们包含在\
  \ `throws IOException` 子句中是合理的。但如果异常是不相关的，不要将它们合并为 `throws Exception`——这将违背异常检查的初衷。\n\
  \n***\n\n![Image](img/00013.jpeg) 提示\n\n有些程序员认为承认方法可能会抛出异常是羞耻的。难道处理它更好吗？实际上，事实恰恰相反。你应该让每个异常都能找到合适的处理器。异常的黄金法是：“尽早抛，晚些捕”。\n\
  \n***\n\n当你重写方法时，它抛出的检查异常不能多于父类方法声明的。例如，如果你扩展了本节开始的 `write` 方法，覆盖方法可以抛出更少的异常：\n\n\
  点击此处查看代码图像\n\n```java\npublic void write(Object obj, String filename)\n    throws\
  \ FileNotFoundException\n```\n\n但如果方法尝试抛出一个不相关的检查异常（例如 `InterruptedException`），它将无法编译。\n\
  \n***\n\n\n\n\n如果父类方法没有 `throws` 子句，则重写的方法不能抛出受检异常（checked exception）。\n\n你可以使用\
  \ javadoc 的 `@throws` 标签来记录方法何时抛出（受检或未受检的）异常。大多数程序员只在有意义的内容需要记录时才会这样做。例如，当输入/输出出现问题时，告诉用户会抛出\
  \ `IOException` 并没有太大价值。但像下面的注释就是很有意义的：\n\n点击此处查看代码图片\n\n@throws NullPointerException\
  \ 如果 filename 为 null\n\n@throws FileNotFoundException 如果不存在名为 filename 的文件\n\n![Image](img/00005.jpeg)\
  \ Note\n\n你永远不需要为 lambda 表达式指定异常类型。然而，如果 lambda 表达式可能会抛出受检异常，你只能将其传递给一个其方法声明了该异常的函数接口。例如，以下调用：\n\
  \n点击此处查看代码图片\n\n```\nlist.forEach(obj -> write(obj, \"output.dat\"));\n```\n\n是一个错误。`forEach`\
  \ 方法的参数是函数接口\n\n点击此处查看代码图片\n\n```java\npublic interface Consumer<T> {\n    void\
  \ accept(T t);\n}\n```\n\n`accept` 方法被声明不抛出任何受检异常。\n\n### 5.1.4 捕获异常\n\n要捕获异常，请设置一个\
  \ `try` 块。它最简单的形式看起来如下：\n\n```java\ntry {\n    statements\n} catch (ExceptionClass\
  \ ex) {\n    handler\n}\n```\n\n如果在执行 `try` 块中的语句时发生了给定类的异常，则控制权将转移到处理器（handler）。异常变量（我们示例中的\
  \ `ex`）引用异常对象，如果需要，处理器可以检查该对象。\n\n你可以对这个基础结构进行两种修改。你可以为不同的异常类设置多个处理器：\n\n点击此处查看代码图片\n\
  \n```java\ntry {\n    statements\n} catch (ExceptionClass[1] ex) {\n    handler[1]\n\
  } catch (ExceptionClass[2] ex) {\n    handler[2]\n} catch (ExceptionClass[3] ex)\
  \ {\n    handler[3]\n}\n```\n\n`catch` 子句是从上到下匹配的，因此最具体的异常类必须放在前面。\n\n或者，你可以在多个异常类之间共享一个处理器：\n\
  \n点击此处查看代码图片\n\n```java\ntry {\n    statements\n} catch (ExceptionClass[1] | ExceptionClass[2]\
  \ | ExceptionClass[3] ex) {\n    handler\n}\n```\n\n在这种情况下，处理器只能调用属于所有异常类的方法。\n\n\
  ### 5.1.5 Try-with-resources 语句\n\n异常处理的一个问题是资源管理。假设你向文件写入内容并在完成后后关闭它：\n\n点击此处查看代码图片\n\
  \n```java\nArrayList<String> lines = ...;\nPrintWriter out = new PrintWriter(\"\
  output.txt\");\nfor (String line : lines) {\n    out.println(line.toLowerCase());\n\
  }\nout.close();\n```\n\n这段代码有一个隐藏的危险。如果任何方法抛出异常，`out.close()` 调用将不会发生。这是很糟糕。输出可能会丢失，或者如果触发多次异常，系统可能会耗尽文件句柄。\n\
  \n`try` 语句的一种特殊形式可以解决这个问题。你可以在 `try` 语句的头部指定任意数量的 `resources`：\n\n点击此处查看代码图片\n\n\
  ```java\ntry (ResourceType[1] res[1] = init[1]; ResourceType[2] res[2] = init[2];\
  \ ...) {\n    statements\n}\n```\n\n每个资源必须属于实现 `AutoCloseable` 接口的类。该接口有一个方法\n\n\
  点击此处查看代码图片\n\n```java\npublic void close() throws Exception\n```\n\n![Image](img/00005.jpeg)\
  \ Note\n\n还有一个 `Closeable` 接口。它是 `AutoCloseable` 的子接口，同样有一个 `close` 方法。然而，该方法被声明为抛出\
  \ `IOException`。\n\n当 `try` 块退出时（无论是到达末尾还是抛出了异常），所有资源对象的 `close` 方法都会被调用。例如：\n\n\
  点击此处查看代码图片\n\n```java\nArrayList<String> lines = ...;\ntry (Scanner in = new Scanner(Paths.get(\"\
  /usr/share/dict/words\"));\n     PrintWriter out = new PrintWriter(\"output.txt\"\
  )) {\n    while (in.hasNext()) {\n        out.println(in.next().toLowerCase());\n\
  \    }\n}\n```\n\n这个 `try` 块保证了无论是否发生异常，`close` 方法都会被调用。当 `try` 块退出时（无论是因为了末尾还是因为抛出了异常），所有资源对象的\
  \ `close` 方法都会被调用。例如：\n\n点击此处查看代码图片\n\n```java\nArrayList<String> lines = ...;\n\
  try (Scanner in = new Scanner(Paths.get(\"/usr/share/dict/words\"));\n     PrintWriter\
  \ out = new PrintWriter(\"output.txt\")) {\n    while (in.hasNext()) {\n       \
  \ out.println(in.next().toLowerCase());\n    }\n}\n```\n\n这个 `try` 块保证了无论是否发生异常，`close`\
  \ 方法都会被调用。这是一个使用两个资源的示例：\n\n点击此处查看代码图片\n\n资源以初始化的相反顺序关闭。当 `try` 块结束时，无论是正常结束还是由于抛出异常，所有资源\
  \ string 对象的 `close` 方法都会被调用。\n\n如果你想在（极罕见的）无法使用 try-with-resources 语句的情况下手动实现这种机制，请调用\
  \ `ex.addSuppressed(secondaryException)`。try-with-resources 语句可以选择带有 `catch` 子句来捕获任何异常。\n\
  \n### 5.1.6 finally 子句\n\n正如你所见，try-with-resources 语句无论是否发生异常都会关闭资源。有时，你需要清理不是 `AutoCloseable`\
  \ 的东西。在这种情况下，使用 `finally` 子句：\n\n```java\ntry {\n    Do work\n} finally {\n    Clean\
  \ up\n}\n```\n\n`finally` 子句在 `try` 块结束时执行，无论是正常结束还是由于异常。\n\n这种模式出现在你需要获取和释放锁、增加和减少计数器，或者在栈中推入内容并在完成后弹出它的时候。你希望无论抛出什么异常，这些操作都会发生。\n\
  \n你应该避免在 `finally` 子句中抛出异常。如果 `try` 块体由于异常终止，该异常会被 `finally` 子句中的异常掩盖。你在上一节中看到的抑制机制只适用于\
  \ try-with-resources 语句。\n\n同样，`finally` 子句不应包含 `return` 语句。如果 `try` 块体也有 `return`\
  \ 语句，`finally` 子句中的将替换返回值。\n\n可以形成带有 `catch` 子句并后跟 `finally` 子句的 `try` 语句。但你必须对\
  \ `finally` 子句中的异常非常小心。例如，看看这个改编自在线教程的 `try` 块：\n\n点击此处查看代码图片\n\n```java\nBufferedReader\
  \ in = null;\ntry {\n    in = Files.newBufferedReader(path, StandardCharsets.UTF_8);\n\
  \    Read from in\n}\n```\n\n\n\n\n```java\n} catch (IOException ex) {\n    System.err.println(\"\
  Caught IOException: \" + ex.getMessage());\n} finally {\n    if (in != null) {\n\
  \        in.close(); // Caution—might throw an exception\n    }\n}\n```\n\n程序员显然考虑了\
  \ `Files.newBufferedReader` 方法抛出异常的情况。这段代码看起来会捕获并打印所有的 I/O 异常，但实际上它漏掉了一个：即由 `in.close()`\
  \ 可能抛出的异常。通常情况下，将一个复杂的 `try`/`catch`/`finally` 语句重写为 `try-with-resources` 语句，或者通过在\
  \ `try`/`catch` 语句内部嵌套 `try`/`finally` 语句——参见练习 6。\n\n### 5.1.7 重新抛出和链式异常\n\n当发生异常时，你可能不知道该如何处理，但你可能想要记录这次失败。在这种情况下，重新抛出异常，以便让胜任的处理器来处理它：\n\
  \n点击此处查看代码图像\n\n```java\ntry {\n    Do work\n} catch (Exception ex) {\n    logger.log(level,\
  \ message, ex);\n    throw ex;\n}\n```\n\n***\n\n![Image](img/00005.jpeg) 注意\n\n\
  当这段代码位于一个可能抛出受检异常的方法内部时，会发生一些微妙的变化。假设封装的方法声明为：\n\n点击此处查看代码图像\n\n```java\npublic\
  \ void read(String filename) throws IOException\n```\n\n初看之下，似乎需要将 `throws` 子句改为\
  \ `throws Exception`。然而，Java 编译器会仔细跟踪流，并意识到 `ex` 只能是由 `try` 块中某条语句抛出的异常，而不是任意的 `Exception`。\n\
  \n***\n\n有时，你想更改被抛出异常的类型。例如，你可能需要用一个对子系统用户有意义异常类来报告子系统的失败。假设你在 servlet 中遇到了数据库错误。执行该\
  \ servlet 的代码可能不想详细知道出了什么问题，但它绝对想知道是 servlet 的错。在这种情况下，捕获原始异常并将其链到更高层次的异常：\n\n点击此处查看代码图像\n\
  \n```java\ntry {\n    Access the database\n} catch (SQLException ex) {\n    throw\
  \ new ServletException(\"database error\", ex);\n}\n```\n\n当捕获到 `ServletException`\
  \ 时，可以按方式获取原始异常：\n\n点击此处查看代码图像\n\n```java\nThrowable cause = ex.getCause();\n```\n\
  \n`ServletException` 类有一个构造函数，可以将异常的成因作为参数传入。并不是所有的异常类都这样做。在这种情况下，你必须调用 `initCause`\
  \ 方法，如下所示：\n\n点击此处查看代码图像\n\n```java\ntry {\n    Access the database\n} catch (SQULexception\
  \ ex) {\n    Throwable ex2 = new CruftyOldException(\"database error\");\n    ex2.initCause(ex);\n\
  \    throw ex2;\n}\n```\n\n如果你提供了了自己的异常类，除了第 5.1.2 节中描述的两个构造函数外，还应该提供在第 175 页的“异常层次结构”中提到的以下构造函数：\n\
  \n点击此处查看代码图像\n\n```java\npublic class FileFormatException extends IOException {\n\
  \    ...\n    public FileFormatException(Throwable cause) { initCause(cause); }\n\
  \    public FileFormatException(String message, Throwable cause) {\n        super(message);\n\
  \        initCause(cause);\n    }\n}\n```\n\n***\n\n![Image](img/00013.jpeg) 提示\n\
  \n如果在一个不允许抛出受检异常的方法中发生了受检异常，链式技术也很有用。你可以捕获该受检异常并将其链到一个非受检异常。\n\n***\n\n### 5.1.8\
  \ 堆栈轨迹\n\n如果异常在任何地方都没有被捕获，就会显示一个*堆栈轨迹*（stack trace）——即异常抛出处所有等待方法调用的列表。堆栈轨迹被发送到\
  \ `System.err`。\n\n如果你想将堆栈轨迹保存到某处以便你的人员检查，可以设置默认的未捕获异常处理器：\n\n点击此处查看代码图像\n\n```java\n\
  Thread.setDefaultUncaughtExceptionHandler((thread, ex) -> {\n    ...\n});\n```\n\
  \n***\n\n![Image](img/00005.jpeg) 注意\n\n未捕获的异常会终止发生它的线程。\n\n***\n\n有时，你被迫捕获一个异常但不知道如何处理它。例如，与其忽略异常，不如至少打印堆栈轨迹：\n\
  \n点击此处查看代码图像\n\n```java\ntry {\n    Class<?> cl = Class.forName(className);\n  \
  \  ...\n} catch (ClassNotFoundException ex) {\n    ex.printStackTrace();\n}\n```\n\
  \n如果你想存储异常的堆栈轨迹，可以将其放入字符串中：\n\n点击此处查看代码图像\n\n```java\nByteArrayOutputStream out\
  \ = new ByteArrayOutputStream();\nex.printStackTrace(out);\nString description =\
  \ out.toString();\n```\n\n***\n\n![Image](img/00005.jpeg) 注意\n\n如果你需要更详细地处理堆栈轨迹，可以调用\n\
  \n点击此处查看代码图像\n\n```java\nStackTraceElement[] frames = ex.getStackTrace();\n```\n\
  \n并分析 `StackTraceElement` 实例。详情请参阅 API 文档。\n\n***\n\n### 5.1.9 Objects.requireNonNull\
  \ 方法\n\n`Objects` 类有一个方法可以方便地对参数进行空检查。这里是一个示例用法：\n\n点击此处查看代码图像\n\n```java\npublic\
  \ void process(String directions) {\n    this.directions = Objects.requireNonNull(directions);\n\
  \    ...\n}\n```\n\n如果 `directions` 为 `null`，则会抛出一个 `NullPointerException`——起初似乎并不是什么巨大的改进。但考虑从堆栈轨迹回溯：当你看到\
  \ `requireNonNull` 的调用是罪魁祸首时，你立刻知道自己做错了哪里。\n\n你还可以为异常提供一个消息字符串：\n\n点击此处查看代码图像\n\n\
  ```java\nthis.directions = Objects.requireNonNull(directions, \"directions must\
  \ not be null\");\n```\n\n## 5.2 断言\n\n断言（Assertions）是防御性编程中常用的惯用法。假设你确定某个属性已经满足，并且你在代码中依赖该属性。例如，你可能正在计算：\n\
  \n```java\ndouble y = Math.sqrt(x);\n```\n\n你确定 `x` 不是负数。尽管如此，你仍想双重检查，而不是让“非数字”（NaN）浮点值渗透到你的计算中。你当然可以抛出一个异常：\n\
  \n```java\nif (x < 0) throw new IllegalStateException(x + \" < 0\");\n```\n\n但这个条件在测试完成后仍然留于程序中，减慢了运行速度。断言机制允许你在测试期间进行检查，并在生产代码中自动移除它们。\n\
  \n***\n\n![Image](img/00005.jpeg) 注意\n\n在 Java 中，断言旨在作为验证内部假设的调试工具，而不是强制合约的机制。例如，如果你想报告公共方法的不当参数，不要使用断言，而要抛出\
  \ `IllegalArgumentException`。\n\n### 5.2.1 使用断言\n\nJava 中的断言语句有两种形式：\n\n点击此处查看代码图像\n\
  \n```java\nassert condition;\n\nassert condition : expression;\n```\n\n\n\n\n`assert`\
  \ 语句会评估条件，如果条件为假，则会抛出 `AssertionError`。在第二种形式中，表达式被转换为字符串，并作为错误对象的消息。\n\n***\n\n\
  ![Image](img/00005.jpeg) 注意\n\n如果表达式是一个 `Throwable`，它也会被设置为断言错误的原因（参见第 5.1.7 节 节，“重新抛出和链式异常”，位于第\
  \ [182]](#part0012.html_ch05lev2sec7) 页）。\n\n***\n\n例如，要断言 `x` 非负，你可以简单地使用该语句\n\n\
  ```java\nassert x >= 0;\n```\n\n或者，你可以将 `x` 的实际值传入 `AssertionError` 对象，以便稍后显示：\n\
  \n```java\nassert x >= 0 : x;\n```\n\n## 5.2.2 启用和禁用断言\n\n默认情况下，断言是禁用的。通过在运行程序时使用\
  \ `-enableassertions` 或 `-ea` 来启用它们：\n\n```bash\njava -ea MainClass\n```\n\n你不需要重新编译程序，因为启用或禁用断言是由类加载器处理的。当断言禁用时，类加载器会移除断言代码，使其不会影响执行速度。你甚至可以在特定的类或整个包中启用断言，例如：\n\
  \n点击此处查看代码图片\n\n```bash\njava -ea:MyClass -ea:com.mycompany.mylib... MainClass\n\
  ```\n\n此命令为类 `MyClass` 以及 `com.mycompany.mylib` 包*及其子包*中的所有类开启断言。`-ea...` 选项开启默认包中所有类的断言。\n\
  \n你也可以使用 `-disableassertions` 或 `-da` 选项禁用某些类和包的断言：\n\n点击此处查看代码图片\n\n```bash\njava\
  \ -ea:... -da:MyClass MainClass\n```\n\n当你使用 `-ea` 和 `-da` 切换来启用或禁用所有断言（而不仅仅是特定类或包）时，它们不应用于未通过类加载器加载的“系统类”。使用\
  \ `-enablesystemassertions`/`-esa` 切换来启用系统类中的断言。\n\n还可以通过以下方法程序地控制类加载器的断言状态：\n\n\
  点击此处查看代码图片\n\n```java\nvoid ClassLoader.setDefaultAssertionStatus(boolean enabled);\n\
  void ClassLoader.setClassAssertionStatus(String className, boolean enabled);\nvoid\
  \ ClassLoader.setPackageAssertionStatus(String packageName, boolean enabled);\n\
  ```\n\n与 `-enableassertions` 命令行选项一样，`setPackageAssertionStatus` 方法会为指定的包及其子包设置断言状态。\n\
  \n## 5.3 日志\n\n每位 Java 程序员都熟悉在麻烦代码中插入 `System.out.println` 调用以获取程序行为见解的过程。当然，一旦你发现了问题的原因，就会移除这些打印语句——结果在下一个问题出现时又把它们放回来。日志\
  \ API 设计的设计就是为了克服这个问题。\n\n### 5.3.1 使用记录器\n\n让我们从最简单的案例开始。日志系统管理一个默认记录器，你通过调用 `Logger.getGlobal()`\
  \ 获取该记录器。使用 `info` 方法记录一条信息消息：\n\n点击此处查看代码图片\n\n```java\nLogger.getGlobal().info(\"\
  Opening file \" + filename);\n```\n\n记录的打印如下：\n\n点击此处查看代码图片\n\n```\nAug 04, 2014\
  \ 09:53:34 AM com.mycompany.MyClass read INFO: Opening file data.txt\n```\n\n注意，时间以及调用类和方法名会自动包含在内。\n\
  \n然而，如果你调用\n\n点击此处查看代码图片\n\n```java\nLogger.global.setLevel(Level.OFF);\n```\n\n\
  那么对 `info` 的调用将没有任何效果。\n\n***\n\n![Image](img/00005.jpeg) 注意\n\n在上面的示例中，即使禁用了日志，消息\
  \ `\"Opening file \" + filename` 也会被创建。如果你担心创建消息的成本，可以使用 Lambda 表达式代替它：\n\n点击此处查看代码图片\n\
  \n```java\nLogger.getGlobal().info(() -> \"Opening file \" + filename);\n```\n\n\
  ***\n\n### 5.3.2 记录器\n\n在专业应用程序中，你不想将所有记录都记录到单个全局记录器。相反，你可以定义自己的记录器。\n\n当你第一次请求具有给定名称的记录器时，它会被创建。\n\
  \n点击此处查看代码图片\n\n```java\nLogger = Logger.getLogger(\"comcompany.myapp\");\n```\n\
  \n同一名称的后续调用将产生相同的记录器。与包一样，记录器名称是层级化的。事实上，它们比包更具层级性。### 5.3.3 日志级别\n\n共有七个级别：`SEVERE`、`WARNING`、`INFO`、`CONFIG`、`FINE`、`FINER`、`FINEST`。默认情况下，`INFO`\
  \ 或更高级别会被记录。你可以设置不同的阈值，例如：\n\n```java\nlogger.setLevel(Level.FINE);\n```\n\n或者，如果级别是变量：\n\
  \n```java\nLevel level = ...;\nlogger.log(level, message);\n```\n\n你也可以使用 `Level.ALL`\
  \ 开启日志或使用 `Level.OFF` 关闭。\n\n***\n\n![Image](img/0013.jpeg) 注意\n\n如果你将日志设置为比 `INFO`\
  \ 更细的值，还需要更改日志处理器。\n\n***\n\n***\n\n### 5.3.4 其他日志方法\n\n用于执行流的便利方法：\n\n点击此处查看代码图片\n\
  \n```java\nvoid entering(String className, String methodName)\nvoid entering(String\
  \ className, String methodName, Object param)\nvoid entering(String className, String\
  \ methodName, Object[] params)\nvoid exiting(String className, String methodName)\n\
  void exiting(String className, String methodName, Object result)\n```\n\n例如：\n\n\
  点击此处查看代码图片\n\n```java\npublic int read(String file, String pattern) {\n    logger.entering(\"\
  com.mycompany.mylib.Reader\", \"read\", new Object[] { file, pattern });\n    ...\n\
  \    logger.exiting(\"com.mycompany.mylib.Reader\", \"read\", count);\n    return\
  \ count;\n}\n```\n\n这些调用生成以 `ENTRY` 和 `RETURN` 字符串开头的 `FINER` 记录。\n\n***\n\n![Image](img/0005.jpeg)\
  \ 注意\n\n奇怪的是，这些方法从未转换为带有可变参数的方法。\n\n***\n\n日志的一个常见用途是记录意外异常。两个便利方法在日志记录包含了异常的描述。\n\
  \n点击此处查看代码图片\n\n```java\nvoid log(Level l, String message, Throwable t)\nvoid throwing(String\
  \ className, String methodName, Throwable t)\n```\n\n典型的用法如下：\n\n点击此处查看代码图片\n\n\
  ```java\ntry {\n    ...\n} catch (IOException ex) {\n    logger.log(Level.SEVERE,\
  \ \"Cannot read configuration\", ex);\n}\n```\n\n以及\n\n点击此处查看代码图片\n\n```java\nif\
  \ (...) {\n```\n\n\n\n\n```java\nIOException ex = new IOException(\"Cannot read\
  \ configuration\");\n\nlogger.throwing(\"com.mycompany.mylib.Reader\", \"read\"\
  , ex);\n\nthrow ex;\n```\n\n`throwing` 调用会记录一条级别为 `FINER` 的记录，其消息以 `THROW` 开头。\n\
  \n***\n\n![Image](img/00005.jpeg) 注意\n\n默认的日志记录显示包含日志调用的类名和方法名，这是从调用栈中推断出来的。然而，如果虚拟机优化了执行，可能无法获得准确的调用信息。你可以使用\
  \ `logp` 方法来提供调用类和方法的精确位置。方法签名如下：\n\n点击此处查看代码图片\n\n```\nvoid logp(Level l, String\
  \ className, String methodName, String message)\n```\n\n***\n\n***\n\n![Image](img/00005.jpeg)\
  \ 注意\n\n如果你希望让使用多种语言的用户能够理解日志消息，可以使用方法对它们进行本地化处理：\n\n点击此处查看代码图片\n\n```\nvoid logrb(Level\
  \ level, String sourceClass, String sourceMethod,\n      ResourceBundle bundle,\
  \ String msg, Object... params)\n\nvoid logrb(Level level, String sourceClass, String\
  \ sourceMethod,\n      ResourceBundle bundle, String msg, Throwable thrown)\n```\n\
  \n资源包（Resource bundles）在第 13 章中介绍。\n\n***\n\n### 5.3.5 日志配置\n\n你可以通过编辑配置文件更改日志系统的各种属性。默认配置文件位于\
  \ `jre/lib/logging.properties`。要使用另一个文件，可以在启动应用程序时通过将 `java.util.logging.config.file`\
  \ 属性设置为文件位置：\n\n点击此处查看代码图片\n\n```\njava -Djava.util.logging.config.file=configFile\
  \ MainClass\n```\n\n***\n\n![Image](img/00009.jpeg) 注意\n\n在 `main` 方法中调用 `System.setProperty(\"\
  java.util.logging.config.file\", configFile)` 是无效的，因为日志管理器是在 VM 启动期间初始化的，在 `main`\
  \ 执行之前。\n\n***\n\n要更改默认日志级别，请编辑配置文件并修改该行：\n\n```\n.level=INFO\n```\n\n你可以通过添加如下行来为你自己的日志记录器指定日志级别：\n\
  \n点击此处查看代码图片\n\n```\ncom.mycompany.myapp.level=FINE\n```\n\n即在日志记录器名称后附加 `.level`\
  \ 后缀。\n\n正如你将在下一节中看到的，日志记录器并没有将消息发送到控制台——那是处理器（handlers）的工作。处理器也有级别。若要在控制台上**看到\
  \ `FINE` 消息，你还需要设置：\n\n点击此处查看代码图片\n\n```\njava.util.logging.ConsoleHandler.level=FINE\n\
  ```\n\n***\n\n![Image](img/00009.jpeg) 注意\n\n日志管理器配置中的设置不是系统属性。使用 `-Dcom.mycompany.myapp.level=FINE`\
  \ 启动程序对日志记录器没有任何影响。\n\n***\n\n还可以通过 `jconsole` 程序在运行的程序中更改日志级别。详情请参阅 [`www.oracle.com/technetwork/articles/java/jconsole-1564139.html#LoggingControl`](http://www.oracle.com/technetwork/articles/java/jconsole-1564139.html#LoggingControl)\
  \ 。\n\n### 5.3.6 日志处理器\n\n默认情况下，日志记录器将记录发送到 `ConsoleHandler`，该处理器将其打印到 `System.err`\
  \ 流中。具体来说，日志记录器将记录发送给父处理器，而最终祖先（名称为 `\"\"`）拥有一个 `ConsoleHandler`。\n\n日志记录器一样，处理器也有日志级别。要使记录被记录，其日志级别必须高于日志记录器和处理器的阈值。日志管理器配置文件设置默认控制台处理器的日志级别为：\n\
  \n点击此处查看代码图片\n\n```\njava.util.logging.ConsoleHandler.level=INFO\n```\n\n要记录级别为\
  \ `FINE` 的记录，请在配置中更改默认日志记录器级别和处理器级别。或者，你可以完全跳过配置文件并安装自己的处理器：\n\n点击此处查看代码图片\n\n```\n\
  Logger logger = Logger.getLogger(\"com.mycompany.myapp\");\nlogger.setLevel(Level.FINE);\n\
  logger.setUseParentHandlers(false);\nHandler handler = new ConsoleHandler();\nhandler.setLevel(Level.FINE);\n\
  logger.addHandler(handler);\n```\n\n默认情况下，日志记录器会将记录同时发送到自己的处理器和父级器的处理器。我们的日志记录器是最终祖先\
  \ `\"\"` 的后代，它会将记录发送到控制台。我们不希望看到两次记录，因此我们将 `useParentHandlers` 设置为 `false`。API 提供了两种处理器：`FileHandler`\
  \ 和 `SocketHandler`。`FileHandler` 将记录发送到文件，如下：\n\n点击此处查看代码图片\n\n```java\nFileHandler\
  \ handler = new FileHandler();\n```\n\n`FileHandler` 将记录发送到文件，其中 `n` 是数字。默认文件名为\
  \ `java.log.n`。每当文件超过大小限制时，旧的日志会被删除，其他文件会被重命名，并创建一个生成号为 `0` 的新文件。典型的日志记录格式如下：\n\n\
  ```xml\n<record>\n  <date>2014-08-04T09:53:34</date>\n  <millis>140714</millis>\n\
  \  <sequence>1</sequence>\n  <logger>com.mycompany.myapp</logger>\n  <level>INFO</level>\n\
  \  <thread>10</thread>\n  <message>Opening staff.txt</message>\n</record>\n```\n\
  \n你可以通过在日志管理器配置中设置各种参数来更改文件处理器的默认行为（见表 5-1），或使用以下构造函数：\n\n点击此处查看代码图片\n\n```\nFileHandler(String\
  \ pattern)\nFileHandler(String pattern, boolean append)\nFileHandler(String pattern,\
  \ int limit, int count)\nFileHandler(String pattern, int limit, int count, boolean\
  \ append)\n```\n\n![Image](img/00036.jpeg)\n\n**表 5-1 文件处理器配置**\n\n参阅表 5-1 构造参数的含义。你可能不想使用默认日志文件。使用如\
  \ `%h/myapp.log` 的模式（见表 5-2 模式变量的解释）。\n\n![Image](img/00037.jpeg)\n\n**表 5-2 日志变量**\n\
  \n如果多个应用程序（或同一程序的多个副本）使用同一个日志文件，你应该开启 `append` 标志。或者，在文件名中使用 `%u`以便每个应用程序创建一个唯一的副本。\n\
  \n### 5.3.7 过滤器和格式化器\n\n除了日志级别过滤外，每个日志记录器和处理器都可以有一个额外的过滤器，该过滤器实现 `Filter` 接口，这是一个包含一个方法的函数接口：\n\
  \n```\nboolean isLoggable(LogRecord record)\n```\n\n要把过滤器安装到日志记录器或处理器中，请调用 `setFilter`\
  \ 方法。注意，一次只能有一个过滤器。\n\n`ConsoleHandler` 和 `FileHandler` 类以文本和 XML 格式输出日志记录。然而，你也可以定义自己的格式。扩展\
  \ `Formatter` 类并重写该方法：\n\n```\nString format(LogRecord record)\n```\n\n\n\n\n以你喜欢的任何格式化记录并返回生成的字符串。在你的\
  \ `format` 方法中，你可能想要调用该方法：\n\n点击此处查看代码图片\n\n```\nString formatMessage(LogRecord\
  \ record)\n```\n\n该方法格式化记录的记录部分，替换参数并应用本地化。\n\n许多文件格式（如 `XML`）需要包围格式化后记录的头部和尾部部分。为了实现这一点，请重写以下方法：\n\
  \n```java\nString getHead(Handler h)\n\nString getTail(Handler h)\n```\n\n最后，调用\
  \ `setFormatter` 方法将格式化器安装到处理器中。\n\n## 练习\n\n**1.** 编写一个方法 `public ArrayList<Double>\
  \ readValues(String filename) throws ...`，用于读取一个包含浮点数的文件。如果无法打开文件或某些输入不是浮点数，则抛出相应的异常。\n\
  \n**2.** 编写一个方法 `public double sumOfValues(String filename) throws ...`，调用前一个方法并返回文件中值的总和。将任何异常传递给调用者。\n\
  \n**3.** 编写一个程序，调用前一个方法并打印结果。捕获异常并向用户提供任何错误情况的反馈。\n\n**4.** 重复前面的练习，但不要使用异常。相反，让\
  \ `readValues` 和 `sumOfValues` 返回某种错误代码。\n\n**5.** 实现一个方法，该方法包含第 5.1.5 节，“Try-with-Resources\
  \ 语句](#part0012.html_ch05lev2sec5)”中第 179 页的带有 `Scanner` 和 `PrintWriter` 的代码。但不要使用\
  \ try-with-resources 语句。相反，仅使用 `catch` 子句。确保关闭两个对象，前提是它们已正确构造。你需要考虑以下情况：\n\n- `Scanner`\
  \ 构造函数抛出异常。\n- `PrintWriter` 构造函数抛出异常。\n- `hasNext`、`next` 或 `println` 抛出异常。\n-\
  \ `out.close()` 抛出异常。\n- `in.close()` 抛出异常。\n\n**6.** 第 5.1.6 节，“`finally` 子句](#part0012.html_ch05lev2sec6)”在第\
  \ 181 页包含一个带有 `catch` 和 `finally` 子句的损坏 `try` 语句示例。通过以下方式修复代码：(a) 在 `finally` 子句中捕获异常，(b)\
  \ 使用包含 `try/finally` 语句的 `try/catch` 语句，以及 (c) 使用带有 `catch` 子句的 try-with-resources\
  \ 语句。\n\n**7.** 对于这个练习，你需要阅读 `java.util.Scanner` 类的源代码。当使用 `Scanner` 时输入失败，`Scanner`\
  \ 类会捕获输入异常并关闭其消耗输入的资源。如果关闭资源时抛出异常会发生什么？这种实现方式与 try-with-resources 语句中抑制异常的处理是如何交互的？\n\
  \n**8.** 设计一个辅助方法，以便可以在 try-with-resources 语句中使用 `ReentrantLock`。调用 `lock` 并返回一个\
  \ `AutoCloseable`，其 `close` 方法调用 `unlock` 且抛出异常。\n\n**9.** `Scanner` 和 `PrintWriter`\
  \ 类的方法不抛出检查异常，以便初学者更容易使用。你如何发现读取或写入过程中是否发生了错误？注意，构造函数*可以*抛出检查异常。为什么这违背了让类对初学者更容易使用的目标？\n\
  \n**10.** 写一个递归的 `factorial` 方法，在返回值之前打印所有的栈帧。构造（但不抛出）任何类型的异常对象并获取其堆栈跟踪，如第 5.1.8\
  \ 节，“堆栈跟踪](#part0012.html_ch05lev2sec8)”在第 184 页所示。\n\n**11.** 比较使用 `Objects.requireNonNull(obj)`\
  \ 和 `assert obj != null`。为每种情况提供一个有说力的用法。\n\n**12.** 编写一个方法 `int min(int[] values)`，在返回最小值之前，断言它确实\
  \ ≤ 数组中的所有值。使用私有辅助方法，或者如果你已经翻阅过第 8 章，使用 `Stream.allMatch`。在大数组上重复调用该方法，并测量在启用、禁用和移除断言\
  \ 时的运行时间。\n\n**13.** 实现并测试一个日志记录过滤器，过滤掉包含 sex、drugs 和 C++ 等坏词汇的日志记录。\n\n**14.**\
  \ 实现并测试一个产生 HTML 文件的日志记录格式化器。\n\n## 第 6 章 泛型编程\n\n### 本章主题\n\n![Image](img/00004.jpeg)\
  \ 6.1 型类\n\n![Image](img/00004.jpeg) 6.2 型方法\n\n![Image](img/00004.jpeg) 6.3 类型边界\n\
  \n![Image](img/00004.jpeg) 6.4 类型通变与通配符\n\n![Image](img/00004.jpeg) 6.5 虚拟机中的泛型\n\
  \n![Image](img/00004.jpeg) 6.6 泛型的限制\n\n![Image](img/00004.jpeg) 6.7 反射与泛型\n\n![Image](img/00004.jpeg)\
  \ 6.8 练习\n\n你通常需要处理多个类型的类和方法。例如，`ArrayList<T>` 存储任意的 `T`。我们说 `ArrayList` 类是*泛型的*，而\
  \ `T` 是*类型参数*。基本思想非常简单。本章的前两节涵盖了简单部分。\n\n在任何带有泛型的编程语言中，当你限制或改变类型参数时，细节变得复杂。例如，假设你想对元素进行排序。你必须指定\
  \ `T` 提供排序。此外，如果类型发生了变化，`ArrayList<String>` 意味着什么？第 6.3 节，“类型边界](#part0013.html_ch06lev1sec3)”在第\
  \ 202 页以及第 6.4 节，“类型通变与通配符](#part0013.html_ch06lev1sec4)”在第 203 页展示了 Java 如何处理这些问题。\n\
  \n在 Java 中，泛型编程比应该的要复杂，因为泛型是在 Java 存在很久后才加入的，并且为了向后兼容而设计。因此，有很多遗憾的限制，其中一些影响每个 Java\
  \ 程序员。另一些仅对泛型类的实现者感兴趣。参见第 6.5 节，“虚拟机中的泛型](#part0013.html_ch06lev1sec5)”在第 208 页以及第\
  \ 6.6 节，“泛型的限制](#part0013.html_ch06lev1sec6)”在第 211 页了解细节。最后一节介绍了泛型和反射，如果你在自己的程序中未使用反射，可以安全地跳过它。\n\
  \n本章的关键点是：\n\n**1.** 泛型类是带有一个或类型参数的类。\n\n**2.** 泛型方法是带有类型参数的方法。\n\n**3.** 你可以要求类型参数是一个或多个类型的子类。\n\
  \n**4.** 泛型类型是不变变的：当 `S` 是 `T` 的子类时，`G<S>` 和 `G<T>` 之间没有关系。\n\n**5.** 通过使用通配符 `G<?\
  \ extends T>` 或 `G<? super T>`，你可以指定方法可以接受带有子类或父类参数的泛型实例化。\n\n**6.** 在编译泛型类和方法时，类型参数会被擦除。\n\
  \n\n\n\n## 7. 类型擦除对泛型加了许多限制。特别是，你不能实例化泛型类或数组，不能向泛型进行类型转换，也不能抛出泛型类型的对象。\n\n## 8.\
  \ `Class<T>` 类是泛型的，这非常有用，因为像 `newInstance` 等方法被声明为产生类型为 `T` 的值。\n\n## 9 虽然泛型类和方法方法虚拟机中被擦除，但你仍然可以在运行时发现它们是如何声明的。\n\
  \n### 6.1 泛型类\n\n*泛型类*是一个带有一个或多个*类型参数*的类。作为一个简单的例子，考虑下面这个用于存储键/值对的类：\n\n点击此处查看代码图片\n\
  \n```java\npublic class Entry<K, V> {\n    private K key;\n    private V value;\n\
  \    public Entry(K key, V value) {\n        this.key = key;\n        this.value\
  \ = value;\n    }\n    public K getKey() { return key; }\n    public V getValue()\
  \ { return value; }\n}\n```\n\n如你所见，类型参数 `K` 和 `V` 指定在类名后的尖括号内。在类成员的定义中，它们被用作实例变量、方法参数和返回值的类型。\n\
  \n你通过用具体类型替换类型变量来*实例化*泛型类。例如，`Entry<String, Integer>` 是一个普通的类，拥有方法 `String getKey()`\
  \ 和 `Integer getValue()`。\n\n* *\n\n![Image](img/00009.jpeg) 注意\n\n类型参数不能用基本数据类型进行实例化。例如，在\
  \ Java 中 `Entry<String, int>` 是无效的。\n\n* * *\n\n当你在*构造*一个泛型类的对象时，可以从构造函数中省略类型参数。例如，\n\
  \n点击此处查看代码图片\n\n```java\nEntry<String, Integer> entry = new Entry<>(\"Fred\", 42);\n\
  // 等同于 new Entry<String, Integer>(\"Fred\", 42)\n```\n\n注意，在构造参数之前你仍然需要提供一对空尖括号。有些人把这对空括号称为*菱形（diamond）*。当你使用菱形语法时，构造函数的类型参数会被推断。\n\
  \n## 6.2 泛型方法\n\n就像泛型类是带有类型参数的类一样，*泛型方法*也是带有类型参数的方法。泛型方法可以是一个普通类的方法，也可以是泛型类的方法。这里是一个非泛型类中使用泛型方法的示例：\n\
  \n点击此处查看代码图片\n\n```java\npublic class Arrays {\n    public static <T> void swap(T[]\
  \ array, int i, int j) {\n        T temp = array[i];\n        array[i] = array[j];\n\
  \        array[j] = temp;\n    }\n}\n```\n\n这个 `swap` 方法可以用于交换任意数组中的元素，只要数组元素类型不是基本数据类型。\n\
  \n```java\nString[] friends = ...;\nArrays.swap(friends, 0, 1);\n```\n\n当你声明泛型方法时，类型参数被放在修饰符（如\
  \ `public` 和 `static`）之后、返回类型之前：\n\n点击此处查看代码图片\n\n```java\npublic static <T> void\
  \ swap(T[] array, int i, int j)\n```\n\n调用泛型方法时，你不需要指定类型参数。它是根据方法的参数和返回类型推断出来的。例如，在调用\
  \ `Arrays.swap(friends, 0, 1)` 时，`friends` 的类型是 `String[]`，编译器可以推断出 `T` 应该是 `String`。\n\
  \n如果你愿意，也可以可以在方法名之前显式提供类型，如下所示：\n\n点击此处查看代码图片\n\n```java\nArrays.<String>swap(friends,\
  \ 0, 1);\n```\n\n你可能想这样做的原因之一是在出现问题时获得获得更好的错误信息——参阅练习 5。\n\n在深入后续章节中复杂的细节之前，值得思考一下\
  \ `Entry` 类和 `swap` 方法的示例，并赞叹泛型类型是多么有用且自然。对于 `Entry` 类，键和值的类型可以是任意的。对于 `swap` 方法，数组类型可以是任意的。这通过类型变量被清晰地表达出来。\n\
  \n### 6.3 类型边界\n\n有时，泛型类或方法的类型参数需要满足某些要求。你可以指定一个*类型边界*，要求它扩展某些类或实现某些接口。假设你你有一个实现了\
  \ `Closeable` 的对象的 `ArrayList`，并且你想关闭它们：\n\n点击此处查看代码图片\n\n```java\npublic static\
  \ <T extends Closeable> void closeAll(ArrayList<T> elems) throws Exception {\n \
  \   for (T elem : elems)\n        elem.close();\n}\n```\n\n`T extends Closeable`\
  \ 边界确保了 `elem` 是 `Closeable` 的子类型。类型参数可以有多个边界，例如\n\n点击此处查看代码图片\n\n```java\npublic\
  \ static <T extends Runnable & Closeable> void closeAll(ArrayList<T> elems) throws\
  \ Exception\n```\n\n你可以有任意数量的接口边界，但类边界只有一个。如果有类边界，它必须是列表中的第一个。\n\n### 6.4 类型变型与通配符\n\
  \n假设你需要实现一个处理 `Employee` 类子类的数组的方法。你只需将参数声明为 `Employee[]`：\n\n点击此处查看代码图片\n\n```java\n\
  public static void process(Employee[] staff) { ... }\n```\n\n如果 `Manager` 是 `Employee`\
  \ 的子类，你可以将 `Manager[]` 数组传递给方法，因为 `Manager[]` 是 `Employee[]` 的子类型。这种行为被称为*协变（covariance）*。数组的变化方式与元素类型相同。\n\
  \n现在，假设你想处理一个数组列表。但是，这里有一个问题：`ArrayList<Manager>` 不是 `ArrayList<Employee>` 的子类型。\n\
  \n这种限制是有的。如果允许将 `ArrayList<Manager>` 赋值给类型为 `ArrayList<Employee>` 的变量，你就可以通过存储非经理员工来破坏列表：\n\
  \n点击此处查看代码图片\n\n```java\nArrayList<Manager> bosses = new ArrayList<>();\nArrayList<Employee>\
  \ empls = bosses; // 这非法，但假设合法...\nempls.add(new Employee()); // bosses 中出现了非经理对象！\n\
  ```\n\n由于不允许从 `ArrayList<Manager>` 转换为 `ArrayList<Employee>`，这种错误就不会发生。\n\n* * *\n\
  \n![Image](img/00005.jpeg) 注意\n\n你可以在数组中产生相同的错误吗（在数组允许从 `Manager[]` 转换为 `Employee[]`）？当然可以，正如你在第\
  \ 4 章中所看到的。Java 数组是协变的，这很方便但不安全。当你将一个 `Employee` 存储在 `Manager[]` 数组中，会抛出 `ArrayStoreException`。相比之下，Java\
  \ 中所有的泛型都是*不变的（invariant）*的。\n\n\n\n\n在 Java 中，你使用通配符（wildcards）来指定方法参数和返回类型允许变化的方式。这种机制有时被称为“使用变型”（use-site\
  \ variance）。你将在后面的章节中看到细节。\n\n### 6.4.1 子类通配符 (Subtype Wildcards)\n\n在很多情况下，在不同的数组列表之间转换是完全安全的。假设一个方法永远不会写入数组列表，因此它不会破坏参数。使用通配符来表达这一事实：\n\
  \n点击此处查看代码图像\n\n```java\npublic static void printNames(ArrayList<? extends Employee>\
  \ staff) {\n    for (int i = 0; i < staff.size(); i++) {\n        Employee e = staff.get(i);\n\
  \        System.out.println(e.getName());\n    }\n}\n```\n\n通配符类型 `? extends Employee`\
  \ 表示 `Employee` 的某种未知子类。你可以使用 `ArrayList<Employee>` 或子类的数组列表（例如 `ArrayList<Manager>`）来调用此方法。\n\
  \n`ArrayList<? extends Employee>` 类的 `get` 方法的返回类型为 `? extends Employee`。语句\n\n\
  ```\nEmployee e = staff.get(i);\n```\n\n是完全合法的。无论 `?` 表示什么类型，它都是 `Employee` 的子类，`staff.get(i)`\
  \ 的结果可以赋值给 `Employee` 变量 `e`。（在这个示例中，我没有使用增强 `for` 循环，以便准确展示如何从数组列表中获取元素。）\n\n如果你尝试向\
  \ `ArrayList<? extends Employee>` 中存储元素会发生什么？那是行不通的。考虑以下调用：\n\n```java\nstaff.add(x);\n\
  ```\n\n`add` 方法的参数类型为 `? extends Employee`，并且*没有*对象可以传递给这个方法。如果你传递了例如一个 `Manager`\
  \ 对象，编译器将拒绝。毕竟，`?` 可能指向*任何*子类，也许是 `Janitor`，而你不能向 `ArrayList<Janitor>` 中添加 `Manager`。\n\
  \n* * *\n\n![Image](img/00005.jpeg) 注意\n\n你当然可以传递 `null`，但那不是一个对象。\n\n* * *\n\n\
  总结来说，你可以从 `? extends Employee` 转换为 `Employee`，但你永远无法将任何转换为 `? extends Employee`。这解释了为什么你可以从\
  \ `ArrayList<? extends Employee>` 中读取，但不能向它写入。\n\n### 6.4.2 上类通配符 (Supertype Wildcards)\n\
  \n通配符类型 `? extends Employee` 表示 `Employee` 的任意子类。相反，通配符类型 `? super Employee` 表示\
  \ `Employee` 的上类。这些通配符作为函数对象的参数时通常非常有用。这是一个典型的例子。`Predicate` 接口有一个方法用于测试类型为 `T`\
  \ 的对象是否具有特定属性：\n\n点击此处查看代码图像\n\n```java\npublic interface Predicate<T> {\n    boolean\
  \ test(T arg);\n    ...\n}\n```\n\n此方法打印所有具有给定属性的员工名称：\n\n点击此处查看代码图像\n\n```java\n\
  public static void printAll(Employee[] staff, Predicate<Employee> filter) {\n  \
  \  for (Employee e : staff) {\n        if (filter.test(e))\n            System.out.println(e.getName());\n\
  \    }\n}\n```\n\n你可以使用类型为 `Predicate<Employee>` 的对象调用此方法。由于它是一个函数接口，你也可以传递 lambda\
  \ 表达式：\n\n点击此处查看代码图像\n\n```java\nprintAll(employees, e -> e.getSalary() > 100000);\n\
  ```\n\n现在假设你想改用 `Predicate<Object>`，例如\n\n点击此处查看代码图像\n\n```java\nprintAll(employees,\
  \ e -> e.toString().length() % 2 == 0);\n```\n\n这不应该是问题。毕竟，每个 `Employee` 都是带有 `toString`\
  \ 方法的 `Object`。然而，与所有泛型类型一样，`Predicate` 接口是不变的（invariant），`Predicate<Employee>`\
  \ 和 `Predicate<Object>` 之间没有关系。\n\n解决办法是允许任何 `Predicate<? super Employee>`：\n\n\
  点击此处查看代码图像\n\n```java\npublic static void printAll(Employee[] staff, Predicate<?\
  \ super Employee> filter) {\n    for (Employee e : staff) {\n        if (filter.test(e))\n\
  \            System.out.println(e.getName());\n    }\n}\n```\n\n`ArrayList<? extends\
  \ Employee>` 类的 `get` 方法的返回类型为 `? extends Employee`。语句 `Employee e = staff.get(i);`\
  \ 是完全合法的。无论 `?` 表示什么类型，它都是 `Employee` 的子类，`staff.get(i)` 的结果可以赋值给 `Employee` 变量\
  \ `e`。（在这个示例中，我没有使用增强 `for` 循环，以便准确展示如何从数组列表中获取元素。）\n\n如果你尝试向 `ArrayList<? extends\
  \ Employee>` 中存储元素会发生什么？那是行不通的。考虑以下调用 `staff.add(x);`。`add` 方法的参数类型为 `? extends\
  \ Employee`，并且*没有*对象可以传递给这个方法。如果你传递了例如一个 `Manager` 对象，编译器将拒绝。毕竟，`?` 可能指向*任何*子类，也许是\
  \ `Janitor`，而你不能向 `ArrayList<Janitor>` 中添加 `Manager`。\n\n通配符类型 `? extends Employee`\
  \ 表示 `Employee` 的任意子类。相反，通配符类型 `? super Employee` 表示 `Employee` 的上类。这些通配符作为函数对象的参数时通常非常有用。这是一个典型的例子。`Predicate`\
  \ 接口有一个方法用于测试类型为 `T` 的对象是否具有特定属性：`ArrayList<? extends Employee>` 类的 `get` 方法的返回类型为\
  \ `? extends Employee`。语句 `Employee e = staff.get(i);` 是完全合法的。无论 `?` 表示什么类型，它都是\
  \ `Employee` 的子类，`staff.get(i)` 的结果可以赋值给 `Employee` 变量 `e`。（在这个示例中，我没有使用增强 `for`\
  \ 循环以便准确展示如何从数组列表中获取元素。）\n\n（注：原文后半部分存在大量重复段落，译文已根据逻辑进行了整理，确保核心含义表达完整。）\n\n### 6.4.3\
  \ 带类型变量的通配符 (Wildcards with Type Variables)\n\n考虑前述章节的泛化：\n\n```java\npublic static\
  \ <T> printAll(Employee[] staff, Predicate<T> filter) {\n    for (Employee e : staff)\
  \ {\n        if (filter.test(e))\n            System.out.println(e.getName());\n\
  \    }\n}\n```\n\n解决方案与你看到的相同——但这次通配符的边界是一个类型变量：\n\n```java\npublic static <T> printAll(Employee[]\
  \ staff, Predicate<? super T> filter) {\n    for (Employee e : staff) {\n      \
  \  if (filter.test(e))\n            System.out.println(e.getName());\n    }\n}\n\
  ```\n\n\n\n\n在某些编程语言（如 C# 和 Scala）中，你可以将类型参数声明为协变的或逆变的。例如，通过将 `Comparable` 的类型参数声明为逆变，就不需要为每个\
  \ `Comparable` 参数使用通配符。这种“声明处的型变性”（declaration-site variance）非常方便，但它的功能性不如 Java\
  \ Java 通配符的“使用处的型变性”（use-site variance）那么强大。\n\n### 6.4.4 无界通配符\n\n对于仅执行非常通用操作的情况，可以使用无界通配符。例如，这里有一个检查\
  \ `ArrayList<?>` 是否包含任何 `null` 元素的方法：\n\n```java\npublic static boolean hasNulls(ArrayList<?>\
  \ elements) {\n    for (Object e : elements) {\n        if (e == null) return true;\n\
  \    }\n    return false;\n}\n```\n\n由于 `ArrayList` 的类型参数并不重要，因此使用 `ArrayList<?>`\
  \ 是合理的。你同样地可以将 `hasNulls` 写为一个泛型方法：\n\n```java\npublic static <T> boolean hasNulls(ArrayList<T>\
  \ elements)\n```\n\n但通配符易于理解，因此这是首选方法。\n\n### 6.4.5 通配符捕获\n\n让我们尝试使用通配符定义一个 `swap`\
  \ 方法：\n\n```java\npublic static void swap(ArrayList<?> elements, int i, int j) {\n\
  \    ? temp = elements.get(i); // 无法工作\n    elements.set(i, elements.get(j));\n\
  \    elements.set(j, temp);\n}\n```\n\n这不起作用。你可以将 `?` 作为类型参数，但不能将其作为类型。\n\n不过，有一个变通方法。添加这样一个辅助方法：\n\
  \n```java\npublic static void swap(ArrayList<?> elements, int i, int j) {\n    swapHelper(elements,\
  \ i, j);\n}\n\nprivate static <T> void swapHelper(ArrayList<T> elements, int i,\
  \ int j) {\n    T temp = elements.get(i);\n    elements.set(i, elements.get(j));\n\
  \    elements.set(j, temp);\n}\n```\n\n对 `swapHelper` 的调用是有效的，是因为有一种名为*通配符捕获*（wildcard\
  \ capture）的特殊规则。编译器不知道 `?` 是什么，但它代表某种类型，因此调用泛型方法是允许的。`swapHelper` 的类型参数 `T` “捕获”了通配符类型。由于\
  \ `swapHelper` 是泛型方法，而不是参数带有通配符的方法，因此可以使用类型变量 `T` 来声明变量。\n\n我们获得了什么？API 的用户看到的是一个易于理解的\
  \ `ArrayList<?>`，而不是泛型方法。\n\n## 6.5 Java 虚拟机中的泛型\n\n当泛型类型和方法被引入 Java 时，Java 设计者希望类的泛型形式能与先前的版本兼容。例如，应该可以将\
  \ `ArrayList<String>` 传递给泛型时代之前接受 `ArrayList` 类的的方法（该类收集 `Object` 类型的元素）。语言设计者决定采用一种在虚拟机中“擦除”类型的实现方案。这在当时非常流行，因为它让\
  \ Java 用户能够逐渐迁移到使用泛型。你可以想象的，这种方案是有缺点的，而且正如经常为了兼容性而做的妥协的那样，在迁移成功完成很久之后，缺点仍然存在。\n\n\
  在本节中，你将了解虚拟机内部发生了什么，下一节将检查其后果。\n\n#### 6.5.1 类型擦除\n\n当你定义一个泛型类型时，它会被编译为*原始*（raw）类型。例如，第\
  \ 200 页第 6.1 节“[泛型类]中的 `Entry<K, V>` 类会变为\n\n```java\npublic class Entry {\n   \
  \ private Object key;\n    private Object value;\n    public Entry(Object key, Object\
  \ value) {\n        this.key = key;\n        this.value = value;\n    }\n    public\
  \ Object getKey() { return key; }\n    public Object getValue() { return value;\
  \ }\n}\n```\n\n每个 `K` 和 `V` 都被替换为 `Object`。如果类型变量有边界，它会被替换为第一个边界。假设我们声明 `Entry`\
  \ 类为：\n\n```java\npublic class Entry<K extends Comparable<? super K>, V extends\
  \ Serializable>\n```\n\n那么会被擦除为一个类：\n\n```java\npublic class Entry {\n    private\
  \ Comparable key;\n    private Serializable value;\n}\n```\n\n#### 6.5.2 强制转换插入\n\
  \n擦除听起来似乎有些危险，但实际上是完全安全的。例如，假设你使用了 `Entry<String, Integer>`。当你构造对象时，你必须提供一个 `String`\
  \ 类型的键和一个 `Integer` 类型（或可转换为 Integer）的值。否则，你的程序将无法编译。因此，你可以保证 `getKey` 方法返回一个 `String`。\n\
  \n然而，假设你的程序在带有“未检查”（unchecked）警告的情况下通过编译，可能是因为你使用了强制转换或混合了泛型和原始 `Entry` 类型。那么 `Entry<String,\
  \ Integer>` 就可能拥有一个不同类型的键。\n\n因此，在运行时进行安全检查也是必要的。每当从擦除后的类型读取数据时，编译器就会插入一个强制转换。例如：\n\
  \n```java\nEntry<String, Integer> entry = ...;\nString key = entry.getKey();\n```\n\
  \n由于擦除后的 `getKey` 方法返回 `Object`，编译器生成的代码等于：\n\n```java\nString key = (String) entry.getKey();\n\
  ```\n\n#### 6.5.3 桥接方法\n\n在前面的节中，你已经看到了擦除的基本原理。它是简单且安全的。好吧，几乎是简单。当擦除方法的参数和返回值时，编译器有时需要合成*桥接方法*（bridge\
  \ methods）。这是一种实现细节，除非你想知道为什么这种方法会出现在堆栈跟踪中，或者你想了解 Java 泛型某些晦涩的限制（参见第 216 页第 6.6\
  \ 节“[擦除后的方法冲突]”）。\n\n考虑这个例子：\n\n```java\npublic class WordList extends ArrayList<String>\
  \ {\n    public void add(String e) {\n        return isBadWord(e) ? false : super.add(e);\n\
  \    }\n}\n```\n\n现在考虑这段代码片段：\n\n```java\nWordList words = ...;\nArrayList<String>\
  \ strings = words; // OK——转换为父类\nstrings.add(\"C++\");\n```\n\n最后一个方法调用了 `ArrayList`\
  \ 类的擦除后的 `add(Object)` 方法。\n\n人们预期动态方法查找有效，这样当在 `WordList` 对象上调用 `add` 时，调用的是 `WordList`\
  \ 的 `add` 方法而不是 `ArrayList` 的 `add` 方法。\n\n为了实现这一点，编译器在 `WordList` 类中合成了一个桥接方法：\n\
  \n```java\npublic void add(Object e) {\n    add((String) e);\n}\n```\n\n在调用 `strings.add(\"\
  C++\")` 时，调用了 `add(Object)` 方法，然后调用了 `WordList` 的 `add(String)` 方法。\n\n当返回值类型变化时，桥接方法也可以被调用。考虑这个方法：\n\
  \n```java\npublic class WordList extends ArrayList<String> {\n    public String\
  \ get(int i) {\n        return super.get(i).toLowerCase();\n    }\n}\n```\n\n在 `WordList`\
  \ 类中，有两个 `get` 方法：\n\n```java\nString get(int) // 定义在 WordList 中\nObject get(int)\
  \ // 重写了 ArrayList 中定义的方法\n```\n\n\n第二种方法由编译器合成，并调用第一种方法。这样做再次是为了让动态方法查找能够正常工作。\n\
  \n这些方法具有相同的参数类型，但返回类型不同。在 Java 语言中，你无法实现这样一对方法。但在虚拟机中，方法是通过其名称、参数类型*以及*返回类型来指定的，这允许编译器生成这对方法。\n\
  \n***\n\n![Image](img/00005.jpeg) 注意事项\n\n桥接方法（Bridge methods）不仅用于泛型类型。它们还用于实现协变返回类型。例如，在第\
  \ 4 章中，你已经了了如何声明一个具有适当返回类型的 `clone` 方法：\n\n***\n\n点击此处查看代码图片\n\n```java\npublic\
  \ class Employee implements Cloneable {\n    public Employee clone() throws CloneNotSupportedException\
  \ { ... }\n}\n```\n\n在这种情况下，`Employee` 类有两个 `clone` 方法：\n\n点击此处查看代码图片\n\n```java\n\
  Employee clone() // 定义定义\nObject clone() // 合成的桥接方法\n```\n\n桥接方法再次为了让动态方法查找能够正常工作，它调用了第一个方法。\n\
  \n## 6.6 泛型的限制\n\n在 Java 中使用泛型类型和方法时有几项限制——有些仅仅是令人惊讶，另一些则确实非常不便。它们大部分都是类型擦除的结果。以下章节将向你展示你在实践中最可能遇到的限制。\n\
  \n### 6.6.1 不能使用基本类型作为参数\n\n类型参数永远不能是基本类型。例如，你不能构造一个 `ArrayList<int>`。正如你所看到的，在虚拟机中只有一种类型，即原始\
  \ `ArrayList`，它存储 `Object` 类型的元素。`int` 不是一个对象。\n\n泛型刚被引入时，这并没有被认为是一个大问题。毕竟，人们可以构造\
  \ `ArrayList<Integer>` 并依赖自动装箱。然而，现在泛型使用得越来越广泛，这种痛苦正在增加。存在大量的函数式接口，如 `IntFunction`、`LongFunction`、`DoubleFunction`、`ToIntFunction`、`ToLongFunction`、`ToDoubleFunction`——而这只处理了一元函数和八种基本类型中的三种。\n\
  \n### 6.6.2 在运行时，所有类型都是原始类型\n\n在虚拟机中，只有原始类型（raw types）。例如，你不能在运行时查询 `ArrayList`\
  \ 是否包含 `String` 对象。这样的条件：\n\n点击此处查看代码图片\n\n```java\nif (a instanceof ArrayList<String>)\n\
  ```\n\n是一个编译时错误，因为这种检查永远无法执行。\n\n对泛型类型的实例进行强制转换同样同样无效，但它是合法的。\n\n点击此处查看代码图片\n\n\
  ```java\nObject result = ...;\nArrayList<String> list = (ArrayList<String>) result;\n\
  // 警告—这只检查 result 是否为原始 ArrayList\n```\n\n这种转换是允许的，因为有时你没有办法避免它。如果 `result` 是一个非常通用的过程的结果（例如通过反射调用方法，参见第\
  \ 4 章），并且编译器未知其精确类型，程序员就必须使用强制转换。仅转换为 `ArrayList` 或 `ArrayList<?>` 是不够的。\n\n为了消除警告，可以这样标注变量：\n\
  \n点击此处查看代码图片\n\n```java\n@SuppressWarnings(\"unchecked\") ArrayList<String> list\
  \ = (ArrayList<String>) result;\n```\n\n***\n\n![Image](img/00009.jpeg) 警告\n\n滥用\
  \ `@SuppressWarnings` 注解会导致*堆污染*（heap pollution）——即本应属于某个特定泛型类型实例但实际上属于另一个实例的对象。例如，你可以将一个\
  \ `ArrayList<Employee>` 赋值给一个 `ArrayList<String>` 引用。结果是在当获取错误类型的元素时会抛出 `ClassCastException`。\n\
  \n***\n\n***\n\n![Image](img/00013.jpeg) 提示\n\n堆污染的问题在于，报告的运行时错误远不是问题的源头——插入错误的元素。如果你需要调试此类问题，可以使用“检查视图”（checked\
  \ view）。在你构造例如一个 `ArrayList<String>` 的地方，改用：\n\n点击此处查看代码图片\n\n```java\nList<String>\
  \ strings = Collections.checkedList(new ArrayList<>(), String.class);\n```\n\n该视图监控所有向列表的插入，并在添加错误类型的对象时会抛出异常。\n\
  \n***\n\n`getClass` 方法始终返回一个原始类型。例如，如果 `list` 是 `ArrayList<String>`，那么 `list.getClass()`\
  \ 返回 `ArrayList.class`。事实上，并没有 `ArrayList<String>.class`——这样的类字面量是一个语法错误。\n\n此外，你不能在类字面量类型类型变量。没有\
  \ `T.class`、`T[].class` 或 `ArrayList<T>.class`。\n\n### 6.6.3 你不能实例化类型变量\n\n你不能在表达式中使用类型变量\
  \ `new T` 或 `new T[...]`。这些形式是不允许的，因为 `T` 会被擦除。如果你想创建一个泛型数组，必须付出更多努力。假设你想要一个包含 `n`\
  \ 个 `obj` 的数组，你希望 `repeat(n, obj)` 能工作：\n\n```java\npublic static <T> T[] repeat(int\
  \ n, obj) {\n    T[] result = new T[n]; // 错误\n    for (int i = 0; i < n; i++)\n\
  \    return result;\n}\n```\n\n要解决这个问题，让调用者提供方法引用。\n\n点击此处查看代码图片\n\n```java\nString[]\
  \ greetings = Arrays.repeat(10, String[]::new);\n```\n\n这是实现方式：\n\n点击此处查看代码图片\n\n\
  ```java\npublic static <T> T[] repeat(int n, T obj, Function<T[]> constr) {\n  \
  \  T[] result = constr.apply(n);\n    for (int i = 0; i < n; i++) result[i] = obj;\n\
  \    return result;\n}\n```\n\n或者，你可以让用户提供一个类对象，并使用反射。\n\n点击此处查看代码图片\n\n```java\n\
  public static <T> T[] repeat(int n, T obj, Class<T> cl) {\n    @SuppressWarnings(\"\
  unchecked\") T[] result = (T[]) java.lang.reflect.Array.newInstance(cl, n);\n  \
  \  for (int i = 0; i < n; i++) result[i] = obj;\n    return result;\n}\n```\n\n\
  该方法的调用方式如下：\n\n点击此处查看代码图片\n\n```java\nString[] greetings = Arrays.repeat(10, \"\
  Hi\", String.class);\n```\n\n另一种选项是让调用者分配数组。通常，允许调用者提供任何长度的数组，甚至是零。如果提供的数组太短，该方法将使用反射创建一个。\n\
  \n点击此处查看代码图片\n\n```java\npublic static <T> T[] repeat(int n, T obj, T[] array) {\n\
  \    T[] result;\n    if (array.length >= n)\n        result = array;\n    } else\
  \ {\n        @SuppressWarnings(\"unchecked\") T[] newArray = (T[]) java.lang.reflect.Array.newInstance(array.getClass().getComponentType(),\
  \ n);\n        result = newArray;\n    }\n    for (int i = 0; i < n; i++) result[i]\
  \ = obj;\n    return result;\n}\n```\n\n你*可以*使用类型变量实例化 `ArrayList`。例如，以下内容完全合法的：\n\
  \n点击此处查看代码图片\n\n```java\npublic static <T> ArrayList<T> repeat(int n, T obj) {\n\
  \    ArrayList<T> result = new ArrayList<>(); // OK\n    for (int i = 0; i < n;\
  \ i++) result.add(obj);\n    return result;\n}\n```\n\n\n\n这比你刚刚看到的变通方案要简单得多，当你没有充分理由去创建一个数组时，我建议使用这种方法。\n\
  \n***\n\n***\n\n![Image](img/00005.jpeg) 注意\n\n如果一个泛型类需要一个作为实现私有部分的泛型数组，你只需要构造一个\
  \ `Object[]` 数组即可解决。这就是 `ArrayList` 类所做的：\n\n点击此处查看代码图片\n\n```java\npublic class\
  \ ArrayList<E> {\n    private Object[] elementData;\n    public E get(int index)\
  \ {\n        return (E) elementData[index];\n    }\n    ...\n}\n```\n\n***\n\n####\
  \ 6.6.4 你不能构造参数化类型的数组\n\n假设你想创建一个 `Entry` 对象的数组：\n\n点击此处查看代码图片\n\n```java\nEntry<String,\
  \ Integer>[] entries = new Entry<String, Integer>[100];\n// 错误—不能构造泛型组件类型类型的数组\n\
  ```\n\n这是一个语法错误。这种构造是被禁止的，因为在擦除后，数组构造函数将创建一个原始的（raw）`Entry` 数组。这将导致可能会添加任何类型的 `Entry`\
  \ 对象（例如 `Entry<Employee, Manager>`）而不会抛出 `ArrayStoreException`。\n\n请注意，*类型* `Entry<String,\
  \ Integer>[]` 是完全合法的。你可以声明一个该类型的变量。如果你真的想初始化它，可以这样做：\n\n点击此处查看代码图片\n\n```java\n\
  @SuppressWarnings(\"unchecked\") Entry<String, Integer>[] entries = (Entry<String,\
  \ Integer>[]) new Entry<?, ?>[100];\n```\n\n但使用数组列表更简单：\n\n点击此处查看代码图片\n\n```java\n\
  ArrayList<Entry<String, Integer>> entries = new ArrayList<>(100);\n```\n\n回想起变长参数（varargs）是伪装的数组。如果此类参数是泛型的，你可以绕过对泛型数组创建的限制。考虑这个方法：\n\
  \n点击此处查看代码图片\n\n```java\npublic static <T> ArrayList<T> asList(T... elements) {\n\
  \    ArrayList<T> result = new ArrayList<>();\n    for (T e : elements) result.add(e);\n\
  \    return result;\n}\n```\n\n现在考虑这个调用：\n\n点击此处查看代码图片\n\n```java\nEntry<String,\
  \ Integer> entry1 = ...;\nEntry<String, Integer> entry2 = ...;\nArrayList<Entry<String,\
  \ Integer>> entries = Lists.asList(entry1, entry2);\n```\n\n`T` 的推断类型是泛型类型 `Entry<String,\
  \ Integer>`，因此 `elements` 是 `Entry<String, Integer>` 类型的数组。这正是你自己无法完成的数组创建方式！\n\n\
  在这种情况下，编译器报告的是警告而不是错误。如果你的方法只从参数数组中读取元素，则应该使用 `@SafeVarargs` 注解来抑制警告：\n\n点击此处查看代码图片\n\
  \n```java\n@SafeVarargs public static <T> ArrayList<T> asList(T... elements)\n```\n\
  \n#### 6.6.5 类类型变量在静态上下文中无效\n\n考虑一个带有类型变量的泛型类，例如 `Entry<K, V>`。你不能在静态变量或方法中使用类型变量\
  \ `K` 和 `V`。例如，以下代码不起作用：\n\n点击此处查看代码图片\n\n```java\npublic class Entry<K, V> {\n\
  \    private static V defaultValue;\n    // 错误—静态上下文中的 V\n    public static void\
  \ setDefault(V value) { defaultValue = value; }\n    // 错误—静态上下文中的 V\n    ...\n\
  }\n```\n\n毕竟，类型擦除意味着在擦除后的 `Entry` 类中只有一个这样的变量或方法，而不是为每个 `K` 和 `V` 都创建一个。\n\n####\
  \ 6.6.6 方法在擦除后可能发生冲突\n\n你不能声明在擦除后会导致冲突的方法。例如，以下将是一个错误：\n\n点击此处查看代码图片\n\n```java\n\
  public interface Ordered<T> extends Comparable<T> {\n    public default boolean\
  \ equals(T value) {\n        // 错误—擦除与 Object.equals 冲突\n        return compareTo(value)\
  \ == 0;\n    }\n    ...\n}\n```\n\n`equals(T value)` 方法擦除为 `equals(Object value)`，这与来自\
  \ `Object` 的相同方法发生了冲突。\n\n有时冲突的原因会更加微妙。这里有一个糟糕的情况：\n\n点击此处查看代码图片\n\n```java\npublic\
  \ class Employee implements Comparable<Employee> {\n    ...\n    public int compareTo(Employee\
  \ other) {\n        return name.compareTo(other.name);\n    }\n\n}\n\npublic class\
  \ Manager extends Employee implements Comparable<Manager> {\n    ...\n    public\
  \ int compareTo(Employee other) {\n        return name.compareTo(other.name);\n\
  \    }\n}\n```\n\n#### 6.6.7 异常与泛型\n\n你不能抛出或捕获泛型对象。事实上，你甚至不能形成 `Throwable` 的子类。你不能在\
  \ `catch` 子句中使用类型变量：\n\n点击此处查看代码图片\n\n```java\npublic static <T extends Throwable>\
  \ void doWork(Runnable r, Class<T> cl) {\n    try {\n        r.run();\n    } catch\
  \ (T ex) // 错误—不能\n```\n\n然而，你*可以*在 `throws` 声明中使用类型变量：\n\n点击此处查看代码图片\n\n```java\n\
  public static <V, T> V doWork(Callable<V> c, T ex) throws T {\n    try {\n     \
  \   return c.call();\n    } catch (Throwable realEx) {\n        ex.initCause(realEx);\n\
  \        throw ex;\n    }\n}\n```\n\n***\n\n![Image](img/00009.jpeg) 注意\n\n你可以使用泛型来消除检查异常和未检查异常之间的区别。关键要素是这对方法：\n\
  \n点击此处查看代码图片\n\n```java\npublic class Exceptions {\n    @SuppressWarnings(\"unchecked\"\
  )\n    private static <T extends Throwable> void throwAs(Throwable e) throws T {\n\
  \        throw (T) e; // 强制转换擦除为 (Throwable)\n    }\n    public static <V> V doWork(Callable<V>\
  \ c) {\n        try {\n            return c.call();\n        } catch (Throwable\
  \ ex) {\n            Exceptions.<RuntimeException>throwAs(ex);\n            return\
  \ null;\n        }\n    }\n}\n```\n\n现在考虑这个方法：\n\n点击此处查看代码图片\n\n```java\npublic\
  \ static String readAll(Path path) {\n    return doWork(() -> Files.readAll(path)));\n\
  }\n```\n\n尽管 `Files.readAll` 会抛出检查异常，但该异常在 `readAll` 方法中既没有声明也没有被捕获！\n\n\n\n\n考虑\
  \ `String` 类。在虚拟机中，该类对应一个 `Class` 对象，你可以通过 `\"Fred\".getClass()` 获取它，或者更直接地通过类字面量\
  \ `String.class` 获取它。你可以使用该对象来查找该类拥有哪些方法，或者用于构造一个实例。\n\n类型参数有助于后者。`newInstance`\
  \ 方法的声明如下：\n\n点击此处查看代码图片\n\n```java\npublic Class<T> {\n    public T newInstance()\
  \ throws ... { ... }\n}\n```\n\n也就是说，它返回一个类型为 `T` 的对象。这就是为什么 `String.class` 的类型是\
  \ `Class<String>`：它的 `newInstance` 方法返回一个 `String`。\n\n这些信息可以让你省去一次强制类型转换（cast）。考虑这个方法：\n\
  \n点击此处查看代码图片\n\n```java\npublic static <T> ArrayList<T> repeat(int n, Class<T> cl)\n\
  \        throws ReflectiveOperationException {\n    ArrayList<T> result = new ArrayList<>();\n\
  \    for (int i = 0; i < n; i++) result.add(cl.newInstance());\n    return result;\n\
  }\n```\n\n该方法可以编译，因为 `cl.newInstance()` 返回类型为 `T` 的结果。\n\n假设你这样调用该方法：`repeat(10,\
  \ Employee.class)`。那么 `T` 被推断为类型 `Employee`，因为 `Employee.class` 的类型是 `Class<Employee>`。因此，返回类型是\
  \ `ArrayList<Employee>`。\n\n除了 `newInstance` 方法外，`Class` 类还有其他几个类型参数的方法。它们是：\n\n\
  点击此处查看代码图片\n\n```java\nClass<? super T> getSuperclass()\n<U> Class<? extends U>\
  \ asSubclass(Class<U> clazz)\nT cast(Object obj)\nConstructor<T> getConstructor(Class<?>...\
  \ parameterTypes)\nConstructor<T> getDeclaredConstructor(Class<?>... parameterTypes)\n\
  T[] getEnumConstants()\n```\n\n正如你在第 4 章中所看到的，在很多情况下，你对 `Class` 对象所描述的类一无所知。这时你可以直接使用通配符类型\
  \ `Class<?>`。\n\n### 6.7.2 虚拟机中的泛型类型信息\n\n擦除（Erasure）只影响实例化类型参数。关于泛型类和方法的*声明*的完整信息在运行时是可用的。\n\
  \n例如，假设调用 `obj.getClass()` 返回 `ArrayList.class`。你无法判断 `obj` 是被构造为 `ArrayList<String>`\
  \ 还是 `ArrayList<Employee>`。但你可以看出 `ArrayList` 类是一个泛型类，它有一个没有边界的类型参数 `E`。\n\n同样，考虑\
  \ `Collections` 类的方法：\n\n点击此处查看代码图片\n\n```java\nstatic <T extends Comparable<? super\
  \ T>> void sort(List<T> list)\n```\n\n正如你在第 4 章中所看到的，你可以这样获取对应的 `Method` 对象：\n\n\
  点击此处查看代码图片\n\n```java\nMethod m = Collections.class.getMethod(\"sort\", List.class);\n\
  ```\n\n通过这个 `Method` 对象，你可以恢复出整个方法签名。\n\n`java.lang.reflect` 包中的 `Type` 接口表示泛型类型声明。该接口有以下子类型：\n\
  \n1. `Class` 类，描述具体类型。\n2. `TypeVariable` 接口，描述类型变量（例如 `T extends Comparable<? super\
  \ T>`）。\n3. `WildcardType` 接口，描述通配符（例如 `? super T`）。\n4. `ParameterizedType` 接口，描述泛型类或接口类型（例如\
  \ `Comparable<? super T>`）。\n5. `GenericArrayType` 接口，描述泛型数组（例如 `T[]`）。\n\n注意，后四个子类型都是接口——虚拟机会实例化实现这些接口的相应类。\n\
  \n类和方法都可以拥有类型变量。从技术上说，构造函数不是方法，它们在反射库中由一个单独的类表示。它们也可以是泛型的。要确定一个 `Class`、`Method`\
  \ 或 `Constructor` 对象是否来自泛型声明，请调用 `getTypeParameters` 方法。你会得到一个 `TypeVariable` 实例的数组，声明中的每个类型变量对应一个实例；如果声明不是泛型的，则返回长度为\
  \ 0 的数组。\n\n`TypeVariable<D>` 接口是泛型的。类型参数是 `Class<T>`、`Method` 或 `Constructor<T>`，取决于类型变量声明的位置。例如，这里是获取\
  \ `ArrayList` 类类型变量的方法：\n\n点击此处查看代码图片\n\n```java\nTypeVariable<Class<ArrayList>>[]\
  \ vars = ArrayList.class.getTypeParameters();\nString name = vars[0].getName();\
  \ // \"E\"\n```\n\n这里是 `sort` 方法的类型变量：\n\n点击此处查看代码图片\n\n```java\nMethod m = Collections.class.getMethod(\"\
  sort\", List.class);\nTypeVariable[] vars = m.getTypeParameters();\n```\n\n这让你了解了如何分析泛型声明。我们不深入这些细节，因为这在实践中并不常见。\n\
