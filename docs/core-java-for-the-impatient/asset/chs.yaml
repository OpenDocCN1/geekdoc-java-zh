  \n### 14.3.5 数字\n\nNashorn 中的字符串当然是 JavaScript 对象……（此处省略重复内容）\n\n### 14.3.6 处理数组\n\
  \n要构造 Java 数组，首先一个类对象：\n\n点击此处查看代码图片\n\n```javascript\nvar intArray = Java.type('int[]')\n\
  \nvar StringArray = Java.type('String[]')\n```\n\n（此处翻译结束）\n\n\n\n\n\n点击此处查看代码图像\n\
  \n`java.util.Arrays.toString(Java.to([1, 2, 3], Java.type('int[]')))`\n\n或者简单地\n\
  \n点击此处查看代码图像\n\n`java.util.Arrays.toString(Java.to([1, 2, 3], 'int[]'))`\n\n###\
  \ 14.3.7 列表与 Map\n\nNashorn 为 Java 列表和 Map 提供了“语法糖”。你可以对任何 Java `List` 使用中括号运算符来调用\
  \ `get` 和 `set` 方法：\n\n点击此处查看代码图像\n\n```javascript\nvar names = java.util.Arrays.asList('Fred',\
  \ 'Wilma', 'Barney')\nvar first = names[0]\nnames[0] = 'Duke'\n```\n\n中括号运算符也适用于\
  \ Java Map：\n\n点击此处查看代码图像\n\n```javascript\nvar scores = new java.util.HashMap\n\
  scores['Fred'] = 10 // 调用 `scores.put('Fred', 10)`\n```\n\n要访问 Map 中的所有元素，你可以使用\
  \ JavaScript 的 `for each` 循环：\n\n点击此处查看代码图像\n\n```javascript\nfor (var key in scores)\
  \ ...\nfor each (var value in scores) ...\n```\n\n如果你想同时处理键和值，只需遍历条集（entry set）即可：\n\
  \n点击此处查看代码图像\n\n```javascript\nfor each (var e in scores.entrySet())\n    Process\
  \ e.key and e.value\n```\n\n***\n\n![Image](img/00005.jpeg) 注意\n\n`for each` 循环适用于任何实现了\
  \ `Iterable` 接口的 Java 类。\n\n***\n\n### 14.3.8 Lambda 表达式\n\nJavaScript 有匿名函数，例如：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar square = function(x) { return x * x }\n    //\
  \ 右侧是一个匿名函数\nvar result = square(2)\n    // `()` 运算符调用该函数\n```\n\n在语法上，这种匿名函数与 Java\
  \ Lambda 表达式非常相似。在参数列表后面你使用的不是箭头，而是 `function` 关键字。\n\n你可以将匿名函数作为 Java 方法的函数接口参数使用，就像在\
  \ Java 中可以使用 Lambda 表达式一样。例如：\n\n点击此处查看代码图像\n\n```javascript\njava.util.Arrays.sort(words,\n\
  \    function(a, b) { return java.lang.Integer.compare(a.length, b.length) })\n\
  \    // 按长度升序排序数组\n```\n\nNashorn 支持对函数体为单个表达式的函数进行简写。对于此类函数，你可以省略大括号和 `return`\
  \ 关键字：\n\n点击此处查看代码图像\n\n```javascript\njava.util.Arrays.sort(words,\n    function(a,\
  \ b) java.lang.Integer.compare(a.length, b.length))\n```\n\n再次，注意它与 Java Lambda\
  \ 表达式 `(a, b) -> Integer.compare(a.length, b.length)` 的相似性。\n\n***\n\n![Image](img/00005.jpeg)\
  \ 注意\n\n这种简写表示（称为“表达式闭包”）并不是官方 JavaScript 语言标准（ECMAScript 5.1）的一部分，但 Mozilla 的 JavaScript\
  \ 实现也支持它。\n\n***\n\n## 14.3.9 扩展 Java 类和实现 Java 接口\n\n要扩展 Java 类或实现 Java 接口，请使用\
  \ `Java.extend` 函数。提供父类或接口的类对象，以及包含你想重写或实现的方法的 JavaScript 对象。\n\n例如，这里有一个产生无限随机数序列的迭代器。我们重写了两个方法：`next`\
  \ 和 `hasNext`。对于每个方法，我们提供了一个匿名 JavaScript 函数作为实现：\n\n点击此处查看代码图像\n\n```javascript\n\
  var RandomIterator = Java.extend(java.util.Iterator, {\n    next: function() Math.random(),\n\
  \    hasNext: function() true\n}) // `RandomIterator` 是一个类对象\nvar iter = new RandomIterator()\
  \ // 使用它来构造实例\n```\n\n***\n\n![Image](img/00005.jpeg) 注意\n\n调用 `Java.extend` 时，你可以指定任意数量的父接口以及父类。将所有类对象放在实现方法的对象之前。\n\
  \n***\n\n另一种 Nashorn 语法扩展允许你定义接口或抽象类的匿名子类。当 `new` `JavaClassObject` 后面跟着一个 JavaScript\
  \ 对象时，将返回该扩展类的对象。例如：\n\n点击此处查看代码图像\n\n```javascript\nvar task = new java.lang.Runnable(function()\
  \ { print('Hello') })\n    // task 是一个实现 Runnable 对象\n```\n\n***\n\n![Image](img/00005.jpeg)\
  \ 注意\n\n当扩展具体类时，你不需要 `new` `ClassObject`。\n\n***\n\n如果你要在子类中使用实例变量，可以使用 `this`。例如，这里有一个产生十个随机数的迭代器：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar iter = new (Java.extend(java.util.Iterator, {\n\
  \    count: 10,\n    next: function() { this.count--; return Math.random() },\n\
  \    hasNext: function() { return this.count > 0 }))\n```\n\n注意 `next` 和 `hasNext`\
  \ 方法指向 `this.count`。\n\n在重写方法时调用父类方法是可能的，但很麻烦。这里是使用 `Java.super` 实现的方法：\n\n点击此处查看代码图像\n\
  \n```javascript\nvar arr = new (Java.extend(java.util.ArrayList, {\n    add: function(x)\
  \ {\n        print('Adding ' + x);\n        return Java.super(this).add(x)\n   \
  \ }))\n```\n\n当你调用 `arr.add('Fred')` 时，会先打印消息然后将值添加到数组。注意 `Java.super(arr)` 需要 `arr`\
  \ 变量，它是通过 `new` 设置的。调用 `Java.super(this)` 是无效的——那只会获取定义的 JavaScript 对象。`Java.super`\
  \ 机制仅适用于定义对象，而不是子类。\n\n***\n\n除了调用 `Java.super(arr).add(x)`，你还可以使用语法 `arr.super$(x)`。\n\
  \n***\n\n### 14.3.10 异常\n\n当 Java 方法抛出异常时，你可以按照通常的方式在 JavaScript 中捕获它：\n\n点击此处查看代码图像\n\
  \n```javascript\ntry {\n    var first = list.get(0)\n    ...\n} catch (e) {\n  \
  \  if (e instanceof java.lang.IndexOutOfBoundsException)\n        print('list is\
  \ empty')\n}\n```\n\n注意这里只有一个 `catch` 子句，不像 Java 中可以按类型捕获异常。这符合动态语言的精神，即所有类型查询都是在运行时进行的。\n\
  \n## 14.4 使用 Nashorn 编写脚本\n\n如果你需要在计算机上自动执行重复任务，你很可能已经把这些命令放在了壳脚本中——一个重放操作系统级命令的脚本。我有一个\
  \ `~/bin` 目录，里面几十个脚本：将文件上传到我的网站、博客、照片存储库以及我出版者的 FTP 站点；将图像转换为博客尺寸；给学生批量发送邮件；在凌晨两点备份我的电脑。\n\
  \n\n\n\n对我来说，这些都是 bash 脚本，但在我使用 Windows 的旧时代，它们是批处理文件（batch files）。这又有什么问题呢？当你需要分支和循环时，问题就出现了。由于某种原因，大多数命令行外壳的实现者在编程语言设计方面非常糟糕。`bash`\
  \ 中变量、分支、循环和函数的实现方式简直糟糕透顶，而 Windows 的批语言甚至更糟。我有几个 bash 脚本最初很简单，但随着时间的推移，积累了太多杂质，以至于变得无法管理。这是一个常见的问题。\n\
  \n为什么不直接用 Java 写这些脚本呢？Java 相当冗长。如果你通过 `Runtime.exec` 调用外部命令，你需要管理标准输入/输出/错误流。Nashorn\
  \ 的设计者希望你考虑将 JavaScript 作为一种替代方案。它的语法相对轻量，且 Nashorn 提供了一些专门为 shell 程序员设计的便利工具。\n\
  \n### 14.4.1 执行 Shell 命令\n\n要使用 Nashorn 中的脚本扩展，请运行：\n\n```bash\njjs -scripting\n\
  ```\n\n现在你可以通过将 shell 命令包含在反引号中来执行它们，例如：\n\n```bash\nls -al\n```\n\n上一个命令的标准输出和标准错误流被捕获在\
  \ `$OUT` 和 `$ERR` 中。命令的退出码在 `$EXIT` 中。（按照约定，退出码零表示成功，非零代码表示错误状况。）\n\n你也可以通过将反引号命令的结果赋值给变量来捕获标准输出：\n\
  \n```javascript\nvar output = `ls -al`\n```\n\n如果你想为命令提供标准输入，使用：\n\n```javascript\n\
  $EXEC(command, input)\n```\n\n例如，此命令将 `ls -al` 的输出传递给 `grep -v class`：\n\n点击此处查看代码图片\n\
  \n```javascript\n$EXEC('grep -v class', `ls -al`)\n```\n\n它并不像管道（pipe）那样漂亮，但如果你需要，可以轻松地实现一个管道——参见练习\
  \ 10。\n\n### 14.4.2 字符串插值\n\n在 shell 脚本中，`${...}` 内部的表达式在双引号和反引号字符串内会被求值。这被称为“字符串插值”。例如：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar cmd = \"javac -classpath ${classpath} ${mainclass}.java\"\
  \n```\n\n```javascript\n$EXEC(cmd)\n```\n\n或者简单地：\n\n点击此处查看代码图片\n\n```bash\n`javac\
  \ -classpath ${classpath} ${mainclass}.java`\n```\n\n将变量 `classpath` 和 `mainclass`\
  \ 的内容注入命令中。\n\n你可以在 `${...}` 中使用任意表达式：\n\n点击此处查看代码图片\n\n```javascript\nvar message\
  \ = \"The current time is ${java.time.Instant.now()}\"\n// 将 `message` 设置为类似 `The\
  \ current time is 2013-10-12T21:48:58.545Z` 的字符串\n```\n\n与 bash shell 一样，字符串插值在单引号字符串内部不起作用的。\n\
  \n点击此处查看代码图片\n\n```javascript\nvar message = 'The current time is ${java.time.Instant.now()}'\n\
  // 将 `message` 设置为 `The current time is ${java.time.Instant.now()}`\n```\n\n字符串插值也出现在“在此文档”（here\
  \ documents）中——即脚本中的内联文档。当命令需要从标准输入读取多行，而脚本作者又希望将输入放在单独的文件中，这些内联文档非常有用。例如，这里是你可以向\
  \ GlassFish 管理工具传递命令的方法：\n\n```bash\nname='myapp'\ndir='/opt/apps/myapp'\n$EXEC(\"\
  asadmin\", <<END)\nstart-domain\nstart-database\ndeploy ${name} ${dir}\nexit\nEND\n\
  ```\n\n`<<END` 结构意味着：“插入从下一行开始并以 `END` 行结束的字符串。”（除了 `END` 之外，你可以使用任何未出现在字符串内部的标识符。）\n\
  \n注意，应用程序名称和位置会被插值。\n\n字符串插值和在此文档仅在脚本模式下可用。\n\n### 14.4.3 脚本输入\n\n你可以为脚本提供命令行参数。由于可以在\
  \ `jjs` 命令行上包含多个脚本文件，你需要用 `--` 来分隔脚本文件和参数：\n\n点击此处查看代码图片\n\n```bash\njjs script1.js\
  \ script2.js -- arg1 arg2 arg3\n```\n\n在脚本文件中，你通过 `arguments` 数组接收命令行参数：\n\n点击此处查看代码图片\n\
  \n```javascript\nvar deployCommand = \"deploy ${arguments[0]} ${arguments[1]}\"\n\
  ```\n\n你可以使用 `$ARG` 代替 `arguments`。如果你在字符串插值中使用该变量，那么：\n\n点击此处查看代码图片\n\n```javascript\n\
  var deployCommand = \"deploy ${ARG[0]} ${ARG[1]}\"\n```\n\n在脚本中，你可以通过 `ENV` 对象获取\
  \ shell 的环境变量：\n\n点击此处查看代码图片\n\n```javascript\nvar Home = $ENV\n```\n\n在脚本模式下，可以使用\
  \ `readLine` 提示用户：\n\n点击此处查看代码图片\n\n```javascript\nvar username = readLine('Username:\
  \ ')\n```\n\n最后，要退出脚本，使用 `exit` 函数。你可以提供退出码：\n\n点击此处查看代码图片\n\n```javascript\nif\
  \ (username.length == 0) exit(1)\n```\n\n脚本的第一可以是 shebang，后面跟着解释器的位置：\n\n```bash\n\
  #!/usr/bin/jjs\n```\n\n在 Linux/Mac 上，你可以赋予文件执行权限，将其加入 `PATH`，然后直接运行 `script.js`。当它以\
  \ shebang 开头时，脚本模式会被激活。\n\n## 练习\n\n**1.** 在 Pages 技术中，页面是 HTML 和 Java 的混合，例如：\n\
  \n点击此处查看代码图片\n\n```html\n<ul>\n<% for (int i = 10; i >= 0; i--) { %>\n<li><%= i\
  \ %></li>\n<% %>\n</ul>\n```\n`<%` 之外的内容会被打印。内部的内容会被求值。\n\n**2.** 从 Java 程序，调用 JavaScript\
  \ 的 `JSON.parse` 将 JSON 格式的字符串转换为对象，然后将其转换回字符串。(a) 使用 `eval` (b) 使用 `invokeMethod`\
  \ (c) 通过接口实现：\n\n点击此处查看代码图片\n\n```java\npublic interface JSON {\n    Object parse(String\
  \ str);\n    String stringify(Object obj);\n}\n```\n\n**3.** 编译 Nashorn 吗？编写一个 JavaScript\
  \ 程序，用最笨的方法对数组进行排序，尝试所有排列直到排序完成。比较编译版本和解释执行版本的运行时间。这里是计算下一个排列的 JavaScript 函数：\n\n\
  点击此处查看代码图片\n\n```javascript\nfunction nextPermutation(a) {\n    // 找到从 `a[i]` 开始的最大非递减后缀\n\
  \    var i = a.length - 1\n    while (i > 0 && a[i - 1] >= a[i]) i--\n    if (i\
  \ > 0) {\n        // 将 `a[i - 1]` 与右侧的 `a[k] > a[i - 1]` 交换\n        // 注意 `a[i]\
  \ > a[i - 1]`\n        var k = a.length - 1\n        while (a[k] <= a[i - 1]) k--\n\
  \        swap(a, i - 1, k)\n    } // 否则，后缀是整个数组\n    // 反转后缀\n    var j = a.length\
  \ - 1\n    while (i < j) { swap(a, i, j); i++; j-- }\n}\n```\n\n**4.** 找到一个兼容 Java\
  \ Scripting API 的 Scheme 实现。用 Scheme 编写一个阶乘函数并在 Java 中调用它。\n\n\n\n\n### 5. 选择一些你想要探索的\
  \ Java API 部分——例如，`ZonedDateTime` 类。在 `jjs` 中运行一些实验：构建对象、调用方法并观察返回的值。你是否发现这比在 Java\
  \ 中编写测试程序要简单得多？\n\n### 6. 运行 `jjs` 并使用流库（stream library）交互式地解决以下问题：从文件中按排序顺序打印所有唯一的长单词（大于\
  \ 12 个字符）。首先读取单词，然后过滤长单词，以此此类推。这种交互式方法与你通常的工作流相比如何？\n\n### 7. 运行 `jjs`。调用\n\n此处查看代码图像\n\
  \n```javascript\nvar b = new java.math.BigInteger('1234567890987654321')\n```\n\n\
  然后显示 `b`（只需输入 `b` 并按回车）。你得到了什么？`b.mod(java.math.BigInteger.TEN)` 的值是多少？为什么 `b` 的显示如此奇怪？你该如何显示\
  \ `b` 的实际值？\n\n### 8. 在第 14.3.9 节“扩展 Java 类和实现 Java 接口](#part0021.html_ch14lev2sec19)”的第\
  \ 435 页，你了解了如何扩展 `ArrayList` 以便每次调用 `add` 时记录日志。但这对单个对象有效。编写一个 JavaScript 函数作为此类对象的工厂，这样你就可以生成任意数量的日志列表。\n\
  \n### 9. 编写一个 JavaScript 函数 `pipe`，接收一个 shell 命令序列并将上一个命令的输出作为下一个命令的输入，返回最后一个命令的输出。例如，`pipe('find\
  \ .', 'grep -v class', 'sort')`。只需重复调用 `$EXEC` 即可。\n\n### 10. 上一个练习的解决方案并没有 Unix\
  \ 管道那样好，因为第二个命令只有在第一个命令完成后才会开始。使用 `ProcessBuilder` 类来解决这个问题。\n\n### 11. 编写一个打印所有环境变量值的脚本。\n\
