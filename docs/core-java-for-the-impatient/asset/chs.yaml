  \ ex) {\n        processingEnv.getMessager().printMessage(\n            Kind.ERROR,\
  \ ex.getMessage());\n        }\n    }\n    return true;\n}\n```\n\n关于冗长的细节，请查看书籍的配套代码。\n\
