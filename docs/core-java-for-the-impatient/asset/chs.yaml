  \n### 本章内容\n\n- 7.1 集合框架概述\n- 7.2 迭代器\n- 7.3 集合\n- 7.4 映射\n- 7.5 其他集合\n- 7.6 视图\n\
  - 7.7 练习\n\n许多数据结构的开发是为了让程序员能够高效地存储和检索。Java API 提供了这些实现，以及组织它们的框架。在本章中，你将学习处理列表、集合和映射。\n\
  \n本章的关键点是：\n\n**1.** `Collection` 接口为所有集合提供了通用方法，但映射（map）除外。\n\n**2.** 列表（list）是一个顺序集合，每个元素都有索引。\n\
  \n**3.** Set（set）针对包含性测试进行了优化。Java 提供了 `HashSet` 和 `TreeSet` 实现。\n\n**4.** 对于映射（map），你可以在\
  \ `HashMap` 和 `TreeMap` 实现之间进行选择。`LinkedHashMap` 保留了插入顺序。\n\n**5.** `Collection`\
  \ 接口和 `Collections` 类提供了许多算法：集合操作、排序等。\n\n**6.** 视图（Views）使用标准集合接口访问存储在的数据。\n\n\
  ## 7.1 集合框架概述\n\nJava 集合框架提供了常用数据结构的实现。为了编写独立于数据结构选择的代码，集合框架提供了一系列通用接口，如图 7-1 所示。基础接口是\
  \ `Collection`，其方法如表 7-1 所示。\n\n（注：此处为图片和表格占位符，原文未提供具体内容）\n\n\n\n\n\n`List` 接口由\
  \ `ArrayList` 类（你在本书中一直都会看到该类）和 `LinkedList` 类共同实现。如果你上过数据结构课程，你可能还记得链表——一种由连接的节点组成的序列，每个节点承载一个元素。在链表的中间插入元素速度很快——你只需拼接一个节点即可。但要到达中间，你必须从头开始追踪所有的链接，这很慢。链表有其应用场景，但大多数应用程序程序员在需要顺序集合时可能会倾向于使用数组列表（array\
  \ lists）。尽管如此，`List` 接口仍然有用。例如，`Collections.nCopies(n, o)` 方法返回一个包含 `n` 个对象 `o`\
  \ 副本的 `List` 对象。该对象实际上“耍了弊”，因为它并没有实际存储 `n` 个副本，但当你查询其中任何一个副本时，它会返回 `o`。\n\n***\n\
  \n![Image](img/00009.jpeg) 注意\n\n`List` 接口提供了访问列表第 `n` 个元素的方法，尽管这种访问可能并不高效。为了表示这种访问是高效的，集合类应该实现\
  \ `RandomAccess` 接口。这是一个没有方法的标记接口。例如，`ArrayList` 实现了 `List` 和 `RandomAccess`，但 `LinkedList`\
  \ 仅实现了 `List` 接口。\n\n***\n\n在 `Set` 中，元素不会插入到特定位置，且不允许重复元素。`SortedSet` 允许按照排序顺序进行迭代，而\
  \ `NavigableSet` 拥有寻找元素邻居的方法。你将在第 7.3 节 “集合 (Sets)”第 233 页学习更多关于集合的知识。\n\n`Queue`\
  \ 保留插入顺序，但你只能在尾部插入元素并在头部移除（就像排队一样）。`Deque` 是双端队列，可以在两端进行插入和删除。\n\n所有集合接口都是泛型的，带有一个元素类型的类型参数（`Collection<E>`、`List<E>`\
  \ 等）。`Map<K, V>` 接口有一个用于键类型的类型参数 `K` 和用于值类型的类型参数 `V`。\n\n鼓励你在代码中尽可能使用接口。例如，在构建一个\
  \ `ArrayList` 后，将引用存储在类型为 `List` 的变量中：\n\n点击此处查看代码图片\n\n```java\nList<String> words\
  \ = new ArrayList<>();\n```\n\n每当你实现一个处理集合的方法时，请使用限制最少的接口作为参数类型。通常，`Collection`、`List`\
  \ 或 `Map` 就足够了。\n\n集合框架的一个优势是，在处理常用算法时你不需要重新发明轮子。一些基本算法（如 `addAll` 和 `removeIf`）是\
  \ `Collection` 接口的方法。`Collections` 实用类包含了许多针对各种类型集合的额外算法。你可以排序、洗牌、旋转和反转列表，找到集合中的最大值或最小值，或任意元素的位置，并生成不含元素、单个元素或具有\
  \ `n` 个相同元素副本的集合。表 7–3 提供了摘要。\n\n![Image](img/00041.jpeg)![Image](img/00042.jpeg)\n\
  \n**表 7–3** `Collections` 类有用方法\n\n### 7.2 迭代器\n\n每个集合都提供了一种以某种顺序遍历其元素的方法。`Collection`\
  \ 的父接口 `Iterable<T>` 定义了一个方法：\n\n```java\nIterator<T> iterator()\n```\n\n它产生一个迭代器，你可以用它访问所有元素。\n\
  \n点击此处查看代码图片\n\n```java\nCollection<String> coll = ...;\nIterator<String> iter =\
  \ coll.iterator();\nwhile (iter.hasNext()) {\n    String element = iter.next();\n\
  \    Process element\n}\n```\n\n在这种情况下，你可以简单地使用增强 `for` 循环：\n\n```java\nfor (String\
  \ element : coll) {\n    Process element\n}\n```\n\n***\n\n![Image](img/00005.jpeg)\
  \ 注意\n\n对于任何实现 `Iterable<E>` 接口的类的对象 `c`，增强 `for` 循环都会翻译为上述形式。\n\n***\n\n`Iterator`\
  \ 接口还有一个 `remove` 方法，用于删除上一次的元素。此循环删除所有符合条件的元素：\n\n点击此处查看代码图片\n\n```java\nwhile\
  \ (iter.hasNext()) {\n    String element = iter.next();\n    if (element fulfills\
  \ the condition)\n        iter.remove();\n}\n```\n\n然而，使用 `removeIf` 方法更简单：\n\n\
  点击此处查看代码图片\n\n```java\ncoll.removeIf(e -> e fulfills the condition);\n```\n\n***\n\
  \n![Image](img/00009.jpeg) 注意\n\n`ListIterator` 接口是 `Iterator` 的子接口，具有在元素之前添加元素、设置元素以及向导航的方法。它主要对链表有用。\n\
  \n点击此处查看代码图片\n\n```java\nList<String> friends = new LinkedList<>();\nListIterator<String>\
  \ iter = friends.listIterator();\niter.add(\"Fred\");\niter.add(\"Wilma\");\niter.previous();\n\
  iter.set(\"Barney\");\n```\n\n***\n\n![Image](img/00009.jpeg) 注意\n\n如果你有多个迭代器访问同一个数据结构，且其中一个对其进行了变异，另一个可能会失效。迭代器可能会抛出\
  \ `ConcurrentModificationException`。\n\n### 7.3 集合\n\n集合可以高效地测试某个值是否存在于集合中。`SortedSet`\
  \ 允许按照排序顺序进行迭代。你可能想要这样做的原因之一是向用户展示排序后的选项列表。\n\n`Set` 接口由 `HashSet` 和 `TreeSet` 实现。在内部，这些类使用了完全不同的实现。如果你上过数据结构课程，你可能知道如何实现哈希表和二叉树——但你可以在了解其内部的情况下使用它们。\n\
  \n通常，只要为元素提供了良好的哈希函数，哈希集合效率更高。库类如 `String` 或 `Path` 具有良好的哈希函数。你在第 4 章 中学习了如何为自己的类编写哈希函数。\n\
  \n例如，那个坏词集合可以简单地实现为\n\n```java\nSet<String> badWords = new HashSet<>();\nbadWords.add(\"\
  sex\");\nbadWords.add(\"drugs\");\nbadWords.add(\"c++\");\nif (badWords.contains(username.toLowerCase()))\
  \ {\n    System.out.println(\"Please choose a different user\");\n}\n```\n\n如果你想按照排序顺序遍历集合，可以使用\
  \ `TreeSet`。集合的元素类型必须实现 `Comparable` 接口，或者需要在构造函数中提供一个 `Comparator`。\n\n```java\n\
  TreeSet<String> countries = new TreeSet<>((u, v) -> {\n    if (u.equals(v)) return\
  \ 0;\n    if (u.equals(\"USA\")) return -1;\n    if (v.equals(\"USA\")) return 1;\n\
  \    return u.compareTo(v);\n}); // USA 永远在前\n```\n\n`TreeSet` 类实现了 `SortedSet`\
  \ 和 `NavigableSet` 接口，其方法见表 7–4 和 7–5。\n\n### 7.4 Maps\n\n\n\n\n\n`Maps` 存储了键和值之间的关联。调用\
  \ `put` 可以添加新的关联，或更改现有键的值：\n\n点击此处查看代码图像\n\n```java\nMap<String, Integer> counts\
  \ = new HashMap<>();\n\ncounts.put(\"Alice\", 1); // 将键/值对添加到映射中\ncounts.put(\"\
  Alice\", 2); // 更新键的值\n```\n\n此示例使用了哈希映射（hash map），与集合（sets）一样，如果你不需要按照排序访问键，哈希映射通常是更好的选择。如果你需要，请改用\
  \ `TreeMap`。\n\n以下是获取与键相关联的值的方法：\n\n点击此处查看代码图像\n\n```java\nint count = counts.get(\"\
  Alice\");\n```\n\n如果键不存在，`get` 方法将返回 `null`。在本示例中，当值进行自动拆箱（unboxed）时，这会导致 `NullPointerException`。更好的替代方案是：\n\
  \n点击此处查看代码图像\n\n```java\nint count = counts.getOrDefault(\"Alice\", 0);\n```\n\n\
  那么，如果键不存在，则返回计数 `0`。\n\n当更新映射中的计数器时，首先需要检查计数器是否存在，如果存在，则在现有值上加 1。`merge` 方法简化了这一常用操作。通过调用\n\
  \n点击此处查看代码图像\n\n```java\ncounts.merge(word, 1, Integer::sum);\n```\n\n如果键之前不存在，则将\
  \ `word` 与 1 关联；否则，将使用 `Integer::sum` 函数将之前的值和 1 合并。\n\n![Image](img/00045.jpeg)![Image](img/00046.jpeg)\n\
  \n**表 7–6** 总结了映射操作。\n\n你可以通过调用这些方法获取映射的键（keys）、值（values）和项（entries）的视图：\n\n点击此处查看代码图像\n\
  \n```java\nSet<K> keySet()\nSet<Map.Entry<K, V>> entrySet()\nCollection<K> values()\n\
  ```\n\n返回的集合不是映射数据的副本，但它们与映射是连接的。如果你从视图中删除一个键或项，那么该项也会从底层映射中删除。\n\n要遍历映射的所有键和值，你可以遍历由\
  \ `entrySet` 方法返回的集合：\n\n点击此处查看代码图像\n\n```java\nfor (Map.Entry<String, Integer>\
  \ entry : counts.entrySet()) {\n    String k = entry.getKey();\n    Integer v =\
  \ entry.getValue();\n    Process k, v\n}\n```\n\n或者简单地使用 `forEach` 方法：\n\n```java\n\
  counts.forEach((k, v) -> {\n    Process k, v\n});\n```\n\n***\n\n![Image](img/00009.jpeg)\
  \ **注意**\n\n某些映射实现（例如 `ConcurrentHashMap`）不允许键或值为为 `null`。对于那些允许 `null` 的实现（如 `HashMap`），如果你使用了\
  \ `null` 值，需要非常小心。许多映射方法会将 `null` 值解释为项不存在或应该被删除的指示。\n\n***\n\n![Image](img/00013.jpeg)\
  \ **提示**\n\n有时，你需要以不同于排序的顺序呈现映射键。例如，在 JavaServer Faces 框架中，你使用映射来指定选择框的标签和值。如果选项按字母顺序（Friday,\
  \ Monday, Saturday, Sunday, Thursday, Tuesday, Wednesday）或按哈希码顺序排序，用户会感到惊讶的。在这种情况下，请使用\
  \ `LinkedHashMap`，它会记录项添加的顺序并按照该顺序进行遍历。\n\n***\n\n## 7.5 其他集合\n\n在接下来的章节中，我简要讨论一些你可能在实践中发现的集合类。\n\
  \n#### 7.5.1 Properties\n\n`Properties` 类实现了一个映射，可以使用纯文本格式轻松地保存和加载。此类映射通常用于存储程序的配置选项。例如：\n\
  \n点击此处查看代码图像\n\n```java\nProperties settings = new Properties();\nsettings.put(\"\
  width\", \"200\");\nsettings.put(\"title\", \"Hello, World!\");\ntry (OutputStream\
  \ out = Files.newOutputStream(path)) {\n    settings.store(out, \"Program Properties\"\
  );\n}\n```\n\n结果是如下文件：\n\n```text\n#Program Properties\n#Mon Nov 03 20:52:33 CET\
  \ 2014\nwidth=200\ntitle=Hello, World!\n```\n\n***\n\n![Image](img/00009.jpeg) **注意**\n\
  \n属性文件是用 ASCII 编码的，而不是 UTF-8。注释以 `#` 或 `!` 开头。小于 `#` 或 `!` 的字符用于注释。\n\n要从文件加载属性，请使用：\n\
  \n```java\ntry (InputStream in = Files.newInputStream(path)) {\n    properties.load(in);\n\
  }\n```\n\n#### 7.5.2 位集\n\n`BitSet` 类存储位序列。位集将位封装到数组中，使得对于值的集合，使用位集比布尔数组更高效。\n\n\
  #### 7.5.3 枚举集合和映射\n\n如果你收集枚举值，请使用 `EnumSet` 而不是 `BitSet`。`EnumSet` 类没有公共构造函数。使用静态工厂方法来构造集合：\n\
  \n点击此处查看代码图像\n\n```java\nenum Weekday { MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY,\
  \ SATURDAY, SUNDAY };\nSet<Weekday> always = EnumSet.allOf(Weekday.class);\nSet<Weekday>\
  \ never = EnumSet.noneOf(Weekday.class);\nSet<Weekday> workday = EnumSet.range(Weekday.MONDAY,\
  \ Weekday.FRIDAY);\nSet<Weekday> mwf = EnumSet.of(Weekday.MONDAY, Weekday.WEDNESDAY,\
  \ Weekday.FRIDAY);\n```\n\n你可以使用 `Set` 接口的方法来操作 `EnumSet`。\n\n`EnumMap` 是一种键属于枚举类型的映射。它被实现为值的数组。你在构造函数中指定键类型：\n\
  \n```java\nEnumMap<Weekday, String> personInCharge = new EnumMap<>(Weekday.class);\n\
  personInCharge.put(Weekday.MONDAY, \"Fred\");\n```\n\n#### 7.5.4 栈、队列、双端队列和优先级队列\n\
  \n栈是一种在末端（栈顶）添加和删除元素的数据结构。队列允许高效地从一端（尾部）添加元素，并从另一端（头部）删除它们。双端队列（deque）支持在两端进行插入和删除。在所有这些数据结构中，都不支持在中间添加元素。\n\
  \n\n\n\n\n`Queue` 和 `Deque` 接口定义了这些数据结构的方法。Java 集合框架中没有 `Stack` 接口，只有一个 Java 早期版本的遗留\
  \ `Stack` 类，你应该避免使用它。如果你需要栈、队列或双端队列，且不关心线程安全性，请使用 `ArrayDeque`。\n\n使用栈（stack）时使用\
  \ `push` 和 `pop` 方法。\n\n点击此处查看代码图像\n\n```java\nArrayDeque<String> stack = new ArrayDeque<>();\n\
  stack.push(\"Peter\");\nstack.push(\"Paul\");\nstack.push(\"Mary\");\n\nwhile (!stack.isEmpty())\n\
  \    System.out.println(stack.pop());\n```\n\n使用队列（queue）时使用 `add` 和 `remove`。\n\
  \n点击此处查看代码图像\n\n```java\nQueue<String> queue = new ArrayDeque<>();\nqueue.add(\"\
  Peter\");\nqueue.add(\"Paul\");\nqueue.add(\"Mary\");\n\nwhile (!queue.isEmpty())\n\
  \    System.out.println(queue.remove());\n```\n\n线程安全的队列通常用于并发程序中。你可以在第 10 章中找到关于它们的更多信息。\n\
  \n`priority queue`（优先级队列）在按任意顺序插入元素后按排序检索元素。也就是说，每当你调用 `remove` 方法时，获取的是当前优先级队列中最小的元素。\n\
  \n优先级队列的一个典型用途是任务调度。每个任务都有一个优先级。任务按随机顺序添加。当有新任务可以启动时，优先级最高的任务将从队列中移除。（由于传统上优先级 1\
  \ 是“最高”优先级，因此 `remove` 操作产生最小元素。）\n\n点击此处查看代码图像\n\n```java\npublic class Job implements\
  \ Comparable<Job> { ... }\n\n...\n\nPriorityQueue<Job> jobs = new PriorityQueue<>();\n\
  jobs.add(new Job(4, \"Collect garbage\"));\njobs.add(new Job(9, \"Match braces\"\
  ));\njobs.add(new Job(1, \"Fix memory leak\"));\n\n...\n\nwhile (jobs.size() > 0)\
  \ {\n    Job job = jobs.remove(); // 最紧急的任务先被移除\n    execute(job);\n}\n```\n\n就像\
  \ `TreeSet` 一样，优先级队列可以持有实现了 `Comparable` 接口类的元素，或者你可以在构造函数中提供一个 `Comparator`。但与\
  \ `TreeSet` 不同，遍历元素并不一定能按排序顺序产生。优先级队列使用的添加和移除元素算法使得最小元素倾向于根节点，而无需浪费时间对所有元素进行排序。\n\
  \n### 7.5.5 弱哈希映射 (Weak Hash Maps)\n\n`WeakHashMap` 类的设计是为了解决一个有趣的问题：如果值的键不再被程序的任何地方使用，会发生什么？如果键的最后一个引用消失了，就没有办法再引用该值对象，因此它应该被垃圾回收器移除。\n\
  \n并没有那么简单。垃圾回收器会追踪活跃对象。只要映射对象是活的，它其中所有的条目都是活的且不会被回收——条目引用的值也不会被回收。\n\n这就是 `WeakHashMap`\
  \ 类解决的问题。该数据结构与垃圾回收器协作，当键的唯一引用是哈希表条目的引用时，会移除键/值对。\n\n技术上，`WeakHashMap` 使用 `weak\
  \ references`（弱引用）来持有键。`WeakReference` 对象持有对另一个对象的引用——在我们的案例中是哈希表键。这种类型的对象会被垃圾回收器以特殊方式处理。如果一个对象*仅*通过弱引用可达，垃圾回收器就会回收该对象并将弱引用放入与\
  \ `WeakReference` 对象关联的队列中。每当在该对象上调用方法时，`WeakHashMap` 都会检查其弱引用队列是否有新成员，并移除相关的条目。\n\
  \n## 7.6 视图 (Views)\n\n集合 `view`（视图）是一个实现了集合接口的轻量级对象，但并不存储元素。例如，映射的 `keySet` 和 `values`\
  \ 方法产生的是映射的视图。\n\n另一个例子是 `Arrays.asList` 方法。如果 `a` 是类型为 `E[]` 的数组，那么 `Arrays.asList(a)`\
  \ 返回一个由数组元素支持的 `List<T>`。\n\n通常，视图不支持其接口的所有操作。例如，对映射的键集或 `Arrays.asList` 返回的列表调用\
  \ `add` 没有意义的。\n\n在接下来的章节中，你将看到 Java 集合框架提供的一些视图。\n\n#### 7.6.1 范围 (Ranges)\n\n\
  你可以形成列表的子列表视图。例如，\n\n点击此处查看代码图像\n\n```java\nList<String> sentence = ...;\nList<String>\
  \ nextFive = sentence.subList(5, 10);\n```\n\n此视图访问索引从 5 到 9 的元素。子列表的任何更改（如设置、添加或删除元素）都会影响原始列表。\n\
  \n对于排序集合和映射，你可以通过下界和上界指定范围。点击此处查看代码图像\n\n```java\nTreeSet<String> words = ...;\n\
  SortedSet<String> as = words.subSet(\"a\", \"b\");\n```\n\n在 `subSet` 中，第一个边界是包含的，第二个边界是不包含的。对于\
  \ `NavigableSet`，你可以选择每个边界是包含还是不包含的。点击此处查看代码图像\n\n```java\nNavigableSet<String>\
  \ words = ...;\nNavigableSet<String> nBeyond = words.tailSet(\"n\");\n```\n\n对于\
  \ `subMap`，第一个边界是包含。对于排序映射，有相应的 `headMap` 和 `tailMap`。\n\n#### 7.6.2 空与单例视图 (Empty\
  \ and Singleton Views)\n\n`Collections` 类具有产生不可变空列表、集合、排序集合、导航集合、映射、排序映射、导航映射、迭代或枚举（来自\
  \ Java 1.0）的静态方法。这些见表 7–3。例如，如果一个方法需要一个映射而你没有或只有一个，可以调用点击此处查看代码图像\n\n```java\ndoWork(Collections.emptyMap());\n\
  ```\n\n或者点击此处查看代码图像\n\n```java\ndoWork(Collections.singletonMap(\"id\", id));\n\
  ```\n\n而不是创建一个 `HashMap` 或 `TreeMap` 对象。\n\n#### 7.6.3 不可修改视图 (Unmodifiable Views)\n\
  \n有时，你想共享集合的内容但不希望它被修改。当然，你可以将值复制到新集合中，但代价很大。不可修改视图是一个更好的选择。这是一个典型的情况：`Person` 对象维护一个朋友列表。如果\
  \ `getFriends` 给该列表的引用，调用者就可以修改它。但提供一个不可修改列表是安全的。点击此处查看代码图像\n\n```java\npublic class\
  \ Person {\n    private ArrayList<Person> friends;\n\n    public List<Person> getFriends()\
  \ {\n        return Collections.unmodifiableList(friends);\n    }\n    ...\n}\n\
  ```\n\n在不可修改视图上调用所有变动方法都会抛出异常。\n\n正如从表 7–3 所示，你可以获取不可修改的集合、列表、集合、排序集合、导航集合、映射、排序映射和导航映射。\n\
  \n* * *\n\n![Image](img/00005.jpeg) 注意\n\n在第 6 章中，你看到了如何将错误类型的元素引入泛型集合（这种现象被称为“堆污染”），并且在检索到不适当元素时报告运行时错误，而不是在插入时。如果你需要调试此类问题，请使用*检查视图*。在你构造（例如，`ArrayList<String>`）的地方，改为使用\n\
  \n```java\nList<String> strings = Collections.checkedList(new ArrayList<String>(),\
  \ String.class);\n```\n\n[/content]\n```\n\n\n\n\n\n`Collections.checkedList(new\
  \ ArrayList<>(), String.class);`\n\n该视图监控列表中的所有插入操作，当添加类型错误的对象时会抛出异常。\n\n***\n\n\
  ![Image](img/00005.jpeg) 笔记\n\n`Collections` 类产生 `synchronized`（同步）视图，确保对数据结构进行安全的并发访问。在实践中，这些视图并不如\
  \ `java.util.concurrent` 包中那些显式为并发访问设计的数据结构那样有用。我建议你使用那些类，并避免同步视图。\n\n***\n\n##\
  \ 练习题\n\n1. 实现“埃拉托尼筛法”算法来确定所有小于 `n` 的质数。将从 2 到 `n` 的所有数字添加到集合中。然后反复在集合中找到最小的元素 `s`，并移除\
  \ `s²`、`s · (`s` + 1)`、`s · (`s` + 2)` 等。当 `s²` > `n` 时完成。请分别使用 `HashSet<Integer>`\
  \ 和 `BitSet` 完成此操作。\n\n2. 在一个字符串列表中，将每个字符串转换为大写。通过 (a) 迭代器，(b) 遍历索引值的循环，以及 (c) `replaceAll`\
  \ 方法来实现。\n\n3. 如何仅使用 `Set` 接口的方法且不使用循环来计算两个集合并集、交集和差集？\n\n4. 构造一个产生 `ConcurrentModificationException`（并发修改异常）的情况。你可以做什么来避免它？\n\
  \n5. 实现一个方法 `public static void swap(List<?> list, int i, int j)`，当 `list` 的类型实现了\
  \ `RandomAccess` 接口时，以通常的方式交换元素；如果未实现，则最小化访问索引为 `i` 和 `j` 位置的代价。\n\n6. 我鼓励你使用接口而不是具体的数据结构，例如，使用\
  \ `Map` 而不是 `TreeMap`。遗憾的是，这种建议是有限的。为什么你不能用 `Map<String, Set<Integer>>` 来表示目录？（提示：你会如何初始化它？）你又可以使用什么类型来代替？\n\
  \n7. 编写一个程序，读取文件中所有的单词并打印每个单词出现的频率。使用 `TreeMap<String, Integer>`。\n\n8. 编写一个程序，读取文件中所有的单词，并打印每个单词出现在哪些行。使用一个从字符串到集合的\
  \ map。\n\n9. 你可以这样更新计数器 map 中的计数器：\n\n点击此处查看代码图片\n\n```\ncounts.merge(word, 1, Integer::sum);\n\
  ```\n\n在不使用 `merge` 方法的情况下完成相同的操作：(a) 使用 `contains`，(b) 使用 `get` 和 `null` 检查，(c)\
  \ 使用 `getOrDefault`，(d) 使用 `putIfAbsent`。\n\n10. 实现 Dijkstra 算法以在城市网络中寻找最短路径，其中某些城市由道路连接。（如需算法描述，请查阅你最喜欢的算法书籍或维基百科文章。）使用一个辅助类\
  \ `Neighbor`，它存储邻居城市的名称和距离。将图表示为从城市到邻居集合的 map。在算法中使用 `PriorityQueue<Neighbor>`。\n\
  \n11. 编写一个程序，将一个句子读入列表中。然后，使用 `Collections.shuffle` 打乱除第一个和最后一个单词以外的所有单词，且不将单词复制到另一个集合中。\n\
  \n12. 使用 `Collections.shuffle` 编写一个程序，读取一个句子，打乱单词并打印结果。修复第一个单词的大小写和最后一个单词的标点符号（打乱之前之后）。提示：不要直接打乱单词。\n\
  \n13. `LinkedHashMap` 在每次插入新元素时都会调用 `removeEldestEntry` 方法。实现一个子类 `Cache`，将 map\
  \ 限制为构造函数提供的给定大小。\n\n14. 编写一个方法，产生从 `0` 到 `n` 数字的不可变列表视图，而无需实际存储这些数字。\n\n15. 将前一个练习推广到任意的\
  \ `IntFunction`。注意结果是一个无限集合，因此某些方法（如 `size` 和 `toArray`）应该抛出 `UnsupportedOperationException`。\n\
  \n16. 通过缓存最后 100 个计算出的函数值来优化前一个练习的实现。\n\n17. 检查视图（checked view）如何为堆污染（heap pollution）的原因提供准确的错误报告。\n\
  \n18. `Collections` 类有静态变量 `EMPTY_LIST`、`EMPTY_MAP` 和 `EMPTY_SET`。为什么它们没有 `emptyList`、`emptyMap`\
  \ 和 `emptySet` 方法好用？\n\n## 第 8 章 流 (Streams)\n\n### 本章主题\n\n![Image](img/00004.jpeg)\
  \ 8.1 从迭代到流操作\n\n![Image](img/00004.jpeg) 8.2 流的创建\n\n![Image](img/00004.jpeg) 8.3\
  \ `filter`, `map` 和 `flatMap` 方法\n\n![Image](img/00004.jpeg) 8.4 提取子流和合并流\n\n![Image](img/00004.jpeg)\
  \ 8.5 其他流操作\n\n![Image](img/00004.jpeg) 8.6 规约操作\n\n![Image](img/00004.jpeg) 8.7\
  \ Optional 类型\n\n![Image](img/00004.jpeg) 8.8 收集结果\n\n![Image](img/00004.jpeg) 8.9\
  \ 收集到 Map\n\n![Image](img/00004.jpeg) 8.10 分组与分区\n\n![Image](img/00004.jpeg) 8.11\
  \ 下游收集器\n\n![Image](img/00004.jpeg) 8.12 规约操作\n\n![Image](img/00004.jpeg) 8.13 原生类型\n\
  \n![Image](img/00004.jpeg) 8.14 并行流\n\n![Image](img/00004.jpeg) 8.15 练习题\n\n流提供了数据的视图，让你以更高级的方式指定计算。通过流，你指定想要做什么，而不是如何做。将操作调度交给实现。例如，假设你想计算某个属性的平均值。你指定数据源和属性，流库就可以通过使用多线程来优化计算。\n\
  \n本章的关键点是：\n\n- 迭代器意味着特定的遍历策略并禁止并发执行。\n- 你可以从集合、数组、生成器或迭代器创建流。\n- 使用 `filter` 选择元素并使用\
  \ `map` 转换元素。\n- 流的其他操作包括 `limit`、`distinct` 和 `sorted`。\n- 要从流获取结果，使用规约运算符 `count`、`max`、`min`、`findFirst`\
  \ 或 `findAny`。其中某些方法返回 `Optional` 值。\n- `Optional` 类型旨在作为处理 `null` 值的安全方案。为了安全地使用它，请利用\
  \ `ifPresent` 和 `orElse` 方法。\n- 你可以将流结果收集到集合、数组、字符串或 map 中。\n- `Collectors` 类的 `groupingBy`\
  \ 和 `partitioningBy` 方法允许你将流的内容分组，并为每个组获取结果。\n- 为原生类型 `int`、`long` 和 `double` 有专门的流。\n\
  - 并行流会自动并行流操作。\n\n### 8.1 从迭代到流操作\n\n当你处理集合时，通常会遍历它的元素并对每个元素执行某些操作。例如，假设我们要统计一书中所有的长词。首先，将它们放入列表：\n\
  \n点击此处查看代码图片\n\n```\nString contents = new String(Files.readAllBytes(\n    Paths.get(\"\
  alice.txt\")), StandardCharsets.UTF_8); // 读取文件到字符串\n\nList<String> words = Arrays.asList(contents.split(\"\
  \\\\PL+\"));\n\n// 拆分为单词；非字母是分隔符\n```\n\n现在我们准备好进行迭代了：\n\n\n\n\n\n点击此处查看代码图像\n\n\
  ```java\nint count = 0;\n\nfor (String w : words) {\n    if (w.length() > 12) count++;\n\
  }\n```\n\n使用流（streams），相同的操作看起来如下：\n\n点击此处查看代码图像\n\n```java\nlong count = words.stream()\n\
  \    .filter(w -> w.length() > 12)\n    .count();\n```\n\n现在，你不再需要扫描循环来寻找过滤和计数的证据了。方法名会立即告诉你代码的意图。此外，循环详尽地规定了操作的顺序，而流可以根据需要以任何方式调度操作，只要结果是正确的。\n\
  \n只需将 `stream` 更改为 `parallelStream`，流库即可能够并行执行过滤和计数。\n\n点击此处查看代码图像\n\n```java\n\
  long count = words.parallelStream()\n    .filter(w -> w.length() > 12)\n    .count();\n\
  ```\n\n流遵循“关注什么，而非如何做”（what, not how）原则。在我们的流示例中，我们描述了需要做什么：获取长单词并对其进行计数。我们没有指定应该以什么顺序或在哪个线程中执行。相比之下，本节开头的循环精确指定了计算应该如何工作，从而放弃了任何优化的机会。\n\
  \n流在表面上与集合（collection）相似，允许你转换和检索数据。但它们之间存在显著差异：\n\n1. 流并不存储它的元素。元素可能存储在底层的集合中，或者根据需要生成。\n\
  2. 流操作不会改变其源。。例如，`filter` 方法不会从新流中移除元素，而是产生一个不包含这些元素的新流。\n3. 流操作在可能的情况下是 `lazy`（惰性）的。这意味着在结果被需要之前，它们不会执行。例如，如果你只请求前五个长单词而不是所有的，`filter`\
  \ 方法将在第五个匹配项后停止过滤。因此，你甚至可以拥有无限流！\n\n让我们再次看看这个示例。`stream` 和 `parallelStream` 方法为\
  \ `words` 列表产生一个 `stream`。`filter` 方法返回另一个仅包含长度大于十二的单词的流。`count` 方法将该流归约为一个结果。\n\
  \n这种工作流在处理流时是典型的。你分三个阶段设置操作流水线：\n\n1. 创建流。\n2. 指定 `intermediate operations`（中间操作）将初始流转换为其他流，可能涉及多个步骤。\n\
  3. 应用 `terminal operation`（终端操作）以产生结果。该操作会强制执行其之前的惰性操作。之后，该流将无法再次使用。\n\n在我们的示例中，流是通过\
  \ `stream` 或 `parallelStream` 方法创建的。`filter` 方法对其进行了转换，而 `count` 是终端操作。\n\n在下一节节中，你将看到如何创建流。接下来的三个部分处理流的转换。最后是五个关于终端操作的章节。\n\
  \n### 8.2 流的创建\n\n你已经看到，可以通过 `Collection` 接口的 `stream` 方法将任何集合转换为流。如果你有一个数组，请使用静态的\
  \ `Stream.of` 方法。\n\n点击此处查看代码图像\n\n```java\nStream<String> words = Stream.of(contents.split(\"\
  \\\\PL+\"));\n// split 返回 String[] 数组\n```\n\n`of` 方法有一个变长参数（varargs），因此你可以从任意数量的参数构造流：\n\
  \n点击此处查看代码图像\n\n```java\nStream<String> song = Stream.of(\"gently\", \"down\", \"\
  the\", \"stream\");\n```\n\n使用 `Arrays.stream(array, from, to)` 从数组的一部分创建流。\n\n\
  要创建一个没有任何元素的流，请使用静态的 `Stream.empty` 方法：\n\n点击此处查看代码图像\n\n```java\nStream<String>\
  \ silence = Stream.empty();\n// 泛型类型 <String> 被推断出来；同于 Stream.<String>empty()\n\
  ```\n\n`Stream` 接口有两个用于创建无限流的静态方法。`generate` 方法接收一个无参数函数（或从技术上说，一个 `Supplier<T>`\
  \ 接口的对象——参见第 3.6.2 节”，位于第 113 页）。每当需要流值时，就会调用该函数来产生一个值。你可以这样获取常量值的流：\n\n点击此处查看代码图像\n\
  \n```java\nStream<String> echos = Stream.generate(() -> \"echo\");\n```\n\n要产生无限序列，请使用\
  \ `iterate` 方法。它接收一个 `seed` 值和一个函数（技术上是 `UnaryOperator<T>`），并反复将该函数应用于之前的结果。例如：\n\
  \n```java\nStream<Integer> integers = Stream.iterate(0, n -> n + 1);\n```\n\n序列的第一个元素是\
  \ `seed`。第二个元素是 `f(seed)`，以此类推。\n\n![Image](img/0005) `Pattern` 类有一个 `splitAsStream`\
  \ 方法，可以根据正则表达式拆分 `CharSequence`。你可以使用以下方法点击此处查看代码图像\n\n```java\nStream<String> words\
  \ = Pattern.compile(\"\\\\PL+\").splitAsStream(contents);\n```\n\n静态的 `Files.lines`\
  \ 方法返回文件的 `Stream`：点击此处查看代码图像\n\n```java\ntry (Stream<String> lines = Files.lines(path))\
  \ {\n    // 处理行\n}\n```\n\n*\n\n### 8.3 filter、map 和 flatMap 方法\n\n流转换产生一个源自另一个流的流。你已经见过\
  \ `filter` 转换，它产生一个符合特定条件的流。在这里，我们将字符串流转换为另一个包含长单词的流：点击此处查看代码图像\n\n```java\nList<String>\
  \ words = ...;\nStream<String> longWords = words.stream().filter(w -> w.length()\
  \ > 12);\n```\n\n`filter` 的参数是一个 `Predicate<T>`——即从 `T` 到 `boolean` 的函数。\n\n通常，你想对流中的值进行某种转换。使用\
  \ `map` 方法并传递执行转换的函数。例如，你可以将所有单词转换为小写：点击此处查看代码图像\n\n```java\nStream<String> lowercaseWords\
  \ = words.stream().map(String::toLowerCase);\n```\n\n在这里，我们在 `map` 中使用了方法引用。通常，你会使用\
  \ Lambda 表达式：点击此处查看代码图像\n\n```java\nStream<String> firstLetters = words.stream().map(s\
  \ -> s.substring(0, 1));\n```\n\n结果流包含每个单词的第一个字母。\n\n当你使用 `map` 时，函数会被应用于每个元素，结果是一个包含这些结果的新流。现在，假设你有一个函数返回的不只是一个值，而是一个值的流，例如这一个：点击此处查看代码图像\n\
  \n```java\npublic static Stream<String> letters(String s) {\n    List<String> result\
  \ = new ArrayList<>();\n    for (int i = 0; i < s.length(); i++) {\n        result.add(s.substring(i,\
  \ i + 1));\n    }\n    return result.stream();\n}\n```\n\n例如，`letters(\"boat\")`\
  \ 是流 `[\"b\", \"o\", \"a\", \"t\"]`。\n\n*\n\n\n\n通过第 8.13 节中的 `IntStream.range`\
  \ 方法以及第 266 页的“基类型类型流”，你可以更优雅地实现该方法——参见练习 5。\n\n假设你在字符串流上映射了 `letters` 方法：\n\n点击此处查看代码图像\n\
  \n```java\nStream<Stream<String>> result = words.stream().map(w -> letters(w));\n\
  ```\n\n你将得到一个流的流，如 `[... [\"y\", \"o\", \"u\", \"r\"], [\"b\", \"o\", \"a\", \"\
  t\"], ...]`。要将其展平为一个字符流 `[... \"y\", \"o\", \"u\", \"r\", \"b\", \"o\", \"a\", \"\
  t\", ...]`，请使用 `flatMap` 方法而不是 `map`：\n\n点击此处查看代码图像\n\n```java\nStream<String> flatResult\
  \ = words.stream().flatMap(w -> letters(w))\n// 对每个单词调用 `letters` 并展平结果\n```\n\n\
  ![Image](img/00005.jpeg) 注意\n\n你会在流类以外的其他类中找到 `flatMap` 方法。它是计算机科学中的一个通用概念。假设你有一个泛型类型\
  \ `G`（如 `Stream`）以及从某些类型 `T` 到 `G<U>` 的函数 `f` 和从 `U` 到 `G<V>` 的函数 `g`。那么你可以通过 `flatMap`\
  \ 将它们组合起来——即先应用 `f` 后应用 `g`。这是单 ad（monads）理论中的核心思想。但不要担心——你可以在不了解任何单 ad 的情况下使用 `flatMap`。\n\
  \n### 8.4 提取子流和合并流\n\n调用 `stream.limit(n)` 返回一个新流，该流在 `n` 个元素后结束（如果原始流较短，则在原始流结束时）。此方法对于将无限流裁剪为指定大小特别有用。例如，\n\
  \n点击此处查看代码图像\n\n```java\nStream<Double> randoms = Stream.generate(Math::random).limit(100);\n\
  ```\n\n产生一个包含 100 个随机数的流。\n\n调用 `stream.skip(n)` 则完全相反。它丢弃前 `n` 个元素。在我们阅读书籍的示例中非常方便，由于\
  \ `split` 方法的工作方式，第一个元素是一个不需要的空字符串。我们可以通过调用 `skip` 让它消失：\n\n点击此处查看代码图像\n\n```java\n\
  Stream<String> words = Stream.of(contents.split(\"\\\\PL+\")).skip(1);\n```\n\n\
  你可以使用 `Stream` 类的静态方法 `concat` 合并两个流：\n\n点击此处查看代码图像\n\n```java\nStream<String> combined\
  \ = Stream.concat(\n    letters(\"Hello\"), letters(\"World\"));\n//产生流 [\"H\",\
  \ \"e\", \"l\", \"l\", \"o\", \"W\", \"o\", \"r\", \"l\", \"d\"]\n```\n\n当然，第一个流不应该是无限的——否则第二个流永远没有机会执行。\n\
  \n### 8.5 其他流转换\n\n`distinct` 方法返回一个流，该流按原始流的相同顺序产生元素，但抑制了重复元素。重复元素并不一定非是相邻的。\n\n\
  点击此处查看代码图像\n\n```java\nStream<String> uniqueWords = Stream.of(\"merrily\", \"merrily\"\
  , \"merrily\", \"gently\").distinct();\n// 仅保留一个 \"merrily\"\n```\n\n对于流的排序，`sorted`\
  \ 方法有几种变体。一种适用于 `Comparable` 元素的流，另一种接受一个 `Comparator`。在这里，我们对字符串进行排序，使最长的排在前面：\n\
  \n点击此处查看代码图像\n\n```java\nStream<String> longestFirst = words.stream().sorted(Comparator.comparing(String::length).reversed());\n\
  ```\n\n与所有的流转换一样，`sorted` 方法产生一个新流，其元素是原始流元素按排序后的顺序。\n\n当然，你可以在不使用流的情况下对集合进行排序。当排序过程是流流水线的一部分时，`sorted`\
  \ 方法就非常有用。\n\n最后，`peek` 方法产生另一个与原始流元素相同的流，但每当获取一个元素时都会调用一个函数。这对于调试非常方便：\n\n点击此处查看代码图像\n\
  \n```java\nObject[] powers = Stream.iterate(1.0, p -> p * p)\n```\n\n### 8.6 规约操作\n\
  \n现在已经学习了如何创建和转换流，我们终于进入最重要的部分：从流中获取结果。在本节中涵盖的方法被称为规约（reductions）。它们是终端操作。你已经看到了一个规约：`count`\
  \ 方法，它返回元素的数量。其他的规约有 `max` 和 `min`，它们返回最大值或最小值。这些方法返回一个 `Optional<T>` 值。`findFirst`\
  \ 返回非空集合中的第一个值。例如：\n\n点击此处查看代码图像\n\n```java\nOptional<String> startsWithQ = words.filter(s\
  \ -> s.startsWith(\"Q\")).findFirst();\n```\n\n如果你接受任何匹配项而不只是第一个，使用 `findAny` 方法。这在并行化流时非常有效：\n\
  \n点击此处查看代码图像\n\n```java\nOptional<String> startsWithQ = words.parallel().filter(s\
  \ -> s.startsWith(\"Q\")).findAny();\n```\n\n如果你只想知道是否存在匹配，使用 `anyMatch`。该方法接受一个谓词参数，因此你不需要使用\
  \ `filter`。\n\n点击此处查看代码图像\n\n```java\nboolean aWordStartsWithQ = words.parallel().anyMatch(s\
  \ -> s.startsWith(\"Q\"));\n```\n\n还有 `allMatch` 和 `noneMatch` 方法，当所有元素或没有元素匹配谓词时返回\
  \ `true`。这些方法也适用于并行运行。\n\n### 8.7 Optional 类型\n\n`Optional<T>` 对象是类型 `T` 对象或无对象的包装器。在前者的情况下，我们说该值存在。`Optional<T>`\
  \ 类型旨在作为类型 `T` 引用（可能为 null）更安全的替代方案。但只有当你正确使用它时，它才是安全的。下一节将展示如何操作。\n\n#### 8.7.1\
  \ 如何处理 Optional 值\n\n有效使用 `Optional` 的关键是使用一个在值不存在时产生备选项的方法，或者在值存在时消费该值。\n\n让我们看看第一种策略。通常，当没有匹配时，你想使用一个默认值，例如空字符串：\n\
  \n点击此处查看代码图像\n\n```java\nString result = optionalString.orElse(\"\");\n// 返回包装的字符串，如果没有则返回\
  \ \"\"\n```\n\n你也可以调用代码来计算默认值：\n\n\n\n\n```java\nString result = optionalString.orElseGet(()\
  \ -> System.getProperty(\"user.dir\"));\n```\n// 该函数仅在需要时被调用\n\n或者在没有值时你可以抛出一个异常：\n\
  \n点击此处查看代码图像\n\n```java\nString result = optionalString.orElseThrow(IllegalStateException::new);\n\
  ```\n// 提供一个产生异常对象的方法\n\n你刚刚已经学会了如何在没有值时产生一个备选方案。处理可选 值的另一种策略是：仅在值存在时才消费该值。\n\n\
  `ifPresent` 方法接受一个函数。如果可选值值存在，则会将其传递给该函数。否则，什么都不会发生。\n\n点击此处查看代码图像\n\n```java\n\
  optionalValue.ifPresent(v -> Process v);\n```\n\n例如，如果你想在值存在时将其添加到集合中，请调用\n\n点击此处查看代码图像\n\
  \n```java\noptionalValue.ifPresent(v -> results.add(v));\n```\n\n或者简单地使用\n\n点击此处查看代码图像\n\
  \n```java\noptionalValue.ifPresent(results::add);\n```\n\n调用 `ifPresent` 时，函数不会返回任何值。如果你想处理函数的结果，请改用\
  \ `map`：\n\n点击此处查看代码图像\n\n```java\nOptional<Boolean> added = optionalValue.map(results::add);\n\
  ```\n\n现在 `added` 拥有三个值之一：如果 `optionalValue` 存在，则是一个封装在 `Optional` 中的 `true` 或 `false`；否则，是一个空的\
  \ `Optional`。\n\n***\n\n![Image](img/00005.jpeg) 备注\n\n这个 `map` 方法与 `Stream` 接口中的\
  \ `map` 方法类似，该方法你在 第 8.3 节，“`filter`、`map` 和 `flatMap` 方法](#part0015.html_ch08lev1sec3)”中见过，位于第\
  \ 252 页。只需将可选值构想成一个大小为零或一的流。结果的大小同样为零或一，在后者的情况下，函数已经被应用。\n\n***\n\n### 8.7.2 如何不正确使用可选值\n\
  \n如果你不正确使用 `Optional` 值，那么你相对于过去的“某些值或 `null`”方法并没有任何好处。\n\n`get` 方法在 `Optional`\
  \ 值存在时获取其封装的元素，如果不存在则抛出 `NoSuchElementException`。因此，\n\n点击此处查看代码图像\n\n```java\n\
  Optional<T> optionalValue = ...;\noptionalValue.get().someMethod()\n```\n并不安全于\n\
  \n```java\nT value = ...;\nvalue.someMethod();\n```\n\n`isPresent` 方法报告 `Optional<T>`\
  \ 对象是否具有值。但是\n\n点击此处查看代码图像\n\n```java\nif (optionalValue.isPresent()) optionalValue.get().someMethod();\n\
  ```\n并不比易于\n\n点击此处查看代码图像\n\n```java\nif (value != null) value.someMethod();\n```\n\
  \n### 8.7.3 创建可选值\n\n到为止，我们讨论了如何消费别人创建的 `Optional` 对象。如果你想写一个创建一个 `Optional` 对象的方法，有几个静态方法可以用于此目的，包括\
  \ `Optional.of(result)` 和 `Optional.empty()`。例如，\n\n点击此处查看代码图像\n\n```java\npublic\
  \ static Optional<Double> inverse(Double x) {\n    return x == 0 ? Optional.empty()\
  \ : Optional.of(1 / x);\n}\n```\n\n`ofNullable` 方法旨在作为可能为 `null` 的值到可选值的桥梁。`Optional.ofNullable(obj)`\
  \ 如果 `obj` 为 `null` 则返回 `Optional.of(obj)`，否则返回 `Optional.empty()`。\n\n### 8.7.4\
  \ 使用 flatMap 组合可选值函数\n\n假设你有一个方法 `f` 返回一个 `Optional<T>`，且目标类型 `T` 有一个方法 `g` 返回一个\
  \ `Optional<U>`。如果它们是普通方法，你可以通过调用 `s.f().g()` 来组合它们。但这种组合行不起的，因为 `s.f()` 的类型是 `Optional<T>`，而不是\
  \ `T`。相反，调用\n\n点击此处查看代码图像\n\n```java\nOptional<U> result = s.f().flatMap(T::g);\n\
  ```\n\n如果 `s.f()` 有值，则对该值应用 `T::g`。如果 `s.f()` 是空的，则返回一个空的 `Optional<U>`。\n\n假设你有一个返回\
  \ `Optional<T>` 的方法 `f`，且目标类型 `T` 有一个返回 `Optional<U>` 的方法 `g`。\n\n### 8.8 收集结果\n\
  \n当你完成流的操作后，通常想要查看结果。你可以调用 `forEach` 来访问元素。或者，你可以调用 `forEach` 对每个元素应用函数。对于并行流，`forEach`\
  \ 以任意顺序遍历元素。如果你想按顺序处理，请改用 `forEachOrdered`。\n\n但通常你会将结果收集到数据结构中。你可以调用 `toArray`\
  \ 并获取数组。由于无法在运行时创建泛型数组，表达式 `stream.toArray()` 返回 `Object[]` 数组。如果你需要正确的类型，请传入构造函数：\n\
  \n使用 `collect` 接口收集流元素。\n\n对于将流元素收集到另一个目标，有一个方便的 `collect` 方法，它接收 `Collector` 接口的实例。`Collectors`\
  \ 类提供了许多常用收集器的工厂方法。要将流收集到列表或集合，只需调用\n\n```java\nList<String> result = stream.collect(Collectors.toList());\n\
  ```\n\n或者\n\n```java\nSet<String> result = stream.collect(Collectors.toSet());\n\
  ```\n\n如果你想控制获取的是哪种集合，请使用以下调用：\n\n```java\nTreeSet<String> result = stream.collect(Collectors.toCollection(TreeSet::new));\n\
  ```\n\n假设你想通过拼接收集流中的所有字符串。你可以\n\n```java\nString result = stream.collect(Collectors.joining());\n\
  ```\n\n如果你想在元素之间使用分隔符，请将其传递给 `joining` 方法。\n\n\n\n\n\n```java\nString result = stream.collect(Collectors.joining(\"\
  , \"));\n```\n\n如果您的流包含除字符串以外的对象，您需要先将它们转换为字符串，如下：\n\n点击此处查看代码图像\n\n```java\nString\
  \ result = stream.map(Object::toString).collect(Collectors.joining(\", \"));\n```\n\
  \n如果您想将流的结果还原为和、平均值、最大值或最小值，请使用 `summarizing`(`Int`|`Long`|`Double`）方法。这些方法接收一个将流对象映射到数字的函数，并返回类型为\
  \ (`Int`|`Long`|`Double`)`SummaryStatistics` 的结果，同时计算和、平均值、最大值和最小值。\n\n点击此处查看代码图像\n\
  \n```java\nIntSummaryStatistics summary = stream.collect(\n    Collectors.summarizingInt(String::length));\n\
  \ndouble averageWordLength = summary.getAverage();\ndouble maxWordLength = summary.getMax();\n\
  ```\n\n### 8.9 收集到 Map\n\n假设您有一个 `Stream<Person>`，并想将元素收集到 map 中，以便稍后可以通过 ID 查找人员。`Collectors.toMap`\
  \ 方法有两个函数参数，分别用于生成 map 的键和值。例如，\n\n点击此处查看代码图像\n\n```java\nMap<Integer, String> idToName\
  \ = people.collect(\n    Collectors.toMap(Person::getId, Person::getName));\n```\n\
  \n在值应为实际元素的常见情况下，请对第二个函数使用 `Function.identity()`。\n\n点击此处查看代码图像\n\n```java\nMap<Integer,\
  \ Person> idToPerson = people.collect(\n    Collectors.toMap(Person::getId, Function.identity()));\n\
  ```\n\n如果存在多个具有相同的元素，就会发生冲突，收集器将抛出 `IllegalStateException`。您可以通过提供第三个函数参数来覆盖该行为，该函数用于解决冲突并根据现有值和新值确定键的值。您的函数可以返回现有值、新值或两者的组合。\n\
  \n在这里，我们构建了一个 map，它对于可用区域设置中的每种语言，将其在默认区域设置中的名称（例如 `\"German\"`）作为键，并将其本地化名称（例如\
  \ `\"Deutsch\"`）作为值。\n\n点击此处查看代码图像\n\n```java\nStream<Locale> locales = Stream.of(Locale.getAvailableLocales());\n\
  Map<String, String> languageNames = locales.collect(\n    Collectors.toMap(\n  \
  \      Locale::getDisplayLanguage,\n        Locale::getDisplayLanguage,\n      \
  \  (existingValue, newValue) -> existingValue));\n```\n\n我们不在乎同一种语言可能出现两次（例如德国和瑞士的德语），所以只保留第一条目。\n\
  \n***\n\n![图像](img/00005.jpeg) 备注\n\n在本章中，我使用 `Locale` 类作为有趣数据集来源。有关处理区域设置的更多信息，请参阅\
  \ 第 13 章。\n\n***\n\n现在假设我们想知道某个国家的所有语言。那么我们需要一个 `Map<String, Set<String>>`。例如，`\"\
  Switzerland\"` 的值是集合 `[French, German, Italian]`。起初，为每个语言存储一个单例集合。每当为某个国家发现新语言时，我们就现有集合和新集合的并集。\n\
  \n点击此处查看代码图像\n\n```java\nMap<String, Set<String>> countryLanguageSets = locales.collect(\n\
  \    Collectors.toMap(\n        Locale::getDisplayCountry,\n        l -> Collections.singleton(l.getDisplayLanguage()),\n\
  \        (a, b) -> { // a 和 b 的并集\n            Set<String> union = new HashSet<>(a);\n\
  \            union.addAll(b);\n            return union; }));\n```\n\n您将在下一节看到获取此\
  \ map 的更简单的方法。\n\n如果您想要 `TreeMap`，请将构造函数作为第四参数提供。您必须提供一个合并函数。这是该节开头示例之一，现在产生一个 `TreeMap`：\n\
  \n点击此处查看代码图像\n\n```java\nMap<Integer, Person> idToPerson = people.collect(\n   \
  \ Collectors.toMap(Person::getId,\n        Function.identity(),\n        (existingValue,\
  \ newValue) -> { throw new IllegalStateException(); },\n        TreeMap::new));\n\
  ```\n\n***\n\n![图像](img/00005.jpeg) 备注\n\n在本章中，我使用 `Locale` 类作为有趣数据集来源。（等等，此处此处重复了逻辑，保持了原始流程）。\n\
  \n### 8.10 分组与分区\n\n在节一节中，您看到了如何收集 map。但这个过程有点繁琐。您必须为每个 map 生成单例集合。让我们来看看分组和分区。首先，我们按国家对\
  \ locale 分组：\n\n点击此处查看代码图像\n\n```java\nMap<String, List<Locale>> countryLocales\
  \ = locales.collect(\n    Collectors.groupingBy(Locale::getCountry));\n```\n\n`Locale::getCountry`\
  \ 是分类器。您现在可以查找特定国家的所有 locale，例如：\n\n```java\nList<Locale> swissLocales = countryLocales.get(\"\
  CH\");\n```\n\n当分类器函数是一个谓词时（即返回 `boolean` 值的函数），流元素会被分区为两个列表：函数返回 `true` 的部分和其补集部分。在这种情况下，使用\
  \ `partitioningBy` 而不是 `groupingBy` 更更高效。例如，在这里我们将所有 locale 分为使用英语的 locale 和其他的：\n\
  \n点击此处查看代码图像\n\n```java\nMap<Boolean, List<Locale>> englishAndOtherLocales = locales.collect(\n\
  \    Collectors.partitioningBy(l -> l.getLanguage().equals(\"en\")));\n\nList<Locale>\
  \ englishLocales = englishAndOtherLocales.get(true);\n```\n\n***\n\n![图像](img/00005.jpeg)\
  \ 备注\n\n如果您调用 `groupingByConcurrent` 方法，将获得一个并发 map，当与并行流一起使用时，它是并发填充的。这与 `toConcurrentMap`\
  \ 方法完全对应。\n\n### 8.11 下游收集器\n\n`groupingBy` 方法产生一个值值为列表的 map。如果您想以某种方式处理这些列表，请提供一个*下游收集器*。例如，如果您想要集合而不是列表，可以使用在前节中见过的\
  \ `Collectors.toSet` 收集器：\n\n点击此处查看代码图像\n\n```java\nMap<String, Set<Locale>> countryToLocaleSet\
  \ = locales.collect(\n    Collectors.groupingBy(Locale::getCountry, toSet()));\n\
  ```\n\n***\n\n![图像](img/00005.jpeg) 备注\n\n在本示例以及本节的剩余示例中，我假设静态导入了 `java.util.stream.Collectors.*`\
  \ 以使表达式更易读。\n\n***\n\n提供了几个收集器用于将分组后的元素还原为数字：\n\n• `counting` 产生收集元素的计数。例如，\n\n\
  点击此处查看代码图像\n\n\n\n\n```java\nMap<String, Long> countryToLocaleCounts = locales.collect(\n\
  \    groupingBy(Locale::getCountry, counting()));\n```\n统计每个国家有多少个语言区域（locale）。\n\
  \n• `summing(`Int`|`Long`|`Double`)` 接收一个函数参数，将该函数应用于下游元素并产生它们的和。例如：\n\n点击此处查看代码图片\n\
  \n```java\nMap<String, Integer> stateToCityPopulation = cities.collect(\n    groupingBy(City::getState,\
  \ summingInt(City::getPopulation)));\n```\n在城市流中计算每个州的人口总。\n\n• `maxBy` 和 `minBy`\
  \ 接收一个比较器并产生下游元素的最大值和最小值。例如：\n\n点击此处查看代码图片\n\n```java\nMap<String, City> stateToLargestCity\
  \ = cities.collect(\n    groupingBy(City::getState,\n        maxBy(Comparator.comparing(City::getPopulation))));\n\
  ```\n产生每个州最大的城市。\n\n• `mapping` 将函数应用于下游结果，它需要另外一个收集器来处理其结果。例如：\n\n点击此处查看代码图片\n\n\
  ```java\nMap<String, Optional<String>> stateToLongestCityName = cities.collect(\n\
  \    groupingBy(City::getState,\n        mapping(City::getName,\n            maxBy(Comparator.comparing(String::length)))));\n\
  ```\n在这里，我们按州对城市分组。在每个州内部，我们产生城市的名称并按最大长度进行归约。\n\n`mapping` 方法还为前一节的问题提供了一个更好的解决方案——收集一个国家中所有语言的集合。\n\
  \n点击此处查看代码图片\n\n```java\nMap<String, Set<String>> countryToLanguages = locales.collect(\n\
  \    groupingBy(Locale::getDisplayCountry,\n        mapping(Locale::getDisplayLanguage,\n\
  \            toSet())));\n```\n在前一节中，我使用了 `toMap` 代替 `groupingBy`。在这种形式下，你不需要担心合并各个集合。\n\
  \n如果分组或映射函数的返回类型为 `int`、`long` 或 `double`，你可以将元素收集到摘要统计对象中，正如第 8.8 节“收集结果”所述，位于第\
  \ 259 页所示。例如：\n\n点击此处查看代码图片\n\n```java\nMap<String, IntSummaryStatistics> stateToCityPopulationSummary\
  \ = cities.collect(\n    groupingBy(City::getState,\n        summarizingInt(City::getPopulation)));\n\
  ```\n然后你可以从每个组的摘要统计对象中获取函数值的和、计数、平均值、最小值和最大值。\n\n***\n\n![图片](img/00005.jpeg) 注意\n\
  \n还有三个版本的 `reducing` 方法，用于应用通用归约，正如下一节所述。\n\n***\n\n组合收集器是强大的，但它可能导致非常复杂的表达式。最好的用法是结合\
  \ `groupingBy` 或 `partitioningBy` 来处理“下游” map 值。否则，只需直接在流上应用 `map`、`reduce`、`count`、`max`\
  \ 或 `min` 等方法。\n\n### 8.12 归约操作\n\n`reduce` 方法是一种从流中计算一个值的通用机制。最简单的形式接收一个二元函数并从前两个元素开始不断应用它。如果函数是求和，那么这很好解释：\n\
  \n点击此处查看代码图片\n\n```java\nList<Integer> values = ...;\nOptional<Integer> sum = values.stream().reduce((x,\
  \ y) -> x + y);\n```\n在这种情况下，`reduce` 方法计算 `υ[0]` + `υ[1]` + `υ[2]` + . . . ，其中\
  \ `υ[i]` 是流元素。该方法返回一个 `Optional`，因为如果流为空则没有有效结果。\n\n***\n\n![图片](img/00005.jpeg)\
  \ 注意\n\n在这种情况下，你可以写 `reduce(Integer::sum)` 代替 `reduce((x, y) -> x + y)`。\n\n***\n\
  \n通常来说，如果 `reduce` 方法有一个恒等值，那么元素的组合顺序并不重要。但该操作必须满足结合律。有很多满足结合律的操作，例如和、乘积、字符串拼接等。不满足结合律的操作是减法。例如，如果你有一个数字\
  \ `a, b, c` 的流，那么 `(a - b) - c` 不等于 `a - (b - c)`。\n\n在这种情况下，你可以写 `reduce(identity,\
  \ (x, y) -> x - y)` 代替 `reduce((x, y) -> x - y)`。如果流为空，则返回恒等值。\n\n\n\n到目前为止，我们把整数收集在\
  \ `Stream<Integer>` 中，尽管将每个整数封装成包装对象显然是低效的。对于其他原始类型 `double`、`float`、`long`、`short`、`char`、`byte`\
  \ 和 `boolean` 也是如此。流库提供了专门类型 `IntStream`、`LongStream` 和 `DoubleStream` 直接存储原始值而不使用包装类。如果你想存储\
  \ `short`、`char`、`byte` 和 `boolean`，请使用 `IntStream`；对于 `float`，使用 `DoubleStream`。\n\
  \n要创建一个 `IntStream`，调用 `IntStream.of` 和 `Arrays.stream` 方法：\n\n点击此处查看代码图片\n\n```java\n\
  IntStream stream = IntStream.of(1, 1, 2, 3, 5);\nstream = Arrays.stream(values,\
  \ from, to); // values 是 int[] 数组\n```\n\n与对象流一样，你也可以使用静态方法 `generate` 和 `iterate`。此外，`IntStream`\
  \ 和 `LongStream` 具有静态方法 `range` 和 `rangeClosed`，用于生成步长一的整数范围：\n\n点击此处查看代码图片\n\n\
  ```java\nIntStream zeroToNinetyNine = IntStream.range(0, 100); // 排除上界\nIntStream\
  \ zeroToHundred = IntStream.rangeClosed(0, 100); // 包含上界\n```\n\n`CharSequence`\
  \ 接口拥有 `codePoints` 和 `chars` 方法，可以产生产生字符 Unicode 编码或 UTF-16 编码中代码单元的 `IntStream`。（详细细节请参见\
  \ 第 1 章）。\n\n点击此处查看代码图片\n\n```java\nString sentence = \"\\uD835\\uDD46 is the set\
  \ of octonions.\";\n// \\uD835\\uDD46 是字母 ![Image](img/0005.jpeg) 的 UTF-16 编码，unicode\
  \ U+1D546\nIntStream codes = sentence.codePoints();\n// 带有十六进制 1D546 20 69 73 20\
  \ ... 的流\n```\n\n当你拥有一个对象流时，可以使用 `mapToInt`、`mapToLong` 或 `mapToDouble` 方法将其转换为原始类型流。例如，如果你有一个字符串流并想以整数形式处理它们的长度，你完全可以直接在\
  \ `IntStream` 中进行：\n\n点击此处查看代码图片\n\n```java\nStream<String> words = ...;\nIntStream\
  \ lengths = words.mapToInt(String::length);\n```\n\n要将原始类型流转换为对象流，请使用 `boxed` 方法：\n\
  \n点击此处查看代码图片\n\n```java\nStream<Integer> integers = IntStream.range(0, 100).boxed();\n\
  ```\n\n通常，原始类型流上的方法与对象流上的方法类似。以下是最显著的区别：\n\n- `toArray` 方法返回原始类型数组。\n- 产生可选结果的方法返回\
  \ `OptionalInt`、`OptionalLong` 或 `OptionalDouble`。这些类类似于 `Optional` 类，但它们拥有 `getAsInt`、`getAsLong`\
  \ 和 `getAsDouble` 方法，而不是 `get` 方法。\n- 存在 `sum`、`average`、`max` 和 `min` 方法，分别返回总和、平均值、最大值最小值。这些方法在对象流中没有定义。\n\
  - `summaryStatistics` 方法产生 `IntSummaryStatistics`、`LongSummaryStatistics` 或 `DoubleSummaryStatistics`\
  \ 类型的对象，可以同时报告流的总和、平均值、最大值最小值。\n\n***\n\n![Image](img/00005.jpeg) 注意\n\n`Random`\
  \ 类拥有 `ints`、`longs` 和 `doubles` 方法，返回随机数的原始类型流。\n\n***\n\n### 8.14 并行流\n\n流使得批量操作并行化变得简单。这个过程大部分是自动的，但你需要遵循几条规则。首先，你必须有一个并行流。你可以通过\
  \ `Collection.parallelStream()` 方法从任何集合获取并行流：\n\n点击此处查看代码图片\n\n```java\nStream<String>\
  \ parallelWords = words.parallelStream();\n```\n\n此外，`parallel` 方法可以将任何顺序流转换为并行流。\n\
  \n点击此处查看代码图片\n\n```java\nStream<String> parallelWords = Stream.of(wordArray).parallel();\n\
  ```\n\n只要在执行终端方法时流处于并行模式，所有的中间流操作都将是并行化的。\n\n当流操作以并行方式运行时，其意图是返回与串行执行时相同的的结果。确保操作是*无状态的*且可以按任意顺序执行是非常重要的。\n\
  \n假设你想在流中统计所有字符串，这里有一个无法实现的示例（part0031_split_078.html_p268pro0a）：这是一个经典的竞态条件。如果你多次运行此程序，可能会得到不同的结果。你有责任确保传递给并行的函数是安全的。实现该点的最佳方法是使用并发\
  \ map。\n\n点击此处查看代码图片\n\n```java\nint[] shortWords = new int[12];\nwords.parallelStream().forEach(s\
  \ -> {\n    if (s.length() < 12) shortWords[s.length()]++;\n});\nSystem.out.println(Arrays.toString(shortWords));\n\
  ```\n\n默认情况下，来自有序集合（数组和列表）、范围、迭代器或调用 `Stream.sorted` 的流是*有序的*。结果按元素顺序积累，且完全可预测的。如果你运行相同的操作，将得到完全相同。\n\
  \n排序并不排除高效并行化。例如，在计算 `stream.map(fun)` 时，流可以被分成 *n* 个段，每段并发处理。然后按顺序重组。\n\n当放弃排序要求时，某些操作可以更有效地并行化。通过调用\
  \ `Stream.unordered` 方法，你表示对顺序不感兴趣。一个可以从中受益的操作是 `distinct`。在有序流上，`distinct` 保留相等元素的第一个。这阻碍了并行化——处理某个段的线程在前面的段处理之前不知道丢弃哪些元素。如果可以保留*任何*唯一元素，所有段都可以并发处理（使用共享集合来跟踪重复）。\n\
  \n你也可以通过放弃排序来加速 `limit` 方法。如果你只需要流中的 `n` 个元素且不在乎得到的是哪些，请调用\n\n点击此处查看代码图片\n\n```java\n\
  Stream<String> sample = words.parallelStream().unordered().limit(n);\n```\n\n正如\
  \ 8.9 节所示，“收集到 Map](part0015.html_ch08lev1sec9)”位于第 260 页，合并 map 是昂贵的。因此，`Collectors.groupingByConcurrent`\
  \ 方法使用共享并发 map。为了从并行中受益，map 值的顺序将与流顺序不同。\n\n点击此处查看代码图片\n\n```java\nMap<Integer,\
  \ List<String>> result = words.parallelStream().collect(\n    groupingByConcurrent(String::length));\n\
  ```\n\n当然，如果你使用一个独立于顺序的下游收集器，你将关心，例如\n\n\n\n\n\n点击此处查看代码图像\n\n```java\nMap<Integer,\
  \ Long> wordCounts =\n    words.parallelStream()\n        .collect(\n          \
  \  groupingByConcurrent(\n                String::length,\n                counting()));\n\
  ```\n\n***\n\n![Image](img/00009.jpeg) 注意\n\n在执行流操作时，不要修改作为流支持基础的集合（即使该修改是线程安全的），这一点非常重要。请记住，流不会将数据收集到自身中——这些数据始终存储在单独的集合中。如果你修改了该集合，流操作的结果将是未定义的。JDK\
  \ 文档将这一要求称为 `noninterference`（非干涉性）。它同时适用于顺序流和并行流。\n\n确切地说，由于中间流操作是惰性的，在执行终端操作之前，完全可以修改该集合。例如，下面的代码虽然绝对不推荐，但是可以运行的：\n\
  \n点击此处查看代码图像\n\n```java\nList<String> wordList = ...;\nStream<String> words = wordList.stream();\n\
  wordList.add(\"END\");\nlong n = words.distinct().count();\n```\n\n但这段代码是错误的：\n\n\
  点击此处查看代码图像\n\n```java\nStream<String> words = wordList.stream();\nwords.forEach(s\
  \ -> if (s.length() < 12) wordList.remove(s));\n// 错误—干涉 (interference)\n```\n\n\
  ***\n\n## 练习题\n\n**1.** 验证请求前五个长单词是否在找到第五个长单词后，不会再次调用 `filter` 方法。只需记录每次方法调用即可。\n\
  \n**2.** 测量使用 `parallelStream` 代替 `stream` 统计长单词的差异。在调用前后分别调用 `System.currentTimeMillis()`\
  \ 并打印差值。如果你的电脑运行很快，请切换到更大的文档（例如*战争与和平*）。\n\n**3.** 假设你有一个数组 `int[] values = { 1,\
  \ 4, 9, 16 }`。`Stream.of(values)` 是什么？如何获取一个 `int` 的流呢？\n\n**4.** 使用 `Stream.iterate`\
  \ 创建一个无限随机数流——不要通过调用 `Math.random`，而是直接实现一个*线性线性生成器*。在这样的生成器中，你从 `x[0] = seed` 开始，然后对于适当的\
  \ `a`、`c` 和 `m`，产生 `x[n + 1] = (a * x[n] + c) % m`。你应该实现一个参数为 `a`、`c`、`m` 和 `seed`\
  \ 的方法，返回一个 `Stream<Long>`。尝试 `a = 25214903917`、`c = 11` 和 `m = 2⁴⁸`。\n\n**5.** 8.3\
  \ 节 中的“`filter`、`map` 和 `flatMap` 方法”位于第 252 页的 `letters` 方法有点笨拙，它先填充一个列表然后转换为流。改写一个基于流的单行代码。使用合适的\
  \ lambda 表达式将从 `0` 到 `s.length() - 1` 的 `int` 值流进行映射。\n\n**6.** 使用 `String.codePoints`\
  \ 方法实现一个方法，测试字符串是否为仅由字母组成的单词。（提示：使用 `Character.isAlphabetic`。）使用相同的方法，实现一个方法来测试字符串是否为有效的\
  \ Java 标识符。\n\n**7.** 将文件转换为令牌流，列出前 100 个符合前一个练习意义的单词令牌。再次读取文件，并列出出现频率最高的 10 个单词（不区分大小写）。\n\
  \n**8.** 将 `/usr/share/dict/words`（或类似的单词列表）中的单词读入流中，并产生所有包含五个不同元音的单词数组。\n\n**9.**\
  \ 给定有限的字符串流，找到平均字符串长度。\n\n**10.** 给定有限的字符串流，找到所有最大长度的字符串。\n\n**11.** 你的经理让你写一个方法\
  \ `public static <T> boolean isFinite(Stream<T> stream)`。为什么这不是个好主意？尽管写写看。\n\n**12.**\
  \ 写一个方法 `public static <T> Stream<T> zip(Stream<T> first, Stream<T> second)`，交替来自\
  \ `first` 流和 `second` 流的元素（如果轮到的某个流已用完元素，则返回 `null`）。\n\n**13.** 将 `Stream<ArrayList<T>>`\
  \ 中的所有元素合并为一个 `ArrayList<T>`。展示如何使用 `reduce` 的三种形式来实现。\n\n**14.** 写一个 `reduce` 的调用，用于计算\
  \ `Stream<Double>` 的平均值。为什么你不能简单地计算和并除以 `count()`？\n\n**15.** 使用 `BigInteger` 的并行流和\
  \ `BigInteger.isProbablePrime` 方法找到 500 个具有 50 位小数的质数。这比使用顺序流更快吗？\n\n**16.** 使用并行流在《战争与和平》中找到最长的\
  \ 500 个字符串。这比使用顺序流更快吗？\n\n**17.** 你如何从流中消除相邻的重复元素？如果流是并行的，你的方法有效吗？\n\n## 第 9 章 处理输入和输出\n\
  \n**本章主题**\n\n![Image](img/00004.jpeg) 9.1 输入/输出流、读者和写入器\n\n![Image](img/00004.jpeg)\
  \ 9.2 路径、文件和目录\n\n![Image](img/00004.jpeg) 9.3 URL\n\n![Image](img/00004.jpeg) 9.4\
  \ 正正则表达式\n\n![Image](img/00004.jpeg) 9.5 序列化\n\n![Image](img/00004.jpeg) 9.6 练习题\n\
  \n在本章中，你将学习如何处理文件、目录和网页，以及如何以二进制和文本格式读写数据。你还将发现关于正则表达式的讨论，这可能非常有用（我没能找到更适合讨论这个话题的地方，显然\
  \ Java 开发者们也是如此）。最后，本章将向你展示序列化机制，它可以让你像存储文本一样方便地存储对象。\n\n本章的关键点是：\n\n输入流是字节源，输出流是字节终点。使用读者和写入器处理字符。务必指定字符编码。`Files`\
  \ 类提供了读取文件所有字节或行的便利方法。`DataInput` 和 `DataOutput` 接口具有写入二进制格式数字的方法。对于随机访问，使用 `RandomAccessFile`\
  \ 或内存映射文件。`Path` 是文件系统中绝对或相对路径组件的序列。路径可以组合（或“解析”）。使用 `Files` 类的方法复制、移动或删除文件，并递归遍历目录树。要读取或更新\
  \ ZIP 文件，使用 ZIP 文件系统。\n\n9.1.1 获取流\n\n从文件获取流最简单的方法是使用静态方法\n\n\n\n\n\n```java\nInputStream\
  \ in = Files.newInputStream(path);\nOutputStream out = Files.newOutputStream(path);\n\
  ```\n在这里，`path` 是 `Path` 类的一个实例，该类涵盖于第 9.2.1 节“Paths”，位于第 284 页。它描述了文件系统中的路径。\n\n\
  如果你有一个 `URL`，可以从 `URL` 类 `openStream` 方法返回的输入流中读取其内容：\n\n点击此处查看代码\n\n```java\nURL\
  \ url = new URL(\"http://horstmann.com/index.html\");\nInputStream in = url.openStream();\n\
  ```\n\n第 9.3 节“URL Connections”位于第 292 页，展示了如何向 `URL` 写入数据。\n\n`ByteArrayInputStream`\
  \ 类允许你从字节数组中读取。\n\n点击此处查看代码\n\n```java\nbyte[] bytes = ...;\nInputStream in = new\
  \ ByteArrayInputStream(bytes);\n```\n\n相反，要将输出发送到字节数组，请使用 `ByteArrayOutputStream`：\n\
  \n点击此处查看代码\n\n```java\nByteArrayOutputStream out = new ByteArrayOutputStream();\n\
  // 写入 out\nbyte[] bytes = out.toByteArray();\n```\n\n### 9.1.2 读取字节\n\n`InputStream`\
  \ 类有一个方法可以读取单个字节：\n\n```java\nInputStream in = ...;\nint b = in.read();\n```\n\n\
  该方法要么返回 `0` 到 `255` 之间的整数形式的该字节，要么在到达输入末尾时返回 `-1`。\n\n***\n\n![图像](img/00009.jpeg)\
  \ 注意\n\nJava 的 `byte` 类型值范围在 `-128` 到 `127` 之间。你可以在检查出它不为 `-1` *之后* 将返回的值强制转换为 `byte`。\n\
  \n***\n\n更常见的是，你可能想要批量读取字节。有两种方法可以将从输入流中的字节放入数组中。这两种方法都会读取，直到数组或指定的范围被填满，或者没有更多输入可用，并返回实际读取的字节数。如果完全没有可用输入，这些方法将返回\
  \ `-1`。\n\n点击此处查看代码\n\n```java\nbyte[] bytes = ...;\nactualBytesRead = in.read(bytes);\n\
  actualBytesRead = in.read(bytes, start, length);\n```\n\nJava 库没有从输入流中读取所有字节的方法。这里是实现此点的一种方法：\n\
  \n点击此处查看代码\n\n```java\npublic static byte[] readAllBytes(InputStream in) throws\
  \ IOException {\n    ByteArrayOutputStream out = new ByteArrayOutputStream();\n\
  \    copy(in, out);\n    out.close();\n    return out.toByteArray();\n}\n```\n\n\
  请参见下一节获取 `copy` 辅助方法。\n\n***\n\n![图像](img/00013.jpeg) 提示\n\n如果你想从文件中读取所有字节，请调用便利方法\n\
  \n点击此处查看代码\n\n```java\nbyte[] bytes = Files.readAllBytes(path);\n```\n\n***\n\n\
  ### 9.1.3 写入字节\n\n`OutputStream` 的 `write` 方法可以写入单个字节和字节数组。\n\n点击此处查看代码\n\n```java\n\
  OutputStream out = ...;\nint b = ...;\nout.write(b);\nbyte[] bytes = ...;\nout.write(bytes);\n\
  out.write(bytes, start, length);\n```\n\n当你完成流的写入后，必须*关闭* 它以提交任何缓冲输出。这最好使用 `try-with-resources`\
  \ 语句来完成：\n\n点击此处查看代码\n\n```java\ntry (OutputStream out = ...) {\n    out.write(bytes);\n\
  }\n```\n\n如果你需要将输入流复制到输出流，请使用此辅助方法：\n\n点击此处查看代码\n\n```java\npublic static void copy(InputStream\
  \ in, OutputStream out) throws IOException {\n    final int BLOCKSIZE = 1024;\n\
  \    byte[] bytes = new byte[BLOCKSIZE];\n    int len;\n    while ((len = in.read(bytes))\
  \ != -1) {\n        out.write(bytes, 0, len);\n    }\n}\n```\n\n### 9.1.4 编码\n\n\
  要将 `InputStream` 保存到文件，调用 点击此处查看代码：\n\n```java\nFiles.copy(in, path, StandardCopyOption.REPLACE_EXISTING);\n\
  ```\n\nJava `byte` 类型值范围在 `-128` 到 `127` 之间。你可以在检查出它不为 `-1` *之后* 将返回的值强制转换为 `byte`。\n\
  \nJava 库没有从输入流中读取所有字节的方法。这里是实现此点的一种方法：\n\n```java\npublic static byte[] readAllBytes(InputStream\
  \ in) throws IOException {\n    ByteArrayOutputStream out = new ByteArrayOutputStream();\n\
  \    copy(in, out);\n    out.close();\n    return out.toByteArray();\n}\n```\n\n\
  没有可靠的方法从字节流中自动检测字符编码。某些 API 允许使用“默认字符集”—即操作系统偏好的字符编码。因此，你应该始终指定编码。例如，在读取网页时，检查 `Content-Type`\
  \ 头部。\n\n除了 UTF 编码外，还有适用于特定字符范围的部分编码。例如，ISO 8859-1 是包含西欧语言字符的单字节编码。Shift-JIS 是日语字符的可变长度编码。许多此类编码仍在使用中。\n\
  \nUnicode 标准允许这样做，甚至建议删除输入中发现的任何领先 `\\uFEFF`。最常见的编码是 UTF-8，它将每个字符编码为一到四个字节。\n\n\
  某些程序（包括记事本）会在 UTF-8 文件的开头添加字节序标记。显然，这是没有的，因为 UTF-8 没有排序问题。\n\n\n\n\n\n点击此处查看代码图像\n\
  \n```java\nCharset shiftJIS = Charset.forName(\"Shift-JIS\");\n```\n\n在读取或写入文本时使用\
  \ `Charset` 对象。例如，你可以将字节数组转换为字符串，如\n\n点击此处查看代码图像\n\n```java\nString str = new String(bytes,\
  \ StandardCharsets.UTF_8);\n```\n\n***\n\n![Image](img/00013.jpeg) 提示\n\n某些方法允许你通过\
  \ `Charset` 对象或字符串来指定字符编码。选择 `StandardCharsets` 常量，这样你就不需要担心拼写是否正确。例如，`new String(bytes,\
  \ \"UTF 8\")` 是不可接受的，会导致运行时错误。\n\n***\n\n***\n\n![Image](img/00009.jpeg) 注意\n\n\
  某些方法（例如 `String(byte[])` 构造函数）在你没有指定任何编码时会使用默认平台编码；而其他方法（例如 `Files.readAllLines`）使用\
  \ UTF-8。\n\n***\n\n### 9.1.5 文本输入\n\n要读取文本输入，请使用 `Reader`。你可以通过 `InputStreamReader`\
  \ 适配器从任何输入流获取 `Reader`：\n\n点击此处查看代码图像\n\n```java\nInputStream inStream = ...;\n\
  Reader in = new InputStreamReader(inStream, charset);\n```\n\n如果你想一次处理一个 UTF-16\
  \ 代码单元的输入，可以调用 `read` 方法：\n\n```java\nint ch = in.read();\n```\n\n该方法返回一个 `0` 到\
  \ `65536` 之间的代码单元，或者在输入结束时返回 `-1`。\n\n这并不十分方便。这里有几种替代方案。\n\n对于短文本文件，你可以这样将其读入字符串：\n\
  \n点击此处查看代码图像\n\n```java\nString content = new String(Files.readAllBytes(path), charset);\n\
  ```\n\n但如果你想将文件作为行序列，请调用\n\n点击此处查看代码图像\n\n```java\nList<String> lines = Files.readAllLines(path,\
  \ charset);\n```\n\n或者更好的方法是将其作为 `Stream` 进行懒性加载处理：\n\n点击此处查看代码图像\n\n```java\ntry\
  \ (Stream<String> lines = Files.lines(path, charset)) {\n    ...\n}\n```\n\n***\n\
  \n![Image](img/00005.jpeg) 注意\n\n如果流在获取行时发生 `IOException`，该异常将被封装成 `UncheckedIOException`\
  \ 并从流操作中抛出。（这种权宜之计是必要的，因为流操作没有声明抛出任何受检异常。）\n\n***\n\n要要从文件中读取数字或单词，请使用 `Scanner`，正如你在第\
  \ 1 章中看到的那样。例如，\n\n点击此处查看代码图像\n\n```java\nScanner in = new Scanner(path, \"UTF-8\"\
  );\nwhile (in.hasNextDouble()) {\n    double value = in.nextDouble();\n    ...\n\
  }\n```\n\n***\n\n![Image](img/00013.jpeg) 提示\n\n要读取字母单词，请将扫描器的分隔符设置为正则表达式，该正则是你想要接受的标记的补集。例如，在调用\n\
  \n```java\nin.useDelimiter(\"\\\\PL+\");\n```\n后，扫描器将读取字母，因为任何非字母序列都是分隔符。请参见第 293\
  \ 页的 9.4.1 节“正则表达式语法”，以了解正则表达式的语法。\n\n***\n\n如果你的输入不是来自文件，请将 `InputStream` 封装为 `BufferedReader`：\n\
  \n点击此处查看代码图像\n\n```java\ntry (BufferedReader reader = new BufferedReader(new InputStreamReader(url.openStream())))\
  \ {\n    Stream<String> lines = reader.lines();\n    ...\n}\n```\n\n`BufferedReader`\
  \ 为了效率会分块读取输入。（奇怪的是，基础读取器没有这个选项。）它有 `readLine` 方法来读取单行，以及 `lines` 方法来产生行流。\n\n如果某个方法要求\
  \ `Reader` 而你想让它从文件读取，请调用 `Files.newBufferedReader(path, charset)`。\n\n### 9.1.6\
  \ 文本输出\n\n要写入文本，请使用 `Writer`。通过 `write` 方法，你可以写入字符串。你可以将任何输出流转换为 `Writer`：\n\n点击此处查看代码图像\n\
  \n```java\nOutputStream outStream = ...;\nWriter out = new OutputStreamWriter(outStream,\
  \ charset);\n```\n\n*(注：由于提供的原文后半部分存在大量重复的乱码，此处已根据逻辑进行了清理，仅翻译了核心内容)*\n\n\n\n\n\n\
  点击此处查看代码图片\n\n```java\nDataInput in = new DataInputStream(Files.newInputStream(path));\n\
  DataOutput out = new DataOutputStream(Files.newOutputStream(path));\n```\n\n####\
  \ 9.1.8 随机访问文件 (Random-Access Files)\n\n`RandomAccessFile` 类允许你在文件的任何位置读取或写入数据。你可以以只读模式或读写双向模式打开随机访问文件；通过在构造函数中使用字符串\
  \ `\"r\"`（表示读访问）或 `\"rw\"`（表示读/写访问）作为第二个参数来指定该选项。例如，\n\n点击此处查看代码图片\n\n```java\n\
  RandomAccessFile file = new RandomAccessFile(path.toString(), \"rw\");\n```\n\n\
  随机访问文件拥有一个 `file pointer`（文件指针），用于指示下一个要读取或写入的字节的位置。`seek` 方法将文件指针设置为文件内的任意字节位置。`seek`\
  \ 的参数是一个位于零到文件长度之间的长型整数（你可以通过 `length` 方法获取该长度）。`getFilePointer` 方法返回文件指针的当前位置。\n\
  \n`RandomAccessFile` 类实现了 `DataInput` 和 `DataOutput` 接口。要从随机访问文件中读取和写入数字，请使用你在上一节中看到过的\
  \ `readInt`/`writeInt` 等方法。例如，\n\n点击此处查看代码图片\n\n```java\nint value = file.readInt();\n\
  file.seek(file.getFilePointer() - 4);\nfile.writeInt(value + 1);\n```\n\n#### 9.1.9\
  \ 内存映射文件 (Memory-Mapped Files)\n\n内存映射文件提供了另一种非常高效的随机访问方式，非常适用于大文件。然而，其数据访问的 API\
  \ 与输入/输出流完全不同。首先，获取一个文件的 `channel`：\n\n点击此处查看代码图片\n\n```java\nFileChannel channel\
  \ = FileChannel.open(path,\n    StandardOpenOption.READ, StandardOpenOption.WRITE)\n\
  ```\n\n然后，将文件的一个区域（如果文件太大，则是整个文件）映射到内存中：\n\n点击此处查看代码图片\n\n```java\nByteBuffer buffer\
  \ = channel.map(FileChannel.MapMode.READ_WRITE,\n    0, channel.size());\n```\n\n\
  使用 `get`、`getInt`、`getDouble` 等方法读取值，并使用相应的 `put` 方法写入值。\n\n点击此处查看代码图片\n\n```java\n\
  int offset = ...;\nint value = buffer.getInt(offset);\nbuffer.put(offset, value\
  \ + 1);\n```\n\n在某个时刻，特别是当通道关闭时，这些更改会被写回文件。\n\n***\n\n![Image](img/00005.jpeg) 注意\n\
  \n默认情况下，读取和写入数字的方法使用大端（big-endian）字节序。你可以通过以下命令更改字节序：\n\n点击此处查看代码图片\n\n```java\n\
  buffer.order(ByteOrder.LITTLE_ENDIAN);\n```\n\n***\n\n#### 9.1.10 文件锁 (File Locking)\n\
  \n当多个同时执行的程序修改同一个文件时，它们需要进行通信。文件锁可以解决这个问题。当多个同时执行的程序修改同一个文件，它们需要以某种方式通信。文件锁可以解决这个问题。当多个同时执行的程序修改同一个文件，它们需要以某种方式通信。文件锁可以解决这个问题。为了锁定文件，调用\
  \ `FileChannel` 的 `lock` 或 `tryLock` 方法。\n\n```java\nFileChannel channel = FileChannel.open(path);\n\
  ```\n\n当通道关闭时，锁会被释放。最好的做法是使用 try-with-resources 语句：\n\n```java\ntry (FileLock lock\
  \ = channel.lock()) {\n    ...\n}\n```\n\n### 9.2 路径、文件与目录 (Paths, Files, and Directories)\n\
  \n你已经见过用于指定路径的 `Path` 对象。在接下来的章节中，你将学习如何操作这些对象以及处理文件和目录。\n\n#### 9.2.1 路径 (Paths)\n\
  \n`Path` 是一个名称序列，可选的根目录（如 `/` 或 `C:\\`）。`Path` 对象并不一定对应于存在的文件。我们经常需要组合路径。`p.resolve(q)`\
  \ 根据以下规则返回路径：\n\n- 如果 `q` 是绝对路径，则结果为 `q`。\n- 否则，结果为 `p` 然后 `q`。\n\n例如，假设你的应用程序需要相对于主目录找到配置文件。这里你可以如何组合路径：\n\
  \n```java\nPath workPath = homeDirectory.resolve(\"myapp/work\");\n```\n\n有一个便利方法\
  \ `resolveSibling`，针对路径的父目录解析兄弟路径。例如，如果 `workPath` 是 `/home/cay/myapp/work`，调用\n\
  \n```java\nPath tempPath = workPath.resolveSibling(\"temp\");\n```\n\n产生 `/home/cay/myapp/temp`。\n\
  \n`resolve` 的反操作是 `relativize`。`p.relativize(r)` 返回路径 `q`，当其与 `p` 解析时，产生 `r`。例如，\n\
  \n```java\nPaths.get(\"/home/cay\").relativize(Paths.get(\"/home/fred/myapp\"))\n\
  ```\n\n产生 `../fred/myapp`，假设我们的文件系统使用 `..` 表示父目录。\n\n`normalize` 方法移除任何冗余的 `.` 和\
  \ `..` 组件（或文件系统认为冗余的组件）。例如，规范化路径 `/home/cay/../fred/./myapp` 得到 `/home/fred/myapp`。\n\
  \n`toAbsolutePath` 方法产生给定路径的绝对路径。如果路径不是绝对路径，它将相对于用户目录（即调用 JVM 的目录）进行解析。例如，如果你从 `/home/cay/myapp`\
  \ 启动程序，那么 `Paths.get(\"config\").toAbsolutePath()` 返回 `/home/cay/myapp/config`。\n\
  \n\n\n\n\n`Path` 接口提供了拆分路径以及将其与其他路径合并的方法。此代码示例展示了一些最实用的方法：\n\n点击此处查看代码图像\n\n```\n\
  Path p = Paths.get(\"/home\", \"cay\", \"myapp.properties\");\n\nPath parent = p.getParent();\
  \ // 路径 /home/cay\n\nPath file = p.getFileName(); // 最后一个元素，myapp.properties\n\n\
  Path root = p.getRoot(); // 初始段 /（对于相对路径为 null）\n\nPath first = p.getName(0); //\
  \ 第一个元素\n\nPath dir = p.subpath(1, p.getNameCount());\n// 除第一个元素以外的所有，cay/myapp.properties\n\
  ```\n\n`Path` 接口继承了 `Iterable<Path>` ，因此你可以使用增强型 `for` 循环遍历 `Path` 的名称组件：\n\n```java\n\
  for (Path component : path) {\n    ...\n}\n```\n\n![Image](img/00005.jpeg) 备注\n\n\
  偶尔，你可能需要与使用 `File` 类而非 `Path` 接口的旧版 API 交互。`Path` 接口有一个 `toFile` 方法，而 `File` 类有一个\
  \ `toPath` 方法。\n\n### 9.2.2 创建文件和目录\n\n要创建一个新目录，调用：\n\n```\nFiles.createDirectory(path);\n\
  ```\n\n路径中除最后一个组件以外的所有部分必须已经存在。要同时创建中间目录，请使用：\n\n点击此处查看代码图像\n\n```\nFiles.createDirectories(path);\n\
  ```\n\n你可以使用以下方法创建一个空文件：\n\n```\nFiles.createFile(path);\n```\n\n如果文件已存在，该调用将抛出异常。存在性检查和创建过程是原子的。如果文件不存在，它会在其他人有机会执行相同操作之前被创建。\n\
  \n调用 `Files.exists(path)` 检查给定的文件或目录是否存在。要测试它是一个目录还是一个“普通”文件（即包含数据的文件，而不是目录或符号链接等），请调用\
  \ `Files` 类的静态方法 `isDirectory` 和 `isRegularFile`。\n\n提供了方便的方法，可以在给定或系统特定的位置创建临时文件或目录。\n\
  \n点击此处查看代码图像\n\n```\nPath tempFile = Files.createTempFile(dir, prefix, suffix);\n\
  \nPath tempFile = Files.createTempFile(prefix, suffix);\n\nPath tempDir = Files.createTempDirectory(dir,\
  \ prefix);\n\nPath tempDir = Files.createTempDirectory(prefix);\n```\n\n在这里，`dir`\
  \ 是一个 `Path`，而 `prefix`/`suffix` 是可能为 null 的字符串。例如，调用 `Files.createTempFile(null,\
  \ \".txt\")` 可能会返回类似 `/tmp/1234405522364837194.txt` 的路径。\n\n### 9.2.3 复制、移动和删除文件\n\
  \n将文件从一个位置复制到另一个位置，只需调用：\n\n```\nFiles.copy(fromPath, toPath);\n```\n\n要移动文件（即复制并删除原始文件），调用：\n\
  \n```\nFiles.move(fromPath, toPath);\n```\n\n你也可以使用此命令移动空目录。\n\n如果目标存在，则复制或移动将失败。如果你想覆盖现有目标，请使用\
  \ `REPLACE_EXISTING` 选项。如果你想复制所有文件属性，请使用 `COPY_ATTRIBUTES` 选项。你可以这样同时提供两者：\n\n点击此处查看代码图像\n\
  \n```\nFiles.copy(fromPath, toPath, StandardCopyOption.REPLACE_EXISTING,\n    StandardCopyOption.COPY_ATTRIBUTES);\n\
  ```\n\n你可以指定移动应该是原子的。这样你就能确保要么移动成功完成，要么源文件继续存在。使用 `ATOMIC_MOVE` 选项：\n\n点击此处查看代码图像\n\
  \n```\nFiles.move(fromPath, toPath, StandardCopyOption.ATOMIC_MOVE);\n```\n\n请参见表\
  \ 9–3 以了解文件操作可用的选项摘要。\n\n![Image](img/00053.jpeg)\n\n**表 9–3** 文件操作的标准选项\n\n最后，要删除文件，只需调用：\n\
  \n```\nFiles.delete(path);\n```\n\n如果文件不存在，此方法将抛出异常，因此你可能更想使用：\n\n点击此处查看代码图像\n\n\
  ```java\nboolean deleted = Files.deleteIfExists(path);\n```\n\n删除方法也可以用于删除空目录。\n\
  \n### 9.2.4 访问目录条目\n\n静态方法 `Files.list` 返回一个读取目录条目的 `Stream<Path>`。目录是延迟读取的，这使得高效处理包含大量条目的目录成为可能。\n\
  \n由于读取目录涉及需要关闭的系统资源，你应该使用 `try` 块：\n\n点击此处查看代码图像\n\n```java\ntry (Stream<Path> entries\
  \ = Files.list(dir)) {\n    ...\n}\n```\n\n`list` 方法不会进入子目录。要处理目录的所有后代，请使用 `Files.walk`\
  \ 方法。\n\n点击此处查看代码图像\n\n```java\ntry (Stream<Path> entries = Files.walk(root)) {\n\
  \    ...\n}\n```\n\n正如你所看到的，每当 `walk` 产生目录时，它会被进入。你可以通过调用 `Files.walk(root, depth)`\
  \ 来限制要遍历的深度。所有 `walk` 方法都有 `FileOption` 参数，你可以提供 `FOLLOW_LINKS` 来跟随符号链接。\n\n![Image](img/00005.jpeg)\
  \ 备注\n\n如果你对 `walk` 返回的路径的过滤标准涉及目录的属性（例如大小、创建时间或类型：文件、目录、符号链接），请使用 `find` 方法代替 `walk`。该方法的优势是效率高。由于正在读取目录，属性是直接可用的。\n\
  \n此代码片段使用 `Files.walk` 将一个目录复制到另一个目录：\n\n点击此处查看代码图像\n\n```java\nFiles.walk(source).forEach(p\
  \ -> {\n    try {\n        Path q = target.resolve(source.relativize(p));\n    \
  \    if (Files.isDirectory(p)) {\n            Files.createDirectory(q);\n      \
  \  } else {\n            Files.copy(p, q);\n        }\n    } catch (IOException\
  \ ex) {\n        throw new UncheckedIOException(ex);\n    }\n});\n```\n\n遗憾的是，你无法轻松使用\
  \ `Files.walk` 方法删除目录树，因为你需要先访问子目录再删除父目录。在这种情况下，请使用 `walkFileTree` 方法。它需要 `FileVisitor`\
  \ 接口的实例。以下是文件通知的地方：\n\n1. 在处理目录之前：\n\n点击此处查看代码图像\n\n```java\nFileVisitResult preVisitDirectory(T\
  \ dir, IOException ex)\n```\n\n2. 当遇到文件或目录时：\n\n点击此处查看代码图像\n\n```java\nFileVisitResult\
  \ visitFile(T path, BasicFileAttributes attrs)\n```\n\n3. 当 `visitFile` 方法中发生异常时：\n\
  \n点击此处查看代码图像\n\n```java\nFileVisitResult visitFileFailed(T path, IOException ex)\n\
  ```\n\n4. 在处理目录之后：\n\n点击此处查看代码图像\n\n```java\nFileVisitResult postVisitDirectory(T\
  \ dir, IOException ex)\n```\n\n\n\n\n在每种情况下，通知方法都会返回以下结果之一：\n\n*   继续访问下一个文件：`FileVisitResult.CONTINUE`\n\
  *   继续遍历，但不访问该目录下的条目：`FileVisitResult.SKIP_SUBTREE`\n*   继续遍历，但不访问该文件的兄弟级文件：`FileVisitResult.SKIP_SIBLINGS`\n\
  *   终止遍历：`FileVisitResult.TERMINATE`\n\n如果任何方法抛出异常，遍历也将终止，该异常将从 `walkFileTree` 方法抛出。\n\
  \n`SimpleFileVisitor` 类实现了此接口，在每个点继续迭代并重新抛出任何异常。\n\n以下是你可以删除目录树的方法：\n\n点击此处查看代码图片\n\
  \n```java\nFiles.walkFileTree(root, new SimpleFileVisitor<Path>() {\n    public\
  \ FileVisitResult visitFile(Path file,\n            BasicFileAttributes attrs) throws\
  \ IOException {\n        Files.delete(file);\n        return FileVisitResult.CONTINUE;\n\
  \    }\n    public FileVisitResult postVisitDirectory(Path dir,\n            IOException\
  \ ex) throws IOException {\n        if (ex != null) throw ex;\n        Files.delete(dir);\n\
  \        return FileVisitResult.CONTINUE;\n    }\n});\n```\n\n### 9.2.5 ZIP 文件系统\n\
  \n`Paths` 类在默认文件系统中查找路径——即用户本地磁盘上的文件。你可以拥有其他文件系统。其中最有用的之一是 ZIP 文件系统。如果 `zipname`\
  \ 是 ZIP 文件的名称，那么调用\n\n点击此处查看代码图片\n\n```java\nFileSystem zipfs = FileSystems.newFileSystem(Paths.get(zipname),\
  \ null);\n```\n\n将建立包含 ZIP 存档中所有文件的文件系统。如果你知道它的名称，从该存档中拷贝文件是非常容易的事：\n\n点击此处查看代码图片\n\
  \n```java\nFiles.copy(zipfs.getPath(sourceName), targetPath);\n```\n\n在这里，`zipfs.getPath`\
  \ 相当于任意文件系统的 `Paths.get`。\n\n要列出 ZIP 存档中的所有文件，遍历文件树：\n\n点击此处查看代码图片\n\n```java\n\
  Files.walk(zipfs.getPath(\"/\")).forEach(p -> {\n    Process p\n});\n```\n\n创建一个新的\
  \ ZIP 文件需要多费一点精力。这里是魔法咒语：\n\n点击此处查看代码图片\n\n```java\nPath zipPath = Paths.get(\"\
  myfile.zip\");\nURI uri = new URI(\"jar\", zipPath.toUri().toString(), null);\n\
  // 构建 URI jar:file://myfile.zip\ntry (FileSystem zipfs = FileSystems.newFileSystem(uri,\n\
  \        Collections.singletonMap(\"create\", \"true\"))) {\n    // 要添加文件，将它们拷贝到\
  \ ZIP 文件系统\n    Files.copy(sourcePath, zipfs.getPath(\"/\").resolve(targetPath));\n\
  }\n```\n\n***\n\n![Image](img/00005.jpeg) 注意\n\n有一个用于 ZIP 存档的旧 API，带有类 `ZipInputStream`\
  \ 和 `ZipOutputStream`，但它不像本节描述的那个那样容易使用。\n\n***\n\n## 9.3 URL 连接\n\n你可以通过调用 `URL`\
  \ 对象上的 `getInputStream` 方法从 URL 读取内容。然而，如果你想要关于网络资源的额外信息，或者你想写入数据，请使用 `URLConnection`\
  \ 类。遵循以下步骤：\n\n**1.** 获取一个 `URLConnection` 对象：\n\n点击此处查看代码图片\n\n```java\nURLConnection\
  \ connection = url.openConnection();\n```\n\n对于 HTTP URL，返回的对象实际上是 `HttpURLConnection`\
  \ 的实例。\n\n**2.** 如果需要，设置请求属性：\n\n点击此处查看代码图片\n\n```java\nconnection.setRequestProperty(\"\
  Accept-Charset\", \"UTF-8, ISO-8859-1\");\n```\n\n如果一个键有多个值，请用逗号将它们分隔。\n\n**3.**\
  \ 要向服务器发送数据，调用\n\n点击此处查看代码图片\n\n```java\nconnection.setDoOutput(true);\ntry (OutputStream\
  \ out = connection.getOutputStream()) {\n    Write to out\n}\n```\n\n**4.** 如果你想读取响应头且你尚未调用\
  \ `getOutputStream`，请调用\n\n```java\nconnection.connect();\n```\n\n然后查询头字段信息：\n\n\
  点击此处查看代码图片\n\n```java\nMap<String, List<String>> headers = connection.getHeaderFields();\n\
  ```\n\n对于每个键，你将获得一个值列表，因为可能存在具有相同键的多个头字段。\n\n**5.** 读取响应：\n\n点击此处查看代码图片\n\n```java\n\
  try (InputStream in = connection.getInputStream()) {\n    Read from\n}\n```\n\n\
  常见的用例是提交表单数据。`URLConnection` 类自动设置内容类型为 `application/`\n\n## 9.4 正则表达式\n\n正则表达式是定义模式的字符序列，由搜索算法匹配。它们用于字符串搜索、搜索替换和数据验证。正则表达式允许你非常精确。例如，`[a-z]`\
  \ 匹配小写字母。但等等——它还有更多内容。\n\n### 9.4.1 正则表达式语法\n\n在正则表达式中，字符表示其本身，除非它是以下保留字符之一：`* +\
  \ ? { | ( )  \\ ^ $`\n\n`.` 匹配任意字符。例如，`.a` 匹配 `ba`。\n\n`*` 符号表示结构可以重复 0 次或多次；对于\
  \ `+`，则是 1 次或多次。后缀 `?` 表示结构是可选的（0 或 1 次）。例如，`be+?` 匹配 `be`、`bee` 和 `bees`。\n\n`|`\
  \ 表示备选：.(oo|ee)f` 匹配 `beef` 或 `woof`。注意括号——如果没有，`.oo|eef` 将是 `.oo` 和 `eef` 之间的备选。括号也用于分组——参见[第\
  \ 9.4.3 节。\n\n*字符类*是封装在括号内的字符选项集，例如 `[Jj]`、`[0-9]`、`[A-Za-z]` 或 `[⁰-9]`。在字符类内部，`-`\
  \ 表示范围（Unicode 值落在两个边界之间的字符）。然而，作为字符类第一个或最后一个字符的 `-` 表示其本身。作为字符类第一个字符的 `^` 表示补集（除指定之外的所有字符）。\n\
  \n有许多*预定义字符类*，例如 `\\d`（数字）或 `\\p{Sc}`（Unicode 货币符号）。参见表 9–4 和 9–5。\n\n**表 9–4**\
  \ 正则表达式语法\n\n`^` 和 `$` 匹配输入的开始和结束。\n\n\n\n\n如果你需要匹配字面上的 `. * + ? { | ( ) [ \\ ^\
  \ $`，请在它们前面加上一个反斜杠。在字符类内部，你只需要转义 `[` 和 `\\`，只要你留心注意 `] - ^` 的位置即可。例如，`[]^-]` 是一个包含这三个字符的类。\n\
  \n### 9.4.2 查找单个或所有匹配项\n\n通常情况下，使用正则表达式有两种方式：要么你想检查一个字符串是否符合该表达式，要么你想在字符串中找到某个正则表达式的所有匹配项。\n\
  \n在第一种情况下，直接使用静态的 `matches` 方法：\n\n点击此处查看代码图片\n\n```java\nString regex = \"[+-]?\\\
  \\d+\";\nCharSequence input = ...;\n\nif (Pattern.matches(regex, input)) {\n   \
  \ ...\n}\n```\n\n如果你需要多次使用同一个正则表达式，预先编译它会更有效率。然后，为每个输入创建一个 `Matcher`：\n\n点击此处查看代码图片\n\
  \n```java\nPattern pattern = Pattern.compile(regex);\nMatcher matcher = pattern.matcher(input);\n\
  if (matcher.matches()) ...\n```\n\n如果匹配成功，你可以获取匹配组的位置——请参见下节。\n\n如果你想匹配集合或流中的元素，可以将模式转换为谓词（predicate）：\n\
  \n点击此处查看代码图片\n\n```java\nStream<String> strings = ...;\nStream<String> result =\
  \ strings.filter(pattern.asPredicate());\n```\n\n结果包含所有匹配该正则表达式的字符串。\n\n现在考虑另一种用例——在输入字符串中找到正则表达式的所有匹配项。使用这个循环：\n\
  \n点击此处查看代码图片\n\n```java\nMatcher matcher = pattern.matcher(input);\nwhile (matcher.find())\
  \ {\n    String match = matcher.group();\n    ...\n}\n```\n\n通过这种方式，你可以逐一处理每个匹配项。下一节将展示如何统一处理所有匹配项。\n\
  \n### 9.4.3 组\n\n使用组来提取匹配项的组成部分是常见的。例如，假设发票中有一行项目，包含项目名称、数量和单价，如下：\n\n`Blackwell\
  \ Toaster    USD29.95`\n\n这里是一个带有每个组件组的正则表达式：\n\n点击此处查看代码图片\n\n```\n(\\p{Alnum}+(\\\
  s+\\p{Alnum}+)*)\\s+([A-Z]{3})([0-9.]*)\n```\n\n匹配后，你可以如下所示从 matcher 中提取第 `n` 组：\n\
  \n点击此处查看代码图片\n\n```java\nString contents = matcher.group(n);\n```\n\n组按照其左括号的顺序排序，从\
  \ 1 开始。（组 0 是整个输入）。在这个示例中，这里是拆分输入的方法：\n\n点击此处查看代码图片\n\n```java\nMatcher matcher\
  \ = pattern.matcher(input);\nif (matcher.matches()) {\n    item = matcher.group(1);\n\
  \    currency = matcher.group(3);\n    price = matcher.group(4);\n}\n```\n\n我们对组\
  \ 2 不感兴趣；它只是是因为重复所所需的括号产生的。为了更清晰起见，你可以使用非捕获组（noncapturing group）：\n\n点击此处查看代码图片\n\
  \n```\n(\\p{Alnum}+(?:\\s+\\p{Alnum}+)*)\\s+([A-Z]{3})([0-9.]*)\n```\n\n或者，更好的方法是通过名称捕获：\n\
  \n点击此处查看代码图片\n\n```\n(?<item>\\p{Alnum}+(\\s+\\p{Alnum}+)*)\\s+(?<currency>[A-Z]{3})(?<price>[0-9.]*)\n\
  ```\n\n然后，你就可以通过名称检索项：\n\n```java\nitem = matcher.group(\"item\");\n```\n\n***\n\
  \n![Image](img/00005.jpeg) 注意\n\n当你在重复内部有一个组时，例如上面示例中的 `(\\s+\\p{Alnum}+)*`，是不可能获取其所有匹配的。`group()`\
  \ 方法只产生最后一次匹配，这很少有用。你需要用另一个组来捕获整个表达式。\n\n***\n\n### 9.4.4 移除或替换匹配项\n\n有时，你想根据匹配的分隔符进行分割并保留其他所有内容。`Pattern.split`\
  \ 方法自动执行了这项任务。你将获得一个字符串数组，其中分隔符已被移除：\n\n点击此处查看代码图片\n\n```java\nPattern commas =\
  \ Pattern.compile(\",\");\nString[] tokens = commas.split(\"1, 2, 3\");\n// tokens\
  \ 为 [\"1\", \"2\", \"3\"]\n```\n\n如果你需要多次使用同一个正则表达式，预编译它会更有效率。然后，为每个输入创建一个 `Matcher`：\n\
  \n点击此处查看代码图片\n\n```java\nPattern pattern = Pattern.compile(regex);\nMatcher matcher\
  \ = pattern.matcher(input);\nif (matcher.matches()) ...\n```\n\n如果匹配成功，你可以获取匹配组的位置——请参见下节。\n\
  \n如果你想匹配集合或流中的元素，可以将模式转换为谓词：\n\n点击此处查看代码图片\n\n```java\nStream<String> strings =\
  \ ...;\nStream<String> result = strings.filter(pattern.asPredicate());\n```\n\n\
  结果包含所有匹配该正则表达式的字符串。\n\n现在考虑另一种用例——在输入字符串中找到正则表达式的所有匹配项。使用这个循环：\n\n点击此处查看代码图片\n\n\
  ```java\nMatcher matcher = pattern.matcher(input);\nwhile (matcher.find()) {\n \
  \   String match = matcher.group();\n    ...\n}\n```\n\n通过这种方式，你可以逐一处理每个匹配项。下一节将展示如何统一处理所有匹配项。\n\
