  \ 编写一个程序，要求用户输入 URL，读取该 URL 对应的网页并显示所有链接。每个阶段都使用 `CompletableFuture`。不要调用 `get`。为了防止程序提前终止，请调用：\n\
  \n点击此处查看代码图片\n\n```java\nForkJoinPool.commonPool().awaitQuiescence(10, TimeUnit.SECONDS);\n\
  ```\n\n**25.** 编写一个方法\n\n点击此处查看代码图片\n\n```java\npublic static <T> CompletableFuture<T>\
  \ repeat(\n    Supplier<T> action, Predicate<T> until)\n```\n\n该方法会异步重复 `action`，直到产生一个被\
  \ `until` 函数接受的值，该函数也应该是异步运行的。使用一个从控制台读取 `java.net.PasswordAuthentication` 的函数，以及一个通过睡眠一秒钟后检查密码是否为\
  \ `\"secret\"` 来模拟有效性检查的函数进行测试。提示：使用递归。\n\n## 第 11 章：注解\n\n## 本章主题\n\n![Image](img/00004.jpeg)\n\
  - 11.1 使用注解\n- Image 11.2 定义注解\n- Image 11.3 标准注解\n- Image 11.4 在运行时处理注解\n- Image\
  \ 11.5 源码级注解处理\n- Image 练习题\n\n注解是你插入到源代码中的标签，以便某些工具能够对其进行处理。这些工具可以在源码级别进行操作，也可以处理编译器已在其中放置注解的类文件。\n\
  \n注解不会改变程序的编译方式。无论是否包含注解，Java 编译器生成的虚拟机指令都是相同的。\n\n要从注解中获益，你需要选择一种处理工具，并使用该工具理解的注解，然后才能将工具应用到你的代码中。\n\
  \n注解的用途广泛。例如，JUnit 使用注解来标记执行测试的方法，并指定测试的运行方式。Java 持久化体系（JPA）使用注解来定义类与数据库表之间的映射，使得对象可以自动持久化，无需开发者编写\
  \ SQL 查询语句。\n\n在本章中，你将学习注解语法的细节、如何定义自己的注解，以及如何编写在源码级别或运行时运行的注解处理器。\n\n本章的要点是：\n\n\
  1. 你可以像使用 `public` 或 `static` 修饰符一样对声明进行注解。\n2. 你也可以对出现在声明、强制转换、`instanceof` 检查或方法引用的类型进行注解。\n\
  3. 注解以 `@` 符号开头，包含称为元素的键值对。\n4. 注解值必须是编译时常量：原始类型、`enum` 常量、`Class` 字面量、其他注解或它们的数组。\n\
  5. 一个项目可以拥有重复注解或不同类型的注解。\n6. 要定义注解，需要指定一个注解接口，其方法与注解元素对应。\n7. Java 库定义了十多个注解，注解在\
  \ Java 企业版中被广泛使用。\n8. 为了在运行的 Java 程序中处理注解，可以使用反射并查询反射项的注解。\n9. 注解处理器在编译期间处理源文件，使用\
  \ Java 语言模型 API 定位被注解的项。\n\n### 11.1 使用注解\n\n这是一个简单注解的示例：\n\n点击此处查看代码图片\n\n```java\n\
  public class CacheTest {\n    ...\n}\n```\n\n`@Test` 注解了 `checkInsertions` 方法。在\
  \ Java 中，注解的使用类似于修饰符（如 `public` 或 `static`）。`@Test` 本身没有任何作用；它需要一个工具才能发挥作用。[part0018.html_ch11lev1sec2)\n\
  \n#### 11.1.1 元素\n\n注解可以包含称为*元素*的键值对。允许的元素有：\n\n- 原始类型值\n- `String`\n- `Class` 对象\n\
  - `enum` 实例\n- 注解\n- 上述内容的数组\n\n例如：\n\n```java\n@BugReport(showStopper=true, assignedTo=\"\
  Harry\", case=CacheTest.class, status=Status.CONFIRMED)\n```\n\n元素可以有默认值。例如，`@Test`\
  \ 注解的 `timeout` 元素默认值为 `0L`。因此，`@Test` 等于 `@Test(timeout=0L)`。\n\n如果元素名称为 `value`\
  \ 且它是你指定的唯一元素，你可以省略 `value=`。例如，`@SuppressWarnings(\"unchecked\")` 等于 `@SuppressWarnings(value=\"\
  unchecked\")`。\n\n如果元素值是数组，用括号包围其组件：\n\n```java\n@BugReport(reportedBy={\"Harry\"\
  , \"Fred\"})\n```\n\n如果数组只有一个组件，可以省略括号：\n\n```java\n@BugReport(reportedBy=\"Harry\"\
  )\n```\n\n注解元素可以是另一个注解：\n\n```java\n@BugReport(ref=@Reference(id=11235811), ...)\n\
  ```\n\n> 由于注解由编译器评估，所有元素值必须是编译时常量。\n\n### 11.1.2 多重和重复注解\n\n项目可以有多个注解：\n\n```java\n\
  @Test\n@BugReport(showStopper=true, reportedBy=\"Joe\")\npublic void checkInsertions()\n\
  ```\n\n如果注解作者将其声明为可重复，你可以多次重复同一个注解：\n\n```java\n@BugReport(showStopper=true, reportedBy=\"\
  Joe\")\n@BugReport(reportedBy={\"Harry\", \"Carl\"})\npublic void checkInsertions()\n\
  ```\n\n### 11.1.3 注解声明\n\n到目前为止，你已经看到注解应用于方法声明。在许多其他地方也可以出现注解。它们分为两类：*声明*和*类型使用*。声明注解可以出现在以下声明中：\n\
  \n- 类（包括 `enum`）和接口（包括注解接口）\n- 方法\n- 构造函数\n- 实例变量（包括 `enum` 常量）\n\n\n\n\n\n- 局部变量（包括在\
  \ `for` 和 `try-with-resources` 语句中声明的变量）\n- 参数变量和 `catch` 子句参数\n- 类型参数\n- 包（Packages）\n\
  \n对于类和接口，将注解放在 `class` 或 `interface` 关键字之前：\n\n点击此处查看代码图片\n\n```java\n@Entity public\
  \ class User { ... }\n```\n\n对于变量，将注解放在类型之前：\n\n点击此处查看代码图片\n\n```java\n@SuppressWarnings(\"\
  unchecked\") List<User> users = ...;\n\npublic User getUser(@Param(\"id\") String\
  \ userId)\n```\n\n泛型类或方法中的类型参数可以这样进行注解：\n\n点击此处查看代码图片\n\n```java\npublic class Cache<@Immutable\
  \ V> { ... }\n```\n\n包的注解是在文件 `package-info.java` 中定义的，该文件仅包含由注解前的包语句。\n\n点击此处查看代码图片\n\
  \n```java\n/**\n * 包级别的 Javadoc\n */\n@GPL(version=\"3\")\npackage com.horstmann.corejava;\n\
  \nimport org.gnu.GPL;\n```\n\n注意，用于注解的 `import` 语句位于 `package` 声明的*之后*。\n\n***\n\
  \n![Image](img/00005.jpeg) Note\n\n当类编译时，局部变量和包的注解会被丢弃。因此，它们只能在源码级别进行处理。\n\n***\n\
  \n#### 11.1.4 类型类型使用注解\n\n声明注解为被声明的项目提供某些信息。例如，在如下声明中\n\n点击此处查看代码图片\n\n```java\n\
  public User getUser(@NonNull String userId)\n```\n\n它断言 `userId` 参数不空。\n\n***\n\n\
  ![Image](img/00005.jpeg) Note\n\n`@NonNull` 注解是 Checker Framework（[`http://types.cs.washington.edu/checker-framework`](http://types.cs.washington.edu/checker-framework)）的一部分。通过该框架，你可以在程序中包含断言，例如参数非\
  \ `null` 或者 `String` 包含正则表达式。静态分析工具会检查这些断言在给定的源代码体内是否有效。\n\n***\n\n现在假设我们有一个 `List<String>`\
  \ 类型的参数，我们希望所有的字符串都非 `null`。这就是类型使用注解大显用场。将注解放在类型参数之前：`List<@NonNull String>`\n\n\
  类型使用注解可以出现在以下位置：\n\n- 泛型类型参数：`List<@NonNull String>`，`Comparator.<@NonNull String>\
  \ reverseOrder()`。\n- 数组的任何位置：`@NonNull String[][] words`（`words[i][j]` 不是 `null`），`String\
  \ @NonNull [][] words`（`words` 不是 `null`），`String[] @NonNull [] words`（`words[i]`\
  \ 不是 `null`）。\n- 超类和实现的接口：`class Warning extends @Localized Message`。\n- 构造函数调用：`new\
  \ @Localized String(...)`。\n- 嵌套类型：`Map.@Localized Entry`。\n- 强制转换和 `instanceof`\
  \ 检查：`(@Localized String) text`，`if (text instanceof @Localized String)`。（注解仅供外部工具使用。它们对强制转换或\
  \ `instanceof` 检查的行为没有影响。）\n- 异常规范：`public String read() throws @Localized IOException`。\n\
  - 通配符和类型边界：`List<@Localized ? extends Message>`，`List<? extends @Localized Message>`。\n\
  - 方法和构造函数引用：`@Localized Message::getText`。\n\n有几个类型位置无法被注解：\n\n点击此处查看代码图片\n\n```java\n\
  @NonNull String.class // Error—无法注解类字面量\n\nimport java.lang.@NonNull String; //\
  \ Error—无法注解导入语句\n```\n\n你可以将注解放在 `private` 和 `static` 等其他修饰符之前或之后。习惯上（但不是必须）将类型使用注解放在其他修饰符之后，将声明注解放在其他修饰符之前。例如，\n\
  \n点击此处查看代码图片\n\n```java\nprivate @NonNull String text; // 注解类型使用\n\n@Id private\
  \ String userId; // 注解变量\n```\n\n***\n\n![Image](img/00005.jpeg) Note\n\n正如你将在第\
  \ 11.2 节中的“定义注解”第 361 页中所示，注解作者需要指定特定注解可以出现在哪里。如果一个注解既允许变量也允许类型使用，并且被用在变量声明中，那么变量和类型使用都会被注解。例如，考虑\n\
  \n点击此处查看代码图片\n\n```java\nprivate @NonNull String text; // 注解类型使用\n\n@Id private\
  \ String userId; // 注解变量\n```\n\n***\n\n#### 11.1.5 显式化接收者\n\n假设你想注解那些会被修改的参数。\n\
  \n点击此处查看代码图片\n\n```java\npublic class Point {\n\n    public boolean equals(@ReadOnly\
  \ other)\n}\n```\n\n第一个参数被称为*接收者*。它必须命名为 `this`。但 `p` 呢？\n\n当方法被调用时，`this` 被绑定到\
  \ `p`，`q` 没有改变。\n\n***\n\n![Image](img/00005.jpeg) Note\n\n你只能为方法提供接收者参数，不能为构造函数提供。概念上，构造函数中的\
  \ `this` 引用在构造函数完成之前不是一个对象。相反，构造上的注解描述的是一个属性对象。\n\n***\n\n传递给类的参数是该类的引用。你也可以显式地指定这个参数：\n\
  \n点击此处查看代码图片\n\n```java\nstatic class Sequence {\n    private int from;\n    private\
  \ int to;\n\n    class Iterator implements java.util.Iterator<Integer> {\n     \
  \   private int current;\n\n        public Iterator(@ReadOnly Sequence.this) {\n\
  \            this.current = Sequence.this.from;\n        }\n        ...\n    }\n\
  \    ...\n}\n```\n\n该参数的命名就像你引用它时一样 `EnclosingClass.this`，其类型就是外部类。\n\n### 11.2\
  \ 定义注解\n\n每个注解必须通过*注解接口*声明，使用 `@interface` 语法。接口的方法对应注解的元素。例如，JUnit Test 注解是由以下接口定义的：\n\
  \n点击此处查看代码图片\n\n```java\n@Target(ElementType.METHOD)\n@Retention(RetentionPolicy.RUNTIME)\n\
  public @interface Test {\n    long timeout();\n    ...\n}\n```\n\n`@interface` 声明创建了一个真正的\
  \ Java 接口。处理注解的工具接收实现注解接口的对象。当 JUnit 测试运行工具获取实现 `Test` 的对象时，它只需调用 `timeout` 方法即可获取特定\
  \ `Test` 注解的元素。\n\n\n\n\n\n`Target` 和 `Retention` 注解是*元注解*（meta-annotations）。它们被用于标记\
  \ `Test` 注解，指明该注解可以出现的位置以及可以被访问的位置。\n\n`@Target` 元注解的值是一个 `ElementType` 对象的数组，指定了注解可以应用的项。你可以指定任意数量的元素类型，并用大括号括起来。例如，\n\
  \n点击此处查看代码图像\n\n```java\n@Target({ElementType.TYPE, ElementType.METHOD})\n\npublic\
  \ @interface BugReport\n```\n\n表 11–1 显示了所有可能的的目标。编译器会检查你是否只在允许的地方使用注解。例如，如果你将 `@BugReport`\
  \ 应用于变量，将导致编译错误。\n\n![Image](img/00063.jpeg)\n\n**表 11–1** `@Target` 注解的元素类型\n\n\
  ***\n\n![Image](img/00005.jpeg) 备注\n\n没有 `@Target` 限制的注解可以用于任何声明，但不能用于类型参数和类型使用。（这些是在支持注解的第一个\
  \ Java 版本中唯一可能的标记。）\n\n***\n\n`@Retention` 元注解指定了注解可以在何处被访问。共有三种选择。\n\n1. `RetentionPolicy.SOURCE`：注解对源处理器可用，但它不包含在类文件中。\n\
  2. `RetentionPolicy.CLASS`：注解包含在类文件中，但虚拟机不会加载它们。这是默认值。\n3. `RetentionPolicy.RUNTIME`：注解在运行时可用，并通过反射\
  \ API 进行访问。\n\n你将在本章稍后部分看到这三种场景的示例。\n\n还有其他几个元注解——完整列表请参见第 11.3 节以及第 364 页的“标准注解”。\n\
  \n要为元素指定默认值，请在定义该元素的方法后添加 `default` 子句。例如，\n\n点击此处查看代码图像\n\n```java\npublic @interface\
  \ Test {\n\n    long timeout() default 0L;\n\n    ...\n\n}\n```\n\n此示例展示了如何表示空数组的默认值以及注解的默认值。\n\
  \n点击此处查看代码图像\n\n```java\npublic @interface BugReport {\n\n    String[] reportedBy()\
  \ default {};\n\n        // 默认为空数组\n\n    Reference ref() default @Reference(id=0);\n\
  \n        // 注解的默认值\n\n    ...\n}\n```\n\n***\n\n![Image](img/00009.jpeg) 注意\n\n\
  默认值并不存储在注解中；而是动态计算的。如果你更改了默认值并重新编译了注解类，则所有被标记的元素都将使用新的默认值，即使在默认值更改之前已经编译的类文件中也是如此。\n\
  \n***\n\n你不能扩展注解接口，也永远提供实现注解接口的类。相反，源处理工具和虚拟机会在需要时生成代理类和对象。\n\n### 11.3 标准注解\n\n\
  Java API 在 `java.lang`、`java.lang.annotation` 和 `javax.annotation` 包中定义了许多注解接口。其中四个是元注解，用于描述注解接口的行为。其他是普通注解，你用它们标记源码中的项。表\
  \ 11–2 显示了这些注解。我将在接下来的两个节中详细讨论它们。\n\n![Image](img/00064.jpeg)![Image](img/00065.jpeg)\n\
  \n**表 11–2** 标准注解\n\n#### 11.3.1 用于编译的注解\n\n`@Deprecated` 注解可以附加到任何不再鼓励使用的项上。当你使用过弃项时，编译器会发出警告。该注解的作用与\
  \ `@deprecated` Javadoc 标签相同。\n\n`@Override` 使编译器检查被标记的方法是否真的重写了父类中的方法。例如，如果你声明\n\
  \n点击此处查看代码图像\n\n```java\npublic class Point {\n\n    @Override public boolean equals(Point\
  \ other) { ... }\n\n    ...\n}\n```\n\n那么编译器将报告一个错误——此 `equals` 方法没有重写 `Object`\
  \ 类的 `equals` 方法，因为该方法的参数类型是 `Object`，而不是 `Point`。\n\n`@SuppressWarnings` 注解告诉编译器抑制特定类型的警告，例如，\n\
  \n点击此处查看代码图像\n\n```java\n@SuppressWarnings(\"unchecked\") T[] result\n    = (T[])\
  \ Array.newInstance(cl, n);\n```\n\n`@SafeVarargs` 注解断言方法不会破坏其变长参数参数（参见第 6 章）。\n\
  \n`@Generated` 注解供代码生成工具使用。任何生成的源代码都可以被标记，以区别于程序员编写的代码。代码生成器可以隐藏生成的代码。每个注解必须包含一个唯一的标识符。日期字符串（ISO\
  \ 8601 格式）和注释字符串是可选的。例如，\n\n点击此处查看代码图像\n\n```java\n@Generated(value=\"com.horstmann.generator\"\
  ,\n    date=\"2015-01-04T12:08:56.235-0700\");\n```\n\n你已经在第 3 章见过 `FunctionalInterface`\
  \ 注解。它用于标记 lambda 表达式的目标，例如\n\n点击此处查看代码图像\n\n```java\n@FunctionalInterface\npublic\
  \ interface IntFunction<R> {\n    R apply(int value);\n}\n```\n\n如果你之后添加另一个抽象方法，编译器将产生错误。当然，你应该只将此注解添加到描述函数的接口上。有些接口只有一个抽象方法（如\
  \ `AutoCloseable`）。\n\n#### 11.3.2 管理资源的注解\n\n`@PostConstruct` 和 `@PreDestroy` 注解用于控制对象生命周期的环境，如\
  \ Web 容器和应用服务器。标记这些注解的方法应在对象构造后立即调用，或在移除之前立即调用。\n\n`@Resource` 注解用于资源注入。例如，考虑一个访问数据库的\
  \ Web 应用。当然，数据库访问信息不应硬编码在 Web 应用中。相反，Web 容器有一个用户界面来设置连接参数，并为数据源提供 JNDI 名称。在 Web\
  \ 应用中，你可以这样引用数据源：\n\n点击此处查看代码图像\n\n```java\n@Resource(name=\"jdbc/employeedb\")\n\
  private DataSource source;\n```\n\n当包含此实例变量的对象构造时，容器会“注入”数据源引用——即将实例变量设置为配置为 `\"\
  jdbc/employeedb\"` 的 `DataSource` 对象。\n\n\n\n\n\n例如，`@SuppressWarnings` 注解没有文档。如果一个方法或字段带有该注解，它是一个实现细节，对\
  \ Javadoc 阅读者并不感兴趣。相反，`@FunctionalInterface` 注解是有文档的，因为对于程序员来说，知道该接口用于描述函数是非常有用的。图\
  \ 11–1 显示了文档。\n\n![Image](img/00066.jpeg)\n\n**图 11–1** 带有文档说明的注解\n\n`@Inherited`\
  \ 元注解仅适用于类的注解。当一个类具有继承的注解时，它的所有子类都自动拥有了相同的注解。这使得创建工作类似于标记接口（如 `Serializable` 接口）的注解变得简单。\n\
  \n假设你定义了一个继承注解 `@Persistent`，表示该类的对象可以保存到数据库中。那么，持久化类的子类会自动被标记为持久化。\n\n点击此处查看代码图片\n\
  \n```java\n@Inherited @interface Persistent { }\n\n@Persistent class Employee {\
  \ . . . }\n\nclass Manager extends Employee { . . . } // 也 @Persistent\n```\n\n\
  `@Repeatable` 元注解允许多次应用同一个注解。例如，假设 `@TestCase` 注解是可重复的。那么可以像这样使用：\n\n点击此处查看代码图片\n\
  \n```java\n@TestCase(params=\"4\", expected=\"24\")\n\n@TestCase(params=\"0\", expected=\"\
  1\")\n\npublic static long factorial(int n) { ... }\n```\n\n由于历史原因，可重复注解的实现者需要提供一个*容器注解*，用数组持有这些重复的注解。\n\
  \n以下是定义 `@TestCase` 注解及其容器的方式：\n\n```java\n@Repeatable(TestCases.class)\n@interface\
  \ TestCase {\n    String params();\n    String expected();\n}\n\n@interface TestCases\
  \ {\n    TestCase[] value();\n}\n```\n\n当用户提供两个或多个 `@TestCase` 注解时，它们会被包装成一个 `@TestCases`\
  \ 注解。这增加了处理注解的复杂度，正如你将在下一节中看到的。\n\n## 11.4 在运行时处理注解\n\n到目前，你已经了解了如何在源文件中添加注解以及如何定义注解类型。现在是时候看看能产生什么好的结果了。\n\
  \n在本节中，我将向你展示一个使用你在 4 章中使用过的反射 API 在运行时处理注解的简单示例。假设我们减少实现 `toString` 方法的重复工作。当然，可以使用反射编写一个通用的\
  \ `toString` 方法，简单包含所有实例变量名和值。但假设我们想自定义该过程。我们可能不想包含所有的实例变量，或者可能想跳过类和变量名。例如，对于 `Point`\
  \ 类，我们可能倾向于使用 `[5,10]` 而不是 `Point[x=5,y=10]`。当然，任何增强都是可能的，但让我们保持简单。重点在于演示注解处理器可以做什么。\n\
  \n用 `@ToString` 注解标记所有希望从此服务受益的类。此外，所有应该包含的实例变量也需要被标记。该注解定义如下：\n\n点击此处查看代码图片\n\n\
  ```java\n@Target({ElementType.FIELD, ElementType.TYPE})\n@Retention(RetentionPolicy.RUNTIME)\n\
  public @interface ToString {\n    boolean includeName() default true;\n}\n```\n\n\
  以下是被了注解的 `Point` 和 `Rectangle` 类。\n\n点击此处查看代码图片\n\n```java\n@ToString(includeName=false)\n\
  public class Point {\n    @ToString(includeName=false) private int x;\n    @ToString(includeName=false)\
  \ private int y;\n    ...\n}\n\n@ToString\npublic class Rectangle {\n    @ToString(includeName=false)\
  \ private Point topLeft;\n    @ToString private int width;\n    @ToString private\
  \ int height;\n    ...\n}\n```\n\n意图是将矩形表示为字符串 `Rectangle[[5, 10], width=20,height=30]`。\n\
  \n在运行时，我们无法修改给定类 `toString` 方法的实现。相反，让我们提供一个可以格式化任何对象的方法，如果存在 `ToString` 注解，则发现并使用它们。\n\
  \n关键是 `AnnotatedElement` 接口中的方法：\n\n点击此处查看代码图片\n\n- `T getAnnotation(Class<T>)`\n\
  - `T getDeclaredAnnotation(Class<T>)`\n- `T[] getAnnotationsByType(Class<T>)`\n\
  - `T[] getDeclaredAnnotationsByType(Class<T>)`\n- `Annotation[] getAnnotations()`\n\
  - `Annotation[] getDeclaredAnnotations()`\n\n反射类 `Class`、`Field`、`Parameter`、`Constructor`\
  \ 和 `Package` 实现了该接口。\n\n与其他方法一样，带有 `Declared` 名称的方法产生类本身的注解，而其他方法包含包含。在注解的上下文中，这意味着注解是\
  \ `@Inherited` 并且应用于父类的。\n\n如果注解是可重复的，调用 `getAnnotation` 来定位它。例如：\n\n点击此处查看代码图片\n\
  \n```java\nClass cl = obj.getClass();\nToString ts = cl.getAnnotation(ToString.class);\n\
  if (ts != null && ts.includeName()) ...\n```\n\n注意你传递注解的类对象（这里是 `ToString.class`），并返回一个实现了\
  \ `ToString` 接口的对象。然后你可以调用接口方法来获取注解的值。如果注解不存在，`getAnnotation` 方法返回 `null`。\n\n如果注解是重复的，情况会变得复杂。如果你调用\
  \ `getAnnotation` 来查找重复注解，而该注解实际上重复了，你会得到 `null`。这是因为重复注解被包装在容器注解中。在这种情况下，你应该调用\
  \ `getAnnotationsByType`。该调用会“遍历”容器并给你重复注解。如果只有一个注解，你会得到一个长度为 1 的数组。通过此方法，你不需要担心容器注解。`getAnnotations`\
  \ 方法获取项目被标记的所有注解，重复的会被包装在容器中。\n\n以下是感知注解 `toString` 方法的实现：\n\n点击此处查看代码图片\n\n```java\n\
  public class To {\n    public static String toString(Object obj) {\n        if (obj\
  \ == null) return \"null\";\n        Class<?> cl = obj.getClass();\n        ToString\
  \ ts = cl.getAnnotation(ToString.class);\n        if (ts == null) return obj.toString();\n\
  \        StringBuilder result = new StringBuilder();\n        if (ts.includeName())\
  \ result.append(cl.getName());\n        result.append(\"[\");\n        boolean first\
  \ = true;\n        for (Field f : cl.getDeclaredFields()) {\n            ts = f.getAnnotation(ToString.class);\n\
  \            if (ts != null) {\n                if (first) first = false else result.append(\"\
  ,\");\n                f.setAccessible(true);\n                if (ts.includeName())\
  \ {\n                    result.append(f.getName());\n                    result.append(\"\
  =\");\n                }\n                try {\n                    result.append(ToStrings.toString(f.get(obj)));\n\
  \                } catch (ReflectiveOperationException ex) {\n                 \
  \   ex.printStackTrace();\n                }\n            }\n        }\n       \
  \ result.append(\"]\");\n        return result.toString();\n    }\n}\n```\n\n当类被标记了\
  \ `ToString` 时，该方法会遍历它的字段并打印那些也被标记的字段。如果 `includeName` 元素为 `true`，则类名或字段名将包含在字符串中。\n\
  \n\n\n\n注意，该方法会递归地调用自己。当对象属于一个未标记注解的类时，将使用其常规的 `toString` 方法并且递归停止。\n\n这是运行时注解 API\
  \ 一个简单但典型的用法。使用反射查找类、字段等；在可能带有注解的元素上调用 `getAnnotation` 或 `getAnnotationsByType`\
  \ 来获取注解；然后，调用注解接口的方法来获取元素的值。\n\n## 11.5 源码级注解处理\n\n在前面的节中，你已经看到了如何分析运行中程序中的注解。注解的另一个用途是对比源文件进行自动处理，以生成更多的源代码、配置文件、脚本或任何人们想要生成的内容。\n\
  \n为了向你展示其工作机制，我将重复生成 `toString` 方法的示例。但是，这次让我们在 Java 源码中生成它们。这样这些方法将与程序的其余一起编译，并以全速度运行，而不是使用反射。\n\
  \n### 11.5.1 注释处理器\n\n注解处理集成在 Java 编译器中。在编译期间，你可以通过运行以下命令来调用注解处理器：\n\n```bash\n\
  javac -processor ProcessorClassName[1],ProcessorClassName[2],... sourceFiles\n```\n\
  \n编译器会定位源文件的注解。每个注解处理器会按顺序执行，并获得它感兴趣的注解。如果注解处理器创建了新的源文件，则将重复该过程。一旦某个处理轮不再产生更多的源文件，所有源文件都将被编译。\n\
  \n***\n\n**注意**：注解处理器只能生成新的源文件。它不能修改现有的源文件。\n\n***\n\n注解处理器实现了 `Processor` 接口，通常通过扩展\
  \ `AbstractProcessor` 类来实现。你需要指定你的处理器支持哪些注解：\n\n```java\n@SupportedAnnotationTypes(\"\
  com.horstmann.annotations.ToString\")\n@SupportedSourceVersion(SourceVersion.RELEASE_8)\n\
  \npublic class ToStringAnnotationProcessor extends AbstractProcessor {\n\n    @Override\n\
  \    public boolean process(Set<? extends TypeElement> annotations,\n          \
  \  RoundEnvironment currentRound) {\n        ...\n    }\n}\n```\n\n处理器可以声称特定的注解类型、通配符（例如\
  \ `\"com.horstmann.*\"` 表示 `com.horstmann` 包或任何子包中的所有注解），甚至可以是 `\"*\"`（所有注解）。\n\n\
  `process` 方法每轮会被调用一次，传入该轮次中在任何文件中找到的所有注解集合，以及一个包含当前处理轮信息的 `RoundEnvironment` 引用。\n\
  \n### 11.5.2 语言模型 API\n\n你使用语言模型 API 来分析源码级注解。与反射 API 提供的类和方法的虚拟机表示不同，语言模型 API 允许你根据\
  \ Java 语言的规则分析 Java 程序。\n\n编译器会生成一棵树，其节点是实现了 `javax.lang.model.element.Element`\
  \ 接口及其子接口（`TypeElement`、`VariableElement`、`ExecutableElement` 等）类的实例。这些是 `Class`、`Field`/`Parameter`、`Method`/`Constructor`\
  \ 反射类的编译时对应物。\n\n我不想详细介绍该 API，但这里有你处理注解时需要的重点。\n\n- `RoundEnvironment` 通过调用以下方法为你提供一个所有带有特定注解的元素集合：\n\
  ```java\nSet<? extends Element> getElementsAnnotatedWith(Class<? extends Annotation>\
  \ a)\n```\n- `AnnotateElement` 接口的源码级对应物是 `AnnotatedConstruct`。你使用方法：\n```java\n\
  A getAnnotation(Class<A> annotationType)\nA[] getAnnotationsByType(Class<A> annotationType)\n\
  ```\n来获取给定的注解类的注解或重复注解。\n- `TypeElement` 代表一个类或接口。`getEnclosedElements` 方法产生其字段和方法的列表。\n\
  - 在 `Element` 上调用 `getSimpleName` 或在 `TypeElement` 上调用 `getQualifiedName` 会得到一个\
  \ `Name` 对象，该对象可以通过 `toString` 转换为字符串。\n\n### 11.5.3 使用注解生成源代码\n\n让我们回到自动生成 `toString`\
  \ 方法的任务上。我们无法将这些方法放入原始类中——注解处理器只能产生新类，不能修改现有的类。\n\n因此，我们将所有方法添加到一个工具类 `ToStrings`\
  \ 中：\n\n```java\npublic class ToStrings {\n    public static String toString(Point\
  \ obj) {\n        // 生成的代码\n    }\n    public static String toString(Rectangle obj)\
  \ {\n        // 生成的代码\n    }\n    public static String toString(Object obj) {\n\
  \        return Objects.toString(obj);\n    }\n}\n```\n\n由于我们不想使用反射，我们对访问器方法而不是字段进行注解：\n\
  \n```java\n@ToString\npublic class Rectangle {\n    ...\n    @ToString(includeName=false)\
  \ public Point getLeft() { return topLeft; }\n    @ToString public int getWidth()\
  \ { return width; }\n    @ToString public int getHeight() { return height; }\n}\n\
  ```\n\n注解处理器应该生成以下源代码：\n\n```java\npublic static String toString(Rectangle obj)\
  \ {\n    StringBuilder result = new StringBuilder();\n    result.append(\"Rectangle\"\
  );\n    result.append(\"[\");\n    result.append(obj.getLeft());\n    result.append(\"\
  ,\");\n    result.append(\"width=\");\n    result.append(obj.getWidth());\n    result.append(\"\
  ,\");\n    result.append(\"height=\");\n    result.append(obj.getHeight());\n  \
  \  result.append(\"]\");\n    return result.toString();\n}\n```\n\n样板代码是灰色的。这里是为带有\
  \ `TypeElement` 的类产生 `toString` 方法的概述：\n\n```java\nprivate void writeToStringMethod(PrintWriter\
  \ out, TypeElement te) {\n    String className = te.getQualifiedName().toString();\n\
  \    // 打印头和 string builder 的声明\n    ToString ann = te.getAnnotation(ToString.class);\n\
  \    if (ann.includeName()) // 打印类名\n    for (Element c : te.getEnclosedElements())\
  \ {\n        ann = c.getAnnotation(ToString.class);\n        if (ann != null) {\n\
  \            if (ann.includeName()) // 打印字段名\n            // 打印 append(obj.methodName())\n\
  \        }\n    }\n    // 打印返回字符串\n}\n```\n\n这里是注解处理器 `process` 方法的概述。它为辅助类创建一个源文件，并为每个带注解的类写入类头和每个类对应的一个方法。\n\
  \n```java\npublic boolean process(Set<? extends TypeElement> annotations,\n    \
  \    RoundEnvironment currentRound) {\n    if (annotations.size() == 0) return true;\n\
  \    try {\n        JavaFileObject sourceFile = processingEnv.getFiler().createSourceFile(\n\
  \                \"com.horstmann.annotations.ToStrings\");\n        try (PrintWriter\
  \ out = new PrintWriter(sourceFile.openWriter())) {\n            // 打印包和类的代码\n \
  \           for (Element e : currentRound.getElementsAnnotatedWith(ToString.class))\
  \ {\n                if (e instanceof TypeElement) {\n                    TypeElement\
  \ te = (TypeElement) e;\n                    writeToStringMethod(out, te);\n   \
  \             }\n            }\n        }\n    }\n}\n```\n\n\n\n\n```java\n    \
