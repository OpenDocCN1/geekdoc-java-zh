  \ `+` 或 `-` 是分隔符。\n\n**11.** 使用正则表达式从绝对或相对路径（如 `/home/cay/myfile.txt`）提取目录路径名（字符串数组）、文件名和文件扩展名。\n\
  \n**12.** 想出一个在 `Matcher.replaceAll` 中使用分组引用的实际用例并实现它。\n\n**13.** 实现一个方法，通过将任何可序列化对象序列化为字节数组并反序列化，产生该对象的克隆。\n\
