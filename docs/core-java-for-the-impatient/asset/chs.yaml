  ```\n3 10 11 8\n```\n## 面对象编程\n### 2. 使用对象\n在对象发明之前的古代时代，你通过调用*函数*来编写程序。当你调用一个函数时，它返回一个结果，你可以直接使用该结果而无需担心它是如何计算的。函数有一个重要的益处：它们允许工作被共享。\n\
  对象的增加了另一个维度。每个对象都可以有自己的*状态*。状态会影响调用方法获得的结果。例如，如果 `in` 是一个 `Scanner` 对象且你调用 `in.next()`，该对象会记住之前读取的内容并给你下一个输入标记。\n\
  当你使用他人实现的对象并调用它们的方法时，你不需要知道内部发生了什么。这种原则被称为*封装*，是面向对象编程的核心概念。\n在某些情况下，你可能希望通过为其他程序员提供可以使用的对象来使你的工作可用。在\
  \ Java 中，你提供一个*类*——一种创建和使用相同行为对象的机制。\n### 本章主题\n1. 修改器方法改变对象的状态；访问器方法不改变。\n3. 实例变量和方法实现定义在类内部。\n\
  5. 构造方法与类名相同。类可以有多个（重载）构造方法。\n7. 类组织在包中。使用导入语句以便你无需在程序中使用包名。\n9. 内部类是非静态嵌套类。它的实例拥有指向构造它的外部类对象的引用。\n\
  \n\n\n\n\n\n\n Mon Tue Wed Thu Fri Sat Sun\n   2  3  4  5  6  7  8\n  16  17  18\
  \  19  20  21  22\n  30\n\n你如何实现这样一个程序呢？使用 Java 标准库，你使用 `LocalDate` 类来表示某个未指定位置的日期。我们需要该类的对象来代表每月的第一天。以下是获取方法：\n\
  \n点击此处查看代码图片\n\n```\nLocalDate date = LocalDate.of(year, month, 1);\n```\n\n要推进日期，你调用\
  \ `date.plusDays(1)`。结果是一个新构建的 `LocalDate` 对象，增加一天。在我们的应用程序中，我们只需将结果重新赋值给 `date`\
  \ 变量：\n\n```\ndate = date.plusDays(1);\n```\n\n你应用方法来获取关于日期的信息，例如它所在的月份。我们需要这些信息，以便在仍同一个月份时继续打印。\n\
  \n点击此处查看代码图片\n\n```\nwhile (date.getMonthValue() == month) {\n    System.out.printf(\"\
  %4d\", date.getDayOfMonth());\n    date = date.plusDays(1);\n    ...\n}\n```\n\n\
  另一个方法返回日期所属的星期几。\n\n点击此处查看代码图片\n\n```\nDayOfWeek weekday = date.getDayOfWeek();\n\
  ```\n\n你得到的是另一个类 `DayOfWeek` 的对象。为了计算日历中每月第一日的缩进，我们需要知道星期几的数值。有一个方法可以做到这一点：\n\n\
  点击此处查看代码图片\n\n```\nint value = weekday.getValue();\nfor (int i = 1; i < value; i++)\n\
  \    System.out.print(\"    \");\n```\n\n`getValue` 方法遵循国际惯例，即周末在周末，周一返回 `1`，周二返回\
  \ `2`，以此此类推。周日的值为 `7`。\n\n***\n\n![Image](img/00005.jpeg) 注意\n\n你可以像这样*链式*调用方法：\n\
  \n点击此处查看代码图片\n\n```\nint value = date.getDayOfWeek().getValue();\n```\n\n第一个方法调用作用于\
  \ `date` 对象，并返回一个 `DayOfWeek` 对象。然后会在返回的对象上调用 `getValue` 方法。\n\n***\n\n你将在书的附带代码中找到完整的程序。解决打印日历的问题很容易，因为\
  \ `LocalDate` 类的设计者为我们提供了一组有用的方法。在本章中，你将学习如何为自己的类实现方法。\n\n\n\n\n点击此处查看代码图片\n\n```java\n\
  date = LocalDate.of(year, month, 1);\ndate = date.plusDays(1);\n```\n\n在第一次赋值后，`date`\
  \ 指向月份的第一天。调用 `plusDays` 会产生一个新的 `LocalDate` 对象，在第二次赋值后，`date` 变量指向了这个新对象。那么第一个对象发生了什么呢？\n\
  \n由于不再有对第一个对象的引用，因此它不再被需要。最终，`garbage collector`（垃圾回收器）将回收该内存并供重复使用。在 Java 中，这个过程是完全自动的，程序员永远不需要担心释放内存。\n\
  \n## 2.2 实现类\n\n现在让我们转向实现自己的类。为了展示各种语言规则，我使用了一个经典的 `Employee`（员工）类作为示例。员工有一个姓名和工资。在这个例子中，姓名不能更改，但员工经常可以获得实至归的加薪。\n\
  \n### 2.2.1 实例变量\n\n通过对员工对象的描述，你可以看到此类对象的状态是由两个值描述的：`name` 和 `salary`。在 Java 中，你使用\
  \ `instance variables`（实例变量）来描述对象的状态。它们在类中这样声明：\n\n```java\npublic class Employee\
  \ {\n    private String name;\n    private double salary;\n    ...\n}\n```\n\n这意味着\
  \ `Employee` 类的每个对象或 `instance`（实例）这两个变量。\n\n在 Java 中，实例变量通常被声明为 `private`。这意味着只有同一类的方法可以访问它们。这种保护是有价值的，原因有两个：你可以控制程序的哪些部分可以修改变量，并且你可以在任何时候更改内部表示。例如，你可能将员工存储在数据库中，只在对象中保留主键。只要你重新实现方法并使其工作方式与之前相同，该类的用户就不会介意。\n\
  \n### 2.2.2 方法头\n\n现在让我们实现 `Employee` 类的方法。当你声明一个方法时，你需要提供它的名称、参数的类型和名称以及返回类型，如下：\n\
  \n点击此处查看代码图片\n\n```java\npublic void raiseSalary(double byPercent)\n```\n\n该方法接收一个类型为\
  \ `double` 的参数并且不返回任何值，如返回类型 `void` 所示。\n\n`getName` 方法具有不同的签名：\n\n```java\npublic\
  \ String getName()\n```\n\n该方法没有参数并返回一个 `String`。\n\n***\n\n![Image](img/00005.jpeg)\
  \ 备注\n\n大多数方法被声明为 `public`，这意味着任何人都可以调用此类方法。有时，辅助方法被声明为 `private`，这限制了它只能在同一类的其他方法中使用。对于与类用户不相关的方法，你应该这样做，特别是当这些方法依赖于实现细节时。如果实现发生发生变化，你可以安全地更改或删除私有方法。\n\
  \n***\n\n### 2.2.3 方法体\n\n在方法头之后，你提供方法体：\n\n点击此处查看代码图片\n\n```java\npublic void raiseSalary(double\
  \ byPercent) {\n    double raise = salary * byPercent / 100;\n    salary += raise;\n\
  }\n```\n\n如果方法产生一个值，请使用 `return` 关键字：\n\n```java\npublic String getName() {\n  \
  \  return name;\n}\n```\n\n将方法声明放在类声明内部：\n\n点击此处查看代码图片\n\n```java\npublic class\
  \ Employee {\n    private String name;\n    private double salary;\n    public void\
  \ raiseSalary(double byPercent) {\n        double raise = salary * byPercent / 100;\n\
  \        salary += raise;\n    }\n    public String getName() {\n        return\
  \ name;\n    }\n    ...\n}\n```\n\n### 2.2.4 实例方法调用\n\n考虑这个方法调用的示例：\n\n```java\n\
  fred.raiseSalary(5);\n```\n\n在此次调用中，参数 `5` 用于初始化参数变量 `byPercent`，等同于赋值：\n\n```java\n\
  double byPercent = 5;\n```\n\n然后发生了以下操作：\n\n点击此处查看代码图片\n\n```java\ndouble raise\
  \ = fred.salary * byPercent / 100;\nfred.salary += raise;\n```\n\n注意，`salary` 实例变量应用于调用方法的实例上。\n\
  \n与你在上一章末尾看到的方法不同，像 `raiseSalary` 这样的方法是在类的实例上操作。在 Java 中，所有未声明为 `static` 的方法都是\
  \ `instance methods`（实例方法）。\n\n### 2.2.5 this 引用\n\n当在对象上调用方法时，`this` 被设置为该对象。如果你愿意，可以在实现中使用\
  \ `this`：\n\n点击此处查看代码图片\n\n```java\npublic void raiseSalary(double byPercent) {\n\
  \    double raise = this.salary * byPercent / 100;\n    this.salary += raise;\n\
  }\n```\n\n一些程序员喜欢这种风格，因为它清晰地区分了局部变量和实例变量。例如：\n\n```java\npublic void setSalary(double\
  \ salary) {\n    this.salary = salary;\n}\n```\n\n### 2.2.6 值传递\n\n当你向方法传递一个对象时，方法获得的是对象引用的副本。通过这个引用，它可以访问或修改对象。例如：\n\
  \n点击此处查看代码图片\n\n```java\npublic class EvilManager {\n    private Random generator;\n\
  \    ...\n    public void giveRandomRaise(Employee e) {\n        double percentage\
  \ = 10 * generator.nextDouble();\n        e.raiseSalary(percentage);\n    }\n}\n\
  ```\n\n考虑调用：\n\n```java\nboss.giveRandomRaise(fred);\n```\n\n引用 `fred` 被复制到参数变量\
  \ `e`。方法修改了两个引用共享的对象。\n\n在 Java 中，你永远无法编写更新基本类型参数的方法。试图增加 `double` 值的方法是无效的：\n\n\
  点击此处查看代码图片\n\n```java\npublic void increaseRandomly(double x) { // 无效\n    double\
  \ amount = x * generator.nextDouble();\n    x += amount;\n}\n```\n\n如果你调用\n\n```java\n\
  boss.increaseRandomly(sales);\n```\n\n那么 `sales` 被复制到 `x`。然后 `x` 增加了，但并没有改变 `sales`。参数变量随后离开作用域，增加没有留下任何有用的效果。\n\
  \n\n\n\n\n由于同样的原因，无法编写一个将对象引用更改为其他内容的方法。例如，这个方法的作用并不如预期所示：\n\n点击此处查看代码图像\n\n```java\n\
  public class EvilManager {\n    ...\n\n    public void replaceWithZombie(Employee\
  \ e) {\n        e = new Employee(\"\", 0);\n    }\n}\n```\n\n在调用时：\n\n```java\n\
  boss.replaceWithZombie(fred);\n```\n\n引用 `fred` 被复制到变量 `e` 中，然后 `e` 被设置为不同的引用。当方法退出时，`e`\
  \ 离开了作用范围。在此过程中，`fred` 从未被改变。\n\n* *\n\n![Image](img/00005.jpeg) Note\n\n有些人说 Java\
  \ 对对象使用了“按引用传递”（call by reference）。正如第二个示例所示，事实并非如此。在支持按引用传递的语言中，方法可以替换传递它的变量的内容。在\
  \ Java 中，所有参数——包括对象引用和基本类型值——都是按值传递的。\n\n* *\n\n## 2.3 对象构造\n\n完成 `Employee` 类还剩最后一步：我们需要提供一个构造函数，详见后续章节。\n\
  \n### 2.3.1 实现构造函数\n\n声明构造函数与声明方法相似。然而，构造函数的名称与类名相同，且没有返回类型。\n\n点击此处查看代码图像\n\n```java\n\
  public Employee(String name, double salary) {\n    this.name = name;\n    this.salary\
  \ = salary;\n}\n```\n\n* *\n\n![Image](img/00005.jpeg) Note\n\n这个构造函数是公共的（public）。私有构造函数有时也用。例如，`LocalDate`\
  \ 类没有公共构造函数。相反，该类的用户通过“工厂方法”（如 `now` 和 `of`）获取对象。这些方法会调用一个私有构造函数。\n\n* *\n\n* *\n\
  \n![Image](img/00009.jpeg) Caution\n\n如果你不小心指定了返回类型 `void`\n\n点击此处查看代码图像\n\n```java\n\
  public void Employee(String name, double salary)\n```\n\n那么你声明的是一个名为 `Employee`\
  \ 的方法，而不是构造函数！\n\n* *\n\n当你使用 `new` 运算符时，会执行构造函数。例如，表达式\n\n点击此处查看代码图像\n\n```java\n\
  new Employee(\"James Bond\", 500000)\n```\n\n会分配一个 `Employee` 类的对象并调用构造函数体，构造函数体会将实例变量设置为构造函数中提供的参数。\n\
  \n`new` 运算符返回一个指向所构造对象的引用。你通常希望将该引用保存在变量中：\n\n点击此处查看代码图像\n\n```java\nEmployee james\
  \ = new Employee(\"James Bond\", 500000);\n```\n\n或者将其传递给方法：\n\n点击此处查看代码图像\n\n```java\n\
  ArrayList<Employee> staff = new ArrayList<>();\nstaff.add(new Employee(\"James Bond\"\
  , 500000));\n```\n\n### 2.3.2 重载\n\n你可以提供多个版本的构造函数。例如，如果你想方便地为无名的工蜂建模，可以提供一个只接受薪资的第二个构造函数。\n\
  \n点击此处查看代码图像\n\n```java\npublic Employee(double salary) {\n    this.name = \"\"\
  ;\n    this.salary = salary;\n}\n```\n\n现在 `Employee` 类有两个构造函数。调用哪一个取决于提供的参数。\n\n\
  点击此处查看代码图像\n\n```java\nEmployee james = new Employee(\"James Bond\", 500000);\n\
  // 调用 Employee(String, double) 构造函数\nEmployee anonymous = new Employee(40000);\n\
  // 调用 Employee(double) 构造函数\n```\n\n在这种情况下，我们称构造函数被重载了。\n\n* *\n\n![Image](img/00005.jpeg)\
  \ Note\n\n如果一个方法有多个名称相同但参数不同的版本，则该方法被重载。例如，`println` 方法有参数为 `int`、`double`、`String`\
  \ 等重载版本。由于你无法选择构造函数的名称，因此重载构造函数是常见做法。\n\n* *\n\n### 2.3.3 从一个构造函数调用另一个\n\n当存在多个构造函数时，它们通常会有一些共同的工作，最好不要重复这些代码。通常可以将这些共同的初始化放在一个构造函数中。\n\
  \n你可以从一个构造函数调用另一个，但只能作为构造函数体的第一条语句。惊讶的是，你并不使用类名，而是使用 `this`：\n\n点击此处查看代码图像\n\n```java\n\
  public Employee(double salary) {\n    this(\"\", salary); // 调用 Employee(String,\
  \ double)\n    // 其他语句可以后续\n}\n```\n\n![Image](img/00005.jpeg) Note\n\n这里 `this`\
  \ 是指向所构造对象的引用。\n\n* *\n\n### 2.3.4 默认初始化\n\n如果你不在构造函数中显式设置实例变量，它会被自动设置为默认值：数字为 `0`，布尔值为\
  \ `false`，对象引用为 `null`。例如，假设我们没有在 `Employee(String)` 构造函数中设置 `name`：\n\n```java\n\
  public Employee(String name) {\n    this.salary = salary;\n}\n```\n\n如果有人调用 `getName`\
  \ 方法，将会得到空指针异常。如下条件就会导致空指针异常](part0025_split_027.html_p066pro02a)\n\n```java\nif\
  \ (e.getName().equals(\"James Bond\"))\n    // ...\n```\n\n在这方面，实例变量与局部变量非常不同。\n\
  \n* *\n\n![Image](img/00005.jpeg) Note\n\n记得你必须显式初始化局部变量。\n\n* *\n\n### 2.3.5 实例变量初始化\n\
  \n你可以为任何实例变量指定初始值，如下：\n\n```java\npublic class Employee {\n    private String name\
  \ = \"\";\n    ...\n}\n```\n\n这种初始化发生在对象分配之后、构造函数运行之前。因此，初始值在所有构造函数中都存在。当然，某些构造函数可能会覆盖它。\n\
  \n除了在声明时初始化实例变量，你可以在类声明中包含初始化块。\n\n点击此处查看代码图像\n\n```java\npublic class Employee()\
  \ {\n    private String name = \"\";\n    private int id;\n    private double salary;\n\
  \n    { // 初始化块\n        Random generator = new Random();\n        id = 1 + generator.nextInt(1_000_000);\n\
  \    }\n\n    public Employee(String name, double salary) {\n        ...\n    }\n\
  }\n```\n\n* *\n\n![Image](img/00005.jpeg) Note\n\n这不是常用的特性。大多数程序员会将复杂的初始化代码放在辅助方法中并在构造函数进行调用。\n\
  \n* *\n\n### 2.3.6 final 实例变量\n\n你可以将实例变量声明为 `final`。此类变量必须在每个构造函数结束时完成初始化。此后，该变量可能不再被修改。例如，`Employee`\
  \ 类的 `name` 变量可以声明为 `final`，因为它在对象构造后永远不会改变——没有 `setName` 方法。\n\n点击此处查看代码图像\n\n\n\
  \n\n\n```java\npublic class Employee {\n    private final String name;\n    ...\n\
  }\n```\n\n![Image](img/00005.jpeg) 注意\n\n当与可变对象的引用一起使用时，`final` 修饰符仅表示引用永远不会改变。修改该对象是完全合法的。\n\
  \n点击此处查看代码图像\n\n```java\npublic class Person {\n    private final ArrayList<Person>\
  \ friends = new ArrayList<>();\n    // 可以向此数组列表添加元素\n    ...\n}\n```\n\n方法可能会修改\
  \ `friends` 所引用的数组列表，但它们永远不能将其替换为另一个。特别是，它永远不会变成 `null`。\n\n### 2.3.7 无参数构造函数\n\n\
  许多类都包含一个无参数的构造函数，该构造函数创建一个其状态被设置为适当默认值的对象。例如，这里是 `Employee` 类的无参数构造函数：\n\n```java\n\
  public Employee() {\n    name = \"\";\n    salary = 0;\n}\n```\n\n就像为穷人提供公共辩护人一样，没有构造函数的类会自动获得一个无所事事的无参数构造函数。除非它们已经过初始化，否则所有实例变量都将保持它们的默认值（`zero`、`false`、`null`）。因此，每个类都至少有一个构造函数。\n\
  \n![Image](img/00005.jpeg) 注意\n如果一个类已经有一个构造函数了，它就不会自动获得另一个无参数的构造函数。如果你提供了一个构造函数同时也想要一个无参数构造函数，你必须手动编写它。\n\
  \n![Image](img/00005.jpeg) 注意\n在前面的章节中，你看到了对象被构造时会发生什么。在某些编程语言中（特别是 C++），指定对象被销毁时发生什么是很常见的。Java\
  \ 确实有一种机制在对象被垃圾回收器回收时对其进行“最终化”。但这种情况发生的时间是预测的，因此你不应该使用它。然而，正如你在第 5 章 中看到的，有一种关闭如文件等资源的机制。\n\
  \n## 2.4 静态变量和方法\n\n在你看到的所有示例程序中，`main` 方法都标记了 `static` 修饰符。在接下来的章节中，你将学习这个修饰符的含义。\n\
  \n### 2.4.1 静态变量\n\n如果你在类中声明一个变量为 `static`，那么每个类只有一个变量。相比之下，每个对象都有它们自己的实例变量副本。例如，假设我们想给每个员工分配一个独特的\
  \ ID。那么我们可以共享已给出的 `lastId`。\n\n点击此处查看代码图像\n\n```java\npublic class Employee {\n\
  \    private static int lastId = 0;\n    private int id;\n    ...\n    public Employee()\
  \ {\n        lastId++;\n        id = lastId;\n    }\n}\n```\n\n每个 `Employee` 对象都有它们自己的实例变量\
  \ `id`，但只有一个属于类的 `lastId` 变量，而不属于该类的任何特定实例。当一个新的 `Employee` 对象被构造时，共享的 `lastId`\
  \ 变量会加 ，并且 `id` 实例变量被设置为该值。因此，每个员工都获得一个独特的 `id` 值。\n\n![Image](img/00009.jpeg) 注意\n\
  如果 `Employee` 对象可以在多个线程中并发构造，那么这段代码将无法工作。第 10 章 展示了如何解决这个问题。\n\n![Image](img/00005.jpeg)\
  \ 注意\n你可能会疑惑为什么一个属于类而不是单个实例的变量被命名为“static”。这个术语是从 C++ 留下的一个没有意义的遗留，它借用了 C 语言中无关用途的关键字，而不是想出一个更合适的词。更具描述性的术语是“类变量”（class\
  \ variable）。\n\n### 2.4.2 静态常量\n\n可变的静态变量很少见，但静态常量（即 `static final` 变量）非常常见。例如，`Math`\
  \ 类声明了一个静态常量：\n\n点击此处查看代码图像\n\n```java\npublic class Math {\n    ...\n    public\
  \ static final double PI = 3.14159265358979323846;\n    ...\n}\n```\n\n你可以在程序中使用\
  \ `Math.PI` 来访问此常量。如果没有 `static` 关键字，`PI` 将会是 `Math` 类的实例变量。也就是说，你需要该类的对象来访问 `PI`，并且每个\
  \ `Math` 对象都将拥有自己的 `PI` 副本。\n\n这是一个静态 `final` 变量的示例，它是一个对象而不是数字。每次想要一个随机数时都构造一个新的随机数生成器既浪费资源又不安全。你最好在类的所有实例之间共享同一个生成器。\n\
  \n点击此处查看代码图像\n\n```java\npublic class Employee {\n    private static final Random\
  \ generator = new Random();\n    private int id;\n    ...\n    public Employee()\
  \ {\n        id = 1 + generator.nextInt(1_000_000);\n    }\n}\n```\n\n另一个静态常量的例子是\
  \ `System.out`。\n\n点击此处查看代码图像\n\n```java\npublic class System {\n    public static\
  \ final PrintStream out;\n    ...\n}\n```\n\n![Image](img/00009.jpeg) 注意\n尽管 `out`\
  \ 在 `System` 类中被声明为 `final`，但 Java 中有一种“原生”方法 `setOut`，这是你不太可能遇到的。\n\n### 2.4.3\
  \ 静态块\n\n在前面的章节中，静态变量是在它们声明时初始化的。有时你需要执行额外的工作。你可以将其放在静态块中。\n\n点击此处查看代码图像\n\n```java\n\
  public class CreditForm {\n    private static final ArrayList<Integer> expirationYear\
  \ = new ArrayList<>();\n    static {\n        // 向列表添加年份\n        int year = LocalDate.now().getYear();\n\
  \        for (int i = year; i <= year + 20; i++) {\n            expirationYear.add(i);\n\
  \        }\n    }\n    ...\n}\n```\n\n静态初始化发生在类首次加载时。与实例变量一样，除非显式地设置了它们，否则静态变量是\
  \ `0`、`false` 或 `null`。所有静态初始化和静态块按照它们在类声明中的顺序执行。\n\n### 2.4.4 静态方法\n\n静态方法是不操作对象的方法。例如，`Math`\
  \ 类的 `pow` 方法就是静态方法。表达式 `Math.pow(x, a)` 计算 $x^a$。它不需要使用任何 `Math` 对象来完成任务。正如你在第\
  \ 1 章 中看到的，静态方法是用 `static` 修饰符声明的：\n\n点击此处查看代码图像\n\n```java\npublic class Math {\n\
  \    public static double pow(double base, double exponent) {\n        ...\n   \
  \ }\n}\n```\n\n为什么不把 `pow` 变成实例方法呢？它不能 `double` 的实例方法，因为在 Java 中，基本类型不是类。可以将其作为\
  \ `Math` 类的实例方法，但那样你需要构造一个 `Math` 对象才能调用它。\n\n静态方法的另一个常见原因是为你你不拥有的类提供额外的功能。例如，如果有一个方法可以在给定范围内产生随机整数，那该有多好？你无法为标准库中的\
  \ `Random` 类添加方法。但你可以提供一个静态方法：\n\n```java\npublic class RandomNumbers {\n    public\
  \ static int nextInt(Random generator, int low, int high) {\n```\n\n\n\n\n\n```java\n\
  return low + generator.nextInt(high - low + 1);\n}\n}\n```\n\n如下所示调用此方法\n\n点击此处查看代码图像\n\
  \n`int dieToss = RandomNumbers.nextInt(gen, 1, 6);`\n\n* * *\n\n![Image](img/00005.jpeg)\
  \ 注意\n\n在对象上调用静态方法是合法的。例如，与其调用 `LocalDate.now()` 来获取今天的日期，不如在 `LocalDate` 类的对象 `date`\
  \ 上上调用 `date.now()`。但这并没有什么意义。`now` 方法并没有查看 `date` 对象来计算结果。大多数 Java 程序员会认为这种写法很糟糕。\n\
  \n* * *\n\n由于静态方法不作用于特定对象，因此你无法从静态方法中访问实例变量。然而，静态方法可以访问其所在类中的静态变量。例如，在 `RandomNumbers.nextInt`\
  \ 方法中，我们可以将随机数生成器设置为静态变量：\n\n点击此处查看代码图像\n\n```java\npublic class RandomNumbers {\n\
  \    private static Random generator = new Random();\n\n    public static int nextInt(int\
  \ low, int high) {\n        return low + generator.nextInt(high - low + 1);\n  \
  \      // 可以访问静态 generator 变量\n    }\n}\n```\n\n### 2.4.5 工厂方法\n\n静态方法的一个常见用途是*工厂方法*，即返回该类新实例的静态方法。例如，`NumberFormat`\
  \ 类使用工厂方法来为各种样式产生格式化对象。\n\n点击此处查看代码图像\n\n`NumberFormat currencyFormatter = NumberFormat.getCurrencyInstance();`\n\
  \n`NumberFormat percentFormatter = NumberFormat.getPercentInstance();`\n\n`double\
  \ x = 0.1;`\n\n`System.out.println(currencyFormatter.format(x)); // 输出 $0.10`\n\n\
  `System.out.println(percentFormatter.format(x)); // 输出 10%`\n\n为什么不使用构造函数呢？区分两个构造函数的唯一方法是它们的参数类型。你不能拥有两个无参数的构造函数。\n\
  \n此外，构造函数 `new NumberFormat(...)` 会产生一个 `NumberFormat`。而工厂方法可以返回子类的对象。事实上，这些工厂方法返回的是\
  \ `DecimalFormat` 类的实例。（有关子类的更多信息请参见第 4 章。）\n\n工厂方法还可以返回一个共享对象，而不是不必要地构建新对象。例如，调用\
  \ `Collections.emptyList()` 返回一个共享的不可变空列表。\n\n### 2.5 包\n\n在 Java 中，你将相关的类放在一个包中。包有助于组织你的工作，并将其与他人提供的代码库分开。正如你所看到的，标准\
  \ Java 库分布在多个包中，包括 `java.lang`、`java.util`、`java.math` 等。\n\n使用包的主要原因是为了保证类名的唯一性。假设两个程序员想出了一个好主意，提供一个\
  \ `Element` 类。（事实上，仅在 Java API 中就有至少五位开发者产生过这个主意。）\n\n只要他们都将类放在不同的包中，就不会发生冲突。\n\n\
  在接下来的章节中，你将学习如何使用包。\n\n### 2.5.1 包声明\n\n包名是用点分隔的标识符列表，例如 `java.util.regex`。\n\n\
  为了保证包名的唯一性，使用反转的互联网域名（已知是唯一的）是一个好主意。例如，我拥有域名 `horstmann.com`。对于我的项目，我使用如 `com.horstmann.corejava`\
  \ 等包名。这个规则的一个主要例外是标准 Java 库，其包名以 `java` 或 `javax` 开头。\n\n* * *\n\n![Image](img/00005.jpeg)\
  \ 注意\n\n在 Java 中，包是不嵌套的。例如，`java.util` 和 `java.util.regex` 包之间没有任何关系。每个都是自己独立的类集合。\n\
  \n* * *\n\n要将类放在包中，你需要在源文件的第一条语句添加 `package` 语句：\n\n点击此处查看代码图像\n\n```java\npackage\
  \ com.horstmann.corejava;\n\npublic class Employee {\n    ...\n}\n```\n\n现在 `Employee`\
  \ 类位于 `com.horstmann.corejava` 包中，它的*全限定名*是 `com.horstmann.corejava.Employee`。\n\
  \n还有一个没有名字的*默认包*，你可以将其用于简单的程序。要将类添加到默认包中，不要提供 `package` 语句。然而，不建议使用默认包。\n\n当从文件系统读取类文件时，路径名与包名匹配。例如，`Employee.class`\
  \ 必须位于子目录 `horstmann` 中。\n\n当从文件系统读取类文件时，路径名与包名匹配。例如，`Employee.class` 必须位于子目录 `horstmann`\
  \ 中。\n\n假设 `Employee` 是类。\n\n点击此处查看代码图像\n\n`javac horstmann/Employee.java`\n\n编译器生成\
  \ `horstmann/Employee.class`。然后通过指定全限定名来运行程序：\n\n点击此处查看代码图像\n\n`java horstmann.Employee`\n\
  \n* * *\n\n![Image](img/00005.jpeg) 注意\n\n如果源文件不在与其包名相同的子目录中，`javac` 将报错并在当前目录生成类文件。\n\
  \n* * *\n\n![Image](img/00013.jpeg) 提示\n\n使用 `javac` 配合 `-d` 选项是一个好主意。然后。\n\n####\
  \ 2.5.2 类路径\n\n与其在文件系统中存储类文件，不如将它们放入一个或多个名为 JAR 的存档文件中。可以使用 JDK 中的 `jar` 工具创建这样的存档。\n\
  \n点击此处查看代码图像\n\n`jar cvf library.jar com/mycompany/*.class`\n\n这通常用于包。\n\n* * *\n\
  \n![Image](img/00005.jpeg) 注意\n\n默认情况下，JAR 文件使用 ZIP 格式。还有一种压缩方案称为“pack200”，它旨在更有效地压缩类文件。\n\
  \n* * *\n\n![Image](img/00013.jpeg) 提示\n\n你可以使用 JAR 文件封装程序，而不仅仅是库。使用\n\n点击此处查看代码图像\n\
  \n`jar cvfe program.jar com.mycompany.MainClass com/mycompany/*.class`\n\n然后运行程序\n\
  \n`java -jar program.jar`\n\n* * *\n\n当项目中使用库 JAR 文件时，你需要通过指定*类路径*来告诉编译器和虚拟机这些文件在哪里。类路径可以包含\n\
  \n• 包含类文件的目录（与其包名相同的子目录）\n\n• JAR 文件\n\n• 包含 JAR 目录\n\n`javac` 和 `java` 程序都有 `-classpath`\
  \ 选项，你可以简写为 `-cp`。例如，\n\n点击此处查看代码图像\n\n`java -classpath .:../libs/lib1.jar:../libs/lib2.jar\
  \ com.mycompany.MainClass`\n\n此类路径有三个元素：当前目录（`.`）以及位于 `../libs` 目录的两个 JAR 文件。\n\n\
  * * *\n\n在 Windows 上，使用分号代替冒号分隔路径元素：\n\n点击此处查看代码图像\n\n`java -classpath ....\\libs\\\
  lib1.jar;..\\libs\\lib2.jar com.mycompany.MainClass`\n\n\n\n\n\n如果你有许多 JAR 文件，将它们都放在一个目录中并使用通配符包含所有文件：\n\
  \n点击此处查看代码图像\n\n```\njava -classpath .:../libs/\\* com.mycompany.MainClass\n```\n\
  \n* * *\n\n![Image](img/00005.jpeg) 备注\n\n在 Unix 中，`*` 必须经过转义以防止 shell 扩展。\n\n*\
  \ * *\n\n* * *\n\n![Image](img/00009.jpeg) 注意\n\n`javac` 编译器始终会在当前目录中查找文件，但 `java`\
  \ 程序只有在 `.` 目录位于类路径上时才会查找当前目录。如果你没有设置类路径，这并不是问题——默认类路径包含 `.` 目录。但如果你设置了类路径却忘记包含\
  \ `.` 目录，你的程序将可以通过编译而不报错，但无法运行。\n\n* * *\n\n使用 `-classpath` 选项是设置类路径的首选方法。另一种方法是使用\
  \ `CLASSPATH` 环境变量。具体取决于你使用的 shell。如果你使用 `bash`，可以使用如下命令：\n\n点击此处查看代码图像\n\n```bash\n\
  export CLASSPATH=.:/home/username/project/libs/\\*\n```\n\n在 Windows 中，它是这样的：\n\n\
  点击此处查看代码图像\n\n```cmd\nSET CLASSPATH=.;C:\\Users\\username\\project\\libs\\*\n```\n\
  \n* * *\n\n![Image](img/00009.jpeg) 注意\n\n你可以全局设置 `CLASSPATH` 环境变量（例如，在 `.bashrc`\
  \ 或 Windows 控制面板中）。然而，许多程序员在忘记这个全局设置后对此感到追悔莫，并对发现自己的类未被找到时感到非常惊讶。\n\n* * *\n\n*\
  \ * *\n\n![Image](img/00009.jpeg) 注意\n\n有些人建议完全跳过类路径，方法是将将所有 JAR 文件丢入 `jre/lib/ext`\
  \ 目录，这是一个虚拟机会为了查找“已安装扩展”而查询的特殊目录。这真的是非常糟糕的建议，原因有两个：手动加载类的代码在放置于扩展目录时无法正常工作。此外，程序员们比记住\
  \ `CLASSPATH` 环境变量更难记住晦涩的 `jre/lib/ext` 目录——当类加载器通过从扩展目录加载被遗忘已久的类而忽略了他们精心设计的类路径时，他们会抓耳挠腮。\n\
  \n* * *\n\n### 2.5.3 包作用域 (Package Scope)\n\n你已经遇到过访问修饰符 `public` 和 `private`。标记为\
  \ `public` 的功能可以被任何类使用。`private` 功能只能被声明它的类使用。如果你既没有指定 `public` 没有指定 `private`，该功能（即类、方法或变量）可以被同一个包中的所有方法访问。\n\
  \n包作用域对于工具类和方法非常有用，这些方法被包的方法需要，但对包的用户没有吸引。另一个常见用例是测试。你可以将测试类放在同一个包中，然后它们就可以访问被测试类的内部实现。\n\
  \n* * *\n\n![Image](img/00005.jpeg) 备注\n\n一个源文件可以包含多个类，但最多只有一个类可以声明为 `public`。如果一个源文件有一个公共类，它的名称必须与类名匹配。\n\
  \n* * *\n\n对于变量来说，遗憾的是包作用域是默认的。一个常见的错误是忘记了 `private` 修饰符，无意中让一个实例变量对整个包可见。这里有一个来自\
  \ `java.awt` 包中 `Window` 类的示例：\n\n点击此处查看代码图像\n\n```java\npublic class Window extends\
  \ Container {\n    String warningString;\n    ...\n}\n```\n\n由于 `warningString`\
  \ 变量不是 `private` 的，`java.awt` 包中所有类的方法都可以访问它。实际上，除了 `Window` 类本身的方法外，没有其他方法这样做，所以程序员很可能只是忘记了\
  \ `private` 修饰符。\n\n这可能导致一个安全问题，因为包是开放的。任何类都可以通过提供相应的 `package` 语句将自己添加到一个包中。\n\n\
  Java 实现者通过配置 `ClassLoader` 类来保护自己免受此类攻击，使其不会加载任何全限定名以 `java` 开头的类。\n\n如果你想为你自己的包提供类似的保护，你需要将它们放入一个*密封的\
  \ (sealed)* JAR 文件。提供一个*清单 (manifest)*，一个包含以下条目的纯文本文件：\n\n```text\nName: com/mycompany/util/\n\
  Sealed: true\n\nName: com/mycompany/misc/\nSealed: true\n```\n\n然后这样运行 `jar` 命令：\n\
  \n点击此处查看代码图像\n\n```bash\njar cvfm library.jar manifest.txt com/mycompany/*/*.class\n\
  ```\n\n### 2.5.4 导入类 (Importing Classes)\n\n`import` 语句允许你在无需全限定名的情况下使用类。例如，当你使用\n\
  \n```java\nimport java.util.Random;\n```\n\n那么你可以在代码中编写 `Random` 而不是 `java.util.Random`。\n\
  \n\n\n\n\n在上一节中，你已经学习了如何将类组织到包中。或者，你可以将一个类放在另一个类内部。这种类被称为`嵌套类`（nested class）。这可以用于限制可见性，或者避免用\
  \ `Element`、`Node` 或 `Item` 等通用名称弄乱包的结构。Java 有两种嵌套类，它们的行为略有不同。让我们在接下来的章节中检查这两种。\n\
  \n### 2.6.1 静态嵌套类\n\n考虑一个用于项目计费的 `Invoice` 类，每个项目都有描述、数量和单价。我们可以将 `Item` 变成一个嵌套类：\n\
  \n点击此处查看代码图片\n\n```java\npublic class Invoice {\n    private static class Item {\
  \ // Item 嵌套在 Invoice 内部\n        String description;\n        int quantity;\n \
  \       double unitPrice;\n        double price() { return quantity * unitPrice;\
  \ }\n    }\n    private ArrayList<Item> items = new ArrayList<>();\n    ...\n}\n\
  ```\n\n在下一节之前，我们还不清楚为什么这个内部类被声明为 `static`。现在，先接受它。\n\n`Item` 类除了访问控制外没有特别之处。该类在\
  \ `Invoice` 中是私有的，所以只有 `Invoice` 方法可以访问它。出于如此，我没有费心将内部类的实例变量设为私有。\n\n这是一个构造内部类对象方法的示例：\n\
  \n点击此处查看代码图片\n\n```java\npublic class Invoice {\n    ...\n    public void addItem(String\
  \ description, int quantity, double unitPrice) {\n        Item newItem = new Item();\n\
  \        newItem.description = description;\n        newItem.quantity = quantity;\n\
  \        newItem.unitPrice = unitPrice;\n        items.add(newItem);\n    }\n}\n\
  ```\n\n一个类可以将嵌套类设为公共。在这种情况下，人们会想要使用常用的封装机制。\n\n点击此处查看代码图片\n\n```java\npublic class\
  \ Invoice {\n    public static class Item { // 一个公有嵌套类\n        private String description;\n\
  \        private int quantity;\n        private double unitPrice;\n        public\
  \ Item(String description, int quantity, double unitPrice) {\n            this.description\
  \ = description;\n            this.quantity = quantity;\n            this.unitPrice\
  \ = unitPrice;\n        }\n        public double price() { return quantity * unitPrice;\
  \ }\n        ...\n    }\n    private ArrayList<Item> items = new ArrayList<>();\n\
  \    public void add(Item item) { items.add(item); }\n    ...\n}\n```\n\n现在，任何人都可以通过使用限定名\
  \ `Invoice.Item` 来构造 `Item` 对象：\n\n点击此处查看代码图片\n\n```java\nInvoice.Item newItem =\
  \ new Invoice.Item(\"Blackwell Toaster\", 2, 19.95);\nmyInvoice.add(newItem);\n\
  ```\n\n这个 `Invoice.Item` 类与在任何其他类之外声明的 `InvoiceItem` 类在本质上没有区别。嵌套类只是让 `Item` 类代表发票中的项目这一点变得显而易见。\n\
  \n### 2.6.2 内部类\n\n在上一节中，你看到了一个声明为 `static` 的嵌套类。在本节中，你将看到去掉 `static` 修饰符会发生什么。这类类被称为`内部类`（inner\
  \ classes）。\n\n考虑一个社交网络，每个成员的朋友也是成员。\n\n点击此处查看代码图片\n\n```java\npublic class Network\
  \ {\n    public class Member { // Member 是 Network 的一个内部类\n        private String\
  \ name;\n        private ArrayList<Member> friends;\n        public Member(String\
  \ name) {\n            this.name = name;\n            friends = new ArrayList<>();\n\
  \        }\n        ...\n    }\n    private ArrayList<Member> members;\n    ...\n\
  }\n```\n\n去掉 `static` 修饰符后，存在一个本质的区别。`Member` 对象知道它属于哪个网络。让我们看看它是如何工作的。首先，这里有一个向网络添加成员的方法：\n\
  \n点击此处查看代码图片\n\n```java\npublic class Network {\n    ...\n    public Member enroll(String\
  \ name) {\n        Member newMember = new Member(name);\n        members.add(newMember);\n\
  \        return newMember;\n    }\n}\n```\n\n到目前为止，似乎并没有发生什么。我们可以添加一个成员并获取它的引用。\n\
  \n点击此处查看代码图片\n\n```java\nNetwork myFace = new Network();\nNetwork.Member fred =\
  \ myFace.enroll(\"fred\");\n```\n\n现在，假设 Fred 认为这个网络不再火热了，他想离开。`fred.leave();`。这里是\
  \ `leave` 方法的实现：\n\n点击此处查看代码图片\n\n```java\npublic class Network {\n    public class\
  \ Member {\n        ...\n        public void leave() {\n            members.remove(this);\n\
  \        }\n    }\n    private ArrayList<Member> members;\n    ...\n}\n```\n\n（注：此处根据上下文代码块逻辑进行了对齐翻译，原文描述在代码块处有断开，但逻辑保持一致）\n\
  \n\n\n\n你可以在外部类的任何实例上调用内部类的构造函数：\n\n点击此处查看代码图像\n\n```\nNetwork.Member wilma = myFace.new\
  \ Member(\"Wilma\");\n```\n\n![Image](img/00005.jpeg) 备注\n\n内部类不能声明除编译时常量以外的静态成员。这会在“静态（static）”的含义上产生歧义。它是指虚拟机中只有一个实例吗？还是每个外部对象只有一个实例？语言设计者们决定不解决这个问题。\n\
  \n![Image](img/00005.jpeg) 备注\n\n由于历史上的偶然，内部类是在虚拟机规范被认为已经完成的时期被添加到 Java 语言中的，因此它们被翻译成普通类，并带有一个引用所包类实例的隐藏实例变量。练习\
  \ 14 邀请你去探索这种转换过程。\n\n![Image](img/00005.jpeg) 备注\n\n`局部类（Local classes）`是内部类的另一种变体，我们将在第\
  \ 3 章 中讨论。\n\n### 2.7 文档注释\n\nJDK 包含非常有用的工具，名为 `javadoc`，它可以从源文件生成 HTML 文档。事实上，我们在第\
  \ 1 章 中描述的在线 API 文档仅仅是在标准 Java 库源码上运行 `javadoc` 的结果。\n\n如果你在源码中添加以特殊分隔符 `/**` 开头的注释，你也可以轻松地生成专业的文档。这是一个非常好的方法，因为它让你将代码和文档保持在一个地方。在过去糟糕的日子里，程序员经常将文档放在单独的文件中，代码和注释发生分离只是时间问题。当文档注释与源码位于同一个文件中时，更新两者并重新运行\
  \ `javadoc` 就是一件易事。\n\n### 2.7.1 注释插入\n\n`javadoc` 工具提取以下项目的信息：\n\n- 包（Packages）\n\
  - 公有类和接口\n- 公有和保护的变量\n- 公有和保护的构造函数和方法\n\n接口在第 3 章引入，保护特性在第 4 章引入。\n\n你可以（也应该）为这些特征中的每一个提供注释。每个注释都放在在其描述的特征上方。注释以\
  \ `/**` 开头，以 `*/` 结束。\n\n每个 `/** ... */` 文档注释包含自由格式文本，随后是标签。标签以 `@` 开头，例如 `@author`\
  \ 或 `@param`。\n\n自由格式文本的`第一句`应该是一个摘要语句。`javadoc` 工具会自动生成提取这些句子的摘要页面。\n\n在自由格式文本中，你可以使用\
  \ HTML 修饰符，例如用 `<em>...</em>` 用于强调，`<code>...</code>` 用于等宽“打字机”字体，`<strong>...</strong>`\
  \ 用于加粗，甚至可以使用 `<img ...>` 来包含图像。然而，你应该避开标题 `<h*n>` 或水平线 `<hr>`，因为它们可能会干扰文档的格式。\n\
  \n![Image](img/00005.jpeg) 备注\n\n如果你的注释中包含指向其他文件的链接（例如图表或用户界面组件图像），请将这些文件放入源文件所在目录的子目录下，命名为\
  \ `doc-files`。`javadoc` 工具会将 `doc-files` 目录及其内容从源目录复制到文档目录。你需要在链接中指定 `doc-files`\
  \ 目录，例如 `<img src=\"doc-files/uml.png\" alt=\"UML 图表\"/>`。\n\n### 2.7.2 类注释\n\n\
  类注释必须直接放在类声明之前。你可能想用 `@author` 和 `@version` 标签来记录类的作者和版本。可以有多个作者。\n\n这是一个类注释的示例：\n\
  \n点击此处查看代码图像\n\n```java\n/**\n * 一个 Invoice 对象代表一张发票，\n * 包含订单中每个部分的行项目。\n * @author\
  \ Fred Flintstone\n * @author Barney Rubble\n * @version 1.1\n */\npublic class\
  \ Invoice {\n    ...\n}\n```\n\n![Image](img/00005.jpeg) 备注\n\n不需要在每行前面加 `*`。然而，大多数\
  \ IDE 会自动提供星号，有些甚至在换行发生变化时会重新排列它们。\n\n### 2.7.3 方法注释\n\n将每个方法注释直接放在其方法之前。对以下特征进行文档记录：\n\
  \n- 每个参数，带有注释 `@param variable 描述`\n- 返回值，如果不是 `void`：`@return 描述`\n- 任何抛出的异常（参见第\
  \ 5 章）：`@throws exceptionClass 描述`\n\n这是一个方法注释的示例：\n\n点击此处查看代码图像\n\n```java\n/**\n\
  \ * 增加员工薪资。\n * @param byPercent 增加薪资的百分比（例如，10 表示 10%）\n * @return 加薪的金额\n */\n\
  public double raise(double byPercent) {\n    double raise = salary * byPercent /\
  \ 100;\n    salary += raise;\n    return raise;\n}\n```\n\n### 2.7.4 变量注释\n\n你只需要对静态变量——通常是常量进行文档记录。例如：\n\
  \n点击此处查看代码图像\n\n```java\n/**\n * 地每年的天数（排除闰年）\n */\npublic static final int DAYS_PER_YEAR\
  \ = 365;\n```\n\n### 2.7.5 普通注释\n\n在所有文档注释中，你可以使用 `@since` 标签描述特征出现的版本：\n\n@since\
  \ version 1.7\n\n`@deprecated` 标签添加类、方法或变量不再不再使用的注释。文本应该建议一个替代方案。例如：\n\n点击此处查看代码图像\n\
  \n```java\n@deprecated 使用 setVisible(true)\n```\n\n![Image](img/00005.jpeg) 备注\n\
  \n还有一个 @Deprecated 注解，编译器在使用弃用项时发出警告——参见第 11 章。该注解没有建议替代方案的机制，因此你应该同时提供注解和弃用项的文档注释。\n\
  \n### 2.7.6 链接\n\n你可以使用 `@see` 和 `@link` 标签指向 Java 文档的其他部分或外部文档。\n\n`@see` 标签引用在“参见”部分添加一个超链接。它可以同时用于类和方法。在这里，引用可以是以下之一：\n\
  \n- `package`.`class`#`feature label`\n- `<a href=\"...\">`label`</a>`\n- `\"text\"\
  `\n\n第一种情况是最用的。你提供类、方法或变量的名称，`javadoc` 会插入指向其文档的链接。例如：\n\n点击此处查看代码图像\n\n```java\n\
  @see com.horstmann.corejava.Employee#raiseSalary(double)\n```\n\n这将指向 `com.horstmann.corejava.Employee`\
  \ 类中的 `raiseSalary(double)` 方法。你可以省略包名，或者省略包和类名。这时特征将位于当前包或类中。\n\n注意，必须使用 `#` 而不是点来分隔类与方法或变量名。Java\
  \ 编译器本身非常擅长猜测点字符作为包包、子包、类、内部类及其方法和变量分隔符的各种含义。但 `javadoc` 工具并没有那么聪明，所以你需要帮助它。\n\n\
  如果 `@see` 标签后面跟着一个 `<` 字符，说明你正在指定一个超链接。你可以链接到任何喜欢的 URL。例如：`@see <a href=\"https://en.wikipedia.org/wiki/Leap_year\"\
  >闰年</a>`。\n\n\n\n\n\n在这些情况下，你都可以指定一个可选标签，该标签将作为链接锚点。如果你省略了标签，用户将看到目标代码名称或 URL 作为锚点。\n\
  \n如果 `@see` 标签后跟着一个 `\"` 字符，引号中的文本将显示在“另见”部分。例如：\n\n点击此处查看代码图像\n\n@see \"Core Java\
  \ for the Impatient\"\n\n你可以为一个特性添加多个 `@see` 标签，但你必须将它们全部保持在一起。\n\n如果你愿意，可以在文档注释的任何位置放置指向其他类或方法的超链接。在注释中的任何地方插入如下格式的标签：\n\
  \n点击此处查看代码图像\n\n`{@link package.class#feature label}`\n\n遵循与 `@see` 标签相同的规则。\n\n\
  ## 2.7.7 包注释和概述注释\n\n类、方法和变量注释直接放置在 Java 源文件中，并用 `/** ... */` 分隔。然而，要生成包注释，你需要在每个包目录下添加一个单独的文件。\n\
  \n提供一个名为 `package-info.java` 的 Java 文件。该文件必须包含一个用 `/**` 和 `*/` 分隔的初始 javadoc 注释，随后是一个包语句。它不应包含任何进一步的代码或注释。\n\
  \n你还可以为所有源文件提供一个概述注释。将其放在名为 `overview.html` 的文件中，该文件位于包含所有源文件的父目录下。`<body>...</body>`\
  \ 标签之间的文本都会被提取。当用户从导航栏选择“概述”（Overview）时，将显示此注释。\n\n## 2.7.8 注释提取\n\n在这里，`docDirectory`\
  \ 是你希望 HTML 文件存放的目录名称。按照以下步骤操作：\n\n1. 切换到包含你要文档的源文件的目录。如果你有需要文档的嵌套包（例如 `com.horstmann.corejava`），你必须在包含子目录\
  \ `com` 的目录中工作。（如果你提供了 `overview.html` 文件，则就是包含该文件的目录。）\n\n2. 运行命令\n\n点击此处查看代码图像\n\
  \n```\njavadoc -d docDirectory package1 package2 ...\n```\n\n如果你省略了 `-d` `docDirectory`\
  \ 选项，HTML 文件将提取到当前目录。那可能会变得非常混乱，因此我不建议这样做。\n\n`javadoc` 程序可以通过许多命令行选项进行微调。例如，你可以使用\
  \ `-author` 和 `-version` 选项在文档中包含 `@author` 和 `@version` 标签。（默认情况下，它们会被省略。）另一个有用的选项是\
  \ `-link`，用于包含指向标准类的超链接。例如，如果你运行命令\n\n点击此处查看代码图像\n\n```\njavadoc -link http://docs.oracle.com/javase/8/docs/api\
  \ *.java\n```\n\n所有的标准库类都会链接到 Oracle 网站上的文档。\n\n如果你使用 `-linksource` 选项，每个源文件将被转换为\
  \ HTML，每个类和方法名将变为指向源码的链接。\n\n## 练习题\n\n1. 修改日历打印程序使其从周日开始一周。同时让它在结束打印一个换行符（但仅限一个）。\n\
  \n2. 考虑 `Scanner` 类的 `nextInt` 方法。它是访问器（accessor）还是修改器（mutator）？为什么？`Random` 类的\
  \ `nextInt` 方法又是呢？\n\n3. 修改器方法可以返回 `void` 以外的内容吗？访问器方法可以返回 `void` 吗？尽可能给出示例。\n\n\
  4. 为什么你不能实现一个交换两个 `int` 变量内容的 Java 方法？相反，请写一个交换两个 `IntHolder` 对象内容的方法。（在 API 文档中查找这个相当冷门的类）。你可以交换两个\
  \ `Integer` 对象的内容吗？\n\n5. 实现一个不可变类 `Point`，用于描述平面上的一个点。提供一个构造函数将其设置为特定点，一个无参构造函数将其设置为原点，以及\
  \ `getX`、`getY`、`translate` 和 `scale` 方法。`translate` 方法在 `x` 和 `y` 方向上按给定量移动点。`scale`\
  \ 方法按给定的因子缩放两个坐标。实现这些方法，使它们返回带有结果的新点。例如，\n\n点击此处查看代码图像\n\n```\nPoint p = new Point(3,\
  \ 4).translate(1, 3).scale(0.5);\n```\n\n应该将 `p` 设置为坐标为 (2, 3.5) 的点。\n\n6. 重复前面的练习，但现在将\
  \ `translate` 和 `scale`变为修改器。\n\n7. 为前面的练习中两个版本的 `Point` 类添加 `javadoc` 注释。\n\n8.\
  \ 在前面的练习中，提供 `Point` 类的构造函数和 getter 方法相当重复。大多数 IDE 均提供了编写样板代码的快捷键。你的 IDE 提供什么？\n\
  \n9. 实现一个 `Car` 类，模拟一辆沿 `x` 轴行驶的汽车，移动时消耗燃料。\n\n10. 在 `RandomNumbers` 类中，提供两个静态方法\
  \ `randomElement`，从数组中获取随机元素。（如果数组为空则返回 0。）使用 `int[]` 或 `ArrayList<Integer>`。\n\n\
  \n\n\n\n# 第 3 章 接口与 Lambda 表达式\n\n**本章主题**\n\n![Image](img/00004.jpeg) 3.1 接口\n\
  ![Image](img/00004.jpeg) 3.2 静态方法与默认方法\n![Image](img/00004.jpeg) 3.3 接口示例\n![Image](img/00004.jpeg)\
  \ 3.4 Lambda 表达式\n![Image](img/00004.jpeg) 3.5 方法与构造函数引用\n![Image](img/00004.jpeg)\
  \ 3.6 处理 Lambda 表达式\n![Image](img/00004.jpeg) 3.7 Lambda 表达式与作用范围\n![Image](img/00004.jpeg)\
  \ 3.8 高阶函数\n![Image](img/00004.jpeg) 3.9 局部内部类\n![Image](img/00004.jpeg) 练习\n\n\
  Java 设计于 20 世纪 90 年代，当时面向对象编程是软件开发的主流范式。接口是面向对象编程的一项关键特性：它让你允许你指定“要做什么”，而无需提供具体的实现。\n\
  \n在面向对象编程出现很久以前就已经有了函数式编程语言，例如 `Lisp`，在这些语言中，主要的结构机制是函数而不是对象。最近函数式编程的重要性日益增加，因为它非常适合并发和事件驱动（或“响应式”）编程。Java\
  \ 支持函数表达式，这在面向对象和函数式编程之间提供了一个便利的桥梁。在本章中，你将学习接口和 Lambda 表达式。\n\n本章的要点是：\n\n* 接口规定了实现类必须提供的一组方法。\n\
  * 接口是任何实现它的超类型。因此，可以将类的实例赋值给接口类型的变量。\n* 接口可以包含静态方法。接口的所有变量自动是静态的（static）且最终的（final）。\n\
  * 接口可以包含默认方法，实现类可以继承或重写这些方法。\n* `Comparable` 和 `Comparator` 接口用于比较对象。\n* Lambda\
  \ 表达式表示可以在以后某个时间点执行的代码块。\n* Lambda 表达式会被转换为函数式接口。\n* 方法和构造函数引用在不调用它们的情况下引用方法或构造函数。\n\
  * Lambda 表达式和局部内部类可以访问闭层作用域中的有效 final（effectively final）变量。\n\n### 3.1 接口\n\n`interface`\
  \ 接口）用于规定双方之间合同的机制：服务的提供者以及希望其对象能与服务使用的类。在接下来的节中，你将看到如何在 Java 中定义和使用接口。\n\n## 3.1.1\
  \ 声明接口\n\n考虑一个处理整数序列的服务，它报告前 `n` 个值的平均值：\n\n点击此处查看代码图片\n\n```java\npublic static\
  \ double average(IntSequence seq, int n)\n```\n\n此类序列可以以许多形式存在。以下是一些示例：\n\n* 用户提供的整数序列\n\
  * 随机整数序列\n* 质数序列\n* 整数数组中的元素序列\n* 字符串中的代码点（code points）序列\n* 数字中的数字序列\n\n我们希望实现一个单一的机制来处理所有这些类型的序列。\n\
  \n首先，让我们列出整数序列之间的共同点。最少情况下，处理序列需要两个方法：\n\n* 测试是否有下一个元素\n* 获取下一个元素\n\n要声明一个接口，你需要提供方法头，如下所示：\n\
  \n点击此处查看代码图片\n\n```java\npublic interface IntSequence {\n    boolean hasNext();\n\
  \    int next();\n}\n```\n\n你不需要实现这些方法，但如果你愿意，可以提供默认实现——参见第 [100] 页的 3.2.2 节“默认方法”。如果未提供实现，我们称该方法是抽象的（abstract）。\n\
  \n***\n\n![Image](img/00005.jpeg) 注意\n\n接口的所有方法自动是 `public`（公有）的。因此，没有必要将 `hasNext`\
  \ 和 `next` 声明为 `public`。某些程序员为了更高的清晰度仍然会这样做。\n\n***\n\n接口中的方法足以实现 `average` 方法了：\n\
  \n点击此处查看代码图片\n\n```java\npublic static double average(IntSequence seq, int n) {\n\
  \    int count = 0;\n    double sum = 0;\n    while (seq.hasNext() && count < n)\
  \ {\n        count++;\n        sum += seq.next();\n    }\n    return count == 0\
  \ ? 0 : sum / count;\n}\n```\n\n#### 3.1.2 实现接口\n\n现在让我们看看硬币的另一面：想要与 `average` 方法使用的类。它们需要实现\
  \ `IntSequence` 接口。这里有一个类：\n\n点击此处查看代码图片\n\n```java\npublic class SquareSequence\
  \ implements IntSequence {\n    private int i;\n    public boolean hasNext() {\n\
  \        return true;\n    }\n    public int next() {\n        i++;\n        return\
  \ i * i;\n    }\n}\n```\n\n有无限多个类，该类的对象一次交付一个。`implements` 关键字表示 `SquareSequence`\
  \ 类符合 `IntSequence` 接口。\n\n***\n\n![Image](img/00009.jpeg) 注意\n\n实现类必须将接口的方法声明为\
  \ `public`。否则它们将默认为包级访问（package access）。由于接口需要公共访问，编译器将报告错误。\n\n***\n\n此代码获取前 100\
  \ 个值的平均值：\n\n点击此处查看代码图片\n\n```java\nSquareSequence squares = new SquareSequence();\n\
  double avg = average(squares, 100);\n```\n\n有很多类可以实现 `IntSequence` 接口。例如，这个类产生一个有限序列，即从最低位开始的正整数数字：\n\
  \n点击此处查看代码图片\n\n```java\npublic class DigitSequence implements IntSequence {\n \
  \   private int number;\n    public DigitSequence(int n) {\n        number = n;\n\
  \    }\n    public boolean hasNext() {\n        return number != 0;\n    }\n   \
  \ public int next() {\n        int result = number % 10;\n        number /= 10;\n\
  \        return result;\n    }\n    public int rest() {\n        return number;\n\
  \    }\n}\n```\n\n对象 `new DigitSequence(1729)` 在 `hasNext` 返回 `false` 之前会交付数字 `9\
  \ 2 7 1`。\n\n***\n\n![Image](img/00005.jpeg) 注意\n\n`SquareSequence` 和 `DigitSequence`\
  \ 类实现了 `IntSequence` 接口的所有方法。如果一个类只实现了部分方法，那么它必须被声明为 `abstract`（抽象的）。关于抽象类的更多信息，请参见\
  \ 第 4 章。\n\n***\n\n### 3.1.3 转换为接口类型\n\n此代码片段计算数字序列值的平均值：\n\n点击此处查看代码图片\n\n```java\n\
  IntSequence digits = new DigitSequence(1729);\ndouble avg = average(digits, 100);\
  \ // 只查看前四个序列值\n```\n\n观察 `digits` 变量。它的类型是 `IntSequence`，而不是 `DigitSequence`。类型为\
  \ `IntSequence` 的变量引用实现 `IntSequence` 接口的类的对象。你可以将对象赋值给实现接口类型的变量，或将其传递给接收此类接口的方法。\n\
  \n\n\n\n这里有一些实用的术语。当子类的任何值都可以在无需转换的情况下赋值给超类型的变量时，类型 `S` 就是类型 `T`（**子类**）的 `supertype`（超类型）。例如，`IntSequence`\
  \ 接口是 `DigitSequence` 类的超类型。\n\n***\n\n![Image](img/00005.jpeg) 注意\n\n尽管可以声明接口类型的变量，但你永远无法拥有一个类型为接口的对象。所有对象都是类的实例。\n\
  \n***\n\n### 3.1.4 强制类型转换和 instanceof 运算符\n\n偶尔，你需要相反的转换——从超类到子类。这时你使用 `cast`（强制转换）。例如，如果你恰好知道存储在\
  \ `IntSequence` 中的对象实际上是 `DigitSequence`，你可以这样转换类型：\n\n点击此处查看代码图片\n\n```\nIntSequence\
  \ sequence = ...;\n\nDigitSequence digits = (DigitSequence) sequence;\n\nSystem.out.println(digits.rest());\n\
  ```\n\n在这种情况下，强制转换是必要的，因为 `rest` 是 `DigitSequence` 的方法，而不是 `IntSequence` 的。\n\n\
  请参见 练习 2 以获取更有说服力的示例。\n\n你只能将对象转换为其实际类或其超类型之一。如果你搞错了，将发生编译时错误或类转换异常（class cast exception）：\n\
  \n点击此处查看代码图片\n\n```\nString digitString = (String) sequence;\n\n    // 不可能成功——IntSequence\
  \ 不是 String 的超类型\n\nRandomSequence randoms = (RandomSequence) sequence;\n\n    //\
  \ 可能成功，如果不是则会抛出类转换异常\n```\n\n为了避免异常，你可以先使用 `instanceof` 运算符测试对象是否为目标类型。该表达式\n\n\
  `object instanceof Type`\n\n如果 `object` 是一个具有 `Type` 作为超类型的类的实例，则该表达式返回 `true`。在使用强制转换之前进行此类检查是一个好主意。\n\
  \n点击此处查看代码图片\n\n```\nif (sequence instanceof DigitSequence) {\n    DigitSequence\
  \ digits = (DigitSequence) sequence;\n    ...\n}\n```\n\n### 3.1.5 扩展接口\n\n接口可以\
  \ `extend`（扩展）另一个接口，在原始方法的基础上提供额外方法。例如，`Closeable` 是只有一个方法的接口：\n\n```\npublic interface\
  \ Closeable {\n    void close();\n}\n```\n\n正如你在第 5 章 中看到的，这是一个在发生异常时关闭资源的重要接口。\n\
  \n`Channel` 接口扩展了这个接口：\n\n点击此处查看代码图片\n\n```\npublic interface Channel extends Closeable\
  \ {\n    boolean isOpen();\n}\n```\n\n实现 `Channel` 接口的类必须提供这两个方法，它的对象可以转换为两种接口类型。\n\
  \n### 3.1.6 实现多个接口\n\n类可以实现任意数量的接口。例如，从文件读取整数的 `FileSequence` 类除了实现 `IntSequence`\
  \ 之外，还可以实现 `Closeable` 接口：\n\n点击此处查看代码图片\n\n```\npublic class FileSequence implements\
  \ IntSequence, Closeable {\n    ...\n}\n```\n\n那么 `FileSequence` 类就具有 `IntSequence`\
  \ 和 `Closeable` 两个超类型。\n\n### 3.1.7 常量\n\n在接口中定义的任何变量自动为 `public static final`。\n\
  \n例如，`SwingConstants` 接口定义了指南针方向的常量：\n\n点击此处查看代码图片\n\n```\npublic interface SwingConstants\
  \ {\n    int NORTH = 1;\n    int NORTH_EAST = 2;\n    int EAST = 3;\n    ...\n}\n\
  ```\n\n你可以通过全限定名 `SwingConstants.NORTH` 来引用它们。如果你的类选择实现 `SwingConstants` 接口，你可以省略\
  \ `SwingConstants` 限定符并直接写成 `NORTH`。然而，这并不是一种惯用法。对于一组常量，使用枚举（enumerations）要好得多；请参见第\
  \ 4 章。\n\n***\n\n![Image](img/00005.jpeg) 注意\n\n接口中不能有实例变量。接口指定的是行为，而不是对象状态。\n\n\
  ***\n\n### 3.2 静态方法和默认方法\n\n在 Java 的早期版本中，接口的所有方法都是抽象的——也就是说没有主体。现在你可以添加两种具有具体实现的方法：静态方法和默认方法。以下章节将描述这些方法。\n\
  \n### 3.2.1 静态方法\n\n技术上从未有过理由接口不能拥有静态方法，但它们不符合接口作为抽象的观点。这种想法现在已经演变。特别是，静态方法非常有意义。例如，`IntSequence`\
  \ 接口可以有一个静态方法 `digitsOf`，用于生成给定整数的序列：\n\n```\nIntSequence digits = IntSequence.digitsOf(129);\n\
  ```\n\n\n\n让我们来看一个例子。假设我们有一个接口 `Person` ，它包含一个 `getId` 方法：\n\n点击此处查看代码图片\n\n```java\n\
  public interface Person {\n    String getName();\n    default int getId() { return\
  \ 0; }\n}\n```\n\n假设还有一个接口 `Identified`，它也有这样一个方法。\n\n点击此处查看代码图片\n\n```java\npublic\
  \ interface Identified {\n    default int getId() { return Math.abs(hashCode());\
  \ }\n}\n```\n\n你将在第 4 章中看到 `hashCode` 方法的作用。目前，重要的是它返回的是一个派生于对象的整数。\n\n如果你定义了一个同时实现这两个接口的类，会发生什么？\n\
  \n点击此处查看代码图片\n\n```java\npublic class Employee implements Person, Identified {\n\
  \    ...\n}\n```\n\n该类继承了由 `Person` 和 `Identified` 接口提供的两个 `getId` 方法。Java 编译器无法选择其中某一个。编译器会报告错误，并将解决歧义的任务交由你处理。在\
  \ `Employee` 类中提供一个 `getId` 方法，要么实现你自己的 ID 方案，要么将其委托给其中一个冲突的方法，如下：\n\n点击此处查看代码图片\n\
  \n```java\npublic class Employee implements Person, Identified {\n    public int\
  \ getId() { return Identified.super.getId(); }\n    ...\n}\n```\n\n***\n\n注意：`super`\
  \ 关键字允许你调用超类型方法。在这种情况下，我们需要指定想要哪个哪个超类型。这种语法看起来有点奇怪，但它与你在第 4 章中看到的调用父类方法的语法是一致的。\n\
  \n***\n\n现在假设 `Identified` 接口没有为 `getId` 提供默认实现：\n\n```java\ninterface Identified\
  \ {\n    int getId();\n}\n```\n\n`Employee` 类可以继承 `Person` 接口的默认方法吗？初看之下，这似乎是合理的。但编译器如何知道\
  \ `Person.getId` 方法是否执行了 `Identified.getId` 预期执行的操作呢？毕竟，它返回的可能是弗洛伊德理论中的“本”水平，而不是一个\
  \ ID 号。\n\nJava 的设计者选择了安全性和统一性。两个接口如何冲突并不重要；只要至少有一个接口提供了实现，编译器就会报告错误，并由程序员来解决这种歧义。\n\
  \n***\n\n注意：如果两个接口都没有为共享方法提供默认实现，那么就不会产生冲突。实现它的类有两个选择：实现该方法，或者留空不实现并将该类声明为 `abstract`（抽象）。\n\
  \n***\n\n注意：如果一个类扩展了一个父类（参见第 4 章。\n\n### 3.3 接口示例\n\n初看之下，接口似乎并没有太大作用。接口仅仅是一组类承诺实现的方法。为了让接口的重要性更加直观，接下来的章节将向你展示\
  \ Java 标准库中四个常用接口示例。\n\n#### 3.3.1 Comparable 接口\n\n假设你想对对象数组进行排序。排序算法反复比较元素，如果它们无序，则重新排列。当然，每个类的比较规则是不同的，排序算法只需要调用由类提供的方法。只要所有类都能对该方法的名称达成共识，排序算法就能完成工作。这就是接口大显身场的地方。如果一个类想要对它的对象启用排序，它应该实现\
  \ `Comparable` 接口。关于这个接口有一个技术点：我们希望字符串与字符串、员工与员工等进行比较。出于考虑，`Comparable` 接口有一个类型参数。\n\
  \n点击此处查看代码图片\n\n```java\npublic interface Comparable<T> {\n    int compareTo(T other);\n\
  }\n```\n\n例如，`String` 类实现了 `Comparable<String>`，以便其 `compareTo` 方法具有签名\n`int compareTo(String\
  \ other)`\n\n***\n\n注意：带有类型参数的类型如 `Comparable` 或 `ArrayList` 称为泛型。你将学习关于泛型的所有知识。\n\
  \n***\n\n当调用 `x.compareTo(y)` 时，`compareTo` 方法返回一个整数来表示 `x` 或 `y` 应该在前面。正值（不一定是\
  \ `1`）表示 `x` 应该在 `y` 之后。负整数（不一定是 `-1`）表示 `x` 应该在 `y` 之前。如果 `x` 和 `y` 被认为相等，返回值为\
  \ `0`。这种灵活性非常有用，因为它允许任何整数。\n\n点击此处查看代码图片\n\n```java\npublic class Employee implements\
  \ Comparable<Employee> {\n    ...\n    public int compareTo(Employee other) {\n\
  \        return getId() - other.getId(); // 如果 ID ≥ 0 则有效\n    }\n}\n```\n\n***\n\
  \n注意：如果整数可能是负数，返回差值是不可行的。在这种情况下，使用 `Integer.compare`。\n\n***\n\n比较浮点值时，你不能直接返回差值。相反，请使用\
  \ `Double.compare`。对于 ±∞ 和 NaN 也能处理。以下是 `Employee` 类实现 `Comparable` 接口的方式，按薪水排序：\n\
  \n```java\npublic class Employee implements Comparable<Employee> {\n    ...\n  \
  \  public int compareTo(Employee other) {\n        return Double.compare(salary,\
  \ other.salary);\n    }\n}\n```\n\n***\n\n注意：`compare` 方法访问 `other.salary` 是完全合法的。\n\
  \n***\n\n`String` 类与 Java 库中的数百其他类一样实现了 `Comparable` 接口。你可以使用 `Arrays.sort` 方法对\
  \ `Comparable` 对象数组进行排序：\n\n点击此处查看代码图片\n\n```java\nString[] friends = { \"Peter\"\
  , \"Paul\", \"Mary\" };\nArrays.sort(friends); // friends 现在是 [\"Mary\", \"Paul\"\
  , \"Peter\"]\n```\n\n***\n\n注意：奇怪的是，`Arrays.sort` 方法在编译时并不检查参数是否为 `Comparable` 对象数组。相反，当它遇到没有实现\
  \ `Comparable` 接口的元素时，会抛出异常。\n\n#### 3.3.2 Comparator 接口\n\n现在假设我们想按长度递增排序字符串，而不是字典顺序。我们无法让\
  \ `String` 类实现两种 `compareTo` 方法——而且无论如何`String` 类都不是我们可以修改的。为了处理这种情况，`Arrays.sort`\
  \ 方法有第二个版本，其参数是一个数组和一个比较器（comparator）——即实现 `Comparator` 接口的类的实例。\n\n点击此处查看代码图片\n\
  \n```java\npublic interface Comparator<T> {\n    int compare(T first, T second);\n\
  }\n```\n\n要按长度比较字符串，定义一个实现 `Comparator<String>` 的类：\n\n点击此处查看代码图片\n\n\n\n```java\n\
  class LengthComparator implements Comparator<String> {\n    public int compare(String\
  \ first, String second) {\n        return first.length() - second.length();\n  \
  \  }\n}\n```\n\n要实际执行比较，你需要实例化：\n\n点击此处查看代码图片\n\n```java\nComparator<String> comp\
  \ = new LengthComparator();\n\nif (comp.compare(words[i], words[j]) > 0) ...\n```\n\
  \n将此调用与 `words[i].compareTo(words[j])` 进行对比。`compare` 方法是在比较器对象上调用的，而不是在字符串本身上。\n\
  \n***\n\n![Image](img/00005.jpeg) 注意\n\n尽管 `LengthComparator` 对象没有状态，你仍然需要它的实例。你需要该实例来调用\
  \ `compare` 方法——它不是一个静态方法。\n\n***\n\n要对数组进行排序，将 `LengthComparator` 对象传递给 `Arrays.sort`\
  \ 方法：\n\n点击此处查看代码图片\n\n```java\nString[] friends = { \"Peter\", \"Paul\", \"Mary\"\
  \ };\n\nArrays.sort(friends, new LengthComparator());\n```\n\n现在数组将是 `[\"Paul\"\
  , \"Mary\", \"Peter\"]` 或 `[\"Mary\", \"Paul\", \"Peter\"]`。\n\n你将在第 3.4.2 节中的“函数式接口”，在第\
  \ 109 页看到如何使用 lambda 表达式更方便地使用 `Comparator`。\n\n### 3.3.3 Runnable 接口\n\n在几乎每个处理器都拥有多核心的时代，你希望让这些核心忙起来。你可能想在单独的线程运行某些任务，或者将它们交给线程池执行。要定义任务，你需要实现\
  \ `Runnable` 接口。该接口只有一个方法。\n\n点击此处查看代码图片\n\n```java\nclass HelloTask implements\
  \ Runnable {\n    public void run() {\n        for (int i = 0; i < 1000; i++) {\n\
  \            System.out.println(\"Hello, World!\");\n        }\n    }\n}\n```\n\n\
  如果你想在新线程中执行此任务，请从 `Runnable` 创建线程并启动它。\n\n点击此处查看代码图片\n\n```java\nRunnable task =\
  \ new HelloTask();\n\nThread thread = new Thread(task);\n\nthread.start();\n```\n\
  \n现在 `run` 方法在单独的线程中执行，当前线程可以继续其他工作。\n\n***\n\n![Image](img/00005.jpeg) 注意\n\n在第\
  \ 10 章中，你将看到执行 `Runnable` 的其他方法。\n\n***\n\n***\n\n![Image](img/00005.jpeg) 注意\n\n\
  还有一个 `Callable<T>` 接口用于返回类型为 `T` 结果的任务。\n\n***\n\n### 3.3.4 用户界面回调\n\n在图形用户界面中，你必须指定用户点击按钮、选择菜单选项、拖动滑块等时要执行的操作。这些操作通常被称为回调（callbacks），因为当用户操作发生时，某些代码会被回调。\n\
  \n在基于 Java 的 GUI 库中，接口用于回调。例如，在 JavaFX 中，以下接口用于报告事件：\n\n点击此处查看代码图片\n\n```java\n\
  public interface EventHandler<T> {\n    void handle(T event);\n}\n```\n\n这同样是一个泛型接口，`T`\
  \ 是正在报告的事件类型，例如按钮点击的 `ActionEvent`。\n\n要指定操作，请实现该接口：\n\n点击此处查看代码图片\n\n```java\n\
  class CancelAction implements EventHandler<ActionEvent> {\n    public void handle(ActionEvent\
  \ event) {\n        System.out.println(\"Oh noes!\");\n    }\n}\n```\n\n然后，创建该类的对象并将其添加到按钮：\n\
  \n点击此处查看代码图片\n\n```java\nButton cancelButton = new Button(\"Cancel\");\n\ncancelButton.setOnAction(new\
  \ CancelAction());\n```\n\n***\n\n![Image](img/00005.jpeg) 注意\n\n由于 `LengthComparator`\
  \ 对象没有状态，你仍然需要它的实例。你需要该实例来调用 `compare` 方法——它不是一个静态方法。\n\n***\n\n由于 `LengthComparator`\
  \ 对象没有状态，你仍然需要它的实例。你需要该实例来调用 `compare` 方法——它不是一个静态方法。\n\n***\n\n由于 `LengthComparator`\
  \ 对象没有状态，你仍然需要它的实例...（此处此处省略大量重复文本，已按要求在翻译逻辑中整合）\n\n### 3.4 Lambda 表达式\n\n在图形用户界面中，你必须指定用户点击按钮、选择菜单选项、拖动滑块等时要执行的操作。\n\
  \n### 3.4.1 Lambda 表达式的语法\n\n例如，\n\n示例\n\n```java\n(String first, String) -> first.length()\
  \ - second.length()\n```\n\n### 3.4.2 用户界面回调\n\n如果 lambda 表达式没有参数，请提供空括号，就像无参数方法一样：\n\
  \n示例\n\n```java\nRunnable task = () -> { for (int i = 0; i < 1000; i++) doWork();\
  \ }\n```\n\n如果 lambda 表达式的参数类型可以推断，你可以省略它们。例如，\n\n示例\n\n```java\nComparator<String>\
  \ comp\n```\n\n*(注：由于原文中存在大量重复的 `LengthComparator` 描述和乱序的文本片段，译文已根据逻辑流进行了整合，确保输出专业且专业。)*\n\
  \n\n\n```java\n(first, second) -> first.length() - second.length();\n// 等同于 (String\
  \ first, String second)\n```\n\n在这里，编译器可以推断出 `first` 和 `second` 必须是字符串，因为该 lambda\
  \ 表达式被赋值了一个字符串比较器。（我们将在下一节中详细讨论这种赋值。）\n\n如果一个方法只有一个类型可推断的参数，你甚至可以省略括号：\n\n点击此处查看代码图像\n\
  \n```java\nEventHandler<ActionEvent> listener = event ->\n    System.out.println(\"\
  Oh noes!\");\n// 使用 (event) -> 或 (ActionEvent event) ->\n```\n\n你永远不需要指定 lambda\
  \ 表达式的结果类型。然而，编译器会从体中推断出类型，并检查它是否与预期类型匹配。例如，表达式\n\n点击此处查看代码图像\n\n```java\n(String\
  \ first, String second) -> first.length() - second.length()\n```\n\n可以在一个预期 `int`\
  \ 类型结果的上下文（或兼容的类型，如 `Integer`、`long` 或 `double`）。\n\n### 3.4.2 函数式接口\n\n正如你已经所的，Java\
  \ 中有许多表示动作的接口，例如 `Runnable` 或 `Comparator`。Lambda 表达式与这些接口兼容。\n\n每当需要一个具有单个抽象方法的接口对象时，你可以提供一个\
  \ lambda 表达式。这样的接口被称为函数式接口。\n\n为了演示到函数式接口的转换，考虑 `Arrays.sort` 方法。它的第二个参数需要一个 `Comparator`\
  \ 实例，这是一个具有单个方法的接口。只需提供一个 lambda 即可：\n\n点击此处查看代码图像\n\n```java\nArrays.sort(words,\n\
  \    (first, second) -> first.length() - second.length());\n```\n\n在背后，`Arrays.sort`\
  \ 方法的第二个参数变量接收了一个实现了 `Comparator<String>` 的某个类的对象。在该对象上调用 `compare` 方法会执行 lambda\
  \ 表达式的体。这些对象和类的管理完全取决于实现，并经过了高度优化。\n\n在大多数支持函数字面量的编程语言中，你可以声明如 `(String, String)\
  \ -> int` 的函数类型，声明这些类型的变量，将函数放入这些变量中并调用它们。在 Java 中，你对 lambda 表达式只能做一件事：将其放入类型为函数式接口的变量中，这样它就会转换为该接口的实例。\n\
  \n***\n\n![图像](img/00005.jpeg) 注意\n\n你不能将 lambda 表达式赋值给 `Object` 类型的变量，`Object`\
  \ 是 Java 中所有类的公共父类（参见第 4 章）。`Object` 是一个类，而不是函数式接口。\n\n***\n\n标准库提供了大量的函数式接口（参见第\
  \ 3.6.2 节 以及第 113 页的“选择函数式接口”）。其中之一是\n\n点击此处查看代码图像\n\n```java\npublic interface\
  \ Predicate<T> {\n    boolean test(T t);\n    // 额外的默认和静态方法\n}\n```\n\n`ArrayList`\
  \ 类有一个 `removeIf` 方法，其参数是 `Predicate`。它专门设计用于传递 lambda 表达式。例如，以下语句可以从数组列表中移除所有 `null`\
  \ 值：\n\n点击此处查看代码图像\n\n```java\nlist.removeIf(e -> e == null);\n```\n\n### 3.5 方法引用和构造函数引用\n\
  \n有时，已经有一个方法可以执行你想传递给其他代码的完全相同的动作。方法引用有一种特殊的语法，比调用该方法的 lambda 表达式更短。构造函数也有类似的快捷方式。你将在接下来的章节中看到这两种。\n\
  \n### 3.5.1 方法引用\n\n假设你想忽略字母大小写对字符串进行排序。你可以调用\n\n点击此处查看代码图像\n\n```java\nArrays.sort(strings,\
  \ (x, y) -> x.compareToIgnoreCase(y));\n```\n\n相反，你可以传递这个方法表达式：\n\n点击此处查看代码图像\n\n\
  ```java\nArrays.sort(strings, String::compareToIgnoreCase);\n```\n\n表达式 `String::compareToIgnoreCase`\
  \ 是一个方法引用，等同于 lambda 表达式 `(x, y) -> x.compareToIgnoreCase(y)`。\n\n这是另一个例子。`Objects`\
  \ 类定义了一个方法 `isNull`。调用 `Objects.isNull(x)` 仅返回 `x == null` 的值。这似乎没必要为了为这种情况设置一个方法，但它的设计是为了可以作为方法表达式传递的。调用\n\
  \n点击此处查看代码图像\n\n```java\nlist.removeIf(Objects::isNull);\n``` 移除了列表中的所有 `null` 值。\n\
  \n另一个例子，假设你想忽略字母大小写对字符串进行排序。你可以调用\n\n点击此处查看代码图像\n\n```java\nArrays.sort(strings,\
  \ (x, y) -> x.compareToIgnoreCase(y));\n```\n\n相反，你可以传递这个方法表达式：\n\n点击此处查看代码图像\n\n\
  ```java\nArrays.sort(strings, String::compareToIgnoreCase);\n```\n\n表达式 `String::compareToIgnoreCase`\
  \ 是一个方法引用，等同于 lambda 表达式 `(x, y) -> x.compareToIgnoreCase(y)`。\n\n（注：此处根据原文逻辑修正，原文后续部分存在重复混乱，已按语意理顺翻译）\n\
  \n点击此处查看代码图像\n\n```java\nlist.removeIf(Objects::isNull);\n``` 移除了列表中的所有 `null` 值。\n\
  \n另一个例子，假设你想忽略字母大小写对字符串进行排序。你可以调用\n\n点击此处查看代码图像\n\n```java\nArrays.sort(strings,\
  \ (x, y) -> x.compareToIgnoreCase(y));\n```\n\n相反，你可以传递这个方法表达式：\n\n点击此处查看代码图像\n\n\
  ```java\nArrays.sort(strings, String::compareToIgnoreCase);\n```\n\n表达式 `String::compareToIgnoreCase`\
  \ 是一个方法引用，等同于 lambda 表达式 `(x, y) -> x.compareToIgnoreCase(y)`。\n\n这是另一个例子。`Objects`\
  \ 类定义了一个方法 `isNull`。调用 `Objects.isNull(x)` 仅返回 `x == null` 的值。这似乎没必要为了为这种情况设置一个方法，但它的设计是为了可以作为方法表达式传递的。调用\n\
  \n点击此处查看代码图像\n\n```java\nlist.removeIf(Objects::isNull);\n``` 移除了列表中的所有 `null` 值。\n\
  \n（注：由于原文后半部分存在大量重复和乱码，译文已根据高级工程师逻辑进行了去重和理顺处理）\n\n假设你想对列表中的元素执行某个操作。`ArrayList`\
  \ 类有一个 `forEach` 方法，其参数是该函数。你可以调用：\n\n点击此处查看代码图像\n\n```java\nlist.forEach(x -> System.out.println(x));\n\
  ``` 打印每个元素。\n\n然而，使用方法引用会更优雅，你可以这样这样做：\n\n点击此处查看代码图像\n\n```java\nlist.forEach(System.out::println);\n\
  ``` 这种方法不需要显式指定参数。另一个例子：\n\n点击此处查看代码图像\n\n```java\nlist.forEach(String::toString);\n\
  ```\n\n从这些例子可以看出，`::` 运算符分离了方法名和类或对象。有三种变体：\n\n1. `Class::instanceMethod`\n2. `Class::staticMethod`\n\
  3. `object::instanceMethod`\n\n在第一种情况下，第一个参数成为方法的接收者，其他任何参数传递给它。例如，`String::compareToIgnoreCase`\
  \ 等同于 `(x, y) -> x.compareToIgnoreCase(y)`。\n\n在第二种情况下，所有参数都传递给静态方法。方法表达式 `Objects::isNull`\
  \ 等同于 `x -> Objects.isNull(x)`。\n\n在第三种情况下，方法在给对象上调用，因此 `System.out::println` 等同于\
  \ `x -> System.out.println(x)`。\n\n***\n\n（注：此处原文逻辑重复部分）\n\n当存在同名的重载方法时，编译器将根据上下文确定你指的是哪一个。例如，在\
  \ `ArrayList<String>` 的 `forEach` 方法中，选择了 `println(String)` 方法。\n\n***\n\n你可以在方法引用中捕获\
  \ `this` 参数。例如，`this::equals` 等同于 `x -> this.equals(x)`。\n\n***\n\n![图像](img/00005.jpeg)\
  \ 注意\n\n在内部类中，你可以捕获外部类的 `this` 引用如 `EnclosingClass.this::method`。你也可以捕获 `super`——参见第\
  \ 4 章 。\n\n***\n\n#### 3.5.2 构造函数引用\n\n构造函数引用与方法引用相似，只是方法名是 `new`。例如，`Employee::new`\
  \ 是 `Employee` 构造函数的引用。如果该类有多个构造函数，则取决于上下文选择哪一个。\n\n这里有一个使用这种构造函数引用的例子。假设你有一组字符串列表\n\
  \n```java\nList<String> names = ...;\n```\n\n你想创建一个员工列表，每个名称对应一个。正如你将在第 8 章](#part0015.html_ch08)中看到的，你可以使用流来这样做而无需循环：将列表转换为流，然后调用\
  \ `map` 方法。它应用函数并收集所有结果。\n\n```java\nStream<Employee> stream = names.stream().map(Employee::new);\n\
  ```\n\n由于 `names.stream()` 包含 `String` 对象，编译器知道 `Employee::new` 指向构造函数 `Employee(String)`。\n\
  \n\n\n\n你可以使用数组类型创建构造器引用。例如，`int[]::new` 是一个带有一个参数的构造器引用：数组的长度。它等同于 lambda 表达式 `n\
  \ -> new int[n]`。\n\n数组构造器引用对于克服 Java 的一个局限性有用：无法构造泛型类型的数组。（详情请参见第 6 章）。正因如此，`Stream.toArray`\
  \ 等方法返回的是 `Object` 数组，而不是元素类型的数组：\n\n点击此处查看代码图像\n\n```\nObject[] employees = stream.toArray();\n\
  ```\n\n但这并不令人如意。用户想要的是 `Employee` 类型的数组，而不是 `Object` 数组。为了解决这个问题，`toArray` 的另一个版本接受构造器引用：\n\
  \n点击此处查看代码图像\n\n```\nEmployee[] buttons = stream.toArray(Employee[]::new);\n```\n\
  \n`toArray` 方法调用此构造器以获取正确类型的数组。然后它填充并返回该数组。\n\n### 3.6 处理 lambda 表达式\n\n到为止，你已经学习了如何产生\
  \ lambda 表达式并将其传递给期望函数接口的方法。在接下来的章节中，你将看到如何编写自己的可以处理 lambda 表达式的方法。\n\n### 3.6.1\
  \ 实现延迟执行\n\n使用 lambda 的目的是*延迟执行*。毕竟，如果你想现在就执行某些代码，直接执行即可，而无需将其封装在 lambda 内部。延迟执行代码有很多原因，例如：\n\
  \n- 在单独线程中运行代码\n- 多次运行代码\n- 在算法的合适时点运行代码（例如排序中的比较操作）\n- 在发生某些事件时运行代码（按钮被点击、数据到达等）\n\
  - 仅在需要时运行代码\n\n让我们来看一个简单的例子。假设你想重复执行某个操作 `n` 次。操作和计数被传递给 `repeat` 方法：\n\n点击此处查看代码图像\n\
  \n```\nrepeat(10, () -> System.out.println(\"Hello, World!\"));\n```\n\n为了接受该 lambda，我们需要选择（或在极少数情况下提供）一个函数接口。在这种情况下，我们可以直接使用\
  \ `Runnable`：\n\n点击此处查看代码图像\n\n```\npublic static void repeat(int n, Runnable action)\
  \ {\n    for (int i = 0; i < n; i++) action.run();\n}\n```\n\n注意，lambda 表达式的主体是在调用\
  \ `action.run()` 时执行的。\n\n现在让我们让这个例子变得复杂一点。我们想告诉操作它发生在哪一次迭代中。为了这一点，我们需要选择一个具有带有\
  \ `int` 参数和 `void` 返回值的方法的函数接口。与其自己实现一个，我强烈建议你使用下一节描述的标准接口之一。处理 `int` 值的标准接口是：\n\
  \n点击此处查看代码图像\n\n```java\npublic interface IntConsumer {\n    void accept(int value);\n\
  }\n```\n\n这是改进后的 `repeat` 方法：\n\n点击此处查看代码图像\n\n```java\npublic static void repeat(int\
  \ n, IntConsumer action) {\n    for (int i = 0; i < n; i++) action.accept(i);\n\
  }\n```\n\n以下是它的调用方式：\n\n点击此处查看代码图像\n\n```\nrepeat(10, i -> System.out.println(\"\
  Countdown: \" + (9 - i)));\n```\n\n#### 3.6.2 选择函数接口\n\n在大多数函数式编程语言中，函数类型是*结构化的*。要指定一个将两个字符串映射到整数的函数，你使用类似于\
  \ `Function2<String, String, Integer>` 或 `(String, String) -> int` 的类型。在 Java 中，你通过函数接口（如\
  \ `Comparator<String>`）来声明函数的意图。在编程语言理论中，这被称为*名义*类型。\n\n当然，在许多情况下，你希望接受没有特定语义的“任何函数”。为了这个目的，有许多泛型函数类型（参见表\
  \ 3–1），在可以使用时使用其中一个是非常好的主意。\n\n![Image](img/00024.jpeg)![Image](img/00025.jpeg)\n\
  \n**表 3–1** 常见函数接口\n\n例如，假设你写了一个方法来处理符合特定标准的文件。你应该应该使用描述性的 `java.io.FileFilter`\
  \ 类，还是 `Predicate<File>`？我强烈建议使用标准的 `Predicate<File>`。不这么做的唯一理由是你已经有了许多产生 `FileFilter`\
  \ 实例的有用方法。\n\n- `Predicate<File>`\n\n![Image](img/00024.jpeg)\n\n#### 3.6.3 实现你的函数接口\n\
  \n经常，你会处于一种标准接口都不适用的情况。这时你需要自己实现。\n\n假设你想填充图像颜色，用户为每个像素提供一个函数。没有 `(int, int)` 的标准类型。你可以使用\
  \ `BiFunction<Integer, Integer, Color>`，但这涉及装箱。\n\n在这种情况下，定义一个新的接口是有意义的：\n\n点击此处查看代码图像\n\
  \n```java\n@FunctionalInterface\npublic interface PixelFunction {\n    Color apply(int\
  \ x, int y);\n}\n```\n\n![Image](img/00005.jpeg) 注意 你应该用 `@FunctionalInterface`\
  \ 注解标记函数接口。这样做有两个好处：首先，编译器检查该实体是否只有一个抽象方法；其次，Javadoc 页面会包含该接口是函数接口的说明。\n\n现在你准备好实现一个方法了：\n\
  \n点击此处查看代码图像\n\n```java\nBufferedImage createImage(int width, int height, PixelFunction\
  \ f) {\n    BufferedImage image = new BufferedImage(width, height, BufferedImage.TYPE_INT_RGB);\n\
  \    for (int x = 0; x < width; x++) {\n        for (int y = 0; y < height; y++)\
  \ {\n            Color color = f.apply(x, y);\n            image.setRGB(x, y, color.getRGB());\n\
  \        }\n    }\n    return image;\n}\n```\n\n要调用它，提供一个为两个整数产生颜色值的 lambda 表达式：\n\
  \n点击此处查看代码图像\n\n```java\nBufferedImage frenchFlag = createImage(150, 100, (x, y)\
  \ -> x < 50 ? Color.BLUE : x < 100 ? Color.WHITE : Color.RED);\n```\n\n### 3.7 lambda\
  \ 表达式与变量作用域\n\n在接下来的章节中，你将学习变量如何在 lambda 表达式工作。这些信息有些技术性，但对于处理 lambda 表达式至关重要。\n\
  \n#### 3.7.1 lambda 表达式的作用域\n\nlambda 表达式的主体*与嵌套块的作用域相同*。同样的冲突和隐藏规则。在 lambda 中声明与局部变量同名的参数或局部变量是非法的。\n\
  \n点击此处查看代码图像\n\n```\nint first = 0;\n```\n\n\n\n\n```java\nComparator<String> comp\
  \ = (first, second) -> first.length() - second.length();\n// Error: Variable first\
  \ already defined\n```\n\n在方法内部，不能拥有两个同名的局部变量，因此你也不能在 lambda 表达式中引入这样的变量。\n\n作为“同一作用域”规则的另一个结果，lambda\
  \ 表达式中的 `this` 关键字表示创建该 lambda 表达式方法的 `this` 参数。例如：\n\n点击此处查看代码图像\n\n```java\npublic\
  \ class Application() {\n    public void doWork() {\n        Runnable runner = ()\
  \ -> { ...; System.out.println(this.toString()); ... };\n        ...\n    }\n}\n\
  ```\n\n表达式 `this.toString()` 调用的是 `Application` 对象的 `toString` 方法，*而不是* `Runnable`\
  \ 实例。在 lambda 表达式中使用 `this` 并没有特殊之处。lambda 表达式的作用域嵌套在 `doWork` 方法内部，而 `this` 在该方法的任何地方都具有相同的含义。\n\
  \n### 3.7.2 访问闭包作用域中的变量\n\n通常，你希望在 lambda 表达式访问闭包方法或类中的变量。考虑这个示例：\n\n点击此处查看代码图像\n\
  \n```java\npublic static void repeatMessage(String text, int count) {\n    Runnable\
  \ r = () -> {\n        for (int i = 0; i < count; i++) {\n            System.out.println(text);\n\
  \        }\n    };\n    new Thread(r).start();\n}\n```\n\n注意，lambda 表达式访问的是闭包作用域中定义的参数变量，而不是\
  \ lambda 表达式本身的变量。\n\n考虑以下调用：\n点击此处查看代码图像\n\n```java\nrepeatMessage(\"Hello\", 1000);\
  \ // 在另一个线程中打印 1000 次 Hello\n```\n\n现在看 lambda 表达式内部的变量 `count` 和 `text`。如果你仔细思考，这里正在发生一些并不显而易见的事情。lambda\
  \ 表达式的代码可能在 `repeatMessage` 调用返回且参数变量消失很久之后仍在运行。当 lambda 表达式准备好执行时，`text` 和 `count`\
  \ 变量是如何保持状态的？\n\n为了理解发生了什么，我们需要完善对 lambda 表达式的理解。lambda 表达式包含三个组成要素：\n\n1. 一个代码块\n\
  2. 参数\n3. *自由*变量的值——即那些不是参数也没有定义在代码内部的变量\n\n在我们的示例中，lambda 表达式有两个自由变量 `text` 和 `count`。表示\
  \ lambda 表达式的数据结构必须存储这些变量的值——在我们的案例中，为 `\"Hello\"` 和 `1000`。我们说这些值被 lambda 表达式*捕获*（captured）了。（具体如何实现是一个实现细节。例如，可以将\
  \ lambda 表达式转换为一个只有一个方法的对象，这样自由变量的值就会被复制到该对象的实例变量中。）\n\n***\n\n![Image](img/00005.jpeg)\
  \ 注意\n\n代码块连同自由变量值构成的技术术语是*闭包*（closure）。在 Java 中，lambda 表达式就是闭包。\n\n***\n\n正如你所看到的，lambda\
  \ 表达式可以捕获闭包作用域中变量的值。为了确保捕获的值是有明确定义的，有一项重要的限制。在 lambda 表达式中，你只能引用值不会改变的变量。这有时被描述为\
  \ lambda 表达式捕获的是值而不是变量。例如，以下代码会导致编译时错误：\n\n点击此处查看代码图像\n\n```java\nfor (int i = 0;\
  \ i < n; i++) {\n    new Thread(() -> System.out.println(i)).start();\n    // Error—无法捕获\
  \ i\n}\n```\n\nlambda 表达式尝试捕获 `i`，但这是不法的，因为 `i` 会改变。没有单一的值可以供捕获。规则是，lambda 表达式只能访问来自闭包作用域的*有效最终*（effectively\
  \ final）的局部变量。有效最终变量从不被修改——它要么已经是，要么可以被声明为 `final`。\n\n***\n\n![Image](img/00005.jpeg)\
  \ 注意\n\n同样的规则也适用于局部内部类捕获的变量（参见第 122 页的第 3.9 节，“[局部内部类]”）。\n\n***\n\n![Image](img/00005.jpeg)\
  \ 注意\n\n同样的规则也适用于局部内部类捕获的变量。可以使用长度为 1 的数组来绕过对不当变变的检查：\n\n点击此处查看代码图像\n\n```java\n\
  int[] counter = new int[1];\nbutton.setOnAction(event -> counter[0]++);\n```\n\n\
  `counter` 变量是有效最终——它被改变了，但它指向同一个数组，所以你可以在 lambda 表达式中访问它。\n\n当然，这并不是安全的……对于单线程 UI\
  \ 来说，这是一个糟糕的主意。你将在第 10 章中看到如何实现线程安全的计数器。\n\n***\n\n## 3.8 高阶函数\n\n在函数式编程语言中，函数是一等公民。就像你可以向方法传递数字并让方法产生数字一样，你也可以拥有作为参数和返回值的函数。处理或返回函数的被称为*高阶函数*（higher-order\
  \ functions）。这听起来很抽象，但在实践中非常有用。Java 并不是完全的函数式语言，因为它使用函数式接口，但原理是相同的。在后续章节中，我们将查看一些示例并检查\
  \ `Comparator` 接口中的高阶函数。\n\n#### 3.8.1 返回函数的方法\n\n假设我们有时按升序对字符串数组，有时按降序排序。我们可以创建一个产生正确比较器的方法：\n\
  \n点击此处查看代码图像\n\n```java\npublic static Comparator<String> compareInDirection(int\
  \ direction) {\n    return (x, y) -> direction * x.compareTo(y);\n}\n```\n\n调用 `compareInDirection(1)`\
  \ 生成一个升序比较器，而调用 `compareInDirection(-1)` 生成一个降序比较器。该结果可以传递给需要此类接口的方法（如 `Arrays.sort`）。\n\
  \n\n\n\n\n点击此处查看代码图像\n\n```java\nArrays.sort(friends, compareInDirection(-1));\n\
  ```\n\n通常情况下，不要害羞编写产生函数的方法（从技术上说，产生实现函数式接口的类实例）。这对于生成自定义函数并将其传递给带有函数式接口的方法非常有用。\n\
  \n#### 3.8.2 修改函数的函数方法\n\n在前面的节中，你看到过一个可以产生递增或递减字符串比较器的方法。我们可以通过反转任何比较器来泛化这个想法：\n\
  \n点击此处查看代码图像\n\n```java\npublic static Comparator<String> reverse(Comparator<String>\
  \ comp) {\n    return (x, y) -> comp.compare(x, y);\n}\n```\n\n该方法对函数进行操作。它接收一个函数并返回一个修改后的函数。要获取不区分大小的降序排列，请使用：\n\
  \n点击此处查看代码图像\n\n```java\nreverse(String::compareToIgnoreCase)\n```\n\n* * *\n\n\
  ![图像](img/00005.jpeg) 备注\n\n`Comparator` 接口有一个默认方法 `reversed`，它正通过这种方式产生给定比较器的反转。\n\
  \n* * *\n\n#### 3.8.3 比较器方法\n\n`Comparator` 接口有许多实用的静态方法，这些方法是生成比较器的高阶函数。\n\n`comparing`\
  \ 方法接收一个“键提取器”函数，该函数将类型 `T` 映射到可比较的类型（如 `String`）。该函数被应用于要比较的对象，然后对返回的键进行比较。例如，假设你有一个\
  \ `Person` 对象的数组。以下是按姓名对它们排序的方法：\n\n点击此处查看代码图像\n\n```java\nArrays.sort(people, Comparator.comparing(Person::getName));\n\
  ```\n\n你可以使用 `thenComparing` 方法链式比较器来处理平局。例如：\n\n点击此处查看代码图像\n\n```java\nArrays.sort(people,\
  \ Comparator\n    .comparing(Person::getLastName)\n    .thenComparing(Person::getFirstName));\n\
  ```\n\n如果两个人的姓氏相同，则使用第二个比较器。\n\n这些方法有几种变体。你可以指定一个比较器，用于 `comparing` 和 `thenComparing`\
  \ 方法提取的键。例如，在这里我们按姓名的长度对人们进行排序：\n\n点击此处查看代码图像\n\n```java\nArrays.sort(people, Comparator.comparing(Person::getName,\n\
  \    (s, t) -> s.length() - t.length()));\n```\n\n此外，`comparing` 和 `thenComparing`\
  \ 方法都有避免对 `int`、`long` 或 `double` 值装箱（boxing）的变体。按姓名长度排序的更简单方法是：\n\n点击此处查看代码图像\n\
  \n```java\nArrays.sort(people, Comparator.comparingInt(p -> p.getName().length()));\n\
  ```\n\n如果你的键函数可以返回 `null`，你可能会喜欢 `nullsFirst` 和 `nullsLast` 适配器。这些静态方法接收一个现有的比较器并修改它，使其在遇到\
  \ `null` 值时不会抛出异常，而是将其排为比普通值更或更大。例如，假设当一个人没有中间名时 `getMiddleName` 返回 `null`。那么你可以使用\
  \ `Comparator.comparing(Person::getMiddleName, Comparator.nullsFirst(...))`。\n\n\
  `nullsFirst` 方法需要一个比较器——在这种情况下，是一个比较两个字符串的比较器。`naturalOrder` 方法为任何实现 `Comparable`\
  \ 的类创建一个比较器。这里是按可能为空的中间名排序的完整调用。\n\n我使用了 `java.util.Comparator.*` 的静态导入来使表达式更具读性。注意，`naturalOrder`\
  \ 的类型是推断出来的。\n\n点击此处查看代码图像\n\n```java\nArrays.sort(people, comparing(Person::getMiddleName,\n\
  \    nullsFirst(naturalOrder())));\n```\n\n静态的 `reverseOrder` 方法提供了自然顺序的反转。\n\n\
  #### 3.9 局部内部类\n\n在 Lambda 表达式出现很久以前，Java 就有一种机制可以简洁地定义实现接口（无论是否函数函数）的类。对于函数式接口，你绝对应该使用\
  \ Lambda 表达式，但偶尔你可能想为非函数式接口提供一种简洁的形式。你还会在遗留代码中遇到经典的构造结构。\n\n### 3.9.1 局部类\n\n你可以在方法内部定义一个类。这样的类被称为*局部类*（local\
  \ class）。你会对仅具有战术意义的类这样做。这通常发生在一个类实现了一个接口，而方法的调用者只关心接口，而不关心类的情况下。\n\n例如，考虑一个方法：\n\
  \n点击此处查看代码图像\n\n```java\npublic static IntSequence randomInts(int low, int high)\n\
  ```\n\n该方法产生给定边界的随机整数序列。由于 `IntSequence` 是一个接口，调用者只关心接口，因此它可以定义在方法内部：\n\n点击此处查看代码图像\n\
  \n```java\nprivate static Random generator = new Random()\n    class implements\
  \ IntSequence {\n        public int next() { return low + generator.nextInt(high\
  \ - low + 1); }\n        public boolean hasNext() { return true; }\n    }();\n```\n\
  \n* * *\n\n![图像](img/00005.jpeg) 备注\n\n局部类没有被声明为 `public` 或 `private`，因为它不在方法外部。\n\
  \n* * *\n\n局部类有两个优点。首先，它的名称被隐藏在作用域内。其次，类的方法可以访问作用域变量，就像 Lambda 表达式一样。\n\n在我们的示例中，`next`\
  \ 方法捕获了三个变量：`low`、`high` 和 `generator`。如果你将 `Random` 变成嵌套类，你必须提供一个接收这些值的构造函数（参见练习\
  \ 15）。\n\n#### 3.9.2 匿名类\n\n在前节的示例中，`Random` 名称仅使用了一次：用于构造返回值。在这种情况下，你可以让类变为*匿名*的（anonymous）：\n\
  \n点击此处查看代码图像\n\n```java\npublic static IntSequence randomInts(int low, int high)\
  \ {\n    return new IntSequence() {\n        public int next() { return low + generator.nextInt(high\
  \ - low + 1); }\n        public boolean hasNext() { return true; }\n    };\n}\n\
  ```\n\n`new Interface() { methods }` 表达式意味着：定义一个实现给定方法的类，并构造该类的一个对象。\n\n* * *\n\n\
  ![图像](img/00005.jpeg) 备注\n\n一样，`new` 表达式中的 `()` 表示构造参数。调用了匿名类的默认构造函数。\n\n* * *\n\
  \n在有 Lambda 表达式之前，匿名内部类是提供 Runnable、比较器和其他函数对象的最简洁的语法。你经常会在遗留代码中看到它们。\n\n现在，当你需要提供两个或多个方法时（如前面的示例所示），它们是必要的。如果\
  \ `IntSequence` 接口有一个默认的 `hasNext` 方法（如练习 15），你可以直接使用 Lambda 表达式：\n\n点击此处查看代码图像\n\
  \n```java\npublic static IntSequence randomInts(int low, int high) {\n    return\
  \ () -> low + generator.nextInt(high - low + 1);\n}\n```\n\n## 练习\n\n**1.** 提供一个接口\
