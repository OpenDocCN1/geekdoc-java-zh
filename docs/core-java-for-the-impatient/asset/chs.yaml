  \ 宇宙级超类\n\n![Image](img/00004.jpeg) 4.3 枚举\n\n![Image](img/00004.jpeg) 4.4 运行时类型信息与资源\n\
  \n![Image](img/00004.jpeg) 4.5 反射\n\n![Image](img/00004.jpeg) 练习题\n\n前面的章节向你介绍了类和接口。在本章中，你将学习面向对象编程另一个另一个概念：继承。继承是基于现有类创建新类的过程。\n\
  \n* *\n\n![Image](img/00004.jpeg) 注意\n\n实例变量和静态变量统称为*字段*（fields）。\n\n* *\n\n字段、方法以及类内部的嵌套类/接口统称为*成员*（members）。\n\
  \n* *\n\n![Image](img/00004.jpeg) 注意\n\n本章还涵盖了反射，即在运行时获取类和成员的能力。反射是一项强大的功能，但无疑很复杂。反射对工具构建者比应用程序员更有意义，初读时你可以略过。\n\
  \n子类可以继承或重写方法。使用 `super` 关键字调用父类方法或构造函数。`final` 方法不能被重写；`final` 类不能被扩展。`abstract`\
  \ 方法没有实现；`abstract` 类不能实例化。`protected` 成员在子类中可访问，但仅适用于相同子类的对象。每个类都是 `Object` 的子类，它提供了\
  \ `toString`、`equals`、`hashCode` 和 `clone` 方法。每个枚举类型都是 `Enum` 的子类，它提供了 `toString`、`valueOf`\
  \ 和 `compareTo` 方法。`Class` 类提供了关于 Java 类型的信息，可以是类、接口、原始类型或 void。可以使用 Class 对象加载与类文件一起的资源。你可以使用类加载器从类路径以外加载类。反射库允许程序发现任意对象的成员、访问变量并调用方法。代理对象动态实现任意接口，并将所有方法调用路由到处理程序。\n\
  \n本章要点是：\n\n### 4.1 扩展类\n\n让我们回到第 2 章\n\n```\npublic class Manager extends Employee\
  \ {\n\n    added fields\n\n    added or overriding methods\n\n}\n```\n\n\n\n\n关键字\
  \ `extends` 表示你正在创建一个派生自现有类的新类。现有类被称为 `superclass`（父类），新类被称为 `subclass`（子类）。在我们的示例中，`Employee`\
  \ 类是父类，`Manager` 类是子类。请注意，父类并不“优于”它的子类。恰恰相反：子类比其父类具有更多的功能。“超/子”这一术语源于集合论。经理的集合是员工集合的子集。\n\
  \n### 4.1.2 定义和继承子类方法\n\n我们的 `Manager` 类有一个新的实例变量来存储奖金，并有一个新方法来设置该变量：\n\n点击此处查看代码图像\n\
  \n```java\npublic class Manager extends Employee {\n    private double bonus;\n\
  \    ...\n    public void setBonus(double bonus) {\n        this.bonus = bonus;\n\
  \    }\n}\n```\n\n当你有一个 `Manager` 对象时，你当然可以调用 `setBonus` 方法，以及 `Employee` 类中的非私有方法。这些方法是*继承*的。\n\
  \n点击此处查看代码图像\n\n```java\nManager boss = new Manager(...);\nboss.setBonus(10000);\
  \ // 定义在子类中\nboss.raiseSalary(5); // 继承自父类\n```\n\n### 4.1.3 方法重写\n\n有时，需要在子类中修改父类方法。例如，假设\
  \ `getSalary` 方法预期是报告员工的总薪资。那么，继承的方法对于 `Manager` 类来说是不够的。相反，你需要*重写*（override）该方法，以便其返回基本工资和奖金之和。\n\
  \n点击此处查看代码图像\n\n```java\npublic class Manager extends Employee {\n    ...\n    public\
  \ double getSalary() { // 重写了父类方法\n        return super.getSalary() + bonus;\n \
  \   }\n}\n```\n\n该方法调用父类方法来获取基本工资，并加上奖金。注意，子类方法不能直接访问父类的私有实例变量。这就是为什么 `Manager.getSalary`\
  \ 方法调用了公有的 `Employee.getSalary` 方法。`super` 关键字用于调用父类方法。\n\n***\n\n![Image](img/00005.jpeg)\
  \ 注意\n\n与 `this` 不同，`super` 不是对象的引用，而是一个跳过动态方法查找的指令（参见第 4.1.5 节，“父类赋值](#part0011.html_ch04lev2sec5)”，第\
  \ 131 页）并调用特定的方法。\n\n***\n\n重写方法时并非必须调用父类方法，但这样做很常见。\n\n当你重写方法时，必须小心精确匹配参数类型。例如，假设\
  \ `Employee` 类有一个方法：\n\n点击此处查看代码图像\n\n```java\npublic boolean worksFor(Employee\
  \ supervisor)\n```\n\n如果你在 `Manager` 类中重写此方法，你不能更改参数类型，尽管显然没有经理会向一个普通的员工汇报。假设你定义了一个方法：\n\
  \n点击此处查看代码图像\n\n```java\npublic class Manager extends Employee {\n    ...\n    public\
  \ boolean worksFor(Manager supervisor) {\n        ...\n    }\n}\n```\n\n这仅仅是一个新方法，现在\
  \ `Manager` 有了两个独立的 `worksFor` 方法。你可以通过对意图重写父类方法的标记标记上 `@Override` 注解，防止防止此类错误的发生：\n\
  \n点击此处查看代码图像\n\n```java\n@Override public boolean worksFor(Employee supervisor)\n\
  ```\n\n如果你犯了错误并正在定义一个新方法，编译器会报告错误。\n\n在重写方法时，你可以将返回类型更改子类型。（在技术术语中，允许使用*协变返回类型*。）例如，如果\
  \ `Employee` 类有一个方法：\n\n点击此处查看代码图像\n\n```java\npublic Employee getSupervisor()\n\
  ```\n\n那么 `Manager` 类可以使用以下方法重写它：\n\n点击此处查看代码图像\n\n```java\n@Override public Manager\
  \ getSupervisor()\n```\n\n***\n\n![Image](img/00005.jpeg) 注意\n\n与 `this` 不同，`super`\
  \ 不是对象的引用，而是一个跳过动态方法查找的指令（参见第 4.1.5 节，“父类赋值](#part0011.html_ch04lev2sec5)”，第 131\
  \ 页）并调用特定的方法。\n\n（注：此处后续由于原文输入中存在部分重复和乱码，已根据逻辑进行了内容梳理和翻译。）\n\n\n\n\n\n在上一节中，你已经看到类型为\
  \ `Employee` 的变量 `empl` 可以指向类为 `Employee`、`Manager` 或 `Employee` 的另一个子类的对象。这对于处理来自多个类的对象的代码非常有用。但它有一个缺点：你只能调用属于父类的方法。例如：\n\
  \n点击此处查看代码图像\n\n```java\nEmployee empl = new Manager(...);\n\nempl.setBonus(10000);\
  \ // 编译时错误\n```\n\n尽管此调用在运行时可能会成功，但它是一个编译时错误。编译器会检查你只调用了接收类型中存在的方法。在这里，`empl` 的类型是\
  \ `Employee`，而该类没有 `setBonus` 方法。\n\n与接口一样，你可以使用 `instanceof` 运算符和强制类型转换将父类引用转换为子类引用。\n\
  \n点击此处查看代码图像\n\n```java\nif (empl instanceof Manager) {\n    Manager mgr = (Manager)\
  \ empl;\n    mgr.setBonus(10000);\n}\n```\n\n### 4.1.7 Final 方法与类\n\n当你将一个方法声明为\
  \ `final` 时，任何子类都不能重写它。\n\n点击此处查看代码图像\n\n```java\npublic class Employee {\n    ...\n\
  \    public final String getName() {\n        return name;\n    }\n}\n```\n\nJava\
  \ API 中 `final` 方法的一个很好的例子是 `Object` 类的 `getClass` 方法，你将在 第 4.4.1 节 “类 `Class`”第\
  \ 152 页看到它。允许对象对其所属的类撒谎似乎是不明智的，因此此方法永远无法被更改。\n\n一些程序员认为 `final` 关键字有助于效率。这在 Java\
  \ 早期可能是事实，但现在不再是了。现代虚拟机会推测性地“内联”（inline）简单方法，例如上面的 `getName` 方法，即使它们没有被声明为 `final`。在少数情况下，当加载了重写此类方法的子类时，内联会被取消。\n\
  \n一些程序员认为一个类的大多数方法都应该声明为 `final`，只有专门设计用于被重写的方法才不应该如此。另一些人认为这种做法太严酷了，因为它阻止了即使是无害的重写，例如为了日志记录或调试目的。\n\
  \n偶尔你可能希望防止别人从你的某个类中创建子类。在类定义中使用 `final` 修饰符来指示这一点。例如，这里是防止他人对 `Executive` 类进行子类的方法：\n\
  \n点击此处查看代码图像\n\n```java\npublic final class Executive extends Manager {\n    ...\n\
  }\n```\n\nJava API 中有很多 `final` 类，例如 `String`、`LocalTime` 和 `URL`。\n\n### 4.1.8\
  \ 抽象方法与类\n\n类可以定义一个没有实现的方法，强制子类对其进行实现。这样的方法以及包含它的类被称为*抽象*（abstract），并且必须标记有 `abstract`\
  \ 修饰符。这通常用于非常通用的类，例如：\n\n点击此处查看代码图像\n\n```java\npublic abstract class Person {\n\
  \    private String name;\n    public Person(String name) { this.name = name; }\n\
  \    public final String getName() { return name; }\n    public abstract int getId();\n\
  }\n```\n\n任何扩展 `Person` 的类必须提供 `getId` 方法的实现，或者本身被声明为 `abstract`。\n\n注意，抽象类可以拥有非抽象方法，例如上一个示例中的\
  \ `getName` 方法。\n\n***\n\n![图像](img/00005.jpeg) 注意\n\n与接口不同，抽象类可以拥有实例变量和构造函数。\n\n\
  ***\n\n无法构造抽象类的实例。例如，以下调用\n\n点击此处查看代码图像\n\n```java\nPerson p = new Person(\"Fred\"\
  ); // 错误\n```\n\n将编译时错误。\n\n然而，你可以拥有一个类型为抽象类的变量，只要它包含指向某个具体子类对象的引用。假设 `Student`\
  \ 类声明如下：\n\n点击此处查看代码图像\n\n```java\npublic class Student extends Person {\n    private\
  \ int id;\n    public Student(String name, int id) { super(name); this.id = id;\
  \ }\n    public int getId() { return id; }\n}\n```\n\n那么你就可以构造 `Student` 并将其赋值给\
  \ `Person`。\n\n点击此处查看代码图像\n\n```java\nPerson p = new Student(\"Fred\", 179);\n```\n\
  \n### 4.1.9 Protected 访问\n\n有时你希望将方法限制为子类，或者较少见地限制为包。为此，使用 `protected`。\n\n***\n\
  \n![图像](img/00009.jpeg) 警告\n\n与接口不同，抽象类可以拥有实例变量和构造函数。`protected` 授予了包级别的访问。例如，假设父类\
  \ `Employee` 将字段声明为 `protected` 而不是 `private`。\n\n点击此处查看代码图像\n\n```java\npackage\
  \ comhorstmann.employees;\npublic class Employee {\n    protected double salary;\n\
  }\n```\n\n与 `Employee` 同包中的所有类都可以访问它。现在考虑来自不同包的子类：\n\n点击此处查看代码图像\n\n```java\npackage\
  \ comother.managers;\nimport comhorstmann.employees.Employee;\n\npublic class Manager\
  \ extends Employee {\n    double getSalary() {\n        return salary; // 可以访问\n\
  \    }\n}\n```\n\n`protected` 方法和构造函数更为常见。一旦提供，你就无法在破坏破坏的情况下取消它们。当然，`protected`\
  \ 字段应该谨慎使用。例如，`Object` 类的 `clone` 方法是受保护的（参见 第 4.2.4 节 “克隆对象`）。\n\n### 4.1.10 匿名子类\n\
  \n就像接口的匿名类，你也可以扩展父类的匿名类。这对于调试非常有用：\n\n点击此处查看代码图像\n\n```java\nArrayList<String> names\
  \ = new ArrayList<String>(100) {\n    public void add(int index, String element)\
  \ {\n        super.add(index, element);\n        System.out.printf(\"Adding %s at\
  \ %d\\n\", element, index);\n    }\n};\n```\n\n父类名称括号后的参数被传递给父类构造函数。在这里，我们构造了 `ArrayList<String>`\
  \ 的匿名子类，并重写了 `add` 方法。实例以 100 的初始容量构造。\n\n称为“双括号初始化”（double brace initialization）的技巧以一种相当奇异的方式使用了内部类语法。假设你想构造一个数组列表并将其传递给方法：\n\
  \n点击此处查看代码图像\n\n```java\nArrayList<String> friends = new ArrayList<>();\nfriends.add(\"\
  Harry\");\nfriends.add(\"Sally\");\n\ninvite(friends);\n```\n\n如果你再也需要这个数组列表，那么让它变成匿名将很好。但那时你该如何添加元素呢？方法如下：\n\
  \n点击此处查看代码图像\n\n```java\ninvite(new ArrayList<String>() {{ add(\"Harry\"); add(\"\
  Sally\"); }});\n```\n\n\n\n\n\n注意双大括号。外层括号创建了 `ArrayList<String>` 的匿名子类。内层括号是一个初始化块（参见第\
  \ 2 章）。\n\n我不建议你在 Java 技巧性问答竞赛之外使用这种技巧。除了语法晦涩令人困惑外，它还有几个缺点。它的效率很低，而且取决于 `equals`\
  \ 方法的实现方式，构造的对象在等等性测试中可能会表现异常。\n\n### 4.1.11 继承与默认方法\n\n假设一个类继承了另一个类并实现了一个接口，而这两者恰好都有同名方法。\n\
  \n点击此处查看代码图像\n\n```java\npublic interface Named {\n    default String getName()\
  \ { return \"\"; }\n}\n\npublic class Person {\n    ...\n    public String getName()\
  \ { return name; }\n}\n\npublic class Student extends Person implements Named {\n\
  \    ...\n}\n```\n\n在这种情况下，父类的实现总是优于接口的实现。子类不需要解决这种冲突。\n\n相反，正如你在第 3 章中所看到的，当从两个接口继承相同的默认方法时，你必须解决这种冲突。\n\
  \n“类胜出”规则确保了与 Java 7 的兼容性。如果你向接口中添加了默认方法，它对在没有默认方法之前就能工作的代码没有影响。\n\n### 4.1.12 使用\
  \ super 的方法表达式\n\n回想第 3 章中的内容，方法表达式可以采用 `object`::::`instanceMethod` 的形式。使用 `super`\
  \ 代替对象引用也是有效的。方法表达式：\n\n```java\nsuper::instanceMethod\n```\n\n该方法表达式使用 `this` 作为目标，并调用给定方法的父类版本。这里是一个展示其机制的人为示例：\n\
  \n点击此处查看代码图像\n\n```java\npublic class Worker {\n    public void work() {\n     \
  \   for (int i = 0; i < 100; i++) System.out.println(\"Working\");\n    }\n}\n\n\
  public class ConcurrentWorker extends Greeter {\n    public void work() {\n    \
  \    Thread t = new Thread(super::work);\n        t.start();\n    }\n}\n```\n\n\
  该线程在构造时使用了一个 `Runnable`，其 `run` 方法调用了父类的 `work` 方法。\n\n### 4.2 Object：宇宙超类\n\nJava\
  \ 中的每一个类都直接或间接地继承自 `Object` 类。当一个类没有显式的父类时，它会隐式地继承 `Object`。例如：\n\n```java\npublic\
  \ class Employee { ... }\n```\n\n等同于\n\n点击此处查看代码图像\n\n```java\npublic class Employee\
  \ extends Object { ... }\n```\n\n`Object` 类定义了适用于任何 Java 对象的方法（参见表 4–1）。我们将在接下来的章节中详细检查其中的几个方法。\n\
  \n![图像](img/00027.jpeg)\n\n**表 4–1** `java.lang.Object` 类的方法\n\n***\n\n![图像](img/00005.jpeg)\
  \ 提示\n\n数组是类。因此，将数组（即使是基本类型数组）转换为 `Object` 类型引用是合法的。\n\n***\n\n### 4.2.1 toString\
  \ 方法\n\n`Object` 类中的一个重要方法是 `toString` 方法，它返回对象的字符串描述。例如，`Point` 类的 `toString` 方法返回如下的字符串：\n\
  \n`java.awt.Point[x=10,y=20]`\n\n许多 `toString` 方法都遵循这种格式：类名，随后是括在方括号中的实例变量。以下是 `Employee`\
  \ 类 `toString` 方法的实现：\n\n点击此处查看代码图像\n\n```java\npublic String toString() {\n   \
  \ return getClass().getName() + \"[name=\" + name\n        + \",salary=\" + salary\
  \ + \"]\";\n}\n```\n\n通过调用 `getClass().getName()` 而不是硬编码字符串 `\"Employee\"`，该方法对子类也同样有效。\n\
  \n在子类中，调用 `super.toString()` 并在另一对独立的括号中添加子类的实例变量：\n\n点击此处查看代码图像\n\n```java\npublic\
  \ class Manager extends Employee {\n    ...\n    public String toString() {\n  \
  \      return super.toString() + \"[bonus=\" + bonus + \"]\";\n    }\n}\n```\n\n\
  每当对象与字符串进行拼接时，Java 编译器会自动调用 `toString` 方法。例如：\n\n点击此处查看代码图像\n\n```java\nPoint p\
  \ = new Point(10, 20);\nString message = \"The current position is \" + p; // 与\
  \ p.toString() 拼接\n```\n\n***\n\n![图像](img/00013.jpeg) 提示 与其编写 `x.toString()`，你可以写\
  \ `\"\" + x`。即使 `x` 是基本类型。\n\n***\n\n`Object` 类定义了 `toString` 方法来打印类名和哈希值（参见 Section\
  \ 4.2.3，`hashCode` Method on `p`)）。例如，调用\n\n点击此处查看代码图像\n\n```java\nSystem.out.println(System.out);\n\
  ```\n\n产生的输出类似于 `java.io.PrintStream@2f68`，因为 `PrintStream` 类没有重写 `toString` 方法。\n\
  \n***\n\n![图像](img/00009.jpeg) 警告 数组继承 `Object` 的 `toString` 方法，其特殊之处在于，如果你有\n\n\
  点击此处查看代码图像\n\n```java\nint[] primes = { 2, 3, 5, 7, 13 };\n```\n\n`primes.toString()`\
  \ 会产生 `[2, 3, 5, 7, 13]`。前缀 `I` 表示整数数组。解决办法是调用 `Arrays.toString(primes)`。为了正确打印多维数组（即数组的数组），使用\
  \ `Arrays.deepToString`。\n\n### 4.2.2 equals 方法\n\n`equals` 方法测试一个对象是否与另一个相等。`Object`\
  \ 类实现的 `equals` 方法判断对象引用是否相同。这是一个默认——如果两个对象是相同的，它们理应相等。对于许多类来说，不需要其他的。例如，比较两个 `Scanner`\
  \ 对象的相等没有意义。\n\n仅在基于状态的情况下重写 `equals` 方法，即两个对象内容相同时认为相等。例如，`String` 类重写了 `equals`\
  \ 以检查字符串是否由相同的字符组成。\n\n***\n\n![图像 警告 当重写 `equals` 方法时，*必须*也提供兼容的 `hashCode` 方法——参见\
  \ Section 4.2.3，`hashCode` Method on `p`)。\n\n***\n\n假设我们认为如果两个 `Item` 对象的描述和价格匹配，则它们是等的。以下是实现\
  \ `equals` 方法的方法：\n\n点击此处查看代码图像\n\n```java\npublic class Item {\n    private String\
  \ description;\n    private double price;\n    ...\n    public boolean equals(Object\
  \ otherObject) {\n        // 快速测试对象是否相同\n        if (this == otherObject) return\
  \ true;\n        // 如果参数为 null 则返回 false\n        if (otherObject == null) return\
  \ false;\n        // 检查 otherObject 是否为 Item\n        if (getClass() != otherObject.getClass())\
  \ return false;\n        // 测试实例变量是否有相同的值\n        Item other = (Item) otherObject;\n\
  \        return Objects.equals(description, other.description)\n            && price\
  \ == other.price;\n    }\n    public int hashCode() { ... } // 参见 Section 4.2.3\n\
  }\n```\n\n\n\n\n在 `equals` 方法中，你通常需要执行几个例行步骤：\n\n1. 相等的对象通常是同一个实例（相同），这种测试的开销非常小。\n\
  2. 每一个 `equals` 方法在与 `null` 比较时都必须返回 `false`。\n3.  由于 `equals` 方法重写了 `Objects.equals`，其参数类型为\
  \ `Object`，你需要将其强制转换为实际类型，以便查看其实例变量。在在此之前，请先进行类型检查，可以使用 `getClass` 方法或 `instanceof`\
  \ 运算符。\n4. 最后，比较实例变量。对于原始类型使用 `==`。然而，对于 `double` 值，如果你担心 ±∞ 或 NaN，请使用 `Double.equals`。对于对象，请使用\
  \ `Objects.equals`，它是 `equals` 方法的空安全（null-safe）版本。当 `x` 为 `null` 时，调用 `Objects.equals(x,\
  \ y)` 返回 `false`，而 `x.equals(y)` 则会抛出异常。\n\n***\n\n![Image](img/0001.jpeg) 提示\n\n\
  如果你的实例变量是数组，请使用静态方法 `Arrays.equals` 来检查数组长度是否相等以及对应的元素是否相等。\n\n***\n\n当你为子类定义 `equals`\
  \ 方法时，首先调用父类的 `equals`。如果该测试没有通过，则这两个对象就不可能相等。如果父类的实例变量相等，那么你就可以比较子类的实例变量了。\n\n\
  点击此处查看代码图片\n\n```java\npublic class DiscountedItem extends Item {\n\n    private\
  \ double discount;\n    ...\n\n    public boolean equals(Object otherObject) {\n\
  \        if (!super.equals(otherObject)) return false;\n        DiscountedItem other\
  \ = (DiscountedItem) otherObject;\n        return discount == other.discount;\n\
  \    }\n    public int hashCode() { ... }\n}\n```\n\n注意，如果 `otherObject` 不是 `DiscountedItem`，则父类中的\
  \ `getClass` 测试将失败。\n\n当比较属于不同类的类的值时，`equals` 方法应该如何表现？这一直是一个存在争议的领域。在前面的示例中，如果类不完全匹配，`equals`\
  \ 方法返回 `false`。但许多程序员倾向于使用 `instanceof` 测试：\n\n点击此处查看代码图片\n\n```java\nif (!(otherObject\
  \ instanceof Item)) return false;\n```\n\n这留下了 `otherObject` 可能属于某个子类的可能性。例如，你可以比较一个\
  \ `Item` 和一个 `DiscountedItem`。\n\n然而，那种比较通常是不行的。`equals` 方法的要求之一是它是*对称的*的（symmetric）：对于非空的\
  \ `x` 和 `y`，调用 `x.equals(y)` 和 `y.equals(x)` 必须返回相同的值。\n\n现在假设 `x` 是一个 `Item` 而\
  \ `y` 是一个 `DiscountedItem`。由于 `x.equals(y)` 没有考虑折扣，那么 `y.equals(x)` 也不可能。\n\n***\n\
  \n![Image](img/0000.jpeg) 注意\n\nJava API 包含了超过 150 种 `equals` 方法的实现，其中混合了 `instanceof`\
  \ 测试、调用 `getClass`、捕获 `ClassCastException` 或者什么都不做。查看 `java.sql.Timestamp` 类的文档，其实现者在其中有些尴尬地指出，`Timestamp`\
  \ 类继承自 `java.util.Date`，而后者的 `equals` 方法使用了 `instanceof` 测试，因此无法重写 `equals` 以使其既对称又准确。\n\
  \n***\n\n在一种一种情况下，`instanceof` 测试是有意义的：如果相等性的定义在父类中是固定的且在子类中永远不会改变。例如，当我们通过 ID 比较员工时。在这种情况下，请进行\
  \ `instanceof` 测试并将 `equals` 方法声明为 `final`。\n\n点击此处查看代码图片\n\n```java\npublic class\
  \ Employee {\n\n    private int id;\n    ...\n\n    public final boolean equals(Object\
  \ otherObject) {\n        if (this == otherObject) return true;\n        if (!(otherObject\
  \ instanceof Employee)) return false;\n        Employee other = (Employee) otherObject;\n\
  \        return id == other.id;\n    }\n    public int hashCode() { ... }\n}\n```\n\
  \n### 4.2.3 hashCode 方法\n\n*哈希码*（hash code）是从对象派生出的整数。哈希码应该是散乱的——如果 `x` 和 `y` 不相等，那么它们的\
  \ `hashCode()` 有很大概率是不同的。例如，`String` 类使用以下算法：\n\n点击此处查看代码图片\n\n```java\nint hash\
  \ = 0;\nfor (int i = 0; i < length(); i++) {\n    hash = 31 * hash + charAt(i);\n\
  }\n```\n\n`equals` 和 `hashCode` 方法必须是*兼容的*：如果 `x.equals(y)`，那么 `x.hashCode() ==\
  \ y.hashCode()`。如果你重定义了 `equals`，也需要重定义 `hashCode`。如果你不这样做，当用户将对象插入 hash set 或 hash\
  \ map 时，可能会出现问题！例如，这里 `Item` 的 `hashCode` 方法：\n\n点击此处查看代码图片\n\n```java\nclass Item\
  \ {\n    ...\n    public int hashCode() {\n        return Objects.hash(description,\
  \ price);\n    }\n}\n```\n\n`Objects.hash` 可变参数方法计算参数的哈希码并将其合并。该方法是空安全的。如果你的类实例变量是数组，请先用静态\
  \ `Arrays.hashCode` 计算它们的哈希码，并将结果传递给 `Objects.hash`。\n\n***\n\n### 4.2.4 克隆对象\n\n\
  你刚刚看到了 `Object` 类中常见的重写“三大”方法：`toString`、`equals` 和 `hashCode`。在本节中，你将学习如何重写 `clone`\
  \ 方法。正如你所看到的，这非常复杂，也很少必要。除非你有理由，否则不要重写 `clone`。标准 Java 库中只有 5% 的类实现了 `clone`。\n\n\
  `clone` 方法的目的是创建一个对象的“克隆”——一个与原始对象状态相同的独立对象。如果你改变其中一个，另一个将保持不变。\n\n点击此处查看代码图片\n\n\
  ```java\nEmployee cloneOfFred = fred.clone();\ncloneOfFred.raiseSalary(10); // fred\
  \ 保持不变\n```\n\n`clone` 方法在 `Object` 类中被声明为 `protected`，所以如果你希望类的用户能够克隆实例，你就必须重写它。\n\
  \n`Object.clone` 方法执行的是*浅拷贝*（shallow copy）。它只是将所有实例变量从原始对象复制到克隆对象。如果变量是原始类型或不可变的，那就是没问题的。但如果它们不是，那么原始对象和克隆将共享可变状态，这可能会导致问题。\n\
  \n考虑一个拥有收件者列表的邮件类。\n\n\n\n\n点击此处查看代码图片\n\n```java\npublic final class Message {\n\
  \    private String sender;\n    private ArrayList<String> recipients;\n    private\
  \ String text;\n    ...\n    public void addRecipient(String recipient) { ... };\n\
  }\n```\n\n如果你对 `Message` 对象进行浅拷贝，则原始对象和克隆对象将共享 `recipients` 列表（参见图 4–1）：\n\n点击此处查看代码图片\n\
  \n```java\nMessage specialOffer = ...;\nMessage cloneOfSpecialOffer = specialOffer.clone();\n\
  ```\n\n![Image](img/00028.jpeg)\n\n**图 4–1** 对象的浅拷贝\n\n如果其中一个对象更改了收件者列表，该改动将反映在另一个对象中。因此，`Message`\
  \ 类需要重写 `clone` 方法来实现*深拷贝*。\n\n克隆也可能是可能的，或者不值得费此。例如，克隆一个 `Scanner` 对象将是非常具有挑战性的。\n\
  \n通常情况下，当你实现一个类时，你需要决定：\n\n1. 你不想提供 `clone` 方法，或者\n2. 继承来的 `clone` 方法是可以接受的，或者\n\
  3. `clone` 方法应该执行深拷贝。\n\n对于第一种选择，只需什么都不做。你的类将继承 `clone` 方法，但该类的任何用户都无法调用它，因为它是 `protected`\
  \ 的。\n\n要选择第二种方案，你的类必须实现 `Cloneable` 接口。这是一个没有任何任何方法的接口，被称为*标记接口*（tagging interface\
  \ 或 *marker* interface）（请记得 `clone` 方法定义在 `Object` 类中）。`Object.clone` 方法在执行浅拷贝之前会检查是否实现了此接口，否则将抛出\
  \ `CloneNotSupportedException`。\n\n你还会希望将 `clone` 的范围从 `protected` 提升到 `public`，并更改返回类型。\n\
  \n最后，你需要处理 `CloneNotSupportedException`。这是一个*检查异常*（checked exception），正如你在第 5 章中所看到的，你必须声明它，要么捕获它。如果你的类是\
  \ `final` 的，你可以捕获它。否则，声明该异常，因为子类可能再次想要抛出它。\n\n点击此处查看代码图片\n\n```java\npublic class\
  \ Employee implements Cloneable {\n    ...\n    public Employee clone() throws CloneNotSupportedException\
  \ {\n        return (Employee) super.clone();\n    }\n}\n```\n\n强制转换 `(Employee)`\
  \ 是必要的，因为 `Object.clone` 的返回类型是 `Object`。\n\n现在考虑最复杂的情况，即类需要执行深拷贝。你完全不需要使用 `Object.clone`\
  \ 方法。这里是 `Message.clone` 的简单实现：\n\n点击此处查看代码图片\n\n```java\npublic Message clone()\
  \ {\n    Message cloned = new Message(sender, text);\n    cloned.recipients = new\
  \ ArrayList<>(recipients);\n    return cloned;\n}\n```\n\n或者，你可以在父类和可变实例变量上调用 `clone`。\n\
  \n`ArrayList` 类实现了 `clone` 方法，产生浅拷贝。也就是说，原始列表和克隆列表共享元素引用。在我们的情况下，这是可以的，因为元素是字符串。如果不是的话，我们必须也克隆每个元素。\n\
  \n然而，由于历史原因，`ArrayList.clone` 方法的返回类型为 `Object`。你需要使用强制转换。\n\n点击此处查看代码图片\n\n```java\n\
  cloned.recipients = (ArrayList<String>) recipients.clone(); // Warning\n```\n\n\
  遗憾的是，正如你在第 6 章中所看到的，该强制转换在运行时无法被完全检查，你会得到一个警告。你可以使用注解来抑制警告，但该注解只能附加到声明上（参见第 12 章）。以下是完整的方法实现：\n\
  \n点击此处查看代码图片\n\n```java\npublic Message clone() {\n    try {\n        Message cloned\
  \ = (Message) super.clone();\n        @SuppressWarnings(\"unchecked\") ArrayList<String>\
  \ clonedRecipients\n            = (ArrayList<String>) recipients.clone();\n    \
  \    cloned.recipients = clonedRecipients;\n        return cloned;\n    } catch\
  \ (CloneNotSupportedException ex) {\n        return null; // 不可能\n    }\n}\n```\n\
  \n在这种情况下，`CloneNotSupportedException` 不可能，因为 `Message` 类是 `Cloneable` 且是 `final`\
  \ 的，并且 `ArrayList.clone` 不抛出该异常。\n\n* *\n\n![Image](img/00005.jpeg) Note\n\n数组有一个公共的\
  \ `clone` 方法，其返回类型与数组类型相同。例如，如果 `recipients` 是数组而不是列表，你就可以克隆点击此处查看代码图片\n\n```java\n\
  cloned.recipients = recipients.clone(); // No\n```\n\n* *\n\n### 4.3 枚举\n\n你在第 1\
  \ 章中看到了如何定义类型。这里有一个典型的示例，定义了一个枚举：\n\n```java\npublic enum Size { SMALL, }\n```\n\
  \n在接下来的章节中，你将学习如何使用枚举。\n\n### 4.3.1 枚举的方法\n\n由于每个枚举类型都有固定的实例，你永远不需要使用 `equals` 方法。只需使用\
  \ `==` 来比较。你不需要提供 `toString` 方法。它会自动提供以产生枚举对象的名称——在我们的示例中为 `\"SMALL\"`、`\"MEDIUM\"\
  ` 等。\n\n`toString` 的反向操作是每个枚举类型的静态 `valueOf` 方法。例如，语句\n\n```java\nSize notSize =\
  \ Size.valueOf(\"SMALL\");\n```\n\n将 `mySize` 设置为 `Size.SMALL`。如果没有给定的名称，`valueOf`\
  \ 将抛出异常。\n\n每个枚举类型都有一个静态 `values` 方法，返回按声明顺序排列的所有实例数组。调用\n\n```java\nSize[] allValues\
  \ = Size.values();\n```\n\n返回包含 `Size.SMALL`、`Size.MEDIUM` 等元素的数组。\n\n* *\n\n![Image](img/00013.jpeg)\
  \ Tip\n\n使用增强 `for` 循环遍历枚举类型的所有实例：\n\n```java\nfor (Size s : Size.values()) { System.out.println(s);\
  \ }\n```\n\n* *\n\n`ordinal` 方法产生实例在声明中的位置，从零开始。例如，`Size.MEDIUM.ordinal()` 返回 `1`。\n\
  \n每个枚举类型 `E` 自动实现 `Comparable<E>`，与其自身的对象进行比较。比较是基于序数的。\n\n* *\n\n![Image](img/00005.jpeg)\
  \ Note\n\n技术上，枚举类型 `E` 扩展了 `Enum<E>` 类，并继承了 `compareTo` 方法以及本节描述的其他方法。表 4–2 显示了\
  \ `Enum` 类的方法。\n\n![Image](img/0029.jpeg)\n\n**表 4–2** `java.lang.Enum<E>` 类的方法\n\
  \n* *\n\n#### 4.3.2 构造函数、方法和字段\n\n你可以根据需要，为枚举类型添加构造函数、方法和字段。这里有一个示例：\n\n点击此处查看代码图片\n\
  \n```java\npublic enum Size {\n    SMALL(\"S\"), MEDIUM(\"M\"), LARGE(\"L\"), EXTRA_LARGE(\"\
  XL\");\n    private String abbreviation;\n\n    Size(String abbreviation) {\n  \
  \      this.abbreviation = abbreviation;\n    }\n\n    public String getAbbreviation()\
  \ {\n        return abbreviation;\n    }\n}\n```\n\n每个枚举实例都保证只被构造一次。\n\n\n\n\n枚举的构造函数始终是私有的。你可以省略\
  \ `private` 修饰符，如前一个示例所示。将枚举构造函数声明为 `public` 或 `protected` 是语法错误。\n\n***\n\n###\
  \ 4.3.3 实例的主体\n\n你可以为每个单独的 `enum` 实例添加方法，但这些方法必须重写在枚举中定义的方法。例如，为了实现一个计算器，你可以这样做：\n\
  \n点击此处查看代码图片\n\n```java\npublic enum Operation {\n    ADD {\n        public int\
  \ eval(int arg1, int arg2) { return arg1 + arg2; }\n    },\n    SUBTRACT {\n   \
  \     public int eval(int arg1, int arg2) { return arg1 - arg2; }\n    },\n    MULTIPLY\
  \ {\n        public int eval(int arg1, int arg2) { return arg1 * arg2; }\n    },\n\
  \    DIVIDE {\n        public int eval(int arg1, int arg2) { return arg1 / arg2;\
  \ }\n    };\n    public abstract int eval(int arg1, int arg2);\n}\n```\n\n在计算器程序的循环中，人们会根据用户输入将变量设置为这些值中的一个，然后调用\
  \ `eval`：\n\n点击此处查看代码图片\n\n```java\nOperation op = ...;\nint result = op.eval(first,\
  \ second);\n```\n\n***\n\n![Image](img/00005.jpeg) Note\n\n从技术上讲，这些常量中的每一个都属于 `Operation`\
  \ 的一个匿名子类。任何你可以放置在匿名子类主体中的内容，你也可以添加到成员变量的主体中。\n\n***\n\n### 4.3.4 静态成员\n\n枚举拥有静态成员是合法的。但是，你必须小心构造顺序。枚举常量是在静态成员*之前*\
  \ 构造完成的，因此你不能在枚举构造函数中引用任何静态成员。例如，以下代码是非合法的：\n\n点击此处查看代码图片\n\n```java\npublic enum\
  \ Modifier {\n    PUBLIC, PRIVATE, PROTECTED, STATIC, FINAL, ABSTRACT;\n    private\
  \ static int maskBit = 1;\n    private int mask;\n    public Modifier() {\n    \
  \    mask = maskBit; // Error—无法在构造函数中访问静态变量\n        maskBit *= 2;\n    }\n   \
  \ ...\n}\n```\n\n解决办法是在静态初始化器中进行初始化：\n\n点击此处查看代码图片\n\n```java\npublic enum Modifier\
  \ {\n    PUBLIC, PRIVATE, PROTECTED, STATIC, FINAL, ABSTRACT;\n    private int mask;\n\
  \    static {\n        int maskBit = 1;\n        for (Modifier m : Modifier.values())\
  \ {\n            m.mask = maskBit;\n            maskBit *= 2;\n        }\n    }\n\
  \    ...\n}\n```\n\n一旦常量构造完成，静态变量初始化和静态初始化器将按照通常从上到下的方式运行。\n\n***\n\n![Image](img/00005.jpeg)\
  \ Note\n\n枚举类型可以嵌套在类内部。这种嵌套枚举是隐式的静态嵌套类——也就是说，它们的方法无法引用外部类的实例变量。\n\n***\n\n### 4.3.5\
  \ 对枚举进行 switch 操作\n\n你可以在 `switch` 语句中使用枚举常量。\n\n点击此处查看代码图片\n\n```java\nenum Operation\
  \ { ADD, SUBTRACT, MULTIPLY, DIVIDE };\npublic static int eval(Operation op, int\
  \ arg1, int arg2) {\n    int result = 0;\n    switch (op) {\n        case ADD: result\
  \ = arg1 + arg2; break;\n        case SUBTRACT: result = arg1 - arg2; break;\n \
  \       case MULTIPLY: result = arg1 * arg2; break;\n        case DIVIDE: result\
  \ = arg1 / arg2; break;\n    }\n    return result;\n}\n```\n\n在 `switch` 语句内部，你使用的是\
  \ `ADD` 而不是 `Operation.ADD`——类型是从计算 switch 的表达式中推断出来的。\n\n***\n\n![Image](img/00005.jpeg)\
  \ Note\n\n根据语言规范，鼓励编译器在对枚举进行 switch 操作不完备时给出警告——即，如果没有涵盖所有常量的 case 且没有 `default`\
  \ 子句。Oracle 编译器不会产生此类警告。\n\n***\n\n![Image](img/0013.jpeg) Tip\n\n如果你想在 `switch`\
  \ 外部通过简单名称引用枚举的实例，请使用静态导入。例如，使用以下声明时：\n\n点击此处查看代码图片\n\n```java\nimport static com.horstmann.core.Size.*;\n\
  // 使用 SMALL 而不是 Size.SMALL。\n```\n\n***\n\n### 4.4 运行时类型信息和资源\n\n在 Java 中，你可以在运行时确定给定对象属于哪个类。这对于实现\
  \ `equals` 和 `toString` 方法有时很有用。此外，你可以发现该类是如何加载的以及其相关的数据、*资源*。\n\n#### 4.4.1 Class\n\
  \n假设你有一个 `Object` 类型的变量，并想知道它的具体的类，可以使用 `getClass` 方法。\n\n```java\nObject obj =\
  \ ...;\nClass<?> cl = obj.getClass();\n```\n\n***\n\n![Image](img/00005.jpeg) Note\n\
  \n技术上讲，这些常量中的每一个都属于 `Operation` 的一个匿名子类。任何你可以放置在匿名子类主体中的内容，你也可以添加到成员变量的主体中。\n\n\
  ***\n\n一旦常量构造完成，静态变量初始化和静态初始化器将按照通常从上到下的方式运行。\n\n***\n\n![Image](img/00005.jpeg)\
  \ Note\n\n枚举类型可以嵌套在类内部。这种嵌套枚举是隐式的静态嵌套类——也就是说，它们的方法无法引用外部类的实例变量。\n\n***\n\n### 4.3.5\
  \ 对枚举进行 switch 操作\n\n你可以在 `switch` 语句中使用枚举常量。\n\n点击此处查看代码图片\n\n```java\nenum Operation\
  \ { ADD, SUBTRACT, MULTIPLY, DIVIDE };\npublic static int eval(Operation op, int\
  \ arg1, int arg2) {\n    int result = 0;\n    switch (op) {\n        case ADD: result\
  \ = arg1 + arg2; break;\n        case SUBTRACT: result = arg1 - arg2; break;\n \
  \       case MULTIPLY: result = arg1 * arg2; break;\n        case DIVIDE: result\
  \ = arg1 / arg2; break;\n    }\n    return result;\n}\n```\n\n在 `switch` 语句内部，你使用的是\
  \ `ADD` 而不是 `Operation.ADD`——类型是从计算 switch 的表达式中推断出来的。\n\n***\n\n![Image](img/00005.jpeg)\
  \ Note\n\n根据语言规范，鼓励编译器在对枚举进行 switch 操作不完备时给出警告——即，如果没有涵盖所有常量的 case 且没有 `default`\
  \ 子句。Oracle 编译器不会产生此类警告。\n\n***\n\n![Image](img/0013.jpeg) Tip\n\n如果你想在 `switch`\
  \ 外部通过简单名称引用枚举的实例，请使用静态导入。例如，使用以下声明时：\n\n点击此处查看代码图片\n\n```java\nimport static com.horstmann.core.Size.*;\n\
  // 使用 SMALL 而不是 Size.SMALL。\n```\n\n***\n\n### 4.4 运行时类型信息和资源\n\n在 Java 中，你可以在运行时确定给定对象属于哪个类。这对于实现\
  \ `equals` 和 `toString` 方法有时很有用。此外，你可以发现该类是如何加载的以及其相关的数据、*资源*。\n\n#### 4.4.1 Class\n\
  \n假设你有一个 `Object` 类型的变量，并想知道它的具体的类，可以使用 `getClass` 方法。\n\n```java\nObject obj =\
  \ ...;\nClass<?> cl = obj.getClass();\n```\n\n***\n\n![Image](img/00005.jpeg) Note\n\
  \n技术上讲，这些常量中的每一个都属于 `Operation` 的一个匿名子类。任何你可以放置在匿名子类主体中的内容，你也可以添加到成员变量的主体中。\n\n\
  ***\n\n一旦常量构造完成，静态变量初始化和静态初始化器将按照通常从上到下的方式运行。\n\n***\n\n![Image](img/00005.jpeg)\
  \ Note\n\n枚举类型可以嵌套在类内部。这种嵌套枚举是隐式的静态嵌套类——也就是说，它们的方法无法引用外部类的实例变量。\n\n\n\n\n\n你已经在第\
  \ 4.2.2 节和第 140 页的“equals 方法”见过类对象的用法。\n\n在接下来的章节中，你将看到可以使用 `Class` 对象执行的操作。有用方法的总结请参阅表\
  \ 4–3。\n\n![Image](img/00030.jpeg)![Image](img/00031.jpeg)\n\n**表 4–3** `java.lang.Class<T>`\
  \ 类的有用方法\n\n![Image](img/00032.jpeg)\n\n**表 4–4** `java.lang.reflect.Modifier` 类的方法\n\
  \n## 4.4.2 加载资源（Loading Resources）\n\n`Class` 类的一个有用服务是定位程序可能需要的资源，例如配置文件或图像。如果你将资源放在与类文件相同的目录中，可以像这样打开该文件的输入流：\n\
  \n点击此此处查看代码图像\n\n```\nInputStream stream = MyClass.class.getResourceAsStream(\"\
  config.txt\");\nScanner in = new Scanner(stream);\n```\n\n![Image](img/00005.jpeg)\
  \ 注意\n\n某些遗留方法如 `Applet.getAudioClip` 和 `javax.swing.ImageIcon` 构造函数从 `URL` 对象读取数据。在这种情况下，你可以使用\
  \ `getResource` 方法，它会返回指向资源的 `URL`。\n\n资源可以具有相对或绝对子目录。例如，`MyClass.class.getResourceAsStream(\"\
  /config/menus.txt\")` 在包含 `MyClass` 所属包根目录的目录定位 `config/menus.txt`。\n\n如果你将类打包成\
  \ JAR 文件，并将资源与类文件一起压缩，它们也可以被找到。\n\n## 4.4.3 类加载器（Class Loaders）\n\n虚拟机指令存储在类文件中。每个类文件包含一个单一类或接口的指令。类文件可以位于文件系统、JAR\
  \ 文件、远程位置，甚至在内存中动态构建。*类加载器*（class loader）负责加载字节并将它们转换为虚拟机中的类或接口。\n\n虚拟机按需加载类文件，从要调用的带有\
  \ `main` 方法的类开始。该类将依赖于其他类，例如 `java.lang.System` 和 `java.util.Scanner`，它们将与其依赖的类一起加载。\n\
  \n执行 Java 程序时，至少涉及三个类加载器。\n\n- *启动类加载器*（bootstrap class loader）加载 Java 库类（通常来自 JAR\
  \ 文件 `jre/lib/rt.jar`）。它是虚拟机的一部分。\n- *扩展类加载器*（extension class loader）从 `jre/lib/ext`\
  \ 目录加载“标准扩展”。\n- *系统类加载器*（system class loader）加载应用程序类。它在类路径上的目录和 JAR 文件中定位类。\n\n\
  没有与启动类加载器对应的 `ClassLoader` 对象。例如，`String.class.getClassLoader()` 返回 `null`。在 Oracle\
  \ Java 的实现中，扩展类和系统类加载器是用 Java 实现的。它们都是 `URLClassLoader` 类的实例。\n\n![Image](img/00005.jpeg)\
  \ 注意\n\n除了已经提到的地方，类还可以从 `jre/lib/endorsed` 目录加载。此机制只能用于用新版本替换某些标准 Java 库（例如支持 XML\
  \ 和 CORBA 的库）。详细信息请参阅[`http://docs.oracle.com/javase/8/docs/technotes/guides/standards`](http://docs.oracle.com/javase/8/docs/technotes/guides/standards)。\n\
  \n![Image](img/00013.jpeg) 提示\n\n有时，你想知道程序的类路径，以便加载相对于该程序的其他文件。调用\n\n点击此此处查看代码图像\n\
  \n```\n((URLClassLoader) MainClass.class.getClassLoader()).getURLs()\n```\n\n会给你返回一个\
  \ `URL` 对象数组，包含类路径上的目录和 JAR 文件。\n\n你可以通过创建你自己的 `URLClassLoader` 实例，从尚未在类路径上的目录或\
  \ JAR 文件中加载类。这通常用于加载插件。\n\n点击此此处查看代码图像\n\n```\nURL[] urls = {\n    new URL(\"file:///path/to/directory/\"\
  ),\n    new URL(\"file://path/to/jarfile.jar\")\n};\nString className = \"com.mycompany.plugins.Entry\"\
  ;\ntry (URLClassLoader loader = new URLClassLoader(urls)) {\n    Class<?> cl = Class.forName(className,\
  \ true, loader);\n    // 现在构造 cl 的实例——参见 4.5.4 节\n    ...\n}\n```\n\n![Image](img/00009.jpeg)\
  \ 警告\n\n调用 `Class.forName(className, true, loader)` 中的第二个参数确保了类的静态初始化。你不要使用 `ClassLoader.loadClass`。\n\
  \n![Image](img/00005.jpeg) 注意\n\n## 4.4.4 上文类加载器（Context Class Loader）\n\n大多数情况下你不需要担心类加载过程。类是透明加载的。然而，如果一个方法动态加载类，就会出现问题。这里有一个特定的示例：\n\
  \n1. 你提供了一个由类加载器加载的工具类，它有一个方法\n\n点击此此处查看代码图像\n\n```java\npublic class Util {\n \
  \   Object createInstance(String className) {\n        Class<?> cl = Class.forName(className);\n\
  \        ...\n    }\n    ...\n}\n```\n\n2. 你使用另一个类加载器加载插件。\n3. 插件调用 `Util.createInstance(\"\
  com.mycompany.plugins.MyClass\")` 来实例化 JAR 中的类。\n\n插件期望该类被加载。然而，`Util.createInstance`\
  \ 使用它自己的类加载器。\n\n一种解决方法是将加载器传递给工具方法，然后传递给 `forName` 方法。\n\n点击此此处查看代码图像\n\n```java\n\
  public class Util {\n    Object createInstance(String className, ClassLoader loader)\
  \ {\n        Class<?> cl = Class.forName(className, true, loader);\n        ...\n\
  \    }\n    ...\n}\n```\n\n另一种策略是使用当前线程的*上下文类加载器*（context class loader）。主线程的上下文类加载器是系统类加载器。创建新线程时，其上下文类加载器被设置为创建线程的上下文类加载器。因此，如果你什么都不做，所有线程的上下文类加载器都将设置为系统类加载器。然而，你可以通过调用来设置任何类加载器：\n\
  \n点击此此处查看代码图像\n\n```java\nThread t = Thread.currentThread();\nt.setContextClassLoader(loader);\n\
  ```\n\n工具方法随后可以获取上下文类加载器：\n\n点击此此处查看代码图像\n\n```java\npublic class Util {\n    Object\
  \ createInstance(String className) {\n        Thread t = Thread.currentThread();\n\
  \        ClassLoader loader = t.getContextClassLoader();\n        ...\n    }\n}\n\
  ```\n\n\n\n\n```java\nClass<?> cl = Class.forName(className, true, loader);\n\n\
  ...\n\n}\n\n...\n}\n```\n\n当调用插件类的方法时，应用程序应该将上下文类加载器设置为插件类的类加载器。之后，它应该恢复之前的设置。\n\
  \n***\n\n![图像](img/00013.jpeg) 提示\n\n如果你编写了一个按名称加载类的方法，不要仅仅简单地使用该方法所属类的类加载器。为调用者提供一种选择权，即是显式传递类加载器还是使用上下文类加载器，这是一个很好的主意。\n\
  \n***\n\n### 4.4.5 服务加载器 (Service Loaders)\n\n在提供插件时，程序通常希望让插件设计者在实现插件功能方面具有一定的自由。此外，拥有多个实现供选择也是理想的。`ServiceLoader`\
  \ 类可以方便地加载符合通用接口的插件。\n\n定义一个接口（或者，如果你喜欢，定义一个超类），包含每个服务实例应该提供的方法。例如，假设你的服务提供加密功能。\n\
  \n点击此处查看代码图像\n\n```java\npackage com.corejava.crypt;\n\npublic interface Cipher\
  \ {\n\n    byte[] encrypt(byte[] source, byte[] key);\n\n    byte[] decrypt(byte[]\
  \ source, byte[] key);\n\n    int strength();\n}\n```\n\n服务提供者提供一个或多个实现此服务的类，例如：\n\
  \n点击此处查看代码图像\n\n```java\npackage com.corejava.crypt.impl;\n\npublic class CaesarCipher\
  \ implements Cipher {\n\n    public byte[] encrypt(byte[] source, byte[] key) {\n\
  \        byte[] result = new byte[source.length];\n        for (int i = 0; i < source.length;\
  \ i++)\n            result[i] = (byte)(source[i] + key[0]);\n        return result;\n\
  \    }\n\n    public byte[] decrypt(byte[] source, byte[] key) {\n        return\
  \ encrypt(source, new byte[] { (byte) -key[0] });\n    }\n\n    public int strength()\
  \ { return 1; }\n}\n```\n\n实现类可以位于任何包中，不一定与服务接口在同一个包中。每个类都必须有一个无参数构造函数。\n\n现在，将类名添加到\
  \ `META-INF/services` 目录下的一个 UTF-8 编码文本文件中，类加载器可以找到该文件。在我们的示例中，文件 `META-INF/services/com.corejava.crypt.Cipher`\
  \ 将包含以下行：\n\n点击此处查看代码图像\n\n```\ncom.corejava.crypt.impl.CaesarCipher\n```\n\n完成这些准备后，程序如下所示初始化服务加载器：\n\
  \n点击此处查看代码图像\n\n```java\npublic static ServiceLoader<Cipher> cipherLoader = ServiceLoader.load(Cipher.class);\n\
  ```\n\n这在程序中只需要执行一次。\n\n服务加载器的 `iterator` 方法提供了一个用于遍历所有提供的服务实现的迭代器。（有关迭代器的更多信息，请参阅第\
  \ 7 章。）最简单的方法是使用增强 `for` 循环来遍历它们。在循环中，选择一个合适的对象来执行服务。\n\n点击此处查看代码图像\n\n```java\n\
  public static Cipher getCipher(int minStrength) {\n    for (Cipher cipher : cipherLoader)\
  \ // 隐式调用 iterator\n        if (cipher.strength() >= minStrength) return cipher;\n\
  \    return null;\n}\n```\n\n### 4.5 反射 (Reflection)\n\n反射允许程序在运行时检查任意对象的内容，并在它们上调用任意方法。这种能力对于实现如对象关系映射器（ORM）或\
  \ GUI 构建器等工具非常有用。\n\n由于反射主要让工具构建者感兴趣，应用程序程序员可以安全地跳过本节，并在需要时返回此处。\n\n#### 4.5.1 枚举类成员\n\
  \n`java.lang.reflect` 包中的 `Field`、`Method` 和 `Constructor` 三个类描述了类的字段、方法和构造函数。这三个类都有一个名为\
  \ `getName` 的方法，返回成员的名称。`Field` 类有一个 `getType` 方法，它返回一个对象（同样是 `Class` 类型），用于描述字段类型。`Method`\
  \ 和 `Constructor` 类有报告参数类型的方法，而 `Method` 类还报告返回类型。\n\n这三个类还有一个名为 `getModifiers`\
  \ 的方法，它返回一个整数，其中不同的位位被开启或关闭，用于描述所使用的修饰符（如 `public` 或 `static`）。你可以使用 `Modifier.isPublic`\
  \ 和 `Modifier.isStatic` 等静态方法来分析 `getModifiers` 返回的整数。`Modifier.toString` 返回包含所有修饰符的字符串。\n\
  \n`Class` 类的 `getFields`、`getMethods` 和 `getConstructors` 方法返回该类支持的**公共**字段、方法和构造函数的数组；这包括公有的继承成员。`getDeclaredFields`、`getDeclaredMethods`\
  \ 和 `getDeclaredConstructors` 方法返回由所有声明的字段、方法和构造函数组成的数组。\n\n`Executable` 类的 `getParameters`\
  \ 方法返回在该类中声明的 `Parameter` 对象数组，但不包括父类。\n\n***\n\n![图像](img/00013.jpeg) 提示\n\n如果你编写了一个按名称加载类的方法，不要仅仅简单地使用该方法所属类的类加载器。为调用者提供一种选择权，即是显式传递类加载器还是使用上下文类加载器，这是一个很好的主意。\n\
  \n***\n\n`ServiceLoader` 类的 `iterator` 方法提供了一个用于遍历所有提供的服务实现的迭代器。（有关迭代器的更多信息，请参阅第\
  \ 7 章。）最简单的方法是使用增强 `for` 循环来遍历它们。在循环中，选择一个合适的对象来执行服务。\n\n***\n\n[content]\n(注：由于提供的原文文本存在部分逻辑重复和乱序，上述译文已根据上下文逻辑进行了整合翻译，确保连贯性)\
