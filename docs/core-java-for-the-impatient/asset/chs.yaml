  \n**15.** 继续上一个练习，但更改 `Point` 的数据表示，使其在数组中存储坐标。当新版本尝试读取由旧版本生成的文件时会发生什么？当你修复 `serialVersionUID`\
  \ 之后会发生什么？假设你的生命取决于能否让新版本与旧版本兼容。你可以做什么？\n\n**16.** Java 标准库中哪些类实现了 `Externalizable`？其中其中哪些类使用了\
  \ `writeReplace`/`readResolve`？\n\n# 第 10 章 并发编程\n\n**本章主题**\n\n![Image](img/00004.jpeg)\
  \ 10.1 并发任务\n\n![Image](img/00004.jpeg) 10.2 线程安全\n\n![Image](img/00004.jpeg) 10.3\
  \ 并行算法\n\n![Image](img/00004.jpeg) 10.4 线程安全数据结构\n\n![Image](img/00004.jpeg) 10.5\
  \ 原子值\n\n![Image](img/00004.jpeg) 10.6 锁\n\n![Image](img/00004.jpeg) 10.7 线程\n\n\
  ![Image](img/00004.jpeg) 10.8 异步计算\n\n![Image](img/00004.jpeg) 10.9 进程\n\n![Image](img/00004.jpeg)\
  \ 练习\n\nJava 是第一批内置并发编程支持的主流语言之一。早期的 Java 程序员对在后台线程中加载图像或实现能够并发处理多个请求的 Web 服务器感到非常兴奋。当时，重点是保持处理器忙碌，而某些任务则在等待网络。如今，大多数计算机都有多个处理器，程序员担心的是如何让它们都忙起来。\n\
  \n在本章中，你将学习如何将计算划分为并发任务以及如何安全地执行它们。我的重点是应用程序程序员的需求，而不是编写 Web 服务器或中间件的系统程序员。\n\n\
  出于因此，我安排了本章的信息，尽可能先向你展示你在工作中应该使用的工具。我在章节后部分介绍了低级结构。了解这些低级细节是有用的，可以让你感受到某些操作的成本。但最好将低级线程编程交给专家。如果你想成为他们之一，我强烈推荐\
  \ Brian Goetz 等人编写优秀书籍 *Java Concurrency in Practice* [Addison-Wesley, 2006]。\n\n\
  本章的要点是：\n\n1. `Runnable` 描述一个可以异步执行的任务。\n2. `Executor` 为 `Runnable` 实例调度执行计划。\n\
  3. `Callable` 描述一个会产生结果的任务。\n4. 你可以将一个或多个 `Callable` 实例提交给 `ExecutorService` 并在结果可用时合并它们。\n\
  5. 当多个线程在没有同步的情况下操作共享数据时，其结果是不可预测的。\n6. 优先使用并行算法和线程安全数据结构，而不是使用锁进行编程。\n7. 并行流（Parallel\
  \ streams）和数组操作会自动且安全地并行化计算。\n8. `ConcurrentHashMap` 是一个线程安全的哈希表，允许对条目进行原子更新。\n\
  9. 你可以使用 `AtomicLong` 作为无锁共享计数器，或者在竞争激烈时使用 `LongAdder`。\n10. 锁确保一次只有一个线程在执行临界区域。\n\
  11. 可中断的任务在中断 标志位被设置或发生 `InterruptedException` 时应该终止。\n12. 耗时任务不应该阻塞程序的用户界面，但进度和最终更新需要在用户界面线程中进行。\n\
  13. `Process` 类允许你在单独进程中执行命令，并与输入、输出和错误流进行交互。\n\n## 10.1 并发任务\n\n当你设计一个并发程序时，你需要考虑可以并行运行的任务。在接下来的章节中，你将看到如何并发执行任务。\n\
  \n### 10.1.1 运行任务\n\n在 Java 中，`Runnable` 接口描述你想要运行的任务，通常是与其他任务并发运行。\n\n```java\n\
  public interface Runnable {\n    void run();\n}\n```\n\n`run` 方法的代码将在线程中执行。线程是执行指令序列的机制，通常由操作系统提供。多个线程通过使用独立的处理器或不同的时间片并发运行。\n\
  \n(注：原文中存在大量重复段落，已根据核心内容进行处理。)\n\n\n\n考虑一个拆分为多个子任务的计算，每个子任务计算一个部分结果。当所有任务完成后，你想合并这些结果。你可以使用\
  \ `Callable` 接口来处理子任务。与 `Runnable` 接口的 `run` 方法不同，它的 `call` 方法会有一个返回值：\n\n点击此处查看代码图片\n\
  \n```java\npublic interface Callable<V> {\n    V call() throws Exception;\n}\n```\n\
  \n作为一个额外奖励，`call` 方法可以抛出任意异常。\n\n要执行 `Callable`，你需要一个 `ExecutorService` 接口的实例，它是\
  \ `Executor` 的子接口。`Executors` 类的 `newCachedThreadPool` 和 `newFixedThreadPool` 方法可以产生此类对象。\n\
  \n点击此处查看代码图片\n\n```java\nExecutorService exec = Executors.newFixedThreadPool();\n\
  Callable<V> task = ...;\nFuture<V> result = exec.submit(task);\n```\n\n当你提交任务时，你会得到一个\
  \ `future`——这是一个代表计算任务的对象，其结果将在未来的某个时间可用。`Future` 接口具有以下方法：\n\n点击此处查看代码图片\n\n```java\n\
  V get() throws InterruptedException, ExecutionException\nV get(long timeout, TimeUnit\
  \ unit) throws InterruptedException, ExecutionException, TimeoutException;\nboolean\
  \ cancel(boolean mayInterruptIfRunning)\nboolean isCancelled();\nboolean isDone();\n\
  ```\n\n`get` 方法会一直阻塞，直到结果可用或达到超时，然后返回计算出的值；或者如果 `call` 方法抛出了异常，则抛出一个封装了该被抛出异常的 `ExecutionException`。\n\
  \n`cancel` 方法尝试取消任务。如果任务尚未运行，则它将不会被调度。否则，如果 `mayInterruptIfRunning` 为 `true`，则运行任务的线程会被中断。\n\
  \n***\n\n![Image](img/00005.jpeg) 备注\n\n如果你想让一个任务是可中断的，你需要定期检查中断请求，如下所示：\n\n点击此处查看代码图片\n\
  \n```java\nCallable<V> task = () -> {\n    while (more work to do) {\n        if\
  \ (Thread.currentThread().isInterrupted()) return null;\n        Do more work\n\
  \    }\n    return result;\n};\n```\n\n对于任何你希望在其他子任务成功时取消的任务，这都是一个好主意。有关中断的更多细节，请参阅第\
  \ 338 页的第 10.7.2 节“线程中断”。\n\n***\n\n通常，一个任务需要等待多个子任务的结果。与其单独提交每个子任务，你可以使用 `invokeAll`\
  \ 方法并传递 `Callable` 实例的 `Collection`。\n\n例如，假设你想统计一个单词在一组文件中出现的次数。对于每个文件，创建一个返回该文件计数的\
  \ `Callable<Integer>`。然后将它们全部提交给执行器。当所有任务完成后，你会得到一个 future 列表（它们都已完成），你可以对答案求和。\n\
  \n点击此处查看代码图片\n\n```java\nString word = ...;\nSet<Path> paths = ...;\nList<Callable<Long>>\
  \ tasks = new ArrayList<>();\nfor (Path p : paths) tasks.add(\n    () -> { return\
  \ number of occurrences of word in p });\nList<Future<Long>> results = executor.invokeAll(tasks);\n\
  long total = 0;\nfor (Future<Long> result : results) total += result.get();\n```\n\
  \n还有一个带有超时时间的 `invokeAll` 变体，它在超时时会取消所有未完成的任务。\n\n***\n\n![Image](img/00005.jpeg)\
  \ 备注\n\n如果你觉得调用任务阻塞到所有子任务完成很困扰你，你可以使用 `ExecutorCompletionService`。它按照完成的顺序返回 future。\n\
  \n点击此处查看代码图片\n\n```java\nExecutorCompletionService service = new ExecutorCompletionService(executor);\n\
  for (Callable<T> task : tasks) service.submit(task);\nfor (int i = 0; i < tasks.size();\
  \ i++) {\n    Process service.take().get()\n    Do something else\n}\n```\n\n***\n\
  \n`invokeAny` 方法类似于 `invokeAll`，但只要提交的任务中有任何一个完成且没有抛出异常，它就会返回。然后它返回其 `Future` 的值。其他任务将被取消。这对于一旦找到匹配项即可结束的搜索非常有用。这段代码段定位包含给定单词的文件：\n\
  \n点击此处查看代码图片\n\n```java\nString word = ...;\nSet<Path> paths = ...;\nList<Callable<Long>>\
  \ tasks = new ArrayList<>();\nfor (Path p : paths) tasks.add(\n    () -> { return\
  \ number of occurrences of word in p });\nPath found = executor.invokeAny(tasks);\n\
  ```\n\n你可以看到，`ExecutorService` 做了很多工作。它不仅将任务映射到线程，还处理了结果、异常和取消。\n\n## 10.2 线程安全\n\
  \n许多程序员最初认为并发编程看起来非常简单。你只需要将工作拆分为任务即可。可能会出现什么问题？\n\n在接下来的章节中，我将向你展示可能出现的问题，并给出处理方法的概览。\n\
  \n### 10.2.1 可见性\n\n即使是简单的变量读写操作在现代处理器上也会变得极其复杂。考虑这个例子：\n\n点击此处查看代码图片\n\n```java\n\
  private static boolean done = false;\npublic static void main(String[] args) {\n\
  \    Runnable hellos = () -> {\n        for (int i = 1; i <= 1000; i++) {\n    \
  \        System.out.println(\"Hello \" + i);\n        }\n        done = true;\n\
  \    };\n    Runnable goodbye = () -> {\n        int i = 1;\n        while (!done)\
  \ i++;\n        System.out.println(\"Goodbye \" + i);\n    };\n    Executor executor\
  \ = Executors.newCachedThreadPool();\n    executor.execute(hellos);\n    executor.execute(goodbye);\n\
  }\n```\n\n你可能会期望输出类似于\n\nHello 1\n...\nHello 1000\nGoodbye 50\n\n当我的笔记本电脑上运行此程序时，它会打印到“Hello\
  \ 1000”并且永远不会终止。`done = true;` 的效果对于运行第二个任务的线程是不可见的。\n\n为什么不可见？可能有多个原因，与*缓存*和*指令重排序*有关。\n\
  \n我们将像 `done` 这样的内存位置视为 RAM 芯片中的某些位。但 RAM 芯片非常慢——比现代处理器慢得多。因此，处理器尝试将需要的数据保存在寄存器或板载缓存中，并将更改写回内存。这种缓存对于处理器性能是必不可少的。虽然有同步缓存的操作，但它们只在请求时才发出。\n\
  \n而且不仅如此。编译器、虚拟机和处理器被允许更改指令顺序以加速操作，只要这不改变程序的语义。\n\n例如，考虑一个计算：\n\n```java\nx = Something\
  \ not involving y;\ny = Something not involving x;\nz = x + y;\n```\n\n前两个步骤必须在第三步之前发生，但它们可以以任何顺序发生。处理器可以（通常也会）并行运行前两个步骤，或者如果第二个步骤的输入更容易可用，则交换顺序。\n\
  \n在我们案例中，循环\n\n`while (!done) i++;`\n\n可以被重排序为\n\n`if (!done) while (true) i++;`\n\
  \n因为循环体没有改变 `done` 的值。\n\n\n\n\n默认情况下，优化操作假设不存在并发内存访问。如果存在并发访问，虚拟机则需要知道这一点，以便它能够发出抑制不当重排序的处理器指令。\n\
  \n确保变量的更新可见的有多种方法。以下是总结：\n\n1. `final` 变量的值在初始化后是可见的。\n2. `static` 变量的初始值在静态初始化后是可见的。\n\
  3. `volatile` 变量的更改是可见的。\n4. 在释放锁之前的更改对任何获取相同锁的人都是可见的（参见第 10.6.1 节，“重入锁”，位于第 331\
  \ 页）。\n\n在我们的案例中，如果你用 `volatile` 修饰符声明共享变量 `done`，问题就消失了：\n\n点击此处查看代码图像\n\n```\n\
  private static volatile boolean done;\n```\n\n然后编译器会生成必要的指令，确保一个任务中对 `done` 的任何更改对其他任务可见。\n\
  \n`volatile` 修饰符恰好足以解决这个特定问题。但正如你在下一节中看到的，将共享变量声明为 `volatile` 并不是一个通用的解决方案。\n\n\
  ***\n\n![Image](img/00013.jpeg) 提示\n\n将任何初始化后不再更改的字段声明为 `final` 是一个极佳的主意。这样你永远不需要担心它的可见性了。\n\
  \n***\n\n### 10.2.2 竞态条件\n\n假设多个并发任务正在更新一个共享整数计数器。\n\n点击此处查看代码图像\n\n```java\nprivate\
  \ static volatile int count = 0;\n\n...\n\ncount++; // 任务 1\n\n...\n\ncount++; //\
  \ 任务 2\n\n...\n```\n\n该变量已经被声明为 `volatile`，因此更新是可见的。但那还够。\n\n更新操作 `count++` 不是**原子的**。它实际上意味着：\n\
  \n```\ncount = count + 1;\n```\n\n如果一个线程在将值 `count + 1` 写回 `count` 变量之前被抢占，它可能会被中断。考虑以下场景：\n\
  \n点击此处查看代码图像\n\n```java\nint count = 0; // 初始值\nregister[1] = count + 1; // 线程 1\
  \ 计算 count + 1\n... // 线程 1 被抢占\nregister[2] = count + 1; // 线程 2 计算 count + 1\n\
  count = register[2]; // 线程 2 将 1 存入 count\n... // 线程 1 再次运行\ncount = register[1];\
  \ // 线程 1 将 1 存入 count\n```\n\n现在 `count` 是 `1` 而不是 `2`。这种错误被称为`race condition`，因为取决于哪个线程在更新共享变量的“竞争”中获胜。\n\
  \n这个问题真的会发生吗？确实会发生。运行配套代码中的演示程序。它有 100 个线程，每个线程将计数器加 1000 次并打印结果。\n\n点击此处查看代码图像\n\
  \n```java\nfor (int i = 1; i <= 100; i++) {\n    int taskId = i;\n    Runnable task\
  \ = () -> {\n        for (int k = 1; k <= 1000; k++)\n            count++;\n   \
  \     System.out.println(taskId + \": \" + count);\n    };\n    executor.execute(task);\n\
  }\n```\n\n输出通常开始看起来很无害，类似于：\n\n```\n1: 1000\n3: 2000\n2: 3000\n6: 4000\n```\n\n\
  过了一会儿，它看起来有点可怕：\n\n```\n72: 58196\n68: 59196\n73: 61196\n71: 60196\n69: 62196\n\
  ```\n\n但这可能只是因为某些线程在不恰当的时机被暂停了。重要的是最后一个完成的任务发生了什么。它是否将计数器增加到了 100,000？\n\n我在我的双核笔记本电脑上运行了数十次程序，它每次都失败了。年前，当个人电脑只有一个\
  \ CPU 时，竞态条件更难观察，程序员们没有观察到如此剧烈的失败。但无论是在几秒钟还是几小时内计算出错误的值，这并不重要。\n\n这个例子查看了玩具程序中共享计数器的简单情况。练习\
  \ 16 在一个真实的示例中展示了相同的问题。但不仅仅是计数器的问题。只要共享变量发生变动，竞态条件就是一个问题。例如，在向队列中添加元素时，代码可能像这样：\n\
  \n```java\nNode n = new Node();\nif (head == null) head = n;\nelse tail.next = n;\n\
  \ntail = n;\n```\n\n这个问题有一个解决办法：使用`locks` 来使临界序列变为原子的。通过一次只允许一个任务访问数据结构，可以防止其被破坏。在第\
  \ 10.4 节，“线程安全数据结构”，位于第 324 页，你将看到 Java 提供的并发安全的数据结构。在第 10.6.1 节，“重入锁”，位于第 331 页，向你展示了锁是如何工作的。\n\
  \n锁可能是昂贵的，因为它减少了并行性。例如，如果你有许多任务向共享哈希表提交结果，并且每次更新都锁定表，那么这就是真正的瓶颈。如果大多数任务必须等待，它们就没有在做有用的工作。有时可以对数据进行分区，以便不同的部分可以并发访问。Java\
  \ 并发库中的某些数据结构使用了分区，流库中的并行算法也是如此。不要自己尝试！这很难实现。相反，请使用 Java 库中的数据结构和算法。\n\n### 10.2.3\
  \ 安全并发的策略\n\n在 C 和 C++ 等语言中，程序员需要手动分配和释放内存。这听起来很危险，事实也如此。在 Java 中，有垃圾回收机制，Java 程序员很少需要内存管理。遗憾的是，数据访问没有类似的机制。\n\
  \n一种非常有效的策略是`confinement`。直接拒绝在之间共享数据。例如，当你的任务需要计算某些内容时，给它们每一个一个私有的计数器，而不是更新共享计数器。当任务完成后，它们可以将结果交给另一个合并任务。\n\
  \n另一个良好的策略是`immutability`。共享不可变对象是安全的。例如，与其将结果添加到共享集合，任务可以生成一个不可变集合。另一个任务将结果合并成另一个不可变数据结构。这个主意很简单，但有一些需要注意的地方——参见第\
  \ 10.2.4 节，“不可变类”，位于第 322 页。\n\n\n\n\n当一个类的实例一旦构造完成就无法更改时，该类就是不可变的。这听起来似乎你对它们做不了什么，但事实并非如此。例如，在第\
  \ 12 章中，你将看到如何在 Java 日期和时间库中使用不可变对象。每个日期实例都是不可变的，但你可以获取新的日期，例如某个给定日期的后一天日期。\n\n\
  或者考虑一个用于收集结果的集合。你可以使用一个可变的 `HashSet` 并按如下方式更新它：\n\n```java\nresults.addAll(newResults);\n\
  ```\n\n但这显然是危险的。\n\n不可变集合总是创建新集合。你将像下面这样更新更新结果：\n\n点击此处查看代码图片\n\n```java\nresults\
  \ = results.union(newResults);\n```\n\n虽然仍然存在变异，但控制一个变量发生了什么，比控制一个具有许多方法的哈希集合要容易得多。\n\
  \n实现不可变类并不困难，但你应该注意这些问题：\n\n1. **确保将实例变量声明为 `final`。** 没有理由不这样做，而且你会获得一个重要的优势。虚拟机确保\
  \ `final` 实例变量在构造后是可见的（第 10.2.1 节，“可见性](#part0017.html_ch10lev2sec3)”见第 317 页）。\n\
  \n2. **当然，任何方法都不应该是变异器。** 你可能想将它们标记为 `final`，或者将类声明为 `final`，这样方法就不会被变异器重写。\n\n\
  3. **不要泄露可变状态。** 你的任何（非 `private`）方法都不能返回任何可用于变异的内部引用。此外，当你的某个方法调用另一个类的方法时，它不能传递任何此类引用，否则被调用的方法可能会使用它进行变异。如有，请返回或传递副本。\n\
  \n4. **不要让 `this` 引用在构造函数中逃逸。** 当你调用另一个方法时，你知道不要传递任何内部引用，但 `this` 呢？在构造后它是完全安全的，但如果你在构造函数中暴露了\
  \ `this`，别人可能会观察到处于中间状态的对象。\n\n***\n\n![Image](img/00005.jpeg) 注意\n\n前三项足够容易遵循。最后一项听起来非常有技术性，而且并不常见。例如，在构造函数中启动一个\
  \ `Runnable` 为内部类（包含一个 `this` 引用）的线程，或者在构造事件监听器时，将 `this` 添加到监听器队列中。只需在构造完成后执行这些操作即可。\n\
  \n***\n\n## 10.3 并行算法\n\n在开始并行化你的计算之前，你应该检查 Java 库是否已经为你完成了这些工作。流库或 `Arrays` 类可能已经实现了你需要的功能。\n\
  \n### 10.3.1 并行流\n\n流库自动对大型并行流上的操作进行并行化。例如，如果 `coll` 是一个大型字符串集合，你想找到其中有多少个以字母 A\
  \ 开头，可以调用\n\n点击此处查看代码图片\n\n```java\nlong result = coll.parallelStream().filter(s\
  \ -> s.startsWith(\"A\")).count();\n```\n\n`parallelStream` 方法产生一个并行流。流被拆分成若干段。过滤和计数在每个段上进行，然后对结果合并。你不需要担心细节。\n\
  \n另一个例子是，假设你需要统计给定单词在某个目录下所有后代中出现的次数。你可以通过流获取这些路径：\n\n点击此处查看代码图片\n\n```java\ntry\
  \ (Stream<Path> paths = Files.walk(pathToRoot)) {\n    ...\n}\n```\n\n只需将该流转换为并行流，然后计算计数的总和：\n\
  \n点击此处查看代码图片\n\n```java\nint total = paths.parallel()\n    .mapToInt(p -> { return\
  \ number of occurrences of word in p })\n    .sum();\n```\n\n***\n\n![Image](img/00009.jpeg)\
  \ 警告\n\n当你使用并行流配合 lambda 表达式时（例如在前面的示例中作为 `filter` 和 `map` 的参数），请务必避免对共享对象进行不安全的变异。\n\
  \n***\n\n### 10.3.2 并行数组操作\n\n`Arrays` 类有许多并行化操作。与前节中的并行流操作一样，这些操作将数组拆分成若干部分，并行处理这些部分并合并结果。\n\
  \n静态方法 `Arrays.parallelSetAll` 使用由函数计算的值来填充数组。该函数接收元素索引并计算该位置处的值。\n\n点击此处查看代码图片\n\
  \n```java\nArrays.parallelSetAll(values, i -> i % 10);\n// 填充 values\n```\n\n显然，此操作受益于并行化。它有针对原始类型和对象数组的版本。\n\
  \n`parallelSort` 方法可以排序原始类型数组或对象数组。例如，\n\n点击此处查看代码图片\n\n```java\nArrays.parallelSort(words,\
  \ Comparator.comparing(String::length));\n```\n\n对于所有方法，你都可以提供范围的边界，例如 点击此处查看代码图片\n\
  \n```java\nArrays.parallelSort(values, values.length / 2, values.length); // 排序后半部分\n\
  ```\n\n***\n\n![Image](img/00005.jpeg) 注意\n\n一看，这些方法的名称中带有 `parallel` 似乎有点奇怪——用户不应该关心排序是如何发生的。然而，API\
  \ 设计者希望明确这些操作是并行化的。这样，用户就会注意避免带有副作用的函数。\n\n***\n\n最后，`parallelPrefix` 是相当特殊的——练习\
  \ 4 提供了一个简单的例子。\n\n对于数组的其他并行操作，将它们转换为流。例如，为了计算 long 数组的总和，调用\n\n点击此处查看代码图片\n\n```java\n\
  long sum = IntStream.of(values).parallel().sum();\n```\n\n\n\n\n一个 `ConcurrentHashMap`\
  \ 首先是一个操作是线程安全的哈希 map。无论有多少线程同时对该 map 进行操作，其内部结构都不会被破坏。当然，某些线程可能会被临时阻塞，但该 map 可以高效地支持大量的并发读取者和一定数量的并发写入者。\n\
  \n但这还不够。假设我们想使用一个 map 来统计某些特征出现的频率。例如，假设多个线程遇到了某些单词，我们想要统计它们的频率。显然，下面更新计数的代码不是线程安全的：\n\
  \n点击此处查看代码图片\n\n```\nConcurrentHashMap<String, Long> map = new ConcurrentHashMap<>();\n\
  \n...\n\nLong oldValue = map.get(word);\n\nLong newValue = oldValue == null ? 1\
  \ : oldValue + 1;\n\nmap.put(word, newValue); // Error—可能没有替换 oldValue\n```\n\n\
  另一个线程可能在同时更新完全相同的计数器。\n\n要安全地更新值，请使用 `compute` 方法。调用该方法时传入键和一个用于计算新值的函数。该函数接收键和关联的值（如果不存在则为\
  \ `null`），并计算出新值。例如，这里是更新计数的方法：\n\n点击此处查看代码图片\n\n```\nmap.compute(word, (k, v) ->\
  \ v == null ? 1 : v + 1);\n```\n\n`compute` 方法是**原子的**——在计算进行期间，没有其他线程可以修改 map 的条目。\n\
  \n还有 `computeIfPresent` 和 `computeIfAbsent` 变体，它们只在已存在旧值或不存在旧值时才计算新值。\n\n另一个原子操作是\
  \ `putIfAbsent`。计数器可以初始化为：\n\n```\nmap.putIfAbsent(word, 0L);\n```\n\n你通常需要在键第一次被添加时，做一些特殊处理。`merge`\
  \ 方法使得这变得特别方便。它有一个用于初始值的参数，当键尚不存在时使用该值。否则，将调用你提供的函数，将现有值和初始值进行合并。（与 `compute` 不同，该函数不处理键。）\n\
  \n点击此处查看代码图片\n\n```\nmap.merge(word, 1L, (existingValue, newValue) -> existingValue\
  \ + newValue);\n```\n\n或者简单的：\n\n点击此处查看代码图片\n\n```\nmap.merge(word, 1L, Long::sum);\n\
  ```\n\n当然，传递给 `compute` 和 `merge` 的函数应该快速完成，并且它们不应该尝试修改 map。\n\n***\n\n![Image](img/00005.jpeg)\
  \ Note\n\n某些方法可以在当条目当前与现有条目相等时，原子性地移除或替换它。在 `compute` 方法可用之前，人们会编写这样的代码来递增计数：\n\n\
  点击此处查看代码图片\n\n```\ndo {\n    oldValue = map.get(word);\n    newValue = oldValue\
  \ + 1;\n} while (!map.replace(word, oldValue, newValue));\n```\n\n***\n\n***\n\n\
  ![Image](img/00005.jpeg) Note\n\n有几种用于搜索、转换或访问 `ConcurrentHashMap` 的**批量操作**。它们在数据的快照上运行，即使在其他线程对\
  \ map 进行操作时，也能安全地执行。在 API 文档中，寻找名称以 `search`、`reduce` 和 `forEach` 开头的操作。还有针对键、值和条目的变体。`reduce`\
  \ 方法针对 `int`、`long` 和 `double` 值的归函数提供了特殊实现。\n\n***\n\n#### 10.4.2 阻塞队列\n\n用于协调任务间工作的一种常用工具是`阻塞队列`。生产者任务将项插入队列，消费者任务检索它们。队列允许你安全地将数据从一个任务传递给另一个任务。\n\
  \n当你尝试添加元素而队列当前已满，或者当队列为空时尝试移除元素时，操作会阻塞。通过这种方式，队列平衡了工作负载。如果生产者任务运行得比消费者任务慢，消费者将在等待结果时阻塞。如果生产者运行得更快，队列就会填满，直到消费者追上。\n\
  \n表 10–1 显示了阻塞队列的方法。阻塞队列方法分为三类，区别在于它们在队列满或空时所执行的动作。除了阻塞方法外，还有在未成功时抛出异常的方法，以及在无法执行任务时返回失败指示而不是抛出异常的方法。\n\
  \n![Image](img/00059.jpeg)\n\n**表 10–1** 阻塞队列操作\n\n***\n\n![Image](img/00005.jpeg)\
  \ Note\n\n`poll` 和 `peek` 方法返回 `null` 来指示失败。因此，向这些队列中插入 `null` 值是非法的。\n\n***\n\n\
  还有带有超时时的 `offer` 和 `poll` 方法变体。例如，以下调用\n\n点击此处查看代码图片\n\n```\nboolean success = q.offer(x,\
  \ 100, TimeUnit.MILLISECONDS);\n```\n\n尝试 100 毫秒向尾部插入一个元素。如果成功，返回 `true`；否则，在超时时返回\
  \ `false`。同样，以下调用\n\n点击此处查看代码图片\n\n```\nObject head = q.poll(100, TimeUnit.MILLISECONDS);\n\
  ```\n\n尝试 100 毫秒移除头部。如果成功，返回头部；否则，在超时时返回 `null`。\n\n`java.util.concurrent` 包提供了阻塞队列的若干种变体。`LinkedBlockingQueue`\
  \ 基于链表，而 `ArrayBlockingQueue` 使用环形数组。\n\n练习 10 显示了如何使用阻塞队列分析文件。一个线程遍历文件树并将文件插入队列。多个线程移除并搜索这些文件。在这种应用程序中，生产者可能会填满队列直到消费者追上。\n\
  \n这种设计的一个常见挑战是让消费者停止。消费者不能在队列为空时直接退出。毕竟，生产者可能还没有启动，或者可能落后了。如果只有一个生产者，它可以在队列中添加一个“末尾”指示，类似于行李提取传送上贴有“最后一个行李”标签的箱子。\n\
  \n### 10.4.3 其他线程安全数据结构\n\n就像你可以在 `java.util` 包中在哈希 map 和树 map 之间选择一样，还有一种基于键比较的并发\
  \ map，称为 `ConcurrentSkipListMap`。如果你需要遍历键，或者需要 `NavigableMap` 接口中的新增方法（参见第 7 章），请使用它。同样的还有\
  \ `ConcurrentSkipListSet`。\n\n`CopyOnWriteArrayList` 和 `CopyOnWriteArraySet` 是线程安全的集合，其修改器会复制底层数组。这种安排适用于遍历集合的线程远多于修改集合的线程的情况。当你构造迭代器时，它包含了当前数组的引用。如果数组随后被修改，迭代器仍然持有旧数组，但集合的数组被替换了。因此，旧迭代器拥有一个一致（但可能过时的）视图，无需同步即可访问。\n\
  \n假设你需要一个大型线程安全的 set 而不是 map。没有 `ConcurrentHashSet` 类，你比尝试自己创建一个明智。当然，你可以使用 `ConcurrentHashMap`\
  \ 并配合虚假值，但这给你的是一个 map 而不是 set，你无法应用 `Set` 接口的操作。\n\n静态方法 `newKeySet` 产生一个实际上是 `ConcurrentHashMap<K,\
  \ Boolean>` 的 `Set<K>`。（所有的 map 值都是 `Boolean.TRUE`，但你实际上并不关心，因为你只是将其作为 set 使用。）\n\
  \n\n\n\n\n点击此处查看代码图片\n\n```java\nSet<String> words = ConcurrentHashMap.newKeySet();\n\
  ```\n\n如果你有一个现有的 map，`keySet` 方法会产生键集合。该集合是可变的。如果你删除了集合中的元素，这些键（以及它们对应的值）将从 map\
  \ 中移除。但向键集合中添加元素是没有意义的，因为将没有对应的值可以添加。你可以使用第二个 `keySet` 方法，在向集合中添加元素时使用一个默认值：\n\n\
  点击此处查看代码图片\n\n```java\nSet<String> words = map.keySet(1L);\nwords.add(\"Java\");\n\
  ```\n\n如果 `\"Java\"` 已经存在于 `words` 中，它现在将有一个值为 1。\n\n## 10.5 原子值 (Atomic Values)\n\
  \n如果多个线程更新共享计数器，你需要确保这种操作是以线程安全的方式完成的。`java.util.concurrent.atomic` 包中有多许多类，它们使用安全且高效的机器级指令来保证整数、`long`\
  \ 和 `boolean` 值、对象引用以及这些数组的操作的原子性。通常情况下，决定何时使用原子值而不是锁需要大量的专业知识。然而，原子计数器和累加器（accumulators）对于应用层编程非常方便。\n\
  \n例如，你可以安全地生成这样一个数字序列：\n\n点击此处查看代码图片\n\n```java\npublic static AtomicLong nextNumber\
  \ = new AtomicLong();\n// 在某个线程中...\nlong id = nextNumber.incrementAndGet();\n```\n\
  \n`incrementAndGet` 方法原子性地增加 `AtomicLong` 并返回自增后的值。也就是说，获取值、加 1、设置值以及产生新值的操作是不可中断的。可以保证即使多个线程并发访问同一个实例，也能计算并返回正确的值。\n\
  \n虽然有用于原子地设置、添加和减去值的方法，但假设你想进行更复杂的更新。一种方法是使用 `updateAndGet` 方法。例如，假设你想跟踪不同线程观察到的最大值。以下代码将不起作用：\n\
  \n点击此处查看代码图片\n\n```java\npublic static AtomicLong largest = new AtomicLong();\n\
  // 在某个线程中...\nlargest.set(Math.max(largest.get(), observed)); // 错误——竞态条件！\n```\n\
  \n这种更新不是原子的。相反，调用 `updateAndGet` 并使用 lambda 表达式来更新变量。在示例中，我们可以调用\n\n点击此处查看代码图片\n\
  \n```java\nlargest.updateAndGet(x -> Math.max(x, observed));\n```\n\n或者\n\n点击此处查看代码图片\n\
  \n```java\nlargest.accumulateAndGet(observed, Math::max);\n```\n\n`accumulateAndGet`\
  \ 方法接收一个二运算符，用于结合原子值和提供的参数。\n\n还有 `getAndUpdate` 和 `getAndAccumulate` 方法，它们会返回旧值。\n\
  \n***\n\n![图像](img/00005.jpeg) 注意\n\n这些方法也为 `AtomicInteger`、`AtomicIntegerArray`、`AtomicIntegerFieldUpdater`、`AtomicLongArray`、`AtomicLongFieldUpdater`、`AtomicReference`、`AtomicReferenceArray`\
  \ 和 `AtomicReferenceFieldUpdater` 类提供。\n\n***\n\n当大量线程访问同一个原子值时，性能会下降，因为更新是以乐观方式进行的。也就是说，操作从给定的旧值计算出一个新值，如果旧值仍是当前值则进行替换，否则重试。在激烈竞争下，更新需要太多的重试。\n\
  \n`LongAdder` 和 `LongAccumulator` 类解决了某些常见更新的问题。`LongAdder` 由多个变量组成，它们的总和就是当前值。多个线程可以更新不同的加数，并且当线程数量增加时，会自动提供新的加数。在所有工作完成之前不需要总和值的常见情况下，这种方式是高效的。性能的提升可能是显著的——参见练习\
  \ 8。\n\n如果你预见到会有高竞争，你应该直接使用 `LongAdder` own 不是 `AtomicLong`。方法名称略有不同。调用 `increment`\
  \ 增加计数器，或调用 `add` 添加数量，并调用 `sum` 获取总和。\n\n点击此处查看代码图片\n\n```java\nfinal LongAdder\
  \ count = new LongAdder();\nfor (...)\n    executor.execute(() -> {\n        while\
  \ (...) {\n            ...\n            if (...) count.increment();\n        }\n\
  \    });\n```\n\n\n\n在本节中，我将使用 `ReentrantLock` 类来解释锁的工作原理。正如你将在下一节看到的，在很多情况下，并没有特殊的理由使用显式锁，因为\
  \ `synchronized` 关键字使用了“隐式”锁。但只有在见过了显式锁之后，理解底层发生了什么时才会变得更容易。\n\n***\n\n第一个执行 `lock`\
  \ 方法的线程会锁定 `countLock` 对象，然后进入临界区。如果另一个线程尝试在同一个对象上调用 `lock`，它会被阻塞，直到第一个线程执行对 `unlock`\
  \ 调用。通过这种方式，可以保证同一时间只有一个线程可以执行临界区。\n\n请注意，通过将 `unlock` 方法放置在 `finally` 语句中，如果临界区发生任何异常，锁都会被释放。否则，锁将处于永久锁定，其他线程将无法通过它继续。这显然是非常糟糕的。当然，在这种情况下，临界区不会抛出异常，因为它只执行了一个整数加法。但尽管如此，使用\
  \ `try`/`finally` 语句仍然是一种常见的惯用法，以防以后添加更多代码。\n\n乍一看，使用锁来保护临界区似乎简单足够。然而，魔鬼在细节中。经验表明，许多程序员在编写正确的锁代码时会遇到困难。他们可能使用了错误的锁，或者创建了`deadlock`的情况，因为所有线程都在等待一个锁，导致没有线程可以取得进展。\n\
  \n出于这个原因，应用程序程序员应该将锁作为最后的手段。首先尝试避免共享，即使用不可变数据或将可变数据从一个线程传递给另一个线程。如果你必须共享，请使用预构建的线程安全结构，例如\
  \ `ConcurrentHashMap` 或 `LongAdder`。了解锁是有用的，这样你就可以理解此类数据结构是如何实现的，但最好的做法是将细节交给专家。\n\
  \n## 10.6.2 `synchronized` 关键字\n\n在前面的节中，我向你展示了如何使用 `ReentrantLock` 实现临界区。你并不需要使用显式锁，因为在\
  \ Java 中，*每个对象*都有一个*内建锁*（intrinsic lock）。然而，为了理解内建锁，先看到显式锁是有帮助的。\n\n`synchronized`\
  \ 关键字用于锁定内建锁。它可以有两种形式。你可以锁定一个块：\n\n```\nsynchronized (obj) {\n    临界区\n}\n```\n\n\
  这本质上意味着\n\n点击此处查看代码图片\n\n```java\nobj.intrinsicLock.lock();\ntry {\n    临界区\n} finally\
  \ {\n    obj.intrinsicLock.unlock();\n}\n```\n\n对象实际上并没有一个类型为内建锁的字段。这段代码只是为了说明当你使用\
  \ `synchronized` 关键字时发生了什么。\n\n你也可以将一个方法声明为 `synchronized`。那么它的方法体就会在接收者参数 `this`\
  \ 上锁定。也就是说，\n\n点击此处查看代码图片\n\n```java\npublic synchronized void method() {\n    方法体\n\
  }\n```\n\n等同于\n\n点击此处查看代码图片\n\n```java\npublic void method() {\n    this.intrinsicLock.lock();\n\
  \    try {\n        方法体\n    } finally {\n        this.intrinsicLock.unlock();\n\
  \    }\n}\n```\n\n例如，一个计数器可以简单地声明为\n\n点击此处查看代码图片\n\n```java\npublic class Counter\
  \ {\n    private int value;\n    public synchronized int increment() {\n       \
  \ value++;\n        return value;\n    }\n}\n```\n\n通过使用 `Counter` 实例的内建锁，不需要引入显式的锁。\n\
  \n正如你看到的，使用 `synchronized` 关键字产生的代码非常简洁。当然，为了理解这段代码，你必须知道每个对象都有一个内建锁。\n\n***\n\n\
  ![图像](img/00005.jpeg) 注意\n\n锁不仅仅是锁定。它们还保证了可见性。例如，考虑在第 10.2.1 节 中让我们带来很多麻烦的 `done`\
  \ 变量，“可见性”，位于第 317 页页。如果你在读写该变量时都使用锁，那么你可以确保 `get` 的调用者能看到通过 `set` 调用对变量的任何更新。\n\
  \n点击此处查看代码图片\n\n```java\npublic class Flag {\n    private boolean done;\n    public\
  \ synchronized void set() { done = true; }\n    public synchronized boolean get()\
  \ { return done; }\n}\n```\n\n同步方法的灵感源于 Tony Hoare 在 20 世纪 70 年代开创监控器（monitor）概念。监控器本质上是一个实例变量为私有的类。\n\
  \n在 Java 中，可以拥有实例变量和同步方法。许多程序员发现这很令人困惑。例如，Java 1.0 拥有带有同步方法的 `Hashtable`。若要安全地遍历表，你可以像这样获取锁：\n\
  \n点击此处查看代码图片\n\n```java\nsynchronized (table) {\n    for (K key : table.keySet())\
  \ {\n        ...\n    }\n}\n```\n\n#### 10.6.3 等待条件考虑一个具有添加和移除方法的简单 `Queue`。同步方法确保了这些操作是原子的。\n\
  \n点击此处查看代码图片\n\n```java\npublic class Queue {\n    class Node { Object value; Node\
  \ next; }\n    private Node head;\n    private Node tail;\n\n    public synchronized\
  \ void add(Object newValue) {\n        Node n = new Node();\n        if (head ==\
  \ null) head = n;\n        else tail.next = n;\n        tail = n;\n    }\n\n   \
  \ public synchronized Object remove() {\n        Node n = head;\n        head =\
  \ head.next;\n        return n.value;\n    }\n}\n```\n\n现在假设我们把 `remove` 方法转换为在队列为空时阻塞的\
  \ `take` 方法。空检查必须在同步方法内部，否则查询将毫无意义——因为在此期间另一个线程可能清空了队列。\n\n点击此处查看代码图片\n\n```java\n\
  public synchronized Object take() throws InterruptedException {\n    while (head\
  \ == null) wait();\n    ...\n}\n```\n\n当前线程现在变为激活并释放锁。这让另一个线程进入，我们希望它可以向队列中添加元素。这被称为*等待条件*。\n\
  \n请注意，`wait` 方法是 `Object` 类的方法。它与对象的锁相关。阻塞获取锁的线程与调用 `wait` 的线程之间存在本质区别。一旦线程调用了 `wait`\
  \ 方法，它就会进入对象的等待集（wait set）。当锁可用时，线程并变为可运行。相反，直到另一个线程在同一个对象上调用 `notifyAll` 方法，它将一直处于激活状态。\n\
  \n当另一个线程添加了元素后，它应该调用该方法：\n\n点击此处查看代码图片\n\n\n\n\n```java\npublic synchronized void\
  \ add(Object newValue) {\n    ...\n    notifyAll();\n}\n```\n\n对 `notifyAll` 的调用会激活等待集中的所有线程。当线程从等待集中被移除时，它们会变为可运行状态，调度程序最终会再次激活它们。此时，它们将尝试重新获取锁。当其中一个线程成功时，它将从停止的地方继续，从\
  \ `wait` 调用返回。\n\n此时，线程应该再次测试该条件。无法保证该条件现在已经满足——`notifyAll` 方法只是向等待线程信号，条件此时*可能*已经满足，并且值得再次检查该条件。出于这个原因，测试是在循环中进行的。\n\
  \n```java\nwhile (head == null) wait();\n```\n\n***\n\n![Image](img/00009.jpeg)\
  \ 注意\n\n另一种方法 `notify` 仅会阻塞等待集中的单个线程。这比阻塞所有线程要高效得多，但存在危险。如果被选中的线程发现它仍然无法继续，它将再次变为阻塞状态。如果没有其他线程再次调用\
  \ `notify`，程序就会死锁。\n\n***\n\n线程只有在持有该对象的锁时，才能在该对象上调用 `wait`、`notifyAll` 或 `notify`。\n\
  \n***\n\n![Image](img/00005.jpeg) 注意\n\n`wait` 和 `notifyAll` 方法适用于构建带有阻塞方法的的数据结构。但它们并不容易正确使用。如果你只是想某些线程等待直到某个条件满足，不要使用\
  \ `wait` 和 `notifyAll`，而是使用并发库中的同步器类（例如 `CountdownLatch` 和 `CyclicBarrier`）。\n\n\
  ***\n\n### 10.7 线程\n\n当我们接近本章的末尾时，是时候谈论线程了，它是实际执行任务的原语。通常情况下，使用替你管理线程的执行器更好，但后续章节将为你提供关于直接与线程操作的一些背景信息。\n\
  \n#### 10.7.1 启动线程\n\n以下是在 Java 中运行线程的方法。\n\n点击此处查看代码图像\n\n```java\nRunnable task\
  \ = () -> { ... };\nThread thread = new Thread(task);\nthread.start();\n```\n\n\
  静态方法 `sleep` 使当前线程睡眠一段指定的时间，以便其他线程有机会执行工作。\n\n```java\nRunnable task = () -> {\n\
  \    ...\n    Thread.sleep(millis);\n    ...\n}\n```\n\n如果你想等待一个线程完成，调用 `join` 方法：\n\
  \n```java\nthread.join(millis);\n```\n\n这两个方法会抛出在下一节中讨论的受检异常 `InterruptedException`。\n\
  \n线程在 fact `run` 方法返回时结束，无论是正常返回还是因为抛出了异常。在后一种情况下，线程的*未捕获异常处理器*会被调用。当线程被创建时，该处理器被设置为线程组的未捕获异常处理器，而该处理器最终是全局处理器（参见第\
  \ 5 章）。你可以通过调用 `setUncaughtExceptionHandler` 方法来更改线程的处理器。\n\n***\n\n![Image](img/00005.jpeg)\
  \ 注意\n\nJava 的初始版本定义了一个 `stop` 方法，它可以立即终止线程，以及一个 `suspend` 方法可以阻塞线程直到另一个线程调用 `resume`。这两种方法从那时起就被弃用了。\n\
  \n`stop` 方法本质上是不安全的。假设一个线程在关键区域中间被停止——例如，向队列中插入一个元素。那么队列将处于部分更新状态。然而，保护关键区域的锁被释放了，其他线程可以使用被损坏的数据结构。当你想要让一个线程停止时，应该中断它。被中断的线程可以在安全时再停止。\n\
  \n`suspend` 方法的风险没有那么大，但仍然存在问题。如果一个线程在持有锁时被挂起，任何尝试获取该锁的线程都会阻塞。如果恢复的线程在其中，程序就会死锁。\n\
  \n***\n\n#### 10.7.2 线程中断\n\n假设对于给定的查询，你对第一个结果总是满意。当答案的搜索分布在多个任务上时，你希望在获得答案后立即取消所有任务。在\
  \ Java 中，任务取消是*协作性*的。\n\n每个线程都有一个*中断状态*，表示有人想要“中断”该线程。对于中断的含义没有精确的定义，但大多数程序员使用它来表示取消请求。\n\
  \n`Runnable` 可以检查此状态，这通常在循环中完成：\n\n点击此处查看代码图像\n\n```java\nRunnable task = () ->\
  \ {\n    while (more work to do) {\n        if (Thread.currentThread().isInterrupted())\
  \ return;\n        Do more work\n    }\n};\n```\n\n当线程被中断时，`run` 方法简单地结束。\n\n***\n\
  \n![Image](img/00005.jpeg) 注意\n\n还有一个静态的 `Thread.interrupted` 方法，它可以获取中断状态，然后清除它，并返回旧状态。\n\
  \n***\n\n有时，线程会变得不活跃。这发生在线程等待值或输入/输出，或者它睡眠以给其他线程机会的情况下。\n\n如果线程在等待时被中断，状态不会被设置。相反，会抛出\
  \ `InterruptedException`。这是一个受检异常，你捕获它。通常的反应是结束 `run` 方法：\n\n```java\nRunnable task\
  \ = () -> {\n    try {\n        while (more work to do) {\n            Thread.sleep(millis);\n\
  \        }\n    } catch (InterruptedException ex) {\n        // 什么都不做\n    }\n};\n\
  ```\n\n当你以这种方式捕获 `InterruptedException` 时，就不需要检查中断状态了。如果线程在调用外部被中断，`InterruptedException`\
  \ 可能看起来很讨厌，但当你调用诸如 `sleep` 方法时，你不仅仅捕获它，至少设置中断状态：\n\n```java\ntry {\n    Thread.sleep(millis);\n\
  } catch (InterruptedException ex) {\n    Thread.currentThread().interrupt();\n}\n\
  ```\n\n或者更好，只需将异常传递给胜任的处理器：\n\n点击此处查看代码图像\n\n```java\npublic void mySubTask() throws\
  \ InterruptedException {\n    ...\n    Thread.sleep(millis);\n    ...\n}\n```\n\n\
  ***\n\n#### 10.7.3 线程本地变量\n\n有时，你可以通过为每个线程使用 `ThreadLocal` 辅助类来避免共享。例如，`NumberFormat`\
  \ 类的实例不是线程安全的。假设我们有一个静态变量\n\n点击此处查看代码图像\n\n```java\npublic static final NumberFormat\
  \ currencyFormat = NumberFormat.getCurrencyInstance();\n```\n\n如果两个线程执行操作如\n\n点击此处查看代码图像\n\
  \n```java\nString amountDue = currencyFormat.format(total);\n```\n\n那么结果可能是错误的，因为\
  \ `NumberFormat` 实例使用的内部数据结构可能会被并发访问所损坏。你可以使用同步，但这是昂贵的。或者，你可以在需要时构造一个本地 `NumberFormat`\
  \ 对象，但也是浪费的。\n\n要为每个线程构造一个实例，请使用以下代码：\n\n点击此处查看代码图像\n\n```java\npublic static final\
  \ ThreadLocal<NumberFormat> currencyFormat =\n    ThreadLocal.withInitial(() ->\
  \ NumberFormat.getCurrencyInstance());\n```\n\n\n\n\n要访问实际的格式化器，请调用\n\n点击此处查看代码图像\n\
  \n```\nString amountDue = currencyFormat.get().format(total);\n```\n\n在给定的线程中第一次调用\
  \ `get` 时，会构造函数中的 lambda 来为该线程创建实例。从那时起，`get` 方法返回属于当前线程的实例。\n\n### 10.7.4 杂线程属性\n\
  \n`Thread` 类暴露了线程的许多属性，但大多数属性对于准备认证考试的学生来说比对应用程序程序员更有用。本节简要回顾了这些属性。\n\n线程可以分组收集，并有\
  \ API 方法来管理线程组，例如中断组中的所有线程。如今，执行器（executors）是管理任务组的首选机制。\n\n你可以为线程设置 `priorities`（优先级），高优先级线程会被调度在低优先级线程之前运行。希望虚拟机和宿主机平台会尊重优先级，但细节在很大程度上取决于平台。因此，使用优先级是脆弱的，通常不建议这样做。\n\
  \n线程有 `states`（状态），你可以判断线程是新的、运行的、阻塞在输入/输出上的、等待的还是终止的。当你作为应用程序程序员使用线程时，很少有理由查询它们的状态。\n\
  \n当线程由于未捕获的异常终止时，该异常将传递给线程的 `uncaught exception handler`（未定义异常处理器）。默认情况下，其堆栈跟踪会被打印到\
  \ `System.err`，但你可以安装自己的处理器（参见第 5 章）。\n\n`daemon`（守护线程）是一种除了服务他人没有其他生命的线程。这对于发送定时器或清理过期缓存条目的线程有用。当只剩下守护线程时，虚拟机将退出。\n\
  \n要创建守护线程，在启动线程之前调用 `thread.setDaemon(true)`。\n\n### 10.8 异步计算\n\n到目前为止，我们处理并发的方法是拆分任务，然后等待所有部分完成。但等待并不总是一个好主意。在接下来的章节中，你将看到如何实现无等待或\
  \ `asynchronous`（异步）计算。\n\n#### 10.8.1 用户界面回调中的长时间任务\n\n使用线程的原因之一是让你的程序更具响应。这在带有用户界面的应用程序中尤为重要。当你的程序需要执行耗时操作时，你不能在用户界面线程中执行工作，否则用户界面将冻结。相反，请启动另一个工作线程。\n\
  \n例如，如果你想在用户点击按钮时读取网页，不要这样做：\n\n点击此处查看代码图像\n\n```\nButton read = new Button(\"Read\"\
  );\n\nread.setOnAction(event -> { // 错误—操作在 UI 线程上执行\n\n    Scanner in = new Scanner(url.openStream());\n\
  \    while (in.hasNextLine()) {\n        String line = in.nextLine();\n        ...\n\
  \    }\n});\n```\n\n相反，在单独线程中执行工作。\n\n点击此处查看代码图像\n\n```\nread.setOnAction(event\
  \ -> { // 好—在单独线程中执行长时间操作\n\n    Runnable task = () -> {\n        Scanner in = new\
  \ Scanner(url.openStream());\n        while (in.hasNextLine()) {\n            String\
  \ line = in.nextLine();\n            ...\n        }\n    }\n    new Thread(task).start();\n\
  });\n```\n\n然而，你必须对在该类工作线程中所做的事情小心。如 JavaFX、Swing 或 Android 等用户界面不是线程安全的。如果你从多个线程操作用户界面元素，这些元素可能会损坏。事实上，JavaFX\
  \ 和 Android 会检查这一点，如果你尝试从 UI 线程以外的线程访问用户界面，它们会抛出异常。\n\n因此，你需要调度任何 UI 更新在 UI 线程上发生。每个用户界面库都提供某种机制来调度\
  \ `Runnable` 在 UI 线程执行。例如，在 JavaFX 中，你可以使用\n\n点击此处查看代码图像\n\n```\nPlatform.runLater(()\
  \ ->\n    message.appendText(line + \"\\n\"));\n```\n\n***\n\n![图像](img/00005.jpeg)\
  \ 注意\n\n在向用户提供进度反馈的同时实现长时间操作是非常繁琐的，因此用户界面库通常会提供某种助手类来管理细节，例如 Swing 中的 `SwingWorker`\
  \ 和 Android 中的 `AsyncTask`。你指定长时间任务（即长时间运行的任务）的操作，以及完成和最终结果。JavaFX 中的 `Task` 类采用了略有不同的方法。它提供了更新进度（在\
  \ UI 线程上执行）和最终值（在 UI 线程上执行）的方法。\n\n***\n\n#### 10.8.2 Completable Futures\n\n处理非阻塞的传统方法是使用事件处理器，但\
  \ `CompletableFuture` 提供了一种替代方案。例如，假设我们想从网页中提取所有链接。假设我们有一个可用的方法。尽管程序员的思考方式是“第一步\
  \ 1，然后是第 2 步，然后 3”，但逻辑变得分散了。当必须添加错误处理时，情况会更糟。Completable futures 可以被 `composed`（组合）。\n\
  \n点击此处查看代码图像\n\n```\npublic CompletableFuture<String> readPage(URL url)\n```\n\n\
  该返回网页的文本。\n\n点击此处查看代码图像\n\n```java\npublic static List<URL> getLinks(String page)\n\
  ```\n\n该返回 HTML 页面中的 URL，你可以在页面可用时对其进行调度：\n\n点击此处查看代码图像\n\n```\nCompletableFuture<String>\
  \ contents = readPage(url);\nCompletableFuture<List<URL>> links = contents.thenApply(Parser::getLinks);\n\
  ```\n\n`thenApply` 方法也不会阻塞。它返回另一个 future。当第一个 future 完成时，它的结果将输送给 `getLinks` 方法，而该方法的返回值将成为最终结果。\n\
  \n通过 completable futures，你只需要指定你想执行的操作以及按什么顺序执行。当然，这些并不会立即发生，但重要的是所有代码都在一个地方。\n\n\
  从概念上说，`CompletableFuture` 是一个简单的 API，但有许多组合 completable futures 的方法变体。让我们先看处理单个\
  \ future 的方法（参见表 10–2）。（对于显示的每个方法，我没有显示两个 `Async` 变体。其中一个使用共享的 `ForkJoinPool`，另一个带有一个\
  \ `Executor` 参数。）在表中，我对冗长的函数接口使用了简写表示法，用 `T -> U` 代替 `Function<? super T, U>`。当然，这些不是实际的\
  \ Java 类型。\n\n![图像](img/00060.jpeg)\n\n**表 10–2** 为 `CompletableFuture<T>` 对象添加操作\n\
  \n你已经见过 `thenApply` 方法。以下调用\n\n点击此处查看代码图像\n\n```\nCompletableFuture<U> future.thenApply(f);\n\
  CompletableFuture<U> future.thenApplyAsync(f);\n```\n\n\n\n返回一个 future，当 `future`\
  \ 的结果可用时，将 `f` 应用于该结果。第二次调用将在另一个线程中运行 `f`。\n\n`thenCompose` 方法不是接收一个函数 `T -> U`，而是接收一个函数\
  \ `T -> CompletableFuture<U>`。这听起来相当抽象，但实际用起来可能非常自然。考虑从给定的 URL 读取网页的操作。与其提供一个方法：\n\
  \n点击此处查看代码图片\n\n```java\npublic String blockingReadPage(URL url)\n```\n\n不如让该方法返回一个\
  \ future，更加优雅：\n\n点击此处查看代码图片\n\n```java\npublic CompletableFuture<String> readPage(URL\
  \ url)\n```\n\n现在，假设我们有另一个方法从用户输入获取 URL，可能来自一个对话框，在用户点击 OK 按钮之前，对话框不会显示答案。这同样是未来的一个事件：\n\
  \n点击此处查看代码图片\n\n```java\npublic CompletableFuture<URL> getURLInput(String prompt)\n\
  ```\n\n这里我们有两个函数 `T -> CompletableFuture<U>` 和 `U -> CompletableFuture<V>`。显然，如果第二个函数在第一个函数完成后被调用，它们就组合成一个函数\
  \ `T -> CompletableFuture<V>`。这正是 `thenCompose` 所做的的。\n\n表 10–2 中的第三种方法关注的是我在此之前忽略的一个方面：失败。当在\
  \ `CompletableFuture` 中抛出异常时，如果调用 `get` 方法，异常会被捕获并封装在未检查的 `ExecutionException` 中。但也许\
  \ `get` 永远被调用。为了处理异常，请使用 `handle` 方法。提供的函数将带有结果（如果没有则为 `null`）和异常（如果没有则为 `null`）被调用，并由它对情况进行处理。\n\
  \n其余方法的结果类型为 `void`，通常用于处理流水线的末尾。\n\n现在，让我们转向组合多个 future 的方法（参见 表 10–3）。\n\n![Image](img/00061.jpeg)\n\
  \n**表 10–3** 组合多个组合对象\n\n前三种方法并行运行一个 `CompletableFuture<T>` 和一个 `CompletableFuture<U>`\
  \ 操作并组合结果。\n\n接下来的三种方法并行运行两个 `CompletableFuture<T>` 操作。只要其中一个完成，它的结果就会被传递，而另一个结果则被忽略。\n\
  \n最后，静态方法 `allOf` 和 `anyOf` 接受任意数量的可完成 future，并产生一个 `CompletableFuture<Void>`，该\
  \ future 在所有 future 完成（或其中任何一个 future 完成）时完成。没有结果被传播。\n\n***\n\n![Image](img/00005.jpeg)\
  \ 注意\n\n从技术上说，本节中的方法接受的类型为 `CompletionStage` 的参数，而不是 `CompletableFuture`。这是一个包含近四十个抽象方法的接口，仅由\
  \ `CompletableFuture` 实现。提供该接口是为了让第三方框架可以实现它。\n\n***\n\n![Image](img/00005.jpeg)\
  \ 注意\n\n`ProcessBuilder` 类是 `Runtime.exec` 调用更灵活的替代品。\n\n***\n\n#### 10.9.1 构建进程\n\
  \n通过指定你想要执行的命令开始构建过程。你可以提供一个 `List<String>` 或直接提供组成命令的字符串。\n\n点击此处查看代码图片\n\n```java\n\
  ProcessBuilder builder = new ProcessBuilder(\"gcc\", \"myapp.c\");\n```\n\n***\n\
  \n![Image](img/00009.jpeg) 注意\n\n第一个字符串必须是一个可执行的命令，而不是 shell 内置命令。例如，要在 Windows\
  \ 中运行 `dir` 命令，你需要使用字符串 `\"cmd.exe\"`、`\"/C\"` 和 `\"dir\"` 来构建一个进程。\n\n***\n\n每个进程都有一个*工作目录*，它用于解析相对目录名。默认情况下，进程与虚拟机具有相同的工作目录，这通常是运行启动\
  \ `java` 程序时的目录。你可以通过 `directory` 方法更改它：\n\n点击此处查看代码图片\n\n```java\nbuilder = builder.directory(path.toFile());\n\
  ```\n\n***\n\n![Image](img/00005.jpeg) 注意\n\n配置 `ProcessBuilder` 的每个方法都返回自身，因此你可以链式调用命令。最终，你将调用\n\
  \n点击此处查看代码图片\n\n```java\nProcess p = new ProcessBuilder(command).directory(path.toFile()).start();\n\
  ```\n\n接下来，你可能想要指定标准输入、输出和错误流。默认情况下，它们中的每一个都是你可以访问的管道。例如，\n\n点击此处查看代码图片\n\n```java\n\
  OutputStream processIn = p.getOutputStream();\nInputStream processOut = p.getInputStream();\n\
  InputStream processErr = p.getErrorStream();\n``` 注意输入流是一个输出流。相反，你可以指定进程的输入、输出和错误流与\
  \ JVM 相同。如果你想继承某些流，将值传递给这三个：\n\n点击此处查看代码图片\n\n```java\nbuilder.redirectIO(ProcessBuilder.Redirect.INHERIT);\n\
  ```\n\n通过向三个方法传递 `File` 对象来重定向进程流：\n\n点击此处查看代码图片\n\n```java\nbuilder.redirectInput(inputFile)\n\
  \      .redirectOutput(outputFile)\n      .redirectError(errorFile);\n```\n\n输出和错误文件在进程启动时会被创建或截断。要追加到现有文件，请使用\n\
  \n点击此处查看代码图片\n\n```java\nbuilder.redirectOutput(ProcessBuilder.Redirect.appendTo(outputFile));\n\
  ```\n\n合并输出和错误流通常有用，这样你就可以按照进程生成的顺序看到输出和错误消息。调用\n\n点击此处查看代码图片\n\n```java\nbuilder.redirectErrorStream(true)\n\
  ```\n\n来激活合并。如果你这样做了，就不能再在 `ProcessBuilder` 上调用 `redirectError` 或在 `Process` 上调用\
  \ `getErrorStream`。\n\n最后，你可能想要修改进程的环境变量。在这里，构建器的链式语法分解如下。你需要获取构建器的环境（它由运行 JVM 的进程的环境变量初始化），然后放入或删除项。\n\
  \n点击此处查看代码图片\n\n```java\nMap<String, String> env = builder.environment();\nenv.put(\"\
  LANG\", \"fr_FR\");\nenv.remove(\"JAVA_HOME\");\n```\n\n#### 10.9.2 运行进程\n\n配置好构建器后，调用它的\
  \ `start` 方法启动进程。如果你将输入、输出和错误流配置为管道，你现在可以写入输入流并读取输出和错误流了。例如，\n\n点击此处查看代码图片\n\n```java\n\
  Process p = new ProcessBuilder(\"/bin/ls\", \"-l\")\n      .directory(Paths.get(\"\
  /tmp\").toFile())\n      .start();\n```\n\n\n\n\n```java\ntry (Scanner in = new\
  \ Scanner(p.getInputStream())) {\n    while (in.hasNextLine())\n        System.out.println(in.nextLine());\n\
  }\n```\n\n***\n\n![Image](img/00009.jpeg) 注意\n\n进程流的缓冲区空间是的。你不应该让输入泛洪溢出，并且你应该及时读取输出。如果有大量的输入和输出，你可能需要在单独的线程中对其进行产生和消费。\n\
  \n***\n\n要等待进程完成，请调用\n\n```java\nint result = p.waitFor();\n```\n\n或者，如果你不想无限期等待，\n\
  \n点击此处查看代码图像\n\n```java\nlong delay = ...;\n\nif (p.waitfor(delay, TimeUnit.SECONDS))\
  \ {\n    int result = p.exitValue();\n    ...\n} else {\n    p.destroyForcibly();\n\
  }\n```\n\n第一次调用 `waitFor` 返回进程的退出值（根据约定，成功时返回 `0`，非零返回错误代码）。第二次调用如果进程没有超时则返回 `true`。然后你只需要通过调用\
  \ `exitValue` 方法来获取退出值。\n\n与其等待进程完成，你只需让它运行并偶尔调用 `isAlive` 来查看它是否仍然存。要杀死进程，请调用 `destroy`\
  \ 或 `destroyForcibly`。这些调用之间的区别取决于平台。在 Unix 上，前者使用 `SIGTERM` 杀死进程，后者使用 `SIGKILL`。\n\
