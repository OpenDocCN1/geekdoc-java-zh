  \ `generator` 的类型。第二个 `Random` 是用于构造该类对象的 `new` 表达式的一部分。\n### 1.3.2 名称\n变量（以及方法或类）的名称必须以字母开头。它可以由任何字母、数字以及符号\
  \ `_` 和 `$` 组成。然而，`$` 符号用于自动生成的名称，你不应该使用它。\n这里，字母和数字可以来自*任何*字母表，而不仅仅是拉丁字母表。例如，`π`\
  \ 和 `élévation` 是有效的变量名。大小写敏感：`count` 和 `Count` 是不同的名称。\n你不能在名称中使用空格或符号。最后，你不能使用如\
  \ `double` 的关键字作为名称。\n按照习惯，变量和方法的名称以小写字母开头，类的名称以大写字母开头。Java 程序员喜欢“驼峰命名法”，即当名称由多个单词组成时使用大写字母，例如\
  \ `countOfInvalid`。\n### 1.3.3 初始化\n在 Java 中，声明变量后，必须在使用它之前对其进行初始化。例如，以下代码会导致错误：\n\
  ```\ncount++;\n\n\nint count;\n    count = 1;\n    count = total;\n```\n允许推迟初始化\
