  \n    ...\n```\n我们将在第 2 章中详细地介绍包和 `import` 语句。\n***\n### 1.2 数据类型\n最简单的 Java 类型被称为*原始数据类型*。其中四个是整数类型，两个是浮点数类型，一个是用于字符串编码的字符类型\
  \ `char`，还有一个是用于真尔值的 `boolean` 类型。我们将在接下来的章节中查看这些类型。\n#### 1.2.1 整数类型\n整数类型用于没有小数部分的数字。允许负值。Java\
  \ 提供了表 1–1 所示的四整数类型。\n![Image](img/00008.jpeg)\n**表 1–1** Java 整数类型\n***\n![Image](img/00005.jpeg)\
  \ 注意\n常量 `Integer.MIN_VALUE` 和 `Integer.MAX_VALUE` 是最小和最大的整数值。`Long`、`Short` 和 `Byte`\
  \ 类也有 `MIN_VALUE` 和 `MAX_VALUE` 常量。\n***\n在大多数情况下，`int` 类型是最实用的。如果你想表示地球的人口，你将需要求助于\
  \ `long`。\n***\n\n存在特殊的浮点数值：`Double.POSITIVE_INFINITY` 表示 ∞，`Double.NEGATIVE_INFINITY`\
  \ 表示 –∞，以及 `Double.NaN` 表示“不是数字”。例如，计算 `1.0 / 0.0` 的结果是正无穷大。计算 `0.0 / 0.0` 或负数的平方根会得到\
  \ NaN。\n* * *\n![Image](img/00009.jpeg) 注意事项\n所有的“不是数字”（NaN）值都被认为是彼此不相等的。因此，你不能使用测试语句\
  \ `if (x == Double.NaN)` 来检查 `x` 是否为 NaN。相反，请调用 `if (Double.isNaN(x))`。还有方法 `Double.isInfinite`\
  \ 方法用于测试 ±∞，以及 `Double.isFinite` 方法用于检查一个浮点数既不是无穷大也不是 NaN。\n* * *\n浮点数不适用于不能忍舍入误差的财务计算。例如，命令\
  \ `System.out.println(2.0 - 1.1)` 输出的是 `0.8999999999999999`，而不是你预期的 `0.9`。这种舍入误差是由浮点数在二进制数系统中表示引起的。分数\
  \ 1/10 没有精确的二进制表示，就像在十进制系统中没有分数 1/3 的准确表示一样。如果你需要没有舍入误差的精确数值计算，请使用 `BigDecimal`\
  \ 类，该类引入第 1.4.6 节“大数字”，位于第 19 页。\n## 1.2.3 char 类型\n`char` 类型描述了 Java 使用的 UTF-16\
  \ 字符编码中的“代码单元”。细节相当技术性——参见第 1.5 节“字符串”，位于第 20 页。你可能不会经常使用 `char` 类型。\n偶尔，你可能会遇到用单引号括起来的字符面量。例如，`'J'`\
  \ 是一个值为 74（或十六进制 4A）的字符面量，它是表示 Unicode 字符“U+004A 拉丁大字母 J”的代码单元。代码单元可以用十六进制表示，并带有\
  \ `\\u` 前缀。例如，`'\\u004A'` 与 `'J'` 相同。一个更奇特的例子是 `'\\u263A'`，它是![Image](img/00011.jpeg)“U+263A\
  \ 微笑脸”的代码单元。\n特殊代码 `'\\n'`、`'\\r'`、`'\\t'`、`'\\b'` 分别表示换行符、回车、制表符和退格符。\n使用反斜杠来转义单引号\
  \ `'\\''` 和反斜杠 `'\\\\'`。\n## 1.2.4 boolean 类型\n`boolean` 类型有两个值：`false` 和 `true`。\n\
  在 Java 中，`boolean` 类型不是数字类型。`boolean` 值与整数 `0` 和 `1` 之间没有关系。\n## 1.3 变量\n在接下来的章节，你将学习如何声明和初始化变量以及常量。\n\
