  md: "# Chapter 14. Writing Documents\n\n```\nstring_of_stream : Pdf.pdfobject ->\
    \ string -> string\n\nlet rec string_of_stream dict data =\n  let b = Buffer.create\
    \ 100 in\n  List.iter(Buffer.add string b)\n  [string.of_pdfobject dict; \"\\\
    nstream\\n\"; data; \"\\nendstream\"];\n  Buffer.contents b\n```\n\nThe code for\
    \ these functions is collected together in Figure 14.1. Now that we can build\
    \ a string from any Pdf.pdfobject, we can proceed to build the write_header, write_trailer,\
    \ and write_objects functions, so that we have everything need for the final PDF-to-file\
    \ function.\nThe PDF header consists of %%%m.-n where m and n are the major and\
    \ minor version numbers. It is easy to build with Printf.sprintf.\n\n```\nwrite_header\
    \ : out_channel -> Pdf.t -> unit\n\nlet write_header o {Pdf.version = (major,\
    \ minor)} =\n  output_string o\n  (Printf.sprintf \"%%%d-%%%i\\n\" major minor)\n\
    ```\n\nThe write_objects function, which is given a list of (int * Pdf.pdfobject)\
    \ pairs, sorts the objects by their number, and then outputs each object using\
    \ string_of_.pdfobject. For the example\n(3,\nDictionary\n[((\"/Type\", \"Pages\"\
    ); (\"/Kids\", Array [Indirect 1]); (\"/Count\", Integer 1))])\nwill be written\
    \ to file like this:\n\n```\n3 0 obj\n<< /Type /Pages /Kids [1 0] /Count 1 >>\n\
    endobj\n```\n\nThe function collects and returns a list of the offsets of the\
    \ objects written, since this will be needed to write the trailer section, which\
    \ we will describe in a moment.\n\n```\nwrite_objects : out_channel -> (int *\
    \ Pdf.pdfobject) -> int list\n\nlet write_objects o objs =\n  let offsets = ref\
    \ [] in\n  List.iter(\n    (fun objnum, obj) ->\n      offsets := pos_out o ::\
    \ !offsets;\n      output_string o (Printf.sprintf \"%%i 0 obj\\n\" objnum);\n\
    \      output_string o (string_of_.pdfobject obj);\n      output_string o (\"\\\
    nendobj\\n\")\n    ) (List.sort objs);\n  List.rev !offsets\n```"
