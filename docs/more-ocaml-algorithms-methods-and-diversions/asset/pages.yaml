- pgno: 84
  md: "# Chapter 10\n\n# # Finding Permutations\n\nHow can we calculate the $n!$ permutations\
    \ of a given list of length n? For example, given the list [1; 2; 3] we should\
    \ like to find [[1; 2; 3]; [2; 1; 3]; [2; 3; 1]; [1; 3; 2]; [3; 1; 2]; [3; 2;\
    \ 1]] or similar (we are not concerned with the order of the list of permutations).\
    \ So, we require a function of type $\\alpha$ list $\to$ $\\alpha$ list.\n\nSometimes\
    \ it is useful with a hard problem to simply start writing, working out gaps there\
    \ are, and then filling them in. The base case for our perms function is trivial:\
    \ there is one permutation of the empty list, namely the empty list itself:\n\n\
    ```\nperms : alpha list -> alpha list\n\nlet perms p =\n  match p with\n  [] ->\
    \ []\n```\n\nFor the main case, let us try the most simple decomposition. We calculate\
    \ the permutations of the tail with recursion, and then combine the result in\
    \ some way with the head:\n\n```\nperms : alpha list -> alpha list\n\nlet rec\
    \ perms p =\n  match p with\n  [] -> []\n  | h:t -> combine (perms t)\n```\n\n\
    Here, combine is a function we have to yet. It must take a list of permutations,\
