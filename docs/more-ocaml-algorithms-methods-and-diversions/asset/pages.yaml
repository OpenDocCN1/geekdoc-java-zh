- pgno: 149
  md: "# Answers to Questions\n\nFigure A.1\n\nHaving written the function, which\
    \ gives a number, doubles from that point, we then just code the list itself by\
    \ starting at 1.\n\n# 2\n\nIf we are asked to fetch the 0th element, out of inputs\
    \ we already have it – as the head of the lazy list. If not, we force evaluation\
    \ of the tail, and recurse.\n\n```\nnth : alpha lazylist -> int -> alpha\nlet\
    \ rec lnth nth (Cons (h, tf)) n =\nmatch n with\n  0 -> h\n  | -> lnth (tf ())\
    \ (n - 1)\n```\n\nOf course, this does not terminate on bad inputs (n < 0). Error\
    \ detection should be added.\n\n# 3\n\nBelow, the function repeating, inner takes\
    \ the current c and the original list l. Matching on c, we build the lazy list.\
    \ If we reach the last element of the input list, we start again, with the original\
    \ list, which is always retained."
