- pgno: 147
  md: "# last : α list → α option\n\n```\nlet last l =\nmatch l with\n  [] -> None\n\
    \  | _ -> Some (List.fold_left (fun e -> e) (List.hd l) l)\n```\n\nNot quite idiomatic.\n\
    \n# 4\n\nIf we start from the left, consing each element to the accumulator (which\
    \ is initially the empty list), the list will be reversed.\n\n```\nrev : α list\
    \ → α list\nlet rev l =\nList.fold_left (fun a e :: a) [] l\n```\n\nSince the\
    \ accumulator is the empty list (which has type α list), the whole remains polymorphic,\
    \ having the type we would expect.\n\n# 5\n\nThe accumulator begins set to false.\
    \ For each element, we calculate the logical OR of the element tested for equality\
    \ and the accumulator. If at least one true occurs, the result will be true.\n\
    \n```\nmember : α list → bool\nlet member x l =\nList.fold_left (fun a e -> e\
    \ = x || a) false l\n```\n\nNote that this is less efficient than List.mem because\
    \ there is no early exit – the whole list is processed in every case.\n\n# 6\n\
    \nThis is a classic problem. We either need to\n\n+   * add a space after each\
    \ word except for the last;\n* add a space before each word except for the first.\n\
    \nWith fold_left we can detect when we are at the first word, by inspecting the\
    \ accumulator, and use the second method."
  merge: -1
