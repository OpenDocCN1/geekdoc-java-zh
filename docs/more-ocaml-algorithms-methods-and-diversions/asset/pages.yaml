- pgno: 64
  md: "# Chapter 7\n\n# Labelled and Optional Arguments\n\nOCaml allows us to label\
    \ some or all of the arguments to a function, so as to provide a little documentation,\
    \ to prevent us from accidentally swapping two arguments which have the same type,\
    \ and to allow partial application of arguments most flexibly. Consider a function\
    \ to fill in part of an array with an element:\n\n```\nfill : α array -> int ->\
    \ int -> α -> unit\nfilled : unit -> string array =\n\\let fill a s l v =\n  for\
    \ x = s to s + l - 1 do a.(x) <- v done\n\nlet filled () =\n  let a = Array.make\
    \ 100 \"x\" in\n  fill a 20 40 \"y\";\na\n```\n\nThe function takes four arguments:\
    \ the array itself, the start position, length of the fill and the element to\
    \ use fill. However, since the start and length are both integers, it is easy\
    \ to get them the wrong way. This can be remedied by giving these two arguments\
    \ labels. A label is introduced by a title, followed by the label name, a colon\
    \ and the argument name itself. Consider the functions fill and filled below.\
    \ As we can see, we have defined fill with labels, which appear in the type. In\
    \ the first filled function, we call the filled function, citing the labels and\
    \ giving immediate integers. In the second, we show that it works with other names\
    \ (as it does indeed, for any expression). In the third, show that the labelled\
    \ arguments may be permuted and rearranged with regard to the other arguments\
    \ (unlabelled arguments must remain in the correct order relative to one another)."
  merge: -1
  img_proc: true
