    process : (input -> unit) -> string -> string\n\nlet output_of_buffer b =\n  {char:\
    \ Buffer.add_char b;\n  out_channel_length = fun () -> Buffer.length b}\n\nlet\
    \ process s =\n  let b = Buffer.create(String.length s) in\n  f (input.string\
    \ s) (output_of_buffer);\n  Buffer.contents b\n```\n\nNow, given some suitable\
    \ function decompress, say, we can call process giving the function and get a\
    \ new back string.\nDecomposition in this scheme, as is often the case, is simpler\
    \ than compression, so we will address it first. The whole thing is wrapped in\
    \ a loop which terminates only upon an exception. If the input data is well-formed,\
    \ that exception will be EOD, which we have defined for this purpose. Inside the\
    \ loop, we read a byte from the input. It is in the range 0...127, in which case\
    \ it is a “different” run, and we copy some bytes from input. Or, it is in the\
    \ range 129...255, in which case it is a “same” run, and we output a number of\
    \ copies of the next byte. Otherwise, the byte must have value 128, and we raise\
    \ the EOD exception. The decompress.string function is as simple as we claimed\
    \ it would be, because we wrote\n\n```\ndecompress : input -> output -> unit\n\
    decompress_string : string -> string\n\nexception EOD\n\nlet decompress i o =\n\
    \  while true do\n    match int_of_char (i.input_char ()) with\n      | x >= 0\
    \ && x <= 127 ->\n        for p = 1 to x + 1 do o.output_char (i.input_char ()))\
    \ done\n      | x >= 128 && x <= 255 ->\n        let c = i.input_char () in\n\
    \          for p = 1 to 257 - x do o.output_char c done\n      | -> raise EOD\n\
    \    done\n  with\n  EOD -> ()\n\nlet decompress_string = process decompress\n\
