    %%EOF


    It consists, we remember, of a header, then some objects (here, four), and a trailer.
    We will need four functions:


    +   1. The function string.of_pdfobject to make a string from a Pdf.pdfobject,
    for example making the string <</Type /Pages /Kids [1 0 R] >> from the pdf Dictionary
    [(/Type", Name "Pages"; /Kids, Array [Indirect 1])];/Count", Integer: 1)];

    2. The function write_header to write the header (i.e. everything before the objects);

    3. The function write_trailer to write the trailer (i.e. everything after the
    objects);

    4. The main function pdf_to_file which uses these three functions to write a Pdf
    to a file under the given name.


    The function string.of_pdfobject is expressed as a set of mutually-recursive functions
    introduced with the let rec . . construct. To do it as a single function is possible,
    but would be rather large, and harder to read and edit. Let us present it piece-by-piece
    and then all at once.

    First, the main part. Given an object we wish to produce its string, assuming
    that string.of_array, string.of_dictionary, and string.of_stream exist:


    ```

    string_of_pdfobject : Pdf.pdfobject -> string


    let rec string.of_pdfobject obj =

    match obj with

    |Pdf.Boolean b -> string.of.bool b

    |Pdf.Integer i -> string.of.int i

    |Pdf.Float f -> string.of.float f

    |Pdf.String s -> "(" ^ s ^ ")"

    |Pdf.Name n -> n

    |Pdf.Array a -> string.of.array a

    |Pdf.Dictionary d -> string.of.dictionary d

    |Pdf.Stream (dict, data) -> string.of.stream dict data

    |Pdf.Indirect i -> Printf.sprintf "%i 0 R" i

    ```


    The cases are all simple, except for the ones we have put to be implemented separately.
    Strings must be put between parentheses, indirect references are printed as 2
    0 R etc.

    To build a string from an Array, we need to start with an open square bracket,
    add the string for each Pdf.pdfobject in the array (which may be arbitrarily complex,
    of course), and put spaces between them.

    Then we end with a close square bracket:'
