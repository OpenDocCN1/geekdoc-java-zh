  md: '# Chapter 6


    # # Compressing Data


    Often we need to reduce the amount of space taken by some data, for storage or
    transmission. If data was arbitrary, it could not be compressed – to compress
    data we need to recognise and exploit patterns. However, most data is not arbitrary,
    but structured and containing repeating patterns. No compression scheme can guarantee
    to reduce the size of all inputs, but we would like to achieve good compression
    on typical data.


    We will look at a simple byte-by-byte compression scheme, implementing it using
    our input and output data types so it can be applied to different kinds of inputs
    and outputs. Then, we will consider a complex but efficient scheme for compressing
    data on a bit-by-bit basis.


    # # A byte-by-byte compression scheme


    The following extract from ISO-32000 (the PDF standard) defines a byte-by-byte
    compression scheme:


    > The encoded data shall be a sequence of *runs*, each run shall consist of a
    *length* followed by 1 to 128 bytes of data. If the *length* is in the range 0
    to 127, the following *length + 1* (1 to 128 bytes) shall be copied literally
    during decompression. If the *length* is in the range 129 to 255, the single byte
    shall be copied 257 (2 to 128) times during decompression. A length of 128 bytes
    denotes EOD [end of data].


    For example, the text "(5.000000, 4.583333), (4.500000, 5.000000)" which can be
    represented in ASCII as the list of integers [40; 49; 53; 46; 48; 48; 48; 48;
    44; 32; 46; 53; 56; 51; 51; 51; 41; 44; 32; 50; 53; 48; 48; 44; 53; 46; 48; 48;
    48; 41 of 43]. This will be compressed as shown in Figure 6.1. This is to say
    as [255; 40; 1; 53; 251; 48; 44; 32; 50; 56; 53; 61; 44; 32; 48; 52; 56; 53; 252;
    48; 44; 53; 46; 255; 48; 255; 41; 128], of length 35. The maximum compression
    ratio achieved with this method (for long constant data) is 64:1. The worst case
    (alternating bytes) is 127:128 – a slight expansion.


    Let us begin with two utility functions to allow to convert between strings and
    integers – this will make it easier to understand our examples when we evaluate
    them in OCaml''s top level:


    **'
