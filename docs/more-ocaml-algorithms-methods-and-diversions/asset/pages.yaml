- pgno: 150
  md: "# Answers to Questions\n\n```\nrepeating_inner : α list -> α list -> α lazylist\n\
    repeating_inner : α tree -> α lazylist\n\n rec repeating_inner c l =\n  match\
    \ c with\n  [] -> raise (Invalid.argument empty list\")\n  [x] -> Cons (x, fun\
    \ () -> repeating_inner l l)\n  h:t -> Cons (h, fun () -> repeating_inner t l)\n\
    \nlet repeating l = repeating_inner l l\n```\n\nNote that we cannot build from\
    \ an empty list, since there could be no head.\n\n# 4\n\nThe first two fibonacci\
    \ numbers are defined to be 0 and 1. Thereafter, we keep the current and previous\
    \ number, and generate the lazy list.\n\n```\nfibonacci_inner : int -> int ->\
    \ lazylist\nfibonacci : int lazylist\n\nlet rec fibonacci_inner x y =\n  Cons\
    \ (x, fun () -> fibonacci_inner y (x + x))\n\nlet fibonacci = fibonacci_inner\
    \ 0 1\n```\n\n# 5\n\nThis is slightly delicate. We must force the tail, to reveal\
    \ new elements for the heads of the output lists, and the final tail for the time\
    \ each list is forced.\n\n```\nunleave : α lazylist → lazylist × α lazylist\n\
    let rec unleave (Cons (h, tf)) =\n  Cons (h', tf') = tf () in\n  let t = tf' ()\
    \ in\n  (Cons (h, fun () -> fst (unleave t))\n  Cons (h', fun () -> snd (unleave\
    \ t)))\n```\n\nNote that we cannot hoist the calculation of unleave t into a let\
    \ so as to do it once, since to do so would not delay evaluation."
