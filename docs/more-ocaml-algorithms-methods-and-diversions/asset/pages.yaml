    Now we need to add approximate-text operators to Pdfpage mode, and produce a list
    of operators for showing a line, using it repeatedly to show the page area. A
    text section in a PDF stream looks like this:


    This contains the following operators and operands:


    | Operands | Operator | Description |

    |---|---|---|

    | 1 0 1 40 50 Tm | begin text section move text position to (40, 50) |

    | /F0 12 Tf | set font size to 12pt /F0 |

    | (The Text) Tj | show the text string “The Text” |

    | ET | end text section |


    Here are the fragments added to the Pdfpage.type text...


    ```

    | BeginText

    | EndText

    | SetTextPosition of float = float

    | SetFontSizeAndSize of string = float

    | ShowText of string

    ```


    and the string..of.op function:


    ```

    | BeginText -> "BT"

    | EndText -> "ET"

    | SetTextPosition (x, y) -> Printf.printf "1 0 0 1 %f %f Tm" x y

    | SetFontSizeAndSize (font, size) -> Printf.printf "%s %f Tf" font size

    | ShowText t -> Printf.printf "%s TJ" t

    ```


