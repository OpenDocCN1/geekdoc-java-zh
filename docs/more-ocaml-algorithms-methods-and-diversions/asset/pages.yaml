  md: "# Chapter 5. Streams of Bits\n\n```\nputbit : output_bits → int → unit\n\n\
    let putbit o b =\n  if o.obit = (-1) then\n    begin\n      flush o;\n      putbit\
    \ o b\n    end\n  else\n    begin\n      if b <> 1 then o.obyte <- o.byte lor\
    \ (1 lsl o.obit);\n      o.obit <- o.obit - 1\n    end\n```\n\nTo output a value\
    \ of width up to 31, we can write a function putval o v l which, given an output_bits,\
    \ value, and length in bits, calls putbit on each bit in turn:\n\n```\nputval\
    \ : output_bits → int → int → unit\n\nlet putval o v l =\n  for x = l - 1 downnto\
    \ 0 do\n    putbit o (v land (1 lsl x))\ndone\n```\n\nNow we can see why we allowed\
    \ any non-zero integer to be considered a 1 bit – it avoids a test in putval.\
