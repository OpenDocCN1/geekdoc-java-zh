    \ the names bound by the pattern do not include the Unix prefix.\n\n# 3\n\nThe\
    \ construct type t = {x : int ref} is a record type containing a reference to\
    \ an integer. We can build it using an existing reference, and extract the reference\
    \ for use elsewhere. We can share a reference between two or more instances of\
    \ this data type. The construct type t = {mutable x : int} is a record with a\
    \ single, mutable field. We must use <- rather than := to mutate it, and it may\
    \ not be shared.\n\n# 4\n\nWe can use multiple type parameters (which are written\
