  md: "# Chapter 10. Finding Permutations\n\n```\nall_permutations : α array → α array\
    \ array\n\nlet all_permutations arr =\n  let copy = Array.copy arr in\n  Array.sort\
    \ compare copy;\n  let perm = ref copy in\n  let perms = ref [copy] in\n  while\
    \ not (non_increasing !perm) do\n    perm := next_permutation !perm;\n    perms\
    \ := !perm :: !perms;\n  done;\n  Array.of_list (List.rev !perms)\n```\n\nNote\
    \ that this imperative algorithm works correctly with repetitions of elements\
    \ – it will include the permutation only once. We can now generate a repeating\
    \ lazy list of all the permutations of a given list, using our standard lazy list\
    \ type from Chapter 2:\n\n```\nperms : α array → α array lazylist\n\nlet rec perms\
    \ x =\n  Cons (x, fun () ->\n    if non_increasing x then\n      let c = Array.copy\
    \ x in\n      Array.sort compare c;\n      perms c\n    else\n      perms (next_permutation\
    \ x))\n```\n\nThis very imperative algorithm has now been dressed in functional\
