  md: "# Chapter 5. Streams of Bits\n\n```\ninput_bits_of_input : input -> input_bits\n\
    nlet input_bits_of_input i =\n  input = i;\n  byte = 0;\n  bit = 0}\n```\n\nThe\
    \ function to get the next bit is simple. If bit is zero, we must load a new byte\
    \ from the input and return the next bit. If bit is non-zero, we extract the given\
    \ bit, and halve bit for next time.\n\n```\ngetbit : input_bits -> bool\n\nlet\
    \ rec getbit b =\n  if b.bit = 0 then\n    begin\n      b.byte <- int_of_char\
    \ (b.input_char());\n      b.bit <- 128;\n      getbit\n    end\n  else\n    let\
    \ r = b.byte land b.bit > 0 in\n    b.bit <- b.bit / 2;\n  r\n```\n\nThis function\
    \ can raise End.of_file, if the underlying call to input_char raises it. Two other\
    \ functions are useful. We can align the bit stream on the next byte boundary\
    \ trivially:\n\n```\nalign : input_bits -> unit\n\nlet align b =\n  b.bit <- 0\n\
    ```\n\nWe can write a function get to return a given number of bits considered\
    \ as an integer, allowing us to read a data file of any width. We use the lor\
    \ operator, which gives the bitwise logical OR of two integers, and the lsl logical\
    \ shift left operator, which shifts the bits in an integer left by the specified\
    \ number of bits, filling zeros on the right."
