  md: '# Coping with Errors


    It is hard to write even small programs correctly the first time. An unfortunate
    inevitable part of programming is the location and fixing of mistakes. OCaml prints
    a range of messages to help you with this process.


    Here are descriptions of the common messages OCaml prints when a program cannot
    be accepted or when running it causes a problem (a so-called “run-time error”).
    We describe warnings OCaml prints to alert the programmer to program which, though
    it can be accepted for evaluation, might contain mistakes.


    # ERRORS


    These are messages printed when an expression could not be accepted for evaluation,
    due to being malformed in some way. No evaluation is attempted. You must fix the
    expression and try again.


    # Syntax error


    This error occurs when OCaml finds the program text contains things which are
    not valid words (such as if, let etc.) or other basic parts of the language, or
    when they exist in invalid combinations – this is known as syntax. Check carefully
    and try again.


    ```

    OCaml

    #1 +;

    Error: syntax error

    ```


    OCaml has underlined where it thinks the error is. Since this error occurs for
    a wide range of different mistakes and problems, the underlining may not pinpoint
    the exact position of your mistake.


    # Unbound value ...


    This error occurs when you have mentioned a name which has not been defined (technically
    “bound to a value”). This might happen if you have mistyped the name.


    ```

    OCaml

    ```'
