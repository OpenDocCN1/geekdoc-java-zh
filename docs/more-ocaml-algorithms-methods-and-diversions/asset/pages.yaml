  md: '# Chapter 1. Unravelling “Fold”


    ```

    tree_size : α tree -> int

    tree_sum : int tree -> int


    let tree_size t = fold.tree (fun l r -> 1 + l + r) 0 t

    let tree_sum t = fold.tree (fun x l r -> x + l + r) 0 t

    ```


    The standard tree traversals can be written easily with a list accumulator. A
    little typographical manipulation shows the pleasing symmetry:


    ```

    tree_preorder : α tree -> α list

    tree_ inorder : α tree -> α list

    tree_postorder : α tree -> α list


    let tree_preorder t = fold.tree (fun x l r -> [x] l @ r) [] t

    let tree_ inorder t = fold.tree (fun x l r -> l @ [r]) [] t

    let tree_postorder t = fold.tree (fun x l r -> l @ r @ [x]) t

    ```


    On our example list:


    ```

    tree_preorder (Br (1, Br (0, Lf, Lf), Br (6, Br (4, Lf, Lf), Lf))

    ⇒ [1; 0; 6; 4]

    ```


    ```

    tree_ inorder (Br (1, Br (0, Lf, Lf), Br (6, Br (4, Lf, Lf), Lf)))

    ⇒ [0; 1; 4; 6]

    ```


    ```

    tree_postorder (Br (1, Br (0, Lf, Lf), Br (6, Br (4, Lf, Lf), Lf)))

    ⇒ [0; 4; 6; 1]

    ```'
