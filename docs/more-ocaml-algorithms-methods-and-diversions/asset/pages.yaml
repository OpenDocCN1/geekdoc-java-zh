    # Chapter 1 (Unravelling “Fold”)


    1


    This can be achieved by folding the subtraction operator over the deductions,
    with the starting accumulator set to the budget:


    ```

    deduct : int → int list → int

    let deduct budget expenses =

    List.fold_left ( - ) budget expenses

    let deduct = List.fold_left ( - )

    ```


    Partial application can be used, as in the second definition.


    2


    We can use an accumulator starting at zero, and increment it once for each element
    processed:


    ```

    length : α list → int

    let length l =

    List.fold_left (fun a _ -> a + 1) 0 l

    ```


    Since we ignore the element itself, the function is polymorphic.


    3


    If the list is empty, we return None, otherwise we use a left fold which simply
    replaces the accumulator with each successive element from the list. We must initialize
    the accumulator, so we pick the first element for that (we have already eliminated
    the case where there are no elements, so List.hd will succeed).'
