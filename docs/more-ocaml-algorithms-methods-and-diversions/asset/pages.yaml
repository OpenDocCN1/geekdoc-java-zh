  md: '# Coping with Errors


    ```

    # x + 1;;

    ```


    Error: Unbound value x


    In our example x is not defined, so it has been underlined.


    # This expression has type ... but an expression was expected of type...


    You will see this error very frequently. It occurs when the expression''s syntax
    is correct (i.e. it is made of valid words and constructs), and OCaml has moved
    to type-checking expression prior to evaluation. If there is a problem with type-checking,
    OCaml shows you where a mismatch between the expected and actual type occurred.


    ```

    OCaml

    # 1 + true;

    Error: This expression has type bool but an expression was expected of type int

    ```


    In this example, OCaml is looking for an integer on the right hand side of the
    + operator, and finds something of type bool instead.

    It is not as easy to spot the real source of the problem, especially if the function
    is recursive. Nevertheless, a careful look at the program will shine light on
    the problem – look at each function and its arguments, and to find your mistake.


    # This function is applied to too many arguments


    Exactly what it says. The function name is underlined.


    ```

    OCaml

    # let f x = x + 1;

    val f : int -> int = <fun>

    # f x y1;

    Error: This function is applied to too many arguments;

    maybe you forgot a `;''

    ```


    The phrase “maybe you forgot a ‘;’ applies to imperative programs where accidentally
    missing out a ‘;’ between successive function applications might commonly lead
    to this error.


    # Unbound constructor...


    This occurs when a constructor is used which is not defined.


    ```

    OCaml

    # type t = Roof | Wall | Floor;

    ```'
