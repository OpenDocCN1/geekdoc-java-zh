- pgno: 34
  md: "# # Chapter 4\n\n# # Generalized Input/Output\n\nIn *Pervasives*, OCaml's default\
    \ always-opened module, a number of functions are defined over input and output\
    \ *channels* – representing both files in the file system and special ones such\
    \ as standard output. However, it is often useful to have a more general abstraction\
    \ of input and output over, for example, strings and arrays, or channels.\n\n\
    In this chapter, we shall develop such an abstraction, giving input and output\
    \ types which work with OCaml channels and strings. It can be extended to work\
    \ over other data structures, and to have complete functionality – some of the\
    \ questions at the end of the chapter involve extensions.\n\n# # A type for inputs\n\
    \nThe fundamental operations on an input, once it has been created, will be:\n\
    \n+   * finding the current position;\n* setting the current position;\n* reading\
    \ a character, at the same time advancing the position;\n* finding the length\
    \ of an input.\n\nWe need a way to group them together, and to refer to them easily.\
    \ A record is ideal:\n\n```\ntype input =\n  {pos_in : unit -> int;\n  seek_in\
    \ : int -> unit;\n  input_char : unit -> char;\n  in_channel_length : int}\n```\n\
    \nNow we can build an input from an OCaml **in_channel** easily (we have re-used\
    \ some of the standard OCaml names):"
  merge: -1
  img_proc: true
- pgno: 35
  md: "# Chapter 4. Generalized Input/Output\n\n```\ninput_of_channel : in_channel\
    \ -> input\n\nlet input_of_channel ch =\n(pos_in = (fun () -> pos_in ch);\nseek_in\
    \ = seek_in ch;\ninput_char = (fun () -> input_char ch);\nin_channel_length ch\
    \ = in_channel_length ch\n```\n\nNotice that the original channel is now hidden\
    \ inside the input – the functions pos_in and input_char instead simply take the\
    \ () as their input. Let us assure that this structure also works for abstracting\
    \ over strings:\n\n```\ninput_of_string : string -> input\n\nlet input_of_string\
    \ s =\nlet pos = ref 0 in\n(pos_in = (fun () -> !pos);\nseek_in =\n(fun p ->\n\
    \  if p < 0 then\n    raise (Invalid. argument \"seek before beginning\")\n  pos\
    \ := p);\ninput_char = (fun () ->\n  if !pos > String.length s - 1\n  then raise\
    \ End.of_file\n  else (let c = s[!pos] in pos := 1; c);\nin_channel_length = String.length\
    \ s\n```\n\nWe allocate a local reference, to hold the current position. The pos_in\
    \ and in_channel length functions are simple. The seek_in function needs to check\
    \ that the position is positive, but also it is better to be the end, for compatibility\
    \ with OCaml channels. The input_char function checks it is not trying to read\
    \ beyond the end, reads a character, advances the position, and returns the character.\n\
    Notice we use the same exception as OCaml does in its own channels – raising End.of_file\
    \ if a read is attempted beyond the last character.\n\n# Example: reading words\n\
    \nWe would like to write a program which can extract the words from a given input,\
    \ such as a string or a file. For example, given the string\n\n> \"There were\
    \ four of them; more than before.\"\n\nwe wish to produce\n\n+   [\"there\"; \"\
    were\"; \"four\"; \"of\"; \"them\"; \"more\"; \"than\"; \"before\"]"
  merge: -1
  img_proc: true
- pgno: 36
  md: "# Chapter 4. Generalized Input/Output\n\nremoving spaces, punctuation and making\
    \ the words lower case. First, let us define a function to rewind the input by\
    \ one character (useful when we read a character and decide we do not consume\
    \ it), and another, a predicate to determine if a character is considered a non-letter,\
    \ and thus it may be skipped:\n\n```\nrewind : input -> unit\nnon_letter : char\
    \ -> bool\n\nlet rewind i =\n  i.seek_in (i.pos_in i - 1)\n\nlet is_non_letter\
    \ x =\n  match x with\n  | '\\'' | '(' | ')' | ',' | '_' | '-' | ';' | ':' ->\
    \ true\n  | _ -> false\n```\n\nNow, we can write a function skip_characters to\
    \ skip punctuation from the current point. It may raise End.of_file, of course.\
    \ Then, the function collect_characters, which with a fresh Buffer and an input\
    \ which has been processed by skip_characters, returns the string containing the\
    \ next sequence of interesting characters, or raises End.of_file if we are at\
    \ the end of the input:\n\n```\nskip_characters : input -> unit\ncollect_characters\
    \ : input -> string\n\nlet rec skip_characters i =\n  if is_non_letter (i.input.char\
    \ ())\n  then skip_characters i\n  else rewind i\n\nlet rec collect_characters\
    \ b i =\n  match\n    Try Some (i.input.char ())) with End.of_file -> None\n \
    \   with None -> Buffer.contents b\n    | Some c ->\n      if is_non_letter c\n\
    \      then Buffer.contents b\n      else (Buffer.add_char b c; collect_characters\
    \ i)\n```\n\nFinally, we can write read_word, which finds the next word, if there\
    \ is one. Then, read_words collects them all in a list, and turns them in lower\
    \ case using the Standard Library function String.lowercase. These functions form\
    \ Figure 4.1. For example:\n\n```\n# read_words (input_of_string \"There were\
    \ four of them; more than before.\");\n  : string list = [\"there\"; \"were\"\
    ; \"four\"; \"of\"; \"them\"; \"more\"; \"than\"; \"before\"]\n```"
  merge: -1
  img_proc: true
- pgno: 37
  md: "# Chapter 4. Generalized Input/Output\n\n```\nread_word : input -> string option\n\
    read_words_inner : input -> string list -> string list\nread_words : input ->\
    \ string list\n```\n\n```\nlet read_word i =\n  try\n    skip.characters i;\n\
    \    Some (collect.characters (Buffer.create 20) i)\n  with\n    End.of_file ->\
    \ None\n\nlet rec read.words_inner i a =\n  match read.words i with\n    None\
    \ -> List.rev (List.map lowercase a)\n    | Some w -> read.words_inner i (w ::\
    \ a)\n\nlet read_words i =\n  read_words_inner i []\n```\n\nFigure 4.1\n\n# A\
    \ type for outputs\n\nWhat do we need for a generic output? We must have an output_char\
    \ function to write a single character, at least. It is also useful to have an\
    \ output_channel_length function so we know how many characters have been written.\
    \ We will not allow seeking back and forth like our input type for the sake of\
    \ simplicity. Figure 4.2 shows the output type, and functions to build outputs\
    \ from channels and strings.\n\nNote that while we unified the interface for writing\
    \ to strings and channels, they remain different things: the string has limited\
    \ length, and if the length is not all used it will contain junk at the end. Let\
    \ us use these functions to build a function which writes lists of integers to\
    \ any output:\n\n```\noutput_list : output -> int list -> unit\n\nlet output_list\
    \ o ls =\n  o.output_char '[\\';\n  List.iter (\n    (fun n ->\n      o.output_char\
    \ (string_of_int n);\n      o.output_char ',\\';\n      o.output_char ' ')\n \
    \ ) ls;\n  o.output_char ']']\n```\n\nNote that o.output_char has an appropriate\
    \ type for use with standard functions such as String.iter. We can test with an\
    \ output built from standard output:"
  merge: -1
  img_proc: true
- pgno: 38
  md: "# Chapter 4. Generalized Input/Output\n\n```\noutput_of_channel : out_channel\
    \ -> output\noutput_of_string : string -> output\n\ntype output =\n{output_char\
    \ : char -> unit;\n  out_channel_length : unit -> int}\n\nlet output_of_channel\
    \ ch = =\n{output_char = (fun c -> output_byte ch (int_of_char));\n  out_channel_length\
    \ = (fun () -> out_channel_length ch)}\n\nlet output_of_string s =\nlet pos =\
