    \ of string\n```\n\nNow the line breaking function. The function lines takes a\
    \ maximum width in characters, and a list of words, and returns a list. There\
    \ are three cases in the lines_inner function:\n\n+   1. If we have reached the\
    \ end of the list of words, we return the list of collected lines, adding one\
    \ for anything in the current line buffer, if it is non-empty.\n2. If we have\
    \ a newline word, create a Partial line from the current buffer (even if it is\
    \ empty – this allows blank lines to be inserted using multiple newlines), and\
    \ carry on.\n3. If we have any other order, if the buffer is longer than the whole\
    \ line and we are at the beginning of the line, we output an over-sized line (an\
    \ alternative would be to wrap or hyphenate the word in some way). Otherwise,\
    \ we see if the current word will fit. If it will, we add add it to the buffer\
    \ and carry on. If not, we do not output a Full line, and start with the word\
    \ on the next line.\n\n```\nlines_inner : line list -> Buffer.t -> int -> string\
    \ list -> line list\nlines : int -> string list -> line list\n\nlet rec lines_inner\
    \ b width words =\n  match words with\n    [] -> case 1\n      if Buffer.length\
    \ b > 0 then\n        List.rev (Partial (Buffer.contents b)) :: ls\n      else\n\
    \        List.rev ls\n    | \"\\n\":t -> case 2\n      lines_inner\n        (Partial\
    \ (Buffer.contents b) :: ls)\n        (Buffer.create width) width t\n    | word::t\
    \ -> case 3\n      if Buffer.length b == 0 && String.length word > width then\n\
    \        lines_inner (Full word :: ls) (Buffer.create width) width t\n      else\
    \ if String.length word + Buffer.length b < width then\n        begin\n      \
    \    Buffer.add_string b word;\n          Buffer.add_char b ';';\n          lines_inner\
    \ ls b width t\n        end\n      else\n        lines_inner (Full (Buffer.contents\
    \ b) :: ls)\n          (Buffer.create width) width (word :: t)\n\nlet lines width\
    \ words =\n  lines_inner [] (Buffer.create width) width words\n```\n\nFor example,\
    \ here is our text split into lines of no more than twenty characters each:"
