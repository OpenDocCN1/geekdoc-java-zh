- pgno: 66
  md: '# Chapter 7. Labelled and Optional Arguments


    ```

    let divide x y = x / y

    ```


    We can use partial application to write the function which divides ten thousand
    by each number in a list:


    ```

    let f = divide 10000 in [f 100; f 50; f 20]

    ```


    This yields [100; 200; 500]. But we cannot re-use the write function which divides
    each number in a list by this would involve partially applying the second argument
    y. The design of the divide function has baked in which argument may be partially
    applied (OCaml we can partially apply any prefix of the arguments – the first,
    first and second, first and third etc.). For example, we can apply the same function
    to many lists, using a partially applied List.map but we cannot apply arguments
    to a single list by providing the list to List instead. In our example, we can
    label the arguments to our divide function:


    ```

    let divide -x -y = x / y

    ```


    The type of the function reflects this:


    ```

    OCaml

    # divide -x -y = x / y;;

    val divide : x:int -> y:int -> int = <fun>

    ```


    Now we may apply the arguments in their order:


    ```

    OCaml

    # let f = divide -x:10000 in [f 100; f 50; f 20];

    : int list = [100; 200; 500];

    # let f = divide -y:10000 in [f 100000; f 10000; f 1000];

    : int list = [10; 1; 0]

    ```


    We can in, fact, omit the labels if we are applying arguments in order:


    ```

    OCaml

    # let f = divide 10000 in [f 100; f 50; f 20];

    : int list = [100; 200; 500]

    ```


    # Optional arguments


    OCaml also allows us to make a labelled argument optional – that is to say, we
    need not supply it at all.

    The function which is is called without one or more of its arguments can decide
    what to do. Consider this'
  merge: -1
  img_proc: true
- pgno: 67
  md: "# Chapter 7. Labelled and Optional Arguments\n\nsimple function split returns\
    \ a list of singleton lists from an input list, for example returning [[1]; [2];\
    \ [3]] for the input list [1; 2; 3];\n\n```\nsplit : α list -> α list list\n\n\
    let rec split l =\n  match l with\n    [] -> []\n    | h::t -> [h] :: split t\n\
    ```\n\nWe would like to extend the function to produce sub-lists of a given size,\
    \ other than the default of 1. We can add a labelled argument and adapt the function,\
    \ using take (which takes a given number of items from the start of a list) and\
    \ drop (which drops a given number of items from the start of a list) from the\
    \ Util module on page xiii:\n\n```\nsplit : chunksize:int -> α list -> α list\
    \ list\n\nlet rec split l -chunksize l =\n  try\n    Util.take l chunksize ::\n\
    \    split -chunksize (Util.drop l chunksize)\n  with\n    -> match l with []\
    \ -> [] | _ -> [l] last, partial, chunk\n```\n\nThere are two problems, though.\
    \ Existing code using the function will not compile, and we must always specify\
    \ the chunksize argument, even when it is of 1. This can be remedied by using\
    \ an *optional* labelled argument, introduced with a question mark instead of\
    \ tilde, and given a default value:\n\n```\nsplit : ?chunksize:int -> α list ->\
    \ α list list\n\nlet rec split ?(chunksize = 1) l =\n  try\n    Util.take l chunksize\
