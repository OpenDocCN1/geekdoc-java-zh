- pgno: 54
  md: "# Chapter 6. Compressing Data\n\n```\npackedstring_of_string : string -> string\n\
    \nlet packedstring_of_string s =\nlet b = Buffer.create(String.length s / 8 +\
    \ 1) in\nlet o = output.bits.of_output (output.buffer b) in\nfor x = 0 to String.length\
    \ s - 1 do putbit o (s.[x] = '1') done;\nflush o;\nBuffer.contents b\n```\n\n\
    Note, since the width will always be a number of bytes (possibly padded with zeros\
    \ by flush) we must remember the width and height of the image (80 and 21) and\
    \ pass one or both of them to some of our functions. For example, we can write\
    \ a function to print one of these packed strings. This needs the width of the\
    \ image to know when to print newlines:\n\n```\nprint_packedstring : int -> string\
    \ -> unit\n\nlet print_packedstring w =\nlet ibits = input.bits.of_input (input.of_string\
    \ s) in\ntry\n  while true do\n    for column = 1 to w do print_int (getbit ibbits)\
    \ done;\n    print_newline (n  done\nwith\n  End_of_file -> ()\n```\n\nFor simplicity,\
    \ we do not worry about padding at the end (in our example, the width is 80, it\
    \ will consist of whole numbers anyway).\n\n# Fax compression explained\n\nWe\
    \ said that the compression will proceed by encoding the lengths of the runs of\
    \ zeros and ones in our data. How do we encode them? We need a set of binary sequences\
    \ which can be distinguished from one another (no sequence can be a prefix of\
    \ another sequence). In the case of fax compression, there are codes for runs\
    \ 0 to 63, and different codes for white and black, as shown in Figure 6-2. Notice\
    \ that no white symbol is a prefix of another white symbol, and no black symbol\
    \ is a prefix of another black symbol. Codes for runs from 0 to 63 are terminating\
    \ codes. When a run is longer, we use a “make-up code”, shown in Figure 6-3, followed\
    \ by a terminating code. The longest run is of length 1728 + 63 = 1791.\n\nThe\
    \ reason for distinguishing between white and black codes is in unreliable transport\
    \ mechanisms (such as phone lines that fax machines operate over)—otherwise we\
    \ could just have one set of codes and assume results. The reason for the existence\
    \ of a zero-run length is that each is defined to begin with a white run. If it\
    \ is really black, a zero-length white is output first. No run is longer than\
    \ a line. As an example, let us compress the first three lines of our example\
    \ data:"
