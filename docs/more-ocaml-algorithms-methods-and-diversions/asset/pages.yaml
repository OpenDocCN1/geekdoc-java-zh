    \ -> at -> at\n\nlet rec insert_inner x s =\n  match s\n    Lf -> Br (R, Lf, x,\
    \ Lf)\n    | Br (c, l, y, r) ->\n      if x < y\n        then balance (c, l, y,\
    \ insert_inner x r)\n        else if x > y then balance (c, l, y, insert_inner\
    \ x r)\n        else Br (c, l, y, r)\n\nlet insert x s =\n  match insert_inner\
    \ x s with\n    Br (_, l, y, r) -> Br (B, l, y, r)\n    | Lf -> assert false\n\
    ```\n\nNote that we wrap in a function to set the root of the tree to Black –\
    \ balancing will not do this, since the root has no parent or grandparent to compare\
    \ with, and so we may otherwise end up with a red root with a red child. The full\
    \ module is shown in Figure 11.4.\n\nSince we have guaranteed that the tree will\
    \ be reasonably balanced, there is no need for tail recursive functions, even\
    \ for huge sets. The effect of balanced trees on performance is clear, and there\
    \ appears to be little or no slow-down from the more complex Red-Black data structure:\n\
