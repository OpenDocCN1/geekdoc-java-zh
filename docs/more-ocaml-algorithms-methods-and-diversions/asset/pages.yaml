  md: "# Chapter 7. Labelled and Optional Arguments\n\n```\nfill : α array → start:int\
    \ → length:int → α → unit\nfilled : unit → string array\n\nlet fill a -start:s\
    \ to -length:l v =\n  for x = s to s + l - 1 do a.(x) <- v done\n\nlet filled\
    \ () =\n  let a = Array.make 100 \"x\" in\n  fill a -start:20 -length:40 \"y\"\
    \n  a\n\nlet filled () =\n  let a = Array.make 100 \"x\" in\n  let st = 20 in\n\
    \  let ln = 40 in\n  fill a -start:st -length:ln \"y\"\n  a\n\nlet filled () =\n\
    \  let a = Array.make 100 \"x\" in\n  fill a \"v\" -length:20 -start:40;\n  a\n\
    ```\n\nAnother change we can make is to use the label for the name of the argument\
    \ inside the function too. This simplifies the syntax: you can write -label.\n\
    \n```\nfill : α array → start:int → length:int → α → unit\nfilled : unit → string\
    \ array\n\nlet fill a -start - start + length v =\n  for x = start to start +\
    \ length - 1 do a.(x) <- v done\n\nlet filled () =\n  let a = Array.make 100 \"\
    x\" in\n  let start = 20 in\n  let length = 40 in\n  fill a -start -length \"\
    y\"\n  a\n```\n\nYou can see that in filled, “punning” works equally well when\
    \ calling the function, if we happen to have values with the same names. These\
    \ two facilities need not be used together, of course.\n\n# Labels with partial\
    \ application\n\nAnother common use of labelled arguments to give flexibility\
    \ when using partial application. Consider the following function:"
