    \ lazylist -> int lazylist\nprimes : int lazylist\n\nlet rec mkprimes (Cons (h,\
    \ tf)) =\nCons (h, fun ()) ->\n  mkprimes (lfilter (fun x -> x mod h <> 0) (tf))\n\
    \nlet primes = mkprimes (lseq 2)\n```"
