  md: '# Coping with Errors


    let f x = match x with 0 -> 1


    then using the function with 1 as an argument would produce:


    ```

    OCaml

    # f 1;; Match_failure("toplevel//", 1, 10).

    ```


    In this example, the match failure occurred in the top level (i.e. the interactive
    OCaml we are using), at line one, character ten.


    # Exception:...


    This is printed if an un-handled exception reaches OCaml.


    ```

    OCaml

    # exception Exp of string;

    exception Exp of string

    # raise (Exp "Failed");

    Exception: Exp "Failed".

    ```


    This can occur for built-in exceptions like Division..Zero or Not_found or the
    ones one has defined like above.


    # WARNINGS


    Warnings do not stop an expression being accepted or evaluated. They are printed
    after an expression is accepted but before the expression is evaluated. Warnings
    are for occasions where OCaml is concerned you may have made a mistake, even though
    the expression is not actually malformed. You should check each new warning in
    a program carefully.


    # This pattern-matching is not exhaustive


    This warning is printed when OCaml has determined that you have missed one or
    more cases in a pattern match. This could result in a Match_failure exception
    being raised at run-time.


    ```

    OCaml

    # let f x = match x with 0 -> 1;

    Warning 0: this pattern-matching is not exhaustive.

    Here is an example of a value that is not matched:

    1

    val f : int -> int = <fun>

    ```'
