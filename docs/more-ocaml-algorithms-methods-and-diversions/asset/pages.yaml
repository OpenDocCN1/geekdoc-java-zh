    \ c)), z, d)\n    | BrB (a, x, BrB (b, y, (c, d))) ->\n      BrB (BrR (a, x, b),\
    \ y, BrR (c, z, d))\n    BrB (a, b, c) -> BrB (a, b, c)\n    | BrB (a, b, c) ->\
    \ BrB (a, b, c)\n    Lf -> Lf\n\nlet rec insert_inner x s =\n  match s with\n\
    \    Lf -> BrR (Lf, x, Lf)\n    BrR (l, y, r) ->\n      if x < y\n        then\
    \ balance (BrR (insert_inner x, l, r))\n        else if x > y then balance (BrB\
    \ (l, insert_inner x, r))\n        else BrB (l, y, r)\n    BrB (l, y, r) ->\n\
    \      if x < y\n        then balance (BrR (insert_inner x, l, r))\n        else\
    \ if x > y then balance (BrB (l, insert_inner x, r))\n        else BrB (l, y,\
    \ r)\n\nlet insert x s =\n  match insert_inner x s with\n    BrR (l, y, r) | BrB\
    \ (l, y, r) -> BrB (l, y, r)\n    | Lf -> assert false =\n\nlet rec set_of_list\
    \ l =\n  match l with\n    Lf -> []\n    h::t s -> insert h (set_of_list t)\n\n\
    let rec size s =\n  match s with\n    Lf -> 0\n    BrR (l, _, r) | BrB (l, _,\
