  md: "# Chapter 6. Compressing Data\n\n```\ndecode_fax : input_bits -> output_bits\
    \ -> int -> int -> unit\ndecompress_string_ccitt : (int -> int -> unit) -> string\
    \ -> int -> int -> string\n\nlet decode_fax i o w h =\n  let lines = ref h in\n\
    \  let pixels = ref w in\n  let iswhite = ref true in\n  while !lines > 0 do\n\
    \    while !pixels > 0 do\n      let n =\n      (if = !iswhite then read_code\
    \ read_black_code) else i\n      in\n        for x = 1 to n do\n          putbitint\
    \ o (if !iswhite then 0 else 1)\n        done;\n      pixels := !pixels - n;\n\
    \      iswhite := not !iswhite\n    done;\n    iswhite := true;\n    pixels :=\
    \ !w;\n    lines := !lines - 1\n  done\n\nlet decompress_string_ccitt = process\
    \ decode_fax\n```\n\nWe can verify our code by evaluating s = decompress_string_ccitt\
