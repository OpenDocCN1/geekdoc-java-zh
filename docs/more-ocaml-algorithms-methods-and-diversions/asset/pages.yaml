- pgno: 214
  md: '# Coping with Errors


    Helpfully, it is able to generate an example of something the pattern does not
    cover, so this would give you a hint about what has been missed out. You may ignore
    the warning if you are sure that, for other reasons, this case can never occur.


    # This match case is unused


    This occurs when two parts of the pattern match cover the same case. In this situation,
    the second one could be reached, so it is almost certain the programmer has made
    a mistake.


    ```

    OCaml

    # let x = match x with - -> 1 | 0 -> 0;

    Warning 11: this match case is unused.

    val f : int -> int = <fun>

    ```


    In this case, the first case matches everything, so the second cannot ever match.


    # This expression should have type unit


    Sometimes when writing imperative programs, we ignore the result of some side-effect-producing
    function. However, this can indicate a mistake.


    ```

    OCaml

    # f 1; 2;

    Warning 10: this expression should have type unit.

    - int = 2

    ```


    It is better to use the built-in ignore function in these cases, to avoid this
    warning:


    ```

    OCaml

    # ignore (f 1); 2;

    - int = 2

    ```


    The ignore function has type α → unit. It has no side-effect.'
