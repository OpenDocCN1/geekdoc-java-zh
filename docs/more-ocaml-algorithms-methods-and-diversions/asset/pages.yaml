- pgno: 133
  md: "steps : float → float → float list\n\n```\nlet steps n step =\n  let mul =\
    \ ref 0\n  and vals = ref []\\ in\n  while float !mul *. step <= n do\n    vals\
    \ := float !mul *. step :: !vals;\n    mul := !mul + 1\n  done;\n  List.rev !vals\n\
    ```\n\nNote that we have been careful to avoid repeated addition of floating-point\
    \ values – this can accumulate errors. We can build all the lines:\n\n```\ngraph_string\
    \ : float → float → string\nlet graph_string w h step =\n  let horizontals =\n\
    \    List.map (fun n -> mkline 0. n w) (steps step)\n  and verticals =\n    List.map\
    \ (fun n -> mkline 0. n h) (steps step)\n  in\n  Pdfpage.string_of_ops (List.concat\
    \ (horizontals @ verticals))\n```\n\nHere is the result of graph_string 595.28\
    \ 841.89 10. on a page of A4 paper:\n\n![](img/412ff6f522cd6d58bb984724b97d22e6_133_0.png)"
