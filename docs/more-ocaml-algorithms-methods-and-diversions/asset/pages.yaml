- pgno: 70
  md: "# Chapter 8\n\n# Formatted Printing\n\nOCaml provides facilities for what is\
    \ called formatted printing. Consider the following function, culled from Chapter\
    \ 3:\n\n```\nstring_of_point : point -> string\n\nlet string_of_point p =\n  p.label\n\
    \  ^ \" = (\"\n  ^ string_of_float p.x\n  ^ \",\"\n  ^ string_of_float p.y\n \
    \ ^ \"\")\n```\n\nUsing the function sprintf(\"formatted printing to a string\"\
    ) from the Standard Library module Print we can build this string more easily:\n\
    \n```\nstring_of_point : point -> string\n\nlet string_of_point p =\n  Printf.sprintf\
    \ \"%s = (%f, %f)\" p.label p.x p.y\n```\n\nIn this example, the format string\
    \ is \"%s = (%f, %f)\". The conversion specifications %s and %f denote places\
    \ for a string and the decimal representation of a floating-point number respectively\
    \ to be substituted into the string. Other characters are simply reproduced from\
    \ the format string to the output string. We have avoided the inefficient, repeated\
    \ use of the ^ operator for string concatenation, and our new example is both\
    \ shorter and easier to read. Here is a subset of the many conversion specifications\
    \ available:"
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Chapter 8. Formatted Printing


    58


    | Conversion specification | Description |

    | --- | --- |

    | %i | integer in decimal representation |

    | %x | integer in hexadecimal, lower case |

    | %X | integer in hexadecimal, upper case |

    | %s | string |

    | %f | floating-point number |

    | %B | boolean |

    | %% | percent character |

    | %! | flush the output |


    The sprintf function knows how to match the conversion specification with the
    arguments following the format specification at compile time, so run-time errors
    are avoided:


    ```

    OCaml

    ```


    ```

    # Printf.sprintf "%s" = (%f, %f) "A" 40 65.8;

    Error: This expression has type int but an expression was expected of type float

    ```


    Indeed, even if we use partial application, the type of the resulting function
    will be calculated:


    ```

    OCaml

    ```


    ```

    # let f = Printf.sprintf "%s" = (%f, %f) "A" 2.45;

    val f : float -> string = <fun>

    ```


    You might be able to guess that there is a little magic going on here – we could
    not write sprintf ourselves, for example. We can see the rather complicated type
    of the sprintf function, used for its internal implementation:


    ```

    OCaml

    ```


    ```

    # Printf.sprintf;

    : : (''a, unit, string) format -> ''a a = <fun>

    ```


    For printing numbers, there are some additional pieces of information which can
    be provided. The format of a converter specifier is in fact:


    %(flags) (width) (.precision)type


    Fields enclosed in angle brackets are optional. So far, we have only used the
    % character and the type field. The width field defines the width of the representation
    of the number, and can be used to line up in columns, here of width six:'
