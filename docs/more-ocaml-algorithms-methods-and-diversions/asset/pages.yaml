  md: "# Compressing fax data\n\nFirst, we need to encode the terminating and make-up\
    \ codes. We use arrays for indexing, but lists for each element, since we do not\
    \ random access to each bit. This is shown in Figure 6.4. Now, we can write a\
    \ function which, given a length of run and a colour, gives the appropriate code\
    \ as a list of bits:\n\n```\ncode : bool -> int -> int list\n\nlet rec code isblack\
    \ length =\n  if length > 1791 || length < 0 then\n    raise (Invalid.argument\
    \ \"code: bad length\")\n  else\n    if length > 64 then\n      let m =\n    \
    \    if isblack\n          then black_make_up.codes.(length / 64 - 1)\n      \
    \    else white_make_up.codes.(length / 64 - 1)\n      in\n        m @ code isblack\
    \ (length mod 64)\n    else\n      if isblack\n        then black_terminating_codes.(length)\n\
    \        else white_terminating_codes.(length)\n```\n\nNow, a function which,\
    \ given the current colour, input_bits, the current number of bits read, and the\
    \ width of the image, returns a pair of the number of bits read, and the colour:\n\
    \n```\nread_up_to : int -> input_bits -> int -> int -> int * int\n\nlet rec read_up_to\
    \ v n w =\n  if n >= w then (n, v) else\n    if peekbit i = v\n      then (ignore\
    \ (getbit i); read_up_to v (n + 1) w)\n      else (n, v)\n```\n\nFor example,\
    \ the first call to read_up_to, will calculate (80, 0). Now we can write the main\
    \ function. Given an input_bits and output_bits, and the width and height of the\
    \ image, for each line we check if a zero-width white run needs to be added, and\
    \ then call encode_fax_line."
  merge: -1
  img_proc: true
