  md: "# Chapter 2. Being Lazy\n\n```\nlmap : (α -> β) → α lazylist → β lazylist\n\
    lfilter : (α -> bool) → α lazylist → α lazylist\n\nlet rec lmap f (Cons (h, tf))\
    \ =\n  Cons (h, fun) -> lmap f (tf)\n\nlet rec lfilter f (Cons (h, tf)) =\n  if\
    \ h then\n    Cons (h, fun) -> lfilter f (tf)\n  else\n    lfilter f (tf))\n```\n\
