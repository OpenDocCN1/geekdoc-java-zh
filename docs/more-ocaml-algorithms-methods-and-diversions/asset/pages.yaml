  md: '# Chapter 6. Compressing Data


    ```

    read_white_code : input_bits -> int

    read_black_code : input_bits -> int


    let rec = read_white_code_i =

    let a = getintbit i in

    let b = getintbit i in

    let c = getintbit i in

    let d = getintbit i in

    match a, b, c, d with

    | 0, 1, 1, 1 -> 2

    | 1, 0, 0, 0 -> 3

    | 1, 0, 1, 0 -> 4

    | 1, 1, 0, 0 -> 5

    | 1, 1, 1, 0 -> 6

    | 1, 1, 1, 1 -> 7

    | ->

    let e = getintbit i in

    match a, b, c, d with

    | 1, 0, 0, 1 -> 8

    | 0, 1, 0, 0 -> 9

    | 0, 0, 1, 1 -> 10

    | 0, 0, 1, 0 -> 11

    | 1, 1, 0, 1 -> 64 + read_white_code i

    | 1, 0, 0, 1 -> 128 + read_white_code i

    | ->

    let f = getintbit i in

    match a, b, c, d, e, f with

    | 0, 0, 0, 0, 1, 1 -> 1


    let rec = read_black_code_i =

    let a = getintbit i in

    let b = getintbit i in

    match a, b with

    | 1, 1 -> 2

    | 1, 0 -> 3

    | ->

    let c = getintbit i in

    match a, b, c with

    | 0, 1, 0 -> 1

    | 0, 1, 1 -> 4

    | ->

    let d = getintbit i in

    match a, b, c, d with

    | 0, 0, 1, 1 -> 5

    ```


    Now, decoding is relatively simple. We decode runs for each line, until the width
    is all up, and do this for each line. We read white and black codes alternately
    – each line begins on white. We can use process again:'
