- pgno: 30
  md: "# Chapter 3. Named Tuples with Records\n\nNotice we only had to include in\
    \ the parts of the record we intended to use. This can, optionally, be made explicit\
    \ by adding the wildcard _ to the pattern:\n\n```\nstring_of_point : α → string\n\
    let string.of_point {label = l; x = x; y = y; _} = l\n  ^ = \"(\n  string_of_float\
    \ x\n  ^ = \",n  string_of_float y\n  ^ = \")\n```\n\nFinally, we can use the\
    \ shorthand record form in patterns to:\n\n```\nstring_of_point : α → string\n\
    let string.of_point {label; x; y; _} = label\n  ^ = \"(\n  string_of_float x\n\
    \  ^ = \",\n  string_of_float y\n  ^ = \")\n```\n\nWhen we need a copy of a record\
    \ with one or more fields changed, we can use the **with** keyword:\n\n```\nrelabel\
    \ : α point → string → α point\nlet relabel p l = {p with label = l}\n```\n\n\
    Again, the shortened form can help:\n\n```\nrelabel : α point → string → α point\n\
    let relabel p label = {p with label}\n```\n\nHere is a function to reflect a point\
    \ about the line x = y:\n\n```\nmirror : α point → α point\nlet mirror p = {p\
    \ with x = p.y; y = p.x}\n```"
