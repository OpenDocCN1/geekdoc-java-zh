    \ -> ?int:indent -> string list -> string list list\n\nlet rec lines_inner ls\
    \ b width indent words =\n  match words with\n  |[] ->\n    if Buffer.length b\
    \ > 0 then\n      List.rev (Partial (Buffer.contents b)) :: ls\n    else\n   \
    \   List.rev ls\n  | \"\\n\":t ->\n    let b' = Buffer.create width in\n     \
    \ for x = 1 to indent Buffer.add_char b' '' done;\n      lines_inner\n       \
    \ (Partial (Buffer.contents b)) :: ls) b' width indent t\n    | word:t ->\n  \
    \    if Buffer.length b = 0 String.length word > width then\n        lines_inner\n\
    \          (Full word :: ls) (Buffer.create width) width indent t\n      else\
    \ if String.length word + Buffer.length b < width then\n        begin\n      \
    \    Buffer.add_string b word;\n          if Buffer.length b < width then Buffer.add_char\
    \ b ''';\n          lines_inner ls b width indent t\n        end\n      else\n\
    \        lines_inner\n          (Full (Buffer.contents b)) :: ls\n          (Buffer.create\
    \ width) width indent (word :: t))\n\nlet lines width words?(indent=0) words =\n\
