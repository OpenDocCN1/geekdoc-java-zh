  md: "# Chapter 14. Writing Documents\n\n```\npdf_to_file : Pdf.t \\-> string \\\
    -> unit\n\nlet pdf_to_file pdf filename =\n  let output = open_out_bin filename\
    \ in\n  try\n    write_header output pdf;\n    let offsets = write_objects output\
    \ pdf.Pdf.objects in\n    write_trailer output pdf offsets;\n    close_out output\n\
    \  with\n    e -> close_out output; raise e\n```\n\nThis code goes into pdfwrite.ml.\
