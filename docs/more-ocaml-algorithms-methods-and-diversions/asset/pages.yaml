    ```


    Rather complicated, as we can see. Our first job is to define a pleasant OCaml
    data type for PDF documents, which can then be flattened to the format above when
    writing a file.


    The main body of a PDF file is a set of nested objects – there are four in the
    example above, from 1 obj to 4 obj. Each one contains some structured data, such
    as the dictionary <</Type /Pages [1 0] /Count 1>> which associates the keys /Type,/Kids
    and /Count to the name /Pages, the array [1 0], and the integer 1 respectively.
    Before the main body is some ancillary data, most of which we do not need to hold
    in our data structure – it is generated upon writing. Here are all the kinds of
    data we use:


    +   - Booleans, like true and false

    - Integers, such as 4, 256, -1

    - Floating-point numbers such as 1.585

    - Strings, like (a string) which are sequences of characters within parentheses

    - Names, like /Name

    - Ordered arrays of objects as [1 2 4]

    - Dictionaries, which are unordered collections of key-value pairs, where the
    keys are names. For example, <</One 1 /Two 2 /Three 3>>.'
