  md: "# Answers to Questions\n\n```\narray_rev : a array -> int -> int -> unit\n\
    let array_rev a l =\n  for x = 0 to l / 2 - 1 do\n    swap (o + x) (o + l - x\
    \ - 1)\n  done\n```\n\nIt is important to make sure it works for the empty range,\
    \ an even-length sub-array and an odd-length sub-array. You could add detection\
    \ of invalid arguments to this function.\n\n# 5\n\nThe two functions first and\
    \ last turn out to be even more awkward than their imperative counterparts. The\
    \ function first, given a list, returns a tuple of three things: the elements\
    \ before the \"first\" item, the first item itself, and thereafter. This is done\
    \ by reversing the input list and looking for the first appropriate item, since\
    \ this is easier than looking for the appropriate item in the original input:\n\
    \n```\nfirst_inner : a list -> a list -> (a list x a x a list)\nfirst : a list\
    \ -> (a list x a x a list)\n\nlet rec first_inner before l =\n  match l with\n\
    \  | [] -> raise (Invalid.argument \"first_inner\")\n  | [x] -> (List.rev before,\
    \ x, [])\n  | a::b:t ->\n      if b < a\n      then (List.rev t, b, (a :: before))\n\
    \      else first_inner (a :: before) (b :: t)\n\nlet first l =\n  first_inner\
    \ [] (List.rev l)\n```\n\nThe last function is still more verbose: we locate the\
    \ correct item by sorting and finding the smallest item greater than f. We can\
    \ then split_at to return the item before and after the instance of f."
