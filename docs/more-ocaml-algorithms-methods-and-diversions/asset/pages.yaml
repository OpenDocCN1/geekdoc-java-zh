- pgno: 31
  md: "# Mutable records\n\nIndividual fields of a record can be made mutable (their\
    \ value may be changed – literally mutated), by use of the `mutable` keyword:\n\
    \n```\ntype 'a point =\n{ x : float;\n  y : float;\n  label : string;\n  mutable\
    \ content : 'a}\n```\n\nIn fact, OCaml's reference type is just a record with\
    \ a single, mutable field:\n\n```\nOCaml\n\n# let x = ref 0;\n#   : int ref =\
    \ { contents = 0 }\n```\n\nHere, the type of `ref` is defined by `type` `'a ref\
    \ = {mutable contents : 'a}` and the constructor function is of type `α -> α ref`.\
    \ The value of a mutable field can be updated using the `<-` symbol like this:\n\
    \n```\nOCaml\n\n# type 'a point = {x : float; y : float; label : string; mutable\
    \ content : 'a};\ntype 'a point =\n  x : float;\n  y : float;\n  label : string;\n\
    \  mutable content : 'a;\n}\n\n# let p = {x = 4.5; y = 6.0; label = \"P\"; content\
    \ = [1; 3; 1]};\nval p : int list point = {x = 4.5; y = 6.; label = \"P\"; content\
    \ = [1; 3; 1]}\n\n# p.content <- [1];\n#   : unit = ()\n\n# p;\n#   : int list\
    \ point = {x = 4.5; y = 6.; label = \"P\"; content = [1]}\n```\n\nSuch records\
    \ should be used with care, like any mutable feature, especially if they are likely\
    \ to be used as part of a larger data structure."
  merge: -1
