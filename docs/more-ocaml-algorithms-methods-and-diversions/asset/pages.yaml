  md: "```\nencode_fax : input_bits -> output_bits -> int -> int -> unit\n\nlet encode_fax\
    \ i o w h =\nlet rec encode_fax.line i o w =\n  if w > 0 then\n    let n, black\
    \ = read_up_to (peekbit i) i o w in\n      List.iter (putbitint o) (code black);\n\
    \      encode_fax.line i o (w - n)\n  in\n    for x = 1 to h do\n      if peekbit\
    \ i List.iter (putbitint o) (true 0);\n      encode_fax.line i o w\n  done\n```\n\
    \nNow we can write a function process, just like we did in the byte-by-byte example,\
    \ but for input_bits and output_bits. We must be sure to flush the output. The\
    \ main compress_string.ccitt function is then simple:\n\n```\nprocess : (input_bits\
    \ -> output_bits -> int -> int -> unit) -> \nstring -> int -> int -> string\n\
    compress_string.ccitt : (int -> int -> unit) -> string -> int -> int -> string\n\
    \nlet process f s w h =\nlet b = Buffer.create (String.length s) in\nlet ibits\
    \ = input_bits_of_input (input_of_string s) in\nlet obits = output_bits_of_output\
    \ (output_of_buffer b) in\nf ibits obits w h;\nflush obits;\nBuffer.contents b\n\
    \nlet compress_string.ccitt = process encode_fax\n```\n\nFor our full input data,\
    \ the input string is 80 × 21 = 1680 bits long, and the compressed string is 960\
    \ bits long, a compression ratio of 7:4.\n\n# Decompressing fax data\n\nFor decompression,\
    \ we will write two functions for reading white and black codes. It is easiest\
    \ to directly encode the decision tree:"
