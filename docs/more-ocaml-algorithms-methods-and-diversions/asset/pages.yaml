  md: '# Chapter 11. Making Sets


    # # Hash Tables


    A hash table is a data structure designed to provide very fast access to in sets
    and maps. It holds a set of buckets 0...n. When we insert a value into the set,
    it is processed by a hash function which allocates it to a bucket, in a manner
    that is roughly a uniform distribution of values among the buckets. When we need
    to test membership for an, the same hash function used is appropriate, and lookup
    is constant time regardless of how many items are in the set.


    For example, if the hash function is $x \rightarrow x \mod 23$ and the value to
    be inserted is 34, 2, 6, 7, 3, 4, 84, 1467, 7432, 48, then the buckets would be
    11, 22, 21, 3, 4, 15, 18, 3, 1. The membership test for 67 consists of applying
    the hash function, and then searching in bucket 21 to see if 67 is there.


    The OCaml Standard Library provides a hash table implementation in the module
    Hashtbl. A hash table for a set, we use a hash table which maps from $\alpha$
    to unit, of type $(\alpha, unit)$ Hashtbl. It is simple to build an implementation
    matching our signature, using the functions Hashtbl.mem, Hashtbl.add, Hashtbl.create,
    and Hashtbl.iter, as shown in Figure 11-2.


    The disadvantage of hash tables is they are mutable, so operations like insert
    mutate the structure. The result of insert, then, alters the set rather than creating
    a new set. This means that the SetType interface is technically satisfied, the
    intended abstraction is actually broken. Such is mutability. The performance on
    our benchmarks, however, is clear:


    | Unordered Ordered | Unordered Ordered |

    | --- | --- | --- | --- |

    | Insertion | 20.4s | 17.5s | Insertion | 0.09s | 116.6s |

    | Membership | 34.8s | 17.8s | Membership | 0.02s | 33.4s |

    | Elements | 0s | 0s | Elements | 0.02s | 98.0s |

    | Size | 0s | 0s | Size | 0s | 0s |


    | Unordered Ordered | Unordered Ordered |

    | --- | --- | --- | --- |

    | Insertion | 0.11s | 0.06s | Insertion | 0.014s | 0.007s |

    | Membership | 0.01s | 0.02s | Membership | 0.012s | 0.005s |

    | Elements | 0.03s | 0.01s | Elements | 0.004s | 0.002s |

    | Size | 0s | 0s | Size | 0s | 0s |


    The benchmarking programs may be found in the online resources.'
