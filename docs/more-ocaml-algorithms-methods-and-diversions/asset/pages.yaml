  md: '# Our Working Environment


    Every piece of code in an example, and every answer to an end-of-chapter question
    can be downloaded from the book''s website at http://www.ocaml-book.com/ and built
    on the reader''s machine. The programs work on Unix (including Linux), Mac OS
    X, and Windows Machines.

    Since several of our programs require tail-recursive functions, we provide a wrapper
    to the Standard Library List module which provides them. In addition, three small
    utility functions (take, drop, and from) are provided in a Util module. These
    modules are contained in the module file. So, by writing open More, the Util module
    available, and all functions in the List module are tail-recursive.

    If OPAM, the OCaml Package Manager, this package may be installed by writing opam
    install more-ocaml. Then (or by installing in another manner – see the online
    resources for details) our modules available in the top level:


    OCaml


    ```

