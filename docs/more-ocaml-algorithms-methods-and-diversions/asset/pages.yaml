    ```\n\nNow, we can generate a list of all these points, remembering to store before\
    \ we have been around the whole circle. The argument step is the angle between\
    \ successive points.\n\n```\npoints : float -> float -> float -> float -> (float\
    \ x float) -> list\n\nlet points x y r step =\nlet n = ref 0\nand points = ref\
    \ [] in\nwhile float_of_int n *. step < 2. *. r *. pi do\n points := point x y\
    \ r (float_of_int n *. step) :: !points;\n n := !n + 1\ndone;\n!points\n```\n\n\
