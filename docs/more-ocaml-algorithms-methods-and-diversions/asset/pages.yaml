- pgno: 14
  md: "# Chapter 1\n\n# Unravelling “Fold”\n\nThe **List** module in OCam's Standard\
    \ Library defines twoにつき-named functions over lists:\n\n```\nfold_left : (α →\
    \ β → α) → α → β list → α\nfold_right : (α → β → β) → α list → β → β\n\nlet rec\
    \ fold_left f a =\n  match l with\n  | [] -> a\n  | h:t -> fold_left f (f a h)\
    \ t\n\nlet rec fold_right f a =\n  match l with\n  | [] -> a\n  | h:t -> f h (fold_right\
    \ f t a)\n```\n\nWhat do they do? And why are they considered important enough\
    \ to include in the Standard Library? As we see, they abstract the idea of recursion\
    \ over lists with a custom as most delightfully generic way.\n\nLet us examine\
    \ fold_left and its rather complicated type. The first argument is a function,\
    \ which takes the existing accumulator and an element from the input list, combines\
    \ them in some fashion, and returns a new accumulator, for the next element. So,\
    \ in general, the first argument has type α → β → α. We then have an initial value\
    \ for the accumulator, which must have type α, and an input list of type β list.\
    \ The return value is the final accumulator, so that must have type α. We can\
    \ annotate the function as:\n\n| fold_left : (α → β → α) → α → β list → α | function,\
    \ initial accumulator, input list |\n| let rec fold_left f a = match l with |\n\
    | [] -> a | no input – return the accumulator |\n| h:t -> fold_left f (f a h)\
    \ t | apply function to a and h, making new a |"
  merge: -1
  img_proc: true
- pgno: 15
  md: "# Chapter 1. Unravelling “Fold”\n\nWe can find the sum of a list of lists:\n\
    \n```\nfold.left ( ) 0 [1; 2; 3]\n==> fold.left ( ) 1 [2; 3]\n==> fold.left (\
    \ ) 3 [6]\n==> 6\n```\n\nHere, $\\alpha$ and $\beta$ are both int. The function\
    \ ( ) has the right type, and we use for the initial accumulator the identity\
    \ element for int ( ) which is 0 for all $x$, $x+0=x$ (we cannot take the initial\
    \ accumulator from the list unless our function must have a result for the sum\
    \ of all the integers in an empty list).\n\nIt might appear to the reader that\
    \ this is more complicated than the simple recursive solution, but to the experienced\
    \ functional programmer, using fold.left is easier to read. Let us find the maximum\
    \ number in a list using fold.left:\n\n```\nfold.left max.int [2; 4; 6; 0; 1]\n\
    ==> fold.left max 2 [4; 6; 0; 1]\n==> fold.left max 4 [6; 0; 1]\n==> fold.left\
    \ max 6 [0; 1]\n==> fold.left max 6 [1]\n==> 6\n```\n\nHere max the built-in function\
    \ for finding the larger of two things, and min_int is the built-in value of the\
    \ smallest possible integer. We can use a similar scheme to define functions on\
    \ lists of booleans:\n\nall : bool list -> bool\nany : bool list -> bool\n\nlet\
    \ all l = fold_left ( && ) true l\n\nlet any l = fold_left ( || ) false l\n\n\
    The all function is true only if all items in the list are true; the any function\
    \ if at least one is. What can happen when $\\alpha$ and $\beta$ are different?\
    \ By making the accumulator a list too? We can use List.mem to turn an arbitrary\
    \ list into a set by consulting the existing accumulator before putting an in\
    \ element:\n\n```\nsetify : alpha list -> alpha list\n\nlet setify l =\nfold_left\
    \ (fun a e -> if List.mem e a then a else e :: a) [] l\n```\n\nWe are using List.mem\
    \ to decide whether to add each element to the accumulator or discard it."
  merge: -1
  img_proc: true
- pgno: 16
  md: "# Chapter 1. Unravelling “Fold”\n\n# # What about fold_right?\n\nHere is the\
    \ function again:\n\n```\nfold_right : (α → β → β) → α list → β β\n\nlet rec fold_right\
    \ f l a =\n  match l with\n    [] -> a\n    | h:t -> f h (fold_right f t a)\n\
    ```\n\nThe fold_left function groups the element over the input list from the\
    \ left hand side. In contrast, fold_right processes them by changing the evaluation\
    \ order. Consider, for example, our summation example:\n\n```\nfold_left ( ) 0\
    \ [1; 2; 3]\nfold_left ( ) 1 [2; 3]\nfold_left ( ) 3 [3]\nfold_left ( ) 6 [ ]\n\
    6\n```\n\n```\nfold_right ( ) [1; 2; 3] 0\n( ) 1 (fold_right ( ) [2; 3] 0)\n(\
    \ ) 1 (( + ) 2 (fold_right ( ) [3] 0))\n( ) 1 (( + ) 2 (( + ) 3 (fold_right (\
    \ + ) 0)))\n( ) 1 (( + ) 2 (( + ) 15))\n6\n```\n\nWe see the accumulating of values\
    \ starts from the right hand side. Note also that fold_right is not tail-recursive\
    \ (the intermediate expression it builds is proportional to the size of the input).\
    \ We can define map simply as a use of fold_right.\n\n```\nmap : (α → β) → α list\
    \ → β list\n\nlet map l =\n  fold_right (fun e a -> e :: a) l []\n```\n\nWho would\
    \ have thought that fold_right was the more fundamental function? At the cost\
    \ of a list reversal, we can make fold_right tail-recursive by defining it in\
    \ terms of fold_left:"
  merge: -1
  img_proc: true
- pgno: 17
  md: '# fold_right : (α → β → β) → α list → β → β


    ```

    fold.right f l e =

    fold.left (fun x y -> f y x) e (List.rev l)

    ```


    Sometimes we want to provide an initial accumulator value which is not the identity
    element for the computation. For example, applying :: over an input list with
    fold.right is not very interesting, yielding a function which returns a α : →
    α of its input:


    ```

    copy : α list → α list

    let copy l =

    fold.right (fun e a -> e ::) l []

    ```


    But if we use a non-empty list as the initial value of the accumulator, we have
    the function:


    ```

    append : α list → α list → α list

    let append x y =

    fold.right (fun e a -> e :: a) x y

    ```


    We can use a more complicated accumulator, such as a tuple. In this example, we
    replicate the List.split function which, given a list of pairs, yields a pair
    of lists:


    ```

    split : (α × β) → α list → list × β list

    let split l =

    fold.right

    (fun (x, y) (xs, ys) -> (x :: xs, y :: ys))

    l

    ([], [])

    ```


    For example, split [(1, "one"); (2, "two")] evaluates to ([1; 2], ["one"; "two"]).


    # A word of caution


    One very simple definition for the function concat which concatenates all lists
    in a list of lists is given by:


    ```

    concat : α list → α list

    let concat l = fold.left (@ ) [] l

    ```'
  merge: -1
  img_proc: true
- pgno: 18
  md: "# # Chapter 1. Unravelling “Fold\"\n\nWe use the append function to accumulate\
    \ the lists into a single list by one:\n\n+   - fold_left (@) [] [[1;2]; [3];\
    \ [4;5]]\n- fold_left (@) [1; 2] [[3]; [4;5]]\n- fold_left (@) [1; 2; 3] [[4;\
    \ 5]]\n- fold_left (@) [1; 2; 3; 4; 5] []\n\nHowever, the order of evaluation\
    \ is such that the append function @ (which takes time proportional to the length\
    \ of its first argument) is used inefficiently - we process the list again and\
    \ again.\n\n# # Folding over trees\n\nFor the usual definition of a binary tree,\
    \ we can define a fold. There are two accumulators, one for everything from the\
    \ left sub-tree, and one for everything from the right sub-tree. The supplied\
    \ function combines both into a new accumulator.\n\n```\nfold_tree : (α → β →\
    \ β → β) → β → α tree → β\n\ntype 'a tree =\n  Lf\n  | Br of 'a * 'a tree * 'a\
    \ tree\n\nlet rec fold_tree f e t =\n  match t with\n    Lf -> e\n    | Br (x,\
    \ l, r) -> f x (fold_tree f e l) (fold_tree f e r)\n```\n\nHere is an example:\
    \ which we write as Br (1, Br (0, Lf, Lf), Br (6, Br (4, Lf, Lf), Lf))\n\n![](img/412ff6f522cd6d58bb984724b97d22e6_18_0.png)\n\
    \nFunctions for the size of a tree, and the sum of an integer tree are now easy,\
    \ without explicit recursion:"
