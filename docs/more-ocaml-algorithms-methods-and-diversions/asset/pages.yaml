  md: "```\nmodule type SetType =\nsig\n  type 'a t\n  val set_of_list : 'a list ->\
    \ 'a t\n  val list_of_set : 'a t -> 'a list\n  val insert : 'a -> 'a t -> 'a t\n\
    \  val size : 'a t -> int\n  val member : 'a -> 'a t -> bool\n  val union : 'a\
    \ t -> 'a t -> 'a t\nend\n```\n\nFor lists, the union function is easy, we insert\
    \ each element of b into the list a. Duplicates will be removed correctly:\n\n\
    ```\nlet union a b = List.fold_left (fun x y -> insert x y) a b\n```\n\nFor trees\
    \ and Red-Black trees, we must turn b into a list first, so fold_left can be used,\
    \ but the solution is broadly the same.\n\n```\nlet union a b = List.fold_left\
    \ (fun x y -> insert x y) a (list_of_set b)\n```\n\nFor hash tables, to preserve\
    \ the previous tables, we must build lists from both sets, and then build a new\
    \ set from the concatenation of those two lists:\n\n```\nlet union a b = set_of_list\
    \ (list_of_set a @ list_of_set b)\n```\n\nThe built-in Set module, which is considered\
    \ in Question 3, provides a particularly efficient union operation.\n\n# 3\n\n\
