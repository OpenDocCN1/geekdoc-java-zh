  md: "# Answers to Questions\n\n```\nsplit_at_inner : α list → α list → α list →\
    \ α list → α list × α list\nsplit_at : α list → α list → α list → α list × α list\n\
    last : α list → α α list → α list × α list\n```\n\n```\nrec split_at_inner before\
    \ l =\n  match l with\n  [] -> (List.rev before, [])\n  | h:t ->\n    if h = n\n\
    \      then (List.rev before, t)\n      else split_at_inner (h :: before) t\n\
    ```\n\n```\nlet split_at n l =\nsplit_at_inner [] n l\n```\n\n```\nlet last l\
    \ =\n  match List.filter (fun x -> x > f) (List.sort compare l) with\n  [] ->\
    \ raise (Invalid.argument \"last\")\n  | h:t ->\n    let before, after = split_at\
    \ h in\n    (before, h, after)\n```\n\nNow, the next_permutation function calls\
    \ first and last and stitches everything together:\n\n```\nnext_permutation :\
    \ α list → α list\nlet next_permutation l =\n  let before_f, f, after_f = first\
    \ l in\n  let before_c, c, after_c = last f after_f in\n  before_f @ [c] @ List.rev\
    \ (before_c @ [f] @ after_c)\n```\n\nHere is the equivalent non_increasing function,\
    \ which is simple:\n\n```\nnon_increasing : α list → bool\nrec non_increasing\
    \ l =\n  match l with\n  [] | [_] -> true\n  | a:b:t -> a >= b && non_increasing\
    \ (b :: t)\n```\n\nThe final all_permutations function is now easy."
