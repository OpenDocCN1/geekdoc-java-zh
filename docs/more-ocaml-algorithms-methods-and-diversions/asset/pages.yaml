    \ =\nstruct\n  type 'a = Lf | Br of 'a * 'a * 'a\n\nlet rec list_of_set s =\n\
    \  match s with\n    Lf -> []\n    | Br (l, x, r) -> list_of_set l [x] @ list_of_set\
    \ r\n\nlet rec insert x s =\n  match s with\n    Lf -> Br (Lf, x, Lf)\n    | Br\
