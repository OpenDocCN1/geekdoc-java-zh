  md: "# Chapter 14. Writing Documents\n\nNow, we can write the trailer. That is to\
    \ say, this section:\n\n```\nxref\n0 5\n0000000000 65535 f\n0000000015 00000 n\n\
    0000000230 00000 n\n0000000279 00000 n\n0000000338 00000 n\ntrailer\n<< /Size\
    \ 5 /Root 2  >>\nstartxref\n440\n%%EOF\n```\n\nThis consists largely of a list\
    \ of the byte offsets of the four objects in the file (15, 230, 279, 338), the\
    \ trailer dictionary, and so on. It is not necessary to understand it in detail.\
    \ This is the first section which would be read by a PDF reader, to find the actual\
    \ objects in the file.\n\n```\nwrite_trailer : out_channel -> Pdf.t -> int list\
    \ -> unit\n\nlet write_trailer o pdf offsets =\nlet startxref = pos_out o in\n\
    \    output_string o = \"xref\\n\";\n    output_string o =\n        (Printf.sprintf\
    \ \"%09d\\n\" (List.length pdf.Pdf.objects + 1));\n    output_string o = \"0000000000\
    \ 65535 f \\n\";\n    List.iter (\n        (fun offset ->\n            output_string\
    \ o = (Printf.sprintf \"%010i 00000 n \\n\" offset))\n        ) offsets;\n   \
    \ output_string o = \"trailer\\n\";\n    output_string o = (string.of_object pdf.Pdf.trailer);\n\
    \    output_string o = \"\\nstartxref\\n\";\n    output_string o = (string.of_int\
    \ startxref);\n    output_string o = \"\\n%%EOF\");\n```\n\nNow the main function\
    \ is simple. We open the file, the header, objects, and trailer, and close the\
    \ file. In the event of an exception, we close the file to clean up, and re-raise\
    \ it."
