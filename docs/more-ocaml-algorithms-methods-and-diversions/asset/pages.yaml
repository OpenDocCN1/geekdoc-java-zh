    # Output bit streams


    The type of output bit streams is rather similar to that for input bit streams,
    but it must be used rather differently.


    ```

    type output_bits =

    output : output;

    mutable obyte : int;

    mutable obit : int

    ```


    Here, out the underlying output. The current output byte which is being constructed
    bit-by-bit is obyte, and the output bit from 7 down to 0 to represent the current
    shift required to add a bit to the byte in the correct place. When it is time
    to move on the next byte, obit is -1. We can build a fresh output_bits from an
    output:


    ```

    output_bits_of_output : output -> output_bits


    let output_bits_of_output o =

    {output = 0;

    byte = 0;\obit = 7}

    ```


    The whole byte cannot be written to the underlying output until it has been completed,
    so we must have a flush function to write when output is finished:


    ```

    flush : output_bits -> unit


    let flush o =

    if o.obit < 7 then o.output.char(char_of_int o.obyte);

    byte <- 0;\obit <- 7

    ```


    This doubles as our alignment function. We can now write putbit. For reasons we
    shall explain, considers any non-zero input to be a 1 bit.'
