  md: "# Answers to Questions\n\n```\nsentence : string list -> string\nlet sentence\
    \ words =\nList.fold_left\n(fun a e -> if a = \"\" then e else a ^ \" \" ^ e)\n\
    \  words\n```\n\nNote that the requirement that the words are non-empty is important\
    \ here, since each concatenation builds a new string. The Standard Library Buffer\
    \ module is a better approach here.\n\n# 7\n\nWe can use the built-in max function\
    \ to update the accumulator.\n\n```\nmax_depth : alpha tree -> int\nlet max_depth\
    \ l =\nList.fold_tree (fun l r -> 1 + max l r) 0 l\n```\n\nThe current element\
    \ is ignored.\n\n# 8\n\nWe can compare the speed of List.mem and member with the\
    \ help of the Unix.gettimeofday function, as shown in Figure A.1. On the Author's\
    \ machine, this results in:\n\nOur member took 2.513232 seconds\nList.mem took\
    \ 1.162159 seconds\n\nThere is a significant speed penalty in our version of the\
    \ member function, at least for this scenario.\n\n# Chapter 2 (Being Lazy)\n\n\
    # 1\n\nThis is similar to the lseq function in the text, but we double every time\
    \ instead of adding one.\n\n```\nldouble : int -> int lazylist\nthedoubles : int\
    \ lazylist\nlet rec ldouble n =\nCons (n, fun () -> ldouble (n * 2))\nlet the_doubles\
    \ = ldouble 1\n```"
