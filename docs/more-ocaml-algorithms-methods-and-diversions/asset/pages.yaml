  md: '# Chapter 3


    # Named Tuples with Records


    Tuples can be used to combine a fixed number of elements of same or differing
    types. However, once we have more than two or three items, remembering the order
    can be difficult, especially if the types of the items are the same. Records remedy
    this, allowing us to name each item. Due to this naming, they have several useful
    properties which distinguish them from tuples. Let us define a simple type for
    cartesian coordinates in two dimensions:


    ```

    type point = {x : float; y : float};

    ```


    Records are like tuples with labels. We write them between braces { }. Each element
    of the record (called a field) has a name and a type, and the fields are separated
    by semicolons. We can construct a value of this type using the same syntax, but
    with the equals sign in place of the colons:


    ```

    let p = {x = 4.5; y = 6.0};

    ```


    We can add another field to the record, a label for the point:


    ```

    type point = {x : float; y : float; label : string};

    ```


    We can parametrize just like a list or variant data type:


    ```

    type ''a point =

    {x : float;

    y : float;

    label : string;

    content : ''a}

    ```


    So now we can have values of type int point and string and so on. We can define
    one directly:'
