    \ * 'a * 'a t\n  let rec list_of_set s =\n  match s with\n  Lf -> []\n  | Br (_,\
    \ l, x, r) -> x : list_of_set l @ list_of_set r\n\nlet balance t =\n  match t\
    \ with\n  (B, R (Br (R, a, x, b), y, c), z, d)\n  | (B, R (R, a, x, Br (B, y,\
    \ c)), z, d)\n  | (B, a, x, Br (R (R, b, y, c), z, d))\n  | (B, a, x, Br (R, b,\
    \ y, Br (B, c, z, d)))) ->\n  | (a, b, c, d) -> insert (a, b, c)\n\nlet rec insert_inner\
    \ x s =\n  match s with\n  Lf -> Br (c, Lf, x)\n  | Br (c, l, y, r) -> ->n   \
    \ if x < y\n    then balance (c, insert_inner x l, y, r)\n    elseelse x > y then\
    \ balance (c, l, y, insert_inner x r)\n    else Br (c, l, y)\n\nlet insert x s\
    \ =\n  match x with\n  Br (_, l, y, r) -> Br (B, l, y, r)\n  | Lf -> assert false\n\
    \nlet rec set_of_list l =\n  match l with\n  [] -> Lf\n  | h:t -> insert h (set_of_list\
    \ t)\n\nlet rec size s =\n  match s with\n  Lf -> 0\n  | Br (_, l, _, r) -> 1\
    \ + size l + size r\n\nlet rec member x s =\n  match s with\n  Lf -> false\n \
    \ | Br (_, l, y, r) ->\n    x = y || if x > y then member x r else member x l\n\
