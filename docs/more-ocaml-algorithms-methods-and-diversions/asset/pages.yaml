  md: '# Chapter 16


    # # Adding Text


    In this chapter, we will develop a very simple typesetter. Given a string representing
    the page content, we will split it into words, break them across lines and place
    them on the page. In the questions at the end of the chapter, the typesetter will
    be extended to use full justification, to indent paragraphs, and to produce multi-page
    documents.


    To begin with, some of our numbers (lines per page, margins etc.) will be hard
    coded – we will then factor them out as we generalize the code. But let us define
    names for the page width and height for an A4 page first, to prevent excessive
    duplication:


    ```

    page_width : float

    page_height : float


    let page_width = 595.28

    let page_height = 841.89

    ```


    We first need to split our text into words. For our purposes, a word is anything
    separated from another word by one or more spaces. To preserve the paragraph breaks,
    the new line character \n will be considered a word also. So, for example, the
    string "He stopped.\n Looking around, he saw he was enveloped in smoke." would
    be split into the list of words ["He"; "stopped."; "\n"; "Looking"; "around,";
    "he"; "saw"; "he"; "was"; "enveloped"; "in"; "smoke.\].


    The function consume_spaces, given an input, places the input position at the
    first non-space character or at its current position. If the end of the input
    is reached, no exception is raised.'
  merge: -1
  img_proc: true
- pgno: 137
  md: "# Chapter 16. Adding Text\n\n```\nconsume_spaces : Input.input -> unit\n\n\
    let consume_spaces i =\n  try\n    while true do\n      match i.input.char ()\
    \ with\n      | ' ' x -> rewind i; raise End.of_file\n    done;\n    assert false\n\
    \  with\n    End.of_file -> ()\n```\n\nNow we can write a function to read a word.\
    \ First, we consume any spaces present. Then, we repeatedly\nread characters into\
    \ a buffer until the space occurs, a newline occurs, or we reach the end of a\
    \ file. If\na space occurs, we have finished reading the word. If a newline occurs,\
    \ we have finished also, but\nwe rewind so the newline will be picked up as as\
    \ its own word next time. If we reach the end of the input, we\nreturn the contents\
    \ of the buffer so far.\n\n```\nread_word : Input.input -> string\n\nlet read_word\
    \ i =\n  consume_spaces i;\n  let b = Buffer.create 20 in discard initial space\n\
    \  try\n    while true do\n      match i.input.char () with\n      | '\\n' ->\
    \ newline\n        if Buffer.length b = 0\n          then Buffer.add_char b '\\\
    n'\n          else rewind i;\n        raise End.of_file\n      | ' ' -> raise\
    \ End.of_file space\n      | c -> Buffer.add_char b c any other character\n  \
    \  done;\n    assert false\n  with\n    End.of_file ->\n    if Buffer.length b\
    \ = 0 ... if we read nothing...\n      then raise End.of_file ...we have no word,\
    \ but are at the end...\n      else Buffer.contents b ...otherwise we have a final\
    \ word\n```\n\nNow it is simple to collect all the words in the input by repeatedly\
    \ calling read_word, and accumulating\nthe result is a list."
  merge: -1
  img_proc: true
