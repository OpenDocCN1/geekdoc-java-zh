  md: "# Chapter 6. Compressing Data\n\nwe must stop early. If we are at the end of\
    \ input when the function is called, End_of_file is raised as usual.\n\n```\n\
    get_same : input -> char × int\n\nlet get_same i =\n  let rec getcount ch c =\n\
    \    if c = 128 then 128 else\n      try\n        if i.input.char () = ch\n  \
    \        then getcount ch (c + 1)\n        else (rewind i)\n      with\n     \
    \   End.of_file -> c\n  in\n  let ch = i.input.char () in (ch, getcount ch 1)\n\
    ```\n\nThe get_different function is rather more awkward. It will return the non-empty\
    \ list of “different” characters starting at the current position. We must stop\
    \ as soon as we notice two characters, rewinding twice and removing a character\
    \ from our accumulator. So, for example, if we are reading “An Accumulation” we\
    \ want to return ['A'; 'n'; ';'] but we do not know this until we read the second\
    \ ‘c’. Again, we stop after 128 differing characters. After, End_of_file is raised\
    \ if we are at the end of the input on the initial call.\n\n```\nget_different\
    \ : input -> char list\n\nlet get_different i =\n  let rec getdiffinner a c =\n\
    \    if c = 128 then List.rev a else\n      try\n        let ch = i.input.char\
    \ () in\n        if ch <> List.hd a\n          then getdiffinner (ch :: a) (c\
    \ + 1)\n        else (rewind i; rewind i; List.rev (List.tl a))\n      with\n\
    \        End.of_file -> List.rev a\n  in\n  getdiffinner [i.input.char ()] 1\n\
    ```\n\nThe compression function is now relatively simple. We repeatedly call get_same.\
    \ If it indicates a run of length one, we call get_different instead. In each\
    \ case we write appropriate data. Then, on End_of_file, we write the EOD marker.\
