  - "[PAGE 108]\n\n# Chapter 12. Playing Games\n\n```\nreplace : -> turn list -> int\
    \ -> turn list\nlet replace turn board p =\nUtil.board (p - 1) @ [turn] @ Util.board\
    \ p\n```\n\nOne more simple function is required before we can write the main\
    \ tree-building function, and that is change whose turn it is:\n\n```\nflip_turn\
    \ : turn -> turn\nlet flip_turn t =\nmatch t with 0 -> X | X -> 0\n```\n\nWhat\
    \ should the type of the game be? Each node contains a list of turn elements representing\
    \ the board, and a list of zero or more trees representing the game result from\
    \ each possible move. Since the list can have zero elements, we need no leaf constructor:\n\
    \ntype tree = Move of turn list * tree list\n\nNow we may construct the main function.\
    \ Our job is to build, given a turn (X or O) and the current board, the tree that\
    \ starting at that board. If the board has won by either, the list of next nodes\
    \ is empty, and the recursion stops. If not, we calculate the empty positions,\
    \ build a new board with each empty position filled with the current turn, and\
    \ then next_moves over each of those.\n\n```\nnext_moves : turn -> turn list ->\
    \ tree\nlet rec next_moves turn board =\nlet next =\n if\n won (List.map (( =\
    \ ) 0) board) ||\n won (List.map (( = ) X) board)\nthen\n []\nelse\n List.map\n\
    \  (next_moves (flip_turn))\n  (List.map (replace turn board) (empty board))\n\
    in\n Move (board, next)\n```\n\nNote that the recursion stops when a board is\
    \ full (drawn) because empty returns the empty list in this case. Now we can build\
    \ the game tree itself, which might take a second or so:\n\n```\ngame_tree : tree\n\
    let game_tree =\nnext_moves 0 [E; E; E; E; E; E; E; E; E]\n```"
