    # Chapter 9. Searching for Things


    ```

    search : string -> string -> bool

    let rec search p s =

    String.length p <= String.length s

    &&\nString.sub s 0 (String.length p) = p ||

    search p (String.sub s 1 (String.length s - 1))

    ```


    This time, there is no problem with String length, since, unlike List.length,
    it runs in constant time. We do have the overhead of the first String.sub, analogous
    to the Util.take in the version. The second String.sub is also a problem, unlike
    List.tl, it creates a new string.


    To solve this, we can define an auxiliary function at which, given pattern, string
    s and the length l to test, with the position in the pattern p and in the main
    string sp, tests for equality. This is similar to equal in our list examples


    ```

    at : string -> int -> string -> int -> bool

    search'' : int -> string -> string -> bool

    search'' : string -> string -> bool

    let rec search'' at p pp sp l =

    l = 0 || p.[pp] = s.[sp] && at p (pp + 1) s (sp + 1) (l - 1)

    let rec search'' n p s =

    String.length p <= String.length s - n

    &&

    (at p 0 n (String.length p) || search'' (n + 1) p s)

    let search = search'' 0

    ```


    The search'' function itself has a counter for how far along the main string it.
    We initialize this to zero in search.


    # More flexible searches


    We can make our searching function more interesting by allowing the use of some
    special characters. We will introduce only these simple constructs:


    +   * A ? matches zero or one instances of the following character. For example,
    the pattern ?abc matches ab, bc, and dbc;

    * A * character matches zero or more instances of the following character. So,
    the pattern *abc matches bc, abc, and aabc;

