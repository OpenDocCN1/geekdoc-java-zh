  - "[PAGE 14]\n\n# Chapter 1\n\n# Unravelling “Fold”\n\nThe **List** module in OCam's\
    \ Standard Library defines twoにつき-named functions over lists:\n\n```\nfold_left\
    \ : (α → β → α) → α → β list → α\nfold_right : (α → β → β) → α list → β → β\n\n\
    let rec fold_left f a =\n  match l with\n  | [] -> a\n  | h:t -> fold_left f (f\
    \ a h) t\n\nlet rec fold_right f a =\n  match l with\n  | [] -> a\n  | h:t ->\
    \ f h (fold_right f t a)\n```\n\nWhat do they do? And why are they considered\
    \ important enough to include in the Standard Library? As we see, they abstract\
    \ the idea of recursion over lists with a custom as most delightfully generic\
    \ way.\n\nLet us examine fold_left and its rather complicated type. The first\
    \ argument is a function, which takes the existing accumulator and an element\
    \ from the input list, combines them in some fashion, and returns a new accumulator,\
    \ for the next element. So, in general, the first argument has type α → β → α.\
    \ We then have an initial value for the accumulator, which must have type α, and\
    \ an input list of type β list. The return value is the final accumulator, so\
    \ that must have type α. We can annotate the function as:\n\n| fold_left : (α\
    \ → β → α) → α → β list → α | function, initial accumulator, input list |\n| let\
    \ rec fold_left f a = match l with |\n| [] -> a | no input – return the accumulator\
    \ |\n| h:t -> fold_left f (f a h) t | apply function to a and h, making new a\
    \ |"
  - "[PAGE 15]\n\n# Chapter 1. Unravelling “Fold”\n\nWe can find the sum of a list\
    \ of lists:\n\n```\nfold.left ( ) 0 [1; 2; 3]\n==> fold.left ( ) 1 [2; 3]\n==>\
    \ fold.left ( ) 3 [6]\n==> 6\n```\n\nHere, $\\alpha$ and $\beta$ are both int.\
    \ The function ( ) has the right type, and we use for the initial accumulator\
    \ the identity element for int ( ) which is 0 for all $x$, $x+0=x$ (we cannot\
    \ take the initial accumulator from the list unless our function must have a result\
    \ for the sum of all the integers in an empty list).\n\nIt might appear to the\
    \ reader that this is more complicated than the simple recursive solution, but\
    \ to the experienced functional programmer, using fold.left is easier to read.\
    \ Let us find the maximum number in a list using fold.left:\n\n```\nfold.left\
    \ max.int [2; 4; 6; 0; 1]\n==> fold.left max 2 [4; 6; 0; 1]\n==> fold.left max\
    \ 4 [6; 0; 1]\n==> fold.left max 6 [0; 1]\n==> fold.left max 6 [1]\n==> 6\n```\n\
    \nHere max the built-in function for finding the larger of two things, and min_int\
    \ is the built-in value of the smallest possible integer. We can use a similar\
    \ scheme to define functions on lists of booleans:\n\nall : bool list -> bool\n\
    any : bool list -> bool\n\nlet all l = fold_left ( && ) true l\n\nlet any l =\
    \ fold_left ( || ) false l\n\nThe all function is true only if all items in the\
    \ list are true; the any function if at least one is. What can happen when $\\\
    alpha$ and $\beta$ are different? By making the accumulator a list too? We can\
    \ use List.mem to turn an arbitrary list into a set by consulting the existing\
    \ accumulator before putting an in element:\n\n```\nsetify : alpha list -> alpha\
    \ list\n\nlet setify l =\nfold_left (fun a e -> if List.mem e a then a else e\
    \ :: a) [] l\n```\n\nWe are using List.mem to decide whether to add each element\
    \ to the accumulator or discard it."
