    # Chapter 10. Finding Permutations


    ```

    swap : α array → int → int → unit

    sort_subarray : α array → int → int → unit


    let swap arr a b =

    let t = arr.(a) in

    arr.(a) <- arr.(b);

    arr.(b) <- t


    let sort_subarray arr o l =

    let sub = Array.sub arr o l in

    Array.sort compare sub;

    Array.blit 0 arr o l

    ```


    Now we are ready to write next_permutation:


    ```

    next_permutation : α array → α array

    let next_permutation arr_in =

    let arr = Array.copy arr_in in

    let f = first arr in

    let c = last arr f in

    swap arr f c;

    sort_subarray arr (f + 1) (Array.length arr - f);

    arr

    ```


    We define a predicate for non-increasing-ness:


    ```

    non_increasing : α array → bool

    let non_increasing arr =

    Array.length arr <= 1 ||

    let r = ref true in

    for x = 0 to Array.length arr - 2 do

    if arr.(x + 1) > arr.(x) then r := false

    done;

    !r

    ```


    And, finally, we are finished:'
  - "[PAGE 90]\n\n# Chapter 10. Finding Permutations\n\n```\nall_permutations : α\
    \ array → α array array\n\nlet all_permutations arr =\n  let copy = Array.copy\
    \ arr in\n  Array.sort compare copy;\n  let perm = ref copy in\n  let perms =\
    \ ref [copy] in\n  while not (non_increasing !perm) do\n    perm := next_permutation\
    \ !perm;\n    perms := !perm :: !perms;\n  done;\n  Array.of_list (List.rev !perms)\n\
    ```\n\nNote that this imperative algorithm works correctly with repetitions of\
