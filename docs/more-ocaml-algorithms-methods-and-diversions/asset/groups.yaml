    and then all at once.

    First, the main part. Given an object we wish to produce its string, assuming
    that string.of_array, string.of_dictionary, and string.of_stream exist:


    ```

    string_of_pdfobject : Pdf.pdfobject -> string


    let rec string.of_pdfobject obj =

    match obj with

    |Pdf.Boolean b -> string.of.bool b

    |Pdf.Integer i -> string.of.int i

    |Pdf.Float f -> string.of.float f

    |Pdf.String s -> "(" ^ s ^ ")"

    |Pdf.Name n -> n

    |Pdf.Array a -> string.of.array a

    |Pdf.Dictionary d -> string.of.dictionary d

    |Pdf.Stream (dict, data) -> string.of.stream dict data

    |Pdf.Indirect i -> Printf.sprintf "%i 0 R" i

    ```


    The cases are all simple, except for the ones we have put to be implemented separately.
    Strings must be put between parentheses, indirect references are printed as 2
    0 R etc.

