    \ lazy list representing this sequence.\n\n# Chapter 3. Named Tuples with Records\n\
    \nTuples can be used to combine a fixed number of elements of same or differing\
    \ types. However, once we have more than two or three items, remembering the order\
    \ can be difficult, especially. Records remedy this, allowing us to name each\
    \ item. Due to this naming, they have several useful properties which distinguish\
    \ them from tuples. Let us define a simple type for cartesian coordinates in two\
    \ dimensions:\n\n```ocaml\ntype point = {x : float; y : float};\n```\n\nRecords\
    \ are like tuples with labels. We write them between braces { }. Each element\
    \ of the record (called a field) has a name and a type, and the fields are separated\
    \ by semicolons. We can construct a value of this type using the same syntax,\
    \ but with equals sign instead of colons:\n\n```ocaml\nlet p = {x = 4.5; y = 6.0};\n\
    ```\n\nWe can add another field to the record, a label for the point:\n\n```ocaml\n\
    type point = {x : float; y : float; label : string};\n```\n\nWe can parametrize\
    \ it like a list or variant type:\n\n```ocaml\ntype 'a point = {\n  x : float;\n\
    \  y : float;\n  label : string;\n  content : 'a\n}\n```\n\nSo now we can have\
    \ values of type int point and string and on. We can define one directly:\n\n\
    ```ocaml\nmake_point : float -> float -> string -> int list point\nlet p = {x\
    \ = 4.5; y = 6.0; label = \"P\"; content = [1; 3; 1]}\n\nlet make_point x y l\
    \ c = {x; y; label = l; content = c}\n\nNotice that we frequently write something\
    \ like x = x in a record definition, and in make_point this can be shortened to\
    \ just x, and by doing so for all the arguments in make_point we obtain this simpler\
    \ definition:\n\n```ocaml\nmake_point : float -> float -> string -> 'a -> 'a point\n\
    let make_point x y label content = {x; y; label; content}\n```\n\nHaving built\
    \ record values, we now need to know how to extract the individual parts. We can\
    \ use the dot notation, writing record.field like so:\n\n```ocaml\nstring_of_point\
    \ : α point -> string\nlet string_of_point p =\n  \"(\" ^ p.label ^ \", \" ^ p.y\
    \ ^ \")\"\n```\n\nAlternatively, we can use record syntax in patterns, in the\
    \ argument itself:\n\n```ocaml\nstring_of_point : α point -> string\nlet string_of_point\
    \ {label = l; x = x; y = y} =\n  (\"(\" ^ x ^ \", \" ^ y ^ \")\"\n```\n\nNotice\
    \ we only had to include the parts of the record we intended to use. This can,\
    \ optionally, be made explicit by adding the wildcard _ to the pattern:\n\n```ocaml\n\
    string_of_point : α → string\nlet string_of_point {label = l; x = x; y = y; _}\
    \ =\n  \"(\" ^ x ^ \", \" ^ y ^ \")\"\n```\n\nFinally, we can use the shorthand\
    \ record form in patterns to:\n\n```ocaml\nstring_of_point : α point -> string\n\
    let string_of_point {label; x; y; _} =\n  \"(\" ^ x ^ \", \" ^ y ^ \")\"\n```\n\
    \nWhen we need a copy of a record with one or more fields changed, we can use\
    \ the **with** keyword:\n\n```ocaml\nrelabel : α point -> string → α point\nlet\
    \ relabel p l = {p with label = l}\n```\n\nAgain, the shortened form can help:\n\
    \n```ocaml\nrelabel : α point -> string → α point\nlet relabel p label = {p with\
    \ label}\n```\n\nHere is a function to reflect a point about the line x = y:\n\
    \n```ocaml\nmirror : α point → α point\nlet mirror p = {p with x = p.y; y = p.x}\n\
    ```\n\n# Mutable records\n\nIndividual fields of a record can be made mutable\
    \ (their value may be changed – literally mutated), by use of the `mutable` keyword:\n\
    \n```ocaml\ntype 'a point = {\n  x : float;\n  y : float;\n  label : string;\n\
    \  mutable content : 'a\n}\n```\n\nIn fact, OCaml's reference type is just a record\
    \ with a single, mutable field:\n\n```ocaml\n(* let x = ref 0;\n   : int ref =\
    \ { contents = 0 } *)\n```\n\nHere, the type of `ref` is defined by `type` `'a\
    \ ref = {mutable contents : 'a}` and the constructor function is of type `α ->\
    \ α ref`. The value of a mutable field can be updated using the `<-` symbol like\
    \ this:\n\n```ocaml\n(* type 'a point = {x : float; y : float; label : string;\
    \ mutable content : 'a};\ntype 'a point =\n  x : float;\n  y : float;\n  label\
    \ : string;\n  mutable content : 'a;\n}\n\nlet let p = {x = 4.5; y = 6.0; label\
    \ = \"P\"; content = [1; 3; 1]};\nval p : int list point = {x = 4.5; y = 6.; label\
    \ = \"P\"; content = [1; 3; 1]}\n\np.content <- [1];\n: unit = ()\n\np;\n: int\
    \ list point = {x = 4.5; y = 6.; label = \"P\"; content = [1]} *)\n```\n\nSuch\
    \ records should be used with care, like any mutable feature, especially if they\
    \ are likely to be used as part of a larger data structure.\n"
  mdcn: "\n\n# 第 2 章 懒惰性\n\n```ocaml\nlmap : (α -> β) → α lazylist → β lazylist\n\
