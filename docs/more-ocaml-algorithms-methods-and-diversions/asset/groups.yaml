    \nlet filled () =\n  let a = Array.make 100 \"x\" in\n  fill a \"v\" -length:20\
    \ -start:40;\n  a\n```\n\n在第三个中，我们展示了标记参数可以相对于其他参数进行交换和重新排列（未标记的参数在彼此之间必须保持正确的顺序）。\n\
    \n我们可以将一个标记参数设为可选。例如：\n\n```\nsplit : α list -> ?length:int -> α list\nlet split\
    \ l length =\n  match length with\n  | None -> l\n  | Some len -> ...\n```\n\n\
    我们可以将多个标记参数设为可选：\n\n```\nsplit : α list -> ?start:int -> ?length:int -> α list\n\
    let split l start length =\n  match (start, length) with\n  | (Some s, Some l)\
    \ -> ...\n  | (Some s, None) -> ...\n  | (None, Some l) -> ...\n  | (None, None)\
    \ -> ...\n```\n\n我们可以让所有标记参数都是可选的：\n\n```\nfill : α array -> ?start:int -> ?length:int\
    \ -> α -> unit\n```\n\n在第一个函数中，我们调用 `filled` 函数时引用了标签：\n\n```aml\nlet filled ()\
