    \ 和 `Hashtbl.iter` 函数可以很容易构建出与我们的签名匹配的实现，如图 11-2 所示。\n\n哈希表的缺点是它们是变的，因此像插入这样的操作会改变结构。这意味着\
    \ `insert` 的结果改变了集合而不是创建一个新集合。这意味着技术上满足了 `SetType` 接口，但预期的抽象实际上被破坏了。这就是可变性。然而，我们在基准测试中的性能是显而易见的：\n\
