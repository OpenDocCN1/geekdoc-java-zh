    \n```ocaml\nread_word : input -> string option\nread_words : input -> string list\
    \ -> string list\nlowercase : string -> string list\n\nlet read_word i =\n  try\
    \ Some (collect_characters (Buffer.create 20) i)\n  with End.of_file -> None\n\
    \nlet rec read_words i a =\n  match read_word i with\n    None -> List.rev (List.map\
    \ lowercase a)\n    | Some w -> read_words i (w :: a)\n```\n\n### A type for outputs\n\
    \nWhat do we need for a generic output? We must have an output_char function to\
    \ write a single character, at least. It is also useful to have an output_channel_length\
