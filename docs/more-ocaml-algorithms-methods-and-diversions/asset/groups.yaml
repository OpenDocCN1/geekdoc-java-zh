    # # 11. Making Sets


    # # Questions


    +   1. Compare our set representations with regard to the amount of memory required
    to create and store them. You can use the functions from the Gc module OCaml’s
    Standard Library to find out how many words of memory have been allocated before
    and after allocating a large set in each set representation.


    +   2. Write functions (naive if necessary) to perform the “union” operation on
    sets in each representation. The union of two sets is the set of elements present
    in one or the other or both of them. After the operation, both inputs should still
    be available as sets.


    +   3. OCaml has a built-in Set module. It uses advanced module syntax not discussed
    here, but you can build a module for manipulating sets of integers like this:

    ```ocaml

    module S = Set.Make (struct type t = int let compare = compare end)

    ```

    This new module S provides, amongst others, a type t for sets, and add, elements,
    mem, empty, and cardinal functions, whose definitions you can find in the OCaml
    manual. Use these functions to build a set module with a similar interface to
    ours. Comment on its speed for our examples.


    +   4. We can save memory in the definition of Red-Black trees by having two different
    Br nodes, one for Red and one for Black, instead of storing the colour. Implement
    this. How much memory is saved? How much extra complexity is there in the source
    code?'
