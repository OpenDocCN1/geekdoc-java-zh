  - "[PAGE 76]\n\n# Chapter 9\n\n# Searching for Things\n\nHow do we look for a sequence\
    \ in another, longer sequence? Suppose we want to write a function search_list\
    \ which, given the list p (the pattern) to search for in the list l determines\
    \ if it exists if it is (i.e. a sub-list). For example, the list [1; 2] is found\
    \ in [2; 1; 2] but not in [2; 1]. A list p is defined to be a sub-list of l if\
    \ there exists x and y that l = x @ @ y. One, two, three, or four of x, p, y,\
    \ l can be the empty list, of course. So, for example, [] is a sub-list of [1;\
    \ 2; 3] and of []. A list p is a sub-list of l:\n\n+   * The length of p is less\
    \ than equal to the length of l and either\n* The sub-list of p is found at the\
    \ beginning of l, or\n* The sub-list of p is a sub-list of the tail of l\n\nWe\
    \ can write this out easily, using the take and drop functions from our Util module,\
    \ described on page xiii:\n\n```\nsearch_list : α list → list → bool\n\nlet rec\
    \ search_list p l =\n    List.length p <= List.length l\n    && Util.take (List.length\
    \ p) = p || search_list p (List.tl l))\n```\n\n(Recall that the || operator does\
    \ not evaluate its right hand side if the left hand side evaluates to true, so\
    \ this function will exit as soon as it finds a match) might be worried about\
    \ the call .tl failing, if l is empty, the pattern must be from the first test,\
    \ and the condition with Util.take would have succeeded already. You can see that\
    \ there are two inefficiencies here, the use of List.length on p and l each time\
    \ around, and the explicit cost of building the list to check the pattern against\
    \ Util.take. Let us remove the first one:"
