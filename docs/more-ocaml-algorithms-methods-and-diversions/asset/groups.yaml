    \      loop (i + 1)\n    else ()\n  in\n  loop 0\n\nbits_string_of_bits : string\
    \ -> string\nlet bits_string_of_bits s =\n  let b = Buffer.create (String.length\
    \ s) in\n  (* implementation omitted ... *)\n```\n\n# Fax explained\n\nThe reason\
