    1 2 0 R]\n- 3. PDF files can contain arbitrary objects... Design a way of representing\
    \ items of the following type using one or more PDF objects:\ntype tree = Lf |\
    \ Br of tree * int * tree\n- 4. Write a function of type pdfobject -> pdfobject\
    \ which, given an object, replaces the value of any dictionary entry with key\
    \ /Rotate to 90.\n"
