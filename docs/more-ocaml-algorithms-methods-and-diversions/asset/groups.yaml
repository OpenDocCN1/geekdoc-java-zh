    # Chapter 7. Labelled and Optional Arguments


    ```

    let divide x y = x / y

    ```


    We can use partial application to write the function which divides ten thousand
    by each number in a list:


    ```

    let f = divide 10000 in [f 100; f 50; f 20]

    ```


    This yields [100; 200; 500]. But we cannot re-use the write function which divides
    each number in a list by this would involve partially applying the second argument
    y. The design of the divide function has baked in which argument may be partially
    applied (OCaml we can partially apply any prefix of the arguments – the first,
    first and second, first and third etc.). For example, we can apply the same function
    to many lists, using a partially applied List.map but we cannot apply arguments
    to a single list by providing the list to List instead. In our example, we can
    label the arguments to our divide function:


    ```

    let divide -x -y = x / y

    ```


    The type of the function reflects this:


    ```

    OCaml

    # divide -x -y = x / y;;

    val divide : x:int -> y:int -> int = <fun>

    ```


    Now we may apply the arguments in their order:


    ```

    OCaml

    # let f = divide -x:10000 in [f 100; f 50; f 20];

    : int list = [100; 200; 500];

    # let f = divide -y:10000 in [f 100000; f 10000; f 1000];

    : int list = [10; 1; 0]

    ```


    We can in, fact, omit the labels if we are applying arguments in order:


    ```

    OCaml

    # let f = divide 10000 in [f 100; f 50; f 20];

    : int list = [100; 200; 500]

    ```


    # Optional arguments


    OCaml also allows us to make a labelled argument optional – that is to say, we
    need not supply it at all.

    The function which is is called without one or more of its arguments can decide
    what to do. Consider this'
