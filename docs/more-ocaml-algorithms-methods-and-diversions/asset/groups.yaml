    \ possible games is 131184 + 77904 + 46080 = 255168. We can check this by writing\
    \ a function to find the terminal nodes:\n\n```\nterminals : tree -> int\nlet\
    \ rec terminals (Move (b, bs)) =\n  (if bs = [] then 1 else 0) +\n  List.fold.left\
    \ (+) 0 (List.map terminals bs)\n```\n\nThis gives 255168 too."
