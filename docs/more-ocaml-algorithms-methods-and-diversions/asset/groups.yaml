  md: "\n## Chapter 3. Named Tuples with Records\n\n## Questions\n\n- 1. Show how\
    \ to update a reference without using the := operator.\n2. Using functions from\
    \ the “Time Functions” section of the documentation to the Unix module, write\
    \ a program which, when run, returns a string containing the time and date, for\
    \ example “It is 2:45 on Wednesday 8 January 2014”.\n3. What is the difference\
    \ between type t = {x : int ref} and type t = {mutab x : int}? What are the advantages\
    \ and disadvantages of each?\n4. Define a record of six items, a–f where a and\
    \ b have the same type as one another, c and d have the same type as one another\
    \ and e and f have the same type as one another.\n5. Records are used in the module\
    \ GC which controls OCaml’s garbage collector (a garbage collector is a system\
    \ which automatically reclaims space the program has finished with as the program\
    \ is running). Use the data structures and functions in the GC module to write\
    \ programs which:\n   (a) write a summary of the state of the garbage collector\
    \ to a text file;\n   (b) alter the verbosity of the garbage collector as defined\
    \ in the control record.\n\n## Chapter 4\n\n## Generalized Input/Output\n\nIn\
    \ *Pervasives*, OCaml's default always-opened module, a number of functions are\
    \ defined over input and output *channels* – representing both files in the file\
    \ system and special ones such as standard output. However, it is often useful\
    \ to have a more general abstraction of input and output over, for example, strings\
    \ and arrays, or channels.\n\nIn this chapter, we shall develop such an abstraction,\
    \ giving input and output types which work with OCaml channels and strings. It\
    \ can be extended to work over other data structures, and to have complete functionality\
    \ – some of the questions at the end of the chapter involve extensions.\n\n###\
    \ A type for inputs\n\nThe fundamental operations on an input, once it has been\
    \ created, will be:\n\n- finding the current position;\n- setting the current\
    \ position;\n- reading a character, at the same time advancing the position;\n\
    - finding the length of an input.\n\nWe need a way to group them together, and\
    \ to refer to them easily. A record is ideal:\n\n```ocaml\ntype input =\n  {pos_in\
    \ : unit -> int;\n  seek_in : int -> unit;\n  input_char : unit -> char;\n  in_channel_length\
    \ : int}\n```\n\nNow we can build an input from an OCaml **in_channel** easily\
    \ (we have re-used some of the standard OCaml names):\n\n```ocaml\ninput_of_channel\
    \ : in_channel -> input\n\nlet input_of_channel ch =\n  (pos_in = (fun () -> pos_in\
    \ ch);\n   seek_in = seek_in ch;\n   input_char = (fun () -> input_char ch);\n\
    \   in_channel_length = in_channel_length ch)\n```\n\nNotice that the original\
    \ channel is now hidden inside the input – the functions pos_in and input_char\
    \ instead simply take the () as their input. Let us assure that this structure\
    \ also works for abstracting over strings:\n\n```ocaml\ninput_of_string : string\
    \ -> input\n\nlet input_of_string s =\n  let pos = ref 0 in\n  (pos_in = (fun\
    \ () -> !pos);\n   seek_in =\n    (fun p ->\n      if p < 0 then\n        raise\
    \ (Invalid.argument \"seek before beginning\")\n      pos := p);\n   input_char\
    \ = (fun () ->\n     if !pos > String.length s - 1\n     then raise End.of_file\n\
    \     else (let c = s[!pos] in pos := !pos + 1; c));\n   in_channel_length = String.length\
    \ s)\n```\n\nWe allocate a local reference, to hold the current position. The\
    \ pos_in and in_channel_length functions are simple. The seek_in function needs\
    \ to check that the position is positive, but also it is better to be the end,\
    \ for compatibility with OCaml channels. The input_char function checks it is\
    \ not trying to read beyond the end, reads a character, advances the position,\
    \ and returns the character.\nNotice we use the same exception as OCaml does in\
    \ its own channels – raising End.of_file if a read is attempted beyond the last\
    \ character.\n\n### Example: reading words\n\nWe would like to write a program\
    \ which can extract the words from a given input, such as a string or a file.\
    \ For example, given the string\n\n> \"There were four of them; more than before.\"\
    \n\nwe wish to produce\n\n- [\"there\"; \"were\"; \"four\"; \"of\"; \"them\";\
    \ \"more\"; \"than\"; \"before\"]\n\nremoving spaces, punctuation and making the\
    \ words lower case. First, let us define a function to rewind the input by one\
    \ character (useful when we read a character and decide we do not consume it),\
    \ and another, a predicate to determine if a character is considered a non-letter,\
    \ and thus it may be skipped:\n\n```ocaml\nrewind : input -> unit\nnon_letter\
    \ : char -> bool\n\nlet rewind i =\n  i.seek_in (i.pos_in i - 1)\n\nlet is_non_letter\
    \ x =\n  match x with\n  | '\\'' | '(' | ')' | ',' | '_' | '-' | ';' | ':' ->\
    \ true\n  | _ -> false\n```\n\nNow, we can write a function skip_characters to\
    \ skip punctuation from the current point. It may raise End.of_file, of course.\
    \ Then, the function collect_characters, which with a fresh Buffer and an input\
    \ which has been processed by skip_characters, returns the string containing the\
    \ next sequence of interesting characters, or raises End.of_file if we are at\
    \ the end of the input:\n\n```ocaml\nskip_characters : input -> unit\ncollect_characters\
    \ : input -> string\n\nlet rec skip_characters i =\n  if is_non_letter (i.input_char\
    \ i ())\n  then skip_characters i\n  else rewind i\n\nlet rec collect_characters\
    \ b i =\n  match\n    try Some (i.input_char i ()) with End.of_file -> None\n\
    \    with None -> Buffer.contents b\n    | Some c ->\n      if is_non_letter c\n\
    \      then Buffer.contents b\n      else (Buffer.add_char b c; collect_characters\
    \ b i)\n```\n\nFinally, we can write read_word, which finds the next word, if\
    \ there is one. Then, read_words collects them all in a list, and turns them in\
