    \ functions such as List.map over the boards, at the cost of little elegance,\
    \ we will use a list of length nine instead—we need to terminate the tree when\
    \ X won, O has, or the board is full. Thus we will need to check all rows, columns,\
    \ and diagonals. We do not want to replicate the logic several times or build\
    \ a huge pattern match.\n\n| 1 | 2 | 3 |\n|---|---|---|\n| 4 | 5 | 6 |\n| 7 |\
    \ 8 | 9 |\n\nNow, we can use functions from the List module to write a function\
    \ to return the numbers of the positions which are currently empty:\n```ocaml\n\
    empty : turn list -> int\nlet empty b =\n  List.map snd\n  (List.filter (fun (_,\
    \ _) -> t = E)\n  (List.combine b [1; 2; 3; 4; 5; 6; 7; 9]))\n```\nThis works\
    \ by building the list of tuples [(X; 1); (E; 2); (E; 3) ... (0; 9)], filtering\
    \ out any which are not empty, and extracting the list of empty positions [2,\
    \ 3 ...]. It is also simple to write a function which, given a board [E; E; E;\
    \ X; E; 0], a turn list and a number such as 8, will fill in the correct slot\
    \ in the board [E; E; E; X; E; X]. The take and drop functions from our Util module\
    \ (described on page xiii) are ideal:\n\n```ocaml\nreplace : turn list -> int\
    \ -> turn list\nlet replace turn board p =\n  Util.board (p - 1) @ [turn] @ Util.board\
    \ p\n```\nOne more simple function is required before we can write the main tree-building\
    \ function, and that is change whose turn it is:\n```ocaml\nflip_turn : turn ->\
    \ turn\nlet flip_turn t =\n  match t with 0 -> X | X -> 0\n```\nWhat should the\
    \ type of the game be? Each node contains a list of turn elements representing\
    \ the board, and a list of zero or more trees representing the game result from\
    \ each possible move. Since the list can have zero elements, we need no leaf constructor:\n\
    ```ocaml\ntype tree = Move of turn list * tree list\n```\nNow we may construct\
    \ the main function. Our job is to build, given a turn (X or O) and the current\
    \ board, the tree that starting at that board. If the board has won by either,\
    \ the list of next nodes is empty, and the recursion stops. If not, we calculate\
    \ the empty positions, build a new board with each empty position filled with\
    \ the current turn, and then next_moves over each of those.\n\n```ocaml\nnext_moves\
    \ : turn -> turn list -> tree\nlet rec next_moves turn board =\n  let next =\n\
    \    if\n      won (List.map (( = ) 0) board) ||\n      won (List.map (( = ) X)\
    \ board)\n    then\n      []\n    else\n      List.map\n        (next_moves (flip_turn))\n\
    \        (List.map (replace turn board) (empty board))\n  in\n  Move (board, next)\n\
    ```\nNote that the recursion stops when a board is full (drawn) because empty\
    \ returns the empty list in this case. Now we can build the game tree itself,\
    \ which might take a second or so:\n```ocaml\ngame_tree : tree\nlet game_tree\
    \ =\nnext_moves 0 [E; E; E; E; E; E; E; E; E]\n```\n"
  mdcn: "\n\n## 第 11 章 制作集合\n\n## 哈希表\n\n哈希表是一种设计用于极快速访问集合和映射的数据结构。它持有一组从 0...n 的桶（buckets）。当我们向集合中插入一个值时，该值会通过哈希函数进行处理并被分配到一个桶中，这种分配方式使得值在各个桶之间大致呈均匀分布。当我们需要测试某个元素的成员性时，可以使用相同的哈希函数，且无论集合中有多少项，查找时间都是常数级的。\n\
    \n例如，如果哈希函数为 $x \\rightarrow x \\mod 23$，且要插入的值为 34, 2, 6, 7, 3, 4, 84, 1467,\
    \ 7432, 48，那么对应的桶将为 11, 22, 21, 3, 4, 15, 18, 3, 1。对 67 的成员性测试包括应用哈希函数，然后在桶 21\
    \ 中搜索 67 是否存在。\n\nOCaml 标准库在 `Hashtbl` 模块中提供了哈希表的实现。对于集合哈希表，我们使用从 $\\alpha$ 映射到\
