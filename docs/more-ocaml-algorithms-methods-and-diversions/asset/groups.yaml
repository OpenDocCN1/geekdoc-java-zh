    \n```ocaml\nmember : 'a list -> bool\nlet member x l =\n  List.fold_left (fun\
    \ a e -> e = x || a) false l\n```\n\nNote that this is less efficient than List.mem\
    \ because there is no early exit – the whole list is processed in every case.\n\
