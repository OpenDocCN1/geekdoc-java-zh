    \ SetType end =\nstruct\n  type 'a t = ('a, unit) Hashtbl.t\n\n  let list_of_set\
    \ s =\n    Hashtbl.fold (fun x l -> x :: l) s []\n\n  let set_of_list l =\n  \
    \  s = Hashtbl.create (List.length l) in\n    List.iter (fun x () -> Hashtbl.add\
    \ s x ()) l;\n    s\n\n  let member x s = Hashtbl.mem s x\n\n  let insert x s\
