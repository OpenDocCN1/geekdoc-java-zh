    # Binary Search Trees


    A binary search tree is a binary tree with the property that all elements in the
    left sub-tree of each node are smaller than it, and all elements in the right
    sub-tree are larger. If the tree is reasonably well balanced, we can reach any
    element in time proportional to the logarithm of the number of elements in the
    set.


    Just like the representation of sets, there are multiple representations of sets,
    depending on the order of insertion of the elements. Here are the trees corresponding
    to the insertion orders 123, 132, 213, 231, 312, 321:


    ![](img/412ff6f522cd6d58bb984724b97d22e6_96_0.png)


    We can see that when the items in the set are added in numerical or reverse-numerical
    order, this data structure is equivalent to, and has no better performance, than
    a simple list. The data type is the usual one for binary trees.


    ```

    type ''a t = Lf | Br of ''a t * ''a * * ''a t

    ```


    The SetTree module is shown in Figure 11.3.


    When the tree is balanced insert and member run in logarithmic time. since it
    must visit every node irrespective of the balance. The same is true of list..of..set.
    When unbalanced, insert and member take linear time. We can extend our table now:'
  - "[PAGE 97]\n\n# Chapter 11. Making Sets\n\n```\nmodule SetTree : sig include SetType\
    \ end =\nstruct\n  type 'a = Lf | Br of 'a * 'a * 'a\n\nlet rec list_of_set s\
    \ =\n  match s with\n    Lf -> []\n    | Br (l, x, r) -> list_of_set l [x] @ list_of_set\
    \ r\n\nlet rec insert x s =\n  match s with\n    Lf -> Br (Lf, x, Lf)\n    | Br\
    \ (l, y, r) ->\n      if x = y then Br (l, y, r)\n      else if x < y then Br\
    \ (insert x, y, r)\n      else Br (l, y, insert x r)\n\nlet rec set_of_list l\
    \ =\n  match l with\n    [] -> Lf\n    | h::t -> insert h (set_of_list t)\n\n\
    let rec size s =\n  match s with\n    Lf -> 0\n    | Br (l, _, r) -> 1 + size\
    \ l + size r\n\nlet rec member x s =\n  match s with\n    Lf -> false\n    | Br\
    \ (_, y, _) when x = y then true\n    | Br (l, y, r) -> if x < y then member x\
    \ l else member x r\nend\n```\n\nFigure 11.3"
