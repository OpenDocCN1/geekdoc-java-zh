    # Chapter 12


    # Playing Games


    The childhood game of Noughts and Crosses is a combinatorial problem of a large
    but manageable size. Let us review the rules, and then see if we can build the
    game tree (that is, a structure describing all possible games), and draw some
    statistics from it.


    A 3-by-3 grid is constructed. Two players (O and X) take turns, beginning with
    O, to place their piece in an empty space. The game is won if or when a player
    forms three pieces in a row, column, or diagonally. The game is drawn if the board
    is full and no such pattern has been formed. For example, on this board, player
    O wins, building a diagonal:


    | X | O |

    |---|---|

    | X | O | X |

    | O | X | O |


    Let us consider the shape of the game tree. Clearly, at the top level, it will
    branch many times, once O can be placed in any square. Then eight ways, seventy
    and so on. Once we reach the fifth level, some of the games have been won (since
    three pieces from player O may form a line), and the number of branches will be
    reduced. The tree must end after nine levels, since the board must be least, even
    if no one has won. A fragment of the game tree is shown in Figure 12.1. Let us
    begin to construct the program. We will need a type to represent X, and O the
    empty square:


    ```

    type turn = 0 | X | E

    ```


    It would be natural to use a n-tuple, since the board is of a fixed size. Then,
    though we lose the ability to use the standard list-processing functions such
    as List.map over the boards, so, at the cost of a little inelegance, we will use
    a list of length nine instead—in order we turn list.


    We need to terminate the tree when X won, O has, or the board is full. Thus we
    will need to check all the rows, columns, and diagonals. We do not want to replicate
    the logic several times or build a huge pattern match, so it is easiest to write
    a function that takes a list of nine booleans and just checks for lines of true.
    We can then use List.map on the board itself to build these intermediate lists
    of booleans.'
