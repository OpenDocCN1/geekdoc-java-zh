    \ `ABRACADRA`\n- A: 5 次\n- B: 2 次\n- R: 2 次\n- C: 1 次\n- D: 1 次\n\n构建霍夫树后，我们可以得到编码：\n\
    - A: 0\n- B: 110\n- R: 101\n- C: 1110\n- D: 1111\n\n"
