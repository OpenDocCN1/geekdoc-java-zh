    \ =\n  Cons (h, fun () -> lmap f tf)\n\nlet rec lfilter f (Cons (h, tf)) =\n \
    \ if h then\n    Cons (h, fun () -> lfilter f tf)\n  else\n    lfilter f tf\n\
    ```\n\n```ocaml\ncubes : int lazylist\nlet cubes =\n  lfilter\n    (fun x -> x\
    \ mod 5 = 0)\n    (lmap (fun x -> x * x * x) (lseq 1))\n```\n\n现在，使用 `ltake`：\n\
    \n```ocaml\n(* ltake cubes 20;\n: int list =\n[125; 1000; 3375; 8000; 15625; 27000;\
