    get_same : input -> char × int\n\nlet get_same i =\n  let rec getcount ch c =\n\
    \    if c = 128 then 128 else\n      try\n        if i.input.char () = ch\n  \
    \        then getcount ch (c + 1)\n        else (rewind i)\n      with\n     \
    \   End.of_file -> c\n  in\n  let ch = i.input.char () in (ch, getcount ch 1)\n\
