    \ longest_prefix_inner (currpos + 1) currpos p t\n      else\n        longest_prefix_inner\
    \ (currpos + 1) bestlen p t\n\nlet longest_prefix p l =\n  longest_prefix_inner\
    \ 0 0 p l\n```\n\nHere, currpos is the current position, bestpos the position\
