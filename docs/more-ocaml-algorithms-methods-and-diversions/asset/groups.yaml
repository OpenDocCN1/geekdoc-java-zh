    \ in [f 100; f 50; f 20]\n```\n\n这产生了 [100; 200; 500]。但我们无法重用除以列表中的每个数字的除法函数，因为这涉及到部分应用第二个参数\
    \ `y`。`divide` 函数的设计内置了哪些参数可以被部分应用（在 OCaml 中，我们可以部分应用参数的任何前缀——第一个、第一个和第二个、第一个和第三等等）。例如，我们可以使用部分应用的\
    \ `List.map` 将同一个函数应用于许多列表，但我们不能通过将列表提供给 `List` 来将参数应用于单个列表。在我们的示例中，我们可以为 `divide`\
    \ 函数的参数标记：\n\n```\nlet divide -x -y = x / y\n```\n\n函数的类型反映了这一点：\n\n```OCOCaml\n\
    # divide -x -y = x / y;;\nval divide : x:int -> y:int -> int = <fun>\n```\n\n\
    现在我们可以按照它们的顺序应用参数：\n\n```OCaml\n# let f = divide -x:10000 in [f 100; f 50; f 20];\n\
    : int list = [100; 200; 500];\n# let f = divide -y:10000 in [f 100000; f 10000;\
    \ f 1000];\n: int list = [10; 1; 0]\n```\n\n事实上，如果我们按顺序应用参数，我们可以省略标签：\n\n```OCaml\n\
    # let f = divide 10000 in [f 100; f 50; f 20];\n: int list = [100; 200; 500]\n\
    ```\n\n## 可选参数\n\nOCaml 还允许我们将标记参数设为可选的——也就是说，完全不需要提供它。被调用的函数可以不提供该参数。考虑以下函数：\n\
    \n```\nsplit : α list -> int -> α list\n```\n\n如果我们将一个标记参数设为可选，那么就不需要提供它了。\n\n\
    ```\nsplit : α list -> ?length:int -> α list\nlet split l length =\n  match length\
    \ with\n  | None -> l\n  | Some len -> ...\n```\n\n我们可以将多个标记参数设为可选：\n\n```\nsplit\
    \ : α list -> ?start:int -> ?length:int -> α list\nlet split l start length =\n\
    \  match (start, length) with\n  | (Some s, Some l) -> ...\n  | (Some s, None)\
    \ -> ...\n  | (None, Some l) -> ...\n  | (None, None) -> ...\n```\n\n我们可以让所有标记参数都是可选的：\n\
    \n```\nfill : α array -> ?start:int -> ?length:int -> α -> unit\n```\n\n在第一个函数中，我们调用\
    \ `filled` 函数时引用了标签：\n\n```aml\nlet filled () =\n  let a = Array.make 100 \"x\"\
    \ in\n  fill a -start:20 -length:40 \"y\"\n  a\n\nlet filled () =\n  let a = Array.make\
    \ 100 \"x\" in\n  let start = 20 in\n  let length = 40 in\n  fill a -start:st\
    \ -length:ln \"y\"\n  a\n\nlet filled () =\n  let a = Array.make 100 \"x\" in\n\
    \  fill a \"v\" -length:20 -start:40;\n  a\n```\n\n我们可以让一个标记参数设为可选。例如：\n\n```\n\
    split : α list -> ?length:int -> α list\nlet split l length =\n  match length\
    \ with\n  | None -> l\n  | Some len -> ...\n```\n\n我们可以通过给这两个参数加上标签来解决这个问题。\n\n\
    ```\nfill : α array → start:int → length:int -> α -> unit\n```\n\n在第一个函数中，我们调用\
    \ `filled` 函数时引用了标签：\n\n```aml\nlet filled () =\n  let a = Array.make 100 \"x\"\
    \ in\n  fill a -start:20 -length:40 \"y\"\n  a\n\nlet filled () =\n  let a = Array.make\
    \ 100 \"x\" in\n  let start = 20 in\n  let length = 40 in\n  fill a -start:st\
    \ -length:ln \"y\"\n  a\n\nlet filled () =\n  let a = Array.make 100 \"x\" in\n\
    \  fill a \"v\" -length:20 -start:40;\n  a\n```\n\n在第三个中，我们展示了标记参数可以相对于其他参数进行交换和重新排列（未标记的参数在彼此之间必须保持正确的顺序）。\n\
    \n我们可以让函数内部的参数名称也使用标签。这简化了语法：你可以写 `-label`。\n\n```\nfill : α array → start:int\
    \ → length:int → α -> unit\nfilled : unit → string array\n\nlet fill a -start\
    \ - start + length v =\n  for x = start to start + length - 1 do a.(x) <- v done\n\
    \nlet filled () =\n  let a = Array.make 100 \"x\" in\n  let start = 20 in\n  let\
    \ length = 40 in\n  fill a -start -length \"y\"\n  a\n```\n\n你可以看到在 `filled` 中，如果我们恰好有具有相同名称的值，调用函数时的“名称重用”效果同样很好。这两个功能不需要同时使用。\n\
