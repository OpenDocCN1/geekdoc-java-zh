    # 前言


    当我写下《OCaml for the Very Beginning》时，我的意图是写一本不需要先验知识的书——让一个对编程完全陌生的聪明个体也能读懂。由于这一点，出于对长度的考虑，许多有趣的材料被删减了。而本书不受此种限制，包含了各种需要一定函数式语言经验的话题。读过前一本书的人读这本书同样没有问题。对于熟悉
    ML 或 Haskell 等其他语言的函数式程序员来说，它应该是易理解的。读者可能需要偶尔参考 OCaml 手册。


    在编写超过几十行的程序时，通常会有两种活动：首先是处理问题固有的复杂性挑战，寻找合适的抽象机制；其次是寻找并使用提供的各种第三方库。大多数项目涉及这两者的结合。在本书中，我们专注于前者，除了
    OCaml 标准库外没有使用其他。跟无数第三方 OCaml 库是一个更适合其他媒介的任务。


    本书由十六章组成，每章分为三类。有些通过示例介绍了 OCaml 的语法片段。有些概述了如输入/输出等实际话题。有些则涵盖了小趣味或谜题。书的正文结束于一个长篇示例：一个构建包含计算机生成的图形和文本的
    PDF 文件的程序。书中所有问题都有完整的答案和提示，在线资源中还提供了额外材料。


    # 致谢


    第 6 章中的引用摘自 ISO-32000 国际标准。每一章中的代码表取自国际电信联盟 ITU-T T.30。第 11 章中红黑树平衡操作的演示及其函数式实现归功于
    Chris Okasaki，正如其极具价值的著作《Purely Functional Data Structures (Cambridge University
    Press, ISBN 978-0521653502, 1998)》中所述。第 12 章的灵感源自 Lawrence C. Paul 在 1999 年的一道剑桥计算机科学之旅考试题。该章的第
    3 题归于 Peter D. Schumer 的《Mathematical Journeys》(John Wiley & Sons, ISBN-0-471-22086-3,
    2004)。


    我感谢许多与我讨论 OCaml 风格和实质的同事和朋友，包括 Mark Shinwell, Leo White, Daniel Bünzi, Anil Madhavapeddy,
    Stephen Dolan 以及我忘记的许多人。早期草稿的帮助性意见来自 Stefan Schmiedl, Manuel Cornes, Jan Bówłow,
    Emmanuel Delabode, Mario Picasso, Giannis Tsarai 和 André Björn。


    # OCaml 总结


    本章包含了书中其余部分使用的每个 OCaml 语法的总结。现有的 OCaml 程序员可以跳过本章。


    ## 简单数据类型


    整数 int 布尔值 true 和 false 类型 bool。字符 char 字符串位于双引号之间。数学运算符 - * / 作用于两个整数。


    组 (a, b) 用于固定数量的元素，类型 α × β。递归函数以相同的方式引入，使用 :: 符号。


    ## 命名与函数


    将表达式的结果命名为名称 let = 求值。匿名函数 (fun x -> expression) 是函数 → bool。


    # 异常


    定义异常 exception name。它们通过添加 of 来携带额外信息。使用 raise 抛出异常。使用 try ... with ... 处理异常。


    exception Problem of int


    # 模式匹配


    使用 match 表达式匹配模式 pattern1 -> ... | pattern2 -> ... | expression3。表达式 expression2,
    expression3 的类型彼此相同，这是整个 match 的类型。通配符 _ 匹配任何。


    match x

    0 -> 1

    | 1 | 2 -> 3

    | _ -> 4


    一次匹配两个或多个事物，使用逗号分隔，match a, b with b, 0, 0, 0 -> true

    | _, _ -> false


    # 部分应用


    通过提供少于参数数量的参数来实现部分应用。使用构建器的函数进行部分应用。


    let add x y = x + y

    List.map ( 3 ) [1; 2; 3]

    => [4; 5; 6]


    # 列表


    列表是零或多个元素的有序集合，如 type。它们位于方括号之间，元素用冒号分隔：例如 [1; 2; 3; 4]。如果列表非空，它有一个头（head），即第一个元素，和一个尾（tail），即由其余元素组成的列表。


    :: 操作向列表头部添加元素。“连接”运算符 @ 用于连接两个列表。


    1 :: [2; 3] => [1; 2; 3]

    [1; 2] @ [3] => [1; 2; 3]


    # 新类型


    使用新类型 type name = constructor1 of type1 | constructor2 of type2 | ... 。使用内置类型对其进行模式匹配。多态类型。


    type colour =

    Red | Blue | Green | Grey of int

