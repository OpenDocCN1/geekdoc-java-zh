    \ 3; 4; 5; 6; 7; 9]))\n```\n这通过构建元组列表 `[(X; 1); (E; 2); (E; 3) ... (0; 9)]`、过滤掉任何非空的、并提取空白位置列表\
    \ `[2, 3 ...]` 来工作。编写一个函数也是简单的，给定一个棋盘 `[E; E; E; X; E; 0]`、一个列表和一个如 8 的数字，它将填充棋盘\
    \ `[E; E; E; X; E; X]` 中的正确位置。我们 Util 模块（第 xiii 页描述）中的 `take` 和 `drop` 函数是理想的：\n\
    \n```ocaml\nreplace : turn list -> int -> turn list\nlet replace turn board p\
    \ =\n  Util.board (p - 1) @ [turn] @ Util.board p\n```\n在编写主树构建函数之前，还需要一个简单的函数，即切换当前回合：\n\
    ```ocaml\nflip_turn : turn -> turn\nlet flip_turn t =\n  match t with 0 -> X |\
    \ X -> 0\n```\n游戏的类型应该是什么？每个节点包含一个表示棋盘的 `turn` 元素列表，以及一个代表每个可能移动游戏结果的树列表。由于列表可以为空，我们不需要叶子构造函数：\n\
    ```ocaml\ntype tree = Move of turn list * tree list\n```\n现在我们可以构建主函数了。我们的工作是给定一个回合（X\
    \ 或 O）和当前棋盘，构建从该棋盘开始的树。如果棋盘已被一方获胜，则后续节点列表为空，递归停止。如果没有，我们计算空白位置，构建一个每个空白位置都填充了当前回合的新棋盘，然后对这些每一个执行\
