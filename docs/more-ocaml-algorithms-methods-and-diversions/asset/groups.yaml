  md: "\n## Chapter 14\n\n## Writing Documents\n\nWe have built a representation for\
    \ PDF documents to be held in memory, and defined an example document. Now, we\
    \ must build functions to write this file. Recall our example file from the last\
    \ chapter:\n\n```\n%PDF-1.1\n1 0 obj\n<</Type /Page\n/Parent 3 0 R\n/Resources\n\
    <</Font\n<</F0\n<</Type /Font /Subtype Type1 /BaseFont /Times-Italic>>>>>>\n/MediaBox\
    \ [0 595.27590551 841.8897638]\n/Rotate 0 /Contents [4 0 R] >>\nendobj\n2 0 obj\n\
    <</Type /Catalog /Pages 3 0 R>>\nendobj\n3 0 obj\n<</Type /Pages /Kids [1 0 R]\
    \ /Count 1>>\n4 0 obj\n<</Length 53>>\nstream\n1 0 1 50 770 cm /BT /F0 36 Tf (Hello,\
    \ World!) Tj\nendstream\nendobj\nxref\n0 5\n0000000000 05535 f\n0000000015 00000\
    \ n\n0000000200 00000 n\n0000000245 00000 n\n0000000296 00000 n\ntrailer\n<</Size\
    \ 5 /Root 2 0 R>>\n```\n\nstartxref\n397\n%%EOF\n\nIt consists, we remember, of\
    \ a header, then some objects (here, four), and a trailer. We will need four functions:\n\
    \n- 1. The function `string.of_pdfobject` to make a string from a Pdf.pdfobject,\
    \ for example making the string `<</Type /Pages /Kids [1 0 R] >>` from the pdf\
    \ Dictionary `[(/Type\", Name \"Pages\"; /Kids, Array [Indirect 1]); /Count\"\
    , Integer: 1)]`;\n- 2. The function `write_header` to write the header (i.e. everything\
    \ before the objects);\n- 3. The function `write_trailer` to write the trailer\
    \ (i.e. everything after the objects);\n- 4. The main function `pdf_to_file` which\
    \ uses these three functions to write a Pdf to a file under the given name.\n\n\
    The function `string.of_pdfobject` is expressed as a set of mutually-recursive\
    \ functions introduced with the `let rec` construct. To do it as a single function\
    \ is possible, but would be rather large, and harder to read and edit. Let us\
    \ present it piece-by-piece and then all at once.\nFirst, the main part. Given\
    \ an object we wish to produce its string, assuming that `string.of_array`, `string.of_dictionary`,\
    \ and `string.of_stream` exist:\n\n```ocaml\nstring_of_pdfobject : Pdf.pdfobject\
    \ -> string\n\nlet rec string.of_pdfobject obj =\nmatch obj with\n| Pdf.Boolean\
    \ b -> string.of.bool b\n| Pdf.Integer i -> string.of.int i\n| Pdf.Float f ->\
    \ string.of.float f\n| Pdf.String s -> \"(\" ^ s ^ \")\"\n| Pdf.Name n -> n\n\
    | Pdf.Array a -> string.of.array a\n| Pdf.Dictionary d -> string.of.dictionary\
    \ d\n| Pdf.Stream (dict, data) -> string.of.stream dict data\n| Pdf.Indirect i\
    \ -> Printf.sprintf \"%i 0 R\" i\n```\n\nThe cases are all simple, except for\
    \ the ones we have put to be implemented separately. Strings must be put between\
    \ parentheses, indirect references are printed as 2 0 R etc.\nTo build a string\
    \ from an Array, we need to start with an open square bracket, add the string\
    \ for each Pdf.pdfobject in the array (which may be arbitrarily complex, of course),\
    \ and put spaces between them.\nThen we end with a close square bracket:\n\n```ocaml\n\
    string_of_array Pdf.pdfobject list -> string\nlet rec string_of_array a =\n  let\
    \ b = Buffer.create 100 in\n  Buffer.add_string b \"[\";\n  List.iter\n    (fun\
    \ s ->\n      Buffer.add_char b ' ';\n      Buffer.add_string b (string_of_pdfobject\
    \ s))\n    a;\n  Buffer.add_string b \" ]\";\n  Buffer.contents b\n```\n\nIt is\
    \ natural to use the Buffer module from the Standard Library to collect these\
    \ strings together. It is also more efficient than using string concatenation.\
    \ Notice we do not add an initial space after the square bracket, but do before\
    \ the closing square bracket, for symmetry. The `string_of_dictionary` function\
    \ is somewhat similar to:\n\nNow for `string_of_stream`. A stream in PDF is written\
    \ like this:\n\n```\nstream dictionary\nstream\nstream data\nendstream\n```\n\n\
    This is simple with the Buffer module too:\n\n```ocaml\nstring_of_stream : Pdf.pdfobject\
    \ -> string -> string\n\nlet rec string_of_stream dict data =\n  let b = Buffer.create\
    \ 100 in\n  List.iter (Buffer.add_string b)\n    [string_of_pdfobject dict; \"\
    \\nstream\\n\"; data; \"\\nendstream\"];\n  Buffer.contents b\n```\n\nThe code\
    \ for these functions is collected together in Figure 14.1. Now that we can build\
    \ a string from any Pdf.pdfobject, we can proceed to build the `write_header`,\
    \ `write_trailer`, and `write_objects` functions, so that we have everything for\
    \ the final `pdf_to_file` function.\nThe PDF header consists of `%d.%d` where\
    \ `m` and `n` are major and minor numbers. It is easy to build with `Printf.sprintf`.\n\
    \n```ocaml\nwrite_header : out_channel -> int * int -> unit\n\nlet write_header\
    \ o (major, minor) =\n  output_string o (Printf.sprintf \"%d.%d\\n\" major minor)\n\
    ```\n\nThe `write_objects` function, which is given a list of `(int * Pdf.pdfobject)`\
    \ pairs, sorts the objects by their number, and then outputs each object using\
    \ `string_of_pdfobject`. The example `[(\"Type\", Dictionary [(\"Pages\", Array\
    \ [Indirect 1]); (\"Count\", Integer 1)])` will be written to file like this:\n\
    \n```\n3 0 obj\n<< /Type /Pages /Kids [1 0] /Count 1 >>\n\n\nThe function collects\
    \ and returns a list of the offsets of the objects written, since this will be\
    \ needed to write the trailer section, which we will describe in moment.\n\n```ocaml\n\
    write_objects : out_channel -> (int * Pdf.pdfobject) list -> int list\n\nlet write_objects\
    \ o objs =\n  let offsets = ref [] in\n  List.iter\n    (fun (objnum, obj) ->\n\
    \      offsets := objnum :: !offsets;\n      output_string o (Printf.sprintf \"\
    %i 0 obj\\n\" objnum);\n      output_string o (string_of_pdfobject obj);\n   \
    \   output_string o \"\\nendobj\\n\")\n    (List.sort objs);\n  List.rev !offsets\n\
    ```\n\n```ocaml\nstring_of_array : Pdf.pdfobject list -> string\nstring_of_dictionary\
    \ : Pdf.dictionary -> string\nstring_of_stream : Pdf.pdfobject -> string -> string\n\
    string_of_pdfobject : Pdf.pdfobject -> string\n\nlet rec string_of_array a =\n\
    \  let b = Buffer.create 100 in\n  Buffer.add_string b \"[\";\n  List.iter\n \
    \   (fun s ->\n      Buffer.add_char b ' ';\n      Buffer.add_string b (string_of_pdfobject\
    \ s))\n    a;\n  Buffer.add_string b \"]\";\n  Buffer.contents b\n\nlet string_of_dictionary\
    \ d =\n  let b = Buffer.create 100 in\n  Buffer.add_string b \"<<\";\n  List.iter\n\
    \    (fun (k, v) ->\n      Buffer.add_char b ' ';\n      Buffer.add_string b k;\n\
    \      Buffer.add_char b ' ';\n      Buffer.add_string b (string_of_pdfobject\
    \ v))\n    d;\n  Buffer.add_string b \">>\";\n  Buffer.contents b\n\nlet string_of_stream\
    \ dict data =\n  let b = Buffer.create 100 in\n  List.iter (Buffer.add_string\
    \ b)\n    [string_of_pdfobject dict; \"\\nstream\\n\"; data; \"\\nstream\"];\n\
    \  Buffer.contents b\n\nlet string_of_pdfobject obj =\n  match obj with\n| Pdf.Boolean\
    \ b -> string.of.bool b\n| Pdf.Integer i -> string.of.int i\n| Pdf.Float f ->\
    \ string.of.float f\n| Pdf.String s -> \"(\" ^ s ^ \")\"\n| Pdf.Name n -> n\n\
    | Pdf.Array a -> string_of_array a\n| Pdf.Dictionary d -> string_of_dictionary\
    \ d\n| Pdf.Stream (dict, data) -> string_of_stream dict data\n| Pdf.Indirect i\
    \ -> Printf.sprintf \"%i R\" i\n```\n\nFigure 14.1: Our mutually recursive functions\
    \ to build a string from a Pdf.pdfobject\n\nNow, we can write the trailer. That\
    \ is to say, this section:\n\n```\nxref\n0 5\n0000000000 65535 f\n0000000015 00000\
    \ n\n0000000230 00000 n\n0000000279 00000 n\n0000000338 00000 n\ntrailer\n<< /Size\
    \ 5 /Root 2 >>\nstartxref\n440\n%%EOF\n```\n\nThis consists largely of a list\
    \ of the byte offsets of the four objects in the file (15, 230, 279, 338), the\
    \ trailer dictionary, and so on. It is not necessary to understand it in detail.\
    \ This is the first section which would be read by a PDF reader, to find the actual\
    \ objects in the file.\n\n```ocaml\nwrite_trailer : out_channel -> Pdf.t -> int\
    \ list -> unit\n\nlet write_trailer o pdf offsets =\n  let startxref = pos_out\
    \ o in\n  output_string o \"xref\\n\";\n  output_string o =\n    (Printf.sprintf\
    \ \"%09d\\n\" (List.length pdf.objects + 1));\n  output_string o \"0000000000\
    \ 65535 f \\n\";\n  List.iter\n    (fun offset ->\n        output_string o (Printf.sprintf\
    \ \"%010i 00000 n \\n\" offset))\n    ) offsets;\n  output_string o \"trailer\\\
    n\";\n  output_string o (string.of_object pdf.Pdf.trailer);\n  output_string o\
    \ \"\\nstartxref\\n\";\n  output_string o (string.of_int startxref);\n  output_string\
    \ o \"\\n%%EOF\";\n```\n\nNow the main function is simple. We open the file, the\
    \ header, objects, and trailer, and close the file. In the event of an exception,\
    \ we close the file to clean up, and re-raise it.\n"
  mdcn: "\n\n## 第 14 章\n\n## 编写文档\n\n我们已经构建了用于内存中的 PDF 文档表示，并定义了一个示例文档。现在，我们必须构建写入此文件的函数。回想上一章节中的示例文件：\n\
    \n```\n%PDF-1.1\n1 0 obj\n<</Type /Page\n/Parent 3 0 R\n/Resources\n<</Font\n\
    <</F0\n<</Type /Font /Subtype Type1 /BaseFont /Times-Italic>>>>>>\n/MediaBox [0\
    \ 595.27590551 841.8897638]\n/Rotate 0 /Contents [4 0 R] >>\nendobj\n2 0 obj\n\
    <</Type /Catalog /Pages 3 0 R>>\nendobj\n3 0 obj\n<</Type /Pages /Kids [1 0 R]\
    \ /Count 1>>\n4 0 obj\n<</Length 53>>\nstream\n1 0 1 50 770 cm /BT /F0 36 Tf (Hello,\
    \ World!) Tj\nendstream\nendobj\nxref\n0 5\n0000000000 05535 f\n0000000015 00000\
    \ n\n0000000200 00000 n\n0000000245 00000 n\n0000000296 00000 n\ntrailer\n<</Size\
    \ 5 /Root 2 0 R>>\n```\n\nstartxref\n397\n%%EOF\n```\n\n我们记得，它由一个头部、一些对象（这里有四个）和一个尾部组成。我们需要四个函数：\n\
    \n- 1. 函数 `string.of_pdfobject`，用于从一个 `Pdf.pdfobject` 生成字符串，例如从 PDF 字典 `[(/Type\"\
    , Name \"Pages\"; /Kids, Array [Indirect 1]); /Count\", Integer: 1)]` 生成字符串 `<</Type\
    \ /Pages /Kids [1 0 R] >>`；\n- 2. 函数 `write_header`，用于写入头部（即对象之前的所有内容）；\n- 3.\
    \ 函数 `write_trailer`，用于写入尾部（即对象之后的所有内容）；\n- 4. 主函数 `pdf_to_file`，它使用这三个函数将 PDF\
    \ 按照给定名称写入文件。\n\n函数 `string.of_pdfobject` 表示为一组使用 `let rec` 结构引入的相互递归函数。将其写成单个函数是可行的，但会相当大，而且更难以阅读和编辑。让我们逐部分展示它，然后一次性展示。\n\
    首先是主部分。给定一个我们想要生成其字符串的对象，假设 `string.of_array`、`string.of_dictionary` 和 `string.of_stream`\
    \ 已经存在：\n\n```ocaml\nstring_of_pdfobject : Pdf.pdfobject -> string\n\nlet rec\
    \ string.of_pdfobject obj =\nmatch obj with\n| Pdf.Boolean b -> string.of.bool\
    \ b\n| Pdf.Integer i -> string.of.int i\n| Pdf.Float f -> string.of.float f\n\
    | Pdf.String s -> \"(\" ^ s ^ \")\"\n| Pdf.Name n -> n\n| Pdf.Array a -> string.of.array\
    \ a\n| Pdf.Dictionary d -> string.of.dictionary d\n| Pdf.Stream (dict, data) ->\
    \ string.of.stream dict data\n| Pdf.Indirect i -> Printf.sprintf \"%i 0 R\" i\n\
    ```\n\n所有的情况都是简单的，除了那些我们留待单独实现的项。字符串必须放在括号之间，间接引用被打印为 `2 0 R` 等。\n要从一个数组构建字符串，我们需要从一个左方括号开始，为数组中的每个\
    \ `Pdf.pdfobject` 添加字符串（当然，这些对象可能是任意复杂的），并在它们之间加上空格。\n然后，我们用一个右方括号结束：\n\n```ocaml\n\
    string_of_array : Pdf.pdfobject list -> string\nlet rec string_of_array a =\n\
    \  let b = Buffer.create 100 in\n  Buffer.add_string b \"[\";\n  List.iter\n \
    \   (fun s ->\n      Buffer.add_char b ' ';\n      Buffer.add_string b (string_of_pdfobject\
    \ s))\n    a;\n  Buffer.add_string b \" ]\";\n  Buffer.contents b\n```\n\n使用标准库中的\
    \ `Buffer` 模块来收集这些字符串是很自然的选择。这比使用字符串拼接更高效。注意我们没有在左方括号后添加初始空格，但在右方括号之前添加了，以保持对称。`string_of_dictionary`\
    \ 函数与之类似：\n\n现在处理 `string_of_stream`。PDF 中的流（stream）写入方式如下：\n\n```\nstream dictionary\n\
    stream\nstream data\nendstream\n```\n\n使用 `Buffer` 模块处理这个也很简单：\n\n```ocaml\nstring_of_stream\
    \ : Pdf.pdfobject -> string -> string\n\nlet rec string_of_stream dict data =\n\
    \  let b = Buffer.create 100 in\n  List.iter (Buffer.add_string b)\n    [string_of_pdfobject\
    \ dict; \"\\nstream\\n\"; data; \"\\nendstream\"];\n  Buffer.contents b\n```\n\
    \n这些函数的代码汇总在图 14.1 中。现在我们可以从任何 `Pdf.pdfobject` 构建字符串，可以继续构建 `write_header`、`write_trailer`\
    \ 和 `write_objects` 函数，这样我们就有了最终 `pdf_to_file` 函数所需的所有内容。\nPDF 头部由 `%d.%d` 组成，其中\
    \ `m` 和 `n` 是主次版本号。使用 `Printf.sprintf` 很容易构建。\n\n```ocaml\nwrite_header : out_channel\
    \ -> int * int -> unit\n\nlet write_header o (major, minor) =\n  output_string\
    \ o (Printf.sprintf \"%d.%d\" major minor)\n```\n\n`write_objects` 函数接收一个 `(int\
    \ * Pdf.pdfobject)` 列表，按数字对其排序，然后使用 `string_of_pdfobject` 输出每个对象。示例 `[(\"Type\"\
    , Dictionary [\"Pages\", Array [Indirect 1]]), (\"Count\", Integer 1)]` 将写入文件如下：\n\
    \n```\n3 0 obj\n<< /Type /Pages /Kids [1 0]\n```\n\n收集对象的偏移量列表，因为这将写入尾部部分，我们稍后描述。\n\
    \n```ocaml\nwrite_objects : out_channel -> (int * Pdf.pdfobject) list -> int list\n\
    \nlet write_objects o objs =\n  let offsets = ref [] in\n  List.iter\n    (fun\
    \ (objnum, obj) ->\n      offsets := objnum :: !offsets;\n      output_string\
    \ o (Printf.sprintf \"%i 0 obj\" objnum);\n      output_string o (string_of_pdfobject\
    \ obj);\n      output_string o \"\\nendobj\\n\")\n    (List.sort objs);\n  List.rev\
    \ !offsets\n```\n\n```ocaml\nstring_of_array : Pdf.pdfobject list -> string\n\
    string_of_dictionary : Pdf.dictionary -> string\nstring_of_stream : Pdf.pdfobject\
    \ -> string -> string\nstring_of_pdfobject : Pdf.pdfobject -> string\n\nlet rec\
    \ string_of_array a =\n  let b = Buffer.create 100 in\n  Buffer.add_string b \"\
    [\";\n  List.iter\n    (fun s ->\n      Buffer.add_char b ' ';\n      Buffer.add_string\
    \ b (string_of_pdfobject s))\n    a;\n  Buffer.add_string b \"]\";\n  Buffer.contents\
    \ b\n\nlet string_of_dictionary d =\n  let b = Buffer.create 100 in\n  Buffer.add_string\
    \ b \"<<\";\n  List.iter\n    (fun (k, v) ->\n      Buffer.add_char b ' ';\n \
    \     Buffer.add_string b k;\n      Buffer.add_char b ' ';\n      Buffer.add_string\
    \ b (string_of_pdfobject v))\n    d;\n  Buffer.add_string b \">>\";\n  Buffer.contents\
    \ b\n\nlet string_of_stream dict data =\n  let b = Buffer.create 100 in\n  List.iter\
    \ (Buffer.add_string b)\n    [string_of_pdfobject dict; \"\\nstream\\n\"; data;\
    \ \"\\nstream\"];\n  Buffer.contents b\n\nlet string_of_pdfobject obj =\n  match\
    \ obj with\n| Pdf.Boolean b -> string.of.bool b\n| Pdf.Integer i -> string.of.int\
    \ i\n| Pdf.Float f -> string.of.float f\n| Pdf.String s -> \"(\" ^ s ^ \")\"\n\
    | Pdf.Name n -> n\n| Pdf.Array a -> string_of_array a\n| Pdf.Dictionary d -> string_of_dictionary\
    \ d\n| Pdf.Stream (dict, data) -> string_of_stream dict data\n| Pdf.Indirect i\
    \ -> Printf.sprintf \"%i R\" i\n```\n\n图 14.1：从 `Pdf.pdfobject` 构建字符串的相互递归函数\n\
    \n现在，我们可以写入尾部（trailer）。也就是说这段部分：\n\n```\nxref\n0 5\n0000000000 65535 f\n0000000015\
    \ 00000 n\n0000000230 00000 n\n0000000279 00000 n\n0000000338 00000 n\ntrailer\n\
    << /Size 5 /Root 2 >>\nstartxref\n440\n%%EOF\n```\n\n它很大程度上由文件中四个对象（15, 230, 279,\
    \ 338）的字节偏移量列表、尾部字典等组成。不需要详细理解。这是 PDF 阅读器读取的第一部分，用于找到文件中的实际对象。\n\n```ocaml\nwrite_trailer\
    \ : out_channel -> Pdf.t -> int list -> unit\n\nlet write_trailer o pdf offsets\
    \ =\n  let startxref = pos_out o in\n  output_string o \"xref\\n\";\n  output_string\
    \ o =\n    (Printf.sprintf \"%09d\\n\" (List.length pdf.objects + 1));\n  output_string\
    \ o \"0000000000 65535 f \\n\";\n  List.iter\n    (fun offset ->\n        output_string\
