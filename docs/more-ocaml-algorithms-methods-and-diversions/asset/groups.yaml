    # 更多 OCaml 算法、方法与趣闻


    在《More OCaml》一书中，John Whiting 开启了一场基于 OCaml 的函数式编程漫游之旅，介绍了各种语言特性并描述了一些经典算法。本书以一个处理
    PDF 文件生成的庞大示例作为结束。每一章都包含问题，并附有详细答案和提示。


    《More OCaml》既能吸引希望精进技能的现有 OCaml 程序员，也能吸引渴望探索如 OCaml 等函数式语言的资深程序员。希望每位读者都能从中发现新颖的东西，或以全新的视角审视旧事物。对于更随性的读者或习惯了其他函数式语言的人来说，书的开头提供了一份
    OCaml 总结。


    JOHN WHITINGTON 创立了一家广泛使用 OCaml 的软件公司。他在剑桥大学向计算机科学专业的学生教授函数式编程。他的其他书籍包括《PDF Explained》（O''Reilly,
    2012）和《OCaml from the Very Beginning》（Coherent, 2013）。


