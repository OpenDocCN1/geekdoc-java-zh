    \ the element itself, the function is polymorphic.\n\n3\n\nIf the list is empty,\
    \ we return None, otherwise we use a left fold which simply replaces the accumulator\
    \ with each successive element from the list. We must initialize the accumulator,\
    \ so we pick the first element for that (we have already eliminated the case where\
    \ there are no elements, so List.hd will succeed).\n\n```ocaml\nlast : 'a list\
    \ -> 'a option\nlet last l =\n  match l with\n  [] -> None\n  | _ -> Some (List.fold_left\
    \ (fun e -> e) (List.hd l) l)\n```\n\nNot quite idiomatic.\n\n## 4\n\nIf we start\
    \ from the left, consing each element to the accumulator (which is initially the\
    \ empty list), the list will be reversed.\n\n```ocaml\nrev : 'a list -> 'a list\n\
    let rev l =\n  List.fold_left (fun a e -> e :: a) [] l\n```\n\nSince the accumulator\
    \ is the empty list (which has type 'a list), the whole remains polymorphic, having\
    \ the type we would expect.\n\n## 5\n\nThe accumulator begins set to false. For\
