    \ X 和空白格：\n```ocaml\ntype turn = 0 | X | E\n```\n使用元组是自然的，因为棋盘的大小是固定的。尽管如此，我们失去了使用如\
    \ `List.map` 等标准列表处理函数的能力，我们将使用长度为九的列表——我们需要在 X 赢、O 赢或棋盘满时终止树。因此，我们需要检查所有的行、列和对角线。我们不想重复编写逻辑或构建一个巨大的模式匹配。\n\
    \n| 1 | 2 | 3 |\n|---|---|---|\n| 4 | 5 | 6 |\n| 7 | 8 | 9 |\n\n现在，我们可以使用 `List`\
    \ 模块的函数写一个返回当前空白位置数字的函数：\n```ocaml\nempty : turn list -> int\nlet empty b =\n\
