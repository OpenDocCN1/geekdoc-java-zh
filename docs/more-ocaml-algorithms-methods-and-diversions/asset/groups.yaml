    \ list → int → α list → int → bool\nsearch_list : α list → α list → bool\n\nlet\
    \ rec search_list_inner len_p len_l =\n  len_p <= len_l\n  &&\n  Util.take l len_p\
    \ = p ||\n  search_list_inner len_p (List.tl l) (len_l - 1)\n\nlet search_list\
    \ p =\n  search_list_inner p (List.length p) l (List.length l)\n```\n\nNow, List.length\
    \ is called only at the beginning. We can also remove Util.take to avoid the construction\
    \ of intermediate lists, by writing an explicit function to test the pattern against\
    \ the first len.p items in the lists:\n\n```\nequal : α list → int → α list →\
    \ bool\nsearch_list_inner : α list → int → α list → int → bool\nsearch_list :\
    \ α list → α list → bool\n\nlet rec equal l len p =\n  len = 0\n  |\n  List.hd\
    \ l = List.hd equal (List.tl l) (len - 1) (List.tl p)\n\nlet rec search_list_inner\
    \ len_p len_l =\n  len_p <= len_l\n  &&\n  (equal l len_p = p ||\n  search_list_inner\
    \ len_p (List.tl l) (len_l - 1))\n\nlet search_list p =\n  search_list_inner p\
    \ (List.length p) l (List.length l)\n```\n\nThis is now about as efficient as\
    \ our simple approach can get.\n\n# Searching in strings\n\nFor practical applications,\
    \ we shall often need to search within strings, or other such random-access structures.\
    \ Our first list version generalizes easily:"
