    \ Accumulation”，我们希望返回 `['A'; 'n'; ';']`，但在读到第二个 ‘c’ 之前我们并不知道这一点。同样，在读取 128 个不同字符后我们会停止。之后，如果在初始调用时处于输入末尾，将抛出\
    \ End_of_file。\n\n```ocaml\nget_different : input -> char list\n\nlet get_different\
    \ i =\n  let rec getdiffinner a c =\n    if c = 128 then List.rev a else\n   \
    \   try\n        let ch = i.input.char () in\n        if ch <> List.hd a\n   \
    \       then getdiffinner (ch :: a) (c + 1)\n        else (rewind i; rewind i;\
    \ List.rev (List.tl a))\n      with\n        End.of_file -> List.rev a\n  in\n\
    \  getdiffinner [i.input.char ()] 1\n```\n\n压缩函数现在相对简单。我们重复调用 `get_same`。如果它指示长度为一的连续序列，我们改调用\
