    \ : α → string\nlet string.of_point {label = l; x = x; y = y; _} = l\n  ^ = \"\
    (\n  string_of_float x\n  ^ = \",n  string_of_float y\n  ^ = \")\n```\n\nFinally,\
    \ we can use the shorthand record form in patterns to:\n\n```\nstring_of_point\
    \ : α → string\nlet string.of_point {label; x; y; _} = label\n  ^ = \"(\n  string_of_float\
    \ x\n  ^ = \",\n  string_of_float y\n  ^ = \")\n```\n\nWhen we need a copy of\
