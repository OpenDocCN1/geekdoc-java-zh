    # Preface


    When I wrote "OCaml for the Very Beginning", the intention was to have a book
    with no prerequisites - a bright individual, new to programming, could follow
    it. Because of this, and for length concerns, plenty of interesting material had
    to be omitted. This text, not being constrained in the same way, contains a variety
    of topics which require some existing experience with a functional language. Those
    who have read the previous text have no problem with this equally. It should be
    comprehensible to a functional programmer familiar with another language such
    as ML or Haskell. The reader may need to make occasional reference to the OCaml
    manual.


    There are, typically, two activities when writing programs larger than a few dozen
    lines: firstly, dealing with the challenges of complexity inherent in the problem,
    finding appropriate abstraction mechanisms and, secondly, finding and using the
    wide range of third-party libraries available for given. Most projects involve
    a combination of two. In this text we concentrate on the former, using nothing
    except the OCaml Standard Library. Keeping up with the myriad third-party OCam
    libraries is a task better suited to other media.


    The book consists of sixteen chapters each falling into three categories. Some
    introduce pieces of OCaml syntax with examples. Some survey practical topics as
    input/output. Some cover little diversions or puzzles. The main matter of the
    book ends with a lengthy worked: a program to build PDF files containing computer-generated
    drawings and text. There are full answers and hints for all questions in the book,
    and additional material in the online resources.


    # Acknowledgments


    The quotation in Chapter 6 is taken from ISO-32000 International Organization
    for Standardization. The tables of codes in each chapter are taken from ITU-T
    T.30 International Telecommunication Union. The presentation of the balancing
    operation for Red-Black trees in Chapter 11 and its functional implementation
    is due to Chris Okasaki, as described in the invaluable "Purely Functional Data
    Structures (Cambridge University Press, ISBN 978-0521653502, 1998). Chapter 12
    was inspired by a Vision of Cambridge Computer Science Trips exam question by
    Lawrence C. Paul in 1999. Question 3 of that chapter is due to Peter D. Schumer
    in "Mathematical Journeys" (John Wiley & Sons, ISBN-0-471-22086-3, 2004).


    I am grateful to the many colleagues and friends with whom I have been able to
    discuss OCaml style and substance, including Mark Shinwell, Leo White, Daniel
    Bünzi, Anil Madhavapeddy, Stephen Dolan and many others I have forgotten. Helpful
    comments on an earlier draft were provided by Stefan Schmiedl, Manuel Cornes,
    Jan Bówłow, Emmanuel Delabode, Mario Alvaro Picasso, Giannis Tsarai, Emmanuel
    Oga, and André Bjärby.'
