    (Br (Code 5, Br (Code 14, Code 15), Lf)), Br (Code 6, Code 7)))\n```\n\n## 3\n\
    \n使用 `compress_string_input_data 1680` 代替 `compress_string_input_data 80` 压缩数据生成的长度为\
