    # Balanced trees


    We have seen that binary search trees are only useful if they are reasonably close
    to balanced. In recent decades, several data structures have been developed which
    try to keep a binary tree "reasonably balanced", such that operations remain efficient.
    Red-Black trees were invented by Rudolf Bayer, and the functional presentation
    here is due to Chris Okasaki in his landmark book "Purely Functional Data Structures"
    (Cambridge University Press, 1998).


    A Red-Black tree is an ordinary binary tree with one addition: each node is either
    Red or Black. Leaf nodes are considered. The balance is ensured by every operation
    that alters the tree (in our case, just insert) so that the following remains
    true:


    +   - the children of each Red node are Black; and

    - each path from root to leaf contains an equal number of Black nodes – the longest
    path from root to leaf (Black, Red, Black, Red ... Black) is no more than twice
    as long as the shortest path (Black, Black, Black ... Black). Thus, the maximum
    depth of a Red-Black tree is proportional to the logarithm of the number of elements
    in the set. Here is an example valid Red-Black tree, with 3 black nodes in each
    path:


    ![](img/412ff6f522cd6d58bb984724b97d22e6_98_0.png)


    Here are the types for representing a Red-Black tree – we have just added a new
    colour to each branch of the tree:'
  - "[PAGE 99]\n\n# Chapter 11. Making Sets\n\ntype colour = R | B\n\ntype 'a t =\
    \ L | Br of colour * 'a t * 'a * a t\n\nThe list_of_set, size, and member functions\
    \ are simple to alter: they just ignore the colour field. The insert function,\
    \ however, must be modified to preserve the Red-Black properties.\n\nAs with ordinary\
    \ binary search trees, the new node added by insert will be in place of a leaf\
    \ node. We colour it Red, to make sure the invariant that no path can have a differing\
    \ number of black nodes in it is not broken. However, this may break the other\
    \ invariant (that no Red has a Red). It turns out that, by considering the parent\
    \ and grandparent of the newly-inserted node, performing a simple operation, and\
    \ possibly continuing this process upward, we can restore the invariant, and efficiently.\
    \ The following diagrams, a la Kawasaki, illustrate the process:\n\n![](img/412ff6f522cd6d58bb984724b97d22e6_99_0.png)\n\
    \nIn each case, the nodes x, y, z and the sub-trees α, β, γ, δ remain in the same\
    \ order, so the binary tree invariant is preserved. Pattern matching is particularly\
    \ elegant here, since all but one of our cases have the same result:\n\n```\n\
    balance : colour x a t * x a t -> a t\nlet balance t =\nmatch t with\n  (B, Br\
    \ (R (R, a, x, b), y, c), z, d)\n  | (B, Br (R, a, x, Br (R, b, y, c)), z, d)\n\
    \  | (B, a, x, Br (R (Br (R, b, y, c), z, d))\n  | (B, a, x, Br (R, b, y), Br\
    \ (R, c, z, d))) ->\n  Br (R, Br (B, a, x, b), y, Br (B, c, z, d)))\n  | (a, b,\
    \ c, d) -> Br (a, b, c, d)\n```\n\nNow, we can write the insertion function itself:"
  - "[PAGE 100]\n\n# Chapter 11. Making Sets\n\n```\ninsert_inner : a -> at -> a t\n\
    insert : a -> at -> at\n\nlet rec insert_inner x s =\n  match s\n    Lf -> Br\
    \ (R, Lf, x, Lf)\n    | Br (c, l, y, r) ->\n      if x < y\n        then balance\
    \ (c, l, y, insert_inner x r)\n        else if x > y then balance (c, l, y, insert_inner\
    \ x r)\n        else Br (c, l, y, r)\n\nlet insert x s =\n  match insert_inner\
