    \n## 6. 数据压缩\n\nCCITT 方案的压缩器和解压缩器是自 1970 年以来使用的基本方法，也用于每像素比特 TIFF 文件。它还被用于 PDF\
    \ 格式。这里是我们的数据，一张扫描书籍的 80x21 每像素比特图像。我们可以使用字符 0 和 1 将其放入源文件中。一个字符串由若干行组成，每行末尾添加反斜杠。下一行的开头空格也会被跳过，以便我们可以很好地对齐。\n\
