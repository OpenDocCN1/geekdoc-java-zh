    search : ?nocase:bool string -> string -> bool\nlet search ?(nocase = false) ss\
    \ s =\nif nocase then\n  search' 0 (String.uppercase ss) (String.uppercase s)\n\
    else\n  search' 0 ss\n```\n\nBoth the pattern and string must be upper case, of\
    \ course.\n\n# Chapter 10 (Finding Permutations)\n\n# 1\n\nThe combinations of\
    \ a list can be generated by calculating the combinations of the tail. Consider\
    \ two possibilities – the head is included in this combination, or it is not:\n\
    \ncombinations : α list → α list list\n\n```ocaml\nlet rec combinations l =\n\
    \  match l with\n  [] -> [[]]\n  | h:t ->\n    let cs = combinations t in\n  \
    \  List.map(fun x -> h :: x) cs @ cs\n```\n\nNote the base case is the list containing\
    \ the empty list, not just the empty list.\n\n# 2\n\nWe build this from perms\
    \ and the combinations function we wrote:\n\n```ocaml\npermicombinations : α list\
    \ → α list list\nlet permicombinations l =\n  List.concat(List.map perms (combinations\
    \ l))\n```\n\nWe used the tail-recursive version of perms, of course.\n\n# 3\n\
    \nThis roughly has the same shape as combinations, with two differences: we keep\
    \ a counter to make sure the computation ends, and we always add something to\
    \ the list - either true or false.\n\n```ocaml\nbool_lists : int → bool list\n\
    let rec bool_lists n =\n  match n with\n  0 -> [[]]\n  | n ->\n    let ls = bool_lists\
    \ (n - 1) in\n    (List.map(fun l -> true :: l) ls) @\n    (List.map(fun l ->\
    \ false :: l) ls)\n```\n\n# 4\n\nWe repeatedly swap elements from opposite ends\
    \ of the sub-array, given an array, offset and length:\n\n# Answers to Questions\n\
    \n```ocaml\narray_rev : a array -> int -> int -> unit\nlet array_rev a l l =\n\
    \  for x = 0 to l / 2 - 1 do\n    swap (o + x) (o + l - x - 1)\n  done\n```\n\n\
    It is important to make sure it works for the empty range, an even-length sub-array\
    \ and an odd-length sub-array. You could add detection of invalid arguments to\
    \ this function.\n\n# 5\n\nThe two functions first and last turn out to be even\
    \ more awkward than their imperative counterparts. The function first, given a\
    \ list, returns a tuple of three things: the elements before the \"first\" item,\
    \ the first item itself, and thereafter. This is done by reversing the input list\
    \ and looking for the first appropriate item, since this is easier than looking\
    \ for the appropriate item in the original input:\n\n```ocaml\nfirst_inner : a\
    \ list -> a list -> (a list * a * a list)\nfirst : a list -> (a list * a * a list)\n\
    \nlet rec first_inner before l =\n  match l with\n  | [] -> raise (Invalid.argument\
    \ \"first_inner\" l)\n  | [x] -> (List.rev before, x, [])\n  | a::b:t ->\n   \
    \   if b < a\n      then (List.rev t, b, (a :: before))\n      else first_inner\
    \ (a :: before) (b :: t)\n\nlet first l =\n  first_inner [] (List.rev l)\n```\n\
    \nThe last function is still more verbose: we locate the correct item by sorting\
    \ and finding the smallest item greater than f. We can then split_at to return\
    \ the item before and after the instance of f.\n\n# Answers to Questions\n\n```ocaml\n\
    split_at_inner : α list → α -> α list → α list * α list\nsplit_at : α -> α list\
    \ → α list * α list\nlast : α list -> (α -> bool) -> (α list * α * α list)\n```\n\
    \n```ocaml\nlet rec split_at_inner before n l =\n  match l with\n  [] -> (List.rev\
    \ before, [])\n  | h:t ->\n    if h = n\n      then (List.rev before, t)\n   \
    \   else split_at_inner (h :: before) t\n```\n\n```ocaml\nlet split_at n l =\n\
    \  split_at_inner [] n l\n```\n\n```ocaml\nlet last l =\n  match List.filter (fun\
    \ x -> x > f) (List.sort compare l) with\n  [] -> raise (Invalid.argument \"last\"\
    \ l)\n  | h:t ->\n    let before, after = split_at h in\n    (before, h, after)\n\
    ```\n\nNow, the next_permutation function calls first and last and stitches everything\
    \ together:\n\n```ocaml\nnext_permutation : α list → α list\nlet next_permutation\
    \ l =\n  let before_f, f, after_f = first l in\n  let before_c, c, after_c = last\
    \ after_f in\n  before_f @ c @ List.rev (before_c @ after_c)\n```\n\nHere is the\
    \ non_increasing function, which is simple:\n\n```ocaml\nnon_increasing : α list\
    \ → bool\nrec non_increasing l =\n  match l with\n  [] | [_] -> true\n  | a:b:t\
    \ -> a >= b && non_increasing (b :: t)\n```\n\nThe final all_permutations function\
    \ is now:\n\n```ocaml\nall_permutations_inner : α list * α list -> α list * α\
    \ list\nrec all_permutations_inner a l =\n  if non_increasing l then List.rev\
    \ a\n  else\n    let next = next_permutation l in\n    all_permutations_inner\
    \ (next :: a)\n\nlet all_permutations l =\n  all_permutations_inner [] l\n```\n\
    \nConclusion: converting an imperative algorithm to functional style is not always\
    \ useful.\n\n# Chapter 11 (Making Sets)\n\n# 1\n\nIt is not possible to measure\
    \ the memory used directly by a data structure (though one could use the manual\
    \ to measure the number of words allocated whilst building the structure), using\
    \ the given formula \"memory used since start of program = minor words + major\
    \ words\":\n\n| Set representation | Memory used (words) |\n| :--- | :--- |\n\
    | List | 15006 |\n| Tree | 39163 |\n| Red-Black tree | 81938 |\n| Hash table |\
    \ 265 |\n\nNotice that a huge amount of memory is required for tree structures\
    \ because every time a new element is inserted, part of the tree is rewritten.\
    \ In the case of Red-Black tree, rotations involve allocating memory too.\n\n\
    # 2\n\nWe can add the type for the union function to our signature:\n\n```ocaml\n\
    module SetType = sig\n  type 'a t\n  val set_of_list : 'a list -> 'a t\n  val\
    \ list_of_set : 'a t -> 'a list\n  val insert : 'a -> 'a t -> 'a t\n  val size\
    \ : 'a t -> int\n  val member : 'a -> 'a t -> bool\n  val union : 'a t -> 'a t\
    \ -> 'a t\nend\n```\n\nFor lists, the union function is easy, we insert each element\
    \ of b into the list a. Duplicates will be removed correctly:\n\n```ocaml\nlet\
    \ union a b = List.fold_left (fun x y -> insert y) a b\n```\n\nFor trees and Red-Black\
    \ trees, we must turn b into a list first, so fold_left can be used, but the solution\
    \ is broadly the same.\n\n```ocaml\nlet union a b = List.fold_left (fun x y ->\
    \ insert y) a (list_of_set b)\n```\n\nFor hash tables, to preserve the previous\
    \ tables, we must build lists from both sets, and then build a new set from the\
    \ concatenation of those two lists:\n\n```ocaml\nlet union a b = set_of_list (list_of_set\
    \ a @ list_of_set b)\n```\n\nThe built-in Set module, which is considered in Question\
    \ 3, provides a particularly efficient union operation.\n\n# 3\n\nWe write a version\
    \ of our set signature which is specialized to integers. Then, we use the syntax\
    \ given in the question to build the module S. This contains the type S.t, the\
    \ value S.empty and the functions S.elements, S.add, S.mem, and S.cardinal, which\
    \ we can use to write the functions to match our signature.\n\n# Answers to Questions\n\
    \n```ocaml\nmodule IntSet :\n  sig\n    type t\n    val list_of_list : int ->\
    \ t\n    val list_of_set : t -> int list\n    val insert : int -> t -> t\n   \
    \ val size : t -> int\n    val member : int -> t -> bool\n  end\nstruct\n  module\
    \ S =\n    Set.Make (struct type t = int; compare = compare end)\n\n  type t =\
    \ S.t\n  let list_of_set s = S.elements s\n\n  let set_of_list l = List.fold_right\
    \ add l empty\n\n  let member = S.mem\n\n  let insert = S.add\n\n  let size =\
    \ S.cardinal\nend\n```\n\nNow the benchmarking for insertion and membership is\
    \ simple:\n\n```ocaml\nbenchmark_intset : string -> int list -> unit\nlet benchmark_intset\
    \ name ns =\n  let a = Unix.gettimeofday () in\n  let set = IntSet.set_of_list\
    \ ns in\n  let b = Unix.gettimeofday () in\n  List.iter (fun x -> ignore (IntSet.member\
    \ x set)) ns;\n  let c = Unix.gettimeofday () in\n  Printf.printf(\n    \"%s,\
    \ insertion took %f, membership %f\\n\"\n    name (b - a) (c - b)\n  )\n\nlet\
    \ _ =\n  benchmark_intset \"ordered\" nums;\n  benchmark_intset \"unordered\"\
    \ rand\n```\n\nHere is the output:\n\nFor ordered, insertion took 0.056586, membership\
    \ 0.019593\nFor unordered, insertion took 0.087148, membership 0.021295\n"
