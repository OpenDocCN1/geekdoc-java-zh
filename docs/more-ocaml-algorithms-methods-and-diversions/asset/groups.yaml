    Move ([0; X; 0; X; 0; E; 0, []]));\nMove ([0; X; 0; X; X, []]));\n...\n...\n...\n\
    ...)\n...)\n))\n```\n\nYou can see the first ending position in this game tree\
    \ is [0; X; 0; X; 0; E]. You can also see several drawn games. We can now use\
    \ this game tree to calculate how many games are won by a given player:\n\n```ocaml\n\
    num_wins : turn -> int\n\nlet rec num_wins turn (Move (b, bs)) =\n  if won (List.map\
    \ (( = ) turn) bs) then 1 else 0 +\n  List.fold.left (+ ) 0 (List.map (num_wins\
    \ bs))\n```\n\nThis tells us, reasonably, that O wins 13184 games. The questions\
    \ at the end of this chapter ask you to work out more of these numbers. Here is\
    \ the full code in one place:\n\n```ocaml\ntype turn = 0 | X | E\nlet won [a;\
