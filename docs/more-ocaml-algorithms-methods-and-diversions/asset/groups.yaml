    let rec perms x =\n  Cons (x, fun () ->\n    if non_increasing x then\n      let\
    \ c = Array.copy x in\n      Array.sort compare c;\n      perms c\n    else\n\
    \      perms (next_permutation x))\n```\n\nThis very imperative algorithm has\
    \ now been dressed in functional clothes."
