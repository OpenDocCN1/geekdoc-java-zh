    # Chapter 11


    # Making Sets


    In this chapter, we will look at various naive and sophisticated data structures
    for storing sets. We will look at their theoretical performance characteristics
    and time them against one another on various sorts of data to learn about their
    performance in practice. Along the way, we will learn some about OCaml''s more
    advanced modular abstraction mechanisms. For each set representation, we will
    give the following five functions:


    +   - set_of_list which builds a set from a list (which may contain duplicates).
    The empty set is built with set_of_list [];

    - list_of_set which returns, in no particular order, a list of the elements in
    the set;

    - insert which inserts a given element into the set, if it is not already present;

    - size which returns the number of elements in the set; and

    - member which tests if an element is present in the set.


    # Simple lists


    Figure 11.1 exhibits these five functions by representing sets using the built-in
    list type. They are largely trivial, save for set_of_list which works by repeated
    insertion into the existing set.


    These functions are not terribly efficient. The member, size, and insert functions
    take time proportional to the size of the set. The set_of_list function works
    worse: it takes time proportional to the square of the size of the set, since
    it uses insert for each element on a growing list. The only bright spot is list_of_set
    (of course) runs in constant time.


    We have not hidden the type of the sets – they may be manipulated by the caller
    as plain lists – and so the abstraction is not safe or complete. Here is an .mli
    file, abstracting the real type of the set to just α.'
