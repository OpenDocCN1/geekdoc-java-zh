    \ O wins 131184 times. By a similar use of num wins we find that X wins 77904\
    \ times. So, as expected, going first is an advantage. We must write another function\
    \ to find how many draws there are. A board is drawn if it is full but does not\
    \ contain a winning configuration of either X or O:\n\n```\ndrawn : tree -> int\n\
    let rec drawn (Move (b, bs)) =\n  if\n    empty b = [] &&\n    not (won (List.map\
    \ (( = ) 0) b)) &&\n    not (won (List.map (( = ) X) b))\n  then 1 else 0\n  +\
    \ List.fold.left (+) 0 (List.map draws bs)\n```\n\nThis tells us that there are\
