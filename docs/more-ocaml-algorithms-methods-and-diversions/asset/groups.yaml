    \ (lseq 2)\n```\n\n# 第 2 章 懒惰性\n\n有很多列表函数无法适应懒惰列表。例如，我们无法反转懒惰列表，或合并两个懒惰列表。但有一个类似的方法可以适应。我们可以公平地合并两个列表，交替从每个列表中取元素：\n\
    \n```ocaml\ninterleave : α lazylist → α lazylist → α lazylist\n\nlet rec interleave\
    \ (Cons (h, tf)) l =\n  Cons (h, fun () -> interleave l tf)\n```\n\n例如，在 0 和 1\
