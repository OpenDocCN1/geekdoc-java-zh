    \ to express this as a single function."
  md: "\n## Chapter 7\n\n## Labelled and Optional Arguments\n\nOCaml allows us to\
    \ label some or all of the arguments to a function, so as to provide a little\
    \ documentation, to prevent us from accidentally swapping two arguments which\
    \ have the same type, and to allow partial application of arguments most flexibly.\
    \ Consider a function to fill in part of an array with an element:\n\n```\nfill\
    \ : α array -> int -> int -> α -> unit\nfilled : unit -> string array =\n\\let\
    \ fill a s l v =\n  for x = s to s + l - 1 do a.(x) <- v done\n\nlet filled ()\
    \ =\n  let a = Array.make 100 \"x\" in\n  fill a 20 40 \"y\";\na\n```\n\nThe function\
    \ takes four arguments: the array itself, the start position, length of the fill\
    \ and the element to use fill. However, since the start and length are both integers,\
    \ it is easy to get them the wrong way. This can be remedied by giving these two\
    \ arguments labels. A label is introduced by a title, followed by the label name,\
    \ a colon and the argument name itself. Consider the functions fill and filled\
    \ below. As we can see, we have defined fill with labels, which appear in the\
    \ type. In the first filled function, we call the filled function, citing the\
    \ labels and giving immediate integers. In the second, we show that it works with\
    \ other names (as it does indeed, for any expression). In the third, show that\
    \ the labelled arguments may be permuted and rearranged with regard to the other\
    \ arguments (unlabelled arguments must remain in the correct order relative to\
    \ one another).\n\n```\nfill : α array → start:int → length:int → α -> unit\n\
    filled : unit → string array\n\nlet fill a -start:s to -length:l v =\n  for x\
    \ = s to s + l - 1 do a.(x) <- v done\n\nlet filled () =\n  let a = Array.make\
    \ 100 \"x\" in\n  fill a -start:20 -length:40 \"y\"\n  a\n\nlet filled () =\n\
    \  let a = Array.make 100 \"x\" in\n  let st = 20 in\n  let ln = 40 in\n  fill\
    \ a -start:st -length:ln \"y\"\n  a\n\nlet filled () =\n  let a = Array.make 100\
    \ \"x\" in\n  fill a \"v\" -length:20 -start:40;\n  a\n```\n\nAnother change we\
    \ can make is to use the label for the name of the argument inside the function\
    \ too. This simplifies the syntax: you can write -label.\n\n```\nfill : α array\
    \ → start:int → length:int → α -> unit\nfilled : unit → string array\n\nlet fill\
    \ a -start - start + length v =\n  for x = start to start + length - 1 do a.(x)\
    \ <- v done\n\nlet filled () =\n  let a = Array.make 100 \"x\" in\n  let start\
    \ = 20 in\n  let length = 40 in\n  fill a -start -length \"y\"\n  a\n```\n\nYou\
    \ can see that in filled, “punning” works equally well when calling the function,\
    \ if we happen to have values with the same names. These two facilities need not\
    \ be used together, of course.\n\n## Labels with partial application\n\nAnother\
    \ common use of labelled arguments to give flexibility when using partial application.\
    \ Consider the following function:\n\n```\nlet divide x y = x / y\n```\n\nWe can\
    \ use partial application to write the function which divides ten thousand by\
    \ each number in a list:\n\n```\nlet f = divide 10000 in [f 100; f 50; f 20]\n\
    ```\n\nThis yields [100; 200; 500]. But we cannot re-use the write function which\
    \ divides each number in a list by this would involve partially applying the second\
    \ argument y. The design of the divide function has baked in which argument may\
    \ be partially applied (OCaml we can partially apply any prefix of the arguments\
    \ – the first, first and second, first and third etc.). For example, we can apply\
    \ the same function to many lists, using a partially applied List.map but we cannot\
    \ apply arguments to a single list by providing the list to List instead. In our\
    \ example, we can label the arguments to our divide function:\n\n```\nlet divide\
    \ -x -y = x / y\n```\n\nThe type of the function reflects this:\n\n```OCOCaml\n\
    # divide -x -y = x / y;;\nval divide : x:int -> y:int -> int = <fun>\n```\n\n\
    Now we may apply the arguments in their order:\n\n```OCaml\n# let f = divide -x:10000\
    \ in [f 100; f 50; f 20];\n: int list = [100; 200; 500];\n# let f = divide -y:10000\
    \ in [f 100000; f 10000; f 1000];\n: int list = [10; 1; 0]\n```\n\nWe can in,\
    \ fact, omit the labels if we are applying arguments in order:\n\n```OCaml\n#\
    \ let f = divide 10000 in [f 100; f 50; f 20];\n: int list = [100; 200; 500]\n\
    ```\n\n## Optional arguments\n\nOCaml also allows us to make a labelled argument\
    \ optional – that is to say, need not supply it at all. The function which is\
    \ called without one or more of its arguments can decide what to do. Consider\
    \ this simple function split returns a list of singleton lists from an input list,\
    \ for example returning [[1]; [2]; [3]] for the input list [1; 2; 3];\n\n```\n\
    split : α list -> α list\n\nlet rec split l =\n  match l with\n    [] -> []\n\
    \    | h::t -> [h] :: split t\n```\n\nWe would like to extend the function to\
    \ produce sub-lists of a given size, other than the default of 1. We can add a\
    \ labelled argument and adapt the function, using take (which takes given number\
    \ of items from the start of a list) and drop (which drops given number of items\
    \ from the start of a list) from the Util module:\n\n```\nsplit : chunksize:int\
    \ -> α list -> α list\n\nlet rec split -chunksize l =\n  try\n    Util.take l\
    \ chunksize ::\n    split -chunksize (Util.drop l chunksize)\n```\n```\n\nThere\
    \ are two problems, though. Existing code using the function will not compile,\
    \ and we must always specify chunksize even when it is 1. This can be remedied\
    \ by using an *optional* labelled argument, introduced with a question mark instead\
    \ of tilde, and given a default value:\n\n```\nsplit : ?chunksize:int -> α list\
    \ -> α list\n\nlet rec split ?chunksize = 1 l =\n  let ch =\n    match chunksize\
    \ with None -> 1 | Some x -> x in\n  try\n    Util.take l ch ::\n    split ?chunksize\
    \ (Util.drop l ch)\n```\n```Notice the question mark appears also in the type.\
    \ Notice also that in the recursive call to split we can write ~chunksize instead\
    \ of usual. Now our split function can be called with or without this optional\
    \ argument:\n\n```OCaml\n# split [1; 2; 3];\n: int list = [[1]; [2]; [3]]\n# split\
    \ ~chunksize:3 [1; 2; 3; 4; 5; 6; 7];\n: int list = [[1; 2; 3]; [4; 5; 6]; [7]]\n\
    ```\n\n## the Standard Library\n\nIn fact, if we do not give a default value to\
    \ the optional argument, we have access to its actual implementation – as a value\
    \ of the option type, either None or Some, and we can match on it:\n\n```\nsplit\
    \ : ?chunksize:int -> α list -> α list\nlet rec split ?chunksize l =\n  let ch\
    \ =\n    match chunksize with None -> 1 | Some x -> x in\n  try\n    Util.take\
    \ l ch ::\n    split ?chunksize (Util.drop l ch)\n  with\n    -> match l with\
    \ [] -> []\n```\n\nThis is primarily useful when there are several optional arguments.\n\
    \n## Labels in the Standard Library\n\nThe Standard Library contains three labelled\
    \ versions of other modules: ListLabels, ArrayLabels and StringLabels. For example,\
    \ we can write:\n\n```OCaml\n# ListLabels.map -f:(fun x -> x * 2) [1; 2; 3];\n\
    : int list = [2; 4; 6]\n```\n\nIf we wish to use the labelled modules by default,\
    \ the module StdLabels contains these labelled modules under their original names,\
    \ by writing “open StdLabels\", List.map, Array.blit etc. will now be labelled:\n\
    \n```OCaml\n# open StdLabels;\n# List.map -f:(fun x -> x * 2) [1; 2; 3];\n: int\
    \ list = [2; 4; 6]\n```\n\nThese modules do not label all arguments. Typically\
    \ they just so for arguments which are functions, and when there are multiple\
    \ arguments of the same type which may be confused. ArrayLabels.sub of type α\
    \ array -> pos:int -> len:int -> α array introduces labels to disambiguate the\
    \ position and length arguments, but does not label the input array.\n\n## Questions\n\
    \n1. The function ArrayLabels.make is not labelled, having type int → α array.\
    \ When might this cause confusion?\n2. When we write our fill function with labelled\
    \ arguments, we wanted to prevent someone mistakenly swapping the start and length\
    \ values. Can you find a way to do this without labelled or optional arguments?\n\
    3. Build labelled versions of functions from the Buffer module, choosing functions\
    \ and arguments to label as appropriate.\n4. Frequently we use an accumulator\
    \ to make a function tail-recursive, wrapping it up in another function to give\
    \ the initial value of the accumulator. For example, we might write:\n\n```\n\
    map_inner : α list → (α → β) → α β list -> list\nmap : (α → β) → α list → β list\n\
    \nlet rec map_inner a f l =\n  match l with\n  [] -> List.rev a\n  | h::t -> map_inner\
    \ (f h :: a) f t\n\nlet map f -> map_inner [] f l\n```\n\nUse an optional argument\
    \ to express this as a single function.\n"
  mdcn: "\n\n## 第 7 章\n\n## 标记参数与可选参数\n\nOCaml 允许我们对函数的某些或所有参数进行标记，以便提供少量的文档说明，防止我们不小心交换两个类型相同的参数，并允许最灵活地对参数进行部分应用。考虑一个用元素填充数组部分内容的函数：\n\
    \n```\nfill : α array -> int -> int -> α -> unit\nfilled : unit -> string array\
    \ =\n\\let fill a s l v =\n  for x = s to s + l - 1 do a.(x) <- v done\n\nlet\
    \ filled () =\n  let a = Array.make 100 \"x\" in\n  fill a 20 40 \"y\";\na\n```\n\
    \n该函数接受四个参数：数组本身、起始位置、填充的长度以及用于填充的元素。然而，由于起始位置和长度的都是整数，很容易弄错它们的顺序。这可以通过给这两个参数加上标签来解决。标签通过一个标题引入，紧接着是标签名称、冒号和参数名称本身。考虑下方的\
    \ `fill` 和 `filled` 函数。正如我们所看到的，我们定义了带有标签的 `fill`，这些标签出现在类型中。在第一个 `filled` 函数中，我们调用\
    \ `filled` 函数时引用了标签并直接给出整数。在第二个中，我们展示了它如何适用于其他名称（事实上，对于任何表达式都是如此）。在第三个中，我们展示了标记参数可以相对于其他参数进行交换和重新排列（未标记的参数在彼此之间必须保持正确的顺序）。\n\
    \n```\nfill : α array → start:int → length:int → α -> unit\nfilled : unit → string\
    \ array\n\nlet fill a -start:s to -length:l v =\n  for x = s to s + l - 1 do a.(x)\
    \ <- v done\n\nlet filled () =\n  let a = Array.make 100 \"x\" in\n  fill a -start:20\
    \ -length:40 \"y\"\n  a\n\nlet filled () =\n  let a = Array.make 100 \"x\" in\n\
    \  let st = 20 in\n  let ln = 40 in\n  fill a -start:st -length:ln \"y\"\n  a\n\
    \nlet filled () =\n  let a = Array.make 100 \"x\" in\n  fill a \"v\" -length:20\
    \ -start:40;\n  a\n```\n\n我们可以做的另一个更改是在函数内部也使用标签作为参数的名称。这简化了语法：你可以写 `-label`。\n\
    \n```\nfill : α array → start:int → length:int → α -> unit\nfilled : unit → string\
    \ array\n\nlet fill a -start - start + length v =\n  for x = start to start +\
    \ length - 1 do a.(x) <- v done\n\nlet filled () =\n  let a = Array.make 100 \"\
    x\" in\n  let start = 20 in\n  let length = 40 in\n  fill a -start -length \"\
    y\"\n  a\n```\n\n你可以看到在 `filled` 中，如果我们恰好有具有相同名称的值，调用函数时的“名称重用”（punning）效果同样很好。当然，这两个功能不需要同时使用。\n\
    \n## 用于部分标记的标签\n\n标记参数的另一个常见用途是在使用部分应用时提供灵活性。考虑以下函数：\n\n```\nlet divide x y =\
    \ x / y\n```\n\n我们可以使用部分应用来编写一个函数，将一万除以列表中的每个数字：\n\n```\nlet f = divide 10000\
    \ in [f 100; f 50; f 20]\n```\n\n这产生了 [100; 200; 500]。但我们无法重用除以列表中的每个数字的除法函数，因为这涉及到部分应用第二个参数\
    \ `y`。`divide` 函数的设计已经内置了哪些参数可以被部分应用（在 OCaml 中，我们可以部分应用参数的任何前缀——第一个、第一个和第二个、第一个和第三等等）。例如，我们可以使用部分应用的\
    \ `List.map` 将同一个函数应用于许多列表，但我们不能通过将列表提供给 `List` 来将参数应用于单个列表。在我们的示例中，我们可以为 `divide`\
    \ 函数的参数标记：\n\n```\nlet divide -x -y = x / y\n```\n\n函数的类型反映了这一点：\n\n```OCOCaml\n\
    # divide -x -y = x / y;;\nval divide : x:int -> y:int -> int = <fun>\n```\n\n\
    现在我们可以按照它们的顺序应用参数：\n\n```OCaml\n# let f = divide -x:10000 in [f 100; f 50; f 20];\n\
    : int list = [100; 200; 500];\n# let f = divide -y:10000 in [f 100000; f 10000;\
    \ f 1000];\n: int list = [10; 1; 0]\n```\n\n事实上，如果我们按顺序应用参数，我们可以省略标签：\n\n```OCaml\n\
    # let f = divide 10000 in [f 100; f 50; f 20];\n: int list = [100; 200; 500]\n\
    ```\n\n## 可选参数\n\nOCaml 还允许我们将标记参数设为可选的——也就是说，完全不需要提供它。被调用的函数可以不提供该参数。考虑以下函数：\n\
    \n```\nsplit : α list -> int -> α list\n```\n\n如果我们将一个标记参数设为可选，那么就不需要提供它了。\n\n\
