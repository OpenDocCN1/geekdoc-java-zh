    interleaved : int lazylist\n\nlet rec lconst n =\n  Cons (n, fun () -> lconst\
    \ n)\n\nlet interleaved =\n  interleave (lconst 0) (lconst 1)\n```\n\n更有趣的例子是计算所有由0\
