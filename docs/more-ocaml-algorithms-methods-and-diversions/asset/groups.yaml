    ```ocaml\nprint_integers : int -> int list -> unit\nlet print_integers w ns =\n\
    \  List.iter (Printf.printf \"%i\" w) ns\n```\n\n## Chapter 9 (Searching for Things)\n\
    \n1\n\nFor the first part, where all matches are considered, we can rewrite search\
    \ with an extra argument to count the matches, restructuring its logic so as not\
    \ to finish upon the first match.\n\n```ocaml\nstring' : int -> int -> string\
    \ -> int\nstring : string -> int -> int\nlet rec search' matches n ss s =\n  if\
    \ String.length ss > String.length s - n then matches else\n  if ss @ 0 n (String.length\
    \ ss)\n    then search' (matches + 1) (n + 1) ss s\n    else search' matches (n\
    \ + 1) s\n\nlet search = search' 0\n```\n\nThere is no need to rewrite the function.\
    \ Now, for the version which considers only non-overlapping matches, we just jump\
    \ by the length of the pattern upon a match.\n\n2\n\nIt is simple to write a function\
    \ which returns the length of the longest prefix at the beginning of a list:\n\
    \n```ocaml\nprefix : a list -> a list -> int\nlet rec p l =\n  match p, l with\n\
    \  ph::pt, lh::lt -> if ph == lh then 1 + prefix lt lt else 0\n  | _ -> 0\n```\n\
    \nNow, we can write a function that keeps track of the position and length of\
    \ the longest prefix found, returning them when the whole list has been searched.\n\
