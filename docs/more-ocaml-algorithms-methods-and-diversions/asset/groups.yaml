    \n# GENERATING PDF DOCUMENTS\n\n# 13. Representing Documents\n\nIn this chapter\
    \ we will define a data type for representing a document. PDF is a structured\
    \ format for describing a variety of graphical and textual data. The PDF format\
    \ itself is large and complex, but we will introduce only the parts required for\
    \ examples. It is relatively easy to write PDF files but harder to read them,\
    \ so we will concentrate on creating PDF data in memory, and then writing them\
    \ to valid files. Here is an example PDF, as it might be displayed in a PDF viewer:\
    \ Hello, World!\n\nHere is the corresponding code, which you would see if you\
    \ opened the PDF file in a plain text editor:\n\n```pdf\n%PDF-1.1\n1 0 obj\n<</Type\
    \ /Page\n/Parent 3 0\n/Resources\n```\n\n```pdf\n<</Font\n<</Type /Subtype /Type1\
    \ /BaseFont /Times-Italic>>>>\n/MediaBox [0 0 595.27595081 841.8897638]\n/Rotate\
    \ 0 /Contents [4 0] >>\nendobj\n2 0 obj\n<</Type /Catalog /Pages 3 0>>\nendobj\n\
    3 0 obj\n<</Type /Pages /Kids [1 0] /Count 1>>\nendobj\n4 0 obj\n<</Length 53>>\n\
    stream\n1 0 1 50 77 cm /F0 36 Tf (Hello, World!) TJ\nendstream\nendobj\nxref\n\
    0 5\n000000000 00055\n000000015 00000\n000000020 00000\n0000000245 00000\n0000000296\
    \ 00000\ntrailer\n<</Size 5 /Root 2 0 R>>\nstartxref\n397\n%%EOF\n```\n\nRather\
    \ complicated, as we can see. Our first job is to define a data type for PDF documents,\
    \ which can then be flattened to the format above when writing a file. The main\
    \ body of a PDF file is a set of nested objects – there are four in the example\
    \ above, from 1 obj to 4 obj. Each one contains some structured data, such as\
    \ the dictionary <</Type /Pages [1 0] /Count 1>> which associates the keys /Type,\
    \ /Kids and /Count to the name /Pages, the array [1 0], and the integer 1 respectively.\
    \ Before the main body is some ancillary data, most of which we do not need to\
    \ hold in our data structure – it is generated upon writing. Here are all the\
    \ kinds of data we use:\n\n- Booleans, like true and false\n- Integers, such as\
    \ 4, 256, -1\n- Floating-point numbers such as 1.585\n- Strings, like (a string)\
    \ which are sequences of characters within parentheses\n- Names, like /Name\n\
    - Ordered arrays of objects as [1 2 4]\n- Dictionaries, which are unordered collections\
    \ of key-value pairs, where the keys are names. For example, <</One 1 /Two 2 /Three\
    \ 3>>.\n- Streams, like object 4 in the example above, which are arbitrary sequences\
    \ of bytes.\n- Indirect references, like 4 R which point to another object by\
    \ its number (here, object 4).\n\nHere is an OCaml type to hold such data:\n\n\
    ```ocaml\ntype pdfobject =\n| Boolean of bool\n| Integer of int\n| Float of float\n\
    | String of string\n| Name of string\n| Array of pdfobject list\n| Dictionary\
    \ of (string * pdfobject) list\n| Stream of pdfobject * string\n| Indirect of\
    \ int\n```\n\nNote that it is recursive, mirroring the structure of the data.\
    \ For object 3 in the example above, which is <</Type /Pages /Kids [1 0 R] /Count\
    \ 1>>, will be represented as:\n\n```ocaml\nDictionary\n([/Type\", Name \"Pages\"\
    ); (\"Kids\", Array [Indirect 1]); (\"Count\", Integer 1])\n```\n\nNow, we need\
    \ a type to represent the whole document, which contains a list of objects, the\
    \ PDF version number (1.1 in the example above), and the trailer dictionary <</Size\
    \ 5 /Root 2 R>>. Everything is generated upon writing. It is traditional to name\
    \ the main type of a t:\n\n```ocaml\ntype t =\n  {\n    version : int * int;\n\
    \    objects : (int * pdfobject) list;\n    trailer : pdfobject\n  }\n```\n\n\
    We put these types into pdf.ml. Here is how we might build an instance of this\
    \ data type representing our example:\n\n```ocaml\nlet hello =\n  {\n    version\
    \ = (1, 1);\n    objects = [\n      (0, Dictionary [\n        (\"Type\", Name\
    \ \"Page\");\n        (\"Parent\", Array [Indirect 3]);\n        (\"Resources\"\
    , Dictionary []]);\n        (\"MediaBox\", Array [Float 0.0; Float 0.0; Float\
    \ 595.27595081; Float 841.8897638]);\n        (\"Rotate\", Integer 0);\n     \
    \   (\"Contents\", Array [Indirect 4])\n      ]);\n      (2, Dictionary [\n  \
    \      (\"Type\", Name \"Catalog\");\n        (\"Pages\", Array [Indirect 3])\n\
    \      ]);\n      (3, Dictionary [\n        (\"Type\", Name \"Pages\");\n    \
    \    (\"Kids\", Array [Indirect 1]);\n        (\"Count\", Integer 1)\n      ]);\n\
    \      (4, Dictionary [\n        (\"Length\", Integer 53);\n        (\"Stream\"\
    , Stream (\"1 0 1 50 770 cm /F0 36 Tf (Hello, World!) TJ\"))\n      ])\n    ];\n\
    \    trailer = Dictionary []\n  }\n```\n\nThe advantage of using this data structure\
    \ as opposed to generating the PDF file directly is that it may be programmatically\
    \ manipulated with ease, using pattern matching and other OCaml techniques. Note\
    \ that the content of the page itself \"1 0 1 50 770 cm BT /F0 36 Tf (Hello, World!)\
    \ TJ\" remains a plain string. We shall look at this separate language soon.\n\
    \nIn the next three chapters, we will learn how to write this representation to\
    \ a file, and add our own text and graphics to the page.\n\n# Questions\n\n- 1.\
    \ Draw the graph of the relationships, via indirect references such as 3 0 R,\
