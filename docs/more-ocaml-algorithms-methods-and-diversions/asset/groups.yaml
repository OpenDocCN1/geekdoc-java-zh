    # 第 2 章 懒惰性\n\n![](img/412ff6f522cd6d58bb984724b97d22e6_26_0.png)\n\n交替合并是公平的，交替的交替同样如此，因此我们看到长度为二的结果顺序为：[0;\
    \ 0] [0; 1] [1; 0] [1; 1]。\n\n# 问题\n\n1. 写出一个元素为数字 1, 2, 4, 8, 16 ... 的懒惰列表。它的类型是什么？\n\
