    \ : sig include SetType end =\nstruct\n  type 'a = Lf | Br of 'a * 'a * 'a\n\n\
    \  let rec list_of_set s =\n    match s with\n    | Lf -> []\n    | Br (l, x,\
    \ r) -> list_of_set l @ [x] @ list_of_set r\n\n  let rec insert x s =\n    match\
    \ s with\n    | Lf -> Br (Lf, x, Lf)\n    | Br (l, y, r) ->\n        if x = y\
    \ then Br (l, y, r)\n        else if x < y then Br (insert x l, y, r)\n      \
    \  else Br (l, y, insert x r)\n\n  let rec set_of_list l =\n    match l with\n\
    \    | [] -> Lf\n    | h::t -> insert h (set_of_list t)\n\n  let rec size s =\n\
    \    match s with\n    | Lf -> 0\n    | Br (l, _, r) -> 1 + size l + size r\n\n\
    \  let rec member x s =\n    match s with\n    | Lf -> false\n    | Br (_, y,\
    \ _) when x = y -> true\n    | Br (l, y, r) -> if x < y then member x l else member\
    \ x r\nend\n```\n\n图 11.3\n\n| 无序 | 有序 | 无序 | 有序 |\n| --- | --- | --- | --- |\n\
    | （用列表表示集合） | | （用树表示集合） | |\n| 插入 | 20.4s | 17.5s | 0.09s | 116.6s |\n| 成员检查\
    \ | 34.8s | 17.8s | 0.02s | 33.4s |\n| 元素 | 0s | 0s | 0.02s | 98.0s |\n| 大小 |\
    \ 0s | 0s | 0s | 0s |\n\n注意，在无序情况下，插入和成员检查的性能极大提升，大约提高了两倍。然而，如果元素是顺序插入的，不平衡的树构建时间比其等效列表更长。在有序情况下，以列表形式找到所有元素也花费大量时间。\n\
    \n## 平衡树\n\n我们已经看到，二叉搜索树只有在相当接近平衡时才有用。在最近几十年中，开发了几种数据结构，试图保持二叉树“相当平衡”，以便操作保持保持高效。红黑树由\
    \ Rudolf Bayer 发明，这里的函数式表示归于 Chris Okasaki 他的里程碑式著作《纯函数式数据结构》（Cambridge University\
    \ Press, 1998）。\n\n红黑树是一种普通的二叉树，增加了一个属性：每个节点要么是红色要么是黑色。叶子节点被认为是黑色。通过每个改变树的操作（在我们例中，只有\
    \ `insert`）来确保平衡，使得以下条件保持成立：\n\n- 每个红色节点的子节点都是黑色的；\n- 从根到叶的每条路径包含相同数量的黑色节点——从根到叶的最长路径（黑、红、黑、红\
    \ ... 黑）长度不会超过最短路径（黑、黑、黑 ... 黑）的两倍。因此，红黑树的最大深度与集合中元素数量的对数成比例。这是一个有效的红黑树示例，每条路径有\
    \ 3 个黑色节点：\n\n![](img/412ff6f522cd6d58bb984724b97d22e6_96_0.png)\n\n是表示红黑树的类型，我们为树的每个分支添加了颜色：\n\
    \n```ocaml\ntype colour = R | B\ntype 'a t = Lf | Br of colour * 'a t * 'a\n```\n\
    \n`list_of_set`、`size` 和 `member` 函数是简单的：它们忽略了颜色字段。然而，`insert` 函数必须修改以保持红黑属性。在普通二叉树中，`insert`\
    \ 添加的新节点将是叶子节点。将其涂为红色以确保没有路径的黑色节点数量不同。但这可能会破坏另一个不变性（即没有红色父节点）。事实证明，通过考虑新插入节点的父节点和祖父，执行简单操作并可能向上继续这一过程，可以恢复不变性。下图图示了这一过程：\n\
    \n![](img/412ff6f522cd6d58bb984724b97d22e6.png)\n\n在每种情况下，节点 $x, y$ 和子树 $\\alpha,\
    \ \\beta, \\gamma$ 都保持不变，因此树的不不变性得到了保留。模式匹配在这里非常优雅，因为除了一种情况外，所有的结果都相同：\n\n```ocaml\n\
    balance : colour * 'a t * 'a * 'a t -> 'a t\nlet balance t =\n  match t with\n\
    \  | (B, R (Br (R, a, x), b), y, c), d) -> Br (R, Br (B, a, x), y, Br (B, b, c),\
    \ d)\n  | (B, R (a, x, Br (R, b, c)), d) -> Br (R, Br (B, a, x), y, Br (B, b,\
    \ c), d)\n  | (B, Br (R, a, x), y, b), c, d) -> Br (R, Br (B, a, x), y, Br (B,\
    \ b, c), d)\n  | (B, Br (a, x, Br (R, b, c)), d) -> Br (R, Br (B, a, x), y, Br\
    \ (B, b, c), d)\n  | _ -> t\n```\n\n现在，我们可以编写插入函数本身：\n\n```ocaml\ninsert_inner\
    \ : 'a -> colour * 'a t * 'a * 'a t -> 'a t\nlet rec insert_inner x c s =\n  match\
    \ s with\n  | Lf -> Br (c, Lf, x, Lf)\n  | Br (c, l, y, r) ->\n      if x < y\
    \ then balance (c, insert_inner x c l, y, r)\n      else if x > y then balance\
    \ (c, l, y, insert_inner x c r)\n      else Br (c, l, y, r)\n\nlet insert x s\
    \ =\n  match s with\n  | (_, l, y, r) -> Br (B, l, y, r)\n```\n\n注意我们包装了一个函数来将树的根设置为黑色，因为根没有父节点或祖父节点，否则可能会得到带有红色子节点的根。由于我们保证了树将是平衡的，即使对于巨大的集合也不需要尾递归函数。平衡树对性能的影响显而易见，且与复杂的红黑数据结构相比下降很小或没有下降：\n\
    \n| 无序 | 有序 | 无序 | 有序 |\n|---|---|---|---|\n| （用列表表示） | | （用树表示） | |\n| 插入 | 20.4s\
    \ | 17.5s | 0.09s | 116.6s |\n| 成员检查 | 34.8s | 17.8s | 0.02s | 33.4s |\n| 元素 |\
    \ 0s | 0s | 0.02s | 98.0s |\n| 大小 | 0s | 0s | 0s | 0s |\n\n| 无序 | 有序 |\n|---|---|\n\
    | （用红黑树表示） | |\n| 插入 | 0.11s | 0.05s |\n| 成员检查 | 0.02s | 0.02s |\n| 元素 | 0.03s\
    \ | 0.01s |\n| 大小 | 0s | 0s |\n\n```ocaml\nmodule SetRedBlack : sig include SetType\
    \ end =\nstruct\n  type colour = R | B\n  type 'a t = Lf | Br of colour * 'a t\
    \ * 'a * 'a t\n\n  let rec list_of_set s =\n    match s with\n    | Lf -> []\n\
    \    | Br (_, l, x, r) -> x :: list_of_set l @ list_of_set r\n\n  let balance\
    \ t =\n    match t with\n    | (B, R (Br (R, a, x), b), y, c), d) -> Br (R, Br\
    \ (B, a, x), y, Br (B, b, c), d)\n    | (B, R (a, x, Br (R, b, c)), d) -> Br (R,\
    \ Br (B, a, x), y, Br (B, b, c), d)\n    | (B, Br (R, a, x), y, b), c, d) -> Br\
    \ (R, Br (B, a, x), y, Br (B, b, c), d)\n    | (B, Br (a, x, Br (R, b, c)), d)\
    \ -> Br (R, Br (B, a, x), y, Br (B, b, c), d)\n    | _ -> t\n\n  let rec insert_inner\
    \ x c s =\n    match s with\n    | Lf -> Br (c, Lf, x, Lf)\n    | Br (c, l, y,\
    \ r) ->\n      if x < y then balance (c, insert_inner x c l, y, r)\n      else\
    \ if x > y then balance (c, l, y, insert_inner x c r)\n      else Br (c, l, y,\
    \ r)\n\n  let insert x s =\n    match s with\n    | (_, l, y, r) -> Br (B, l,\
    \ y, r)\n    | Lf -> assert false\n\n  let rec set_of_list l =\n    match l with\n\
    \    | [] -> Lf\n    | h::t -> insert h (set_of_list t)\n\n  let rec size s =\n\
    \    match s with\n    | Lf -> 0\n    | Br (_, l, _, r) -> 1 + size l + size r\n\
    \n  let rec member x s =\n    match s with\n    | Lf -> false\n    | Br (_, l,\
    \ y, r) ->\n        x = y || if x > y then member x r else member x l\nend\n```\n\
    \n"
