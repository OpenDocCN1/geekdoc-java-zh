    blit : Buffer.t → string → off:int → len:int → unit\nadd_substring : Buffer.t\
    \ → string → off:int → len:int → unit\n\nlet sub b off len =\n  blit b off len\n\
    \nlet blit src dst len =\n  blit src dst len\n\nlet add_substring b s len =\n\
    \  add_substring b s len\n```\n\n4\n\nWe can make the accumulator an optional\
    \ argument. Now the caller can call the function as if it were the same as List.map.\n\
    \n```ocaml\nmap : ?a:α list → (α) → α list\nlet rec map ?a = [] f =\n  match l\
    \ with\n    [] -> a\n    | h::t -> ...\n```\n\nThe optional argument must still\
    \ appear in the interface, of course, so we might prefer the old approach of wrapping\
    \ it up and only exposing the wrapper.\n\n## Chapter 8 (Formatted Printing)\n\n\
    1\n\nWe use Printf.bprintf to accumulate the individual parts, making sure to\
    \ deal with the final element specially. The outer function sets everything up.\n\
    \n```ocaml\ncycle_of_points_inner : Buffer.t → (int × int) list → string\ncycle_of_points\
    \ : (int × int) list → string\n\nlet rec cycle_of_points_inner b l =\n  match\
    \ l with\n    [] ->\n      Buffer.contents b\n    | [(x, y)] ->\n      Printf.bprintf\
    \ b \"%i, %i\" x y;\n      Buffer.contents b\n    | (x, y):t ->\n      Printf.bprintf\
    \ b \"%i, %i\" x y;\n      cycle_of_points_inner b t\n\nlet cycle_of_points l\
    \ =\n  match l with\n    [] -> \"\"\n    | h:t ->\n      cycle_of_points_inner\
    \ (Buffer.create 256) (h :: t)\n```\n\n2\n\nAgain, Printf.bprintf is the key.\
    \ This time, we can calculate the initial buffer size exactly.\n\n```ocaml\nhex_of_string\
    \ : string -> string\nlet hex_of_string s =\n  let b = Buffer.create (String.length\
    \ s * 2) in\n  String.iter\n    (fun c -> Printf.bprintf b \"%02X\" (int_of_char\
    \ c))\n    s;\n  Buffer.contents b\n```\n\nWe have used a width of 2 and the 0\
    \ flag to make sure that characters with code 0..15 are padded with a zero.\n\n\
    3\n\nThe format string for Printf.printf must be known at compile time. The solution\
    \ for printing the result of mkstring using printf is the %s format specification:\n\
    \n```ocaml\nPrintf.printf \"%s\" (mkstring ())\n```\n\n4\n\n* character can be\
    \ used as a width or precision specifier, to indicate that the width or precision\
    \ is given as an argument. We use * for the width, and pass in 10.\n\n```ocaml\n\
    Printf.sprintf \"%i\" 10 1\n```\n\nSo, the result is:\n\n(1)\n\nWe can use List.integers\
