    \ len_p (List.tl l) (len_l - 1)\n\nlet search_list p =\n  search_list_inner p\
    \ (List.length p) l (List.length l)\n```\n\n现在，`List.length` 只在开始时调用一次。我们也可以通过编写一个显式函数来移除\
    \ `Util.take` 以避免构建中间列表，该函数测试模式与列表中前 `len.p` 个元素的匹配：\n\n```ocaml\nequal : α list\
    \ -> int -> α list -> bool\nsearch_list_inner : α list -> int -> α list -> int\
    \ -> bool\nsearch_list : α list -> α list -> bool\n\nlet rec equal l len p =\n\
    \  if len = 0 then true\n  else List.hd l = List.hd equal (List.tl l) (len - 1)\
    \ (List.tl p)\n\nlet rec search_list_inner len_p len_l =\n  len_p <= len_l\n \
    \ &&\n  (equal l len_p p ||\n  search_list_inner len_p (List.tl l) (len_l - 1))\n\
    \nlet search_list p =\n  search_list_inner p (List.length p) l (List.length l)\n\
    ```\n\n这已经是我们简单方法能达到的效率了。\n\n# 在字符串中查找\n\n在实际应用中，我们经常需要在字符串或其他类似的随机访问结构中查找。我们的第一个列表版本可以很容易扩展：\n\
    \n```ocaml\nsearch : string -> string -> bool\nlet rec search p s =\n  String.length\
    \ p <= String.length s\n  && String.sub s 0 (String.length p) = p ||\n  search\
    \ p (String.sub s 1 (String.length s - 1))\n```\n\n这一次，字符串长度没有问题，因为与 `List.length`\
    \ 不同，它在常数时间内运行。我们确实有第一个 `String.sub` 的开销，类似于该版本中的 `Util.take`。第二个 `String.sub`\
    \ 也是一个问题，与 `List.tl` 不同，它创建一个新字符串。\n\n为了解决这个问题，我们可以定义一个辅助函数，在给定模式、字符串 `s` 和要测试的长度\
    \ `l`，以及模式中的位置 `p` 和主字符串中的位置 `sp` 时，测试相等性。这与我们在列表示例中的 `equal` 相似\n\n```ocaml\n\
    at : string -> int -> string -> int -> bool\nsearch' : int -> string -> string\
    \ -> bool\nsearch' : string -> string -> bool\nlet rec search' at p pp sp l =\n\
    \  l = 0 || p.[pp] = s.[sp] && at p (pp + 1) s (sp + 1) (l - 1)\nlet rec search'\
    \ n p s =\n  String.length p <= String.length s - n\n  &&\n  (at p 0 n (String.length\
    \ p) || search' (n + 1) p s)\nlet search = search' 0\n```\n\n查找函数本身有一个计数器，记录它在主字符串中的所在位置。我们在\
    \ `search` 中将其初始化为零。\n\n# 更灵活的查找\n\n通过允许使用某些特殊字符，让我们的查找函数更有趣。我们将只引入这些简单的结构：\n\n\
    -   `?` 匹配后续字符的零或一次实例。例如，模式 `?abc` 匹配 `ab`、`bc` 和 `dbc`；\n-   `*` 字符匹配后续字符的零或多个实例。因此，模式\
    \ `*abc` 匹配 `bc`、`abc` 和 `aabc`；\n-   `+` 字符匹配后续字符的一个或多个实例。例如，模式 `+abc` 匹配 `abc`\
    \ 和 `aabc`，但不匹配 `bc` 或 `dbc`。\n\n让我们先添加 `?` 字符。首先，我们必须修改查找函数的终止条件——我们不能再在模式比字符串剩余部分长时就结束——模式的长度与匹配该模式的字符长度不再总是相等的。现在，当位置\
    \ `n` 小于字符串长度时，或者它等于字符串长度且长度为零（以便模式匹配空字符串）时，我们继续。\n\n```ocaml\nsearch' : int ->\
    \ string -> string -> bool\nsearch : string -> string -> bool\n\nlet rec search'\
    \ n p s =\n  (n < String.length s || (n = 0 && String.length s = 0)) &&\n  (at\
    \ p 0 n s || search' (n + 1) p s)\nlet search = search' 0\n```\n\n现在我们可以修改 `at`\
    \ 函数了。如果我们有一个初始终止条件——如果模式已完全用尽，那么我们已经匹配成功。否则，我们必须匹配模式中的下一个字符，或者如果模式匹配则查看下一部分，如果匹配了，计算\
    \ `jump.p`（在模式中向前移动的量）和 `jump.s`（在字符串中向前移动的量）。\n\n```ocaml\nat : string -> int\
    \ -> string -> int -> bool\nlet rec at p pp sp =\n  pp > String.length p - 1 ||\n\
    \  match p.[pp] with\n  | '?' ->\n      if pp + 1 > String.length p then None\n\
    \      else if sp > String.length s - 1 then Some (0, 0)\n      else if p.[pp+1]\
    \ = s.[sp] then Some (1, 1)\n      else Some (0, 0)\n  | c ->\n      if sp < String.length\
    \ s && c = s.[sp] then Some (0, 1)\n      else None\n```\n\n仔细注意 `*` 用例的行为，关于此规范——匹配可能是微妙的。为了处理这个问题，我们有一种匹配字符零或多个实例的方法，尽可能地在字符串上移动。下面的\
    \ `swallow_all` 在给定字符 `c`、字符串 `p` 和位置时，尽可能在字符串上移动。`swallow_all` 在 `sp` 处匹配零或多个实例的方法。`*`\
    \ 可以通过 `swallow_all` 来添加，如图 9.1 所示。\n\n```ocaml\nswallow_all : char -> string\
    \ -> int -> int\nat : string -> string -> bool\n\nlet swallow_all c p sp =\n \
    \ let x = ref sp in\n  while x < String.length p && p.[x] = c do x := !x + 1;\n\
    \  !x\n\nlet rec at p pp sp =\n  pp > String.length p - 1 ||\n  match p.[pp] with\n\
    \  | '?' ->\n      if pp + 1 > String.length p then None\n      else if sp > String.length\
    \ s - 1 then Some (0, 0)\n      else if p.[pp+1] = s.[sp] then Some (1, 1)\n \
    \     else Some (0, 0)\n  | '*' ->\n      if pp + 1 > String.length p then None\n\
    \      else Some (2, swallow_all c p sp)\n  | c ->\n      if sp < String.length\
    \ s && c = s.[sp] then Some (0, 1)\n      else None\n```\n\n图 9.1\n\n```ocaml\n\
    swallow_all : char -> string -> int -> int\nat : string -> string -> bool\nsearch'\
