    \ : output_bits -> Int32.t -> int -> unit\n\nlet putval_32 o v l =\n  for x =\
    \ l - 1 downto o do\n    putbit o\n    (Int32.to_int\n    (Int32.logand v (Int32.shift_left\
    \ (Int32.of_int x) 1)))\n  done\n```\n\n## 5\n\n我们添加了一个 `rewind` 字段，如果可能的话，它将输出位置向后移动一个字节。这是新的类型：\n\
    \n```ocaml\ntype output =\n{output_char : char -> unit;\nrewind : unit -> unit;\n\
    out_channel_length : length -> unit_of int}\n```\n\n现在我们可以为这个新类型重写 `output_of_string`：\n\
    \n```ocaml\noutput_of_string : string -> output\n\nlet output_of_string s =\n\
    \  let pos = ref 0 in\n  {output_char = char ->\n    (fun c ->\n      if !pos\
    \ < String.length s\n      then (s![!pos] <- c; pos := !pos + 1)\n      else raise\
    \ End_of_file);\n    rewind = (fun () ->\n      if !pos > 0\n      then pos :=\
    \ !pos - 1\n      else raise (Failure \"rewind\"));\n    out_channel_length =\n\
    \      (fun () -> String.length s)}\n  rewind = ()\n```\n\n我们适当修改了 `putbit`：\n\
    \n```ocaml\nputbit : output_bits -> int -> unit\n\nlet rec putbit o b =\n  if\
    \ o.obit = (-1) then\n    begin\n      o.obyte <- 0;\n      o.obit <- 7;\n   \
    \   putbit o b\n    end\n  else\n    begin\n      if b <> 0 then o.obyte <- o.obit\
    \ lor (1 lsl o.obit);\n      o.output.char (char_of_int o.obyte);\n      o.output.rewind\
    \ ();\n      o.obit <- o.obit - 1\n    end\n```\n\n## 第 6 章（数据压缩）\n\n### 1\n\n\
    我们需要遍历整数（字节）输入列表，寻找相同和不同的连续（runs），并构建一个新的列表。为了清晰起见，我们将使用一个新类型生成输出运行，稍后再生成实际字节：\n\
    \n```ocaml\ntype run = Same of int * int | Diff of int list\n```\n\n`Same` 情况适用于\
    \ (长度, 值) 对，而 `Diff` 只是一个字节列表。现在我们可以写一个函数 `get_same same`，给定第一个值、当前计数和列表，它返回一个包含相同字符最终计数和剩余列表的对：\n\
    \n```ocaml\nget_same : alpha -> int -> alpha list -> int * alpha list\nlet rec\
    \ get_same x n l =\n  match l with\n  | h::t when h = x -> get_same x (n + 1)\
    \ t\n  | _ -> (n, l)\n```\n\n同样，我们可以定义一个函数将不同的运行读取到累加器中，返回该运行和剩余列表。此函数仅在 `get_same`\
    \ 返回长度为一的运行运行时才被调用。\n\n```ocaml\nget_different : α → α → α list × α list\n\nlet\
    \ rec get_different a l =\n  match l with\n  [] -> (List.rev a, [])\n  | h:t ->\n\
    \      if a = [] then get_different [h] t\n      else if h < List.hd a then get_different\
    \ (h :: a) t\n      else (List.rev (h :: a), l)\n```\n\n现在我们可以写一个函数，将这两个函数应用到一个运行运行，创建我们的数据类型：\n\
    \n```ocaml\ngetrun : int list → run × int list\n\nlet getrun l =\n  match l with\n\
    \  [] -> raise (Invalid_argument \"getrun\")\n  | h::t ->\n      match get_same\
    \ h 0 t with\n      | 1, rest -> let diff, rest = get_difference [] rest in (Diff\
    \ diff, rest)\n      | n, rest -> (Same n, rest)\n```现在使用定义的规则从运行创建一个字节列表：\n\n\
    ```ocaml\nchars_of_run : run → int list\n\nlet chars_of_run r =\n  match r with\n\
    \  Same (length, c) -> [257 - length; c]\n  | Diff chars -> chars\n```完成这一切后，很容易定义一个压缩函数，它在处理完所有数据后拼接运行。我们必须在末尾添加\
    \ EOD 标记。\n\n```ocaml\ncompress_inner : run list -> int list -> int list\ncompress\
    \ : int list -> int list\n\nlet rec compress_inner a l =\n  match l with\n  []\
    \ -> List.concat (List.map chars_of_run (List.rev a))\n  | run, rest -> compress_inner\
    \ (run :: a) rest\n\nlet compress l = compress_inner [] l\n```解压缩较少，使用我们 `Util`\
    \ 模块中的 `take` 和 `drop` 函数读取每个运行并展开为列表，直到数据结束。\n\n```ocaml\ndecompress_inner :\
    \ int list -> int list -> int list\ndecompress : int list -> int list\n\nlet rec\
    \ decompress_inner a l =\n  match l with\n  [128] -> List.concat (List.rev a)\n\
    \  | [] -> raise (Invalid_argument \"decompress_inner\")\n  | h::t ->\n      if\
    \ h < 127 then\n        let bytes = Util.take (h :: t) (h + 1) in\n        let\
    \ rest = Util.drop (h :: t) (h + 1) in\n        decompress_inner (bytes :: a)\
    \ rest\n      else if h > 128 then\n        decompress_inner (Array.to_list (257\
    \ - h) t) :: a\n      else\n        decompress_inner a []\n\nlet decompress l\
    \ = decompress_inner [] l\n```注意一个小技巧——树在它的分支中不携带信息（因为有另一个代码）。叶子可以携带或不携带信息，取决于那里是否有代码。为了避免\
    \ `option` 类型，我们可以将其分为三种情况：`Lf` 表示空叶子，`Code` 表示完整的，`Br` 表示分支，其中 0 向左，1 向右。\n\n\
    ```ocaml\ntype tree = Lf | Code of int | Br of tree * tree\n```现在我们可以定义向现有树添加的函数。例如，`add.elt\
    \ Lf ([0; 1], 67)` 为长度 67 添加代码 `[0; 1]`。这将构建树 `Br (Br Lf, Code 67)`。我们匹配代码以在向左或向右移动时构建树。\n\
    \n```ocaml\nadd.elt : tree -> int list -> tree\nlet rec add.elt tr (l, n) =\n\
    \  match l with\n  0::m ->\n    begin match tr with\n      Lf -> Br (add.elt Lf\
    \ (m, n), Lf)\n      | Br (left, right) -> Br (add.elt left (m, n), right)\n \
    \     | Code x -> raise (Failure \"collision\")\n    end\n  1::m ->\n    begin\
    \ match tr with\n      Lf -> Br (Lf, add.elt Lf (m, n))\n      | Br (left, right)\
    \ -> Br (left, add.elt right (m, n))\n      | Code x -> raise (Failure \"collision\"\
    )\n    end\n  [] -> Code n\n  | -> raise (Failure \"bad code\")\n```现在，为了构建树，我们只需使用\
    \ `fold.left` 重复插入已构建的 (代码, 运行长度) 对：\n\n```ocaml\nmake_tree : int list -> int\
    \ list -> tree\n\nlet make_tree arr numbers =\n  List.fold.left\n    add.elt\n\
    \    Lf\n  (List.combine (Array.to_list arr)) numbers\n```现在，例如，我们可以将终止代码构建为树：\n\
    \n```ocaml\nwhite_terminating_tree : tree\n\nlet white_terminating_tree =\n  make_tree\n\
    \    white_terminating_codes\n    (Util.from 0 (Array.length white_terminating_codes\
    \ - 1))\n````Util.from a b` 给出从 a 开始到 b 结束的升数字列表。函数执行成功，验证了没有冲突，并产生：\n\n```\n\
