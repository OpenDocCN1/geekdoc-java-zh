    # fold_right : (α → β → β) → α list → β → β


    ```

    fold.right f l e =

    fold.left (fun x y -> f y x) e (List.rev l)

    ```


    Sometimes we want to provide an initial accumulator value which is not the identity
    element for the computation. For example, applying :: over an input list with
    fold.right is not very interesting, yielding a function which returns a α : →
    α of its input:


    ```

    copy : α list → α list

    let copy l =

    fold.right (fun e a -> e ::) l []

    ```


    But if we use a non-empty list as the initial value of the accumulator, we have
    the function:


    ```

    append : α list → α list → α list

    let append x y =

    fold.right (fun e a -> e :: a) x y

    ```


    We can use a more complicated accumulator, such as a tuple. In this example, we
    replicate the List.split function which, given a list of pairs, yields a pair
    of lists:


    ```

    split : (α × β) → α list → list × β list

    let split l =

    fold.right

    (fun (x, y) (xs, ys) -> (x :: xs, y :: ys))

    l

    ([], [])

    ```


    For example, split [(1, "one"); (2, "two")] evaluates to ([1; 2], ["one"; "two"]).


    # A word of caution


    One very simple definition for the function concat which concatenates all lists
    in a list of lists is given by:


    ```

    concat : α list → α list

    let concat l = fold.left (@ ) [] l

    ```'
