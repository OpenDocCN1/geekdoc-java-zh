    0011000000110000001100000011000000110000001100000011000000\n0011000000110000001100000011000000110000001100000011000000\n\
    0011000000110000001100000011000000110000001100000011000000\n000101010101010101010101010101010101010101010101010101010001\n\
    00000000000\"\n```\n\n## Preliminaries\n\nFirst, we define a function to convert\
    \ the string of zeros and ones to a string containing actual binary data. We can\
    \ do this by using an output buffer. Then, after flushing, we can use Buffer to\
    \ extract the data. Note, since width will always be a number (e.g., 80) and height\
    \ (e.g., 21) of the image, the compressor will work. The reason for distinguishing\
    \ between white and black is simple.\n\n```ocaml\npacked_string_of_string : string\
    \ -> string\nlet packed_string_of_string s =\n  let b = Buffer.create (String.length\
    \ s / 8) in\n  let rec loop i count byte =\n    if i < String.length s then\n\
    \      let char = String.char s i in\n      if char = '1' then\n        loop (i\
    \ + 1) (count + 1) (byte + (1 shl count))\n      else\n        if count > 0 then\
    \ (\n          Buffer.add_char b (char_of_int byte);\n          loop (i + 1) 0\
    \ 0\n        else\n          loop (i + 1) count byte\n    else\n      if count\
    \ > 0 then\n        Buffer.add_char b (char_of_int byte)\n  in\n  loop 0 0 0;\n\
