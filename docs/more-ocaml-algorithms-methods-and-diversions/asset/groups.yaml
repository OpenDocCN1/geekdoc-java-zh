    # Chapter 2


    # Being Lazy


    We can make our own data type for OCaml''s built-in lists like this:


    ```

    type ''a list = Nil | Cons of ''a * ''a list

    ```


    The constructor Nil represents the empty list, and Cons builds a list from a head
    and a tail. So, for example, we can write the list [1; 2; 3] as Cons (1, Cons
    (2, Cons (3, Nil))). It is also possible to define an infinitely-long list, where
    elements are only produced when we actually need them. This is known as a lazy
    list. Instead of a tail, we use a tail function. This is a function which, given
    a unit value, yields the tail.


    ```

    type ''a lazylist = Cons of ''a * (unit -> ''a lazylist)

    ```


    Note that we have a choice - we could use any type, unit is the simplest type,
    containing only one value. How do we use such a creature? Our use of unit rather
    than another type is simple. Let us start by writing a function which, given an
    integer n, builds the lazy list of all integers n, n+1, n+2... and returns it:


    ```

    lseq : int -> lazylist

    let rec lseq n = Cons (n, fun () -> lseq (n + 1))

    ```


    When we write this in the OCaml top level, here is what we see:


    ```

    # lseq 0;

    : int lazylist = Cons (0, <fun>)

    ```


    We can see that the head of the list is zero - the rest is yet to be calculated.
    OCaml represents the tail function with <fun>. We can now now write functions
    to extract elements from the list. Here are lazy head and tail functions:'
