    Lists and the ::cons" symbol may be used for pattern matching to distinguish lists
    of length zero, one, etc and with particulars. For example, we can calculate the
    length of a list:


    ```

    let rec fx y =

    if y < x then f (2 * y) else y

    let g z = f 1

    ```


    ```

    let rec length =

    match l

    | [] -> 0

    | ::t -> 1 + length t

    ```


    # Exceptions


    Mutually recursive functions, introduced by writing **let rec f = ... and g =
    ... and**


    Defining exceptions with **exception name**. They can carry extra information
    by adding **of type**. Raising exceptions with **try**. Handling exceptions with
    **try ... with ...**


    # Pattern Matching


    ```

    exception Problem of int

    let fx y =

    if y = 0

    then raise (Problem x)

    el x / y

    ```


    Matching patterns using **match expression1 with pattern1 -> ... | pattern2 ->
    ... | expression3 ...**. The expressions expression2, expression3 etc must have
    the same type as one another, and this is the type of the whole **match ... with
    expression**. The special **match x** matches anything.


    ```

    match x

    0 -> 1

    | 1 | 2 -> 3

    | - -> 4

    ```


    Matching two or more things at once, using commas to separate it in **match a,
    b with b, 0 -> expression1 | x, y -> expression2 | ...**


    ```

    match x, y, z

    0, 0, 0 -> true

    | _, _ -> false

    ```


    # Partial Application


    Partial application of functions by giving fewer than the number of arguments.
    Partial application with functions from builders.


    ```

    let add x y = x + y

    List.map ( + 3 ) [1; 2; 3]

    => [4; 5; 6]

    ```


    # Lists


    Lists, which are ordered collections of zero or more elements like type. They
    are written between square brackets, elements separated by colons: e.g. [1; 2;
    3; 4]. If a list is non-empty, it has a head, which is its first element, and
    a tail, which is the list composed of the rest of elements.


    The :: operator, which adds an element to the front of a list. The "append" operator,
    which concatenates two lists together.


    ```

    1 :: [2; 3] => [1; 2; 3]

    [1; 2] @ [3] => [1; 2; 3]

    ```


    # New Types


    New types with **type name = constructor1 of type1 | constructor2 of type2 | ...**.
    Pattern matching on them with the built-in types. Polymorphic types.


    ```

    type colour =

    Red | Blue | Green | Grey of int

    ```'
