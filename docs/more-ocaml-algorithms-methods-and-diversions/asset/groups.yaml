    \ X, Y, Z, AA, AB, ..., AAA, ... 写出表示此序列的懒惰列表。\n\n# 第 3 章 带记录的命名元组\n\n元组可以用于组合固定数量的相同或不同类型的元素。然而，一旦项目超过两个或三个，记住顺序可能会困难。记录（Records）解决了这个问题，允许我们为每个项目命名。由于这种命名，它们具有几个实用的属性，可以将它们与元组区分开。让我们为二维笛卡尔坐标定义一个简单的类型：\n\
