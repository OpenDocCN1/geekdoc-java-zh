    \ (List.length l) in\n    List.iter (fun x () -> Hashtbl.add s x ()) l;\n    s\n\
    \n  let member x s = Hashtbl.mem s x\n\n  let insert x s =\n    if not (member\
    \ x s) then Hashtbl.add s x ()\n    s\n\n  let size = Hashtbl.length\nend\n```\n\
    图 11.5\n\n## 11. 制作集合\n\n## 问题\n\n- 1. 比较我们的集合表示在创建和存储它们时所需的内存。你可以使用 `gc` 模块的函数来找出在每种表示前后分配了多少字。\n\
