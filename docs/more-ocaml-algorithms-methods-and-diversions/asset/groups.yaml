    ```\n\nFor simplicity, we do not worry about padding at the end (in our example,\
    \ the width is 80, it will consist of whole numbers anyway).\n\n# Fax compression\
    \ explained\n\nWe said that the compression will proceed by encoding the lengths\
    \ of the runs of zeros and ones in our data. How do we encode them? We need a\
    \ set of binary sequences which can be distinguished from one another (no sequence\
    \ can be a prefix of another sequence). In the case of fax compression, there\
    \ are codes for runs 0 to 63, and different codes for white and black, as shown\
    \ in Figure 6-2. Notice that no white symbol is a prefix of another white symbol,\
    \ and no black symbol is a prefix of another black symbol. Codes for runs from\
    \ 0 to 63 are terminating codes. When a run is longer, we use a “make-up code”,\
    \ shown in Figure 6-3, followed by a terminating code. The longest run is of length\
    \ 1728 + 63 = 1791.\n\nThe reason for distinguishing between white and black codes\
    \ is in unreliable transport mechanisms (such as phone lines that fax machines\
