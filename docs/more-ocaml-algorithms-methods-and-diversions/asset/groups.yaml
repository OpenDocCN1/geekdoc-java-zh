    # Answers to Questions


    ```

    typeset_line_at : float -> string -> float Pdfpage.t list

    let typeset_line_at spacing line y =

    Pdfpage.BeginText;

    pdfpage.SetCharacterSpacing spacing;

    pdfpage.SetTextPosition(margin, y);

    pdfpage.SetFontSize("/F0", font_size);

    pdfpage.ShowText line;

    pdfpage.EndText()]

    ```


    The spacing is calculated as prescribed, only for Full lines:


    ```

    calculate_spacing : float -> string -> float

    let calculate_spacing width line =

    match line with

    Full s =

    float (width String.length s) /

    float (String.length s - 1) *. font_size *. (3./ 5)

    Partial s -> 0.

    ```


    In a revised typeset_page, we can calculate the correct spacings, passing them
    to typeset_line_at:


    ```

    typeset_page : string -> Pdfpage.t list

    let typeset_page text =

    let words = words.of_input (Input.of_string text) in

    let ls = let max_chars -indent:0 words in

    let spacings = List.map(calculate_spacing max_chars) ls in

    let positions =

    downFrom

    (font_size *. line_spacing)

    (page_height - margin -. line_spacing) (List.length ls) in

    List.concat

    (List.map3 typeset_line_at spacings (clean_lines ls) positions)

    ```


    Here is an example page. You can see that the lines are fully justified – flush
    to the left and right margins.'
