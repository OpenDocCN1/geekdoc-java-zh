    This chapter contains a summary of each OCaml construct used in the book, OCaml
    syntax not contained in this chapter will be introduced as and when they needed
    throughout the rest of the book. Existing OCaml programmers may skip this chapter.


    # ## Simple Data Types


    Integers int ... - -3 -2 -1 0 1 2 3 ... max_int of type int. Booleans true and
    false of type bool. Characters of type char like '' '' and ''!''.


