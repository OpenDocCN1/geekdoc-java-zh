  md: '# QA & Java Automation Engineer Survival Guide


    16. Web Services Testing and SoapUI Tool


    # 514. What is meant by API? How do you describe APIs or characteristics of APIs?


    +   - The API stands for "Application Programming Interface."

    - These are in the form of classes and libraries (jar files in Java). The objective
    of APIs is to share the common functionality for building some other end-user
    applications software.


    +   - Most of the time, these APIs provide generic and specific targeted services
    and require programming skills to use the APIs. For example, Java APIs, C APIs,
    C++ APIs for targeted services/functionality/use cases. Another example is Selenium
    WebDriver API is to automate the browser actions.


    +   - There is no GUI interface in APIs. That means the end user of the applications
    can''t interact directly with APIs.


    +   - From the testing point of view, API tests are functional and end-to-end
    test scenarios and not unit testing scenarios.


    +   - Typically, the APIs will be tested by Quality Team because of end-to-end
    scenarios.


    +   - Even though, these are low-level APIs but are mostly considered as black
    box because these are consumed by other vendors/customers who will be using in
    their software solutions.


    +   - Test Frameworks for API testing are similar to unit testing because APIs
    testing falls in similar requirements as unit testing. Examples frameworks are
    TestNG and Tshirt for Java programming environment.


    +   - The APIs can produce either direct results, perform updates, create data
    structures, generate events, exceptions, etc.


    +   - In testing, the focus would be more on the API method parameters, conditions,
    scenarios, procedures, triggers, exceptions, etc. based on the APIs functionality.'
