  md: '# QA & Java Automation Engineer Survival Guide

    16. Web Services Testing and SoapUI Tool


    510. What is a SOAP based web service?


    +   - SOAP stands for "Simple Object Access Protocol."

    - The SOAP WS are Platform, Language and transport neutral.

    - These are the de-facto standard for distributed Web services.

    - SOAP WS are more secure and reliable used in SOA (Service-Oriented Architecture)

    - The SOAP-based WS were started with the goals of simple and use. But became
    heavyweight and complex because of more and more extensions like WS-* (WS-Security,
    WS-Addressing, etc.) were added to the standards.

    - SOAP WS are the true alternative to old CORBA, DCOM and EJB distributed technologies.

    - Key elements are WSDL, SOAP XML as payload, for publishing and discovery the
    services.


    511. What is the transport protocol used for SOAP web services? And what is the
    Payload?


    +   - The SOAP protocol is XML over HTTP (over TCP/IP).

    - The default SOAP WS payload is SOAP XML.


    512. What are different versions available in SOAP? What is the latest?


    +   - There are two major versions and SOAP 2.0 is the latest

    - i) SOAP 1.1

    - ii) SOAP 2.0


    513. What are some of the WS implementations around?


    +   - The WS implementations are the framework APIs to create, deploy, and consume
    the WS resources as services. Some of the common WS frameworks are as below.

    - JAX-WS/JavaEE on Java platform

    - .NET platform

    - Apache Axis on Java platform'
