    15. Web Applications Testing and Selenium


    486. What are the selenium design patterns? What design strategies that you had
    used?


    +   - The Design Patterns helps in writing solutions with maintainable code for
    re-occurring problems.


    +   - There mainly 4 selenium design patterns that selenium use us with WebDriver


    +   i) DomainDrivenDesign: In this pattern, the goal is to express tests in the
    same language as end user of the app.


    For example, express the test as "Create a new Account" rather than expressing
    as "Click third element"


    +   ii) PageObjects: In this pattern, the goal is to create the abstraction of
    the web pages as objects. This pattern is most widely useful Selenium pattern.


    +   - Create public methods as Services that the page offers.


    +   - These methods would return other PageObjects.


    +   - There is no need to create one object for the entire page but make sure
    no duplicates for the page or parts of pages (HTML).


    +   - Note that these objects are general/common objects to be used in the actual
    test classes and thereby don''t make assertions and also not expose the internals
    of the objects outside.


    +   - Also one can use the PageFactory class and initElements() method to have
    auto-initialization and @FindBy, @FindBys for searchable WebElement instance fields.


    +   iii) LoadableComponent: In this pattern, model the PageObjects as components.


    +   - For this, extend LoadableComponent<?> class and then override load() and
    isLoaded() methods.


    +   - Also, it is possible to have nested components.'
