    or display.

    - XML has no built in tags whereas HTML have built-in tags (such as html,header,h1,body,div,center
    etc.) with specific purpose/meaning.

    - XML should have closed empty tag whereas HTML can skip.

    - XML is processed by backend code whereas HTML is processed by front-end tools
    like browser and javascript.


    # 110. What is meant by well-formed XML?


    +   - Well-formed XML is an XML, which meets the following conditions for correct
    syntax.

