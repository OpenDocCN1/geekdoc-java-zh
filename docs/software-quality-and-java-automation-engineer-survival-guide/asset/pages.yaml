    # 393. Why do you import JUnit assert methods as static? What is its advantage?


    +   - JUnit provides overloaded assertion methods for all primitives, object types
    and arrays. The method parameters order is expected value followed by the actual
    value.

    - In the test class, the following static import of Assert class methods so that
    the assertion method can be directly invoked without the class name reference
    (i.e., assertEquals() with Assert.assertEquals(j)). import static org.junit.Assert.*;

    - This style helps in avoiding the duplicate code of class name while referencing
    frequent assertion method names.


    # 394. What is "no runnable methods" exception message? When do you get this?


    +   - This exception message is raised when no tests found or none of the methods
    were not marked with @Test in the current JUnit test.


