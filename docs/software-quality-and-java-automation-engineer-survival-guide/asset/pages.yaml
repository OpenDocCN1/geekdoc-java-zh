    Eclipse marketplace).


    +   - Create a Java project as usual and Create package.


    +   - Add the testng.jar (downloaded from testng.org) to the libraries.


    +   - Create a new TestNG class in the project src directory (Right click on src,
    click New, Select Other, Select TestNG class).


    +   - Select all annotations to generate the skeleton (At this point you should
    see the test class). NOTE: refactoring of package directory might be needed due
    to a bug in the plugin (this was messing up the package name with repeated value).


    +   - Complete the test logic (invoke the APIs) and create DataProvider with test
    data.


    +   - Add more assertions based on the test steps in a single test scenario.


    +   - Add more test methods (i.e., add more test scenarios).'
