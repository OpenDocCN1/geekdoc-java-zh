    502. Can you explain the end-to-end process for a given website testing with selenium?


    +   - To test any given website, I would use the browser as the client because
    it is the universal client that end users like to use in general. For creating
    the browser automated tests, I would use Selenium, which is a free and open source
    framework to use the exact browser interface as its users.

    - Using Selenium, all the browser actions can be controlled directly using Java
    APIs. But selenium itself doesn''t provide any test harness and TestNG also used
    along with Selenium WebDriver API.

    - TestNG supports data-driven framework, and once the scenario is automated, then
    test data will be provided to apply for each scenario with DataProvider functionality
    of TestNG.

    - The driver for each browser initialization can be done using WebDriver d = new
    FirefoxDriver() or other browsers specific in the @BeforeClass annotated method.
    Quitting of browser (driver.quit()) will be done @AfterClass annotated method.

    - Then, create all the test methods would be created for each test scenario in
    @Test annotated methods. Within each test method, browser URL is open, element
    (WebElement) is going to be located using one of the available locators as By.id
    or By.xpath. The actions such as click or sendkeys applied on top of the web elements.
    Then assertions would be added based on the checks such as title, content, position
    verification. Multiple actions can be chained for features like Drag-and-drop,
    dynamic list selection using Action class. Any flash object and other not directly
    supported features can be tested with JavaScriptExecutor class in WebDriver API.

    - Later, the test data is formulated by reading the reposito'
