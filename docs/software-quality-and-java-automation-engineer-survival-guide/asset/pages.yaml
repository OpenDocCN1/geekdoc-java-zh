    ni. NoNoSuchElementException while finding the elements (typically in the different
    network bandwidths): The solution is to set proper wait conditions before locating
    the elements than just adding wait times. Also, adjust the max timeout periods.
    Use explicit wait like WebDriverWait.until(ExpectedConditions.presenceOfElementLocated))

    ii. StaleElementException: Many times in getting this exception during the navigation
    of elements. This exception is because of cache clearance. The solution is to
    find the elements again by catching the StaleElementException.

    iii. Locators identification for the dynamically generated IDs: The solution is
    to use xpath/css in relative to stable elements in the UI.

    iv. Cross browser issues: The solution is to adjust the locators as xpath or css
    based on the reliable test results among different browsers (like firefox, IE,
    chrome). For example, the Firefox is good at xpath and IE is good at css.

    v. Sometimes, getting unreliable actions like click() operation doesnn’t actually
    click the element. To mitigate this, add retries and timeout (put a loop and make
    sure click is indeed performed).


