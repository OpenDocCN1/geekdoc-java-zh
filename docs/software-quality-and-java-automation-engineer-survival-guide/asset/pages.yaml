  md: '# QA & Java Automation Engineer Survival Guide 11. Maven


    380. What happens if you accidentally deleted target folder?


    +   - The target folder is automatically generated when a maven build phase is
    executed to keep the classes, packaged jar, test results/reports, test files.


    +   - So, simply run "mvn test" or "mvn package" again to get the target folder
