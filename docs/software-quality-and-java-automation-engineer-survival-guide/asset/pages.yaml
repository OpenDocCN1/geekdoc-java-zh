    # 38. What is meant by software quality?


    +   - Software quality means the expected level of meeting the specifications
    or requirements, which are both functional as well as non-functional. The different
    levels of low, medium and high represent overall quality. In general, high-quality
    products will have higher customer satisfaction and recognition in the same line
    of low-level products. Software testing contributes to determining or assess the
    product quality.


