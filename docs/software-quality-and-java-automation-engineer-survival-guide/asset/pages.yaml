    \ is not implemented.\n\n+   Interfaces can support multiple inheritance (extend\
    \ multiple interfaces) whereas abstract classes support only single inheritance\
    \ (only one abstract class can be extended). That means a single class can implement\
    \ multiple interfaces whereas only one abstract class can be extended."
