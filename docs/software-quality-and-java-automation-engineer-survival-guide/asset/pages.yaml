  md: '# QA & Java Automation Engineer

    Survival Guide


    10. ANT high-level directory based on the project name.


    +   - The subdirectories of project directory contain src, doc, build xml files,
    build properties, common build files and lib directory. Also bin directory, which
    is not in the source code repository but will get generated.

    - The src folder contains the subdirectories with java package and the actual
    .java source files.

    - The bin folder is created automatically during the project where compiled artifacts
    like .class files, .jar files or .ear files would be generated.

    - The doc folder contains the generated Javadoc or written help files.

    - The build.xml and build.properties contain the ANT projects for building the
    project.

    - The common folder contains the commonly used ant files or tasks or any other
    utilities.

    - The lib folder contains the dependent libraries like third-party .jar files.

    - The snippet for the workspace structure is as below.


    ```

    .../projectdir

    /src/<pkg>/*.java

    /bin/<pkg>/*.class

    /doc/*.html

    /build.xml

    /build.properties

    /common/...

    /lib/...

    ```


    315. Is ANT cross platform? Can we run on all platforms?

    - Yes. ANT build files are XML files, and same xml file can be used. Also, the
    ANT tasks also cross platform framework as it is written Java, which makes the
    programs Java platforms independent. The ANT itself should be download for each
    platform but no need to do any migration/porting of build.xml files and any other
    ANT tasks.'
