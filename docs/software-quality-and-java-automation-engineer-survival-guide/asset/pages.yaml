    136. What is JSON? How does JSON format look like (snippet)?


    +   - JSON stands for Java Script Object Notation.

    - JSON is a lightweight data-interchange text format.

    - JSON is a subset of JavaScript (JS) programming language.

    - It is language independent, and many high-level languages have libraries to
    create and parse the format.

    - The JSON format is human readable, faster and easier than XML.

    - There are no reserved words/keywords and support structure/hierarchical (values
    within values).

    - The JSON file is a collection of JSON objects and the object contains name/value
    pairs. The typical extension is "json".

    - The JSON object is {"name":"value",...} and ordered list of arrays like [value,...].
    See more at json.org.

    - A JSON file format example is as below.


