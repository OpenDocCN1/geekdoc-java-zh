    # 390. Does JUnit support annotations? Which version?


    +   - Yes. JUnit4.x supports annotations.


    # 391. Describe the key annotations supported in Junit4?


    +   - @Before

    - This annotated method gets executed every time before running any test method.
    This is like per method setup. Also executed the super class''s @Before method
    before running in the current class.


    +   - @BeforeClass

    - This annotated method get executed once before running any test method. This
    is like a setup method to create some resources before running the test. Also
    executed the super class''s @BeforeClass method before running in the current
    class.


    +   - @After

    - This annotated method get executed after running each test method. This is like
    a cleanup method per test. Also executed the super class''s @After method after
    running in the current class.


    +   - @AfterClass

    - This annotated method get executed once after running all test methods. This
    is like a cleanup method to clear early resources after running all tests. Also
    executed the super class''s @AfterClass method after running in the current class.


    +   - @Test

    - This annotated method indicates it as a test case, and JUnit will create an
    instance of the class and execute this method. Any exceptions thrown from the
    method'
