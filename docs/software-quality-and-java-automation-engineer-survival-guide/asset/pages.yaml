    381. How do you compare Maven with ANT?


    +   - Maven and ANT are in similar as build tool/frameworks. Maven and ANT both
    are extensible through Java programming.


    +   - Maven and ANT are different build files and handling of the build lifecycle.
    Maven uses pom.xml whereas ANT uses build.xml.


    +   - Maven follows the convention over the configuration methodology; whereas
    ANT goes with configuration. Maven project''s workspace is simple and same for
    all projects and whereas ANT projects could be different and need to be designed
    every time.


    +   - Maven’s main power is in automatic dependencies and transient dependencies
    resolution of the project. In ANT, one has to copy and take care of the build
    files.


    +   - Maven’s build phases are fixed and automatic whereas in ANT one has to to
    -recreate or duplicate those targets in build files.


    +   - Distribution/sharing of maven artifacts is easy and well organized. In ANT,
    it has to be taken care by build file every time.


    +   - Maven has built-in site phase to generate the website automatically whereas
    ANT doesn’t have any and one has to take care in in the build file.


    +   - The latest projects do prefer Maven than ANT. Also, both can exist and one
    can call from another build tool.'
