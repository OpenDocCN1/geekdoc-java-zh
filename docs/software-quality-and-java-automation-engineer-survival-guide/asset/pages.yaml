  md: '# QA & Java Automation Engineer Survival Guide


    # 1. Software Development Life Cycle (SDLC)


    +   Good for large projects with clear planning, design, architecture before actual
    implementation. The team is not under time pressure (comparison with Agile) as
    there can be sufficient time buffer for planned tasks. Typical project release
    duration is higher and is between 6 months to 1-5 years compared to Agile monthly
    releases.


    +   Waterfall model disadvantages:

    - Customer requirements can''t be accommodated in the middle of the project.

    - This takes more time and incurs more cost.

    - There is no incremental product delivery. The final project is available only
    after the final phase, which is a longer in duration.

    - It is difficult to predict if the project is doomed to fail until the project
    completion or of resources.


    19. What are advantages and disadvantages of Agile Scrum process?


    +   Scrum process advantages:

    - Adapt to the changes where customer requirements can be honored in the middle
    of the project development (that is in the next sprint cycle).

    - It helps in doing incremental product delivery.

    - It takes less time comparing with waterfall model.

    - It gives an early indication of the project status and can be stopped quickly
    or can be transformed to a different project.


    +   Scrum process disadvantages:

    - It can consume more resources before sprint cycles need to cover all dev/test/doc
    activities at same time.

    - Typically, it is good for shorter projects with less complex projects (where
    fewer alternatives/architectures to be considered).

    - It demands high productivity and constant effort done by the team and thereby
