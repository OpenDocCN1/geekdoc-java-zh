    11. Maven


    # 373. How do you clean up the build?


    +   - Run “mvn clean” in the project directory and it removes target folder.


    # 374. What is meant by maven local settings and global settings? And where do
    they located?


    +   - The maven behavior depends on the maven settings.

    There are 3 different places for settings and maven checks in the same order as
    below for any settings (means it checks the next only if not found in the prior
    settings).

    - pom.xml file - some configuration details. It is included in the project distribution.

    - Local or user level settings: <user-home>/.m2/settings.xml file and any other
    file, use with mvn -s option.

    - global settings file - <maven-install/>/config/settings.xml.


    +   - Note that all settings are not tied to the particular project and instead
    used across multiple projects. Also, some settings are not to be bundled in the
    project''s package. In these cases, use the user''s/local or global settings.

    - Use the local/user''s settings when the same user is working on multiple projects,
    which need different settings.

    - Use the global settings common across the projects such as proxy settings, dependency
    maven repositories etc.

    - See more details at http://maven.apache.org/settings.html


    # 375. What do you need while publishing an artifact to a repository?


    +   - The following 3 things at minimum required:

    - Successful artifact (package jar) generation.

    - Access to the central repository to publish the artifact and should be configured
    in the settings.xml

    - Internet connection and proxy settings if any needed to be in the settings.xml
    file.'
