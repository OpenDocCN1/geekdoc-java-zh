    13. TestNG


    +   - @TestMethod: this annotated method will be run after completing (for each)
    a test method.


    +   - @Test: Marks a class or a method as a test.


    +   - @DataProvider: Marks a method as supplying data for a test method. The annotated
    method must return an Object[].


    +   - @Factory: Marks a method as a factory that returns objects that will be
    used by TestNG as Test.


