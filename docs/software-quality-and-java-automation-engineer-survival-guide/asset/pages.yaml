    15. Web Applications Testing and Selenium


    464. How do you develop automated tests for a given website? Explain end-to-end
    process flow.


    +   - First, identify the web pages to be tested, the pages navigation and use
    cases/user flows to test.


    +   - Check the HTML pages design and select the best WebDriver locator strategy
    such based on ids or names or xpath or cssselector or other. All locators can
    be kept in a separate file like .properties so that it is easy to maintain the
    changes when UI changes happen.


    +   - Next, create one PageObject class per page (following PageObject design
    pattern) and have the methods corresponding to the services or functionality provided
    by that page. Page Objects are the classes used by the actual test classes. Also,
    reference the locators from a properties file instead of hard-coded in the test
    or PageObject.


    +   - Create common helper classes to abstract the common actions (following BotStyle
    design pattern) to leverage the code further.


    +   - Using TestNG framework, create test classes including each test method per
    test scenario. Please note Selenium itself doesn''t provide any test framework
    and instead browser controlling API.


    +   - Make sure the test data is data-driven, which is automatically populated
    by writing the DataProvider methods or separate DataProvider class to read from
    .csv or .json or .xml files.


    +   - Integrate with ANT or Maven to build the tests and execute as the command
    line.


    +   - Finally, setup a Jenkins/Hudson CI job for daily or on-demand runs for regressions.


    +   - Please note that the test machines or slaves should have the Graphics support
    (like VNCServer) to bring up the browser. For this, execute VNCServer like software,
    and set the display numbers.'
