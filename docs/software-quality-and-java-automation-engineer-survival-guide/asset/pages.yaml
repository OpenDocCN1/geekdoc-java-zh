  md: '# QA & Java Automation Engineer Survival Guide 9. Java


    # 238. What is JVM heap? When does it gets created?


    +   - The Java heap is the main memory used by all parts of Java application during
    execution.


    +   - The heap is going to be created whenever JVM launched/started. That is when
    java command is issued.


    +   - All Java objects are going to be stored in the heap, and that means whenever
    an object is created, it is always stored in the heap and is globally accessible
    across the JVM.


    +   - The heap memory is going live since the start to the end of the application
    runtime. The heap memory itself is divided into different generations like young
    generation, old generation, etc., and is cleaned up by automatic Garbage collector.


    +   - The default JVM heap size is 64MB even when the machine has RAM.


    +   - The Java runtime throws the java.lang.OutOfMemoryError when the heap is
    full.


    +   - The heap size available to JVM can be customized (increase/decrease) using
    -Xms (initial size) and -Xmx (maximum size) JVM options. Example to set 1G initial
    and 2GB max heap, then use -Xms1G Xmx2G while running java program.


    +   - If more Java objects and data structures are being constructed in the Java
    program, then it is required to tune (increase) the heap size of the JVM.


    # 239. What is Garbage Collection? What is its role in JVM?


    +   - The Java Garbage collection is the automated process of recovering the unused
    objects from the Java heap memory. These unused objects are the objects without
    having any references from other parts/objects of the program.


    +   - The programmer doesn''t need to worry about allocating the memory for data
    structures/variables and also deallocating or to release or clean those objects
    from the pro-'
