  md: '# Introduction


    The book is about Software Quality & Java automation skills with basic concepts,
    self-review and interviews preparation related to the Java based projects in a
    practical sense with questions-answers. This book is targeted mainly at beginners
    to the software quality and development engineers. It is also useful for experienced
    quality engineers to do self-assessment and to be on top of relevant automation
    skills.


    In the software industry, the quality related professional role is called as QA
    (Quality Assurance) or QE (Quality Engineering) engineer. In general, the "Quality
    Assurance" and "Quality Engineering" carry out the similar effort. The QA is a
    traditional role originated from industrial manufacturing assembly where the final
    product quality tested by verifying against a checklist, inspected for any damages
    and finally put a quality sticker. The similar QA role came to IT Software but
    associated with Engineering background. So QE makes sense for Software industry,
    and it stresses on the importance of applying the Engineering principles rather
    than simply repeating the quality assurance actions.


    The QA role involves the tasks such as understanding of the software product features
    & domain knowledge, writing test plans, writing test specifications, manual execution
    of tests and interpreting results. Later, one has to do the development of automated
    tests, automated execution and generation of final results summary for release
    level regression testing. Note that the QA role need average coding skills, but
    it takes more time and energy than in general as expected by many people. Because,
    for each product release in the product line, the developed tests should be continuously
    executed and verified to make sure no regressions at any point in time. The Quality
    Engineering skills have to be applied all the time during the product development.
    The quality has to be measured, assessed and concluded to prove that product is
    meeting the customer expectations. Without the engineering principles, quality
    testing might be happening and can discover some bugs but it may not ensure the
    proper proof to justify on the quality and leave some gaps. In'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# QA & Java Automation Engineer Survival Guide


    summary, apply the core engineering principles such as measuring, making consistency,
    repeatability and correctness during the application of testing techniques.


    It is difficult to do the above principles merely with the manual approach because
    of limitations such as human errors in producing consistent actions & output,
    testing coverage with quick, agile product development cycles and making sure
    each build is verified for regressions. The Quality Automation is one of the important
    things to address this continuous regression testing. The automation effort needs
    programming skills in the same software domain and relevant skills to achieve
    the high automation, which saves time and test coverage.


    It is hard to survive without having the fundamentals and automation skills in
    software development and quality as a QA or dev engineer. Also, many skills need
    references to many other books that were not targeted at QA professions. Now,
    this book is an attempt to create survival guide for QA professional with all
    relevant skills at one place.


    This book should help in making sure that you get the basic concepts, working
    knowledge and in summary as a survival guide for programming and automation with
    all required skills. The goal is not to aim at making you an expert at one skill
    or entirely on these skills. The focus is on finding the needed skills and at
    what level is being used for 80% of the time (80-20 rule) in the Java programming
    and Quality engineering profession.


    For the Manual QA engineer, this book helps in understanding Quality concepts,
    SDLC (Software Development Life Cycle), technical terminology, etc. Also, this
    helps in moving the engineer from manual testing to automation.


    This book helps junior developers working on Java projects in SDLC, OOPS, Java
    programming, unit testing and most of the other skills are in common with automation.
    Also, it gives understanding some of the test frameworks and terminologies in
    the test development.


    2/401'
