    The typical reason for this error could be spikes in the data usage by the java
    application or memory leaks from the application.


    The memory leaks can happen when leaving behind the allocated memory (not cleaning
    up) every time the application logic gets executed and thereby filling up all
    heap in the JVM.


    The error can be resolved after analyzing the objects in the heap and performing
    the one or all of the below.


    +   - Reduce the data size


    +   - Address the memory leaks


    +   - Increase the heap


    The heap size available to JVM can be customized (increasing/reducing) by specifying
    -Xms (initial size) and -Xmx (max size) JVM options while running java program.


    # 237. What is ClassNotFoundException? When do you get this and how to resolve?


    The java.lang.ClassNotFoundException is a checked exception in Java and is thrown
    by the JVM when the given class can''t be loaded by its classloader.


    Typically it happens when the application tries to load the named class and can''t
    load in the following.


    +   i) forName()

    ii) findClassName() in the ClassLoader

    iii) loadClass() in the ClassLoader


    The root cause for this exception is that the given class is not in the classpath
    (not in either CLASSPATH system variable or -cp or -classpath options don''t have
    the class or jar file path or not specified the full classname with package name).


    To resolve the above issue, make sure the classpath is appropriately set in the
    CLASSPATH environment variable or -cp or -classpath JVM options.'
