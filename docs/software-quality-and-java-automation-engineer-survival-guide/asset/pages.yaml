  md: '# QA & Java Automation Engineer Survival Guide


    # 415. What are all required software and libraries to work with TestNG?


    Below are the minimum required software.


    +   - Java 5 (1.5) download JDK or IDE including Java.

    - TestNG (latest version) – http://testng.org/testng-6.8.zip


    To Increase Productivity use the following additional software:


    +   - Ant

    - Maven

    - IDEs

    - Install Eclipse plugin (Search TestNG in the marketplace)


    # 416. What are all different annotations supported by TestNG?


    The below are the various critical annotations in TestNG.


    +   - @BeforeSuite: this annotated method will be run before all tests in this
    suite.

    - @AfterSuite: this annotated method will be run after all tests in this suite.

    - @BeforeTest: this annotated method will be run before any test method belonging
    to the classes inside the <test> tag is run.

    - @AfterTest: this annotated method will be run after the test methods belonging
    to the classes inside the <test> tag have run.

    - @BeforeGroups: this configured method will be executed before any test method
    in the list of groups.

    - @AfterGroups: this configured method will be executed after all methods in the
    list of groups.

    - @BeforeClass: this annotated method will be run before any test method in the
    current class is invoked.

    - @AfterClass: this annotated method will be run after all the test methods in
    the current class

    - @BeforeMethod: this annotated method will be run before starting (for each)
    a test (@Test) method.'
