  md: '# QA & Java Automation Engineer Survival Guide

    I. Software Development Life Cycle (SDLC)


    +   14. Can you change a sprint backlog during a sprint?

    - No. Not in the current sprint but the next sprint cycle would catch up the the
    sprint backlog derived from product backlog with those changes.


    +   15. What is a use case?

    - Use case is the sequence/flow of actions and events performed by an actor to
    achieve a business goal. The actor could be an end-user using the system or the
    system or device interacting with some other system. There will be many use cases
    for a given product under development.


    +   16. What is a user story?

    - The story, the term used in the agile SDLC process and is a simple description
    of a software requirement in the end user''s perspective and his/her business
    job function. It should be scoped for an iteration and should provide a business
    value or add the value to the overall product once implemented.


    +   17. What is Test Driven Development(TDD) process?

    - The Test-driven development is an agile software development process under extreme
    programming paradigm. In the TDD, the developer first writes an initial, which
    is a failed automated unit test as per user story and repeatedly modified the
    code until the test passed. I don''t think TDD is that popular or widely used
    now.


    +   18. What are the advantages and disadvantages of waterfall model?

    - Waterfall model advantages:

    - It can give better project schedule estimation and planning.

    - It provides the re-use of Resources because of sequential phases.'
