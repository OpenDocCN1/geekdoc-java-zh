    files?


    +   - Using ANT JUnitTask, one can generate the test result xml files.

    - After that, the ANT JUnitReportTask can be used to merge multiple test results
    xml files and generate a single html report.

    - Example: `<junitreport todir="./summary"> <fileset dir="./results">'
