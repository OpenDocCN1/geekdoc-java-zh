  md: '# QA & Java Automation Engineer Survival Guide 9. Java


    | Interface | Collection | Basic purpose | Performance |

    | --- | --- | --- | --- |

    | List | ArrayList | Duplicates + Insertion order | O(1) for size, isEmpty, get,set,
    iterator operations. O(n) linear time for add all other operations. |

    | | LinkedList + Iterator | Duplicates + Insertion from both sides (doubly list
    implementation) | O(n) for get and remove. O(1) constant time for add and Iterator.remove.
    |

    | Set | HashSet | No duplicates + No specific order | O(1) constant time for basic
    operations (add/remove/contains)+ |

    | | TreeSet | No duplicates + Sorted elements | O(log(n)) for basic operations
    (add/remove/contains) |

    | | LinkedHashSet | No duplicates + Preserving the insertion order | O(1) constant
    time for basic operations (add/remove/contains) |

    | Map | HashMap | Key-Value pair + No specific order for keys | O(1) constant
    time for basic operations (get and put) |

    | | TreeMap | Key-Value pair + Sorted keys | O(log(n)) time for get, put, remove,
    contains operations |

    | | LinkedHashMap | Key-Value pair + Preserving the keys insertion order | O(1)
    constant time for basic operations (add, contains, remove) |'
