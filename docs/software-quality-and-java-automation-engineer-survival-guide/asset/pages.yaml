  md: '# QA & Java Automation Engineer Survival Guide 9. Java


    287. What are the differences between checked exceptions and unchecked/runtime
    exceptions?


    +   - Both checked and unchecked exceptions indicate some event happened rather
    than the normal flow of the program. The following are the differences, and there
    has been a controversy where one side of programmers preferred checked, and other
    side preferred unchecked exceptions.


    | Checked Exceptions | Unchecked/Runtime Exceptions |

    |---|---|n| User code must catch the exception or rethrow the exception. Otherwise,
    it is a compilation error. | No need to catch the exception in the user application.
    |

    | Custom application exception class should extend from Exception class or other
    subclasses that are not extended from RuntimeException class. | Custom application
    exception should extend from RuntimeException class or its subclasses. |

    | Use the checked exceptions when there is a reasonable way to recover by the
    client code. | When there is no way to handle the raised exception, then better
    to go with unchecked/runtime exceptions. |

    | Example: FileNotFoundException raised when input file doesn''t exist at the
    given path. | Example: NullPointerException raised when a null object is dereferenced.
    |'
