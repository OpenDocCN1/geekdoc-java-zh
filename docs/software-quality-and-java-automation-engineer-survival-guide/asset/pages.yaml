    that communicate over the internet protocol using XML based messages along with
    other web-related standards.

    - These are self-describable and discoverable services.

    - Two parties involved in this are Service Provider providing the service and
    Service Consumer consuming the service.

    - Key elements are communicating protocol - IP, describable WSDL, discoverable
    protocol as UDDI, Application protocol as SOAP or HTTP, Payload as XML or JSON
    data.


    504. What are some of the distributed technologies?


    +   - CORBA (Common Object Request Broker Architecture)

    - Java RMI

    - DCOM

    - EJB (Enterprise Java Beans)

