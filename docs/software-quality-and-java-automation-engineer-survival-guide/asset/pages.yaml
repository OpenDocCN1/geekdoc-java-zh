  md: '# QA & Java Automation Engineer Survival Guide 6. JSON


    137. Is JSON a programming language? Or a protocol? Or a message format? Is it
    language dependent?


    +   - No JSON itself is not a programming language nor a protocol. It is simply
    a data or message format.


    +   - The JSON files are independent of the high-level programming languages.
    These JSON files can be generated and parsed by many programming languages.


    138. What are the key advantages with JSON over XML format?


    +   - The JSON format is human readable, compact, lighter, faster and easier than
    XML.


    +   - There are no reserved words/keywords and supports structured/hierarchical
    (values within values) data, and thereby the same data size is going to be less.


    +   - The processing of the JSON is much simple compared to XML.


    +   - Also, the implicit (no additional libraries) data parsing can be done using
    JavaScript and thereby it is easy to present on UI.


    139. Where do you use JSON?


    +   - JSON format can be used in any application where data serialization and
    deserialization along with some structure is required.


    +   - JSON is extensively used in RESTful Web Services/REST APIs for the data
    embedding in requests and responses.


    140. What is the HTTP header used for passing the JSON data?


    +   - In the HTTP, below header and value is used to indicate that JSON content
    is available in requests or responses. Set this header while sending the HTTP
    request or response.


    Content-Type: application/json'
