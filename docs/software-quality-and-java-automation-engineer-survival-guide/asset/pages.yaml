  md: 'The book is about Software Quality Engineering with basic concepts, self-review,

    interviews preparation for java based projects test automation in a practical
    sense

    with questions and answers mode.


    This book is aimed to benefit most of the software professions and especially

    to Quality Engineering folks who don''t have much support in terms of books and

    trainings compared to developers. This is for anyone to understand the basic testing

    concepts, interview preparation in getting a new QA automation engineer job, or

    switching from rom another discipline to Software testing. The survival guide
    can be

    used by Automation engineers, Developers and Manual QA engineers.


    The book covers below16 Core Skills along with sample code and hands-on/get-

    started with a new job:


    +   1. Software Development Life Cycle (SDLC), 2. Software Quality Concepts, 3.

    OOPS, 4. XML, 5. XPath, 6. JSON, 7. SCM/SCCS, 8. Unix/Linux, 9. Java & JDBC, 10.

    ANT, 11.Maven, 12. Junit, 13. TestNG, 14. Jenkins/Hudson (CI), 15. Web Application-

    tions Testing: Selenium, 16. Web Services - SOAP/REST


    # Basic Concepts, Self Review, Interview

    Preparation (500+ Questions & Answers)


    Jagadesh Babu Munta is working as a Consulting Member

    of Technical Staff with Oracle America Inc. He has been with

    Oracle and Sun Microsystems together for over 16 years (since

    2000). Jagadesh has overall 20+ years of Software development and quality/testing
    experience. Jagadesh''s experience has

    been filled recently with Cloud platforms, Multi-Tenancy,

    Security and Penetration testing. In the past, extensively worked

    on Java EE servers like SailFin/GlassFish/Sun Java System/Implement-

    et/Netscape Application Services. Jagadesh has gained

    extensive expertise in software automation, designing frame-

    works, tools, scripts, creating tests, writing specs/plans,

    ect. Jagadesh is interested in developing and testing complex

    software useful to up level the humanity.

    Jagadesh Munta holds M.S. in Software Engineering from San Jose State University,
    California,

    USA; B.Tech. in Computer Science and Engineering from J.N.T.U.C, Hyderabad, India;
    Special Di-\ploma in Electronics with Specialization in Computer Engineering,
    G.I.O.E, Secur-derabad, India,

    Jagadesh Munta born in Nellore, AP, India and lives with family in Fremont California,
    USA.


