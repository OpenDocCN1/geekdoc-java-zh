  md: '# QA & Java Automation Engineer Survival Guide 11. Maven


    371. What is a build phase? How do phases relate to plugins?

    The build lifecycle operations are divided into phases and can be used directly
    with mvn <phase> command without having "plugin:goal". Those plugin goals are
    tied with regular build operations or phases.


    +   372. What are default phases in the maven build lifecycle?

    The following are the default phases in the maven build lifecycle of projects
    and all prior phases will be included automatically by next phase.

    - These can be invoked as "mvn <phase>". Example: mvn test

    - validate: validates if the project is correct and all necessary information
    is available in pom.xml.

    - compile: compiles the main source code of the project.

    - test: tests the compiled source code after compiling test code and using a suitable
    unit testing framework. These tests should not be required the code be packaged
    or deployed.

    - package: take the compiled code and package it in its distributable format,
    such as a jar.

    - integration-test: process and deploy the package if required into the environment
    where integration tests can be executed.

    - verify: run any checks to verify that the package is valid and meeting the quality
    criteria.

    - install: install the generated package into the local repository for use as
    a dependency in other projects locally.

    - deploy: used in an integration or release environment and copies the final package
    to the remote repository for sharing with some other developers and projects.

    - site: generates the website pages for the project from the information in pom.xml.


    201/401'
