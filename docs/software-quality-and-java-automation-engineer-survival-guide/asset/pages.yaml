    do you write? Can you write single test covering all different scenarios?


    +   - For any API, create the test scenarios covering both positive and negative
    tests that include the functional correctness, parameters validation, boundary
    conditions, exceptions, and any data structures updated.

    - Also create the test scenarios for the other nonfunctional testing that includes
    security testing, stress testing, and performance testing.

    - It is not advised to have one test case for all the API test scenarios and instead,
    create a separate test for each test scenario.

    - The number of tests depends on the number of test scenarios/flows.

    - Typically, each test scenario would be written a single test method in TestNG.
    If more assertions to be covered for a use case, add all those assertions in the
