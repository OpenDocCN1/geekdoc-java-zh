  md: '# How is this book?


    "This book provides the best answers to the most frequently asked questions in
    testing job interviews. It is a unique book that includes all essential information
    in one single place manual as well as automated testing and builds the confidence.
    Jagadesh Munta is an authority in the testing field, and he has interviewed many
    candidates at his company. He knows what the hiring manager/team is exactly looking
    for, and he has distilled all that knowledge into this book. If you are preparing
    for a software testing job interview then this is the book that you are looking
    for!"


    -- Satya Dodda

    (Senior Software Engineering Director, Oracle America Inc., Santa Clara)


    "This book is the reason I was able to become a Test Automation Engineer without
    having any background in software. Not only did it help me master highly technical
    interviews and get me a high paying job, but it also instilled principles that
    have allowed me to excel above my coworkers."


    (Systems Integration Automation Engineer, San Jose)


    "It is such a wonderful guide and I really liked the way you''ve covered all the
    topics. This book is extremely helpful for people like me and also for those who
    are interested in starting a career as a Quality Engineer."


    -- Sindhuri Mutyala

    (Software Engineer in Quality, Intuit, Mountain View)


    "It will be of real help for interviews."


    (Senior QA Engineer, Santa Clara)


    "It is an incredible Hands-on guide and helpful for people like those who are
    interested in starting a career as a Quality Engineer/Testing Engineer. Very beneficial
    in preparing for the software testing/QA job interviews."


    -- Malik MA.

    (QA Manager, Acentia Software Solutions, Hyderabad)'
