    27. What is meant by soft code freeze (SCF)? When does it happen in the SDLC process?


    +   - Soft code freeze or Feature complete is a considerable stone that occurs
    after completing the implementation of all the features during the development
    process.

    - After SCF, no more features would be added, and instead, only critical, high
    and medium bugs would be fixed.

    - A separate branch or tagging of source code repository would be created for
    the SCF milestone and keep using this branch until release is completed.

    - QA team would continue to test and fix bugs as Dev team continue to fix the
    bugs (but no new feature).


    28. What is meant by hard code freeze (HCF)? When does it happen in the development
    process?


    +   - Hard code freeze is a milestone and happens after SCF milestone when most
    of the critical/high/medium bugs fixed and ready for final QA test cycle to find
    any showstopper bugs (that can stop the release).

    - After HCF, only show stopper (customer impact is very high) bugs would be fixed.

    - Please note that these show stopper bug fixes are allowed only with product
    management approvals.


    29. What is product release candidate (RC)? What is a release?


    +   - Release Candidate (RC) is the final milestone in the release cycle timeline.

    - RC is created after HCF is completed and QA would do the final test cycle before
    RTM release.

    - RC would be released as RTM product when no show-stopper bugs found on this
    final build.

    - The product release is nothing but bits are ready to handover'
