  md: '# QA & Java Automation Engineer Survival Guide


    One of the key thing to observe is that it is not difficult to learn anything
    but to see what is relevant and why to learn. Learn the things most important
    to you in the work or life. If someone asserts on what you know, then it builds
    more confidence in the current profession or newly pursuing one.


    At a high level, this book starts with the areas such as processes (SDLC/Quality/OOPS),
    data (XML/XPath/JSON), code repositories (SVN/GIT), and operating systems (Unix/Linux).
    Then enters into programming (Java&JDBC), and later build frameworks/tools (ANT/Maven).
    After that it covers more on unit testing frameworks/tools (Junit/TestNG) and
    continuous integration tools (Jenkins/Hudson). Next, it includes the functional
    testing of web applications and web services with frameworks/tools (TestNG/Selenium/SoapUI).
    Finally, included sample code (for Java/Selenium) to reference offline, and hands-on/getting
    starting in the job.


    There are about 500+ questions and answers to ease understanding the concepts
    and for review purpose.

    The below are 16 core skills covered in this book.


    +   1. Software Development Life Cycle (SDLC): The SDLC is to understand the core
    methodology of the software development process. This process is one of the essential
    concept for Dev/QA individual and the teams to collaborate effectively in the
    creation of the software products or IT services.


    +   2. Software Quality Concepts: The quality concepts are the fundamental knowledge
    on the testing part of SDLC process that must be possessed by every QA and Dev
    team for the delivery of a high-quality software product.


    +   3. OOPS: The majority of the software products development has been done with
    Object-oriented languages such as Java, C++, and other OO high-level languages.
    OOP concept is very much essential for any Java/C++ programmer to maintain or
    develop new software in Java.'
