  md: '# Hands-on/Getting Started


    First of all, congratulations on your new Job!


    In many cases, if someone is a beginner to a profession, it would be uncomfortable
    where and how to get started! Giving confidence in this situation is important
    for new folks and here is an attempt to gather a hands-on step by step getting
    started information for the day-to-day work without repeating much information
    from the above details.


    # Understand the process, your role and communication channels


    The first step is to understand the current process and in specific, the development
    process (SDLC) followed in the organization. For this, set up a meeting with lead
    or manager to get such information and pointers. The process itself could be either
    Waterfall or Scrum process or mixed mode identify the exact process. Also, recognize
    the project stakeholders and your role in the project. Understand your contributions
    and value-add to the project. Your goal is to exceed expectations to develop or
    test a software project.


    In this process or after the process identification, one should join the appropriate
    meetings along with colleagues to understand the expectations of the project work.
    Also, gain the domain knowledge on the product or IT service that is going to
    be worked on by going through the related documents and wikis, etc. The domain
    knowledge is all about understanding at high-level on the team''s/group''s project.
    The areas such as features or use cases, end-to-flows, architecture, the design
    on product engineering side. If it is an IT project (intranet/company/partners
    related projects), then familiarize on the applications and the related features,
    etc. During this process, establish a wrap withcolagues or counterparts in QA
    and Dev teams to make as you might be working on a day-to-day basis and also get
    the knowledge quickly. If you need more clarity on the process, then go through
    the SDLC and QA concepts skills in this book as necessary.


    As an engineer, your role might be to work as a module development or test owner.'
