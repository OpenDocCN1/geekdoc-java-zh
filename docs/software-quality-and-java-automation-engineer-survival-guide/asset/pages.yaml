    392. What are the differences between JUnit 3.x and JUnit 4.x?


    | JUnit 3.x | JUnit 4.x |

    |---|---|

    | Use test class''s base class as Test-Case | (no longer necessary) |

    | Use method name as "setUp" for setup actions. | Use annotation @Before to setup
    method. |

    | Use method name as "tearDown" for cleanup actions. | Use annotation @After to
    cleanup method. |

    | Use method name starting with test, something like "testXYZ" | Use annotation
    @Test to test methods. |

    | (no equivalent existing) | Use annotation @BeforeClass (Once-and-only setUp)
    to run only once before running any test in the class. |

    | (no equivalent existing) | Use annotation @AfterClass (Once-and-only tearDown)
    to run only once after running all tests. |

    | Expected exceptions testing can be performed as: try { ... fail() } catch (Exception
    e) { assertTrue(true) } | Use annotation @Test(expected = Exception.class) to
    check expected exceptions. |

    | Use custom implementation to | Use annotation @timeout |


