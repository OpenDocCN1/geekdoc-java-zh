  md: '# QA & Java Automation Engineer Survival Guide


    # Task#1. Get or Create Test Plan and Test Specs (QA role)


    To get started, see if you have already a master test plan or module test plan
    and test spec. If there is none, then create the Test Plan and Test Spec artifacts.

    The Test plan is a testing artifact in the planning process to plan the testing-
    with details scoped, non-scoped requirements to test, test strat-egy, resources,
    matrix and schedule (estimates) created by the QA team. See Q#54 for more details
    in QA concepts skill. Take the tem-plate and start filling it. Follow the steps
    in Q#54.


    Test design process is more of thinking of the test scenarios and their priority.
    The Test Specification (TS or TDS) is documenting those sce-narios as test cases
    before actual testing as either manually or auto-matic the tests. See #55 in QA
    concepts skill. Take the template and start filling it. Follow the steps in Q#55.


    # Task#2. Perform Manual verification


    It is important first to get the scenarios and filed bugs sooner as soon as the
    code is available to test. For this, verify the use cases/ test scenarios manually
    by following by step as mentioned in the test spec to make sure features are working
    fine. If not tests failed (means not expected results), then file bugs. Follow
    the bugs lifecycle (new, fix, verify cycles). If the automation itself helps in
    quick verification (such as computing actions), then start writing the automated
    code. Most of the time, manual check is useful to quickly verify the basic product
    features and understanding of use cases.

    Send status reports on tests executed, passed, failed and bugs in-formation to
    the QA/Dev managers and leads. Note that the consistent sta-tus to the key project
    stakeholders are important.


    # Task#3. Get handle on the code base and develop automated test code or new dev
    code


    After knowing the project details or manual use cases verification, the next step
    is to get familiar with existing codebase (dev code for devel-opers and QA automated
    test code for QA engineers) if exists. In most of the organizations, this might
    be the case you may join-ing as a team member to work on current projects.'
