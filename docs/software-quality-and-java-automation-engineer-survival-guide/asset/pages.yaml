    396. What happens when a test method or code inside it throws an exception?


    +   - The test is marked as a failure whenever an exception threw in the method.


    397. Can a test method contain multiple assertions? What happens if any assertion
    failed?


    +   - Yes. Each test method can contain multiple assertions.

    - If any assertion failed then, the test will be marked as a failure and will
    not execute statements after that.


    398. What is your strategy to have assertions as one assertion per method or multiple
    assertions in a test method? Are there any advantages and disadvantages? What
    is the recommendation?


    +   - Writing one assertion per method would cause many test cases.

    - Also having too many assertions per method would cause maintenance problems
    and hard to debug (going through all assertions) if there are any failures.

    - The recommendation is to find the appropriate assertions based on the use case
    or test scenario under test. Typically, the use case might contain few assertions
    (maybe 3 or 4 assertions maximum than more than 10), and if there is a large use
    case, then it can be divided into multiple parts.


    399. How do you create test suites?


    +   - In JUnit 4, use the @RunWith and @Suite annotations to create the suite
    of individual tests.'
