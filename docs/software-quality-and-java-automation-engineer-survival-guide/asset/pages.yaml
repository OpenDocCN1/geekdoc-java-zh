    211. What is Java? What are benefits of Java language?


    +   - Java is a high-level, general-purpose and robust object-oriented programming
    language that is widely used programming language in this internet era. The first
    Java released in May 1995 by Sun Microsystems Inc., and James Gosling is known
    as the father of Java.

    - Java language is platform independent with one of the core principles of WORA
    (Write Once Run Anywhere), which means the same compiled code can be executed
    on many operating systems (like Linux, Windows, Mac, etc.) without any source
    code changes.

    - Java supports many commonly needed programming features such as inbuilt automated
    garbage collection, security, networking and multi-threading features, etc.


    212. What is Java Platform? Why is it called a platform?


    +   - The Java itself is referred to as a platform because of its virtual machine
    (JVM), where the compiled code is executed. The JVM creates an environment in
    similar to the operating system for the programs to execute.

    - The JVM (Java Virtual Machine) is a specification (JSR336 for Java7) and can
    be implemented by anyone. The Sun’s/Oracle’s JDK (Java Development Kit) is the
    Reference Implementation for a given JVM specification. The specification and
    reference implementation are governed through JCP (Java Community Process).'
