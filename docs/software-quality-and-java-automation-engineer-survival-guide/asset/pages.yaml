  md: '# QA & Java Automation Engineer

    Survival Guide

    13. TestNG


    433. What are the differences between JUnit and TestNG?

    Which one do you use? Why?


    +   - Comparing TestNG with JUnit, TestNG has more features and suitable for functional
    and integration testing in addition to unit testing. Thereby TestNG is preferred
    to use for QA automation.


    +   - The below table summarizes the major differences.


    | JUnit4 | TestNG |

    |---|---|

    | Mainly aimed at Unit Testing | Mainly aimed at Unit, Functional and Integration
    |

    | No direct grouping of tests supported. | Grouping of tests supported. |

    | No dependency between the tests. | Dependency between tests can be done. |

    | Data driven is achieved with Parameterization at class level only. | Data driven
    is achieved with DataProvider at method also. |

    | Output can be plain and xml | Output is html and xml by default. |

    | Default reporting is plain text. | Default reporting is html web page (pretty).
    |

    | Minimal annotations are available. | More annotations and flexibility |

    | Package: org.junit.* | Package: org.testng.* |

    | No need to have a separate xml for test suites configuration. | TestNG should
    have the testng xml file. |


    241/401'
