  md: '# QA & Java Automation Engineer Survival Guide

    1. Software Development Life Cycle (SDLC)


    9. Are you aware of any Agile tools?


    +   - Rally software is one of the tools (http://www.rallydev.com/) used for tracking
    the Agile process.

    - Atlassian''s JIRA is also being used to track the tasks in a sprint and have
    the epics with JIRA dashboards.

    - Finally, simple wikis/spreadsheets can also be used as a tracking tool.


    10. What is a sprint? What is a typical duration for a sprint?


    +   - The sprint is the short cycles of software development lifecycle, and typically
    it is a weekly or 2 or 3 or 4 weeks period to code, verify, document a set of
    user stories or fix and verify the bugs.


    11. What is meant by product backlog?


    +   - The product backlog is the list of tasks and requirements for a product
    under development. The backlog gives the full list of prioritized requirements
    or tasks for the product at any given time. If any new or changes in the old requirements,
    those will be updated in this product backlog and prioritized.


    12. What is a sprint backlog?


    +   - The sprint backlog is the list of prioritized tasks and requirements to
    be completed in a particular sprint cycle. It is a sub-set of top requirements
    or tasks picked from the product backlog.


    13. Where do you add the changed requirements? Whether in a sprint backlog or
    product backlog?


    +   - The changes in the requirements would be added to the product backlog and
    will not be added to the current sprint backlog. These changes would be picked
    up in Next sprint cycle (through sprint backlog) from the product backlog.'
