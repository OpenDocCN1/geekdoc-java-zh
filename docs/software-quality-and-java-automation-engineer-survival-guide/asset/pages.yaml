  md: '# QA & Java Automation Engineer Survival Guide 9. Java


    # 214. Is Java language cross-platform?


    +   - Yes. One of the key features of Java is this cross platform support. That
    means the Java bytecode is generated from the source code on one platform, then
    it can be executed on other platforms without porting/changing the code.


    # 215. What is JVM? Describe more on this.


    +   - JVM stands for Java Virtual Machine.

    - The JVM can be expressed as a collection of the specification, implementation,
    and runtime instance. The specification is about by the bytecode specification,
    and the implementation is the JRE, and the runtime is the instance of VM whenever
    Java code is executed.


    +   - There are multiple implementations from different vendors.

    - HotSpot VM from Oracle(acquired Sun Microsystems, Inc.)

    - JRockit VM from Oracle( acquired BEA)

    - IBM''s J9 VM

    - Other VMs


    +   - JVM mainly does the following operations.

    - Loads the bytecode using the bootstrap classloader and then apps classloader

    - Verifies the bytecode

    - Executes the bytecode

    - Provides the runtime environment.


    +   - The Java HotSpot JVM is the latest and has the below features.

    - Adaptive compiler, which loads and analyzes the code for performance bottlenecks
    (hotspots) and takes the appropriate action to boost the performance.

    - Rapid memory allocation and garbage collection with fast and efficient collectors.

    - Thread synchronization with multithreaded code'
