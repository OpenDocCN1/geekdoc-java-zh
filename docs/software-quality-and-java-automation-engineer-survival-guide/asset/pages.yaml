    knowledge on SVN and recently popular GIT software for both developers and QA
    automation engineers.


    +   143. What is source code control system (SCCS) and SCM? Why do you need?

    - The SCCS stands for Source Code Control Software and SCM stands for Source Code
    Management. In a practical sense, both are referring the same and SCM is more
    widely used.

    - The main purpose of SCM is to have the source code versioning, collaboration,
    and sharing with others local or geographically dispersed teams or open source.


    +   144. Describe the key elements in SCM such as repository, workspace, versioning?

    - Repository is the storage that is being used to store the project source files/code.
    Also termed as source code repository. The repository (repo) is typically referred
    to as URL using HTTP or client specific protocol.

    - Workspace is the tree structure of the project source files organized to work
    with various build systems like ANT/Maven.

    - Versioning is the change management to keep track of all prior changes.'
