  md: '# Preface


    My book authoring is one of my dreams since the year 2009, and especially I was
    trying to share my accumulated knowledge to the world of people for their benefit.
    This book is aimed to help most of the software professions and especially to
    Quality Engineering folks who don''t have much support in terms of books and training
    compared to developers. This book should be helpful for anyone to understand the
    basic testing concepts, interview preparation in getting a new QA automation engineer
    job, or switching from another discipline to Software testing. If you feel otherwise,
    please feel free to contact at jagadeshmunta@everyday.gmail.com so that I can
    improve and take care of it as updates and new editions.


    The goal is to help you.


    Jagadesh Babu Munta'
