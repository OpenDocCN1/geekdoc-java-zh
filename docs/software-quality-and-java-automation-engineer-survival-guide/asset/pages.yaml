    \n+   - In most of the test automation, the Data Driven framework has been used.\n\
    - The Driven test design framework is a paradigm where test logic is fixed but\
    \ varies the test data. Here is the general analogy.\n  i. test == test logic\
    \ (or test assertions) + test data\n  ii. test data is input data and expected\
    \ output data\n  iii. test logic is looped through test data\n- That means the\
    \ test methods would be supplied with the data from the data provider in TestNG.\
    \ These methods will be executed with various input data such as conditions, boundaries,\
