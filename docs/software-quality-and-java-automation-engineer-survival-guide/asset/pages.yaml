  md: '# Skill #13. TestNG


    The TestNG is one of the common framework used across the unit testing, functional
    testing, and integration (end-to-end) testing. TestNG is being used in most of
    the recent projects and specifically in Selenium based test projects. Having hands-on
    with this skill is essential for both developers and QA automation professionals.


    413. What is TestNG framework? what are the key goals with TestNG?


    +   - TestNG stands for Test Next Generation, and it is a popular, free and open-source
    unit testing framework for Java but aimed at Unit Functional/Integration level


    +   - It is one of the base frameworks for Test Driver Development and is mainly
    inspired by JUnit. N-unit family frameworks


    +   - TestNG introduced Java SE annotations first and more features in the framework
    compared to JUnit


    +   - TestNG is easy to use and platform independent as it is written in Java.


    414. What are the key features of TestNG?


    +   - The below are the key features of TestNG framework


    +   - Supporting Java 5 annotations.


    +   - Grouping of multiple tests (say - into different categories like smoke,
    short, large, etc.).


    +   - Dependency among tests or group of tests.


    +   - Data Provider to support data driven architecture at the method level.


    +   - Flexibility in generating results reports and invoking the tests.


    +   - Nice HTML reporting for results.


    +   - Integrated with most of the Java IDEs and also many ways to execute including
    Maven.'
