    # 493. Explain and differentiate Data Driven, Keyword Driven, Hybrid test design
    frameworks.


    +   The Data Driven test design framework is a paradigm where test logic is fixed
    but varies the test data. That means to create the test methods and supply the
    data to them automatically. For example in TestNG, the data is provided by the
    data provider and TestNG would execute those methods with various input to cover
    different combinations, conditions, boundaries, etc. This methodology is so popular
    and useful to separate the data from the test code rather than hard-coded test
    data for maintenance and to add more test data later. The data itself can be in
    different repositories like a simple .csv file, .json file or .xls sheet, or database
    and can add the tests merely updating those external files or DB (instead of placing
    in test code itself).


    +   The Keyword driven framework is a methodology where actions or steps are treated
    as keywords. These keywords (like click, move, type etc.) are stored in some external
    repositories just like data in (.csv/.json/.xls/DB). The API methods would be
    created to perform operations matching for these keywords. The best way to understand
    this is to review Selenium IDE where Selenese commands used in the .html file
    as a test. In a similar way, one can create test framework so that test flows
    can be automated by simply updating the external files or DB than the test code.
    The framework driver would handle the keywords/operations/instructions and execute
    the tests. The hybrid framework is the combination of Data Driven'
