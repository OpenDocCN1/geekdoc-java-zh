  md: 'Alongside oil traders such as Timchenko, another important group that


    would play a prominent role in oil at the time of the Soviet Union’s break-


    up were state officials who controlled upstream production and the oil


    fields. Dubbed the ‘oil generals’ by Thane Gustafson, a leading expert on


    Russian oil, these individuals used imaginative schemes to enrich


    themselves from the sale of oil in the years just prior to 1991\. One such


    scheme was to set up a joint venture (JV) with a foreign oil services


    company (legalised in 1988), which would then contract with a Russian


    producer to refurbish idle oil wells. The foreign JV would be paid in dollars


    for this work through the exportation of oil from enhanced oil production.


    By distributing the contracts for fixing these idle wells – many of which


    were in reality fully functional – the oil generals could route the proceeds


    through these JVs into overseas bank accounts.^(19) Gustafson reports that


    hundreds of millions of dollars were earned by oil managers through these


    and other means, and later used to purchase stock when the oil industry was


    privatised.^(20)


    The emergence of these kinds of private actors across the oil industry


    reflected the acute disintegration of the command economy that had taken


    place by the time of the Soviet collapse. After 1991, these same individuals


    were well positioned to take advantage of the full privatisation of Russian


    oil that unfolded between 1992 and 1998\. The first phase of this


    privatisation began with a presidential decree issued in 1992 by Russia’s


    first post-Soviet president, Boris Yeltsin. Yeltsin’s decree designated three


    state-owned oil companies – LUKoil, Surgutneftegaz, and Yukos – as joint


    stock companies, allowing up to 55 per cent of their shares to be held by


    private interests. At the time, these three firms accounted for around 40 per


    cent of all oil produced in Russia and controlled both upstream crude oil


    production as well as refineries.^(21) Following the part-privatisation of these


    firms, three Soviet-era oil generals emerged as their dominant private


    shareholders. The new owners then moved quickly to set up alliances with


    oil traders (such as Gennady Timchenko) who were able to transport oil


    (and refined products) to foreign export markets. Through these alliances,


    LUKoil, Surgutneftegaz, and Yukos began to resemble vertically integrated


    Western oil companies, and over time, trading activities would be mostly


    brought in house. Today, LUKoil and Surgutneftegaz remain controlled by


    the same individuals who dominated during this first phase of


    privatisation.^(22) As we shall see, the fate of Yukos was to be quite different.'
