  md: 'Libya and the ‘Leapfrogging Effect’


    The tremendous impact of Soviet oil exports on the world market illustrates


    once again why major international oil companies were so preoccupied with


    the problems of an oversupply of crude through much of the twentieth


    century. Attempts to restrict and limit the circulation of oil surpluses had


    driven the formation of the Iraq Petroleum Company, the Red Line


    Agreement, and subsequent secret arrangements designed to keep oil off the


    world market. These arrangements had brought limited, albeit temporary,


    success in restricting supplies. But through the 1960s – as the number of


    buyers and sellers outside the Seven Sisters multiplied – the interests of the


    main producer states (outside the US) stood opposed to any restriction of oil


    production. For the Soviet Union, oil exports were a lifeline in a hostile


    global political and economic environment. OPEC producers also sought to


    maximise the quantity of oil extracted and exported, because royalty


    payments were based on the volume of oil produced. In this context, it was


    becoming increasingly difficult for the Western majors to manage the


    problem of global crude surpluses.


    However, soon after the establishment of OPEC in 1960, a new factor


    was to emerge within this tussle over global production levels: the entry of


    Libyan oil onto the world market. Oil exploration had begun in Libya in the


    early 1950s and significant reserves were discovered in 1959\. Not only was


    Libyan oil plentiful and easy to extract, but it was also much closer to


    European markets than oil from the Gulf, and its extremely low sulphur


    content – a so-called ‘sweet oil’ – made it cleaner and cheaper to refine.


    Through the 1960s, the country’s oil production grew faster than anywhere


    else in the world, and in 1968 Libya overtook Kuwait to become the fourth-


    largest OPEC producer, just behind Venezuela, Iran, and Saudi Arabia. By


    this stage, almost a third of Europe’s oil was being supplied from Libya.^(28)


    But within the leading group of OPEC producers, the structure of the


    Libyan oil industry was distinctive: many more of the country’s concessions


    were in the hands of the large US independents (such as Occidental,


    Continental Oil, and Marathon), rather than the Seven Sisters. Indeed, by


    1970 more than half of Libya’s oil production was produced by


    independents, compared to an average of 15 per cent across OPEC as a


    whole.^(29)'
