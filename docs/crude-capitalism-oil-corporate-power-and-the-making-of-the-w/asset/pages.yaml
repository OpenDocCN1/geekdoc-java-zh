    Across the tumultuous two decades following the Second World War, oil


    had systematically displaced coal as the world’s key fossil fuel. Oil’s rise


    was transformative to capitalism: the restoration of the post-war rate of


    profit, the internationalisation of capital, the qualitative growth in new


