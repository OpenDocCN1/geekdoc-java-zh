  md: 'explosion in global debt. As we have seen in the previous chapter, these


    economic shifts were wrapped up in complex ways with changes to the


    global oil industry itself: new sources of supply; new industry actors; new


    forms of oil trading; and the eventual breakdown of the OPEC-administered


    pricing system in 1985–86\. Taken together, these transformations in the


    world market – of which low oil prices were simply one manifestation –


    severely exacerbated the deep internal contradictions of an undemocratic


    and bureaucratised polity (including across the Soviet Union’s larger bloc of


    international allies). In turn, this situation of crisis only hastened the


    disintegration of the country’s oil industry, and thus the ability to produce


    and export oil. None of this was a matter of causal primacy in either global


    *or* domestic factors, but the interaction of the two – with the oil circuit


    serving as the key mediating link in this relationship.


    Following the 1991 collapse, the social dynamics of the new post-Soviet


    capitalism continued to be fundamentally tied to the world market through


    the mediation of oil. The years immediately following the break-up were


    disastrous for most of the Russian people. A 40 per cent decline in GDP


    between 1991 and 1996 left more than a third of the country’s population


    living below the poverty line; mass joblessness reappeared, and life


    expectancy dropped by an astounding five years following the collapse of


    the public health and welfare systems.^(14) But, while living standards


    plummeted for the majority, a sliver of the population managed to capture


    the opportunities for wealth and power that emerged with the


    dismantlement of the old Soviet state apparatus. These new private owners


    of economic wealth did not suddenly materialise in 1991; they had been


    nurtured in the final years of the Soviet Union under Gorbachev’s policies


    of market opening, which had allowed a small number of state managers


    and bureaucrats to begin to convert their political power into stable


    economic wealth.^(15) The oil circuit was essential to this early accumulation


    of capital.


