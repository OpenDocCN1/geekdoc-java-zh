  md: 'speculative capital increased debt levels and inflated stock market bubbles


    across Latin America, East Asia, and Eastern Europe. By mid-1997, these


    bubbles reached their limit following the collapse of the Thai baht, which


    caused a sudden withdrawal of foreign capital from the East Asia region.


    Russia was soon facing similar problems, with foreign investors beginning


    to pull their money out of the country’s stock markets from December 1997


    onwards.


    At this time, Russia operated a fixed exchange rate system, with the


    government attempting to keep the rouble’s value within a narrow band


    through intervening in the foreign exchange market. But as capital outflows


    continued to accelerate during the first few months of 1998, this system


    came under severe pressure. Despite $22 billion worth of emergency loans


    provided by the IMF and World Bank, the Russian authorities could not


    stem the capital outflows or afford to continue supporting the rouble. By


    August 1998, the government was forced to allow the rouble to float freely,


    promptly leading the Russian currency to lose more than two-thirds of its


    value in the space of less than three weeks.^(35) At the same time as this


    currency devaluation, the Russian government announced that it would


    default on its domestic government debt obligations, many of which were


    held by Russian banks.


    The rouble devaluation and the government domestic debt default


    effectively bankrupted most financial institutions in Russia, including the


    leading banks. However, in a flagrant illustration of the state’s support to


    the business class, a three-pronged set of government-led measures helped


    save these banks.^(36) First, the banks were allowed to prevent the withdrawal


    of customer deposits (except under specific conditions favourable to them)


    and were granted a three-month moratorium on external debt repayments


    through new government legislation.^(37) Second, the government provided


    the banks with substantial short-term capital funding. Third, and most


    importantly, the bank’s owners simply engaged in straightforward asset-


    stripping: the best-performing assets were placed in a new bridge bank


    (with the same owners as the old bank), while liabilities were kept in the


    original bank that was allowed to fail.^(38) Through these measures, the net


    outcome of the 1998 crash was simply to move ‘assets from victims of


    economic shocks to their beneficiaries’ – and most of the large


    conglomerate banks managed to survive in a repackaged form.^(39)'
