  md: 'A striking absence in much of the discussion around future climate


    scenarios is the question of petrochemicals and plastics. As we have seen


    throughout this book, the synthetic revolution was a major factor in how oil


    became woven into the very fabric of our social existence – yet the


    omnipresence of petrochemicals has hidden them from view. This fact was


    noted recently by the executive director of the International Energy Agency


    (IEA), Fatih Birol, who has described petrochemicals as ‘one of the key


    “blind spots” of the energy system’, poorly understood even by energy


    professionals.^(82) Today, petrochemicals are decisive to the future trajectories


    of fossil fuel use. The IEA estimates that petrochemicals will make up more


    than a third of the growth in oil demand to 2030, and nearly half to 2050 –


    an amount greater than trucks, aviation, or shipping (the other components


    of oil demand that are difficult to replace with existing technologies).^(83)
    It is


    perhaps conceivable that some of the demand for oil and gas *as energy*


    *sources* can be reduced through alternative technologies and improved


    efficiencies, but there is no possibility of ending our reliance on oil as long


    as petroleum remains the fundamental material basis for commodity


    production. For this reason, industry analysts and oil firm representatives


    alike speak openly of petrochemicals as a solid guarantee for ‘the future of


    oil’.^(84)


    The consumption of petrochemicals sits elephant-like in the ecological


    crisis of the present. The starkest illustration of this is the exponential


    growth in the most pervasive of all petroleum products: plastics. The annual


    global production of plastics grew nearly two hundredfold between 1950


    and 2015, and the pace of growth is accelerating – quite remarkably, around


    half of all plastics ever made were produced in the past twenty years.^(85) This


    seemingly unstoppable demand in the consumption of plastics is driven by


    the systematic displacement of natural materials across all industrial and


    household sectors. To give but one example, the production of polyester


    fibre now exceeds that of all other fibres combined, including wool and


    cotton, and now makes up around 60 per cent of total global fibre


    production.^(86) Writing in the late 1950s, the French philosopher Roland


    Barthes once foresaw a future in which ‘the hierarchy of substances is


    abolished [and] a single one replaces them all: the whole world can be


    plasticized’.^(87) That synthetic reality is now firmly upon us.'
