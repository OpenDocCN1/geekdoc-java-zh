  md: 'Much of the international discussion around Rosneft portrays the company


    as emblematic of economic policymaking in Putin’s ‘KGB state’ – statist,


    anti-market, and undermining the position of private capital in Russia.^(57)


    There are many problems with this perspective. First, it tends to downplay


    the ongoing and significant participation of privately owned firms in


    Russian oil.^(58) While some of the original Russian oil billionaires have


    exited the business, most did not share the fate of Khodorkovsky, and there


    are numerous examples of individuals who remain involved in downstream


    activities or in other international oil firms (see Table 10.1).^(59) In 2020,


    private oil companies were producing around 45 per cent of the country’s


    total oil (down from around 60 per cent at the time of Yukos’s demise).^(60)


    The largest of these firms are LUKoil and Surgutneftegas – ranked as


    second and third oil producers in the country – and they are led by the same


    individuals who took charge in the early 1990s. The Russian Energy


    Ministry reported 290 active companies in the Russian oil industry in 2019,


    but with just nine vertically integrated firms producing more than 80 per


    cent of the country’s oil.^(61) Five of these nine firms are privately controlled.


    Moreover, Rosneft has also supported the development of private capital


    through its listing on domestic and international stock markets. These


    connections began in 2006, when 13 per cent of the company was floated


    on the London and Moscow stock exchanges, raising $10.4 billion in the


    largest IPO in Russian history. Stock ownership enabled large Russian


    capitalists to grab a share of the oil rents generated by Rosneft, and much of


    the country’s billionaire class invested heavily in the company at this


    time.^(62) This includes the top leadership of Rosneft, who are major *private*


    shareholders in the company, and thus should properly be seen as both


    capitalist owners *and* state managers.^(63) Western and other non-Russian


    investors have also been eager to participate in Rosneft. In 2013, BP took a


    20 per cent stake in the company, receiving two representatives on


