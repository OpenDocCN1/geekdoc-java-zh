  md: 'One critical manifestation of the challenges facing American dominance


    was the role of the US dollar within the global financial system. Since the


    establishment of the Bretton Woods monetary system in 1944, global


    finance had been structured around the pegging of other international


    currencies to the dollar, which was then convertible to gold at a price of


    $US35/ounce (hence its description as the dollar-gold standard). With the


    dollar serving as the central currency for international transactions, the US


    supplied dollars to the rest of the world, and other currencies were adjusted


    in value through an exchange-rate system overseen by the International


    Monetary Fund (IMF). This gave the US an ‘exorbitant privilege’ in the


    words of French Minister of Economy and Finance Valéry Giscard


    d’Estaing, because it could create dollars for a few cents while other


    countries were forced to exchange real goods and services for the US


    currency.^(35) By the early 1970s, however, the large quantities of US dollars


    held by private and central banks outside the US made it increasingly


    difficult for the US to maintain a fixed value of its currency in terms of


    gold. Through 1970, several European countries had demanded redemption


    of their US dollar holdings for gold – and with vastly more US dollars in


    circulation outside the US than could be covered by US gold reserves, US


    President Richard Nixon took the dramatic decision on 15 August 1971 to


    suspend (with certain exceptions) the convertibility of the dollar into gold.


    For the major oil-exporting countries, Nixon’s decision had immediate


    and severe ramifications. With the US dollar no longer pegged at a fixed


    value to gold, its value dropped significantly in 1971 and 1972.^(36) Crucially,


    however, most oil sales were priced in dollars, which meant that the reserve


    holdings of oil producers depreciated in step with the weakening of the US


    dollar. At the same time, import costs were also growing for OPEC states


