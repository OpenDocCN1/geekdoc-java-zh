    brandishing their climate achievements, however, these companies deploy


    the same carbon accounting tricks as the Western firms. One of these is to


    measure only the emissions generated in the actual production of oil – not


    the remaining 85–90 per cent of emissions released when the oil is used.^(110)


    Another related popular climate objective used by Gulf NOCs is reduction


    in the so-called carbon intensity of upstream production – the greenhouse


    gas emissions generated in the production of oil as a proportion of the


    amount of oil sold.^(111) The obvious flaw in using this ratio as any kind of


    measure for sustainability is that it places no limitations on growth in


    *absolute* levels of oil production: get your employees to walk to work rather


    than take the company bus and you can produce more oil at less intensity.


    Perhaps the only innovation in Gulf climate-speak is Saudi Aramco’s notion


    of ‘lower carbon oil’ – the idea that Saudi oil is a more ecologically sound


    choice than oil from other countries because it is easier to extract and thus


