    The Counter-revolutionary Turn


    The establishment of OPEC in 1960 was followed by a series of counter-


    revolutionary events that profoundly shaped the character of the new


    organisation. In Saudi Arabia, the Free Princes Movement was quashed


    following the coming to power of a new Saudi king, Faisal, in 1964.


    Faisal’s ascension was fully backed by the US and the major American oil


    companies, who saw in him an effective counterforce to the radicalising


    impulses of figures such as Abdullah Tariki. For his part, Tariki was exiled


    in 1962, forced to live out his life in Beirut and later Cairo, where he edited


    a magazine that railed against OPEC’s timidity and called for oil


    nationalisation and the redistribution of oil wealth across the region.^(66)


    Meanwhile, in Iraq, Abd al-Karim Qasim was ousted by a US-supported


    coup in February 1963, bringing the Ba’th Party to power amid a bloody


    massacre of thousands of communist and left-wing militants.^(67) The killings


    were made possible in part because US intelligence agents had supplied the


    Ba’th with the details of Communist Party members in advance of the coup.


    As Brandon Wolfe-Hunnicutt observes, this moment was foundational to a


    new American counter-insurgency strategy, in which local US-backed


    forces were deployed to assassinate left-wing opponents. Henceforth,


    American military planners would systematically apply the same policy


    across the world – perhaps most horrifically illustrated in the killings of


    over a million Indonesians in a US-backed military coup against Ahmad


    Sukarno in 1965.^(68)


