    Petro-Power: The Rise of the US Oil


    Industry


    In 1859 when Colonel Drake drilled the first successful American oil well


    in the small town of Titusville, Pennsylvania, he could not possibly have


    anticipated what would follow.¹ Up until then, oil was typically collected


    from the surface of rivers or through natural rock seepage. Its primary use


    was in the manufacture of kerosene, which was a cheaper and more


    efficient fuel for lamps and lighting than alternatives made from coal or


    whale blubber. The kerosene business was highly profitable and would


    become even more so during the American Civil War (1861–65), when


    increased taxes on alcohol priced kerosene’s other major competitor,


    camphene, out of the market. But, at this stage, there was little indication


    that oil would become anything other than a single-product industry


    focused on the manufacture of kerosene. In fact, as Drake sank his fateful


    well into the Pennsylvanian soil on 27 August 1859, the American energy


    system was still largely wood-based; it was not until 1885 that coal finally


    overtook wood to become the primary energy source in the US.²


    Nonetheless, there was still plenty of money to be made in oil, and


    Drake’s success meant that Pennsylvania soon attracted thousands of people


    from across the country hoping to make it rich (including the young actor'
