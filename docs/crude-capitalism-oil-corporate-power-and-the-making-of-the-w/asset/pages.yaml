  md: 'Gorbachev period, this fragmented structure provided wealth-making


    opportunities for anyone able to find ways to move streams of crude and


    refined products outside official channels.^(16) But fragmentation also meant


    that it was not initially possible for an individual to take control of the oil


    field, transport, refining, and export within one vertically integrated


    company. Instead, encouraged by Gorbachev’s policies of market opening,


    alliances formed between oilfield managers, refiners, and the traders who


    could reach export markets. In many cases, criminal gangs played an


    important role in these networks, assisting with the transportation of oil and


    helping launder its wealth – as well as providing physical protection against


    rivals.


