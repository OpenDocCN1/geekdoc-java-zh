  md: 'But beyond these monetary considerations, CCS also plays an important


    role in the oil companies’ own NZE aspirations. At first glance, claims of a


    net zero oil company may appear paradoxical – after all, how could a barrel


    of oil not produce any emissions? But the key to deciphering this


    contradiction lies in the sleight of hand that oil companies use in their own


    carbon accounting. When oil companies report their carbon emissions, they


    refer only to the carbon involved in the actual *production* of a barrel of oil
    –


    not the carbon released when that oil is consumed.^(26) In reality, however, at


    least 85 per cent of the carbon emissions associated with the industry come


    from oil’s final consumption – not its drilling, extraction, and refining. As


    such, oil companies can bank CCS against the emissions associated with


    their operations, claiming they are supporting the transition to net zero (and


    earning large tax benefits to boot), all the while ignoring the fact their


    product is the main driver of global warming. To return to the tobacco


    analogy, this is a bit like Philip Morris disavowing responsibility for


    cigarette deaths because lung cancer rates were very low among workers on


    the company’s assembly line.^(27)


    All of this highlights the basic problem with the NZE framework: by


    claiming that the use of some (as yet mostly speculative) technologies will


    eventually cancel out future carbon emissions, the oil industry is able to


    expand production in the here and now. As with the most effective kinds of


    advertising, NZE works by appearing as something it is not: net zero is *not*


    *zero carbon*, and the focus on *net* emissions deflects attention away from


    the oil companies’ *absolute* levels of hydrocarbon production. The perverse


    incentives that animate the calculus of carbon accounting are driving us


    towards even greater levels of oil production, led by newly greened oil


    companies. It is a dangerous wager, ultimately premised on a future


    technological fix, which serves to legitimise ongoing fossil fuel production


    and consumption. Or, as three scientists who once embraced the NZE


    concept now put it: ‘In practice it helps perpetuate a belief in technological


    salvation and diminishes the sense of urgency surrounding the need to curb


    emissions now. We have arrived at the painful realisation that the idea of net


    zero has licensed a recklessly cavalier “burn now, pay later” approach


    which has seen carbon emissions continue to soar.’^(28)'
