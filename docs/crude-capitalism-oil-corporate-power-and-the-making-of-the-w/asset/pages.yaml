    including the manufacture of heavy machinery, automobiles, medicine,


    construction, consumer goods, packaging, and so forth.^(68) Akin to modern-


    day alchemy, a bag of small pill-like thermoplastic pellets could be


    transformed into any simple commodity with the appropriate mould. And,


    once a mould was in place, there was little extra cost to manufacturing each


    additional item; this not only further accelerated the expulsion of labour


    from an even wider sphere of commodity production, it also encouraged


    enormous increases in commodity output.^(69)


    In this manner, the petrochemical revolution was inseparable from the


    chronic levels of commodity overproduction that came to mark the post-war


    era. As huge quantities of new and easily reproducible synthetic goods


    displaced natural materials during the first decades after the Second World


