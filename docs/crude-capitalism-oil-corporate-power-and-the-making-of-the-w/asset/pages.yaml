  md: '1


    Approaching Oil


    Nearly four decades ago, a large team of scientists from around the world


    launched a major global research programme called the International


    Geosphere-Biosphere Programme (IGBP). Their goal was to study the


    connection between human activities and changes to the earth’s biological,


    chemical, and physical systems, and in 2004 they synthesised the results of


    their initial research phase in a 336-page report entitled *Global Change and*


    *the Earth System*. The report revealed that humanity was causing a series of


    unprecedented changes that were pushing ‘the Earth System well outside of


    its normal operating range’.¹ Never before had the world’s atmosphere,


    land, coastal zones, and oceans experienced change at the rate that was now


    occurring. This was ‘a no-analogue situation’ according to the IGBP


    authors, and raised the very real threat of catastrophic, non-linear, events


    that could destroy the natural systems on which the survival of humanity


    depends.²


    Twenty years have elapsed since this report was issued, and the casual


    reader might be forgiven for dismissing it simply as an interesting historical


    artefact – one more example of an urgent warning ignored in a long road of


    climate inaction. But the IGBP synthesis made one distinctive and path-


    breaking observation that remains highly relevant today: *something*


    *happened around the middle of the twentieth century*. The significance of'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'this turning point is confirmed by the report in a series of iconic ‘hockey-


    stick’ graphs, which show environmental markers such as atmospheric


    concentration of carbon dioxide beginning gradually to increase from the


    1750s, and then suddenly exploding around 1950.³ As Ian Angus points


    out, the timing of this ‘Great Acceleration’ surprised the lead authors, who


    had expected to see changes to the earth’s systems follow a steady, linear


    trend starting from the Industrial Revolution in the eighteenth century.⁴


    Instead, the IGBP report concluded:


    The second half of the twentieth century is unique in the entire history


    of human existence on Earth. Many human activities reached take-off


    points sometime in the twentieth century and have accelerated sharply


    towards the end of the century. The last 50 years have without doubt


    seen the most rapid transformation of the human relationship with the


    natural world in the history of humankind.⁵


    Why was the mid-twentieth century *the* turning point in humanity’s


    impact on the earth’s systems? The simple – but incomplete – answer is *oil*.


    Oil first began to emerge as a significant energy source in the US during the


    early 1900s, although, at the time, coal remained the dominant fossil fuel. A


    major leap towards an oil-centred world occurred around the Second World


    War, when the shift from coal to oil was extended across Western Europe,


    and then later through newly industrialising countries in other parts of the


    world. The oil transition massively accelerated the world’s consumption of


    fossil fuels and thus carbon emissions: nearly three-quarters of the human


    driven increase in the atmospheric concentration of CO2 has happened since


    1950, and about half since the 1980s.⁶ Despite hopes of another great


    transition towards renewables, oil remains by far the world’s most


    important energy source today, making up around 40 per cent of all fossil


    fuels consumed in 2022 and one-third of the world’s primary energy


    (renewables constituted slightly more than 14 per cent).⁷ As the world’s


    most traded product, oil’s economic power also remains indisputable.


    Measured by revenue, four out of the six biggest companies in the world are


    oil companies, and in 2022, the Saudi Arabian oil giant Saudi Aramco made


    history by recording a profit of over $100 billion – the largest profit made


    by any company, in any industry, *ever*.⁸'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'Oil, in other words, remains at the core of our economy and our energy


    systems; without dislodging it from this position there is no possibility of


    ensuring a future for humanity. The focus of this book is the story of how


    we find ourselves in this predicament – with the hope that this might tell us


    something about what must be done to dismantle the fossil economy. But


    the approach taken here breaks with the way oil is usually written about.


    Too much of our everyday thinking about oil invests it with some kind of


    inherent magical power, capable of transforming and changing societies by


    its presence (or absence) – a kind of ‘commodity determinism’, in the


    words of Michael Watts.⁹ This power is seen in the various labels often


    used to describe oil: a ‘prize’, ‘curse’, ‘devil’s excrement’, and so forth.^(10)


    Now, oil certainly does provide incredible wealth for some and has


    simultaneously been enormously destructive for others, but the problem


    with this way of thinking is that it ascribes a causal power to oil itself,


    which, at the end of the day, is simply a sticky black goo. The real secret to


    the oil commodity lies instead in the kind of society that we live in – the


    priorities, logics, and behaviours that derive from how society is currently


    organised.^(11) These social relations are what give oil meaning; they are


    where oil’s apparent ‘power’ comes from.


    As the title of this book indicates, the ‘kind of society that we live in’ is


    referring here to capitalism. Capitalism’s internal *raison d’être* is one of


    endless accumulation – a drive to continually accumulate money that


    overrides all other considerations. This social logic differs from all


    preceding human societies and has had a profound impact on energy use


    and energy systems. A starting assumption of this book is that, without


    foregrounding capitalism as a social system with its own distinct logics, we


    lack any explanatory reason for *why* and *how* oil emerged as the dominant


    fossil fuel through the twentieth century (and even more importantly, what


    must be done about it). The problem with most conventional writing about


    oil is that this historical uniqueness of capitalism as a social system is


    ignored – in fact, capitalism rarely makes an appearance.^(12) The result is to


    naturalise the social system we currently live under. In turn, the emergence


    of an oil-centred world is treated as a self-evident outcome of oil’s material


    qualities (such as its high energy density, transportability, and efficiency).


    Put differently, oil’s power is assumed to derive from the natural properties


    of the commodity itself, separate from the social system that gives these'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'properties meaning and significance.^(13) The story of oil then falls back
    into


    descriptive narratives focused on the attempt to control this magical


    commodity: tales of swashbuckling early oil entrepreneurs, the intrigues of


    the major Western oil companies, or the geopolitical tussle to capture a


    supposedly scarce resource.


    The past two decades have seen a large body of critical writing break


    with these conventional ways of telling oil’s story. For example, Timothy


    Mitchell’s work on the transition from coal describes oil’s part in the


    emergence of modern democracy, and other important contributions also


    centre oil more fully in the making of contemporary capitalism, forms of


    political and economic power, and cultural life.^(14) Scholars have retold the


    early history of oil from the perspective of anti-colonial protagonists in


    Latin America and the Middle East, situating these in the broader backdrop


    of the ‘Third World’ struggles of the post-war decades.^(15) Other work has


    critically interrogated the claims of ‘oil security’ and supply scarcity that


    have long underpinned traditional accounts of US foreign policy around


    oil.^(16) Outside of North America and Europe, there is a burgeoning literature


    looking at the much-neglected histories of workers in the oil industry, and


    the ways that oil has shaped distinct spaces of urban and rural life in non-


    Western settings.^(17) Alongside this historical revisionism, a rich set of


    ecological accounts has sought to integrate oil more systematically into the


    rhythms of accumulation, profitability crises, and uneven global


    development – an analytical shift that bears directly on the challenges of


    climate change and any possibility of moving away from fossil fuels.^(18)


    This literature has upended many of the traditional tropes that govern


    thinking about oil and refocused attention on the social processes in which


    oil is embedded and in turn helps to shape. Building upon these insights,


    this book aims to do three things. The first is to move beyond the emphasis


    in a lot of oil writing on the ‘upstream’ segment of the business – the


    exploration and extraction of subterranean crude reserves – to look instead


    at what oil *becomes* once it is pulled out of the ground. Oil is an


    extraordinary commodity that has little immediate use in its crude state, but


    which is destined to take on a diverse array of forms as it circulates through


    capitalist economies. These forms encompass much more than energy or


    transport fuels – and herein lies a key part to oil’s secret. We will consider,


    for instance, oil’s transformation into petrochemicals and plastics, a'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'material substrate that now underlies all aspects of commodity production


    and consumption. We will also focus on the transformation of oil into oil


    *wealth*, which has played a foundational part in the making of global


    finance. By foregrounding the various forms that oil takes as it circulates,


    we gain a much fuller sense of how oil is given meaning under capitalism –


    and a better understanding of what it *does* for capitalism. Such an approach


    also reveals the crucial role of the industries, infrastructures, and workers


    that enable oil to move, change, and be consumed – ships and ports,


    refineries, chemical firms, banks, financial markets, and so on. Each of


    these sites plays no less a part in the story of oil than the struggle over


    prized reserves located deep underground.


    Continually transformed, oil comes to saturate and shape all aspects of


    our social existence. Given this fact, a second major goal of this book is to


    ask how the shift to oil has also worked to produce and structure the world


    market across the twentieth century. Here, a key theme is the relationship


    between oil as the principal fossil fuel and the consolidation of US


    capitalism as the most dynamic pole of the global economy following the


    end of the Second World War. This relationship is a complex story that is


    not reducible to the direct control of physical crude oil reserves. Rather, the


    diverse ways that oil was embedded in capitalism also worked to reinforce


    and nurture US power. Understanding why this was the case necessarily


    involves looking closely at the development of the oil industry and


    capitalism in the United States and Western Europe. But it must also


    encompass major oil-producing regions outside these primary centres of the


    world market. Too much writing on oil reduces such non-Western producers


    to simply giant oil spigots – their societies remain as black boxes, destined


    only to enter history as an object of foreign domination. A key premise of


    this book is to insist that the social structures of major non-Western oil


    producers – especially the Gulf Arab states and Russia – are internal and


    active parts in the making of the contemporary world market (and often in


    surprising and unexpected ways). This is not about adding more national


    case studies to the history of oil, or a view that capitalism is everywhere the


    same, emanating out from the West to the peripheries. Rather, it is an


    approach that takes capitalism as global from its inception, formed through


    the interdependencies and ‘reciprocal transformations’ that take place


    across the world market.^(19) And, as we shall see in later chapters, all of this'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'bears significantly on the possibility of a further global transition – the


    decline of US hegemony and the rise of new centres of world power.


    Finally, tracing how oil helps make the world market clearly requires an


    understanding of how it is controlled. To this end, a third major goal of this


    book is to provide a concrete mapping of the companies and other entities


    that control the circulation of oil today – where they came from, what they


    do, how they are organised, who owns them, and their connections to the


    state and other economic sectors. There is a long tradition in oil scholarship


    that has attempted to do this, mostly focused on the rise of the seven large


    Western firms that would dominate world oil for most of the twentieth


    century (the so-called Seven Sisters).^(20) This book draws extensively on this


    older literature, but also emphasises that we must look beyond the very


    largest Western firms to really understand how the industry operates today.


    Most strikingly, a new axis of world oil is now emerging around giant non-


    Western firms in the Middle East and East Asia. This shift is closely related


    to the rise of China and wider Asia as core zones of global production and


    is dramatically changing the nature of corporate power in oil. It has,


    however, been largely ignored amid the Euro-American focus of much oil


    writing. A main take-away from this book is that these new oil powers need


    to be placed front and centre in the debate around the future of oil and the


    struggle against climate change.


    Before laying out exactly how these various themes are explored in the


    chapters of this book, it is necessary to take a step back and consider some


    broader conceptual questions concerning energy, capitalism, and the


    historical transition to fossil fuels. What is so different about the dynamics


    of capitalism compared to other social systems? What do these specific


    logics of capitalism mean for the demand for energy, and the types of


    energy sources that are favoured under this social system? Why did the shift


    to fossil fuels (in the form of coal) begin to consolidate in Britain around


    the end of the eighteenth century, and what did this transition mean for


    capitalist development? What actually *is* an ‘energy transition’? The


    answers to these questions are essential to explaining just why those


    hockey-stick graphs of the IGBP exploded in the middle of the twentieth


    century – and where they might be heading today.


    Capitalism and Energy: Why Fossil Fuels?'
