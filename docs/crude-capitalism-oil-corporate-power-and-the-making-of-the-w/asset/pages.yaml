  md: 'states – whose principal concern is the maximisation of profit. This is not


    an ethical failing on the part of oil firm executives, but a condition imposed


    by the nature of capitalism itself. It is not possible for these conglomerates


    to prioritise an objective other than the pursuit of profit – they act within
    ‘a


    machine that no one controls. Every agent must conform to its imperatives.


    Fail to turn an adequate profit and [they] will not survive.’^(114) This is


    precisely why the trajectories of low-carbon technologies are on their


    current path – commodified, market-driven technologies that complement


    the continued growth of fossil fuels, while affording minimal change to the


    existing system. It should not need to be said, but given the current state of


    the world it must: there can be no effective response to climate change


    steered by the oil industry.


    The second part of the problem is that we are faced with more than the


    corporate power of oil. As we have seen throughout this book, behind the


    oil industry lies deeper structural forces that have embedded oil into every


    aspect of life across the twentieth and twenty-first centuries. Beyond its


    central roles as energy and transport fuel, oil and its derivatives underline


    all forms of commodity production. Our food and our financial systems rest


    on oil. Oil’s centrality stems from what it does for the imperatives of


    accumulation: its ability to accelerate and expand capital’s turnover,


    cheapen the costs of production (including labour), and knit together an


    international market. No other commodity plays this role. The immense


    power of the firms that make up Big Oil – and their close association with


    the rise of the US through the twentieth century – stems from this


    foundational place in capitalism. For this reason, while these oil firms are


    indeed a major obstacle to ending our dependence on fossil fuels, they are a


    *manifestation*, not a cause, of the underlying problem. We must confront the


    multiple logics of a social system that has served to centre oil throughout all


    aspects of our lives. And we cannot extricate ourselves from oil’s


    pervasiveness – certainly not at the pace necessary to halt runaway climate


    change – while remaining within this social system.


    Systemwide transformation rooted in democratic control over energy and


    technology is thus urgently needed. Many activists now refer to such


    change as *ecosocialism*, a label that highlights the need to go beyond


    capitalism, while centring ecology and the repair of the biosphere at the


    heart of any radical shift. Ecosocialism means ending the blind pursuit of


    growth and endless accumulation that drives capitalism, replacing this with'
  merge: -1
