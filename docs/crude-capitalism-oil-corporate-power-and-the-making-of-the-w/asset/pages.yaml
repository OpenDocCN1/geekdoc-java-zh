    the Soviet Union, the domestic price of oil was fixed at a level much lower


    than international prices – around a hundred times less at the time of the


    Soviet collapse.^(17) Tempted by this huge price differential, well-connected


    state managers sought to obtain export licences and establish their own


    private trading companies linked to oil refiners and tanker companies. One


