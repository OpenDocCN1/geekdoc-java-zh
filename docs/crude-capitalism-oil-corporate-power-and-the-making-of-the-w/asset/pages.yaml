  md: 'The Rise of Putin and Rosneft


    Through the privatisation of state-owned assets and other means of wealth


    transfer, the Yeltsin era had produced a new capitalist class in less than a


    decade. This explosion of Russian finance capital was founded in control


    over the oil industry, which served as the crux of accumulation within a


    wider conglomerate structure that spanned all major economic activities.


    Yet this rapid process of class formation had also been accompanied by a


    far-reaching crisis of political legitimacy fed by the disintegration of the


    basic capacities of the Russian state – much of this due to the plundering of


    state wealth by the largest billionaires and the venality of political decision-


    making led by the interests of warring business factions. With the viability


    of the new Russian capitalism under threat from these problems of state


    capacity and political legitimacy, the post-1998 period was thus primarily


    one that involved a restructuring in the relationship between the leading


    business groups and the centres of political power. Once again, control over


    oil stood at the base of this process of state re-composition.


    Outside the narrow circle of billionaires, most Russians experienced a


    perilous decline in living standards at the time of the 1998 crisis, with a 5.3


    per cent fall in GDP marking the worst contraction of economic activity


    since the end of the Soviet Union. Inflation rates also spiked, reaching more


    than 80 per cent; real wages collapsed, and around half of all economic


    transactions were taking place through barter rather than with cash.^(46) This


    social and economic crisis ripped apart Russian society, exacerbating the


    deep inequalities of post-Soviet life. As a result, protest and labour strikes


    erupted across the country, frequently directed against the largest banks and


    industrial conglomerates. In the maelstrom of this political instability, Boris


    Yeltsin appointed Vladimir Putin as prime minister in August 1999 – the


    fifth person to hold the position since the crisis had begun a year earlier.


    With Yeltsin’s resignation in December 1999, Putin then became


    president.^(47)


    On assuming power, Putin’s main challenge was to restore basic state


    functions such as tax collection, economic management, and control over


    policymaking in the context of the severe financial crash and widespread


    political crisis.^(48) Above all, this meant disciplining the leading business


    owners, whose activities (especially tax avoidance) were undermining the'
  merge: -1
