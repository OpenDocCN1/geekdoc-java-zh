  md: 'For the Seven Sisters, Libya’s strong connection to independent


    producers created a major dilemma. Because these independent firms


    lacked established markets, they were willing to sell their Libyan oil at a


    lower price than that offered by the Seven Sisters (a similar strategy, in


    many respects, to that of the Soviet Union).^(30) Faced with the problem of


    oversupply and the pressure that falling market prices placed on profit rates,


    the Seven Sisters could not unilaterally reduce the posted price, because this


    would jeopardise the already shaky relationship between the oil companies


    and the main producer governments.^(31) At the same time, if the Seven


    Sisters cut back on their production elsewhere in the Middle East to make


    way for Libyan production, countries such as Saudi Arabia and Iran would


    protest the impact of this on oil exports (and thus government revenue).


    But, if the international majors chose not to produce in Libya, then the share


    of production held by independents would continue to increase, and these


    newcomers would have little incentive to stop selling oil at rock-bottom


    prices.^(32)


    The situation was finally brought to a head in 1969 with the overthrow of


    Libya’s ruling monarch, King Idris. He was ousted in a coup led by the


    Libyan colonel Muammar Gaddafi, who – echoing the nationalist mood


    traced in Chapter 6 – immediately moved to impose a forty-cent increase in


    the price of oil for the companies operating in Libya. This demand was


    initially refused by the independent firms, but after being threatened with


    the confiscation of their concessions they had little choice but to give in to


    the price increase. For both the Seven Sisters and the independent firms,


    Libya’s willingness to confront the foreign concessionaires raised the


    dangerous logic of what one oil firm lawyer described as a ‘leapfrogging’


    effect: any improvement in concession terms won by the Libyan


    government would be generalised to oil producers in the Gulf, but this


    would then be followed by further demands in Libya, which would then be


    echoed in the Gulf, and so on, ad infinitum.^(33) Much like Venezuela’s fifty–


    fifty model in the early 1950s, the real threat posed by Libya’s pushback


    against the international oil majors lay in its potential cross-border


