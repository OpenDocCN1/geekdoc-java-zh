    much more difficult to transport over long distances, oil was the first energy


    commodity to be *internationalised*: produced, transported, and refined for


    global consumption. As early as 1949, around 30 per cent of all oil


    produced was traded across borders (compared to less than 8 per cent of


    coal), and oil represented nearly 70 per cent of all internationally traded


    energy (today, around 60 per cent of oil production is internationally traded,


    compared to around 15 per cent of coal).^(62) This international character of


    world oil meant that, as it became increasingly intertwined with European


    post-war capitalism, control over its extraction and circulation – including,


    of course, its price – became ever more inseparable from the trajectories of


    European development. Long-standing logics of colonial domination were


