  md: 'King Coal: The First Fossil Fuel


    Our civilization … is founded on coal … The machines that keep us


    alive, and the machines that make the machines, are all directly or


    indirectly dependent upon coal.^(42)


    Throughout the first two centuries that followed capitalism’s emergence in


    the 1400s, energy continued to be delivered overwhelmingly through


    traditional organic and animate means: wood, wind, water, and muscle.


    Across this period, the main machines used to produce mechanical energy


    were waterwheels and windmills, while domesticated animals helped


    human beings plough fields and provided land transport. Heat for houses


    and for cooking mostly came from burning wood and charcoal, so that the


    maintenance of larger human settlements depended upon their proximity to


    forests or access to regular supplies of wood. Charcoal was, likewise, the


    key fuel used in smelting iron and nonferrous ores, which meant that wood


    was also a prime factor in metallurgical development. Overseas trade,


    colonisation, and war-making relied upon the sail and human muscle, and


    journeys by sea were thus costly, lengthy, dangerous, and unpredictable.


    Coal’s ascendancy as the first of the major fossil fuels began in England


    in the sixteenth century. At that time, England was an aspiring European


    power whose subsequent rise would be propelled by a large overseas


    empire and the profits of transatlantic slavery that helped finance the


    country’s industrial development.^(43) Although coal had been used for


    millennia for heating and light, its availability had been limited to places


    where it could be easily found on the surface of the earth or dug out of


    shallow mines. However, from the early 1500s, shortages of wood in some


    areas – partly driven by the large volume of charcoal and timber needed for


    iron smelting and shipbuilding – spurred increases in the country’s coal


    production. Most English coal fields were opened between 1540 and 1640,


    in mines excavated by human labour and using waterwheels, windmills, and


    horses to help with water pumping and hoisting coal.^(44) By the early 1600s,


    coal had become a common fuel used to heat houses, and had also found


    some uses as an energy source in industries such as brickmaking, soap and


    starch making, and extracting salt.^(45)'
