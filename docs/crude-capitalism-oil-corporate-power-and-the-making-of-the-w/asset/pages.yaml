    Last Man Standing?


    In assessing these possible futures, we must remember that the problem of


    climate change is embedded in a sharply hierarchical world that oil helped


    to make. There is an ecological debt associated with the historical


    emergence of the world market, in which the extraction of energy and other


    resources from the Global South has fed the development of countries and


    classes in the Global North. The polarisation of wealth is associated with


    the polarisation of emissions, with the world’s richest populations – largely


    concentrated in the Global North – bearing primary responsibility for rising


    temperatures. One study, for instance, notes that about half of the world’s


    carbon emissions are produced by the wealthiest 10 per cent of the world’s


    population, while the poorest half of the world generates only 10 per


    cent.^(102) Another found that the private jets, superyachts, and mansions of
    an


    average billionaire emitted the same amount of carbon in *two hours* as did


    someone in the poorest half of the world’s population over an *entire*


    *year*.^(103) There can be no just solution to the climate crisis that does not


    tackle (and provide restitution for) these enduring inequalities.


    Dominant approaches to the so-called green transition are merely


    reproducing these relationships anew: intensifying the search for (and


    control over) critical materials such as lithium, cobalt, and sand;


    encouraging landgrabs for solar, wind, and biofuel projects; and of course


    continuing to expand the hydrocarbon frontier through fracking and deep-


    sea oil and gas projects. This is one major problem with much mainstream


    climate politics across North America and Europe. By leaving the current'
