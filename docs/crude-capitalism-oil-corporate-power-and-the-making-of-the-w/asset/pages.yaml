- img_proc: true
  md: 'proportion of the world’s ‘work’ carried out by inanimate machinery rose


    from 10 per cent in 1850 to 50 per cent by 1900, reaching 90 per cent by


    1950 – with the share of human labour falling commensurably.^(27) Of course,


    this does not mean that the importance of human labour has decreased in


    absolute terms; rather, mechanisation has inaugurated an age where the


    machine itself can leverage human labour into ever-accelerating growth and


    continual speed up.^(28)


    Machines are, by definition, energy convertors – they translate some kind


    of energy source into useful mechanical energy that can be utilised by


    humans. For this reason, there is a close connection between capitalism’s


    tendency to mechanise – or, as Marx put it, to ‘replace living labour with


    dead labour’ – and the types and quantities of energy utilised by society.


    The greater the energy density of a fuel, the greater the power that can be


    delivered per unit of energy input (and thus the larger scale at which


    machinery can be deployed). Once machines start to drive machines – an


    important turning point in capitalist production that began with the hitching


    of the steam engine to the British factory system in the 1700s – human


    muscle is no longer able to supply the requisite amounts of energy.^(29)


    Workers become increasingly divorced from direct control of the labour


    process, and subject to the heightened tempos and pace of the machine.^(30)


    From that moment on, there is a need for large-scale energy production that


    can be carried reliably to points of production.^(31) Energy density and the


    infrastructures of energy delivery – the ways in which energy is produced,


    stored, transported, and transmitted – are thus increasingly bound up with


    capitalism’s ability to increase the scale of production.


    Another fundamental dimension to the phenomenon of machines as


    energy convertors is found in capital’s circulation. In seeking to maximise


    profit, capitalism pushes inexorably to expand the size of markets and to


    reduce the time it takes in circulating commodities through the necessary


    cycles of investment, production, and eventual sale to the consumer. The


    bigger the reach of the market, the more commodities that can be


    potentially sold. The quicker the ‘turnover’ of capital can take place, the


    greater is the number of cycles of profit that occur in any given period.


    Capitalism, in other words, tends to ‘tear down every spatial barrier’ and


    simultaneously ‘annihilate this space with time, that is, to reduce to a


    minimum the time spent in motion from one place to another’, as Marx'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'famously observed.^(32) This conquering of space and time is something that


    springs immanent from the nature of accumulation itself, manifested


    through the repeated revolutions in modes of transport (and the associated


    developments in logistics and communications). The characteristics of the


    energy sources underpinning the circulation of capital – especially their


    energy density and portability – thus play a major role in determining the


    limits to the acceleration and amplification of capital’s reach.


    Expand, accelerate, and revolutionise – these catchwords of a social


    system based on ‘accumulation for accumulation’s sake’ sit at the core of


    the transition to fossil fuels that occurred across major industrialised


    economies during the nineteenth century. These fossil fuels (principally


    coal, oil, and natural gas) originate in the remains of organic matter that


    have been subject to high pressure and heat over lengthy periods deep


    beneath the earth’s surface. The time taken for these environmental factors


    to work their transformative magic can range from a few thousand years (in


    the case of peat) to millions of years (in the case of coal).^(33) Having lost


    most of their water and other impurities through the extreme conditions of


    their formation, fossil fuels have a much greater carbon content and thus


    higher energy density than other energy sources. And as discrete physical


    resources, they are also movable, a quality that differs from non-portable


    energy alternatives such as wind and water.


    With their higher energy density, portability, and chemical flexibility,


    fossil fuels became the ideal energy substratum for powering ever-


    accelerating growth – satisfying both the quantitative and qualitative


    dimensions of energy use under capitalism.^(34) Or, as Elmar Altvater notes,


    there is a ‘congruence of [fossil energy’s] physical properties with the


    socioeconomic and political logics of capitalist development’.^(35) Fossil fuels


    enabled a constant increase in the scale of energy throughput, and were thus


    capable of meeting the insatiable requirements of the new machine age in


    ways that other energy sources could not. They could be transported to


    wherever there was a demand for their use; and once connected to an


    appropriate machine, they themselves could also power movement.


    Mobility of fuel supports mobility of capital, which in turn helps to liberate


    capital from the constraints of space and time. Displacement of human


    muscle power as the primary energy source also divorces the worker from


    control over production and independent means of survival, helping to


    generalise and extend a reliance on waged labour and subordination to the'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'market.^(36) Markets can grow, and capital can seek out labour where it is


    cheaper and better controlled. From this moment on, Andreas Malm


    observes, ‘other sources of mechanical energy are pushed to the fringes …


    Capital expands in leaps and bounds, energised by fossil fuels.’^(37)


    Tethered in this way to capitalist accumulation, fossil fuels become a


    pivotal input into production and enable continuing capitalist growth.^(38)


    Their relative importance only rises alongside mechanisation and the


    widening scale of production. This means that the costs (and means of


    pricing) of these fuels become increasingly bound up with the ebbs and


    flow of capitalist profitability.^(39) Moments of high energy prices are


    typically associated with accumulation crises, as the costs of energy inputs


    push weaker firms to the wall. Alternatively, cheap energy emerges as a


    means to prevent and address downturns, a way of ‘revving profits in


    periods of accumulation slumps’ through reducing input costs and thereby


    increasing surpluses.^(40) An easy way to cheapen energy is to avoid paying


    the full costs of its production – through, for example, utilising underpaid


    labour or dumping toxic waste products into the environment. For this


    reason, the places where energy is extracted and produced tend to become


    sites of deep social and ecological degradation.


    All of this leads to an ever-widening chasm between the tempos of the


    earth’s natural cycles and those of the market.^(41) Capitalism’s tendency to


    push beyond all limits means that the capacity of natural sinks – the


    atmosphere, forests, and oceans – to store and recycle the by-products of


    fossil fuel consumption (primarily carbon) becomes increasingly strained.


    At the same time, the cycles of nature and capital become increasingly


    interdependent. The huge quantities of carbon that were sequestered in


    fossil fuels across millions of years of formation are now released at a rate


    that overwhelms the earth’s ability to dispose of this waste. It is this


    coupling of millennia-long processes with capital’s voracious speed of


    energy consumption that lies at the root of today’s climate crisis. Once


    again, this dysregulation of the earth’s systems is an inevitable and


    predictable outcome of the logic of energy use under capitalist


    accumulation; it is not a product of errant polluters, too many people, or bad


    consumer choices. And, as we shall see in later chapters, it is one that was


    qualitatively transformed with the coming of the oil era.'
