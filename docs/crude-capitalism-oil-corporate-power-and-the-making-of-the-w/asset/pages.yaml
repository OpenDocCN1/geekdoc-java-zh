- img_proc: true
  md: 'wider conditions for capital accumulation and the capacities of the state.
    In


    doing so, Putin’s approach was not anti-market – indeed, his economic


    advisors were principally free-market ideologues he had brought with him


    to the Kremlin from St Petersburg; rather, he aimed at securing the interests


    of the property-owning classes as a whole.^(49) The basic deal that Putin


    presented was straightforward: the largest finance capital conglomerates


    would continue to benefit handsomely from their connections to the state –


    in many ways even more so than in the Yeltsin period – provided they gave


    support to this re-composition of the Russian state, paid (more) taxes, and


    refrained from any political destabilisation.


    Within the business class, Putin’s main opponent at the time was Mikhail


    Khodorkovsky, a former Komsomol official (the youth section of the


    Communist Party) who had established one of the first private Russian


    banks under Gorbachev. After the fall of the Soviet Union, Khodorkovsky’s


    financial-industrial conglomerate Menatep, became one of the main


    beneficiaries of the Yeltsin period, taking extensive interests in banking,


    shipping, petrochemicals, and food through the 1990s. A key asset over


    which Khodorkovsky gained control in this period was Yukos Oil, which he


    won in 1995 through one of Yeltsin’s privatisation auctions. Yukos soon


    overtook LUKoil to become the largest oil company in the country, and


    with the collapse of Menatep’s banking arm during the 1998 crash,


    Khodorkovsky’s empire was increasingly synonymous with Yukos. In 2003,


    however, Khodorkovsky and several Yukos executives were arrested by


    Russian authorities and accused of tax fraud, embezzlement, and other


    economic crimes. The ensuing trial lasted until May 2005, when


    Khodorkovsky and his business partner Platon Lebedev were found guilty


    and received a nine-year sentence.^(50)


    As the richest man in Russia, Khodorkovsky was the highest-profile


    target in Putin’s campaign to discipline Russia’s leading business owners.^(51)


    Numerous authors have pointed out that his activities through the Yeltsin


    years differed little from any of the other large oil barons – engaging in tax-


    optimisation schemes, transfer pricing, the use of offshore accounts, and so


    forth. His corporate possessions had also been acquired by similar means,


    translating close connections with the state into stakes in newly privatised


    firms through schemes such as loans-for-shares. Nonetheless, after Putin’s


