    myths. Notions of oil scarcity, or the belief that petrol prices spiked because


    of an OPEC embargo, are incorrect, reflecting a tendency to conflate events


    with the perceived intent of various actors. Many of these mistaken ideas


    arise from a poor grasp of how oil circulates – especially the significance of


    downstream activities and the integrated corporate form – which obscures


    not only the mechanisms, but also the ultimate beneficiaries of price


    increases. There is also a habit of viewing the oil shocks in aggregate terms,


    without disentangling their varied impacts across different geographies,


    social classes, and the oil industry itself. All of this makes it difficult to


    understand the true significance of the multiple crises of the 1970s.


    So how might we understand both the causes and consequences of the


    1970s oil shocks? To answer this question, we must shift our attention away


    from a singular focus on OPEC to examine the changes that were taking


    place across other segments of the world oil market during this period. Most


    important here is the US, where the thoroughly hierarchical oil industry –


    divided between the top twenty integrated firms and many smaller, non-


    integrated companies – underwent a deep structural transformation in the


    years immediately preceding the momentous shifts in the upstream control


    of Middle East oil. The changes to the American oil market were closely


    connected to the main OPEC states, not least through the vertically


    integrated corporate structures that continued to move most oil around the


    world. At the same time, a new surge in Soviet oil exports also occurred


    through this period, with significant implications for the balance of power


    in the world industry. Tracing the interdependencies between these different


    geographies of world oil can reveal much about what happened to pricing,


    corporate structures, and the characteristics of oil production through the


    1970s. In essential ways, they also prefigure contemporary patterns in the


    control and ownership of oil.


