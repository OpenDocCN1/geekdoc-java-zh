    The loans-for-shares scheme was just the first step in a series of mergers


    and acquisitions and a wider sell-off of state oil assets that occurred over


    the next three years. By 1998, industry consolidation had produced what


    has been described as the Russian Seven Sisters – seven privately controlled


    oil companies, which together held 69 per cent of explored reserves in


    Russia, 76 per cent of oil wells, 67 per cent of oil production, 59 per cent of


    refinery output, and nearly 70 per cent of crude exports.^(26) As highly


    integrated firms, these companies wielded considerable advantages over


    their rivals. One example of this – borrowing from the playbook of the


    Western oil giants – was the use of transfer pricing to maximise profits. Oil


    was produced and transferred at below-value prices to subsidiaries located


    in low-tax regions, who would then re-sell the oil at much higher prices. By


    shifting the location where profits were booked, the largest integrated oil


    companies saved billions of dollars in taxes.^(27) In some cases, the head of


    the regional unit that granted the tax benefits was the also the owner of the


    oil company – such as the future Chelsea Football Club owner Roman


    Abramovich, who was owner of Russia’s sixth largest oil company, Sibneft,


    and simultaneously governor in the remote low-tax region of Chukotka.^(28)


    Access to foreign markets and export routes was also critical to the power


    of the Russian Seven Sisters – pointedly, the largest oil majors held


