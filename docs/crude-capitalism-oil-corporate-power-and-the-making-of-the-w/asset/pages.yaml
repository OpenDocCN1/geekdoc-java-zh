  md: 'For good reasons, much of the discussion around the problem of plastics


    and petrochemicals has focused on their toxicity to both humans and the


    natural environment.^(88) Plastics are, by their very nature, incompatible with


    normal biological cycles, and can only be disposed of in three basic ways:


    by dumping, incineration, or recycling.^(89) More than 90 per cent of all


    plastic waste ever produced by humankind has been dumped into the


    ecosystem or incinerated, both routes that release toxic materials and cause


    long-term and cumulative damage to life itself.^(90) Today, recycling rates sit


    at around 9 per cent of total plastic waste, and substantial quantities of this


    waste ends up being exported from North America and Europe to countries


    where its ultimate fate is usually impossible to determine.^(91) Indeed,


    alongside China’s role as a key global producer of plastics, the country also


    became the final graveyard of the world’s plastic waste – between 1992 and


    2018, just under half of all global plastic waste was exported to China.^(92)


    China banned the import of plastic waste in 2018, and most of this trade has


    now been diverted to countries such as Malaysia, Indonesia, and Turkey.


    While their environmental toxicity is well recognised, much less


    attention has been given to the impact of plastics on climate change. Across


    their entire lifecycle, plastics are associated with significant quantities of


    greenhouse gas emissions – indeed, if plastic were a country, it would rank


    as the world’s fifth largest greenhouse gas emitter, after China, the US,


    India, and Russia.^(93) Much of these plastic-related emissions arise in the


    initial production of petrochemicals, which consumes more energy than any


    other industrial sector (including iron, steel, and cement).^(94) But, even after


    it is discarded, plastic continues to release greenhouse gases as it degrades


    under the impact of UV light and water erosion. This is a particularly acute


    problem in the world’s oceans, where the most common form of plastic


    waste is low-density polyethylene (LDPE), a substance used in packaging,


    plastic bottles, and many other applications. LDPE is lightweight and tends


    to float on the surface of the water. With the churn of oceans and exposure


    to sunlight, LDPE breaks down and emits methane, ethane, and other


    greenhouse gases. The process of fragmentation also increases the surface


    area of the plastic waste exposed to environmental degradation, which


    means that the rate of greenhouse gas emissions tends to accelerate over


    time.^(95) With many plastics able to last for centuries in the environment


    before they decompose, our perception of discarded plastic as *waste* is'
