  md: 'Bioenergy


    Bioenergy is energy derived from recently living organic material known as


    biomass. Biomass can include wood or wood waste from forests, as well as


    food crops like sugar cane, corn, and soybeans. These forms of biomass can


    be burnt to produce heat or electricity (as with wood), or converted into a


    liquid or gaseous fuel known as biofuel. They are classified as renewable


    because they can be produced from organic waste or from crops that can be


    regrown. In all major climate models, biomass and biofuels figure


    prominently as a replacement for fossil fuels. They are seen as particularly


    important to decarbonising the transport sector – especially heavy-duty


    trucks, ships, and planes – where electric battery technology is not currently


    feasible. Today, bioenergy is the largest source of renewable energy, making


    up around 6 per cent of the global energy supply. Its supply is projected to


    increase 10 per cent per year between 2021 and 2030 in the IEA’s NZE


    scenario, eventually reaching 13 per cent of total global energy supply by


    the end of the decade.^(29) Globally, the expansion of bioenergy is heavily


    supported by governments through policies such as fuel emission standards,


    and requirements in some countries for refiners to blend a certain


    proportion of biofuels with the production of gasoline.^(30) It is often linked


    with carbon capture in a hybrid approach called BECCS (bioenergy with


    carbon capture and storage).


    Bioenergy may have potential to reduce overall carbon emissions, but


    current methods of production are seriously flawed. One problem is that


    growing crops for fuel sets up competition with other kinds of land use,


    such as food production. In the US, for instance, more than a third of the


    country’s corn production and 40 per cent of soybean oil were allocated to


    biofuels in 2022.^(31) Food prices can potentially be impacted by this


    increased demand for certain crops, as during 2006–08, when biofuels were


    widely attributed as an important factor in a global food price spike.^(32)


