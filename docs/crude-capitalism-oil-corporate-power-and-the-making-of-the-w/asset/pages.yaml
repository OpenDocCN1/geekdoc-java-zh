    integration of business, banking, and politics guaranteed continued access


    to power and wealth, regardless of who sat in the Kremlin, and despite the


    extreme economic polarisation that marked Russian society. The share


    prices of the largest companies were also booming, with the stock market


    nearly doubling in value between 1996 and 1997\. Surveying the state of


    world markets in mid-1997, the *Wall Street Journal* would brazenly


    describe Russia as the ‘best performing [market] … in the world’.^(34) For the


    oil barons who sat at the centre of Russia’s new business class, the future


    appeared promising indeed.


    The 1998 Financial Crisis


    These apparent certitudes would vanish following the eruption of a new


    financial crisis in 1998\. This economic crash quickly became the deepest


    and most severe to hit Russia since the end of the Soviet Union, and like all


    such moments, it had global origins. Through the 1990s, IMF-led structural


    adjustment packages had lowered barriers to foreign investment across most


    so-called emerging markets, encouraging large volumes of capital to flow


    into these regions in pursuit of higher returns than those available in core


    financial markets (where interest rates were low). These huge flows of'
