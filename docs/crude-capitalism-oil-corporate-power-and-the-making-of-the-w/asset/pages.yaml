  md: 'Low Carbon Solutions in a Burning World


    While the chimerical promise of net zero might disguise the continued


    expansion of fossil fuel production, this does not mean that the major oil


    companies stand apart from the growing markets for renewables and


    alternative forms of energy production. Indeed, precisely the opposite is the


    case: the oil industry clearly recognises that global strategies to address


    climate change have significant potential to open up new and profitable


    market opportunities. This is a continuation of the transformation that most


    oil companies embarked on in the 1990s – a shift towards becoming *energy*


    firms: grounded in oil, but with a mix of different energy portfolios and


    downstream activities. The popular image of Big Oil as a dinosaur being


    dragged reluctantly towards the inevitable end of the fossil era is false;


    these companies are taking a leading role in determining future energy


    choices. There is no silver lining – the trajectories established by the oil


    industry serve to prioritise dubious technologies and policies, create false


    narratives, and foreclose the necessary alternatives that are now urgently


    demanded. Rather than being antithetical to their interests, these pathways


    further entrench the position of Big Oil at the heart of our energy system.


    These realities are illustrated through a closer examination of three key


    technologies: bioenergy, electric vehicles (EV), and hydrogen. Each of


    these technologies has been identified by the IEA and other international


    organisations as essential to the energy transition. In fact, models such as


    the IEA’s NZE scenario assume their widespread adoption onto the positive


    side of the net zero balance sheet – a means of directly displacing fossil fuel


    use, and thus reducing emissions. Major oil firms are also championing


    these technologies as the centrepiece of their new low-carbon strategies.


    While oil company spending on conventional fossil fuels remains many


    orders of magnitude higher – and is projected to do so for the coming


    decades – these technologies have become increasingly integral to how the


    oil industry projects itself within the discourse of the climate emergency. As


    the adoption of these technologies deepens, they are providing new


    supplementary sources of revenue that further bolster the social power of


    oil. They are also driving significant changes to how oil firms are


    positioned in relation to other business sectors and the emerging


    infrastructures of the so-called green transition.'
