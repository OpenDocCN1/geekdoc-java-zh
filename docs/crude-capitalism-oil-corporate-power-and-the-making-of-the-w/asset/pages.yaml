    What Comes Next?


    Oil is a commodity with a curious character. On one hand, because of what


    it does for capital accumulation, it has become an indelible part of our


    social existence, embedded in the materiality of commodity production, our


    food systems, the kinds of urban spaces we live in, military power, and the


    global financial architecture that has emerged through the second half of the


    twentieth century. It is this *everywhereness* that makes the problem of oil so


    hard to unpack – and thus so difficult to challenge. But, at the same time, so


    much of what oil does for capitalism is invisible. We tend to think about it


    as simply a fuel or an energy source, and not in the myriad ways it


    underpins our social life today. Its very pervasiveness makes it difficult to


    see. One of the aims of this book is to shine a light on this everywhere-but-


    nowhere character of oil – to show the ways that oil holds up our


    contemporary world through remaining ‘hidden in plain sight’.^(61)


