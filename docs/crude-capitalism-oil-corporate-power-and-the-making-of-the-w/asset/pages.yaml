  md: 'These ‘dark satanic mills’ – forever immortalised in the poetry of


    William Blake and Marx’s excoriating damnation of the factory system in


    *Capital* – were one of the first grim underbellies of a fossil fuel–fired


    capitalism. Another was the mining of coal itself, which depended heavily


    on the labour of small bodies capable of navigating the poorly ventilated


    and dangerous mines scattered across the British Isles. The coupling of coal


    to capitalism thus helps to explain the fact – and timing – of what E. P.


    Thompson would later describe as ‘the drastic increase in the intensity of


    exploitation of child labour between 1780 and 1840’.^(49) Such conditions


    confirm that every energy transition depends upon earlier forms of energy,


    and that the shiny worlds erected by fossil fuels have always worked to hide


    the kinds of labour that make them possible. As George Orwell would


    observe at the height of the coal era, ‘in the metabolism of the Western


    world the coal miner is … a sort of grimy caryatid upon whose shoulders


    nearly everything that is not grimy is supported’.^(50)


    Coal’s ability to make capital mobile stemmed from the fact that it was


    itself a portable commodity, unlike the wind and water that drove Britain’s


    earlier industrial development. And, crucially, coal had a much greater


    energy density than alternative movable energy sources such as wood and


    animals: its energy per unit mass, for example, is about two to three times


    that of air-dried wood, the staple movable energy source for most of


    humanity’s existence.^(51) Closely connected to the high energy density of


    coal (and other fossil fuels) is its ability to deliver a greater amount of


    energy from a specific area of the earth’s surface – between 100–1,000


    watts per square metre, compared to only 0.2 watts per square metre in the


    case of forests destined for charcoal production. The importance of this


    *power density* often goes unrecognised in discussion of fossil fuels, but it


    enabled a specific form of urbanism to emerge – high density and energy


    intensive towns and cities, filled with concentrated areas of residential and


    industrial facilities powered by fossil fuels.^(52) The transition to coal, in
    other


    words, helps explain why Britain experienced rapid and large-scale


    urbanisation ahead of all other capitalist powers – by 1851, a majority of


    the country’s population were living in urban centres.^(53)


