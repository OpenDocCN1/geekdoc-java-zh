  md: 'A further part to Yeltsin’s 1992 decree was the establishment of a state-


    owned company, Rosneft, which was designed to hold other state-owned oil


    assets temporarily, as a prelude to their eventual privatisation. Although it


    would later become one of the most powerful oil companies in the world,


    Rosneft was a minor player when it was formed, responsible for less than 5


    per cent of Russian oil production.^(23) Through 1994 and 1995, the assets


    sheltered in Rosneft were spun off into smaller, privately owned companies


    in which the state held a minority share (see Table 10.1). By 1995, the


    Russian oil industry was composed of fourteen firms: seven companies that


    had some degree of private ownership (ranging from 14 per cent to 60 per


    cent), and another seven firms that were fully state-owned.^(24) Of these, only


    LUKoil, Surgutneftegaz, and Yukos could properly be considered vertically


    integrated; between them, they dominated Russia’s oil exports and


    controlled nearly half of the country’s oil production.


    Loans-for-Shares and the Rise of a New Business Class


    The second phase of oil privatisation took place between 1995 and 1998


    and would see a dramatic reduction in levels of state ownership. The


    starting point of this phase was a scheme known as loans-for-shares, which


    emerged out of a proposal devised in 1994 by Vladimir Potanin, a wealthy


    banker (and soon to be first deputy prime minister). Potanin proposed that


    private banks controlled by individuals such as himself should lend the


    government money in return for shares and management rights in twelve


    large state-owned firms, six of which were oil companies. At the time, the


    Yeltsin government was facing a financial crisis, and if the loans could not


    be repaid, then the shares would be put up for sale in an auction process


    administered by the banks themselves, for which they would receive 30 per


    cent of the profits (and the government the other 70 per cent). Unbeknown


    to most outside parties, however, these auctions were to be rigged. The


    banks, in acting as auctioneers, excluded competitors – in one case, shutting


    down an airport so rival bids could not arrive on time – and sold the shares


    to themselves through secretive shell companies or affiliates that hid their


    true identities. The sell-off occurred at bargain-basement prices and


    provided enormous profits to the bank owners. Potanin, for example, won'
