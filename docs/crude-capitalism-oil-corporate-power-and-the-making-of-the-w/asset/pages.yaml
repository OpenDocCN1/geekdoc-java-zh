  md: 'Since the very earliest human societies emerged millennia ago, we have


    depended upon our interaction with nature to produce the means of our


    existence. This ‘metabolic interaction’ between nature and human beings


    takes place through socially organised and purposeful human labour, which


    transforms the material of the world around us into useful objects.^(21) At the


    most abstract level, energy is what enables this labour to take place and


    what determines its relative strength.^(22) For most of our existence, energy


    was delivered through human muscles powered by the food we eat: an


    energy source ultimately derived from solar radiation (either directly,


    through the photosynthesis of plants, or indirectly through other animals).


    Energy supplied by human muscles was later supplemented by


    domesticated animals, the burning of wood and other plant matter, and


    rudimentary machines that harnessed the kinetic energy of wind and water.


    This basic relationship between human beings and nature – an interaction


    mediated by labour and different kinds of energy sources – cannot be


    overcome, regardless of how society is organised.^(23)


    But the emergence of capitalism in the 1400s was to transform our


    relationship with nature in profound ways. Marx described capitalism as a


    system of ‘generalised commodity production’, meaning that most of the


    things we produce and consume are objects destined to be bought and sold


    on the market. Control over what, when, and how to produce these


    commodities is concentrated in the hands of a small number of capital


    owners, each acting in pursuit of their own private interests. Most of us are


    forced to sell our ability to work in return for a wage, which we then use to


    buy what we need from the market. This dependence on the market gives


    capitalist production a social logic that differs from all preceding societies.


    In pre-capitalist societies, production was primarily aimed at producing


    more things to satisfy the consumption of ruling classes, and was thus


    limited by the capacity of those classes to consume. But ‘under capitalism,


    most production is for exchange: capital exploits labour and nature to


    produce goods that can be sold for more than the cost of production, in


    order to accumulate more capital, and the process repeats’.^(24) What this


    means is that capitalism’s underlying logic is one of ‘endless accumulation’


    – a push to accumulate more capital (in the form of money) that overrides


    all other considerations.


    This logic of endless accumulation is not the personal preference of


    individual owners of capital but is hard-wired into the system itself:'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'capitalists *must* behave in this way if they are to survive as capitalists.
    The


    motor force of this compulsion is competition. Those capitalists with


    greater resources are able to engage in large-scale investments and out-


    perform smaller adversaries – they have better ability to produce cheaper


    commodities, invest in more efficient technologies, swamp markets, engage


    in price wars, and adopt a myriad of other strategies to beat their opponents.


    Under the whip of this market competition, capitalists are thus forced to


    maximise profit or face being swallowed by a more successful rival. One


    consequence of this is a tendency for increasing amounts of capital to be


    amassed in fewer and fewer hands – this ‘concentration and centralization


    of capital’ is a feature of the oil industry that we shall see repeatedly


    illustrated throughout this book.


    Capitalism’s drive to perpetual growth means an ever-increasing output


    and variety of commodities – even to the point of producing more than the


    market can consume (hence the appearance, unique to capitalist societies, of


    ‘crises of overproduction’). There is no societal control over this because


    decisions about production are made by atomised individuals competing


    against one another for market share. But, as John Bellamy Foster has


    pointed out, the level of this output is directly connected to the throughput


    of energy and other raw materials, and thus the spiral of capitalist


    production tends constantly to increase the demand for energy.^(25) Even if


    energy use per unit of output decreases – say, through the use of more


    efficient machines – this typically translates into greater overall


    consumption of energy because it becomes even cheaper to produce more


    goods, a conundrum first described by the nineteenth-century economist


    William Stanley Jevons, in his study of English coal.^(26) Capitalist


    accumulation thus tends towards demanding an ever-increasing throughput


    of energy, which is only interrupted at moments of severe economic crisis.


    As we shall see, this has important implications for how we think about the


    idea of an ‘energy transition’.


    A key factor driving the limitless expansion of commodity output is


    capitalism’s propensity to displace, replace, and augment human labour by


    machinery and capital-intensive technologies. Machines can be operated


    continuously and do not agitate or go on strike. They enable overall output


    and labour productivity to grow exponentially, and thus serve increasingly


    to embed science and technology at the heart of capitalist production.


    According to Vaclav Smil’s back-of-the-envelope calculations, the'
  merge: -1
