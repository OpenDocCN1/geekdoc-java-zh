    the 1970s – an angry-looking Arab man adorned in the Gulf’s traditional


    head-dress, who cradled in his arm a petrol station pump much as he might


    a rifle. Under the tagline of ‘Arab oil squeeze’, the imagery resonated with


    the mood of the times: the world was being held to ransom by a band of


    unreasonable Arab oil barons, whose newfound control over crude was


    driving up prices, creating shortages of petrol and other fuels, and triggering


    spiralling inflation and economic stagnation. Within the popular imagining


    of this crisis, OPEC’s actions were akin to weaponising oil against the West,


    leaving the traditional oil majors helpless and with few viable responses to


    the sharp price spikes that were looming.¹ Shortly after the issue of


    *Newsweek* appeared, oil prices quadrupled in what became known as the


    first oil shock (1973–4). They would subsequently double again during a


    second shock at the end of the decade (1979–80). Oil was now discussed in


    terms of ‘scarcity’ and ‘national security’ – with voices from across the


