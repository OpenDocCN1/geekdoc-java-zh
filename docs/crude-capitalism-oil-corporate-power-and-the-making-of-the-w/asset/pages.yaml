    The post-war petrochemical revolution inaugurated an unprecedented


    transformation in patterns of industrial production and consumption. The


    synthetic materials derived from petroleum became ubiquitous and created


    new industries – such as plastics and packaging – and it reshaped social,


    cultural, and aesthetic practices.^(53) Business historians have subsequently


    described this period as the ‘chemicalisation’ of industry, with virtually all


    forms of commodity production linked to petrochemicals in some manner.


    In the US, the chemical industry moved to the centre of economic


    development through the 1950s and 1960s, experiencing growth rates


    double that of GDP and profit rates at least 25 per cent higher than those


    found in other manufacturing industries.^(54) With the chemical business


    unmatched ‘by any other in growth, earnings, and potential’, normally


    circumspect pundits of the post-war era foresaw a future in which ‘most


    industries will be absorbed into the chemical industry’.^(55) This was the


