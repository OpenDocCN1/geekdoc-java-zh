  md: 'commanding heights of the Russian economy, including the import-export


    trade, heavy industry, media, transport, construction, and real estate. This


    was the birth of Russian finance capital – large, integrated ownership


    structures bridging banking and industry, and closely connected to the state.


    Banks played a fundamental role within these diversified finance capital


