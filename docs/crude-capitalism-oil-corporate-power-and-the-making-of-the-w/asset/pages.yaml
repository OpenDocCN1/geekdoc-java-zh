    transport system, but they do not address the underlying structural issue: a


    system of mobility that is centred on individualised road transport, in which


    both the means of transport *and* the means of energy that power these


    vehicles are commodified. This is an irrational system that is destructive of


    the biosphere, harmful to human health, and erodes the liveability of urban


    spaces. A faster reduction in emissions (and dramatic improvement in city


    living) could be achieved through provision of free, clean, and well-funded


    green public transit – with urban spaces designed to prioritise and enable


    non-commodified modes of transport. Instead, the solutions offered by so-


    called clean fuels leave the underlying systems intact, reproducing many of


    the same problems of the internal combustion engine in a different form


    (and with no likelihood of substantially reducing emissions in the time


