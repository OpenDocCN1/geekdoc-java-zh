  md: 'However, coal’s eventual dominance over charcoal, wind, and water


    hinged upon two technological innovations that took place in the 1700s.


    The first of these was the discovery that coke, a substance derived from


    coal, could be used as both an energy source and raw material in the


    smelting of iron. The use of coke instead of charcoal significantly


    cheapened the cost of making iron and enabled the construction of much


    bigger furnaces that produced iron of better quality. It also relieved pressure


    on Britain’s wood resources, allowing iron smelting to be located away


    from forested areas. By 1750, coke-fired blast furnaces had become


    widespread in the British iron industry, enabling a rapid increase in the


    output of this crucial raw material. Dominance in iron production supported


    Britain’s manufacturing pre-eminence, not least as the backbone of the


    shipbuilding and military industries that helped secure the country’s


    lucrative overseas colonies. Quite remarkably, Britain was producing more


    than half of the world’s iron by the mid-1800s.^(46)


    The second major technological innovation that drove increased demand


    for coal was the development of the Watt Steam Engine in the 1770s. This


    device was fired by coal and converted the back-and-forth motion of a


    piston into rotary motion – it was the first new ‘prime mover’ introduced


    since the adoption of the windmill 800 years earlier, allowing the chemical


    energy contained in coal to be transformed into useful work.^(47) Between the


    1780s and 1830s, steam engines gradually displaced the traditional


    waterwheels used in industries such as cotton spinning and weaving. This


    eventual supremacy of steam over water-wheels, however, was not an


    automatic process. As Andreas Malm’s masterful history of this period


    shows, coal-fired steam engines were initially neither cheaper nor more


    reliable than water – rather, the critical advantage of coal was that it enabled


    the mill to become mobile, freeing it from the waterways and rural areas to


    which it had previously been bound.^(48) This new mobility gave factory


    owners greater control over and access to labour, allowing steam-powered


    factories to be located close to bigger cities and towns, where a large pool


    of unemployed workers helped push down wages. Once ensconced in the


    factory, the steam engine enabled individual tool-bearing machines to be


    driven by other machines, exponentially increasing labour productivity and


    output in major British industries such as weaving, spinning, transport, and


    milling.'
