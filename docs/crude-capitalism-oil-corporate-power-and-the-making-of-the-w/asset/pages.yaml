    Although it was not immediately apparent at the time, a doubling of


    global oil prices between 1998 and 2000 marked the beginning of a new oil


    boom that would eventually peak in mid-2008\. This was a moment that


    seemed to promise unprecedented opportunities for the owners of Russia’s


    private oil companies. Despite popular anger against the business–Kremlin


    alliance, state-owned oil assets continued to be handed over to the largest


    conglomerates. In 2000, the state-owned Onako oil company was sold to


