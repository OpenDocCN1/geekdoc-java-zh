    enter the atmosphere. Since the 1850s, up to 40 per cent of human-made


    carbon emissions have been absorbed by this zooplankton/phytoplankton


    food chain – the largest natural sink for anthropogenic greenhouse gases on


    the planet. The potential effects of plastic pollution on this critical carbon


    sink constitutes another of the many ‘tipping points’ that threaten to


