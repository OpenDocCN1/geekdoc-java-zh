  md: 'the prioritisation of social needs and the recuperation of the planet. This
    can


    only happen with a reconsideration of how, what, why, and where things are


    produced and consumed – a decommodification of our social existence.^(115)


    This would mean an end to wasteful and destructive forms of production


    and consumption (including fossil fuels, advertising, inbuilt obsolescence,


    private jets, and superyachts). It would also expand the availability of some


    social goods (such as education, health, housing), and radically increase the


    free time individuals can devote to the cultivation of their abilities, interests,


    and passions.


    Unlike many other perspectives on the climate crisis, ecosocialism


    recognises the indivisibility of climate struggles and other movements for


    social and economic justice. The connection of these struggles lies in the


    fact that capitalism is the root cause of both the climate emergency and


    other forms of exploitation. As the climate crisis worsens, its effects are felt


    most sharply by those who are most marginalised. Movements for racial


    justice and gender equality, the rights of indigenous peoples, and the


    defence of migrants and refugees must inevitably take on an ecological


    edge. The central place of labour in capitalism gives a particular weight to


    the struggles of urban and rural workers, including those in the informal


    sector and outside official trade union structures. The climate crisis


    reinforces and helps to spawn numerous other crises, including wars and


    conflict, mass displacement, and a permanent state of economic polarisation


    and austerity. All of this means that the climate crisis can only be resolved


    as part of broader social change. By pointing to the interconnectedness of


    both the problems and the necessary solution, ecosocialism provides hope


    and a source of social power – centring solidarity, collective action, and a


    recognition of common interests despite difference.


    Given all of this, what to do? As numerous ecosocialist writers and


    activists have pointed out, there is a range of demands that can be fought for


    in the here and now and that provide a bridge to more deep-seated change.


    Most immediately, we could dismantle the major oil companies and


    polluters, taking their enormous skills and resources and using these rapidly


    to phase out the production of fossil fuels and support a genuine green


    transition. Demilitarisation would cut the world’s largest source of carbon


    emissions – first and foremost, the US military.^(116) Massive investment can


    be directed into developing new technologies, including some of those


    discussed above, which can be appropriately introduced alongside'
  merge: -1
  pgno: 245
- img_proc: true
  md: 'encouraging changes to social behaviour. We can expand the infrastructure


    for truly renewable energies and develop sustainable materials and agro-


    ecological forms of food production. The highly polluting conspicuous


    consumption of the world’s ultra-rich can be ended, beginning with the


    confiscation and decommissioning of private jets and superyachts. Urban


    spaces and modes of transit could be reorganised around free, accessible,


    and clean public transport, bike tracks, and pedestrian walkways. We can


    end production models built around inbuilt obsolescence and disposability,


    and immediately prioritise energy efficiency and conservation.


    Measures such as these need to be global in scope. The majority of the


    world’s population that has been adversely incorporated into the world


    market over the past decades has an unequivocal right to energy, material


    growth, and an improvement in living standards. This must be supported


    and enabled in sustainable ways by those who live in areas that have


    profited from over a century of fossil capitalism. The first step in this is the


    cancellation of sovereign debt owed by the Global South, and a massive


    programme of reparations could transfer the necessary technologies and


    resources to lift billions of people out of fuel and material poverty in


    sustainable ways.


    These proposals might sound utopian, but without them we stand no


    chance of dealing with the climate catastrophe. Capitalism’s ecological


    crisis poses such demands as both necessary and possible, and there are no


    technical or material reasons why they could not be immediately


    implemented. The barriers to taking such steps (and many others) are purely


    *social*: a narrow layer of global society – extending far beyond oil


    companies – benefits from our current social arrangements and will resist


    any fundamental challenge to their position. We cannot behave as if the


    problem of capitalism does not exist, or can be ignored, or as if our current


    rulers can be convinced to take an alternative path through the sheer force


    of scientific evidence. This is an irrational economic system that pits the


    interests of a tiny few against the vast majority, and only by taking political


    and economic power away from the logic of the market will it be possible


    to build a different and better world.'
