    restricted needs of the post-war consumer. Ever-accelerating quantities of


    waste, inbuilt obsolescence, and a culture of disposability became the


    hallmarks of capitalist production – a situation presciently described by


    Vance Packard in his 1960 classic, *The Waste Makers*. As he noted, the


    solution to this dilemma lay with another relatively new industry,


