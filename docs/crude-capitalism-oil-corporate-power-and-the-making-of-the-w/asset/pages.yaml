    West Siberia through the 1960s.^(21) As the location of the so-called


    ‘supergiant’ Samotlor oil field – the largest in Russia, and sixth largest in


    the world – West Siberia enabled a doubling of Soviet oil production


    between 1960 and 1970, catapulting the Soviet Union into the position of


    the world’s top producer, ahead of the US and Saudi Arabia. Importantly,


    West Siberia also possessed vast natural gas reserves, which meant that gas


    could be used for domestic energy needs (especially in industry), while oil'
