    jurisdictions; indeed, between 1994 and 1998, the peak years of oil


    privatisation, capital flight from Russia averaged $17 billion a year.^(32)


    The new business class enriched by oil privatisation through the 1990s


    were also important political actors, allied to Yeltsin and holding influential


    and powerful positions in the post-Soviet state apparatus. Indeed, Yeltsin’s


