  md: 'critical goal of halving global emissions by 2030, and all anticipate the


    continued centrality of fossil fuels for many decades to come. ExxonMobil,


    for example, considers that wind and solar will make up only 10 per cent of


    primary energy demand by 2050 (up from less than 2 per cent today), and


    that oil and gas will still account for more than half of the world’s primary


    energy at that time.^(76) In two of Shell’s scenarios – the most likely pathways


    according to the company, euphemistically named the Waves and Islands


    scenarios – oil and other fossil fuels continue to make up the majority of the


    world’s energy mix until some time between 2050 and 2070.^(77) In neither of


    these two scenarios do emissions drop below half until after 2070, and both


    estimate that the global temperature rise will have exceeded 2 degrees


    Celsius by 2050\. Even in its most unlikely scenario, Sky 1.5, which Shell


    describes as demanding ‘extremely challenging conditions and energy


    system changes’, fossil fuels remain the majority of the world’s primary


    energy until past 2045, and emissions do not halve until 2050.^(78) This would


    increase global temperatures by well over 1.5 degrees Celsius by the middle


    of the century.^(79)


    These models are not greenwashing; they clearly establish what the


    major oil companies believe the future to hold. On this basis, they also


    inform the oil industry’s investment priorities over the short to medium


    term. And here the results are also unequivocal. Despite the scientific


    consensus that there can be no new development of oil, gas, and coal


    projects if we are to stand any chance of averting severe temperature


    increases, oil firms are planning to direct trillions of dollars into fossil fuel


    projects over the coming decade.^(80) Even in the best-case climate scenarios,


    firms such as ExxonMobil and BP estimate up to $11 trillion of new


    investment will flow into upstream oil and gas through to 2050.^(81) This is


    not an abstract or speculative exercise conducted by disinterested actors, it


    is the future envisioned by those currently responsible for such investment


    choices. The path they see before us is one of unambiguous disaster: there


    will be no curtailment of emissions in the time frame required to meet the


    Paris goals, and within the eschatology of the leading oil firms, catastrophic


    climatic change will almost certainly occur.


