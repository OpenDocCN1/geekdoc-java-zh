  pgno: 185
- img_proc: true
  md: 'In our models based on hypergraph rewriting there''s also a kind of bedrock
    of computational irreducibility. But with combinators, there''s a certain immediate
    structural complexity to what our models do. And there are layers of computational
    reducibility associated with this. But the remarkable thing with our models is
    that some of those layers—and the formalisms one can build to understand them—have
    an immediate interpretation: they are basically the core theories of twentieth-century
    physics, namely general relativity and quantum mechanics.


    Combinators work sufficiently differently that they don''t immediately align with
    that kind of interpretation. But it''s still true that one of the important properties
    discovered in combinators (namely confluence, related to our idea of causal invariance)
    turns out to be crucial to our models, their correspondence with physics, and
    in the end our ability to perceive regularity in the universe, even in the face
    of computational irreducibility.


    But let''s get back to the story of combinators as it played out after Schönfinkel''s
    paper. Schönfinkel basically set things up in a new, very direct, structural way.
    But Curry wanted to connect with more traditional ideas in mathematical logic,
    and mathematics in general. And after a first paper (published in 1929) which
    much recorded his first thoughts, and his efforts to understand what Schönfinkel
    had done, Curry was by 1930 starting to do things formulate axioms for combinators,
    and hoping to prove general theorems about mathematical properties like equality.


    Without the understanding of universal computation and their relationship to it,
    it wasn''t clear yet how complicated it ultimately be to deal with combinators.
    Curry pushed forward, publishing more papers and trying to do define set theory
    using his axioms for combinators. But in 1933 disaster struck. It wasn''t something
    about computation or undecidability; instead it was Stephen Kleene and J. Barkley
    Rosser showed the axioms Curry had come up to try and "tighten up Schönfinkel"
    were just plain inconsistent.


    To Kleene and Rosser provided more evidence of the need for Russell''s (originally
    quite hacky) idea of types—and led them to more complicated axiom systems, and
    Curry was undeterred. He revised his axiom system and continued—ultimately for
    many decades—to see what could be proved about combinators and things like using
    mathematical methods.


    But already at the beginning of the 1930s there were bigger things afloat around
    mathematical logic—which would soon intersect with combinators.'
