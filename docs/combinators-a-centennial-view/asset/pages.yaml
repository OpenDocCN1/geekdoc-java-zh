  md: 'Of course, we don''t know how close to combinators Schönfinkel was in 1914;
    after all, his lecture introducing them was six years later. But it''s interesting
    to at least imagine some interaction with Ajdukiewicz. Ajdukiewicz''s own work
    was at first most concerned with things like the relationship of mathematical
    formalism and meaning. (Do mathematical constructs "actually exist", given that
    their axioms can be changed, etc.?) But by the beginning of the 1930s he was so
    solidly concerned with natural language, and was soon writing papers with titles
    like "Syntactic Connection" gave formal symbolic descriptions of language (complete
    with "functors", etc.) quite reminiscent of Schönfinkel''s work.


    So far as I can tell Ajdukiewicz never explicitly mentioned Schönfinkel in his
    publications. But it seems like too much of a coincidence for the idea of something
    like presumably to have arisen independently in two people who presumably knew
    each other—never to have independently arisen anywhere else.


