  md: 'Consider these two pairs of updating events:


    ![](img/9989f4997c5d05c32e2f1cd1055a3106_120_0.png)


    In the first case, the events are effectively “spacelike separated”. They are
    connected by the same combinator expression, but they somehow appear at “distinct
    places”; But what about the second case? Again the two events are connected by
    being the same combinator expression. But now they’re not really “distinct places”;
    they’re just “distinct scales” in the tree.


    One feature of hypergraph rewriting systems is that in large-scale limits the
    hypergraphs they produce can behave like continuous manifolds that potentially
    represent physical space, with hypergraph distances approximating geometric distances.
    In combinator systems there is almost inevitably a kind of nested structure that
    may be reminiscent of scale-invariant critical phenomena and ideas like scale
    relativity. But I haven''t seen combinator systems whose limiting behavior produces
    something like finite-dimensional “manifold-like” space.


    It’s common to see “event horizons” in combinator causal graphs, in which different
    parts of the combinator system effectively become causally disconnected. When
    combinators reach fixed points, it is as “time is ending”—much as it does in spacelike
    singularities in spacetime. But there are no doubt “treelike” limiting phenomena
    in combinator systems, that may be reflected in properties of hyperbolic spaces.


    One important feature of both string and hypergraph rewriting systems is that
    their rules are generally assumed to be somewhat local, so that the future of
    any element must lie within a certain “cone of influence”. Or, in other words,
    there’s a light cone which defines the maximum spacelike separation of events
    that can be causally connected when they have a certain timelike separation. In
    our model of physics, there’s also an “entanglement cone” that defines maximum
    branchlike separation between events.'
  merge: -1
  pgno: 120
- img_proc: true
  md: 'But what about in combinator systems? The Rules aren''t really "spatially local",
    but they are "tree local". And so they have a limited "tree cone" of influence,
    associated with a "maximum treelike speed"—or, in a sense, a maximum speed of
    scale change.


    Rewriting systems based on strings, hypergraphs and combinator expressions have
    all different simplifying and complexifying features. The relation between underlying
    elements ("characters arranged in sequence") is simplest for strings. The notion
