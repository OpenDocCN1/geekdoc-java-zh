    And potentially it''s possible to do computations by "piggy-backing" on these
    nonhalting evolutions. Start with a specification of the computation you want
    to. Now encode it as an initial condition for one of the infinite number of possible
    non-halting combinator evolutions. Run the combinator evolution until some particular
    feature occurs. Then decode the result at that stage the output from the computation.


    To prove that the S combinator is capable of supporting universal computation,
    one must show that something this will work for any possible computation one wants
    to do. Or, in other words, one must show that an S combinator system (say the
    S, K combinator one) is already known to be universal. And by "emulate", what
    we mean is that a suitable encoder, "detector" and "decoder" can be found that
    will allow any evolution in the system being emulated to be mapped to a corresponding
    evolution in the S combinator system.


    There is an important caveat: one has to be sure that the encoder, detector and
    decoder are not themselves capable of universal computation. If one''s lucky,
    these will operate in sufficiently straightforward ways so that it''ll obvious
    they''re not universal. But in general it''ll be nontrivial to demonstrate that
    they''re not universal. Depending on the setup, one approach may be to show that
    for all inputs they must halt in some bounded time.


    OK, so if the S combinator system is not universal computation? How could one
    show that? One possibility would be to demonstrate that all, even infinite, evolutions
    have only a finite, or essentially finite, number of distinct'
  merge: -1
  pgno: 301
- img_proc: true
  md: 'forms. Another would be to establish that any “modulation” of such evolution
    must always die in finite time, so that it must in effect correspond to a computation
    that halts.


    A slightly different approach would be to show that S combinator evolution can
    be “solved” to the point where its properties after any number of steps can be
    determined by some bounded computation.


    We’ve been talking about “doing computations” with combinators. But there’s a
    subtlety with that. Because there are in general many different possible evaluation
    orders for the combinator evolution. If the evaluation halts, then it’s guaranteed
    that it’ll always reach the same fixed point, regardless of the order in which
    the evaluation was done. But if it doesn’t halt, there’s in general a whole multiway
    graph of possible sequences of results.


    So what does computation universality then mean? As I’ve discussed elsewhere,
    a strong potential definition is to ask that the multiway system generated by
    say, by a multiway (or nondeterministic)Turing machine. But a weaker alternative
    definition might just be to ask whether one can find some path (i.e. some evaluation
    order) that can perform any given (deterministic) computation. Or one might for
    example have detector and decoder functions that can work on some—or all—branches,
    somehow always being able to reproduce the computation one wants.'
