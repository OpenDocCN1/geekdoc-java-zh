  md: '# Combinators and the Story of Computation


    And so it was that came to design SMP: "A Symbolic Manipulation Program"–all based
    on transformation rules for symbolic expressions. It was easy to represent mathematical
    relations (Sx is a pattern variable that would now in the Wolfram Language be
    x_, on the left-hand side only):


    ```

    STR(3,2,1): ReIn[Sx] & Re[By] -> ReIn[Sx Sqrt(1-By^2) & By Sqrt(1-Sx^2)]

    STR(3,2,2): ReIn[Sx] & Re[By] -> ReIn[Sx Sqrt(1-By^2) & By Sqrt(1-Sx^2)]

    STR(3,2,3): Ro[Sx] & Ro[By] -> Ro[Sx By Sqrt((1-Sx^2) * (1-By^2))]

    STR(3,2,4): Ro[Sx] & Ro[By] -> Ro[Sx By Sqrt((1-Sx^2) * (1-By^2))];

    ```


    Or basic logic:


    ```

    // Idempotent laws /

    // Sp & Sp -> Sp


    // Commutative and associative law built in /

    // Distributive laws /

    // (Sp & Sq) -> (Sp | Sq) & (Sp | Sq)


    // Identity law built in /

    // Complement laws /

    // ~Sp | Sp -> I

    // Sp & ~Sp -> I


    // DeMorgan laws /

    // ~(Sp | Sq) -> (~Sp) & (~Sq)

    ~(Sp & Sq) -> (~Sp) | (~Sq)


    // Inverse law /

    // Sp > ~Sp -> I


    // Antisymmetric law /

    // (Sp > Sq) & (Sq > Sp) -> Sp=Sq


    // Transitive law /

    // (Sp > Sq) & (Sq > Sr) -> Sp > Sr

    ```


    Or, for that, predicate logic of the kind Schönfinkel wanted to capture:


    ```

    Quant(Sq) : Be

    Quant([Sq, Quant([Sr]])) -> Quant([Sq, Sr])


    // DeMorgan''s law /

    ~Quant(I([Sx], Sq, Sr)) -> Quant(Same(Sx), Quant([Sq, Sr]))

    ~Quant(Same(Sx), Sq, Sr)) -> Quant(I([Sx]), Quant([Sq, Sr]))

    ```


    And, yes, it could emulate a Turing machine (note the tape-as-transformation-rules
    that appear at: the ends):


    ```

    // Tape(i): Tape[i]=1

    // Move

    // Spell[i,1] -> Right[i,1]

