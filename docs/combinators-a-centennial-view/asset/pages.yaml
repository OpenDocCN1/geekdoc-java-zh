  md: '# Other Schöninkels...


    So as we know, Moses Schönfinkel never married, and didn''t have children.

    But he did have a brother, Nathan, who we encountered earlier in connection with
    the letter he wrote about Moses to David Hilbert. And in fact we know quite a
    bit about Nathan Schönfinkel (as he normally styled himself). Here''s a biographical
    summary from 1932:


    Schönfinkel, Nathan, Dr. med. P.-D., Neufeldt, S. Stern (geb. 13. Okt. 1893 in
    Elmarn, Schleswig), born in Asbek; Stud. Gymnasium, Ekaterinow, Univ. Bern. Born
    1902; Dr.-Examen; 22 Assistent a. Phys. Institut (Ausbildung undl. Prof. Arzt
    nach d. medic. u. biology.) Sach in Grade d. modernen Physik) 29 P.-D. Physiologie
    a ud. Univ. Bern. V.: Arbeiten beschäftigten sich mit den Problemen: Ermüdung,
    Sauerstoffwechsel, Herzschlag u Wirkung d. Nerven (ersch. i. d. Zeitschrift. d.
    Biologie).


    The basic story is that he was about five years younger than Moses, and went to
    study medicine at the University of Bern in Switzerland in April 1914 (i.e. just
    before World War I began). He got his MD in 1920, then got his PhD on “Gas Exchange
    and Metamorphosis of Amphibian Larvae feeding on the Thyroid Gand or Substances
    Containing Iodine”. He then did subsequent research on the electrochemistry of
    the nervous system, and in 1929 became a privatdoent with official “license to
    teach” documentation:


    ![](img/9989f4997c5d05c32e2f1cd1055a3106_265_0.png)


    Staatsarchiv des Kantons Bern, BB IIIb 557 Schönfinkel N.'
