    it''s unlikely they survived World War II—because in one of shocking and tragic
    pieces of history, over a four-day period in February 1942 almost the whole Jewish
    population of 30,000 was killed.


    Could there be other Schfinkels elsewhere? The name is not common, but it does
    show up (with various spellings and transliterations), both before and after Moses
    Schönfinkel. There''s a Scheinifel Russian revolutionary buried in the Kremlin
