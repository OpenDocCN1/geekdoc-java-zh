  md: '# The Question of Evaluation Order


    As a computational language designer, it''s an issue I''ve been chasing for 40
    years: what''s the best way to define the order in which one evaluates (i.e. computes)
    things? The good news is that in a well-designed language (like the Wolfram Language!)
    it fundamentally doesn''t matter, at least much of the time. But in thinking about
    combinators—and the way they evolve—evaluation order suddenly becomes a central
    issue. And in fact it''s also a central issue in our new model of physics—where
    it corresponds to the choice of reference frame, for relativity, quantum mechanics
    and deobiology.


    Let''s talk about evaluation order as it shows up in the symbolic structure of
    the Wolfram Language. Imagine you''re doing this computation:


    ```

    In[: Join[{a, b}, (c, d, e)]

    ```


    ```

    Out[: 5

    ```


    The result is surprising. But what''s actually going on here? Well, first you''re
    computing Join[...]:


    ```

    In[: Join({a, b}, (c, d, e)]

    ```


    ```

    Out[: (a, b, c, d, e)

    ```


    Then you''re taking the result, and providing it as an argument to Length, which
    does its job, and gives the result 5. And in general in the Wolfram Language,
    if you''re computing f[g[x]]what''ll happen is that x will be evaluated first,
    followed by g[x], and finally f[g[x]]. (Actually, the head f[g[x]] is the first
    thing expect, and in f[x,y] one evaluates f, then x and then f[x,y).


    And usually this is exactly what one wants, and what people implicitly expect.
    But there are cases where it isn''t. For example, let''s say you''ve defined x=2
    (Set{x,2}). If the x you''ve defined is evaluated first, you''d get Set{1,2},
    which doesn''t make any sense. Instead, you use Set to "hold its first argument",
    and "consume" without first evaluating it. And in the Wolfram Language this happens
    automatically because Set has attribute HoldFirst.


    How is this relevant to combinators? Well, basically, the standard evaluation
    order used by the Wolfram Language is like the depth-first (leftmost-innermost)
    scheme we described above, while what happens when functions have Hold attributes
    like the leftmost-outermost scheme.'
