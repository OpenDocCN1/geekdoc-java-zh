  md: '# ADDENDUM

    A Little Closer to Finding What Became of Moses Schönfinkel, Inventor of Combinators


    For most big ideas in recorded intellectual history one can answer the question:
    “What became of the person who originated it?” But late last year I tried to answer
    that for Moses Schönfinkel, who sowed a seed for what''s probably the single biggest
    idea of the past century: abstract computation and its universality.


    I managed to find out a lot about Moses Schönfinkel. But I couldn''t figure out
    what became of him. Still, I kept on digging. And it turns out I was able to find
    out more. So here''s an update...


    To recap a bit: Moses Schönfinkel was born in 1888 in Ekaterinoslov (now Dnipro)
    in what now Ukraine. He went to college in Odessa, and in 1914 went to Göttingen
    with David Hilbert. He didn''t publish anything, but on December 7, 1920—at the
    age of 32—he gave a lecture titled “Elementere Logik (“Elements of Logic”) that
    introduced what are now called combinators, the first complete formalism for what
    we''d now call abstract computation. Then on March 18, 1924, with a paper from
    his lecture just submitted for publication, he left for Moscow. And basically
    vanished.


    It''s said that he had mental health issues, and that he died in poverty in Moscow
    in 1940 or 1942. But we have no concrete evidence for either of these claims.


    When I was researching this last year, I found out that Moses Schönfinkel had
    a younger brother Nathan Scheinfinkel (yes, he used a different transliteration
    of the Russian Шейнфифель) who became a physiology professor at Bern in Switzerland,
    and later in Turkey. Late in the process, I also found out that Moses Schönfinkal
    had a younger sister Debora, who we could tell graduated from high school in 1907.'
