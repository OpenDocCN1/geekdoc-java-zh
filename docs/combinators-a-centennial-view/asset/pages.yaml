  md: 'History of symbolic systems. Symbolic systems of the generic type I discuss
    here to have risen in 1920 in the work of Moses Schönfinkel on what became known
    as combinators. As discussed on page [319] Schönfinkel introduced certain specific
    rules that he could suggest to build upon functions defined logic. In the 1930s
    there were a variety of theoretical studies of how logic and mathematics could
    be set up with combinators, notably by Haskell Curry. For the most part, only
    Schönfinkel''s specific rules were used, and only rather specific forms of behavior
    were investigated. In the 1970s and 1980s there was interest in using combinators
    as a basis for compilation of functional programming languages, but only fairly
    specific situations of impractical relevance were considered. (Combinators have
    also been used like recreations, notably by Raymond Sullyan.)


    Constructs like appear to have never been seen in mainstream pure mathematics.
    The most likely reason is that building functions on the structure of symbolic
    expressions has never seemed to have obvious correspondence to the traditional
    mathematical view of functions as mappings. And in fact in mathematical logic,
    combinators have universally not been considered. Most likely reason is that ever
    since the work of Bertrand Russell in the early 1960s it has generally assumed
    that it is desirable to distinguish a hierarchy of different types of functions
    and objects—analogous to the different types of data supported in most programming
    languages. But combinators are set up without any restrictions associated with
    types. And it turns out among programming languages [Wolfram Language] is unique
    in also having this feature. From experience with [Wolfram Language] it is now
    clear that having a symbolic system—like combinators—has no built-in notion of
    types allows great generality and flexibility. (One can set up the analog of types
    by having rules only for expressions whose have particular structures.)


    Operator systems. We can generalize symbolic systems by having rules that define
    transformations for any [Wolfram Language] pattern. Often these can be thought
    of as oneway versions of axioms for operator systems (per as /. does), however
    after page 1171 [in A New Kind of Science]), but applied only in cases in all
    possible ways (as in a multway system)—so that the evolution is just given by
    NestList!/ rule &, init, tl). The rule $x \to x x$ for examples generates a binary
    tree. The pictures below show the patterns of opening and closing parentheses
    obtained from operator evolution in a few cases.


