  md: '# COMBINATORS: A Centennial View


    It''s a pretty general problem; it happens even in natural language. If we write
    "Jane chased Bob. Jane ran fast." it is pretty clear what we''re saying. But "Jane
    chased Jane ran fast." is already confused. In natural language, we avoid names
    with pronouns (which are basically the analog of # in the Wolfram Language). And
    because of the (traditional) gender setup in "Jane chased Bob. She ran fast."
    happens to work. But "The cat chased the mouse. It ran fast." again doesn''t.


    But combinators solve all this, by effect giving a symbolic procedure to describe
    what reference goes under. And, yes, by now computers can easily follow this (at
    least they deal with symbolic expressions, like in the Wolfram Language). The
    passage of a century—and our experience with computation—doesn''t seem to have
    made easier for humans to follow it.


    By the way, it''s worth mentioning one more "famous" feature of combinators—that
    actually had been independently invented before combinators—and these days, usually
    by the name "currying". It''s pretty common—say in the Wolfram Language—to have
    functions that naturally take multiple arguments. GeoDistance[a, b] or Plus[a,
    b, c] or (a+b+c) are examples. But in trying to uniformize as much as possible,
    combinators just make all "functions" nominally have only one argument.


    To set up things that "really" have multiple arguments, one uses structures like
    f[x][y][z]. From the point of standard mathematics, this is very weird: one expects
    "functions" to just "take an argument and return a result", and "map one space
    to another" (say real numbers to complex numbers).


    But if one is thinking "sufficiently symbolically" it''s fine. And in the Wolfram
    Language—with its fundamentally symbolic character (and distant ancestry in combinators)—one
    can just make a definition like


    ```

    f[x_,y] := x+y

    ```


    as:


    ```

    f[x_,y] := x+y

    ```


    Back in 1980—even though I don''t think I knew about combinators yet that time—I
    actually tried in SMP system that was a predecessor to the Wolfram Language the
    idea of having f[x][y] be able to be equivalent to f[x,y]. But it was a bit like
    forcing every verb to be intransitive—and there were many situations in which
    it was quite unnatural, and hard to understand.


    16'
