  md: '# Schönfinkel Rediscovered


    In the decade or so after Schönfinkel''s paper appeared, Curry occasionally referenced
    it, as did Church and a few other closely connected people. But soon Schönfinkel''s
    paper—and Schönfinkel himself—disappeared completely from view, and standard databases
    list no citations.


    In 1967 Schönfinkel''s paper was seen again—now even translated into English.
    The venue was a book called From Fege to Gödel: A Source Book in Mathematical
    Logic, 1879–1931. And there, sandwiched between von Neumann on transfinite numbers
    and Hilbert on "the infinite", is Schönfinkel''s paper, in English, with a couple
    of pages of introduction by Willard Van Orman Quine. (And it was from this book
    that I first became aware of Schönfinkel and his work.)


    But how did Schönfinkel''s paper get into the book? And do we learn anything about
    Schönfinkel from his appearance? Maybe. The person who put the book was a certain
    Jean van Heijenoort, who himself had a colorful history. Born in 1912, he grew
    up mostly in France, and went to college to study mathematics—but soon became
    obsessed with communism, and in 1932 left to spend what ended up being nearly
    ten years working as a kind of combination PR person and bodyguard for Leon Trotsky,
    initially in Turkey but eventually in Mexico. Having married an American, van
    Heijenoort moved to New York City, eventually enrolling in a math PhD program,
    and becoming a professor doing mathematical logic (though some colorful papers
    along the way, with titles like “The Algebra of Revolution”).


    Why is this relevant? The question is: how did Heijenoort know about Schönfinkel?
    Perhaps it was just through careful scholarship. But it just might be through
    Trotsky''s. There''s no real evidence, although it is known that during his time
    in Mexico, Trotsky requested a copy of Principia Mathematica (or it was his "PR
    person”). But at least if there was a Trotsky connection it could explain Schönfinkel''s
    strange move to Moscow. But in the end we just''t know.'
