  md: '# COMBINATORS: A Centennial View


    Why is it important to know? Obviously it''ll be neat if it turns out that hiding
    in plain sight for a century has been an even simpler basis for universal computation
    than we ever knew. But more than that, determining whether the S combinator alone
    is universal will provide an important additional data point in the effort to
    map out where the threshold of universal computation lies.


    Practical computers have even simpler and carefully designed CPUs. But is that
    complexity really needed to support universal computation? My explorations in
    the computational universe over the past 40 years have led me to the conclusion
    that it is absolutely not, and in fact even among systems with the simplest rules,
    universal computation is actually quite ubiquitous.


    I''ve developed a very general principle that I call the Principle of Computational
    Equality that implies pretty much whenever we see behavior that isn''t in some
    sense obvious, then it will actually correspond to a computation that''s equivalent
    in sophistication to any other computation. And one of the many consequences of
    this principle is that it says computation universality should be ubiquitous.


    For more than 30 years I''ve been pushed to get explicit evidence about this,
    by proving (or disproving) that particular systems are computation universal.
    And from this have come two very excellent examples that help validate the Principle
    of Computational Equality: the rule 110 cellular automaton


    ![](img/9989f4997c5d05c32e2f1cd1055a3106_298_0.png)


    and the 2, 3 Turing machine:


    ![](img/9989f4997c5d05c32e2f1cd1055a3106_298_1.png)


    Both these systems I identified as the simplest of their type could conceivably
    be computation universal—and both I expected would actually be computation universal.


    But in both cases it was hard to come up with an explicit proof. In the first
    case, the proof was part of my book A New Kind of Science (with much of the heavy
    lifting done by a then-research assistant of mine). In the second case, I''d already
    “made the conjecture” in A New Kind of Science, but in 2007 I decided to put up
    a prize for resolving it. And I was very pleased when, after just a few months,
    a proof was found, and the prize was won.


    298'
