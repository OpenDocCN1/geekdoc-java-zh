  md: 'The final paper as coauthored with Bernays begins:


    > “The central problem of mathematical logic, which is also closely connected
    to its axiomatic foundations, the decision problem [Entscheidungsproblem]. And
    it deals with the following. We have logical formulas which contain logic functions,
    predicates, ..."


    Schönfinkel’s version begins considerably more philosophically (here with a little
    editing for clarity):


    > “Generality has always been the main goal—the ideal of the mathematician. Generality
    in the solution, in the method, in the concept and formulation of the theorem,
    in the problem and question. This tendency is ever pronounced and clearer with
    modern mathematicians than with earlier ones, and reaches its high point in the
    work of Hilbert and Ms. Noether. Such an ideal finds its most extreme expression
    when one faces the problem of ‘solving all problems’—at least all mathematical
    problems, because everything else is easy, as soon as the ‘Gordian Knot’ is cut
    (because the world is written in ‘mathematical letters’ according to Hilbert).


    In the previous century mathematicians would have been extremely skeptical and
    even averse to such fantasies... But today’s mathematician has already been trained
    and tested in the formal achievements of modern mathematics and nowadays one has
    the courage and the boldness to touch this question as well. We owe to mathematical
    the fact that we are able to have such a question at all.


    From Leibniz’s conjectures, the great logician-mathematicians went step by step
    in pursuit of this, in the systematic structure of mathematical logic: Boole (discoverer
    of the logical calculus), (Bolzano?), Ernst Schröder, Fege, Peano, Ms. Ladd-Franklin,
    the two Peires, Sheffer, Whitehead, Couturat, Huntington, Padua, Shatunov, Sleshinsky,
    Kagan, Poretsky, Löenheim, Skolem, ... and their numerous students, collaborators
    and contemporaries... until 1910–1914 ‘the system’ by Bertrand Russell and Whitehead
    appeared—the famous ‘Principia Mathematica’—a mighty titanic work, a large system.
    Finally come our knowledge of logic from Hilbert’s lectures on (the algebra of)
    logic (-calculus) and, following on this, the groundbreaking work of Hilbert’s
    students: Bernays and Behmann.'
