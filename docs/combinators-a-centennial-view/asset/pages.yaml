  md: 'To discuss the “general decision problem”, though, one needed some kind of
    general notion of how one could decide things. What ultimate primitives should
    one use? Schönpink (with Paul Bernays)—in his sole other published paper—wrote
    about a restricted case of the decision problem in 1927, but doesn’t seem to have
    had the idea of using combinators to study it.


    By 1934 Gödel was talking about general recursiveness (i.e. definability through
    general recursion). And Alonzo Church and Stephen Kleene were introducing λ definability.
    Then in 1936 Alan Turing introduced Turing machines. All these approaches involved
    setting certain primitives, showing that a large class of things could be “compiled”
    to those primitives. And that—in effect by thinking about having to compile itself—Hilbert’s
    Entscheidungsproblem couldn’t have been solved.


    Perhaps no single result along these lines would have been so significant. But
    it was soon established that all three kinds of systems they could represent were
    the same, as established by show-ing that one system could emulate another. And
    from that discovery eventually emerged the modern notion of universal computation—and
    all its implications for technology and science.


    In the early days, though, there was actually a fourth equivalent kind of system—based
    on string rewriting—that had been invented by Emil Post in 1920–1. Oh, and there
    there were combinators.'
