  md: "But without the notion of an underlying computational language, people tend\
    \ to feel the need to search endlessly for formal structure in natural language.\
    \ And, yet yes, some exists. But—as we see all the time in actually doing practical\
    \ natural language understanding for WolframAlpha—is a giant tail that seems to\
    \ utterly explode any all-encompassing formal theory.\n\nAre there least fragments\
    \ that have formal structure? There are things like logic (\"and\", \"or\", etc.)\
    \ that get used in human language, and which are fairly straightforwardly formalizable.\
    \ But maybe there are some \"functional\" structures, perhaps having to do with\
    \ the operation of verbs. And in combinatory linguistics, there’ve been attempts\
    \ to find these—even for example using things like Schönfinkel’s S combinator.\
