- img_proc: true
  md: 'And as soon as one''s determining "execution order" by function evaluation
    order, things are immediately much more extensible: without having to specify
    anything-else, there''s automatically a definition of what to do, for example,
    when one gets a piece of input with more complex structure. If one thinks about
    it, there are lots of complex issues about when to recur through different parts
    of an expression versus when to recur through reevaluation. But the good news
    is that at least the way the Wolfram Language is designed, things in practice
    normally “just work” and one doesn''t have to think about them.


    Combinator evaluation is one exception, where, as we have seen, the details of
    evaluation order can have important effects. Presably this dependence is in fact
    connected to why it''s so hard to understand how combinators work. But studying
    combinator evaluation once again inspires one (or at least me) to try to find
    convenient parametrizations for evaluation order—perhaps now using using ideas
    and intuition from physics.'
