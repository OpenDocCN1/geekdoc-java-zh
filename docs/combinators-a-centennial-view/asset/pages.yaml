- img_proc: true
  md: 'Even when Curry picked up the idea of combinators—and did so much with it—I
    don''t think he really saw the essence of what Schönfinkel was trying to do. Combinators
    and Schönfinkel are a strange episode in intellectual history. A seed sown far
    ahead of its time by a person who left surprisingly few traces, and about whom
    we know personally so little.


    But much as combinators represent a way of getting at the essence of computation,
    perhaps in combinators we have the essence of Moses Schönfinkel: years of a life
    compressed to two “signs” (as he would call them) $S$ and $K$. And maybe if the
    operation we now call currying needs a symbol we should be using the “sha” character
    III from the beginning of Schönfinkel’s name to remind us of a person about whom
    we know so little, but planted a seed that gave us so much.'
