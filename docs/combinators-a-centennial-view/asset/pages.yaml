  md: '# The Question of Evaluation


    But back in 1980 I had an idea for at least a partial parametrization of evaluation
    orders. Here is it from section 3.1 of the SMP documentation:


    | The simplification of expressions proceeds as follows: |

    | Numbers | Ordinary numbers remain unchanged. |

    | Syntax | A symbol is replaced by the simplified form of any value assigned [3:2]
    to it. |

    | Projections | 1. Each flat is simplified then, unless the value (δ) of any corresponding
    flat property is carried by the projection P (The simplification of c/f is carried
    out until its value no longer changes, or until projections not carrying property
    have appeared at most k times (see below). If f is found to be redundant with
    respect to the projection, then the projection is rejected or encoded as simplified
    in the relevant property list [4]. Projections with Flat, Come or Rec properties
    [4,7] are cut into canonical form.|


    What I called a "projection" then is what we call a function now; a "filter" is
    what we now call an argument. But basically what this is saying is that usually
    the arguments of a function are evaluated (or "simplified") in SMP parlance before
    the function itself is evaluated. (Though note the ahead-of-its-time escape clause
    about which might evaluate arguments asynchronously.)


    But here''s the funny part: functions in SMP also had Smp and Rec properties (roughly,
    modern) determined how recursive evaluation would be done. And in a first approximation,
    the concept was that Smp would choose between innermost and outermost, but Rec
    would say how many levels to go before "going outermost" again.


    And yes, nobody (including me) seems to really understand how to use these things.
    Perhaps to parametri evaluation order (beyond the / vs. automatic evaluation vs.
    hold attributes in Wolfram Language), I never found. And it''s not encouraging
    here to see all the complexity associated with different updating schemes for
    combinators.


    By the way, it''s worth mentioning that there is always a way to completely specify
    evaluation order: just do something like procedural programming, Goto where every
    "statement" is effectively numbered, and there can be explicit Goto''s say what
    statement to execute next. But in practice this quickly gets incredibly fiddle
    and fragile—and one of the great values of functional programming— is that it
    streamlines things by having "execution order" just implicitly determined by the
    order in which functions get evaluated (yes, with things Throw and Catch available).'
