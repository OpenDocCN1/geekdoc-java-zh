    Except, confusingly, the time it was called (after Catherine the Great or her
    namesakes saint) Ekaterinoslav (Екатеринослав)—and it''s now called Dnipro. It''s
    one of the larger cities in Ukraine, roughly in the center of the country, about
    250 miles down the river Dnieper from Kiev. And at the time Schönfinkel was born,
    Ekaterislava was part of the Russian Empire.


