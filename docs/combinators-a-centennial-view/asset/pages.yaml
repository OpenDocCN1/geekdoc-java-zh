  md: '# Who Was Moses Schönfinkel?


    So who was this person, who managed so long ago to see so far?


    The complete known published output of Moses Schönfinkel consists of just two
    papers: his 1924 "On the Building Blocks of Mathematical Logic", and another,
    31-page paper from 1927, coauthored with Paul Bernays, entitled "Zum Entscheidungsproblem
