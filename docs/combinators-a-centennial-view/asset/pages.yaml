  md: 'And, yes, in the end all symbolic expressions could be constructed like combinators
    from S and K—with no direct human meaning. That would be like having a world without
    nouns—a world where there''s no name for anything—and the representation of everything
    has to be built from scratch. The crucial idea that''s central to human language—and
    now to computational language—is to have layers of abstraction, where one can
    call names and then refer to them without thinking about how they''re built up
    “inside”.


    In some sense one can see the goal of people like Frege—and Schönf—as being to
    “reduce out” what exists in mathematics (or the world) and turn it into something
    like “pure logic”. And the structural part of that is exactly what makes computational
    language possible. But in my conception of computational language the ideal idea
    is to have content that relates to the world and the way we humans think about
    it.


    And over the decades I''ve been amazed at just how success the idea of representing
    things in terms of symbolic expressions and transformations on them. Underneath
    everything that''s going on in the Wolfram Language—and in all the systems that
    now use it—it''s ultimately just symbolic expressions being transformed according
    to particular rules, and reaching points that represent results of computations,
    just like those examples in Schönfinkel''s original paper.


    One important feature of Schönfinkel''s setup is the idea that one doesn''t just
    have “functions” like f[x], or even nested functions, like f[g[x]]. One can have
    constructs where instead of the “name of a function” (like f) one can have a whole
    complex symbolic structure. And while this was certainly possible in SMP, not
    too much But when I came to start designing what''s now the Wolfram Language in
    1986, I made sure that the “head” (as I called it) of expression could be an arbitrary
    expression.


