  md: '# Visualizing Combinators


    In our combinator expression above, we had 24 pairs of brackets. By using @, we
    can reduce this to 10:


    (s @ s @ s) @k(s @ s @ s @ s) @s ((k(s @ s @ s @ s) @s (s @ s @ s @ s) @s (s @
    s @ s) @k(s @ s @ s @ s) @s


    And we don''t really need to show the @, so we can make this smaller:

    (sss)(k(sss)s)(k(sss)s)s)(sss)(k(k(sss)s))


    When combinators were first introduced a century ago, the focus was on "multi-argument-like"
    expressions such as a[b][c] (as appear in the rules for s and k), rather than
    "nested-function-like" expressions such as a[b]. Instead of thinking of function
    application as "right associative”—so that a[b][c] can be written without parentheses—so
    that a[b][c] could be written without parentheses. (Confusingly, people often
    used @ as the symbol for this left-associative function.)


    As it''s turned out, f[g|x] form is more common in practice than f[g](x), and
    in 30+ years hasn''t been much of a call for a notation for left-associative function
    application in the Wolfram Language. But in celebration of the centenary of combinators,
    we''ve decided to introduce Application (indicated by *) to represent left-associative
    function application.


    So this means a[b][c][d][e] can be written


    a•b•c•d•e


    without parentheses. Of course, now a[b[c[d[e]]]] needs parentheses:


    a•(b•c(d•e)))


    In this notation for s and k can be written without brackets:


    {s•x•y•z→x•z(•y), k•x•y→x}


    Our combinator expression above becomes


    s(s(s•s(s)•k(s•s(s)•s)•s)•k(s•s(s)•s)•s)•s(s(s•s)•s)•k(s(sss•s•s)))


    or without the function character


    s(s(ss)(k(sss)ss)(k(sss)s)ss(ss(k(sss)s)))


    which now involves 13 pairs of parentheses.


    35'
