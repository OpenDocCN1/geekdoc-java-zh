  md: 'This seems straightforward enough. But immediately there''s a subtlety. When
    exactly was Moses Schönfinkel born? What is that date? At the time the Russian
    Empire—which the Russian Orthodox Church, which eschewed Pope Gregory''s 1582
    revision of the calendar—was still using the Julian calendar introduced by Julius
    Caesar. (The calendar was switched in 1918 after the Russian Revolution, although
    the Orthodox Church plans to go on celebrating Christmas on January 7 until 2100.)
    So to know a correct modern (i.e. Gregorian calendar) date of birth we had to
    do a conversion. And from this we''d conclude that Moses Schönfinkel was born
    on September 19, 1888.


    But it turns out that''s not the end of the story. There are several other documents
    associated with Schönfinkel''s college years that also list his date of birth
    as September 7, 1888. But the state archives of the Dnepetrovsk region contain
    the actual, original register from the synagogue in Ekaterinos. And here''s entry
    272—and it records the birth of Moses Schönfinkel, but on September 17, not September
    7:


    ![](img/9989f4997c5d05c32e2f1cd1055a3106_221_0.png)


    So the official certificate is wrong! And there''s a check: the Birth Register
    also gives the date in the Jewish calendar: 24 Tishrei—which for 1888 is the Julian
    date September 17. So converting to modern Gregorian form, the correct date of
    birth for Moses Schönfinkel is September 29, 1888.'
