  md: 'And somehow Schönfinkel has always been in the shadows—appearing at best only
    as a kind of footnote to a footnote. Turing machines have taken the limelight
    as models of computation—with combinators, hard to understand as they are, being
    mentioned at most in obscure footnotes. And even within within the study of combinators—often
    called “combinatory logic”—even as S and K have remained ubiquitous, Schönfinkel’s
    invention of them typically garners at most a footnote.


    About Schönfinkel as a person, three things are commonly said. First, that he
    was somehow connected with the mathematician David Hilbert in Göttingen. Second,
    that he spent time in a psychiatric institution. And third, that he died in poverty
    in Moscow, probably around 1940 or 1942.


    But of course there has to be more to the story. And in recognition of the centenary
    of Schönfinkel’s announcement of combinators, I decided to try to see what I could
    find out.


    I don''t think I''ve got all the answers. But it''s been an interesting, if at
    times unsettling, trek through the Europe—and mathematics—of a century or so ago.
    And at the end of it I feel I''ve come to know and understand at least a little
    more about the triumph and tragedy of Moses Schönfinkel.'
