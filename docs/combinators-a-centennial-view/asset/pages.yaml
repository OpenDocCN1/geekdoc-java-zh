  md: 'Other combinators yield still more complicated behavior—sometimes with overall
    repetition or nesting, but often not.


    There are features of combinators that are not easy to capture directly in pictures.
    But from pictures like the ones on the facing page it is rather clear that despite
    their simple underlying rules, the behavior of combinators can be highly complex.


    And while issues of typical behavior have not really been studied before, it has
    been known that combinators are universal almost since the concept of universality
    was first introduced in the 1930s.


    One way we can now show this is to demonstrate that combinators can emulate 110.
    And as the pictures on the next page illustrate, it turns out that just repeating
    the combinator expression reproduces successive steps in the rule of 110.


    ![](img/9989f4997c5d05c32e2f1cd1055a3106_315_0.png)


    > A combinator expression corresponds to the operation of doing one step of rule
    110 evolution.


    There has in the past been no overall context for understanding universality in
    combinators. But now what we have seen suggests that such universality is in a
    sense just associated with general complex behavior.


    We saw [on pages 307–313] that there are symbolic systems with rules simpler than
    combinators that still show complex behavior. And so now I suspect that those
    were universal.


    And in fact wherever one looks, the threshold for universality seems to be much
    lower than one we ever imagined. This is one of the most basic observations that
    led me to formulate the Principle of Computationalivalence that I discuss in [Chapter
    12 of A New Kind of Science].'
