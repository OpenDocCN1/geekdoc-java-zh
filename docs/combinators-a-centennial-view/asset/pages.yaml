    Over time I''ve come to realize that doing this is less about what one can in
    principle to construct computations, and more about making a bridge to the way
    humans think about things. It''s crucial that there''s an underlying structure—symbolic
    expressions—that can represent anything. Increasingly I''ve come to realize that
    what we need from a computational language is to have a way to encapsulate in
    precise computational form the kinds of things humans think about—in a way that
    we can understand. And a crucial part of being able to do that is to leverage
    what has ultimately been the core of making our whole intellectual development
    as possible: the idea of human language.


    Human language has given us a way to talk symbolically about the world: to give
    names to things, and then to build things using these. In designing a computational
    language the goal is to leverage this: to use what humans already know and understand,
    but be able to represent it in a precise computational way that is amenable to
    actual computation that can be done automatically by computer.


    It''s probably no coincidence that the tree structure of symbolic expressions
    that I have found to be such a successful foundation for computational language
    is a bit like an idealized version of the kind of tree structure (think parse
    trees or sentence diagramming) that one can view human language as following.
    There are other ways to set up universal computation, but this is the one that
    seems to fit most directly with our way of thinking about things.'
