  md: '# COMBINATORS: A Centennial View


    And indeed in our model that''s the progress of time is about: it''s the inexorable,
    irreducible process of computation, associated with the repeated transformation
    of the symbolic expression that represents the universe.


    When Hilbert first imagined that physics could be reduced to mathematics he probably
    thought that physics could be ''solved''. But with Gödel''s theorem—which is a
    reflection of universal computation—it became that mathematics itself couldn''t
    just ''solved''. But now in effect we have a theory that ''reduces physics to
    mathematics'', and the result of the Gödel''s theorem phenomenon is something
    very important in our universe: it''s what leads to a meaningful notion of time.


    Moses Schönfinkel imagined that with combinators he was finding ''building blocks
    for logic''. And perhaps the simplicity of what he came up with makes almost inevitable
    that it wasn''t just logic: it was something much more general. Something that
    can represent computations. Something that has the germ of how we can represent
    the ''machine code'' of the physical universe.


    It took in a sense ''humanizing'' combinators to make them useful for things like
    computational language whose very purpose is to connect with humans. But there
    are other places where inevitably we''re dealing with something more like large-scale
    ''combinators in the raw''. Physics is one of them. But there are others. In distributed
    computing. And perhaps in biology, in economics and in other places.


    There are specific issues of whether one''s dealing with trees (like combinators),
    or hypergraphs (like our model of physics), or something else. But what''s important
    is that many of the ideas—particularly what we call multiway systems—show up with
    combinators. And yes, combinators often aren''t the easiest places for us to understand
    the ideas. But the remarkable fact is that they exist in combinators—and that
    combinators are now a century old.


    I''m not sure if there will be a significant area where combinators alone will
    be the dominant force. But combinators have—for a century—had the essence of many
    important ideas. Maybe as such that they are at some level destined forever to
    be footnotes. In a sense they are also seeds or roots——from which remarkable things
    have grown. And as combinators enter their second century it seems quite certain
    that there is still much more that will grow from them.'
