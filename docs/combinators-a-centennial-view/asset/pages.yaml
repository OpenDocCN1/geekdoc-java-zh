  md: 'And, yes, it was not so easy to read, or to typeset—and at first it didn''t
    make much of an impression. But the notation became more streamlined with Giuseppe
    Peano''s Formulario project in the 1890s—which was not so concerned with starting
    from logic as starting from some fixed set of axioms (the “Peano axioms");


    ![](img/9989f4997c5d05c32e2f1cd1055a3106_172_0.png)


    And then in 1910 Alfred Whitehead and Bertrand Russell began publishing their
    200-page *Mathematica*—which pretty much us by its sheer weight and ambition (and
    notwithstanding what I would today consider grotesque errors of language design)—popularized
    the possibility of building up “the complexity of mathematics” from “the simplicity
    of logic”;


    ![](img/9989f4997c5d05c32e2f1cd1055a3106_172_1.png)'
