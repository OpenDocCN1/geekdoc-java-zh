  md: '# Equality and Theorem Proving for Combinators


    How do you tell if two combinator expressions are equal? It depends on what you
    mean by "equal". The simplest definition—that we''ve implicitly used in constructing
    multiway graphs—is that expressions are equal only if they''re syntactically exactly
    the same (say they''re both s[k][s[s]].


    But what about a more semantic definition, that takes into account the fact that
    one combinator expression can be transformed to another by the combinator rules?
    The obvious thing to say is that combinator expressions should be considered equal
    if they somehow be transformed by the rules into expressions that are syntactically
    the same.


    And so as the combinators evolve to fixed points this is in principle forward
    to tell. Like here are four syntactically different combinator expressions that
    all evolve to the same fixed point, and so in a semantic sense can be equal:


    | s[k][k][k][k][k] | s[s][s[s]][k][k][k]] | s[k][s[k]][s[k]][s[k]] | s[k][s[k]][k[k]][k[k]]
    |

    | s[k][k]][k[k]][s[k]] | s[k][s[k]][s[k]][s[k]] | k[0][s[k]][s[k]][s[k]] | s[k][k]][k[k]]
    |

    | k[s[k]][k[s[k]][s[k]]] | s[k][k[k]][s[k]][s[k]] | s[k] | s[k] |

    | s[k] | s[k][k[k]][k[k]][k[k]] | | |

    | | k[s[k]][k[s[k]]][k[k[k]][k[k]]]] | | |

    | | s[k] | | |


    One can think of the fixed point as representing a canonical form to which combinator
    expressions that are equal can be transformed. One can also think of the steps
    in the evolution as corresponding to steps in a proof of equality.


    But there''s already an issue—that''s associated with the fundamental fact that
    combinators are computation universal. Because in general there''s no upper bound
    on how many steps it can take for the evolution of a combinator expression to
    halt (and no general a priori way to even tell if it''ll halt at all). So that
    means that there''s also no upper bound on the "length of proof" needed to show
    by explicit computation that two combinators are equal. Yes, it might only take
    12 steps to show that this is another combinator equal to s[k]:'
