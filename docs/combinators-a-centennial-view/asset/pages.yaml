    and Sheynfinkel—and these show up almost nearly in different documents.


    What can we learn from Moses Schönfinkel’s “birth certificate”? Well, it describes
    his father Эльева (Ilya) as an Екатериinosслав механичник. But what is that word?
    It’s often translated “bourgeoisie”, but seems to basically mean “middle-class
