    On Tuesday, December 7, 1920, the Göttingen Mathematics Society held its regular
    weekly meeting—at which a 32-year-old local mathematician Moses Schönfinkel with
    no previous mathematical publications gave a talk entitled “Elemente der Logik”
    (“Elements of Logic).


    A hundred years later what was presented in that talk still seems in many ways
    alien and futuristic—and for most people almost ridiculously abstract. But we
    now realize that talk gave the first complete formalism for what is probably the
    single most important idea of the past century: the idea of universal computation.'
