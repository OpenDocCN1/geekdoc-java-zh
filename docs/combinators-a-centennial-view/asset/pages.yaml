  md: '# Combinators in the Computational Universe


    Combinators were invented for a definite purpose: to provide building blocks,
    as Schönfinkel put it, for logic. It was the same kind of thing with other models
    of what we know as computation. All of them were “constructed for a purpose”.
    But in the end computation—and programs—are abstract things, that in principle
    be studied without reference to any particular purpose. One might have some particular
    reason to be looking how fast programs of some kind run, or what can be proved
    about them. But what about the analog of pure natural science: of studying programs
    “naturally”


    At the beginning of the 1980s I got very interested in what one can think of the
    “natural science of programs”. My interest originally arose out of a question
    about ordinary science. One of the very noticeable features of the natural world
    is how much is in it to seems so complex. But where does this reality come from?
    Through what kind of mechanism does nature produce it? I quickly realized that
    in trying to address that question, I needed as a general foundation for making
    models of things as possible. And for that when I turned to programs, and began
    to study just “programs in the wild” do.


    Ever since the time of Galileo and Newton mathematical equations had been the
    main way that people ultimately imagined models of nature. And on the face of
    it—with their real numbers and continuous character—these seem quite different
    from the usual setup for computation, with its discrete elements and discrete
    choices. But perhaps through my own experience in doing mathematics symbolically
    as computers, I didn’t see a real conflict, and I began to think of programs as
    a kind of generalization of the traditional approach to modeling in science.


    But what kind of programs make nature use? I decided to just exploring all the
    possibilities: the whole “computational universe” of programs—starting with the
    simplest. I came up with a particularly simple setup involving a row of cells
    with values 0 or 1 updated in parallel based on the values of their neighbors.
    I soon learned that systems like this had actually been studied under the name
    “cellular automata” in the 1950s (particularly in 2D) as potential models of computation,
    though fallen out of favour mainly through not having very “human programmable”.


    My initial assumption was that with simple programs I''d only see simple behavior.
    But with my cellular automata it was very easy to do actual computer experiments,
    and to visualize the results. And though in many cases what I saw'
