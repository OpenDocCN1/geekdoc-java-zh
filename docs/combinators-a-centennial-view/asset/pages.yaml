  md: '# The Basic Setup


    In the usual, K combinator setup does computations by setting up an initial combinator
    expression that encodes the computation one wants to do, then one repeatedly applies
    the combinator rules until one gets to a fixed point that can be interpreted as
    the result of the computation. Of course, not all halt, and for computations that
    don''t, no fixed point will ever be reached.


    With the S combinator alone a direct input → output representation of computations
    won''t work. The reason is that there is an elaborate, but finite, characterization
    of every S combinator expression that halts, and the existence of this characterization
    implies that halting S combinator evolutions don''t have enough richness to represent
    arbitrary computations.


    There are however, plenty of non-halting S combinator evolutions. Here''s the
    very simplest of them:


    ```

    SSS(SS)SS

    S(SS)(S(SS))SS

    SSS(S(SS))S

    S(SS)(S(S(S(SS)S))S

    S(SS)SS(S(S(SS)S)S)

    SSS(S)(S(S(SS)S)S)

    SS(S)(S(SS))|S(S(SS)S)S)

    SS(S(S)(S(SS)S)(S(S(SS)S)(S(S(SS)S))

    S(S)(S)(S(S)(S(SS)S))|S(S)(S)(S(S(SS)S)(S(S)(S(S(SS)S))))

    ```


    And here are examples of the sequences of sizes of expressions obtained in various
    such evolutions:'
