  md: '# COMBINATORS: A Centennial View


    The procedure I describe for determining the termination of S combinator expression
    was invented by Johannes Waldmann at the end of the 1990s. (The detailed version
    that I used here came from Jörg Endrellis.)


    What we call multway systems have been studied in different ways in different
    fields, under different names. In the case of combinators, they are basically
    Böhm trees (named after Corrado Böhm).


    I''ve concentrated here on the original 5, K combinators; in recent livestreams,
    as in A New Kind of Science, I''ve also been exploring other combinator rules.


    # Thanks


    Matthew Szudzik has helped me with combinator matters since 1998 (and has given
    a lecture on combinators almost every year for the past 18 years at our Wolfram
    Summer School). Roman Maeder did a demo implementation of combinators in Mathematica
    in 1988, and has now added Combinator5 to Version 1.22 of Wolfram Language.


    I''ve had specific help on this piece from Jonathan Gorard, Jose Martin-Garcia,
    Eric Paul, Ed Pegg, Max Piskunov, and particularly Mano Nadumiri, as well as Jeremy
    Davis, Sushna Kim, Amy Simpson and Jessica Wong. We''ve had recent interactions
    about combinators with a four-academic-generation sequence of combinator researchers:
    Henk Barendregt, Jan Willem Klop, Jörg Endrellis and Roy Overbeek.'
