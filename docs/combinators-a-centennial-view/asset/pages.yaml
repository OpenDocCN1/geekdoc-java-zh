  md: 'The main part of the story begins in the 1800s. Through the course of the 1700s
    and 1800s mathematics had developed a more and more elaborate formal structure
    that seemed to be reaching ever further. But what really was mathematics? Was
    it a formal way of describing the world, or was it something else—perhaps something
    that could exist without any reference to the world?


    Developments like non-Euclidean geometry, group theory and transfinite numbers
    made it seem as if meaningful mathematics could indeed be done just by positing
    abstract axioms from scratch and then following a process of deduction. But all
    of mathematics actually just be a story of deduction, perhaps even ultimately
    derivable from something seemingly lower level—like logic?


    But if so, what would things like numbers and arithmetic be? Somehow they would
    have to be “constructed out of pure logic”. Today we would recognize these efforts
    as “writing programs” for numbers and arithmetic in a “machine code” based on
    certain “instructions of logic”. But back then, everything about this and the
    ideas around it had to be invented.'
