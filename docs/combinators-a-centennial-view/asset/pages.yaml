  md: '# # Preface


    I''d had it in my calendar for more than twenty years: December 7, 2020—the centenary
    of combinators. But how should it be celebrated? I''d first learned about combinators
    more than forty years ago—and a few times I''d used them. But they—and their origins—had
    always maintained a certain air of mystery for me.


    So a few months ago I decided the way I wanted to celebrate their centenary was
    finally to do my best to understand how combinators work, and how they came to
    be invented. This is the result.


    On the actual day of December 7, 2020—exactly at the hour a hundred years after
    Moses Schöninkel gave his talk about combinators—I was very pleased to be able
    to host an online event which brought together a large fraction of the living
    world experts on combinators.


    Combinators—and their invention—are a tale of both triumph and tragedy. They defined
    a vision of computation that has a profound and timeless elegance. But a century
    later they continue to seem exotic and abstruse—and fundamentally unsuitable for
    human consumption. In a different version of history the computer revolution might
    have been based on molecular rather than electronic computing, and combinators
    might have been at the center of it. But as it is, our computers are made of logic
    gates, and there aren''t any combinators in sight.


    But is that really true? As I worked on combinators in preparing for their century,
    I realized that combinators had a much more profound effect on least my thinking
    about computation than I''d ever imagined. In the more than forty years that I
    worked towards the full-scale computational language that is our modern Wolfram
    Language, the foundation of it all has the idea of representing everything in
    terms of symbolic expressions. And I now realize that ultimately that—and everything
    that has flowed from it—can be traced back to combinators, and their introduction
    on December 7, 1920.'
