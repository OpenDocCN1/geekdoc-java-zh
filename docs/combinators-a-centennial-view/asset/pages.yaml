  md: 'People like Frege, Whitehead and Russell had all been concerned with constructing
    specific things—like sets or numbers—that would have immediate mathematical meaning.
    But Hilbert’s work in the late 1910s began to highlight the idea of looking instead
    of metamathematics and the “mechanism of mathematics”—and in effect at how the
    pure symbolic infrastructure of mathematics fits together (through proofs, etc.),
    independent of any immediate “external” mathematical meaning.


    Much as Aristotle and subsequent logicians had used (propositional) logic to define
    a “symbolic structure” for arguments, independent of their subject matter, so
    too did Hilbert’s program imagine a general “symbolic structure” for mathematics,
    independent of particular mathematical subject matter.


    And this is what finally set the stage for the invention of combinators.'
