  md: '# Going to College in Odessa


    Having graduated from high school, Moses Schönfinkel wanted to go ("for purely
    family reasons", he said) to the University of Kiev. But being told that Ekaterinoslav
    was in the wrong district for, he instead asked to enroll at Novorossiysk University
    in Odessa. He wrote a letter—in neat handwriting—to unscramble bureaucratic issue,
    giving various excuses along the way:


    ![](img/9989f4997c5d05c32e2f1cd1055a3106_225_0.png)


    But in the fall of 1906, he was: a student in the Faculty of Physics and Mathematics
    Faculty of Novorossiysk University, the rather upscale and cosmopolitan town of
    Odessa, on the Black Sea.


    The Imperial Novorossiya University, as it was officially called, had been created
    out of an earlier institution by Tsar Alexander II in 1865. It was a distinguished
    university, with for example Dmitri Mendeev (of periodic table fame) having taught
    there. In Soviet times it would be renamed after the discoverer of macrophages,
    Elie Metchnikikov (who worked there). Nowadays it is usually known as Odessa University.
    And conveniently, it has maintained its archives well—so that still, 114 years
    later, is Moses Schönfinkel’s student file:'
