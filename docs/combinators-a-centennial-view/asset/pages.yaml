  md: 'But is there more systematic way to think about relations between combinator

    expressions? Combinators are in a sense fundamentally computational con-

    structs. But one can still try to connect them with traditional mathematics, and
    in

    particular with abstract algebra.


    And so, for example, it is common in the literature of combinators to talk about

    "combinatory algebra", and to write an expression like


    ```

    s[k][s[k][s[s][s][s][s][s][s][s][s][s][s][s][k][k][k][k][k][s][k]]

    ```


    as


    ```

    S·K·S·K(S·K·S·S·S·S·K)=K(S·K·K·S·S·S·S·K)

    ```


    where one imagines that (“application") is like an algebraic operator that

    "satisfies the relations"


    ```

    {S·x·y·z=x·z(y·z)}

    ```


    with "constants" S and K. To determine whether two combinator expressions are

    one equal one has then to see if there''s a sequence of "algebraic" transformations
    that

    go from one to the other. The setup is similar to what we''ve discussed

    above, but the "two-way" character of the rules allows one to directly use stan-

    dard logic theorem-proving methods (although because combinator

    evolution is confluent one never strictly to use reversed rules).


    So, for example, to prove s[k][s][k][k][k]=s[s][s][k][s][k] or


    ```

    S(KS)(KK)K=SSSKSK

    ```


    one applies a series of transformations based on the S and K "axioms" to parts
    of the

    left- and right to eventually reduce the original equation to a tautology:


    | s·s·k·s |s·k·k==s(s·k)s·k·k | s·x·y·z→x·z(y·z) |

    |---|---|---|

    | s·k(s·k)s·k==s(s·k)(k·k)k | | s·x·y·z→x·z(y·z) |

    | s·k(s·k)s·k)=ss·k·k·k·k | k·x·y→ x |

    | s·k·s·k·k·s)k)s·s·k·k·k | s·x·y·z→x·z(y·z) |

    | k·s·s(s·k·s·k)k==k | k·x·y→ x |

    | k·s·s(s·k·s·k)=skk k·x·y→ | |

    | | True |'
