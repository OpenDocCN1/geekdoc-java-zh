  md: 'And when one sees Schönfinkel''s S combinator: what could have come up with
    such a thing? Even Curry says he didn''t really understand the significance of
    the S combinator until the 1940s.


    I suppose if one''s just thinking of combinatory logic as a formal system with
    a certain general structure then it might not seem to matter that things as simple
    as S and K can be the ultimate building blocks. But the whole point of what Schönfinkel
    was trying to do (as the title of his paper says) was to find the “building blocks
    of logic”. And the fact that he was able to do it—especially in terms of things
    as simple as S and K—was a great and unique achievement. And not something that
    (despite all the good he did for combinators) Curry did.'
