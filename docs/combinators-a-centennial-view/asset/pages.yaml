- img_proc: true
  md: 'One feature of this proof is that because the combinator rules are confluent—so
    that different branches in the multiway system always merge—the proof never has
    to involve critical pair lemmas representing equivalences between branches in
    the multiway system, and so can consist purely of a sequence of “substitution
    lemmas”.


    There’s another tricky issue, though. And it has to do with taking “everyday”
    mathematical notions and connecting them with the precise symbolic structure that
    defines combinators and their evolution. As an example, let’s say you have combinators
    a and b. It might seem obvious that if a is to be considered equal to b, then
    it must follow that a[x]=b[x] for all x.


    But actually this true is telling us something about what we mean by “equal”,
    and to specify this precisely we have to add the statement as a new axiom.


    In our basic setup for proving anything to do with equality (or, for that matter,
    any equivalence relation), we’re already assuming the basic features of equivalence
    relations (reflexivity, symmetry, transitivity):


    ```

    x = x

    x = y⇒ y = x

    (x = y)∧(y = z)⇒ x = z

    ```


    In order to allow us to maintain equality while doing substitutions we also need
    the axiom:


    ```

    (x = y)∧(z = u)⇒ x·z = y·u

    ```


    And now to specify that combinator expressions that are considered equal also
    “do the same thing” when applied to equal expressions, we need the “extensionality”
    axiom:


    ```

    x ⇒ y·x·z = y·z

    ```


    The previous axioms all work in pure “equational logic”. But when we add the extensionality
    axiom we have to explicitly use full first-order logic—with the result that we
    get more complicated proofs, though the same basic methods apply.'
