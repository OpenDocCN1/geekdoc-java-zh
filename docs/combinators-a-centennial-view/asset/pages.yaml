  md: '# # Combinators Arrive


    We don''t know how long it took Moses Schönfinkel to come up with combinators.
    From what we know of his personal history, it could have been as long as a decade.
    But it could also have been as short as a few weeks.


    There''s no advanced math or advanced logic involved in defining combinators.
    But to drill through the layers of technical detail of mathematical logic to realize
    that it''s even conceivable that everything can be defined in terms of this is
    a supreme achievement of a kind of abstract reductionism.


    There is much we don''t know about Schönfinkel as a person. The 11-page paper
    he wrote on the basis of his December 7, 1920, in which he introduced combinators
    is extremely cryptic.


    The paper is entitled “On the Building Blocks of Mathematical Logic” (in the original
    German


    His first step is to explain Hilbert, Whitehead, Russell and Frege set all mathematical
    logic in terms of standard And, Or, Not, etc.—combinates—that Sheffer had been
    able to show that a single connective (indicated by a stroke ”)—and what we would
    now call NAND was sufficient:


    ```

    a und b sind etwas falsch; die mit einem Zeichen in den

    beiden äquivalenten Formen


    aVb und a&b

    ngeschrieben werden kann, und als zugehörigen neues Zeichen

    a|b;

    ist ist offensichtlich


    a=a_a a_a, aVb=(a|a)|(bb,

    womit wegen

    a&b~aVb, (a->b)~(a->b)&(b->a)

    ```


    But to the content ” of these relations, I think Schönfinkel was trying to communicate
    by example something else: that these logical connectives can ultimately be thought
    of as examples of “abstract symbolic structures” with a certain “function of arguments”
    (i.e. f[x,y]) form.


    The next couple of paragraphs talks about how the quantifiers “for all” (∀) and
    “there exists” (∃) can also be simplified in terms of the Sheffer stroke (i.e.
    NAND).'
