  md: '# # Historical & Other Notes


    I''m writing elsewhere about the origin of combinators, and about their interaction
    with the history

    of computation. But here let me make some remarks to this piece.


    Combinators were invented in 1920 by Moses Schönfinkel (hence the centenary),
    and since the

    late 1920s there''s been continuous academic work on—notably over more than half
    a

    century by Haskell Curry.


    A classic summary of combinator from a mathematical point of view is both: Haskell
    Curry\sand Robert Feys, Combinatory Logic (1998). More recent treatments (also
    of lambda calculus)

    include: H. B. Barendreg, The Lambda Calculus (1981) and J. Rogers Hindley and
    Jonathan P. Seldin, Lambda-Calculus and Combinators (1986).


    In combinator literature, what I call "combinator expressions" are often called
    "terms" (as in

    riting systems). The part of the expression that gets rewritten is often called
    the

    redux; the parts that get over are called the "residuals". The fixed point to
    which

    a combinator evolves is often called its "normal form", and expressions that reach

    fixed points are called "marking".


    Forms like alb[c] that I immediately apply to are basically lambda expressions,

    written in Wolfram using Function. The procedure of "compiling" from lambda expres-

    to combinators is sometimes called abstraction. It is demonstrated by examples
    at the end

    of this piece, there are many methods for doing this.


    The scheme for arithmetic with combinators at the beginning of this piece is based
    on

    Alonzo Curry in the 1930s, and so-called "Church numerals". The idea of encoding
    logic

    by combinators was discovered by Schönfinkel in his original paper, though the
    specific minimal

    encoding I was found by exponential computational search in just the past few
    weeks.

    Note that if one uses s[k] for true and k for false (as in rule 110 cellular automaton
    encoding)

    minimal forms for the Boolean operations are:


    | 0 | True | K(K) |

    |---|---||

    | 1 | Nand | s[k]s[k]s[k][k[k]][k[k]]] | S/S(S/S(S/S(K/K)))S |

    | 2 | Implies | s[k]s[k]s[k]s[k] | SS(K/K) |

    | 3 | Not | s[k]s[k]s[k]s[k]s[k] | SS(S(S/S(S(S)))K |

    | 4 | | s[k]s[k]s[k]s[k][k[k]] | K(K/S(S/S(K/K)))K |

    | 5 | Not | s[k]s[k]s[k]s[k][k[k]] | K(K/S(S/S(K/K)))S) |

    | 6 | Equal | s[k]s[k]s[k]s[k][k[k]] | SS(K/S(S/S(K/K)))S) |

    | 7 | Nor | s[k]s[k]s[k]s[k][k[k]][k[k]]] | S/S(S/S(S/S(K/K)))K |

    | 8 | Or | s[k]s[k]s[k]s[k][k[k]] | S(S(S/S(K)) |

    | 9 | Xor | s[k]s[k]s[k]s[k][k[k]][k[k]]] | S(S(S/S(S(S/S)))K |

    | 10 | Last | s[k]s[k]s[k]s[k][k[k]] | SK |

    | 11 | | s[k]s[k] | S/S(S/K) |

    | 12 | First | k[k]s[k] | KKS |

    | 13 | | s[k]s[k]s[k]s[k]s[k]] | K(S(S(S(S)))K |

    | 14 | And | s[k]] | SSK |

    | 15 | False | k[k]s[k]] | K(K(SK))'
