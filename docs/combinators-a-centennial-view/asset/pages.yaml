    If one hasn''t seen before, this kind of complexity would be quite shocking. After
    spending so long exploring the computational universe, I have become used to it.
    And now I view each new case I see as yet more evidence for my Principle of Computational
    Equivalence.


    A central fact about s, combinators is that they''re universal. And this tells
    us that whatever computation we want to do, it''ll always be possible to "write
    a combinator program"—i.e. to create a combinator expression—that''ll do it. And
    from this it follows—just like the halting problem for Turing machines—the problem
    of whether a combinator will halt in general undecidable.'
