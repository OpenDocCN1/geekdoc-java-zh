  md: '# Combinators All the Way Down?


    What is the universe fundamentally made of? For a long time the assumption that
    it must be described by something fundamentally mathematical. And indeed right
    around the time combinators were being invented the two great theories of general
    relativity and quantum mechanics were just developing. And in fact it seemed as
    if physics and mathematics were going so well that people like David Hilbert imagined
    that both might be completely solved—and that there might be a mathematics-like
    axiomatic basis for physics that could be "mechanically explored" as he imagined
    mathematics could be.


    But it didn''t work out that. Gödel''s theorem appeared to shatter the idea of
    a "complete mechanical exploration" of mathematics. And while there was immense
    technical progress in working out the consequences of general relativity and quantum
    mechanics was little discovered about what might lie underneath. Combinators (including
    things like Mathematica) were certainly useful in exploring the existing theories
    of physics. But physics didn''t show any particular signs of being "fundamentally
    computational," and indeed the existing theories seemed structurally not terribly
    compatible with computational processes.


    But as I explored the combinatorial universe and saw what rich and complex behavior
    could arise from very simple rules, I began to wonder whether, far below the level
    of physics, the universe might be fundamentally computational. I began to make
    specific models in which space and time were formed from an evolving network of
    discrete points. And I realized that some of the ideas that had arisen in the
    study of things like combinators and lambda calculus from the 1930s and 1940s
    had direct relevance.


    Like combinators (or lambda calculus) my models have the feature that they allowed
    many possible paths of evolution. And like combinators (or lambda calculus) at
    least some of my models had the remarkable feature that in some sense it didn''t
    matter path one took; the final result would always be the same. For combinators
    this "Church-Rosser" or "confluence" feature was what allowed one to have a definite
    fixed point that could be considered the result of a computation. In my models
    of the universe that doesn''t stop—things are a bit more subtle—but the generalization
    to what I call invariance is precisely what leads to relativistic invariance and
    the validity of general relativity.'
