    What did Gödel mean? For the foundations of mathematics it meant that "all true
    statements of mathematics" wasn''t going to work. It showed that there was at
    least one statement by his admission couldn''t be proved, but was still a "statement
    about arithmetic", in the sense that it could be "compiled" into arithmetic.


    That a big deal for the foundations of mathematics. Actually there was something
    much more significant than Gödel''s theorem, even though it wasn''t recognized
    at the time. Gödel had used the primitives of number theory and logic to build
    what was a computational system—in which one could take things like "statement
    is unprovable", and "run them in arithmetic".


    What Gödel had, though, was not exactly a streamlined general system (after all,
    it only needed to handle one case). But the immediate then was there a problem
    with this statement in arithmetic, what about Hilbert''s general "decision problem"
    (Entscheidungsproblem) for any axiom system?


