    then in 1925 got a professorship in applied math–though having been an active
    member of the Nazi Party since 1937, lost this professorship in 1945 and became
    a librarian. He died in 1970.


    (By the way, even in 1920 "PM" [Principia Mathematica] was hot—and Behmann was
    promoting it—Schönfinkel had in my opinion was the good taste to not explicitly
    mention it in his paper, referring only to Hilbert’s messy-muddy ideas about the
    formalization of mathematics.)


    OK, so as Boskowitz, credited in the footnote having discovered the classic combinatorial
    result = SK7? That Alfred Boskowitz, in 1920 a 23-year-old Jewish student at Göttingen,
    who came from Budapest, Hungary, and worked with Paul Bernays on set theory. Boskowitz
    is notable for having contributed more corrections (nearly 200) to Principia Mathematica
    than anyone else, and being acknowledged (along with Behmann) in a footnote to
    Schönwinkel’s [sic] paper at the end of a list of 14 “other contributions to mathematical
    logic” since the first edition.) (This edition also (1925–27) second edition.)
    In the mid-1920s Boskowitz returned to Budapest. In 1936 he wrote to Behmann that
    anti-Jewish sentiment made him concerned for his safety. There''s one more known
    communication from him in 1942, no further trace.


    The third person mentioned in Schönfinkel’s paper is Paul Bernays, who ended up
    living a long and productive life, mostly in Switzerland. But we’ll come to him
    later.


    So was Schönfinkel’s paper published? It was in a journal called Mathematische
