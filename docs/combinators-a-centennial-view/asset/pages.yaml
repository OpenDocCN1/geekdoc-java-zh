    k—which Schönfinkel referred respectively as "fusion" and "constancy”—and then
    the result of applying the function to an argument x would be given by f[x]//
    (Multiple arguments were handled by what became known as "currying") A very simple
    example of a combinator is id=s[k//], which identifies the identity function,
