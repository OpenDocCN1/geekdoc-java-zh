  md: "# # The “1927” Paper\n\nBesides his 1924 paper on combinators, there's only\
    \ one other piece of published output from Moses Schönfinkel: a paper coauthored\
    \ with Paul Bernays “On the Decision Problem of Mathematical Logic\":\n\nZum Entscheidungsproblem\
    \ der mathematischen Logik.\nVon\nPaul Bernays in Göttingen und Moses Schönfinkel\
    \ in München.\n\nI.\nEntscheidene Übersicht: Fragestellungen und bisherige Ergebnisse.\n\
    Das zentrale Problem der mathematischen Logik, welches auf der Frage nach der\
    \ Axiomatik von zunehmender Bedeutung steht, ist das Entscheidungsproblem. Dieses\
    \ lässt sich wie folgt formul:\nBetrachten wir verschiedene Formeln, welche logische\
    \ Funktionen, z. B. Prädikate und Relationen darstellen. Die Argumente dieser\
    \ Funktionen sind wiederum Variablen, welche Werte aus dem Satz annehmen. Indikatoren\
    \ sind solche, die für logische Funktionen als Term Konstante dienen. Den Variablen\
    \ lassen sich mit Hilfe der logischen Zeichen zusammen; es sind folgende Symbole:\n\
    \ ∧ Konjunktion;\n ∨ Disjunktion;\n\nIt's much more cited than Schönfinkel's 1924\
    \ combinator paper, but it's very lively and ultimately much less significant;\
    \ it's really about a technical point halfway through the paper it has a note:\n\
    \nForm der Axiomatik mit Instrumentkalkül.\nIn den folgenden mitgenden Überlegungen\
    \ sind von Hilbert über mathematische Logik angeregt und liegen schon mehrere\
    \ Jahre zurück. Die Durchführung des Entscheidungungsverfahrens\n\n> P. Bernays\
    \ und M. Schönfinkel.\nIm Falle einer eintretenden Funktion F(x, y) rückt von\
    \ Moses Schönfinkel, der zuerst das Problem in Begriff nimmt, von Bernays die\
    \ Ausdehnung der Methode auf mehrere logische Funktionen, wie die Abfassung des\
    \ vorliegenden Artik.\n\nThe following thoughts were inspired by Hilbert's works\
    \ on mathematical logic and date back several years. The decision procedure for\
    \ a single function F(x, y) was derived by M. Schönfinkel, who first tackled the\
    \ problem; P. Bernays extended the method to several logical functions, and also\
    \ wrote the current paper.\n\nThe paper was submitted on March 24, 1927. But in\
    \ the records of the German Mathematicians Association we find a listing of other\
    \ talk at the Göttingen Mathematical Society: December 6, 1921. P. Bernays and\
    \ M. Schönfinkel, “Das Entscheidungsproblem im Logikkalkül. So the paper had a\
    \ long gestation period,"
