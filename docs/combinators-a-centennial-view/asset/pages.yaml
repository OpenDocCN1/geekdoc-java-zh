  md: '# Designing Symbolic Language


    I think I first found about combinators around 1979 by seeing Schönfinkel''s original
    paper in a book Called Fromge to Gödel: A Source Book in Mathematical Logic (by
    a certain Jean van Heijenenoort). How Schönfinkel''s paper ended up being in that
    book is an interesting question, which I''ll write about elsewhere. The spine
    of my copy of the book has long been broken at the location of Schönfinkel''s
    paper, and at different times I''ve come to the paper, always thinking there was
    more to understand about it.


    But why was I ever studying things like back in 1979? I guess in retrospect can
    say I was engaged in an activity that goes back to Frege or even Leibniz: I was
    trying to find a fundamental framework for representing mathematics and beyond.
    But my goal was a philosophical one; it was a very practical one: I was trying
    to build a computer language that could do general computations in mathematics
    and beyond.


    My immediate applications were in physics, and it was from physics that my main
    methodological experience came. The result was—like trying to understand the world
    in terms of elementary particles—I wanted to understand computation in terms of
    its most fundamental elements. But I also had lots of practical experience in
    using computers to do mathematical computation. And I soon developed a theory
    about how I thought computation could fundamentally be done.


    It started from the practical issue of transformations on algebraic expressions
    (turn sin(2x) into sin(x)cos(x), etc.). But it became a general idea: compute
    by doing transformations on symbolic expressions. This was going to work? I wanted
    to understand as fundamentally as possible what computation was—and from that
    I was led to its history in mathematical logic. Much of what I saw in books and
    papers about mathematical logic I found austere and steeped in sometimes horrendous
    notational complexity. But what were these people really doing? It made it much
    easier that I had a define theory, against which I could essentially do reductionist
    science. That stuff in Principia Mathematica? Those ideas about rewriting systems?
    Yup, I could see how to represent them as rules for transformations on symbolic
    expressions.'
