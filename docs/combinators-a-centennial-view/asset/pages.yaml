  md: 'Let''s consider instead the recursive definition of Fibonacci numbers (to make
    this more obviously ''combinator like'' we could for example use Construct instead
    of Plus):


    ```

    f[1] = f[2] = 1; f[n] := f[n-1]+f[n-2]

    ```


    If you ask for f[7] you''re essentially going to be evaluating this tree:


    ![](img/9989f4997c5d05c32e2f1cd1055a3106_89_0.png)


    But the question is: how do you do it? The most obvious approach amounts to doing
    depth-first scan of the tree—and doing about φⁿ computations. But if you were
    to repeatedly use /, instead you would be doing more of a breadth-first scan,
    and it''d take more like O(n²) computations:


    ```

    FixedPointList[f, (f[1], 1 -> f2, f[n] -> f[n-1]+f[n-2]) &, f[7]]

    f[7], f[5], f[6], f[2]+f[4]; f[5], f[2]+f[3]+ 2 (f[2]+ f[3]) + f[4],

    2+f[1]+2 f[2]+2 (1+f[2]+f[3]), 11+f[2], 13

    ```


    But how can one parametrize these different kinds of behavior? From our modern
    perspective in the Wolfram Physics Project, its like picking different foliations—or
    different reference frames—in what amount to causal graphs that describe the dependence
    of one result on others. In relativity, there are some standard reference frames—like
    inertial frames parametrized by velocity. But in general it''s not easy to "describe
    reasonable reference frames", and we''re typically reduced to just talking about
    named metrics (Schwarzschild, Kerr, ...), much like here we''re talking about
    "named updated orders" ("leftmost inner-most", "outermostright", ...).'
