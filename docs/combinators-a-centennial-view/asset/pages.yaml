    x in f[x], or the ci in f[a][b][c]. The length of the list of indices gives the
    depth of the corresponding expression.


    We''ll tell in the next section how leftmost outermost—and other schemes—are defined
    in terms of indices. But here the thing to notice is that in our example Position
    gives us part [0] first; instead it gives us [0,0,1,0,1]:


    And what''s happening is that doing a depth-first traversal of the expression
    tree to look for matches, so it first descends all way down the left-hand tree
    branches—and since it finds a match, that''s what it returns. In the taxonomy
    we discuss in the next section, this corresponds to a leftmost-innermost scheme,
    though we''ll refer to it as “depth first”.


    Now consider the example of s[s][k[s]]. Here is what it does first with the leftmost-outermost
    strategy we''ve been using so far, and with the new strategy:


    | s | s | k | s | s |

    |---|---|---|---|---|

    | k | s | [k[s][s]] | | |

    | s[s][s] | k | s | | | |

    | s[s][s[s]] | | | | |

    | standard (leftmost outermost) | s[s][s] | depth-first (leftmost innermost) |


