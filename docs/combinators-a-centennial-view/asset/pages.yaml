  md: '# COMBINATORS: A Centennial View


    The uniqueness of the fixed point for combinators is a consequence of the Church-Rosser
    property for combinators from 1941. It is closely related to the causal invariance
    property that appears in our model of physics.


    There''s a steady stream of specific combinators defined for particular mathematical
    purposes. An example is the Y combinator s[k][k]s[s[k]s[s[k]]]]k]], which has
    the property that for any x, Y[x] can be proved to evaluate to xY[x], and “recurses
    forever”. Here''s how Y[x] grows if one just runs it with leftmost-outermost evaluation
    (and it produces expressions of the form [x, ..] at step n+ 7n):


    ![](img/9989f4997c5d05c32e2f1cd1055a3106_165_0.png)


    The Y combinator was notably used by Paul Graham in 2005 to name his Y Combinator
    startup accelerator. And perhaps channeling the aspirations of startups the "actual"
    Y combinator goes through many ups and downs (with leftmost-outermost evaluation)
    reaches size 1 billion "unicorn" after 494 steps—and after 1284 steps reaches-dollars-than-the-world
    size: 508,107,499,710,983.


    Empirical studies of the actual behavior of combinators “in the wild” have been
    quite sparse. The vast majority of academic work on combinators has been done
    by hand, and without the overall framework of A New Kind of Science the detailed
    behavior of combinators mostly seemed just like a curiosity.


    I did fairly extensive computational exploration of combinators (and in general
    what I called “symbolic systems” in the 1990s for A New Kind of Science. Page
    712 summarized some combinator behavior I found (with / . evaluation):'
