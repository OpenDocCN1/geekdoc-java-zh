    **Mathematische Gesellschaft in Göttingen.** Wintersemester 1920/21. 2. November
    1920. Berichtet. 9. November, Trigonometrische Reihen. Der Vortrag über ein elementaires
    Konstruktionsverfahren, das den trigonometrischen Reihen und Paaren konjugierter
    (d. Potenz) Reihen auf dem Rad des Konvergenzkises ergibt. Beispiele für singulären
    Reihen- und Divergenzgeschehen. Dies wurde zum zweiten Zweck zuerst zur Lust [Redic.
    Math. 32 (1911)], durch Steinhaus [C. R. Soc. Vers. 5 (1912), Bull. S. 63] sowie
    (auch für Reihen und Paaren konjugiert) durch den Referenten. [Göttingen 1914/19;
    16. November. Bernays-Hagen, Diskontinuitliche Lösungen der Variationsrechnung.
    22. November. Runge, Amerikanische Arbeiten von Sternhaus und die Mathematik.
