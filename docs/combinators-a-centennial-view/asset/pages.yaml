  md: '# What Is Their Mathematics?


    Combinators are hard to understand, and it''s not clear how many people understand
    them when they were first introduced—let alone understood their implications.
    It''s not a good sign when Schönfinkle''s paper was appeared in 1924 the person
    who helped prepare it for final publication (Heinrich Behmann) added his own three
    paragraphs at the end, which were quite confused. And Schönfinkle''s sole other
    published paper—coauthored with Paul Bernays in 1927—didn''t even mention combinators,
    even though they could have profitably been used to discuss the subject at hand
    (decision problems in mathematical logic).


    But in 1927 combinators (if not perhaps Schönfinkle''s recognition for them) had
    a remarkable piece of good fortune. Schönfinkle''s paper was discovered by a certain
    Haskell Curry—who would devote more than 50 years to studying what he named "combinators",
    and to spreading the word about them.


    At some level I one can view the main thrust of Curry and his disciples did with
    combinators as an effort to "mathematize" them. Schönfinkle had presented combinators
    in a rather straightforward "structural" way. But what was the mathematical interpretation
    of what he did, and of how combinators work in general? What mathematical formalism
    could capture Schönfinkle''s structural ideal of substitution? Just what, for
    example, the true notion of equality for combinators?


    In the end, combinators are fundamentally computational constructs, full of all
    the phenomena of "unbridled computation”—like undecidability and computational
    irreducibility. And it''s inevitable that mathematics as normally conceived can
    go so far in "cracking" them.


    But back in the 1920s and 1930s the concept and power of computation were not
    yet understood, and it was assumed that the ideas and tools of mathematics would
    be the ones to use in analyzing a formal system like combinators. And it wasn''t
    that mathematical methods got absolutely nowhere with combinators.


    Unlike cellular automata, or even Turing machines, there''s a certain immediate
    structural complexity to combinators, with their elaborate structures, equations
    and so on. And there was progress to be made—and years of work to be done—in untangling
    them, without having to face the raw features of full-scale computation, like
    computational irreducibility.


    In the end, combinators are full of computational irreducibility. But they also
    have layers of computational reducibility, some of which are aligned with the
    kinds of things mathematics and mathematical logic have set up to handle. And
    in this there''s a curious resonance with our recent Physics Project.'
