  md: 'Back to Schönfinkel''s paper. His next step is to explain that once functions
    can have other functions as arguments, functions only need to take a single argument.
    In modern (Wolfram Language) notation he says that you never need f(x,y); you
    can always do everything with f[x][y].


    In something of a slight of hand, he sets up his notation so that fxyz might look
    like a function of three arguments f{x,y,z} actually means (((fx)y)z) (i.e. f[x][y][z]).
    (In other words—somewhat confusing with respect to standard functional notation—he
    function application to be left associative.)


    Again, it''s a bizarre idea—although frankly Frege had a similar idea many earlier
    (or now the idea is called currying, after Haskell Curry, who we will be talking
    about). But with his "functional calculus" set, and all functions needing to take
    only one argument, Schönfinkel is ready for his bis.


    He''s effectively going to argue that by composing a small set of particular functions
    he can construct at least anything needed for predicate logic. They call them
    "sequence of particular functions of a very general nature". There are initially
    five of them: the identity function (Identitätsfunktion) I, the constancy function
    (Konstanzfunktion) C (which we now call K), the interchange function (Vertauschfunktion)
    T, the composition function (Zusammensetzungsfunktion) Z, and the fusion function
    (Verschmelzungsfunktion) S.


