  md: '# Gödel’s Theorem and Computability


    How should one represent the fundamental constructs of mathematics? Back in the
    1920s nobody thought seriously about using combinators. And instead there were
    basically “big brands”: *Principia Mathematica*, set theory and Hilbert’s program.
    Relations were being found, details were filled in, and issues were being found.
    But there was a general sense that progress was being made.


    Quite where the boundaries might lies unclear. For example, one could specify
    a way to “construct any function” from lower-level primitives? The basic idea
    of recursion was very old (think: Fibonacci). But by the early 1920s there was
    a fairly well-formalization of “primitive recursion” in which functions always
    found their values from earlier values. But could all “mathematical” functions
    be constructed this way?


    By 1926 it was known that this wouldn’t work: the Ackermann function was reason-mathematical”
    function, but it wasn’t primitive recursive. It meant that definitions had to
    be generalized (e.g. to “general recursive functions” that didn’t just look back
    at earlier values, but could “look forward until...”). But there didn’t seem to
    be any fundamental problem with the idea that mathematics could just “mechanistically”
    be built out from appropriate primitives.


    But in 1931 Gödel’s theorem. There’d been a long tradition of identifying paradoxes
    and inconsistencies, and finding ways to patch them by changing axioms. Gödel’s
    theorem was based on Peano’s by-then-standard axioms for arithmetic (branded by
    Gödel as a fragment of *Principia Mathematica*). And it showed was a fundamental
    problem.


    In essence, Gödel took the paradoxical statement “this statement is unprovable”
    and showed that it could be expressed purely as a statement of arithmetic—roughly
    a statement about the existence of solutions to appropriate integer equations.
    And basically what Gödel had to do to achieve this was to create a “compiler”
    capable of compiling things like “this statement is unprovable” into arithmetic.


    In his paper one can basically see him building up different capabilities (e.g.
    representing arithmetic expressions as numbers through Gödel numbering, checking
    conditions using general recursion, etc.)—eventually getting to a “high enough
    level” to represent the statement wanted:'
