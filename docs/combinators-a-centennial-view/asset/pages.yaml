    De Gruyter, 31–42. library.oapen.org/bitstream/id/1eb35764-bbdd-444c-b2ad-1398a16372ff/105450.


    C. Bozhahin (2013), “Syntactizing the Combinators”, in Combinatory Linguistics,
    De Gruyter, 43–60. library.oapen.org/bitstream/id/1eb35764-bbdd-444c-b2ad-1398a16372ff/105450.


    C. Bozhahin (2013), Combinatory Linguistics, De Gruyter, doi: 10.1515/9783110296877.


    M. Steaiman (2018), “The Last Combinator”, Computational Linguistics 44, 613–620.
    doi: 10.1162/coli_a_00328.


    S. T. Piantasi (2021), “The Combinatorial Origin of Representation”, Minds and
    Machines 31, 1–58. doi: 10.1007/s11023-020-09540-9.


    # Confusing Issues


    The term “combinatory analysis” has nothing to do with “combinators”; it''s an
    earlier name for “combinatorics”, used for example in:


    P. A. MacArthur (1915), Combinatory Analysis, The University Press (Cambridge).


    “Combinatory” is also used in the sense of combinators:


    E. Post (1936), “Finite Combinatory Processes–Formulation 1”, The Journal of Symbolic
    Logic 1, 103–105. doi: 10.2307/2269031.


    “Combinator” is sometimes used as a fairly general term for a function or operation
    that combines combinatory operations, as in:


    R. Milner (1982), “Four Combinators for Concurrency”, in Proceedings of the First
    ACM SIGACT-SIGOPS Symposium on Principles of Distributed Computing, Symposium
    on Principles of Distributed Computing, Association for Machine Learning, 104–110.
    doi: 10.1145/800220.806687.


    L. Cardelli and R. Davies (1999), “Service Combinators for Web Computing”, in
    Transactions on Software Engineering, IEEE, 309–316. doi: 10.1109/32.798321.'
