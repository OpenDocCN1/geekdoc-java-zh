    Elemente der Logik. 14. Dezember. Bernays, Pozzold, Wahrscheinlichkeit und Kausalität.
    10. und 11. Januar 1921. Relativitätstheorie. Noether, E. Noether. Hier wurde
    die Idealtheorie im Bereich aller Zahlen eine eindeutige Zerlegung des Systems
    der Elementteile entwickelt und aus einigen irrationalen Bestandteile abgeleitet.
    [Escheint demnach in einer Arbeit über Idealtheorie in Ringbereichen (Math. Ann.
    Annalals) am Beispiel der arithmetischen Theorie. 1. Januar. L. Courant und Bernays,
    Über die neuen arithmetischen Theorien von Weyl und Brouwer. 21. und 22. Februar.
    Hilbert, eine Grundlegung des Zahlbegriffes.


    There''s quite a line. November Ludwig Neder (student of Caratheodory): “Trigonometric
    Series”. November 16, Erich Bessel-Hagen (student of Discontinuous Solutions of
    Variational Problems). November 23, Carl Runge (Runge-Kutta professor): “American
    Work on Star Clusters in the Milky Way”. November 30 Gottfried Rie (assistant
    of van Waals). And then: December 7; Moses Schönfinkel, “Elements of Logic”.


    The next week, December 14, Paul Bernays, who worked with Hilbert and interacted
    with Schönfinkel, spoke about “Probability, the Arrow of Time and Causality” (there,
    was such a lot of interest around Hilbert in the foundations of physics). January
