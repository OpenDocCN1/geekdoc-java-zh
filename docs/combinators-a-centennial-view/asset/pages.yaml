  md: 'But then comes the rallying cry: “The successes that we have encountered thus
    far—encourage us to attempt further progress.” And then he’s ready for the big
    idea—which he explains “at first glance certainly appears extremely bold. He proposes
    to “eliminate” by suitable reduction the remaining fundamental concepts of proposition,
    function and variable”.


    He explains that this only makes sense for “arbitrary, logically general propositions”,
    or, as we say now, for purely symbolic constructs without specific meanings assigned
    set. In other words, his goal is to create a general framework for operating on
    arbitrary symbolic expressions independent of their interpretation.


    He explains that this is valuable from a “methodological point of view” in achieving
    “the greatest possible conceptual uniformity”, but also from a certain philosophical
    or perhaps aesthetic point of view.


    And in a sense what he was explaining—back in 1920—was something that’s been a
    core part of the computational language design that I’ve done for the past 40
    years: that everything can be represented as a symbolic expression, and that there’s
    tremendous value to this kind of uniformity.


    But as a “language designer” Schönfinkel was an ultimate minimalist. He wanted
    to get rid of as many notions as possible—and in particular he didn’t want variables,
    which he explained were “nothing but tokens that characterize certain argument
    places and operators as belonging together”; “mere auxiliary notions”.


    We today have all sorts of mathematical notation that’s at least somewhat “variable
    free” (think coordinate-free notation, category theory, etc.) But in 1920 mathematics
    it was written full of variables. And it needed a serious idea to see how to get
    rid of them. And where’s Schönfinkel starts to go “even more symbolic.


    He explains that he’s going to make a kind of “functional calculus” (Funktionalkül).
    He says that normally functions just define a certain correspondence between the
    domain of their arguments, and the domain of their values. But he’s going to generalize—and
    allow (“disembodied”) functions to appear as arguments and values of functions.
    In other words, he’s inventing what we now now call higher-order functions, where
    functions can operate “symbolically” on other functions.


    In the context of traditional calculus-algebra-style mathematics it’s a bizarre
    idea. But really it’s an idea about computation and computational structures—that’s
    more abstract and much more general than the mathematical objectives that inspired
    it.'
