    # Computing with Combinators


    Let''s say we use combinators to do a computation on something. The first question
    is: how should we represent the "something" Well, the obvious answer is: just
    structures built out of combinators!


    For example, let''s say we want to represent integers. Here''s an (at first bizarre-seeming)
    way to do that. Take s[k] and repeatedly apply s[k[s[k]][k]]. Then we''ll get
    a sequence of combinators:


    ```

    s[k]

    s[s[k[s[k]][s[k]]]

    s[s[k[s[k]][k]][s[k[s[k]][k]][s[k]]]

    s[s[k[s[k]][k]][s[k[s[k]][k]][s[k[s[k]][k]][s[k]]]

    s[s[k[s[k]][k]][s[k[s[k]][k]][s[k[s[k]][k]][s[k[s[k]][k]]]][k[s[s[k]][k]][s[k]]]

    ```


    On this were, anyway are inserted under the s and k rules. But take each one (say
    e) and first see Here''s what happens for the third case when you apply the s
    and k rules:


    ```

    s[k[s[k[s[s[k[s[k[s[k[s[k]]]]]]]

    s[k[s[k[s[s[k[s[k[s[k[s[s[k]]]]]]]]]

    s[k[k[s[s[k[s[k]]]]k]][k[s[k]][s[k]]]]]]

    s[s[k[s[s[k[s[k]]]]k]][k[s[k]]]]s[k][k[k]]]

    s[s[k[s[s[k[s[k]]]]k]][k[s[k]]]]s[k][k[k]]]

    s[s[k[s[s[k[s[k]]]]k]][k[s[k]]]]s[k][k[k]]]

    s[s[k[s[s[k[s[k]]]]k]][k[s[k]]]]s[k][k[k]]]]

    ```


    To get this in the Wolfram Language, we can use Nest, which nested applies functions:


    ```

    Input-In: Nest(f, x, 4)

    Output-je: f[f[f[x]]]

    ```


    The final result is based on as:


    ```

    Input-In: Nest[s[k[s[k]][k]], s[k], 2][s[k] n. (s_x_ll_j->s(x_ll_j), k_x_ll_j->x)

    Output-je: s[k]]

    ```


