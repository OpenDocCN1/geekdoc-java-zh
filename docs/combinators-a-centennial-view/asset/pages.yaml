  md: '# One More Thing


    In addition to pursuing the question of the fate of Moses Schönfinkel, I''ve made
    one other potential connection. Partly in compiling a bibliography of combinators,
    I discovered a whole collection of literature about “combinatory categorical grammars”
    and “combinatory linguistics”.


    What are these? Days, the most common way to parse an English sentence like “I
    am trying to track down a piece of history” is a hierarchical tree structure—analogous
    to the way a context-free computer language would be parsed:


    ![](img/9989f4997c5d05c32e2f1cd1055a3106_292_0.png)


    There is an alternative–and, as it turns out, significantly older–approach: to
    use a so-called dependency grammar in which verbs act like functions, “depending”
    on a collection of arguments:


    ![](img/9989f4997c5d05c32e2f1cd1055a3106_292_1.png)


    In something like Wolfram Language, the arguments in a function would appear in
    some definite order and structure, as if $f[x, y, z]$. But in a natural language
    like English, everything is just given in sequence, and a function somehow has
    to have a way to figure out what to grab. The idea is that this process might
    work like combinators written out in sequence “grab” certain elements to act on.'
  merge: -1
  pgno: 292
- img_proc: true
  md: 'This idea seems to have a fairly tortuous history, mixed up with attempts and
    confusions about connecting the syntax (i.e. grammatical structure) of human languages
    to their semantics (i.e. meaning). The core issue is that it''s perfectly possible
    to have a syntactically correct sentence (“The flying chair ate a happy semicolon”)
    that doesn''t seem to have any “real-world” meaning. How should one think about
    this?


    I think the concept of computational language that I''ve spent so years developing
    actually makes it fairly clear. If one can express something in computational
    language there''s a way to compute from it. Maybe the resulting computation will
    align with what happens in the real world; maybe it won''t. But there''s “meaningful
    place to go” with what one has. And the point is that a computational language
    has a well-defined “inner computational representation” for things. The particular
    syntax (e.g. sequence of characters) that one might use for input or output in
    the computational language is something superficial.


    But without the idea of computational language people have struggled to finalize
    semantics, tending to try to hang what they''re doing on the detailed structure
    and syntax of human languages. But then what should one do about syntactically
    correct structures that don''t “mean anything?” An example of what I consider
    be a rather bizarre solution—embodied in so-called Montague grammars from the
    1970s—is essentially to turn pieces of certain sentences into functions, in which
    there''s nothing “concrete” just, “slots” where things could go (“x ate”—and where
    one can “hold off meaninglessness” by studying things without explicitly filling
    in the slots.


    In the original formulation, the “functions” were thought about in terms of lambdas.
    But combinatory categorical grammars view them instead of combinators, in which
    the course of a words in a sentence “apply to each other”. And even with the notion
    of slots one can do “combinatory linguistics” and imagine finding the structure
    of sentences by taking words to “apply themselves”“across the sentence” like combinators.


    If well designed (as I hope the Wolfram language is!) computational language has
    a clean, formal structure. But human natural language is full of messiness, which
    has to be untangled by natural language understanding—as we''ve done for so many
    years for Wolfram|Alpha, always ultimately translating to our computational language,
    the Wolfram Language.'
