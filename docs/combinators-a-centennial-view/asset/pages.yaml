  md: 'Basically we have to be able to tell if there are sequences of transformations
    under the combinator rules that cause the expressions to wind up syntactically
    the same. We can think of these sequences of transformations as being like possible
    paths of evolution. So in effect what we are asking is whether there are paths
    of evolution for different combinators that intersect.


    But how can we characterize what paths of evolution might exist for all possible
    evaluation schemes? Well, that’s what the multiway graph does. And in terms of
    multiway graphs there are a concrete way to ask about equality (or, really, equivalence)
    between combinator expressions. We basically just to ask whether there is some
    appropriate path between the expressions in the multiway graph.


    There are lots of details, some of which we’ll discuss later. But what we are
    basically dealing with is a quintessential example of the theorem proving in a
    formal system. There are different ways to set things up. But as one example,
    we could take our system to define certain axioms that transform expressions.
    Applying these axioms in all possible ways generates a multiway graph with expressions
    as nodes. But then the statement that there’s a theorem A is equal to expression
    B (in the sense that it can be transformed to it) becomes the statement that there’s
    a way to get from A to B in the graph—and giving a path can then be thought of
    as giving a proof of the theorem.


    As an example, consider the combinator expressions:


    ```

    s[|][s][|][s][|][k][|][k][|][k][|][s][|][s][|][k][|][k]]

    s[|][k][|][k][|][s][|][s][|][k][|][k][|][s][|][s][|][k][k]]

    ```


    Constructing a multiway graph one then find a path


    ![](img/9989f4997c5d05c32e2f1cd1055a3106_132_0.png)'
