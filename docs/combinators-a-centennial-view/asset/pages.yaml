    # Problems Are Brewing


    There''s a lot that is still mysterious about Moses Schönfinkel''s time in Göttingen.

    But we have one (undated) letter written by Nathan Schönfinkel, Moses''s brother,
    presumably in 1921 or 1922 (when he renamed his name as "Scheinfinkel" rather
    than "Schönfinkel":


    ![](img/9989f4997c5d05c32e2f1cd1055a3106_237_0.png)


    Göttingen University, Cod. Ms. D. Hilbert 455: 9


    Dear Professor,


