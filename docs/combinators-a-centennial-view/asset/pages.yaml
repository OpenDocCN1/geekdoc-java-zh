  md: 'OK, there''s one more combinator do—and it''s their most famous: they allow
    one to set things up so that one never needs to define variables or name things.
    In typical programming one might write things like:


    ```

    With(x = 3, 1+x^2)

    f[x] := 1+x^2

    Function(x, 1+x^2)

    x := 1+x^2

    ```


    But in none of these cases does it matter what the actual name x is. The x is
    just a placeholder that''s standing for something''s “passing around” in one''s
    code.


    But why can''t we just “do the plumbing” of specifying how something should be
    passed around, without explicitly naming anything? In a sense nested sequence
    of functions like f[g[x]] is a simple case of this; we''re not giving a name to
    the result of g[x]; we''re feeding it as input to f in a “single pipe”. And by
    setting up something like Function[x, 1+x^2] we''re constructing a function that
    doesn''t have a name, which we can still apply to things:


    ```

    In: Function[x, 1+x^2][4]

    Out: 17

    ```


    The Wolfram Language gives us an easy way to get rid of the x here too:


    ```

    In: (1^^2) &[4]

    Out: 17

    ```


    In a sense the # "slot" acts as a pronoun in a natural language: we''re saying
    that whatever we''re dealing with (we''re not going to name), we want to find
    “one the square of it”.


    OK, but what about the general case? Well, that''s what combinators provide a
    way to do.


    Consider an expression like:


    ```

    f[g[It][y]]

    ```


    Imagine this was called q, and we wanted q[x][y] to give f[g[x][y]][y]. Is there
    a way to define q without ever mentioning names of variables? Here''s how to do
    it with s, k: combinators:


    ```

    s[s[k[s[s[k[f[x]]]]]][g]]]]k[s[k[k]]]]

    ```'
