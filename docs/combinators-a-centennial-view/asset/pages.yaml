  md: '# Combinators in Culture


    100 years combinators have mostly been an obscure academic topic, studied particularly
    in connection with lambda calculus, at borders between theoretical computer science,
    mathematical logic and to some extent mathematical formalisms like category theory.
    Much of the work that has been done can be traced in one way or another to the
    influence of Haskell Curry or Alonzo Church—particularly through their students,
    grandchildren, great-grandchildren, etc. Partly in the early years, most of the
    work was centered in the US, but by the 1960s there was a strong migration to
    Europe and especially the Netherlands.


    But with even its abstractness and obscurity, on a few occasions combinators have
    broken into something closer to the mainstream. One such time was with the popular
    logic-puzzle book To Mock a Mockbird, published in 1985 by Raymond Mullyman—a
    former student of Alonzo Church’s. It begins: “A certain enchanted forest is inhabited
    by talking birds and goes on to tell a story that’s basically about combinators
    “dressed up” as birds calling each other (S is the “starling”), K the “kestrel”—with
    a convenient “bird who’s who” at the end. The book is dedicated to To the memory
    of Haskell Curry—an early pioneer in combinatory logic and an avid bird-watcher.


    ![](img/9989f4997c5d05c32e2f1cd1055a3106_199_0.png)'
