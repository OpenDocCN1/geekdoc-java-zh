  md: '# Combinators and the Story of Computation


    # The Abstract Representation of Things


    “In principle you could use combinators,” some footnote might say. But the implication
    tends to be “But you probably don’t want to.” And, combinators are deeply abstract—and
    in many ways hard to understand. But tracing their history over the hundred years
    since they were invented, I’ve come to realize just how critical they’ve actually
    been to the development of our modern conception of computation—and indeed my
    contributions to it.


    The idea of representing things in a formal, symbolic way has a long history.
    In antiquity there was Aristotle’s logic and Euclid’s geometry. By the 1400s there
    was algebra, and in the 1840s Boolean algebra. Each of these was a formal system
    that allowed one make deductions purely within the system. But each, in a sense,
    ultimately viewed itself as being set up model something specific. Logic was for
    modeling the structure of arguments, Euclid’s geometry the properties of space,
    algebra the properties of numbers; Boolean aspired to model the “laws of thought”.


    But there were perhaps more general and fundamental infrastructure: some kind
    of abstract system that could ultimately model or represent anything? Today we
    understand that''s what computation is. And it’s becoming clear that the modern
    conception of computation is one of the single most powerful ideas in all of intellectual
    history—whose implications are only just beginning to unfold.


    But did we finally get to it? Combinators had an important role to play, woven
    into a complex tapestry of ideas stretching across more than a century.'
