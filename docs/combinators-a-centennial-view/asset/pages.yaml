  md: 'equivalent to Turing machines, lambda calculus and all those other systems
    we know are universal. But they were discovered before any of these systems.


    By the way, here''s the Wolfram Language way to get the result above (// repeatedly
    applies the rules until nothing changes anymore:


    ```

    bf-j: s[k[s[k][s[k][k][k][k][k][k][k][k][k][k][k][k][k][a][a][a][a]][a][a] //
    . s[x__y_] -> x[y][z]], k[x__y_] -> x]

    Cf-j: a[b][a][c]]

    ```


    And, yes, it''s no accident that it''s extremely easy and natural to work with
    combinators in the Wolfram Language—because in fact combinators were part of the
    deep ancestry of the core design of the Wolfram Language.


    For me, though, combinators also have another profound personal resonance. They''re
    examples of very simple computational systems that turn out (as we see at length
    here) to show the same remarkable complexity of behavior that I''ve spent so many
    years studying across the computational universe.


    A century ago—particularly without actual computers on which to do experiments—the
    conceptual framework that I developed for thinking about the computational universe
    didn''t exist. But I''ve always thought that of all systems, combinators were
    perhaps the earliest great "near miss" to what I''ve ended up discovering in the
    computational universe.'
