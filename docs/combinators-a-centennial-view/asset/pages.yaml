    A combinator is a function that has no free variables.


    The simplest combinator is the identity combinator.


    ```

    I x = x

    ```


    The next combinator is the constant combinator.


    ```

    K x y = x

    ```


    The third combinator is the substitution combinator.


    ```

    S x y z = (x z) (y z)

    ```


    These three combinators are sufficient to represent any computable function.


    We will now introduce some more combinators that are useful.


    ```

    B f g x = f (g x)

    ```


    ```

    C f y z = f z y

    ```


    ```

    M f x = y f

    ```


    ```

    U f x = x f

    ```


    ```

    W f x = x f

    ```


    ```

    T f x = f x

    ```


    ```

    E f x = f f

    ```


    ```

    Y f g = g f

    ```


    ```

    P f g = f g

    ```


    ```

    Omega f = f f f

    ```


    ```

    K f g = f

    ```


    ```

    S f g = f g

    ```


    These combinators are very useful for simplifying expressions in combinators.


    We will now show how these combinators can be used to represent program structures.


    In the next section, we will show how to use these combinators to implement programs.


