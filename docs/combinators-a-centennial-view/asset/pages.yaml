  md: '# The 1924 Paper


    Whatever was going on with Schönfinkel in Göttingen in 1924, we know one thing
    for sure: it was that he published his remarkable paper about what are now called
    combinators. Let''s talk in a bit more detail about the paper—though the technicalities
    I''m discussing in two part.


    First, there''s some timing. At the end of the paper, it was received by the journal
    on March 15, 1924, i.e. just three days before the date of Ludwig Gossmann''s
    reference for Schönfinkel. And then at the top of the paper, there''s something
    else: under Schönfinkel''s name it says “Moskau”, i.e. at least as far as the
    journal was concerned, Schönfinkel was in Moscow, Russia, and at the time the
    article was published:


    ![](img/9989f4997c5d05c32e2f1cd1055a3106_244_0.png)


    There''s also a footnote on the first page of the paper:


    > ¹ Die folgenden Gedanken wurden vom Verfasser am 7. Dez. 1920 vor der Mathematischen
    Gesellschaft in Göttingen vorgetragen. Ihre formale und stylistische Durcharbeit
    für diese Veröffentlichung wurde von H. Behmann in Göttingen übernommen.


    “The following thoughts were presented by the author to the Mathematical Society
    in Göttingen on December 7, 1920. Their formal and stylistic processing for this
    publication was done by H. Behmann in Göttingen.”


    The paper itself is written in a nice, clear and mathematically mature way. Its
    big combinators: (as I''ve discussed elsewhere) is the introduction of what would
    later be called abstract constructs from which arbitrary functions and computations
    can be built up. Schönfinkel names one of them S, after the German word “Schmelzen”
    for “fusion”. The other has become known as K, although Schönfinkel calls it C,
    even though the German word for “constancy” (which is what would naturally describe
    it) is “Konstantheit”, which starts with a K.


    The paper ends with three paragraphs, footnoted with “The considerations that
    follow are the editor’s (i.e. Behmann’s). They’re not as clear as the rest of
    the paper, and contain a confused mistake.'
