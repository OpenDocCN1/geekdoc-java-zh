- img_proc: true
  md: 'Absent anything else, this will just generate a tree of results. But the crucial
    idea behind multiway graphs is that when states are identical, they should be
    merged, in this case giving:


    ![](img/9989f4997c5d05c32e2f1cd1055a3106_117_0.png)


    For its is very obvious that "being identical" means. For hypergraphs, the natural
    definition is hypergraph isomorphism. What about for combinators? Is it pure tree
    isomorphism, or should one take into account the "provenance" of subtrees?


    (There are also questions like whether one should define the nodes in the multiway
    graph in terms of "instantaneous states" at all, or whether instead they should
    be based on "causal graphs so far", as obtained with particular event histories.)


    These are subtle issues, but it seems pretty clear that with appropriate definitions
    combinators will show causal invariance, so that (appropriately defined) causal
    graphs will be independent of evaluation scheme.


