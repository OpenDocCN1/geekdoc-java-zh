    We''ll talk more about Nathan Schönfinkel later. But suffice to say that here

    when he wrote the letter he was a physiology student at the University of

    Bern—and he would get his PhD in 1922, and later became a professor. But the

    letter he wrote is probably our best single surviving source of information about

    t situation and personality of Moses Schönfinkel. Obviously he was a serious

    math enthusiast from a young age. And the letter implies he''d wanted to work

    with Hilbert for some time (presumably the German classes in college).


    It also implies that he was financially supported in Göttingen by his parents—

    until it was disrupted by World War I. (And we learn that his parents were OK

    in the Russian Revolution.) (By the way, the bray mentioned is probably a cer-

    tann Siegfried Behrens, who left Göttingen in 1922.)


    There''s no record of any reply to Nathan Schönfinkel''s letter from Hilbert.
    But at

    least by the time of Hilbert''s 60th birthday in 1922 Moses Schönfinkel was (as

    aw above) enough in the inner circle to be invited to the birthday party.


    What else is there in the university archives in Göttingen about Moses Schön-

    kinkel? There''s only one document, but it''s very telling:


    ![](img/9989f4997c5d05c32e2f1cd1055a3106_238_0.png)'
