  md: '# Lemmas and the Structure of Combinator Space


    One feature of the proofs we''ve seen above is that each intermediate lemma just
    direct use of one or other of the axioms. In general, lemmas can use lemmas, and
    one can "recursively" build up a proof much more efficiently than just by always
    directly the axioms.


    But which lemmas are best to use? If one''s doing ordinary human mathematics—and
    trying to make proofs intended for human consumption—one typically wants to use
    "famous lemmas" that help create a human-relatable narrative. But realistically
    there isn''t likely to be a "human-relatable narrative" for most combinator equivalence
    theorems (or, at least there won''t be until or unless thinking in terms of combinators
    becomes commonplace).


    So there''s a more "mechanical" criterion: what do best at reducing the lengths
    of as many proofs as possible? There is some trickiness associated with translations
    between proofs of equalities and proofs that one expression can evolve into another.
    Roughly the question boils down to this. When we construct a multiway graph of
    combinator evolution, each event—and thus each edge—is just the application of
    a single combinator "axiom".


    But if we instead do transformations based on more sophisticated lemmas we can
    potentially get from one expression to another in fewer steps. In other words,
    if we "cache" certain combinator transformations, can we make finding paths in
    combinator multiway graphs systematically more efficient?


    To find all possible "combinator theorems" from a multiway system, we should start
    from all possible combinator expressions, then trace all paths to other expressions.
    It''s a little like what we did in the previous section—except now we want to
    consider multiway evolution with all possible evaluation orders.'
