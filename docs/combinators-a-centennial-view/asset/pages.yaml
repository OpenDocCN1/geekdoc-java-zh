  md: 'It was one thing to try to represent the content of mathematics, but there
    was also the question of representing the infrastructure and processes of mathematics.
    Let''s say we picks some axioms. How can one know if they''re consistent? What''s
    involved in proving everything one can prove from them?


    In the 1890s David Hilbert began to develop ideas about this, particularly in
    the context of tightening the formalism of Euclid''s geometry and his axioms.
    And after Principia Mathematica, Hilbert turned more seriously to the use of logic-based
    ideas to develop "metamathematics"—notably leading to the formulation of things
    like the "decision problem" (Entscheidungsproblem) of asking whether, given an
    axiom system, there'' a definite procedure to prove or disprove any statement
    with respect to it.


    But connections between logic and mathematics were of great interest to people
    concerned with the philosophy of mathematics, a more obviously mathematical development
    was universal algebra—in which axioms for different areas of mathematics were
    specified by giving appropriate algebraic-like relations. (As it happens, universal
    algebra was launched under that name by the 1898 book A Treatise on Universal
    Algebra by Alfred Whitehead, later of Principia Mathematica.)


    But there was one area where ideas about algebra and logic intersected: the tightening
    of Boolean algebra, and in particular the finding of simpler foundations for it.
    Logic had pretty much always been formulated in terms of AND, OR and NOT. In 1912
    Henry Sheffer—attempting to simplify Principia Mathematica—showed that NAND (or
    NOR) were sufficient. (It turned out that Charles Peirce had already noted the
    same thing in the 1880s.)


    So established that the notation of logic could be made basically simple as one
    could imagine. But what about its actual structure, and axioms? Sheffer talked
    needing five "algebra-style" axioms. But by going axioms based on logical inferences
    Jean Nicod managed in 1917 to get down to one axiom. (And, as it happens, I finally
    finished the job in 2000 by finding the simplest "algebra-style" axioms for logic–the
    single axiom: ((p-q)-r).((p-(p-r))=r.)


    The big question in a sense was be "What is mathematics ultimately made of?".
    Well, now it know that ordinary propositional logic could be built up from very
    simple elements. So what about the other things used in mathematics–like functions
    and predicates? Was there a simple way of building these up too?'
