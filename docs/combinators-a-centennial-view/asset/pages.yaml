  md: '# Combinators in the Wild: Some Zoology


    So far we''ve been talking about combinators that are set up to compute specific
    things that we want to compute. But what if we just pick possible combinators
    “from the wild”, say at random? What will they do?


    In the past, that might not have seen a question that was worth asking. But I''ve
    spent decades studying the abstract computational universe of simple programs—and
    building a “new kind of science” around the discoveries I''ve made about how they
    behave. And with that conceptual framework it becomes very interesting to look
    at combinators “in the wild” and see how they behave.


    So let''s begin at the beginning. The simplest s, k combinator expressions that
    won''t remain unchanged under the combinator rules have are a total of 16 such
    expressions:


    ```

    s[s][s], s[s][k], s[k][s], s[k][k], s[k][s], k[k][s], s[k][k],

    sk[s][k]], k[s][s], k[s][k], k[k][s], k[k][k], k[k][s], k[k][k], k[[k][k]]

    ```


    And none of them anything interesting: they don''t change at all, or so in example
    k[s][s], they immediately give a single symbol (here s).


    But what about larger combinator expressions? The total number of possible combinator
    expressions of size n grows


    ```

    {2, 4, 16, 80, 448, 2688, 16896, 109824, 732160, 4978688}

    ```


    or in general


    ```

    2^n Binomial[n-2, n-1] = CatalanNumber[n-1]

    ```


    or asymptotically:


    ```

    8^n / sqrt(pi^n/2)

    ```


    At size 4, again nothing interesting happens. With all the 80 possible expressions,
    the longest it takes to reach a fixed point is 3 steps, and that happens in 4
    cases:


    ```

    s[k][s][s] s[k][s][k] s[k][k][s] s[k][k][k]

    k[s][s][s]] k[k][s][k] k[k][s][s] k[k][k][k]

    ```'
