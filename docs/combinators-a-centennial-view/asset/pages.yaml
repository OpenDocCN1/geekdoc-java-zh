  md: 'COMBINATORS: A Centennial View


    In A New Kind of Science I looked a bit at the behavior of combinators; here I''ve
    done more. But there''s still vastly more to explore in the combinator universe—and
    many surprises yet to uncover. Doing it will both advance the general science
    of the computational universe, and will it give us a new palette of phenomena
    and intuition with which to think about other computational systems.


    There are things to learn for physics. There are things to learn for language
    design. There are things to learn about the theoretical foundations of computer
    science. There may also be things to learn for models of concrete systems in the
    natural and artificial world—and for the construction of useful technology.


    As we look at different kinds of computational systems, several stand out for
    their minimalism. Particularly notable in the past have been cellular automata,
    Turing machines and string substitution systems. And now there are the systems
    from our Wolfram Physics Project—that seem destined to have all sorts of implications
    even far beyond physics. And there are also combinators.


    One can think of cellular automata, for example, as systems that are intrinsically
    organized in space and time. The systems from our Wolfram Physics Project are
    minimal systems that purely capture relations between things. And combinators
    are in a sense minimal systems that are intrinsically about programs—and whose
    fundamental structure and operation revolve around the symbolic representation
    of programs.


    What can be done with such things? How should we think about them?


    Despite the passage of a century—and a substantial body of academic work—we''re
    still just at the beginning of understanding what can be done with combinators.
    There''s a rich and fertile future ahead, as we begin the second combinator century,
    now equipped with the ideas of symbolic computational language, the phenomena
    of the computational universe, and the computational character of fundamental
    physics.


