  md: '# Göttingen, Center of the Mathematical Universe


    After Moses Schönfinkel graduated college in 1910 he went into four years of military
    service (perhaps as an engineer) in the Russian Imperial Army. World War I began
    on July 28, 1914—and Russia mobilized on July 30. But in one of his pieces of
    good luck Moses Schönfinkel was not called up, having arrived in Göttingen, Germany,
    on June 1, 1914 (four weeks before the event that would trigger World War I),
    to study mathematics.


    Göttingen was at the time a top place for mathematics. In fact, it was sufficiently
    much of a “math town” around that time postcards of local mathematicians were
    for sale there. And the biggest star was David Hilbert—which is who Schönfinkel
    went to Göttingen hoping to work with.


    ![](img/9989f4997c5d05c32e2f1cd1055a3106_231_0.png)


    Hilbert had grown up in Prussia and started his career in Königsberg. His big
    break came in 1888 at age 26 when he got a major result in representation theory
    (then called “invariant theory”)—using shocking non-constructive techniques. And
    it was soon after that Felix Klein recruited Hilbert to Göttingen—where he remained
    for the rest of his life.


    In 1900 Hilbert gave his famous address to the International Congress of Mathematicians
    where he first listed his (ultimately 23) problems that he thought should be important
    in the future of mathematics. Almost all the problems are what anyone would call
    “mathematical”. But problem 6 has always stuck out for me: “Mathematical Treatment
    of the Axioms of Physics”: Hilbert somehow wanted to axiomatize physics as Euclid
    had axiomatized geometry. And he didn’t talk about this; he spent nearly 20 years
    working on it. He brought in physicists to teach him, and he worked on things
    like'
  merge: -1
  pgno: 231
- img_proc: true
  md: 'gravitation theory (“Einstein-Hilbert action”) and kinetic theory—and wanted
    for example to derive the existence of the electron from something like Maxwell’s
    equations. (He was particularly interested in the weatomic limit to continua—a
    problem that I now believe is deeply connected to computational irreducibility,
    in effect implying another appearance of undecidability, like in Hilbert’s 1st,
    2nd and 10th problems.)


    Hilbert seemed to feel physics was a crucial source of raw material for mathematics.
    But yet he developed a whole program of research based on doing mathematics in
    a completely formal way—where one just writes down axioms and somehow “mechanically”
    generates all theorems from them. (He seems to have drawn some distinction between
    “merely mathematical” questions, and questions about physics, apparently noting—in
    a resonance with my life’s work—that in the latter case “the physicist has the
    great calculating machine, Nature.)


    In 1899 Hilbert had written down more precise and formal axioms for Euclid’s geometry,
    and he wanted to go on and figure out how to formulate other areas of mathematics
    in this kind of axiomatic way. But more than a decade he seems to have spent most
    of his time on physics—finally returning to questions about the foundations of
    mathematics around 1917, giving lectures about “logical calculus” in the winter
    season of 1920.


    By 1920, World War I had come and gone, with comparatively little effect on mathematical
    life in Göttingen (the nearest battle was in Belgium 200 miles to the west). Hilbert
    was 58 years old, and apparently lost quite a bit of his earlier energy (not least
    a result of having pernicious anemia [autoimmune vitamin B12 deficiency]), whose
    cure was found only a few years later. Hilbert was a celebrity around Göttingen,
    and generating mathematical excitement. Among “celebrity gossip” mentioned in
    a letter by young Russian topologist Urysohn is that Hilbert was a huge fan of
    the gramophone, and that even at his advanced age, in the summer, he would sit
    in a chair to study.)


    I have been able to find out almost nothing about Schönf’s interaction with Hilbert.
    However, from April to August 1920 Hilbert gave weekly lectures entitled “Problems
    of Mathematical Logic” which summarized the standard formalism of'
