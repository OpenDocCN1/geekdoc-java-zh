    In 1947, he moved to become a founding professor in a new medical school in Ankara,
    Turkey. (Note that Turkey, like Switzerland, had been neutral in World War II.)
    In 1958 he moved again, this time to find the Institute of Physiology at Ege University
    in Izmir, Turkey, and then at age 67, in 1961, he retired and returned to Switzerland.


