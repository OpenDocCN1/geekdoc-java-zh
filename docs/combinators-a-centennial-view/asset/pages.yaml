  md: 'logic. But by the end of the 1940s von Neumann was talking least conceptually
    about connections to Gödel''s theorem and Turing machines, Alan Turing had become
    involved with actual electronic computers, and there was the beginning of widespread
    understanding of the notion of general-purpose computers and universal computation.


    In the 1950s there was an explosion of interest in what would now be called the
    theory of computation—and optimism about its relevance to artificial intelligence.
    There were all sorts of "interdisciplinary work" on fairly "concrete" models of
    computation, like finite automata, Turing machines, cellular automata and idealized
    neural networks. More "abstract" approaches, like recursive functions, lambda
    calculus—and combinators—remained, however, pretty much restricted to researchers
    in mathematical logic.


    When early programming languages started to appear in the latter part of the 1950s,
    thinking about practical computers became a bit more abstract. It was understood
    that the grammars of languages could be specified recursively—and actual recursion
    (of functions being able to call themselves) just snuck into the specification
    of ALGOL 60. But what about the structures on which programs operated? Most of
    the concentration was on arrays (sometimes rather elegantly, as in APL) and, occasionally,
    character strings.


    But a notable exception was LISP, described in John McCarthy''s 1960 paper "Recursive
    Functions of Symbolic Expressions and Their Computation by Machine, Part I" (part
    2 was not written). There was lots of optimism about AI at the time, and the idea
    was to create a language to "implement AI"—and do things like "mechanical theorem
    proving.\ A key idea—that McCarthy described as being on "recursive function formalism"—was
    to have tree-structured symbolic expressions ("S expressions"). (In the original
    paper, what''s now Wolfram Language—style g[x] "M expression" notation, complete
    with square brackets, was used as part of the specification, but the quintessential-LISP-like
    (f(g x)) notation won when LISP was actually implemented.)'
