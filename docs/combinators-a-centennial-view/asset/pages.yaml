- img_proc: true
  md: 'But the new thing we''re seeing here is that it''s difficult to figure out
    what will happen not just "in general" for complicated expressions set up to do
    particular computations but also for simple combinator expressions that one might
    "find in the wild". But the Principle of Computational Equivalence tells us why
    this happens.


    Because it says that even simple programs—and simple combinator expressions—lead
    to computations that are as sophisticated as anything. And this means that their
    behavior can be computationally irreducible, so that the only way to find out
    what will happen is essentially to run each step and see what happens. So if one
    wants to know what happens in an infinite time, one may have to do an effectively
