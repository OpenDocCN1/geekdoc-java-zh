  md: '# The World of the S Combinator


    ![](img/9989f4997c5d05c32e2f1cd1055a3106_104_0.png)


    If we were dealing with combinator expressions involving both S and K we know
    that''s in general undecidable whether a particular expression will halt. So what
    does it mean there''s a decidable way to determine an expression involving only
    S halts


    One might assume it''s that S alone is somehow computationally trivial. But in
    the past has been thought that a “computation” must involve starting with some
    initial “input” state, ending up at a fixed point corresponding to a final result.
    That''s certainly not how modern computing in practice works. The computer and
    its operating system do not completely stop when a particular computation is finished.
    Instead, the computer keeps running, the user is given a signal to come and look
    at something that provides the output for the computation.


    There''s nothing fundamentally different about how universality works in a setup
    like this; it''s just a “deployment” issue. And indeed the simplest possible examples
    of universality in cellular automata and Turing machines have been proved this
    way.'
