  md: '# COMBINATORS: A Centennial View


    So how might this work for S combinator expressions? Basically any sophisticated
    computation has to live on top of an infinite combinator growth process. Or, put
    another way, the computation has to exist as some kind of "transient" of potentially
    unbounded length, that in effect "modulates" the infinite growth "carrier".


    One would set up a program by picking an appropriate combinator expression from
    the infinite collection that lead to infinite growth. The evolution of the combinator
    expression would "run" the program. And one would use some computationally bounded
    process (perhaps a bounded version of a tree automaton) to identify when the result
    of the computation is ready—and one would "read it out" by using computationally
    bounded "decoder".


    My experience in the computational universe—as captured in the Principle of Computational
    Equivalence—is that the behavior of a system is not "obviously simple", the system
    will be capable of sophisticated computation, and in particular will be computation
    universal. The S combinator is a strange and marginal case. At least in the ways
    we have looked at it here, its behavior is not "obviously simple". But we have
    not quite managed to identify things like the kind of seemingly random behavior
    that occurs in a system like rule 30, that are a hallmark of sophisticated computation,
    and probably computation universality.


    There are really two basic possibilities. Either the S combinator alone is capable
    of sophisticated computation, and there is, for example, computational irreducibility
    in determining the outcome of a long S combinator evolution. Or the S combinator
    is fundamentally computationally reducible—and there is some approach (and maybe
    some new direction in mathematics) that "cracks it open", and allows one to readily
    predict everything that an S combinator expression will.


    I''m not sure where it''s going to go—although most-uniform experience over the
    last four decades has been when I think some system is "too simple" to "do anything
    interesting" or show sophisticated computation, it eventually proves me wrong,
    often in bizarre and unexpected ways. (In the case of the S combinator, a possibility—like
    I found for example in register machines—is that sophisticated computation might
    reveal itself in very subtle effects, like seemingly random off-by-one patterns).


    But whatever happens, it''s amazing that 100 years after the invention of the
    S combinator there are still big mysteries about it. In his original paper, Moses
    Schönfinkel expressed his surprise that something as simple as S and K were sufficient
    to achieve what we now call universal computation. And it it


    100'
