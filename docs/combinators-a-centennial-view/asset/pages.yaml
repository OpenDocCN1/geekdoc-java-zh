  md: '# Combinators and the Story of Computation


    Later in the book I talk specifically about Schönfinkel''s combinators in connection
    with the threshold of computation universality. But before showing examples of
    what they do, I remark:


    > Originally intended as an idealized way to represent structures of functions
    defined in logic, combinators were actually first introduced in 1920—sixteen years
    before Turing machines. But although they have been investigated somewhat over
    the past eighty years, they have for the most part been viewed as obscure and
    irrelevant constructs.


    How “irrelevant” should they be seen as being? Of course it depend on what for.
    As things to explore in the computational universe, cellular automata have the
    great advantage of allowing immediate visualization. With combinators it’s a challenge
    to find any way to translate their behavior at all faithfully suitable for human
    perception. And since the Principle of Computational Equivalence implies that
    general computational features wont depend on the particulars of different systems,
    there’s a tendency to feel that even in studying the computational universe, combinators
    “aren’t worth the trouble.


    Still, one thing that’s prominently on display with cellular automata over the
    past 20 years is the idea that any simple system will eventually end up being
    a useful model for something. Mollusc pigmentation. Road traffic flow. Are there
    cellular models for all of these. What about combinators? Without good visualization
    it''s harder to say “that looks like combinator behavior.” And even after 100
    years they’re still a bit unfamiliar. But when it comes to capturing some large-scale
    expression or tree behavior of system, I won’t be surprised if combinators are
    a good fit.


    When one looks at the computational universe, one of the important ideas is “mining”
    it just for programs that can serve as models for things, but also for programs
    that are somehow useful for some technological purpose. Yes, one can imagine specifically
    “compiling” some known program to combinators. The question is whether “naturally
    occurring combinators” can somehow be identified as useful for some particular
    purpose. Could they deliver some new kind of distributed cryptographic protocol?
    Could they be helpful in mapping out distributed computing systems? Could they
    serve as a base for setting up molecular-scale computation, say with tree-like
    molecules? I don’t know. But it will be interesting to find out. And as combinators
    enter their second century they provide a unique kind of “computational raw material”
    to mine from the computational universe.'
