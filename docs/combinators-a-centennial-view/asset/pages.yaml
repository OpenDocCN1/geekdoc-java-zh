  md: So what other interactions did Bernays have with Schönfinkel? There seems to
    be no other information in Bernays's archives. But I have been able to get a tiny
    bit more information. In a strange chain of connections, someone who's worked
    on Mathematica and Wolfram Language since 1987 is Roman Maeder. And Roman's thesis
    advisor (at ETH Zurich) is Erwin Engeler—who was a student of Paul Bernays. Engeler
    (who is now in 90s) worked for many years on combinators, so of course I had to
    ask him what Bernays might have told him about Schönfinkel. He told me he recalled
    only two conversations. He told me he had the impression and said he believed
    that the last time Bernays saw Schönfinkel it was in Berlin, and that Schönfinkel
    was somehow in difficult circumstances. Any such meeting in Berlin would have
    had to be before 1933. But try as we might to track down, we haven't succeeded.
