- img_proc: true
  md: 'So now I''m hoping something similar will happen in the S combinator case.
    I''m expecting that it will turn out be computation universal, but it would perhaps
    even more interesting if it was proved not to be.


    In the past one might have viewed proving that a simple system is (or is not)
    computation universal as a curiosity—like solving a specific mathematical puzzle.
    But the Principle of Computational Equivalence—and all the science I''ve done
    as a result of exploring the computational universe—now places such a question
    in a broader context, and shows that far from being a curiosity, it''s actually
    quite central.


    For example, with computation universality comes computational irreducibility,
    and undecidability. And to know how common these are in systems in nature, in
    mathematics and in technology has great fundamental and practical significance
    for when predictions can be made, and what kinds of questions can be answered.


    Identifying the threshold of computation universality also has direct implications
    for making a molecular-scale computer, as well, for example, as in computer security,
    for knowing whether some part of some program is actually universal, so it can
    be programmed to do something bad.'
