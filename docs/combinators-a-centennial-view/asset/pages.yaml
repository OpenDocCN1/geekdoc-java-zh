- img_proc: true
  md: 'It’s dated 18 March 1924. And it’s a carbon copy of a reference for Schönfinkel.
    It’s rather cold and, for reads:


    > “The Russian privatdozent [private lecturer] in mathematics, Mr. Scheinfinkel,
    is hereby to have worked in mathematics for ten years with Prof. Hilbert in Göttingen.”


    It’s signed (with a stylized “S") by the “University Secretary”, a certain Ludwig
    Gossmann, at Bhlplatz 5, Bern. That address is where the Physiology Institute
    at the University of Bern is now, and also was in 1924. And Raissa Neuberger was
    then, or soon would be, Nathan Schönfinkel’s wife.


    But there’s one more thing, handwritten in black ink at the bottom of the document.
    Dated March 20, it’s another note from the University Secretary. It’s annotated
    “a.a.s., i.e. ad acta—for the records. In German it reads:


    > Gott sei Dank, dass Sch weg ist


    which translates in English as:


    Thank good Sch is gone


    Hmm. For some reason the university secretary was happy to see Schönfinkel. (Or
    perhaps it was a 1920s version of an HR notation: “not eligible for rehire”) But
    let’s analyze this document in a little more detail. It says Schönfinkel worked
    with Hilbert for 10 years. That agrees with having arrived in Göttingen in 1914
    (which is a date we know for reasons, as we will see below).


    But now there’s a mystery. The reference describes Schönfinkel as a “privatdozent”.
    That’s a definite position at a German university, with definite rules, that in
    1924 one would expect to have been rigidly enforced. The basic career track was
    (and largely still) is: first, spend 2–5 years getting a PhD. Then perhaps get
    recruited for a professorship, or if not, continue doing research, and write a
    habilitation, which the university may issue what amounts to an official government
    “license to teach”, making someone a privatdozent, able to give lectures. Being
    a privatdozent wasn’t as such a a paid gig. But it could be combined with a job
    like being an assistant to a professor—or something outside the university, like
    tutoring, teaching high school or working at a company.'
  merge: -1
  pgno: 239
- img_proc: true
  md: 'So if Schönfinkel is a privatdozent in 1924, where is the record of his PhD,
    or his habilitation? To get a PhD “formally publishing” a thesis, and printing
    (as in, on a printing press) at least 20 or so copies of the thesis. a habilitation
    was typically a substantial, published research paper. But there''s absolutely
    no record of any these for Schönfinkel. And that''s very surprising. Because there
    are detailed records for other people (like Paul Bernays) who were around at the
    time, and indeed privatdozens.


    And what''s more the Annual Report of the German Mathematicians Association—which
    listed Schönfinkel''s 1920 talk—seems to have listed mathematical goings- on meticulous
    detail. Who gave what talk. Who wrote what paper. And definitely who gave a phd,
    did habilitation or became a privatdozent. (And becoming a privatdozent also required
    an action of the university senate, which was carefully recorded.) But going through
    all the annual reports of the German Mathematicians Association we find only four
    mentions of Schönfinkel. There''s his 1920 talk, and also a 1921 talk with Paul
    Bernays we discuss later. There''s the publication of his papers in 1924 and 1927.
    And there''s a single entry, which says that on November 4, 1924, Richard Courant
    gave a report to the Göttingen Mathematical Society about a conference in Innsbruck,
    where Heinrich Bernhard reported on “published work by M. Schönfinkel”. (It describes
    the work as follows: “It is a continuation of Sheffer’s [1913] idea of replacing
    the elementary operations of symbolic logic with a single one. By means of the
    elementary calculus, all logical statements (including the mathematical ones)
    are represented by three basic signs alone.)


    So, it seems, the university secretary wasn''t telling it straight. Schönfinkel
    might have worked with Hilbert for 10 years. But he wasn''t a privatdozent. Actually
    it doesn''t seem as he had any “official status” at all.


    So how do we know that Schönfinkel was in Göttingen from 1914 to 1924? Well, he
    was Russian, and in Germany he was an “alien”, and as such he was required to
    register his address with the local police (no doubt even more from 1914 to 1918
    when Germany was, after all, at war with Russia). And the remarkable thing is
    that even after all these years, Schönfinkel’s registration card is still right
    there in the municipal archives of the city of Göttingen:'
