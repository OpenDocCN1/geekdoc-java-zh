  md: '# Practical Computation


    In retrospect, one of the great achievements of the 1930s was the inception of
    what ended up being the idea of universal computation. But at the time what was
    done was couched in mathematical logic and it was far from obvious that any of
    the theoretical structures being built would have any real application beyond
    thinking about the foundations of mathematics. But even as people like Hilbert
    were talking in theoretical terms about the mechanization of mathematics, more
    and more there were actual machines being built for doing mathematical calculations.


    We know that in antiquity (at least one) simple gear-based calculational devices
    existed. And by the mid-1600s arithmetic calculators started being constructed,
    and by the late 1800s they were in widespread use. At first they were mechanical,
    but by the 1930s they were electromechanical, and there started to be systems
    where units for carrying out different arithmetic operations could be chained
    together. And by the end of the 1940s fairly elaborate systems on electronics
    were built.


    Already in the 1830s Charles Babbage had imagined an "analytical engine" which
    could different operations depending on a "program" by punch cards—and Ada Lovelace
    had realized that such a machine had brought "computational" potential. But by
    the 1930s a century had passed and nothing like this was connected to the theoretical
    developments that were going on—and the actual engineering of computational systems
    was done without any particular overarching theoretical framework.


    Still, as electronic devices got more complicated and scientific interest in psychology
    intensified, something else happened: there started to be the idea (sometimes
    associated with the name cybernetics) that somehow electronics might reproduce
    how things brain works. In the mid-1930s Claude Shannon had shown that Boolean
    algebra could represent switching circuits, and in 1943 Warren McCulloch and Walter
    Pitts proposed a model of idealized neural networks formulated in something close
    to mathematical logic terms.


    Meanwhile by the mid-1940s John von Neumann—who had worked extensively on mathematical
    logic—had started suggesting math-like specifications for practical electronic
    computers, including the way programs might be stored electronically. At first
    he made lots of brain-like references to "organs" and "inhibitory connections",
    and essentially no mention of ideas from mathematical'
