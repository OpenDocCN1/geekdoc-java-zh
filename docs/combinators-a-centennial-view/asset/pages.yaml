  md: 'COMBINATORS: A Centennial View


    What about practical computations? The most obvious implementation of combinators
    on modern computer systems isn''t very efficient because it tends to involve extensive
    copying of expressions. But by using things the DAG approach discussed above it''s
    perfectly possible to make it efficient.


    What physical systems? Is there a way to do "intrinsically combinator" computation?
    As I discussed above, our model of fundamental physics doesn''t quite align with
    combinators. But closer could be computations that can be done with molecules.
    Imagine a molecule with a certain structure. Now imagine that another molecule
    reacts with it to produce a molecule with a new structure. If the molecules are
    tree-like dendrimers, it''s at least conceivable that one can get something like
    a combinator transformation process.


    I''ve been interested for decades in using ideas gleaned from exploring the universe
    to do molecular-scale computation. Combinators as such aren''t best "raw material",
    but understanding how computation works with combinators is likely to be helpful.


    And for just fun we can imagine taking actual expressions—say from the evolution
    of s[s]s[s]—and converting them to "molecules" just using standard chemical SMILES
