  md: '# Causal Graphs and the Physicalization of Combinators


    The first thing to say is that combinators are confluent, in the sense that different
    evaluation schemes—even if they take different paths—must always give the same
    result whenever the evolution of a combinator expression terminates. And closely
    related to this is the fact that in the multiway graph for a combinator system,
    branching must be accompanied by subsequent merging.


    For both string and hypergraph rewriting rules, the presence of these properties
    is associated with another important property that we call causal invariance.
    and causal invariance is precisely the property that causal graphs produced by
    differing orders must always be isomorphic. (And in our model of physics, this
    is what leads to relativistic invariance, general covariance, objective measurement
    in quantum mechanics, etc.)


    So is the same thing true for combinators? It''s complicated. Both string and
    hypergraph rewriting systems have an simplifying feature: when you update something
    in, it is reasonable to think of the thing you update as being “fully consumed”
    by the updating event, with a “completely new thing” being created as a result
    of the event.


    But with combinators that''s not such a reasonable picture. Because there''s an
    updating event, say for s|y|[z, x can be a subtree that you just update “copying”,
    without in a sense, “consuming” and “reconstituting”. In the case of strings and
    hypergraphs, there''s a clear distinction between elements of the system that
    are “involved in an update”, and ones that aren''t. But in a combinator system,
    it''s not so obvious whether nodes buried in a subtree that''s “just copied” should
    be considered “involved” or not.


    There''s a complicated interplay with definitions used in constructing multiway
    graphs. Consider a string rewriting system. Start from a state and then apply
    rewriting rules in all possible ways:


    ![](img/9989f4997c5d05c32e2f1cd1055a3106_116_0.png)


    111'
