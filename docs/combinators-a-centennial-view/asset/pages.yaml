  md: 'But is this the "best combinator way" to compute this result?


    There are various different things we could mean by "best". Smallest program Fastest
    program? Most memory-efficient program? Or said in terms of combinators: Smallest
    combinator expression? Smallest number of rule applications? Smallest intermediate
    growth?


    In computation theory one talks theoretically about optimal programs and their
    characteristics. But when one''s used to studying programs "in the wild" one can
    start to do empirical studies of computation-theoretic questions—as I did, for
    example, with simple Turing machines in A New Kind of Science.


    Traditional computation theory tends to focus on asymptotic results about "all
    possible programs". But in empirical computation theory one''s dealing with specific
    programs—and in practice there''s a limit to how many one can look at. But the
    crucial and surprising fact that from studying the computational universe of "programs
    in the wild" is actually very small programs can show highly complex behavior
    that is in some sense typical of all possible programs. And that means it''s realistic
    to get intuition—and results—about computation-theoretic questions just by doing
    empirical investigations of actual, small programs.


    So how does this work with combinators? An immediate question to ask is: if one
    wants a particular expression, what are all the possible combinator expressions
    that will generate it?


    Let''s start with a seemingly trivial case: x[x]. With the compilation procedure
    used above we get the size-7 combinator expression


    ```

    s[s[k][k]][s[s[k][k]]][x]

    which (with leftmost-outermost evaluation) generates x[x] in 6 steps:

    s[s[k][k]][s[s[k][k]]][x]

    s[s[k][k]][s[s[k][k]]][x]

    k[k][x]]s[s[k][k][x]

    x[x[s[k[k[x]]]

    x[x[x]]

    ```'
