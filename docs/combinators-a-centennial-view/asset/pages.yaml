  md: '“The Combinator” is a recent combinatorial tool for idea generation, that seems
    to have no relation to combinators:


    J. Han, et al. (2018), The Combinator—A Computer-Based Tool for Creative Idea
    Generation Based on a Simulation Approach, Cambridge University Press. doi: 10.1017/dsj.2018.7.


    Y Combinator is a startup accelerator founded by P. Graham et al. in 2005; its
    name is derived from the fixed-point combinator, but otherwise it is unrelated:


    Y Combinator (accessed March 22, 2021). www.ycombinator.com.


