  md: '# COMBINATORS: A Centennial View


    But what about the idea of “composite symbolic heads”? Already in SMP I''d used
    them to do simple things like represent derivatives (and in Wolfram Language f''[x]
    is Derivative[1][f[x]). But something that''s been interesting to me is that as
    the decades have gone, more and more get done with “composite heads”. Sometimes
    one thinks of them as some kind of nesting of operations, or nesting of modifiers
    to a symbolic object. Increasingly they end up being a way to represent “higher-order
    constructs”—in effect things that produce things that produce etc. eventually
    give a concrete object one wants.


    I don''t think most of us humans are particularly good at following this kind
    of chain of abstraction, at least without some kind of “guide rails”. It''s interesting
    for me to see over the years we''ve been able to progressively build guide rails
    for longer and longer chains of abstraction. First there were things like Function,
    Apply, Map. Then Nest, Fold, FixedPoint, MapThread. But only recently NestGraph,
    FoldPair, SubsetMap, etc. Even from the beginning there were direct “head manipulation”
    functions that Operate and Through. But unlike “array-like” operations for list
    manipulation they''ve been slow to catch.


    In a sense combinators are an ultimate story of “symbolic head manipulation”:
    everything can get applied to everything before it''s applied to anything. And,
    yes, it''s very hard to keep track of what''s going on—which is why “named guide
    rails” are so important, and why they''re challenging to devise. But it seems
    as if, as we progressively evolve our understanding, we are slowly able to get
    a little further, in effect building the kind of structure and power that combinators—in
    their very non-human-relatable way—first showed us was possible a century ago.


