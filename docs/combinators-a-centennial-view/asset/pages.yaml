  md: '# What Is Mathematics–and Logic—Made Of?


    Before one could really dig into the idea of “building mathematics from logic”
    one had to have ways to “write mathematics” and “write logic”. At first, everything
    was just words and ordinary language. But by the end of the 1600s mathematical
    notation +, =, > had been established. For a while new concepts–like Boolean algebra–intended
    to just piggyback on existing notation. By the end of the 1800s, there was a clear
    need to extend and generalize how one wrote.


    In addition to algebraic variables $x$, there was the notion of symbolic functions
    $f$, as $f(x)$. In logic, there had long been the idea of letters $(p, q, ...)$
    standing for propositions (“it is raining now”). But now needed to be notation
    for quantifiers (“for all $x$ such-and-such”, or “there exists $x$ such that...”).
    In addition to symbolic functions in mathematics, there were symbolic logical
    predicates: not just explicit statements like $x > y$ but also ones like $p(x,
    y)$ for symbolic $p$.


    The first effort to set up the necessary notation and come with an actual scheme
    for constructing arithmetic from logic was Gottlob Frege’s 1879 Begriffchrift
    (“concept script”):


    ![](img/9989f4997c5d05c32e2f1cd1055a3106_171_0.png)'
  merge: -1
