    # ## Ultimate Symbolic Abstraction


    Before Turing machines, before lambda calculus—even before Gödel''s theorem—there
    were two basic combinators. They were the very first abstract examples ever to
    be constructed of what we now know as universal computation—and they were first
    presented very cleanly in terms of patterns in the Wolfram Language: December
    7, 1920. In an alternative version of our history the computing infrastructure
    might have been built on them. But as it is, for a century, they have remained
    for the most part a kind of curiosity—and a pinnacle of abstraction, obscurity.


    It''s not hard to see why. In their original form from 1920, there were two basic
    combinators, s and k, which followed the same replacement rules (now represented
    very cleanly in terms of patterns in the Wolfram Language):


    ```

    s[x][y][z] -> x[z][y[z]]

    k[x][y]  -> x

    ```


    The idea was that any symbolic structure could be generated from some combinations
    of s''s and k''s. For an example, consider a[b][a][c]. We''re not saying what
    a, b and c are; they''re just symbolic objects. Given a, b and c how we construct
    a[b][a][c]]?? Well, can we do it with s, k, combinators.


    Consider the (admittedly obscure) object


    ```

    s[s[k[s]][k[k]][k[s][k[s]]]][k[s[k[s][k[s][k]]]]][k]]]

    ```


    (sometimes instead written S(S(KS))(S(KK))((S(KS)(K)))(S(K(S(SKK)))).'
