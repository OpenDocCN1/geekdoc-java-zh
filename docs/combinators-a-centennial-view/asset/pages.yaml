  md: '# # Haskell Curry


    What happened with combinators after Schönfinkel published his 1924 paper? Initially,
    so far as one can tell, nothing. That is, until Haskell Curry found Schönfinkel''s
    paper in the library at Princeton University in November 1927—and launched into
    a lifetime of work on combinators.


    Who was Haskell Curry? And why did he know to care about Schönfinkel''s paper?


    ![](img/9989f4997c5d05c32e2f1cd1055a3106_268_0.png)


    Haskell Brooks Curry was born on September 12, 1900, in a small town near Boston,
    MA. His parents were both elocution educators, who by the time Haskell Curry was
    born were running the School of Expression (which had evolved from his mother’s
    Boston-based School of Elocution and Expression. Many years later, the School
    of Expression would evolve into Curry College in Waltham, Massachusetts—which
    happens to be for several years we held our Wolfram Summer School, often noting
    the “coincidence” of names when combinators came up.)


    Haskell Curry went to college at Harvard, graduating in mathematics in 1920. After
    a couple of years doing electrical engineering, he went back to Harvard, initially
    working with Percy Bridgman, who was primarily an experimental physicist, but
    was writing a philosophy of science book entitled *The Logic of Modern Physics*.
    And perhaps through this Curry got introduced to Whitehead and Russell’s *Principia
    Mathematica*.'
