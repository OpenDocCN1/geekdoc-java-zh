  md: 'it happens, it can be done by a reduction to three fundamental signs.” (The
    paper does say three fundamental signs, presumably counting as well as S and K.)


    I''m sure Schönfinkel expected to reproduce the richness of mathematical logic
    he''d need quite an elaborate set of building blocks. And certainly people like
    Frege, Whitehead and Russell had used what were eventually very complicated setups.
    Schönfinkel managed to cut through all the complexity to show that simple building
    blocks were all that were needed. But then he found something else: that just
    two building blocks (S and K) were enough.


    In modern terms, we''d say that Schönfinkel managed to construct a system capable
    of universal computation. And that''s amazing in itself. But even more amazing
    is that he found he could do it with such a simple setup.


    I''m sure Schönfinkel was extremely surprised. And I personally feel a certain
    commonality with him. Because in my own explorations of the computational universe,
    what I''ve found over and over again is that it takes only remarkably systems
    to be capable of highly complex behavior—of universal computation. And even after
    exploring the computational universe for four decades, I''m still continually
    surprised at how simple the systems can be.


    For me, this has turned into a general principle—the Principle of Computational
    Equivalence—and a whole conceptual framework around it. Schönfinkel didn''t have
    anything like that to think in terms of. But he was in a sense a good scientist
    that he still managed to discover what he discovered—that many decades later we
    can see fits in another piece of evidence for the Principle of Computational Equivalence.


    Looking at Schönfinkel''s paper a century later, it''s remarkable not only for
    what it discovers, but also for the clarity and simplicity with which it is presented.
    A little of the notation is dated (and of course the original paper is written
    in German, which is no longer the kind of leading language of scholarship it once
    was). But for the most part, the paper still seems perfectly modern. Except for
    course, that now it could be couched in terms of symbolic expressions and computation,
    rather than mathematical logic.'
