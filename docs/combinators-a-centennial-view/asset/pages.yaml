  md: '# To Moscow and Beyond...


    In the space of three days in March 1924 Moses Schönfinkel—by then 35 years old—got
    his paper on combinators submitted to Mathematische Annalen, got a reference for
    himself sought out, and left for Moscow. But why did he go to Moscow? We simply
    don''t know.


    A few things are clear, though. First, it wasn''t difficult to get to Moscow from
    Göttingen at that time; there was pretty much a direct train there. Second, Schönfinkel
    presumably had a valid Russian passport (and, one assumes, didn''t have any difficulties
    from not serving in the Russian military during World War I).


    One also knows that there was a fair amount of intellectual exchange and travel
    between Göttingen and Moscow. The very same volume of Mathematische Annalen in
    which Schönfinkel''s paper was published has three (out of 19) authors in addition
    to Schönfinkel listed as being in Moscow: Pavel Alexandroff, Pavel Urysohn and
    Aleksandr Khintchine. Interestingly, all of these people were at Moscow State
    University.


    And we know there was more exchange with that university. Nikolai Luzin, for example,
    got his PhD in Göttingen in 1915, and went on to be a leader in mathematics at
    Moscow State University (until he was effectively dismissed by Stalin in 1936).
    And we know that for example 1930, Andrei Kolmogorov, having graduated from Moscow
    State University, came to visit Hilbert.


    Did Schönfinkel go to Moscow State University? We don''t know (though we haven''t
    yet been able to access any archives that might be there).


    Did Schönfinkel go to Moscow because he was interested in communism? Again, we
    don''t know. It''s not uncommon to find mathematicians ideologically sympathetic
    to at least the theory of communism. But communism doesn''t seem to have particularly
    a thing in the mathematics or general university community in Göttingen. And indeed
    when Ludwig Gussmann was arrested in 1933, investigations of who he might have
    recruited into communism didn''t find anything of substance.


    Still, as I''ll discuss later, there is a tenuous reason to think that Schönfinkel
    might have some connection to Leon Trotsky''s circle, so perhaps that had something
    to do with him going to Moscow—though it would have been a bad time to be involved
    with Trotsky, since by 1925 he was already out of favor with Stalin.'
  merge: -1
  pgno: 260
- img_proc: true
  md: 'A final theory is that Schönfinkel might have had relatives in Moscow; at least
    it looks as if one of Lurie cousins ended up there.


    But realistically we don''t know. And beyond the bylines in the journals, we don''t
    really have any documentary evidence that Schönfinkel was in Moscow. How-ever,
    there is one more data point, from November 1927 (8 months after the submission
    of Schönfinkel’s paper with Bernays). Pavel Alexandroff was visiting Princeton
    University, and when Haskell Curry (who we’ll meet later) asked him about Schönfinkel
    he was apparently told that “Schönfinkel... gone insane and is now in a sanatorium
    & will probably not be able to work any more.”


    Ugh! What happened? Once again, we don''t know. Schönfinkel doesn''t seem to have
    ever been (“in a sanatorium”) while he was in Göttingen; after all we have his
    addresses, and none of them were sanatoria. Maybe there’s a hint of something
    in Schönfinkel’s brother’s letter to Hilbert. But are we really sure that Schönfinkel
    actually suffered from mental illness? There’s a bunch of hearsay that says he
    did. But then it’s a common claim that logicians who highly abstract work are
    prone to mental illness (and, well, yes, there are a disappointingly large of
    historical examples).


    Mental illness wasn''t handled well in the 1920s. Hilbert''s only child, his son
    Franz (who was about five years younger than Schönfinkel), suffered from mental
    illness, and after a delusional episode that ended up with him in a clinic, David
    Hilbert simply said “From now on I have to consider myself as someone who does
    not have a son”. In Moscow in the 1920s—despite some political rhetorical–conditions
    in psychiatric institutions were probably quite poor, and there was for quite
    a bit of primitive shock therapy (though not electroshock). It’s notable, by the
    way, that Curry reports that Alexandroff described Schönfinkel as being “in a
    sanatorium”. But while at that time the word “sanatorium” was being used in the
    US as a better term for “insane asylum”, in Russia it still had more of a meaning
    for a rest cure. So this still doesn''t tell us if Schönfinkel in fact “institutionalized”—or
    just “resting”. (By the way, if there was mental illness involved, another connection
    for Schönfinkel that doesn''t seem to have been made is that Paul Bernays’s first
    cousin once removed was Martha Bernays, wife of Sigmund Freud).'
  merge: -1
  pgno: 261
- img_proc: true
  md: 'Whether or not he was mentally ill, what would have been like for Schönfinkel
    in what was then the Soviet Union in the 1920s? One thing is that in the Soviet
    system, everyone was supposed to have a job. Schönfinkel was presumably employed
    doing something—though we have no idea what. Schönfinkel had presumably been at
    least involved with the synagogue in Göttingen (which is how the rabbi knew to
    tell his brother was in bad shape). There was a large and growing Jewish population
    in Moscow in the 1920s, complete with things like Yiddish news. By the mid 1930s
    it was no longer comfortable to be Jewish in Moscow, and Jewish cultural organizations
    were being shut down.


    By the way, in the unlikely event that Schönfinkel was involved with Trotskys,
    there could have been trouble even by 1925, and certainly by 1929. And it''s notable
    that it was a common tactic for Stalin (and others) to claim that their opponents
    were "insane".


    What else do we know about Schönfinkel in Moscow? It''s said that he died there
    in 1940 or 1942, aged 52–54. Conditions in Moscow wouldn''t have been good then;
    the so-called Battle of Moscow occurred in the winter of 1941. And there are various
    stories about Schönfinkel''s situation at that time.


    The closest to a primary source seems to be a summary of mathematical logic in
    the 1896 Soviet Union, written by Sofya Yanovskaya in 1948. Yanovskaya was born
    in 1896 (8 years after Schönfinkel), and grew up in Odessa. She attended the same
    university as there Schönfinkel, studying mathematics, though arrived five years
    after Schönfinkel graduated. She had many of the professors as Schönfinkel, and
    probably like Schönfinkel, was particularly influenced by Shatunovsky. When the
    Russian Revolution happened, Yanovskaya went "all in", becoming a serious party
    operative, but eventually began to teach, first at the Institute of Red Professors,
    and from 1925 at Moscow State University—where she became a major figure in mathematical
    logic, and was eventually awarded the Order of Lenin.


    One might perhaps have thought that mathematical logic would be pretty much immune
    to political issues. But the founders of communism had talked about mathematics,
    and there was a complex debate about the relationship between Marxist-Leninist
    ideology and formal ideas in mathematics, notably the Law of Excluded Middle.
    Sofya Yanovskaya was deeply involved, initially in trying to “bring mathematics
