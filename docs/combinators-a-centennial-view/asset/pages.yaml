  md: 'For many years my work on fundamental physics languished—a victim of other
    priorities and the uphill effort of introducing new paradigms into a well-established
    field. But just over a year ago—with help from two very talented physicists—I
    started again, with unexpectedly spectacular results.


    I had never been quite satisfied with my idea of everything in the universe being
    represented as a particular kind of giant graph. But now I imagined that perhaps
    it was like a giant symbolic expression, or specifically, like an expression consisting
    of a huge collection of relations between elements—in effect, a certain kind of
    giant hypergraph. It was, in a way, a very combinator-like concept.


    At a technical level, it''s not the same as a general combinator expression: it''s
    basically a single layer, not a tree. And in fact that what seems to allow the
    physical universe to consist of uniform (manifold-like) space, rather than showing
    some kind of hierarchical tree-structure everywhere.


    But when it comes to the progression of the universe through time, it''s basically
    just like the transformation of combinator expressions. And what''s clear is the
    existence of different paths—and their ultimate equivalents—is exactly what''s
    responsible not only for the phenomena of relativity, but also for quantum mechanics.
    And what''s remarkable is that many of the concepts that were first discovered
    in the context of combinators and lambda calculus now directly inform the theory
    of physics. Normal forms (basically fixed points) are related to black holes where
    “time stops”. Critical pair lemmas are related to measurement in quantum mechanics.
    And so on.


    In practical computing, and in the creation of computational language, it was
    the addition of “meaningful names” to the raw structure of combinators that turned
    them into the powerful symbolic expressions we use. But in understanding the “data
    structure of the universe” we’re in a sense going back to something more like
    “raw combinators”. Because now all “atoms of space” that make up the universe
    don’t have meaningful names; they’re more like s’s and K’s in a giant combinator
    expression, distinct yet all the same.


    In the traditional, mathematical view of physics, there was always some sense
    that by “appropriately clever mathematics” it would be possible to “figure out
    what will happen” in any physical system. But once one imagines physics is fundamentally
    computational, that''s not what one can expect.


    And just like combinators—with their capability for universal computation—can’t
    in a sense be “cracked” using mathematics, so also that’ll be true of the universe.'
