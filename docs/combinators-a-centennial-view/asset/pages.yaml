  md: '# # What Should We Make of Schönfinkel?


    When one reads about the history of science, there''s a great tendency to get
    the impression that big ideas come suddenly to people. My historical research—and
    my personal experience—suggest that''s essentially never happens. Inside, there''s
    usually a period of many years in which some methodology or conceptual framework
    gradually develops, and only then can the great idea emerge.


    So with Schönfinkel it''s extremely frustrating that we just can''t see that long
    period of development. The records we have just tell us that Schönfinkel announced
    combinators on December 7, 1920. But how long had he been working among them?
    We don''t know.


    On the face of it, his paper seems simple—the kind of thing that could have dashed
    off in a few weeks. But then it''s much more likely that it was the result of
    a decade of development—of which, through foibles of history, we now have no trace.


    Yes, what Schönfinkel finally came up is simple to explain. But to get to it,
    he had to cut through a whole thick of technicality—and see the essence of what
    lay beneath. My life as a computational designer has often involved doing very
    much this kind of thing. And at the end of it, what you come up may seem in retrospect
    "obvious". But to get there often requires a lot of hard intellectual work.


    And in a sense what Schönfinkel did was the most impressive possible version of
    this. There were no computers. There was no ambient knowledge of computation as
    a concept. Yet Schönfinkel managed to come up with a system that captures the
    core of those ideas. And while he didn''t have the language to describe it, I
    think he did have a sense of what he was doing—and the significance it could have.


    What was the personal environment in which Schönfinkel did all this? We just don''t
    know. We know he was in Göttingen. We don''t think he was involved in any particular
    official with the university. Most likely he was just someone who was "around".
    Clearly he had some interaction with people like Hilbert and Bernays. But we don''t
    know how much. And we don''t really know if ever thought they understood Schönfinkel
    was doing.'
