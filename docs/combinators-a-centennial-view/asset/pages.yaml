  md: '# The Future of Combinators


    S and K at first seem so simple, so basic. But as we''ve seen here, there''s an
    immense richness to what they can do. It''s a story I''ve played out many times
    across the computational universe. But in a sense it''s particularly remarkable
    for combinators because they were invented so early, and they seem so very simple.


    There''s little question that even a century after they were invented, combinators
    are still hard to get one''s head around. Perhaps if computation and computer
    technology had developed differently, we''d now find combinators easier to understand.
    Or perhaps the way our brains are made, they''re just intrinsically difficult.


    In a sense what makes combinators particularly difficult is the extent to which
    they''re both featureless and fundamentally dynamic in their structure. When we
    apply the combinators in practical "human-oriented" computing—for example in the
    Wolfram Language—we annotate what''s going on in a variety of ways. With the Wolfram
    Physics Project we now have the idea that what happens at the lowest level in
    the physics of our universe is something much more like "raw combinators".


    The details are different—we''re dealing with hypergraphs, not trees—but many
    of the concepts are remarkably similar. Yes, a universe made with combinators
    probably won''t have anything like space in the way we experience it. But a lot
    of ideas about updating processes and multiway systems are all there in combinators.


    For most of history, combinators have been treated mainly as a kind of backrop
    for proofs. Yes, it is possible to avoid variables, construct everything symbolically,
    etc. But a century after they were invented, we can now see that combinators in
    their right have much to contribute.


    What happens if we don''t just think about combinators in general, but actually
    look at what specific combinators do? What happens if we do experiments on combinators?
    In the past some elaborate behavior of a particular combinator expression might
    have just seemed like a curiosity. But now that we have the whole paradigm that
    I''ve developed from studying the computational universe we can see how such things
    fit in, and help up a coherent story about the ways of computation.'
