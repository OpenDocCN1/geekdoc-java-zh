  md: '# Causal Graphs and the Physicalization of Combinators


    Not long ago one wouldn''t have any reason to think that ideas from physics would
    relate to combinators. But our Wolfram Physics Project has changed that. And in
    fact it looks as if methods and intuition from our Physics Project—and the connections
    they make to things like relativity—give some interesting insights into combinators,
    and may in fact make their operation a little less mysterious.


    In our Physics Project we imagine that the universe consists of a large number
    of abstract elements ("atoms of space") connected by relations—as represented
    by a hypergraph. The behavior of the universe—and the progression of time—is then
    associated with repeated rewriting of this hypergraph according to a certain set
    of (presumably local) rules.


    It''s certainly not the same as the way combinators work, but there are definite
    similarities. In combinators, the basic "data structure" is not a hypergraph,
    but a binary tree. But combinator expressions evolve by repeated rewriting of
    this tree according to rules that are local on the tree.


    There''s a kind of intermediate case that we''ve often used as a toy model for
    aspects of physics (particularly quantum mechanics): string substitution systems.
    A combinator expression can be written out "linearly" (as say s[s]s[s][s]]k[s]),
    but really it''s tree-structured and hierarchical. In a string substitution system,
    however, one just has plain strings, consisting of sequences of characters, without
    any hypergraph. The system then evolves by repeatedly rewriting the string by
    applying some local string substitution rule.


    For example, one could have a rule like "A"→BBB","BB"→A". And just like combinators,
    given a particular string—like "BBA”—there are different possible choices about
    where to apply the rule. And—again with combinators—we can construct a multiway
    graph to represent all possible sequences of rewrites:'
