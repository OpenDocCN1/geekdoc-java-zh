  md: '# A Hundred Years Later...


    Now that a century has passed, what should we think of combinators? In some sense,
    they still might be the purest way to represent computation that we know. But
    they''re also very hard for us humans to understand.


    Still, as computation and the computational paradigm advance, and become more
    familiar, it seems like on many fronts we are moving ever closer to core ideas
    of combinators. And indeed the foundational symbolic structure of the Wolfram
    Language—and much of what I''ve personally built over the past 40 years—can ultimately
    be seen as deeply informed by those that arise in combinators.


    Computation may be the single most powerful unifying intellectual concept ever.
    But the actual engineering development of computers and computing has tended to
    keep different aspects of it. There are data types. There are functions. There
    are flow of control. And, yet it is convenient to keep these apart in the traditional
    approach to engineering of systems. But it doesn''t need to be that way. Combinators
    show us actually there''s no need to have any of these distinctions:everything
    can be together, and can be made of the same, dynamic "computational spiel".


    It''s a very powerful idea. In its raw form, it is very disorienting for us humans.
    To understand these things, we need to rely on having "fixed anchors" to which
    we can attach meaning. And in pure, ever-changing seas of s, k combinators—the
    ones we saw above—we don''t just have them.


    Still, a compromise—and in a sense that''s exactly what''s made it possible for
    me to build the full-scale computational language that the Wolfram Language is
    now. The point is that if we''re going to be able to represent everything in the
    world we we need the kind of unity and flexibility that combinators provide. But
    we don''t just want, simple combinators. We need to effect pre-define lots of
    combinator-like constructs that have particular meanings related to what we''re
    representing in the world.


    At a practical level, the crucial idea is to represent everything as a symbolic
    expression, and to say that evaluating these expressions consists of repeatedly
    applying transformations to them. And, yes, symbolic expressions in the Wolfram
    Language are just like the expressions we''ve made out of combinators—except that
    instead of involving only s''s and k''s, they involve thousands of different'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'symbolic constructs that we define to represent molecules, or cities or polynomi
    als. But the key point is that—like with combinators—the things we''re dealing
    with are always structurally nested applications of pure symbolic objects.


    Something we immediately learn from combinators is that “data” is really differ-
    from “code”; they can both be represented as symbolic expressions. And both can
    be the raw material for computation. We also learn that “data” doesn''t have to
    maintain any particular type or structure; not only its content, but also the
    way it is built up as a symbolic expression can be the dynamic output of a computation.


    One might imagine that things like this would be esoteric matters of princi- ple.
    But what I''ve learned in building the Wolfram Language is that actually they''re
    natural and crucial in having convenient ways to capture computationally how humans
    think about things, and the way the world is.


    From the early days of practical computing, there was an immediate instinct to
    imagine that programs should be set up as sequences of instructions saying for
    example “take a thing, then do to it, then do that” and so on. The result be a
    “procedural” program:


    ```

    x = f(x); x = g(x); x = h(x); x

    ```


    But as the combinator approach suggests, there''s a conceptually simpler way to
    write this in which one''s just successively applying functions, to make a “functional”
    program:


    ```

    h[g[x]]

    ```


    (In the Wolfram Language, this can also be written h@g@f@x or x//f//g//h.)


    Given the notice that everything is a symbolic expression, one''s immediately
    led to functions to operate on other functions, like


    ```

    In[j]: Nest[f, x, j]

    Out[j]: f[f[f[f[f[f[f[f[f[f[f[x]]]]]]]]]]]

    ```


    OR:


    ```

    In[j]: ReverseApplied[f][a, b]

    Out[j]: f[b, a]

    ```


    This idea of such “higher-order functions” is quintessentially combinator informed—and
    very elegant and powerful. As as the years go by we''re be gradually managing
    to see how to make more and more aspects of it understandable and accessible in
    the Wolfram Language (think: Fold, MapThread, SubsetMap, FoldPair, ...).'
