    # Recursive Functions of Symbolic Expressions

    and Their Computation, Machine I


    1. Introduction

    In this approach we define a programming language based on symbolic expressions.
    The expressions are built from functions that can be applied to arguments. The
    original idea was to show that any computable function can be represented as an
    expression in such a language. We will use the method of combinators to achieve
    this. The goal of this paper is to introduce the theory of combinators.


    James McCulloch,get University of Technology, Wisconsin


    We will begin by introducing some combinators and then show how they can be used
    to represent any computable function.


    We will start with the simplest combinators and then show how they can be used
    to represent any computable function. We will then discuss some more important
    combinators and how they can be used to represent binary, binary, ternary, and
    nullary functions. We will define the properties of these combinators at the end
    of the section.


    A unary function is a function that takes one argument and returns a function.
    A binary function is a function that takes two arguments and returns a function.


    A ternary function is a function that takes three arguments and returns a function.
    A nullary function is a function that takes no arguments and returns a value.


    We will then show how these combinators can be used to represent any computable
    function.


    We will then define the properties of these combinators at the end of the section.


