  md: 'Mr. Gossmann also had a sideline: he was involved in real estate. In the 1910s
    he started building houses (borrowing money from, among others, various universities),
    and by the 1920s he had significant real estate holdings—and a business where
    he rented to international visitors and students at the university.


    Years went by. But then, on January 24, 1923, the newspaper headline announced:
    "Sensational arrest: senior university official Gossmann arrested on suspicion
    of treason—communist revolution material [Zersetzungschrift] confiscated from
    his apartment". It was said that perhaps it was a setup, and he''d been targeted
    because he was gay (a year earlier, at age 54, he did marry a woman named Elfriede).


    ![](img/9989f4997c5d05c32e2f1cd1055a3106_243_0.png)


    This was a bad time to be accused of being communist (Hitler would become chancellor
    less than a week later, on January 30, 1933, in part propelled by fears of communism).
    Gossmann was taken to Hanover “for questioning”, but was then allowed to back
    “under house arrest”. He had had health problems for several years, and died of
    a heart attack on February 24, 1933.


    But none of this really helps understand why Gossmann went out on a limb to falsify
    the reference for Schönifel. We can''t specifically find an address match, but
    perhaps Schönifel had at least at some point been a tenant of Gossmann''s. Hevarrho
    still near. Perhaps he was just difficult in dealing with the university administration.
    It''s not clear. It''s also not why the reference Gossmann wrote to Schönifel''s
    brother in Bern, even though Schönifel himself was going to Moscow. Or why it
    was just handed to Schönifel he left Göttingen.'
