  md: '# The Operation of the S Combinator Challenge


    I don''t know how long it''s going to take, or how hard it''s going to be, but
    I''m hoping that someday a message will arrive that successfully resolves the
    S Combinator Challenge. What will the message have to contain?


    The best case as far as I am concerned is specific Wolfram Language code that
    implements the solution. If the S combinator is in fact universal, then the code
    should provide a "compiler" that takes, say, a Turing machine or cellular automaton
    specification, and generates an S combinator initial condition, with code for
    the "detector" and "decoder". But how will we validate that code is "correct"?


    It might conceivably be simple enough that it''s amenable to direct human analysis.
    But more likely it''s going to require some level of automated analysis. At first
    one might just do explicit text, but then one might for example to generate an
    automated proof that the detector and decoder always halt, and even determine
    an upper bound on how long this can last.


    If the S combinator is not universal, one might show this by having code that
    can "jump ahead" by any number of steps and explicitly determine the outcome,
    but that itself always halts. Or maybe one might have code that effectively implements
    what happens to any "modulation" of S combinator evolution—and then prove that
    this code leads to behavior that, say, always halts, or otherwise shows complete
    regularity.


    But maybe one won''t have explicit code that implements a solution, and instead
    one will only have an abstract proof of what''s possible. This could conceivably
    be in the form of a standard human-oriented mathematical proof. But I think it''s
    more likely it will be complicated enough that it has to be presented in a systematic
    computational way. And in the end, if it''s a proof it''ll have to start from
    certain axioms.


    What axioms can be used? One would hope that the "standard axioms of mathematics"
    will be enough. Perhaps only the Peano axioms will be needed. But I wouldn''t
    be surprised if transitive induction were needed, requiring axioms of set theory.
    And of course there are weird cases that could arise, where the proof will be
    possible, say, with one assumption about the Continuum Hypothesis, but not with
    the other.'
  merge: -1
  pgno: 303
- img_proc: true
  md: 'There are other weird things that could happen. For example, it might be possible
    to show that the complete infinite structure obtained by running the evolution
    for an infinite time could reproduce any computation, but one might not know whether
    this is possible with finite evolution. Or it might be that one could only make
    a construction if an infinite tree (specified by a transfinite number) as the
    initial condition.


    It''s also conceivable that the behavior of the S combinator could correspond
    to an “intermediate degree” of computational capability—and undecidable features,
    but is not universal. I don''t think this will happen, but if it does, I would
    consider it a resolution of the S Combinator Challenge.


    And then, of course, there''s the unexpected. And in my experience of exploring
    the computational universe over the past 40 years, that''s something one encounters
    with remarkable frequency. A corner case one didn''t anticipate. An intermediate
    situation that didn''t seem possible. A new form of behavior one never imagined.
    Sometimes these are the most interesting things to find. But inevitably they make
    giving a cut-and-dried definition of what''s needed for the S Combinator Challenge
    difficult.


    It''s worth remembering, that, that the S Combinator Challenge is about answering
    the human-stated question “Is the S combinator computation universal?”. And in
    the end it may take us to determine whether some particular solution reality does
    answer that question or not.


    In a sense the S Combinator Challenge is already a 100-year story. But I''m certainly
    hoping that it''ll be resolved in far less than 100 years. And that in doing so
    we''ll learn important things about the remarkable world of combinators, and the
    computational universe in general.


    www.combinatorprize.org'
