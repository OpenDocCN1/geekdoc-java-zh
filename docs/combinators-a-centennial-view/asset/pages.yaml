    # Excerpt from Section 12: Universality in Turing Machines and Other Systems


    I suspect that in almost any case where we have seen complex behavior earlier
    in this book it will eventually be possible to show that there is universality.
    And indeed, as I will discuss in the next chapter, I believe that in general there
    is a close connection between universality and the appearance of complex behavior.


    Previous examples of systems that are known to be universal typically had rules
    that are far too complicated to see this with any clarity. But as an almost unique
    instance where it could potentially have been seen even long ago are what are
    known as combinators.


    Combinators are a particular case of the symbolic systems that we discussed on
    page [307]. Originally intended as an idealized way to represent structures of
    functions defined in logic, combinators were actually first introduced in 1920—somewhat
    over the past eighty years, they have for the most part been viewed as somewhat
    obscure and irrelevant constructs.


    The basic rules for combinators are given below.


    ```

    s[x][.y][.z] -> x[z][y[z]]

    k[x][y] -> x

    ```


    Rules for symbolic systems known as combinators, first introduced in 1920, and
