  md: 'Sixteen years later would come Turing machines (and lambda calculus). But in
    1920 Moses Schönfinkel presented what he called “building blocks of logic”—or
    what we now call “combinators”—and then proceeded to show that by appropriately
    combining them one could effectively define any function, or in modern terms,
    that they could be used to universal computation.


    Looking back a century’s remarkable enough that Moses Schönfinkel conceptualized
    a formal system that could effectively abstract the notion of computation. And
    it’s more remarkable still that he formulated what amounts to the idea of universal
    computation, and showed that his system achieved.


    But for the me most amazing thing is that not only did he invent the first complete
    formalism for universal computation, but his formalism is probably in some sense
    minimal. I personally spent years trying to work just how the structure of systems
    that support universal computation can be—and for example with Turing machines
    it took from 1936 until 2007 for us to find the minimal case.


    But back in his 1920 talk Moses Schönfinkel—presenting a formalism for universal
    computation the very first time—gave something that is probably already in his
    context minimal.


    Moses Schönfinkel described the result of his 1920 talk in an 11-page paper published
    in 1924 entitled “Über die Bausteine des mathematischen Logik” (“On the Building
    Blocks of Mathematical Logic”). The paper is a model of clarity. It starts by
    saying that in the “axiomatic method” for mathematics it makes sense to keep the
    notion of “fundamental notions” as small as possible. It reports that in 1913
    Henry Sheffer managed to show that basic logic requires only one connective, that
    we now call NAND. But then it goes to further. And already within a couple of
    paragraphs it’s saying “We are led to [an] idea, which at first certainly appears
    extremely bold. But by the end of the introduction it’s reporting, with surprise,
    the big news: “It seems to me remarkable in the extreme that the goal we have
    just set can be realized... [and]; as it happens, it can be done by a reduction
    to three fundamental signs.”


    Those “three fundamental signs”, of which only needs two, are we now call the
    S and K combinators (he called them S and C). In concept they’re remarkably simple,
    but their actual operation is in many ways brain-twisting complex. But there they
    were—already a century ago—just as they are today: minimal elements for universal
    computation, somehow conjured up the mind of Moses Schönfinkel.'
