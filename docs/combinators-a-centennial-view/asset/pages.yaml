  md: '# Updating Schemes and Multiway Systems


    The world of combinators as we''ve discussed so far may seem complicated. But
    we''ve actually so far been consistently making a big simplification. And it has
    to do with how the combinator rules are applied.


    Consider the combinator expression:


    ```

    s[s][s][s][s][s][s][s][s][s][s][s][s][s][s][s][s]

    ```


    There are 6 places (some overlapping) at which s[_] or k_[][_] matches some part
