  md: '# COMBINATORS: A Centennial View


    But in any case, there''s a note in his archive about Principia Mathematica dated
    May 20, 1922:


    ![](img/9989f4997c5d05c32e2f1cd1055a3106_269_0.png)


    Haskell P. Curry papers, PSUA 222, Special Collections Library, Pennsylvania State
    University


    Curry seems—perhaps like an electrical engineer or a “pre-programmer”—to have
    been very interested in the actual process of mathematical logic, starting his
    notes with "No logical process is possible without the phenomenon of substitution."
    He continued, to break down the process of substitution.


    But then his notes end, more philosophically, and perhaps with “expression" influence:
    "Phylogenetic origin of logic: 1. Sensation; 2. Association: Red hot-power of
    permanence."


    At Harvard Curry started working with George Birkhoff towards a PhD in differential
    equations. But by 1927–he had decided to switch to logic, and was spending as
    an instructor at Princeton. And it was there—in November 1927–that he found Schönfinkel’s
    paper. Preserved in his archive are the notes he made:


    ![](img/9989f4997c5d05c32e2f1cd1055a3106_269_1.png)


    Haskell P. Curry papers, PSUA 222, Special Collections Library, Pennsylvania State
    University


