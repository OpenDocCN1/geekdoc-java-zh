    Register machines provide simple idealizations of typical low-level computer languages.
    But what about [Wolfram Language]? How can one set up a simple idealization of
    the transformations on symbolic expressions that [Wolfram Language] does? One
    approach suggested by the idea of combinators from the 1920s is to consider expressions
