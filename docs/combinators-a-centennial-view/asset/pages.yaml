  md: '# COMBINATORS: A Centennial View


    Combinators foreshadowed another big part of my life too. In trying to generalize
    the concept of mathematical models, I began many years ago to explore the computational
    universe of simple programs—and discovered that even extremely simple programs
    can generate immensely complex behavior, of the kind we see, for example. Most
    of the programs I''ve studied over the years aren''t specifically like combinators.
    But in preparing for the centenary of combinators I decided to apply the methods
    I''ve honed in exploring the computational universe to combinators—and discovered
    that many of the strongest phenomena I''ve found in the computational universe
    have been lurking largely unnoticed for a century.


    When I first put the combinator centenary on my calendar years ago—even though
    I didn''t connect them as with combinators as I do now—already knew about symbolic
    expressions and computational language, and about what happens in the computational
    universe of simple programs. But—though I had some premonitions more than twenty
    years ago—it''s only in the last year and a half that I''ve come to realize with
    increasing certainty that our physical universe is fundamentally computational.


    It''s given me a new way to think about computation, deeply interwoven not only
    with physics but also with areas like mathematics. And it''s made me see that
    combinators—with some of their hard-to-understand features—fundamentally reflect
    some of how computation relates to physics and our experience of the physical
    world.


    I''m so glad to have the impetus from their centenary to get know combinators
    a little better, and to be able to share what I''ve learned in this book. I think
    there''s a little doubt that the general development of computation has been the
    greatest intellectual achievement of the past century. But in that endeavor, combinators
    have been the road not taken. I hope here that I''m able to explore a little of
    the remarkable world of combinators, and what might lie ahead with them now that
    we begin to see what''s possible.


    ![](img/9989f4997c5d05c32e2f1cd1055a3106_6_0.png)


    April 30, 2021'
