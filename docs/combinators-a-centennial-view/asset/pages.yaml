  md: '# COMBINATORS: A Centennial View


    ![](img/9989f4997c5d05c32e2f1cd1055a3106_255_0.png)


    We learn quite a bit about Schönfinkel from this. Perhaps the most obvious thing
    is that he was a fan of Hilbert and his approach to mathematics (with a definite
    shout-out to "Ms. Noether."). It''s also interesting that he refers to Bernays
    and Behmann as "students" of Hilbert. That''s pretty correct for Behmann. By Bernays
    (as we will see soon) was an assistant or colleague of Hilbert''s than a student.


    It gives interesting context to what Schönfinkel rattle off as the modern view
    of mathematical logic. He begins—right thinking-mentioning "Leibniz''s bold conjectures".
    He not sure whether Bernard Bolzano posits (and neither I). Then he lists Schröder,
    Frege and Peano—all pretty standard choices, involved in building up the formal
    structure of mathematical logic.


    Next he mentions Christine Laud-Franklin. At least these days, she''s not particularly
    well known, but she had been a mathematical logic student of Charles Peirce, and
    in 1881 she''d written a paper the "Algebra of Logic" which included a truth table,
    a 40 years before Post or Wittgenstein. (In 1891) she had also worked in Göttingen
    on color vision with the experimental psychologist Georg Müller—who was still
    there in 1921.) It is notable that Schönfinkel mentions'
  merge: -1
  pgno: 255
- img_proc: true
  md: 'Ladd-Franklin ahead of the father-and-son Peirces. Next we see Sheffer, by
    Schönfinkel quotes in connection with Nand in his combinator paper. (No doubt
    unbeknownst to Schönfinkel, Henry Sheffer—who spent most of his life in the US—was
    also born in Ukraine "near Odessa", his documents say), and was 6 years older
    than Schönfinkel.) I''m guessing Schönfinkel Whitehead next in connection with
    universal algebra, rather than his later collaboration with Russell.


    Next comes Louis Courat, who frankly wouldn''t have made my list for logic, but
    was another "algebra of logic" person, as well as a Leibniz fan, and developer
    of the Ido language offshoot from Esperanto. Huntington was involved in the axiomatization
    of Boolean algebra; Paoa was connected to Peano''s story. Shatunovsky, Sleshinsky
    and Kager were all professors of Schönfinkel''s in Odessa (as mentioned above),
    concerned in various ways with foundations of mathematics. Platon Poretsky I say
    I had never heard of; he seems to have done technical work on propositional logic.
    And finally Schönfinkel Löwenheim and Skolem, both of whom are well known in mathematical
    logic today.


    I consider it wonderful that Schönfinkel referred to Whitehead and Russell''s
    Principia Mathematica as a "titanic work" (Titanenwerk). The showy and "overconfident"
    Titan work had to come on its iceberg in 1912, somewhat reminiscent of Principia
    Mathematica, eventually coming to grief on Gödel''s theorem.


    At first it might just seem charming—particularly in view of his brother''s comment
    that “[Moses] is helpless and impractical in this material world”—to see Schönfinkel
    talk about after one''s solved all mathematical problems, solving all problems
    will be easy, explaining that, after Hilbert, has said that the world is written
    in "mathematical letters". He says that in the previous century mathematicians
    wouldn''t have seriously considered "solving everything", but now, because of
    progress in mathematical logic, one has the courage and the boldness to touch
    this question.


    It''s very easy to see this as naive and otherworldly—the writing of someone knew
    only about mathematics. But though he didn''t have the right way to express it,
    Schönfinkel was actually unto something, and something very big. He talks about
    the genius of his piece about generality, and about how recent advances in mathematical
    logic embody one to pursue it. And in a sense he was very right about mathematical
    logic—work like what was led us to the modern conception of computation, which
    really is successful in “talking about everything". Of course, after Schönfinkel''s
    time we learned'
  merge: -1
  pgno: 256
- img_proc: true
  md: 'about Gödel''s theorem and computational irreducibility, which tell us that
    even though we may be able to talk about everything, we can never expect to "solve
    every problem" about everything.


    But back to Schönfinkel''s life and times. The remainder of Schönfinkel''s note-books
    give the technical details of his solution to a particular case of the decision
    problem. Bernays obviously worked through these, adding more examples as well
    as some generalization. Bernays cut out Schönfinkel''s philosophical introduction,
    no doubt on the (probably correct) assumption that it would seem too airy-fairy
    for the paper''s intended technical audience.


    So was Paul Bernays? Here''s a picture of him from 1928:


    ![](img/9989f4997c5d05c32e2f1cd1055a3106_257_0.png)


    Bernays was almost exactly the same age as Schönfinkel (he was born on October
    17, 1888—in London, where there was no calendar issue to worry about). He came
    from an international business family, was a Swiss citizen and grew up in Paris
    and Berlin. He studied math, physics and philosophy with a distinguished roster
    of professors in Berlin and Göttingen, getting his PhD in 1912 with a thesis on
    analytic number theory.


    After his went to the University of Zurich, where he wrote a habilitation (on
    complex analysis), and became a privatdozent (with the usual documentation, that
    can be found), and an assistant to Ernst Zermelo (of ZFC set theory fame). In
    1917 Hilbert visited Zurich and soon recruited Bernays to return to Göttingen.
    In Göttingen, for apparently bureaucratic reasons, Bernays wrote a second habilitation,
    this time on the axiomatic structure of *Principia Mathematica* (again, all the
    documentation can be found). Bernays was also hired to work as a "foundations
    of math assistant" to Hilbert. And it was presumably in that capacity he—along
    with Moses Schönfinkel—wrote the notes for Hilbert''s 1920 course on mathematical
    logic.'
  merge: -1
  pgno: 257
- img_proc: true
  md: 'Unlike Schönfinkel, Bernays followed a fairly standard—successful—academic
    track. He became a professor in Göttingen in 1922, until there he was dismissed
    (because of partially Jewish ancestry) in 1933—after he moved to Zurich, where
    he stayed and worked productively, in mathematical logic (von Neumann-Bernays-Gödel
    set theory, etc.), and he died in 1977.


    Back when he was in Göttingen one of the things Bernays did with Hilbert was to
    produce the two-volume classic Grundlagen der Mathematik (Foundations of Mathematics).
    So did the Grundlagen mention Schönfinkel?? It has one mention of the Bernays-Schönfinkel
    paper, but no direct mention of combinators. However, there is one cautious footnote:


    ![](img/9989f4997c5d05c32e2f1cd1055a3106_258_0.png)


    > ¹ Vgl. S. 78.

    ² Ein System von Ausgangformen, das durch Ableitung allenischer Implikationsformen
    ausreichend, von M. SCHONFINKEL aufgestellt. A. TARSKI hat erkannt, dass aus logisch
    für diesen Bereich die Formel I, II, und III


    ((A → B) → C) → (D → C) → C

    genngen. hier nicht die dritte Formel die obengenannte einfache errichtet werden.
    Von M. WASERNEK J. LUKASIEWIC verschiedene Formeln gefunden, die jede für schon
    als Ausgangform zur Ableitung allenischer ausreichend waren. Hierzu werden genannt
    von LUKASIEWIC und TARSKI: „Untersuchungen über den Aussenkalkül“ (C. R. Soc.
    Sci. Vol. 23. Wars 1930).


    This starts "A system of axioms that is sufficient to derive all implicational
    formulas was first set up by M. Schönfinkel...", then goes on to discuss work
    by Alfred Tarski. So do we have evidence of something else Schönfinkel worked?


    In ordinary logic, one starts from an axiom that gives relations, say about And,
    Or Nor. But, as Sheffer established in 1910, it''s also possible to give an axiom
    purely in terms of NAND (and, yes, I''m proud to say that I found the very simplest
    such axiom system in 2000). Well, it''s also possible to use other bases for logic.
    And this footnote is about using implications as the basis. Actually, it''s implicational
    calculus, which isn''t as strong as ordinary logic, in the sense that it only
    lets you prove some of the theorems. There''s a question again: what are the possible
    axioms for implicational calculus?


    Well, it seems that Schönfinkel found a possible set of such axioms, though we''re
    not told what they were; though Tarski later found a simpler set. (And, yes, I
    looked for the simpler axiom system for implicational calculus in 2000, but didn''t
    find any.) So again we see Schönfinkel in effect trying to explore the lowestlevel
    foundations of mathematical logic, though we don''t know any details.'
