    # Using Searching


    Data Modeler has strong search features. The improved search features were introduced
    in version 3.3. You are able to search in many ways and on many search levels.
    At the end of the search, you can produce a report from the search result. The
    Search operation will look only inside the scope selected. A global search will
    search the design and a model search will only search the model. You can find
    the Search operation in both the Edit (Find) and View (Model Search) menus, as
    well as in the right-click menu of a logical or relational model in the Browser
    pane. There is also a Search icon on the toolbar for the logical and relational
    models. In the View menu, you will also find Global Search, which will search
    throughout the whole design.


    You can use search for searching, but you can use it for reporting and setting
    common properties. You can make searches in two different modes: simple or advanced
    mode.


    # Reporting with Search


    The search functionality offers fine-tuned possibilities for finding the information
    needed and for turning that into a report. You can search in a selected scope,
    with a word or part of it, and with negation, or can search for an empty value.
    You could, for instance, look for all the columns that are of type XMLTYPE and
    create a report from them. Or you could find all the tables without a unique key
    and get a report of those. From the Results pane (see Figure 11-7) for a search
    operation, you''ll see a Report button. The Report button will be available as
    soon as you have selected the model from the Model list or when starting the search
    and the object'
