  md: '# Chapter 11: Generating Reports and Using Search 273


    # # Simple Mode


    In simple mode, you can search using strings, or you can use regular expressions
    as the search criteria. You can also run a report based on the search result or
    change common properties for the search result set.


    To start in simple mode, select the Simple Mode radio button and enter a string
    to be searched for in the box with the binoculars sign, as shown earlier in Figure
    11-7. Depending on what you selected in Preferences, the display either as you
    type or when you press ENTER.


    ![](img/431f8ac8f273fa89a28377c500ed60d7_299_0.png)


    > > TIP

    If you want to search everything, just type an asterisk (*) in the search field.


    Select All or one of the object types in Filter to limit the search. If you select
    Case Sensitive, the search will also check the case sensitivity. If you select
    Stop On First, the first occurrence of the result is displayed if there are duplicates
    under Name.


    In Results, you can see the elements that fulfilled the criteria. If you double-click
    an element in the list, you can see and edit the properties for that element.
    You can change the column order in Results by dragging and dropping the columns,
    and you can sort the result by clicking the column header.


    In Diagrams, you can see the diagram or diagrams where the object can be found.
    If you double-click the name, the diagram will open.


    If you want to save the search, go to the <New Search> field, enter a name for
    the search, click More, and select Save. If you select Clear for More, the search
    result will be deleted. Before deleting it, Data Modeler asks, "Are you sure you
    want to delete search?" If you use one of the saved searches, click the list button
    next to <New Search> and select the desired search from the list by clicking the
    pin icon, and if another operation is found, it will be on its own tab.


    If you use RegEx, you will have an enormous number of possibilities for searching
    the content in open designs with regular expressions. You can, for example, search
    for anything in open designs that have an indication of a URL (includes any of
    these strings: http://; https://; ftp://; or ftps://). The parentheses, (), group
    the elements into a single element, and the pipe symbol (|) says that one of the
    alternatives should match (or or ht). The question mark (?) says that the preceding
    pattern is optional. Then, the preceding regular expression matches it; +, and
    strings. Figure 11-9 shows an example of a search with a regular expression. The
    search returns the Comment property of an attribute EMPLOYEE.Information has the
    value\.


    The characters | and ? are called metacharacters, and using them makes regular
    expressions powerful. Another example of a metacharacter is {), which means an
    interval. {1} means exactly one, {1,7} means at least, and {1,7} means between
    1'
  merge: -1
