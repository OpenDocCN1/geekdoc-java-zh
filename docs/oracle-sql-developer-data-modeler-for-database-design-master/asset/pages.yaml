  md: '# What Is Database Design, Anyway?


    Databases lie at the heart of so much of what we do in the IT world that it''s
    surely obvious that they need to be properly designed. Yet neither design theory,
    nor design best practice, appear to be very well understood in the industry at
    large. (You only have to look at the Wikipedia article on database design to see
    the truth of these claims.) With this state of affairs in mind, therefore, I offer
    the following definitions:


    **Database design** Either logical database design or physical database design,
    as the context demands—though the unqualified term *database design*, or sometimes
    just *design*, is usually taken to mean logical database design specifically (unless
    the context demands).


    **Logical database design (or just logical design)** The process, of the process,
    of deciding what tables database should contain, what columns those tables should
    have, and what integrity constraints those tables and columns be subject to. The
    goal is to produce a design that''s independent of all considerations having to
    do with either physical implementation or specific applications (this latter objective
    being desirable for the very good reason that it''s generally not the case all
    uses to which the database will be put are known at design time). Overall, the
    logical design process can be summed up as one of (a) pinning down the table predicates
    and other business rules as carefully as possible, albeit necessarily somewhat
    informally, and then (b) mapping predicates and rules to specific tables, columns,
    and constraints—preferably in such a way as to ensure that the result of the process
    involves no uncontrolled redundancy. (I''ll explain in a few moments what I mean
    by the terms *table predicate, business rule, and uncontrolled redundancy.)'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Oracle SQL Developer Data Modeler for Database Design Mastery


    Physical database design (or just physical design) The process, or the result
    of the process, of deciding, given some logical design, how that design map to
    whatever physical constructs the target DBMS happens to support. Observe, therefore,
    that the physical design should be derived from the logical design and not the
    other way around; ideally, in fact, it should be derived automatically.


    For the remainder of this brief discussion, I''ll concentrate on logical design
    specifically. The first thing I want to say is that there exists some science
    that can help with the logical design process; I refer, of course, to such matters
    as the principles of further normalization and the principle of orthogonal design.
    Thus, if you''re a designer, you owe it to yourself—as well as your clients, which
    is to say the people who are going to live with the databases you design—to be
    familiar with those principles and to know how and when to apply them. As an aside,
    I note that there''s quite a bit of making many people realize. It''s certainly
    not a matter of making sure tables are all in third normal form. However, this
    is not the place to go into details.


    The second thing I want to say is that although the science is important, there
    are, sadly, numerous aspects of design that the science doesn''t address at all.
    And where practical experience comes in. If you do a lot of personal experience
    in the design field, good for you—you''ll learned (possibly the first way!) what
    works and what doesn''t. If you don''t have much of experience of your own to
    fall back on (and maybe even if you do), then you''ll need advice you can follow,
    advice from someone who has experience. A good book on design, by a suitably qualified
    professional, can help meet your need. A word of caution: Books on database technology
    (as opposed to books on design specifically) might not be what you need. Such
    books often describe concepts but fail to give guidance on how to apply these
    concepts to the practical task of design. Caveat lector.


    Let me elaborate as I promised on these terms table predicate, business rule,
    and uncontrolled redundancy. First, the predicate for a given table is simply
    a reasonably precise, but informal, statement in natural language of what the
    table in question means—in other words, how that table is meant to be understood
    by users. For example, suppose we have a table called EMP (“employees”), with
    columns called ENO, ENAME, DNO, and SALARY. Then the predicate for that table
    might look something like this:


    > The person with employee number ENO is an employee of the company, named ENAME,
    works in the department with department number DNO, and is paid SALARY.'
  merge: -1
  pgno: 14
- img_proc: true
  md: "Forewards XV\n\nENO, ENAME, DNO, and SALARY are the parameters to this predicate,\
    \ and of\ncourse correspond to the columns of the table.\n\nSecond, a business\
    \ rule is also a reasonably precise but informal\nlanguage statement, one that\
    \ captures some aspect of how the data in the database\nis supposed to be constrained.\
    \ (Actually, some writers refer predicates as a\nspecial case of business rules;\
    \ however, there's more to business rules in general\nthan just the table predicates\
    \ as such.) To start with, there'll be rules that\nspecify what type of information\
    \ is denoted by the parameters to those table\npredicates; in the case of employees,\
    \ for example, there'll be a rule to the effect that\nSALARY parameter (\"salaries\"\
    ) denotes money values, expressed in, let's say,\neuros or U. dollars. Then there'll\
    \ be rules that constrain the values those\nparameters can take for a given employee\
    \ considered in isolation (for example, a\nrule that says salaries must be negative\
    \ and less than some specified\nupper limit). There'll also be rules that constrain\
    \ the set of employees taken as a\nhole, independent of other \"entities,\" that\
    \ might be\represented in the same database (for example, a rule to the effect\
    \ that employee\nnumbers must be unique). Finally, there'll be rules that constrain\
    \ employees\nconsidered in combination with other entities (for example, a rule\
    \ to the\nthat every employee must be assigned to some known department, or a\
    \ rule to the\nthat no employee can earn more than the manager of the department\n\
    employee in question is assigned to).\n\nI'd like to say more about this business\
    \ rules, because it's important—\nalso in practice it does tend to get somewhat\
    \ overlooked. The foregoing\ndiscussion should be sufficient to suggest, business\
