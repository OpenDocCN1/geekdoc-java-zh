  md: '# User-Defined Types


    There are four kinds of user-defined data types in Data Modeler: distinct types,
    structured types, collection types, and logical types.


    Logical types are not actual data types; they are names that can be associated
    with native types of the selected relational database management system (RDBMS)
    and then defined as a data type for attributes or domains. To create a logical
    type or to edit an existing one, choose Tools | Types Administration (Figure 4-6).
    To create a new one, define a user-defined type for a selected RDBMS type (Oracle
    12c, SQL Server 2008, and so on) on the User Defined Native Types tab. Click Save.
    Then give a name for the new logical type and select the native type you just
    created for the RDBMS type. Click Save. Now you can see this new logical type
    with the native type settings in the Logical Types To Native Types tab. And it
    can be selected as a data type for an attribute or a domain. I have used this,
    for example, with a new Microsoft SQL Server version that had new data types that
    Data Modeler did not


    ![](img/431f8ac8f273fa89a28377c500ed60d7_94_0.png)


    FIGURE 4-6. Types administration dialog'
