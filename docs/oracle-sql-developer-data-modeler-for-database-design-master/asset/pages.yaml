  md: '# Chapter 9: Using Version Control and Working in a Multiuser Environment (Subversion)


    Subversion can be used for both version control and to enable a multiuser environment
    when working with Data Modeler. In this chapter, you will learn how version control
    (Subversion) works with Data Modeler, including how to add designs to version
    control and how to work with them. You will also explore how to solve possible
    conflicts. In this chapter, you will also learn how Microsoft Excel can be used
    to enable a multiuser environment.


    # Chapter 10: Documenting an Existing Database


    It is important to have documentation for your databases. If you do not understand
    your data, you cannot keep it up to date, secure, of good quality and so on. changing
    the data structures based on the current requirements is impossible if do not
    understand what you are changing. Documentation is also vital when solving problems
    related to data such as performance. With Data Modeler you can document an existing
    database by reverse engineering the database from the data dictionary or from
    existing DDLs, you can use the documentation you might have from a third-party
    modeling tool and import that to Data Modeler, or you can combine these methods.
    In this chapter, you will learn about all these options.


    # Chapter 11: Generating Reports and Using Search


    Reporting functionality is a must when selecting a tool for database design. If
    you are not able to produce reports from the tool, the tool is not worth using.
    There are so many different needs for reporting: auditing, quality reviews, documenting,
    talking with end users, informing internally, and so on. Data Modeler has strong
    reporting functionalities, and in this chapter you will learn more about them.


    # Chapter 12: Comparing Designs and the Database


    There are many situations when you need to compare either two designs with other
    or the design with the database. In this chapter, you will learn how to do comparisons
    with Data Modeler and how to change either a design or a database based on the
    result.'
