    # # What Is Oracle SQL Developer Data Modeler?


    Oracle SQL Developer Data Modeler (referred as Data Modeler in this book) is a
    free tool for designing and documenting databases and data architecture. It supports
    not only Oracle databases but also DB2 and Microsoft Server databases, and at
    a certain level, any standards-based database that has a Java Database Connectivity
    (JDBC) connector. Data Modeler supports all the steps in database design and database
    with easy forward and backward engineering. After you have designed your database
    and have a physical model for it, you can export the scripts to the database objects.
    Data Modeler also supports different kinds of models and multidimensional models.
    Data Modeler helps you keep your databases documented and enables to be agile.
    The tool is available as a stand-alone product, but it is also integrated into
    Oracle SQL Developer, so you can decide which way is the best for you to use.
    The tool is simple, and is supported by Oracle if you have a database support
    contract.


    Data Modeler offers the following features for database designers:


    +   - **Database design tools** A collection of metadata about database is called
    a design in Data Modeler. A design consists of the logical models, multidimensional
    models, relational models, relational domains, data type models, process models,
    business information, and request requests, as well as all the objects they need.
    Every object (entity, table, diagram, and so on) is a single Extensible Markup
    Language (XML) file in a hierarchy that the tool creates automatically. The design
    itself is saved with the extension .dmd, and the .dmd file contains pointers to
    individual XML files.

    - **Customization** You can tweak Data Modeler to your liking. In Preferences,
    you can, for define where to keep your working copy of designs.

    - **Version control** Data Modeler is integrated into a version control tool called
    Subversion. This integration allows you to have multiple users'
