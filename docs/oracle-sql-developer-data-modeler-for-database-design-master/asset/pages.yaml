    names in entity names and plurals in table names. For example, you can type STUDENT
    for the entity Name and type STUDENTS for the entity. Then select both Name Translation
    and Use Preferred Abbreviations when engineering. Now your tables will have plural
    names, while your entities still have singular names. Make sure to leave the Preferred
    Abbreviation property empty for those entities and attributes you do not want
    to use abbreviations for relational objects.


