    # Setting Preferences and Properties


    There are no properties that affect the reporting functionality, but there are
    two preferences that do. In Preferences (choose Tools | Preferences), go to the
    Data Modeler | Reports tab to define the Default Report Directory setting where
    the reports will be saved by default. If you have downloaded the Saxon XSLT 2.0
    processor and want Data Modeler to use it for generating reports, you can define
    the path for it in Path To Saxon XSLT 2.0 JAR File. If you do not specify the
    path, Data Modeler uses XSLT 1.0 for reporting. Since version 4.1, you can also
    define your Company Name to be used in reports and decide whether a page break
    will be added after each object.


    There are some preferences in the Preferences dialog that affect the search functionality
    that can be used for reporting. You can find them by going to the Data Modeler
    | Search tab. You can define whether the search will start after ENTER has been
    pressed or while typing. If you want it to start typing, you can also define the
    method of symbols before starting the search. The default is three characters.
    With version 4.1, you can also define search profiles to be used while searching.
    A Search Profile can be used to narrow down the scope for a search operation.


