  md: '# 70 Oracle SQL Developer Data Modeler for Database Design Mastery


    # Sensitive Data


    In Oracle Database Edition there is an optional feature (included with Advanced
    Security) that allows different treatment for data that has been defined as sensitive.
    Please read more about that in the Oracle documentation. Data Modeler supports
    designing sensitive data. In Data Modeler, you can define sensitive types and
    associate them with Transparent Sensitive Data Protection (TSDP) policies. You
    can create a new sensitive type in the Browser pane by right-clicking Sensitive
    Types and selecting New Sensitive Type. A sensitive type should always have a
    name. If you select Generate DDL in the sensitive type properties, it means that
    the sensitive type will be created when the DDL statements are generated, and
    if you select Enable, you let the sensitive type selected for association with
    an attribute or column. A sensitive type also has a description, comments, and
    notes, and on the Used tab in the properties you can see where this particular
    sensitive type has been used.


    You can create a new TSD policy by right-clicking Policies in the Browser pane
    and selecting New TSD Policy. You must define a name for a TSD policy and decide
    whether it will be included when generating the DDL. A policy can also have subpolicies
    that have properties for redaction policies (in the user interface erroneously
    referred to as masking policies); this will be fixed in later releases of Data
    Modeler), as shown in Figure 4-7. You can manage redaction policies/masking


