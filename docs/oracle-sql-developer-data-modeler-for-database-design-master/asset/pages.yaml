  md: '# Creating the Physical Model and Exports


    In the physical model for an Oracle database, you can define some properties for
    dimensions. Otherwise, the physical model is defined as described Chapter 6. To
    get your dimensions to the physical model, you go to the multidimensional model
    in the Browser pane, right-click, and choose Engineer To Oracle Model. If you
    choose Engineer From Oracle Model, the multidimensional model will be created
    based on the physical model and parameters given during the reverse engineering.


    The DDLs for creating relational objects can be exported as described in Chapter
    7. The multidimensional model can be exported to cube views metadata, to Microsoft
    XMLA, or to Oracle Analytic Workspace (Oracle AW). You can find all of these options
    in the File menu under Export. The DDLs for cube views metadata and Microsoft
    XMLA can be generated without a connection to a database, but Oracle AWs can be
    generated only with a connection to a database.


    > NOTE Multidimensional views can also be imported to Data Modeler.


