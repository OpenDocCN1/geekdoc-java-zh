    If you attached a glossary to a design on the Naming Standards of the Properties
    dialog (see Chapter 2), you can use the glossary words to replace the names for
    entities and attributes with others names defined in a glossary when engineering
    to tables and columns. You can do that by selecting Apply Name Translation. If
    you have defined a plural in the glossary for a table, that will be used for name
    translation; otherwise, the Abbreviation setting is used. If you do not have a
    plural or an abbreviation defined for a table, then the Alternative Abbreviation
    setting will be. For a column, the order is Abbreviation, Plural, and Alternative
    Abbreviation, depending on which of them has been defined for a column. If the
    glossary has no definition for the word, the entity/attribute name is used.


    During the name translation, also the model-level properties set on the Naming
    Options tab are followed by using the glossary. If the new name doesn''t obey
    the Max Name length, then the Alternative Abbreviations are used for translating
    the name. If the Character case is set to Mixed, no case transformation is performed.
    If it is set to Upper Case or Lower Case, the possible translation for cases is
    done. So, if you select Apply Name Translation, the tables and columns might not
    be called the same as the related entity and its attributes, but the names will
    be translated according to the glossary. The same applies also for reverse engineering
    (Engineer From Relation To Logical). If you have the Apply Name Translation option
    selected when engineering, you should also it enabled when reverse engineering
    if you do not, the names will be changed for entities and attributes like they
    are for tables and columns.


