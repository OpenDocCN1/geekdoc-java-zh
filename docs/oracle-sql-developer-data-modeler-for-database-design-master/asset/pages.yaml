- img_proc: true
  md: '# 182 Oracle SQL Data Modeler for Database Design Mastery


    Designing a data warehouse (DW) database is usually different from designing an
    operational database, which is a database for online transaction processing (OLTP).
    A DW database can be designed like any other database using the principles of
    entity-relationship (ER) modeling, as third normal form (3NF) and so on, but usually
    that is not an optimal solution because of the complex relationships, drill-downs,
    and so on. Therefore, you can use a logical design technique called dimensional
    modeling to design a data warehouse. The biggest difference is that designing
    a dimensional model is about business rules, while designing a ER model is about
    data and rules.


    An operational database usually faces a lot of short and fast inserts, updates,
    and deletes and reasonably select queries for fundamental operational tasks, while
    a DW database is usually for bulk loading and complicated queries on a large amount
    of data for planning, analyzing, and decision support called online analytical
    processing (OLAP). The data for a DW database comes from several other databases,
    and the data can be transformed or consolidated on the database. There are several
    techniques for modeling a DW database: ER modeling (3NF), dimensional modeling
    (the most popular ones are star schema and snowflake), and Data Vault (a hybrid
    of ER and dimensional modeling). These techniques also include pattern solutions
    for known issues when designing a DW database. Often de information marts ( they
    are called in Data Vault 2.0) that include one or more dimensional models. The
    dimensional modeling is done with ER notation. If the database supports OLAP features,
    multidimensional notation can be used on top of the multidimensional modeling.
    Multidimensional modeling includes the concept of cubes.


    When designing a DW database, your tool should support ER notation, classification
    types, dimensional modeling, reverse engineering of the sources, forward engineering
    for the DDLs, to target mapping, a data dictionary/repository for the elements
    in design, reporting capabilities, and multidimensional modeling. Data Modeler
    supports all this.


    This chapter does not go into all the details of designing a DW database, which
    would be a topic of a whole new book, but you will learn how Data Modeler can
    help you when designing a DW database.


    # Introducing Dimensional Modeling Techniques


    In an OLAP environment, the queries to the database can be much more complex than
    the ones in OLTP. Here''s an example of a two-dimensional query in OLTP: "How
    much of product has been sold this month?” In an OLAP environment, the query is
    probably not two-dimensional but multidimensional;'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# Chapter 8: Designing a Data Warehouse Database 183


    it is probably something like this: “How much of each our products was sold on
    a particular day, by a particular salesperson, in a particular city?” In a multidimensional
    model, each separate part of that query is called a dimension. In a database in
    an OLAP environment, many of the answers to the subqueries are not calculated
    but determined from the database.


    Several techniques are available for modeling a DW database with a dimensional
    model. You will learn about three of them: star schema, snowflake, and Data Vault
    model. These techniques include the modeling techniques and predefined solutions
    for known issues in DW databases.


    A star/schema model is based on one central table (fact) and several tables that
    radiate from primary and foreign keys. The snowflake schema is also based on a
    central table (fact) and a set of constituent dimension tables that are further
    normalized into subdomain tables. The Data Vault model consists of three basic
    parts: the architecture (systems), three-tier methodology (rules on how and why),
    and the model (standardized data model with strictly defined entities). The Data
    Vault model is a combination of the star schema and 3NF. The model is based on
    three key components: hubs, links, and satellites. A hub is a unique list of business
    keys for tracking and identifying key, a link is an association to together multiple
    sets of information, and a satellite is a descriptor that provides context for
    hubs and links.


    When building data warehouses using the agile methodology, the Data Vault method
    is the most flexible and probably the best for the purpose. But what is the difference
    between star schema and snowflake, and which one should you choose? Snowflake
    has less redundancy than star schema since the dimension tables are in normal
    form. That makes a snowflake model is easier to maintain, but queries on it might
    get complicated and therefore perform badly. The snowflake model is good with
    dimensional analysis, whereas star schema is better for the data warehouse core
    and when there are complex many-to-many relationships, and simple relationship
    relationships (one-to-one and one-to-many). Snowflake modeling is a bottom-up
    approach, and star schema is a top-down approach to modeling.


