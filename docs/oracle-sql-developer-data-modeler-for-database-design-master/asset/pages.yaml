    Metadata. Insert the default schema, select Dimensional Model And Relational Model
    And Physical (DB2 UDB) Model, and click OK. Then you can define the filename for
    the XML file and the location it will be saved. Now you can deploy it in a UDB
    v8.1 physical environment.


    If you want to export as a Microsoft XMLA (XML for Analysis), select Microsoft
    XMLA. Type the database name, select the dimensional model, and click OK. Then
    you can define the filename for the XML file and the location where it will be
    saved.


    If you want to export as Oracle AW, select Oracle AW. Define the default schema,
    select the dimensional model, the relational model, and the physical model (Oracle
    Model). Define the Oracle AW name and select the export model (Recreate AW or
    Export Metadata To File Only). If you want the cubes to be populated, select Populate
    Cubes. Define the Output XML File, which is the XML file for the exported definition.
    You can specify the output directory by clicking the box with three dots (...).
    You select a JDBC connection or create a new one with the Create button next to
    New JDBC Connection. To test the connection, click the Test button next to Selected
    Connection. On the Cubes And Slices tab, you can select cubes and slices to be
    included or excluded. By exporting to an Oracle analytic workspace, you can create
    the analytic workspace based on a multidimensional model.'
