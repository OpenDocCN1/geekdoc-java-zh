  md: '# Oracle SQL Developer Data Modeler for Database Design Mastery


    The process of creating the conceptual database design mainly consists of transforming
    the conceptual model (logical model) into a relational model. Usually is called
    the logical data model, but in Oracle SQL Data Modeler it is called a relational
    model. The result of this phase of database design is the relational database
    schema, which is a set of relational schemas and their constraints. If the conceptual
    design was done with Data Modeler, engineering to the relational model is easy.
    If it was done with another tool or without a tool, the first step is to insert
    all data into Data Modeler to be able to use the functionalities Data Modeler
    provides for the transformation.


    The database design process starts with the entity-relational (ER) model that
    was created in previous phases of database design. Depending on how well it was
    done, you either continue working on it or you move towards transformation. Usually
    the model is not complete; you might need to add more attributes, define the data
    types, and so on. Now it''s you starting thinking about whether the entities and
    relationships are modeled according to relational theory, and you make decisions
    on more difficult issues about modeling. This is the point where you know how
    this database will be used (its functional models).


    If it not done earlier, it is good to start thinking about what to do with the
    data history, whether you need a security solution, what kind of roles there are
    for the users, and so on. It will be easier to implement these functionalities
    when there is a clear vision and understanding of the database.


