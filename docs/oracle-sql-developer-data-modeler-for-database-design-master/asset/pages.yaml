    For Subtype Implementation (Figure 4-20), you can also specify a discriminator
    column, which is often used when generalization, a single-table implementation,
    has been selected. I will discuss more about that in this section.


    There are three ways to implement the inheritance in a relational model: specialization
    (table for each entity), generalization (single table), or neither of those (table
    per child). There is no right way to model an inheritance; it always depends on
    what the requirements are.


    Specialization of an entity means that the entity is divided into subtypes. instance,
    an entity Customer may be divided into Person and Customer. All common attributes
    will be in the Customer entity. Person and Customer will have only the specific
    attributes for those entities. This is similar to what you saw in the arc solution
    in Figure 4-16. In Data Modeler this is called Table For Each Entity, (see Figure
    4-20) to Table For Each Entity, and you can select it by setting the Subtype generation
    in the Entity Properties dialog (see Table For Each Entity selected, all entities
    in the current subset will be selected for engineering.


    There are several questions you should ask to be sure that the solution is the
    right one. Can a Customer be a person or a company? Usually this is not a good
    solution in the sense of performance because you probably need to join these tables
    quite often.


    Generalization of an entity means that a supertype entity will be created for
    a set of entities. It is possible that a subtype has attributes that are not suitable
    for all entities generalized under this supertype. Let you have entities called
    Customer, Company, and Person. You can generalize all of these under a supertype
    called Customer. This subtype now generalizes the subtypes. The subtype inherits
    the attributes from the supertype and also has attributes of its own. In Data
    Modeler, this is called Single Table, and you can select it by setting the Subtype
    Generation option in the Entity Settings dialog to Single Table. In Data Modeler,
    the Engineer To property for this will be set, and it will be cleared for all
    subtypes in the current subset.


    In reality, you will probably need a new attribute to describe what type of Customer
    each customer is, such as a CustomerType attribute, because there is probably
    a requirement for that. In Data Modeler, you use a discriminator column'
