    # # Entity Views


    An entity view is an element in the logical model that allows a designer to create
    a new level for the conceptual model. This level is to make the design more concrete
    for business owners to understand. The entity views can be combinations or subcategories
    of the entities in the model. An entity view can be forward engineered as a view
    in the relational model and as a view in the database if needed.


    You can create a new entity view by clicking the New view beside the New Entity
    icon on the Data Modeler canvas as an entity but with an orange background color.
    There is the name of the entity view, and the attributes are selected in that
    view. On the bottom of the entity view there are the entities that are used in
    the entity view. In the View Properties dialog (Figure 4-16), you can name the
    entity view and build the view with Query Builder. You will learn more about Query
    Builder in Chapter 5. If you select Auto Join On Relationships, the relationships
    will be created for your view'
