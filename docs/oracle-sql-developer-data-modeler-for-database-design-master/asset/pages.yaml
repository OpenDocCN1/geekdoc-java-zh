    # Summary


    Before starting to use Data Modeler in production with several users in your organization,
    it is wise to set some standards and customize Data Modeler for your needs. It
    is important to agree on which version of the tool to use, who will use the tool,
    and for what purpose. You will also want to decide what a design is in your organization
    and how you will name your designs.'
  merge: -1
