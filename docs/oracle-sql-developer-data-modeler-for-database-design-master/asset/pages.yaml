- img_proc: true
  md: 'Enterprise applications are used to enable business. A great application not
    only supports a process but allows the organization to understand what is happening
    and allows it to respond. Key to all this is the data, and a well-designed database
    allows that access and flexibility.


    My reality is whenever I have struggled to get the information I need from an
    application, it has been because of poor database design. This book will reinforce
    the need for good-quality database design.


    > Debra Lilley

    ACE Director


    The idea of producing a formal database design is regarded by many as being old-fashioned
    these days. However, from my 25+ years’ experience of working in the field of
    database performance, I do see a clear correlation between the time spent designing
    a database up front to meet the functional requirements and the chance of success
    of the project. The correlation in the other direction is even clearer; if time
    is not invested in understanding the requirements of the application system and
    in understanding the database that stores its data, then the chances of building
    a system that meets user requirements is small, and the probability of heading
    off on a tangent from the core requirements is greatly increased. Performance
    cannot be retrofitted to a system; it has to be designed in.


    Using tools to help automate the design process, as recommended in this book,
    reduces the time needed for the design stage and makes it less likely that there
    will be a temptation to short the design stage. And that has to be better for
    everyone.


    > Graham Wood

    Architect

    Oracle Corporation'
