    If you select Prefix For Columns From Entity Hierarchies, the column names for
    tables in hierarchies will have the table name as a prefix for a foreign key or
    a primary key column even though you might have applied Name Translation and Used
    Preferred Abbreviations for all other column names. If Prefix For Columns From
    Entity Hierarchies is not selected, the same rules for defined other tables will
    be followed.


    Sometimes there are technical columns you would like to add to tables, but there
    is no need to have those on your entities. These columns could be CreatedDate,
    Creator, ModifiedDate, and Modifier. There is a simple way of adding these columns
    to every table or a set of tables with Data Modeler during the Engineer To Relational
    Model transformation. All you need is a table called _template that will include
    only the columns you want to add to other tables. In this example, that would
    be table_template (CreatedDate, Creator, ModifiedDate, Modifier). On the Engineer
    To Relational Model screen, first select all tables where you want to add those
    columns and select Use Template Table. Then select the table_template from the
