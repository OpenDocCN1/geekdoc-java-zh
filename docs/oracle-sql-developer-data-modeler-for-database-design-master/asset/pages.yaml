  md: '# Chapter 2: Getting Started with Oracle SQL Developer Data Modeler 29


    # Introducing Domains


    As mentioned, domains are predefined data type definitions that include all the
    information needed for a certain kind of data such as address, money, or Social
    Security number. Domains and their definitions are saved in XML files.


    ![](img/431f8ac8f273fa89a28377c500ed60d7_55_0.png)


    > TIP

    Domains are useful for standardizing attribute and column properties and improving
    the design quality.


    # Creating a Domain


    The domain definitions are Data Modeler installation-level settings. The location
    of a domain file is set in the Default System Types Directory preference, and
    Data Modeler names the file defaultdomains.xml. You can see the set of domains
    your installation of Data Modeler is using in the Browser under domains.


    You can administer domains by choosing Tools | Domains Administration; the Domains
    Administration dialog opens. You can select an file of domains by clicking the
    Select button and finding the file you wanted or create a new one by typing a
    name that does not exist. If you do not select anything, the default file (defaultdomains.xml)
    will be used.


    ![](img/431f8ac8f273fa89a28377c500ed60d7_55_1.png)


    > NOTE

    Data Modeler will not use changes in any other file except defaultdomains.xml
    in the directory set in the Default System Types Directory preference.


    To create a new domain, click Add in the Domains Administration dialog. Fill in
    the domain definitions (as shown in Figure 2-13) and click Apply. Then click Save.
    The changes will be saved in the file shown in the Domains field in the Domains
    Administration dialog.


    In Data Modeler you can also define other things for domains than just data types
    and lengths. You can define constraints, ranges, lists of values, and rules for
    sensitive data. Figure 2-13 shows a domain called Boolean. You will want to use
    this domain whenever you have an attribute that has the value True/False. You
    can define those values by clicking Value List. If you want to make these changes
    to an existing domain definition, click Modify and then click Value List. To add
    new allowable values on the list, click Add. The List Of Values dialog opens,
    as shown in Figure 2-14. Fill in the value and the description. After you have
    added all the values needed, click OK.


    Next you want to define a domain called Category so you can define a range for
    that domain. Select the domain called Category in the Domains Administration'
