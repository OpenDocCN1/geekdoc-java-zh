  md: '# 28 Oracle SQL Developer Data Modeler for Database Design Mastery


    define the separator for terms that have multiple words. The separator settings
    are checked every time a glossary is loaded into the Glossary Editor, and a warning
    is given if you have any violations. Words in the list can be filtered by Filter,
    which restricts the display to entities by their classification: Prime Word, Class
    Word, Modifier, Qualifier, and Unclassified. Unclassified shows items that have
    no classification.


    You can add new words to a glossary with the green plus button and remove them
    with the red X button. A name is the only elementary element for a glossary word.
    A word can have a plural and an abbreviation. It can also have an alternative
    abbreviation (Alt. Abbr.). Classify the glossary entity as well as possible by
    choosing all classification types to apply to this word. Available classification
    types are as follows:


    +   - A prime is the prime word for the object defined; prime words are usually
    listed as keywords. Typically the word Customer in Customer Name is a prime word.


    +   - Class words are words that identify the use or purpose of the word. Name
    in Customer Name would be an example of a class word.


    +   - A modifier gives additional information about either the class word or the
    prime word. Official in Official Customer Name would be a modifier word. A modifier
    can be an adjective or a noun.


    +   - A modifier is a special class of modifier that gives information about the
    qualification within domain values. Weeks in Delivery Time in Weeks is an example
    of a qualifier.


    It is also good practice to write a description for a word, which can be done
    in Short Description. If you want to edit an existing glossary entry, select it
    and modify it.


    You can create a new glossary on a logical model by right-clicking the logical
    model in the Browser pane and selecting Glossary From Logical Model. But you should
    not do that before the logical model is ready if you have edited the glossary
    and then generate the glossary again based on the logical model, all your manually
    edited changes will lose. Either you always generate the glossary based on a logical
    model and define all the information needed or you generate it only once and update
    it manually.


    # Sharing a Glossary with Other Users


    Once you have defined a glossary, you can share it with other users by saving
    the file and sharing it. You can also export it by clicking the Export button
    in Preferences, and you can import one by clicking the Import button. The default
    directory for glossary exports is the Default Save Directory preference covered
    earlier. The exported file is a .csv file.'
