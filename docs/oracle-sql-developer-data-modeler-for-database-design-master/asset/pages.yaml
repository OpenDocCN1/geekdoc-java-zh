    model, and export the DDLs as explained in Chapters 3 through 7 or get the ALTER
    DDLs by synchronizing with the model, as explained in Chapter 12.


    Of course, there are situations in which you do not need the logical model, and
    therefore there is no point in creating it, such as if the database structures
    are maintained by a software vendor or if the changes are very small, as when
    adding a single column to a table. In these cases, you simply add columns to tables'
