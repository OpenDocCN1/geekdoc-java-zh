  md: '# Chapter 2: Getting Started with Oracle SQL Data Modeler 11


    # # What Is a Design?


    In Data Modeler the collection of objects you create is called a design. A design
    consists of one Extensible Markup Language (XML) file with the extension .dmd
    (for example, Customer.dmd), a directory (for example, Customer), and subdirectories
    and XML files. Each element (for instance, a design, a table, or an entity) in
    a design has its own XML file and its unique identifier (object ID). The .dmd
    file creates all the needed directories and subdirectories pointers to information
    in all these. Data Modeler creates automatically when you create a design. You
    should not edit these XML files outside the tool unless you really know what you
    are doing because you breaking files. Common reasons for an XML file to break
    is using an editor that does not support XML or using the wrong character set.
    If you break one of these files, Data Modeler will not be able to read it.


    > > TIP\ If you want to give the design to another Data Modeler user, just compress
    the .dmd file and the directories in one .zip file and pass that to the other
    person.


    A design consists of one logical model, optionally one or more relational models
    that are based on that logical model, and optionally one or more physical models
    that are based on one relational model. There can also be multidimensional models,
    data type models, process models, domains, business information, and so on.


    You need to decide what a design will consist of before starting to use Data Modeler
    in production: how you will name it. A design can consist of all the databases
    in your organization, one database instance, one schema, or something totally
    different. You''ll want to define what a design is so you know how you want to
    deal with objects that might be shared between applications, schemas, or databases.
    If you want to share objects, they should be in the same design since Data Modeler
    does not fully support sharing objects between designs designs Also, it is valuable
    to decide who will use Data Modeler and what they will do with it. This decision
    might help you to understand what a design means in your organization and to give
    the right privileges to the people in your organization. In addition, you should
    create a naming standard for your designs. For example, you could call a design
    Customer or CUSTOMER or CustomerDB or CustomerData. Which one will you use? It
    is much more efficient if designs are named consistently and you know where to
    find them.'
  merge: -1
