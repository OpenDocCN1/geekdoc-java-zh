    # Other Elements


    If you want to have the whole database designed and documented in Data Modeler,
    you can do that. You can add a database with its properties to the physical model
    to get the DDL for it. In Database Properties, you can define properties on the
    General, Logging, and Tablespaces tabs, and you can write comments. After defining
    the database for the physical model, you can see in the Browser pane branches
    for adding data files, redo log groups, and SYSAUX files to that database.


    You can define directories and disk groups, and you can define contexts, which
    are sets of application-defined attributes that validate and secure an application.
    A cluster is a schema object that contains data from one or more tables. The idea
    of a cluster is that the data that are retrieved together are saved close to each
    other to enable fast performance. All the tables in a cluster must have at least
