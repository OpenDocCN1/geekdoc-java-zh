  md: '# Propagating Properties


    In most of the properties dialogs you will see a Propagate Properties button.
    This is useful functionality when you have defined the properties for one kind
    of object and want to have the same property copied to other objects of the same
    type. For instance, you might have defined the properties for a table such as
    User, Tablespace, Logging, Storage, Row Dependency, Row Movement, and Permissions,
    and you want to have the same settings for another 25 tables. Instead of manually
    entering all this information for your 25 tables, you can use the Propagate Properties
    utility. After setting the properties wanted on one table, just click Propagate
    Properties. The Propagation dialog opens when you can select which properties
    to propagate and then which objects these properties will be propagated. This
    tool will probably be your or your DBAs'' favorite tool in the physical database
    design


    > TIP

    You can use the Propagate Properties button for copying privileges. You can define
    privileges for one table and click Propagate Properties to copy the same set of
    privileges to other tables.


    ![](img/431f8ac8f273fa89a28377c500ed60d7_185_0.png)


    # Indexing


    Defining the indexes so that the database can perform as well as possible is one
    of the most important tasks in physical database design. To be able to do that,
    you must know what index users are going to go to the database, and what you must
    understand what kind of index tasks your RDBMS supports. There are plenty of books
    on indexing theory as well as indexing on a particular RDBMS. Please study these
    for more information on indexing, especially indexing for your RDBMS. In this
    book, I will talk about the topic briefly.


    An index is a database object that provides a quick lookup of the data in a database.
    There are different types of indexes for different kinds of searches. Usually
    an index is justified by its usage: the amount of data, how the data is mainly
    used (select/update/insert/delete), and the frequency of selects. If the amount
    of data is small, there is probably no need for an index. If the data is mostly
    inserted, updated, and deleted, it might not be a good idea to add an index because
    indexes make only selects faster while making other operations slower. If you
    have a query that is run only once a year, it might not be a good idea to have
    an index supporting it in the database for 12 months a year. An index is defined
    for a column or columns in a table, and it supports select queries only with those
    columns in the WHERE clause of the query. An index does not support all the queries,
    and it is not a silver bullet for performance.'
  merge: -1
  pgno: 185
- img_proc: true
  md: '# 160 Oracle SQL Data Modeler for Database Design Mastery


    There are different kinds of indexes. The most common is a B-tree index (B-tree,
    B+-tree, B*-tree); for spatial data there is the R-tree index (R-tree, R+-tree,
    R*-tree), and there are the following: bitmap index, context index, multilevel
    index, hash index, function-based index, bitmap join, reverse key index, and so
    on. A primary key has indexes called a primary index, and a table can have only
    one of them. Many indexes for foreign keys are created to support the joins and
    to avoid locking problems. But to be able to decide about other possible indexes,
    you should research the most queries and their frequency. If the query retrieves
    a small part of the data in a table, an index might be not useful because a full
    table scan will be more efficient.


    When defining the index, it is vital to set the index columns in the right order,
    with the most selective ones in front. Also, the columns using "equals" to evaluations
    would be set in front of the index and the ones used in range evaluation at the
    end. When using an index in performing a query, usually the biggest cost comes
    if you need to go to the table to get something. For reason, sometimes in the
    WHERE, JOIN, ORDER BY, or SELECT part of a query are added to the index to avoid
    the need to access the table. Make sure you do not have too many indexes in a
    table and that they are not too similar. Remember that updating a column in an
    index costs two to three times more than a column not in index. Be careful when
    selecting the columns for the index, make sure they are in right order, and you
    can also use temporary indexes in some cases.


    ![](img/431f8ac8f273fa89a28377c500ed60d7_186_0.png)


    > TIP Using the wrong data type in a query can prevent using index because a data
    conversion must be done. Make sure you know what data type the column is in order
    to query correctly. For instance, WHERE ProductID = 123 would not perform well
    since ProductID is numeric and it is compared to a character set.


    An index is created in the relational model, and it will be immediately visible
    in the physical model''s Browser pane under the table it is attached to. In the
    physical model, you can add all the physical properties for the index in nine
    tabs: General, Columns, Column Sort Order, Index Parameters, Global Partitioning,
    Hash/ Composite By Tablespaces, Global Partitions By Quantity, Spatial Index,
    and Comments. On the General tab, you define Bitmap Index (NO/YES); Indextype
    (you can type whatever you want, and that will be in the DDL for the index type);
    Tablespace; Logging (YES/NO); Storage (select a storage template from a list);
    Compress; Parallel (NO/YES); if you set Parallel to YES, then you can also define'
