    and choosing New SubView. Or right-click the canvas and choose Diagram | Create
    SubView. After right-clicking and selecting Subviews also have properties, and
    it is wise to name all the additional subviews to make finding the correct one
    easier. A subview can be named via its properties.


    All new entities are automatically added to the logical diagram. Only changes
    made to an object that already exists in other subviews will be shown there. Relationships
    between entities that have been selected on a subview will be shown; if not all
    the entities needed have been selected, the relationship will not be shown. You
    can add new entities and relationships and make any changes in any of the subviews,
    and all the changes will be made automatically in the relevant subviews. All the
    objects are in Data Modeler once, and subviews are just an interface to them.
