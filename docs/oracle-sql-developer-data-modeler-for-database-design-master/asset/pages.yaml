    # # Comparing Two Designs


    There are two ways to compare two designs: You can choose File | Import | Data
    Modeler Design, or you can choose tools | Compare/Merge Models. The Import | Data
    Modeler Design method is for comparing two designs in every level: logical models,
    relational models, physical models, and so on. The Compare/Merge Models method
    is only for comparing the relational and physical models. The Compare Dialog where
    the comparison is done in the latter case is the same dialog that will be used
    when importing DDLs, importing from a data dictionary, or when using the database
    synchronization.


    # # Importing a Data Modeler Design


    If you want to compare the logical models, in addition to the relational and physical
    models, and apply changes from there, you should use the File | Import | Data
    Modeler Design. Open the target design (target) in Data Modeler. Then choose File
    | Import | Data Modeler Design. Select the source design on the Import screen.
    Select the Logical Model setting if you want to compare logical models and the
    relational model if you want to compare that. For the relational model, you can
