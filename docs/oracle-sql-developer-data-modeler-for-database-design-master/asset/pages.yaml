  md: 'In the real world, the foundation of everything we think about and do is data.
    Our brains organize data by patterns, which is another way of saying sets. In
    the virtual world of programming, it''s still all about data. But now we have
    to build and manage the sets of data ourselves. We can and use the SQL language
    as our means of communication, but even before that, we''ve got to make sure the
    data is organized so that it accurately captures and expresses the relationships
    between them. Skip or a poor job at database design, and everything else in your
    application development process will suffer. Do it right, and everything that
    follows is more intuitive, easier to build, and much easier to maintain.


    With long and deep experience. Heli has written an ideal guide to both database
    design and Oracle SQL Developer Data Modeler.


    > —Steven Feuerstein

    Architect, Oracle Corporation


    Working as a database administrator and developer, one of the hardest problems
    you encounter is coming late to a project that is suffering from performance problems.
    In many cases the problems are caused by fundamental flaws in the database design.
    Identify these too late in the development process and the job of redesigning
    the database and refactoring the associated code can be a huge problem.


    Over the last 30+ years programming paradigms have come and gone, but data has
    remained king. Regardless of your chosen development methodology, if you are planning
    to use a relational database, you have little choice but to spend time on the
    design phase. Trying to cut corners will always results in problems later.


    > —Tim Hall

    Oracle ACE Director

    Database Administrator, Developer, and Author

    http://oracle-base.com


    Data modeling is critical to success. Data modeling and data design are more important
    than ever. With the onslaught of big data, our job is even more critical; turning
    data into information is a necessary task and cannot be accomplished without understanding
    the structure of the data truly is. If we do not run our focus to understanding
    the structures of the data, then we cannot properly identify it or make sense
    of it, much less turn it into information that the business can utilize.


    > —Dan Linstedt

    Founder and CEO

    http://LearnDataVault.com'
  merge: -1
