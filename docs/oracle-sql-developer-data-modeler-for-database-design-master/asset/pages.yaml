  md: '# 42 Oracle SQL Developer Data Modeler for Database Design Mastery


    requirements analysis is the process of finding and analyzing the requirements
    that the future users of the application and database have. The results of this
    process are specifications of user requirements. There are at least three kinds
    of requirements: data, functional, and nonfunctional requirements. Functional
    requirements describe what the application must do, data requirements describe
    the data needed for the requirements and nonfunctional requirements (for instance
    security and performance requirements) describe the constraints how the functional
    requirement must be performed. An example of a functional requirement is that
    the application must return the names of the customers. To data requirements that
    might mean a need for a Customer entity with an attribute Name and examples of
    nonfunctional requirement are that it can only return that information to people
    having permission to the information and it must be returned in 5 seconds.


    The process of requirements analysis is used for specifying project goals and
    for planning cycles and increments. Requirements analysis also serves as a source
    for planning test cases. Many times the requirements analysis provides input to
    the risk analysis. It is important to find the requirements for the database.
    It is also important to know which requirements are mandatory, which are optional,
    and which will be prioritized over others (ranking).


    The work during requirements analysis is collecting all possible data available
    and formalizing it into a consistent form. The work of conducting interviews,
    meetings, reading existing documentation, and doing anything possible to find
    the written information. When collecting information, it is also important to
    verify the result with end users and business owners.


    Depending on the processes your organization has using, and the tools you are
    using, the requirements analysis may vary. This book will not go into detail on
    documentation; it concentrates on the database designer during this phase of the
    database design process, if lucky enough to be involved in the project at this
    early stage. Many times the database designer does not know there is a new project
    starting because everything has nothing to do, calling the database designer only
    when the conceptual design starts. During requirements analysis, the database
    designer tries to ask all the questions find out what data this new system has
    (data requirements) and how it is used (functional requirements). The database
    designer also tries to gather all the possible nonfunctional requirements for
    the database (related to security, performance, and so on). So, leaving the database
    designer out of this process is not wise.


    Mostly the requirements analysis consists of writing notes, but Data Modeler provides
    logical entity-relationship (ER) models, data flow diagrams (DFDs), and transformation
    packages to help formalize the documentation. You can find more information about
    the ER model in Chapter 4. Data Modeler also lets you document'
  merge: -1
