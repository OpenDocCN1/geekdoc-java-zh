    # Constraints


    An attribute or set of attributes can be identifying, which means that these attributes
    identify the entity and are constraint to the entity. A unique identifier for
    the entity can be composed of one or more attributes. You can specify one primary
    identifier that uniquely identifies each entity instance and acts as the primary
    key. All attributes in the primary key are mandatory; they cannot be nulls. A
    primary key can be a natural key, meaning that it consists of one or more attributes
    for that entity that truly identify it, or it be a surrogate key when it consists
    of one attribute (usually numeric attribute) that has no meaning to the entity
    itself but just separates each from others.


    You can also define one or more additional unique identifiers as constraints or
    unique keys. A unique key makes sure that there are not two instances in the entity
    that have the same values in all attributes defined for the unique key (unique
    constraint). The difference between a primary key and a unique key is that unique
    key attributes can have null allowed and there can be several unique keys for
    entity, whereas there can be one primary key with only mandatory attributes.


    In Data Modeler you can define an attribute as a primary key by selecting the
    Primary UID box on the Attributes tab in the Entity Properties dialog. And you
    can create other unique identifiers by clicking the green plus sign. Then double-click
    the name of the new unique identifier or click the Properties icon (a pencil icon).
    This opens the Key Properties dialog, as shown in Figure 4-13. Add the name for
    the key and any other general definitions wanted. Then go to the Attributes and
    Relations tab to select the attributes and relationships to be used as a unique
    identifier. If you have named your relationships well, this is one point where
    you saw it worth it because it is easier to find the right relationship out of
    all relationships if the name is clear. You can select one by highlighting a name
    and clicking the arrow pointing to the right and deselect one by using the arrow
    pointing'
