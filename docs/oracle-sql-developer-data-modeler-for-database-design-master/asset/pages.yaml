  md: '# Chapter 11: Generating Reports and Using Search 269


    On the Maintenance tab, you can drop the reporting repository, delete designs,
    and enable and delete indexes. If you drop the repository, all the database objects
    and all the content of a repository will be deleted. When you click the Drop Repository
    button, Data Modeler says “Are sure you want to drop the reporting repository?”
    If you decide to drop it, after the deletion is done Data Modeler says, “Reporting
    repository has been dropped successfully.” If you click the Delete Designs button,
    you can select which designs to delete from the repository. From each design you
    can see the date and time of exporting; the name, and the comments. If you want
    to delete a design, select for that design and click Delete Selected. Now the
    repository is not deleted; only data of selected designs is deleted. If you enable
    Indexes, the indexes for the repository database objects will be rebuilt, and
    set to Unusable. If the indexes are unused, the reports will be generated later.


    On the Glossary tab, you can export a glossary to the reporting repository by
    clicking the Export Glossary button, and you can delete a glossary from the repository
    file and click Open, and to delete a glossary, you select for the glossary in
    the repository and click Delete Selected. It might sound strange there might be
    users without access to Data Modeler, and they might be interested in glossaries
    as well. Exporting all the information to the reporting repository gives them
    the chance to see all the information related to Data Modeler designs.


    To export the design that is, click OK, and it will be exported to the repository
    that can be found in the connection selected. Data Modeler will inform you that
    the design has been exported successfully.


    # Running Reports from the Reporting Repository


    When you have the reporting repository created and designs exported, you can run
    reports from the repository, or you can use SQL to query it. The reports will
    be saved to the directory defined as Default Reports Directory in the Preferences
    dialog. To run a report from the reporting repository, choose File | Reports.
    Running the report is the same as earlier in this chapter, but now you select
    Reporting Schema instead of Loaded Designs. Specifically, you select the reporting
    connection wanted in the Reporting Schema section. In this section you can add,
    remove, and test a connection. Click Reload Design Models to get the Available
    Designs and Available Models populated with information from the reporting repository.
    Then you can select the available design, available model, and report configuration
    from the lists, as explained. The values in the lists depend on the Available
    Report setting and the selected Reporting Schema setting. You can also select
    Clear Diagrams if you want the diagrams to be created again. You can edit, add,
    and delete report configurations by clicking Manage and defining them in the Standard
    Reports Configurations dialog, as explained earlier in this chapter. When you
    are done with the report configuration, you click the Generate Report button.'
