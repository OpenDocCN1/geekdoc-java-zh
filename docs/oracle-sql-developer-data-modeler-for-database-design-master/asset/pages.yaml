  md: '# Chapter 2: Getting Started with Oracle SQL Developer Data Modeler 39


    Tuning the tool for your needs is vital. You can set preferences and design properties
    and share them with all users, and you can create and share glossaries and domains
    to support standards. It is also important to understand that you can use design
    rules and set your own rules in order to check and enforce those standards. All
    this will improve the productivity and quality of the resulting designs. Data
    Modeler makes it easy to enforce standards across your organization and designers.
    In addition, using version control with Data Modeler for all shared and common
    files will raise the quality and productivity to the next level.


    Data Modeler does not save designs automatically, so make sure to save frequently
