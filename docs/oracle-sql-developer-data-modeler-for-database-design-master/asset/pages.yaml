    # # Introducing Subversion


    Before you can start with Subversion, you must install it. Check in the Preferences
    dialog to see which version of Subversion is supported by Data Modeler. Download
    that version of Subversion, follow the instructions, and install it.


    If you need Subversion only for version control purposes, the easiest way is to
    use Oracle SQL Developer to create a local repository. Then you do not need to
    do anything. In Oracle SQL Developer, choose Team | Subversion | Create Local
    Repository. Follow the instructions, and you will have a local repository that
    you can use for version control. If you also need the multiuser environment features,
    you need to create a real Subversion repository on a server.


    When you are working with Subversion, you always have a working copy of your design
    on your computer. When you save, you save the changes to copy of the design. When
    you commit, you bring your changes from the local working copy to the copy in
    Subversion. Checking out from a Subversion repository creates a working copy of
    that directory on your computer and the .svn directory. Unless otherwise defined
    during the checkout, this copy contains the most recent versions of the directory
    and its tree found in the Subversion repository.


    In the working copy directory, there is a directory called .svn that includes
    files Subversion is using to manage your working copy and to control that everything'
