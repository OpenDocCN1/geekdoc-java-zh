    # Introducing Data Flow Diagrams


    A data flow diagram is a formal, structured notation that models a functional
    process. A data flow diagram consists of processes, information stores, external
    agents, and data flows. A process is an activity or function that is performed.
    In an ideal case, each process should include only one activity. The difference
    between a primitive and a composite process is that a primitive process is a single
    process, while a composite process consists of several processes. An information
    store is a collection of data that is permanently stored. An external agent is
    an organization or system that is external to the system but interacts with it.
    External agents send information to processes and also receive information from
    processes. A data flow shows how information flows in the process. An event triggers
    the execution of a process. A note can be used in the diagram to show important
    information in textual format. Figure 3-8 shows an example of a data flow diagram.


    ![](img/431f8ac8f273fa89a28377c500ed60d7_77_0.png)


