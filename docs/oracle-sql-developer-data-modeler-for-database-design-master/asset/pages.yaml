  md: '# Chapter 4: Introducing Conceptual Database Design (Logical Model)


    support yet. I defined data types as logical types and was able to use them when
    designing.


    You can use the Types To Domains Wizard (choose Tools | Types To Domains Wizard)
    to create domains from data types that have been used in your design. But be careful
    since the domains must be carefully defined and agreed upon, I would rather define
    them manually. Domains can be maintained by choosing Tools | Domains Administration.
    You can read more about domains in Chapter 2.


    Distinct, structured and collection types can be defined and managed under Data
    Model in the Browser pane. Both logical and relational models use definitions
    from the data types model to specify the data type for attributes and columns.
    Certain structured types can also be used to define an entity or table is of a
    certain structured type. A data types model can be built manually, or you can
    import from an Oracle Designer repository. You can find import functionality from
    the File menu, and you can read more about importing from Oracle Designer in Chapter
    10.


    To create a distinct or collection type, go to the Browser pane, select the data
    type and right-click. Fill the information needed. For a distinct type, you need
    to define the name and select the logical data type from the list of values. You
    can also define the size. Do not forget to comment and document your distinct
    type. After you have created the distinct type, it will be available in the data
    type list for attribute or column. Remember to select the data Distinct. To create
    a collection type, you must define the name and set the collection to be either
    array or collection. For an array, you must define the maximum number of elements
    in the array; for a collection, you do not need to have this element defined.
    You should define the data type for your array or collection. The data type can
    be domain, logical, distinct, collection, or structured. You should also define
    the Max Size String parameter, and do not forget to comment and document your
    collection type. After you have created the collection type, it will be available
    as a data type for attribute or column. Remember to select the data type Collection
    when assigning a data type to an attribute.


    A structured type is a user-defined data type that has attributes and methods.
    Attributes can be of type logical, distinct, structured, or collection. A structured
    type can also be defined as a subtype to another structured type. An entity can
    be defined based on a structured type. To create a new structured type, go to
    Data Types in the Browser pane, right-click, and select Show; alternatively, under
    SubViews, right-click, select SubView. Then design the structured type using icons
    from the toolbar. Only structured type objects are represented graphically on
    data type diagrams. A data type diagram consists of structured types, reference
    links, embedded structure links, collections of reference links, collections of
    embedded structure links, and notes.


    From the properties of a data type, you can see whether and where this data type
    is used on the Used In.'
