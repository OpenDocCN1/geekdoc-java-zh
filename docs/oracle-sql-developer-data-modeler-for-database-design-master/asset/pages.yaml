  md: '# About the Author


    Heli Helskyaho has a master''s degree in computer science from Helsinki University
    and specializes in databases. Heli is an Oracle ACE Director and has been a frequent
    speaker at many conferences. She has worked in IT since 1990 and with Oracle products
    since 1993. She has been in several positions, but each role has included database
    design. Heli has an Oracle Designer user since 1996 and an Oracle SQL Developer
    Data Modeler since 2010. Heli is an active member in the Oracle user community,
    including Oracle User Group Finland as well as EMEA Oracle user groups community
    (EOUC) where she has served as spokesperson/ambassador since 2007. Heli is also
    the CEO for Miracle Finland Oy. Heli believes that creating good database design
    and documentation reduces performance problems and makes them easier. You can
    follow her on Twitter @helifromfinland and read her blog on helifromfinland.wordpress.com.


    # About the Technical Editors


    Kent Graziano is the owner of Data Warrior LLC and a lifetime member of Rocky
    Mountain Oracle Users Group (RMOUG) and ODTUG. He is an award-winning author and
    speaker, Oracle ACE director, certified Data Vault Master (DVDM) and Data Vault
    2.0 Architect, and expert data modeler and data warehouse architect with more
    than 30 years of experience, including more than 25 years using Oracle (since
    version 5) and Oracle tools and two decades data warehousing. He is a recognized
    expert in Oracle*CASE, Oracle Designer, and Oracle SQL Developer Data Modeler.
    Kent has written numerous articles, authored one Kindle book (available on Amazon),
    coauthored four books, and done many presentations, nationally and internationally.
    Most recently, he was the second-best presenter at OUG14 in Helsinki, Finland.
    You can follow Kent on Twitter @KentGraziano or on his blog Data Warrior (kentgraziano.com).


    Jeff Smith is the product manager for Oracle SQL Developer Data Modeler and is
    thrilled to have true design experts, as Heli and Kent, help Oracle Database customers
    build their applications right, the first time. Jeff has a bachelor''s science
    in computer science from West Virginia University and for the past 14 years has
    focused on database development and administration tools. You can follow Jeff
    at @jeffsmith on Twitter or read his productivity tips and tricks for Oracle SQL
    Developer Data Modeler at www.thatjeffsmith.com.'
