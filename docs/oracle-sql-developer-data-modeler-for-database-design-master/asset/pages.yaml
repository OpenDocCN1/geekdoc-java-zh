  md: '# 274 SQL Developer Data Modeler for Database Design Mastery


    ![](img/431f8ac8f273fa89a28377c500ed60d7_300_0.png)


    # FIGURE 11-9. Global search with regular expression


    7. Using this you can find, for example, anything that has p''s in it with p[2]
    or at least two p''s with p[2]. This search would return, instance, humppa.


    Curly bars, {}, are called a quantifier. Other quantifiers are: * meaning 0 or
    more, + meaning 1 or more, and ? meaning 0 or 1. As mentioned earlier, (...) is
    a group. The square brackets, [...], indicate a range. For instance, [abc] means
    "a or b or c". [1-9] means "any digit between 1 and 9," and [. Ranges are inclusive.
    There are plenty of other metacharacters that can be used as well. You can use
    all the basic elements to create complex and powerful patterns. For instance,
    ((?=\d)(?==[a-z])(?==[A-Z]).{8,15}) can be used to check that the string includes
    at least one digit, one lowercase letter, and one uppercase letter, and is 8 to
    15 characters long.


    ![](img/431f8ac8f273fa89a28377c500ed60d7_300_1.png)


    > TIP

    You can read more about regular expressions at http://docs.Oracle.com.


    # Advanced Mode


    Advanced mode has more features for searching than simple mode. In advanced mode,
    you can search by object properties, and you can specify ORs or ANDs in the search
    logic. Select the Advanced Mode radio button to enable these features.'
