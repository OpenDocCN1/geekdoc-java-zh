    # Entity and Its Attributes


    An entity is anything that happens to be of interest to the target of modeling,
    for example, a say Heli. Every entity is of some entity type. A set of entities
    (Person) having certain properties in common (Heli, Marko, Patrik, and Matias—like
    all entities of type Person—have a name). An entity is always a name (Employee,
    Customer). An entity is a subset of an entity type, and it includes only those
    that belong to the target of modeling. In spoken language, entity types and entity
    sets are often called entities. In this book, we will call both entity type and
    entity set an entity because in the context of Data Modeler. When referring to
    a single entity (Heli) of an entity set (Person), we will use a term entity instance.
    You can create an entity in Data Modeler on the logical model by clicking the
    entity icon and inserting the properties for the entity, as shown in Chapter 3.


    An entity can be either strong or weak. A strong entity (for example, Customer)
    identifies itself without other entities or relationships; strong entities have
    independent existence. A weak entity (for example, Orderline) depends on other
    entities to identify it (Order, Customer) and has a mandatory, identifying relationship
    with them. The weakness of an entity is shown with a horizontal line at the end
    of the relationship line. You can define it in the Relation Properties dialog
    by selecting Identifying from the source side of the properties.'
