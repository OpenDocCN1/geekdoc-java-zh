    check constraint is needed for implementing the arc. You will learn more about
    forward engineering in Chapter 5. The arc solution can be a good choice when the
    subtypes do not have a lot in common and can be used independently.


    In many cases, it is easier to model and understand the modeling using subtypes
    and supertypes to express the same need. The modeling tactic with supertypes and
    subtypes is usually easier for end users to read and understand, and it gives
    the designer the freedom to decide later how to implement this engineering to
