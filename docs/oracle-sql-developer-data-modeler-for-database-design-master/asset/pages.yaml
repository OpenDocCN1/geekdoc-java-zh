    target design, as shown in Figure 12-1. You can use New Relational to create a
    new relational model under the logical model without affecting the existing relational
    model. But if you want to compare the relational model to an existing relational
    model, select that model. Click Next and Finish. The Oracle SQL Data Modeler Designs
    screen, shown in Figure 12-2, will open.'
