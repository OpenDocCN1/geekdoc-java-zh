  md: '![](img/431f8ac8f273fa89a28377c500ed60d7_291_0.png)


    FIGURE 11-4. Standard Reports Configurations dialog


    # Introducing the Reporting Repository


    The Data Modeler reporting repository is a database schema with database objects
    for storing metadata and about Data Modeler designs. You can decide which designs
    to export to the repository, and when needed, you can remove designs from the
    repository. The reporting repository is useful as a database for all the information
    you want to share with users who do not have access to Data Modeler. For users'
  merge: -1
  pgno: 291
- img_proc: true
  md: 'access to Data Modeler, the value is having all the information in one place,
    having the ability to generate reports for all designs, and using SQL for querying
    the reporting repository. In datamodeler\datamodeler\reports\Reporting Schema
    diagrams, you can find the descriptions of the reporting repository structures.
    the reporting repository is a read-only repository. Any changes to the content
    must be done with Data Modeler and exported to the repository. A user can be granted
    a read-only access to the repository to be able to run SQL scripts directly on
    the reporting repository.


    # Creating a Reporting Repository


    To create a reporting repository, you should first create a repository owner (schema)
    in your database. This is not mandatory (you can use any schema), but having a
    dedicated repository owner makes maintaining the repository easier. Here''s an
    example:


    ```

    use DM_REPORT_REPOS identified by password;

    ```


    Find the file Reporting_Schema_Permissions.sql in datamodeler\datamodeler\reports.
    You can use this file for granting privileges to the repository owner and for
    defining the OSDDM_REPORTS_DIR directory for the report generation to use as a
    temporary directory at runtime. Edit the file and replace <USER> instance with
    your username (for instance DM_REPORT_REPOS) and replace <OS DIRECTORY> with a
    directory path and name of temporary directory in the server where the repository
    database runs. This directory will include files for the runtime of a report:
    osddm.reports.log and report_data_rs.xml. The value cannot be longer than 30 characters,
    for example /home/oracle/. Then go to that computer or server and create the directory.
    Now run the edited script Reporting_Schema_Permissions.sql in your database. Your
    script might look something like this:


    ```

    CREATE OR REPLACE DIRECTORY OSDDM_REPORTS_DIR AS ''/home/oracle/

    GRANT READ, WRITE ON DIRECTORY OSDDM_REPORTS_DIR TO DM_REPORT_REPOS;

    GRANT CREATE SESSION TO DM_REPORT_REPOS;

    GRANT RESOURCE TO DM_REPORT_REPOS;

    GRANT CREATE TABLE TO DM_REPORT_REPOS;

    GRANT CREATE SEQUENCE TO DM_REPORT_REPOS;

    GRANT CREATE VIEW TO DM_REPORT_REPOS;

    GRANT CREATE PROCEDURE TO DM_REPORT_REPOS;

    ```


    The first time you export a design to the reporting repository, the reporting
    schema is created automatically. Make sure you log in as the schema owner.'
  merge: -1
  pgno: 292
