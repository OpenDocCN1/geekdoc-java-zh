    Arc icon. Figure 4-17 shows an arc solution where at one time there is either
    a relationship between Customer and Person or a relationship between Customer
    and Company. In other words, a Customer is either a Person or a Company but never
    both or neither.


    All relationships included in an arc should belong to the same entity, and they
    should have the same cardinality. In forward engineering, an arc solution will
    produce one table for each entity. To be able to forward engineer this setting
    to the relational model, you must set all foreign key attributes belonging to
