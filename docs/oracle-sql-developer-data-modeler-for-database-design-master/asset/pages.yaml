  md: '# Chapter 4: Introducing Conceptual Database Design (Logical Model) 79


    decisions in conceptual database design. A natural key is usually more efficient;
    sometimes you can eliminate a join, sometimes the query optimizer works efficiently,
    and so on. But there is no point trying to find a primary key if there is no zero
    candidate, though in many of cases it indicates that there is something wrong
    with the model. Many times designers are too cautious to set attributes to null
    and therefore are able to define only unique keys. Or the concepts are not understood
    well enough to really identify the entity. One of the concerns in designing the
    database is the data quality. To be able to get good-quality data, you must understand
    what you are modeling, and you must be able to set as many attributes to not null
    as possible and to find all possible surrogates. A surrogate primary key does
    not stop users from inserting duplicates in the database, but a natural key does,
    and the index (for a surrogate primary key is often not used (queries are not
    made based on the surrogate). On the other hand, many times the best solution
    for data comes from another system and is not controlled by your organization
    is a surrogate key because you can never be sure if the other system has changed
    the data you have considered to be unique or not anyone. So, there is no single
    answer to the question. If you have to have a surrogate key, select the Surrogate
    Keys box in the Entity Properties or Relationship Properties box.


    A key constraint is an attribute or set of attributes that refers to the primary
    key of an entity, which can be another entity or the same one, as discussed earlier.


    You can also define constraints for attributes. Domain constraints can define,
    for instance, the data type, allowable values, and default values. You can either
    redefine them in Domains to be used (see Chapter 2) or define them for every attribute
    separately in the Attribute Properties dialog (Figure 4-15). Define the name for
    the constraint and define the default value for it. If you want to use the properties
    defined in Domains Administration for the associated domain, select Use Domain
    Constraints. If this option is not selected, you can continue defining the settings.
    You can specify a constraint for one or more types of databases from the Constraint
    list. You can specify one or more value ranges for the attribute. If you select
    Domain Constraints, all the changes will automatically be done on this attribute.
    For instance, if a new allowable value is added to a domain constraint, it will
    automatically be available for this attribute as a candidate for a default value
    and on the list of allowable values. I recommend using domains and their settings.
    That will make maintenance easier.


    One more commonly used constraint is a check constraint. An example of a check
    constraint could be Check (Name=upper(Name)). A constraint can be immediate or
    deferred, meaning that it will be checked either straightaway or a bit later.'
