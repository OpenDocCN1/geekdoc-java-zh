    because they save the data permanently. There are also two kinds of tablespaces:
    temporary and undo. A temporary tablespace is used, for instance, to manage space
    for database sort operations and to store global tables. A temporary tablespace
    contains schema objects only for the duration of a session. Objects in temporary
    tablespaces are stored in temples. An undo tablespace is for managing undo. Undo
    records are used to roll back transactions when a ROLLBACK statement is issued,
    to recover the database, to provide consistency, and using Oracle Flashback Query
    to analyze data of an earlier point in time or to recover logical corruption.
    Oracle Database versions before Oracle 9 used rollback segments for most data.
    Data Modeler supports rollback segments even though Oracle strongly recommends
    using tablespace rather than rollback segments.


