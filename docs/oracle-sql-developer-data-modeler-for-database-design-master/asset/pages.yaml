    for the branch, and somebody else creates another view for the trunk. Now the
    directory for views has been created in both versions for the first time. Try
    to merge the designs and get an error saying there is a conflict. That is correct;
    there is a conflict: A directory for views has been created in both versions and
    you must decide which one is correct. What to do now is to remove the directory
