    Let me amplify and clarify these remarks, if I can:


    +   First of all, to repeat: To say that the database conforms to all stated constraints,
    formally speaking. Now, it''s crucial that databases always be consistent in the
    formal sense; indeed, a database that''s not consistent in this sense, at some
    particular time, it is like a logical system with a contradiction. Well, actually,
    that''s exactly what it is—a logical system with a contradiction. you can prove
    anything (for example, you can prove that 1=0). What this means in database terms
    is that if there''s ever a time at which the database is inconsistent in the formal
    sense, you can never trust the answers you get to queries—they may be false, they
    may be true, and you have no way in general of knowing which they are. In other
    words, all bets are off. That''s why consistency in the formal sense is so crucial.
    It''s why, contrary to popular opinion, integrity checking must always be immediate
