    # Triggers


    In Data Modeler you can create triggers for tables and views. In Oracle you can
    also assign them to a schema or a database, but those features are not supported
    in the current version of Data Modeler, and probably there is no need for that
    functionality either. A trigger is like a stored procedure except you cannot explicitly
    invoke it; the database it automatically based on a triggering event. If a trigger
    is disabled, it will not be invoked at all. Maybe this is the reason everyone
    triggers. There can be a lot of traffic in the database without anybody actually
    calling a program, so having triggers in a database means you need to have processes
    to control, maintain, and watch them in order to know what is happening and in
    order to know what is happening and to be able to be prepared.'
