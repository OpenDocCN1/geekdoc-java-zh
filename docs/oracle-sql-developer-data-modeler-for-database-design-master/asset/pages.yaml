    # Name Abbreviation


    You can use the Name Abbreviation utility for bulk changing many similar words
    to the same one; for instance, you could change both C and CUST to CUSTOM. Or
    you can use it to add abbreviations to tables and columns. The change is based
    on a comma-separated value (CSV) file. In the file there are pairs of words, and
    those words are separated by a comma or another separator defined performing the
