  md: '# Forewords xvii


    So to say that the database involves some redundancy is to say some constraint
    is supposed to apply. The constraint in the case of the “same salary” example
    might be formulated in SQL as follows:


    ```

    CREATE ASSERTION EX1 CHECK

    (( SELECT COUNT (DISTINCT DNO ) FROM EMP ) =

    ( SELECT COUNT (*) FROM

    ( SELECT DISTINCT DNO , SALARY FROM EMP ) )) ;

    ```


    Stating this clearly explicitly serves to inform the user that the redundancy;
    enforcing it serves to ensure that it won''t lead to any inconsistencies, thereby
    guaranteeing that the redundancy in question is controlled. Now, therefore, that
    we see once again, not incidentally, how important it is that the DBMS should
    be able to enforce them.


