  md: '# Introduction


    Designing databases is vital for any company that is serious about its data, our
    most valuable asset. To support efficient database design work, a designer must
    have a tool to be able to document the data and data usage in a formal way. This
    book helps people design their databases better and shows how to use a tool called
    Oracle SQL Developer Data Modeler in that job.


    Database design consists of analyzing requirements and creating the conceptual,
    logical, and physical designs. This process is iterative and incremental, and
    all these phases will be done over and over again to get the correct and optimal
    design for the purpose. Database design is a process of producing detailed entity-relationship
    (ER) diagrams and data flow diagrams (DFDs), and it ends up producing the scripts
    (DDLs) for creating all the objects needed for the database. In this book, I go
    through the entire process of database design using Oracle SQL Developer Data
    Modeler.


    # Chapter 1: Introducing Database Design and Oracle SQL Developer Data Modeler


    In this chapter, you''ll learn the basics of database design and Data Modeler,
    and you will get some ideas on designing databases in an agile system development
    process.


    # Chapter 2: Getting Started with Oracle SQL Data Modeler


    In this chapter, you''ll explore how to get started with Data Modeler and how
    to set it up to meet your needs.'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'xxiv Oracle Developer Data Modeler for Database Design Mastery


    # Chapter 3: Introducing Requirements Analysis


    Requirements analysis is the process of finding and analyzing the requirements
    of the future users of the database. The results of this process are the specifications
    of user requirements. In this chapter, you will see how to do these tasks with
    Data Modeler.


    # Chapter 4: Introducing Conceptual Database Design (Logical)


    Conceptual database design consists of translating the requirements into a formal
    conceptual data model and process models. The result of conceptual database design
    is a conceptual schema and process models. In this chapter, you will see how to
    create a logical model with Data Modeler.


    # Chapter 5: Introducing Logical Database Design (Relational)


    The logical database design consists mainly of transforming the conceptual model
    (logical model) into a relational model. The result of this phase of database
    design is a relational schema, a set of relational schemas, and their constraints.
    In this chapter, you will see how to create a relational model with Data Modeler.


    # Chapter 6: Introducing Physical Database Design


    The physical database design is the phase in which you decide the technology and
    version of your database. Data Modeler supports different versions of Oracle,
    Microsoft SQL Server, and IBM DB2 databases. In physical database design you design
    physical database elements related to the selected technology and add physical
    properties to elements from the relational model. In this chapter, you will learn
    how to create the physical design with Data Modeler.


    # Chapter 7: Generating DDL Scripts for Creating Database Objects


    A data definition language (DDL) is for creating database objects. Generating
    DDL scripts with Data Modeler is quite simple, and it can be done over and again
    to find the right settings to get the kind of scripts. The DDLs are based on the
    relational model and one of its physical models. In this chapter, you will learn
    how to generate DDLs with Data Modeler.


    # Chapter 8: Designing a Data Warehouse Database


    In this chapter, you will briefly see the most common methods of data warehouse
    design: star schema, snowflake, and Data Vault. You will also learn how to design
    a data warehouse database using Data Modeler.'
