  md: '# Chapter 5: Introducing Logical Database Design (Relational Model) 123


    The General tab has properties for controlling engineering, reverse engineering,
    and DDL generation. Engineer defines whether the table and its properties will
    be included when engineering to the logical model (reverse engineering), and Allow
    Columns Reorder During Engineering lets Data Modeler reorder the attributes of
    the associated entity in the same order as their columns in the table definition.
    This property is copied from properties (Allow Columns Reorder During Engineering)
    earlier in this chapter but can be changed if needed for an individual table.
    Generate In DDL defines whether the table is included when the DDLs are generated.


    Engineer As Relationship defines whether relationship attributes are created during
