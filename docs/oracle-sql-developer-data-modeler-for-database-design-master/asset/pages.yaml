    5-28 shows the Name Abbreviation dialog. If you select Name Abbreviation for Direction,
    the first word will be replaced with the second word. But if you select Abbreviation
    To Name, the second word in the list will be replaced with the first one. In other
    words, the Direction setting tells how the list will be read.


    You can perform a name abbreviation for names or for abbreviations by selecting
    All Objects or Abbreviations for the Scope setting. A name abbreviation for names
    can be done to names of tables, views, foreign key constraints, primary and unique
    key constraints, columns, and indexes. A name abbreviation for abbreviations


