  md: '# 252 Oracle SQL Data Modeleler for Database Design Mastery


    If there are no primary keys in the database, it might be worth defining them,
    not just for getting the Discover Foreign Keys functionality to work but also
    for getting the database to work better. Primary keys will keep the data quality
    high and usually help the database optimizer to improve the execution plans for
    queries and make them more efficient. You can define the primary keys in Data
    Modeleler and the DDLs for creating them in the database. Make sure you really
    know these are the correct primary keys because they will block duplicate data
    from being inserted in the database. You probably need to see the data in tables,
    read the application code, and talk to people who know this application to be
    sure about the primary keys. When creating the primary key for the parent table
    you will get an error message if there is duplicate data in the database.


    Sometimes the dates are equal in the parent table''s primary key column and the
    child table''s foreign key candidate column but the other definitions do not match.
    In the parent table, the column must be NUMBER(16,0), and in the child table,
    it might be NUMBER. In case, you might want to change the definition for the child
    tables to NUMBER(16,0). You can do that using the search functionality and using
    the setting properties operation related to that. You can read more about it in
    Chapter 11. After changing the data type in Data Modeler, you can compare the
    data to the database (read more in Chapter 12) and get the ALTER DDLs for altering
    the column types.


    ![](img/431f8ac8f273fa89a28377c500ed60d7_278_0.png)


    > NOTE

    Discover Foreign Keys only if primary or unique keys are defined for the parent
    table and if the columns in the parent and child tables are of same date type.
    For instance, if the column name matches the primary key column name in the parent
    table but the data type is different for it in the child table, this column is
    not included as a foreign key candidate.


