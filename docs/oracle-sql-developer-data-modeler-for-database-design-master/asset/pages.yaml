    # Summary


    Logical database design starts with the logical model from the conceptual design.
    With Data Modeler, the logical model will be transformed into a relational model
    using the Engineer To Relational Model functionality. The results of this phase
    of database design is the relational database schema. a set of relational objects
    and their constraints. The Engineer To Relational Model functionality is an easy
    and quick process, and it should be done whenever you have requests to the conceptual
    model.


    Designing a database is an iterative process. To have an efficient and reliable
    process, it is valuable to always follow the same procedures and in the same order:
    Change the logical model and forward engineer the changes to relational model
