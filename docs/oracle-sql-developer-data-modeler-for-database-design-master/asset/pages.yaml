    # Views


    If you create views in the relational model, you will see them in the physical
    model automatically. You cannot create new views in the physical model, but you
    can add the schema and other physical properties related to the selected RDBMS
    site and grant read privileges.


    # Materialized Views


    A materialized view is a database object that contains the result of a query at
    a certain moment, and you can define how and when the result is updated. A materialized
    view can be based on tables, views, or other materialized views. In replication
    terms, the term for these objects that the materialized view is based on master
    tables; in data warehouse terms, they are called detail tables. In previous versions
    of Oracle, some of the functionalities of materialized views were called snapshots.'
