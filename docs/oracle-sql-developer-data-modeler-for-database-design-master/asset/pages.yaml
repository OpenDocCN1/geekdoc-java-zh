  md: '# Chapter 2: Getting Started with Oracle SQL Developer Data Modeler 15


    # Tuning Oracle SQL Developer Data Modeler


    Before starting to use Data Modeler in production or in a multiuser environment,
    it is important to set up the tool in the best way to serve your organization’s
    needs. You could leave all the preferences at their defaults, but in time you’ll
    find that you work in a certain way and the settings should reflect that. In the
    beginning, you should define at least some preferences and design-level properties
    and maybe create some glossaries and domains. You should also decide where those
    settings will be kept (preferably in version control) and how they will be shared
    with other users.


    The tool also has design rules to help maintain the quality of your designs. There
    are predefined design rules, but you can create as many of your as needed. Having
    all of done will increase your productivity and the quality of your work.


    # Setting Preferences


    Preferences are settings that affect Data Modeler behavior on an installation
    level, and you can share these preferences with other Data Modeler installations.
    Some preferences take effect immediately, but other preferences require you to
    close the design and reopen it for them to take effect. This is because either
    the preference setting is in cache memory or it has been copied to another property
    elsewhere in a design by Data Modeler. Since the new preference will affect only
    the elements created after the change, it is important to set your preferences
    before starting to use Data Modeler. To ensure that a change is really taking
    effect in the design, you can close and reopen the design after changing a preference.
    Sometimes it is better to close Data Modeler and reopen it.


    In every new version of Data Modeler there are new preferences for the users to
    tune the tool to fit their needs better. See Help on Data Modeler for more specific
    descriptions of a certain preference. This chapter will cover the most important
    preferences for a user when using the tool. Other chapters will cover the preferences
    that affect that particular phase of database design.


    You can find the preferences by choosing Tools | Preferences, as shown in Figure
    2-3. These preferences have an effect on only your installation of Data Modeler
    unless you share them with other users, as explained later in this chapter.


    # Preferences for Starting to Use Oracle SQL Data Modeler


    This section will cover the preferences that will make the tool behave the way
    you want, and it will explain how to share those preferences with other users
    after implementing them. You can change all the preferences while working on a
    project,'
