  md: '# 224 Oracle SQL Developer Data Modeler for Database Design Mastery


    > NOTE

    To avoid conflicts, remember to commit your changes after you finish working with
    them. Never leave Data Data Modeler without either committing or reverting your
    changes.


    Here is an example of a conflict: User2 creates a new table user2 and adds a new
    column to the table CUSTOMERS called User2Column but does not remember to commit
    it to version control. Meanwhile, User1 creates and adds a new table user1 and
    adds a new column to the table CUSTOMERS called User1Column in the same design
    and commits the changes to version control. User2 comes back to work, opens Data
    Modeler, and sees their outgoing changes. Because User2 knows the process, the
    next thing User2 does is click Refresh Incoming and notices that there are also
    incoming changes. User2 can now see that the changes are shown in red, both incoming
    and outgoing, and knows that there is a conflict. User2 does not realize it and
    tries to commit, User2 will get the error message shown earlier in Figure 9-5.
    The Merge user must do next is to build the wanted version of the design. Because
    the Merge preference is to Local, the version will be built in the local working
    directory. User2 will start with the incoming changes. As shown earlier in Figure
    9-3, User2 can see that there is a new column to be added to the local version
    of the design (User1Column) and the local copy has a column (User2Column) that
    does not exist in the version in Subversion. User2 now must decide the following:


    +   - Is the column User1Column correct, or should it be added to the local version?


    +   - Is the column User2Column correct, or should it be removed?


    If User2 wants to keep the column User1 (User1Column), User2 lets it be selected
    on the XML Comparator screen. If User2 does not want to keep it, User2 will disable
    it. If User2 wants to add the column User2Column, it should be disabled on the
    XML Comparator screen. But if User2 does not want to add it anymore, it should
    be selected. After User has made their mind on what to do with the changes, User2
