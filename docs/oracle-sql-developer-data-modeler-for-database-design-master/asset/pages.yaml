  md: '# Chapter 1: Introducing Database Design and Oracle SQL Developer Data Modeler
    7


    You can also use Data Modeler to document existing databases (Oracle, SQL Server,
    DB2). You can reverse engineer the documentation from a data dictionary or existing
    DDLs, or you import it from another design tool (Oracle Designer, ERWin, or a
    VAR file). Or, you can combine all these techniques, for example, bringing some
    of the descriptions from another design tool and adding it to the physical information
    from the data dictionary. You can find these features by selecting File | Import.


    Since an important part of database design is reporting, you might want to use
    Data Modeler to create your templates and create reports based on those templates.
    You can also create a reporting repository; in addition to the templates, you
    can use SQL to query the information from there. You can also print the diagrams
    or use the powerful search functionality to search the information in the report.


    It is also important to be able to document all the information related to the
    database in just one place. In Data Modeler you can document all the information
    needed for the database design as well as change requests, business information,
    and much more.


    # Summary


    Going through the database design process is vital if you are storing important
    data in your database. Database design is the process of producing detailed entity-relationship
    diagrams and data flow diagrams to produce the DDL scripts for creating the objects
    for the database. Database design consists of requirements analysis, conceptual
    design, logical design, physical design, and, depending on who you ask, transaction
    design. To be able to design a database, especially in an agile system, you need
    Oracle SQL Developer Data Modeler. It is a free tool that supports all the needs
    of database designers plus some extra.'
