    \ FALSE | FALSE |\n| FALSE | TRUE | TRUE |\n| TRUE | FALSE | TRUE |\n| TRUE |\
    \ TRUE | FALSE |\n\nThe exclusive OR works like the previous OR table, except\
    \ when both arguments are true, the final answer that exclusive OR gives is false.\n\
    \nIt is not easy to memorize all the tables right away. You need to do it one\
    \ at a time. If you have memorized the first table, then you can proceed with\
