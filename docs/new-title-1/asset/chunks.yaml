    \n## Dealing with the If-Else (or Nested If) Statement\n\nJust like the `if` statement,\
    \ the `if-else` statement also tells the computer to execute the `if-else` block\
    \ of codes only if the condition of the statement is true. In case the statement\
    \ is false, then the `else` statement will be executed provided that the condition\
    \ in the `else` statement is true.\n\nThe `if-else` statement follows this syntax:\n\
    \n```java\nif <conditional expression> {\n    <statement action>\n} else {\n \
    \   <statement action>\n} else {\n    <statement action>\n}\n```\n\nTake the sample\
    \ program below:\n\n```java\npublic class IfElseSample {\n    public static void\
    \ main(String[] args) {\n        int g = 50, h = 20;\n        if (g > h) {\n \
    \           System.out.println(\"g is greater than h\");\n        } else if (g\
    \ < h){\n            System.out.println(\"h is greater than g\");\n        } else\
    \ {\n            System.out.println(\"g is equal to h\");\n        }\n    }\n\
    }\n```\n\nThis will print:\n\n`g is greater than h`\n\nLet us analyze:\n\nIn line\
    \ 4, the variables are declared as `int` together with their value.\n\nIn line\
    \ 5, there’s an `if` statement that says, ‘g is greater h’. Since the statement\
    \ is true the program prompts the computer to stop executing the rest of the codes.\
    \ The nested `if` or `if-else` statement stops executing the rest of the codes\
    \ once the program encounters a condition that proves to be true. In an `if` statement,\
    \ the program will still execute the other lines if it has already encountered\
    \ a condition that proves to be true; there’s a sample program below that explains\
    \ this in a more detailed manner. In case the first `if` statement is false, the\
    \ program will then execute the first `else` statement only if it’s true. Otherwise,\
    \ it will execute the last `else` statement that has no conditional statement,\
    \ just an instruction to proceed with ‘g is equal to h’.\n\nBut, if you have this\
    \ program:\n\n```java\npublic class IfElseSample {\n    public static void main(String[]\
    \ args) {\n        int g = 50, h = 20;\n        if (g > h) {\n            System.out.println(\"\
    g is greater than h\");\n            if (g > h){\n                System.out.println(\"\
    h is greater than g\");\n            } else {\n                System.out.println(\"\
    g is equal to h\");\n            }\n        }\n    }\n}\n```\n\nIt will print\
    \ this one:\n\n`g is greater than h`\n`h is greater than g`\n\nThe second statement\
    \ is false, but the program doesn’t care what it prints as long as the conditional\
    \ statement is true. Also, the program is compelled to execute the next `if` statement\
    \ even though the first one is already true. The reason is because both `if` statements\
    \ are independent, unlike in nested `if`. It is safe to say that the `if-else`\
    \ statements give you more control over your program, especially if there are\
    \ many available options, but the program must only execute one specific choice.\n\
