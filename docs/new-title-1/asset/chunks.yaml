    If C is false or D is true, then the statement will return true.  The same explanation
    goes with the rest of the arguments.


    Truth Table for NOT


    | TRUTH TABLE FOR ''NOT'' |


    | A | !A |


    | FALSE | TRUE |


    | TRUE | FALSE |


    The NOT table gives the opposite of the argument or expression as its final answer. 
    If A is false, then !A’s final answer is true.


