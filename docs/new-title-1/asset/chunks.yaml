    Chapter 4: Useful Pocket Tables and the Different Operators


    In using Java as your programming language, it is best if you keep a table for
    Java numeric operators, comparison operators, and logical operators.  There are
    also different truth tables.  It is likewise advisable to keep the different tables
    handy.  For now it may sound a bit too much, but as the days go by you will be
    able to learn everything like the back of your hand.


    The different tables serve as quick references.  It is better if you can memorize
    them immediately, but even if you have memorized them you still need to keep the
    tables handy. 


    The Numeric Operators


    The different programming languages share the same symbols for their numeric operators. 
    If you already know a programming language, then you can see that the symbols
    used in Java programming and the programming language that you know are mostly
    (if not all) the same.  There might be slight differences with the other programming
    language.      


    | NUMERIC OPERATORS |


    | Sign | Operand | Example |


    | + | Addition | 5 + 9 |


    | - | Subtraction | 35 - 24 |


    | * | Multiplication | 7*6 |


    | / | Division | 168/3 |


    | % | Remainder | 15%2 |


    It is better if you can quickly memorize all the numeric operators and how to
    use them properly.  You will almost always need them when you start coding a more
    complex program. 


    For samples of Java program using the mathematical operators, please refer to
    Chapter 5\.


