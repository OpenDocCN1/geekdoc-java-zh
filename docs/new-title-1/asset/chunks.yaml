    \    }\n}\n```\n\n## 使用比较运算符\n\n比较运算符，也称为关系运算符，用于比较数据类型，并始终产生布尔值（`true` 或 `false`）作为答案。此时，你应该已经熟悉不同的真值表了，因为从以后你将经常使用它们。确实，你可以随时回头查看表格，但频繁回回查看会花费大量时间，这会降低你的工作效率。\n\
    \n当两个数据（称为操作数）之间存在比较运算符时，你预期的答案始终是 `true` 或 `false`。看下方的示例语句：\n\n```java\nSystem.out.println(56<77);\n\
    ```\n\n当程序执行它时，预计它会在你的电脑屏幕上打印 `true`，而不是 `'56<77'`。为什么？因为该语句使用了比较运算符，它会自动提示系统只寻找\
    \ `true` 或 `false` 答案。Java 程序能快速识别出这是一个寻找布尔答案的操作，而打印命令的存在会提示它在屏幕上打印该布尔答案。\n\n\
    等等于 (`==`) 和不等于 (`!=`) 比较运算符也称为相等性运算符。Java 程序员使用相等运算符来检查数据的相等性。程序员可以选择测试 `int`、`boolean`\
    \ 或 `char` 类型数据的相等性. 只有当在数据之间使用比较运算符时，你才能得到 `true` 或 `false` 答案。如果你想打印括号内的内容，你需要将它们放在引号中，程序将把它们视为字符串。为了进一步解释，请看下面的示例：\n\
    \n```java\npublic class CompareData {\n    public static void main(String []args)\
    \ {\n        char testSampChar='r';\n        int testSampDigit=3;\n        System.out.println(testSampChar==testSampDigit);\n\
    \    }\n}\n```\n\n你认为屏幕上会打印什么？如果你的答案是这个：`false`，那么你是正确的。这只是一个简单的例子。当你开始编写自己的程序时，请预期会有更复杂的情况。有时，测试不同数据之间的相等性是唯一的方法。看这个程序：\n\
    \n```java\npublic class CompareData {\n    public static void main(String []args)\
    \ {\n        char testSampChar='r';\n        int testSampDigit=3;\n        System.out.println(testSampChar!=testSampDigit);\n\
    \    }\n}\n```\n\n这一次，你是在要求程序测试 `testSampChar` 和 `testSampDigit` 之间的不相等性。由于我们已经知道它们不等，所以结果是：`true`。\n\
    \n## 尝试这个练习题\n\n是时候测试你在这一章中学到的东西了。你可能没有意识到，但你已经编写了相当长时间简单代码了。这种意识（如果你还没有意识到的话）应该增强你进一步学习的动力。如果你什么都看不读懂，是不可能到达这一章的。毫无遗漏地完成练习题并完成作业对你的进步绝对有帮助。\n\
    \n你需要立即练习所学的内容，以防忘记。如果你能保持这个习惯，除了尝试寻找改进程序流程的方法外，你将不会遇到麻烦。编写代码时需要小心，并始终记住 Java\
    \ 是区分大小写的。\n\n如果你给变量 `greatNum` 赋值，请确保在整个程序中都正确声明并正确书写它。程序能识别声明的变量 `greatNum`，但不能识别\
    \ `greatnum`。微小的差别（包括书写方式）就会破坏你的程序。\n\n现在尝试编写下面程序的代码，并确保遵守正确的大小写和语法。\n\n1. 使用\
    \ `want this program` 作为程序的类名。\n2. 在第三行，写一行单行注释：Let’s start here.。\n3. 创建一个布尔变量\
