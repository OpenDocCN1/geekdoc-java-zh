  trans: "\n\n如果你已经熟悉了任何一种编程语言，那么记忆下表会更容易。几乎所有的编程语言在用于比较运算符时都使用相同的符号。在编写更复杂的程序时，你绝对会需要它们。\n\
    \n| 比较运算符 |\n| :--- | :--- |\n| 小于 | `<` |\n| 小于等于 | `<=` |\n| 大于 | `>` |\n| 大于等于\
    \ | `>=` |\n| 等于 | `==` |\n| 不等于 | `!=` |\n\n使用运算符比思考另一种编写程序的方法要容易。记忆这些不同的表格应该是你的首要任务。\n\
    \n## 布尔逻辑运算符\n\n布尔逻辑运算符与比较运算符不同。逻辑运算符通常用于查找条件语句的最终结果或测试参数。\n\n| 布尔逻辑运算符 |\n| :---\
    \ | :--- |\n| 非 (NOT) | `!` |\n| 与 (AND) | `&&` |\n| 或 (OR) | `||` |\n| 异或 (EXCLUSIVE\
    \ OR) | `^` |\n\n## 不同的真值表\n\n本节专门介绍你可以作为快速参考的不同真值表。请随手保存，因为你永远不知道何时会再次需要它们。\n\
    \n在第 6 章，你将学习如何使用不同的 Java 控制语句，真值表就会大显用场。控制语句通常告诉程序，只要块上面的条件语句保持真，就执行该块的代码。如果语句返回假值，程序将停止执行该特定块的循环。程序将继续执行你代码的后续行，直到遇到告诉它停止的条件。\n\
    \n### AND（与）真值表\n\n| 'AND' 的真值表 |\n| :--- | :--- | :--- |\n| `A` | `B` | `A &&\
    \ B` |\n| FALSE | FALSE | FALSE |\n| FALSE | TRUE | FALSE |\n| TRUE | FALSE |\
    \ FALSE |\n| TRUE | TRUE | TRUE |\n\n#### 关于如何使用 AND 表格的说明\n\n`A` 和 `B` 行是语句中每个参数的条件，`A&&B`\
    \ 行显示了当参数 `A` 为真/假且参数 `B` 为真/假时的最终答案。\n\n如果 `A` 为假且 `B` 为假，则语句将返回假作为答案。如果 `A`\
    \ 为假且 `B` 为真，则语句将返回假。其他参数的解释也相同。\n\n### OR（或）真值表\n\n| 'OR' 的真值表 |\n| :--- | :---\
    \ | :--- |\n| `C` | `D` | `C || D` |\n| FALSE | FALSE | FALSE |\n| FALSE | TRUE\
    \ | TRUE |\n| TRUE | FALSE | TRUE |\n| TRUE | TRUE | TRUE |\n\n#### 关于如何使用 OR\
    \ 表格的说明\n\n`C` 和 `D` 行是语句中每个参数的条件，`C||D` 行显示了当参数 `C` 为真/假或参数 `D` 为真/假时的最终答案。\n\
    \n如果 `C` 为假或 `D` 为假，则语句将返回假作为答案。如果 `C` 为假或 `D` 为真，则语句将返回真。其他参数的解释也相同。\n\n### NOT（非）真值表\n\
    \n| 'NOT' 的真值表 |\n| :--- | :--- |\n| `A` | `!A` |\n| FALSE | TRUE |\n| TRUE |\
    \ FALSE |\n\nNOT 表将参数或表达式的反面作为其最终答案。如果 `A` 为假，则 `!A` 的最终答案为真。\n\n### EXCLUSIVE\
    \ OR（异或）真值表\n\n| 'EXCLUSIVE OR' 的真值表 |\n| :--- | :--- | :--- |\n| `A` | `B` |\
    \ `A ^ B` |\n| FALSE | FALSE | FALSE |\n| FALSE | TRUE | TRUE |\n| TRUE | FALSE\
    \ | TRUE |\n| TRUE | TRUE | FALSE |\n\n异或的原理与之前的 OR 表类似，但当两个参数都为真时，异或给出的最终答案为假。\n\
    \n立刻记住所有表格并不容易。你需要一个一个地记。如果你记住了第一张表，就可以继续下一个。\n\n对于你的下一个作业，请找到一种更容易的方法来记忆不同的真值表。你应该能找到的。提示：记住答案大部分为真或大部分为假的实例。\n\
    \n## 第 5 章：关于数学\n\n当你玩得开心时，时间过得真快，现在已经是你 Java 课程的第五天了。这次你需要纯粹处理数字，是时候学习数学了。在 Java\
    \ 中，你可以进行加、减、乘、除法，还可以得到余数。这课并不难理解。事实上，它类似于在纸上做数学题。余数或模现在看起来可能没用，但等到了你会感激它的。\n\n\
    在继续本章的课程之前，确保你已经记住了第 4 章中的大多数表格。在进入下一节之前，确保你理解了上一节。\n\n### 通过 Java 加法\n\n在学习 Java\
