    ## Chapter 1: Getting Acquainted with Java

    You are here now because you are interested to know and learn Java programming.
    It is best to start right away, but you need to understand a few things before
    you can start your Java journey. For online coding it is recommended to go to
    this site: `https://www.compilejava.net/`.


    The link provided is an online Java IDE (Integrated Development Environment).
    You need to clear the written codes on the online Java IDE prior to writing your
    own codes. It is also advisable to type your codes directly on the online Java
    IDE.


    If you know a few things about Java, then you must have learned that when you
    install this programming language to your computer, you need to use a text editor.
    But, if you choose to write your codes on the online Java IDE, then you don’t
    need to use a text editor. Copy-pasting your work from a text editor to the online
    IDE might introduce characters or symbols that the online Java IDE might not recognize,
    such as the quotation marks. The online IDE only accepts these symbols for quotation
    marks: `''` and `"` .


    Take this sample program that has been written on a text editor and copy-pasted
    on the online Java IDE:


    ```java

    | 1 | public class CompareData { |

    | 2 |     public static void main(String []arqs) { |

    | 3 |         char tChar=''r’; |

    | 4 |         int tDigit=3; |

    | 5 |         system.out.println(tChar==tDigit); |

    | 6 |     } |

    | 7 | } |

    ```


    The sample program gave this error:

    ```

    /tmp/CompareData.java:3: error: unmappable character for encoding

    ```

    The error means the program used unacceptable quotation marks; you need to change
    it directly on the online IDE.

