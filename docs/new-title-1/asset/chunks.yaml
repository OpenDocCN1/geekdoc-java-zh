    the programming language called Java 1.0.  The latest version of Java that programmers
    use today is already at version 8.


    The Java Advantages


    Java is much simpler and easier to learn if you have a basic understanding of
    OOP (Object Oriented Programming).  An OOP programmer can create or code different
    modules that don’t need any modification or alteration even when there’s an addition
    of a new type of object. 


    Unlike C, C++, and other programming languages, Java is platform independent or
    does not interact with the operating system of your computer during compilation. 
    You don’t compile your Java source file into platform independent codes; you compile
    it into byte code.  You can carry the compiled Java program via flash drive, unlike
    the other programming languages that need to use a compiler.


    Java has the ability to generate a virus-free and tamper-free system.  Java is
    also portable.  You can execute the compiled code on different operating systems
    just as long as they have Java runtime environment.


    Many programmers believe that Java is more dynamic than C language and its other
    variations.  It can effectively and easily adapt to any type of environment.


    That will be all for day one, and for your assignment, make sure read more about
    object oriented programming.  A little more information can help a lot to better
    understand how Java works.


    Chapter 2: It Always Starts with“Hello”


    It is clear from the beginning that this book will use as many examples as necessary
    to teach Java basics.  If you have tried learning a programming language prior
    to this one then you might have encountered a“Hello”program.  Most programming
    language tutorials start with a“Hello”program as a sample program.  Let us start
    with a simple“Hello Java”as our sample program.  You can click the provided link
    now and start writing your codes or you can do that later–anything is acceptable,
    whichever is more comfortable to you.


    At the end of this tutorial, you will receive different links that you can access
    in order to install Java into your own computer.  You can still opt to use the
    online Java IDE, whichever you prefer is fine.


    The online Java console has different font colors.  For the purpose of simplification,
    we will only use one font color in all the examples.


    The Basic Java Syntax


    We will start with the sample program below and analyze what each line means. 
    It is imperative to remember that Java is case sensitive.  When you use an identifier
    and write it using lower cases, make sure that the identifier you use is written
    in the same manner all throughout the program.   


    If you have an identifier called ‘Hello’ that begins with a capital letter H,
    then don’t write the same identifier using a lower caseh as in‘hello’.  Even though
    it is obvious that you are referring to the same identifier, the Java program
    does not recognize it as such.  It will treat‘Hello’as different from‘hello’.


    Now look at the first sample program below:


    | 1 | public class FirstCoding { |  |  |  |  |  |


    | 2 |  |  |  |  |  |  |  |  |  |


    | 3 |    /* This is our first program sample.  |  |  |  |


    | 4 |     * This should print ''Hello Java'' later |  |  |  |


    | 5 |     */ |  |  |  |  |  |  |  |  |


    | 6 |  |  |  |  |  |  |  |  |


    | 7 |     public static void main(String []args) { |  |  |  |


    | 8 |        System.out.println("Hello Java"); // prints Hello Java |  |


    | 9 |     } |  |  |  |  |  |  |  |  |


    | 10 | } |  |  |  |  |  |  |  |  |


    |  |  |  |  |  |  |  |  |  |  |


    Also, look at line 7 and 9.  The beginning curly bracket in line 7 to the closing
    curly bracket in line 9 is called a block of codes.  Anything inside a pair of
    curly brackets is a block of codes.  


    Dissecting the First Line of the Program


    The first line should always begin with‘public class’written in lower cases immediately
    followed by the class name, in this case we use‘FirstCoding’ as the class name. 


    When writing the class name, make sure that there is no space in between the previous
    word and the next word of the name.  Every first letter of the word in a class
    name must be in upper case.


    At the end of the class name is an open or beginning curly bracket, which prompts
    the computer that the succeeding lines or sentences must be executed.


    Explanation for the Second and Sixth Lines


    Thesecond and sixth lines don’t contain any codes.  The blank lines create readability. 
    It is also easier for the assigned programmer or team of programmers to maintain
    the system or modify the program should a problem suddenly occurs. 


    Analyzing the Third, Fourth, and Fifth Lines


    The third line is indented and starts with ‘/*’, which marks the start of a multi-line
    comment.  You use the asterisk (*) if you need to insert a multi-line comment. 
    After the‘/*’symbol, you write the comment that you would like to put.  The comment
    serves as reminder about the program.  It can be used to inform the programmer
    about the task that the program or module needs to accomplish.  


    The fourth line is also indented and has asterisk to signify the continuation
    of the comment in line 3.


    The fifth line is indented and has this symbol‘*/’that signifies the end of the
    multi-line comment.  The computer does not consider the comments as part of the
    program and won’t bother with it when you run the program.


    The Seventh and Ninth Lines


    The seventh line is indented and it contains the method name.  Remember to write
    the method name always in lower case, like this:


    public static void main(String []args) {


    The ninth line is indented and only contains the closing curly bracket.  The seventh
    line’s curly bracket at the end of the method name and the closing bracket in
    the ninth line are indicators that tell the computer to execute the codes within
    the brackets. 


    What the Eighth Line Tells


    The eighth line should be indented and it contains the command that instructs
    the computer to print or write ‘Hello Java’ on your computer screen.  It should
    appear like this:


    System.out.println("Hello Java");


    The command starts with an upper case, and the semi colon (;) at the end of the
    sentence means that there could be other things that the block of codes needs
    to do.  In our example, the next line (the ninth line) bears the closing bracket,
    which means the program has reached the end of the block.


    The ‘//’ symbol means that the written code after it is a single line comment. 


    The ‘.println’ is the command that you use if you want to print something on screen. 
    It is usually written like this:


    println("Hello Java")


    It tells the computer to print the characters inside the parentheses.  When printing
    a string, make sure to enclose it in quotes like you see above.


