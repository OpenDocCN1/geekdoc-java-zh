    Chapter 6: Talk About Taking Control


    There are control statements in Java programming that can help regulate the program’s
    order of execution.  The control statements that we will discuss in this ebook
    are:


    1.  The if statement.


    2.  The if-else statement.


    3.  The switch statement.


    4.  The while statement.


    5.  The do-while statement.


    6.  The for statement.


    You can use any of the mentioned control statements depending on what you want
    your program to do.  These control statements are enough for now since you are
    only a beginner.  They are also the widely used control statements in Java programming.


    Understanding the If Statement


    The if statement tells the computer to continue executing the block of codes as
    long as the expression within the if statement remains true.  If under a certain
    event that the statement becomes false, then it should prompt the computer to
    stop executing that particular block of codes.  If there are other if statements
    somewhere in the program, the computer will continue executing them as long as
    the condition or expression within the block of codes is true.


    There are cases when the execution of the if statement might not continue unless
    a separate block of codes within the if block is satisfied.  Upon meeting all
    of the conditions and the expression within the block returns false as reply,
    then the computer will stop executing that block of codes.


    The if statements follow this syntax:


    if <conditional expression>


    <statement action>


    if <conditional expression>


    <statement action>


