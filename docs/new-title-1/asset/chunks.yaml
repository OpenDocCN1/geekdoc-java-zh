    Chapter 7: More Practice


    You have learned all the Java basics that you need to learn. You can now write
    your own simple codes.


    Practice makes perfect–remember that.  Whenever you have free time, make sure
    to practice what you have learned.


    You can get ideas for programs from everyday tasks or chores that you do and other
    simple things.  Here are some ideas that you can use to create a program that
    you might like to try your hands on:


    1.  Plotting your budget.


    2\. Creating a uniform mathematical formula for the calculations that you routinely
    do.


    3.  Creating a simple puzzle that can help take the boredom away at some days.


    4.  Writing a story with different endings depending on the choice that the reader
    makes.


    You can search the net for more sample programs if you want to advance. However,
    be warned that not all the programs you can find online will not always work. 
    Although it can actually provide a good training by finding the errors and correcting
    them.  There’s nothing more fulfilling than being able to make a certain program
    run even if you did not code it.


    Importance of Comments for a Team of Programmers


    Comments in a program are actually helpful, especially if you are thinking about
    working in an IT company or a company that has its own IT experts that maintains
    their system.   It is usual for companies to have an in-house team that will code
    or develop a certain part of the system, and another team for maintaining the
    system.


    The team that maintains or upgrades the system will benefit a lot from the comments
    in the code about the task that a particular block of codes must accomplish. 
    If there’s a bug in the system, then the maintenance team would be able to point
    out the problem in a matter of time.


    Sometimes, testing the efficiency of the program for a few days is not enough. 
    There are cases where the problems only begin to occur after several months of
    running the program.  If you leave comments within the codes, then it would be
    easier to trace the possible problem and correct it before it gets worse.


    The Best Time to Practice and Other Tips


    You can practice your newly acquired skill in Java programming whenever you have
    free time.  It is best to allot a schedule for it to compel yourself to practice
    at your allotted schedule.


    It is important to practice so you can familiarize yourself well with the different
    commands of Java and make programming more fun and easier.  You can use your skill
    in different things and you might even learn to develop your own online game when
    you get better at Java programming.


    If you aren’t feeling well, but your schedule states that you should practice
    your coding, then you should just rest and do nothing.  You need to pour your
    full attention when coding a program.  It could be so frustrating when your program
    failed to work. 


    Always remember the important things that you need to keep in mind while working
    with Java.  The most important one being that Java is extremely case sensitive;
    one . 


    You also need to be careful in declaring your variables.  It is important to remain
    consistent so as to not confuse the program.  When it comes to Java programming,
    what you regard as a slight difference is actually a huge thing.


    If you can’t install Java in your computer, you can still use the online Java
    coding platform. There is a possibility that you might lose any initial enthusiasm
    that you have in learning Java when you get frustrated.  You need to keep a high
    level of enthusiasm in anything you do to make the activity or work more fun and
    less stressful.


