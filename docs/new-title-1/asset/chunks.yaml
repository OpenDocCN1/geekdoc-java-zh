    4:     System.out.println("Numerals 10 to 1");

    5:     do {

    6:         System.out.println(rabbit--);

    7:     } while (rabbit >= 1);

    8:   }

    9: }

    ```


    它将给出输出：

    ```

    Numerals 10 to 1

