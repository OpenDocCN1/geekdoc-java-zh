    1。再次，符号 `--` 告诉程序将变量的值减 1。


    然后它检查 `rabbit` 的值是否大于或等于 1。此时 `rabbit` 的值为 9，仍然大于或等于 1。它将再次执行代码块并在屏幕上打印 9。程序将一直循环，直到变量
    `rabbit` 的值变为 0。


    当 `rabbit` 小于 1 时，循环停止，程序结束。


    ### For 循环


    当你想要按固定次数重复执行代码块时，可以使用 `for` 循环。只要条件证明为真（true），程序就会继续执行该代码块。


