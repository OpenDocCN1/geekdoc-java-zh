    \ that tells it to stop.\n\n### Truth Table for AND\n\n| TRUTH TABLE FOR 'AND'\
    \ |\n| :--- | :--- | :--- |\n| `A` | `B` | `A && B` |\n| FALSE | FALSE | FALSE\
    \ |\n| FALSE | TRUE | FALSE |\n| TRUE | FALSE | FALSE |\n| TRUE | TRUE | TRUE\
    \ |\n\n#### Explanation on How to Use the AND Table\n\n`A` and `B` rows are the\
    \ condition of each argument in a statement, and the `A&&B` row shows the final\
    \ answer in case argument `A` is true/false and argument `B` is true/false.\n\n\
    If `A` is false and `B` is false then the statement will return false for an answer.\
    \ If `A` is false and `B` is true, then the statement will return false. The same\
    \ explanation goes with the rest of the arguments.\n\n### Truth Table for OR\n\
    \n| TRUTH TABLE FOR 'OR' |\n| :--- | :--- | :--- |\n| `C` | `D` | `C || D` |\n\
    | FALSE | FALSE | FALSE |\n| FALSE | TRUE | TRUE |\n| TRUE | FALSE | TRUE |\n\
    | TRUE | TRUE | TRUE |\n\n#### Explanation on How to Use the OR Table\n\n`C` and\
    \ `D` rows are the condition of each argument in a statement, and the `C||D` row\
    \ shows the final answer in case argument `C` is true/false or argument `D` is\
    \ true/false.\n\nIf `C` is false or `D` is false then the statement will return\
    \ false for an answer. If `C` is false or `D` is true, then the statement will\
    \ return true. The same explanation goes with the rest of the arguments.\n\n###\
    \ Truth Table for NOT\n\n| TRUTH TABLE FOR 'NOT' |\n| :--- | :--- |\n| `A` | `!A`\
    \ |\n| FALSE | TRUE |\n| TRUE | FALSE |\n\nThe NOT table gives the opposite of\
    \ the argument or expression as its final answer. If `A` is false, then `!A`’s\
    \ final answer is true.\n\n### Truth Table for EXCLUSIVE OR\n\n| TRUTH TABLE FOR\
