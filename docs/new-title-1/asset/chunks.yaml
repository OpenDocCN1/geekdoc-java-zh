    \n## 第 6 章：谈谈控制\n\nJava 编程中的控制语句可以帮助调节程序的执行顺序。我们在本电子书中讨论的控制语句有：\n\n1. `if` 语句。\n\
    2. `if-else` 语句。\n3. `switch` 语句。\n4. `while` 语句。\n5. `do-while` 语句。\n6. `for`\
    \ 语句。\n\n### 理解 if 语句\n\n`if` 语句告诉计算机，只要 `if` 语句中的表达式为真，就继续执行该代码块。如果在某些特定情况下该语句变为假，那么它应该提示计算机停止执行特定的代码块。如果程序其他地方还有其他\
    \ `if` 语句，只要代码块中的条件或表达式为真，计算机就会继续执行它们。\n\n`if` 语句遵循以下语法：\n\n```java\nif <conditional\
    \ expression>\n\n<statement action>\n```\n\n"
