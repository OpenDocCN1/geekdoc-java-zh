    that tells it to stop.


    Truth Table for AND


    | TRUTH TABLE FOR ''AND'' |


    | A | B | A && B |


    | FALSE | FALSE | FALSE |


    | FALSE | TRUE | FALSE |


    | TRUE | FALSE | FALSE |


    | TRUE | TRUE | TRUE |


    Explanation on How to Use the AND Table


    A and B rows are the condition of each argument in a statement, and the A&&B row
    shows the final answer in case argument A is true/false and argument B is true/false.


    If A is false and B is false then the statement will return false for an answer. 
    If A is false and B is true, then the statement will return false.  The same explanation
    goes with the rest of the arguments.


    Truth Table for OR


