    | 13 |  |  |  |  |  |  |  |  |  |


    |  |  |  |  |  |  |  |  |  |  |


    Any number, within the allowed range of numbers, that you want to place inside
    the parentheses in‘System.out.println();’ will be printed.  Make sure to follow
    the correct syntax, like in the given example.


    The Data Type Boolean (true or false)


    The“boolean" data type has specific values, and it is either true or false; it
    will not give any other answer.  There’s also no need for you to put anything
    in quotes because the program automatically assigns true or false (depending on
    the given condition) as the legit value of boolean expression.


    Take a look at this sample program:


    | 1 | public class PrintBoolean { |  |  |  |  |  |


    | 2 |  |  |  |  |  |  |  |  |  |


    | 3 |     public static void main(String  []args) { |  |  |  |


    | 4 |        System.out.println(false); |  |  |  |  |


    | 5 |     } |  |  |  |  |  |  |  |  |


    | 6 | } |  |  |  |  |  |  |  |  |


    |  |  |  |  |  |  |  |  |  |  |


    It prints this result:


    | false |  |  |  |  |  |  |  |  |


    |  |  |  |  |  |  |  |  |  |  |


    When you try to replace the value inside the parentheses with‘jabberwocky’, like
    this:


    | 1 | public class PrintBoolean { |  |  |  |  |  |


    | 2 |  |  |  |  |  |  |  |  |  |


    | 3 |     public static void main(String  []args) { |  |  |  |


    | 4 |        System.out.println(jabberwocky); |  |  |  |


    | 5 |     } |  |  |  |  |  |  |  |  |


    | 6 | } |  |  |  |  |  |  |  |  |


    It yields this result:


    | /tmp/java_J0wki9/PrintBoolean.java:4: error: cannot find symbol |  |


    |        System.out.println(jabberwocky); |  |  |  |  |


    |                           ^ |  |  |  |  |  |


    |   symbol:   variable jabberwocky |  |  |  |  |  |


    |   location: class PrintBoolean |  |  |  |  |  |


    | 1 error |  |  |  |  |  |  |  |  |


    | Unable to execute program; could not compile! |  |  |  |


    |  |  |  |  |  |  |  |  |  |  |


    Java did not treat the word‘jabberwocky’ as Boolean, and it did not print it because
    it is a string.  The rule for string is that you need to put it in quotes so the
    program can recognize it as string and prints it.


    The Data Type Character (char) 


    The data type character or char represents a single character.  All characters
    must be enclosed in single quotes ('' ''), otherwise you will get an error message. 
    It is a string after all, but you only need to use single quotes.


    Take a look at the sample below:


    | 1 | public class PrintCharacter { |  |  |  |  |  |


    | 2 |  |  |  |  |  |  |  |  |  |


    | 3 |     public static void main(String  []args) { |  |  |  |


    | 4 |        System.out.println(''a''); |  |  |  |  |


    | 5 |     } |  |  |  |  |  |  |  |  |


    | 6 | } |  |  |  |  |  |  |  |  |


    |  |  |  |  |  |  |  |  |  |


    It prints this result:


    | a |  |  |  |  |  |  |  |  |  |


    |  |  |  |  |  |  |  |  |  |  |


    Keep in mind that Java’s basic data types are int, boolean, and char.  You will
    almost always encounter these data types while you learn Java.  Expect to see
    more of them later.


    Variables


    Java and other programming languages use variables to store data.  You can store
    any data type in a variable, and you just need to make sure to specify the data
    type by following the right syntax in declaring them.


