    # Chapter 8: Your Own Java in your Computer


    You can install Java in your computer so you can have unlimited access to it even
    though you’re not online. However, your computer must fulfill a couple of basic
    requirements before you can install Java.


    ## System Requirements


    It is important that your computer runs on `Pentium 200-MHz` or better. It is
    also necessary for it to have a minimum of `64 MB RAM` (Random Access Memory).
    These are the most basic system requirements for Java, and as you can see they
    are quite low, even the most basic computer systems available today have more
    than enough power.


    Your computer needs to have an Operating System (OS) like `Windows XP`, `Windows
    7`, `Windows 8`, or `Linux`. It is also fine if you are using `Mac`. This book
    has included the set up paths for the different platforms. Choose `Java JDK8`
    when installing Java in your computer.


    It is also recommended to have a `Microsoft Notepad` or other text editor handy.
    It is best to use a text editor when coding your Java program.


    ## Local Environment


    If you would like to create a local environment set up for your Java programming,
    then you need to go to this link: `http://www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133151.html`


    You can download the Java programming language for free. Just choose the version
    of Java that’s compatible to your operating system.


    After making the right Java that’s compatible to your operating system, follow
    the instructions on how to download Java to your computer system. Run the `.exe`
    file that makes installation of Java to your computer possible. Once the Java
    programming language is properly installed the next thing that you need to do
    is set the path that is appropriate to your platform.


    ### Setting the Path for Windows


    If you have successfully installed Java to your computer, then you will see something
    like the one below when you view your directory:


    ```

    c:\Program Files\java\jdk

    ```


    You need to point your cursor to `My Computer` and click on it. You need to open
    it and once it has been opened it, right-click your mouse and choose `Properties`
    (it is located at the bottom part of the available choices).


    Below the tab that says `Advance`, you will see a button with a label `Environment
    variables` on it. Click on that button.


    The next step you need to make is to modify the `Path` variable. It should contain
    the path to `Java.exe`. If the current path you see is set to this one:


    ```

    C:\WINDOWS\SYSTEM32

    ```


    Then there’s a need for you to change or modify the path into this one:


    ```

    C:\WINDOWS\SYSTEM32;c:\Program Files\java\jdk\bin

    ```


    Once you set the right path for Windows OS you can start coding your Java program.


    ### Setting the Path for Linux, UNIX, Solaris, FreeBSD


    For `Linux`, `UNIX`, `Solaris`, or `FreeBSD`, you need to properly set the environment
    variable `PATH` to accurately point the location of the installed Java binaries.
    You have a shell documentation that serves as your reference in case you encounter
    some problem or difficulty in setting the path.


    If you prefer to use `bash`, for example, then you also need to add `export PATH=/path/to/java:
    $PATH`. It looks like this:


    ```bash

    .bashrc: export PATH=/path/to/java:$PATH

    ```


    ## Popular Java Editors


    The earlier batches of programming language don’t use any text editor, unlike
    most modern programming languages today. Java requires the programmers to code
    or write the Java program using a text editor. There are several sophisticated
    Integrated Development Environments or IDEs that you can use for your Java programming.


    IDE is a software application that provides or presents comprehensive facilities
    for the software development or creation that the programmers will benefit a lot
    from. IDE usually have build automation tools, text editor, and debugger.


    Below is the list of some of the most popular text editors that a Java programmer
    can use:


    1. **Notepad** – if you have a Windows OS in your computer, then you can use the
    built-in `Notepad` editor that comes with Windows and code your program. There’s
    also `TextPad` that you can choose if you prefer it. The beauty of `Notepad` is
    that you don’t need to worry if ever you need to copy paste something with picture.
    `Notepad` only allows text and it won’t accept the picture even if you try to
    paste it.


    2. **Netbeans** – this is actually one of the Java IDEs that you can download
    for free from this link: `http://www.netbeans.org/index.html`


    3. **Eclipse** – another recommended Java IDE that is created by the eclipse open-source
    community. You can get it from this link: `http://www.eclipse.org/`


    You can explore the net for other IDEs that you might like to try or want to keep.
    Once you have installed the Java programming language in your computer, you got
    no more reason to put off your practice session. Your success depends on your
    diligence and hunger to learn more about Java.


    ## Conclusion


    Thank you again for downloading this book!


    I hope this book was able to help you start your Java programming journey and
    has kept you motivated till the end of this book. There are more things that Java
    can offer and you can advance further if you continue to explore the many wonderful
    things about Java.


    You might want to take advance lessons when you feel like are ready to do them.
    You only need to know the proper syntax for the additional commands. The right
    work attitude and views in solving certain problems have been instilled within
    you, and it should aid you in tackling the problem with positivity.


    I hope this book has served its purpose real well and made you understand the
    Java basics that you need to know to help you code a Java program with ease.


    The next step is to continue practicing what you have learned and share the knowledge
    with your loved ones if needed. You can take on another programming language if
    you choose, and discover the many things that you can do.


    Finally, if you enjoyed this book, then I’d like to ask you for a favor, would
    you be kind enough to leave a review for this book on Amazon? It’d be greatly
    appreciated!


    Thank you and good luck!

    '
