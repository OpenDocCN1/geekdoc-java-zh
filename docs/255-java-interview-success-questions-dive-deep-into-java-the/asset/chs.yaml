  \ 2, copyTo, 0, 7);\n        System.out.println(copyTo);\n    }\n}\n```\n代码将打印什么？选择\
  \ 1 个选项。\nA) “runchy”\nB) “runchy c”\nC) “unchy c”\nD) “unchy co”\nE) “crunchy”\n\
