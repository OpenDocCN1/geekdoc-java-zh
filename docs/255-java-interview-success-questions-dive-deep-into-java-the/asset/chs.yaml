  \        writer.add(4);\n        writer.print();\n    }\n}\n```\n正确或错误：此代码可以编译\n\
  A) 正确\nB) 错误\n\n答案是 **A**。该类没有调用 `printAnother`，这是可以接受的。实现类不需要调用所有的默认方法。\n\n###\
  \ Q44\n正确或错误：接口上的静态方法可以被重写\nA) 正确\nB) 错误\n\n答案是 **B**。如果一个带有静态方法的接口被类实现，而该类又实现了一个与接口静态方法签名相同的方法，那么接口的静态方法仍然存在于接口中，而类的静态方法存在于类中。\n\
  \n### Q45\n```java\npackage Exam;\ninterface LambdaInterface {\n    public void\
  \ printer(String x);\n    default void printAnother() {\n        System.out.println(\"\
  Another Print!\");\n    }\n}\npublic class Test {\n    public static void main(String\
  \ args[]) {\n        LambdaInterface inter = (String x) -> System.out.println(x);\n\
  \        inter.printer(\"Print Me!\");\n    }\n}\n```\n以下代码打印什么？请选择以下之一。\nA) “Print\
  \ Me!”\nB) “Another Print!”\nC) 无法编译\n\n答案是 **A**。这是一个 lambda 函数实现接口上抽象方法的简单示例。\n\
  \n### Q46\n```java\npackage Exam;\ninterface LambdaInterface {\n    public void\
  \ printer(String x);\n    public void anotherPrinter();\n    default void printAnother()\
  \ {\n        System.out.println(\"Another Print!\");\n    }\n}\npublic class Test\
  \ {\n    public static void main(String args[]) {\n        LambdaInterface inter\
  \ = (String x) -> System.out.println(x);\n        LambdaInterface anotherInter =\
  \ () -> System.out.println(\"Print This!\");\n        inter.printer(\"Print Me!\"\
  );\n    }\n}\n```\n以下代码打印什么？请选择以下之一。\nA) “Print Me!”\nB) “Print This!”\nC) “Another\
  \ Print!”\nD) 无法编译\n\n答案是 **D**。编译器不知道哪个抽象函数应该接收该 lambda 函数实现。这也是为什么带有两个抽象函数的接口不是函数接口的原因。\n\
  \n### Q47\n```java\npackage Exam;\nimport java.clock.LocalDate;\npublic class HelloWorld{\n\
  \    public static void main(String []args){\n        LocalDate local = LocalDate.new();\n\
  \        System.out.println(local);\n    }\n}\n```\n以下代码打印什么？请选择以下之一。\nA) 当前时间\n\
  B) 当前日期\nC) 当前时间和日期\nD) 无法编译\n\n答案是 **D**。`LocalDate` 属于 `java.time` 包。\n\n### Q48\n\
  以下哪项不是 `java.time.LocalDate` 方法？\nA) atTime\nB) equals\nC) getDayOfYear\nD) getDayDay\n\
  E) isLeap\n\n答案是 **D**。没有 `getDayDay` 方法，但有一个 `getDayOfWeek`。`atTime` 将日期与时间创建 `LocalDateTime`\
  \ 对象。`equals` 比较两个日期。`getDayOfYear` 返回 1 到 366（闰年）。`isLeap` 返回 `LocalDate` 对象是否为闰年的布尔值。\n\
  \n### Q49\n`Boolean` 对象的默认值是什么？\nA) true\nB) false\nC) undefined\nD) null\n\n答案是\
  \ **D**。`Boolean` 对象（不要与 `boolean` 原类型混淆）默认值为 `null`。`boolean` 原类型默认值为 `false`。\n\
  \n### Q50\n`int` 原类型的大小是几字节？\nA) 1 字节\nB) 2 字节\nC) 4 字节\nD) 8 字节\n\n答案是 **C**。`int`\
  \ 原类型可以持有 4 字节的数据，能够存储 -2,147,483,648 到 2,147,483,647 之间的值。\n\n### Q51\n什么语法创建可选的编译时依赖？\n\
  A) requires dev com.module\nB) requires static com.module\nC) import com.module\n\
  \n答案是 **B**。\n\n### Q52\n```java\npackage Exam;\npublic class Test{\n    public\
  \ static void main(String[] args) {\n        Test q = new Test();\n        StringBuilder\
  \ sb = new StringBuilder(\"This\");\n        q.changeThis(sb);\n        System.out.println(sb);\n\
  \    }\n    public void changeThis(StringBuilder str){\n        System.out.print(str\
  \ + \" \"); // 第 1 行\n        str = new StringBuilder(\"That\"); // 第 2 行\n    }\n\
  }\n```\n以下代码打印什么？请选择以下之一。\nA) “This That”\nB) “That That”\nC) “This This”\nD) 无法编译\n\
  \n答案是 **C**。记住 Java 是值传递。第 2 行将 `str` 指向了 JVM 内存中的新位置/对象，因此 `str` 原本指向的原始不受该行代码的影响。\n\
  \n### Q53\n以下代码片段是有效的。\n`static int i1, i2[], i3;`\n选择选项。\nA) 正确\nB) 错误\n\n答案是 **A**。该代码片段可以编译。但它难以处理且不推荐。如果下一行代码是\
  \ `i2[] = new int[10];`，JVM 将无法编译。推荐写法是：`static int i2[] = new int[10];`。\n\n\n\n\
  \n\n## Q54 已解答。\n```java\npackage Exam;\npublic class Test {\n    public static\
  \ void main(String[] args) {\n        float f = 5.0;\n        Test q = new Test\
  \ ();\n        q.runInt(f);\n    }\n    public void runInt(float f){\n        Integer\
  \ i = new Integer(new Float(f).intValue());\n        System.out.print(i );\n   \
  \ }\n}\n```\n代码的输出是什么？选择一个选项。\nA) “5”\nB) “5.0”\nC) 编译时异常\nD) 运行时异常\n答案是 C。`float\
  \ f = 5.0;` 是无效的。JVM 将该行读取为尝试将 `double` 赋值给 `float`，它不会将 `double` 降级为 `float`，因为可能会丢失数据。\n\
  \n## Q55 已解答。\n什么命令行命令会显示所有模块？\nA) `java --show-modules`\nB) `java --list-modules`\n\
  C) `java --module-chart`\nD) `java --modules`\n答案是 B。\n\n## Test 2 答案\n\n### Q1\
  \ 已解答。\n```java\npackage Exam;\npublic class Test {\n    public static void main(String[]\
  \ args) {\n        Test q = new Test();\n        String s = \"hello\";\n       \
  \ StringBuilder sb = new StringBuilder(\"world\");\n        System.out.println(q.addString(s));\n\
  \        System.out.println(q.addSB(sb));\n        System.out.println(s);\n    \
  \    System.out.println(sb);\n    }\n    public String addString(String str){\n\
  \        str += \" world\";\n        return str;\n    }\n    public StringBuilder\
  \ addSB(StringBuilder strbl){\n        strbl.insert(0, \"hello \");\n        return\
  \ strbl;\n    }\n}\n```\n代码将打印什么？\nA) 四次 \"hello world\"\nB) “hello” 后面跟着 “hello\
  \ world” 后面跟着 “hello” 后面跟着 “hello world”\nC) “hello” 后面跟着 “world” 后面跟着 “hello” 后面跟着\
  \ “world”\nD) 两次 \"hello world\" 后面跟着 “hello” 后面跟着 “hello world”\n答案是 D。`String`\
  \ 和 `StringBuilder` 都是对象，因此它们通过引用传递。但是，`String` 是不可变的，`StringBuilder` 不是。因此 `s`\
  \ 从未真正被改变。此外，在 `addString()` 方法中，`str +=` 创建了一个新的 `String` 对象，因此 `return str` 返回了一个值为\
  \ \"hello world\" 的 `String` 对象。\n\n### Q2 已解答。\n```java\npackage Exam;\npublic\
  \ class Test {\n    public static void main(String[] args) {\n        switch(2){\n\
  \            case 1: System.out.println(\"1\");\n            case 2: System.out.println(\"\
  2\");\n            case 3: System.out.println(\"3\");\n            default: System.out.println(\"\
  None of the above\");\n        }\n    }\n}\n```\n代码打印什么？选择一个选项。\nA) 打印 \"2\"\nB)\
  \ 打印 \"1\", \"2\", \"3\", \"None of the above\"\nC) 打印 \"2\", \"3\"\nD) 打印 \"2\"\
  , \"3\", \"None of the above\"\nE) 无法编译\n答案是 D。`switch` 语句选择了 `case 2`，但随后它会穿透 2\
  \ 之后的所有 case。\n\n### Q3 已解答。\n```java\npackage Exam;\nimport java.io.BufferedReader;\n\
  import java.io.FileReader;\nimport java.io.IOException;\npublic class Test {\n \
  \   public static void main(String[] args) {\n        try {\n            BufferedReader\
  \ br = new BufferedReader(new FileReader(\"file.txt\"));\n            StringBuilder\
  \ sb = new StringBuilder();\n            String line = br.readLine();\n        \
  \    while (line != null) {\n                sb.append(line);\n                sb.append('\\\
  n');\n                line = br.readLine();\n            }\n            String everything\
  \ = sb.toString();\n        } finally {\n            br.close();\n        }\n  \
  \  } catch (Exception e) {\n        System.out.println(\"Exception caught\");\n\
  \    } catch (IOException e) {\n        System.out.println(\"IOException caught\"\
  );\n    }\n}\n```\n如果 `file.txt` 为空，代码将生成什么？选择 1 个选项。\nA) 代码将打印 \"Exception caught\"\
  \nB) 如果 `file.txt` 不为空，代码无法编译。\nC) 代码将打印 \"IOException caught\"\nD) 代码将抛出一个未捕获的异常，导致程序结束。\n\
  答案是 B。`IOException` 的 `catch` 块必须在 `Exception` 的 `catch` 块之前。否则，编译器会认为 `IOException`\
  \ `catch` 块中的代码无法被抛出。\n\n### Q4 已解答。\n```java\npackage Exam;\npublic class Test\
  \ {\n    public static void main(String[] args) {\n        Test q = new Test();\n\
  \        q.methodRun();\n        System.out.println(\"Complete\");\n    }\n    public\
  \ void methodRun();\n    public void methodHide(){}\n}\nabstract class TestAbstract\
  \ {\n    abstract void methodRun();\n    abstract void methodHide();\n    abstract\
  \ void methodSeek();\n}\n```\n此程序的输出是什么？选择一个选项。\nA) “Complete”\nB) 无法编译\nC) 运行时错误\n\
  答案是 B。子类 `Test` 中的 `methodRun()` 是抽象的，因为它没有体。因此它必须标记为 `abstract`，否则将无法编译。然而，只有标记为\
  \ `abstract` 的类可以有抽象方法。\n\n### Q5 已解答。\n```java\npackage exam\npublic class Test\
  \ {\n    public static void main(String[] args) {\n        int[][] myInt = {{2,\
  \ 3}, {4, 5, 6}, {7, 8, 9}};\n        System.out.println(myInt[1]);\n        System.out.println(myInt[3]);\n\
  \    }\n}\n```\n代码的输出是什么？选择一个答案。\nA) “5” 跟着 “ArrayIndexException”\nB) “2” 跟着 “7”\n\
  C) “2” 跟着 “1”\nD) “5” 跟着 “7”\nE) 无法编译\n答案是 A。`myInt[1]` 的值为 5，因为 Java 从索引 0 开始计数。`myInt`\
  \ 在 0-9 的位置有元素。上述代码也可以编译，但在 `myInt[3]` 处有运行时异常，因为 `myInt` 只有第一个维度。\n\n### Q6 已解答。\n\
  以下哪些是有效的 `ArrayList` 对象方法？选择 3 个。\nA) `.size()`\nB) `.isEmpty()`\nC) `.length()`\n\
  D) `.contains()`\nE) `.removeElement()`\n答案是 A, B, D。`.length()` 是 `String` 对象的方法。`length`\
  \ 是数组对象的字段。`.removeElement()` 不是有效方法。`.remove()` 是 `ArrayList` 类的有效方法，并接受一个对象作为参数。它移除\
  \ `ArrayList` 中该对象的首次出现。\n\n"
