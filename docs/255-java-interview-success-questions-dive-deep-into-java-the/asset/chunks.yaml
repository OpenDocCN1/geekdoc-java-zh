    Answered.package Exam;public class Test extends qqq {​ public Test(int i, int
    j, Integer integer) {​ //Line 1​ }​ public static void main(String[] args) {​
    Test q = new Test(1,2,new Integer("5"));​ }}class qqq{​ public int aa;​ public
    int bb;​ public int cc;​ public qqq(int a, int b, Integer c){​ int aa = a;​ int
    bb = b;​ int cc = c.intValue();​ }}What is needed at Line 1?  Select 1 answer.A) 
    A call to the default constructor of qqq.B) A call to the explicit constructor
    qqq(int a, int b, Integer c)C) Nothing is needed.The answer is B.  A subclass
    must have a call to a superclass constructor, whether it is an implicit call or
    an explicit call.  There is no implicit (default) constructor of qqq since it
    has an explicitely defined constructor.  Therefore the subclass constructor must
    make a call such as the following:  super(i, j, integer);[Q25 Unanswered.](#text00029.html_aBRV)Q26
    Answered.package Exam;public class Test extends SuperTest{​ public static void
    main(String[] args) {​ Test q = new Test();​ try {​ q.run();​ } catch (Exception
    e) {​ e.printStackTrace();​ }​ }​ void run() throws Exception{​ System.out.println("Overriding
    methods can throw more general exceptions");​ }}class SuperTest{​ void run() throws
    FileNotFoundException{​ System.out.println("Overridden methods must throw more
    specific exceptions");​ }}What is the output of the code?  Select 1 answer.A) 
    “Overriding methods can throw more general exceptions”B) “Overridden methods must
    throw more specific exceptions”C)  Does not compileThe answer is C.  With checked
    exceptions, the overridden method must throw more general exceptions or the same
    exception as the overriding method.[Q26 Unanswered.](#text00030.html_aBZW)Q27
    Answered.package Exam;public class Test extends SuperTest {​ public static void
    main(String[] args) {​ Test q = new Test();​ q.returnThis();​ }​ public Number
    returnThis(){​ Number doub = 2.2;​ System.out.println(doub);​ return integ;​ }}class
    SuperTest{​ public Double returnThis(){​ Double num = 3d;​ return num;​ }}What
    does the following code print?  Select one of the following.A)  “2.2”B)  “3”C) 
    Does not compileThe answer is C.  An overriding method in a subclass must return
    the same object or a subclass of the object that the overridden method returns.[Q27
    Unanswered.](#text00031.html_aC08)Q28 Answered.package Exam;import java.util.ArrayList;public
    class Test {​ ArrayList trainList = new ArrayList();​ public static void main(String[]
    args) {​ Test q = new Test();​ ​               //Line 1​ q.addTrain("A1","Fort
    Worth","Amarillo", q.trainList);                            //Line 2​ q.addTrain("A2","Belen","Los
    Angeles",q.trainList);​ q.addTrain("A3","Chicago","Kansas City",q.trainList);​
    System.out.println(((Train) q.trainList.get(1)).getTrainID());​ }​ public void
    addTrain(String id, String dep, String dest, ArrayList tL){​ Train trn = new Train();​
    ​ //Line 3​ trn.setTrainID(id);​ trn.setDeparture(dep);​ trn.setDestination(dest);​
    tL.add(trn);​ ​ //Line 4​ }}class Train{​ private String trainID;​ private String
    departure;​ private String destination;​ public String getTrainID() {​ return
    trainID;​ }​ public void setTrainID(String trainID) {​ this.trainID = trainID;​
    }​ public String getDeparture() {​ return departure;​ }​ public void setDeparture(String
    departure) {​ this.departure = departure;​ }​ public String getDestination() {​
    return destination;​ }​ public void setDestination(String destination) {​ this.destination
    = destination;​ }}Which line causes an Exception?  Select one of the following.A)  Line
    1B)  Line 2C)  Line 3D)  Line 4E)  The code is fineThe answer is E.  This code
    is a good example of object oriented programing.  The Train class is used as a
    model.  Multiple instances are created and stored in an ArrayList to be accessed
    as needed.[Q28 Unanswered.](#text00032.html_aBY2)Q29 Answered.package Exam;import
    java.util.ArrayList;import java.util.List;public class Test{​ List<Train> trainList
    = new ArrayList<Train>();​ public static void main(String[] args) {​ Test q =
    new Test();​ q.addTrain("A1","Fort Worth","Amarillo", q.trainList);​ q.addTrain("A2","Belen","Los
    Angeles",q.trainList);​ q.addTrain("A3","Chicago","Kansas City",q.trainList);​
    System.out.println(q.trainList.get(1).getTrainID());​ }​ public void addTrain(String
    id, String dep, String dest, List<Train> tL){​ Train trn = new Train();​ trn.setTrainID(id);​
    trn.setDeparture(dep);​ trn.setDestination(dest);​ tL.add(trn);​ }}class Train{​
    private String trainID;​ private String departure;​ private String destination;​
    public String getTrainID() {​ return trainID;​ }​ public void setTrainID(String
    trainID) {​ this.trainID = trainID;​ }​ public String getDeparture() {​ return
    departure;​ }​ public void setDeparture(String departure) {​ this.departure =
    departure;​ }​ public String getDestination() {​ return destination;​ }​ public
    void setDestination(String destination) {​ this.destination = destination;​ }}What
    does the following code print?  Select one of the following.A)  “A1”B)  “A2”C)  “A3”D) 
    Does not compileThe answer is B.  This is similar to the previous question but
    uses generics in the ArrayList (and also uses the List interface).  List<Train>
    allows the List to only contain train objects.  This is called type safety.  It
    also avoids casting, which keeps the code cleaner.[Q29 Unanswered.](#text00033.html_aC4T)Q30
    Answered.package Exam;public class Test {​ public static void main(String[] args)
    {​ Integer in = new Integer(5);​ Double db = new Double(5.5);​ System.out.println(in.compareTo(db));​
    }}What does the following code print?  Select one of the following.A)  “1”B)  “0”C)  “-1”D) 
    Does not compileThe answer is D.  Integer’s .compareTo() method requires an Integer
    object inside the parenthesis.  If db had been an Integer and been constructed
    with an int value instead of the double value 5.5, the code would have compiled
    and returned 0.[Q30 Unanswered.](#text00034.html_aC3R)Q31 Answered.package Exam;import
    java.util.ArrayList;public class Test {​ public static void main(String[] args)
    {​ Test q = new Test();​ ArrayList tr = new ArrayList();​ for(int i = 0; i<3;
    i++){​ tr.add(new StringBuilder("str" + i));​ }​ q.change(tr);​ System.out.println(tr.get(1));​
    }​ public void change(ArrayList ls){​ for(int i = 0; i < ls.size(); i++){​ ((StringBuilder)
    (ls.get(i)).append(" is here");​ }​ }}What does the following code print?  Select
    one of the following.A)  “str0”B)  “str0 is here”C)  “str1”D)  “str1 is here”E) 
    Does not compileThe answer is E.  ((StringBuilder) (ls.get(i)).append(" is here");
    is not valid.  Since it is being accessed from the array, the compiler does not
    see ((StringBuilder) (ls.get(i)) as a variable, so it will not modify it.  Other
    methods are valid, such as .toString();[Q31 Unanswered.](#text00035.html_aBS4)Q32
    Answered.True or false?  In java, object parameters are passed by value?A)  TrueB)  FalseThe
    answer is A.  The tricky part is that java passes a copy of the memory reference
    to the method, so both the original reference and the copy of the reference are
    pointing to the same object in memory.  Therefore, if the code modifies the object
    parameter in the method, the original object will truly be modified.  To be succinct,
    java passes by value of reference for non-primitives.  The object itself is never
    passed.[Q32 Unanswered.](#text00036.html_aC1J)Q33 Answered.package Exam;import
    java.util.ArrayList;public class Test {​ public static void main(String[] args)
    {​ ArrayList arr = new ArrayList();​ do{​ int i = 0;​ i++;​ }while(i < 10);​ System.out.println(i);​
    }}What does the following code print?  Select one of the following.A)  “10”B)  “9”C) 
    Does not compileThe answer is C.  i is declared inside the do{} statement.  Therefore,
    it is not visible to anything outside the do{} statement, including both the while()
    statement and the System.out.println() statement.[Q33 Unanswered.](#text00037.html_aC5N)Q34
    Answered.package Exam;import java.util.ArrayList;public class Test {​ public static
    void main(String[] args) {​ ArrayList arr = new ArrayList();​ int i = 0;​ while(i
    < 10)​ do{​ i++;​ }​ System.out.println(i);​ }}What does the following code print? 
    Select one of the following.A)  “10”B)  “9”C)  Does not compileThe answer is C. 
    This code does not compile because do{} must come before the while() statement,
    not after.[Q34 Unanswered.](#text00038.html_aC5E)Q35 Answered.package Exam;import
    java.util.ArrayList;public class Test {​ public static void main(String[] args)
    {​ ArrayList arr = new ArrayList();​ int counter = 0;​ for(int i = 5; i > 0; i--){​
    for(int x = 0; x < i; x++){​ counter++;​ }​ }​ System.out.println(counter);​ }}What
    does the following code print?  Select one of the following.A)  “5”B)  “10”C)  “15”D)  “20”E)  “25”The
    answer is C.  The outer loop executes 3 times before the condition x<i is no longer
    satisfied.[Q35 Unanswered.](#text00039.html_aC2S)Q36 Answered.package Exam;import
    java.util.ArrayList;public class Test{​ public static void main(String[] args)
    {​ ArrayList arr = new ArrayList();​ int counter = 0;​ outer:​ for(int i = 5;
    i > 0; i--){​ inner:​ ​ for(int x = 0; x < i; x++){​ if(x == 3){​ break inner;​
    }​ counter++;​ }​ }​ System.out.println(counter);​ }}What does the following code
    print?  Select one of the following.A)  “10”B)  “12”C)  “14”D)  Does not compileThe
    answer is B.  If counter++ had been placed before the if() statement, the answer
    would have been 14 because counter++ would have executed twice more.[Q36 Unanswered.](#text00040.html_aC0B)Q37
    Answered.package Exam;public class Test {​ public static void main(String[] args)
    {​ System.out.println("Hello World");;;;;;;;;;​ }}True or false?  This code compiles.A)  TrueB)  FalseThe
    answer is A.  The compiler ignores the extra semicolons and the code will print
    “Hello World”.[Q37 Unanswered.](#text00041.html_aBZ9)Q38 Answered.True or False? 
    By default, java modules expose all of their API to other modules?A)  TrueB)  FalseThe
    answer is B.  If a module dependency needs to be exposed, it needs the ‘export’
    keyword in front of the package name.[Q38 Unanswered.](#text00042.html_aBMU)Q39
    Answered.package Exam;public class Test{​ public static void main(String[] args)
    {​ Test q = new Test();​ StringBuilder sb = new StringBuilder("This");​ q.changeThis(sb);​
    System.out.println(sb);​ }​ public void changeThis(StringBuilder str){​ System.out.print(str
    + " ");​ str.delete(0, 4);​ str.append("That");​ }}What does the following code
    print?  Select one of the following.A)  “This That”B)  “That That”C)  “This This”D) 
    Does not compileThe answer is A.  Since java passes by value, str is pointing
    to the same space (in other words, the same object) in memory as sb.  Therefore
    when str is modified then sb is modified.[Q39 Unanswered.](#text00043.html_aC3U)Q40
    Answered.Which of the following are true of getters and setters?  Select 2 options.A) 
    Getters and setters increase code reusability.B)  Getters and setters are an integral
    part of Object Oriented ProgramingC)  Getters and setters are control the flow
    of the programD)  Getters and setters maintain encapsulationThe answers are B,
    D.  Getters and setters are instance level methods in a class that are used to
    set and access instance level variables.  This allows the variables themselves
    to have the private modifier.  It is good OO (object oriented) programing practice
    for methods of a class to control the interactions of other objects with that
    class.For example, why should the object Dog be able to directly access and change
    the height attribute of the object Person?  Modifiers on the getter and setter
    methods for height would control what objects can view or change height.[Q40 Unanswered.](#text00044.html_aBRJ)'
