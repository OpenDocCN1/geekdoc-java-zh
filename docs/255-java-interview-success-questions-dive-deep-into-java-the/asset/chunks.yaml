    ;\n        Character dog4 = new Character('Shi Tzu');\n        Test q = new Test();\n\
    \        q.dogs.add(dog1);\n        q.dogs.add(dog2);\n        q.dogs.add(dog3);\n\
    \        q.dogs.add(dog4);\n        for(int i = 0; i<q.dogs.size(); i++){\n  \
    \          System.out.print(q.dogs.get(i) + \",\");\n        }\n    }\n}\n```\n\
    What will the output be from the above program? Select 1 answer.\nA) “German Shephard,Husky,\
    \ Mutt, Shi Tzu”\nB) “German Shephard,Husky, Mutt, Shi Tzu,”\nC) Compile time\
    \ error.\nD) None of the above\n\n### Q13.\n```java\npackage Exam;\n//Line 1\n\
    public class Test {\n    public static void main(String[] args) {\n        out.println(\"\
    Hello World\");\n    }\n}\n```\nWhat can be inserted independently at Line 1 to\
    \ make the following code compile?\nA) `import java.lang.System.out;`\nB) `import\
    \ static java.lang.System.out;`\nC) `import java.lang.System.*;`\nD) `import static\
    \ java.lang.System.*;`\n\n### Q14.\n```java\npackage Exam;\npublic class Test{\n\
    \    Object obj = new Object();\n    Integer i = new Integer(45);\n    public\
