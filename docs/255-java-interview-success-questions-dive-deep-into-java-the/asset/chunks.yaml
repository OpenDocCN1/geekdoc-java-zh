    \       System.out.print(l);\n        }\n    }\n}\n```\nWhat does the code print?\
    \ Select one option.\nA) Compile time error\nB) Runtime error\nC) “Will this work?”\n\
    \n### Q11.\n```java\npackage Exam;\npublic class GC {\n    int g = 10;\n    short\
    \ c = 20;\n    public static void main(String[] args) {\n        GC gc = new GC();\n\
    \        //Line 1\n        gc.g = 12;\n        gc.c = 18;\n        //Line 2\n\
    \        gc.go();\n        //Line 3\n        System.gc();\n        //Line 4\n\
    \        System.out.println(gc.g);\n        //Line 5\n    }\n    public void go(){\n\
    \        System.out.println(\"go\");\n    }\n}\n```\nAfter which line is object\
    \ `gc` eligible for garbage collection? Select 1 option.\nA) Line 1\nB) Line 2\n\
    C) Line 3\nD) Line 4\nE) Line 5\n\n### Q12.\n```java\npackage Exam;\nimport java.util.ArrayList;\n\
    import java.util.List;\npublic class Test {\n    List<String> dogs = new ArrayList<String>();\n\
    \    public static void main(String[] args) {\n        String dog1 = \"German\
