    \ void printAnother() {\n        System.out.println(\"Another Default Method Executed\"\
    );\n    }\n}\npublic class Test implements TestInterface {\n    public void add(int\
    \ x) {\n        System.out.println(x+x);\n    }\n    public static void main(String\
    \ args[]) {\n        Test writer = new Test();\n        writer.add(4);\n     \
    \   writer.print();\n    }\n}\n```\nTrue or False: This code compiles\nA) True\n\
    B) False\n[Q43 Answered.](#text00307.html_aC26)\n\n### Q44\nTrue or False: Static\
    \ methods on an interface can be overridden\nA) True\nB) False\n[Q44 Answered.](#text00308.html_aBXG)\n\
    \n### Q45\n```java\npackage Exam;\ninterface LambdaInterface {\n    public void\
    \ printer(String x);\n    default void printAnother() {\n        System.out.println(\"\
    Another Print!\");\n    }\n}\npublic class Test {\n    public static void main(String\
    \ args[]) {\n        LambdaInterface inter = (String x) -> System.out.println(x);\n\
    \        inter.printer(\"Print Me!\");\n    }\n}\n```\nWhat does the following\
    \ code print? Select one of the following.\nA) “Print Me!”\nB) “Another Print!”\n\
    C) Does not compile\n[Q45 Answered.](#text00309.html_aBVP)\n\n### Q46\n```java\n\
    package Exam;\ninterface LambdaInterface {\n    public void printer(String x);\n\
    \    public void anotherPrinter();\n    default void printAnother() {\n      \
    \  System.out.println(\"Another Print!\");\n    }\n}\npublic class Test {\n  \
    \  public static void main(String args[]) {\n        LambdaInterface inter = (String\
    \ x) -> System.out.println(x);\n        LambdaInterface anotherInter = () -> System.out.println(\"\
    Print This!\");\n        inter.printer(\"Print Me!\");\n    }\n}\n```\nWhat does\
    \ the following code print? Select one of the following.\nA) “Print Me!”\nB) “Print\
    \ This!”\nC) “Another Print!”\nD) Does not compile\n[Q46 Answered.](#text00310.html_aC3C)\n\
    \n### Q47\n```java\npackage Exam;\nimport java.clock.LocalDate;\npublic class\
    \ HelloWorld {\n    public static void main(String []args){\n        LocalDate\
    \ local = LocalDate.new();\n        System.out.println(local);\n    }\n}\n```\n\
    What does the following code print? Select one of the following.\nA) The current\
    \ time\nB) The current date\nC) The current time and date\nD) Does not compile\n\
    [Q47 Answered.](#text00311.html_aBZN)\n\n### Q48\nWhich of the following is not\
    \ a valid `java.time.LocalDate` method?\nA) atTIme\nB) equals\nC) getDayOfYear\n\
    D) getWeekDay\nE) isLeapYear\n[Q48 Answered.](#text00312.html_aC20)\n\n### Q49\n\
    What is the default value for the `Boolean` object?\nA) true\nB) false\nC) undefined\n\
    D) null\n[Q49 Answered.](#text00313.html_aBPT)\n\n### Q50\nWhat is the size in\
    \ bytes of the `int` primitive?\nA) 1 byte\nB) 2 bytes\nC) 4 bytes\nD) 8 bytes\n\
    [Q50 Answered.](#text00314.html_aC3Y)\n\n### Q51\nWhich syntax creates an optional,\
    \ compile-time-only dependency?\nA) requires devDependency com.module\nB) requires\
    \ static com.module\nC) import optional com.module\n[Q51 Answered.](#text00315.html_aC4P)\n\
    \n### Q52\n```java\npackage Exam;\npublic class Test{\n    public static void\
    \ main(String[] args) {\n        Test q = new Test();\n        StringBuilder sb\
    \ = new StringBuilder(\"This\");\n        q.changeThis(sb);\n        System.out.println(sb);\n\
    \    }\n    public void changeThis(StringBuilder str){\n        System.out.print(str\
    \ + \" \");              //Line 1\n        str = new StringBuilder(\"That\");\
    \           //Line 2\n    }\n}\n```\nWhat does the following code print? Select\
    \ one of the following.\nA) “This That”\nB) “That That”\nC) “This This”\nD) Does\
    \ not compile\n[Q52 Answered.](#text00316.html_aBXF)\n\n### Q53\nThe following\
    \ code snippet is valid. `static int i1, i2[], i3;`\nSelect 1 option.\nA) True\n\
    B) False\n[Q53 Answered.](#text00317.html_aBN3)\n"
