    \ = \"Hello\";\n        q.obj = i;\n        System.out.println(q.obj);\n    }\n\
    }\n```\nWhat will the program print? Select 1 option.\nA) “45”\nB) Does not compile.\n\
    C) “Hello”\nD) Runtime Error\n\n### Q15.\n```java\npackage Exam;\npublic class\
    \ FooYou implements Fool {\n    static int r = 12;\n    public static void main(String[]\
    \ args) {\n        FooYou fy = new FooYou;\n        fy.methodGo(Fool.r);\n   \
