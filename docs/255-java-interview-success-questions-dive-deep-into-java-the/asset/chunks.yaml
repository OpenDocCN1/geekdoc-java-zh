    and fy is instantiated as FooledYou object, so its value is 12. [Q15 Unanswered.](#text00019.html_aBS2)Q16
    Answered.What will force a consuming module to import dependencies of a consumed
    module?A)  requires transitive  com.moduleB)  requires dependeny com.moduleC) 
    import transitive com.moduleD)  import dependency com.moduleThe answer is A. 
    Each module dependency should have the keyword transitive in front of it to avoid
    needing a require statement.[Q16 Unanswered.](#text00020.html_aBX8)Q17 Answered.Which
    of the following is not a valid class modifier?  Select 1 option.A)  publicB)  privateC)  protectedD)  package
    privateE)  package protectedThe answer is E.  However, D is not the actual text
    that would be used to designate package private.  Instead, no keyword is used. 
    This is called the default modifier.[Q17 Unanswered.](#text00021.html_aBYH)Q18
    Answered.package Exam;public class Test {​ String st;​ int x = 10;​ public static
    void main(String[] args) {​ Test q = new Test();​ System.out.println("Howdy");​
    if(q.x >5 | q.st.length() == 0){​ System.out.println("Hello");​ }​ }}What does
    the code print?  Select one option.A)  Does not compile.B)  “Howdy”  followed
    by “Hello”C)  “Howdy”D)  Runtime Exception causes program to fail immediately.E) 
    Prints "Howdy" and then a Runtime Exception causes program failure.The answer
    is E.  The | operator evaluates both q.x > 5 and q.st.length() == 0 even though
    q.x > 5 is true.  The || evaluates the right hand argument only if the left hand
    argument returns false.[Q18 Unanswered.](#text00022.html_aBWY)Q19 Answered.package
    Exam;public class Test {​ public static void main(String[] args) {​ int i = 12;​
    long L = 12;​ float f = 12.0f;​ double d = 12.2;​ System.out.print(i == f);​ System.out.print(i
    == d);​ System.out.print(i.equals(f));​ }}What will the following program print? 
    Select 1 answer.A)  Does not compile.B)  “false false false”C)  “true true true”D) 
    “true false true”E)  “true false false”The answer is A.  .equals() is not a valid
    method for primitives.  Line 1 would print true and line 2 would print false if
    line three were removed.[Q19 Unanswered.](#text00023.html_aBN7)Q20 Answered.package
    Exam;public class Go {​ public static void main(String[] args) {​ TestSub ts =
    new TestSub();​ ts.runThis();​ }}class Test{​ static{System.out.println("Super
    static");}  //Line 1​ {System.out.println("Super non-static");}  //Line 2​ public
    void runThis(){​ System.out.println("Super runThis");  //Line 3​ }}class TestSub
    extends Test{​ static{System.out.println("Sub static");}  //Line 4​ public void
    runThis(){​ System.out.println("Sub runThis");  //Line 5​ }​ {System.out.println("Sub
    non-static");}  //Line 6}What is the following order of output?  Select 1 answer.A) 
    1, 2, 4, 5, 6B)  4, 5, 6C)  4, 6, 5D)  1, 6, 4, 2, 5E)  1, 4, 2, 6, 5The answer
    is E.  The rule for order of operations is:1) Super class static blocks2) Sub
    class static blocks3) Super class non-static blocks4) Constructor of the super
    class5) Sub class non-static blocks6) Constructor of the sub class[Q20 Unanswered.](#text00024.html_aC10)Q21
    Answered.package Exam;public class Test {​ public static void main(String[] args)
    {​ Test q = new Test();​ q.subMethod();​ }​ public void subMethod(){​ try{​ subMethod2();​
    }catch(Exception e){​ System.out.println("The Exception was caught here");​ }​
    }​ public void subMethod2(){​ throw new ArrayIndexOutOfBoundsException();​ }}What
    is the output of the code?  Select 1 answer.A)  Compile time errorB) “Exception
    in thread "main" java.lang.ArrayIndexOutOfBoundsException”C) “The  Exception was
    caught here”The answer is C.  The exception is thrown up the chain of method calls
    until either it is written to the console in the main method or it is handled
    in a try-catch block.[Q21 Unanswered.](#text00025.html_aC3E)Q22 Answered.package
    Exam;import java.util.ArrayList;import java.util.List;public class Test {​ public
    static void main(String[] args) {​ List l = new ArrayList();​ l.ensureCapacity(20);​
    System.out.print(l.size());​ for(int i = 0; i<10; i++){​ l.add(i);​ }​ l.trimToSize();​
    System.out.print(“  “ + l.size());​ }}What is the output of the code?  Select
    1 answer.A)  Compile time errorB) “20  10”C) “20 20”D)  “0  10”The answer is A. 
    The List interface does not have the method trimToSize().  That is a method that
    belongs to ArrayList.  When l was declared as type List, it was limited to the
    methods of the List interface.  This is called “programing to the API”.[Q22 Unanswered.](#text00026.html_aBRC)Q23
    Answered.package Exam;public class Test {​ public static void main(String[] args)
    {​ double d1 = 12.4;​ double d2 = 12.40;​ System.out.print(" " + Double.compare(d1,
    d2));​ }}What is the output of the code?  Select 1 answer.A)  Compile time errorB)
    “0”C) “0”The answer is C.  The import statement is correct, and Double.compare
    is also fine.[Q23 Unanswered.](#text00027.html_aBU4)Q24 Answered.Which of the
    following are acceptable declarations?  Select two answers.A)  String String;B)
    String 123;C) String volatile;D)  String $$$MONEYE)  String $$$money!!!The answer
    is A, D.  A variable cannot start with a number, volatile is a reserved word,
