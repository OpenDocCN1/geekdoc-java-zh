    void main(String[] args) {​ ArrayList arr = new ArrayList();​ int counter = 0;​
    for(int i = 4; i > 0; i-=2){​ for(int x = 0; x < i; ++x){​ ++counter;​ }​ }​ System.out.println(counter);​
    }}What does the code print?A)  2B)  4C)  6D)  8E)  10[Q48 Unanswered.](#text00261.html_aBUT)Q49
    Answered.package Exam;public class Test extends AnotherAbstract {​ public static
    void main(String[] args) {}​ public void methodHide(){​     System.out.println("method
    hidden");​ };}abstract class AnotherAbstract extends TestAbstract {public void
    methodRun(){System.out.println("method ran");}}abstract class TestAbstract {abstract
    void methodRun();abstract void methodHide();}True or False?  The code compiles.A)  TrueB)  FalseThe
    answer is A.  Abstract class AnotherAbstract correctly extends TestAbstract and
    is itself extended properly.[Q49 Unanswered.](#text00262.html_aBYR)Q50 Answered.package
    Exam;public class CaseTest{private String justInCase(String str){String returner
    = "";switch(str) {case "a":returner += "a";case "b":returner += "b";default:returner
    += "done";}return returner;}public static void main(String []args){CaseTest ct
    = new CaseTest();System.out.println(ct.justInCase("a"));}}What does the code return?A)  “a”B)  “b”C)  “done”D)  “abdone”The
    answer is D.  += is a way to concat and return a new string to the variable returner. 
