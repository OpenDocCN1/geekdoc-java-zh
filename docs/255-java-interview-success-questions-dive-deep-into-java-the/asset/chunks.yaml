- fmt: "\n# 255 Java Interview Success Questions\n\nDive Deep Into Java Theory, Syntax,\
    \ and APIs, and Interview with Confidence.\nText copyright © 2020 Jonathan Middaugh\
    \ all rights reserved.\n\n## Introduction\n\"255 Java Interview Success Questions\"\
    \ contains 255 rigorous questions and answers formulated to prepare you to interview\
    \ for a Java position. The questions are randomly assorted.\n\nThis book covers\
    \ nine primary topics:\n* Java Basics\n* Working with Java Data Types\n* Using\
    \ Operators and Decision Constructs\n* Creating and Using Arrays\n* Using Loop\
    \ Constructs\n* Working with Methods and Encapsulation\n* Working with Inheritance\n\
    * Handling Exceptions\n* Working with Selected Classes from the Java API\n\nProficiency\
    \ in these areas is highly recommended for anyone looking for or who has just\
    \ started an application development job. Please scroll up and sample the book,\
    \ or just take the leap and purchase this budget friendly tool!\n\n## About the\
    \ Author\nI earned my Masters of Science in Information Systems in 2012 and have\
    \ been a software engineer at Fortune 500 companies since then. I wrote the original\
    \ version of this book as I practiced for the Oracle Certified Associate exam,\
    \ and I hope that others can find it useful as well.\n\nI also blog about developer\
    \ careers, side hustles, and code at `https://smartdevpreneur.com/`.\n\n## Table\
    \ of Contents\n* [Test 1 Questions]\n* [Test 2 Questions]\n* [Test 3 Questions]\n\
    * [Test 4 Questions]\n* [Test 5 Questions]\n* [Test 1 Answers]\n* [Test 2 Answers]\n\
    * [Test 3 Answers]\n* [Test 4 Answers]\n* [Test 5 Answers]\n\n## Test 1 Questions\n\
    \n### Q1.\n```java\npackage Exam;\npublic class Test extends TestAbstract {\n\
    \    public static void main(String[] args) {}\n    public void methodRun(){}\n\
    \    public void methodHide(){}\n}\nabstract class TestAbstract {\n    abstract\
    \ void methodRun();\n    abstract void methodHide();\n}\n```\nTrue or False: `Test`\
    \ class needs an abstract modifier in order to compile.\nA) True\nB) False\n\n\
    ### Q2.\n```java\npackage Exam;\npublic class ArrayCopy {\n    public static void\
    \ main(String[] args) {\n        char[] copyFrom = {'c', 'r', 'u', 'n', 'c', 'h',\
    \ 'y', ' ', 'c', 'o', 'o', 'k', 'i', 'e' };\n        char[] copyTo = new char[7];\n\
    \        System.arraycopy(copyFrom, 2, copyTo, 0, 7);\n        System.out.println(copyTo);\n\
    \    }\n}\n```\nWhat will the code print? Select 1 option.\nA) “runchy”\nB) “runchy\
    \ c”\nC) “unchy c”\nD) “unchy co”\nE) “crunchy”\n\n### Q3.\n```java\npackage Exam;\n\
    public class q1 {\n    public static void main(String[] args) {\n        int[][]\
    \ a = new int[5][];\n        //Line 1\n    }\n}\n```\nWhich of the following could\
    \ be placed at line 1 and the code would still compile? Select 1 answer.\nA) `a[1]\
    \ = new short[5];`\nB) `a[1] = new int[5];`\nC) `a[1] = new Integer[5];`\nD) `a[1]\
    \ = new double[5];`\nE) `a[1] = new int[];`\n\n### Q4.\n```java\npackage Exam;\n\
    public class TC {\n    static int i2[] = new int[1];\n    public static void main(String[]\
    \ args) {\n        i2[1] = 0;\n        System.out.println(i2[].getClass());\n\
    \    }\n}\n```\nWhat will be the output? Select 1 option.\nA) “class java.lang.int”\n\
    B) Does not compile\nC) Runtime exception\n\n### Q5.\n```java\n//The following\
    \ code is in file Go.java\npackage Exam;\npublic class Go {\n    public static\
    \ void main(String[] args) {\n        Test t1 = new TestSub();\n        t1.methodGo();\n\
    \    }\n}\npublic class Test{\n    public void methodGo(){\n        System.out.println(\"\
    In Super\");\n    }\n}\npublic class TestSub extends Test{\n    public void methodGo(){\n\
    \        System.out.println(\"In Sub\");\n    }\n}\n```\nWhat will this code print?\
    \ Select 1 option.\nA) Does not compile.\nB) “In Super”\nC) “In Sub”\nD) Runtime\
    \ Exception\n\n### Q6.\n```java\npackage Exam;\npublic class Construct extends\
    \ SuperConstruct {\n    Construct(int i) {\n        super(i);\n    }\n    Construct(String\
    \ i) {\n        super(i);\n    }\n    Construct() {\n        super();\n    }\n\
    \    public static void main(String[] args) {\n        Construct c = new Construct();\n\
    \    }\n}\nclass SuperConstruct{\n    SuperConstruct(int i){\n        System.out.println(\"\
    Constructed with integer\");\n    }\n    SuperConstruct(String str){\n       \
    \ System.out.println(\"Constructed with string\");\n    }\n}\n```\nWhat will the\
    \ following code print? Select 1 option.\nA) “Constructed with integer”\nB) “Constructed\
    \ with string”\nC) It will print nothing.\nD) It will not compile.\nE) It will\
    \ throw a runtime exception.\n\n### Q7.\nWhen constructing a service, what file\
    \ do we add `provides` syntax?\nA) `service.java`\nB) `module.java`\nC) `module-info.java`\n\
    D) `main.java`\n\n### Q8.\n```java\npackage Exam;\npublic class Test {\n    public\
    \ static void main(String[] args) {\n        Integer i = new Integer(12);\n  \
    \      Long l = new Long(12);\n        Double d = new Double(12);\n        System.out.println(i.equals(l));\n\
    \        System.out.println(l.equals(d));\n    }\n}\n```\nWhat is the output from\
    \ program above? Select 1 option.\nA) “true” followed by “true”\nB) “false” followed\
    \ by “true”\nC) “false” followed by “false”\nD) “true” followed by “false”\nE)\
    \ Does not compile.\n\n### Q9.\n```java\npackage Exam;\npublic class Test {\n\
    \    public static void main(String[] args) {\n        System.out.println(\"Beginning\"\
    );\n        Test q = new Test();\n        q.throwException();\n        System.out.println(\"\
    Past finally\");\n    }\n    public void throwException(){\n        try{\n   \
    \         int[] arr = new int[5];\n            int i = arr[5];\n        }finally{\n\
    \            System.out.println(\"In finally block\");\n        }\n    }\n}\n\
    ```\nWhat is the last text printed by the code? Select one option.\nA) Does not\
    \ compile.\nB) “Beginning”\nC) “In finally block”\nD) “Past finally block”\nE)\
    \ Nothing is printed because of the runtime exception.\n\n### Q10.\n```java\n\
    package Exam;\npublic class Test {\n    public static void main(String[] args)\
    \ {\n        Test q = new Test();\n        q.go(1, \"Will\", \" work?\");\n  \
