  trans: "\n\n# 255 道 Java 面试成功题\n\n深入学习 Java 理论、语法和 API，自信应对面试。\n文本版权 © 2020 Jonathan\
    \ Middaugh 版权所有。\n\n## 引言\n“255 道 Java 面试成功题”包含了 255 道严谨的题目，旨在帮助你准备 Java 职位的面试。题目是随机混合的。\n\
    \n本书涵盖了九个主要主题：\n* Java 基础\n* 处理 Java 数据类型\n* 使用运算符和决策结构\n* 创建和使用数组\n* 使用循环结构\n\
