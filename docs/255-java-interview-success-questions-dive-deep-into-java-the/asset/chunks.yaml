    \        q.dogs.add(dog3);\n        for(int i = 0; i<dogs.size(); i++){\n    \
    \        System.out.print(q.dogs.get(i) + \",\");\n        }\n    }\n}\n```\n\
    上述程序的输出是什么？选择 1 个答案。\nA) \"German Sheard,Husky,Mutt,\"\nB) \"German Sheard,Husky,Mutt\"\
    \nC) 编译时错误。\nD) 以上都不是\n\n### Q10\n```java\npackage Exam;\npublic class Test {\n\
    \    public static void main(String[] args) {\n        Integer i = new Integer(1);\
    \ // Line 1\n        Number n = i; // Line 2\n        System.out.println(n.intValue());\
    \ // Line 3\n        i = n; // Line 4\n        System.out.println(i.intValue());\
    \ // Line 5\n    }\n}\n```\n为了使此代码通过编译可以修改什么？选择一个选项。\nA) 将第 4 行改为 `i = (Integer)\
    \ n;`\nB) 将第 2 行改为 `n = (Number) i;`\nC) 将第 3 和 5 行调用的方法改为 `doubleValue()`\nD)\
    \ 将第 5 行改为 `System.out.println(i.parseInt(\"1\"));`\nE) 不需要修改。\n\n### Q11\n```java\n\
    package Exam;\npublic class Test {\n    int i = 0;\n    public static void main(String[]\
    \ args) {\n        // Line 1\n        for(i = 0; i<10; i++){\n            System.out.println(\"\
    Hello World\");\n        }\n    }\n}\n```\n上述代码可以修改？选择 2 个选项。\nA) 无需修改\nB) 在第\
    \ 1 行插入以下代码：`Test q = new Test();` 然后将 `i` 改为 `q.i`\nC) 在 for 语句中将 `i` 声明为 `int`\
    \ 类型\nD) 无需修改运行\nE) 将 `i = 0;` 替换为 `i;`\n\n### Q12\n```java\npackage Exam;\npublic\
    \ class B extends A {\n    public static void main(String[] args) {\n        A\
    \ q = new B();\n        q.methodA1();\n        q.methodA2();\n    }\n    static\
    \ void methodA1(){\n        System.out.print(\"Static B1,\");\n    }\n    void\
    \ methodA2(){\n        System.out.print(\" B2\");\n    }\n}\nclass A{\n    static\
    \ void methodA1(){\n        System.out.print(\"Static A1,\");\n    }\n    void\
    \ methodA2(){\n        System.out.print(\" A2\");\n    }\n}\n```\n代码打印了什么？选择一个选项。\n\
    A) \"Static A1, A2\"\nB) \"Static A1, B2\"\nC) \"Static B1, A2\"\nD) \"Static\
    \ B1, B2\"\n\n### Q13\n```java\npackage Exam;\npublic class TestSub extends Test\
    \ {\n    public static void main(String[] args) {\n        Test q = new TestSub();\n\
    \        q.out();\n    }\n    public void out(){\n        System.out.println(\"\
    Sub out\");\n    }\n}\nclass Test {\n    protected void out(){\n        System.out.println(\"\
    Super out\");\n    }\n}\n```\n代码将打印什么？选择 1 个选项。\nA) 无法编译。\nB) \"Sub out\"\nC)\
    \ \"Super out\"\nD) 什么都不打印。\n\n### Q14\n是或否：`!` 运算符返回布尔值。选择一个选项。\nA) 是\nB) 否\n\
    \n### Q15\n```java\npackage Exam;\npublic class Test {\n    public static void\
    \ main(String[] args) {\n        double r = Math.random() * 10; // Line 1\n  \
    \      Integer x = new Integer((int)r); // Line 2\n        System.out.println(x);\
    \ // Line 3\n    }\n}\n```\n为了使代码通过编译可以在代码中添加什么？选择 1 个选项。\nA) 它已经编译。\nB) 在 `Integer(r)`\
    \ 后添加 `.intValue()`。\nC) 在第 1 行将 `r` 声明为 `int`。\nD) 在第 3 行将 `r` 强制转换为 `int`。\n\
    \n### Q16\n```java\npackage Exam;\npublic class Test {\n    public static void\
    \ main(String[] args) {\n        Test q = new Test();\n        String s = \"hello\
    \ world\";\n        System.out.println(s.equals(\"hello world\"));\n        System.out.println(s.charAt(0)));\n\
    \    }\n}\n```\n代码将打印什么？选择 1 个选项。\nA) \"true\" 后接 \"helloh\"\nB) \"false\" 后接\
    \ \"helloh\"\nC) 编译错误\nD) \"true\" 抛出了运行时异常\n\n### Q17\n```java\npackage Exam;\n\
    public class Test {\n    public static void main(String[] args) {\n        int[][]\
    \ myInt[] = {{{1,2},{3,4}},{{1,2},{3,4,5},{6}},{{7}}};\n        System.out.println(myInt[0][1]);\n\
    \        System.out.println(myInt[1][1]);\n        System.out.println(myInt[2][0]);\n\
    \    }\n}\n```\n代码的输出是什么？选择一个答案。\nA) \"5\" 后接 ArrayIndexException\nB) \"2\" 后接\
    \ \"7\" 后接 \"1\"\nC) \"2\" 后接 \"1\" 后接 \"6\"\nD) 无法编译\nE) \"3\" 后接 \"5\" 后接 \"\
    7\"\n\n### Q18\n以下哪个正确描述了方法签名？选择 1 个选项。\nA) 方法的访问修饰符、返回类型和参数。\nB) 方法的返回类型和参数。\n\
    C) 方法的名字和参数。\nD) 方法的名字。\n\n### Q19\n```java\npackage Exam;\npublic class TestSub\
    \ extends Test {\n    public static void main(String[] args) {\n        Test q\
    \ = new TestSub();\n        q.out();\n    }\n    public void out(){\n        System.out.println(\"\
    Sub out\");\n    }\n}\nclass Test {\n    private void out(){\n        System.out.println(\"\
    Super out\");\n    }\n}\n```\n代码将打印什么？选择 1 个选项。\nA) 无法编译。\nB) \"Sub out\"\nC)\
    \ \"Super out\"\nD) 什么都不打印。\n\n### Q20\n```java\npackage Exam\npublic class Test\
    \ {\n    String str1 = \"Hello World!\";\n    String str2;\n    public static\
    \ void main(String[] args) {\n        Test q = new Test();\n        if (q.str1.equals(\"\
    Hello World!\") | q.str2.equals(\"\")) {\n            System.out.println(q.str1);\n\
    \        }else System.out.println(q.str2.concat(\"Hello\"));\n    }\n}\n```\n\
    代码打印了什么？选择一个答案。\nA) \"Hello World!\"\nB) 编译错误\nC) 代码打印空行\nD) \"Hello\"\nE) 运行时异常\n\
    \n### Q21\n```java\npackage Exam;\npublic class Test {\n    public static void\
    \ main(String[] args) {\n        int i = 0; // Line 1\n        for(i = 0; i<10;\
    \ i++){\n            System.out.println(\"Hello World\");\n        }\n    }\n\
    }\n```\n为了使代码通过编译可以进行哪些修改？选择 2 个选项。\nA) 无需修改编译\nB) 在第 1 行插入以下代码：`Test q = new\
    \ Test();` 然后将 `i` 改为 `q.i`\nC) 在 for 语句中将 `i` 声明为 `int` 类型\nD) 无需修改运行\nE) 将 `i\
    \ = 0;` 替换为 `i;`\n\n"
- fmt: "\n# Q41\nWhat is an interface with a single abstract method called?\nA) It\
    \ doesn’t have a name\nB) Method Interface\nC) Functional Interface\nD) Abstract\
    \ Interface\n\nThe answer is **C**. If there is exactly one abstract method, and\
    \ zero, one, or many default methods, the interface is a functional interface.\n\
    \n# Q42\n```java\npackage Exam;\n@FunctionalInterface\ninterface Cube {\n    int\
    \ calculateVolume(int x);\n    int countSides(int y);\n}\n```\nTrue or False:\
    \ This code compiles\nA) True\nB) False\n\nThe answer is **B**. Because there\
    \ is more than one abstract class, the compiler throws an “Unexpected @FunctionalInterface\
    \ annotation” message.\n\n# Q43\n```java\npackage Exam;\ninterface TestInterface\
    \ {\n    public void add(int x);\n    default void print() {\n        System.out.println(\"\
    Default Method Executed\");\n    }\n    default void printAnother() {\n      \
    \  System.out.println(\"Another Default Method Executed\");\n    }\n}\npublic\
    \ class Test implements TestInterface {\n    public void add(int x) {\n      \
    \  System.out.println(x+x);\n    }\n    public static void main(String args[])\
    \ {\n        Test writer = new Test();\n        writer.add(4);\n        writer.print();\n\
    \    }\n}\n```\nTrue or False: This code compiles\nA) True\nB) False\n\nThe answer\
    \ is **A**. The class does not call `printAnother`, but that is acceptable. Implementing\
    \ classes are not required to call all default methods.\n\n# Q44\nTrue or False:\
    \ Static methods on an interface can be overridden\nA) True\nB) False\n\nThe answer\
    \ is **B**. If an interface with a static method is implemented by a class, and\
    \ the class then implements a method with an identical method signature as the\
    \ static method on the interface, the interface’s static method will still exist\
    \ on the interface and the class’s static method will exist on the class.\n\n\
    # Q45\n```java\npackage Exam;\ninterface LambdaInterface {\n    public void printer(String\
    \ x);\n    default void printAnother() {\n        System.out.println(\"Another\
    \ Print!\");\n    }\n}\npublic class Test {\n    public static void main(String\
    \ args[]) {\n        LambdaInterface inter = (String x) -> System.out.println(x);\n\
    \        inter.printer(\"Print Me!\");\n    }\n}\n```\nWhat does the following\
    \ code print? Select one of the following.\nA) “Print Me!”\nB) “Another Print!”\n\
    C) Does not compile\n\nThe answer is **A**. This is a straightforward example\
    \ of a lambda function implementing an abstract method on an interface.\n\n# Q46\n\
    ```java\npackage Exam;\ninterface LambdaInterface {\n    public void printer(String\
    \ x);\n    public void anotherPrinter();\n    default void printAnother() {\n\
    \        System.out.println(\"Another Print!\");\n    }\n}\npublic class Test\
    \ {\n    public static void main(String args[]) {\n        LambdaInterface inter\
    \ = (String x) -> System.out.println(x);\n        LambdaInterface anotherInter\
    \ = () -> System.out.println(\"Print This!\");\n        inter.printer(\"Print\
    \ Me!\");\n    }\n}\n```\nWhat does the following code print? Select one of the\
    \ following.\nA) “Print Me!”\nB) “Print This!”\nC) “Another Print!”\nD) Does not\
    \ compile\n\nThe answer is **D**. The compiler does not know which abstract function\
    \ is supposed to receive the lambda function implementation. This is also why\
    \ an interface with two abstract functions is not a functional interface.\n\n\
    # Q47\n```java\npackage Exam;\nimport java.clock.LocalDate;\npublic class HelloWorld{\n\
    \    public static void main(String []args){\n        LocalDate local = LocalDate.new();\n\
    \        System.out.println(local);\n    }\n}\n```\nWhat does the following code\
    \ print? Select one of the following.\nA) The current time\nB) The current date\n\
    C) The current time and date\nD) Does not compile\n\nThe answer is **D**. `LocalDate`\
    \ is part of the `java.time` package, so the import should have been `java.time.LocalDate`.\n\
    \n# Q48\nWhich of the following is not a valid `java.time.LocalDate` method?\n\
    A) atTime\nB) equals\nC) getDayOfYear\nD) getWeekDay\nE) isLeapYear\n\nThe answer\
    \ is **D**. There is no method `getWeekDay`, there is however a method named `getDayOfWeek`.\
    \ `atTime` combines a date with a time to create a `LocalDateTime` object. `equals`\
    \ compares two dates for equality. `getDayOfYear` returns a value from 1 to 366\
    \ (due to leap years). `isLeapYear` returns a boolean value of whether a `LocalDate`\
    \ object is a leap year.\n\n# Q49\nWhat is the default value for the `Boolean`\
    \ object?\nA) true\nB) false\nC) undefined\nD) null\n\nThe answer is **D**. The\
    \ `Boolean` object, not to be confused with the `boolean` primitive, has a default\
    \ of `null`. The `boolean` primitive has a default of `false`.\n\n# Q50\nWhat\
    \ is the size in bytes of the `int` primitive?\nA) 1 byte\nB) 2 bytes\nC) 4 bytes\n\
    D) 8 bytes\n\nThe answer is **C**. The `int` primitive can hold 4 bytes of data\
    \ which makes it capable of storing a value between -2,147,483,648 and 2,147,483,647.\n\
    \n# Q51\nWhich syntax creates an optional, compile-time-only dependency?\nA) requires\
    \ dev com.module\nB) requires static com.module\nC) import com.module\n\nThe answer\
    \ is **B**.\n\n# Q52\n```java\npackage Exam;\npublic class Test{\n    public static\
    \ void main(String[] args) {\n        Test q = new Test();\n        StringBuilder\
    \ sb = new StringBuilder(\"This\");\n        q.changeThis(sb);\n        System.out.println(sb);\n\
    \    }\n    public void changeThis(StringBuilder str){\n        System.out.print(str\
    \ + \" \"); // Line 1\n        str = new StringBuilder(\"That\"); // Line 2\n\
    \    }\n}\n```\nWhat does the following code print? Select one of the following.\n\
    A) “This That”\nB) “That That”\nC) “This This”\nD) Does not compile\n\nThe answer\
    \ is **C**. Remember that java passes by value. Line 2 points `str` at a new location/object\
    \ in the JVM memory, so the original object that `str` pointed at is not affected\
    \ by the code in line 2.\n\n# Q53\nThe following code snippet is valid.\n`static\
    \ int i1, i2[], i3;`\nSelect 1 option.\nA) True\nB) False\n\nThe answer is **A**.\
    \ The code snippet will compile. However, it is difficult to work with and not\
    \ recommended. The JVM will not compile if the next line of code is: `i2[] = new\
    \ int[10];`. This is recommended: `static int i2[] = new int[10];`.\n"
