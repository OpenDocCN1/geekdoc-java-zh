- fmt: "\n### Q41\nWhat is an interface with a single abstract method called?\nA)\
    \ It doesn’t have a name\nB) Method Interface\nC) Functional Interface\nD) Abstract\
    \ Interface\n[Q41 Answered.](#text00305.html_aBTC)\n\n### Q42\n```java\npackage\
    \ Exam;\n@FunctionalInterface\ninterface Cube {\n    int calculateVolume(int x);\n\
