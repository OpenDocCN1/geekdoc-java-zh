    \  System.out.println(r);\n    }\n}\ninterface Fool{\n    void methodGo(int r);\n\
    \    int r = 10;\n}\n```\nWhat does the code print? Select 1 answer.\nA) “12”\
    \ followed by “12”\nB) “10” followed by “10”\nC) “10” followed by “12”\nD) “12”\
    \ followed by “10”\nE) Does not compile.\n\n### Q16.\nWhat will force a consuming\
    \ module to import dependencies of a consumed module?\nA) `requires transitive\
    \ com.module`\nB) `requires dependency com.module`\nC) `import transitive com.module`\n\
    D) `import dependency com.module`\n\n### Q17.\nWhich of the following is not a\
