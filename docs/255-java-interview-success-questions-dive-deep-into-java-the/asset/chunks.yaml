- fmt: "\n## Q54\n```java\npackage Exam;\npublic class Test {\n    public static void\
    \ main(String[] args) {\n        float f = 5.0;\n        Test q = new Test ();\n\
    \        q.runInt(f);\n    }\n    public void runInt(float f) {\n        Integer\
    \ i = new Integer(new Float(f).intValue());\n        System.out.print(i);\n  \
    \  }\n}\n```\nWhat is the output of the code? Select one option.\nA) \"5\"\nB)\
    \ \"5.0\"\nC) Compile time exception\nD) Runtime exception\n\n## Q55\nWhat command\
    \ line command will show all modules?\nA) `java --show-modules`\nB) `java --list-modules`\n\
    C) `java --module-chart`\nD) `java --modules`\n\n## Test 2 Questions\n\n### Q1\n\
    ```java\npackage Exam;\npublic class Test {\n    public static void main(String[]\
    \ args) {\n        Test q = new Test();\n        String s = \"hello\";\n     \
    \   StringBuilder sb = new StringBuilder(\"world\");\n        System.out.println(q.addString(s));\n\
    \        System.out.println(q.addSB(sb));\n        System.out.println(s);\n  \
    \      System.out.println(sb);\n    }\n    public String addString(String str)\
    \ {\n        str += \" world\";\n        return str;\n    }\n    public StringBuilder\
    \ addSB(StringBuilder strbl) {\n        strbl.insert(0, \"hello \");\n       \
    \ return strbl;\n    }\n}\n```\nWhat will the code print?\nA) \"hello world\"\
    \ four times\nB) \"hello\" followed by \"hello world\" followed by \"hello\" followed\
    \ by \"hello world\"\nC) \"hello\" followed by \"world\" followed by \"hello\"\
    \ followed by \"world\"\nD) \"hello world\" twice followed by \"hello\" followed\
    \ by \"hello world\"\n\n### Q2\n```java\npackage Exam;\npublic class Test {\n\
    \    public static void main(String[] args) {\n        switch(2) {\n         \
    \   case 1: System.out.println(\"1\");\n            case 2: System.out.println(\"\
    2\");\n            case 3: System.out.println(\"3\");\n            default: System.out.println(\"\
    None of the above\");\n        }\n    }\n}\n```\nWhat does the code print? Select\
    \ one option.\nA) Prints \"2\"\nB) Prints \"1\", \"2\", \"3\", \"None of the above\"\
    \nC) Prints \"2\", \"3\"\nD) Prints \"2\", \"3\", \"None of the above\"\nE) Does\
    \ not compile.\n\n### Q3\n```java\npackage Exam;\nimport java.io.BufferedReader;\n\
    import java.io.FileReader;\nimport java.io.IOException;\npublic class Test {\n\
    \    public static void main(String[] args) {\n        try {\n            BufferedReader\
    \ br = new BufferedReader(new FileReader(\"file.txt\"));\n            try {\n\
    \                StringBuilder sb = new StringBuilder();\n                String\
    \ line = br.readLine();\n                while (line != null) {\n            \
    \        sb.append(line);\n                    sb.append('\\n');\n           \
    \         line = br.readLine();\n                }\n                String everything\
    \ = sb.toString();\n            } finally {\n                br.close();\n   \
    \         }\n        } catch (Exception e) {\n            System.out.println(\"\
    Exception caught\");\n        } catch (IOException e) {\n            System.out.println(\"\
    IOException caught\");\n        }\n    }\n}\n```\nIf `file.txt` is null, what\
    \ will the code generate? Select 1 option.\nA) The code will print \"Exception\
    \ caught\"\nB) The code will not compile even if `file.txt` is not null.\nC) The\
    \ code will print \"IOException caught\"\nD) The code will throw an exception\
    \ that is not caught, causing the program to end.\n\n### Q4\n```java\npackage\
    \ Exam;\npublic class Test {\n    public static void main(String[] args) {\n \
    \       Test q = new Test();\n        q.methodRun();\n        System.out.println(\"\
    Complete\");\n    }\n    public void methodRun();\n    public void methodHide(){\
    \ }\n}\nabstract class TestAbstract {\n    abstract void methodRun();\n    abstract\
    \ void methodHide();\n    abstract void methodSeek();\n}\n```\nWhat is the output\
    \ from this program? Select one option.\nA) \"Complete\"\nB) Does not compile\n\
    C) Run error\n\n### Q5\n```java\npackage Exam\n\npublic class Test {\n    public\
    \ static void main(String[] args) {\n        int[][] myInt = {{2, 3, 1}, {4, 5,\
    \ 6}, {7, 8, 9}};\n        System.out.println(myInt[1][1]);\n        System.out.println(myInt[3][1]);\n\
    \    }\n}\n```\nWhat is the output from the code? Choose one answer.\nA) \"5\"\
    \ followed by ArrayIndexException\nB) \"2\" followed by \"7\"\nC) \"2\" followed\
    \ by \"1\"\nD) \"5\" followed by \"7\"\nE) Does not compile\n\n### Q6\nWhich of\
    \ these are valid `ArrayList` methods? Select 3 options.\nA) `.size()`\nB) `.isEmpty()`\n\
    C) `.length()`\nD) `.contains()`\nE) `.removeElement()`\n\n### Q7\n```java\npackage\
    \ Exam;\nimport java.sql.Array;\nimport java.util.ArrayList;\npublic class Test\
    \ {\n    Short a = new Short((short) 1);\n    Integer b = new Integer(1);\n  \
    \  public static void main(String[] args) {\n        Test t = new Test();\n  \
    \      if (t.b instanceof Short){\n            System.out.println(\"Test\");\n\
    \        else System.out.println(\"Failed\");\n    }\n}\n```\nWhat will the code\
    \ print? Select 1 option.\nA) \"Test\"\nB) \"Failed\"\nC) Will not compile.\n\
    D) Runtime Exception\nE) Prints nothing.\n\n### Q8\n```java\npackage Exam;\npublic\
    \ class Test {\n    int i = 0;\n    public static void main(String[] args) {\n\
    \        System.out.println(\"Hello World\");\n    }\n}\n```\nTrue or False: `i`\
    \ is a class variable\nA) True\nB) False\n\n### Q9\n```java\npackage Exam;\nimport\
    \ java.util.ArrayList;\nimport java.util.List;\npublic class Test {\n    List<String>\
    \ dogs = new ArrayList<String>();\n    public static void main(String[] args)\
    \ {\n        String dog1 = \"German Sheard\";\n        String dog2 = \"Husky\"\
    ;\n        String dog3 = \"Mutt\";\n        Character dog4 = new Character('s');\n\
    \        Test q = new Test();\n        q.dogs.add(dog1);\n        q.dogs.add(dog2);\n\
    \        q.dogs.add(dog3);\n        for(int i = 0; i<dogs.size(); i++){\n    \
    \        System.out.print(q.dogs.get(i) + \",\");\n        }\n    }\n}\n```\n\
    What will the output be from the above program? Select 1 answer.\nA) \"German\
    \ Sheard,Husky, Mutt,\"\nB) \"German Sheard,Husky, Mutt\"\nC) Compile time error.\n\
    D) None of the above\n\n### Q10\n```java\npackage Exam;\npublic class Test {\n\
    \    public static void main(String[] args) {\n        Integer i = new Integer(1);\
    \ // Line 1\n        Number n = i; // Line 2\n        System.out.println(n.intValue());\
    \ // Line 3\n        i = n; // Line 4\n        System.out.println(i.intValue());\
    \ // Line 5\n    }\n}\n```\nWhat can be changed to make this code compile? Select\
    \ one option.\nA) Change line 4 to `i = (Integer) n;`\nB) Change line 2 to `n\
