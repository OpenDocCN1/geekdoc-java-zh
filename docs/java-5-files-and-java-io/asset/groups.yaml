    ## ENCODING OF CHARACTERS


    Above I have shown how to represent integers on a computer that works binary –
    that all data are represented as sequences of 0 and 1 bits. I have demonstrated
    how the computer works by the use of complement arithmetic perform the four arithmetic
    operations. A computer works with other data types than integers and such a computer
    must be work with text. In this section I will show how to represent text using
    binary numbers.


    There are several ways, but the principle is, as you for each letter, digit and
    other characters associates a numeric code, and the only thing that is necessary
    is to agree on an encoding table for each character determines which code to be
    used. That is where the differences occurs, as historically are multiple tables.


    ## ASCII


    I''ll start with a table called ASCII (American Standard Code for Information
    Interchange) that may not be used directly with modern computers, but it is an
    important table to know. The table encodes characters as 1 byte numeric codes,
    and the table then has room for 256 characters. The table is usually divided into
    three parts


    - 1. the codes 0–31 that defines various control characters

    - 2. the codes 32–127 that defines standard characters from the english alphabet

    - 3. the codes 128–255 that defines among other country-specific characters


    Note that the two parts partly consists of 128 codes, and thus can be represented
    by 7 bits, and the first ASCII tables (the first standard) covered only the first
    two parts and was thus a 7-bit encoding.

