    Similarly, the RandomAccessFile has a method getChannel(), which returns a FileChannel,
    that is a readwrite buffer. The class FileChannel has many methods, and I will
    mention the most important:


    +   - void force(boolean meta) that updates are physically written to the file.
    The parameter specifies where the file metadata should also be written.

    - long position() that returns the position of the physical pointer.

    - FileChannel.position(long newPosition) that sets the position of the physical
    pointer. With that method you can define where to read or write in the file.

    - int read(ByteBuffer buffer) that reads bytes into file and returns the number
    of bytes as read. The maximum number of bytes is determined by the capacity of
    the buffer.

    - int read(ByteBuffer buffer, long position) which also reads bytes to buffer,
    but position tells where in the file to start (the position of the file pointer).

