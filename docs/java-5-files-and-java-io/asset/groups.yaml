    111111110000111111001001110101\n```\n\nThat is\n\n```\n-32512819 = 1111111000001111110010011101101\n\
    ```\n\nCalculation:\n\n```\n0000000000111000001111111000\n00000000001010110000011101010\n\
    11111110000011111100100111101\n11111110011010110110101100001\n```\n\nThe complement\
    \ of the result:\n\n```\n111111000110101101001001111110\n000000001100100101001001111110\n\
    1\n00000001110010010100100111111\n```\n\nand the result:\n\n```\n000000011100100101001010111111\
    \ = 0000|0001|1100|0101|0001|0110|1111\n= 01C5163F\n= 29693503\n```\n\nThe result\
    \ is as follows, and it is easy to calculate that it is correctly:\n\n```\n-29693503\n\
    ```\n\nThe arithmetic as outlined in this section is called complement arithmetic,\
    \ and as you can see, it is sufficient to construct a processor that can add.\
    \ Then at the same time processor can also subtract. This implements the representation\
    \ of negative numbers by their 2 complement.\n\n### MULTIPLICATION\n\nIf in decimal\
    \ system you multiply a number by 10, you must move the number one position to\
    \ the left and add a 0. The same is valid for binary system: if you have to multiply\
    \ a number by 2, you must move the bits one position to the left and adding 0,\
    \ and such operation is called a left shift. Consider again the number 21:\n\n\
    ```\n0000000010101\n```\n\nIf you look at how to perform multiplication in 10\
    \ system, for example, 432 * 21, this is done by multiplying 432 first with 1\
    \ and then by 2, but such that each time shifts 432 a position left and finally\
    \ adds to it:![](img/5d98ad28901c31fd736abaabe8f09e19_184_0.png)\n\nIn practice,\
    \ it is not so important to be able to multiply binary, but the important thing\
    \ is that the multiplication can be performed only by the two operations, left\
    \ shift and addition and, therefore, can be carried out by a processor which can\
    \ shift and add.\n\n### DIVISION\n\nDivision is performed in the decimal number\
    \ system by subtraction. The division algorithm can also be transferred to the\
    \ binary number system, division can then be performed by the processor, which\
    \ can add.\n\nIt is not so easy to divide manually because you have to keep track\
