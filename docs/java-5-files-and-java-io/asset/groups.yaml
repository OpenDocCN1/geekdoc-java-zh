    # 4 OPERATIONS ON SIMPLE DATA TYPES


    Any data element (simple variable or object) uses space in the machine''s memory,
    when the smallest addressable unit in the machine''s memory is a byte, uses all
    data elements without exception a whole number of bytes. What it depends on the
    element and is determined by the element''s data type. A byte consists of 8 bits
    (that is 8 of the symbols 0 and 1), and you can consider a byte as bit pattern
    consisting of 8 bits. Since a bit can take two values, a byte can then represent
    different values. How these values are interpreted depends entirely on the program
    and the data types, and in many contexts it would be a number, while in other
    contexts would be a code for a character.


    In this chapter I will describe how the simple data types are represented in Java
    by patterns and in this context what operations are available to manipulate the
    individual bits. The chapter assumes knowledge of the binary numbers, and also
    the hexadecimal numbers, and so far you lack the knowing referring to the book
    appendix.


    # 4.1 THE INTEGERS


    Java has already described four types of integers: byte, short, int and long,
    and they differ only with respect to what they fill in memory, which are respectively
    1, 2, 4 or 8 bytes. As an example an int uses 4 bytes, and is in memory allocated
    4 contiguous bytes. This means that an int uses 32 bits and can represent 4294967296
    different integers as there with 32 bits is 4294967296 bit patterns (2³). The
    bits are interpreted as a binary number, and where negative numbers are represented
    by their 2 complement. This corresponds to, an int represents the integers in
    the range [a, b]


    ```

    a = -2147483648 (the binary number 10000000000000000000000000000000)

    b = 2147483647 (the binary number 01111111111111111111111111111111)

    ```


    Any integer type supports the binary operations:


    +   - bitvis or

    - & bitvis and

    - ^ bitvis x

    - 1 complement or just complement

    - << left shift

    - >> arithmetic shift

    - >>> right shift'
