    FFFF, and fills a 20-bit code into 2 halves of 10 bits

    2. split the D800 into the left half (as max is 3FF) that gives a value in the
    range [D800; DBFF]

    3. adds DC00 to the right half (as max is 3FF) that gives a value in the range
    [DC00; DFFF]


    It provides 1024 * 1024 = 1048576 pairs (10 bits provides 1024 different values).


    The standard guarantees that there will never be defined surrogate pairs outside
    these ranges. Note that the two intervals are disjoint, and are the reason for
    the somewhat complex encoding is that it must be simple to decode four bytes unicodes.


    ## UTF-8


    UTF-8 is an encoding that is used on the Internet as it directly is an expansion
    of ASCII coding, as it strives to be sent as many bits as possible. It is a variable-length
    encoding, using from 1 to 6 bytes per character. In practice, however, a maximum
    of 4 bytes, it is sufficient to encode the entire UTF-16 area.


    The table below shows the principles for encoding the UTF-16 area, where a b indicates
    a data bit:


    | Unicode | UTF-8 | Number of characters |

    | :--- | :--- | :--- |

    | 000000 – 0007F | 0bbbbbbbb | 128 |

    | 000080 – 0007FF | 110bbbbbb 10bbbbbb | 1920 |

    | 000800 – 0FFFF | 1110bbbb 10bbbbbb 10bbbbbb | 63488 |

    | 010000 – 1FFFF | 111110bb 10bbbbbb 10bbbbbb 10bbbbbb | 2031616 |


