    \ `Bitmap` 类。你可以通过观察以下几点来稍微改进算法：\n\n- 1. 如果一个数有质因子（能整除该数的质数），那么它或另一个质因子必须小于或等于该数的平方根，因此当起始索引大于数的平方根时，上述迭代可以停止。\n\
