    \ that it must be divided by 38, and the use of a word length of 16 bits. Note\
    \ first that the result is an integer, and a simple calculation says that the\
    \ result should be 356:\n\n| 38 | 13556 | 356 |\n|---|---|---|\n| | 114 | |\n\
    | | 215 | |\n| | 190 | |\n| | 228 | |\n| | 28 | |\n\nThe quotient is 356, and\
    \ you get a remainder of 28, corresponding to the division. If you attempt to\
    \ copy the usual division algorithm for decimal numbers to the binary system,\
    \ the method is simpler, since each iteration results in a 0 or 1 time.\n\n```\n\
    13556 = 1101001110100\n38 = 100110\n```\n\nThe division can now be done binary,\
    \ as shown below. However, it is not quite easy to do manually:\n\n1. if the number\
    \ you divide with is greater than the number above, it goes a 0 time, and the\
    \ upper number goes unchanged on to the next step\n2. otherwise it goes a 1 time,\
    \ and the number you divide by, must then be subtracted from the number above\
    \ – here may be necessary to “borrow”, which you should keep track of\n3. the\
    \ next bit is used (as the right bit)\n4. continuing until there are no more bits\n"
  mdcn: "\n\n## JAVA 5：文件与 JAVA IO\n\n### 32 位加法\n\n作为最后一个示例，我将查看两个数字的加法，但这次字长为 32\
    \ 位，这很好地反映了真实处理器中的情况。我将查看计算过程\n\n2819316 + 32512819\n\n实际上，这与上述相比没有新之处，只是我写更多的位数。\n\
    \n首先进行转换：\n\n```\n2819316 = 2B04F4 = 000000001010110000100111110100\n32512819\
    \ = 1F01B33 = 0000000111110000001101100110011\n```\n\n然后进行计算：\n\n```\n00000011111000000011111111100000\n\
    00000000010101100000100111110100\n0000000111110000001101100110011\n00000010000101101011000000100111\n\
    ```\n\n![](img/5d98ad28901c31fd736abaabe8f09e19_181_0.png)\n\n并对结果转换：\n\n```\n\
    000001000011011000000000111 = 0000|0010|0001|1011|0000|0010|0111\n           \
    \                   = 021B2027\n                              = 35332135\n```\n\
    \n很容易计算出结果是正确的。\n\n### 减法\n\n如果我们有一台可以加法的机器（处理器），你也就拥有一台可以减法的机器。你应该减去数字，只需只需将第二个数字的补码加到第一个数字上，这实际上只是利用了数学中的一条规则：\n\
    \n```\na - b = a + (-b)\n```\n\n如果我们再次得到一个 8 位字，如果你需要计算 83 - 23，那么在计算和 83 + (-23)\
    \ 时会发生以下情况：\n\n```\n83 = 01010011\n23 = 00010111\n```\n\n23 的补码：\n\n```\n00101111\n\
    11101000\n-------\n11101001\n```\n\n```\n-23 = 11101001\n\n10000110\n01010011\n\
    11101001\n00111100\n```\n\n结果是 00111100 = 60。\n\n另一个示例：当字长为 32 位时，计算 2819316 -\
    \ 32512819：\n\n```\n2819316 = 2B04F4 = 0000000010110000001001111011010\n32512819\
    \ = 1F01B33 = 000000011110000001101011000111\n```\n\n### 最终示例\n\n32512819 的补码：\n\
    \n```\n00000001111000000110100111001100\n11111110000011111100100111100\n111111110000111111001001110101\n\
    ```\n\n即：\n\n```\n-32512819 = 1111111000001111110010011101101\n```\n\n计算：\n\n\
    ```\n0000000000111000001111111000\n00000000001010110000011101010\n11111110000011111100100111101\n\
    11111110011010110110101100001\n```\n\n结果的补码：\n\n```\n111111000110101101001001111110\n\
    000000001100100101001001111110\n1\n00000001110010010100100111111\n```\n\n结果为：\n\
    \n```\n000000011100100101001010111111 = 0000|0001|1100|0101|0001|0110|1111\n=\
    \ 01C5163F\n= 29693503\n```\n\n结果如下，并且很容易计算出它是正确的：\n\n```\n-29693503\n```\n\n\
    本节概述的算术称为补码算术，正如你所见的，构建一个可以加法的处理器就足够了。同时，处理器也可以进行减法。这通过其二的补码实现了负数的表示。\n\n### 乘法\n\
    \n在十进制系统中，如果你将一个数乘以 10，你必须将数字向左移动一位并加 0。二进制系统同样如此：如果你需要将一个数乘以 2，只需将数字向左移动一位并加\
    \ 0。再次考虑数字 21：\n\n```\n0000000010101\n```\n\n如果你观察十进制系统中如何进行乘法，例如 432 * 2，这是通过先将\
    \ 432 乘以 1，然后乘以 2 完成的，每次都将 432 向左移动并相加：![](img/5d98ad28901c31fd736abaabe8f09e19_184_0)\n\
    \n在实际上，乘以二进制并不重要，重要的是乘法可以通过两种操作完成：左移和加法，因此可以由可以加法的处理器执行。\n\n### 除法\n\n除法在十系统中是通过减法进行的。除法算法也可以转移到二进制系统中，然后可以由可以加法的处理器执行。\n\
    \n手动进行除法并不容易，因为你需要跟踪是否需要借位，这里有一个例子。假设 13556 必须除以 38，且字长为 16 位。首先注意结果是一个整数，简单的计算得出结果应该是\
    \ 356：\n\n| 38 | 13556 | 356 |\n|---|---|---|\n| | 114 | |\n| | 215 | |\n| | 190\
    \ | |\n| | 228 | |\n| | 28 | |\n\n商为 356，余数为 28，对应除法结果。如果你尝试将普通的十进制除法算法复制到二进制系统，这种方法更简单，因为每次迭代的结果都是\
    \ 0 或 1。\n\n```\n13556 = 1101001110100\n38 = 100110\n```\n\n现在可以以二进制方式进行除法，如下所示。然而手动操作并不容易：\n\
