    \ = to;\n    }\n\n    public Person(int recnr, String navn, String job, String\
    \ tekst, int fra, int til)\n    {\n        this(navn, job, tekst, fra, til);\n\
    \        this.recnr = recnr;\n    }\n}\n```\n\nCompared to the previous version\
    \ of the program I have made a single change, since the class is extended with\
    \ an int variable named recnr. There are also defined both get and set methods\
    \ for variable, and should contain a person's location in the file. Finally is\
