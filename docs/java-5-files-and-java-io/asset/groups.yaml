    # JAVA 5: FILES AND IO


    # JAVA.NIO


    The fundamental concept in the new API''s buffers. A process as JVM IO asking
    the operating system to drain the content of a buffer with a write operation,
    and accordingly, the JVM ask the operating system to fill a buffer with a read
    operation. If the JVM for instance asking the operating system to read from a
    disk file, the operating system will send a command to the disk controller to
    read a block of bytes from the disk and save them in an operating system buffer.
    After this operation is completed, the operating system copies the content of
    the buffer to a second buffer in the address space of the specified process as
    a parameter of the JVM in the read() operation. One of the goals with java nio
    is to increase the efficiency of the necessary copying between buffers, and it
    is not simple, because the disk controller always reads/writes with a fixed size,
    while the JVM uses variable sized blocks and even blocks, which are not necessarily
    contiguous allocated and can be moved by the garbage collector.


    One can think of a channel as a conduit used by the operating system to drain
    or fill a buffer with bytes from a device such as a disk controller. An example
    is a FileChannel, and as its name suggests it acts as a channel between a program
    and a disk file. It supports several things that are not possible with standard
    IO, and here include locking mechanisms and memory mapped files.


    Finally are paths java.nio representation of the file system.


    The following describes the most important classes in the package java.nio, and
    it is primarily using simple test methods in the program NioProgram.


    # 3.1 BUFFERS


    A buffer is an object that can contain a fixed amount of data that can be sent
    to or received from an IO-service, and one can think of it as an object that sits
    between a program and a channel. The buffer has basically four characteristics:


    +   - capacity, that defines how many elements a Buffer can contain

    - limit, that is a 0-based index, that denotes the first element, that can not
    be written or read

    - position, that is a 0-based index, that denotes the position for the next read
    or write

    - mark, that is a 0-based index, that is used to reset the position


    Buffer is an abstract class that provides a number of methods available, but there
    are concrete classes for each of the primitive data types, and basically a buffer
    is an encapsulation of an array.'
