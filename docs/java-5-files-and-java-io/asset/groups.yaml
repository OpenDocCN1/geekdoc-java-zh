- md: "\n# JAVA 5: FILES AND IO\n\nA FileChannel is opened to the file, and this time\
    \ it's a readwrite channel, and the first thing that happens is the method prints\
    \ the position of the file pointer and file size. Next, a ByteBuffer is created.\
    \ Now you can write an int, a double, an int and another double to this buffer.\
    \ In order to format these values for bytes I found that ByteBuffer has methods\
    \ for this purpose, which partially copies the values into the buffer and moves\
    \ the index position. After the four values are written to the buffer a flip()\
    \ is performed, and the buffer's contents are sent to the channel. Then the buffer\
    \ and the file pointer is set 0, and the contents of the file are read to the\
    \ buffer. Finally, the result is printed, and again are used the right get methods\
    \ for reading from the buffer. If the method is, the result is:\n\n```\nPosition\
    \ = 0, size = 24\nPosition = 24, size = 24\n23\n3.14159265358993\n29\n2.718281828459045\n\
    ```\n\n# MEMORY MAPPED FILES\n\nA FileChannel has a method map() which makes it\
    \ possible to embed an open file or a part of an open file in a buffer:\n\n```\n\
    MappedByteBuffer map(FileChannel.MapMode mode, long position, long size)\n```\n\
    \nThe three parameters denote a mode in addition to part of the file to be encapsulated\
    \ (start position and the length of the segment to be encapsulated). One may be\
    \ READ_ONLY or READ_WRITE. The type MappedByteBuffer has the same characteristics\
    \ as other buffers, but its content is stored in a file. This means for example,\
    \ that if you perform a get() and the file is updated by another program, the\
    \ changes are visible in the current program. The same also applies to put() if\
    \ you update the buffer, the changes will be visible in another programs that\
    \ use the same file. The goal of a memory mapped file is of course performance,\
    \ and especially when processing large files like pictures. As an example is shown\
    \ a method that creates a file with 1000 integers:\n\n```\nprivate static void\
    \ test15() {\n  try (FileChannel fc = (new RandomAccessFile(\"numbers\", \"rw\"\
    )).getChannel()) {\n    MappedByteBuffer buffer = fc.map(FileChannel.MapMode.READ_WRITE,\
    \ 0, 4096);\n    for (int i = 0; i < 1000; i++) buffer.putInt(i + 1);\n  }}\n\
    ```\n\n# JAVA 5: FILES AND JAVA IO\n\n```\ncatch (IOException ex) {\n    System.out.println(\"\
    I/O error: \" + ex.getMessage());\n}\n```\n\nThe file is a RandomAccessFile and\
    \ as in the previous example is created a FileChannel to the file. Next is created\
    \ a MemoryMappedBuffer to the channel and the buffer says that the file will be\
    \ mapped from start to byte 4096. This number corresponds exactly to the file\
    \ it must contain 1000 integers of type int. The next loop fills the buffer with\
    \ 1000 integers from 1 to 1000. You should note that the result of the buffer\
    \ is written to the file that will contain the 1000 integers. Note also that since\
    \ it is a difference row, the sum of the numbers are 500500.\n\nThe next method\
    \ updates the file:\n\n```\nprivate static void test6() {\n    try (FileChannel\
    \ fc = (new RandomAccessFile(\"numbers\", \"rw\")).getChannel()) {\n        MappedByteBuffer\
    \ buffer = fc.map(FileChannel.MapMode.READ_WRITE, 0, fc.size());\n        for\
    \ (int i = 0; i < 1000; i++) buffer.putInt(i * 2 * buffer.getInt(i * 4));\n  \
    \  } catch (IOException ex) {\n        System.out.println(\"I/O error: \" + ex.getMessage());\n\
    \    }\n}\n```\n\nAgain is a memory mapped file and all data in the file is updated\
    \ by doubling. You should notice how the individual numbers are referenced:\n\n\
    ```\nbuffer.getInt(i * 4)\n```\n\nreturns an int, starting at the address 4*i,\
    \ but without moving the buffer’s position. The statement\n\n```\nbuffer.putInt(2\
    \ * buffer.getInt(i * 4));\n```\n\nupdates the same int, and then moves the position\
    \ 4 bytes forward.\n\n# JAVA 5: FILES AND IO\n\nSince all numbers are doubled,\
    \ the sum of the numbers in the file then is 1001000. It is validated by the following\
    \ method:\n\n```\nprivate static void test17() {\n    try (FileChannel fc = (new\
    \ RandomAccessFile(\"numbers\", \"r\")).getChannel()) {\n        long sum = 0;\n\
    \        MappedByteBuffer buffer = fc.map(FileChannel.MapMode.READ_ONLY, 0, fc.size());\n\
    \        while (buffer.hasRemaining()) \n            sum += buffer.getInt();\n\
    \        }\n        System.out.println(sum);\n    } catch (IOException ex) {\n\
    \        System.out.println(\"I/O error: \" + ex.getMessage());\n    }\n}\n```\n\
    \n![](img/5d98ad28901c31fd736abaabe8f09e19_107_0.png)\n\nGet in-depth feedback\
    \ & advice from experts in your topic area. Find out what you can do to improve\
    \ the quality of your dissertation!\n\nGet Help Now\n\nGo to www.helpmyassignment.co.uk\
    \ for more info\n\nDownload free eBooks from bookoon.com Click on the ad to read\
    \ more\n\n# JAVA 5: FILES AND JAVA IO\n\n# LOCKING FILES\n\nAs the last related\
    \ to channels I will look at file locking. It is possible to put a lock on an\
    \ entire file or just on a part of a file, where the lock indicates, where in\
    \ the file locking begins of what area in the file to be locked. Locking occurs\
    \ at process level (and not threads), and I will in this context distinguish between\
    \ a writer process (a process that writes to the file) and a reader process (a\
    \ process that simply reads from the file). There are two kinds of locks. A writer\
    \ process can set an exclusive lock on a part of a file, and it can do so if there\
    \ are no other processes that put a lock that overlaps the part of the file to\
    \ be locked. An exclusive lock gives the writer full control over the locked part\
    \ of the file such that it can both read and write. A reader process can put a\
    \ shared lock on a part of the file, and it can do so if not another process has\
    \ put an exclusive lock that overlaps the part of the file to be locked. This\
    \ means that the several processes can set a shared lock for the same part of\
    \ a file, and that more processes can read the file.\n\nA lock has the type FileLock\
    \ and the FileChannel class has four methods to create a lock:\n\n1. lock()\n\
    2. lock(long position, long size, boolean shared)\n3. tryLock()\n4. tryLock(long\
    \ position, long size, boolean shared)\n\nThe first and the third create an exclusive\
    \ lock on the entire file, while the other two can specify the part of the file\
    \ to be locked and where the lock should be exclusive or shared. The difference\
    \ is further that the first two blocks, which is to say if they are unable to\
    \ lock, they are set in a queue until they get the lock, after the process is\
    \ running automatically when the lock is released. The last two methods are not\
    \ blocking, but if they cannot create the lock, they will return null, and that\
    \ is up to the program to decide what is happen next.\n\nThe class FileLock has\
    \ a number of methods that can return the information on the lock and its conditions,\
    \ but most importantly is the method release() which is used to release the lock.\
    \ Universally, one uses the following pattern to lock a file:\n\n```\nFileLock\
    \ lock = fileChannel.lock();\ntry {\n  // interact with the file channel\n} catch\
    \ (IOException ex) {\n// handle the exception\n}\nfinally{\n    lock.release();\n\
    }\n```\n\nand here it is important that the method release() is performed in a\
    \ finally block, so that one is sure it is executed.\n\nTo illustrate file locking\
    \ in practice I have written following program Locking:\n\n```\npackage locking;\n\
    \nimport java.util.*;\nimport java.io.*;\nimport java.nio.*;\nimport java.nio.channels.*;\n\
    \npublic class Locking {\n    private static final Random rand = new Random();\n\
    \    private static final int N = 1000000;\n\n    public static void main(String[]\
    \ args) {\n        boolean writer = args.length != 0;\n        try (FileChannel\
    \ fc = (new RandomAccessFile(\"integers\", writer ? \"rw\" : \"r\")).getChannel())\
    \ {\n            if (writer) fc.write(fc); else read(fc);\n        } catch (Exception\
    \ ex) {\n            System.out.println(\"I/O error: \" + ex.getMessage());\n\
    \        }\n    }\n    private static void read(FileChannel fc) throws Exception\
    \ {\n        for (int i = 0; i < N; i++) {\n            System.out.println(\"\
    Wait a shared lock\");\n            long t1 = System.nanoTime();\n           \
    \ FileLock lock = fc.lock(0, 16, true);\n            long t2 = System.nanoTime();\n\
    \        }\n    }\n}\n```\n"
  mdcn: "\n\n# JAVA 5：文件与 IO\n\n打开了一个指向文件的 FileChannel，这次是一个读写通道，首先发生的是该方法打印了文件指针的位置和文件大小。接下来，创建了一个\
    \ `ByteBuffer`。现在你可以向此缓冲区写入一个 `int`、一个 `double`、一个 `int` 和另一个 `double`。为了将这些值格式化为字节，我发现\
    \ `ByteBuffer` 有专门的方法，它们会将值部分复制到缓冲区中并移动索引位置。在将四个值写入缓冲区后，执行 `flip()`，并将缓冲区的内容发送到通道。然后将缓冲区和文件指针重置为\
    \ 0，并将文件内容读取到缓冲区。最后，打印结果，并再次使用正确的 `get` 方法从缓冲区中读取。如果该方法（如文所示），结果为：\n\n```\nPosition\
    \ = 0, size = 24\nPosition = 24, size = 24\n23\n3.14159265358993\n29\n2.718281828459045\n\
    ```\n\n# 内存映射文件\n\nFileChannel 有一个 `map()` 方法，它可以将一个打开的文件或打开文件的部分嵌入缓冲区中：\n\n```\n\
    MappedByteBuffer map(FileChannel.MapMode mode, long position, long size)\n```\n\
    \n这三个参数表示一种模式，以及要封装的文件部分（起始位置和要封装段的长度）。模式可以是 `READ_ONLY`（只读）或 `READ_WRITE`（读写）。`MappedByteBuffer`\
    \ 类型与其他缓冲区具有相同的特性，但它的内容存储在文件中。这意味着例如，如果你执行 `get()` 且另一个程序更新了文件，那么更改在当前程序中是可见的。`put()`\
    \ 也是如此，如果你更新了缓冲区，更改将在使用相同文件的其他程序中可见。内存映射文件的目标自然是性能优化，特别是在处理图片等大文件时。示例显示了一个创建一个包含\
    \ 1000 个整数的文件的方法：\n\n```\nprivate static void test15() {\n  try (FileChannel fc\
    \ = (new RandomAccessFile(\"numbers\", \"rw\")).getChannel()) {\n    MappedByteBuffer\
    \ buffer = fc.map(FileChannel.MapMode.READ_WRITE, 0, 4096);\n    for (int i =\
    \ 0; i < 1000; i++) buffer.putInt(i + 1);\n  }}\n```\n\n# JAVA 5：文件与 JAVA IO\n\
    \n```\ncatch (IOException ex) {\n    System.out.println(\"I/O error: \" + ex.getMessage());\n\
    }\n```\n\n该文件是一个 `RandomAccessFile`，并且像上一个示例一样创建了指向该文件的 `FileChannel`。接下来为该通道创建了一个\
    \ `MemoryMappedBuffer`，缓冲区表示文件将从开始到字节 4096 处进行映射。这个数字精确对应于文件，它必须包含 1000 个 `int`\
    \ 类型的整数。下一个循环用从 1 到 1000 的 1000 个整数填充缓冲区。你应该注意，缓冲区的结果被写入包含这 1000 个整数的文件中。请注意，由于是连续行，数字之和为\
    \ 500500。\n\n下一个方法更新了文件：\n\n```\nprivate static void test6() {\n    try (FileChannel\
    \ fc = (new RandomAccessFile(\"numbers\", \"rw\")).getChannel()) {\n        MappedByteBuffer\
    \ buffer = fc.map(FileChannel.MapMode.READ_WRITE, 0, fc.size());\n        for\
    \ (int i = 0; i < 1000; i++) buffer.putInt(i * 2 * buffer.getInt(i * 4));\n  \
    \  } catch (IOException ex) {\n        System.out.println(\"I/O error: \" + ex.getMessage());\n\
    \    }\n}\n```\n\n同样是一个内存映射文件，文件中所有的数据都通过翻倍进行了更新。你应该注意单个数字是如何被引用的：\n\n```\nbuffer.getInt(i\
    \ * 4)\n```\n\n返回一个从地址 `4*i` 开始的 `int`，但不会移动缓冲区的位置。语句\n\n```\nbuffer.putInt(2\
    \ * buffer.getInt(i * 4));\n```\n\n更新了同一个 `int`，然后将位置向前移动 4 字节。\n\n# JAVA 5：文件与\
    \ IO\n\n由于所有数字都翻倍了，文件中数字之和此时即为 1001000。通过以下方法进行验证：\n\n```\nprivate static void\
    \ test17() {\n    try (FileChannel fc = (new RandomAccessFile(\"numbers\", \"\
    r\")).getChannel()) {\n        long sum = 0;\n        MappedByteBuffer buffer\
    \ = fc.map(FileChannel.MapMode.READ_ONLY, 0, fc.size());\n        while (buffer.hasRemaining())\
    \ \n            sum += buffer.getInt();\n        }\n        System.out.println(sum);\n\
    \    } catch (IOException ex) {\n        System.out.println(\"I/O error: \" +\
    \ ex.getMessage());\n    }\n}\n```\n\n![](img/5d98ad28901c31fd736abaabe8f09e19_107_0.png)\n\
    \n从你领域的专家处获取深度反馈和建议。了解你可以做什么来提高论文的质量！\n\n立即获取帮助\n\n访问 www.helpmyassignment.co.uk\
    \ 获取更多信息\n\n从 bookoon.com 下载免费电子书 点击广告阅读更多\n\n# JAVA 5：文件与 JAVA IO\n\n# 文件锁定\n\
    \n作为与通道相关的最后一个主题，我将介绍文件锁定。可以对整个文件加锁，也可以只对文件的部分加锁，锁指示了在文件中何处开始锁定或要锁定文件的哪个区域。锁定发生在进程级别（而不是线程级别），我在此语境下将区分写入进程（向文件写入的进程）和读取进程（仅从文件中读取的进程）。锁有两种类型。写入进程可以对文件的部分部分设置**排斥锁**（exclusive\
    \ lock），只要没有其他进程设置与要锁定部分重叠的锁，就可以这样做。排斥锁赋予写入者对文件锁定部分的完全控制权，使其既可以读也可以写。读取进程可以对文件的部分设置**共享锁**（shared\
    \ lock），只要没有其他进程设置与要锁定部分重叠的排斥锁就可以这样做。这意味着多个进程可以对文件的同一部分设置共享锁，更多的进程可以读取文件。\n\n\
    锁的类型是 `FileLock`，`FileChannel` 类有四个方法创建锁：\n\n1. `lock()`\n2. `lock(long position,\
    \ long size, boolean shared)`\n3. `tryLock()`\n4. `tryLock(long position, long\
    \ size, boolean shared)`\n\n第一个和第三个创建整个文件的排斥锁，而另外两个可以指定要锁定的文件部分以及锁应该是排斥的还是共享的。进一步的区别在于前两个是阻塞的，也就是说，如果它们无法锁定，它们会被放入队列中直到获取锁，在锁被释放后进程会自动运行。最后两个方法是非阻塞的，但如果它们无法创建锁，它们将返回\
    \ `null`，这由程序决定下一步发生什么。\n\n`FileLock` 类有许多方法可以返回有关锁及其状态的信息，但最重要的是 `release()`\
    \ 方法，它被用于释放锁。通常情况下，人们使用以下模式来锁定文件：\n\n```\nFileLock lock = fileChannel.lock();\n\
    try {\n  // 与通道进行交互\n} catch (IOException ex) {\n// 处理异常\n}\nfinally{\n    lock.release();\n\
    }\n```\n\n在这里，`release()` 在 `finally` 块中执行很重要，确保它会被执行。\n\n为了在实践中演示文件锁定，我写了以下程序\
    \ `Locking`：\n\n```\npackage locking;\n\nimport java.util.*;\nimport java.io.*;\n\
    import java.nio.*;\nimport java.nio.channels.*;\n\npublic class Locking {\n  \
    \  private static final Random rand = new Random();\n    private static final\
    \ int N = 1000000;\n\n    public static void main(String[] args) {\n        boolean\
    \ writer = args.length != 0;\n        try (FileChannel fc = (new RandomAccessFile(\"\
    integers\", writer ? \"rw\" : \"r\")).getChannel()) {\n            if (writer)\
    \ fc.write(fc); else read(fc);\n        } catch (Exception ex) {\n           \
    \ System.out.println(\"I/O error: \" + ex.getMessage());\n        }\n    }\n \
    \   private static void read(FileChannel fc) throws Exception {\n        for (int\
    \ i = 0; i < N; i++) {\n            System.out.println(\"Wait a shared lock\"\
    );\n            long t1 = System.nanoTime();\n            FileLock lock = fc.lock(0,\
    \ 16, true);\n            long t2 = System.nanoTime();\n        }\n    }\n}\n\
    ```\n\n"
