    Converted to decimal it will be the result -123, which is obviously wrong. What
    you see here is an example of an overflow: The sum of the two numbers can not
    be in an 8-bit device and fall outside the range that can be represented with
    8 bits. Note that, when the addition of the two digits creates a carry, which
    was discarded.


    Usually makes a processor nothing in such a situation beyond that it delivers
    a wrong result. If it is desired to handle this situation, it is up to the software,
    for overflow. If the processor had to do something, it would be more complex,
    and it would cost in efficiency and it is not so easy to determine what the processor
    where appropriate should do. It is not entirely true that the processor is not
    doing anything. After each addition sets the processor some status bits, and one
    of them says there has been an overflow. There is also a status bit, which is
    the last carry and software can test whether there is a carry which is “thrown
    away”.


    It is worth emphasizing that the problem of overflow is not specifically associated
    with a word length of 8, but it can occur regardless of the word length used.
    It is only a question of adding two numbers that are sufficiently large.'
