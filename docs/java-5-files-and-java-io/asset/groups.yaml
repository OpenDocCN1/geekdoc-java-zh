    ## UTF-32


    This encoding uses 32 bits for all the characters, and that means that text encoded
    by this standard takes up more memory. The system is used only to a limited extent
    in the Unix world. In principle, many text operations are simpler when all characters
    take up the same, but in practice the gains are most.


    ## REPRESENTATION OF DECIMAL NUMBERS


    Above I have shown how to represent integers in a computer where positive integers
    are directly represented as binary numbers, and negative integers are represented
    by their 2s complement. A computer must also be able to work with decimal fractions,
    and it is once more difficult. There are a number of ways, but basically they
    can be divided into two categories


    1. decimal numbers with fixed decimal point, which in many ways is an extension
    of the representation of integers, so that there is a number of the bits for the
    integer part and a number of bits for the fractional part

    2. decimal numbers with floating point, where you have a certain number of bits
    for the whole number, but the bits used for the integer part and which are used
    for the fractional part depends on the numbers current value


    The two categories are quite different, and the first is far simplest, but is
    best suited if numbers do not spread over wide an interval. The second category
    enables far greater range of numbers, but more complex. I will only look at the
    last category. Partly because it is the most used form of representation of decimal
    numbers, and partly because there is more to add in terms of what I have shown.
    One speaks generally about floating-point, and here again are several variants,
    but I would look at standard IEEE 754, which is the most commonly used for representing
    floating-point numbers.


    ## A BIT MORE ABOUT BINARY NUMBERS


    In the introduction I mentioned that an integer in 10-number system can be represented
    as a sum where symbols $a_0 \dots a_n$ are digits in decimal number, and I also
    mentioned how this representation can be generalized to base 2 and binary number
    system. Looking again at 10-number system, the notation can be used to describe
    decimal numbers which include fractions:


    $$\sum_{i=0}^{n} a_i 10^i$$


    If you looks at the number 123.56, it can be written as


    $$\sum_{i=-2}^{3} a_i$$


    where $a_{-2} = 6, a_{-1} = 5, a_0 = 4, a_1 = 3, a_2 = 2, a_3 = 1$.


