- md: "\n# JAVA 5: FILES AND JAVA IO\n\n```java\nfor (int i = 0; i < 10; ++i) {\n\
    \    writer.write(String.format(\"%d %1.2f\\n\",\n        rand.nextInt(10) + 1,\
    \ rand.nextDouble() * 100));\n} catch (IOException ex) {\n    System.out.println(ex);\n\
    }\ntry (Scanner scan = new Scanner(new BufferedReader(new FileReader(\"numbers\"\
    )))) {\n    double sum = 0;\n    while (scan.hasNext()) sum += scan.nextInt()\
    \ * scan.nextDouble();\n    System.out.println(sum);\n} catch (IOException ex)\
    \ {\n    System.out.println(ex);\n}\n```\n\nThe method prints 10 lines to a file\
    \ in which each line contains an integer and a decimal number separated by a space.\
    \ Next, the file is scanned, as part of the scan elements are converted (the individual\
    \ tokens) to either an int or a double and the product is calculated.\n\n# EXERCISE\
    \ 5\n\nA common use of text files is to transfer data between applications. An\
    \ application can store information in a text file that can be sent to a recipient\
    \ who then read the content of the file. Often kind of files are called CSV files.\
    \ CSV stands for comma separated values, noting that the file contains values\
    \ separated by a comma. The separation character do not necessarily be to a comma\
    \ and can be anything. The only requirement is that it is a character that cannot\
    \ occur in the individual data elements (values). Besides comma are often used\
    \ spaces, semicolons, tab, or equivalent, whatever character use the file is still\
    \ called a CSV file. In this exercise you have to write a program that creates\
    \ a CSV file and read it again. Create a new project, you can call Files. Add\
    \ a method that creates a text file consisting of lines that start with a date\
    \ and is followed by one or more decimal numbers separated by semicolons. The\
    \ start of the file, for example:\n\n| Date | Value |\n| :--- | :--- |\n| 17.04.2014\
    \ | 573,325 |\n| 228,97 | 242,394 |\n| 190,612 | 107,02 |\n| 249,293 | 29 |\n\
    | 11.09.2012 | 325,054 |\n| 87,325 | 25,465 |\n| 31.12.2013 | 992,33,69 |\n\n\
    A line could, for example interpreted as number of amounts (for example sales)\
    \ concerning a certain date. You should note, that can be lines with the same\
    \ date and in any order. The difficult thing is not to create the file, but to\
    \ creates lines to be printed to the file, so you should create some helper methods.\
    \ You must then write a method that reads the content of the file and prints a\
    \ list as below:\n\n| Date | Value |\n| :--- | :--- |\n| 02.01.2012 | 184,44 |\n\
    | 04.01.2012 | 330,82 |\n| 05.01.2012 | 756,04 |\n| 08.01.2012 | 973,91 |\n\n\
    The table must show the total sales for each date, and the lines must be sorted\
    \ by date. CSV files are typically line oriented, but need not be the case. You\
    \ have to write another method that creates a text file, but the file must consist\
    \ of elements separated by semicolon which is alternately a date and a number.\
    \ Next, write a method that reads the file and prints overview as above. Because\
    \ the file is not line oriented, it must be read in a different way, and this\
    \ can be advantageously done by use of scanner.\n\nThe above defines in principle\
    \ what is necessary to work with files, but modern operating systems provide many\
    \ services available that are not supported by the classes in java.io, and it\
    \ is the reason for another package called java.nio. Another reason for new package\
    \ for io is also providing services available to stream data over a network. In\
    \ this book I will only look at the package for files, but I will treat other\
    \ services that java.nio provides. This chapter describes the main classes in\
    \ this package. Basically it is about classes to\n\n- buffers\n- channels\n- paths\n\
    \n# JAVA 5: FILES AND IO\n\n# JAVA.NIO\n\nThe fundamental concept in the new API's\
    \ buffers. A process as JVM asking the operating system to drain the content of\
    \ a buffer with a write operation, and accordingly, the JVM ask the operating\
    \ system to fill a buffer with a read operation. If the JVM instance asking the\
    \ operating system to read from a disk file, the operating system will send a\
    \ command to the disk controller to read a block of bytes from the disk and save\
    \ them in an operating system buffer. After this operation is completed, the operating\
    \ system copies the content of the buffer to a second buffer in the address space\
    \ of the specified process as parameter of the JVM in the read() operation. One\
    \ of the goals with java nio is to increase the efficiency of the necessary copying\
    \ between buffers, and it is not simple, because the disk controller always reads/writes\
    \ with a fixed size, while the JVM uses variable sized blocks and blocks which\
    \ are not necessarily contiguous allocated and can be moved by the garbage collector.\n\
    \nOne can think of a channel as a conduit used by the operating system to drain\
    \ or fill a buffer with bytes from a device such as a disk controller. An example\
    \ is a FileChannel, and as its name suggests it acts as a channel between a program\
    \ and a disk file. It supports several things that are not possible with standard\
    \ IO, and here include locking mechanisms and memory mapped files.\n\nFinally\
    \ are paths java.nio representation of the file system. The following describes\
    \ the most important classes in the package java.nio, and it is primarily using\
    \ simple methods in the program NioProgram.\n\n# 3.1 BUFFERS\n\nA buffer is an\
    \ object that can contain a fixed amount of data that can be sent to or received\
    \ from an IO-service, and one can think of it as an object that sits between a\
    \ program and a channel. The buffer has basically four characteristics:\n\n- capacity,\
    \ that defines how many elements a Buffer can contain\n- limit, that is a 0-based\
    \ index, that denotes the first element, that cannot be written or read\n- position,\
    \ that is a 0-based index, that denotes the position for the next read or write\n\
    - mark, that is a 0-based index, that is used to reset the position\n\nBuffer\
    \ is an abstract class that provides a number of methods available, but there\
    \ are concrete classes for each of the primitive data types, and basically a buffer\
    \ is encapsulation of an array.\n\nYou can think of a new created buffer as illustrated\
    \ in the following figure:\n\n![](img/5d98ad28901c31fd736abaabe8f09e19_79_0.png)\n\
    \nThe buffer has a capacity of 10, and the limit always has the same value as\
    \ capacity. The position is initially 0, indicating the element in the buffer.\
    \ The mark is initially undefined. As an example is a method that creates a buffer\
    \ of bytes, which has 10 elements:\n\n```java\nprivate static void test01() {\n\
    \    Buffer buffer = ByteBuffer.allocate(10);\n    print(buffer);\n    buffer.limit(8);\n\
    \    buffer.position(3);\n    print(buffer);\n    buffer.flip();\n    print(buffer);\n\
    \    buffer.mark();\n    buffer.position(2);\n    print(buffer);\n    buffer.reset();\n\
    \    print(buffer);\n    buffer.limit(8);\n    buffer.position(3);\n    print(buffer);\n\
    \    buffer.rewind();\n    print(buffer);\n    buffer.clear();\n    print(buffer);\n\
    \    buffer = LongBuffer.allocate(10);\n    print(buffer);\n}\n```\n\n```java\n\
    private static Buffer print(Buffer buffer)\n{\n    System.out.println(\"Capacitet:\
    \ \" + buffer.capacity());\n    System.out.println(\"Limit: \" + buffer.limit());\n\
    \    System.out.println(\"Position: \" + buffer.position());\n    System.out.println(\"\
    Remaining: \" + buffer.remaining());\n    System.out.println(buffer);\n    return\
    \ buffer;\n}\n```\n\nThe first statement creates the buffer and when the method\
