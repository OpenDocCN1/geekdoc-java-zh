- md: "\n## JAVA 5: FILES AND JAVA IO\n\n## 2.5 CHARACTER STREAMS\n\nThere is also\
    \ a family of classes that are used to stream a sequence of characters and thus\
    \ a text. In fact, they are far more often needed than directly stream a sequence\
    \ of bytes (hence the raw data). In Java it is text or characters represented\
    \ as 2 bytes unicodes, while they are streamed to a file, a character file one\
    \ or a few bytes is encoded as UTF-8. All the regular letters occupies only one\
    \ byte, while others that are not so frequently used characters, including national\
    \ characters occupies 2 or more bytes. The goal is to reduce the number of bytes\
    \ sent over a stream. Stream classes to handle the necessary conversion that happens\
    \ transparently without the programmer’s involvement – Stream classes to handle\
    \ the necessary conversion that happens transparently without the programmer’s\
    \ involvement – at least long as the program should not be used anywhere in this.\
    \ Strictly speaking, not the same encoding is used everywhere but the entire Western\
    \ world uses the same encoding. If you need internationalization, it is possible\
    \ to specify the encoding to be used, but otherwise stream uses an encoding based\
    \ on the machine’s local setting. Below is an example that writes test to a file\
    \ and read the text again:\n\n```java\nprivate static void test15() {\n    try\
    \ (FileWriter writer = new FileWriter(\"names\")) {\n        writer.write(\"Gorm\
    \ Gamle\\n\");\n        writer.write(\"Harald Blåtand\\n\");\n        writer.write(\"\
    Svend Tveskåg\\n\");\n    } catch (IOException ex) {\n        System.out.println(ex);\n\
    \    }\n    char[] buffer = new char[20];\n    try (FileReader reader = new FileReader(\"\
    names\")) {\n        for (int count = reader.read(buffer, 0, buffer.length); count\
    \ != -1; ) {\n            for (int i = 0; i < count; ++i) System.out.print(buffer[i]);\n\
    \        }\n    } catch (IOException ex) {\n        System.out.println(ex);\n\
    \    }\n}\n```\n\nThe methods writes strings separated by line breaks, and the\
    \ text are loaded again in a buffer whose content then are printed on the screen.\
    \ When you in this way wants to deal with text files, you will usually encapsulate\
    \ both the writer and the reader in a buffer, and here you will specially notice\
    \ how to read files with the method readLine() and thus perceive the file as line-oriented\n\
    \n```java\nprivate static void test16() {\n    try (BufferedWriter writer = new\
    \ BufferedWriter(new FileWriter(\"names\"))) {\n        writer.write(\"Gorm den\
    \ Gamle\");\n        writer.newLine();\n        writer.write(\"Harald Blåtand\"\
    );\n        writer.newLine();\n        writer.write(\"Svend Tveskøg\");\n    }\
    \ catch (IOException exception) {\n        System.out.println(ex);\n    }\n  \
    \  try (BufferedReader reader = new BufferedReader(new FileReader(\"names\"))\
    \ {\n```\n\n![](img/5d98ad28901c31fd736abaabe8f09e19_62_0.png)\n\n```java\nfor\
    \ (String line = reader.readLine(); line != null; line = reader.readLine()) {\n\
    \  System.out.println(line);\n}\ncatch (IOException e) {\n  System.out.println(ex);\n\
    }\n```\n\nIn the above example I used a FileWriter and FileReader as character-oriented\
    \ stream classes to files and including BufferedWriter and BufferedReader, but\
    \ there are other Reader Writer classes, there are most important:\n\n- FileReader\n\
    - FilterReader\n- StringIO\n- PipedReader\n- CharArrayReader\n- InputStreamReader\n\
    - FileReader\n- FileWriter\n- StringWriter\n- PipedWriter\n- CharArrayWriter\n\
    - OutputStreamWriter\n- PrintWriter\n\nYou should also note that the FileReader\
    \ and FileWriter is wrapper classes for respectively an InputStream and an OutputStreamWriter.\n\
    \nSometimes it is not recommended to use the FileReader and FileWriter, as they\
    \ do not allow you to enter any Encoding. The same method as above can be written\
    \ as follows where you indicates the encoding:\n\n```java\nprivate static void\
    \ test17() {\n  try (BufferedWriter writer = new BufferedWriter(\n    new OutputStreamWriter(new\
    \ FileOutputStream(\"navne2\",\"ISO-8859-1\"))) {\n    writer.write(\"Gorm den\
    \ Gamle\");\n    writer.newLine();\n    writer.write(\"Harald Blåtand\");\n  \
    \  writer.newLine();\n    writer.write(\"Svend Tveskåg\");\n  }\n} catch (IOException\
    \ ex) {\n  System.out.println(ex);\n}\n```\n\n```java\ntry (BufferedReader reader\
    \ = \n    new BufferedReader(new InputStream(\"navne2\", \"ISO-8859-1\")))\n{\n\
    \    for (String line = reader.readLine(); line != null; line = reader.readLine())\
    \ {\n        System.out.println(line);\n    }\n} catch (IOException ex) {\n  \
    \  System.out.println(ex);\n}\n```\n\nIn this case, indicates the encoding that\
    \ it should not be UTF-8 but ISO 8859-1, in which all characters are encoded as\
    \ a single byte. The main use of this option is that you may need to read text\
