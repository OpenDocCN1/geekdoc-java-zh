- md: "\n## JAVA 5: FILES AND JAVA IO\n\nAfter the four statements is performed, the\
    \ file is closed. It is important, as the write statements write to a memory buffer.\
    \ The content of this book is first written physically to the file when the buffer\
    \ is full or the file is closed. Another reason for the file to be closed is that\
    \ you release the resources allocated to the file. Closing a file with the close()\
    \ is important, and to ensure that the statement is executed, it is placed in\
    \ a finally block that is performed regardless of whether an exception occurs\
    \ or not.\n\nThe above clearly defines a pattern for how to treat files:\n\n-\
    \ 1. open the file\n- 2. performs the wanted file operations\n- 3. close the file\n\
    \nAfter having written four numbers to the file, it is opened again to read the\
    \ contents:\n\n```java\ntry (RandomAccessFile file = new RandomAccessFile(\"tal.dat\"\
    , \"r\"))\n```\n\nThis time the file is opened in a statement after the try. It\
    \ is a syntax that is really just a short way of writing the above, but it guarantees\
    \ that the file will be closed when the program exits the try block. The syntax\
    \ is in most cases preferable: first, it is actually shorter and more readable,\
    \ and secondly you are sure that you remember to close the file. After the file\
    \ is opened, it performs a read() operation four times that reads four integers\
    \ in the file, and the sum of these numbers is determined and printed along with\
    \ the sum of four numbers that are written in the file. The idea is that you have\
    \ to see that you get the same result:\n\n4783678760\n4783678760\n\nand thus it\
    \ is the same four numbers that are read as the numbers originally written in\
    \ the file. You should note that the method readInt() reads 4 bytes from the location\
    \ where the file pointer is and converts these 4 bytes to an int. After the method\
    \ is performed, the file pointer is moved 4 bytes forward. The method interprets\
    \ not what the 4 bytes contain, and the result is a \"sense\" integer. 4 bytes\
    \ can be interpreted as an integer, no matter what they contain. As a next step\
    \ the file is opened again for reading and writing:\n\n```java\ntry (RandomAccessFile\
    \ file = new RandomAccessFile(\"tal.dat\", \"rw\")) {\n  file.seek(8);\n  file.writeInt(value5);\n\
    }\n```\n\nThen the file pointer is moved forward, 8 bytes, which means that it\
    \ points to the start of the third number in the file. The method writes another\
    \ number to the file, which means that the third number is overwritten, and the\
    \ value is now the value of value5. After the statements are executed, the file\
    \ is opened again for reading, and the sum of the four numbers is determined again,\
    \ and you will find that you get a different result, but the correct result:\n\
    \n4918422832\n4918422832\n\nIn a RandomAccessFile you can then use the method\
    \ seek() to move the file pointer to a random position or read or write from position.\n\
    \nThe file is opened for reading again:\n\n```java\ntry (RandomAccessFile file\
    \ = new RandomAccessFile(\"tal.dat\", \"r\")) {\n    byte[] arr = new byte[16];\n\
    \    file.read(arr);\n    String str = new String(arr);\n    System.out.println(str);\n\
    }\n```\n\nand the code creates an array with room for 16 bytes (exactly matches\
    \ the contents of the file — if you examine its properties with Files you can\
    \ see that it takes up 16 bytes). Next, read the file with the method read() as\
    \ a parameter. This method reads a maximum of 16 bytes in the file (if there are\
    \ not 16 bytes after the file pointer). The 16 bytes are used to initialize a\
    \ string, and the result is:\n\nABCDEFGHIJKLMNOPQRSTUVWXYZ\n\nThe goal is to show\
    \ that even though the file contains four integers which total up 16 bytes, it\
    \ can be interpreted as anything, and it is the program that reads the file's\
    \ contents determines how the results should be interpreted. It is further illustrated\
    \ with the last statements in the test method that reads the contents of the file\
    \ and interprets it as two numbers of type double.\n\n## HISTORY AGAIN\n\nIn the\
    \ example in the book Java 2 I showed a program where you could enter information\
    \ about historic people and save the information by object serialization. I will\
    \ show a different version of the program where the difference is that the persons\
    \ are stored in a RandomAccessFile. Let me explain that this solution has no advantages,\
    \ and the goal is to show an example of a file containing records of fixed length,\
    \ formerly a typical application of files.\n\nThe starting point was the following\
    \ class, which represents a historic person (where I have not shown the get and\
    \ set methods):\n\n```java\npublic class Person implements Comparable<Person>,\
    \ Serializable\n{\n    private int recnr = -1; // identification of a person\n\
    \    private String name; // the person's name\n    private String job; // the\
    \ person's position\n    private String text; // a description\n    private int\
    \ from; // birth, start of reign or otherwise\n    private int to; // year of\
