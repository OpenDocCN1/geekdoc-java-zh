    ## JAVA 5：文件与 I/O


    ## 最终示例


    如果你观察 10 进制系统中的整数，它们可以被写为 $t = \sum_{i=0}^{n} a_i 10^i$，其中该数字有 $n+1$ 位，且 $a_0,
    a_1, \dots, a_n$ 都是符号 $0, 1, 2, \dots, 9$ 之一。例如：


    ```

    $18207 = 7 * 10^0 + 0 * 10^1 + 2 * 10^2 + 8 * 10^3 + 1 * 10^4

    ```




    这意味着 $n=4$ 且 $a_0=7, a_1=0, a_2=2, a_3=8$ 以及 $a_4=1$。我们预见到十进制是以 10 为基数的位值系统。这种数字表示法可以立即推广到其他基数，实际上对于任何大于
    1 的自然数都存在这样的系统。例如，上述提到的 10 进制系统就是一个基数为 10 的系统。


    ## 二进制系统


    二进制系统简单来说是以 2 为基数的位值系统。因此，它需要两个符号：0 和 1。例如，一个数字可以：


    ```

    $t = \sum_{i=0}^{n} a_i 2^i

    ```


