    \n以下类继承自 `Person` 并通过职位名称扩展了 `Person` 类\n\n```java\nclass Employee extends Person\
    \ {\n    private String job;\n\n    public Employee(String name, String job, Calendar\
    \ fdate, double sats)\n    {\n      super(name, fdate, sats);\n      this.job\
    \ = job;\n    }\n\n    public String toString()\n    {\n      return job + \"\\\
    n\" + super.toString();\n    }\n}\n```\n\n你应该注意，该类没有定义为 `Serializable`，但这种类型的对象仍然可以被序列化，因为基类是\
    \ `Serializable`：\n\n```java\nprivate static void test2()\n{\n  try (ObjectOutputStream\
    \ stream = new ObjectOutputStream(new FileOutputStream(\"employee\"))) {\n   \
    \ Employee e = new Employee(\"Carlo Jensen\", \"Executioner\", new GregorianCalendar(1949,\
    \ 0, 23), 225);\n    stream.writeObject(e);\n  } catch (IOException ex) {\n  \
    \  System.out.println(ex);\n  }\n  try (ObjectInputStream stream =\n        new\
    \ ObjectInputStream(new FileInputStream(\"employee\"))) {\n    Employee e = (Employee[])stream.readObject();\n\
    \    System.out.println(e);\n    } catch (ClassNotFoundException ex) {\n    System.out.println(ex);\n\
    \  } catch (IOException ex) {\n    System.out.println(ex);\n  }\n}\n```\n\n这是可以运行的，因为\
    \ `Employee` 类实现了 `Serializable`。\n\n## 自定义的 writeObject() 和 readObject()\n\n\
    有时你想自己决定如何对对象的序列化和反序列化。这可能是为了性能，但过程非常简单，只要该类实现了 `Serializable`。以下类实现了这些方法：\n\n\
    ```java\nclass Name implements Serializable\n{\n    private String name;\n   \
    \ private Calendar time = null;\n\n    public Name(String name)\n    {\n     \
    \   this.name = name;\n    }\n\n    private void writeObject(ObjectOutputStream\
    \ out) throws IOException\n    {\n        out.writeObject(name);\n        out.writeObject(time);\n\
    \    }\n\n    private void readObject(ObjectInputStream in) throws IOException,\
    \ ClassNotFoundException\n    {\n        name = (String) in.readObject();\n  \
    \      time = (Calendar) in.readObject();\n    }\n\n    public String toString()\n\
    \    {\n        if (time == null) return name;\n        return name + \" \" +\
    \ time.toString();\n    }\n}\n```\n\n当一个对象被序列化时，只有字段会被保存，反序列化时如下：\n\n```java\n\
    private static void test3() {\n    try (ObjectOutputStream stream =\n        new\
    \ ObjectOutputStream(new FileOutputStream(\"name\"))) {\n        Name n = new\
    \ Name(\"Carlo Jensen\");\n        stream.writeObject(n);\n    } catch (IOException\
    \ ex) {\n        System.out.println(ex);\n    }\n    try (ObjectInputStream stream\
    \ =\n        new ObjectInputStream(new FileInputStream(\"name\"))) {\n       \
    \ Name n = (Name)stream.readObject();\n        System.out.println(n);\n    } catch\
    \ (ClassNotFoundException ex) {\n        System.out.println(ex);\n    } catch\
    \ (IOException ex) {\n        System.out.println(ex);\n    }\n}\n```\n\n## 外部化\
    \ (EXTERNALIZABLE)\n\n注意 `Externalizable` 接口定义了两个方法 `writeExternal()` 和 `readExternal()`：\n\
    \n```java\nclass King implements Externalizable {\n    private String name;\n\
    \    private int from;\n    private int to;\n\n    public King() {}\n\n    public\
    \ King(String name, int from, int to) {\n        this.name = name;\n        this.from\
    \ = from;\n        this.to = to;\n    }\n\n    public String toString() {\n  \
    \      if (from == 0 && to == 0) return name;\n        if (from == 0) return name\
    \ + String.format(\" %d\", from);\n        if (to == 0) return name + String.format(\"\
    \ %d\", to);\n        return name + String.format(\" %d - %d\", from, to);\n \
    \   }\n\n    public void writeExternal(ObjectOutput out) throws IOException {\n\
    \        out.writeUTF(name);\n        out.writeInt(from);\n        out.writeInt(to);\n\
    \    }\n\n    public void readExternal(ObjectInput in) \n        throws IOException,\
    \ ClassNotFoundException {\n        name = in.readUTF();\n        from = in.readInt();\n\
    \        to = in.readInt();\n    }\n}\n```\n\n![](img/5d98ad28901c31fd736abaabe8f09e19_59_0.png)\n\
    \n这些方法必须分别向 `ObjectOutput` 写入和从 `ObjectInput` 读取，因为这些接口是由 `ObjectOutputStream`\
    \ 和 `ObjectInputStream` 实现的。对象的序列化和反序列化的语法与之前相同：\n\n```java\nprivate static void\
    \ test14() {\n    try (ObjectOutputStream stream =\n        new ObjectOutputStream(new\
    \ FileOutputStream(\"king\"))) {\n        King king = new King(\"Knud den Hellige\"\
    , 1080, 1086);\n        stream.writeObject(king);\n    } catch (IOException ex)\
    \ {\n        System.out.println(ex);\n    }\n    try (ObjectInputStream stream\
    \ =\n        new ObjectInputStream(new FileInputStream(\"king\"))) {\n       \
    \ King king = (King)stream.readObject();\n        System.out.println(king);\n\
    \    } catch (ClassNotFoundException ex) {\n        System.out.println(ex);\n\
    \    } catch (IOException ex) {\n        System.out.println(ex);\n    }\n}\n```\n\
