- md: "\n## JAVA 5: FILES AND IO\n\n```java\nSystem.out.println(ex);\n}\n```\n\nThe\
    \ most important of these examples is how you with the class Files can create\
    \ both a BufferedWriter and a BufferedReader.\n\nThe next two examples are similar\
    \ and show how the class Files can create a BufferedOutputStream and a BufferedInputStream:\n\
    \n```java\nprivate static void test30() {\n  byte data[] = new byte[100];\n  Path\
    \ path = Paths.getProperty(\"user.home\").resolve(\"tmp/file5\");\n  try (OutputStream\
    \ out = new BufferedOutputStream(Files.newOutputStream(path, StandardOpenOption.APPEND)))\
    \ {\n    rand.nextBytes(data);\n    for (int i = 0; i < 100; ++i) out.write(data);\n\
    \  } catch (IOException ex) {\n    System.out.println(ex);\n  }\n}\n```\n\n```java\n\
    private static void test31() {\n  Path path = Paths.getProperty(\"user.home\"\
    ).resolve(\"tmp/file5\");\n  long sum = 0;\n  try (InputStream in = new BufferedInputStream(Files.newInputStream(path)))\
    \ {\n    for (int t = in.read(); t != -1; t = in.read()) sum += t;\n  } catch\
    \ (IOException ex) {\n    System.out.println(ex);\n  }\n  System.out.println(sum);\n\
    }\n```\n\nThe first method writes 10000 bytes to a BufferedOutputStream, and here\
    \ you should especially note that it is opened in append mode. The method writes\
    \ 100 times, and each time it writes an array with 100 random bytes. The last\
    \ method reads the file again by means of a BufferedInputStream and determines\
    \ the sum.\n\n## JAVA 5: FILES AND JAVA IO\n\nThe last example I will show how\
    \ to write strings to a file, but this time using a channel:\n\n```java\nprivate\
    \ static void test32()\n{\n    List<String> lines = Arrays.asList(\"Gorn Gamle\"\
    , \"Harald Blåtand\",\n\"Svend Tveskåg\", \"Harald d. 2.\", \"Knud den Store\"\
    , \"Hardeknud\",\n\"Magnus den Gode\");\n    Path path = Paths.get(System.getProperty(\"\
    user.home\")).resolve(\"tmp/file6\");\n    try (ByteChannel channel = Files.newByteChannel(path,\
    \ StandardOpenOption.CREATE))\n    {\n        for (String line : lines)\n    \
    \    {\n            ByteBuffer buffer = \n            ByteBuffer.wrap(line + \"\
    \ \\n\").getBytes(Charset.forName(\"UTF-8\")));\n            channel.write(buffer);\n\
    \        }\n    } catch (IOException ex)\n{\n        System.out.println(ex);\n\
    \    }\n}\n```\n\nFirst is created a list with the names of the 7 Danish kings\
    \ as used above and then a path to a file in my tmp directory is created. The\
    \ class Files has a method newByteChannel(), which creates a ByteChannel for a\
    \ file identified by a path. With this channel ready the method performs a loop\
    \ that iterates over all strings in the file. For each string (name) are added\
    \ a line break, and all are converted to a byte array after an UTF-8 encoding.\
    \ This array is fully encapsulated in a ByteBuffer that is sent out on the channel.\n\
    \nBelow is the equivalent method, which reads the file again:\n\n```java\nprivate\
    \ static void test33()\n{\n    Path path = Paths.get(System.getProperty(\"user.home\"\
    )).resolve(\"tmp/file6\");\n    try (ByteChannel channel = Files.newByteChannel(path,\
    \ StandardOpenOption.READ))\n    {\n        ByteBuffer buffer = ByteBuffer.allocate(30);\n\
    \        while (channel.read(buffer) > 0)\n        {\n            buffer.flip();\n\
    \            System.out.print(Charset.forName(\"UTF-8\").decode(buffer));\n  \
    \          buffer.clear();\n        }\n    }\nSystem.out.println();\ncatch (IOException\
    \ ex) {\n  System.out.println(ex);\n}\n}\n```\n\nThere is again created a ByteChannel\
    \ to the file, and then a ByteBuffer. The number 30 is arbitrary, but is, however,\
    \ selected so that the buffer is not large enough to contain the longest name.\
    \ More precisely, this means that the subsequent read on the channel reads the\
    \ 30 bytes at a time until there is fewer than 30 bytes. Every time the buffer\
    \ is full, or more exactly when the read() method is performed the program executes\
    \ a flip() and the byte content of the buffer is decoded to a String, which is\
    \ printed on the screen.\n\n![](img/5d98ad28901c31fd736abaabe8f09e19_125_0.png)\n\
    \n## 4 OPERATIONS ON SIMPLE DATA TYPES\n\nAny data element (simple variable or\
    \ object) uses space in the machine's memory, when the smallest addressable unit\
    \ in the machine's memory is a byte, uses all data elements without exception\
    \ a whole number of bytes. What it depends on the element and is determined by\
    \ the element's data type. A byte consists of 8 bits (that is 8 of the symbols\
    \ 0 and 1), and you can consider a byte as bit pattern consisting of 8 bits. Since\
    \ a bit can take two values, a byte can then represent different values. How these\
    \ values are interpreted depends entirely on the program and the data types, and\
    \ in many contexts it would be a number, while in other contexts would be a code\
    \ for a character.\n\nIn this chapter I will describe how simple data types are\
    \ represented in Java and in this context what operations are available to manipulate\
    \ individual bits. The chapter assumes knowledge of binary numbers, and also the\
    \ hexadecimal numbers, and so far you lack the appendix.\n\n### 4.1 INTEGERS\n\
    \nJava has already described four types of integers: byte, short, int and long,\
    \ they differ only with respect to what they fill in memory, which are respectively\
    \ 1, 2, 4 or 8 bytes. As an example an int uses 4 contiguous bytes. This means\
    \ that an int uses 32 bits and can represent 4294967296 different integers. 32\
    \ bits are interpreted as a binary number, where negative numbers are represented\
    \ by two's complement. This corresponds to:\n\na = -2147483648 (binary number\
    \ 10000000000000000000000000000000)\nb = 2147483647 (binary number 01111111111111111111111111111111)\n\
    \nAny integer type supports the binary operations:\n- arithmetic (+)\n- bitwise\
    \ AND (&)\n- bitwise XOR (^)\n- left shift (<<)\n- right shift (>>)\n- unsigned\
    \ right shift (>>>)\n\nThe representation of integers is simple, and it is easy\
    \ to test the above in Java. The program contains the following method to see\
    \ the binary representation:\n\n```java\npublic static String toBin(int t) {\n\
    \    StringBuilder builder = new StringBuilder();\n    for (int i = 0; i < 32;\
    \ i++)\n        builder.append((t & 0x80000000) == 0 ? '0' : '1');\n    return\
    \ builder.toString();\n}\n```\n\nNote that the class Integer has a method toBinaryString(),\
    \ which returns an int as a bit string, but the method above does not precede\
    \ by zeros. If you perform the following method:\n\n```java\nprivate static void\
    \ print(int t) {\n    System.out.println(toBin(t) + \" = \" + t);\n}\n```\n\n\
    you get the result:\n\n```java\nprivate static void test01() {\n    print(113);\n\
    \    print(-113);\n    print(0);\n    print(Integer.MAX_VALUE);\n    print(Integer.MIN_VALUE);\n\
    }\n```\n\n00000000000000000000011100010001 = 113\n11111111111111111111100011111111\
    \ = -113\n00000000000000000000000000000000 = 0\n11111111111111111111111111111111\
    \ = -1\n01111111111111111111111111111111 = 2147483647\n10000000000000000000000000000000\
    \ = -2147483648\n```\n\ncorresponding to what is said above. Likewise the method:\n\
    \n```java\nprivate static void test02() {\n    int a = 0xF0F0F0F0;\n    int b\
    \ = 0x3C3C3C3C;\n    System.out.println(toBin(a));\n}\n```\n\n```java\nSystem.out.println(toBin(b));\n\
    System.out.println(toBin(a | b));\nSystem.out.println(toBin(a & b));\nSystem.out.println(toBin(a\
    \ ^ b));\nSystem.out.println(toBin(-a));\nSystem.out.println(toBin(a << 3));\n\
    System.out.println(toBin(a >> 3));\nSystem.out.println(toBin(a >>> 3));\n}\n```\n\
    \nresults in the following:\n\n11110000111100001111000011110000\n00111100111100001111000011110000\n\
    11111110111111101111111011111110\n00110000001100000011000000110000\n11001100110011001100110011001100\n"
  mdcn: "\n\n## JAVA 5：文件与 IO\n\n```java\nSystem.out.println(ex);\n}\n```\n\n这些示例中，重要的是你如何使用\
    \ `Files` 类同时创建 `BufferedWriter` 和 `BufferedReader`。\n\n接下来的两个示例类似，它们展示了 `Files`\
    \ 类如何创建 `BufferedOutputStream` 和 `BufferedInputStream`：\n\n```java\nprivate static\
    \ void test30() {\n  byte data[] = new byte[100];\n  Path path = Paths.getProperty(\"\
    user.home\").resolve(\"tmp/file5\");\n  try (OutputStream out = new BufferedOutputStream(Files.newOutputStream(path,\
    \ StandardOpenOption.APPEND))) {\n    rand.nextBytes(data);\n    for (int i =\
    \ 0; i < 100; ++i) out.write(data);\n  } catch (IOException ex) {\n    System.out.println(ex);\n\
    \  }\n}\n```\n\n```java\nprivate static void test31() {\n  Path path = Paths.getProperty(\"\
    user.home\").resolve(\"tmp/file5\");\n  long sum = 0;\n  try (InputStream in =\
    \ new BufferedInputStream(Files.newInputStream(path))) {\n    for (int t = in.read();\
    \ t != -1; t = in.read()) sum += t;\n  } catch (IOException ex) {\n    System.out.println(ex);\n\
    \  }\n  System.out.println(sum);\n}\n```\n\n第一个方法向 `BufferedOutputStream` 写入 10000\
    \ 个字节，在这里你应该特别注意它是以追加模式打开的。该方法写入了 100 次，每次写入一个包含 100 个随机字节的数组。最后一个方法通过 `BufferedInputStream`\
    \ 再次读取文件并确定总和。\n\n## JAVA 5：文件与 JAVA IO\n\n最后一个示例将向你展示如何将字符串写入文件，但这次使用了通道（channel）：\n\
    \n```java\nprivate static void test32()\n{\n    List<String> lines = Arrays.asList(\"\
    Gorn Gamle\", \"Harald Blåtand\",\n\"Svend Tveskåg\", \"Harald d. 2.\", \"Knud\
    \ den Store\", \"Hardeknud\",\n\"Magnus den Gode\");\n    Path path = Paths.get(System.getProperty(\"\
    user.home\")).resolve(\"tmp/file6\");\n    try (ByteChannel channel = Files.newByteChannel(path,\
    \ StandardOpenOption.CREATE))\n    {\n        for (String line : lines)\n    \
    \    {\n            ByteBuffer buffer = \n            ByteBuffer.wrap((line +\
    \ \" \\n\").getBytes(Charset.forName(\"UTF-8\")));\n            channel.write(buffer);\n\
    \        }\n    } catch (IOException ex)\n{\n        System.out.println(ex);\n\
    \    }\n}\n```\n\n首先创建一个包含上述所示的 7 位丹麦国王名字的列表，然后创建一个指向我 tmp 目录某个文件的路径。`Files` 类有一个\
    \ `newByteChannel()` 方法，它可以为由路径标识的文件创建一个 `ByteChannel`。通道准备好后，该方法执行一个循环，遍历文件中的所有字符串。对于每个字符串（名字），都会添加一个换行符，并在经过\
    \ UTF-8 编码后将所有转换为字节数组。该数组被完全封装在 `ByteBuffer` 中并发送到通道上。\n\n下面是等效的方法，它再次读取了文件：\n\
    \n```java\nprivate static void test33()\n{\n    Path path = Paths.get(System.getProperty(\"\
    user.home\")).resolve(\"tmp/file6\");\n    try (ByteChannel channel = Files.newByteChannel(path,\
    \ StandardOpenOption.READ))\n    {\n        ByteBuffer buffer = ByteBuffer.allocate(30);\n\
    \        while (channel.read(buffer) > 0)\n        {\n            buffer.flip();\n\
    \            System.out.print(Charset.forName(\"UTF-8\").decode(buffer));\n  \
    \          buffer.clear();\n        }\n    }\nSystem.out.println();\ncatch (IOException\
    \ ex) {\n  System.out.println(ex);\n}\n}\n```\n\n再次创建了一个指向文件的 `ByteChannel`，然后是一个\
    \ `ByteBuffer`。数字 30 是任意的，但选择它的目的是为了让缓冲区足够大以容纳最长的名字。更准确地说，这意味着通道上的后续读取每次读取 30\
    \ 个字节，直到字节少于 30 个。每当缓冲区满时，或者更准确地说当执行 `read()` 方法时，程序会执行 `flip()`，并将缓冲区的字节内容解码为字符串打印在屏幕上。\n\
    \n![](img/5d98ad28901c31fd736abaabe8f09e19_125_0.png)\n\n## 4 简单数据类型的四种操作\n\n\
    任何数据元素（简单变量或对象）都会占用机器内存空间，当机器内存中最小的可寻址单位是字节时，所有数据元素无一例外地使用整数个字节。这取决于元素本身并由元素的数据类型决定。一个字节由\
    \ 8 位组成（即 8 个 0 和 1 的符号），你可以将一个字节视为由 8 位组成的位模式。由于一个位可以取两个值，因此一个字节可以表示不同的值。这些值如何被解释完全取决于程序和数据类型，在许多语文中它是一个数字，而在其他语文中它是一个字符的编码。\n\
    \n在本章中，我将描述简单数据类型在 Java 中如何表示，以及在此背景下可以使用哪些操作处理单个位。本章假设你了解二进制数和十六进制数，目前你缺少附录内容。\n\
    \n### 4.1 整数\n\nJava 已经描述了四种整数类型：`byte`、`short`、`int` 和 `long`，它们仅在内存中所填充的内容有所不同，分别为\
    \ 1、2、4 或 8 字节。例如，一个 `int` 使用 4 个连续的字节。这意味着一个 `int` 使用 32 位，并可以表示 4294967296 个不同的整数。32\
    \ 位被解释为二进制数，其中负数用补码表示。这对应于：\n\na = -2147483648 (二进制数 10000000000000000000000000000000)\n\
    b = 2147483647 (二进制数 01111111111111111111111111111111)\n\n任何整数类型都支持二进制操作：\n- 算术\
    \ (+)\n- 按位与 (&)\n- 按位异或 (^)\n- 左移 (<<)\n- 右移 (>>)\n\n整数的二进制表示是简单的，在 Java 中也很容易测试：\n\
    \n```java\npublic static String toBin(int t) {\n    StringBuilder builder = new\
    \ StringBuilder();\n    for (int i = 31; i >= 0; i--)\n        builder.append(((t\
    \ >> i) & 1) == 0 ? '0' : '1');\n    return builder.toString();\n}\n```\n\n注意\
    \ `Integer` 类有一个 `toBinaryString()` 方法，可以返回二进制字符串，但上面的方法没有。执行：\n\n```java\nprivate\
    \ static void print(int t) {\n    System.out.println(toBin(t) + \" = \" + t);\n\
    }\n```\n\n你会得到结果：\n\n```java\nprivate static void test01() {\n    print(113);\n\
    \    print(-113);\n    print(0);\n    print(Integer.MAX_VALUE);\n    print(Integer.MIN_VALUE);\n\
    }\n```\n\n00000000000000000000011100010001 = 113\n11111111111111111111110011101111\
    \ = -113\n00000000000000000000000000000000 = 0\n01111111111111111111111111111111\
    \ = 2147483647\n10000000000000000000000000000000 = -2147483648\n\n对应上述内容。同样地方法：\n\
    \n```java\nprivate static void test02() {\n    int a = 0xF0F0F0F0;\n    int b\
    \ = 0x3C3C3C3C;\n    System.out.println(toBin(a));\n}\n```\n\n结果如下：\n\n11110000111100001111000011110000\n\
    00111100111100001111000011110000\n\n"
