- md: "\nThe classes for files are included in the package java.io, but since the\
    \ package was developed, Java has expanded with a new package called java.nio\
    \ – primarily for new needs and to support the facilities in modern operating\
    \ systems. Both packages are used and will probably be that for many years to\
    \ come, so the book covers in following both these two APIs.\n\nThe book consists\
    \ basically of three parts, wherein the first two deals with IO and that the third\
    \ part deals with the binary representation of data. If you do not have knowledge\
    \ of binary and hexadecimal numbers, it might be a good idea first to read the\
    \ book's appendix.\n\n# JAVA 5: FILES AND JAVA IO\n\n## JAVA.IO\n\nThis chapter\
    \ covers streams, which is a collection of classes that provides the basic input\
    \ and output operations in Java. A stream is a sequence of data that can be sent\
    \ over a communication channel between a source and a destination. Both the source\
    \ and destination may be several things as a program, file, one or another external\
    \ device such as a printer, network socket or an array in the computer's memory.\
    \ Java provides a large number of classes available, all of which are intended\
    \ to encapsulate the many details related to sending data over a stream, and it\
    \ applies to both stream of bytes, other primitive types and objects of all kinds.\
    \ This chapter shows the use of many of the classes from java.io, and the classes\
    \ are presented primarily through small test methods in the project FileProgram.\n\
    \nAs mentioned above, the concept of a stream has many applications, but this\
    \ book focuses primarily on streams between a file and a program.\n\n## 2.1 FILES\n\
    \nYou can think of a file as an infinite array with elements of the type byte.\n\
    \n![](img/5d98ad28901c31fd736abaabe8f09e19_9_0.png)\n\nwhere a file has a so-called\
    \ file pointer represented by the arrow. The file pointer indicates where the\
    \ next file operation starts, and the file pointer (arrow) is moved forward corresponding\
    \ to the number of bytes read or written. Files are stored on the machine's disk,\
    \ and the operating system organizes the files in the form of file system that\
    \ keeps track of directories and files. Each file has a unique name consisting\
    \ of the name of the directory that contains the file, and the file name must\
    \ be unique within the directory. Java has a class called File, which represents\
    \ a file by its name and provides a number of methods available that can be used\
    \ to manipulate the file.\n\n## FILE INFO\n\nThe following method prints information\
    \ about a file:\n\n```java\nprivate static void fileInfo(String filename) throws\
    \ IOException {\n    File file = new File(filename);\n    System.out.println(\"\
    Absolute path \" + file.getAbsolutePath());\n}\n```\n\n```\nSystem.out.println(\"\
    Canonical path = \" + file.getCanonicalPath());\nSystem.out.println(\"Name = \"\
    \ + file.getName());\nSystem.out.println(\"Parent = \" + file.getParent());\n\
    System.out.println(\"Path = \" + file.getPath());\nSystem.out.println(\"Is absolute\
    \ = \" + file.isAbsolute());\nif (file.exists()) {\n    System.out.println(\"\
    The file object exists\");\n    if (file.isDirectory()) {\n        System.out.println(\"\
