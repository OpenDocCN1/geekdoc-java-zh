    为了确定所有小于或等于 N 的质数，首先定义一个包含 N+1 个元素的位图：\n\n![](img/5d98ad28901c31fd736abaabe8f09e19_142_0.png)\n\
    \n起初，所有位置均为 0。然后你开始在位置 0 和位置 1 处打标记（1 位），以及所有索引能被 2 整除的位置（但不包括 2 本身）打标记：\n\n![](img/5d98ad28901c31fd736abaabe8f09e19_142_1.png)\n\
