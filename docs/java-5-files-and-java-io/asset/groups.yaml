  mdcn: "\n\n处理文件的类包含在 `java.io` 包中，但自该包开发以来，Java 扩展了一个名为 `java.nio` 的新包——主要为了满足新需求并支持现代操作系统的功能。这两个包都会被使用，并且可能在未来的许多年里都是如此，因此本书在后续将同时涵盖这两个\
    \ API。\n\n本书基本上由三部分组成，前两部分处理 IO，第三部分处理数据的二进制表示。如果你没有二进制和十六进制数的知识，先阅读书的附录可能是一个好主意。\n\
    \n# JAVA 5：文件与 JAVA IO\n\n## JAVA.IO\n\n本章涵盖了流（streams），它是一系列提供了 Java 中基本输入输出操作的类。流是可以在源和目的地之间的通信通道上发送的数据序列。源和目的地可以是多种形式：程序、文件、某种或另一种外部设备（如打印机、网络套接字或计算机内存中的数组）。Java\
    \ 提供了大量可用类，这些类都旨在封装与通过流发送数据相关的许多细节，并且适用于字节流、其他原始类型以及各种对象。本章展示了 `java.io` 中许多类的用法，这些类主要通过项目\
    \ `FileProgram` 中的小型测试方法呈现。\n\n如上所述，流的概念有许多应用，但本书主要关注文件和程序之间的流。\n\n## 2.1 文件\n\
    \n你可以将文件看作是一个元素类型为 `byte` 的无限数组。\n\n![](img/5d98ad28901c31fd736abaabe8f09e19_9_0.png)\n\
    \n其中文件有一个由箭头表示的所谓“文件指针”。文件指针指示下一个文件操作的开始位置，文件指针（箭头）会根据读取或写入的字节数向前移动。文件存储在机器的磁盘上，操作系统以文件系统的形式组织文件，跟踪目录和文件。每个文件都有一个唯一的名称，由包含该文件的目录名和文件名组成，且文件名在目录下必须是唯一的。Java\
    \ 有一个名为 `File` 的类，它通过名称表示文件，并提供了许多可用的方法来操作文件。\n\n## 文件信息\n\n以下方法打印关于文件文件的信息：\n\
    \n```java\nprivate static void fileInfo(String filename) throws IOException {\n\
    \    File file = new File(filename);\n    System.out.println(\"Absolute path \"\
    \ + file.getAbsolutePath());\n}\n```\n\n```java\nSystem.out.println(\"Canonical\
    \ path = \" + file.getCanonicalPath());\nSystem.out.println(\"Name = \" + file.getName());\n\
    System.out.println(\"Parent = \" + file.getParent());\nSystem.out.println(\"Path\
    \ = \" + file.getPath());\nSystem.out.println(\"Is absolute = \" + file.isAbsolute());\n\
    if (file.exists()) {\n    System.out.println(\"The file object exists\");\n  \
    \  if (file.isDirectory()) {\n        System.out.println(\"The file object is\
    \ a folder\");\n    } else {\n        System.out.println(\"The file object is\
    \ a file\");\n    }\n}\nSystem.out.println(file.length());\n\n该方法的参数是文件名。注意该方法可能会抛出\
    \ `IOException`，通常发生在你尝试对文件执行操作时。在这种情况下，只有一种方法会抛出 `IOException`。该方法创建了一个表示命名文件的\
    \ `File` 对象。注意 `File` 对象既可以表示目录也可以表示文件，并且该文件（或目录）存在是合法的。这些条件在对象使用时非常重要。前两个语句打印绝对路径和规范路径。在大多数情况下它们是相同的，但规范路径可能与绝对路径不同（见程序测试）。接下来的三个语句分别打印文件名、父目录和路径。这里是文件所属目录的文件名，父目录是该文件所在的目录名。Path\
    \ 用于创建 `File` 对象，在这种情况下是文件名参数的值。最后三个语句测试它是否为绝对路径，以及该命名的目录是否存在。在这种情况下测试它是目录还是文件。最后，语句打印以字节为单位的文件大小。\n\
    \n以下测试方法使用 `inputFile()` 方法打印关于各种 `File` 对象的信息：\n\n```java\nprivate static void\
    \ test01() {\n    System.out.println(\"Working Directory = \" + System.getProperty(\"\
    user.dir\"));\n    try {\n        FileInfo info = new File(\"/home/pa/doc\");\n\
    \        info.inputFile(\"/home/pa/doc/Swing\");\n        fileInfo(\"/home/pa/doc/pa/xpq/1234\"\
    );\n        fileInfo(\"..\");\n    } catch (IOException ex) {\n        System.out.println(ex);\n\
    \    }\n}\n```\n\n注意第一个语句打印了当前目录的名称。邀请你测试示例并研究结果。\n\n## 驱动器信息\n\n以下方法以 `File`\
    \ 对象作为参数，打印关于该磁盘分区的信息，包含了：\n\n```java\nprivate static void print(File root) {\n\
    \    System.out.println(\"Partition: \" + root);\n}\n```\n\n![](img/5d98ad28901c31fd736abaabe8f09e19_11_0.png)\n\
    \n![](img/5d98ad28901c31fd736abaabe8f09e19_11_1.png)\n\n```java\nSystem.out.println(\"\
    Free space = \" + root.getFreeSpace());\nSystem.out.println(\"Usable space = \"\
    \ + root.getUsableSpace());\nSystem.out.println(\"Total space = \" + root.getTotalSpace());\n\
    ```\n\n所有大小都以字节指定。`getFreeSpace()` 和 `getUsableSpace()` 通常显示相同的值，是因为后者更好的估计，因为它考虑了与当前操作系统文件系统相关的开销。该方法在以下测试方法中使用：\n\
    \n```java\nprivate static void test02()\n{\n    print(new File(\"/\"));\n    print(new\
    \ File(\"/home\"));\n    print(new File(\"/root/media/pa/HD-NFPU3\"));\n}\n```\n\
    \n这为我的机器打印根分区、home 分区以及外部硬盘的信息。\n\n## 文件大小与过滤器\n\n以下方法有一个名称参数并创建一个相应的 `File` 对象。如果该对象表示一个文件，该方法将打印名称和大小，其中大小由\
    \ `getSize()` 方法递归确定，该方法确定以该对象为根的树的大小。注意 `size` 是一个静态变量，在程序开始时定义。\n\n```java\n\
    private static void fileSize(String filename, FileFilter filter)\n{\n    File\
    \ file = new File(filename);\n    if (file.exists())\n{\n        System.out.println(file.getAbsolutePath());\n\
    \        size = 0;\n        getSize(file, filter);\n        System.out.println(size);\n\
    \    }\n    else System.out.println(\"Filen ikke ikke\");\n}\n```\n\n该方法有一个类型为\
    \ `Filter` 的参数。它是一个定义了一个方法的接口：\n\n```java\npublic boolean accept(File pathname);\n\
    ```\n\n该方法应该测试由参数标识的文件是否符合某些标准。`FileFilter` 对象与由名称表示的 `File` 对象一起传递给 `getSize()`\
    \ 方法：\n\n```java\nprivate static void getSize(File file, FileFilter filter)\n\
    {\n  if (file.isDirectory()) {\n    File[] files = filter == null ? file.listFiles()\
    \ : file.listFiles(filter);\n    for (File f : files) getSize(f, filter);\n  }\
    \ else if (filter == null || filter.accept(file)) size += file.length();\n}\n\
    ```\n\n该方法测试第一个参数是否为目录。在这种情况下，方法 `listFiles()` 返回该目录下的文件数组。该方法存在多个重载，其中一个带有过滤器参数的方法，它只返回符合过滤器的文件。当数组可用（可能为空）时，对数组中的所有文件递归调用\
    \ `getSize()`。如果方法被调用且第一个参数不是目录，则没有其他操作，静态变量 `size` 会加上文件的大小——如果需要根据过滤器包含的话。\n\
    \n下面是一个测试方法，确定部分当前目录和部分用户主目录的文件大小。在两种情况下，都有带过滤器和不带过滤器的测试，过滤器接受目录或文件名以 `.java`\
    \ 结尾的文件。\n\n```java\nprivate static void test03()\n{\n  FileFilter filter = new\
    \ FileFilter() {\n    public boolean accept(File f) {\n      return f.isDirectory()\
    \ || (f.isFile() && f.getName().endsWith(\".java\"));\n    }\n  };\n  getSize(\"\
    .\", null);\n  getSize(\".\", filter);\n  getSize(System.getProperty(\"user.home\"\
    ), null);\n  getSize(System.getProperty(\"user.home\"), filter);\n}\n```\n\n你不需要知道过滤器是如何基于匿名类定义的。\n\
    \n"
