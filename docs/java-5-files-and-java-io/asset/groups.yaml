    \n# JAVA 5：简单数据类型上的文件与 Java IO 操作\n\n总结一下。下一次从第一个未标记的位置开始（即位置 7），它是一个质数，否则它会在之前的循环中被标记。当你遍历完所有位置后，所有索引为非质数的位置都经过了检查。\n\
