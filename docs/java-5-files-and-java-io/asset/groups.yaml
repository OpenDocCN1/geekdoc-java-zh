  mdcn: "\n\n## JAVA 5: 文件与 JAVA IO\n\n在执行完四个语句后，文件会被关闭。这非常重要，因为写入语句是写入内存缓冲区的。只有当缓冲区满或文件关闭时，书中的内容才会被物理地写入文件。关闭文件的另一个原因是你释放了分配给文件的资源。使用\
    \ `close()` 关闭文件是非常重要的，为了确保该语句被执行，将其放置在 `finally` 块中，无论是否发生异常，`finally` 块都会执行。\n\
    \n上述内容清晰地定义了处理文件的模式：\n\n- 1. 打开文件\n- 2. 执行所需的文件操作\n- 3. 关闭文件\n\n在文件中写入四个数字后，再次打开它以读取内容：\n\
    \n```java\ntry (RandomAccessFile file = new RandomAccessFile(\"tal.dat\", \"r\"\
