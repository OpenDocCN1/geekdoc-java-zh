    # PROBLEM 4


    As an example of using a bitmap, you must write a program that uses Eratosthenes’s
    algorithm to determine the primes. The idea is the following:


    In order to determine all prime numbers that are less than or equal to N, start
    by defining a bitmap with N+1 elements:


    ![](img/5d98ad28901c31fd736abaabe8f09e19_142_0.png)


    In the beginning all positions are 0. You then starts with putting a mark (a 1
    bit) in position 0 and position 1 as well as all the positions where the index
    is divisible by 2 – though not 2:


    ![](img/5d98ad28901c31fd736abaabe8f09e19_142_1.png)


    In this run has been set a mark in all the even numbers greater than 2, as they
    are primes. You then repeats it, but this time you put a mark on the positions
    where the index is divisible by 3 – though not position 3:


    ![](img/5d98ad28901c31fd736abaabe8f09e19_142_2.png)


    All positions where the index has 3 as the prime factor is now marked. Next time
    you repeat it all with the number 5 (the first position after 3 that is 0). All
    positions where the index has 5 as the prime factor is marked:


    ![](img/5d98ad28901c31fd736abaabe8f09e19_142_3.png)


