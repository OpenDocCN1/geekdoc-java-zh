    If in a certain position you OR a 0 to the first bit pattern the result in position
    will be unchanged and the same as the value of the bit pattern – to OR a 0 do
    not change anything. If in a certain position you OR a 1 to the first bit pattern
    the result in position will will be 1 regardless of the value of the first bit
    pattern may have. The result of the foregoing is, therefore,


    ```

    0011101111110001 OR 0000000000001000 = 0011101111101001

    ```


    The example can immediately be generalized to other word lengths and thus shows
    how to set a particular bit of 1.


