  md: "JAVA 5: FILES AND JAVA IO\n\n# 2.5 CHARACTER STREAMS\n\nThere is also a family\
    \ of classes that are used to stream a sequence of characters and thus a text.\
    \ In fact, they are far more often needed than directly stream a sequence of bytes\
    \ (hence the raw data). In Java it is text or characters represented as 2 bytes\
    \ unicodes, while they are streamed to a file, a character file one or a few bytes\
    \ is encoded as UTF8. All the regular letters occupies only one byte, while others\
    \ that are not so frequently used characters, including national characters occupies\
    \ 2 or more bytes. The goal is to reduce the number of bytes sent over a stream.\
    \ Stream classes to handle the necessary conversion that happens transparently\
    \ without the programmer’s involvement – at least long as the program should not\
    \ be used anywhere in this. Strictly speaking, not the same encoding is used everywhere\
    \ but the entire Western world uses the same encoding. If you need internationalization,\
    \ it is possible to specify the encoding to be used, but otherwise stream uses\
    \ an encoding based on the machine’s local setting. Below is an example that writes\
    \ test to a file and read the text again:\n\n```\nprivate static void test15()\
    \ {\n    try (FileWriter writer = new FileWriter(\"names\")) {\n        writer.write(\"\
    Gorm Gamle\\n\");\n        writer.write(\"Harald Blåtand\\n\");\n        writer.write(\"\
    Svend Tveskåg\\n\");\n    } catch (IOException ex) {\n        System.out.println(ex);\n\
    \    }\n    char[] buffer = new char[20];\n    try (FileReader reader = new FileReader(\"\
    names\")) {\n        for (int count = reader.read(buffer, 0, buffer.length); count\
    \ != -1; {\n            for (int i = 0; i < count; ++i) System.out.print(buffer[i]);\n\
    \        }\n    } catch (IOException ex) {\n        System.out.println(ex);\n\
    \    }\n}\n```\n\nDownload free eBooks at bookoon.com"
