    # PROBLEM 3


    A BitSet is an example of a bitmap, and in this problem you should write a class
    Bitmap that represents a bitmap and is an alternative to the Java''s BitSet. A
    bitmap is, in principle, a sequence of bits:


    ```

    00101110101010101010111010101001111110101010111100001

    ```


    where there is 64 bits. A bitmap can, for example, be implemented as eight bytes,
    ints or long. A bitmap must, however, be more general and should be able to of
    any size, and therefore it should be implemented as an array of one of the simple
    types to integers. Generally is simple to implement a bitmap, but there are several
    things you must consider and make a decision. As important examples I will mention:


    +   - which type to be used to the internal array for the individual bits

    - must the bitmap have fixed size

    - which sizes should be possible for a bitmap and it should be a multium of the
    size of the array''s elements

    - which operations must a bitmap make available

    - when are two bitmaps compatible


    As regards of the first, you can choose between byte, short, int and long. In
    the case of a large bitmap, you should select a type with many bits as it means
    a smaller array, and thus shorter loops in the methods, providing increased efficiency.
    In the case of small bitmaps, a 64 bits element can mean unnecessary space consumption,
    but in most cases where you need a bitmap, it will be bitmaps with many bits,
    and it indicates to choose a type with room for many bits. Below you select the
    type long.


    As for the size, it is the application that determines what is the best choice.
    In this task, the size must be fixed, where you have to specify the size as a
    parameter to the constructor. It must be able to have any logical size – for example
    70 bits. If it is implemented as an array of the type long it will occupies 128
    bits, but there should be only access (reference) to the first 70.


