    # UNICODE


    The encoding used today, is called Unicode, and the purpose is to replace the
    many different code pages known from ASCII, with a single code page, which contains
    all possible characters in all languages. The price for it is obviously a very
    large table (just think of all non-European languages, chemical symbols, mathematical
    symbols, etc.), and it is also the system’s disadvantage, because it can be difficult
    to define a table, which all agree on, or that it could be “expensive” to use
    such a large table, if you really need a small subset.


    There is defined different systems:


    +   - UTF (Unicode Transfer Format)

    - USC (Universal Character Set)


    and each of these systems have multiple encodings, and I will mention the following:


    +   - UTF-8, is an 8-bit variable length encoding, which is basically a kind of
    extension of the ASCII system, and in particular is widely used on the Internet

    - UTF-16 is a 16-bit variable length encoding used by Windows

    - UTF-32, is a 32-bit fixed-length encoding, which is used to some extent in the
    Unix and Linux (the same as the UCS-4)


    Mention also UCS-2, which is a fixed-length 16-bit encoding, that only support
    a subset of all Uncodes.


    That an encoding is of fixed length means that all characters take up the same.
    In UTF-32 all the characters so fills 4 bytes. An encoding of variable length,
    the characters does not fill the same, and basically it is the principle that
    characters often have codes with a smaller size, while characters used take up
    more space. It is a choice. Fixed length encoding is the simplest but pay by space
    consumption, while a variable length encoding minimizing the required to space,
    and pay with a more complex encoding, which places extra demands on the software.


