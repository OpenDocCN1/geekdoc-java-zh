  md: '# RIGHT SHIFT


    A right shift is an operation that shifts all the bits in a word one position
    to the right and inserts a 0 in first position, for example.


    ```

    0011101111100001

    ```


    and after a right shift the value is


    ```

    0011101111110000

    ```


    If the bit pattern that is shifted, represents a number, it means that the number
    is divided by 2. If the number is shifted n positions, it corresponds to, that
    the number is divided by 2^n.


    There is a variant of a right shift, known as an arithmetic right shift. The difference
    is that the bit that is inserted in first position is the sign bit. That is, if
    the first bit is 0, a 0 bit is inserted, and if the first bit is 1, a 1 bit is
    inserted. If, for example you have the bit pattern


    ```

    00111011111100001

    ```


    is the result of a right arithmetic shift


    ```

    0011101111110000

    ```


    an such the same as a right shift. If, however, the pattern


    ```

    10111011111100001

    ```


    is the result of a right arithmetic shift


    ```

    11011101111110000

    ```'
