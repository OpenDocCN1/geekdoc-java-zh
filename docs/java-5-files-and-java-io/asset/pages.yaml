    INTRODUCTION


    # 1 INTRODUCTION


    Many applications need to store data persistently and later read them again. As
    an example can think of a word processor, where the user is editing a document.
    Here, the program could save the document for later load it again, so you can
    edit it further. As another example, can think of software in a terminal at the
    supermarket that must be able to read product prices from a product file as items
    are scanned, and then the items file is updated with the items sold and how many.
    Such data is called persistent, because it is data that are retained after the
    program is completed and the machine is turned off.


    Applications can store data persistent in several ways, and examples are


    +   - data can be saved in ordinary "flat" files

    - objects can be serialized to a file

    - data can be saved in databases

    - data can be saved as XML documents

    - data can be saved as json documents


    In this note I will only look at ordinary files, including serialization of objects.
    In fact, I already used several times in the previous books, but the following
    is a more detailed review and a description of many classes associated with the
    IO.


    Previously, the use of ordinary files to save data, were very common, and although
    it no longer has the same interest, there are still many situations where there
    is a need to store data in or read from ordinary files. On the whole, there are
    many examples where it is interesting to be able to manipulate the file system
    from an application, and Java has an extensive API with classes for the treatment
    of files. Object serialization is a matter of storing data in files, but in such
    a way that you can save an arbitrary object of any depth in a file — and load
    the object again. For many simple applications are object serialization and deserialization
    interesting, and in addition, serialization is used to send objects through a
    network.


    A program with many transactions, and it is a program which very often must save
    data and read data from an external media will in practice always use a database.
    A database is maintained by a software package which include a daemon, that constantly
    waiting for the other applications to enter a request for specific data items
    or to update the database. Use of databases from a Java program is the theme for
    the next book.


