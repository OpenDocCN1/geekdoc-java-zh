  md: '# JAVA 5: FILES AND JAVA IO


    The method is in the same principle as test11(), but the two Channel objects are
    created in a different way. The class FileInputStream have a method getChannel(),
    which returns a FileChannel. It is a read-only channel. Likewise, the FileOutputStream
    has a method getChannel(), which returns a file channel that is writable.


    Similarly, the RandomAccessFile has a method getChannel(), which returns a FileChannel,
    that is a readwrite buffer. The class FileChannel has many methods, and I will
    mention the most important:


    +   - void force(boolean meta) that updates are physically written to the file.
    The parameter specifies where the file metadata should also be written.

    - long position() that returns the position of the physical pointer.

    - FileChannel.position(long newPosition) that sets the position of the physical
    pointer. With that method you can define where to read or write in the file.

    - int read(ByteBuffer buffer) that reads bytes into file and returns the number
    of bytes as read. The maximum number of bytes is determined by the capacity of
    the buffer.

    - int read(ByteBuffer buffer, long position) which also reads bytes to buffer,
    but position tells where in the file to start (the position of the file pointer).

    - long size() that returns the size of the file.

    - int write(ByteBuffer buffer) that writes the content of the buffer to the file
    starting from the current position. The method returns the number of bytes written
    to the file.

    - int write(ByteBuffer buffer, long position) which also writes bytes to the file,
    but position tells where in the file to start (the position of the file pointer).


    As an example, it is shown that what method reads to and from a RandomAccessFile:


    ```

    public static void test14() {

    FileChannel fc = (new RandomAccessFile("numbers", "rw")).getChannel();

    System.out.println("Position = " + fc.position() + " ", size = " + fc.size()");

    ByteBuffer buffer = ByteBuffer.allocateDirect(2048);

    buffer.putInt(23);

    buffer.putDouble(Math.PI);

    buffer.putInt(29);

    buffer.putDouble(Math.E);

    buffer.flip();

    fc.write(buffer);

    fc.force(false);

    System.out.println("Position = " + fc.position() + " ", size = " + fc.size());());

    ```'
