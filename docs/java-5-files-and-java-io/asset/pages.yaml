    Buffers created with allocate() and wrap() have a backing array, and you can access
    this array with the method array().


    You can also create a-view buffer that is a buffer that encapsulates a second
    buffer. The two buffers have the same data and have the same capacity, but each
    have their limit, position and, a view is simply a matter of being to manipulate
    the same data (the same buffer) in several views. Consider the following method:


    ```

    private static void test03() {

    byte[] bytes = { 0x02, 0x03, 0x05, 0x07, 0x0b, 0x0d, 0x11, 0x13 };

    ByteBuffer buffer1 = ByteBuffer.wrap(bytes);

    ByteBuffer buffer2 = buffer1.duplicate();

    IntBuffer buffer3 = buffer1.asIntBuffer();

    buffer1.position(4);

    buffer1.limit(6);

    print(buffer1);

    print(buffer2);

    print(buffer3);

    }

    ```


    The method defines a byte array with 8 elements to create a ByteBuffer named buffer1.
    For this object we use the method duplicate() to create a view buffer named buffer2.
    Next is created another view buffer named buffer3, but this time with the method
    asIntBuffer(). This buffer allows to manipulate the original buffer as if it was
    an IntBuffer. As the next step the position and limit for buffer1 are set, after
    which the buffer is printed:


    ```

    Capaciteter: 8

    Limit: 6

    Position: 4

    Remaining: 2

