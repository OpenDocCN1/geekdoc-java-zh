  md: '# JAVA 5: FILES AND IO


    # FINAL EXAMPLE


    If you look at integers in the 10-number system, they can be written as $t = \sum_{i=0}^{n}
    a_i^i$ where the number has $n+1$ digits, and $a_0,a_1,\dots,a_n$ are all one
    of the symbols $0, 1, 2, \dots, 9$. As an example is


    ```

    $18207 = 7 * 10^0 + 0 * 10^1 + 2 * 10^2 + 8 * 10^3 + 1 * 10^4$

    ```


    That is $n=4$ and $a_0=7, a_1=0, a_2=2, a_3=8$ and $a_4=1$.


    Wee foresee that the decimal system is a positional system with base 10. This
    presentation of the numbers can be immediately generalized to other bases, and
    actually there is a number system for any natural number greater than 1. As an
    example the 60-number system mentioned above is a system where the base number
    is 60.


    # THE BINARY NUMBER SYSTEM


    The binary number system is simply a positional system with base 2. Thus, it is
    only necessary with two symbols, and used 0 and 1. A number could, for instance


    ```

    $t = \sum_{i=0}^{n} a_i 2^i$

    ```


