    real numbers using a finite number of bits, for example 32 or 64 which is the
    most common. In general, a real number is represented in the form


    | s | exponent | significand field with decimals |


    where the $s$ field always fills 1 bit and represents the sign, the exponent field
    is an exponent and the significand field is used for number''s digits.


