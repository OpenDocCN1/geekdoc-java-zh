    # MULTIPLE BUFFERS


    As shown in the example is a Channel a fundamental technique to stream data between
    two end points, for example can be files, and as an adapter between the channel
    and the program there a buffer. For many years one of the most important ways
    to increase your computer''s performance has been parallelism, a technique that
    particular operating system employs and also connects in IO. Other things for
    this reason Channel objects supports the use of multiple buffers where an input
    channel can fill several buffers, while an output channel can drain multiple buffers.
    The following will show their syntax:


    ```

    public static void test12()

    {

    try (

    ScatteringByteChannel src = (ScatteringByteChannel) Channels.newChannel(

    new FileInputStream(System.getProperty("user.home") + "/data/regions"));

    WritableByteChannel out = Channels.newChannel(System.out);

    GatheringByteChannel dst =

    (GatheringByteChannel) Channels.newChannel(new FileOutputStream("regions1"))


