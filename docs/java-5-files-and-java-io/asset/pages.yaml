  md: "# JAVA 5: FILES AND JAVA IO\n\n# LOCKING FILES\n\nAs the last related to channels\
    \ I will look at file locking. It is possible to put a lock on an entire file\
    \ or just on a part of a file, where the lock indicates, where in the file locking\
    \ begins of what area in the file to be locked. Locking occurs at process level\
    \ (and not threads), and I will in this context distinguish between a writer process\
    \ (a process that writes to the file) and a reader process (a process that simply\
    \ reads from the file). There are two kinds of locks. A writer process can set\
    \ an exclusive lock on a part of a file, and it can do so if there are no other\
    \ processes that put a lock that overlaps the part of the file to be locked. An\
    \ exclusive lock gives the writer full control over the locked part of the file\
    \ such that it can both read and write. A reader process can put a shared lock\
    \ on a part of the file, and it can do so if not another process has put an exclusive\
    \ lock that overlaps the part of the file to be locked. This means that the several\
    \ processes can set a shared lock for the same part of a file, and that more processes\
    \ can read the file.\n\nA lock has the type FileLock and the FileChannel class\
    \ has four methods to create a lock:\n\n+   1. lock()\n2. lock(long position,\
    \ long size, boolean shared)\n3. tryLock()\n4. tryLock(long position, long size,\
    \ boolean shared)\n\nThe first and the third create an exclusive lock on the entire\
    \ file, while the other two can specify the part of the file to be locked and\
    \ where the lock should be exclusive or shared. The difference is further that\
    \ the first two blocks, which is to say if they are unable to lock, they are set\
    \ in a queue until they get the lock, after the process is running automatically\
    \ when the lock is released. The last two methods are not blocking, but if they\
    \ cannot create the lock, they will return null, and that is up to the program\
    \ to decide what is happen next.\n\nThe class FileLock has a number of methods\
    \ that can return the information on the lock and its conditions, but most importantly\
    \ is the method release() which is used to release the lock. Universally, one\
    \ uses the following pattern to lock a file:\n\n```\nFileLock lock = fileChannel.lock();\n\
    try {\n  // interact with the file channel\n} catch (IOException ex) {\n}\n```"
