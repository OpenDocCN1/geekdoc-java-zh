  md: '# DIVISION


    Division is performed in the decimal number system by subtraction. The division
    algorithm can also be transferred to the binary number system, division can then
    be performed by the processor, which can add.


    It is not so easy to divide manually because you have to keep track of whether
    you have to borrow, but one example.


    Consider the 13556 and assume that it must be divided by 38, and the use of a
    word length of 16 bits. Note first that the result is an integer, and a simple
    calculation says that the result should be 3556:


    ```

    38 | 13556 | 356

    114..

    215.

    190.

    256

    228

    28

    ```


    The quotient is 356, and you get a remainder of 28, corresponding to the division
    does not go up.


    If you attempts to copy the usual division algorithm for decimal numbers to the
    binary system, the method is simpler, since each iteration results in a 0 time
    or 1 time.


    ```

    13556 = 1101001110100

    38 = 100110

    ```


    The division can now be done binary, as shown below. However, it is not quite
    easy to do manually.


    +   1. if the number you divide with is greater than the number above, it goes
    a 0 time, and the upper number goes unchanged on to the next step

    2. otherwise it goes a 1 time, and the number you divide by, must then be subtracted
    from the number above – here may be necessary to “borrow”, which you should keep
    track of

    3. the next bit is used (as the right bit)

    4. continuing until there are no more bits'
