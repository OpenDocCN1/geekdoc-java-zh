    The main problem is that the representation of a real number is not unique, but
    is always a rounded result. A representation of the integers defines a subset
    of the integers, such that all integers in a range is represented. Similarly it
    is, by the representation of the real numbers, that since there are only a limited
    number of bits available, we can represent only a subset of the real numbers,
    and thus the real numbers within a range, unlike the integers any interval of
    real numbers infinite many numbers, and any representation of real numbers by
    using a specific number of bits can only represent a subset of the range. Another
    problem is that a decimal such as 123.45 cannot be converted to a binary number
    with a finite number of bits:


    ```

    123.45 = 1111011.01110110011001100011......

    ```


    So there is no clear relation between decimal fractions and the binary numbers.


    # 32 BITS FLOATING POINTS


    I will start with a representation that takes up 4 bytes, i.e. 32 bits:


    +   - 1 bit to the sign

    - 8 bits for the ekponent

    - 23 bits for the significand


    The sign bit is 0 if the number is non-negative and 1 if the number is negative.
    If you look at the significand field it contains 23 bits:


    bbbbbbbbbbbbbbbbbbbbbbbbbb


    and it is interpreted as the binary number


    ```

    1.bbbbbbbbbbbbbbbbbbbbbbbbbb * 2^{n-127}

    ```


    where n is the value of the exponent field. 127 is called the bias value, which
    is binary 01111111. It is used to ensure that the content of the exponent field
    is not negative. It would as an example look at the number 123.45. Since it is
    a positive number is the sign bit 0. The number''s binary representation is


    ```

    123.45 = 1.111010110101100110011001100110010110011..* 2^6

    ```'
