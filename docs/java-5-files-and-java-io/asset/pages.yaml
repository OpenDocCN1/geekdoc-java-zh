  md: 'Below are some examples of positive integers written in the 2-number system,
    and how to convert those numbers to the 10-number system:


    1100000111110 = 2^{12} + 2^{11} + 2^{10} + 2^5 + 2^4 + 2^3 + 2^2 + 2^1

    =4096 + 2048 + 1024 + 32 + 16 + 8 + 4 + 2 = 7230


    1111111111 = 2^9 + 2^8 + 2^7 + 2^6 + 2^5 + 2^4 + 2^2 + 2^1 + 2^0 = 1023


    1100000001 = 512 + 256 + 128 + 1 = 897


    10000000000 = 2^{10} = 1024


    To determine the value of a binary number – or in other words to convert it to
    the decimal system – is simple and just a question to remember the powers of 2.
    The other way to convert a number in the 10-number system to a binary number requires
    a little more.


    Given a number, for example 2423, one can determine the largest power of 2 that
    is less than or equal to the number. It is 2^{11} = 2048 and


    2423 = 2^{11} + 375


    The largest power of 2 which is less than or equal to 375 is 2^8 = 256. That is


    2423 = 2^{11} + 375 = 2^{11} + 119


    The largest power of 2 which is less than or equal to 119 is 2^6 = 64 and


    2423 = 2^{11} + 375 = 2^{11} + 119 = 2^{11} + 2^8 + 2^6 + 55


    The largest power of 2 which is less than or equal to 55 is 2^5 = 32 and


    2423 = 2^{11} + 375 = 2^{11} + 119 = 2^{11} + 2^8 + 2^6 + 55 = 2^{11} + 2^8 +
    2^6 + 2^5 + 23


    To resume, and you will find:


    2423 = 2^{11} + 2^8 + 2^6 + 2^5 + 2^4 + 2^2 + 2^1 + 2^0 = 100101101111_2


    That is, to convert a decimal number to a binary number all the time you subtracts
    the maximum power of 2 and continue until you get 0 or 1.'
