  md: "JAVA 5: FILES AND IO\n\n# 2.4 OBJECT SERIALIZATION\n\nIn the examples in the\
    \ previous books I have used serialization of objects as an easy way to store\
    \ data in a file. I will now take a closer look at how it works. In principle\
    \ it is a matter of stream an object's bytes to a ByteArray, it is not necessarily\
    \ simple. If you consider a DataStream, it is simple for the primitive types,\
    \ you know how much a datalament fills, and exactly how many bytes to be written\
    \ or read. This is expressed by the classes DataOutputStream and DataAlInputStream\
    \ that have specific methods for each of the primitive types. When you look at\
    \ a String (which is an object) it is necessary with a little more since it is\
    \ necessary to save, how many bytes the string fills. it is necessary to read\
    \ the string again. The situation is even more complex if there is any object,\
    \ one does not know what such an object fills, and when it may be composed of\
    \ primitive types and objects that in turn can consist of primitive types and\
    \ objects, and it may repeat at an arbitrary depth.\n\nIn order to load an object\
    \ from a file, it is necessary, together with the object's data to store information\
    \ about the object's structure, and as an object, in principle, is a hierarchical\
    \ structure there must be stored information about the entire structure, that\
    \ the object can be restored when it is deserialized. It is not free, to serialize\
    \ and deserialize objects and is not necessarily effective and is done using a\
    \ technique called reflection, which are explained in a recent book. For this\
    \ reason, Java supports three types of serialization, which is illustrated in\
    \ the following examples.\n\nIn order an object can be serialized, it must implement\
    \ the interface Serializable. It is a simple interface without fields or methods.\
    \ If you try to serialize an object whose class is not Serializable you get an\
