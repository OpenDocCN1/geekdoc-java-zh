    This number is also written as $t = 1011001_2$ where the last number 2 tells that
    it is a number from the 2-number system. As you can see, the 2-number system is
    in principle completely equivalent to the 10-number system, where a number is
    presented as a sequence of symbols – 10 in 10-number system and 2 symbols in the
    2-number system – and the numbers value is determined by the symbols position.
    The difference is that a symbol is interpreted as a power of 2 instead of a power
    of 10, and is the binary system simpler, since a power of 2 is included in the
    number (the symbol is 1) or it is not (the system is 0).


    If you look at the above construction, it is easy to determine the value of a
    number in the 2-number system by simple calculation of powers of 2:


    ```

    $t = 1 * 2^7 + 0 * 2^6 + 1 * 2^5 + 1 * 2^4 + 0 * 2^3 + 0 * 2^2 + 0 * 2^1 + 1 *
    2^0$

    $= 128 + 32 + 16 + 1 = 177$

    ```


    To compare the systems, note the following:


    | $0_2 = 0_{10}$ | $100_2 = 4_{10}$ | $1000_2 = 8_{10}$ | $1100_2 = 12_{10}$ |

    | $1_2 = 1_{10}$ | $101_2 = 5_{10}$ | $1001_2 = 9_{10}$ | $1101_2 = 13_{10}$ |

    | $10_2 = 2_{10}$ | $110_2 = 6_{10}$ | $1010_2 = 10_{10}$ | $1110_2 = 14_{10}$
    |

    | $11_2 = 3_{10}$ | $111_2 = 7_{10}$ | $1011_2 = 11_{10}$ | $1111_2 = 15_{10}$
    |


