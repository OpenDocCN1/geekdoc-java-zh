    The example is suitable to demonstrate how to manipulate the content of a file,
    but the algorithm can not be used for practical encryption of files, since it
    is easy to determine the key. The procedure is as follows:


    A byte can have 256 different values and I starts with a byte array with 25 places
    and initializes the array with the values 0–255 (below written in hexadecimal):


