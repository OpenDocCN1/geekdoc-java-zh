  md: '# JAVA 5: FILES AND IO


    The class starts with defining some constants that specifies the name has of maximum
    of 50 characters, and the position has a maximum of 500 characters. Finally define
    a constant that indicates the size of a record. The sum of these three constants
    are multiplied by 2, because a character (char) occupies 2 bytes. The last number
    12 is the size of three integers. This means that a Person record always occupies
    1172 bytes in the file. You should note that in most cases it will be considerably
    more than necessary and that the file will contain some wasted space, but these
    are the conditions for a file of this type. This is the price that you must pay
    to be able to read a record stored at a specific location.


    The class has an instance variable of the type RandomAccessFile and the constructor
    opens the file for read and write. Note that the constructor raises an exception
    if the file can be opened. The class offers the following services:


    +   - length(), that returns the number of records in the file

    - select(), that returns the record with a certain record number

    - append(), that adds a new record to the file

    - update(), that modify the content of a certain record

    - delete(), that deletes a certain record

    - close(), that closes the file


    The implementation of these methods is generally without problems, but delete()
    is an exception. The question is what should happens when you delete a record,
    as you logically get a "hole" in the file. In practice, there are several solutions.
    For you could move the record to the place where the deleted record was placed
    and then reduce the length of the file with the size of a record. The main problem
    with this strategy is, that a record in this way may change the record number,
    and then cannot be used to identify a certain record – the record number cannot
    be the key. In this case, I will use a strategy where the record number is set
    to -1, thus indicating that the record is deleted. The disadvantage of this approach
    is that the file will contain a number of "dead" records, and you should deleted
    records. If you deleted many records, it may also mean that the file is unnecessarily
    large. The problem can be solved by writing deleted records when adding new records
    (it is not done in this case). You must specifically noting, how the method delete()
    are implemented, and how to delete a record by writing the number -1 to the file.
    When the record number is the first field, it corresponds exactly to the number
    -1 to the file.


