    The last observation relates to performance. Currently, a buffer is nothing but
    a memory structure that encapsulates an array, and in relation to files is the
    meaning of course that the OS system must copy data to and from buffers. Somewhere
    it is not optimal, since the operating system''s IO operations are using their
    own buffers that do not have anything with Java to, but buffers as described in
    this section are data structures for JVM, and therefore would be advantageous
    that they were the same buffers. It is, however, not quite simple, in particular
    due to the Java''s buffers are not necessarily contiguous allocated, but also
    because the garbage collector if necessary are moving them. In an attempt to solve
    these problems, one can create a byte buffer as


    ```

    ByteBuffer buffer = ByteBuffer.allocateDirect(99);

    ```


    It is a buffer that is associated with the IO and files, and in some cases, results
    in an improved performance and defines a buffer without a backing array, but there
    must be special reasons for using that kind of buffers, since the gain is typically
    small.


    # 3.2 CHANNELS


    Channels belongs to buffers to achieve high-performance I/O. A channel is an object
    that represents an open connection to a hardware device as a file. Channels efficiently
    transfer data between byte buffers and operating system-based I/O services, and
    often there exists a one-to-one correspondence between a file descriptor and a
    channel. When you work with channels in a file context, the channel will be connected
    to an open file.


    A channel is defined by an interface


    ```

    java.nio.channels.Channel

    ```'
