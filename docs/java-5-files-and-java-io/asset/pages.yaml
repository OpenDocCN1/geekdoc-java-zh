  md: '# JAVA 5: FILES AND IO FINAL EXAMPLE


    However, there is one problem, since the 16-number system requires 16 symbols,
    and for this applies the 10 digits and the first 6 letters: A, B, C, D, E and
    F, and the symbols can then be interpreted in the following table:


    | HEX | DEC | BIN | HEX | DEC | BIN | HEX | DEC | BIN | HEX | DEC | BIN |

    |---|---|---|---|---|---|---|---|---|---|---||

    | 0 | 0 | 0000 | 4 | 4 | 0100 | 8 | 8 | 1000 | C | 12 | 1100 |

    | 1 | 1 | 0001 | 5 | 5 | 0101 | 9 | 9 | 1001 | D | 13 | 1101 |

    | 2 | 2 | 0010 | 6 | 6 | 0110 | A | 10 | 1010 | E | 14 | 1110 |

    | 3 | 3 | 0011 | 7 | 7 | 0111 | B | 11 | 1011 | F | 15 | 1111 |


    It is easy to convert a hexadecimal number to the decimal system, and is just
    a case of simple arithmetic. Here are some examples:


