  md: '# APPENDIX A


    If you technically have to deal with computers, you can not ignore the binary
    number, as there are a lot of details that you cannot explain without having knowledge
    of the numbers and their binary representation. The following is a brief introduction
    to the binary numbers and including the hexadecimal system in view of applications
    in computer technology, but it is by no means an accurate treatment of number
    systems in general.


    The numbers presented to us at the school are decimal numbers in which numbers
    are represented by 10 symbols, for example


    18207


    When we meet the number, we know exactly what it means, because we know the 10
    symbols and their interpretation in relation to where a symbol appears in the
    number. The decimal number system is a positional number system as the value of
    a digit is determined by its position:


    18207 = 1 tens of thousands plus 8 thousands plus 2 hundreds plus 0 tens plus
    7 ones


    When we are taught to work with these numbers, we find them simple and easy to
    understand, but the reason is, that people very easy and safe can survey and learn
    the 10 symbols.


    The decimal system or 10-number system is not the only system that people have
    historically used. For example, was previously used a 60-number system, which
    you can see the remains of our division of the time: 1 hour divided into 60 minutes,
    1 minute divided into 60 seconds. The 60-number system has also been used in commercially
    trade calculation. The system has several advantages. 60 has many divisors, which
    means that you can formulate many rules of arithmetic, and even quite large numbers
    do not take up so much, but there is also a very big disadvantage, namely that
    the system requires 60 symbols (there are actually historical writings that shows
    the 60 symbols). That the 10-number system that has become the preferred, it is
    believed that it is because we have 10 fingers. Actually, there are also examples
    of how people have used a 20-number system (we also have 10 toes).'
