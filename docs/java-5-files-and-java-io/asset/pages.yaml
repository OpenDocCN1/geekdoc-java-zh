    \ = 0, size = 24\nPosition = 24, size = 24\n23\n3.14159265358993\n29\n2.718281828459045\n\
    ```\n\n# MEMORY MAPPED FILES\n\nA FileChannel has a method map() which makes it\
    \ possible to embed an open file or a part of an open file in a buffer:\n\nMappedByteBuffer\
    \ map(FileChannel.MapMode mode, long position, long size)\n\nThe three parameters\
    \ denote a mode in addition to part of the file to be encapsulated (start position\
    \ and the length of the segment to be encapsulated). One may be READ_ONLY or READ_WRITE.\
    \ The type MappedByteBuffer has the same characteristics as other buffers, but\
    \ its content is stored in a file. This means for example, that if you perform\
    \ a get() and the file is updated by another program, the changes are visible\
    \ in the current program. The same also applies to put() if you update the buffer,\
    \ the changes will be visible in another programs that use the same file. The\
    \ goal of a memory mapped file is of course performance, and especially when processing\
    \ large files like pictures. As an example is shown a method that creates a file\
