    # BINARY OPERATIONS


    Above I have discussed binary arithmetic and explained why the addition is a fundamental
    operation for a processor. There are other important operations as processors
    must be able to perform all of which can be implemented efficiently and simple
    in hardware. This section lists these basic binary operations.


    Another reason for looking at these operations is that they are supported by many
    programming languages, as the languages has operators that correspond to the binary
    operations. In many contexts, it is important to be able to manipulate the individual
    bits, and to these the binary operators are important.


    # LEFT SHIFT


    This operation I have already mentioned, given a device with a particular word
    length the operation shifts all bits one position to the left and insert a 0 in
    the right end. For example 16 bits unit


    ```

    0111011111000001

    ```


    and after a left shift the value is:


    ```

    0111011111000010

    ```


    The bit that was left is gone, which is a part of the operation, but in a processor
    this bit is transferred to a status bit.


    If the bit pattern that is shifted to left represents a number it corresponds
    to, that number is multiplied by 2. Note that this means if a number is shifted
    in n positions, it corresponds to, that the number has been multiplied by 2ⁿ.'
