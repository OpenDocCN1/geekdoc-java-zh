    If in a certain position you AND a 1 to the first bit pattern the result in position
    will be the same as the value of the first bit pattern – AND a 1 does not change
    anything. If you in a certain position AND a 0 to the first bit pattern the result
    in position will certainly be 0 regardless of the value of the first bit pattern
    may have had. The result of the foregoing is, therefore,


    ```

    00111011111100001 AND 1111111111111111 = 0011101011110001

