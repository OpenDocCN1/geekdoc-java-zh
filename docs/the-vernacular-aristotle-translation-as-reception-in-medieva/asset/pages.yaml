    is necessarily influenced by them. As Martingale stresses, the translated text
    is already an interpretation ... since translation depends on prior reading practices.¹18
    Consequently, the translator''s audited audience receives a ''translated'' output
    that is not simple product of the translator''s own reading of the source but
    the result of earlier processes of reception (what Martingale calls ‘chain of
    receptions’) that translation inevitably assimilates.¹9 Yet, as I aim to show
    in this book, it is exactly the progressive overplay of ‘prior reading practices’
    as well as the networks of such reading practices (prior, contemporary and future)
    that contribute to making translation an elusive goal.


    Second, the mutually determinant nature of translation and reception affects the
    way in which the source is received and by through the translator''s work, as
    well as the way in which a given translation is received by its immediate and
    later audiences.¹²⁰ Thus, translation is not a simple act of reception, but it
    becomes essential to the reception process as a whole. Considering translation
    not, as a synonym but as an analogue term for reception, I aim in this book to
    stress the role that reading practices takes an active part in facilitating and
    shaping the process of translation, as well as in promoting the translation''s
    dissemination. In fact, as I have done regarding the concept of translation, I
