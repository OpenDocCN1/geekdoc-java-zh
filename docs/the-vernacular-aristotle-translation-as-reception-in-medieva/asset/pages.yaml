    to 1305). The domestication of Aristotle''s philosophical legacy is particularly
    central to the *Convivio*, often seen as Dante''s attempt to write a philosophical
    encyclopaedia in the vernacular that would challenge the status of Latinate culture.³³
    Dante''s opinion on the relationship between Latin and the vernacular differed
    from the most typical approaches of him. Instead of focusing solely on the assumption
    of an inseparable qualitative double lens: he does discuss the ethical and political
    role of linguistic choices within his historical context, but also situates his
    analysis within a larger reflection on the philosophy of language. At the core
    of both perspectives, represented by the *Convivio* and *De vulgari eloquent*,
    is the conscious claim that the vernacular, as opposed to Latin, is the medium
    that is natural to humankind.⁴ For Dante, the vernacular, the language that we
    acquire by ''imitating our nurses'', deserves both our full appreciation and our
    pledge to enhance its beauty.³⁵


    Dante''s ideas resounded widely in the Renaissance debate concerning the relationship
    between Latin and the vernacular, particularly in the sixteenth century when the
    dante influenced concurrent discussions on the actual nature and features of the
    vernacular, traditionally referred to as *la questione della lingua* (''the controversy
    on language'').⁶ In fact, one could affect the other and the role of humanism
