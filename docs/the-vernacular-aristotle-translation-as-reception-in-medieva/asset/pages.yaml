    # The Humanist in the Middle


    As has been shown, Domenico da Prato''s self-defence has two unnamed but easily
    recognisable targets: Leonardo Bruni and Niccolò Niccoli. If Niccolò is traditionally
    the uncompromising representative of those humanists who distanced themselves
    from the vernacular world, Bruni embodies the inner conflicts of humanism vis-à-vernacular
    culture. He articulates this conflict by explicitly addressing the Dialogi ad
    Petrum Paulum Histrum, the relationship between Latinate and vernacular cultures.
    By giving a prominent voice to Niccolò, Brun embodies the notion of humanism polemicised
    by Domenico da Prato, but he also provides space for the age of the founding fathers
    of vernacular literature. As other scholars have noted, that is through Niccolò
    that the position expressed in the first dialogue is later nuanced in the second.³³⁷


    The ambiguity of Bruni''s position in the Dialogi reappears in his later vernacular
    biographies of Dante and Petrarch, where he acknowledges the relevance of the
    two poets to the cultural growth underway in his time.³⁸ Bruni stresses the civic
