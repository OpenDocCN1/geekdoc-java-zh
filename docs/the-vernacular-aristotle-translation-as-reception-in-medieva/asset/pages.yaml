  md: '# THE VERNULAR ARISTOTLE


    This book explores the ways in which Aristotle’s legacy was appropriated and reshaped
    by vernacular readers in Medieval and Renaissance Italy. It considers translation
    in a broad sense, looking at commentaries, compendia, rewritings and abridgments
    alongside vernacular versions of Aristotle’s works. Translation is thus taken
    quintessential to the very notion of reception, with a focus on the dynamics –
    cultural, social, material – that informed the appropriation and reshaping of
    the ‘master of those who know’ on the part of vernacular and transformative nature
    of reception, this book challenges practice of translation between 1250 and 1500.
    By looking at the proactive and transformative traditional narratives about the
    period and identifies the theory and practice of translation as a liminal space
    that facilitated the interaction between lay readers and the academic context
    while fostering the legitimation of the vernacular as a language suitable for
    philosophical discourse.


    EUGENIO REFINI is Assistant Professor of Italian Studies at New York University.
    His interests include Renaissance poetics, rhetoric and drama; reception of antiquity
    and translation studies; and the intersections of music and literature. His publications
    include a monograph on Alessandro Piccolomini (Per via annotazioni: le glosse
    inedite di Alessandro Piccolomini all’Ars Poetica di Orazio, 2009) and several
    articles and book chapters on Ludovico Ariosto, Torquato Tasso, Latin Humanism
    and the musical culture of early modern Italy.'
