    the cultural backbone for the vernacular audience. In many cases these tended
    to circulate as part of miscellanies, attempts to follow their transmission provide
    useful information about the interests of readers. For instance, Alderotti''s
    version of the Summa is frequently compiled alongside not other portions of the
    Tesoro volgare and other works by Brunetto Latini but also the pseudo-Aristotelian
