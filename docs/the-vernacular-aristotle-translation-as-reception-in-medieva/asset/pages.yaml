    A strong focus on the practical dimension of moral philosophy is, as we have seen,
    a constant element in the vernacular reception of Aristotle. Lay readers like
    aristocrats and wealthy merchants were more interested in the applicability of
    philosophical thoughts to real life than in abstract speculation. At the same
    time, works such as Mannelli''s Compendio do not limit their discussion to prescriptive
    teachings. On the contrary, they attempt to articulate these teachings by giving
    them some sort of theoretical framework, always trying to find an effective balance
    between academic discourse and intellectual simplification.


