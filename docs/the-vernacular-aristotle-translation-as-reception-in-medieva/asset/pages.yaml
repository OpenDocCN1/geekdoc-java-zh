  md: '# Conclusion

    nThe Spirit in the Crystal Bottle


    With our last example, this study has reached the end of the fifteenth century,
    when, among other factors, the advent of print deeply affected the vernacular
    book market. In particular, the afterlife of Campasora''s De immortalitate animae
    unveils the outcomes of the complex process of translation that fuelled the vernacular
    reception of Aristotle. Through the cases discussed in this book, we have seen
    Aristotle mounted by the witty courtesan; revered as the ''master of those who
    know''; appropriated by aristocrats and wealthy merchants who wished to legitimise
    their status or simply desired to know more about moral and religious beliefs.
    Not only did the Philos remain steadily present in the academic cultures of the
    later Middle Ages and the early Renaissance, but he also came to interact with
    lay, primarily vernacular, readers outside academia. Translated, reduced, adapted,
    transformed, Aristotle embodied the very idea of knowledge, that in different
    and concurrent ways, vernacular audiences across Europe to share and make their
    own.


    The vernacular readings of Aristotle examined in this study tell a story made
    of readers interested in the subject matter of the philosopher''s works, particularly
    moral philosophy in its relation to Christian doctrine. They also tell us the
    ways in which both translators and their reading publics engaged with the wider
    cultural, ethical and political implications entailed by linguistic shift. The
    playful ''taming'' of Aristotle performed by the courtesan in the Lai d''Aristotle
    (Chapter 1) captures the tension between the alleged authority of Latinate academia
    and the increasing demand for philosophical knowledge to be dealt with in the
    vernacular. At the same time, the almost proverbial prominence of Aristotle among
    the auctoritates of the past, powerfully represented by the many portrayals of
    the philosopher as a venerable scholar, functions as a unifying thread that runs
    across linguistic hierarchies in the period. Within such a context,


