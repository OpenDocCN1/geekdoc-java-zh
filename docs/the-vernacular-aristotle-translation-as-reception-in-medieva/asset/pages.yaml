    As the stern philosopher in Santa Maria Novella and the lively young man debating
    with Plato at the cathedral campanile, Aristotle was a key figure in the debates
    between humanists and traditionalists. In different ways, already evident in Petrarch,
    each camp considered the other had misappropriated the Philosopher and, with him,
    the whole system of Aristotelian knowledge. Both perspectives have been the object
    of thorough investigation, and the implications of their interaction and the common
    ground that they remained largely unexplored. In this chapter I argue that this
    interaction should be examined to better understand the ways in which humanism,
    through conflict and ambiguous forms of competition, came to permeate vernacular
    culture. I will first consider the ways in which the dynamics of the conflict
    between traditionalists and humanists seeped into vernacular literature. I will
    turn to the forms of translation and adaptation that followed the appropriation
    of Aristotle by vernacular readership. By exploring, in particular, Giovanni Ruccellae’s
    interest in Aristotle’s moral philosophy and Bernardo Nuti’s Italian translation
    of Leonardo Bruni’s Latin version of the Nicomachean Ethics, I will focus on the
    active role played by readers in both ‘translating’ and ‘receiving’.


    # Fighting the Ancients


    Given the multilingual dimension of fifteenth-century Florence, translation features
    as a prominent site of cultural interaction. Translation is not only the space
    where past and present meet, but also the tool with which the present engages
    in a cultural context with the past. Bruni’s De interpretatione (‘On the Correct
    Way to Translate’), from around 1424 to 1426, stands as the broadest outline of
    the humanist theories of translation. Bruni claims that his Latin version of Aristotle’s
    works restored the philosopher’s


