    Valerius Maximus, Sallust, Quintilian, Isidore of Seville and, above all, Seneca
    and Mannelli''s compilation, however, is an ambitious one, where the various autores
    inhabit a wider strate structure that aims to provide an exhaustive treatment
    of moral philosophy. The work is clearly inspired by Aristotle''s Ethics, which
    provides Mannelli with not only the philosophical subject matter but also a methodological
    frame to treat the topic adequately. Divided into three main parts, the Compendium
    begins by addressing the notions of virtue, passion and habit; it then proceeds
    with a detailed discussion of virtues and vices before closing with a section
    devoted to friendship.


    While it is difficult to say whether Bruzio actually read the Compendium, the
    afterlife of the work is of great interest to our study. In the fact, the reception
    of Mannelli''s work well beyond the bounds of Bruzio''s library illustrates the
    dynamics that informed the increasing interest of lay readers in philosophical
    matters, and as we see, widens the breadth of the intersections of Latinate and
    vernacular cultures outlined in the previous chapters.


    # Two Steps Forward


    As far we know from its manuscript, which is limited to the dedication copy, Mannelli''s
    Compendium philosophiae moralis does not seem to have circulated widely. When
    one considers the vernacular reception of the work, however, significant differences
    emerge. One anonymous translation of the Compendium survives in five manuscripts
    written between the fourteenth and the fifteenth centuries. While the translation
    has been tentatively attributed to Mannelli himself, evidence for this claim is
    lacking. It is nonetheless evident that the vernacular proved much more successful
    than the Latin one. One the text moved beyond Bruzio''s household, it showed the
    features that generalised its original commission as it entered private libraries
    belonging to patrons that have also owned the other discussed in our earlier chapters.
    More precisely, as suggested by a careful study of these extant manuscripts, the
    vernacular version of Mannelli''s Compendium went through a process of transformation,
    while affecting the textual content of


