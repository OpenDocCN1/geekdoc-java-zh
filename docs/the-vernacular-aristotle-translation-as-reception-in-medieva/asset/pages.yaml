    Arnolfi, the biography of Bincadio de Cerchi reveals a reading public that, throughout
    the fifteenth century and well into the sixteenth century, appreciated works such
    as Alberteritti. While many Florentine aristocrats, Bincadio spent his youth in
    mercantile activity but also became involved in local politics. As suggested by
    a ricordanance that he wrote in his later years, Bincadio was one of the Medici
    family and a fierce opponent of Savonarola.¹⁰ Along with his own writings, Bincadio
    transcribed several volgarizzati with content similar to the misscellannies mentioned
    above. The fact that Bincadio''s library included a copy of Alberterittis compendium
    confirms the consistency of the cultural and social patterns that generalised
    the circulation of the work and, more precisely, its reception in the circle of
    aristocrats and affluent merchants.


    But while manuscripts as Ricc, 1538 and Thompson are precious objects brought
    by professional or semi-professional scribes, Bincadio: miscellany marks a new
    chapter in the history of vernacular culture between the later Middle Ages and
    the early Renaissance: the rise of individuals copying texts for their own personal
    use. The littera textualis, the standard for professional scribes and popular
    in scholarly contexts, gives way to cursive scripts of notarial or mercantile
    origin (the so-called ''mercantesca''), hands typical of the cultivated lay who
    found fulfilment in the exercita vita while performing some tasks of education.¹¹


