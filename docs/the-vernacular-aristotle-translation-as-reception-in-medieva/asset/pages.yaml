    From a slightly different perspective, the account of the vernacular in the De
    vulgare eloquia adds yet another layer to Dante''s discussion. The Convivio, despite
    its innovative outcomes, shares the traditional idea of a qualitative divide between
    Latin and the vernacular. By contrast, the De vulgari eloquia reassesses the relationship
    between them by affirming the natural and chronological priority of the vernacular.³³⁶
    Here Dante offers a largely inaccurate history of the language that allows him
