  md: '# 230 Conclusion


    that is closer to nature, means using the language they naturally learnt as children.¹16


    Pomponazzi''s criticism of his opponent''s views on language could not be harsher.
    Humanists such as Lascaris he argues, that in order to be good philosophers, it
    is enough to master Greek, ''as if Aristotle''s soul, like a spirit in a crystal
    bottle, resided in the Greek alphabet and inspired them by means of Greek letters.''¹17
    By criticising the language of the ancients, Pomponazzi suggests that humanists
    (who vehemently embodied the notion of *auctoritas Aristotle*) simply replaced
    one category of authority with another. Their belief in eloquence as to knowledge
    is, according to Pomponazzi, pointless, for many, despite their excellent expertise
    in the languages of the ancients, are incapable of mastering the philosophical
    subject matter of the authors on which they are lecturing. Furthermore, by rejecting
    the vernacular and, more specifically, vernacular translation, they prevent knowledge
    from being shared widely:


