    my reading has taken into account. It is likely that both printers simply recur
    to ready-to-use blocks that they had in their workshops, it is undeniable, as
    soon as the book is published with a given woodcut on the frontpiece, that image
    becomes part of the work. As such, it is received by readers and the unpredictable
    series of responses that constitute the reception of the work. Whether or not
    these series of frontpieces are misleading when compared to what readers will
    actually find in the book, they capture the transformative process fostered by
    translation and reception.


    The cases discussed in this chapter show that the practice and notion of translatio
    were not limited to translations in the strict sense of the word, but engaged
    more widely with the cultural transmission and appropriation of earlier sources.
    Mannelli’s Compendium moralis philosophiae and Jacopo Campora’s De immortalitate
    animae are most interesting examples of this phenomenon, not only for the way
    in which the authors appropriate the Aristotelian tradition through a Christian
    lens but also because of the multifaceted process of reshaping that informed the
    afterlives of both works. The history of their material circulation throughout
    the fifteenth century shows how texts deeply rooted in the medieval tradition
    were received and appropriated by different sorts of readers, as well as adapted
    to different purposes. A given text is presented according to changing cultural
    circumstances. Their textual transmissions, furthermore, capture the dynamics
    at stake when translation and reception are considered as part of a process that,
    as recalled above, is never final.


