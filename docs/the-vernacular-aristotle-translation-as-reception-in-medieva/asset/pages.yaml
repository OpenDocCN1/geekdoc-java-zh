  md: '# The Spirit in the Crystal Bottle


    witnesses a key moment in the vernacular reception of Aristotle that we have been
    following in this book.


    Far from being a viable option at the time, the idea of turning to the vernacular
    in academic contexts was potentially disruptive (suffice to recall Galileo Galilei''s
    experience less than one century later).¹⁹ Ascribed by Speroni to Pomponazzi,
    who was trained in the stronghold of scholastic Aristotelianism, the idea that
    knowledge should be dealt with in one’s mother tongue challenged the academic
    establishment, both the traditional structures of universities and the classicising
    attitude of humanists, which, in different ways, contributed to keep the ‘spirit’
    in the ‘crystal bottle’. And yet, Speroni’s depiction of Pomponazzi’s desire to
    have philosophers use the language of ‘common people’ does share the preoccations
    that were at the core of the case studies presented in this book. Since Dante’s
    appeal to the targeted audience of the Convivio ... ... knights and many other
    noble people, not only men but women, of which there are many in this language
    who know only the vernacular and are not learned)²⁰ and through the various examples
    that I have explored here, the main aim of vernacular literacy was not to let
    ‘potters, farmers and boatmen’ discuss Aristotle''s works. Rather, the idea of
    accessing Aristotle in the vernacular (or, depending on the point of view, the
    idea of making him speak in the vernacular) hinged upon the attempt to avoid hypostatising
    the past so as to make it live in and be relevant to the present.


    > ¹⁹ Galileo’s commitment to the vernacular, see Celenza (2018: 401–4).


    > ²⁰ Dante, Convivio, 1.9.5.'
