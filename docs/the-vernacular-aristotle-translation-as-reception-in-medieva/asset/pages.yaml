  md: '# Series Editors'' Preface


    The Latin roots of *tradition* and *translation* (respectively, *trado* and *transfer*)
    share not only a prefix (trans-) but also the same basic spatiotemporal metaphors.
    Both, in other words, ask us to imagine a process by which something is moved
    from point A to point B. The thing being moved has (or is) value is further suggested
    by other English words both (''trade’, ''transfer'', etc.), to say nothing of
    the deeper root of *trado*: *do*, ‘I give’. This last verb curbs at the very heart
    of older notions of ‘the classical tradition’ as not just a ‘gift’ of those clever
    and talented Greeks and Romans, but a hulking inheritance to which subsequent
    ages supposedly owed both care and respect. Such notions seem quaint (or even
    morally or politically suspect), supplanted by more supple accounts of ‘classical
    reception’ that emphas the agency of person or age ‘receiving’ this supposed gift
    – on close inspection, is revealed to be both a product of said person or age
    as it is an intact legacy from the past. But what of ‘translation’, especially
    when the movement in question is Greek or Latin? Can and should we upend the hypothesis
    of ancient value ‘transferred’ to the present, in order to recover the creative
    work of translators and their readers in creating that value?


    This question animates Eugenio Refini’s *The Vernacular Aristotle: Translation
    as Reception in Medieval and Renaissance Italy*. As his titles make clear, ‘point
    A in this is Aristotle, who by the later Middle Ages had such authority that he
    could be cited, simpler, as ‘the Philosopher’. But if Aristotle is in some way
    an exemplary figure from (and for) the classical canon, then it is problematic.
    His oeuvre is vast and varied and covers an astonishing range of subjects, albeit
    with conclusions that are not always consistent between this or that work. This
    is partly the result of the origins of his texts, with most of the surviving *Corpus
    Aristotelicum* seemingly comprising lecture notes rather than finished treatises.
    The analysis is dense and minute, often buried in technical vocabulary, some of
    it given specialised meanings by Aristotle himself. And then, of course, there
    is the'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Series Editors'' Preface


    fact that he wrote in Greek. That was not in itself a problem for his contemporaries,
    but it was already a significant mediating factor for medieval readers who knew
    him only in Latin translation. Later, as Latin began to yield to the vernacular,
    the Philos slipped, for many, even further out of reach.


    One might suppose, therefore, that the proliferating translations of Aristotle
    into the vernacular in the late medieval and early modern period represent nothing
    than an effort to rescue his works from a linguistic dead end, preserving their
    value as an ongoing gift to posterity. This, indeed, was part of the stated intent
    of translators. But as Refini''s probing portrait reveals, the story is far more
    complex. On one hand, as translators grappled with the text and their, their work
    inevitably became one of interpretation as much as of translation. (Here too,
    as Refini points out, there lurks a pun, in that interprets the Latin word for
    ''translator''). On the other, far from being destined only for a ''lower'', Latin
    non-specialists, their translations circled back to inform ''higher'' work of
    Aristotle exegesis and new philosophy still conducted in Latin. Vernacular translation,
    in other words, was an integral part of Aristotelian reception throughout the
    period in question.


    This fact is interesting in its own right, revising a crucial chapter in the reception
    of a major classic author and shedding new light on late medieval and early modern
    philosophical thought more generally – and more: namely, a model for the study
    of what its introduction labels ''translation as reception''. His case studies,
    organised around specific projects of translation, provide close analysis not
    just of the resulting texts but of the physical books in which they circulated
    and the readers through whose hands (and sometimes, under whose annotating pens)
    they passed. The dynamism of Aristotle''s late medieval and early modern life,
    in Refini''s colourful reconstruction, embraces not just abstract concepts and
    reverberative terminology, but a messy world of books, printers, merchants, patrons
    and a remarkably varied cast of readers. Reception in such scenarios is often
    double or triple, while seemingly linear movements like tradition, translation
    and transmission are shown to trace geometries of extraordinary complexity.'
