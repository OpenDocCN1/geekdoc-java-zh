    example of the circulation of the Compendio in a mercantile context is MS Acquisti
    e Doni 686 of the Biblioteca Medicaea Laurenziana, written in 1419 by the vernacular
    merchant Bernardo Bragadin, who was detained in Florence due to a controversy
