  md: '# The Spirit in the Crystal Bottle


    rich in conflicts of culture and language, Aristotle was made to speak vernacular.
    As suggested by the examples presented in this book, the process was all linear.
    Indeed, these examples show the interplay of translation and reception, which
    has been the primary concern of this study, is perfectly enactive because, through
    its workings, it questions the idea itself of linearity. In fact, the narrative
    drawn here is not much about the ways in which vernacular readers went back to
    Aristotle; rather, it is the ways in which vernacular readings of Aristotle expose
    the philosopher’s non-linear reception. More than looking at nuses of cause and
    effect, I have explored the coexistence of different approaches to (and uses of)
    translation. I have also examined the ways in which, through both conflict and
    constructive interaction, those approaches contributed to the vernacular appropriation
    of Aristotle. Imbued with stimuli diverse as those concurrently elicited by scholasticism,
    humanism, the legacy of antiquity and the emerging claims of vernacular culture,
    the readings of Aristotle that I have discussed in this book invite us to think
    about translation and reception as the very conditions for any form of cultural
    appropriation.


    With the visionary and ambitious project outlined in the Conivio, Dante attempted
    to create a dialogue between academic knowledge and leadership without diminishing
    the intellectual status of philosophical inquiry. More successful than Dante’s
    endeavour (even with Dante’s intended audience), Taddeo Alderotti and Brunetto
    Latini’s bestselling translations of the Summa Alexandorum helped disseminate
    abridged forms of Aristotelian philosophy that remained a continuous presence
    in the libraries of vernacular readers well into the Renaissance (Chapter 2).
    Concurrently, fifteenth-century attempts to make Aristotle’s ‘real’ Ethics accessible
    to vernacular readership – either through complete translations of the treatise,
    as is the case with Colombella and Nuti, or through selective readings, as is
    the case with Gallinata and Rucellai – shed light on the proactive nature of the
    readers involved in the process (Chapters 3 and 4). In fact, along with eclectic
    works as those by Mannelli and Campora (Chapter 5), the examples explored in this
    book show that reception triggers and includes its own making. In other words,
    this study reveals that translation and reception to coincide with their objects,
    which, deeply rooted in an unattainable state, pass only when translated and received
    at given moments in time. The examination of such process also shows that, when
    considered as each other, translation and reception raise questions about the
    status of language. Indeed, throughout my five chapters, I have demonstrated that
    vernacular readings of Aristotle'
