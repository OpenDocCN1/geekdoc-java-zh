    As usual, chronological data intertwine with matters of geography in the production
    and consumption of books. In this respect, it is worth noting that most of the
    manuscripts were written in northeastern and central Italy, whereas the situation
    with printed editions is quite different. The 1472 editio principis of De immortalitate,
    as we shall see, was the first vernacular book ever printed in Rome by Giovanni
    Filippo de Ligname, a printer chiefly concerned with the publication of Latin
    texts. Another edition was printed in 1478 by Ottaviano Salomonio de Cosenza,
    undoubtedly a minor location in the production of printed books but important
    as a place specialised in the printing of vernacular texts.³⁷ More widely, though,
    the circulation of Campora’s booklet was guaranteed by Northern Italian printing
    presses in Lombardy (Milan and Brescia) and, not surprisingly, in the Veneto (Venice
    and Vicenza).


    In spite of a rather narrow chronological (1430s–90s), the high number of extant
    copies confirms a wide range of material and paratextual typologies. Scripts,
    formats, layouts, as well as the functions of specific copies, changed throughout
    the decades, testifying to the mobility of the text. A variety of solutions characterises
    manuscript copies and printed editions. For example, among the sixteen manuscripts,
    six are miscellannies of moral or religious works in Latin and vernacular and
    ten contain the text alone. In terms of formats and layouts, some of the copies
    follow late medieval models, while others are indebted to the new humanistic vogue.⁸
    An even variety of solutions informs the rich series of incunabula that were published
    since the 1470s. The 1472 editio principis is an elegant folio printed in a clear
    and stylish Roman type, whereas among the following editions (with the exception
    of the large double-column print of Vicenza from 1477) small-format books prevailed.
    This is the case of the easy-to-handle Milanese and Venetian editions of the late
    1490s, printed in either Roman or Gothic type.


    The variation of social and cultural identities that informs the mission and the
    circulation of the text is particularly well-documented by the editorial choices
    affecting the paratext and, more specifically, the dedications of the various
    copies. By inspecting these editorial choices, it is possible to follow the afterlife
    of Campora’s work as well as the progressive transformation of its initial shape,
    chiefly informed by scholastic and medieval components, into a pseudo-humanistic
    product. The ways


