    The genre of the compendium was widely employed as a tool for didactic purposes
    throughout the Middle Ages and the early modern period. What makes Campora''s
    De immortalate a less conventional work, as indicated above, is that it was written
    in the form of a dialogue. As its author explicitly states, the dialogic form,
    which does not involve a truly dynamic exchange between the interlocutors, is
    based on a schematic sequence of questions and answers and follows an exegetical
    model that contains a simplified version of the scholastic *questiones* and the
    didactic structure of works such as the aforementioned *Elucidarium*.⁴⁴ The presentation
    of the treatise as a dialogue is thus a pretext to frame it within a structure
    that remains univocal despite its two voices.


    And, yet herein lies one of the most significant aspects of the text, the merchant
    engages in a methodological discussion that helps better grasp some of the cultural
    components typical of vernacular readership and the vernacular interest in philosophical
    works. The author, in fact, Giovanni voice over the concerns that inform the ways
    in which a lay interlocutor of the time would respond to the vernacular desertination
    of philosophical topics. From the outset, the merchant shows a strong awareness
    of the issues implied by the theme discussed. ''Even though we do believe by faith
    the human soul to be immortal, I would you to tell me the philosophical reasons
    for this,'' Giovanni requests requesting the important distinction between faith,
