    the negation of translation as a tool for the transfer of knowledge, adding yet
    another layer to concurrent debates about translation theory and practice. In
    fact, Peroni''s portrayal of Lascaris outlines a position both fails to acknowledge
    the status of the vernacular and differs significantly from the strong belief
    in translation that informed Latin humanism throughout the fifteenth century.
    Lascaris'' rejection of Pomponazzi''s defence of the vernacular is only one facet
    of a much more complex situation, in which Greek humanism (the cultural weight
    of which had been increasing in Italy in the second half of the fifteenth century)
    was claiming its own space vis-à-vis Latin humanism.¹


    By considering these implications it is possible to grasp the striking contrast
    between the two interlocutors in Peroni''s dialogue. On one hand, Lascaris embodies
    a position that is more radical than the one expressed by Leonardo Bruno. According
    to the Greek scholar, the only way to access a text is to read it in its original
    language, as a given author''s thought can only be fully appreciated in the language
    in which it was conceived. On the other hand, Pomponazzi radically overthrows
    the idea that language se matters. Indeed, Speroni makes Pomponazzi claim that
    language only matters as a tool for immediate overcome the difficulties faced
    by people reading the variety of languages.¹⁴ Philosophy should not complain about
