    shared within and beyond humanist circles, these premises encouraged educated
    lady readership, whose reading practices were often informed by very practical
    concerns. The complex relationship between humanism literary traditions is evident
    in the specific ways in which readers approached the classics, particularly masters
    of moral philosophy as Aristotle, Cicero and Seneca. It would be nonetheless misleading
    to draw too sharp a line between the two approaches. Indeed, as the case discussed
    in this chapter show, it is through the grey zone of translation that some features
    of humanism penetrated vernacular culture.


