    by his Life of Aristotle. Written in 1436 as part of a diptych that also includes
    the Life of Petrarch, Bruni''s biography of Aristotle exemplifies his attempt
    to embed humanism in the philosopher''s legacy.¹⁴¹


    As recalled earlier in this chapter, Bruni''s project is hardly ''philological''
    in the truest sense of the word, since his appropriation of the Greek philosopher
    is filtered through the Latin interpretations of Cicero, who deeply influences
    Bruni''s understanding of Aristotle''s philosophy as well as his stylistic qualities.⁴²
    On one hand, Bruni''s detailed account emphasises the political and civic science
    that Aristotle demonstrated throughout his career, as a counsellor of rulers and
    a teacher of princes, the most notable of whom was Alexander the Great. On the
    other hand, Bruni''s need to substantiate the portrayal of the philosopher as
    a vir bonus dicendi peritus leads him to confront the common opinion about Aristotle''s
    elegant language. He refutes the claim with two arguments. First, what Latin readers
    have read for centuries is not the authentic Aristotle, Bruni argues, but a tainted
    version of his works, the product of incompetent translators who have ruined the
    philosopher''s eloquence. (Here Bruni repeats some of the points from his critique
    of the medieval translators of Aristotle in the preface to his version of the
    Ethics, later reaffirmed in the de interpretatione recta.) Second, Aristotle''s
    rhetorical skills and beautiful diction are assumed, as I have noted above, on
    the basis of Cicero''s prose of the Greek philosopher''s eloquence and on the
    evidence that Aristotle''s own writings often treat both rhetoric and poetics.⁴³


