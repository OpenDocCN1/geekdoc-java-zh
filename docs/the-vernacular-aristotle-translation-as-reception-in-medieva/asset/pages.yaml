    # Abridging the Philosopher(s)


    # Not Only Aristotle


    One feature of the vernacular reception of Aristotle that runs across the various
    case studies discussed in this book is the diverse nature of such reception. What
    Charles B. Schmitt revealed about the Latin reception of Aristotle in the Renaissance
    – namely, his vision of a philosophical eclecticism instead of the ways that led
    him to use the plural ‘Aristotelianisms’ instead of the singular and monolithic
    ‘Aristotelianism’ – can certainly be applied to the ways in which Aristotle was
    read, received and appropriated in the vernacular.¹ Furthermore, the Aristotle
    that we see through the Middle Ages and Renaissance rarely stood on his own. While
    his status as philosopher par excellence was virtually unchallenged, his legacy
    often merged with those of other authors, Christian or otherwise. The process,
    partly evident in the examples of translation and reception analysed in the previous
    chapters, becomes particularly prominent when translation functions as abridgment.


    In abridging their sources for the benefit of their readers, translators often
    combined different authors, selecting materials from their works. The basic principle
    at core of this kind of translation was the same that informed the coeval anthologies
    of philosophical sententiae. Yet, while collections of sayings such as the Fiore
    di virtuti tended to accumulate data without substantial editing on the part of
    the compiler, abridments aimed to introduce readers to a specific topic (or even
    a given text) by presenting heterogeneous materials in structured ways.³ Compendium
    of this kind, in which moral philosophy was commonly combined with Christian doctrine,
    often took the form of treatises, replicating the structure of works produced
    within the academic context. In other cases, authors


