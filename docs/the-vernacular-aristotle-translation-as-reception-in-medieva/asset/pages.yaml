    The wide circulation of these works, together with concurrent developments of
    humanism, helped create the conditions for a hybrid form of lay philosophy in
    the volgare. Their presence in Cellai zibaldone witnesses this process of hybridisation
    at its best. As we have seen, the process is negotiated by translation, which
    is not only an instrument of interaction, but also the intellectual arena within
    which the status of the vernacular is defined in relation to the status of Latin.
    Furthermore, when readers – as is the case with the zibaldoni – become compilers
    if they do not write themselves, the appropriation of the teachings is more dynamic
    (and less predictable) than the usual (and generally passive) assimilation by
    the simple reading of say, a collection of philosophical sentences. Such lively
    interaction is informed by the selection that reveals the specific interests of
    the compiler and by the written record of proactive forms of exchanges facilitated
    by the compiler himself. Exchanges of this kind usually stem from questions that
    the compiler of the zibaldone is not able to answer based on his readings.


