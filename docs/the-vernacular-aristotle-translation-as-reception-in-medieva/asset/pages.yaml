    stinche (prisons) of Florence to earn money to pay his Florentine readers, was
    clearly writing under commission. This suggests that Mannelli’s Compendio was
    sought after in the book market, as is also indicated by the increasing interest
    of vernacular readership in the work during the early decades of the fifteenth
    century.

    Two manuscripts of the Compendio are instructive in this respect as they offer
    further insights into the cluster of implications that informed the transformative
    reception of the work. In MS Barb. Lat. 4031 of the Biblioteca Apostolica Vaticana,
    the Compendio is compiled by the same scribe as Alderotti’s Italian translation
