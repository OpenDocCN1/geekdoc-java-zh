    Though somewhat difficult to circumscribe, this broader context witnesses the
    fortune of Alderotti''s translation among readers who likely received basic education
    in Latin that was insufficient to read demanding works such as the Latin Aristotle.


    As indicated by Robert Black, Florence presents an invaluable case in the history
    of vernacular education because the republic''s unique literary culture and social
    dynamics are amply documented.⁸⁷ The wealth of extant documents related to the
    textual culture of the city in the late Middle Ages and the Renaissance constitutes
    a corpus rich enough to support certain generalisations. In addition, historians
    of translation profit from the peculiar social and political structure of the
    city in the period. By balancing an energetic bourgeoisie and a vigorously protective
    aristocracy, Florentine society favoured the production and consumption of works
    in the vernacular, which offered a key to understanding and describing present-day
    reality.⁸⁸ Along with Dante and Boccacci, *volgarizzamenti* such as Alderotti
    played a major role in the elaboration of vernacular discourses about contemporary
    politics. Such a process can be understood by situating it within the realm of
    classical rhetoric in medieval Italy, which, as Virginia Cox argues, catalysed
    humanism.⁹ Without underestimating the pivotal role of humanists like Coluccio
    Salutati and more, Leonardo Brununi in the establishment of a new ''philosophical''
    approach to the task, it is fair to argue that the medieval appropriation of classical
    philosophy and rhetoric was central to the development and legitimation of vernacular
    culture. It is within this framework Alderotti version of the *Summa* found its
    way into a readership beyond the narrow circles of scholars and direct access
    to Latin translations of Aristotle''s *Nicomachean Ethics*.⁹⁰


    The numerous copies of Alderotti''s Etica written in cursive scripts with mercantile
    features offer useful insights on the communities of its readers. Interestingly,
    many such manuscripts tell stories, thus witnessing whatever common preoccupation
