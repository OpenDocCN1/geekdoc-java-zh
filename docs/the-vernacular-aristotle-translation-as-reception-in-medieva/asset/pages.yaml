    A final aspect of the afterlife and circulation of Campora''s treatise is the
    progressive reshaping of the thesis. Whereas the manuscript tradition is quite
    consistent in preserving the Latin title, the printed editions introduce significant
    elements of change. Only three of them follow the original ''De immortalte anime
    in modius dialogi vulgariter'', which clearly provides the readers with basic
    information on the topic (the immortality of the soul), the literary genre (a
