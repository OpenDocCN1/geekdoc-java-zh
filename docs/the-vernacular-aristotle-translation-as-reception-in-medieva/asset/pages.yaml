    matter. Instead of spending years studying Greek, Latin and Hebrew, students should
    be trained to use their mother tongue to philosophise. By only committing to philosophy
    from a young age will they be able to equal or surpass the masters of antiquity.
    By endorsing a position that recalls the anti-humanist polemic caused by the advocates
