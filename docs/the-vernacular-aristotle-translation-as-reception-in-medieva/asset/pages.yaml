  md: '# 124 Family Business: Readying the Ethics for the Layman


    Brunetto Latini’s Tresor, namely, that no human interaction takes place without
    language.¹¹¹⁶ For this very reason, language is central to Cotrugli’s definition
    of the art of trade. On one hand, language is the instrument that enables forms
    of communication and exchange; on the other, language is what makes people knowledgeable,
    distinguishing them from the ignorant populace.


    Cotrugli addresses language: in his preface, he explains his choice to write the
    treatise in Italian rather than Latin and again in the third chapter of the third
    book, where he discusses the education of merchants, which revolves around the
    centrality of the liberal arts. In the preface, Cotrugli acknowledges the superiority
    of Latin and explains that he nonetheless turns to the vernacular in order to
    reach a wider number of readers:


    I was uncertain which language I should adopt for my treatise, the Latin or my
    vernacular, and from this side and that pushing me in different directions now
    one way. As far as Latin was concerned, I thought that it was a much better than
    the vernacular and would enable me to explain more elegantly what I needed to
    say in my treatise and give it a far greater polish. But, considering the vernacular,
    I thought, that I was writing my work for the benefit of merchants many of whom,
    for lack of education any deficiency, would be inept in, or ignorant of, Latin,
    it was beheld upon me to write in the language that made my work commonly used
    and comprehensible to those merchants at whom the work was aimed.


    Cotrugli strongly stresses that the elegance of the language cannot be equaled
    by the vernacular, thus taking a position that differs, at least in principle,
    from translators like Colombella and Lazzaro Gallineta, who publicly exposed the
    strength of the vulgar tongue.


