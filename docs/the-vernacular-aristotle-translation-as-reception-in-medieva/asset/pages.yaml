  md: '# Introduction

    Translation as Reception


    Two kinds of images populate this book: images of cultural authority, such as
    the portrayal of the philosopher Aristotle enthroned, and images of cultural debasement,
    such as the depiction of the philosopher Aristotle mounted and reduced to servitude
    by the courtesan Phyllis. While they belong to different and independent iconographic
    traditions, the first kind functions as the premise of the second, in turn, reverses
    the assumptions embodied by the first. One celebrates Aristotle as an outstanding
    cultural authority, while the other shows him deprived of his authoritative status
    and transformed into a common man vulnerable to the tricks of life. Two images,
    both very popular in the Middle Ages and the Renaissance, are emblematic of the
    dynamics that informed the reception of Aristotle in the period, particularly
    where vernacular translation is concerned. Indeed, the fall of the philosopher
    from his chair captures the gradual appropriation of Aristotle''s legacy on the
    part of the new reading publics that shaped the vernacular cultures of Europe
    between the age of Dante and the advent of print.


    As Erich Auerbach argues, lay readers from the period''s aristocratic and mercantile
    elites catalysed the production and consumption of vernacular literatures. While
    Auerbach''s theory remains compelling, more can be said, and indeed needs to be
    said, about the ways in which readers engaged (or aspire to engage) in the making
    of vernacular literature. The primary contention of this book is, between 1250
    and 1500, translation


    ¹ For the notion of ‘reading public’, see the recent discussion of the term in
    Miglietti and Parker (2016). For details about the two iconographies of Aristotle
    (enthroned and mounted by the courtesan-), see Chapter 1.


    ² Auerbach (1965); beyond Auerbach''s reflection on the formation of vernacular
    audiences in medieval Europe, invaluable insights into the social dimension of
    vernacular literature and its circulation in the Middle Ages are those by Monfri
    (1964).'
