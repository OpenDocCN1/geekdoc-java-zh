    If Giovanni Marovana''s response to Campora''s account within the fiction of the
    dialogue is revealing the vernacular account''s expectations, the actual curation
    of the work, as we will see, illustrates several disparate attitudes that informed
    vernacular readership throughout the fifteenth century, and more specifically,
    demonstrates the active contribution of readers to the multifaceted reshaping
    of the text that generalised its reception in the period.


    # Transformative Reception


    As the textual tradition of Campora''s De immortalitate animae suggests, the dialogue
    was successfully received by the vernacular reading public. It has survived in
    sixteen manuscript copies and nine incabula. Though not comparable to those of
    the Latin translations of Aristotle, numbers are impressive for a minor work of
    this kind and are significantly larger than those of the other works encountered
    in the previous chapters. Of the extant manuscripts, eight can be dated with some
    degree of precision: the oldest is from 1448, whereas the most recent dates from
    1484, with a significant number of copies realised between the mid-1460s and the
    late 1470s, partly overlapping with the production of printed editions. The *editio
    principeps* appeared in Rome in 1472 and was followed by three editions in the
    1470s and another four in the 1490s. The case becomes even more interesting when
    we consider that its diffusion is limited to the fifteenth century. There are
    neither extant manuscript copies nor sixteenth-century editions.


