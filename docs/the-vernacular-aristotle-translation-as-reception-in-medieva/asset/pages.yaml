    their motivations behind this dynamic. Boccaccio''s Decameron is one of the clearest
    examples of this dynamic. The Novello elaborates debates over language, translation
    and the challenges entailed by both, Bocaccio''s masterpiece brings the discussion
    to an unprecedented level of awareness and self-reflection. The author''s attempt
    to outline a moral philosophy based on the observation and description of human
    behaviour provides the reader with a gallery of exempla that display moral flexibility
    and challenge the idea of a fixed ethics. Bocaccio''s positive opinion of the
