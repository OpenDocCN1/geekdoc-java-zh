    Aristotelian doctrine of the soul filtered through other philosophical sources
    as Cicero, Seneca, Boethius, the Church Fathers and the medieval communicators
    of Aristotle. Divided into six short chapters, the text follows a strict structure
    based on a sequence of questions and answers that never result in the truly conversational
