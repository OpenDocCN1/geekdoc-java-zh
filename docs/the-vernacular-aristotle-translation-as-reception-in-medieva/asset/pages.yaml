    was an artificial language created in order to cope with the progressive and unavoidable
    evolution of the natural ones. This idea remained central throughout the fifteenth
    and sixteenth centuries in discussions about the relationship between Latin and
    the vernacular. The critical assumption that a form of diglossia occurred as early
    as in antiquity, a grammatical Latin coexisted with a non-grammatical language
    no different from the vernacular of Dante, was later used by certain humanists
    to support the priority of Latin.³³⁷ However, Dante''s views were quite different:
    instead of opposing the grammatical Latin to a non-grammatical vernacular, he
