    main reasons. First, consistent with the pattern of circulation described in my
    discussion of the traditional Summa in Chapter 2, the Vatican manuscript witnesses
    the enduring success of Alderotti’s. Second, and even more relevant to the present
    discussion, the manuscript confirms that vernacular readers considered Mannelli’s
    Compendio comparable to a text like the Summa, which was itself an abridgment
    of Aristotle’s Ethics. In a way, the two texts offered an exhaustive survey of
    moral philosophy where the Aristotelian tradition was linked to the legacy of
    other philosophers whose moral teachings could also be easily appropriated by
    their vernacular readership.

