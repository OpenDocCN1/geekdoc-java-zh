    # Overlooking the Piazza


    The Venetian lay interest in all things Aristotelian has a long history. Accordingly,
    the philosopher’s visual presence in the city of Venice is significant. Even before
    Paolo Veronese sumptuously depicted Aristotle in the Salone Sanovinian of the
    Biblioteca Marciana, the philosopher had already twice appeared in an iconic public
    space near the library: the colonnade of the Palazzo Ducale facing Piazza San
    Marco. In the beautifully carved capitals of the colonnade, Aristotle is first
    presented as the emblem of dialectic with a Latin inscription describing him ‘Aristot
    dialecticus’ [c. 1350, Figure 3.1], in an image that recalls the Athenian cycles
    of the artes liberal treated in Chapter 1.


    In the capital of Justice from around 1450, John Ruskin esteemed the most beautiful
    of the entire series, Aristotle is instead identified by a vernacular inscription.
    This personification of Justice is accompanied by examples of good government
    and figures of lawmakers, and ‘Aristotle che dà lege’ (‘Aristotle who declares
    laws’, in Ruskin’s translation) appears on the right side, dominating the others
    in a position of prominence [Figure 3.2].


    Holding his Constitution of the Athenians, the philosopher is presented here as
    the emblem of lawmaking. But the connection between Aristotle and the theme of
    justice is also granted by the central role that the discussion of political virtue
    plays in his moral system, particularly in the Nicomachean Ethics.


    See Manno (1999) for a detailed discussion of the capitals. On the figure of ‘Aristoteles
    dialecticus’, part of a series of wise men that represent the liberal arts, see
    ibid: 123–55.


    See ibid: 69–77; and Ruskin (2007:364).


    On the importance of the work within the Aristotelian corpus, as well as its authorship,
    which might in fact owe to one of Aristotle’s disciples, see Rhodes (1981).'
