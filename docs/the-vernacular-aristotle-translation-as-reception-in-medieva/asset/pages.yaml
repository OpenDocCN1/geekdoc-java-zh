    # Accessing the Nicomachean Ethics in the Vernacular


    There is no record that Columbella knew Leonardo Bruni''s new Latin translation
    of the Nicomachean Ethics, which Bruni dedicated to Pope Martin V in 1417, but
    given the resonance of Bruni''s achievement across Europe, it would be no surprise
    if he did. Columbella translated Aristotle''s treatise from Robert Groseste''s
    Version, as revised by William of Moerbeke. Columbella''s choice was certainly
    consistent with his scholastic training, but it can also be read as a statement
    about the value of the Aristotelian corpus studied in universities and in schools
    of the religious orders. In, translating the text, Columbella follows his source
    closely; his vernacular text repeats syntactic and lexical features from the Latin
    Aristotle, and in attempt to offer the reader an inter-lingual replica of the
    source. Nevertheless, he does attempt to read, intervening where needed to unpack
    the opacity of his Latin source. For instance, as we will see below, he adopts
    a practical way of dealing with Grossette''s method of translating Greek words,
    a method that was heavily criticised by Bruni. While a scholar like Columbella
    would likely have endorsed Alfonso de Cartagena''s critique of Bruni''s humanist
    version of the Ethics, the practice of vernacular translation offered him opportunity
    to comment clearly on a textual tradition that he found problematic. In fact,
    Columbella not only introduces vernacular readers to the Ethics, whereas the function
    typically performed in the Latin commentary by the *accessus ad textum* (''introduction
    to the text''), but it also addresses issues of translation.


