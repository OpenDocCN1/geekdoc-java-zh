    and also highlights the nature of the text that follows. Because of the brevity
    of their conversation on the topic, Jacopo is now providing Giovanni with a more
    detailed account of the human soul based on a thorough consideration of the relevant
    auctores, philosophers and theologians, whose opinions are summarised and discussed
    in light of the Christian doctrine of the soul.


