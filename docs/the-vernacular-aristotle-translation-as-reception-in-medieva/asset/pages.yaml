  md: '# Perfecting the Merchant


    In his commentary on On Virtues a Vices, Lazzaro makes a striking comparison between
    the figure of Ulysses and the life of the fifteenth-century merchant:


    This is the kind of experience to which the Greek poet refers when he praises
    Ulysses at the beginning of the work entitled Odyssey. When the Latin poet Horace
    translates it, ''Dic mihia virum capte post Troia qui mores hominum multorum vidit
    et urbes,'' in the vernacular: ''O Muse, sing for me, make me worthy to praise
    the man who after the fall of Troy came to see and know many places and the ways
    of men''.106


    Ulysses, the classical hero that Dante identified as a controversial symbol of
    the thirst for knowledge is presented as the ideal model for merchants eager to
    improve themselves.107 Lazzaro holds that the productive combination of experience,
    prudence and knowledge, merchants (ideally of patrician rank, as with Bernardo
    Giustiniani) can acquire moral excellence. If not already members of the aristocracy,
    these merchants can become noble by attaining virtue.


    # Perfecting the Merchant


    Lazzaro Gallineta''s reference to Ulysses summarises various developments crucial
    to the fifteenth-century vernacular reception of Aristotelian moral works within
    mercantile communities. In his dedication of the Ethics to Pancrazio Giustiniani,
    Antonio Colombo depicted him as an ideal of patrician nobility, stressing both
    his willingness to read Aristotle''s treatise and the relevance of contemplation
    to the moral ennoblement of lay readers. Lazzaro''s motivations, however, shed
