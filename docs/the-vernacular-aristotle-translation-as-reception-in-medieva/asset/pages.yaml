    # The Philosopher on the Campanile


    The sculpture in the loggia of the Palazzo Ducale presenting Aristotle as an assertive
    lawmaker reminded Venetians that laws are essential to good government. An even
    wider cluster cluster of meanings — as well as a more dialogical attitude — is
    embodied in the image of Aristotle carved around 1437 by Luca Della Robbia for
    the campanile of the Florentine cathedral [Figure 4.1].


    As stated by Giorgio Vasari, the sculptor was asked to complete the series of
    Andrea Pisano’s fourteenth-century reliefs that illustrated, among other subjects,
    the sciences and the liberal arts. According to the 1568 edition of Vasari’s *Vite
    de'' più eccellenti pittori, scultori, e architetti* (Lives of the Most Excellent
    Painters, Sculptors and Architects), Della Robbia’s five tiles represent grammar,
    philosophy, astronomy and geometry. In the title representing Philosophy Vasari
    identifies the two figures as Plato and Aristotle in a debate: the elder man to
    the right would be Plato, bearded and making an expressive gesture, the younger
    man, pointing to the book he holds, would be Plato’s pupil, Aristotle.¹ There
    is no way to know whether these identities were specified in the original iconographic
    program, and, in fact, there is some chance that Vasari’s interpretation of the
    image was influenced by Raphael’s later depiction of Plato and Aristotle in the
    School of Athens at the Vatican, where Plato points to the heavens and Aristotle
    points to the ground.² identification of the two greatest philosophers of antiquity
    was commonly accepted and seldom questioned.³ Indeed, it indicates much about
    the emblematic value of the two philosophers as well as about


    > ¹ Bettarini (1966–87) 3: 50).

    ² The School of Athens was painted by Raphael between 1509 and 1511. See Hall
    (1997).

    ³ See Pope-Hennessy (1980: 30–1, 231–3, and plate 30). An alternative interpretation
    is offered by Schlosser (1896: 73).'
