    and, in a way, is integrated into his project of volgarizzamento, one that appropriates
    ideals to the coeval development of translation as a practice informed by strong
    methodological awareness.


    As far the extant documentation suggests, however, Colombella’s endeavour did
    not enjoy great success, and his translation of the Nicomachean Ethics never circulated
    beyond Pancazio’s household. One could hypothesise that Pancazio kept his beautiful
    and certainly expensive copy in his library as a token of friendship and as a
    symbol of the virtues that his noble lineage embodied. A comparison with the copious
    textual transmission of Alderotti’s translation of the Summa Alexandrinorum, discussed
    in the previous chapter, is again striking—even more so when we consider that
    the only evidence of any sort of circulation of Colombella’s Ethics results from
    the vernacular reception of the Summa.


    A shortened version of Colombella’s prologue, which includes the life of Aristotle
    but omits all references to the original dedicate, appears at the beginning of
    the Italian version of the Summa in MS It. II.134 of the Biblioteca Mariana. The
    manuscript is a coherent compilation of moral philosophy assembled in 1473 by
    an unnamed scribe for which the Summa precedes an anomalous vernacular translation
    of Aristotle’s Economics and a series of Latin excerpts from the pseudo-Aristotelian
    Secret of Secrets.⁶⁹ In a gesture that seems to highlight the authority of the
    alleged source, the Summa has the misleading title Libri Eterichorum sive moralium
    Aristotelis. In both the Summa and the Economics, furthermore, all the rubrics
