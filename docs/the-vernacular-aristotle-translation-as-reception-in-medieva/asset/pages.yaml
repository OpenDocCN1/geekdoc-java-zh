  md: '# Introduction


    offered vernacular audiences a particularly productive space for interaction with
    both the medieval academic tradition and humanist scholarship. Translation was
    not only concerned with the appropriation of values but also with the gradual
    establishment of linguistic tools to express and communicate those values. Accordingly,
    through the practice of translation, a prominent place was given to the ethical
    dimension of language and its uses.


    Translation is taken here and throughout the book in the broad meaning of the
    original Latin translatio, a meaning (or rather a cluster of meanings) that the
    vernacular cultures of medieval and early modern Europe inherited from antiquity;¹
    With its focus on the idea of transfer, the term entails processes of transformation,
    adaptation and reshaping – the same processes that are at the core of reception
    in its many forms. A further, implicit contention of the book, then, is that translation
    is not only a form of reception (and so a crucial subfield in the broader area
    of reception studies) but that it is a necessary precondition of reception.⁴ One
    could say that, no matter what are involved in the process, there is no reception
    without translation and vice versa. Or, to put in Rita Copeland’s terms, the process
    of displacement entailed by translation is always set by a moment of receptiveness.⁵
    If an act of translation is responsible for shaping a given image of Aristotle,
    this is only possible because of the way in which the translator has received
    the conceptual elements that constitute the image, including pre-existing iconographic
    traditions, iconography, as well as the variety of narratives that relate to these.⁶
    At the same time, the act of receiving an object (textual or visual)


    +   ¹ The broad meaning of the term translatio is suggested by the etymology of
    the word as described by, among others, Isidore of Seville and (2004), translatio’
    to the period that is examined here, Huguccio di Pisa; see Cecchini and Arizzoni
    (2004), s.v.’translatio’ in the Latin Middle Ages, see Chiesa (1987); for a discussion
    of the notion of translation between Vernacular and cultures in the Medieval period,
    see Copeland (1999); for a special focus on the Italian case, Domini (1967), Fojella
    (1991), Gehl (1994) and Cornish (2016). State-of-the-art collections of essays
    on early medieval cultures are Newman and Tyler (2015) and Dean Haening, Huntington,
    and Wegener (2008); a discussion of vernacular narration in fifteenth-century
    Italy is Ricci (2007).

    ⁴ For recent developments in the area of reception studies, stemming from the
    seminal contribution of Martinale (1993), see Hardwick (2005), Martingale and
    Thomas (2006), Porter and Butler (2016).

    ⁵ Copeland (1999: 35): ‘the translator performs an act of aggressive interpretation
    so as to lay open his language and usage to receive a formative influence. We
