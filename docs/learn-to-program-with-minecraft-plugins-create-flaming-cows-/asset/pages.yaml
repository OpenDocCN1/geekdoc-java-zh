  md: '# Chapter 11. Use Configuration Files and Store Data • 156


    To simplify things, our code catches the DatabaseWriteException and logs the error—basically
    just ignoring it. That can be a very "beginner''s" way to handle exceptions, though,
    and you shouldn''t always ignore them. Instead, the question to ask yourself is
    "whose problem is it, and who can fix it?"


    Normally, code that you''re calling in a library has no idea what you''re using
    for it. When something bad happens, it doesn''t know what you need to do to handle
    the problem. Should the whole server exit? Should you return an error to the user?
    Do you need to change some variables and clean up whatever you were trying to
    do? Since the library code doesn''t know, it doesn''t try to fix it. It just receives
    an exception—it throws up its hands and gives you up.


    When dealing with exceptions, you have two choices. You can either accept the
    responsibility for dealing with errors and handle the exception yourself, or you
    can throw your hands up, and pass the exception to the caller. To pass the exception
    up, you just declare that your function also throws DatabaseWriteException (or
    whatever the actual exception type is). You don''t need any try/catch at all;
    now it''s someone else''s problem.


    In theory, exceptions should be used only for exceptional things. If you went
    to spawn a cow and instead get a creeper, that would be exceptional: an unexpected
    disaster. If you just added a player to a list of players and the length of the
    list was still zero, that would indicate a disaster in progress.


    But trying to search for something that isn''t in the database, isn''t a disaster.
    It''s a common occurrence. So in that case you might want to catch the exception
    and ignore it.


    And what happens if you fail when trying to write data to the database, as we''re
    doing here? That might mean there''s a more serious problem—you might be out of
    disk space on the server. What would you do?


    If it were me, I want to shut down the server as gracefully as possible. A dead
    program does lose less damage than a broken program that''s still running. When
    writing code for most professional systems, you''ll find that''s almost always
    the best action to take: fail quickly and loudly.


    But this isn''t our server necessarily: we''ve made a plugin that someone else
    is running, and it would be rude of us to shut down your server because we can''t
    write a file. In this case, we''ll log an error message to the Minecraft console
    and struggle on.'
