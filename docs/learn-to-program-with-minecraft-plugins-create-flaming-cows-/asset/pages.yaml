    extra words, you''ll pass each word to sign.setTextOnLine(). Remember: if it can
    hold four lines, then they are numbered 0, 1, 2, and 3. We''ve got the setTextOnLine(msg,
    0) already, so you''ll need to add the others if args is setTextOnLine.


    # Next Up


