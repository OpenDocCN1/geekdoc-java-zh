  md: "# Chapter 9. Modify, Spawn, and Listen in Minecraft * 124\n\nA Player, on the\
    \ other hand, does not use Ageable, so you can't turn players into babies, even\
    \ if they're acting like them. Instead, a Player has a different set of functions\
    \ available, including functions to set and get the player's experience level,\
    \ food inventory, and so on.\n\n# Spawn Entities\n\nYou can use several functions\
    \ to spawn different entities and creatures, as well as game objects—like an Ender\
    \ Pearl². To create new things in the world, we'll use functions defined in the\
    \ EZPlugin instead of writing out all the code directly. It's not that the code\
    \ is particularly complicated or hard to understand; it's that those couple of\
    \ lines of code will be the same, so it makes sense to use a helper function.\
    \ That way you only need to use the one-line helper call, instead of using several\
    \ lines of duplicated code. Let's take a close look at what those helper functions\
    \ actually do.\n\nHere's the method we've been using to spawn cows, and squid:\n\
    \n```\nEZPlugin/src/com/pragrog/ahmine/ez/EZPlugin.java\npublic static EntityLiving\
    \ spawnEntityLiving(Location loc, EntityType type) {\n    EntityFactory factory\
    \ = Canary.factory().getEntityFactory();\n    EntityLiving thing = factory.newEntityLiving(type,\
    \ loc);\n    thing.spawn();\n    return thing;\n}\n```\n\nIt's a little messy,\
    \ but it's a common pattern. The idea is that you first obtain a factory object,\
    \ in this case, an EntityFactory. The factory works as the name implies; it generates\
    \ EntityLiving objects. But just creating a new object (even a Cow object) isn't\
    \ enough to make it in the Minecraft world. You need to tell the object to spawn\
    \ itself.\n\nSpawning particles is a bit easier:\n\n```\nEZPlugin/src/com/pragrog/ahmine/ez/EZPlugin.java\n\
    public static void spawnParticle(Location loc, Particle.type type) {\n    loc.getWorld().new\
    \ Particle(loc.getX(),\n    loc.getY(), loc.getZ(), type);\n}\n```\n\nHere we\
    \ need to use the spawnParticle function in world, and pass it a new Particle\
    \ initialized with individual coordinates x, y, and z. Again, it's not complicated,\
    \ but a helper function literally \"helps\" us keep code cleaner and easier to\
    \ read.\n\n+   2. In survival mode, right-clicking on an Ender Pearl will transport\
    \ you to where it lands.\n\n* report erratum • discuss"
