  md: '# APPENDIX 2


    # How to Read the Canary Documentation


    Many times you''ll need to read the Canary documentation directly to find out
    what to do in the Minecraft world involving a Block, a Player, an Cow, a Creeper,
    or whatever. You need to find out what classes to use and what functions they
    offer. The Canary documentation lists this information for you, and we''ll take
    a quick look here at how to find it.


    # Canary JavaDoc Documentation


    The Canary JavaDoc documentation is centered on the system''s classes, listed
    within their packages. Here you''ll find the following:


    +   - The package name, which is what you use in the import statement.¹

    - The class name, which is what you use to declare variables and create objects
    with new.²

    - The functions (methods) in the class that you can run with () and parameters.³³

    - Parent classes or interfaces that it uses, which will include additional functions
    you can call.⁴


    Point your browser to the Canary documentation, and all the hidden treasures of
    Canary are yours!⁵ Ah, what does this all mean? And where is everything?


