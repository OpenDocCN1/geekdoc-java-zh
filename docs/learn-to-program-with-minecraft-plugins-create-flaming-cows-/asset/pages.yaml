  md: "# Act Like a Stack\n\nEven though this is a Access object, we are free to add\
    \ other functions and bits of data to it help building our plugin easier. From\
    \ the perspective of the main plugin, we'd like to be able to save a SavedLocation\
    \ for a given player as a stack of Locations. That means we'll need to expose\
    \ at least a public push and pop function.\n\nHere's the first hitch: location_strings\
    \ is declared as an ArrayList<String>, not a Stack. So how would you implement\
    \ push and pop using a plain list?\n\nWell, the pop is easy: an array add method\
    \ will add a new item to the end of the list. So you just use that for the push.\n\
    \nIn order to pop the stack, you have to remove the last item in the list using\
    \ index, the size() of list minus one.\n\nOkay, that sounds reasonable. In the\
    \ push functions, you'll need to read this player's stack from the database; call\
    \ an internal, private function to actually push onto the stack; then save it\
    \ back to the database. pop will be similar: read from the database, pop the stack,\
    \ and write the new stack back to the database. If you remember back in the BackCmd\
    \ plugin, it wasn't just enough to pop the latest value—we had to use an equals\
    \ function to make sure we've moved far away from the teleport location.\n\nPutting\
    \ it all together, the public functions in SavedLocation look like this:\n\n```\n\
    BackCmdSave/src/backcmdsave/SavedLocation.java\npublic void push(Location loc)\
    \ {\n    myRead(player_name);\n    //Make save previous location is different\
    \ if it exists\n    if (peek_stack() == null ||\n        equals(peek_stack(),\
    \ loc)) {\n        push_stack(loc);\n    }\n    myWrite();\n}\n\npublic Location\
    \ pop(Location here) {\n    myRead(player_name);\n    if (location_strings.size()\
    \ == 0) {\n        return null;\n    }\n    Location loc = pop_stack();\n    myWrite();\n\
    \    return loc;\n}\n```"
