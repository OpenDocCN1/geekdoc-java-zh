    What will this code print out, and how many cakes will end up in the tower? Try
    to figure it out. Then compile and install using build.sh as usual.


    # What Happened?


    Welcome to the wonderfully confusing world of shadowing.


    In this piece of code, a variable cakeHeight is declared at the top of the plugin.
    This is variable you would expect to access anywhere within the plugin—starting
    at one line and ending at the matching brace.


    But then on the line at we declare another variable with the very same name. From
    this point until the next closing brace }, any time we mention cakeHeight we''ll
    be working with this local one, not the class-level one. This local version shadows
    the class version. When we set it to 5 and then print it, we''re modifying this
    local version.


    Calling makeCakes uses the class version to build the tower. The makeCakes function
    has no knowledge of the shadowed variable inside the cakeTowerCommand function.
    So you end up with fifty blocks; not a hundred, and not five.'
