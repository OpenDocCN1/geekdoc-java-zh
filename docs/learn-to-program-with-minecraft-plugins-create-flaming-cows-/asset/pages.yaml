    # CHAPTER 6


    # Add a Chat Command,

    Locations, and Targets


    # How Does Minecraft Know About Your Plugin?


    We''ve been using a bunch of objects in the Minecraft code. For example, you know
    that a player is represented as a Player object and the server is Server object.


    So it shouldn''t be too surprising to realize that our plugins are, in fact, Plugin
    objects. Canary has kindly defined a basic "recipe," a Basic class that it knows
    about. I''ve added an additional EZPlugin class to make things a little easier.
    Our job, as plugin writers, is to provide our own plugin code that fits into that
    framework.


    As we''ve seen, the first line of a plugin declares the plugin''s name and then
    adds the magical phrase extends EZPlugin:


    ```

    import net.canarymod.plugin.Plugin;

    import com.praprog.ahmine.EZPlugin;


    public class MyFavoritePlugin extends EZPlugin {

    ```


    That makes Plugin and EZPlugin parents of your class MyFavoritePlugin, just like
    the examples in the last chapter.


    The Minecraft server already knows how to work with a Plugin, and since your plugin''s
    parent, it now knows how to work with your plugin—even though your plugin didn''t
    exist when Canary was created. It''s counting on the fact that you''ll write a
    couple of functions that it knows to call.


    ![](img/9f468df40be6924e00c931230bae6b1a_89_0.png)'
