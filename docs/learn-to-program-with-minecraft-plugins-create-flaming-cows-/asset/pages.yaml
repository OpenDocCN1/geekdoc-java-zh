  md: "which is what the documentation tells us it needs to be, but note that we've\
    \ added the word static to this declaration.\n\n**Static** here means two things:\n\
    \n+   * You can access the variable using the name of the plugin without a plugin\
    \ object. In this case, HelloWorld.logger will work from anywhere, inside or outside\
    \ an object.\n* The static variable (logger) is common to all HelloWorld objects,\
    \ and lives on, outside the lifetime of any local variables in any object.\n\n\
    That means any of the functions within a HelloWorld object can come and go, but\
    \ the static variables will still be there and remember their values.\n\nSince\
    \ logger is the very first thing we declare our plugin, and it's not inside a\
    \ function itself, all the functions in our plugin—everything inside this top\
    \ pair of { } characters—can use it. It's not local to any function.\n\nThat you\
    \ can use logger in HelloWorld.java:\n\n```\npublic void myFavoriteFunction()\
    \ {\n    logger.info(\"Made it this far\");\n}\n```\n\nNotice that we don't need\
    \ any kind of extra declaration; you can just use logger anywhere in this plugin\
    \ that youd like. That's a handy technique to trace what's happening in a plugin:\
    \ add a logger statement and you can print out the values of variables at that\
    \ point in the code.\n\nGlobal variables like these, however, can also be dangerous.\n\
    \nWhy are they dangerous? Precisely because anyone, anywhere, can change the value\
    \ of that variable on. Maybe you know they did it, but maybe you don't—even if\
    \ \"they\" are \"you,\" from now on. If something goes wrong, you will have to\
    \ go and examine every single piece of code in the system to find out which piece\
    \ of code set the variable badly, and why. That's a lot of work and creates a\
    \ lot of opportunity to mess things up.\n\nBut sometimes you really need a global\
    \ variable like that. You may not want anyone to change it, but maybe a lot of\
    \ different pieces of code need refer to it. The logger is a good example: it's\
    \ a shared service that all plugins and the server itself use. We all need access\
    \ to the logging object, and we need it in a variable that won't go away. Unlike\
    \ with a local variable, we"
