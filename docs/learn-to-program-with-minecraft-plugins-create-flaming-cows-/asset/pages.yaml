    # Copy and Paste


    Sometimes you might want to copy a bit of text and paste it at the command line.
    For instance, you might want to copy a line from this book and paste it in.


    Copy and paste at the command line can be a little different from copying in an
    application like Mail or a web browser. You still click and drag the mouse to
    select text to begin with.


    On Linux, you can use Ctrl-C to copy and Ctrl-V to paste in most applications.
    At the command line, you may need to add a Shift key, so copy could be Ctrl-Shift-C.


    On Mac you use Cmd-C and Cmd-V to copy and paste.


    On Windows the command-line window is slightly different.


    First, you need to enable QuickEdit. Right-click the top bar of the command window
    and select Properties. On the Options tab, in the Edit Options section, check
    QuickEdit Mode tab to turn it on.


    To use: after selecting text, you need to press Enter to copy, then right-click
    or Ctrl-V to paste.


    That''s for the command prompt window. Wherever else on the system (your editor,
    etc.) you use Ctrl-C and Ctrl-V as usual.


