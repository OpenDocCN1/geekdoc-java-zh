    \ But there's no good way to connect it to the plugin yet, so we need to take\
    \ a look at that.\n\n# Convert Location to String and Back\n\nBefore we get much\
    \ further, we may well jump in and tackle the conversion functions for a Location,\
    \ as we'll need those before we start working on the stack bits.\n\nConverting\
    \ a Location to a string is easy: just build a string from each of the getX(),\
    \ getY(), and getZ() results using a non-numeric character to separate each number.\
    \ You could use spaces, but I prefer commas (\",\") as that seems easier to read.\n\
    \nWrite a function named locationToString that takes a Location and returns a\
    \ String.\n\nBut now how to go the other way? Java to the rescue! In Java doc\
    \ under, you'll find a function named \"split\", which takes a string and splits\
    \ it up into an array. If str=\"110,75,220\", then str.split(\",\",\") will return\
    \ an array of three strings: \"110\", \"75\", and \"220\".\n\nThen it's just a\
    \ matter of using Double.parseDouble(string) to convert each string into a double.\
    \ With the doubles, you can create a new Location.\n\nNow you can write a function\
    \ named stringToLocation that takes a String and returns a Location.\n\nWhen you're\
    \ done, it might look like this:\n\n```\nBackCmdSave/src/backcmdsave/SavedLocation.java\n\
    private String locationToString(Location loc) {\n    return loc.getX() + \", \"\
    \ +\n           loc.getY() + \",\", \" +\n           loc.getZ();\n}\n```\n\n```\n\
    private Location stringToLocation(String str) {\n    String[] arr = str.split(\"\
    ,\",\");\n    double x = Double.parseDouble(arr[0]);\n    double y = Double.parseDouble(arr[1]);\n\
    \    double z = Double.parseDouble(arr[2]);\n    return new Location(x, y, z);\n\
    }\n```\n\nMake sure that much stuff compiles, using build.sh as usual."
