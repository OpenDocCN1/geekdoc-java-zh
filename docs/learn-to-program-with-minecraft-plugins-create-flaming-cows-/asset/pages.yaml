  md: '# Use the Command Line


    The command line looks something like this on my computer. Yours may use different
    colors and fonts, and you can usually set these to your liking. I apparently prefer
    black colors on a tan background:


    ```

    Terminal bash 80x24

    Last login: Thu Sep 19 17:04:45 on tty003

    -$

    ```


    You access the command line a little differently depending on the kind of operating
    system you''re running, which will be one of these:


    Windows comes with a very bare-bones command line. You get to it by running cmd.exe.
    If your version of Windows has a "Start" command, you might be able to select
    Start -> Run and enter cmd.exe or use the search box that comes up to find and
    run cmd.exe. By itself; follow the instructions on page 4.


    On Mac OS X, you access the command line via Applications -> Utilities -> Terminal.


    If you''re running Linux, you likely already know how to get to a command-line
    shell. For the sake of completeness, and because it''s called different things,
    try any of these: open a shell, start a Konsole, or right-click on the Desktop
    to open a Terminal.


    (Fortunately, all of these pesky differences between Windows, Mac, and Linux disappear
    once you''re writing Java code: Java runs the same on each platform.)


    Once you have your command-line application up and running, you''re ready to type
    commands into the command-line processor, or shell, as I call it. You''ll be using
    a few simple commands that show you how to go along.


    Each shell prints out a short message indicating you''re ready to type something
    in. But instead of a straightforward prompt like "Ready for you to type, master,"
    most command prompts are a little more cryptic.


    Windows will show something like C>. Linux and Mac systems show $ or %. Any of
    these prompts might include additional information, like your name, the computer''s
    name, or a directory name. Since that will be different for everyone, I''m going
    to choose the simplest one for the examples in this book and show the command
    prompt as a $. Whatever your prompt looks like, that''s where you type in commands.'
  merge: -1
