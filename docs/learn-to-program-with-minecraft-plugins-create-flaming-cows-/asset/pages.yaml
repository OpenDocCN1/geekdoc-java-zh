    Ah, that clever: Git recognized you''d made some changes to the README.txt file
    and that those haven''t been saved yet. A commit will fix that, and once again
    you can get the relaxing "nothing to commit, working directory clean" message:


    ```

    $ git status

    # On branch master

    nothing to commit, working directory clean

    ```


    There''s one important rule to remember:


    *Don''t leave the scene until the working directory is clean.*


