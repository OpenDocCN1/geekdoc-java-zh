    # Schedule to Run Once, or Keep Running


    You can specify how your task is running by setting a delay until it starts, and
    setting whether it should run just once or keep running. Have a look at the first
    thing we do in our constructor: the call to super(). The call to super will turn
    call the constructor in the parent class, ServerTask, with the needed information.


    The ServerTask constructor takes three arguments: the server itself, a delay to
    wait before running, and a boolean flag that should be true if this task keep
    running continuously, or false if it should be only once (one-shot). If you set
    it to run continuously, the task will run forever until you cancel it.


    We could change the previous example to delay for 60 seconds before running once:


    ```

    super(Canary.getServer(), 1200, false);

    ```


    At 20 ticks per second, 1200 ticks will be about 60 seconds (one minute).


