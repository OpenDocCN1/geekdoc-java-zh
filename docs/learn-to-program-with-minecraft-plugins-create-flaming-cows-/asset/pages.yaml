  md: '# Install the Java Programming Language


    “Java” isn''t just one application—it’s actually several. The Java compiler, javac,
    the Java program runner, java, and the archiver utility, jar. javac takes your
    text file and creates a magical pile of junk it calls a class file. You run the
    java command and tell it to use thatat pile of junk, and your program springs
    to life. We''ll look at that process in more detail as we go along, and that''s
    the gist of it.


    You might have Java installed already. Try running the Java compiler, javac, and
    see if it''s:


    ```

    $ javac -version

    javac 1.7.0

    ```


    Yup, it''s installed on my machine, version 1.7. If it was not installed, I''d
    get a message like this:


    ```

    $ java -version

    bash: java: command not found

    ```


    You might also want to check that your java is indeed the same version as your
    java (it should be, but things happens):


    ```

    $ java -version

    java version "1.7.0.67"

    Java(TM) SE Runtime Environment (build 1.7.0_67-b01)

    Java HotSpot(TM) 64-Bit Server VM (build 24.65-b04, mixed mode)

    ```


    If you need to install Java, the Java Development Kit Standard Edition (JDK SE)
    version 7 or later, which you can download for different operating systems. Depending
    on your operating system and vendor, may or may not have Java installed, you might
    only have java and not java, or you might have a slightly different version. Again,
    you''ll need JDK 1.7 or later to work with the examples in this book.


    No matter what operating system you install, I heartily recommend you accept all
    the default answers to any install questions, especially for the install location.
    Java and its associated programs can get more than a little quirky and fussy if
    things aren''t where they expect.


    So download the Java Development Kit (JDK) installer and follow its instructions.


    +   3. http://www.oracle.com/technet/java/javase/downloads/index.html'
