  md: '# Chapter 6. Add a Chat Command, Locations, and Targets • 82


    Location objects are important—that''s how you get and set the coordinates of
    anything in Minecraft. Here''s how we''ll manipulate locations to fling the creatures
    in the air.


    # Use Minecraft Coordinates


    A Location stores three coordinates: x, y, and z, as the following figure shows.


    ![](img/9f468df40be6924e00c931230bae6b1a_92_0.png)


    The x value goes west (negative) to east (positive), the z-coordinate goes north
    (negative) to south (positive), and y goes down (negative) to up (positive), with
    a y value of 0 being between the bottom layer of bedrock and 64 being sea level.
    This means that to make a player or other entity fly up in the air, you need to
    add some to the y value.


    We''ll get each target''s current value from loc and save it as y. Next we''ll
    change the value in loc by adding 50. Here''s the fun part: by calling target.teleport(loc)
    we tell the target to teleport itself to this new location.


    Whew! That''s a lot of stuff in a few lines of code. But if you hit a shot and
    compile it using build.sh just like you''ve been doing:


    ```

    $ cd Desktop

    $ cd code/SkyCmd

    $ ./build.sh

    ```


    Stop and restart your server, and try out the new command /sky for fun. Make sure
    you are in survival mode instead of creative mode, and wait for night to fall
    and the creepers to come...


    +   1. In the Minecraft game, you can do this by typing /gamemode c for creative
    or /gamemodes for survival.'
