    # Domain Name


    When you set up your VPS, your VPS provider will tell you the IP address for your
    server. That''s the number anyone in the world can use to connect to your server.
    An IP address is usually four sets of numbers with periods in, like 93.184.216.119
    (example.com) or 127.0.0.1 (your local machine, localhost).


    You can set up a domain name so folks can find you by a name like pragprog.com
    or example.com instead of a name like 93.184.216.119. Your VPS provider may be
    able to arrange this for you as an optional service, or you can use one of many
    providers on the Internet.


    Typical costs are around $10-20 a year for domain name registration. That gives
    you the right to use your name. You also need someone to run a DNS server that
    says your name corresponds to your IP address. Many registrars offer this service
    in addition to the name registration itself, or you can use a separate vendor.


    To find out if the domain name you want is available, you can use the command-line
    tool. Be careful using any other tools to check for a domain name: squatters and
    other unsavory sorts have been known to watch for domain name searches on the
    Web and grab the name before you can sell it to for a lot of money.


    As with any service on the Internet, check around for reviews and comments. Some
    big-name DNS providers that advertise heavily during major sporting events have
    a very bad reputation.


    # What''s Next


    These few pages scratch the surface of what can be very deep topics.


    There''s a lot you can do as a Linux system administrator that we''ve covered,
    including running tasks at particular times, backing up data, applying system
    security and update patches, preventing griefers, performance, and setting up
    your own email server—all kinds of fun.


    Whole books are written on these topics, and this isn''t one of them. Hopefully
    this is enough to get you started.'
