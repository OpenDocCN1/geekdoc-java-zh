  md: '# Modify Entities


    Entities, as you might expect, are quite different from blocks. For one thing,
    there are more kinds of entities, and they have different kinds of abilities (and
    functions for us). With blocks, all you have to do the block type and perhaps
    add some additional information (like on a sign), but entities are more complicated.


    To start, all entities have the capabilities described in net.canarymod.api.entity.Entity.
    Each Entity object includes the following functions:


    | getLocation() | Return the Location of the entity |

    | setFireTicks(int ticks) | Set time to keep an entity on fire |

    | setRider(Entity rider) | Set the entity''s rider |

    | spawn() | Spawn this kind of Entity into the world |

    | teleport(Location location) | Teleport the entity to a new location |


    Then, depending further on the type of the entity, you might have other functions
    to play with. Living entities (net.canarymod.api.living.EntityLiving), for example,
    have the extra functions that nonliving entities dont have:


    | getItemInHand() | Return the item this entity is holding |

    | setAttackTarget(LivingBase base) | Set this entity''s attack target |

    | getHealth() | Return a double of this entity''s health. It can be zero (dead)
    up to the amount returned by getHealth(). |

    | setHealth(double health) | Set the health. Zero is dead, without causing damage.
    |

    | kill() | Kill this entity, causing damage (and loot drops, etc.) |


    You may have noticed that not all these functions are declared in EntityLiving
    itself. This is Java gets a little messy. The familiar entity objects incorporate
    a lot of different parent recipes. For instance, a Cow is an Ageable, an EntityAnimal,
    an EntityLiving object, and of course, an Entity.


    That means it uses functions from all these different parents. For example, because
    Cow inherits from Ageable, you get functions where you can alter a Cow property
    to change its growing age.'
