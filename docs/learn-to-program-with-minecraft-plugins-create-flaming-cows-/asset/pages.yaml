- img_proc: true
  md: "# Chapter 4. Plugins Have Variables, Functions, and Keywords • 62\n\nIt's just\
    \ like the real world. We run on \"if\" statements all the time. If your age is\
    \ >= 16, you are allowed to drive. If the door is unlocked, you can open it, or\
    \ you cannot. If the command given to Minecraft is equal to \"hello\", then send\
    \ a message. If your health drops to zero, you're dead.\n\nThis is what it looks\
    \ like in Java:\n\n```\nif (something)\n  // run this code...\n}\n```\n\nThe part\
    \ in parentheses (something) can be anything that turns out true or false; in\
    \ other words, a Boolean condition (more on that in just a second).\n\nIf you\
    \ need to, you can also put code to run if something is true and specify what\
    \ to run if it's false:\n\n```\nif (something)\n  // run this code if something\
    \ is true\nelse {\n  // run this code if something is false\n}\n```\n\nFor example,\
    \ here's a fragment of code that will say something different depending on whether\
    \ the String in the variable playerName contains Notch.\n\n```\nif (myName.equalsIgnoreCase(\"\
    Notch\") {\n  say(\"Greetings from Notch!\");\n} else {\n  say(\"Notch isn't here\
    \ anymore.\");\n}\n```\n\nif statements (with or without the else) are critical\
    \ to programming: that's how you can get the computer to make decisions and pretend\
    \ to \"think.\" powerful stuff, but really simple to use.\n\n# Compare Stuff with\
    \ Boolean Conditions\n\nif statements decide what to run based on whether something\
    \ is true. But what is true?\n\nBesides numbers and strings that we've seen, you\
    \ can also make a variable that keeps track of whether something is turned on,\
    \ like a toggle switch. In Minecraft, we'll use this to determine all sorts of\
    \ things: if a player is on the ground, or if a string matches another string,\
    \ whether to use a game event or ignore it, and much more.\n\n![](img/9f468df40be6924e00c931230bae6b1a_73_0.png)"
