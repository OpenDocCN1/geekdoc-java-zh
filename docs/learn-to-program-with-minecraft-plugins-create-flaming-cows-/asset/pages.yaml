  md: '# floating point


    A number with a decimal point and fractional part, like 1.25.


    # function


    A list of Java instructions, declared with a return type, a name, parameters it
    takes, and a block of code between { and }.


    # global variable


    A variable that can be used by multiple functions and/or multiple classes.


    # hash


    A list of objects indexed by any kind of object (but usually by a string).


    # HashMap


    Java class that implements a hash.


    # import


    A Java keyword that lets you use a class from another package, such as java.util.HashMap
    (which is the HashMap class in the java.util package).


    # inherit


    To use something from a parent.


    # integer


    A whole number with no decimal point and no fractions, like 7.


    # I/O


    Input/output: sending and receiving data from somewhere else, such as a file or
    over the network.


    # iterator


    An object that lets you retrieve one value at a time from some kind of collection
    (like an ArrayList or HashMap).


    # jar


    A Java Archive file that contains .class and configuration files.


    # keyword


    A word defined by Java as part of the language. You can''t change keywords or
    use their names as variables.


    # listener


    A function that will be called when something interesting happens.


    # literal


    A value you type in directly, like 123, true, or "Notch".'
