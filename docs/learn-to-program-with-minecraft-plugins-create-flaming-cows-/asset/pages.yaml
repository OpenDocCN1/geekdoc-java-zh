  md: "```\n@Column(columnName = \"x\",\ndatas = DataType.DOUBLE)\npublic double x;\n\
    ```\n\nNow system will know how to store each coordinate. We can do almost the\
    \ same thing for the player's name:\n\n```\n@Column(columnName = \"player name\"\
    ,\ndatas = DataType.STRING)\npublic String player_name;\n```\n\nthis time, specifying\
    \ that it's a String type. But we need to add a little something extra for the\
    \ player_name. We want this field in the database to be unique: the primary key.\
    \ There should only one record in the database with x, y, and z for any one player\
    \ name. You specify that the columnType, like this:\n\n```\n@Column(columnName\
    \ = \"player_name\",\ncolumnType = Column.ColumnType.PRIMARY,\ndatas = DataType.STRING)\n\
    public String player_name;\n```\n\nNow that columns are specified, you need to\
    \ name the database table that will hold these records. You do that right in the\
    \ constructor:\n\n```\npublic AllPlayerLocations() {\n  super(\"all_player_locations\"\
    );\n}\n```\n\nThat tells the database that you want to save these fields in a\
    \ database table named all_player_locations.\n\nFinally, you need to make this\
    \ class extend the DataAccess parent class, and add a method getInstance that\
    \ returns an object of this class. So all together, the final DataAccess class\
    \ looks like this:\n\n```\nLocationSnapshot/src/locationsn/AllPlayerLocations.java\n\
    package locationsn;\n```\n\n```\nimport net.canarymod.database.Column;\nimport\
    \ net.canarymod.database.Column.DataType;\nimport net.canarymod.database.DataAccess.DataAccess;\n\
    ```\n\n```\npublic class AllPlayerLocations extends DataAccess {\n  @Column(columnName\
    \ = \"player_name\",\n  columnType = Column.ColumnType.PRIMARY,\n  dataType =\
    \ DataType.STRING)\n  public String player_name;\n```\n\n```\n@Column(columnName\
    \ = \"x\", dataType = DataType.DOUBLE)\npublic double x;\n```"
