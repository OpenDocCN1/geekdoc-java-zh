  md: '# script


    A text file containing shell commands (or another text language, like Ruby or
    Python).


    # server


    A piece of software that runs in the background, usually on another machine, that
    can serve multiple client connections. Can also refer to the remote machine.


    # shadow


    A variable with the same name as another variable in its scope is said to shadow
    it. Chaos may ensue.


    # shell


    See command line.


    # source code


    Java language statements that you''ve typed into a file.


    # static


    A variable or function that is not in any particular object.


    # string


    A bunch of human-readable characters held in a variable.


    # symbol


    A bunch of human-readable characters that has special meaning to the Java compiler
    as part of your program''s language.


    # task


    A piece of code running in a thread, with a well-defined purpose.


    # text file


    A file that contains human-readable text characters.


    # thread


    One list of functions, executed in order by the computer. Threads can be interrupted
    by other threads.


    # tick


    An arbitrary unit of time. A Minecraft server tick is about 1/20 of a second.


    # variable


    A named holder of data. Can be an immediate value, like 15, or can point to an
    object, like a Player or a Cow.'
