  md: 'Although there''s space for 5 values, we''re only using the first 3 here, and
    that''s okay.


    Getting values out looks just like putting values in, only the other way around.
    Using the code we looked at, we retrieve the values like this:


    ```

    int myBestQuiz = quizScores[1];nintBadDay = quizScores[2];

    ```


    To all the values, you can use an old-fashioned for loop:


    ```

    for (int i=0; i < 5; i++) {

    me.chat("Quote score #" + i + " " + quizScores[i]);

    }

    ```


    Remember that Array is a fixed size; if you try to retrieve a value that''s the
    end of the array (like quizScores[15]), your plugin will throw an error and crash.
    In this case, since we define the quizScores array to have a size of 5, you can
    safely store and retrieve values at index 0, 1, 2, 3, and 4. That''s why we use
    i < 5 in the middle, instead of <=.


    It''s a lot to use the Array''s length field instead of hard-coding a number like
    "5." So it would be better to write like this:


    ```

    for (int i=0; i < quizScores.length; i++) {

    me.chat("Quote score #" + i + " " + quizScores[i]);

    }

    ```


