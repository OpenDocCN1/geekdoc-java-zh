    # CHAPTER 4


    # Plugins Have Variables, Functions, and Keywords


    As you may have noticed, there''s a lot of it in the plugin source code that I
    haven''t explained it yet. Let''s dig deeper into Java and take a look at all
    that text means—the raw material of programming plugins.


    As you saw in [Chapter 3, Build and Install a Plugin, on page 31](#), a program
    in Java is a text file. Look at the text in HelloWorld.java: there''s a lot of-English
    words, and some strange-looking punctuation. All of it means something, and the
    Java compiler is picky when it''s reading your about. First of all, calling characters.
    Entity is not the same as Entity. Player is not the same as player, so uppercase
    and lowercase matter, too. There are times you use uppercase, and times you need
    to use lowercase.


    Each of those odd characters has a special meaning, and they''re used for different
    things. Here are some examples (don''t worry much about the details):


    ```

    // Comment, used to leave a note for yourself or others. Java will ignore anything
    you type from after the double slash to the end of the line.

    ```


    ```

    /* longer comment */

    Used for longer comments, either on one line or spanning multiple lines.

    ```


    ```

    () Parentheses, used when calling a function and passing data to it, like this:
    System.out.println("Hello, Creeper");

    ```


    ```

    [] Brackets, used for choosing one item from a list of items, like this: second
    = myArray[1];

    ```'
