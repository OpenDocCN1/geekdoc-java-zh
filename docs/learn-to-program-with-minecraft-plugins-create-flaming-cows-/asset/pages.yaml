  md: '# VPS Features


    While pricing and features can vary a lot for VPS offerings, here are some commonalities
    and things to look for:


    +   - VPS systems include a web-based front end (one named panel is very popular)
    that allows you to reboot the system, add users, and that sort of kind.

    - While a fast computer is always good to have, Minecraft is more sensitive to
    the amount of RAM you have available. You want a package with much RAM as you
