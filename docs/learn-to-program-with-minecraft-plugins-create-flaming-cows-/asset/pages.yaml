    # Check Permissions


    Sometimes when writing a plugin, you might want to restrict the commands you created—maybe
    only ops run them, or you may have different kinds of players or teams, and each
    should only be able to run certain commands.


    For instance, suppose you want to restrict the firebow commands to a select set
    of players. We''ll invent a new name: let''s call commands.firebow.enable.


    You can then use the permissions field in the @Command annotation to check if
    the player issuing the command is one of the chosen:


    ```

    @Command(aliases = "firebow" },\ndescription = "Disable firebow behavior",\npermissions
    = "commands.firebow.enable" },\ntoolTip = "/firebow")

    ```


    Now only players who have the permission for commands.firebow.firebow.enable can
    shoot the massively exploding firebows. Great. So how do you grant these permissions?


    # Setting and Managing Permissions


    Setting and managing permissions can be a big deal if you''re running a server
    with lots of users. You might set up groups or classes of users in the server,
    using the Canary permissions.


    Canary provides a bunch of in-game commands, including commands to set permissions
    for players and groups, and to check what permissions someone has. You can run
    these commands in the server console, or from inside the client. Here are some
    examples:


    +   - /playmod permission add permissionName—grant the permissionName to playerName.

    - /playmod check playerName permissionName—check if playerName has the permission
    permissionName.

    - /playmod group set playerName groupName—add playerName to the groupName.

    - /group permission list groupName—list permissions for groupName.'
