- img_proc: true
  md: 'For example, a Cow object in Minecraft has a lot of functions you can call.

    Here are a few of them:


    +   - teleport(Location location)

    - setFireTicks(int ticks)

    - setAge()

    - getAge()

    - swingArm()


    It also maintains some internal state: some variables to keep track of individual
    cow''s location, whether it''s on fire, its age, and so on.


    These are all things you can do with a Cow object. But they wouldn''t make sense
    for a player, or an arrow, or a tree.


    You want to keep cow things in the Cow object, arrow things in the Arrow object,
    and so on. If you don''t, then things can get awfully confusing awfully, and you
    might end up writing a pile of code that you can no longer understand or work
    with. This is really a matter of good hygiene, like keeping milk in the milk carton
    in the fridge and not storing it in the pretzel bag in the closet. You''d even
    want to mix corn chips with potato chips, to continue with this metaphor.


    Keeping separate things separate in different objects is the easy part.


    The hardest aspect of programming is this problem of dealing with very low-level
    details and very high-level details at the same time. We call these levels of
    abstraction. Let''s face it: when you''re writing code to deal with a player in
    Minecraft, it''s not the actual person playing the game. Somewhere there is an
    actual person, sitting there, sweating, eating chips and listening to loud music.
    Your piece of code is an abstract representation of real-life player; an abstraction
    that includes the data and behavior you need to be of the game.


    And just as in the real world, each abstraction can contain parts. So you can
    choose to focus on molecules or planets as you need to—or in software, the molecule
    objects or planet objects. You can zoom in and out to the level you need to be
    at, and work with the parts you want.


    Let''s take a closer look at what that means in Minecraft and Java.


    # Combine Data and Instructions into Objects


    Suppose you were to write a game like Minecraft from scratch. You would have a
    bunch of players in the game. Each one would have its own name'
  merge: -1
  pgno: 80
- img_proc: true
  md: 'inventory, health points, and so on, but the structure of each player would
    be the same.


    That is, every player would have the same collection of variables (name, health,
    location, and so on) and the same functions that you''d want to run (set this
    player''s health, teleport the player to a new location, that sort of thing).
    That''s where objects come in.''d create an object in Java to represent each player
    in the system. You''d write code to do things to a player, and that code would
    work no matter which player you were using at the time. That''s exactly what the
    Minecraft folks do. Here''s how works.


    In Java, you can define a pile of variables and a bunch of code that uses variables,
    sort of defining a recipe. You can then create and use an object that''s built
    from that recipe. Java calls this kind of recipe a *class*. From that class recipe,
    Java will be making objects. Look at the following figure; you have a few variables
    and some functions for a sample Player class, and some objects it can make.


    | Player |

    | int health;| String name;| Location location;| setHealth();| teleportTo();|
    getName(); |


    A class is like a recipe...


    ...that can make a bunch of objects; all have the same functions, but each with
    their own values:


    ![](img/9f468df40be6924e00c931230bae6b1a_81_0.png)


    ```

    int health=100;

    String name="Fred";

    Location=100,65,250

    ```


    ```

    int health=6;

    String name="Kim";

    Location=340,76,225

    ```


    ```

    int health=56;

    String name="Pat";

    Location=10,82,123

    ```


    It''s just like building objects from Lego blocks: the blocks may all be the same,
    but when you follow the printed instructions that come with the kit, you can build
    a spaceship.'
