  md: '# Chapter 4. Plugins Have Variables, Functions, and Keywords • 46


    Java does try to keep you from mixing apples and oranges. Although it doesn''t
    know that you''re using an int as a "human age." it knows the difference between
    things like an int, a float, a String, and so on. And it won''t let you mix up
    those types. If you''ve declared a variable that should hold an integer, you can''t
    try to store a String in it. This will throw an error:


    ```

    int age = "old enough to know better"; // Error!

    ```


    We tried to store a string of characters in an int. That won''t work, and Java
    will complain. You can''t go the other way either. Here''re trying to store an
    integer value (42) into a variable declared to hold a String:


    ```

    String answer = 42; // Error!

    ```


    But for common types such as numbers and strings, there are ways you can convert
    things back and forth as needed, if it makes sense. For instance, suppose you
    need a numeric value from something the user typed, and it was given to you as
    a string str. You can make it an int like this:


    ```

    String str = "1066";nint value = Integer.parseInt(str);

    // value is not set to 1066 as a number

    ```


    So you can convert, but you have to do it yourself: Java won''t guess for you.
    There''s a list of common type conversions, including ones we haven''t covered
    here, in Appendix 5. Cheat Sheets, on page 241.


