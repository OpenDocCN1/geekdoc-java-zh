    \ In fact, you might see another subtle trick in: instead of making the helper\
    \ function public, I declared it to be private. What's that about all?\n\n# Keep\
    \ Things Private or Make Them Public\n\nSo far, we've tended to use the Java keyword\
    \ public when making static variables and defining functions and plugins. That\
    \ tells Java that the we're defining publicly accessible—all of our plugin code\
    \ can use it, and any other plugin in the system can use it as well (like when\
    \ we use logger).\n\nThere is another option. You can create functions or variables\
    \ or even helper objects that no one else can see. Instead of public, you can\
    \ make them private.\n\nIn programming, there's a simple rule—so it's the kind\
    \ of thing you'd tell a five-year-old: don't expose your privates.\n\nIn other\
    \ words, if you're using a function or something that only you should use, mark\
