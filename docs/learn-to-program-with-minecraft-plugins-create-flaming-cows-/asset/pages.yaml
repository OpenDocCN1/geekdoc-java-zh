    run a command like this:


    ```

    $ sudo apt-get install openssh-server

    ```


    sudo runs the command as root; apt-get is the package-manager command under Ubuntu,
    and you''re giving it the option to install the package openssh-server.


    On CentOS, you''d run a very similar command, but using yum instead of apt-get.


