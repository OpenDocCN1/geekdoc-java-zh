  md: '# Chapter 13. Design Your Plugin · 202


    A quick look through the Canary documentation for events under net.canary-mod.hook
    reveals just what we need: a ChunkLoadedHook when a part of the world is loaded,
    and a ChunkUnloadHook when it''s deleted. So each time a 16x16 chunk of the world
    gets loaded, we''ll get an event. One minor nit: the chunk tells us which chunk
    it is in a grid of chunks; you have to multiply by 16 to get a real-world coordinate.


    Our to-do list includes these items:


    +   * Add an DamageHook event handler so the cow doesn''t die.

    * Add getClosestPlayer so each cow can find a nearby target.

    * Add ChunkLoadedHook to spawn cows in a 16x16 area.

    * Add the ChunkUnloadHook to remove cows from that chunk.

    * Set up a tasker so each cow can find a target. jump, and explode if needed.

    * Manage the allCows in all these functions (add to on spawn, delete on death,
    or unload).


