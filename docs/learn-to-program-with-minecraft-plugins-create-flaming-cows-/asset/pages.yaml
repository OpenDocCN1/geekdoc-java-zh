  md: '# Appendix A. How to Install a Cloud Server · 234


    Your public key is id_rsa.pub, and you''ll need to add that to a file named ~/.ssh/authorized_keys
    on the server.


    To do that, make the .ssh directory on the server first. I''ll show the login
    prompt on the server as $ so you can tell which machine I''m on.


    ```

    $ ssh username@example.com

    Password:

    Welcome to My Awesome Minecraft Server

    Last login: Mon Feb 16 12:16:57 from xyzzy-plugh

    Server$ mkdir .ssh

    ```


    Now back on your computer, the id_rsa.pub file (or whatever file is named) to
    the server using scp, putting it in the .ssh directory and renaming it authorized_keys:


    ```

    $ scp id_rsa.pub username@example.com:~/.ssh/authorized_keys

    ```


    That will copy the file to your .ssh directory under your home ("~”), and it authorized_keys.
    If you want to later, you can add keys from other machines into this file (that''s
    why "keys" is plural). But for now you have just one entry.


    Finally, you need to go back on the server and check and fix the file permissions.
    The .ssh directory should be readable and listable only by you, and in most cases,
    ssh will not work all if the file permissions aren''t restricted. It''s for your
    own good.


    You can set the file permissions using the chmod command:


    ```

    $ ssh username@example.com

    Password:

    Welcome to My Awesome Minecraft Server

    Last login: Mon Feb 16 12:26:13 from xyzzy-plugh

    Server$ cd .ssh

    Server-~/ chmod 700

    Server-~/ chmod 600 authorized_keys

    ```


    Now from your computer, you should be able to ssh or scp without having to specify
    a password:


    ```

    $ ssh username@example.com

    Welcome to My Awesome Minecraft Server

    Last login: Mon Feb 16 12:32:07 from xyzzy-plugh

    Server$

    ```


    And we''re in!


    Your next question may be: "Swell, but how do I get OUT?" Fair enough.'
