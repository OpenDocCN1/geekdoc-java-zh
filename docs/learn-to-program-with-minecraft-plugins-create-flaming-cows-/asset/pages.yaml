  md: "Is your head full yet? I hope not, because you have a few fun things\nleft\
    \ to learn. In this chapter we'll add these abilities to your toolbox:\n\n+  \
    \ - Use local variables that exist only within a block\n- Use class-level global\
    \ variables that can be accessed from any-where in the class\n- Keep piles of\
    \ data in arrays\n\n# CHAPTER 7\n\n# Use Piles of Variables: Arrays\n\nNow that\
    \ we can create a plugin command to do something, we need to take\na look at how\
    \ to remember stuff—in other words, how to better use Java\nvariables to keep\
    \ track of values. We'll see when to use which kind of variable\\and how to work\
    \ with piles of data in different ways (things like lists of Player\nobjects),\
    \ and we'll build a couple of cool plugins along the way.\n\n# Variables and Objects\
    \ Live in Blocks\n\nVariables live inside blocks. We've seen and been using blocks\
    \ all along;\nblocks are the bits of code written between braces—{ and }.\n\n\
    Java is a \"structured\" programming language. It descended from a\nofamily of\
    \ languages going back to the Algol of the 1960s, a line that\nextends from the\
    \ mother of all programming languages, C. its children C++\nand Objective-C, and\
    \ down to its half-cousin-step Java. After Java was\naround, Microsoft came out\
    \ with#, which is (totally nearly)\nidentical to Java. All of these languages\
    \ work more or less the same way.\n\nIn these languages, you work with blocks\
    \ of code. This like if states\nwork with blocks of code. Objects we define (like\
    \ our plugins) are blocks of code.\nThe whole structure of the language is based\
    \ on blocks of code within.\n\nAnd's where variables live. For instance, in the\
    \ HelloPlugin, look at\nthis section where we create and send a message:\n\n```\n\
    public void helloCommand(MessageReceiver receiver, String[] parameters) {\n  String\
    \ msg = \"That'sss a very niccee EVERYTHING you have there...\";\n  Canary.instance().getReceiver().broadcastMessage(msg);\n\
    }\n```\n\nIn the body of this function we declare and assign a variable named\
    \ Msg. Its\na local variable—it lives only while this particular block is running.\n\
    \n![](img/9f468df40be6924e00c931230bae6b1a_98_0.png)"
