  md: '# Start Here


    Welcome!


    Thanks for taking the time to pick up this book. I hope you''ll find it a quick
    read and have a lot of fun along the way. If you''ve written a program before,
    don''t worry. We''ll take it slow and start at the very beginning. No experience
    required.


    Everyone loves Minecraft. I think a big reason for its success is that you get
    to participate in making the game. You get a chance to build; to create. Whether
    it''s a quick shelter in survival mode or a huge Redstone simulation or your very
    own castle, you get to create.


    But sometimes the Minecraft game''s built-in capabilities aren''t enough. You
    want to do something more. You want to shoot flaming cows or encase an opponent
    in a cage of solid rock. For these and many other abilities, you need to add features
    to the game itself.


    Applications on your computer or phone are written in a special kind of text we
    call programming languages. They''re not rough or hard to learn as natural languages,
    such as English or Spanish or Chinese, but they are different from the language
    you use to write and talk in every day.


    There are many, many programming languages in use today. Some are very popular
    and not very powerful. Some are used only by a handful of people but are incredibly
    powerful and difficult to master.


    Minecraft is written in the Java programming language. Java is moderately powerful,
    but it also has hard and confusing parts. We''ll focus on the basics and sidestep
    the difficult stuff.


    This is a fast-and-loose book to get you programming in Java quickly. You''ll
    learn enough of the Java programming language to create your own Minecraft plugins
    and accomplish common tasks in Java.'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'We''ll take a look at setting up your own Minecraft server, keeping cloud-based

    backups of the code you write, and we''ll take a peek at a few advanced coding

    techniques.


    # Who This Book Is For


    This book is aimed at readers who have no experience programming, but who

    do some experience playing Minecraft. If you aren''t familiar with

    Minecraft, there are plenty of videos and books to help you get started. But

    I''m guessing you are already pretty adept and enthusiastic about Minecraft,

    and you want to learn the programming end.


    Readers younger than 8 or 9, or readers of any age who are having trouble

    understanding programming in Java, might want to take a short detour and

    experiment with a friendlier programming language first. Scratch and the

    newer version, Snap!¹ are great languages that help you learn the basic

    concepts of programming. They show how programming elements fit together

    visually. Once you get the hang of that, then coming back to a text-based

    language like Java can make a lot less sense.


    Otherwise, just need a modern computer running Windows, Mac OS X,

    or Linux, and we''ll all go from there.


    # Getting Started


    Minecraft is designed as a “client-server” application. That means it''s split

    into two parts.


    First, there''s the client, which is the application you run on your desktop or

    laptop computer. The client renders images of the Minecraft world and accepts

    your commands to move and act in the game.


    Second, there''s the server, which keeps track of everything in the game,

    including all the players who are connected, their inventories, what they''ve

    built, where they are, and so on. Most of the time the server is running onnssome
    faraway machine in another part of the country. But it could be running

    ylon your laptop or desktop computer as well.


    The client and the server talk to each other the network, the same way you

    a web browser to connect to servers and play games or see pictures of cats.


    +   1. http://scratch.mit.edu

    2. http://snap.berkeley.edu'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'To add or change functionality in the Minecraft game, you have to add or change
    the Java program on the server. That''s what you''ll learn to do in this short
    book: program in Java by writing Java instructions (which we call "source code,"
    or just "code" or just "program") to create plugins for the Minecraft server.
    A plugin is just a piece of code that you add to an existing program.³


    Before we get started with plugins, you need to set up a local Minecraft server
    for testing, and install the Java programming language and a couple of other applications.
    We''ll go over all of that in the first few chapters. Installing stuff isn''t
    very much fun by itself. In fact, it''s boring as dirt. But we''ll try to get
    through the dirt pile as fast as we can.


    In fact, to help you keep track of your progress, a "Growing Toolbox" sidebar
    at the end of each chapter shows a progress bar. You will start from just plain
    dirt:


    ![](img/9f468df40be6924e00c931230bae6b1a_12_0.png)


    And finish up with 100% grass:


    ![](img/9f468df40be6924e00c931230bae6b1a_12_1.png)


    Some chapters will go faster than others and some will add more than others, but
    you will keep making progress.


    # Swimming in the Deep End


    Because we''ve got a lot to cover in a small space, I''m going to try to show
    you things first, maybe even use them first, and then explain them in detail a
    little later. Times that feel like you''ve been thrown into the deep end of the
    pool: when you see something that doesn''t make sense yet, don''t worry about
    it. Just wash it over you; the explanation will be along shortly.


    In many cases, you can use something successfully even if you don''t really understand
    how it works. I can turn a desk lamp on and use it without understanding how electricity
    is generated. I could even build my own desk lamp without understanding how to
    build a big power-station generator. I just need to know how your part fits in.


    We''ll focus on how your part fits in as much as possible.


    +   3. Some folks also write Minecraft mods, which take place in the graphical
    client, but won''t cover those here.'
  merge: -1
