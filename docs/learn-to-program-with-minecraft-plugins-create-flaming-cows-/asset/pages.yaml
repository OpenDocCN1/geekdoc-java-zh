  md: 'we have isTeleporting and playerTeleports to keep track of players and the
    locations they''ve teleported to and from.


    We''re checking to see if isTeleporting list contains this player already. If
    it doesn''t, we will add it—this player has started teleporting. If the isTeleporting
    list already contains this player, then we should ignore this event (and remove
    the player from the list). That means we generated this event, and we don''t want
    our own to teleport the player, because it would keep doing that. So we throw
    this extra teleport event out.


    If this player has teleported before, we''ll get a loc from the playerTeleports
    hash (a hash of locations) using the player as a key. We''ll add this location
    to the existing list. If this is the player''s first time teleporting, we''ll
    make a new list (of Locations) and add this location as its first entry.


    But this is no ordinary list. It''s a kind of list, all right, but it''s a Stack,
    not a plain list. A Stack works like a stack of pancakes. You add to the top of
    the stack, and when you remove a pancake it comes off the top of the stack. That''s
    the model we want for our list of places we''ve teleported. As you teleport, each
    location is added to the top of the stack—and it''s the one you want to go back
    to, then the one under that, and so on.


    Add an object to the top of a stack, you push it in. To get the value and remove
    the object at the top, you pop it off. To check on the top value without removing
    it, you can peek at it.


    As players teleport around, we''ll keep a stack of each of their teleport locations,
    stored in a Stack in our playerTeleports variable. We can get to the stack using
    the Player object as a key. You can see what this looks like on page 132.


    Finally, we get to go back to Command. When we get a back command, the player''s
    list of teleport locations (if there is one), and peek at the location on top
    of the stack, saving that in loc for now.


    Maybe we teleported to this spot and haven''t moved yet. In that case, we''d want
    to go to the previous spot—not at that location. We''ll test for that: if we''re
    still at the same location as the last teleport (or to it), we remove location
    from the loc list by using the pop, and set loc to the next location in the stack.


    Either way, we''ve got a loc pointing to the spot that we want to teleport to.
    We''ll add the player to the isTeleporting list and teleport the player to the
    new location.'
