    Chapter 5, Plugins Have Objects, on page 67.

    3. Chapter 7, Use Piles of Variables: Arrays, on page 89.

    4. Chapter 5, Plugins Have Objects, on page 67.

    5. https://ci.visualillusionent.net/job/CanaryUb/javadoc'
