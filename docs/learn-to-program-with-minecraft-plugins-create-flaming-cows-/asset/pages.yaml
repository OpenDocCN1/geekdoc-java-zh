  md: 'With this chapter you''ll add these abilities to your toolbox:

    * Modify blocks in the world

    * Modify and spawn new entities

    * Listen for and react to game events

    * Manage plugin permissions


    This is exciting! Now you have most of the basic tools you need; you can alter
    the world and react to in-game events.


    # CHAPTER 9


    # Modify, Spawn, and Listen in Minecraft


    Now we''re going to go beyond issuing simple commands and dropping squid bombs,
    and looking at a wider range of things you can do in Minecraft. By the end of
    this chapter, you will be able to affect behavior in the game without having to
    issue any commands at all.


    All you have to do is listen—you''ll see how, by learning Minecraft events. We''ll
    listen for events, act on them, and even schedule our own events to fire sometime
    in the future.


    From your plugin code, you can change existing blocks and entities, and you can
    spawn new ones. We''ll look at exactly how to do that:


    +   * Modify existing blocks: change things like location, properties,

    * Modify existing entities: change properties on a Player

    * Spawn new entities and blocks


    We''ve done some of this already—we''ve changed a Player''s location, and we''ve
    spawned more than a few Squids. Let''s take a closer look at what you can do with
    the basic elements in the Minecraft world, and then we''ll see how you can react
    to in-game events to affect those elements and create new ones.


    # Modify Blocks


    The basic recipe for a block object in Minecraft is listed in the Canary documentation
    under net.canarymod.api.world.blocks.Block.¹


    There are many interesting functions in a Block, and we won''t cover them all,
    but here are a few of the most useful and interesting things you can do in a block:


    +   1. https://ci.visualillusions.net/job/CanaryLib/javadoc'
