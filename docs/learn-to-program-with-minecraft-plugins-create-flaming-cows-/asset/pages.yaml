  md: 'One last interesting note about variables: notice that at ❓ and ❓ I used to
    make a new variable, as in towerBase = new Location(towerLoc), instead of just
    assigning it, as in towerBase = towerLoc. Why do you think I did that?


    Remember that when you create a variable with new name, and your name is a name.
    So if I had typed towerBase = towerLoc, there would only be one Location, with
    two names. They wouldn''t be separate variables. By typing towerBase = new Location(towerLoc)
    I made a new variable named towerBase that copied the values from towerLoc.


