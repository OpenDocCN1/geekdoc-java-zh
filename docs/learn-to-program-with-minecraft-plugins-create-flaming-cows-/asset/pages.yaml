    # CHAPTER 8


    # Use Piles of Variables: HashMap


    # Use a Java HashMap


    HashMap is a funny name. The “hash” part refers to how it works internally; it
    really has nothing to do with how you use it.


    But the “map” part is about what you’d think: it maps a key, which can be anything,
    to a value, which can also be anything.


    Other languages might call this a dictionary, an associative array or some kind
    of associative memory. They all mean the same thing. With an array, you use an
    integer as the index. With a HashMap, you can use any object as the key, especially
    Strings (see Figure 2, A HashMap, on page 106).


    We''ll use a list in the plugins. It''s a great way to keep track of players,
    cows that you want, or anything else you want. Although it kind of works like
    an array, you don''t use the same way. Back when we looked at an array you learned
    then you can get and set a value with an index like this:


    ```

    myList[9] = "Andy";

    String who = myList[9];

    ```


    But you can''t use that kind of assignment and bracket notation with a HashMap.
    Instead use your put and get functions. On the plus side, though, now you can
    use anything as a key. Most of the time you''ll probably use a String. So suppose
    you have a HashMap cleverly named myList.


    ```

    HashMap.put("Andy", "www.PragProg.com");

    // Works like myList["Andy"] = "www.PragProg.com";

    ```


    ```

    String myUrl = myList.get("Andy");

    // Works like myUrl = myList["Andy"];

    ```


    Now myUrl will have the value of "www.PragProg.com".'
