  md: 'Imagine that you read the player''s health as 50 in one thread, then a second
    thread sets it to 0—killing the player. You don''t know that, and you subtract
    10 from the player''s health and reset it to 40. Now the other thread thinks it
    killed the player, but instead of 0 the health has “magically” been set to 40!
    That''s a simple and innocent example, but far worse things can happen that could
    cause strange bugs or make your code—crash.


    There are ways to write code that can be run by multiple threads safely; however,
    many libraries, and most of the Canary API, are not designed that way.


    That''s important enough to repeat: the Canary API, and our plugin code that uses
    it, **are not built to be run by multiple threads**. The code will break.


    When we want to run a piece of code “later,” we can''t actually let it run at
    some random time. In particular, we can''t let a piece of code run at the same
    time as another piece of our code, or at the same time as the server code.


    Instead, we have to let the server determine when to run the code. Then it can
    run it pretty much as if it were a player typing in a command or responding to
    an in-game event; it''s the only thing running at the time. We calls that a *synchronous*
    task, and that''s what you''ll learn to set up in this chapter.


    To set up a task, we''ll first see how to make our own classes.


