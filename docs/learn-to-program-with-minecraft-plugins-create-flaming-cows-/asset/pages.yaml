  md: "The for loop is a basic control structure in Java—a way to control the order\
    \ of execution of your lines of code. If you need to make a bunch of blocks or\
    \ spawn a lot of creepers in a Minecraft world, you'll use a for loop. If you\
    \ loop through all the players that are currently online, you'll probably use\
    \ a loop (although there are nicer ways of doing that, which we'll see a little\
    \ bit later).\n\nFor example, this snippet of code from the guts of a plugin will\
    \ spawn ten pigs at your location. Saddle up!\n\n```\n//... somewhere inside a\
    \ plugin:\nfor (int i=0; i < 10; i++) {\n  spawnEntityLiving(location, EntityType.PIG);\n\
    }\n```\n\nIn this case, the statement will run the instructions in its braces\
    \ ten times, so spawn will be called ten times, creating ten pigs.\n\nThe for\
    \ statement has three parts inside the (), separated by semicolons. Here's what\
    \ they do:\n\n```\ni=0;\n```\n\nThe first part declares and initializes the looping\
    \ variable. Here we'll use i as our loop counter, and it always starts off at\
    \ 0—you'll see why later, but Java counts starting at 0.\n\n```\ni < 10;\n```\n\
    \nThe loop test tells us when to keep going with the loop (and more importantly,\
    \ when to stop). This loop will keep the code in the following braces as long\
    \ as i is less than 10. Right now, that would mean forever, so we need the third\
    \ part:\n\n```\ni++;\n```\n\nThe loop increment is this part that keeps the loop\
    \ moving along. Here we are incrementing the variable by 1 each time through the\
    \ loop. Remember, i++ is shorthand for i+1. Either way, you are taking the value\
    \ of i, adding 1 to it, and saving that back as the new value of i (you can use\
    \ kind of shortcut anywhere, by the way, not just in loops).\n\n# Use an if statement\
    \ to Make Decisions\n\nAn statement lets you make decisions in code and optionally\
    \ run a piece of code depending on whether a condition is true. This is how you\
    \ make a computer “think.\""
  merge: -1
