  md: '# Running Remotely


    There''s a slight hitch with running a script like start_minecraft when you''re
    logged in via ssh. As soon as you log out, the script will be killed. That''s
    not very helpful in a server environment.


    Fortunately, you can use a command screen to keep Java running even though you''ve
    logged out. It takes an argument string of -d -m -S followed by a name for your
    server. We will use mcserver for the session, the new server-style startup script
    will look like this:


    ```

    #!/bin/bash

    cd $(dirname "$0")

    screen -d -m -S mcserver java -Xms1024M -Xmx1024M -jar CanaryMod.jar --noControl

    ```


    (Remember, start_minecraft needs to be executable; so do a chmod +x start_minecraft
    if you get a "permission denied" error).


    That will start the server off in its own little world, which won''t be affected
    by logging off. If you want to "attach" to the server so you can issue commands
    and use it, screen with the -r option and the session name:


    ```

    $ screen -r mcserver

    ```


    And you''ll be attached to the server with the usual user and prompt:

    16:47:49 [INFO] Done (1.1635)! For help, type "help" or "?">


    To detach from your server session, press Ctrl-a then d. You''ll be returned to
    your original shell, and your server will still be running in the background.


    To see what processes are running, use the ps command:


    ```

    Server - $ ps

    PID TTY TIME CMD

    337 tty000 00:00:09 -bash

    842 tty020 00:13:78 /usr/bin/java -jar CanaryMod.jar

    ```


    And to see all the processes on a machine, ps ax. (ps -? will list the options).


    In a pinch, if you need to kill all Java processes, you can use


    ```

    Server - $ killall java

    ```


    That asks Java to do some cleanup and exit in a safe and reliable manner. However,
    if it''s stubborn and won''t behave, you can use the brutal


    +   5. There''s a slightly simpler way to do this using the command noh (named
    for "No Hangup"); however, you lose the ability to enter commands to the server
    easily.'
