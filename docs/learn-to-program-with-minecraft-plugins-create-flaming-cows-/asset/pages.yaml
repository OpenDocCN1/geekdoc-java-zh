  md: "Let’s look at how to modify the plugin code to use a config file. The important\
    \ part is in the enable() function. As it starts up, it will go and grab values\
    \ from the configuration file and set them into a few static variables for our\
    \ plugin to use. Here's what I added:\n\n```\nSquidBombConfig/src/squidbombConfig/SquidBombConfig.java\n\
    private static int numSquids;\nprivate static double SquidDropHeight;\nprivate\
    \ static boolean setFire;\n```\n\n```\n// Server/config/SquidBombConfig/SquidBombConfig.cfg:\n\
    // numSquids=6\n// squidDropHeight=5\n// setFire=false\n```\n\n```\npublic boolean\
    \ enable() {\n  super.enable();Compiler will call this if you don't\n  logger.info(\"\
    Getting config data\");\n  PropertiesFile config = getConfig();\n  numSquids =\
    \ config.getInt(\"numSquids\", 6);\n  squidDropHeight = config.getDouble(\"squidDropHeight\"\
    , 5.0);\n  setFire = config.getBoolean(\"setFire\", false);\n  config.save();\
    \ // Create a new one if needed\n  return true;\n}\n```\n\nFirst, we call getConfig()\
    \ to get the PropertiesFile object for our plugin. If there is no actual file,\
    \ we will get an empty object instead. With this we can now make calls to get\
    \ values out of the config file.\n\nEach call to read data looks like config.getType(Type),\
    \ where Type is the type of the variable you’re trying to get, so you have getint,\
    \ getDouble, getBoolean, getString, and such.\n\nNote that you have to use the\
    \ camel-case version of the data type, so it’s getint, not getint; getBoolean,\
    \ not getBoolean; getDouble, not getDouble; and so.\n\nUsing functions named getXXX\
    \ and setXXX to read and set variables is a pretty standard part of Java. We refer\
    \ to these kinds of functions as getters and setters. Okay, perhaps not the original\
    \ names.\n\nFor each of config files, you set a default value to use in case setting\
    \ isn’t in the file. For instance, calling:\n\n```\nnumSquids = config.getInt(\"\
    numSquids\", 6);\n```\n\nwill set numSquids to 6, even if the setting for numSquids\
    \ doesn’t exist in the config file, or if the file doesn’t exist at all. If there\
    \ is a setting in the file, then numSquids will be set to that value."
