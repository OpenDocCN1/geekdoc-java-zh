    You''re done.


    # The Harder Way: By Hand


    To set up your computer to be open and findable on the Internet without the help
    of something like LogMein isn''t magic, but it does take some work. There are
    some advantages of doing it “hard way":


    +   - It''s free.

    - You can connect more than five users if you want.

    - You can be available to the whole world, not just your friends.

    - It''s really interesting and useful stuff to learn.


    You''ll need to learn a little more about networking and how the Internet works.
    I''ll outline the important steps, but you may need to do some additional reading
    on your. Most importantly, I can''t give you step-by-step directions because every
    router (or cable modem, DSL modem, and so on) is different. But you can find that
    online with help from Google or via informational sites like http://portforward.com.


    Let''s look at the steps.


    First, your friends need to find your machine.'
