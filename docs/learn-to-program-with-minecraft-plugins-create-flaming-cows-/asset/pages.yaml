  md: '# Chapter 2. Add an Editor and Java \cdot 24


    The CanaryMod project comes in a single jar file: CanaryMod.jar, which is used
    to run the game server itself, and also what we use to develop new plugins.


    Hop on the Web and visit the CanaryMod project''s release page at http://canarymod.net/releases.
    You''ll see a listing of its releases, grouped by the corresponding Minecraft
    version number. I''m using the latest release, which right now is for Minecraft
    1.17.0. You''ll need to download the latest jar file. I''ve also included a copy
    in the downloads for this book for your convenience.


    Each jar may be named with extra version numbers (something like CanaryMod-1.7.10-1.1.0.jar;
    your numbers will probably be larger). Download the file to your Desktop/server
    directory, and rename it to just CanaryMod.jar.


    You can do that from the shell with the mv (move command) and the wildcard (*),
    which matches all the numbers so you don''t have to type them out:


    ```

    $ cd server

    $ pwd

    /Users/andy/Desktop/server

    $ ls

    CanaryMod-1.7.10-1.1.0.jar

    $ mv CanaryMod*.jar CanaryMod

    $ ls

    CanaryMod.jar

    ```


    The example code for this book contains a subdirectory named start_minecraft.
    In the runtime directory you will see a startup script named start_minecraft.
    Copy it to your server directory using the copy command, cp. You''re still in
    directory, you can just copy using ".." to refer to the Desktop, and "." to refer
    to your current directory, runtime:


    $ cp ../code/runtime/start_minecraft


    We''ll use start_minecraft script to start up and run the server. It''s going
    to run the Java command, passing in an option to make sure we have enough memory
    to run (the magical-looking -Xmx1024M), and then passing in the jar file to run,
    CanaryMod.jar:


    java -Xmx1024M -jar CanaryMod.jar


    The first time the Minecraft server runs, it creates a whole bunch of files, including
    the default World, and then exits. Go ahead and run it (still in the server directory):


    $ ./start_minecraft


