  md: 'Compare this to our original, very simple HelloWorld.java file. Notice right
    at the top, the package statement and later the public class statement now refer
    to SkyCmd instead of HelloWorld.


    Let''s take a closer look at how a plugin handles a chat command like /sky.


    # Handle Chat Commands


    The bit with @Command at tells the system that this function, skyCommand, is responsible
    for handling the /sky command. That is, when the player types the /sky command,
    your skyCommand function will be called.


    The first thing we need to check is a little awkward; it turns out that the MessageReceiver
    that gets us here may not be a Player. It could be a Player object, or who knows.
    We want to make sure it''s really a Player, so we''ll check for explicitly at,
    using the Java keyword instanceof. This tests to see if the thing is really a
    Player. If it is, we''re going to do the bulk of the chat starting at (If not
    a Player, then it''s probably a console command, if you allow that to).


    The skyCommand function begins with another bit of magic, just like we use with
    parent/child recipes at Chapter 5, Plugins Have Objects, on page 67. Now that
    we''ve confirmed the variable is really of type (not just a MessageReceiver or
    any other parent or child), we can convert it to the type using a cast operator.


    So the expression (Player) returns the variable caller, converted with a cast
    operator to the type Player you can assign it to the variable. It sounds messy,
    and it is a bit, but it''s something you can just copy and paste, as we''ll be
    using this little recipe in almost every command to get a Player object.


    Now that we have a real Player object referenced by me, we get the list of all
    living entities with me.getWorld().getEntityList(), which will get us all the
    living entities in this world and return them in a List that we''ll go through
    for a loop.


    We''ll get over the details of lists in the next chapter, but we''ll first look
    at how Location objects works. In this case, we''re setting the variable target
    to each entry in the list of entities as we go through the loop. If the target
    is not a fellow player, then we want to fling it skyward, which we do by changing
    its location with a teleportTo().'
