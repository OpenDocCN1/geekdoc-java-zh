    around and blow them up, which we know how to do from the earlier plugins. We''ll
    need to blow up the player that we''re attacking. We can just blow up when the
    cow is next to a player, or we need to explicitly kill the player (by setting
    health to zero or setting the player on fire or something?) We''ll need to experiment
    and see how that works.


    **What can go wrong?** This is a question to ask yourself when creating a plugin.
    For now it seems our cows could get confused when attacking and get stuck somewhere,
