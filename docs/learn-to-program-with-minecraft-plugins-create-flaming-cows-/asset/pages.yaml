    \nYou can log out by pressing Ctrl-d or by typing exit. And now you're back to\n\
    your local shell.\n\n# Admin with Root\n\nOn any modern system, an ordinary user\
    \ doesn't have full permissions\nto do everything on the system. You usually have\
    \ to type a password to get the\nauthority of an administrator on the system.\
    \ OnWindows machines this account\nis called Administrator, and on Linux and Mac\
    \ systems it's called root.\n\nWhile you can log in directly as root with the\
    \ appropriate password, that is\nusually frowned upon. It's too easy to make a\
    \ typo and suddenly blow away\nhalf your system. Root is ultimately powerful,\
    \ and with great power comes\ngreat responsibility.\n\nBut you still need to be\
    \ able to execute certain commands as root without\nlogging in root. You can do\
    \ that using the sudo command, which lets you\ndo as the super user would do.\
    \ You preface the command you want to\nwith sudo, and it will prompt you for your\
    \ normal user account password.\nGet it right, and the rest of the command will\
    \ be executed as root.\nexample, here I'm using sudo to run anadduser to add the\
    \ user \"fred\".\n\n```\nRemote $ sudo adduser fred\nPassword:\nUser 'fred' added.\n\
    ```\n\nThis allows you to have the full power of root, but only in limited,\n\
    controlled, well-known circumstances, and not just logged in root.\n\nIn fact,\
    \ if SSH is set up that it does allow root to log in directly, you\nshould look\
    \ up how to disable that feature. That way you have to log in using\nyour user\
    \ account and SSH key, and then provide your password via sudo."
