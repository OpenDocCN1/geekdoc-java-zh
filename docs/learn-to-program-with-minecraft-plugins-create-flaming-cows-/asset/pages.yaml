- img_proc: true
  md: "Java calls this kind of variable a boolean,⁵ and it can be assigned true or\
    \ false, or you can give it math expressions using any of these operators, all\
    \ of which return either true or false:\n\n| == Equal (two equals signs) |\n|\
    \ != Not equal to |\n| ! Not (so \"not true\" is false, and \"not false\" is true)\
    \ |\n| < Less than |\n| Greater than |\n| <= Less than or equal to |\n| >= Greater\
    \ than or equal to |\n| && And (true if both things are true) |\n| || Or (true\
    \ if either is true) |\n\nFor example, given these variables\n\n```\nint a = 10;\n\
    \ b = 5;\nString h = new String(\"Hello\");\nboolean result = true;\nboolean badone\
    \ = false;\n```\n\nJava will figure out these comparisons:\n\n+   * a == 10 is\
    \ true\n* b == 6 is false\n* a < 20 is true\n* b >= 5 is true\n* a > 100 is false\n\
    * result is true\n* result is false (pronounced \"not result\"—not\" returns the\
    \ opposite of a value)\n* result && badone is false (pronounced \"and\"—true only\
    \ if both are true)\n* result || badone is true (pronounced \"or\"—true if either\
    \ is true)\n\nBut this one is not what you think it should; it will not be true:\n\
    \nh = \"Hello\"; // Gotcha!\nThat one is tricky. For strings and objects (more\
    \ on that in the next chapter), use the equals function instead of the double\
    \ equals sign (=), like this:\nh.equals(\"Hello\"); // is true\n\n+   * Named\
    \ for George Boole, the British mathematician, who came up with these ideas in\
    \ the 1800's."
