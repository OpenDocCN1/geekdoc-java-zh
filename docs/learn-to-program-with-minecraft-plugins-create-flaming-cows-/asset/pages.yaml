    # Getting Around in Minecraft


    In case you aren''t familiar with the Minecraft graphical user interface (GUI),
    here are a couple of tips. You can check out some of the many YouTube tutorials
    or official docs for more.


    The keys W, A, S, and D move you forward, left, backward, and right, respectively.
    Use the Spacebar to jump.


    Use the mouse to control the direction you are facing.


    You "hit" things with your left mouse button—for example, strike with a sword
    or dig with a pickaxe or shovel.


    You "use" items with your right mouse button—for example, placing an item or opening
    a door.


    You type commands to Minecraft with a leading "/" character. You can change the
    game to creative mode with /gamemode c, and back to survival mode with /gamemode
    s.


