    # Install the Minecraft Client and Server


    Minecraft is a client-server system, so you''ll need both parts: the desktop graphical
    client that you use to play the game, and the server process that you connect
    to, we''ll add plugins.


    # Install the Minecraft Graphical Client


    You probably have this part already, but if not, download the Minecraft installer
    for your computer from http://minecraft.net. Follow the installer instructions
    to install it, but don''t run it just.


    When you play Minecraft, this "client" is the application that you run. connects
    to your paid account at http://minecraft.net.


    There are also clients for iOS and Android devices, including smartphones, but
    they are a dead end. As I''m writing this, they don''t connect to normal Minecraft
    servers, so they can use our own plugins.


    The client handles the graphics and sound, and lets you type that commands in
    the game. But right now there is no local game to connect to—better get grab and
    download your server code.


    # Install the CanaryMod Server


    Now for the fun part. You''ll adding plugins to your own server, so you''ll need
    CanaryMod, a special Minecraft server from the fine folks at CanaryMod.that''s
    designed to use plugins.


    Make a directory named server on your Desktop (that means it would be located
    in a directory something like /Users/yourname/Desktop/server):


    ```

    $ cd Desktop

    $ mkdir server

    ```


    We''ll call this server directory, and that''s where you''ll install the server
    parts.'
