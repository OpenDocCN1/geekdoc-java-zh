    # Different Kinds of Numbers


    Java makes a distinction between integer whole numbers (with no decimal point,
    like 8) and floating-point numbers with a fractional part (with a decimal point),
    like 10.125.


    For plain old whole numbers, you use an int, like we''ve seen.


    Floating-point numbers can be float or double. A double is larger and can store
    much more precisely, but at the cost of needing more space and power to manage.
    But computers are fast and have plenty of storage these days, almost everyone
    just uses double any they need a double-precision, floating-point, fractional
    number.


    When you type a number with a decimal point in Java, it assumes you''ve typed
    a double:


    ```

    3.1415 // assumed to be a double

    ```


    But if you really need the number to be a float, you have to stick the letter
    f on the number:


    ```

    3.1415f // now it''s a float, not a double.

    ```'
