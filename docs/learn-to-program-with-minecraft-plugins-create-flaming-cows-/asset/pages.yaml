  md: '# localhost


    The computer’s network name for itself.


    # local variable


    A variable declared with a block of { and }; can be used only within that block.


    # long


    A really big whole number, with no decimal point.


    # map


    See HashMap.*


    # null


    A variable that would normally point to an object but isn''t pointing to anything
    is set to the special value null.


    # object


    A collection of live variables and functions, built from a class recipe.


    # object-oriented


    Software based on the theory of objects that combine variables and functions into
    one pile of stuff.


    # package


    A collection of Java classes that belong together.


    # parameter


    A value in a function that has been passed in for it to use.


    # path


    A list of directories that the computer will search to find a command or other
    resource.


    # plugin


    A compiled piece of code that''s added to an already-compiled piece of code.


    # port


    An agreed-upon number that lets computers communicate over a network. For example,
    the Web uses port 80, and Minecraft uses port 25565.


    # private


    A Java keyword that restricts visibility to the current class.


    # public


    A Java keyword that opens up visibility to all classes.'
