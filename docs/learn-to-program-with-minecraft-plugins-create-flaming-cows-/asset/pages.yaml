  md: '# What’s a Port?


    In this and the next appendix, you''ll see references to network ports and Minecraft''s
    default port of 25565. A port is just an agreed-upon number that lets computers
    communicate over a network. For example, browsers use ports 80 and 443 to talk
    with web servers.


    When you first run it, LogMeIn will ask you to join or create a network:


    ![](img/9f468df40be6924e00c931230bae6b1a_227_0.png)


    You''ll want to create one. I named andys_minecraft_server:


    ![](img/9f468df40be6924e00c931230bae6b1a_227_1.png)


    And we''re up running!


    ![](img/9f468df40be6924e00c931230bae6b1a_227_2.png)


    Now tell your friends to download the same software and join your network with
    the name you picked (andys_minecraft_server).'
