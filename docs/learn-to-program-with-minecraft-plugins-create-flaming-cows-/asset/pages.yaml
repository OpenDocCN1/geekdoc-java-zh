    # CHAPTER 3


    # # Build and Install a Plugin


    Now that you have the tools installed, we''ll build a simple, basic plugin. It
    won''t do as much as plugins go, but it will make sure you can build and run your
    own plugins, and it will act as starting point (skeleton) for all the plugins
    we''ll write in this book.


    So do your typed-in instructions end running on a Minecraft server? Here''s the
    whole process works.


    You type your Java language instructions (we call that “source code”) and save
    them into a text file, and then the Java compiler, javac, reads your text file
    and converts it into something the computer can run.


    You went through this process already with the simple CreeperTest.java program
    you typed previously.


    For the source code you type into file named CreeperTest.java you''ll get a binary
    (not text) file named CreeperTest.class. A binary file is just a file of numbers—it
    makes to the computer, but not to humans.


    Because a typical program might use lots and lots of class files, you usually
    archive a bunch of class files into a jar, and Java runs the code from the jar.


    Java (the java program itself) reads class files and jar files to create a running
    process on the computer. With Minecraft, this will be the server process that
    your Minecraft clients connect to. For now, the only client will be.


    The following figure shows how these parts all fit together. The javac compiles
    your Java source code, and defines it in CanaryMod, and produces a class file.
    That class file gets packed up with the Canary.inf file into a jar that is your
    plugin. Then at runtime, Java starts the server from CanaryMod and loads your
    plugin from its jar.


    ![](img/9f468df40be6924e00c931230bae6b1a_42_0.png)'
