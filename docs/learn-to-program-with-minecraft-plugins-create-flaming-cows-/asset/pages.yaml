  md: "# APPENDIX 1\n\n# # How to Read Error Messages\n\nError messages from the Java\
    \ compiler, the runtime system, and the Minecraft server try to be self-explanatory,\
    \ but they don't always succeed. The java compiler in particular can get more\
    \ than a little confused and spit out unhelpful messages.\n\nPlease read through\
    \ this whole appendix even if you're not getting a particular error at the moment,\
    \ as some of this information might help you decipher other error messages that\
    \ aren't included.\n\nI've included some of the common error messages you might\
    \ run into, along with some observations and commentary. If you run into an error\
    \ that just can't figure out, and it's not listed here, try Googling for the text\
    \ of the error message. Odds are someone else has the same problem at some point,\
    \ and you can benefit from their experience.\n\n# ## Java-Compiler Error Messages\n\
    \nJava-compiler error messages usually look something like this:\n\n```\nsrc/helloworld/HelloWorld.java:21:\
    \ cannot find symbol\nsymbol : class MessageReceiver\nlocation: class HelloWorld.HelloWorld\n\
    \    public void helloCommand(MessageReceiver caller, String[] parameters)\n```\n\
    \nJava is trying to tell you exactly where the error occurred and what it thinks\
    \ the problem is.\n\nThe first bit of text is the name of the file where Java\
    \ thinks the problem is located—in this case, the file src/helloworld/HelloWorld.java.\
    \ Next is a number between colons—that's the line number in the file (21). Next\
    \ is the error message itself, \"cannot find symbol.\" After that come the details\
    \ specific to"
