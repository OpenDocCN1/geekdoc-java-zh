    I don''t think we need to keep track of them when the server shuts—we''ll just
    make new ones. We will need to keep track of them in memory while the server is
    running, though, so at a minimum we''ll need kind of static list or hash of the
    cows we''ve spawned. Reread Chapter 7, Use Files of Variables: Arrays, on page
    89, or Chapter 11, Use Files and Store Game Data, on page 145, if you need reference.


    What are the triggers?It would be kind of stupid to type in a command to get attacked
    by creeper cows, we won''t be using a @Command function. Instead, we''ll need
    an event to kick off generation, and maybe a timer to keep the cow attacking and
