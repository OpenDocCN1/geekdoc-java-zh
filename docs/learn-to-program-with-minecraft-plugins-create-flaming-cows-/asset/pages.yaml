  md: "The function we've been using to set block types is also straightforward:\n\
    \n```\nEZPlugin/src/com/pragrog/ahmine/ez/EZPlugin.java\npublic static void setBlockAt(Location\
    \ loc, BlockType type) {\n    loc.getWorld().getBlockAt(loc, type);\n}\n```\n\n\
    Although a Block has its own type, that doesnt make the change in the world\n\
    we want. So instead, we use the World's setBlockAt() function. By always\nusing\
    \ the helper function, we're sure to always use the correct version.\n\n# Plugin:\
    \ FlyingCreeper\n\nHere's a plugin that has spawning entities: a bat and a creeper.\
    \ We'll\nmake the creeper ride the bat, and then turn the bat invisible with a\
    \ potion\neffect. The result is a nightmareish, terrifying, flying creeper.\n\n\
    Here are the guts of the potion. Notice I'm not using the helper functions to\n\
    spawn this time; instead I'm using the factory calls directly, I'm using a\nslight\
    \ different version of spawn.\n\n```\nFlyingCreeper/src/flyingcreeper/FlyingFlyingCreeper.java\n\
    Location loc = me.getLocation();\nloc.setY(loc.getY() + 5);\n```\n\n```\nEntityFactory\
    \ factory = Canary.getEntityFactory();\nEntityLiving bat = factory.newEntityLiving(EntityType.BAT,\
    \ loc);\nEntityLiving creep = factory.newEntityLiving(EntityType.CREEPER, loc);\n\
    bat.spawn(creep);\n```\n\n```\nPotionFactory = = Canary.getPotionFactory();\n\
    Potion effect = \npotfact.newPotionEffect(PotionType.INVISIBILITY,\nInteger.MAX_VALUE,\
    \ 1);\nbat.addPotionEffect(potion);\n```\n\nAll entity objects have riders. In\
    \ theory, you could even ride primed TNT.\nBut I wouldn't advise it. Here're going\
    \ to have the creeper ride the bat by\nspawning the bat with a creeper rider (the\
    \ argument to spawn).\n\nNext we need to turn the bat invisible to make the flying\
    \ creeper look more\nconvincing. Fortunately, allLiving objects can use potion\
    \ effects.3 We'll\ncreate a new potion effect, which lets us specify the effect's\
