  md: '# APPENDIX 7


    # # Common Imports


    Here is a listing of all of the imported package and class names used in our plugins.
    If you get an error that a symbol can''t be found, you may need to import the
    full class name. For instance, to use a HashMap you''d need to import java.util.HashMap,
    and to use a Block you''d need to import net.canary-mod.api.world.blocks.Block.


    You can always look up the full class name in the Java or Canary docs, but here
    are the most common ones for your convenience.


