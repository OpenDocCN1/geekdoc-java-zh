  md: "All we've done differently what kind of value we're going to return (int in\
    \ this case) instead of using void in the declaration. Then we use the keyword\
    \ return with the value that we want to return to our caller. Usually we want\
    \ to call return as the very last thing in your function. That's because it specifies\
    \ what value to return and performs the return right then and there. No more code\
    \ will run in your method after it hits the runtime. You're done.\n\n# Try This\
    \ Yourself\n\nModify the HashPlayjava source so that no one's score can go below\
