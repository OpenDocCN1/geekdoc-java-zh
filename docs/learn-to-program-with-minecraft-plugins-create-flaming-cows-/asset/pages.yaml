  md: "# Chapter 6. Add a Chat Command, Locations, and Targets • 84\n\nTo get a random\
    \ number from 0 up to 5, multiply Math.random() by 5. For instance, to get a new\
    \ x-coordinate you might use an expression like loc.getX() + (Math.random() *\
    \ 5). When multiplying and adding, parentheses are usually a good idea—in this\
    \ case we want to multiply the random 0..1 by 5, then add to the original x.\n\
    \nNow it's your turn again: improve the squid bomb by making a new location based\
    \ on the player's location that you already have, and add a bit of randomness\
    \ to the x- and z-coordinates. To get the squid to drop on from above, add 10\
    \ to your y-coordinate.\n\nTry going through this exercise by yourself first.\
    \ If you get stuck and need some help, I made a whole plugin for the squid bomb.\
    \ You can see my code and config file in code/SquidBomb.\n\n# Find Nearby Blocks\
