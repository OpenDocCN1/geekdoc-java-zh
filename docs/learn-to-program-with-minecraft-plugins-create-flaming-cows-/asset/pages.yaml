  md: "# Chapter 11. Use Configuration Files and Store Game Data • 152\n\nof users\
    \ on a large server, and complicated sets of nested data, you may need to look\
    \ into the SQL techniques. There's an official tutorial online. But it's a much\
    \ more advanced and potentially confusing topic, even for professionals.\n\nOn\
    \ the other hand, if your data needs are flat and simple, and you are only dealing\
    \ with hundreds of users, then Canary has a nice option for your: DataAccess objects\
    \ and the Database front end.\n\nWhen dealing with databases, the words we use\
    \ to describe things are a little different from the words we use in code. In\
    \ code, you might have a class or a record, made up of variables, or fields. Databases\
    \ have these same things, but we call them columns. A bunch of columns are grouped\
    \ together in a table.\n\nAnd since searching for records is a big part of databases,\
    \ we have a new word for the thing we search for the most: a table's primary key\
    \ field. A primary key means there's only one record in that table with that value.\
    \ For instance, player_name might be a good primary key, because every user has\
    \ a unique name, so it's an easy way to find an individual player.\n\n# DataAccess\
    \ objects\n\nIn the Canary API, you can create a DataAccess object that defines\
    \ what you want to store in a database. For example, suppose you want to store\
    \ the location of a player. You'd want to be able to save and look up record by\
    \ the player's name, and maybe save the x-, y-, and z-coordinates.\n\nTo do that,\
    \ you'd need a separate class, derived from DataAccess, that just has the data\
    \ you want to load and:\n\n```\npublic class AllPlayerLocations extends DataAccess\
    \ {\n    public String player_name;\n    public double x;\n    public double y;\n\
    \    public double z;\n}\n```\n\nThat's the data itself, but Canary needs a few\
    \ more things before you can use this with a database.\n\nFirst off, it needs\
    \ to know what to call this field in the database, and what type of data it represents.\
    \ For each of x, y, and z, we'll name the database field the same as the variable.\
    \ Each of these is a Java double. You'd specify these details using the @Column\
    \ annotation, like this:\n\n+   1. http://docs.oracle.com/javase/tutorial/jdbc/basics/processingsqlstatements.html"
