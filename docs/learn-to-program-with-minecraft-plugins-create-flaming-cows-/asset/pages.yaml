    # # Use a Java ArrayList


    An ArrayList in Java also keeps track of a list of values, just like a simple
    Array. ArrayLists are a little messy to declare but simple enough to use, and
    much more flexible and a bit safer than old Array objects. You can add and delete
    from the ArrayList as many times as you want; it''s not a fixed length and will
    grow or shrink as needed.


    Here''s an example of an ArrayList that will hold Player objects:


    ```

    List<Player> myList = new ArrayList<Player>();

    ```'
