  md: '# Appendix 3. How to Install a Desktop Server • 226


    If the firewall is turned off (not enabled), then you''re good to go. If it''s
    turned

    , make sure Java has permission to allow incoming connections:


    ![](img/9f468df40be6924e00c931230bae6b1a_231_0.png)


    # Open Your Firewall on Linux


    If you''ve set up a firewall with IPTables, make sure port 25565 is open.


    # For All Operating Systems


    However, opening up the firewall on your computer itself may not be enough.


    To check if the Internet can get to your port, point your browser to

    http://canyouseme.org. That will come up with your publicly visible IP address.

    Type in the port to check as 25565, and click Check Port. If it works, you''re
    fine,

    good to go. If not, there''s one thing you might need to do.


    If you are connected to the Internet through a router or cable modem, then

    that device may have a firewall as well. Even, if it has the port open to

    the Internet, you need to format the port traffic to the router to your local

    computer.


    # Port Forwarding


    You need to exercise caution and restraint when changing settings on your

    router. If you change something you didn''t intend to, you could end up

    mucking the device and losing your Internet access. Stick to the plan

    here. However, every router is different, so I can''t really give you any specific

    by-by-step instructions. Here on the basics:


    +   1. Log on your router. You may already know the username and password

    for it. If not, it may have a default user name and password that you can

    Google for.


