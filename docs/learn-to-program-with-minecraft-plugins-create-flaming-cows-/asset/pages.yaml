  md: "# Chapter 6. Add a Chat Command, Locations, and Targets • 80\n\nIn addition\
    \ to the plugin itself, Canary needs a configuration file for the plugin, named\
    \ Canary. You saw a description of this back on page 35, while we were building\
    \ plugins the first time. It tells the server some basic information about your\
    \ plugin, so that the server can load it.\n\nWith that configuration file and\
    \ your code, the Minecraft server can run your plugin just like any other part\
    \ of the game.\n\n# Plugin: SkyCmd\n\nWe're going to create a new-plugin called\
    \ SkyCmd. In it, we'll create a command name that will tell all creatures (not\
    \ players) 50 blocks up into the air. Very handy at night with skeletons and creepers\
    \ about. \n\nHere's the whole source file to:\n\n```\nSkyCmd/src/skycmd/SkyCmd.java\n\
    package skycmd;\nimport net.canarymod.plugin.Plugin;\nimport net.canarymod.logger.Logman;\n\
    import net.canarymod.Canary;\nimport net.canarymod.commands.*;\nimport net.canarymod.chat.MessageReceiver;\n\
    import net.canarymod.entity.living.humanoid.Player;\nimport net.canarymod.entity.world.position.Location;\n\
    import net.canarymod.entity.living.LivingEntity;\nimport java.util.List;\nimport\
    \ com.pragprog.ahme.EZPlugin;\n\npublic class SkyCmd extends EZPlugin {\n    @Command(aliases\
    \ = { \"sky\" },\n        description = \"Fling all creatures into the air\",\n\
    \        permissions = { \"\" },\n        toolTip = \"sky\")\n    public void\
    \ skyCommand(MessageReceiver receiver, String[] parameters) {\n        if (caller\
    \ instanceof Player) {\n            Player me = (Player)caller;\n            List<LivingEntity>\
    \ list = me.getWorld().getEntityLivingList();\n            for (Entity target\
    \ : list) {\n                if (!target instanceof Player) {\n              \
    \      Location loc = target.getLocation();\n                    double y = loc.getY();\n\
    \                    loc.setY(y+50);\n                    target.teleportTo(loc);\n\
    \                }\n            }\n        }\n    }\n}\n```"
