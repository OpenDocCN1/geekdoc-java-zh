  md: '# Appendix 1. How to Read Error Messages · 212


    this error message, which in this example is the symbol that it can''t find, and
    some more information about the location of the missing symbol.


    So on line 21 of HelloWorld.java, Java doesn''t know about the thing named MessageReceiver.
    Let''s look at some possible causes.


    # javac: Cannot Find Symbol


    “Cannot find symbol” means that the compiler has come across a word, a piece of
    text, it doesn''t understand.


    This error can be caused by several problems. First, what happens if I just stick
    in an assignment statement like i = 10 without declaring what i is?


    ```

    src/helloworld/HelloWorld.java:23: cannot find symbol

    symbol : variable i

    location: class HelloWorld.HelloWorld

    i = 10;

    ^

    ```


    The compiler has no idea what i is or what it should be, so it complains.


    To fix it I add a declaration like int; above this code or on the same line as
    int i = 10. Now the compiler knows that i is a local variable.


    But what if I have declared the variable and I still get an error? For instance,
    in the call to helloCommand, I''m declaring a parameter MessageReceiver caller;
    caller is my variable, of type MessageReceiver, but I get the same error:


    ```

    src/helloworld/HelloWorld.java:21: cannot find symbol

    symbol : class MessageReceiver

    location: class HelloWorld.HelloWorld

    public void helloCommand(MessageReceiver caller, String[] parameters)

    ```


    This can indicate a missing or misspelled import statement. The compiler knows
    that caller is a variable of type MessageReceiver, but it doesn''t know what MessageReceiver
    is.


    In this case, adding


    ```

    import net.canarydom.chat.MessageReceiver;

    ```


    at the top of the file fixes the error. Appendix 7. Common Imports, on page 253,
    for a list of common imports we''ve used in the book, or look it up in Java or
    Canary doc.


    report erratum · discuss'
