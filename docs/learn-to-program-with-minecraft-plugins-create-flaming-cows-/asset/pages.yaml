    \ done so far. And don't forget to save your progress with Git.\n\n# Filling In\
    \ the Details: CreeperCowTimer\n\nEarlier we decided to put the code for the jumping,\
    \ attacking, exploding cow into a new CreeperCowTimer class. Eventually we'll\
    \ crank this up from an event in the main CreeperCow plugin.\n\nGiven a target\
    \ and cow's location, we create a new Vector3D by taking the difference in Location\
    \ coordinates in the x and y directions: that gives us the displacement between\
    \ the cow and its target. But that's too large for a velocity, so we then multiply\
    \ it by a convenient number (0.075) that I found by experimenting. Finally we\
    \ set the cow's velocity, which will make it jump along Vector3D at that speed.\n\
    \n```\npublic class CreeperCowTimer {\n    private Cow cow;\n\n    public void\
    \ jump(Location target) {\n        Location cowLoc = cow.getLocation();\n    \
    \    double factor = 0.075;\n        Vector3D v = new Vector3D(\n            (target.getX()\
    \ - cowLoc.getX()) * factor,\n            (target.getZ() - cowLoc.getZ()) * factor\n\
    \        );\n        cow.moveEntity(v.getX() + (Math.random() * -0.1),\n     \
    \       v.getY(),\n            v.getZ() + (Math.random() * -0.1));\n    }\n}\n\
    ```"
