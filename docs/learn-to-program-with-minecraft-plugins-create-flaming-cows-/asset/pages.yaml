  md: "# Stack vs. Heap\n\nYou have noticed that sometimes we create and directly\
    \ assign a simple value to a variable, like int a = 25, and sometimes we use the\
    \ new keyword to create an object, like a plugin.\n\nThese two kinds of objects\
    \ are stored differently. Immediate values like integers and floats are kept on\
    \ Java's list of calls that you're making. That list is called a stack. It's like\
    \ a stack of pancakes. Each new function call throws a new pancake on the stack,\
    \ and when it's done you remove the pancake and you're back to the previous one.\
    \ When a function is finished, its “pancake” is thrown away, and any of its variables\
    \ disappear.\n\nBut objects that you create with new are kept in a big pile of\
    \ memory we call the heap. They can stick around after your function is gone,\
    \ if you want to (like a plugin)\n\nYou just need to keep a variable somewhere\
    \ that points to your object; that variable can be local and passed around, or\
    \ global. Java keeps track of how many different variables the object created\
    \ with new. Once no one is using object anymore, it gets tossed in the trash.\
    \ And then when the system feels like it, it empties the trash and your object\
    \ is gone. (Java even calls that “garbage collection.”) And as we mentioned two\
    \ toward the last of the chapter, you need to be careful: assignment gives you\
    \ two references to the same object: using new creates a new copy of an object.\n\
    \nyou can instead make it private, like this:\n\n```\npublic class WizardingWorld\
    \ extends EZPlugin {\n...\n    private void makeSuperUberHighWizard(Player p)\
    \ {\n    // Only functions here can call makeSuperUberHighWizard()\n}\n```\n\n\
    In general, if you're making a function that you're using internally within this\
    \ plugin, and other plugins shouldn't call directly, then make it private. Variables\
    \ you are using should almost always be private.\n\nIf you want other plugins\
    \ to see and use it, then make it public.\n\nWe'll start using private for our\
    \ helper functions now.\n\n# Plugin: NamedSigns\n\nLet's put a couple of these\
    \ ideas together and make a plugin that uses helper functions (with and without\
    \ return values), private functions and variables, some low-level array access,\
    \ and a hash that will store names and locations."
