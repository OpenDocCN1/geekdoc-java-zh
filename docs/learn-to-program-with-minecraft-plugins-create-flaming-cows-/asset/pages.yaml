- img_proc: true
  md: '2. On some menu it will have a section for Port Forwarding. On my router it
    was listed under “Gateway” and “Forwarding.”


    3. You need to tell it to forward port 25565 (both TCP and UDP if it asks) from
    the outside world (your external IP), as reported by http://www.checkip.org) to
    your computer''s internal IP.


    Your computer has an internal IP address, which is used for communication between
    it and your router/cable modem. You can run a command on your computer to see
    what this address is:


    # Windows


    Run ifconfig, and look for “IPv4 Address” under “Ethernet adapter” or “Wireless
    LAN.”


    # Mac/Linux


    Run ifconfig. It''s probably listed in Google for “inet” then “en1.”


    You might be able to Google for more information for your router setup, or check
    sites such as http://portforward.com for additional information.


    One complication: your internal IP address might change every often, just like
    your ISP''s IP address can change. From a DHCP server on your router, you can
    also tell it to create a DHCP reservation so that you get the same internal IP
    address. You can just go in and change the port forwarding when (or if) your internal
    IP address changes.


    If you''re having friends in occasionally and don''t mind the setup hassle, this
    is a perfectly fine way to work. But if you want more than a few folks to connect,
    and the server 24x7, you''ll need to set up a server in the cloud, which is detailed
    in the next appendix, Appendix 4, How to Install a Cloud Server, on page 229.


    # Quality of Service


    Many routers have a feature where you can specify the desired Quality of Service
    (often called QoS) for different ports/services. The idea is that you can set
    a high or low priority on different kinds of network traffic.


    You might find that useful when running a local Minecraft server: you can set
    the Minecraft port to have a very low priority.


    Putting the Minecraft port at the lowest setting will ensure that your own traffic
    gets priority over your friends using your server.'
