    Next you need a way to type in the Java source code. You''ll need Java itself,
    and an application to put it all together for you. We''ll install all of that
    in the next chapter, and then get to building plugins.


    # Your Growing Toolbox


    ![](img/9f468df40be6924e00c931230bae6b1a_26_0.png)


    You now know how to:


    +   - Use the command-line shell'
