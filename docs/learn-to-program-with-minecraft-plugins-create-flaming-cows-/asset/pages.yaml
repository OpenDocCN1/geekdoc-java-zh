  md: 'That shows the full log entries, with the long version of the commit identifier,

    the author, the date, and the log message. Those long, random-looking strings

    which are cryptographically interesting SHA1 hashes, in fact) identify each

    commit. But they are really long. Usually you can just use the first to

    eight characters of the hash as that produces a unique string.


    You can get a more concise report of the same information using this:


    ```

    $ git log --oneline

    50847c8 Add my personal screed

    aaa58dfa First Commit

    ```


    The shorter version of the commit hash is usually all you need.


    So remember: when you create a new file and get Git to track it, don''t forget

    to do the add:


    ```

    $ git add myFile.java

    ```


    And then do a commit to save a snapshot of all your files in the repository.

    You can always check to see what files Git knows, which ones it doesn''t,

    what''s committed, and what hasn''t, by typing this:


    ```

    $ git status

    # On branch master

    # Untracked files:

    # (use "git add <file>...\ to include in what will be committed

    # bin/

    # dist/

    nothing added to commit but untracked files present (use "git add to")

    ```


    Oops! I must have done a compile in somewhere, the bin and

    directories are back. That''s fine, as we don''t want Git to track them, but

    we also don''t want Git to complain about every time.


    If these files you cared about, you would just do the git add so that Git

    can track them. But in this case, we don''t want Git to ever track these direcories.
    We want it to ignore them. Here''s how to make that happen:


    +   1. Create a file named .gitignore in this directory (if there isn''t one already;

    plugin.sh will make an empty file for you).

    2. In the file, put the names of the files or directories you want to ignore.

    3. Add the file and commit it.


    In this case the .gitignore file will look like this:


    ```

    bin

    dist

    ```'
