    \nKafka, spark, integration, spark streaming\n\n# [CHAPTER 12](#toc.xhtml_c12)\n\
    \n# [Kafka Integration with Storm](#toc.xhtml_c12)\n\n# [Introduction](#toc.xhtml_s135a)\n\
    \nIn this chapter, we will be learning to build a simple application that uses\
    \ Apache Kafka and Storm. Apache Kafka is a messaging system where messages can\
    \ be processed in real time. Kafka and Storm integrate well with each other as\
    \ the streams from Kafka can be passed to the Storm cluster to process the data\
    \ using the core capabilities of Storm. This chapter introduces the implementation\
    \ of Kafka Spouts and Storm Bolts and the manner in which they communicate with\
    \ each other to process messages. The implementation uses maven build and Eclipse\
    \ IDE.\n\n# [Structure](#toc.xhtml_s136a)\n\nIn this chapter, we will discuss\
    \ the following topics:\n\n*   Introduction to Kafka-Storm integration\n\n*  \
    \ Implementing the Maven project\n\n*   Dependencies for Kafka and Storm\n\n*\
    \   Implementation of Storm Bolts\n\n*   Creating the topology\n\n*   Executing\
    \ the integration flow\n\n# [Objectives](#toc.xhtml_s137a)\n\nAfter studying this\
    \ chapter, you will learn the following:\n\n*   Understanding the Kafka-Storm\
    \ integration\n\n*   Learning to implement the Kafka Spouts\n\n*   Learning to\
    \ implement a Bolt\n\n*   Understanding the topology of Spouts and Bolts\n\n*\
    \   Executing the project\n\n# [Introduction to Kafka-Storm integration](#toc.xhtml_s138a)\n\
    \nKafka can read data and emit data to Kafka Spouts and therefore becomes a source\
    \ of streams. Bolts in the Storm Cluster can then process the data and they perform\
    \ real-time streaming analytics.\n\nThe following diagram shows the integration\
    \ of Kafka and Storm. The Kafka Spout reads from the Kafka Cluster. The Storm\
    \ Cluster has multiple bolt components. The Bolts can process the data and store\
    \ the results in a Hadoop HDFS or a database:\n\n![](images/12.1.jpg)\n\n**Figure\
    \ 12.1:** Kafka Storm integration architecture\n\nThe above integration flow can\
    \ be implemented using Java. The next section shows the creation of the project\
    \ and implementation of spouts and bolts using Eclipse IDE.\n\n# [Creating a Maven\
    \ project](#toc.xhtml_s139a)\n\nIn this section, we will create a maven project\
    \ using Eclipse IDE. The steps to create the project are shown in the following\
    \ section:\n\n1.  Open Eclipse IDE and select **`New`** | **`Project`**. In the\
    \ Project wizard, click on **`Maven Project`** as shown in the following screenshot:\n\
    \n    ![](images/12.2.jpg)\n\n    **Figure 12.2:** Select Maven Project\n\n2.\
    \  In the next screen, select **`Create a simple Project`** option and click on\
    \ **`Next`**:\n\n    ![](images/12.3.jpg)\n\n    **Figure 12.3:** Project Configurations\n\
    \n3.  Provide a Group ID and Artifact ID as shown below and click on **`Finish`**:\n\
    \n    ![](images/12.4.jpg)\n\n    **Figure 12.4:** Group ID and Artifact ID\n\n\
    4.  View the newly created project in the Project Explorer as shown in the following\
    \ screenshot:\n\n    ![](images/12.5.jpg)\n\n    **Figure 12.5:** View the Maven\
    \ Project\n\nAfter creating the new maven project, follow the next steps to include\
    \ the dependencies in the **`pom.xml`** file.\n\n# [Dependencies for Kafka and\
    \ Storm](#toc.xhtml_s140a)\n\nIn this section, the dependencies required for implementing\
    \ Kafka spout and Bolts are listed in the following code:\n\n`<properties>`\n\n\
    `<storm.version>1.0.2</storm.version>`\n\n`<kafka.version>0.8.2.2</kafka.version>`\n\
    \n`</properties>`\n\n`<dependencies>`\n\n`<!-- Storm library -->`\n\n`<dependency>`\n\
    \n`<groupId>org.apache.storm</groupId>`\n\n`<artifactId>storm-core</artifactId>`\n\
    \n`<version>${storm.version}</version>`\n\n`</dependency>`\n\n`<!-- Storm-Kafka\
    \ integration library -->`\n\n`<dependency>`\n\n`<groupId>org.apache.storm</groupId>`\n\
    \n`<artifactId>storm-kafka</artifactId>`\n\n`<version>${storm.version}</version>`\n\
    \n`</dependency>`\n\n`<!-- Kafka client libraries as Storm-Kafka integration library\
    \ does not include these -->`\n\n`<dependency>`\n\n`<groupId>org.apache.kafka</groupId>`\n\
    \n`<artifactId>kafka_2.11</artifactId>`\n\n`<version>${kafka.version}</version>`\n\
    \n`<exclusions>`\n\n`<!-- Excluded to avoid version issues between Kafka zookeeper\
    \ api and`\n\n`Storm-kafka zookeeper api -->`\n\n`<exclusion>`\n\n`<groupId>org.apache.zookeeper</groupId>`\n\
    \n`<artifactId>zookeeper</artifactId>`\n\n`</exclusion>`\n\n`<!-- Excluded to\
    \ avoid Pre-emptive StackOverflowException due to version/implementation`\n\n\
    `issues between Kafka slf4j/log4j api and Storm slf4j/log4js api -->`\n\n`<exclusion>`\n\
    \n`<groupId>org.slf4j</groupId>`\n\n`<artifactId>slf4j-log4j12</artifactId>`\n\
    \n`</exclusion>`\n\n`<exclusion>`\n\n`<groupId>log4j</groupId>`\n\n`<artifactId>log4j</artifactId>`\n\
    \n`</exclusion>`\n\n`</exclusions>`\n\n`</dependency>`\n\nOnce the dependency\
    \ has been updated in the **`pom.xml`** file, right-click on the project name\
    \ and select **`Maven`** | **`Update Project`** to update the entire project.\
    \ The following screenshot shows the location of the **`Update Project`** option:\n\
    \n![](images/12.6.jpg)\n\n**Figure 12.6:** Update Maven Project\n\nSelect the\
    \ options as shown below and click on **`OK`** to update the project with its\
    \ necessary dependencies:\n\n![](images/12.7.jpg)\n\n**Figure 12.7:** Update Maven\
    \ Project Options\n\nIn the preceding section, we saw the process of incorporating\
    \ the dependencies needed for the Kafka and Storm integration. In the next section,\
    \ we will learn to implement a Bolt.\n\n# [Implementation of Bolt](#toc.xhtml_s141a)\n\
    \nThe Bolt implementation requires us to implement the following methods:\n\n\
    *   **`execute()`**: The data received by the Bolt arrives here and we can process\
    \ it. In this example, we are logging the data received by the Bolt.\n\n*   **`declareOutputFields()`**:\
    \ The output of the processed data is stored in this output field declared here.\
    \ The name of the output field declared here is **`message`**.\n\n`import org.apache.log4j.Logger;`\n\
    \n`import org.apache.storm.topology.BasicOutputCollector;`"
