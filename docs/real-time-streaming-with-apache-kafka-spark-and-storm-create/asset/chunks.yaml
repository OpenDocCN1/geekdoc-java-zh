    \n# [Applications using Kafka](#toc.xhtml_s10a)\n\nSome of the applications of\
    \ Kafka are as follows:\n\n*   **Twitter**: The tweets in Twitter used Kafka.\
    \ Tweets are sent and received using it. The infrastructure used is Storm-Kafka.\n\
    \n*   **LinkedIn**: The activities in the LinkedIn platform use Kafka.\n\n*  \
    \ **Netflix**: Provides on-demand internet streaming of media content; it uses\
    \ Kafka for event processing.\n\nGenerally, Kafka is used in the following scenarios:\n\
    \n*   **Website tracking**: Tracking of the pages, views or searches, which the\
    \ user performs on a website can be stored in Kafka. Each activity can be published\
    \ to a topic.\n\n*   **Log aggregation**: Logs being written by various applications\
    \ can be stored in Kafka to be processed and the information extracted from it\
    \ can be given to the different subscribers.\n\n*   **Stream processing**: Kafka\
    \ has high-durability capability; hence, it is preferred over the other streaming\
    \ applications.\n\n*   **Messaging**: Since it is publish-subscribe system, it\
    \ can replace the traditional message queues. Its throughput and fault tolerant\
    \ nature makes it a more suitable choice.\n\nThese applications are the most widely\
    \ used use cases of the Kafka Messaging architecture. Knowing the above applications\
    \ will be helpful to understand how to make use Kafka for our own applications\
    \ and use cases.\n\n# [Conclusion](#toc.xhtml_s11a)\n\nIn this chapter, we learnt\
    \ the high-level messaging architecture of Kafka. We also understood partitions\
    \ and topics and how they are used while producing and consuming messages. The\
    \ brief description of the core APIs of Kafka was provided. The advantages of\
    \ using Kafka over the traditional message queues were compared. A preview of\
    \ the various applications of Kafka was seen.\n\nThis chapter should provide the\
    \ motivation behind using Kafka and enable us to identify relevant real-life scenarios\
    \ where this messaging architecture can be implemented.\n\nThe next chapter will\
    \ provide detailed steps to install Kafka and its dependencies, that is, JDK and\
    \ Zookeeper.\n\n# [Questions](#toc.xhtml_s12a)\n\n1.  **Which component in Kafka\
    \ manages the relay of messages from producer to its consumers?**\n\n    1.  Cluster\n\
    \n    2.  Zookeeper\n\n    3.  Broker\n\n    4.  Stream\n\n2.  **Which of the\
    \ following is not an application of Kafka?**\n\n    1.  Stream Processing\n\n\
    \    2.  Building website\n\n    3.  Log Aggregation\n\n    4.  Messaging\n\n\
    3.  **Which of the following is not an advantage of Kafka?**\n\n    1.  Not fault\
    \ tolerant\n\n    2.  High Throughput\n\n    3.  Scalable\n\n    4.  Reliable\n\
    \n4.  **Which API reads the message from the producer and sends to the consumer?**\n\
    \n    1.  Consumer API\n\n    2.  Connector API\n\n    3.  Streams API\n\n   \
    \ 4.  Producer API\n\n5.  **Which API is used for the management of broker and\
    \ topics?**\n\n    1.  Connector API\n\n    2.  Streams API\n\n    3.  Producer\
    \ API\n\n    4.  Admin Client API\n\n6.  **How does Kafka ensure high availability?**\n\
    \n    **Ans:** Through replication of the records in multiple nodes and clusters\n\
    \n7.  **Which of the following is not a component in Kafka architecture:**\n\n\
    \    1.  Admin API\n\n    2.  Brokers\n\n    3.  Producers\n\n    4.  Consumers\n\
    \n    5.  Zookeeper\n\n# [Answers](#toc.xhtml_s13a)\n\n1.  b\n\n2.  b\n\n3.  a\n\
    \n4.  c\n\n5.  d\n\n6.  a\n\n# [CHAPTER 2](#toc.xhtml_c02)\n\n# [Installing Kafka](#toc.xhtml_c02)\n\
    \n# [Introduction](#toc.xhtml_s14a)\n\nIn this chapter, we will learn to install\
    \ the software required for the running of Kafka Cluster. The installation of\
    \ the JDK, Zookeeper, and Kafka will be explained in detail. Setting up of the\
    \ Kafka Cluster is important to implement and execute Kafka producers and consumers.\n\
    \nApache Kafka installation is supported on various operating system such as the\
    \ Linux OS, mac OS as well as the Windows OS. The mac OS and Windows OS supports\
    \ development of the client and the server. The Linux OS supports the development\
    \ and the production for the Kafka client and the Kafka server. The prerequisites\
    \ for installing Kafka are JDK 6 or higher and the Zookeeper.\n\n# [Structure](#toc.xhtml_s15a)\n\
    \n*   Installing JDK\n\n*   Installing Zookeeper\n\n*   Running the Zookeeper\n\
    \n*   Configurable parameters of Zookeeper\n\n*   Apache Kafka installation\n\n\
    *   Running the Kafka server"
