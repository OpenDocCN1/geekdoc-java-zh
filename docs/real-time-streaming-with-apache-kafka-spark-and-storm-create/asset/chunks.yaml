  trans: "\n本章旨在理解使用 Storm 的动机以及 Apache Storm 的用途。Kafka 和 Storm 的主要区别在于 Kafka 不对数据流进行计算。Storm\
    \ 和 Hadoop 之间的区别在于 Hadoop 仅对批数据进行计算，而 Storm 提供了实时计算能力。\n\n在下一章中，我们将学习下载并安装 Storm\
    \ 及其依赖项。我们还将设置一个 Storm 集群作为示例。\n\n# 问题\n\n1. **哪个系统处理消息的速度更快？**\n    1. Hadoop\n\
    \    2. Storm\n    3. Kafka\n\n2. **Storm 的哪个组件用于从输入源读取数据？**\n    **答：** Spout\n\
    \n3. **Storm 的哪个组件用于处理数据？**\n    **答：** Bolt\n\n4. **拓扑（Topology）可以有多个 spout 吗？(是/否)**\n\
    \    **答：** 是\n\n5. **Bolt 可以将其处理后的结果发送给另一个 bolt 吗？(是/否)**\n    **答：** 是\n\n6.\
    \ **Kafka 会对其读取的数据进行计算吗？(是/否)**\n    **答：** 否\n\n7. **Storm 是无状态的吗？(是/否)**\n \
    \   **答：** 是\n\n# 答案\n\n1. b\n\n# 第 7 章\n\n# Storm 的安装与配置\n\n## 引言\n\n本章将重点介绍\
    \ Apache Storm 的安装。Apache Storm 是一款开源软件。我们将演示 Storm 及其前提条件的步骤说明。我们还将讨论用于实现和设置\
    \ storm 集群的属性和配置。\n\n## 结构\n\n* Apache Storm 的前提条件\n* 验证前提条件\n* Storm 框架安装\n*\
    \ Storm 集群设置\n* Storm 管理命令\n\n## 目标\n\n* Apache Storm 的前提条件\n* 下载并安装 Apache Storm\n\
    * 下载并安装 Zookeeper\n* 设置 Storm 集群\n* 学习管理 Storm 集群的命令\n\n## Apache Storm 的前提条件\n\
    \nStorm 的前提条件如下：\n\n* JDK\n* ZooKeeper\n* Python\n\n我们已经安装了 Java 和 ZooKeeper，因此我们只需验证其安装情况：\n\
    \n1. 验证我们机器上的 Java 安装情况。使用命令 `java-version`，我们可以验证我们机器上安装的 Java 版本，如下截图所示：\n\n\
    \   ![](img/7.1.jpg)\n\n   **图 7.1：** 验证 Java 安装\n\n2. 可以遵循 `[第 2 章：安装 Kafka]`\
    \ 中提供的 zookeeper 安装步骤。\n\n3. 导航到 `zookeeper` 目录，如下：\n\n   ![](img/7.2.jpg)\n\n\
    \   **图 7.2：** Zookeeper 目录\n\n4. 使用命令 `bin\\zkServer` 启动 Zookeeper。以下是显示 Zookeeper\
    \ 状态的输出消息：\n\n   ![](img/7.3.jpg)\n\n   **图 7.3：** 控制台中 Zookeeper 的启动状态\n\n5.\
    \ 现在，使用命令 `bin\\zkCli.cmd` 启动 CLI。当与 Zookeeper 建立连接时，将显示消息 `Welcome to Zookeeper`：\n\
    \n   ![](img/7.4.jpg)\n   **图 7.4：** CLI 消息\n\n6. 安装 Python。可以通过 URL `[https://www.python.org/downloads/windows/]`\
    \ 安装 Python 2.7。\n\n## Storm 框架安装\n\n我们将在机器上安装 Apache Storm。可以按照步骤安装 Storm：\n\n\
    1. Apache Storm 源码可以从 `[http://storm.apache.org/downloads.html]` 下载。\n\n   ![](img/7.5.jpg)\n\
    \n   **图 7.5：** Storm 下载链接\n\n2. 下载软件并解压文件。将文件解压到您希望运行 storm 集群的目录。此文件夹将用于执行各种配置并运行\
    \ Storm 集群。\n\n## 设置 Storm 集群\n\n可以通过以下步骤设置 Storm 集群：\n\n1. 导航到 storm 目录。打开命令提示符并使用\
    \ `cd <<storm path>>` 命令导航到 storm 目录，如下所示：\n\n   ![](img/7.6.jpg)\n\n   **图 7.6：**\
    \ 导航到 Storm 目录\n\n2. 打开 `config` 文件夹内的 `storm.yaml` 文件：\n\n   ![](img/7.7.jpg)\n\
    \n   **图 7.7：** 导航到 storm conf 文件夹\n\n3. 将截图所示的属性添加到 `storm.yaml` 文件：\n\n   ![](img/7.8.jpg)\n\
    \n   **图 7.8：** storm.yaml 文件\n\n   **属性：**\n\n   `storm.zookeeper.servers:`\n\
    \   - \" \"`\n\n4. 使用命令 `bin\\zkServer` 启动 Zookeeper。以下是显示 Zookeeper 状态的输出消息：\n\
    \n   ![](img/7.3.jpg)\n\n   **图 7.3：** 控制台中 Zookeeper 的启动状态\n\n5. 现在，使用命令 `bin\\\
    zkCli.cmd` 启动 CLI。当与 Zookeeper 建立连接时，将显示消息 `Welcome to Zookeeper`：\n\n   ![](img/7.4.jpg)\n\
    \n   **图 7.4：** CLI 消息\n\n6. 安装 Python。可以通过 URL `[https://www.python.org/downloads/windows/]`\
    \ 安装 Python 2.7。\n\n"
- fmt: "\n| `sql` | `storm sql sql-file topology-name` | The SQL statements will be\
    \ compiled and submitted to the Storm. |\n| `kill` | `storm kill topology-name\
    \ [-w wait-time-secs]` | The topology will be killed. The topology's spouts will\
    \ be deactivated for `wait-time-secs` and then workers will be shut down and their\
    \ state will be cleaned. |\n| `activate` | `storm activate topology-name` | The\
    \ spouts in the topology will be activated. |\n| `deactivate` | `storm deactivate\
    \ topology-name` | The spouts in the topology will be deactivated |\n| `rebalance`\
    \ | `storm rebalance topology-name [-w wait-time-secs] [-n new-num-workers] [-e\
    \ component=parallelism]*` | This command will first deactivate the existing topology\
    \ for the `wait-time-secs` and then redistribute the worker nodes and activate\
    \ the new topology. |\n| `classpath` | `storm classpath` | The classpath used\
    \ by the storm client while running commands is printed. |\n| `server_classpath`\
    \ | `storm server_classpath` | The classpath used by the storm daemons is printed.\
    \ |\n| `localconfvalue` | `storm localconfvalue conf-name` | It is used to print\
    \ the `conf-name` used in the local storm configuration file. |\n| `remoteconfvalue`\
    \ | `storm remoteconfvalue conf-name` | It is used to print the `conf-name` used\
    \ by the storm cluster. |\n| `nimbus` | `storm nimbus` | A nimbus daemon is launched.\
    \ |\n| `supervisor` | `storm supervisor` | A supervisor daemon is launched. |\n\
    | `ui` | `storm ui` | A UI daemon is launched. |\n| `drpc` | `storm drpc` | A\
    \ DRPC daemon is launched. |\n| `drpc-client` | `storm drpc-client [options] ([function\
    \ argument]*)|(argument*)` | It can send `drpc` requests. Using `-f`, a function\
    \ name can be provided and the arguments to the function is given too. |\n\n**Table\
    \ 7.2:** Storm Management Commands\n\nUsing the above commands, a storm cluster\
    \ can be managed and the deployed topologies can be viewed. The ports and the\
    \ IPs used by the worker nodes can be seen and monitored.\n\n# Conclusion\n\n\
    In this chapter, we learnt to set up a storm cluster. The pre-requisites for setting\
    \ up a storm cluster were shown. The installation of all the software is described.\
    \ The properties used by the storm cluster are described. The management commands\
    \ used to deploy and manage storm topologies were seen.\n\nYou would be able to\
    \ set up a storm cluster for your own application. In the next chapter, we will\
    \ discuss how to implement spouts and bolts. A topology creation and deployment\
    \ on the cluster will also be shown. An example application will be implemented\
    \ using the concepts that we have learnt.\n\n# Questions\n\n1. Which command is\
    \ used to start the master node?\n2. Which command is used to start the worker\
    \ node?\n3. Which command is used to re-organize the worker nodes in a storm cluster?\n\
    4. Which command is used to activate a storm topology?\n5. Which command is used\
    \ to delete the storm topology?\n6. Which command is used to launch a `drpc` daemon?\n\
    \n# Answers\n\n1. `storm.py nimbus`\n2. `storm.py supervisor`\n3. `rebalance`\n\
    4. `activate`\n5. `kill`\n6. `storm.py drpc`\n\n# Chapter 8: Spouts and Bolts\n\
    \n# Introduction\n\nIn this chapter, we will implement a transaction alerts application\
    \ using Spout and Bolts. We will learn how to design the pipeline using the Storm\
    \ cluster, and then proceed to coding the design. The way in which one bolt's\
    \ output is passed to the next bolt will be shown. The execution of the implemented\
    \ code will be shown. The Maven project will be used for the implementation using\
    \ Eclipse IDE.\n\n# Structure\n\n* Transaction alert application\n* Creating a\
    \ Maven project\n* Spout implementation\n* Bolt implementation\n* Integration\
    \ of components through topology\n* Executing the application\n\n# Objectives\n\
    \n* Understanding the transaction alert application\n* Building the Storm cluster\n\
    * Learning to implement the spout\n* Learning the implementation of bolt\n* Topology\
    \ implementation\n* Executing the transaction alert application\n\n# Transaction\
    \ alert application\n\nIn this example, we will design a system to read transaction\
    \ streams data and count the number of transactions performed by a customer. If\
    \ the count of the transactions exceeds a threshold, the system will send an alert\
    \ message. This alert message will be stored in the database for persistent storage:\n\
    \n![](images/8.1.jpg)\n\n**Figure 8.1:** Transaction alert system flow\n\n* **Transactions\
    \ source data**: The transactions streams data contains the customer ID, the time\
    \ stamp, and transaction ID and the transaction amount.\n* **Transactions reader**:\
    \ This component will read the stream of transaction data and send it to the bolt\
    \ for further processing.\n* **Transactions parser**: This component will read\
    \ the transaction data from the spout and perform a sanity check. The sanity check\
    \ performed will ensure the data contains the four fields required, that is the\
    \ customer ID, timestamp, transaction ID, and transaction amount. The parser will\
    \ read the data and split it into multiple key values.\n* **Transactions count\
    \ tracker**: This component will read the customer ID and the transaction ID and\
    \ count the number of transactions for each customer.\n* **Transactions alerts**:\
    \ This component will check the count for each customer and compare with the threshold.\
    \ If the count exceeds the threshold, an alert will be sent by the system.\n*\
    \ **Store Results to DB**: The output of this system will be then stored in the\
    \ database.\n\n# Creating the Maven project\n\nIn this section, we will implement\
    \ the steps 1-5 shown above. Maven is used within eclipse for the implementation\
    \ of the storm pipeline:\n\n1. Create `New Project`. Open Eclipse, create a new\
    \ workspace in Eclipse, right-click on the Project Explorer, and select `New`\
    \ -> `Project` as shown in the following:\n![](images/8.2.jpg)\n**Figure 8.2:**\
    \ New Project Creation\n\n2. Search for Maven and select `Maven Project` as shown\
    \ in the following:\n![](images/8.3.jpg)\n**Figure 8.3:** Select Maven Project\n\
    \n3. Click `Next` on the dialog box shown in the following:\n![](images/8.4.jpg)\n\
    **Figure 8.4:** Accept Default\n\n4. Accept the default and click `Next` on the\
    \ dialog box shown in the following:\n![](images/8.5.jpg)\n**Figure 8.5:** Accept\
    \ default in the Dialog\n\n5. Provide the group ID and the artifact as shown in\
    \ the dialog in the following:\n![](images/8.6.jpg)\n**Figure 8.6:** Provide Group\
    \ ID and Artifact ID\n\n6. The new Maven project will be created as shown in the\
    \ following:\n![](images/8.7.jpg)\n**Figure 8.7:** View the created project\n\n\
    In the preceding section, we learnt how to create a Maven project in eclipse and\
    \ verify its creation. In the next sections, we will learn to implement spout,\
    \ bolt, and other classes needed for the implementation of the storm pipeline.\n\
    \n# Spout implementation\n\nIn the following section, we will look at the implementation\
    \ of the spout. The code for the spout is as follows:\n\n```java\nTransactionReaderSpout.java\n\
    package TransactionAlertsSystemGrpId.TransactionAlertsSystem;\n\nimport java.util.Map;\n\
    import org.apache.storm.spout.SpoutOutputCollector;\nimport org.apache.storm.task.TopologyContext;\n\
    import org.apache.storm.topology.IRichSpout;\nimport org.apache.storm.topology.OutputFieldsDeclarer;\n\
    import org.apache.storm.tuple.Fields;\nimport org.apache.storm.tuple.Values;\n\
    \npublic class TransactionReaderSpout implements IRichSpout {\n    /**\n     *\n\
    \     */\n    private static final long serialVersionUID = 441925018520917L;\n\
    }\n```\n"
