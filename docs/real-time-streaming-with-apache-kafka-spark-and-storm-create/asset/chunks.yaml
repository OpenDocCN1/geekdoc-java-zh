    \    <dependency>\n      <groupId>com.sparkjava</groupId>\n      <artifactId>spark-kotlin</artifactId>\n\
    \      <version>1.0.0-alpha</version>\n    </dependency>\n</dependencies>\n```\n\
    \n6. 使用以下代码设置服务 `hello`：\n\n    ![](img/10.22.jpg)\n\n    **图 10.22:** Scale 服务代码\n\
    \n7. 运行 URL：`http://localhost:4567/hello` 来测试服务：\n\n    ![](img/10.23.jpg)\n\n\
    \    **图 10.23:** 运行服务\n\n在本节中，我们学习了如何使用 Spark API 设置服务。\n\n# 结论\n\n在本章中，我们学习了\
    \ Spark Streaming 的核心概念。描述了使用 Spark shell 执行命令的方法。详细介绍了如何使用 Eclipse IDE 实现 Spark。展示了如何使用\
    \ Spark 实现服务。\n\n在下一章中，我们将学习 Spark 与 Kafka 的集成。\n\n# 问题\n\n1. Spark 中的数据批次称为什么什么？\n\
    2. Spark 可以用于批处理和实时处理 吗？\n3. Spark Streaming 可以与机器学习库 MLib 集成 吗？\n4. 否使用 Scala\
    \ 实现 Spark 吗？\n5. 使用哪个函数在 Spark 中设置服务？\n\n# 回答\n\n1. DStreams\n2. 是\n3. 是\n4.\
    \ 是\n5. `get()`\n\n# 第 11 章：Kafka 与 Spark 的集成\n\n# 引言\n\n在本章中，我们将学习 Kafka 和 Spark\
    \ 的集成。Kafka 可以通过多种方法与 Spark Streaming 集成。我们将学习 Kafka 与 Spark 的结构化流集成。我们将学习 Kafka\
    \ 和 Spark API 的实现，这些 API 支持 Spark Streaming 从 Kafka 流中读取数据。\n\n# 结构\n\n本章的结构如下：\n\
    \n* Kafka 和 Spark 的集成\n* Kafka 和 Spark 的集成方法\n* Kafka 和 Spark 的结构化流集成\n* Kafka\
    \ 和 Spark Streaming 的实现\n\n# 目标\n\n本章的目标是：\n\n* 理解 Apache Kafka 和 Spark 集成的概念\n\
    * 学习集成的不同方法\n* 学习 Kafka 的结构化流集成\n* 理解 Kafka 和 Spark Streaming 的实现\n\n# Kafka 和\
    \ Spark 的集成\n\nApache Kafka 可以与 Spark Streaming 集成，其中 Spark Streaming 接收来自 Kafka\
    \ 的数据。集成可以通过两种方法进行：\n\n* 基于接收器的方法 (Receiver-based approach)\n* 直接方法 (Direct approach)\n\
    \n如下所示，Kafka 流可以将数据发送到 Spark Streaming 组件。Spark 引擎可以对数据进行任何所需的计算。处理后的数据将存储在数据库中：\n\
    \n![](img/11.1.jpg)\n\n**图 11.1:** Kafka 与 Spark 集成\n\n还有与 Kafka 的结构化流集成，数据从 Kafka\
    \ 流中读取，由 Spark 引擎处理并写回 Kafka，如下所示：\n\n![](img/11.2.jpg)\n\n**图 11.2:** 结构化流 Kafka\
    \ 与 Spark 集成\n\nKafka 提供了库和 API 来支持 Spark 引擎与其输入输出流的集成。\n\n# 集成方法\n\n在本节中，我们将两种方法，即基于接收器的方法和直接方法：\n\
    \n* **基于接收器的方法**：这是初始方法，使用 Kafka API 实现并使用接收器。数据被传递给 Spark Streaming。\n* **直接方法**：这是不使用接收器的新方法。\n\
    \n# Kafka 与 Spark 的结构化流集成\n\n在本节中，我们将学习如何实现从 Kafka 读取的函数。\n\n### 创建批查询的 Kafka\
    \ 源\n\n以下显示了对一个主题的订阅，当未提供起始和结束偏移量时，默认使用最早和最新的偏移量：\n\n```scala\nval df = spark.read\n\
    \  .format(\"kafka\")\n  .option(\"kafka.bootstrap.servers\", \"localhost:9092\"\
    )\n  .option(\"subscribe\", \"topic1\")\n  .load()\n```\n"
- fmt: "\n```scala\n// Subscribe to 1 topic defaults to the earliest and latest offsets\n\
    valdf=spark\n.read\n  .format(\"kafka\")\n  .option(\"kafka.bootstrap.servers\"\
    ,\"host1:port1,host2:port2\")\n  .option(\"subscribe\",\"topic1\")\n  .load()\n\
    df.selectExpr(\"CAST(key AS STRING)\",\"CAST(value AS STRING)\")\n.as[(String,\
    \ String)]\n```\n\nThe following shows subscribing to multiple topics and specifying\
    \ explicit offsets:\n\n```scala\n// Subscribe to multiple topics, specifying explicit\
    \ Kafka offsets\nvaldf=spark\n.read\n  .format(\"kafka\")\n  .option(\"kafka.bootstrap.servers\"\
    ,\"host1:port1,host2:port2\")\n  .option(\"subscribe\",\"topic1,topic2\")\n  .option(\"\
    startingOffsets\",\"\"\"{\"topic1\":{\"0\":23,\"1\":-2},\"topic2\":{\"0\":-2}}\"\
    \"\")\n  .option(\"endingOffsets\",\"\"\"{\"topic1\":{\"0\":50,\"1\":-1},\"topic2\"\
    :{\"0\":-1}}\"\"\")\n  .load()\ndf.selectExpr(\"CAST(key AS STRING)\",\"CAST(value\
    \ AS STRING)\")\n.as[(String, String)]\n```\n\nThe following shows subscribing\
    \ to a pattern and specifying explicit offsets as earliest and latest:\n\n```scala\n\
    // Subscribe to a pattern, at the earliest and latest offsets\nvaldf=spark\n.read\n\
    \  .format(\"kafka\")\n  .option(\"kafka.bootstrap.servers\",\"host1:port1,host2:port2\"\
    )\n  .option(\"subscribePattern\",\"topic.*\")\n  .option(\"startingOffsets\"\
    ,\"earliest\")\n  .option(\"endingOffsets\",\"latest\")\n  .load()\ndf.selectExpr(\"\
    CAST(key AS STRING)\",\"CAST(value AS STRING)\")\n.as[(String, String)]\n```\n\
    \n## 2. Consumer caching\n\nInitializing a consumer takes time; and therefore,\
    \ a caching mechanism is used for storing the frequently used consumers. The topic\
    \ name, topic partition, and group ID are used as a caching key to cache the consumers.\n\
    \nThe `spark.kafka.consumer.cache.capacity` decides the size of the pool. The\
    \ `spark.kafka.consumer.cache.timeout` is the amount of time the consumer can\
    \ be idle. If it is idle for the specified amount of time, it will be evicted.\n\
    \n## 3. Writing data to Kafka\n\nStreaming queries and batch queries can be written\
    \ to Kafka. Kafka supports at least once write mechanism where the data will be\
    \ written once; and if the broker does not send an acknowledgement, it will be\
    \ resent again. Therefore, there are possibilities of duplicates.\n\nThe columns\
    \ that must be present in the data frame written to Kafka are: key, value, headers,\
    \ topic and partition.\n\n## 4. Creating a sink for Streaming queries\n\nUsing\
    \ the following code, we can write key, value to a specific topic, which is provided\
    \ in the `option()` function:\n\n```scala\n// Write key-value data from a DataFrame\
    \ to a specific Kafka topic specified in an option\nvalds=df\n.selectExpr(\"CAST(key\
    \ AS STRING)\",\"CAST(value AS STRING)\")\n.writeStream\n  .format(\"kafka\")\n\
    \  .option(\"kafka.bootstrap.servers\",\"host1:port1,host2:port2\")\n  .option(\"\
    topic\",\"topic1\")\n  .start()\n```\n\nUsing the following code, the key value\
    \ is written to a topic specified in the data:\n\n```scala\n// Write key-value\
    \ data from a DataFrame to Kafka using a topic specified in the data\nvalds=df\n\
    .selectExpr(\"topic\",\"CAST(key AS STRING)\",\"CAST(value AS STRING)\")\n.writeStream\n\
    \  .format(\"kafka\")\n  .option(\"kafka.bootstrap.servers\",\"host1:port1,host2:port2\"\
    )\n  .start()\n```\n\n## 5. Writing output of batch queries to Kafka\n\nFor batch\
    \ queries, data in key value form is written to topics specified through the `option()`\
    \ function. The following code depicts the usage of `option()`:\n\n```scala\n\
    // Write key-value data from a DataFrame to a specific Kafka topic specified in\
    \ an option\ndf.selectExpr(\"CAST(key AS STRING)\",\"CAST(value AS STRING)\")\n\
    .write\n  .format(\"kafka\")\n  .option(\"kafka.bootstrap.servers\",\"host1:port1,host2:port2\"\
    )\n  .option(\"topic\",\"topic1\")\n  .save()\n```\n\nFor batch queries, data\
    \ in key value form is written to topics specified through the data. The following\
    \ code depicts the usage:\n\n```scala\n// Write key-value data from a DataFrame\
    \ to Kafka using a topic specified in the data\ndf.selectExpr(\"topic\",\"CAST(key\
    \ AS STRING)\",\"CAST(value AS STRING)\")\n.write\n  .format(\"kafka\")\n  .option(\"\
    kafka.bootstrap.servers\",\"host1:port1,host2:port2\")\n  .save()\n```\n\nIn the\
    \ above section, we learnt the process of creating a Kafka source, caching and\
    \ writing data to Kafka.\n\n# Implementation of Kafka and Spark streaming\n\n\
    Apache Kafka provides the publish-subscribe system. The producers publish data\
    \ and the subscriber consumes the data.\n\n*   **Linking:**\n    Linking is the\
    \ process of integrating Spark and Kafka. This approach is supported only in Scala/Java.\
    \ With the following artifact:\n    `groupId = org.apache.spark`\n    `artifactId\
    \ = spark-kafka-0-10_22`\n    `version = 3.0.0`\n\n*   **Creating Direct Stream**\n\
    \    The `Record` object is used to represent the data. Each stream is assigned\
    \ a group ID. The topics names are created in an array. The parameters are passed\
    \ to `Subscribe()`.\n\n```scala\nimport org.apache.kafka.clients.consumer.ConsumerRecord\n\
    import org.apache.kafka.common.serialization.StringDeserializer\nimport org.apache.spark.streaming.kafka10._\n\
    import org.apache.spark.streaming.kafka10.LocationStrategies.PreferConsistent\n\
    import org.apache.spark.streaming.kafka10.ConsumerStrategies.Subscribe\n\nval\
    \ kafkaParams = Map[String, Object](\n  \"bootstrap.servers\" -> \"localhost:9092,anotherhost:9092\"\
    ,\n  \"key.deserializer\" -> classOf[StringDeserializer],\n  \"value.deserializer\"\
    \ -> classOf[StringDeserializer],\n  \"group.id\" -> \"group_id_for_each_stream\"\
    ,\n  \"auto.offset.reset\" -> \"latest\",\n  \"enable.auto.commit\" -> (false:\
    \ java.lang.Boolean)\n)\n\nval topics = Array(\"topicA\", \"topicB\")\nval stream\
    \ = KafkaUtils.createDirectStream[String, String](\n  streamingContext,\n  PreferConsistent,\n\
    \  Subscribe[String, String](topics, kafkaParams)\n)\n\nstream.map(record => (record.key,\
    \ record.value))\n```\n\n*   **Location strategies**\n    The Kafka consumers\
    \ are cached on the executors of Spark. The most commonly used strategy is `LocationStrategies.PreferConsistent`.\
    \ This means that the consumers are evenly distributed on the executors. Location\
    \ Strategy allows `DirectKafkaInputStream` to request Spark executors to execute\
    \ Kafka consumers as close topic leaders of topic partitions as possible. `LocationStrategy`\
    \ is used when `DirectKafkaInputStream` computes a `KafkaRDD` for a given batch\
    \ interval\n\n*   **Consumer strategies**\n    The Kafka consumer API can specify\
    \ the Kafka topics in various ways. `ConsumerStrategies.Subscribe` means we can\
    \ subscribe to a pre-defined set of topics. Using `assign()`, we can provide the\
    \ set of partitions. `PartitionsConsumerStrategy` is a contract to create Kafka\
    \ consumers in a Spark Streaming application that allows for their configuration\
    \ to be customized after the customers have been created. Kafka consumers and\
    \ records from topic partitions in a Kafka cluster. You can access the predefined\
    \ consumer strategy implementations using the `ConsumerStrategies` factory object.\n\
    \n*   **Deploying**\n    `spark-submit` are used to initiate the application.\
    \ `spark-streaming-kafka-0-10_2.11` and its dependencies should be packaged into\
    \ the application JAR. `spark-core_2.11` and `spark-streaming_2.11` should be\
    \ marked as provided dependencies.\n"
