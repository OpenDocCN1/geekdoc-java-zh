    \ at least once write mechanism where the data will be written once; and if the\
    \ broker does not send an acknowledgement, it will be resent again. Therefore,\
    \ there are possibilities of duplicates.\n\n    The columns that must be present\
    \ in the data frame written to Kafka are: key, value, headers, topic and partition.\n\
    \n4.  **Creating a sink for Streaming queries**\n\n    Using the following code,\
    \ we can write key, value to a specific topic, which is provided in the **`option()`**\
    \ function:\n\n    `// Write key-value data from a DataFrame to a specific Kafka\
    \ topic specified in an option`\n\n    `valds=df`\n\n    `.selectExpr(\"CAST(key\
    \ AS STRING)\",\"CAST(value AS STRING)\")`\n\n    `.writeStream`\n\n    `.format(\"\
    kafka\")`\n\n    `.option(\"kafka.bootstrap.servers\",\"host1:port1,host2:port2\"\
    )`\n\n    `.option(\"topic\",\"topic1\")`\n\n    `.start()`\n\n    Using the following\
    \ code, the key value is written to a topic specified in the data:\n\n    `//\
    \ Write key-value data from a DataFrame to Kafka using a topic specified in the\
    \ data`\n\n    `valds=df`\n\n    `.selectExpr(\"topic\",\"CAST(key AS STRING)\"\
    ,\"CAST(value AS STRING)\")`\n\n    `.writeStream`\n\n    `.format(\"kafka\")`\n\
    \n    `.option(\"kafka.bootstrap.servers\",\"host1:port1,host2:port2\")`\n\n \
    \   `.start()`\n\n5.  **Writing output of batch queries to Kafka**\n\n    For\
    \ batch queries, data in key value form is written to topics specified through\
    \ the **`option()`** function. The following code depicts the usage of **`option()`**:\n\
    \n    `// Write key-value data from a DataFrame to a specific Kafka topic specified\
    \ in an option`\n\n    `df.selectExpr(\"CAST(key AS STRING)\",\"CAST(value AS\
    \ STRING)\")`\n\n    `.write`\n\n    `.format(\"kafka\")`\n\n    `.option(\"kafka.bootstrap.servers\"\
    ,\"host1:port1,host2:port2\")`\n\n    `.option(\"topic\",\"topic1\")`\n\n    `.save()`\n\
    \n    For batch queries, data in key value form is written to topics specified\
    \ in the data. The following code depicts the usage:\n\n    `// Write key-value\
    \ data from a DataFrame to Kafka using a topic specified in the data`\n\n    `df.selectExpr(\"\
    topic\",\"CAST(key AS STRING)\",\"CAST(value AS STRING)\")`\n\n    `.write`\n\n\
    \    `.format(\"kafka\")`\n\n    `.option(\"kafka.bootstrap.servers\",\"host1:port1,host2:port2\"\
    )`\n\n    `.save()`\n\nIn the above section, we learnt the process of creating\
    \ a Kafka source, caching and writing data to Kafka.\n\n# [Implementation of Kafka\
    \ and Spark streaming](#toc.xhtml_s130a)\n\nApache Kafka provides the publish-subscribe\
    \ system. The producers publish data and the subscriber consumes the data.\n\n\
    *   **Linking:**\n\n    Linking is the process of integrating Spark and Kafka\
    \ into the environment used for development. This approach is supported only in\
    \ Scala/Java development. With the following artifact, link the SBT/Maven project:\n\
    \n    `groupId = org.apache.spark`\n\n    `artifactId = spark-sql-kafka-0-10_2.12`\n\
    \n    `version = 3.0.0`\n\n*   **Creating a Direct Stream**\n\n    The **`ConsumerRecord`**\
    \ object is used to represent the data. Each stream is assigned a group ID. The\
    \ Kafka parameters are formed using **`kafkaParams`**. The names of the topics\
    \ are created in an array. The topics names and the parameters are passed to **`Subscribe()`**.\
    \ The **`createDirectStream()`** is used to create the direct stream:\n\n    `import\
    \ org.apache.kafka.clients.consumer.ConsumerRecord`\n\n    `import org.apache.kafka.common.serialization.StringDeserializer`\n\
    \n    `import org.apache.spark.streaming.kafka010._`\n\n    `import org.apache.spark.streaming.kafka010.LocationStrategies.PreferConsistent`\n\
    \n    `import org.apache.spark.streaming.kafka010.ConsumerStrategies.Subscribe`\n\
    \n    `val kafkaParams = Map[String, Object](`\n\n    `\"bootstrap.servers\" ->\
    \ \"localhost:9092,anotherhost:9092\",`\n\n    `\"key.deserializer\" -> classOf[StringDeserializer],`\n\
    \n    `\"value.deserializer\" -> classOf[StringDeserializer],`\n\n    `\"group.id\"\
    \ -> \"group_id_for_each_stream\",`\n\n    `\"auto.offset.reset\" -> \"latest\"\
    ,`\n\n    `\"enable.auto.commit\" -> (false: java.lang.Boolean)`\n\n    `)`\n\n\
    \    `val topics = Array(\"topicA\", \"topicB\")`\n\n    `val stream = KafkaUtils.createDirectStream[String,\
    \ String](`\n\n    `streamingContext,`\n\n    `PreferConsistent,`\n\n    `Subscribe[String,\
    \ String](topics, kafkaParams)`\n\n    `)`\n\n    `stream.map(record => (record.key,\
    \ record.value))`\n\n*   **Location strategies**\n\n    The Kafka consumers are\
    \ cached on the executors of Spark. The most commonly used strategy is **`LocationStrategies.PreferConsistent`**.\
    \ This means that the consumers are evenly distributed on the executors. Location\
    \ Strategy allows **`DirectKafkaInputStream`** to request Spark executors to execute\
    \ Kafka consumers as close topic leaders of topic partitions as possible. **`LocationStrategy`**\
    \ is used when **`DirectKafkaInputStream`** computes a **`KafkaRDD`** for a given\
    \ batch interval and is a means of distributing processing Kafka records across\
    \ Spark executors.\n\n*   **Consumer strategies**\n\n    The Kafka consumer API\
    \ can specify the Kafka topics in various ways. **`ConsumerStrategies.Subscribe`**\
    \ means we can subscribe to a pre-defined set of topics. Using **`assign()`**,\
    \ we can provide the set of partitions. **`PartitionsConsumerStrategy`** is a\
    \ contract to create Kafka consumers in a Spark Streaming application that allows\
    \ for their configuration to be customized after the customers have been created.\
    \ Kafka consumers and records from topic partitions in a Kafka cluster. You can\
    \ access the predefined consumer strategy implementations using the **`ConsumerStrategies`**\
    \ factory object.\n\n*   **Deploying**\n\n    Spark-submit are used to initiate\
    \ the application. **`spark-streaming-kafka-0-10_2.11`** and its dependencies\
    \ should be packaged into the application JAR. **`spark-core_2.11`** and **`spark-streaming_2.11`**\
    \ should be marked as provided dependencies.\n\n# [Conclusion](#toc.xhtml_s131a)"
