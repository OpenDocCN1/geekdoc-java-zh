    In the previous chapter, we learnt about the Kafka messaging architecture. The
    purpose of the producers and consumers were described. We also set up the eclipse
    IDE and IntelliJ IDE so that we can implement the producers and consumers using
    the IDE. In this chapter, we will learn to implement the Kafka producer in Java.
    We will deep dive into the APIs that are available to implement Kafka producers.
    The command line consumer client we learnt in the previous chapter will be used
    to test the Kafka producer. The implementation of the producer will be explained
    in detail. In the end, we will look at some real-time applications of Kafka producers.


    # Structure](#toc.xhtml_s44a)


    The structure of the chapter is as follows:


    * API for a Kafka producer

    * Producer implementation in Java

    * Understanding the implementation of producer

    * Executing the producer

    * Three ways to send a Kafka message

    * Types of acknowledgements

    * Producer applications


    # Objectives](#toc.xhtml_s45a)


    The objectives of the chapter are:


    * Understanding the functions in Java

    * Implementing the Kafka producer

    * Understanding the implementation of producers

