  trans: "\nKafka 中的一个主题（topic）被写入多个名为 `partitions`（分区）的日志。生产者向这些日志的末尾写入，而消费者可以按照自己的速度从这些日志中消费。消息以顺序方式从这些分区中读取。\n\
    \n从不同分区进行读取的原因是为了扩展消费者对数据的消费能力。在`图 5.1`中，`Topic A` 存储三个分区中。该主题有两个消费者，`Consumer\
    \ 1` 和 `Consumer 2`。它们组成了一个消费者组。每个分区被分配给一个消费者进行读取。\n\n消费者组中的每个消费者将获得分区的独占份额。在一个消费者组内，不会有超过一个消费者读取同一个分区。每个组通过其其中一个消费者读取一个分区。这就是消费者组实现负载均衡的方式。\n\
    \n如果分区数量少于消费者组数量，则某些消费者组将保持空闲状态，并在故障转移期间使用。如果分区数量多于消费者组，则少数消费者组可能会从多个分区读取。\n\n\
    每个消费者组对每个分区都有自己的偏移量（offset）。该偏移量可能与其他消费者组不同：\n\n消费者 2\n\n![](img/5.1.jpg)\n\n\
    **图 5.1：** 消费者组\n\n在本节中，我们学习了消费者组以及它们在从分区读取时如何进行负载均衡。将在下一节中查看组遵循的协议。\n\n# 组协调协议\n\
    \n当创建一个消费者组时，需要管理组内的消费者。使用组协调协议来管理消费者。每个组都有一个指定的 broker 被分配为组协调员。该协调员负责管理组的状态。协调员的职责如下：\n\
    \n* 将日志分区分配给消费者进行读取。\n* 如果添加了新消费者，则为其分配分区。\n* 当现有消费者离开时，管理组的状态。\n* 如果主题发生变化，相应地分配分区。\n\
    \n当发生读取操作时，分区内部是顺序读取的。在读取少量记录后，消费者可能会提交已读取的记录。\n\n`图 5.2`显示了一个带有位置的典型分区日志。在`图\
    \ 5.2`中，`Last Committed Offset`（最后提交偏移量）是消费者已提交读取记录的位置。消费者随后继续读取到位置 4，这是其当前的读取点。\n\
    \n在此阶段，发生了故障，消费者被一个新消费者替换，新消费者需要从偏移量 2 开始读取，即之前保存的记录。位置 2 和 4 之间的读取记录需要重新读取。\n\
    \n记录也会被复制到其他分区，作为数据复制过程的一部分，以实现数据的高可用性。因此，已保存到其他日志分区的记录位置是高水位点（high watermark\
    \ point）。消费者可以安全地读取到此点，超过此点后如果消费者继续读取，可能会出现一种情况：如果记录丢失，在其他地方将没有它的副本：\n\n![](img/5.2.jpg)\n\
    \n**图 5.2：** 消费者日志及其偏移量\n\n因此，使用该协议，消费者能够协调并以高可用性访问数据。\n\n# Kafka 消费者的 API\n\n\
    Java 提供了许多实现 Kafka 消费者的函数。以下是执行其活动所需的 API：\n\n| 序号 | 方法 | 说明 |\n| :--- | :---\
    \ | :--- |\n| 1 | `void assign(Collection<TopicPartition> partitions)` | 分区可以手动分配给消费者。\
    \ |\n| 2 | `Set<TopicPartition>assignment()` | 获取当前分配给消费者的分区。 |\n| 3 | `void commitAsync()`\
    \ | 对于 `poll` 命令返回的偏移量，提交主题和分区列表的偏移量。 |\n| 4 | `Map<String,List<PartitionInfo>>listTics()`\
    \ | 列出关于所有主题分区的元数据。 |\n| 5 | `java.util.Map<MetricName,? extends Metric> Metrics()`\
    \ | 这返回每个消费者中存在的指标（metrics）。 |\n| 6 | `ConsumerRecords<K,V>poll(Duration timeout)`\
    \ | 获取订阅的主题或分区的数据。 |\n| 7 | `void subscribe(Collection<String> topics)` | 订阅给定的主题列表。\
    \ |\n| 8 | `void Close()` | 此方法将关闭消费者。 |\n| 9 | `Set<String>subscription()` |\
    \ 获取当前的订阅。 |\n| 10 | `void unsubscribe()` | 取消订阅当前订阅的主题。 |\n\n**表 5.1：** Kafka\
    \ 消费者 API\n\n在本节中，我们简要概述了 Kafka 消费者使用的一组 API。\n\n# Java 中的消费者实现\n\n以下是 Kafka 消费者的\
    \ Java 实现：\n\n```java\nimport java.util.Properties;\nimport java.util.Arrays;\n\
    import org.apache.kafka.clients.consumer.KafkaConsumer;\nimport org.apache.kafka.clients.consumer.ConsumerRecords;\n\
    import org.apache.kafka.clients.consumer.ConsumerRecord;\n\npublic class Consumer\
    \ {\n    public static void main(String[] args) throws Exception {\n        //Kafka\
    \ 配置设置\n        String topicName=\"Kafka-Topic\";\n        Properties props =\
    \ new Properties();\n        //Kafka 消费者设置\n        props.put(\"bootstrap.servers\"\
    , \"localhost:9092\");\n        //消费者所属的组\n        props.put(\"group.id\", \"\
    kafkroup\");\n        // 偏移量根据 auto.commit.ms 指定的频率自动提交\n        props.put(\"\
    enable.auto.commit\", \"true\");\n        // auto.commit.ms 是提交数据的间隔\n       \
    \ props.put(\"auto.commit.ms\", \"1000\");\n        // 超时时间\n        props.put(\"\
    session.timeout.ms\", \"30000\");\n        props.put(\"key.deserializer\", \"\
    org.apache.kafka.clients.serialization.StringDeserializer\");\n        props.put(\"\
    value.deserializer\", \"org.apache.kafka.clients.serialization.StringDeserializer\"\
    );\n        // 创建消费者实例\n        KafkaConsumer<String, String>consumer = new KafkaConsumer<String,\
    \ String>(props);\n        // Kafka 消费者在此订阅主题列表\n        consumer.subscribe(Arrays.asList(topicName));\n\
    \        // 打印主题名称\n        System.out.println(\"Subscribing to the topic \" +\
    \ topicName);\n        while (true) {\n            // 每轮询 10 条记录\n           \
    \ ConsumerRecords<String, String>records = consumer.poll(10);\n            //\
    \ 遍历轮询记录\n            for (ConsumerRecord<String, String>record : records) {\n\
    \                // 打印收到的消费者记录的偏移量、键和值\n                System.out.printf(\"offset\
    \ is %d, key is %s, value is %s\\n\",\n                record.offset(), record.key(),\
    \ record.value());\n            }\n        }\n    }\n}\n```\n\n"
