    ## 2. Execute the following command:


    ```

    bin\windows\kafka-topics.bat --create --zookeeper localhost:2181 --replication-factor
    1 --partitions 1 --topic Kafka-Topic

    ```


    ![](images/3.2.jpg)


    **Figure 3.2:** Creation of Kafka topic


    If the topic is successfully created, you will see `Created topic <<Topic name>>`.
    Here we are creating a single partition with replica as 1 too.


    ## 3. To list all the topics that was created, the following command is used:


    ```

    bin\windows\kafka-topics.bat --list --zookeeper localhost:2181

    ```


    ![](images/3.3.jpg)


    **Figure 3.3:** Listing all Kafka topics


    Using the preceding steps, we can successfully create a Kafka Topic and list all
    the created topics. The topics can be listed to confirm its creation.


    ## Deleting a Kafka topic


    To delete a Kafka topic, perform the following steps:


    1. Add `delete.topic.enable=true` in `server.properties` file.

    2. Stop the Kafka server.

    3. Start the server again.

    4. Execute the following command:


    ```

    bin\windows\kafka-topics.bat --zookeeper localhost:2181 --delete --topic Test-Kafka5

    ```


    ![](images/3.4.jpg)


    **Figure 3.4:** Deletion of Kafka topic


    Using the preceding steps, we can successfully delete a Kafka topic. After deleting
    a topic, we can list the Kafka topics to check whether it has been successfully
    deleted.


    ## Send and receive messages through a command line


    In this section, we will learn to send messages using a Kafka producer. We will
    run the consumer to receive these messages.


    ## Creating a producer


    To send messages, we need to create a producer. Open a new window in Command Prompt
    and navigate to the `Kafka` directory. The following command takes the port at
    which the Kafka server is running as an input along with the topic name to which
    the messages needs to be sent:


    ```

    bin\windows\kafka-console-producer.bat --broker-list localhost:9092 --topic Kafka-Topic

    ```


    ![](images/3.5.jpg)


    **Figure 3.5:** Creation of Kafka producer


    As you can see above, the prompt is waiting for us to type a message. Let’s create
    a consumer before we send a message.


    ## Creating a consumer


    To create a consumer, the port at which Kafka is running and the topic name is
    provided as input. Open a new window in Command Prompt and navigate to the `Kafka`
    directory. The following command creates a consumer:


    ```

    bin\windows\kafka-console-consumer.bat --bootstrap-server localhost:9092 --topic
    Kafka-Topic --from-beginning

    ```


    ![](images/3.6.jpg)


    **Figure 3.6:** Creation of Kafka consumer


    The parameter `from-beginning` ensures that the consumer reads all the messages
    belonging to the topic from the beginning.


    Now that we have the producer and the consumer running on two separate windows,
    we can type a message in the producer prompt and view the same message in the
    consumer prompt (as it is been read by the consumer). The following screenshot
    demonstrates this message sending process:


    ![](images/3.7.jpg)


    **Figure 3.7:** Producer and consumer console


    Through the preceding examples, we have seen the process of sending Kafka messages
    from the producer and the receiving of the messages by the consumer.


    ## Creation of multiple brokers


    In the previous section, we create a single broker. Here, we will create two brokers.
    Therefore, we need to copy the server `config` using the following commands:


    ```

    copy config\server.properties config\server-broker1.properties

    ```

    copy config\server.properties config\server-broker2.properties

    ```


    ![](images/3.8.jpg)


    **Figure 3.8:** Copying server properties


    Now, we need to edit each of these files with the following:


    * `Broker.id` has to be unique, hence provide 1 for the first broker.

    * Listeners must listen to a new port, therefore, provide a unique port for example,
    `9093`.

    * The `log` directory has to be unique too, hence give a new name, for example,
    `\logs2`.


    The following screenshot shows the examples from the `server-broker1.properties`
    file for reference. The `listeners` parameter is shown as follows for server `1`:


    ![](images/3.9.jpg)


    **Figure 3.9:** Server 1 property file:listeners


    The `log.dirs` parameter is shown in the following screenshot for server `1`.
    The path of the `log` directory is provided here. The logs generated during the
    messaging process will be stored here:


    ![](images/3.10.jpg)


    **Figure 3.10:** Server 1 property file:Log


    Edit the second server properties in a similar manner. The following screenshot
    show the example configuration from `server-broker2.properties`. The `listeners`
    parameter is shown as follows for server 2:


    ![](images/3.11.jpg)


    **Figure 3.11:** Server 2 property file:listeners


    The `log.dirs` parameter is shown in the following screenshot for server `2`.
    The path of the `log` directory is provided here. The logs generated during the
    messaging process will be stored here:


    ![](images/3.12.jpg)


    **Figure 3.12:** Server 2 property file:Log


    To start the two brokers, we will use the following:


    1. Starting broker 1:

    ```

    bin\windows\kafka-server.bat config\server-broker1.properties

    ```


    2. Starting broker 2:

    ```

    bin\windows\kafka-server.bat config\server-broker2.properties

    ```


    Once the brokers are started, we can now create a topic:


    ```

    bin\windows\kafka-topics.bat --create --bootstrap-server localhost:9092 --replication-factor
    3 --partitions 1 --topic multi-topic

    ```


    ![](images/3.13.jpg)


    **Figure 3.13:** Creating Kafka topic


    3. Using the `describe` parameter, we can view how the brokers are being used.
    The following output shows that the leader is 0 and replicas are 0, 2, and 1:


    ```

    bin\windows\kafka-topics.bat --describe --bootstrap-server localhost:9092 --topic
    multi-topic

    ```


    ![](images/3.14.jpg)


    **Figure 3.14:** Broker description


    4. The following illustrates the interpretation of the preceding output:


    * **Leader**: It is the partition responsible for the read and write of the data
    to the other partitions of the brokers.

    * **Replicas**: They are the active partitions that are available to store the
    data.

    * **Isr**: It is the in sync replica, which means the replicas that are currently
    active and available to process the data. The failed replicas will not be listed
    here.


    5. To test our fault tolerance, we will get the process ID and kill it.


    Use the following to fetch the process ID:


    ```

    wmic process where "caption = ''java.exe'' and commandline like ''%server-broker1.properties%''"
    get processid

    ```


    To kill the process, use `taskkill /pid <PID> /f`.

    '
