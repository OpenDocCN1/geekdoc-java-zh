  trans: "\n\n```scala\n// 订阅 1 topic，默认使用最早和最后的偏移量\nvaldf=spark\n.read\n  .format(\"\
    kafka\")\n  .option(\"kafka.bootstrap.servers\",\"host1:port1,host2:port2\")\n\
    \  .option(\"subscribe\",\"topic1\")\n  .load()\ndf.selectExpr(\"CAST(key AS STRING)\"\
    ,\"CAST(value AS STRING)\")\n.as[(String, String)]\n```\n\n以下展示了订阅多个 topic 并指定特定的偏移量：\n\
    \n```scala\n// 订阅多个 topic，并指定特定的 Kafka 偏移量\nvaldf=spark\n.read\n  .format(\"kafka\"\
    )\n  .option(\"kafka.bootstrap.servers\",\"host1:port1,host2:port2\")\n  .option(\"\
    subscribe\",\"topic1,topic2\")\n  .option(\"startingOffsets\",\"\"\"{\"topic1\"\
    :{\"0\":23,\"1\":-2},\"topic2\":{\"0\":-2}}\"\"\")\n  .option(\"endingOffsets\"\
    ,\"\"\"{\"topic1\":{\"0\":50,\"1\":-1},\"topic2\":{\"0\":-1}}\"\"\")\n  .load()\n\
    df.selectExpr(\"CAST(key AS STRING)\",\"CAST(value AS STRING)\")\n.as[(String,\
    \ String)]\n```\n\n以下展示了按照模式订阅并指定最早和最后的偏移量：\n\n```scala\n// 按照模式订阅，使用最早和最后的偏移量\n\
    valdf=spark\n.read\n  .format(\"kafka\")\n  .option(\"kafka.bootstrap.servers\"\
    ,\"host1:port1,host2:port2\")\n  .option(\"subscribePattern\",\"topic.*\")\n \
    \ .option(\"startingOffsets\",\"earliest\")\n  .option(\"endingOffsets\",\"latest\"\
    )\n  .load()\ndf.selectExpr(\"CAST(key AS STRING)\",\"CAST(value AS STRING)\"\
    )\n.as[(String, String)]\n```\n\n## 2. 消费者缓存\n\n初始化消费者需要时间；因此，使用缓存机制来存储频繁使用的消费者。topic\
    \ 名称、topic 分区和 group ID 被用缓存键来缓存消费者。\n\n`spark.kafka.consumer.cache.capacity`\
    \ 决定了池的大小。`spark.kafka.consumer.cache.timeout` 是消费者可以空置的时间。如果它空置超过了指定的时间，它将被剔出。\n\
    \n## 3. 将数据写入 Kafka\n\n流式查询和批量查询都可以写入 Kafka。Kafka 支持至少一次（at least once）的写入机制，即数据会被写入一次；如果\
    \ broker 没有发送确认，则将重新发送。因此，存在重复的可能性。\n\n写入 Kafka 的数据框中必须包含的列有：key、value、headers、topic\
    \ 和 partition。\n\n## 4. 为流式查询创建 sink\n\n使用以下代码，我们可以将 key 和 value 写入特定的 topic，该\
    \ topic 通过 `option()` 函数提供：\n\n```scala\n// 将 DataFrame 中的 key-value 数据写入在 option\
    \ 中指定的特定 Kafka topic\nvalds=df\n.selectExpr(\"CAST(key AS STRING)\",\"CAST(value\
    \ AS STRING)\")\n.writeStream\n  .format(\"kafka\")\n  .option(\"kafka.bootstrap.servers\"\
    ,\"host1:port1,host2:port2\")\n  .option(\"topic\",\"topic1\")\n  .start()\n```\n\
    \n使用以下代码，将 key value 写入数据中指定的 topic 中：\n\n```scala\n// 使用数据中指定的 topic 将 DataFrame\
    \ 中的 key-value 数据写入 Kafka\nvalds=df\n.selectExpr(\"topic\",\"CAST(key AS STRING)\"\
    ,\"CAST(value AS STRING)\")\n.writeStream\n  .format(\"kafka\")\n  .option(\"\
    kafka.bootstrap.servers\",\"host1:port1,host2:port2\")\n  .start()\n```\n\n##\
    \ 5. 将批量查询的输出写入 Kafka\n\n对于批量查询，数据以 key value 形式写入通过 `option()` 函数指定的 topic 中。以下代码展示了\
    \ `option()` 的用法：\n\n```scala\n// 将 DataFrame 中的 key-value 数据写入在 option 中指定的特定\
    \ Kafka topic\ndf.selectExpr(\"CAST(key AS STRING)\",\"CAST(value AS STRING)\"\
    )\n.write\n  .format(\"kafka\")\n  .option(\"kafka.bootstrap.servers\",\"host1:port1,host2:port2\"\
    )\n  .option(\"topic\",\"topic1\")\n  .save()\n```\n\n对于批量查询，数据以 key value 形式写入通过数据指定的\
    \ topic 中。以下代码展示了其用法：\n\n```scala\n// 使用数据中指定的 topic 将 DataFrame 中的 key-value\
    \ 数据写入 Kafka\ndf.selectExpr(\"topic\",\"CAST(key AS STRING)\",\"CAST(value AS\
    \ STRING)\")\n.write\n  .format(\"kafka\")\n  .option(\"kafka.bootstrap.servers\"\
    ,\"host1:port1,host2:port2\")\n  .save()\n```\n\n在上面的章节中，我们学习了创建 Kafka 源、缓存以及将数据写入\
    \ Kafka 的。\n\n# Kafka 和 Spark Streaming 的实现\n\nApache Kafka 提供了发布-订阅系统。生产者发布数据，订阅者消费数据。\n\
    \n*   **链接 (Linking):**\n    链接是集成 Spark 和 Kafka 的过程。这种方法仅支持 Scala/Java。使用以下构组件：\n\
    \    `groupId = org.apache.spark`\n    `artifactId = spark-kafka-0-10_22`\n  \
    \  `version = 3.0.0`\n\n*   **创建直接流 (Creating Direct Stream)**\n    `Record` 对象用于表示数据。每个流被分配一个\
    \ group ID。topic 名称创建在数组中。参数被传递给 `Subscribe()`。\n\n```scala\nimport org.apache.kafka.clients.consumer.ConsumerRecord\n\
    import org.apache.kafka.common.serialization.StringDeserializer\nimport org.apache.spark.streaming.kafka10._\n\
    import org.apache.spark.streaming.kafka10.LocationStrategies.PreferConsistent\n\
    import org.apache.spark.streaming.kafka10.ConsumerStrategies.Subscribe\n\nval\
    \ kafkaParams = MapString, Object\n)\n\nval topics = Array(\"topicA\", \"topicB\"\
    )\nval stream = KafkaUtils.createDirectStreamString, String\n)\n\nstream.map(record\
    \ => (record.key, record.value))\n```\n\n*   **位置策略 (Location strategies)**\n\
    \    Kafka 消费者缓在 Spark 的执行器上。常用的策略是 `LocationStrategies.PreferConsistent`。这意味着消费者被均匀分布在执行器上。位置策略允许\
    \ `DirectKafkaInputStream` 请求 Spark 执行器尽可能靠近 topic 分区的 leader 来执行 Kafka 消费者。当\
    \ `DirectKafkaInputStream` 为给定的批次计算 `KafkaRDD` 时使用了位置策略\n\n*   **消费者策略 (Consumer\
    \ strategies)**\n    Kafka 消费者 API 可以通过多种方式指定 Kafka topic。`ConsumerStrategies.Subscribe`\
    \ 我们可以订阅预定义的 topic 集合。使用 `assign()`，我们可以提供分区集。`PartitionsConsumerStrategy` 是在\
    \ Spark Streaming 中创建 Kafka 消费者的合约，允许在创建消费者后对其配置进行自定义。Kafka 消费者和 Kafka 集群中的分区记录。可以使用\
    \ `ConsumerStrategies` 工厂对象访问预定义的消费者策略实现。\n\n*   **部署 (Deploying)**\n    使用 `spark-submit`\
    \ 启动应用程序。`spark-streaming-kafka-0-10_2.11` 及其依赖项应打包在应用程序 JAR 中。`spark-core_2.11`\
    \ 和 `spark-streaming_2.11` 应该标记为提供的依赖项。\n\n"
- fmt: "\nIn this chapter, we learnt the various integration options of Spark with\
    \ Kafka. We understood the two approaches for integration. We learnt to implement\
    \ the structured streaming of Kafka and Spark. We created a Kafka source for streaming\
    \ queries, batch queries and understood the need for consumer caching. We also\
    \ learnt to write data to Kafka, created a Kafka sink and understood the need\
    \ for caching.\n\nThe implementation of direct streaming was seen. We understood\
    \ the consumer strategies and location strategies. The deployment steps were discussed.\n\
    \nIn the next chapter, we will understand the integration of Apache Kafka with\
    \ Storm.\n\n# [Questions](#toc.xhtml_s132a)\n\n1. **Which method is used to create\
    \ a direct stream?**\n    1. `createStream()`\n    2. `createDirectStream()`\n\
    \    3. `createDirect()`\n    4. `makeDirectStream()`\n\n2. **Which is the most\
    \ commonly used Location Strategy?**\n    1. `LocationStrategies.Consistent`\n\
    \    2. `LocationStrategies.Prefer`\n    3. `LocationStrategies.PreferConsistent`\n\
    \    4. `Location.PreferConsistent`\n\n3. **Which method is used to subscribe\
    \ to a topic?**\n    1. `Access()`\n    2. `Find()`\n    3. `fetchTopic()`\n \
    \   4. `Subscribe()`\n\n4. **How is a Kafka source for streaming queries created?**\n\
    \    1. `option(\"subscribe\",\"topic1\")`\n    2. `option(\"accesstopic\",\"\
    topic1\")`\n    3. `option(\"fetchtopic\",\"topic1\")`\n    4. `fetch(\"subscribe\"\
    ,\"topic1\")`\n\n5. **In the Direct Approach of Kafka, which methodology is used?**\n\
    \    1. Subscribers are used to subscribe to topic\n    2. Kafka is queried periodically\
    \ for the data\n    3. Write Ahead logs are used\n    4. Receivers are used\n\n\
    6. **What are the two approaches used for Kafka and Spark Integration?**\n   \
    \ 1. Receiver based approach and Direct approach\n    2. Receiver based approach\
    \ and Indirect approach\n    3. Subscriber based approach and Direct approach\n\
    \    4. Subscriber based approach and Indirect approach\n\n# [Answers](#toc.xhtml_s133a)\n\
    \n1. b\n2. e\n3. d\n4. a\n5. b\n6. a\n\n# [Key terms](#toc.xhtml_s134a)\n\nKafka,\
    \ spark, integration, spark streaming\n\n# [CHAPTER 12](#toc.xhtml_c12)\n\n# [Kafka\
    \ Integration with Storm](#toc.xhtml_c12)\n\n# [Introduction](#toc.xhtml_s135a)\n\
    \nIn this chapter, we will be learning to build a simple application that uses\
    \ Apache Kafka and Storm. Apache Kafka is a messaging system where messages can\
    \ be processed in real time. Kafka and Storm integrate well with each other as\
    \ the streams from Kafka can be passed to the Storm cluster to process the data\
    \ using the core capabilities of Storm. This chapter introduces the implementation\
    \ of Kafka Spouts and Storm Bolts and the manner in which they communicate with\
    \ each other to process messages. The implementation uses maven build and Eclipse\
    \ IDE.\n\n# [Structure](#toc.xhtml_s136a)\n\nIn this chapter, we will discuss\
    \ the following topics:\n\n* Introduction to Kafka-Storm integration\n* Implementing\
    \ the Maven project\n* Dependencies for Kafka and Storm\n* Implementation of Storm\
    \ Bolts\n* Creating the topology\n* Executing the integration flow\n\n# [Objectives](#toc.xhtml_s137a)\n\
    \nAfter studying this chapter, you will learn the following:\n\n* Understanding\
    \ the Kafka-Storm integration\n* Learning to implement the Kafka Spouts\n* Learning\
    \ to implement a Bolt\n* Understanding the topology of Spouts and Bolts\n* Executing\
    \ the project\n\n# [Introduction to Kafka-Storm integration](#toc.xhtml_s138a)\n\
    \nKafka can read data and emit data to Kafka Spouts and therefore becomes a source\
    \ of streams. Bolts in the Storm Cluster can then process the data and they perform\
    \ real-time streaming analytics.\n\nThe following diagram shows the integration\
    \ of Kafka and Storm. The Kafka Spout reads from the Kafka Cluster. The Storm\
    \ Cluster has multiple bolt components. The Bolts can process the data and store\
    \ the results in a Hadoop HDFS or a database:\n\n![](images/12.1.jpg)\n\n**Figure\
    \ 12.1:** Kafka Storm integration architecture\n\nThe above integration flow can\
    \ be implemented using Java. The next section shows the creation of the project\
    \ and implementation of spouts and bolts using Eclipse IDE.\n\n# [Creating a Maven\
    \ project](#toc.xhtml_s139a)\n\nIn this section, we will create a maven project\
    \ using Eclipse IDE. The steps to create the project are shown in the following\
    \ section:\n\n1. Open Eclipse IDE and select `New` | `Project`. In the Project\
    \ wizard, click on `Maven Project` as shown in the following screenshot:\n   ![](images/12.2.jpg)\n\
    \   **Figure 12.2:** Select Maven Project\n\n2. In the next screen, select `Create\
    \ a simple Project` option and click on `Next`:\n   ![](images/12.3.jpg)\n   **Figure\
    \ 12.3:** Project Configurations\n\n3. Provide a Group ID and Artifact ID as shown\
    \ below and click on `Finish`:\n   ![](images/12.4.jpg)\n   **Figure 12.4:** Group\
    \ ID and Artifact ID\n\n4. View the newly created project in Project Explorer\
    \ as shown in the following:\n   ![](images/12.5.jpg)\n   **Figure 12.5:** View\
    \ the Maven Project\n\nAfter creating the project, follow the next steps to include\
    \ the dependencies in the `pom.xml` file.\n\n# [Dependencies for Kafka and Storm](#toc.xhtml_s140a)\n\
    \nIn this section, the dependencies required for implementing spout and Bolts\
    \ are listed in the following code:\n\n```xml\n<properties>\n    <storm.version>1.0.2</storm.version>\n\
    \    <kafka.version>0.8.2</kafka.version>\n</properties>\n<dependencies>\n   \
    \ <!-- Storm library -->\n    <dependency>\n        <groupId>org.apache.storm</groupId>\n\
    \        <artifactId>storm-core</artifactId>\n        <version>${storm.version}</version>\n\
    \    </dependency>\n    <!-- Storm-Kafka integration library -->\n    <dependency>\n\
    \        <groupId>org.apache.storm</groupId>\n        <artifactId>storm-kafka</artifactId>\n\
    \        <version>${storm.version}</version>\n    </dependency>\n    <!-- Kafka\
    \ client libraries as Storm-Kafka integration library does not include these -->\n\
    \    <dependency>\n        <groupId>org.apache.kafka</groupId>\n        <artifactId>kafka_211</artifactId>\n\
    \        <version>${kafka.version}</version>\n        <exclusions>\n         \
    \   <!-- Excluded to avoid version issues between zookeeper api and Storm-kafka\
    \ zookeeper api -->\n            <exclusion>\n                <groupId>org.apache.zookeeper</groupId>\n\
    \                <artifactId>zookeeper</artifactId>\n            </exclusion>\n\
    \            <!-- Excluded to avoid Pre-emptive StackOverflowException due to\
    \ version/implementation issues between Kafka slf4j/log4j api and Storm slf4jlog4j\
    \ api -->\n            <exclusion>\n                <groupId>org.slf4j</groupId>\n\
    \                <artifactId>slf4j-log4j12</artifactId>\n            </exclusion>\n\
    \            <exclusion>\n                <groupId>log4j</groupId>\n         \
    \       <artifactId>log4j</artifactId>\n            </exclusion>\n        </exclusions>\n\
    \    </dependency>\n</dependencies>\n```\n\nOnce the dependency has been updated\
    \ in the `pom.xml` file, right-click on the project name and select `Maven` |\
    \ `Update Project` to update the project. The following screenshot shows the location\
    \ of the `Update Project` option:\n\n![](images/12.6.jpg)\n**Figure 12.6:** Update\
    \ Project\n\nSelect the options as shown below and click on `OK` to update the\
    \ project with its necessary dependencies:\n\n![](images/12.7.jpg)\n**Figure 12.7:**\
    \ Update Project Options\n\nIn the preceding section, we saw the process of incorporating\
    \ the dependencies needed for the Kafka and Storm integration. In the next section,\
    \ we will learn to implement a Bolt.\n\n# [Implementation of Bolt](#toc.xhtml_s141a)\n\
    \nThe Bolt implementation requires us to implement the following methods:\n\n\
    * `execute()`: The data received by the Bolt arrives here and we can process it.\
    \ In this example, we are logging the data received by the Bolt.\n* `declareOutputFields()`:\
    \ The output of the processed data is stored in this output field declared here.\
    \ The name of the output field declared here is `message`.\n\n```java\nimport\
    \ org.apache.log4j.Logger;\nimport org.apache.storm.topology.BasicOutputCollector;\n\
    ```\n"
  raw: "In this chapter, we learnt the various integration options of Spark with Kafka.\
    \ We understood the two approaches for integration. We learnt to implement the\
    \ structured streaming of Kafka and Spark. We created a Kafka source for streaming\
    \ queries, batch queries and understood the need for consumer caching. We also\
    \ learnt to write data to Kafka, created a Kafka sink and understood the need\
    \ for caching.\n\nThe implementation of direct streaming was seen. We understood\
    \ the consumer strategies and location strategies. The deployment steps were discussed.\n\
    \nIn the next chapter, we will understand the integration of Apache Kafka with\
    \ Storm\n\n# [Questions](#toc.xhtml_s132a)\n\n1.  **Which method is used to create\
    \ a direct stream?**\n\n    1.  **`createStream()`**\n\n    2.  **`createDirectStream()`**\n\
    \n    3.  **`createDirect()`**\n\n    4.  **`makeDirectStream()`**\n\n2.  **Which\
    \ is the most commonly used Location Strategy?**\n\n    1.  **`LocationStrategies.Consistent`**\n\
    \n    2.  **`LocationStrategies.Prefer`**\n\n    3.  **`LocationStrategies.PreferConsistent`**\n\
    \n    4.  **`Location.PreferConsistent`**\n\n3.  **Which method is used to subscribe\
    \ to a topic?**\n\n    1.  **`Access()`**\n\n    2.  **`Find()`**\n\n    3.  **`fetchTopic()`**\n\
    \n    4.  **`Subscribe()`**\n\n4.  **How is a Kafka source for streaming queries\
    \ created?**\n\n    1.  **`option(\"subscribe\",\"topic1\")`**\n\n    2.  **`option(\"\
    accesstopic\",\"topic1\")`**\n\n    3.  **`option(\"fetchtopic\",\"topic1\")`**\n\
    \n    4.  **`fetch(\"subscribe\",\"topic1\")`**\n\n5.  **In the Direct Approach\
    \ of Kafka, which methodology is used?**\n\n    1.  Subscribers are used to subscribe\
    \ to topic\n\n    2.  Kafka is queried periodically for the data\n\n    3.  Write\
    \ Ahead logs are used\n\n    4.  Receivers are used\n\n6.  **What are the two\
