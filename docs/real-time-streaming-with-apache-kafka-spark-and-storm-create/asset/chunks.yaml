    # 第 1 章


    ## Kafka 简介


    ### 引言


    随着互联网和数字时代的到来，产生了大量数据。我们有许多应用程序每秒都在生成数据。例如，我们的社交媒体应用包含用户执行的所有活动，导致每天产生大量信息。因此，为了处理这些数据，我们需要实时流工具，它们可以读取并处理数据流。Apache
    Kafka 可以以分布式方式处理实时数据流。在本章中，我们将理解 Apache Kafka 的核心 API，并讨论 Kafka 的各种应用。Kafka 的架构由生产者、消费者、代理（broker）、主题（topics）和分区（partitions）组成。我们将详细描述架构的每个组件。


    ### 结构

    * Apache Kafka 简介

    * Kafka 与传统消息传递

    * Kafka 架构：生产者、消费者和代理

    * Kafka 架构：主题与分区

    * Kafka 核心 API

    * 使用 Kafka 的优势

    * 使用 Kafka 的应用


    ### 目标

    * 理解 Apache Kafka 的概念

    * 了解 Kafka 的好处

    * 学习 Kafka 的应用

    * 理解 Kafka 的架构

    * Kafka 内部组件概述


    ## Apache Kafka 简介


    Apache Kafka 提供发布-订阅系统。生产者发布数据，订阅者消费数据。数据流在几秒内被快速高效地处理。它能够处理实时数据流。流的数据和信息也以容错的方式存储。发送到
    Kafka 的消息存储在多个代理中以确保容错性。Apache Kafka 使用 Scala 和 Java 编写。它是一个开源平台；因此，无需支付许可费用即可使用。


    用户可以指定数据存储的时间长度以及需要存储的数据量。在指定的时间长度之后，数据将被清除。Kafka 消息带有时间戳存储在分区中：


    ![](img/1.1.jpg)


    **图 1.1：** Kafka 高级概览


    图 1.1 显示了 Kafka 中消息流的高级概览。有 `n` 个生产者产生消息，有 `m` 个消费者消费消息。生产者产生的消息由一个名为 `topic`
    的名称标识，消费者可以从多个主题中消费。这些消息从生产者到消费者的中继及其管理由 zookeeper 完成。


    ## Kafka 与传统消息队列


    以下是传统消息队列和 Kafka 之间的一些区别：


    * 在传统消息队列中，消息一旦被读取，就会从队列中移除。但在 Kafka 中，消息在被读取后仍然存在。消息持续的时间持续可以配置。


    * 由于 Kafka 消息在被读取后仍持久化在存储中，因此这些消息也可以根据需要进行跟踪、再次读取和重新处理。这种功能在消息队列中是不可能的。


    * 在 Kafka 中，由生产者发布的消息被发布到主题中，订阅者订阅该主题并读取消息。因此，没有传统消息传递中使用的队列。


    * Kafka 中的主题包含多个分区；因此，这允许并行处理和高吞吐量。这些概念将在后续章节中详细介绍。传统消息传递不提供这些。


    * Kafka 在不同的代理和多个服务器上复制消息；因此，数据的可用性很高，并且具有良好的故障恢复方法。传统消息传递不提供消息复制。


    * 负载均衡在 Kafka 架构内部提供，而在其他队列中则需要在外部配置。


    因此，通过上述对比，我们可以理解使用 Kafka 相比传统队列有很多优势。由于这些因素，它被应用于各种场景。


    ## Kafka 架构：生产者、消费者和代理


    图 1.2 显示了 Kafka 的架构。Kafka 架构由 Kafka 集群组成。集群包含多个节点。代理在集群中运行。多个代理共同构成 Kafka 集群。


    在非常高层级，如如下所示，生产者向集群发送消息，消费者消费这些消息。消息也通称为 `records`。


    Zookeeper 被用于管理 Kafka 集群的服务。它负责识别集群中存在的代理状态。每当添加新代理或某个代理不再活动时，它都会通知节点。任何更改都会通过
    Zookeeper 通知给所有节点。


    Zookeeper 维护生产者和消费者的数据配额。Zookeeper 跟踪主题的副本，如果某个节点故障，Zookeeper 将使用另一个副本节点。因此，它包含了哪些节点存储不同主题的信息。


    对于消费者，Zookeeper 跟踪偏移量（offset）值，这是消费者从分区读取数据时使用的值。


