    \ the transaction is fraudulent.\n\nThe above applications are the frequently-used\
    \ use cases for Kafka Producer. So, in real-time problem-solving and architecting\
    \ any similar use cases that we encounter can use Kafka as well.\n\n# [Conclusion](#toc.xhtml_s53a)\n\
    \nIn this chapter, we have learnt the list of Kafka APIs that are used during\
    \ the development of Kafka producers. The important APIs include **`send()`**,\
    \ which is used to send the Kafka messages. The producer implementation in Java\
    \ was described along with the code. The **`pom.xml`** file contains the dependencies\
    \ required by the project. The implementation of the producer in Java was explained\
    \ in detail. The execution process of the producer program was seen.\n\nThe three\
    \ ways of sending a Kafka message has been illustrated. The different acknowledgement\
    \ types for the Kafka messages sent were shown. The applications that use the\
    \ Kafka producer were also listed. This chapter aims to create an understanding\
    \ of the implementation of a Kafka Producer in Java. You should be able to customize\
    \ it and use it for your own use cases.\n\nIn the next chapter, we will learn\
    \ the implementation of Kafka Consumer. The various APIs used during the implementation\
    \ of the consumer will be understood in detail.\n\n# [Questions](#toc.xhtml_s54a)\n\
    \n1.  **Which API is used to create as Kafka Producer?**\n\n2.  **Can one instance\
    \ of the producer be shared by multiple instances? Is the Producer class threadsafe?**\n\
    \n3.  **Which of the following method of sending Kafka messages doesn't receive\
    \ an acknowledgement?**\n\n    1.  Fire and forgot\n\n    2.  Synchronous send\n\
    \n    3.  Asynchronous send\n\n    4.  Default send\n\n4.  **In which type of\
    \ acknowledgement does the broker wait for all the replicas to have received the\
    \ message?**\n\n    1.  Acknowledgement=1\n\n    2.  Acknowledgement =0\n\n  \
    \  3.  Acknowledgement =all\n\n5.  **Which of the following is not an application\
    \ of Kafka Producer?**\n\n    1.  Prediction systems\n\n    2.  ETL\n\n    3.\
    \  Sentiment analysis\n\n    4.  Messaging\n\n6.  **Which API is used for implementing\
    \ the ETL application?**\n\n7.  **In an asynchronous send method, what is the\
    \ function called, which is called after the message is sent?**\n\n# [Answers](#toc.xhtml_s55a)\n\
    \n1.  KafkaProducer()\n\n2.  Yes.\n\n3.  Fire and Forgot\n\n4.  Acknowledgement\
    \ =all\n\n5.  Prediction systems\n\n6.  Connect API\n\n7.  callback function\n\
    \n# [CHAPTER 5](#toc.xhtml_c05)\n\n# [Kafka Consumers](#toc.xhtml_c05)\n\n# [Introduction](#toc.xhtml_s56a)\n\
    \nIn the previous chapter, we learnt about the Kafka producers. In this chapter,\
    \ we will learn to implement Kafka consumer in Java. We will understand functionalities\
    \ of consumer groups and the group coordination protocol. The Java APIs for Kafka\
    \ consumers is introduced here, which can be used during the implementation of\
    \ Kafka consumers using Java. The previous chapter's Java producer client will\
    \ be used to test the Kafka consumer. The implementation of the consumer will\
    \ be explained in detail. In the end, we will look at the process of execution\
    \ of the consumer in order to consume messages from the broker.\n\n# [Structure](#toc.xhtml_s57a)\n\
    \nWe will study the following topics in this chapter:\n\n*   Overview of Kafka\
    \ consumer\n\n*   Consumer groups\n\n*   Group coordination protocol\n\n*   API\
    \ for Kafka consumer\n\n*   Consumer implementation in Java\n\n*   Execution of\
    \ the Kafka consumers\n\n# [Objectives](#toc.xhtml_s58a)\n\nAfter studying this\
    \ chapter, you would understand the following:\n\n*   Introduction to Kafka consumer\n\
    \n*   Consumer groups\n\n*   Group coordination protocol\n\n*   Overview of Kafka\
    \ consumer API in Java\n\n*   Implementing the Kafka consumer in Java\n\n*   Executing\
    \ the Kafka consumer\n\n# [Kafka consumer](#toc.xhtml_s59a)\n\nKafka consumer\
    \ is the client that reads records from the Kafka cluster. The consumer reads\
    \ from topics using offset values. A consumer can subscribe to multiple topics.\
    \ As set of consumers reading from similar topics are grouped together, these\
    \ are called **consumer groups**.\n\n# [Consumer groups](#toc.xhtml_s60a)"
