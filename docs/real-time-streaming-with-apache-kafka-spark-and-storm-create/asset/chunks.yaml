    \nIn the next chapter, we will learn the implementation of Kafka Producer. The\
    \ various APIs used during the implementation of the producer will be understood\
    \ in detail.\n\n# [Questions](#toc.xhtml_s41a)\n\n1.  **To which partition does\
    \ the Producer always write the data?**\n\n    1.  Empty partition\n\n    2. \
    \ First partition\n\n    3.  Any partition\n\n    4.  Leader partition\n\n2. \
    \ **When a leader partition fails, which exception will be thrown?**\n\n    1.\
    \  LeaderNotAvailable exception\n\n    2.  LeaderMissing exception\n\n    3. \
    \ LeaderNotFound Exception\n\n    4.  NoLeader Exception\n\n3.  **When a replica\
    \ fails and becomes active again, which process is performed first?**\n\n    1.\
    \  Store the data received from producer\n\n    2.  Synchronization with other\
    \ active replicas\n\n4.  **Which script is used to create a Kafka producer?**\n\
    \n    1.  **`console-producer.bat`**\n\n    2.  **`kafka-console-producer.bat`**\n\
    \n    3.  **`kafka-producer.bat`**\n\n    4.  **`kafka-console.bat`**\n\n5.  **To\
    \ delete a Kafka Topic, which property must be added in the server properties?**\n\
    \n    1.  **`topic.enable=true`**\n\n    2.  **`delete.enable=true`**\n\n    3.\
    \  **`delete.topic=true`**\n\n    4.  **`delete.topic.enable=true`**\n\n6.  **Which\
    \ batch file is used to create a Kafka consumer?**\n\n    1.  **`console-producer.bat`**\n\
    \n    2.  **`kafka-console-producer.bat`**\n\n    3.  **`kafka-console-consumer.bat`**\n\
    \n    4.  **`kafka-console.bat`**\n\n# [Answers](#toc.xhtml_s42a)\n\n1.  d\n\n\
    2.  a\n\n3.  b\n\n4.  b\n\n5.  d\n\n6.  c\n\n# [CHAPTER 4](#toc.xhtml_c04)\n\n\
    # [Kafka Producers](#toc.xhtml_c04)\n\n# [Introduction](#toc.xhtml_s43a)\n\nIn\
    \ the previous chapter, we learnt about the Kafka messaging architecture. The\
    \ purpose of the producers and consumers were described. We also set up the eclipse\
    \ IDE and IntelliJ IDE so that we can implement the producers and consumers using\
    \ the IDE. In this chapter, we will learn to implement the Kafka producer in Java.\
    \ We will deep dive into the APIs that are available to implement Kafka producers.\
    \ The command line consumer client we learnt in the previous chapter will be used\
    \ to test the Kafka producer. The implementation of the producer will be explained\
    \ in detail. In the end, we will look at some real-time applications of Kafka\
    \ producers.\n\n# [Structure](#toc.xhtml_s44a)\n\nThe structure of the chapter\
