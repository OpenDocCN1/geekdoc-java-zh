    \n# CHAPTER 3\n\n# Kafka Messaging\n\n# Introduction\n\nIn this chapter, we will\
    \ discuss the sending of Kafka messages using a producer and the receiving of\
    \ Kafka messages using a consumer. In the Kafka messaging architecture, the producers\
    \ will generate messages and the consumer receives these messages. We will dive\
    \ deep into Kafka brokers and how partitions are used. We will understand the\
    \ failure mechanisms provided by Kafka. In this chapter, we will learn to run\
    \ the Kafka messaging through a command line. We will understand the process of\
    \ implementing multiple brokers and how failure of a replica is handled. The steps\
    \ to install Eclipse IDE and IntelliJ IDE for the implementation of Kafka in Java\
    \ using Maven build will be illustrated.\n\n# Structure\n\n* Components of Kafka\
    \ messaging\n* Creation of a Kafka topic\n* Deleting a Kafka topic\n* Send and\
    \ receive messages through a command line\n* Creation of multiple brokers\n* Installing\
    \ and using Eclipse and Maven\n* Installing IntelliJ IDE\n\n# Objectives\n\n*\
    \ Understand the components of Kafka messaging\n* Learn to create a Kafka topic\n\
    * The process of deleting a Kafka topic\n* Learn to send and receive messages\
    \ through the command line.\n* Create multiple brokers and observe the allocation\
    \ by zookeeper\n* Understand how to use Eclipse and Maven\n* Using IntelliJ IDE\
    \ for Kafka implementation\n\n# Components in messaging\n\nThere are several components\
    \ in the Kafka messaging system. These include Kafka brokers and partitions. They\
    \ form the core of the messaging architecture. In the following section, we will\
    \ learn the functioning of these components and their importance toward the messaging\
    \ system.\n\n# Kafka brokers and Kafka partitions\n\nThe following figure shows\
    \ some of the important components of Kafka messaging. There are several brokers\
    \ in the architecture. Each broker has multiple partitions (for example, P1, P2,\
    \ etc.). When the producer generates messages for a particular topic, the content\
    \ is stored in these partitions. Within a broker, there will be a leader partition\
    \ and the other partitions store the messages belonging to the topic. When a leader\
    \ fails, another partition takes over as a leader.\n\nThe producers will always\
    \ write to a leader partition. The leader then decides where the data is to be\
    \ stored and replicated. The data can be stored in a partition within the same\
    \ broker or different broker. The leader decides the location of the replicas\
    \ and therefore performs a kind of load balancing of the messages received from\
    \ producers:\n\n![](images/3.1.jpg)\n\n**Figure 3.1:** Brokers and partitions\n\
    \nAs shown in the preceding figure, the brokers work collectively to receive the\
    \ messages sent to a topic by the producers. The leader partition plays an important\
    \ role in routing these messages to all the partitions.\n\n# Kafka failover\n\n\
    The leader or the replica partition can fail. The following are the possibilities\
    \ of failure:\n\n* **Only the leader fails**: In this scenario, the Kafka controller\
    \ will choose another leader from the pool of partitions. There will be a downtime\
    \ in processing the messages after the failure as the `LeaderNotAvailable` exception\
    \ will be thrown. But once the leader is chosen, the messages will continue to\
    \ be again. There will not be a loss in data.\n* **One replica fails**: In this\
    \ scenario, the replica will stop storing the messages and will be out of sync\
    \ with the leader and its replicas. Although once the replica partition is fixed\
    \ and is active, the replica will be synced with the leader. When the replica\
    \ is down, the consumers will fetch the latest data from the other replicas.\n\
    * **More than one replica fails**: In this scenario, the replicas that have failed\
    \ will discontinue to receive any data from the producer. The leader still contains\
    \ a copy of the data, and therefore, the consumer can fetch from the leader. Once\
    \ all replicas are active again, they will be synced with all the data that was\
    \ lost.\n* **All replica fails (along with leader)**: When all the replicas, including\
    \ the leader fail, the leader could be fixed and made active to restart its messaging\
    \ receiving process. The leader will contain all the data it received until it\
    \ went down. After becoming active, it will continue to receive latest messages.\
    \ Another alternative is to elect another leader from another broker, but the\
    \ messages received by the old leader will be lost. The new leader will start\
    \ receiving the new data.\n\nThe preceding scenarios are the common failovers\
    \ that can occur in the Kafka messaging system.\n\n# Creation of a Kafka topic\n\
    \nTo create a Kafka topic, we need to provide the following parameters:\n\n| Parameters\
    \ | Explanation |\n| :--- | :--- |\n| Zoo Keeper Instance | The port at which\
    \ the zookeeper is running. |\n| Replication factor | The number of copies of\
    \ the data present in the Kafka cluster |\n| Partitions | The number of partitions\
    \ in which the data should be stored. |\n| Topic Name | The name of the topic\
    \ to be created. |\n\n**Table 3.1:** Parameters for creating Kafka topic\n\nThe\
    \ following steps can be followed to create a Kafka topic:\n\n1.  Navigate to\
    \ the `Kafka` directory.\n"
