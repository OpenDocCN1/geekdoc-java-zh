  raw: "`import org.apache.storm.topology.OutputFieldsDeclarer;`\n\n`import org.apache.storm.topology.base.BaseBasicBolt;`\n\
    \n`import org.apache.storm.tuple.Fields;`\n\n`import org.apache.storm.tuple.Tuple;`\n\
    \n`public class MessageProcessorBolt extends BaseBasicBolt{`\n\n`private static\
    \ final long serialVersionUID = 1L;`\n\n`private static final Logger LOG = Logger.getLogger(MessageProcessorBolt.class);`\n\
    \n`public void execute(Tuple input, BasicOutputCollector collector) {`\n\n`LOG.info(input.getString(0));`\n\
    \n`}`\n\n`public void declareOutputFields(OutputFieldsDeclarer declarer) {`\n\n\
    `declarer.declare(new Fields(\"message\"));`\n\n`}`\n\n`}`\n\nThe Bolt receives\
    \ the messages continuously to process the real-time data sent by KafkaCluster.\n\
    \n# [Creating the topology](#toc.xhtml_s142a)\n\nIn this section, we will integrate\
    \ the Kafka Spout and the Bolts together in the form of a Topology. The **`SpoutConfig`**\
    \ class receives four arguments: hosts, topic, path, and client ID. The **`KafkaSpout`**\
    \ uses the **`config`** information to create a Spout. The **`TopologyBuilder`**\
    \ class sets the bolt and the spout information together in the form of a topology:\n\
    \n`import java.util.HashMap;`\n\n`import org.apache.log4j.Logger;`\n\n`import\
    \ org.apache.storm.Config;`\n\n`import org.apache.storm.LocalCluster;`\n\n`import\
    \ org.apache.storm.kafka.BrokerHosts;`\n\n`import org.apache.storm.kafka.KafkaSpout;`\n\
    \n`import org.apache.storm.kafka.SpoutConfig;`\n\n`import org.apache.storm.kafka.StringScheme;`\n\
    \n`import org.apache.storm.kafka.ZkHosts;`\n\n`import org.apache.storm.spout.SchemeAsMultiScheme;`\n\
    \n`import org.apache.storm.topology.TopologyBuilder;`\n\n`public class KafkaStormIntegration\
    \ {`\n\n`private static final Logger LOG = Logger.getLogger(KafkaStormIntegration.class);`\n\
    \n`public static void main(String[] args) {`\n\n`// If areguments are less than\
    \ 4 print error message`\n\n`if (args.length< 4) {`\n\n`LOG.error(`\n\n`\"Missing\
    \ arguments, The 4 arguments are:hosts, topic, path, clientid\");`\n\n`System.exit(1);`\n\
    \n`}`\n\n`// Read the Command line arguments`\n\n`final BrokerHosts hosts = new\
    \ ZkHosts(args[0]);`\n\n`final String topic = args[1];`\n\n`final String root\
    \ = args[2];`\n\n`final String clientId = args[3];`\n\n`// Create the Spout Configuration`\n\
    \n`final SpoutConfig conf = new SpoutConfig(hosts, topic, root, clientId);`\n\n\
    `conf.scheme = new SchemeAsMultiScheme(new StringScheme());`\n\n`// Create the\
    \ topology to process messages from kafka and print the message on the console`\n\
    \n`final TopologyBuilder topology = new TopologyBuilder();`\n\n`// Create the\
    \ Kafka Spout and the spout uses the configuration created.`\n\n`// The spout\
    \ is then added to the topology`\n\n`topology.setSpout(\"spout\", new KafkaSpout(conf),\
    \ 1);`\n\n`// The bolt processes message from kafka`\n\n`topology.setBolt(\"testing\
    \ message\", new MessageProcessorBolt()).globalGrouping(\"spout\");`\n\n`// Create\
    \ a Cluster`\n\n`final LocalClusterlocalCluster = new LocalCluster();`\n\n`Config\
    \ topologyConf = new Config();`\n\n`topologyConf.setDebug(true);`\n\n`// Submit\
    \ the topology to the cluster`\n\n`localCluster.submitTopology(\"topology\", topologyConf,\
    \ topology.createTopology());`\n\n`}`\n\n`}`\n\nThe created topology is submitted\
    \ to the cluster for execution. In the next section, we will learn to run this\
    \ Topology along with the Kafka Spout.\n\n# [Executing the integration flow](#toc.xhtml_s143a)\n\
    \nTo execute the complete integration, we need to start the Kafka Broker. The\
    \ steps are listed in the following section:\n\n1.  Update the **`server.properties`**\
    \ and run the kafka-start-server.bat to create a new log file.\n\n    The command\
    \ is given as follows:\n\n    **`>bin\\windows\\kafka-server-start.bat config/server.properties`**\n\
    \n    ![](images/12.8.jpg)\n\n    **Figure 12.8:** Starting the Kafka Server\n\
    \n2.  Create a new topic using the following command:\n\n    **`>bin\\windows\\\
    kafka-topics.bat --create --topic test --zookeeper localhost:2181 --partitions\
    \ 1 --replication-factor 1`**\n\n    ![](images/12.9.jpg)\n\n    **Figure 12.9:**\
    \ Create New Topic\n\n3.  View the newly created topic using the following command:\n\
    \n    **`>bin\\windows\\kafka-topics.bat --describe --zookeeper localhost:2181\
    \ --topic test`**\n\n    ![](images/12.10.jpg)\n\n    **Figure 12.10:** View the\
    \ Topic\n\n4.  Produce messages using **`producer.bat`** as shown below using\
    \ the following command:\n\n    **`>bin\\windows\\kafka-console-producer.bat --broker-list\
    \ localhost:9092 --topic test`**\n\n    ![](images/12.11.jpg)\n\n    **Figure\
    \ 12.11:** Produce messages\n\n5.  Right-click in the project and select **`Run\
    \ As`** | **`Run Configurations`**:\n\n    ![](images/12.12.jpg)\n\n    **Figure\
    \ 12.12:** Access the Run Configuration\n\n6.  Key in the following in the **`Arguments`**\
    \ tab:\n\n    `localhost:2181 test /brokers consumer`\n\n    ![](images/12.13.jpg)\n\
    \n    **Figure 12.13:** Provide Arguments\n\n7.  Right-click on the project and\
    \ click on **`Run`**. The following messages will be displayed on the console.\
    \ These are the messages sent by the Kafka Producer:\n\n    ![](images/12.14.jpg)\n\
    \n    **Figure 12.14:** View Results\n\n# [Conclusion](#toc.xhtml_s144a)\n\nIn\
    \ this chapter, we learnt how to integrate Kafka and Storm using the methodology\
    \ where the Kafka broker sends messages and the Bolts processed the messages.\
    \ The dependencies for setting up a storm cluster and its implementation was added\
    \ in the **`pom`** file.\n\nThe implementation of a simple Bolt was seen. The\
    \ topology configures the Kafka Spouts and Bolts together and submits it to the\
    \ cluster.\n\nThe Kafka Broker needs to be started to execute the integration\
    \ entire flow. The Kafka Broker was started and the producers produced messages.\
    \ These messages were read by the Storm Bolt and printed in the console.\n\n#\
    \ [Questions](#toc.xhtml_s145a)\n\n1.  **Which components of Kafka and Storm are\
    \ used during the integration?**\n\n    1.  Consumer and Nimbus\n\n    2.  Partitions\
    \ and Zookeeper\n\n    3.  Spouts and Bolts\n\n    4.  Producers and Consumers\n\
    \n2.  **Which are the two methods for the implementation of Bolts?**\n\n    1.\
    \  run() and save()\n\n    2.  execute() and declareOutputFields()\n\n    3. \
    \ run() and declareOutputFields()\n\n    4.  execute and declareOutput()\n\n3.\
    \  **During the creation of a topology, which class contains the configuration\
    \ for Spouts?**\n\n    1.  SpoutConfig\n\n    2.  SpountCon\n\n    3.  ConfigSpout\n\
    \n    4.  KafkaConfig\n\n4.  **Which class contains the Kafka Spout implementation?**\n\
    \n    1.  Spout\n\n    2.  KafkaImpl\n\n    3.  KafkaSpout\n\n    4.  SpoutKafkaConfig\n\
    \n5.  **Which method is used to set the Bolt into the topology?**\n\n    1.  getBolt()\n\
    \n    2.  setBolt()\n\n    3.  setKafka()\n\n    4.  setConfig()\n\n6.  **Which\
    \ method is used to set the Spout into the topology?**\n\n    1.  setBolt()\n\n\
    \    2.  getSpout()\n\n    3.  fetchSpout()\n\n    4.  setSpout()\n\n# [Answers](#toc.xhtml_s146a)\n\
    \n1.  c\n\n2.  b\n\n3.  a\n\n4.  c\n\n5.  b\n\n6.  d\n\n# [Index](#toc.xhtml_ind)\n\
    \nA\n\nacknowledgement\n\ntypes [56](#c04.xhtml_page56), [57](#c04.xhtml_page57)\n\
    \nApache Kafka\n\nabout [2](#c01.xhtml_page2), [3](#c01.xhtml_page3)\n\ndependencies\
    \ [153](#c12.xhtml_page153)-[155](#c12.xhtml_page155)\n\nintegration [150](#c12.xhtml_page150)\n\
    \nintegration concept [138](#c11.xhtml_page138)\n\nstructured streaming integration\
    \ [139](#c11.xhtml_page139), [141](#c11.xhtml_page141)-[144](#c11.xhtml_page144)\n\
    \nversus Apache Spark [117](#c09.xhtml_page117)\n\nApache Kafka streaming\n\n\
    implementation [144](#c11.xhtml_page144)-[146](#c11.xhtml_page146)\n\nApache Spark\n\
    \nabout [116](#c09.xhtml_page116)\n\napplications [120](#c09.xhtml_page120), [121](#c09.xhtml_page121)\n\
    \nbenefits [118](#c09.xhtml_page118), [119](#c09.xhtml_page119)\n\ncore concepts\
    \ [117](#c09.xhtml_page117)\n\nfeatures [118](#c09.xhtml_page118), [119](#c09.xhtml_page119)\n\
    \nimplementing, with Eclipse [127](#c10.xhtml_page127)-[131](#c10.xhtml_page131)\n\
    \nintegration concept [138](#c11.xhtml_page138)\n\nstructured streaming integration\
    \ [139](#c11.xhtml_page139), [141](#c11.xhtml_page141)-[144](#c11.xhtml_page144)\n\
