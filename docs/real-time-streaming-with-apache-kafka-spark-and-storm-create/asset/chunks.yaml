  trans: "\n\n| `sql` | `storm sql sql-file topology-name` | SQL 语句将被编译并提交给 Storm。\
    \ |\n| `kill` | `storm kill topology-name [-w wait-time-secs]` | 拓扑将被杀死。拓扑的 spouts\
    \ 将在 `wait-time-secs` 内被停用，然后工作节点将被关闭并清理其状态。 |\n| `activate` | `storm activate\
    \ topology-name` | 拓扑中的 spouts 将被激活。 |\n| `deactivate` | `storm deactivate topology-name`\
    \ | 拓扑中的 spouts 将被停用 |\n| `rebalance` | `storm rebalance topology-name [-w wait-time-secs]\
    \ [-n new-num-workers] [-e component=parallelism]*` | 该命令将首先停用现有拓扑 `wait-time-secs`\
    \ 秒，然后重新分配工作节点并激活新拓扑。 |\n| `classpath` | `storm classpath` | 输出 storm 客户端运行命令时使用的类路径。\
    \ |\n| `server_classpath` | `storm server_classpath` | 输出 storm 守护进程使用的类路径。 |\n\
    | `localconfvalue` | `storm localconfvalue conf-name` | 用于打印本地 storm 配置文件使用的 `conf-name`。\
    \ |\n| `remoteconfvalue` | `storm remoteconfvalue conf-name` | 用于打印 storm 集群使用的\
    \ `conf-name`。 |\n| `nimbus` | `storm nimbus` | 启动一个 imbus 守护进程。 |\n| `supervisor`\
    \ | `storm supervisor` | 启动一个 supervisor 守护进程。 |\n| `ui` | `storm ui` | 启动一个 UI\
    \ 守护进程。 |\n| `drpc` | `storm drpc` | 启动一个 DRPC 守护进程。 |\n| `drpc-client` | `storm\
    \ drpc-client [options] ([function argument]*)|(argument*)` | 它可以发送 `drpc` 请求。使用\
    \ `-f` 可以提供函数名称及其参数。 |\n\n**表 7.2:** Storm 管理命令\n\n使用上述命令，可以管理 storm 集群并查看已部署的拓扑。可以看到并监控工作节点使用的端口和\
    \ IP 地址。\n\n# 结论\n\n在本章中，我们学习了如何搭建 storm 集群。展示了搭建 storm 集群的准备条件。描述了所有软件的安装过程。描述了\
    \ storm 集群使用的属性。学习了用于部署和管理 storm 拓扑的管理命令。\n\n你将能够为自己的应用程序搭建一个 storm 集群。在下一章中，我们将讨论如何实现\
    \ spouts 和 bolts。还将展示如何在集群上创建和部署拓扑。我们将使用所学到的概念实现一个示例应用程序。\n\n# 问题\n\n1. 使用哪个命令来启动主节点？\n\
    2. 使用哪个命令来启动工作节点？\n3. 使用哪个命令来重新组织 storm 集群中的工作节点？\n4. 使用哪个命令来激活 storm 拓扑？\n5.\
    \ 使用哪个命令删除 storm 拓扑？\n6. 使用哪个命令启动 `drpc` 守护进程？\n\n# 答案\n\n1. `storm.py nimbus`\n\
    2. `storm.py supervisor`\n3. `rebalance`\n4. `activate`\n5. `kill`\n6. `storm.py\
    \ drpc`\n\n# 第 8 章：Spouts 和 Bolts\n\n# 引言\n\n在本章中，我们将使用 Spout 和 Bolts 实现一个交易告警应用程序。我们将学习如何使用\
    \ Storm 集群设计流水线，然后对设计进行编码。将展示一个 bolt 的输出如何传递给下一个 bolt。将展示实现代码的执行情况。将使用 Eclipse\
    \ IDE 和 Maven 项目进行实现。\n\n# 结构\n\n* 交易告警应用程序\n* 创建 Maven 项目\n* Spout 实现\n* Bolt\
    \ 实现\n* 通过拓扑集成组件\n* 执行应用程序\n\n# 目标\n\n* 理解交易告警应用程序\n* 构建 Storm 集群\n* 学习实现 spout\n\
    * 学习 bolt 的实现\n* 拓扑实现\n* 执行交易告警应用程序\n\n# 交易告警应用程序\n\n在这个示例中，我们将设计一个系统来读取交易流数据并统计客户执行的交易次数。如果交易次数超过阈值，系统将发送告警消息。该告警消息将存储在数据库中进行持久化存储：\n\
    \n![](img/8.1.jpg)\n\n**图 8.1:** 交易告警系统流程\n\n* **交易源数据**：交易流数据包含客户 ID、时间戳、交易 ID\
    \ 和交易金额。\n* **交易读取器 (Transactions reader)**：此组件将读取交易数据流并发送到 bolt 进行进一步处理。\n* **交易解析器\
    \ (Transactions parser)**：此组件将从 spout 读取交易数据并进行合理性检查。合理性检查将确保数据包含所需的四个字段，即客户 ID、时间戳、交易\
    \ ID 和交易金额。解析器将读取数据并将其拆分为多个键值对。\n* **交易计数器 (Transactions count tracker)**：此组件将读取客户\
    \ ID 和交易 ID 并统计每个客户的交易次数。\n* **交易告警 (Transactions alerts)**：此组件将检查每个客户的计数并与阈值比较。如果计数超过阈值，系统将发送告警。\n\
    * **结果存储到数据库 (Store Results to DB)**：该系统的输出将被存储在数据库中。\n\n# 创建 Maven 项目\n\n在本节中，我们将实现上述第\
