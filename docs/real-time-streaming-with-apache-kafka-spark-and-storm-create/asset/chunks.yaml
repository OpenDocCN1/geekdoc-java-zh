  trans: "\n\n```bash\nbin\\windows\\kafka-server-start.bat config/server.properties\n\
    ```\n\n![](img/2.22.jpg)\n\n**图 2.22:** 启动 Kafka 服务器\n\n如果你看到如前一个截图所示的消息，说明服务器已成功启动。\n\
    \n# 停止 Kafka 服务器\n\n在使用 Kafka 服务器后，必须将其关闭以释放其占用的资源和内存。下一节将描述用于停止 Kafka 服务器的命令。停止服务器的命令如下：\n\
    \n要停止服务器，请执行以下命令：\n\n```bash\nbin\\windows\\kafka-server-stop.bat\n```\n\n![](img/2.23.jpg)\n\
    \n**图 2.23:** 停止 Kafka 服务器\n\n如果删除成功，将显示上述消息。\n\n# 结论\n\n在本章中，我们学习了如何安装 JDK 并在\
    \ `JAVA_HOME` 中设置路径。我们还下载并设置了 Zookeeper，它是 Kafka 架构中一个重要的组件。我们详细介绍了在 zookeeper\
    \ 配置文件中可以指定的各种配置。我们完成了 Kafka 服务器的安装。我们了解了启动服务器以及在使用后停止它的基本命令。\n\n遵循本章的说明对于设置和安装\
    \ Kafka 及其依赖项至关重要。这构成了我们实现 Kafka 其他组件（如生产者和消费者）的基础。在下一章中，我们将学习如何通过创建生产者、消费者和代理，通过命令行发送和接收消息。我们还将学习使用\
    \ Eclipse 和 IntelliJ IDE 来实现生产者和消费者。\n\n# 问题\n\n1. **实现 Kafka 最重要的依赖项是什么？**\n\
    \   **答：** Java 或 JDK\n\n2. **Zookeeper 使用的配置文件名称是什么？**\n   **答：** `zoo.cfg`\n\
    \n3. **以下哪个批文件用于运行 Kafka 服务器：**\n   * Kafka-server-start.bat\n   * Kafka_start.bat\n\
    \   * Kafka_server.bat\n   * Kafka_start_server.bat\n   **答。** `Kafka-server-start.bat`\n\
    \n4. **哪个配置参数用于指定客户端连接的端口？**\n   **答：** `clientPort`\n\n5. **哪个配置用于指定数据库快照的存储位置？**\n\
    \   **答：** `dataDir`\n\n6. **哪个参数用于指定日志？**\n   答：`dataLogDir`\n\n7. **哪个脚本用于停止\
    \ Kafka 服务器？**\n   答：`kafka-server-stop.bat`\n\n# 第 3 章\n\n# Kafka 消息传递\n\n# 引言\n\
    \n在本章中，我们将讨论如何使用生产者发送 Kafka 消息以及如何使用消费者接收 Kafka 消息。在 Kafka 消息架构中，生产者生成消息，消费者接收这些消息。我们将深入研究\
    \ Kafka 代理（brokers）以及分区的使用方法。我们将理解 Kafka 提供的故障机制。在本章中，我们将学习通过命令行运行 Kafka 消息传递。我们将理解实现多个代理的过程以及如何处理副本的故障。将说明使用\
    \ Maven 构建在 Java 中实现 Kafka 时安装 Eclipse IDE 和 IntelliJ IDE 的步骤。\n\n# 结构\n\n* Kafka\
    \ 消息传递的组件\n* 创建 Kafka 主题\n* 删除 Kafka 主题\n* 通过命令行发送和接收消息\n* 创建多个代理\n* 安装和使用 Eclipse\
    \ 和 Maven\n* 安装 IntelliJ IDE\n\n# 目标\n\n* 理解 Kafka 消息传递的组件\n* 学习创建 Kafka 主题\n\
    * 删除 Kafka 主题的过程\n* 学习通过命令行发送和接收消息。\n* 创建多个代理并观察 zookeeper 的分配\n* 理解如何使用 Eclipse\
    \ 和 Maven\n* 使用 IntelliJ IDE 进行 Kafka 实现\n\n# 消息传递中的组件\n\nKafka 消息系统中有多个组件。这些包括\
    \ Kafka 代理和分区。它们构成了消息架构的核心。在下一节中，我们将学习这些组件的功能及其对消息系统的重要性。\n\n# Kafka 代理和 Kafka\
    \ 分区\n\n下图显示了 Kafka 消息传递的一些重要组件。架构中有多个代理。每个代理都有多个分区（例如，P1、P2 等）。当生产者为特定主题生成消息时，内容将存储在这些分区中。在某个代理内部，会有一个领导分区（leader\
    \ partition），其他分区存储属于该主题的消息。当领导分区故障时，另一个分区将接管成为领导分区。\n\n生产者将始终写入领导分区。然后由领导者决定数据存储和复制的位置。数据可以存储在同一代理的分区或不同代理的分区中。领导者决定副本的位置，从而对从生产者接收的消息进行某种负载均衡：\n\
    \n![](img/3.1.jpg)\n\n**图 3.1:** 代理和分区\n\n如前图所示，代理共同工作以接收生产者发送到某个主题的消息。领导分区在将这些消息路由到所有分区方面起着重要作用。\n\
    \n# Kafka 故障转移\n\n领导分区或副本分区都可能发生。以下是故障的可能性：\n\n* **仅领导者故障**：在这种情况下，Kafka 控制器将从分区池中选择另一个领导者。故障发生后消息处理将出现停机，因为会抛出\
    \ `LeaderNotAvailable` 异常。但一旦选定领导者，消息将继续传输。数据不会丢失。\n* **一个副本故障**：在这种情况下，副本将停止存储消息，并与领导者及其副本不同步。尽管一旦副本分区修复并激活，它将与领导者保持同步。当副本宕机时，消费者将从其他副本获取最新数据。\n\
    * **多个副本故障**：在这种情况下，故障的副本将停止接收生产者的数据。领导者仍然包含数据副本，因此消费者可以从领导者获取。一旦所有副本再次激活，它们将与丢失的所有数据同步。\n\
    * **所有副本故障（包括领导者）**：当包括领导者在内的所有副本故障时，可以修复领导者并激活以重启消息接收过程。领导者将包含它崩溃之前接收的所有数据。激活后，它将继续接收最新消息。另一种方案是从另一个代理中选举另一个领导者，但旧领导者接收的消息将丢失。新领导者将开始接收新数据。\n\
    \n上述场景是 Kafka 消息系统中可能常见的故障转移。\n\n# 创建 Kafka 主题\n\n要创建 Kafka 主题，我们需要提供以下参数：\n\n\
    | 参数 | 说明 |\n| :--- | :--- |\n| Zoo Keeper 实例 | zookeeper 运行的端口。 |\n| 副本因子 | Kafka\
    \ 集群中数据副本的数量 |\n| 分区 | 数据存储的分区数量。 |\n| 主题名称 | 要创建的主题名称。 |\n\n**表 3.1:** 创建 Kafka\
    \ 主题的参数\n\n可以按照以下步骤创建 Kafka 主题：\n\n1.  导航到 `Kafka` 目录。\n\n"
