    # Preface


    This book focuses on the real-time streaming technologies such as Apache Kafka,
    Apache Storm, and Spark Streaming. Real-time streaming refers to processing data
    immediately as and when they are generated by the data source. Streaming data
    are those which are continuously generated as compared to others that are generated
    in batches. During the course of the book, we will also learn the best way of
    integrating Kafka with Storm and Kafka with Spark.


    **[Chapter 1](#c01.xhtml)** provides an overview of Kafka and its benefits. It
    discusses the various applications of Kafka. The architecture and the different
    components of Kafka are elaborated.


    **[Chapter 2](#c02.xhtml)** illustrates the installation and setup of a Kafka
    Cluster. Kafka’s publisher subscriber system is described in detail.


    **[Chapter 3](#c03.xhtml)** explains the Kafka Messaging architecture along with
    Streams API. We will learn the components of Kafka messaging, that is, the Kafka
    brokers and partitions.


    **[Chapter 4](#c04.xhtml)** discusses the concept of Kafka producer along with
    the implementation of the Kafka Producer in Java.


    **[Chapter 5](#c05.xhtml)** discusses the concept of Kafka consumer along with
    the implementation of the Kafka Consumer.


    **[Chapter 6](#c06.xhtml)** teaches the architecture of Apache Storm. The core
    concepts of Storm, benefits and its applications will be introduced.


    **[Chapter 7](#c07.xhtml)** shows the prerequisites and steps for the installation
    of Apache Storm.


    **[Chapter 8](#c08.xhtml)** discusses the concepts of Spout and Bolt. The implementation
    of a Transaction alert system using spouts and bolts will be provided in detail.


    **[Chapter 9](#c09.xhtml)** details the core concepts of Spark as they are the
    key elements of spark and its applications. The reader will learn the architecture
    of Spark and the workflow of a spark cluster.


    **[Chapter 10](#c10.xhtml)** introduces the concepts of spark streaming. We will
    learn to implement a microservice in Spark using Scala IDE.


    **[Chapter 11](#c11.xhtml)** introduces the two approaches of integration of Spark
    and Kafka. The implementation of direct streaming was seen along with the consumer
    strategies and location strategies.


    **[Chapter 12](#c12.xhtml)** teaches us how to integrate Kafka and Storm using
    a methodology where the Kafka broker sends messages and the Bolts processes the
    messages.


