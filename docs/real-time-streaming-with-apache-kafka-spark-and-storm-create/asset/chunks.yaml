    \nIn the `execute()` method, the values sent by the previous bolt can be accessed\
    \ using `input.getString()` method. If `cumulativeTransactionAmount >1000` and\
    \ `count >2`, then the alert is sent. This bolt sends the alert as \"yes\" or\
    \ \"no\". In the `declareOutputFields()`, the output fields description is provided\
    \ `declarer.declare(new Fields(\"alert\"));`.\n\n# Creating the topology\n\nIn\
    \ this section, the topology creation will be seen in detail. The topology integrated\
    \ all the above components that we have implemented. The code for the topology\
    \ is as follows:\n\n```java\npackage TransactionAlertsSystemGrpId.TransactionAlertsSystem;\n\
    import org.apache.storm.Config;\nimport org.apache.storm.LocalCluster;\nimport\
    \ org.apache.storm.topology.TopologyBuilder;\nimport org.apache.storm.tuple.Fields;\n\
    public class TransactionAlertTopology {\n    public static void main(String args[])\
    \ {\n        TopologyBuilder builder = new TopologyBuilder();\n        builder.setSpout(\"\
    transactions-reader\", new TransactionReaderSpout());\n        builder.setBolt(\"\
    transaction_parser\", new TransactionParserBolt(), 1).shuffleGrouping(\"transactions-reader\"\
    );\n        builder.setBolt(\"transaction_count\", new TransactionCountTrackerBolt()).shuffleGrouping(\"\
    transaction_parser\");\n        builder.setBolt(\"transaction_alert\", new TransactionAlertBolt()).shuffleGrouping(\"\
    transaction_count\");\n        Config conf = new Config();\n        conf.setDebug(true);\n\
    \        LocalCluster localCluster = new LocalCluster();\n        localCluster.submitTopology(\"\
    transaction-alert-topology\", conf, builder.createTopology());\n        try {\n\
    \            Thread.sleep(10000);\n            localCluster.shutdown();\n    \
    \    } catch (InterruptedException e) {\n            // TODO Auto-generated catch\
    \ block\n            e.printStackTrace();\n            localCluster.shutdown();\n\
    \        }\n    }\n}\n```\n\nThe `transactionData` object is the array that contains\
    \ the transaction information. `builder.setSpout()` is used to set the spout.\
    \ `builder.setBolt()` function is used to set the bolts. All the bolts are set\
    \ using the above method. A local cluster topology is created and submitted using\
    \ the following line:\n\n`localCluster.submitTopology(\"transaction-alert-topology\"\
    , conf, builder.createTopology()).`\n\n# Executing the application\n\nIn this\
