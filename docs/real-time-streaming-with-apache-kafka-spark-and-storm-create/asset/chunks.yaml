    \ that is currently active is committed. |\n| 4 | `void initTransactions()` |\
    \ This method has to be invoked first. |\n| 5 | `java.util.Map<MetricName,? extends\
    \ Metric>Metrics()` | This returns the metrics that is present for each producer.\
