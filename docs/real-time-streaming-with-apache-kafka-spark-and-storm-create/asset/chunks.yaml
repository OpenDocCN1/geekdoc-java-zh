    # CHAPTER 1


    ## Introduction to Kafka


    ### Introduction


    With the advent of Internet and the digital age, there is plethora of data generated.
    We have many applications generating data every second. For example, our social
    media applications consist of so many activities performed by the users, which
    results in large amount of information being generated on a daily basis. Therefore,
    to process these data we are in need of real-time streaming tools, which can read
    and process the streams of data. Apache Kafka can process real-time data streams
    in a distributed manner. In this chapter, we will understand the core API of Apache
    Kafka and we will discuss the various applications of Kafka. Kafka''s architecture
    consists of producer, consumer, broker, topics, and partitions. We will describe
    each component of the architecture in detail.


    ### Structure

    * Introduction to Apache Kafka

    * Kafka versus Traditional Messaging

    * Kafka architecture: Producer, Consumer, and Broker

    * Kafka architecture: Topics and Partitions

    * Core API of Kafka

    * Advantages of using Kafka

    * Applications using Kafka


    ### Objectives

    * Understanding the concepts of Apache Kafka

    * Knowing the benefits of Kafka

    * Learning about the applications of Kafka

    * Understanding the architecture of Kafka

    * Overview of the components within Kafka


    ## Introduction to Apache Kafka


    Apache Kafka provides publish-subscribe system. The producers publish data and
    the subscriber consumes the data. The data streams are processed quickly and efficiently
    within seconds. It is capable of processing real-time data. The data and information
    being streamed are also stored in a fault-tolerant manner. The messages sent to
    the Kafka are stored in multiple brokers to ensure fault-tolerance. Apache Kafka
    is written using Scala and Java. It is an open-source platform; therefore, it
    can be used without having to pay a fee for license.


    The user can indicate the time duration for which the data has to be stored and
    the amount of data that needs to be stored. After the indicated time duration,
    the data will be purged. The Kafka messages are stored with a time stamp within
    partitions:


    ![](images/1.1.jpg)


    **Figure 1.1:** High-level Overview of Kafka


    The [figure 1.1](#c01.xhtml_fig1_1) shows the high-level overview of message flow
    in Kafka. There are `n` producers producing messages and there are `m` consumers
    consuming the messages. The messages produced by producers are identified by a
    name called `topic` and a consumer may consume from multiple topics. The relay
    of these messages from the producer to the consumer and its management is performed
    by the zookeeper.


    ## Kafka versus traditional message queues


    The following are some of the differences between the traditional message queue
    and Kafka:


    * In traditional message queues, the messages are removed from the queue once
    they are read. However, in Kafka, the messages persist even after it is read.
    This time duration for which the message would persist can be configured.


    * Since the Kafka messages persists in the storage after being read, these messages
    can also be tracked, read again and reprocessed if required. This functionality
    is not possible with a message queue.


    * In Kafka, the messages published by producers are posted to a topic and the
    subscriber subscribes to the topic and reads the message. Therefore, there isn''t
    a queue, which is used in the traditional messaging.


    * The topics in Kafka contain multiple partitions; therefore, this allows parallel
    processing and high throughput. These concepts will be detailed in the following
    chapters. The traditional messaging does not provide.


    * Kafka replicates the messages in different brokers and multiple servers; therefore,
    the availability of the data is high and it has a good way to recover failed data.
    The traditional messaging does not provide message replication.


    * Load balancing is provided within the architecture of Kafka, whereas it has
    to be externally configured for the other queues.


    Therefore, from the preceding comparisons, we can understand that there are many
    benefits in using Kafka over the traditional queues. Due to these factors, it
    is been used in various applications.


    ## Kafka architecture: producer, consumer, and broker


    The [figure 1.2](#c01.xhtml_fig1_2) shows the architecture of Kafka. The Kafka
    architecture consists of the Kafka Cluster. The cluster contains multiple nodes.
    Brokers run with the cluster. Multiple brokers together constitute a Kafka cluster.


    On a very high level, as shown in the following figure, the producers send messages
    to the cluster and the consumers consume these messages. The messages are also
    interchangeably known as `records`.


    The Zookeeper is a used to manage the services of a Kafka cluster. It takes care
    of identifying the statuses of the brokers, which are present within the cluster.
    It notifies the nodes whenever a new broker has been added or if a broker is not
    active anymore. Any change is communicated to all the nodes through the Zookeeper.


    ![](images/1.2.jpg)


    **Figure 1.2:** Architecture of Kafka


    The Zookeeper maintains the quota of the data for the producers and the consumers.
    The Zookeeper tracks the replicas for the topics, if a node fails, then the Zookeeper
