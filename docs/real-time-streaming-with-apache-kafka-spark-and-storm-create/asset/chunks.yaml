    \ http://maven.apache.org/xsd/maven-4.0.0.xsd\">`**\n\n**`<modelVersion>4.0.0</modelVersion>`**\n\
    \n**`<groupId>KafkaProject</groupId>`**\n\n**`<artifactId>KafkaProject</artifactId>`**\n\
    \n**`<version>0.0.1-SNAPSHOT</version>`**\n\n**`<parent>`**\n\n**`<groupId>org.springframework.boot</groupId>`**\n\
    \n**`<artifactId>spring-boot-starter-parent</artifactId>`**\n\n**`<version>2.0.0.RELEASE</version>`**\n\
    \n**`<relativePath/><!—lookup parent from repository `**\n\n**`</parent>`**\n\
    \n**`<properties>`**\n\n**`<maven-jar-plugin.version>2.6</maven-jar-plugin.version>`**\n\
    \n**`<project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>`**\n\n\
    **`<project.reporting.outputEncoding>UTF-8</project.reporting.outputEncoding>`**\n\
    \n**`<java.version>1.8</java.version>`**\n\n**`</properties>`**\n\n**`<dependencies>`**\n\
    \n**`<dependency>`**\n\n**`<groupId>org.springframework.boot</groupId>`**\n\n\
    **`<artifactId>spring-boot-starter-web</artifactId>`**\n\n**`</dependency>`**\n\
    \n**`<dependency>`**\n\n**`<groupId>org.springframework.boot</groupId>`**\n\n\
    **`<artifactId>spring-boot-devtools</artifactId>`**\n\n**`<scope>runtime</scope>`**\n\
    \n**`</dependency>`**\n\n**`<dependency>`**\n\n**`<groupId>org.springframework.boot</groupId>`**\n\
    \n**`<artifactId>spring-boot-starter-test</artifactId>`**\n\n**`<scope>test</scope>`**\n\
    \n**`</dependency>`**\n\n**`<dependency>`**\n\n**`<groupId>org.apache.kafka</groupId>`**\n\
    \n**`<artifactId>kafka_2.12</artifactId>`**\n\n**`<version>1.0.1</version>`**\n\
    \n**`</dependency>`**\n\n**`</dependencies>`**\n\n**`</project>`**\n\nThe dependency\
    \ **`spring-boot-starter-web`** includes the libraries of spring boot. The **`spring-boot-devtools`**\
    \ dependency provides runtime support of restarting the application whenever there\
    \ is a change in the files within the project. The **`spring-boot-starter-test`**\
    \ includes libraries for testing spring boot applications. The **`kafka_2.12`**\
    \ contains all the libraries required to implement Kafka.\n\nThe following is\
    \ the implementation of Kafka Producer:\n\n`//import util.properties packages`\n\
    \n`import java.util.Properties;`\n\n`//import KafkaProducer packages`\n\n`import\
    \ org.apache.kafka.clients.producer.KafkaProducer;`\n\n`//import ProducerRecord\
    \ packages`\n\n`import org.apache.kafka.clients.producer.ProducerRecord;`\n\n\
    `public class Producer {`\n\n`public static void main(String[] args) throws Exception\
    \ {`\n\n`// Provide a topic name for producing the messages to`\n\n`String topicName\
    \ = \"Test-Kafka5\";`\n\n`// Properties instance is created to use the properties`\n\
    \n`Properties props = new Properties();`\n\n`// Assign the localhost id to the\
    \ server properties`\n\n`props.put(\"bootstrap.servers\", \"localhost:9092\");`\n\
    \n`// Provide the buffer size in properties file`\n\n`props.put(\"batch.size\"\
    , 16384);`\n\n`// When a request fails, how many times can the producer retry`\n\
    \n`props.put(\"retries\", 0);`\n\n`// Setting the acknowledgements for all producer\
    \ requests.`\n\n`props.put(\"acks\", \"all\");`\n\n`// Reduce the no of requests\
    \ less than 0`\n\n`props.put(\"linger.ms\", 1);`\n\n`// It is the total amount\
    \ of memory available to the producer for`\n\n`// buffering.`\n\n`props.put(\"\
    buffer.memory\", 33554432);`\n\n`props.put(\"key.serializer\", \"org.apache.kafka.common.serialization.StringSerializer\"\
    );`\n\n`props.put(\"value.serializer\", \"org.apache.kafka.common.serialization.StringSerializer\"\
    );`\n\n`KafkaProducer<String, String> producer = new KafkaProducer<String, String>(props);`\n\
    \n`System.out.println(\" topicName \" + topicName);`\n\n`for (int i = 0; i<30;\
    \ i++) {`\n\n`// Using the send method to send the message`\n\n`producer.send(new\
    \ ProducerRecord<String, String>(topicName, Integer.toString(i),`\n\n`\"Kafka\
    \ Producer is sending message: \" + Integer.toString(i)));`\n\n`}`\n\n`System.out.println(\"\
    All the messages have been sent successfully\");`\n\n`//Close the Producer instance`\n\
    \n`producer.close();`\n\n`}`\n\n`}`\n\n# [Understanding the implementation of\
    \ producer](#toc.xhtml_s48a)\n\nThe implementation of a Kafka producer contains\
    \ configuring parameters to set up the environment in which it executes. The following\
    \ is the sequence of setting up of a Kafka producer:\n\n*   The **`KafkaProducer`**\
    \ class is a Kafka client, it produces messages and sends them to the Kafka cluster.\n\
    \n*   The **`KafkaProducer`** class is threadsafe, which means one instance of\
    \ a producer can be shared instead of creating multiple producer instances.\n\n\
    *   The **`producer`** class sends messages in the form of **`<key,value>`** pairs.\n\
    \n*   The buffer size defined in the properties decides how much data it can hold\
    \ before sending them to the cluster\n\n*   The batch size is the amount of unsent\
    \ data that a producer can hold.\n\n*   The **`send`** method is asynchronous.\n\
    \n*   The retry specifies the number of retries that can happen when a send task\
    \ fails to send a message.\n\n# [Executing the producer](#toc.xhtml_s49a)\n\n\
    1.  Start the consumer on the command line as shown in the following screenshot:\n\
    \n    ![](images/4.1.jpg)\n\n    **Figure 4.1:** L Executing Producer\n\n2.  Click\
    \ on **`Run`** | **`Producer (Class name)`** as shown in the following screenshot:\n\
    \n    ![](images/4.2.jpg)\n\n    **Figure 4.2:** Running the producer\n\n    You\
    \ will see the log file with the message: **`All messages have been sent successfully`**:\n\
    \n    ![](images/4.3.jpg)\n\n    **Figure 4.3:** Output Log File\n\n3.  The consumer\
    \ console will have the messages that were sent by the producer:\n\n    ![](images/4.4.jpg)\n\
    \n    **Figure 4.4:** Consumer console\n\n# [Three ways to send a Kafka message](#toc.xhtml_s50a)\n\
    \nThere are 3 ways to send messages, they are described as follows:\n\n*   **Fire\
    \ and forgot**: In this scenario, once the message is sent, there won’t be an\
    \ acknowledgement. There will be retries if the message is not sent successfully,\
    \ but there may be some messages which are lost.\n\n    The following syntax is\
    \ used in this method:\n\n    `//Create a message`\n\n    `ProducerRecord<String,\
    \ String>kafkaMessageContent= new ProducerRecord<String, String> (\"Kafka topic\
    \ name\", kafka_key, kafka_message);`\n\n    `//Send the message`\n\n    `producer.send(kafkaMessageContent);`"
