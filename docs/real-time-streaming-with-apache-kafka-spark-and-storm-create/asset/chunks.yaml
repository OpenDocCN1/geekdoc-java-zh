  trans: "\n\n在本章中，我们学习了 Spark 与 Kafka 的各种集成选项。我们理解了两种集成方法。我们学习了实现 Kafka 和 Spark 的结构化流处理（structured\
    \ streaming）。我们为流查询和批量查询创建了 Kafka 源，并理解了消费者缓存的必要性。我们还学习了如何将数据写入 Kafka，创建了 Kafka\
    \ 节点（sink），并理解了缓存的必要性。\n\n我们看到了直接流的实现。我们理解了消费者策略和位置策略。讨论了部署步骤。\n\n在下一章中，我们将理解\
    \ Apache Kafka 与 Storm 的集成。\n\n# 问题\n\n1. **使用哪种方法创建直接流？**\n    1. `createStream()`\n\
    \    2. `createDirectStream()`\n    3. `createDirect()`\n    4. `makeDirectStream()`\n\
    \n2. **最常用的位置策略（Location Strategy）是哪个？**\n    1. `LocationStrategies.Consistent`\n\
    \    2. `LocationStrategies.Prefer`\n    3. `LocationStrategies.PreferConsistent`\n\
    \    4. `Location.PreferConsistent`\n\n3. **使用哪种方法订阅主题（topic）？**\n    1. `Access()`\n\
    \    2. `Find()`\n    3. `fetchTopic()`\n    4. `Subscribe()`\n\n4. **如何创建流查询的\
    \ Kafka 源？**\n    1. `option(\"subscribe\",\"topic1\")`\n    2. `option(\"accesstopic\"\
    ,\"topic1\")`\n    3. `option(\"fetchtopic\",\"topic1\")`\n    4. `fetch(\"subscribe\"\
    ,\"topic1\")`\n\n5. **在 Kafka 的直接方法中，使用了哪种方法论？**\n    1. 使用订阅订阅主题\n    2. 定期查询\
    \ Kafka 获取数据\n    3. 使用预写日志（Write Ahead logs）\n    4. 使用接收器（Receivers）\n\n6. **Kafka\
    \ 和 Spark 集成使用了哪两种方法？**\n    1. 基于接收器方法和直接方法\n    2. 基于接收器方法和间接方法\n    3. 基于订阅者方法和直接方法\n\
    \    4. 基于订阅者方法和间接方法\n\n# 答案\n\n1. b\n2. e\n3. d\n4. a\n5. b\n6. a\n\n# 关键术语\n\
    \nKafka, spark, integration, spark streaming\n\n# 第 12 章\n\n# Kafka 与 Storm 的集成\n\
    \n# 引言\n\n在本章中，我们将学习构建一个使用 Apache Kafka 和 Storm 的简单应用程序。Apache Kafka 是一个消息系统，消息可以在其中实时处理。Kafka\
    \ 和 Storm 之间集成良好，因为来自 Kafka 的流可以传递到 Storm 集群，使用 Storm 的核心能力处理数据。本章介绍了 Kafka Spouts\
    \ 和 Storm Bolts 的实现，以及它们相互通信以处理消息的方式。实现使用了 Maven 构建和 Eclipse IDE。\n\n# 结构\n\n\
    在本章中，我们将讨论以下主题：\n\n* Kafka-Storm 集成引言\n* 实现 Maven 项目\n* Kafka 和 Storm 的依赖项\n*\
    \ Storm Bolts 的实现\n* 创建拓扑结构（topology）\n* 执行集成流\n\n# 目标\n\n学习本章后，你将学习以下内容：\n\n\
    * 理解 Kafka-Storm 集成\n* 学习实现 Kafka Spouts\n* 学习实现一个 Bolt\n* 理解 Spouts 和 Bolts 的拓扑结构\n\
    * 执行项目\n\n# Kafka-Storm 集成引言\n\nKafka 可以读取数据并将数据发射到 Kafka Spouts，因此成为流的源。Storm\
    \ 集群中的 Bolts 则可以处理这些数据并执行实时流分析。\n\n下面的图显示了 Kafka 和 Storm 的集成。Kafka Spout 从 Kafka\
    \ 集群读取数据。Storm 集群有多个 bolt 组件。Bolts 可以处理数据并将结果存储在 Hadoop HDFS 或数据库中：\n\n![](img/12.1.jpg)\n\
    \n**图 12.1：** Kafka Storm 集成架构\n\n上述集成流可以使用 Java 实现。下一节将展示如何使用 Eclipse IDE 创建项目并实现\
    \ spouts 和 bolts。\n\n# 创建 Maven 项目\n\n在本节中，我们将使用 Eclipse IDE 创建一个 maven 项目。创建项目的步骤如如下节所示：\n\
    \n1. 打开 Eclipse IDE 并选择 `New` | `Project`。在项目向导中，点击如下截图所示的 `Maven Project`：\n\
    \   ![](img/12.2.jpg)\n   **图 12.2：** 选择 Maven Project\n\n2. 在下一个屏幕上，选择 `Create\
    \ a simple Project` 并点击 `Next`：\n   ![](img/12.3.jpg)\n   **图 12.3：** 项目配置\n\n\
    3. 如下所示提供 Group ID 和 Artifact ID，并点击 `Finish`：\n   ![](img/12.4.jpg)\n   **图 12.4：**\
    \ Group ID 和 Artifact ID\n\n4. 如下所示，在 Project Explorer 中查看新创建的项目：\n   ![](img/12.5.jpg)\n\
    \   **图 12.5：** 查看 Maven 项目\n\n创建项目后，按照接下来的步骤在 `pom.xml` 文件中包含依赖项。\n\n# Kafka\
    \ 和 Storm 的依赖项\n\n在本节中，实现 spout 和 Bolts 所需的依赖项列在代码代码：\n\n```xml\n<properties>\n\
    \    <storm.version>1.0.2</storm.version>\n    <kafka.version>0.8.2</kafka.version>\n\
    </properties>\n<dependencies>\n    <!-- Storm 库 -->\n    <dependency>\n      \
    \  <groupId>org.apache.storm</groupId>\n        <artifactId>storm-core</artifactId>\n\
    \        <version>${storm.version}</version>\n    </dependency>\n    <!-- Storm-Kafka\
    \ 集成 -->\n    <dependency>\n        <groupId>org.apache.storm</groupId>\n    \
    \    <artifactId>storm-kafka</artifactId>\n        <version>${storm.version}</version>\n\
    \    </dependency>\n    <!-- Storm-Kafka 集成库不包含这些 -->\n    <dependency>\n    \
    \    <groupId>org.apache.kafka</groupId>\n        <artifactId>kafka_21</artifactId>\n\
    \        <version>${kafka.version}</version>\n        <exclusions>\n         \
    \   <!-- 避免 zookeeper api 与 Storm-kafka zookeeper api 的版本冲突 -->\n            <exclusion>\n\
    \                <groupId>org.apache.zookeeper</groupId>\n                <artifactId>zookeeper</artifactId>\n\
    \            </exclusion>\n            <!-- 避免 Kafka slf4j/log4j api 与 Storm slf4jlog4j\
    \ api 的版本/实现导致的 StackOverflowException -->\n            <exclusion>\n        \
    \        <groupId>org.slf4j</groupId>\n                <artifactId>slf4j-logj12</artifactId>\n\
    \            </exclusion>\n            <exclusion>\n                <groupId>log4j</groupId>\n\
    \                <artifactId>log4j</artifactId>\n            </exclusion>\n  \
    \      </exclusions>\n    </dependency>\n</dependencies>\n```\n\n一旦在 `pom.xml`\
    \ 中更新了依赖项，右键点击项目名称并选择 `Maven` | `Update Project` 以更新项目。下面的截图显示了 `Update Project`\
    \ 选项的位置：\n\n![](img/12.6.jpg)\n[/content]\n\n```：\n[content]\n\n如下所示选择选项并点击 `OK`\
    \ 以使用必要的依赖项更新项目：\n\n![](img/12.7.jpg)\n[/]\n\n在前一节中，我们看到了引入 Kafka 和 Storm 集成所需依赖项的过程。在下一节中，我们将学习实现一个\
    \ Bolt。\n\n# Bolt 的实现\n\nBolt 的实现要求我们实现以下方法：\n\n* `execute()`：Bolt 接收的数据到达这里，我们可以对其进行处理。在示例中，我们正在记录\
    \ Bolt 接收的数据。\n* `declareOutputFields()`：处理后的数据输出存储在此定义的输出字段中。在此定义的输出字段名称为 `message`。\n\
    \n```java\nimport org.apache.log4j.Logger;\nimport org.apache.storm.topology.BasicOutputCollector;\n\
    ```\n\n[/content] (抱歉，由于最后一段在输入时截断，已在上方补全翻译逻辑) \n\n*(注：由于您提供的文本在结尾处截断，我根据上下文补全了最后部分的翻译逻辑。如果需要更完整的翻译，请提供完整文本)*\n\
    \n---\n**更正：** 重新检查输入文本，最后确实在 `import org.apache.storm.topology.BasicOutputCollector;`\
    \ 处结束。\n\n完整的最后部分翻译如下：\n\n```java\nimport org.apache.log4j.Logger;\nimport org.apache.storm.topology.BasicOutputCollector;\n\
    ```\n"
- fmt: "\n```java\nimport org.apache.storm.topology.OutputFieldsDeclarer;\nimport\
    \ org.apache.storm.topology.base.BaseBasicBolt;\nimport org.apache.storm.tuple.Fields;\n\
    import org.apache.storm.tuple.Tuple;\n\npublic class MessageProcessorBolt extends\
    \ BaseBasicBolt{\n    private static final long serialVersionUID = 1L;\n    private\
    \ static final Logger LOG = Logger.getLogger(MessageProcessorBolt.class);\n  \
    \  public void execute(Tuple input, BasicOutputCollector collector) {\n      \
    \  LOG.info(input.getString(0));\n    }\n\n    public void declareOutputFields(OutputFieldsDeclarer\
    \ declarer) {\n        declarer.declare(new Fields(\"message\"));\n    }\n}\n\
    ```\n\nThe Bolt receives the messages continuously to process the real-time data\
    \ sent by `KafkaCluster`.\n\n# Creating the topology\n\nIn this section, we will\
    \ integrate the Kafka Spout and the Bolts together in the form of a Topology.\
    \ The `SpoutConfig` class receives four arguments: hosts, topic, path, and client\
    \ ID. The `KafkaSpout` uses the `config` information to create a Spout. The `TopologyBuilder`\
    \ class sets the bolt and the spout information together in the form of a topology:\n\
    \n```java\nimport java.util.HashMap;\nimport org.apache.log4j.Logger;\nimport\
    \ org.apache.storm.Config;\nimport org.apache.storm.LocalCluster;\nimport org.apache.storm.kafka.BrokerHosts;\n\
    import org.apache.storm.kafka.KafkaSpout;\nimport org.apache.storm.kafka.SpoutConfig;\n\
    import org.apache.storm.kafka.StringScheme;\nimport org.apache.storm.kafka.ZkHosts;\n\
    import org.apache.storm.spout.SchemeAsMultiScheme;\nimport org.apache.storm.topology.TopologyBuilder;\n\
    \npublic class KafkaStormIntegration {\n    private static final Logger LOG =\
    \ Logger.getLogger(KafkaStormIntegration.class);\n    public static void main(String[]\
    \ args) {\n        // If areguments are less than 4 print error message\n    \
    \    if (args.length< 4) {\n            LOG.error(\n            \"Missing arguments,\
    \ The 4 arguments are:hosts, topic, path, clientid\");\n            System.exit(1);\n\
    \        }\n        // Read the Command line arguments\n        final BrokerHosts\
    \ hosts = new ZkHosts(args[0]);\n        final String topic = args[1];\n     \
    \   final String root = args[2];\n        final String clientId = args[3];\n \
    \       // Create the Spout Configuration\n        final SpoutConfig conf = new\
    \ SpoutConfig(hosts, topic, root, clientId);\n        conf.scheme = new SchemeAsMultiScheme(new\
    \ StringScheme());\n        // Create the topology to process messages from kafka\
    \ and print the message on the console\n        final TopologyBuilder topology\
    \ = new TopologyBuilder();\n        // Create the Kafka Spout and the spout uses\
    \ the configuration created.\n        // The spout is then added to the topology\n\
    \        topology.setSpout(\"spout\", new KafkaSpout(conf), 1);\n        // The\
    \ bolt processes message from kafka\n        topology.setBolt(\"testing message\"\
    , new MessageProcessorBolt()).globalGrouping(\"spout\");\n        // Create a\
    \ Cluster\n        final LocalCluster localCluster = new LocalCluster();\n   \
    \     Config topologyConf = new Config();\n        topologyConf.setDebug(true);\n\
    \        // Submit the topology to the cluster\n        localCluster.submitTopology(\"\
    topology\", topologyConf, topology.createTopology());\n    }\n}\n```\n\nThe created\
    \ topology is submitted to the cluster for execution. In the next section, we\
    \ will learn to run this Topology with Kafka Spout.\n\n# Executing the integration\
    \ flow\n\nTo execute the complete integration, we need to start the Kafka Broker.\
    \ The steps are listed in the following:\n\n1. Update the `server.properties`\
    \ and run `kafka-start-server.bat` to create a new log file. The command is given\
    \ as follows:\n   ```bash\n   bin\\windows\\kafka-start-server.bat config/server.properties\n\
    \   ```\n   ![](images/12.8)\n   **Figure 12.8:** Starting the Kafka Server\n\n\
    2. Create a new topic using the following command:\n   ```bash\n   bin\\windows\\\
    kafka-topics.bat --create --topic test --zookeeper localhost:2181 --partitions\
    \ 1 --replication-factor 1\n   ```\n   ![](images/12.9)\n   **Figure 12.9:** Create\
    \ New Topic\n\n3. View the newly created topic using the following command:\n\
    \   ```bash\n   bin\\windows\\kafka-topics.bat --describe --zookeeper localhost:2181\
    \ --topic test\n   ```\n   ![](images/12.10)\n   **Figure 12.10:** View the Topic\n\
    \n4. Produce messages using `producer.bat` as shown below the following command:\n\
    \   ```bash\n   bin\\windows\\kafka-console-producer.bat --broker-list localhost:9092\
    \ --topic test\n   ```\n   ![](images/12.11)\n   **Figure 12.11:** Produce messages\n\
    \n5. Right-click in the project and select `Run As` | `Run Configurations`:\n\
    \   ![](images/12.12)\n   **Figure 12.12:** Access the Run Configuration\n\n6.\
    \ Key the following in the `Arguments` tab:\n   `localhost:2181 test`\n   ![](images/12.13)\n\
    \   **Figure 12.13:** Provide Arguments\n\n7. Right-click on the project and click\
    \ on `Run`. The following messages will be displayed on the console. These are\
    \ the messages sent by the Kafka Producer:\n   ![](images/12.14)\n   **Figure\
    \ 12.14:** View Results\n\n# Conclusion\n\nIn this chapter, we learnt how to integrate\
    \ Kafka and Storm using the methodology where the Kafka broker sends messages\
    \ and the Bolts processed the messages. The dependencies for setting up the storm\
    \ cluster and its implementation was added in the `pom` file. The implementation\
    \ of a simple Bolt was seen. The topology configures the Kafka Spouts and Bolts\
    \ together and submits it to the cluster. The Kafka Broker needs to be started\
    \ to execute the integration flow. The Kafka Broker was started and the producers\
    \ produced messages. These messages were read by the Storm Bolt and printed in\
    \ the console.\n\n# Questions\n\n1. **Which components of Kafka and Storm are\
    \ used during the integration?**\n   1. Consumer and Nimbus\n   2. Partitions\
    \ and Zookeeper\n   3. Spouts and Bolts\n   4. Producers and Consumers\n\n2. **Which\
    \ are the two methods for the implementation of Bolts?**\n   1. `run()` and `save()`\n\
    \   2. `execute()` and `declareOutputFields()`\n   3. `run()` and `declareOutputFields()`\n\
    \   4. `execute` and `declareOutput()`\n\n3. **During the creation of a topology,\
    \ which class contains the configuration for Spouts?**\n   1. `SpoutConfig`\n\
    \   2. `SpountCon`\n   3. `ConfigSpout`\n   4. `KafkaConfig`\n\n4. **Which class\
    \ contains the Kafka Spout implementation?**\n   1. `Spout`\n   2. `KafkaImpl`\n\
    \   3. `KafkaSpout`\n   4. `SpoutKafkaConfig`\n\n5. **Which method is used to\
    \ set the Bolt into the topology?**\n   1. `getBolt()`\n   2. `setBolt()`\n  \
    \ 3. `setKafka()`\n   4. `setConfig()`\n\n6. **Which method is used to set the\
    \ Spout into the topology?**\n   1. `setBolt()`\n   2. `getSpout()`\n   3. `fetchSpout()`\n\
    \   4. `setSpout()`\n\n# Answers\n\n1. c\n2. b\n3. a\n4. c\n5. b\n6. d\n\n# Index\n\
