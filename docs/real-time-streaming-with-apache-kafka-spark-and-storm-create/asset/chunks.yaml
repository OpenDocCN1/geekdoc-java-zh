    \ IRichBolt {\n    /**\n     *\n     */\n    private static final long serialVersionUID\
    \ = -4130092930769665618L;\n    Map<String, Integer> counters;\n    Integer id;\n\
    \    String name;\n    String fileName;\n    OutputCollector collector;\n\n  \
    \  @Override\n    public void prepare(Map stormConf, TopologyContext context,\
    \ OutputCollector collector) {\n        this.counters = new HashMap<>();\n   \
    \     this.name = context.getThisComponentId();\n        this.id = context.getThisTaskId();\n\
    \        this.collector = collector;\n    }\n\n    @Override\n    public void\
    \ execute(Tuple input) {\n        String custID = input.getString(0);\n      \
    \  Integer count = input.getInteger(1);\n        Integer cumulativeTransactionAmount\
    \ = input.getInteger(2);\n        if(cumulativeTransactionAmount>1000 && count>2){\n\
    \            System.out.println(\"Alert yes for \"+custID+\" cumulativeTransactionAmount\
    \ \"+cumulativeTransactionAmount.toString()\n            +\" count \"+count.toString());\n\
    \            this.collector.emit(new Values(\"yes\"));\n        }\n    }\n\n \
    \   @Override\n    public void cleanup() {\n    }\n\n    @Override\n    public\
    \ void declareOutputFields(OutputFieldsDeclarer declarer) {\n        // TODO Auto-generated\
    \ method stub\n        declarer.declare(new Fields(\"alert\"));\n    }\n\n   \
    \ @Override\n    public Map<String, Object> getComponentConfiguration() {\n  \
    \      // TODO Auto-generated method stub\n        return null;\n    }\n}\n```\n\
    \n在 `execute()` 方法中，可以使用 `input.getString()` 方法访问上一个 bolt 发送的值。如果 `cumulativeTransactionAmount\
    \ >1000` 且 `count >2`，则会发送警报。此 bolt 将 \"yes\" 或 \"no\" 作为警报发送。在 `declareOutputFields()`\
    \ 中，提供了输出字段描述 `declarer.declare(new Fields(\"alert\"));`。\n\n# 创建拓扑\n\n在本节中，将详细介绍拓扑的创建。该拓扑集成了我们已经实现的所有上述组件。拓扑的代码如下：\n\
    \n```java\npackage TransactionAlertsSystemGrpId.TransactionAlertsSystem;\nimport\
    \ org.apache.storm.Config;\nimport org.apache.storm.LocalCluster;\nimport org.apache.storm.topology.TopologyBuilder;\n\
    import org.apache.storm.tuple.Fields;\npublic class TransactionAlertTopology {\n\
    \    public static void main(String args[]) {\n        TopologyBuilder builder\
    \ = new TopologyBuilder();\n        builder.setSpout(\"transactions-reader\",\
    \ new TransactionReaderSpout());\n        builder.setBolt(\"transaction_parser\"\
    , new TransactionParserBolt(), 1).shuffleGrouping(\"transactions-reader\");\n\
    \        builder.setBolt(\"transaction_count\", new TransactionCountTrackerBolt()).shuffleGrouping(\"\
    transaction_parser\");\n        builder.setBolt(\"transaction_alert\", new TransactionAlertBolt()).shuffleGrouping(\"\
    transaction_count\");\n        Config conf = new Config();\n        conf.setDebug(true);\n\
    \        LocalCluster localCluster = new LocalCluster();\n        localCluster.submitTopology(\"\
    transaction-alert-topology\", conf, builder.createTopology());\n        try {\n\
    \            Thread.sleep(10000);\n            localCluster.shutdown();\n    \
    \    } catch (InterruptedException e) {\n            // TODO Auto-generated catch\
    \ block\n            e.printStackTrace();\n            localCluster.shutdown();\n\
    \        }\n    }\n}\n```\n\n`transactionData` 对象是包含交易信息的数组。使用 `builder.setSpout()`\
    \ 设置 spout。使用 `builder.setBolt()` 函数设置 bolts。所有的 bolt 都是使用上述方法设置。通过以下行创建并提交本地集群拓扑：\n\
    \n`localCluster.submitTopology(\"transaction-alert-topology\", conf, builder.createTopology()).`\n\
    \n# 运行应用程序\n\n在本节中，我们将执行在前步骤中实现的应用程序。按照以下步骤进行执行：\n\n1. 按照上一章节的说明启动 storm 的 `nimbus`、`supervisor`\
    \ 和 `ui`。\n2. 运行拓扑类：如下所示所示运行 `TransactionAlertTopology.java`：\n\n   ![](img/8.8.jpg)\n\
    \n   **图 8.8：** 运行拓扑\n3. 查看交易计数输出。我们提供的输入如屏所示：\n\n   ![](img/8.9.jpg)\n\n   **图\
    \ 8.9：** 输入数据\n\n   计数 bolt 的输出如下所示：\n\n   ![](img/8.10.jpg)\n\n   **图 8.10：**\
    \ 计数输出\n4. 查看交易警报输出。输出如下所示：\n\n   ![](img/8.11.jpg)\n\n   **图 8.11：** 警报输出\n\n\
    # 结论\n\n在本章中，描述了交易警报系统。展示了 spouts 和 bolts 的实现以及它们各自应用程序的拓扑。在下一章中，我们将学习 Apache\
    \ Spark 及其流式处理能力。\n\n# 问题\n\n1. 使用哪个命令将一个组件的输出发送到另一个组件？\n   答案：`emit()`\n2. 在\
    \ storm 拓扑中，哪个组件从数据源读取数据（Spout 还是 Bolt）？\n   答案：Spout\n3. 拓扑中 Transaction Parser\
    \ Bolt 的作用是什么？\n   答案：对输入进行完整性检查\n4. 拓扑中 Transaction Count Bolt 的作用是什么？\n   答案：统计每天的唯一交易\n\
    5. 拓扑中 Transaction Alert Bolt 的作用是什么？\n   答案：当交易数量和金额超过阈值时发送警报。\n6. LocalCluster\
    \ 类中 哪个命令用于创建拓扑？\n   答案：`submitTopology()`\n7. TopologyBuilder 类中 哪个命令用于创建拓扑？\n\
    \   答案：`createTopology()`\n\n"
- fmt: "\nApache Spark is open source software. It processes data in real time. It\
    \ performs computation in a distributed manner, and therefore is scalable and\
    \ fault tolerant. Spark contains many features for distributed computation. It\
    \ can be used with programming languages such as Scala, Python, R, Java, and SQL.\
    \ It provides machine learning libraries for implementations of ML pipelines.\n\
    \nThe architecture of spark is master and slave architecture consisting of the\
    \ master daemon and the worker daemon. In the following sections, we will learn\
    \ the core concepts and the architecture of Spark.\n\n# Comparison of Spark and\
    \ Hadoop\n\nApache Spark performs hundred times faster computations in memory.\
    \ Hadoop performs computations, but it is much slower using the `map/reduce` framework.\
    \ Spark contains all the management components within the same cluster. Hadoop\
    \ contains various components to be managed different to execute its pipeline.\n\
    \nSpark can process real-time computations, whereas Hadoop can process data in\
    \ batches only. Spark purpose is to improve the capabilities of the Hadoop stack.\
    \ Therefore, its enhanced processing power capabilities integrate well with the\
    \ Hadoop ecosystem.\n\n# Comparison of Spark and Storm\n\nApache Spark and Storm\
    \ are similar in their applications and they differ in certain key aspects. Apache\
    \ Spark is processes data in batches whereas Storm processes data in micro-batch\
    \ processing manner. Spark has a latency of seconds and Storm has latency of milliseconds.\
    \ Spark has lesser language support such as Java and Scala, whereas Storm has\
    \ multiple language support such as Java, Clojure, and Scala.\n\nStorm can process\
    \ streams of data through `spouts` and Spark can process data in `HDFS`, `HBase`,\
    \ `Cassandra`, `Hive`, and any `Hadoop InputFormat`. Storm uses `Tuple` and `partitions`,\
    \ whereas Spark can process data in `HDFS`, `HBase`, `Cassandra`, `Hive`, and\
    \ any `Hadoop InputFormat`.\n\n# Comparison of Spark and Kafka\n\nApache Spark\
    \ has real time and batch processing, whereas Kafka has only real-time processing.\
    \ Spark is supported by many easy-to-learn documentation and Kafka is very easy\
    \ to configure. The recovery mechanism in Spark uses `Cache` and `RDD`. Kafka's\
    \ recovery mechanism uses a replication approach.\n\nUsing Spark, we can perform\
    \ ETL operations as we can persist the data in the form of objects. Kafka only\
    \ supports real-time processing so that it can be used as message broker and it\
    \ can retain the messages for a short period of time only. Spark's processing\
    \ speed is much higher. Kafka also processes the data fast, but Spark's processing\
    \ is 100 times faster than Hadoop.\n\n# Core concepts\n\nSpark contains a stack\
    \ of libraries, which can be used to build applications. The core of Apache Spark\
    \ has four main components. They are shown in the following figure:\n\n![](images/9.1.jpg)\n\
    \n**Figure 9.1:** Spark Core Concepts\n\nThe Spark core components are:\n\n* **Spark\
    \ SQL**: This feature in spark where the relations processing are combined with\
    \ the Spark API for functional programming. Therefore, it provides support for\
    \ structured and semi-structured data. It allows manipulation of data as `Dataframes`\
    \ in Java, Scala, and Python. It also provides command-line interface to execute\
    \ `SQL`.\n\n* **Spark streaming**: Spark streaming makes it easy to build scalable\
    \ fault-tolerant streaming applications. The Spark streaming supports both batch\
    \ and real-time streaming. It is a scalable and fault-tolerant streaming capability.\
    \ The streaming library is based on the core Spark API. It can process data from\
    \ different sources such as `Kafka`, `Flume`, and `Amazon Kinesis`. \n\n* **MLib**:\
    \ This provides the library for machine learning. The implementations are scalable\
    \ and relatively easy to implement. It supports machine learning algorithms, feature\
    \ extraction and transformation, tuning of the ML pipelines. The models and pipelines\
    \ can be saved. Then, most used statistical utilities will also be available.\n\
    \n* **GraphX**: GraphX is Apache Spark's API for graphs and graph-parallel computation.\
    \ This provides API for Graphs and the parallel computations using graphs. It\
    \ performs ETL, exploratory analysis and graphs computation within a single system.\
    \ Its speed is comparable with the fastest graph systems. Multiple graph algorithms\
    \ are available for use such as `PageRank`, `Connected components`, and `Label\
    \ propagation`.\n\n* **Apache Spark Core**: This is the base on which the core\
    \ functions of Spark exists. It performs task distributing, scheduling, and the\
    \ input-output operations. It provides `RDD` abstraction.\n\n# Benefits and features\
    \ of Spark\n\nThe following are some of the benefits of Spark:\n\n* The real-time\
    \ processing capability enables it to integrate with real-time applications.\n\
    * It supports multiple languages such as Java, Scala, Python, and R.\n* Spark\
    \ contains several built-in operators, which will enable implementation of applications\
    \ easily and effectively.\n* Apache Spark is extremely fast in processing data\
    \ in Hadoop Cluster.\n* It has a fault-tolerant mechanism where the Spark `RDD`\
    \ can handle failure of a worker node in the cluster.\n* It can be integrated\
    \ well with Hadoop.\n\n# Spark architecture\n\nApache Spark has a well-defined\
    \ architecture. It is layered in nature and the components are loosely coupled.\
    \ It also consists of various libraries to support its features. Apache Spark's\
    \ architecture contains two main components. They are:\n\n* **Resilient Distributed\
    \ Dataset (RDD)**: The definition of RDD is R-Resilient, D-Distributed, and D-Datasets.\
    \ It contains data that can be split into partitions. This data can be stored\
    \ within the memory of the worker nodes, which are present in the Spark cluster.\n\
    \n  The two types of RDD's supported by Spark are:\n\n  * `Datasets` from `Hadoop`\
    \ that are in the form of files stored on `HDFS`\n  * Existing data from `Scala\
    \ Collections` that are parallelized\n\n  `RDDs` are immutable. This is the fundamental\
    \ element that is operated on multiple systems to enable parallel processing.\
    \ The logical portion of the data in the RDD are distributed to other nodes.\n\
    \n* **Directed Acyclic Graph (DAG)**: DAG are supported by spark. It supports\
    \ stage-oriented scheduling. The traditional Map Reduce contains the Map and Reduce\
    \ stage, whereas the Spark can contain many stages that are defined through a\
    \ DAG.\n\n  It performs a sequence of transformation, each node is an `RDD` partition\
    \ and the transformation is executed in the edge. The edge transformation transforms\
    \ the data from one state to another. Since it is acyclic, the transformed data\
    \ state has to proceed to the next partition as defined by the DAG nodes.\n\n\
    The following figure shows the architecture and the workflow of Spark applications:\n\
    \n![](images/9.2.jpg)\n\n**Figure 9.2:** Spark architecture\n\nApache Spark is\
    \ a master-slave architecture. The two daemons are the master daemon and the worker\
    \ daemon. This is managed by a cluster manager. The cluster manager starts the\
    \ executors and the drivers of the cluster.\n\nA Spark cluster many have a master\
    \ node and multiple worker nodes. The Spark driver shown in the *[figure 9.2](#c09.xhtml_fig9_2)*,\
    \ is the entry point to the cluster; it contains the `main()` function. The `SparkContext`\
    \ is created here. The `SparkContext` consists of all the functionalities that\
    \ the cluster needs. The driver has scheduling components such as `DAG scheduler`,\
    \ `backend scheduler`, `task scheduler`, and `block manager`. They will be used\
    \ to convert the code written by the users into jobs that are executed on the\
    \ cluster.\n\nThe Driver program and the context will be overseeing the tasks\
    \ running on the cluster along with the Cluster manager, which performs resource\
    \ allocation to the jobs. A job can be further split into multiple sub-tasks,\
    \ which are assigned to different worker nodes.\n"
  raw: "Apache Spark is open source software. It processes data in real time. It performs\
    \ computation in a distributed manner, and therefore is scalable and fault tolerant.\
    \ Spark contains many features for distributed computation. It can be used with\
    \ programming languages such as Scala, Python, R, Java, and SQL. It provides machine\
    \ learning libraries for implementations of ML pipelines.\n\nThe architecture\
    \ of spark is master and slave architecture consisting of the master daemon and\
    \ the worker daemon. In the following sections, we will learn the core concepts\
    \ and the architecture of Spark.\n\n# [Comparison of Spark and Hadoop](#toc.xhtml_s105a)\n\
    \nApache Spark performs hundred times faster computations in memory. Hadoop performs\
    \ computations, but it is much slower using the map/reduce framework. Spark contains\
    \ all the management components within the same cluster. Hadoop contains various\
    \ components to be managed different to execute its pipeline.\n\nSpark can process\
    \ real-time computations, whereas Hadoop can process data in batches only. Spark\
    \ purpose is to improve the capabilities of the Hadoop stack. Therefore, its enhanced\
    \ processing power capabilities integrate well with the Hadoop ecosystem.\n\n\
    # [Comparison of Spark and Storm](#toc.xhtml_s106a)\n\nApache Spark and Storm\
    \ are similar in their applications and they differ in certain key aspects. Apache\
    \ Spark is processes data in batches whereas Storm processes data in micro-batch\
    \ processing manner. Spark has a latency of seconds and Storm has latency of milliseconds.\
    \ Spark has lesser language support such as Java and Scala, whereas Storm has\
    \ multiple language support such as Java, Clojure, and Scala.\n\nStorm can process\
    \ streams of data through spouts and Spark can process data in HDFS, HBase, Cassandra,\
    \ Hive, and any Hadoop InputFormat. Storm uses Tuple and partitions, whereas Spark\
    \ can process data in HDFS, HBase, Cassandra, Hive, and any Hadoop InputFormat.\n\
    \n# [Comparison of Spark and Kafka](#toc.xhtml_s107a)\n\nApache Spark has real\
    \ time and batch processing, whereas Kafka has only real-time processing. Spark\
    \ is supported by many easy-to-learn documentation and Kafka is very easy to configure.\
    \ The recovery mechanism in Spark uses Cache and RDD. Kafka's recovery mechanism\
    \ uses a replication approach.\n\nUsing Spark, we can perform ETL operations as\
    \ we can persist the data in the form of objects. Kafka only supports real-time\
    \ processing so that it can be used as message broker and it can retain the messages\
    \ for a short period of time only. Spark's processing speed is much higher. Kafka\
    \ also processes the data fast, but Spark's processing is 100 times faster than\
    \ Hadoop.\n\n# [Core concepts](#toc.xhtml_s108a)\n\nSpark contains a stack of\
    \ libraries, which can be used to build applications. The core of Apache Spark\
    \ has four main components. They are shown in the following figure:\n\n![](images/9.1.jpg)\n\
    \n**Figure 9.1:** Spark Core Concepts\n\nThe Spark core components are:\n\n* \
    \  **Spark SQL**: This feature in spark where the relations processing are combined\
    \ with the Spark API for functional programming. Therefore, it provides support\
    \ for structured and semi-structured data. It allows manipulation of data as Dataframes\
    \ in Java, Scala, and Python. It also provides command-line interface to execute\
    \ SQL.\n\n*   **Spark streaming**: Spark streaming makes it easy to build scalable\
    \ fault-tolerant streaming applications. The Spark streaming supports both batch\
    \ and real-time streaming. It is a scalable and fault-tolerant streaming capability.\
    \ The streaming library is based on the core Spark API. It can process data from\
    \ different sources such as Kafka, Flume, and Amazon Kinesis.\n\n*   **MLib**:\
    \ This provides the library for machine learning. The implementations are scalable\
    \ and relatively easy to implement. It supports machine learning algorithms, feature\
    \ extraction and transformation, tuning of the ML pipelines. The models and pipelines\
    \ can be saved. Then, most used statistical utilities will also be available.\n\
    \n*   **GraphX**: GraphX is Apache Spark's API for graphs and graph-parallel computation.\
    \ This provides API for Graphs and the parallel computations using graphs. It\
    \ performs ETL, exploratory analysis and graphs computation within a single system.\
    \ Its speed is comparable with the fastest graph systems. Multiple graph algorithms\
    \ are available for use such as PageRank, Connected components, and Label propagation.\n\
    \n*   **Apache Spark Core**: This is the base on which the core functions of Spark\
    \ exists. It performs task distributing, scheduling, and the input-output operations.\
    \ It provides RDD abstraction.\n\n# [Benefits and features of Spark](#toc.xhtml_s109a)\n\
    \nThe following are some of the benefits of Spark:\n\n*   The real-time processing\
    \ capability enables it to integrate with real-time applications.\n\n*   It supports\
    \ multiple languages such as Java, Scala, Python, and R.\n\n*   Spark contains\
    \ several built-in operators, which will enable implementation of applications\
    \ easily and effectively.\n\n*   Apache Spark is extremely fast in processing\
    \ data in Hadoop Cluster.\n\n*   It has a fault-tolerant mechanism where the Spark\
    \ RDD can handle failure of a worker node in the cluster.\n\n*   It can be integrated\
    \ well with Hadoop.\n\n# [Spark architecture](#toc.xhtml_s110a)\n\nApache Spark\
    \ has a well-defined architecture. It is layered in nature and the components\
    \ are loosely coupled. It also consists of various libraries to support its features.\
    \ Apache Spark's architecture contains two main components. They are:\n\n*   **Resilient\
    \ Distributed Dataset (RDD)**: The definition of RDD is R-Resilient, D-Distributed,\
    \ and D-Datasets. It contains data that can be split into partitions. This data\
    \ can be stored within the memory of the worker nodes, which are present in the\
    \ Spark cluster.\n\n    The two types of RDD's supported by Spark are:\n\n   \
    \ *   Datasets from Hadoop that are in the form of files stored on HDFS\n\n  \
    \  *   Existing data from Scala Collections that are parallelized\n\n    RDDs\
    \ are immutable. This is the fundamental element that is operated on multiple\
    \ systems to enable parallel processing. The logical portion of the data in the\
    \ RDD are distributed to other nodes for execution.\n\n*   **Directed Acyclic\
    \ Graph (DAG)**: DAG are supported by spark. It supports stage-oriented scheduling.\
    \ The traditional Map Reduce contains the Map and the Reduce stage, whereas the\
    \ Spark can contain many stages that are defined through a DAG.\n\n    It performs\
    \ a sequence of transformation, each node is an RDD partition and the transformation\
    \ is executed in the edge. The edge transformation transforms the data from one\
    \ state to another. Since it is acyclic, the transformed data state has to proceed\
    \ to the next partition as defined by the DAG nodes.\n\nThe following figure shows\
    \ the architecture and the workflow of Spark applications:\n\n![](images/9.2.jpg)\n\
    \n**Figure 9.2:** Spark architecture\n\nApache Spark is a master-slave architecture.\
    \ The two daemons are the master daemon and the worker daemon. This is managed\
    \ by a cluster manager. The cluster manager starts the executors and the drivers\
    \ of the cluster.\n\nA Spark cluster many have a master node and multiple worker\
    \ nodes. The Spark driver shown in the *[figure 9.2](#c09.xhtml_fig9_2)*, is the\
    \ entry point to the cluster; it contains the **`main()`** function. The Spark\
    \ Context is created here. The SparkContext consists of all the functionalities\
    \ that the cluster needs. The driver has scheduling components such as DAG scheduler,\
    \ backend scheduler, task scheduler, and block manager. They will be used to convert\
    \ the code written by the users into jobs that are executed on the cluster.\n\n\
    The Driver program and the context will be overseeing the tasks running on the\
    \ cluster along with the Cluster manager, which performs resource allocation to\
    \ the jobs. A job can be further split into multiple sub-tasks, which are assigned\
    \ to different worker nodes."
