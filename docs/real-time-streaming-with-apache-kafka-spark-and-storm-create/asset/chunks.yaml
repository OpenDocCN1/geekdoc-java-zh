  trans: "\n\n```java\nimport org.apache.storm.topology.OutputFieldsDeclarer;\nimport\
    \ org.apache.storm.topology.base.BaseBasicBolt;\nimport org.apache.storm.tuple.Fields;\n\
    import org.apache.storm.tuple.Tuple;\n\npublic class MessageProcessorBolt extends\
    \ BaseBasicBolt{\n    private static final long serialVersionUID = 1L;\n    private\
    \ static final Logger LOG = Logger.getLogger(MessageProcessorBolt.class);\n  \
    \  public void execute(Tuple input, BasicOutputCollector collector) {\n      \
    \  LOG.info(input.getString(0));\n    }\n\n    public void declareOutputFields(OutputFieldsDeclarer\
    \ declarer) {\n        declarer.declare(new Fields(\"message\"));\n    }\n}\n\
    ```\n\n该 Bolt 持续接收消息以处理由 `KafkaCluster` 发送的实时数据。\n\n# 创建拓扑\n\n在本节中，我们将 Kafka Spout\
    \ 和 Bolts 以拓扑（Topology）的形式整合在一起。`SpoutConfig` 类接收四个参数：hosts、topic、path 和 client\
    \ ID。`KafkaSpout` 使用 `config` 信息来创建一个 Spout。`TopologyBuilder` 类将 bolt 和 spout\
    \ 信息以拓扑的形式设置在一起：\n\n```java\nimport java.util.HashMap;\nimport org.apache.log4j.Logger;\n\
    import org.apache.storm.Config;\nimport org.apache.storm.LocalCluster;\nimport\
    \ org.apache.storm.kafka.BrokerHosts;\nimport org.apache.storm.kafka.KafkaSpout;\n\
    import org.apache.storm.kafka.SpoutConfig;\nimport org.apache.storm.kafka.StringScheme;\n\
    import org.apache.storm.kafka.ZkHosts;\nimport org.apache.storm.spout.SchemeAsMultiScheme;\n\
    import org.apache.storm.topology.TopologyBuilder;\n\npublic class KafkaStormIntegration\
    \ {\n    private static final Logger LOG = Logger.getLogger(KafkaStormIntegration.class);\n\
    \    public static void main(String[] args) {\n        // 如果参数少于 4 个则打印错误信息\n\
    \        if (args.length< 4) {\n            LOG.error(\n            \"Missing\
    \ arguments, The 4 arguments are:hosts, topic, path, clientid\");\n          \
    \  System.exit(1);\n        }\n        // 读取命令行参数\n        final BrokerHosts hosts\
    \ = new ZkHosts(args[0]);\n        final String topic = args[1];\n        final\
    \ String root = args[2];\n        final String clientId = args[3];\n        //\
    \ 创建 Spout 配置\n        final SpoutConfig conf = new SpoutConfig(hosts, topic,\
    \ root, clientId);\n        conf.scheme = new SchemeAsMultiScheme(new StringScheme());\n\
    \        // 创建拓扑以处理来自 kafka 的消息并在控制台打印消息\n        final TopologyBuilder topology\
    \ = new TopologyBuilder();\n        // 创建 Kafka Spout，该 spout 使用创建的配置\n      \
    \  // 然后将 spout 添加到拓扑\n        topology.setSpout(\"spout\", new KafkaSpout(conf),\
    \ 1);\n        // bolt 处理来自 kafka 的消息\n        topology.setBolt(\"testing message\"\
    , new MessageProcessorBolt()).globalGrouping(\"spout\");\n        // 创建集群\n  \
    \      final LocalCluster localCluster = new LocalCluster();\n        Config topologyConf\
    \ = new Config();\n        topologyConf.setDebug(true);\n        // 将拓扑提交到集群\n\
    \        localCluster.submitTopology(\"topology\", topologyConf, topology.createTopology());\n\
    \    }\n}\n```\n\n创建的拓扑被提交到集群进行执行。在下一节中，我们将学习如何使用 Kafka Spout 运行此拓扑。\n\n# 执行集成流\n\
    \n要执行完整的集成，我们需要启动 Kafka Broker。步骤如下：\n\n1. 更新 `server.properties` 并运行 `kafka-start-server.bat`\
    \ 以创建一个新的日志文件。命令如下：\n   ```bash\n   bin\\windows\\kafka-start-server.bat config/server.properties\n\
    \   ```\n   ![](img/12.8)\n   **图 12.8：** 启动 Kafka 服务器\n\n2. 使用以下命令创建一个新 topic：\n\
    \   ```bash\n   bin\\windows\\kafka-topics.bat --create --topic test --zookeeper\
    \ localhost:2181 --partitions 1 --replication-factor 1\n   ```\n   ![](img/12.9)\n\
    \   **图 12.9：** 创建新 topic\n\n3. 使用以下命令查看新创建的 topic：\n   ```bash\n   bin\\windows\\\
    kafka-topics.bat --describe --zookeeper localhost:2181 --topic test\n   ```\n\
    \   ![](img/12.10)\n   **图 12.10：** 查看 topic\n\n4. 使用 `producer.bat` 产生消息，如下命令所示：\n\
    \   ```bash\n   bin\\windows\\kafka-console-producer.bat --broker-list localhost:9092\
    \ --topic test\n   ```\n   ![](img/12.11)\n   **图 12.11：** 消息\n\n5. 在项目上右键点击并选择\
    \ `Run As` | `Run Configurations`：\n   ![](img/12.12)\n   **图 12.12：** 访问配置\n\n\
    6. 在 `Arguments` 标签页中输入内容：\n   `localhost:2181 test`\n   ![](img/12.13)\n   **图\
    \ 12.13：** 提供参数\n\n7. 在项目上右键点击并点击 `Run`。以下消息将显示在控制台：：\n   ![](img/12.14)\n   **图\
    \ 12.14：** 结果\n\n# 结论\n\n在本章中，我们学习了如何将 Kafka Spout 和 Bolts 以拓扑的形式整合在一起。拓扑被提交到集群进行执行。Kafka\
    \ Broker 需要启动以执行集成流。消息由 Kafka Producer 发送。消息被 Storm Bolt 处理。依赖在 `pom` 文件中配置。\n"
