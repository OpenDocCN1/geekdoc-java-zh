  raw: "The worker node executes its tasks and returns the result to the SparkContext.\
    \ The data in the RDD can be saved in the cache of each worker node. The executors\
    \ in each worker node is responsible of executing the job and providing its results\
    \ to SparkContext. The executors are started when the application is initiated\
    \ and it continues to run in the background as long as the application is active.\n\
    \n# [Applications of Spark](#toc.xhtml_s111a)\n\nSpark has many applications;\
    \ the following are the important applications of Spark:\n\n*   **Streaming Applications\
    \ and ETL**: Spark can process streaming data; therefore, it is used in many data\
    \ processing pipelines. This includes Streaming ETL capability, which can clean\
    \ and aggregate data in real time when compared with the traditional ETL used\
    \ with batches of data. Ad companies use the capability to combine the historical\
    \ data with the real-time data, thus providing a customized ad for the users.\n\
    \n*   **Machine learning**: The MLib is the machine learning library of spark.\
    \ It can be used to perform real-time analytics on the streaming data. It can\
    \ detect frauds or threat that can occur real-time.\n\n*   **Visualization**:\
    \ Spark allows interactive visualization of data. It has the ability to perform\
    \ queries on live data very fast and therefore can be used for interactive data\
    \ processing and analysis.\n\n# [Conclusion](#toc.xhtml_s112a)\n\nIn this chapter,\
    \ we learnt the concepts of Spark. The comparison of Spark with Kafka, Storm,\
    \ and Hadoop was understood. The core concepts of Spark were detailed as they\
    \ are the key elements of spark and its applications.\n\nThe features and benefit\
    \ of Spark was also learnt. The architecture of Spark and its components was understood\
    \ in detail. The workflow of the components in a Spark cluster was understood.\
    \ The main applications of Spark were described.\n\nIn the next chapter, we will\
    \ focus on the streaming applications of Spark. The technical implementations\
    \ of Spark streaming and the basic concepts of streaming will be discussed in\
    \ detail.\n\n# [Questions](#toc.xhtml_s113a)\n\n1.  **Which one performs faster\
    \ computations - Spark or Hadoop?**\n\n    **Ans:** Spark\n\n2.  **Does Spark\
    \ have lesser language support than Storm?**\n\n    **Ans:** Yes\n\n3.  **What\
    \ is the recovery mechanism of Spark?**\n\n    **Ans:** Cache and RDD\n\n4.  **Can\
    \ spark be integrated with Hadoop?**\n\n    **Ans:** Yes\n\n5.  **Can ETL pipelines\
    \ be implemented using Spark?**\n\n    **Ans:** Yes\n\n6.  **What are the two\
    \ components of Spark architecture?**\n\n    **Ans:** RDD and DAG\n\n# [CHAPTER\
    \ 10](#toc.xhtml_c10)\n\n# [Spark Streaming](#toc.xhtml_c10)\n\n# [Introduction](#toc.xhtml_s114a)\n\
    \nIn this chapter, we will learn the concepts of streaming in Spark. Spark streaming\
    \ processes streams of data in a scalable and fault tolerant manner. It can perform\
    \ batch processing and real-time processing of streams. We will learn to execute\
    \ shell commands in Spark. We will implement Spark using Eclipse.\n\n# [Structure](#toc.xhtml_s115a)\n\
    \nThe structure of the chapter is as follows:\n\n*   Core concepts of Spark streaming\n\
    \n*   Execution of Spark Shell commands\n\n*   Implementation of Spark using Scala\
    \ IDE\n\n*   Implementing microservice using Eclipse\n\n# [Objectives](#toc.xhtml_s116a)\n\
    \nThe objectives of the chapter are:\n\n*   Understanding the concepts of Spark\
    \ Streaming\n\n*   Knowing the method of execution of spark commands\n\n*   Learning\
    \ to implement Spark using Scala IDE\n\n*   Understanding the implementation of\
    \ microservice using Eclipse IDE\n\n# [Core concepts of Spark streaming](#toc.xhtml_s117a)\n\
    \nApache Spark streaming uses the core Spark API, which can process data in real-time\
    \ from many data sources such as Kafka, Flume, and Amazon Kinesis. The streaming\
    \ libraries are built upon the existing core Spark API libraries.\n\nThe **Discretized\
    \ Stream** (**DStream**) divides the stream of data into small batches. Spark\
    \ RDD is used to build DStreams, and therefore has integration capabilities with\
    \ Spark SQL, machine learning (Spark MLib) and graph processing.\n\nSpark streaming\
    \ is fault-tolerant and hence recovers fast from failures providing high throughput.\
    \ It provides load balancing and manages the usage of resources. The streaming\
    \ data can also be integrated with static data and shown on dashboards using interactive\
    \ queries:\n\n![](images/10.1.jpg)\n\n**Figure 10.1:** Spark streaming architecture\n\
    \nIn the architecture shown above, the data from the streams are split into batched\
    \ of definite size. Each batch of data will be processed by the Spark engine for\
    \ accomplishing a specific task.\n\n# [Execution of Spark Shell commands](#toc.xhtml_s118a)\n\
    \nIn this section, we will learn to execute commands in Spark Shell. The following\
    \ steps can be followed to install Apache Spark:\n\n1.  Download Spark from the\
    \ link : **[https://spark.apache.org/downloads.html](https://spark.apache.org/downloads.html)**\n\
    \n    ![](images/10.2.jpg)\n\n    **Figure 10.2:** Download Spark\n\n2.  Navigate\
    \ to the folder and set it as **`HADOOP_PATH`**:\n\n    ![](images/10.3.jpg)\n\
    \n    **Figure 10.3:** Setting Hadoop Path\n\n3.  To the Spark shell, navigate\
    \ to the **`bin`** directory in the Command Prompt as shown in the following screenshot:\n\
    \n    ![](images/10.4.jpg)\n\n    **Figure 10.4:** Navigate to bin directory\n\
    \n4.  To start the Spark, type **`spark-shell`**:\n\n    ![](images/10.5.jpg)\n\
    \n    **Figure 10.5:** Staring Spark Shell\n\n5.  To read a file, copy paste a\
    \ file into the **`bin`** directory, and use the following command:\n\n    `val\
    \ textFile = sc.textFile(\"README.md\")`\n\n    ![](images/10.6.jpg)\n\n    **Figure\
    \ 10.6:** Executing commands\n\n6.  To count the lines in the text, we can use:\n\
    \n    `textFile.count()`\n\n    ![](images/10.7.jpg)\n\n    **Figure 10.7:** View\
    \ output\n\n7.  To read the first line, use the following command:\n\n    `textFile.first()`\n\
    \n    ![](images/10.8.jpg)\n\n    **Figure 10.8:** View the First Line\n\nIn the\
    \ preceding section, we learnt to use the Spark Shell to execute commands. For\
    \ in depth details about all the commands, we can refer to the guide here: **[https://spark.apache.org/docs/2.1.1/programming-guide.html](https://spark.apache.org/docs/2.1.1/programming-guide.html)**\n\
    \n# [Implementation of Spark using Eclipse](#toc.xhtml_s119a)\n\nIn this section,\
    \ we will learn to implement spark using Eclipse.\n\n1.  Download the Scale IDE:\
    \ **[http://scala-ide.org/](http://scala-ide.org/)**\n\n    ![](images/10.9.jpg)\n\
    \n    **Figure 10.9:** Scala IDE download website\n\n2.  Select the executable\
    \ for the corresponding operating system as shown in the following screenshot:\n\
    \n    ![](images/10.10.jpg)\n\n    **Figure 10.10:** Scale IDE download\n\n3.\
    \  Click on the Eclipse icon and open the Scala IDE. Create a workspace.\n\n4.\
    \  Select **`New`** | **`Scala Project`** and provide name as **`SparkHelloWorld`**.\n\
    \n    ![](images/10.11.jpg)\n\n    **Figure 10.11:** Scala Project Creation\n\n\
    5.  Select the default parameters and click on **Finish**.\n\n    ![](images/10.12.jpg)\n\
    \n    **Figure 10.12:** New Scala project\n\n6.  Open the project in the Project\
    \ Explorer. Right-click on **`src`** | **`New`** | **`Package`**.\n\n    ![](images/10.13.jpg)\n\
    \n    **Figure 10.13:** Create a new package\n\n7.  Provide a name for the package:\n\
    \n    ![](images/10.14.jpg)\n\n    **Figure 10.14:** Naming the package\n\n8.\
    \  Right-click on **`src`** | **`New Scala Object`**:\n\n    ![](images/10.15.jpg)\n\
    \n    **Figure 10.15:** Creation of Scala Object\n\n9.  The following code is\
    \ used to create the object:\n\n    `objecttest {`\n\n    `def main (args: Array[String])\
    \ {`\n\n    `println(\"Testing Spark Scala Application\")`\n\n    `}`\n\n    `}`\n\
    \n10.  Right-click on **`Run As`** | **`Scala Application`**:\n\n    ![](images/10.16.jpg)\n\
    \n    **Figure 10.16:** Running the Scala Application\n\n11.  The output can be\
    \ viewed in the console as shown in the following screenshot:\n\n    ![](images/10.17.jpg)\n\
    \n    **Figure 10.17:** Output of Scala Application\n\nIn the preceding section,\
    \ we learnt to create Scala objects using eclipse.\n\n# [Implementing microservice](#toc.xhtml_s120a)"
