    \ will also discuss the properties and configuration to implement and set up a\
    \ storm cluster.\n\n## Structure\n\n* Pre-requisites for Apache Storm\n* Verifying\
    \ the pre-requisites\n* Storm Framework installation\n* Setup of a Storm cluster\n\
    * Storm management commands\n\n## Objectives\n\n* Pre-requisites for Apache Storm\n\
    * Download and install Apache Storm\n* Download and install Zookeeper\n* Setting\
    \ up of a Storm cluster\n* Learn the commands used to manage Storm cluster\n\n\
    ## Pre-requisites for Apache Storm\n\nThe pre-requisites for storm are as follows:\n\
    \n* JDK\n* ZooKeeper\n* Python\n\nWe have already installed Java and Zookeeper,\
    \ and therefore, we will only verify its installation:\n\n1. Verifying Java installation\
    \ on our machine. Using the command `java-version`, we can verify the version\
    \ of Java installed in our machines as shown in the following screenshot:\n\n\
    \   ![](images/7.1.jpg)\n\n   **Figure 7.1:** Verify Java Installation\n\n2. The\
    \ steps provided in `[Chapter 2: Installing Kafka]` for the installation of zookeeper\
    \ can be followed.\n\n3. Navigate to the `zookeeper` directory as shown here:\n\
    \n   ![](images/7.2.jpg)\n\n   **Figure 7.2:** Zookeeper directory\n\n4. Start\
    \ the Zookeeper using the command `bin\\zkServer`. The following is the output\
    \ messages displaying the status of the Zookeeper:\n\n   ![](images/7.3.jpg)\n\
    \n   **Figure 7.3:** Zookeeper Started Status in Console\n\n5. Now, start the\
    \ CLI by using the command `bin\\zkCli.cmd`. The message `Welcome to Zookeeper`\
    \ will be displayed as the connection is established with the Zookeeper:\n\n \
    \  ![](images/7.4.jpg)\n   **Figure 7.4:** CLI Messages\n\n6. Install Python.\
    \ Python 2.7 can be installed through the URL: `[https://www.python.org/downloads/windows/]`.\n\
    \n## Storm framework installation\n\nWe will install Apache Storm in our machine.\
    \ The following steps can be followed to install Storm:\n\n1. Source for Apache\
    \ Storm, it can be downloaded from `[http://storm.apache.org/downloads.html]`.\n\
    \n   ![](images/7.5.jpg)\n\n   **Figure 7.5:** Storm software download link\n\n\
    2. Download the software and unzip the file. Unzip the file into a directory where\
    \ you would like to run the storm cluster. This folder will be used to perform\
    \ various configurations and running of the Storm cluster.\n\n## Set up a Storm\
    \ cluster\n\nA Storm cluster can be set up by following these steps:\n\n1. Navigate\
    \ to the storm directory. Open the Command Prompt and using the `cd <<storm path>>`\
    \ command, navigate to the storm directory as shown in the following screenshot:\n\
    \n   ![](images/7.6.jpg)\n\n   **Figure 7.6:** Navigate to Storm Directory\n\n\
    2. Open the `storm.yaml` file inside the `config` folder:\n\n   ![](images/7.7.jpg)\n\
    \n   **Figure 7.7:** Navigate to Storm conf folder\n\n3. Add the properties shown\
    \ in the following screenshot to the `storm.yaml` file:\n\n   ![](images/7.8.jpg)\n\
    \n   **Figure 7.8:** storm.yaml file\n\n   **Properties:**\n\n   `storm.zookeeper.servers:`\n\
    \   `- \" \"`\n\n4. Start the Zookeeper using the command `bin\\zkServer`. The\
    \ following is the output messages displaying the status of the Zookeeper:\n\n\
    \   ![](images/7.3.jpg)\n\n   **Figure 7.3:** Zookeeper Started Status in Console\n\
    \n5. Now, start the CLI by using the command `bin\\zkCli.cmd`. The message `Welcome\
    \ to Zookeeper` will be displayed as the connection is established with the Zookeeper:\n\
    \n   ![](images/7.4.jpg)\n\n   **Figure 7.4:** CLI Messages\n\n6. Install Python.\
    \ Python 2.7 can be installed through the URL: `[https://www.python.org/downloads/windows/]`.\n\
