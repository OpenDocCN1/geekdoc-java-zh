    \n# 执行消费者\n\n应该使用 Kafka 的 Java 实现在 eclipse 中创建一个 `Consumer.java` 类。要执行 Kafka 消费者流转，应执行以下步骤：\n\
    \n1.  导航到 `kafka` 目录。下面的截图显示了导航到 `kafka` 目录：\n\n    ![](img/5.3.jpg)\n\n    **图\
    \ 5.3：** 导航到 Kafka\n\n2.  使用以下命令启动 Zookeeper：\n\n    ```\nbin\\windows\\zookeeper-server-start.bat\
    \ config\\zookeeper.properties\n```\n\n    下面的截图显示了 Zookeeper 的启动：\n\n    ![](img/5.4.jpg)\n\
    \n    **图 5.4：** Zookeeper 启动命令\n\n    如果 Zookeeper 启动成功，将在控制台中看到以下内容：\n\n   \
    \ ![](img/5.5.jpg)\n\n    **图 5.5：** Zookeeper 已启动消息\n\n3.  使用以下命令启动 Kafka 服务：\n\
    \n    ```\nbin\\windows\\kafka-server-start.bat config/server.properties\n```\n\
    \n    使用此命令，可以如下图所示启动服务器：\n\n    ![](img/5.6.jpg)\n\n    **图 5.6：** Kafka 服务启动命令\n\
    \n    一旦 Kafka 服务启动，我们可以在命令提示符中看到 `Started` 消息，如下图所示：\n\n    ![](img/5.7.jpg)\n\
    \n    **图 5.7：** Kafka 服务已启动消息\n\n4.  使用以下命令创建一个 Kafka Topic（主题）：\n\n    ```\n\
    bin\\windows\\kafka-topics.bat --create --zookeeper localhost:2181 --replication-factor\
    \ 1 --partitions 1 --topic Kafka-Topic\n```\n\n    必须创建一个 Kafka Topic 才能发送和接收消息。此处的主题名称为\
    \ `Kafka-Topic`：\n\n    ![](img/5.8.jpg)\n\n    **图 5.8：** 创建 Kafka Topic\n\n\
    5.  运行消费者。消费者可以如下图所示作为 Java 应用程序运行：\n\n    ![](img/5.9.jpg)\n\n    **图 5.9：**\
    \ 运行消费者\n\n    一旦运行消费者，它将在控制台中显示 `Subscribed to topic` 消息，如下所示：\n\n    ![](img/5.10.jpg)\n\
    \n    **图 5.10：** 消费者控制台\n\n6.  运行生产者。现在，我们将运行生产者来生成消息，如下所示：\n\n    ![](img/5.11.jpg)\n\
    \n    **图 5.11：** 运行生产者\n\n    一旦运行生产者，它将在控制台中显示 `All the messages have been sent\
    \ successfully` 消息：\n\n    ![](img/5.12.jpg)\n\n    **图 5.12：** 生产者控制台消息\n\n7.\
    \  查看消费者输出控制台：\n\n    运行生产者后，消费者的控制台将显示被消费的消息。这些与生产者发送的消息相同：\n\n    ![](img/5.13.jpg)\n\
    \n    **图 5.13：** 消费者控制台输出\n\n# 结论\n\n在本节中，我们学习了如何执行消费者并处理消息。在本章中，我们学习了 Kafka\
    \ 消费者以及消费者组是如何形成的。组遵循一种*公平份额*机制，通过该机制，组中的每个成员都可以独占访问一个分区。\n\n我们还理解了消费者组为了管理其成员而遵循的组协调协议。讨论了\
    \ Kafka 消费者的 Java API。这些 API 用于在 Java 中实现 Kafka 消费者。还演示了消费者的执行。\n\n本章旨在建立对 Kafka\
    \ 消费者组件的理解，并将使你能够为你的业务问题实现自定义的消费者。在下一章中，我们将学习 Apache Storm 及其架构、优势和应用。\n\n# 问题\n\
    \n1.  **来自同一个消费者组的多个一个消费者可以读取同一个分区吗？**\n\n    **答：** 否\n\n2.  **当消费者多于分区时，多出的消费者用于什么目的？**\n\
    \n    **答：** 故障转移（Failover）\n\n3.  **`assign()` 方法的作用是什么？**\n\n    **答：** 它手动将分区分配给消费者。\n\
    \n4.  **什么是高水位标记位置（High Watermark location）？**\n\n    **答：** 它是记录复制已经发生的位置。\n\n\
    5.  **`commitAsync()` 方法的作用是什么？**\n\n    **答：** 它提交所有分区的偏移量。\n\n6.  **`enable.auto.commit`\
    \ 代表什么？**\n\n    **答：** 它启用按 `auto.commit.interval.ms` 指定的时间间隔自动提交的过程。\n\n7. \
    \ **使用哪种方法获取消费者记录？**\n\n    **答：** `poll()` 方法\n\n# 第 6 章\n\n# Storm 简介\n\n# 引言\n\
    \n在本章中，将介绍 Apache Storm。它是一个实时处理器。将描述 Storm 和 Kafka 之间的比较。讨论了 Storm 的架构和核心概念。解释了\
    \ Storm 的各种优势。并将简述 Storm 的应用场景。\n\n# 结构\n\n*   Apache Storm 简介\n*   Storm 与 Kafka\
    \ 的比较\n*   结合 Hadoop 的 Storm\n*   Storm 架构\n*   Storm 的优势\n*   应用\n\n# 目标\n\n\
    *   Storm 简介\n*   Storm 与 Kafka 的比较\n*   Storm 与 Hadoop 的比较\n*   Storm 架构概览\n\
    *   理解核心概念\n*   Storm 的优势\n*   应用\n\n# Storm 简介\n\nApache Storm 是一个实时处理系统。它也可以从数据源进行实时数据流处理。由于其设计，它可以处理海量的实时数据。它是开源的，因此可以被中小型企业使用。它易于设置且用户友好，这使其非常适合实时处理开发。它的处理能力类似于\
    \ Hadoop。Storm 的基准是每节点处理百万个元组（tuples）。它的高可靠性保证了数据至少会被处理一次。\n\n# Kafka 与 Storm\
    \ 的比较\n\n虽然 Kafka 和 Storm 都是实时数据处理系统，但目标略有不同。以下是一些区别：\n\n| **Kafka** | **Storm**\
    \ |\n| :--- | :--- |\n| 它用于从数据源读取实时数据流。 | 它读取数据并在数据进行计算并转换。 |\n| 可能会丢失数据，不保证 100%\
    \ 数据安全。 | 它为安全处理数据提供 100% 的保证。 |\n| 它以日志的形式存储在本地文件系统中。 | 它处理并传递给下一个组件；输出可以选择存储在数据库中。\
    \ |\n| 数据直接从原始源读取。 | Storm 可能从其他流应用程序（如 Kafka）读取数据。 |\n| Zookeeper 是 Kafka 运行必需的。\
    \ | Zookeeper 不是必需的。 |\n| Kafka 是容错的，由 Zookeeper 管理。 | Storm 也是容错的，通过守护进程自动重启机制进行自我管理。\
    \ |\n| 由 LinkedIn 开发。 | 由 Twitter 开发。 |\n| 延迟取决于数据源且小于 1-2 秒。 | Storm 的延迟是毫秒级的。\
    \ |\n| 支持多种语言，但在 Java 中效果最好。 | 支持多种语言且在所有语言中表现均良好。 |\n\n**表 6.1：** Kafka 与 Storm\
    \ 比较\n\n通过上述比较，我们可以理解 Kafka 和 Storm 之间的差异特征。\n\n# Hadoop 与 Storm 的比较\n\n"
- fmt: '

    Hadoop and Storm are both used for computation of data. The following are the
    differences between the two:


    | Hadoop | Storm |

    | :--- | :--- |

    | Performs computation of data in batches. | Performs computation for real-time
    streaming of data. |

    | It is master/slave architecture, in the form of jobs and tasks. There may not
    be a Zookeeper to manage the instances. | The architecture is master/slave where
    the master node is called `Nimbus` and the slaves are called `supervisors`. The
    `Zookeeper` is used to manage the cluster. |

    | It stores and maintains the state. | It is stateless. |

    | It contains map/reduce jobs and the execution ends after all the jobs are complete.
    | The cluster runs until the user shuts down the instance. |

    | The processing time of the MapReduce framework can take hours or minutes. |
    The processing of tasks in `storm` takes seconds or milliseconds. |

    | It can be set up easily, but relativ ely complex to operate the cluster. | It
    can be set up easily and used easily. |


    Table 6.2: Hadoop and Storm comparison


    The preceding table illustrates the key differences between Hadoop and Storm.


    ## Core components of Storm


    The following are the components of Storm cluster:


    *   **Nodes**: A `storm` cluster contains two types of nodes, master node and
    worker nodes.

    *   **Nimbus**: The `Nimbus` node is the master in a `Storm` cluster. The `nimbus`
    daemon''s primary responsibility is to manage, coordinate, and monitor topologies
    running on a cluster, including topology deployment, task assignment, and task
    reassignment in the event of a failure. `Nimbus` is stateless and stores all of
    its data in `Zookeeper`.

    *   **Supervisor**: This is the daemon run by the worker nodes. This performs
    that task assigned to it by the master node. A `supervisor` can have more than
    one worker nodes. The `supervisor` allocates the tasks to the worker nodes and
    can have as many resources it needs to successfully complete the tasks. It is
    responsible for creating, starting, and stopping worker processes to execute the
    tasks assigned to that node. Like `Nimbus`, a `supervisor` daemon is also fail-fast
    and stores all of its state in `Zookeeper` so that it can be restarted without
    any state loss.

    *   **Stream**: The stream of data flowing into the topology from the data source
    contains tuples. `Tuple` is the component of the `storm` cluster. This `tuple`
    contains a list of data elements sent by the data source into the `spout`. They
    are the main data structures in `Storm`. They are named lists of varied values
    such as integers, bytes, floots, and byte arrays.

    *   **Spouts**: The input stream from the data source is sent to the `Spout`.
    It reads the data continuously and creates tuples before sending it to a `bolt`.
    It can read from a `Kafka` message queue or database or a file systems, for example.

    *   **Bolts**: `Bolts` are at the heart of all the logic processing in `Storm`;
    the data from the `spout` is sent to the `bolt` for processing. These bolts can
    perform computations on the data. The `bolt` can send the data to another `bolt`
    for further processing or store the output in the database.

    *   **Task**: A `task` means processing the data in some form in the `storm` cluster.
    It can be a `spout` or a `bolt`. Even though the number of components and their
    tasks remain the same in a topology, the executors of these tasks can be changed.
    The executors may increase or decrease depending upon the input load given to
    the `bolt` to process. By default, `Storm` will run one task in one thread.

    *   **Topologies**: A `storm` topology contains the components of `storm`, which
    are the `spout` and `bolts`. It is a network formed by several spouts and bolts.
    Every component will process the data and send its output to the connect components;
    therefore, it is an interconnected network of spouts and bolts organized to meet
    a goal.

    *   **Zookeeper**: The `storm` cluster states are maintained by the `Zookeeper`.
    The daemons are stateless in `storm`. When there is a failure in the master or
    slave nodes, they will be restarted.


    ## Apache Storm architecture


    The architecture of `Storm` consists of spots and bolts. The input data will be
    read by `spouts`. There may be many spouts reading from different data sources.
    The `Bolts` will process the output data tuples from the `spout`. The bolts can
    be sending its output to another `bolt` for more computations. In the end, the
    results can be stored in the database or any persistent storage:


    ![](images/6.1.jpg)


    Figure 6.1: Apache Storm Architecture


    The above figure illustrates the interactions between several spouts and bolts.
    It is a simple topology.


    ## Benefits of Storm


    The benefits of `Storm` are the following:


    *   **Reliable**: It comes with high reliability as it spots failures quickly
    and processes every tuple/data at least once by replacing the failed worker nodes
    immediately. During a failure, the processing of data may occur more than once,
    but the data will never be left unattended.

    *   **Fault-tolerant**: If any worker node fails, the tasks will be reallocated
    to a new node for processing, and therefore makes it highly fault tolerant.

    *   **Open source**: Since the software is open source, it is easier to download
    and implement the components that we require to develop a real-time distributed
    processor. It is also user friendly with the examples and documentation that it
    provides to kick starts a development.

    *   **Speed**: The processing of data is extremely fast in `Storm`. It can generate
    results in seconds. This is one of the key features of the design of the `Storm`''s
    components.

    *   **Scalability**: `Storm` components are scalable by adding more resources
    or machines and allocating tasks to multiple machines. Therefore, it make is easy
    to scale the processing and computation performed by the bolts as the input load
    increases.

    *   **Ease of development**: Developing real-time streaming and processing applications
    are very time consuming. Using Apache `Storm`, it is quite easy to build a real-time
    distributed application for our purpose.

    *   **Supports multiple programming languages**: `Storm` supports any programming
    language the wrapper library can be implemented and integrated with `Storm` APIs.

    *   Supports real-time streaming of data


    ## Applications of Storm


    `Storm` has application in both streaming and computational areas; the following
    are some of its applications:


    *   Real-time analytics

    *   Online machine learning

    *   Continuous computation

    *   Distributed RPC

    *   ETL


    Some of the companies that use Storm processing are:


    *   **Spotify**: Here music streaming is available, and `storm` is used to perform
    various analytics on them.

    *   **Twitter**: To process every tweet for analytics in a range of applications
    such as discovery, real-time analytics, personalization, search, revenue optimization,
    `Storm` is used. It integrates with the rest of Twitter''s infrastructure, including
    database systems (Cassandra, Memcached, and so on), the messaging infrastructure,
    Mesos, and the monitoring/alerting systems.

    *   **Groupon**: `Storm` is used to analyze, clean, normalize large amounts of
    data.

    *   **Yahoo**: `Storm` is used to process user events, content feeds and application
    logs.

    *   **Taobao**: Here, `Storm` is used to generate statistics of logs in real time.

    *   **Alibaba**: Here, `Storm` is used to process application logs to supply real-time
    statistics of their applications.


    ## Conclusion


    In this chapter, we understood Storm''s architecture and its components. We learnt
    the differences between storm, Hadoop and Kafka. The benefits of using storm were
    illustrated. The applications of storm and some of the companies using storm was
    described.

