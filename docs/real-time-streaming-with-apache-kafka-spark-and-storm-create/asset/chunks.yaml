  trans: "\n\n*   **同步发送**：在这种方法中，我们将发送消息并等待确认。使用 `get()` 方法来获取确认，以确定消息是否发送成功。\n\n\
    \    语法如下：\n\n```java\n//Create a message\nProducerRecord<String, String>kafkaMessageContent=\
    \ new ProducerRecord<String, String>(\"Kafka topic name\", kafka_key, kafka_message);\n\
    \n//Send the message\nproducer.send(kafkaMessageContent).get();\n```\n\n*   **异步发送**：在这种方法下，调用\
    \ `send` 方法的同时会传入一个 `callback` 回调函数。该 `callback` 函数在消息成功发送后被调用：\n\n```java\n//Create\
    \ a call back class\nCallBackClasscallbackFunction = new CallBackClass();\n\n\
    //Create the message\nProducerRecord<String, String>kafkaMessageContent= new ProducerRecord<String,\
    \ String>(\"Kafka topic name\", kafka_key, kafka_message);\n\n//Send the message\n\
    producer.send(kafkaMessageContent, callbackFunction);\n\nprivate static class\
    \ CallBackClass implements Callback {\n  public void onCompletion(RecordMetadatarecordMetadata,\
    \ Exception e) {\n    if (e != null) {\n      System.out.println(\"Error while\
    \ producing message to topic :\" + recordMetadata);\n      e.printStackTrace();\n\
    \    } else {\n      String message = String.format(\"Message sent to topic:%s\
    \ partition:%s offset:%s\", recordMetadata.topic(), recordMetadata.partition(),\
    \ recordMetadata.offset());\n      System.out.println(message);\n    }\n  }\n\
    }\n```\n\n根据使用生产者的应用程序，将使用上述类型中的任何一种。\n\n# 确认类型 (Types of acknowledgments)\n\n\
    发送到发布者的消息需要被确认。三种确认。根据提供的确认类型，发布者将等待代理（broker）的确认：\n\n| 类型 | 描述 |\n| :--- | :---\
    \ |\n| `Acknowledgement = 0` | 在这种情况下不会发送确认。生产者不需要等待。 |\n| `Acknowledgement =\
    \ 1` | 在这种情况下，由领导（leader）发送确认。副本（replicas）不需要发送确认。 |\n| `Acknowledgement = all`\
    \ | 在这种情况下，代理将检查所有副本是否都已收到发送的消息。当所有副本都收到后，代理将发送确认。 |\n\n**表 4.2：** 确认类型\n\n选择的确认类型取决于系统的设计。\n\
    \n# Kafka 生产者的应用\n\n*   **监控网站活动**：在电子商务平台上，它可以用于处理发生的交易。生产者将发送属于客户执行的购买交易的数据。\n\
    *   **消息传递**：当我们从一个系统发送消息到另一个系统时，这些消息需要被处理；可以使用生产者将它们分组到主题中并相应地发送进行处理。\n*   **日志聚合**：来自\
    \ Web 服务器、数据库系统、服务器日志等各种应用程序生成日志。Kafka 生产者可以用于收集各种应用程序的日志并发送进行消费。\n*   **ETL**：Kafka\
    \ Connect 可读取数据库并将其分组到 Kafka 主题中；这些可以作为数据流产生，用于低延迟处理。\n*   **Twitter 情感分析应用**：当人们发布推文时，生产者可以将这些消息发送到集群。消费者将读取这些消息并将其发送到应用程序以处理推文中的情感。\n\
    *   **欺诈检测系统**：在在线商店中，我们可以将交易（例如客户购买的产品）作为数据由 Kafka 生产者产生。稍后，消费者可以处理这些数据以判断交易是否为欺诈。\n\
    \n上述应用是 Kafka 生产者经常使用的用例。因此，在实时问题解决和架构任何我们遇到的类似用例时，也可以使用 Kafka。\n\n# 结论\n\n在本章中，我们学习了使用\
    \ Kafka 的生产者。介绍了 Java 中 Kafka 消费者的实现。使用生产者的 API 包含了 `send()`。本章通过 Java 实现了 Kafka\
    \ 消费者的实现。展示了发送 Kafka 消息的三种方式。展示了 Kafka 的确认类型。列出了 Kafka 生产者的应用。目标是能够实现 Kafka 消费者\
    \ Java。\n\n在下一章节中，我们将详细介绍 Kafka 消费者的实现。\n\n# 问题\n\n1.  **哪个 API 用于创建生产者？**\n2.\
    \  **生产者可以被多个实例共享吗？生产者是线程安全的吗？**\n3.  **以下哪种发送消息的方法不接收确认？**\n    - 忘记\n    - 异步\n\
    \    - 默认\n4.  **哪种确认类型会等待所有副本收到消息？**\n    - Acknowledgement=1\n    - Acknowledgement\
    \ =0\n    - Acknowledgement = all\n5.  **以下哪项不是 Kafka 生产者的应用？**\n    - 预测系统\n\
    \    - ETL\n    - 情感分析\n    - 消息传递\n6.  **哪个 API 用于实现 ETL 应用？**\n7.  **在异步发送方法中，哪个函数在消息发送后调用？**\n\
    \n# 回答\n\n1.  `KafkaProducer()`\n2.  是的。\n3.  异步发送\n4.  `Acknowledgement =all`\n\
    5.  预测系统\n6.  `Connect API`\n7.  `callback`\n\n"
- fmt: "A topic in Kafka is written to multiple logs called `partitions`. The producers\
    \ write to these logs at the end of each partition, while the consumer can consume\
    \ from these logs at their own speed. The messages are read in a sequential manner\
    \ from these partitions.\n\nThe reason behind distributing the read from different\
    \ partition is to scale consumption of the data by the consumers. In the `[figure\
    \ 5.1](#c05.xhtml_fig5_1)*`, `Topic A` is stored in three partitions. The topic\
    \ has two consumers, `Consumer 1` and `Consumer 2`. They constitute a consumer\
    \ group. Each partition is assigned to a consumer for reading.\n\nEach consumer\
    \ in a consumer group will get an exclusive fair share of partitions. Within a\
    \ consumer group, there will not be more than one consumer reading from a partition.\
    \ Each group gets to read a partition via one of its consumers. This is the manner\
    \ in which load balancing is performing for the consumer groups.\n\nIf the number\
    \ of partitions is less than the number of consumer groups, then some of the consumer\
    \ groups will remain idle and will be used during a failover. If there are more\
    \ partitions than the consumer groups, few consumer groups may read from more\
    \ than one partition.\n\nEach consumer group has its own offset for every partition.\
    \ This offset can be different from the other consumer groups:\n\nConsumer 2\n\
    \n![](images/5.1.jpg)\n\n**Figure 5.1:** Consumer groups\n\nIn this section, we\
    \ have learnt about the consumer groups and how they are load balanced while reading\
    \ from partitions. We will see the protocol that is followed by the groups in\
    \ the next section.\n\n# Group coordination protocol](#toc.xhtml_s61a)\n\nWhen\
    \ a consumer group is created, the consumers within the groups needs to be managed.\
    \ The group coordination protocol is used to manage the consumers. Each group\
    \ has a designated broker, which is assigned as a group coordinator. This coordinator\
    \ is responsible for managing the state of the group. The responsibilities of\
    \ the coordinator are as follows:\n\n* Assigning log partitions to consumers for\
    \ reading\n* If a new consumer is added then allocation of a partition to it.\n\
    * When an existing consumer leaves, managing the state of the group.\n* If a topic\
    \ changes, assigning the partitions accordingly.\n\nWhen the read operation occurs,\
    \ it is sequential within a partition. After reading few records the consumer\
    \ may commit the already read records.\n\nThe `[figure 5.2](#c05.xhtml_fig5_2)`\
    \ shows a typical partition log with positions. In the `[figure 5.2](#c05.xhtml_fig5_2)`\
    \ the `Last Committed Offset` is the location until which the records read has\
    \ been committed by the consumer. The consumer then continues to read up to position\
    \ 4, which is its current reading point.\n\nAt this stage, failure happens and\
    \ the consumer is replaced by a new consumer, the new consumer needs to read from\
    \ offset 2, which is the previously saved record. The in-between read of records\
    \ at positions 2 and 4 will need to be read again.\n\nThe records are also copied\
    \ to other partitions as part of the replication process for high availability\
    \ of the data. Therefore, the position of the records that are already saved to\
    \ other log partitions is the high watermark point. The consumers can read until\
    \ this point safely, beyond which if the consumer reads, there is a possibility\
    \ that if the records are lost, then there is no replica of it elsewhere:\n\n\
    ![](images/5.2.jpg)\n\n**Figure 5.2:** Consumer log and its offsets\n\nTherefore,\
    \ using this protocol, the consumers are able to coordinate and access the data\
    \ with high availability.\n\n# API for Kafka consumer](#toc.xhtml_s62a)\n\nJava\
    \ provides many functions for the implementation of Kafka consumers. The following\
    \ are the APIs used for performing its activities:\n\n| Sr No | Method | Description\
    \ |\n| :--- | :--- | :--- |\n| 1 | `void assign(Collection<TopicPartition> partitions)`\
    \ | Partitions can be manually assigned to the consumer. |\n| 2 | `Set<TopicPartition>assignment()`\
    \ | Fetch the partitions currently assigned to the consumer. |\n| 3 | `void commitAsync()`\
    \ | For the offsets returned by the `poll` command, commit the offset for the\
    \ list of topics and partitions. |\n| 4 | `Map<String,List<PartitionInfo>>listTics()`\
    \ | List the metadata about the partitions for all topics. |\n| 5 | `java.util.Map<MetricName,?\
    \ extends Metric> Metrics()` | This returns the metrics that is present for each\
    \ consumer. |\n| 6 | `ConsumerRecords<K,V>poll(Duration timeout)` | Fetch data\
    \ for the subscribed topics or partitions. |\n| 7 | `void subscribe(Collection<String>\
    \ topics)` | Subscribe to the given list of topics. |\n| 8 | `void Close()` |\
    \ This method will close the consumer. |\n| 9 | `Set<String>subscription()` |\
    \ Fetch the current subscription. |\n| 10 | `void unsubscribe()` | Unsubscribe\
    \ from topics that are currently subscribed to. |\n\n**Table 5.1:** Kafka consumer\
    \ API\n\nIn this section, we got a brief overview of the set of APIs that are\
    \ used by the Kafka consumer.\n\n# Consumer implementation in Java](#toc.xhtml_s63a)\n\
    \nThe following is the Java implementation of Kafka consumer:\n\n```java\nimport\
    \ java.util.Properties;\nimport java.util.Arrays;\nimport org.apache.kafka.clients.consumer.KafkaConsumer;\n\
    import org.apache.kafka.clients.consumer.ConsumerRecords;\nimport org.apache.kafka.clients.consumer.ConsumerRecord;\n\
    \npublic class Consumer {\n    public static void main(String[] args) throws Exception\
    \ {\n        //Kafka configuration settings\n        String topicName=\"Kafka-Topic\"\
    ;\n        Properties props = new Properties();\n        //Kafka consumer settings\n\
    \        props.put(\"bootstrap.servers\", \"localhost:9092\");\n        //This\
    \ is the group the consumer belongs to\n        props.put(\"group.id\", \"kafkroup\"\
    );\n        //offsets are committed automatically with a frequency given by auto.commit.ms.\n\
    \        props.put(\"enable.auto.commit\", \"true\");\n        // auto.commit.ms\
    \ is the interval at which data is committed\n        props.put(\"auto.commit.ms\"\
    , \"1000\");\n        //duration of time out\n        props.put(\"session.timeout.ms\"\
    , \"30000\");\n        props.put(\"key.deserializer\", \"org.apache.kafka.clients.serialization.StringDeserializer\"\
    );\n        props.put(\"value.deserializer\", \"org.apache.kafka.clients.serialization.StringDeserializer\"\
    );\n        //Creating a consumer instance\n        KafkaConsumer<String, String>consumer\
    \ = new KafkaConsumer<String, String>(props);\n        //Kafka Consumer subscribes\
    \ to the list of topics here.\n        consumer.subscribe(Arrays.asList(topicName));\n\
    \        //print the topic name\n        System.out.println(\"Subscribing to the\
    \ topic \" + topicName);\n        while (true) {\n            //Poll every 10\
    \ records\n            ConsumerRecords<String, String>records = consumer.poll(10);\n\
    \            //Iterate the polled records\n            for (ConsumerRecord<String,\
    \ String>record : records) {\n                // print the offset, key and value\
    \ for the received consumer records.\n                System.out.printf(\"offset\
    \ is %d, key is %s, value is %s\\n\",\n                record.offset(), record.key(),\
    \ record.value());\n            }\n        }\n    }\n}\n```\n"
  raw: 'A topic in Kafka is written to multiple logs called **partitions**. The producers
    write to these logs at the end of each partition, while the consumer can consume
    from these logs at their own speed. The messages are read in a sequential manner
    from these partitions.


    The reason behind distributing the read from different partition is to scale consumption
    of the data by the consumers. In the *[figure 5.1](#c05.xhtml_fig5_1)*, **Topic
    A** is stored in three partitions. The topic has two consumers, **Consumer 1**
    and **Consumer 2**. They constitute a consumer group. Each partition is assigned
    to a consumer for reading.


    Each consumer in a consumer group will get an exclusive fair share of partitions.
    Within a consumer group, there will not be more than one consumer reading from
    a partition. Each group gets to read a partition via one of its consumers. This
    is the manner in which load balancing is performing for the consumer groups.


    If the number of partitions is less than the number of consumer groups, then some
    of the consumer groups will remain idle and will be used during a failover. If
    there are more partitions than the consumer groups, few consumer groups may read
    from more than one partition.


    Each consumer group has its own offset for every partition. This offset can be
    different from the other consumer groups:


    Consumer 2


    ![](images/5.1.jpg)


    **Figure 5.1:** Consumer groups


    In this section, we have learnt about the consumer groups and how they are load
    balanced while reading from partitions. We will see the protocol that is followed
    by the groups in the next section.


    # [Group coordination protocol](#toc.xhtml_s61a)


    When a consumer group is created, the consumers within the groups needs to be
    managed. The group coordination protocol is used to manage the consumers. Each
    group has a designated broker, which is assigned as a group coordinator. This
    coordinator is responsible for managing the state of the group. The responsibilities
    of the coordinator are as follows:


    *   Assigning log partitions to consumers for reading


    *   If a new consumer is added then allocation of a partition to it.


    *   When an existing consumer leaves, managing the state of the group.


    *   If a topic changes, assigning the partitions accordingly.


    When the read operation occurs, it is sequential within a partition. After reading
    few records the consumer may commit the already read records.


    The *[figure 5.2](#c05.xhtml_fig5_2)* shows a typical partition log with positions.
    In the *[figure 5.2](#c05.xhtml_fig5_2)* the **Last Committed Offset** is the
    location until which the records read has been committed by the consumer. The
    consumer then continues to read up to position 4, which is its current reading
    point.


    At this stage, failure happens and the consumer is replaced by a new consumer,
    the new consumer needs to read from offset 2, which is the previously saved record.
    The in-between read of records at positions 2 and 4 will need to be read again.


    The records are also copied to other partitions as part of the replication process
    for high availability of the data. Therefore, the position of the records that
    are already saved to other log partitions is the high watermark point. The consumers
    can read until this point safely, beyond which if the consumer reads, there is
    a possibility that if the records are lost, then there is no replica of it elsewhere:


    ![](images/5.2.jpg)


    **Figure 5.2:** Consumer log and its offsets


    Therefore, using this protocol, the consumers are able to coordinate and access
    the data with high availability.


    # [API for Kafka consumer](#toc.xhtml_s62a)


    Java provides many functions for the implementation of Kafka consumers. The following
    are the APIs used for performing its activities:


    | **Sr No** | **Method** | **Description** |


    | 1 | **`void assign(Collection<TopicPartition> partitions)`** | Partitions can
    be manually assigned to the consumer. |


    | 2 | **`Set<TopicPartition>assignment()`** | Fetch the partitions currently assigned
    to the consumer. |


    | 3 | **`void commitAsync()`** | For the offsets returned by the poll command,
    commit the offset for the list of topics and partitions. |


    | 4 | `Map<String,List<PartitionInfo>>listT opics()` | List the metadata about
    the partitions for all topics. |


    | 5 | **`java.util.Map<`**`MetricName,?` **`extends`** `Metric>` **`Metrics()`**
    | This returns the metrics that is present for each consumer. |


    | 6 | `ConsumerRecords<K,V>poll(Duration` **`timeout`**`)` | Fetch data for the
    subscribed topics or partitions. |


    | 7 | **`void`** `subscribe(Collection<String>` **`topics`**`)` | Subscribe to
    the given list of topics. |


    | 8 | **`void Close()`** | This method will close the consumer. |


    | 9 | `Set<String>subscription()` | Fetch the current subscription. |


    | 10 | **`void`** `unsubscribe()` | Unsubscribe from topics that are currently
    subscribed to. |


    **Table 5.1:** Kafka consumer API


    In this section, we got a brief overview of the set of APIs that are used by the
    Kafka consumer.


    # [Consumer implementation in Java](#toc.xhtml_s63a)


    The following is the Java implementation of Kafka consumer:


    `import java.util.Properties;`


    `import java.util.Arrays;`


    `import org.apache.kafka.clients.consumer.KafkaConsumer;`


    `import org.apache.kafka.clients.consumer.ConsumerRecords;`


    `import org.apache.kafka.clients.consumer.ConsumerRecord;`


    `public class Consumer {`


    `public static void main(String[] args) throws Exception {`


    `//Kafka consumer configuration settings`


    `String topicName="Kafka-Topic";`


    `Properties props = new Properties();`


    `props.put("bootstrap.servers", "localhost:9092");`


    `//This is the consumer group the consumer belongs to`


    `props.put("group.id", "kafkagroup");`


    `//offsets are committed automatically with a frequency given by the config auto.commit.interval.ms.`


    `props.put("enable.auto.commit", "true");`


    `// auto.commit.interval.ms is the interval at which data is committed`


    `props.put("auto.commit.interval.ms", "1000");`


    `//duration of time out in milliseconds`


    `props.put("session.timeout.ms", "30000");`


    `props.put("key.deserializer",`


    `"org.apache.kafka.common.serialization.StringDeserializer");`


    `props.put("value.deserializer",`


    `"org.apache.kafka.common.serialization.StringDeserializer");`


    `//Creating a consumer instance`


    `KafkaConsumer<String, String>consumer = new KafkaConsumer <String, String>(props);`


    `//Kafka Consumer subscribes to the list of topics here.`


    `consumer.subscribe(Arrays.asList(topicName));`


    `//print the topic name`


    `System.out.println("Subscribing to the topic " + topicName);`


    `while (true) {`


    `//Poll every 10 records`


    `ConsumerRecords<String, String>records = consumer.poll(10);`


    `//Iterate the polled records`


    `for (ConsumerRecord<String, String>record : records)`


    `// print the offset, key and value for the received consumer records.`


    `System.out.printf("offset is %d, key is %s, value is %s\n",`


    `record.offset(), record.key(), record.value());`


    `}`


    `}`


    `}`


    The implementation of a Kafka consumer contains configuring parameters to set
    up in the environment in which it executes. The following are the key properties
    of the consumer:


    *   The **`KafkaConsumer`** class is a Kafka client; it consumes messages from
    the Kafka cluster.


    *   The **`KafkaConsumer`** class is not threadsafe.


    *   It connects with the brokers using TCP Connections.


    *   If the **`Consumer`** is not closed, this will leak the connections.


    *   The consumer has the offset of each record being read. For example, offset
    of 30 means that the previous 0-29 records have been read already by the consumer.


    *   A group of consumers can load balance the consumption of records from a topic.
    This is specified by **`group.idproperty`**.


    *   The consumer reads messages in the form of **`<key,value>`** pairs.


    *   The **`enable.auto.commit`** will commit the data periodically (this interval
    is specified by **`auto.commit.interval.ms`**.'
