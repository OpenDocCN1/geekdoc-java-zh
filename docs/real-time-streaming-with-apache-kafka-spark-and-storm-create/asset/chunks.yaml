    \ will be considered dead and the partitions it is reading will be reassigned.\n\
    \n# Executing the consumer\n\nThe Java implementation of Kafka should be used\
    \ to create a `Consumer.java` class in eclipse. To execute the Kafka consumer\
    \ flow, the following steps should be performed:\n\n1.  Navigate to the `kafka`\
    \ directory. The following screenshot shows the navigation to the `kafka` directory:\n\
    \n    ![](images/5.3.jpg)\n\n    **Figure 5.3:** Navigate to Kafka\n\n2.  Start\
    \ the Zookeeper using the following command:\n\n    ```\nbin\\windows\\zookeeper-server-start.bat\
    \ config\\zookeeper.properties\n```\n\n    The following screenshot shows the\
    \ starting of the Zookeeper:\n\n    ![](images/5.4.jpg)\n\n    **Figure 5.4:**\
    \ Zookeeper start command\n\n    If the Zookeeper starts successfully, the following\
    \ will be seen in the console:\n\n    ![](images/5.5.jpg)\n\n    **Figure 5.5:**\
    \ Zookeeper started message\n\n3.  Start the Kafka server using the following\
    \ command:\n\n    ```\nbin\\windows\\kafka-server-start.bat config/server.properties\n\
    ```\n\n    Using this command, the server can be started as shown in the following\
    \ screenshot:\n\n    ![](images/5.6.jpg)\n\n    **Figure 5.6:** Kafka Server Start\
    \ Command\n\n    Once the Kafka server has been started, we can see the `Started`\
    \ message in the Command Prompt as shown in the following screenshot:\n\n    ![](images/5.7.jpg)\n\
    \n    **Figure 5.7:** Kafka Server Started Message\n\n4.  Create a Kafka Topic\
    \ using the following command:\n\n    ```\nbin\\windows\\kafka-topics.bat --create\
    \ --zookeeper localhost:2181 --replication-factor 1 --partitions 1 --topic Kafka-Topic\n\
    ```\n\n    A Kafka topic has to be created to be able to send and receive messages.\
    \ The topic name here is `Kafka-Topic`:\n\n    ![](images/5.8.jpg)\n\n    **Figure\
    \ 5.8:** Creating a Kafka Topic\n\n5.  Run the consumer. The consumer can be run\
    \ as a Java Application as shown in the following screenshot:\n\n    ![](images/5.9.jpg)\n\
    \n    **Figure 5.9:** Running the Consumer\n\n    Once the consumer is run, it\
    \ will display the `Subscribed to topic` message in its console as shown in the\
    \ following screenshot:\n\n    ![](images/5.10.jpg)\n\n    **Figure 5.10:** Consumer\
    \ console\n\n6.  Run the producer. Now, we will run the producer to generate the\
    \ messages as shown in the following screenshot:\n\n    ![](images/5.11.jpg)\n\
    \n    **Figure 5.11:** Running the producer\n\n    Once the producer is run, it\
    \ will display the `All the messages have been sent successfully` message in the\
    \ console:\n\n    ![](images/5.12.jpg)\n\n    **Figure 5.12:** Producer Console\
    \ Message\n\n7.  View the consumer output console:\n\n    After the producer is\
    \ run, the consumer's console will show the messages consumed. These are the same\
    \ messages sent by the producer:\n\n    ![](images/5.13.jpg)\n\n    **Figure 5.13:**\
    \ Consumer Console Output\n\n# Conclusion\n\nIn this section, we learnt how to\
    \ execute a consumer and process the messages. In this chapter, we have learnt\
    \ about Kafka consumers and how the consumer groups are formed. The groups follow\
    \ a *fair share* mechanism using which each of the group member gets to access\
    \ a partition exclusively.\n\nWe also understood the group coordination protocol\
    \ followed by the consumer groups to manage their group members. The Java APIs\
    \ of Kafka consumer was discussed. These API's are used in the implementation\
    \ of the Kafka consumer in Java. The execution of the consumer is also seen.\n\
    \nThis chapter aims to create an understanding of the Kafka consumer's components\
    \ and will enable you to implement a customized consumer for your business problem.\
    \ In the next chapter, we will learn the about Apache Storm, its architecture,\
    \ its advantages and applications.\n\n# Questions\n\n1.  **Can more than one consumer\
    \ from a consumer group read from the same partition?**\n\n    **Ans:** No\n\n\
    2.  **When there are more consumers than partitions, what are the extra consumer\
    \ used for?**\n\n    **Ans:** Failover\n\n3.  **What does the `assign()` method\
    \ do?**\n\n    **Ans:** It allocates the partitions manually to a consumer.\n\n\
    4.  **What is a High Watermark location?**\n\n    **Ans:** It is the position\
    \ until which the replication of the records has occurred.\n\n5.  **What does\
    \ the `commitAsync()` method do?**\n\n    **Ans:** It commits the offset for all\
    \ the partitions.\n\n6.  **What does the `enable.auto.commit` signify?**\n\n \
    \   **Ans:** It enables the process of committing automatically at a regular interval\
    \ specified by `auto.commit.interval.ms`.\n\n7.  **Which method is used to fetch\
    \ the consumer records?**\n\n    **Ans:** The `poll()` method\n\n# CHAPTER 6\n\
    \n# Introduction to Storm\n\n# Introduction\n\nIn this chapter, Apache Storm will\
    \ be introduced. It is a real-time processor. The comparison between Storm and\
    \ Kafka will be described. The architecture and core concepts of Storm are discussed.\
    \ The various benefits of Storm are explained. The applications in which Storm\
    \ is used will be briefed.\n\n# Structure\n\n*   Introduction to Apache Storm\n\
    *   Comparison of Storm and Kafka\n*   Storm with Hadoop\n*   Storm architecture\n\
    *   Benefits of Storm\n*   Applications\n\n# Objectives\n\n*   Introduction to\
    \ Storm\n*   Comparing Storm with Kafka\n*   Comparing Storm with Hadoop\n*  \
    \ Overview of Storm architecture\n*   Understanding the core concepts\n*   Benefits\
    \ of Storm\n*   Applications\n\n# Introduction to Apache Storm\n\nApache Storm\
    \ is a real-time distributed data processing system. It can also perform real\
    \ time streaming of data from its source. It can process real-time data with immense\
    \ amount of speed due to its design. It is open source; therefore, it can be used\
    \ by small and larger enterprises. It is easy to set up and user friendly, which\
    \ makes it ideal for quick development of real-time processing. Its processing\
    \ capability is like that of Hadoop. The benchmark of storm is over a million\
    \ tuples processed per node. Its high reliability guarantees that every data will\
    \ be processed at least once.\n\n# Comparison of Kafka and Storm\n\nWhile Kafka\
    \ and storm are real-time data processing systems, their goal is slightly different.\
    \ The following are some key differences:\n\n| **Kafka** | **Storm** |\n| :---\
    \ | :--- |\n| It is used to reading real-time streams of data from its source.\
    \ | It read data and performs computation on the data and transforms the data.\
    \ |\n| Data loss may happen, 100% data security is not guaranteed. | It provides\
    \ 100% guarantee for the data being processed securely. |\n| It stores the data\
    \ in the form of logs in the local filesystem. | It processes and passes the data\
    \ to the next component; the output may be chosen to store in database. |\n| The\
    \ data is directly read from its raw source. | Storm may read the data from other\
    \ streaming applications such as Kafka. |\n| Zookeeper is mandatory for Kafka\
    \ to work. | Zookeeper is not mandatory. |\n| Kafka is fault tolerant; it is managed\
    \ by the Zookeeper. | Storm is also fault tolerant and it is managed by itself\
    \ through the mechanism of auto restart of its daemons. |\n| Developed by LinkedIn.\
    \ | Developed by Twitter. |\n| Latency depends on data source and is less than\
    \ 1-2 seconds. | Storm's latency is in milliseconds. |\n| Supports multiple languages,\
    \ but works best in Java. | Supports multiple languages and performs equally well\
    \ in all languages. |\n\n**Table 6.1:** Kafka versus Storm comparison\n\nThrough\
    \ the above comparison, we can understand the key characteristics that vary between\
    \ Kafka and Storm.\n\n# Comparison of Hadoop and Storm\n"
