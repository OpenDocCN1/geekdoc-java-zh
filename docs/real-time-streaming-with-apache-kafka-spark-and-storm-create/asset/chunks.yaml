    \ command:\n\n    **`setx path \"%PATH%;C:\\kafka\\zookeepr-3.4.14\\bin\"`**\n\
    \n    ![](images/2.15.jpg)\n\n    **Figure 2.15:** Set Zookeeper path\n\nIn this\
    \ section, we have learnt to install Zookeeper. The configuration for setting\
    \ up the Zookeeper was seen in detail.\n\n# [Running Zookeeper](#toc.xhtml_s19a)\n\
    \nThis section will introduce the commands required to run the Zookeeper. While\
    \ running the zookeeper, the configuration file is read and the Zookeeper is initiated\
    \ using the inputs provided in the configuration file. The following steps will\
    \ provide details on starting the zookeeper:\n\n1.  Press *Windows* + *R*, type\
    \ **`cmd`** in the Run Prompt:\n\n    **`cd C:\\kafka\\zookeeper-3.4.14\\bin`**\n\
    \n    ![](images/2.16.jpg)\n\n    **Figure 2.16:** Running the Zookeeper\n\n2.\
    \  Type **`zkserver`**:\n\n    ![](images/2.17.jpg)\n\n    **Figure 2.17:** Starting\
    \ the Zookeeper\n\n    It will bind to the port in the configuration file as shown\
    \ in the following screenshot:\n\n    ![](images/2.18.jpg)\n\n    **Figure 2.18:**\
    \ Output of the Zookeeper instance\n\nIn this section, we have seen how to install\
    \ Zookeeper and test the installation by starting the Zookeeper. The configuration\
    \ parameters are very important, and the instructions must be following accurately\
    \ to set it up in the **`config`** file.\n\n# [Configurable parameters in Zookeeper](#toc.xhtml_s20a)\n\
    \nThere are several parameters that are configurable for the Zookeeper instance\
    \ such as the client port, data directory, server address, etc. When we start\
    \ the Zookeeper, the input to these parameters are read and used. The following\
    \ are some of the parameters that the zookeeper **`config`** file uses:\n\n| **S\
    \ no.** | **Parameters** | **Description** |\n\n| 1 | **`dataDir`** | The database\
    \ snapshots are stored by the Zookeeper in this directory. The log of any updates\
    \ to the database is also here if specified. |\n\n| 2 | **`clientPort`** | The\
    \ port to which the clients can connect to. |\n\n| 3 | **`tickTime`** | The duration\
    \ of a tick, this is a unit which is used by zookeeper for specifying time intervals,\
    \ etc. |\n\n| 4 | **`initTime`** | The time duration in ticks for which the followers\
    \ are given to connect to the leader.This depends on the data in the Zookeeper\
    \ as well; the larger the data, the more the time needed for initiation. |\n\n\
    | 5 | **`syncLimit`** | The time duration in ticks needed for the client to sync\
    \ with the Zookeeper. |\n\n| 6 | **`server.x=`**`[name]: port1 [:port2]` | A zookeeper\
    \ contains multiple servers; this is specified by the ID or the server number\
    \ (`x` in the parameter): \n\n*   Name is the hostname of the server.\n\n*   Port\
    \ 1 is the port used to connect to the leader.\n\n*   Port 2 is the port used\
    \ for electing the leader.\n\n |\n\n| 7 | **`dataLogDir`** | This path can be\
    \ used to write the logs related to the update of the transactions performed on\
    \ the database. |\n\n**Table 2.1:** Configuration parameters of the Zookeeper\n\
    \nThe preceding table consists of important parameters for the Zookeeper; it can\
