    # [Answers](#toc.xhtml_s123a)\n\n1.  DStreams\n\n2.  Yes\n\n3.  Yes\n\n4.  Yes\n\
    \n5.  get()\n\n# [CHAPTER 11](#toc.xhtml_c11)\n\n# [Kafka Integration with Spark](#toc.xhtml_c11)\n\
    \n# [Introduction](#toc.xhtml_s124a)\n\nIn this chapter, we will learn the integration\
    \ of Kafka and Spark. Kafka can be integrated in various methods with Spark streaming.\
    \ We will learn the structured streaming integration of Kafka with Spark. We will\
    \ also learn the implementation of the Kafka and Spark APIs, which support Spark\
    \ streaming to read data from Kafka streams.\n\n# [Structure](#toc.xhtml_s125a)\n\
    \nThe structure of the chapter is as follows:\n\n*   Kafka and Spark integration\n\
    \n*   Approaches of integration of Kafka and Spark\n\n*   Structured streaming\
    \ integration of Kafka and Spark\n\n*   Implementation of Kafka and Spark Streaming\n\
    \n# [Objectives](#toc.xhtml_s126a)\n\nThe objectives of the chapter are:\n\n*\
    \   Understanding the concepts of integration of Apache Kafka and Spark\n\n* \
    \  Learning the different approaches of the integration\n\n*   Learning about\
    \ the structured streaming integration of Kafka\n\n*   Understanding the implementation\
    \ of Kafka and Spark Streaming\n\n# [Kafka and Spark integration](#toc.xhtml_s127a)\n\
    \nApache Kafka can be integrated with Spark streaming where the Spark streaming\
    \ receives the data from Kafka. There are two approaches in which the integration\
    \ can be performed:\n\n*   Receiver-based approach\n\n*   Direct approach\n\n\
    As shown in the following diagram, the Kafka Stream can send the data to the Spark\
    \ streaming component. The Spark engine can perform any computation that is needed\
    \ on the data. The processed data will be stored in the database:\n\n![](images/11.1.jpg)\n\
    \n**Figure 11.1:** Kafka and Spark integration\n\nThere is also a structured streaming\
    \ integration with Kafka, where the data is read from Kafka streams and processed\
    \ by Spark Engine and written back to Kafka as shown in the following diagram:\n\
    \n![](images/11.2.jpg)\n\n**Figure 11.2:** Structured Streaming Kafka and Spark\
    \ integration\n\nKafka provides libraries and API to support the integration of\
    \ the Spark engine with its input and output stream.\n\n# [Approaches for integration](#toc.xhtml_s128a)\n\
    \nIn this section, we will understand the two approaches, that is, the receiver-based\
    \ approach and Direct approach;\n\n*   **Receiver-based approach**: This is the\
    \ initial approach where the receivers are used and implemented using Kafka API.\
    \ The data is passed to the Spark Engine and the spark streaming processes the\
    \ data. Data loss can happen on the receivers' side; we can avoid that by enabling\
    \ Write ahead logs in Spark Streaming, which stores all the data received in HDFS.\
    \ During a failure, the data from HDFS is used for recovery.\n\n*   **Direct approach**:\
    \ This is the new approach where we do not use receivers. The Spark Engine periodically\
    \ queries Kafka for the data using the offsets for the topic. This approach provides\
    \ simplified parallelism; multiple input Kafka Streams are not required as each\
    \ Kafka partition will have a corresponding Spark RDD and the data is read in\
    \ parallel. The previous approach required data to be stored in twice for providing\
    \ reliability. Here, saving twice is not required as it can be read from Kafka\
    \ partition in case of failure. The retention policy for Kafka can be set accordingly.\n\
    \n# [Structured Streaming integration of Kafka and Spark](#toc.xhtml_s129a)\n\n\
    In this section, we will learn how to implement the function of reading from Kafka\
    \ source. The implementation will be shown using Scala:\n\n*   **Linking**: The\
    \ linking is performed using the following artefact:\n\n    `groupId = org.apache.spark`\n\
    \n    `artifactId = spark-sql-kafka-0-10_2.12`\n\n    `version = 3.0.0`\n\n* \
    \  **Create a Kafka source for streaming queries**: To subscribe to a single topic,\
    \ the following code is used:\n\n    `/ Subscribing to a single topic`\n\n   \
    \ `valdf=spark`\n\n    `.readStream`\n\n    `.format(\"kafka\")`\n\n    `.option(\"\
    kafka.bootstrap.servers\",\"host1:port1,host2:port2\")`\n\n    `.option(\"subscribe\"\
    ,\"topic1\")`\n\n    `.load()`\n\n    `df.selectExpr(\"CAST(key AS STRING)\",\"\
    CAST(value AS STRING)\")`\n\n    `.as[(String, String)]`\n\n    To subscribe to\
    \ a single topic with headers, the following code is used:\n\n    `// Subscribe\
    \ to a topic, with headers`\n\n    `valdf=spark`\n\n    `.readStream`\n\n    `.format(\"\
    kafka\")`\n\n    `.option(\"kafka.bootstrap.servers\",\"host1:port1,host2:port2\"\
    )`\n\n    `.option(\"subscribe\",\"topic1\")`\n\n    `.option(\"includeHeaders\"\
    ,\"true\")`\n\n    `.load()`\n\n    `df.selectExpr(\"CAST(key AS STRING)\",\"\
    CAST(value AS STRING)\",\"headers\")`\n\n    `.as[(String, String, Map)]`\n\n\
    \    To subscribe to multiple topics, the following code is used:\n\n    `// Subscribe\
    \ to multiple topics`\n\n    `valdf=spark`\n\n    `.readStream`\n\n    `.format(\"\
    kafka\")`\n\n    **`.option(\"kafka.bootstrap.servers\",\"host1:port1,host2:port2\"\
    )`**\n\n    `.option(\"subscribe\",\"topic1,topic2\")`\n\n    `.load()`\n\n  \
    \  `df.selectExpr(\"CAST(key AS STRING)\",\"CAST(value AS STRING)\")`\n\n    `.as[(String,\
    \ String)]`\n\n    To subscribe to a topic using patterns for matching, the following\
    \ code is used:\n\n    `// Subscribe to a pattern`\n\n    `valdf=spark`\n\n  \
    \  `.readStream`\n\n    `.format(\"kafka\")`\n\n    **`.option(\"kafka.bootstrap.servers\"\
    ,\"host1:port1,host2:port2\")`**\n\n    `.option(\"subscribePattern\",\"topic.*\"\
    )`\n\n    `.load()`\n\n    `df.selectExpr(\"CAST(key AS STRING)\",\"CAST(value\
    \ AS STRING)\")`\n\n    `.as[(String, String)]`\n\n1.  **Create a Kafka Source\
    \ for Batch Queries**\n\n    The following shows the subscription to one topic\
    \ and when the start and end offsets are not provided, it defaults to the earliest\
    \ and latest offsets:"
