    \ = input.getInteger(2);\n        if(cumulativeTransactionAmount>1000 && count>2){\n\
    \            System.out.println(\"Alert yes for \"+custID+\" cumulativeTransactionAmount\
    \ \"+cumulativeTransactionAmount.toString()\n            +\" count \"+count.toString());\n\
