  trans: "\nApache Spark 是一个开源软件。它能够实时处理数据。它以分布式方式进行计算，因此具有可扩展性和容错性。Spark 包含许多用于分布式计算的特性。它可以与\
    \ Scala、Python、R、Java 和 SQL 等编程语言一起使用。它提供了用于实现机器学习流水线（ML pipelines）的库。\n\nSpark\
    \ 架构采用主从架构，由守护进程（master daemon）和工作守护进程（worker daemon）组成。在后续章节中，我们将学习 Spark 的核心概念和架构。\n\
    \n# Spark 与 Hadoop 的比较\n\nApache Spark 在内存中计算比 Hadoop 快数百倍。Hadoop 也进行计算，但使用 `map/reduce`\
    \ 框架的速度慢得多。Spark 将所有的管理组件包含在同一个集群中。而 Hadoop 包含不同的管理组件来执行其流水线。\n\nSpark 可以处理实时计算，而\
    \ Hadoop 只能处理批处理数据。Spark 的目的是增强 Hadoop 栈的能力。因此，其增强的处理能力与 Hadoop 生态系统良好集成。\n\n\
    # Spark 与 Storm 的比较\n\nApache Spark 和 Storm 在应用上相似，但在某些关键方面有所不同。Apache Spark 批处理数据，而\
    \ Storm 采用微批处理的方式处理数据。Spark 的延迟为秒级，而 Storm 的延迟为毫秒级。Spark 的语言支持较少，如 Java 和 Scala，而\
    \ Storm 支持多种语言支持，如 Java、Clojure 和 Scala。\n\nStorm 通过 `spouts` 处理数据流，而 Spark 可以在\
    \ `HDFS`、`HBase`、`Cassandra`、`Hive` 以及任何 `Hadoop InputFormat` 处理数据。Storm 使用 `Tuple`\
    \ 和 `partitions`，而 Spark 可以在 `HDFS`、`HBase`、`Cassandra`、`Hive` 以及任何 `Hadoop InputFormat`\
    \ 处理数据。\n\n# Spark 与 Kafka 的比较\n\nApache Spark 支持实时和批处理，而 Kafka 只有实时处理。Spark 有许多易读的文档支持，Kafka\
    \ 非常容易配置。Spark 的恢复机制使用 `Cache` 和 `RDD`。Kafka 的恢复机制使用复制方法。\n\n使用 Spark，我们可以执行 ETL\
    \ 操作，因为我们可以以对象的形式持久化数据。Kafka 只支持实时处理，因此它可以作为消息代理使用，但只能保留一段时间的消息。Spark 的处理速度快得多。Kafka\
    \ 处理数据也很快，但 Spark 的处理速度比 Hadoop 快 100 倍。\n\n# 核心概念\n\nSpark 包含了一系列库，用于构建应用程序。Apache\
    \ Spark 的核心由四个主要组件组成。如图所示：\n\n![](img/9.1.jpg)\n\n**图 9.1:** Spark 核心概念\n\nSpark\
    \ 核心组件包括：\n\n* **Spark SQL**: Spark 中的这一特性将关系处理与用于函数编程的 Spark API 结合。因此，它为结构化和半结构化数据提供了支持。它允许在\
    \ Java、Scala 和 Python 中作为 `Dataframes` 来操作数据。它还提供了执行 `SQL` 的命令行界面。\n\n* **Spark\
    \ streaming**: Spark streaming 易于构建可扩展、容错的流应用程序。Spark streaming 支持批处理和实时流。它是一种可扩展且容错的流能力。该流库基于核心\
    \ Spark API。它可以处理来自不同源的数据，如 `Kafka`、`Flume` 和 `Amazon Kinesis`。\n\n* **MLib**:\
    \ 它提供了用于机器学习的库。其实现具有可扩展性且相对容易实现。它支持机器学习算法、特征提取和转换以及机器学习流水线的调优。模型和流水线可以被保存。此外，还可以获得最常用的统计工具。\n\
    \n* **GraphX**: GraphX 是 Apache Spark 用于图和图并行计算的 API。它提供了图以及使用图进行并行计算的 API。它在一个系统中执行\
    \ ETL、探索性分析和图计算。它的速度与最快的图系统相当。提供了多种图算法供使用，如 `PageRank`、`Connected components`\
    \ 和 `Label propagation`。\n\n* **Apache Spark Core**: 这是 Spark 核心函数存在的基础。它执行任务分发、调度和输入/输出操作。它提供了\
    \ `RDD` 抽象。\n\n# Spark 的优势和特性\n\n以下是 Spark 的一些优势：\n\n* 实时处理能力使其能够与实时应用集成。\n* 它支持\
    \ Java、Scala、Python 和 R 等多种语言。\n* Spark 包含多个内置算子，将能够轻松高效地实现应用程序。\n* Apache Spark\
    \ 在处理 Hadoop 集群中的数据时速度极快。\n* 它具有容错机制，Spark 的 `RDD` 可以处理集群中工作节点的故障。\n* 它可以与 Hadoop\
    \ 良好集成。\n\n# Spark 架构\n\nApache Spark 具有定义良好的架构。它在本质上是分层的，组件之间是松耦合的。它还包含各种库以支持其特性。Apache\
    \ Spark 的架构包含两个主要组件。它们是：\n\n* **弹性分布式数据集 (RDD)**: RDD 的定义是 R-Resilient（弹性的）、D-Distributed（分布式的）和\
    \ D-Datasets（数据集）。它包含可以拆分为分区的数据。这些数据可以存储在 Spark 集群工作节点的内存中。\n\n  Spark 支持的两种 RDD\
    \ 类型为：\n\n  * 来自 `Hadoop` 且以文件形式存储在 `HDFS` 中的 `Datasets`\n  * 经过并行处理的现有 `Scala\
    \ Collections` 中的数据\n\n  `RDDs` 是不可变的。这是在多个系统上操作的根本元素，以实现并行处理。RDD 中数据的逻辑部分分发到其他节点。\n\
    \n* **有向无环图 (DAG)**: Spark 支持 DAG。它支持基于阶段的调度。传统的 Map Reduce 包含 Map 和 Reduce 阶段，而\
    \ Spark 可以包含通过 DAG 定义的多个阶段。\n\n  它执行一系列转换，每个节点都是一个 `RDD` 分区，转换在边上执行。边上的转换将数据从一种状态转换为另一种状态。由于它是无环的，转换后的数据状态必须进入\
    \ DAG 节点定义的下一个分区。\n\n下图显示了 Spark 程序的架构和工作流：\n\n![](img/9.2.jpg)\n\n**图 9.2:**\
    \ Spark 架构\n\nApache Spark 采用主从架构。两个守护进程是主守护进程和工作守护进程。它由集群管理器管理。集群管理器启动执行器（executors）和驱动程序（drivers）。\n\
    \n一个 Spark 集群通常有一个主节点和多个工作节点。如*图 9.2*所示的 Spark 驱动程序是集群的入口；它包含 `main()` 函数。在这里创建\
    \ `SparkContext`。`SparkContext` 包含了集群所需的所有功能。驱动程序具有调度组件，如 `DAG 调度器`、后端调度器、任务调度器和块管理器（block\
    \ manager）。它们用于将用户编写的代码转换为在集群上执行的作业。\n\n驱动程序和上下文将与集群管理器一起监控在集群上运行的任务，集群管理器为作业分配资源。一个作业可以进一步拆分为多个子任务，并分配给不同的工作节点。\n\
    \n"
- fmt: "The worker node executes its tasks and returns the result to the `SparkContext`.\
    \ The data in the `RDD` can be saved in the cache of each worker node. The executors\
    \ in each worker node is responsible of executing the job and providing its results\
    \ to `SparkContext`. The executors are started when the application is initiated\
    \ and it continues to run in the background as long as the application is active.\n\
    \n# [Applications of Spark](#toc.xhtml_s111a)\n\nSpark has many applications;\
    \ the following are the important applications of Spark:\n\n*   **Streaming Applications\
    \ and ETL**: `Spark` can process streaming data; therefore, it is used in many\
    \ data processing pipelines. This includes `Streaming ETL` capability, which can\
    \ clean and aggregate data in real time when compared with the traditional `ETL`\
    \ used with batches of data. Ad companies use the capability to combine the historical\
    \ data with the real-time data, thus providing a customized ad for the users.\n\
    *   **Machine learning**: The `MLib` (sic, likely `MLib`) is the machine learning\
    \ library of `spark`. It can be used to perform real-time analytics on the streaming\
    \ data. It can detect frauds or threat that can occur real-time.\n*   **Visualization**:\
    \ `Spark` allows interactive visualization of data. It has the ability to perform\
    \ queries on live data very fast and therefore can be used for interactive data\
    \ processing and analysis.\n\n# [Conclusion](#toc.xhtml_s112a)\n\nIn this chapter,\
    \ we learnt the concepts of `Spark`. The comparison of `Spark` with `Kafka`, `Storm`,\
    \ and `Hadoop` was understood. The core concepts of `Spark` were detailed as they\
    \ are the key elements of `spark` and its applications.\n\nThe features and benefit\
    \ of `Spark` was also learnt. The architecture of `Spark` and its components was\
    \ understood in detail. The workflow of the components in a `Spark cluster` was\
    \ understood. The main applications of `Spark` were described.\n\nIn the next\
    \ chapter, we will focus on the streaming applications of `Spark`. The technical\
    \ implementations of `Spark streaming` and the basic concepts of streaming will\
    \ be discussed in detail.\n\n# [Questions](#toc.xhtml_s113a)\n\n1.  **Which one\
    \ performs faster computations - Spark or Hadoop?**\n    **Ans:** `Spark`\n2.\
    \  **Does Spark have lesser language support than Storm?**\n    **Ans:** `Yes`\n\
    3.  **What is the recovery mechanism of Spark?**\n    **Ans:** `Cache` and `RDD`\n\
    4.  **Can spark be integrated with Hadoop?**\n    **Ans:** `Yes`\n5.  **Can ETL\
    \ pipelines be implemented using Spark?**\n    **Ans:** `Yes`\n6.  **What are\
    \ the two components of Spark architecture?**\n    **Ans:** `RDD` and `DAG`\n\n\
    # [CHAPTER 10](#toc.xhtml_c10)\n\n# [Spark Streaming](#toc.xhtml_c10)\n\n# [Introduction](#toc.xhtml_s114a)\n\
    \nIn this chapter, we will learn the concepts of streaming in `Spark`. `Spark\
    \ streaming` processes streams of data in a scalable and fault tolerant manner.\
    \ It can perform batch processing and real-time processing of streams. We will\
    \ learn to execute shell commands in `Spark`. We will implement `Spark` using\
    \ `Eclipse`.\n\n# [Structure](#toc.xhtml_s115a)\n\nThe structure of the chapter\
    \ is as follows:\n\n*   Core concepts of `Spark streaming`\n*   Execution of `Spark\
    \ Shell` commands\n*   Implementation of `Spark` using `Scala IDE`\n*   Implementing\
    \ microservice using `Eclipse`\n\n# [Objectives](#toc.xhtml_s116a)\n\nThe objectives\
    \ of the chapter are:\n\n*   Understanding the concepts of `Spark Streaming`\n\
    *   Knowing the method of execution of `spark commands`\n*   Learning to implement\
    \ `Spark` using `Scala IDE`\n*   Understanding the implementation of microservice\
    \ using `Eclipse IDE`\n\n# [Core concepts of Spark streaming](#toc.xhtml_s117a)\n\
    \nApache `Spark streaming` uses the core `Spark API`, which can process data in\
    \ real-time from many data sources such as `Kafka`, `Flume`, and `Amazon Kinesis`.\
    \ The streaming libraries are built upon the existing core `Spark API` libraries.\n\
    \nThe `Discretized Stream` (`DStream`) divides the stream of data into small batches.\
    \ `Spark RDD` is used to build `DStreams`, and therefore has integration capabilities\
    \ with `Spark SQL`, machine learning (`Spark MLib`) and graph processing.\n\n\
    `Spark streaming` is fault-tolerant and hence recovers fast from failures providing\
    \ high throughput. It provides load balancing and manages the usage of resources.\
    \ The streaming data can also be integrated with static data and shown on dashboards\
    \ using interactive queries:\n\n![](images/10.1.jpg)\n\n**Figure 10.1:** Spark\
    \ streaming architecture\n\nIn the architecture shown above, the data from the\
    \ streams are split into batched of definite size. Each batch of data will be\
    \ processed by the `Spark engine` for accomplishing a specific task.\n\n# [Execution\
    \ of Spark Shell commands](#toc.xhtml_s118a)\n\nIn this section, we will learn\
    \ to execute commands in `Spark Shell`. The following steps can be followed to\
    \ install Apache `Spark`:\n\n1.  Download `Spark` from the link : `[https://spark.apache.org/downloads.html](https://spark.apache.org/downloads.html)`\n\
    \n    ![](images/10.2.jpg)\n\n    **Figure 10.2:** Download Spark\n\n2.  Navigate\
    \ to the folder and set it as `HADOOP_PATH`:\n\n    ![](images/10.3.jpg)\n\n \
    \   **Figure 10.3:** Setting Hadoop Path\n\n3.  To the `Spark shell`, navigate\
    \ to the `bin` directory in the Command Prompt as shown in the following screenshot:\n\
    \n    ![](images/10.4.jpg)\n\n    **Figure 10.4:** Navigate to bin directory\n\
    \n4.  To start the `Spark`, type `spark-shell`:\n\n    ![](images/10.5.jpg)\n\n\
    \    **Figure 10.5:** Staring Spark Shell\n\n5.  To read a file, copy a file into\
    \ the `bin` directory, use the following command:\n\n    ```\n    val textFile\
    \ = sc.textFile(\"README.md\")\n    ```\n\n    ![](images/10.6.jpg)\n\n    **Figure\
    \ 10.6:** Executing commands\n\n6.  To count the lines in the text, we can use:\n\
    \n    ```\n    textFile.count()\n    ```\n\n    ![](images/10.7.jpg)\n\n    **Figure\
    \ 10.7:** View output\n\n7.  To read the first line, use the following command:\n\
    \n    ```\n    textFile.first()\n    ```\n\n    ![](images/10.8.jpg)\n\n    **Figure\
    \ 10.8:** View the First Line\n\nIn the preceding section, we learnt to use `Spark\
