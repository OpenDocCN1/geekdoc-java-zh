  trans: "\n每个 Broker 都包含 Kafka 主题（Topics）。主题是 Kafka 生产者写入数据的接口。消费者可以订阅某个主题并从中读取数据。许多消费者可以订阅同一个主题。同样，消费者也可以订阅多个主题。\n\
    \n每个 Kafka 主题被划分为多个分区（Partitions）。分区的内容，即记录将在集群中的多个节点上复制。这确保了记录的高可用性，并有助于在记录发生故障或丢失时进行恢复。\n\
    \n每个分区都有一个有序的序列且是不可变的。数据以日志的形式存储在这些分区中。该日志是结构化且有序的。日志中的记录包含序列号，不同的消费者将其用作偏移量（offset）。\n\
    \n其中一个分区被指定为领导（leader）。每当主题接收消息时，记录的写入和读取都通过 leader 进行。每当记录发生变化时，leader 会复制内容并更新副本。如果\
    \ leader 分区由于某种原因失败，副本将被分配为 leader。\n\n![](img/1.3.jpg)\n\n**图 1.3:** 主题与分区\n\n\
    由于许多消费者从主题读取数据，每个消费者都使用偏移量值来跟踪读取过程。在接下来的示例中，在`图 1.4`中，消费者 1 的偏移量为 `3`，消费者 2 的偏移量为\
    \ `6`：\n\n![](img/1.4.jpg)\n\n**图 1.4:** 偏移量操作\n\n因此，当消费者 1 执行读取操作时，使用偏移量值 `3`\
    \ 并读取随后的记录 `4`。同样，当消费者 2 从分区读取时，引用偏移量值 `6` 并读取接下来的记录，即 `7`。\n\n# Kafka 核心 API\n\
    \nKafka 拥有以下核心 API 来支持其关键功能。如`图 1.5`所示，Kafka 集群使用这些 API 与其生产者和消费者通信：\n\n![](img/1.5.jpg)\n\
    \n**图 1.5:** Kafka APIs\n\n*   **Producer API**: 此 API 用于将记录发布到主题。\n*   **Consumer\
    \ API**: 使用消费者 API，消费者可以订阅多个主题并处理写入这些主题的记录。\n*   **Streams API**: 此 API 从输入流中读取记录流并发送到输出流。\n\
    *   **Connector API**: 此 API 用于连接关系型数据库等数据系统到 Kafka 主题。一旦定义了 API，表的更改将发布到主题。\n\
    *   **AdminClient API**: 此 API 用于支持 broker 和主题的管理。\n\n因此，上述 API 是 Kafka 消息传递的核心，在后面的章节中，我们将看到它们如何被用于消息传递。\n\
    \n# 使用 Kafka 的优势\n\n以下是使用 Kafka 流框架的一些优势：\n\n*   **高可扩展性**: Kafka 可以处理海量数据。由于其架构，它可以很容易地扩展以处理记录。\n\
    *   **容错性**: 由于 Kafka 中的记录在不同的节点和服务器上进行复制，它可以容忍故障。\n*   **低停机时间**: 从 Kafka 获取数据的停机时间较短。\n\
    *   **可靠性**: Kafka 中的记录在不同的节点和服务器上复制，它可以容忍故障。\n*   **高吞吐量**: Kafka 可以处理海量数据。由于其架构，它可以很容易地扩展以处理记录。\n\
    \n# Kafka 的应用\n\n以下是使用 Kafka 的一些应用：\n\n*   **Twitter**: Kafka 用于处理海量的推文流。\n* \
    \  **LinkedIn**: Kafka 用于实时数据处理。\n*   **Netflix**: Kafka 用于推荐引擎和监控。\n*   **Spotify**:\
    \ Kafka 用于实时分析。\n*   **Uber**: Kafka 用于追踪和匹配。\n\n# 总结\n\n在本章中，我们学习了 Kafka 的架构。我们还理解了主题和分区及其使用方法。我们看到了\
    \ Kafka 的优势。并提供了 Kafka 的核心 API。下一章将提供安装 Kafka 及其依赖项的步骤。\n\n# 问题\n\n1. **Kafka\
    \ 中哪个组件负责管理从生产者到消费者的消息中继？**\n   a. 集群 Cluster\n   b. Zookeeper\n   c. Broker\n\
    \   d. Stream\n\n2. **以下哪项不是 Kafka 的应用？**\n   a. 流处理\n   b. 构建网站\n   c. 日志聚合\n\
    \   d. 消息传递\n\n3. **以下哪项不是 Kafka 的优势？**\n   a. 不容错\n   b. 高吞吐量\n   c. 可扩展性\n \
    \  d. 可靠\n\n4. **哪个 API 从生产者读取消息并发送到消费者？**\n   a. Consumer API\n   b. Connector\
    \ API\n   c. Streams API\n   d. Producer API\n\n5. **哪个 API 用于管理 broker 和主题？**\n\
    \   a. Connector API\n   b. Streams API\n   c. Producer API\n   d. AdminClient\
    \ API\n\n6. **Kafka 如何确保高可用性？**\n   答：通过在多个节点和集群中对记录进行复制\n\n7. **以下哪项不是 Kafka\
    \ 架构中的组件？**\n   a. Admin API\n   b. Brokers\n   c. Producers\n   d. Consumers\n\
    \   e. Zookeeper\n\n# 答案\n\n1. b\n2. b\n3. a\n4. c\n5. d\n6. a\n\n# 第 2 章\n\n\
    # 安装 Kafka\n\n# 引言\n\n在本章中，我们将学习运行 Kafka 集群所需的软件安装。我们将详细介绍 JDK、Zookeeper 和 Kafka\
    \ 的安装。设置 Kafka 集群对于实现和执行 Kafka 生产者和消费者非常重要。\n\n# 结构\n\n*   安装 JDK\n*   安装 Zookeeper\n\
    *   运行 Zookeeper\n*   Zookeeper 可配置参数\n*   Apache Kafka 安装\n*   运行 Kafka 服务器\n\
    \n"
- fmt: "\n# Objectives\n\n*   Learn to install Java in windows\n*   Learn the process\
    \ of installing and running the Zookeeper in Windows\n*   Understanding the configurable\
    \ parameters of Zookeeper\n*   Learn the process of installation of Apache Kafka\
    \ in Windows\n*   Running the Apache Kafka server\n\n# Installing JDK\n\nIn this\
    \ section, instructions will be provided for the installation of JDK, which is\
    \ a pre-requisite for Kafka Messaging. The following steps can be followed to\
    \ download the software and install it:\n\n1.  Go to `[https://www.oracle.com/technetwork/java/javase/downloads/index.html](https://www.oracle.com/technetwork/java/javase/downloads/index.html)`\n\
    \n    ![](images/2.1.jpg)\n\n    **Figure 2.1:** Source for JDK\n\n2.  Choose\
    \ the version of JDK you would like to install and click on `Download` as shown\
    \ in the following screenshot:\n\n    ![](images/2.2.jpg)\n\n    **Figure 2.2:**\
    \ Version of JDK\n\n3.  Scroll down to view the list of installable available\
    \ for different operating systems.\n\n4.  Click on `Accept License Agreement`.\n\
    \n5.  Click on the installable under the download column (for example, `jdk-13.0.1_windows-x64_bin.exe`).\n\
    \n6.  Run the downloaded software.\n\n7.  Provide the path for the installation:\n\
    \n    ![](images/2.3.jpg)\n\n    **Figure 2.3:** Path for JDK installation\n\n\
    8.  Click on `Next` and wait for the installation to complete:\n\n    ![](images/2.4.jpg)\n\
    \n    **Figure 2.4:** JDK installation progress\n\n9.  Add `JAVA_HOME` to the\
    \ environment path as shown in the following screenshot. It can be accessed in\
    \ this sequence:\n\n    `Control Panel` | `System` | `Advanced System Settings`\
    \ | `Environment Variable`:\n\n    ![](images/2.5.jpg)\n\n    **Figure 2.5:**\
    \ JAVA_HOME setup\n\n10. In `System Variables`, edit the `Path` variable and add\
    \ `%JAVA_HOME%\\bin` as shown in the following screenshot:\n\n    ![](images/2.6.jpg)\n\
    \n    **Figure 2.6:** Path Variable for JAVA_HOME\n\nThrough the above steps,\
    \ the JDK installation is complete. In the next section, we will go through the\
    \ steps to install the Zookeeper.\n\n# Installing Zookeeper\n\nZookeeper is an\
    \ important component in the Kafka architecture. The zookeeper should be configured\
    \ and run before starting the Kafka server. The following steps are to be followed\
    \ to install the Zookeeper:\n\n1.  Go to the URL: `[https://zookeeper.apache.org/releases#download](https://zookeeper.apache.org/releases#download)`\n\
    \n2.  Click on the `Download` hyperlink:\n\n    ![](images/2.7.jpg)\n\n    **Figure\
    \ 2.7:** Zookeeper source\n\n3.  On this page, click on the mirror site as shown\
    \ in the following screenshot:\n\n    ![](images/2.8.jpg)\n\n    **Figure 2.8:**\
    \ Zookeeper installation link\n\n4.  Click on the `zookeeper-3.4.14/` folder highlighted\
    \ in yellow in the following screenshot:\n\n    ![](images/2.9.jpg)\n\n    **Figure\
    \ 2.9:** Zookeeper releases\n\n5.  Click and download the zookeeper highlighted\
    \ in yellow:\n\n    ![](images/2.10.jpg)\n\n    **Figure 2.10:** Zookeeper version\n\
    \n6.  Navigate to the directory containing the `zookeeper-3.4.14.tar.gz` file\
    \ and execute the following command:\n\n    ```\n    tar -zxf zookeeper-3.4.14.tar.gz\n\
    \    ```\n\n    ![](images/2.11.jpg)\n\n    **Figure 2.11:** Unzip command\n\n\
    7.  This will create a folder within the `kafka` directory:\n\n    ![](images/2.12.jpg)\n\
    \n    **Figure 2.12:** Zookeeper directory\n\n8.  Navigate into the folder `C:\\\
    kafka\\zookeeper-3.4.14` and create a new folder called `inputdata`:\n\n    ![](images/2.13.jpg)\n\
    \n    **Figure 2.13:** Zookeeper input data\n\n9.  Open the file `zoo_sample.cfg`\
    \ within the `C:\\kafka\\zookeeper-3.4.14\\conf`.\n\n    Provide the path for\
    \ the `dataDir`. Also, rename the file to `zoo.cfg`.\n\n    ![](images/2.14.jpg)\n\
    \n    **Figure 2.14:** Zookeeper config file\n\n10. Add the Zookeeper path to\
    \ environment path using the following command:\n\n    ```\n    setx path \"%PATH%;C:\\\
    kafka\\zookeepr-3.4.14\\bin\"\n    ```\n\n    ![](images/2.15.jpg)\n\n    **Figure\
    \ 2.15:** Set Zookeeper path\n\nIn this section, we have learnt to install Zookeeper.\
    \ The configuration for setting up the Zookeeper was seen in detail.\n\n# Running\
    \ Zookeeper\n\nThis section will introduce the commands to run Zookeeper. The\
    \ zookeeper should be configured and run before starting the Kafka server. The\
    \ following steps are to be followed to install the Zookeeper:\n\n1.  Press the\
    \ following:\n\n    ```\n    cd C:\\kafka\\zookeeper-3.4.14\n    ```\n\n    ![](images/2.16.jpg)\n\
    \n    **Figure 2.16:** Starting Zookeeper\n\n2.  Type `zkServer`:\n\n    ```\n\
    \    zkServer-server.start\n    ```\n\n    ![](images/2.17.jpg)\n\n    **Figure\
    \ 2.17:** Running Zookeeper\n\n3.  Check if the process is running using:\n\n\
    \    ```\n    ps aux | grep zkServer\n    ```\n\n    ![](images/2.18.jpg)\n\n\
    \    **Figure 2.18:** Running Zookeeper\n\nIn this section, we have learnt to\
    \ install Zookeeper. The configuration for setting up the Zookeeper was seen in\
    \ detail.\n\n# Configurable parameters in Zookeeper\n\nThere are several parameters\
    \ that are configurable for the Zookeeper. The following are some of the parameters\
    \ that used in the `config` file:\n\n| S no. | Parameters | Description |\n| :---\
    \ | :--- | :--- |\n| 1 | `dataDir` | The snapshots are stored in this directory.\
    \ |\n| 2 | `clientPort` | The port to which clients can connect. |\n| 3 | `tickTime`\
    \ | The duration of a tick, this is a unit used by zookeeper. |\n| 4 | `initTime`\
    \ | The time duration in ticks for the followers to connect to the leader. |\n\
    | 5 | `syncLimit` | The time duration in ticks for the client to sync with the\
    \ leader. |\n| 6 | `server.x=[name]:port1[:port2]` | A zookeeper contains multiple\
    \ servers; `x` is the server number. `name` is the hostname. `port1` is the port\
    \ used to connect the leader. `port2` is the port used for electing the leader.\
    \ |\n| 7 | `dataLogDir` | This path can be used to write the logs related to the\
    \ update performed on the database. |\n\n**Table 2.1:** Configuration parameters\
    \ of Zookeeper\n\nThe preceding table consists of important parameters for the\
    \ Zookeeper; it can be used for their respective purposes. The syntax given in\
    \ the descriptions needs to be followed while configuring them.\n\n# Kafka installation\n\
    \nHere are the steps to install Apache Kafka:\n\n1.  Go to this URL: `[https://kafka.apache.org/quickstart](https://kafka.apache.org/quickstart)`\n\
    \n2.  Click on the download link:\n\n    ![](images/2.19.jpg)\n\n    **Figure\
    \ 2.19:** Kafka installation website\n\n3.  Click on the hyperlink highlighted\
    \ below and download the software:\n\n    ![](images/2.20.jpg)\n\n    **Figure\
    \ 2.20:** Kafka installation version\n\n4.  Execute `tar-xzf kafka_2.12-2.4.0.tgz`\
    \ command as shown in the following screenshot\n\n    ![](images/2.21.jpg)\n\n\
    \    **Figure 2.21:** Unzip Kafka\n\nThe aforementioned steps will install the\
    \ Kafka Server. In the next section, we will learn to start and stop the Kafka\
    \ Server.\n\n# Running the Kafka server\n\nThe Kafka server has to be started\
    \ for the messaging APIS (Producers, Consumers, etc.) to start functioning. Therefore,\
    \ the following section describes the steps to start the server:\n\n1.  To start\
    \ the server, execute the following command:\n\n"
