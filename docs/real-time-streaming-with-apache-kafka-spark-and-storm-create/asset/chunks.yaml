- fmt: "\nEach broker contains Kafka topics. Topics are the interface to which Kafka\
    \ producers write. The consumer may subscribe to a topic and read from it. Many\
    \ consumers may subscribe to a single topic. Similarly, a consumer may subscribe\
    \ to multiple Topics.\n\nEach Kafka topic is divided into multiple partitions.\
    \ The content of the partition, that is, the record will be replicated in multiple\
    \ nodes in the clusters. This creates high availability of the records as well\
    \ as helps to recover the record in the event of failure or loss of record.\n\n\
    Each partition has an ordered sequence and is immutable. The data is stored in\
    \ these partitions in the form of a log. This log is structured and ordered. The\
    \ records that are present in the log contain sequence numbers, which are used\
    \ as an offset by different consumers.\n\nOne of the partitions is appointed as\
    \ the leader. Whenever a topic receives a message, the writing and reading of\
    \ the record takes place via the leader. The leader replicates the content and\
    \ updates the replicas whenever there is a change in the record. If the leader\
    \ partition fails for some reason, the replica is assigned as the leader.\n\n\
    ![](images/1.3.jpg)\n\n**Figure 1.3:** Topics and Partitions\n\nSince many consumers\
    \ read from a topic, each consumer tracks the reading process using an offset\
    \ value. In the following example, in `[figure 1.4](#c01.xhtml_fig1_4)`, consumer\
    \ 1's offset is `3` and consumer 2's offset is `6`:\n\n![](images/1.4.jpg)\n\n\
    **Figure 1.4:** Offset Operation\n\nTherefore whenever the read operation takes\
    \ place for consumer 1 the offset value `3` is used and the subsequent record\
    \ `4` is read. Similarly when the consumer 2 reads from the partition the offset\
    \ value `6` is referred and the next records, that is, `7` are read.\n\n# [Core\
    \ API of Kafka](#toc.xhtml_s8a)\n\nKafka has the following core API to support\
    \ its key functions. As shown in the following `[figure 1.5](#c01.xhtml_fig1_5)`,\
    \ The Kafka Cluster uses these APIs to communicate with its producers and consumers:\n\
    \n![](images/1.5.jpg)\n\n**Figure 1.5:** Kafka APIs\n\n*   **Producer API**: This\
    \ API is used to publish records to a topic.\n*   **Consumer API**: Using the\
    \ consumer API, consumers can subscribe to multiple topics and they process the\
    \ records written to these topics.\n*   **Streams API**: This API reads streams\
    \ of records from the input stream and sends to the output stream.\n*   **Connector\
    \ API**: This API is used to connect to data systems such as relational database\
    \ to the Kafka topics. Once the API is defined, the change in the tables will\
    \ be posted to the topics.\n*   **AdminClient API**: This API is used to support\
    \ the management of the broker and topics.\n\nTherefore, the preceding APIs are\
    \ the core to Kafka messaging, and in the later chapters, we will see how they\
    \ are used for messaging.\n\n# [Advantages of using Kafka](#toc.xhtml_s9a)\n\n\
    The following are some of the advantages of using Kafka streaming framework:\n\
    \n*   **Highly scalable**: Kafka can be used with large volumes of data. It scales\
    \ very easily to process the records because of its architecture.\n*   **Fault\
    \ tolerant**: Since the records in Kafka is replicated in different nodes and\
    \ servers, it can tolerate failures.\n*   **Less downtime**: The downtime of retrieving\
    \ data from Kafka is less.\n*   **Reliability**: The records in Kafka are replicated\
    \ in different nodes and servers, it can tolerate failures.\n*   **High throughput**:\
    \ Kafka can be used with large volumes of data. It scales very easily to process\
    \ the records because of its architecture.\n\n# [Applications using Kafka](#toc.xhtml_s10a)\n\
    \nThe following are some of the applications using Kafka:\n\n*   **Twitter**:\
    \ Kafka is used to handle massive streams of tweets.\n*   **LinkedIn**: Kafka\
    \ is used for real-time data processing.\n*   **Netflix**: Kafka is used for recommendation\
    \ engines and monitoring.\n*   **Spotify**: Kafka is used for real-time analytics.\n\
    *   **Uber**: Kafka is used for tracking and matching.\n\n# [Conclusion](#toc.xhtml_s11a)\n\
    \nIn this chapter, we learnt the architecture of Kafka. We also understood topics\
    \ and partitions how they are used. The advantages of Kafka were seen. The core\
    \ APIs of Kafka were provided. The next chapter will provide steps to install\
    \ Kafka and its dependencies.\n\n# [Questions](#toc.xhtml_s12a)\n\n1. **Which\
    \ component in Kafka manages the relay of messages from producer to consumers?**\n\
    \   a. Cluster\n   b. Zookeeper\n   c. Broker\n   d. Stream\n\n2. **Which of the\
    \ following is not an application of Kafka?**\n   a. Stream Processing\n   b.\
    \ Building website\n   c. Log Aggregation\n   d. Messaging\n\n3. **Which of the\
    \ following is not an advantage of Kafka?**\n   a. Not fault tolerant\n   b. High\
    \ throughput\n   c. Scalable\n   d. Reliable\n\n4. **Which API reads the message\
    \ from producer and sends to consumer?**\n   a. Consumer API\n   b. Connector\
    \ API\n   c. Streams API\n   d. Producer API\n\n5. **Which API is used for the\
    \ management of broker and topics?**\n   a. Connector API\n   b. Streams API\n\
    \   c. Producer API\n   d. AdminClient API\n\n6. **How does Kafka ensure high\
    \ availability?**\n   Ans: Through replication of the records in multiple nodes\
    \ and clusters\n\n7. **Which of the following is not a component in Kafka architecture?**\n\
    \   a. Admin API\n   b. Brokers\n   c. Producers\n   d. Consumers\n   e. Zookeeper\n\
    \n# [Answers](#toc.xhtml_s13a)\n\n1. b\n2. b\n3. a\n4. c\n5. d\n6. a\n\n# [CHAPTER\
    \ 2](#toc.xhtml_c02)\n\n# [Installing Kafka](#toc.xhtml_c02)\n\n# [Introduction](#toc.xhtml_s14a)\n\
    \nIn this chapter, we will learn to install the software required for the running\
    \ of Kafka Cluster. The installation of the JDK, Zookeeper, and Kafka will be\
    \ explained in detail. Setting up of the Kafka Cluster is important to implement\
    \ and execute Kafka producers and consumers.\n\n# [Structure](#toc.xhtml_s15a)\n\
    \n*   Installing JDK\n*   Installing Zookeeper\n*   Running the Zookeeper\n* \
    \  Configurable parameters of Zookeeper\n*   Apache Kafka installation\n*   Running\
    \ the Kafka server\n"
