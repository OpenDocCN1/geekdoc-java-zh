    \ Implementation of a service using Spark is shown.\n\nIn the next chapter, we\
    \ will learn the integration of Spark with Kafka.\n\n# [Questions](#toc.xhtml_s122a)\n\
    \n1.  **What are batches of data called in Spark?**\n\n2.  **Can Spark be used\
    \ for batch and real-time processing?**\n\n3.  **Can Spark Streaming be integrated\
    \ with machine learning Library MLib?**\n\n4.  **Can Spark be implemented using\
