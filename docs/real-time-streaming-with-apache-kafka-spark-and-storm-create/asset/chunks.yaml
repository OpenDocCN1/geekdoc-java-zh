- fmt: "\nThis chapter aims to understand the motivation behind using storm and the\
    \ purpose of Apache Storm. The key difference between Kafka and Storm is that\
    \ Kafka does not perform computation on the streams of data. The key difference\
    \ between Storm and Hadoop is that Hadoop only performs computation on batches\
    \ of data, while Storm provides real-time computational capabilities.\n\nIn the\
    \ next chapter, we will learn to download and install Storm and its dependencies.\
    \ We will also set up a Storm cluster as an example.\n\n# Questions\n\n1. **Which\
    \ system processes messages faster?**\n    1. Hadoop\n    2. Storm\n    3. Kafka\n\
    \n2. **Which component of Storm is used to read the data from input source?**\n\
    \    **Ans:** Spout\n\n3. **Which component of Storm is used to process the data?**\n\
    \    **Ans:** Bolt\n\n4. **Can a topology have more than one spout?(Yes/No)**\n\
    \    **Ans:** Yes\n\n5. **Can a Bolt send its processed results to another bolt?\
    \ (Yes/No)**\n    **Ans:** Yes\n\n6. **Does Kafka perform computation on the data\
    \ it reads? (Yes/No)**\n    **Ans:** No\n\n7. **Is Storm stateless? (Yes/No)**\n\
    \    **Ans:** Yes\n\n# Answers\n\n1. b\n\n# CHAPTER 7\n\n# Installation and Configuration\
    \ of Storm\n\n## Introduction\n\nThis chapter will focus on installing Apache\
