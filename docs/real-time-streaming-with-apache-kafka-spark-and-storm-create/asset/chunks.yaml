    # Questions](#toc.xhtml_s41a)


    1. To which partition does the producer write?

    a) Empty partition

    b) First partition

    c) Any partition

    d) Leader partition


    2. When a leader fails, which exception will be thrown?

    a) LeaderNotAvailable

    b) LeaderMissing

    c) LeaderNotFound

    d) NoLeader exception


    3. When a replica fails and becomes active again, which process is performed?

    a) Store the data from producer

    b) Synchronization with other replicas


    4. Which script is used to create a producer?

    a) `console-producer.bat`

    b) `kafka-console-producer.bat`

    c) `kafka-producer.bat`

    d) `kafka-console.bat`


    5. To delete a Topic, which property must be added in the server?

    a) `topic.enable=true`

    b) `delete.enable=true`

    c) `delete.topic=true`

    d) `delete.topic.enable=true`


    6. Which batch file is used to create a consumer?

    a) `console-producer.bat`

    b) `kafka-console-producer.bat`

    c) `kafka-console-consumer.bat`

    d) `kafka-console.bat`


    # Answers](#toc.xhtml_s42a)


    1. d

    2. a

    3. b

    4. b

    5. d

    6. c


