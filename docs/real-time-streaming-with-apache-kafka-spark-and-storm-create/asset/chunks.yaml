  trans: "\n工作节点执行其任务并将结果返回给 `SparkContext`。`RDD` 中的数据可以保存在每个工作节点的缓存中。每个工作节点中的执行器（executors）负责执行作业并将其结果提供给\
    \ `SparkContext`。执行器在应用程序启动时启动，只要应用程序处于激活，它们就会持续在后台运行。\n\n# Spark 的应用\n\nSpark\
    \ 有许多应用；以下是 Spark 的重要应用：\n\n*   **流式应用和 ETL**：`Spark` 可以处理流式数据；因此，它被用于许多数据处理流水线。这包括\
    \ `Streaming ETL` 能力，与用于批处理数据的传统 `ETL` 相比，它可以实时对数据进行清洗和聚合。广告公司利用该功能将历史数据与实时数据相结合，从而为用户提供定制化广告。\n\
    *   **机器学习**：`MLib`（此处为误，可能应为 `MLib`）是 `spark` 的机器学习库。它可以用于对流式数据进行实时分析。它可以检测实时发生的欺诈或威胁。\n\
    *   **可视化**：`Spark` 允许对数据进行交互式可视化。它具有对实时数据进行极快速查询的能力，因此可以用于交互式数据处理和分析。\n\n# 结论\n\
    \n在本章中，我们学习了 `Spark` 的相关概念。理解了 `Spark` 与 `Kafka`、`Storm` 和 `Hadoop` 的对比。详细说明了\
    \ `Spark` 的核心概念，因为它们是 `spark` 及其应用的关键元素。\n\n我们还学习了 `Spark` 的特性和优势。详细理解了 `Spark`\
    \ 的架构及其组件。理解了 `Spark 集群`中各个组件的工作流。并描述了 `Spark` 的主要应用。\n\n在下一章中，我们将重点关注 `Spark`\
    \ 的流式应用。将详细讨论 `Spark streaming` 的技术实现和流的基本概念。\n\n# 问题\n\n1.  **哪一个执行计算更快更快 - Spark\
    \ 还是 Hadoop？**\n    **答：** `Spark`\n2.  **Spark 的语言支持比 Storm 少的吗？**\n    **答：**\
    \ `是`\n3.  **Spark 的恢复机制是什么？**\n    **答：** `Cache` 和 `RDD`\n4.  **Spark 可以与 Hadoop\
    \ 集成吗？**\n    **答：** `是`\n5.  **可以使用 Spark 实现 ETL 流线吗？**\n    **答：** `是`\n6. \
    \ **Spark 架构的两个组件是什么？**\n    **答：** `RDD` 和 `DAG`\n\n# 第 10 章\n\n# Spark Streaming\n\
    \n# 引言\n\n在本章中，我们将学习 `Spark` 中的流式概念。`Spark streaming` 以可扩展和容错的方式处理数据流。它可以对数据流进行批处理和实时处理。我们将学习在\
    \ `Spark` 中执行 shell 命令行。我们使用使用 `Eclipse` 实现 `Spark`。\n\n# 结构\n\n本章的结构如下：\n\n*\
    \   `Spark streaming` 的核心概念\n*   `Spark Shell` 命令的执行\n*   使用 `Scala IDE` 实现 `Spark`\n\
    *   使用 `Eclipse` 实现微服务\n\n# 目标\n\n本章的目标是：\n\n*   理解 `Spark Streaming` 的概念\n* \
    \  了解 `spark commands` 的执行方法\n*   学习使用 `Scala IDE` 实现 `Spark`\n*   理解使用 `Eclipse\
    \ IDE` 实现微服务的实现\n\n# Spark streaming 的核心概念\n\n`Spark streaming` 使用核心 `API` 实时处理来自\
    \ `Kafka`、`Flume` 和 `Amazon Kinesis` 等数据源。`Discretized Stream` 将流分成小批次。`Spark`\
    \ 具有容错性，并提供高吞吐量，支持在仪表板进行交互式查询。`Spark` 架构通过 `DStream`、`RDD`、`Spark SQL`、`MLib`\
    \ 和 `Graph` 来管理资源。\n\n![](img/10.jpg)\n\n**图 1：Spark 架构**\n\n# Spark Shell 命令的执行\n\
    \n在本节中，我们将学习执行 `Spark` 命令。为了执行 `Spark` 命令：\n\n1.  启动 `Spark`：从 [`spark.apache.org/downloads.html`](https://spark.apache.org/downloads.html)\
    \ 下载。\n2.  设置 `HADOOP_PATH`。\n3.  在 `bin` 目录中，如屏幕所示：\n4.  启动 `spark-shell`。\n\
    5.  使用以下命令读取文件：\n    ```\n    val textFile = sc.textFile(\"README.md\")\n    ```\n\
    6.  统计行数：\n    ```\n    textFile.count()\n    ```\n7.  读取第一行：\n    ```\n    textFile.first()\n\
    \    ```\n\n关于所有命令的更深入的信息，可以参考指南：[`spark.apache.org/docs/2.1/programming.html`](https://spark.apache.org/docs/2.1/programming.html)\n\
    \n# 使用 Eclipse 实现 Spark\n\n在本节，我们将使用 `Eclipse` 实现 `Spark`。\n\n1.  下载 `Scale IDE`：[`scala-ide.org/`](http://scala-ide.org/)\n\
    2.  选择相应的操作系统，如屏幕所示：\n3.  点击 Eclipse 图标打开 Scala IDE。创建一个工作空间。\n4.  选择 `New` |\
    \ `Scala Project` 并命名为 `SparkHelloWorld`。\n5.  选择默认参数并点击 `Finish`。\n6.  在项目资源中打开项目。右键点击\
    \ `src` | `New` | `Package`。\n7.  为包提供名称。\n8.  右键点击 `src` | `New` | `Scala Object`：\n\
    9.  使用以下代码创建该对象：\n    ```scala\n    object test {\n      def main (args: Array[String])\
    \ {\n        println(\"Testing Spark Scala Application\")\n      }\n    }\n  \
    \  ```\n10. 右键点击 `Run As` | `Scala Application`：\n11. 输出可以在控制台中查看，如屏幕截图所示：\n\n"
- fmt: "\nIn this section, we will learn to implement a service using Spark:\n\n1.\
    \ Create a `New` | `Maven Project` as shown in the following screenshot:\n\n \
    \   ![](images/10.18.jpg)\n\n    **Figure 10.18:** Maven Project creation\n\n\
    2. Select the `Create a simple project` checkbox as shown in the following screenshot:\n\
    \n    ![](images/10.19.jpg)\n\n    **Figure 10.19:** Maven Project configuration\n\
    \n3. Provide a group ID and artifact ID as shown in the following screenshot:\n\
    \n    ![](images/10.20.jpg)\n\n    **Figure 10.20:** Providing Artifact ID and\
    \ Group ID\n\n4. Right-click the project and select `Configure` | `Add Scala Nature`.\n\
    \n    ![](images/10.21.jpg)\n\n    **Figure 10.21:** Add Scala Nature\n\n5. Inside\
    \ `pom.xml`, add the following dependencies:\n\n```xml\n<dependencies>\n    <!--\
    \ <dependency>\n      <groupId>com.sparkjava</groupId>\n      <artifactId>spark-core</artifactId>\n\
    \      <version>2.2</version>\n    </dependency> -->\n    <dependency>\n     \
    \ <!-- Spark dependency -->\n      <groupId>org.apache.spark</groupId>\n     \
    \ <artifactId>spark-core_2.11</artifactId>\n      <version>2.2.0</version>\n \
    \     <scope>provided</scope>\n    </dependency>\n    <dependency>\n      <groupId>com.sparkjava</groupId>\n\
    \      <artifactId>spark-kotlin</artifactId>\n      <version>1.0.0-alpha</version>\n\
    \    </dependency>\n</dependencies>\n```\n\n6. Use the following code to set up\
    \ the service `hello`:\n\n    ![](images/10.22.jpg)\n\n    **Figure 10.22:** Code\
    \ for Scale service\n\n7. Run the URL: `http://localhost:4567/hello` to test the\
    \ service:\n\n    ![](images/10.23.jpg)\n\n    **Figure 10.23:** Running the service\n\
    \nIn this section, we learnt to set up a service using Spark API.\n\n# Conclusion\n\
    \nIn this chapter we learnt the core concepts of Spark streaming. Using the Spark\
    \ shell, the method of executing commands have been described. Implementing spark\
    \ using Eclipse IDE has been seen in detail. Implementation of a service using\
    \ Spark is shown.\n\nIn the next chapter, we will learn the integration of Spark\
    \ with Kafka.\n\n# Questions\n\n1. What are batches of data called in Spark?\n\
    2. Can Spark be used for batch and real-time processing?\n3. Can Spark Streaming\
    \ be integrated with machine learning Library MLib?\n4. Can Spark be implemented\
    \ using Scala?\n5. Which function is used to set up a service in Spark?\n\n# Answers\n\
    \n1. DStreams\n2. Yes\n3. Yes\n4. Yes\n5. `get()`\n\n# CHAPTER 11: Kafka Integration\
    \ with Spark\n\n# Introduction\n\nIn this chapter, we will learn the integration\
    \ of Kafka and Spark. Kafka can be integrated in various methods with Spark streaming.\
    \ We will learn the structured streaming integration of Kafka with Spark. We will\
    \ also learn the implementation of the Kafka and Spark APIs, which support Spark\
    \ streaming to read data from Kafka streams.\n\n# Structure\n\nThe structure of\
    \ the chapter is as follows:\n\n* Kafka and Spark integration\n* Approaches of\
    \ integration of Kafka and Spark\n* Structured streaming integration of Kafka\
    \ and Spark\n* Implementation of Kafka and Spark Streaming\n\n# Objectives\n\n\
    The objectives of the chapter are:\n\n* Understanding the concepts of integration\
    \ of Apache Kafka and Spark\n* Learning the different approaches of the integration\n\
    * Learning about the structured streaming integration of Kafka\n* Understanding\
    \ the implementation of Kafka and Spark Streaming\n\n# Kafka and Spark integration\n\
    \nApache Kafka can be integrated with Spark streaming where the Spark streaming\
    \ receives the data from Kafka. There are two approaches in which the integration\
    \ can be performed:\n\n* Receiver-based approach\n* Direct approach\n\nAs shown\
    \ in the following diagram, the Kafka Stream can send the data to the Spark streaming\
    \ component. The Spark engine can perform any computation that is needed on the\
    \ data. The processed data will be stored in the database:\n\n![](images/11.1.jpg)\n\
    \n**Figure 11.1:** Kafka and Spark integration\n\nThere is also a structured streaming\
    \ integration with Kafka, where the data is read from Kafka streams and processed\
    \ by Spark Engine and written back to Kafka as shown in the following diagram:\n\
    \n![](images/11.2.jpg)\n\n**Figure 11.2:** Structured Streaming Kafka and Spark\
    \ integration\n\nKafka provides libraries and API to support the integration of\
    \ the Spark engine with its input and output stream.\n\n# Approaches for integration\n\
    \nIn this section, we will understand the two approaches, that is, the receiver-based\
    \ approach and Direct approach;\n\n* **Receiver-based approach**: This is the\
    \ initial approach where the receivers are used and implemented using Kafka API.\
    \ The data is passed to the Spark streaming.\n* **Direct approach**: This is the\
    \ new approach which do not use receivers.\n\n# Structured Streaming integration\
    \ of Kafka and Spark\n\nIn this section, we will learn how to implement the function\
    \ of reading from Kafka.\n\n### Create a Kafka Source for Batch Queries\n\nThe\
    \ following shows the subscription to one topic and when the start and end offsets\
    \ are not provided, it defaults to the earliest and latest offsets:\n\n```scala\n\
    val df = spark.read\n  .format(\"kafka\")\n  .option(\"kafka.bootstrap.servers\"\
    , \"localhost:9092\")\n  .option(\"subscribe\", \"topic1\")\n  .load()\n```\n"
