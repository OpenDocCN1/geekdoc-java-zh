    \n**Figure 3.12:** Server 2 property file: log directory\n\nTo start the two brokers,\
    \ we will use the following command:\n\n1.  Starting broker 1:\n\n    **`bin\\\
    windows\\kafka-server-start.bat config/server-broker1.properties`**\n\n    ![](images/3.13.jpg)\n\
    \n    **Figure 3.13:** Starting broker 1\n\n    Once it is successfully started,\
    \ you will see the message **`[KafkaServer id=1] started`**.\n\n2.  Starting broker\
    \ 2:\n\n    **`bin\\windows\\kafka-server-start.bat config/server-broker2.properties`**\n\
    \n    ![](images/3.14.jpg)\n\n    **Figure 3.14:** Starting broker 2\n\n    Once\
    \ it is successfully started, you will see the message **`[KafkaServer id=2] started`**.\n\
    \n3.  We can now create a topic using the following command. Here we have provided\
    \ the replication factor as 3, since we have multiple brokers:\n\n    **`bin\\\
    windows\\kafka-topics.bat --create --bootstrap-server localhost:9092 --replication-factor\
    \ 3 --partitions 1 --topic multi-broker-topic`**\n\n    ![](images/3.15.jpg)\n\
    \n    **Figure 3.15:** Creating Kafka topic\n\n4.  We can create a producer and\
    \ consumer as demonstrated in the previous examples by giving the port number\
    \ **`9092`** and the topic name to send and receive messages.\n\n5.  Using the\
    \ **`describe`** parameter, we can view how the brokers are being used. The following\
    \ output shows that the leader is 0 and replicas are 0, 2, and 1:\n\n    **`bin\\\
    windows\\kafka-topics.bat --describe --bootstrap-server localhost:9092 --topic\
    \ multi-broker-topic`**\n\n    ![](images/3.16.jpg)\n\n    **Figure 3.16:** Broker\
    \ description\n\n6.  The following illustrates the interpretation of the preceding\
    \ output shown:\n\n    | Leader | It is the partition responsible for the read\
    \ and write of the data to the other partitions of the brokers. |\n\n    | Replicas\
    \ | They are the active partitions that are available to store the data |\n\n\
    \    | Isr | It is the in sync replica, which means the replicas that are currently\
    \ active and available to process the data. The failed replicas will not be listed\
    \ here. |\n\n    **Table 3.2:** Output fields description\n\n7.  To test our fault\
    \ tolerance, we will get the process ID and kill it.\n\n    Use the following\
    \ to fetch the process ID:\n\n    **`wmic process where \"caption = 'java.exe'\
    \ and commandline like '%server-broker1.properties%'\" get processid`**\n\n  \
    \  To kill the process, use **`taskkill /pid27780 /f`**.\n\n    The following\
    \ screenshot shows the execution of the preceding command:\n\n    ![](images/3.17.jpg)\n\
    \n    **Figure 3.17:** Display the process ID\n\n    Once the process ID for the\
    \ **`jave.exe`** is found, we can use the kill command to kill the process ID:\n\
    \n    ![](images/3.17_2.jpg)\n\n    **Figure 3.17_2:** Killing the process\n\n\
    8.  Re-run the describe command:\n\n    **`bin\\windows\\kafka-topics.bat --describe\
    \ --bootstrap-server localhost:9092 --topic multi-broker-topic`**\n\n    ![](images/3.18.jpg)\n\
    \n    **Figure 3.18:** Broker description"
